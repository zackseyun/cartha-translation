  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: hi
  text: इसलिए अपनी इस दुष्टता से मन फिरा, और प्रभु से विनती कर कि शायद तेरे हृदय के इस विचार[a] के लिए तुझे क्षमा मिल जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे हृदय की इस मंशा के लिए तुझे क्षमा मिल जाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετανόησον
  choice: मन फिरा
  rationale: यह अनुवाद निर्णायक पश्चाताप और नैतिक दिशा-परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पतरस की पिछली फटकार से निकलने वाले निष्कर्ष को स्पष्ट करता है।
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: अपनी इस दुष्टता से
  rationale: ἀπό की दिशा-सूचक शक्ति और κακία के नैतिक बुराई के अर्थ, दोनों को बनाए रखता है।
- source_word: δεήθητι
  choice: विनती कर
  rationale: यह साधारण प्रार्थना की अपेक्षा आग्रहपूर्वक निवेदन करने के भाव को अधिक ठीक से व्यक्त करता है।
- source_word: τοῦ κυρίου
  choice: प्रभु से
  rationale: हिन्दी में δέομαι के साथ स्वाभाविक कारक-प्रयोग है और κύριος की पहचान को अनावश्यक रूप से सीमित नहीं करता।
- source_word: εἰ ἄρα
  choice: कि शायद
  rationale: यह क्षमा की संभावना को खुला रखता है, न उसकी गारंटी देता है और न उसे असंभव बताता है।
- source_word: ἀφεθήσεταί σοι
  choice: तुझे क्षमा किया जाए
  rationale: कर्मवाच्य रूप सम्भावित ईश्वरीय क्षमा को व्यक्त करता है और εἰ ἄρα के कारण उत्पन्न अनिश्चितता को बनाए रखता है।
- source_word: ἡ ἐπίνοια τῆς καρδίας σου
  choice: तेरे हृदय का यह विचार
  rationale: ἐπίνοια में विचार, मंशा या योजना की अर्थ-सीमा है; 'विचार' मूल की अस्पष्टता को 'मंशा' की तुलना में अधिक सुरक्षित रखता है, जबकि 'हृदय' आंतरिक नैतिक स्रोत को दर्शाता है।
theological_decisions:
- issue: क्षमा मिलने की निश्चितता
  choice: पतरस सम्भावना-सूचक भाषा में शमौन को मन फिराने और प्रार्थना करने को कहता है; परिणाम की गारंटी नहीं दी गई है।
  alternative: सच्चे पश्चाताप के बाद क्षमा को यहाँ स्पष्ट रूप से निश्चित मानना, या क्षमा को लगभग असंभव मानना।
  rationale: εἰ ἄρα जानबूझकर सावधान और अनिश्चित अभिव्यक्ति है; 'शायद' इसी तनाव को बनाए रखता है।
- issue: ἐπίνοια का नैतिक आशय
  choice: मुख्य पाठ में 'विचार' रखकर विचार, मंशा और योजना के बीच की अर्थगत खुलावट सुरक्षित रखी गई है।
  alternative: '''दुष्ट मंशा'' कहकर पद में निहित नैतिक अभिप्राय को अधिक स्पष्ट करना।'
  rationale: निकट संदर्भ उस विचार को दोषी ठहराता है, पर संज्ञा स्वयं केवल एक ही हिन्दी नैतिक श्रेणी में सीमित नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। प्रसंग में पतरस शमौन से सीधे एकवचन में बोलता है, इसलिए 'तू/तेरे/तुझे' रूप रखा गया है।
