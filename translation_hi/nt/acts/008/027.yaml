  text: καὶ ἀναστὰς ἐπορεύθη, καὶ ἰδοὺ ἀνὴρ Αἰθίοψ εὐνοῦχος δυνάστης ⸀Κανδάκης βασιλίσσης Αἰθιόπων, ὃς ἦν ἐπὶ πάσης τῆς γάζης αὐτῆς, ὃς ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: hi
  text: तब वह उठा और चल पड़ा। और देखो, इथियोपिया का एक पुरुष था, जो खोजा था[a] और इथियोपियाइयों की रानी कन्दाके[b] का एक उच्च अधिकारी था। वह उसके सारे राजकोष का प्रभारी था और उपासना करने के लिए यरूशलेम आया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “खोजा” के लिए यूनानी शब्द कुछ संदर्भों में राजदरबार के अधिकारी के अर्थ में भी आ सकता है, पर यहाँ उसका शाब्दिक अर्थ अधिक संभावित है।
    reason: lexical_alternative
  - marker: b
    text: “कन्दाके” संभवतः रानी का व्यक्तिगत नाम नहीं, बल्कि इथियोपियाई/कूशी रानियों की राजवंशीय उपाधि थी। यूनानी “इथियोपिया” प्राचीन प्रयोग में आधुनिक इथियोपिया की सीमाओं से अलग, कूश/नूबिया सहित नील के दक्षिण के क्षेत्र को भी सूचित कर सकता है।
    reason: cultural_note
