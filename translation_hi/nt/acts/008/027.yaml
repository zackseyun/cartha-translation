  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। 'और देखो' से मूल का ध्यान-सूचक बचाया गया है। 'खोजा' सामान्य पाठक के लिए अपेक्षाकृत परिचित शाब्दिक पद है, जबकि साथ का 'उच्च अधिकारी' उसके राजकीय पद को स्पष्ट करता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है।
