- source_word: ἰδοὺ
  choice: और देखो
  rationale: लूका के स्पष्ट कथात्मक ध्यान-सूचक को हटाए बिना सहज और गरिमापूर्ण हिन्दी देता है।
- source_word: ἀνὴρ Αἰθίοψ
  choice: कूश देश का एक पुरुष
  rationale: ἀνήρ के पुरुष-सूचक अर्थ को बनाए रखता है; प्राचीन Αἰθιοπία आधुनिक इथियोपिया के ठीक समान नहीं, बल्कि सामान्यतः नील नदी के ऊपरी भाग में कूश/नूबिया के क्षेत्र की ओर संकेत करती है।
- source_word: εὐνοῦχος
  choice: खोजा
  rationale: शब्द के प्राथमिक शारीरिक-सामाजिक अर्थ को मुख्य पाठ में रखता है; केवल 'दरबारी अधिकारी' कहने से यह अर्थ खो जाता, और δυνάστης पदाधिकारी होने की बात अलग से बताता है।
- source_word: δυνάστης
  choice: उच्च अधिकारी
  rationale: अधिकार और ऊँचे पद का बोध कराता है, पर उसे स्वतंत्र शासक नहीं बनाता।
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: कूशियों की रानी कन्दाके का
  rationale: बहुवचन जातिनाम को 'कूशियों' से और नाम/उपाधि को प्रचलित देवनागरी लिप्यंतरण से प्रस्तुत करता है।
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: उसके पूरे खजाने का प्रबंधक
  rationale: ἐπὶ की प्रशासनिक जिम्मेदारी और γάζα के राजकोषीय अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ
  choice: आराधना करने यरूशलेम आया था
  rationale: पूर्णभूत क्रिया की पूर्वकालिकता और भविष्यत् कृदंत के प्रयोजनार्थ को बनाए रखता है।
theological_decisions:
- issue: εὐνοῦχος को शाब्दिक शारीरिक-सामाजिक पदनाम माना जाए या सामान्य दरबारी पद
  choice: मुख्य पाठ में 'खोजा'
  alternative: '''दरबारी अधिकारी'''
  rationale: प्राथमिक शब्दार्थ और कथा में व्यक्ति की सामाजिक-शारीरिक स्थिति को सुरक्षित रखना उचित है। साथ ही δυνάστης का अनुवाद 'उच्च अधिकारी' उसके दरबारी अधिकार को स्वतंत्र रूप से व्यक्त करता है।
- issue: Αἰθίοψ/Αἰθιόπων का आधुनिक भौगोलिक नाम से अनुवाद
  choice: '''कूश देश का'' और ''कूशियों की'''
  alternative: '''इथियोपिया का'' और ''इथियोपियाई लोगों की'''
  rationale: प्राचीन यूनानी पद यहाँ आधुनिक इथियोपिया की सीमाओं से अधिकतर दक्षिणी मिस्र के परे कूश/नूबिया के राज्य की ओर संकेत करता है; इसलिए आधुनिक राष्ट्र-राज्य से संभावित भ्रम टाला गया है।
- issue: Κανδάκη को व्यक्तिगत नाम या राजवंशीय उपाधि समझना
  choice: मुख्य पाठ में 'कन्दाके' को बिना निर्णय किए लिप्यंतरित किया गया
  alternative: इसे स्पष्टतः रानी की राजवंशीय उपाधि बताना
  rationale: मूल पाठ केवल Κανδάκης देता है और स्वयं यह तय नहीं करता कि वह निजी नाम है या उपाधि; इस ऐतिहासिक संभावना को पादटिप्पणी में रखा गया है।
