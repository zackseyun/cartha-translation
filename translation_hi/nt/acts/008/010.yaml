  text: ᾧ προσεῖχον ⸀πάντες ἀπὸ μικροῦ ἕως μεγάλου λέγοντες· Οὗτός ἐστιν ἡ Δύναμις τοῦ θεοῦ ἡ ⸀καλουμένη Μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: hi
  text: छोटे से लेकर बड़े तक, वे सब उसकी ओर ध्यान देते थे[a] और कहते थे, “यह व्यक्ति परमेश्वर की वह शक्ति है जिसे ‘महान’ कहा जाता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे सब उसकी ओर ध्यान लगाए रहते थे।”
    reason: προσέχω यहाँ शमौन व्यक्ति की ओर निकट ध्यान देने का भाव व्यक्त करता है; इसे विशेष रूप से उसकी बातों को सुनने तक सीमित नहीं करना चाहिए।
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: उसकी बात पर ध्यान देते थे
  rationale: προσέχω यहाँ किसी व्यक्ति की ओर ध्यान लगाने और उसकी बात मानकर सुनने का भाव रखता है। हिंदी में ‘उसकी बात पर ध्यान देते थे’ स्वाभाविक है और निष्ठा या भक्ति का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: πάντες
  choice: वे सब
  rationale: बहुवचन समुदाय की समग्रता को स्पष्ट करता है।
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: छोटे से बड़े तक
  rationale: यह पूरे सामाजिक या आयु-विस्तार को समेटने वाला यूनानी मुहावरा है; हिंदी का यह प्रचलित युग्म उसकी व्यापकता बनाए रखता है।
- source_word: λέγοντες
  choice: और कहते थे
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ चल रही क्रिया बताता है; हिंदी में संयुक्त अपूर्ण भूतकाल स्वाभाविक है।
- source_word: Οὗτός
  choice: यह व्यक्ति
  rationale: संकेतवाचक सर्वनाम शमौन की ओर संकेत करता है। ‘यह व्यक्ति’ स्पष्ट और सम्मान-निरपेक्ष आधुनिक हिंदी है।
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: परमेश्वर की वह शक्ति
  rationale: यह पद निश्चित और उपाधि-सदृश है। ‘वह शक्ति’ आगे आने वाले संबंधवाचक वाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: ἡ καλουμένη Μεγάλη
  choice: जो ‘महान’ कहलाती है
  rationale: καλουμένη नाम या पदवी दिए जाने का निष्क्रिय भाव रखता है। उद्धरण-चिह्न ‘महान’ को कथित पदवी के रूप में पहचानने में सहायता करते हैं।
- source_word: Μεγάλη
  choice: महान
  rationale: स्त्रीलिंग विशेषण δύναμις से मेल खाता है और यहाँ पदवी के रूप में प्रयुक्त है; हिंदी में शक्ति के साथ ‘महान’ का रूप अपरिवर्तित रहता है।
theological_decisions:
- issue: भीड़ के कथन को औपचारिक ईश्वरीय उपाधि माना जाए या शमौन के विषय में वर्णनात्मक दावा
  choice: 'भीड़ का दावा सीधे उद्धृत किया गया है: ‘यह व्यक्ति परमेश्वर की वह शक्ति है जो “महान” कहलाती है।’'
  alternative: ‘यह परमेश्वर की महान शक्ति है’ अथवा ‘यह वही है जिसे परमेश्वर की महान शक्ति कहा जाता है।’
  rationale: यूनानी पाठ भीड़ द्वारा शमौन के बारे में की गई पहचान दर्ज करता है; कथावाचक स्वयं उसकी पुष्टि नहीं करता। चुना हुआ रूप इस तनाव को बनाए रखता है और Μεγάλη को कथित नाम/उपाधि के रूप में सुनने देता है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सहज किंतु गरिमापूर्ण है। ‘छोटे से बड़े तक’ परिचित मुहावरा है। मुख्य पाठ में [a] चिह्न उपस्थित है और वैकल्पिक अनुवाद वास्तविक यूनानी अर्थ-सीमा को सुरक्षित रखता है।
