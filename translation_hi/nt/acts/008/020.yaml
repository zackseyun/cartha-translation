source:
  edition: SBLGNT
  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: hi
  text: पर पतरस ने उससे कहा, “तेरी चाँदी तेरे साथ नाश हो जाए[a], क्योंकि तूने समझा कि तू परमेश्वर का वरदान धन से प्राप्त कर सकता है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, ‘तेरा धन तेरे साथ विनाश में जाए।’ यूनानी में यहाँ ‘चाँदी’ है, जो धन के लिए प्रचलित अभिव्यक्ति थी।
    reason: lexical_alternative
  - marker: b
    text: या ‘हासिल कर सकता है’ अथवा ‘खरीद सकता है।’ आशय यह है कि शमौन ने परमेश्वर के वरदान को ऐसी वस्तु समझा जिसे वह भुगतान करके पा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριόν
  choice: चाँदी
  rationale: शब्द का मूल अर्थ ‘चाँदी’ या ‘चाँदी का पैसा’ है। ‘चाँदी’ यूनानी की ठोस अभिव्यक्ति और अगले वाक्यांश ‘धन से’ के साथ उसका अलंकारिक प्रभाव बनाए रखती है।
- source_word: σὺν σοὶ
  choice: तेरे साथ
  rationale: यह पूर्वसर्ग और सर्वनाम का सीधा, स्वाभाविक अनुवाद है और पतरस के कथन में व्यक्ति तथा उसकी चाँदी को एक साथ जोड़ता है।
- source_word: εἴη εἰς ἀπώλειαν
  choice: नाश हो जाए
  rationale: विधिलिंगात्मक εἴη यहाँ कठोर इच्छा अथवा धिक्कार व्यक्त करता है। ‘नाश हो जाए’ उसकी गंभीरता बनाए रखता है, पर अंतिम दंड का कोई अधिक विशिष्ट धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
- source_word: δωρεὰν
  choice: वरदान
  rationale: ‘वरदान’ परमेश्वर से मिलने वाली देन के लिए स्वाभाविक और गरिमापूर्ण हिन्दी है; धन से पाने के विरोध के कारण उसकी नि:शुल्क प्रकृति संदर्भ से स्पष्ट है।
- source_word: ἐνόμισας
  choice: तूने समझा
  rationale: यह क्रिया सोचने, मानने या समझने को व्यक्त करती है। ‘समझा’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: διὰ χρημάτων
  choice: धन से
  rationale: संबंधकारक के साथ διά साधन बताता है। ‘धन से’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: κτᾶσθαι
  choice: प्राप्त किया जा सकता है
  rationale: क्रिया का अर्थ हासिल करना या प्राप्त करना है। यह अनुवाद धन देकर पाने की धारणा स्पष्ट करता है, लेकिन क्रिया को अनावश्यक रूप से केवल ‘खरीदना’ तक सीमित नहीं करता।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले पद में शमौन के प्रस्ताव के विपरीत पतरस की प्रतिक्रिया को चिह्नित करता है। ‘पर’ आधुनिक हिन्दी में स्वाभाविक विरोधसूचक है।
theological_decisions:
- issue: पतरस के कथन का बल और शमौन के साथ उसकी चाँदी का नाश
  choice: इच्छा/धिक्कार के रूप में ‘तेरी चाँदी तेरे साथ नाश हो जाए’
  alternative: नाश की सीधी भविष्यवाणी, अथवा अंतिम दंड को स्पष्ट करने वाला अधिक कठोर कथन
  rationale: εἴη का optative रूप इच्छा या धिक्कार को व्यक्त करता है, केवल तथ्यात्मक भविष्यवाणी को नहीं। ‘नाश’ ἀπώλεια की गंभीरता को सुरक्षित रखता है, पर यह तय नहीं करता कि यहाँ अनिवार्य रूप से अंतिम और शाश्वत दंड ही अभिप्रेत है।
translation_notes:
  register: आधुनिक मानक हिन्दी; पतरस का संबोधन जानबूझकर एकवचन अनौपचारिक ‘तू/तेरी’ में रखा गया है, जो प्रसंग के तीखे प्रत्यक्ष तिरस्कार को व्यक्त करता है। भाषा गरिमापूर्ण है, किंतु मूल कथन की कठोरता को नरम नहीं करती।
