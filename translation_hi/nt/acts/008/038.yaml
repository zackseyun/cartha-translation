base_translation:
  language: en
  yaml_path: translation/nt/acts/008/038.yaml
  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: hi
  text: उसने रथ रोकने का आदेश दिया, और फिलिप्पुस और खोजा दोनों पानी में उतर गए[a], और फिलिप्पुस ने उसे बपतिस्मा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पानी की ओर”; किंतु यूनानी पूर्वसर्ग सामान्यतः पानी के भीतर की ओर गति का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: आदेश दिया
  rationale: κέλευω में आदेश देने का भाव है। ‘आदेश दिया’ आधुनिक मानक हिन्दी में स्वाभाविक है और कथन की अधिकारपूर्णता बनाए रखता है।
- source_word: στῆναι τὸ ἅρμα
  choice: रथ रोकने
  rationale: रथ के संदर्भ में στῆναι का आशय उसे ठहराना या रोकना है; ‘रथ रोकने’ हिन्दी में सहज और सटीक है।
- source_word: ἅρμα
  choice: रथ
  rationale: ἅρμα का सीधा और परंपरागत हिन्दी रूप ‘रथ’ है; यहाँ ‘गाड़ी’ कहना संभव होते हुए भी मूल शब्द की ऐतिहासिक छवि को कम स्पष्ट करता।
- source_word: κατέβησαν
  choice: उतर गए
  rationale: καταβαίνω नीचे जाने या उतरने को व्यक्त करता है। पानी के प्रसंग में ‘उतर गए’ स्वाभाविक हिन्दी है।
- source_word: ἀμφότεροι
  choice: दोनों
  rationale: ἀμφότεροι स्पष्ट करता है कि दोनों व्यक्ति साथ इस क्रिया में सम्मिलित थे।
- source_word: εἰς τὸ ὕδωρ
  choice: पानी में
  rationale: εἰς सामान्यतः भीतर की ओर गति दर्शाता है। ‘पानी में उतर गए’ इस दिशात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना बपतिस्मे की विधि पर अतिरिक्त निष्कर्ष थोपे।
- source_word: ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: फिलिप्पुस और खोजा
  rationale: τε ... καί दोनों व्यक्तियों—फिलिप्पुस और खोजे—को स्पष्ट रूप से पहचानता है; साथ रखा ‘दोनों’ मूल के जोर को बनाए रखता है।
- source_word: εὐνοῦχος
  choice: खोजा
  rationale: εὐνοῦχος का सीधा हिन्दी अर्थ ‘खोजा’ है। केवल ‘अधिकारी’ कहना मूल की संभावित शारीरिक-सामाजिक पहचान को मिटा देता।
- source_word: ἐβάπτισεν
  choice: बपतिस्मा दिया
  rationale: ‘बपतिस्मा दिया’ βαπτίζω का स्थापित और संप्रदाय-निरपेक्ष हिन्दी अनुवाद है; ‘डुबोया’ विधि संबंधी प्रश्न को मूल से अधिक निश्चित कर देता।
- source_word: αὐτόν
  choice: उसे
  rationale: सर्वनाम का संकेत खोजे की ओर है, जो बपतिस्मे की क्रिया का कर्म है। स्पष्टता के लिए कर्ता ‘फिलिप्पुस’ दोबारा व्यक्त किया गया है।
theological_decisions:
- issue: क्या अनुवाद बपतिस्मे की विधि को निश्चित करे
  choice: दोनों के ‘पानी में उतरने’ और फिलिप्पुस द्वारा ‘बपतिस्मा देने’ को यथावत व्यक्त किया गया है।
  alternative: βαπτίζω को ‘डुबोया’ कहना, या εἰς τὸ ὕδωρ को केवल ‘पानी तक’ कहकर उसकी दिशात्मक शक्ति को नरम करना।
  rationale: यूनानी पाठ दोनों व्यक्तियों के पानी में उतरने और फिर बपतिस्मा दिए जाने की बात कहता है, पर अपने आप बपतिस्मे की पूरी विधि का वर्णन नहीं करता। इसलिए अनुवाद मूल के स्थानगत संकेत को बचाता है, किंतु किसी संप्रदायगत निष्कर्ष को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फिलिप्पुस’ प्रचलित बाइबलीय नामरूप है और ‘खोजा’ मूल पद की विशिष्ट पहचान को सुरक्षित रखता है। हिन्दी में कर्ता की अस्पष्टता से बचने के लिए अंतिम उपवाक्य में ‘फिलिप्पुस’ दोहराया गया है।
