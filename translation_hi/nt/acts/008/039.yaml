  text: ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, πνεῦμα κυρίου ἥρπασεν τὸν Φίλιππον, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος, ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/039.yaml
  text: And when they came up out of the water[a], the Spirit of the Lord carried Philip away, and the eunuch saw him no longer, for he went on his way rejoicing.
translation:
  language: hi
  text: जब वे पानी में से बाहर आए, तो प्रभु की आत्मा फिलिप्पुस को उठा ले गई[a], और खोजे ने उसे फिर नहीं देखा, क्योंकि वह आनन्दित होकर अपने मार्ग पर आगे बढ़ता गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिलिप्पुस को झपटकर ले गई।” यूनानी क्रिया अचानक और बलपूर्वक हटा ले जाने पर जोर दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: पानी में से बाहर आए
  rationale: यह वाक्यांश पानी के भीतर से बाहर और ऊपर आने की स्थानिक गति व्यक्त करता है, पर बपतिस्मे की विधि के विषय में आवश्यकता से अधिक निष्कर्ष नहीं जोड़ता।
- source_word: πνεῦμα κυρίου
  choice: प्रभु का आत्मा
  rationale: लूका–प्रेरितों के काम में यह अभिव्यक्ति स्वाभाविक रूप से परमेश्वर के आत्मा की व्यक्तिगत और दैवी सक्रियता को दर्शाती है।
- source_word: ἥρπασεν
  choice: उठा ले गया
  rationale: ἁρπάζω अचानक और सामर्थ्यपूर्ण ढंग से हटा ले जाने का भाव रखता है। मुख्य पाठ में यह चयन स्वाभाविक हिन्दी में दैवी रूप से ले जाए जाने को व्यक्त करता है; अधिक प्रबल विकल्प पादटिप्पणी में रखा गया है।
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: इसके बाद खोजे ने उसे फिर नहीं देखा
  rationale: यह अनुवाद स्पष्ट करता है कि उस क्षण के बाद खोजे ने फिलिप्पुस को दोबारा नहीं देखा।
- source_word: ὁ εὐνοῦχος
  choice: खोजा
  rationale: मूल यूनानी संज्ञा स्पष्ट है; ‘खोजा’ आधुनिक मानक हिन्दी में प्रत्यक्ष और कथानक से संगत पद है।
- source_word: ἐπορεύετο τὴν ὁδὸν αὐτοῦ
  choice: अपने मार्ग पर आगे बढ़ता गया
  rationale: अपूर्णकालिक क्रिया यात्रा के जारी रहने को दिखाती है; यह हिन्दी अभिव्यक्ति उसी निरंतरता को स्वाभाविक रूप से प्रकट करती है।
- source_word: χαίρων
  choice: आनन्दित होकर
  rationale: वर्तमान कृदन्त उस मनोदशा को बताता है जिसमें वह अपनी यात्रा जारी रखता है और क्रियात्मक आनन्द का भाव बनाए रखता है।
theological_decisions:
- issue: πνεῦμα κυρίου को पवित्र आत्मा की व्यक्तिगत दैवी सक्रियता माना जाए या प्रभु की ओर से आई किसी अवैयक्तिक शक्ति को
  choice: ‘प्रभु का आत्मा’—व्यक्तिगत दैवी कर्ता
  alternative: प्रभु की ओर से कोई आत्मा या अवैयक्तिक दैवी शक्ति
  rationale: लूका–प्रेरितों के काम में इस पदबंध का सामान्य प्रयोग परमेश्वर के आत्मा के लिए है, जो स्वयं सक्रिय होकर कार्य करता है; अनुवाद इससे आगे कोई व्याख्यात्मक उपाधि नहीं जोड़ता।
- issue: ἥρπασεν में अचानक और चमत्कारिक रूप से हटाए जाने का भाव कितना प्रत्यक्ष किया जाए
  choice: मुख्य पाठ में ‘उठा ले गया’
  alternative: ‘झपटकर ले गया’ या ‘अचानक उठा ले गया’
  rationale: संदर्भ दैवी हस्तक्षेप को स्पष्ट करता है। चुना हुआ रूप घटना के अलौकिक स्वरूप को बनाए रखते हुए गरिमापूर्ण और सहज हिन्दी देता है; यूनानी क्रिया की अधिक तीव्र छाया पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘पानी में से बाहर आए’ मूल की स्थानिक स्पष्टता रखता है; ‘आगे बढ़ता गया’ अपूर्णकाल की निरंतरता व्यक्त करता है। ‘फिलिप्पुस’ और ‘खोजा’ पूर्ववर्ती कथानक से नाम और पात्र की पहचान बनाए रखते हैं।
