id: ACT.8.24
reference: Acts 8:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: hi
  text: पर शमौन ने उत्तर दिया, “आप ही मेरे लिए प्रभु से प्रार्थना कीजिए, ताकि आपने जो बातें कही हैं, उनमें से कोई भी मुझ पर न आए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν
  choice: पर शमौन ने उत्तर दिया
  rationale: ἀποκριθείς और εἶπεν मिलकर प्रत्युत्तर में कही गई बात का स्वाभाविक यूनानी परिचय देते हैं। हिंदी में ‘उत्तर दिया’ इस भाव को बिना अनावश्यक दोहराव के व्यक्त करता है; δέ प्रसंग में पतरस की फटकार के बाद हल्का विरोधात्मक मोड़ दिखाता है, इसलिए ‘पर’ चुना गया।
- source_word: Δεήθητε
  choice: प्रार्थना कीजिए
  rationale: यह बहुवचन आज्ञार्थक रूप निवेदन अथवा प्रार्थना करने को कहता है। प्रसंग में प्रभु से शमौन के पक्ष में विनती अभिप्रेत है; ‘प्रार्थना कीजिए’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: ὑμεῖς
  choice: आप ही
  rationale: 'स्पष्ट सर्वनाम पर बल है: शमौन उन्हीं से अपने लिए प्रार्थना करने को कहता है। आदरसूचक बहुवचन ‘आप’ और बलसूचक ‘ही’ इस जोर को स्वाभाविक हिंदी में रखते हैं।'
- source_word: ὑπὲρ ἐμοῦ
  choice: मेरे लिए
  rationale: ὑπέρ संबंधी की ओर से मध्यस्थ प्रार्थना का भाव देता है। ‘मेरे लिए’ सहज हिंदी में पर्याप्त रूप से वही अर्थ व्यक्त करता है।
- source_word: πρὸς τὸν κύριον
  choice: प्रभु से
  rationale: प्रार्थना की दिशा या संबोधन प्रभु की ओर है। हिंदी में ‘प्रभु से प्रार्थना करना’ स्वाभाविक प्रयोग है और यूनानी संबंध को सही ढंग से व्यक्त करता है।
- source_word: ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ
  choice: ताकि ... कोई भी मुझ पर न आए
  rationale: ὅπως अपेक्षित परिणाम प्रस्तुत करता है और ἐπέρχομαι ἐπί विपत्ति या न्याय के किसी पर आ पड़ने का गंभीर भाव रख सकता है। ‘मुझ पर न आए’ इस रूपक और गंभीरता को बचाता है।
- source_word: ὧν εἰρήκατε
  choice: आपने जो बातें कही हैं, उनमें से
  rationale: संबंधवाचक संबंध का अर्थ ‘आपके द्वारा कही गई बातों में से कुछ भी नहीं’ है। यह हिंदी विन्यास संबंध को स्पष्ट रखता है और εἰρήκατε की वर्तमान-प्रासंगिक चेतावनी को सहज भूतकाल में व्यक्त करता है।
theological_decisions:
- issue: τὸν κύριον का संदर्भ
  choice: प्रभु
  alternative: परमेश्वर; प्रभु यीशु
  rationale: यूनानी पाठ केवल ‘प्रभु’ कहता है। यहाँ उसे विशेष रूप से परमेश्वर या यीशु ठहराना स्रोत से अधिक निश्चितता जोड़ देगा, इसलिए मूल की संदर्भगत खुली स्थिति बनाए रखी गई है।
- issue: शमौन की प्रतिक्रिया की आत्मिक गुणवत्ता
  choice: केवल उसके अनुरोध का अनुवाद, बिना पश्चाताप का दावा जोड़े
  alternative: इसे स्पष्ट पश्चाताप या केवल दंड-भय के रूप में व्याख्यायित करना
  rationale: वचन बताता है कि शमौन दूसरों से अपने लिए प्रार्थना करने को कहता है, पर उसके आंतरिक भाव की अंतिम व्याख्या नहीं देता। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, आदरसूचक और गरिमापूर्ण रखी गई है। ‘आप ही’ बहुवचन ὑμεῖς के बल को दर्शाता है; ‘मुझ पर न आए’ न्याय या विपत्ति के आने वाली मूल छवि को सुरक्षित रखता है। किसी पादटिप्पणी की आवश्यकता नहीं है, क्योंकि पद की संबंधवाचक रचना मुख्य पाठ में स्वाभाविक और स्पष्ट रूप से व्यक्त हो जाती है।
