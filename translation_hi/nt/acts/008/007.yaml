  text: ⸀πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα βοῶντα φωνῇ μεγάλῃ ⸀ἐξήρχοντο, πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ ἐθεραπεύθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: hi
  text: क्योंकि जिन बहुत-से लोगों में अशुद्ध आत्माएँ थीं, उनमें से वे ऊँचे स्वर से चिल्लाती हुई निकल गईं[a]; और बहुत-से लकवाग्रस्त और बहुत-से लँगड़े लोग चंगे किए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘चिल्लाती हुई’ नपुंसकलिंग बहुवचन कृदंत है और सबसे स्वाभाविक रूप से ‘अशुद्ध आत्माओं’ का वर्णन करता है, न कि उनसे ग्रस्त लोगों का।
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων
  choice: क्योंकि ... से ग्रस्त बहुत-से लोगों में से
  rationale: γάρ का व्याख्यात्मक संबंध ‘क्योंकि’ से रखा गया है। τῶν ἐχόντων को स्वाभाविक हिन्दी में उन लोगों के रूप में व्यक्त किया गया है जिन पर अशुद्ध आत्माओं का प्रभाव था।
- source_word: πνεύματα ἀκάθαρτα
  choice: अशुद्ध आत्माएँ
  rationale: यह लूका-प्रेरितों के काम में दुष्ट आत्मिक सत्ताओं के लिए प्रचलित और प्रसंगानुकूल हिन्दी पद है।
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से चिल्लाती हुई
  rationale: नपुंसकलिंग बहुवचन कृदंत βοῶντα का स्वाभाविक संबंध πνεύματα ἀκάθαρτα से है; हिन्दी रूप क्रिया और उसकी तीव्र ध्वनि दोनों को बनाए रखता है।
- source_word: ἐξήρχοντο
  choice: निकल गईं
  rationale: अपूर्ण भूतकाल को हिन्दी कथानक में स्वाभाविक पूर्ण भूत रूप दिया गया है; स्त्रीलिंग बहुवचन सर्वनाम-संबंध ‘आत्माएँ’ को स्पष्ट करता है।
- source_word: παραλελυμένοι
  choice: लकवाग्रस्त
  rationale: यह पूर्ण निष्क्रिय कृदंत से व्यक्त बनी हुई शारीरिक दशा को संक्षिप्त और वर्तमान हिन्दी में बताता है।
- source_word: χωλοὶ
  choice: लँगड़े लोग
  rationale: चलने में असमर्थता या कठिनाई वाले लोगों के लिए स्रोत के अर्थ के निकट, सामान्य हिन्दी अभिव्यक्ति है।
- source_word: ἐθεραπεύθησαν
  choice: चंगे किए गए
  rationale: निष्क्रिय वाच्य को बनाए रखते हुए चंगाई की घटना व्यक्त की गई है, बिना इस उपवाक्य में कर्ता जोड़े।
theological_decisions:
- issue: चिल्लाने और निकलने वाला कर्ता
  choice: अशुद्ध आत्माएँ ऊँचे स्वर से चिल्लाती हुई लोगों में से निकलीं।
  alternative: ग्रस्त लोग चिल्लाए, जबकि आत्माएँ उनमें से निकलीं।
  rationale: βοῶντα नपुंसकलिंग बहुवचन है और πνεύματα ἀκάθαρτα से सीधे मेल खाता है, इसलिए चिल्लाने वाली आत्माएँ ही सबसे स्वाभाविक अर्थ है। फिर भी यूनानी वाक्य-विन्यास में आरंभिक πολλοὶ के कारण कुछ असहजता है, जिसे पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी अपनाई गई है। ‘चंगे किए गए’ बाइबलीय प्रयोग से परिचित है और यूनानी निष्क्रिय वाच्य को सुरक्षित रखता है। मुख्य वाक्य में आत्माओं को दोबारा स्पष्ट रूप से रखा गया है ताकि हिन्दी में कर्ता संदिग्ध न हो, जबकि स्रोत की वाक्यगत असहजता पादटिप्पणी में बताई गई है।
