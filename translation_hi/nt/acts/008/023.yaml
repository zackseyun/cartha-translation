  text: εἰς γὰρ χολὴν πικρίας καὶ σύνδεσμον ἀδικίας ὁρῶ σε ὄντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: hi
  text: क्योंकि मैं देखता हूँ कि तुम कड़वाहट के पित्त[a] और अधर्म के बंधन[b] में हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कड़वाहट का पित्त” विषैली कड़वाहट का एक सजीव रूपक है; संभवतः व्यवस्थाविवरण 29:18 के यूनानी अनुवाद की भाषा की प्रतिध्वनि है।
    reason: cross_reference
  - marker: b
    text: या, “अन्याय की जंजीर” अथवा “दुष्टता की बेड़ी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς
  choice: में
  rationale: ὁρῶ σε ὄντα के साथ यह शमौन की वर्तमान दशा या अवस्था को व्यक्त करता है; हिन्दी में “में हो” इस भाव को स्वाभाविक रूप से दर्शाता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पतरस की पिछली बात का कारण बताता है और यूनानी संयोजक का स्पष्ट संबंध बनाए रखता है।
- source_word: χολὴν πικρίας
  choice: कड़वाहट के विष
  rationale: χολή का मूल अर्थ पित्त है, पर यह विषैले या घातक पदार्थ की सजीव छवि भी रखता है। “कड़वाहट के विष” आधुनिक हिन्दी में समझने योग्य रहते हुए रूपक की तीव्रता को बचाता है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: σύνδεσμον ἀδικίας
  choice: अधर्म के बंधन
  rationale: σύνδεσμος उस वस्तु या दशा को दर्शाता है जो बाँधती है, और ἀδικία यहाँ नैतिक बुराई या अधर्म को सूचित करता है। “बंधन” व्यक्तिगत नैतिक पराधीनता की रूपकात्मक छवि बनाए रखता है।
- source_word: ὁρῶ
  choice: मैं देखता हूँ
  rationale: यह प्रत्यक्ष देखने के साथ पहचानने या भाँपने का भाव भी दे सकता है। “मैं देखता हूँ” यूनानी के निकट और हिन्दी में स्वाभाविक है।
- source_word: σε ὄντα
  choice: कि तुम … में हो
  rationale: ὁρῶ के बाद कर्मकारक और कृदन्त की रचना को हिन्दी में आशयवाचक उपवाक्य के रूप में सहजता से व्यक्त किया गया है।
theological_decisions:
- issue: शमौन की नैतिक और आत्मिक दशा का रूपकात्मक वर्णन
  choice: 'दोनों वाक्यांशों को वर्तमान दशा बताने वाले रूपकों के रूप में रखा गया है: “कड़वाहट के विष” और “अधर्म के बंधन।”'
  alternative: “तुम जहरीली कड़वाहट से भरे और पाप के दास हो” जैसे अधिक व्याख्यात्मक रूप में अनुवाद करना।
  rationale: यूनानी पाठ सघन रूपकों का उपयोग करता है और किसी विस्तृत धर्मवैज्ञानिक निष्कर्ष को स्पष्ट नहीं करता। रूपकों को बनाए रखने से कथन की कठोरता और अर्थगत तनाव सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। “विष” सामान्य पाठक के लिए “पित्त” की विषैली रूपकात्मक शक्ति को संप्रेषित करता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
