  yaml_path: translation/nt/acts/008/031.yaml
  text: And he said[a], “How could I[b], unless someone guides me?” Then he urged Philip to come up and sit with him.
translation:
  language: hi
  text: उसने कहा, “यदि कोई मेरा मार्गदर्शन न करे[a], तो मैं भला कैसे कर पाऊँगा?” तब उसने फिलिप्पुस से आग्रह किया[b] कि वह ऊपर चढ़ आए और उसके साथ बैठे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी अगुवाई न करे।” यूनानी क्रिया शाब्दिक रूप से मार्ग दिखाने और समझने में दिशा देने—दोनों के लिए प्रयुक्त हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “फिलिप्पुस को बुलाया।” यहाँ प्रयुक्त क्रिया गंभीर अनुरोध या निमंत्रण का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς γὰρ ἂν δυναίμην
  choice: तो मैं भला कैसे समझ सकता हूँ
  rationale: ἄν के साथ optative संभाव्यता और शर्त के बिना असमर्थता व्यक्त करता है। प्रसंग में सामर्थ्य का आशय पवित्रशास्त्र को समझने से है; ‘भला कैसे’ प्रश्न की स्वाभाविक प्रबलता को व्यक्त करता है।
- source_word: ἐὰν μή τις ὁδηγήσει με
  choice: यदि कोई मेरा मार्गदर्शन न करे
  rationale: ὁδηγέω का मूल अर्थ मार्ग दिखाना या अगुवाई करना है और यहाँ समझने में दिशा देने का भाव भी है। ‘मार्गदर्शन’ दोनों पहलुओं को बनाए रखता है, जबकि ‘समझाए’ अर्थ को अधिक संकीर्ण कर देता।
- source_word: παρεκάλεσέν
  choice: आग्रह किया
  rationale: παρακαλέω यहाँ विनम्र किंतु earnest अनुरोध बताता है। ‘आग्रह किया’ साधारण ‘कहा’ या ‘पूछा’ से अधिक बल रखता है, पर ‘विनती की’ जितना तीव्र नहीं है।
- source_word: τε
  choice: तब
  rationale: τε दोनों घटनाओं को हल्के ढंग से जोड़ता है। ‘तब’ हिन्दी में कथानक की स्वाभाविक प्रगति दिखाता है।
- source_word: ἀναβάντα
  choice: ऊपर चढ़ आए
  rationale: ἀναβαίνω के ऊपर चढ़ने के स्थानिक बिंब को सुरक्षित रखा गया है। ‘रथ में चढ़े’ प्रसंगानुकूल होता, पर इस पद के यूनानी पाठ में रथ स्पष्ट रूप से नहीं दोहराया गया है।
- source_word: καθίσαι σὺν αὐτῷ
  choice: उसके साथ बैठे
  rationale: σύν के साथ καθίζω का सीधा और स्वाभाविक अर्थ ‘साथ बैठना’ है; ‘पास बैठे’ सम्भव है, पर अधिक व्याख्यात्मक है।
- source_word: Φίλιππον
  choice: फिलिप्पुस
  rationale: यूनानी नाम Φίλιππος का हिन्दी बाइबलीय परंपरा में पहचाना जाने वाला लिप्यंतरण ‘फिलिप्पुस’ है।
