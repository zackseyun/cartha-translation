source:
  edition: SBLGNT
  text: ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ ⸀περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, ἐβαπτίζοντο ἄνδρες τε καὶ γυναῖκες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: hi
  text: पर जब उन्होंने फिलिप्पुस की बात पर विश्वास किया, जो परमेश्वर के राज्य और यीशु मसीह के नाम के विषय में शुभ समाचार सुना रहा था, तो पुरुष और स्त्रियाँ दोनों बपतिस्मा ले रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε δὲ
  choice: पर जब
  rationale: ὅτε समयसूचक उपवाक्य आरम्भ करता है और δέ कथा में हल्का विरोध अथवा नया मोड़ दिखाता है; ‘पर जब’ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: उन्होंने फिलिप्पुस की बात पर विश्वास किया
  rationale: दत्तिव के साथ πιστεύω यहाँ फिलिप्पुस को विश्वसनीय संदेशवाहक मानने का भाव देता है, न कि उस पर उद्धारकारी विश्वास रखने का। हिन्दी में केवल ‘फिलिप्पुस पर विश्वास किया’ भ्रामक हो सकता है, इसलिए ‘उसकी बात पर’ अर्थ स्पष्ट करता है।
- source_word: εὐαγγελιζομένῳ
  choice: शुभ समाचार सुना रहा था
  rationale: वर्तमान कृदन्त फिलिप्पुस की उस समय जारी घोषणा को दर्शाता है; यह रूप क्रिया के शुभ-संदेश संबंधी अर्थ और उसके अपूर्ण पक्ष दोनों को सहज हिन्दी में रखता है।
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: परमेश्वर के राज्य और यीशु मसीह के नाम के विषय में
  rationale: περί विषयवस्तु बताता है। ‘परमेश्वर का राज्य’ प्रचलित और पारदर्शी पद है; ‘नाम’ को बनाए रखने से व्यक्ति, पहचान और अधिकार से जुड़ी मूल अभिव्यक्ति अनावश्यक रूप से सीमित नहीं होती।
- source_word: ἐβαπτίζοντο
  choice: बपतिस्मा लेने लगे
  rationale: अपूर्णकालीन कर्मवाच्य अनेक लोगों के क्रमशः बपतिस्मा पाने की जारी प्रक्रिया दिखाता है। हिन्दी का ‘लेने लगे’ इस पहलू को स्वाभाविक रूप से व्यक्त करता है, यद्यपि हिन्दी की रूढ़ अभिव्यक्ति व्याकरणतः सक्रिय है।
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: पुरुष और स्त्रियाँ दोनों
  rationale: τε ... καὶ दोनों समूहों को स्पष्ट रूप से सम्मिलित करता है; यह हिन्दी में सहज और मूल के अनुरूप है।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστοῦ का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीष्ट / यीशु जो मसीहा है
  rationale: Χριστός यहाँ उपाधि का भाव रखता है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘मसीह’ इस अभिषिक्त-राजा संबंधी उपाधि को स्वाभाविक और सम्मानित रूप से व्यक्त करता है; इसे केवल उपनाम की तरह नहीं समझाया गया।
- issue: τοῦ ὀνόματος का अर्थ
  choice: नाम
  alternative: अधिकार / यीशु मसीह के विषय में
  rationale: मूल का ‘नाम’ व्यक्ति, उसकी प्रकट पहचान और अधिकार—इन सबकी ओर संकेत कर सकता है। किसी एक अर्थ में सीमित करने के बजाय वास्तविक अर्थ-विस्तार सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण है। ‘फिलिप्पुस’ और ‘बपतिस्मा’ परिचित बाइबलीय रूप हैं। वाक्य ने यूनानी अपूर्णकाल की जारी/क्रमिक क्रिया को हिन्दी में यथासंभव स्वाभाविक रखा है।
