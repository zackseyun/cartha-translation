  text: तब आत्मा ने फिलिप्पुस से कहा, “इस रथ के पास जाओ और इसके साथ लगे रहो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: कहा
  rationale: प्रत्यक्ष कथन के साथ आख्यान में λέγω के अओरिस्ट का स्वाभाविक हिन्दी रूप ‘कहा’ है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ विरोध नहीं, बल्कि घटनाक्रम को आगे बढ़ाता है; ‘तब’ उस क्रम को सहज हिन्दी में व्यक्त करता है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: प्रेरितों के काम में ऐसे ईश्वरीय मार्गदर्शन के प्रसंग में संकेत पवित्र आत्मा की ओर है, पर यूनानी पाठ में ἅγιον नहीं है; इसलिए विस्तार किए बिना ‘आत्मा’ रखा गया है।
- source_word: τῷ Φιλίππῳ
  choice: फिलिप्पुस से
  rationale: कहने की क्रिया के साथ यूनानी संप्रदान कारक का स्वाभाविक हिन्दी प्रयोग ‘से’ है; नाम का प्रचलित बाइबलीय लिप्यंतरण ‘फिलिप्पुस’ रखा गया है।
- source_word: Πρόσελθε
  choice: पास जाओ
  rationale: आज्ञार्थक क्रिया रथ की ओर बढ़कर उसके निकट जाने को कहती है; ‘पास जाओ’ आधुनिक हिन्दी में गति और निकटता दोनों स्पष्ट करती है।
- source_word: κολλήθητι
  choice: साथ लगे रहो
  rationale: κολλάομαι निकट जुड़ने या साथ बने रहने का भाव देता है। इस गतिशील प्रसंग में ‘साथ लगे रहो’ रथ के पास पहुँचकर उसके साथ चलते रहने की सम्भावित व्यंजना को सहज रूप में बनाए रखता है।
- source_word: τῷ ἅρματι τούτῳ
  choice: इस रथ के साथ
  rationale: ἅρμα के लिए ‘रथ’ मानक और प्रसंगानुकूल है; τούτῳ की निकटसूचकता ‘इस’ से सुरक्षित रहती है।
theological_decisions:
- issue: τὸ πνεῦμα का अभिप्रेत संदर्भ
  choice: ‘आत्मा’—प्रसंग में पवित्र आत्मा
  alternative: कम स्पष्ट अर्थ में कोई आत्मिक प्रेरणा
  rationale: प्रेरितों के काम में विश्वासियों को निर्देश देने वाला ‘आत्मा’ बार-बार पवित्र आत्मा को सूचित करता है। फिर भी अनुवाद यूनानी पाठ की तरह केवल ‘आत्मा’ कहता है और ‘पवित्र’ जोड़कर उसे अधिक स्पष्ट नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में बोधगम्य रखी गई है। ‘साथ लगे रहो’ शाब्दिक ‘अपने को चिपका लो’ की अस्वाभाविकता से बचते हुए निकट संगति और निरंतर साथ रहने का भाव देता है।
