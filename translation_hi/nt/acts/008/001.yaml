id: ACT.8.1
reference: Acts 8:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἦν συνευδοκῶν τῇ ἀναιρέσει αὐτοῦ. Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ διωγμὸς μέγας ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις· πάντες δὲ διεσπάρησαν κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας πλὴν τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: hi
  text: शाऊल उसके मारे जाने से सहमत था।[a] उसी दिन यरूशलेम की कलीसिया के विरुद्ध भीषण उत्पीड़न शुरू हो गया, और प्रेरितों को छोड़कर बाकी सभी लोग यहूदिया और सामरिया के क्षेत्रों में तितर-बितर हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में आशय उसे मार डालने की क्रिया से है। इसका अनुवाद ‘उसकी हत्या’ या ‘उसे मृत्युदंड दिए जाने’ भी किया जा सकता है, पर पहले विकल्प में नैतिक-कानूनी निर्णय और दूसरे में कानूनी वैधता अधिक स्पष्ट हो सकती है।
    reason: ἀναιρέσει αὐτοῦ की अर्थ-सीमा और सम्भव अनुवादों को स्पष्ट करना।
lexical_decisions:
- source_word: Σαῦλος
  choice: शाऊल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: συνευδοκῶν
  choice: सहमत था
  rationale: ἦν के साथ यह कृदंत उस समय जारी अनुकूल सहमति या स्वीकृति व्यक्त करता है; यह रूप शाऊल की प्रत्यक्ष भागीदारी का दावा किए बिना उसका समर्थन स्पष्ट करता है।
- source_word: ἀναιρέσει αὐτοῦ
  choice: उसके मारे जाने
  rationale: यह पद केवल उसकी मृत्यु नहीं, बल्कि उसे मार डालने की क्रिया को बताता है। हिन्दी में यह स्वाभाविक है और ‘हत्या’ की अपेक्षा स्रोत से अधिक नैतिक-कानूनी निर्णय नहीं जोड़ता।
- source_word: Ἐγένετο
  choice: शुरू हो गया
  rationale: इस संदर्भ में उत्पीड़न के आरम्भ होने का स्वाभाविक हिन्दी वर्णन।
- source_word: διωγμὸς μέγας
  choice: भीषण उत्पीड़न
  rationale: μέγας यहाँ उत्पीड़न की तीव्रता और व्यापकता पर बल देता है; ‘भीषण’ आधुनिक हिन्दी में ‘बड़ा उत्पीड़न’ से अधिक स्वाभाविक है।
- source_word: ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις
  choice: यरूशलेम की कलीसिया के विरुद्ध
  rationale: ἐπί का विरोधात्मक भाव ‘के विरुद्ध’ से और समुदाय का स्थान सम्बन्ध ‘यरूशलेम की कलीसिया’ से स्पष्ट होता है।
- source_word: πάντες
  choice: बाकी सभी लोग
  rationale: πλὴν τῶν ἀποστόλων द्वारा दिए गए अपवाद के साथ ‘सभी’ का साहित्यिक बल सुरक्षित रहता है; ‘बाकी’ हिन्दी में उस अपवाद से स्वाभाविक रूप से जुड़ता है।
- source_word: διεσπάρησαν
  choice: तितर-बितर हो गए
  rationale: जबरन बिखर जाने का स्पष्ट और प्रचलित हिन्दी रूप।
- source_word: κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας
  choice: यहूदिया और सामरिया के क्षेत्रों में
  rationale: χώρας के भौगोलिक बहुवचन को ‘क्षेत्रों’ से व्यक्त किया गया है और दोनों स्थाननामों का प्रचलित लिप्यंतरण रखा गया है।
- source_word: πλὴν τῶν ἀποστόλων
  choice: प्रेरितों को छोड़कर
  rationale: πλήν द्वारा व्यक्त स्पष्ट अपवाद का सीधा और स्वाभाविक अनुवाद।
theological_decisions:
- issue: स्तिफनुस की मृत्यु के संबंध में ἀναιρέσει αὐτοῦ का अर्थ
  choice: उसके मारे जाने
  alternative: उसकी हत्या; उसे मृत्युदंड दिए जाने; उसकी मृत्यु
  rationale: चुना हुआ रूप मार डालने की क्रिया को बनाए रखता है, पर ‘मृत्युदंड’ से कानूनी वैधता या ‘हत्या’ से स्रोत में निहित अर्थ से अधिक स्पष्ट नैतिक-कानूनी वर्गीकरण नहीं जोड़ता।
- issue: πάντες (‘सभी’) का दायरा
  choice: प्रेरितों को छोड़कर बाकी सभी लोग
  alternative: सभी विश्वासी; हर व्यक्ति
  rationale: पाठ स्वयं प्रेरितों को अपवाद ठहराता है। अनुवाद ‘सभी’ के बल को बनाए रखते हुए इसका संदर्भ यरूशलेम की कलीसिया से जुड़ा रहने देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘कलीसिया’ और ‘प्रेरित’ जैसे व्यापक रूप से प्रचलित बाइबलीय शब्द रखे गए हैं; अनावश्यक संस्कृतनिष्ठता से बचते हुए ‘उत्पीड़न’ का प्रयोग सटीकता के लिए किया गया है।
