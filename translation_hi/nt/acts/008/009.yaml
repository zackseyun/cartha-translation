source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: hi
  text: पर शमौन नाम का एक आदमी पहले से उस नगर में जादू-टोना करता और सामरिया के लोगों को चकित करता था[a]। वह कहता था कि वह स्वयं कोई महान व्यक्ति था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जादुई कलाओं का अभ्यास करता था।” यूनानी क्रिया जादुई कलाओं के अभ्यास को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह कोई बड़ा आदमी था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: पर ... एक पुरुष
  rationale: Ἀνήρ का पुरुषवाचक अर्थ रखा गया है; τις की अनिश्चितता ‘एक’ से व्यक्त होती है और δέ को हल्के कथात्मक संक्रमण ‘पर’ से दर्शाया गया है।
- source_word: ὀνόματι Σίμων
  choice: शमौन नाम का
  rationale: नाम को हिन्दी बाइबलीय परंपरा के स्वाभाविक लिप्यंतरण ‘शमौन’ में रखा गया है।
- source_word: προϋπῆρχεν
  choice: पहले से ... करता आया था
  rationale: क्रिया के पूर्वकालिक और अपूर्ण पक्ष को ऐसा चल रहा कार्य बताकर व्यक्त किया गया है जो अभी वर्णित घटनाओं से पहले आरम्भ हुआ था।
- source_word: ἐν τῇ πόλει
  choice: उस नगर में
  rationale: निश्चित पद संदर्भ में पहले उल्लिखित नगर की ओर संकेत करता है; हिन्दी में ‘उस नगर’ स्वाभाविक है।
- source_word: μαγεύων
  choice: जादू-टोना करता
  rationale: यह अभिव्यक्ति जादुई कलाओं के अभ्यास को सामान्य आधुनिक हिन्दी में बताती है, बिना उसके आध्यात्मिक स्रोत पर अतिरिक्त निर्णय दिए।
- source_word: ἐξιστάνων
  choice: चकित करता
  rationale: कारणवाचक अर्थ ‘चकित/विस्मित कर देना’ को सरल और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: τὸ ἔθνος τῆς Σαμαρείας
  choice: सामरिया के लोगों को
  rationale: यहाँ ἔθνος सामरिया की सामूहिक जनता को दर्शाता है, न कि आवश्यक रूप से कोई राजनीतिक राष्ट्र।
- source_word: λέγων
  choice: वह कहता था
  rationale: चलते हुए दावे को हिन्दी में एक स्वतंत्र वाक्य बनाकर स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: εἶναί τινα ἑαυτὸν μέγαν
  choice: कि वह स्वयं कोई महान व्यक्ति है
  rationale: ‘स्वयं’ ἑαυτόν के आत्म-प्रमुख बल को और ‘कोई महान व्यक्ति’ τινα ... μέγαν के अनिश्चित किंतु आत्म-महिमामंडित दावे को बनाए रखता है।
theological_decisions:
- issue: शमौन की गतिविधि का स्वरूप
  choice: जादू-टोना करता
  alternative: जादुई कलाओं का अभ्यास करता / तंत्र-मंत्र करता
  rationale: पद उसकी गतिविधि को जादुई अभ्यास के रूप में प्रस्तुत करता है, पर उसे यहाँ सीधे ‘दुष्टात्मिक’ या ‘धोखाधड़ी’ नहीं कहता; इसलिए अनिर्दिष्ट धार्मिक-आध्यात्मिक तनाव सुरक्षित रखा गया है।
- issue: शमौन का आत्म-दावा
  choice: वह स्वयं कोई महान व्यक्ति है
  alternative: वह कोई बड़ा आदमी है
  rationale: ‘महान व्यक्ति’ दावे की गंभीर और खुली प्रकृति रखता है; यह नहीं बताता कि महानता राजनीतिक, धार्मिक या अलौकिक किस अर्थ में थी।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। लंबे यूनानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, जबकि सहभागी क्रियाओं का निरंतर भाव और शमौन का आत्म-महिमामंडन सुरक्षित रखा गया है।
