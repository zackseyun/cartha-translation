    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: उसने कहा
  rationale: वर्तमान कृदंत पिछली क्रिया से जुड़कर शमौन की बात आरम्भ करता है। हिन्दी कथाशैली में ‘उसने कहा’ स्वाभाविक है और कर्ता को संदर्भ से स्पष्ट करता है।
- source_word: Δότε κἀμοί
  choice: मुझे भी ... दीजिए
  rationale: बहुवचन आज्ञार्थक रूप के लिए आदरसूचक ‘दीजिए’ उपयुक्त है; κἀμοί में निहित ‘मुझे भी’ शमौन की अपने लिए वही क्षमता पाने की इच्छा को बनाए रखता है।
- source_word: τὴν ἐξουσίαν ταύτην
  choice: यह अधिकार
  rationale: ἐξουσία अधिकार, हक या कार्य करने की अधिकृत सामर्थ्य बता सकता है। ‘अधिकार’ इस शब्द को सीधे शक्ति सूचित करने वाले यूनानी शब्दों से अलग रखता है, जबकि ‘यह’ उस विशेष बात की ओर संकेत करता है जिसे शमौन ने देखा था।
- source_word: ἵνα ᾧ ἐὰν
  choice: कि जिस किसी पर
  rationale: ἵνα उद्देश्य अथवा अभिप्रेत परिणाम प्रस्तुत करता है और ᾧ ἐὰν अनिश्चित, सार्वत्रिक शर्त व्यक्त करता है; हिन्दी में यह संयोजन दोनों अर्थ स्वाभाविक ढंग से रखता है।
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: मैं हाथ रखूँ
  rationale: यह हाथ रखने की ठोस क्रिया को सुरक्षित रखता है। हिन्दी मुहावरे में एक व्यक्ति द्वारा दोनों हाथ रखे जाने पर भी सामान्यतः ‘हाथ रखना’ कहा जाता है।
- source_word: λαμβάνῃ πνεῦμα ἅγιον
  choice: वह पवित्र आत्मा पाए
  rationale: ἵνα के साथ विधिलिंग अभिप्रेत परिणाम को व्यक्त करता है। ‘पाए’ आधुनिक हिन्दी में ‘प्राप्त करे’ से अधिक सहज है, और ‘पवित्र आत्मा’ संदर्भ में परमेश्वर के आत्मा का निश्चित नाम है।
theological_decisions:
- issue: ἐξουσία को ‘अधिकार’ या ‘शक्ति’ के रूप में प्रस्तुत करना
  choice: अधिकार
  alternative: शक्ति
  rationale: यहाँ शब्द ऐसी अधिकृत क्षमता को सूचित करता है जिसके द्वारा हाथ रखने पर दूसरा व्यक्ति पवित्र आत्मा पाए। ‘अधिकार’ मूल शब्द की अर्थ-सीमा और अन्य अधिक सीधे ‘शक्ति’ सूचित करने वाले यूनानी शब्दों से उसका भेद बचाता है; फिर भी ‘शक्ति’ संदर्भगत रूप से सम्भव है।
- issue: अनिर्दिष्ट लेख के बिना आए πνεῦμα ἅγιον का अर्थ
  choice: पवित्र आत्मा
  alternative: कोई पवित्र आत्मा
  rationale: प्रेरितों के काम के इस प्रसंग में संकेत परमेश्वर के पवित्र आत्मा की ओर है। यूनानी में लेख का न होना इसे अनिश्चित सत्ता नहीं बनाता; हिन्दी में नामरूप ‘पवित्र आत्मा’ स्वाभाविक और सटीक है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन सहज किन्तु गरिमापूर्ण रखा गया है। आदरसूचक बहुवचन आज्ञार्थक ‘दीजिए’ प्रेरितों को संबोधन के अनुकूल है। पादटिप्पणी-चिह्न संबंधित वाक्य के अंत में दिया गया है।
