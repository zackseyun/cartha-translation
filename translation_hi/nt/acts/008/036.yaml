  text: ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν, ἦλθον ἐπί τι ὕδωρ, καί φησιν ὁ εὐνοῦχος· Ἰδοὺ ὕδωρ, τί κωλύει με ⸀βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: hi
  text: जब वे मार्ग पर जा रहे थे, तो वे कुछ पानी के पास पहुँचे। खोजा कहता है, “देखो, पानी! मुझे बपतिस्मा लेने से क्या रोकता है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ εὐνοῦχος
  choice: खोजा
  rationale: यह यूनानी पद उस राजकीय अधिकारी की शारीरिक-सामाजिक स्थिति को स्पष्ट रूप से बताता है; ‘खोजा’ आधुनिक मानक हिन्दी में इसका सीधा और संक्षिप्त समतुल्य है।
- source_word: ἐπί τι ὕδωρ
  choice: किसी जलाशय के पास
  rationale: शाब्दिक अर्थ ‘कुछ पानी के पास’ है; प्रसंग में बपतिस्मा के लिए उपलब्ध प्राकृतिक जल-स्थान अभिप्रेत है। ‘जलाशय’ पानी की मात्रा या प्रकार को अनावश्यक रूप से निश्चित किए बिना स्वाभाविक हिन्दी देता है।
- source_word: φησιν
  choice: ने कहा
  rationale: यूनानी ऐतिहासिक वर्तमान कथा को सजीव बनाता है, पर हिन्दी कथावाचन में सामान्य भूतकाल अधिक स्वाभाविक है; कथन की घटना और बल सुरक्षित रहते हैं।
- source_word: βαπτισθῆναι
  choice: बपतिस्मा लेने
  rationale: यह निष्क्रिय क्रियारूप है, जिसका स्वाभाविक हिन्दी धार्मिक प्रयोग ‘बपतिस्मा लेना’ है; इससे यह भी स्पष्ट रहता है कि संस्कार उस पर किया जाएगा।
theological_decisions:
- issue: बपतिस्मा में संभावित बाधा
  choice: “मुझे बपतिस्मा लेने से क्या रोकता है?”
  alternative: “मुझे बपतिस्मा देने में क्या बाधा है?”
  rationale: प्रश्न को खुला रखा गया है और किसी विशेष बपतिस्मा-सिद्धान्त, विधि या पात्रता की शर्त को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देखिए’ फिलिप्पुस को संबोधित विस्मय-सूचक Ἰδού का स्वाभाविक आदरसूचक रूप है।
