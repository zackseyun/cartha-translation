  text: ἀποκριθεὶς δὲ ὁ εὐνοῦχος τῷ Φιλίππῳ εἶπεν· Δέομαί σου, περὶ τίνος ὁ προφήτης λέγει ⸀τοῦτο; περὶ ἑαυτοῦ ἢ περὶ ἑτέρου τινός;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: hi
  text: तब खोजे ने फिलिप्पुस को उत्तर दिया, “मैं आपसे पूछता हूँ,[a] भविष्यद्वक्ता यह किसके विषय में कहता है—अपने विषय में या किसी और के विषय में?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं आपसे विनती करता हूँ।” यूनानी अभिव्यक्ति आदरपूर्ण अनुरोध प्रकट करती है और इसमें अधिक आग्रह का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: तब ... ने ... कहा
  rationale: यह यूनानी कथन-सूत्र अगले संवाद को आगे बढ़ाता है। हिन्दी में ‘उत्तर देकर ... कहा’ अनावश्यक रूप से भारी होता; ‘तब ... कहा’ प्रसंगगत उत्तर और कथानक की प्रगति दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ εὐνοῦχος
  choice: खोजा
  rationale: शब्द विशेष रूप से बधिया पुरुष को सूचित करता है, केवल अधिकारी को नहीं। ‘खोजा’ इसका प्रचलित और संक्षिप्त हिन्दी समतुल्य है।
- source_word: τῷ Φιλίππῳ
  choice: फिलिप्पुस से
  rationale: दत्तिव यहाँ संबोधन/कथन के प्राप्तकर्ता को दर्शाता है; हिन्दी में ‘से कहा’ स्वाभाविक है।
- source_word: Δέομαί σου
  choice: मैं आपसे पूछता हूँ
  rationale: यह आदरपूर्ण और विनीत अनुरोध है। ‘आपसे’ सम्मान बनाए रखता है, जबकि ‘पूछता हूँ’ प्रश्न के प्रसंग में सहज है। अधिक तीव्र अर्थ ‘मैं आपसे विनती करता हूँ’ पादटिप्पणी में रखा गया है।
- source_word: περὶ τίνος
  choice: किसके विषय में
  rationale: περί संबंध अथवा विषय बताता है। ‘किसके विषय में’ गरिमापूर्ण और स्पष्ट आधुनिक हिन्दी है।
- source_word: ὁ προφήτης
  choice: भविष्यद्वक्ता
  rationale: निश्चित पद यहाँ यशायाह को भविष्यद्वक्ता के रूप में संदर्भित करता है; हिन्दी बाइबलीय प्रयोग में ‘भविष्यद्वक्ता’ सटीक और परिचित है।
- source_word: λέγει τοῦτο
  choice: यह ... कहता है
  rationale: ‘यह’ अभी पढ़े गए उद्धरण की ओर संकेत करता है। हिन्दी वाक्यक्रम में इसे ‘किसके विषय में’ के बाद रखना स्वाभाविक है।
- source_word: περὶ ἑαυτοῦ ἢ περὶ ἑτέρου τινός
  choice: अपने विषय में या किसी और के विषय में
  rationale: यह भविष्यद्वक्ता स्वयं और किसी अन्य व्यक्ति के बीच यूनानी पाठ का स्पष्ट विकल्प ज्यों का त्यों रखता है।
