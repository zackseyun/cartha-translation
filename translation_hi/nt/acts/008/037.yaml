  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: hi
  text: तब फिलिप्पुस[a] ने कहा, “यदि तुम अपने पूरे हृदय से विश्वास करते हो, तो बपतिस्मा ले सकते हो।” उसने उत्तर दिया, “मैं विश्वास करता हूँ कि यीशु मसीह परमेश्वर का पुत्र है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पूरा पद आरम्भिकतम उपलब्ध यूनानी पांडुलिपियों (जिनमें तीसरी शताब्दी के पपीरस तथा चौथी शताब्दी की सीनैटिकस और वैटिकनस पांडुलिपियाँ शामिल हैं) और प्राचीन कॉप्टिक अनुवादों में नहीं मिलता। यह बीजान्टिन बहुसंख्यक पाठ-परंपरा और लैटिन परंपरा में मिलता है; दूसरी शताब्दी के उत्तरार्ध में इरेनियस तथा बाद में साइप्रियन जैसे आरम्भिक कलीसियाई लेखकों ने भी इसके समान कथन उद्धृत किए। अनेक विद्वान इसे बपतिस्मा के समय प्रयुक्त एक प्राचीन अंगीकार मानते हैं, जिसे बाद में प्रेरितों के काम के वर्णनात्मक पाठ में सम्मिलित कर लिया गया।
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: बपतिस्मा ले सकते हो
  rationale: यह निर्वैयक्तिक क्रिया अनुमति या संभव होने का भाव देती है। निकटवर्ती प्रसंग में प्रश्न बपतिस्मा लेने का है; उसे स्पष्ट करने से हिन्दी में अधूरा ‘कर सकते हो’ कहने की अपेक्षा अर्थ स्वाभाविक और सुस्पष्ट रहता है।
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: अपने पूरे हृदय से
  rationale: यह बाइबलीय मुहावरा संपूर्ण निष्ठा और सच्चे मन से विश्वास करने का भाव रखता है; ‘हृदय’ मूल रूपक को सुरक्षित रखता है।
- source_word: Πιστεύω
  choice: मैं विश्वास करता हूँ
  rationale: इस अंगीकार के प्रसंग में यह यीशु की पहचान को सत्य मानने और उस पर भरोसा रखने, दोनों के अनुकूल स्वाभाविक हिन्दी है।
- source_word: τὸν Ἰησοῦν Χριστόν
  choice: यीशु मसीह
  rationale: यूनानी पदबंध में Χριστόν यीशु के साथ नाम/उपाधि के रूप में जुड़ा है। ‘यीशु मसीह’ हिन्दी बाइबल की परिचित और मूल संरचना के निकट अभिव्यक्ति है।
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: यह पदबंध यीशु की अंगीकारात्मक उपाधि को सीधे और पारंपरिक किन्तु आज भी स्पष्ट हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: Χριστός का वाक्यगत संबंध
  choice: ‘यीशु मसीह परमेश्वर का पुत्र है’
  alternative: ‘यीशु ही मसीह, परमेश्वर का पुत्र है’
  rationale: उपलब्ध यूनानी पाठ में εἶναι के पहले ‘परमेश्वर का पुत्र’ आता है और ‘यीशु मसीह’ संयुक्त कर्म-पदबंध है। इसलिए Χριστός को अलग दूसरा विधेय बनाने के बजाय ‘यीशु मसीह’ रखना यूनानी संरचना के अधिक निकट है।
- issue: ἔξεστιν में निहित कर्म
  choice: प्रसंग से ‘बपतिस्मा ले सकते हो’ को स्पष्ट किया गया
  alternative: ‘तो ऐसा कर सकते हो’ अथवा केवल ‘तो कर सकते हो’
  rationale: पिछले पद में कूशी अधिकारी ने बपतिस्मा की अनुमति पूछी है। हिन्दी में कर्म को पूरी तरह छोड़ना अस्वाभाविक या अस्पष्ट होता; स्पष्ट रूप से जोड़ना प्रसंगगत अर्थ को व्यक्त करता है, कोई नया धर्मवैज्ञानिक नियम नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक शैली रखी गई है। ‘पूरे हृदय से’ बाइबलीय मुहावरे को बनाए रखता है, जबकि बपतिस्मा का प्रसंग स्पष्ट करने के लिए निहित कर्म व्यक्त किया गया है।
