  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: hi
  text: इस बात में न तुम्हारा कोई भाग है, न हिस्सा, क्योंकि परमेश्वर के सामने तुम्हारा हृदय सीधा नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς οὐδὲ κλῆρος
  choice: न तुम्हारा कोई भाग है, न हिस्सा
  rationale: दोनों निकटार्थक संज्ञाओं की जोड़दार अभिव्यक्ति को बनाए रखा गया है। यहाँ κλῆρος का शाब्दिक अर्थ ‘चिट्ठी’ हो सकता है, पर संदर्भ में उसका अर्थ प्राप्त भाग या सहभागिता है; इसलिए स्वाभाविक हिन्दी में ‘हिस्सा’ चुना गया।
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: इस बात में
  rationale: λόγος यहाँ किसी कथन मात्र के बजाय विचाराधीन विषय या मामले को दर्शाता है; ‘इस बात में’ आधुनिक हिन्दी में संक्षिप्त और संदर्भानुकूल है।
- source_word: ἡ καρδία σου
  choice: तुम्हारा हृदय
  rationale: बाइबलीय रूपक को सुरक्षित रखा गया है; यहाँ ‘हृदय’ व्यक्ति की भीतरी प्रवृत्ति और अभिप्राय को सूचित करता है।
- source_word: εὐθεῖα ἔναντι τοῦ θεοῦ
  choice: परमेश्वर के सामने ... सीधा
  rationale: εὐθεῖα के मूल रूपक ‘सीधा’ तथा ἔναντι की परमेश्वर की दृष्टि/उपस्थिति संबंधी भाषा को यथासंभव संरक्षित किया गया है।
theological_decisions:
- issue: ‘भाग’ और ‘हिस्सा’ का आशय
  choice: दोनों शब्दों को समानांतर रूप में रखा गया
  alternative: केवल ‘तुम्हारा कोई हिस्सा नहीं’
  rationale: मूल पाठ के μερίς और κλῆρος दोनों को व्यक्त करने से बहिष्करण की जोरदार भाषा बनी रहती है, बिना यह तय किए कि यहाँ किसी विशिष्ट कलीसियाई पद या उद्धार-सिद्धांत का तकनीकी उल्लेख है।
- issue: हृदय का परमेश्वर के सामने सीधा न होना
  choice: ‘परमेश्वर के सामने तुम्हारा हृदय सीधा नहीं है’
  alternative: ‘परमेश्वर की दृष्टि में तुम्हारा मन ठीक नहीं है’
  rationale: चुना हुआ पाठ मूल रूपक और न्यायकारी संबंध को बनाए रखता है तथा ‘मन’ या ‘ठीक’ द्वारा अर्थ को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गंभीर और गरिमापूर्ण शैली। ‘भाग’ और ‘हिस्सा’ की पुनरुक्ति मूल यूनानी के बलाघात को बनाए रखती है। कोई पादटिप्पणी आवश्यक नहीं है।
