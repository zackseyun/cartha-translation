translation:
  language: hi
  text: उन्होंने नीचे आकर उनके लिए प्रार्थना की[a] ताकि वे पवित्र आत्मा प्राप्त करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वे नीचे आए और उनके लिए प्रार्थना की’; अथवा, ‘जब वे नीचे आए, तब उन्होंने उनके लिए प्रार्थना की।’
    reason: यूनानी कृदन्त मुख्य क्रिया से पहले की क्रिया बताता है, जिसे हिन्दी में कृदन्त, संयुक्त क्रिया या समयवाचक उपवाक्य से व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: οἵτινες
  choice: उन्होंने
  rationale: यह सम्बन्धवाचक रूप पिछले पद में उल्लिखित पतरस और यूहन्ना को आगे की क्रिया का कर्ता बनाता है। हिन्दी में प्रसंग को स्वाभाविक रूप से जारी रखने के लिए ‘उन्होंने’ स्पष्ट और सहज है।
- source_word: καταβάντες
  choice: नीचे आकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की क्रिया बताता है। ‘नीचे आकर’ दिशा और समय-क्रम दोनों को संक्षेप में बनाए रखता है।
- source_word: προσηύξαντο
  choice: प्रार्थना की
  rationale: यह क्रिया यहाँ सामान्य रूप से प्रार्थना करने को व्यक्त करती है; मध्यम वाच्य का कोई अलग भाव हिन्दी में जोड़ना आवश्यक नहीं है।
- source_word: περὶ αὐτῶν
  choice: उनके लिए
  rationale: प्रार्थना के साथ περί और सम्बन्धकारक यहाँ उनकी ओर से की गई मध्यस्थ प्रार्थना का अर्थ देता है।
- source_word: ὅπως
  choice: कि
  rationale: प्रार्थना का उद्देश्य बताने वाली उपवाक्य-रचना हिन्दी में ‘प्रार्थना की कि’ से स्वाभाविक रूप में व्यक्त होती है।
- source_word: λάβωσιν
  choice: पाएँ
  rationale: अओरिस्ट संभावनार्थक रूप उद्देश्यवाचक ὅπως के अधीन है। ‘पाएँ’ उद्देश्य को सहज हिन्दी में व्यक्त करता है, बिना अनावश्यक अनिश्चितता जोड़े।
- source_word: πνεῦμα ἅγιον
  choice: पवित्र आत्मा
  rationale: प्रेरितों के काम के इस प्रसंग में यह वाक्यांश परमेश्वर के प्रतिज्ञात पवित्र आत्मा को सूचित करता है; हिन्दी में इसके लिए ‘पवित्र आत्मा’ प्रचलित और स्पष्ट है।
theological_decisions:
- issue: πνεῦμα ἅγιον को किसी सामान्य पवित्र आत्मा के रूप में समझा जाए या परमेश्वर के पवित्र आत्मा के रूप में
  choice: पवित्र आत्मा
  alternative: कोई पवित्र आत्मा
  rationale: निकटवर्ती कथा और प्रेरितों के काम में इस पदबंध का प्रयोग परमेश्वर के दिए हुए पवित्र आत्मा के लिए है। चुना गया रूप संदर्भित व्यक्ति को स्पष्ट करता है, पर पाठ से आगे कोई सिद्धान्तगत विस्तार नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद पिछले वाक्य को आगे बढ़ाता है, इसलिए आरम्भ में ‘उन्होंने’ हिन्दी प्रवाह के अनुकूल है। ‘नीचे’ मूल यूनानी की दिशात्मक सूचना को सुरक्षित रखता है।
