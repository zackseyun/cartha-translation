  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: hi
  text: परन्तु फिलिप्पुस अशदोद में पाया गया[a], और यात्रा करते हुए वह कैसरिया पहुँचने तक सभी नगरों में शुभ समाचार सुनाता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अशदोद में प्रकट हुआ।” यूनानी में अधिक शाब्दिक रूप से “अशदोद में पाया गया” है। संदर्भ में इससे अचानक हुए दिव्य स्थानांतरण का संकेत मिल सकता है, पर यह बात स्पष्ट रूप से नहीं कही गई है।
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले पद में फिलिप्पुस के आत्मा द्वारा उठा लिए जाने के बाद एक हल्का कथात्मक मोड़ दिखाता है।
- source_word: εὑρέθη
  choice: पाया गया
  rationale: यूनानी के निष्क्रिय रूप को सीधे बनाए रखता है और यह स्पष्ट रूप से नहीं बताता कि स्थानांतरण किस प्रकार हुआ।
- source_word: εἰς Ἄζωτον
  choice: अशदोद में
  rationale: यहाँ εἰς परिणामी स्थान को सूचित करता है; अशदोद पुराने नियम से परिचित आधुनिक हिन्दी नाम है।
- source_word: διερχόμενος
  choice: वहाँ से होकर जाते हुए
  rationale: समकालीन यात्रा की क्रिया व्यक्त करता है और आगे के नगरों से होकर जाने के भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: εὐηγγελίζετο
  choice: शुभ समाचार सुनाता रहा
  rationale: अपूर्ण काल की निरन्तर अथवा बार-बार होने वाली क्रिया को व्यक्त करता है और धार्मिक पारिभाषिक शब्दावली से बचता है।
- source_word: τὰς πόλεις πάσας
  choice: सब नगरों में
  rationale: मार्ग में पड़ने वाले सभी नगरों में प्रचार करने का सामूहिक-वितरणात्मक भाव देता है।
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν
  choice: जब तक कि वह ... न पहुँच गया
  rationale: चलती हुई क्रिया के अंतिम बिंदु को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰς Καισάρειαν
  choice: कैसरिया
  rationale: ἔρχομαι के साथ गंतव्य है; हिन्दी क्रिया ‘पहुँचना’ स्वयं गंतव्य का संबंध स्पष्ट करती है।
theological_decisions:
- issue: क्या εὑρέθη का अनुवाद फिलिप्पुस के अलौकिक स्थानांतरण को स्पष्ट रूप से ‘प्रकट हुआ’ कहकर करे
  choice: मुख्य पाठ में तटस्थ निष्क्रिय रूप ‘पाया गया’ रखा गया
  alternative: ‘अशदोद में प्रकट हुआ’
  rationale: संदर्भ दिव्य और अचानक स्थानांतरण का प्रबल संकेत देता है, पर यूनानी क्रिया स्वयं केवल ‘पाया गया’ कहती है। इसलिए कथन की अस्पष्टता और धर्मवैज्ञानिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘शुभ समाचार सुनाता रहा’ निरन्तर क्रिया को स्पष्ट करता है। स्थान-नाम Ἄζωτος के लिए हिन्दी बाइबिल-परंपरा और उसके सेमिटिक नाम के अनुरूप ‘अशदोद’ चुना गया है।
