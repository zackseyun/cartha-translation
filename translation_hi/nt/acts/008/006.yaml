base_translation:
  language: en
  yaml_path: translation/nt/acts/008/006.yaml
  text: And the crowds with one accord paid close attention to what was being said by Philip[b][a], as they heard him and saw the signs that he was doing.
translation:
  language: hi
  text: और भीड़ के लोग एक मन होकर[b] फिलिप्पुस की कही जा रही बातों पर ध्यान देते थे,[a] जब वे उसे सुनते और उन चिन्हों को देखते थे जो वह कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मन लगाते थे’ अथवा ‘गौर करते थे।’
    reason: lexical_alternative
  - marker: b
    text: या ‘मिलकर’ अथवा ‘एकमत होकर’; यूनानी शब्द उनकी एकजुट, साझा प्रतिक्रिया पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: ध्यान देते थे
  rationale: यह प्रयोग किसी बात की ओर मन लगाकर ध्यान देने का अर्थ रखता है। अपूर्ण भूतकाल की निरंतरता को ‘देते थे’ से व्यक्त किया गया है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘और’ अनावश्यक विरोध उत्पन्न नहीं करता।
- source_word: οἱ ὄχλοι
  choice: भीड़ के लोग
  rationale: यूनानी बहुवचन ὄχλοι एकत्र जनसमूहों को दर्शाता है। हिन्दी में ‘भीड़ के लोग’ स्वाभाविक है और सामूहिक बहुवचन भाव बनाए रखता है।
- source_word: τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου
  choice: फिलिप्पुस की कही हुई बातों पर
  rationale: कर्मवाच्य कृदन्त वाक्यांश फिलिप्पुस द्वारा कही जा रही बातों की विषयवस्तु को दर्शाता है; हिन्दी में यह रूप स्पष्ट और सहज है।
- source_word: ὁμοθυμαδὸν
  choice: एक मन होकर
  rationale: यह शब्द लोगों की साझा, एकमत प्रतिक्रिया पर बल देता है; ‘एक मन होकर’ उस सामूहिक एकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν
  choice: क्योंकि वे उसकी बातें सुनते और ... देखते थे
  rationale: ἐν τῷ + infinitive को यहाँ परिस्थितिजन्य/कारणसूचक संबंध के रूप में व्यक्त किया गया है। αὐτούς का पाठ रूप व्याकरणतः कठिन है, पर प्रसंग फिलिप्पुस को सुनने की ओर संकेत करता है; इसलिए ‘उसकी बातें’ रखा गया है।
- source_word: τὰ σημεῖα
  choice: चिन्ह
  rationale: σημεῖα का सीधा धार्मिक-साहित्यिक समतुल्य ‘चिन्ह’ है; ‘चमत्कारी’ जोड़ना मूल से अधिक व्याख्यात्मक होता।
- source_word: ἃ ἐποίει
  choice: उसके किए हुए
  rationale: यह फिलिप्पुस द्वारा किए जा रहे चिन्हों को संदर्भित करता है। हिन्दी कृदन्त संरचना मुख्य वाक्य के ‘देखते थे’ के साथ चल रही क्रिया का भाव देती है।
