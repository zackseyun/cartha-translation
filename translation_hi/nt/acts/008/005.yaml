base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: hi
  text: फिलिप्पुस सामरिया के नगर[a][b] में उतर गया और उन्हें मसीह का प्रचार करता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सामरिया के एक नगर।” यूनानी पदबंध का अर्थ सामरिया प्रदेश के किसी नगर से भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “सामरिया नगर।”
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: और
  rationale: यह हल्का कथात्मक संयोजक है। हिन्दी में ‘और’ कथा को आगे बढ़ाता है, बिना किसी प्रबल विरोध या स्पष्ट कालगत ‘अब’ का भाव जोड़े।
- source_word: κατελθὼν
  choice: उतर गया
  rationale: κατέρχομαι की दिशासूचकता को सुरक्षित रखते हुए कृदन्त को स्वाभाविक हिन्दी कथन में मुख्य क्रिया के साथ समन्वित किया गया है।
- source_word: τὴν πόλιν τῆς Σαμαρείας
  choice: सामरिया के नगर
  rationale: यह यूनानी पदबंध की निश्चितता और संबंधकारक रचना को निकटता से व्यक्त करता है। फिर भी इसका अर्थ सामरिया नामक नगर अथवा सामरिया प्रदेश का कोई नगर हो सकता है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐκήρυσσεν
  choice: प्रचार करने लगा
  rationale: अपूर्ण भूतकाल सार्वजनिक रूप से संदेश सुनाने की आरम्भ हुई और चलती रही गतिविधि प्रस्तुत करता है। ‘प्रचार’ आधुनिक हिन्दी में स्वाभाविक है और κηρύσσω के खुले रूप से घोषणा करने के भाव को व्यक्त करता है।
- source_word: αὐτοῖς
  choice: वहाँ के लोगों को
  rationale: सर्वनाम के स्थानीय संदर्भ को हिन्दी में स्पष्ट करते हुए श्रोताओं का बोध कराया गया है।
- source_word: τὸν χριστόν
  choice: मसीह
  rationale: यहाँ Χριστός व्यक्तिगत नाम से अधिक प्रतिज्ञात अभिषिक्त जन की उपाधि है; ‘मसीह’ हिन्दी बाइबलीय प्रयोग में इस उपाधि को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: सप्रत्यय τὸν χριστόν और प्रचार का प्रसंग उपाधिसूचक अर्थ का समर्थन करते हैं। ‘मसीह’ यहूदी मसीही पृष्ठभूमि को बनाए रखता है और इसे केवल नाम के रूप में प्रस्तुत नहीं करता।
- issue: सामरिया के नगर की पहचान
  choice: मुख्य पाठ में ‘सामरिया के नगर’
  alternative: ‘सामरिया के एक नगर’
  rationale: यूनानी में πόλιν के साथ निश्चित उपपद है, इसलिए मुख्य पाठ में निश्चित रूप रखा गया है; किंतु पदबंध किसी विशेष नगर या सामरिया प्रदेश के किसी नगर की ओर संकेत कर सकता है, अतः अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उतर गया’ मूल की दिशासूचकता बनाए रखता है, और ‘प्रचार करने लगा’ अपूर्ण भूतकाल की प्रवाहमान क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
