  text: ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: hi
  text: उसके अपमान के समय उससे न्याय[b] छीन लिया गया। उसकी पीढ़ी[a] का वर्णन कौन करेगा? क्योंकि उसका जीवन पृथ्वी से हटा लिया जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके वंशज’ अथवा ‘उसके समकालीन लोग’; यूनानी शब्द ‘पीढ़ी’ यशायाह 53 के उद्धरण की अस्पष्टता को बनाए रखता है।
    reason: alternative_reading
  - marker: b
    text: या ‘उसका निर्णय उससे छीन लिया गया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώσει
  choice: अपमान की दशा
  rationale: यह पद दीन किए जाने अथवा अपमानित अवस्था को दर्शाता है। ‘अपमान की दशा’ अन्यायपूर्ण दुःख के प्रसंग में स्वाभाविक है और केवल आंतरिक नम्रता का अर्थ नहीं देता।
- source_word: κρίσις
  choice: न्याय
  rationale: यहाँ न्यायिक निर्णय की प्रक्रिया से अधिक उचित न्याय से वंचित किए जाने का भाव प्रमुख है; फिर भी ‘निर्णय’ की शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- source_word: ἤρθη
  choice: छीन लिया गया
  rationale: αἴρω का कर्मवाच्य रूप यहाँ हटाए जाने या वंचित किए जाने को व्यक्त करता है। ‘छीन लिया गया’ न्याय के अभाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: γενεὰν
  choice: पीढ़ी
  rationale: ‘पीढ़ी’ यूनानी शब्द की व्यापकता को बनाए रखती है और उसे केवल वंशजों या समकालीनों तक सीमित नहीं करती।
- source_word: διηγήσεται
  choice: वर्णन करेगा
  rationale: यह क्रिया विस्तार से बताने या वर्णन करने का अर्थ देती है और आलंकारिक प्रश्न में सहज बैठती है।
- source_word: αἴρεται
  choice: उठा लिया जाता है
  rationale: वर्तमान कर्मवाच्य की सजीवता को बनाए रखते हुए यह पृथ्वी से जीवन हटाए जाने का भाव व्यक्त करता है।
- source_word: γῆς
  choice: पृथ्वी
  rationale: इस प्रसंग में γῆ पृथ्वी पर के जीवन-क्षेत्र को दर्शाता है; ‘पृथ्वी पर से’ हिन्दी में स्वाभाविक है।
- source_word: ζωὴ
  choice: जीवन
  rationale: यहाँ सीधा अर्थ शारीरिक जीवन है, जो यशायाह 53 में सेवक के मारे जाने के प्रसंग के अनुरूप है।
theological_decisions:
- issue: ‘उसकी पीढ़ी’ का अर्थ
  choice: मुख्य पाठ में अस्पष्ट ‘उसकी पीढ़ी’ रखा गया।
  alternative: ‘उसके वंशज’ अथवा ‘उसके समकालीन लोग’
  rationale: यशायाह 53 से लिया गया यह वाक्यांश व्याख्यात्मक रूप से कठिन है। मुख्य पाठ में ‘पीढ़ी’ रखने से वंशजों, समकालीनों या उसके युग से संबंधित संभावित अर्थों में से किसी एक को अनावश्यक रूप से निश्चित नहीं किया जाता।
- issue: κρίσις का अर्थ
  choice: ‘न्याय’
  alternative: ‘निर्णय’
  rationale: इस अपमान और दुःख के प्रसंग में उचित न्याय से वंचित किए जाने का भाव अधिक स्वाभाविक है। फिर भी यूनानी शब्द का ‘निर्णय’ अर्थ संभव होने के कारण उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रूप अपनाया गया है। वाक्यरचना उद्धृत काव्य की गंभीरता रखती है, जबकि ‘अपमान की दशा’ और ‘छीन लिया गया’ सामान्य पाठक के लिए बोधगम्य हैं।
