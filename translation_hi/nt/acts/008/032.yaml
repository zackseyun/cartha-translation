  edition: SBLGNT
  text: ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: hi
  text: 'पवित्रशास्त्र का जो अंश वह पढ़ रहा था, वह यह था: “वह भेड़ के समान वध के लिए ले जाया गया[a], और जैसे मेमना अपने ऊन कतरनेवाले के सामने मौन रहता है[b], वैसे ही वह अपना मुँह नहीं खोलता।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वध की ओर।”
    reason: lexical_alternative
  - marker: b
    text: या, “कतरनेवाले के सामने”; यूनानी में शाब्दिक अर्थ, “मेमने को कतरनेवाले के सामने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιοχὴ τῆς γραφῆς
  choice: पवित्रशास्त्र का ... अंश
  rationale: περιοχή यहाँ पढ़े जा रहे पवित्रशास्त्र के एक निश्चित अंश को दर्शाता है। ‘अंश’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ἀνεγίνωσκεν
  choice: पढ़ रहा था
  rationale: अपूर्ण भूतकाल चल रही भूतकालीन क्रिया को व्यक्त करता है; ‘पढ़ रहा था’ इसे स्पष्ट रूप से बनाए रखता है।
- source_word: Ὡς πρόβατον
  choice: भेड़ के समान
  rationale: ὡς उपमा प्रस्तुत करता है; यह रूप मूल की गरिमा और तुलना दोनों को बनाए रखता है।
- source_word: ἐπὶ σφαγὴν ἤχθη
  choice: वध के लिए ले जाया गया
  rationale: यह वध की ओर ले जाए जाने की निष्क्रिय क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; दिशा-सूचक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀμνὸς
  choice: मेमना
  rationale: ἀμνός विशेष रूप से मेमने को दर्शाता है और पहले आए व्यापक πρόβατον ‘भेड़’ से शब्दगत भेद बनाए रखता है।
- source_word: ἐναντίον τοῦ κείραντος αὐτὸν
  choice: उसके सामने ... जो उसका ऊन कतरता है
  rationale: यह κείραντος के कृदन्तीय, चल रही क्रिया वाले रूप को सहज हिन्दी में व्यक्त करता है। संदर्भानुसार ‘ऊन’ स्पष्ट किया गया है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: ἄφωνος
  choice: मौन रहता है
  rationale: इस उपमा में अर्थ आवाज़ न करने या चुप रहने का है; ‘मौन रहता है’ गरिमापूर्ण और स्वाभाविक है।
- source_word: οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: वैसे ही वह अपना मुँह नहीं खोलता
  rationale: οὕτως उपमा का निष्कर्ष जोड़ता है और वर्तमान काल को ‘नहीं खोलता’ द्वारा सुरक्षित रखा गया है।
theological_decisions:
- issue: यशायाह 53 के मसीह-संबंधी उद्धरण का संदर्भ
  choice: उद्धरण को उसकी मूल उपमात्मक भाषा में रखा गया है और इस पद में उसके पात्र की पहचान अलग से नहीं जोड़ी गई।
  alternative: पद में ही यीशु को दुःख उठानेवाले सेवक के रूप में स्पष्ट कर देना।
  rationale: आगे का कथानक उद्धरण को यीशु पर लागू करता है, पर यह पद स्वयं पवित्रशास्त्र का उद्धरण देता है। अनुवाद में व्याख्यात्मक पहचान जोड़ने के बजाय संदर्भ को वह संबंध प्रकट करने दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और पाठयोग्य शैली रखी गई है। उद्धरण की काव्यात्मक समानांतरता ‘भेड़ के समान ... और जैसे मेमना ... वैसे ही’ द्वारा सुरक्षित है। आरम्भ में कोई अतिरिक्त कालसूचक या संवाद-सूचक शब्द नहीं जोड़ा गया।
