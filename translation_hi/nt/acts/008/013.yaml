  yaml_path: translation/nt/acts/008/013.yaml
  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: hi
  text: और शमौन ने स्वयं भी विश्वास किया, और बपतिस्मा पाने के बाद वह फिलिप्पुस के साथ बना रहा। वह चिह्नों और सामर्थ्य के बड़े-बड़े कार्य होते देखकर चकित होता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: स्वयं ... भी
  rationale: यह प्रयोग αὐτός के बलाघात और καί के समावेशी अर्थ—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπίστευσεν
  choice: विश्वास किया
  rationale: यह क्रिया के सीधे अर्थ को रखता है और शमौन के विश्वास की वास्तविकता या गहराई पर कथानक से अधिक निष्कर्ष नहीं थोपता।
- source_word: βαπτισθεὶς
  choice: बपतिस्मा लेने के बाद
  rationale: अओरिस्ट कर्मवाच्य कृदंत मुख्य क्रिया से पहले की घटना बताता है; यह हिन्दी में क्रम को स्पष्ट और सहज बनाता है।
- source_word: ἦν προσκαρτερῶν τῷ Φιλίππῳ
  choice: वह फिलिप्पुस के साथ लगा रहा
  rationale: यह परिभाषात्मक अपूर्णकाल की निरंतरता और फिलिप्पुस के साथ बने रहने या निकट लगे रहने का भाव व्यक्त करता है।
- source_word: θεωρῶν
  choice: होते देखकर
  rationale: यह वर्तमान कृदंत की साथ-साथ चलती हुई दृष्टि को स्वाभाविक हिन्दी में मुख्य आश्चर्य से जोड़ता है।
- source_word: σημεῖα
  choice: चिह्नों
  rationale: ‘चिह्न’ प्रेरितों के काम में इस शब्द के संकेतात्मक और प्रमाणकारी पहलू को सुरक्षित रखता है।
- source_word: δυνάμεις μεγάλας
  choice: सामर्थ्य के बड़े-बड़े कामों
  rationale: यह δυνάμεις को केवल ‘चमत्कार’ कहकर सीमित करने के बजाय शक्ति के प्रत्यक्ष कार्यों के रूप में व्यक्त करता है और विशेषण के जोर को भी रखता है।
- source_word: γινομένας
  choice: होते
  rationale: यह घटनाओं के शमौन के सामने घटित होते रहने का भाव संक्षेप में व्यक्त करता है।
- source_word: ἐξίστατο
  choice: चकित रह जाता था
  rationale: अपूर्णकाल निरंतर या बार-बार होने वाली विस्मयावस्था दिखाता है; यह हिन्दी वाक्यांश उस पहलू को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: क्या शमौन के विश्वास का अनुवाद उसके वास्तविक मन-परिवर्तन का निर्णय कर दे
  choice: केवल ‘विश्वास किया’ कहना
  alternative: ‘सच्चा विश्वास किया’, ‘विश्वास करने का दावा किया’ या ‘ऊपरी तौर पर विश्वास किया’
  rationale: यूनानी पाठ केवल उसके विश्वास करने की बात कहता है, जबकि आगे का कथानक व्याख्यात्मक तनाव उत्पन्न करता है। अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘फिलिप्पुस’ पारंपरिक बाइबलीय नामरूप है। कोई पादटिप्पणी आवश्यक नहीं समझी गई, क्योंकि ‘सामर्थ्य के बड़े-बड़े काम’ मूल पद की व्यापकता सीधे पाठ में सुरक्षित रखता है।
