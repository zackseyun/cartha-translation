  yaml_path: translation/nt/acts/008/028.yaml
  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: hi
  text: और वह लौट रहा था और अपने रथ में बैठा हुआ भविष्यद्वक्ता यशायाह की पुस्तक पढ़ रहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उस समय प्रायः सस्वर पढ़ा जाता था; इसलिए इसका अनुवाद ‘ऊँचे स्वर से पढ़ रहा था’ भी हो सकता है, यद्यपि यूनानी क्रिया यहाँ इसे स्पष्ट रूप से नहीं कहती।
    reason: cultural_note
lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: और वह लौट रहा था
  rationale: ἦν के साथ वर्तमान कृदन्त जारी भूतकालीन क्रिया को व्यक्त करता है। ‘लौट रहा था’ इस अपूर्ण पक्ष को बनाए रखता है और मूल में न होने के कारण ‘घर’ नहीं जोड़ता।
- source_word: καθήμενος ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: अपने रथ पर बैठा हुआ
  rationale: यह उसकी यात्रा के समय की मुद्रा बताता है। ἐπί के स्थानिक भाव के लिए हिन्दी में ‘रथ पर’ स्वाभाविक और ठोस चित्र को सुरक्षित रखने वाला प्रयोग है।
- source_word: ἀνεγίνωσκεν
  choice: पढ़ रहा था
  rationale: अपूर्ण भूतकाल चल रही क्रिया दर्शाता है। प्राचीन काल में पढ़ना प्रायः सस्वर होता था, पर क्रिया स्वयं यहाँ ‘ऊँचे स्वर से’ को स्पष्टतः अनिवार्य नहीं करती।
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: यशायाह नबी का ग्रन्थ
  rationale: यूनानी वाक्यांश का शाब्दिक अर्थ ‘यशायाह नबी’ है, पर पढ़ने की वस्तु के रूप में उससे उनकी लिखित पुस्तक अभिप्रेत है। हिन्दी में ‘का ग्रन्थ’ इस निहित अर्थ को स्वाभाविक ढंग से स्पष्ट करता है, बिना किसी विशिष्ट अंश को जोड़ने के।
