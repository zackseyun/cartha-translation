review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the progressive force of ἦν ... ὑποστρέφων and ἀνεγίνωσκεν. However, ‘रथ पर बैठा हुआ’ can suggest sitting atop the chariot rather than riding in it. Also, ‘यशायाह नबी का ग्रन्थ’ reverses the natural Hindi possessive relationship; the object being read is most clearly expressed as the book of the prophet Isaiah.
  naturalness: ‘अपने रथ में बैठा हुआ’ is the natural modern Hindi expression for the posture and setting. ‘भविष्यद्वक्ता यशायाह की पुस्तक पढ़ रहा था’ is idiomatic while retaining the referent of the Greek phrase in context.
  terminology: ‘भविष्यद्वक्ता’ is a clear, dignified modern Hindi equivalent for προφήτης. ‘यशायाह’ is retained as the established Hindi biblical name. ‘पुस्तक’ is more natural than ‘ग्रन्थ’ in this narrative context.
  issues:
  - severity: medium
    issue: स्थानसूचक अभिव्यक्ति ‘अपने रथ पर बैठा हुआ’
    rationale: Although ἐπὶ τοῦ ἅρματος can be rendered literally with ‘पर,’ modern Hindi more naturally says that a traveler is seated ‘रथ में.’ The current wording may evoke sitting on top of the vehicle.
  - severity: low
    issue: ‘यशायाह नबी का ग्रन्थ’ की संबंध-रचना
    rationale: This wording is understandable, but ‘भविष्यद्वक्ता यशायाह की पुस्तक’ is more idiomatic and directly expresses the implied written work being read. The Greek’s accusative ‘the prophet Isaiah’ denotes the prophetic writing by metonymy in this context.
  revised_text: और वह लौट रहा था और अपने रथ में बैठा हुआ भविष्यद्वक्ता यशायाह की पुस्तक पढ़ रहा था।[a]
