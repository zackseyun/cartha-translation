  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोहराए गए कृदन्तों को हिन्दी की स्वाभाविक वाक्य-रचना में जोड़ा गया है। ‘रथ’ पारंपरिक और सामान्यतः समझा जाने वाला शब्द है; ‘ग्रन्थ’ लिखित भविष्यद्वाणी की पुस्तक को स्पष्ट करता है।
