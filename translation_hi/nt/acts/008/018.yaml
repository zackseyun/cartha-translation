id: ACT.8.18
reference: Acts 8:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ ⸀πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/018.yaml
  text: But when Simon saw that the Spirit was given through the laying on of the apostles’ hands[a], he offered them money,
translation:
  language: hi
  text: पर जब शमौन ने देखा कि प्रेरितों के हाथ रखने के द्वारा आत्मा दी जाती है[a], तो उसने उन्हें पैसे देने की पेशकश की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र आत्मा।” यूनानी पाठ में केवल “आत्मा” है, पर प्रसंग में इसका अभिप्राय पवित्र आत्मा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: जब ... ने देखा
  rationale: ὁράω का यह भूतकालिक कृदंत प्रसंग में समय-सूचक है; यह अनुवाद घटना-क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: δέ पिछले वर्णन से शमौन की प्रतिक्रिया की ओर हल्का मोड़ या विरोध दर्शाता है।
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων
  choice: प्रेरितों के हाथ रखने के द्वारा
  rationale: διά के साथ संबंधकारक साधन या माध्यम व्यक्त करता है। ‘हाथ रखना’ वर्तमान हिन्दी में स्पष्ट और प्रचलित बाइबलीय अभिव्यक्ति है।
- source_word: δίδοται
  choice: दी जाती है
  rationale: मूल में वर्तमानकालीन कर्मवाच्य रूप है। हिन्दी में इसे वर्तमान कर्मवाच्य रखने से शमौन ने जो प्रक्रिया देखी, वह सीधे व्यक्त होती है और देने वाले को अनावश्यक रूप से निर्दिष्ट नहीं किया जाता।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: यूनानी पाठ में विशेषण ‘पवित्र’ नहीं है, इसलिए मुख्य पाठ मूल की संक्षिप्त अभिव्यक्ति रखता है; निकटवर्ती प्रसंग से इसका संकेत पवित्र आत्मा की ओर है।
- source_word: προσήνεγκεν αὐτοῖς χρήματα
  choice: उसने उन्हें पैसे देने की पेशकश की
  rationale: προσφέρω यहाँ धन प्रस्तुत करने या देने का प्रस्ताव रखने के अर्थ में है। यह हिन्दी अभिव्यक्ति शमौन के भुगतान के प्रयास को स्वाभाविक रूप से बताती है।
theological_decisions:
- issue: τὸ πνεῦμα का अभिप्राय
  choice: मुख्य पाठ में ‘आत्मा’, जिसका प्रसंगगत अभिप्राय पवित्र आत्मा है
  alternative: ‘पवित्र आत्मा’
  rationale: मूल यूनानी में केवल ‘आत्मा’ है, जबकि पिछले पदों का प्रसंग इसे पवित्र आत्मा के रूप में स्पष्ट करता है। मुख्य पाठ मूल शब्दावली को रखता है और पादटिप्पणी स्पष्ट विकल्प देती है।
- issue: आत्मा दिए जाने में प्रेरितों की भूमिका
  choice: ‘प्रेरितों के हाथ रखने के द्वारा आत्मा दी जाती है’
  alternative: ‘प्रेरित अपने हाथ रखकर आत्मा देते हैं’
  rationale: मूल का कर्मवाच्य और διά द्वारा व्यक्त माध्यम सुरक्षित रखा गया है। इससे प्रेरितों को आत्मा का अंतिम स्रोत ठहराए बिना पद में कही गई साधनात्मक भूमिका व्यक्त होती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘पैसे देने की पेशकश की’ सामान्य पाठक के लिए स्वाभाविक है और मूल क्रिया के प्रसंगगत अर्थ को स्पष्ट करती है।
