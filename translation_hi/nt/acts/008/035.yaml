id: ACT.8.35
reference: Acts 8:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: hi
  text: तब फिलिप्पुस ने मुँह खोला और इसी पवित्र शास्त्र से आरम्भ करके उसे यीशु के बारे में शुभ समाचार सुनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: मुँह खोला
  rationale: यह बोलना आरम्भ करने का मुहावरा है। हिन्दी में ‘मुँह खोला’ यूनानी अभिव्यक्ति और वर्णन की गरिमा को बनाए रखता है और संदर्भ में स्वाभाविक रूप से समझ आता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को आगे बढ़ाता है; ‘तब’ उस क्रम को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: इसी पवित्र शास्त्र से आरम्भ करके
  rationale: ἀπό आरम्भ-बिंदु बताता है। ‘इसी ... से’ निकट संदर्भ में बताए गए शास्त्रीय पाठ को स्पष्ट रूप से इंगित करता है।
- source_word: γραφῆς
  choice: पवित्र शास्त्र
  rationale: नए नियम के इस संदर्भ में γραφή किसी सामान्य लेख के बजाय मान्य पवित्र लेख को सूचित करता है; ‘पवित्र शास्त्र’ आधुनिक हिन्दी में स्पष्ट और प्रतिष्ठित पद है।
- source_word: εὐηγγελίσατο
  choice: शुभ समाचार सुनाया
  rationale: क्रिया का अर्थ शुभ समाचार घोषित करना है। व्यक्तिगत बातचीत के इस प्रसंग में ‘सुनाया’ सहज है और ‘प्रचार किया’ की अपेक्षा कम संस्थागत सुनाई देता है।
- source_word: αὐτῷ
  choice: उसे
  rationale: यह सर्वनाम प्रसंग के इथियोपियाई अधिकारी की ओर संकेत करता है और यूनानी पाठ की सर्वनामात्मक अभिव्यक्ति बनाए रखता है।
- source_word: τὸν Ἰησοῦν
  choice: यीशु का
  rationale: εὐαγγελίζομαι के साथ कर्मकारक यीशु को सुनाए गए शुभ समाचार की विषयवस्तु के रूप में प्रस्तुत करता है। ‘यीशु का शुभ समाचार’ इसे संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν का अर्थ
  choice: उसे यीशु का शुभ समाचार सुनाया
  alternative: उसे यीशु का प्रचार किया
  rationale: यूनानी रचना में यीशु सुसमाचार सुनाने की विषयवस्तु और केंद्र हैं। चुना हुआ अनुवाद यह बात स्वाभाविक हिन्दी में कहता है, बिना किसी अतिरिक्त सांप्रदायिक व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। यूनानी मुहावरे ‘मुँह खोला’ को अर्थगम्य होने के कारण बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई, क्योंकि मुख्य पाठ में अर्थ और वाक्य-संबंध स्पष्ट हैं।
