id: ACT.8.16
reference: Acts 8:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀οὐδέπω γὰρ ἦν ἐπ’ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ ⸀κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/016.yaml
  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: hi
  text: क्योंकि पवित्र आत्मा अब तक उनमें से किसी पर भी नहीं उतरा था; उन्होंने केवल प्रभु यीशु के नाम में बपतिस्मा लिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδέπω
  choice: अब तक ... नहीं
  rationale: यह स्वाभाविक हिन्दी में उस समय तक घटना के न होने का कालगत भाव स्पष्ट करता है।
- source_word: ἐπ’ οὐδενὶ αὐτῶν
  choice: उनमें से किसी पर भी
  rationale: ἐπί के स्थानिक रूपक को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति देता है।
- source_word: ἐπιπεπτωκός
  choice: उतरा था
  rationale: शाब्दिक ‘गिरा था’ हिन्दी में भ्रामक हो सकता है; ‘उतरा था’ पवित्र आत्मा के किसी पर आने के रूपक और पूर्ण क्रिया के परिणामगत भाव को सहज रूप से व्यक्त करता है।
- source_word: μόνον
  choice: केवल
  rationale: आत्मा के उतरने और पहले हो चुके बपतिस्मे के बीच सीमित करने वाला विरोध स्पष्ट करता है।
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: उन्होंने ... बपतिस्मा लिया था
  rationale: परिणामगत अवस्था सहित पहले पूरी हुई क्रिया को स्वाभाविक हिन्दी के पूर्ण भूतकाल में व्यक्त करता है।
- source_word: εἰς τὸ ὄνομα
  choice: के नाम में
  rationale: ‘नाम में बपतिस्मा लेना’ आधुनिक हिन्दी में समझने योग्य है और εἰς की संबद्धता को बिना अस्वाभाविक शब्दशः अनुवाद के व्यक्त करता है।
- source_word: κυρίου Ἰησοῦ
  choice: प्रभु यीशु
  rationale: κύριος की मानक, गरिमापूर्ण हिन्दी ‘प्रभु’ है; पूरा पदनाम स्वाभाविक रूप में रखा गया है।
theological_decisions:
- issue: ἐπιπεπτωκός का निहित कर्ता
  choice: पिछले पद से ‘पवित्र आत्मा’ को स्पष्ट रूप से दोहराया गया है।
  alternative: कर्ता को ‘वह’ के रूप में रखना।
  rationale: यूनानी में कर्ता अनुक्त है, पर पद 15 में पवित्र आत्मा स्पष्ट निकटतम संदर्भ है। हिन्दी में ‘वह’ अस्पष्ट हो सकता है, इसलिए नाम दोहराना अर्थ को स्पष्ट करता है, कोई नया धर्मवैज्ञानिक दावा नहीं जोड़ता।
- issue: बपतिस्मे के नाम-संबंधी वाक्यांश का अर्थ
  choice: ‘प्रभु यीशु के नाम में’
  alternative: ‘प्रभु यीशु के नाम में प्रवेश के लिए’ अथवा अधिक शब्दशः ‘नाम के भीतर’
  rationale: पद को बाद के बपतिस्मा-सूत्र या संस्कार-विषयक विवादों का निर्णय बनाए बिना εἰς τὸ ὄνομα की संबद्धता व्यक्त की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘उतरा था’ को हिन्दी में पवित्र आत्मा के आगमन के लिए स्वाभाविक रूपक माना गया है; ‘गिरा था’ से बचा गया है क्योंकि वह नकारात्मक या दुर्घटनात्मक अर्थ दे सकता है।
