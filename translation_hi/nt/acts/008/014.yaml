source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: hi
  text: जब यरूशलेम में मौजूद प्रेरितों ने सुना कि सामरिया ने परमेश्वर का वचन ग्रहण किया है, तो उन्होंने पतरस और यूहन्ना को उनके पास भेजा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: जब ... ने सुना
  rationale: यह एओरिस्ट कृदन्त मुख्य क्रिया से पहले की परिस्थिति बताता है। हिंदी में ‘जब ... ने सुना’ स्वाभाविक रूप से इसका कालगत संबंध व्यक्त करता है।
- source_word: δὲ
  choice: अलग शब्द के रूप में अनूदित नहीं
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है, प्रबल विरोध नहीं। हिंदी के ‘जब...तो’ वाक्य-विन्यास में प्रवाह स्पष्ट है; ‘अब’ जोड़ने से स्रोत में निहित न होने वाला समय-संकेत उभर सकता था।
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: यरूशलेम में मौजूद प्रेरितों
  rationale: यह प्रेरितों के स्थान को स्पष्ट करता है। ‘मौजूद’ सामान्य आधुनिक हिंदी में स्वाभाविक है और यह अर्थ नहीं जोड़ता कि वे स्थायी रूप से वहीं के थे।
- source_word: δέδεκται
  choice: ग्रहण किया है
  rationale: पूर्णकालिक रूप पूरी हो चुकी स्वीकृति और उसके वर्तमान परिणाम को दर्शाता है। ‘ग्रहण किया है’ उस पक्ष को बनाए रखता है और ‘स्वीकार किया’ की तुलना में पारंपरिक बाइबलीय पदबंध से अधिक निकट है।
- source_word: ἡ Σαμάρεια
  choice: सामरिया
  rationale: यूनानी पाठ स्थान-नाम को वहाँ के लोगों के लिए लक्षणा के रूप में रखता है। स्थान-नाम बनाए रखने से स्रोत की अभिव्यक्ति और उसकी व्यापकता सुरक्षित रहती है।
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: यह परिचित और गरिमापूर्ण बाइबलीय अभिव्यक्ति है, जो घोषित ईश्वरीय संदेश को दर्शाते हुए λόγος की शब्दावली और धर्मवैचारिक अनुगूँज को बनाए रखती है।
- source_word: ἀπέστειλαν
  choice: उन्होंने ... भेजा
  rationale: सरल एओरिस्ट मुख्य क्रिया के लिए ‘भेजा’ सीधा और स्वाभाविक हिंदी रूप है।
- source_word: πρὸς αὐτοὺς
  choice: उनके पास
  rationale: πρός यहाँ सामरिया के संदर्भित लोगों की ओर गमन दर्शाता है। हिंदी में व्यक्तियों के लिए ‘उनके पास’ ‘उनको’ से अधिक स्वाभाविक है।
- source_word: Πέτρον καὶ Ἰωάννην
  choice: पतरस और यूहन्ना
  rationale: व्यक्तिगत नामों के प्रचलित हिंदी बाइबलीय रूप अपनाए गए हैं।
theological_decisions:
- issue: ‘सामरिया’ का लाक्षणिक प्रयोग
  choice: ‘सामरिया ने परमेश्वर का वचन ग्रहण किया है’ बनाए रखा गया।
  alternative: ‘सामरियों ने परमेश्वर का वचन ग्रहण किया है’ या ‘सामरिया के लोगों ने...’
  rationale: यूनानी पाठ क्षेत्र/स्थान का नाम सामूहिक अर्थ में प्रयोग करता है। इसे बनाए रखना स्रोत के अधिक निकट है और अनावश्यक रूप से किसी विशेष जनसमूह तक अर्थ को सीमित नहीं करता।
- issue: λόγος का अनुवाद
  choice: ‘वचन’
  alternative: ‘संदेश’
  rationale: संदर्भ में घोषित संदेश अभिप्रेत है, फिर भी ‘वचन’ मूल शब्द के रूप और परिचित धर्मवैचारिक अनुगूँज को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- issue: δέδεκται का पक्ष
  choice: ‘ग्रहण किया है’
  alternative: ‘ग्रहण किया था’
  rationale: ग्रीक पूर्णकाल पूरी हुई घटना के वर्तमान परिणाम को उभार सकता है। हिंदी में ‘सुना कि ... किया है’ स्वाभाविक है और उस परिणामगत बल को बनाए रखता है; ‘किया था’ कथात्मक पूर्वकाल को अधिक स्पष्ट करता, पर वर्तमान परिणाम को मंद कर सकता था।
translation_notes:
  register: आधुनिक मानक हिंदी, देवनागरी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कोई पादटिप्पणी आवश्यक नहीं है।
