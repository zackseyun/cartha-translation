translation:
  language: hi
  text: तब वे उन पर हाथ रख रहे थे, और वे पवित्र आत्मा प्राप्त कर रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में दोनों क्रियाएँ इम्परफेक्ट रूप में हैं। संदर्भ के अनुसार इन्हें साधारण भूतकाल में भी अनुवाद किया जा सकता है: “तब उन्होंने उन पर हाथ रखे, और उन्हें पवित्र आत्मा मिला।”'
    reason: दोनों इम्परफेक्ट क्रियाओं के पक्षगत अर्थ और एक अधिक मुहावरेदार हिन्दी विकल्प को स्पष्ट करना।
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह स्वाभाविक हिन्दी में समय और कथा-क्रम, दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς
  choice: वे उन पर हाथ रखते थे
  rationale: ‘हाथ रखना’ इस संकेत-क्रिया का प्रचलित और स्वाभाविक हिन्दी रूप है। अपूर्ण भूतकाल ‘रखते थे’ यूनानी इम्परफेक्ट के चलते या बार-बार किए जा रहे कार्य को खुला रखता है।
- source_word: ἐλάμβανον
  choice: वे ... प्राप्त करते थे
  rationale: ‘प्राप्त करते थे’ यूनानी इम्परफेक्ट के अपूर्ण अथवा क्रमशः घटित होते पक्ष को बनाए रखता है और ‘पाना आरम्भ करते थे’ जैसी अनावश्यक आरम्भ-सूचना नहीं जोड़ता।
- source_word: πνεῦμα ἅγιον
  choice: पवित्र आत्मा
  rationale: लूका-प्रेरितों के इस संदर्भ में यह पद परमेश्वर के पवित्र आत्मा को सूचित करता है। मानक हिन्दी मसीही प्रयोग में यहाँ अलग निश्चितता-सूचक शब्द की आवश्यकता नहीं है।
theological_decisions:
- issue: πνεῦμα ἅγιον का निर्देश अनिश्चित किसी पवित्र आत्मा की ओर है या परमेश्वर के पवित्र आत्मा की ओर
  choice: पवित्र आत्मा
  alternative: कोई पवित्र आत्मा
  rationale: तात्कालिक संदर्भ और लूका-प्रेरितों का व्यापक प्रयोग प्रतिज्ञात दिव्य आत्मा को सूचित करता है; ‘कोई पवित्र आत्मा’ अर्थ को गलत रूप से अनिश्चित बना देगा।
- issue: दोनों इम्परफेक्ट क्रियाओं के पक्ष को हिन्दी में कैसे व्यक्त किया जाए
  choice: ‘हाथ रखते थे ... प्राप्त करते थे’
  alternative: ‘हाथ रखे ... पवित्र आत्मा पाया’
  rationale: दोनों ‘-ते थे’ रूप मूल की अपूर्ण, चलती हुई अथवा पुनरावृत्त क्रिया की संभावना सुरक्षित रखते हैं। सरल पूर्ण भूतकाल अधिक स्वाभाविक हो सकता है, पर मूल के पक्षगत तनाव को समतल कर देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘प्राप्त करना’ पवित्र आत्मा के दिए जाने के संदर्भ में स्वाभाविक औपचारिकता रखता है; दोनों सर्वनाम-समूहों की मूलभूत संरचना को अनावश्यक व्याख्या द्वारा नहीं बदला गया।
