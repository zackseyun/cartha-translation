source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἐλυμαίνετο τὴν ἐκκλησίαν κατὰ τοὺς οἴκους εἰσπορευόμενος, σύρων τε ἄνδρας καὶ γυναῖκας παρεδίδου εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: hi
  text: पर शाऊल कलीसिया को उजाड़ रहा था[a]; वह घर-घर में प्रवेश करके[b] पुरुषों और स्त्रियों दोनों को घसीटता और जेल में डाल देता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कलीसिया को बुरी तरह नष्ट कर रहा था।”
    reason: मूल क्रिया हिंसक तबाही या क्रूर दुर्व्यवहार का प्रबल अर्थ रखती है; वैकल्पिक अनुवाद इसकी तीव्रता को दूसरे ढंग से व्यक्त करता है।
  - marker: b
    text: या, “एक के बाद एक घर में प्रवेश करके।”
    reason: यूनानी पदबंध वितरणात्मक है; दोनों रूप अनेक घरों में क्रमशः प्रवेश करने का भाव व्यक्त करते हैं।
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: उजाड़ रहा था
  rationale: यह क्रिया साधारण ‘सताना’ से अधिक प्रबल है और हिंसक, लगातार विनाशकारी व्यवहार का बोध कराती है। अपूर्ण भूतकाल की निरंतरता ‘रहा था’ से व्यक्त होती है।
- source_word: ἐκκλησίαν
  choice: कलीसिया
  rationale: प्रेरितों के काम में यह शब्द विश्वासियों के समुदाय को दर्शाता है; ‘कलीसिया’ हिन्दी बाइबलीय प्रयोग में इसी अर्थ का परिचित शब्द है।
- source_word: κατὰ τοὺς οἴκους
  choice: घर-घर में
  rationale: बहुवचन के साथ κατά का वितरणात्मक अर्थ है—अनेक घरों में क्रमशः जाना। ‘घर-घर में’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰσπορευόμενος
  choice: घुसकर
  rationale: सिर्फ प्रवेश करने के बजाय प्रसंग में बलपूर्वक घरों में जाने का भाव है; ‘घुसकर’ शाऊल की हिंसक कार्रवाई के ढंग को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: σύρων
  choice: घसीट ले जाता
  rationale: σύρω बलपूर्वक घसीटने का अर्थ देता है। ‘ले जाता’ व्यक्तियों को घरों से हटाकर हिरासत में सौंपने का प्रसंगगत भाव स्पष्ट करता है।
- source_word: ἄνδρας καὶ γυναῖκας
  choice: पुरुषों और स्त्रियों दोनों को
  rationale: ‘दोनों’ शाऊल की कार्रवाई के भेदरहित विस्तार पर यूनानी पदबंध के बल को व्यक्त करता है।
- source_word: παρεδίδου
  choice: डलवा देता था
  rationale: यहाँ क्रिया अधिकारियों की हिरासत में सौंपने को दर्शाती है। ‘जेल में डलवा देता था’ स्वाभाविक हिन्दी है और अपूर्ण भूतकाल की बार-बार होने वाली कार्रवाई को भी बनाए रखती है।
- source_word: εἰς φυλακήν
  choice: जेल में
  rationale: φυλακή यहाँ कारावास अथवा हिरासत का स्थान है। ‘जेल में’ आम आधुनिक हिन्दी में स्पष्ट और सहज है।
theological_decisions:
- issue: मन-परिवर्तन से पहले शाऊल की कार्रवाई की तीव्रता
  choice: कलीसिया को उजाड़ रहा था
  alternative: कलीसिया को सता रहा था
  rationale: मूल क्रिया हिंसक और विनाशकारी दुर्व्यवहार का प्रबल चित्र देती है। ‘सता रहा था’ उसके बल को कम कर सकता है, जबकि ‘उजाड़ रहा था’ बाद की किसी धर्मवैज्ञानिक व्याख्या को जोड़े बिना मूल की तीव्रता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कलीसिया’ स्थापित हिन्दी बाइबलीय पद है। ‘घुसकर’, ‘घसीट ले जाता’ और ‘जेल में डलवा देता था’ मूल के हिंसक तथा बार-बार घटित होने वाले कार्य को साधारण पाठक के लिए स्पष्ट करते हैं।
