source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: hi
  text: इसलिए, गंभीरता से गवाही देने और प्रभु का वचन सुनाने के बाद, वे यरूशलेम लौट रहे थे और सामरियों के बहुत-से गाँवों में शुभ समाचार सुना रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: गंभीरता से गवाही दे चुके
  rationale: क्रिया की सशक्त और गंभीर गवाही देने की छाया को व्यक्त करता है, पर इसे केवल चेतावनी देने तक सीमित नहीं करता।
- source_word: λαλήσαντες
  choice: सुना चुके
  rationale: ‘प्रभु का वचन’ प्रत्यक्ष कर्म होने के कारण यह स्वाभाविक हिन्दी में बोलने या सुनाने की क्रिया को स्पष्ट करता है।
- source_word: τὸν λόγον τοῦ κυρίου
  choice: प्रभु का वचन
  rationale: λόγος के लिए प्रचलित बाइबलीय पद ‘वचन’ संदेश और उद्घोषणा—दोनों की अर्थ-सम्भावना बनाए रखता है।
- source_word: ὑπέστρεφον
  choice: लौट रहे थे
  rationale: अपूर्ण भूतकाल की जारी प्रक्रिया को सुरक्षित रखता है।
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: सामरियों के बहुत-से गाँवों में
  rationale: सम्बन्धवाचक यूनानी संरचना और सामरी लोगों के स्पष्ट जातीय उल्लेख को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: εὐηγγελίζοντο
  choice: शुभ समाचार सुनाते जा रहे थे
  rationale: क्रिया के शुभ समाचार घोषित करने के अर्थ और उसके जारी रहने वाले पक्ष को स्पष्ट, गैर-पारिभाषिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: निहित कर्ता की पहचान
  choice: बहुवचन ‘वे’ को बनाए रखा गया है।
  alternative: ‘पतरस और यूहन्ना’ नाम स्पष्ट रूप से जोड़े जा सकते थे।
  rationale: निकटवर्ती प्रसंग पतरस और यूहन्ना की ओर संकेत करता है, पर इस पद के यूनानी पाठ में नाम नहीं हैं; इसलिए अनुवाद पाठ की निहित बहुवचन कर्ता-रचना को बनाए रखता है।
- issue: ‘प्रभु’ का सन्दर्भ
  choice: κυρίου का अनुवाद केवल ‘प्रभु’ किया गया है।
  alternative: सन्दर्भ को स्पष्ट करने के लिए ‘यीशु’ जोड़ा जा सकता था।
  rationale: मूल पाठ सन्दर्भित व्यक्ति का नाम इस पद में नहीं देता; ‘प्रभु’ उसकी धर्मवैचारिक अनुगूँज और पाठगत अस्पष्टता दोनों सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। दो अपूर्ण भूतकालीन क्रियाओं को ‘लौट रहे थे’ और ‘सुनाते जा रहे थे’ से व्यक्त किया गया है, जिससे यात्रा के दौरान जारी प्रचार का स्वाभाविक बोध होता है।
