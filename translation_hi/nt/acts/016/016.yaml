revisions:
- from: एक बार जब हम प्रार्थना के स्थान की ओर जा रहे थे, तो हमें एक दासी मिली, जिसमें पाइथन-आत्मा[a] थी। वह भविष्य बताकर[b] अपने मालिकों को बहुत लाभ कमाकर देती थी।
  to: ऐसा हुआ कि जब हम प्रार्थना के स्थान की ओर जा रहे थे, तो पाइथन-आत्मा[a] वाली एक दासी हमसे मिली। वह भविष्य बताकर[b] अपने मालिकों को बहुत लाभ पहुँचाती थी।
  rationale: The revision retains the draft’s careful handling of the culturally specific expression πνεῦμα πύθωνα and the girl’s enslaved status, while making the girl the explicit subject of the encounter and rendering her provision of profit more closely to the Greek. The footnotes retain alternatives without treating the culturally specific expression as a settled theological description.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:55:21Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the setting, the enslaved girl's encounter with the narrators, her culturally specific πνεῦμα πύθωνα, and the financial benefit she provided through divinatory practice. However, “हमें एक दासी मिली” can make the encounter sound merely incidental rather than portraying the girl as the one who came to meet them. “लाभ कमाकर देती थी” also adds a slightly more specific earning-and-giving construction than παρέχειν, which simply says that she provided profit.
  naturalness: The Hindi is generally modern and clear. “पाइथन-आत्मा” is intentionally unusual but suitably explained by the footnote. Recasting the encounter as “एक दासी हमसे मिली” is more direct and natural while retaining the source’s subject emphasis.
  terminology: “दासी” appropriately reflects παιδίσκη in this context, where multiple masters profit from her. “पाइथन-आत्मा” preserves the culturally specific Greek expression without collapsing it into a doctrinal interpretation. “भविष्य बताकर” is an accessible rendering of μαντευομένη; the lexical alternative footnote appropriately records more formal alternatives.
  issues:
  - severity: medium
    issue: The encounter is phrased as “हमें एक दासी मिली.”
    rationale: Although intelligible, this can foreground the narrators’ finding her rather than the girl’s action of meeting/coming to meet them (ὑπαντῆσαι ἡμῖν). “एक दासी हमसे मिली” better preserves the Greek syntactic and narrative emphasis.
  - severity: low
    issue: “बहुत लाभ कमाकर देती थी” is somewhat more explicit than the source.
    rationale: ἐργασίαν πολλὴν παρεῖχεν means that she provided considerable gain/profit. “बहुत लाभ पहुँचाती थी” states this without adding the particular mechanism of earning and then handing it over.
  revised_text: ऐसा हुआ कि जब हम प्रार्थना के स्थान की ओर जा रहे थे, तो पाइथन-आत्मा[a] वाली एक दासी हमसे मिली। वह भविष्य बताकर[b] अपने मालिकों को बहुत लाभ पहुँचाती थी।
  revised_footnotes:
