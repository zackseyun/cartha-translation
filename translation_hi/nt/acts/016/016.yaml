id: ACT.16.16
reference: Acts 16:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain servant girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: hi
  text: ऐसा हुआ कि जब हम प्रार्थना के स्थान की ओर जा रहे थे, तो पाइथन-आत्मा[a] वाली एक दासी हमसे मिली। वह भविष्य बताकर[b] अपने मालिकों को बहुत लाभ पहुँचाती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “भविष्य बताने वाली आत्मा।” यूनानी में शाब्दिक अभिव्यक्ति “पाइथन-आत्मा” है, जो भविष्य-कथन से जुड़ी एक प्राचीन सांस्कृतिक परंपरा का विशेष पद है।
    reason: alternative_reading
  - marker: b
    text: अथवा “शकुन-विचार करके” या “दैवज्ञता का अभ्यास करके।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: एक बार
  rationale: लूका की घटना-आरंभ करने वाली कथात्मक अभिव्यक्ति को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना अनावश्यक प्राचीन शैली के।
- source_word: πορευομένων ἡμῶν
  choice: जब हम ... जा रहे थे
  rationale: समकालिक और जारी पृष्ठभूमि-क्रिया को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: εἰς τὴν προσευχὴν
  choice: प्रार्थना के स्थान की ओर
  rationale: संदर्भ में केवल प्रार्थना की क्रिया नहीं, बल्कि प्रार्थना के लिए पहचाने गए स्थान का स्थानीय अर्थ सम्भावित है।
- source_word: παιδίσκην τινά
  choice: एक दासी
  rationale: शब्द के स्त्री दास/सेविका-संबंधी अर्थ तथा उसके अनेक मालिकों द्वारा आर्थिक शोषण के संदर्भ को स्पष्ट करता है।
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: जिसमें पाइथन-आत्मा थी
  rationale: यूनानी की सांस्कृतिक रूप से विशिष्ट अभिव्यक्ति को मुख्य पाठ में बनाए रखता है; अर्थ-स्पष्टीकरण पादटिप्पणी में दिया गया है।
- source_word: ὑπαντῆσαι ἡμῖν
  choice: हमें ... मिली
  rationale: मुठभेड़ के अर्थ को सहज हिन्दी कथन में व्यक्त करता है।
- source_word: ἐργασίαν πολλὴν παρεῖχεν
  choice: बहुत लाभ कमाकर देती थी
  rationale: मालिकों को निरंतर मिलने वाले पर्याप्त आर्थिक लाभ और अपूर्ण भूतकाल के जारी भाव को व्यक्त करता है।
- source_word: τοῖς κυρίοις αὐτῆς
  choice: अपने मालिकों को
  rationale: यहाँ κύριοι उन मनुष्यों के लिए है जिनका उस दासी पर स्वामित्व और नियंत्रण था, न कि ईश्वरीय उपाधि के रूप में।
- source_word: μαντευομένη
  choice: भविष्य बताकर
  rationale: भविष्यवाणी-जैसी शकुनविद्या/दैवज्ञता की गतिविधि को साधारण आधुनिक पाठक के लिए सुलभ ढंग से व्यक्त करता है; अधिक औपचारिक विकल्प पादटिप्पणी में है।
theological_decisions:
- issue: सांस्कृतिक रूप से विशिष्ट πνεῦμα πύθωνα का अनुवाद
  choice: पाइथन-आत्मा
  alternative: भविष्य बताने वाली आत्मा / शकुन बताने वाली आत्मा
  rationale: मुख्य पाठ में यूनानी अभिव्यक्ति की विशिष्टता और उससे जुड़ी प्राचीन दैवज्ञ परंपरा को बनाए रखा गया है, न कि उसे केवल उसके कार्य में समतल कर दिया गया है। पादटिप्पणी अर्थ स्पष्ट करती है।
- issue: παιδίσκη में दासता की सामाजिक स्थिति
  choice: दासी
  alternative: सेविका / युवती
  rationale: अनेक मालिकों और उनके आर्थिक लाभ का निकट संदर्भ बंधुआ स्वामित्व तथा शोषण को प्रमुख बनाता है; इसलिए 'दासी' अधिक सटीक है।
translation_notes:
  register: आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण शैली। 'पाइथन-आत्मा' की अपरिचित सांस्कृतिक विशिष्टता जानबूझकर सुरक्षित रखी गई है और पादटिप्पणी से स्पष्ट की गई है।
