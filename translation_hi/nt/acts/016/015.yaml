  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: hi
  text: जब उसका और उसके घराने का बपतिस्मा हुआ, तो उसने हमसे आग्रह किया, “यदि आपने मुझे प्रभु के प्रति विश्वासयोग्य माना है[a], तो मेरे घर आकर ठहरिए।” और उसने हमें मना लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि आप मुझे प्रभु में विश्वास करनेवाली मानते हैं।” यूनानी विशेषण का अर्थ “विश्वासयोग्य,” “भरोसेमंद” या “विश्वास करनेवाली” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: जब उसका और उसके घराने का बपतिस्मा हो गया
  rationale: यूनानी में क्रिया एकवचन है और पहले स्त्री की ओर संकेत करती है, पर καὶ ὁ οἶκος αὐτῆς उसके घराने को भी घटना में सम्मिलित करता है। हिंदी में संयुक्त कर्ता के साथ यह रूप स्वाभाविक है।
- source_word: ὁ οἶκος αὐτῆς
  choice: उसका घराना
  rationale: यहाँ οἶκος भौतिक मकान नहीं, परिवार अथवा गृहस्थ समुदाय को दर्शाता है; ‘घराना’ इस सामाजिक अर्थ को सुरक्षित रखता है।
- source_word: παρεκάλεσεν
  choice: उसने हमसे आग्रह किया
  rationale: παρακαλέω यहाँ विनम्र पर गंभीर अनुरोध का भाव रखता है, जिसे आगे का प्रबल आग्रह भी पुष्ट करता है।
- source_word: Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι
  choice: यदि आपने मुझे प्रभु के प्रति विश्वासयोग्य माना है
  rationale: पूर्णकाल κεκρίκατέ एक स्थापित आकलन व्यक्त करता है। ‘विश्वासयोग्य’ πιστή में निहित विश्वासी होने, निष्ठावान होने और भरोसेमंद होने की अर्थ-सीमा को यथासंभव खुला रखता है।
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου μένετε
  choice: मेरे घर आकर ठहरिए
  rationale: यहाँ οἶκος भौतिक निवास है। कृदंत और आज्ञार्थक क्रिया को स्वाभाविक हिंदी में क्रमिक निमंत्रण के रूप में प्रस्तुत किया गया है।
- source_word: παρεβιάσατο ἡμᾶς
  choice: उसने हमें मना लिया
  rationale: παραβιάζομαι प्रबल आग्रह करके सहमत करा लेने को दर्शाता है। ‘मना लिया’ परिणाम और आग्रह दोनों को व्यक्त करता है, बिना अनुचित बल-प्रयोग का संकेत दिए।
theological_decisions:
- issue: उसके घराने के बपतिस्मे से निकाले जाने वाले सांप्रदायिक निष्कर्ष
  choice: वृत्तांत को सीधे प्रस्तुत करना, बिना घराने के सदस्यों की आयु या व्यक्तिगत विश्वास की स्थिति बताए
  alternative: शिशु-बपतिस्मे अथवा केवल व्यक्तिगत विश्वास की घोषणा करने वालों के बपतिस्मे को पाठ में निहित करना
  rationale: पद केवल यह बताता है कि उसका और उसके घराने का बपतिस्मा हुआ; वह घराने की संरचना या प्रत्येक सदस्य की स्थिति स्पष्ट नहीं करता।
- issue: πιστὴν का अर्थ
  choice: प्रभु के प्रति विश्वासयोग्य
  alternative: प्रभु में विश्वास करनेवाली; प्रभु के सामने भरोसेमंद
  rationale: यूनानी विशेषण विश्वास करने और निष्ठावान अथवा भरोसेमंद होने की परस्पर जुड़ी अर्थ-छटाएँ रख सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘घराना’ और ‘घर’ के द्वारा एक ही यूनानी शब्द के सामाजिक और भौतिक अर्थों में भेद रखा गया है। आदरसूचक बहुवचन ‘आपने/ठहरिए’ समूह को संबोधन और स्वाभाविक विनम्रता—दोनों के अनुकूल है।
