  text: ἔξυπνος δὲ γενόμενος ὁ δεσμοφύλαξ καὶ ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς σπασάμενος ⸀τὴν μάχαιραν ἤμελλεν ἑαυτὸν ἀναιρεῖν, νομίζων ἐκπεφευγέναι τοὺς δεσμίους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: hi
  text: जब जेलर की नींद खुली और उसने जेल के दरवाज़े खुले हुए देखे[a], तो उसने अपनी तलवार खींच ली और अपने आप को मार डालने ही वाला था[b], क्योंकि उसने समझा कि कैदी भाग निकले हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “देखा कि जेल के दरवाज़े खोले जा चुके थे।” यूनानी पूर्णकालिक कृदंत दरवाज़ों की खुली हुई अवस्था पर बल देता है।'
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द μάχαιρα तलवार या खंजर जैसे छोटे धारदार हथियार के लिए प्रयुक्त हो सकता है; यहाँ प्रसंग के अनुसार मानक अनुवाद “तलवार” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: नींद खुली
  rationale: यह विशेषण और कृदंत का मेल जागृत अवस्था में आने को व्यक्त करता है। ‘नींद खुली’ स्वाभाविक आधुनिक हिन्दी है और अचानक जागने का भाव स्पष्ट करती है।
- source_word: δεσμοφύλαξ
  choice: जेलर
  rationale: यह कैदियों और जेल की देखरेख के लिए उत्तरदायी अधिकारी को दर्शाता है। ‘जेलर’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है; ‘पहरेदार’ आवश्यकता से अधिक व्यापक होता।
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: जेल के दरवाज़े खुले हुए देखे
  rationale: पूर्णकालिक कर्मवाच्य कृदंत दरवाज़ों के खुल चुके होने से बनी वर्तमान अवस्था पर बल देता है। ‘खुले हुए’ उस परिणामस्वरूप अवस्था को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: σπασάμενος τὴν μάχαιραν
  choice: अपनी तलवार खींच ली
  rationale: इस संदर्भ में क्रिया और संज्ञा का मेल म्यान से हथियार निकालने को दर्शाता है। μάχαιρα छोटे धारदार हथियार को भी सूचित कर सकता है, पर ‘तलवार’ मानक और प्रसंगानुकूल चयन है।
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: अपने आप को मार डालने ही वाला था
  rationale: ἤμελλεν आसन्नता और ἀναιρεῖν यहाँ प्राण लेने का अर्थ व्यक्त करता है। ‘ही वाला था’ तत्काल होने जा रही क्रिया को स्पष्ट करता है।
- source_word: νομίζων
  choice: क्योंकि उसने समझा
  rationale: कृदंत जेलर की आसन्न आत्महत्या का कारण बताता है और खुले दरवाज़ों से निकाले उसके निष्कर्ष को व्यक्त करता है, निश्चित ज्ञान को नहीं।
- source_word: ἐκπεφευγέναι
  choice: भाग निकले हैं
  rationale: पूर्ण infinitive हिरासत से सफलतापूर्वक निकल जाने को दर्शाता है। हिन्दी की परोक्ष कथन-रचना में ‘भाग निकले हैं’ उसके तत्काल अनुमान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοὺς δεσμίους
  choice: कैदी
  rationale: इस प्रसंग में यह शब्द बंदी बनाए गए व्यक्तियों के लिए है। ‘कैदी’ सामान्य पाठक के लिए सबसे सीधा और स्पष्ट समतुल्य है।
