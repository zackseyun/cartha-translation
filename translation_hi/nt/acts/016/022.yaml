  text: καὶ συνεπέστη ὁ ὄχλος κατ’ αὐτῶν, καὶ οἱ στρατηγοὶ περιρήξαντες αὐτῶν τὰ ἱμάτια ἐκέλευον ῥαβδίζειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/022.yaml
  text: And the crowd rose up together against them[a], and the magistrates, after tearing off their garments, were ordering them to be beaten with rods[b],
translation:
  language: hi
  text: और भीड़ भी उनके विरुद्ध एक साथ उठ खड़ी हुई[a], और नगर-अधिकारियों ने उनके कपड़े फाड़कर उतार दिए और उन्हें छड़ियों से पिटवाने का आदेश देते रहे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भीड़ ने मिलकर उन पर हमला किया।” यूनानी क्रिया भीड़ की सामूहिक शत्रुतापूर्ण कार्रवाई पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: “नगर-अधिकारी” फिलिप्पी के रोमी नगर-प्रशासन के अधिकारियों के लिए प्रयुक्त पद है; अधिक तकनीकी रूप से उन्हें “प्रेटर” कहा जा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: συνεπέστη
  choice: मिलकर उन पर हमला कर दिया
  rationale: यह क्रिया भीड़ की सामूहिक और शत्रुतापूर्ण कार्रवाई व्यक्त करती है; हिंदी में यह वाक्यांश केवल विरोध में उठ खड़े होने की अपेक्षा प्रसंग की हिंसक गति को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὄχλος
  choice: भीड़
  rationale: आधुनिक हिंदी में यह सामान्य और तटस्थ समतुल्य है; ‘उपद्रवी भीड़’ कहना भावावेश को मूल से अधिक स्पष्ट कर देता।
- source_word: κατ’ αὐτῶν
  choice: उन पर
  rationale: इस प्रसंग में κατά का शत्रुतापूर्ण अर्थ है, जिसे ‘हमला’ के साथ ‘उन पर’ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: στρατηγοὶ
  choice: नगर-अधिकारी
  rationale: फिलिप्पी की रोमी नागरिक सत्ता के पदाधिकारियों के लिए यह स्पष्ट और सुबोध हिंदी है; तकनीकी पदनाम का विवरण पादटिप्पणी में दिया गया है।
- source_word: περιρήξαντες
  choice: फाड़कर उतरवा दिए
  rationale: क्रिया कपड़े बलपूर्वक हटाने का बोध देती है और कृदंत की क्रिया मुख्य आदेश से पहले घटती है। हिंदी में कारक ‘उतरवा दिए’ नगर-अधिकारियों द्वारा दंड की तैयारी करवाने का स्वाभाविक अर्थ देता है।
- source_word: αὐτῶν τὰ ἱμάτια
  choice: उनके कपड़े
  rationale: यह पौलुस और सीलास के वस्त्रों को सूचित करता है; ‘कपड़े’ आधुनिक सामान्य हिंदी में स्पष्ट है और ‘वस्त्र’ की अपेक्षा अधिक सहज है।
- source_word: ἐκέλευον
  choice: आज्ञा देते रहे
  rationale: अपूर्ण भूतकालीन रूप आदेश देने की जारी कार्रवाई को व्यक्त कर सकता है; ‘देते रहे’ उस पक्ष को बनाए रखता है।
- source_word: ῥαβδίζειν
  choice: छड़ियों से पिटवाने
  rationale: क्रिया विशेष रूप से छड़ियों से मारने के रोमी शारीरिक दंड को बताती है; ‘कोड़े लगवाने’ से साधन बदल जाता।
