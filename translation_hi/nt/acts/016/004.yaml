  naturalness: The repeated ‘वे’ in ‘तो वे उन्हें’ is unnecessary and slightly cumbersome. Reordering the clause produces more fluent modern standard Hindi while retaining the imperfective, iterative sense.
  terminology: ‘आदेश’ is acceptable for δόγματα in this administrative context, and the footnote appropriately supplies ‘निर्णय’ as an alternative without importing later technical senses of ‘dogma.’ ‘प्रेरित’ and ‘प्राचीन’ are suitable established terms.
  issues:
