  text: ὡς δὲ διεπορεύοντο τὰς πόλεις, ⸀παρεδίδοσαν αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων ⸀καὶ πρεσβυτέρων τῶν ἐν ⸀Ἱεροσολύμοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: hi
  text: जब वे नगरों से होकर जाते थे, तो उन्हें पालन करने के लिए वे आदेश सौंपते थे, जो यरूशलेम के प्रेरितों और प्राचीनों द्वारा तय किए गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεπορεύοντο
  choice: नगरों से होकर जाते थे
  rationale: अपूर्ण काल नगर-नगर जारी यात्रा को व्यक्त करता है; यह प्रयोग मार्ग के बारे में अतिरिक्त निष्कर्ष जोड़े बिना उस निरंतरता को बनाए रखता है।
- source_word: παρεδίδοσαν
  choice: सौंपते जाते थे
  rationale: यह अधिकारपूर्वक प्राप्त निर्णयों को आगे पहुँचाने का भाव देता है, और अपूर्ण काल की बार-बार होती क्रिया भी व्यक्त करता है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: यूनानी पाठ की तरह सर्वनाम ही रखा गया है; ‘विश्वासियों’ या ‘कलीसियाओं’ जैसा स्पष्ट संज्ञा-पद नहीं जोड़ा गया।
- source_word: φυλάσσειν
  choice: पालन करने के लिए
  rationale: यहाँ अर्थ सावधानी से मानने और व्यवहार में बनाए रखने का है, न कि केवल सुरक्षित रखने का।
- source_word: δόγματα
  choice: आदेश
  rationale: यह यरूशलेम की सभा के औपचारिक और प्रामाणिक निर्णयों को दर्शाता है, पर बाद के तकनीकी अर्थ में ‘मत-सिद्धांत’ का संकेत नहीं देता।
- source_word: κεκριμένα
  choice: तय किए गए थे
  rationale: पूर्ण निष्क्रिय कृदंत पहले लिए जा चुके और अब भी प्रभावी निर्णयों को दर्शाता है; हिंदी में यह सहज और स्पष्ट है।
- source_word: ἀποστόλων καὶ πρεσβυτέρων
  choice: प्रेरितों और प्राचीनों
  rationale: प्रेरित और प्राचीन प्रेरितों के काम में इन मान्य अगुवाई की भूमिकाओं के स्थापित और स्वाभाविक हिंदी पद हैं।
- source_word: τῶν ἐν Ἱεροσολύμοις
  choice: यरूशलेम में
  rationale: यह संक्षेप में प्रेरितों और प्राचीनों को यरूशलेम में स्थित बताता है।
- source_word: ὡς δὲ
  choice: जब
  rationale: यह कथानक की प्रगति और साथ-साथ चल रही क्रिया का स्वाभाविक हिंदी कालवाचक संबंध व्यक्त करता है।
theological_decisions:
- issue: यरूशलेम की सभा के निर्णयों का अधिकार
  choice: δόγματα का अनुवाद ‘आदेश’ किया गया है
  alternative: ‘निर्णय’ या ‘विधि-निर्णय’
  rationale: ‘आदेश’ प्रसंग में इन निर्णयों की औपचारिक और पालनयोग्य प्रकृति दिखाता है, लेकिन बाद के कलीसियाई ‘डॉग्मा’ का काल-विपर्यस्त तकनीकी अर्थ नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘सौंपते जाते थे’ दोनों अपूर्ण क्रियाओं की जारी और पुनरावृत्त प्रकृति को व्यक्त करता है; ‘उन्हें’ मूल के सर्वनाम को अनावश्यक रूप से स्पष्ट नहीं करता।
