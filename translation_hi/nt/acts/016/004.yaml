revisions:
- from: जब वे नगरों से होकर जाते थे, तो वे उन्हें पालन करने के लिए वे आदेश[a] सौंपते जाते थे, जो यरूशलेम में प्रेरितों और प्राचीनों द्वारा तय किए गए थे।
  to: जब वे नगरों से होकर जाते थे, तो उन्हें पालन करने के लिए वे आदेश सौंपते थे, जो यरूशलेम के प्रेरितों और प्राचीनों द्वारा तय किए गए थे।
  rationale: Revision removes an unnecessary repeated subject and places ‘उन्हें’ directly with ‘पालन करने के लिए,’ while recasting the Jerusalem locator as ‘यरूशलेम के’ so that it naturally modifies both apostles and elders. The translation otherwise preserves the draft’s faithful rendering of the ongoing actions, the pronominal referent, and the authoritative yet nontechnical force of δόγματα.
  reviewer_model: gpt-5.6-terra
