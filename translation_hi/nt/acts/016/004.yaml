    issue: Unnecessary repetition of ‘वे’
    rationale: Hindi does not need the subject repeated after ‘तो’; removing it improves flow without affecting meaning.
  - severity: low
    issue: Scope of ‘यरूशलेम में’ is potentially less clear in the current word order
    rationale: The Greek locative modifies both ‘apostles’ and ‘elders.’ ‘यरूशलेम के प्रेरितों और प्राचीनों’ clearly presents both groups as the Jerusalem leadership.
  revised_text: जब वे नगरों से होकर जाते थे, तो उन्हें पालन करने के लिए वे आदेश सौंपते थे, जो यरूशलेम के प्रेरितों और प्राचीनों द्वारा तय किए गए थे।
