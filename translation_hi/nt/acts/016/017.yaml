id: ACT.16.17
reference: Acts 16:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are servants of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: hi
  text: वह पौलुस और हमारे पीछे-पीछे चलती रही और पुकार-पुकारकर कहती रही, “ये मनुष्य परमप्रधान परमेश्वर के दास हैं और तुम्हें उद्धार का मार्ग[a] घोषित कर रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उद्धार का एक मार्ग।” यूनानी में “मार्ग” के साथ निश्चित उपपद नहीं है; इसलिए इस पदबंध को निश्चित या अनिश्चित—दोनों अर्थों में समझा जा सकता है।
    reason: मूल यूनानी में निश्चितता की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: पीछे-पीछे चलती रही
  rationale: वर्तमान कृदंत और अपूर्णकालीन मुख्य क्रिया निरंतर या बार-बार होते कार्य को दिखाते हैं; यह हिंदी प्रयोग उस अवधि और पीछा करने के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔκραζεν
  choice: पुकार-पुकारकर कहती रही
  rationale: अपूर्णकाल ऊँची आवाज़ में लगातार या बार-बार बोलने का भाव देता है; दोहरावयुक्त हिंदी रूप इसे बिना अनावश्यक भावनात्मक अर्थ जोड़े व्यक्त करता है।
- source_word: δοῦλοι
  choice: दास
  rationale: यह शब्द परमेश्वर से संबंध, अधीनता और स्वामित्व का प्रबल भाव रखता है। आधुनिक हिंदी में ‘दास’ इस धार्मिक संदर्भ में ‘सेवक’ से अधिक निकट है, फिर भी सहज और गरिमापूर्ण है।
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: परमप्रधान परमेश्वर के
  rationale: ‘परमप्रधान परमेश्वर’ ὕψιστος को एक दिव्य उपाधि के रूप में सुरक्षित रखता है और मानक हिंदी में स्वाभाविक है।
- source_word: καταγγέλλουσιν
  choice: घोषित कर रहे हैं
  rationale: क्रिया सार्वजनिक रूप से संदेश सुनाने या घोषित करने को दर्शाती है; वर्तमान प्रगतिशील रूप यूनानी वर्तमानकाल के चल रहे कार्य को व्यक्त करता है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: सम्प्रदान कारक घोषणा के श्रोताओं को सूचित करता है; बहुवचन का अर्थ प्रसंग से स्पष्ट है।
- source_word: ὁδὸν σωτηρίας
  choice: उद्धार का मार्ग
  rationale: यह स्वाभाविक हिंदी है और यूनानी के लेखरहित पदबंध को अनिवार्य रूप से ‘एक’ अथवा पूर्णतः निश्चित बनाकर नहीं समझाता। वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: ὁδὸν σωτηρίας की निश्चितता
  choice: उद्धार का मार्ग
  alternative: उद्धार का एक मार्ग
  rationale: ὁδόν के साथ यूनानी निश्चित उपपद नहीं है, पर लेखरहित होना अपने आप अनिश्चितता सिद्ध नहीं करता। हिंदी में ‘उद्धार का मार्ग’ अधिक स्वाभाविक है और मूल की संभावित निश्चितता/अनिश्चितता को जबरन नहीं सुलझाता; विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुकार-पुकारकर’ और ‘कहती रही’ निरंतरता को स्पष्ट करते हैं; ‘दास’ परमेश्वर से अधीनता और संबंध के प्रबल भाव को सुरक्षित रखता है।
