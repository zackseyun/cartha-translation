  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। आर्थिक शोषण, बलपूर्वक पकड़ने और सार्वजनिक अधिकारियों के सामने ले जाने की गति को स्पष्ट रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
