  text: Ἰδόντες δὲ οἱ κύριοι αὐτῆς ὅτι ἐξῆλθεν ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν ἐπιλαβόμενοι τὸν Παῦλον καὶ τὸν Σιλᾶν εἵλκυσαν εἰς τὴν ἀγορὰν ἐπὶ τοὺς ἄρχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/019.yaml
  text: But when her masters saw that their hope of profit had gone out[a], they seized Paul and Silas and dragged them into the marketplace before the rulers[b],
translation:
  language: hi
  text: लेकिन जब उसके मालिकों ने देखा कि उनकी कमाई की आशा समाप्त हो गई थी[a], तो उन्होंने पौलुस और सीलास को पकड़ लिया और उन्हें घसीटकर बाज़ार में अधिकारियों के सामने ले गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके लाभ की आशा।” यूनानी वाक्यांश का शाब्दिक अर्थ “उनकी कमाई/लाभ की आशा” है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “अधिकारी” के लिए प्रयुक्त शब्द नागरिक शासकों का एक सामान्य शब्द है; अगले पद में अधिक विशिष्ट पदनाम प्रयुक्त हुआ है, जिसका अनुवाद प्रायः “न्यायाधिकारी” किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: उसके मालिकों
  rationale: संदर्भ में यह पद दासी पर स्वामित्व और नियंत्रण रखने वालों को दर्शाता है। ‘मालिक’ आधुनिक हिन्दी में उस सामाजिक और आर्थिक शोषण को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐξῆλθεν
  choice: जाती रही
  rationale: शाब्दिक ‘निकल गई’ का बिंब निकटवर्ती प्रसंग में अशुद्ध आत्मा के निकलने के साथ शब्द-प्रतिध्वनि रखता है, किंतु हिन्दी में ‘कमाई की आशा निकल गई’ अस्वाभाविक है। ‘जाती रही’ आशा के समाप्त हो जाने का अर्थ स्वाभाविक ढंग से देता है।
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: उनकी कमाई की आशा
  rationale: ἐλπίς की ‘आशा’ को बनाए रखते हुए ἐργασία को यहाँ सामान्य काम नहीं, बल्कि उससे होने वाली आय/कमाई के अर्थ में लिया गया है। यह मालिकों की आर्थिक प्रेरणा को साफ रखता है।
- source_word: ἐπιλαβόμενοι
  choice: उन्होंने ... पकड़ लिया
  rationale: यह कृदन्त बलपूर्वक हाथ डालने को दर्शाता है। ‘पकड़ लिया’ हिन्दी में शत्रुतापूर्ण गिरफ्त को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: εἵλκυσαν
  choice: घसीटकर ... ले गए
  rationale: क्रिया बलपूर्वक खींचने का भाव देती है। ‘घसीटकर ले गए’ हिन्दी में गति और जबरदस्ती दोनों स्पष्ट करती है।
- source_word: ἀγορὰν
  choice: चौक
  rationale: ἀγορά नगर के सार्वजनिक बाजार/नागरिक चौक को दर्शाता है। ‘चौक’ संक्षिप्त और स्वाभाविक है; पादटिप्पणी सार्वजनिक-न्यायिक संदर्भ स्पष्ट करती है।
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: अधिकारियों के सामने
  rationale: ἄρχοντες नागरिक शासनाधिकारियों के लिए सामान्य शब्द है। ‘अधिकारी’ अगले पद के अधिक विशिष्ट पदनाम को पहले से आरोपित किए बिना व्यापक अर्थ बनाए रखता है।
