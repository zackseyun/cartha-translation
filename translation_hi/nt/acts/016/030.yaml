  text: καὶ προαγαγὼν αὐτοὺς ἔξω ἔφη· Κύριοι, τί με δεῖ ποιεῖν ἵνα σωθῶ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/030.yaml
  text: And after bringing them outside[a], he said, “Sirs[b], what must I do so that I may be saved?”
translation:
  language: hi
  text: और उन्हें बाहर लाकर उसने कहा, “सज्जनो[a], मुझे क्या करना आवश्यक है ताकि मेरा उद्धार हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में संबोधन बहुवचन है और इसका अर्थ यहाँ आदरपूर्वक ‘सज्जनो’ है, दिव्य उपाधि ‘प्रभु’ नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: προαγαγὼν αὐτοὺς ἔξω
  choice: उन्हें बाहर लाकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई क्रिया बताता है; यह रूप घटनाक्रम को स्वाभाविक और संक्षिप्त हिंदी में रखता है।
- source_word: ἔφη
  choice: उसने कहा
  rationale: कथात्मक प्रसंग में यह अपूर्णकालीन रूप सामान्य वचन-परिचायक के रूप में प्रयुक्त है; हिंदी में सरल भूतकाल स्वाभाविक है।
- source_word: Κύριοι
  choice: सज्जनो
  rationale: यह κύριος का संबोधन बहुवचन है और यहाँ पौलुस तथा सीलास के लिए आदरपूर्ण सामाजिक संबोधन है, दिव्य उपाधि नहीं। ‘सज्जनो’ बहुवचन और सम्मान—दोनों को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: τί με δεῖ ποιεῖν
  choice: मुझे क्या करना आवश्यक है
  rationale: δεῖ की आवश्यकता की शक्ति को ‘आवश्यक है’ स्पष्ट रूप से व्यक्त करता है, जबकि प्रश्न हिंदी में सहज बना रहता है।
- source_word: ἵνα σωθῶ
  choice: ताकि मेरा उद्धार हो
  rationale: ‘ताकि’ ἵνα की उद्देश्य/परिणाम-संबंधी संरचना को बनाए रखता है और ‘मेरा उद्धार हो’ σωθῶ के निष्क्रिय भाव को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: σωθῶ का अर्थ
  choice: मेरा उद्धार हो
  alternative: मैं बचाया जाऊँ / मेरा बचाव हो
  rationale: संदर्भ में प्रश्न अगले पद के विश्वास-संबंधी उत्तर की ओर ले जाता है, इसलिए ‘उद्धार’ उपयुक्त है; फिर भी अनुवाद यह निर्धारित नहीं करता कि वक्ता उस क्षण इस शब्द की पूरी धार्मिक गहराई कितना समझता था।
- issue: Κύριοι का संबोधन
  choice: सज्जनो
  alternative: प्रभुओ / स्वामियो
  rationale: बहुवचन संबोधन पौलुस और सीलास के प्रति सामाजिक आदर व्यक्त करता है। इसे ‘प्रभु’ कहना इस प्रसंग में अनावश्यक दिव्य अर्थ ला सकता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और कथात्मक है। ‘सज्जनो’ दो व्यक्तियों के लिए बहुवचन संबोधन को स्पष्ट रखता है; ‘आवश्यक है’ प्रश्न में निहित बाध्यता को और ‘ताकि मेरा उद्धार हो’ मूल उद्देश्य-वाक्य तथा निष्क्रिय भाव को सुरक्षित रखते हैं।
