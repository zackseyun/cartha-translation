id: ACT.16.12
reference: Acts 16:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: hi
  text: और वहाँ से हम फिलिप्पी[a] पहुँचे, जो मकिदुनिया के उस क्षेत्र का एक प्रमुख नगर और रोमी उपनिवेश[b] था। हम उस नगर में कुछ दिन ठहरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मकिदुनिया के उस क्षेत्र का पहला नगर।” यूनानी वाक्यांश कठिन है; “पहला” पद, प्रमुखता या क्रम का संकेत दे सकता है।
    reason: alternative_reading
  - marker: b
    text: अर्थात रोमी शासन के अधीन विशेष दर्जा पाया हुआ नगर।
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν εἰς Φιλίππους
  choice: और वहाँ से हम फिलिप्पी पहुँचे
  rationale: यूनानी में यात्रा की पूर्ववर्ती क्रिया निहित है; हिन्दी में स्वाभाविक और स्पष्ट वाक्य के लिए ‘हम ... पहुँचे’ रखा गया है। κἀκεῖθεν का संयोजक और स्थानवाचक बल ‘और वहाँ से’ में सुरक्षित है।
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: मकिदुनिया के उस क्षेत्र का एक प्रमुख नगर
  rationale: πρώτη का अर्थ यहाँ पद, प्रमुखता या क्रम में ‘पहला’ हो सकता है और वाक्यांश ऐतिहासिक तथा व्याकरणिक रूप से कठिन है। ‘एक प्रमुख नगर’ संभावित प्रमुखता को व्यक्त करता है, पर निर्विवाद प्रशासनिक राजधानी होने का दावा नहीं करता। μερίς के लिए ‘क्षेत्र’ सहज आधुनिक हिन्दी है।
- source_word: κολωνία
  choice: रोमी उपनिवेश
  rationale: यह शब्द फिलिप्पी की औपचारिक रोमी उपनिवेशीय स्थिति बताता है। केवल ‘उपनिवेश’ की अपेक्षा ‘रोमी उपनिवेश’ ऐतिहासिक आशय स्पष्ट करता है।
- source_word: ἦμεν ... διατρίβοντες
  choice: हम ... ठहरे
  rationale: यह परिप्रयुक्त रचना किसी स्थान पर कुछ समय बने रहने को दर्शाती है; ‘ठहरे’ हिन्दी यात्रा-वृत्तांत में स्वाभाविक है और अवधि का भाव बनाए रखता है।
- source_word: ἡμέρας τινάς
  choice: कुछ दिन
  rationale: यह अनिश्चित अवधि को व्यक्त करता है; ‘कुछ दिन’ बिना अनावश्यक सटीकता के मूल अर्थ देता है।
theological_decisions:
- issue: फिलिप्पी के वर्णन में πρώτη का अर्थ
  choice: मुख्य पाठ में ‘एक प्रमुख नगर’
  alternative: ‘उस क्षेत्र का पहला नगर’
  rationale: मूल वाक्यांश अस्पष्ट है और πρώτη पद, प्रसिद्धि अथवा क्रम का संकेत दे सकता है। मुख्य पाठ संभावित प्रमुखता को सहज हिन्दी में रखता है, जबकि पादटिप्पणी शाब्दिक विकल्प और वास्तविक अस्पष्टता सुरक्षित रखती है। यह ऐतिहासिक-व्याख्यात्मक प्रश्न है, कोई संप्रदायगत निष्कर्ष नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मकिदुनिया’ और ‘फिलिप्पी’ प्रचलित हिन्दी बाइबलीय नामरूप हैं। पहले खंड में हिन्दी की स्पष्टता के लिए निहित गति-क्रिया ‘पहुँचे’ जोड़ी गई है; मूल की पहली-पुरुष बहुवचन यात्रा-भूमिका संदर्भ से सुरक्षित रहती है।
