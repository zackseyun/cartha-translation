source:
  edition: SBLGNT
  text: καὶ ὅραμα ⸀διὰ νυκτὸς ⸂τῷ Παύλῳ ὤφθη⸃, ἀνὴρ ⸂Μακεδών τις ἦν⸃ ἑστὼς ⸀καὶ παρακαλῶν αὐτὸν καὶ λέγων· Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: hi
  text: रात में[a] पौलुस को एक दर्शन दिखाई दिया। मकिदुनिया का एक पुरुष[b] खड़ा था और पौलुस से आग्रह कर रहा था, “पार होकर मकिदुनिया आ[c] और हमारी सहायता कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रात के समय” अथवा “रात को।”
    reason: lexical_alternative
  - marker: b
    text: या “एक मकिदुनी पुरुष।”
    reason: lexical_alternative
  - marker: c
    text: यूनानी में शाब्दिक रूप से, “मकिदुनिया में पार होकर हमारी सहायता कर”; हिन्दी में “पार होकर मकिदुनिया आ” कृदन्त और आज्ञा के संयुक्त भाव को स्वाभाविक ढंग से व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅραμα
  choice: दर्शन
  rationale: प्रेरितों के काम के इस कथात्मक संदर्भ में यह परमेश्वर की ओर से दिखाए गए दृश्य का सामान्य और स्वाभाविक हिन्दी शब्द है; यह अनुभव का स्वरूप अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: διὰ νυκτός
  choice: रात में
  rationale: यह समयसूचक यूनानी पदबंध का सहज आधुनिक हिन्दी रूप है और बताता है कि दर्शन रात के दौरान हुआ।
- source_word: τῷ Παύλῳ ὤφθη
  choice: पौलुस को ... दिखाई दिया
  rationale: ὁράω के कर्मवाच्य रूप और सम्प्रदान कारक का स्वाभाविक हिन्दी अनुवाद है; यह न तो केवल पौलुस की मानसिक धारणा कहता है, न दृश्य के सटीक स्वरूप को परिभाषित करता है।
- source_word: ἀνὴρ Μακεδών τις
  choice: मकिदुनिया का एक पुरुष
  rationale: ἀνήρ को लिंग-विशिष्ट ‘पुरुष’ से व्यक्त किया गया है और τις की अनिश्चितता ‘एक’ में बनी रहती है।
- source_word: ἑστώς
  choice: खड़ा
  rationale: दर्शन में पुरुष की खड़ी मुद्रा को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: παρακαλῶν
  choice: आग्रह कर रहा था
  rationale: यह सहायता की गंभीर अपील व्यक्त करता है, पर ‘गिड़गिड़ाना’ जैसे अधिक तीव्र भाव को पाठ में नहीं जोड़ता।
- source_word: λέγων
  choice: प्रत्यक्ष कथन द्वारा व्यक्त
  rationale: हिन्दी में ‘आग्रह कर रहा था’ के तुरंत बाद उद्धरण देना ‘कहते हुए’ की अपेक्षा अधिक सहज है और वही अर्थ व्यक्त करता है।
- source_word: Διαβάς
  choice: पार होकर ... आ
  rationale: आदेश के साथ प्रयुक्त अओरिस्ट कृदन्त की क्रमिक/सहगामी शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है और पार आने की धारणा बनाए रखता है।
- source_word: εἰς Μακεδονίαν
  choice: मकिदुनिया आ
  rationale: गंतव्य की ओर और उसके भीतर आने की गति को हिन्दी के स्वाभाविक प्रयोग में व्यक्त करता है।
- source_word: βοήθησον ἡμῖν
  choice: हमारी सहायता कर
  rationale: यह सीधे आदेशात्मक निवेदन का स्पष्ट, गरिमापूर्ण और सामान्य हिन्दी रूप है।
theological_decisions:
- issue: ὅραμα और ὤφθη द्वारा वर्णित अनुभव का स्वरूप
  choice: पौलुस को दिखाई दिए वास्तविक दर्शन के रूप में अनुवाद, पर उसके सटीक अनुभवात्मक स्वरूप को अनिर्धारित रखना
  alternative: स्वप्न, आंतरिक अनुभूति, या वस्तुगत प्राकट्य के रूप में स्पष्ट करना
  rationale: पाठ इसे ‘दर्शन’ कहता है जो पौलुस को ‘दिखाई दिया’; अनुवाद इसी दावे को रखता है, पर रात में होने के कारण इसे स्वप्न नहीं कहता और न उसके प्राकट्य की विधि तय करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘मकिदुनिया’ प्रचलित हिन्दी बाइबलीय स्थान-नाम है। प्रत्यक्ष कथन में एक व्यक्ति को संबोधित करने वाले एकवचन आदेश ‘आ’ और ‘कर’ मूल यूनानी के एकवचन रूपों को सुरक्षित रखते हैं।
