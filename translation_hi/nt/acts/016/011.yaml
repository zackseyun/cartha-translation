lexical_decisions:
- source_word: Ἀναχθέντες
  choice: समुद्र में निकले
  rationale: नौवहन के संदर्भ में ἀνάγω का अर्थ जहाज़ से समुद्र में निकलना या यात्रा आरंभ करना है। यह हिंदी प्रयोग अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: οὖν पिछले प्रसंग से परिणाम या कथात्मक प्रगति दर्शाता है। ‘इसलिए’ उस संबंध को व्यक्त करता है।
- source_word: ἀπὸ Τρῳάδος
  choice: त्रोआस से
  rationale: ἀπό प्रस्थान-बिंदु बताता है और Τρῳάς का निकट स्रोताधारित हिंदी लिप्यंतरण ‘त्रोआस’ है।
- source_word: εὐθυδρομήσαμεν
  choice: सीधे ... पहुँचे
  rationale: क्रिया का अर्थ सीधा समुद्री मार्ग लेना है। ‘सीधे ... पहुँचे’ हिंदी में यात्रा की सीधी दिशा और सफल गमन दोनों को सहज रूप से व्यक्त करता है।
- source_word: εἰς Σαμοθρᾴκην
  choice: समोथ्राके पहुँचे
  rationale: εἰς गंतव्य दर्शाता है; Σαμοθρᾴκη का स्रोत के निकट देवनागरी लिप्यंतरण ‘समोथ्राके’ रखा गया है।
- source_word: τῇ δὲ ἐπιούσῃ
  choice: अगले दिन
  rationale: यह कालवाचक पद अगले या उसके बाद आने वाले दिन को दर्शाता है; δέ से आगे बढ़ती कथा हिंदी में विरामचिह्न और अगले वाक्यांश से स्वाभाविक रूप में व्यक्त है।
- source_word: εἰς Νέαν Πόλιν
  choice: नेआपोलिस पहुँचे
  rationale: यह नगर का नाम है, इसलिए अर्थानुवाद ‘नया नगर’ के बजाय लिप्यंतरण किया गया है; εἰς को हिंदी की गंतव्यसूचक रचना में व्यक्त किया गया है।
