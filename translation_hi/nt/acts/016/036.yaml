source:
  edition: SBLGNT
  text: ἀπήγγειλεν δὲ ὁ δεσμοφύλαξ τοὺς λόγους ⸀τούτους πρὸς τὸν Παῦλον, ὅτι Ἀπέσταλκαν οἱ στρατηγοὶ ἵνα ἀπολυθῆτε· νῦν οὖν ἐξελθόντες πορεύεσθε ἐν εἰρήνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: hi
  text: तब जेलर ने पौलुस को यह संदेश सुनाया, “नगर-अधिकारियों[a] ने आदेश भेजा है कि आपको रिहा कर दिया जाए। इसलिए अब बाहर आइए और शांति से चले जाइए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नगर-अधिकारियों” यूनानी शब्द στρατηγοί का अनुवाद है। फिलिप्पी की रोमी उपनिवेशी व्यवस्था में यह नगर के प्रमुख शासकीय अधिकारियों की पदवी थी; अधिक तकनीकी रूप में इन्हें “प्रेटर” कहा जा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: संदेश सुनाया
  rationale: क्रिया किसी से मिली सूचना को आगे पहुँचाने को दर्शाती है; प्रसंग में यह स्वाभाविक हिंदी है।
- source_word: ὁ δεσμοφύλαξ
  choice: जेलर
  rationale: यहाँ अर्थ कारागार के प्रभारी व्यक्ति से है; ‘जेलर’ आधुनिक हिंदी में संक्षिप्त और स्पष्ट है।
- source_word: τοὺς λόγους τούτους
  choice: यह संदेश
  rationale: शाब्दिक ‘ये बातें’ संभव है, पर यहाँ आधिकारिक सूचना के लिए ‘यह संदेश’ अधिक स्वाभाविक है।
- source_word: Ἀπέσταλκαν
  choice: आदेश भेजा है
  rationale: यूनानी पूर्णकाल पूरी हो चुकी और वर्तमान में प्रभावी कार्रवाई दर्शाता है; कर्म निहित है और ἵνα-वाक्य आदेश की विषयवस्तु बताता है।
- source_word: οἱ στρατηγοὶ
  choice: नगर-अधिकारी
  rationale: फिलिप्पी के नागरिक शासकीय अधिकारियों के लिए सुबोध शब्द; तकनीकी पदवी को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἵνα ἀπολυθῆτε
  choice: कि आपको रिहा कर दिया जाए
  rationale: कर्मवाच्य रूप हिरासत से मुक्त किए जाने को दर्शाता है और बहुवचन संबोधन को आदरसूचक हिंदी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: νῦν οὖν
  choice: इसलिए अब
  rationale: निष्कर्षसूचक οὖν और कालसूचक νῦν दोनों का बल सहज हिंदी में सुरक्षित रहता है।
- source_word: ἐξελθόντες πορεύεσθε
  choice: बाहर आइए और ... चले जाइए
  rationale: कृदंत और आज्ञार्थक क्रिया की क्रमिक कार्रवाई को स्वाभाविक संयुक्त निर्देश के रूप में प्रस्तुत किया गया है।
- source_word: ἐν εἰρήνῃ
  choice: शांति से
  rationale: यह विदाई-सूचक पदबंध बिना बाधा या संघर्ष के जाने का भाव देता है; ‘शांति से’ आधुनिक हिंदी में सहज है।
