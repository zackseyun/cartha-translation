  register: आधुनिक मानक हिंदी; आदरसूचक बहुवचन बनाए रखा गया है। वाक्य को सामान्य पाठक के लिए सहज रखा गया है, जबकि आधिकारिक संदेश और रोमी नागरिक पद की ऐतिहासिक पृष्ठभूमि सुरक्षित है।
