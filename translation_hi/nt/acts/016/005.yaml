base_translation:
  language: en
  yaml_path: translation/nt/acts/016/005.yaml
  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: hi
  text: इस प्रकार कलीसियाएँ विश्वास[a] में दृढ़ होती जाती थीं और उनकी संख्या दिन-प्रतिदिन बढ़ती जाती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विश्वास में’ का अर्थ यहाँ साझा मसीही विश्वास—उसकी मान्यताओं और जीवन-पद्धति—में दृढ़ होना हो सकता है; अथवा अधिक सामान्य रूप से विश्वास में दृढ़ होना।
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: इस प्रकार
  rationale: यह पद पिछले वृत्तांत का परिणामसूचक और संक्रमणात्मक सार प्रस्तुत करता है। ‘इस प्रकार’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκκλησίαι
  choice: कलीसियाएँ
  rationale: प्रेरितों के काम में यह शब्द स्थानीय मसीही समुदायों के लिए प्रयुक्त है; ‘कलीसियाएँ’ हिन्दी बाइबलीय प्रयोग में मानक और स्पष्ट है।
- source_word: ἐστερεοῦντο
  choice: दृढ़ होती गईं
  rationale: अपूर्णकालीन कर्मवाच्य निरंतर चल रही प्रक्रिया बताता है। यह रूप बढ़ती हुई दृढ़ता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῇ πίστει
  choice: विश्वास में
  rationale: सप्रत्यय संज्ञा यहाँ सम्भवतः मसीही विश्वास के सामुदायिक जीवन और मान्यताओं की ओर संकेत करती है, पर हिन्दी में ‘विश्वास में’ वस्तुगत और व्यक्तिगत दोनों अर्थों की वास्तविक सम्भावना को खुला रखता है।
- source_word: ἐπερίσσευον
  choice: बढ़ती गई
  rationale: अपूर्णकालीन क्रिया निरंतर वृद्धि दर्शाती है; ‘बढ़ती गई’ उसके प्रगतिशील भाव को स्पष्ट रखती है।
- source_word: τῷ ἀριθμῷ
  choice: उनकी संख्या
  rationale: यूनानी संबंध-दत्तिव संख्यात्मक दृष्टि से वृद्धि बताता है। हिन्दी में कर्ता बदलकर ‘उनकी संख्या ... बढ़ती गई’ सबसे सहज और अर्थसटीक है।
- source_word: καθ’ ἡμέραν
  choice: दिन-प्रतिदिन
  rationale: यह वितरणात्मक पद लगातार प्रत्येक दिन होने वाली वृद्धि का भाव सुरक्षित रखता है।
theological_decisions:
- issue: सप्रत्यय πίστις का अर्थ
  choice: मुख्य पाठ में ‘विश्वास में’, जो सामुदायिक मसीही विश्वास को प्राथमिक रूप से व्यक्त करते हुए अर्थगत खुलापन बनाए रखता है
  alternative: ‘मसीही विश्वास में’ या केवल व्यक्तिगत भरोसे के अर्थ में ‘अपने विश्वास में’
  rationale: सप्रत्यय रूप और कलीसियाई संदर्भ साझा मसीही विश्वास की ओर झुकते हैं, किन्तु यह वाक्यांश विश्वासियों के व्यक्तिगत विश्वास को पूरी तरह बाहर नहीं करता। इसलिए मुख्य पाठ में किसी एक अर्थ को अनावश्यक रूप से सीमित नहीं किया गया और पादटिप्पणी में तनाव स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामुदायिक पाठ के अनुकूल शैली। समानांतर अपूर्णकालीन क्रियाओं को ‘होती गईं’ और ‘बढ़ती गई’ से व्यक्त किया गया है।
