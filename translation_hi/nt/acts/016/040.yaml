  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: hi
  text: जेल से बाहर निकलकर वे लुदिया के यहाँ गए। वहाँ भाइयों[a] को देखकर उन्होंने उनका हौसला बढ़ाया और फिर वे रवाना हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भाइयों और बहनों।” यूनानी शब्द पुल्लिंग बहुवचन है, पर वह स्त्री-पुरुष दोनों विश्वासियों के समूह के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες ἀπὸ τῆς φυλακῆς
  choice: जेल से बाहर निकलकर
  rationale: पूर्वकालिक कृदंत मुख्य क्रिया से पहले की घटना बताता है; यह हिंदी में क्रम को स्वाभाविक और स्पष्ट रखता है। निश्चित कारागार के लिए संदर्भानुकूल सामान्य शब्द ‘जेल’ चुना गया है।
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: वे लुदिया के यहाँ गए
  rationale: व्यक्ति के साथ प्रयुक्त यह यूनानी रचना उससे मिलने उसके स्थान पर जाने का भाव देती है। ‘लुदिया के यहाँ’ स्वाभाविक हिंदी है और मूल में स्पष्ट रूप से न आए ‘घर’ को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἰδόντες
  choice: देखकर
  rationale: अओरिस्ट कृदंत को पूर्वकालिक क्रिया के रूप में रखा गया है, जिससे भाइयों को देखने और फिर उनका उत्साह बढ़ाने का क्रम बना रहता है।
- source_word: παρεκάλεσαν
  choice: हौसला बढ़ाया
  rationale: यहाँ क्रिया सांत्वना, प्रोत्साहन या आग्रह का व्यापक भाव रख सकती है। बंदीगृह से रिहाई के बाद विश्वासियों को दृढ़ करने के प्रसंग में ‘हौसला बढ़ाया’ सहज है और अर्थ को केवल सांत्वना या आदेश तक सीमित नहीं करता।
- source_word: τοὺς ἀδελφούς
  choice: भाइयों[a]
  rationale: मुख्य पाठ यूनानी के पुल्लिंग बहुवचन रूप को दर्शाता है; पादटिप्पणी स्पष्ट करती है कि इसका आशय स्त्री-पुरुष दोनों विश्वासियों से हो सकता है।
- source_word: ἐξῆλθαν
  choice: रवाना हो गए
  rationale: यह सरल प्रस्थान-सूचक क्रिया है। ‘रवाना हो गए’ आरंभ के ‘बाहर निकलकर’ की पुनरावृत्ति से बचता है और यह अनिर्णीत रहने देता है कि तत्काल बल लुदिया के स्थान से निकलने पर है या नगर से प्रस्थान पर।
theological_decisions:
- issue: संभावित मिश्रित विश्वासी समूह के लिए ἀδελφοί का अनुवाद
  choice: भाइयों[a]
  alternative: भाइयों और बहनों; विश्वासियों
  rationale: मुख्य पाठ में मूल के व्याकरणिक पुल्लिंग रूप को बनाए रखा गया है, जबकि पादटिप्पणी उसके संभावित समावेशी अर्थ को सुरक्षित रखती है। इससे लुदिया और अन्य स्त्री विश्वासियों की संभावित उपस्थिति न तो नकारी जाती है, न ही मूल रूप चुपचाप बदला जाता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘लुदिया के यहाँ’ बोलचाल में समझ आने वाला है, फिर भी कथात्मक शिष्टता बनाए रखता है। ‘हौसला बढ़ाया’ सामान्य पाठक के लिए ‘प्रोत्साहित किया’ से अधिक स्वाभाविक है।
