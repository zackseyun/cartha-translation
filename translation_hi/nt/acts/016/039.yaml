source:
  edition: SBLGNT
  text: καὶ ἐλθόντες παρεκάλεσαν αὐτούς, καὶ ἐξαγαγόντες ἠρώτων ⸂ἀπελθεῖν ἀπὸ⸃ τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/039.yaml
  text: And they came and appealed to them[a], and after leading them out[b], they asked them to leave the city.
translation:
  language: hi
  text: तब उन्होंने आकर पौलुस और सीलास से विनती की[a]; और उन्हें बाहर ले जाने के बाद वे उनसे नगर छोड़कर चले जाने का अनुरोध करते रहे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आग्रह किया” अथवा “अनुनय किया।” यूनानी क्रिया का अर्थ अन्य संदर्भों में “सांत्वना देना” भी हो सकता है, पर यहाँ अधिकारियों के दुर्व्यवहार के बाद इसका भाव संभवतः मेल-मिलाप के लिए की गई नम्र विनती है।
    reason: lexical_alternative
  - marker: b
    text: “अनुरोध करते रहे”—यूनानी में क्रिया अपूर्ण भूतकाल में है, जो लगातार या बार-बार किए गए अनुरोध का संकेत दे सकती है; इसका अनुवाद “अनुरोध किया” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: तब उन्होंने आकर
  rationale: अओरिस्ट कृदंत अधिकारियों के आने और फिर विनती करने का क्रम दिखाता है; यह हिंदी में स्वाभाविक और संक्षिप्त है।
- source_word: παρεκάλεσαν
  choice: विनती की
  rationale: यहाँ παρακαλέω का भाव दुर्व्यवहार के बाद मेल-मिलाप और नम्र आग्रह का है; ‘विनती की’ इस संदर्भ में ‘समझाया’ या ‘सांत्वना दी’ से अधिक उपयुक्त है।
- source_word: αὐτούς
  choice: पौलुस और सीलास से
  rationale: ग्रीक सर्वनाम का संदर्भ स्पष्ट करने के लिए नाम दिए गए हैं; इससे आधुनिक हिंदी पाठक के लिए कर्ता और कर्म की अस्पष्टता दूर होती है।
- source_word: ἐξαγαγόντες
  choice: उन्हें बाहर ले जाने के बाद
  rationale: अओरिस्ट कृदंत शारीरिक रूप से बाहर ले जाने और उसके बाद किए गए अनुरोध का क्रम व्यक्त करता है।
- source_word: ἠρώτων
  choice: अनुरोध करते रहे
  rationale: अपूर्ण भूतकाल का रूप जारी या बार-बार किए जा रहे नम्र आग्रह की संभावना रखता है; ‘करते रहे’ उस पहलू को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἀπελθεῖν ἀπὸ τῆς πόλεως
  choice: नगर छोड़कर चले जाने का
  rationale: यह वाक्यांश नगर से प्रस्थान करने के अनुरोध की विषय-वस्तु बताता है; हिंदी में यह सहज और अर्थ-सटीक है।
