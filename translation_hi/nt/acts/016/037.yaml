id: ACT.16.37
reference: Acts 16:37
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: hi
  text: पर पौलुस ने उनसे कहा, “उन्होंने हमें—रोमी नागरिक होते हुए भी—बिना दोषी ठहराए[a] सार्वजनिक रूप से पीटा और जेल में डाल दिया; और अब वे हमें चुपके से बाहर निकाल रहे हैं? बिलकुल नहीं! वे स्वयं आकर हमें बाहर ले जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बिना मुकदमा चलाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δείραντες
  choice: पिटवाया
  rationale: संदर्भ में नगर-अधिकारियों ने दंड दिलवाया था; यह स्वाभाविक हिन्दी में कारकता व्यक्त करता है और मारने की विधि को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: δημοσίᾳ
  choice: सबके सामने
  rationale: सार्वजनिक रूप से किए गए अपमान का भाव सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἀκατακρίτους
  choice: बिना दोषी ठहराए
  rationale: ग्रीक का सीधा कानूनी भाव यह है कि न्यायिक रूप से दोषसिद्ध किए बिना दंड दिया गया; यह ‘बिना मुकदमा चलाए’ की अपेक्षा मूल की व्यापकता बनाए रखता है।
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: रोमी नागरिक होते हुए भी
  rationale: प्रसंग में रोमी होने का कानूनी नागरिकता-संबंधी बल है; ‘होते हुए भी’ शिकायत के निहित विरोधाभास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔβαλαν εἰς φυλακήν
  choice: जेल में डाल दिया
  rationale: βάλλω की कठोरता और हिन्दी की स्वाभाविक अभिव्यक्ति दोनों बनी रहती हैं।
- source_word: λάθρᾳ
  choice: चुपके से
  rationale: गुप्त और सार्वजनिक उत्तरदायित्व से बचने की चेष्टा का भाव सरल आधुनिक हिन्दी में देता है।
- source_word: ἐκβάλλουσιν
  choice: बाहर निकाल रहे हैं
  rationale: वर्तमानकालीन आलंकारिक प्रश्न तथा बाहर भेजने/निकालने का बल सुरक्षित रहता है।
- source_word: οὐ γάρ
  choice: ऐसा कदापि नहीं!
  rationale: पौलुस के जोरदार निषेध को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐλθόντες αὐτοὶ ἡμᾶς ἐξαγαγέτωσαν
  choice: वे स्वयं आकर हमें बाहर ले जाएँ
  rationale: αὐτοὶ का जोर और अधिकारियों के व्यक्तिगत रूप से आकर बाहर ले जाने की माँग दोनों सुरक्षित हैं।
theological_decisions:
- issue: पौलुस की रोमी स्थिति का कानूनी बल
  choice: रोमी नागरिक
  alternative: रोमी पुरुष / रोमी
  rationale: यहाँ शिकायत रोमी नागरिकों को प्राप्त कानूनी संरक्षण के उल्लंघन पर केंद्रित है; ‘नागरिक’ प्रसंगगत अर्थ स्पष्ट करता है, कोई सांप्रदायिक व्याख्या नहीं जोड़ता।
- issue: ἀκατακρίτους का कानूनी अर्थ
  choice: बिना दोषी ठहराए
  alternative: बिना मुकदमा चलाए
  rationale: मुख्य पाठ में मूल का न्यायिक रूप से दोषसिद्ध न किए जाने वाला अर्थ रखा गया है; वैकल्पिक प्रक्रियात्मक अर्थ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, स्पष्ट और गरिमापूर्ण है। ‘जेल’ सामान्य पाठकों के लिए सहज है; वाक्य में पौलुस के कानूनी प्रतिवाद की तीव्रता और सार्वजनिक बनाम गुप्त कार्रवाई का विरोध बनाए रखा गया है।
