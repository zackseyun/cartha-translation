source:
  edition: SBLGNT
  text: τῇ τε ἡμέρᾳ τῶν σαββάτων ἐξήλθομεν ἔξω τῆς ⸀πύλης παρὰ ποταμὸν οὗ ⸂ἐνομίζομεν προσευχὴν⸃ εἶναι, καὶ καθίσαντες ἐλαλοῦμεν ταῖς συνελθούσαις γυναιξίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: hi
  text: सब्त के दिन हम फाटक के बाहर नदी के किनारे गए,[a] जहाँ हम समझते थे कि प्रार्थना का एक स्थान है। बैठकर हम वहाँ इकट्ठी हुई स्त्रियों से बातें कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नदी के किनारे, जहाँ हम समझते थे कि प्रार्थना होती है।” यूनानी शब्द का अर्थ प्रार्थना स्वयं या प्रार्थना के लिए निर्धारित स्थान—दोनों हो सकता है; यहाँ प्रसंग “प्रार्थना के स्थान” के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: सब्त के दिन
  rationale: यूनानी मुहावरे का स्वाभाविक और स्पष्ट हिन्दी रूप; शब्दशः ‘सब्तों के दिन’ आधुनिक हिन्दी में भ्रामक होगा।
- source_word: ἐξήλθομεν ἔξω τῆς πύλης
  choice: हम फाटक के बाहर ... गए
  rationale: बाहर की ओर जाने की गति को स्वाभाविक हिन्दी में व्यक्त करता है। मूल में ‘नगर’ स्पष्ट रूप से नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: παρὰ ποταμόν
  choice: नदी के किनारे
  rationale: παρά यहाँ नदी के पास स्थित स्थान की ओर जाने का भाव देता है; ‘किनारे’ सहज हिन्दी स्थान-सूचक अभिव्यक्ति है।
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: जहाँ हमें लगा कि प्रार्थना की कोई जगह होगी
  rationale: νομίζω को ‘लगा’ और προσευχή को प्रसंगानुसार प्रार्थना के लिए निर्धारित जगह माना गया है। फिर भी ‘प्रार्थना’ मात्र का अर्थ संभव होने के कारण पाद-टिप्पणी दी गई है।
- source_word: καὶ καθίσαντες
  choice: हम बैठ गए और
  rationale: अओरिस्ट कृदंत की मुख्य क्रिया से पूर्ववर्ती क्रिया को सहज हिन्दी क्रम में व्यक्त करता है।
- source_word: ἐλαλοῦμεν
  choice: बातें करने लगे
  rationale: अपूर्ण भूतकाल की जारी क्रिया को स्वाभाविक हिन्दी में दर्शाता है, न कि केवल एक बार बोलने को।
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: वहाँ इकट्ठी हुई स्त्रियों से
  rationale: उन स्त्रियों के पहले से एकत्र हो जाने का भाव रखता है; ‘वहाँ’ निकट प्रसंग से स्वाभाविक रूप में जोड़ा गया है।
theological_decisions:
- issue: इस प्रसंग में προσευχή का अर्थ
  choice: प्रार्थना की कोई जगह
  alternative: ‘प्रार्थना’ अर्थात प्रार्थना की गतिविधि; अथवा व्याख्यात्मक रूप से ‘आराधनालय’
  rationale: नदी के किनारे लोगों के एकत्र होने का स्थानीय प्रसंग प्रार्थना-स्थल के अर्थ का समर्थन करता है। फिर भी यूनानी शब्द की वास्तविक अस्पष्टता पाद-टिप्पणी में रखी गई है और ‘आराधनालय’ जैसा अधिक संस्थागत अर्थ मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘सब्त’ बाइबलीय पद है, जबकि शेष वाक्यरचना सामान्य पाठक के लिए सहज रखी गई है।
