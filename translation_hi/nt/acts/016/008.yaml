lexical_decisions:
- source_word: παρελθόντες
  choice: से आगे निकलकर
  rationale: यह क्रिया-कृदंत मिसिया को पार करते हुए वहाँ ठहरे बिना आगे बढ़ने का भाव देता है। हिंदी में ‘से आगे निकलकर’ इस कथात्मक गति को स्वाभाविक ढंग से व्यक्त करता है, जबकि यूनानी में निहित ‘पास से’ अथवा ‘होकर’ की निकटवर्ती संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: δὲ
  choice: इसलिए
  rationale: δέ यहाँ हल्का कथात्मक संबंधसूचक है। पिछले प्रसंग के परिणामस्वरूप आगे बढ़ने की बात होने के कारण ‘इसलिए’ स्वाभाविक प्रवाह देता है, बिना प्रबल विरोध का भाव लाए।
- source_word: Μυσίαν
  choice: मिसिया
  rationale: क्षेत्र के नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: κατέβησαν
  choice: उतर गए
  rationale: καταβαίνω की दिशात्मकता को बनाए रखता है और तट अथवा अपेक्षाकृत निचले भूभाग की ओर जाने का संकेत देता है।
- source_word: εἰς
  choice: त्रोआस
  rationale: गंतव्यवाचक εἰς को हिंदी में स्थान-नाम के साथ सीधे प्रयोग से स्वाभाविक रूप में व्यक्त किया गया है; अलग परसर्ग आवश्यक नहीं।
- source_word: Τρῳάδα
  choice: त्रोआस
  rationale: स्थान के नाम का प्रचलित हिंदी लिप्यंतरण।
