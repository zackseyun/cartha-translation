base_translation:
  language: en
  yaml_path: translation/nt/acts/016/029.yaml
  text: Then[a], asking for lights, he rushed in, and trembling with fear he fell down before Paul and Silas[c][b],
translation:
  language: hi
  text: तब रोशनी मँगाकर वह भीतर दौड़ पड़ा और भय से काँपता हुआ पौलुस और सीलास के सामने गिर पड़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ विरोध नहीं, बल्कि कथा में अगली घटना की ओर बढ़ने का संकेत देता है।
- source_word: αἰτήσας
  choice: उसने रोशनी मँगवाई
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले की कार्रवाई बताता है; हिन्दी में ‘मँगवाई’ स्वाभाविक रूप से निवेदन और क्रम दोनों व्यक्त करता है।
- source_word: φῶτα
  choice: रोशनी
  rationale: बहुवचन φῶτα प्रकाश के साधनों को सामान्य रूप से सूचित करता है। हिन्दी में सामूहिक अर्थ वाला ‘रोशनी’ दीपकों या मशालों जैसी अनिर्दिष्ट बातों को नहीं जोड़ता।
- source_word: εἰσεπήδησεν
  choice: झट से भीतर आया
  rationale: क्रिया अचानक और तीव्र गति से भीतर जाने का भाव रखती है; यह पदबंध उस तत्परता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔντρομος γενόμενος
  choice: भय से काँपते हुए
  rationale: यह संयुक्त अभिव्यक्ति भय के कारण शारीरिक रूप से काँपने की अवस्था बताती है; हिन्दी में यह अर्थपूर्ण और स्वाभाविक है।
- source_word: προσέπεσεν
  choice: सामने गिर पड़ा
  rationale: क्रिया किसी के सामने गिरने का संकेत करती है, जो विनती, भय या आदर का भाव रख सकती है; अनुवाद मुद्रा को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: पौलुस और सीलास के सामने
  rationale: προσπίπτω के साथ संप्रदान कारक को हिन्दी में ‘के सामने’ स्वाभाविक रूप से व्यक्त करता है और ‘पाँवों पर’ जैसी अतिरिक्त विशिष्टता नहीं जोड़ता।
theological_decisions:
- issue: पौलुस और सीलास के प्रति जेलर के हावभाव का स्वरूप
  choice: ‘पौलुस और सीलास के सामने गिर पड़ा’—भय, विनती या आदर की शारीरिक क्रिया
  alternative: उसने पौलुस और सीलास की आराधना की
  rationale: प्रसंग में भूकंप के बाद भय और तत्काल अधीनता का भाव है। यूनानी क्रिया किसी के सामने गिरने को दर्शाती है, पर अपने आप धार्मिक आराधना सिद्ध नहीं करती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे वाक्यों से घटनाक्रम स्पष्ट होता है; ‘झट से’ अचानक गति को और ‘भय से काँपते हुए’ शारीरिक तथा भावात्मक दशा को स्वाभाविक हिन्दी में व्यक्त करते हैं।
