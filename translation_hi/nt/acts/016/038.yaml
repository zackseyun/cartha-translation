  source_fidelity: 'अनुवाद यूनानी वाक्य के सभी प्रमुख घटकों को ठीक रखता है: ῥαβδοῦχοι के लिए “छड़ी-धारियों,” ἀπήγγειλαν के लिए संदेश पहुँचाने का भाव (“बता दीं”), στρατηγοῖς के लिए “नगर-अधिकारियों,” तथा ἀκούσαντες ... ἐφοβήθησαν के लिए सुनने पर भयभीत होने की प्रतिक्रिया। “रोमी” मूल Ῥωμαῖοι को बिना अनावश्यक रूप से “रोमी नागरिक” बनाए सुरक्षित रखता है।'
