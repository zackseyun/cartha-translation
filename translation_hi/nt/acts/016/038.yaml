id: ACT.16.38
reference: Acts 16:38
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἀπήγγειλαν δὲ τοῖς στρατηγοῖς οἱ ῥαβδοῦχοι τὰ ῥήματα ταῦτα· ⸂ἐφοβήθησαν δὲ⸃ ἀκούσαντες ὅτι Ῥωμαῖοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/038.yaml
  text: So the rod-bearers reported these words to the magistrates[a], and they were afraid when they heard that they were Romans[c][b],
translation:
  language: hi
  text: तब छड़ी-धारियों[b] ने ये बातें नगर-अधिकारियों[c] को बता दीं। यह सुनकर कि वे रोमी[a] हैं, वे डर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “रोमी नागरिक।” यूनानी में केवल “रोमी” है, पर इस कानूनी प्रसंग में आशय उनकी संरक्षित नागरिक स्थिति से है।
    reason: lexical_alternative
  - marker: b
    text: “छड़ी-धारी” नगर-अधिकारियों के परिचारक थे, जिन्हें परंपरागत रूप से “लिक्टर” कहा जाता है।
    reason: cultural_note
  - marker: c
    text: “नगर-अधिकारी” यूनानी शब्द στρατηγοί का अनुवाद है; यहाँ इसका अर्थ फिलिप्पी के प्रमुख नागरिक अधिकारी हैं।
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: बता दीं
  rationale: यह क्रिया किसी से प्राप्त बात को अधिकारियों तक पहुँचाने का भाव रखती है; औपचारिक प्रसंग में भी यह सहज और स्पष्ट हिन्दी है।
- source_word: στρατηγοῖς
  choice: नगर-अधिकारियों
  rationale: फिलिप्पी के रोमी उपनिवेश में यह शब्द प्रमुख नागरिक अधिकारियों के लिए है। यह चयन पद को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: ῥαβδοῦχοι
  choice: छड़ी-धारियों
  rationale: यूनानी शब्द का शाब्दिक बिंब सुरक्षित रहता है और वह उन परिचारकों की ओर संकेत करता है जो अधिकार के प्रतीकस्वरूप छड़ियाँ रखते थे।
- source_word: τὰ ῥήματα ταῦτα
  choice: ये बातें
  rationale: पूर्ववर्ती संदेश की बातों को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक 'ये शब्द' यहाँ कुछ कृत्रिम लगता।
- source_word: ἐφοβήθησαν
  choice: डर गए
  rationale: सुनने के फलस्वरूप उत्पन्न भय को सहज और सीधे ढंग से व्यक्त करता है।
- source_word: ἀκούσαντες
  choice: यह सुनकर
  rationale: कालगत और कारणगत संबंध दोनों को संक्षेप में बनाए रखता है।
- source_word: Ῥωμαῖοί
  choice: रोमी
  rationale: मूल में प्रयुक्त संज्ञार्थक विशेषण का सीधा रूप है; कानूनी प्रसंग में निहित नागरिकता को पादटिप्पणी स्पष्ट करती है।
