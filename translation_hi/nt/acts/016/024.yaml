  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: hi
  text: ऐसा आदेश पाकर उसने उन्हें भीतरी बंदीगृह में डाल दिया और उनके पाँव काठ में कस दिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘लकड़ी में’ है; यहाँ आशय पाँव जकड़ने के लिए बने लकड़ी के बंधन-यंत्र से है।
    reason: cultural_note
lexical_decisions:
- source_word: παραγγελίαν τοιαύτην
  choice: ऐसा आदेश
  rationale: यह पदबंध किसी अधिकारी से मिले आदेश को दर्शाता है; ‘ऐसा आदेश’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: λαβὼν
  choice: पाकर
  rationale: अओरिस्ट कृदंत की मुख्य क्रिया से पहले हुई क्रिया को हिन्दी में संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔβαλεν
  choice: डाल दिया
  rationale: βάλλω में बलपूर्वक रखने का भाव हो सकता है; कारागार के प्रसंग में ‘डाल दिया’ कठोर व्यवहार का संकेत बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: ἐσωτέραν φυλακήν
  choice: भीतरी बंदीगृह
  rationale: ἐσωτέραν अधिक भीतर स्थित, सुरक्षित भाग को सूचित करता है; ‘भीतरी बंदीगृह’ उस स्थानगत अर्थ को बनाए रखता है।
- source_word: ἠσφαλίσατο
  choice: जकड़ दिए
  rationale: क्रिया का अर्थ सुरक्षित या दृढ़ता से बाँधना है; पाँवों को रोकने वाले उपकरण के साथ ‘जकड़ दिए’ सहज और सशक्त है।
- source_word: τοὺς πόδας αὐτῶν
  choice: उनके पाँव
  rationale: πούς का सीधा अर्थ ‘पाँव’ है।
- source_word: εἰς τὸ ξύλον
  choice: काठ में
  rationale: ξύλον का शाब्दिक अर्थ लकड़ी या लकड़ी की वस्तु है। ‘काठ’ मूल रूपक को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि यहाँ लकड़ी के बंधन-यंत्र का संकेत है।
