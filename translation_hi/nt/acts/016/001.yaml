id: ACT.16.1
reference: Acts 16:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Κατήντησεν δὲ ⸀καὶ εἰς Δέρβην καὶ ⸀εἰς Λύστραν. καὶ ἰδοὺ μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος, υἱὸς ⸀γυναικὸς Ἰουδαίας πιστῆς, πατρὸς δὲ Ἕλληνος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/001.yaml
  text: He also came to Derbe and to Lystra[a]. And behold, a certain disciple was there named Timothy, the son of a believing Jewish woman, but of a Greek father[b],
translation:
  language: hi
  text: वह दिरबे और लुस्त्रा भी पहुँचा। देखो, वहाँ तीमुथियुस नाम का एक शिष्य था। वह एक विश्वासी यहूदी स्त्री का पुत्र था,[a] पर उसका पिता यूनानी था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक विश्वासयोग्य यहूदी स्त्री का पुत्र।” यूनानी विशेषण का अर्थ “विश्वासी” या “विश्वासयोग्य” दोनों हो सकता है; यहाँ “विश्वासी” अर्थ अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατήντησεν
  choice: पहुँचा
  rationale: καταντάω यहाँ किसी स्थान पर पहुँचने को व्यक्त करता है; ‘पहुँचा’ यात्रा-वृत्तांत में स्वाभाविक और सटीक है।
- source_word: δὲ καὶ
  choice: भी
  rationale: यह संयोजन कथा को आगे बढ़ाते हुए एक और स्थान तक आने का भाव जोड़ता है; हिन्दी में ‘भी’ इस योगात्मक बल को सहज रूप से व्यक्त करता है।
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: दिरबे और लुस्त्रा
  rationale: स्थानवाचक εἰς को हिन्दी के ‘पहुँचा’ में निहित गंतव्य-भाव स्वाभाविक रूप से व्यक्त करता है; दोनों नगरों के नाम सीधे रखे गए हैं।
- source_word: καὶ ἰδοὺ
  choice: देखो
  rationale: ἰδού आगे आने वाली बात की ओर ध्यान खींचने वाला सजीव कथात्मक संकेत है; ‘देखो’ इसकी चिह्नितता बनाए रखता है।
- source_word: μαθητής τις
  choice: एक शिष्य
  rationale: τις एक अनिश्चित किंतु विशिष्ट व्यक्ति का परिचय देता है; आधुनिक हिन्दी में ‘एक शिष्य’ स्वाभाविक है और ‘कोई निश्चित शिष्य’ जैसी कृत्रिमता से बचता है।
- source_word: ἦν ἐκεῖ
  choice: वहाँ ... था
  rationale: यह अभिव्यक्ति तीमुथियुस की उस स्थान पर उपस्थिति बताती है; ‘वहाँ ... था’ हिन्दी में स्पष्ट और सहज है।
- source_word: ὀνόματι Τιμόθεος
  choice: तीमुथियुस नाम का
  rationale: ὀνόματι का मुहावरेदार अर्थ ‘नाम का’ है; यह व्यक्ति का परिचय संक्षेप में देता है।
- source_word: υἱὸς γυναικὸς Ἰουδαίας πιστῆς
  choice: एक विश्वासी यहूदी स्त्री का पुत्र
  rationale: वाक्यांश माता की यहूदी पहचान और उसके विश्वासी होने—दोनों को बनाए रखता है। प्रेरितों के काम के प्रसंग में πιστή का ‘विश्वासी’ अर्थ अधिक संभावित है।
- source_word: πατρὸς δὲ Ἕλληνος
  choice: पर उसका पिता यूनानी था
  rationale: यूनानी में संक्षिप्त संबंधकारक वाक्यांश है; हिन्दी में पूर्ण उपवाक्य अधिक स्वाभाविक है और δέ का विरोध ‘पर’ से स्पष्ट होता है।
- source_word: Ἕλληνος
  choice: यूनानी
  rationale: Ἕλλην यहाँ जातीय-सांस्कृतिक यूनानी व्यक्ति को सूचित करता है; व्यापक धार्मिक श्रेणी ‘गैर-यहूदी’ कहना मूल से अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: तीमुथियुस की माता के लिए πιστῆς का अर्थ
  choice: विश्वासी
  alternative: विश्वासयोग्य
  rationale: प्रेरितों के काम में इस संदर्भ में πιστός सबसे स्वाभाविक रूप से मसीही विश्वास रखने वाले व्यक्ति को दर्शाता है। फिर भी ‘विश्वासयोग्य’ अर्थ शब्दार्थ की दृष्टि से संभव है, इसलिए उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘देखो’ द्वारा ἰδού का ध्यानाकर्षक बल सुरक्षित है। यूनानी की संक्षिप्त पितृ-संबंधी रचना को स्वाभाविक हिन्दी के पूर्ण उपवाक्य में व्यक्त किया गया है।
