  yaml_path: translation/nt/acts/016/035.yaml
  text: And when day came[a], the magistrates sent the rod-bearers, saying, “Release those men.”
translation:
  language: hi
  text: भोर होने पर नगर-अधिकारियों ने छड़ीधारी सहायकों को यह आदेश देकर भेजा, “उन आदमियों को रिहा कर दो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: जब दिन हुआ, तब
  rationale: यह संबंधकारक निरपेक्ष रचना समय के परिवर्तन को दर्शाती है। ‘जब दिन हुआ, तब’ स्वाभाविक हिन्दी में उसके कालगत अर्थ और δέ के कथात्मक संक्रमण को बनाए रखता है।
- source_word: ἀπέστειλαν
  choice: भेजा
  rationale: ἀποστέλλω के सामान्य भूतकालिक अर्थ ‘भेजना’ को सरल और स्पष्ट रूप में व्यक्त करता है।
- source_word: οἱ στρατηγοὶ
  choice: नगर-अधिकारी
  rationale: फिलिप्पी के संदर्भ में यह रोमी उपनिवेश के नागरिक शासकीय अधिकारियों को सूचित करता है, सामान्य अर्थ में सेनापतियों को नहीं। ‘नगर-अधिकारी’ पद और स्थानीय प्रशासनिक भूमिका को सहज हिन्दी में व्यक्त करता है।
- source_word: τοὺς ῥαβδούχους
  choice: छड़ीधारी कर्मचारी
  rationale: शब्द का शाब्दिक अर्थ ‘छड़ी धारण करने वाले’ है; ये रोमी अधिकारियों के आधिकारिक सहायक थे। यह चुनाव ठोस प्रतीक और शासकीय कार्य—दोनों को बनाए रखता है, जबकि ऐतिहासिक पदनाम पादटिप्पणी में दिया गया है।
- source_word: λέγοντες
  choice: यह कहकर
  rationale: संदेश की विषयवस्तु प्रस्तुत करने वाले कृदंत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἀπόλυσον
  choice: छोड़ दो
  rationale: हिरासत से मुक्त करने की आज्ञा को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; कानूनी-संदर्भित अर्थ बना रहता है।
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: उन आदमियों
  rationale: संदर्भ में पौलुस और सीलास, दो पुरुष, अभिप्रेत हैं; इसलिए यह लिंग और संदर्भ दोनों की दृष्टि से सटीक है।
