  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नगर-अधिकारी’ और ‘छड़ीधारी कर्मचारी’ ऐतिहासिक प्रशासनिक संदर्भ को सामान्य पाठक के लिए समझने योग्य बनाते हैं; विशिष्ट रोमी पदनाम पादटिप्पणी में सुरक्षित है।
