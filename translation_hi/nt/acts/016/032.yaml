base_translation:
  language: en
  yaml_path: translation/nt/acts/016/032.yaml
  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: hi
  text: और उन्होंने उसे और उसके घर में उपस्थित सभी लोगों को प्रभु का वचन[a] सुनाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु के विषय में संदेश।” यूनानी अभिव्यक्ति का अर्थ ‘प्रभु का संदेश,’ ‘प्रभु की ओर से आया हुआ संदेश,’ या ‘प्रभु के विषय में संदेश’ हो सकता है।
    reason: alternative_reading
  - marker: b
    text: अधिक शाब्दिक रूप से, “उसे, उसके घर में उपस्थित सभी लोगों के साथ, प्रभु का वचन सुनाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησαν
  choice: सुनाया
  rationale: यहाँ λαλέω सुसमाचार-संदेश को मौखिक रूप से बताने का बोध देता है। हिंदी में ‘वचन सुनाया’ स्वाभाविक और गरिमापूर्ण है; ‘प्रचार किया’ सार्वजनिक उद्घोषणा का अतिरिक्त भाव ला सकता है।
- source_word: αὐτῷ
  choice: उसे
  rationale: एकवचन सम्प्रदानवाचक सर्वनाम जेलर की ओर संकेत करता है और λαλέω के साथ संदेश के प्राप्तकर्ता को बताता है।
- source_word: τὸν λόγον τοῦ κυρίου
  choice: प्रभु का वचन
  rationale: यह प्रचलित नए नियम की अभिव्यक्ति है और यूनानी संबंधकारक की संभावित व्यापकता—प्रभु से आया, प्रभु का, या प्रभु के विषय में संदेश—को मुख्य पाठ में संकुचित नहीं करती।
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: तथा उसके घर में उपस्थित सभी लोगों को
  rationale: σύν का मूल अर्थ ‘साथ’ है, पर प्रसंग में घर के सभी लोग भी संदेश के श्रोता हैं। हिंदी में दूसरा सम्प्रदान जोड़ना अर्थ को स्पष्ट और स्वाभाविक बनाता है; अधिक रूप-सन्निकट विकल्प पादटिप्पणी में रखा गया है।
- source_word: οἰκίᾳ
  choice: घर
  rationale: οἰκία भौतिक घर या घराने को सूचित कर सकता है। ‘घर में उपस्थित सभी लोग’ स्थान और वहाँ मौजूद व्यक्तियों—दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: ‘प्रभु का वचन’ में संबंधकारक का अर्थ
  choice: प्रभु का वचन
  alternative: प्रभु के विषय में संदेश / प्रभु की ओर से संदेश
  rationale: τοῦ κυρίου को केवल वस्तुवाचक या कर्तृवाचक अर्थ में बाँधना आवश्यक नहीं है। मुख्य पाठ यूनानी की वास्तविक अर्थ-व्यापकता और धर्मवैचारिक तनाव को सुरक्षित रखता है।
- issue: घर में उपस्थित लोगों की भूमिका
  choice: उसे तथा ... सभी लोगों को
  alternative: उसे, उसके घर में उपस्थित सभी लोगों के साथ
  rationale: यद्यपि यूनानी में σύν ‘साथ’ है, प्रसंग बताता है कि सभी उपस्थित लोग वचन सुनने वाले थे। मुख्य पाठ इसे स्वाभाविक हिंदी में स्पष्ट करता है, जबकि अधिक शाब्दिक संरचना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी; वाक्य संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘प्रभु का वचन’ नए नियम की परिचित शब्दावली को बनाए रखता है, जबकि ‘उपस्थित सभी लोगों’ से केवल परिवार के सदस्यों तक अर्थ सीमित नहीं होता।
