  edition: SBLGNT
  text: καὶ προσαγαγόντες αὐτοὺς τοῖς στρατηγοῖς εἶπαν· Οὗτοι οἱ ἄνθρωποι ἐκταράσσουσιν ἡμῶν τὴν πόλιν Ἰουδαῖοι ὑπάρχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
translation:
  language: hi
  text: और उन्हें नगर-अधिकारियों[a] के सामने लाकर उन्होंने कहा, “ये लोग यहूदी[b] होकर हमारे नगर में उपद्रव मचा रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रेटरों”; फिलिप्पी जैसे रोमी उपनिवेश में ये नगर के नागरिक अधिकारी थे।
    reason: cultural_note
  - marker: b
    text: या “यहूदिया-वासी।” यूनानी शब्द सामान्यतः यहूदियों या विशेष रूप से यहूदिया के लोगों को सूचित कर सकता है; यहाँ जातीय-धार्मिक आरोप के रूप में “यहूदी” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγαγόντες
  choice: सामने लाकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया ‘उन्होंने कहा’ से पहले हुई कार्रवाई दर्शाता है; ‘सामने लाकर’ हिंदी में इस क्रम को स्वाभाविक रूप से रखता है।
- source_word: στρατηγοῖς
  choice: नगर-शासकों
  rationale: फिलिप्पी जैसे रोमी उपनिवेश में यह शब्द नगर के प्रमुख नागरिक अधिकारियों के लिए प्रयुक्त है। ‘नगर-शासक’ सामान्य पाठक के लिए स्पष्ट है, जबकि तकनीकी ऐतिहासिक पद फुटनोट में दिया गया है।
- source_word: ἐκταράσσουσιν
  choice: उपद्रव मचा रहे हैं
  rationale: क्रिया गंभीर हलचल और अशांति उत्पन्न करने का आरोप व्यक्त करती है; यह हिंदी प्रयोग वर्तमानकालीन आरोप की तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἡμῶν τὴν πόλιν
  choice: हमारे नगर में
  rationale: ‘हमारे नगर’ आरोप लगाने वालों के नागरिक स्वामित्व और ‘हम बनाम वे’ वाली बयानबाज़ी को बनाए रखता है; हिंदी में उपद्रव के साथ ‘में’ स्वाभाविक है।
- source_word: Ἰουδαῖοι
  choice: यहूदी
  rationale: इस संदर्भ में शब्द पौलुस और सीलास की जातीय-धार्मिक पहचान को स्थानीय रोमी नागरिक पहचान के विपरीत आरोप का आधार बनाता है।
- source_word: ὑπάρχοντες
  choice: होकर
  rationale: यह कृदंत उनकी यहूदी पहचान को आरोप के साथ संक्षिप्त रूप से जोड़ता है। ‘होकर’ उस संबंध को बनाए रखता है, बिना उसे स्पष्टतः कारणसूचक बनाकर अर्थ को अधिक निर्धारित किए।
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: ये लोग
  rationale: संदर्भ में पौलुस और सीलास की ओर संकेत है। आधुनिक हिंदी में ‘ये लोग’ स्वाभाविक है और आरोप लगाने वालों की दूरी दर्शाता है।
theological_decisions:
- issue: संवेदनशील जातीय-धार्मिक आरोप में Ἰουδαῖοι का अनुवाद
  choice: यहूदी
  alternative: यहूदिया-वासी
  rationale: फिलिप्पी के प्रवासी-संदर्भ में जातीय-धार्मिक अर्थ सबसे उपयुक्त है। पद आरोप लगाने वालों की शत्रुतापूर्ण भाषा की रिपोर्ट करता है; यह कथावाचक द्वारा समस्त यहूदियों पर दिया गया धर्मवैचारिक निर्णय नहीं है।
- issue: ὑπάρχοντες और आरोप के बीच संबंध
  choice: यहूदी होकर
  alternative: क्योंकि वे यहूदी हैं
  rationale: मूल कृदंत पहचान को आरोप से जोड़ता है, पर कारण-संबंध को पूर्ण वाक्य की तरह स्पष्ट नहीं करता। ‘होकर’ इस तनाव और संक्षिप्तता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नगर-शासक’ ऐतिहासिक पद का अर्थ स्पष्ट करता है, और अधिक तकनीकी विकल्प फुटनोट में सुरक्षित है। वाक्य में आरोप लगाने वालों की ‘हमारे नगर’ वाली विरोधी नागरिक बयानबाज़ी तथा ‘यहूदी होकर’ की असहज जातीय-धार्मिक धार दोनों को नरम किए बिना रखा गया है।
