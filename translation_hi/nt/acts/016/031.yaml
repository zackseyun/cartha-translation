  text: οἱ δὲ εἶπαν· Πίστευσον ἐπὶ τὸν κύριον ⸀Ἰησοῦν, καὶ σωθήσῃ σὺ καὶ ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: hi
  text: उन्होंने कहा, “प्रभु यीशु पर विश्वास करो, और तुम उद्धार पाओगे—तुम और तुम्हारे घर के लोग[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तुम्हारे घर के लोग” से आशय तुम्हारे घर से जुड़े लोगों से है, केवल मकान से नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: उन्होंने कहा
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है; हिन्दी में अलग संयोजक जोड़े बिना वाक्य स्वाभाविक रहता है और अनावश्यक विरोध का भाव नहीं आता। बहुवचन क्रिया पौलुस और सीलास, दोनों के उत्तर को दर्शाती है।
- source_word: Πίστευσον ἐπὶ τὸν
  choice: पर विश्वास कर
  rationale: πιστεύω के साथ ἐπί + कर्मकारक विश्वास की ओर उन्मुख व्यक्ति को व्यक्त करता है। ‘पर विश्वास कर’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक है और निर्णायक आह्वान की शक्ति बनाए रखता है।
- source_word: κύριον Ἰησοῦν
  choice: प्रभु यीशु
  rationale: κύριος के सम्मानसूचक और मसीह-संबंधी धार्मिक बल को ‘प्रभु’ सुरक्षित रखता है; Ἰησοῦς का मानक हिन्दी रूप ‘यीशु’ है।
- source_word: σωθήσῃ
  choice: तू उद्धार पाएगा
  rationale: σῴζω का भविष्यकालीन कर्मवाच्य रूप है। इस सुसमाचार-प्रसंग में ‘उद्धार पाएगा’ स्थापित और व्यापक धार्मिक अर्थ को बनाए रखता है, उसे केवल तत्काल शारीरिक बचाव तक सीमित नहीं करता।
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: तू और तेरा घराना
  rationale: οἶκος यहाँ भवन नहीं, घर के लोगों की सामाजिक इकाई को सूचित करता है। ‘घराना’ संक्षिप्त और सहज हिन्दी में यह सामूहिक अर्थ देता है।
theological_decisions:
- issue: ‘तू और तेरा घराना’ से संबंधित प्रतिज्ञा का दायरा
  choice: वाक्यांश को सीधे रखा गया है, बिना यह कहे कि जेलर के विश्वास से उसका घराना व्यक्तिगत विश्वास के बिना स्वतः उद्धार पाएगा।
  alternative: इसे या तो मुखिया के विश्वास के कारण पूरे घराने के स्वतः उद्धार की प्रतिज्ञा मानना, या घराने के वास्तविक समावेश को कम करके केवल व्यक्ति तक सीमित करना।
  rationale: यूनानी पाठ जेलर और उसके घराने दोनों को प्रतिज्ञा के दायरे में रखता है, पर यह पद अकेला उनके उद्धार की प्रक्रिया या बाद के धार्मिक विवादों का निर्णय नहीं करता। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक संवाद के अनुरूप रखी गई है। एक व्यक्ति को सीधे संबोधन के कारण ‘तू/तेरा’ मूल यूनानी के एकवचन को स्पष्ट रखता है; यह तिरस्कारसूचक नहीं, बल्कि निकट और सीधा बाइबलीय संबोधन है।
