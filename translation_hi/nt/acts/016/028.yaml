  yaml_path: translation/nt/acts/016/028.yaml
  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: hi
  text: पर पौलुस ने ऊँची आवाज़ में पुकारकर कहा, “अपने आप को कोई हानि मत पहुँचा[a], क्योंकि हम सब यहीं हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “अपने आप को नुकसान मत पहुँचा।” यूनानी अभिव्यक्ति का शाब्दिक अर्थ अधिक व्यापक है: “अपने आप के लिए कोई बुरा काम मत कर”; प्रसंग में यह जेलर को स्वयं को हानि पहुँचाने से रोकती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφώνησεν
  choice: पुकारकर कहा
  rationale: यह क्रिया तत्काल और जोरदार ढंग से आवाज़ लगाने को व्यक्त करती है; साथ का वाक्यांश φωνῇ μεγάλῃ उसकी तीव्रता स्पष्ट करता है। हिंदी में ‘पुकारकर कहा’ स्वाभाविक रूप से क्रिया और कथन को जोड़ता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले पद में जेलर की होने वाली कार्रवाई और पौलुस के उसे रोकने वाले हस्तक्षेप के बीच हल्का विरोध दर्शाता है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँची आवाज़ में
  rationale: मूल के रीति-सूचक दत्तिव को स्वाभाविक और निकट हिंदी अभिव्यक्ति में रखा गया है।
- source_word: λέγων
  choice: कहा
  rationale: कृदंत पौलुस की पुकार की विषय-वस्तु प्रस्तुत करता है; संयुक्त अभिव्यक्ति ‘पुकारकर कहा’ हिंदी में सहज है।
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: अपने साथ कुछ बुरा मत कर
  rationale: यह मूल की व्यापक और आत्मवाचक अभिव्यक्ति—अपने प्रति कोई बुरा काम न करना—को बनाए रखता है, जबकि प्रसंग में इसका संकेत आत्महानि की ओर है।
- source_word: ἅπαντες
  choice: हम सब
  rationale: क्रिया के प्रथम पुरुष बहुवचन के साथ यह सभी उपस्थित कैदियों की समग्रता पर बल देता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह निषेध का कारण स्पष्ट करता है और आधुनिक हिंदी में स्वाभाविक कारणसूचक संयोजक है।
- source_word: ἐνθάδε
  choice: यहीं
  rationale: ‘यहीं’ स्थान के साथ इस बात पर भी स्वाभाविक बल देता है कि कोई कैदी भागा नहीं है।
- source_word: ὁ Παῦλος
  choice: पौलुस
  rationale: व्यक्तिनाम को प्रचलित हिंदी बाइबलीय रूप में रखा गया है।
