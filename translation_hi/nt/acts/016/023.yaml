  text: और उन पर बहुत-से प्रहार करने के बाद, उन्होंने उन्हें जेल में डाल दिया[a] और जेलर को आदेश दिया कि वह उन्हें कड़ी निगरानी में रखे।
  philosophy: optimal-equivalence
  footnotes:
