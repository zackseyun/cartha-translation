    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάς ... πληγὰς
  choice: बहुत मारा-पीटा
  rationale: यह पदबंध अनेक प्रहार किए जाने को व्यक्त करता है, पर किसी खास औज़ार या दंड-विधि को निर्दिष्ट नहीं करता। स्वाभाविक हिन्दी में ‘बहुत मारा-पीटा’ इसी क्रिया को स्पष्ट रखता है।
- source_word: τε
  choice: और
  rationale: यह संयोजक कण घटना को पिछले वर्णन से जोड़ता है; हिन्दी में ‘और’ कथात्मक प्रवाह बनाए रखता है।
- source_word: ἐπιθέντες
  choice: उन्होंने ... मारा-पीटा
  rationale: πληγάς के साथ इसका अर्थ प्रहार करना या मार लगाना है। हिन्दी में पूर्वकालिक कृदंत की जगह क्रमबद्ध संयुक्त वाक्य अधिक सहज है।
- source_word: ἔβαλον εἰς φυλακήν
  choice: जेल में डाल दिया
  rationale: βάλλω यहाँ बलपूर्वक बंदी बनाए जाने की सजीवता रखता है; ‘डाल दिया’ इसे ‘रख दिया’ से बेहतर व्यक्त करता है।
- source_word: φυλακήν
  choice: जेल
  rationale: यह शब्द बंदीगृह या कारावास-स्थान को दर्शाता है। आधुनिक सामान्य हिन्दी में ‘जेल’ सहज और स्पष्ट है।
- source_word: παραγγείλαντες
  choice: आदेश दिया
  rationale: यह अधिकारपूर्वक निर्देश देने को दर्शाता है; ‘आदेश दिया’ उसका बल स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δεσμοφύλακι
  choice: जेलर
  rationale: यह बंदियों की रखवाली के उत्तरदायी अधिकारी को दर्शाता है। ‘जेलर’ आधुनिक हिन्दी में संक्षिप्त और परिचित पद है।
- source_word: ἀσφαλῶς
  choice: कड़ी निगरानी में
  rationale: संदर्भ में आशय बंदियों की सुरक्षा नहीं, बल्कि उन्हें इस तरह पहरे में रखना है कि वे भाग न सकें। ‘कड़ी निगरानी में’ यह अर्थ स्पष्ट करता है।
- source_word: τηρεῖν
  choice: रखे
  rationale: कारागार के संदर्भ में τηρέω का अर्थ बंदी को पहरे या हिरासत में बनाए रखना है; क्रियाविशेषण का भाव ‘कड़ी निगरानी में’ से व्यक्त होता है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: यह पौलुस और सीलास की ओर संकेत करता है, जो मार और कारावास दोनों के कर्म हैं।
