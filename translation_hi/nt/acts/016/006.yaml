  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: hi
  text: वे फ्रूगिया और गलातिया के क्षेत्र[b] से होकर गए; उन्हें पवित्र आत्मा ने आसिया[a] में वचन बोलने से रोक दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘आसिया’ से आशय एशिया माइनर के पश्चिमी भाग में स्थित रोमी प्रान्त है, आधुनिक एशिया महाद्वीप नहीं।
    reason: cultural_note
  - marker: b
    text: इस यूनानी पदबंध का अनुवाद ‘फ्रूगियाई और गलातियाई क्षेत्र’ भी हो सकता है; सम्भव है कि यह एक ही संयुक्त क्षेत्र का संकेत हो।
    reason: alternative_reading
lexical_decisions:
- source_word: Διῆλθον
  choice: से होकर गए
  rationale: क्रिया किसी क्षेत्र के भीतर से आगे बढ़ने का अर्थ देती है; यह हिन्दी में स्वाभाविक रूप से मार्ग और गति दोनों को व्यक्त करती है।
- source_word: δὲ
  choice: फिर
  rationale: यहाँ δέ कथा को हल्के ढंग से आगे बढ़ाता है; ‘फिर’ क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: फ्रूगिया और गलातिया के क्षेत्र
  rationale: χώρα का अर्थ ‘क्षेत्र’ है। यूनानी रचना दो क्षेत्रों अथवा एक संयुक्त क्षेत्र-संज्ञा की अनुमति देती है; मुख्य पाठ पठनीय रखा गया है और अस्पष्टता को पाद-टिप्पणी में बताया गया है।
- source_word: κωλυθέντες
  choice: रोक दिया था
  rationale: κωλύω का कर्मवाच्य कृदन्त प्रभावी निषेध या रोक को दर्शाता है। हिन्दी में कारणवाचक उपवाक्य इसके प्रसंगगत संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: पवित्र आत्मा ने
  rationale: यूनानी कर्मवाच्य में कर्ता पवित्र आत्मा है; सक्रिय हिन्दी वाक्य उसी व्यक्तिगत कर्तृत्व को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: λαλῆσαι
  choice: सुनाने
  rationale: λαλέω मूलतः ‘बोलना’ है, पर ‘वचन बोलना’ की अपेक्षा ‘वचन सुनाना’ आधुनिक हिन्दी में संदेश दूसरों तक पहुँचाने का अधिक स्वाभाविक भाव देता है, बिना इसे विशेष रूप से ‘प्रचार करना’ बना देने के।
- source_word: τὸν λόγον
  choice: वचन
  rationale: लूका–प्रेरितों में λόγος मसीही संदेश के लिए प्रयुक्त होता है। ‘वचन’ स्रोत की अभिव्यक्ति और उसकी धार्मिक साहित्यिक गरिमा को सुरक्षित रखता है।
- source_word: ἐν τῇ Ἀσίᾳ
  choice: आसिया में
  rationale: नाम को ऐतिहासिक भौगोलिक संज्ञा के रूप में रखा गया है; आधुनिक महाद्वीप से भेद पाद-टिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: निषेध में आत्मा का कर्तृत्व और व्यक्तित्व
  choice: पवित्र आत्मा ने उन्हें … रोक दिया था
  alternative: पवित्र आत्मा के द्वारा वे रोके गए
  rationale: मूल पाठ में ὑπό के साथ पवित्र आत्मा निषेध के व्यक्तिगत कर्ता हैं। सक्रिय हिन्दी रचना इस कर्तृत्व को बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े स्पष्ट रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ऐतिहासिक स्थान-नामों के लिए ‘फ्रूगिया’, ‘गलातिया’ और ‘आसिया’ प्रयुक्त हैं। कृदन्त को स्वाभाविक हिन्दी कारणवाचक उपवाक्य में बदला गया है, जबकि मूल का आशय और कालगत संबंध सुरक्षित रखा गया है।
