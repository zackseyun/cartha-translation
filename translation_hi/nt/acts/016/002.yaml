lexical_decisions:
- source_word: ὃς
  choice: उसके विषय में
  rationale: सम्बन्धवाचक सर्वनाम तीमुथियुस की ओर संकेत करता है; हिन्दी में वाक्य को स्वाभाविक बनाने के लिए उसे ‘उसके विषय में’ के रूप में क्रिया से जोड़ा गया है।
- source_word: ἐμαρτυρεῖτο
  choice: अच्छी गवाही देते थे
  rationale: अपूर्ण भूतकाल का यह कर्मवाच्य रूप यहाँ अनुकूल साक्ष्य और अच्छी प्रतिष्ठा व्यक्त करता है। हिन्दी में सक्रिय बहुवचन रचना अधिक स्वाभाविक है और अर्थ सुरक्षित रखती है।
- source_word: ὑπὸ
  choice: भाई ... देते थे
  rationale: ὑπό कर्मवाच्य क्रिया के साथ व्यक्तिगत कर्ता को चिह्नित करता है; हिन्दी की सक्रिय रचना में वही व्यक्ति सीधे कर्ता बनाए गए हैं।
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: लुस्त्रा और इकुनियुम के
  rationale: यह पदबंध उन स्थानों में रहने वाले भाई-बहनों की पहचान कराता है; हिन्दी में ‘के’ संक्षिप्त और स्वाभाविक स्थान-संबंध व्यक्त करता है।
- source_word: ἀδελφῶν
  choice: भाई
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन है। मुख्य पाठ में उसका रूप बनाए रखा गया है, जबकि समुदाय के सम्भावित समावेशी आशय को पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: मसीही समुदाय के लिए ἀδελφῶν का लिंग-सूचक अनुवाद
  choice: भाई
  alternative: भाई-बहन; विश्वासी
  rationale: मूल यूनानी रूप पुल्लिंग बहुवचन है, इसलिए मुख्य पाठ में ‘भाई’ रखा गया है। आरम्भिक मसीही प्रयोग में यह शब्द समस्त सहविश्वासियों को भी समेट सकता है; इस सम्भावना को पादटिप्पणी सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘अच्छी गवाही देते थे’ मूल के अनुकूल साक्ष्य और लगातार बनी प्रतिष्ठा—दोनों को सहज हिन्दी में व्यक्त करता है।
