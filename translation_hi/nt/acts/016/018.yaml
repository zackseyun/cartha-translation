source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐποίει ἐπὶ πολλὰς ἡμέρας. διαπονηθεὶς ⸀δὲ Παῦλος καὶ ἐπιστρέψας τῷ πνεύματι εἶπεν· Παραγγέλλω σοι ⸀ἐν ὀνόματι Ἰησοῦ Χριστοῦ ἐξελθεῖν ἀπ’ αὐτῆς· καὶ ἐξῆλθεν αὐτῇ τῇ ὥρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: hi
  text: वह बहुत दिनों तक ऐसा करती रही। तब पौलुस बहुत व्यथित होकर मुड़ा और उस आत्मा से कहा, “मैं तुझे यीशु मसीह के नाम से आज्ञा देता हूँ कि उसमें से निकल जा।” और वह आत्मा उसी घड़ी निकल गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: बहुत दिनों तक ऐसा करती रही
  rationale: अपूर्ण भूतकाल ἐποίει लगातार या बार-बार होते रहे कार्य को दर्शाता है; ‘करती रही’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διαπονηθεὶς
  choice: बहुत व्यथित होकर
  rationale: यह शब्द गहरी परेशानी, खिन्नता या मानसिक बोझ का भाव रखता है; ‘बहुत व्यथित’ केवल हल्की झुँझलाहट से अधिक गंभीर भाव को बनाए रखता है।
- source_word: ἐπιστρέψας
  choice: मुड़ा
  rationale: यह पौलुस के बोलने से पहले उसकी शारीरिक दिशा बदलने को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῷ πνεύματι
  choice: उस आत्मा से
  rationale: यूनानी पाठ केवल ‘आत्मा’ कहता है; हिन्दी में निश्चित संदर्भ के लिए ‘उस’ जोड़ा गया है, पर ‘दुष्ट’ या ‘दुष्टात्मा’ जोड़कर पाठ से अधिक स्पष्ट नहीं किया गया।
- source_word: Παραγγέλλω σοι
  choice: मैं तुझे ... आज्ञा देता हूँ
  rationale: यह आत्मा को दिया गया अधिकारपूर्ण आदेश है; ‘आज्ञा देता हूँ’ उसका बल और गरिमा दोनों बनाए रखता है।
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह के नाम से
  rationale: ‘के नाम से’ अधिकार के आधार पर आदेश देने का स्वाभाविक हिन्दी रूप है। Χριστός को उसके पदवीगत अर्थ में ‘मसीह’ रखा गया है।
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: उसमें से निकल जा
  rationale: आत्मा को सीधे संबोधित आज्ञा में ‘निकल जा’ स्वाभाविक है और ἀπ’ αὐτῆς को ‘उसमें से’ सटीक रूप से व्यक्त करता है।
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: वह उसी घड़ी निकल गई
  rationale: ‘उसी घड़ी’ तत्काल घटित होने का भाव सुरक्षित रखता है। निकटतम संदर्भ में ‘आत्मा’ स्त्रीलिंग होने के कारण हिन्दी में ‘वह ... निकल गई’ स्वाभाविक है।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστοῦ का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीस्त / यीशु क्राइस्ट
  rationale: Χριστός यहाँ यीशु की पदवी है। ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण, प्रचलित और पदवीगत भाव को सुरक्षित रखने वाला रूप है।
- issue: क्या πνεῦμα को मुख्य पाठ में स्पष्ट रूप से दुष्टात्मा कहा जाए
  choice: उस आत्मा
  alternative: उस दुष्टात्मा
  rationale: इस पद में πνεῦμα के साथ ‘दुष्ट’ जैसा कोई विशेषण नहीं है। संदर्भ उसके हानिकारक स्वरूप को स्पष्ट करता है, पर मुख्य पाठ मूल की संक्षिप्तता बनाए रखता है।
- issue: अंतिम क्रिया के कर्ता का निरूपण
  choice: वह उसी घड़ी निकल गई
  alternative: आत्मा उसी घड़ी निकल गई / वह उसी क्षण उसे छोड़कर निकल गई
  rationale: यूनानी में कर्ता पिछले वाक्य से समझा जाता है। सर्वनाम मूल की अंतर्निहित संदर्भ-श्रृंखला बनाए रखता है और ‘उसे छोड़कर’ जैसी अतिरिक्त सामग्री नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। ‘तुझे’ आत्मा को सीधे संबोधन में स्वाभाविक है और आदेश की तीव्रता रखता है। ‘उसी घड़ी’ बाइबलीय गरिमा के साथ सामान्य पाठक के लिए स्पष्ट है।
