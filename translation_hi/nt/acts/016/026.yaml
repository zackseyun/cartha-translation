base_translation:
  language: en
  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: hi
  text: अचानक एक बड़ा भूकंप आया, जिससे बंदीगृह की नींवें हिल गईं। उसी क्षण सब दरवाज़े खुल गए और सबकी बेड़ियाँ खुल गईं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सबके बंधन ढीले हो गए।” यूनानी शब्द δεσμά का अर्थ “बंधन” या “बेड़ियाँ” हो सकता है, और ἀνέθη का अर्थ “ढीले हो गए” या “खुल गए” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφνω
  choice: अचानक
  rationale: यह क्रियाविशेषण घटना के अकस्मात घटने को व्यक्त करता है; ‘अचानक’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: σεισμὸς ἐγένετο μέγας
  choice: एक बड़ा भूकम्प आया
  rationale: γίνομαι और संज्ञा की रचना को स्वाभाविक हिन्दी में ‘भूकम्प आया’ कहा गया है; ‘बड़ा’ μέγας को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: ὥστε σαλευθῆναι
  choice: जिससे ... हिल गईं
  rationale: ὥστε यहाँ परिणाम बताता है; ‘जिससे’ हिन्दी में उस परिणाम को सहज रूप से व्यक्त करता है।
- source_word: τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: बन्दीगृह की नींवें
  rationale: θεμέλια भवन की आधारभूत संरचनाओं और δεσμωτήριον कैद रखने के स्थान को दर्शाता है; ‘बन्दीगृह’ dignified और सटीक हिन्दी है।
- source_word: ἠνεῴχθησαν ... αἱ θύραι πᾶσαι
  choice: सब दरवाज़े खुल गए
  rationale: यूनानी निष्क्रिय रूप को हिन्दी की स्वाभाविक अकर्मक परिणामसूचक अभिव्यक्ति से प्रस्तुत किया गया है, बिना कर्ता जोड़े।
- source_word: παραχρῆμα
  choice: उसी क्षण
  rationale: यह तत्काल घटित होने का भाव देता है; ‘उसी क्षण’ कथात्मक हिन्दी में स्पष्ट और प्रभावी है।
- source_word: πάντων τὰ δεσμὰ
  choice: सबकी बेड़ियाँ
  rationale: πάντων सम्बन्ध/स्वामित्व बताता है और δεσμά कैदियों को बाँधने वाले बन्धनों को; ‘सबकी बेड़ियाँ’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: ἀνέθη
  choice: खुल गईं
  rationale: ἀνίημι का रूप यहाँ ढीला या खुल जाने को बताता है; ‘खुल गईं’ बेड़ियों के सन्दर्भ में स्वाभाविक है और पूर्ण मुक्ति जैसी अतिरिक्त धारणा नहीं जोड़ता।
