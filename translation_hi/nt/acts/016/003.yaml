id: ACT.16.3
reference: Acts 16:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: hi
  text: पौलुस चाहता था कि तीमुथियुस उसके साथ यात्रा पर जाए[a]। उसे साथ लेकर उसने उन स्थानों में रहने वाले यहूदियों के कारण[b] उसका खतना किया, क्योंकि वे सब जानते थे कि उसका पिता यूनानी था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके साथ बाहर निकले”; यहाँ इसका अर्थ यात्रा पर निकलना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “यहूदियों की वजह से” अथवा “यहूदियों के लिहाज़ से” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: मूल भाषा में “यूनानी”; इस प्रसंग में यह सम्भवतः बताता है कि तीमुथियुस का पिता यहूदी नहीं था।
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: तीमुथियुस
  rationale: संकेतवाचक सर्वनाम का संदर्भ पिछले पद के तीमुथियुस से है। हिन्दी में पद को स्वतंत्र रूप से स्पष्ट और स्वाभाविक बनाने के लिए नाम दोहराया गया है।
- source_word: ἠθέλησεν
  choice: चाहता था
  rationale: यह पौलुस की इच्छा अथवा मंशा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: उसके साथ यात्रा पर जाए
  rationale: शाब्दिक अर्थ ‘उसके साथ बाहर निकले’ है, पर इस प्रसंग में मुहावरा यात्रा पर निकलने को सूचित करता है।
- source_word: λαβὼν
  choice: उसे अपने साथ ले गया
  rationale: पूर्वकालिक कृदंत को स्वाभाविक हिन्दी में अगले कार्य से पहले की क्रिया के रूप में व्यक्त किया गया है।
- source_word: περιέτεμεν
  choice: उसका खतना किया
  rationale: क्रिया का सीधा और प्रचलित हिन्दी अनुवाद है; मूल पाठ की स्पष्टता को बनाए रखता है।
- source_word: διὰ τοὺς Ἰουδαίους
  choice: यहूदियों के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण अथवा प्रेरक परिस्थिति बताता है; इससे उद्देश्य के बारे में अतिरिक्त सकारात्मक या नकारात्मक अर्थ नहीं जोड़ा जाता।
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: उन स्थानों में रहने वाले
  rationale: स्थानीय यहूदियों की पहचान बताने वाले कृदंत वाक्यांश को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: क्योंकि वे सब जानते थे
  rationale: γάρ की व्याख्यात्मक शक्ति और ἅπαντες की समग्रता, दोनों सुरक्षित हैं।
- source_word: Ἕλλην
  choice: यूनानी
  rationale: मूल शब्द का सीधा जातीय-सांस्कृतिक पद है; प्रसंग में यह पिता के गैर-यहूदी होने का संकेत भी दे सकता है, जिसे टिप्पणी में स्पष्ट किया गया है।
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: उसका पिता ... था
  rationale: यहाँ ὑπάρχω के लिए सरल अस्तित्वसूचक ‘था’ स्वाभाविक है और अनावश्यक बलाघात नहीं जोड़ता।
theological_decisions:
- issue: तीमुथियुस के खतने का कारण और उसका धर्मवैज्ञानिक अर्थ
  choice: पद में बताए गए कारण—स्थानीय यहूदियों को उसके पिता की पृष्ठभूमि का ज्ञान—को बिना अतिरिक्त धर्मसैद्धांतिक निष्कर्ष के रखा गया है।
  alternative: इसे या तो विश्वासियों के लिए खतने की धर्मवैज्ञानिक अनिवार्यता अथवा केवल मिशनरी व्यावहारिकता की स्पष्ट घोषणा मानना।
  rationale: यूनानी पाठ कार्य का कारण बताता है, पर उद्धार, वाचा-सदस्यता या पौलुस की व्यापक नीति पर कोई प्रत्यक्ष निष्कर्ष नहीं देता। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लंबे यूनानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है। ‘यात्रा पर जाए’ शाब्दिक मुहावरे का प्रसंगानुकूल रूप है; कारण-संबंध और कथात्मक धर्मवैज्ञानिक तनाव सुरक्षित रखे गए हैं।
