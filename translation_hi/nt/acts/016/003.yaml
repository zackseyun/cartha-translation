  terminology: “खतना,” “यहूदी,” and “यूनानी” are appropriate, direct, and consistent with the source. “यूनानी” should remain rather than being expanded to “गैर-यहूदी,” since the latter is interpretive; the footnote appropriately supplies that contextual possibility.
