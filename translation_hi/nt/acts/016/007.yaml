base_translation:
  language: en
  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: hi
  text: पर जब वे मूसिया के पास[a] पहुँचे, तो वे बितूनिया में जाने का प्रयास कर रहे थे, लेकिन यीशु की आत्मा ने उन्हें जाने नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मूसिया के सामने,” “मूसिया के निकट,” अथवा “मूसिया के साथ-साथ।” यूनानी वाक्यांश संभवतः मूसिया के सीमावर्ती क्षेत्र तक पहुँचने की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: जब वे ... पहुँचे
  rationale: कालवाचक एओरिस्ट कृदंत घटनाओं का क्रम बताता है; यह हिंदी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले वृत्तांत से हल्का विरोध अथवा नया मोड़ दिखाता है।
- source_word: κατὰ τὴν Μυσίαν
  choice: मूसिया के पास[a]
  rationale: भौगोलिक प्रयोग में κατά सीमावर्ती निकटता या उसके साथ-साथ पहुँचने का भाव दे सकता है; मुख्य पाठ में स्वाभाविक हिंदी रखकर वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित की गई है।
- source_word: ἐπείραζον
  choice: प्रयास कर रहे थे
  rationale: अपूर्ण काल जारी अथवा आरंभ किए गए प्रयास का भाव रखता है।
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: बितूनिया में जाने
  rationale: εἰς क्षेत्र के भीतर जाने की दिशा और πορεύομαι यात्रा करने का भाव व्यक्त करता है।
- source_word: οὐκ εἴασεν
  choice: जाने नहीं दिया
  rationale: यह अनुमति न देने का सहज हिंदी रूप है और 'मना किया' जैसी अपेक्षाकृत प्रबल अभिव्यक्ति से बचता है।
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: यीशु के आत्मा
  rationale: यूनानी की असामान्य मसीह-संबंधी अभिव्यक्ति को 'पवित्र आत्मा' बनाकर सामान्यीकृत किए बिना सुरक्षित रखा गया है।
theological_decisions:
- issue: τὸ πνεῦμα Ἰησοῦ का मसीह-संबंधी स्वरूप
  choice: यीशु के आत्मा
  alternative: पवित्र आत्मा / आत्मा
  rationale: मूल पाठ स्पष्ट रूप से Ἰησοῦ जोड़ता है; इसलिए पद की अपनी धर्मवैचारिक अभिव्यक्ति को बिना व्याख्यात्मक सामंजस्य के बनाए रखा गया है।
