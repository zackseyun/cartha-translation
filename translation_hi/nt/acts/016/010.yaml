source:
  edition: SBLGNT
  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: hi
  text: जब उसने वह दर्शन देखा, तो हमने तुरन्त मकिदुनिया के लिए निकलने का प्रयत्न किया, यह निष्कर्ष निकालकर कि परमेश्वर ने हमें उन्हें शुभ समाचार सुनाने के लिए बुलाया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: जब ... तो
  rationale: हल्की कथात्मक निरंतरता और समय-संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸ ὅραμα εἶδεν
  choice: उसने वह दर्शन देखा
  rationale: ὅραμα के प्रकाशनात्मक दृश्य के अर्थ और तीसरे पुरुष एकवचन कर्ता को सीधे बनाए रखता है।
- source_word: εὐθέως
  choice: तुरन्त
  rationale: कार्य की तात्कालिकता को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἐζητήσαμεν
  choice: हमने ... प्रयत्न किया
  rationale: इस संदर्भ में ζητέω के प्रयास या उद्यम करने के भाव को मुहावरेदार हिन्दी में व्यक्त करता है और प्रथम पुरुष बहुवचन को सुरक्षित रखता है।
- source_word: ἐξελθεῖν εἰς Μακεδονίαν
  choice: मकिदुनिया जाने
  rationale: यात्रा-संदर्भ में गन्तव्य की ओर निकलने का स्वाभाविक हिन्दी रूप; शाब्दिक 'बाहर निकलकर मकिदुनिया में जाने' से अनावश्यक बोझिलता बचती है।
- source_word: συμβιβάζοντες
  choice: क्योंकि हमने यह निष्कर्ष निकाला
  rationale: दर्शन से तर्कपूर्वक निष्कर्ष निकालने के सहभागी क्रिया-भाव को स्पष्ट करता है।
- source_word: προσκέκληται ἡμᾶς ὁ θεὸς
  choice: परमेश्वर ने हमें ... बुलाया है
  rationale: यूनानी पूर्णकाल के पूर्व में हुई और वर्तमान में प्रभावी बुलाहट के भाव को बनाए रखता है।
- source_word: εὐαγγελίσασθαι αὐτούς
  choice: वहाँ के लोगों को शुभ समाचार सुनाने के लिए
  rationale: क्रिया के सुसमाचार सुनाने के अर्थ और αὐτούς के मानव-संदर्भ को सहज हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: वृत्तांत में प्रथम पुरुष बहुवचन का आरम्भ
  choice: '''हमने'' को स्पष्ट रूप से बनाए रखा गया'
  alternative: अव्यक्त या तीसरे पुरुष में भावानुवाद
  rationale: यूनानी पाठ का स्पष्ट 'हम' अनुवाद में सुरक्षित रहना चाहिए, पर इससे लेखकत्व के बारे में अतिरिक्त निष्कर्ष नहीं जोड़ा गया।
- issue: परमेश्वर की बुलाहट
  choice: परमेश्वर ने हमें बुलाया है
  alternative: परमेश्वर हमारा मार्गदर्शन कर रहा था
  rationale: προσκαλέομαι बुलाने या आह्वान करने को व्यक्त करता है; कमजोर या अधिक व्याख्यात्मक भाषा पाठ की स्पष्टता घटाती।
- issue: पूर्णकाल προσκέκληται का कालगत बल
  choice: बुलाया है
  alternative: बुलाया था
  rationale: हिन्दी पूर्ण वर्तमान पूर्व में हुई बुलाहट के वर्तमान प्रभाव को स्वाभाविक रूप से व्यक्त करता है; कथात्मक पूर्वकाल के कारण 'बुलाया था' भी सम्भव है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। 'मकिदुनिया' हिन्दी बाइबलीय परंपरा में परिचित भौगोलिक नाम है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई।
