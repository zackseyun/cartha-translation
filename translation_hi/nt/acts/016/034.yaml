  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀναγαγών τε αὐτοὺς εἰς τὸν ⸀οἶκον παρέθηκεν τράπεζαν καὶ ⸀ἠγαλλιάσατο πανοικεὶ πεπιστευκὼς τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: hi
  text: उन्हें ऊपर अपने घर में ले जाकर उसने उनके सामने भोजन परोसा[a] और परमेश्वर पर विश्वास करके अपने सारे घराने के साथ बहुत आनन्दित हुआ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके सामने मेज़ लगाई”; यूनानी मुहावरे का अर्थ भोजन उपलब्ध कराना है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी को इस अर्थ में भी समझा जा सकता है कि उसका पूरा घराना आनन्द में सहभागी था; कुछ लोग इस वाक्यांश को इस संकेत के रूप में लेते हैं कि घराने के लोगों ने भी विश्वास किया था।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: ऊपर ... ले गया
  rationale: यहाँ क्रिया स्थानगत ऊपर ले जाने को व्यक्त करती है; हिन्दी में मुख्य क्रियाओं की स्वाभाविक क्रमबद्धता के साथ इसका अनुवाद किया गया है।
- source_word: εἰς τὸν οἶκον
  choice: अपने घर में
  rationale: संदर्भ में यह जेलर का घर है। हिन्दी में ‘अपने’ स्वाभाविक रूप से संबंध स्पष्ट करता है, यद्यपि यूनानी में स्वत्ववाचक शब्द अलग से नहीं है।
- source_word: παρέθηκεν τράπεζαν
  choice: उनके सामने भोजन परोसा
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ मेज़ सामने रखना है, पर संदर्भगत अर्थ अतिथियों को भोजन देना है।
- source_word: ἠγαλλιάσατο
  choice: बहुत आनन्दित हुआ
  rationale: क्रिया प्रबल और उमंग-भरे आनन्द को व्यक्त करती है; यह चयन गरिमापूर्ण और सहज आधुनिक हिन्दी है।
- source_word: πανοικεὶ
  choice: अपने सारे घराने के साथ
  rationale: क्रियाविशेषण पूरे घराने की सहभागिता को बताता है; ‘घराना’ परिवार और घर के अन्य सदस्यों के व्यापक दायरे को बनाए रखता है।
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: परमेश्वर पर विश्वास करके
  rationale: पूर्णकालिक कृदन्त जेलर के विश्वास कर चुकने और उसकी बनी हुई अवस्था को सूचित करता है। ‘करके’ कृदन्तीय संबंध को रखता है और अनिवार्य रूप से स्पष्ट कारणसूचक ‘क्योंकि’ नहीं जोड़ता।
theological_decisions:
- issue: आनन्द और विश्वास का घराने से संबंध
  choice: मुख्य पाठ में जेलर को अपने पूरे घराने के साथ आनन्दित होते हुए और स्वयं परमेश्वर पर विश्वास कर चुका बताया गया है।
  alternative: वाक्य को ऐसा समझा जा सकता है कि पूरे घराने ने आनन्द मनाया और विश्वास में भी सहभागी हुआ।
  rationale: πανοικεὶ मुख्यतः आनन्दित होने की क्रिया को विशेषित कर सकता है, जबकि पुल्लिंग एकवचन πεπιστευκώς का सीधा संबंध जेलर से है। फिर भी व्यापक घराने की विश्वास-सहभागिता की संभावित समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘घराना’ οἶκος-सम्बन्धी सामूहिक दायरे को केवल निकट परिवार तक सीमित किए बिना व्यक्त करता है; कृदन्तीय अस्पष्टता को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
