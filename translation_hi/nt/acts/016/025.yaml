  text: About midnight Paul and Silas were praying and singing hymns to God[a], and the prisoners were listening to them.
translation:
  language: hi
  text: लगभग आधी रात को पौलुस और सीलास प्रार्थना करते हुए परमेश्वर के भजन गा रहे थे, और कैदी उन्हें ध्यान से सुन रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: लगभग आधी रात को
  rationale: κατά के साथ कालवाचक कर्मकारक यहाँ किसी सटीक क्षण के बजाय उसके आसपास का समय बताता है। δέ हल्का संयोजक है, जिसे हिन्दी वाक्य-प्रवाह में अलग शब्द से व्यक्त करना आवश्यक नहीं।
- source_word: Παῦλος καὶ Σιλᾶς
  choice: पौलुस और सीलास
  rationale: बाइबिलीय व्यक्तिनामों के प्रचलित हिन्दी रूप रखे गए हैं।
- source_word: προσευχόμενοι
  choice: प्रार्थना करते हुए
  rationale: वर्तमान कृदन्त मुख्य अपूर्णकालीन क्रिया के साथ जारी समकालीन कार्य बताता है।
- source_word: ὕμνουν τὸν θεόν
  choice: परमेश्वर के भजन गा रहे थे
  rationale: ὑμνέω स्तुति-गीत या भजन गाने को व्यक्त करता है। हिन्दी में 'परमेश्वर के भजन गाना' स्वाभाविक रूप से परमेश्वर को संबोधित स्तुति का अर्थ देता है।
- source_word: ἐπηκροῶντο
  choice: ध्यान से ... सुन रहे थे
  rationale: यह क्रिया केवल सुनाई पड़ने से अधिक, ध्यान लगाकर सुनने का भाव रख सकती है; अपूर्णकाल जारी क्रिया को दर्शाता है।
- source_word: οἱ δέσμιοι
  choice: कैदी
  rationale: सन्दर्भ में यह बन्दी या कैद में रखे गए लोगों का स्वाभाविक आधुनिक हिन्दी रूप है।
