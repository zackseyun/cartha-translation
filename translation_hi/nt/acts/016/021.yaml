source:
  edition: SBLGNT
  text: καὶ καταγγέλλουσιν ἔθη ἃ οὐκ ἔξεστιν ἡμῖν παραδέχεσθαι οὐδὲ ποιεῖν Ῥωμαίοις οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/021.yaml
  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: hi
  text: और वे ऐसे रीति-रिवाजों का प्रचार कर रहे हैं जिन्हें स्वीकार करना या मानना हमारे लिए, रोमी होने के नाते, वैध नहीं है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्योंकि हम रोमी हैं” अथवा “रोमी होने के नाते।” यूनानी कृदन्त पदबंध बताता है कि आरोप लगाने वाले इन रीति-रिवाजों को ठुकराने का आधार अपने रोमी होने को बताते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: καταγγέλλουσιν
  choice: प्रचार कर रहे हैं
  rationale: यह क्रिया सार्वजनिक रूप से घोषणा या प्रचार करने का भाव देती है; वर्तमान काल के आरोप को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: ἔθη
  choice: रीति-रिवाजों
  rationale: यह स्थापित सामाजिक या धार्मिक प्रथाओं को सूचित करता है; ‘रीति-रिवाज’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὐκ ἔξεστιν
  choice: वैध नहीं है
  rationale: आरोप की कानूनी-नागरिक भाषा बनाए रखता है, बिना यह ठहराए कि दावा वस्तुतः सही था।
- source_word: παραδέχεσθαι
  choice: स्वीकार करना
  rationale: इन रीति-रिवाजों को ग्रहण या मान्य करने का व्यापक भाव सुरक्षित रखता है।
- source_word: οὐδὲ ποιεῖν
  choice: या मानना
  rationale: रीति-रिवाजों के संदर्भ में ποιεῖν का अर्थ उनका पालन या आचरण करना है; ‘मानना’ हिन्दी में ‘रीति-रिवाज मानना’ के साथ स्वाभाविक है।
- source_word: Ῥωμαίοις οὖσιν
  choice: हम रोमियों के लिए
  rationale: कर्तृवाचक कृदन्त पदबंध को हिन्दी में कारण/स्थिति के रूप में व्यक्त करता है और मूल की कुछ संक्षिप्तता तथा अर्थगत खुलापन बनाए रखता है।
theological_decisions:
- issue: आरोप में निषेध का स्वरूप
  choice: आरोप को कानूनी-नागरिक भाषा में ‘वैध नहीं है’ के रूप में प्रस्तुत किया गया है।
  alternative: ‘हमारे लिए उचित नहीं है’
  rationale: वचन आरोपकर्ताओं का दावा दर्ज करता है, रोमी कानून के विषय में लेखक की पुष्टि नहीं; इसलिए कानूनी स्वर बनाए रखते हुए दावे का समर्थन नहीं जोड़ा गया।
- issue: Ῥωμαίοις οὖσιν का संबंध
  choice: ‘हम रोमियों के लिए’ द्वारा रोमी पहचान को निषेध का आधार दिखाया गया है।
  alternative: ‘क्योंकि हम रोमी हैं’
  rationale: यूनानी पदबंध कारण सूचित कर सकता है, पर उसका रूप संक्षिप्त है; मुख्य पाठ में स्वाभाविक हिन्दी और पादटिप्पणी में स्पष्ट वैकल्पिक रूप देकर वास्तविक अर्थगत विस्तार सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण लेकिन सामान्य पाठक के लिए सहज। ‘रीति-रिवाज मानना’ मुहावरेदार हिन्दी है और कानूनी आरोप के लिए ‘वैध’ औपचारिक स्वर बनाए रखता है।
