source:
  edition: SBLGNT
  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: hi
  text: और लुदिया नाम की एक स्त्री, जो थुआतीरा नगर की रहने वाली और बैंगनी रंग के कपड़े बेचने वाली थी तथा परमेश्वर की उपासना करती थी,[a] सुन रही थी; और प्रभु ने उसका हृदय खोला कि वह पौलुस जो कह रहा था, उस पर ध्यान दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की उपासक थी।” यह पदबंध इस्राएल के परमेश्वर को मानने वाली किसी गैर-यहूदी स्त्री का संकेत दे सकता है।
    reason: σεβομένη τὸν θεόν के सामान्य अर्थ और इसके सम्भावित सामाजिक-धार्मिक प्रयोग, दोनों को बिना निश्चित पहचान थोपे सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: καί τις γυνὴ ὀνόματι Λυδία
  choice: और लुदिया नाम की एक स्त्री
  rationale: ‘एक स्त्री’ τις की अनिश्चितता को स्वाभाविक हिंदी में रखता है; καί को कथा की निरंतरता दिखाने के लिए ‘और’ कहा गया है।
- source_word: πορφυρόπωλις
  choice: बैंगनी कपड़े की व्यापारी
  rationale: यह शब्द बैंगनी रंग से रंगे कपड़े या वस्तुओं का व्यापार करने वाली स्त्री को दर्शाता है। ‘कपड़े की व्यापारी’ स्पष्ट है, पर किसी खास प्रकार के वस्त्र का अनावश्यक अनुमान नहीं लगाता।
- source_word: πόλεως Θυατείρων
  choice: थुआतीरा नगर की रहनेवाली
  rationale: सम्बन्धकारक पद लुदिया की भौगोलिक उत्पत्ति या सम्बद्धता बताता है; आधुनिक हिंदी में यह स्वाभाविक अभिव्यक्ति है।
- source_word: σεβομένη τὸν θεόν
  choice: परमेश्वर की उपासना करती थी
  rationale: σεβομένη श्रद्धा और उपासना का भाव रखता है। यह अनुवाद मुख्य पाठ में स्पष्ट है और सम्भावित सामाजिक-धार्मिक अर्थ को पादटिप्पणी में रखता है।
- source_word: ἤκουεν
  choice: सुन रही थी
  rationale: अपूर्ण भूतकाल कथा में जारी क्रिया को दिखाता है; ‘सुन रही थी’ उसके ध्यानपूर्वक सुनते रहने का स्वाभाविक हिंदी रूप है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: यूनानी पाठ केवल ‘प्रभु’ कहता है; अनुवाद उसके संदर्भ को ‘यीशु’ या ‘परमेश्वर’ जोड़कर सीमित नहीं करता।
- source_word: διήνοιξεν τὴν καρδίαν
  choice: उसका हृदय खोल दिया
  rationale: मूल रूपक को सुरक्षित रखते हुए यह भीतर से ग्रहणशील बनाए जाने का अर्थ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: προσέχειν
  choice: ध्यान दे
  rationale: इसका मूल अर्थ मन लगाना या ध्यान देना है। ‘स्वीकार करे’ या ‘उत्तर दे’ कहना पाठ से अधिक अर्थ जोड़ता।
- source_word: τοῖς λαλουμένοις ὑπὸ τοῦ Παύλου
  choice: पौलुस की कही बातों पर
  rationale: कर्मवाच्य कृदन्त का आशय सरल और स्वाभाविक हिंदी में व्यक्त किया गया है, जबकि पौलुस को वक्ता के रूप में स्पष्ट रखा गया है।
theological_decisions:
- issue: ὁ κύριος में ‘प्रभु’ का संदर्भ
  choice: प्रभु
  alternative: प्रभु यीशु; परमेश्वर
  rationale: मूल पाठ संदर्भ को स्पष्ट नहीं करता। इसलिए अनुवाद केवल ‘प्रभु’ रखकर वास्तविक धर्मवैचारिक खुलापन बनाए रखता है।
- issue: σεβομένη τὸν θεόν का धार्मिक-सामाजिक अर्थ
  choice: मुख्य पाठ में ‘परमेश्वर की उपासना करती थी’
  alternative: ‘परमेश्वर की उपासक थी’—एक ऐसी गैर-यहूदी के लिए सम्भावित पद, जो इस्राएल के परमेश्वर को मानती थी
  rationale: मुख्य पाठ क्रिया का सामान्य अर्थ देता है; सम्भावित तकनीकी या सामुदायिक अर्थ को पादटिप्पणी में रखा गया है, ताकि उसे निश्चित पहचान न बनाया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। प्रचलित बाइबलीय नाम-रूप ‘लुदिया’, ‘थुआतीरा’ और ‘पौलुस’ अपनाए गए हैं। लंबे यूनानी वाक्य को पठनीय हिंदी के लिए तीन वाक्यों में बाँटा गया है, बिना उसके तर्क-संबंध को बदले।
