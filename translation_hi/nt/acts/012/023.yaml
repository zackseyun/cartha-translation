base_translation:
  language: en
  yaml_path: translation/nt/acts/012/023.yaml
  text: Immediately an angel of the Lord struck him[a], because he did not give the glory to God, and becoming worm-eaten[c][b], he died.
translation:
  language: hi
  text: तुरन्त प्रभु के एक स्वर्गदूत ने उस पर प्रहार किया, क्योंकि उसने परमेश्वर को महिमा नहीं दी; और कीड़ों से खाया हुआ होकर वह मर गया[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कीड़ों का आहार बनकर।”
    reason: σκωληκόβρωτος के अधिक मुहावरेदार हिन्दी रूप को दिखाने वाला शाब्दिक विकल्प।
  - marker: b
    text: या, “उसने प्राण त्याग दिए।”
    reason: ἐξέψυξεν के अधिक साहित्यिक, पर अर्थ-संगत विकल्प को दर्शाता है।
lexical_decisions:
- source_word: παραχρῆμα
  choice: तुरन्त
  rationale: यह क्रिया-विशेषण बिना किसी देरी के घटने का भाव देता है; ‘तुरन्त’ आधुनिक हिन्दी में स्वाभाविक है और न्याय की आकस्मिकता बनाए रखता है।
- source_word: ἐπάταξεν
  choice: मारा
  rationale: क्रिया का मूल अर्थ प्रहार करना या मारना है। ‘मारा’ स्पष्ट है और यह पहले से नहीं ठहराता कि उसी प्रहार के क्षण उसकी मृत्यु हो गई, क्योंकि मृत्यु का उल्लेख वाक्य के अंत में अलग से है।
- source_word: ἄγγελος κυρίου
  choice: प्रभु के एक स्वर्गदूत
  rationale: यूनानी में संज्ञा के साथ निश्चित उपपद नहीं है, इसलिए ‘एक’ उपयुक्त है। प्रसंग में ἄγγελος दैवीय स्वर्गदूत को सूचित करता है।
- source_word: ἀνθ’ ὧν
  choice: क्योंकि
  rationale: यह मुहावरा यहाँ दंड का कारण बताता है; ‘क्योंकि’ उसके कारणात्मक बल को सहज हिन्दी में व्यक्त करता है।
- source_word: οὐκ ἔδωκεν τὴν δόξαν τῷ θεῷ
  choice: उसने परमेश्वर को महिमा नहीं दी
  rationale: यह उस आदर और महिमा को परमेश्वर के नाम करने की बात है जो उचित रूप से उन्हीं की थी। हिन्दी में यह वाक्यांश स्वाभाविक और धर्मशास्त्रीय रूप से अनिर्णायक है।
- source_word: γενόμενος σκωληκόβρωτος
  choice: वह कीड़ों से खाया जाकर
  rationale: यह अनुवाद कृदन्तीय रचना और मूल के सजीव चित्र को बनाए रखता है, पर घटना की चिकित्सकीय प्रक्रिया या सटीक अवधि को नहीं ठहराता।
- source_word: ἐξέψυξεν
  choice: मर गया
  rationale: क्रिया का अर्थ प्राण निकलना या मर जाना है। ‘मर गया’ सामान्य आधुनिक हिन्दी में सबसे स्पष्ट रूप है।
theological_decisions:
- issue: वर्णित न्याय का स्वरूप और घटनाक्रम
  choice: हेरोदेस की मृत्यु को प्रभु के एक स्वर्गदूत द्वारा किए गए दैवीय न्याय के रूप में प्रस्तुत किया गया है, और कारण यह है कि उसने परमेश्वर को महिमा नहीं दी।
  alternative: इसे केवल धार्मिक भाषा में वर्णित प्राकृतिक मृत्यु मानना, या यह निश्चित करना कि स्वर्गदूत के प्रहार के ठीक उसी क्षण वह मर गया।
  rationale: पाठ प्रहार का कर्ता स्पष्ट रूप से ‘प्रभु के एक स्वर्गदूत’ को बताता और न्याय का कारण देता है। फिर भी ‘कीड़ों से खाया जाकर’ और उसके बाद ‘मर गया’ का क्रम किसी अधिक सटीक चिकित्सकीय या कालगत पुनर्निर्माण का आधार नहीं देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘स्वर्गदूत’ सामान्य पाठक के लिए संदर्भ स्पष्ट करता है; अर्धविराम कारण-वाक्य और अंतिम परिणाम के बीच यूनानी वाक्य का प्रवाह बनाए रखता है।
