translation_notes:
  register: आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण कथात्मक रूप अपनाया गया है। यूनानी वाक्य की लंबी संरचना को पठनीयता के लिए दो वाक्यों में बाँटा गया है, बिना सूचना या तनाव घटाए। अंग्रेज़ी परामर्श-पाठ का [b] चिह्न मूलतः ‘जेल की रखवाली’ के वैकल्पिक अंग्रेज़ी रूप से जुड़ा प्रतीत होता है, न कि ‘दो जंजीरों’ से; हिन्दी में ἐτήρουν τὴν φυλακήν का अर्थ सीधे स्पष्ट होने के कारण उसके लिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।
