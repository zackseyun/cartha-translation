  text: Ὅτε δὲ ἤμελλεν ⸂προαγαγεῖν αὐτὸν⸃ ὁ Ἡρῴδης, τῇ νυκτὶ ἐκείνῃ ἦν ὁ Πέτρος κοιμώμενος μεταξὺ δύο στρατιωτῶν δεδεμένος ἁλύσεσιν δυσίν, φύλακές τε πρὸ τῆς θύρας ἐτήρουν τὴν φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/006.yaml
  text: When Herod was about to bring him out[a], on that very night Peter was sleeping between two soldiers, bound with two chains[b], and guards before the door were keeping watch over the prison.
translation:
  language: hi
  text: जब हेरोद उसे बाहर लाने ही वाला था[a], उसी रात पतरस दो सैनिकों के बीच सो रहा था। वह दो जंजीरों से बँधा हुआ था, और पहरेदार दरवाज़े के सामने जेल की रखवाली कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे आगे लाने ही वाला था।” यूनानी क्रिया किसी व्यक्ति को सार्वजनिक रूप से उपस्थित करने या मुकदमे के लिए आगे लाने के अर्थ में भी प्रयुक्त हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤμελλεν
  choice: लाने ही वाला था
  rationale: μέλλω आसन्न कार्य को दर्शाता है; ‘ही वाला था’ उसकी निकटता और कथात्मक तनाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προαγαγεῖν αὐτόν
  choice: उसे बाहर लाने
  rationale: यहाँ क्रिया का आशय पतरस को हिरासत से सार्वजनिक कार्यवाही के लिए बाहर लाना है। ‘बाहर लाने’ गति और जेल-संदर्भ दोनों को स्पष्ट रखता है।
- source_word: τῇ νυκτὶ ἐκείνῃ
  choice: उसी रात
  rationale: ἐκείνῃ की विशिष्टता और बल को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: κοιμώμενος
  choice: सो रहा था
  rationale: वर्तमान कृदन्त नींद की जारी अवस्था/क्रिया बताता है; ‘सो रहा था’ उसके पक्ष को बनाए रखता है।
- source_word: μεταξὺ δύο στρατιωτῶν
  choice: दो सैनिकों के बीच
  rationale: स्थान-संबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: δεδεμένος ἁλύσεσιν δυσίν
  choice: दो जंजीरों से बँधा हुआ था
  rationale: पूर्ण निष्क्रिय कृदन्त पतरस की बनी हुई बंधन-अवस्था को दर्शाता है और साधन के रूप में दो जंजीरों का स्पष्ट उल्लेख करता है।
- source_word: φύλακες πρὸ τῆς θύρας
  choice: पहरेदार दरवाज़े के सामने
  rationale: जेल-संदर्भ में φύλακες के लिए ‘पहरेदार’ और πρό के स्थानिक अर्थ के लिए ‘सामने’ स्पष्ट आधुनिक हिन्दी है।
- source_word: ἐτήρουν τὴν φυλακήν
  choice: जेल की रखवाली कर रहे थे
  rationale: τηρέω का सतत पहरा देना और φυλακή का यहाँ जेल-संबंधी अर्थ सहज हिन्दी में व्यक्त होता है।
