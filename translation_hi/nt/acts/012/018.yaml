  text: When day came[a], there was no small disturbance among the soldiers over what had become of Peter.
translation:
  language: hi
  text: दिन निकलने पर सैनिकों में इस बात को लेकर कम खलबली नहीं मची कि आखिर पतरस का क्या हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: दिन निकलने पर
  rationale: यह स्वाभाविक हिन्दी में संबंधवाचक कृदंत-रचना का कालगत अर्थ व्यक्त करता है। δέ के हल्के संक्रमणकारी बल के लिए अलग से ‘अब’ जोड़ना आवश्यक नहीं है।
- source_word: τάραχος οὐκ ὀλίγος
  choice: कम खलबली नहीं मची
  rationale: यह यूनानी की न्यूनोक्ति को बनाए रखता है और साथ ही हिन्दी में पर्याप्त स्वाभाविक ढंग से बड़ी हलचल का बोध कराता है।
- source_word: ἐν τοῖς στρατιώταις
  choice: सैनिकों में
  rationale: στρατιώταις का सीधा अर्थ ‘सैनिक’ है; ‘में’ उस समूह को दर्शाता है जिसके बीच खलबली मची।
- source_word: τί ἄρα
  choice: कि आखिर ... क्या
  rationale: अप्रत्यक्ष प्रश्न में ἄρα से व्यक्त अनुमान, विस्मय या उलझन की छाया को ‘आखिर’ स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁ Πέτρος
  choice: पतरस
  rationale: हिन्दी बाइबल परंपरा में प्रचलित नामरूप अपनाया गया है।
- source_word: ἐγένετο
  choice: क्या हुआ
  rationale: किसी व्यक्ति के विषय में τί ... ἐγένετο का मुहावरेदार अर्थ ‘उसका क्या हुआ’ है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions: []
