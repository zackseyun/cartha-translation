id: ACT.12.4
reference: Acts 12:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃν καὶ πιάσας ἔθετο εἰς φυλακήν, παραδοὺς τέσσαρσιν τετραδίοις στρατιωτῶν φυλάσσειν αὐτόν, βουλόμενος μετὰ τὸ πάσχα ἀναγαγεῖν αὐτὸν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/004.yaml
  text: After arresting him[a], he put him in prison, handing him over to four squads of soldiers to guard him[b], intending to bring him out to the people after the Passover.
translation:
  language: hi
  text: उसे पकड़कर उसने जेल में डाल दिया और उसकी रखवाली के लिए उसे सैनिकों के चार दलों[a] के हवाले कर दिया। उसका इरादा था कि फसह के पर्व[b] के बाद उसे लोगों के सामने लाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सैनिकों के चार चौकड़े,” अर्थात चार-चार सैनिकों के चार दल।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द πάσχα का अर्थ “फसह” है; कुछ पुरानी अनुवाद-परंपराओं में यहाँ “ईस्टर” मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πιάσας
  choice: उसे पकड़कर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई कार्रवाई बताता है; यह प्रयोग हिरासत में लेने का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἔθετο εἰς φυλακήν
  choice: जेल में डाल दिया
  rationale: यह कारावास में रखने का स्वाभाविक आधुनिक हिंदी मुहावरा है और कथात्मक शैली में स्पष्ट है।
- source_word: παραδοὺς
  choice: हवाले कर दिया
  rationale: यह दूसरे पहरेदारों की अभिरक्षा में सौंपे जाने का भाव स्पष्ट रूप से रखता है।
- source_word: τέσσαρσιν τετραδίοις στρατιωτῶν
  choice: सैनिकों के चार दलों
  rationale: τετράδιον चार सैनिकों के एक दल को दर्शाता है; मुख्य पाठ सहज रखा गया है और प्रत्येक दल की संख्या पादटिप्पणी में दी गई है।
- source_word: φυλάσσειν αὐτόν
  choice: उसकी रखवाली के लिए
  rationale: यह उद्देश्यसूचक अनंत क्रिया का अर्थ संक्षिप्त और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: βουλόμενος
  choice: उसका इरादा था
  rationale: यह हेरोद की सोची-समझी योजना को व्यक्त करता है, बिना भावनात्मक इच्छा पर अनावश्यक बल दिए।
- source_word: μετὰ τὸ πάσχα
  choice: फसह के पर्व के बाद
  rationale: πάσχα यहूदी फसह को दर्शाता है; 'पर्व' जोड़ने से सामान्य हिंदी पाठक के लिए आशय स्पष्ट होता है।
- source_word: ἀναγαγεῖν αὐτὸν τῷ λαῷ
  choice: उसे लोगों के सामने लाए
  rationale: यह सार्वजनिक रूप से बाहर लाने या प्रस्तुत करने का भाव रखता है, पर औपचारिक मुकदमे का ऐसा विवरण नहीं जोड़ता जो यूनानी पाठ में स्पष्ट नहीं है।
- source_word: λαῷ
  choice: लोगों
  rationale: यह जनता को सामूहिक रूप में दर्शाने वाला सरल और व्यापक हिंदी शब्द है।
theological_decisions:
- issue: πάσχα का अनुवाद
  choice: फसह का पर्व
  alternative: ईस्टर
  rationale: यूनानी πάσχα का सीधा अर्थ यहूदी फसह है। कुछ पुरानी अनुवाद-परंपराओं में प्रयुक्त 'ईस्टर' मूल शब्द का यहाँ का सामान्य अर्थ नहीं दर्शाता।
translation_notes:
  register: आधुनिक मानक हिंदी की सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। सर्वनाम मूल पाठ के अनुरूप रखे गए हैं। पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
