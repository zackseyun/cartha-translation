source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὴν εἶπαν· Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον· Ὁ ἄγγελός ⸂ἐστιν αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/015.yaml
  text: But they said to her[a], “You are out of your mind.” But she kept insisting that it was so. And they kept saying, “It is his angel.”
translation:
  language: hi
  text: पर उन्होंने उससे कहा, “तुम पागल हो।” लेकिन वह ज़ोर देकर कहती रही कि बात ऐसी ही है। और वे बार-बार कहते रहे, “वह उसका स्वर्गदूत है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “उसका रक्षक स्वर्गदूत,” “उसका प्रतिनिधि स्वर्गदूत,” अथवा कुछ व्याख्याकारों के अनुसार, “उसकी आत्मा/उसका प्रेत।” यूनानी में केवल “उसका स्वर्गदूत” है।
    reason: वैकल्पिक व्याख्याएँ बताते हुए मूल यूनानी की अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: Μαίνῃ
  choice: तुम्हारा दिमाग़ खराब हो गया है
  rationale: यह आधुनिक हिन्दी में पागलपन का स्वाभाविक और तीखा आरोप है; यह न तो पुरातन लगता है, न चिकित्सकीय निदान जैसा।
- source_word: διϊσχυρίζετο
  choice: वह ज़ोर देकर कहती रही
  rationale: अपूर्ण काल निरंतर आग्रह को और क्रिया का अर्थ दृढ़ दावे को व्यक्त करता है; यह पदबंध दोनों बातों को सामने लाता है।
- source_word: οὕτως ἔχειν
  choice: कि बात ऐसी ही है
  rationale: यह यूनानी मुहावरे का सहज हिन्दी रूप है, जिसका अर्थ है कि वास्तविक स्थिति ठीक वैसी ही थी जैसा उसने कहा।
- source_word: ἔλεγον
  choice: वे बार-बार कहते रहे
  rationale: अपूर्ण काल उनकी जारी या दोहराई जाती प्रतिक्रिया को व्यक्त करता है।
- source_word: ἄγγελός
  choice: स्वर्गदूत
  rationale: इस संदर्भ में शब्द सम्भवतः पतरस से जुड़े अलौकिक दूत को दर्शाता है; हिन्दी बाइबलीय प्रयोग में 'स्वर्गदूत' स्पष्ट और प्रचलित है।
- source_word: αὐτοῦ
  choice: उसका
  rationale: सम्बन्धकारक सर्वनाम का स्वाभाविक हिन्दी अधिकारसूचक रूप, जो संदर्भ में पतरस की ओर संकेत करता है।
theological_decisions:
- issue: '''उसका स्वर्गदूत'' का अर्थ'
  choice: मुख्य पाठ में केवल 'उसका स्वर्गदूत' रखा गया।
  alternative: उसका रक्षक स्वर्गदूत; उसका प्रतिनिधि स्वर्गदूत; उसकी आत्मा/प्रेत
  rationale: यूनानी पाठ विश्वास की पृष्ठभूमि या स्वर्गदूत की भूमिका स्पष्ट नहीं करता। इसलिए मुख्य पाठ में किसी एक धार्मिक व्याख्या को आरोपित किए बिना मूल की अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। 'दिमाग़ खराब हो गया है' बोलचाल में स्वाभाविक है और संवाद की तीव्रता रखता है। निरंतर क्रियाओं के लिए 'कहती रही' और 'बार-बार कहते रहे' का प्रयोग किया गया है।
