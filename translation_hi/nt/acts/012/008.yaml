  text: εἶπεν ⸀δὲ ὁ ἄγγελος πρὸς αὐτόν· ⸀Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου· ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ· Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/008.yaml
  text: And the angel said to him[a], “Tie on your belt and put on your sandals.” And he did so. And he says to him[c][b], “Put on your cloak and follow me.”
translation:
  language: hi
  text: तब स्वर्गदूत ने उससे कहा, “अपनी कमर कस लो[a] और अपनी सैंडल पहन लो।” उसने वैसा ही किया। फिर वह उससे कहता है[b], “अपना बाहरी वस्त्र ओढ़ लो[c] और मेरे पीछे आओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना कमरबंद बाँध लो।” यूनानी आज्ञा तैयार होने के लिए कमर पर पट्टा कसने की क्रिया बताती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “वह कहता है”; यह सजीव वर्णन के लिए प्रयुक्त ऐतिहासिक वर्तमान काल है।
    reason: lexical_alternative
  - marker: c
    text: या “अपना बाहरी वस्त्र अपने चारों ओर लपेट लो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: स्वर्गदूत
  rationale: कारागार में प्रकट हुए अलौकिक प्राणी के लिए प्रसंगानुसार आधुनिक हिन्दी का स्वाभाविक बाइबिलीय शब्द।
- source_word: Ζῶσαι
  choice: अपनी कमर कस लो
  rationale: मध्यवाच्य आज्ञार्थक क्रिया कमर पर पट्टा बाँधकर तैयार होने की ठोस क्रिया बताती है; यह हिन्दी में स्वाभाविक और अर्थपूर्ण है।
- source_word: ὑπόδησαι τὰ σανδάλιά σου
  choice: अपनी सैंडल पहन लो
  rationale: मूल पाठ में निर्दिष्ट पादत्राण और उन्हें पहनने की आज्ञा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐποίησεν δὲ οὕτως
  choice: उसने वैसा ही किया
  rationale: पतरस द्वारा पिछली आज्ञाओं का पालन संक्षिप्त और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: λέγει
  choice: वह उससे कहता है
  rationale: वर्तमान काल के ऐतिहासिक प्रयोग को बनाए रखता है, जिससे यूनानी कथन की सजीवता और काल-परिवर्तन सुरक्षित रहता है।
- source_word: Περιβαλοῦ τὸ ἱμάτιόν σου
  choice: अपना बाहरी वस्त्र ओढ़ लो
  rationale: ἱμάτιον बाहरी वस्त्र को और περιβάλλω उसे अपने चारों ओर डालने या ओढ़ने को सूचित करता है; यह चयन आधुनिक हिन्दी में दोनों पक्षों को संक्षेप में रखता है।
- source_word: ἀκολούθει μοι
  choice: मेरे पीछे आओ
  rationale: यह वास्तविक रूप से पीछे चलने की आज्ञा है और ἀκολουθέω के ‘अनुसरण करने’ वाले अर्थ को स्वाभाविक हिन्दी में बनाए रखती है।
