review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the sequence of passing two security points, arriving at an iron gate leading into the city, its self-opening, proceeding one street, and the angel's immediate departure. However, “पहले और दूसरे पहरे” can naturally denote successive watches rather than the guard posts/security stations intended by φυλακή in this context. “उसके पास से चला गया” weakens ἀπ’ αὐτοῦ, which denotes departure from Peter rather than merely leaving his vicinity.
  naturalness: The Hindi is generally clear and suitably dignified. “नगर में जाता था” is less idiomatic because a gate itself does not ‘go’ into the city; “नगर में जाने वाले” naturally expresses the gate's access function. “पहरे की पहली और दूसरी चौकी” gives the narrative movement a clear, natural object.
  terminology: “लोहे का फाटक,” “नगर,” and “स्वर्गदूत” are appropriate modern standard Hindi biblical terms. “पहरे की ... चौकी” is a contextually faithful specification of the security points and does not introduce doctrinal interpretation.
  issues:
  - severity: medium
    issue: “पहले और दूसरे पहरे” is semantically imprecise in this movement context.
    rationale: φυλακή with the ordinal adjectives most naturally refers here to successive guard stations/posts. In Hindi, bare “पहले और दूसरे पहरे” ordinarily suggests first and second watch periods, which cannot readily be passed through.
  - severity: low
    issue: “जो नगर में जाता था” attributes movement to the gate itself.
    rationale: The participle φέρουσαν describes the gate as providing entry/access into the city. “नगर में जाने वाले” is idiomatic Hindi and conveys this function.
  - severity: low
    issue: “स्वर्गदूत उसके पास से चला गया” understates the departure from Peter.
    rationale: ἀπέστη ... ἀπ’ αὐτοῦ means that the angel departed from him. “उससे अलग हो गया” is direct and avoids suggesting only movement from nearby.
  revised_text: पहरे की पहली और दूसरी चौकी से होकर निकलने के बाद वे नगर में जाने वाले लोहे के फाटक पर पहुँचे। वह उनके लिए अपने-आप खुल गया[a]। बाहर निकलकर वे एक गली तक आगे बढ़े[b], और तुरन्त स्वर्गदूत उससे अलग हो गया।
  revised_footnotes:
