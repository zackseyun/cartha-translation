id: ACT.12.10
reference: Acts 12:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/010.yaml
  text: After they had passed the first guard and the second[a], they came to the iron gate leading into the city, which opened to them by itself; and after they went out, they went along one street[b], and immediately the angel departed from him.
translation:
  language: hi
  text: पहरे की पहली और दूसरी चौकी से होकर निकलने के बाद वे नगर में जाने वाले लोहे के फाटक पर पहुँचे। वह उनके लिए अपने-आप खुल गया[a]। बाहर निकलकर वे एक गली तक आगे बढ़े[b], और तुरन्त स्वर्गदूत उससे अलग हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उनके लिए स्वतः खुल गया।”
    reason: lexical_alternative
  - marker: b
    text: “एक गली तक” का सम्भावित अर्थ है कि स्वर्गदूत के चले जाने से पहले वे एक गली जितनी दूरी आगे गए।
    reason: cultural_note
lexical_decisions:
- source_word: διελθόντες
  choice: से होकर निकलने के बाद
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले पूरी हुई गतिविधि बताता है; यह पदबंध घटनाओं का क्रम स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: φυλακήν
  choice: पहरे
  rationale: इस प्रसंग में शब्द क्रमिक सुरक्षा-पहरों या पहरे की चौकियों की ओर संकेत करता है। ‘पहरे’ मूल की कुछ व्यापकता बनाए रखता है और अनावश्यक रूप से निश्चित ‘चौकी’ नहीं जोड़ता।
- source_word: πύλην τὴν σιδηρᾶν
  choice: लोहे के फाटक
  rationale: यह फाटक की सामग्री पर दिए गए मूल बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὴν φέρουσαν εἰς τὴν πόλιν
  choice: जो नगर में जाता था
  rationale: कृदन्त यहाँ फाटक से मिलने वाले नगर-प्रवेश का वर्णन करता है; हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: αὐτομάτη
  choice: अपने-आप
  rationale: यह बिना किसी दिखाई देने वाले व्यक्ति द्वारा खोले जाने का भाव देता है और आधुनिक यांत्रिक अर्थ वाले ‘स्वचालित रूप से’ से बचता है।
- source_word: ῥύμην μίαν
  choice: एक गली तक
  rationale: ῥύμη गली या सड़क को सूचित करता है, और कर्मकारक यहाँ चली गई दूरी का बोध करा सकता है। ‘एक गली तक’ मूल की संक्षिप्तता रखते हुए उस सम्भावित अर्थ को स्वाभाविक हिन्दी में देता है।
- source_word: εὐθέως
  choice: तुरन्त
  rationale: यह लूका की कथा में घटनाओं के तत्काल क्रम को वर्तमान, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἀπέστη ὁ ἄγγελος ἀπ’ αὐτοῦ
  choice: स्वर्गदूत उसके पास से चला गया
  rationale: यह अलग होकर चले जाने का अर्थ देता है, पर ‘छोड़ दिया’ से उत्पन्न हो सकने वाले परित्याग के अतिरिक्त भाव से बचता है।
theological_decisions:
- issue: फाटक का अपने-आप खुलना
  choice: वह उनके लिए अपने-आप खुल गया
  alternative: वह उनके लिए स्वतः खुल गया
  rationale: मूल घटना को अद्भुत रूप में प्रस्तुत करता है, पर यह नहीं बताता कि फाटक किस प्रक्रिया से खुला; अनुवाद भी कोई यांत्रिक या अतिरिक्त कारण नहीं जोड़ता।
- issue: φυλακή का सन्दर्भ
  choice: पहले और दूसरे पहरे
  alternative: पहरे की पहली और दूसरी चौकी
  rationale: प्रसंग में पतरस क्रमिक सुरक्षा-व्यवस्थाओं से निकलता है। ‘पहरे’ इस अर्थ को व्यक्त करते हुए यह खुला रखता है कि संकेत पहरेदारों, पहरे या उनकी चौकियों से है।
- issue: ῥύμην μίαν में दूरी का भाव
  choice: एक गली तक आगे बढ़े
  alternative: एक गली में आगे बढ़े
  rationale: कर्मकारक को दूरी का सूचक समझना प्रसंग में सम्भावित है, किन्तु गली में चलने का अर्थ भी भाषिक रूप से जुड़ा रहता है; पादटिप्पणी चुने हुए अर्थ को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किन्तु गरिमापूर्ण रखी गई है। ‘नगर’, ‘पहरा’, ‘फाटक’ और ‘स्वर्गदूत’ सामान्य बाइबलीय कथाशैली के अनुरूप हैं; वाक्यों को हिन्दी की पठनीयता के लिए तीन भागों में बाँटा गया है।
