  text: ὁ δὲ Πέτρος ἐπέμενεν κρούων· ἀνοίξαντες δὲ εἶδαν αὐτὸν καὶ ἐξέστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/016.yaml
  text: But Peter kept on knocking[a], and when they opened the door[b], they saw him and were astonished.
translation:
  language: hi
  text: पर पतरस लगातार खटखटाता रहा[a]। जब उन्होंने खोला[b], तो उसे देखकर वे चकित रह गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खटखटाता ही रहा” अथवा “खटखटाने में लगा रहा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “खोलकर उन्होंने उसे देखा और चकित रह गए।” प्रसंग से द्वार या फाटक समझा जाता है, पर मूल यूनानी में यहाँ वह शब्द नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμενεν
  choice: लगातार … रहा
  rationale: अपूर्णकालिक क्रिया यहाँ जारी अथवा बार-बार होने वाली क्रिया व्यक्त करती है; ‘लगातार … रहा’ इसे सहज आधुनिक हिन्दी में प्रकट करता है।
- source_word: κρούων
  choice: खटखटाता
  rationale: इस प्रसंग में κρούω द्वार खटखटाने के अर्थ में है और कृदंत मुख्य क्रिया के साथ चल रही क्रिया बताता है।
- source_word: ἀνοίξαντες
  choice: जब उन्होंने खोला
  rationale: अओरिस्ट कृदंत को प्रसंगानुसार कालवाचक उपवाक्य बनाया गया है। मूल यूनानी में खोली गई वस्तु स्पष्ट नहीं कही गई, इसलिए मुख्य पाठ में ‘द्वार’ नहीं जोड़ा गया।
- source_word: εἶδαν αὐτὸν
  choice: उसे देखकर
  rationale: हिन्दी कथा-शैली में यह स्वाभाविक रूप से ‘उन्होंने उसे देखा’ और उसके फलस्वरूप हुई चकित प्रतिक्रिया—दोनों का क्रम बनाए रखता है।
- source_word: ἐξέστησαν
  choice: चकित रह गए
  rationale: यह तीव्र विस्मय प्रकट करता है, पर ‘अपने आपे से बाहर हो गए’ जैसे अत्यधिक मुहावरेदार अर्थ को आरोपित नहीं करता।
- source_word: δὲ
  choice: पर
  rationale: पहला δέ पिछली स्थिति से विरोध दिखाता है; दूसरा δέ हिन्दी वाक्य-विन्यास में अलग शब्द के बिना स्वाभाविक रूप से समाहित है।
- source_word: Πέτρος
  choice: पतरस
  rationale: हिन्दी बाइबल परंपरा में प्रचलित मानक नाम-रूप अपनाया गया है।
