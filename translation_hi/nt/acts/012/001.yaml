id: ACT.12.1
reference: Acts 12:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Κατ’ ἐκεῖνον δὲ τὸν καιρὸν ἐπέβαλεν Ἡρῴδης ὁ βασιλεὺς τὰς χεῖρας κακῶσαί τινας τῶν ἀπὸ τῆς ἐκκλησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/001.yaml
  text: About that time Herod the king laid hands on some from the church to mistreat them[a][b][c].
translation:
  language: hi
  text: लगभग उसी समय राजा हेरोदेस ने कलीसिया के कुछ लोगों को सताने के लिए उन पर हाथ डाला।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसी समय” अथवा “उसी समय के आस-पास।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उन पर हाथ डाला।” यह अभिव्यक्ति कलीसिया के कुछ लोगों के विरुद्ध शत्रुतापूर्ण कार्रवाई को दर्शाती है।
    reason: lexical_alternative
  - marker: c
    text: या, “हानि पहुँचाने के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατ’ ἐκεῖνον δὲ τὸν καιρόν
  choice: लगभग उसी समय
  rationale: κατά के साथ समयवाचक कर्मकारक यहाँ ‘लगभग/आस-पास’ का भाव देता है। δέ का हल्का कथात्मक संक्रमण हिंदी में अलग शब्द जोड़े बिना स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἐπέβαλεν ... τὰς χεῖρας
  choice: उन पर हाथ डाला
  rationale: यह यूनानी मुहावरा शत्रुतापूर्ण कार्रवाई दर्शाता है। हिंदी का ‘हाथ डालना’ मूल बिंब को बनाए रखता है और अगले उद्देश्यवाचक क्रियारूप को कार्रवाई का आशय स्पष्ट करने देता है।
- source_word: Ἡρῴδης ὁ βασιλεύς
  choice: राजा हेरोदेस
  rationale: यह आधुनिक हिंदी में स्वाभाविक पदक्रम है और यूनानी में हेरोदेस को राजा बताए जाने का अर्थ ठीक रखता है।
- source_word: κακῶσαί
  choice: सताने के लिए
  rationale: यहाँ क्रिया किसी को बुरा व्यवहार सहने या हानि उठाने पर विवश करने का भाव देती है। ‘सताना’ व्यक्तिगत शत्रुतापूर्ण दुर्व्यवहार को सहज हिंदी में व्यक्त करता है, जबकि ‘हानि पहुँचाना’ भी संभव है।
- source_word: τινας τῶν ἀπὸ τῆς ἐκκλησίας
  choice: कलीसिया के कुछ लोगों को
  rationale: यह वाक्यांश मसीही समुदाय से जुड़े कुछ व्यक्तियों की पहचान करता है। यह हिंदी रूप शाब्दिक ‘कलीसिया में से कुछ’ की अपेक्षा अधिक स्वाभाविक है।
theological_decisions:
- issue: ἐκκλησία का अनुवाद
  choice: कलीसिया
  alternative: सभा / मंडली
  rationale: प्रेरितों के काम में यह शब्द सामान्यतः मसीही समुदाय को सूचित करता है। ‘कलीसिया’ मानक बाइबलीय हिंदी में पहचाना जाने वाला शब्द है; ‘सभा’ अधिक शाब्दिक, पर इस संदर्भ में कम विशिष्ट हो सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिंदी। मुख्य पाठ में यूनानी मुहावरे का बिंब रखा गया है और पादटिप्पणी में उसका आशय स्पष्ट किया गया है।
