base_translation:
  language: en
  yaml_path: translation/nt/acts/012/002.yaml
  text: And he killed James[a], the brother of John, with the sword.
translation:
  language: hi
  text: और उसने यूहन्ना के भाई याकूब को तलवार से मार डाला[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मृत्यु के घाट उतार दिया” या “मृत्युदंड दिया।” यूनानी क्रिया यहाँ याकूब को मार डालने की बात कहती है; व्यापक संदर्भ से आधिकारिक दंड का संकेत हो सकता है, पर पद स्वयं कानूनी प्रक्रिया को स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῖλεν
  choice: मरवा डाला
  rationale: यहाँ ἀναιρέω किसी की मृत्यु कराने को व्यक्त करता है। कर्ता हेरोदेस है, इसलिए हिंदी का प्रेरणार्थक प्रयोग यह स्वाभाविक रूप से बताता है कि हत्या उसके आदेश या अधिकार से हुई, बिना मुख्य पाठ में विधिक मृत्युदंड का अर्थ जोड़ने के।
- source_word: δὲ
  choice: और
  rationale: δέ कथा को आगे बढ़ाने वाला सामान्य संयोजक है; “और” अनावश्यक विरोध या कालक्रमिक बल जोड़े बिना प्रवाह बनाए रखता है।
- source_word: Ἰάκωβον
  choice: याकूब
  rationale: ग्रीक Ἰάκωβος के लिए हिंदी बाइबलीय परंपरा में प्रचलित नामरूप “याकूब” रखा गया है।
- source_word: τὸν ἀδελφὸν Ἰωάννου
  choice: यूहन्ना के भाई
  rationale: यह समानाधिकरण पदबंध बताता है कि किस याकूब की बात है; हिंदी में यह क्रम स्वाभाविक और स्पष्ट है।
- source_word: μαχαίρῃ
  choice: तलवार से
  rationale: μάχαιρα तलवार या छोटी तलवार को सूचित करता है और यहाँ करण कारक में है; “तलवार से” साधन को ठोस और सीधे रूप में सुरक्षित रखता है।
theological_decisions:
- issue: हेरोदेस की कार्रवाई का स्वरूप
  choice: मुख्य पाठ में “मरवा डाला” कहकर मृत्यु कराने की कार्रवाई व्यक्त की गई है, पर उसे स्पष्ट रूप से न्यायिक मृत्युदंड नहीं कहा गया।
  alternative: “मृत्युदंड दिलाया” या “फाँसी दिलाई” जैसे पद राज्य-प्रायोजित दंड पर अधिक बल दे सकते हैं।
  rationale: ἀνεῖλεν मृत्यु कराने को बताता है और μαχαίρῃ साधन निर्दिष्ट करता है। संदर्भ आधिकारिक उत्पीड़न का संकेत देता है, पर इस पद में कानूनी प्रक्रिया स्पष्ट नहीं की गई; इसलिए अधिक विशिष्ट विधिक अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और कथात्मक शैली। “मार डाला” की तुलना में “मरवा डाला” हेरोदेस की शासकीय भूमिका को स्वाभाविक हिंदी में व्यक्त करता है; फिर भी इसे विधिक मृत्युदंड के रूप में सीमित नहीं करता।
