  text: परन्तु बरनबास और शाऊल सेवा-कार्य पूरा करके यरूशलेम को लौटे[a] और यूहन्ना को, जो मरकुस कहलाता था, अपने साथ ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में ‘यरूशलेम को लौटे’ के बजाय ‘यरूशलेम से लौटे’ है।
    reason: textual_variant
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: लौटे
  rationale: यह क्रिया यहाँ वापस जाने या लौटने का सामान्य अर्थ देती है; ‘लौटे’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम लौटे
  rationale: प्रदत्त SBLGNT पाठ में εἰς सामान्यतः गंतव्य ‘को/की ओर’ बताता है, इसलिए मुख्य पाठ यरूशलेम को लौटने का अर्थ रखता है। अर्थ को प्रभावित करने वाले ‘यरूशलेम से’ पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: πληρώσαντες τὴν διακονίαν
  choice: अपनी सेवा पूरी करके
  rationale: πληρόω कार्य पूरा करने और διακονία सेवा या सेवकाई का बोध कराता है। ‘अपनी सेवा पूरी करके’ सहज हिन्दी में सौंपे गए सेवा-कार्य को व्यक्त करता है, बिना उसे मुख्य पाठ में विशेष रूप से राहत-कार्य कहे।
- source_word: συμπαραλαβόντες
  choice: अपने साथ ले गए
  rationale: सहभागी कृदन्त किसी व्यक्ति को साथ लेने का अर्थ देता है; हिन्दी में यह स्वाभाविक अभिव्यक्ति है।
- source_word: Ἰωάννην τὸν ἐπικληθέντα Μᾶρκον
  choice: यूहन्ना को, जो मरकुस कहलाता था
  rationale: ἐπικληθέντα निष्क्रिय रूप में किसी नाम से पुकारे या कहलाए जाने का बोध देता है; अनुवाद दोनों नामों का संबंध स्पष्ट रखता है।
theological_decisions:
- issue: गंतव्य/प्रस्थान-संबंधी पाठांतर
  choice: यरूशलेम लौटे
  alternative: यरूशलेम से लौटे
  rationale: दिए गए SBLGNT मूलपाठ में εἰς Ἰερουσαλήμ है, जिसका सीधा अर्थ ‘यरूशलेम को’ है। कथा-संदर्भ के अनुकूल और कुछ पांडुलिपियों में पाए जाने वाले ἐξ Ἰερουσαλήμ (‘यरूशलेम से’) को मुख्य पाठ में प्रतिस्थापित न करके पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। ‘सेवा’ व्यापक διακονία को बनाए रखता है और संदर्भ से अनुमानित ‘राहत-कार्य’ को अनावश्यक रूप से मुख्य पाठ में नहीं जोड़ता।
