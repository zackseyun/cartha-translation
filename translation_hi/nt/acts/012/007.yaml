base_translation:
  language: en
  yaml_path: translation/nt/acts/012/007.yaml
  text: And behold[a], an angel of the Lord stood near, and a light shone in the cell. Striking Peter on the side, he woke him, saying[b], “Get up quickly.” And his chains fell off from his hands.
translation:
  language: hi
  text: और देखो, प्रभु का एक स्वर्गदूत उसके पास आ खड़ा हुआ[a], और उस कोठरी[b] में एक प्रकाश चमका। उसने पतरस के पहलू पर मारकर उसे जगाया और कहा, “जल्दी उठो।” और उसके हाथों से जंजीरें गिर पड़ीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके पास खड़ा हो गया” अथवा “अचानक प्रकट हुआ।” यूनानी क्रिया निकट खड़े होने के साथ-साथ अचानक उपस्थित होने पर भी बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “कमरे” अथवा “कक्ष।” यूनानी शब्द अधिक सामान्य है, पर जेल के प्रसंग में “कोठरी” उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: और देखो
  rationale: यह कथन की जीवंत, ध्यान आकर्षित करने वाली शक्ति को बनाए रखता है और लूका की कथाशैली के अनुरूप है।
- source_word: ἄγγελος κυρίου
  choice: प्रभु का एक स्वर्गदूत
  rationale: अनिश्चितता और संबंधवाचक रचना दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘प्रभु’ κύριος का प्रचलित नया नियमीय अनुवाद है।
- source_word: ἐπέστη
  choice: अचानक उसके पास आ खड़ा हुआ
  rationale: क्रिया में निहित निकट उपस्थिति और आकस्मिकता दोनों को व्यक्त करता है, बिना इसे केवल ‘प्रकट हुआ’ तक सीमित किए।
- source_word: φῶς ἔλαμψεν
  choice: ज्योति चमक उठी
  rationale: मूल संज्ञा-क्रिया संयोजन को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘चमक उठी’ घटना की आकस्मिकता के अनुकूल है।
- source_word: ἐν τῷ οἰκήματι
  choice: उस कोठरी में
  rationale: οἴκημα सामान्यतः कमरा या कक्ष हो सकता है, पर जेल का निकट संदर्भ ‘कोठरी’ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: πατάξας
  choice: मारकर
  rationale: क्रिया के अपेक्षाकृत प्रबल शारीरिक स्पर्श को बनाए रखता है; ‘छूकर’ या ‘हल्का धक्का देकर’ मूल अर्थ को अनावश्यक रूप से नरम कर देता।
- source_word: τὴν πλευρὰν
  choice: पसली पर
  rationale: πλευρά शरीर की बगल या पसली वाले भाग को दर्शाता है; ‘पसली पर’ आधुनिक हिन्दी में दृश्य को स्पष्ट करता है।
- source_word: ἤγειρεν αὐτόν
  choice: उसे जगाया
  rationale: इस प्रसंग में पतरस सो रहा है, इसलिए ἐγείρω का संदर्भगत अर्थ ‘जगाना’ है।
- source_word: Ἀνάστα ἐν τάχει
  choice: जल्दी उठ!
  rationale: आदेश की तत्परता को संक्षिप्त, स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν
  choice: उसके हाथों से जंजीरें गिर पड़ीं
  rationale: मूल के ‘हाथों से’ को सुरक्षित रखते हुए जंजीरों के अचानक अलग होकर गिरने को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
