    text: अर्थात अखमीरी रोटी से संबंधित पर्वकाल, जिसमें बिना खमीर की रोटी खाई जाती थी।
    reason: cultural_note
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: जब उसने देखा
  rationale: एओरिस्ट कृदंत यहाँ काल-सूचक परिस्थितिजन्य अर्थ देता है और हेरोदेस के देखने को उसकी अगली कार्रवाई से पहले रखता है।
- source_word: ἀρεστόν ἐστιν
  choice: यह ... को अच्छा लगा
  rationale: यह स्वाभाविक आधुनिक हिन्दी में प्रसन्नता अथवा अनुकूल स्वीकृति का भाव व्यक्त करता है।
- source_word: τοῖς Ἰουδαίοις
  choice: यहूदियों
  rationale: यूनानी पाठ सामान्य रूप से ‘यहूदियों’ कहता है; वह इसे स्पष्टतः केवल अगुओं या यहूदिया-निवासियों तक सीमित नहीं करता।
- source_word: προσέθετο
  choice: आगे बढ़ा
  rationale: अनन्त क्रिया के साथ यह क्रिया किसी और काम को करने के लिए आगे बढ़ने का मुहावरेदार अर्थ देती है।
- source_word: συλλαβεῖν
  choice: गिरफ्तार करने
  rationale: इस शासकीय और कथात्मक संदर्भ में इसका अर्थ किसी व्यक्ति को पकड़कर हिरासत में लेना है।
- source_word: καὶ Πέτρον
  choice: पतरस को भी
  rationale: καί पतरस को पिछले लक्ष्य याकूब के साथ एक और लक्ष्य के रूप में जोड़ता है।
- source_word: ἦσαν δὲ ἡμέραι τῶν ἀζύμων
  choice: वे अख़मीरी रोटी के पर्व के दिन थे
  rationale: यह समय-सूचक टिप्पणी मूल पर्व-संज्ञा को बनाए रखती है और उसे फसह के साथ पूरी तरह एक नहीं करती।
theological_decisions:
- issue: प्रेरितों के काम में Ἰουδαίοις का अनुवाद
  choice: यहूदियों
  alternative: यहूदिया के लोग; यहूदी अगुए
  rationale: मूल पाठ यहाँ संदर्भ को किसी भौगोलिक क्षेत्र या नेतृत्व-वर्ग तक स्पष्ट रूप से सीमित नहीं करता, इसलिए व्यापक शब्द रखा गया है।
- issue: τῶν ἀζύμων का अनुवाद
  choice: अख़मीरी रोटी के पर्व के दिन
  alternative: फसह का पर्व
  rationale: यूनानी पाठ विशेष रूप से अख़मीरी रोटी के दिनों का नाम लेता है; संबंधित होते हुए भी इसे केवल ‘फसह’ कहना भेद को मिटा सकता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘अख़मीरी रोटी’ सामान्य पाठक के लिए बोधगम्य है और पारंपरिक पर्व-संज्ञा को स्पष्ट रखती है। कोष्ठक मूल की समय-सूचक टिप्पणी को सुरक्षित रखता है।
