base_translation:
  language: en
  yaml_path: translation/nt/acts/012/003.yaml
  text: And when he saw that it was pleasing to the Jews[a], he proceeded to arrest Peter also[b]. (Now these were the days of Unleavened Bread.)
translation:
  language: hi
  text: जब उसने देखा कि यहूदियों को यह अच्छा लगा, तो उसने पतरस को भी गिरफ्तार करने का कदम उठाया। (उस समय अखमीरी रोटी के दिन थे।)[b]
  philosophy: optimal-equivalence
  footnotes:
