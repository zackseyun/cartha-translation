translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। लंबे यूनानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। नामों के प्रचलित हिन्दी बाइबलीय रूप ‘मरियम,’ ‘यूहन्ना,’ और ‘मरकुस’ रखे गए हैं। मूल पाठ में वास्तविक अर्थगत विकल्प के लिए आवश्यक पादटिप्पणी नहीं पाई गई; अंग्रेज़ी परत की पादटिप्पणी का विकल्प स्वयं उसके मुख्य पाठ के समान है और हिन्दी में ‘भी’ न जोड़ने से उसका कारण अप्रासंगिक हो जाता है।
