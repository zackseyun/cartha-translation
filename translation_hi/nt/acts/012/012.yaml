  text: Συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν ⸀τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/012.yaml
  text: And when he realized this[a], he went to the house of Mary, the mother of John who was called Mark, where many had gathered together and were praying.
translation:
  language: hi
  text: जब उसे यह बात समझ में आई, तो वह मरियम के घर गया। मरियम उस यूहन्ना की माँ थी जो मरकुस कहलाता था। वहाँ बहुत-से लोग इकट्ठे थे और प्रार्थना कर रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνιδών
  choice: जब उसे यह बात समझ में आई
  rationale: यह कृदन्त पिछले प्रसंग के बाद पतरस को अपनी स्थिति का पूरा बोध होने को व्यक्त करता है। संदर्भ से निहित कर्म को ‘यह बात’ के रूप में देना स्वाभाविक हिन्दी है।
- source_word: τε
  choice: तो
  rationale: यह हल्का कथात्मक संयोजक है; ‘तो’ बोध होने और उसके बाद की क्रिया के संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: ἦλθεν ἐπὶ τὴν οἰκίαν
  choice: वह ... के घर गया
  rationale: यह पद किसी स्थान की ओर जाने को दर्शाता है; कथावृत्त के दृष्टिकोण से ‘घर गया’ स्वाभाविक है।
- source_word: τῆς Μαρίας τῆς μητρὸς Ἰωάννου
  choice: मरियम के घर गया, जो यूहन्ना की माँ थी
  rationale: सम्बन्धकारक पद मरियम की पहचान यूहन्ना की माँ के रूप में करता है; हिन्दी में संबंध स्पष्ट और स्वाभाविक रखा गया है।
- source_word: τοῦ ἐπικαλουμένου Μάρκου
  choice: उस यूहन्ना की, जो मरकुस कहलाता था
  rationale: ἐπικαλέω का कर्मवाच्य कृदन्त यूहन्ना को उसके अतिरिक्त नाम मरकुस से पहचानता है। मूल में ‘भी’ के लिए अलग क्रियाविशेषण नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: οὗ
  choice: वहाँ
  rationale: सम्बन्धवाचक क्रियाविशेषण मरियम के घर को स्थान के रूप में इंगित करता है; नई हिन्दी वाक्य-रचना में ‘वहाँ’ स्पष्ट और सहज है।
- source_word: ἱκανοὶ
  choice: बहुत-से लोग
  rationale: बहुवचन ἱκανοί यहाँ पर्याप्त बड़ी संख्या व्यक्त करता है; ‘बहुत-से लोग’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: συνηθροισμένοι
  choice: इकट्ठे थे
  rationale: ἦσαν के साथ पूर्ण कृदन्त पहले इकट्ठा होने से बनी हुई अवस्था दर्शाता है; ‘इकट्ठे थे’ उस परिणामी अवस्था को संक्षेप में व्यक्त करता है।
- source_word: καὶ προσευχόμενοι
  choice: और प्रार्थना कर रहे थे
  rationale: वर्तमान कृदन्त उस समय जारी प्रार्थना को दर्शाता है; अपूर्ण वर्तमान रूप हिन्दी में निरंतर क्रिया को स्पष्ट करता है।
