  text: τακτῇ δὲ ἡμέρᾳ ὁ Ἡρῴδης ἐνδυσάμενος ἐσθῆτα βασιλικὴν ⸀καὶ καθίσας ἐπὶ τοῦ βήματος ἐδημηγόρει πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/021.yaml
  text: On an appointed day[a], Herod, having put on royal clothing and having sat down on the tribunal[b], was delivering a public address to them.
translation:
  language: hi
  text: एक नियत दिन पर, हेरोदेस ने राजसी वस्त्र पहनकर और मंच[a] पर बैठकर उन्हें सार्वजनिक रूप से संबोधित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्यायासन’ या ‘औपचारिक आसन’। यूनानी βῆμα किसी अधिकारी के औपचारिक आसन या उठे हुए मंच को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τακτῇ ... ἡμέρᾳ
  choice: नियत दिन
  rationale: यह पदबंध पहले से ठहराए या निर्धारित दिन को सूचित करता है; ‘नियत दिन’ संक्षिप्त, स्वाभाविक और औपचारिक अवसर के अनुकूल है।
- source_word: ἐνδυσάμενος
  choice: पहनकर
  rationale: अओरिस्ट मध्यवाच्य कृदंत हेरोदेस के स्वयं वस्त्र धारण करने और उसके बाद बैठने की क्रमिक क्रिया व्यक्त करता है।
- source_word: ἐσθῆτα βασιλικὴν
  choice: राजसी वस्त्र
  rationale: ἐσθής सामान्यतः पोशाक या वस्त्र को दर्शा सकता है; ‘राजसी वस्त्र’ बिना अनावश्यक रूप से अनेक चोगों का अर्थ थोपे शाही पहनावे को व्यक्त करता है।
- source_word: καθίσας
  choice: बैठा
  rationale: हिन्दी में ‘पहनकर ... बैठा’ मूल के क्रमिक कृदंतों को स्वाभाविक कथात्मक रूप में रखता है।
- source_word: ἐπὶ τοῦ βήματος
  choice: न्यायासन
  rationale: βῆμα किसी अधिकारी के औपचारिक आसन अथवा ऊँचे मंच को सूचित कर सकता है। प्रसंग में ‘न्यायासन’ उसकी आधिकारिक गरिमा बनाए रखता है, जबकि पादटिप्पणी व्यापक अर्थ बताती है।
- source_word: ἐδημηγόρει
  choice: सार्वजनिक रूप से संबोधित करने लगा
  rationale: δημηγορέω जनसभा के सामने भाषण देने को दर्शाता है। अपूर्णकाल की जारी क्रिया को सहज हिन्दी में ‘संबोधित करने लगा’ से व्यक्त किया गया है।
- source_word: πρὸς αὐτούς
  choice: उन्हें
  rationale: यह संबोधन की दिशा और उपस्थित श्रोताओं को स्वाभाविक हिन्दी में व्यक्त करता है।
