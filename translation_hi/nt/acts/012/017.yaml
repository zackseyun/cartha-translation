source:
  edition: SBLGNT
  text: κατασείσας δὲ αὐτοῖς τῇ χειρὶ σιγᾶν διηγήσατο αὐτοῖς πῶς ὁ κύριος αὐτὸν ἐξήγαγεν ἐκ τῆς φυλακῆς, εἶπέν ⸀τε· Ἀπαγγείλατε Ἰακώβῳ καὶ τοῖς ἀδελφοῖς ταῦτα. καὶ ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/017.yaml
  text: But motioning to them with his hand to be silent[a], he explained to them how the Lord had brought him out of the prison. And he said, “Report these things to James and to the brothers.” Then he departed and went to another place.
translation:
  language: hi
  text: परन्तु उसने हाथ से उन्हें चुप रहने का संकेत किया और उन्हें विस्तार से बताया कि प्रभु उसे किस प्रकार जेल से बाहर निकाल लाया था। फिर उसने कहा, “ये बातें याकूब और भाइयों[a] को बता देना।” तब वह वहाँ से निकलकर किसी दूसरी जगह चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “भाइयों और बहनों”; यूनानी में शाब्दिक रूप से “भाइयों” है, जो प्रसंग के अनुसार विश्वासियों के व्यापक समुदाय को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατασείσας ... τῇ χειρὶ σιγᾶν
  choice: हाथ से उन्हें चुप रहने का संकेत किया
  rationale: यह वाक्यांश हाथ के उस संकेत को स्वाभाविक हिन्दी में व्यक्त करता है जिसका उद्देश्य उपस्थित लोगों को शांत करना था; संकेत की ठीक-ठीक मुद्रा अनावश्यक रूप से निश्चित नहीं की गई।
- source_word: διηγήσατο
  choice: विस्तार से बताया
  rationale: क्रिया किसी घटना का क्रमबद्ध या विस्तृत वर्णन करने का भाव रखती है; यह चयन सामान्य आधुनिक हिन्दी में उस भाव को स्पष्ट करता है।
- source_word: πῶς
  choice: किस प्रकार
  rationale: यह प्रभु द्वारा पतरस को बाहर निकालने की रीति या घटना का परिचय देता है और यूनानी की अभिव्यक्ति को बनाए रखता है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: यह κύριος का स्थापित और गरिमापूर्ण हिन्दी रूप है तथा पाठ में निहित दैवी कर्ता की पहचान को इससे अधिक विशिष्ट नहीं बनाता।
- source_word: ἐξήγαγεν ἐκ τῆς φυλακῆς
  choice: जेल से बाहर निकाल लाया था
  rationale: यह बन्दी स्थान से बाहर ले आने और छुटकारे की क्रिया को स्पष्ट, सहज हिन्दी में व्यक्त करता है; पूर्ण भूतकाल पूर्ववर्ती घटना को वर्तमान वर्णन के संबंध में दिखाता है।
- source_word: Ἀπαγγείλατε
  choice: बता देना
  rationale: आज्ञार्थक क्रिया महत्वपूर्ण समाचार आगे पहुँचाने को कहती है; ‘बता देना’ बोलचाल में सहज होने के साथ प्रसंग के लिए पर्याप्त गंभीर है।
- source_word: Ἰακώβῳ
  choice: याकूब
  rationale: नए नियम की हिन्दी परम्परा में इस व्यक्तिगत नाम का मानक रूप ‘याकूब’ है।
- source_word: τοῖς ἀδελφοῖς
  choice: भाइयों
  rationale: यूनानी में पुल्लिंग बहुवचन का सीधा रूप सुरक्षित रखा गया है; प्रसंग में व्यापक विश्वासी समुदाय की सम्भावना पादटिप्पणी में दी गई है।
- source_word: ἐξελθὼν ἐπορεύθη εἰς ἕτερον τόπον
  choice: वहाँ से निकलकर किसी दूसरी जगह चला गया
  rationale: यह वर्तमान स्थान से निकलने और अन्य अनिर्दिष्ट स्थान की ओर जाने—दोनों गतियों को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: κύριος का अभिप्रेत व्यक्ति
  choice: ‘प्रभु’ रखा गया है और उसी को पतरस को छुड़ाने वाला दैवी कर्ता बताया गया है।
  alternative: इसे विशेष रूप से ‘प्रभु यीशु’ या सामान्य रूप से ‘परमेश्वर’ कहना।
  rationale: यूनानी पाठ केवल ὁ κύριος कहता है। प्रेरितों के काम में यह उपाधि जी उठे यीशु की ओर संकेत कर सकती है, पर यहाँ पाठ स्वयं इसे स्पष्ट नहीं करता; इसलिए अनिश्चितता को सुरक्षित रखा गया है।
- issue: τοῖς ἀδελφοῖς का सामाजिक दायरा
  choice: मुख्य पाठ में ‘भाइयों’ रखा गया है।
  alternative: ‘भाइयों और बहनों’ अथवा ‘साथी विश्वासियों’ के रूप में व्यापक समुदाय को स्पष्ट करना।
  rationale: व्याकरणिक रूप पुल्लिंग बहुवचन है, जबकि प्रसंग में यह पूरे विश्वासी समुदाय या उसके प्रतिनिधियों को समाविष्ट कर सकता है। मुख्य पाठ मूल रूप को रखता है और सम्भावित व्यापक अर्थ को पादटिप्पणी में बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘जेल’ सामान्य पाठक के लिए तुरंत समझ में आने वाला शब्द है; ‘कारागार’ की अपेक्षा यह अधिक स्वाभाविक है। वाक्य-क्रम घटना की प्रगति और पतरस के निर्देश की संक्षिप्तता बनाए रखता है।
