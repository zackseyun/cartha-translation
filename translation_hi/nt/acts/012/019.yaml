source:
  edition: SBLGNT
  text: Ἡρῴδης δὲ ἐπιζητήσας αὐτὸν καὶ μὴ εὑρὼν ἀνακρίνας τοὺς φύλακας ἐκέλευσεν ἀπαχθῆναι, καὶ κατελθὼν ἀπὸ τῆς Ἰουδαίας ⸀εἰς Καισάρειαν διέτριβεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/019.yaml
  text: But Herod[a], after searching for him and not finding him, examined the guards and ordered them to be led away to execution. Then he went down from Judea to Caesarea and stayed there.
translation:
  language: hi
  text: पर हेरोदेस ने उसकी खोज की, और जब वह नहीं मिला, तो पहरेदारों से पूछताछ करने के बाद उन्हें मृत्युदंड के लिए ले जाने की आज्ञा दी।[a] फिर वह यहूदिया से नीचे उतरकर कैसरिया गया और वहीं रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्हें ले जाने की आज्ञा दी।” इस प्रसंग में इसका आशय सम्भवतः उन्हें मृत्युदंड के लिए ले जाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητήσας
  choice: उसकी खोज की
  rationale: यह क्रिया पतरस को ढूँढ़ने के लिए किए गए सक्रिय प्रयास को व्यक्त करती है; भूतकालिक कृदंत की पूर्ववर्ती क्रिया को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: μὴ εὑρὼν
  choice: जब वह नहीं मिला
  rationale: यह असफल खोज को स्पष्ट और सहज हिन्दी में व्यक्त करता है तथा पूछताछ से पहले की घटना का क्रम बनाए रखता है।
- source_word: ἀνακρίνας
  choice: पहरेदारों से पूछताछ करके
  rationale: ἀνακρίνω यहाँ आधिकारिक या न्यायिक जाँच के अर्थ में है; ‘पूछताछ’ सामान्य पाठक के लिए इस संदर्भ को स्पष्ट करती है।
- source_word: τοὺς φύλακας
  choice: पहरेदारों
  rationale: यह पतरस की निगरानी के लिए नियुक्त सैनिकों का स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: ἐκέλευσεν ἀπαχθῆναι
  choice: उन्हें ले जाकर मृत्युदंड देने की आज्ञा दी
  rationale: ἀπαχθῆναι का शाब्दिक अर्थ ‘ले जाया जाना’ है, पर इस न्यायिक संदर्भ में इसका संभावित आशय वध या मृत्युदंड के लिए ले जाना है। मुख्य पाठ अर्थ स्पष्ट करता है और शाब्दिक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: κατελθὼν
  choice: चला गया
  rationale: यूनानी में शाब्दिक रूप से ‘नीचे गया’ है और यह ऊँचे भीतरी क्षेत्र से तटीय कैसरिया की यात्रा-संबंधी अभिव्यक्ति है। आधुनिक हिन्दी में ‘चला गया’ अधिक स्वाभाविक है; भौगोलिक बारीकी अर्थ के लिए अनिवार्य नहीं है।
- source_word: Ἰουδαίας
  choice: यहूदिया
  rationale: यह इस भौगोलिक प्रदेश का प्रचलित हिन्दी नाम है।
- source_word: Καισάρειαν
  choice: कैसरिया
  rationale: यह स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण है।
- source_word: διέτριβεν
  choice: वहीं रहा
  rationale: अपूर्णकालिक क्रिया वहाँ कुछ समय तक लगातार रहने का भाव देती है; ‘वहीं रहा’ इसे संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ἀπαχθῆναι को केवल ‘ले जाया जाए’ कहना या निहित मृत्युदंड को स्पष्ट करना
  choice: उन्हें ले जाकर मृत्युदंड देने की आज्ञा दी
  alternative: उन्हें ले जाने की आज्ञा दी
  rationale: यूनानी पाठ हत्या के लिए सामान्य क्रिया का प्रयोग नहीं करता, इसलिए कुछ वास्तविक शाब्दिक अस्पष्टता है। फिर भी कैदी के भाग जाने पर पहरेदारों की आधिकारिक पूछताछ और हेरोदेस के आदेश का प्रसंग मृत्युदंड की ओर प्रबल संकेत करता है। मुख्य पाठ संभावित आशय स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। घटनाओं का यूनानी क्रम सुरक्षित है। ‘मृत्युदंड’ औपचारिक न्यायिक प्रसंग को स्पष्ट करता है, और पादटिप्पणी मूल अभिव्यक्ति की वास्तविक अस्पष्टता बनाए रखती है।
