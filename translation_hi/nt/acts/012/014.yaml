  verdict: revise
  source_fidelity: Draft adds the specific idea that Rhoda “forgot” to open the gate ("खोलना भूल गई"), whereas the Greek states only that, because of joy, she did not open it. This explanatory addition should be removed. The remaining sequence—recognition, joy, failure to open, running inside, and reporting Peter standing before the gate—is retained.
  naturalness: The revision is natural modern standard Hindi and preserves the lively narrative movement. “फाटक खोले बिना ही भीतर दौड़ गई” conveys the sequence without introducing an unsupported mental-state explanation.
  terminology: “पतरस,” “आवाज़,” and “फाटक” are appropriate. “फाटक के सामने” accurately retains the spatial force of πρὸ τοῦ πυλῶνος. Footnote a appropriately clarifies the possible sense of the outer entrance.
  issues:
  - severity: medium
    issue: “खोलना भूल गई” adds ‘forgot’ to the source text.
    rationale: οὐκ ἤνοιξεν means ‘did not open’; ἀπὸ τῆς χαρᾶς gives the cause. The source does not explicitly characterize her omission as forgetfulness.
  revised_text: और पतरस की आवाज़ पहचानकर वह खुशी के कारण फाटक[a] खोले बिना ही भीतर दौड़ गई और उसने बताया कि पतरस फाटक के सामने खड़ा है।[b]
