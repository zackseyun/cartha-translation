base_translation:
  language: en
  yaml_path: translation/nt/acts/012/014.yaml
  text: And when she recognized Peter’s voice[a], because of her joy she did not open the gate[b], but ran in and reported that Peter was standing at the gate.
translation:
  language: hi
  text: और पतरस की आवाज़ पहचानकर वह खुशी के कारण फाटक[a] खोले बिना ही भीतर दौड़ गई और उसने बताया कि पतरस फाटक के सामने खड़ा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “फाटक” का अर्थ सड़क से घर के परिसर में जाने वाला बाहरी प्रवेश-द्वार भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसने पतरस को फाटक के सामने खड़ा बताया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου
  choice: पतरस की आवाज़ पहचानकर
  rationale: यह वाक्यांश सुनकर हुई तत्काल पहचान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν
  choice: खुशी के मारे ... खोलना भूल गई
  rationale: यूनानी में आनन्द उसके न खोलने का कारण है। हिन्दी का यह स्वाभाविक मुहावरा प्रसंग में अनजाने में हुई चूक व्यक्त करता है, न कि जानबूझकर इनकार।
- source_word: πυλῶνα / πυλῶνος
  choice: फाटक
  rationale: πυλών सड़क से संपत्ति में प्रवेश के बाहरी फाटक या प्रवेश-द्वार को सूचित करता है; घरेलू परिसर के संदर्भ में 'फाटक' स्पष्ट और सहज है।
- source_word: εἰσδραμοῦσα
  choice: भीतर दौड़ी
  rationale: यह भीतर की ओर तेज़ गति और कथा की जीवंतता बनाए रखता है।
- source_word: ἀπήγγειλεν
  choice: बताया
  rationale: ἀπαγγέλλω यहाँ समाचार देने के अर्थ में है; 'बताया' सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἑστάναι
  choice: खड़ा है
  rationale: पूर्णकालिक infinitive की स्थिर/जारी अवस्था को प्रत्यक्ष कथन-सदृश हिन्दी में व्यक्त करता है।
- source_word: πρὸ τοῦ πυλῶνος
  choice: फाटक के सामने
  rationale: πρό + संबंधकारक का स्थानवाचक अर्थ 'सामने' है; यह 'के पास' की अपेक्षा स्रोत की छवि को अधिक स्पष्ट रखता है।
