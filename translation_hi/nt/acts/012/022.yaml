lexical_decisions:
- source_word: δῆμος
  choice: भीड़
  rationale: यहाँ शब्द सभा में उपस्थित जनसमूह को दर्शाता है; आधुनिक हिन्दी में ‘भीड़’ दृश्य के अनुकूल और सहज है।
- source_word: ἐπεφώνει
  choice: लगातार पुकारती रही
  rationale: अपूर्ण भूतकाल चलती या बार-बार होती पुकार को व्यक्त करता है; यह पदबंध उस अपूर्णतापरक बल को बनाए रखता है।
- source_word: Θεοῦ
  choice: किसी देवता की
  rationale: अनिश्चित, मूर्तिपूजक संदर्भ में यह किसी देवता की ओर संकेत करता है, न कि आवश्यक रूप से इस्राएल के परमेश्वर की ओर; ‘किसी’ हिन्दी में इस अनिश्चितता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: φωνὴ
  choice: आवाज़
  rationale: यह मूल संज्ञा का सीधा और सामान्य आधुनिक हिन्दी रूप है तथा मनुष्य की आवाज़ के साथ विरोध को बनाए रखता है।
- source_word: ἀνθρώπου
  choice: मनुष्य की
  rationale: यह देवता और मनुष्य के बीच मूल सीधे विरोध को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: Θεοῦ का अर्थ ‘परमेश्वर की’ लिया जाए या ‘किसी देवता की’
  choice: किसी देवता की
  alternative: परमेश्वर की
  rationale: हेरोदेस की प्रशंसा करती गैर-यहूदी भीड़ और यूनानी में लेख के अभाव को देखते हुए अनिश्चित अर्थ अधिक संभावित है। फिर भी यूनानी व्याकरण दूसरे पाठ को पूर्णतः असंभव नहीं बनाता, इसलिए उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक उद्घोषणा के अनुरूप रखी गई है। ‘लगातार पुकारती रही’ चलती हुई सामूहिक जयध्वनि को व्यक्त करता है; ‘यह’ हिन्दी में यूनानी के क्रियारहित उद्गार को स्वाभाविक बनाता है।
