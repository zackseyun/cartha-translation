base_translation:
  language: en
  yaml_path: translation/nt/acts/012/011.yaml
  text: And Peter[a], coming to himself, said[c][b], “Now I truly know that the Lord sent his angel and rescued me from Herod’s hand and from all the expectation of the people of the Jews.”
translation:
  language: hi
  text: तब पतरस अपने होश में आकर[a] बोला, “अब मैं सचमुच जान गया हूँ कि प्रभु ने अपने स्वर्गदूत को भेजा और मुझे हेरोदेस के हाथ से[b] तथा यहूदी लोगों की हर अपेक्षा से छुड़ा लिया[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “अपने आप में आया”; अर्थात उसकी पूरी चेतना लौट आई।
    reason: lexical_alternative
  - marker: b
    text: “हेरोदेस के हाथ से” का अर्थ है हेरोदेस की शक्ति या नियंत्रण से।
    reason: cultural_note
  - marker: c
    text: अर्थात यहूदी लोग पतरस के साथ जो कुछ होने की अपेक्षा कर रहे थे, उससे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑαυτῷ γενόμενος
  choice: अपने होश में आया
  rationale: यह यूनानी मुहावरे के आशय—असाधारण अनुभव के बाद पूरी चेतना लौटने—को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और ‘अपने आप में आया’ जैसी असहज शब्दशः अभिव्यक्ति से बचता है।
- source_word: ἀληθῶς
  choice: सचमुच
  rationale: यह पतरस के दृढ़ बोध और निश्चय को सहज, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἐξαπέστειλεν
  choice: भेजा
  rationale: इस प्रसंग में सामान्य क्रिया ‘भेजा’ यूनानी संयुक्त क्रिया का अर्थ पर्याप्त रूप से देती है; ‘भेज दिया’ अनावश्यक पूर्णता-भाव जोड़ सकता है।
- source_word: κύριος
  choice: प्रभु
  rationale: यूनानी पद को बिना उसके संदर्भ को अधिक स्पष्ट किए पारंपरिक, स्वाभाविक और धर्मवैचारिक रूप से खुली हिन्दी में रखता है।
- source_word: ἄγγελον
  choice: स्वर्गदूत
  rationale: कथा के संदर्भ में एक स्वर्गीय प्राणी अभिप्रेत है; इसलिए सामान्य ‘दूत’ की अपेक्षा ‘स्वर्गदूत’ स्पष्ट है।
- source_word: ἐξείλατό με
  choice: मुझे ... छुड़ा लिया
  rationale: यह संकट और अधिकार से सक्रिय उद्धार का अर्थ आधुनिक हिन्दी में स्वाभाविक रूप से प्रकट करता है।
- source_word: ἐκ χειρὸς Ἡρῴδου
  choice: हेरोदेस के हाथ से
  rationale: यह मूल बिंब को बनाए रखता है; हिन्दी में भी ‘हाथ से’ अधिकार या नियंत्रण का बोध करा सकता है।
- source_word: πάσης τῆς προσδοκίας
  choice: सारी उम्मीद से
  rationale: सामूहिक एकवचन ‘उम्मीद’ मूल की संरचना और असामान्य तनाव को कुछ हद तक बनाए रखती है; टिप्पणी स्पष्ट करती है कि आशय यहूदी लोगों की अपेक्षित घटना से है।
- source_word: τοῦ λαοῦ τῶν Ἰουδαίων
  choice: यहूदी लोगों की
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और संबंधित जनसमुदाय को स्पष्ट रूप से व्यक्त करता है, बिना अंग्रेज़ी की असहज जननात्मक संरचना की नकल किए।
theological_decisions:
- issue: κύριος का संदर्भ
  choice: प्रभु
  alternative: परमेश्वर; जी उठा यीशु
  rationale: यूनानी पाठ यहाँ केवल κύριος कहता है और संदर्भ को अधिक विशिष्ट नहीं बनाता। ‘प्रभु’ इस अस्पष्टता और धर्मवैचारिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपने होश में आया’ और ‘छुड़ा लिया’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि ‘हेरोदेस के हाथ से’ मूल बिंब को सुरक्षित रखता है। ‘यहूदी लोगों की सारी उम्मीद से’ की कुछ असामान्यता जानबूझकर रखी गई है ताकि मूल पाठ के संबंध और तनाव को पूरी तरह व्याख्यायित करके समाप्त न किया जाए; पाद-टिप्पणी उसका संभावित आशय स्पष्ट करती है।
