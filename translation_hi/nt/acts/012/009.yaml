  text: καὶ ἐξελθὼν ⸀ἠκολούθει, καὶ οὐκ ᾔδει ὅτι ἀληθές ἐστιν τὸ γινόμενον διὰ τοῦ ἀγγέλου, ἐδόκει δὲ ὅραμα βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/009.yaml
  text: And he went out and followed[a], and he did not know that what was happening through the angel was real, but thought he was seeing a vision.
translation:
  language: hi
  text: तब वह बाहर निकला और स्वर्गदूत के पीछे चलता गया। वह नहीं जानता था कि स्वर्गदूत के द्वारा जो हो रहा था, वह वास्तव में हो रहा था; बल्कि उसे लगता था कि वह कोई दर्शन देख रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: बाहर निकलकर
  rationale: पूर्वकालिक कृदंत मुख्य क्रिया से पहले हुई गति बताता है; हिन्दी में संयुक्त क्रिया-रचना स्वाभाविक और क्रम-स्पष्ट है।
- source_word: ἠκολούθει
  choice: उसके पीछे चलने लगा
  rationale: अपूर्ण भूतकाल जारी क्रिया को दर्शाता है। संदर्भ से सर्वनाम का संकेत स्वर्गदूत की ओर है, और यह हिन्दी में केवल ‘पीछा किया’ की संभावित विरोधी छाया से बचता है।
- source_word: οὐκ ᾔδει
  choice: वह नहीं जानता था
  rationale: ज्ञान अथवा तत्काल बोध के अभाव का सीधा और सहज अनुवाद।
- source_word: ἀληθές
  choice: सचमुच हो रहा है
  rationale: दर्शन के विपरीत घटना की वास्तविकता अभिप्रेत है; हिन्दी में यह अभिव्यक्ति ‘सत्य’ की अमूर्त ध्वनि के बजाय वास्तविक घटित होने को स्पष्ट करती है।
- source_word: τὸ γινόμενον
  choice: जो हो रहा है
  rationale: संज्ञीकृत वर्तमान कृदंत जारी घटना को व्यक्त करता है।
- source_word: διὰ τοῦ ἀγγέλου
  choice: स्वर्गदूत के द्वारा
  rationale: सम्बन्धकारक के साथ διά माध्यम या कर्तृ-अभिकरण व्यक्त कर सकता है; ‘के द्वारा’ इस दायरे को बिना अनावश्यक विस्तार के बनाए रखता है।
- source_word: ἐδόκει
  choice: उसे लगा
  rationale: पतरस की तत्काल धारणा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὅραμα
  choice: कोई दर्शन
  rationale: अलौकिक अथवा प्रकाशनात्मक दृश्य के लिए प्रचलित बाइबलीय हिन्दी शब्द; ‘कोई’ उसकी अनिश्चित अनुभूति को स्वाभाविक बनाता है।
- source_word: βλέπειν
  choice: देख रहा है
  rationale: ἐδόκει के साथ यह उस अनुभव को बताता है जो उसे उस समय होता प्रतीत हुआ; जारी अनुभूति का भाव सुरक्षित है।
theological_decisions:
- issue: स्वर्गदूत की क्रिया का स्वरूप
  choice: स्वर्गदूत के द्वारा
  alternative: स्वर्गदूत से
  rationale: यह διά के माध्यम/अभिकरण वाले अर्थ को सुरक्षित रखता है और स्वर्गदूत की स्वतंत्र शक्ति के विषय में पाठ से आगे कोई दावा नहीं करता।
- issue: घटना और दर्शन के बीच विरोध
  choice: वह सचमुच हो रहा है; बल्कि उसे लगा कि वह कोई दर्शन देख रहा है
  alternative: वह सत्य है; पर वह समझता था कि दर्शन देख रहा है
  rationale: यहाँ ἀληθές का आशय घटना की वास्तविकता है, न केवल कथन की सत्यता; अनुवाद उसी अनुभवगत विरोध को स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘उसके पीछे चलने लगा’ अपूर्ण क्रिया का भाव देता है और ‘पीछा करना’ की नकारात्मक छाया से बचता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘स्वर्गदूत के द्वारा’ यूनानी की वास्तविक अर्थ-सीमा को पर्याप्त रूप से बनाए रखता है।
