  text: ὁ μὲν οὖν Πέτρος ἐτηρεῖτο ἐν τῇ φυλακῇ· προσευχὴ δὲ ἦν ⸀ἐκτενῶς γινομένη ὑπὸ τῆς ἐκκλησίας πρὸς τὸν θεὸν ⸀περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/005.yaml
  text: So Peter was being kept in the prison[a], but earnest prayer was being made to God by the church for him.
translation:
  language: hi
  text: इसलिए पतरस को जेल में रखा जा रहा था, पर कलीसिया उसके लिए परमेश्वर से लगन से प्रार्थना कर रही थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτηρεῖτο
  choice: पहरे में रखा जा रहा था
  rationale: अपूर्णकालीन कर्मवाच्य चल रही निगरानी और बंदी अवस्था को दर्शाता है; प्रसंग में केवल ‘रखा जा रहा था’ की अपेक्षा यह स्वाभाविक और स्पष्ट है।
- source_word: φυλακῇ
  choice: जेल में
  rationale: यह बंदी रखने के स्थान को सूचित करता है; आधुनिक सामान्य हिंदी में ‘जेल’ सहज और स्पष्ट है।
- source_word: προσευχὴ ... ἦν ... γινομένη
  choice: प्रार्थना कर रही थी
  rationale: यूनानी परिप्रयुक्त रचना जारी क्रिया दर्शाती है। हिंदी में कर्ता ‘कलीसिया’ के साथ सक्रिय अभिव्यक्ति अधिक स्वाभाविक है और निरंतरता बनाए रखती है।
- source_word: ἐκτενῶς
  choice: लगातार और मन लगाकर
  rationale: शब्द प्रार्थना की तीव्रता अथवा दृढ़ निरंतरता, दोनों पर बल दे सकता है। संयुक्त अभिव्यक्ति इस अर्थ-परास को अनावश्यक रूप से किसी एक पक्ष तक सीमित नहीं करती।
- source_word: ὑπὸ τῆς ἐκκλησίας
  choice: कलीसिया
  rationale: यहाँ शब्द पतरस के लिए प्रार्थना कर रहे मसीही समुदाय को दर्शाता है। ‘कलीसिया’ हिंदी बाइबलीय प्रयोग में स्थापित है और किसी खास संस्थागत संरचना को आवश्यक रूप से नहीं बताता।
- source_word: πρὸς τὸν θεὸν
  choice: परमेश्वर से
  rationale: प्रार्थना की दिशा या संबोधन को आधुनिक हिंदी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: περὶ αὐτοῦ
  choice: उसके लिए
  rationale: प्रसंग में यह पतरस की ओर से की जा रही मध्यस्थ प्रार्थना को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: μὲν οὖν ... δὲ
  choice: इसलिए ... पर
  rationale: यह कथा की प्रगति और पतरस की कैद तथा कलीसिया की प्रार्थना के बीच हल्का विरोध स्पष्ट करता है।
theological_decisions:
- issue: ἐκκλησία का अनुवाद
  choice: कलीसिया
  alternative: सभा / मण्डली
  rationale: यहाँ अभिप्राय प्रार्थना करने वाले मसीही समुदाय से है। ‘कलीसिया’ प्रचलित और प्रसंगानुकूल है, जबकि इससे किसी विशेष सम्प्रदाय की शासन-व्यवस्था निर्धारित नहीं होती।
- issue: ἐκτενῶς में तीव्रता और निरंतरता
  choice: लगातार और मन लगाकर
  alternative: उत्कटता से / बड़े आग्रह से
  rationale: यूनानी क्रिया-विशेषण तीव्रता अथवा अटल निरंतरता पर बल दे सकता है। अनुवाद दोनों संभावित आयामों को खुला रखता है और प्रार्थना की प्रकृति पर अतिरिक्त धर्मशास्त्रीय निष्कर्ष नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण कथात्मक शैली। ‘जेल’ सामान्य पाठक के लिए स्वाभाविक है, और ‘कलीसिया’ स्थापित बाइबलीय शब्दावली बनाए रखता है।
