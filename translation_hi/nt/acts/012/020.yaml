- from: वह सूर और सैदा के लोगों से बहुत क्रोधित था।[a] पर वे एकमत होकर उसके पास आए और राजा के शयनकक्ष के अधिकारी बलास्तुस को अपने पक्ष में कर लेने के बाद शांति की विनती करने लगे, क्योंकि उनके प्रदेश को राजा के राज्य-क्षेत्र से खाद्य-सामग्री मिलती थी।[b]
  to: वह सूर और सैदा के लोगों के प्रति बहुत शत्रुतापूर्ण था।[a] पर वे एकमत होकर उसके पास आए और राजा के शयनकक्ष के अधिकारी ब्लास्तुस को मना लेने के बाद शांति की याचना कर रहे थे, क्योंकि उनके प्रदेश को राजा के राज्य-क्षेत्र से खाद्य-सामग्री मिलती थी।[b]
