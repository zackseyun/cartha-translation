translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। दरबारी पद के लिए दुर्बोध ‘चेम्बरलेन’ के बजाय मूल के शयनकक्ष-संबंधी बिंब को सुरक्षित रखने वाला वर्णनात्मक पद चुना गया है।
