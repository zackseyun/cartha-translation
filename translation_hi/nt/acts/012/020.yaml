language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἦν ⸀δὲ θυμομαχῶν Τυρίοις καὶ Σιδωνίοις· ὁμοθυμαδὸν δὲ παρῆσαν πρὸς αὐτόν, καὶ πείσαντες Βλάστον τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως ᾐτοῦντο εἰρήνην διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν ἀπὸ τῆς βασιλικῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/012/020.yaml
  text: He was very angry with the Tyrians and Sidonians[a]. But they came to him with one accord, and after persuading Blastus, the king’s chamberlain, they were asking for peace[d][c][b], because their country was fed from the king’s domain.
translation:
  language: hi
  text: वह सूर और सैदा के लोगों के प्रति बहुत शत्रुतापूर्ण था।[a] पर वे एकमत होकर उसके पास आए और राजा के शयनकक्ष के अधिकारी ब्लास्तुस को मना लेने के बाद शांति की याचना कर रहे थे, क्योंकि उनके प्रदेश को राजा के राज्य-क्षेत्र से खाद्य-सामग्री मिलती थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह सूर और सैदा के लोगों से बहुत क्रोधित था।” यूनानी शब्द तीव्र क्रोध या वैरपूर्ण शत्रुता व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात उनके प्रदेश की खाद्य-आपूर्ति राजा के अधीन भूभाग से होती थी।
    reason: cultural_note
lexical_decisions:
- source_word: θυμομαχῶν
  choice: बहुत क्रोधित था
  rationale: यह शब्द तीव्र क्रोध अथवा वैरपूर्ण विरोध व्यक्त करता है। ‘बहुत क्रोधित था’ आधुनिक हिन्दी में स्वाभाविक है और भाव की तीव्रता बनाए रखता है।
- source_word: Τυρίοις καὶ Σιδωνίοις
  choice: सूर और सैदा के लोगों से
  rationale: यूनानी जातिवाचक रूप दोनों नगरों के निवासियों को सूचित करते हैं; हिन्दी में नगरों के नाम के साथ ‘के लोगों’ कहना अधिक स्वाभाविक और स्पष्ट है।
- source_word: ὁμοθυμαδόν
  choice: एकमत होकर
  rationale: यह केवल साथ आने का नहीं, बल्कि साझा उद्देश्य और सहमति का भाव देता है।
- source_word: παρῆσαν πρὸς αὐτόν
  choice: उसके पास आए
  rationale: यह उसके सामने उपस्थित होने या उसके पास आने का सरल और प्रसंगानुकूल अनुवाद है।
- source_word: πείσαντες
  choice: अपने पक्ष में कर लेने के बाद
  rationale: संदर्भ में उन्होंने बलास्तुस को सहमत करके उसका सहयोग प्राप्त किया। यह अनुवाद पूर्वकालिक कृदंत का क्रम भी स्पष्ट करता है।
- source_word: Βλάστον
  choice: बलास्तुस
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के निकट रखा गया है।
- source_word: τὸν ἐπὶ τοῦ κοιτῶνος τοῦ βασιλέως
  choice: राजा के शयनकक्ष का अधिकारी
  rationale: मूल अभिव्यक्ति का शाब्दिक बिंब और दरबारी पद—दोनों सुरक्षित रहते हैं; केवल ‘खोजा’ कहना मूल से अधिक विशिष्ट होता।
- source_word: ᾐτοῦντο εἰρήνην
  choice: शांति की विनती करने लगे
  rationale: अपूर्ण भूतकाल जारी अथवा बार-बार किए जा रहे निवेदन का संकेत देता है; राजनयिक संदर्भ में ‘शांति की विनती’ स्वाभाविक है।
- source_word: διὰ τὸ τρέφεσθαι αὐτῶν τὴν χώραν
  choice: क्योंकि उनके प्रदेश को ... खाद्य-सामग्री मिलती थी
  rationale: कारणवाचक रचना तथा भोजन-आपूर्ति पर क्षेत्र की निर्भरता को स्पष्ट और सहज हिन्दी में व्यक्त किया गया है।
- source_word: ἀπὸ τῆς βασιλικῆς
  choice: राजा के राज्य-क्षेत्र से
  rationale: स्त्रीलिंग विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और आशय राजा के अधीन भूभाग से है; ‘राज्य-क्षेत्र’ इस निहित संज्ञा को स्पष्ट करता है।
