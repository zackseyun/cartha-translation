lexical_decisions:
- source_word: κρούσαντος δὲ αὐτοῦ
  choice: जब उसने ... दस्तक दी
  rationale: सम्बन्धवाचक एओरिस्ट कृदन्त और δέ कथा में अगली घटना को समयगत रूप से जोड़ते हैं; ‘जब उसने’ स्वाभाविक हिन्दी में इस अर्थ को बनाए रखता है।
- source_word: θύραν τοῦ πυλῶνος
  choice: फाटक के द्वार
  rationale: θύρα ‘द्वार’ और πυλών बाहरी प्रवेश-स्थान या फाटक को सूचित करता है; यह रूप दोनों संज्ञाओं को बनाए रखता है।
- source_word: προσῆλθε
  choice: आई
  rationale: घरेलू प्रसंग में προσέρχομαι का ‘पास आई’ अर्थ उद्देश्यसूचक पद के साथ हिन्दी में सहज रूप से ‘आई’ व्यक्त होता है।
- source_word: παιδίσκη
  choice: दासी
  rationale: शब्द किसी युवा स्त्री घरेलू सेविका अथवा दासी को सूचित कर सकता है। ‘दासी’ संक्षिप्त और प्रसंगानुकूल है, जबकि कानूनी दासता की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ὑπακοῦσαι
  choice: उत्तर देने
  rationale: द्वार पर दस्तक के प्रसंग में ὑπακούω का अर्थ दस्तक का प्रत्युत्तर देना है, न कि सामान्यतः आज्ञा मानना।
- source_word: ὀνόματι Ῥόδη
  choice: रुदे नाम की
  rationale: ὀνόματι व्यक्ति का नाम प्रस्तुत करता है। यूनानी Ῥόδη के लिए प्रचलित हिन्दी बाइबलीय नामरूप ‘रुदे’ रखा गया है।
