revisions:
- from: जब उसने फाटक के द्वार पर दस्तक दी, तो रुदे नाम की एक दासी[a] उत्तर देने आई।
  to: जब उसने फाटक के दरवाज़े पर दस्तक दी, तो रूदा नाम की एक सेविका[a] दस्तक का जवाब देने आई।
  rationale: The revision uses idiomatic modern Hindi for the gateway door, corrects the personal-name form, and renders παιδίσκη with a term broad enough to cover household service without unnecessarily deciding its legal status. The note explicitly preserves the possible slave-status sense. “दस्तक का जवाब देने” conveys the contextually appropriate purposive meaning of ὑπακοῦσαι.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:54:26Z'
review_pass:
  verdict: revise
  source_fidelity: The temporal participle, the gateway-door setting, Rhoda's approach, and the purposive sense of ὑπακοῦσαι are substantially represented. However, the name form should be corrected to the established Hindi biblical form “रूदा,” and the rendering of παιδίσκη should not make “दासी” appear to have been selected primarily for household role, since that term more specifically suggests enslaved status.
  naturalness: “फाटक के द्वार” is understandable but unnecessarily repetitive in modern Hindi. “फाटक के दरवाज़े पर” is more idiomatic while retaining both θύρα (door) and πυλών (gateway/gatehouse). “दस्तक का जवाब देने” makes the contextual sense of ὑπακοῦσαι clear and natural.
  terminology: Use “सेविका” in the text for the appropriately broad household-role sense, with “दासी” retained as a lexical alternative in the footnote. Use “रूदा,” the conventional Hindi biblical rendering of Ῥόδη.
  issues:
  - severity: medium
    issue: The name is rendered “रुदे.”
    rationale: Ῥόδη is conventionally represented in Hindi biblical usage as “रूदा.” The draft’s asserted convention “रुदे” is not the established form and also does not reflect the usual Hindi biblical name tradition.
  - severity: low
    issue: “फाटक के द्वार” is stylistically redundant.
    rationale: Although it attempts to preserve both Greek nouns, “फाटक के दरवाज़े” is standard modern Hindi and still represents a door belonging to the gateway.
  - severity: medium
    issue: The main rendering “दासी” conflicts with the footnote rationale that household role rather than legal status is being emphasized.
    rationale: “दासी” normally foregrounds slave status in Hindi. “सेविका” better preserves the lexical breadth of παιδίσκη; “दासी” can remain a transparent alternative in a note.
