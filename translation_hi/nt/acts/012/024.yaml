  text: But the word of God continued to grow and multiply[a].
translation:
  language: hi
  text: परन्तु परमेश्वर का वचन बढ़ता और फैलता गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγος
  choice: वचन
  rationale: लूका की प्रचलित अभिव्यक्ति ‘परमेश्वर का वचन’ और उसके द्वारा सूचित प्रचारित सन्देश—दोनों को बनाए रखता है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर का
  rationale: सम्बन्धकारक पद को स्वाभाविक हिन्दी में अधिकार अथवा स्रोत के रूप में व्यक्त करता है।
- source_word: ηὔξανεν
  choice: बढ़ता गया
  rationale: अपूर्ण भूतकाल की निरन्तर प्रगति को स्वाभाविक हिन्दी संयुक्त क्रिया से व्यक्त करता है।
- source_word: ἐπληθύνετο
  choice: फैलता गया
  rationale: वचन के बढ़ते प्रसार को दर्शाता है और पहले क्रियापद के साथ केवल एक ही अर्थ की पुनरावृत्ति से बचाता है।
- source_word: δὲ
  choice: परन्तु
  rationale: हेरोदेस की मृत्यु के पिछले वृत्तान्त के विपरीत परमेश्वर के वचन की प्रगति का कथात्मक विरोध स्पष्ट करता है।
theological_decisions:
- issue: λόγος τοῦ θεοῦ को अधिक अर्थपरक ढंग से ‘परमेश्वर का सन्देश’ कहना या पारम्परिक पद ‘परमेश्वर का वचन’ बनाए रखना
  choice: परमेश्वर का वचन
  alternative: परमेश्वर का सन्देश
  rationale: ‘वचन’ लूका की बार-बार आने वाली अभिव्यक्ति और उसकी व्यापक शास्त्रीय तथा घोषणात्मक प्रतिध्वनि को बनाए रखता है; सन्दर्भ में इसका आशय प्रचारित सन्देश भी है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। ‘बढ़ता और फैलता गया’ यूनानी की दो समानान्तर अपूर्णकालीन क्रियाओं की निरन्तरता और प्रसार को स्वाभाविक रूप से व्यक्त करता है।
