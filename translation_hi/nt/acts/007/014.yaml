id: ACT.7.14
reference: Acts 7:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀποστείλας δὲ Ἰωσὴφ μετεκαλέσατο ⸂Ἰακὼβ τὸν πατέρα αὐτοῦ⸃ καὶ πᾶσαν τὴν συγγένειαν ἐν ψυχαῖς ἑβδομήκοντα πέντε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/014.yaml
  text: Then Joseph sent and summoned Jacob his father and all his relatives[a], seventy-five persons in all.
translation:
  language: hi
  text: तब यूसुफ ने संदेश भेजकर अपने पिता याकूब और अपने सभी रिश्तेदारों को बुलवा लिया—कुल पचहत्तर व्यक्ति।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पुराने नियम के कुछ अंशों में कुल संख्या ‘सत्तर’ दी गई है (जैसे, उत्पत्ति 46:27 और निर्गमन 1:5 के इब्रानी पाठ में); यहाँ प्रेरितों के काम में ‘पचहत्तर’ है।
    reason: cross_reference
lexical_decisions:
- source_word: ἀποστείλας
  choice: संदेश भेजकर
  rationale: यह पूर्वकालिक कृदंत मुख्य क्रिया से पहले किए गए भेजने के कार्य को बताता है। यूनानी में भेजी गई वस्तु या व्यक्ति स्पष्ट नहीं है; हिन्दी में ‘संदेश भेजकर’ बुलाने की प्रक्रिया को स्वाभाविक रूप से व्यक्त करता है, बिना किसी विशिष्ट दूत का उल्लेख जोड़े।
- source_word: δὲ
  choice: तब
  rationale: यह कथा की अगली घटना की ओर बढ़ने वाला संयोजक है; ‘तब’ आधुनिक हिन्दी में इस क्रम को सहजता से दिखाता है।
- source_word: μετεκαλέσατο
  choice: बुलवा लिया
  rationale: मध्यवाच्य क्रिया का अर्थ किसी को अपने पास आने के लिए बुलाना या बुला भेजना है। ‘बुलवा लिया’ इस प्रयोजन और मध्यवाच्य भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἰακὼβ τὸν πατέρα αὐτοῦ
  choice: अपने पिता याकूब
  rationale: सम्बन्धसूचक पदबंध को हिन्दी के स्वाभाविक क्रम में रखा गया है; ‘अपने’ का सम्बन्ध कर्ता यूसुफ से स्पष्ट है।
- source_word: πᾶσαν τὴν συγγένειαν
  choice: अपने सभी रिश्तेदारों
  rationale: συγγένεια व्यापक नातेदारी या रिश्तेदारों के समूह को दर्शाता है। ‘रिश्तेदार’ आधुनिक और स्पष्ट है तथा इसे केवल एक घराने तक सीमित नहीं करता।
- source_word: ἐν ψυχαῖς
  choice: कुल … व्यक्ति
  rationale: शाब्दिक अर्थ ‘प्राणों में’ है, पर यहाँ यह व्यक्तियों की गिनती का सामी मुहावरा है। ‘कुल … व्यक्ति’ वही गणनात्मक अर्थ स्वाभाविक हिन्दी में देता है।
- source_word: ἑβδομήκοντα πέντε
  choice: पचहत्तर
  rationale: यूनानी अंक का सीधा अनुवाद।
theological_decisions:
- issue: उत्पत्ति और निर्गमन की कुछ पाठ-परम्पराओं की तुलना में याकूब के परिवार की संख्या
  choice: पचहत्तर व्यक्ति
  alternative: सत्तर व्यक्ति
  rationale: प्रेरितों के काम के यूनानी पाठ में स्पष्ट रूप से ‘पचहत्तर’ है। इब्रानी पाठ-रूप में उत्पत्ति 46:27 और निर्गमन 1:5 में मिलने वाली ‘सत्तर’ संख्या के साथ तनाव को मुख्य पाठ में सामंजस्य बैठाकर नहीं मिटाया गया; उसे पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘संदेश भेजकर … बुलवा लिया’ को दो यूनानी क्रियाओं का स्वाभाविक हिन्दी रूप माना गया है। संख्या-सम्बन्धी पाठगत तनाव को बिना सामंजस्य किए सुरक्षित रखा गया है।
