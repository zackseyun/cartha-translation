revisions:
- from: जब चालीस वर्ष पूरे हो गए[a], तब सीनै पर्वत के निर्जन प्रदेश में एक स्वर्गदूत उसे झाड़ी की आग की ज्वाला में दिखाई दिया[b][c]।
  to: जब चालीस वर्ष पूरे हो गए[a], तब सीनै पर्वत के निर्जन क्षेत्र में एक स्वर्गदूत उसे झाड़ी से निकलती आग की ज्वाला में दिखाई दिया[b][c]।
  rationale: The revision retains every element of the Greek and preserves the deliberately non-specific identification of ἄγγελος. It only resolves an opaque Hindi construction by expressing the bush–flame relationship idiomatically. The footnote is adjusted correspondingly and continues to distinguish Acts’ “an angel” from the wording of Exodus 3:2.
  reviewer_model: gpt-5.6-terra
