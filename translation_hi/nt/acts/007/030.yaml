id: ACT.7.30
reference: Acts 7:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ πληρωθέντων ἐτῶν τεσσεράκοντα ὤφθη αὐτῷ ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ ⸀ἄγγελος ἐν φλογὶ πυρὸς βάτου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/030.yaml
  text: And after forty years had passed[a], an angel appeared to him in the wilderness of Mount Sinai[c][b], in a flame of fire from a bush.
translation:
  language: hi
  text: जब चालीस वर्ष पूरे हो गए[a], तब सीनै पर्वत के निर्जन क्षेत्र में एक स्वर्गदूत उसे झाड़ी से निकलती आग की ज्वाला में दिखाई दिया[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब चालीस वर्ष पूरे हुए।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “झाड़ी की आग की ज्वाला में”; अर्थात, झाड़ी से संबद्ध आग की ज्वाला में। यह निर्गमन 3:2 की जलती हुई झाड़ी की घटना की ओर संकेत करता है।
    reason: cross_reference
  - marker: c
    text: निर्गमन 3:2 में “यहोवा का दूत” कहा गया है, पर यहाँ यूनानी पाठ केवल “एक स्वर्गदूत” कहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πληρωθέντων ἐτῶν τεσσεράκοντα
  choice: जब चालीस वर्ष पूरे हो गए
  rationale: यह संबंधवाचक स्वतंत्र पदबंध समय की परिस्थिति बताता है। ‘पूरे हो गए’ πληρόω की पूर्णता की धारणा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὤφθη αὐτῷ
  choice: उसे ... दिखाई दिया
  rationale: ὤφθη यहाँ प्रकट होने के अर्थ में प्रयुक्त कर्मवाच्य रूप है; ‘दिखाई दिया’ हिन्दी में उस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν τῇ ἐρήμῳ τοῦ ὄρους Σινᾶ
  choice: सीनै पर्वत के निर्जन प्रदेश में
  rationale: ἔρημος का अर्थ निर्जन या वीरान क्षेत्र है। ‘निर्जन प्रदेश’ बाइबलीय भूगोल के अनुरूप है और केवल रेतीले मरुस्थल का अनावश्यक संकेत नहीं देता।
- source_word: ἄγγελος
  choice: एक स्वर्गदूत
  rationale: इस अलौकिक प्रकट होने के प्रसंग में यह मनुष्य संदेशवाहक नहीं, स्वर्गीय दूत को दर्शाता है। मूल पाठ में निश्चित उपपद न होने के कारण ‘एक’ रखा गया है।
- source_word: ἐν φλογὶ πυρὸς βάτου
  choice: झाड़ी की आग की ज्वाला में
  rationale: यह अनुवाद यूनानी के संक्षिप्त संबंधवाचक विन्यास और आग-ज्वाला की दोहरी छवि को बनाए रखता है, जबकि निर्गमन 3:2 की जलती झाड़ी की पृष्ठभूमि भी स्पष्ट रहती है।
theological_decisions:
- issue: ईश्वर-प्रकाशन के प्रसंग में प्रकट होने वाले ἄγγελος की पहचान
  choice: मुख्य पाठ में ‘एक स्वर्गदूत’
  alternative: ‘यहोवा का दूत’ या ‘प्रभु का दूत’
  rationale: प्रेरितों 7:30 के यूनानी पाठ में केवल ἄγγελος है; ‘प्रभु का’ नहीं है। इसलिए निर्गमन 3:2 से अधिक विशिष्ट पहचान मुख्य पाठ में आरोपित नहीं की गई और संबंध को टिप्पणी में रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘निर्जन प्रदेश’ को ‘जंगल’ या ‘रेगिस्तान’ पर इसलिए चुना गया कि भौगोलिक अर्थ अनावश्यक रूप से सीमित न हो। सभी टिप्पणियों के चिह्न मुख्य पाठ में उपस्थित हैं।
