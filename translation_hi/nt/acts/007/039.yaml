translation:
  language: hi
  text: हमारे पूर्वज उसके आज्ञाकारी बनना नहीं चाहते थे, बल्कि उन्होंने उसे ठुकरा दिया[a] और अपने मन में मिस्र की ओर लौट गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का अधिक शाब्दिक अर्थ ‘उसे परे धकेल दिया’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वे मरुभूमि में रहते हुए भी भीतर से मिस्र लौटने की लालसा रखते थे।
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: उसके
  rationale: यह संबंधवाचक सर्वनाम पिछले पद के मूसा की ओर संकेत करता है और ὑπήκοοι के साथ आज्ञाकारिता का संबंध बताता है। हिंदी में ‘उसके आज्ञाकारी’ स्वाभाविक और अर्थ-स्पष्ट है।
- source_word: οὐκ ἠθέλησαν
  choice: तैयार नहीं हुए
  rationale: यह केवल इच्छा के अभाव से अधिक, आज्ञा मानने की अनिच्छा और इनकार व्यक्त करता है।
- source_word: ὑπήκοοι γενέσθαι
  choice: आज्ञाकारी बनने
  rationale: ‘बनने’ से γενέσθαι और ‘आज्ञाकारी’ से ὑπήκοοι—दोनों का रूप और बल सुरक्षित रहता है।
- source_word: οἱ πατέρες ἡμῶν
  choice: हमारे पूर्वज
  rationale: संदर्भ में इस्राएल की पिछली पीढ़ी अभिप्रेत है। आधुनिक हिंदी में ‘पूर्वज’ स्वाभाविक है और वंशगत अर्थ स्पष्ट करता है।
- source_word: ἀπώσαντο
  choice: उसे ठुकरा दिया
  rationale: क्रिया में किसी को परे धकेलने और अस्वीकार करने दोनों का भाव है। ‘ठुकरा दिया’ संबंधपरक अस्वीकार को सहज हिंदी में व्यक्त करता है।
- source_word: ἐστράφησαν
  choice: लौट गए
  rationale: मिस्र की ओर पिछले रुझान में फिर जाने का भाव है; संदर्भगत दिशा को ‘लौट गए’ स्पष्ट करता है।
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: अपने मन में
  rationale: καρδία यहाँ इच्छा, अभिलाषा और आंतरिक रुझान का केंद्र है। आधुनिक हिंदी में ‘मन में’ इस अर्थ को स्वाभाविक रूप से पहुँचाता है।
- source_word: εἰς Αἴγυπτον
  choice: मिस्र की ओर
  rationale: εἰς दिशा बताता है। ‘की ओर’ आंतरिक अभिमुखता को व्यक्त करता है, बिना वास्तविक शारीरिक वापसी का दावा किए।
theological_decisions:
- issue: इस्राएलियों का मिस्र की ओर लौटना
  choice: अपने मन में मिस्र की ओर लौट गए
  alternative: उनका मन फिर मिस्र की ओर मुड़ गया
  rationale: मूल पाठ आंतरिक अभिमुखता और वापसी की इच्छा को साथ रखता है। चुना हुआ अनुवाद यह तनाव बनाए रखता है कि वे शारीरिक रूप से जंगल में थे, फिर भी भीतर से मिस्र की ओर लौट चुके थे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पूर्वज’ सामान्य पाठक के लिए स्पष्ट है; ‘अपने मन में’ आंतरिक इच्छा और रुझान का स्वाभाविक हिंदी मुहावरा है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
