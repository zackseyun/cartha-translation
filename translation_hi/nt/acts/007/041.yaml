  text: καὶ ἐμοσχοποίησαν ἐν ταῖς ἡμέραις ἐκείναις καὶ ἀνήγαγον θυσίαν τῷ εἰδώλῳ, καὶ εὐφραίνοντο ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/041.yaml
  text: And in those days they made a calf and offered a sacrifice to the idol[b][a], and they were rejoicing in the works of their hands.
translation:
  language: hi
  text: उन दिनों उन्होंने एक बछड़ा बनाया[a] और उस मूर्ति को बलि चढ़ाई; और वे अपने हाथों के कामों में आनन्द मना रहे थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक बछड़ा गढ़ा।”
    reason: lexical_alternative
  - marker: b
    text: या, “और जो उनके हाथों ने बनाया था, उसमें वे आनन्द मना रहे थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοσχοποίησαν
  choice: उन्होंने एक बछड़ा बनाया
  rationale: क्रिया का अर्थ बछड़ा बनाना या गढ़ना है। अगले वाक्यांश में उसे स्पष्ट रूप से ‘मूर्ति’ कहा गया है, इसलिए यहाँ ‘बछड़ा’ स्वाभाविक और पर्याप्त है।
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: उन दिनों
  rationale: यह यूनानी कालवाचक अभिव्यक्ति का सहज और मानक हिन्दी रूप है।
- source_word: ἀνήγαγον θυσίαν
  choice: बलि चढ़ाई
  rationale: बलिदान के प्रसंग में यह क्रिया अर्पित करने का भाव देती है; ‘बलि चढ़ाई’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक धार्मिक अभिव्यक्ति है।
- source_word: τῷ εἰδώλῳ
  choice: उस मूर्ति को
  rationale: निश्चित उपपद पहले बताए गए बछड़े की ओर संकेत करता है। ‘उस मूर्ति’ इस संदर्भ को स्पष्ट रखता है और εἴδωλον के मूर्तिपूजक आशय को व्यक्त करता है।
- source_word: εὐφραίνοντο
  choice: आनन्द मना रहे थे
  rationale: अपूर्ण भूतकाल जारी गतिविधि का संकेत देता है; ‘मना रहे थे’ उस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν τοῖς ἔργοις τῶν χειρῶν αὐτῶν
  choice: अपने हाथों के बनाए काम पर
  rationale: यह अनुवाद हाथों से बनाई वस्तु की बाइबलीय मूर्तिपूजा-विरोधी छवि को बनाए रखता है, साथ ही ‘पर’ प्रसन्न होने के संबंध को हिन्दी में स्वाभाविक बनाता है।
theological_decisions:
- issue: मूर्तिपूजा की भाषा और अलंकारिक तीव्रता
  choice: εἴδωλον को ‘मूर्ति’ और ‘अपने हाथों के बनाए काम’ को अपेक्षाकृत शाब्दिक रूप में रखना
  alternative: ‘प्रतिमा’ और ‘अपनी बनाई हुई वस्तु’
  rationale: स्तिफनुस की वाणी इस्राएल की मूर्तिपूजा की निन्दा करती है और बाइबलीय भविष्यद्वक्ताओं की भाषा की प्रतिध्वनि करती है। ‘मूर्ति’ तथा हाथों के काम का चित्र उस निन्दात्मक बल को बिना अतिरिक्त व्याख्या के सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘बलि चढ़ाई’ और ‘आनन्द मना रहे थे’ स्वाभाविक हिन्दी प्रयोग हैं, जबकि ‘अपने हाथों के बनाए काम’ मूल की मूर्तिपूजा-विरोधी प्रतिध्वनि को बनाए रखता है।
