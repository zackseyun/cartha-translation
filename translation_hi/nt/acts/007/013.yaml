  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘फ़िरौन’ प्रचलित बाइबलीय नामरूप है। दोनों पाद-टिप्पणी चिह्न संबंधित पदांशों के तुरंत बाद रखे गए हैं।
