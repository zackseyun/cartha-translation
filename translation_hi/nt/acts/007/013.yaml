  yaml_path: translation/nt/acts/007/013.yaml
  text: And on the second visit Joseph was recognized by his brothers[b][a], and Joseph’s family became known to Pharaoh.
translation:
  language: hi
  text: और दूसरी बार यूसुफ को उसके भाइयों ने पहचाना,[a] और फ़िरौन को यूसुफ के परिवार का पता चला।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “यूसुफ को उसके भाइयों ने पहचाना।” यूनानी क्रिया कर्मवाच्य है; कथा के संदर्भ में इसे यह भी समझा जा सकता है कि यूसुफ ने उन्हें अपनी पहचान प्रकट की।'
    reason: lexical_alternative
  - marker: b
    text: या “कुटुंब” अथवा “वंश”।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ δευτέρῳ
  choice: दूसरी बार
  rationale: संज्ञा के बिना प्रयुक्त क्रमवाचक विशेषण का अर्थ संदर्भ में ‘दूसरे अवसर पर’ है; भाइयों की मिस्र की दूसरी यात्रा संदर्भ से स्पष्ट है।
- source_word: ἀνεγνωρίσθη
  choice: अपने भाइयों पर प्रकट हुआ
  rationale: यूनानी रूप कर्मवाच्य है और ‘पहचाना गया’ अथवा ‘ज्ञात कराया गया’ हो सकता है। उत्पत्ति की पृष्ठभूमि में यूसुफ ने अपनी पहचान खोली; ‘प्रकट हुआ’ इस घटना को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि टिप्पणी औपचारिक कर्मवाच्य विकल्प सुरक्षित रखती है।
- source_word: ἀδελφοῖς
  choice: भाइयों
  rationale: यहाँ यूसुफ के पुरुष सहोदर अभिप्रेत हैं, इसलिए ‘भाइयों’ सटीक है।
- source_word: φανερὸν ἐγένετο
  choice: पता चला
  rationale: यह वाक्यांश किसी तथ्य के ज्ञात हो जाने को व्यक्त करता है; हिन्दी में ‘पता चला’ सहज और स्पष्ट है।
- source_word: γένος
  choice: परिवार
  rationale: यहाँ शब्द यूसुफ के कुटुंब अथवा वंश-समूह को सूचित करता है; आधुनिक हिन्दी में ‘परिवार’ सबसे स्पष्ट है।
- source_word: τῷ Φαραώ
  choice: फ़िरौन को
  rationale: सम्प्रदान कारक उस व्यक्ति को दर्शाता है जिसे यह बात ज्ञात हुई।
theological_decisions:
- issue: ἀνεγνωρίσθη में कर्मवाच्य रूप और कथा-संदर्भ के बीच तनाव
  choice: मुख्य पाठ में ‘अपने भाइयों पर प्रकट हुआ’
  alternative: ‘अपने भाइयों द्वारा पहचाना गया’
  rationale: मुख्य पाठ उत्पत्ति 45 की घटना—यूसुफ द्वारा पहचान प्रकट करने—को स्वाभाविक हिन्दी में दर्शाता है, पर यूनानी कर्मवाच्य की वास्तविक अस्पष्टता को पाद-टिप्पणी में बनाए रखता है; इससे कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ा जाता।
