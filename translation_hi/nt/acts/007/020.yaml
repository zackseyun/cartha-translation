  text: ἐν ᾧ καιρῷ ἐγεννήθη Μωϋσῆς, καὶ ἦν ἀστεῖος τῷ θεῷ· ὃς ἀνετράφη μῆνας τρεῖς ἐν τῷ οἴκῳ τοῦ πατρός·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/020.yaml
  text: At that time Moses was born[a], and he was beautiful to God. He was brought up for three months in his father's house.
translation:
  language: hi
  text: उसी समय मूसा का जन्म हुआ, और वह परमेश्वर की दृष्टि में सुंदर था। उसे उसके पिता के घर में तीन महीने तक पाला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ καιρῷ
  choice: उसी समय
  rationale: यह स्वाभाविक हिन्दी काल-सूचक अभिव्यक्ति है और प्रसंग में बताए गए उसी समय की ओर संकेत करती है।
- source_word: ἐγεννήθη
  choice: जन्म हुआ
  rationale: जन्म के प्रसंग में γεννάω के कर्मवाच्य रूप का स्वाभाविक हिन्दी अनुवाद।
- source_word: Μωϋσῆς
  choice: मूसा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित नामरूप।
- source_word: ἀστεῖος
  choice: सुंदर
  rationale: यह शब्द शारीरिक सुंदरता या उत्तमता व्यक्त कर सकता है; 'सुंदर' इसके सीधे अर्थ को बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: τῷ θεῷ
  choice: परमेश्वर की दृष्टि में
  rationale: सम्बन्ध अथवा मूल्यांकन बताने वाले सम्प्रदान कारक को स्वाभाविक हिन्दी में व्यक्त करता है और यूनानी में परमेश्वर के स्पष्ट उल्लेख को सुरक्षित रखता है।
- source_word: ἀνετράφη
  choice: पालन-पोषण हुआ
  rationale: क्रिया के निष्क्रिय भाव और घरेलू देखभाल में पाले जाने, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μῆνας τρεῖς
  choice: तीन महीने तक
  rationale: अवधि को हिन्दी में स्वाभाविक रीति से व्यक्त करता है।
- source_word: ἐν τῷ οἴκῳ τοῦ πατρός
  choice: उसके पिता के घर में
  rationale: मूल के पारिवारिक और घरेलू अर्थ को स्पष्ट तथा सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ἀστεῖος τῷ θεῷ का अर्थ
  choice: परमेश्वर की दृष्टि में सुंदर
  alternative: परमेश्वर के लिए सुंदर; अत्यंत सुंदर; असाधारण
  rationale: यह अनुवाद परमेश्वर के स्पष्ट उल्लेख और उनके मूल्यांकन के भाव को बनाए रखता है, पर यूनानी से अधिक प्रबल धर्मवैज्ञानिक दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। वाक्य-विन्यास को हिन्दी के अनुरूप रखा गया है और मूल की अर्थगत अस्पष्टता को अनावश्यक रूप से नहीं सुलझाया गया।
