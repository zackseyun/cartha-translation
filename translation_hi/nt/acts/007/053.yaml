translation:
  language: hi
  text: तुम वे लोग हो जिन्होंने स्वर्गदूतों के माध्यम से दी गई व्यवस्था पाई[a], पर उसका पालन नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘स्वर्गदूतों की व्यवस्थाओं के अनुसार,’ अथवा ‘स्वर्गदूतों के निर्देश पर।’ यूनानी पदबंध कठिन है, पर यह व्यवस्था दिए जाने में स्वर्गदूतों की भूमिका की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: तुम ही वे लोग हो जिन्होंने
  rationale: यह गुणसूचक सम्बन्धवाचक सर्वनाम आगे के द्वितीय पुरुष बहुवचन क्रिया-रूपों के साथ स्तिफनुस के श्रोताओं को सीधे और आरोपात्मक ढंग से सम्बोधित करता है। ‘तुम ही वे लोग हो जिन्होंने’ इस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐλάβετε
  choice: पाई
  rationale: λαμβάνω का यहाँ अर्थ व्यवस्था को प्राप्त करना है। ‘पाई’ सहज हिन्दी है और स्वेच्छा से स्वीकार करने का अतिरिक्त भाव नहीं जोड़ती।
- source_word: τὸν νόμον
  choice: व्यवस्था
  rationale: यहाँ νόμος मूसा की व्यवस्था को सूचित करता है। हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ स्पष्ट और प्रचलित है।
- source_word: εἰς διαταγὰς ἀγγέλων
  choice: स्वर्गदूतों के निर्देशों के माध्यम से
  rationale: यूनानी पदबंध कठिन है; διαταγή में व्यवस्था, निर्देश या आदेश का भाव हो सकता है। यह अनुवाद स्वर्गदूतीय मध्यस्थता के मूल आशय को व्यक्त करता है, पर उसकी सटीक प्रक्रिया को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀγγέλων
  choice: स्वर्गदूतों
  rationale: सन्दर्भ व्यवस्था दिए जाने में सम्मिलित स्वर्गीय प्राणियों का है, मानव दूतों का नहीं।
- source_word: οὐκ ἐφυλάξατε
  choice: फिर भी उसका पालन नहीं किया
  rationale: व्यवस्था के साथ φυλάσσω का अर्थ उसे मानना या उसका पालन करना है। ‘फिर भी’ καί के यहाँ विरोधात्मक प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: εἰς διαταγὰς ἀγγέλων में स्वर्गदूतीय मध्यस्थता का अर्थ
  choice: व्यवस्था स्वर्गदूतों के निर्देशों के माध्यम से प्राप्त हुई।
  alternative: व्यवस्था स्वर्गदूतों द्वारा पहुँचाई गई; अथवा स्वर्गदूतों की व्यवस्थाओं के अन्तर्गत प्राप्त हुई।
  rationale: पाठ व्यवस्था दिए जाने में स्वर्गदूतों की भूमिका बताता है, पर εἰς διαταγὰς की ठीक बारीकी विवादित है। मुख्य पाठ सहज रूप में मध्यस्थता व्यक्त करता है और पादटिप्पणी वास्तविक भाषिक अनिश्चितता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधे आरोप का बल बनाए रखते हुए गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध भाषा। कठिन यूनानी पदबंध की अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
