source:
  edition: SBLGNT
  text: οὗτος κατασοφισάμενος τὸ γένος ἡμῶν ἐκάκωσεν τοὺς ⸀πατέρας τοῦ ποιεῖν ⸂τὰ βρέφη ἔκθετα⸃ αὐτῶν εἰς τὸ μὴ ζῳογονεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/019.yaml
  text: This man[a], having dealt shrewdly with our people, mistreated our fathers[c][b], causing their infants to be exposed so that they would not be kept alive.
translation:
  language: hi
  text: इस व्यक्ति ने[a] हमारे लोगों के साथ छल-कपट किया और हमारे पूर्वजों[c] के साथ बुरा व्यवहार किया; उसने उन्हें अपने शिशुओं को खुले में छोड़ देने के लिए मजबूर किया[b], ताकि वे जीवित न बचें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने।” यूनानी में संकेतवाचक शब्द पहले बताए गए राजा की ओर स्पष्ट रूप से संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात शिशुओं को खुले में त्याग देना, ताकि वे मर जाएँ।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, “हमारे पिताओं”; आशय इस्राएल की पिछली पीढ़ियों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: उसने
  rationale: संदर्भ में संकेतवाचक सर्वनाम पहले बताए गए राजा की ओर लौटता है। हिंदी में ‘उसने’ स्वाभाविक है और संदर्भगत संकेत बनाए रखता है।
- source_word: κατασοφισάμενος
  choice: छल-कपट किया
  rationale: यह कृदंत चतुराई से रचे गए, नकारात्मक और कपटपूर्ण व्यवहार को व्यक्त करता है; ‘छल-कपट’ आधुनिक हिंदी में यह भाव स्पष्ट करता है।
- source_word: τὸ γένος ἡμῶν
  choice: हमारे लोगों
  rationale: यहाँ γένος इस्राएल के जातीय समुदाय को दर्शाता है; ‘हमारे लोग’ आधुनिक हिंदी में सहज है और ‘जाति’ के संभावित भ्रामक अर्थों से बचता है।
- source_word: ἐκάκωσεν
  choice: बुरा व्यवहार किया
  rationale: क्रिया हानि पहुँचाने और दुर्व्यवहार करने का व्यापक भाव रखती है; यह चयन उसे अनावश्यक रूप से केवल राजनीतिक उत्पीड़न तक सीमित नहीं करता।
- source_word: τοὺς πατέρας
  choice: हमारे पूर्वजों
  rationale: यह पद इस्राएल की पिछली पीढ़ियों को सूचित करता है। आधुनिक हिंदी में ‘पूर्वज’ प्राकृतिक और ऐतिहासिक अर्थ में स्पष्ट है।
- source_word: τοῦ ποιεῖν τὰ βρέφη ἔκθετα αὐτῶν
  choice: उसने उनके शिशुओं को बाहर छोड़ देने पर मजबूर किया
  rationale: वाक्यांश उनके शिशुओं को परित्यक्त अवस्था में रखवाने को फिरौन के दुर्व्यवहार के साधन या परिणाम के रूप में प्रस्तुत करता है। निर्गमन की पृष्ठभूमि में बाध्यता निहित है, जबकि पादटिप्पणी ‘बाहर छोड़ने’ की प्रथा स्पष्ट करती है।
- source_word: εἰς τὸ μὴ ζῳογονεῖσθαι
  choice: ताकि वे जीवित न रहें
  rationale: यह प्रयोजन या अभिप्रेत परिणाम व्यक्त करता है। हिंदी में यह स्वाभाविक है और बच्चों को जीवित न बचने देने का अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: τοῦ ποιεῖν में कारण, साधन या बाध्यता का संबंध
  choice: ‘मजबूर किया’ के द्वारा प्रसंग में निहित बाध्यता व्यक्त की गई
  alternative: ‘ऐसा किया कि’ या ‘जिसके कारण’
  rationale: व्याकरण स्वयं केवल बाध्यता को स्पष्ट रूप से चिह्नित नहीं करता, पर निर्गमन की पृष्ठभूमि शासकीय दबाव दिखाती है। इसलिए मुख्य पाठ में स्वाभाविक हिंदी चुनी गई, बिना किसी विशिष्ट सांप्रदायिक व्याख्या को जोड़ने के।
- issue: εἰς τὸ में प्रयोजन और परिणाम की संभावित अर्थछाया
  choice: ‘ताकि’
  alternative: ‘जिससे’
  rationale: निर्माण उद्देश्य अथवा अभिप्रेत परिणाम दोनों ग्रहण कर सकता है। ‘ताकि’ फिरौन की नीति के जानबूझकर प्राणघातक लक्ष्य को व्यक्त करता है, पर इसके आगे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘छल-कपट’, ‘पूर्वज’ और ‘शिशु’ सहज हिंदी देते हैं; सांस्कृतिक रूप से अपरिचित शिशु-परित्याग की प्रथा को पादटिप्पणी में समझाया गया है।
