  text: ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ καὶ ᾐτήσατο εὑρεῖν σκήνωμα τῷ ⸀θεῷ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/046.yaml
  text: who found favor before God and asked to find a dwelling place for the God of Jacob[a].
translation:
  language: hi
  text: जिसने परमेश्वर के सामने अनुग्रह पाया और याकूब के परमेश्वर के लिए एक निवास-स्थान खोजने की विनती की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याकूब के परमेश्वर के लिए एक तंबू।”
    reason: σκήνωμα का अर्थ सामान्य निवास-स्थान के साथ-साथ तंबू या तंबू-जैसा निवास भी हो सकता है।
lexical_decisions:
- source_word: εὗρεν χάριν
  choice: अनुग्रह पाया
  rationale: यह यूनानी मुहावरा किसी की कृपा या स्वीकृति प्राप्त करने को दर्शाता है। ‘अनुग्रह पाया’ स्वाभाविक बाइबलीय हिन्दी है और संबंधपरक अर्थ बनाए रखता है।
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर के सामने
  rationale: ἐνώπιον संबंधवाचक रूप के साथ किसी के सामने या उसकी दृष्टि में होने का भाव देता है; यह चयन संक्षिप्त और सहज है।
- source_word: ᾐτήσατο
  choice: विनती की
  rationale: मध्यवाच्य रूप यहाँ अनुरोध करने का अर्थ देता है। ‘विनती की’ प्रसंगानुकूल आदर और गंभीरता व्यक्त करता है, बिना इसे औपचारिक याचिका तक सीमित किए।
- source_word: εὑρεῖν
  choice: खोजने
  rationale: मूल क्रिया का सीधा अर्थ ‘खोजना/पाना’ है। यद्यपि प्रसंग में व्यवस्था करने या प्राप्त करने का भाव हो सकता है, ‘खोजने’ मूल अभिव्यक्ति की खुली प्रकृति को सुरक्षित रखता है।
- source_word: σκήνωμα
  choice: निवास-स्थान
  rationale: यह शब्द रहने के स्थान या आवास को दर्शाता है और आवश्यक रूप से केवल मिलापवाले तंबू या मंदिर का तकनीकी नाम नहीं है।
- source_word: τῷ θεῷ Ἰακώβ
  choice: याकूब के परमेश्वर के लिए
  rationale: दत्तिवाचक रूप को यहाँ ‘के लिए’ से स्वाभाविक ढंग से व्यक्त किया गया है; ‘याकूब का परमेश्वर’ वाचा-संबंधी पारंपरिक अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: दाऊद द्वारा माँगी गई संरचना का स्वरूप और संकेत
  choice: ‘एक निवास-स्थान’
  alternative: ‘एक तंबू’ या ‘एक भवन’
  rationale: σκήνωμα व्यापक शब्द है। अगले पद में सुलैमान द्वारा भवन बनाने का उल्लेख आता है, इसलिए यहाँ किसी एक विशिष्ट संरचना को पहले से निश्चित न करके कथानक का तनाव और शब्द की व्यापकता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और शास्त्रीय वाचा-संबंधी भाषा से परिचित पाठकों के लिए सहज। ‘निवास-स्थान’ तकनीकी संकीर्णता से बचते हुए मूल की अर्थ-व्याप्ति रखता है।
