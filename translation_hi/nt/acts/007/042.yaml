source:
  edition: SBLGNT
  text: ἔστρεψεν δὲ ὁ θεὸς καὶ παρέδωκεν αὐτοὺς λατρεύειν τῇ στρατιᾷ τοῦ οὐρανοῦ, καθὼς γέγραπται ἐν βίβλῳ τῶν προφητῶν· Μὴ σφάγια καὶ θυσίας προσηνέγκατέ μοι ἔτη τεσσεράκοντα ἐν τῇ ἐρήμῳ, οἶκος Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/042.yaml
  text: 'But God turned away and gave them over to serve the host of heaven[a], just as it is written in the book of the prophets: ‘Did you offer to me slain offerings and sacrifices for forty years in the wilderness[d][c][b], O house of Israel?’'
translation:
  language: hi
  text: 'लेकिन परमेश्वर ने मुँह फेर लिया और उन्हें आकाश के गणों की उपासना करने के हवाले कर दिया[a], जैसा कि भविष्यद्वक्ताओं की पुस्तक[c] में लिखा है: “हे इस्राएल के घराने, क्या तुमने जंगल में चालीस वर्ष तक मेरे लिए बलि-पशु और बलिदान चढ़ाए थे?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आकाश के गणों की सेवा करने के लिए।” यूनानी क्रिया धार्मिक सेवा या उपासना—दोनों का बोध करा सकती है। “आकाश के गण” बाइबल में आकाशीय पिंडों और, विस्तार से, मूर्तिपूजा में उनसे संबद्ध आकाशीय शक्तियों के लिए प्रयुक्त अभिव्यक्ति है।
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: यह उद्धरण आमोस 5:25 से है।
    reason: cross_reference
  - marker: c
    text: “पुस्तक” का अनुवाद “ग्रंथ-पट (स्क्रॉल)” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστρεψεν
  choice: मुँह फेर लिया
  rationale: परमेश्वर के विमुख होने का संबंधपरक और न्यायिक भाव स्वाभाविक हिन्दी में व्यक्त करता है; इसे केवल शारीरिक रूप से ‘मुड़ना’ नहीं बनाता।
- source_word: παρέδωκεν
  choice: उन्हें ... करने के लिए छोड़ दिया
  rationale: न्याय के रूप में उनके अपने मूर्तिपूजक मार्ग के हवाले कर देने का कठोर भाव रखता है, पर यह नहीं कहता कि परमेश्वर ने उनसे पाप करवाया।
- source_word: λατρεύειν
  choice: उपासना करने
  rationale: यहाँ क्रिया धार्मिक सेवा या उपासना सूचित करती है। आकाशीय समुदाय के प्रति मूर्तिपूजक भक्ति के संदर्भ में ‘उपासना’ आधुनिक हिन्दी में अधिक स्पष्ट है; ‘सेवा करने’ का विकल्प पादटिप्पणी में रखा गया है।
- source_word: τῇ στρατιᾷ τοῦ οὐρανοῦ
  choice: आकाश की सेना
  rationale: मूल के रूपक और बाइबलीय अभिव्यक्ति को सुरक्षित रखता है; इसका संकेत आकाशीय पिंडों और उनसे जोड़ी गई शक्तियों की ओर हो सकता है, इसलिए मुख्य पाठ में इसे केवल ‘तारों’ तक सीमित नहीं किया गया।
- source_word: ἐν βίβλῳ τῶν προφητῶν
  choice: भविष्यद्वक्ताओं की पुस्तक में
  rationale: βίβλος के लिए सहज आधुनिक शब्द ‘पुस्तक’ है; ऐतिहासिक रूप से ‘लपेटे हुए ग्रंथ’ की संभावना अनावश्यक रूप से मुख्य पाठ में नहीं लाई गई।
- source_word: Μὴ
  choice: क्या ... चढ़ाए थे?
  rationale: प्रश्न नकारात्मक उत्तर की अपेक्षा करता है। हिन्दी में सामान्य प्रश्नरूप अलंकारिक तनाव बनाए रखता है और उत्तर को पाठ में जोड़कर स्पष्ट नहीं करता।
- source_word: σφάγια καὶ θυσίας
  choice: बलि किए हुए पशु और बलिदान
  rationale: पहला पद वध किए गए बलि-पशुओं पर और दूसरा बलिदानों पर बल देता है; दोनों संज्ञाओं का अंतर बनाए रखा गया है।
- source_word: οἶκος Ἰσραήλ
  choice: हे इस्राएल के घराने
  rationale: सामूहिक संबोधन और मूल बाइबलीय रूपक दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: न्याय में परमेश्वर की क्रिया
  choice: ‘मुँह फेर लिया’ और ‘छोड़ दिया’ द्वारा न्यायिक परित्याग व्यक्त किया गया है।
  alternative: परमेश्वर ने केवल अनुमति दी; अथवा परमेश्वर ने उनसे मूर्तिपूजा करवाई।
  rationale: दोनों क्रियाएँ विद्रोह के उत्तर में परमेश्वर के न्याय को दिखाती हैं। अनुवाद सक्रिय न्याय को बनाए रखता है, पर परमेश्वर को उनके पाप का कर्ता नहीं ठहराता।
- issue: ‘आकाश की सेना’ का संदर्भ
  choice: मूल की व्यापक बाइबलीय अभिव्यक्ति रखी गई है।
  alternative: केवल तारे; अथवा केवल स्वर्गदूत।
  rationale: इस संदर्भ में आकाशीय पिंड अथवा उनसे संबद्ध मानी गई शक्तियाँ अभिप्रेत हो सकती हैं। किसी एक पहचान को मुख्य पाठ में थोपना मूल की व्याप्ति को संकुचित कर देगा।
- issue: आमोस 5:25 के प्रश्न का आशय
  choice: अलंकारिक प्रश्न को प्रश्न ही रहने दिया गया है।
  alternative: इसे स्पष्ट कथन बनाया जाए कि इस्राएल ने परमेश्वर को बलिदान नहीं चढ़ाए।
  rationale: उद्धरण में निहित ऐतिहासिक और धार्मिक तनाव को व्याख्यात्मक कथन से सुलझाया नहीं गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘मुँह फेर लिया’, ‘छोड़ दिया’ और ‘उपासना’ सहज हैं, जबकि ‘इस्राएल के घराने’ तथा ‘आकाश की सेना’ मूल की बाइबलीय छवि और सामूहिक संबोधन को सुरक्षित रखते हैं।
