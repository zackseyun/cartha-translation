id: ACT.7.33
reference: Acts 7:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ κύριος· Λῦσον τὸ ὑπόδημα τῶν ποδῶν σου, ὁ γὰρ τόπος ⸀ἐφ’ ᾧ ἕστηκας γῆ ἁγία ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/033.yaml
  text: Then the Lord said to him[a], ‘Take off the sandals from your feet, for the place on which you are standing is holy ground.’
translation:
  language: hi
  text: तब प्रभु ने उससे कहा, “अपने पाँवों से जूती उतार दो[a], क्योंकि जिस स्थान पर तुम खड़े हो, वह पवित्र भूमि है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “अपने पाँवों की जूती खोल दो।”
    reason: λύω के मूल अर्थ ‘खोलना/ढीला करना’ और ὑπόδημα के एकवचन रूप को स्पष्ट करना।
lexical_decisions:
- source_word: κύριος
  choice: प्रभु
  rationale: κύριος के सामान्य सम्मानसूचक और ईश्वरीय शीर्षक को दर्शाता है। यूनानी पाठ में स्वयं परमेश्वर का विशिष्ट इब्रानी नाम नहीं है, इसलिए उसे यहाँ नहीं जोड़ा गया।
- source_word: Λῦσον
  choice: उतार दो
  rationale: λύω का मूल अर्थ ‘खोलना’ या ‘ढीला करना’ है, पर जूती के संदर्भ में आज की स्वाभाविक हिन्दी में अभिप्रेत क्रिया ‘उतारना’ है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: τὸ ὑπόδημα
  choice: जूती
  rationale: यूनानी संज्ञा एकवचन है। ‘जूती’ उस समय के पाँव में पहने जाने वाले साधारण footwear के लिए सहज हिन्दी शब्द है और मूल वचन को बनाए रखती है।
- source_word: τῶν ποδῶν σου
  choice: अपने पाँवों से
  rationale: ποδῶν बहुवचन है; हिन्दी में ‘अपने पाँवों से जूती उतार दो’ स्वाभाविक रूप से संबंध और अलग करने की क्रिया दोनों व्यक्त करता है।
- source_word: ὁ γὰρ τόπος
  choice: क्योंकि जिस स्थान
  rationale: γάρ का कारणसूचक अर्थ ‘क्योंकि’ और τόπος का सामान्य अर्थ ‘स्थान’ से व्यक्त किया गया है।
- source_word: ἐφ’ ᾧ ἕστηκας
  choice: पर तुम खड़े हो
  rationale: ἐπί की स्थानवाचक शक्ति को ‘पर’ से और ἕστηκας की वर्तमान अवस्था को ‘खड़े हो’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: γῆ ἁγία
  choice: पवित्र भूमि
  rationale: इस स्थानीय प्रसंग में γῆ का अर्थ ‘भूमि’ है; विशेषण ἁγία को ‘पवित्र’ से सीधे व्यक्त किया गया है।
theological_decisions:
- issue: निर्गमन के ईश्वरीय प्रकटाव के उद्धरण में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: प्रेरितों के काम के यूनानी पाठ में κύριος है, न कि इब्रानी चतुरक्षरीय ईश्वरीय नाम। ‘प्रभु’ मूल यूनानी शीर्षक और उसकी श्रद्धापूर्ण शक्ति को सुरक्षित रखता है, जबकि पुराने नियम के अंतर्निहित पाठ से विशिष्ट नाम को यहाँ आयात नहीं करता।
- issue: मूसा को संबोधित करने के लिए हिन्दी सर्वनाम
  choice: तुम
  alternative: तू
  rationale: यूनानी एकवचन सर्वनाम सम्मान-स्तर निर्धारित नहीं करता। आधुनिक मानक हिन्दी में ‘तुम’ सीधा, स्वाभाविक और गरिमापूर्ण है तथा ईश्वरीय वचन में अनावश्यक अपमानसूचक भाव से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। उद्धरण में ‘तुम’ वर्तमान पाठकों के लिए स्वाभाविक है। मूल यूनानी के एकवचन ‘जूती’ को बनाए रखा गया है; बहुवचन करना परिचित बाइबलीय अभिव्यक्ति के अनुरूप होता, पर इस यूनानी पाठ के रूप को धुंधला कर देता।
