  text: The tent of testimony was with our fathers in the wilderness[a], just as the one speaking to Moses directed him to make it according to the pattern that he had seen[c][b],
translation:
  language: hi
  text: निर्जन प्रदेश में गवाही का तंबू हमारे पूर्वजों के बीच था, जैसा मूसा से बोलने वाले ने मूसा को निर्देश दिया था कि वह उसे उस नमूने के अनुसार बनाए, जो मूसा ने देखा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡ σκηνὴ τοῦ μαρτυρίου
  choice: “गवाही का तंबू”
  rationale: σκηνή का मूल अर्थ चलायमान ‘तंबू’ है; आधुनिक पाठक के लिए यह पारंपरिक लेकिन अपेक्षाकृत विशिष्ट ‘निवास-स्थान’ या ‘मिलापवाला तंबू’ से अधिक सीधा है। τοῦ μαρτυρίου की संबंधकारक रचना को ‘गवाही का’ के रूप में बनाए रखा गया है।
- source_word: τοῖς πατράσιν ἡμῶν
  choice: हमारे पूर्वजों
  rationale: संदर्भ में यह इस्राएल की पिछली पीढ़ियों को दर्शाता है। ‘पूर्वजों’ आधुनिक हिन्दी में स्वाभाविक है, जबकि यूनानी के शाब्दिक ‘हमारे पितरों’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐν τῇ ἐρήμῳ
  choice: निर्जन प्रदेश में
  rationale: ἐρημία उस उजाड़, कम आबादी वाले क्षेत्र को सूचित करती है जहाँ इस्राएली भटकते रहे। ‘निर्जन प्रदेश’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है और केवल रेतीले रेगिस्तान का अनावश्यक बिंब नहीं जोड़ता।
- source_word: ἦν τοῖς πατράσιν ἡμῶν
  choice: हमारे पूर्वजों के बीच था
  rationale: संबंधसूचक दत्तिव को स्वाभाविक हिन्दी में ‘के बीच’ कहा गया है; इससे तंबू का उस समुदाय के मध्य उपस्थित होना व्यक्त होता है।
- source_word: καθὼς διετάξατο
  choice: ने आदेश दिया था कि ... ठीक ... के अनुसार
  rationale: διατάσσομαι यहाँ अधिकारपूर्ण निर्देश देना दर्शाता है। ‘आदेश दिया था’ उसका बल बनाए रखता है, और ‘ठीक ... के अनुसार’ καθὼς तथा κατά की अनुरूपता स्पष्ट करता है।
- source_word: ὁ λαλῶν τῷ Μωϋσῇ
  choice: मूसा से बोलने वाले
  rationale: मूल पाठ वक्ता का नाम स्पष्ट नहीं करता और वर्तमान कृदंत का प्रयोग करता है। यह रूप उसी अंतर्निहित संदर्भ और कृदंतीय अभिव्यक्ति को सुरक्षित रखता है।
- source_word: ποιῆσαι αὐτὴν
  choice: कि वह उसे ... बनाए
  rationale: आदेश के बाद हिन्दी की स्वाभाविक परोक्ष-वाक्य रचना अपनाई गई है; पहले ‘वह’ का संदर्भ मूसा और ‘उसे’ का संदर्भ तंबू है।
- source_word: κατὰ τὸν τύπον
  choice: उस नमूने के अनुसार
  rationale: τύπος यहाँ दिखाए गए आदर्श रूप या प्रतिरूप को दर्शाता है। निर्माण-संदर्भ में ‘नमूना’ सहज और सटीक है।
- source_word: ὃν ἑωράκει
  choice: जिसे उसने देखा था
  rationale: पूर्णभूत अर्थ को ‘देखा था’ से व्यक्त किया गया है; कर्ता मूसा है और संबंधवाचक सर्वनाम का पूर्वपद ‘नमूना’ है।
theological_decisions:
- issue: मूसा से बोलने वाले की पहचान
  choice: वक्ता को ‘मूसा से बोलने वाले’ के रूप में अंतर्निहित रखा गया।
  alternative: ‘परमेश्वर ने’ या ‘प्रभु ने’
  rationale: संदर्भ में वक्ता परमेश्वर है, पर यूनानी पद स्वयं उसका नाम नहीं लेता। नाम जोड़ने के बजाय मूल की अंतर्निहित अभिव्यक्ति और उसका धार्मिक तनाव सुरक्षित रखा गया है।
- issue: ‘गवाही’ का आशय
  choice: संबंधकारक पद को सामान्य रूप से ‘गवाही का तंबू’ रखा गया।
  alternative: ‘वाचा की पटियाओं वाला तंबू’ या ‘साक्षी का तंबू’
  rationale: यह अभिव्यक्ति परमेश्वर की गवाही, विशेषतः वाचा से जुड़ी पटियाओं की ओर संकेत कर सकती है, पर अनुवाद में उस आशय को विस्तार देकर केवल एक व्याख्या निर्धारित नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘तंबू,’ ‘पूर्वज’ और ‘नमूना’ जैसे प्रचलित शब्द चुने गए हैं; मूल की बाइबलीय संज्ञा और अंतर्निहित वक्ता को पादटिप्पणियों सहित सुरक्षित रखा गया है।
