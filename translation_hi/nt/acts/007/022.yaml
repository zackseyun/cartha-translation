source:
  edition: SBLGNT
  text: καὶ ἐπαιδεύθη ⸀Μωϋσῆς πάσῃ σοφίᾳ Αἰγυπτίων, ἦν δὲ δυνατὸς ἐν λόγοις καὶ ἔργοις ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/022.yaml
  text: And Moses was educated in all the wisdom of the Egyptians, and he was mighty in his words and deeds.
translation:
  language: hi
  text: और मूसा को मिस्रियों की सारी विद्या में शिक्षा दी गई, और वह अपने वचनों और कार्यों में सामर्थी था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वाणी और कार्यों में।”
    reason: λόγοις καὶ ἔργοις का एक स्वाभाविक अर्थगत विकल्प।
lexical_decisions:
- source_word: ἐπαιδεύθη
  choice: शिक्षा दी गई
  rationale: यह कर्मवाच्य रूप मूसा द्वारा व्यवस्थित शिक्षा और प्रशिक्षण पाए जाने को व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और अर्थानुकूल है।
- source_word: πάσῃ σοφίᾳ Αἰγυπτίων
  choice: मिस्रियों की सारी बुद्धि
  rationale: 'यह पदबंध शिक्षा के विषय और विस्तार दोनों को बनाए रखता है: मिस्रियों से संबद्ध समस्त ज्ञान-बुद्धि।'
- source_word: δυνατὸς
  choice: सामर्थी
  rationale: यह शब्द δυνατός की शक्ति और प्रभावशीलता को बनाए रखता है और ‘वचनों और कामों में’ के साथ गरिमापूर्ण, स्वाभाविक बाइबलीय हिन्दी देता है।
- source_word: ἐν λόγοις καὶ ἔργοις
  choice: वचनों और कामों में
  rationale: यह यूनानी युग्म की अलंकारिक समानता को निकटता से सुरक्षित रखता है; ‘वचन’ कही हुई बातों और ‘काम’ किए गए कार्यों को व्यक्त करते हैं।
- source_word: αὐτοῦ
  choice: अपने
  rationale: पद के अंत में आया सर्वनाम मूसा के वचनों और कामों से स्वाभाविक रूप से जुड़ता है; हिन्दी में कर्ता की ओर संकेत के लिए ‘अपने’ उचित है।
theological_decisions:
- issue: λόγοις में मूसा के सामर्थ्य का आशय
  choice: ‘अपने वचनों और कामों में सामर्थी’ कहकर कथन को उसके अपने रूप में रखा गया है।
  alternative: निर्गमन 4:10 से सामंजस्य बैठाने के लिए इसे केवल प्रतिष्ठा, प्रभाव या दूसरों के माध्यम से हुए कार्यों के अर्थ में स्पष्ट करना।
  rationale: यह पद मूसा को वचन और काम दोनों में सामर्थी बताता है। निर्गमन 4:10 के साथ दिखाई देने वाले तनाव को अनुवाद में व्याख्यात्मक ढंग से मिटाना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘सामर्थी’ मूल की शक्ति-सूचक बारीकी रखता है; ‘वचनों और कामों’ से यूनानी युग्म भी सुरक्षित रहता है।
