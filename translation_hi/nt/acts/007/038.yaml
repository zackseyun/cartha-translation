source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ γενόμενος ἐν τῇ ἐκκλησίᾳ ἐν τῇ ἐρήμῳ μετὰ τοῦ ἀγγέλου τοῦ λαλοῦντος αὐτῷ ἐν τῷ ὄρει Σινᾶ καὶ τῶν πατέρων ἡμῶν, ὃς ἐδέξατο ⸀λόγια ζῶντα δοῦναι ⸀ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/038.yaml
  text: This is the one who was in the assembly in the wilderness with the angel who was speaking to him on Mount Sinai[a], and with our fathers[c][b]; he received living oracles to give to us.
translation:
  language: hi
  text: यही वह है जो जंगल में उस सभा[a] में, उस स्वर्गदूत के साथ था जो सीनै पर्वत पर उससे बात कर रहा था, और हमारे पितरों[c] के साथ था; उसने हमें देने के लिए जीवित ईश-वचन[b] प्राप्त किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मण्डली”; परम्परागत अनुवाद में “जंगल की कलीसिया।”
    reason: alternative_reading
  - marker: b
    text: या “जीवित वचन”; अथवा “जीवन देने वाले ईश-वचन।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “हमारे पिताओं”; यहाँ इसका अर्थ इस्राएल के पितर हैं। या “हमारे पूर्वज।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: सभा
  rationale: यहाँ इस्राएल के जंगल में एकत्र समुदाय की बात है। ‘सभा’ मूल अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और बाद की संस्थागत ‘कलीसिया’ की धारणा को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: ἐρήμῳ
  choice: जंगल
  rationale: बाइबिल के इस प्रसंग में यह निर्जन वन-प्रदेश को दर्शाता है; ‘जंगल’ आधुनिक हिन्दी में सहज है और केवल रेतीले ‘रेगिस्तान’ तक अर्थ को सीमित नहीं करता।
- source_word: ἀγγέλου
  choice: स्वर्गदूत
  rationale: सीनै के प्रसंग में यह किसी मानवीय संदेशवाहक के बजाय स्वर्गीय दूत को सूचित करता है।
- source_word: λαλοῦντος
  choice: बात करने वाले
  rationale: वर्तमान कृदन्त की जारी क्रिया को सहज हिन्दी विशेषण-उपवाक्य में रखा गया है।
- source_word: ὄρει Σινᾶ
  choice: सीनै पर्वत
  rationale: स्थान-नाम का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: πατέρων ἡμῶν
  choice: हमारे पूर्वजों
  rationale: सन्दर्भ इस्राएल की पिछली पीढ़ी के पितरों से है। ‘पूर्वज’ आधुनिक हिन्दी में स्वाभाविक है और सामूहिक ऐतिहासिक सम्बन्ध को स्पष्ट करता है; शाब्दिक ‘पिताओं’ का विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἐδέξατο
  choice: ग्रहण किए
  rationale: मूसा द्वारा परमेश्वर से प्रकाशन पाने का भाव सम्मानपूर्ण और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: λόγια
  choice: ईश-वचन
  rationale: यह साधारण शब्दों के बजाय परमेश्वर की ओर से आए कथनों को दर्शाता है। ‘ईश-वचन’ उस प्रकाशनात्मक अर्थ को बनाए रखता है।
- source_word: ζῶντα
  choice: जीवित
  rationale: मूल का सीधा अर्थ रखा गया है, ताकि इसे केवल ‘जीवन देने वाले’ अर्थ तक सीमित न किया जाए।
- source_word: δοῦναι
  choice: देने के लिए
  rationale: यह infinitive मूसा को वचन मिलने के उद्देश्य या परिणति को सरल और स्पष्ट रूप में व्यक्त करता है।
- source_word: ἡμῖν
  choice: हमें
  rationale: स्तिफनुस अपने श्रोताओं और स्वयं को इस्राएल के वाचा-इतिहास से जोड़ता है; मूल का प्रथम पुरुष बहुवचन सुरक्षित है।
- source_word: ὁ γενόμενος
  choice: वह व्यक्ति ... था
  rationale: इस प्रसंग में यह मूसा की उस स्थिति में उपस्थिति और पहचान बताता है। अत्यधिक शाब्दिक ‘जो हुआ’ की अपेक्षा यह हिन्दी में सहज है।
theological_decisions:
- issue: जंगल में इस्राएल के लिए ἐκκλησία का अनुवाद ‘कलीसिया’ किया जाए या नहीं
  choice: सभा
  alternative: मण्डली; कलीसिया
  rationale: ‘सभा’ एकत्र इस्राएली समुदाय को दिखाता है, पर बाद की नयी-वाचा की संस्थागत कलीसिया के साथ पूर्ण अभिन्नता का निष्कर्ष अनुवाद में आरोपित नहीं करता।
- issue: λόγια ζῶντα को व्याख्यात्मक रूप से ‘जीवन देने वाले वचन’ बनाया जाए या नहीं
  choice: जीवित ईश-वचन
  alternative: जीवित वचन; जीवन देने वाले ईश-वचन
  rationale: 'यह मूल की सघन और धर्मवैज्ञानिक रूप से खुली अभिव्यक्ति को बनाए रखता है: वचनों को ‘जीवित’ कहा गया है, पर इसका आशय अनुवाद में केवल जीवन प्रदान करने तक सीमित नहीं किया गया।'
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। ‘सभा’, ‘स्वर्गदूत’ और ‘ईश-वचन’ जैसे पद बाइबिलीय गरिमा रखते हुए अनावश्यक सांप्रदायिक निष्कर्षों से बचते हैं।
