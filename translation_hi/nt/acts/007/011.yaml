  text: ἦλθεν δὲ λιμὸς ἐφ’ ὅλην τὴν ⸀Αἴγυπτον καὶ Χανάαν καὶ θλῖψις μεγάλη, καὶ οὐχ ηὕρισκον χορτάσματα οἱ πατέρες ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/011.yaml
  text: A famine came over all Egypt and Canaan[a], and great distress, and our fathers could not find food.
translation:
  language: hi
  text: सारे मिस्र और कनान में अकाल पड़ा और बड़ा संकट आया, और हमारे पितरों[a] को भोजन नहीं मिल रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमारे पूर्वजों’। यूनानी में ‘हमारे पिता’ है, जिसका संकेत इस्राएल के पुरखों की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν δὲ λιμὸς
  choice: अकाल पड़ा
  rationale: ἦλθεν का λιμός के साथ प्रयोग अकाल के आ पड़ने को व्यक्त करता है। ‘अकाल पड़ा’ आधुनिक हिन्दी में स्वाभाविक है; δέ की हल्की कथात्मक जोड़ने वाली भूमिका वाक्य के प्रवाह से स्पष्ट है, इसलिए अलग से ‘अब’ जोड़ना आवश्यक नहीं।
- source_word: ἐφ’ ὅλην τὴν Αἴγυπτον καὶ Χανάαν
  choice: सारे मिस्र और कनान में
  rationale: ἐπί के साथ कर्मकारक यहाँ पूरे भौगोलिक क्षेत्र में विस्तार बताता है। ‘सारे मिस्र और कनान में’ हिन्दी में स्वाभाविक रूप से यही व्यापकता व्यक्त करता है।
- source_word: θλῖψις μεγάλη
  choice: बड़ा संकट
  rationale: यह अकाल से उत्पन्न गंभीर विपत्ति या कठिनाई को दर्शाता है। ‘बड़ा संकट’ स्पष्ट और प्रसंगानुकूल है तथा इसे विशेष रूप से युगांत-संबंधी ‘महाक्लेश’ नहीं बनाता।
- source_word: οὐχ ηὕρισκον
  choice: नहीं मिल रहा था
  rationale: अपूर्ण भूतकाल संकट के दौरान जारी अभाव को दर्शाता है। हिन्दी का यह रूप उस निरंतर असमर्थता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: χορτάσματα
  choice: भोजन
  rationale: बहुवचन संज्ञा खाने की वस्तुओं या खाद्य-सामग्री को व्यापक रूप से दर्शाती है। ‘भोजन’ स्पष्ट है और अर्थ को केवल अनाज या पशुचारे तक सीमित नहीं करता।
- source_word: οἱ πατέρες ἡμῶν
  choice: हमारे पितरों
  rationale: शब्दशः अर्थ ‘हमारे पिता’ है और यहाँ इस्राएल के पुरुष पुरखों की ओर संकेत है। ‘पितरों’ स्रोत की पुरुषवाची पारिवारिक भाषा को बनाए रखते हुए ऐतिहासिक पूर्वजों का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: पूर्वजों के लिए पुरुषवाची भाषा
  choice: हमारे पितरों
  alternative: हमारे पूर्वजों
  rationale: यूनानी पाठ स्पष्ट रूप से पुरुषवाची οἱ πατέρες का प्रयोग करता है और इस्राएल के पुरखों की ओर संकेत करता है। इसलिए मुख्य पाठ में पुरुषवाची ऐतिहासिक संबोधन रखा गया है, जबकि अधिक सामान्य विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पितरों’ ऐतिहासिक-बाइबिलीय संदर्भ को सँभालता है, जबकि बाकी वाक्य सामान्य आधुनिक हिन्दी में है।
