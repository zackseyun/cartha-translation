  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ Μωϋσῆς ὁ ⸀εἴπας τοῖς υἱοῖς Ἰσραήλ· Προφήτην ὑμῖν ἀναστήσει ⸂ὁ θεὸς⸃ ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/037.yaml
  text: This is the Moses who said to the sons of Israel[a], ‘God will raise up for you a prophet from among your brothers[c][b], like me.’
translation:
  language: hi
  text: यह वही मूसा है, जिसने इस्राएल के पुत्रों[a] से कहा था, “परमेश्वर तुम्हारे लिए तुम्हारे भाइयों[b] में से मेरे समान एक भविष्यद्वक्ता[c] खड़ा करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् इस्राएली; यूनानी में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भाइयों” का अर्थ साथी इस्राएली है; यूनानी शब्द पुरुषवाचक बहुवचन है।
    reason: cultural_note
  - marker: c
    text: या, अधिक व्याख्यात्मक रूप में, “वह भविष्यद्वक्ता”; यह व्यवस्थाविवरण 18:15 की प्रसिद्ध प्रतिज्ञा और प्रेरितों के काम में यीशु पर उसके लागू होने को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ Μωϋσῆς
  choice: यह वही मूसा है
  rationale: ‘यह वही’ यूनानी संकेतवाचक और निश्चित पहचान के बल को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘यह मूसा है’ अपेक्षित जोर को कम कर देता।
- source_word: ὁ εἴπας
  choice: जिसने ... कहा था
  rationale: विशेषणात्मक एओरिस्ट कृदन्त को हिन्दी में स्वाभाविक सम्बन्धवाचक उपवाक्य से व्यक्त किया गया है।
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: यह υἱοῖς के पुरुषवाचक शाब्दिक रूप और पुराना नियम-संबंधी अभिव्यक्ति को सुरक्षित रखता है; सामान्य अर्थ ‘इस्राएलियों’ का है।
- source_word: Προφήτην
  choice: एक भविष्यद्वक्ता
  rationale: संज्ञा अनिश्चित है; ‘एक भविष्यद्वक्ता’ मूल कथन को बिना अतिरिक्त मसीही उपाधि आरोपित किए सीधे व्यक्त करता है।
- source_word: ἀναστήσει
  choice: खड़ा करेगा
  rationale: भविष्यद्वक्ता को अपने लोगों में से उत्पन्न करने के लिए ἀνίστημι की चित्रात्मक भाषा और व्यवस्थाविवरण की प्रतिध्वनि सुरक्षित रहती है।
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: तुम्हारे भाइयों में से
  rationale: ἐκ समूह के भीतर से स्रोत को दिखाता है; ‘भाइयों’ से यहाँ साथी इस्राएली अभिप्रेत हैं।
- source_word: ὡς ἐμέ
  choice: मेरे समान
  rationale: यह मूसा और आने वाले भविष्यद्वक्ता के बीच स्पष्ट तुलनात्मक अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: व्यवस्थाविवरण 18:15 के उद्धरण का मसीही महत्व
  choice: मुख्य पाठ में ‘एक भविष्यद्वक्ता’
  alternative: ‘वह भविष्यद्वक्ता’
  rationale: प्रेरितों के काम में यह उद्धरण यीशु पर लागू होता है, फिर भी यूनानी Προφήτην यहाँ अनिश्चित है। अनुवाद उस मसीही संकेत को नकारता नहीं, पर उपाधि बनाकर व्याख्या को मूल शब्दों में नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘यह वही मूसा’ से वाक्य का पहचान-संबंधी जोर रखा गया है। उद्धरण में ‘खड़ा करेगा’ बाइबलीय चित्र को बनाए रखता है, जबकि पादटिप्पणियाँ शाब्दिक रूप और संदर्भगत अर्थ स्पष्ट करती हैं।
