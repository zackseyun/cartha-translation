  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘उठा ले चले’ वहनीय उपासना-सामग्री का भाव देता है; ‘निर्वासन में भेज दूँगा’ न्याय और जबरन विस्थापन दोनों को स्पष्ट करता है। विरामचिह्न यूनानी वाक्य की आरोपात्मक सूची और उसके बाद आने वाले दैवी न्याय को अलग करते हैं।
