source:
  edition: SBLGNT
  text: καὶ ἀνελάβετε τὴν σκηνὴν τοῦ Μολὸχ καὶ τὸ ἄστρον τοῦ ⸀θεοῦ ⸀Ῥαιφάν, τοὺς τύπους οὓς ἐποιήσατε προσκυνεῖν αὐτοῖς. καὶ μετοικιῶ ὑμᾶς ἐπέκεινα Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/043.yaml
  text: And you took up the tent of Moloch and the star of the god Rephan[a], the images that you made to worship them[c][b], and I will deport you beyond Babylon.
translation:
  language: hi
  text: और तुम मोलोख का तम्बू और देवता रैफान का तारा[a] उठा ले चले—वे प्रतिमाएँ[b] जिन्हें तुमने उनकी उपासना करने के लिए बनाया था। और मैं तुम्हें बाबुल के पार निर्वासन में भेज दूँगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आमोस 5:26 के इब्रानी स्रोत के अनुसार कुछ अनुवाद “तुम्हारे देवता रैफान” पढ़ते हैं। प्रेरितों के काम के यूनानी पाठ में “देवता रैफान” है।
    reason: source_variation
  - marker: b
    text: “प्रतिमाएँ” का अनुवाद “आकृतियाँ” या “प्रतिरूप” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: प्रेरितों के काम के यूनानी पाठ में “बाबुल के पार” है; आमोस 5:27 में यह वाक्य सामान्यतः “दमिश्क के पार” अनुवादित होता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἀνελάβετε
  choice: उठा ले चले
  rationale: यह क्रिया उठाने और साथ ढोने, दोनों का भाव रखती है; मूर्तिपूजक उपासना-सामग्री के संदर्भ में यह स्वाभाविक हिन्दी है और केवल उठाने तक अर्थ को सीमित नहीं करती।
- source_word: σκηνὴν
  choice: तम्बू
  rationale: σκηνή का सीधा अर्थ तम्बू है। ‘मन्दिर’ या ‘पवित्र तम्बू’ कहना व्याख्यात्मक होता और परमेश्वर के वैध पवित्र तम्बू से भ्रम पैदा कर सकता था।
- source_word: Μολὸχ
  choice: मोलोख
  rationale: यूनानी Μολόχ का देवनागरी लिप्यंतरण; इसे सामान्य संज्ञा बनाकर अनुवादित नहीं किया गया।
- source_word: ἄστρον
  choice: तारा
  rationale: ἄστρον का सामान्य अर्थ तारा है। संदर्भ में यह उपासना से जुड़ा तारकीय प्रतीक हो सकता है, पर मुख्य पाठ में उस व्याख्या को आरोपित नहीं किया गया।
- source_word: τοῦ θεοῦ Ῥαιφάν
  choice: रैफान देवता का
  rationale: प्रेरितों के काम के यूनानी पाठ में निश्चित पद के साथ ‘रैफान देवता’ है; आमोस के इब्रानी पाठ के ‘तुम्हारे देवता’ से इसका सामंजस्य नहीं बैठाया गया।
- source_word: τύπους
  choice: प्रतिमाएँ
  rationale: τύπος के रूप, आकृति या प्रतिरूप जैसे अर्थ हो सकते हैं। मूर्तिपूजा के इस संदर्भ में ‘प्रतिमाएँ’ स्पष्ट और स्वाभाविक है; व्यापक विकल्प पादटिप्पणी में रखा गया है।
- source_word: προσκυνεῖν αὐτοῖς
  choice: उनकी उपासना करने के लिए
  rationale: धार्मिक संदर्भ में προσκυνέω का आशय दण्डवत करने के साथ उपासना करना है। ‘उनकी’ का संदर्भ पूर्वोक्त प्रतिमाओं/पूज्य वस्तुओं से है।
- source_word: μετοικιῶ
  choice: निर्वासन में भेज दूँगा
  rationale: क्रिया जबरन स्थानांतरण या देशनिकाले का अर्थ देती है। यह हिन्दी ‘देश निकाला दूँगा’ की अपेक्षा अधिक स्वाभाविक ढंग से ऐतिहासिक निर्वासन का भाव व्यक्त करती है।
- source_word: ἐπέκεινα Βαβυλῶνος
  choice: बाबुल के पार
  rationale: ἐπέκεινα का अर्थ ‘के पार’ है और प्रेरितों के काम का पाठ स्पष्ट रूप से बाबुल कहता है। इसे आमोस के ‘दमिश्क’ के अनुसार नहीं बदला गया।
theological_decisions:
- issue: आमोस के स्रोत-पाठ और प्रेरितों के काम में निर्वासन के गंतव्य का अंतर
  choice: बाबुल के पार
  alternative: दमिश्क के पार
  rationale: SBLGNT में Βαβυλῶνος स्पष्ट है। मूल-भाषा की प्राथमिकता और पाठगत तनाव को बनाए रखने के लिए मुख्य पाठ में ‘बाबुल’ रखा गया तथा आमोस 5:27 का ‘दमिश्क’ पादटिप्पणी में बताया गया।
- issue: τοῦ θεοῦ Ῥαιφάν और आमोस के ‘तुम्हारे देवता’ के बीच अंतर
  choice: रैफान देवता का
  alternative: तुम्हारे देवता रैफान का
  rationale: प्रेरितों के काम का यूनानी पाठ ‘देवता रैफान’ पढ़ता है। आमोस के इब्रानी स्रोत से सामंजस्य करने के बजाय अंतर को पादटिप्पणी में सुरक्षित रखा गया।
