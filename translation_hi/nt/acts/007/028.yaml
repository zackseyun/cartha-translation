  text: क्या तू मुझे भी उसी तरह मार डालना चाहता है, जैसे तूने कल उस मिस्री को मार डाला था?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ... θέλεις
  choice: क्या ... चाहता है
  rationale: नकारात्मक प्रश्न को स्वाभाविक हिंदी प्रश्न के रूप में रखा गया है; प्रसंग में आरोप और आशंका का भाव स्पष्ट है।
- source_word: ἀνελεῖν / ἀνεῖλες
  choice: मार डालना / मार डाला था
  rationale: यहाँ क्रिया का अर्थ किसी को जान से मारना है; दोनों रूपों की पुनरावृत्ति हिंदी में भी सुरक्षित रखी गई है।
- source_word: ὃν τρόπον
  choice: उसी तरह ... जैसे
  rationale: तुलना के ढाँचे को स्पष्ट और स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἐχθὲς τὸν Αἰγύπτιον
  choice: कल उस मिस्री को
  rationale: ἐχθές का समय-सूचक अर्थ और निश्चित मिस्री व्यक्ति का संकेत दोनों सुरक्षित हैं।
