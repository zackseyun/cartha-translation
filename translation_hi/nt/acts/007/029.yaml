  footnotes:
  - marker: a
    text: या, “इस बात के कारण।” यूनानी पदावली उस बात को मूसा के भागने का तत्काल कारण बता सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “पराए देश में रहने वाला बन गया।” यह शब्द ऐसे व्यक्ति को दर्शाता है जो अपनी भूमि से बाहर किसी अन्य देश में रहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφυγεν
  choice: भाग गया
  rationale: यह φεύγω के अचानक भयवश चले जाने या पलायन करने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाता है; ‘और’ पिछले प्रसंग से सहज संबंध बनाए रखता है, जबकि कारणात्मक संबंध अगली पदावली से प्रकट होता है।
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: इस बात पर
  rationale: यह संक्षिप्त अभिव्यक्ति λόγος को ‘बात’ के रूप में रखती है और यूनानी पदावली में निहित अवसर तथा कारण—दोनों संभावनाओं को खुला छोड़ती है।
- source_word: ἐγένετο πάροικος
  choice: परदेशी बन गया
  rationale: πάροικος ऐसे व्यक्ति को दर्शाता है जो अपनी भूमि से बाहर किसी अन्य देश में रहता है। ‘परदेशी’ यह भाव सामान्य और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐν γῇ Μαδιάμ
  choice: मिद्यान देश में
  rationale: ‘देश’ γῇ के भौगोलिक भाव को स्पष्ट रूप से बनाए रखता है।
- source_word: οὗ
  choice: जहाँ
  rationale: यह स्थानवाचक सम्बन्धसूचक शब्द मिद्यान की ओर संकेत करता है।
- source_word: ἐγέννησεν υἱοὺς δύο
  choice: वह दो बेटों का पिता बना
  rationale: यह मूसा को क्रिया का कर्ता बनाए रखता है और जनन के पुरुष-केंद्रित भाव को सहज हिन्दी में व्यक्त करता है; ‘जना’ पुरुष कर्ता के साथ स्वाभाविक नहीं होता।
