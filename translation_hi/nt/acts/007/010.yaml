id: ACT.7.10
reference: Acts 7:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐξείλατο αὐτὸν ἐκ πασῶν τῶν θλίψεων αὐτοῦ, καὶ ἔδωκεν αὐτῷ χάριν καὶ σοφίαν ἐναντίον Φαραὼ βασιλέως Αἰγύπτου, καὶ κατέστησεν αὐτὸν ἡγούμενον ἐπ’ Αἴγυπτον ⸀καὶ ὅλον τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/010.yaml
  text: and rescued him from all his afflictions[a], and gave him favor and wisdom before Pharaoh king of Egypt[c][b], and appointed him ruler over Egypt and over all his household.
translation:
  language: hi
  text: और उसे उसके सब क्लेशों से छुड़ाया[a], और मिस्र के राजा फ़िरौन के सामने उसे कृपादृष्टि[b] और बुद्धि दी, और उसे मिस्र तथा फ़िरौन के पूरे घराने पर शासक नियुक्त किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी सब कठिनाइयों से बचाया।’
    reason: lexical_alternative
  - marker: b
    text: ‘कृपादृष्टि’ का अर्थ है कि फ़िरौन की दृष्टि यूसुफ के प्रति अनुकूल हुई; इसका अनुवाद ‘अनुग्रह’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उसे मिस्र और फ़िरौन के पूरे घराने का अधिकारी बनाया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξείλατο
  choice: छुड़ाया
  rationale: यहाँ मध्यम रूप संकट और दुःख से सक्रिय रूप से बचाने या मुक्त करने का भाव देता है; ‘छुड़ाया’ स्वाभाविक हिन्दी है।
- source_word: θλίψεων
  choice: क्लेशों
  rationale: यह यूसुफ द्वारा सहे गए दबाव, दुःख और कठिनाइयों को समेटता है तथा प्रसंग की गंभीरता बनाए रखता है।
- source_word: χάριν
  choice: कृपादृष्टि
  rationale: प्रसंग में इसका अर्थ फ़िरौन की अनुकूल दृष्टि या स्वीकृति है; ‘कृपादृष्टि’ इसे केवल धर्मशास्त्रीय ‘अनुग्रह’ बना देने से बचाती है।
- source_word: σοφίαν
  choice: बुद्धि
  rationale: यहाँ व्यावहारिक समझ और विवेक अभिप्रेत है, जिसे फ़िरौन ने यूसुफ में पहचाना।
- source_word: ἐναντίον
  choice: के सामने
  rationale: यह फ़िरौन की उपस्थिति अथवा दृष्टि में होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατέστησεν
  choice: नियुक्त किया
  rationale: यह किसी अधिकारपूर्ण पद पर स्थापित किए जाने को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἡγούμενον
  choice: शासक
  rationale: यह प्रशासन और अधिकार चलाने वाले व्यक्ति का व्यापक अर्थ सुरक्षित रखता है; ‘राज्यपाल’ अपेक्षाकृत अधिक विशिष्ट पदनाम होता।
- source_word: ἐπ’ Αἴγυπτον
  choice: मिस्र पर
  rationale: यह अधिकार के क्षेत्र को संक्षेप और ठीक रूप में व्यक्त करता है।
- source_word: ὅλον τὸν οἶκον αὐτοῦ
  choice: फ़िरौन के पूरे घराने
  rationale: οἶκος यहाँ केवल भवन नहीं, बल्कि फ़िरौन के गृहस्थ और प्रशासनिक प्रतिष्ठान को दर्शाता है। अस्पष्ट यूनानी सर्वनाम को हिन्दी में स्वाभाविक स्पष्टता के लिए ‘फ़िरौन’ से व्यक्त किया गया है।
theological_decisions:
- issue: पूरे पद में क्रियाओं का अंतर्निहित कर्ता
  choice: कर्ता को हिन्दी में भी अनुक्त रखा गया है, जो पिछले पद के परमेश्वर की ओर संकेत करता है।
  alternative: ‘परमेश्वर ने’ स्पष्ट रूप से जोड़ना।
  rationale: यूनानी पाठ में इस पद में परमेश्वर का नाम नहीं दोहराया गया, पर क्रियाएँ पिछले प्रसंग से उसी कर्ता को आगे बढ़ाती हैं। नाम न जोड़ना स्रोत की शैली और निहित संबंध दोनों को सुरक्षित रखता है।
- issue: αὐτοῦ का संदर्भ ‘पूरे घराने’ में
  choice: फ़िरौन के पूरे घराने
  alternative: उसके पूरे घराने
  rationale: व्याकरण और यूसुफ-कथा के प्रसंग में यह फ़िरौन के घराने को सूचित करता है। हिन्दी में केवल ‘उसके’ कहने से यूसुफ का घराना समझे जाने की प्रबल अस्पष्टता पैदा होती, इसलिए संदर्भ स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘फ़िरौन’, ‘क्लेश’, ‘कृपादृष्टि’ और ‘शासक’ सामान्य बाइबलीय पाठकों के लिए परिचित हैं, जबकि वाक्य-विन्यास वर्तमान हिन्दी में सहज रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
