  text: ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/055.yaml
  text: But being full of the Holy Spirit[a], he gazed into heaven and saw the glory of God, and Jesus standing at the right hand of God[b],
translation:
  language: hi
  text: परन्तु वह पवित्र आत्मा से परिपूर्ण था और उसने स्वर्ग की ओर टकटकी लगाकर देखा[a] और परमेश्वर की महिमा तथा यीशु को परमेश्वर की दाहिनी ओर खड़े देखा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्ग में एकटक देखा।”
    reason: lexical_alternative
  - marker: b
    text: “परमेश्वर की दाहिनी ओर” सर्वोच्च सम्मान और अधिकार के स्थान के लिए प्रयुक्त एक बाइबलीय मुहावरा है।
    reason: cross_reference
lexical_decisions:
- source_word: ὑπάρχων δὲ
  choice: परन्तु … होकर
  rationale: δέ पिछले प्रसंग की उग्र भीड़ और स्तिफनुस की आत्मा-परिपूर्ण अवस्था के बीच हल्का विरोध प्रकट करता है। ὑπάρχων उसकी जारी अवस्था बताता है; हिन्दी में ‘होकर’ इसे स्वाभाविक रूप से मुख्य क्रिया से जोड़ता है।
- source_word: πλήρης πνεύματος ἁγίου
  choice: पवित्र आत्मा से परिपूर्ण
  rationale: यह लूका-प्रेरितों में प्रचलित अभिव्यक्ति है। ‘से परिपूर्ण’ आधुनिक हिन्दी में स्वाभाविक है और आत्मा को केवल एक गुण या मनोदशा नहीं बनाता।
- source_word: ἀτενίσας εἰς τὸν οὐρανόν
  choice: स्वर्ग की ओर टकटकी लगाई
  rationale: ἀτενίζω ध्यानपूर्वक और लगातार देखने का भाव देता है। दर्शन के इस प्रसंग में οὐρανός का आशय केवल आकाश नहीं, स्वर्ग है; ‘की ओर’ हिन्दी में दिशा को सहज रूप से व्यक्त करता है।
- source_word: εἶδεν δόξαν θεοῦ
  choice: परमेश्वर की महिमा को … देखा
  rationale: εἶδεν का सीधा आधुनिक रूप ‘देखा’ है और δόξαν θεοῦ को संबंधसूचक हिन्दी रचना में स्पष्ट रखा गया है।
- source_word: Ἰησοῦν ἑστῶτα
  choice: यीशु को … खड़ा देखा
  rationale: ἑστῶτα यीशु की खड़ी हुई मुद्रा का सजीव वर्णन करता है। हिन्दी की ‘को … खड़ा देखा’ रचना कृदन्त और मुख्य क्रिया के संबंध को स्वाभाविक रूप से बनाए रखती है।
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: परमेश्वर की दाहिनी ओर
  rationale: ἐκ δεξιῶν यहाँ स्थान और प्रतिष्ठा बताने वाला बाइबलीय मुहावरा है। ‘दाहिनी ओर’ शाब्दिक चित्र को बनाए रखते हुए हिन्दी में स्पष्ट है।
theological_decisions:
- issue: πνεύματος ἁγίου का स्वरूप
  choice: पवित्र आत्मा
  alternative: पवित्र आत्मा/पवित्र आत्मिक सामर्थ्य को सामान्य गुण के रूप में समझना
  rationale: लूका-प्रेरितों के प्रयोग और निकट प्रसंग में यह विशिष्ट दिव्य आत्मा का उल्लेख है। हिन्दी में प्रचलित नाम ‘पवित्र आत्मा’ पाठ से आगे कोई अतिरिक्त व्याख्या जोड़े बिना यह संदर्भ बनाए रखता है।
- issue: परमेश्वर की दाहिनी ओर खड़े यीशु का दर्शन
  choice: यीशु को परमेश्वर की दाहिनी ओर खड़ा देखा
  alternative: यीशु को परमेश्वर के दाहिने से खड़ा हुआ देखा
  rationale: यह रूप परमेश्वर और यीशु के बीच पाठ में उपस्थित भेद तथा यीशु की प्रतिष्ठित स्थिति—दोनों को बनाए रखता है। ‘खड़ा’ को किसी विशेष सिद्धान्तगत कारण से समझाने के बजाय उसकी वास्तविक मुद्रा के रूप में अनिर्णीत छोड़ा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘टकटकी लगाई’ ἀτενίσας की तीव्रता व्यक्त करता है, जबकि फुटनोट अधिक सीधा विकल्प देता है। दोनों फुटनोट-चिह्न संबंधित मुख्य-पाठ वाक्यांशों के तुरंत बाद रखे गए हैं।
