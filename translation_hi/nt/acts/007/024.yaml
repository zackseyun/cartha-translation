  text: καὶ ἰδών τινα ἀδικούμενον ἠμύνατο καὶ ἐποίησεν ἐκδίκησιν τῷ καταπονουμένῳ πατάξας τὸν Αἰγύπτιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/024.yaml
  text: And when he saw someone being wronged[b][a], he defended him and brought justice for the one being oppressed by striking down the Egyptian.
translation:
  language: hi
  text: जब उसने किसी के साथ अन्याय होते देखा, तो उसने उसकी रक्षा की और उस सताए जा रहे व्यक्ति का बदला लिया,[a] मिस्री पर प्रहार करके।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस सताए जा रहे व्यक्ति को न्याय दिलाया।” यूनानी पदबंध का अर्थ किसी का बदला लेना अथवा उसके पक्ष में न्याय करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: व्यापक संदर्भ के अनुसार इस प्रहार से मिस्री की मृत्यु हुई; यूनानी क्रिया का सामान्य अर्थ “प्रहार करना” या “मारना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδών
  choice: जब उसने ... देखा
  rationale: अओरिस्ट कृदन्त को मुख्य क्रियाओं की परिस्थिति बताने वाले स्वाभाविक कालवाचक उपवाक्य के रूप में व्यक्त किया गया है।
- source_word: τινα ἀδικούμενον
  choice: किसी के साथ अन्याय होते
  rationale: अनिश्चित सर्वनाम की अनिश्चितता बनाए रखते हुए ἀδικέω के नैतिक अन्याय के भाव को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ἠμύνατο
  choice: वह उसकी रक्षा में आया
  rationale: मध्यवाच्य क्रिया पीड़ित की सहायता और उसके बचाव में हस्तक्षेप करने का अर्थ देती है; यह हिन्दी प्रयोग उस सक्रिय हस्तक्षेप को सुरक्षित रखता है।
- source_word: ἐποίησεν ἐκδίκησιν
  choice: बदला चुकाया
  rationale: यह यूनानी पदबंध प्रतिशोध लेने अथवा पीड़ित को न्याय दिलाने—दोनों का भाव रख सकता है। मुख्य पाठ में अधिक सीधा प्रतिशोधात्मक अर्थ रखा गया और वैकल्पिक न्यायपरक अर्थ टिप्पणी में दिया गया है।
- source_word: τῷ καταπονουμένῳ
  choice: उस सताए जा रहे व्यक्ति के लिए
  rationale: वर्तमान कर्मवाच्य कृदन्त लगातार कठोर व्यवहार सहने का संकेत देता है; सम्प्रदान कारक को लाभार्थक ‘के लिए’ से व्यक्त किया गया है।
- source_word: πατάξας τὸν Αἰγύπτιον
  choice: मिस्री को मारा
  rationale: πατάσσω का मूल अर्थ प्रहार करना या मारना है। संदर्भ में मृत्यु हुई, पर क्रिया स्वयं अनिवार्यतः ‘मार डालना’ नहीं कहती, इसलिए परिणाम को पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: मूसा के कार्य में ἐκδίκησις का भाव
  choice: मुख्य पाठ में ‘बदला चुकाया’, साथ में ‘न्याय दिलाया’ का विकल्प
  alternative: उस सताए जा रहे व्यक्ति को न्याय दिलाया
  rationale: संज्ञा में प्रतिशोध और न्यायपूर्ण प्रतिकार अथवा निर्दोष-ठहराने, दोनों की अर्थ-सम्भावना है। मुख्य पाठ स्रोत के तीखे प्रतिशोधात्मक भाव को दबाता नहीं, जबकि टिप्पणी न्यायपरक सम्भावना सुरक्षित रखती है; इससे मूसा के निजी हिंसक कार्य के धर्मसैद्धान्तिक अनुमोदन का दावा भी नहीं जोड़ा जाता।
- issue: मिस्री पर प्रहार का घातक परिणाम
  choice: मिस्री को मारा
  alternative: मिस्री को मार डाला
  rationale: निर्गमन 2 के व्यापक संदर्भ में मिस्री की मृत्यु स्पष्ट है, किन्तु इस पद की यूनानी क्रिया का शाब्दिक अर्थ ‘प्रहार करना/मारना’ है। अतः मुख्य पाठ शब्दार्थ की सीमा रखता है और टिप्पणी संदर्भगत घातक परिणाम बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘रक्षा में आया’ सक्रिय हस्तक्षेप दर्शाता है। दोनों टिप्पणी-चिह्न मुख्य पाठ में सम्बद्ध पदों के तुरंत बाद दिए गए हैं।
