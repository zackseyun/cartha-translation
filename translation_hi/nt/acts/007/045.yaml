revisions:
- from: उसे हमारे पूर्वजों ने उत्तराधिकार में पाकर यहोशू[a] के साथ उस समय भीतर पहुँचाया, जब उन्होंने उन जातियों के देश पर अधिकार किया जिन्हें परमेश्वर ने हमारे पूर्वजों के सामने से निकाल दिया था। वह दाऊद के दिनों तक वहीं रहा।
  to: जिसे हमारे पूर्वजों ने उत्तराधिकार में पाकर यहोशू[a] के साथ उस देश में ले आए, जब उन्होंने उन जातियों के देश पर अधिकार किया जिन्हें परमेश्वर ने हमारे पूर्वजों के सामने से निकाल दिया था। वह दाऊद के दिनों तक रहा।
  rationale: The revision retains the inherited-custody sense of διαδεξάμενοι and the historically required identification of Joshua. It replaces the vague ‘भीतर’ with ‘उस देश में,’ makes the possession phrase natural in Hindi while preserving its conquest context, and removes the unrepresented locative ‘वहीं.’ The final short sentence retains the intended continuity through David’s days without importing a specific location.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:57:26Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Joshua and conveys succession, but ‘भीतर पहुँचाया’ leaves the destination unspecified, while the added ‘वहीं’ is unsupported. The final sentence also makes explicit an implication of the Greek rather than retaining the verse’s concise temporal linkage; a restrained explicit rendering is preferable in Hindi.
  naturalness: ‘उत्तराधिकार में पाकर’ is understandable and suitably formal. ‘उस समय भीतर पहुँचाया’ is less idiomatic because Hindi readers need the contextual destination stated. ‘उन जातियों के देश पर अधिकार करते समय’ is clear and naturally conveys the land-conquest setting.
  terminology: ‘पूर्वज,’ ‘यहोशू,’ ‘परमेश्वर,’ and ‘जातियाँ’ are appropriate modern-standard Hindi biblical terms. The Joshua footnote is accurate and useful.
  issues:
  - severity: medium
    issue: ‘भीतर पहुँचाया’ does not adequately express εἰσήγαγον in its contextual setting.
    rationale: The tabernacle is brought into the land during the conquest; ‘देश में ले आए’ supplies the necessary contextual destination without changing the sense.
  - severity: medium
    issue: ‘वह दाऊद के दिनों तक वहीं रहा’ adds the unsupported locative ‘वहीं.’
    rationale: The Greek has no corresponding locative. The continuing presence of the tabernacle may be expressed, but not as remaining specifically ‘there.’
  - severity: low
    issue: The conquest phrase can be more directly and idiomatically tied to the nations’ land.
    rationale: ‘उन जातियों के देश पर अधिकार करते समय’ avoids suggesting that the fathers took possession of the peoples themselves, while preserving the contextual sense of κατάσχεσις τῶν ἐθνῶν.
  revised_text: जिसे हमारे पूर्वजों ने उत्तराधिकार में पाकर यहोशू[a] के साथ उस देश में ले आए, जब उन्होंने उन जातियों के देश पर अधिकार किया जिन्हें परमेश्वर ने हमारे पूर्वजों के सामने से निकाल दिया था। वह दाऊद के दिनों तक रहा।
