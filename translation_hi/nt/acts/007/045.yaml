reference: Acts 7:45
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἣν καὶ εἰσήγαγον διαδεξάμενοι οἱ πατέρες ἡμῶν μετὰ Ἰησοῦ ἐν τῇ κατασχέσει τῶν ἐθνῶν ὧν ἐξῶσεν ὁ θεὸς ἀπὸ προσώπου τῶν πατέρων ἡμῶν ἕως τῶν ἡμερῶν Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/045.yaml
  text: which our fathers in turn brought in with Joshua at the dispossession of the nations that God drove out from before our fathers[b][a], until the days of David.
translation:
  language: hi
  text: जिसे हमारे पूर्वजों ने उत्तराधिकार में पाकर यहोशू[a] के साथ उस देश में ले आए, जब उन्होंने उन जातियों के देश पर अधिकार किया जिन्हें परमेश्वर ने हमारे पूर्वजों के सामने से निकाल दिया था। वह दाऊद के दिनों तक रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘यीशु के साथ’; Ἰησοῦς नाम यीशु या यहोशू—दोनों के लिए प्रयुक्त हो सकता है। यहाँ नून का पुत्र यहोशू अभिप्रेत है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: उसे
  rationale: स्त्रीलिंग एकवचन संबंधवाचक सर्वनाम पिछले पद के ‘साक्षी के तंबू’ की ओर संकेत करता है। हिंदी में वाक्य की स्वाभाविकता के लिए इसका अनुवाद ‘उसे’ किया गया है।
- source_word: εἰσήγαγον
  choice: भीतर पहुँचाया
  rationale: εἰσάγω का अर्थ भीतर लाना या ले जाना है; तंबू जैसी वस्तु के संदर्भ में ‘भीतर पहुँचाया’ सहज और स्पष्ट है।
- source_word: διαδεξάμενοι
  choice: उत्तराधिकार में पाकर
  rationale: कृदंत पूर्ववर्तियों से क्रमशः प्राप्त करने और पीढ़ीगत उत्तराधिकार का भाव व्यक्त करता है; इसे केवल ‘बारी-बारी’ कहने के बजाय प्राप्ति का अर्थ भी स्पष्ट रखा गया है।
- source_word: οἱ πατέρες ἡμῶν
  choice: हमारे पूर्वजों
  rationale: आधुनिक हिंदी में ‘पूर्वज’ covenant-historical ancestral reference को स्वाभाविक ढंग से व्यक्त करता है और पद में इसकी पुनरावृत्ति बनाए रखता है।
- source_word: μετὰ Ἰησοῦ
  choice: यहोशू[a] के साथ
  rationale: Ἰησοῦς यूनानी में यीशु और यहोशू दोनों का नाम हो सकता है; मूसा के बाद देश में प्रवेश के ऐतिहासिक संदर्भ में नून के पुत्र यहोशू अभिप्रेत हैं।
- source_word: ἐν τῇ κατασχέσει τῶν ἐθνῶν
  choice: जब उन्होंने उन जातियों के देश पर अधिकार किया
  rationale: κατάσχεσις अधिकार या कब्जा प्राप्त करने को दर्शाता है। संबंधवाचक उपवाक्य में जातियों को निकाले जाने का उल्लेख होने के कारण हिंदी में ‘उन जातियों के देश’ कहने से आशय स्पष्ट होता है, बिना जातियों को स्वयं अधिकार की वस्तु बनाने के।
- source_word: ὧν ἐξῶσεν ὁ θεὸς
  choice: जिन्हें परमेश्वर ने ... निकाल दिया था
  rationale: ἐξωθέω बलपूर्वक बाहर निकालने या खदेड़ने का अर्थ देता है; ‘निकाल दिया’ वर्तमान हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: ἀπὸ προσώπου τῶν πατέρων ἡμῶν
  choice: हमारे पूर्वजों के सामने से
  rationale: सेमिटिक मुहावरे ‘मुख के सामने से’ का अर्थ उनकी उपस्थिति या मार्ग से हटाना है; ‘के सामने से’ बाइबलीय रंग और पठनीयता दोनों रखता है।
- source_word: ἕως τῶν ἡμερῶν Δαυίδ
  choice: वह दाऊद के दिनों तक वहीं रहा
  rationale: यूनानी में ‘दाऊद के दिनों तक’ पूर्ववर्ती मुख्य कथन से जुड़ा है। हिंदी में अस्पष्ट लटकते काल-वाक्यांश से बचने और तंबू की निरंतर उपस्थिति का आशय व्यक्त करने के लिए निहित कर्ता और क्रिया स्पष्ट किए गए हैं।
theological_decisions:
- issue: Ἰησοῦ का संदर्भ
  choice: यहोशू
  alternative: यीशु
  rationale: नाम का यूनानी रूप दोनों के लिए समान है, पर मूसा के बाद कनान में प्रवेश का प्रसंग नून के पुत्र यहोशू को निश्चित करता है। पाठगत तथ्य को पादटिप्पणी में बताया गया है ताकि मूल रूप की द्वि-संदर्भी क्षमता छिपे नहीं।
- issue: διαδεξάμενοι का बल
  choice: पूर्वजों ने तंबू को उत्तराधिकार में पाकर भीतर पहुँचाया
  alternative: पूर्वज उसे अपनी बारी में भीतर ले आए
  rationale: कृदंत में क्रमिक प्राप्ति/उत्तराधिकार का भाव है। मुख्य पाठ में इस अर्थ को स्पष्ट रखने से पीढ़ियों के बीच तंबू की निरंतरता सुरक्षित रहती है।
- issue: ἕως τῶν ἡμερῶν Δαυίδ का संबंध
  choice: तंबू की उपस्थिति दाऊद के दिनों तक रही
  alternative: जातियों को निकालने की प्रक्रिया दाऊद के दिनों तक चली
  rationale: वाक्यरचना में अंतिम काल-वाक्यांश के जुड़ाव में कुछ सतही अस्पष्टता संभव है, पर अगले पद में दाऊद का तंबू के लिए स्थायी निवास खोजने की इच्छा बताई गई है; इससे तंबू की निरंतरता प्रमुख संदर्भ बनती है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘पितरों’ की अपेक्षा ‘पूर्वजों’ और कृत्रिम संज्ञात्मक पदबंध की अपेक्षा स्वाभाविक कालवाचक उपवाक्य चुना गया है।
