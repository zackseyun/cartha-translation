source:
  edition: SBLGNT
  text: καὶ ἔδωκεν αὐτῷ διαθήκην περιτομῆς· καὶ οὕτως ἐγέννησεν τὸν Ἰσαὰκ καὶ περιέτεμεν αὐτὸν τῇ ἡμέρᾳ τῇ ὀγδόῃ, ⸀καὶ Ἰσαὰκ τὸν Ἰακώβ, ⸁καὶ Ἰακὼβ τοὺς δώδεκα πατριάρχας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/008.yaml
  text: And he gave him the covenant of circumcision. And so he fathered Isaac and circumcised him on the eighth day, and Isaac fathered Jacob, and Jacob the twelve patriarchs.
translation:
  language: hi
  text: और परमेश्वर ने उसे खतने की वाचा दी। और इस प्रकार अब्राहम इसहाक का पिता हुआ और उसने आठवें दिन उसका खतना किया; इसहाक याकूब का पिता हुआ, और याकूब बारह कुलपिताओं का पिता हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκην περιτομῆς
  choice: खतने की वाचा
  rationale: यह पद उत्पत्ति 17 की विशिष्ट वाचा की ओर संकेत करता है; संबंधकारक पदबंध वाचा को खतने से चिह्नित वाचा के रूप में परिभाषित करता है। हिंदी में ‘खतने की वाचा’ संक्षिप्त, स्वाभाविक और बाइबलीय संदर्भ में स्पष्ट है।
- source_word: οὕτως
  choice: तब
  rationale: यह पिछले वाक्य से अगले घटनाक्रम का संबंध बनाए रखता है। यहाँ ‘तब’ आधुनिक हिंदी में स्वाभाविक है और क्रम/परिणाम की शक्ति को अनावश्यक रूप से कठोर नहीं बनाता।
- source_word: ἐγέννησεν
  choice: से … उत्पन्न हुआ/हुए
  rationale: यूनानी क्रिया पुरुष-विषयक वंशोत्पत्ति बताती है। हिंदी में ‘फलाँ से फलाँ उत्पन्न हुआ’ वंशावली के लिए गरिमापूर्ण और सहज है; इससे कृत्रिम या प्राचीन ‘जन्माया’ से बचा गया है।
- source_word: περιέτεμεν
  choice: खतना किया
  rationale: यह περιτέμνω का मानक और स्पष्ट हिंदी रूप है तथा वाचागत शारीरिक क्रिया को ठीक व्यक्त करता है।
- source_word: τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: आठवें दिन
  rationale: संबंधित दिन का कालवाचक अर्थ सीधे और स्वाभाविक रूप से व्यक्त होता है; ‘जन्म के बाद’ जैसे शब्द मूल में स्पष्ट रूप से नहीं जोड़े गए हैं।
- source_word: πατριάρχας
  choice: कुलपिता
  rationale: यह इस्राएल के बारह गोत्रों के संस्थापक पूर्वजों के लिए स्थापित बाइबलीय अर्थ को सुरक्षित रखता है और सामान्य ‘पूर्वज’ की अपेक्षा पद की विशिष्टता व्यक्त करता है।
- source_word: Ἰσαὰκ / Ἰακώβ
  choice: इसहाक / याकूब
  rationale: हिंदी बाइबल-परंपरा में प्रचलित और पाठकों के लिए पहचाने जाने योग्य नाम-रूप अपनाए गए हैं।
theological_decisions:
- issue: अब्राहम को दी गई वाचा की विशिष्टता
  choice: ‘खतने की वाचा’
  alternative: ‘खतने की एक वाचा’ अथवा ‘खतने से चिह्नित वाचा’
  rationale: संदर्भ उत्पत्ति 17 में अब्राहम को दी गई पहचानी हुई वाचा का है। हिंदी संबंधकारक रचना बिना अतिरिक्त व्याख्या जोड़े इस विशिष्ट संबंध को व्यक्त करती है।
- issue: γεννάω का वंशावलीगत अर्थ
  choice: ‘से … उत्पन्न हुआ/हुए’
  alternative: ‘जन्माया’ अथवा ‘का पिता बना’
  rationale: चुना गया रूप पुरुष-वंशावली के आशय को बनाए रखता है, पर आधुनिक हिंदी में असहज या अत्यधिक शाब्दिक अभिव्यक्ति से बचता है।
- issue: οὕτως का संबंध
  choice: ‘तब’ द्वारा घटनाक्रम से जोड़ना
  alternative: ‘इस प्रकार’ अथवा ‘और इस तरह’
  rationale: οὕτως में ढंग, क्रम या परिणाम की कुछ लचक है। ‘तब’ संदर्भ में स्वाभाविक क्रम व्यक्त करता है, बिना किसी विशेष धर्मवैज्ञानिक कारण-संबंध को अधिक निश्चित किए।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सहज। ‘परमेश्वर’ को स्पष्ट कर्ता के रूप में दोहराया गया है क्योंकि हिंदी में केवल ‘उसने’ कहने पर पिछले पद के संदर्भ के बिना अस्पष्टता हो सकती है। वंशावली में अर्थ की स्पष्टता के लिए अब्राहम का नाम जोड़ा गया है; यूनानी सर्वनाम का संदर्भ वही है। कोई पादटिप्पणी आवश्यक नहीं।
