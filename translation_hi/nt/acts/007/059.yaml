  text: और वे स्तिफनुस को पत्थर मार रहे थे, जब वह प्रभु यीशु को पुकारकर कह रहा था[a], “हे प्रभु यीशु, मेरी आत्मा को ग्रहण कर।”
  philosophy: optimal-equivalence
  footnotes:
