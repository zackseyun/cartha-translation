    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθοβόλουν
  choice: पत्थर बरसाते रहे
  rationale: अपूर्णकाल चल रही और बार-बार हो रही क्रिया को व्यक्त करता है; यह प्रयोग स्वाभाविक हिन्दी में उस निरंतर हिंसक कार्रवाई को स्पष्ट करता है।
- source_word: ἐπικαλούμενον
  choice: प्रभु को पुकारते हुए
  rationale: कृदंत स्तिफनुस के यीशु से सीधे प्रार्थनापूर्वक विनती करने को दर्शाता है। ‘पुकारते हुए’ सहज है, और कर्म ‘प्रभु को’ संदर्भ से स्पष्ट किया गया है।
- source_word: λέγοντα
  choice: कह रहा था
  rationale: ἐπικαλούμενον के साथ समन्वित कृदंत को हिन्दी में चल रही क्रिया के रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: Κύριε Ἰησοῦ
  choice: हे प्रभु यीशु
  rationale: सीधे संबोधन, आदर और पाठ के मसीह-संबंधी महत्व को सुरक्षित रखता है। ‘हे’ हिन्दी में गंभीर प्रार्थनात्मक संबोधन को स्पष्ट करता है।
- source_word: δέξαι
  choice: ग्रहण कर
  rationale: आज्ञार्थक रूप में की गई गंभीर विनती को व्यक्त करता है और मृत्यु के समय स्वयं को प्रभु को सौंपने का भाव बनाए रखता है।
- source_word: τὸ πνεῦμά μου
  choice: मेरी आत्मा
  rationale: इस प्रसंग में πνεῦμα व्यक्ति की आत्मा को सूचित करता है, जिसे स्तिफनुस मृत्यु के समय यीशु को सौंपता है; ‘आत्मा’ आधुनिक हिन्दी में स्पष्ट और स्थापित शब्द है।
theological_decisions:
- issue: क्या स्तिफनुस के यीशु-संबोधन को प्रार्थना अथवा आह्वान के रूप में स्पष्ट किया जाए
  choice: ‘प्रभु को पुकारते हुए’ तथा सीधा संबोधन ‘हे प्रभु यीशु’
  alternative: ‘पुकारते हुए’ या ‘आह्वान करते हुए’, बिना कर्म को स्पष्ट किए
  rationale: यूनानी पाठ में स्तिफनुस सीधे यीशु से कहता है, ‘प्रभु यीशु, मेरी आत्मा को ग्रहण कर।’ ἐπικαλούμενον में प्रार्थनापूर्वक पुकारने या आह्वान करने का अर्थ हो सकता है। अनुवाद इसे अस्पष्ट नहीं करता, पर पाठ से आगे कोई सिद्धान्त भी नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पत्थर बरसाते रहे’ अपूर्णकाल की निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ग्रहण कर’ प्रार्थना की गंभीरता बनाए रखता है।
