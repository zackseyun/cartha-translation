id: ACT.7.56
reference: Acts 7:56
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς ⸀διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/056.yaml
  text: And he said[a], “Look, I see the heavens opened[b], and the Son of Man standing at the right hand of God.”
translation:
  language: hi
  text: और उसने कहा, “देखो, मैं स्वर्गों को खुले हुए[a] और मनुष्य के पुत्र[b] को परमेश्वर की दाहिनी ओर खड़ा देख रहा हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में पूर्णकालिक कर्मवाच्य कृदंत है, जिसका भाव है कि स्वर्ग खोले जा चुके हैं और स्तिफनुस के दर्शन में खुले हुए हैं।
    reason: lexical_alternative
  - marker: b
    text: “मनुष्य का पुत्र” एक मान्य मसीही उपाधि है, जो दानिय्येल 7:13 की प्रतिध्वनि करती है।
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: देखो
  rationale: ध्यान खींचने वाले उद्गार और स्तिफनुस के कथन की तात्कालिकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: θεωρῶ
  choice: मैं ... देख रहा हूँ
  rationale: वर्तमान काल में जारी प्रत्यक्ष दर्शन को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: τοὺς οὐρανοὺς
  choice: स्वर्गों को
  rationale: यूनानी के बहुवचन को बनाए रखता है और दर्शन के धार्मिक संदर्भ को ‘आकाशों’ की अपेक्षा अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: διηνοιγμένους
  choice: खुले हुए
  rationale: पूर्णकालिक कर्मवाच्य कृदंत से प्रकट उस परिणामी अवस्था को रखता है जिसमें स्वर्ग खोले जा चुके हैं और खुले हैं।
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: मान्य मसीही उपाधि का शाब्दिक रूप बनाए रखता है और दानिय्येल 7:13 से उसका संबंध सुरक्षित करता है; ‘को’ के कारण वाक्य में संबंधकारक रूप आया है।
- source_word: ἐκ δεξιῶν
  choice: दाहिनी ओर
  rationale: सम्मान और अधिकार के स्थान को व्यक्त करने वाले यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है।
- source_word: ἑστῶτα
  choice: खड़ा
  rationale: मूल पाठ में वर्णित खड़ी मुद्रा को स्पष्ट रूप से बनाए रखता है और ‘बैठे’ होने वाले अन्य कथनों से इसका भेद नहीं मिटाता।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर की
  rationale: ἐκ δεξιῶν के साथ संबंध को हिन्दी के स्वाभाविक ‘परमेश्वर की दाहिनी ओर’ में व्यक्त करता है।
theological_decisions:
- issue: υἱὸς τοῦ ἀνθρώπου की मसीही उपाधि
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र / वह मनुष्य
  rationale: पारंपरिक शाब्दिक उपाधि यूनानी अभिव्यक्ति तथा दानिय्येल 7 की प्रतिध्वनि को सुरक्षित रखती है; अधिक व्याख्यात्मक विकल्प इस मान्य उपाधि को कमजोर कर सकते हैं।
- issue: महिमान्वित यीशु की मुद्रा
  choice: परमेश्वर की दाहिनी ओर खड़ा
  alternative: परमेश्वर की दाहिनी ओर विराजमान
  rationale: पाठ स्पष्ट रूप से ‘खड़ा’ कहता है। इसे अधिक प्रचलित ‘बैठा/विराजमान’ कथनों के अनुरूप बदलना मूल की विशिष्टता और धार्मिक तनाव को मिटा देता।
- issue: स्वर्गों के खुले होने की अवस्था
  choice: खुले हुए
  alternative: खुलते हुए
  rationale: पूर्णकालिक कर्मवाच्य कृदंत किसी चल रही खुलने की क्रिया के बजाय खोले जाने से उत्पन्न वर्तमान अवस्था बताता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘देखो’ उद्गार की तात्कालिकता रखता है; ‘स्वर्गों’ से यूनानी बहुवचन बचता है; वाक्य-रचना मूल के समान प्रत्यक्ष दर्शन और दोनों कर्मों—स्वर्गों तथा मनुष्य के पुत्र—को एक ही ‘देख रहा हूँ’ से जोड़ती है।
