id: ACT.7.49
reference: Acts 7:49
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὁ οὐρανός μοι θρόνος, ⸂ἡ δὲ⸃ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/049.yaml
  text: Heaven is my throne[a], and the earth is the footstool for my feet. What kind of house will you build for me, says the Lord, or what is the place of my rest?
translation:
  language: hi
  text: “स्वर्ग मेरा सिंहासन है, और पृथ्वी मेरे पाँवों की चौकी है। तुम मेरे लिए कैसा भवन बनाओगे,” प्रभु कहता है, “या मेरे विश्राम का स्थान कौन-सा है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρανός
  choice: स्वर्ग
  rationale: पृथ्वी के साथ ब्रह्मांडीय विरोध में यह केवल दिखाई देने वाले आकाश को नहीं, बल्कि स्वर्गीय क्षेत्र को सूचित करता है।
- source_word: θρόνος
  choice: सिंहासन
  rationale: राजकीय शासन के आसन का पारदर्शी रूपक सीधे बनाए रखा गया है।
- source_word: γῆ
  choice: पृथ्वी
  rationale: स्वर्ग के समानांतर इसका अर्थ किसी सीमित भूभाग के बजाय पूरी पृथ्वी है।
- source_word: ὑποπόδιον τῶν ποδῶν μου
  choice: मेरे पाँवों की चौकी
  rationale: यूनानी पदबंध में उपस्थित ‘पाँव’ और चौकी के चित्र, दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ποῖον οἶκον
  choice: कैसा भवन
  rationale: ποῖον प्रकार या गुण पूछता है; ‘कैसा’ उस आलंकारिक प्रश्न को सहज हिन्दी में व्यक्त करता है। οἶκον को संदर्भ के आधार पर ‘मन्दिर’ बनाकर अधिक स्पष्ट नहीं किया गया।
- source_word: οἰκοδομήσετέ
  choice: बनाओगे
  rationale: भविष्यत्कालीन आलंकारिक प्रश्न का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: κύριος
  choice: प्रभु
  rationale: नए नियम के यूनानी κύριος का मानक धार्मिक हिन्दी पर्याय है और उद्धरण में परमेश्वर के वचन का संकेत बनाए रखता है।
- source_word: τόπος τῆς καταπαύσεώς μου
  choice: मेरे विश्राम का स्थान
  rationale: यूनानी संबंधवाचक रचना को निकटता से रखता है और ‘विश्राम’ की धर्मवैचारिक प्रतिध्वनि को बिना विस्तार के सुरक्षित करता है।
theological_decisions:
- issue: यशायाह के उद्धरण में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: प्रस्तुत नए नियम का मूल पाठ κύριος है; इसलिए पुराने नियम के संभावित इब्रानी आधार को सीधे पाठ में प्रतिस्थापित किए बिना ‘प्रभु’ रखा गया है।
- issue: οἶκος का मन्दिर-संदर्भ
  choice: भवन
  alternative: मन्दिर
  rationale: संदर्भ मन्दिर की ओर संकेत करता है, पर यूनानी पाठ सामान्य शब्द ‘घर/भवन’ का प्रयोग करता है। ‘भवन’ उस संकेत को खुला रखता है और व्याख्या को अनुवाद में नहीं मिलाता।
- issue: ‘मेरे विश्राम का स्थान’ का अर्थ
  choice: शाब्दिक रूप से खुला रखा गया
  alternative: मेरा निवास-स्थान
  rationale: ‘विश्राम’ को ‘निवास’ में बदलने से मूल की धर्मवैचारिक व्यापकता और तनाव सीमित हो सकता था।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण पर सामान्य पाठक के लिए सहज है। ‘पाँवों’ को अत्यधिक संस्कृतनिष्ठ ‘चरणों’ पर प्राथमिकता दी गई है। यूनानी में ‘प्रभु कहता है’ पहले प्रश्न के बाद आता है; स्वाभाविक हिन्दी उद्धरण-रचना के लिए इसे दोनों प्रश्नों से पहले रखा गया है, अर्थ और वक्ता की पहचान बदले बिना।
