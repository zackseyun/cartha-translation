  text: पर जो अपने पड़ोसी के साथ अन्याय कर रहा था, उसने मूसा को धक्का देकर दूर कर दिया[a] और कहा, “तुम्हें किसने हमारे ऊपर शासक और न्यायाधीश ठहराया?”
