  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली। ‘मूसा को’ स्पष्टता के लिए रखा गया है, क्योंकि हिन्दी में ‘उसने उसे’ से दोनों पुरुषों का संदर्भ भ्रमित हो सकता है। उद्धरण में अधिकार को चुनौती देने वाला तीखा प्रश्न सुरक्षित रखा गया है।
