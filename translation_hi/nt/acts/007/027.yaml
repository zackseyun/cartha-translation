    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶν
  choice: अन्याय कर रहा था
  rationale: वर्तमान कृदंत की जारी क्रिया और ἀδικέω में निहित अन्याय का भाव दोनों सुरक्षित रहते हैं।
- source_word: πλησίον
  choice: पड़ोसी
  rationale: यह निकटवर्ती या साथी व्यक्ति के मानक अर्थ को बनाए रखता है और संदर्भ से परे जाकर ‘संगी इस्राएली’ नहीं जोड़ता।
- source_word: ἀπώσατο
  choice: धक्का देकर दूर कर दिया
  rationale: मध्यवाच्य एओरिस्ट की बलपूर्वक शारीरिक अथवा तिरस्कारपूर्ण अस्वीकृति को ठोस और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αὐτόν
  choice: मूसा को
  rationale: हिन्दी में सर्वनाम-संदर्भ की अस्पष्टता से बचने के लिए पूर्ववर्ती प्रसंग से स्पष्ट व्यक्ति का नाम रखा गया है; कोई नई सूचना नहीं जोड़ी गई।
- source_word: κατέστησεν
  choice: ठहराया
  rationale: किसी को अधिकारपूर्ण पद पर स्थापित या नियुक्त करने का कारक अर्थ देता है और हिन्दी बाइबलीय गद्य में स्वाभाविक है।
- source_word: ἄρχοντα
  choice: शासक
  rationale: राजकीय और अधिकार-संबंधी अर्थ का सीधा, आधुनिक हिन्दी समतुल्य है।
- source_word: δικαστήν
  choice: न्यायी
  rationale: निर्णय करने वाले अधिकारी का अर्थ रखता है और ‘शासक’ के साथ पद-संज्ञा के रूप में सहज बैठता है।
- source_word: ἐφ’ ἡμῶν
  choice: हमारे ऊपर
  rationale: ἐπί के साथ संबंधकारक यहाँ समूह पर अधिकार का संकेत करता है; यह चुनौती उसी अधिकार को लक्ष्य करती है।
