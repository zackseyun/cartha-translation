  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐνόμιζεν δὲ συνιέναι τοὺς ⸀ἀδελφοὺς ὅτι ὁ θεὸς διὰ χειρὸς αὐτοῦ δίδωσιν ⸂σωτηρίαν αὐτοῖς⸃, οἱ δὲ οὐ συνῆκαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/025.yaml
  text: He supposed that his brothers understood that God was giving them deliverance through his hand[b][a], but they did not understand.
translation:
  language: hi
  text: वह यह मानता था कि उसके भाई[a] समझते थे कि परमेश्वर उसके हाथ से उन्हें छुटकारा[b] दे रहा है, पर वे नहीं समझे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भाई” से आशय मूसा के साथी इस्राएलियों से है। यूनानी में यह पुल्लिंग बहुवचन संबंध-सूचक शब्द है।
    reason: cultural_note
  - marker: b
    text: या “उद्धार।” यूनानी शब्द बचाव, छुटकारे या उद्धार को व्यक्त कर सकता है; यहाँ निकटवर्ती प्रसंग मूसा के द्वारा इस्राएल के छुटकारे की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνόμιζεν
  choice: समझता था
  rationale: अपूर्ण भूतकाल मूसा की उस समय बनी हुई धारणा को व्यक्त करता है; ‘समझता था’ स्वाभाविक हिन्दी में इसे दिखाता है।
- source_word: συνιέναι / συνῆκαν
  choice: समझेंगे / नहीं समझे
  rationale: पहला रूप परोक्ष कथन में मूसा की अपेक्षा व्यक्त करता है, जबकि दूसरा वास्तविक परिणाम बताता है। एक ही हिन्दी धातु से यूनानी की शब्द-पुनरावृत्ति और विरोध सुरक्षित रहते हैं।
- source_word: ἀδελφοὺς
  choice: भाई
  rationale: यह पुल्लिंग बहुवचन संबंध-सूचक शब्द यहाँ मूसा के साथी इस्राएलियों के लिए प्रयुक्त है; मुख्य पाठ में स्रोत की बंधुत्व-भाषा रखी गई है और आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: διὰ χειρὸς αὐτοῦ
  choice: उसके हाथ से
  rationale: यह साधन अथवा माध्यम बताने वाला सजीव यूनानी मुहावरा है। हिन्दी में ‘उसके हाथ से’ स्वाभाविक भी है और मूल बिंब को बनाए रखता है।
- source_word: δίδωσιν
  choice: दे रहा है
  rationale: मूल में वर्तमान काल है और मूसा की धारणा के भीतर परमेश्वर की चल रही क्रिया को प्रस्तुत करता है; हिन्दी परोक्ष कथन में वर्तमान रूप स्वाभाविक रूप से रखा जा सकता है।
- source_word: σωτηρίαν
  choice: छुटकारा
  rationale: इस प्रसंग में मिस्र के उत्पीड़न से इस्राएल की ऐतिहासिक मुक्ति प्रमुख है। ‘छुटकारा’ इस ठोस अर्थ को व्यक्त करता है और व्यापक उद्धार-संबंधी अर्थ को भी बंद नहीं करता।
theological_decisions:
- issue: मूसा के प्रसंग में σωτηρία का अनुवाद
  choice: छुटकारा
  alternative: उद्धार
  rationale: तात्कालिक संदर्भ परमेश्वर द्वारा मूसा के माध्यम से इस्राएल को दासता से छुड़ाने का है। ‘छुटकारा’ उस ऐतिहासिक अर्थ को स्पष्ट रखता है, जबकि पादटिप्पणी ‘उद्धार’ की वैध व्यापक संभावना को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण गद्य। ‘परन्तु’ औपचारिक परंतु सामान्यतः बोधगम्य विरोध-सूचक है। मूल के ‘हाथ’ वाले माध्यम-बिंब और ‘समझना’ की पुनरावृत्ति को सुरक्षित रखा गया है।
