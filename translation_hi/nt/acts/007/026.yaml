source:
  edition: SBLGNT
  text: τῇ τε ἐπιούσῃ ἡμέρᾳ ὤφθη αὐτοῖς μαχομένοις καὶ ⸀συνήλλασσεν αὐτοὺς εἰς εἰρήνην εἰπών· Ἄνδρες, ἀδελφοί ⸀ἐστε· ἱνατί ἀδικεῖτε ἀλλήλους;
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/026.yaml
  text: And on the following day he appeared to them as they were fighting and was trying to reconcile them to peace[a], saying, ‘Men, you are brothers[b]; why are you wronging one another?’
translation:
  language: hi
  text: अगले दिन मूसा उनके सामने प्रकट हुआ, जब वे लड़ रहे थे, और उनके बीच मेल कराने का प्रयत्न कर रहा था।[a] उसने कहा, “हे पुरुषो, तुम भाई हो; एक-दूसरे के साथ अन्याय क्यों कर रहे हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह उनके बीच मेल करा रहा था।” यूनानी अपूर्ण भूतकाल जारी क्रिया भी बता सकता है, पर अगले पद में उसके प्रयास को ठुकराए जाने के कारण यहाँ प्रयत्न का भाव अधिक संभव है।
    reason: व्याकरणिक_विकल्प
lexical_decisions:
- source_word: τῇ τε ἐπιούσῃ ἡμέρᾳ
  choice: अगले दिन
  rationale: यह कालवाचक पद पिछले घटनाक्रम के बाद आने वाले दिन को दर्शाता है; ‘अगले दिन’ स्वाभाविक और क्रमसूचक है।
- source_word: ὤφθη
  choice: उनके सामने प्रकट हुआ
  rationale: ὁράω का यह कर्मवाच्य रूप कथात्मक प्रयोग में प्रायः अकर्मक अर्थ ‘प्रकट हुआ’ देता है; ‘उनके सामने’ αὐτοῖς के संबंध को स्पष्ट करता है।
- source_word: αὐτοῖς μαχομένοις
  choice: जब वे लड़ रहे थे
  rationale: वर्तमान कृदन्त उस समय जारी लड़ाई को परिस्थिति के रूप में प्रस्तुत करता है।
- source_word: συνήλλασσεν αὐτοὺς εἰς εἰρήνην
  choice: उनमें मेल कराने का प्रयत्न करने लगा
  rationale: अपूर्ण भूतकाल रूप जारी अथवा प्रयत्नसूचक क्रिया हो सकता है; अगले पद में प्रतिरोध के कारण यहाँ निष्फल प्रयत्न का भाव प्रसंगानुकूल है। ‘मेल कराना’ शांति की अवस्था की ओर ले जाने को सहज हिन्दी में व्यक्त करता है।
- source_word: Ἄνδρες, ἀδελφοί ἐστε
  choice: भाइयो, तुम तो भाई हो
  rationale: Ἄνδρες संबोधन का स्वाभाविक हिन्दी रूप प्रसंग में ‘भाइयो’ है, जबकि विधेय ἀδελφοί साझा भाईचारे पर बल देता है। ‘तो’ उस विरोधाभास को उभारता है कि भाई होकर वे लड़ रहे हैं, बिना कोई नया तथ्य जोड़े।
- source_word: ἀδικεῖτε ἀλλήλους
  choice: एक-दूसरे के साथ अन्याय क्यों कर रहे हो
  rationale: ἀδικέω का अर्थ किसी के साथ गलत अथवा अन्यायपूर्ण व्यवहार करना है; यह रूप शारीरिक लड़ाई और नैतिक अन्याय दोनों की गुंजाइश बनाए रखता है।
theological_decisions:
- issue: ἀδελφοί में भाईचारे का आशय
  choice: ‘तुम तो भाई हो’ के रूप में साझा भाईचारा बनाए रखा गया
  alternative: ‘तुम दोनों इस्राएली हो’
  rationale: प्रसंग में दोनों इस्राएली हैं, पर मूल पाठ सीधे ‘भाई’ कहता है; जातीय पहचान को स्पष्ट करके मूल की संबंधपरक और संभावित व्यापकता को सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘मेल कराना’ सामान्य पाठक के लिए स्वाभाविक है और εἰς εἰρήνην की शांति की ओर ले जाने वाली दिशा को व्यक्त करता है।
