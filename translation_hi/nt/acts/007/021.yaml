  text: ⸂ἐκτεθέντος δὲ αὐτοῦ ἀνείλατο αὐτὸν⸃ ἡ θυγάτηρ Φαραὼ καὶ ἀνεθρέψατο αὐτὸν ἑαυτῇ εἰς υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/021.yaml
  text: But when he had been exposed[b][a], Pharaoh’s daughter took him up and raised him as her own son.
translation:
  language: hi
  text: लेकिन जब उसे बाहर छोड़ दिया गया, तब फ़िरौन की बेटी ने उसे उठा लिया[a] और अपने पुत्र के रूप में उसका पालन-पोषण किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसे अपने संरक्षण में ले लिया।’ यूनानी क्रिया बाहर छोड़े गए बच्चे को उठा लेने अथवा अपने पास ले लेने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘अपने लिए पुत्र के रूप में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτεθέντος
  choice: बाहर छोड़ दिया गया
  rationale: यह शिशु को किसी स्थान पर बाहर रख दिए जाने के ऐतिहासिक-सांस्कृतिक भाव को व्यक्त करता है, पर ‘त्याग दिया गया’ कहकर मंशा को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: δὲ
  choice: लेकिन
  rationale: यह मूसा को बाहर छोड़ दिए जाने और फ़िरौन की बेटी द्वारा उसे बचाकर पालने के बीच कथा का विरोधात्मक मोड़ स्पष्ट करता है।
- source_word: ἀνείλατο
  choice: उसे उठा लिया
  rationale: यहाँ मध्यमवाच्य क्रिया बाहर छोड़े गए शिशु को उठा लेने या अपने संरक्षण में लेने को सूचित करती है। इसे ‘गोद लिया’ नहीं किया गया, क्योंकि पुत्र के रूप में पालने की बात आगे अलग से आती है।
- source_word: ἡ θυγάτηρ Φαραὼ
  choice: फ़िरौन की बेटी
  rationale: यह संबंध को स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀνεθρέψατο
  choice: उसका पालन-पोषण किया
  rationale: क्रिया का अर्थ बच्चे को पालना और बड़ा करना है; यह हिन्दी में गरिमापूर्ण और सहज अभिव्यक्ति है।
- source_word: ἑαυτῇ εἰς υἱόν
  choice: अपने पुत्र के रूप में
  rationale: यह वाक्यांश उसके अपने लिए पुत्र की हैसियत से पाले जाने को व्यक्त करता है, बिना औपचारिक गोद लेने की किसी विशिष्ट कानूनी प्रक्रिया को पाठ में जोड़ने के।
