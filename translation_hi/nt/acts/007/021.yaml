  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और कथात्मक है। ‘बाहर छोड़ दिया गया’ मूल क्रिया की सांस्कृतिक अस्पष्टता बनाए रखता है, जबकि ‘अपने पुत्र के रूप में’ पुत्र की हैसियत को स्पष्ट करता है, पर औपचारिक दत्तक-ग्रहण का अनावश्यक निष्कर्ष नहीं जोड़ता।
