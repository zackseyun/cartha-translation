source:
  edition: SBLGNT
  text: Καὶ οἱ πατριάρχαι ζηλώσαντες τὸν Ἰωσὴφ ἀπέδοντο εἰς Αἴγυπτον· καὶ ἦν ὁ θεὸς μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/009.yaml
  text: And the patriarchs, being jealous of Joseph, sold him into Egypt; and God was with him,
translation:
  language: hi
  text: और कुलपिताओं ने यूसुफ़ से ईर्ष्या करके उसे मिस्र में बेच दिया; और परमेश्वर उसके साथ था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πατριάρχαι
  choice: कुलपिताओं
  rationale: यहाँ शब्द याकूब के पुत्रों को इस्राएल के मूल पूर्वजों के रूप में सूचित करता है। ‘कुलपिता’ इस विशिष्ट ऐतिहासिक अर्थ को सामान्य ‘पूर्वजों’ की अपेक्षा अधिक ठीक रूप से रखता है।
- source_word: ζηλώσαντες
  choice: यूसुफ़ से ईर्ष्या करके
  rationale: क्रियाविशेषणात्मक कृदंत मुख्य कार्य का कारण या प्रेरणा बताता है। यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है और ईर्ष्या की भावनात्मक तीव्रता बनाए रखता है।
- source_word: ἀπέδοντο
  choice: उसे ... बेच दिया
  rationale: उत्पत्ति की पृष्ठभूमि और मिस्र को गंतव्य बताने वाले वाक्यांश के संदर्भ में क्रिया का ठोस अर्थ यूसुफ़ को बेचना है; ‘सौंप दिया’ अनावश्यक रूप से अस्पष्ट होता।
- source_word: εἰς Αἴγυπτον
  choice: मिस्र में
  rationale: εἰς मिस्र की ओर और उसके भीतर पहुँचने की गति दर्शाता है। यद्यपि ‘मिस्र को’ अधिक रूपात्मक हो सकता है, व्यक्ति को किसी देश में बेच दिए जाने के लिए ‘मिस्र में’ अधिक स्वाभाविक आधुनिक हिन्दी है।
- source_word: ἦν ὁ θεὸς μετ’ αὐτοῦ
  choice: पर परमेश्वर उसके साथ था
  rationale: यह सरलता से यूसुफ़ के साथ परमेश्वर की उपस्थिति बताता है। ‘उसके’ का संदर्भ स्पष्ट होने के कारण नाम दोहराने की आवश्यकता नहीं है।
theological_decisions:
- issue: यूसुफ़ के दुःख में परमेश्वर की उपस्थिति
  choice: पर परमेश्वर उसके साथ था
  alternative: और परमेश्वर उसके साथ था
  rationale: ग्रीक καί सामान्यतः ‘और’ है, पर यहाँ भाइयों के विश्वासघात और परमेश्वर की उपस्थिति के बीच निहित विरोध को हिन्दी का ‘पर’ स्वाभाविक रूप से व्यक्त करता है, बिना परमेश्वर के विधान या दुःख के उद्देश्य के विषय में पाठ से आगे कोई दावा जोड़े।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘कुलपिता’ ऐतिहासिक-धार्मिक पद की विशिष्टता बनाए रखता है; शेष वाक्य सरल और मौखिक पाठ के अनुकूल है।
