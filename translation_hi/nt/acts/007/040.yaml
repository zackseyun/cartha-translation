  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰπόντες τῷ Ἀαρών· Ποίησον ἡμῖν θεοὺς οἳ προπορεύσονται ἡμῶν· ὁ γὰρ Μωϋσῆς οὗτος, ὃς ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου, οὐκ οἴδαμεν τί ⸀ἐγένετο αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/040.yaml
  text: saying to Aaron[a], ‘Make gods for us who will go before us, for this Moses[b], who led us out from the land of Egypt—we do not know what has happened to him.’
translation:
  language: hi
  text: उन्होंने हारून से कहा, “हमारे लिए ऐसे देवता[a] बना, जो हमारे आगे-आगे चलें; क्योंकि यह मूसा[b], जो हमें मिस्र देश से निकाल लाया था—हम नहीं जानते कि उसका क्या हुआ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मूर्तियाँ।” यूनानी शब्द का शाब्दिक अर्थ “देवता” है; यह निर्गमन के वृत्तांत की शब्दावली को दोहराता और लोगों की अपनी माँग को ज्यों का त्यों रखता है।
    reason: lexical_alternative
  - marker: b
    text: या “क्योंकि जहाँ तक इस मूसा की बात है।”
    reason: previous_rendering
lexical_decisions:
- source_word: εἰπόντες τῷ Ἀαρών
  choice: उन्होंने हारून से कहा
  rationale: यूनानी कृदंत पूर्ववर्ती कथन से जुड़ा है; हिन्दी में पूर्ण क्रिया वाला यह रूप कथात्मक प्रवाह और वचन की भूमिका को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Ποίησον ἡμῖν
  choice: हमारे लिए ... बना
  rationale: एकवचन आज्ञार्थक रूप हारून को सीधे संबोधित करता है। ‘बना’ सरल, सीधा और प्रसंगानुकूल है।
- source_word: θεοὺς
  choice: देवता
  rationale: θεός का बहुवचन यहाँ लोगों की अपनी माँग को उद्धृत करता है। ‘देवता’ मूल शब्द को सुरक्षित रखता है; मुख्य पाठ में ‘मूर्तियाँ’ कहना व्याख्यात्मक होता।
- source_word: οἳ προπορεύσονται ἡμῶν
  choice: जो हमारे आगे-आगे चलें
  rationale: यह रूप आगे चलने या मार्ग में पहले होने का स्पष्ट अर्थ रखता है और ‘हमारी अगुवाई करें’ जैसी अतिरिक्त व्याख्यात्मक छाया नहीं जोड़ता।
- source_word: ὁ γὰρ Μωϋσῆς οὗτος
  choice: क्योंकि यह मूसा
  rationale: ‘क्योंकि’ माँग का कारण प्रकट करता है, जबकि ‘यह मूसा’ संकेतवाचक की दूरी बनाने वाली, संभवतः उपेक्षापूर्ण, छाया को बनाए रखता है।
- source_word: ἐξήγαγεν ἡμᾶς ἐκ γῆς Αἰγύπτου
  choice: जो हमें मिस्र देश से निकाल लाया था
  rationale: ‘निकाल लाया’ बाहर ले आने की गति को स्वाभाविक हिन्दी में व्यक्त करता है; ‘मिस्र देश’ γῆς को भी स्पष्ट रखता है।
- source_word: οὐκ οἴδαμεν τί ἐγένετο αὐτῷ
  choice: हम नहीं जानते कि उसका क्या हुआ
  rationale: यह वर्तमान अज्ञान और उसके साथ क्या घटा, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मूर्तिपूजा के प्रसंग में θεοὺς का अनुवाद
  choice: देवता
  alternative: मूर्तियाँ
  rationale: यूनानी पाठ लोगों की माँग में ‘देवता’ शब्द ही रखता है, न कि ‘मूर्ति’ का अलग शब्द। इसलिए ‘देवता’ उनके दावे और निर्गमन-वृत्तांत की प्रतिध्वनि को सुरक्षित रखता है, जबकि पादटिप्पणी वैकल्पिक अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। सीधे संबोधन में ‘बना’ मूल के एकवचन आज्ञार्थक को दर्शाता है। ‘यह मूसा’ में निहित दूरी या उपेक्षा को बिना बढ़ाए सुरक्षित रखा गया है; डैश अंतिम कथन पर स्वाभाविक बल देता है।
