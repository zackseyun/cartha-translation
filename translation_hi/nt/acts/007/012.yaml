  yaml_path: translation/nt/acts/007/012.yaml
  text: But when Jacob heard that there was grain in Egypt[a], he sent out our fathers the first time.
translation:
  language: hi
  text: लेकिन जब याकूब ने सुना कि मिस्र में अनाज है[a], तो उसने हमारे पितरों को पहली बार वहाँ भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘खाद्य-सामग्री है।’ यूनानी शब्द का अर्थ व्यापक रूप से भोजन-सामग्री हो सकता है, हालाँकि इस प्रसंग में ‘अनाज’ अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: जब ... सुना
  rationale: अपूर्णकालिक कृदंत यहाँ मुख्य क्रिया से पहले की परिस्थिति को समय-संबंधी रूप में बताता है; ‘जब ... सुना’ स्वाभाविक हिन्दी में घटनाक्रम सुरक्षित रखता है।
- source_word: δὲ
  choice: लेकिन
  rationale: यह स्तिफनुस के वृत्तांत में हल्का संक्रमण दिखाता है; ‘लेकिन’ पिछले संदर्भ से संबंध बनाए रखता है, बिना तीखा विरोध पैदा किए।
- source_word: ὄντα ⸂σιτία εἰς Αἴγυπτον⸃
  choice: कि मिस्र में अनाज है
  rationale: ἀκούω के बाद कर्मकारक और कृदंत वाली रचना को हिन्दी में स्वाभाविक परोक्ष कथन के रूप में व्यक्त किया गया है। वर्तमान ‘है’ सुनी गई सूचना की विषयवस्तु को सहज रूप से प्रस्तुत करता है।
- source_word: σιτία
  choice: अनाज
  rationale: σιτία का अर्थ व्यापक रूप से खाद्य-सामग्री भी हो सकता है, पर यूसुफ और अकाल के प्रसंग में ‘अनाज’ अधिक सटीक है।
- source_word: ἐξαπέστειλεν
  choice: वहाँ भेजा
  rationale: क्रिया यात्रा पर भेजने का भाव रखती है। हिन्दी में ‘वहाँ भेजा’ गंतव्य को स्पष्ट करते हुए स्वाभाविक है; अलग से ‘बाहर’ जोड़ना कृत्रिम होता।
- source_word: τοὺς πατέρας ἡμῶν
  choice: हमारे पूर्वजों
  rationale: शाब्दिक अर्थ ‘हमारे पिताओं’ है, पर यहाँ आशय इस्राएल के पहले पुरुष पूर्वजों, अर्थात याकूब के पुत्रों, से है। आधुनिक हिन्दी में ‘हमारे पूर्वज’ अधिक स्पष्ट और गरिमापूर्ण है।
- source_word: πρῶτον
  choice: पहली बार
  rationale: यह मिस्र की एक बाद की दूसरी यात्रा के विपरीत पहली यात्रा को सूचित करता है; ‘पहली बार’ इस क्रम को स्पष्ट करता है।
theological_decisions:
- issue: τοὺς πατέρας ἡμῶν का संबंधपरक और पुरुषवाचक भाव
  choice: हमारे पूर्वजों
  alternative: हमारे पिताओं
  rationale: यह पद ऐतिहासिक रूप से याकूब के पुत्रों को संदर्भित करता है। ‘पूर्वज’ हिन्दी में सामूहिक ऐतिहासिक संबंध को स्पष्ट करता है और यहाँ पुरुष संदर्भ को नकारता नहीं; ‘पिताओं’ अधिक शाब्दिक होते हुए आधुनिक हिन्दी में अस्वाभाविक और संभावित रूप से अस्पष्ट है।
translation_notes:
  register: भाषा आधुनिक, सहज और सार्वजनिक पाठ के योग्य रखी गई है। ‘लेकिन’ से हल्का कथात्मक संक्रमण, ‘वहाँ भेजा’ से यात्रा का गंतव्य, और ‘पहली बार’ से आगे आने वाली दूसरी यात्रा का संकेत स्पष्ट होता है।
