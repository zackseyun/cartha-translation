base_translation:
  language: en
  yaml_path: translation/nt/acts/007/032.yaml
  text: I am the God of your fathers[a], the God of Abraham and Isaac and Jacob[b]. Then Moses became terrified and did not dare to look closely.
translation:
  language: hi
  text: “मैं तुम्हारे पूर्वजों का परमेश्वर हूँ—अब्राहम, इसहाक और याकूब का परमेश्वर।” तब मूसा भय से काँप उठा और ध्यान से देखने का साहस न कर सका।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ध्यान से जाँचने” अथवा “गौर से देखने” का साहस न कर सका। यूनानी क्रिया ध्यानपूर्वक देखने या विचार करने, दोनों का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ὁ θεὸς τῶν πατέρων σου
  choice: मैं तुम्हारे पूर्वजों का परमेश्वर हूँ
  rationale: मूल यूनानी में क्रिया व्यक्त नहीं है, पर हिन्दी में स्वाभाविक पहचान-वाक्य के लिए ‘हूँ’ आवश्यक है। Ἐγώ पर बल बना रहता है। ‘पूर्वजों’ आधुनिक पाठक के लिए स्वाभाविक है और यहाँ मूसा के पुरखों को सूचित करता है।
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: अब्राहम, इसहाक और याकूब का परमेश्वर
  rationale: यह पहले कथन की समानाधिकरणात्मक व्याख्या है। नामों और उनके सामूहिक सम्बन्ध को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: ἔντρομος δὲ γενόμενος
  choice: तब मूसा भय से काँप उठा
  rationale: ἔντρομος भयभीत होने और काँपने, दोनों का भाव दे सकता है; ‘भय से काँप उठा’ उसकी तीव्रता और γίνομαι के अवस्था में प्रवेश करने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। δέ को हल्के कथात्मक संक्रमण के रूप में ‘तब’ किया गया है।
- source_word: οὐκ ἐτόλμα
  choice: साहस न कर सका
  rationale: यह मुहावरेदार हिन्दी में मूसा के आगे बढ़कर ऐसा करने का साहस न जुटा पाने को व्यक्त करता है।
- source_word: κατανοῆσαι
  choice: ध्यान से देखने
  rationale: जलती झाड़ी के दृश्य-संदर्भ में क्रिया का अर्थ गौर से देखना है, यद्यपि इसमें ध्यानपूर्वक निरीक्षण या विचार करने की व्यापकता भी हो सकती है; इसीलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: निर्गमन से उद्धृत परमेश्वर की आत्म-पहचान
  choice: मैं तुम्हारे पूर्वजों का परमेश्वर हूँ
  alternative: मैं—तुम्हारे पूर्वजों का परमेश्वर
  rationale: यूनानी वाक्य क्रियारहित है, किन्तु हिन्दी में ‘हूँ’ जोड़ना व्याकरणिक रूप से स्वाभाविक है और कथन को अतिरिक्त धर्मवैज्ञानिक अर्थ दिए बिना परमेश्वर की आत्म-पहचान बनाए रखता है।
- issue: ἔντρομος में भय और शारीरिक काँपने का सम्बन्ध
  choice: भय से काँप उठा
  alternative: बहुत डर गया
  rationale: चुना हुआ पाठ दोनों सम्भावित अर्थ-छायाओं को साथ रखता है और मूल की तीव्रता को केवल मानसिक भय तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पूर्वजों’ को पुरातन ‘पितरों’ पर प्राथमिकता दी गई है। उद्धरण की पुनरुक्त पहचान को डैश से स्पष्ट किया गया है और ‘भय से काँप उठा’ द्वारा मूल के भय तथा काँपने की संयुक्त अर्थ-छाया सुरक्षित रखी गई है।
