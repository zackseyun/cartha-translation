lexical_decisions:
- source_word: Σολομῶν
  choice: सुलैमान
  rationale: यह इस बाइबलीय नाम का मानक हिन्दी रूप है।
- source_word: δὲ
  choice: पर
  rationale: यह हल्के विरोध या कथा में अगले चरण को सूचित करता है; यहाँ संक्षिप्त और स्वाभाविक हिन्दी में ‘पर’ आगे आने वाले विरोध की भूमिका भी बनाता है।
- source_word: οἰκοδόμησεν
  choice: बनाया
  rationale: यहाँ क्रिया किसी इमारत के वास्तविक निर्माण को व्यक्त करती है; ‘बनाया’ सामान्य आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: αὐτῷ
  choice: उसके लिए
  rationale: सर्वनाम का संदर्भ प्रसंग में परमेश्वर से है; हिन्दी में ‘उसके लिए ... बनाया’ उद्देश्य और सम्मान, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἶκον
  choice: एक भवन
  rationale: मूल शब्द का सामान्य अर्थ ‘घर/भवन’ है, यद्यपि प्रसंग में संकेत मन्दिर की ओर है। ‘भवन’ परमेश्वर के लिए निर्मित पवित्र इमारत के प्रसंग में स्वाभाविक है और विशिष्ट शब्द ‘मन्दिर’ जोड़कर मूल की शब्दावली को अधिक व्याख्यात्मक नहीं बनाता।
theological_decisions:
- issue: οἶκον को सामान्य ‘भवन’ के रूप में रखा जाए या प्रसंगानुसार ‘मन्दिर’ कहा जाए
  choice: भवन
  alternative: मन्दिर
  rationale: यूनानी पाठ सामान्य शब्द οἶκος का प्रयोग करता है, न कि अधिक विशिष्ट ναός या ἱερόν का। ‘भवन’ रखने से परमेश्वर के लिए भवन बनाने और अगले पद में परमप्रधान के मनुष्यों के बनाए भवनों में न रहने के बीच का तनाव सुरक्षित रहता है; ‘मन्दिर’ को पादटिप्पणी में संदर्भगत विकल्प के रूप में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण है। ‘सुलैमान’ मानक हिन्दी बाइबलीय नाम है; ‘भवन’ सामान्य पाठक के लिए स्पष्ट रहते हुए मूल की अपेक्षाकृत सामान्य शब्दावली को बनाए रखता है।
