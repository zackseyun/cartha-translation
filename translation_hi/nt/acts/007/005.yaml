source:
  edition: SBLGNT
  text: καὶ οὐκ ἔδωκεν αὐτῷ κληρονομίαν ἐν αὐτῇ οὐδὲ βῆμα ποδός, καὶ ἐπηγγείλατο δοῦναι αὐτῷ εἰς κατάσχεσιν αὐτὴν καὶ τῷ σπέρματι αὐτοῦ μετ’ αὐτόν, οὐκ ὄντος αὐτῷ τέκνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/005.yaml
  text: And he gave him no inheritance in it[a], not even a foot's length, but promised to give it to him as a possession, and to his offspring after him[b], though he had no child.
translation:
  language: hi
  text: और उसने उसे उस देश में कोई विरासत नहीं दी—पाँव रखने भर की जगह भी नहीं[a]—पर उसने प्रतिज्ञा की कि वह उसे यह देश उसकी संपत्ति के रूप में देगा, और उसके बाद उसके वंश को भी[b], यद्यपि उस समय उसकी कोई संतान नहीं थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के निकट: “पाँव के एक कदम जितनी जगह भी नहीं।” यह यूनानी मुहावरा भूमि के अत्यंत छोटे अंश को दर्शाता है।'
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “जब उसकी कोई संतान नहीं थी” भी हो सकता है। यूनानी रचना कालवाचक समझी जा सकती है, यद्यपि प्रसंग “यद्यपि” के रियायती भाव का प्रबल समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: κληρονομίαν
  choice: विरासत
  rationale: यह शब्द भूमि में मिले हुए वाचा-संबंधी और वैधानिक हिस्से का भाव बनाए रखता है; सामान्य ‘संपत्ति’ की अपेक्षा यहाँ अधिक सटीक है।
- source_word: οὐδὲ βῆμα ποδός
  choice: पाँव रखने भर की जगह भी नहीं
  rationale: यूनानी मुहावरा भूमि के अत्यंत छोटे अंश को दर्शाता है। यह हिंदी अभिव्यक्ति उसके चित्रात्मक और मुहावरेदार अर्थ को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἐπηγγείλατο
  choice: प्रतिज्ञा की
  rationale: यह परमेश्वर की दृढ़ प्रतिबद्धता को स्पष्ट, गरिमापूर्ण और बाइबिलीय हिंदी में व्यक्त करता है।
- source_word: εἰς κατάσχεσιν
  choice: उसकी संपत्ति के रूप में
  rationale: यह भूमि को स्थायी अधिकार और अधिग्रहण के रूप में दिए जाने का परिणामसूचक भाव व्यक्त करता है।
- source_word: σπέρματι
  choice: वंश
  rationale: यह एकवचन रूप में सामूहिक अर्थ रखने वाले यूनानी शब्द के अनुरूप है और अब्राहम से जुड़ी प्रतिज्ञा की भाषा को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: μετ’ αὐτόν
  choice: उसके बाद
  rationale: यह अब्राहम के बाद उसके वंश के उत्तराधिकार को सीधे और स्वाभाविक रूप में बताता है।
- source_word: οὐκ ὄντος αὐτῷ τέκνου
  choice: यद्यपि उस समय उसकी कोई संतान नहीं थी
  rationale: यह प्रसंग में प्रमुख रियायती भाव को व्यक्त करता है और साथ ही परिस्थिति के समय-संबंधी पक्ष को ‘उस समय’ से बनाए रखता है।
- source_word: τέκνου
  choice: संतान
  rationale: यूनानी शब्द किसी भी बच्चे के लिए है, केवल पुत्र के लिए नहीं; ‘संतान’ इस व्यापकता को बनाए रखता है।
theological_decisions:
- issue: प्रतिज्ञा के समय अब्राहम की संतानहीनता का रियायती अथवा कालवाचक भाव
  choice: यद्यपि उस समय उसकी कोई संतान नहीं थी
  alternative: जब उसकी कोई संतान नहीं थी
  rationale: यूनानी genitive absolute परिस्थिति या समय दोनों बता सकता है, पर स्तिफनुस के तर्क में संतान न होने के बावजूद प्रतिज्ञा किया जाना विशेष रूप से उभरता है। चुना हुआ रूप रियायती बल को रखता है और ‘उस समय’ द्वारा कालगत परिस्थिति को भी नहीं खोता।
translation_notes:
  register: आधुनिक मानक हिंदी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘विरासत’ और ‘संपत्ति’ को अलग रखकर κληρονομία और κατάσχεσις का भेद सुरक्षित किया गया है। मुख्य वाक्य की लंबाई को विराम-चिह्नों और दूसरे वाक्य द्वारा नियंत्रित किया गया है।
