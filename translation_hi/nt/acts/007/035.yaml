source:
  edition: SBLGNT
  text: Τοῦτον τὸν Μωϋσῆν, ὃν ἠρνήσαντο εἰπόντες· Τίς σε κατέστησεν ἄρχοντα καὶ δικαστήν, τοῦτον ὁ θεὸς ⸀καὶ ἄρχοντα καὶ λυτρωτὴν ⸂ἀπέσταλκεν σὺν⸃ χειρὶ ἀγγέλου τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/035.yaml
  text: This Moses[a], whom they rejected, saying, ‘Who appointed you a ruler and a judge?’—this man God sent as both ruler and redeemer by the hand of the angel who appeared to him in the bush.
translation:
  language: hi
  text: “इसी मूसा को उन्होंने यह कहकर ठुकरा दिया था, ‘तुझे किसने शासक और न्यायाधीश ठहराया?’ इसी व्यक्ति को परमेश्वर ने उस स्वर्गदूत के हाथ से, जो उसे झाड़ी में दिखाई दिया था, शासक और छुड़ानेवाला[a] बनाकर भेजा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुक्तिदाता” अथवा “उद्धारकर्ता।” यूनानी शब्द का अर्थ किसी को बंधन या संकट से छुड़ानेवाला व्यक्ति हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσαντο
  choice: ठुकरा दिया
  rationale: यहाँ क्रिया मूसा के अधिकार को अस्वीकार करने का भाव रखती है; ‘ठुकरा दिया’ निर्गमन 2:14 की पृष्ठभूमि में स्वाभाविक और स्पष्ट है।
- source_word: κατέστησεν
  choice: ठहराया
  rationale: प्रश्न किसी व्यक्ति को अधिकारपूर्ण पद पर नियुक्त किए जाने के विषय में है; ‘ठहराया’ इस औपचारिक भाव को बनाए रखता है।
- source_word: ἄρχοντα
  choice: शासक
  rationale: यह शब्द अधिकार का प्रयोग करनेवाले व्यक्ति को दर्शाता है। इसकी पुनरावृत्ति बनाए रखने से मनुष्यों के अस्वीकार और परमेश्वर की नियुक्ति के बीच का विरोध उभरता है।
- source_word: δικαστήν
  choice: न्यायी
  rationale: यह न्याय करनेवाले व्यक्ति का सीधा अर्थ देता है और बाइबलीय प्रसंग में प्रतिष्ठित, सुबोध शब्द है।
- source_word: λυτρωτήν
  choice: छुड़ानेवाला
  rationale: यह शब्द बंधन या संकट से मुक्ति दिलानेवाले व्यक्ति को सूचित करता है। ‘छुड़ानेवाला’ आधुनिक हिन्दी में स्वाभाविक है और ‘उद्धारकर्ता’ की अपेक्षा यहाँ अनावश्यक रूप से व्यापक धार्मिक अर्थ आरोपित नहीं करता।
- source_word: ἀπέσταλκεν
  choice: भेजा
  rationale: यूनानी पूर्णकाल भेजे जाने के पूर्ण कार्य और उसके स्थायी महत्व को सूचित कर सकता है; हिन्दी में प्रसंगगत कथन के लिए ‘भेजा’ स्वाभाविक है।
- source_word: σὺν χειρὶ
  choice: के हाथ से
  rationale: यह सामी प्रभाव वाला साधन अथवा मध्यस्थता का मुहावरा है। शाब्दिक बाइबलीय अभिव्यक्ति स्वर्गदूत की मध्यस्थ भूमिका बनाए रखती है।
- source_word: ἀγγέλου
  choice: स्वर्गदूत
  rationale: जलती झाड़ी के प्रसंग में यह एक स्वर्गीय दूत को दर्शाता है; हिन्दी पाठक के लिए ‘स्वर्गदूत’ स्पष्ट और मानक है।
- source_word: τοῦ ὀφθέντος αὐτῷ ἐν τῇ βάτῳ
  choice: जो उसे झाड़ी में दिखाई दिया था
  rationale: रूप निष्क्रिय है, पर अर्थ स्वाभाविक रूप से ‘दिखाई दिया’ है। मूल पद में ‘जलती हुई’ नहीं है, इसलिए उसे पाठ में नहीं जोड़ा गया।
- source_word: Τοῦτον ... τοῦτον
  choice: इसी मूसा ... इसी व्यक्ति
  rationale: दोनों संकेतवाचकों की बलात्मक पुनरावृत्ति सुरक्षित रखी गई है, पर हिन्दी में अनगढ़ दोहराव से बचने के लिए दूसरी बार ‘व्यक्ति’ कहा गया है।
- source_word: καὶ ἄρχοντα καὶ λυτρωτὴν
  choice: शासक और छुड़ानेवाला बनाकर
  rationale: दोनों भूमिकाओं को समान बल देते हुए स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: मूसा के लिए λυτρωτής का अनुवाद, जिसमें मुक्ति और छुटकारे का अर्थ निहित है
  choice: छुड़ानेवाला
  alternative: उद्धारकर्ता; मुक्तिदाता
  rationale: ‘छुड़ानेवाला’ यूनानी शब्द के मुक्ति दिलानेवाले अभिकर्ता के अर्थ को सुरक्षित रखता है और मूसा की परमेश्वर-प्रेषित भूमिका को स्पष्ट करता है, पर बाद की किसी विशिष्ट मसीही पदवी को इस स्थल पर अनिवार्य नहीं बनाता। विकल्पों को पादटिप्पणी में बताया गया है।
- issue: σὺν χειρὶ ἀγγέλου में परमेश्वर, मूसा और स्वर्गदूत के बीच अभिकरण
  choice: स्वर्गदूत के हाथ से
  alternative: स्वर्गदूत के द्वारा; स्वर्गदूत की सहायता से
  rationale: मूल की अभिकरण-संबंधी अस्पष्टता और बाइबलीय मुहावरे को बनाए रखा गया है; इससे स्वर्गदूत की भूमिका को केवल सहायता तक सीमित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘इसी ... इसी’ से यूनानी की वक्तृत्वपूर्ण पुनरावृत्ति उभारी गई है। ‘न्यायी’ और ‘स्वर्गदूत’ बाइबलीय प्रसंग के परिचित शब्द हैं; वाक्य-संरचना मूल के विरोधाभास और बल को सुरक्षित रखती है।
