source:
  edition: SBLGNT
  text: Σκληροτράχηλοι καὶ ἀπερίτμητοι ⸀καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/051.yaml
  text: You stiff-necked people[a], uncircumcised in hearts and ears, you always resist the Holy Spirit; as your fathers did, so do you.
translation:
  language: hi
  text: “हे हठीले लोगो, जिनके हृदय और कान खतनारहित हैं! तुम हमेशा पवित्र आत्मा का विरोध करते हो। जैसे तुम्हारे पुरखों[a] ने किया, वैसे ही तुम भी करते हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “तुम्हारे पिता।” यूनानी: “तुम्हारे पिता।”'
    reason: οἱ πατέρες ὑμῶν के शाब्दिक रूप को दर्शाता है; मुख्य पाठ में ‘पुरखे’ संदर्भानुकूल व्यापक पूर्वज-अर्थ देता है।
lexical_decisions:
- source_word: Σκληροτράχηλοι
  choice: हठीले लोगो
  rationale: यूनानी शब्द का शाब्दिक बिंब ‘कड़ी गरदन वाले’ है और यह पुराने नियम की भाषा को प्रतिध्वनित करता है। किंतु आधुनिक हिन्दी में ‘हठीले’ उसी विद्रोही और न झुकने वाले भाव को अधिक स्वाभाविक तथा स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀπερίτμητοι καρδίαις καὶ τοῖς ὠσίν
  choice: जिनके हृदय और कान खतनारहित हैं
  rationale: ‘खतनारहित’ वाचा-संबंधी और भविष्यद्वक्ताओं की तीखी रूपकात्मक भाषा को सुरक्षित रखता है; ‘हृदय और कान’ क्रमशः भीतर की अनिच्छा और सुनने की असंवेदनशीलता की संयुक्त छवि बनाए रखते हैं।
- source_word: ἀεὶ
  choice: हमेशा
  rationale: लगातार दोहराए जाने वाले व्यवहार को सरल और सटीक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: पवित्र आत्मा
  rationale: प्रेरितों के काम के संदर्भ में यह निश्चित पद व्यक्तिगत ईश्वरीय पवित्र आत्मा की ओर संकेत करता है; हिन्दी की मानक बाइबलीय अभिव्यक्ति रखी गई है।
- source_word: ἀντιπίπτετε
  choice: विरोध करते हो
  rationale: यह क्रिया सक्रिय रूप से सामने पड़ने या प्रतिरोध करने का भाव रखती है; ‘विरोध करते हो’ स्वाभाविक हिन्दी में उस आरोप की तीव्रता बनाए रखता है।
- source_word: οἱ πατέρες ὑμῶν
  choice: तुम्हारे पुरखों
  rationale: ‘पुरखे’ यूनानी ‘पिताओं’ के पूर्वज-संबंधी आशय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और पिछली पीढ़ियों से तुलना स्पष्ट करता है।
- source_word: ὡς ... καὶ ὑμεῖς
  choice: जैसे ... वैसे ही तुम भी
  rationale: यूनानी तुलना में दूसरे खंड की क्रिया निहित है; हिन्दी में उसे ‘करते हो’ के साथ पूरा करना अर्थ को बदले बिना वाक्य को स्वाभाविक बनाता है।
theological_decisions:
- issue: पवित्र आत्मा का संदर्भ
  choice: व्यक्तिगत ईश्वरीय पवित्र आत्मा
  alternative: सामान्य ईश्वरीय प्रभाव या पवित्र प्रवृत्ति
  rationale: प्रेरितों के काम में निश्चित पदबंध सामान्यतः पवित्र आत्मा को व्यक्तिगत कर्ता के रूप में दर्शाता है, और यहाँ उसका ‘विरोध’ किया जाना भी इसी पाठ-संदर्भ के अनुकूल है।
- issue: खतने की वाचा-संबंधी रूपकात्मक भाषा
  choice: ‘हृदय और कान खतनारहित’ रूपक को बनाए रखना
  alternative: ‘हृदय से बंद और सुनने में बहरे’ जैसा व्याख्यात्मक रूप
  rationale: यह आरोप इस्राएल के शास्त्रों की भविष्यद्वक्तीय भाषा को जानबूझकर प्रतिध्वनित करता है। रूपक को बनाए रखने से वाचा और आंतरिक विद्रोह का संबंध सुरक्षित रहता है।
- issue: Σκληροτράχηλοι का रूपक
  choice: मुख्य पाठ में स्वाभाविक अर्थ ‘हठीले’
  alternative: अधिक शाब्दिक ‘कड़ी गरदन वाले’
  rationale: ‘कड़ी गरदन वाले’ हिन्दी में अस्वाभाविक और तत्काल अस्पष्ट हो सकता है। ‘हठीले’ मूल आरोप का कार्यात्मक बल देता है, जबकि फुटनोट शाब्दिक बिंब और शास्त्रीय प्रतिध्वनि सुरक्षित रखता है।
- issue: पूर्वजों के लिए लिंगित पद
  choice: तुम्हारे पुरखे
  alternative: तुम्हारे पिता
  rationale: इस संदर्भ में οἱ πατέρες पिछली पीढ़ियों या पूर्वजों को सूचित करता है। ‘पुरखे’ हिन्दी में पुरुषवाची पूर्वज-पद है और ‘पिता’ से उत्पन्न निकट जैविक पितृत्व की संभावित गलतफहमी से बचाता है।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। संबोधन तथा विस्मयादिबोधक चिह्न स्तिफनुस के तीखे भविष्यद्वक्तीय आरोप को व्यक्त करते हैं। ‘खतनारहित’ जैसे असामान्य पर महत्त्वपूर्ण वाचा-संबंधी शब्द को सरल बनाने के बजाय सुरक्षित रखा गया है।
