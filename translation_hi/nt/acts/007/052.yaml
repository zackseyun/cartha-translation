source:
  edition: SBLGNT
  text: τίνα τῶν προφητῶν οὐκ ἐδίωξαν οἱ πατέρες ὑμῶν; καὶ ἀπέκτειναν τοὺς προκαταγγείλαντας περὶ τῆς ἐλεύσεως τοῦ δικαίου οὗ νῦν ὑμεῖς προδόται καὶ φονεῖς ⸀ἐγένεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/052.yaml
  text: Which of the prophets did your fathers not persecute? And they killed those who announced beforehand the coming of the Righteous One[a], of whom you have now become betrayers and murderers[c][b],
translation:
  language: hi
  text: तुम्हारे पूर्वजों[c] ने किस भविष्यद्वक्ता को नहीं सताया? और उन्होंने उन लोगों को मार डाला जिन्होंने उस धर्मी जन[a] के आने की पहले से घोषणा की थी, जिसके विश्वासघाती[b] और हत्यारे अब तुम बन गए हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस न्यायी जन’।
    reason: lexical_alternative
  - marker: b
    text: या ‘पकड़वानेवाले’।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में अधिक शब्दशः ‘तुम्हारे पिताओं’; आशय उनके पूर्वजों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τῶν προφητῶν
  choice: किस भविष्यद्वक्ता को
  rationale: हिन्दी में एकवचन प्रश्नवाचक रूप इस अंशात्मक यूनानी रचना की स्वाभाविक अभिव्यक्ति है और अलंकारिक आशय बनाए रखता है कि कोई भी भविष्यद्वक्ता उनके सताव से नहीं बचा।
- source_word: ἐδίωξαν
  choice: सताया
  rationale: यहाँ क्रिया का अर्थ शत्रुतापूर्ण ढंग से पीछा करना और उत्पीड़ित करना है; ‘सताना’ आधुनिक हिन्दी में इसे सहज रूप से व्यक्त करता है।
- source_word: οἱ πατέρες ὑμῶν
  choice: तुम्हारे पूर्वजों
  rationale: ‘पूर्वज’ आधुनिक हिन्दी में वंशगत पुरखों को स्पष्ट रूप से व्यक्त करता है; ‘पिताओं’ अधिक शब्दशः है, पर इस संदर्भ में कम स्वाभाविक और संभावित रूप से अस्पष्ट है।
- source_word: ἀπέκτειναν
  choice: मार डाला
  rationale: यह यूनानी क्रिया के पूर्ण और जानबूझकर किए गए प्राण-वध को स्पष्ट, प्रचलित हिन्दी में व्यक्त करता है।
- source_word: τοὺς προκαταγγείλαντας
  choice: उन लोगों को ... जिन्होंने ... पहले से घोषणा की थी
  rationale: 'यह कृदन्त के व्यक्तिवाचक और कालगत दोनों पहलुओं को बनाए रखता है: उन्होंने आगमन से पहले उसकी घोषणा की।'
- source_word: περὶ τῆς ἐλεύσεως
  choice: के आने की
  rationale: ‘आने’ से ἔλευσις का स्वाभाविक अर्थ मिलता है और προκαταγγέλλω के साथ हिन्दी वाक्य सहज रहता है।
- source_word: τοῦ δικαίου
  choice: उस धर्मी जन
  rationale: संज्ञीकृत विशेषण एक विशिष्ट व्यक्ति, यीशु, की ओर संकेत करता है। ‘धर्मी जन’ शीर्षक-सदृश बल को बनाए रखता है, जबकि ‘उस’ यूनानी निश्चित उपपद की विशिष्टता दर्शाता है।
- source_word: οὗ
  choice: जिसे ... और जिसका
  rationale: 'सम्बन्धवाचक सर्वनाम को हिन्दी में दो समानान्तर सम्बन्धों के अनुसार बाँटा गया है: उसे पकड़वाना और उसका खून करना। इससे यूनानी सम्बन्ध स्पष्ट और स्वाभाविक बनता है।'
- source_word: νῦν ... ἐγένεσθε
  choice: अब तुम बन गए हो
  rationale: यह पूर्वजों के पिछले कार्य और श्रोताओं की वर्तमान दोषी स्थिति के बीच कालगत विरोध तथा परिणामी अवस्था दोनों को सुरक्षित रखता है।
- source_word: προδόται
  choice: पकड़वानेवाले
  rationale: संदर्भ में यह यीशु को विरोधियों के हाथ सौंप देने के दोष को ठोस रूप से व्यक्त करता है; ‘विश्वासघाती’ भी सम्भव है, पर वह सौंपे जाने की घटना को कम स्पष्ट करता है।
- source_word: φονεῖς
  choice: जिसका खून करनेवाले
  rationale: ‘खून करना’ दोषपूर्ण हत्या को व्यक्त करता है और सामान्य ‘मारनेवाले’ की अपेक्षा φονεύς के नैतिक-न्यायिक आरोप को अधिक स्पष्ट रखता है।
theological_decisions:
- issue: τοῦ δικαίου को मसीह-संबंधी उपाधि के रूप में प्रस्तुत करना
  choice: उस धर्मी जन
  alternative: उस न्यायी जन
  rationale: प्रसंग में यह उन विशिष्ट व्यक्ति यीशु को दर्शाता है जिनके आने की भविष्यद्वक्ताओं ने घोषणा की थी। ‘धर्मी’ उनकी नैतिक धार्मिकता को व्यक्त करता है और किसी अतिरिक्त साम्प्रदायिक व्याख्या को नहीं जोड़ता।
- issue: προδόται में विश्वासघात और सौंपे जाने के बीच अर्थ-बल
  choice: पकड़वानेवाले
  alternative: विश्वासघाती
  rationale: प्रेरितों के काम के निकट प्रसंग में यीशु को मृत्यु के लिए सौंपना प्रमुख है। फिर भी मूल शब्द व्यापक रूप से विश्वासघाती भी कहा जा सकता है, इसलिए विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- issue: श्रोताओं की हत्या में सहभागिता का आरोप
  choice: जिसका खून करनेवाले अब तुम बन गए हो
  alternative: जिसके हत्यारे अब तुम बन गए हो
  rationale: वचन श्रोताओं को केवल घटना से सम्बद्ध नहीं करता, बल्कि φονεῖς कहकर उन पर प्रत्यक्ष नैतिक दोष लगाता है। अनुवाद उस तीखे आरोप को कम नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘भविष्यद्वक्ता’, ‘धर्मी जन’ और ‘घोषणा’ जैसे परिचित बाइबिलीय शब्द बनाए गए हैं, पर अस्वाभाविक शब्दशः रचना से बचा गया है। प्रश्न का आरोपात्मक बल और ‘अब तुम’ का प्रत्यक्ष सामना दोनों सुरक्षित हैं।
