  text: Ὡς δὲ ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος, ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ ἐπισκέψασθαι τοὺς ἀδελφοὺς αὐτοῦ τοὺς υἱοὺς Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/023.yaml
  text: When he was approaching forty years of age[a], it came into his heart to visit his brothers[c][b], the sons of Israel.
translation:
  language: hi
  text: जब उसकी आयु के चालीस वर्ष पूरे होने को थे[a], तब उसके मन में यह बात आई[b] कि वह अपने भाइयों, अर्थात् इस्राएल के पुत्रों, से मिलने जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उसके चालीस वर्ष पूरे हुए।” यूनानी अभिव्यक्ति का शाब्दिक भाव है कि उसके लिए चालीस वर्ष का समय पूरा हो रहा था।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके हृदय में यह बात उठी,” अथवा “उसने निश्चय किया।” मूल भाषा भीतर उठे विचार या संकल्प का मुहावरा सुरक्षित रखती है।
    reason: lexical_alternative
  - marker: c
    text: “मिलने” का अर्थ यहाँ उनकी दशा देखने, उनका हाल-चाल जानने या उनकी सुध लेने तक विस्तृत हो सकता है। “भाइयों” से आशय उसके सहजाति इस्राएलियों से है, जिन्हें आगे “इस्राएल के पुत्र” कहा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: Ὡς δὲ
  choice: जब... तब
  rationale: यह पद कथा में समय-संबंधी परिवर्तन लाता है। हिन्दी में ‘जब... तब’ समय का संबंध स्पष्ट और स्वाभाविक रूप से व्यक्त करता है; δέ का हल्का संयोजक बल प्रसंग से समझ में आता है।
- source_word: ἐπληροῦτο αὐτῷ τεσσερακονταετὴς χρόνος
  choice: उसकी आयु के चालीस वर्ष पूरे हो रहे थे
  rationale: यह यूनानी की अपूर्णकालिक अभिव्यक्ति और ‘समय पूरा होने’ के मुहावरे को बनाए रखता है, बिना इसे केवल ‘वह चालीस वर्ष का था’ बनाकर सपाट किए।
- source_word: ἀνέβη ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: उसके मन में यह बात आई
  rationale: यह सामी पृष्ठभूमि वाले यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और भीतर उठे विचार या निश्चय को सीधे ‘उसने निर्णय लिया’ कहकर सीमित नहीं करता।
- source_word: ἐπισκέψασθαι
  choice: मिलने जाए
  rationale: प्रसंग में मूसा अपने लोगों के पास जाकर उनकी दशा देखना चाहता है। ‘मिलने जाए’ सहज मुख्य-पाठ है; देखने, हाल-चाल जानने या सुध लेने की व्यापक छाया पाद-टिप्पणी में दी गई है।
- source_word: τοὺς ἀδελφοὺς αὐτοῦ
  choice: अपने भाइयों
  rationale: यूनानी का पुरुषवाचक बहुवचन और जातीय-परिवारगत भाषा सुरक्षित रखी गई है। अगले पदबंध से स्पष्ट होता है कि अभिप्राय मूसा के सहजाति इस्राएलियों से है।
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: यह मूल के पारंपरिक जातीय पदबंध को औपचारिक रूप से सुरक्षित रखता है और ‘भाइयों’ की पहचान स्पष्ट करता है।
theological_decisions:
- issue: मन में उठे विचार और दृढ़ निश्चय के बीच अर्थ-छाया
  choice: उसके मन में यह बात आई
  alternative: उसने निश्चय किया
  rationale: मूल मुहावरा आंतरिक प्रेरणा, विचार या संकल्प को व्यक्त कर सकता है। मुख्य पाठ रूपक-सदृश अभिव्यक्ति को बनाए रखता है और दृढ़ता की मात्रा को अनावश्यक रूप से निश्चित नहीं करता।
- issue: लिंगसूचक संबंध और जातीय पहचान
  choice: अपने भाइयों, अर्थात् इस्राएल के पुत्रों
  alternative: अपने सहजाति इस्राएलियों
  rationale: इसमें कोई विशिष्ट सांप्रदायिक सिद्धांत दाँव पर नहीं है। चुना गया रूप यूनानी की संबंधपरक और वाचा-संबंधी पारिवारिक भाषा को बचाता है, जबकि ‘अर्थात्’ स्पष्ट करता है कि यहाँ मूसा के साथी इस्राएली अभिप्रेत हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मन’ हिन्दी में आंतरिक विचार और संकल्प का स्वाभाविक स्थान है; पाद-टिप्पणी मूल के ‘हृदय’ वाले मुहावरे को दिखाती है। ‘इस्राएल के पुत्र’ स्रोत की पारंपरिक बाइबिलीय बनावट को सुरक्षित रखता है, जबकि ‘अर्थात्’ उसके जातीय संदर्भ को स्पष्ट करता है।
