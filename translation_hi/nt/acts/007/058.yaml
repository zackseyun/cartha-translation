  text: καὶ ἐκβαλόντες ἔξω τῆς πόλεως ἐλιθοβόλουν. καὶ οἱ μάρτυρες ἀπέθεντο τὰ ἱμάτια ⸀αὐτῶν παρὰ τοὺς πόδας νεανίου καλουμένου Σαύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/058.yaml
  text: And after they had driven him out of the city[a], they were stoning him. And the witnesses laid their outer garments at the feet of a young man called Saul.
translation:
  language: hi
  text: और वे उसे नगर से बाहर निकालकर उस पर पत्थर बरसाते रहे। गवाहों ने अपने बाहरी वस्त्र[a] शाऊल नाम के एक युवक के पैरों के पास रख दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वस्त्र’ या ‘चोगे’; यूनानी शब्द सामान्य रूप से ऊपर पहने जाने वाले कपड़ों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: बाहर निकालकर
  rationale: अओरिस्ट कृदंत मुख्य अपूर्णकालीन क्रिया से पहले हुई जबरन निकासी को दिखाता है; हिंदी में ‘बाहर निकालकर’ इस क्रम और बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔξω τῆς πόλεως
  choice: नगर से बाहर
  rationale: यह भीतर से बाहर की ओर गति को स्पष्ट और सहज हिंदी में व्यक्त करता है।
- source_word: ἐλιθοβόλουν
  choice: उस पर पत्थर बरसाते रहे
  rationale: अपूर्णकाल जारी क्रिया को सूचित करता है; ‘बरसाते रहे’ उसकी निरंतरता और हिंसक स्वरूप को बनाए रखता है।
- source_word: οἱ μάρτυρες
  choice: गवाहों
  rationale: यहाँ शब्द न्यायिक प्रसंग के गवाहों के लिए है, न कि बाद में विकसित ‘शहीद’ के अर्थ में।
- source_word: ἀπέθεντο
  choice: रख दिए
  rationale: वस्त्र उतारकर किसी के पास रखने की क्रिया को सामान्य आधुनिक हिंदी में संक्षेप से व्यक्त करता है।
- source_word: τὰ ἱμάτια αὐτῶν
  choice: अपने बाहरी वस्त्र
  rationale: ἱμάτια सामान्यतः ऊपर पहने जाने वाले वस्त्रों को दर्शाता है; ‘बाहरी वस्त्र’ व्यापकता बनाए रखता है और ‘चोगे’ जैसे अधिक संकीर्ण अर्थ से बचता है।
- source_word: παρὰ τοὺς πόδας
  choice: पैरों के पास
  rationale: वस्तुओं को किसी व्यक्ति के निकट अथवा उसकी देखरेख में रखने का सीधा और स्वाभाविक हिंदी रूप।
- source_word: νεανίου
  choice: एक युवक
  rationale: νεανίας अपेक्षाकृत युवा पुरुष को दर्शाता है; ‘युवक’ आधुनिक हिंदी में सटीक और सहज है।
- source_word: καλουμένου Σαύλου
  choice: शाऊल नाम के
  rationale: καλουμένου का अर्थ यहाँ ‘जिसका नाम ... था’ है; हिंदी वाक्य-विन्यास में ‘नाम के’ स्वाभाविक है।
theological_decisions:
- issue: हत्या-दंड के प्रसंग में μάρτυρες की पहचान
  choice: न्यायिक अर्थ में ‘गवाह’
  alternative: ‘शहीद’
  rationale: कथा के इस प्रसंग में ये वे लोग हैं जिन्होंने गवाही दी और पत्थरवाह में भाग लिया। ‘शहीद’ अनुवाद करने से शब्द का बाद का कलीसियाई अर्थ अनुचित रूप से आरोपित होगा।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘पत्थर बरसाते रहे’ यूनानी अपूर्णकाल की जारी क्रिया को स्पष्ट करता है। ‘नगर’ और ‘बाहरी वस्त्र’ औपचारिकता तथा सामान्य बोध के बीच संतुलन रखते हैं।
