lexical_decisions:
- source_word: κράξαντες
  choice: चिल्लाए
  rationale: यह क्रिया ऊँची आवाज़ में पुकारने या चिल्लाने को व्यक्त करती है। हिन्दी में संयुक्त क्रियाओं की स्वाभाविक क्रमबद्धता के कारण कृदन्त को मुख्य क्रिया के रूप में रखा गया है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले कथन से प्रतिक्रिया की ओर हल्का विरोधात्मक मोड़ दिखाता है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से
  rationale: यह यूनानी पदबंध का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: συνέσχον τὰ ὦτα αὐτῶν
  choice: अपने कान बंद कर लिए
  rationale: संदर्भ में इस मुहावरे का अर्थ सुनने से बचने के लिए कान बंद करना है।
- source_word: ὥρμησαν
  choice: झपट पड़े
  rationale: यह अचानक और बलपूर्वक किसी की ओर बढ़ने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अनावश्यक अतिरिक्त हिंसा जोड़ने के।
- source_word: ὁμοθυμαδὸν
  choice: एक साथ
  rationale: यह उनकी संयुक्त कार्रवाई को स्पष्ट और सहज हिन्दी में व्यक्त करता है; साझा मनोभाव की अधिक स्पष्ट छाया पादटिप्पणी में दी गई है।
- source_word: ἐπ’ αὐτόν
  choice: उस पर
  rationale: ἐπί के साथ कर्मकारक यहाँ स्तिफनुस की ओर निर्देशित शत्रुतापूर्ण गति दर्शाता है; ‘उस पर झपट पड़े’ हिन्दी में स्वाभाविक है।
