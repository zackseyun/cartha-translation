- source_word: ἀνέστη
  choice: सत्ता में आया
  rationale: ἀνίστημι का शाब्दिक अर्थ ‘उठा’ है, पर यहाँ राजा के उदय अथवा शासन में आने का मुहावरेदार अर्थ है। ‘सत्ता में आया’ हिन्दी में यही भाव स्पष्ट करता है।
- source_word: βασιλεὺς ἕτερος
  choice: एक दूसरा राजा
  rationale: βασιλεύς का सीधा अर्थ ‘राजा’ और ἕτερος का अर्थ पहले से भिन्न ‘दूसरा’ है।
- source_word: ἐπ’ Αἴγυπτον
  choice: मिस्र पर
  rationale: राजा के संदर्भ में ἐπί + कर्मकारक मिस्र पर अधिकार या शासन व्यक्त करता है।
- source_word: οὐκ ᾔδει
  choice: नहीं जानता था
  rationale: यह οἶδα का सीधा अर्थ सुरक्षित रखता है और इस सम्भावना को खुला छोड़ता है कि आशय यूसुफ को न मानना या उसका सम्मान न करना भी हो सकता है।
- source_word: τὸν Ἰωσήφ
  choice: यूसुफ को
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप ‘यूसुफ’ रखा गया है।
