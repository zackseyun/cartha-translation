base_translation:
  language: en
  yaml_path: translation/nt/acts/007/048.yaml
  text: 'But the Most High does not dwell in things made by hands[a], just as the prophet says:'
translation:
  language: hi
  text: 'परन्तु परमप्रधान हाथों से बनाई हुई वस्तुओं में निवास नहीं करता[a], जैसा भविष्यद्वक्ता कहता है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हाथों से बनाए हुए मंदिरों में।’ यूनानी अभिव्यक्ति अधिक व्यापक है—‘हाथों से बनाई हुई वस्तुओं में’—यद्यपि निकट संदर्भ मंदिर का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: परन्तु
  rationale: पिछले कथन—सुलैमान द्वारा भवन बनाए जाने—के साथ स्पष्ट और गरिमापूर्ण विरोध प्रकट करता है।
- source_word: ὁ ὕψιστος
  choice: परमप्रधान
  rationale: यह परमेश्वर के लिए प्रयुक्त स्थापित उपाधि है; मूल में θεός न होने के कारण ‘परमेश्वर’ नहीं जोड़ा गया।
- source_word: ἐν χειροποιήτοις
  choice: हाथ से बनाई हुई वस्तुओं में
  rationale: यूनानी बहुवचन विशेषण का अर्थ केवल मंदिर तक सीमित नहीं है; यह मनुष्य के हाथ से बनी चीज़ों का व्यापक संकेत सुरक्षित रखता है।
- source_word: κατοικεῖ
  choice: निवास करता
  rationale: परमेश्वर की उपस्थिति और वास के संदर्भ में यह स्वाभाविक, गरिमापूर्ण और अर्थानुकूल क्रिया है।
- source_word: καθὼς
  choice: जैसा
  rationale: इसके बाद आने वाले भविष्यद्वाणी के उद्धरण को पूर्व कथन की पुष्टि के रूप में जोड़ता है।
- source_word: ὁ προφήτης λέγει
  choice: भविष्यद्वक्ता कहता है
  rationale: मूल पाठ भविष्यद्वक्ता का नाम नहीं देता और वर्तमानकालीन उद्धरण-सूत्र का प्रयोग करता है; अनुवाद दोनों बातों को बनाए रखता है।
theological_decisions:
- issue: χειροποιήτοις को केवल मंदिरों के अर्थ में सीमित करना या व्यापक रखना
  choice: मुख्य पाठ में ‘हाथ से बनाई हुई वस्तुओं’ का व्यापक अर्थ रखा गया।
  alternative: ‘हाथ से बनाए हुए मंदिरों में’
  rationale: निकट संदर्भ मंदिर का है, पर यूनानी पद अधिक व्यापक है और मनुष्य-निर्मित पवित्र वस्तुओं अथवा संरचनाओं के विषय में निहित विवादात्मक बल को सुरक्षित रखता है।
- issue: ὁ ὕψιστος में ‘परमेश्वर’ शब्द जोड़ना
  choice: केवल ‘परमप्रधान’ रखा गया।
  alternative: ‘परमप्रधान परमेश्वर’
  rationale: उपाधि का संकेत स्पष्टतः परमेश्वर की ओर है, पर मूल यूनानी में θεός नहीं है; इसलिए अनावश्यक विस्तार नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप। ‘परमप्रधान’ और ‘निवास’ बाइबिलीय संदर्भ के अनुरूप हैं; मुख्य पाठ मूल की व्यापकता बनाए रखता है और पादटिप्पणी संदर्भानुसार संकीर्ण विकल्प बताती है।
