  text: καὶ τὸ ἔθνος ᾧ ⸀ἐὰν ⸀δουλεύσουσιν κρινῶ ἐγώ, ⸂ὁ θεὸς εἶπεν⸃, καὶ μετὰ ταῦτα ἐξελεύσονται καὶ λατρεύσουσίν μοι ἐν τῷ τόπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/007.yaml
  text: And I will judge the nation that they will serve[a], God said[b], and after these things they will come out and worship me in this place.
translation:
  language: hi
  text: “और जिस राष्ट्र की वे सेवा करेंगे[a], उसका न्याय मैं करूँगा,” परमेश्वर ने कहा, “और इसके बाद वे निकल आएँगे और इस स्थान में मेरी उपासना करेंगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिस राष्ट्र के वे दास बनाए जाएँगे” अथवा “जिस राष्ट्र की वे दासों के रूप में सेवा करेंगे।” यूनानी में “सेवा करना” क्रिया है, पर प्रसंग मिस्र में इस्राएल की दासता का है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरी सेवा करेंगे।” यूनानी क्रिया परमेश्वर को अर्पित धार्मिक सेवा या उपासना को दर्शा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνος
  choice: राष्ट्र
  rationale: यह शब्द उस राजनीतिक समुदाय को दर्शाता है जिसके अधीन अब्राहम के वंशज दासता में रहेंगे; एकवचन ‘राष्ट्र’ मूल का सीधा और स्वाभाविक रूप है।
- source_word: ᾧ ἐὰν δουλεύσουσιν
  choice: जिस राष्ट्र की वे सेवा करेंगे
  rationale: δουλεύω का मूल भाव किसी के अधीन सेवा करना है। मुख्य पाठ में ‘सेवा करेंगे’ मूल क्रिया की अभिव्यक्ति बनाए रखता है, जबकि मिस्र की बँधुआ दासता का प्रासंगिक भाव पादटिप्पणी में स्पष्ट किया गया है।
- source_word: κρινῶ
  choice: उसका न्याय मैं करूँगा
  rationale: κρίνω यहाँ परमेश्वर द्वारा न्याय करने या दंडात्मक न्याय लागू करने को दर्शाता है। ‘न्याय करूँगा’ न्यायिक अर्थ को बिना अधिक व्याख्या जोड़े सुरक्षित रखता है।
- source_word: ὁ θεὸς εἶπεν
  choice: परमेश्वर ने कहा
  rationale: यह उद्धृत ईश्वरीय वचन के भीतर वक्ता की स्पष्ट पहचान है; हिंदी में यही स्वाभाविक शब्दक्रम है।
- source_word: μετὰ ταῦτα
  choice: इसके बाद
  rationale: यह घटनाओं के क्रम को स्पष्ट करता है और बहुवचन यूनानी अभिव्यक्ति का आधुनिक हिंदी में सहज समतुल्य है।
- source_word: ἐξελεύσονται
  choice: वे निकल आएँगे
  rationale: यह दास बनाने वाले राष्ट्र से इस्राएल के बाहर आने की ओर संकेत करता है; ‘निकल आएँगे’ निर्गमन और मुक्ति के प्रसंग में स्वाभाविक है।
- source_word: λατρεύσουσίν μοι
  choice: मेरी उपासना करेंगे
  rationale: λατρεύω परमेश्वर को दी जाने वाली धार्मिक सेवा को व्यक्त करता है। ‘उपासना करेंगे’ आधुनिक हिंदी में इस धार्मिक अर्थ को सामान्य सेवा से स्पष्ट रूप से अलग करता है।
- source_word: ἐν τῷ τόπῳ τούτῳ
  choice: इस स्थान में
  rationale: τόπος का सीधा अर्थ ‘स्थान’ है। ‘इस स्थान में’ संकेतवाचक बल और स्थानगत संबंध दोनों को बनाए रखता है।
theological_decisions:
- issue: दासता के प्रसंग में δουλεύω का अनुवाद
  choice: सेवा करेंगे
  alternative: दास बनकर सेवा करेंगे / दासता में रहेंगे
  rationale: प्रसंग मिस्र की दासता का है, पर यूनानी पाठ में क्रिया δουλεύω प्रयुक्त है। मुख्य पाठ उसका ‘सेवा’ वाला रूप बनाए रखता है और पादटिप्पणी बाध्य दास-सेवा का अर्थ बताती है, ताकि न तो उत्पीड़न छिपे और न मूल अभिव्यक्ति अनावश्यक रूप से विस्तृत हो।
- issue: परमेश्वर के प्रति λατρεύω का अनुवाद
  choice: मेरी उपासना करेंगे
  alternative: मेरी सेवा करेंगे
  rationale: यहाँ क्रिया सामान्य श्रम नहीं, परमेश्वर को अर्पित धार्मिक सेवा को दर्शाती है। ‘उपासना’ इस विशेष अर्थ को साफ बताती है, जबकि ‘सेवा’ मूल की वैध वैकल्पिक अभिव्यक्ति है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। उद्धरण-चिह्नों से ‘परमेश्वर ने कहा’ को ईश्वरीय वचन के भीतर आए वक्ता-सूचक वाक्यांश के रूप में दिखाया गया है। ‘सेवा’ और ‘उपासना’ का अंतर यूनानी की दो अलग क्रियाओं तथा उनके प्रसंगगत बल को प्रतिबिंबित करता है।
