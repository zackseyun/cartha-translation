  text: τότε ἐξελθὼν ἐκ γῆς Χαλδαίων κατῴκησεν ἐν Χαρράν. κἀκεῖθεν μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ μετῴκισεν αὐτὸν εἰς τὴν γῆν ταύτην εἰς ἣν ὑμεῖς νῦν κατοικεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/004.yaml
  text: Then, after he had gone out from the land of the Chaldeans, he settled in Haran. And from there, after his father died, God moved him into this land in which you now live,
translation:
  language: hi
  text: तब वह कसदियों की भूमि से निकलकर हारान में जा बसा। और वहाँ से, उसके पिता की मृत्यु के बाद, परमेश्वर उसे इस भूमि में ले आया[a], जिसमें तुम अब रहते हो[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उसे इस भूमि में ला बसाया”; यूनानी में कर्ता स्पष्ट रूप से नहीं दिया गया है, यद्यपि प्रसंग परमेश्वर की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: स्तिफनुस के अनुसार यह स्थानांतरण उसके पिता की मृत्यु के बाद हुआ। संबंधित कालक्रम के लिए उत्पत्ति 11:32; 12:4 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह अगली घटना का समयसूचक संबंध स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἐξελθὼν ἐκ γῆς Χαλδαίων
  choice: कसदियों के देश से निकलकर
  rationale: पूर्वकालिक कृदंत मुख्य क्रिया से पहले की घटना बताता है; ‘कसदियों का देश’ मूल की पूर्ण भौगोलिक अभिव्यक्ति बनाए रखता है।
- source_word: κατῴκησεν ἐν Χαρράν
  choice: हारान में जा बसा
  rationale: κατοικέω यहाँ केवल रहने नहीं, निवास स्थापित करने का भाव देता है; ‘जा बसा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: κἀκεῖθεν
  choice: वहाँ से
  rationale: καί + ἐκεῖθεν का कथात्मक संबंध हिन्दी में प्रसंगानुसार ‘वहाँ से’ से स्पष्ट होता है।
- source_word: μετὰ τὸ ἀποθανεῖν τὸν πατέρα αὐτοῦ
  choice: उसके पिता की मृत्यु के बाद
  rationale: यह रचना स्पष्ट रूप से कालक्रम व्यक्त करती है; हिन्दी में संज्ञात्मक रूप संक्षिप्त और गरिमापूर्ण है।
- source_word: μετῴκισεν αὐτὸν
  choice: परमेश्वर उसे ... ले आया
  rationale: क्रिया का कर्ता यूनानी में व्यक्त नहीं है, पर निकटवर्ती प्रसंग में परमेश्वर अभिप्रेत है। ‘ले आया’ वक्ता और श्रोताओं की वर्तमान भूमि की ओर स्थानांतरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὴν γῆν ταύτην
  choice: इस देश में
  rationale: γῆ का यहाँ आशय निवास-भूमि से है; हिन्दी में ‘इस देश में’ भौगोलिक संदर्भ में स्वाभाविक है।
- source_word: εἰς ἣν ὑμεῖς νῦν κατοικεῖτε
  choice: जिसमें तुम अब रहते हो
  rationale: मूल के वर्तमान निवास और बहुवचन संबोधन दोनों को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: μετῴκισεν का अव्यक्त कर्ता
  choice: मुख्य पाठ में ‘परमेश्वर’ स्पष्ट किया गया
  alternative: ‘उसने उसे ... ले आया’, जिससे कर्ता व्याकरणतः अव्यक्त/संदिग्ध रहे
  rationale: यूनानी में कर्ता अलग से नहीं लिखा गया, किंतु भाषण के निकटवर्ती संदर्भ में परमेश्वर ही कार्यकर्ता है। मुख्य पाठ में स्पष्टता दी गई है और पादटिप्पणी मूल की व्याकरणिक अस्पष्टता दर्ज करती है।
- issue: तिरह की मृत्यु और अब्राहम के प्रस्थान का कालक्रम
  choice: ‘उसके पिता की मृत्यु के बाद’ का सीधा अनुवाद
  alternative: उत्पत्ति के कालक्रम से सामंजस्य बैठाने के लिए वाक्य को बदलना या नरम करना
  rationale: प्रेरितों के काम में स्तिफनुस के कथन का क्रम जैसा है वैसा ही सुरक्षित रखा गया है; संभावित तनाव को पादटिप्पणी में संबंधित संदर्भों सहित बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘कसदियों’, ‘हारान’ और ‘परमेश्वर’ जैसे प्रचलित बाइबलीय रूप रखे गए हैं। मूल की कालक्रम-संबंधी कठिनाई को सामंजस्य बैठाकर हटाया नहीं गया; अव्यक्त कर्ता की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
