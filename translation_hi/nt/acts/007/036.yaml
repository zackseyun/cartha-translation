  text: οὗτος ἐξήγαγεν αὐτοὺς ποιήσας τέρατα καὶ σημεῖα ἐν ⸀γῇ Αἰγύπτῳ καὶ ἐν Ἐρυθρᾷ Θαλάσσῃ καὶ ἐν τῇ ἐρήμῳ ἔτη τεσσεράκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/036.yaml
  text: This man led them out[a], performing wonders and signs in the land of Egypt and at the Red Sea and in the wilderness for forty years.
translation:
  language: hi
  text: इसी व्यक्ति ने उन्हें बाहर निकाला और मिस्र देश में, लाल समुद्र[a] में और निर्जन प्रदेश में चालीस वर्षों तक आश्चर्यकर्म और चिन्ह किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सरकंडों का समुद्र।’ यूनानी पाठ में ‘लाल समुद्र’ (Ἐρυθρὰ Θάλασσα) है, जो नए नियम और सेप्टुआजेंट में इस्राएल के पार उतरने के स्थान का मानक नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: यही व्यक्ति
  rationale: संकेतवाचक सर्वनाम का बल बनाए रखते हुए यह मूसा की ओर स्पष्ट रूप से संकेत करता है; केवल ‘वह’ कहने से स्तिफनुस के कथन का बल घट जाता।
- source_word: ἐξήγαγεν αὐτούς
  choice: उन्हें बाहर ले आया
  rationale: यह प्रयोग लोगों को किसी स्थान से बाहर निकालकर ले आने का अर्थ स्वाभाविक हिंदी में व्यक्त करता है और निर्गमन के प्रसंग के अनुरूप है।
- source_word: ποιήσας
  choice: करता रहा
  rationale: कृदंत को मुख्य क्रिया से जोड़ते हुए यह उन कार्यों की निरंतरता को सहज हिंदी में व्यक्त करता है, विशेषकर चालीस वर्षों की अवधि के साथ।
- source_word: τέρατα καὶ σημεῖα
  choice: अद्भुत काम और चिन्ह
  rationale: ‘अद्भुत काम’ विस्मय उत्पन्न करने वाले कार्यों को और ‘चिन्ह’ उनके संकेतात्मक महत्व को अलग-अलग बनाए रखता है।
- source_word: ἐν γῇ Αἰγύπτῳ
  choice: मिस्र देश में
  rationale: γῇ को ‘देश’ से व्यक्त करके मूल की भौगोलिक संरचना सुरक्षित रखी गई है।
- source_word: ἐν Ἐρυθρᾷ Θαλάσσῃ
  choice: लाल समुद्र में
  rationale: यह यूनानी पद का सीधा और प्रचलित अनुवाद है तथा बार-बार आए ἐν की संरचना भी बनाए रखता है।
- source_word: ἐν τῇ ἐρήμῳ
  choice: उजाड़ प्रदेश में
  rationale: यह इस्राएल के निर्जन भटकाव-क्षेत्र को दर्शाता है और केवल रेतीले मरुस्थल का अनावश्यक संकेत नहीं देता।
- source_word: ἔτη τεσσεράκοντα
  choice: चालीस वर्ष तक
  rationale: ‘तक’ अवधि को स्वाभाविक आधुनिक हिंदी में स्पष्ट करता है।
theological_decisions:
- issue: निर्गमन और अद्भुत कामों में मूसा की भूमिका
  choice: मूसा को वह मानवीय कर्ता बताया गया है जो लोगों को बाहर लाया और अद्भुत काम तथा चिन्ह करता रहा।
  alternative: ऐसा अनुवाद जो केवल ‘वह’ कहकर मूसा पर दिए गए संकेतात्मक बल को कम कर दे, या उसकी भूमिका को स्वतंत्र दैवी सामर्थ्य के रूप में स्पष्ट कर दे।
  rationale: यूनानी पाठ मूसा की भूमिका को सीधे व्यक्त करता है, पर यह नहीं कहता कि उसने परमेश्वर से स्वतंत्र होकर कार्य किए। अनुवाद इस तनाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘यही व्यक्ति’ भाषण के आलंकारिक बल को, और ‘अद्भुत काम और चिन्ह’ लूका की पारिभाषिक जोड़ी को सुरक्षित रखते हैं।
