  text: Then the high priest said[a], “Are these things so?”
translation:
  language: hi
  text: तब महायाजक ने कहा, “क्या ये बातें ऐसी ही हैं[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या यह ऐसा ही है?” अथवा अधिक स्पष्ट रूप में, “क्या ये आरोप सच हैं?”
    reason: मूल यूनानी अभिव्यक्ति आरोपों की ओर संकेत करती है, पर उन्हें स्पष्ट रूप से ‘आरोप’ नहीं कहती; इसलिए अधिक शाब्दिक और अधिक स्पष्ट, दोनों विकल्प दिए गए हैं।
lexical_decisions:
- source_word: Εἶπεν
  choice: कहा
  rationale: λέγω के अओरिस्ट रूप का सीधा और स्वाभाविक अर्थ ‘कहा’ है। आगे प्रश्न आने पर भी यह यूनानी की कथात्मक अभिव्यक्ति को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को आगे बढ़ाता है; ‘तब’ पिछले प्रसंग में लगाए गए आरोपों से इस प्रश्न की स्वाभाविक कड़ी दिखाता है।
- source_word: ἀρχιερεύς
  choice: महायाजक
  rationale: एकवचन में न्यायिक सभा की अध्यक्षता करने वाले ἀρχιερεύς के लिए ‘महायाजक’ मानक और प्रसंगानुकूल शब्द है।
- source_word: Εἰ
  choice: क्या
  rationale: प्रत्यक्ष प्रश्न में εἰ हाँ या नहीं में उत्तर दिए जाने वाले प्रश्न का परिचय देता है; हिन्दी में ‘क्या’ इसका स्वाभाविक समतुल्य है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक पद पिछले प्रसंग में कही गई बातों या आरोपों की ओर लौटता है। ‘ये बातें’ मूल की व्यापकता बनाए रखता है, जबकि ‘ये आरोप’ अधिक स्पष्ट किंतु व्याख्यात्मक है।
- source_word: οὕτως
  choice: ऐसी ही
  rationale: οὕτως कथित स्थिति के ठीक उसी प्रकार होने का भाव देता है; ‘ऐसी ही’ हिन्दी में इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔχει
  choice: हैं
  rationale: οὕτως ἔχει मुहावरे का अर्थ ‘ऐसा होना’ या ‘मामला ऐसा होना’ है; हिन्दी वाक्य में ‘हैं’ इसी मुहावरेदार अर्थ को संक्षेप में व्यक्त करता है।
