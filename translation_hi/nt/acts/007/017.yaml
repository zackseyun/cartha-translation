    text: या, “जिसका परमेश्वर ने अब्राहम से वचन दिया था”; अथवा, “जिसके संबंध में परमेश्वर ने अब्राहम के प्रति अपनी वचनबद्धता घोषित की थी।” यहाँ प्रयुक्त यूनानी क्रिया किसी घोषित वचनबद्धता का भाव दे सकती है।
