lexical_decisions:
- source_word: Καθὼς δὲ
  choice: पर जब
  rationale: καθώς समय-संबंधी उपवाक्य प्रस्तुत करता है और δέ प्रसंग में हल्का संक्रमण दिखाता है। ‘पर जब’ दोनों भावों को स्वाभाविक हिन्दी में रखता है, बिना प्रबल विरोध व्यक्त किए।
- source_word: ἤγγιζεν
  choice: निकट आने लगा
  rationale: अपूर्णकाल चल रही प्रक्रिया को सूचित करता है; यह समय के क्रमशः निकट आने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ χρόνος τῆς ἐπαγγελίας
  choice: उस प्रतिज्ञा का समय
  rationale: χρόνος सामान्य रूप से ‘समय’ और ἐπαγγελία ‘प्रतिज्ञा’ है। ‘ठहराया हुआ समय’ जोड़ना मूल में निहित से अधिक विशिष्ट अर्थ देता।
- source_word: ἧς ὡμολόγησεν ὁ θεὸς τῷ Ἀβραάμ
  choice: जो परमेश्वर ने अब्राहम से की थी
  rationale: हिन्दी में ‘प्रतिज्ञा करना’ इस वाक्य-संबंध को सहजता से व्यक्त करता है। ὁμολογέω यहाँ अब्राहम के प्रति घोषित वचनबद्धता का भाव रखता है; इसे ‘शपथ खाई थी’ कहना मूल क्रिया से अधिक प्रबल होता।
- source_word: ηὔξησεν ὁ λαὸς
  choice: वे लोग बढ़े
  rationale: λαός यहाँ इस्राएली लोगों को सामूहिक रूप से दर्शाता है। ‘वे लोग’ निकटवर्ती प्रसंग से उनका संकेत करता है, जबकि ‘बढ़े’ ηὔξησεν का सीधा और स्वाभाविक अनुवाद है।
- source_word: καὶ ἐπληθύνθη
  choice: और बहुत होते गए
  rationale: यह ηὔξησεν से भिन्न, संख्या में बहुत हो जाने का भाव बनाए रखता है। ‘होते गए’ वृद्धि की प्रगतिशील परिणति को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν Αἰγύπτῳ
  choice: मिस्र में
  rationale: यह स्थानवाचक पदबंध का मानक हिन्दी रूप है।
theological_decisions:
- issue: अब्राहम से परमेश्वर की प्रतिज्ञा के संबंध में ὡμολόγησεν का अनुवाद
  choice: ‘जो परमेश्वर ने अब्राहम से की थी’
  alternative: ‘जिसकी प्रतिज्ञा परमेश्वर ने अब्राहम से की थी’ या ‘जिसे परमेश्वर ने अब्राहम के लिए घोषित किया था’
  rationale: मुख्य पाठ का रूप आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर की घोषित वचनबद्धता को स्पष्ट करता है। ‘शपथ खाई थी’ से बचा गया है, क्योंकि वह ऐसी शपथ-संबंधी धार्मिक विशिष्टता जोड़ता जिसे यह यूनानी क्रिया स्वयं अनिवार्य नहीं करती।
