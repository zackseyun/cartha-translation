source:
  edition: SBLGNT
  text: καὶ μετετέθησαν εἰς Συχὲμ καὶ ἐτέθησαν ἐν τῷ μνήματι ⸀ᾧ ὠνήσατο Ἀβραὰμ τιμῆς ἀργυρίου παρὰ τῶν υἱῶν Ἑμμὼρ ⸀ἐν Συχέμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/016.yaml
  text: and they were carried over to Shechem and laid in the tomb that Abraham had bought for a price of silver from the sons of Hamor in Shechem[a].
translation:
  language: hi
  text: और उन्हें शकेम ले जाया गया और उस कब्र में रखा गया, जिसे अब्राहम ने शकेम में हमोर के पुत्रों से चाँदी देकर खरीदा था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्तिफनुस के कथन में ऐसे विवरण साथ आते हैं जिनकी तुलना पाठक उत्पत्ति 23 से कर सकते हैं, जहाँ अब्राहम मखपेला में एप्रोन से दफ़नाने की जगह खरीदता है, और उत्पत्ति 33:19 से, जहाँ याकूब शकेम के पास हमोर के पुत्रों से भूमि खरीदता है।
    reason: cross_reference
lexical_decisions:
- source_word: μετετέθησαν
  choice: उन्हें ... ले जाया गया
  rationale: यह रूप अवशेषों को एक स्थान से दूसरे स्थान ले जाए जाने का भाव देता है; हिन्दी में यह स्वाभाविक है और यूनानी कर्मवाच्य को बनाए रखता है।
- source_word: Συχὲμ / Συχέμ
  choice: शकेम
  rationale: इस स्थान-नाम का हिन्दी बाइबलीय परंपरा में प्रचलित और स्पष्ट लिप्यंतरण।
- source_word: ἐτέθησαν
  choice: रखा गया
  rationale: दफ़नाने के प्रसंग में यह स्वाभाविक हिन्दी है और τίθημι के ‘रखना’ अथवा ‘स्थापित करना’ भाव को व्यक्त करता है। संयुक्त कर्ता का निकटवर्ती अर्थ अवशेषों से है, इसलिए हिन्दी में एकवचन सामूहिक प्रयोग सहज है।
- source_word: μνήματι
  choice: कब्र
  rationale: μνῆμα यहाँ दफ़नाने की जगह को सूचित करता है; ‘कब्र’ साधारण आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: ᾧ
  choice: जिसे
  rationale: सम्बन्धवाचक सर्वनाम कब्र से जुड़ता है और हिन्दी वाक्य में खरीद की क्रिया का कर्म स्वाभाविक रूप से बनता है।
- source_word: ὠνήσατο
  choice: खरीदा था
  rationale: क्रिया खरीदने का अर्थ देती है; ‘था’ यह स्पष्ट करता है कि खरीद दफ़नाए जाने से पहले हुई थी।
- source_word: τιμῆς ἀργυρίου
  choice: चाँदी देकर
  rationale: यह चाँदी को खरीद की कीमत के रूप में व्यक्त करता है। शाब्दिक ‘चाँदी की कीमत के लिए’ की अपेक्षा यह आधुनिक हिन्दी में अधिक स्वाभाविक है, जबकि मूल अर्थ सुरक्षित रहता है।
- source_word: παρὰ τῶν υἱῶν Ἑμμὼρ
  choice: हमोर के पुत्रों से
  rationale: παρά के संबंध-सूचक अर्थ ‘से’ और υἱῶν के औपचारिक लेकिन सुबोध अनुवाद ‘पुत्रों’ को बनाए रखता है।
- source_word: ἐν Συχέμ
  choice: शकेम में
  rationale: अंतिम स्थानवाचक पदबंध को सीधे अनूदित किया गया है। हिन्दी शब्दक्रम में यह लेन-देन या हमोर के पुत्रों के स्थान से जुड़ सकता है, इसलिए यूनानी की कुछ संरचनात्मक अस्पष्टता बनी रहती है।
theological_decisions:
- issue: उत्पत्ति के दफ़न-स्थान और भूमि-खरीद वृत्तांतों के साथ ऐतिहासिक तनाव
  choice: 'मुख्य पाठ में स्तिफनुस के कथन को यूनानी पाठ के अनुसार यथावत रखना: अब्राहम ने शकेम में हमोर के पुत्रों से कब्र खरीदी।'
  alternative: इसे उत्पत्ति 33:19 के अनुसार याकूब की खरीद या उत्पत्ति 23 के अनुसार मखपेला में अब्राहम की खरीद से मिलाने के लिए मुख्य पाठ बदलना।
  rationale: अनुवाद का काम उपलब्ध यूनानी पाठ को प्रस्तुत करना है, न कि संबंधित पुराने नियम के वृत्तांतों से सामंजस्य बैठाने के लिए उसे संशोधित करना। पाठकों के लिए तुलना योग्य विवरण पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘कब्र’, ‘चाँदी देकर’ और कर्मवाच्य वाक्य-विन्यास मूल अर्थ को स्वाभाविक ढंग से व्यक्त करते हैं। ऐतिहासिक तनाव को मुख्य पाठ में सुधारा या सामंजस्यित नहीं किया गया है।
