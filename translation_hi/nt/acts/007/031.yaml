source:
  edition: SBLGNT
  text: ὁ δὲ Μωϋσῆς ἰδὼν ⸀ἐθαύμασεν τὸ ὅραμα. προσερχομένου δὲ αὐτοῦ κατανοῆσαι ἐγένετο φωνὴ ⸀κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/031.yaml
  text: 'When Moses saw it[a], he marveled at the sight. And as he came near to look closely[c][b], a voice of the Lord came:'
translation:
  language: hi
  text: 'जब मूसा ने यह देखा, तो वह उस दृश्य[a] पर चकित हुआ। जब वह ध्यान से देखने के लिए पास आ रहा था, तब प्रभु[c] की आवाज़ आई[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दर्शन’। यूनानी शब्द किसी दिखाई देने वाले दृश्य या दर्शन, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘प्रभु की ओर से एक आवाज़ आई।’
    reason: lexical_alternative
  - marker: c
    text: निर्गमन 3 की इस घटना के कारण कुछ पाठक यहाँ ‘यहोवा’ की अपेक्षा कर सकते हैं; पर यूनानी पाठ में ‘प्रभु’ (κύριος) है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: जब मूसा ने यह देखा
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले की घटना बताता है। ‘जब ... देखा’ हिन्दी में इस कालगत संबंध को स्वाभाविक ढंग से व्यक्त करता है; ‘यह’ अगले पदबंध में उल्लिखित दृश्य की ओर संकेत करता है।
- source_word: ἐθαύμασεν
  choice: चकित हुआ
  rationale: यहाँ θαυμάζω विस्मय या आश्चर्य व्यक्त करता है। ‘चकित हुआ’ वर्तमान मानक हिन्दी में स्वाभाविक और कथात्मक प्रसंग के अनुकूल है।
- source_word: τὸ ὅραμα
  choice: उस दृश्य
  rationale: ὅραμα किसी दिखाई देनेवाली वस्तु या दर्शन, दोनों को सूचित कर सकता है। जलती झाड़ी की प्रत्यक्ष घटना के संदर्भ में ‘दृश्य’ उपयुक्त है, जबकि पादटिप्पणी ‘दर्शन’ की वास्तविक वैकल्पिक संभावना सुरक्षित रखती है।
- source_word: προσερχομένου δὲ αὐτοῦ
  choice: जब वह ... पास आया
  rationale: यह संबंधवाचक स्वतंत्र रचना समय और साथ घट रही परिस्थिति व्यक्त करती है। हिन्दी में ‘जब वह ... पास आया’ गति और कालगत संबंध दोनों को स्पष्ट रखता है।
- source_word: κατανοῆσαι
  choice: ध्यान से देखने के लिए
  rationale: κατανοέω ध्यानपूर्वक देखने या निरीक्षण करने का भाव रखता है। यह अनुवाद दृश्य-केंद्रित प्रसंग में उस सावधानी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐγένετο φωνὴ
  choice: एक आवाज़ हुई
  rationale: ἐγένετο और संज्ञा की घटना-सूचक रचना को ‘एक आवाज़ हुई’ निकटता से दर्शाता है और ‘सुनाई दी’ जैसी अतिरिक्त श्रवणात्मक व्याख्या नहीं जोड़ता।
- source_word: κυρίου
  choice: प्रभु की ओर से
  rationale: सम्बन्धकारक κυρίου को यहाँ आवाज़ के स्रोत के रूप में समझना स्वाभाविक है। ‘प्रभु की ओर से’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है, जबकि मूल के κύριος को ‘यहोवा’ बनाकर उसकी पहचान को अनावश्यक रूप से अधिक निश्चित नहीं करता।
theological_decisions:
- issue: ईश्वरीय प्राकट्य के प्रसंग में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी पाठ में κύριος है, इब्रानी चतुरक्षरीय ईश-नाम नहीं। निर्गमन 3 की पृष्ठभूमि ‘यहोवा’ का संकेत दे सकती है, पर स्रोत-पाठ के रूप को सुरक्षित रखने के लिए ‘प्रभु’ चुना गया है।
- issue: φωνὴ κυρίου में सम्बन्धकारक का अर्थ
  choice: प्रभु की ओर से एक आवाज़
  alternative: प्रभु की आवाज़
  rationale: दोनों हिन्दी रूप यूनानी सम्बन्धकारक के अनुकूल हैं। ‘की ओर से’ आवाज़ के आने के स्रोत को स्पष्ट करता है और अगले पद में उस आवाज़ द्वारा कही गई बात की भूमिका स्वाभाविक रूप से तैयार करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सरल किंतु गरिमापूर्ण कथात्मक शैली में है। ‘दृश्य’ और ‘ध्यान से देखने’ जैसे सामान्य शब्द मूल के दृश्यात्मक बल को बनाए रखते हैं। ‘प्रभु’ यूनानी κύριος का प्रतिनिधित्व करता है; निर्गमन-संबंधी पृष्ठभूमि के कारण इसे ‘यहोवा’ में नहीं बदला गया।
