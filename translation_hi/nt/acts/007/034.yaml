source:
  edition: SBLGNT
  text: ἰδὼν εἶδον τὴν κάκωσιν τοῦ λαοῦ μου τοῦ ἐν Αἰγύπτῳ, καὶ τοῦ στεναγμοῦ ⸀αὐτοῦ ἤκουσα, καὶ κατέβην ἐξελέσθαι αὐτούς· καὶ νῦν δεῦρο ⸀ἀποστείλω σε εἰς Αἴγυπτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/034.yaml
  text: I have surely seen the mistreatment of my people in Egypt[a], and I have heard their groaning, and I have come down to deliver them. And now come[b], I will send you to Egypt.
translation:
  language: hi
  text: मैंने मिस्र में अपनी प्रजा की दुर्दशा निश्चय ही देखी है[a], और मैंने उनकी कराह सुनी है। मैं उन्हें छुड़ाने के लिए नीचे उतरा हूँ। और अब, आ, मैं तुझे मिस्र भेजूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अत्याचार’ या ‘उत्पीड़न’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν εἶδον
  choice: निश्चय ही देखा है
  rationale: कृदंत और सीमित क्रिया का यह सामी शैली का संयोजन जोर प्रकट करता है। ‘निश्चय ही देखा है’ उस बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: κάκωσιν
  choice: अत्याचार
  rationale: यह संज्ञा कठोर और अन्यायपूर्ण व्यवहार, दुर्दशा या उत्पीड़न को सूचित करती है। ‘अत्याचार’ प्रसंग में स्पष्ट और सहज है; अन्य सम्भव अर्थ फुटनोट में दिए गए हैं।
- source_word: λαοῦ μου τοῦ ἐν Αἰγύπτῳ
  choice: मिस्र में रहनेवाली अपनी प्रजा
  rationale: यह वाक्यांश परमेश्वर की प्रजा और उसके स्थान दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘अपनी प्रजा’ संबंधगत और वाचाई प्रतिध्वनि बनाए रखता है।
- source_word: τοῦ στεναγμοῦ αὐτοῦ
  choice: उनका कराहना
  rationale: यूनानी सर्वनाम एकवचन है, पर सामूहिक संज्ञा ‘प्रजा’ की ओर संकेत करता है। हिन्दी में लोगों के समूह के लिए आदरसूचक/बहुवचन ‘उनका’ स्वाभाविक है। ‘कराहना’ στεναγμός की पीड़ा-भरी ध्वनि को बनाए रखता है।
- source_word: κατέβην
  choice: नीचे उतरा हूँ
  rationale: दैवी हस्तक्षेप का मानव-सदृश वर्णन ज्यों का त्यों रखा गया है। पूर्ण वर्तमान हिन्दी में पूर्व क्रिया की वर्तमान प्रासंगिकता व्यक्त करता है।
- source_word: ἐξελέσθαι
  choice: छुड़ाने
  rationale: मध्यवाच्य रूप यहाँ संकट या दमन से निकालने/बचाने का अर्थ देता है। ‘छुड़ाने’ आधुनिक हिन्दी में स्पष्ट है और निर्गमन प्रसंग के अनुकूल है।
- source_word: δεῦρο
  choice: आ
  rationale: यह मूसा को आगे बुलाने वाला संक्षिप्त आदेश है। एकवचन ‘आ’ अगले एकवचन ‘तुझे’ के अनुरूप है और मूल की सीधी वाणी रखता है।
- source_word: ἀποστείλω
  choice: मैं तुझे ... भेजूँगा
  rationale: यूनानी भविष्यत् सूचक रूप को सीधे भविष्यकाल में रखा गया है और यह मूसा को सौंपे गए दायित्व को स्पष्ट करता है।
- source_word: εἰς Αἴγυπτον
  choice: मिस्र भेजूँगा
  rationale: गंतव्य के लिए हिन्दी में ‘मिस्र भेजूँगा’ स्वाभाविक है; अलग ‘को’ आवश्यक नहीं।
theological_decisions:
- issue: परमेश्वर के नीचे उतरने का मानव-सदृश वर्णन
  choice: मैं ... नीचे उतरा हूँ
  alternative: मैं हस्तक्षेप करने आया हूँ
  rationale: मूल पाठ दैवी कार्य को ‘नीचे उतरने’ की भाषा में व्यक्त करता है। अनुवाद इसे व्याख्यात्मक ‘हस्तक्षेप’ में बदलकर धार्मिक तनाव को समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रत्यक्ष दैवी वाणी में ‘आ’ और ‘तुझे’ मूल के एकवचन संबोधन तथा बाइबिलीय गंभीरता के अनुरूप हैं। अंग्रेज़ी परामर्श-पाठ का [b] चिह्न स्पष्टतः असंगत था, क्योंकि उसकी टिप्पणी ‘rescue/deliver’ से जुड़ी थी जबकि चिह्न ‘come’ के बाद रखा गया था; इसलिए हिन्दी में अनावश्यक [b] नहीं रखा गया।
