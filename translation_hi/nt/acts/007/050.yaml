lexical_decisions:
- source_word: οὐχὶ
  choice: क्या ... नहीं
  rationale: οὐχί ऐसे अलंकारिक प्रश्न का परिचय देता है जिसका अपेक्षित उत्तर सकारात्मक है; ‘क्या ... नहीं’ हिन्दी में इस बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἡ χείρ μου
  choice: मेरे हाथ ने ही
  rationale: χείρ का मूल अर्थ ‘हाथ’ है। यशायाह 66:2 की प्रतिध्वनि और परमेश्वर के सृजनकारी कार्य की मूर्त छवि बनाए रखने के लिए इसे अमूर्त ‘सामर्थ्य’ या केवल ‘मैंने’ नहीं किया गया। ‘ही’ कर्ता पर निहित बल को हिन्दी में स्पष्ट करता है।
- source_word: ἐποίησεν
  choice: बनाईं
  rationale: ποιέω यहाँ अस्तित्व में लाने अथवा बनाने का अर्थ देता है। ‘बनाईं’ सामान्य, वर्तमान हिन्दी में सृष्टिकर्ता के कार्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ταῦτα πάντα
  choice: ये सब वस्तुएँ
  rationale: यह अनुवाद ταῦτα के संकेतवाचक अर्थ और πάντα की समग्रता—दोनों को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के लिए मानव-अंग की भाषा
  choice: ‘मेरे हाथ’ की मूर्त अभिव्यक्ति बनाए रखी गई है
  alternative: ‘क्या मैंने ये सब वस्तुएँ नहीं बनाईं?’ अथवा ‘क्या मेरी सामर्थ्य ने ये सब वस्तुएँ नहीं बनाईं?’
  rationale: यह पंक्ति यशायाह 66:2 को प्रतिध्वनित करती है और ‘हाथ’ के द्वारा परमेश्वर की सृजनकारी क्रिया व्यक्त करती है। मूर्त भाषा को बनाए रखने से शास्त्रीय बिंब और अलंकारिक बल सुरक्षित रहते हैं, बिना उसे किसी अमूर्त धर्मवैज्ञानिक व्याख्या में बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण प्रश्न-विन्यास अपनाया गया है। ‘वस्तुएँ’ से नपुंसकलिंग बहुवचन ταῦτα का व्यापक संकेत स्पष्ट होता है; इसी कारण क्रिया ‘बनाईं’ स्त्रीलिंग बहुवचन है।
