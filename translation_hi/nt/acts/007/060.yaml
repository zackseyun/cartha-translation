  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: θεὶς δὲ τὰ γόνατα ἔκραξεν φωνῇ μεγάλῃ· Κύριε, μὴ στήσῃς αὐτοῖς ⸂ταύτην τὴν ἁμαρτίαν⸃· καὶ τοῦτο εἰπὼν ἐκοιμήθη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/060.yaml
  text: Then[a], kneeling down, he cried out with a loud voice, “Lord, do not hold this sin against them.” And after saying this[b], he fell asleep.
translation:
  language: hi
  text: फिर उसने घुटने टेककर ऊँचे स्वर से पुकारा, “हे प्रभु, यह पाप उनके विरुद्ध न गिनना।” यह कहकर वह सो गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सो गया” यहाँ मृत्यु के लिए प्रयुक्त अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὶς δὲ τὰ γόνατα
  choice: फिर उसने घुटने टेककर
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘घुटने रखना’ है; आधुनिक हिन्दी में ‘घुटने टेककर’ शारीरिक क्रिया को स्वाभाविक रूप से व्यक्त करता है। δέ कथा की अगली घटना को ‘फिर’ से जोड़ता है।
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से पुकारा
  rationale: κράζω ऊँची पुकार को और φωνῇ μεγάλῃ स्वर की प्रबलता को व्यक्त करता है; यह अनुवाद दोनों तत्वों को स्पष्ट एवं स्वाभाविक हिन्दी में रखता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन रूप को ‘हे’ सहित व्यक्त किया गया है। पिछले पद के संदर्भ में यह यीशु को सम्बोधित प्रार्थना है; ‘प्रभु’ स्थापित और उपयुक्त उपाधि है।
- source_word: μὴ στήσῃς αὐτοῖς ταύτην τὴν ἁμαρτίαν
  choice: यह पाप उनके विरुद्ध न गिनना
  rationale: यहाँ ἵστημι का अर्थ किसी के खाते में रखना या उसके विरुद्ध आरोपित करना है। ‘उनके विरुद्ध न गिनना’ न्यायिक/लेखागत भाव को बनाए रखता है और ταύτην के लिए ‘यह’ स्पष्ट रखता है।
- source_word: καὶ τοῦτο εἰπὼν
  choice: यह कहकर
  rationale: कृदन्तीय रचना को संक्षिप्त, स्वाभाविक हिन्दी में प्रस्तुत करते हुए घटनाओं का क्रम सुरक्षित रखा गया है।
- source_word: ἐκοιμήθη
  choice: वह सो गया
  rationale: κοιμάομαι यहाँ मृत्यु के लिए प्रचलित रूपक है। ‘सो गया’ मूल रूपक को बनाए रखता है; पादटिप्पणी उसका आशय स्पष्ट करती है।
theological_decisions:
- issue: ἐκοιμήθη में मृत्यु के लिए निद्रा-रूपक
  choice: वह सो गया
  alternative: उसकी मृत्यु हो गई
  rationale: मूल यूनानी मृत्यु को सीधे न कहकर सोने का रूपक इस्तेमाल करता है। रूपक सुरक्षित रखने से पाठ का धार्मिक-साहित्यिक स्वर बना रहता है, जबकि पादटिप्पणी अर्थ स्पष्ट करती है।
- issue: स्तिफनुस की प्रार्थना में Κύριε का सम्बोधन
  choice: हे प्रभु
  alternative: हे स्वामी
  rationale: संदर्भ में सम्बोधन यीशु से है। ‘प्रभु’ नए नियम की उपाधि और श्रद्धापूर्ण सम्बोधन को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
- issue: μὴ στήσῃς ... τὴν ἁμαρτίαν का न्यायिक/लेखागत भाव
  choice: यह पाप उनके विरुद्ध न गिनना
  alternative: इस पाप का दोष उन पर न लगाना
  rationale: चुना हुआ रूप पाप को किसी के खाते में गिनने अथवा उसके विरुद्ध ठहराने की मूल अर्थ-छाया को बनाए रखता है और क्षमा की प्रार्थना को अधिक व्याख्यात्मक बनाए बिना व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण। वाक्य में प्रार्थना की तीव्रता के लिए ‘ऊँचे स्वर से पुकारा’ और मृत्यु के मूल निद्रा-रूपक के लिए ‘सो गया’ रखा गया है।
