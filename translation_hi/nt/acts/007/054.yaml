- source_word: Ἀκούοντες
  choice: जब उन्होंने ... सुनीं
  rationale: परिस्थितिवाचक कृदंत को स्वाभाविक हिन्दी के कालवाचक उपवाक्य के रूप में प्रस्तुत किया गया है।
- source_word: δὲ
  choice: तो
  rationale: यहाँ δέ कथानक को आगे बढ़ाता है; हिन्दी में ‘जब ... तो’ की संरचना प्रवाह और घटनाक्रम स्पष्ट करती है, बिना अनावश्यक विरोध जोड़े।
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक शब्द स्तिफनुस के पिछले कथन की ओर संकेत करता है; ‘ये बातें’ स्वाभाविक और अर्थानुकूल है।
- source_word: διεπρίοντο
  choice: उनके हृदय भीतर तक चिर गए
  rationale: क्रिया के ‘चीर/काट डालने’ वाले सजीव बिंब को बनाए रखते हुए तीव्र आंतरिक उद्वेलन व्यक्त किया गया है। केवल ‘क्रोधित हो गए’ कहना परिणाम तो बताता, पर मूल बिंब खो देता।
- source_word: ταῖς καρδίαις αὐτῶν
  choice: उनके हृदय भीतर तक
  rationale: बहुवचन और प्रभावित आंतरिक क्षेत्र दोनों को रखा गया है। ‘भीतर तक’ हिन्दी में क्रिया की तीव्रता और अंतर्मन पर उसके प्रभाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔβρυχον τοὺς ὀδόντας
  choice: दाँत पीसने लगे
  rationale: यह हिन्दी का प्रचलित मुहावरा है, जो प्रबल क्रोध और शत्रुता का वही सजीव भाव देता है। अपूर्ण भूतकाल की जारी प्रतिक्रिया को ‘लगे’ से व्यक्त किया गया है।
- source_word: ἐπ’ αὐτόν
  choice: उस पर
  rationale: यह उनकी शत्रुतापूर्ण प्रतिक्रिया की दिशा स्तिफनुस की ओर होने को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: διεπρίοντο में आंतरिक पीड़ा और उग्र क्रोध के बीच अर्थगत तनाव
  choice: मुख्य पाठ में चीरने का रूपक रखा गया और क्रोधपरक अर्थ फुटनोट में दिया गया।
  alternative: वे मन ही मन क्रोध से तिलमिला उठे
  rationale: मूल यूनानी का सजीव रूपक केवल क्रोध का नाम लेने से अधिक खुला और तीखा है। संदर्भ उग्र क्रोध की ओर संकेत करता है, पर अनुवाद में रूपक को मिटाकर अर्थ को एक ही मनोभाव तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘हृदय भीतर तक चिर गए’ मूल की तीखी छवि को बनाए रखता है, जबकि फुटनोट सामान्य पाठक के लिए उसके क्रोधपरक संदर्भ को स्पष्ट करता है।
