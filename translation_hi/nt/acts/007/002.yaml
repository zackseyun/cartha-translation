reference: Acts 7:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Ἄνδρες ἀδελφοὶ καὶ πατέρες, ἀκούσατε· Ὁ θεὸς τῆς δόξης ὤφθη τῷ πατρὶ ἡμῶν Ἀβραὰμ ὄντι ἐν τῇ Μεσοποταμίᾳ πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/002.yaml
  text: 'And he said[a], “Brothers and fathers, listen: the God of glory appeared to our father Abraham when he was in Mesopotamia[b], before he lived in Haran.”'
translation:
  language: hi
  text: तब उसने कहा, “भाइयो और पिताओ[a], सुनिए! महिमा के परमेश्वर हमारे पिता अब्राहम को उस समय प्रकट हुए, जब वह मेसोपोटामिया में था—हारान में रहने से पहले[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “पुरुषो, भाइयो और पिताओ।” यूनानी का यह औपचारिक संबोधन स्पष्ट रूप से पुल्लिंग है।
    reason: lexical_alternative
  - marker: b
    text: या, “हारान में बसने से पहले।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: तब उसने कहा
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है। ‘तब’ प्रसंग की निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है, और ἔφη का सीधा अर्थ ‘उसने कहा’ है।
- source_word: Ἄνδρες ἀδελφοὶ καὶ πατέρες
  choice: भाइयो और पिताओ
  rationale: यह सभा को किया गया औपचारिक, स्पष्टतः पुल्लिंग संबोधन है। हिन्दी में ‘भाइयो और पिताओ’ संबंधपरक और आदरसूचक बल बनाए रखता है; ἄνδρες की अलग, शब्दशः अभिव्यक्ति पादटिप्पणी में दी गई है।
- source_word: ἀκούσατε
  choice: सुनिए
  rationale: ध्यान देने की आज्ञा है। आदरसूचक बहुवचन ‘सुनिए’ औपचारिक सभा-संबोधन के लिए स्वाभाविक है।
- source_word: Ὁ θεὸς τῆς δόξης
  choice: महिमा के परमेश्वर
  rationale: यह रूप यूनानी संबंधकारक संरचना को सुरक्षित रखता है और इसे केवल विशेषण ‘महिमामय’ में बदलकर संभावित शास्त्रीय प्रतिध्वनि को समतल नहीं करता।
- source_word: ὤφθη
  choice: प्रकट हुए
  rationale: दैवी प्रकट होने के प्रसंग में ὁράω के इस कर्मवाच्य रूप का स्वाभाविक अर्थ ‘प्रकट हुए’ है। यह ‘अपने आपको प्रकट किया’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: τῷ πατρὶ ἡμῶν Ἀβραὰμ
  choice: हमारे पिता अब्राहम के सामने
  rationale: ‘हमारे पिता अब्राहम’ सामुदायिक वंश-संबंध को बनाए रखता है। ‘के सामने’ हिन्दी में ‘उनको प्रकट हुए’ की अपेक्षा अधिक सहज ढंग से लक्ष्य-संबंध व्यक्त करता है।
- source_word: ὄντι ἐν τῇ Μεσοποταμίᾳ
  choice: जब वह मेसोपोटामिया में था
  rationale: कृदन्त का कालगत-पारिस्थितिक अर्थ स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: πρὶν ἢ κατοικῆσαι αὐτὸν ἐν Χαρράν
  choice: इससे पहले कि वह हारान में रहने लगा
  rationale: κατοικέω का अर्थ किसी स्थान में रहना या बसना हो सकता है। ‘रहने लगा’ सुबोध है और आरंभिक सीमा को व्यक्त करता है, जबकि ‘बस गया’ का विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: सभा के पुल्लिंग संबोधन का अनुवाद
  choice: भाइयो और पिताओ
  alternative: पुरुषो, भाइयो और पिताओ
  rationale: मूल का पुल्लिंग स्वरूप निष्प्रभावी नहीं किया गया। फिर भी ἄνδρες इस औपचारिक संबोधन-सूत्र में अलग अर्थ-घटक की तरह सुनाई देना आवश्यक नहीं है; उसका शब्दशः विकल्प पादटिप्पणी में सुरक्षित है।
- issue: θεὸς τῆς δόξης में दैवी उपाधि
  choice: महिमा के परमेश्वर
  alternative: महिमामय परमेश्वर
  rationale: संबंधकारक संरचना को बनाए रखने से मूल की संभावित अंतरपाठीय प्रतिध्वनि और अर्थगत खुलापन सुरक्षित रहता है।
- issue: दैवी प्रकटता के लिए ὤφθη
  choice: प्रकट हुए
  alternative: दिखाई दिए
  rationale: ‘प्रकट हुए’ दैवी-दर्शन के प्रसंग में स्वाभाविक है और यह तय नहीं करता कि अनुभव की दृश्य-विधि ठीक कैसी थी।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध स्तर रखा गया है। सभा-संबोधन में आदरसूचक ‘सुनिए’ और परमेश्वर के लिए सम्मानसूचक बहुवचन क्रिया ‘प्रकट हुए’ प्रयुक्त हुई है। स्थान-नाम ‘मेसोपोटामिया’ और ‘हारान’ प्रचलित हिन्दी रूपों में दिए गए हैं।
