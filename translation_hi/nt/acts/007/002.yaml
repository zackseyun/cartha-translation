  to: तब उसने कहा, “भाइयो और पिताओ[a], सुनिए! महिमा के परमेश्वर हमारे पिता अब्राहम को उस समय प्रकट हुए, जब वह मेसोपोटामिया में था—हारान में रहने से पहले[b]।”
  rationale: The revision removes a possible spatial reading of the Greek dative by using “अब्राहम को,” and it replaces the ingressive “रहने लगा” with a temporally precise expression. The footnote is adjusted to present a complete and meaningful alternative while preserving the same source ambiguity.
