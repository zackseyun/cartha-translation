review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the core sense accurately: Stephen begins speaking, formally addresses a male audience, commands attention, and states that the God of glory appeared to Abraham in Mesopotamia before his residence in Haran. However, “अब्राहम के सामने प्रकट हुए” can mean that God appeared in front of Abraham rather than that he appeared to Abraham; the Greek dative τῷ ... Ἀβραάμ calls for an unambiguous recipient expression. Also, “हारान में रहने लगा” adds an ingressive nuance (‘began to live’) not required by κατοικῆσαι.'
  naturalness: The register is dignified and readily understandable modern Hindi. “भाइयो और पिताओ, सुनिए” is a natural formal address. Recasting the final clause as “हारान में रहने से पहले” is both more idiomatic and closer to the source.
  terminology: “महिमा के परमेश्वर,” “हमारे पिता अब्राहम,” “मेसोपोटामिया,” and “हारान” are appropriate and consistent with the Greek and the stated translation philosophy. “परमेश्वर ... प्रकट हुए” appropriately uses respectful plural verbal agreement without adding theological interpretation.
  issues:
  - severity: medium
    issue: “हमारे पिता अब्राहम के सामने ... प्रकट हुए” is spatially ambiguous.
    rationale: The Greek τῷ πατρὶ ἡμῶν Ἀβραὰμ marks Abraham as the person to whom God appeared. In Hindi, “के सामने” can primarily denote appearance in someone’s presence. “हमारे पिता अब्राहम को प्रकट हुए” clearly expresses the dative relationship.
  - severity: low
    issue: “हारान में रहने लगा” is more ingressive than the Greek.
    rationale: κατοικῆσαι means to live/dwell/settle. The phrase “रहने लगा” can imply the start of residence. “हारान में रहने से पहले” preserves the simple temporal relation without adding that nuance.
  - severity: low
    issue: Footnote b does not retain the temporal frame of the alternative.
    rationale: Since the alternative corresponds to the full phrase “before he settled in Haran,” Hindi should read “हारान में बसने से पहले,” not merely “हारान में बस गया।”
  revised_text: तब उसने कहा, “भाइयो और पिताओ[a], सुनिए! महिमा के परमेश्वर हमारे पिता अब्राहम को उस समय प्रकट हुए, जब वह मेसोपोटामिया में था—हारान में रहने से पहले[b]।”
