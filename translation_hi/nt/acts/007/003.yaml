- source_word: ἐκ τῆς γῆς σου
  choice: अपनी भूमि से
  rationale: γῆ के व्यापक भू-क्षेत्रीय अर्थ को रखता है और आधुनिक राष्ट्र-राज्य का भाव नहीं जोड़ता।
- source_word: συγγενείας
  choice: कुटुम्ब
  rationale: यह केवल निकट परिवार नहीं, बल्कि व्यापक नातेदारी-समूह को भी सूचित कर सकता है; विकल्पों को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: δεῦρο
  choice: आ
  rationale: देइक्तिक अर्थ ‘आ’ को सुरक्षित रखा गया है; इसे केवल ‘जा’ करने से मूल की दृष्टि-दिशा मिट जाती।
- source_word: εἰς τὴν γῆν
  choice: उस भूमि में
  rationale: εἰς की भीतर की ओर गति को ‘में’ द्वारा व्यक्त किया गया है।
- source_word: ἣν ἄν σοι δείξω
  choice: जिसे मैं तुझे दिखाऊँगा
  rationale: ἄν के साथ aorist subjunctive यहाँ भविष्याभिमुख अनिश्चित संबंधवाचक अर्थ रखता है; हिन्दी भविष्यकाल इसे स्वाभाविक रूप से व्यक्त करता है, बिना संदेह का भाव जोड़े।
