- source_word: εἶπεν πρὸς αὐτόν
  choice: उससे कहा
  rationale: यूनानी पाठ के सर्वनाम को बनाए रखते हुए सामान्य कथात्मक अभिव्यक्ति दी गई है; संदर्भ में अब्राहम की पहचान स्पष्ट है।
- source_word: Ἔξελθε
  choice: निकल
