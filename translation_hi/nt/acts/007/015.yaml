  text: और याकूब मिस्र उतर गया। वह और हमारे पुरखे मर गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέβη
  choice: चला गया
  rationale: क्रिया का मूल अर्थ ‘नीचे उतरना’ है, पर मिस्र की ओर यात्रा के लिए आधुनिक हिन्दी में ‘मिस्र चला गया’ अधिक स्वाभाविक है; दिशासूचक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: Ἰακώβ
  choice: याकूब
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: εἰς Αἴγυπτον
  choice: मिस्र
  rationale: εἰς गंतव्य की ओर गति बताता है; ‘मिस्र चला गया’ हिन्दी में स्थान के भीतर जाने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐτελεύτησεν
  choice: मर गए
  rationale: τελευτάω का सीधा अर्थ ‘मरना’ है। संयुक्त कर्ता ‘वह और हमारे पुरखे’ के कारण हिन्दी में बहुवचन क्रिया स्वाभाविक है।
- source_word: αὐτὸς
  choice: वह
  rationale: यूनानी के स्पष्ट सर्वनाम को बनाए रखते हुए याकूब को आगे जोड़े गए कर्ता से संबद्ध किया गया है।
- source_word: οἱ πατέρες ἡμῶν
  choice: हमारे पुरखे
  rationale: यह पद इस्राएल के पहले के पुरुष पूर्वजों को दर्शाता है। ‘पुरखे’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी के पुरुषवाचक ऐतिहासिक संदर्भ को बनाए रखता है।
theological_decisions:
- issue: इस्राएल के पैतृक इतिहास में πατέρες का अनुवाद
  choice: हमारे पुरखे
  alternative: हमारे पूर्वज / हमारे पिता
  rationale: ‘पुरखे’ सामान्य वंशावली से अधिक इस्राएल के ऐतिहासिक पितृपुरुषों की ओर संकेत करता है। यह यूनानी के पुरुषवाचक अर्थ को सुरक्षित रखते हुए ‘हमारे पिता’ की सम्भावित आधुनिक गलतफहमी से बचता है।
translation_notes:
  register: भाषा आधुनिक, सीधी और सार्वजनिक पाठ के योग्य रखी गई है। दो छोटे वाक्य यूनानी की क्रमिक रचना को स्पष्ट बनाते हैं; ‘फिर’ दूसरे καί के कथात्मक क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
