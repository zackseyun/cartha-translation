source:
  edition: SBLGNT
  text: ἐλάλησεν ⸀δὲ οὕτως ὁ θεὸς ὅτι ἔσται τὸ σπέρμα αὐτοῦ πάροικον ἐν γῇ ἀλλοτρίᾳ, καὶ δουλώσουσιν αὐτὸ καὶ κακώσουσιν ἔτη τετρακόσια·
base_translation:
  language: en
  yaml_path: translation/nt/acts/007/006.yaml
  text: 'But God spoke in this way: that his offspring would be a foreign resident in a strange land[a], and they would enslave it and mistreat it for four hundred years.'
translation:
  language: hi
  text: परन्तु परमेश्वर ने इस प्रकार कहा कि उसका वंश पराए देश में परदेशी बनकर रहेगा[a], और वे उसे दास बनाएँगे और चार सौ वर्ष तक उसके साथ दुर्व्यवहार करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अधिक मुहावरेदार ढंग से: ‘उसके वंशज पराए देश में परदेशियों के रूप में रहेंगे, और वे उन्हें दास बनाएँगे और चार सौ वर्ष तक उनके साथ दुर्व्यवहार करेंगे।’ यूनानी में ‘वंश’ और उसके लिए प्रयुक्त सर्वनाम सामूहिक एकवचन में हैं।'
    reason: सामूहिक एकवचन का अधिक मुहावरेदार बहुवचन विकल्प स्पष्ट करना, बिना यूनानी के अनिर्दिष्ट कर्ता को ‘वहाँ के लोग’ कहकर अधिक विशिष्ट बनाए।
lexical_decisions:
- source_word: ἐλάλησεν δὲ οὕτως ὁ θεὸς
  choice: परन्तु परमेश्वर ने इस प्रकार कहा
  rationale: δέ को प्रसंग के विकास में हलके विरोध के रूप में ‘परन्तु’ और οὕτως को स्पष्ट रूप से ‘इस प्रकार’ रखा गया है।
- source_word: τὸ σπέρμα αὐτοῦ
  choice: उसका वंश
  rationale: σπέρμα यहाँ इब्राहीम की भावी संतान के लिए सामूहिक एकवचन है। ‘वंश’ हिन्दी में इस सामूहिक और एकवचन रूप को स्वाभाविक ढंग से बनाए रखता है।
- source_word: πάροικον ἐν γῇ ἀλλοτρίᾳ
  choice: पराए देश में परदेशी बनकर रहेगा
  rationale: πάροικος ऐसे व्यक्ति या समुदाय को सूचित करता है जो अपने देश से बाहर निवासी हो, और ἀλλοτρία उस भूमि के अपना न होने पर बल देता है। यह अभिव्यक्ति दोनों पहलुओं को सहज हिन्दी में रखती है।
- source_word: δουλώσουσιν αὐτό
  choice: वे उसे दास बनाएँगे
  rationale: δουλόω का अर्थ दासत्व में करना है; ‘दास बनाएँगे’ इसे सीधे व्यक्त करता है। αὐτό के एकवचन को सामूहिक ‘वंश’ के अनुरूप ‘उसे’ से सुरक्षित रखा गया है।
- source_word: κακώσουσιν
  choice: उसके साथ दुर्व्यवहार करेंगे
  rationale: κακόω यहाँ कष्ट देने और बुरा व्यवहार करने का व्यापक अर्थ रखता है; ‘दुर्व्यवहार करेंगे’ बिना अनावश्यक विशिष्टीकरण के यही भाव देता है।
- source_word: ἔτη τετρακόσια
  choice: चार सौ वर्ष तक
  rationale: मूल का कालावधि-सूचक कर्मकारक हिन्दी में स्वाभाविक रूप से ‘तक’ द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: इब्राहीम के वंश के लिए सामूहिक एकवचन
  choice: मुख्य पाठ में ‘उसका वंश … उसे … उसके साथ’ रखा गया है।
  alternative: ‘उसके वंशज … उन्हें … उनके साथ’
  rationale: यूनानी में σπέρμα और αὐτό सामूहिक एकवचन हैं। हिन्दी का ‘वंश’ मूल की इस विशेषता को अंग्रेज़ी की अपेक्षा अधिक स्वाभाविक ढंग से बनाए रख सकता है; बहुवचन अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘पराया देश’ भूमि के अपना न होने का भाव देता है, जबकि ‘परदेशी बनकर रहेगा’ अस्थायी अथवा गैर-मूल निवासी की स्थिति व्यक्त करता है।
