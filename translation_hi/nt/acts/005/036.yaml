source:
  edition: SBLGNT
  text: πρὸ γὰρ τούτων τῶν ἡμερῶν ἀνέστη Θευδᾶς, λέγων εἶναί τινα ἑαυτόν, ᾧ ⸀προσεκλίθη ⸂ἀνδρῶν ἀριθμὸς ὡς⸃ τετρακοσίων· ὃς ἀνῃρέθη, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διελύθησαν καὶ ἐγένοντο εἰς οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: hi
  text: क्योंकि इन दिनों से पहले थियूदास उठ खड़ा हुआ और अपने को कोई बड़ा व्यक्ति कहता था। लगभग चार सौ पुरुषों का एक दल उसके साथ जा मिला[a]। वह मार डाला गया, और जितने लोग उसकी बात से राज़ी हुए थे[b], वे सब तितर-बितर हो गए और किसी काम के न रहे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उससे जा मिले” अथवा “उसके पक्ष में हो गए।”
    reason: lexical_alternative
  - marker: b
    text: या, “जितने लोग उसके द्वारा राज़ी किए गए थे” अथवा “उसके द्वारा प्रभावित हुए थे।”
    reason: lexical_alternative
  - marker: c
    text: अधिक शाब्दिक रूप में, “वे कुछ न रह गए।” यह मुहावरा उनके दल और प्रयत्न के विफल होकर समाप्त हो जाने को बताता है।
    reason: idiom_clarification
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: क्योंकि इन दिनों से पहले
  rationale: πρό कालगत पूर्वता और γάρ गमलीएल के तर्क का कारणसूचक संबंध व्यक्त करता है; 'इन दिनों' demonstrative phrase को निकटता से रखता है।
- source_word: ἀνέστη Θευδᾶς
  choice: थियूदास उठ खड़ा हुआ
  rationale: यहाँ ἀνέστη किसी अगुआ के उभरने को दर्शाता है, पुनरुत्थान को नहीं; 'उठ खड़ा हुआ' उसका आलंकारिक बल बनाए रखता है।
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: अपने आपको कोई बड़ा व्यक्ति बताने लगा
  rationale: τινα ἑαυτόν ऐसा मुहावरा है जिसमें व्यक्ति अपने महत्त्वपूर्ण होने का दावा करता है; हिन्दी में केवल 'कोई व्यक्ति' कहना अभिप्रेत आत्म-महत्त्व स्पष्ट नहीं करता।
- source_word: ᾧ προσεκλίθη
  choice: उसके साथ हो गए
  rationale: यह लोगों के किसी अगुआ से जुड़ने या उसके पक्ष में आ जाने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: लगभग चार सौ पुरुष
  rationale: ὡς अनुमान व्यक्त करता है और ἀνδρῶν विशेष रूप से पुरुषों का संकेत देता है।
- source_word: ὃς ἀνῃρέθη
  choice: वह मार डाला गया
  rationale: ἀναιρέω यहाँ हत्या किए जाने का अर्थ देता है और हिन्दी कर्मवाच्य यूनानी कर्मवाच्य को सुरक्षित रखता है।
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: जितने लोग उसकी बात मानकर उसके पीछे हो लिए थे
  rationale: ἐπείθοντο में उसके द्वारा कायल किए जाने अथवा उसकी बात मानने की बारीकी है; यह रूप उस संबंध को सामान्य 'अनुयायी' से अधिक स्पष्ट रखता है।
- source_word: διελύθησαν
  choice: तितर-बितर हो गए
  rationale: यह समूह के बिखरने और आंदोलन के विघटन का स्वाभाविक हिन्दी चित्र देता है।
- source_word: ἐγένοντο εἰς οὐδέν
  choice: उनका आंदोलन मिट गया
  rationale: शाब्दिक मुहावरे 'कुछ न रह गए' का आशय पूरे प्रयास अथवा आंदोलन के निष्फल होकर समाप्त होने से है; मुख्य पाठ में स्पष्टता के लिए निहित संदर्भ व्यक्त किया गया है और अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: गमलीएल के भाषण में थियूदास का ऐतिहासिक उल्लेख
  choice: विवरण को गमलीएल के तर्क के अंग के रूप में सीधे प्रस्तुत करना
  alternative: ऐतिहासिक अनिश्चितता सूचित करने या बाहरी कालक्रम से सामंजस्य बैठाने के लिए पाठ में परिवर्तन करना
  rationale: यूनानी पाठ इस उदाहरण को बिना किसी संपादकीय योग्यता के प्रस्तुत करता है; अनुवाद को न तो ऐतिहासिक निर्णय जोड़ना चाहिए, न सामंजस्य स्थापित करना चाहिए।
- issue: ἐγένοντο εἰς οὐδέν में विनाश का विषय
  choice: संदर्भानुसार आंदोलन के मिट जाने को व्यक्त करना
  alternative: व्यक्तियों को 'कुछ न रह गए' कहना
  rationale: मुहावरा लोगों के अस्तित्वहीन होने के बजाय उनके सामूहिक प्रयास के विफल और समाप्त होने को दर्शाता है; पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। 'थियूदास' यूनानी Θευδᾶς का निकट देवनागरी लिप्यंतरण है। वाक्य में गमलीएल के कारणसूचक 'क्योंकि' को बनाए रखा गया है और ऐतिहासिक उल्लेख पर कोई बाहरी टिप्पणी मुख्य पाठ में नहीं जोड़ी गई।
