base_translation:
  language: en
  yaml_path: translation/nt/acts/005/026.yaml
  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: hi
  text: तब मन्दिर का सेनापति[a] पहरेदारों के साथ गया और प्रेरितों को ले आया। उन्होंने बल प्रयोग नहीं किया, क्योंकि उन्हें डर था कि लोग उन्हें पत्थर मारेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यानी मन्दिर की व्यवस्था की देखरेख करने वाला अधिकारी।
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατηγὸς
  choice: मन्दिर का सेनापति
  rationale: प्रेरितों के काम में यह शब्द मन्दिर की व्यवस्था के प्रभारी अधिकारी को सूचित करता है, रोमी सेनापति को नहीं। प्रसंग स्पष्ट करने के लिए ‘मन्दिर का’ जोड़ा गया है।
- source_word: ὑπηρέταις
  choice: पहरेदारों
  rationale: यहाँ इससे सेनापति के साथ जाने वाले अधीनस्थ मन्दिर-कर्मी अभिप्रेत हैं; ‘पहरेदार’ आधुनिक हिन्दी में उनकी सुरक्षा और हिरासत सम्बन्धी भूमिका स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἤγαγεν αὐτούς
  choice: प्रेरितों को ले आया
  rationale: ἄγω का अर्थ ले जाना या ले आना है। पिछले प्रसंग में प्रेरितों की पहचान स्पष्ट है, इसलिए हिन्दी में सर्वनाम की सम्भावित अस्पष्टता दूर करने के लिए ‘प्रेरितों’ कहा गया है; गन्तव्य को अनावश्यक रूप से निर्दिष्ट नहीं किया गया।
- source_word: οὐ μετὰ βίας
  choice: उन्होंने बल प्रयोग नहीं किया
  rationale: यह वाक्यांश कार्रवाई के ढंग को बताता है। स्वतंत्र हिन्दी उपवाक्य मूल के आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐφοβοῦντο γὰρ τὸν λαόν
  choice: क्योंकि उन्हें डर था कि लोग
  rationale: अपूर्ण भूतकाल उस समय बने हुए भय को दर्शाता है। हिन्दी में ‘उन्हें डर था’ सहज है, और λαός के लिए ‘लोग’ प्रसंगानुकूल है।
- source_word: μὴ λιθασθῶσιν
  choice: उन्हें पत्थरवाह कर देंगे
  rationale: भय-सूचक क्रिया के बाद μή और सम्भावनार्थक रूप आशंकित परिणाम बताते हैं। हिन्दी में यह उस आशंका को स्वाभाविक रूप से व्यक्त करता है; ‘उन्हें’ का संकेत सेनापति और पहरेदारों की ओर है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पत्थरवाह’ बाइबिलीय और न्यायिक प्रसंग में प्रचलित संक्षिप्त पद है। मुख्य पाठ में पदाधिकारी की मन्दिर-संबन्धी भूमिका स्पष्ट की गई है और पादटिप्पणी उसके कार्य को समझाती है।
