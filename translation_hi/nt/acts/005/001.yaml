  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: hi
  text: लेकिन हनन्याह नाम के एक व्यक्ति ने अपनी पत्नी सफीरा के साथ एक संपत्ति[a] बेच दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जायदाद”; यूनानी शब्द का अर्थ व्यापक रूप से किसी के अधिकार में रखी हुई वस्तु, संपत्ति या अचल संपत्ति हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ ... τις
  choice: एक व्यक्ति
  rationale: यह पदबंध कथा में एक पुरुष पात्र का परिचय देता है। आधुनिक हिन्दी में ‘एक व्यक्ति’ स्वाभाविक है; वैवाहिक संबंध आगे ‘अपनी पत्नी’ से स्पष्ट हो जाता है।
- source_word: δέ
  choice: लेकिन
  rationale: यह पिछले प्रसंग में बरनबास के कार्य और अब आने वाले विपरीत उदाहरण के बीच हल्का किंतु वास्तविक विरोध प्रकट करता है।
- source_word: Ἁνανίας ὀνόματι
  choice: हनन्याह नाम के
  rationale: ὀνόματι का मुहावरेदार अर्थ ‘नाम के’ है; ‘हनन्याह’ हिन्दी बाइबलीय प्रयोग में प्रचलित नाम-रूप है।
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: अपनी पत्नी सफीरा के साथ
  rationale: σύν साथ होने को और γυνή इस संबंध में स्पष्ट रूप से ‘पत्नी’ को दर्शाता है। हिन्दी में संबंधसूचक वाक्यांश को नाम से पहले रखना सहज है।
- source_word: ἐπώλησεν
  choice: बेच दी
  rationale: πωλέω का सीधा अर्थ ‘बेचना’ है। स्त्रीलिंग ‘संपत्ति’ के अनुरूप ‘बेच दी’ स्वाभाविक कथात्मक भूतकाल है।
- source_word: κτῆμα
  choice: अपनी एक संपत्ति
  rationale: κτῆμα किसी अधिकार में रखी वस्तु, संपत्ति या अचल संपत्ति को सूचित कर सकता है। ‘संपत्ति’ इसके व्यापक अर्थ को बनाए रखता है और ‘ज़मीन’ कहकर अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: पिछले बरनबास-वृत्तांत से कथात्मक विरोध
  choice: δέ का अनुवाद ‘लेकिन’
  alternative: ‘अब’ या ‘और’
  rationale: निकटवर्ती संदर्भ में बरनबास के सकारात्मक उदाहरण के बाद हनन्याह और सफीरा का विपरीत उदाहरण आता है। ‘लेकिन’ इस प्रवचनात्मक विरोध को व्यक्त करता है, बिना आगे के छल को इस पद में समय से पहले जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘एक पुरुष’ की अपेक्षा ‘एक व्यक्ति’ सामान्य हिन्दी में अधिक स्वाभाविक है, जबकि ‘अपनी पत्नी’ से उसका पुरुष होना स्पष्ट है। ‘संपत्ति’ जानबूझकर व्यापक रखा गया है ताकि यूनानी शब्द को केवल भूमि तक सीमित न किया जाए।
