lexical_decisions:
- source_word: Οἱ δὲ
  choice: परन्तु … वे
  rationale: δέ कथा में प्रेरितों के कथन से परिषद की विरोधी प्रतिक्रिया की ओर मोड़ दिखाता है; substantival article का स्वाभाविक हिन्दी रूप ‘वे’ है।
- source_word: ἀκούσαντες
  choice: यह सुनकर
  rationale: अओरिस्ट कृदन्त को समयसूचक रूप में रखा गया है; ‘यह’ पिछले कथन की ओर संकेत करता है, जो यूनानी में प्रसंग से निहित है।
- source_word: διεπρίοντο
  choice: क्रोध से तिलमिला उठे
  rationale: क्रिया का शाब्दिक बिंब चीरने या आरी से काटे जाने का है, पर यहाँ वह हत्या की इच्छा तक पहुँचने वाली तीव्र, शत्रुतापूर्ण उत्तेजना बताती है। यह हिन्दी मुहावरा उस भाव को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: ἐβούλοντο
  choice: चाहते थे
  rationale: अपूर्णकालीन क्रिया उनकी चल रही इच्छा या मंशा को व्यक्त करती है; ‘चाहते थे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀνελεῖν
  choice: मार डालना
  rationale: इस प्रसंग में ἀναιρέω का अर्थ किसी का प्राण लेना है; ‘मार डालना’ सीधा और स्पष्ट है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: सर्वनाम पूछताछ के सामने खड़े प्रेरितों की ओर संकेत करता है।
