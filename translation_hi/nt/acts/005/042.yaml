id: ACT.5.42
reference: Acts 5:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: hi
  text: और वे हर दिन मंदिर में और घर-घर जाकर शिक्षा देने और यह शुभ समाचार सुनाने से नहीं रुकते थे कि यीशु मसीह हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “यीशु मसीह का शुभ समाचार सुनाते थे” अथवा “यीशु को मसीह घोषित करते थे” भी हो सकता है।
    reason: τὸν χριστὸν Ἰησοῦν वाक्यांश को घोषणा की विषयवस्तु अथवा εὐαγγελιζόμενοι के कर्मवत पद के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: और वे हर दिन
  rationale: ‘हर दिन’ समय की निरंतर और नियमित पुनरावृत्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘और’ पिछले वृत्तांत से τε के संबंध को बनाए रखता है।
- source_word: ἐν τῷ ἱερῷ
  choice: मंदिर में
  rationale: ἱερόν मंदिर के पूरे परिसर को सूचित कर सकता है। ‘मंदिर में’ संक्षिप्त और स्वाभाविक है तथा अनावश्यक रूप से किसी खास भाग को निर्धारित नहीं करता।
- source_word: κατ’ οἶκον
  choice: घर-घर जाकर
  rationale: κατά के वितरणात्मक भाव को ‘घर-घर’ स्पष्ट रूप से व्यक्त करता है; ‘जाकर’ हिन्दी में मंदिर और निजी घरों में होने वाली गतिविधि के बीच स्वाभाविक संबंध बनाता है।
- source_word: οὐκ ἐπαύοντο
  choice: नहीं रुकते थे
  rationale: अपूर्ण भूतकालीन क्रिया निरंतर जारी गतिविधि को दिखाती है। ‘नहीं रुकते थे’ स्पष्ट आधुनिक हिन्दी में मूल निषेध और निरंतरता दोनों बनाए रखता है।
- source_word: διδάσκοντες
  choice: शिक्षा देने
  rationale: यह प्रेरितों द्वारा जारी शिक्षण को सामान्य, बोधगम्य और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: εὐαγγελιζόμενοι
  choice: शुभ समाचार सुनाने
  rationale: क्रिया का अर्थ शुभ समाचार घोषित करना है। ‘शुभ समाचार सुनाना’ सामान्य पाठक के लिए सहज है और प्रचारात्मक अर्थ को बनाए रखता है।
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: कि यीशु ही मसीह हैं
  rationale: यह वाक्यांश घोषणा की विषयवस्तु के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है। ‘ही’ यीशु की मसीही पहचान के विधेयात्मक बल को स्पष्ट करता है, जबकि वैकल्पिक वस्तु-संबंधी पाठ फुटनोट में सुरक्षित है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / क्राइस्ट
  rationale: यहाँ Χριστός यीशु की उपाधि और पहचान को व्यक्त करता है, इसलिए अर्थानुवाद ‘मसीह’ केवल लिप्यंतरण की अपेक्षा स्रोत का आशय अधिक स्पष्ट रूप से रखता है।
- issue: εὐαγγελιζόμενοι के बाद τὸν χριστὸν Ἰησοῦν का वाक्यगत संबंध
  choice: घोषणा की विषयवस्तु—‘कि यीशु ही मसीह हैं’
  alternative: प्रत्यक्ष कर्मवत—‘यीशु मसीह का शुभ समाचार सुनाना’ अथवा ‘यीशु को मसीह घोषित करना’
  rationale: यूनानी वाक्यांश को घोषणा की विषयवस्तु या वस्तु-संबंधी पद के रूप में समझा जा सकता है। मुख्य पाठ स्वाभाविक हिन्दी में प्रमुख अर्थ देता है और वास्तविक वाक्यगत विकल्प को फुटनोट में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘घर-घर जाकर’ वितरणात्मक भाव स्पष्ट करता है, और ‘नहीं रुकते थे’ मूल की निरंतरता तथा निषेध दोनों सुरक्षित रखता है।
