translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण संवादात्मक रूप। ‘तुम दोनों’ यूनानी बहुवचन और पति-पत्नी के निकट संदर्भ को स्पष्ट करता है; स्त्री से सीधा संबोधन होने के कारण ‘तुम’ स्वाभाविक है। किसी पंथगत व्याख्या को नहीं जोड़ा गया।
