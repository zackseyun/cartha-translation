base_translation:
  language: en
  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: hi
  text: पर पतरस ने उत्तर में उससे कहा, “मुझे बताओ, क्या तुम दोनों ने यह ज़मीन[a] इतनी ही रकम में बेची थी?” उसने कहा, “हाँ, इतनी ही रकम में।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “संपत्ति” या “खेत” (यूनानी: χωρίον)।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν Πέτρος
  choice: पर पतरस ने उससे कहा
  rationale: δέ कथा में मोड़ दर्शाता है, इसलिए ‘पर’ स्वाभाविक है। ἀπεκρίθη का मूल अर्थ ‘उत्तर दिया’ है, पर यहाँ स्त्री ने तत्काल कोई प्रश्न नहीं किया था; हिन्दी संवाद में ‘उससे कहा’ अधिक स्वाभाविक ढंग से उत्तरात्मक संबोधन को व्यक्त करता है।
- source_word: Εἰπέ μοι
  choice: मुझे बताओ
  rationale: आज्ञार्थक वाक्यांश का सीधा, वर्तमान हिन्दी रूप।
- source_word: εἰ
  choice: क्या
  rationale: εἰ यहाँ हाँ-या-नहीं वाले अप्रत्यक्ष प्रश्न को आरम्भ करता है; हिन्दी प्रत्यक्ष संवाद में ‘क्या’ इसका स्वाभाविक रूप है।
- source_word: τοσούτου
  choice: इतने ही में
  rationale: यह पहले उल्लिखित रकम की ओर संकेत करता है। ‘ही’ पूछी जा रही ठीक उसी राशि पर बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ χωρίον
  choice: वह भूमि
  rationale: χωρίον यहाँ जमीन के एक भूखंड या संपत्ति को सूचित करता है। ‘भूमि’ संदर्भ में स्पष्ट है और ‘खेत’ जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: ἀπέδοσθε
  choice: तुम दोनों ने ... बेची थी
  rationale: व्यावसायिक संदर्भ में ἀποδίδωμι का अर्थ ‘बेचना’ है। क्रिया द्वितीय पुरुष बहुवचन है और प्रसंग में सफीरा तथा उसके पति को संबोधित करती है; आधुनिक हिन्दी में द्विवचन न होने से ‘तुम दोनों’ संख्या को स्पष्ट करता है।
- source_word: Ναί, τοσούτου
  choice: हाँ, इतने ही में
  rationale: संक्षिप्त सकारात्मक उत्तर और मूल की पुनरावृत्ति दोनों सुरक्षित रखे गए हैं।
