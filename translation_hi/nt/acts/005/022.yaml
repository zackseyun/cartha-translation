translation:
  language: hi
  text: पर जब अधिकारी वहाँ पहुँचे, तो उन्होंने उन्हें कारागार में नहीं पाया। इसलिए वे लौटकर सूचना दी,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: वहाँ पहुँचे
  rationale: कृदंत पहरेदारों के कारागार पहुँचने का समय बताता है। ‘वहाँ पहुँचे’ आधुनिक हिन्दी में स्वाभाविक है और संदर्भित स्थान को स्पष्ट करता है।
- source_word: ὑπηρέται
  choice: पहरेदार
  rationale: यहाँ शब्द यहूदी अगुओं के अधीन भेजे गए आधिकारिक सेवकों के लिए है। निकटवर्ती कारागार-संदर्भ में ‘पहरेदार’ सहज है, जबकि ‘मन्दिर के प्रहरी’ यूनानी पाठ से अधिक विशिष्ट होता।
- source_word: οὐχ εὗρον
  choice: नहीं पाया
  rationale: कथात्मक संदर्भ में εὑρίσκω का सीधा और स्वाभाविक हिन्दी प्रतिरूप।
- source_word: ἐν τῇ φυλακῇ
  choice: कारागार में
  rationale: निश्चित उपपद पहले से उल्लिखित कारागार की ओर संकेत करता है; हिन्दी संदर्भ में बिना प्रदर्शनवाचक विशेषण के भी यह विशिष्टता स्वाभाविक रूप से बनी रहती है।
- source_word: ἀναστρέψαντες
  choice: लौटकर
  rationale: कृदंत भेजनेवालों के पास वापस जाने की पूर्ववर्ती क्रिया व्यक्त करता है; ‘लौटकर’ संक्षिप्त और मुहावरेदार है।
- source_word: ἀπήγγειλαν
  choice: यह समाचार देने लगे
  rationale: क्रिया आधिकारिक रूप से सूचना पहुँचाने को दर्शाती है। अगले पद में प्रत्यक्ष सूचना आने के कारण ‘यह समाचार देने लगे’ वाक्य को स्वाभाविक रूप से खुला रखता है।
- source_word: δέ
  choice: पर / इसलिए
  rationale: पहला δέ अपेक्षा के विपरीत परिणाम को दिखाता है, इसलिए ‘पर’; दूसरा हल्का संयोजक है और हिन्दी में घटनाक्रम का परिणाम ‘इसलिए’ से स्वाभाविक बनता है।
