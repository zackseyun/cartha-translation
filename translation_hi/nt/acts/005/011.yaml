source:
  edition: SBLGNT
  text: καὶ ἐγένετο φόβος μέγας ἐφ’ ὅλην τὴν ἐκκλησίαν καὶ ἐπὶ πάντας τοὺς ἀκούοντας ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/011.yaml
  text: And great fear came upon the whole church and upon all who heard these things[a].
translation:
  language: hi
  text: और पूरी कलीसिया[a] पर और उन सभी पर, जिन्होंने ये बातें सुनीं, बड़ा भय छा गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सभा’ अथवा ‘मंडली’।
    reason: ἐκκλησία के वैध शाब्दिक विकल्पों को दर्शाने के लिए।
lexical_decisions:
- source_word: ἐγένετο
  choice: छा गया
  rationale: φόβος के साथ यह क्रिया किसी समुदाय पर भय के आ पड़ने या व्याप्त हो जाने को व्यक्त करती है। ‘छा गया’ घटना की इस शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: φόβος μέγας
  choice: बड़ा भय
  rationale: हनन्याह और सफीरा पर आए न्याय के तुरंत बाद प्रसंग में φόβος मुख्यतः भय या दहशत का भाव रखता है; μέγας उसकी तीव्रता बताता है। ‘बड़ा भय’ मूल अभिव्यक्ति के सीधे और गंभीर स्वर को सुरक्षित रखता है।
- source_word: ἐφ’ ὅλην τὴν ἐκκλησίαν
  choice: पूरी कलीसिया पर
  rationale: ἐκκλησία यहाँ विश्वासियों के पूरे समुदाय को दर्शाता है और ὅλην उसके सर्वसमावेशी प्रभाव पर बल देता है। ἐπί का संबंध हिन्दी में ‘पर ... छा गया’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: πάντας τοὺς ἀκούοντας ταῦτα
  choice: उन सभी पर, जिन्होंने ये बातें सुनीं
  rationale: यह पदबंध उन सब लोगों को समेटता है जिन्हें इन घटनाओं का समाचार मिला। ‘ये बातें’ बहुवचन ταῦτα को बनाए रखता है, और ‘जिन्होंने ... सुनीं’ प्रसंगानुकूल हिन्दी है।
theological_decisions:
- issue: ἐκκλησία का अनुवाद
  choice: कलीसिया
  alternative: सभा या मंडली
  rationale: प्रेरितों के काम में यह शब्द यहाँ मसीही विश्वासियों के समुदाय का द्योतक है। ‘कलीसिया’ हिन्दी बाइबलीय प्रयोग में इस संदर्भ का परिचित शब्द है, जबकि पादटिप्पणी मूल शब्द के व्यापक अर्थ-क्षेत्र को खुला रखती है और किसी विशिष्ट संस्थागत कलीसियाशास्त्र को नहीं जोड़ती।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। दो बार आए ἐπί को ‘पर ... और ... पर’ के रूप में बनाए रखा गया है, जिससे भय के दोनों समूहों—पूरी कलीसिया और अन्य सुनने वालों—पर पड़ने वाला प्रभाव स्पष्ट रहता है।
