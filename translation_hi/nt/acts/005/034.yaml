source:
  edition: SBLGNT
  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: hi
  text: परन्तु महासभा[a] में गमलीएल नाम का एक फरीसी उठ खड़ा हुआ। वह व्यवस्था का शिक्षक और सभी लोगों द्वारा सम्मानित था। उसने आज्ञा दी कि उन पुरुषों को थोड़ी देर के लिए बाहर भेज दिया जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “महासभा” से यहूदियों की शासकीय परिषद, अर्थात् सनहेद्रिन, का आशय है।
    reason: cultural_note
  - marker: b
    text: यूनानी में शाब्दिक रूप से “उन पुरुषों को थोड़ी देर के लिए बाहर करना” है; यह उन्हें अस्थायी रूप से सभा से बाहर भिजवाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: उठ खड़ा हुआ
  rationale: यह सभा के बीच सार्वजनिक रूप से खड़े होकर बोलने की तैयारी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δέ
  choice: परन्तु
  rationale: यह पिछले प्रसंग से हल्का विरोध और गमलीएल के हस्तक्षेप के कारण कथा में आए मोड़ को दिखाता है।
- source_word: συνεδρίῳ
  choice: महासभा
  rationale: यह यहूदी शासकीय परिषद, अर्थात सनहेद्रिन, के लिए हिन्दी में प्रचलित और बोधगम्य पद है; सांस्कृतिक पहचान पादटिप्पणी में स्पष्ट की गई है।
- source_word: Φαρισαῖος ὀνόματι Γαμαλιήλ
  choice: गमलीएल नाम का एक फरीसी
  rationale: यह नए पात्र का परिचय सहज हिन्दी में देता और उसकी धार्मिक-सामाजिक पहचान बनाए रखता है।
- source_word: νομοδιδάσκαλος
  choice: व्यवस्था का शिक्षक
  rationale: यह मूसा की व्यवस्था सिखाने वाले व्यक्ति का सीधा और स्थापित वर्णन है।
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: सभी लोगों में सम्मानित
  rationale: यह उसके व्यापक सार्वजनिक आदर को व्यक्त करता है और यूनानी पाठ से आगे बढ़कर ‘इस्राएल’ नहीं जोड़ता।
- source_word: ἐκέλευσεν
  choice: आज्ञा दी
  rationale: न्यायिक सभा में दिए गए उसके अधिकारपूर्ण निर्देश का उपयुक्त हिन्दी रूप है।
- source_word: τοὺς ἀνθρώπους
  choice: उन पुरुषों
  rationale: संदर्भ में यह परिषद के सामने उपस्थित पुरुष प्रेरितों की ओर संकेत करता है; इसलिए लिंग-सटीक रूप रखा गया है।
- source_word: ἔξω βραχὺ ... ποιῆσαι
  choice: थोड़ी देर के लिए बाहर कर दिया जाए
  rationale: यूनानी मुहावरे का अर्थ उन्हें अस्थायी रूप से सभा से बाहर करवाना है; हिन्दी का कर्मवाच्य उस आदेश को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: τοὺς ἀνθρώπους का लिंग-सूचक संदर्भ
  choice: उन पुरुषों
  alternative: उन लोगों
  rationale: यहाँ संकेत सामान्य मानवजाति या मिश्रित समूह की ओर नहीं, बल्कि परिषद के सामने खड़े पुरुष प्रेरितों की ओर है; अतः मूल का लिंग-सूचक भाव बनाए रखा गया है।
- issue: συνέδριον की संस्थागत पहचान
  choice: महासभा, पादटिप्पणी में यहूदी शासकीय परिषद/सनहेद्रिन की पहचान सहित
  alternative: मुख्य पाठ में सीधे ‘सनहेद्रिन’
  rationale: ‘महासभा’ मूल पद का अर्थ पाठक के लिए स्पष्ट रखता है, जबकि पादटिप्पणी ऐतिहासिक संस्था की सटीक पहचान देती है और मुख्य पाठ को अनावश्यक रूप से तकनीकी नहीं बनाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘व्यवस्था’ बाइबलीय संदर्भ में मूसा की व्यवस्था के लिए परिचित पद है। छोटे वाक्यों से गमलीएल का परिचय और उसका आदेश स्पष्ट रखा गया है।
