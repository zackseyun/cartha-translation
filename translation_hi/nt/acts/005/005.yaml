source:
  edition: SBLGNT
  text: ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ⸀ἀκούοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: hi
  text: पर जब हनन्याह ने ये बातें सुनीं, तो वह गिर पड़ा और उसके प्राण निकल गए। तब यह सुनने वाले सभी लोगों पर बड़ा भय छा गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούων
  choice: जब ... ने ... सुनीं
  rationale: वर्तमान कृदंत को यहाँ कालवाचक रूप में प्रस्तुत करना स्वाभाविक है और कथानक का क्रम स्पष्ट रखता है।
- source_word: δὲ
  choice: पर
  rationale: δέ यहाँ पिछले कथन के बाद हल्का विरोध और कथात्मक मोड़ दिखाता है; आधुनिक हिन्दी में ‘पर’ इसे सहजता से व्यक्त करता है।
- source_word: λόγους τούτους
  choice: ये बातें
  rationale: संदर्भ में λόγους पतरस की कही हुई बातों को दर्शाता है। हिन्दी में ‘ये बातें’ स्वाभाविक है और केवल अलग-अलग शब्दों तक अर्थ को सीमित नहीं करता।
- source_word: πεσὼν
  choice: वह गिर पड़ा
  rationale: यह मुख्य क्रिया से ठीक पहले हुई शारीरिक क्रिया को सीधे व्यक्त करता है और ‘बेहोश होकर गिरा’ जैसी अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: ἐξέψυξεν
  choice: उसके प्राण निकल गए
  rationale: क्रिया का मूल बिंब जीवन-श्वास निकल जाने का है। यह हिन्दी अभिव्यक्ति मृत्यु को स्पष्ट करते हुए उस बिंब को ‘मर गया’ से अधिक निकटता से सुरक्षित रखती है।
- source_word: ἐγένετο φόβος μέγας ἐπὶ
  choice: पर बड़ा भय छा गया
  rationale: यह हिन्दी में भय के लोगों को आ घेरने या उन पर छा जाने का स्वाभाविक और प्रभावशाली वर्णन है।
- source_word: πάντας τοὺς ἀκούοντας
  choice: यह सुनने वाले सभी लोगों
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत उन सबको दर्शाता है जिन्होंने घटना या उसका समाचार सुना। ‘यह’ संदर्भ को सहज बनाता है, पर सुनी गई बात को अत्यधिक विशिष्ट नहीं करता।
- source_word: Ἁνανίας
  choice: हनन्याह
  rationale: नाम को उसके यूनानी रूप के पीछे स्थित सामी नाम के प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुसार प्रस्तुत किया गया है।
theological_decisions:
- issue: हनन्याह की मृत्यु का कारण और माध्यम
  choice: घटना को तत्काल मृत्यु के रूप में सीधे कहना, पर उसके दैवी या प्राकृतिक माध्यम को निर्दिष्ट न करना
  alternative: उसे सदमे से हुई प्राकृतिक मृत्यु या परमेश्वर द्वारा सीधे मारा जाना बताना
  rationale: यूनानी पाठ कहता है कि वह गिर पड़ा और उसके प्राण निकल गए, किंतु मृत्यु का माध्यम स्पष्ट नहीं करता। इसलिए अनुवाद कथानक की गंभीरता बनाए रखता है, पर पाठ से आगे जाकर कारण निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘प्राण निकल गए’ सामान्य पाठक के लिए स्पष्ट है और ἐξέψυξεν के श्वास/जीवन निकलने के बिंब को सुरक्षित रखता है; इसलिए अलग पाद-टिप्पणी आवश्यक नहीं मानी गई।
