  text: καὶ ἐνοσφίσατο ἀπὸ τῆς τιμῆς, συνειδυίης καὶ τῆς ⸀γυναικός, καὶ ἐνέγκας μέρος τι παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/002.yaml
  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: hi
  text: और उसने बिक्री की रकम में से कुछ अपने लिए दबा लिया[a]—उसकी पत्नी भी यह बात जानती थी—और बिक्री की रकम का कुछ हिस्सा लाकर प्रेरितों के पाँवों के पास रख दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिक्री की रकम में से कुछ छिपाकर अपने पास रख लिया”; यूनानी क्रिया अपने लिए बेईमानी से कुछ रोक लेने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “प्रेरितों के पाँवों के पास”; यह रकम उनके सामने प्रस्तुत करने की ठोस अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: कुछ अपने लिए दबा लिया
  rationale: यह क्रिया अपने लिए बेईमानी से या छिपाकर कुछ रख लेने का नकारात्मक भाव रखती है। ‘दबा लिया’ आधुनिक हिन्दी में उस कपटपूर्ण रोक को स्वाभाविक ढंग से व्यक्त करता है, पर इसे किसी विशिष्ट कानूनी अपराध की संज्ञा नहीं देता।
- source_word: ἀπὸ τῆς τιμῆς
  choice: बिक्री की रकम में से
  rationale: यहाँ τιμή बेची गई संपत्ति से मिली कीमत को दर्शाता है। ‘बिक्री की रकम’ सामान्य हिन्दी में स्पष्ट है और ἀπό के अंशसूचक भाव को ‘में से’ सुरक्षित रखता है।
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: उसकी पत्नी भी यह बात जानती थी
  rationale: सम्बन्धकारक निरपेक्ष रचना सहवर्ती परिस्थिति बताती है। यह अनुवाद पत्नी की जानकारी को स्पष्ट करता है; ‘भी’ καί को दर्शाता है, जबकि सहभागिता या सहमति को पाठ से अधिक स्पष्ट नहीं करता।
- source_word: ἐνέγκας
  choice: लाकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की क्रिया दिखाता है। हिन्दी का ‘लाकर’ इस क्रम और सम्बन्ध को संक्षेप तथा स्वाभाविक रूप में व्यक्त करता है।
- source_word: μέρος τι
  choice: उसका कुछ हिस्सा
  rationale: μέρος τι एक अनिश्चित अंश को सूचित करता है। ‘कुछ हिस्सा’ उसी अनिश्चितता को सहज हिन्दी में बनाए रखता है।
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: प्रेरितों के पाँवों के पास रख दिया
  rationale: यह अनुवाद यूनानी पाठ की ठोस स्थान-संबंधी छवि को बनाए रखता है और प्रेरितों के सामने धन प्रस्तुत करने के प्रसंग में स्वाभाविक हिन्दी है।
theological_decisions:
- issue: हनन्याह के कार्य का नैतिक भाव
  choice: कार्य को कपटपूर्ण ढंग से अपने लिए कुछ दबा लेने के रूप में व्यक्त किया गया है।
  alternative: उसने रकम का कुछ भाग अपने पास रख लिया।
  rationale: νοσφίζομαι और निकटवर्ती कथा केवल तटस्थ रूप से कोई वैध हिस्सा रखने की नहीं, बल्कि छिपाकर अपने लिए रोक लेने की ओर संकेत करते हैं। ‘दबा लिया’ इस नकारात्मक भाव को सुरक्षित रखता है, बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
- issue: पत्नी की जानकारी और सहभागिता
  choice: केवल यह कहा गया है कि पत्नी यह बात जानती थी।
  alternative: उसकी पत्नी की सहमति से।
  rationale: συνειδυίης ज्ञान या अवगत होने को स्पष्ट करता है, पर इस पद में अकेले औपचारिक सहमति अथवा समान भूमिका को प्रत्यक्ष रूप से नहीं कहता; इसलिए अनुवाद उस सम्भावित भेद को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘बिक्री की रकम’, ‘दबा लिया’ और ‘लाकर’ सामान्य पाठक के लिए सहज हैं। डैश मूल यूनानी की सम्बन्धकारक निरपेक्ष रचना को सहवर्ती टिप्पणी के रूप में स्पष्ट करता है।
