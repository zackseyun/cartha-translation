source:
  edition: SBLGNT
  text: ὥστε ⸂καὶ εἰς⸃ τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς καὶ τιθέναι ἐπὶ ⸀κλιναρίων καὶ κραβάττων, ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ⸀ἐπισκιάσῃ τινὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: hi
  text: इस हद तक कि लोग बीमारों को सड़कों[a] पर भी ले आते थे और उन्हें खाटों और चटाइयों[b] पर लिटा देते थे, ताकि पतरस के गुजरते समय उसकी छाया भी उनमें से किसी पर पड़ जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चौड़ी सड़कों अथवा खुले सार्वजनिक स्थानों’। यूनानी शब्द चौड़ी सड़कों या सार्वजनिक चौकों, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पलंगों और बिछौनों’। यूनानी में लेटने या सोने की दो अलग प्रकार की सतहों के लिए दो शब्द हैं।
    reason: lexical_alternative
  - marker: c
    text: 'यह पद लोगों का उद्देश्य बताता है: उन्होंने बीमारों को इस आशा से वहाँ लिटाया कि पतरस की छाया भी उनमें से किसी पर पड़ जाए। यह पद यहाँ स्पष्ट रूप से यह नहीं कहता कि छाया ने स्वयं उन्हें चंगा किया।'
    reason: theological_clarification
lexical_decisions:
- source_word: ὥστε
  choice: इसका परिणाम यह हुआ कि
  rationale: यह पिछले संदर्भ में प्रेरितों के बढ़ते प्रभाव का परिणाम बताता है; हिन्दी में यह वाक्यांश उसके परिणामसूचक बल को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: καὶ εἰς τὰς πλατείας
  choice: सड़कों पर भी
  rationale: καί विस्तार पर बल देता है, जिसे ‘भी’ से व्यक्त किया गया है। πλατεῖαι चौड़ी सड़कों अथवा खुले सार्वजनिक स्थानों को सूचित कर सकता है; मुख्य पाठ में ‘सड़कों’ संदर्भानुकूल और सहज है।
- source_word: ἐκφέρειν
  choice: बाहर ले आते
  rationale: यह बीमारों को घरों या भीतर के स्थानों से सार्वजनिक जगहों पर ले जाने का भाव देता है; हिन्दी का यह प्रयोग शारीरिक रूप से उठाकर लाने को संदर्भ में स्वाभाविक ढंग से समेटता है।
- source_word: τοὺς ἀσθενεῖς
  choice: बीमारों
  rationale: चंगाई के इस संदर्भ में शब्द सामान्य दुर्बलता नहीं, रोगग्रस्त लोगों को सूचित करता है।
- source_word: τιθέναι
  choice: लिटा देते थे
  rationale: बीमार व्यक्तियों को बिछौनों पर रखने के लिए ‘लिटाना’ स्वाभाविक हिन्दी है और दृश्य को अनावश्यक तकनीकीपन के बिना स्पष्ट करता है।
- source_word: ἐπὶ κλιναρίων καὶ κραβάττων
  choice: खाटों और चटाइयों पर
  rationale: दोनों यूनानी शब्द दो प्रकार के बिस्तर या लेटने की सतहों का भेद रखते हैं। ‘खाट’ और ‘चटाई’ साधारण पाठक के लिए सुबोध हैं और उस भेद को बनाए रखते हैं।
- source_word: ἵνα
  choice: ताकि
  rationale: यह लोगों के उद्देश्य अथवा अपेक्षित परिणाम को व्यक्त करता है; ‘ताकि’ हिन्दी में इस आशय का सीधा और स्वाभाविक सूचक है।
- source_word: ἐρχομένου Πέτρου
  choice: जब पतरस वहाँ से गुज़रे
  rationale: संबंधविहीन संबंधकारक रचना पतरस के उनके निकट से होकर जाने की परिस्थिति बताती है; यह अनुवाद उस गतिशील भाव को स्पष्ट रखता है।
- source_word: κἂν
  choice: कम-से-कम ... ही
  rationale: यह अपेक्षित न्यूनतम संपर्क पर बल देता है—यदि केवल छाया भी पड़ जाए। हिन्दी में यह संरचना ‘even/at least’ के बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἡ σκιὰ ἐπισκιάσῃ
  choice: उसकी छाया ... पर पड़ जाए
  rationale: शाब्दिक ‘छाया कर दे’ की अपेक्षा यह आधुनिक हिन्दी में अधिक स्वाभाविक है, जबकि छाया के सचमुच किसी व्यक्ति तक पहुँचने का दृश्य अक्षुण्ण रहता है।
- source_word: τινὶ αὐτῶν
  choice: उनमें से किसी पर
  rationale: एकवचन अनिश्चयवाचक रूप समूह में से किसी एक व्यक्ति को सूचित करता है; ‘किसी पर’ इस अर्थ को ‘कुछ लोगों पर’ की संभावित बहुवचन अस्पष्टता के बिना सुरक्षित रखता है।
theological_decisions:
- issue: क्या पद यह कहता है कि पतरस की छाया में स्वयं चंगा करने की शक्ति थी
  choice: अनुवाद केवल लोगों के उद्देश्य और आशा को व्यक्त करता है कि छाया किसी पर पड़ जाए।
  alternative: ऐसा शब्दांकन जो सीधे यह घोषित करे कि पतरस की छाया ने बीमारों को चंगा किया।
  rationale: ἵνα के साथ विधिलिंग क्रिया लोगों के प्रयोजन या अपेक्षा को सामने रखती है। व्यापक संदर्भ अनेक चंगाइयों का वर्णन करता है, पर यह पद अपने आप में यह नहीं कहता कि छाया ने ही चंगा किया; इसलिए कथन की धर्मवैज्ञानिक संयमता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘ले आते’ और ‘लिटा देते थे’ भीड़ की चलती हुई, बार-बार होने वाली गतिविधि को व्यक्त करते हैं। ‘कम-से-कम ... ही’ κἂν के बल को बोलचाल की अतिशयता के बिना स्पष्ट करता है।
