base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: hi
  text: यरूशलेम के आस-पास के नगरों से लोगों की भीड़ भी इकट्ठी हो रही थी[a], जो बीमारों और अशुद्ध आत्माओं से सताए हुए लोगों को लेकर आती थी[b], और वे सब चंगे किए जाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम के आस-पास के नगरों से लोगों की भीड़ जमा हो रही थी।”
    reason: lexical_alternative
  - marker: b
    text: या, “अशुद्ध आत्माओं से पीड़ित लोगों को लेकर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήρχετο
  choice: इकट्ठी होती जा रही थी
  rationale: अपूर्णकाल भूतकाल में जारी या बार-बार होने वाली गतिविधि दिखाता है; यह प्रयोग उस क्रमिक और दुहराए जाने वाले भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὸ πλῆθος
  choice: लोगों की भीड़
  rationale: यह बड़ी संख्या में लोगों का सामूहिक उल्लेख है। ‘लोगों की भीड़’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τῶν πέριξ πόλεων Ἰερουσαλήμ
  choice: यरूशलेम के आस-पास के नगरों से
  rationale: यह यरूशलेम के निकट स्थित बस्तियों या नगरों को दर्शाता है; चुना हुआ रूप भौगोलिक संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: φέροντες
  choice: वे ... लाते थे
  rationale: वर्तमान कृदन्त लोगों के इकट्ठा होने के साथ चल रही क्रिया बताता है; हिन्दी में अलग वाक्य और अपूर्ण भूतकाल इसे स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: ἀσθενεῖς
  choice: बीमारों
  rationale: चंगाई के प्रसंग में शब्द का सामान्य अर्थ शारीरिक रूप से बीमार लोग है।
- source_word: ὀχλουμένους
  choice: सताए हुए लोगों
  rationale: शब्द किसी के पीड़ित, परेशान या त्रस्त किए जाने को दर्शाता है। ‘सताए हुए’ कर्तृवाच्य संबंध को बनाए रखते हुए तीव्र पीड़ा की सम्भावना भी व्यक्त करता है।
- source_word: ὑπὸ πνευμάτων ἀκαθάρτων
  choice: अशुद्ध आत्माओं से
  rationale: यह नए नियम की प्रचलित अभिव्यक्ति को बनाए रखता है और इसे केवल मानसिक या रूपकात्मक दशा में नहीं बदलता।
- source_word: οἵτινες
  choice: वे
  rationale: सर्वनाम अभी बताए गए दोनों समूहों—बीमारों और अशुद्ध आत्माओं से सताए लोगों—को फिर से ग्रहण करता है।
- source_word: ἐθεραπεύοντο
  choice: चंगे किए जाते थे
  rationale: अपूर्णकाल और कर्मवाच्य जारी या बार-बार होने वाली चंगाई को दर्शाते हैं; हिन्दी रूप दोनों विशेषताओं को बनाए रखता है।
- source_word: ἅπαντες
  choice: सब
  rationale: यह लाए गए लोगों की चंगाई की समग्रता पर बल देता है।
theological_decisions:
- issue: πνευμάτων ἀκαθάρτων का अनुवाद
  choice: अशुद्ध आत्माओं
  alternative: अपवित्र आत्माओं
  rationale: ‘अशुद्ध आत्माएँ’ बाइबिल की पहचानी हुई अभिव्यक्ति है और मूल पद के व्यक्तिगत दुष्ट आत्माओं तथा अशुद्धता से जुड़े अर्थों को सुरक्षित रखती है।
- issue: ἅπαντες का दायरा
  choice: वे सब चंगे किए जाते थे
  alternative: उनमें से हर एक चंगा किया जाता था
  rationale: ‘सब’ इस दृश्य में लाए गए दोनों प्रकार के लोगों पर लागू व्यापक कथन को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चंगे किए जाते थे’ बाइबिलीय हिन्दी में परिचित है और यूनानी अपूर्ण कर्मवाच्य को संक्षेप में सुरक्षित रखता है। मुख्य पाठ के सभी पादटिप्पणी-चिह्न [a], [b] के रूप में उपस्थित हैं।
