    text: या, “इसका क्या होगा।” यूनानी अभिव्यक्ति इस स्थिति के संभावित परिणाम के बारे में अनिश्चितता प्रकट करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: जब … तो
  rationale: ὡς का कालवाचक अर्थ और δέ का कथात्मक संक्रमण स्वाभाविक हिन्दी की ‘जब … तो’ रचना से व्यक्त होता है।
- source_word: ἤκουσαν
  choice: सुनीं
  rationale: सन्दर्भ में ἀκούω का सामान्य अर्थ किसी सूचना या बात को सुनना है।
- source_word: τοὺς λόγους τούτους
  choice: ये बातें
  rationale: λόγοι यहाँ अभी-अभी सुनाई गई सूचना को सूचित करता है; ‘ये बातें’ हिन्दी में स्वाभाविक है और ‘शब्दों’ की अपेक्षा सन्दर्भ को बेहतर व्यक्त करता है।
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: मन्दिर के पहरेदारों के प्रधान
  rationale: στρατηγός उस अधिकारी को दर्शाता है जो मन्दिर की सुरक्षा-व्यवस्था का प्रमुख था। यह पदनाम ‘कप्तान’ की अपेक्षा सामान्य हिन्दी पाठक के लिए अधिक स्पष्ट है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: बहुवचन ἀρχιερεῖς यहाँ प्रधान याजकीय नेतृत्व-वर्ग के सदस्यों को सूचित करता है, न कि एक ही समय कार्यरत अनेक महायाजकों को।
- source_word: διηπόρουν
  choice: बड़ी उलझन में पड़ गए
  rationale: διαπορέω गहरी अनिश्चितता और असमंजस व्यक्त करता है; ‘बड़ी’ उपसर्ग-सहित क्रिया की तीव्रता को सामने लाता है।
- source_word: περὶ αὐτῶν
  choice: इन्हें लेकर
  rationale: बहुवचन सर्वनाम का सम्बन्ध सुनी हुई बातों अथवा उनमें बताई गई घटनाओं से हो सकता है; यह अनुवाद उस सन्दर्भगत लचीलेपन को बनाए रखता है।
- source_word: τί ἂν γένοιτο τοῦτο
  choice: इसका क्या परिणाम हो सकता है
  rationale: ἄν के साथ optative अनिश्चित सम्भावित परिणाम व्यक्त करता है; ‘हो सकता है’ उस अनिश्चितता को सुरक्षित रखता है।
