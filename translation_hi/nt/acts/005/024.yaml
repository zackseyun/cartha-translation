  yaml_path: translation/nt/acts/005/024.yaml
  text: When the captain of the temple and the chief priests heard these words[a], they were perplexed about them, wondering what this might come to.
translation:
  language: hi
  text: जब मंदिर के कप्तान और प्रधान याजकों ने ये बातें सुनीं, तो वे इन बातों को लेकर उलझन में थे कि इसका क्या परिणाम हो सकता है[a]।
  philosophy: optimal-equivalence
  footnotes:
