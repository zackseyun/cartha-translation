language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Πέτρος καὶ οἱ ἀπόστολοι εἶπαν· Πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/029.yaml
  text: But Peter and the apostles answered[a], “We must obey God rather than men.”
translation:
  language: hi
  text: परन्तु पतरस और प्रेरितों ने उत्तर दिया, “हमें मनुष्यों की अपेक्षा परमेश्वर की आज्ञा माननी चाहिए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπαν
  choice: उत्तर दिया
  rationale: कृदन्त और मुख्य क्रिया मिलकर उत्तर देने का एक कथात्मक मुहावरा बनाते हैं; हिन्दी में दोनों को अलग-अलग दोहराने के बजाय ‘उत्तर दिया’ स्वाभाविक और अर्थपूर्ण है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछली आज्ञा के प्रत्युत्तर में हल्का विरोध दर्शाता है; ‘परन्तु’ उस मोड़ को स्पष्ट रखता है।
- source_word: Πέτρος καὶ οἱ ἀπόστολοι
  choice: पतरस और अन्य प्रेरितों
  rationale: यूनानी में शाब्दिक रूप से ‘पतरस और प्रेरित’ है, पर पतरस स्वयं प्रेरितों में से है; हिन्दी का ‘अन्य’ समूह-संबंध स्पष्ट करता है, बिना आशय बदले।
- source_word: Πειθαρχεῖν
  choice: आज्ञा माननी
  rationale: क्रिया अधिकार रखने वाले की बात मानने को व्यक्त करती है; इस प्रसंग में ‘आज्ञा मानना’ स्पष्ट और स्वाभाविक है।
- source_word: δεῖ
  choice: हमें ... चाहिए
  rationale: यह बाध्यता या नैतिक आवश्यकता व्यक्त करता है। निहित कर्ता वक्ता-समूह है, इसलिए ‘हमें’ उपयुक्त है।
- source_word: θεῷ
  choice: परमेश्वर की
  rationale: आज्ञापालन का दत्तिव कर्म है; हिन्दी में ‘परमेश्वर की आज्ञा मानना’ स्वाभाविक संरचना है।
- source_word: μᾶλλον ἢ
  choice: की अपेक्षा
  rationale: यह दो प्राधिकारों के बीच प्राथमिकता का तुलनात्मक विरोध व्यक्त करता है।
- source_word: ἀνθρώποις
  choice: मनुष्यों की
  rationale: यहाँ शब्द परमेश्वर के विपरीत सामान्य रूप से मनुष्यों—प्रसंगतः मानवीय अधिकारियों—को दर्शाता है। ‘मनुष्यों’ स्रोत के व्यापक अर्थ और वाक्य के तीखे विरोध दोनों को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर और मानवीय प्राधिकार के बीच आज्ञापालन की प्राथमिकता
  choice: “मनुष्यों की अपेक्षा परमेश्वर की आज्ञा माननी चाहिए”
  alternative: “मनुष्यों से बढ़कर परमेश्वर की आज्ञा माननी चाहिए”
  rationale: ‘की अपेक्षा’ मूल तुलनात्मक संरचना को सुरक्षित रखता है। वचन परमेश्वर के प्राधिकार को सर्वोपरि बताता है, पर इससे मानवीय प्राधिकार के प्रति हर प्रकार की आज्ञाकारिता का निषेध जोड़ना उचित नहीं होगा।
- issue: ἀνθρώποις का प्रतिनिधिक अर्थ
  choice: मनुष्यों
  alternative: लोगों / मनुष्य-मात्र
  rationale: ‘मनुष्यों’ आधुनिक हिन्दी में स्त्री-पुरुष सभी के लिए व्यापक मानव-संज्ञा है और परमेश्वर बनाम मानवीय प्राधिकार का मूल विरोध बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण कथात्मक रूप। ‘परन्तु’ और ‘परमेश्वर’ बाइबलीय गरिमा रखते हुए सामान्य पाठकों के लिए स्पष्ट हैं। किसी पादटिप्पणी की आवश्यकता नहीं, क्योंकि ‘मनुष्यों’ स्वयं व्यापक मानव-संदर्भ व्यक्त करता है।
