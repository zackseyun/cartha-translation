source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀ὁ Πέτρος· Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου, ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ ⸀νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: hi
  text: पर पतरस ने कहा, “हनन्याह, शैतान ने तुम्हारे हृदय को क्यों भर दिया कि तुम पवित्र आत्मा से झूठ बोलो[a] और उस भूमि की बिक्री से मिले मूल्य में से कुछ अपने पास रखो[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र आत्मा को धोखा दो।” यूनानी क्रिया किसी से झूठ बोलने का अर्थ दे सकती है; यहाँ मुख्य पाठ का रूप अधिक सीधा है।
    reason: lexical_alternative
  - marker: b
    text: या, “बिक्री से मिली रकम का कुछ भाग रोक रखो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: पर पतरस ने कहा
  rationale: δέ यहाँ हल्का विरोधात्मक मोड़ दिखाता है; पिछले प्रसंग के बाद पतरस के सामना करने वाले कथन के लिए ‘पर’ स्वाभाविक है।
- source_word: διὰ τί
  choice: क्यों
  rationale: प्रत्यक्ष प्रश्न में इस यूनानी पदबंध का सहज और सटीक हिन्दी रूप।
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: शैतान ने तुम्हारे हृदय को क्यों भर दिया
  rationale: मूल रूपक और शैतान की व्याकरणिक कर्तृता को बनाए रखता है; इसे अधिकार, नियंत्रण या विवशता के रूप में नहीं समझाता।
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: कि तुम पवित्र आत्मा से झूठ बोलो
  rationale: ψεύδομαι के साथ व्यक्ति-वाचक कर्म यहाँ ‘किसी से झूठ बोलना’ दर्शाता है। ‘कि तुम’ हिन्दी में infinitive संबंध को सहज रूप देता है और प्रयोजन/परिणाम को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: यह आधुनिक हिन्दी में प्रचलित, गरिमापूर्ण और सीधा समतुल्य है।
- source_word: νοσφίσασθαι
  choice: कुछ हिस्सा अपने पास रख लो
  rationale: यह बेची हुई वस्तु के मूल्य का एक भाग अपने लिए रोक रखने का भाव स्पष्ट करता है, बिना ‘गबन’ जैसे अधिक संकीर्ण कानूनी शब्द को थोपे।
- source_word: ἀπὸ τῆς τιμῆς
  choice: बिक्री-मूल्य में से कुछ हिस्सा
  rationale: ἀπό के साथ संबंध पूरे मूल्य में से एक अंश रोकने का है; ‘बिक्री-मूल्य’ प्रसंग में τιμή का स्पष्ट हिन्दी रूप है।
- source_word: τοῦ χωρίου
  choice: उस भूमि
  rationale: χωρίον भूमि, खेत या संपत्ति का अर्थ दे सकता है; इस बिक्री-वृत्तांत में ‘भूमि’ सटीक है और अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
theological_decisions:
- issue: हनन्याह के हृदय को भरने में शैतान की कर्तृता
  choice: ‘शैतान ने तुम्हारे हृदय को ... भर दिया’ रूपक को सीधे बनाए रखा गया।
  alternative: ‘शैतान ने तुम पर अधिकार कर लिया’ अथवा ‘तुमने शैतान को अपना हृदय भरने क्यों दिया’।
  rationale: यूनानी पाठ शैतान को क्रिया का कर्ता बताता है, फिर भी हनन्याह को उत्तरदायी ठहराता है। अनुवाद न तो दुष्टात्मिक अधिकार की पूरी धारणा जोड़ता है, न मानवीय दोष को मिटाता है।
- issue: पवित्र आत्मा से झूठ बोलना
  choice: ‘पवित्र आत्मा से झूठ बोलो’ का प्रत्यक्ष और व्यक्तिगत कथन रखा गया।
  alternative: ‘पवित्र आत्मा को धोखा दो’ अथवा ‘पवित्र आत्मा की उपस्थिति में झूठ बोलो’।
  rationale: यह यूनानी रचना की सीधी व्यक्तिगत अभिव्यक्ति को सुरक्षित रखता है और पद में कोई अतिरिक्त सिद्धान्तगत व्याख्या नहीं जोड़ता।
- issue: ‘कि तुम’ से व्यक्त infinitive का संबंध
  choice: प्रयोजन या परिणाम को कठोरता से तय किए बिना ‘कि तुम’ प्रयोग किया गया।
  alternative: ‘तुम्हें ... झूठ बोलने और ... अपने पास रखने के लिए’ अथवा स्पष्टतः ‘जिसके परिणामस्वरूप’।
  rationale: दोनों यूनानी infinitive हृदय भरने से जुड़े हैं, पर उनका सूक्ष्म प्रयोजन/परिणाम संबंध संदर्भगत है; हिन्दी वाक्य इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। ‘हृदय को भर दिया’ जानबूझकर मूल रूपक को सुरक्षित रखता है; बाकी वाक्य हिन्दी की सहज संरचना में है।
