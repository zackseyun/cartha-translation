  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: hi
  text: जब तक वह भूमि नहीं बिकी थी, क्या वह तुम्हारी ही नहीं थी? और बिक जाने के बाद, क्या उसकी बिक्री से मिली रकम तुम्हारे अधिकार में नहीं थी? तुमने यह बात अपने मन में क्यों ठानी? तुमने मनुष्यों से नहीं, बल्कि परमेश्वर से झूठ बोला है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μένον / ἔμενεν
  choice: जब तक वह भूमि नहीं बिकी थी ... वह तुम्हारी ही नहीं थी
  rationale: यूनानी में एक ही धातु की पुनरावृत्ति है, पर हिन्दी में शाब्दिक पुनरावृत्ति अस्वाभाविक होती। प्रसंग से ज्ञात संपत्ति को ‘भूमि’ कहकर बिक्री से पहले उसके स्वामित्व में बने रहने का भाव स्पष्ट किया गया है।
- source_word: σοὶ
  choice: तुम्हारी ही
  rationale: सम्प्रदान कारक यहाँ स्वामित्व व्यक्त करता है; ‘ही’ प्रश्न के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πραθὲν
  choice: बिक जाने के बाद
  rationale: अओरिस्ट कर्मवाच्य कृदंत का समयगत और कर्मवाच्य अर्थ स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: उसका मूल्य तुम्हारे अधिकार में नहीं था
  rationale: ἐξουσία अधिकार, नियंत्रण और निर्णय की स्वतंत्रता दर्शाता है। प्रसंगानुसार बिक्री के बाद भूमि नहीं, उससे मिला मूल्य उसके नियंत्रण में था; इसे स्पष्ट करना हिन्दी में आवश्यक है।
- source_word: τί ὅτι
  choice: क्यों
  rationale: यह मुहावरा कठोर पूछताछ या उलाहना व्यक्त करता है; हिन्दी का सीधा ‘क्यों’ उसी बल को सहज रूप से देता है।
- source_word: ἔθου ἐν τῇ καρδίᾳ σου
  choice: तुमने ... अपने मन में ... ठानी
  rationale: यूनानी हृदय-भाषा आंतरिक संकल्प बताती है। आधुनिक हिन्दी में ‘मन में ठानना’ इरादे और निश्चय दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ πρᾶγμα τοῦτο
  choice: यह बात
  rationale: πρᾶγμα व्यापक अर्थ वाला शब्द है। ‘यह बात’ प्रसंग को नैतिक रूप से अतिरिक्त रंग दिए बिना हिन्दी में सहज रखता है।
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: तुमने मनुष्यों से नहीं, बल्कि परमेश्वर से झूठ बोला है
  rationale: ‘मनुष्यों’ से ἀνθρώποις का सामान्य मानव-संदर्भ स्पष्ट रहता है और ‘परमेश्वर’ के साथ मूल विरोध सुरक्षित है। पूर्ण वर्तमान निकट अतीत के कार्य की वर्तमान प्रासंगिकता दिखाता है।
theological_decisions:
- issue: निकटवर्ती संदर्भ में पवित्र आत्मा की दिव्यता (प्रेरितों 5:3 से तुलना)
  choice: पद के अनुसार केवल ‘परमेश्वर से’ रखा गया है।
  alternative: ‘परमेश्वर से, अर्थात पवित्र आत्मा से’ जोड़ना।
  rationale: यह पद स्वयं ‘परमेश्वर’ कहता है। पद 3 के साथ इसका संबंध महत्त्वपूर्ण है, पर व्याख्यात्मक सामंजस्य को मुख्य पाठ में जोड़ना उचित नहीं।
- issue: संपत्ति और बिक्री-मूल्य पर हनन्याह का अधिकार
  choice: बिक्री से पहले स्वामित्व और बिक्री के बाद मूल्य पर अधिकार स्पष्ट किया गया है।
  alternative: ऐसा अनुवाद जो केवल कब्जा बताए और निर्णय की स्वतंत्रता अस्पष्ट छोड़ दे।
  rationale: पतरस का तर्क यह है कि दोष संपत्ति न देने में नहीं, बल्कि छल में था। ‘अधिकार’ मूल के वैध नियंत्रण और निर्णय-स्वतंत्रता को सुरक्षित रखता है।
- issue: ἀνθρώποις का लिंग-सामान्य अर्थ
  choice: ‘मनुष्यों’
  alternative: ‘पुरुषों’ या केवल ‘लोगों’
  rationale: यहाँ शब्द समस्त मानवों को सूचित करता है, केवल पुरुषों को नहीं। ‘मनुष्यों ... परमेश्वर’ मूल के मानव-ईश्वर विरोध को भी स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल। मूल की प्रश्नात्मक फटकार और अंतिम विरोध को बनाए रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
