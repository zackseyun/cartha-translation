  yaml_path: translation/nt/acts/005/023.yaml
  text: saying[a], “We found the prison securely locked, and the guards standing at the doors; but when we opened it, we found no one inside.”
translation:
  language: hi
  text: उन्होंने कहा, “हमने कारागार को पूरी सुरक्षा के साथ बंद पाया[a], और पहरेदारों को दरवाज़ों पर खड़ा पाया; पर जब हमने दरवाज़े खोले, तो भीतर किसी को नहीं पाया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरी तरह सुरक्षित रूप से बंद पाया।” यूनानी वाक्य कारागार के पूरी तरह सुरक्षित पाए जाने पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσμωτήριον
  choice: कारागार
  rationale: यह बंदी रखने के स्थान को दर्शाता है। ‘कारागार’ आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: पूरी तरह सुरक्षित ढंग से बंद
  rationale: पूर्ण निष्क्रिय कृदंत बंद अवस्था को और ἐν πάσῃ ἀσφαλείᾳ उस अवस्था की पूर्ण सुरक्षा को बल देता है; यह अनुवाद दोनों बातों को स्पष्ट रखता है।
- source_word: φύλακας ἑστῶτας
  choice: पहरेदारों को ... खड़े
  rationale: φύλακες हिरासत के इस प्रसंग में पहरेदार हैं, और ἑστῶτας उनके अपने स्थान पर खड़े होने का दृश्यात्मक विवरण सुरक्षित रखता है।
- source_word: ἐπὶ τῶν θυρῶν
  choice: दरवाज़ों पर
  rationale: यह दरवाज़ों के पास उनकी स्थिति दर्शाता है; ‘दरवाज़ों पर’ स्वाभाविक हिन्दी है।
- source_word: ἀνοίξαντες
  choice: जब हमने उसे खोला
  rationale: कालसूचक उपवाक्य हिन्दी में स्वाभाविक है। यूनानी में कर्म व्यक्त नहीं है; ‘उसे’ निकटवर्ती कारागार की ओर संकेत करता है और दरवाज़े खोलकर कारागार खोलने के सामान्य अर्थ को व्यक्त करता है।
- source_word: ἔσω
  choice: भीतर
  rationale: यह कारागार के अंदरूनी भाग को सूचित करने वाला क्रियाविशेषण है; ‘भीतर’ स्पष्ट और स्वाभाविक है।
- source_word: οὐδένα
  choice: किसी को नहीं
  rationale: यह नकारात्मक अनिश्चित सर्वनाम का स्वाभाविक हिन्दी रूप है।
- source_word: λέγοντες ὅτι
  choice: उन्होंने कहा, “
  rationale: यह पिछले पद के अधिकारियों की रिपोर्ट की विषयवस्तु प्रस्तुत करता है। हिन्दी में सीमित क्रिया के साथ प्रत्यक्ष कथन अधिक स्वाभाविक है।
