id: ACT.5.19
reference: Acts 5:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: hi
  text: परन्तु रात के समय प्रभु के एक स्वर्गदूत ने जेल के दरवाज़े खोल दिए, उन्हें बाहर निकाला और कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: एक स्वर्गदूत
  rationale: संज्ञा अनिश्चित है और प्रसंग में अलौकिक रूप से जेल के द्वार खोलने वाला स्वर्गीय दूत अभिप्रेत है; ‘एक’ यूनानी की अनिश्चितता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κυρίου
  choice: प्रभु के
  rationale: κύριος का मानक बाइबलीय रूप ‘प्रभु’ है, और ‘प्रभु का स्वर्गदूत’ स्थापित तथा स्रोत-संगत अभिव्यक्ति है।
- source_word: διὰ νυκτός
  choice: रात के समय
  rationale: διά के साथ संबंधकारक यहाँ समयावधि सूचित करता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἤνοιξε
  choice: खोल दिए
  rationale: ἀνοίγω का सीधा अर्थ ‘खोलना’ है; ‘ताले खोल दिए’ कहना स्रोत से अतिरिक्त विवरण जोड़ता। बहुवचन दरवाज़ों के अनुसार ‘दिए’ रखा गया है।
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: जेल के दरवाज़े
  rationale: θύραι का अर्थ ‘दरवाज़े’ और φυλακή का यहाँ अर्थ ‘जेल/कारागार’ है। ‘जेल’ साधारण आधुनिक पाठक के लिए सहज है और गरिमा बनाए रखता है।
- source_word: ἐξαγαγών
  choice: उन्हें बाहर निकाला
  rationale: ἐξάγω उन्हें बाहर लाने या निकालने की क्रिया बताता है; ‘बाहर निकाला’ अनावश्यक रूप से मार्गदर्शन का भाव जोड़े बिना अर्थ देता है।
- source_word: τε
  choice: और
  rationale: τέ सहभागी क्रिया को मुख्य क्रिया से हल्के संयोजक रूप में जोड़ता है; हिन्दी में ‘और’ स्वाभाविक है।
- source_word: εἶπεν
  choice: कहा
  rationale: कथात्मक वाक्य में λέγω का सहज अनुवाद ‘कहा’ है; अल्पविराम अगले पद में आने वाले कथन की ओर संकेत करता है।
theological_decisions:
- issue: ἄγγελος का स्वरूप
  choice: स्वर्गीय दूत—‘स्वर्गदूत’
  alternative: मानवीय संदेशवाहक—‘दूत’
  rationale: जेल के दरवाज़ों का अलौकिक रूप से खुलना और बंदियों का बाहर निकाला जाना स्वर्गीय प्राणी की ओर स्पष्ट संकेत करता है। ‘स्वर्गदूत’ हिन्दी में इस आशय को अस्पष्टता के बिना व्यक्त करता है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ κύριος का मानक धर्मग्रंथीय अनुवाद है और इस प्रचलित बाइबलीय पदबंध में स्रोत के अनुरूप है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘जेल’ आम पाठक के लिए ‘कारागार’ से अधिक स्वाभाविक है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
