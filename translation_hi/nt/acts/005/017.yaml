  text: Ἀναστὰς δὲ ὁ ἀρχιερεὺς καὶ πάντες οἱ σὺν αὐτῷ, ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων, ἐπλήσθησαν ζήλου
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: hi
  text: परन्तु महायाजक उठ खड़ा हुआ; फिर वह और उसके साथ के सभी लोग—अर्थात् सदूकियों का दल[a]—ईर्ष्या[b] से भर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सदूकियों का संप्रदाय।’ यूनानी शब्द किसी दल, विचारधारा-समूह या संप्रदाय को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जलन।’ यूनानी शब्द का अर्थ ‘उत्साह’ भी हो सकता है, पर यहाँ प्रसंग विरोधपूर्ण भाव का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: उठ खड़ा हुआ
  rationale: ἀνίστημι का कृदन्त यहाँ निर्णायक कार्रवाई आरम्भ करने का भाव देता है। एकवचन रूप महायाजक से सम्बद्ध है, इसलिए हिन्दी में एकवचन रखा गया है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले प्रसंग में प्रेरितों को मिली अनुकूल जन-प्रतिक्रिया के विपरीत महायाजक के विरोध की ओर हल्का मोड़ दिखाता है।
- source_word: ὁ ἀρχιερεὺς
  choice: महायाजक
  rationale: यह उस विशिष्ट पद के लिए प्रचलित और सटीक हिन्दी पद है।
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: उसके साथ के सभी लोग
  rationale: यह महायाजक से जुड़े समूह को व्यक्त करता है, उनकी औपचारिक हैसियत के बारे में अनावश्यक निष्कर्ष निकाले बिना।
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: अर्थात् सदूकियों का दल
  rationale: यह पदबंध महायाजक के साथ के लोगों की पहचान बताता है। αἵρεσις यहाँ यहूदी धर्म के भीतर एक दल या संप्रदाय का सूचक है, बाद के अर्थ में ‘विधर्म’ का नहीं।
- source_word: ἐπλήσθησαν
  choice: भर गए
  rationale: बहुवचन निष्क्रिय क्रिया को हिन्दी के स्वाभाविक ‘से भर गए’ मुहावरे द्वारा सुरक्षित रखा गया है।
- source_word: ζήλου
  choice: ईर्ष्या
  rationale: शब्द का अर्थ ‘उत्साह’ भी हो सकता है, पर प्रेरितों के प्रति विरोध और आगे की गिरफ्तारी के संदर्भ में यहाँ नकारात्मक भाव अधिक उपयुक्त है।
theological_decisions:
- issue: αἵρεσις का अनुवाद
  choice: दल
  alternative: संप्रदाय
  rationale: यहाँ शब्द दूसरे मन्दिर-कालीन यहूदी धर्म के भीतर पहचाने जाने वाले समूह को दर्शाता है। ‘दल’ सहज है और ‘विधर्म’ जैसा बाद का मत-सिद्धान्तगत अर्थ आरोपित नहीं करता।
- issue: ζῆλος का प्रसंगानुसार अर्थ
  choice: ईर्ष्या
  alternative: जलन; उत्साह
  rationale: मूल शब्द सकारात्मक उत्साह अथवा नकारात्मक ईर्ष्या दोनों बता सकता है। इस प्रसंग में प्रेरितों का विरोध और उन्हें बन्दी बनाना नकारात्मक अर्थ का समर्थन करता है; फिर भी पादटिप्पणी मूल शब्द की व्यापक अर्थ-सीमा बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण शैली अपनाई गई है। ‘परन्तु’ विरोध का संकेत देता है; ‘अर्थात्’ मूल के व्याख्यात्मक समानाधिकरण को स्पष्ट करता है। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनसे वे सम्बद्ध हैं।
