source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: hi
  text: पर पतरस ने उससे कहा, “तुम दोनों प्रभु की आत्मा को परखने के लिए आपस में सहमत क्यों हुए?[a] देखो, तुम्हारे पति को गाड़ने वालों के पाँव द्वार पर हैं,[b] और वे तुम्हें उठाकर बाहर ले जाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम दोनों ने मिलकर प्रभु की आत्मा को परखने की योजना क्यों बनाई?”
    reason: सहमति के साथ निहित मिलीभगत के प्रसंगगत भाव को व्यक्त करने वाला वैकल्पिक अनुवाद।
  - marker: b
    text: यूनानी में शाब्दिक रूप से “पाँव द्वार पर हैं”; अर्थात दफनाने वाले लोग द्वार पर उपस्थित हैं।
    reason: मूल की सजीव देह-अंग संबंधी अभिव्यक्ति का अर्थ स्पष्ट करता है।
lexical_decisions:
- source_word: συνεφωνήθη ὑμῖν
  choice: तुम दोनों…आपस में सहमत…हुए
  rationale: सहमति करने के पारस्परिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है। बहुवचन ὑμῖν और प्रसंग के आधार पर ‘तुम दोनों’ सफीरा और उसके पति को इंगित करता है; ‘षड्यंत्र’ जैसा अधिक प्रबल अर्थ मुख्य पाठ में नहीं जोड़ा गया।
- source_word: πειράσαι
  choice: परखने के लिए
  rationale: यहाँ अर्थ प्रभु के आत्मा को परीक्षा में डालने या जाँचने का दुस्साहस है। ‘परखना’ आधुनिक हिन्दी में स्वाभाविक है और ‘लुभाना’ जैसे भ्रामक अर्थ से बचता है।
- source_word: τὸ πνεῦμα κυρίου
  choice: प्रभु के आत्मा
  rationale: यूनानी संबंधवाचक रचना को निकटता से रखता है और प्रेरितों के काम 5:3 के संदर्भ में पवित्र आत्मा की ओर संकेत करता है, पर मुख्य पाठ में ‘पवित्र’ जोड़कर व्याख्यात्मक विस्तार नहीं करता।
- source_word: ἰδοὺ
  choice: देखो
  rationale: ध्यान खींचने वाले उद्गार की तात्कालिकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἱ πόδες τῶν θαψάντων
  choice: गाड़ने वालों के पाँव
  rationale: यूनानी की सजीव और शाब्दिक छवि ‘पाँव’ को बनाए रखता है; ‘कदमों की आहट’ जैसी व्याख्या नहीं जोड़ता।
- source_word: τὸν ἄνδρα σου
  choice: तुम्हारे पति
  rationale: प्रसंग में ἀνήρ का स्पष्ट अर्थ सफीरा का पति हनन्याह है।
- source_word: ἐπὶ τῇ θύρᾳ
  choice: द्वार पर
  rationale: प्रवेश-स्थान पर तत्काल उपस्थिति को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐξοίσουσίν σε
  choice: वे तुम्हें भी बाहर ले जाएँगे
  rationale: बाहर ले जाने के प्रत्यक्ष अर्थ और अशुभ संकेत को सुरक्षित रखता है। ‘लाश’ नहीं जोड़ा गया, क्योंकि वह प्रसंग से निहित है पर यूनानी में स्पष्ट नहीं है; ‘भी’ हिन्दी में पति के साथ समान परिणाम को स्वाभाविक बनाता है।
- source_word: Τί ὅτι
  choice: क्यों
  rationale: कारण पूछते हुए फटकारने वाली यूनानी अभिव्यक्ति का सहज हिन्दी रूप।
theological_decisions:
- issue: ‘प्रभु के आत्मा’ का संदर्भ
  choice: मूल पदबंध को बनाए रखते हुए ‘प्रभु के आत्मा’
  alternative: ‘पवित्र आत्मा’
  rationale: प्रेरितों के काम 5:3 से संदर्भ पवित्र आत्मा का है, फिर भी इस पद में यूनानी पाठ ‘पवित्र’ नहीं कहता। इसलिए संभावित संदर्भ को स्वीकार करते हुए मुख्य पाठ में अतिरिक्त विशेषण नहीं जोड़ा गया।
- issue: पतरस के आरोप की तीव्रता
  choice: आपस में सहमत हुए
  alternative: मिलकर षड्यंत्र रचा
  rationale: συμφωνέω मूलतः सहमत होने को व्यक्त करता है। प्रसंग मिलीभगत की गंभीरता दिखाता है, पर मुख्य अनुवाद क्रिया में ‘षड्यंत्र’ का अधिक व्याख्यात्मक अर्थ नहीं भरता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। संबोधन में ‘तुम’ मूल के एकवचन अनौपचारिक αὐτήν/σε के अनुरूप है, जबकि ‘तुम दोनों’ बहुवचन ὑμῖν और पति-पत्नी की संयुक्त सहमति को स्पष्ट करता है। ‘द्वार’ और ‘आत्मा’ बाइबलीय गरिमा रखते हुए सामान्य पाठकों के लिए परिचित हैं।
