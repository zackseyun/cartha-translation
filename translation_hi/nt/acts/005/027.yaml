translation:
  language: hi
  text: उन्हें लाकर, उन्होंने उन्हें महासभा[a] के सामने खड़ा किया। तब महायाजक ने उनसे पूछताछ की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सनहेद्रिन।” यूनानी शब्द συνέδριον यहूदियों की शासकीय परिषद को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαγόντες
  choice: उन्हें लाकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई कार्रवाई बताता है; यह हिंदी में क्रम और कृदंतीय संबंध दोनों को स्वाभाविक ढंग से रखता है।
- source_word: δὲ
  choice: —
  rationale: यह हल्का कथात्मक संयोजक है; हिंदी वाक्य-प्रवाह में इसे अलग शब्द से व्यक्त करना आवश्यक नहीं।
- source_word: ἔστησαν
  choice: खड़ा कर दिए
  rationale: ἵστημι का यहाँ सकर्मक अर्थ ‘खड़ा करना/स्थान देना’ है; न्यायिक दृश्य की ठोस छवि बनी रहती है।
- source_word: ἐν τῷ συνεδρίῳ
  choice: महासभा के सामने
  rationale: संदर्भ में συνέδριον यहूदी शासकीय परिषद को दर्शाता है। ‘महासभा’ प्रचलित और बोधगम्य हिंदी रूप है, तथा ‘के सामने’ ἔστησαν के साथ स्वाभाविक न्यायिक अभिव्यक्ति है।
- source_word: ἐπηρώτησεν
  choice: पूछताछ की
  rationale: औपचारिक न्यायिक प्रसंग में यह साधारण ‘पूछा’ से अधिक उपयुक्त है, पर ‘जिरह की’ जितना प्रबल या विशिष्ट नहीं।
- source_word: ὁ ἀρχιερεὺς
  choice: महायाजक
  rationale: यह ἀρχιερεύς का मानक और सटीक हिंदी अनुवाद है।
theological_decisions:
- issue: συνέδριον का अनुवाद
  choice: महासभा
  alternative: यहूदी धर्म-सभा / सनहेद्रिन
  rationale: मुख्य पाठ में यूनानी सामान्य पद का अर्थपूर्ण हिंदी अनुवाद दिया गया है; पादटिप्पणी पारंपरिक नाम और ऐतिहासिक संदर्भ स्पष्ट करती है, बिना मुख्य पाठ में किसी विशेष व्याख्यात्मक परंपरा को थोपे।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘महासभा’ सामान्य पाठक के लिए बोधगम्य है; ‘खड़ा कर दिए’ मूल की ठोस न्यायिक मुद्रा को बनाए रखता है।
