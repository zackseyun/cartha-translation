  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: hi
  text: परन्तु शेष लोगों में से किसी को भी उनसे जुड़ने का साहस नहीं हुआ; बल्कि लोग उनका बहुत आदर करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν δὲ λοιπῶν
  choice: परन्तु बाकी लोगों में से
  rationale: यह वाक्य के विरोधसूचक δὲ और ‘शेष/बाकी लोगों’ के अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐτόλμα κολλᾶσθαι αὐτοῖς
  choice: उनके साथ जुड़ने का साहस नहीं किया
  rationale: κολλᾶσθαι का मूल भाव निकटता से संबद्ध होने या साथ जुड़ने का है; यहाँ ‘साथ जुड़ना’ प्रसंगानुकूल और सहज है।
- source_word: ἀλλ’
  choice: फिर भी
  rationale: 'यहाँ ἀλλά पिछले कथन के विपरीत स्थिति दिखाता है: लोग उनसे जुड़ने का साहस नहीं करते थे, फिर भी उनका आदर करते थे।'
- source_word: ἐμεγάλυνεν αὐτοὺς ὁ λαός
  choice: लोग उनका बहुत सम्मान करते थे
  rationale: शाब्दिक ‘उन्हें बड़ा ठहराते थे’ की अपेक्षा यह हिन्दी में प्रतिष्ठा और उच्च आदर के आशय को स्पष्ट तथा स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘बाकी लोगों’ और ‘उनके’ का संदर्भ
  choice: सर्वनामों को मूल पाठ की तरह अनिर्दिष्ट रखा गया
  alternative: उन्हें क्रमशः ‘अविश्वासी लोग’ और ‘प्रेरित’ कहकर स्पष्ट करना
  rationale: यूनानी पद में इन समूहों की पहचान इसी वाक्य में स्पष्ट नहीं की गई; व्याख्यात्मक पहचान जोड़ने से मूल की वास्तविक संदर्भगत अस्पष्टता मिट जाती।
