  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। ‘परन्तु…फिर भी’ से मूल के विरोध को सहज ढंग से व्यक्त किया गया है।
