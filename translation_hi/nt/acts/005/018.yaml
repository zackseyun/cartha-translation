lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ
  choice: पकड़ लिया
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘हाथ डालना’ है, पर इस प्रसंग में यह विरोधपूर्ण ढंग से पकड़ने या हिरासत में लेने को व्यक्त करता है। ‘पकड़ लिया’ आधुनिक हिन्दी में स्वाभाविक है और आशीष या नियुक्ति के लिए हाथ रखने का भ्रम नहीं पैदा करता।
- source_word: ἀποστόλους
  choice: प्रेरितों
  rationale: प्रेरितों के काम में यह यीशु द्वारा अधिकार देकर भेजे गए प्रतिनिधियों की प्रचलित पदवी है, केवल सामान्य ‘संदेशवाहकों’ का उल्लेख नहीं।
- source_word: ἔθεντο
  choice: रख दिया
  rationale: τίθημι का प्रसंगानुकूल सामान्य अर्थ है; ‘हिरासत में रख दिया’ स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: ἐν τηρήσει
  choice: हिरासत में
  rationale: τήρησις निगरानी में रखे जाने, बंदी अवस्था या निरोध-स्थान को सूचित कर सकता है। ‘हिरासत’ मूल की व्यापकता बनाए रखता है और अनिवार्य रूप से किसी जेल-भवन का अर्थ नहीं लगाता।
- source_word: δημοσίᾳ
  choice: सार्वजनिक
  rationale: यह τηρήσει को विशेषित करता है और सामान्यतः सार्वजनिक या आधिकारिक हिरासत का बोध देता है। ‘सार्वजनिक’ मूल विशेषण को बिना ‘राजकीय’ जैसा अतिरिक्त अर्थ जोड़े सुरक्षित रखता है।
