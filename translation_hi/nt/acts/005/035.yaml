  text: εἶπέν τε πρὸς αὐτούς· Ἄνδρες Ἰσραηλῖται, προσέχετε ἑαυτοῖς ἐπὶ τοῖς ἀνθρώποις τούτοις τί μέλλετε πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/035.yaml
  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: hi
  text: और उसने उनसे कहा, “हे इस्राएली पुरुषो, इन लोगों के साथ तुम जो करने वाले हो, उसके बारे में सावधान रहो।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन लोगों के विषय में तुम जो करने वाले हो, उसके संबंध में अपने विषय में सावधान रहो।”
    reason: यह अधिक शब्दशः विकल्प προσέχετε ἑαυτοῖς के आत्मवाचक भाव और ἐπί के ‘विषय में/के संबंध में’ अर्थ को सामने रखता है, यद्यपि हिन्दी में कम स्वाभाविक है।
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: और उसने उनसे कहा
  rationale: τέ पिछले वृत्तांत से हल्का संबंध जोड़ता है; ‘और’ बिना अनावश्यक क्रम या परिणाम जोड़े इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है। πρός के साथ बोलने की क्रिया में ‘उनसे’ संबोधित व्यक्तियों को दर्शाता है।
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: इस्राएली पुरुषो
  rationale: यह प्रत्यक्ष संबोधन है और यूनानी पाठ के पुरुषवाचक ἄνδρες को स्पष्ट रूप से बनाए रखता है। ‘इस्राएली भाइयो’ अधिक मुहावरेदार हो सकता था, पर ‘भाइयो’ स्रोत में निहित पारिवारिक संबंध जोड़ देता।
- source_word: προσέχετε ἑαυτοῖς
  choice: सावधान रहो
  rationale: यह आत्म-सावधानी और चौकसी की आज्ञा देता है। हिन्दी में ‘सावधान रहो’ चेतावनी का बल स्वाभाविक रूप से पहुँचाता है; वाक्य की बाकी रचना बताती है कि सावधानी उनके अपने भावी कार्य के विषय में है।
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: इन लोगों के साथ
  rationale: ἐπί यहाँ विचाराधीन व्यक्तियों या उनके संबंध में की जाने वाली कार्रवाई की ओर संकेत करता है। ‘इन लोगों के साथ’ व्यावहारिक अर्थ को व्यक्त करता है, पर ‘इन लोगों के विरुद्ध’ जैसी अधिक प्रबल शत्रुता पाठ में नहीं जोड़ता।
- source_word: τί μέλλετε πράσσειν
  choice: तुम जो करने वाले हो
  rationale: μέλλω के साथ infinitive निकट या अभिप्रेत भावी कार्य को सूचित करता है। ‘करने वाले हो’ इस भाव को सरल, वर्तमान हिन्दी में बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, औपचारिक और सहज रखी गई है। संबोधन में स्रोत के पुरुषवाचक रूप को बनाए रखा गया है, जबकि चेतावनी को शब्दशः अस्वाभाविक हिन्दी के बजाय स्पष्ट वाक्य-विन्यास में व्यक्त किया गया है।
