source:
  edition: SBLGNT
  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: hi
  text: इसी यीशु को परमेश्वर ने अगुआ और उद्धारकर्ता के रूप में अपनी दाहिनी ओर ऊँचा उठाया[a], ताकि वह इस्राएल को पश्चाताप और पापों की क्षमा प्रदान करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने दाहिने हाथ से ऊँचा उठाया।” यूनानी पदबंध का साधनवाचक अर्थ भी संभव है; मुख्य पाठ में इसे परमेश्वर की दाहिनी ओर, सर्वोच्च सम्मान और अधिकार के स्थान पर प्रतिष्ठित किए जाने के अर्थ में लिया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: इसी यीशु को
  rationale: संकेतवाचक सर्वनाम पर बल है और पूर्वसंदर्भ में यीशु की ओर संकेत करता है। हिन्दी में केवल ‘इसी को’ अस्पष्ट होता, इसलिए संदर्भित नाम जोड़कर बल और स्पष्टता दोनों रखे गए हैं।
- source_word: ἀρχηγὸν
  choice: अगुआ
  rationale: यह शब्द नेतृत्व और प्रधानता का अर्थ देता है। ‘अगुआ’ आधुनिक पाठक के लिए सहज है और ‘राजकुमार’ की अपेक्षा अनावश्यक राजवंशीय अर्थ नहीं जोड़ता।
- source_word: σωτῆρα
  choice: उद्धारकर्ता
  rationale: यह σωτήρ के उद्धार और छुटकारे से जुड़े व्यापक मसीही अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὕψωσεν
  choice: ऊँचा उठाया
  rationale: यहाँ भाव केवल मृतकों में से जिलाने का नहीं, बल्कि सम्मान और अधिकार के ऊँचे पद पर प्रतिष्ठित करने का है। ‘ऊँचा उठाया’ मूल रूपक को बनाए रखता है।
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: अपने दाहिने हाथ पर
  rationale: वाक्य-संदर्भ परमेश्वर के दाहिने ओर सर्वोच्च सम्मान और अधिकार के स्थान पर प्रतिष्ठा का समर्थन करता है। यूनानी में साधनवाचक अर्थ भी संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: τοῦ δοῦναι
  choice: ताकि वह … प्रदान करे
  rationale: सव्यय अनंत क्रिया उद्देश्य व्यक्त करती है। हिन्दी में ‘ताकि’ उस उद्देश्य को स्पष्ट और स्वाभाविक बनाता है; कर्ता यीशु है, जिसे ‘वह’ से स्पष्ट किया गया है।
- source_word: μετάνοιαν
  choice: मन फिराव
  rationale: यह केवल विचार बदलने के बजाय पाप से मुड़कर परमेश्वर की ओर फिरने को व्यक्त करता है। ‘मन फिराव’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और अर्थपूर्ण है।
- source_word: τῷ Ἰσραὴλ
  choice: इस्राएल को
  rationale: सम्प्रदान कारक इस्राएल को दिए जाने वाले वरदान के प्राप्तकर्ता के रूप में प्रस्तुत करता है।
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: पापों की क्षमा
  rationale: यह स्थापित, स्पष्ट और मूल पदबंध के अनुरूप हिन्दी अभिव्यक्ति है।
theological_decisions:
- issue: परमेश्वर के दाहिने हाथ से संबंधित यीशु की प्रतिष्ठा
  choice: परमेश्वर ने यीशु को अपने दाहिने हाथ पर सर्वोच्च सम्मान और अधिकार के स्थान में ऊँचा उठाया।
  alternative: परमेश्वर ने अपने दाहिने हाथ के द्वारा यीशु को ऊँचा उठाया।
  rationale: ὕψωσεν के साथ वाक्य-संदर्भ और नए नियम में राजकीय प्रतिष्ठा की प्रचलित भाषा स्थानवाचक अर्थ का समर्थन करती है, पर यूनानी चतुर्थी साधनवाचक भी हो सकती है; इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
- issue: मन फिराव देने का अर्थ
  choice: मन फिराव को परमेश्वर द्वारा यीशु के माध्यम से इस्राएल को प्रदान किए जाने वाले वरदान के रूप में व्यक्त किया गया है।
  alternative: इसे केवल मनुष्य को मन फिराने का अवसर देना समझा जा सकता है।
  rationale: δοῦναι का सामान्य अर्थ ‘देना/प्रदान करना’ है। अनुवाद मूल कथन की दैवी पहल को बनाए रखता है, पर मनुष्य की प्रतिक्रिया के स्वरूप पर इससे आगे कोई सिद्धान्त आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप। ‘इसी यीशु’ मूल संकेतवाचक बल को स्पष्ट करता है; ‘अगुआ’ सरल नेतृत्व-संज्ञा है; ‘मन फिराव’ मानसिक परिवर्तन तक सीमित न रहकर परमेश्वर की ओर मुड़ने का भाव रखता है।
