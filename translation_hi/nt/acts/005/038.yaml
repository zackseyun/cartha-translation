source:
  edition: SBLGNT
  text: καὶ τὰ νῦν λέγω ὑμῖν, ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων καὶ ⸀ἄφετε αὐτούς· (ὅτι ἐὰν ᾖ ἐξ ἀνθρώπων ἡ βουλὴ ⸀αὕτη ἢ τὸ ἔργον τοῦτο, καταλυθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: hi
  text: 'और अब मैं तुमसे कहता हूँ: इन लोगों से दूर रहो और इन्हें रहने दो; क्योंकि यदि यह योजना या यह काम मनुष्यों की ओर से है[a], तो यह नष्ट हो जाएगा[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मानवीय मूल का है।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘मिट जाएगा’ अथवा ‘निष्फल हो जाएगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: इसलिए अब
  rationale: यह मुहावरेदार पद वर्तमान परिस्थिति में गमलीएल की सलाह को प्रस्तुत करता है। ‘अब’ समय-संबंधी बल रखता है और ‘इसलिए’ पिछले कथन से स्वाभाविक संबंध जोड़ता है।
- source_word: ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων
  choice: इन लोगों से दूर रहो
  rationale: आज्ञार्थक क्रिया यहाँ उनसे अलग रहने और उनके विरुद्ध आगे हस्तक्षेप न करने का निर्देश देती है।
- source_word: ἄφετε αὐτούς
  choice: इन्हें छोड़ दो
  rationale: संदर्भ में इसका आशय उन्हें जाने देना और उनके साथ छेड़छाड़ न करना है; यह संक्षिप्त हिंदी दोनों भावों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: यदि ... मनुष्यों की ओर से है
  rationale: ἐξ स्रोत या उत्पत्ति बताता है। यह अभिव्यक्ति अगले पद में परमेश्वर से होने के स्पष्ट विरोध को सुरक्षित रखती है और ἀνθρώπων के सामान्य मानवीय अर्थ को व्यक्त करती है।
- source_word: ἡ βουλὴ αὕτη
  choice: यह योजना
  rationale: βουλή यहाँ विचारित योजना, अभिप्राय या उद्देश्य को सूचित करता है; ‘योजना’ साधारण पाठक के लिए स्पष्ट है।
- source_word: τὸ ἔργον τοῦτο
  choice: यह काम
  rationale: ἔργον किसी कार्य, गतिविधि या उपक्रम को दर्शाता है। ‘काम’ व्यापक अर्थ और ‘योजना’ के साथ स्रोत के भेद को बनाए रखता है।
- source_word: καταλυθήσεται
  choice: मिट जाएगा
  rationale: भविष्यकालीन कर्मवाच्य रूप योजना या कार्य के विघटित होकर निष्फल हो जाने को व्यक्त करता है। ‘मिट जाएगा’ हिंदी में सहज है और बाहरी विनाश तथा अपने-आप ढह जाने—दोनों संभावित भावों को खुला रखता है।
theological_decisions:
- issue: ἐξ ἀνθρώπων में मानवीय स्रोत और अगले पद के दैवी स्रोत का विरोध
  choice: मनुष्यों की ओर से
  alternative: मानवीय मूल का
  rationale: ‘मनुष्यों की ओर से’ मूल के बहुवचन और स्रोत-संबंधी भाषा को बनाए रखता है, पर इसे केवल पुरुषों तक सीमित नहीं करता। इससे अगले पद में ‘परमेश्वर की ओर से’ के साथ अभिप्रेत विरोध स्पष्ट रहता है।
- issue: καταλυθήσεται का निष्क्रिय और परिणामसूचक बल
  choice: मिट जाएगा
  alternative: नष्ट कर दिया जाएगा; विफल हो जाएगा
  rationale: मूल यह स्पष्ट नहीं करता कि विनाश किसके द्वारा होगा। चुना हुआ निष्क्रिय प्रयोग कर्ता को अनिर्दिष्ट रखता और कार्य के समाप्त हो जाने का भाव देता है।
translation_notes:
  register: आधुनिक मानक हिंदी, संबोधन में प्रसंगानुसार बहुवचन ‘तुम’, और सरल किंतु गरिमापूर्ण वाक्य-विन्यास अपनाया गया है। अर्धविराम सलाह और उसके कारण के बीच संबंध स्पष्ट करता है।
