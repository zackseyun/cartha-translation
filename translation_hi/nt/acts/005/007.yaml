  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। यूनानी की अनुमानसूचकता ‘लगभग’ से सुरक्षित रखी गई है। पाठ को सहज बनाने के लिए कृदंतीय उपवाक्य को दूसरे वाक्य के रूप में प्रस्तुत किया गया है; कोई व्याख्यात्मक या सांप्रदायिक विस्तार नहीं जोड़ा गया।
