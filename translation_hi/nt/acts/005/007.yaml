translation:
  language: hi
  text: लगभग तीन घंटे बीतने के बाद उसकी पत्नी भीतर आई। उसे नहीं मालूम था कि क्या हुआ था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: लगभग तीन घंटे बीतने के बाद
  rationale: Ἐγένετο δὲ यहाँ कथा में अगली घटना की ओर ले जाने वाला हल्का संक्रमण है। अलग से ‘और ऐसा हुआ’ कहना हिन्दी में भारी और कृत्रिम लगता; समयवाचक वाक्यांश के साथ कथा-प्रगति स्वाभाविक रूप से व्यक्त हो जाती है।
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: लगभग तीन घंटे बीतने के बाद
  rationale: διάστημα समय-अंतराल और ὡς अनुमान को व्यक्त करता है। ‘लगभग’ माप की अनिश्चितता बनाए रखता है, जबकि ‘बीतने के बाद’ सहज आधुनिक हिन्दी है।
- source_word: ἡ γυνὴ αὐτοῦ
  choice: उसकी पत्नी
  rationale: प्रसंग में γυνή हनन्याह की पत्नी को सूचित करता है, इसलिए ‘पत्नी’ स्पष्ट और स्वाभाविक है।
- source_word: μὴ εἰδυῖα τὸ γεγονὸς
  choice: उसे नहीं मालूम था कि क्या हुआ था
  rationale: नकारात्मक कृदंत उसकी भीतर आते समय की अनभिज्ञता बताता है; अलग वाक्य में यह सम्बन्ध स्पष्ट और बोलचाल से ऊपर की सहज हिन्दी में व्यक्त होता है। पूर्ण कृदंत γεγονός पहले घट चुकी घटना की ओर संकेत करता है।
- source_word: εἰσῆλθεν
  choice: भीतर आई
  rationale: εἰσέρχομαι का यहाँ सामान्य अर्थ किसी स्थान में प्रवेश करना है। ‘भीतर आई’ दृश्य के दृष्टिकोण और हिन्दी कथा-शैली दोनों के अनुकूल है।
