  edition: SBLGNT
  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: hi
  text: कहा, “हमने तुम्हें सख़्ती से आदेश दिया था कि तुम इस नाम के विषय में शिक्षा न दो, और देखो, तुमने यरूशलेम को अपनी शिक्षा से भर दिया है, और तुम इस मनुष्य का लहू हम पर लाना चाहते हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, ‘इस मनुष्य की मृत्यु के लिए हमें दोषी ठहराना।’ यूनानी में किसी का ‘लहू’ किसी पर लाना उसकी मृत्यु का दोष उस पर रखने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: हमने तुम्हें कड़ी आज्ञा दी थी
  rationale: संज्ञा और उसी मूल की क्रिया का प्रयोग आज्ञा की प्रबलता दर्शाता है। हिन्दी में स्वाभाविक रूप से ‘कड़ी आज्ञा’ इस बल को व्यक्त करता है।
- source_word: μὴ διδάσκειν
  choice: शिक्षा न देना
  rationale: यह आज्ञा में निहित निषेध को सीधे व्यक्त करता है; ‘शिक्षा देना बंद कर दो’ कहना यूनानी पाठ से अधिक व्याख्यात्मक होता।
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: इस नाम में
  rationale: यह यूनानी अभिव्यक्ति के रूपक को बनाए रखता है और नाम से जुड़े अधिकार या आधार की सम्भावना को अनावश्यक रूप से किसी एक अर्थ तक सीमित नहीं करता।
- source_word: ἰδοὺ
  choice: फिर भी देखो
  rationale: ‘देखो’ आरोपपूर्ण संकेतात्मक बल को आधुनिक हिन्दी में स्वाभाविक ढंग से रखता है; ‘फिर भी’ आज्ञा और उसके बाद की स्थिति के स्पष्ट विरोध को व्यक्त करता है।
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ
  choice: तुमने यरूशलेम को ... भर दिया है
  rationale: पूर्ण क्रिया के सम्पन्न कार्य और उसके वर्तमान परिणाम, दोनों को हिन्दी का पूर्ण वर्तमान रूप व्यक्त करता है और ‘भरने’ का मूल रूपक बनाए रखता है।
- source_word: τῆς διδαχῆς ὑμῶν
  choice: अपनी शिक्षा से
  rationale: ‘शिक्षा’ सामान्य आधुनिक हिन्दी में διδαχή की विषयवस्तु को स्पष्ट रूप से व्यक्त करता है और ‘सिद्धान्त’ जैसे अधिक पारिभाषिक शब्द से बचता है।
- source_word: βούλεσθε
  choice: तुम ... चाहते हो
  rationale: यहाँ क्रिया इच्छा या अभिप्राय व्यक्त करती है। ‘चाहते हो’ आरोप के स्वर को रखते हुए हिन्दी में स्वाभाविक है।
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: हम पर लाना
  rationale: यह किसी दायित्व या दोष को किसी पर लाने की यूनानी छवि को सुरक्षित रखता है।
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: इस मनुष्य का लहू
  rationale: ‘लहू’ रक्त-दोष की मूल छवि को बनाए रखता है, जबकि ‘इस मनुष्य’ वक्ताओं की दूरी और तिरस्कारपूर्ण संकेत को सुरक्षित रखता है।
theological_decisions:
- issue: ‘इस मनुष्य का लहू हम पर लाना’ का आशय
  choice: मुख्य पाठ में लहू को किसी पर लाने की मूल छवि बनाए रखी गई है।
  alternative: ‘इस मनुष्य की मृत्यु के लिए हमें दोषी ठहराना’
  rationale: यह मुहावरा उसकी मृत्यु के लिए उत्तरदायित्व या रक्त-दोष का संकेत देता है, पर मुख्य पाठ में इसे स्पष्ट व्याख्या से बदलना मूल की प्रभावशाली छवि और निहित तनाव को समाप्त कर देता। अर्थ को पाद-टिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘इस नाम में’ तथा ‘लहू हम पर लाना’ जैसी मूल रूपकात्मक अभिव्यक्तियाँ जानबूझकर सुरक्षित हैं; कठिन मुहावरे का अर्थ पाद-टिप्पणी में दिया गया है।
