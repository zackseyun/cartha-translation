  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: hi
  text: हमारे पूर्वजों का परमेश्वर ने यीशु को उठाया[a], जिसे तुमने पेड़[b] पर लटकाकर मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जिलाया’। यहाँ क्रिया पुनरुत्थान का संकेत कर सकती है, यद्यपि इस पद के यूनानी पाठ में स्पष्ट रूप से ‘मरे हुओं में से’ नहीं कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘क्रूस पर’। यूनानी में ‘पेड़’ या ‘लकड़ी’ है; यह संभवतः व्यवस्थाविवरण 21:23 की प्रतिध्वनि है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: हमारे पूर्वजों के परमेश्वर
  rationale: यह स्वाभाविक आधुनिक हिन्दी में इस्राएल के पैतृक और वाचागत संदर्भ को बनाए रखता है। ‘बाप-दादों’ की अपेक्षा ‘पूर्वजों’ अधिक गरिमापूर्ण और व्यापक रूप से बोधगम्य है।
- source_word: ἤγειρεν
  choice: उठाया
  rationale: यह ἐγείρω का सीधा रूप है और यहाँ पुनरुत्थान का प्रबल संदर्भ सुनाई देता है, पर ‘मरे हुओं में से’ जैसे स्रोत में अनुपस्थित शब्द नहीं जोड़ता।
- source_word: Ἰησοῦν
  choice: यीशु
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: διεχειρίσασθε
  choice: मार डाला
  rationale: संदर्भ में क्रिया हिंसक रीति से मृत्यु देने को व्यक्त करती है। ‘मार डाला’ स्पष्ट, सीधा और स्वाभाविक हिन्दी प्रयोग है।
- source_word: κρεμάσαντες
  choice: लटकाकर
  rationale: कृदंत को साधनसूचक रूप में व्यक्त करता है—उसे मार डालने का ढंग काठ पर लटकाना था।
- source_word: ἐπὶ ξύλου
  choice: काठ पर
  rationale: ξύλον का अर्थ लकड़ी, काठ या वृक्ष हो सकता है। ‘काठ’ लकड़ी की वस्तु और क्रूस के संकेत—दोनों को खुला रखता है तथा व्यवस्थाविवरण 21:23 की संभावित प्रतिध्वनि को पूरी तरह ‘क्रूस’ में विलीन नहीं करता।
theological_decisions:
- issue: क्या ἤγειρεν को स्पष्ट रूप से पुनरुत्थान बताकर अनूदित किया जाए
  choice: उठाया
  alternative: मरे हुओं में से जिलाया
  rationale: निकटवर्ती संदर्भ पुनरुत्थान का संकेत देता है, पर इस पद के यूनानी पाठ में ‘मरे हुओं में से’ नहीं है। संक्षिप्त रूप मूल की अर्थगत गुंजाइश और तनाव बचाता है।
- issue: क्या ξύλου का अनुवाद सीधे ‘क्रूस’ किया जाए
  choice: काठ पर
  alternative: क्रूस पर; पेड़ पर
  rationale: मूल में σταυρός नहीं बल्कि ξύλον है। ‘काठ’ वास्तविक क्रूस-संदर्भ के साथ मूल के लकड़ी/वृक्ष संबंधी शब्द और संभावित व्यवस्थाविवरणीय संकेत को सुरक्षित रखता है।
