  text: Πορεύεσθε καὶ σταθέντες λαλεῖτε ἐν τῷ ἱερῷ τῷ λαῷ πάντα τὰ ῥήματα τῆς ζωῆς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/020.yaml
  text: Go and stand in the temple[c][b][a], and speak to the people all the words of this life.
translation:
  language: hi
  text: “जाओ और मंदिर-परिसर में खड़े हो जाओ और लोगों को इस जीवन की सारी बातें बोलो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πορεύεσθε
  choice: जाओ
  rationale: प्रत्यक्ष आज्ञार्थक रूप को स्वाभाविक और स्पष्ट हिन्दी आज्ञा के रूप में व्यक्त करता है।
- source_word: σταθέντες
  choice: खड़े होकर
  rationale: अओरिस्ट कृदन्त के परिस्थितिसूचक/सहगामी भाव को बनाए रखता है और हिन्दी में स्वाभाविक लगता है।
- source_word: λαλεῖτε
  choice: सुनाओ
  rationale: लोगों को सम्बोधित करके बातें कहने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘प्रचार करो’ जैसा अतिरिक्त घोषणात्मक भाव नहीं जोड़ता।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर-परिसर में
  rationale: ἱερόν यहाँ भीतरी पवित्रस्थान तक सीमित न होकर पूरे मन्दिर-परिसर को सूचित करता है; यह हिन्दी चयन उस स्थानगत विस्तार को स्पष्ट रखता है।
- source_word: τῷ λαῷ
  choice: लोगों को
  rationale: मूल के सामान्य पद λαός का सीधा अनुवाद है और ऐसी जातीय या परिस्थितिगत विशिष्टता नहीं जोड़ता जो पद में स्पष्ट नहीं है।
- source_word: πάντα τὰ ῥήματα
  choice: सारी बातें
  rationale: πᾶς की समग्रता और ῥήματα की कही गई बातों का भाव सहज हिन्दी में रखता है; ‘पूरा सन्देश’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: τῆς ζωῆς ταύτης
  choice: इस जीवन की
  rationale: सम्बन्धकारक रचना को निकटता से बनाए रखता है और यह अस्पष्टता खुली छोड़ता है कि आशय इस जीवन के विषय में कही गई बातों, इससे सम्बन्धित जीवन, या सुसमाचार में घोषित जीवन से है।
theological_decisions:
- issue: τῆς ζωῆς ταύτης (‘इस जीवन की’) का आशय
  choice: संक्षिप्त वाक्यांश ‘इस जीवन की’ को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: ‘इस नए जीवन के विषय में’, ‘इस जीवन-पद्धति की’, या ‘जीवन देनेवाला सन्देश’
  rationale: यूनानी वाक्यांश सम्भवतः यीशु में उद्धार और प्रेरितों द्वारा घोषित जीवन की ओर संकेत करता है, पर उसका रूप संक्षिप्त और अर्थगर्भित है। अनुवाद किसी एक धर्मवैज्ञानिक व्याख्या को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘मन्दिर-परिसर’ से ἱερόν का व्यापक स्थानगत अर्थ मुख्य पाठ में स्पष्ट किया गया है। ‘इस जीवन की’ की जानबूझकर रखी गई अर्थगत खुलावट को पादटिप्पणी में समझाया गया है।
