base_translation:
  language: en
  yaml_path: translation/nt/acts/005/025.yaml
  text: But someone came and reported to them[a], “Look, the men whom you put in prison are standing in the temple and teaching the people.”
translation:
  language: hi
  text: लेकिन किसी ने आकर उन्हें सूचना दी, “देखिए, जिन लोगों को आपने बंदीगृह में डाला था, वे मंदिर-परिसर[a] में खड़े हैं और लोगों को शिक्षा दे रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द ἱερόν पूरे मंदिर-परिसर को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं।
    reason: lexical_clarification
lexical_decisions:
- source_word: παραγενόμενος
  choice: आकर
  rationale: आओरिस्ट कृदंत संदेश देने से पहले उस व्यक्ति के पहुँचने को दर्शाता है; ‘आकर’ हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δέ
  choice: लेकिन
  rationale: यह पिछले प्रसंग के बाद एक अप्रत्याशित मोड़ या हल्का विरोध दर्शाता है।
- source_word: τις
  choice: किसी ने
  rationale: अनिश्चित व्यक्ति का उल्लेख है; यूनानी पाठ उसकी पहचान नहीं बताता, इसलिए हिन्दी में भी अनिश्चितता रखी गई है।
- source_word: ἀπήγγειλεν
  choice: सूचना दी
  rationale: अधिकारियों तक औपचारिक रूप से समाचार पहुँचाने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ἰδοὺ
  choice: देखिए
  rationale: यह ध्यान खींचने और आश्चर्यजनक समाचार प्रस्तुत करने वाला उद्गार है; आदरसूचक बहुवचन संबोधन प्रसंगानुकूल है।
- source_word: οἱ ἄνδρες
  choice: जिन लोगों को
  rationale: यह पहले बंदी बनाए गए प्रेरितों को सूचित करता है। हिन्दी में ‘लोगों’ से समूह का संदर्भ स्वाभाविक रहता है और अनावश्यक लैंगिक जोर नहीं आता।
- source_word: οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: जिन लोगों को आपने बंदीगृह में डाला था
  rationale: ἔθεσθε का सीधा ‘डाला’ और φυλακή का गरिमापूर्ण ‘बंदीगृह’ प्रसंग तथा ज्ञात कारावास-स्थान को स्पष्ट रखते हैं।
- source_word: ἐν τῷ ἱερῷ
  choice: मंदिर-परिसर में
  rationale: ἱερόν संपूर्ण मंदिर-परिसर को दर्शाता है, केवल भीतरी पवित्रस्थान को नहीं; इसलिए हिन्दी में इसे मुख्य पाठ में स्पष्ट किया गया है।
- source_word: ἑστῶτες καὶ διδάσκοντες
  choice: खड़े होकर ... शिक्षा दे रहे हैं
  rationale: दोनों वर्तमान कृदंतों के जारी क्रियाभाव को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: τὸν λαόν
  choice: लोगों को
  rationale: यह वहाँ उपस्थित जनसमुदाय को सूचित करता है; ‘लोगों’ आधुनिक और सहज हिन्दी है।
theological_decisions:
- issue: ἱερόν का स्थान-संदर्भ
  choice: मंदिर-परिसर
  alternative: मंदिर
  rationale: यह शब्द सामान्यतः यरूशलेम के पूरे मंदिर-परिसर के लिए प्रयुक्त है, न कि केवल भीतरी पवित्रस्थान के लिए। यह स्थानगत भेद है, कोई संप्रदायगत व्याख्या नहीं।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। ‘देखिए’ अधिकारियों के प्रति संबोधन को स्वाभाविक रखता है। ‘मंदिर-परिसर’ मूल यूनानी की स्थानगत सटीकता मुख्य पाठ में देता है; पादटिप्पणी उसी भेद को संक्षेप में स्पष्ट करती है।
