source:
  edition: SBLGNT
  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: hi
  text: तब वे महासभा के सामने से आनन्दित होते हुए चले गए, क्योंकि वे “नाम”[a] के लिए अपमानित किए जाने के योग्य ठहराए गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु का नाम।” यूनानी में केवल “नाम” है—एक श्रद्धापूर्ण संक्षिप्त अभिव्यक्ति, जिसका सन्दर्भ यहाँ यीशु से है।
    reason: मुख्य पाठ में यूनानी की निहित, निरपेक्ष अभिव्यक्ति को बनाए रखते हुए सन्दर्भगत पहचान को वैकल्पिक रूप में प्रस्तुत करता है।
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: चले गए
  rationale: अपूर्णकालिक क्रिया उनके महासभा के सामने से आगे चले जाने को दिखाती है; हिन्दी में ‘चले गए’ स्वाभाविक कथा-प्रवाह देता है।
- source_word: χαίροντες
  choice: आनन्दित थे
  rationale: वर्तमान कृदन्त उनके जाते समय साथ-साथ रहने वाले आनन्द को व्यक्त करता है; अलग वाक्य में यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: महासभा के सामने से
  rationale: यह यूनानी मुहावरे ‘सभा के मुख/उपस्थिति से’ का सहज हिन्दी रूप है और उनके उस शासकीय निकाय के सामने से जाने का भाव बनाए रखता है।
- source_word: συνεδρίου
  choice: महासभा
  rationale: यहाँ συνέδριον यहूदी शासकीय परिषद को सूचित करता है; ‘महासभा’ सामान्य पाठक के लिए सुलभ है और केवल लिप्यंतरण से बचता है।
- source_word: κατηξιώθησαν
  choice: योग्य ठहराया गया था
  rationale: कर्मवाच्य रूप इस बात को बनाए रखता है कि उन्हें योग्य माना गया; कर्ता को स्पष्ट नहीं किया गया, क्योंकि यूनानी पाठ भी उसे नहीं बताता।
- source_word: ὑπὲρ
  choice: के लिए
  rationale: यहाँ ὑπέρ ‘के कारण/के निमित्त’ अपमान सहने का सम्बन्ध व्यक्त करता है; ‘के लिए’ संक्षिप्त और स्वाभाविक है।
- source_word: τοῦ ὀνόματος
  choice: “नाम”
  rationale: यूनानी में केवल निश्चित पद ‘नाम’ है। उद्धरण-चिह्न हिन्दी पाठक को इसके विशेष, श्रद्धापूर्ण प्रयोग का संकेत देते हैं, बिना मुख्य पाठ में ‘यीशु’ जोड़ने के।
- source_word: ἀτιμασθῆναι
  choice: अपमानित किए जाने
  rationale: यह कर्मवाच्य अनन्तरूप मूल के मान-अपमान सम्बन्धी अर्थ को सीधे और स्वाभाविक रूप में सुरक्षित रखता है।
theological_decisions:
- issue: ‘नाम’ का निरपेक्ष, श्रद्धापूर्ण प्रयोग
  choice: मुख्य पाठ में केवल “नाम” रखा गया है।
  alternative: ‘यीशु का नाम’ या ‘उसका नाम’
  rationale: सन्दर्भ में संकेत यीशु की ओर है, पर यूनानी पाठ इस पद में उनका नाम स्पष्ट रूप से नहीं जोड़ता। ‘नाम’ को बनाए रखने से मूल की श्रद्धापूर्ण संक्षिप्तता और निहितार्थ सुरक्षित रहते हैं।
- issue: योग्य ठहराने वाले कर्ता की पहचान
  choice: कर्मवाच्य और अनिर्दिष्ट कर्ता बनाए रखा गया है।
  alternative: ‘परमेश्वर ने उन्हें योग्य ठहराया’
  rationale: यहाँ कर्मवाच्य क्रिया का कर्ता मूल पाठ में व्यक्त नहीं है। परमेश्वर को कर्ता मानना सम्भव है, पर अनुवाद में उसे स्पष्ट जोड़ना पाठ की वास्तविक अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लम्बे यूनानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है, पर जाते समय आनन्दित होने और उसके कारण का सम्बन्ध स्पष्ट बना हुआ है।
