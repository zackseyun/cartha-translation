base_translation:
  language: en
  yaml_path: translation/nt/acts/005/012.yaml
  text: Many signs and wonders were being done among the people through the hands of the apostles[b][a], and they were all together in Solomon’s Portico.
translation:
  language: hi
  text: प्रेरितों के हाथों के द्वारा लोगों के बीच बहुत-से चिन्ह और चमत्कार किए जाते थे। और वे सब एक मन होकर[a] सुलैमान के स्तंभों वाले बरामदे[b] में थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक साथ।” यूनानी शब्द एक स्थान पर साथ होने के साथ-साथ मन और उद्देश्य की एकता पर भी बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “सुलैमान का बरामदा” या “सुलैमान का पोर्टिको।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: प्रेरितों के हाथों से
  rationale: διά के साथ संबंधकारक साधन या माध्यम व्यक्त करता है। ‘हाथों से’ मूल यूनानी के ठोस मुहावरे और प्रेरितों की माध्यमगत भूमिका को बनाए रखता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ तीखा विरोध नहीं, बल्कि कथानक को आगे बढ़ाने वाला हल्का संयोजक है; आधुनिक हिन्दी में ‘और’ स्वाभाविक है।
- source_word: ἐγίνετο
  choice: होते रहते थे
  rationale: अपूर्ण भूतकाल चलती या बार-बार होने वाली गतिविधि दर्शाता है। यह हिन्दी प्रयोग उस निरंतरता को स्पष्ट रूप से व्यक्त करता है।
- source_word: σημεῖα καὶ τέρατα
  choice: चिन्ह और अद्भुत काम
  rationale: ‘चिन्ह’ σημεῖα के संकेतात्मक अर्थ को रखता है, जबकि ‘अद्भुत काम’ τέρατα को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है; ‘चमत्कारी’ जोड़ना अनावश्यक व्याख्या होता।
- source_word: πολλὰ
  choice: बहुत-से
  rationale: यह चिन्हों और अद्भुत कामों की बड़ी संख्या बताता है और हिन्दी में दोनों संयुक्त संज्ञाओं पर स्वाभाविक रूप से लागू होता है।
- source_word: ἐν τῷ λαῷ
  choice: लोगों के बीच
  rationale: यह कार्यों के लोगों के मध्य होने का क्षेत्र बताता है और मूल पाठ से आगे बढ़कर उनकी जातीय पहचान निश्चित नहीं करता।
- source_word: ὁμοθυμαδὸν
  choice: एक साथ
  rationale: यह आधुनिक, सहज हिन्दी है और सामूहिक उपस्थिति व्यक्त करती है; साझा मन और उद्देश्य की अतिरिक्त छाया पाद-टिप्पणी में सुरक्षित है।
- source_word: ἅπαντες
  choice: वे सब
  rationale: यह समूह की समग्रता व्यक्त करता है, पर सर्वनाम का निहित संदर्भ प्रेरितों तक या सभी विश्वासियों तक सीमित नहीं करता।
- source_word: Στοᾷ Σολομῶντος
  choice: सुलैमान के मंडप
  rationale: ‘मंडप’ एक ढके हुए सार्वजनिक स्थान के लिए सुबोध और गरिमापूर्ण शब्द है; स्तंभों वाले बरामदे का अधिक वास्तुशिल्पीय विकल्प पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘वे सब’ का संदर्भ
  choice: निहित कर्ता को ‘वे सब’ रखकर उसका संदर्भ खुला रखा गया है।
  alternative: इसे केवल प्रेरितों या स्पष्ट रूप से सभी विश्वासियों के रूप में पहचाना जा सकता था।
  rationale: यूनानी में ἅπαντες का पूर्वपद स्पष्ट नहीं है। अनुवाद मूल अस्पष्टता को बनाए रखता है और किसी एक व्याख्या को मुख्य पाठ में निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। वाक्य-विन्यास यूनानी के क्रम और निरंतर क्रिया को पर्याप्त रूप से बनाए रखते हुए हिन्दी में सहज रखा गया है।
