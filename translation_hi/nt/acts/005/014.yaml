id: ACT.5.14
reference: Acts 5:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μᾶλλον δὲ προσετίθεντο πιστεύοντες τῷ κυρίῳ πλήθη ἀνδρῶν τε καὶ γυναικῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: hi
  text: और प्रभु पर विश्वास करनेवाले और भी अधिक लोग—बहुत बड़ी संख्या में पुरुष और स्त्रियाँ—जोड़े जाते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शामिल होते जाते थे” अथवा “जुड़ते जाते थे।” यूनानी क्रिया लगातार संख्या बढ़ने का भाव देती है। इसका निष्क्रिय रूप यह संकेत कर सकता है कि उन्हें जोड़नेवाला परमेश्वर था, पर मूल पाठ यहाँ कर्ता को स्पष्ट नहीं करता।
    reason: क्रिया के निष्क्रिय तथा मध्यवाच्य/अकर्मक अर्थों की वास्तविक संभावना और उसके निहित धर्मवैचारिक संकेत को सुरक्षित रखना।
lexical_decisions:
- source_word: μᾶλλον
  choice: और भी अधिक
  rationale: यह तुलनात्मक वृद्धि पर बल देता है और प्रसंग में लगातार बढ़ती संख्या को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ यह प्रबल विरोध नहीं, बल्कि कथा को आगे बढ़ानेवाला हल्का संयोजक है।
- source_word: προσετίθεντο
  choice: जोड़े जाते थे
  rationale: अपूर्ण काल की निरंतरता और निष्क्रिय वाच्य—दोनों सुरक्षित रहते हैं; इससे यह संकेत भी बना रहता है कि जोड़नेवाला परमेश्वर हो सकता है, यद्यपि यूनानी पाठ उसे स्पष्ट कर्ता नहीं बनाता।
- source_word: πιστεύοντες
  choice: विश्वास करनेवाले
  rationale: वर्तमान कृदंत यहाँ संज्ञा के समान प्रयुक्त है; यह रूप साधारण पाठकों के लिए स्पष्ट और स्वाभाविक है।
- source_word: τῷ κυρίῳ
  choice: प्रभु पर
  rationale: πιστεύω के साथ यह विश्वास के लक्ष्य को व्यक्त करता है; हिन्दी में किसी व्यक्ति पर विश्वास करना स्वाभाविक प्रयोग है।
- source_word: κύριος
  choice: प्रभु
  rationale: यह श्रद्धापूर्ण और मसीह-संबंधी उपाधि को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: πλήθη
  choice: बहुत बड़ी संख्या में
  rationale: बहुवचन πλήθη बड़ी संख्या/जनसमूह का बोध कराता है; यह हिन्दी में कृत्रिम लगे बिना वृद्धि के व्यापक पैमाने को व्यक्त करता है।
- source_word: ἀνδρῶν τε καὶ γυναικῶν
  choice: पुरुष और स्त्रियाँ
  rationale: τε καί की समावेशी-सहसंबंधी शक्ति को बनाए रखते हुए दोनों समूहों का स्पष्ट उल्लेख किया गया है।
theological_decisions:
- issue: ‘प्रभु’ का संदर्भ और भाव
  choice: उपाधि ‘प्रभु’ को यथावत रखते हुए वाक्य को उन लोगों के रूप में प्रस्तुत किया गया है जो प्रभु पर विश्वास करते हैं।
  alternative: ‘प्रभु’ को मुख्य पाठ में स्पष्ट रूप से ‘यीशु’ कहना, अथवा सामान्य रूप से ‘परमेश्वर’ समझना।
  rationale: प्रेरितों के काम के ऐसे सुसमाचार-सारांशों में κύριος प्रायः पुनर्जीवित यीशु की ओर संकेत करता है, पर मूल पाठ केवल उपाधि देता है; इसलिए अनुवाद संदर्भ को अनावश्यक रूप से स्पष्ट नहीं करता।
- issue: προσετίθεντο का वाच्य और कालगत भाव
  choice: 'निरंतर निष्क्रिय भाव: ‘जोड़े जाते थे।’'
  alternative: 'मध्यवाच्य/अकर्मक भाव: ‘शामिल होते जाते थे’ या ‘जुड़ते जाते थे।’'
  rationale: निष्क्रिय अनुवाद यूनानी रूप और चलती हुई वृद्धि को सुरक्षित रखता है तथा परमेश्वर को संभावित अप्रकट कर्ता रहने देता है, बिना उसे पाठ में स्पष्ट रूप से जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। डैश के भीतर रखा वाक्यांश यूनानी के व्याख्यात्मक समानाधिकरण को स्पष्ट करता है और पुरुषों तथा स्त्रियों—दोनों की बड़ी संख्या पर बल बनाए रखता है।
