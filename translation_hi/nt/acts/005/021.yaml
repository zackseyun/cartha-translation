id: ACT.5.21
reference: Acts 5:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: hi
  text: यह सुनकर वे पौ फटते ही मन्दिर के आँगनों में गए और शिक्षा दे रहे थे। तब प्रधान याजक और उसके साथ के लोग आए। उन्होंने महासभा और इस्राएल के पुत्रों की पूरी परिषद[a] को बुलाया और बन्दीगृह में भेजा कि उन्हें लाया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक स्वाभाविक रूप में, “इस्राएल की पूरी परिषद” या “इस्राएल के बुज़ुर्गों की पूरी सभा।”
    reason: γερουσία परिषद अथवा बुज़ुर्गों के निकाय को सूचित करता है। महासभा के साथ इसका सम्बन्ध विस्तारात्मक भी समझा जा सकता है; मुख्य पाठ इस सम्भावना को निर्णीत नहीं करता।
lexical_decisions:
- source_word: ἀκούσαντες
  choice: यह सुनकर
  rationale: कालसूचक कृदन्त पिछले पद में स्वर्गदूत की आज्ञा की ओर संकेत करता है; यह हिन्दी में स्वाभाविक रूप से घटनाक्रम बनाए रखता है।
- source_word: ὑπὸ τὸν ὄρθρον
  choice: पौ फटते ही
  rationale: यह आरम्भिक भोर का स्वाभाविक और सटीक हिन्दी मुहावरा है।
- source_word: ἱερὸν
  choice: मन्दिर के आँगनों
  rationale: ἱερόν पूरे मन्दिर-परिसर को दर्शाता है, न कि केवल पवित्र भवन को; ‘आँगनों’ से सार्वजनिक शिक्षण का स्थान स्पष्ट होता है।
- source_word: ἐδίδασκον
  choice: शिक्षा देने लगे
  rationale: अपूर्णकाल जारी गतिविधि को व्यक्त करता है; सन्दर्भ में उनके प्रवेश के बाद आरम्भ होकर चल रही शिक्षा को स्वाभाविक हिन्दी में दर्शाया गया है।
- source_word: Παραγενόμενος
  choice: वहाँ पहुँचे
  rationale: कालसूचक कृदन्त अगले घटनाक्रम में प्रधान याजक और उसके साथियों के आगमन को व्यक्त करता है।
- source_word: οἱ σὺν αὐτῷ
  choice: उसके साथी
  rationale: यूनानी पाठ साथ उपस्थित लोगों की पहचान अधिक विशिष्ट नहीं करता; अतः अनावश्यक पहचान जोड़े बिना सहज हिन्दी चुनी गई है।
- source_word: συνέδριον
  choice: महासभा
  rationale: यह यहूदी शासकीय परिषद, अर्थात सन्हेद्रिन, का बोध कराने वाला प्रतिष्ठित और समझने योग्य हिन्दी पद है।
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: इस्राएल के पुत्रों की पूरी पुरनियों की सभा
  rationale: γερουσία को पुरनियों की सभा के रूप में और पारम्परिक राष्ट्रीय अभिव्यक्ति υἱῶν Ἰσραήλ को औपचारिक रूप से सुरक्षित रखा गया है; महासभा से इसका सटीक सम्बन्ध अस्पष्ट होने के कारण उसे नहीं सुलझाया गया।
- source_word: δεσμωτήριον
  choice: बन्दीगृह
  rationale: कारावास के स्थान के लिए गरिमापूर्ण, स्पष्ट मानक हिन्दी पद।
- source_word: ἀχθῆναι αὐτούς
  choice: उन्हें लिवा लाने के लिए
  rationale: निष्क्रिय अनन्त क्रिया का प्रयोजन और परोक्ष प्रेरणार्थक भाव सहज हिन्दी में व्यक्त होता है; ‘सेवक’ प्रेषित व्यक्तियों का अन्तर्निहित कर्म है।
theological_decisions:
- issue: τῶν υἱῶν Ἰσραήλ का रूपान्तरण
  choice: इस्राएल के पुत्रों की
  alternative: इस्राएल की / इस्राएलियों की
  rationale: मूल की स्पष्ट पारिवारिक-राष्ट्रीय, पुल्लिंग अभिव्यक्ति को बनाए रखा गया है; इसे चुपचाप सामान्य राष्ट्रीय विशेषण में नहीं बदला गया।
- issue: συνέδριον और γερουσία का पारस्परिक सम्बन्ध
  choice: महासभा और ... पूरी पुरनियों की सभा
  alternative: महासभा, अर्थात इस्राएल की पूरी पुरनियों की सभा
  rationale: यूनानी καί दोनों को समन्वित करता है, पर दूसरा पद विस्तारात्मक अथवा पृथक निकाय हो सकता है। मुख्य पाठ इस तनाव को सुलझाने के बजाय संरक्षित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-पाठ योग्य रूप। ‘पौ फटते ही’ सहज मुहावरा है; ‘महासभा’, ‘पुरनियों की सभा’ और ‘बन्दीगृह’ ऐतिहासिक-सांस्थिक प्रसंग के अनुरूप हैं।
