source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ⸀ἐσμεν μάρτυρες τῶν ῥημάτων τούτων, καὶ τὸ ⸀πνεῦμα τὸ ἅγιον ὃ ἔδωκεν ὁ θεὸς τοῖς πειθαρχοῦσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/032.yaml
  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: hi
  text: और हम इन बातों के गवाह हैं[a], और पवित्र आत्मा भी गवाह है[b], जिसे परमेश्वर ने उन लोगों को दिया है जो उसकी आज्ञा मानते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इन वचनों’ अथवा ‘इन मामलों’।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में शाब्दिक रूप से ‘और पवित्र आत्मा’ है; पहले उपवाक्य का भाव यहाँ भी लागू होता है: ‘और पवित्र आत्मा भी [गवाह है]।’'
    reason: alternative_reading
lexical_decisions:
- source_word: μάρτυρες
  choice: गवाह
  rationale: यह प्रेरितों द्वारा प्रत्यक्ष रूप से देखी-सुनी बातों की साक्षी देने के अर्थ को स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῶν ῥημάτων τούτων
  choice: इन बातों
  rationale: ῥῆμα का अर्थ ‘वचन’, ‘बात’ या ‘मामला’ हो सकता है। यहाँ ‘इन बातों’ निकटवर्ती घटनाओं और उनके विषय में कही गई बातों—दोनों को समेटता है और मूल की अर्थ-व्यापकता बनाए रखता है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: यह आधुनिक हिन्दी में इस पद के व्यक्तिगत दिव्य संदर्भ का मानक और सहज अनुवाद है।
- source_word: ὃ
  choice: जिसे
  rationale: यूनानी सर्वनाम व्याकरण की दृष्टि से नपुंसकलिंग πνεῦμα के अनुरूप है; हिन्दी में ‘जिसे’ संदर्भ को स्वाभाविक रूप से जोड़ता है और पवित्र आत्मा को अवैयक्तिक वस्तु नहीं बनाता।
- source_word: ἔδωκεν
  choice: दिया है
  rationale: यूनानी एओरिस्ट भूतकालीन देने को बताता है; हिन्दी का पूर्ण वर्तमान इस दिए जाने की वर्तमान प्रासंगिकता को स्वाभाविक रूप से व्यक्त करता है, बिना क्रिया में नया अर्थ जोड़े।
- source_word: πειθαρχοῦσιν
  choice: आज्ञा मानते हैं
  rationale: πειθαρχέω अधिकार रखने वाले की आज्ञा मानने का अर्थ देता है। यह चुनाव पद 29 में मनुष्यों के बजाय परमेश्वर की आज्ञा मानने के निकट संदर्भ से भी मेल खाता है।
- source_word: αὐτῷ
  choice: उसकी
  rationale: सर्वनाम का पूर्वपद परमेश्वर है। हिन्दी में ‘उसकी आज्ञा मानते हैं’ मूल के सर्वनाम-संबंध को स्पष्ट और सहज ढंग से बनाए रखता है।
theological_decisions:
- issue: क्या पवित्र आत्मा को प्रेरितों के साथ सह-गवाह बताया गया है
  choice: ‘और पवित्र आत्मा भी गवाह है’ कहकर पहले उपवाक्य के निहित विधेय को दूसरे में स्पष्ट किया गया है।
  alternative: ‘और पवित्र आत्मा भी’
  rationale: दूसरा यूनानी उपवाक्य क्रियारहित है और स्वाभाविक रूप से पहले उपवाक्य के ‘गवाह हैं’ को ग्रहण करता है। हिन्दी में विधेय दोहराने से अर्थ साफ होता है और पवित्र आत्मा की सह-गवाही का मूल कथन सुरक्षित रहता है।
- issue: पवित्र आत्मा के लिए संबंधवाचक सर्वनाम
  choice: व्यक्तिगत संदर्भ के अनुरूप ‘जिसे’
  alternative: ऐसी शब्दावली जो आत्मा को अवैयक्तिक वस्तु के रूप में प्रस्तुत करे
  rationale: यूनानी में ὃ का नपुंसकलिंग रूप πνεῦμα के व्याकरणिक लिंग के कारण है। हिन्दी अनुवाद में संदर्भ की व्यक्तिगत प्रकृति बनाए रखना उचित है; इससे मूल से परे कोई अलग धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गवाह’, ‘बातों’ और ‘आज्ञा मानते हैं’ प्रचलित शब्द हैं। वाक्य में निहित यूनानी विधेय को स्पष्ट करने के लिए ‘गवाह है’ दोहराया गया है; कोष्ठकीय अस्पष्टता मुख्य पाठ पर नहीं थोपी गई।
