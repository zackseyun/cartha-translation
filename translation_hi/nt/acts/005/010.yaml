  text: Then she immediately fell at his feet and died. When the young men came in, they found her dead, and they carried her out and buried her beside her husband.
translation:
  language: hi
  text: तब वह तुरंत उसके पैरों पर गिर पड़ी और मर गई। जब वे युवक भीतर आए, तो उन्होंने उसे मृत पाया। फिर वे उसे बाहर ले गए और उसके पति के पास दफना दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: तुरन्त
  rationale: यह क्रियाविशेषण घटना के तत्काल घटने पर बल देता है; ‘तुरन्त’ इसका स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: ἐξέψυξεν
  choice: मर गई
  rationale: शाब्दिक अर्थ ‘प्राण निकल गए’ है, पर प्रसंग में इसका सीधा अर्थ मृत्यु है; आधुनिक हिन्दी में ‘मर गई’ स्पष्ट और स्वाभाविक है तथा अंग्रेज़ी परामर्श-पाठ के निर्णय से भी मेल खाता है।
- source_word: οἱ νεανίσκοι
  choice: वे जवान
  rationale: यह उन्हीं पहले उल्लिखित जवान पुरुषों को सूचित करता है; ‘वे जवान’ हिन्दी में संक्षिप्त और प्रसंगानुकूल है।
- source_word: πρὸς τὸν ἄνδρα αὐτῆς
  choice: उसके पति के पास
  rationale: πρός यहाँ दफ़नाने के स्थान को पति की कब्र के निकट बताता है; ‘के पास’ मूल की स्थान-संबंधी व्यापकता बनाए रखता है और अनावश्यक रूप से ‘बगल में’ जितना विशिष्ट नहीं होता।
