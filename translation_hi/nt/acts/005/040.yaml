source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενοι τοὺς ἀποστόλους δείραντες παρήγγειλαν μὴ λαλεῖν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ καὶ ⸀ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/040.yaml
  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
translation:
  language: hi
  text: तब उन्होंने प्रेरितों को बुलाकर उन्हें पीटा और आदेश दिया कि वे यीशु के नाम से[a] न बोलें, और उन्हें रिहा कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यीशु के नाम के विषय में” अथवा “यीशु के नाम के आधार पर।” यूनानी मुहावरे में यीशु के विषय में और उनके अधिकार के अधीन बोलना—दोनों भाव सम्मिलित हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: बुलाया
  rationale: अओरिस्ट कृदंत मुख्य क्रियाओं से पहले हुई कार्रवाई को दिखाता है। हिन्दी में क्रमबद्ध क्रियाओं के द्वारा ‘बुलाया’ कहना स्वाभाविक है और घटनाक्रम स्पष्ट रखता है।
- source_word: ἀποστόλους
  choice: प्रेरितों
  rationale: प्रेरित नए नियम में इन नियुक्त और भेजे गए साक्षियों के लिए प्रचलित तथा संदर्भानुकूल पद है।
- source_word: δείραντες
  choice: उन्हें पीटा
  rationale: δέρо का अर्थ पीटना या मारना है। ‘पीटा’ क्रिया की व्यापकता बनाए रखता है और किसी विशिष्ट न्यायिक दंड-पद्धति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: παρήγγειλαν
  choice: आदेश दिया
  rationale: παραγγέλλω यहाँ अधिकारपूर्वक निषेध करने का भाव रखता है; ‘आदेश दिया’ आधुनिक हिन्दी में स्पष्ट और पर्याप्त रूप से दृढ़ है।
- source_word: μὴ λαλεῖν
  choice: न बोलें
  rationale: μή सहित अनन्त क्रिया आदेश की निषेधात्मक विषयवस्तु व्यक्त करती है। अप्रत्यक्ष कथन में ‘कि वे ... न बोलें’ स्वाभाविक हिन्दी है।
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: यीशु के नाम से
  rationale: यह परिचित हिन्दी बाइबलीय मुहावरा यीशु के विषय में बोलने, उनके नाम से जुड़े होने और उनके अधिकार के अधीन बोलने जैसे परस्पर जुड़े अर्थों को खुला रखता है।
- source_word: ἀπέλυσαν
  choice: उन्हें छोड़ दिया
  rationale: ἀπολύω यहाँ हिरासत या रोक से मुक्त करने का अर्थ देता है। ‘छोड़ दिया’ सहज आधुनिक हिन्दी में यही कानूनी-संदर्भित कार्रवाई व्यक्त करता है।
theological_decisions:
- issue: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ मुहावरे का अनुवाद
  choice: यीशु के नाम से
  alternative: यीशु के नाम के विषय में; यीशु के नाम के आधार पर
  rationale: यूनानी पदबंध यीशु के विषय में सार्वजनिक गवाही और उनके नाम अथवा अधिकार के आधार पर बोलने—दोनों की ओर संकेत कर सकता है। मुख्य पाठ परिचित मुहावरे द्वारा इस अर्थ-विस्तार को बनाए रखता है, जबकि पादटिप्पणी वास्तविक विकल्प स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे क्रमबद्ध खंड मूल की कार्रवाई का क्रम बनाए रखते हैं; अर्धविराम अंतिम रिहाई को पूर्ववर्ती आदेश से स्पष्ट रूप से अलग करता है।
