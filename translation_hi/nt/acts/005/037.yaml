source:
  edition: SBLGNT
  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: hi
  text: इसके बाद गलील का यहूदा जनगणना[a] के दिनों में उठ खड़ा हुआ और लोगों को अपने पीछे कर लिया[b]। वह भी नष्ट हो गया, और जितने लोग उसके कहने में आते थे, वे सब तितर-बितर हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आधिकारिक पंजीकरण’। यूनानी शब्द जनगणना अथवा आधिकारिक पंजीकरण, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अर्थ यह भी हो सकता है कि उसने लोगों को उनकी पिछली निष्ठा से हटाकर अपना अनुयायी बना लिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: इसके बाद
  rationale: यहाँ μετά के साथ कर्मकारक समयगत क्रम बताता है। यह अनुवाद पिछले व्यक्ति या प्रसंग के बाद की घटना को स्वाभाविक हिंदी में व्यक्त करता है, बिना संदर्भ को अनावश्यक रूप से केवल व्यक्ति तक सीमित किए।
- source_word: ἀνέστη
  choice: उठ खड़ा हुआ
  rationale: इस ऐतिहासिक संदर्भ में क्रिया किसी अगुवे के उभरने या सक्रिय होने को बताती है, पुनरुत्थान को नहीं। ‘उठ खड़ा हुआ’ इसकी सजीवता बनाए रखता है।
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: गलीली यहूदा
  rationale: ὁ Γαλιλαῖος यहूदा की भौगोलिक पहचान बताता है। ‘गलीली यहूदा’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: जनगणना के दिनों में
  rationale: ἀπογραφή सरकारी नामांकन या जनगणना का संकेत दे सकता है। मुख्य पाठ में प्रचलित ‘जनगणना’ रखा गया है और व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: लोगों को खींचकर अपने पीछे कर लिया
  rationale: कारक ἀφίστημι लोगों को उनके पूर्व संबंध या निष्ठा से हटाकर अपनी ओर कर लेने का भाव रख सकता है। यह रूप किसी स्पष्ट ‘विद्रोह’ को जोड़े बिना उस आकर्षण और अलगाव, दोनों की संभावना बनाए रखता है।
- source_word: λαὸν
  choice: लोगों को
  rationale: अनिश्चित, एकवचन सामूहिक λαόν यहाँ लोगों के एक समूह को दर्शाता है; ‘लोगों’ से पूरी जाति का अर्थ अनावश्यक रूप से नहीं निकलता।
- source_word: κἀκεῖνος
  choice: वह भी
  rationale: यह संक्षिप्त रूप ‘और वह भी’ का निरंतरता और समानांतरता वाला बल रखता है।
- source_word: ἀπώλετο
  choice: नाश हो गया
  rationale: ἀπόλλυμι का यह रूप उसके विनाश या मृत्यु को बताता है, पर मृत्यु का तरीका स्पष्ट नहीं करता। ‘नाश हो गया’ उसी व्यापकता को बनाए रखता है।
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: जितने लोग उसकी बात मानते थे, वे सब
  rationale: ἐπείθοντο उन लोगों को दर्शाता है जो उससे सहमत होकर उसकी बात मानते थे या उसके प्रभाव में आए थे। यह पिछले ‘अपने पीछे’ वाले कथन को केवल दोहराता नहीं।
- source_word: διεσκορπίσθησαν
  choice: तितर-बितर हो गए
  rationale: यह क्रिया समूह के बिखर जाने को बताती है। ‘तितर-बितर हो गए’ आधुनिक हिंदी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
theological_decisions:
- issue: यहूदा के आंदोलन का ऐतिहासिक-राजनीतिक स्वरूप
  choice: यहूदा को उभरते हुए अगुवे के रूप में दिखाया गया है जिसने लोगों को अपने पीछे कर लिया; स्पष्ट रूप से ‘विद्रोह’ शब्द नहीं जोड़ा गया।
  alternative: ‘उसने लोगों को विद्रोह के लिए अपने पीछे लगा लिया’ जैसे अधिक स्पष्ट राजनीतिक शब्दों का प्रयोग।
  rationale: ऐतिहासिक रूप से यहूदा विद्रोह से जुड़ा हो सकता है, पर इस वाक्य में विद्रोह के लिए कोई स्पष्ट संज्ञा नहीं है। इसलिए अनुवाद स्रोत से अधिक राजनीतिक विशिष्टता नहीं जोड़ता।
- issue: ἀπώλετο में मृत्यु के ढंग की अनिश्चितता
  choice: ‘नाश हो गया’
  alternative: ‘मारा गया’
  rationale: संदर्भ में उसकी मृत्यु निहित है, किंतु यूनानी क्रिया यह स्पष्ट नहीं करती कि उसे किस प्रकार मारा गया या उसकी मृत्यु कैसे हुई। व्यापक अभिव्यक्ति मूल की अनिश्चितता बचाती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘उठ खड़ा हुआ’, ‘अपनी पीछे कर लिया’ और ‘तितर-बितर’ जैसे प्रचलित पद मूल की सजीवता रखते हैं; धार्मिक या राजनीतिक मूल्यांकन अनावश्यक रूप से नहीं जोड़ा गया है।
