  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। चेतावनी की सम्भावना को ‘कहीं ऐसा न हो’ से तथा यूनानी पुल्लिंग बहुवचन को ‘उन्हें’ से सुरक्षित रखा गया है।
