  yaml_path: translation/nt/acts/005/039.yaml
  text: But if it is from God[a], you will not be able to overthrow them. You may even be found to be fighting against God.” So they were persuaded by him[c][b],
translation:
  language: hi
  text: पर यदि यह परमेश्वर की ओर से है, तो तुम उन्हें नष्ट नहीं कर सकोगे[a][c]। कहीं ऐसा न हो कि तुम परमेश्वर से लड़नेवाले भी पाए जाओ[b]।” तब वे उसकी बात मान गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन्हें मिटा नहीं सकोगे’ अथवा ‘उन्हें गिरा नहीं सकोगे।’
    reason: lexical_alternative
  - marker: b
    text: या ‘तुम परमेश्वर के विरोधी भी पाए जाओ’; मूल शब्द का शाब्दिक अर्थ है ‘परमेश्वर से लड़नेवाले।’
    reason: lexical_alternative
  - marker: c
    text: ‘उन्हें’ से सबसे स्वाभाविक रूप से प्रेरितों का संकेत मिलता है, यद्यपि कुछ लोग इसे अधिक व्यापक रूप में उनके आंदोलन या कार्य से जोड़कर समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: परमेश्वर की ओर से
  rationale: ἐκ यहाँ स्रोत या उत्पत्ति बताता है। ‘परमेश्वर की ओर से’ स्वाभाविक हिन्दी में इसी अर्थ को स्पष्ट रखता है।
- source_word: δυνήσεσθε
  choice: सकोगे
  rationale: भविष्यकालीन सामर्थ्य को हिन्दी की स्वाभाविक क्रिया-रचना में व्यक्त करता है।
- source_word: καταλῦσαι
  choice: गिरा
  rationale: सन्दर्भ में इसका अर्थ व्यक्तियों अथवा उनके कार्य को निष्फल करके समाप्त कर देना है। ‘गिरा नहीं सकोगे’ विरोध द्वारा उन्हें परास्त करने का भाव रखता है, बिना अर्थ को केवल शारीरिक विनाश तक सीमित किए।
- source_word: αὐτούς
  choice: उन्हें
  rationale: यूनानी सर्वनाम पुल्लिंग बहुवचन है और सबसे स्वाभाविक रूप से प्रेरितों की ओर संकेत करता है; इसलिए व्यक्ति-सूचक बहुवचन को बनाए रखा गया है।
- source_word: μήποτε
  choice: कहीं ऐसा न हो कि
  rationale: यह अनचाहे सम्भावित परिणाम के प्रति चेतावनी देता है; यह हिन्दी में उसका स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: θεομάχοι
  choice: परमेश्वर से लड़नेवाले
  rationale: समास का शाब्दिक भाव ‘परमेश्वर से लड़नेवाले’ है। यह सहज हिन्दी में कथन की गम्भीरता बनाए रखता है।
- source_word: εὑρεθῆτε
  choice: पाए जाओ
  rationale: निष्क्रिय क्रिया किसी दशा में प्रमाणित या प्रकट होने का भाव देती है; ‘पाए जाओ’ इस संरचना और अनिश्चित चेतावनी दोनों को सुरक्षित रखता है।
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: तब वे उसकी बात से सहमत हो गए
  rationale: यह बताता है कि परिषद के सदस्य गमलीएल के तर्क से सहमत हुए। ‘तब’ प्रसंग में δέ के परिणामी संक्रमण को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: αὐτούς का संकेत किसकी ओर है
  choice: ‘उन्हें’ से प्रेरितों का संकेत
  alternative: इसे पहले उल्लिखित योजना, काम या व्यापक आन्दोलन का संकेत मानना
  rationale: यूनानी सर्वनाम पुल्लिंग बहुवचन है और निकटतम स्वाभाविक संकेत उन व्यक्तियों की ओर है जो परिषद के सामने थे। पादटिप्पणी व्यापक सन्दर्भ की सम्भावना को खुला रखती है, ताकि कथन को हर धार्मिक आन्दोलन के विषय में निरपेक्ष प्रतिज्ञा न बनाया जाए।
- issue: θεομάχοι की संज्ञात्मक तीव्रता
  choice: ‘परमेश्वर से लड़नेवाले’
  alternative: ‘परमेश्वर के विरोधी’
  rationale: चुना हुआ रूप मूल शब्द में निहित सक्रिय संघर्ष का भाव बचाता है और गमलीएल की चेतावनी की धर्मवैचारिक गम्भीरता कम नहीं करता।
