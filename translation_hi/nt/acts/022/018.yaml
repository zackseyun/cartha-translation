source:
  edition: SBLGNT
  text: καὶ ἰδεῖν αὐτὸν λέγοντά μοι· Σπεῦσον καὶ ἔξελθε ἐν τάχει ἐξ Ἰερουσαλήμ, διότι οὐ παραδέξονταί ⸀σου μαρτυρίαν περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/018.yaml
  text: and I saw him saying to me[a], ‘Hurry and get out of Jerusalem quickly, because they will not accept your testimony about me.’
translation:
  language: hi
  text: और मैंने उसे मुझसे यह कहते देखा, “जल्दी कर और यरूशलेम से तुरंत निकल जा, क्योंकि वे मेरे बारे में तेरी गवाही स्वीकार नहीं करेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεῖν
  choice: मैंने...देखा
  rationale: यद्यपि यूनानी रूप क्रियारूप में infinitive है, यहाँ दर्शन के वृत्तांत को आगे बढ़ाते हुए हिन्दी में पूर्ण क्रिया स्वाभाविक है।
- source_word: αὐτὸν
  choice: उसे
  rationale: सर्वनाम पूर्ववर्ती संदर्भ में दर्शन में दिखाई देने वाले प्रभु की ओर संकेत करता है; मूल की तरह पदवी जोड़ने के बजाय सर्वनाम रखा गया है।
- source_word: λέγοντά μοι
  choice: मुझसे यह कहते
  rationale: कृदन्तीय रचना और प्रत्यक्ष कथन की भूमिका दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: Σπεῦσον
  choice: जल्दी कर
  rationale: आज्ञार्थक रूप की तात्कालिकता को आधुनिक और सहज हिन्दी में व्यक्त करता है।
- source_word: ἔξελθε
  choice: निकल जा
  rationale: शहर के भीतर से बाहर जाने की आज्ञा और उसकी तत्परता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τάχει
  choice: शीघ्र
  rationale: Σπεῦσον के साथ यूनानी में उपस्थित दोहरे तात्कालिक बल को बनाए रखता है, यद्यपि हिन्दी में हल्की पुनरुक्ति उत्पन्न होती है।
- source_word: ἐξ Ἰερουσαλήμ
  choice: यरूशलेम से
  rationale: ἐξ के बाहर की ओर गमन का भाव ‘निकल जा’ के साथ मिलकर स्पष्ट हो जाता है।
- source_word: διότι
  choice: क्योंकि
  rationale: आज्ञा का कारण स्पष्ट रूप से प्रस्तुत करता है।
- source_word: οὐ παραδέξονταί
  choice: स्वीकार नहीं करेंगे
  rationale: यहाँ παραδέχομαι का अर्थ किसी गवाही को ग्रहण या मान्य करना है; ‘स्वीकार करना’ आधुनिक हिन्दी में सबसे स्वाभाविक है।
- source_word: σου μαρτυρίαν
  choice: तेरी गवाही
  rationale: μαρτυρία के साक्ष्यात्मक और घोषणात्मक अर्थ को सुरक्षित रखता है; एकवचन संबोधन के अनुरूप ‘तेरी’ चुना गया है।
- source_word: περὶ ἐμοῦ
  choice: मेरे विषय में
  rationale: संदर्भ या विषय बताने वाले περί के अर्थ को गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दर्शन में ‘उसे’ का संदर्भ
  choice: मुख्य पाठ में मूल के समान सर्वनाम ‘उसे’ रखा गया है।
  alternative: ‘प्रभु को’ या ‘यीशु को’ स्पष्ट रूप से जोड़ना।
  rationale: निकटवर्ती संदर्भ वक्ता की पहचान बताता है, पर इस पद में यूनानी पाठ सर्वनाम ही रखता है; इसलिए अनावश्यक व्याख्यात्मक संज्ञा नहीं जोड़ी गई।
- issue: παραδέξονται में गवाही की प्रतिक्रिया
  choice: ‘स्वीकार नहीं करेंगे’
  alternative: ‘ग्रहण नहीं करेंगे’
  rationale: दोनों अर्थ संभव हैं, पर ‘गवाही स्वीकार करना’ आधुनिक हिन्दी में सहज है और अनुकूल ग्रहण/मान्यता के भाव को समेटता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। प्रत्यक्ष वचन में एकवचन ‘तू’ के आज्ञार्थक रूप (‘जल्दी कर’, ‘निकल जा’) मूल की सीधी व्यक्तिगत संबोधन-शैली को दर्शाते हैं। यूनानी के Σπεῦσον और ἐν τάχει की दोहरी तात्कालिकता ‘जल्दी’ और ‘शीघ्र’ दोनों से बनाए रखी गई है।
