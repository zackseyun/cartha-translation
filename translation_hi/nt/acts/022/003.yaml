source:
  edition: SBLGNT
  text: ⸀Ἐγώ εἰμι ἀνὴρ Ἰουδαῖος, γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας, ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ παρὰ τοὺς πόδας Γαμαλιήλ, πεπαιδευμένος κατὰ ἀκρίβειαν τοῦ πατρῴου νόμου, ζηλωτὴς ὑπάρχων τοῦ θεοῦ καθὼς πάντες ὑμεῖς ἐστε σήμερον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/003.yaml
  text: I am a Jewish man[a], born in Tarsus of Cilicia, but brought up in this city at the feet of Gamaliel, educated according to the strictness of the law of our fathers[b], being zealous for God just as all of you are today.
translation:
  language: hi
  text: “मैं एक यहूदी पुरुष हूँ। मेरा जन्म किलिकिया के तरसुस में हुआ, लेकिन मेरा पालन-पोषण इसी नगर में हुआ। मैंने गमलीएल के चरणों के पास[a] पैतृक व्यवस्था की पूरी कठोरता के अनुसार शिक्षा पाई। मैं परमेश्वर के लिए वैसा ही उत्साही हूँ, जैसे आज आप सब हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “गमलीएल के चरणों के पास”; यह किसी गुरु के अधीन शिक्षा पाने का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀνὴρ Ἰουδαῖος
  choice: एक यहूदी पुरुष
  rationale: ἀνήρ वयस्क पुरुष को और Ἰουδαῖος उसकी यहूदी पहचान को व्यक्त करता है; यह अनुवाद दोनों तत्वों को बनाए रखता है।
- source_word: γεγεννημένος ἐν Ταρσῷ τῆς Κιλικίας
  choice: मेरा जन्म किलिकिया के तरसुस में हुआ
  rationale: हिन्दी में यह जन्मस्थान बताने का स्वाभाविक ढंग है और किलिकिया को तरसुस के भौगोलिक क्षेत्र के रूप में स्पष्ट रखता है।
- source_word: ἀνατεθραμμένος δὲ ἐν τῇ πόλει ταύτῃ
  choice: लेकिन मेरा पालन-पोषण इसी नगर में हुआ
  rationale: ἀνατρέφω यहाँ बड़े किए जाने और आरम्भिक जीवन-निर्माण को दर्शाता है; δέ जन्मस्थान और पालन-पोषण के स्थान का विरोध दिखाता है।
- source_word: παρὰ τοὺς πόδας Γαμαλιήλ
  choice: गमलीएल के चरणों में बैठकर
  rationale: शाब्दिक चित्र को रखते हुए ‘बैठकर’ हिन्दी पाठक के लिए गुरु से शिक्षा पाने के सांस्कृतिक मुहावरे को सहज बनाता है।
- source_word: πεπαιδευμένος κατὰ ἀκρίβειαν
  choice: हर बारीकी के अनुसार शिक्षा पाई
  rationale: πεπαιδευμένος औपचारिक प्रशिक्षण को और ἀκρίβεια सूक्ष्म शुद्धता तथा कठोर अनुपालन को व्यक्त करता है।
- source_word: τοῦ πατρῴου νόμου
  choice: पूर्वजों से मिली व्यवस्था
  rationale: πατρῷος का पैतृक/पूर्वजों से प्राप्त अर्थ स्वाभाविक हिन्दी में व्यक्त होता है, और व्यवस्था की सामुदायिक विरासत बनी रहती है।
- source_word: ζηλωτὴς ὑπάρχων τοῦ θεοῦ
  choice: परमेश्वर के लिए ... उत्साही हूँ
  rationale: ζηλωτής प्रबल धार्मिक उत्साह दर्शाता है; ‘उत्साही’ किसी राजनीतिक दल या तकनीकी पद का अनावश्यक संकेत नहीं देता।
- source_word: καθὼς πάντες ὑμεῖς ἐστε σήμερον
  choice: जैसे आज आप सब हैं
  rationale: यह पौलुस की अपने वर्तमान श्रोताओं से की गई सीधी तुलना और σήμερον का समय-संबंध सुरक्षित रखता है।
theological_decisions:
- issue: πατρῴου νόμου में यहूदी पैतृक विरासत और वक्ता की श्रोताओं से एकता
  choice: पूर्वजों से मिली व्यवस्था
  alternative: पैतृक व्यवस्था
  rationale: चुना गया रूप विरासत के अर्थ को स्पष्ट करता है, पर यूनानी में निहित न होने वाला स्पष्ट ‘हमारे’ जोड़ने से बचता है; संदर्भ में साझा यहूदी विरासत फिर भी स्वाभाविक रूप से समझ आती है।
- issue: παρὰ τοὺς πόδας Γαμαλιήλ के शिक्षक-शिष्य मुहावरे को रखना
  choice: गमलीएल के चरणों में बैठकर
  alternative: गमलीएल से शिक्षा पाकर
  rationale: मूल का सजीव ऐतिहासिक-सांस्कृतिक चित्र रखा गया है और फुटनोट उसके आशय को स्पष्ट करता है।
- issue: ζηλωτής को तकनीकी राजनीतिक अर्थ से बचाना
  choice: परमेश्वर के लिए ... उत्साही
  alternative: परमेश्वर का कट्टर समर्थक
  rationale: ‘उत्साही’ मूल के धार्मिक जोश को व्यक्त करता है, बिना ‘ज़ीलोती’ आंदोलन या नकारात्मक कट्टरता को अनावश्यक रूप से आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज भाषण-रूप अपनाया गया है। ‘व्यवस्था’ बाइबिलीय संदर्भ में νόμος के लिए परिचित शब्द है। छोटे वाक्यों से मौखिक संबोधन स्पष्ट रहता है, जबकि मूल की जन्म, पालन-पोषण, शिक्षा और उत्साह की क्रमिक संरचना सुरक्षित है।
