id: ACT.22.15
reference: Acts 22:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι ἔσῃ μάρτυς αὐτῷ πρὸς πάντας ἀνθρώπους ὧν ἑώρακας καὶ ἤκουσας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/015.yaml
  text: For you will be a witness for him to all people of what you have seen and heard[a][b].
translation:
  language: hi
  text: क्योंकि तुम उसके लिए सब लोगों के सामने उन बातों के गवाह होगे जिन्हें तुमने देखा और सुना है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसको।” यूनानी सम्प्रदान कारक का अर्थ यहाँ “उसके लिए” अथवा “उसको” समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में “क्योंकि” इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔσῃ
  choice: होगे
  rationale: εἰμί के भविष्यकाल को सरल और स्वाभाविक हिन्दी भविष्यकाल में व्यक्त किया गया है।
- source_word: μάρτυς
  choice: गवाह
  rationale: यह शब्द उस व्यक्ति को दर्शाता है जो अपने देखे-सुने का प्रमाण देता है; “गवाह” सामान्य आधुनिक हिन्दी में सटीक और सहज है।
- source_word: αὐτῷ
  choice: उसके लिए
  rationale: सम्प्रदान कारक यहाँ उस व्यक्ति को सूचित कर सकता है जिसके पक्ष में या जिसके विषय में गवाही दी जाएगी। “उसके लिए” मुख्य संदर्भगत अर्थ रखता है, जबकि निकटवर्ती विकल्प पादटिप्पणी में दिया गया है।
- source_word: πρὸς πάντας ἀνθρώπους
  choice: सब लोगों के सामने
  rationale: πρός श्रोताओं की ओर निर्देशित गवाही का भाव देता है। “सब लोगों” से ἀνθρώπους का सामान्य, समावेशी अर्थ स्पष्ट होता है; “के सामने” सार्वजनिक साक्ष्य के प्रसंग में स्वाभाविक हिन्दी है।
- source_word: ὧν
  choice: उन बातों के
  rationale: सम्बन्धवाचक सर्वनाम गवाही की विषय-वस्तु—देखी और सुनी हुई बातों—से जुड़ा है; हिन्दी वाक्य-विन्यास में “उन बातों के” इसे स्पष्ट करता है।
- source_word: ἑώρακας
  choice: तुमने देखा
  rationale: यूनानी पूर्णकाल पिछले अनुभव की वर्तमान प्रासंगिकता रखता है; हिन्दी में संदर्भ सहित साधारण पूर्ण भूत रूप इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καὶ ἤκουσας
  choice: और सुना है
  rationale: यूनानी अओरिस्ट को पूर्ववर्ती देखने के अनुभव के साथ जोड़ा गया है; वाक्यांत का “है” दोनों अनुभवों को वर्तमान गवाही का आधार बताता है।
theological_decisions:
- issue: पौलुस की नियुक्ति में αὐτῷ का संबंध
  choice: “उसके लिए”—अर्थात प्रभु/यीशु के पक्ष में या उसके विषय में गवाही
  alternative: “उसको”—सम्प्रदान का अधिक प्रत्यक्ष रूप, जो ‘उसके प्रति गवाह’ का भाव दे सकता है
  rationale: निकटवर्ती प्रसंग में सर्वनाम प्रभु/यीशु की ओर संकेत करता है। मुख्य पाठ प्रतिनिधिक गवाही का स्वाभाविक अर्थ देता है, पर यूनानी सम्प्रदान की निकटवर्ती वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। “मनुष्यों” के बजाय “लोगों” का प्रयोग ἀνθρώπους के सामान्य, स्त्री-पुरुष समावेशी अर्थ को सहज रूप से व्यक्त करता है; इसलिए इस बिंदु पर अलग पादटिप्पणी आवश्यक नहीं मानी गई।
