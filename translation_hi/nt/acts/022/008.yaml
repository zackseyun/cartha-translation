id: ACT.22.8
reference: Acts 22:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπεκρίθην· Τίς εἶ, κύριε; εἶπέν τε πρὸς ⸀ἐμέ· Ἐγώ εἰμι Ἰησοῦς ὁ Ναζωραῖος ὃν σὺ διώκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/008.yaml
  text: And I answered[a], ‘Who are you, Lord?’ And he said to me, ‘I am Jesus the Nazarene[b], whom you are persecuting.’
translation:
  language: hi
  text: तब मैंने उत्तर दिया, ‘प्रभु[a], आप कौन हैं?’ उन्होंने मुझसे कहा, ‘मैं यीशु नासरी[b] हूँ, जिसे तुम सताते हो।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महोदय।” यूनानी κύριε आदरसूचक संबोधन भी हो सकता है और “प्रभु” की उपाधि भी।
    reason: alternative_reading
  - marker: b
    text: या “नासरत का यीशु”; अथवा “नाज़ोरी यीशु।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθην
  choice: मैंने उत्तर दिया
  rationale: ἀποκρίνομαι के इस रूप का सीधा और स्वाभाविक हिन्दी समतुल्य ‘उत्तर दिया’ है।
- source_word: Τίς εἶ
  choice: आप कौन हैं?
  rationale: प्रत्यक्ष प्रश्न को आधुनिक, आदरपूर्ण हिन्दी में स्वाभाविक शब्दक्रम के साथ व्यक्त किया गया है।
- source_word: κύριε
  choice: प्रभु
  rationale: κύριος का प्रचलित बाइबिलीय समतुल्य ‘प्रभु’ रखा गया है; यहाँ आदरसूचक ‘महोदय’ भी संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: εἶπέν τε πρὸς ἐμέ
  choice: उन्होंने मुझसे कहा
  rationale: λέγω πρός का स्वाभाविक हिन्दी रूप ‘से कहा’ है; τε की संयोजकता वाक्य-प्रवाह में व्यक्त है।
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: मैं यीशु ... हूँ
  rationale: आत्म-पहचान को बिना विस्तार के सीधे रखा गया है।
- source_word: ὁ Ναζωραῖος
  choice: नासरी
  rationale: यह विशेषण-संज्ञा हिन्दी में यीशु के लिए प्रचलित और संक्षिप्त है तथा यूनानी उपाधि का रूप बनाए रखती है।
- source_word: ὃν σὺ διώκεις
  choice: जिसे तुम सताते हो
  rationale: διώκω यहाँ शत्रुतापूर्ण उत्पीड़न दर्शाता है; ‘सताते हो’ वर्तमान और जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: शाऊल के संबोधन में κύριε का अर्थ
  choice: प्रभु
  alternative: महोदय
  rationale: वर्णनात्मक संदर्भ में वक्ता की पहचान यीशु के रूप में होती है, इसलिए मुख्य पाठ में ‘प्रभु’ उचित है; फिर भी शाऊल की उस समय की समझ अस्पष्ट हो सकती है, अतः केवल आदरसूचक अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यीशु के प्रति ‘आप’ और उनके लिए आदरसूचक बहुवचन क्रिया प्रयुक्त हुई है; उत्तर में शाऊल के लिए मूल का एकवचन ‘तुम’ सुरक्षित है।
