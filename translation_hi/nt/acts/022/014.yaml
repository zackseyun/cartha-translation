source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ θεὸς τῶν πατέρων ἡμῶν προεχειρίσατό σε γνῶναι τὸ θέλημα αὐτοῦ καὶ ἰδεῖν τὸν δίκαιον καὶ ἀκοῦσαι φωνὴν ἐκ τοῦ στόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/014.yaml
  text: And he said[a], ‘The God of our fathers has appointed you to know his will, to see the Righteous One[b], and to hear a voice from his mouth,’
translation:
  language: hi
  text: तब उसने कहा, “हमारे पूर्वजों के परमेश्वर ने तुम्हें नियुक्त किया है[a], ताकि तुम उसकी इच्छा जानो, उस धर्मी जन को देखो[b], और उसके मुँह से निकली वाणी सुनो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हें चुना है।” यूनानी क्रिया किसी काम के लिए चुनने या नियुक्त करने—दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “धर्मी जन” यीशु के लिए एक उपाधि है; इसका अनुवाद “न्यायी जन” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: προεχειρίσατό
  choice: इस काम के लिए चुना है
  rationale: क्रिया किसी उद्देश्य या दायित्व के लिए चुनने अथवा नियुक्त करने का भाव देती है। आगे आने वाले तीन infinitives से प्रयोजन स्पष्ट है; इसलिए ‘इस काम के लिए’ स्वाभाविक हिन्दी में उस प्रयोजन-भाव को व्यक्त करता है, जबकि पादटिप्पणी ‘नियुक्त’ विकल्प सुरक्षित रखती है।
- source_word: γνῶναι
  choice: जानो
  rationale: यहाँ प्रयोजनसूचक infinitive परमेश्वर की इच्छा को जानने का भाव देता है; ‘जानो’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: θέλημα
  choice: इच्छा
  rationale: ‘इच्छा’ θέλημα की व्यापक अर्थ-सीमा को बनाए रखती है और ‘योजना’ जैसे अधिक व्याख्यात्मक शब्द से बचती है।
- source_word: ἰδεῖν
  choice: देखो
  rationale: साधारण प्रत्यक्ष दर्शन का स्पष्ट अर्थ; ‘दर्शन करो’ स्रोत से अधिक धार्मिक रंग जोड़ सकता है।
- source_word: τὸν δίκαιον
  choice: उस धर्मी जन को
  rationale: δίκαιος का नैतिक अर्थ और निश्चित, उपाधिसूचक प्रयोग दोनों सुरक्षित रहते हैं। हिन्दी में ‘धर्मी जन’ स्वाभाविक और गरिमापूर्ण है; पादटिप्पणी यीशु के लिए उपाधि होने की बात स्पष्ट करती है।
- source_word: ἀκοῦσαι φωνὴν
  choice: वाणी सुनो
  rationale: φωνή के लिए ‘वाणी’ मुख से निकले स्पष्ट कथन के अनुकूल है। हिन्दी में ‘एक आवाज़ उसके मुँह से सुनो’ अस्वाभाविक होता; अनिश्चित article को अलग शब्द से व्यक्त न करना यहाँ हिन्दी की सामान्य रीति है।
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: उसके मुँह से निकलने वाली
  rationale: ग्रीक की ठोस अभिव्यक्ति ‘उसके मुँह से’ सुरक्षित है। ‘निकलने वाली’ हिन्दी वाक्य-विन्यास में संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: Ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: हमारे पूर्वजों के परमेश्वर
  rationale: πατέρων का संदर्भ इस्राएल की पिछली पीढ़ियों और वाचा की विरासत से है। आधुनिक हिन्दी में ‘पूर्वजों’ इस सामूहिक ऐतिहासिक अर्थ को स्वाभाविक रूप से व्यक्त करता है; ‘हमारे पितरों’ अधिक संस्कृतनिष्ठ और संभावित रूप से संस्कार-संबंधी अर्थ वाला हो सकता है।
theological_decisions:
- issue: τὸν δίκαιον को मसीही उपाधि मानना या केवल वर्णनात्मक विशेषण
  choice: ‘उस धर्मी जन’ को यीशु के लिए प्रयुक्त उपाधिसूचक अभिव्यक्ति के रूप में रखा गया है।
  alternative: ‘उस न्यायी जन’ या केवल वर्णनात्मक ‘एक धर्मी व्यक्ति’
  rationale: प्रेरितों के काम में समान अभिव्यक्ति यीशु के लिए पहचानी जाने वाली उपाधि है (3:14; 7:52)। फिर भी मुख्य पाठ में नाम ‘यीशु’ जोड़कर निहित संदर्भ को स्पष्ट कथन में नहीं बदला गया।
- issue: πατέρων का हिन्दी रूप
  choice: ‘पूर्वजों’
  alternative: ‘पितरों’ या ‘बाप-दादों’
  rationale: ‘पूर्वजों’ इस्राएल की वाचागत विरासत को समाविष्ट करते हुए आधुनिक, गरिमापूर्ण और सहज है। यह स्रोत के पुरुषवाची रूप को हिन्दी में अनावश्यक रूप से किसी केवल निकट पुरुष-पीढ़ी तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘तब उसने कहा’ δὲ के प्रसंगगत संक्रमण को व्यक्त करता है। समानांतर प्रयोजन-रचना ‘कि तुम… जानो, … देखो, और … सुनो’ बनाए रखी गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
