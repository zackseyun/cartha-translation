source:
  edition: SBLGNT
  text: καὶ νῦν τί μέλλεις; ἀναστὰς βάπτισαι καὶ ἀπόλουσαι τὰς ἁμαρτίας σου ἐπικαλεσάμενος τὸ ὄνομα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/016.yaml
  text: And now why are you waiting? Rise[a], be baptized, and wash away your sins[b], calling on his name.
translation:
  language: hi
  text: तो अब तुम देर क्यों कर रहे हो? उठो, बपतिस्मा लो और उसका नाम पुकारते हुए[a] अपने पापों को धो डालो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसका नाम पुकारते हुए’ का अर्थ ‘उसका नाम पुकारकर’ भी समझा जा सकता है। यूनानी वाक्य यह खुला छोड़ता है कि यह कृदन्त मुख्य आदेशों के साथ संबद्ध परिस्थिति बताता है या साधन।
    reason: alternative_reading
lexical_decisions:
- source_word: τί μέλλεις
  choice: तुम देर क्यों कर रहे हो?
  rationale: यह प्रश्न यहाँ भावी इरादे के विषय में नहीं, बल्कि देर न करने की तत्परता भरी प्रेरणा है। यह हिन्दी में स्वाभाविक रूप से उसी बल को व्यक्त करता है।
- source_word: ἀναστὰς
  choice: उठो
  rationale: अओरिस्ट कृदन्त आगे के आदेशों के साथ सहगामी क्रिया बताता है; हिन्दी में स्वतंत्र आदेश इसका संक्षिप्त और तात्कालिक स्वर बनाए रखता है।
- source_word: βάπτισαι
  choice: बपतिस्मा लो
  rationale: मध्यवाच्य आदेश का स्वाभाविक हिन्दी रूप है और व्यक्ति को बपतिस्मा ग्रहण करने के लिए कहता है, बिना अनावश्यक व्याख्या जोड़े।
- source_word: ἀπόλουσαι τὰς ἁμαρτίας σου
  choice: अपने पापों को धो डालो
  rationale: यह क्रिया पापों को धोकर दूर करने का चित्र प्रस्तुत करती है; ‘धो डालो’ उस परिणामसूचक बल को सरल और सीधा रखता है।
- source_word: ἐπικαλεσάμενος
  choice: पुकारते हुए
  rationale: यह रूप कृदन्त को खुला रखता है और उसे केवल साधन (‘पुकारने के द्वारा’) या केवल समय (‘पुकारने पर’) के अर्थ में सीमित नहीं करता।
- source_word: τὸ ὄνομα αὐτοῦ
  choice: उसका नाम
  rationale: यूनानी पाठ में स्पष्ट उपाधि के स्थान पर सर्वनाम है; इसलिए अनुवाद भी सर्वनाम रखता है और संदर्भगत व्यक्ति को अनावश्यक रूप से स्पष्ट नहीं करता।
theological_decisions:
- issue: बपतिस्मा, पापों के धुलने और उसका नाम पुकारने का परस्पर संबंध
  choice: यूनानी क्रम और कृदन्तीय संबंध को इस प्रकार रखा गया है कि सटीक साधनात्मक या संस्कार-संबंधी अर्थ निश्चित न हो।
  alternative: ‘उसका नाम पुकारकर अपने पाप धुलवा लो’ कहना, या बपतिस्मा को स्पष्टतः पाप धुलने का साधन बताना।
  rationale: मूल में दो आदेश और एक कृदन्त हैं। व्याकरण उनके संबंध की व्याख्या की गुंजाइश देता है, इसलिए अनुवाद विवादित धर्मवैज्ञानिक संबंध को निर्णायक रूप से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और तात्कालिक आदेशात्मक शैली। ‘बपतिस्मा’ प्रचलित बाइबलीय शब्द है।
