  text: ἀκούσας δὲ ὁ ἑκατοντάρχης προσελθὼν ⸂τῷ χιλιάρχῳ ἀπήγγειλεν⸃ λέγων· ⸀Τί μέλλεις ποιεῖν; ὁ γὰρ ἄνθρωπος οὗτος Ῥωμαῖός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/026.yaml
  text: When the centurion heard this[a], he went to the commander and reported it, saying[b], “What are you about to do? For this man is a Roman citizen.”
translation:
  language: hi
  text: जब सूबेदार ने यह सुना, तो उसने सेनापति के पास जाकर उसे सूचना दी, “आप क्या करने वाले हैं?[a] क्योंकि यह आदमी रोमी नागरिक है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आप क्या करने जा रहे हैं?” यूनानी अभिव्यक्ति निकट भविष्य में होने वाले काम या किसी के अभिप्राय—दोनों की ओर संकेत कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “यह आदमी रोमी है।” इस प्रसंग में इसका अर्थ है कि उसके पास रोमी नागरिकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: जब ... ने यह सुना
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले की परिस्थिति बताता है; यह हिंदी में स्वाभाविक रूप से कालगत संबंध व्यक्त करता है।
- source_word: ἑκατοντάρχης
  choice: सूबेदार
  rationale: रोमी सैन्य पद ἑκατοντάρχης के लिए प्रचलित और सामान्य पाठकों को समझ आने वाला हिंदी पद; केवल सामान्य ‘अधिकारी’ से अधिक सटीक।
- source_word: προσελθὼν
  choice: के पास जाकर
  rationale: यह कृदंत वरिष्ठ अधिकारी की ओर जाने को दर्शाता है और हिंदी कथा-प्रवाह में सहज है।
- source_word: χιλιάρχῳ
  choice: सेनापति
  rationale: χιλίαρχος यहाँ उच्च रोमी सैन्य अधिकारी को सूचित करता है; ‘सेनापति’ आधुनिक हिंदी में स्पष्ट है और अत्यधिक तकनीकी लिप्यंतरण से बचता है।
- source_word: ἀπήγγειλεν
  choice: उसे सूचना दी
  rationale: क्रिया किसी बात की आधिकारिक जानकारी पहुँचाने को व्यक्त करती है; सैन्य और कानूनी प्रसंग में यह स्वाभाविक है।
- source_word: λέγων
  choice: प्रत्यक्ष कथन द्वारा व्यक्त
  rationale: हिंदी में अलग से ‘कहते हुए’ जोड़ने के बजाय सूचना देने की क्रिया के बाद सीधा उद्धरण अधिक सहज है और वही संबंध बनाए रखता है।
- source_word: Τί μέλλεις ποιεῖν;
  choice: आप क्या करने वाले हैं?
  rationale: μέλλω + infinitive निकट भविष्य या अभिप्रेत कार्य—दोनों का बोध करा सकता है; हिंदी अभिव्यक्ति इस सीमा तक दोनों संभावनाएँ खुली रखती है।
- source_word: ὁ γὰρ ἄνθρωπος οὗτος
  choice: यह आदमी तो
  rationale: ἄνθρωπος इस प्रसंग में एक पुरुष को दर्शाता है; ‘तो’ γάρ के स्पष्टीकरणात्मक/चेतावनीपूर्ण बल को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: Ῥωμαῖός ἐστιν
  choice: रोमी नागरिक है
  rationale: कानूनी प्रसंग में Ῥωμαῖος का आशय रोमी नागरिकता रखने वाले व्यक्ति से है, न केवल जातीय या भौगोलिक पहचान से।
