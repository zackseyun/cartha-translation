  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। रोमी पद के लिए अत्यधिक तकनीकी ‘ट्रिब्यून’ या पारंपरिक किन्तु कम सहज ‘सहस्रपति’ के बजाय ‘सैन्य अधिकारी’ चुना गया है। मुख्य पाठ में यातना और पूछताछ का संबंध स्पष्ट है, जबकि यूनानी अभिव्यक्ति की वैकल्पिक संरचना पादटिप्पणी में सुरक्षित रखी गई है।
