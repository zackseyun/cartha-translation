  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐκέλευσεν ⸂ὁ χιλίαρχος εἰσάγεσθαι αὐτὸν⸃ εἰς τὴν παρεμβολήν, ⸀εἴπας μάστιξιν ἀνετάζεσθαι αὐτὸν ἵνα ἐπιγνῷ δι’ ἣν αἰτίαν οὕτως ἐπεφώνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/024.yaml
  text: The tribune ordered him to be brought into the barracks[a], saying that he should be examined by scourging[b], so that he might find out for what reason they were shouting against him like this.
translation:
  language: hi
  text: सैन्य अधिकारी ने आदेश दिया कि उसे छावनी[a] के भीतर ले जाया जाए और कोड़े लगाकर उससे पूछताछ[b] की जाए, ताकि वह जान सके कि लोग किस कारण उसके विरुद्ध इस तरह चिल्ला रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सैनिक बैरक” अथवा “किला।” यहाँ यह शब्द यरूशलेम में रोमी सैनिकों के परिसर को दर्शाता है।
    reason: cultural_note
  - marker: b
    text: या “कोड़े लगाकर उसकी जाँच की जाए।” यूनानी में जाँच या पूछताछ की भाषा के साथ कोड़े लगाने का साधन भी स्पष्ट रूप से बताया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: सैन्य अधिकारी
  rationale: यह पद रोमी सेना के एक उच्च अधिकारी को दर्शाता है। ‘सैन्य अधिकारी’ आधुनिक हिन्दी में सहज और स्पष्ट है तथा पद की ठीक संख्या या श्रेणी के बारे में अनावश्यक दावा नहीं करता।
- source_word: παρεμβολή
  choice: छावनी
  rationale: यरूशलेम के इस प्रसंग में शब्द रोमी सैनिक परिसर या बैरक को दर्शाता है। ‘छावनी’ गंतव्य के सैन्य स्वरूप को स्वाभाविक हिन्दी में व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: εἰσάγεσθαι
  choice: भीतर ले जाया जाए
  rationale: कर्मवाच्य क्रिया बताती है कि दूसरे लोग पौलुस को सैन्य परिसर के अंदर ले जाने वाले थे।
- source_word: εἴπας
  choice: और … की जाए
  rationale: कृदन्त अधिकारी के आदेश की अगली विषयवस्तु प्रस्तुत करता है। हिन्दी में संयुक्त आदेश के रूप में इसे रखना अधिक स्वाभाविक है और वाक्य का प्रवाह बनाए रखता है।
- source_word: μάστιξιν
  choice: कोड़े लगाकर
  rationale: बहुवचन करण कारक पूछताछ का साधन बताता है। यह सामान्य मारपीट नहीं, बल्कि कोड़ों से दी जाने वाली कठोर शारीरिक यातना है।
- source_word: ἀνετάζεσθαι
  choice: पूछताछ की जाए
  rationale: क्रिया जाँच या पूछताछ को दर्शाती है; साथ का ‘कोड़े लगाकर’ उसके क्रूर साधन को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ἐπιγνῷ
  choice: वह जान सके
  rationale: प्रयोजनवाचक उपवाक्य अधिकारी के तथ्य का पता लगाने के उद्देश्य को व्यक्त करता है। ‘जान सके’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: δι’ ἣν αἰτίαν
  choice: किस कारण
  rationale: यूनानी वाक्यांश कारण पूछता है। यह अनुवाद ऐसा कोई औपचारिक कानूनी आरोप नहीं जोड़ता जो मूल में स्पष्ट नहीं है।
- source_word: οὕτως
  choice: इस तरह
  rationale: यह भीड़ के चिल्लाने के ढंग या तीव्रता की ओर संकेत करता है और अपने संकेतवाचक बल को बनाए रखता है।
- source_word: ἐπεφώνουν αὐτῷ
  choice: उसके विरुद्ध … चिल्ला रहे थे
  rationale: अपूर्ण भूतकाल लगातार चल रहे शोर को दर्शाता है, और ‘विरुद्ध’ उस पुकार की शत्रुतापूर्ण दिशा को स्पष्ट करता है।
