reference: Acts 22:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον βουλόμενος γνῶναι τὸ ἀσφαλὲς τὸ τί κατηγορεῖται ⸀ὑπὸ τῶν Ἰουδαίων ἔλυσεν ⸀αὐτόν, καὶ ἐκέλευσεν ⸀συνελθεῖν τοὺς ἀρχιερεῖς καὶ ⸀πᾶν τὸ ⸀συνέδριον, καὶ καταγαγὼν τὸν Παῦλον ἔστησεν εἰς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/030.yaml
  text: But on the next day[a], wanting to know for certain what he was being accused of by the Jews, he released him and ordered the chief priests and the whole council to assemble; and bringing Paul down[b], he set him before them.
translation:
  language: hi
  text: पर अगले दिन, यह निश्चित रूप से जानना चाहते हुए कि यहूदी[a] पौलुस पर क्या आरोप लगा रहे थे, सेनापति ने उसके बंधन खोल दिए और प्रधान याजकों तथा पूरी महासभा[b] को इकट्ठा होने की आज्ञा दी; फिर पौलुस को नीचे लाकर उनके सामने खड़ा कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदी अगुवे” अथवा “यहूदिया के निवासी।” यूनानी पाठ में “यहूदी” है; इस प्रसंग में इसका संकेत पौलुस पर आरोप लगाने वालों की ओर है, न कि बिना किसी भेद के हर यहूदी व्यक्ति की ओर।
    reason: lexical_alternative
  - marker: b
    text: “महासभा” से आशय यरूशलेम की यहूदी शासकीय परिषद, अर्थात् सनहेद्रिन, से है।
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: पर अगले दिन
  rationale: कालवाचक पदबंध का अर्थ ‘अगले दिन’ है; δέ कथा में हल्का मोड़ दिखाता है, जिसे ‘पर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: βουλόμενος γνῶναι τὸ ἀσφαλές
  choice: निश्चित रूप से जानना चाहता था
  rationale: यह वाक्यांश सेनापति की इच्छा और विश्वसनीय तथ्य जानने के उद्देश्य—दोनों को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸ τί κατηγορεῖται ὑπὸ τῶν Ἰουδαίων
  choice: कि यहूदी पौलुस पर क्या आरोप लगा रहे हैं
  rationale: यूनानी कर्मवाच्य को स्वाभाविक हिन्दी कर्तृवाच्य में बदला गया है, पर आरोप लगाने वाले और आरोप के विषय का संबंध यथावत है। पौलुस का नाम सर्वनाम की अपेक्षा हिन्दी में अधिक स्पष्ट है।
- source_word: ἔλυσεν αὐτόν
  choice: उसने पौलुस के बंधन खोल दिए
  rationale: λύω का मूल अर्थ खोलना या बंधनमुक्त करना है। प्रसंग में पौलुस रोमी हिरासत में था; ‘बंधन खोल दिए’ उसे पूर्णतः रिहा कर देने की अपेक्षा मूल क्रिया की ठोस और प्रसंगानुकूल छवि बचाता है।
- source_word: ἐκέλευσεν συνελθεῖν
  choice: इकट्ठा होने की आज्ञा दी
  rationale: केλεύω के आधिकारिक आदेश और συνελθεῖν के एकत्र होने के भाव को गरिमापूर्ण, सहज हिन्दी में रखा गया है।
- source_word: τοὺς ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: बहुवचन पद उन प्रमुख याजकीय अधिकारियों को सूचित करता है; ‘प्रधान याजक’ हिन्दी बाइबिलीय प्रयोग में परिचित और सटीक है।
- source_word: πᾶν τὸ συνέδριον
  choice: पूरी महासभा
  rationale: συνέδριον यरूशलेम की यहूदी शासकीय परिषद को दर्शाता है। ‘महासभा’ पठनीय हिन्दी अनुवाद है और ‘पूरी’ πᾶν को व्यक्त करता है।
- source_word: καταγαγὼν τὸν Παῦλον
  choice: पौलुस को नीचे लाकर
  rationale: स्थानगत गति ‘नीचे’ को बनाए रखा गया है; सम्भवतः उसे किले या छावनी से सभा के स्थान पर लाया गया था।
- source_word: ἔστησεν εἰς αὐτούς
  choice: उनके सामने खड़ा कर दिया
  rationale: यह पद पौलुस को सभा के समक्ष आधिकारिक रूप से प्रस्तुत किए जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रेरितों के काम में Ἰουδαίων का अनुवाद
  choice: यहूदी
  alternative: यहूदी अगुवे; यहूदिया के लोग
  rationale: मूल यूनानी पद का सीधा अर्थ ‘यहूदी’ है। मुख्य पाठ में इसे बनाए रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि इस प्रसंग में संकेत पौलुस के आरोप लगाने वाले विशिष्ट लोगों की ओर है, न कि बिना भेद सभी यहूदियों की ओर।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। लंबे यूनानी वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है। ‘सेनापति’ को स्पष्ट कर्ता के रूप में जोड़ा गया है, क्योंकि पूर्ववर्ती प्रसंग में वही अभिप्रेत अधिकारी है; पौलुस का नाम भी सर्वनाम-संदेह से बचने के लिए दोहराया गया है।
