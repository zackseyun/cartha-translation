    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτην τὴν ὁδὸν
  choice: इस ‘मार्ग’ के लोगों को
  rationale: ὁδός का मूल अर्थ ‘मार्ग’ है, और प्रेरितों के काम में यह मसीही विश्वास और उससे जुड़े समुदाय का प्रचलित नाम बन जाता है। हिंदी में ‘मार्ग को सताया’ अस्वाभाविक है, इसलिए निहित मानवीय कर्म-विषय को ‘के लोगों’ से स्पष्ट किया गया है, जबकि ‘मार्ग’ की नाम-सदृश पहचान सुरक्षित रखी गई है।
- source_word: ἐδίωξα
  choice: मैंने … सताया
  rationale: संदर्भ में क्रिया का अर्थ शत्रुतापूर्वक पीछा करना और उत्पीड़न करना है; ‘सताया’ सामान्य आधुनिक हिंदी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἄχρι θανάτου
  choice: मृत्यु की हद तक
  rationale: यह वाक्यांश उत्पीड़न की घातक चरम सीमा बताता है, पर अपने आप यह नहीं कहता कि पौलुस ने प्रत्येक व्यक्ति को स्वयं मार डाला।
- source_word: δεσμεύων
  choice: बाँधकर
  rationale: यह चुनाव बाँधने की ठोस छवि को बनाए रखता है और केवल सामान्य ‘गिरफ़्तार करके’ कहने से अधिक निकटता से यूनानी शब्द का रूप प्रस्तुत करता है।
- source_word: παραδιδοὺς εἰς φυλακὰς
  choice: जेलों में डालता रहा
  rationale: इस प्रसंग में παραδίδωμι किसी को हिरासत के लिए सौंपने का भाव रखता है। हिंदी में ‘जेलों में डालता रहा’ उस परिणाम और जारी गतिविधि को सहज ढंग से व्यक्त करता है; बहुवचन φυλακάς भी ‘जेलों’ में सुरक्षित है।
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: पुरुषों तथा स्त्रियों—दोनों को
  rationale: ‘दोनों’ यूनानी रचना के इस बल को बनाए रखता है कि उत्पीड़न पुरुषों और स्त्रियों, दोनों तक फैला था।
theological_decisions:
- issue: क्या ἡ ὁδός को सामान्य संज्ञा माना जाए या मसीही आंदोलन के नाम-सदृश पद के रूप में प्रस्तुत किया जाए
  choice: नाम-सदृश ‘मार्ग’
  alternative: रास्ता; पंथ; आंदोलन
  rationale: प्रेरितों के काम में ἡ ὁδός बार-बार मसीही विश्वास और समुदाय की पहचान के रूप में आता है। उद्धरण-चिह्न इस विशेष प्रयोग का संकेत देते हैं, पर बाद की कोई साम्प्रदायिक संज्ञा आरोपित नहीं करते।
- issue: क्या ἄχρι θανάτου का अर्थ यह घोषित करना है कि पौलुस ने स्वयं लोगों की हत्या की
  choice: उत्पीड़न की मृत्यु तक पहुँचने वाली चरम सीमा को व्यक्त करना
  alternative: मैंने उन्हें मरवा डाला
  rationale: यूनानी वाक्यांश घातक सीमा या परिणाम की अनुमति देता है, पर कर्ता द्वारा प्रत्यक्ष हत्या की रीति को स्पष्ट नहीं करता; इसलिए उस तनाव को खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मार्ग’ को विशेष नाम जैसा दिखाने के लिए उद्धरण-चिह्न लगाए गए हैं। ‘के लोगों’ हिंदी की स्वाभाविकता के लिए निहित कर्म को स्पष्ट करता है; ‘डालता रहा’ कृदंतों द्वारा व्यक्त जारी उत्पीड़नात्मक गतिविधि को दर्शाता है।
