base_translation:
  language: en
  yaml_path: translation/nt/acts/022/007.yaml
  text: I fell to the ground and heard a voice saying to me, ‘Saul, Saul, why are you persecuting me?’
translation:
  language: hi
  text: मैं भूमि पर गिर पड़ा और मैंने एक आवाज़ सुनी, जो मुझसे कहती हुई थी, “शाऊल, शाऊल, तुम मुझे क्यों सता रहे हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσά
  choice: मैं ... गिर पड़ा
  rationale: πίπτω के प्रथम पुरुष एकवचन एओरिस्ट को स्वाभाविक हिन्दी में पूर्ण हुई घटना के रूप में व्यक्त किया गया है।
- source_word: τε
  choice: अलग से अनूदित नहीं
  rationale: यह पूर्ववर्ती कथन से संबंध जोड़ता है; हिन्दी में वाक्य-प्रवाह और आगे का ‘और’ इसका कार्य पर्याप्त रूप से व्यक्त करते हैं।
- source_word: εἰς τὸ ἔδαφος
  choice: भूमि पर
  rationale: गिरने के गंतव्य के लिए यह स्पष्ट, स्वाभाविक और मूल अर्थ के निकट हिन्दी अभिव्यक्ति है।
- source_word: ἤκουσα
  choice: मैंने ... सुनी
  rationale: ἀκούω के प्रथम पुरुष एकवचन एओरिस्ट को सामान्य भूतकाल में रखा गया है; ‘आवाज़’ के अनुसार स्त्रीलिंग क्रिया-रूप प्रयुक्त है।
- source_word: φωνῆς
  choice: एक आवाज़
  rationale: ἀκούω के साथ आए संबंधकारक का प्रसंगानुकूल अर्थ बोलती हुई आवाज़ है, इसलिए हिन्दी में इसे सीधे कर्म के रूप में व्यक्त किया गया है।
- source_word: λεγούσης μοι
  choice: जो मुझसे कह रही थी
  rationale: वर्तमान कृदंत की समकालिक क्रिया और μοι दोनों सुरक्षित हैं; संबंधवाचक उपवाक्य हिन्दी में स्वाभाविक है।
- source_word: Σαοὺλ Σαούλ
  choice: शाऊल, शाऊल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण लिया गया और संबोधन की पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: τί
  choice: क्यों
  rationale: क्रिया के साथ τί यहाँ कार्य का कारण पूछता है; हिन्दी में ‘क्यों’ स्वाभाविक समतुल्य है।
- source_word: με
  choice: मुझे
  rationale: वक्ता की ओर संकेत करने वाला प्रत्यक्ष कर्म सर्वनाम बिना विस्तार के सुरक्षित रखा गया है।
- source_word: διώκεις
  choice: तू ... सताता है
  rationale: इस प्रसंग में διώκω का अर्थ शत्रुतापूर्वक उत्पीड़न करना है। वर्तमान काल चल रही गतिविधि को व्यक्त करता है; एक व्यक्ति से सीधे संबोधन के कारण ‘तू’ उपयुक्त है।
theological_decisions:
- issue: विश्वासियों के विरुद्ध शाऊल के कार्यों से वक्ता का संबंध
  choice: प्रत्यक्ष प्रथम पुरुष ‘मुझे’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘मेरे लोगों को’ या ‘मेरे अनुयायियों को’ जैसे व्याख्यात्मक विस्तार
  rationale: मूल पाठ वक्ता को शाऊल के उत्पीड़न का प्रत्यक्ष लक्ष्य बताता है। अनुवाद इस धार्मिक अर्थ-तनाव को समझाकर सीमित करने के बजाय उसी रूप में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है। सीधे संबोधन में ‘तू’ प्राचीन सामाजिक दूरी थोपे बिना एकवचन निकट संबोधन और यूनानी द्वितीय पुरुष एकवचन को व्यक्त करता है। ‘भूमि’ मूल ἔδαφος के निकट रहते हुए सामान्य पाठक के लिए सहज है।
