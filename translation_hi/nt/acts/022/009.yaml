  text: οἱ δὲ σὺν ἐμοὶ ὄντες τὸ μὲν φῶς ⸀ἐθεάσαντο τὴν δὲ φωνὴν οὐκ ἤκουσαν τοῦ λαλοῦντός μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/009.yaml
  text: Those who were with me saw the light[a], but they did not hear the voice of the one speaking to me.
translation:
  language: hi
  text: जो लोग मेरे साथ थे, उन्होंने प्रकाश तो देखा, पर जो मुझसे बोल रहा था उसकी आवाज़ नहीं सुनी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी आवाज़ नहीं समझी।” प्रेरितों 9:7 से तुलना करें, जहाँ कहा गया है कि पौलुस के साथियों ने ध्वनि या आवाज़ सुनी। संभव है कि उन्होंने ध्वनि तो सुनी हो, पर बोलने वाले की बात न समझी हो।
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ σὺν ἐμοὶ ὄντες
  choice: जो लोग मेरे साथ थे
  rationale: यह पदबंध यूनानी के व्यक्तिवाचक बहुवचन को स्वाभाविक हिन्दी में व्यक्त करता है और मूल में न दिए गए ‘पुरुष’ को नहीं जोड़ता। δέ का विरोध आगे ‘तो...पर’ से व्यक्त हुआ है।
- source_word: τὸ μὲν φῶς
  choice: ज्योति तो
  rationale: φῶς का सीधा अर्थ ‘प्रकाश/ज्योति’ है। ‘तो...पर’ μέν...δέ के विरोध को स्वाभाविक हिन्दी में बनाए रखता है; ‘तेज़’ नहीं जोड़ा गया क्योंकि वह इस पद में स्पष्ट नहीं है।
- source_word: ἐθεάσαντο
  choice: देखी
  rationale: θεάομαι यहाँ देखने या प्रत्यक्ष करने को दर्शाता है। ‘देखी’ वर्तमान हिन्दी में सहज है और जानबूझकर निहारने का अतिरिक्त भाव नहीं जोड़ता।
- source_word: τὴν δὲ φωνὴν
  choice: उसकी आवाज़
  rationale: φωνή का अर्थ ‘आवाज़’ या ‘ध्वनि’ हो सकता है। साथ का संबंधवाचक पद ‘जो मुझसे बोल रहा था’ एक व्यक्तिगत वक्ता बताता है, इसलिए ‘आवाज़’ उपयुक्त है। हिन्दी में ‘उसकी’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὐκ ἤκουσαν
  choice: नहीं सुनी
  rationale: ἀκούω का सामान्य अर्थ ‘सुनना’ है। प्रेरितों 9:7 के साथ दिखाई देने वाले तनाव को मुख्य पाठ में ‘समझना’ डालकर हल नहीं किया गया; वैकल्पिक अर्थ टिप्पणी में रखा गया है।
- source_word: τοῦ λαλοῦντός μοι
  choice: जो मुझसे बोल रहा था
  rationale: वर्तमान कृदंत λαλοῦντος बोलने की जारी क्रिया दिखाता है। यह हिन्दी रूप उस निरंतरता और ‘मुझसे’ संबंध दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: प्रेरितों 9:7 की तुलना में पौलुस के साथियों द्वारा आवाज़ सुनने या न सुनने का प्रत्यक्ष तनाव
  choice: मुख्य पाठ में ‘उसकी आवाज़ नहीं सुनी’
  alternative: ‘उसकी आवाज़ नहीं समझी’ अथवा उन्होंने ध्वनि सुनी, पर वक्ता की बात नहीं समझी
  rationale: इस पद का यूनानी पाठ सबसे सीधे रूप में न सुनने की बात कहता है। फिर भी ἀκούω और φωνή के अर्थ-क्षेत्र तथा प्रेरितों 9:7 के समानांतर वृत्तांत के कारण समझ न पाने की व्याख्या संभव है। मुख्य पाठ मूल का प्रत्यक्ष कथन रखता है और वैकल्पिक समझ को पादटिप्पणी में देता है, ताकि तनाव को चुपचाप समाप्त न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप। ‘ज्योति’ बाइबलीय प्रसंग में स्वाभाविक है, जबकि वाक्य-विन्यास सामान्य पाठकों के लिए सरल रखा गया है। ‘तो...पर’ मूल के μέν...δέ विरोध को स्पष्ट करता है।
