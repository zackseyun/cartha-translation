base_translation:
  language: en
  yaml_path: translation/nt/acts/022/006.yaml
  text: It happened that as I was traveling and drawing near to Damascus[a], about noon, suddenly a bright light from heaven flashed around me,
translation:
  language: hi
  text: ऐसा हुआ कि जब मैं यात्रा कर रहा था और दमिश्क के निकट आ रहा था, तब लगभग दोपहर के समय अचानक स्वर्ग से एक तेज प्रकाश[a] मेरे चारों ओर चमक उठा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक प्रचंड प्रकाश।” यूनानी अभिव्यक्ति प्रकाश की विशालता या तीव्रता पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: तो ऐसा हुआ कि
  rationale: यह घटना का परिचय देने वाले यूनानी मुहावरे और δέ के हलके संयोजक बल को स्वाभाविक हिन्दी में व्यक्त करता है; μοι का प्रथम-पुरुष दृष्टिकोण अगले पदबंध में ‘मैं’ से स्पष्ट है।
- source_word: πορευομένῳ καὶ ἐγγίζοντι τῇ Δαμασκῷ
  choice: जब मैं यात्रा करते हुए दमिश्क के निकट पहुँच रहा था
  rationale: दोनों वर्तमान कृदंतों की जारी क्रिया को बनाए रखता है और दमिश्क की ओर निकट आने का अर्थ सहज हिन्दी में देता है।
- source_word: περὶ μεσημβρίαν
  choice: दोपहर के लगभग
  rationale: समय की अनुमानितता और मध्याह्न का अर्थ स्पष्ट तथा स्वाभाविक ढंग से व्यक्त होता है।
- source_word: ἐξαίφνης
  choice: अचानक
  rationale: घटना के आकस्मिक होने का सीधा और प्रचलित हिन्दी रूप है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से
  rationale: प्रकाश के ऊपर से और प्रसंगतः अलौकिक स्रोत से आने की सम्भावना को बनाए रखता है; केवल मौसम-संबंधी ‘आकाश’ तक अर्थ सीमित नहीं करता।
- source_word: περιαστράψαι
  choice: चारों ओर चमक उठा
  rationale: संयुक्त क्रिया के चारों ओर प्रकाश फैलने और अओरिस्ट के आकस्मिक घटना-भाव, दोनों को व्यक्त करता है।
- source_word: φῶς ἱκανὸν
  choice: एक तेज प्रकाश
  rationale: ἱκανός यहाँ प्रकाश की उल्लेखनीय मात्रा या तीव्रता बता सकता है। ‘तेज प्रकाश’ आधुनिक हिन्दी में स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: περὶ ἐμέ
  choice: मेरे चारों ओर
  rationale: स्थान-संबंधी अर्थ का स्पष्ट और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ἐκ τοῦ οὐρανοῦ में οὐρανός का अर्थ
  choice: स्वर्ग से
  alternative: आकाश से
  rationale: प्रेरितों के काम के प्रकाशनात्मक प्रसंग में ‘स्वर्ग’ सम्भावित दिव्य/अलौकिक स्रोत को सुरक्षित रखता है, पर स्वयं कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। सहभागी क्रियाओं की निरंतरता और घटना की आकस्मिकता बनाए रखी गई है। पादटिप्पणी-चिह्न को उसी अभिव्यक्ति के बाद रखा गया है जिससे वह वास्तव में संबंधित है।
