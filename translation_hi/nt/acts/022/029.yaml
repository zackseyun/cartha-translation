  text: εὐθέως οὖν ἀπέστησαν ἀπ’ αὐτοῦ οἱ μέλλοντες αὐτὸν ἀνετάζειν· καὶ ὁ χιλίαρχος δὲ ἐφοβήθη ἐπιγνοὺς ὅτι Ῥωμαῖός ἐστιν καὶ ὅτι ⸂αὐτὸν ἦν⸃ δεδεκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/029.yaml
  text: Therefore those who were about to examine him withdrew from him at once[b][a], and the tribune also became afraid when he realized that he was a Roman citizen and that he had bound him.
translation:
  language: hi
  text: इसलिए जो लोग उससे पूछताछ करने वाले थे, वे तुरन्त उससे हट गए। और सहस्रपति[a] भी यह जानकर डर गया कि वह रोमी नागरिक है और उसने उसे बाँध रखा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पद χιλίαρχος एक रोमी सैन्य अधिकारी के लिए है, जिसका पदनाम लगभग एक हज़ार सैनिकों के अधिकारी का था, यद्यपि वास्तविक संख्या अलग हो सकती थी।
    reason: cultural_note
lexical_decisions:
- source_word: εὐθέως οὖν
  choice: इसलिए ... तुरन्त
  rationale: οὖν पिछले प्रसंग से परिणामसूचक संबंध दिखाता है, और εὐθέως प्रतिक्रिया की तात्कालिकता व्यक्त करता है।
- source_word: ἀπέστησαν ἀπ’ αὐτοῦ
  choice: उसके पास से हट गए
  rationale: यह स्वाभाविक हिन्दी में पीछे हटने और आगे की कार्रवाई रोक देने, दोनों भावों को व्यक्त करता है।
- source_word: οἱ μέλλοντες αὐτὸν ἀνετάζειν
  choice: जो लोग उससे पूछताछ करने वाले थे
  rationale: μέλλω आसन्न इरादा व्यक्त करता है। ἀνετάζω आधिकारिक जाँच या पूछताछ का सूचक है; पिछले पद से स्पष्ट है कि यह कोड़े लगाकर की जाने वाली थी, पर मुख्य पाठ यूनानी की अपेक्षाकृत व्यापक अभिव्यक्ति बनाए रखता है।
- source_word: χιλίαρχος
  choice: सेनापति
  rationale: χιλίαρχος रोमी सैन्य अधिकारी का पद था। सामान्य हिन्दी पाठक के लिए 'सेनापति' सहज है; पद की अधिक सटीक ऐतिहासिक जानकारी पादटिप्पणी में दी गई है।
- source_word: ἐφοβήθη
  choice: डर गया
  rationale: अधिकारी को वास्तविक स्थिति मालूम होने पर उत्पन्न प्रतिक्रिया को स्वाभाविक और सीधी हिन्दी में व्यक्त करता है।
- source_word: ἐπιγνοὺς
  choice: यह जानकर
  rationale: कृदन्त का कारणात्मक-कालिक भाव संक्षेप और स्वाभाविक रूप से व्यक्त होता है।
- source_word: Ῥωμαῖός ἐστιν
  choice: वह रोमी नागरिक है
  rationale: प्रसंग जातीय पहचान के बजाय कानूनी नागरिकता का है। वर्तमान काल 'है' यूनानी ἐστιν को बनाए रखता है और हिन्दी में भी स्वाभाविक है।
- source_word: αὐτὸν ἦν δεδεκώς
  choice: उसने उसे बँधवा रखा है
  rationale: परिपूर्ण कृदन्त पूर्ण की गई कार्रवाई के बने हुए परिणाम को दिखाता है। प्रसंग में अधिकारी ने अधीनस्थों से पौलुस को बाँधने का आदेश दिलाया था, इसलिए हिन्दी का कारक 'बँधवा रखा' स्वाभाविक है; वर्तमान परिणाम को 'है' से बनाए रखा गया है।
