translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। 'पूछताछ' आधिकारिक जाँच का भाव रखता है; कोड़े लगाकर पूछताछ की स्पष्टता पिछले पद पर छोड़ी गई है। पादटिप्पणी का चिह्न मुख्य पाठ में संबंधित शब्द के साथ रखा गया है।
