  yaml_path: translation/nt/acts/022/001.yaml
  text: Men[a], brothers and fathers, hear now my defense to you.
translation:
  language: hi
  text: “भाइयो और पितृतुल्य जनो, मेरी सफाई सुनिए, जो मैं अब आपके सामने रख रहा हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοὶ
  choice: भाइयो
  rationale: यूनानी संबोधन में ἄνδρες संबोधन को पुरुषों के रूप में स्पष्ट करता है, जबकि हिंदी में ‘पुरुष भाइयो’ अस्वाभाविक और अनावश्यक रूप से दोहरावपूर्ण होगा। ‘भाइयो’ पुरुष श्रोताओं के प्रति सीधे संबोधन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πατέρες
  choice: पितृतुल्य जनो
  rationale: शाब्दिक ‘पिताओ’ आधुनिक हिंदी में अस्वाभाविक है। यहाँ सम्मानित अथवा आयु में बड़े पुरुषों के लिए आदरसूचक संबोधन है; ‘पितृतुल्य जनो’ मूल की पारिवारिक छवि और सम्मान दोनों बचाता है।
- source_word: ἀκούσατέ
  choice: सुनिए
  rationale: बहुवचन आज्ञार्थक संबोधन का आदरपूर्ण और स्वाभाविक हिंदी रूप।
- source_word: μου
  choice: मेरा
  rationale: ἀπολογίας के साथ संबंधवाचक अर्थ देता है—वक्ता द्वारा प्रस्तुत अपना पक्ष।
- source_word: ἀπολογίας
  choice: पक्ष
  rationale: यहाँ शब्द क्षमा-याचना नहीं, आरोपों के उत्तर में बचाव या सफाई का कथन है। ‘मेरा पक्ष’ आधुनिक सार्वजनिक और न्यायिक हिंदी में सहज है।
- source_word: πρὸς ὑμᾶς
  choice: आपके सामने प्रस्तुत
  rationale: वाक्यांश बताता है कि यह प्रतिरक्षा-वक्तव्य श्रोताओं को संबोधित है। यह रूप ‘आपसे’ या अस्वाभाविक ‘आपके प्रति’ की अपेक्षा सार्वजनिक भाषण के संदर्भ में अधिक स्पष्ट है।
- source_word: νυνὶ
  choice: अब
  rationale: वक्ता की वर्तमान विनती और भाषण की तात्कालिकता को व्यक्त करता है।
