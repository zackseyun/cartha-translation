  register: आदरपूर्ण सार्वजनिक संबोधन के लिए ‘सुनिए’ और ‘आपके’ का प्रयोग किया गया है। भाषा आधुनिक और सहज रखी गई है, पर ‘पितृतुल्य जनो’ द्वारा मूल संबोधन की गरिमा और सामाजिक सम्मान सुरक्षित हैं।
