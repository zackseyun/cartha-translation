  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘शाऊल’ प्रचलित हिन्दी बाइबलीय लिप्यंतरण है। प्रत्यक्ष कथन को स्वाभाविक रखा गया है और दृष्टि लौटने के उपचार-संदर्भ को स्पष्ट किया गया है।
