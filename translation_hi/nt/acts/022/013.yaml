base_translation:
  language: en
  yaml_path: translation/nt/acts/022/013.yaml
  text: He came to me[a], and standing by me said to me, ‘Brother Saul, receive your sight.’ And in that very hour I received my sight and looked at him.
translation:
  language: hi
  text: वह मेरे पास आया और मेरे निकट खड़े होकर मुझसे कहा, “भाई शाऊल, अपनी दृष्टि फिर से पा।” उसी घड़ी मेरी दृष्टि लौट आई और मैंने उसकी ओर देखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν πρὸς ἐμέ
  choice: वह मेरे पास आया
  rationale: यह वाक्यांश हनन्याह के शाऊल की ओर आकर उसके पास पहुँचने की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπιστάς
  choice: मेरे निकट खड़े होकर
  rationale: कृदन्त हनन्याह के शाऊल के पास खड़े होने को बताता है; यह हिन्दी में स्थान-संबंध को स्पष्ट और सहज रखता है।
- source_word: Σαοὺλ ἀδελφέ
  choice: भाई शाऊल
  rationale: सम्बोधन कारक को हिन्दी के स्वाभाविक सम्बोधन-क्रम में रखा गया है; ‘भाई’ आत्मीयता और विश्वास-समुदाय के संबंध को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: ἀνάβλεψον
  choice: फिर से देखने लग
  rationale: अंधेपन और चंगाई के प्रसंग में क्रिया का अर्थ दृष्टि का लौटना है। आदेशात्मक रूप को सरल और सीधी आधुनिक हिन्दी में रखा गया है।
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: उसी घड़ी
  rationale: यह यूनानी पदबंध घटना के ठीक उसी समय घटने पर बल देता है; ‘उसी घड़ी’ उस बल को संक्षेप और गरिमा के साथ बनाए रखता है।
- source_word: ἀνέβλεψα
  choice: मेरी दृष्टि लौट आई
  rationale: समान क्रिया के इस रूप को प्रसंगानुसार दृष्टि की पुनःप्राप्ति के रूप में व्यक्त किया गया है; इससे हिन्दी में परिणाम स्वाभाविक सुनाई देता है।
- source_word: εἰς αὐτόν
  choice: मैंने उसकी ओर देखा
  rationale: εἰς की दिशात्मकता को ‘उसकी ओर’ से सुरक्षित रखा गया है, जिससे दृष्टि लौटने के बाद हनन्याह की ओर देखने का अर्थ स्पष्ट होता है।
- source_word: κἀγώ
  choice: और मैंने
  rationale: καί और ἐγώ के मेल को हिन्दी कथन-प्रवाह में सरल समन्वय से व्यक्त किया गया है; प्रसंग अतिरिक्त आत्मबल की माँग नहीं करता।
