  yaml_path: translation/nt/acts/022/021.yaml
  text: And he said to me[a], ‘Go, because I will send you far away to the Gentiles.’
translation:
  language: hi
  text: और उसने मुझसे कहा, ‘जा, क्योंकि मैं तुझे बहुत दूर गैर-यहूदियों[a] के पास भेजूँगा।’
  philosophy: optimal-equivalence
  footnotes:
