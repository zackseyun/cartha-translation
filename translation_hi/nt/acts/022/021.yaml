    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρός με
  choice: उसने मुझसे कहा
  rationale: πρός + कर्मकारक के साथ λέγω संबोधित व्यक्ति से प्रत्यक्ष कथन को स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: Πορεύου
  choice: जा
  rationale: वर्तमान मध्यवाच्य आज्ञार्थक यहाँ जाने की सीधी आज्ञा है; एकवचन संबोधन के अनुरूप ‘जा’ सहज है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι आज्ञा का कारण प्रस्तुत करता है।
- source_word: ἐγὼ
  choice: मैं
  rationale: यूनानी में व्यक्त सर्वनाम बल देता है; हिन्दी में स्पष्ट ‘मैं’ उस बल को पर्याप्त रूप से बनाए रखता है।
- source_word: εἰς ἔθνη
  choice: गैर-यहूदियों के पास
  rationale: प्रेरितों के काम के इस मिशन-संदर्भ में ἔθνη यहूदियों से भिन्न लोगों को सूचित करता है; ‘के पास’ व्यक्तियों की ओर भेजे जाने के लक्ष्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μακρὰν
  choice: दूर
  rationale: यह भेजे जाने की भौगोलिक दूरी पर बल देता है।
- source_word: ἐξαποστελῶ σε
  choice: मैं तुझे ... भेजूँगा
  rationale: भविष्यकालीन क्रिया भेजने को व्यक्त करती है; ‘तुझे’ मूल के एकवचन निकट संबोधन को सुरक्षित रखता है।
theological_decisions:
- issue: प्रेरिताई मिशन के संदर्भ में ἔθνη का अनुवाद
  choice: गैर-यहूदी
  alternative: राष्ट्र / जातियाँ
  rationale: संदर्भ में पौलुस को यहूदी समुदाय से बाहर के लोगों के पास भेजा जाना अभिप्रेत है। ‘गैर-यहूदी’ इस ऐतिहासिक-धार्मिक भेद को सामान्य आधुनिक हिन्दी में स्पष्ट करता है, जबकि व्यापक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। प्रत्यक्ष संबोधन में एकवचन ‘जा/तुझे’ रखा गया है। पादटिप्पणी-चिह्न संबंधित वाक्य के अंत में दिया गया है।
