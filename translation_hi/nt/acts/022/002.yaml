source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ ὅτι τῇ Ἑβραΐδι διαλέκτῳ προσεφώνει αὐτοῖς μᾶλλον παρέσχον ἡσυχίαν. καὶ φησίν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/002.yaml
  text: 'But when they heard that he was addressing them in the Hebrew language[a], they became even more quiet. And he said:'
translation:
  language: hi
  text: 'लेकिन जब उन्होंने सुना कि वह उन्हें इब्रानी भाषा[a] में संबोधित कर रहा था, तो वे और भी चुप हो गए। तब उसने कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “अरामी भाषा।” यूनानी पाठ में “इब्रानी भाषा” है, जिसका इस प्रसंग में यहूदिया की स्थानीय सामी बोली के अर्थ में प्रयोग हुआ हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: लेकिन जब उन्होंने सुना
  rationale: समय-सूचक कृदंत को स्वाभाविक हिन्दी में ‘जब उन्होंने सुना’ से व्यक्त किया गया है; δὲ पिछले प्रसंग से हल्का विरोध या नया मोड़ दिखाता है, इसलिए ‘लेकिन’ उपयुक्त है।
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: इब्रानी भाषा में
  rationale: यूनानी पद स्पष्ट रूप से ‘इब्रानी भाषा/बोली’ कहता है। सम्भावित अरामी अभिप्राय को मुख्य पाठ में निश्चित न करके पादटिप्पणी में रखा गया है।
- source_word: προσεφώνει αὐτοῖς
  choice: वह उनसे ... बोल रहा है
  rationale: अपूर्णकालीन क्रिया भीड़ को सम्बोधित करते हुए जारी वाणी दर्शाती है। ‘उनसे बोल रहा है’ आधुनिक हिन्दी में सहज है और निर्देशित वचन का भाव बनाए रखता है।
- source_word: μᾶλλον παρέσχον ἡσυχίαν
  choice: वे और भी शांत हो गए
  rationale: शाब्दिक मुहावरा ‘अधिक शान्ति प्रदान की’ हिन्दी में अस्वाभाविक होगा। यह रूप भीड़ के पहले से अधिक चुप हो जाने का तुलनात्मक भाव स्पष्ट करता है।
- source_word: καὶ φησίν
  choice: 'तब उसने कहा:'
  rationale: ऐतिहासिक वर्तमान को हिन्दी कथा-शैली में भूतकाल से व्यक्त किया गया है। ‘तब’ अगले भाषण की ओर स्वाभाविक संक्रमण कराता है।
theological_decisions:
- issue: ‘इब्रानी भाषा’ का ऐतिहासिक अभिप्राय
  choice: मुख्य पाठ में ‘इब्रानी भाषा’ बनाए रखना
  alternative: इसे सीधे ‘अरामी भाषा’ अनूदित करना
  rationale: मूल यूनानी में Ἑβραΐδι है, इसलिए मूल-पाठ की शब्दावली रखी गई है। यह पद उस समय यहूदिया में प्रचलित अरामी जैसी स्थानीय सामी बोली को भी सूचित कर सकता है; इस वास्तविक अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘इब्रानी’ बाइबलीय संदर्भ में परिचित और स्पष्ट रूप है; पादटिप्पणी भाषाई अनिश्चितता को बिना निर्णायक बनाए बताती है।
