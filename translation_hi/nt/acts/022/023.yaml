lexical_decisions:
- source_word: κραυγαζόντων
  choice: चिल्ला रहे थे
  rationale: वर्तमानकालिक कृदन्त भीड़ की जारी और ऊँची पुकार को दर्शाता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τε
  choice: जब… और
  rationale: यह पहले कृदन्त को आगे की समन्वित क्रियाओं से जोड़ता है; हिन्दी वाक्य में ‘जब’ और ‘और’ से संबंध सहज रूप में व्यक्त होता है।
- source_word: αὐτῶν
  choice: वे
  rationale: यूनानी में सर्वनाम संबंधकारक बहुवचन है, पर कृदन्तीय रचना का कर्ता हिन्दी में स्पष्ट करने के लिए ‘वे’ स्वाभाविक है।
- source_word: ῥιπτούντων
  choice: फेंक रहे थे
  rationale: क्रिया का मूल अर्थ फेंकना या झटककर डालना है। संदर्भ से वस्त्र उतारकर फेंकना या उत्तेजना में इधर-उधर फेंकना—दोनों संभव हैं, इसलिए मुख्य पाठ में अधिक खुला अर्थ रखा गया है।
- source_word: τὰ ἱμάτια
  choice: अपने कपड़े
  rationale: ἱμάτια प्रायः बाहरी वस्त्रों को सूचित करता है, पर बहुवचन और क्रिया के साथ अर्थ में कुछ खुलापन है। ‘अपने कपड़े’ सामान्य पाठक के लिए स्वाभाविक है और ‘चोगे’ की अनावश्यक विशिष्टता से बचता है।
- source_word: κονιορτόν
  choice: धूल
  rationale: यह संज्ञा सीधे धूल को दर्शाती है; हिन्दी में यही सटीक और स्वाभाविक शब्द है।
- source_word: βαλλόντων
  choice: उड़ा रहे थे
  rationale: शाब्दिक अर्थ ‘फेंक रहे थे’ है, पर धूल को हवा में फेंकने के लिए ‘धूल उड़ाना’ स्वाभाविक हिन्दी मुहावरा है और उत्तेजित क्रिया को स्पष्ट करता है।
- source_word: εἰς τὸν ἀέρα
  choice: हवा में
  rationale: यह पूर्वसर्गीय पद का निकट और स्वाभाविक हिन्दी रूप है।
