source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ ὁ χιλίαρχος· Ἐγὼ πολλοῦ κεφαλαίου τὴν πολιτείαν ταύτην ἐκτησάμην. ὁ δὲ Παῦλος ἔφη· Ἐγὼ δὲ καὶ γεγέννημαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/028.yaml
  text: But the tribune answered[a], “I acquired this citizenship for a large sum.” But Paul said[b], “But I was even born with it.”
translation:
  language: hi
  text: पर सेनापति ने उत्तर दिया[a], “मैंने यह नागरिकता बड़ी रकम देकर प्राप्त की है।” पौलुस ने कहा[b], “लेकिन मैं तो जन्म से ही नागरिक हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने बहुत बड़ी धनराशि से यह नागरिकता प्राप्त की है।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “लेकिन मैं तो जन्मा ही हूँ”; प्रसंग से नागरिकता जन्म से मिलने का अर्थ समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χιλίαρχος
  choice: सेनापति
  rationale: यह रोमी सैन्य अधिकारी का पद है, जो लगभग एक हजार सैनिकों का अधिकारी होता था। ‘सेनापति’ आधुनिक हिन्दी में सहज और प्रसंगानुकूल है; अधिक शाब्दिक ‘सहस्रपति’ सामान्य पाठक के लिए अस्वाभाविक होगा।
- source_word: πολλοῦ κεφαλαίου
  choice: बड़ी रकम देकर
  rationale: यह वाक्यांश बड़ी धनराशि चुकाने का अर्थ देता है। यह हिन्दी प्रयोग स्वाभाविक है और नागरिकता प्राप्त करने में भारी खर्च का भाव स्पष्ट रखता है।
- source_word: πολιτείαν
  choice: नागरिकता
  rationale: इस प्रसंग में शब्द कानूनी नागरिक-स्थिति, विशेषतः रोमी नागरिकता, को सूचित करता है; ‘नागरिकता’ इसका सटीक और सामान्य हिन्दी रूप है।
- source_word: ἐκτησάμην
  choice: प्राप्त की है
  rationale: क्रिया अपने लिए हासिल करने या प्राप्त करने का व्यापक अर्थ रखती है। ‘बड़ी रकम देकर’ साधन को व्यक्त करता है, इसलिए ‘खरीदी’ कहकर अर्थ को अनावश्यक रूप से अधिक निश्चित नहीं किया गया।
- source_word: καὶ γεγέννημαι
  choice: मैं तो जन्म से ही नागरिक हूँ
  rationale: पूर्णकालीन रूप जन्म से प्राप्त और अब भी विद्यमान स्थिति को व्यक्त करता है। प्रसंग से निहित ‘नागरिक’ को सहज हिन्दी के लिए स्पष्ट किया गया है, और ‘तो…ही’ καί के विरोधात्मक बल को दर्शाता है।
- source_word: δέ
  choice: पर / लेकिन
  rationale: संवाद में हल्के विरोध और दोनों व्यक्तियों की स्थितियों के अंतर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔφη
  choice: कहा
  rationale: यह सामान्य कथन-क्रिया है; ‘कहा’ बिना अतिरिक्त भाव जोड़े इसका सहज हिन्दी अनुवाद है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। रोमी पद के लिए दुर्बोध ‘सहस्रपति’ के बजाय ‘सेनापति’ चुना गया है। पौलुस के उत्तर में निहित नागरिकता को स्पष्ट किया गया है, जबकि उसका शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
