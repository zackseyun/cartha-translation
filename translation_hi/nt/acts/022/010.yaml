id: ACT.22.10
reference: Acts 22:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπον δέ· Τί ποιήσω, κύριε; ὁ δὲ κύριος εἶπεν πρός με· Ἀναστὰς πορεύου εἰς Δαμασκόν, κἀκεῖ σοι λαληθήσεται περὶ πάντων ὧν τέτακταί σοι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/010.yaml
  text: Then I said[a], ‘What should I do, Lord?’ And the Lord said to me, ‘Get up and go into Damascus[b], and there you will be told about everything that has been appointed for you to do.’
translation:
  language: hi
  text: तब मैंने कहा[a], ‘हे प्रभु, मैं क्या करूँ?’ प्रभु ने मुझसे कहा, ‘उठो और दमिश्क में जाओ; वहाँ तुम्हें उन सभी कामों के विषय में बताया जाएगा जिन्हें करना तुम्हारे लिए ठहराया गया है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे प्रभु, मुझे क्या करना है?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ποιήσω
  choice: मैं क्या करूँ
  rationale: विचारात्मक एओरिस्ट सब्जंक्टिव यहाँ आगे क्या करना उचित है, इस विषय में निर्देश माँगता है। ‘मैं क्या करूँ?’ स्वाभाविक हिन्दी में इस भाव को बनाए रखता है।
- source_word: κύριε / ὁ ... κύριος
  choice: हे प्रभु / प्रभु
  rationale: सम्बोधन में ‘हे प्रभु’ और कथन में ‘प्रभु’ आधुनिक, गरिमापूर्ण हिन्दी हैं तथा प्रेरितों के काम के इस प्रसंग में κύριος की मसीह-संबंधी शक्ति को कम नहीं करते।
- source_word: Ἀναστὰς
  choice: उठो
  rationale: यह कृदन्त πορεύου के साथ आज्ञार्थक क्रम में प्रयुक्त है; ‘उठो’ संक्षिप्त और स्वाभाविक है।
- source_word: πορεύου εἰς Δαμασκόν
  choice: दमिश्क में जाओ
  rationale: εἰς शहर के भीतर जाने की दिशा व्यक्त करता है। हिन्दी में ‘दमिश्क में जाओ’ इस गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κἀκεῖ
  choice: वहाँ
  rationale: καὶ ἐκεῖ का स्थान-सूचक अर्थ स्पष्ट और सहज रूप में ‘वहाँ’ से व्यक्त होता है; वाक्य-संबंध अर्धविराम द्वारा बना रहता है।
- source_word: λαληθήσεται
  choice: तुम्हें ... बताया जाएगा
  rationale: λαλέω के भविष्यत् कर्मवाच्य और σοι का स्वाभाविक हिन्दी निष्क्रिय रूप यही है।
- source_word: περὶ πάντων
  choice: उन सभी कामों के विषय में
  rationale: परवर्ती ὧν ... ποιῆσαι के कारण ‘सब बातों’ की अपेक्षा ‘सभी कामों’ से आशय अधिक स्पष्ट होता है, जबकि περί का विषय-सूचक भाव बना रहता है।
- source_word: ὧν τέτακταί σοι ποιῆσαι
  choice: जिन्हें करना तुम्हारे लिए ठहराया गया है
  rationale: ‘ठहराया गया है’ τέτακται के पूर्ण कर्मवाच्य रूप और उसके वर्तमान तक बने परिणाम को व्यक्त करता है। ‘तुम्हारे लिए’ σοι को बनाए रखता है और यह अनावश्यक रूप से नहीं बताता कि कार्य किस प्रकार ठहराए गए।
theological_decisions:
- issue: τέτακταί में ईश्वरीय निर्देशन और बुलाहट का बल
  choice: जिन्हें करना तुम्हारे लिए ठहराया गया है
  alternative: जो काम तुम्हें सौंपे गए हैं
  rationale: ‘ठहराया गया’ कार्यों के पहले से नियत होने का भाव सुरक्षित रखता है, पर पद से आगे बढ़कर किसी विशिष्ट पूर्वनियति-सिद्धान्त को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रत्यक्ष वचन में सहजता के लिए ‘हे प्रभु’ और वर्णन में ‘प्रभु’ प्रयोग हुआ है। केवल वास्तविक हिन्दीगत विकल्प पर पादटिप्पणी दी गई है।
