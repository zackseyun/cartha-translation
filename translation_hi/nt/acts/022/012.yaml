  yaml_path: translation/nt/acts/022/012.yaml
  text: A certain man[a], Ananias, devout according to the law, well spoken of by all the Jews living there,
translation:
  language: hi
  text: हनन्याह नाम का एक व्यक्ति, जो व्यवस्था के अनुसार धर्मनिष्ठ था और वहाँ रहने वाले सभी यहूदियों[a] में प्रतिष्ठित था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया के लोग,” यदि इसे धार्मिक-सामुदायिक पहचान के बजाय जातीय-भौगोलिक अर्थ में लिया जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἁνανίας
  choice: हनन्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: δέ
  choice: अलग शब्द के रूप में व्यक्त नहीं किया गया
  rationale: यहाँ δέ केवल हल्का कथात्मक संक्रमण दिखाता है; हिन्दी में अनावश्यक ‘अब’ या स्पष्ट कालक्रम जोड़ने के बजाय वाक्य-प्रवाह से इसका कार्य स्वाभाविक रूप से व्यक्त होता है।
- source_word: τις ἀνὴρ
  choice: एक व्यक्ति
  rationale: यह अभिव्यक्ति किसी निश्चित, पर पहले परिचित न कराए गए पुरुष का परिचय देती है। ‘व्यक्ति’ आधुनिक और स्वाभाविक हिन्दी है; हनन्याह नाम से पुरुष-संदर्भ स्पष्ट है।
- source_word: εὐλαβὴς κατὰ τὸν νόμον
  choice: व्यवस्था के अनुसार धर्मनिष्ठ
  rationale: ‘धर्मनिष्ठ’ श्रद्धा और धार्मिक आचरण दोनों का भाव देता है, जबकि ‘व्यवस्था के अनुसार’ उसकी निष्ठा को मूसा की व्यवस्था के संबंध में स्पष्ट करता है।
- source_word: μαρτυρούμενος ὑπὸ πάντων
  choice: सभी ... में प्रतिष्ठित
  rationale: निष्क्रिय कृदंत यहाँ दूसरों द्वारा दी गई अनुकूल गवाही या अच्छी प्रतिष्ठा को बताता है; हिन्दी में ‘प्रतिष्ठित’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῶν κατοικούντων Ἰουδαίων
  choice: वहाँ रहनेवाले सभी यहूदियों
  rationale: κατοικούντων निवास करने का अर्थ देता है; प्रसंग से स्थान दमिश्क है, इसलिए ‘वहाँ’ पर्याप्त है। Ἰουδαίων यहाँ मुख्यतः स्थानीय यहूदी समुदाय को सूचित करता है।
theological_decisions:
- issue: Ἰουδαίων का अर्थ
  choice: यहूदियों
  alternative: यहूदिया-निवासियों
  rationale: दमिश्क में रहनेवाले समुदाय के प्रसंग में धार्मिक-सामुदायिक पहचान प्रमुख है, न कि यहूदिया प्रदेश से भौगोलिक संबंध। फिर भी मूल शब्द की जातीय-भौगोलिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद के अंत में अल्पविराम इसलिए रखा गया है कि यूनानी वाक्य अगले पद में जारी रहता है। पादटिप्पणी-चिह्न को ‘यहूदियों’ के साथ रखा गया है, क्योंकि विकल्प उसी स्रोत-शब्द से संबंधित है।
