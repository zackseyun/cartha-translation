source:
  edition: SBLGNT
  text: ὡς δὲ ⸀προέτειναν αὐτὸν τοῖς ἱμᾶσιν εἶπεν πρὸς τὸν ἑστῶτα ἑκατόνταρχον ὁ Παῦλος· Εἰ ἄνθρωπον Ῥωμαῖον καὶ ἀκατάκριτον ἔξεστιν ὑμῖν μαστίζειν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/025.yaml
  text: But when they had stretched him out with the straps[a], Paul said to the centurion standing there, “Is it lawful for you to flog a Roman citizen who is uncondemned?”
translation:
  language: hi
  text: पर जब उन्होंने उसे चमड़े की पट्टियों से तानकर बाँधा, तो पौलुस ने पास खड़े सूबेदार से कहा, “क्या आपके लिए एक रोमी नागरिक[a], जिसे दोषी नहीं ठहराया गया है, कोड़े लगाना वैधानिक है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक रोमी मनुष्य।” यूनानी में “रोमी मनुष्य” है, पर इस कानूनी प्रसंग में आशय पौलुस की रोमी नागरिकता से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προέτειναν ... τοῖς ἱμᾶσιν
  choice: चमड़े की पट्टियों से तानकर बाँधा
  rationale: यह प्रयोग कोड़े लगाने की तैयारी में पौलुस को पट्टियों से कसकर फैलाने या तानने की शारीरिक क्रिया बताता है। ‘तानकर बाँधा’ दोनों पहलुओं को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἑστῶτα
  choice: पास खड़े
  rationale: कृदंत उस सूबेदार के निकट उपस्थित और खड़े होने का दृश्य प्रस्तुत करता है।
- source_word: ἑκατόνταρχον
  choice: सूबेदार
  rationale: रोमी सैन्य पद ἑκατόνταρχος के लिए हिन्दी बाइबलीय परंपरा में परिचित पदनाम; यह सामान्य पाठक के लिए अधिकारी की भूमिका भी स्पष्ट रखता है।
- source_word: ἄνθρωπον Ῥωμαῖον
  choice: एक रोमी नागरिक
  rationale: शाब्दिक रूप ‘एक रोमी मनुष्य’ है, किंतु इस कानूनी प्रश्न में Ῥωμαῖον से पौलुस की संरक्षित रोमी नागरिकता अभिप्रेत है; ‘रोमी नागरिक’ आधुनिक हिन्दी में उसी विधिक आशय को स्पष्ट करता है।
- source_word: ἀκατάκριτον
  choice: जिसे दोषी भी नहीं ठहराया गया है
  rationale: यह बिना न्यायिक दोषनिर्णय के होने की स्थिति बताता है। ‘भी’ पौलुस के प्रश्न में नागरिकता के साथ जुड़े दूसरे कानूनी आधार को उभारता है, बिना अर्थ बदले।
- source_word: ἔξεστιν
  choice: क्या आपके लिए यह उचित है
  rationale: यहाँ शब्द कानूनी रूप से अनुमत होने का प्रश्न उठाता है। ‘उचित’ स्वाभाविक हिन्दी है और प्रसंग में वैधानिकता का बोध देता है।
- source_word: μαστίζειν
  choice: कोड़े लगाएँ
  rationale: यह कठोर दंडात्मक पिटाई को दर्शाता है; ‘कोड़े लगाना’ आधुनिक हिन्दी में स्पष्ट, गंभीर और सहज है।
