  text: προσελθὼν δὲ ὁ χιλίαρχος εἶπεν αὐτῷ· Λέγε μοι, ⸀σὺ Ῥωμαῖος εἶ; ὁ δὲ ἔφη· Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/027.yaml
  text: So the tribune came up and said to him[a], “Tell me, are you a Roman?” And he said[b], “Yes.”
translation:
  language: hi
  text: तब सेनानायक[a] उसके पास आया और उससे कहा, “मुझे बताओ, क्या तुम रोमी नागरिक हो?” उसने कहा, “हाँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द χιλίαρχος यहाँ एक रोमी सैन्य अधिकारी के लिए है। इसका अनुवाद “ट्रिब्यून” या अधिक सामान्य रूप से “सैन्य अधिकारी” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: उसके पास आया
  rationale: अओरिस्ट कृदंत अधिकारी के पौलुस के निकट आने को दर्शाता है; यह हिन्दी में स्वाभाविक रूप से पूर्ववर्ती क्रिया के रूप में व्यक्त हुआ है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ मुख्यतः कथा को आगे बढ़ाता है, प्रबल विरोध नहीं दर्शाता; ‘तब’ प्रसंगानुकूल हिन्दी संयोजक है।
- source_word: χιλίαρχος
  choice: सेनापति
  rationale: यह रोमी सैन्य अधिकारी का पद है, जो एक दल का प्रधान था। ‘सेनापति’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है; ऐतिहासिक पद की विशिष्टता पादटिप्पणी में दी गई है।
- source_word: εἶπεν αὐτῷ
  choice: उससे पूछा
  rationale: शाब्दिक अर्थ ‘उससे कहा’ है, पर इसके तुरंत बाद प्रत्यक्ष प्रश्न आता है; हिन्दी में ‘उससे पूछा’ संवाद की क्रिया को स्वाभाविक और ठीक रूप से व्यक्त करता है।
- source_word: Λέγε μοι
  choice: मुझे बताओ
  rationale: आज्ञार्थक क्रिया और संप्रदान सर्वनाम का सीधा, स्वाभाविक हिन्दी समतुल्य।
- source_word: σὺ
  choice: तुम
  rationale: स्पष्ट यूनानी सर्वनाम प्रश्न में संबोधित व्यक्ति पर हल्का बल देता है; हिन्दी का व्यक्त ‘तुम’ इसे पर्याप्त रूप से बनाए रखता है।
- source_word: Ῥωμαῖος
  choice: रोमी नागरिक
  rationale: विशेषण संज्ञा के रूप में प्रयुक्त है। निकटवर्ती कानूनी संदर्भ में इसका आशय रोमी नागरिकता रखने वाले व्यक्ति से है; केवल ‘रोमी’ हिन्दी में जातीय या भौगोलिक अर्थ दे सकता है, इसलिए ‘नागरिक’ स्पष्ट किया गया है।
- source_word: Ναί
  choice: हाँ
  rationale: संक्षिप्त सकारात्मक उत्तर का सीधा हिन्दी समतुल्य; अनावश्यक विस्तार नहीं किया गया।
