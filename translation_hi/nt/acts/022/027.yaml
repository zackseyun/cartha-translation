translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण कथात्मक हिन्दी। ‘ट्रिब्यून’ जैसे अपरिचित पदनाम के बजाय ‘सेनापति’ रखा गया है और ऐतिहासिक विशिष्टता पादटिप्पणी में स्पष्ट की गई है। मुख्य पाठ में पादटिप्पणी चिह्न संबंधित पद के बजाय ‘पूछा’ के बाद रखने से अस्पष्टता हो सकती थी, इसलिए चिह्न अधिकारी के कथन के पास है; फिर भी इसका आशय ‘सेनापति’ शब्द से है।
