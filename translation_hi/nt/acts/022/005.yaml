id: ACT.22.5
reference: Acts 22:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὡς καὶ ὁ ἀρχιερεὺς μαρτυρεῖ μοι καὶ πᾶν τὸ πρεσβυτέριον· παρ’ ὧν καὶ ἐπιστολὰς δεξάμενος πρὸς τοὺς ἀδελφοὺς εἰς Δαμασκὸν ἐπορευόμην ἄξων καὶ τοὺς ἐκεῖσε ὄντας δεδεμένους εἰς Ἰερουσαλὴμ ἵνα τιμωρηθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/005.yaml
  text: as also the high priest and the whole council of elders can testify for me. From them I also received letters to the brothers in Damascus[a], and I was traveling there to bring also those who were there, bound, to Jerusalem so that they might be punished.
translation:
  language: hi
  text: जैसा कि महायाजक और बुज़ुर्गों की पूरी परिषद भी मेरे पक्ष में गवाही दे सकते हैं। उन्हीं से मैंने दमिश्क के भाइयों[a] के नाम पत्र भी लिए थे, और मैं वहाँ जा रहा था ताकि वहाँ के लोगों को भी बाँधे हुए यरूशलेम ले आऊँ, ताकि उन्हें दण्ड दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाइयों और बहनों।” यूनानी में “भाइयों” है, पर कुछ सन्दर्भों में यह शब्द व्यापक समुदाय के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: जैसा कि … भी
  rationale: यह पौलुस के कथन की पुष्टि करने वाले साक्षियों का परिचय देता है और यूनानी की तुलनात्मक-पुष्टिकारक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ ἀρχιερεὺς
  choice: महायाजक
  rationale: यह उस समय के सर्वोच्च याजकीय पद का मानक और परिचित हिन्दी नाम है।
- source_word: μαρτυρεῖ μοι
  choice: मेरे पक्ष में गवाही दे सकती है
  rationale: सन्दर्भ में दत्तिव μοι पौलुस के कथन की पुष्टि का भाव देता है; ‘गवाही दे सकती है’ उपलब्ध पुष्टिकारक साक्ष्य को स्वाभाविक हिन्दी में व्यक्त करता है। संयुक्त कर्ता को परिषद-केंद्रित सामूहिक इकाई मानकर स्त्रीलिंग क्रिया रखी गई है।
- source_word: πᾶν τὸ πρεσβυτέριον
  choice: पुरनियों की पूरी परिषद
  rationale: πρεσβυτέριον केवल वृद्ध पुरुषों को नहीं, बल्कि पुरनियों के संगठित निकाय को दर्शाता है; ‘परिषद’ इस संस्थागत अर्थ को स्पष्ट करता है।
- source_word: παρ’ ὧν
  choice: उन्हीं से
  rationale: यह महायाजक और परिषद दोनों की ओर लौटता है; ‘उन्हीं’ आधिकारिक स्रोत पर बल को सहज ढंग से व्यक्त करता है।
- source_word: ἐπιστολὰς … πρὸς τοὺς ἀδελφοὺς
  choice: भाइयों के नाम पत्र
  rationale: ἐπιστολάς का मूल अर्थ ‘पत्र’ है और πρὸς यहाँ प्राप्तकर्ताओं को सूचित करता है; आधिकारिक अनुमति का भाव प्रसंग से स्पष्ट है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: εἰς Δαμασκὸν ἐπορευόμην
  choice: मैं वहाँ जा रहा था
  rationale: अपूर्ण भूतकाल चल रही यात्रा को दर्शाता है; ‘वहाँ’ दमिश्क की ओर संकेत करता है और हिन्दी में अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: ἄξων
  choice: ले आऊँ
  rationale: गति-सूचक क्रिया के साथ भविष्यकालिक कृदन्त उद्देश्य व्यक्त करता है; यरूशलेम को वक्ता के संदर्भ-बिंदु के रूप में रखते हुए ‘ले आऊँ’ स्वाभाविक है।
- source_word: τοὺς ἐκεῖσε ὄντας δεδεμένους
  choice: वहाँ जो लोग थे, उन्हें भी बाँधकर
  rationale: यह दमिश्क में मौजूद व्यक्तियों और उन्हें बंदी अवस्था में लाने का आशय व्यक्त करता है। हिन्दी में ‘बाँधकर’ उद्देश्यगत कार्रवाई को स्वाभाविक रूप देता है, जबकि किसी विशिष्ट प्रकार की बेड़ी का अनावश्यक अनुमान नहीं लगाता।
- source_word: ἵνα τιμωρηθῶσιν
  choice: और उन्हें दण्ड दिया जाए
  rationale: ἵνα उद्देश्य बताता है और निष्क्रिय क्रिया दण्ड पाए जाने पर केंद्रित है; हिन्दी वाक्य में समन्वित उद्देश्य-खंड इस संबंध को स्पष्ट और सहज रखता है।
theological_decisions:
- issue: ἀδελφοί का ऐसा संदर्भ जिसमें व्यापक समुदाय अभिप्रेत हो सकता है
  choice: भाइयों
  alternative: भाइयों और बहनों; साथी यहूदियों
  rationale: मुख्य पाठ यूनानी के पुल्लिंग बहुवचन को बनाए रखता है और संभावित व्यापक सामुदायिक अर्थ को पादटिप्पणी में सुरक्षित रखता है; इस प्रकार किसी विशिष्ट पहचान को पाठ में अनावश्यक रूप से आरोपित नहीं किया गया।
- issue: दमिश्क में लक्षित लोगों की पहचान
  choice: वहाँ जो लोग थे
  alternative: वहाँ के विश्वासियों; वहाँ के मसीहियों
  rationale: यूनानी पाठ इस वाक्य में उन्हें किसी धार्मिक पदनाम से नहीं पुकारता। सामान्य अभिव्यक्ति मूल की अस्पष्टता बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘महायाजक’, ‘पुरनियों की परिषद’ और ‘दण्ड’ जैसे परिचित बाइबलीय-न्यायिक शब्दों के साथ वाक्य-विन्यास सहज आधुनिक हिन्दी का है।
