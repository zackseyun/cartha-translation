id: ACT.22.17
reference: Acts 22:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ προσευχομένου μου ἐν τῷ ἱερῷ γενέσθαι με ἐν ἐκστάσει
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/017.yaml
  text: And it happened to me that[a], after I had returned to Jerusalem and while I was praying in the temple, I fell into a trance[b],
translation:
  language: hi
  text: जब मैं यरूशलेम लौटने के बाद मन्दिर[a] में प्रार्थना कर रहा था, तो मेरे साथ यह हुआ कि मैं एक तंद्रा[b] में चला गया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी शब्द पूरे मन्दिर-परिसर या उसके प्रांगणों को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं।
    reason: cultural_note
  - marker: b
    text: या, “एक दर्शनात्मक अवस्था में हो गया।” यूनानी अभिव्यक्ति का शाब्दिक अर्थ “तंद्रा में होना” है; यहाँ यह सामान्य नींद नहीं, बल्कि दर्शन से जुड़ी असाधारण चेतना-अवस्था को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δέ μοι
  choice: तब ऐसा हुआ कि मैं
  rationale: यह कथात्मक सूत्र अगले अनुभव का परिचय देता है। हिन्दी में ‘तब ऐसा हुआ कि’ स्वाभाविक क्रम-संकेत देता है, जबकि ‘मैं’ से व्यक्तिगत अनुभव का भाव व्यक्त होता है।
- source_word: ὑποστρέψαντι εἰς Ἰερουσαλήμ
  choice: जब मैं यरूशलेम लौट आया
  rationale: अओरिस्ट कृदन्त मुख्य घटना से पहले पूर्ण हुई वापसी को सूचित करता है; ‘लौट आया’ उस पूर्ववर्ती घटना को सहज हिन्दी में व्यक्त करता है।
- source_word: καὶ προσευχομένου μου
  choice: और ... प्रार्थना कर रहा था
  rationale: यह पद मुख्य घटना के समय जारी समकालीन क्रिया बताता है; अपूर्ण भूतकालीन रूप उस निरन्तरता को स्पष्ट करता है।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर में
  rationale: ἱερόν पूरे मन्दिर-परिसर को सूचित कर सकता है। मुख्य पाठ में प्रचलित ‘मन्दिर’ रखा गया है और सटीकता पादटिप्पणी में स्पष्ट की गई है।
- source_word: γενέσθαι με ἐν ἐκστάσει
  choice: मैं बेसुध अवस्था में चला गया
  rationale: γίνομαι और ἐν ἐκστάσει का संयोग एक असाधारण दर्शनात्मक अवस्था में प्रवेश बताता है। ‘बेसुध अवस्था में चला गया’ आधुनिक हिन्दी में समझने योग्य है और केवल सामान्य मूर्छा कहने से बचता है।
theological_decisions:
- issue: पौलुस के अनुभव में ἔκστασις का स्वरूप
  choice: ‘बेसुध अवस्था’ कहकर दर्शनात्मक चेतना-अवस्था का संकेत
  alternative: ‘समाधि’, ‘भावावेश’ या ‘तन्द्रा’
  rationale: मूल पाठ असाधारण अवस्था की बात करता है, पर उसकी मनोवैज्ञानिक प्रक्रिया नहीं समझाता। ‘समाधि’ विशेष धार्मिक परम्पराओं का अर्थ ला सकती है, ‘भावावेश’ अत्यधिक भावनात्मक अर्थ देता है, और ‘तन्द्रा’ नींद-जैसी अवस्था का संकेत दे सकती है। पादटिप्पणी अर्थ-सीमा स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, मौखिक कथन के अनुकूल शैली रखी गई है। ‘मन्दिर’ का पारम्परिक वर्तनी-रूप अपनाया गया है। पद अगले वाक्य में जारी रहता है, इसलिए अन्त में अल्पविराम रखा गया है।
