reference: Acts 22:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἐξεχύννετο τὸ αἷμα Στεφάνου τοῦ μάρτυρός σου, καὶ αὐτὸς ἤμην ἐφεστὼς καὶ συνευδοκῶν ⸀καὶ φυλάσσων τὰ ἱμάτια τῶν ἀναιρούντων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/020.yaml
  text: And when the blood of Stephen your witness was being poured out[a], I myself was standing by and approving, and guarding the cloaks of those who were killing him.
translation:
  language: hi
  text: और जब आपके गवाह स्तिफनुस का खून बहाया जा रहा था[a], तब मैं स्वयं वहाँ खड़ा होकर सहमति दे रहा था और उसे मार डालनेवालों के कपड़ों की रखवाली कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शहीद।” यूनानी शब्द का अर्थ “गवाह” हो सकता है; मसीही प्रयोग में यह विशेष रूप से उस व्यक्ति से जुड़ गया जो अपनी गवाही के कारण मरता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεχύννετο
  choice: बहाया जा रहा था
  rationale: अपूर्णकालिक कर्मवाच्य की जारी क्रिया और खून उँडेलने/बहाने के सजीव बिंब—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: αἷμα
  choice: खून
  rationale: आधुनिक सामान्य हिन्दी में सीधा और स्वाभाविक अर्थ; यहाँ अधिक संस्कृतनिष्ठ ‘रक्त’ आवश्यक नहीं है।
- source_word: μάρτυρός
  choice: गवाह
  rationale: मूल यूनानी का प्राथमिक अर्थ ‘गवाह’ है। मृत्यु के प्रसंग में विकसित ‘शहीद’ का अर्थ प्रासंगिक है, पर उसे मुख्य पाठ पर आरोपित न करके पादटिप्पणी में रखा गया है।
- source_word: ἐφεστὼς
  choice: वहाँ खड़ा
  rationale: घटनास्थल पर उपस्थित होकर पास खड़े रहने का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: συνευδοκῶν
  choice: सहमति दे रहा था
  rationale: क्रिया सक्रिय अनुमोदन या सहमति बताती है; यह केवल निष्क्रिय उपस्थिति से अधिक भागीदारी स्पष्ट करती है।
- source_word: φυλάσσων
  choice: रखवाली कर रहा था
  rationale: कपड़ों को सँभालने और उनकी निगरानी करने की ठोस क्रिया के लिए स्वाभाविक हिन्दी।
- source_word: ἱμάτια
  choice: कपड़ों
  rationale: ἱμάτια वस्त्रों, विशेषकर बाहरी वस्त्रों, को सूचित कर सकता है; ‘कपड़े’ सामान्य पाठक के लिए स्वाभाविक है और अनावश्यक रूप से किसी खास परिधान को निश्चित नहीं करता।
- source_word: ἀναιρούντων
  choice: मार डालनेवालों
  rationale: इस प्रसंग में जान लेने का स्पष्ट अर्थ देता है, पर ‘हत्या’ जैसे अतिरिक्त न्याय-मूल्यांकन को शब्द में नहीं जोड़ता।
- source_word: αὐτὸς
  choice: मैं स्वयं
  rationale: सर्वनाम के बलाघात को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: स्तिफनुस के लिए μάρτυς का अनुवाद
  choice: गवाह
  alternative: शहीद
  rationale: यूनानी शब्द का मूल अर्थ ‘गवाह’ है, जबकि मसीही प्रयोग में यह अपनी गवाही के कारण मरनेवाले व्यक्ति से विशेष रूप से जुड़ गया। मूलार्थ मुख्य पाठ में और बाद में विकसित अर्थ पादटिप्पणी में रखने से दोनों सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आपके’ से संबोधित प्रभु के प्रति सम्मान बना रहता है। ‘खून’ और ‘कपड़े’ सामान्य आधुनिक हिन्दी के शब्द हैं; वाक्य की पुनरावृत्त क्रियाएँ मूल के जारी क्रियाभाव को व्यक्त करती हैं।
