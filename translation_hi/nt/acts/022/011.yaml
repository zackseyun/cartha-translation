    text: 'अधिक शाब्दिक रूप में: “उस ज्योति की महिमा के कारण।”'
    reason: lexical_alternative
  revision_rationale: Only the final directional verb has been adjusted. The revision keeps the source’s causal sequence and the vivid detail that Paul was led by the hand, while avoiding the extra deictic implication of “ले आए.”
