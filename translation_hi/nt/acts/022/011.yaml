id: ACT.22.11
reference: Acts 22:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὡς δὲ οὐκ ἐνέβλεπον ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου, χειραγωγούμενος ὑπὸ τῶν συνόντων μοι ἦλθον εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/011.yaml
  text: And since I could not see because of the brightness of that light[a], I came into Damascus being led by the hand by those who were with me.
translation:
  language: hi
  text: और उस ज्योति की चमक के कारण मैं देख नहीं पा रहा था,[a] इसलिए जो लोग मेरे साथ थे, वे मेरा हाथ पकड़कर मुझे दमिश्क ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “उस ज्योति की महिमा के कारण।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέβλεπον
  choice: देख नहीं पा रहा था
  rationale: अपूर्ण भूतकाल और प्रसंग मिलकर उस समय देखने की असमर्थता व्यक्त करते हैं; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀπὸ τῆς δόξης τοῦ φωτὸς ἐκείνου
  choice: उस ज्योति की चमक के कारण
  rationale: यहाँ δόξα दिखाई देने वाली प्रखर दीप्ति को सूचित करता है, जो न देख पाने का कारण थी। मुख्य पाठ में 'चमक' अर्थ स्पष्ट करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: χειραγωγούμενος
  choice: मेरा हाथ पकड़कर
  rationale: यह कृदंत हाथ से मार्ग दिखाकर ले चलने का सजीव अर्थ रखता है; हिन्दी में कर्तृवाच्य रचना अधिक स्वाभाविक है।
- source_word: ὑπὸ τῶν συνόντων μοι
  choice: जो लोग मेरे साथ थे
  rationale: यह यूनानी पद का पारदर्शी अनुवाद है और समूह के संबंध को आवश्यकता से अधिक विशिष्ट नहीं बनाता।
- source_word: ἦλθον εἰς Δαμασκόν
  choice: मुझे दमिश्क ले आए
  rationale: हाथ पकड़कर ले जाए जाने की पूर्ववर्ती क्रिया के साथ यह हिन्दी में स्वाभाविक रूप से गंतव्य तक पहुँचने को व्यक्त करता है; प्रथम पुरुष अनुभव भी बना रहता है।
- source_word: ὡς δὲ
  choice: और ... इसलिए
  rationale: यूनानी संयोजन प्रसंग को आगे बढ़ाते हुए देखने की असमर्थता और हाथ पकड़कर ले जाए जाने के बीच कारण-परिणाम संबंध व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय दर्शन के प्रसंग में δόξα का अनुवाद
  choice: चमक
  alternative: महिमा
  rationale: इस वाक्य में δόξα उस ज्योति की दिखाई देने वाली प्रखरता है जिसके कारण पौलुस देख नहीं सका। 'चमक' तत्काल भौतिक प्रभाव स्पष्ट करती है; 'महिमा' का अधिक शाब्दिक और धर्मवैचारिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'ज्योति' असाधारण प्रकाश के लिए उपयुक्त धार्मिक-साहित्यिक शब्द है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सरल है।
