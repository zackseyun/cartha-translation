  - marker: b
    text: अर्थात वे उसकी मृत्यु की माँग कर रहे थे; वैकल्पिक रूप में, “उसे जीने नहीं देना चाहिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: सुनते रहे
  rationale: अपूर्ण भूतकाल जारी रही पिछली क्रिया को दर्शाता है; यह रूप उस कालगत भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἄχρι τούτου τοῦ λόγου
  choice: इस कथन तक
  rationale: यहाँ λόγος किसी एक शब्द के बजाय पौलुस की कही हुई उस बात या कथन को सूचित करता है जिसने प्रतिक्रिया भड़काई।
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: ऊँची आवाज़ में कहने लगे
  rationale: यूनानी मुहावरा सामूहिक और तेज पुकार को व्यक्त करता है; हिन्दी में यह स्वाभाविक है और आवाज़ ऊँची करने की छवि बनाए रखता है।
- source_word: Αἶρε ἀπὸ τῆς γῆς
  choice: धरती पर से हटा दो
  rationale: शत्रुतापूर्ण आज्ञा में αἴρω का अर्थ हटाना है; γῆ के साथ यह व्यक्ति को जीवितों के बीच से मिटा देने, अर्थात उसकी मृत्यु की माँग, का संकेत देता है।
- source_word: τὸν τοιοῦτον
  choice: ऐसे आदमी को
  rationale: यह चुनाव मूल की तिरस्कारपूर्ण ध्वनि को बनाए रखता है, पर अनावश्यक रूप से बोलचाल या अपमानजनक शब्द नहीं जोड़ता।
- source_word: οὐ γὰρ καθῆκεν αὐτὸν ζῆν
  choice: उसका जीवित रहना उचित नहीं था
  rationale: καθῆκεν के 'उचित/अनुकूल होना' वाले अर्थ और भूतकालीन रूप को निकटता से बनाए रखता है; भीड़ की मृत्यु की माँग संदर्भ और पादटिप्पणी में स्पष्ट है।
