  text: वे उसकी बात इस कथन तक सुन रहे थे, और अपनी आवाज़ ऊँची करके कहने लगे, “ऐसे आदमी को धरती से हटा दो![a] क्योंकि उसका जीवित रहना उचित नहीं था।”[b]
  philosophy: optimal-equivalence
