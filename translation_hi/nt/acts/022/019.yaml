  edition: SBLGNT
  text: κἀγὼ εἶπον· Κύριε, αὐτοὶ ἐπίστανται ὅτι ἐγὼ ἤμην φυλακίζων καὶ δέρων κατὰ τὰς συναγωγὰς τοὺς πιστεύοντας ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/022/019.yaml
  text: And I said[a], ‘Lord[b], they themselves know that in every synagogue I was imprisoning and beating those who believe in you.’
translation:
  language: hi
  text: और मैंने कहा, “प्रभु, वे स्वयं जानते हैं कि मैं एक-एक आराधनालय में आप पर विश्वास करनेवालों को बंदीगृह में डालता और पीटता था।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आप पर विश्वास करनेवालों” का अर्थ “आप पर भरोसा रखनेवालों” भी हो सकता है। “एक-एक आराधनालय में” अनेक आराधनालयों में बार-बार की गई कार्रवाई को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ εἶπον
  choice: और मैंने कहा
  rationale: καὶ ἐγώ के संक्षिप्त रूप और सरल भूतकालीन कथन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यीशु को किए गए आदरसूचक संबोधन तथा उसके मसीही अर्थ-भार, दोनों को सुरक्षित रखता है।
- source_word: αὐτοὶ ἐπίστανται
  choice: वे स्वयं जानते हैं
  rationale: αὐτοὶ के स्पष्ट बल को ‘स्वयं’ द्वारा बनाए रखता है।
- source_word: ἤμην φυλακίζων καὶ δέρων
  choice: बंदीगृह में डालता और पीटता था
  rationale: परिधीय अपूर्ण भूतकाल के निरंतर अथवा बार-बार किए जानेवाले पुराने व्यवहार को हिन्दी के ‘ता था’ रूप से स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κατὰ τὰς συναγωγάς
  choice: आराधनालय-आराधनालय जाकर
  rationale: 'κατά के वितरणात्मक अर्थ को व्यक्त करता है: यह काम अनेक आराधनालयों में बार-बार किया जाता था, केवल किसी एक स्थान पर नहीं।'
- source_word: τοὺς πιστεύοντας ἐπὶ σέ
  choice: आप पर विश्वास करनेवालों को
  rationale: ἐπί + कर्मकारक द्वारा यीशु की ओर लक्षित विश्वास या भरोसे को ‘आप पर विश्वास’ के रूप में सीधे व्यक्त करता है।
theological_decisions:
- issue: यीशु को κύριος कहकर संबोधित करना
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ आदर और इस प्रसंग के मसीही अर्थ-भार को सुरक्षित रखता है, बिना पाठ से आगे बढ़े।
- issue: πιστεύοντας ἐπὶ σέ में विश्वास का स्वरूप
  choice: आप पर विश्वास करनेवाले
  alternative: आप पर भरोसा रखनेवाले
  rationale: ‘विश्वास’ मूल क्रिया का व्यापक और परिचित धार्मिक अर्थ बनाए रखता है; ‘भरोसा’ भी संभव है और टिप्पणी में दिया गया है।
- issue: पौलुस के पूर्व उत्पीड़न का क्रियापक्ष
  choice: डालता और पीटता था
  alternative: डाल रहा था और पीट रहा था
  rationale: हिन्दी का अभ्यस्त भूतकाल यहाँ यूनानी रचना के जारी और बारंबार व्यवहार को प्रसंगानुकूल अधिक स्वाभाविक ढंग से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में बोधगम्य रखी गई है। यीशु को सीधे संबोधन में आदरसूचक ‘आप’ अपनाया गया है। ‘आराधनालय-आराधनालय जाकर’ कुछ औपचारिक विकल्पों की अपेक्षा अधिक स्वाभाविक हिन्दी में यूनानी वितरणात्मक भाव व्यक्त करता है।
