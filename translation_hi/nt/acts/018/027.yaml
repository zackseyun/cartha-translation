source:
  edition: SBLGNT
  text: βουλομένου δὲ αὐτοῦ διελθεῖν εἰς τὴν Ἀχαΐαν προτρεψάμενοι οἱ ἀδελφοὶ ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν· ὃς παραγενόμενος συνεβάλετο πολὺ τοῖς πεπιστευκόσιν διὰ τῆς χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: hi
  text: जब वह अखाया जाना चाहता था, तो भाइयों[b] ने उसे प्रोत्साहित किया और शिष्यों को लिखा कि वे उसका स्वागत करें। वहाँ पहुँचने पर उसने उन लोगों की बहुत सहायता की, जिन्होंने अनुग्रह के द्वारा विश्वास किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वहाँ पहुँचने पर उसने अनुग्रह के द्वारा उन लोगों की बहुत सहायता की, जिन्होंने विश्वास किया था।” यूनानी में “अनुग्रह के द्वारा” को विश्वास करने के बजाय अपुल्लोस की सहायता के साथ भी जोड़ा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “भाइयों” से विश्वासियों का व्यापक समुदाय अभिप्रेत हो सकता है, जिसमें स्त्रियाँ भी शामिल थीं, यद्यपि यूनानी में पुल्लिंग रूप प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλομένου ... αὐτοῦ
  choice: जब वह ... जाना चाहता था
  rationale: यह अपुल्लोस की इच्छा को व्यक्त करने वाले संबंधवाचक परिस्थिति-वाक्य का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: पार होकर अखाया जाना
  rationale: यह केवल गंतव्य ही नहीं, इफिसुस से अखाया तक समुद्र पार करने की संभावित यात्रा-छटा भी बनाए रखता है।
- source_word: προτρεψάμενοι
  choice: प्रोत्साहित किया
  rationale: संदर्भ में यह सहायक और सकारात्मक आग्रह व्यक्त करता है; ‘उकसाया’ अनुचित रूप से नकारात्मक होता और ‘उपदेश दिया’ अधिक औपचारिक।
- source_word: οἱ ἀδελφοὶ
  choice: भाइयों
  rationale: यूनानी के पुल्लिंग बहुवचन रूप को मुख्य पाठ में सुरक्षित रखा गया है; व्यापक विश्वासी समुदाय की सम्भावना पादटिप्पणी में बताई गई है।
- source_word: ἔγραψαν τοῖς μαθηταῖς
  choice: शिष्यों को लिख भेजा
  rationale: यह पत्र द्वारा संदेश भेजने का स्वाभाविक हिन्दी रूप है और μαθηταῖς के लिए मानक ‘शिष्यों’ को बनाए रखता है।
- source_word: ἀποδέξασθαι αὐτόν
  choice: वे उसका स्वागत करें
  rationale: यहाँ क्रिया अनुकूलतापूर्वक ग्रहण करने और आतिथ्य देने का भाव रखती है, जिसे ‘स्वागत करें’ स्पष्ट रूप से व्यक्त करता है।
- source_word: ὃς παραγενόμενος
  choice: वहाँ पहुँचकर
  rationale: यह अपुल्लोस के आगमन के बाद होने वाली अगली क्रिया को संक्षिप्त और सहज रूप से जोड़ता है।
- source_word: συνεβάλετο πολὺ
  choice: बहुत सहायता की
  rationale: मध्यवाच्य क्रिया यहाँ पर्याप्त लाभ या सहायता पहुँचाने का अर्थ देती है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τοῖς πεπιστευκόσιν
  choice: उन लोगों ... जिन्होंने ... विश्वास किया था
  rationale: पूर्णकालिक कृदन्त उनके पहले से विश्वास में आ चुकने की स्थिति दर्शाता है; ‘विश्वास किया था’ उस पूर्वता को बनाए रखता है।
- source_word: διὰ τῆς χάριτος
  choice: अनुग्रह के द्वारा
  rationale: यह यूनानी साधनवाचक पदबंध का सीधा और धर्मशास्त्रीय रूप से संयत अनुवाद है; मूल में स्पष्ट न होने के कारण ‘परमेश्वर के’ नहीं जोड़ा गया।
theological_decisions:
- issue: διὰ τῆς χάριτος का संबंध
  choice: 'मुख्य पाठ में इसे विश्वास करने से जोड़ा गया है: ‘जिन्होंने अनुग्रह के द्वारा विश्वास किया था।’'
  alternative: 'इसे अपुल्लोस की सहायता से भी जोड़ा जा सकता है: ‘उसने अनुग्रह के द्वारा विश्वासियों की बहुत सहायता की।’'
  rationale: शब्द-क्रम और प्रसंग के अनुसार इसे विश्वास में आने से जोड़ना अधिक स्वाभाविक है, पर यूनानी वाक्य रचना दूसरे संबंध की वास्तविक सम्भावना भी रखती है; इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: 'भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अखाया’ प्रचलित बाइबलीय स्थान-नाम है। पादटिप्पणी-चिह्न उनके वास्तविक विषय से संबंधित स्थानों पर लगाए गए हैं: [b] ‘भाइयों’ के बाद और [a] अनुग्रह-वाले वाक्य के बाद।'
