  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: hi
  text: कुछ समय वहाँ बिताने के बाद, वह वहाँ से चला गया और क्रम से गलातिया के प्रदेश और फ्रूगिया से होकर जाता हुआ सभी शिष्यों को दृढ़ करता गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: कुछ समय वहाँ बिताने के बाद
  rationale: ποιέω + χρόνον समय बिताने का मुहावरा है। पिछले प्रसंग के स्थान को स्पष्ट करने के लिए स्वाभाविक हिन्दी में ‘वहाँ’ जोड़ा गया है।
- source_word: ἐξῆλθεν
  choice: वह वहाँ से चला गया
  rationale: यात्रा-वर्णन में इसका आशय किसी स्थान से प्रस्थान करना है; यह हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: διερχόμενος καθεξῆς
  choice: क्रमशः ... में घूमता हुआ
  rationale: διερχόμενος क्षेत्र से होकर यात्रा करने को और καθεξῆς लगातार क्रम में आगे बढ़ने को व्यक्त करता है। ‘क्रमशः’ स्रोत की क्रमिकता बनाए रखता है।
- source_word: τὴν Γαλατικὴν χώραν καὶ Φρυγίαν
  choice: गलातिया के प्रदेश और फ्रूगिया में
  rationale: χώρα को ‘प्रदेश’ कहना व्यापक भौगोलिक क्षेत्र का भाव सुरक्षित रखता है और उसे अनावश्यक रूप से रोमी प्रशासनिक प्रान्त तक सीमित नहीं करता।
- source_word: στηρίζων
  choice: दृढ़ करता गया
  rationale: στηρίζω का अर्थ दृढ़ या मजबूत करना है। ‘करता गया’ यात्रा के दौरान जारी क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: πάντας τοὺς μαθητάς
  choice: सभी शिष्यों को
  rationale: μαθηταί के लिए ‘शिष्य’ प्रेरितों के काम के संदर्भ में मानक और स्पष्ट शब्द है; πάντας को ‘सभी’ से सुरक्षित रखा गया है।
