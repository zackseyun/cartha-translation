lexical_decisions:
- source_word: ἐκάθισεν
  choice: वह वहाँ ... रहा
  rationale: क्रिया का शाब्दिक अर्थ ‘बैठा’ हो सकता है, पर यहाँ अवधि के साथ इसका मुहावरेदार अर्थ किसी स्थान पर बने रहना है।
- source_word: δὲ
  choice: इसलिए
  rationale: यह हल्का संयोजक है; पिछले पदों में मिले प्रभु के प्रोत्साहन के बाद पौलुस के वहाँ रहने को कथात्मक परिणाम के रूप में स्वाभाविक ढंग से जोड़ता है।
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: डेढ़ वर्ष तक
  rationale: ‘एक वर्ष और छह महीने’ की अवधि को आधुनिक हिन्दी में संक्षिप्त और ठीक अर्थ वाले रूप में व्यक्त करता है।
- source_word: διδάσκων
  choice: सिखाता रहा
  rationale: वर्तमान कृदंत उसके वहाँ रहने की पूरी अवधि के दौरान जारी शिक्षण को दर्शाता है।
- source_word: ἐν αὐτοῖς
  choice: उनके बीच
  rationale: ἐν के सामाजिक-स्थानवाचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: प्रेरितों के काम में परमेश्वर की ओर से घोषित संदेश के अर्थ और स्थापित बाइबलीय अभिव्यक्ति—दोनों को बनाए रखता है।
