reference: Acts 18:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
translation:
  language: hi
  text: परन्तु जब गल्लियो अखाया का रोमी प्रोकौंसल था, तब यहूदी[a] एकजुट होकर पौलुस के विरुद्ध उठ खड़े हुए और उसे न्यायपीठ[b] के सामने ले आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “यहूदी” से आशय पौलुस के विरुद्ध कार्रवाई करने वाले स्थानीय यहूदी समूह से है, संसार के सभी यहूदियों से नहीं।
    reason: cultural_note
  - marker: b
    text: या “न्यायासन।” यूनानी शब्द अधिकारी के उस आसन या मंच को दर्शाता है जहाँ न्यायिक निर्णय सुनाया जाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: Γαλλίωνος
  choice: गल्लियो
  rationale: यूनानी व्यक्तिवाचक नाम का हिन्दी ध्वन्यात्मक लिप्यंतरण।
- source_word: δὲ
  choice: परन्तु
  rationale: यह कथानक में नए घटनाक्रम की ओर संक्रमण के साथ हल्का विरोध भी व्यक्त करता है।
- source_word: ἀνθυπάτου ὄντος τῆς Ἀχαΐας
  choice: जब गल्लियो अखाया का रोमी प्रान्तपाल था
  rationale: सम्बन्धकारक निरपेक्ष रचना का कालसूचक अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है। 'रोमी प्रान्तपाल' पद के प्रशासनिक संदर्भ को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: κατεπέστησαν
  choice: विरुद्ध उठ खड़े हुए
  rationale: क्रिया यहाँ पौलुस के विरुद्ध शत्रुतापूर्ण कार्रवाई बताती है, पर अनिवार्य रूप से शारीरिक हिंसा नहीं; इसलिए इससे अधिक कठोर अर्थ नहीं जोड़ा गया।
- source_word: ὁμοθυμαδὸν
  choice: एकजुट होकर
  rationale: यह सामूहिक और एकमत कार्रवाई का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदी
  rationale: मूल पाठ के सीधे सामुदायिक पद को बनाए रखा गया है; प्रसंगगत स्थानीय संदर्भ को पादटिप्पणी स्पष्ट करती है।
- source_word: ἤγαγον αὐτὸν
  choice: उसे ... ले आए
  rationale: कानूनी प्रसंग में सामान्य अर्थ 'ले जाना/लाना' उपयुक्त है; मूल में निहित न होने के कारण 'घसीट लाए' जैसी कठोरता नहीं जोड़ी गई।
- source_word: ἐπὶ τὸ βῆμα
  choice: न्यायपीठ के सामने
  rationale: βῆμα यहाँ अधिकारी के न्यायिक आसन अथवा न्यायाधिकरण को सूचित करता है; 'न्यायपीठ' आधुनिक हिन्दी में कानूनी आशय स्पष्ट करता है।
theological_decisions:
- issue: संघर्ष-वर्णन में οἱ Ἰουδαῖοι का संदर्भ
  choice: यहूदी
  alternative: यहूदी अगुवे / यहूदिया के लोग
  rationale: यूनानी पाठ केवल 'यहूदी' कहता है और उसे अगुवों तक सीमित नहीं करता। फिर भी इसे सभी स्थानों और युगों के समस्त यहूदी लोगों पर लागू करने से रोकने के लिए स्थानीय प्रसंग पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। रोमी प्रशासनिक संदर्भ के लिए 'रोमी प्रान्तपाल' और न्यायिक βῆμα के लिए 'न्यायपीठ' चुना गया है।
