  text: But when they asked him to stay for a longer time[a], he did not consent,
translation:
  language: hi
  text: पर जब उन्होंने उससे और अधिक समय तक ठहरने का अनुरोध किया, तो वह सहमत नहीं हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρωτώντων
  choice: जब उन्होंने…अनुरोध किया
  rationale: वर्तमान कृदन्तयुक्त संबंधकारक निरपेक्ष रचना को स्वाभाविक कालवाचक उपवाक्य के रूप में प्रस्तुत किया गया है; प्रसंग में यह साधारण प्रश्न नहीं, ठहरने का अनुरोध है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन से हल्का विरोध और कथा में नया मोड़ दिखाता है।
- source_word: αὐτῶν
  choice: उन्होंने…उससे
  rationale: संदर्भ के अनुसार सर्वनाम इफिसुस के लोगों और पौलुस को सूचित करते हैं; हिन्दी में कर्ता और अनुरोध के लक्ष्य को स्पष्ट किया गया है।
- source_word: ἐπὶ πλείονα χρόνον
  choice: और अधिक समय तक
  rationale: यह तुलनात्मक अर्थ को बनाए रखते हुए आधुनिक हिन्दी में विस्तारित अवधि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μεῖναι
  choice: ठहरने
  rationale: यात्रा-वृत्तांत के प्रसंग में ‘ठहरना’ स्वाभाविक और सटीक है।
- source_word: οὐκ ἐπένευσεν
  choice: वह सहमत नहीं हुआ
  rationale: क्रिया अनुरोध को स्वीकार करने या उस पर सहमति देने का अर्थ रखती है; यह अनावश्यक रूप से कठोर ‘इन्कार कर दिया’ की अपेक्षा मूल की संयत अभिव्यक्ति को बनाए रखती है।
