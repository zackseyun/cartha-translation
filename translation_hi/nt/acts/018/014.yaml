source:
  edition: SBLGNT
  text: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα εἶπεν ὁ Γαλλίων πρὸς τοὺς Ἰουδαίους· Εἰ ⸀μὲν ἦν ἀδίκημά τι ἢ ῥᾳδιούργημα πονηρόν, ὦ Ἰουδαῖοι, κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: hi
  text: पर जब पौलुस बोलने ही वाला था[a], तो गल्लियो ने यहूदियों से कहा, “हे यहूदियो, यदि कोई अन्याय या दुष्ट अपराध होता[b], तो उचित ही मैं तुम्हें सह लेता[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपना मुँह खोलने ही वाला था”; यह बोलना आरम्भ करने का यूनानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: “दुष्ट अपराध” का अनुवाद “बुरा आपराधिक कृत्य” या “दुर्भावनापूर्ण अपराध” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “तो उचित ही मैं तुम्हारी बात सुनता।” शाब्दिक अर्थ “तुम्हें सहता/बरदाश्त करता” है; न्यायिक प्रसंग में इसमें उनकी शिकायत सुनने को सहना भी शामिल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος ... τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: जब पौलुस बोलने ही वाला था
  rationale: यह पदबंध निकट भविष्य में होने वाली क्रिया बताता है। यूनानी मुहावरे का शाब्दिक रूप ‘मुँह खोलना’ है, पर आधुनिक हिन्दी में ‘बोलने ही वाला था’ वही अर्थ स्वाभाविक ढंग से देता है।
- source_word: δὲ
  choice: पर
  rationale: 'यह हल्का विरोध और कथात्मक मोड़ दिखाता है: पौलुस बोलने वाला था, पर गल्लियो पहले बोल उठा।'
- source_word: Γαλλίων
  choice: गल्लियो
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: यहूदियों से
  rationale: वाणी के लक्ष्य को सीधे व्यक्त करता है; मूल में निहित न होने के कारण ‘यहूदी आरोपियों’ जैसी अतिरिक्त स्पष्टता नहीं जोड़ी गई।
- source_word: ἀδίκημά τι
  choice: किसी अन्याय
  rationale: ἀδίκημα किसी गलत काम, अन्याय या कानूनी अपराध का संकेत दे सकता है। ‘अन्याय’ इसकी व्यापकता और न्यायिक प्रसंग दोनों बनाए रखता है।
- source_word: ῥᾳδιούργημα πονηρόν
  choice: दुष्ट अपराध
  rationale: यह अभिव्यक्ति बुरे या अनैतिक आपराधिक कृत्य को दर्शाती है। ‘दुष्ट अपराध’ कानूनी और नैतिक दोनों बल सुरक्षित रखता है।
- source_word: ὦ Ἰουδαῖοι
  choice: हे यहूदियो
  rationale: सम्बोधन कण ὦ को हिन्दी के स्वाभाविक औपचारिक सम्बोधन ‘हे’ से व्यक्त किया गया है।
- source_word: κατὰ λόγον
  choice: उचित होता
  rationale: मुहावरे का अर्थ ‘उचित रूप से’ या ‘अच्छे कारण से’ है। हिन्दी वाक्य में ‘मेरे लिए उचित होता’ इसे सहजता से व्यक्त करता है।
- source_word: ἀνεσχόμην ὑμῶν
  choice: तुम्हारी बात सुनना
  rationale: मूल क्रिया का अर्थ सहना या धैर्य रखना है; न्यायिक संदर्भ में इसका आशय उनकी शिकायत सुनने को सहमत होना है। मुख्य पाठ में स्वाभाविक हिन्दी दी गई है और अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
