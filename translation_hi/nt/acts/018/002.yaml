id: ACT.18.2
reference: Acts 18:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εὑρών τινα Ἰουδαῖον ὀνόματι Ἀκύλαν, Ποντικὸν τῷ γένει, προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ διὰ τὸ ⸀διατεταχέναι Κλαύδιον χωρίζεσθαι πάντας τοὺς Ἰουδαίους ⸀ἀπὸ τῆς Ῥώμης, προσῆλθεν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: hi
  text: उसे अक्विला नाम का एक यहूदी मिला, जो मूलतः पोन्तुस का रहनेवाला था। वह अपनी पत्नी प्रिस्किल्ला के साथ हाल ही में इतालिया से आया था, क्योंकि क्लौदियुस ने सभी यहूदियों को रोम से चले जाने[a] का आदेश दिया था। और वह उनके पास गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभी यहूदियों को रोम से निकाल देने का आदेश।” यूनानी में अधिक शाब्दिक रूप से रोम से अलग होने की बात कही गई है।
    reason: χωρίζεσθαι के अपेक्षाकृत तटस्थ ‘अलग होना/चले जाना’ और प्रसंग से संभव अधिक प्रबल ‘निकाला जाना’—दोनों अर्थ-संभावनाओं को सुरक्षित रखना।
lexical_decisions:
- source_word: εὑρών
  choice: मिला
  rationale: क्रियाविशेषणीय भूतकालिक कृदन्त कथा की अगली घटना की भूमिका बाँधता है। हिंदी में ‘उसे … मिला’ सहज है और यूनानी के ‘पाया’ की अपेक्षा व्यक्ति से भेंट के प्रसंग में अधिक स्वाभाविक है।
- source_word: τινα Ἰουδαῖον
  choice: एक यहूदी
  rationale: τινα एक अनिर्दिष्ट व्यक्ति का परिचय देता है और Ἰουδαῖον यहाँ उसकी यहूदी जातीय-धार्मिक पहचान बताता है।
- source_word: ὀνόματι Ἀκύλαν
  choice: अक्विला नाम का
  rationale: व्यक्ति का नाम प्रस्तुत करने वाले यूनानी मुहावरे का स्वाभाविक आधुनिक हिंदी रूप।
- source_word: Ποντικὸν τῷ γένει
  choice: मूलतः पोन्तुस का रहनेवाला
  rationale: वाक्यांश अक्विला की भौगोलिक उत्पत्ति बताता है। यह ‘जन्म से पोन्तुसवासी’ की अपेक्षा सामान्य पाठक के लिए अधिक सहज है और जन्मस्थान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: हाल ही में इतालिया से आया था
  rationale: पूर्ण कृदन्त मुख्य कथा-घटना से पहले हुए हाल के आगमन को दिखाता है; ‘आया था’ उस पूर्वकालिक संबंध को स्पष्ट रखता है।
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: अपनी पत्नी प्रिस्किल्ला के साथ
  rationale: καί को प्रसंगानुसार ‘के साथ’ व्यक्त करने से स्पष्ट होता है कि प्रिस्किल्ला अक्विला के साथ इतालिया से आई थी।
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: क्योंकि क्लौदियुस ने … आदेश दिया था
  rationale: διά के साथ संज्ञीकृत infinitive कारण व्यक्त करता है और διατάσσω यहाँ शासकीय आदेश को सूचित करता है।
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: सभी यहूदियों को रोम से चले जाने
  rationale: χωρίζεσθαι और ἀπό रोम से अलग होने या चले जाने का भाव देते हैं। ‘चले जाने’ सहज हिंदी है और ‘निकाल दिए जाने’ जितना व्याख्यात्मक नहीं है।
- source_word: προσῆλθεν αὐτοῖς
  choice: वह उनके पास गया
  rationale: προσέρχομαι यहाँ लोगों के पास जाने को व्यक्त करता है; बहुवचन αὐτοῖς अक्विला और प्रिस्किल्ला दोनों की ओर संकेत करता है।
theological_decisions:
- issue: Ἰουδαῖον / Ἰουδαίους का अर्थ
  choice: यहूदी / यहूदियों
  alternative: यहूदिया-वासी / यहूदिया-वासियों
  rationale: यहाँ रोम में रहने वाले यहूदी समुदाय और अक्विला की जातीय-धार्मिक पहचान अभिप्रेत है, केवल यहूदिया प्रदेश के निवासी नहीं।
- issue: क्लौदियुस के आदेश की तीव्रता
  choice: रोम से चले जाने का आदेश
  alternative: रोम से निकाल दिए जाने का आदेश
  rationale: यूनानी χωρίζεσθαι मूलतः रोम से अलग होने को कहता है। आदेश के कारण निष्कासन का भाव संभव है, पर मुख्य पाठ में उसे अनिवार्य रूप से आरोपित नहीं किया गया; अधिक प्रबल अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नामों के लिए यूनानी रूपों के निकट प्रचलित हिंदी लिप्यंतरण अपनाए गए हैं। लंबे यूनानी वाक्य को पठनीय हिंदी के लिए तीन वाक्यों में बाँटा गया है, जबकि घटनाक्रम और कारण-संबंध सुरक्षित हैं। अंतिम ‘वह’ का संदर्भ प्रसंग में पौलुस है; मूल पद की तरह नाम दोहराया नहीं गया।
