  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: hi
  text: और कैसरिया में उतरकर वह ऊपर गया[a] और कलीसिया का अभिवादन किया; फिर वह नीचे अन्ताकिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ऊपर गया’ से सम्भवतः यरूशलेम की कलीसिया के पास जाना अभिप्रेत है। अनेक अनुवाद यहाँ ‘यरूशलेम’ को स्पष्ट कर देते हैं, पर यूनानी पाठ में उसका नाम नहीं है।
    reason: अन्तर्निहित गन्तव्य की सम्भावित पहचान को बताए बिना उसे मुख्य पाठ में जोड़ने से बचाना।
lexical_decisions:
- source_word: κατελθὼν
  choice: पहुँचकर
  rationale: यह भूतकालिक कृदन्त मुख्य क्रिया से पहले की घटना बताता है। हिन्दी में ‘नीचे जाकर’ अस्वाभाविक और सम्भवतः भ्रामक लगता; ‘पहुँचकर’ यात्रा-क्रम को स्वाभाविक रूप से व्यक्त करता है, यद्यपि यूनानी की दिशात्मक बारीकी कम हो जाती है।
- source_word: Καισάρειαν
  choice: कैसरिया
  rationale: स्थान-नाम का हिन्दी में प्रचलित लिप्यन्तरण; प्रसंग से समुद्रतटीय कैसरिया समझा जाता है।
- source_word: ἀναβὰς
  choice: वह ऊपर गया
  rationale: यूनानी की दिशात्मक भाषा को बनाए रखता है और गन्तव्य को अनकहा छोड़ता है; ‘यरूशलेम’ मूल पाठ में स्पष्ट रूप से नहीं है।
- source_word: ἀσπασάμενος
  choice: अभिवादन किया
  rationale: क्रिया के सामान्य अर्थ ‘नमस्कार/अभिवादन करना’ का सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: τὴν ἐκκλησίαν
  choice: कलीसिया
  rationale: प्रेरितों के काम में मसीही समुदाय के लिए हिन्दी बाइबलीय प्रयोग में स्वाभाविक और स्थापित शब्द।
- source_word: κατέβη
  choice: चला गया
  rationale: अन्ताकिया की ओर आगे की यात्रा को सहज हिन्दी में व्यक्त करता है। ‘नीचे गया’ यूनानी दिशा को अधिक औपचारिक रूप से रखता, पर आधुनिक हिन्दी में बिना स्पष्ट भूगोल के बोझिल लगता है।
- source_word: Ἀντιόχειαν
  choice: अन्ताकिया
  rationale: स्थान-नाम का स्थापित हिन्दी रूप; इस प्रसंग में सीरिया का अन्ताकिया अभिप्रेत है।
theological_decisions:
- issue: ‘ऊपर गया’ के अनकहे गन्तव्य को यरूशलेम के रूप में पहचानना
  choice: मुख्य पाठ में गन्तव्य को अनकहा रखना
  alternative: ‘वह यरूशलेम गया’ अथवा ‘वह ऊपर यरूशलेम गया’
  rationale: कैसरिया से ऊपर जाना, कलीसिया का अभिवादन करना और फिर अन्ताकिया जाना सम्भवतः यरूशलेम की ओर संकेत करता है; फिर भी यूनानी पाठ यरूशलेम का नाम नहीं लेता। इसलिए संकेत को सुरक्षित रखते हुए निष्कर्ष को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। यात्रा-क्रम स्पष्ट रखा गया है; ‘ऊपर गया’ में मूल की अर्थपूर्ण दिशात्मकता और यरूशलेम की सम्भावित ओर-सूचना सुरक्षित है।
