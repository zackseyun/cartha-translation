source:
  edition: SBLGNT
  text: Ὡς δὲ κατῆλθον ἀπὸ τῆς Μακεδονίας ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος, συνείχετο τῷ ⸀λόγῳ ὁ Παῦλος, διαμαρτυρόμενος τοῖς Ἰουδαίοις ⸀εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: hi
  text: पर जब सीलास और तीमुथियुस मकिदुनिया से नीचे आए, तो पौलुस वचन में पूरी तरह लगा हुआ था[a] और यहूदियों के सामने गंभीरता से गवाही दे रहा था कि यीशु मसीह है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वचन से विवश था” अथवा “संदेश में तल्लीन था।” यूनानी क्रिया का अर्थ किसी बात में पूरी तरह लगे होने, उससे दबाव अनुभव करने या उसके प्रति समर्पित होने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “ख्रिस्तोस।” यहाँ यह शब्द एक उपाधि के रूप में प्रयुक्त है, इसलिए इसके मसीहाई अर्थ को बनाए रखने के लिए “मसीह” अनुवाद किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: पर जब
  rationale: δέ के संक्रमणकारी संबंध और ὡς के कालवाचक अर्थ—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: मकिदुनिया से नीचे आए
  rationale: κατέρχομαι के ‘नीचे आना’ वाले यात्रा-संबंधी मुहावरे को बनाए रखता है; केवल ‘आए’ कहने से स्रोत का स्थानिक भाव खो जाता।
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: सीलास और तीमुथियुस
  rationale: τε ... καί दोनों व्यक्तियों को संयुक्त कर्ता बनाता है; हिन्दी में साधारण ‘और’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: συνείχετο
  choice: पूरी तरह ... लगा हुआ था
  rationale: अपूर्णकालिक रूप निरंतर दशा बताता है और क्रिया किसी कार्य में लगे, तल्लीन या उससे प्रेरित/विवश होने का अर्थ दे सकती है। मुख्य पाठ का चुनाव स्वाभाविक है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: τῷ λόγῳ
  choice: वचन में
  rationale: दत्तिव यहाँ उस विषय या क्षेत्र को सूचित कर सकता है जिसमें पौलुस लगा था। ‘वचन’ λόγος को पारदर्शी ढंग से रखता है और प्रेरितों के काम में सुसमाचार-संदेश के लिए प्रचलित संक्षिप्त अभिव्यक्ति है।
- source_word: διαμαρτυρόμενος
  choice: गंभीरता से गवाही दे रहा था
  rationale: διαμαρτύρομαι के बलपूर्ण और गंभीर साक्ष्य देने के भाव को व्यक्त करता है, बिना इसे केवल बहस या आग्रह तक सीमित किए।
- source_word: τοῖς Ἰουδαίοις
  choice: यहूदियों के सामने
  rationale: यहाँ Ἰουδαῖοι यहूदी समुदाय को दर्शाता है; ‘के सामने’ गवाही के श्रोताओं को सहज हिन्दी में व्यक्त करता है।
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: कि यीशु ही मसीह है
  rationale: विधेयात्मक रचना यीशु की पहचान प्रतिज्ञात मसीह के रूप में घोषित करती है। ‘ही’ पहचान के बल को स्वाभाविक हिन्दी में स्पष्ट करता है, और ‘मसीह’ पदवी का भाव बनाए रखता है।
theological_decisions:
- issue: Χριστός को पदवी के रूप में या नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यहाँ Χριστός निश्चित उपपद के साथ विधेयात्मक है और यहूदियों के सामने की गई घोषणा में प्रतिज्ञात अभिषिक्त जन की पदवी को सूचित करता है; इसलिए ‘मसीह’ उपयुक्त है।
- issue: συνείχετο में बाहरी विवशता या गहरी संलग्नता
  choice: पूरी तरह वचन में लगा हुआ था
  alternative: वचन से विवश था
  rationale: यूनानी क्रिया दोनों प्रकार का भाव दे सकती है। संदर्भ में सेवाकार्य में गहरी संलग्नता सहज है, पर बाहरी या भीतरी दबाव का अर्थ निश्चित रूप से नकारा नहीं जा सकता; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘वचन’ बाइबलीय रूप से परिचित है, पर पादटिप्पणी में ‘संदेश’ देकर उसका आशय स्पष्ट किया गया है। वाक्य स्रोत की कालगत और सहभागी संरचना को पठनीय हिन्दी में बनाए रखता है।
