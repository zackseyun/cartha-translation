  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: hi
  text: वे इफिसुस पहुँचे, और उसने उन्हें वहीं छोड़ दिया। पर वह स्वयं आराधनालय में गया और यहूदियों के साथ विचार-विमर्श किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατήντησαν
  choice: पहुँचे
  rationale: क्रिया किसी गंतव्य तक पहुँचने को दर्शाती है; ‘इफिसुस पहुँचे’ स्वाभाविक और सटीक है।
- source_word: κἀκείνους
  choice: उन दोनों को
  rationale: सर्वनाम पिछले पद में उल्लिखित प्रिस्किल्ला और अक्विला की ओर संकेत करता है। हिन्दी में द्विवचन-संदर्भ स्पष्ट करने के लिए ‘उन दोनों’ स्वाभाविक है, बिना नामों को पद में जोड़े।
- source_word: κατέλιπεν ... αὐτοῦ
  choice: वहीं छोड़ दिया
  rationale: καταλείπω और स्थानवाचक αὐτοῦ मिलकर किसी को उसी स्थान पर छोड़ने का भाव देते हैं।
- source_word: αὐτὸς δὲ
  choice: पर वह स्वयं
  rationale: 'δέ के हल्के विरोध और αὐτός के बलाघात को सुरक्षित रखता है: साथी वहीं रहे, जबकि वह स्वयं भीतर गया।'
- source_word: εἰσελθὼν εἰς τὴν συναγωγήν
  choice: आराधनालय में गया
  rationale: हिन्दी में गति और प्रवेश का स्वाभाविक संक्षिप्त रूप; συναγωγή यहाँ यहूदी आराधना-सभा के स्थान को सूचित करता है।
- source_word: διελέξατο
  choice: विचार-विमर्श किया
  rationale: यह क्रिया तर्कपूर्ण संवाद या विवेचन को दर्शाती है; यह चयन केवल उपदेश या शत्रुतापूर्ण वाद-विवाद का भाव आरोपित नहीं करता।
- source_word: τοῖς Ἰουδαίοις
  choice: यहूदियों के साथ
  rationale: समुदाय का सीधा जातीय-धार्मिक उल्लेख है; ‘अगुओं’ कहना मूल से अधिक संकीर्ण होता।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। मूल के सर्वनाम-संदर्भ को हिन्दी में स्वाभाविक बनाने के लिए ‘उन दोनों’ रखा गया है। διελέξατο के संवादात्मक और तर्कपूर्ण दोनों पहलुओं के लिए ‘विचार-विमर्श’ चुना गया है।
