source:
  edition: SBLGNT
  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: hi
  text: परन्तु आराधनालय के प्रधान क्रिस्पुस ने अपने पूरे घराने सहित प्रभु पर विश्वास किया, और बहुत-से कुरिन्थवासी सुनते हुए विश्वास कर रहे थे और बपतिस्मा पा रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार अनुवाद: “और बहुत-से कुरिन्थवासियों ने जब सुना, तब विश्वास किया और बपतिस्मा पाया।” यूनानी में ‘विश्वास कर रहे थे’ और ‘बपतिस्मा पा रहे थे’ वाले क्रिया-रूप प्रतिक्रिया को घटित होते हुए दिखाते हैं।'
    reason: मूल के वर्तमान कृदंत तथा अपूर्णकालिक क्रियाओं के पक्ष और अधिक स्वाभाविक हिन्दी के बीच अनुवाद-विकल्प बताना।
lexical_decisions:
- source_word: Κρίσπος
  choice: क्रिस्पुस
  rationale: व्यक्तिवाचक नाम का यूनानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: ἀρχισυνάγωγος
  choice: यहूदी आराधनालय का प्रधान
  rationale: आराधनालय के प्रमुख अधिकारी की भूमिका को सामान्य आधुनिक हिन्दी में स्पष्ट करता है, बिना उसके प्रशासनिक अधिकारों को अनावश्यक रूप से परिभाषित किए।
- source_word: ἐπίστευσεν τῷ κυρίῳ
  choice: प्रभु पर विश्वास किया
  rationale: विश्वास के लिए हिन्दी का स्वाभाविक प्रयोग है; κύριος को मूल पाठ के अनुसार केवल ‘प्रभु’ रखा गया है।
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: अपने पूरे घराने सहित
  rationale: οἶκος यहाँ भवन नहीं, परिवार और आश्रितों से बने घराने को दर्शाता है; ‘पूरे’ से ὅλῳ सुरक्षित रहता है।
- source_word: πολλοὶ τῶν Κορινθίων
  choice: बहुत-से कुरिन्थवासी
  rationale: अंशवाचक भाव को सहज हिन्दी में व्यक्त करता है—कुरिन्थ के लोगों में से बहुतों ने ऐसा किया।
- source_word: ἀκούοντες
  choice: सुनकर
  rationale: समकालिक कृदंत को संक्षिप्त और स्वाभाविक रूप में रखता है तथा मूल की तरह सुनी गई बात का कर्म अनकहा छोड़ता है।
- source_word: ἐπίστευον
  choice: विश्वास कर रहे थे
  rationale: अपूर्ण भूतकाल के चलते अनेक लोगों में क्रमशः घटित हो रही प्रतिक्रिया का चित्र बनाए रखता है।
- source_word: ἐβαπτίζοντο
  choice: बपतिस्मा पा रहे थे
  rationale: अपूर्ण काल के जारी/क्रमिक पक्ष और कर्मवाच्य—उनका बपतिस्मा किया जा रहा था—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘अपने पूरे घराने सहित’ में घराने के विश्वास की सीमा
  choice: वाक्य को सामूहिक रूप में यथावत रखा गया है और प्रत्येक सदस्य के विश्वास या बपतिस्मे के विषय में अलग दावा नहीं जोड़ा गया।
  alternative: यह स्पष्ट करना कि घराने के प्रत्येक व्यक्ति ने व्यक्तिगत रूप से विश्वास किया, अथवा इसे केवल घराने के मुखिया का प्रतिनिधिक विश्वास मानना।
  rationale: यूनानी पाठ क्रिस्पुस के उसके पूरे घराने सहित विश्वास करने की बात कहता है, पर व्यक्तिगत सहभागिता का स्वरूप नहीं खोलता; इसलिए साम्प्रदायिक निष्कर्ष नहीं जोड़ा गया।
- issue: ‘प्रभु’ का संदर्भ
  choice: τῷ κυρίῳ का अनुवाद ‘प्रभु पर’ किया गया है।
  alternative: ‘प्रभु यीशु पर’
  rationale: प्रेरितों के काम के प्रसंग में संकेत यीशु की ओर है, किन्तु इस पद के यूनानी पाठ में केवल κύριος है; इसलिए नाम का विस्तार नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘यहूदी आराधनालय’, ‘घराना’ और ‘बपतिस्मा पाना’ प्रचलित बाइबलीय शब्दावली हैं; क्रिया-रूपों में मूल यूनानी के क्रमिक/जारी पक्ष को यथासंभव सुरक्षित रखा गया है।
