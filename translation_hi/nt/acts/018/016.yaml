translation:
  language: hi
  text: और उसने उन्हें न्यायासन[a] से खदेड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्याय-मंच’ अथवा ‘अदालत’; यूनानी शब्द βῆμα अधिकारी के न्यायिक आसन या उस ऊँचे मंच को दर्शाता है जहाँ न्यायिक कार्यवाही होती थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य कथात्मक संयोजक है; ‘और’ बिना अतिरिक्त कारणात्मक या कालगत अर्थ जोड़े कथा को आगे बढ़ाता है।
- source_word: ἀπήλασεν
  choice: खदेड़ दिया
  rationale: ἀπελαύνω का यह रूप अधिकारपूर्वक और बलपूर्वक दूर हटाने का भाव देता है। ‘खदेड़ दिया’ नरम ‘विदा कर दिया’ की अपेक्षा इस क्रिया की तीव्रता को सुरक्षित रखता है।
- source_word: αὐτοὺς
  choice: उन्हें
  rationale: सर्वनाम का संदर्भ पिछले प्रसंग से स्पष्ट है; ‘उन्हें’ अनावश्यक रूप से पहचान को अधिक निश्चित किए बिना मूल की संदर्भगत प्रकृति बनाए रखता है।
- source_word: ἀπὸ τοῦ βήματος
  choice: न्यायासन के सामने से
  rationale: βῆμα न्यायिक कार्यवाही के आधिकारिक आसन अथवा ऊँचे मंच को दर्शाता है। प्रसंग में ἀπό उस स्थान से हटाए जाने को व्यक्त करता है; ‘के सामने से’ हिन्दी में न्यायालय के समक्ष उपस्थित लोगों को वहाँ से खदेड़े जाने का स्वाभाविक बोध देता है।
- source_word: βήματος
  choice: न्यायासन
  rationale: ‘न्यायासन’ आधिकारिक न्यायिक आसन और उससे संबद्ध अदालत—दोनों का प्रसंगानुकूल संकेत देता है। शब्द की भौतिक और संस्थागत अर्थ-सीमा को पादटिप्पणी में स्पष्ट किया गया है।
