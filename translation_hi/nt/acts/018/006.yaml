- source_word: καθαρὸς ἐγώ
  choice: मैं निर्दोष हूँ
  rationale: यहाँ καθαρός का रूपकात्मक अर्थ दोष या उत्तरदायित्व से मुक्त होना है; ‘निर्दोष’ आधुनिक हिन्दी में इसे स्पष्ट करता है।
- source_word: ἀπὸ τοῦ νῦν
  choice: अब से
  rationale: यह पौलुस की सेवकाई की दिशा में निर्णायक परिवर्तन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὰ ἔθνη
  choice: गैर-यहूदियों के पास
  rationale: इस आराधनालय-संदर्भ में ἔθνη से आशय यहूदियों से भिन्न लोगों से है; ‘गैर-यहूदी’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: πορεύσομαι
  choice: जाऊँगा
  rationale: भविष्यकालीन गति और उद्देश्य को सरल, सीधी हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘तुम्हारा खून तुम्हारे अपने सिर पर हो’ में उत्तरदायित्व का सूत्र
  choice: संदेश अस्वीकार करने के परिणामों का उत्तरदायित्व सुननेवालों पर है, पौलुस पर नहीं।
  alternative: इसे एक अधिक प्रबल शाप-वचन के रूप में समझना।
  rationale: यह कथन बाइबिल की पहरेदार और उत्तरदायित्व संबंधी भाषा की प्रतिध्वनि करता है। अनुवाद मुहावरे को बनाए रखता है, पर मूल से अधिक प्रबल शाप का भाव नहीं जोड़ता।
- issue: βλασφημούντων का लक्ष्य
  choice: ‘निन्दा करने’ में कर्म को अनिर्दिष्ट रखना।
  alternative: ‘पौलुस की निन्दा करने’ या ‘परमेश्वर की निन्दा करने’ के रूप में लक्ष्य स्पष्ट करना।
  rationale: यूनानी पाठ में प्रत्यक्ष कर्म नहीं है। इसलिए अनुवाद पौलुस, उसके संदेश या परमेश्वर के विरुद्ध कथन में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘वस्त्र’ और गंभीर प्रत्यक्ष कथन औपचारिक बाइबिलीय स्वर बनाए रखते हैं, जबकि ‘गैर-यहूदी’ प्रसंग का अर्थ स्पष्ट करता है।
