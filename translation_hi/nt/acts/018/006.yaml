source:
  edition: SBLGNT
  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: hi
  text: पर जब वे विरोध कर रहे थे और निन्दा कर रहे थे,[a] तो पौलुस ने अपने वस्त्र झाड़कर उनसे कहा, “तुम्हारा खून तुम्हारे अपने सिर पर हो![b] मैं निर्दोष हूँ। अब से मैं गैर-यहूदियों के पास जाऊँगा।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “ईशनिन्दा कर रहे थे” या “अपमानजनक बातें कह रहे थे” भी हो सकता है। यूनानी क्रिया दोनों अर्थ दे सकती है; यहाँ निन्दा का लक्ष्य स्पष्ट नहीं बताया गया है।
    reason: lexical_alternative
  - marker: b
    text: “तुम्हारा खून तुम्हारे अपने सिर पर हो” एक मुहावरा है, जिसका अर्थ है कि परिणामों का उत्तरदायित्व उन्हीं पर है।
    reason: cultural_note
  - marker: c
    text: “गैर-यहूदियों” का शाब्दिक अनुवाद “जातियों” या “राष्ट्रों” है; इस प्रसंग में इसका अर्थ यहूदियों के अलावा दूसरे लोग हैं।
    reason: lexical_alternative
