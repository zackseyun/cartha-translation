  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: hi
  text: और प्रभु ने रात में एक दर्शन के द्वारा[a] पौलुस से कहा, “मत डर, बल्कि बोलता रह और चुप मत हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक दर्शन में।” यूनानी वाक्यांश का शाब्दिक अर्थ “एक दर्शन के द्वारा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: सप्रत्यय पद यहाँ प्रकाशन में पौलुस से बोलने वाले के लिए प्रयुक्त है। ‘प्रभु’ उपाधि को बनाए रखता है और पाठ से आगे बढ़कर वक्ता को स्पष्टतः ‘यीशु’ नहीं कहता।
- source_word: ἐν νυκτὶ
  choice: रात में
  rationale: यह स्वाभाविक आधुनिक हिन्दी में यूनानी पद का कालवाचक अर्थ व्यक्त करता है।
- source_word: δι’ ὁράματος
  choice: एक दर्शन के द्वारा
  rationale: सम्बन्धकारक के साथ διά माध्यम या साधन दर्शाता है। यह अनुवाद उस अर्थ को स्पष्ट रखता है; अधिक स्वाभाविक विकल्प ‘एक दर्शन में’ पादटिप्पणी में दिया गया है।
- source_word: Μὴ φοβοῦ
  choice: मत डर
  rationale: वर्तमान निषेधात्मक आज्ञा को सीधी, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἀλλὰ λάλει
  choice: बल्कि बोलता रह
  rationale: वर्तमान आज्ञार्थक के निरंतर क्रिया-भाव को ‘बोलता रह’ स्पष्टतः व्यक्त करता है।
- source_word: καὶ μὴ σιωπήσῃς
  choice: और चुप मत हो
  rationale: निषेध को सहज हिन्दी में रखता है और ‘बोलता रह’ के साथ मूल पाठ की समानांतर चेतावनी सुरक्षित रखता है।
theological_decisions:
- issue: ‘प्रभु’ का संदर्भ
  choice: वक्ता को केवल ‘प्रभु’ कहा गया है।
  alternative: ‘प्रभु यीशु’
  rationale: यूनानी पाठ में ὁ κύριος है। प्रेरितों के काम में इसका संकेत प्रायः जी उठे यीशु की ओर होता है, पर ‘यीशु’ जोड़ना मूल पाठ से अधिक स्पष्टता लाता; इसलिए उपाधि और उसकी धर्मवैज्ञानिक गूँज यथावत रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधा, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। ‘मत डर’ और ‘चुप मत हो’ ने संबोधन की एकवचन आत्मीयता तथा आज्ञा की तत्परता बनाए रखी है।
