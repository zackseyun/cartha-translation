  text: εὐτόνως γὰρ τοῖς Ἰουδαίοις διακατηλέγχετο δημοσίᾳ ἐπιδεικνὺς διὰ τῶν γραφῶν εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/028.yaml
  text: For he powerfully refuted the Jews in public[b][a], demonstrating through the Scriptures that Jesus is the Messiah.
translation:
  language: hi
  text: क्योंकि वह सार्वजनिक रूप से यहूदियों का ज़ोरदार ढंग से खंडन करता था और शास्त्रों के द्वारा दिखाता था कि यीशु ही मसीह[b] हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि मसीह यीशु ही हैं।” यूनानी वाक्यांश को दोनों शब्द-क्रमों में व्यक्त किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “ख्रिस्तोस,” अर्थात “अभिषिक्त जन”; यहाँ यह एक उपाधि है।
    reason: alternative_reading
lexical_decisions:
- source_word: εὐτόνως
  choice: ज़ोरदार
  rationale: यह क्रिया-विशेषण तर्क की तीव्रता और प्रभावी शक्ति व्यक्त करता है। ‘ज़ोरदार खंडन’ आधुनिक हिन्दी में स्वाभाविक है और केवल ऊँची आवाज़ का अर्थ नहीं देता।
- source_word: διακατηλέγχετο
  choice: खंडन करता था
  rationale: क्रिया विरोधी दावों को पूरी तरह गलत सिद्ध करने का भाव रखती है। अपूर्ण काल की निरंतर या बार-बार होने वाली क्रिया को ‘करता था’ से व्यक्त किया गया है।
- source_word: τοῖς Ἰουδαίοις
  choice: यहूदियों का
  rationale: दत्तिव यहाँ उस समूह को दर्शाता है जिसके विरुद्ध तर्क किया जा रहा था। हिन्दी में ‘खंडन करना’ के साथ संबंधकारक प्रयोग स्वाभाविक है।
- source_word: δημοσίᾳ
  choice: सार्वजनिक रूप से
  rationale: यह खंडन के खुले, सबके सामने होने की परिस्थिति बताता है।
- source_word: ἐπιδεικνὺς
  choice: प्रमाणित करता था
  rationale: कृदंत बताता है कि शास्त्रों से साक्ष्य प्रस्तुत करना उसके खंडन का साधन था। ‘प्रमाणित’ तर्कपूर्ण प्रदर्शन का भाव देता है।
- source_word: διὰ τῶν γραφῶν
  choice: शास्त्रों के द्वारा
  rationale: διά के साथ संबंधकारक साधन को व्यक्त करता है; इसलिए शास्त्र उसके प्रमाण का माध्यम हैं।
- source_word: τὸν χριστὸν
  choice: मसीह
  rationale: यहाँ χριστός प्रतिज्ञात अभिषिक्त जन की उपाधि है; हिन्दी में ‘मसीह’ इस यहूदी-शास्त्रीय संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἰησοῦν
  choice: यीशु
  rationale: व्यक्तिनाम का मानक हिन्दी रूप।
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: कि यीशु मसीह हैं
  rationale: यूनानी कर्मकारक-सहित अनंत क्रिया-खंड का यह स्वाभाविक हिन्दी विन्यास है। मूल में विधेय और कर्ता की पहचान संबंधी संभावित उलटी प्रस्तुति को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: Χριστός का शीर्षकीय अर्थ
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस प्रसंग में शब्द नाम के अंग की तरह नहीं, बल्कि शास्त्रों में प्रतिज्ञात अभिषिक्त जन की उपाधि के रूप में प्रयुक्त है।
- issue: εἶναι τὸν χριστὸν Ἰησοῦν में पहचान-वाक्य का क्रम
  choice: यीशु मसीह हैं
  alternative: मसीह यीशु हैं
  rationale: दोनों विन्यास यूनानी अनंत क्रिया-खंड की व्याकरणिक संभावना को व्यक्त कर सकते हैं। मुख्य पाठ में अधिक स्वाभाविक हिन्दी रखी गई है और वैकल्पिक केंद्रबिंदु पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सार्वजनिक पाठ के योग्य और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘खंडन करता था’ अपूर्ण काल की जारी या अभ्यस्त क्रिया व्यक्त करता है; ‘शास्त्रों’ में मूल के बहुवचन γραφαί को बनाए रखा गया है।
