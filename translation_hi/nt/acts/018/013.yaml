  yaml_path: translation/nt/acts/018/013.yaml
  text: saying[b][a], “This man is persuading people to worship God contrary to the law.”
translation:
  language: hi
  text: वे कह रहे थे, “यह व्यक्ति लोगों को व्यवस्था[a][b] के विरुद्ध परमेश्वर की उपासना करने के लिए राज़ी कर रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “व्यवस्था के खिलाफ” अथवा “व्यवस्था का उल्लंघन करते हुए।”
    reason: lexical_alternative
  - marker: b
    text: आरोप लगाने वालों का आशय सम्भवतः यहूदी व्यवस्था से है, यद्यपि यूनानी पाठ केवल “व्यवस्था” कहता है।
    reason: cultural_note
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: वे कहने लगे, “…”
  rationale: वर्तमान कृदंत आरोप की कथित बात का परिचय देता है; हिन्दी में प्रत्यक्ष कथन के साथ यह रूप स्वाभाविक है।
- source_word: Παρὰ τὸν νόμον
  choice: व्यवस्था के विरुद्ध
  rationale: परसर्ग παρά और कर्मकारक यहाँ विरोध अथवा उल्लंघन का भाव देते हैं; यह पद कानूनी आरोप की भाषा बनाए रखता है।
- source_word: ἀναπείθει
  choice: राज़ी कर रहा है
  rationale: यह क्रिया मनाने या अपने पक्ष में करने का अर्थ देती है। वर्तमानकालीन आरोप को हिन्दी में प्रगतिशील रूप स्वाभाविक ढंग से व्यक्त करता है, और ‘बहका रहा है’ जैसा अतिरिक्त नकारात्मक भाव नहीं जोड़ता।
- source_word: οὗτος
  choice: यह आदमी
  rationale: संकेतवाचक शब्द का आरोपपूर्ण, इंगित करने वाला बल बना रहता है, पर अनावश्यक अपमानजनक भाषा नहीं आती।
- source_word: τοὺς ἀνθρώπους
  choice: लोगों को
  rationale: यहाँ पुल्लिंग बहुवचन समस्त लोगों के लिए सामान्य अर्थ में है, केवल पुरुषों के लिए नहीं।
- source_word: σέβεσθαι τὸν θεόν
  choice: परमेश्वर की उपासना करने के लिए
  rationale: इस धार्मिक संदर्भ में σέβομαι श्रद्धापूर्वक उपासना करने को दर्शाता है।
- source_word: τὸν νόμον
  choice: व्यवस्था
  rationale: यूनानी पाठ केवल ‘व्यवस्था’ कहता है; मुख्य पाठ में ‘यहूदी’ या ‘हमारी’ जोड़ना मूल की अपेक्षा अधिक स्पष्टता देना होता।
theological_decisions:
- issue: आरोप में ‘व्यवस्था’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘व्यवस्था’ रखा गया है।
  alternative: यहूदी व्यवस्था; हमारी व्यवस्था
  rationale: संदर्भ में आरोप लगाने वालों का आशय सम्भवतः यहूदी व्यवस्था है, पर यूनानी पाठ इसे स्पष्ट नहीं करता। इसलिए मूल की संयत अभिव्यक्ति मुख्य पाठ में रखी गई और सम्भावित संदर्भ पादटिप्पणी में दिया गया।
- issue: ἀνθρώπους का सामान्य अर्थ
  choice: लोगों
  alternative: पुरुषों
  rationale: यहाँ शब्द लिंग-विशेष तक सीमित नहीं, बल्कि सामान्य रूप से मनुष्यों को सूचित करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘व्यवस्था’ बाइबलीय-कानूनी संदर्भ को बनाए रखता है; ‘राज़ी कर रहा है’ मूल क्रिया का अपेक्षाकृत तटस्थ भाव सुरक्षित रखता है।
