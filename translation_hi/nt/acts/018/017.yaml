source:
  edition: SBLGNT
  text: ἐπιλαβόμενοι δὲ ⸀πάντες Σωσθένην τὸν ἀρχισυνάγωγον ἔτυπτον ἔμπροσθεν τοῦ βήματος· καὶ οὐδὲν τούτων τῷ Γαλλίωνι ⸀ἔμελεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: hi
  text: तब सबने[a] आराधनालय के प्रधान सोस्थिनेस को पकड़ लिया और न्यायपीठ के सामने उसे पीटते रहे। पर गल्लियो ने इन बातों में से किसी की परवाह नहीं की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “सबने” के स्थान पर “सब यूनानियों ने” पढ़ा जाता है। सबसे प्राचीन पाठ छोटा है और समूह की पहचान स्पष्ट नहीं करता।
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: पकड़ लिया
  rationale: यह क्रिया किसी को बलपूर्वक पकड़ लेने का भाव देती है और आगे होने वाली मारपीट के संदर्भ में स्वाभाविक है।
- source_word: πάντες
  choice: उन सबने
  rationale: मूल पाठ का सर्वसमावेशी भाव रखा गया है, पर समूह की पहचान नहीं जोड़ी गई है।
- source_word: ἀρχισυνάγωγον
  choice: आराधनालय के प्रधान
  rationale: यह शब्द आराधनालय के प्रमुख अधिकारी को दर्शाता है; यह रूप आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ἔτυπτον
  choice: पीटते रहे
  rationale: अपूर्ण भूतकाल चलती या बार-बार होती मारपीट को सूचित करता है; ‘पीटते रहे’ इस पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: न्यायपीठ के सामने
  rationale: βῆμα यहाँ न्यायिक मंच अथवा न्यायाधीश की आधिकारिक पीठ है; ‘न्यायपीठ’ कानूनी प्रसंग को स्पष्ट रखता है।
- source_word: οὐδὲν τούτων ... ἔμελεν
  choice: इनमें से किसी बात की परवाह नहीं की
  rationale: यह यूनानी मुहावरा बताता है कि ये घटनाएँ गल्लियो के लिए चिंता या सरोकार का विषय नहीं थीं।
- source_word: δέ / καί
  choice: तब / पर
  rationale: ‘तब’ कथा को आगे बढ़ाता है और ‘पर’ भीड़ की हिंसा तथा गल्लियो की उदासीनता के बीच निहित विरोध को स्वाभाविक रूप से दिखाता है।
theological_decisions:
- issue: πάντες (‘सब’) की पहचान
  choice: 'मुख्य पाठ में समूह की पहचान अनिर्दिष्ट रखी गई है: ‘उन सबने।’'
  alternative: ‘सब यूनानियों ने’ या संदर्भ के आधार पर किसी अन्य समूह की स्पष्ट पहचान
  rationale: SBLGNT के मुख्य पाठ में केवल πάντες है और उसका संज्ञात्मक संदर्भ स्पष्ट नहीं किया गया। इसलिए अनुवाद किसी समूह की पहचान आरोपित नहीं करता; पाठांतर पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘आराधनालय’ और ‘न्यायपीठ’ प्रसंग-स्पष्ट शब्द हैं; वाक्य में मूल पाठ की अनिर्दिष्ट सामूहिक पहचान और गल्लियो की उदासीनता दोनों सुरक्षित रखी गई हैं।
