  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: hi
  text: क्योंकि मैं तुम्हारे साथ हूँ, और कोई तुम्हें हानि पहुँचाने के लिए तुम पर हमला नहीं करेगा[a]; क्योंकि इस नगर में मेरे बहुत-से लोग हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई तुम्हें हानि पहुँचाने के लिए तुम पर हाथ नहीं डालेगा।”
    reason: lexical_alternative
  - marker: b
    text: “इस नगर में मेरे बहुत-से लोग हैं” का आशय संभवतः कुरिन्थ के उन बहुत-से लोगों से है जो प्रभु के हैं; इनमें वे लोग भी सम्मिलित हो सकते हैं जो आगे चलकर विश्वास करेंगे।
    reason: theological_ambiguity
lexical_decisions:
- source_word: διότι
  choice: क्योंकि
  rationale: दोनों स्थानों पर कारण बताने वाले संबंध को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: मैं तुम्हारे साथ हूँ
  rationale: यीशु की उपस्थिति के सीधे आश्वासन को सहज हिन्दी में व्यक्त करता है; ‘मैं’ मूल के स्पष्ट सर्वनाम का बल भी बनाए रखता है।
- source_word: οὐδεὶς ἐπιθήσεταί σοι
  choice: कोई तुम पर हमला नहीं करेगा
  rationale: इस प्रसंग में ἐπιτίθημι शत्रुतापूर्ण आक्रमण दर्शाता है। ‘हमला करना’ आधुनिक हिन्दी में स्वाभाविक है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: τοῦ κακῶσαί σε
  choice: तुम्हें हानि पहुँचाएगा
  rationale: आक्रमण के उद्देश्य या परिणाम को व्यापक रूप से व्यक्त करता है और शारीरिक अथवा अन्य प्रकार की हानि की संभावना को सीमित नहीं करता।
- source_word: λαός
  choice: लोग
  rationale: यहाँ प्रभु से संबंध रखने वाले व्यक्तियों के सामूहिक समूह के लिए स्वाभाविक हिन्दी बहुवचन है।
- source_word: ἐστί μοι
  choice: मेरे ... हैं
  rationale: εἰμί के साथ संबंधसूचक सम्प्रदान को हिन्दी में स्वाभाविक अधिकार-संबंध के रूप में व्यक्त करता है।
- source_word: πολὺς
  choice: बहुत-से
  rationale: लोगों की बड़ी संख्या का सीधा और सहज संकेत देता है।
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: इस नगर में
  rationale: कुरिन्थ जैसे शहरी केंद्र के लिए πόλις का उपयुक्त, गरिमापूर्ण और प्रचलित हिन्दी रूप है।
theological_decisions:
- issue: ‘इस नगर में मेरे बहुत-से लोग हैं’ का अर्थ
  choice: मुख्य पाठ मूल कथन को खुला रखते हुए कहता है कि नगर में प्रभु के बहुत-से लोग हैं।
  alternative: इसे केवल उन लोगों के लिए समझा जा सकता है जो पहले से विश्वासी हैं, या व्यापक रूप से उन लोगों के लिए भी जो आगे चलकर विश्वास करेंगे।
  rationale: वाक्य प्रभु से संबंधित लोगों की ओर संकेत करता है, पर यह स्वयं स्पष्ट नहीं करता कि वे सभी पहले से विश्वासी हैं या उनमें भावी विश्वासी भी सम्मिलित हैं। इसलिए मुख्य पाठ इस धर्मवैचारिक तनाव को हल नहीं करता; संभावित अर्थ पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली अपनाई गई है। एक व्यक्ति को संबोधित करने वाले σοῦ/σε के लिए सम्मानजनक और आज प्रचलित ‘तुम’ रूप रखा गया है। अर्धविराम दोनों कारणसूचक उपवाक्यों के संबंध को स्पष्ट करता है।
