source:
  edition: SBLGNT
  text: οὗτός τε ἤρξατο παρρησιάζεσθαι ἐν τῇ συναγωγῇ· ἀκούσαντες δὲ αὐτοῦ ⸂Πρίσκιλλα καὶ Ἀκύλας⸃ προσελάβοντο αὐτὸν καὶ ἀκριβέστερον αὐτῷ ἐξέθεντο τὴν ⸂ὁδὸν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: hi
  text: और वह आराधनालय में निडर होकर बोलने लगा। जब प्रिस्किल्ला और अक्विला ने उसे सुना, तो वे उसे अपने साथ ले गए[a] और उसे परमेश्वर का मार्ग और अधिक ठीक रीति से समझाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वे उसे अलग ले गए,’ ‘उन्होंने उसे ग्रहण किया,’ या ‘उन्होंने उसका स्वागत किया।’ यूनानी क्रिया में किसी को अपने साथ लेने के साथ-साथ उसे ग्रहण करने या उसका स्वागत करने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε
  choice: और वह
  rationale: οὗτος पिछले संदर्भ के अपुल्लोस की ओर संकेत करता है; आधुनिक हिन्दी में ‘वह’ स्वाभाविक है और τέ का हल्का संयोजक भाव ‘और’ से व्यक्त होता है।
- source_word: παρρησιάζεσθαι
  choice: निडर होकर बोलने
  rationale: क्रिया खुलेपन, आत्मविश्वास और साहस के साथ बोलने का भाव देती है; ‘निडर होकर बोलना’ सहज और अर्थपूर्ण हिन्दी है।
- source_word: ἐν τῇ συναγωγῇ
  choice: आराधनालय में
  rationale: यह यहूदी सभा और उसके उपासना-स्थल का प्रचलित हिन्दी बाइबलीय पद है।
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: जब ... ने उसे सुना
  rationale: कृदन्त का प्रसंगगत कालवाचक अर्थ स्पष्ट किया गया है; δέ का हल्का घटनाक्रमगत मोड़ हिन्दी वाक्य-प्रवाह में अलग विरोधसूचक शब्द के बिना स्वाभाविक रूप से व्यक्त होता है।
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: प्रिस्किल्ला और अक्विला
  rationale: मूल यूनानी रूपों के निकट, हिन्दी में स्पष्ट नाम-लिप्यंतरण।
- source_word: προσελάβοντο αὐτὸν
  choice: वे उसे अपने साथ ले गए
  rationale: προσλαμβάνομαι का मूल अर्थ किसी को अपने पास या साथ ग्रहण करना हो सकता है। यह चयन निजी बातचीत के प्रसंग के अनुकूल है, पर ‘अलग ले गए’ को पाठ में अनिवार्य नहीं बनाता; अन्य सम्भव अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: ἀκριβέστερον
  choice: और भी ठीक-ठीक
  rationale: तुलनात्मक रूप को ‘और भी’ से सुरक्षित रखा गया है और ‘ठीक-ठीक’ अधिक शुद्धता या सटीकता को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐξέθεντο
  choice: समझाया
  rationale: मध्यवाच्य रूप यहाँ किसी विषय को खोलकर स्पष्ट करने का अर्थ देता है; ‘समझाया’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: परमेश्वर का मार्ग
  rationale: सम्बन्धवाचक यूनानी पदबंध को निकटता से रखा गया है और उसके सम्भावित तकनीकी अथवा व्यापक धार्मिक अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
theological_decisions:
- issue: प्रिस्किल्ला और अक्विला ने अपुल्लोस के साथ क्या किया
  choice: उसे अपने साथ ले गए
  alternative: उसे अलग ले गए; उसे अपनाया या उसका स्वागत किया
  rationale: क्रिया में साथ लेने, ग्रहण करने या स्वागत करने की अर्थ-सम्भावना है। आगामी निजी व्याख्या के अनुरूप ‘अपने साथ ले गए’ चुना गया है, जबकि पाद-टिप्पणी वास्तविक शाब्दिक अस्पष्टता सुरक्षित रखती है।
- issue: ‘परमेश्वर का मार्ग’ का आशय
  choice: पाठ का व्यापक रूपक ज्यों का त्यों रखा गया
  alternative: पूर्ण मसीही शिक्षा; परमेश्वर का नैतिक मार्ग; उद्धार का संदेश
  rationale: प्रसंग इसे मसीही संदेश या जीवन-पथ से जोड़ता है, पर पद स्वयं इसका तात्पर्य विस्तार से निश्चित नहीं करता; इसलिए अनुवाद किसी एक धर्मवैज्ञानिक परिभाषा को पाठ में नहीं जोड़ता।
- issue: ‘और भी ठीक-ठीक’ का निहित मूल्यांकन
  choice: तुलनात्मक सुधार का भाव बनाए रखा गया
  alternative: अपुल्लोस की शिक्षा को पूरी तरह गलत बताना
  rationale: ἀκριβέστερον अधिक सटीक व्याख्या बताता है, पर यह आवश्यक रूप से पूर्वज्ञान को सर्वथा असत्य नहीं कहता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘आराधनालय’ तथा ‘परमेश्वर’ जैसे व्यापक रूप से पहचाने जाने वाले बाइबलीय शब्द रखे गए हैं। तुलनात्मक अर्थ और मूल की शाब्दिक अस्पष्टता सुरक्षित हैं।
