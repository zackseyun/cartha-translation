base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: hi
  text: अपुल्लोस नाम का एक यहूदी, जो सिकंदरिया का मूल निवासी था, इफिसुस पहुँचा। वह एक विद्वान[a] पुरुष था और पवित्र शास्त्रों में निपुण था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वाक्पटु”; यूनानी शब्द λόγιος का अर्थ “विद्वान” या “प्रभावशाली ढंग से बोलने वाला,” दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: यहूदी
  rationale: यहाँ यह शब्द अपुल्लोस की जातीय-धार्मिक पहचान बताता है, न कि केवल यहूदिया प्रदेश का निवासी होना।
- source_word: δέ
  choice: अलग शब्द से व्यक्त नहीं
  rationale: यह हल्का कथात्मक संक्रमण है; हिन्दी में नए पात्र के सहज परिचय और वाक्य-विन्यास से इसका कार्य स्पष्ट हो जाता है।
- source_word: τις
  choice: एक
  rationale: नए और अभी अनिर्दिष्ट पात्र का परिचय आधुनिक हिन्दी में स्वाभाविक रूप से ‘एक’ से होता है।
- source_word: Ἀπολλῶς ὀνόματι
  choice: अपुल्लोस नाम का
  rationale: किसी व्यक्ति का नाम प्रस्तुत करने का स्वाभाविक हिन्दी मुहावरा।
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: जन्म से सिकंदरिया का निवासी
  rationale: यह वाक्यांश जन्म अथवा मूल स्थान को व्यक्त करता है; यह अनुवाद आधुनिक हिन्दी में स्पष्ट है और ‘जाति’ जैसे भ्रामक शब्द से बचता है।
- source_word: ἀνὴρ
  choice: व्यक्ति
  rationale: सन्दर्भ में अपुल्लोस का पुरुष होना नाम और प्रसंग से स्पष्ट है; ‘व्यक्ति’ गुण-वर्णन के साथ सहज हिन्दी देता है, बिना स्रोत के आशय को बदलने के।
- source_word: λόγιος
  choice: विद्वान
  rationale: λόγιος का अर्थ ‘विद्वान’ या ‘वाक्पटु’ दोनों हो सकता है। पवित्र शास्त्रों में उसकी सामर्थ्य के निकट ‘विद्वान’ संदर्भानुकूल है, जबकि दूसरी सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: इफिसुस पहुँचा
  rationale: क्रिया किसी गंतव्य तक पहुँचने को बताती है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: पवित्र शास्त्रों का गहरा ज्ञान रखता था
  rationale: मुहावरेदार हिन्दी में यह पवित्र शास्त्रों के विषय में उसकी प्रबल योग्यता और दक्षता को स्पष्ट करता है।
- source_word: ταῖς γραφαῖς
  choice: पवित्र शास्त्रों
  rationale: यहूदी संदर्भ में बहुवचन γραφαί मान्य पवित्र लेखों को सूचित करता है, सामान्य लेखन को नहीं।
