language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: hi
  text: पौलुस कई और दिन वहाँ रहा। फिर उसने भाई-बहनों[a] से विदा ली और प्रिस्किल्ला तथा अक्विला के साथ जहाज़ से सीरिया के लिए रवाना हुआ। केंख्रिया में उसने अपने सिर के बाल कटवाए[b][c], क्योंकि उसने एक मन्नत मानी हुई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में शाब्दिक रूप से “भाइयों” है; यहाँ इससे विश्वासियों का समुदाय अभिप्रेत हो सकता है, जिसमें स्त्रियाँ भी शामिल थीं।
    reason: lexical_alternative
  - marker: b
    text: या, “उसने अपना सिर मुँड़वाया।” यूनानी क्रिया बाल काटने या मुँड़ाने, दोनों के अर्थ में प्रयुक्त हो सकती है।
    reason: lexical_alternative
  - marker: c
    text: कुछ व्याख्याकार बाल कटवाने और मन्नत को अक्विला से जोड़ते हैं, पर यूनानी व्याकरण सबसे स्वाभाविक रूप से पौलुस की ओर संकेत करता है। पाठ केवल “एक मन्नत” कहता है; उसे नाज़ीर की मन्नत नहीं बताता।
    reason: alternative_reading
lexical_decisions:
- source_word: προσμείνας ἡμέρας ἱκανὰς
  choice: और भी बहुत दिन वहाँ रहा
  rationale: ἔτι के साथ यह वाक्यांश पहले से जारी ठहराव की पर्याप्त अतिरिक्त अवधि बताता है। हिंदी में सहजता और संदर्भ की स्पष्टता के लिए ‘वहाँ’ जोड़ा गया है।
- source_word: τοῖς ἀδελφοῖς
  choice: भाई-बहनों
  rationale: ἀδελφοί का रूप पुल्लिंग है, पर यहाँ विश्वासियों के पूरे समुदाय का बोध होने की प्रबल संभावना है; आधुनिक हिंदी में ‘भाई-बहनों’ इस सामुदायिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀποταξάμενος
  choice: विदा ली
  rationale: मध्यवाच्य कृदंत का अर्थ किसी से विदा लेना है; ‘विदा ली’ संक्षिप्त, गरिमापूर्ण और प्रचलित हिंदी है।
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: जहाज़ से सीरिया के लिए रवाना हुआ
  rationale: ἐκπλέω समुद्री यात्रा पर निकलने को व्यक्त करता है; यह अनुवाद साधन और गंतव्य दोनों स्पष्ट करता है।
- source_word: σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: प्रिस्किल्ला तथा अक्विला के साथ
  rationale: दोनों को पौलुस के सहयात्री के रूप में सहज हिंदी वाक्य-संरचना में रखा गया है।
- source_word: κειράμενος ... τὴν κεφαλήν
  choice: अपने सिर के बाल कटवाए
  rationale: κείρω बाल काटने या मुँड़ाने, दोनों के लिए आ सकता है। ‘बाल कटवाए’ मूल की व्यापकता को ‘सिर मुँड़वाया’ की अपेक्षा बेहतर सुरक्षित रखता है।
- source_word: ἐν Κεγχρεαῖς
  choice: किंख्रिया में
  rationale: यूनानी स्थाननाम Κεγχρεαί का देवनागरी लिप्यंतरण।
- source_word: εἶχεν γὰρ εὐχήν
  choice: क्योंकि उसने एक मन्नत मानी हुई थी
  rationale: ἔχειν εὐχήν किसी मन्नत के बंधन में होने की जारी अवस्था बताता है। यह हिंदी मुहावरा उस अवस्था को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: κειράμενος का कर्ता
  choice: बाल कटवाने का कार्य पौलुस से संबद्ध किया गया है।
  alternative: कुछ व्याख्याकार इसे अक्विला से संबद्ध मानते हैं।
  rationale: पुल्लिंग एकवचन कृदंत व्याकरण की दृष्टि से मुख्य कर्ता पौलुस की ओर सबसे स्वाभाविक रूप से लौटता है, यद्यपि अक्विला की निकटता के कारण वैकल्पिक व्याख्या पादटिप्पणी में सुरक्षित है।
- issue: εὐχή की प्रकृति
  choice: सामान्य रूप से ‘एक मन्नत’
  alternative: नाज़ीर की मन्नत
  rationale: मूल पाठ मन्नत के प्रकार को निर्दिष्ट नहीं करता; इसलिए मुख्य पाठ में किसी विशेष धार्मिक विधान को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल किंतु गरिमापूर्ण कथात्मक शैली। लंबे यूनानी वाक्य को पठनीयता के लिए तीन हिंदी वाक्यों में बाँटा गया है। नामों के लिए प्रचलित बाइबलीय रूप रखे गए हैं और अनावश्यक सांप्रदायिक विशिष्टता से बचा गया है।
