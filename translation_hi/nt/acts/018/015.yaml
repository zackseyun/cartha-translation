id: ACT.18.15
reference: Acts 18:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: hi
  text: लेकिन यदि ये किसी बात[a], नामों और तुम्हारी अपनी व्यवस्था के विषय में प्रश्न हैं, तो तुम स्वयं ही इन्हें निपटाओ; मैं इन बातों का न्यायाधीश बनना नहीं चाहता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संदेश” या “शिक्षा।” यूनानी शब्द λόγος का अर्थ व्यापक है और यहाँ उसका सटीक आशय स्पष्ट नहीं है।
    reason: λόγος के ‘बात’ से अधिक विशिष्ट संभावित अर्थों को दिखाते हुए मुख्य पाठ में उसकी अस्पष्टता बनाए रखना।
lexical_decisions:
- source_word: ζητήματα
  choice: विवाद
  rationale: यह शब्द जाँच या बहस के अधीन प्रश्नों अथवा विवादित मामलों को दर्शाता है। प्रसंग में आरोपों के विवादास्पद स्वरूप को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘विवाद’ चुना गया है।
- source_word: περὶ λόγου
  choice: वचन के विषय में
  rationale: λόγος का अर्थ व्यापक है—वचन, बात, संदेश या शिक्षा। ‘वचन’ स्रोत की संक्षिप्तता और अर्थगत अस्पष्टता को अपेक्षाकृत बनाए रखता है; संभावित अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: ὀνομάτων
  choice: नामों
  rationale: बहुवचन का सीधा अनुवाद है और यह स्पष्ट नहीं करता कि किन नामों या उपाधियों की बात है।
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: तुम्हारी अपनी व्यवस्था
  rationale: यह अभिव्यक्ति उस व्यवस्था को संबोधित पक्षों से संबंधित बताती है और रोमी अधिकार-क्षेत्र से गल्लियो की दूरी को प्रकट करती है।
- source_word: ὄψεσθε αὐτοί
  choice: तुम स्वयं ही इन्हें निपटाओ
  rationale: भविष्यत् मध्यम रूप यहाँ मुहावरेदार आदेश या दायित्व के अर्थ में ‘स्वयं देख लेना/निपटाना’ व्यक्त करता है। ‘स्वयं ही’ αὐτοί के बल को बनाए रखता है।
- source_word: κριτὴς
  choice: न्यायी
  rationale: कानूनी प्रसंग में निर्णय करने वाले व्यक्ति का अर्थ है। ‘न्यायी’ dignified और स्पष्ट है।
- source_word: οὐ βούλομαι εἶναι
  choice: नहीं बनना चाहता
  rationale: यह वक्ता की इच्छा या अनिच्छा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना इसे स्रोत से अधिक औपचारिक अस्वीकृति बनाए।
theological_decisions:
- issue: λόγος का आशय
  choice: मुख्य पाठ में ‘वचन’ रखकर अर्थ को व्यापक छोड़ा गया।
  alternative: बात, संदेश, शिक्षा या सिद्धांत
  rationale: गल्लियो जिन यहूदी आंतरिक मुद्दों को अस्वीकार करता है, उनमें λόγος का ठीक आशय पाठ स्पष्ट नहीं करता। किसी खास धर्मशिक्षा या संदेश को निश्चित कर देना स्रोत की वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कानूनी प्रसंग के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज भाषा। ‘व्यवस्था’ को धार्मिक कानून के अर्थ में रखा गया है और ‘तुम स्वयं ही’ में गल्लियो की दूरी तथा बल दोनों व्यक्त किए गए हैं।
