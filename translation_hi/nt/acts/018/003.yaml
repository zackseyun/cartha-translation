source:
  edition: SBLGNT
  text: καὶ διὰ τὸ ὁμότεχνον εἶναι ἔμενεν παρ’ αὐτοῖς καὶ ⸀ἠργάζετο, ἦσαν γὰρ σκηνοποιοὶ ⸂τῇ τέχνῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/003.yaml
  text: And because he was of the same trade[a], he stayed with them and worked, for they were tentmakers by trade.
translation:
  language: hi
  text: और एक ही कारीगरी करने के कारण पौलुस उनके साथ रहा और काम करता रहा, क्योंकि पेशे से वे तंबू बनाने वाले[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “चमड़े का काम करने वाले”; यूनानी शब्द तंबू बनाने वालों या उससे जुड़ी व्यापक कारीगरी करने वालों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: एक ही कारीगरी करने के कारण
  rationale: διά के साथ संज्ञीकृत infinitive कारण व्यक्त करता है। ὁμότεχνος का अर्थ समान कारीगरी या पेशा करने वाला है; यह रूप हिंदी में कारण और साझा व्यवसाय दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: उनके साथ रहा
  rationale: μένω यहाँ उनके साथ ठहरने या रहने का बोध देता है। कथा-संदर्भ में यह सरल और स्वाभाविक हिंदी है।
- source_word: ἠργάζετο
  choice: काम करता रहा
  rationale: ἐργάζομαι यहाँ हस्तशिल्प अथवा पेशे का काम करने को दर्शाता है। अपूर्ण भूतकाल की निरंतरता को 'करता रहा' से स्पष्ट किया गया है।
- source_word: σκηνοποιοὶ
  choice: तंबू बनाने वाले
  rationale: शब्द का पारंपरिक और सबसे संभावित अर्थ तंबू बनाने वाले कारीगर है। चमड़े का काम करने वालों का व्यापक अर्थ संभव होने के कारण उसे पादटिप्पणी में रखा गया है।
- source_word: τῇ τέχνῃ
  choice: पेशे से
  rationale: τέχνη कारीगरी, हुनर या व्यवसाय को सूचित करता है। यहाँ दत्तिव को 'पेशे से' कहना स्वाभाविक रूप से स्पष्ट करता है कि यह उनका व्यवसाय था।
