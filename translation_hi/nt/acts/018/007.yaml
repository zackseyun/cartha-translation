  text: καὶ μεταβὰς ἐκεῖθεν ⸀εἰσῆλθεν εἰς οἰκίαν τινὸς ὀνόματι ⸀Τιτίου Ἰούστου σεβομένου τὸν θεόν, οὗ ἡ οἰκία ἦν συνομοροῦσα τῇ συναγωγῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: hi
  text: वहाँ से निकलकर वह तीतुस यूसतुस नाम के एक व्यक्ति के घर में प्रवेश किया, जो परमेश्वर की उपासना करता था[a]। उसका घर आराधनालय से सटा हुआ था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो परमेश्वर का भय मानता था” अथवा “परमेश्वर का उपासक था।” यूनानी अभिव्यक्ति ऐसे गैर-यहूदी व्यक्ति का वर्णन करती है जो इस्राएल के परमेश्वर के प्रति भक्त था।
    reason: lexical_alternative
  - marker: b
    text: या, “आराधनालय के बिल्कुल पास था” अथवा “आराधनालय से उसकी सीमा मिलती थी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: वह वहाँ से चला गया
  rationale: अओरिस्ट कृदंत और स्थानवाचक क्रियाविशेषण पहले स्थान से हटकर जाने को बताते हैं; यह हिंदी में स्वाभाविक रूप से घटनाक्रम को व्यक्त करता है।
- source_word: εἰσῆλθεν εἰς οἰκίαν
  choice: घर गया
  rationale: शाब्दिक अर्थ ‘घर में प्रवेश किया’ है, पर इस प्रसंग में ‘घर गया’ सहज हिंदी है और भीतर जाने का भाव बनाए रखता है।
- source_word: τινὸς ὀνόματι Τιτίου Ἰούστου
  choice: तीतुस यूसतुस नाम के एक व्यक्ति
  rationale: अनिश्चित सर्वनाम और ὀνόματι का स्वाभाविक हिंदी रूप; यूनानी नामों का देवनागरी लिप्यंतरण किया गया है।
- source_word: σεβομένου τὸν θεόν
  choice: जो परमेश्वर की उपासना करता था
  rationale: σέβομαι यहाँ इस्राएल के परमेश्वर के प्रति भक्ति और उपासना का संकेत देता है। वर्णनात्मक अनुवाद किसी अर्ध-पारिभाषिक सामाजिक श्रेणी को अनावश्यक रूप से नहीं थोपता।
- source_word: συνομοροῦσα
  choice: सटा हुआ था
  rationale: यह शब्द साथ लगी सीमा या बिल्कुल पास लगे होने को व्यक्त करता है; ‘सटा हुआ’ संक्षिप्त, स्पष्ट और वर्तमान हिंदी में स्वाभाविक है।
- source_word: συναγωγῇ
  choice: आराधनालय
  rationale: प्रेरितों के काम के यहूदी संदर्भ में συναγωγή के लिए प्रचलित और समझने योग्य हिंदी पद।
theological_decisions:
- issue: तीतुस यूसतुस के लिए σεβόμενος τὸν θεόν का वर्णन
  choice: जो परमेश्वर की उपासना करता था
  alternative: जो परमेश्वर का भय मानता था; परमेश्वर का उपासक
  rationale: यूनानी पाठ उसकी इस्राएल के परमेश्वर के प्रति भक्ति स्पष्ट करता है, पर उसे मुख्य पाठ में किसी निश्चित अर्ध-पारिभाषिक वर्ग का नाम देना आवश्यक नहीं है।
- issue: सυναγωγή का संदर्भगत अर्थ
  choice: आराधनालय
  alternative: सभा-घर; यहूदी आराधनालय
  rationale: प्रसंग से यहूदी आराधनास्थल स्पष्ट है; ‘यहूदी’ जोड़ना अर्थ को स्पष्ट कर सकता है, पर मूल में अलग से उपस्थित न होने के कारण मुख्य पाठ में आवश्यक नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल किंतु गरिमापूर्ण कथात्मक रूप रखा गया है। लंबे यूनानी संबंधवाचक वाक्य को स्पष्टता के लिए दो हिंदी वाक्यों में बाँटा गया है।
