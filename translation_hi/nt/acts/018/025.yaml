source:
  edition: SBLGNT
  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: hi
  text: इस व्यक्ति को प्रभु के मार्ग की शिक्षा मिली थी। वह आत्मा में उत्साही था[a] और यीशु के विषय में ठीक-ठीक बोलता और सिखाता था; वह केवल यूहन्ना के बपतिस्मे को जानता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र आत्मा में उत्साही।” यूनानी अभिव्यक्ति अपुल्लोस की अपनी आत्मा अथवा पवित्र आत्मा, दोनों की ओर संकेत कर सकती है।
    reason: वैकल्पिक अर्थ और धर्मवैचारिक तनाव को सुरक्षित रखना।
lexical_decisions:
- source_word: κατηχημένος
  choice: शिक्षा मिली थी
  rationale: पूर्ण निष्क्रिय कृदंत पहले मिली शिक्षा और उसके बने हुए परिणाम को व्यक्त करता है; यह सहज हिन्दी है और बाद की तकनीकी कलीसियाई शब्दावली नहीं जोड़ती।
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: प्रभु के मार्ग
  rationale: ‘मार्ग’ के आरम्भिक मसीही मुहावरे को बनाए रखते हुए यूनानी संबंध-रचना का स्वाभाविक हिन्दी रूप देता है।
- source_word: ζέων τῷ πνεύματι
  choice: आत्मा में उत्साह से भरा हुआ
  rationale: ζέων के उबलते या प्रज्वलित उत्साह का भाव स्वाभाविक हिन्दी में व्यक्त होता है। ‘आत्मा’ मनुष्य की भीतरी आत्मा अथवा पवित्र आत्मा—दोनों की सम्भावना खुली रखता है।
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: बोलता और सिखाता था
  rationale: दोनों अपूर्णकालीन क्रियाओं की निरन्तर अथवा अभ्यस्त गतिविधि हिन्दी के ‘ता था’ रूप से व्यक्त होती है।
- source_word: ἀκριβῶς
  choice: ठीक-ठीक
  rationale: यह शिक्षण की शुद्धता और सटीकता को सरल, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: यीशु के विषय में
  rationale: व्यापक यूनानी अभिव्यक्ति को बिना अनावश्यक विस्तार या अर्थ-संकुचन के स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: हालाँकि वह केवल यूहन्ना के बपतिस्मे को जानता था
  rationale: संदर्भ में कृदंत अपुल्लोस के सही शिक्षण के बावजूद उसके ज्ञान की सीमा बताता है; ‘हालाँकि’ इस निहित विरोध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ζέων τῷ πνεύματι में τῷ πνεύματι का आशय
  choice: मुख्य पाठ में ‘आत्मा में’, जो भीतरी उत्साह के अर्थ को स्वीकार करते हुए व्याकरणिक अस्पष्टता बनाए रखता है
  alternative: ‘पवित्र आत्मा से उत्साह से भरा हुआ’ अथवा पवित्र आत्मा के स्पष्ट संदर्भ के रूप में समझना
  rationale: यूनानी पाठ यह निश्चित नहीं करता कि यहाँ अपुल्लोस की अपनी आत्मा अभिप्रेत है या पवित्र आत्मा। इसलिए मुख्य पाठ किसी एक अर्थ को निर्णायक नहीं बनाता और टिप्पणी में विकल्प स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘बपतिस्मा’ परिचित बाइबलीय शब्द के रूप में रखा गया है।
