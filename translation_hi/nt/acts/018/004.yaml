  text: διελέγετο δὲ ἐν τῇ συναγωγῇ κατὰ πᾶν σάββατον, ἔπειθέν τε Ἰουδαίους καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/004.yaml
  text: And he was reasoning in the synagogue every Sabbath and persuading Jews and Greeks[a][b][c].
translation:
  language: hi
  text: वह हर सब्त आराधनालय में तर्कपूर्ण चर्चा करता था[a] और यहूदियों तथा यूनानियों को राज़ी करने का प्रयास करता था[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विचार-विमर्श करता था” अथवा “बहस करता था।” यूनानी क्रिया तर्कपूर्ण संवाद या वाद-विवाद, दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “राज़ी करता था” अथवा “समझाता था।” यूनानी अपूर्ण भूतकाल लगातार या बार-बार किए जा रहे कार्य या प्रयास पर बल दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात सम्भवतः आराधनालय से जुड़े यूनानी; कुछ लोग इसे अधिक व्यापक अर्थ में “गैर-यहूदी” समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: διελέγετο
  choice: तर्क-वितर्क करता था
  rationale: यह क्रिया विचारपूर्ण संवाद, चर्चा या तर्क प्रस्तुत करने का भाव रखती है। अपूर्ण भूतकाल का रूप बार-बार होने वाली गतिविधि को दर्शाता है; इसलिए ‘करता था’ उपयुक्त है।
- source_word: δὲ
  choice: अलग से अनूदित नहीं
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है। हिन्दी में प्रसंग का प्रवाह बिना अतिरिक्त ‘और’ या ‘परन्तु’ के अधिक स्वाभाविक है।
- source_word: ἐν τῇ συναγωγῇ
  choice: आराधनालय में
  rationale: ἐν स्थानवाचक है। इस प्रसंग में συναγωγή यहूदी आराधनालय को सूचित करता है; ‘आराधनालय’ आधुनिक हिन्दी में प्रचलित और सहज है।
- source_word: κατὰ πᾶν σάββατον
  choice: हर सब्त के दिन
  rationale: κατά और πᾶν का वितरणात्मक अर्थ प्रत्येक सब्त पर होने वाली नियमित गतिविधि को व्यक्त करता है।
- source_word: ἔπειθέν
  choice: समझाने का प्रयास करता था
  rationale: πείθω का आशय किसी को तर्क द्वारा सहमत या आश्वस्त करना है। अपूर्ण भूतकाल चल रहे प्रयत्न को उभार सकता है और यह आवश्यक नहीं बताता कि सभी वास्तव में सहमत हो गए।
- source_word: τε
  choice: और
  rationale: τε पिछले कथन को अगले कार्य से सहज रूप से जोड़ता है; हिन्दी में ‘और’ इसका स्वाभाविक रूप है।
- source_word: Ἰουδαίους
  choice: यहूदियों
  rationale: यह शब्द यहाँ यहूदियों को जातीय-धार्मिक समुदाय के रूप में सूचित करता है, न कि केवल यहूदिया के निवासियों को।
- source_word: Ἕλληνας
  choice: यूनानियों
  rationale: मूल पाठ विशिष्ट रूप से ‘यूनानियों’ कहता है। इसे व्यापक ‘गैर-यहूदी’ या अधिक विशिष्ट ‘परमेश्वर का भय मानने वाले यूनानी’ बनाना पाठ से अधिक कहना होगा।
theological_decisions:
- issue: आराधनालय के प्रसंग में Ἕλληνας की पहचान
  choice: यूनानियों
  alternative: गैर-यहूदियों; परमेश्वर का भय मानने वाले यूनानियों
  rationale: संभव है कि ये आराधनालय से जुड़े गैर-यहूदी रहे हों, पर पद उन्हें केवल ‘यूनानी’ कहता है। अनुवाद उसी व्यापकता और अस्पष्टता को बनाए रखता है।
- issue: ἔπειθέν में सफलता या जारी प्रयास
  choice: समझाने का प्रयास करता था
  alternative: समझाता था; सहमत करता था
  rationale: अपूर्ण भूतकाल जारी या बार-बार किए गए कार्य को दर्शाता है। यह अनिवार्य रूप से यह दावा नहीं करता कि प्रत्येक श्रोता सहमत हो गया; पादटिप्पणी अधिक प्रत्यक्ष विकल्प भी सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सब्त’ और ‘आराधनालय’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं, जबकि क्रियाओं को स्वाभाविक हिन्दी में व्यक्त किया गया है।
