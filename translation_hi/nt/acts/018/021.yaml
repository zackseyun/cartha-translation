source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἀποταξάμενος καὶ⸃ ⸀εἰπών· ⸀Πάλιν ἀνακάμψω πρὸς ὑμᾶς τοῦ θεοῦ θέλοντος ἀνήχθη ἀπὸ τῆς Ἐφέσου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/021.yaml
  text: but after taking leave and saying[a], “I will return to you again[b], if God wills,” he set sail from Ephesus.
translation:
  language: hi
  text: परन्तु विदा लेते हुए उसने कहा[a], “यदि परमेश्वर चाहे, तो मैं फिर तुम्हारे पास लौटूँगा।”[b] फिर वह इफिसुस से जहाज़ पर रवाना हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में ‘और उसने कहा, “यदि परमेश्वर चाहे, तो मैं फिर तुम्हारे पास लौटूँगा”’ नहीं है।
    reason: textual_variant
  - marker: b
    text: या, “परमेश्वर की इच्छा हुई तो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: परन्तु
  rationale: यह पिछले पद में अधिक समय ठहरने के आग्रह के विपरीत पौलुस के निर्णय को दिखाता है; ‘परन्तु’ गरिमापूर्ण और स्वाभाविक विरोधसूचक है।
- source_word: ἀποταξάμενος
  choice: विदा लेते हुए
  rationale: अओरिस्ट मध्यवाच्य कृदन्त विदा लेने की क्रिया बताता है। यह हिन्दी में स्वाभाविक रहते हुए मुख्य क्रिया से पहले की सहायक क्रिया को बनाए रखता है।
- source_word: καὶ εἰπών
  choice: उसने कहा
  rationale: यूनानी के दूसरे कृदन्त को सहज हिन्दी वाक्य-रचना में व्यक्त किया गया है; कथन का कर्ता वही है जो आगे जहाज़ से रवाना होता है।
- source_word: Πάλιν
  choice: फिर
  rationale: यह पुनः लौटने का सामान्य क्रियाविशेषण है और आधुनिक हिन्दी में ‘लौटूँगा’ के साथ स्वाभाविक लगता है।
- source_word: ἀνακάμψω
  choice: मैं ... लौटूँगा
  rationale: भविष्यकालीन क्रिया वापस आने को व्यक्त करती है; ‘लौटूँगा’ लूका की यात्रा-कथा के लिए स्पष्ट और उपयुक्त है।
- source_word: πρὸς ὑμᾶς
  choice: तुम्हारे पास
  rationale: πρός और कर्मकारक यहाँ व्यक्तियों की ओर लौटने की दिशा बताते हैं; हिन्दी में ‘तुम्हारे पास’ इसका स्वाभाविक रूप है।
- source_word: τοῦ θεοῦ θέλοντος
  choice: यदि परमेश्वर चाहे
  rationale: यह संबंधकारक निरपेक्ष रचना परमेश्वर की इच्छा पर निर्भरता व्यक्त करती है। यह रूप शर्त को स्पष्ट रखता है और ‘परमेश्वर’ को ‘प्रभु’ से नहीं बदलता।
- source_word: ἀνήχθη
  choice: जहाज़ पर रवाना हो गया
  rationale: यात्रा-वृत्तान्त में ἀνάγω का समुद्री अर्थ जहाज़ से प्रस्थान करना है; शाब्दिक ‘ऊपर ले जाया गया’ यहाँ उपयुक्त नहीं है।
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: इफिसुस से
  rationale: यह नगर से प्रस्थान का सीधा संकेत है; ‘इफिसुस’ Ἔφεσος का प्रचलित हिन्दी रूप है।
theological_decisions:
- issue: पौलुस की यात्रा-योजना और परमेश्वर की इच्छा
  choice: यदि परमेश्वर चाहे
  alternative: परमेश्वर की इच्छा हुई तो
  rationale: यूनानी पाठ स्पष्ट रूप से τοῦ θεοῦ θέλοντος कहता है। अनुवाद पौलुस की योजना को परमेश्वर की इच्छा पर निर्भर रखता है और पाठ में न आए ‘प्रभु’ को सम्मिलित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। कृदन्तों की यूनानी शृंखला को हिन्दी में सहज बनाया गया है, जबकि विदाई, कथन और समुद्री प्रस्थान का क्रम सुरक्षित रखा गया है।
