base_translation:
  language: en
  yaml_path: translation/nt/acts/009/016.yaml
  text: For I will show him how much he must suffer for my name[a].
translation:
  language: hi
  text: क्योंकि मैं स्वयं उसे दिखाऊँगा कि मेरे नाम के लिए[a] उसे कितना दुःख उठाना होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मेरे नाम की खातिर’।
    reason: ὑπέρ τοῦ ὀνόματός μου यहाँ उसके नाम के कारण अथवा उसकी खातिर सहने का भाव दे सकता है; यह विकल्प उस सूक्ष्मता को स्वाभाविक हिन्दी में व्यक्त करता है।
lexical_decisions:
- source_word: ἐγὼ
  choice: मैं स्वयं
  rationale: स्पष्ट प्रथम-पुरुष सर्वनाम का बल दिखाने के लिए ‘स्वयं’ जोड़ा गया है; हिन्दी में केवल क्रिया से भी कर्ता स्पष्ट होता, इसलिए यह रूप मूल के जोर को स्वाभाविक ढंग से बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार बताता है। आधुनिक हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑποδείξω
  choice: दिखाऊँगा
  rationale: क्रिया का अर्थ दिखाना, संकेत करना या ज्ञात कराना हो सकता है; ‘दिखाऊँगा’ सीधा और सहज समतुल्य है।
- source_word: αὐτῷ
  choice: उसे
  rationale: दत्तिव अप्रत्यक्ष कर्म का स्वाभाविक हिन्दी रूप।
- source_word: ὅσα
  choice: कितना
  rationale: δεῖ और infinitive के साथ यह दुःख की मात्रा या व्यापकता व्यक्त करता है; ‘कितना’ हिन्दी में इसे स्वाभाविक रूप से दर्शाता है।
- source_word: δεῖ
  choice: होगा
  rationale: ‘उसे ... उठाना होगा’ आवश्यकता को स्पष्ट रखता है, पर उसे नियति या पूर्वनियुक्ति के अधिक मजबूत कथन में नहीं बदलता।
- source_word: ὑπὲρ
  choice: के लिए
  rationale: यहाँ कारण, हित या खातिर का भाव संभव है। ‘के लिए’ पर्याप्त व्यापक है; निकट अर्थवाले विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: τοῦ ὀνόματός μου
  choice: मेरे नाम
  rationale: ‘नाम’ को अक्षरशः बनाए रखने से व्यक्ति, अधिकार और उससे जुड़ी सार्वजनिक निष्ठा की बाइबिलीय अर्थ-समृद्धि सुरक्षित रहती है।
- source_word: παθεῖν
  choice: दुःख उठाना
  rationale: πάσχω का सामान्य अर्थ दुःख सहना है। ‘दुःख उठाना’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: δεῖ द्वारा व्यक्त आवश्यकता का स्वरूप
  choice: उसे ... उठाना होगा
  alternative: उसके लिए ... उठाना आवश्यक है; उसके भाग्य में ... उठाना है
  rationale: मूल पाठ आवश्यकता बताता है, लेकिन इसी वाक्य में यह तय नहीं करता कि वह तार्किक, ईश्वरीय-प्रबंध संबंधी या स्पष्ट रूप से पूर्वनिर्धारित आवश्यकता है। चुना हुआ रूप इस तनाव को बनाए रखता है और अधिक नियतिवादी अर्थ नहीं जोड़ता।
- issue: ‘मेरे नाम’ के लिए दुःख उठाने का संबंध
  choice: मेरे नाम के लिए
  alternative: मेरे नाम की खातिर; मेरे नाम की ओर से
  rationale: ὑπέρ कारण, खातिर या प्रतिनिधिक हित की छाया रख सकता है। मुख्य पाठ व्यापक अभिव्यक्ति रखता है और संभावित सूक्ष्मताओं को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘मैं स्वयं’ मूल के स्पष्ट ἐγώ का बल रखता है, और ‘दुःख उठाना होगा’ आवश्यकता को स्वाभाविक हिन्दी में व्यक्त करता है।
