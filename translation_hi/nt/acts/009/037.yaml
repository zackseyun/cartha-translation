  text: ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἀσθενήσασαν αὐτὴν ἀποθανεῖν· λούσαντες δὲ ⸂ἔθηκαν αὐτὴν⸃ ἐν ὑπερῴῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/037.yaml
  text: In those days it happened that she became sick and died. After washing her[a], they laid her in an upstairs room.
translation:
  language: hi
  text: उन दिनों ऐसा हुआ कि वह बीमार पड़ी और मर गई। उसे धोने के बाद उन्होंने उसे ऊपर की मंज़िल के एक कमरे में रख दिया।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “ऊपरी कमरे में।” यूनानी में केवल ऊपर की मंज़िल पर स्थित एक कमरे का सामान्य उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ऐसा हुआ कि
  rationale: यह प्रेरितों के काम में घटनाक्रम आरम्भ करने वाला स्वाभाविक कथात्मक सूत्र है; हिंदी में यह मूल की भूमिका को सहज ढंग से व्यक्त करता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ हल्का कथात्मक संयोजक है। पहले वाक्य में इसे अलग शब्द से व्यक्त करना आवश्यक नहीं, जबकि दूसरे खंड में 'तब' घटनाक्रम को स्वाभाविक रूप से आगे बढ़ाता है।
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: उन दिनों
  rationale: मूल समय-सूचक पदबंध का निकट और प्रचलित हिंदी रूप।
- source_word: ἀσθενήσασαν
  choice: बीमार पड़ी
  rationale: यह बीमारी के आरम्भ और उसके बाद हुई मृत्यु का क्रम स्पष्ट तथा स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἀποθανεῖν
  choice: मर गई
  rationale: ग्रीक में infinitive होने पर भी ἐγένετο की रचना का स्वाभाविक हिंदी रूप सीमित क्रिया है।
- source_word: λούσαντες
  choice: उसके शरीर को धोया
  rationale: संदर्भ में मृत्यु के बाद शरीर धोना अभिप्रेत है; 'शरीर' जोड़ने से हिंदी में आशय स्पष्ट होता है, बिना किसी अतिरिक्त संस्कार का संकेत दिए।
- source_word: ἔθηκαν αὐτὴν
  choice: उसे ... रख दिया
  rationale: τίθημι का सामान्य अर्थ यहाँ शव को किसी स्थान पर रखना है; 'रख दिया' आधुनिक और प्रसंगानुकूल है।
- source_word: ἐν ὑπερῴῳ
  choice: ऊपर की मंज़िल के एक कमरे में
  rationale: ὑπερῷον ऊपर की मंज़िल पर स्थित कमरे को दर्शाता है। यह रूप किसी विशेष प्रसिद्ध 'ऊपरी कमरे' का अनावश्यक संकेत नहीं देता।
theological_decisions:
- issue: ὑπερῴῳ को पारंपरिक 'ऊपरी कमरे' के रूप में या सामान्य स्थान-वर्णन के रूप में प्रस्तुत करना
  choice: ऊपर की मंज़िल के एक कमरे में
  alternative: ऊपरी कमरे में
  rationale: ग्रीक पद अनिश्चित और सामान्य है; चुना हुआ रूप स्थान को स्पष्ट करता है और किसी विशिष्ट ज्ञात कमरे की पहचान आरोपित नहीं करता।
- issue: λούσαντες में कर्म को स्पष्ट करना
  choice: उसके शरीर को धोया
  alternative: उसे धोया
  rationale: मृत्यु के तुरंत बाद का संदर्भ शरीर धोने को दर्शाता है। स्पष्ट हिंदी अस्पष्ट या असहज अर्थ से बचाती है, पर किसी विशेष धार्मिक रीति को नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। वाक्य-रचना मूल घटनाक्रम को बनाए रखती है और अनावश्यक पारंपरिक या सांप्रदायिक शब्दावली से बचती है।
