source:
  edition: SBLGNT
  text: καὶ ἦν μετ’ αὐτῶν εἰσπορευόμενος ⸂καὶ ἐκπορευόμενος⸃ εἰς ⸀Ἰερουσαλήμ, παρρησιαζόμενος ἐν τῷ ὀνόματι τοῦ ⸀κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/028.yaml
  text: And he was with them in Jerusalem, going in and going out, speaking boldly in the name of the Lord.
translation:
  language: hi
  text: और वह उनके साथ यरूशलेम में आता-जाता रहा और प्रभु के नाम में निडर होकर बोलता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν μετ’ αὐτῶν
  choice: वह उनके साथ ... रहा
  rationale: अपूर्णकाल ongoing association को व्यक्त करता है। ‘उनके साथ ... रहा’ निवास का अनावश्यक अर्थ जोड़े बिना निरंतर संगति को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: εἰσπορευόμενος καὶ ἐκπορευόμενος
  choice: आता-जाता रहा
  rationale: दोनों कृदंत नियमित और स्वतंत्र आवागमन का मुहावरेदार भाव देते हैं। शाब्दिक ‘अंदर जाता और बाहर आता’ की अपेक्षा ‘आता-जाता रहा’ आधुनिक हिन्दी में स्वाभाविक है और पुनरावृत्त क्रिया को बनाए रखता है।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: यहाँ εἰς नगर को गतिविधि के क्षेत्र के रूप में दर्शाता है; ‘यरूशलेम में’ प्रसंगानुकूल है और बार-बार नगर में प्रवेश करने का भ्रामक संकेत नहीं देता।
- source_word: παρρησιαζόμενος
  choice: निडर होकर बोलता रहा
  rationale: क्रिया खुले, निर्भीक और स्पष्ट सार्वजनिक कथन को सूचित करती है। ‘निडर होकर’ साहस के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ ὀνόματι
  choice: के नाम में
  rationale: यह बाइबलीय अभिव्यक्ति अधिकार, प्रतिनिधित्व और अंगीकार जैसे जुड़े हुए भावों को खुला रखती है; इसे केवल ‘के अधिकार से’ कहना अर्थ को संकुचित कर देता।
- source_word: τοῦ κυρίου
  choice: प्रभु
  rationale: मूल में उपाधि κύριος है। ‘प्रभु’ हिन्दी में स्थापित, गरिमापूर्ण अनुवाद है और इसे प्रसंगगत नाम ‘यीशु’ से प्रतिस्थापित नहीं करता।
theological_decisions:
- issue: ‘प्रभु’ का संदर्भ
  choice: मुख्य पाठ में ‘प्रभु’ उपाधि को बनाए रखा गया है; प्रसंग में इसका संकेत यीशु की ओर है।
  alternative: ‘यीशु के नाम में’ लिखकर संदर्भ को स्पष्ट कर देना।
  rationale: यूनानी पाठ में κυρίου है, Ἰησοῦ नहीं। उपाधि को बनाए रखने से लूका–प्रेरितों के काम की भाषिक और धर्मवैचारिक प्रतिध्वनि सुरक्षित रहती है तथा मूल से अधिक स्पष्टता नहीं जोड़ी जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘आता-जाता रहा’ यूनानी युग्म का स्वाभाविक मुहावरेदार रूप है; दोनों ‘रहा’ निरंतर और पुनरावृत्त क्रियाओं को स्पष्ट करते हैं।
