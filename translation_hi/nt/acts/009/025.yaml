  text: λαβόντες δὲ ⸂οἱ μαθηταὶ αὐτοῦ⸃ νυκτὸς ⸂διὰ τοῦ τείχους καθῆκαν αὐτὸν⸃ χαλάσαντες ἐν σπυρίδι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/025.yaml
  text: But his disciples took him by night and lowered him through the wall in a large basket[a][b].
translation:
  language: hi
  text: परन्तु उसके शिष्यों ने उसे रात में अपने साथ लिया और एक बड़े टोकरे में रखकर उसे दीवार में से होकर नीचे लटकाकर उतार दिया[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दीवार में किसी खुले स्थान से।” यूनानी में शाब्दिक रूप से “दीवार में से होकर” है; सम्भवतः नगर की दीवार में कोई छेद या खिड़की अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में नीचे उतारने के लिए दो समानार्थक क्रियाएँ प्रयुक्त हुई हैं—पहली “उतार दिया” और दूसरी “नीचे लटकाकर/छोड़ते हुए।” यह सजीव रचना उनके बच निकलने की रीति पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: उसे लिया
  rationale: यह कृदन्त शिष्यों द्वारा उसे अपने साथ लेकर बच निकलने की व्यवस्था करने को व्यक्त करता है; ‘उसे लिया’ मूल के निकट और स्वाभाविक है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले षड्यंत्र के विपरीत कथा में हल्का मोड़ दिखाता है।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: उसके शिष्यों
  rationale: αὐτοῦ के संबंधसूचक भाव को बनाए रखते हुए μαθηταί का प्रचलित अनुवाद ‘शिष्य’ रखा गया है।
- source_word: νυκτός
  choice: रात में
  rationale: समयवाचक संबंधकारक का आधुनिक हिन्दी में स्वाभाविक रूप।
- source_word: διὰ τοῦ τείχους
  choice: दीवार के पार
  rationale: διά यहाँ दीवार से होकर निकलने की गति बताता है। हिन्दी में ‘दीवार के पार’ स्वाभाविक है, जबकि किसी छेद या खिड़की को मुख्य पाठ में जोड़ना मूल से अधिक स्पष्ट करना होता।
- source_word: καθῆκαν αὐτόν
  choice: उतार दिया
  rationale: καθίημι ऊँचाई से नीचे उतारने या छोड़ने की क्रिया बताता है।
- source_word: χαλάσαντες
  choice: नीचे लटकाकर
  rationale: यह कृदन्त रस्सी आदि के सहारे नीचे छोड़ने की रीति को व्यक्त करता है और καθῆκαν के साथ मूल की दोहरी अभिव्यक्ति को हिन्दी में यथासंभव बनाए रखता है।
- source_word: ἐν σπυρίδι
  choice: एक बड़े टोकरे में
  rationale: σπυρίς ऐसे बड़े टोकरे को सूचित करता है जिसमें किसी व्यक्ति को उतारा जा सके।
