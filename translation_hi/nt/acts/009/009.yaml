  text: And for three days he was without sight[a], and he neither ate nor drank.
translation:
  language: hi
  text: और वह तीन दिन तक देख नहीं सकता था, और उसने न तो कुछ खाया, न पिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν ἡμέρας τρεῖς
  choice: वह तीन दिन तक ... रहा/सका
  rationale: ἡμέρας τρεῖς समय की अवधि बताता है; आधुनिक हिन्दी में ‘तीन दिन तक’ इसका स्वाभाविक रूप है। वाक्य में अवस्था को ‘देख नहीं सका’ के साथ व्यक्त किया गया है, बिना ‘बना रहा’ जैसी अनावश्यक व्याख्या जोड़े।
- source_word: μὴ βλέπων
  choice: देख नहीं सका
  rationale: वर्तमान कृदन्त का शाब्दिक अर्थ ‘न देखते हुए’ है। ‘देख नहीं सका’ हिन्दी में स्वाभाविक रूप से शाऊल की देखने में असमर्थता व्यक्त करता है, जबकि मुख्य पाठ में अपेक्षाकृत अधिक प्रबल विशेषण ‘अंधा’ नहीं जोड़ता।
- source_word: οὐκ ἔφαγεν
  choice: उसने न कुछ खाया
  rationale: ἔφαγεν का सीधा अर्थ ‘खाया’ है। अगले निषेध के साथ ‘न...न...’ हिन्दी में समन्वित निषेध का स्वाभाविक ढाँचा है; ‘कुछ’ पूर्ण उपवास का भाव स्पष्ट करता है।
- source_word: οὐδὲ ἔπιεν
  choice: न पिया
  rationale: οὐδὲ पहले निषेध से दूसरे निषेध को जोड़ता है; हिन्दी में समानांतर ‘न कुछ खाया, न पिया’ संक्षिप्त और स्वाभाविक है।
