  text: ἀπεκρίθη δὲ Ἁνανίας· Κύριε, ⸀ἤκουσα ἀπὸ πολλῶν περὶ τοῦ ἀνδρὸς τούτου, ὅσα κακὰ ⸂τοῖς ἁγίοις σου ἐποίησεν⸃ ἐν Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/013.yaml
  text: But Ananias answered[a], “Lord, I have heard from many about this man, how much evil he has done to your saints in Jerusalem.”
translation:
  language: hi
  text: पर हनन्याह ने उत्तर दिया, “हे प्रभु, मैंने बहुतों से इस मनुष्य के बारे में सुना है कि उसने यरूशलेम में आपके पवित्र जनों के विरुद्ध कितने बुरे काम किए हैं।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने यरूशलेम में आपके पवित्र जनों को कितनी हानि पहुँचाई है।”
    reason: ὅσα κακὰ ... ἐποίησεν का अधिक भावगत और स्वाभाविक वैकल्पिक अनुवाद, जो किए गए अनिष्ट के परिमाण पर बल देता है।
lexical_decisions:
- source_word: ἀπεκρίθη δὲ
  choice: पर हनन्याह ने उत्तर दिया
  rationale: δέ यहाँ कथा में हल्का विरोधात्मक मोड़ दिखाता है, क्योंकि हनन्याह संकोच प्रकट करता है; ἀπεκρίθη का सीधा और स्वाभाविक अनुवाद ‘उत्तर दिया’ है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: यह पुनर्जीवित यीशु को प्रत्यक्ष संबोधन है। ‘हे प्रभु’ आदर और प्रसंग के धर्मवैज्ञानिक भार—दोनों को बनाए रखता है।
- source_word: ἤκουσα ἀπὸ πολλῶν
  choice: मैंने बहुतों से ... सुना है
  rationale: ἀπὸ πολλῶν को बिना अनावश्यक संज्ञा जोड़े संक्षिप्त रखा गया है; ‘सुना है’ प्राप्त सूचना की वर्तमान प्रासंगिकता व्यक्त करता है।
- source_word: περὶ τοῦ ἀνδρὸς τούτου
  choice: इस मनुष्य के बारे में
  rationale: περί के अर्थ और demonstrative τούτου दोनों को सीधे तथा स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ὅσα κακὰ
  choice: कितनी बुराइयाँ
  rationale: ὅσα की परिमाणात्मक शक्ति और κακά की नैतिक नकारात्मकता दोनों सुरक्षित रहती हैं।
- source_word: τοῖς ἁγίοις σου
  choice: आपके पवित्र जनों के साथ
  rationale: ἅγιοι को सामान्यीकृत ‘लोगों’ में बदलने के बजाय ‘पवित्र जन’ कहा गया है; σου से प्रभु के साथ उनका संबंध भी स्पष्ट रहता है।
- source_word: ἐποίησεν
  choice: की हैं
  rationale: ποιέω के व्यापक अर्थ को सरल क्रिया से व्यक्त किया गया है; हिंदी पूर्ण पक्ष इन कामों की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: ἐν Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: स्थानवाचक पदबंध का मानक हिंदी रूप।
theological_decisions:
- issue: हनन्याह के संबोधन Κύριε का आशय
  choice: यीशु को ‘प्रभु’ कहकर प्रत्यक्ष संबोधन
  alternative: केवल आदरसूचक ‘स्वामी’
  rationale: निकटवर्ती प्रसंग में हनन्याह दर्शन में पुनर्जीवित यीशु से बात कर रहा है; इसलिए ‘प्रभु’ कथात्मक संदर्भ और धर्मवैज्ञानिक भार को बिना बढ़ाए सुरक्षित रखता है।
- issue: τοῖς ἁγίοις σου में विश्वासियों की पहचान
  choice: आपके पवित्र जन
  alternative: आपके लोग / आपके संत
  rationale: ‘पवित्र जन’ मूल ἅγιοι का अर्थ और बहुवचन सामुदायिक संदर्भ स्पष्ट रखता है, जबकि आधुनिक हिंदी में ‘संत’ से जुड़ सकने वाली बाद की विशिष्ट धार्मिक उपाधि से बचता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संबोधन में आदरसूचक ‘आपके’ प्रयुक्त हुआ है। ‘पवित्र जन’ मूल धार्मिक पद को बनाए रखते हुए साधारण पाठक के लिए स्पष्ट है।
