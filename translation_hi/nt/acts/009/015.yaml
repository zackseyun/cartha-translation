  text: परन्तु प्रभु ने उससे कहा, “जा, क्योंकि यह मेरा चुना हुआ साधन है, ताकि वह मेरा नाम गैर-यहूदियों[a], राजाओं और इस्राएल के पुत्रों[b] के सामने ले जाए।”
