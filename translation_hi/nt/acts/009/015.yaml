    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: प्रभु
  rationale: कथा के इस प्रसंग में यह पुनर्जीवित यीशु के लिए प्रयुक्त अधिकारसूचक उपाधि है; ‘प्रभु’ स्वाभाविक और स्थापित हिन्दी रूप है।
- source_word: Πορεύου
  choice: जा
  rationale: एकवचन आज्ञार्थक रूप की सीधी शक्ति और प्रसंग की सहजता बनाए रखता है।
- source_word: σκεῦος ἐκλογῆς
  choice: चुना हुआ साधन
  rationale: शाब्दिक चित्र ‘चुना हुआ पात्र’ हो सकता है, पर यहाँ σκεῦος किसी उद्देश्य के लिए काम में लिए जाने वाले माध्यम को दर्शाता है; ‘साधन’ आधुनिक हिन्दी में रूपक का आशय स्पष्ट करता है।
- source_word: ἐστίν μοι
  choice: मेरा ... है
  rationale: μοι में निहित व्यक्तिगत सम्बन्ध अथवा अधिकार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῦ βαστάσαι
  choice: ले जाए
  rationale: उद्देश्यसूचक क्रिया को सहज हिन्दी में रखता है और ‘मेरा नाम’ को बदलकर केवल ‘सन्देश’ नहीं बनाता।
- source_word: τὸ ὄνομά μου
  choice: मेरा नाम
  rationale: मूल अभिव्यक्ति को अक्षुण्ण रखता है, जिसमें प्रतिनिधित्व, अधिकार और सार्वजनिक अंगीकार की व्यापक बाइबलीय प्रतिध्वनि बनी रहती है।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: उपस्थिति और सार्वजनिक साक्ष्य—दोनों के लिए स्पष्ट, सामान्य हिन्दी समतुल्य है।
- source_word: ἐθνῶν
  choice: गैर-यहूदियों
  rationale: ‘इस्राएल के पुत्रों’ के साथ विरोधी क्रम में इसका प्रसंगगत अर्थ गैर-यहूदी लोग है; अधिक शाब्दिक ‘राष्ट्रों’ को पादटिप्पणी में रखा गया है।
- source_word: βασιλέων
  choice: राजाओं
  rationale: मूल संज्ञा का सीधा और स्वाभाविक बहुवचन रूप है।
- source_word: υἱῶν Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: मूल की पारिवारिक, पुल्लिंग बाइबलीय अभिव्यक्ति को दृश्यमान रखता है; उसके सामूहिक अर्थ को पादटिप्पणी स्पष्ट करती है।
- source_word: τε ... καὶ ... τε
  choice: '..., ... और ...'
  rationale: तीनों समूहों का समन्वय हिन्दी की स्वाभाविक सूची-रचना से व्यक्त किया गया है।
theological_decisions:
- issue: ἐκλογῆς में चुनाव सम्बन्धी सम्भावित सिद्धान्तगत अतिपाठ
  choice: चुना हुआ साधन
  alternative: चुनाव का पात्र / निर्वाचित पात्र
  rationale: पद सेवा के एक विशेष कार्य के लिए परमेश्वर के चुनाव को स्पष्ट करता है, पर बाद के व्यवस्थित धर्मवैज्ञानिक विवादों को शब्दावली पर आरोपित नहीं करता।
