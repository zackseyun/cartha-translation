  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गैर-यहूदियों’ सामान्य पाठक के लिए ‘अन्यजातियों’ से अधिक तत्काल स्पष्ट है। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनकी वैकल्पिक व्याख्या वे देते हैं।
