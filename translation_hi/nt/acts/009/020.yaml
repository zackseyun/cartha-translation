id: ACT.9.20
reference: Acts 9:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐν ταῖς συναγωγαῖς ἐκήρυσσεν τὸν ⸀Ἰησοῦν ὅτι οὗτός ἐστιν ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/020.yaml
  text: And immediately in the synagogues he began proclaiming Jesus[b][a], that he is the Son of God.
translation:
  language: hi
  text: और वह तुरन्त आराधनालयों में यीशु का प्रचार करने लगा[a] कि वही परमेश्वर का पुत्र है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु की सार्वजनिक घोषणा करने लगा” अथवा “यीशु का प्रचार करता रहा।” यूनानी क्रिया में सार्वजनिक रूप से घोषणा करने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या, “वही परमेश्वर का बेटा है।” ‘पुत्र’ मूल पदवी का अधिक औपचारिक और पारंपरिक रूप है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: तुरन्त
  rationale: यह शब्द कार्य की तात्कालिकता और कथा की गति को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐν ταῖς συναγωγαῖς
  choice: आराधनालयों में
  rationale: ἐν के स्थानवाचक अर्थ और बहुवचन दोनों को बनाए रखता है; यहूदी सभास्थलों के लिए प्रचलित और सुबोध हिन्दी शब्द है।
- source_word: ἐκήρυσσεν
  choice: प्रचार करने लगा
  rationale: κηρύσσω की सार्वजनिक घोषणा का भाव ‘प्रचार’ से व्यक्त होता है। ‘करने लगा’ प्रसंग में imperfect के आरम्भिक/सतत पहलू को स्वाभाविक ढंग से दर्शाता है, बिना उसे केवल एक बार की क्रिया बनाने के।
- source_word: τὸν Ἰησοῦν
  choice: यीशु का
  rationale: यूनानी में यीशु प्रत्यक्ष कर्म है। हिन्दी में ‘यीशु का प्रचार करना’ स्वाभाविक है और ‘यीशु के विषय में’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: ὅτι
  choice: कि
  rationale: यह शाऊल की घोषणा की विषय-वस्तु का सहज परिचय देता है।
- source_word: οὗτός
  choice: वही
  rationale: 'साधारण ‘वह’ की अपेक्षा यूनानी संकेतवाचक की पहचानपरक और बलयुक्त भावना को स्वाभाविक हिन्दी में सुरक्षित रखता है: जिस यीशु का प्रचार हो रहा है, वही परमेश्वर का पुत्र है।'
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: यह पदवी का सीधा, पारदर्शी और हिन्दी बाइबिलीय प्रयोग में परिचित अनुवाद है; मूल के मसीह-संबंधी दावे को बिना विस्तार या न्यूनता के रखता है।
theological_decisions:
- issue: शाऊल की घोषणा में मसीह-संबंधी पदवी
  choice: परमेश्वर का पुत्र
  alternative: परमेश्वर-पुत्र
  rationale: ‘परमेश्वर का पुत्र’ ὁ υἱὸς τοῦ θεοῦ की संबंधवाचक रचना को स्पष्ट रूप से बनाए रखता है और किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या को नहीं जोड़ता।
- issue: οὗτός का पहचानपरक बल
  choice: वही
  alternative: वह
  rationale: ‘वही’ यीशु की पहचान पर मूल संकेतवाचक का बल बनाए रखता है, जबकि ‘वह’ अधिक स्वाभाविक पर कम बलयुक्त हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य को साधारण पाठक के लिए सहज रखते हुए ‘आराधनालय’, ‘प्रचार’ और ‘परमेश्वर का पुत्र’ जैसे गरिमापूर्ण तथा परिचित बाइबिलीय शब्द चुने गए हैं। ‘वही’ मूल के संकेतवाचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
