source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Πέτρος συνῆλθεν αὐτοῖς· ὃν παραγενόμενον ἀνήγαγον εἰς τὸ ὑπερῷον, καὶ παρέστησαν αὐτῷ πᾶσαι αἱ χῆραι κλαίουσαι καὶ ἐπιδεικνύμεναι χιτῶνας καὶ ἱμάτια ὅσα ἐποίει μετ’ αὐτῶν οὖσα ἡ Δορκάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/039.yaml
  text: So Peter got up and went with them[a]. When he arrived, they took him up to the upper room, and all the widows stood beside him[c][b], weeping and showing the tunics and garments that Dorcas made while she was with them.
translation:
  language: hi
  text: तब पतरस उठकर उनके साथ चल दिया। जब वह पहुँचा, तो वे उसे ऊपर के कमरे में ले गए। वहाँ सभी विधवाएँ उसके पास खड़ी थीं, रो रही थीं और वे कुर्ते और बाहरी वस्त्र दिखा रही थीं, जो दोरकास उनके साथ रहते हुए बनाया करती थी।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोरकास यूनानी नाम है; प्रेरितों के काम 9:36 में उसे तबीता भी कहा गया है।
    reason: cross_reference
  - marker: b
    text: 'मूल भाषा में वस्त्रों के लिए दो अलग शब्द हैं: पहला शरीर पर पहने जाने वाले कुर्ते जैसे वस्त्र और दूसरा सामान्यतः बाहरी वस्त्रों को दर्शाता है।'
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς
  choice: उठकर
  rationale: यह कृदंत पतरस की तत्काल प्रत्युत्तरात्मक क्रिया बताता है; ‘उठकर’ स्वाभाविक और संक्षिप्त है।
- source_word: συνῆλθεν αὐτοῖς
  choice: उनके साथ चल दिया
  rationale: संदर्भ में इसका अर्थ दूतों के साथ जाना है; यह हिन्दी में दिशा और साथ जाने का भाव सहज रूप से व्यक्त करता है।
- source_word: παραγενόμενον
  choice: जब वह पहुँचा
  rationale: कृदंत को मुख्य क्रिया के सापेक्ष कालवाची उपवाक्य के रूप में स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
- source_word: ἀνήγαγον εἰς τὸ ὑπερῷον
  choice: वे उसे ऊपर के कमरे में ले गए
  rationale: ἀνάγω के ऊपर ले जाने के स्थानिक भाव और ὑπερῷον के ऊपरी मंज़िल के कमरे, दोनों को स्पष्ट रखता है।
- source_word: παρέστησαν αὐτῷ
  choice: उसके पास खड़ी
  rationale: क्रिया का मूल दृश्य विधवाओं के पतरस के निकट खड़े होने का है; औपचारिक ‘उसके सामने उपस्थित हुईं’ की अपेक्षा संदर्भानुकूल और स्वाभाविक है।
- source_word: πᾶσαι αἱ χῆραι
  choice: सभी विधवाएँ
  rationale: समूचे समूह पर दिए गए बल और χῆραι के स्पष्ट अर्थ को सीधे व्यक्त करता है।
- source_word: κλαίουσαι
  choice: रो रही थीं
  rationale: वर्तमान कृदंत उस समय जारी शोक को दर्शाता है।
- source_word: ἐπιδεικνύμεναι
  choice: दिखा रही थीं
  rationale: वस्त्रों को पतरस को दिखाने की जारी क्रिया का सरल और सटीक हिन्दी रूप है।
- source_word: χιτῶνας καὶ ἱμάτια
  choice: कुरते और दूसरे वस्त्र
  rationale: दो अलग यूनानी वस्त्र-शब्दों का भेद रखा गया है; ‘कुरते’ शरीर पर पहने जाने वाले चिटोन का सामान्यतः समझ आने वाला निकटतम रूप है, जबकि ‘दूसरे वस्त्र’ ἱμάτια को अनावश्यक रूप से केवल चादर या लबादा नहीं बनाता।
- source_word: ὅσα ἐποίει
  choice: जिन्हें ... बनाया करती थी
  rationale: अपूर्ण भूतकालीन ἐποίει यहाँ अतीत में जारी या बार-बार होने वाले काम का भाव दे सकता है; ‘बनाया करती थी’ उस पहलू को सहज हिन्दी में बचाता है।
- source_word: μετ’ αὐτῶν οὖσα
  choice: उनके साथ रहते हुए
  rationale: शाब्दिक साथ होने के भाव को बनाए रखता है और यह नहीं जोड़ता कि वस्त्र अनिवार्यतः उन्हीं विधवाओं के लिए बनाए गए थे।
- source_word: ἡ Δορκάς
  choice: दोरकास
  rationale: यूनानी नाम का प्रचलित हिन्दी लिप्यंतरण; इसी स्त्री का अरामी नाम तबीता पद 36 में दिया गया है।
