  text: ἀλλὰ ἀνάστηθι καὶ εἴσελθε εἰς τὴν πόλιν, καὶ λαληθήσεταί σοι ⸂ὅ τί⸃ σε δεῖ ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/006.yaml
  text: But get up and enter the city[a], and you will be told what you must do.
translation:
  language: hi
  text: लेकिन उठो और नगर में जाओ; तब तुम्हें बताया जाएगा कि तुम्हें क्या करना है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: लेकिन
  rationale: यह शाऊल के प्रश्न से यीशु की आज्ञा की ओर विरोधसूचक मोड़ दिखाता है; आधुनिक हिन्दी में ‘लेकिन’ स्वाभाविक और संक्षिप्त है।
- source_word: ἀνάστηθι
  choice: उठो
  rationale: ἀνίστημι का आज्ञार्थक रूप है; भूमि पर गिरे शाऊल के लिए ‘उठो’ सीधा और स्वाभाविक है।
- source_word: εἴσελθε εἰς τὴν πόλιν
  choice: नगर में जाओ
  rationale: शाब्दिक ‘नगर में प्रवेश करो’ की अपेक्षा यह सामान्य हिन्दी में अधिक स्वाभाविक है और गंतव्य की गति को ठीक व्यक्त करता है।
- source_word: λαληθήσεταί σοι
  choice: तुम्हें बताया जाएगा
  rationale: भविष्यत् कर्मवाच्य और कर्ता की अनिर्दिष्टता दोनों सुरक्षित रहते हैं; ‘तुमसे कहा जाएगा’ भी संभव है, पर अगले उपवाक्य की विषयवस्तु के साथ ‘बताया जाएगा’ अधिक सहज है।
- source_word: ὅ τί
  choice: क्या
  rationale: यह बताए जाने वाली बात की विषयवस्तु प्रस्तुत करता है; हिन्दी में ‘क्या’ इसका स्वाभाविक समतुल्य है।
- source_word: σε δεῖ ποιεῖν
  choice: तुम्हें क्या करना है
  rationale: हिन्दी की यह बाध्यतासूचक रचना δεῖ की आवश्यकता को स्वाभाविक ढंग से व्यक्त करती है, बिना अनावश्यक रूप से स्रोत या कर्ता को स्पष्ट किए।
theological_decisions:
- issue: दैवी निर्देशन के प्रसंग में δεῖ की शक्ति
  choice: तुम्हें क्या करना है
  alternative: तुम्हें क्या करना आवश्यक है / तुम्हें क्या करना होगा
  rationale: यह रचना वास्तविक दायित्व और आवश्यकता को बनाए रखती है, पर आवश्यकता के स्रोत को पाठ से आगे जाकर परिभाषित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक आज्ञा के अनुकूल। ‘नगर’ बाइबलीय कथात्मक शैली में परिचित है, जबकि वाक्य-विन्यास समकालीन और सहज रखा गया है।
