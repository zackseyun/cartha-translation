source:
  edition: SBLGNT
  text: Ὁ δὲ Σαῦλος ἔτι ἐμπνέων ἀπειλῆς καὶ φόνου εἰς τοὺς μαθητὰς τοῦ κυρίου, προσελθὼν τῷ ἀρχιερεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/001.yaml
  text: But Saul[a], still breathing threats and murder against the disciples of the Lord, came to the high priest
translation:
  language: hi
  text: परन्तु शाऊल अब भी प्रभु के चेलों के विरुद्ध धमकी और हत्या की धुन में था। वह महायाजक के पास गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले प्रसंग से शाऊल की कथा की ओर लौटते हुए हल्का विरोध और कथात्मक बदलाव दर्शाता है।
- source_word: ἔτι
  choice: अब भी
  rationale: यह शाऊल की पहले से चली आ रही शत्रुतापूर्ण दशा की निरंतरता स्पष्ट करता है।
- source_word: ἐμπνέων
  choice: आग उगल रहा था
  rationale: शाब्दिक अर्थ ‘साँस लेना’ है, पर ἀπειλῆς καὶ φόνου के साथ यह तीव्र शत्रुता से भरे होने का सजीव मुहावरा है; हिन्दी में ‘आग उगलना’ उस चित्रात्मक तीव्रता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπειλῆς
  choice: धमकी
  rationale: एकवचन भाववाचक रूप यूनानी संज्ञा के अनुरूप है और लगातार धमकाने की मनोदशा व्यक्त करता है।
- source_word: φόνου
  choice: हत्या
  rationale: φόνος जान लेने अथवा हत्या को सूचित करता है; ‘हत्या’ नैतिक गंभीरता को बनाए रखते हुए हिन्दी में सीधा और स्वाभाविक है।
- source_word: εἰς τοὺς μαθητὰς
  choice: चेलों के विरुद्ध
  rationale: इस शत्रुतापूर्ण संदर्भ में εἰς दिशा के साथ विरोध का भाव रखता है, जिसे ‘के विरुद्ध’ स्पष्ट करता है।
- source_word: μαθητὰς
  choice: चेलों
  rationale: ‘चेला’ आधुनिक हिन्दी बाइबलीय प्रयोग में यीशु के प्रतिबद्ध अनुयायियों के लिए परिचित और सहज शब्द है।
- source_word: τοῦ κυρίου
  choice: प्रभु के
  rationale: सम्बन्धकारक पद चेलों का प्रभु से संबंध दिखाता है; κύριος के लिए ‘प्रभु’ मानक, गरिमापूर्ण हिन्दी रूप है।
- source_word: προσελθὼν
  choice: पास गया
  rationale: अओरिस्ट कृदन्त महायाजक के निकट जाने को बताता है और अगले पद की मुख्य क्रिया की भूमिका बनाता है; पद-सीमा पर हिन्दी में स्वतंत्र वाक्य स्वाभाविक है।
- source_word: τῷ ἀρχιερεῖ
  choice: महायाजक के पास
  rationale: ἀρχιερεύς के लिए ‘महायाजक’ प्रचलित और सटीक पद है; सम्प्रदान कारक को गति-सूचक क्रिया के साथ ‘के पास’ व्यक्त करता है।
theological_decisions:
- issue: τοῦ κυρίου में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस प्रसंग में यह यीशु के लिए प्रयुक्त पद है। ‘प्रभु’ लूका-प्रेरितों के धार्मिक आशय और प्रचलित हिन्दी बाइबलीय भाषा, दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धमकी और हत्या की आग उगल रहा था’ मूल के सजीव श्वास-रूपक को शब्दशः अस्वाभाविक हिन्दी में बदलने के बजाय स्वाभाविक हिन्दी मुहावरे से व्यक्त करता है। पद अगले वाक्य की भूमिका पर समाप्त होता है, इसलिए अन्त में पूर्णविराम दिया गया है।
