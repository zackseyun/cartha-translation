source:
  edition: SBLGNT
  text: Σαῦλος δὲ μᾶλλον ἐνεδυναμοῦτο καὶ ⸀συνέχυννεν ⸀τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ, συμβιβάζων ὅτι οὗτός ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/022.yaml
  text: But Saul kept gaining strength all the more and was confounding the Jews living in Damascus[a], proving that this one is the Messiah.
translation:
  language: hi
  text: पर शाऊल और भी बल पाता गया और दमिश्क में रहने वाले यहूदियों को उलझन में डालता रहा। वह प्रमाण देकर सिद्ध करता था कि यही मसीह[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीष्ट।” यूनानी उपाधि Χριστός का अर्थ “अभिषिक्त जन” है; यहाँ यहूदी मसीहाई संदर्भ बनाए रखने के लिए इसका अनुवाद “मसीह” किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: μᾶλλον
  choice: और भी
  rationale: तुलनात्मक तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है और शाऊल के लगातार अधिक बल पाने पर जोर बनाए रखता है।
- source_word: ἐνεδυναμοῦτο
  choice: बल पाता गया
  rationale: अपूर्णकाल की निरंतर प्रगति व्यक्त होती है। यह प्रयोग इस बात को अनावश्यक रूप से निश्चित नहीं करता कि बल भीतर से बढ़ा या किसी के द्वारा दिया गया।
- source_word: συνέχυννεν
  choice: उलझन में डालता रहा
  rationale: क्रिया के ‘भ्रमित या अस्त-व्यस्त कर देना’ अर्थ को बनाए रखता है; साथ ही अपूर्णकाल की बार-बार या लगातार होती क्रिया भी स्पष्ट करता है।
- source_word: τοὺς Ἰουδαίους τοὺς κατοικοῦντας ἐν Δαμασκῷ
  choice: दमिश्क में रहने वाले यहूदियों को
  rationale: यह स्वाभाविक आधुनिक हिन्दी है और कथन को सभी यहूदियों के बजाय दमिश्क में रहने वाले विशेष समूह तक सीमित रखता है।
- source_word: συμβιβάζων
  choice: प्रमाण देकर सिद्ध करता था
  rationale: संदर्भ में यह अलग-अलग प्रमाणों को जोड़कर किसी निष्कर्ष को स्थापित करने की तार्किक क्रिया बताता है।
- source_word: οὗτός
  choice: यही
  rationale: संकेतवाचक सर्वनाम के जोर को सुरक्षित रखता है और संदर्भ में यीशु की ओर संकेत करता है, बिना पद में उनका नाम जोड़ने के।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ शब्द उपाधि के रूप में उस प्रतिज्ञात अभिषिक्त जन की पहचान बताता है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित और स्वाभाविक है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: निश्चित लेख सहित ὁ χριστός यहाँ नाम नहीं, बल्कि प्रतिज्ञात अभिषिक्त जन की उपाधि है। ‘मसीह’ यहूदी मसीहाई संदर्भ को हिन्दी में अधिक स्पष्ट और परिचित रूप से व्यक्त करता है।
- issue: शाऊल के बल पाने में कर्ता को स्पष्ट करना
  choice: बल पाता गया
  alternative: परमेश्वर से बल पाता गया
  rationale: यूनानी मध्यम/कर्मवाच्य रूप बल मिलने या बढ़ने की गुंजाइश रखता है, पर इस पद में परमेश्वर को स्पष्ट कर्ता नहीं बताता; इसलिए अनकहे कर्ता को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उलझन में डालता रहा’ मूल क्रिया की तीव्रता को ‘निरुत्तर करता रहा’ की अपेक्षा अधिक प्रत्यक्ष रूप से सुरक्षित रखता है, जबकि अगला वाक्य तर्क और प्रमाण का संदर्भ स्पष्ट करता है।
