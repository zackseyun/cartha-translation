source:
  edition: SBLGNT
  text: Ἐν Ἰόππῃ δέ τις ἦν μαθήτρια ὀνόματι Ταβιθά, ἣ διερμηνευομένη λέγεται Δορκάς· αὕτη ἦν πλήρης ⸂ἔργων ἀγαθῶν⸃ καὶ ἐλεημοσυνῶν ὧν ἐποίει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/036.yaml
  text: In Joppa there was a disciple named Tabitha[a], which translated is called Dorcas. She was full of good works and acts of mercy that she was doing.
translation:
  language: hi
  text: योप्पा में तबीता नाम की एक शिष्या थी; अनुवाद करने पर उसका नाम दोरकास होता है। वह अच्छे कामों और दया के कार्यों से भरपूर थी, जिन्हें वह करती रहती थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν Ἰόππῃ
  choice: योप्पा में
  rationale: यूनानी स्थान-नाम Ἰόππη का निकट देवनागरी लिप्यंतरण और विभक्ति का स्वाभाविक हिन्दी रूप।
- source_word: μαθήτρια
  choice: एक शिष्या
  rationale: संज्ञा स्पष्ट रूप से स्त्रीलिंग है; हिन्दी में ‘शिष्या’ स्वाभाविक रूप से यह अर्थ सुरक्षित रखता है।
- source_word: ὀνόματι Ταβιθά
  choice: तबिता नाम की
  rationale: ὀνόματι से व्यक्त नाम-परिचय को सहज आधुनिक हिन्दी में प्रस्तुत किया गया है।
- source_word: ἣ διερμηνευομένη λέγεται Δορκάς
  choice: जिसका अनुवादित नाम दोरकास था
  rationale: यह बताता है कि सेमेटिक नाम तबिता का यूनानी समकक्ष नाम दोरकास है; इसे केवल शब्दार्थ ‘हिरनी’ बनाकर मुख्य पाठ में रखने के बजाय दोनों व्यक्तिनाम सुरक्षित रखे गए हैं।
- source_word: πλήρης ἔργων ἀγαθῶν
  choice: भले कामों से भरपूर
  rationale: πλήρης की प्रचुरता और ἔργων ἀγαθῶν का नैतिक आशय स्वाभाविक हिन्दी में बना रहता है।
- source_word: ἐλεημοσυνῶν
  choice: दया के कार्यों
  rationale: शब्द जरूरतमंदों के प्रति दयापूर्ण सहायता या दान को सूचित करता है; ‘दया के कार्य’ अर्थ को केवल धन देने तक सीमित नहीं करता।
- source_word: ὧν ἐποίει
  choice: जिन्हें वह करती रहती थी
  rationale: अपूर्ण भूतकाल ἐποίει उसके निरंतर या नियमित आचरण का संकेत देता है, जिसे ‘करती रहती थी’ व्यक्त करता है।
- source_word: δέ
  choice: अलग शब्द से अनूदित नहीं
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है; हिन्दी वाक्य-आरंभ में अतिरिक्त ‘अब’ या ‘तब’ जोड़ना अनावश्यक और संभावित रूप से कालसूचक होता।
theological_decisions:
- issue: μαθήτρια का स्त्रीलिंग स्वरूप
  choice: शिष्या
  alternative: चेला / शिष्य
  rationale: यूनानी में स्त्रीलिंग रूप असंदिग्ध है और हिन्दी में उसका सहज, लिंग-सटीक समकक्ष उपलब्ध है।
- issue: ἐλεημοσυνῶν का अर्थ-क्षेत्र
  choice: दया के कार्य
  alternative: दान / भिक्षादान
  rationale: संदर्भ जरूरतमंदों के प्रति सक्रिय करुणा को दर्शाता है। ‘दया के कार्य’ व्यापक अर्थ सुरक्षित रखता है, जबकि ‘भिक्षादान’ इसे अनावश्यक रूप से केवल एक प्रकार की सहायता तक सीमित कर सकता है।
- issue: πλήρης की रूपकात्मक अभिव्यक्ति
  choice: से भरपूर थी
  alternative: बहुत-से ... करती थी
  rationale: ‘भरपूर’ मूल पाठ की ‘पूर्ण/भरी हुई’ अभिव्यक्ति को बनाए रखते हुए हिन्दी में स्वाभाविक है; इसे केवल मात्रा-वाचक कथन में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘शिष्या’ से मूल का स्त्रीलिंग स्पष्ट रखा गया है। अपूर्ण भूतकाल की आदतन क्रिया को ‘करती रहती थी’ से व्यक्त किया गया है।
