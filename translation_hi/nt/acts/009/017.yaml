  text: ἀπῆλθεν δὲ Ἁνανίας καὶ εἰσῆλθεν εἰς τὴν οἰκίαν, καὶ ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας εἶπεν· Σαοὺλ ἀδελφέ, ὁ κύριος ἀπέσταλκέν με, ⸀Ἰησοῦς ὁ ὀφθείς σοι ἐν τῇ ὁδῷ ᾗ ἤρχου, ὅπως ἀναβλέψῃς καὶ πλησθῇς πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/017.yaml
  text: So Ananias went and entered the house, and laying his hands on him he said, “Brother Saul, the Lord has sent me—Jesus, the one who appeared to you on the road by which you were coming—so that you may regain your sight and be filled with the Holy Spirit.”
translation:
  language: hi
  text: तब हनन्याह गया और उस घर में प्रवेश किया। शाऊल पर अपने हाथ रखकर उसने कहा, “भाई शाऊल, प्रभु यीशु, जो उस मार्ग पर तुम्हें दिखाई दिए थे जिस पर तुम आ रहे थे[a], ने मुझे भेजा है, ताकि तुम्हारी दृष्टि लौट आए[b] और तुम पवित्र आत्मा से भर जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस मार्ग पर तुम यात्रा कर रहे थे।”
    reason: ἤρχου की जारी गति को ‘आ रहे थे’ या व्यापक रूप से ‘यात्रा कर रहे थे’ व्यक्त कर सकता है।
  - marker: b
    text: या, “तुम फिर से देख सको।”
    reason: ἀναβλέψῃς का अधिक शाब्दिक वैकल्पिक रूप, जिसका प्रसंगगत अर्थ दृष्टि लौटना है।
lexical_decisions:
- source_word: ἀπῆλθεν δὲ
  choice: इसलिए ... चला गया
  rationale: δέ यहाँ कथा को आगे बढ़ाता है और पिछली आज्ञा के प्रत्युत्तर का संकेत देता है; ‘इसलिए’ प्रसंगगत परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν
  choice: घर में प्रवेश किया
  rationale: ग्रीक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἐπιθεὶς ἐπ’ αὐτὸν τὰς χεῖρας
  choice: उस पर अपने हाथ रखकर
  rationale: सहगामी शारीरिक क्रिया और बाइबलीय मुहावरे, दोनों को बनाए रखता है। संदर्भ की स्पष्टता के लिए ‘उस’ को मुख्य पाठ में ‘शाऊल’ किया गया है।
- source_word: Σαοὺλ ἀδελφέ
  choice: भाई शाऊल
  rationale: सम्बोधन के आत्मीय और स्वीकारपूर्ण भाव को स्वाभाविक हिन्दी क्रम में रखता है।
- source_word: ὁ κύριος ἀπέσταλκέν με
  choice: मुझे प्रभु ने भेजा है
  rationale: पूर्णकाल की वर्तमान प्रासंगिकता को ‘भेजा है’ से व्यक्त किया गया है; हिन्दी शब्दक्रम आगे आने वाले समानाधिकरण को स्पष्ट बनाता है।
- source_word: Ἰησοῦς ὁ ὀφθείς σοι
  choice: उसी यीशु ने, जो ... तुझे दिखाई दिया था
  rationale: ‘यीशु’ को ‘प्रभु’ की पहचान बताने वाले समानाधिकरण के रूप में सुरक्षित रखता है और ὀφθείς का प्रकट होने/दिखाई देने का भाव व्यक्त करता है।
- source_word: ἐν τῇ ὁδῷ ᾗ ἤρχου
  choice: उस मार्ग पर ... जिससे तू आ रहा था
  rationale: ὁδός को वास्तविक मार्ग और imperfect ἤρχου को जारी गति के रूप में दर्शाता है; सम्बन्धवाचक रचना भी बनी रहती है।
- source_word: ἀναβλέψῃς
  choice: तेरी दृष्टि लौट आए
  rationale: चंगाई के इस प्रसंग में शब्द का अर्थ दृष्टि पुनः प्राप्त करना है, केवल ऊपर देखना नहीं।
- source_word: πλησθῇς πνεύματος ἁγίου
  choice: तू पवित्र आत्मा से भर जाए
  rationale: ग्रीक कर्मवाच्य और दिव्य आत्मा के व्यक्तिगत संदर्भ को प्रचलित, स्पष्ट हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: बिना यूनानी निश्चित उपपद के πνεύματος ἁγίου का अनुवाद
  choice: पवित्र आत्मा
  alternative: पवित्र आत्मा से परिपूर्ण
  rationale: यहाँ प्रेरितों के काम के प्रसंग में संकेत दिव्य आत्मा की ओर है; हिन्दी में ‘पवित्र आत्मा’ स्वाभाविक निश्चित व्यक्तिगत संदर्भ देता है, जबकि अनावश्यक अनिश्चितता नहीं जोड़ता।
- issue: ἀδελφέ सम्बोधन का आशय
  choice: भाई शाऊल
  alternative: शाऊल भाई
  rationale: यह रूप आत्मीय स्वीकृति और संगति के भाव को बनाए रखता है, पर उससे आगे कोई विशिष्ट साम्प्रदायिक अर्थ आरोपित नहीं करता।
- issue: ὁ κύριος और Ἰησοῦς का सम्बन्ध
  choice: मुझे प्रभु ने भेजा है—उसी यीशु ने
  alternative: प्रभु यीशु ने मुझे भेजा है
  rationale: ग्रीक में ‘यीशु’ बाद में आकर ‘प्रभु’ की पहचान स्पष्ट करता है। चुना हुआ रूप इस समानाधिकरण और मूल वाक्य की हल्की रचनात्मक रुकावट को सुरक्षित रखता है; विकल्प अधिक सुगम है पर संरचना को समतल कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। प्रत्यक्ष सम्बोधन में ‘तू’ का प्रयोग एकवचन निकटता और मूल यूनानी के एकवचन को दर्शाता है; यह यहाँ अपमानसूचक नहीं है। मूल के समानाधिकरण को डैश द्वारा स्पष्ट किया गया है।
