  text: And the Lord said to him[a], “Get up and go to the street called Straight, and in the house of Judas look for a man named Saul, from Tarsus, for behold, he is praying.”
translation:
  language: hi
  text: तब प्रभु ने उससे कहा, “उठो और उस गली में जाओ जो ‘सीधी’ कहलाती है। वहाँ यहूदा के घर में तरसुस के रहनेवाले शाऊल नामक व्यक्ति[a] को ढूँढ़ो, क्योंकि देखो, वह प्रार्थना कर रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तरसुसवासी शाऊल।” यूनानी विशेषण Ταρσέα बताता है कि शाऊल तरसुस का रहनेवाला था।
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: प्रभु
  rationale: κύριος के मानक नए नियमीय पदनाम को सुरक्षित रखता है और इस पद में वक्ता की पहचान को मूल पाठ से अधिक स्पष्ट नहीं करता।
- source_word: Ἀναστὰς πορεύθητι
  choice: उठो और … जाओ
  rationale: क्रियाविशेषणीय कृदंत और मुख्य आज्ञार्थक क्रिया के संयुक्त बल को स्वाभाविक आधुनिक हिन्दी में दो समन्वित आज्ञाओं द्वारा व्यक्त करता है।
- source_word: ῥύμην τὴν καλουμένην Εὐθεῖαν
  choice: उस गली में … जो ‘सीधी’ कहलाती है
  rationale: ῥύμη को नगर की गली और Εὐθεῖαν को गली के नाम के रूप में स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν οἰκίᾳ Ἰούδα
  choice: यहूदा के घर में
  rationale: ἐν के स्थानवाचक अर्थ और घर के भीतर शाऊल को ढूँढ़ने के निर्देश को निकटता से सुरक्षित रखता है।
- source_word: ζήτησον
  choice: ढूँढ़ो
  rationale: ζητέω के खोजने या किसी का पता लगाने के अर्थ को बिना यह मान लिए व्यक्त करता है कि वह अवश्य मिल ही गया।
- source_word: Σαῦλον ὀνόματι Ταρσέα
  choice: तरसुस के रहनेवाले शाऊल नामक व्यक्ति
  rationale: ὀνόματι से दिए गए नाम और Ταρσέα से सूचित भौगोलिक मूल—दोनों को सहज हिन्दी में अलग-अलग स्पष्ट करता है।
- source_word: ἰδοὺ γὰρ
  choice: क्योंकि देखो
  rationale: γάρ के कारणसूचक संबंध और ἰδού के ध्यान आकर्षित करने वाले बल—दोनों को बनाए रखता है।
- source_word: προσεύχεται
  choice: वह प्रार्थना कर रहा है
  rationale: वर्तमान काल में जारी गतिविधि को हिन्दी के प्रगतिशील रूप से स्वाभाविक रूप में व्यक्त करता है।
theological_decisions:
- issue: κύριος का संदर्भ
  choice: केवल “प्रभु”
  alternative: “प्रभु यीशु”
  rationale: निकटवर्ती प्रसंग वक्ता की पहचान बताता है, पर इस पद के यूनानी पाठ में केवल κύριος है; इसलिए अनुवाद मूल पद की अभिव्यक्ति को ही सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आज्ञाओं के लिए बहुवचन-सम्मानसूचक रूप हिन्दी में स्वाभाविक संबोधन देता है। ‘वहाँ’ लक्ष्य-स्थान को स्पष्ट करने के लिए जोड़ा गया है, बिना कथ्य बदले; ‘सीधी’ को उद्धरण-चिह्नों में रखकर गली के नाम के रूप में पहचाना गया है।
