id: ACT.9.21
reference: Acts 9:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐξίσταντο δὲ πάντες οἱ ἀκούοντες καὶ ἔλεγον· Οὐχ οὗτός ἐστιν ὁ πορθήσας ⸀ἐν Ἰερουσαλὴμ τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο, καὶ ὧδε εἰς τοῦτο ἐληλύθει ἵνα δεδεμένους αὐτοὺς ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/021.yaml
  text: And all who heard him were amazed and were saying[a], “Isn’t this the man who devastated in Jerusalem those who call on this name? And had he not come here for this purpose[b], that he might bring them bound to the chief priests?”
translation:
  language: hi
  text: जितने लोग उसकी बात सुन रहे थे, वे सब चकित थे और कह रहे थे, “क्या यह वही आदमी नहीं है जिसने यरूशलेम में इस नाम को पुकारने वालों को तबाह कर दिया था? और क्या वह यहाँ इसी उद्देश्य से नहीं आया था कि उन्हें बाँधकर प्रधान याजकों के पास ले जाए?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξίσταντο
  choice: चकित होकर
  rationale: यह चल रहे गहरे विस्मय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πάντες οἱ ἀκούοντες
  choice: जितने लोग उसकी बात सुन रहे थे, वे सब
  rationale: कृदंत की सतत क्रिया और πάντες की समग्रता दोनों स्पष्ट रहती हैं; प्रसंग से निहित शाऊल की बात को हिन्दी में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: πορθήσας
  choice: विनाश कर रहा था
  rationale: यह क्रिया साधारण ‘सताना’ से अधिक प्रबल है और विश्वासियों के समुदाय पर शाऊल के विध्वंसकारी आक्रमण का भाव रखती है, बिना यह जताए कि उसने उन्हें पूर्णतः मिटा दिया था।
- source_word: τοὺς ἐπικαλουμένους τὸ ὄνομα τοῦτο
  choice: इस नाम को पुकारनेवालों
  rationale: बाइबलीय मुहावरे को सुरक्षित रखता है, जिसमें इस नाम की दुहाई देना, उसका आह्वान करना और उसके प्रति विश्वास प्रकट करना निहित हो सकता है।
- source_word: εἰς τοῦτο
  choice: इसी उद्देश्य से
  rationale: प्रयोजन का भाव स्पष्ट और सहज हिन्दी में व्यक्त होता है।
- source_word: ἐληλύθει
  choice: आया था
  rationale: पूर्णभूत रूप वक्ताओं के वर्तमान आश्चर्य से पहले हुए आगमन को दर्शाता है।
- source_word: δεδεμένους
  choice: बाँधकर
  rationale: बंदी अवस्था का अर्थ संक्षेप में देता है और ‘जंजीरों में’ कहकर साधन को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀγάγῃ ἐπὶ τοὺς ἀρχιερεῖς
  choice: प्रधान याजकों के पास ले जाए
  rationale: अधिकारियों तक बंदियों को ले जाने का अर्थ स्वाभाविक हिन्दी में देता है; ἐπί को यहाँ गंतव्य-संबंधी रूप में रखा गया है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: द्वितीय-मन्दिरकालीन मुख्य याजकीय अधिकारियों के बहुवचन के लिए स्थापित और ऐतिहासिक रूप से उपयुक्त पद है।
theological_decisions:
- issue: τὸ ὄνομα τοῦτο को स्पष्ट करके ‘यीशु का नाम’ कहना या मूल संकेतवाचकता बनाए रखना
  choice: इस नाम
  alternative: यीशु के नाम
  rationale: यूनानी पाठ में व्यक्ति का नाम निहित है, स्पष्ट रूप से दोहराया नहीं गया; ‘इस नाम’ कथात्मक और धर्मवैचारिक तनाव को बनाए रखता है।
- issue: πορθήσας की तीव्रता
  choice: विनाश कर रहा था
  alternative: सता रहा था
  rationale: मूल क्रिया सामान्य उत्पीड़न से अधिक प्रबल और विध्वंसकारी है; चुना गया रूप उसकी तीव्रता को कम नहीं करता।
- issue: दूसरे खंड का वाक्य-बल
  choice: क्या वह यहाँ इसी उद्देश्य से नहीं आया था... ?
  alternative: वह यहाँ इसी उद्देश्य से आया था...
  rationale: पूरा कथन Οὐχ से आरम्भ होने वाले उसी आलंकारिक प्रश्न का भाग है और सकारात्मक उत्तर की अपेक्षा करता है; हिन्दी में प्रश्नरूप इसे स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘इस नाम को पुकारना’ जैसे बाइबलीय मुहावरे को व्याख्यात्मक विस्तार के बिना सुरक्षित रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
