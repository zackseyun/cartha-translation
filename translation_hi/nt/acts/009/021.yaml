  to: जितने लोग उसकी बात सुन रहे थे, वे सब चकित थे और कह रहे थे, “क्या यह वही आदमी नहीं है जिसने यरूशलेम में इस नाम को पुकारने वालों को तबाह कर दिया था? और क्या वह यहाँ इसी उद्देश्य से नहीं आया था कि उन्हें बाँधकर प्रधान याजकों के पास ले जाए?”
