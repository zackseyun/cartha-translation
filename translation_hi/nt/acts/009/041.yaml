  choice: उसे अपना हाथ दिया
  rationale: यह यूनानी मुहावरे के निकट रहते हुए सहायता के लिए हाथ बढ़ाने का स्वाभाविक हिन्दी वर्णन है।
- source_word: ἀνέστησεν
  choice: उसे उठाया
  rationale: यह किसी को उठाने या खड़ा करने का अर्थ व्यक्त करता है और प्रसंग में पुनर्जीवन की भाषिक प्रतिध्वनि को भी बनाए रखता है।
- source_word: φωνήσας
  choice: बुलाया
  rationale: यह समूह को अपने पास बुलाने के अर्थ को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: τοὺς ἁγίους
  choice: पवित्र लोगों
  rationale: यह परमेश्वर के लिए अलग किए गए समुदाय का सीधा अर्थ बनाए रखता है; केवल 'विश्वासियों' कहना अधिक व्याख्यात्मक होता।
- source_word: τὰς χήρας
  choice: विधवाओं
  rationale: सीधा शब्दार्थ है और पिछले प्रसंग में विधवाओं की अलग कथात्मक भूमिका को सुरक्षित रखता है।
- source_word: παρέστησεν
  choice: उनके सामने प्रस्तुत किया
  rationale: यह किसी व्यक्ति को दूसरों के सामने उपस्थित करने का सकर्मक भाव स्पष्ट करता है।
- source_word: ζῶσαν
  choice: जीवित
  rationale: यह विधेयात्मक रूप से उसकी जीवित अवस्था पर बल देता है और पुनर्जीवन के प्रसंग में स्वाभाविक है।
