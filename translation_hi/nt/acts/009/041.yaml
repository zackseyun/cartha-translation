  text: δοὺς δὲ αὐτῇ χεῖρα ἀνέστησεν αὐτήν, φωνήσας δὲ τοὺς ἁγίους καὶ τὰς χήρας παρέστησεν αὐτὴν ζῶσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/041.yaml
  text: And giving her his hand[a], he raised her up; then he called the saints and the widows and presented her alive.
translation:
  language: hi
  text: उसकी ओर हाथ बढ़ाकर[a] उसने उसे उठाया; फिर पवित्र जनों और विधवाओं को बुलाकर, उसने उसे उनके सामने जीवित प्रस्तुत किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे उठने में सहायता देने के लिए हाथ बढ़ाकर।” यूनानी क्रिया “उठाया” का अर्थ “खड़ा किया” या “उठने में सहायता दी” भी हो सकता है; इस प्रसंग में इसमें पुनर्जीवन की भाषा की प्रतिध्वनि भी है।
    reason: lexical_alternative
