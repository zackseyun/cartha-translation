  choice: उसे उठाया
  alternative: उसे उठने में सहायता दी / उसे खड़ा किया
  rationale: '''उठाया'' तत्काल शारीरिक क्रिया और पुनर्जीवन-संबंधी भाषिक प्रतिध्वनि दोनों को बनाए रखता है, पर यह दावा नहीं करता कि इसी क्रिया ने उसे जीवित किया; उसका जीवित होना पिछले पद में घट चुका है।'
