lexical_decisions:
- source_word: ἐγνώσθη
  choice: पता चल गई
  rationale: यूनानी का कर्मवाच्य भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और यह नहीं बताता कि सूचना किसने दी।
- source_word: ἐπιβουλή
  choice: साज़िश
  rationale: यह शब्द शत्रुतापूर्ण और जानलेवा योजना को दर्शाता है; प्रसंग में ‘साज़िश’ स्पष्ट और स्वाभाविक है।
- source_word: παρετηροῦντο
  choice: निगरानी रखते थे
  rationale: अपूर्ण भूतकाल लगातार जारी निगरानी को व्यक्त करता है; यह अनावश्यक रूप से ‘पहरा देना’ नहीं कहता।
- source_word: πύλας
  choice: फाटकों
  rationale: मूल पाठ केवल ‘फाटक’ कहता है; दमिश्क नगर के फाटक होना प्रसंग से समझ में आता है।
- source_word: ἡμέρας τε καὶ νυκτός
  choice: दिन-रात
  rationale: निरंतर निगरानी का स्वाभाविक और संक्षिप्त हिन्दी रूप।
- source_word: ὅπως
  choice: के लिए
  rationale: उद्देश्यसूचक बल को स्वाभाविक हिन्दी वाक्य-रचना में बनाए रखता है।
- source_word: ἀνέλωσιν
  choice: मार डालने
  rationale: इस प्रसंग में ἀναιρέω का सीधा अर्थ जान से मारना है; ‘मार डालना’ आशय को स्पष्ट रखता है।
- source_word: δὲ
  choice: पर
  rationale: साज़िश रचे जाने और उसके शाऊल को ज्ञात हो जाने के बीच हल्का विरोध दर्शाता है।
- source_word: καὶ
  choice: भी
  rationale: इस अतिरिक्त कार्रवाई को साज़िश के साथ जोड़ने वाला योगात्मक भाव व्यक्त करता है।
