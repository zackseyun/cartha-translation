  yaml_path: translation/nt/acts/009/004.yaml
  text: And falling to the ground, he heard a voice saying to him, “Saul, Saul, why are you persecuting me?”
translation:
  language: hi
  text: और वह भूमि पर गिर पड़ा और उसने एक आवाज़ को उससे यह कहते सुना, “शाऊल, शाऊल, तुम मुझे क्यों सताते हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν
  choice: गिर पड़ा
  rationale: πίπτω के एओरिस्ट कृदंत को हिन्दी में क्रमिक क्रिया के रूप में व्यक्त किया गया है; इससे घटना का प्रवाह स्वाभाविक रहता है और अनावश्यक कालगत सूक्ष्मता नहीं जोड़ी जाती।
- source_word: ἐπὶ τὴν γῆν
  choice: भूमि पर
  rationale: यह गति के बाद सतह पर आ पड़ने को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἤκουσεν φωνὴν
  choice: उसने एक आवाज़ ... सुना
  rationale: आगे स्पष्ट वचन होने के कारण φωνή यहाँ केवल ध्वनि नहीं, बोलती हुई आवाज़ है। हिन्दी में ‘आवाज़’ पुल्लिंग मानकर ‘सुना’ रखा गया है।
- source_word: λέγουσαν αὐτῷ
  choice: उससे कहते
  rationale: यह यूनानी कृदंत-रचना के संबंध को बनाए रखता है और सीधे उद्धरण की स्वाभाविक भूमिका तैयार करता है।
- source_word: Σαοὺλ Σαούλ
  choice: शाऊल, शाऊल
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण और उसकी अर्थपूर्ण पुनरावृत्ति दोनों सुरक्षित रखे गए हैं।
- source_word: τί
  choice: क्यों
  rationale: क्रिया के साथ τί यहाँ कारण पूछने वाला क्रियाविशेषण है; हिन्दी में ‘क्यों’ इसका स्वाभाविक समतुल्य है।
- source_word: με
  choice: मुझे
  rationale: प्रत्यक्ष कर्मवाचक सर्वनाम को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: διώκεις
  choice: सताता है
  rationale: संदर्भ में διώκω विश्वासियों के विरुद्ध जारी उत्पीड़न को दर्शाता है। वर्तमानकालीन ‘सताता है’ ongoing hostile action को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: वक्ता का उन लोगों के साथ अपना तादात्म्य बताना जिन पर शाऊल आक्रमण कर रहा था
  choice: ‘मुझे’ का सीधा शब्दांकन बनाए रखा गया।
  alternative: ‘मेरे लोगों को’ या ‘मेरे अनुयायियों को’ जैसे व्याख्यात्मक विस्तार।
  rationale: मूल वचन वक्ता और सताए जा रहे समुदाय के बीच संबंध को जानबूझकर सीधे और तनावपूर्ण ढंग से प्रस्तुत करता है; अनुवाद को इसकी व्याख्या मुख्य पाठ में नहीं जोड़नी चाहिए।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तू’ प्रत्यक्ष दिव्य संबोधन में मूल के एकवचन और तीखेपन को व्यक्त करता है तथा हिन्दी बाइबलीय शैली में स्वाभाविक है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
