  text: εὗρεν δὲ ἐκεῖ ἄνθρωπόν τινα ⸂ὀνόματι Αἰνέαν⸃ ἐξ ἐτῶν ὀκτὼ κατακείμενον ἐπὶ ⸀κραβάττου, ὃς ἦν παραλελυμένος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/033.yaml
  text: And there he found a certain man named Aeneas[a], bedridden for eight years, who was paralyzed.
translation:
  language: hi
  text: वहाँ उसे ऐनियास नाम का एक व्यक्ति मिला, जो आठ वर्ष से खाट पर पड़ा था[a] और उसे लकवा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिछौने पर पड़ा था।”
    reason: κραβάττος साधारण खाट, चटाई जैसे बिछौने या छोटी शय्या को सूचित कर सकता है; ‘खाट’ ठोस बिंब रखता है, जबकि ‘बिछौना’ व्यापक विकल्प है।
lexical_decisions:
- source_word: εὗρεν δὲ ἐκεῖ
  choice: वहाँ उसे ... मिला
  rationale: यह स्वाभाविक हिन्दी में स्थान और सरल कथात्मक क्रम को व्यक्त करता है; δέ को अलग संयोजक से व्यक्त करना आवश्यक नहीं, क्योंकि पद-संदर्भ में हिन्दी वाक्य सहज रूप से आगे बढ़ता है।
- source_word: ἄνθρωπόν τινα
  choice: एक व्यक्ति
  rationale: τις किसी पहले से अपरिचित व्यक्ति का परिचय देता है। हिन्दी में ‘एक व्यक्ति’ यही कार्य स्वाभाविक ढंग से करता है; ‘कोई निश्चित व्यक्ति’ असहज होगा।
- source_word: ὀνόματι Αἰνέαν
  choice: ऐनियास नाम का
  rationale: व्यक्तिनाम को देवनागरी में लिप्यंतरित किया गया है और ὀνόματι की सामान्य हिन्दी अभिव्यक्ति ‘नाम का’ रखी गई है।
- source_word: ἐξ ἐτῶν ὀκτὼ
  choice: आठ वर्ष से
  rationale: यह बीते हुए और वर्तमान दशा तक चले आए कालखंड को संक्षिप्त तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατακείμενον ἐπὶ κραβάττου
  choice: खाट पर पड़ा था
  rationale: यह यूनानी के ठोस बिंब—साधारण खाट या बिछौने पर पड़े रहने—को बनाए रखता है और हिन्दी में दीर्घकालीन अशक्तता को स्वाभाविक रूप से बताता है।
- source_word: ὃς ἦν παραλελυμένος
  choice: उसे लकवा मार गया था
  rationale: परिपूर्ण कृदंत से व्यक्त स्थायी परिणामी दशा को साधारण आधुनिक हिन्दी में स्पष्ट करता है। इससे बीमारी को पहले वाक्यांश में निहित मानकर छोड़ा नहीं जाता।
