  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘खाट पर पड़ा’ मूल के ठोस चित्र को ‘बिस्तर पर पड़ा’ की अपेक्षा अधिक स्पष्टता से बनाए रखता है।
