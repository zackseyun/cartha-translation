  yaml_path: translation/nt/acts/009/014.yaml
  text: And here he has authority from the chief priests to bind all who call on your name[a].
translation:
  language: hi
  text: और यहाँ उसे प्रधान याजकों से उन सबको बाँधने का अधिकार है जो आपका नाम पुकारते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो आपके नाम का आह्वान करते हैं।” यूनानी अभिव्यक्ति किसी के नाम को पुकारने या उसका आह्वान करने का प्रचलित बाइबलीय मुहावरा है, जिसका प्रयोग अक्सर प्रार्थना के संदर्भ में होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧδε
  choice: यहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण है; प्रसंग में हनन्याह दमिश्क की बात कर रहा है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यह प्रधान याजकों से प्राप्त आधिकारिक अनुमति या प्राधिकार को व्यक्त करता है।
- source_word: παρὰ τῶν ἀρχιερέων
  choice: प्रधान याजकों से
  rationale: संबंधकारक के साथ παρά अधिकार के स्रोत को बताता है; बहुवचन ἀρχιερεῖς यरूशलेम के प्रधान-याजकीय नेतृत्व के लिए प्रयुक्त है।
- source_word: δῆσαι
  choice: बाँध ले
  rationale: यह मूल क्रिया के बाँधने के चित्र को बनाए रखता है, जबकि प्रसंग में इसका व्यावहारिक आशय बंदी बनाना है।
- source_word: πάντας τοὺς ἐπικαλουμένους
  choice: उन सबको ... जो ... पुकारते हैं
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत का अर्थ उन सभी व्यक्तियों से है जो किसी को पुकारते या उसका आह्वान करते हैं।
- source_word: τὸ ὄνομά σου
  choice: आपका नाम
  rationale: मूल पाठ की अभिव्यक्ति को सीधे रखता है; बाइबलीय प्रयोग में नाम व्यक्ति और उसके अधिकार का प्रतिनिधित्व कर सकता है।
theological_decisions:
- issue: यीशु को संबोधित करके ‘आपका नाम पुकारते हैं’ का आशय
  choice: मुहावरे को ‘आपका नाम पुकारते हैं’ के रूप में बनाए रखा गया है।
  alternative: ‘आपसे प्रार्थना करते हैं’ अथवा ‘आपके अधिकार की दुहाई देते हैं’
  rationale: यह अभिव्यक्ति प्रार्थनापूर्वक आह्वान और निष्ठा दोनों का भाव रख सकती है। सीधा अनुवाद यीशु की ओर निर्देशित भक्ति का धार्मिक महत्व सुरक्षित रखता है, पर किसी एक व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। आदरसूचक ‘आपका’ यीशु से सीधे संबोधन के लिए स्वाभाविक है। ‘बाँध ले’ मूल बिंब को बचाता है; पादटिप्पणी आह्वान और प्रार्थना की अर्थ-छाया स्पष्ट करती है।
