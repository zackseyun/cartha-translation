  text: καὶ εἶδαν αὐτὸν πάντες οἱ κατοικοῦντες Λύδδα καὶ τὸν ⸀Σαρῶνα, οἵτινες ἐπέστρεψαν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/035.yaml
  text: And all those living in Lydda and Sharon saw him[b][a], and they turned to the Lord.
translation:
  language: hi
  text: और लुद्दा और शारोन[a] में रहनेवाले सभी लोगों ने उसे देखा, और वे प्रभु की ओर मुड़े[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शारोन का क्षेत्र” अथवा “शारोन का मैदान।”
    reason: lexical_alternative
  - marker: b
    text: “प्रभु की ओर मुड़े” का अनुवाद “प्रभु के पास लौट आए” भी हो सकता है; अधिक व्याख्यात्मक रूप में, “प्रभु की ओर धर्मांतरित हुए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδαν
  choice: देखा
  rationale: यहाँ ὁράω का सामान्य अर्थ प्रत्यक्ष रूप से देखना है; लोगों ने चंगे हुए ऐनियास को देखा।
- source_word: πάντες οἱ κατοικοῦντες
  choice: रहनेवाले सभी लोग
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत κατοικοῦντες का अर्थ ‘रहनेवाले लोग’ है; πάντες की व्यापकता ‘सभी’ से बनी रहती है।
- source_word: Λύδδα
  choice: लुद्दा
  rationale: यूनानी स्थान-नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: τὸν Σαρῶνα
  choice: शारोन
  rationale: यह शारोन नामक क्षेत्र अथवा मैदान को सूचित करता है। मुख्य पाठ में स्वाभाविक स्थान-नाम रखा गया है और वैकल्पिक विस्तार पादटिप्पणी में दिया गया है।
- source_word: οἵτινες
  choice: और वे
  rationale: यह पहले बताए गए लोगों की अगली प्रतिक्रिया प्रस्तुत करता है; हिन्दी में ‘और वे’ घटनाक्रम को सहज और स्पष्ट रखता है।
- source_word: ἐπέστρεψαν ἐπὶ τὸν κύριον
  choice: प्रभु की ओर फिरे
  rationale: यह अभिव्यक्ति पश्चात्ताप और विश्वास के साथ प्रभु की ओर मुड़ने का भाव रखती है, पर ‘लौटे’ या ‘धर्मांतरित हुए’ जैसी अधिक विशिष्ट व्याख्या आरोपित नहीं करती।
- source_word: κύριον
  choice: प्रभु
  rationale: κύριος के लिए मानक और गरिमापूर्ण हिन्दी पद; मूल पाठ के समान नाम जोड़े बिना उपाधि को ही रखा गया है।
theological_decisions:
- issue: ‘प्रभु’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘प्रभु’
  alternative: ‘प्रभु यीशु’
  rationale: तात्कालिक संदर्भ से यीशु अभिप्रेत हैं, पर यूनानी पाठ में केवल τὸν κύριον है; इसलिए अनकहे नाम को जोड़ने के बजाय मूल की अभिव्यक्ति सुरक्षित रखी गई है।
- issue: ἐπέστρεψαν का बल
  choice: ‘प्रभु की ओर फिरे’
  alternative: ‘प्रभु के पास लौट आए’ अथवा ‘प्रभु में धर्मांतरित हुए’
  rationale: ‘फिरे’ दिशा-परिवर्तन, पश्चात्ताप और विश्वास का बाइबलीय भाव बनाए रखता है, बिना यह मान लेने के कि वे पहले प्रभु के थे या बिना बाद की धर्मशास्त्रीय शब्दावली थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, कथात्मक और गरिमापूर्ण शैली अपनाई गई है। ‘लुद्दा’ और ‘शारोन’ प्रचलित बाइबलीय स्थान-नाम हैं। ‘की ओर फिरे’ मूल यूनानी दिशा-बोध और धर्मशास्त्रीय तनाव दोनों को सुरक्षित रखता है।
