  text: Ὡς δὲ ἐπληροῦντο ἡμέραι ἱκαναί, συνεβουλεύσαντο οἱ Ἰουδαῖοι ἀνελεῖν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/023.yaml
  text: When many days had passed[c][b][a], the Jews conspired to kill him.
translation:
  language: hi
  text: जब बहुत दिन बीत गए,[a] तो यहूदियों[b] ने उसे मार डालने की साज़िश रची।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जब बहुत दिन पूरे हो रहे थे”; अर्थात काफ़ी समय बीत जाने पर।
    reason: lexical_alternative
  - marker: b
    text: मूल पाठ में “यहूदियों” है। संदर्भ में इसका आशय शाऊल का विरोध करने वाले एक विशेष समूह से है, न कि हर यहूदी व्यक्ति से।
    reason: cultural_note
  - marker: c
    text: या, “ने मिलकर योजना बनाई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: जब ... तो
  rationale: यह वाक्य में समय-संबंधी परिवर्तन दिखाता है। हिन्दी में ‘जब ... तो’ स्वाभाविक रूप से आश्रित और मुख्य उपवाक्य को जोड़ता है; δέ को अलग शब्द से व्यक्त करना आवश्यक नहीं।
- source_word: ἐπληροῦντο
  choice: बीत गए
  rationale: दिनों के विषय में πληρόω का भाव समय के पूरा होने या बीतने का है। ‘बीत गए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἡμέραι ἱκαναί
  choice: बहुत दिन
  rationale: ἱκαναί यहाँ पर्याप्तता मात्र नहीं, बल्कि दिनों की काफ़ी या बड़ी संख्या व्यक्त करता है। ‘बहुत दिन’ सरल और कथात्मक हिन्दी है।
- source_word: συνεβουλεύσαντο
  choice: साज़िश रची
  rationale: संदर्भ में यह क्रिया मिलकर घातक योजना बनाने का भाव देती है। ‘साज़िश रची’ सामूहिक विचार और शत्रुतापूर्ण उद्देश्य दोनों स्पष्ट करती है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदियों
  rationale: यूनानी पाठ का सीधा जातीय-धार्मिक पद सुरक्षित रखा गया है; पद स्वयं इसे केवल अगुओं तक सीमित नहीं करता। संदर्भगत सीमा पाद-टिप्पणी में स्पष्ट है।
- source_word: ἀνελεῖν
  choice: मार डालने
  rationale: यहाँ क्रिया किसी का प्राण लेने को दर्शाती है। ‘मार डालने’ सीधा और स्वाभाविक है तथा ‘हत्या’ जैसे अतिरिक्त कानूनी वर्गीकरण से बचता है।
- source_word: αὐτόν
  choice: उसे
  rationale: यह कर्मकारक सर्वनाम संदर्भ में शाऊल की ओर संकेत करता है; हिन्दी में ‘उसे’ इसका स्वाभाविक रूप है।
theological_decisions:
- issue: शत्रुतापूर्ण कथानक में οἱ Ἰουδαῖοι का अनुवाद
  choice: यहूदियों
  alternative: यहूदी अगुओं / यहूदिया के लोगों
  rationale: मूल पाठ के सामान्य पद को बिना पाठगत आधार के ‘अगुओं’ तक सीमित नहीं किया गया। साथ ही पाद-टिप्पणी यह स्पष्ट करती है कि संदर्भ में आशय शाऊल का विरोध करने वाले विशेष लोगों से है, हर यहूदी व्यक्ति से नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी की सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘जब ... तो’ समय-संबंध को स्वाभाविक बनाता है। ‘साज़िश रची’ सामान्य पाठक के लिए स्पष्ट है और συνεβουλεύσαντο के सामूहिक, शत्रुतापूर्ण आशय को व्यक्त करती है।
