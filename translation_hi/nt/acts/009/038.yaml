base_translation:
  language: en
  yaml_path: translation/nt/acts/009/038.yaml
  text: Since Lydda was near Joppa[a], the disciples, hearing that Peter was there, sent two men to him, urging, “Do not delay to come to us.”
translation:
  language: hi
  text: लुद्दा याफा के पास था, इसलिए जब चेलों ने सुना कि पतरस वहाँ है, तो उन्होंने उसके पास दो आदमियों को यह आग्रह करने भेजा, “हमारे पास आने में देर न कीजिए।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारे पास आने में संकोच न कीजिए।” इस क्रिया का अर्थ संकोच करना या देर करना हो सकता है; मुख्य पाठ में तत्काल अनुरोध के प्रसंग के अनुसार “देर” चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς δὲ οὔσης Λύδδας τῇ Ἰόππῃ
  choice: लुद्दा याफा के पास था। इसलिए
  rationale: सम्बन्धवाचक स्वतंत्र कृदन्त-रचना पृष्ठभूमि की परिस्थिति बताती है और यहाँ चेलों के कार्य का कारण भी सूचित करती है। दो स्वाभाविक हिन्दी वाक्यों में इसे व्यक्त करने से अर्थ स्पष्ट रहता है।
- source_word: Λύδδας
  choice: लुद्दा
  rationale: नए नियम में प्रचलित यूनानी स्थान-नाम का मानक हिन्दी लिप्यंतरण।
- source_word: Ἰόππῃ
  choice: याफा
  rationale: यूनानी Ἰόππη से सम्बद्ध बाइबलीय नगर का हिन्दी में परिचित रूप।
- source_word: οἱ μαθηταὶ
  choice: चेलों
  rationale: प्रेरितों के काम में μαθηταί के लिए सामान्य, स्पष्ट और प्रसंगानुकूल हिन्दी शब्द।
- source_word: ἀκούσαντες ὅτι Πέτρος ἐστὶν ἐν αὐτῇ
  choice: जब चेलों ने सुना कि पतरस वहाँ है
  rationale: कृदन्त को स्वाभाविक कालवाचक उपवाक्य में व्यक्त किया गया है; ‘वहाँ’ का संकेत लुद्दा की ओर है।
- source_word: ἀπέστειλαν δύο ἄνδρας πρὸς αὐτόν
  choice: उन्होंने दो पुरुषों को उसके पास ... भेजा
  rationale: मूल के व्यक्तियों की संख्या और उनके पतरस के पास भेजे जाने को सीधा बनाए रखता है।
- source_word: παρακαλοῦντες
  choice: यह आग्रह करने
  rationale: यहाँ क्रिया एक गंभीर और तत्काल अनुरोध व्यक्त करती है; ‘आग्रह’ भाव को न कम करता है, न अत्यधिक भावुक बनाता है।
- source_word: Μὴ ὀκνήσῃς
  choice: देर न कीजिए
  rationale: यात्रा के इस तत्काल अनुरोध में ὀκνέω का प्रसंगानुकूल अर्थ विलंब करना है; विनम्र बहुवचन-सम्मानसूचक रूप हिन्दी में स्वाभाविक है।
- source_word: διελθεῖν ἕως ἡμῶν
  choice: हमारे पास आने में
  rationale: वक्ताओं के दृष्टिकोण से पतरस की यात्रा को स्वाभाविक हिन्दी में व्यक्त करता है; मूल का गंतव्य ‘हमारे पास’ सुरक्षित है।
