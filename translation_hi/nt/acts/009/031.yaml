source:
  edition: SBLGNT
  text: ⸂Ἡ μὲν οὖν ἐκκλησία καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας εἶχεν εἰρήνην οἰκοδομουμένη, καὶ πορευομένη τῷ φόβῳ τοῦ κυρίου καὶ τῇ παρακλήσει τοῦ ἁγίου πνεύματος ἐπληθύνετο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/031.yaml
  text: So then the church throughout all Judea and Galilee and Samaria had peace and was being built up[a]; and walking in the fear of the Lord and in the encouragement of the Holy Spirit[b], it was multiplying.
translation:
  language: hi
  text: इस प्रकार, पूरे यहूदिया, गलील और सामरिया में कलीसिया[a] को शांति थी और वह सुदृढ़ होती जाती थी; और वह प्रभु के भय में चलती हुई, पवित्र आत्मा के प्रोत्साहन के साथ उसकी संख्या बढ़ती जाती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में ‘कलीसिया’ के स्थान पर ‘कलीसियाएँ’ है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐκκλησία
  choice: कलीसिया
  rationale: SBLGNT में शब्द एकवचन है और यहाँ तीनों क्षेत्रों में फैले विश्वासियों के एक सामूहिक समुदाय को दर्शाता है। आधुनिक हिन्दी बाइबल-प्रयोग में ‘कलीसिया’ इस अर्थ का परिचित और उपयुक्त शब्द है।
- source_word: καθ’ ὅλης τῆς Ἰουδαίας καὶ Γαλιλαίας καὶ Σαμαρείας
  choice: सारे यहूदिया, गलील और सामरिया में
  rationale: κατά का क्षेत्रव्यापी भाव ‘में’ तथा ὅλης का भाव ‘सारे’ से स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: εἶχεν εἰρήνην
  choice: को शांति मिली
  rationale: यूनानी मुहावरे का आशय शांति की अवस्था में होना है। ‘शांति मिली’ हिन्दी में स्वाभाविक है और उत्पीड़न से राहत तथा स्थिरता—दोनों की संभावना खुली रखता है।
- source_word: οἰκοδομουμένη
  choice: दृढ़ होती गई
  rationale: वर्तमान कर्मवाच्य कृदन्त कलीसिया के निरंतर संवर्धन और सुदृढ़ीकरण को व्यक्त करता है। शाब्दिक ‘निर्मित होती गई’ हिन्दी में भौतिक भवन का भ्रामक संकेत दे सकता है; ‘दृढ़ होती गई’ प्रसंगगत रूपक का स्वाभाविक अर्थ देता है।
- source_word: πορευομένη
  choice: चलती
  rationale: यहाँ चलना जीवन-आचरण का रूपक है। हिन्दी में ‘प्रभु के भय में चलना’ समझ में आने वाला बाइबलीय मुहावरा है और मूल रूपक को बनाए रखता है।
- source_word: τῷ φόβῳ τοῦ κυρίου
  choice: प्रभु के भय में
  rationale: यह चयन मूल अभिव्यक्ति को सुरक्षित रखता है, जिसमें श्रद्धापूर्ण भय, आदर और आज्ञाकारी जीवन निहित हैं; इसे केवल आतंक या सामान्य सम्मान तक सीमित नहीं किया गया।
- source_word: τῇ παρακλήσει τοῦ ἁγίου πνεύματος
  choice: पवित्र आत्मा के प्रोत्साहन से
  rationale: παράκλησις के अर्थ-क्षेत्र में प्रोत्साहन, सांत्वना और आग्रह सम्मिलित हैं। वृद्धि के इस प्रसंग में ‘प्रोत्साहन’ स्वाभाविक है, जबकि ‘से’ पवित्र आत्मा की सक्रिय सहायक भूमिका व्यक्त करता है।
- source_word: ἐπληθύνετο
  choice: संख्या में बढ़ती गई
  rationale: अपूर्णकालीन क्रिया निरंतर संख्यात्मक वृद्धि बताती है। ‘संख्या में बढ़ती गई’ आधुनिक हिन्दी में ‘बहुगुणित होती गई’ से अधिक स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: ἐκκλησία का वचन और संकेत
  choice: 'एकवचन सामूहिक अर्थ: ‘कलीसिया’'
  alternative: 'पाठांतर के अनुसार बहुवचन: ‘कलीसियाएँ’'
  rationale: दिए गए SBLGNT पाठ में संज्ञा, कृदन्त और क्रिया सभी एकवचन हैं। इसलिए मुख्य पाठ विभिन्न क्षेत्रों में उपस्थित एक कलीसिया को सामूहिक रूप में प्रस्तुत करता है; महत्त्वपूर्ण बहुवचन पाठांतर पादटिप्पणी में रखा गया है।
- issue: ‘प्रभु के भय’ का अर्थ
  choice: श्रद्धापूर्ण भय और आज्ञाकारी भक्ति
  alternative: प्रभु के सामने आतंक; अथवा केवल सामान्य धार्मिक आदर
  rationale: अनुवाद मूल धर्मवैचारिक अभिव्यक्ति को बनाए रखता है और उसे किसी एक संकुचित व्याख्या से प्रतिस्थापित नहीं करता।
- issue: पवित्र आत्मा से संबंधित παράκλησις का अर्थ
  choice: प्रोत्साहन
  alternative: सांत्वना अथवा समझाना/आग्रह
  rationale: प्रसंग में ‘प्रोत्साहन’ पवित्र आत्मा की संभालने और आगे बढ़ाने वाली भूमिका को उपयुक्त रूप से व्यक्त करता है। मूल शब्द की वास्तविक व्यापकता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘कलीसिया’ तथा ‘प्रभु के भय में चलना’ जैसे परिचित बाइबलीय पद मूल की धर्मवैचारिक गहराई बनाए रखते हैं। स्त्रीलिंग एकवचन क्रियाएँ यूनानी सामूहिक एकवचन के अनुरूप हैं।
