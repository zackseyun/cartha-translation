  text: ᾐτήσατο παρ’ αὐτοῦ ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς, ὅπως ἐάν τινας εὕρῃ τῆς ὁδοῦ ὄντας, ἄνδρας τε καὶ γυναῖκας, δεδεμένους ἀγάγῃ εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/002.yaml
  text: and asked him for letters to the synagogues in Damascus[a], so that if he found any belonging to the Way, both men and women, he might bring them bound to Jerusalem.
translation:
  language: hi
  text: और उससे दमिश्क के आराधनालयों के नाम पत्र माँगे, ताकि यदि उसे मार्ग[a] से जुड़े कोई लोग मिलें—पुरुष और स्त्रियाँ दोनों—तो वह उन्हें बाँधकर यरूशलेम ले आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मार्ग के।” “मार्ग” आरम्भिक मसीही आंदोलन के लिए प्रयुक्त एक नाम था। इसे “मार्ग के अनुयायी” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾐτήσατο παρ’ αὐτοῦ
  choice: उससे ... पत्र माँगे
  rationale: αἰτέω के साथ παρά + संबंधकारक उस व्यक्ति को बताता है जिससे अनुरोध किया गया। ‘उससे ... माँगे’ स्वाभाविक हिन्दी में अनुरोध और स्रोत दोनों को व्यक्त करता है।
- source_word: ἐπιστολὰς εἰς Δαμασκὸν πρὸς τὰς συναγωγάς
  choice: दमिश्क के आराधनालयों के नाम पत्र
  rationale: दोनों पूर्वसर्गीय पद दमिश्क में स्थित यहूदी आराधनालयों को संबोधित पत्रों की ओर संकेत करते हैं। ‘के नाम’ हिन्दी में पत्र के अभिप्रेत प्राप्तकर्ताओं को स्वाभाविक ढंग से व्यक्त करता है; पत्रों में अधिकार-पत्र होने का आशय संदर्भ में है, पर मूल संज्ञा में स्पष्ट न होने के कारण उसे जोड़ा नहीं गया।
- source_word: ὅπως ἐάν
  choice: ताकि यदि
  rationale: ὅπως उद्देश्य और ἐάν संभाव्यता या शर्त व्यक्त करता है। ‘ताकि यदि’ दोनों को सुरक्षित रखता है।
- source_word: τινας τῆς ὁδοῦ ὄντας
  choice: इस मार्ग से जुड़े हुए कोई भी लोग
  rationale: शर्त वाले संदर्भ में τινας के लिए ‘कोई भी लोग’ उपयुक्त है। τῆς ὁδοῦ आरम्भिक मसीही समुदाय का ऐतिहासिक नाम है; ‘इस मार्ग से जुड़े हुए’ संबंध को समझने योग्य बनाता है, जबकि ‘मार्ग’ की विशिष्ट पदवी को बनाए रखता है।
- source_word: ἄνδρας τε καὶ γυναῖκας
  choice: चाहे पुरुष हों या स्त्रियाँ
  rationale: τε καὶ दोनों समूहों को स्पष्ट रूप से सम्मिलित करता है। हिन्दी की यह रचना शाऊल की खोज और गिरफ्तारी के व्यापक दायरे पर वही बल देती है।
- source_word: δεδεμένους ἀγάγῃ
  choice: उन्हें बाँधकर ... ले आए
  rationale: δεδεμένους बँधी हुई अवस्था और ἀγάγῃ गंतव्य तक ले आने को व्यक्त करता है। ‘बाँधकर ... ले आए’ हिन्दी में इच्छित गिरफ्तारी और यरूशलेम लाने की क्रिया को स्वाभाविक रूप से जोड़ता है, बिना बेड़ियों या जंजीरों जैसी अतिरिक्त विशिष्टता जोड़े।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम ले आए
  rationale: εἰς नगर की ओर गमन का लक्ष्य बताता है। कथानक के दृष्टिकोण से ‘यरूशलेम ले आए’ स्वाभाविक है।
theological_decisions:
- issue: τῆς ὁδοῦ को आरम्भिक मसीही आंदोलन की पदवी के रूप में प्रस्तुत करना
  choice: इस मार्ग से जुड़े हुए
  alternative: मार्ग के; इस मार्ग के अनुयायी
  rationale: मूल में केवल संबंधकारक पद ‘मार्ग के’ है। चुना हुआ रूप हिन्दी पाठक के लिए संबंध स्पष्ट करता है, पर ‘मार्ग’ को सामान्यीकृत या बाद की संप्रदायगत उपाधि में नहीं बदलता। पादटिप्पणी अधिक शाब्दिक विकल्प और ऐतिहासिक प्रयोग बताती है।
- issue: ἄνδρας τε καὶ γυναῖκας में दोनों लिंगों का स्पष्ट उल्लेख
  choice: चाहे पुरुष हों या स्त्रियाँ
  alternative: पुरुषों और स्त्रियों दोनों को
  rationale: मूल पाठ शाऊल की अभिप्रेत गिरफ्तारियों में पुरुषों और स्त्रियों दोनों को स्पष्ट रूप से सम्मिलित करता है; इसे सामान्य ‘लोगों’ में विलीन नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘आराधनालय’ यहूदी synagogue के प्रचलित हिन्दी बाइबलीय अर्थ में प्रयुक्त है। वाक्य को पिछले पद से जुड़ी यूनानी संयोजक रचना के अनुरूप ‘और’ से आरम्भ किया गया है।
