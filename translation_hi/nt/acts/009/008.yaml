base_translation:
  language: en
  yaml_path: translation/nt/acts/009/008.yaml
  text: But Saul got up from the ground[a], and though his eyes were open, he saw nothing. So they led him by the hand and brought him into Damascus.
translation:
  language: hi
  text: पर शाऊल ज़मीन से उठा। उसकी आँखें खुली हुई थीं[a], फिर भी उसे कुछ दिखाई नहीं दे रहा था। वे उसका हाथ पकड़कर उसे दमिश्क में ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शब्दशः, “उसकी आँखें खोली जा चुकी थीं, और उसे कुछ दिखाई नहीं दे रहा था।” यूनानी रचना इस विडंबना पर बल देती है कि उसकी आँखें खुली थीं, फिर भी वह देख नहीं पा रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: उठा
  rationale: 'यहाँ रूप कर्मवाच्य होते हुए भी कथा में अकर्मक अर्थ देता है: शाऊल भूमि पर से उठ खड़ा हुआ। ‘उठा’ स्वाभाविक और संक्षिप्त हिन्दी है।'
- source_word: ἀπὸ τῆς γῆς
  choice: भूमि पर से
  rationale: संदर्भ में γῆ उस भूमि या जमीन को दर्शाता है जिस पर शाऊल गिरा था; इसका अर्थ विश्व के रूप में ‘पृथ्वी’ या भौगोलिक ‘देश’ नहीं है।
- source_word: ἀνεῳγμένων ... τῶν ὀφθαλμῶν αὐτοῦ
  choice: उसकी आँखें खुली हुई थीं
  rationale: यह संबंधकारक निरपेक्ष रचना साथ की परिस्थिति बताती है। अगले वाक्यांश के साथ ‘फिर भी’ जोड़कर खुली आँखों और न देख पाने का निहित विरोध स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: οὐδὲν ἔβλεπεν
  choice: उसे कुछ दिखाई नहीं दे रहा था
  rationale: यह पूर्ण दृष्टिहीनता की तत्कालीन दशा को सहज आधुनिक हिन्दी में व्यक्त करता है और यूनानी अपूर्णकाल की जारी अवस्था को भी दर्शाता है।
- source_word: χειραγωγοῦντες
  choice: उसका हाथ पकड़कर
  rationale: क्रिया का ठोस अर्थ किसी असमर्थ व्यक्ति को हाथ से मार्ग दिखाते हुए ले जाना है। यह अभिव्यक्ति उस दृश्य को बनाए रखती है।
- source_word: εἰσήγαγον εἰς Δαμασκόν
  choice: उसे दमिश्क में ले गए
  rationale: εἰσάγω किसी को भीतर ले जाने का अर्थ देता है। पूर्ववर्ती वाक्यांश पहले ही हाथ पकड़ने की रीति बताता है, इसलिए यह हिन्दी में अनावश्यक दोहराव से बचता है।
- source_word: δὲ
  choice: पर / फिर भी / इसलिए
  rationale: तीनों δέ कथा की प्रगति और हल्का विरोध दर्शाते हैं। हिन्दी में संदर्भानुसार ‘पर’, निहित विरोध के लिए ‘फिर भी’, और परिणामी अगली क्रिया के लिए ‘इसलिए’ स्वाभाविक हैं।
- source_word: Σαῦλος
  choice: शाऊल
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय लिप्यंतरण।
- source_word: Δαμασκόν
  choice: दमिश्क
  rationale: स्थाननाम का प्रचलित मानक हिन्दी रूप।
