  text: ἐγένετο ⸀δὲ ἡμέρας ἱκανὰς ⸀μεῖναι ἐν Ἰόππῃ παρά τινι Σίμωνι βυρσεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/043.yaml
  text: And he stayed in Joppa for many days with a certain Simon[a], a tanner.
translation:
  language: hi
  text: और पतरस बहुत दिनों तक याफा में शमौन नाम के एक व्यक्ति[a] के यहाँ रहा, जो चमड़ा पकाने का काम करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शमौन नाम के एक व्यक्ति के साथ।” यूनानी पूर्वसर्ग का अर्थ किसी व्यक्ति के साथ अथवा उसके घर में ठहरना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... μεῖναι
  choice: रहा
  rationale: ἐγένετο के साथ infinitive यहाँ एक स्वाभाविक कथात्मक प्रयोग है। हिन्दी में मुख्य क्रिया ‘रहा’ अर्थ को सहज रूप से व्यक्त करती है; ‘ऐसा हुआ कि वह रहा’ अनावश्यक रूप से शब्दशः होता।
- source_word: δὲ
  choice: और
  rationale: δέ कथा को हल्के संयोजक के रूप में आगे बढ़ाता है; ‘और’ बिना किसी अनावश्यक विरोध का भाव जोड़े प्रवाह बनाए रखता है।
- source_word: ἡμέρας ἱκανὰς
  choice: बहुत दिनों तक
  rationale: समय-सूचक अभिव्यक्ति के साथ ἱκανός पर्याप्त या उल्लेखनीय अवधि, अर्थात ‘बहुत दिन’, का बोध देता है।
- source_word: ἐν Ἰόππῃ
  choice: याफा में
  rationale: Ἰόππη प्राचीन बंदरगाह नगर याफा का नाम है; हिन्दी बाइबलीय परंपरा में प्रचलित और पहचाने जाने योग्य रूप ‘याफा’ रखा गया है।
- source_word: παρά τινι Σίμωνι
  choice: शमौन नाम के एक व्यक्ति के यहाँ
  rationale: παρά के साथ dative किसी व्यक्ति के पास अथवा उसके घर ठहरने का संकेत दे सकता है। ‘के यहाँ’ निवास का स्थान स्वाभाविक हिन्दी में व्यक्त करता है, और τινι की अनिश्चितता ‘एक व्यक्ति’ से बनी रहती है।
- source_word: βυρσεῖ
  choice: जो चमड़ा पकाने का काम करता था
  rationale: βυρσεύς उस कारीगर को दर्शाता है जो पशु-खाल को संसाधित करके चमड़ा तैयार करता है। सामान्य पाठक के लिए ‘चमड़ा पकाने का काम करता था’ सटीक और ‘चर्मकार’ की अपेक्षा अधिक स्पष्ट है।
