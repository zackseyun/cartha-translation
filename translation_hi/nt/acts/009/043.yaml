translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पतरस का नाम यूनानी वाक्य में निहित कर्ता के रूप में पिछले संदर्भ से आता है; स्वतंत्र पद के रूप में स्पष्टता हेतु उसे व्यक्त किया गया है। व्यवसाय को दुर्लभ पदवी के बजाय सामान्य पाठक के लिए स्पष्ट वर्णन से प्रस्तुत किया गया है।
