  text: οἱ δὲ ἄνδρες οἱ συνοδεύοντες αὐτῷ εἱστήκεισαν ἐνεοί, ἀκούοντες μὲν τῆς φωνῆς μηδένα δὲ θεωροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/007.yaml
  text: The men traveling with him stood speechless[a], hearing the voice but seeing no one.
translation:
  language: hi
  text: उसके साथ यात्रा कर रहे पुरुष अवाक् खड़े थे; वे आवाज़[a] तो सुन रहे थे, पर किसी को देख नहीं रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ध्वनि’। यूनानी शब्द का अर्थ ‘आवाज़’ या ‘ध्वनि’ दोनों हो सकता है। प्रेरितों 22:9 से तुलना करें।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄνδρες
  choice: जो पुरुष…वे
  rationale: δέ हल्का संयोजक या विरोधसूचक है; हिन्दी में संबंधवाचक संरचना वाक्य को स्वाभाविक रूप से आगे बढ़ाती है और अनावश्यक रूप से तीखा विरोध नहीं जोड़ती।
- source_word: οἱ συνοδεύοντες αὐτῷ
  choice: उसके साथ यात्रा कर रहे थे
  rationale: συνοδεύω किसी के साथ यात्रा करने को दर्शाता है; यह अनुवाद यात्रा के प्रसंग और साथ होने, दोनों को स्पष्ट रखता है।
- source_word: εἱστήκεισαν
  choice: खड़े रह गए
  rationale: ἵστημι का यह रूप खड़ी अवस्था को दर्शाता है; प्रसंग में ‘खड़े रह गए’ उनके अचानक स्तब्ध होकर वहीं खड़े रहने को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह दावा किए कि यूनानी क्रिया स्वयं रुकने की पूरी घटना बताती है।
- source_word: ἐνεοί
  choice: अवाक्
  rationale: ἐνεός बोल न पाने या स्तब्ध होकर मौन रह जाने का भाव देता है। ‘अवाक्’ संक्षेप में वाणीहीन स्तब्धता व्यक्त करता है।
- source_word: ἀκούοντες μὲν τῆς φωνῆς
  choice: आवाज़ तो सुन रहे थे
  rationale: φωνή का अर्थ ‘आवाज़’ या ‘ध्वनि’ हो सकता है। ‘आवाज़’ हिन्दी में इस अर्थ-सीमा को काफी हद तक खुला रखती है; ‘तो’ μέν के प्रतितुलनात्मक बल को आगे आने वाले ‘पर’ के साथ व्यक्त करता है।
- source_word: μηδένα δὲ θεωροῦντες
  choice: पर किसी को देख नहीं रहे थे
  rationale: θεωρέω यहाँ देखने का अर्थ देता है और μηδένα किसी भी व्यक्ति के दिखाई न देने को स्पष्ट करता है।
theological_decisions:
- issue: प्रेरितों 9:7 और 22:9 में शाऊल के साथियों के सुनने के विषय में दिखाई देने वाला तनाव
  choice: मुख्य पाठ में ‘आवाज़’ रखकर और पादटिप्पणी में φωνή की ‘ध्वनि’ वाली अर्थ-संभावना बताकर अस्पष्टता सुरक्षित रखी गई है।
  alternative: मुख्य पाठ में केवल ‘ध्वनि’ लिखकर दोनों विवरणों में स्पष्ट सामंजस्य दिखाना।
  rationale: मूल शब्द दोनों अर्थों की अनुमति देता है। ‘आवाज़’ निकट और स्वाभाविक अनुवाद है, जबकि पादटिप्पणी वास्तविक शब्दार्थगत विकल्प बताती है; इससे अनुवाद यह निर्धारित नहीं करता कि साथियों ने केवल ध्वनि सुनी या वाणी को समझा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘अवाक्’ परिचित साहित्यिक शब्द है और ‘स्तब्ध’ की अपेक्षा बोल न पाने के भाव को अधिक ठीक व्यक्त करता है। पादटिप्पणी-चिह्न उसी शब्द के बाद रखा गया है जिससे वह संबंधित है।
