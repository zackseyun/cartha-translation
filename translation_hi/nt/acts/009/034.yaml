source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Πέτρος· Αἰνέα, ἰᾶταί σε Ἰησοῦς ⸀Χριστός· ἀνάστηθι καὶ στρῶσον σεαυτῷ· καὶ εὐθέως ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/034.yaml
  text: And Peter said to him[a], “Aeneas, Jesus the Messiah heals you[b]. Get up and make your bed.” And immediately he got up.
translation:
  language: hi
  text: और पतरस ने उससे कहा, “ऐनियास, यीशु मसीह[a] तुम्हें चंगा करते हैं। उठो और अपने लिए बिछौना बिछाओ[b]।” और वह तुरंत उठ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु ख्रीस्त।” यूनानी Χριστός एक उपाधि है, जिसका अर्थ “मसीह,” अर्थात् “अभिषिक्त जन,” है।
    reason: alternative_reading
  - marker: b
    text: या, “अपना बिछौना बिछाओ।”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰᾶταί
  choice: चंगा करते हैं
  rationale: यूनानी वर्तमानकालीन क्रिया यहाँ पतरस की प्रभावकारी घोषणा है। ‘चंगा करते हैं’ वर्तमानकाल को बनाए रखता है और इसे न तो स्पष्ट रूप से जारी प्रक्रिया बनाता है, न पूर्ण हो चुका कार्य। यीशु के लिए आदरसूचक बहुवचन आधुनिक हिंदी के अनुरूप है।
- source_word: Χριστός
  choice: मसीह
  rationale: यहाँ Χριστός यीशु की उपाधि के रूप में आया है। ‘मसीह’ उसके अभिषिक्त जन संबंधी अर्थ को सुरक्षित रखता है।
- source_word: ἀνάστηθι
  choice: उठो
  rationale: बिस्तर पर पड़े व्यक्ति को दिया गया सीधा आदेश; आधुनिक हिंदी में स्वाभाविक और स्पष्ट।
- source_word: στρῶσον σεαυτῷ
  choice: अपना बिछौना स्वयं बिछाओ
  rationale: στρώννυμι बिछौना फैलाने या तैयार करने का भाव देता है, जबकि सेαυτῷ व्यक्ति के स्वयं यह करने पर बल देता है। हिंदी में निहित कर्म को ‘बिछौना’ से स्पष्ट किया गया है।
- source_word: εὐθέως
  choice: तुरंत
  rationale: कार्य के बिना विलंब घटित होने को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀνέστη
  choice: उठ गया
  rationale: आदेश के तत्काल परिणाम को बताता है और पहले आए ‘उठो’ से शब्दगत संबंध बनाए रखता है।
- source_word: Αἰνέα
  choice: ऐनियास
  rationale: यूनानी व्यक्तिगत नाम का हिंदी ध्वन्यात्मक लिप्यंतरण।
theological_decisions:
- issue: चंगाई की घोषणा में Χριστός का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीस्त
  rationale: संदर्भ में Χριστός उपाधि है; ‘मसीह’ उसके अर्थ और उपाधिगत स्वरूप को हिंदी पाठक के लिए स्पष्ट रखता है।
- issue: ἰᾶταί के वर्तमानकाल का अर्थ
  choice: तुम्हें चंगा करते हैं
  alternative: तुम्हें चंगा कर चुके हैं
  rationale: यूनानी वर्तमानकाल को बनाए रखते हुए चंगाई की घोषणा की प्रभावकारी शक्ति व्यक्त की गई है; पूर्णकालीन विकल्प संदर्भतः संभव है, पर वह क्रिया के रूप को आवश्यकता से अधिक निश्चित कर देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में ‘तुम’ के अनुरूप ‘उठो’ प्रयुक्त है, जबकि यीशु के लिए आदरसूचक बहुवचन ‘करते हैं’ रखा गया है। ‘बिछौना’ प्रसंग के अनुकूल है और किसी विशिष्ट प्रकार के पलंग या चटाई को अनावश्यक रूप से निश्चित नहीं करता।
