  terminology: “प्रभु” is an appropriate main-text rendering of κύριε in this revelatory context, while the footnote responsibly preserves the viable respectful-address sense “महोदय.” “यीशु” is standard, and “सता रहे हो” is a natural contextual expression for persecution.
