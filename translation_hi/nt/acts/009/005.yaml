  text: εἶπεν δέ· Τίς εἶ, κύριε; ὁ ⸀δέ· Ἐγώ εἰμι Ἰησοῦς ὃν σὺ διώκεις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/005.yaml
  text: And he said[a], “Who are you, Lord?” And he said, “I am Jesus, whom you are persecuting.”
translation:
  language: hi
  text: उसने कहा, “प्रभु[a], आप कौन हैं?” उन्होंने कहा, “मैं यीशु हूँ, जिसे तुम सता रहे हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महोदय।” यूनानी κύριε आदरसूचक संबोधन भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δέ
  choice: उसने कहा
  rationale: यूनानी में कर्ता निहित है और δέ हल्का कथात्मक संयोजक है। हिन्दी में यहाँ बिना अतिरिक्त ‘और’ के वाक्य अधिक स्वाभाविक है, जबकि घटनाक्रम का संबंध संदर्भ से स्पष्ट रहता है।
- source_word: Τίς εἶ
  choice: आप कौन हैं
  rationale: यह प्रश्न का सीधा और स्वाभाविक हिन्दी रूप है। स्वर्गीय वक्ता को संबोधित करते समय आदरसूचक ‘आप’ उपयुक्त है।
- source_word: κύριε
  choice: प्रभु
  rationale: κύριε का अर्थ आदरसूचक ‘महोदय’ भी हो सकता है, पर इस प्रकाशनात्मक प्रसंग में ‘प्रभु’ उसके व्यापक नवविधानिक और धर्मवैचारिक बल को बनाए रखता है; संभावित वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ὁ δέ
  choice: उन्होंने कहा
  rationale: यह प्रत्युत्तर को आगे बढ़ाने वाला हल्का संयोजक है। हिन्दी में आदरसूचक क्रिया के साथ इसका स्वाभाविक कथात्मक रूप ‘उन्होंने कहा’ है।
- source_word: Ἐγώ εἰμι Ἰησοῦς
  choice: मैं यीशु हूँ
  rationale: यह जोरदार सर्वनाम सहित आत्म-परिचय का सीधा रूप है और पाठ में निहित अर्थ से आगे कोई अतिरिक्त धर्मवैचारिक दावा नहीं जोड़ता।
- source_word: ὃν σὺ διώκεις
  choice: जिसे तुम सता रहे हो
  rationale: ‘जिसे’ यीशु को प्रत्यक्ष कर्म के रूप में रखता है। स्पष्ट σὺ के बल को संबोधन में ‘तुम’ से व्यक्त किया गया है, और वर्तमानकालीन διώκεις के जारी विरोध को ‘सता रहे हो’ स्वाभाविक हिन्दी में दर्शाता है।
theological_decisions:
- issue: पहचान प्रकट होने से पहले शाऊल के संबोधन κύριε का अनुवाद
  choice: प्रभु
  alternative: महोदय
  rationale: यूनानी शब्द आदरसूचक संबोधन और ‘प्रभु’ दोनों अर्थ दे सकता है। स्वर्गीय प्रकाशन और वक्ता के यीशु के रूप में तत्काल परिचय के कारण मुख्य पाठ में ‘प्रभु’ रखा गया है, किंतु इस बिंदु पर शाऊल की समझ को आवश्यकता से अधिक निश्चित न करने के लिए ‘महोदय’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। शाऊल की ओर से स्वर्गीय वक्ता के लिए आदरसूचक ‘आप’ और उत्तर में उसके लिए ‘तुम’ रखा गया है; यह हिन्दी के स्वाभाविक संबोधन-स्तरों को दर्शाता है।
