source:
  edition: SBLGNT
  text: Παραγενόμενος δὲ ⸀εἰς Ἰερουσαλὴμ ⸀ἐπείραζεν κολλᾶσθαι τοῖς μαθηταῖς· καὶ πάντες ἐφοβοῦντο αὐτόν, μὴ πιστεύοντες ὅτι ἐστὶν μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/026.yaml
  text: And when he came to Jerusalem[a], he was trying to join the disciples, but they were all afraid of him, not believing that he was a disciple.
translation:
  language: hi
  text: जब वह यरूशलेम पहुँचा, तो वह शिष्यों से जुड़ने[a] की कोशिश करता रहा; पर वे सब उससे डरते थे, क्योंकि वे विश्वास नहीं करते थे कि वह शिष्य है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शिष्यों से अपने को मिला लेने की।”
    reason: κολλᾶσθαι के शाब्दिक ‘अपने को उनसे जोड़ने/मिला लेने’ के भाव का lexical alternative।
lexical_decisions:
- source_word: Παραγενόμενος
  choice: जब वह…पहुँचा
  rationale: अोरिस्ट कृदंत मुख्य क्रिया से पहले की परिस्थिति बताता है। यह रूप हिंदी में स्वाभाविक ढंग से उसका कालगत संबंध व्यक्त करता है।
- source_word: δὲ
  choice: तो
  rationale: यह हल्का कथात्मक संयोजक है; ‘जब…तो’ हिंदी में प्रसंग को आगे बढ़ाने वाला स्वाभाविक संबंध बनाता है, बिना अनावश्यक विरोध जोड़े।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम पहुँचा
  rationale: नगर की ओर जाकर वहाँ पहुँचने का भाव हिंदी में ‘यरूशलेम पहुँचा’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: ἐπείραζεν
  choice: कोशिश करता रहा
  rationale: अपूर्ण भूतकाल जारी या बार-बार किए गए प्रयास का संकेत दे सकता है; ‘कोशिश करता रहा’ इस अपूर्णतापरक पक्ष को स्पष्ट और सहज रखता है।
- source_word: κολλᾶσθαι
  choice: के साथ जुड़ने
  rationale: इसका मूल भाव चिपकने या अपने को जोड़ने का है। यहाँ सामाजिक संदर्भ में ‘साथ जुड़ने’ से शिष्यों के समुदाय में स्वीकार किए जाने का प्रयास व्यक्त होता है, किसी औपचारिक सदस्यता-विधि का संकेत दिए बिना।
- source_word: τοῖς μαθηταῖς
  choice: शिष्यों के साथ
  rationale: यह यरूशलेम के परिचित शिष्य-समूह को दर्शाता है; हिंदी में संबंध को ‘के साथ’ से स्वाभाविक रूप मिलता है।
- source_word: καὶ πάντες ἐφοβοῦντο αὐτόν
  choice: पर वे सब उससे डरते थे
  rationale: यहाँ अगली बात पिछले प्रयास के विपरीत परिणाम दिखाती है, इसलिए ‘पर’ स्वाभाविक है। ‘वे’ का संदर्भ शिष्यों से है और अपूर्ण भूतकाल को ‘डरते थे’ व्यक्त करता है।
- source_word: μὴ πιστεύοντες
  choice: क्योंकि उन्हें विश्वास नहीं था
  rationale: वर्तमान कृदंत उनके डर का कारण बताता है। हिंदी में स्पष्ट कारणवाचक उपवाक्य अधिक स्वाभाविक है और अर्थ को नहीं बढ़ाता।
- source_word: ὅτι ἐστὶν μαθητής
  choice: कि वह शिष्य है
  rationale: यूनानी में ἐστίν वर्तमानकाल है। हिंदी में अप्रत्यक्ष कथन के भीतर वर्तमान ‘है’ सहज है और मूल काल को सुरक्षित रखता है।
- source_word: μαθητής
  choice: शिष्य
  rationale: ‘शिष्य’ प्रेरितों के काम में μαθητής के लिए स्थापित, सटीक और सामान्यतः समझा जाने वाला पद है।
theological_decisions:
- issue: यरूशलेम के विश्वासियों से शाऊल के इच्छित संबंध की प्रकृति
  choice: ‘शिष्यों के साथ जुड़ने’
  alternative: ‘शिष्यों से अपने को मिला लेने’ या ‘शिष्यों की संगति में रहने’
  rationale: पाठ शाऊल के उस समुदाय के साथ निकट संबंध और स्वीकृति पाने के प्रयास को बताता है, न कि किसी औपचारिक कलीसियाई सदस्यता या संस्कार को। चुना हुआ रूप सामाजिक-सामुदायिक भाव को बनाए रखता है।
- issue: ὅτι ἐστὶν μαθητής में वर्तमानकाल
  choice: ‘कि वह शिष्य है’
  alternative: ‘कि वह शिष्य था’
  rationale: मूल यूनानी वर्तमानकाल रखता है। हिंदी में इसे बनाए रखना स्वाभाविक है और उस समय शाऊल की वास्तविक शिष्य-पहचान के दावे को अनावश्यक रूप से भूतकाल में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘शिष्य’ जैसे स्थापित बाइबलीय पद को रखा गया है। अपूर्ण भूतकाल के भाव को ‘कोशिश करता रहा’ और ‘डरते थे’ से व्यक्त किया गया है। किसी पाद-टिप्पणी की आवश्यकता नहीं पड़ी।
