  text: ἐλάλει τε καὶ συνεζήτει πρὸς τοὺς Ἑλληνιστάς· οἱ δὲ ἐπεχείρουν ⸂ἀνελεῖν αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/029.yaml
  text: And he was speaking and debating with the Hellenists[a], but they were attempting to kill him.
translation:
  language: hi
  text: वह यूनानी-भाषी यहूदियों से बातें करता और वाद-विवाद करता था, पर वे उसे मार डालने का प्रयास कर रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλει
  choice: बातें करता था
  rationale: अपूर्ण भूतकाल चलती या बार-बार होने वाली क्रिया दिखाता है; ‘बातें करता था’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τε καὶ
  choice: और
  rationale: यह दोनों समन्वित क्रियाओं को जोड़ता है; हिन्दी में साधारण ‘और’ स्वाभाविक और पर्याप्त है।
- source_word: συνεζήτει
  choice: वाद-विवाद करता था
  rationale: यहाँ क्रिया केवल सामान्य चर्चा नहीं, बल्कि सक्रिय तर्क-वितर्क का बोध कराती है; आगे की शत्रुतापूर्ण प्रतिक्रिया भी इसी अर्थ के अनुकूल है।
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: हेलेनवादियों से
  rationale: चर्चा या वाद-विवाद के प्रसंग में πρός परस्पर संवाद का संबंध बताता है; हिन्दी में ‘से’ स्वाभाविक है।
- source_word: Ἑλληνιστάς
  choice: हेलेनवादियों
  rationale: समूह के विशिष्ट सामाजिक-भाषायी नाम को मुख्य पाठ में सुरक्षित रखा गया है; पाठकों की स्पष्टता के लिए पादटिप्पणी में इसका अर्थ दिया गया है।
- source_word: οἱ δὲ
  choice: पर वे
  rationale: δέ शाऊल की गतिविधि और उनके विरोधी प्रत्युत्तर के बीच स्पष्ट विरोध दर्शाता है।
- source_word: ἐπεχείρουν
  choice: कोशिश कर रहे थे
  rationale: अपूर्ण भूतकाल जारी या बार-बार किए जा रहे प्रयास को व्यक्त करता है; यह हिन्दी में सहज रूप है।
- source_word: ἀνελεῖν αὐτόν
  choice: उसे मार डालने की
  rationale: इस प्रसंग में ἀναιρέω का अर्थ प्राण लेना या हत्या करना है; ‘मार डालना’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: Ἑλληνιστάς की पहचान
  choice: हेलेनवादी—अर्थात यूनानी-भाषी यहूदी
  alternative: यूनानी लोग अथवा सामान्यतः यूनानी-भाषी लोग
  rationale: प्रेरितों के काम में यह पद एक पहचाने हुए सामाजिक-भाषायी यहूदी समूह को सूचित करता है, विशेषकर 6:1 के प्रयोग के प्रकाश में। मुख्य पाठ विशिष्ट पद को बनाए रखता है और पादटिप्पणी उसका अर्थ स्पष्ट करती है, ताकि इसे गैर-यहूदी यूनानियों का सामान्य उल्लेख न समझा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। अपूर्ण भूतकाल की पुनरावृत्त/चलती क्रियाओं को ‘करता था’ और ‘कर रहे थे’ से व्यक्त किया गया है।
