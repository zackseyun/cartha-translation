  text: Ἐγένετο δὲ Πέτρον διερχόμενον διὰ πάντων κατελθεῖν καὶ πρὸς τοὺς ἁγίους τοὺς κατοικοῦντας Λύδδα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/032.yaml
  text: As Peter was passing through all of them, he also went down to the saints living in Lydda.
translation:
  language: hi
  text: जब पतरस सब जगह[a] घूम रहा था, तब वह लुद्दा में रहनेवाले पवित्र जनों के पास भी गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सबके बीच से।” इसका आशय सभी क्षेत्रों या सभी विश्वासियों के बीच घूमने से हो सकता है।
    reason: διὰ πάντων में ‘सब’ का निहित संदर्भ अस्पष्ट है; पादटिप्पणी दोनों प्रमुख संभावनाएँ सुरक्षित रखती है।
lexical_decisions:
- source_word: διὰ πάντων
  choice: सब जगह
  rationale: यूनानी वाक्यांश में ‘सब’ का संदर्भ स्पष्ट रूप से व्यक्त नहीं है; प्रसंग में पतरस का विभिन्न स्थानों या समुदायों के बीच घूमना अभिप्रेत है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: τοὺς ἁγίους
  choice: पवित्र जनों
  rationale: यह यीशु के विश्वासियों के लिए प्रयुक्त सामुदायिक पद है; ‘पवित्र जन’ आधुनिक हिन्दी में अर्थपूर्ण और धार्मिक गरिमा के अनुरूप है।
- source_word: κατελθεῖν ... πρὸς
  choice: के पास भी गया
  rationale: क्रिया का मूल अर्थ ‘नीचे जाना/उतरना’ है, पर हिन्दी में यहाँ भौगोलिक दिशा पर अनावश्यक बल दिए बिना गंतव्य तक जाने का स्वाभाविक भाव व्यक्त किया गया है।
- source_word: Λύδδα
  choice: लुद्दा
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
