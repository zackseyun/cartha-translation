language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἦν δέ τις μαθητὴς ἐν Δαμασκῷ ὀνόματι Ἁνανίας, καὶ εἶπεν πρὸς αὐτὸν ⸂ἐν ὁράματι ὁ κύριος⸃· Ἁνανία. ὁ δὲ εἶπεν· Ἰδοὺ ἐγώ, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/010.yaml
  text: There was a disciple in Damascus named Ananias, and the Lord said to him in a vision, “Ananias.” And he said, “Here I am, Lord.”
translation:
  language: hi
  text: दमिश्क में हनन्याह नाम का एक शिष्य था। प्रभु ने दर्शन में उससे कहा, “हनन्याह!” उसने कहा, “मैं यहाँ हूँ, प्रभु।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: था
  rationale: अपूर्णकालीन ἦν नए पात्र और दृश्य का परिचय देता है, जबकि δέ हल्का कथात्मक संक्रमण है। हिंदी में अलग आरंभिक संयोजक जोड़े बिना वाक्य का स्वाभाविक आरंभ यह कार्य करता है।
- source_word: τις μαθητὴς
  choice: एक शिष्य
  rationale: τις यहाँ अनिश्चित रूप से पहली बार व्यक्ति का परिचय देता है; आधुनिक हिंदी में ‘एक शिष्य’ स्वाभाविक है और ‘कोई निश्चित शिष्य’ जैसी अनावश्यक जड़ता से बचता है।
- source_word: ἐν Δαμασκῷ
  choice: दमिश्क में
  rationale: ἐν और संबंधसूचक रूप स्थान बताते हैं; ‘दमिश्क’ प्रचलित हिंदी नाम है।
- source_word: ὀνόματι Ἁνανίας
  choice: हनन्याह नाम का
  rationale: ὀνόματι नाम बताने का मुहावरेदार प्रयोग है। ‘हनन्याह नाम का’ हिंदी में संक्षिप्त और सहज है।
- source_word: ἐν ὁράματι
  choice: दर्शन में
  rationale: यह उस माध्यम या परिस्थिति को बताता है जिसमें प्रभु ने संबोधित किया; ‘दर्शन में’ स्थापित और स्पष्ट हिंदी अभिव्यक्ति है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: संदर्भ में यह पुनरुत्थित यीशु की ओर संकेत करता है। हिंदी में निश्चितता व्यक्त करने के लिए उपपद आवश्यक नहीं है।
- source_word: εἶπεν πρὸς αὐτόν
  choice: उससे कहा
  rationale: λέγω के साथ πρός और कर्मकारक का सीधा, स्वाभाविक हिंदी रूप ‘उससे कहा’ है।
- source_word: Ἁνανία
  choice: हनन्याह
  rationale: यह संबोधन रूप में प्रयुक्त व्यक्तिवाचक नाम है; पुकार को विरामचिह्न से स्पष्ट किया गया है।
- source_word: Ἰδοὺ ἐγώ
  choice: जी, ... मैं यहाँ हूँ
  rationale: यह उपस्थित होने, ध्यान देने और तत्परता व्यक्त करने वाला पारंपरिक उत्तर है। ‘मैं यहाँ हूँ’ मूल अर्थ रखता है और ‘जी’ हिंदी संवाद में आदरपूर्ण प्रत्युत्तर की स्वाभाविकता देता है।
- source_word: κύριε
  choice: प्रभु
  rationale: यद्यपि कुछ संदर्भों में κύριε का अर्थ ‘महोदय’ हो सकता है, यहाँ हनन्याह दर्शन में दिव्य वक्ता को उत्तर दे रहा है; इसलिए ‘प्रभु’ उपयुक्त है।
theological_decisions:
- issue: दर्शन में ὁ κύριος और κύριε का संदर्भ
  choice: दोनों के लिए ‘प्रभु’, अर्थात पुनरुत्थित यीशु
  alternative: सामान्य दिव्य संबोधन अथवा ‘महोदय’
  rationale: प्रेरितों के काम 9 के आगे के संदर्भ में यही प्रभु शाऊल के विषय में हनन्याह को आदेश देता है और शाऊल को अपना चुना हुआ साधन कहता है। ‘प्रभु’ मूल की मसीह-संबंधी शक्ति बनाए रखता है, पर पाठ में ‘यीशु’ जोड़कर निहित संदर्भ को अनावश्यक रूप से स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। कथात्मक प्रवाह के लिए दो वाक्य किए गए हैं। ‘जी, प्रभु, मैं यहाँ हूँ’ आदर और तत्परता दोनों व्यक्त करता है; कोई पादटिप्पणी आवश्यक नहीं।
