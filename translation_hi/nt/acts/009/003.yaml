  yaml_path: translation/nt/acts/009/003.yaml
  text: As he was traveling[a], it happened that he was drawing near to Damascus, and suddenly a light from heaven flashed around him.
translation:
  language: hi
  text: जब वह यात्रा कर रहा था और दमिश्क के निकट आ रहा था, तो ऐसा हुआ कि अचानक स्वर्ग[a] से एक प्रकाश उसके चारों ओर चमक उठा।
  philosophy: optimal-equivalence
  footnotes:
