    text: या ‘आकाश से।’ यूनानी शब्द οὐρανός का अर्थ ‘स्वर्ग’ या ‘आकाश’ दोनों हो सकता है, हालाँकि इस प्रसंग में ‘स्वर्ग’ संभवतः प्रकाश के दिव्य स्रोत की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ τῷ πορεύεσθαι
  choice: जब वह यात्रा करते हुए
  rationale: ἐν के साथ प्रयुक्त substantival infinitive समकालीन क्रिया व्यक्त करता है; यह अनुवाद ‘जब/जिस समय वह यात्रा कर रहा था’ का स्वाभाविक हिन्दी रूप है। δέ का हल्का कथात्मक संबंध हिन्दी वाक्य-संरचना में निहित है, इसलिए अलग से ‘अब’ नहीं जोड़ा गया।
- source_word: ἐγένετο
  choice: तो ऐसा हुआ कि
  rationale: लूका की कथात्मक अभिव्यक्ति को स्पष्ट रखते हुए यह घटना के घटित होने और अगले अकस्मात प्रसंग की भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αὐτὸν ἐγγίζειν τῇ Δαμασκῷ
  choice: वह दमिश्क के निकट पहुँच रहा था
  rationale: वर्तमान infinitive की जारी प्रक्रिया को ‘पहुँच रहा था’ व्यक्त करता है; dative स्थान को ‘दमिश्क के निकट’ कहना नगर में प्रवेश के बजाय उसके पास आने का अर्थ सुरक्षित रखता है।
- source_word: ἐξαίφνης τε
  choice: कि अचानक
  rationale: ἐξαίφνης घटना की आकस्मिकता बताता है; τε का हल्का संयोजक बल हिन्दी वाक्य-संबंध में स्वाभाविक रूप से समाहित है।
- source_word: περιήστραψεν
  choice: उसके चारों ओर चमक उठी
  rationale: compound verb चारों ओर प्रकाश पड़ने का भाव देता है, और ‘चमक उठी’ aorist की अचानक, पूर्ण घटना को सहज हिन्दी में व्यक्त करता है।
- source_word: φῶς
  choice: एक ज्योति
  rationale: अनिश्चित φῶς के लिए ‘एक’ उपयुक्त है; ‘ज्योति’ गरिमापूर्ण किंतु सामान्यतः बोधगम्य शब्द है और प्रकाश की दृश्य घटना को व्यक्त करता है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से
  rationale: लूका-प्रेरितों के इस प्रकाशनात्मक प्रसंग में οὐρανός का संभावित अर्थ ‘स्वर्ग’ है; फिर भी ‘आकाश’ की वास्तविक शाब्दिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: प्रकाशनात्मक प्रसंग में οὐρανός का अर्थ
  choice: स्वर्ग से
  alternative: आकाश से
  rationale: कथा इसे दिव्य भेंट के रूप में प्रस्तुत करती है, इसलिए ‘स्वर्ग’ संभावित अभिप्राय और धार्मिक भार को बनाए रखता है; फिर भी मूल शब्द का स्थान-संबंधी अर्थ ‘आकाश’ भी हो सकता है, जिसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रजिस्टर रखा गया है। ‘तो ऐसा हुआ कि’ यूनानी कथात्मक संरचना को बिना अत्यधिक कृत्रिमता के सुरक्षित रखता है; ‘निकट पहुँच रहा था’ जारी गति और नगर से निकटता दोनों व्यक्त करता है।
