  text: καὶ εὐθέως ἀπέπεσαν ⸂αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν⸃ ⸀ὡς λεπίδες, ἀνέβλεψέν τε καὶ ἀναστὰς ἐβαπτίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/018.yaml
  text: And immediately something like scales fell from his eyes[a], and he regained his sight; then he got up and was baptized,
translation:
  language: hi
  text: और तुरन्त उसकी आँखों से मानो छिलके गिर पड़े[a], और उसे फिर दिखाई देने लगा। फिर वह उठा और बपतिस्मा लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या केवल, “उसकी आँखों से छिलकों के समान कुछ गिर पड़ा।” यूनानी में तुलना है; यह नहीं कहा गया कि वे वास्तविक छिलके थे, बल्कि यह बताया गया है कि वे कैसे प्रतीत हुए।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: तुरन्त
  rationale: घटना की तत्कालता को सहज और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπέπεσαν
  choice: गिरी
  rationale: क्रिया आँखों से अलग होकर नीचे गिरने का भाव देती है; हिन्दी में इसका स्वाभाविक रूप ‘गिरी’ है।
- source_word: αὐτοῦ ἀπὸ τῶν ὀφθαλμῶν
  choice: उसकी आँखों से
  rationale: ἀπό के अलगाव-सूचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὡς λεπίδες
  choice: छिलकों जैसी कोई चीज़
  rationale: ὡς तुलना सूचित करता है, वस्तुओं को वास्तविक छिलके घोषित नहीं करता। ‘कोई चीज़’ इस अनुभूत समानता को स्पष्ट करती है, जबकि ‘छिलके’ मूल बिंब को बनाए रखता है।
- source_word: ἀνέβλεψεν
  choice: उसे फिर दिखाई देने लगा
  rationale: इस चंगाई के प्रसंग में क्रिया का अर्थ ऊपर देखना नहीं, बल्कि दृष्टि वापस पाना है। यह वाक्यांश सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀναστάς
  choice: उसने उठकर
  rationale: अगली क्रमिक क्रिया को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐβαπτίσθη
  choice: बपतिस्मा लिया
  rationale: यूनानी कर्मवाच्य का हिन्दी में प्रचलित और स्वाभाविक समतुल्य है; यह बपतिस्मे की किसी विशेष विधि को अनावश्यक रूप से निर्धारित नहीं करता।
theological_decisions:
- issue: βαπτίζω का पंथ-निरपेक्ष और शब्दार्थ की दृष्टि से निष्ठावान अनुवाद
  choice: बपतिस्मा लिया
  alternative: डुबकी दी गई
  rationale: पद बपतिस्मे की घटना बताता है, पर उसकी विधि स्पष्ट नहीं करता। प्रचलित पद ‘बपतिस्मा लिया’ किसी विशेष सांप्रदायिक विधि को पाठ में जोड़ने से बचता है।
- issue: ὡς λεπίδες को वास्तविक वस्तु या तुलना के रूप में प्रस्तुत करना
  choice: छिलकों जैसी कोई चीज़
  alternative: छिलके
  rationale: ὡς स्पष्ट रूप से तुलना का संकेत देता है। अनुवाद उसी वर्णनात्मक अनिश्चितता को बनाए रखता है और यह दावा नहीं करता कि वे सचमुच छिलके ही थे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उसे फिर दिखाई देने लगा’ दृष्टि लौटने का स्वाभाविक हिन्दी रूप है। ‘बपतिस्मा लिया’ हिन्दी बाइबलीय प्रयोग में परिचित है और किसी विशिष्ट विधि को अनिवार्य नहीं बनाता।
