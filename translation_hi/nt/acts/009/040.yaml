  text: ἐκβαλὼν δὲ ἔξω πάντας ὁ Πέτρος ⸀καὶ θεὶς τὰ γόνατα προσηύξατο, καὶ ἐπιστρέψας πρὸς τὸ σῶμα εἶπεν· Ταβιθά, ἀνάστηθι. ἡ δὲ ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς, καὶ ἰδοῦσα τὸν Πέτρον ἀνεκάθισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/040.yaml
  text: But Peter put them all outside[a], knelt down and prayed, and turning toward the body said, “Tabitha, arise.” Then she opened her eyes, and when she saw Peter, she sat up.
translation:
  language: hi
  text: पर पतरस ने सबको बाहर भेज दिया, फिर घुटने टेककर प्रार्थना की। इसके बाद उसने शरीर की ओर मुड़कर कहा, “तबीता, उठो।”[क] तब उसने अपनी आँखें खोलीं और पतरस को देखकर उठ बैठी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “उठ जाओ।” यूनानी आज्ञार्थक क्रिया का अनुवाद दोनों प्रकार से किया जा सकता है; यहाँ ‘उठो’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλὼν ... ἔξω πάντας
  choice: सबको बाहर कर दिया
  rationale: यह वाक्यांश कमरे में उपस्थित सभी लोगों को बाहर भेजने की ठोस क्रिया व्यक्त करता है; ‘निकाल दिया’ अनावश्यक कठोरता का संकेत दे सकता था।
- source_word: θεὶς τὰ γόνατα
  choice: घुटने टेककर
  rationale: प्रार्थना के लिए घुटनों पर आने की यूनानी लोकोक्ति का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: προσηύξατο
  choice: प्रार्थना की
  rationale: प्रार्थना करने की क्रिया का सीधा और प्रचलित हिन्दी अनुवाद।
- source_word: ἐπιστρέψας πρὸς τὸ σῶμα
  choice: शव की ओर मुड़कर
  rationale: πρός के दिशात्मक भाव और मुड़ने की शारीरिक क्रिया को बनाए रखता है; इस प्रसंग में ‘शव’ स्पष्ट करता है कि तबीता अभी मृत थी।
- source_word: Ταβιθά
  choice: तबीता
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: ἀνάστηθι
  choice: उठो
  rationale: आज्ञार्थक क्रिया का स्वाभाविक आधुनिक हिन्दी रूप, जो लेटी अवस्था से उठने और इस प्रसंग में जीवन में लौटने—दोनों निहितार्थों को बिना अतिरिक्त व्याख्या के रहने देता है।
- source_word: ἤνοιξεν τοὺς ὀφθαλμοὺς αὐτῆς
  choice: उसने अपनी आँखें खोलीं
  rationale: यूनानी वाक्य का सीधा, स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: ἰδοῦσα τὸν Πέτρον
  choice: पतरस को देखकर
  rationale: कृदन्त को हिन्दी में सहज पूर्वकालिक क्रिया के रूप में व्यक्त करता है और घटनाक्रम सुरक्षित रखता है।
- source_word: ἀνεκάθισεν
  choice: उठ बैठी
  rationale: लेटे हुए से बैठने की मुद्रा में आने का सटीक और स्वाभाविक हिन्दी मुहावरा।
- source_word: δὲ
  choice: पर / तब
  rationale: पहला प्रयोग पिछले प्रसंग से हल्का संक्रमण दर्शाता है और दूसरा कथा को आगे बढ़ाता है; यूनानी में यहाँ प्रबल विरोध आवश्यक नहीं है।
theological_decisions:
- issue: जीवन में लौटाने की आज्ञा का अनुवाद
  choice: उठो
  alternative: जी उठो / खड़ी हो जाओ
  rationale: ἀνάστηθι का अर्थ प्रसंगानुसार उठना हो सकता है। ‘उठो’ चमत्कार और पुनर्जीवन के प्रसंग को खुला रखता है, जबकि ‘जी उठो’ मूल से अधिक स्पष्ट व्याख्या जोड़ता और ‘खड़ी हो जाओ’ अगले वर्णित कार्य—उठ बैठने—से कम मेल खाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। छोटे वाक्यों से घटनाक्रम स्पष्ट रखा गया है। ‘पतरस’ और ‘तबीता’ प्रचलित हिन्दी बाइबलीय नाम-रूप हैं।
