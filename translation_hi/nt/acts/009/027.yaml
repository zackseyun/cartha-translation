source:
  edition: SBLGNT
  text: Βαρναβᾶς δὲ ἐπιλαβόμενος αὐτὸν ἤγαγεν πρὸς τοὺς ἀποστόλους, καὶ διηγήσατο αὐτοῖς πῶς ἐν τῇ ὁδῷ εἶδεν τὸν κύριον καὶ ὅτι ἐλάλησεν αὐτῷ καὶ πῶς ἐν Δαμασκῷ ἐπαρρησιάσατο ἐν τῷ ὀνόματι ⸀τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/027.yaml
  text: But Barnabas took hold of him and brought him to the apostles, and told them how on the road he had seen the Lord, and that he had spoken to him, and how in Damascus he had spoken boldly in the name of Jesus.
translation:
  language: hi
  text: लेकिन बरनबास उसे अपने साथ लेकर प्रेरितों के पास गया और उन्हें विस्तार से बताया कि मार्ग में शाऊल ने प्रभु को कैसे देखा था, कि प्रभु ने उससे बात की थी, और कि दमिश्क में शाऊल यीशु के नाम से कैसे निडर होकर बोला था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλαβόμενος αὐτὸν
  choice: उसे अपने साथ लिया
  rationale: यह प्रयोग किसी को थामने या साथ ले लेने का भाव रखता है। प्रसंग में बरनबास की सहायक भूमिका के कारण स्वाभाविक हिन्दी में ‘अपने साथ लिया’ उपयुक्त है; ‘पकड़ लिया’ अनचाहे बलपूर्वक कार्रवाई का संकेत दे सकता है।
- source_word: ἤγαγεν πρὸς τοὺς ἀποστόλους
  choice: प्रेरितों के पास ले गया
  rationale: ἄγω के ‘ले जाना/पहुँचाना’ अर्थ को सहज और सटीक हिन्दी में व्यक्त करता है।
- source_word: διηγήσατο
  choice: विस्तार से बताया
  rationale: क्रिया केवल सूचना देने से अधिक, घटनाओं का क्रमवार या विस्तारपूर्वक वर्णन करने का भाव रखती है।
- source_word: πῶς ἐν τῇ ὁδῷ
  choice: मार्ग में कैसे
  rationale: यहाँ ὁδός दमिश्क की यात्रा के मार्ग को दर्शाता है, किसी धार्मिक समुदाय के नाम ‘मार्ग’ को नहीं।
- source_word: εἶδεν τὸν κύριον
  choice: प्रभु को कैसे देखा था
  rationale: κύριος के पदवीगत और मसीह-संबंधी भार को ‘प्रभु’ सुरक्षित रखता है। ‘देखा था’ बरनबास के बाद के वर्णन में पूर्व घटित घटना को स्वाभाविक हिन्दी में दिखाता है।
- source_word: ὅτι ἐλάλησεν αὐτῷ
  choice: प्रभु ने उससे बात की थी
  rationale: यूनानी में कर्ता पिछले पद का ‘प्रभु’ है। हिन्दी में उसे दोहराने से अस्पष्ट सर्वनामों से बचते हुए अर्थ स्पष्ट होता है।
- source_word: ἐπαρρησιάσατο
  choice: निडर होकर बात की थी
  rationale: παρρησιάζομαι निर्भीकता, खुलापन और स्वतंत्रता से बोलने को दर्शाता है। ‘प्रचार किया’ प्रसंगानुकूल हो सकता है, पर मूल क्रिया से अधिक विशिष्ट है।
- source_word: ἐν τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: यीशु के नाम से
  rationale: यह प्रचलित बाइबलीय मुहावरा यीशु के अधिकार और उससे जुड़ी सार्वजनिक गवाही दोनों को खुला रखता है।
theological_decisions:
- issue: मार्ग पर हुए अनुभव में ‘प्रभु’ का संदर्भ
  choice: ‘प्रभु’ से यीशु अभिप्रेत हैं
  alternative: इसे परमेश्वर के लिए अधिक सामान्य संबोधन मानना
  rationale: प्रेरितों के काम 9 के निकट प्रसंग में शाऊल का सामना जी उठे यीशु से होता है, और इसी पद का अंत ‘यीशु के नाम से’ होता है। फिर भी अनुवाद मूल की पदवी ‘प्रभु’ को ही रखता है, उसके स्थान पर सीधे ‘यीशु’ नहीं बैठाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘शाऊल’ को स्पष्ट कर्ता के रूप में जोड़ा गया है क्योंकि हिन्दी में लगातार ‘वह/उसने’ से बरनबास और शाऊल के बीच भ्रम हो सकता था; यह संदर्भगत स्पष्टीकरण है, नया कथ्य नहीं। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
