  text: ἐπιγνόντες δὲ οἱ ἀδελφοὶ κατήγαγον αὐτὸν εἰς Καισάρειαν καὶ ἐξαπέστειλαν αὐτὸν εἰς Ταρσόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/030.yaml
  text: When the brothers learned this[a], they brought him down to Caesarea and sent him off to Tarsus.
translation:
  language: hi
  text: जब भाइयों को यह पता चला[a], तो वे उसे कैसरिया ले गए और तरसुस भेज दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाई-बहनों को’; यूनानी में ‘भाइयों’ है, पर इस प्रसंग में यह विश्वासियों के व्यापक समुदाय के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: जब ... को यह पता चला
  rationale: यह भूतकालिक कृदन्त उस जानकारी को जान लेने की परिस्थिति बताता है जिसके कारण आगे की कार्रवाइयाँ हुईं। यूनानी में कर्म निहित है और पिछले पद से समझा जाता है, इसलिए स्वाभाविक हिन्दी में ‘यह’ जोड़ा गया है।
- source_word: οἱ ἀδελφοὶ
  choice: भाइयों
  rationale: यूनानी शब्द का रूप पुल्लिंग बहुवचन है। मुख्य पाठ में उसके प्रत्यक्ष अर्थ को रखा गया है; विश्वासियों के व्यापक समुदाय की सम्भावित समावेशी अर्थ-छाया पाद-टिप्पणी में दी गई है।
- source_word: κατήγαγον
  choice: नीचे कैसरिया ले गए
  rationale: κατάγω में नीचे की ओर, यहाँ सम्भवतः समुद्रतट की ओर, ले जाने का दिशात्मक भाव है। ‘नीचे ... ले गए’ उस भाव को बनाए रखता है।
- source_word: Καισάρειαν
  choice: कैसरिया
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यन्तरण। सन्दर्भ में अधिक विस्तृत ऐतिहासिक नाम आवश्यक नहीं है।
- source_word: ἐξαπέστειλαν
  choice: वहाँ से ... भेज दिया
  rationale: ἐξαποστέλλω किसी स्थान से आगे रवाना करने का भाव देता है। ‘वहाँ से ... भेज दिया’ कैसरिया से तरसुस की ओर भेजे जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ταρσόν
  choice: तरसुस
  rationale: नगर के नाम का प्रचलित हिन्दी लिप्यन्तरण।
theological_decisions:
- issue: सम्भवतः मिश्रित विश्वासी समुदाय के लिए ἀδελφοί का अनुवाद
  choice: भाइयों
  alternative: भाई-बहनों; साथी विश्वासियों
  rationale: मुख्य पाठ में यूनानी के पुल्लिंग बहुवचन रूप को प्रत्यक्ष रूप से रखा गया है। यह शब्द इस प्रसंग में व्यापक विश्वासी समुदाय को भी सूचित कर सकता है; उस सम्भावना को बिना मुख्य पाठ का रूप बदलकर पाद-टिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नीचे कैसरिया ले गए’ सामान्य हिन्दी की अपेक्षा कुछ अधिक स्रोत-सापेक्ष है, ताकि यूनानी क्रिया में निहित दिशात्मक भाव बना रहे। ‘वहाँ से’ यूनानी संयुक्त क्रिया के प्रस्थान-भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
