source:
  edition: SBLGNT
  text: γνωστὸν δὲ ἐγένετο καθ’ ὅλης ⸀τῆς Ἰόππης, καὶ ⸂ἐπίστευσαν πολλοὶ⸃ ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/009/042.yaml
  text: And it became known throughout all Joppa, and many believed in the Lord.
translation:
  language: hi
  text: यह बात पूरे याफा में फैल गई, और बहुतों ने प्रभु पर विश्वास किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωστὸν ... ἐγένετο
  choice: यह बात ... फैल गई
  rationale: यूनानी निर्वैयक्तिक अभिव्यक्ति का आशय है कि पिछली घटना व्यापक रूप से ज्ञात हो गई। आधुनिक हिन्दी में ‘यह बात फैल गई’ स्वाभाविक है और किसी विशेष प्रचारक को कर्ता नहीं बनाती।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘और’ इसे बिना अनावश्यक विरोध दिखाए व्यक्त करता है।
- source_word: καθ’ ὅλης τῆς Ἰόππης
  choice: पूरे याफा में
  rationale: κατά तथा संबंधकारक यहाँ पूरे क्षेत्र में प्रसार दर्शाते हैं, जबकि ὅλης उसकी व्यापकता पर बल देता है।
- source_word: Ἰόππης
  choice: याफा
  rationale: यह नगर आधुनिक हिन्दी में प्रचलित और मूल उच्चारण के निकट रूप ‘याफा’ से दिया गया है।
- source_word: ἐπίστευσαν
  choice: विश्वास किया
  rationale: πιστεύω का सीधा और प्रतिष्ठित हिन्दी समतुल्य ‘विश्वास करना’ है; सामान्य भूतकाल कथा में घटित विश्वास की प्रतिक्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πολλοὶ
  choice: बहुतों ने
  rationale: विशेषण का संज्ञात्मक प्रयोग हिन्दी के ‘बहुतों’ से संक्षेप और स्वाभाविक रूप में व्यक्त होता है।
- source_word: ἐπὶ τὸν κύριον
  choice: प्रभु पर
  rationale: πιστεύω के साथ ἐπί और कर्मकारक भरोसे के लक्ष्य को दर्शाते हैं। हिन्दी में ‘प्रभु पर विश्वास किया’ व्यक्तिगत भरोसे के इस भाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: κύριον
  choice: प्रभु
  rationale: ‘प्रभु’ κύριος का गरिमापूर्ण, सामान्य बाइबलीय हिन्दी रूप है और यहाँ यीशु के सम्मानसूचक तथा धर्मवैचारिक महत्व को बनाए रखता है।
theological_decisions:
- issue: πιστεύω + ἐπὶ τὸν κύριον का अनुवाद
  choice: प्रभु पर विश्वास किया
  alternative: प्रभु में विश्वास किया
  rationale: ‘प्रभु पर विश्वास’ ἐπί के लक्ष्य/आश्रय के भाव और व्यक्तिगत भरोसे को स्वाभाविक हिन्दी में व्यक्त करता है, बिना विश्वास की कोई संकीर्ण धर्मसैद्धांतिक परिभाषा जोड़े।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ प्रेरितों के काम में यीशु के लिए प्रयुक्त इस उपाधि के सम्मानसूचक और मसीह-विषयक भार को ‘स्वामी’ की अपेक्षा अधिक पूर्णतः सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यह बात’ पिछले प्रसंग—तबीता के जिलाए जाने—की ओर संकेत करती है; पद स्वयं घटना को दोहराता नहीं। कोई पाद-टिप्पणी आवश्यक नहीं है।
