base_translation:
  language: en
  yaml_path: translation/nt/acts/009/012.yaml
  text: and he has seen in a vision a man named Ananias coming in and laying his hands on him so that he might regain his sight[a][b].
translation:
  language: hi
  text: और उसने दर्शन में हनन्याह नाम के एक पुरुष को भीतर आते और उस पर अपने हाथ रखते देखा है[a], ताकि वह फिर से देख सके[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देखा।”
    reason: यूनानी क्रिया सामान्य भूतकाल में है; हिन्दी में “देखा है” प्रसंग में दर्शन की वर्तमान प्रासंगिकता व्यक्त करता है।
  - marker: b
    text: या, “वह अपनी दृष्टि वापस पाए।”
    reason: मूल क्रिया का अर्थ इस प्रसंग में फिर से देखना या दृष्टि वापस पाना हो सकता है।
lexical_decisions:
- source_word: εἶδεν
  choice: देखा है
  rationale: यूनानी क्रिया भूतकालीन घटना बताती है, पर प्रसंग में उस दर्शन का वर्तमान महत्व बना हुआ है; इसलिए हिन्दी का पूर्ण वर्तमान स्वाभाविक है।
- source_word: ἄνδρα
  choice: एक पुरुष
  rationale: यहाँ ἀνήρ एक वयस्क पुरुष, अर्थात् हनन्याह, को सूचित करता है।
- source_word: ἐν ὁράματι
  choice: दर्शन में
  rationale: यह वाक्यांश उस माध्यम या अवस्था को बताता है जिसमें शाऊल ने यह दृश्य देखा।
- source_word: Ἁνανίαν ὀνόματι
  choice: हनन्याह नाम के
  rationale: नाम बताने वाले यूनानी मुहावरे का यह स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: εἰσελθόντα
  choice: भीतर आते
  rationale: कृदन्त दर्शन के भीतर हनन्याह के प्रवेश करने की क्रिया बताता है; यह रूप अनावश्यक कालक्रम जोड़े बिना स्वाभाविक है।
- source_word: ἐπιθέντα αὐτῷ χεῖρας
  choice: उस पर अपने हाथ रखते
  rationale: यह मूल पाठ की शारीरिक क्रिया और परिचित बाइबलीय मुहावरे को सुरक्षित रखता है, पर उसके धार्मिक अर्थ को विस्तार से निर्धारित नहीं करता।
- source_word: ὅπως
  choice: ताकि
  rationale: यह उद्देश्य बताने वाले उपवाक्य का सहज हिन्दी संयोजक है।
- source_word: ἀναβλέψῃ
  choice: वह फिर से देखने लगे
  rationale: चंगाई के इस प्रसंग में क्रिया का अर्थ दृष्टि लौटना या फिर देख पाना है, केवल ऊपर देखना नहीं।
theological_decisions:
- issue: हाथ रखने की क्रिया के धार्मिक अर्थ को कितना स्पष्ट किया जाए
  choice: उस पर अपने हाथ रखते
  alternative: उस पर हाथ रखते
  rationale: यूनानी पाठ शारीरिक क्रिया बताता है, पर इसे अभिषेक, संस्कार या किसी विशेष चंगाई-पद्धति के रूप में परिभाषित नहीं करता; अनुवाद उसी खुलापन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। “दर्शन,” “हनन्याह” और “हाथ रखना” जैसे परिचित बाइबलीय पद बनाए गए हैं, जबकि वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए स्वाभाविक रखा गया है।
