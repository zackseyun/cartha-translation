lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας
  choice: इसलिए ... अज्ञानता के समयों को
  rationale: मूल पदबंध पूर्वकाल और वर्तमान के बीच संक्रमण तथा हल्का विरोध दिखाता है। ‘अज्ञानता के समय’ यूनानी की बहुवचन अभिव्यक्ति और उसके अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὑπεριδὼν
  choice: अनदेखा करके
  rationale: यह परमेश्वर की पूर्वकालीन सहनशीलता अथवा तत्काल न्याय न करने को व्यक्त करता है, उन समयों की स्वीकृति को नहीं। वैकल्पिक अर्थ स्पष्ट करने के लिए पादटिप्पणी दी गई है।
- source_word: τὰ νῦν παραγγέλλει
  choice: अब ... आज्ञा दी है
  rationale: ‘अब’ पहले के समयों के साथ वर्तमान का विरोध बनाए रखता है; παραγγέλλει अधिकारपूर्ण आदेश को व्यक्त करता है। हिन्दी में पूर्ण वर्तमान ‘दी है’ वर्तमान में लागू आज्ञा का स्वाभाविक बोध देता है।
- source_word: τοῖς ἀνθρώποις πάντας πανταχοῦ
  choice: हर जगह सभी लोगों को
  rationale: ἄνθρωποι यहाँ समस्त मनुष्यों के लिए सामान्य अर्थ में है। πάντας और πανταχοῦ आज्ञा के सार्वभौमिक विस्तार पर बल देते हैं।
- source_word: μετανοεῖν
  choice: मन फिराने
  rationale: ‘मन फिराना’ हिन्दी बाइबलीय प्रयोग में सोच, दिशा और आचरण के नैतिक परिवर्तन को समेटता है और केवल बौद्धिक मत-परिवर्तन तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: ‘अज्ञानता के समयों’ के प्रति परमेश्वर की पूर्व कार्रवाई का अर्थ
  choice: परमेश्वर ने उन्हें सहन करते हुए तत्काल न्याय नहीं किया
  alternative: परमेश्वर ने पाप को महत्त्वहीन समझा या अज्ञानता को पूर्णतः निर्दोष ठहराया
  rationale: ὑπεριδών में अनदेखा करने/छोड़ देने का भाव है, पर वर्तमान में मन फिराने की आज्ञा नैतिक उत्तरदायित्व को बनाए रखती है। अनुवाद इस तनाव को समाप्त नहीं करता।
- issue: मन फिराने की आज्ञा का दायरा
  choice: हर जगह सभी लोग
  alternative: केवल पुरुष या केवल गैर-यहूदी
  rationale: τοῖς ἀνθρώποις πάντας πανταχοῦ व्यापक मानवीय दायरा व्यक्त करता है; यहाँ ἄνθρωποι केवल पुरुषों तक सीमित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘मन फिराना’ धार्मिक रूप से परिचित होते हुए भी सामान्य पाठक के लिए बोधगम्य है। मुख्य पाठ में सभी पादटिप्पणी चिह्न उपस्थित हैं।
