  text: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ εἰσῆλθεν πρὸς αὐτοὺς καὶ ἐπὶ σάββατα τρία διελέξατο αὐτοῖς ἀπὸ τῶν γραφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/002.yaml
  text: And according to Paul's custom[a], he went in to them, and on three Sabbaths he reasoned with them from the Scriptures[c][b],
translation:
  language: hi
  text: और पौलुस अपनी रीति के अनुसार उनके पास गया, और तीन सब्तों तक[a] पवित्र शास्त्रों से उनके साथ तर्क-विमर्श किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तीन सब्तों में’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उनके साथ चर्चा की’ या ‘उनके साथ संवाद किया’।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: और पौलुस अपनी रीति के अनुसार
  rationale: यह यूनानी मुहावरा पौलुस की स्थापित आदत को व्यक्त करता है। ‘अपनी रीति के अनुसार’ आधुनिक हिन्दी में स्वाभाविक है और उसके नियमित अभ्यास का भाव बनाए रखता है।
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: उनके पास भीतर गया
  rationale: यह अनुवाद प्रवेश करने की गति और लोगों की ओर जाने—दोनों भावों को बनाए रखता है, पर इस पद में निहित न होने के कारण ‘आराधनालय’ को स्पष्ट रूप से नहीं जोड़ता।
- source_word: ἐπὶ σάββατα τρία
  choice: तीन सब्तों तक
  rationale: ἐπί के साथ कर्मकारक यहाँ समय-विस्तार अथवा लगातार तीन सब्त के अवसरों को दर्शाता है। ‘तीन सब्तों तक’ हिन्दी में सहज है; ‘तीन सब्तों को’ भी सम्भव है और पादटिप्पणी में दिया गया है।
- source_word: διελέξατο
  choice: उनके साथ तर्क-विमर्श करता रहा
  rationale: διαλέγομαι यहाँ संवाद, विवेचन और तर्कपूर्ण समझाने का भाव रखता है। ‘तर्क-विमर्श’ इस परस्पर संवाद को व्यक्त करता है, बिना इसे शत्रुतापूर्ण बहस बना देने के।
- source_word: ἀπὸ τῶν γραφῶν
  choice: पवित्र शास्त्रों के आधार पर
  rationale: बहुवचन γραφαί मान्य पवित्र लेखों की ओर संकेत करता है। ἀπό यहाँ उन शास्त्रों को तर्क के स्रोत या आधार के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: पौलुस जिनके पास गया, ‘उनके’ शब्द का संदर्भ
  choice: मुख्य पाठ में सर्वनाम ‘उनके’ बनाए रखा गया।
  alternative: ‘आराधनालय में गया’ अथवा ‘वहाँ के यहूदियों के पास गया।’
  rationale: आस-पास का संदर्भ आराधनालय को स्पष्ट करता है, किन्तु इस पद में यूनानी पाठ सर्वनाम ही रखता है। सर्वनाम बनाए रखने से अनावश्यक विशिष्टता नहीं जोड़ी जाती।
- issue: διαλέγομαι में संवाद और तर्क का अनुपात
  choice: ‘तर्क-विमर्श करता रहा’
  alternative: ‘उनसे चर्चा करता रहा’ अथवा ‘उन्हें तर्क देकर समझाता रहा।’
  rationale: क्रिया में परस्पर वार्ता तथा तर्कपूर्ण विवेचन दोनों सम्भव हैं। चुना हुआ रूप दोनों पहलुओं को खुला रखता है और केवल एकतरफा उपदेश या कटु विवाद का अर्थ नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘सब्त’ और ‘पवित्र शास्त्र’ प्रचलित बाइबलीय पद हैं। ‘तर्क-विमर्श’ संवादात्मक तथा विवेचनात्मक अर्थ को साथ रखता है।
