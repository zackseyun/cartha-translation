  text: εὐθέως δὲ τότε τὸν Παῦλον ἐξαπέστειλαν οἱ ἀδελφοὶ πορεύεσθαι ⸀ἕως ἐπὶ τὴν θάλασσαν· ⸂ὑπέμεινάν τε⸃ ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: hi
  text: तब भाइयों[a] ने तुरंत पौलुस को समुद्र तक[b] जाने के लिए भेज दिया, पर सीलास और तीमुथियुस दोनों वहीं रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाइयों और बहनों’; यूनानी में ‘भाई’ है, जो सामूहिक रूप से संगी विश्वासियों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘समुद्र की ओर’ अथवा ‘समुद्र के पास’; यूनानी वाक्यांश समुद्र-तट तक जाने का संकेत दे सकता है, पर इससे अधिक स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: तुरन्त
  rationale: यह शब्द बिना देर किए की गई कार्रवाई बताता है; आधुनिक हिन्दी में ‘तुरन्त’ स्वाभाविक और स्पष्ट है।
- source_word: δὲ τότε
  choice: तब
  rationale: यह कथानक में अगले घटनाक्रम की ओर संक्रमण दिखाता है; ‘तब’ दोनों अव्ययों के संयुक्त कार्य को सहज ढंग से व्यक्त करता है।
- source_word: ἐξαπέστειλαν
  choice: विदा कर दिया
  rationale: संदर्भ में किसी को उस स्थान से भेज देने का भाव है; ‘विदा कर दिया’ प्रस्थान के इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ ἀδελφοὶ
  choice: भाइयों
  rationale: यूनानी में पुल्लिंग बहुवचन ‘भाई’ है। प्रेरितों के काम में यह संगी विश्वासियों के समुदाय के लिए भी प्रयुक्त हो सकता है; उस व्यापक संभावना को पादटिप्पणी में रखा गया है।
- source_word: πορεύεσθαι
  choice: जाने के लिए
  rationale: यह भेजने के उद्देश्य को बताने वाला क्रियारूप है; ‘जाने के लिए’ सरल और संदर्भानुकूल है।
- source_word: ἕως ἐπὶ τὴν θάλασσαν
  choice: समुद्र तक
  rationale: वाक्यांश समुद्र-तट की दिशा में वहाँ तक पहुँचने की गति दर्शाता है, पर आगे की यात्रा का साधन निश्चित नहीं करता। ‘समुद्र तक’ इस सीमा और अस्पष्टता को बनाए रखता है।
- source_word: ὑπέμεινάν
  choice: वहीं रहे
  rationale: यहाँ अर्थ कठिनाई सहना नहीं, बल्कि उसी स्थान पर बने रहना है; ‘वहीं रहे’ पौलुस के प्रस्थान के साथ स्पष्ट विरोध दिखाता है।
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: सीलास और तीमुथियुस—दोनों
  rationale: τε ... καὶ की युग्मात्मक बलवत्ता को ‘दोनों’ स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐκεῖ
  choice: वहीं
  rationale: यह उसी स्थान पर बने रहने को सूचित करने वाला स्थानवाचक क्रियाविशेषण है; ‘वहीं’ हिन्दी में सटीक है।
theological_decisions:
- issue: विश्वासी समुदाय के लिए ἀδελφοί का अनुवाद
  choice: भाइयों
  alternative: भाइयों और बहनों; विश्वासियों
  rationale: मुख्य पाठ यूनानी के पुल्लिंग बहुवचन को बनाए रखता है। चूँकि प्रसंग में यह पूरे विश्वासी समुदाय को सामूहिक रूप से सूचित कर सकता है, समावेशी अर्थ पादटिप्पणी में दिया गया है, मुख्य पाठ में थोपा नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘तुरन्त’, ‘विदा कर दिया’ और ‘वहीं रहे’ सामान्य पाठकों के लिए स्वाभाविक हैं। पादटिप्पणी-चिह्न अंग्रेज़ी परामर्श-पाठ के क्रम [b][a] में उसी संबंधित पदबंध के बाद रखे गए हैं।
