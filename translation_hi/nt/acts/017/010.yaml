  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। पद को दो वाक्यों में बाँटकर हिन्दी का स्वाभाविक प्रवाह रखा गया है। केवल वही पादटिप्पणी रखी गई है जो वास्तविक अर्थगत अस्पष्टता स्पष्ट करती है; ‘रात के समय’ और ‘यहूदियों के आराधनालय’ मुख्य पाठ में पहले से स्पष्ट हैं।
