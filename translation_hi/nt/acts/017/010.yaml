base_translation:
  language: en
  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: hi
  text: तब भाइयों[a] ने तुरन्त रात के समय पौलुस और सीलास—दोनों को बेरिया रवाना कर दिया। बेरिया पहुँचकर वे यहूदियों के आराधनालय में गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाइयों और बहनों”; यूनानी में “भाइयों” है, जो व्यापक विश्वासी समुदाय को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοὶ
  choice: भाइयों
  rationale: यूनानी के व्याकरणिक रूप और विश्वासियों के पारिवारिक-सामुदायिक संबोधन को सुरक्षित रखता है; प्रसंग में स्त्रियाँ भी व्यापक समुदाय में सम्मिलित हो सकती हैं, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: εὐθέως
  choice: तुरन्त
  rationale: बिना देर किए की गई कार्रवाई को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: διὰ νυκτός
  choice: रात के समय
  rationale: यह रचना रात के दौरान हुई कार्रवाई बताती है; हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ἐξέπεμψαν
  choice: भेज दिया
  rationale: ἐκπέμπω के भेज देने/वहाँ से रवाना करने के भाव को प्रसंगानुकूल रूप से व्यक्त करता है।
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: पौलुस और सीलास—दोनों को
  rationale: τε ... καί के समावेशी बल को ‘दोनों’ द्वारा स्पष्ट रखा गया है।
- source_word: Βέροιαν
  choice: बेरिया
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: οἵτινες παραγενόμενοι
  choice: वहाँ पहुँचकर वे
  rationale: सम्बन्धवाचक सर्वनाम और कालवाचक कृदन्त को स्वाभाविक हिन्दी कथन में रखते हुए घटनाओं का क्रम सुरक्षित करता है।
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: यहूदियों के आराधनालय
  rationale: सम्बन्धकारक रचना को पारदर्शी रूप से व्यक्त करता है और स्थानीय यहूदी समुदाय के आराधनालय का बोध देता है।
- source_word: ἀπῄεσαν
  choice: में गए
  rationale: εἰς के साथ गंतव्य की ओर प्रवेश/गमन को सहज हिन्दी में व्यक्त करता है; अपूर्ण भूतकाल को अनावश्यक रूप से व्याख्यायित नहीं किया गया।
theological_decisions:
- issue: मिश्रित विश्वासी समुदाय के संदर्भ में ἀδελφοὶ का अनुवाद
  choice: भाइयों
  alternative: भाइयों और बहनों
  rationale: मुख्य पाठ में पुल्लिंग बहुवचन का रूप सुरक्षित रखा गया है, जबकि व्यापक विश्वासी समुदाय को सूचित करने वाली सम्भावित समावेशी समझ पादटिप्पणी में दी गई है।
- issue: τῶν Ἰουδαίων का अनुवाद
  choice: यहूदियों के
  alternative: यहूदी आराधनालय
  rationale: यूनानी सम्बन्धकारक रचना को स्पष्ट रूप से सुरक्षित रखा गया है। यहाँ यह स्थानीय समुदाय की पहचान है, कोई नकारात्मक धार्मिक निर्णय नहीं।
