lexical_decisions:
- source_word: Διοδεύσαντες
  choice: से होकर
  rationale: यह भूतकालिक कृदन्त मुख्य क्रिया ἦλθον से पहले हुई गतिविधि बताता है। ‘से होकर’ नगरों के बीच से यात्रा करने का भाव स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: δὲ
