- source_word: Ἀμφίπολιν
  choice: अम्फिपुलिस
  rationale: स्थान के यूनानी नाम का देवनागरी लिप्यन्तरण।
- source_word: Ἀπολλωνίαν
  choice: अपुल्लोनिया
  rationale: स्थान के यूनानी नाम का देवनागरी लिप्यन्तरण।
- source_word: ἦλθον
  choice: वे … पहुँचे
  rationale: ἔρχομαι का यह बहुवचन भूतकालिक रूप गन्तव्य तक आने को बताता है। प्रसंग में ‘पहुँचे’ सहज हिन्दी है, यद्यपि मूल का सामान्य गति-सूचक भाव भी बनाए रखता है।
- source_word: εἰς Θεσσαλονίκην
  choice: थिस्सलुनीके
  rationale: εἰς गन्तव्य दर्शाता है; ‘पहुँचे’ के साथ हिन्दी में अलग परसर्ग आवश्यक नहीं। नाम का रूप यूनानी उच्चारण के निकट देवनागरी लिप्यन्तरण है।
- source_word: ὅπου
