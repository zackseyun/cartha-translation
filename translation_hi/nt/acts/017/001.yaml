  rationale: स्थानवाचक सम्बन्धसूचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: συναγωγὴ
  choice: एक आराधनालय
  rationale: यूनानी संज्ञा के पहले निश्चित उपपद नहीं है। ‘एक’ इस अनिश्चितता को व्यक्त करता है; ‘आराधनालय’ सामान्य हिन्दी पाठक के लिए यहूदी सामुदायिक उपासना-स्थल का बोध कराता है।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों का
  rationale: सम्बन्ध/सम्बद्धता दर्शाने वाले यूनानी सम्बन्धकारक का सीधा हिन्दी रूप। यहाँ संकेत थिस्सलुनीके के यहूदी समुदाय से है।
theological_decisions:
- issue: कथात्मक प्रसंग में Ἰουδαίων का अनुवाद
  choice: यहूदियों का
  alternative: यहूदी लोगों का; यहूदिया-वासियों का
  rationale: यहाँ शब्द आराधनालय से जुड़े स्थानीय यहूदी समुदाय को सूचित करता है, केवल यहूदिया प्रदेश के निवासियों को नहीं। ‘यहूदियों का’ सीधा, प्रचलित और प्रसंगानुकूल है।
- issue: अनिश्चित συναγωγὴ का रूप
  choice: एक आराधनालय
  alternative: आराधनालय; वह आराधनालय
  rationale: मूल यूनानी में συναγωγή से पहले उपपद नहीं है। ‘एक’ सम्भावित अनिश्चित अर्थ को स्पष्ट करता है, जबकि ‘वह आराधनालय’ मूल से अधिक निश्चितता जोड़ सकता है।
