    reason: cultural_note
lexical_decisions:
- source_word: ἐτάραξαν
  choice: खलबली मच गई
  rationale: यह प्रयोग भीड़ और अधिकारियों में उत्पन्न सामाजिक तथा मानसिक व्याकुलता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना हिंसा या दंगे का अतिरिक्त अर्थ जोड़े। यूनानी में कर्ता पिछले पद के लोग हैं, पर हिन्दी में प्रभाव-केंद्रित अकर्मक रचना अधिक सहज है।
- source_word: δὲ
  choice: वाक्य-प्रवाह में अलग शब्द से व्यक्त नहीं
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है। हिन्दी में पिछले प्रसंग से संबंध स्वतः स्पष्ट है; ‘और’ जोड़ने से वाक्य कुछ कृत्रिम लगता।
- source_word: ὄχλον
  choice: भीड़
  rationale: यह ὄχλος का सामान्य और तटस्थ हिन्दी समतुल्य है; ‘उपद्रवी भीड़’ मूल से अधिक शत्रुता जोड़ता।
- source_word: πολιτάρχας
  choice: नगर-अधिकारियों
  rationale: यह मकिदुनिया में प्रचलित स्थानीय नागरिक पदवी का अर्थ सामान्य पाठक के लिए स्पष्ट करता है। पदवी की ऐतिहासिक विशिष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἀκούοντας ταῦτα
  choice: ये बातें सुनकर
  rationale: वर्तमान कृदंत को कालगत संबंध के रूप में सहज हिन्दी में व्यक्त किया गया है। ‘ये बातें’ बहुवचन ταῦτα को बनाए रखता है और यह सुनना भीड़ तथा नगर-अधिकारियों दोनों से संबंधित है।
