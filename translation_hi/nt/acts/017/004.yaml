source:
  edition: SBLGNT
  text: καί τινες ἐξ αὐτῶν ἐπείσθησαν καὶ προσεκληρώθησαν τῷ Παύλῳ καὶ τῷ Σιλᾷ, τῶν τε σεβομένων Ἑλλήνων ⸂πλῆθος πολὺ⸃ γυναικῶν τε τῶν πρώτων οὐκ ὀλίγαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: hi
  text: उनमें से कुछ लोग राज़ी हो गए और पौलुस तथा सीलास के साथ जुड़ गए[a]। परमेश्वर का भय मानने वाले यूनानियों की एक बड़ी संख्या भी उनके साथ जुड़ गई, और प्रतिष्ठित स्त्रियाँ भी कम नहीं जुड़ीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “पौलुस और सीलास के हिस्से में आ मिले” या “उन्होंने अपना भाग्य पौलुस और सीलास के साथ जोड़ लिया।”
    reason: दुर्लभ यूनानी क्रिया προσεκληρώθησαν में किसी के साथ भाग या पक्ष जोड़ लेने का बिंब है, जिसे मुख्य पाठ का सहज ‘साथ जुड़ गए’ पूरी तरह नहीं दिखाता।
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: उनमें से कुछ लोग
  rationale: यह अंश पिछले पद के आराधनालय के श्रोताओं की ओर संकेत करने वाले अंशवाची प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπείσθησαν
  choice: समझाने पर मान गए
  rationale: यह πείθω के निष्क्रिय रूप की प्रेरित या समझाए जाने पर सहमत होने की धारणा को रखता है और इसे सीधे ‘विश्वास किया’ नहीं बनाता।
- source_word: προσεκληρώθησαν
  choice: के साथ हो गए
  rationale: यह दुर्लभ क्रिया किसी के साथ जुड़ने या अपना पक्ष उसके साथ कर लेने का भाव देती है; वर्तमान हिन्दी में यह सहज है, जबकि अधिक शाब्दिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: परमेश्वर की उपासना करने वाले यूनानी
  rationale: प्रेरितों के काम के ऐतिहासिक संदर्भ में ये वे गैर-यहूदी यूनानी हैं जो इस्राएल के परमेश्वर की आराधना से जुड़े थे; यह वाक्यांश उस आशय को स्पष्ट और स्वाभाविक हिन्दी में देता है।
- source_word: πλῆθος πολὺ
  choice: बड़ी संख्या में लोग
  rationale: यह पर्याप्त बड़ी संख्या को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: γυναικῶν τε τῶν πρώτων
  choice: प्रतिष्ठित स्त्रियाँ
  rationale: यहाँ πρῶτος समयक्रम नहीं, सामाजिक प्रतिष्ठा या ऊँचे स्थान का सूचक है।
- source_word: οὐκ ὀλίγαι
  choice: बहुत-सी
  rationale: हिन्दी में ‘कम नहीं’ सम्भव है, पर यहाँ वह असहज और अस्पष्ट लग सकता है; ‘बहुत-सी’ मूल अल्पोक्ति के आशय को स्पष्ट रूप से संप्रेषित करता है।
- source_word: τε ... τε
  choice: भी ... और ... भी
  rationale: यह दोनों अतिरिक्त समूहों को पहले बताए लोगों के साथ जोड़ने वाली यूनानी संरचना को सहज हिन्दी में दर्शाता है।
theological_decisions:
- issue: ἐπείσθησαν को स्पष्ट रूप से मन-परिवर्तन या विश्वास की शब्दावली में अनूदित करना
  choice: समझाने पर मान गए
  alternative: विश्वास किया
  rationale: मूल में πείθω है, πιστεύω नहीं। चुना हुआ अनुवाद प्रचार के प्रति सकारात्मक प्रतिक्रिया को रखता है, पर मूल से अधिक स्पष्ट धर्मशास्त्रीय दावा नहीं करता।
- issue: σεβομένων Ἑλλήνων की धार्मिक पहचान कितनी स्पष्ट की जाए
  choice: परमेश्वर की उपासना करने वाले यूनानी
  alternative: भक्त यूनानी / परमेश्वर का भय मानने वाले यूनानी
  rationale: यह प्रेरितों के काम में यहूदी आराधना से जुड़े गैर-यहूदियों के ऐतिहासिक संदर्भ को स्पष्ट करता है। ‘परमेश्वर का भय मानने वाले’ अधिक पारिभाषिक है, जबकि चुना हुआ रूप सामान्य पाठक के लिए तत्काल बोधगम्य है।
- issue: οὐκ ὀλίγαι की अल्पोक्ति बनाए रखना
  choice: बहुत-सी
  alternative: कम नहीं
  rationale: मूल की अल्पोक्ति औपचारिक रूप से ‘कम नहीं’ से रखी जा सकती है, पर आधुनिक हिन्दी में स्त्रियों की संख्या के संदर्भ में ‘बहुत-सी’ अधिक स्पष्ट और स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समूहों की जटिल यूनानी संबंधसूचक संरचना को दो हिन्दी वाक्यों में खोला गया है, और दूसरे वाक्य में ‘उनके साथ हो गईं’ जोड़कर निहित क्रिया स्पष्ट की गई है।
