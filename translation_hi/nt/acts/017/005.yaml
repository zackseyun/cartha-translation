source:
  edition: SBLGNT
  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
translation:
  language: hi
  text: पर यहूदी ईर्ष्या से भर गए और बाज़ार से कुछ दुष्ट आदमियों को अपने साथ ले लिया। उन्होंने भीड़ इकट्ठी करके शहर में हंगामा मचा दिया। फिर वे यासोन के घर जा पहुँचे और उन्हें बाहर निकालकर जनसभा[a] में ले आने की कोशिश करने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सार्वजनिक सभा में” अथवा “लोगों के सामने”; यूनानी शब्द δῆμος केवल किसी अनिश्चित भीड़ को नहीं, बल्कि सार्वजनिक रूप से एकत्र नागरिक निकाय को सूचित करता है।
    reason: जनसभा के संस्थागत अर्थ और सम्भव स्वाभाविक अनुवादों को स्पष्ट करना।
lexical_decisions:
- source_word: ζηλώσαντες
  choice: ईर्ष्या से भर गए
  rationale: यह प्रयोग मुख्य कार्रवाइयों से पहले उत्पन्न हुई ईर्ष्या को उनका प्रेरक कारण दिखाता है और कृदंत के आरंभिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदी
  rationale: यूनानी पाठ में सामान्य जातीय-धार्मिक पद ही है; उसे बिना पाठगत आधार के ‘यहूदी अगुओं’ तक सीमित नहीं किया गया। प्रसंग से स्पष्ट है कि तात्पर्य थिस्सलुनीके के यहूदियों के एक विरोधी समूह से है, सभी यहूदियों से नहीं।
- source_word: προσλαβόμενοι
  choice: अपने साथ ले लिया
  rationale: मध्यवाच्य कृदंत का अर्थ कुछ लोगों को अपने दल में साथ लेना है; यह अभिव्यक्ति औपचारिक नियुक्ति या पैसे देकर बुलाने का अतिरिक्त अर्थ नहीं जोड़ती।
- source_word: τῶν ἀγοραίων
  choice: बाज़ार से
  rationale: यह उन लोगों को सूचित करता है जो अगोरा अर्थात सार्वजनिक बाज़ार-चौक में पाए जाते थे। ‘आवारा’ या ‘निकम्मे’ कहना सम्भावित भाव को अनावश्यक रूप से स्पष्ट कर देता।
- source_word: ἄνδρας τινὰς πονηρούς
  choice: कुछ दुष्ट पुरुषों
  rationale: यह अनिश्चितता, पुरुष-वाचक संज्ञा और नकारात्मक नैतिक वर्णन—तीनों को बनाए रखता है।
- source_word: ὀχλοποιήσαντες
  choice: भीड़ इकट्ठी करके
  rationale: क्रिया भीड़ बनाने या जुटाने को दर्शाती है। अगले खंड का ‘हंगामा’ उस भीड़ के उपद्रवी स्वरूप को पर्याप्त रूप से व्यक्त करता है।
- source_word: ἐθορύβουν τὴν πόλιν
  choice: शहर में हंगामा मचा दिया
  rationale: यह शहर-व्यापी अशांति का सजीव और सहज हिन्दी रूप है। यद्यपि यूनानी अपूर्णकाल चलती हुई कार्रवाई दिखाता है, हिन्दी में संयुक्त कथन घटनाक्रम को स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: ἐπιστάντες τῇ οἰκίᾳ Ἰάσονος
  choice: यासोन के घर जा पहुँचे
  rationale: ἐφίστημι यहाँ किसी स्थान पर आ पहुँचने का अर्थ देता है। ‘हमला किया’ शत्रुता को शब्द के प्रत्यक्ष अर्थ से अधिक स्पष्ट कर देता।
- source_word: ἐζήτουν
  choice: कोशिश करने लगे
  rationale: अपूर्णकाल उनके जारी प्रयास को दिखाता है। प्रसंग में ζητέω खोजने से अधिक उन्हें बाहर लाने का प्रयास सूचित करता है।
- source_word: αὐτοὺς
  choice: उन्हें
  rationale: मूल पाठ के सर्वनाम को बनाए रखा गया है; उसके स्थान पर ‘पौलुस और सीलास’ जैसी व्याख्यात्मक पहचान नहीं जोड़ी गई।
- source_word: προαγαγεῖν
  choice: बाहर निकालकर … लाने
  rationale: घर के संदर्भ में यह उन्हें बाहर निकालने और सार्वजनिक निकाय के सामने ले आने—दोनों दिशात्मक भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὸν δῆμον
  choice: जनसभा के सामने
  rationale: δῆμος केवल अनिश्चित भीड़ नहीं, सार्वजनिक रूप से एकत्र नागरिक निकाय को सूचित करता है। ‘जनसभा’ उसके संस्थागत भाव को बनाए रखता है, और ‘के सामने’ हिन्दी में सुनवाई हेतु प्रस्तुत किए जाने को सहज बनाता है।
theological_decisions:
- issue: संघर्ष-वृत्तांत में οἱ Ἰουδαῖοι का अनुवाद
  choice: यहूदी
  alternative: यहूदी अगुए; यहूदिया के लोग
  rationale: मुख्य पाठ मूल शब्द को न तो संकीर्ण करता है, न व्यापक। प्रसंग इसे थिस्सलुनीके के एक विशेष विरोधी समूह तक सीमित करता है, इसलिए इसे सभी समयों और स्थानों के यहूदियों पर लागू नहीं समझना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप रखा गया है। ‘यासोन’ यूनानी Ἰάσων का निकट देवनागरी रूप है। वाक्यों का विभाजन हिन्दी में पठनीयता के लिए किया गया है, जबकि कारण और घटनाक्रम का मूल क्रम सुरक्षित है।
