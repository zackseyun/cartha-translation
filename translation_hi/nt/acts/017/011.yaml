source:
  edition: SBLGNT
  text: οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, ⸀τὸ καθ’ ἡμέραν ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: hi
  text: ये लोग थिस्सलुनीके के लोगों से अधिक उदात्त स्वभाव के थे[a], क्योंकि उन्होंने पूरी तत्परता से वचन ग्रहण किया[b] और प्रतिदिन पवित्र शास्त्रों की जाँच करते थे कि ये बातें ऐसी ही हैं या नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अधिक कुलीन।” यूनानी शब्द अधिक प्रशंसनीय मनोवृत्ति या—इस प्रसंग में कम सम्भावित रूप से—ऊँची सामाजिक हैसियत का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “संदेश का स्वागत किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενέστεροι
  choice: अधिक उदात्त मन के
  rationale: यह तुलनात्मक विशेषण कुलीन सामाजिक स्थिति या प्रशंसनीय मनोवृत्ति—दोनों का बोध करा सकता है। आगे उनकी तत्परता और शास्त्र-जाँच का वर्णन होने के कारण यहाँ मनोवृत्ति का अर्थ अधिक उपयुक्त है; ‘उदात्त मन’ मूल्यांकनात्मक भाव को बनाए रखता है।
- source_word: οἵτινες
  choice: क्योंकि उन्होंने
  rationale: यह सम्बन्धवाचक रूप पहले कथन की व्याख्या करता है कि वे किस अर्थ में अधिक उदात्त मन के थे। हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐδέξαντο τὸν λόγον
  choice: वचन ग्रहण किया
  rationale: ‘वचन’ प्रेरितों के काम में λόγος की कथात्मक और धर्मवैचारिक प्रतिध्वनि बनाए रखता है, और ‘ग्रहण किया’ स्वागतपूर्वक स्वीकार करने का भाव देता है।
- source_word: μετὰ πάσης προθυμίας
  choice: पूरी तत्परता से
  rationale: προθυμία में तत्परता, इच्छा और उत्सुकता का भाव है; ‘पूरी’ πάσης की तीव्रता को व्यक्त करता है।
- source_word: τὸ καθ’ ἡμέραν
  choice: प्रतिदिन
  rationale: यह पदबंध क्रियाविशेषण की तरह प्रयुक्त है और नियमित दैनिक क्रिया बताता है।
- source_word: ἀνακρίνοντες
  choice: जाँच करते थे
  rationale: क्रिया सावधानी से जाँचने या पड़ताल करने का अर्थ देती है। शास्त्र से दावों को परखने के प्रसंग में ‘जाँच’ स्पष्ट और स्वाभाविक है।
- source_word: τὰς γραφὰς
  choice: पवित्र शास्त्रों
  rationale: इस प्रसंग में बहुवचन γραφαί यहूदी पवित्र लेखों को सूचित करता है; ‘पवित्र शास्त्र’ आधुनिक हिन्दी में मान्य और स्पष्ट पद है।
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: कि ये बातें ऐसी ही हैं या नहीं
  rationale: यह अप्रत्यक्ष प्रश्न है। हिन्दी रूप मूल की जाँचपरक अनिश्चितता को बनाए रखता है और उसे केवल ‘सत्य’ जैसे अधिक व्याख्यात्मक शब्द में नहीं बदलता।
theological_decisions:
- issue: εὐγενέστεροι का प्रसंगगत अर्थ
  choice: प्रशंसनीय मनोवृत्ति—‘अधिक उदात्त मन के’
  alternative: जन्म या सामाजिक हैसियत में अधिक कुलीन
  rationale: अगला उपवाक्य उनकी विशेषता को संदेश ग्रहण करने की तत्परता और शास्त्रों की जाँच से स्पष्ट करता है। फिर भी सामाजिक अर्थ की वास्तविक शब्दगत सम्भावना पादटिप्पणी में रखी गई है।
- issue: λόγος का अनुवाद
  choice: वचन
  alternative: संदेश
  rationale: ‘वचन’ यूनानी शब्द की बाइबिलीय प्रतिध्वनि और प्रेरितों के काम में उसकी निरन्तरता को सुरक्षित रखता है, जबकि ‘संदेश’ सम्भव अर्थ के रूप में पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण रूप अपनाया गया है। ‘उदात्त मन’ सामाजिक कुलीनता की अपेक्षा प्रशंसनीय मनोवृत्ति को सामने रखता है; मूल की दूसरी सम्भावना पादटिप्पणी में सुरक्षित है। वाक्य के आरम्भ में ऐसा कोई कालसूचक या संवाद-संयोजक शब्द नहीं जोड़ा गया जिसका यूनानी स्रोत में स्पष्ट आधार न हो।
