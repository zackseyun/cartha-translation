  text: πολλοὶ μὲν οὖν ἐξ αὐτῶν ἐπίστευσαν, καὶ τῶν Ἑλληνίδων γυναικῶν τῶν εὐσχημόνων καὶ ἀνδρῶν οὐκ ὀλίγοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/012.yaml
  text: Therefore many of them believed[b][a], and not a few of the prominent Greek women and men.
translation:
  language: hi
  text: इसलिए उनमें से बहुतों ने विश्वास किया; और प्रतिष्ठित[a] यूनानी स्त्रियों में से तथा पुरुषों में से भी विश्वास करने वालों की संख्या कम नहीं थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सम्मानित’ अथवा ‘ऊँची सामाजिक प्रतिष्ठा वाली’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से ‘कम नहीं’; यह अल्पोक्ति पर्याप्त संख्या का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ μὲν οὖν
  choice: इसलिए ... बहुतों ने
  rationale: μὲν οὖν पिछले पद में पवित्र शास्त्र की जाँच के परिणाम की ओर संकेत करते हुए कथन को आगे बढ़ाता है। ‘इसलिए’ इस निष्कर्षात्मक-संक्रमणकारी भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξ αὐτῶν
  choice: उनमें से
  rationale: यह पहले उल्लिखित लोगों की ओर लौटता है और ἐξ के अंशसूचक भाव को सहज हिन्दी में बनाए रखता है।
- source_word: ἐπίστευσαν
  choice: विश्वास किया
  rationale: यह πιστεύω का सीधा और प्रसंगानुकूल अनुवाद है; विश्वास के विषय को पद में स्पष्ट न होने पर भी अनुवाद में जोड़ा नहीं गया है।
- source_word: τῶν Ἑλληνίδων γυναικῶν
  choice: यूनानी स्त्रियों में से
  rationale: Ἑλληνίδων उनकी यूनानी पहचान बताता है और γυναικῶν के लिए यहाँ ‘स्त्रियाँ’ उपयुक्त है, क्योंकि वैवाहिक संबंध अभिप्रेत नहीं है।
- source_word: τῶν εὐσχημόνων
  choice: प्रतिष्ठित
  rationale: इस प्रसंग में εὐσχήμων सामाजिक प्रतिष्ठा और सम्मानित स्थिति को सूचित करता है। ‘प्रतिष्ठित’ संक्षिप्त, स्वाभाविक और अर्थानुकूल है।
- source_word: καὶ ἀνδρῶν οὐκ ὀλίγοι
  choice: और पुरुषों में से भी विश्वास करने वाले कम नहीं थे
  rationale: οὐκ ὀλίγοι शाब्दिक अल्पोक्ति ‘कम नहीं’ है, जिसका अर्थ पर्याप्त संख्या है। हिन्दी वाक्य में क्रिया-भाव को स्पष्ट करके मूल अल्पोक्ति सुरक्षित रखी गई है।
- source_word: καὶ
  choice: साथ ही ... और ... भी
  rationale: ये शब्द अतिरिक्त समूह को पिछले कथन से स्वाभाविक ढंग से जोड़ते हैं।
theological_decisions:
- issue: ἐπίστευσαν में विश्वास का विषय स्पष्ट रूप से जोड़ना या न जोड़ना
  choice: विश्वास किया
  alternative: मसीह पर विश्वास किया / संदेश पर विश्वास किया
  rationale: इस पद में विश्वास का विषय संदर्भ से समझा जाता है, पर स्पष्ट रूप से लिखा नहीं है। इसलिए किसी विस्तृत धर्मवैज्ञानिक कथन को जोड़े बिना मूल की संक्षिप्तता बनाए रखी गई है।
- issue: εὐσχημόνων का संबंध किनसे माना जाए
  choice: ‘प्रतिष्ठित’ को स्पष्ट रूप से ‘यूनानी स्त्रियों’ से जोड़ना
  alternative: प्रतिष्ठित यूनानी स्त्रियाँ और पुरुष
  rationale: यूनानी पाठ में τῶν εὐσχημόνων स्त्रीलिंग बहुवचन है और निकटवर्ती γυναικῶν को विशेषित करता है। अनुवाद ने इसे पुरुषों पर भी लागू मानकर अर्थ का विस्तार नहीं किया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। अर्धविराम दो संबंधित कथनों को स्पष्ट करता है। ‘विश्वास करने वाले कम नहीं थे’ हिन्दी में नकार को ‘विश्वास किया’ पर पड़ने से बचाता है और यूनानी अल्पोक्ति को सुरक्षित रखता है।
