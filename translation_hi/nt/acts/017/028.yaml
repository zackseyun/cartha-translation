id: ACT.17.28
reference: Acts 17:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: hi
  text: क्योंकि उसी में हम जीते, चलते-फिरते और अस्तित्व में हैं, जैसा तुम्हारे अपने कवियों में से भी कुछ ने कहा है, ‘क्योंकि हम भी उसी की संतान हैं।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: उसी में
  rationale: ग्रीक संबंधसूचक अभिव्यक्ति को यथासंभव सीधे रखते हुए पूर्वोक्त परमेश्वर की ओर संकेत स्पष्ट किया गया है।
- source_word: κινούμεθα
  choice: चलते-फिरते
  rationale: मध्य/कर्मवाच्य रूप यहाँ गति या सक्रियता का सामान्य अर्थ देता है; स्वाभाविक हिन्दी में ‘चलते-फिरते’ इसे संप्रेषित करता है।
- source_word: ἐσμέν
  choice: अस्तित्व में हैं
  rationale: पिछले ‘जीते’ से अर्थगत भेद बनाए रखते हुए अस्तित्व के व्यापक भाव को व्यक्त किया गया है।
- source_word: ποιητῶν
  choice: कवियों
  rationale: शब्द का सामान्य और संदर्भानुकूल सीधा हिन्दी रूप।
- source_word: γένος
  choice: संतान
  rationale: उद्धरण में वंश, जाति या उत्पत्ति से जुड़े सामूहिक संबंध को सहज हिन्दी में व्यक्त करता है; यहाँ जैविक अर्थ को कठोरता से निर्दिष्ट नहीं किया गया।
theological_decisions:
- issue: ‘उसी में’ का आशय
  choice: रूपकात्मक/अस्तित्वगत संबंध को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘उसी के कारण’ या ‘उसी की शक्ति से’
  rationale: ἐν αὐτῷ को कारण या साधन में बदलने से मूल की व्यापकता और संभावित तनाव घट जाता।
- issue: मानवता को परमेश्वर की ‘संतान’ कहना
  choice: काव्य-उद्धरण को सीधे ‘हम भी उसी की संतान हैं’ रखा गया
  alternative: ‘हम उसी के बनाए हुए हैं’
  rationale: वैकल्पिक रूप γένος की पारिवारिक/वंशगत भाषा को व्याख्यात्मक सृष्टि-भाषा में बदल देता; मूल कथन की अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘तुम्हारे’ प्रसंग में बहुवचन श्रोताओं को संबोधित करता है। उद्धरण-चिह्न मूल कथन के भीतर कवियों की पंक्ति को अलग करते हैं।
