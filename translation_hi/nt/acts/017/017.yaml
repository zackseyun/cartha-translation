id: ACT.17.17
reference: Acts 17:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διελέγετο μὲν οὖν ἐν τῇ συναγωγῇ τοῖς Ἰουδαίοις καὶ τοῖς σεβομένοις καὶ ἐν τῇ ἀγορᾷ κατὰ πᾶσαν ἡμέραν πρὸς τοὺς παρατυγχάνοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/017.yaml
  text: So he was reasoning in the synagogue with the Jews and those who worshiped God[b][a], and in the marketplace every day with those who happened to be there.
translation:
  language: hi
  text: इसलिए वह आराधनालय में यहूदियों और परमेश्वर की आराधना करनेवालों[a] के साथ तर्क-वितर्क करता था, और बाज़ार[b] में भी प्रतिदिन उन लोगों के साथ जो वहाँ मिल जाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परमेश्वर का भय माननेवालों’; अर्थात वे गैर-यहूदी जो यहूदी आराधना से जुड़े हुए थे।
    reason: lexical_alternative
  - marker: b
    text: ‘बाज़ार’ केवल खरीदने-बेचने की जगह नहीं, बल्कि वह सार्वजनिक नागरिक स्थल भी था जहाँ लोग इकट्ठे होते थे।
    reason: cultural_note
lexical_decisions:
- source_word: διελέγετο
  choice: तर्क-वितर्क करता था
  rationale: अपूर्णकाल निरंतर या बार-बार होनेवाली गतिविधि दर्शाता है; यह पद संवाद के साथ तर्क प्रस्तुत करने का भाव भी रखता है।
- source_word: μὲν οὖν
  choice: इसलिए
  rationale: यह संयोजन पिछले प्रसंग से निष्कर्ष और कथा की निरंतरता जोड़ता है।
- source_word: συναγωγῇ
  choice: आराधनालय
  rationale: यहाँ यह शब्द यहूदी उपासना के पहचाने हुए स्थान और संस्था को सूचित करता है; आधुनिक हिन्दी में ‘आराधनालय’ सहज और स्पष्ट है।
- source_word: τοῖς Ἰουδαίοις
  choice: यहूदियों
  rationale: इस प्रसंग में संकेत आराधनालय में उपस्थित यहूदी समुदाय की ओर है, न कि केवल यहूदिया प्रदेश के निवासियों की ओर।
- source_word: τοῖς σεβομένοις
  choice: परमेश्वर की आराधना करनेवालों
  rationale: मूल में कर्म स्पष्ट नहीं है, पर प्रेरितों के काम में यह प्रयोग यहूदी आराधना से जुड़े गैर-यहूदियों के लिए आता है; मुख्य पाठ में अर्थ स्पष्ट रखा गया और वैकल्पिक पारिभाषिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀγορᾷ
  choice: बाज़ार
  rationale: ἀγορά व्यापार के साथ सार्वजनिक नागरिक सभा-स्थल भी था; ‘बाज़ार’ सामान्य पाठक के लिए स्वाभाविक है और व्यापक सांस्कृतिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: κατὰ πᾶσαν ἡμέραν
  choice: प्रतिदिन
  rationale: यह मुहावरा हर दिन नियमित रूप से दोहराई जानेवाली गतिविधि व्यक्त करता है।
- source_word: πρὸς τοὺς παρατυγχάνοντας
  choice: उन लोगों के साथ जो वहाँ मिल जाते थे
  rationale: यह उन लोगों को सूचित करता है जो संयोग से वहाँ उपस्थित होते या मिलते थे; इसे केवल राहगीरों तक सीमित नहीं किया गया।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘तर्क-वितर्क’ संवादात्मक किंतु विचारपूर्ण प्रतिपादन को व्यक्त करता है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
