lexical_decisions:
- source_word: λαβόντες
  choice: लेकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई कार्रवाई दिखाता है; हिंदी में ‘लेकर’ स्वाभाविक रूप से यही क्रम व्यक्त करता है।
- source_word: τὸ ἱκανὸν
  choice: जमानत
  rationale: इस कानूनी प्रसंग में यह पद पर्याप्त सुरक्षा-राशि या प्रत्याभूति लेने का संकेत देता है। ‘जमानत’ आधुनिक हिंदी में कानूनी अर्थ स्पष्ट करती है, जबकि टिप्पणी मूल यूनानी की शाब्दिक व्यापकता बनाए रखती है।
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: यासोन और बाकी लोगों से
  rationale: संबंधकारक के साथ παρά स्रोत बताता है, इसलिए ‘से’; λοιπῶν तत्काल समूह के शेष व्यक्तियों को सूचित करता है।
- source_word: ἀπέλυσαν
  choice: छोड़ दिया
  rationale: नागरिक-अदालती प्रसंग में क्रिया का अर्थ हिरासत से जाने देना है; ‘छोड़ दिया’ सहज और स्पष्ट आधुनिक हिंदी है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: बहुवचन कर्मवाचक सर्वनाम हिरासत में लिए गए व्यक्तियों की ओर संकेत करता है।
