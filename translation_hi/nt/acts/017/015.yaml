  text: οἱ δὲ ⸀καθιστάνοντες τὸν Παῦλον ⸀ἤγαγον ἕως Ἀθηνῶν, καὶ λαβόντες ἐντολὴν πρὸς τὸν Σιλᾶν καὶ ⸀τὸν Τιμόθεον ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτὸν ἐξῄεσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/015.yaml
  text: Those who were escorting Paul brought him as far as Athens[a], and after receiving instructions for Silas and Timothy to come to him as quickly as possible[b], they departed.
translation:
  language: hi
  text: पौलुस को पहुँचाने वाले लोग उसे एथेंस तक ले गए। फिर सीलास और तीमुथियुस के लिए यह निर्देश पाकर कि वे जितनी जल्दी हो सके उसके पास आ जाएँ, वे चले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθιστάνοντες
  choice: साथ पहुँचाने जा रहे थे
  rationale: यह कृदंत उन लोगों की चल रही भूमिका बताता है जो पौलुस के साथ यात्रा करके उसे उसके गंतव्य तक पहुँचा रहे थे; यह केवल सामान्य ‘ले जाने’ से अधिक स्पष्ट है, पर सुरक्षा-दल जैसा अनावश्यक भाव नहीं जोड़ता।
- source_word: ἤγαγον
  choice: ले गए
  rationale: मुख्य क्रिया पौलुस को एथेंस तक ले जाने की पूर्ण हुई घटना बताती है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: ἕως Ἀθηνῶν
  choice: एथेंस तक
  rationale: ἕως गंतव्य की सीमा तक पहुँचने का भाव देता है, जिसे हिन्दी का ‘तक’ संक्षेप और ठीक प्रकार से व्यक्त करता है।
- source_word: λαβόντες ἐντολήν
  choice: यह निर्देश लेकर
  rationale: कालसूचक कृदंत को क्रमिक क्रिया के रूप में रखा गया है। ἐντολή आदेश या निर्देश दोनों हो सकता है; प्रसंग में ‘निर्देश’ स्वाभाविक है और अधिकारपूर्ण आदेश का भाव अनावश्यक रूप से प्रबल नहीं करता।
- source_word: πρὸς τὸν Σιλᾶν καὶ τὸν Τιμόθεον
  choice: सीलास और तीमुथियुस के लिए
  rationale: πρός यहाँ निर्देश के अभिप्रेत प्राप्तकर्ताओं को दर्शाता है; ‘के लिए’ हिन्दी में संदेश साथ ले जाने के प्रसंग में सहज है।
- source_word: ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτόν
  choice: कि वे जितनी जल्दी हो सके उसके पास आ जाएँ
  rationale: यह निर्देश की विषयवस्तु और ὡς τάχιστα की तात्कालिकता दोनों को व्यक्त करता है तथा αὐτόν को ‘उसके’ रूप में स्पष्ट बनाए रखता है।
- source_word: ἐξῄεσαν
  choice: वहाँ से चले गए
  rationale: कथा के अंत में यह उनके प्रस्थान को बताता है; हिन्दी में स्थानसूचक ‘वहाँ से’ प्रसंग से स्वाभाविक रूप से निहित है और गमन को स्पष्ट करता है।
