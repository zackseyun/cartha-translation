id: ACT.17.7
reference: Acts 17:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὓς ὑποδέδεκται Ἰάσων· καὶ οὗτοι πάντες ἀπέναντι τῶν δογμάτων Καίσαρος πράσσουσι, βασιλέα ⸂ἕτερον λέγοντες⸃ εἶναι Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: hi
  text: जिन्हें यासोन ने अपने यहाँ ठहराया है,[a] वे सब कैसर की राजाज्ञाओं[b] के विरुद्ध काम कर रहे हैं और कहते हैं कि एक और राजा है—यीशु।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वीकार किया है’ अथवा ‘अपने यहाँ जगह दी है।’ यूनानी क्रिया अतिथियों को ग्रहण करने या उनका आतिथ्य करने का भाव रख सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘आदेशों।’ यह शब्द आधिकारिक शासकीय निर्णयों या अध्यादेशों को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘एक भिन्न राजा।’ यूनानी में ‘एक और राजा’ है, जो आरोप में यीशु को कैसर के सामने एक अलग राजकीय दावेदार के रूप में प्रस्तुत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: अपने यहाँ ठहराया है
  rationale: यह पूर्णकालिक क्रिया अतिथि के रूप में ग्रहण करने और आतिथ्य देने का भाव रखती है। यह चयन स्वाभाविक हिन्दी में यासोन के किए हुए स्वागत तथा उसके बने हुए परिणाम को व्यक्त करता है।
- source_word: ἀπέναντι
  choice: के विरुद्ध
  rationale: सम्बन्धकारक के साथ यह विरोध या प्रतिकूलता बताता है; आरोप के कानूनी-राजनीतिक प्रसंग में ‘के विरुद्ध’ स्पष्ट और स्वाभाविक है।
- source_word: δογμάτων
  choice: राजाज्ञाओं
  rationale: इस रोमी नागरिक प्रसंग में शब्द आधिकारिक शासकीय आदेशों को सूचित करता है। ‘राजाज्ञाएँ’ कैसर से जुड़ी आधिकारिक और बाध्यकारी प्रकृति को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: πράσσουσι
  choice: काम कर रहे हैं
  rationale: वर्तमान काल निरन्तर आचरण का आरोप व्यक्त करता है। ‘काम कर रहे हैं’ इसे सहज आधुनिक हिन्दी में रखता है।
- source_word: βασιλέα ἕτερον
  choice: एक और राजा
  rationale: βασιλεύς का विशिष्ट अर्थ ‘राजा’ है और ἕτερον एक अन्य, पृथक दावेदार को सामने रखता है। यह अनुवाद कैसर की सत्ता से प्रतिद्वन्द्विता के आरोप को बनाए रखता है।
- source_word: λέγοντες
  choice: कहते हैं
  rationale: कृदन्त उनके कथित विरोध के ढंग और विषय को बताता है। ‘कहते हैं’ मूल की तटस्थता बचाता है और अनावश्यक रूप से ‘दावा करते हैं’ जैसी संशयात्मक छाया नहीं जोड़ता।
- source_word: εἶναι Ἰησοῦν
  choice: कि एक और राजा है—यीशु
  rationale: हिन्दी में infinitival clause को ‘कि’ वाले उपवाक्य में स्वाभाविक रूप से ढाला गया है और अन्त में ‘यीशु’ रखकर पहचान का बल सुरक्षित रखा गया है।
- source_word: οὗτοι πάντες
  choice: वे सब
  rationale: यह प्रदर्शनवाचक और समष्टिगत आरोप को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है; पूर्ववर्ती सम्बन्धवाचक उपवाक्य से व्यक्तियों की पहचान स्पष्ट है।
theological_decisions:
- issue: यीशु को राजा कहने वाले आरोप की राजनीतिक शक्ति
  choice: आरोप को सीधे इस रूप में रखा गया है कि वे यीशु को ‘एक और राजा’ कहते हैं।
  alternative: ‘राजा’ को केवल ‘नेता’ या ‘शासक’ कहकर राजनीतिक अर्थ को हल्का करना।
  rationale: पाठ कैसर की राजाज्ञाओं के संदर्भ में स्पष्ट राजनीतिक आरोप प्रस्तुत करता है। ‘राजा’ ऐतिहासिक और धर्मवैचारिक तनाव को बिना किसी संप्रदायगत व्याख्या से सुलझाए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और आरोपात्मक नागरिक-कानूनी स्वर रखा गया है। वाक्य में अनावश्यक संस्कृतनिष्ठता से बचते हुए ‘कैसर’ और ‘राजा’ द्वारा रोमी राजनीतिक तनाव स्पष्ट रखा गया है।
