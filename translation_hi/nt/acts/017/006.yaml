  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μὴ εὑρόντες δὲ αὐτοὺς ⸀ἔσυρον Ἰάσονα καί τινας ἀδελφοὺς ἐπὶ τοὺς πολιτάρχας, βοῶντες ὅτι Οἱ τὴν οἰκουμένην ἀναστατώσαντες οὗτοι καὶ ἐνθάδε πάρεισιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/006.yaml
  text: But when they did not find them[a], they dragged Jason and some brothers before the city authorities, shouting[c][b], “These men who have turned the world upside down have come here also,”
translation:
  language: hi
  text: पर जब वे उन्हें नहीं ढूँढ़ पाए, तो यासोन और कुछ भाइयों[a] को घसीटकर नगर-अधिकारियों[b] के सामने ले गए और चिल्लाने लगे, “जिन लोगों ने सारे बसे हुए संसार[c] में उथल-पुथल मचा दी है, वे यहाँ भी आ पहुँचे हैं!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भाई” से आशय साथी विश्वासियों से है; संदर्भ के अनुसार यह सामुदायिक संबोधन स्त्रियों को भी सम्मिलित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में पदनाम “पोलितार्ख” है, जो मकिदुनिया के नगर-अधिकारियों के लिए प्रयुक्त स्थानीय उपाधि थी।
    reason: cultural_note
  - marker: c
    text: इसका शाब्दिक अर्थ “बसा हुआ संसार” है; यह ज्ञात सभ्य संसार, और प्रायः रोमी संसार, को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ εὑρόντες δὲ αὐτούς
  choice: पर जब वे उन्हें नहीं ढूँढ़ पाए
  rationale: नकारात्मक एओरिस्ट कृदन्त मुख्य क्रिया से पहले की परिस्थिति बताता है। ‘उन्हें’ मूल पाठ के अनिर्दिष्ट सर्वनाम को बिना अतिरिक्त पहचान जोड़े सुरक्षित रखता है।
- source_word: ἔσυρον
  choice: घसीटकर ... ले गए
  rationale: σύρω बलपूर्वक खींचने या घसीटने का बोध देता है; यह चुनाव भीड़ की शारीरिक हिंसा को स्पष्ट रखता है।
- source_word: τινας ἀδελφοὺς
  choice: कुछ भाइयों
  rationale: ἀδελφοί यहाँ मसीही समुदाय के साथी विश्वासियों के लिए प्रयुक्त है। मुख्य पाठ में मूल का पुल्लिंग रूप रखा गया है और सामुदायिक अर्थ टिप्पणी में बताया गया है।
- source_word: ἐπὶ τοὺς πολιτάρχας
  choice: नगर-अधिकारियों के सामने
  rationale: πολιτάρχης मकिदुनिया का विशिष्ट नागरिक पदनाम था। ‘नगर-अधिकारी’ आधुनिक पाठक को उसका कार्य बताता है, जबकि ‘के सामने’ अधिकारियों के समक्ष पेश किए जाने का भाव देता है।
- source_word: βοῶντες
  choice: चिल्लाने लगे
  rationale: यह कृदन्त ऊँची आवाज़ में सार्वजनिक पुकार को व्यक्त करता है; ‘चिल्लाने लगे’ हिंदी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: οἱ τὴν οἰκουμένην ἀναστατώσαντες
  choice: जिन लोगों ने सारे बसे हुए संसार में उथल-पुथल मचा दी है
  rationale: ἀναστατόω गंभीर अशांति या उलट-पुलट उत्पन्न करने का भाव देता है। ‘उथल-पुथल मचा दी’ आरोप की तीव्रता रखता है, और οἰκουμένη का ‘बसा हुआ संसार’ वाला अर्थ भी सुरक्षित रहता है।
- source_word: οὗτοι καὶ ἐνθάδε πάρεισιν
  choice: वे यहाँ भी आ पहुँचे हैं
  rationale: πάρειμι उपस्थित होने या आ पहुँचने का अर्थ दे सकता है। ‘आ पहुँचे हैं’ आगमन और वर्तमान उपस्थिति दोनों को स्वाभाविक ढंग से व्यक्त करता है; καί को ‘भी’ से दर्शाया गया है।
