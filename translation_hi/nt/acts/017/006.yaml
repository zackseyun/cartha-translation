translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरोप की तीव्रता के लिए ‘घसीटकर’, ‘चिल्लाने लगे’ और ‘उथल-पुथल’ जैसे सशक्त किंतु सामान्य शब्द चुने गए हैं। मूल की अनिश्चितता ‘उन्हें’ में बनाए रखी गई है।
