base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: hi
  text: परंतु कुछ पुरुष पौलुस से जुड़ गए[a] और विश्वास किया। उनमें अरियुपगुसी दिओनुसियुस, दामरिस नाम की एक स्त्री, और उनके साथ अन्य लोग भी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पौलुस से लग गए” अथवा “पौलुस से घनिष्ठता से जुड़ गए”; यूनानी शब्द निकट व्यक्तिगत जुड़ाव का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: परन्तु कुछ पुरुष
  rationale: δὲ पिछले पद की प्रतिक्रियाओं के साथ हल्का विरोध दिखाता है; ἄνδρες यहाँ स्पष्ट रूप से पुरुषवाचक बहुवचन है।
- source_word: κολληθέντες αὐτῷ
  choice: पौलुस के साथ हो गए
  rationale: κολλάομαι निकटता से जुड़ने या किसी का साथ ग्रहण करने का भाव देता है। सर्वनाम को संदर्भ की स्पष्टता के लिए ‘पौलुस’ से व्यक्त किया गया है।
- source_word: ἐπίστευσαν
  choice: उन्होंने विश्वास किया
  rationale: यह मूल क्रिया का सीधा अनुवाद है और विश्वास का कोई ऐसा कर्म-विषय नहीं जोड़ता जिसे यूनानी पाठ स्पष्ट नहीं करता।
- source_word: ἐν οἷς καὶ
  choice: उनमें ... भी थे
  rationale: यह विश्वास करने वालों में से नामित व्यक्तियों का परिचय स्वाभाविक हिन्दी में कराता है।
- source_word: Διονύσιος ὁ Ἀρεοπαγίτης
  choice: अरियुपगुस की सभा का सदस्य दियुनुसियुस
  rationale: Ἀρεοπαγίτης को सामान्य पाठक के लिए केवल लिप्यंतरित पदवी के बजाय उसके सम्भावित संस्थागत अर्थ से व्यक्त किया गया है, जबकि टिप्पणी में उसकी अर्थ-सीमा सुरक्षित रखी गई है।
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: दमरिस नाम की एक स्त्री
  rationale: लिंग और व्यक्तिगत नाम दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: उनके साथ कुछ अन्य लोग
  rationale: अतिरिक्त अनाम व्यक्तियों और उनके साथ होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: संदर्भ में πιστεύω का स्वरूप
  choice: विश्वास किया
  alternative: विश्वास में आ गए
  rationale: मूल पाठ सच्चे विश्वास की प्रतिक्रिया बताता है, पर यहाँ विस्तृत धर्मवैज्ञानिक सूत्र या प्रत्यक्ष कर्म-विषय नहीं देता; इसलिए सीधा कथन रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। यूनानी नामों के लिए हिन्दी बाइबलीय परंपरा के निकट लिप्यंतरण रखा गया है; संस्थागत पदवी को सामान्य पाठक के लिए स्पष्ट किया गया है।
