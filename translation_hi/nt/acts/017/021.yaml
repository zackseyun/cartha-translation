  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘एथेनावासी’ स्थान-आधारित पहचान को सामान्य पाठक के लिए स्पष्ट रखता है और ‘परदेशी’ ξένοι का स्वाभाविक रूप है।
