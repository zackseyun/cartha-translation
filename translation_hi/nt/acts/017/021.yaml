id: ACT.17.21
reference: Acts 17:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀθηναῖοι δὲ πάντες καὶ οἱ ἐπιδημοῦντες ξένοι εἰς οὐδὲν ἕτερον ηὐκαίρουν ἢ λέγειν τι ⸀ἢ ἀκούειν ⸀τι καινότερον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/021.yaml
  text: All the Athenians and the foreigners staying there would spend their time in nothing else than telling or hearing something newer[a].
translation:
  language: hi
  text: सभी एथेनावासी और वहाँ ठहरे हुए परदेशी अपना समय किसी और काम में नहीं, बल्कि कोई और नई बात कहने या सुनने में बिताते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक सहज रूप में, “कोई नई बात।” यूनानी में तुलनात्मक रूप “और नई” है, जो संभवतः हर बार सबसे नई बात जानने की निरंतर चाह प्रकट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀθηναῖοι δὲ πάντες
  choice: सभी एथेनावासी
  rationale: πάντες की व्यापकता को स्पष्ट रखा गया है। δὲ यहाँ हल्का संक्रमण अथवा व्याख्यात्मक प्रसंग-सूचक है; हिंदी में अलग संयोजक जोड़ना अनावश्यक और बोझिल होता।
- source_word: οἱ ἐπιδημοῦντες ξένοι
  choice: वहाँ ठहरे हुए परदेशी
  rationale: ἐπιδημοῦντες किसी स्थान पर अस्थायी रूप से उपस्थित या ठहरे होने का भाव देता है, जबकि ξένοι बाहरी अथवा परदेशी लोगों को दर्शाता है।
- source_word: εἰς οὐδὲν ἕτερον ηὐκαίρουν
  choice: अपना समय किसी और काम में नहीं ... बिताते थे
  rationale: अपूर्णकालीन ηὐκαίρουν आदतन चलने वाली गतिविधि बताता है। यह हिंदी अभिव्यक्ति मुहावरेदार ढंग से समय लगाने का भाव व्यक्त करती है।
- source_word: ἢ λέγειν τι ἢ ἀκούειν
  choice: बल्कि कोई ... बात कहने या सुनने में
  rationale: दोनों क्रियाओं की समानांतर रचना बनाए रखी गई है; λέγειν के लिए ‘कहने’ से किसी नई बात को दूसरों तक पहुँचाने का सामान्य अर्थ सुरक्षित रहता है।
- source_word: τι καινότερον
  choice: कोई और नई बात
  rationale: καινότερον तुलनात्मक रूप है। ‘और नई’ उसके शाब्दिक तुलनात्मक भाव तथा नवीनतम बात की लगातार चाह—दोनों को सुरक्षित रखता है; ‘बात’ संदर्भ में स्वाभाविक हिंदी है।
theological_decisions: []
