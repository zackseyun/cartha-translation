  text: Σταθεὶς ⸀δὲ Παῦλος ἐν μέσῳ τοῦ Ἀρείου Πάγου ἔφη· Ἄνδρες Ἀθηναῖοι, κατὰ πάντα ὡς δεισιδαιμονεστέρους ὑμᾶς θεωρῶ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: hi
  text: तब पौलुस ने अरियुपगुस के बीच में खड़े होकर कहा, “हे एथेंस के पुरुषो, मैं देखता हूँ कि तुम हर बात में बहुत धर्मपरायण[a] हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत अंधविश्वासी”; अथवा, “दूसरों से अधिक धर्मपरायण।” यूनानी शब्द का अर्थ नकारात्मक या सकारात्मक, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς δὲ
  choice: तब ... खड़े होकर
  rationale: δέ कथा में हल्का संक्रमण दिखाता है और Σταθείς भाषण के समय पौलुस की मुद्रा को स्थापित करता है; यह हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: अरियुपगुस के बीच में
  rationale: मूल का स्थानवाचक अर्थ बनाए रखा गया है; इसे केवल परिषद के सामने कहना अनावश्यक व्याख्या होती।
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: हे एथेंस के पुरुषो
  rationale: सम्बोधन की औपचारिकता और ἄνδρες का पुरुषवाचक रूप दोनों सुरक्षित रहते हैं।
- source_word: κατὰ πάντα
  choice: हर बात में
  rationale: व्यापक अर्थ को साधारण आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δεισιδαιμονεστέρους
  choice: बहुत धर्मपरायण
  rationale: तुलनात्मक रूप यहाँ तीव्रता व्यक्त कर सकता है। यह चयन अपेक्षाकृत सकारात्मक/तटस्थ है, जबकि यूनानी शब्द की नकारात्मक सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: θεωρῶ
  choice: मैं देखता हूँ
  rationale: यहाँ क्रिया ध्यानपूर्वक देखने और उससे निष्कर्ष ग्रहण करने का भाव रखती है; संक्षिप्त हिन्दी इसके लिए उपयुक्त है।
theological_decisions:
- issue: एथेंसवासियों के धर्म के विषय में पौलुस के कथन का स्वर
  choice: मुख्य पाठ में अपेक्षाकृत तटस्थ-सकारात्मक “बहुत धर्मपरायण”
  alternative: “बहुत अंधविश्वासी” अथवा “दूसरों से अधिक धर्मपरायण”
  rationale: δεισιδαιμονεστέρους प्रशंसात्मक, तटस्थ या आलोचनात्मक अर्थ दे सकता है। भाषण के आरम्भ में पौलुस की सम्भावित कूटनीतिक अस्पष्टता को किसी एक अर्थ में सीमित नहीं किया गया; विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक भाषण के अनुरूप हिन्दी। “हे ... पुरुषो” औपचारिक सम्बोधन को बनाए रखता है। अरियुपगुस को यूनानी नाम के लिप्यंतरण के रूप में रखा गया है।
