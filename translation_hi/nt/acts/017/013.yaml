  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। स्थान-नाम ‘थिस्सलुनीके’ और ‘बेरिया’ रखे गए हैं। दोनों वर्तमान कृदन्तों को हिन्दी में ‘लगे’ संरचना से निरन्तर/समकालीन सार्वजनिक उकसावे के रूप में व्यक्त किया गया है।
