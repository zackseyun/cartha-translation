  text: ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ κατηγγέλη ὑπὸ τοῦ Παύλου ὁ λόγος τοῦ θεοῦ, ἦλθον κἀκεῖ σαλεύοντες ⸂καὶ ταράσσοντες⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/013.yaml
  text: But when the Jews from Thessalonica learned that the word of God had been proclaimed by Paul in Berea also[a], they came there too[b], stirring up and troubling the crowds.
translation:
  language: hi
  text: परन्तु जब थिस्सलुनीके के यहूदियों को पता चला कि बेरिया में भी परमेश्वर का वचन पौलुस द्वारा घोषित किया गया था, तब वे वहाँ भी आए और भीड़ों को उकसाते और अशांत करते हुए[a] चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में «और अशांत करते हुए» शब्द नहीं हैं।
    reason: textual_variant
lexical_decisions:
- source_word: ὡς δὲ
  choice: परन्तु जब
  rationale: δέ पिछले प्रसंग की सकारात्मक प्रतिक्रिया के विपरीत कथात्मक मोड़ दिखाता है, और ὡς यहाँ समयसूचक है।
- source_word: ἔγνωσαν
  choice: पता चला
  rationale: यहाँ γινώσκω सूचना प्राप्त होने का भाव देता है; आधुनिक हिन्दी में ‘पता चला’ स्वाभाविक है।
- source_word: οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι
  choice: थिस्सलुनीके से आए यहूदियों
  rationale: समूह की पहचान उसके स्थान से करता है और सभी यहूदियों के बारे में सामान्य कथन बनने से बचाता है।
- source_word: καὶ ἐν τῇ Βεροίᾳ
  choice: बेरिया में भी
  rationale: 'καί अतिरिक्त स्थान पर बल देता है: थिस्सलुनीके के साथ बेरिया में भी प्रचार हुआ।'
- source_word: κατηγγέλη
  choice: सुनाया गया है
  rationale: καταγγέλλω सार्वजनिक घोषणा का बोध देता है; निष्क्रिय रूप सुरक्षित रखा गया है और हिन्दी में पूर्व घटित घटना की स्वाभाविक काल-संगति व्यक्त होती है।
- source_word: ὑπὸ τοῦ Παύλου
  choice: पौलुस के द्वारा
  rationale: ὑπό के साथ संबंधकारक निष्क्रिय क्रिया के व्यक्तिगत कर्ता को दर्शाता है।
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: यह प्रचलित बाइबलीय अभिव्यक्ति मूल की धार्मिक अनुगूँज बनाए रखते हुए घोषित ईश्वरीय सन्देश को व्यक्त करती है।
- source_word: ἦλθον κἀκεῖ
  choice: वे वहाँ भी आ पहुँचे
  rationale: κἀκεῖ का ‘वहाँ भी’ भाव सुरक्षित है; ‘आ पहुँचे’ विरोध को बेरिया तक ले आने का स्वाभाविक कथात्मक रूप है।
- source_word: σαλεύοντες
  choice: भड़काने
  rationale: लोगों में हलचल और उत्तेजना पैदा करने के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: καὶ ταράσσοντες
  choice: और अशान्त करने
  rationale: दूसरे कृदन्त को अलग रखते हुए उपद्रव, व्याकुलता और अव्यवस्था उत्पन्न करने का भाव देता है।
- source_word: τοὺς ὄχλους
  choice: भीड़
  rationale: ὄχλοι के सामूहिक अर्थ को बिना ‘उपद्रवी भीड़’ जैसा अतिरिक्त नकारात्मक अर्थ जोड़े व्यक्त करता है।
theological_decisions:
- issue: ὁ λόγος τοῦ θεοῦ का अनुवाद
  choice: परमेश्वर का वचन
  alternative: परमेश्वर का सन्देश
  rationale: ‘वचन’ मूल पद की धर्मवैचारिक अनुगूँज और परिचित बाइबलीय रूप को सुरक्षित रखता है, पर प्रसंग में इसका अर्थ घोषित सन्देश है; कोई बाद का तकनीकी अर्थ आरोपित नहीं किया गया।
