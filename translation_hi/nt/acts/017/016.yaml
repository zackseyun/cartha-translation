  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: hi
  text: जब पौलुस एथेंस में उनकी प्रतीक्षा कर रहा था, तब नगर को मूर्तियों से भरा हुआ[a] देखकर उसका मन भीतर ही भीतर भड़क उठा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नगर मूर्तिपूजा में डूबा हुआ था।’
    reason: lexical_alternative
  - marker: b
    text: या ‘व्याकुल हो उठा’ अथवा ‘उद्वेलित हो उठा’; यूनानी क्रिया तीव्र आंतरिक हलचल व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: प्रतीक्षा कर रहा था
  rationale: वर्तमान कृदंत की कालगत और जारी अवस्था को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παρωξύνετο
  choice: क्षुब्ध हो उठी
  rationale: यह यूनानी क्रिया तीखी आंतरिक हलचल या उत्तेजना बताती है; ‘क्षुब्ध’ केवल दुःख नहीं, बल्कि गहरी बेचैनी और तीव्र प्रतिक्रिया भी व्यक्त करता है।
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: उसकी आत्मा
  rationale: अधिकारसूचक पदबंध का सीधा अनुवाद है और यहाँ पौलुस की अपनी भीतरी आत्मा को दर्शाता है।
- source_word: ἐν αὐτῷ
  choice: उसके भीतर
  rationale: प्रतिक्रिया के आंतरिक स्थान पर दिए गए स्रोत-पाठ के बल को सुरक्षित रखता है।
- source_word: θεωροῦντος
  choice: देखकर
  rationale: पौलुस के ध्यानपूर्वक देखने और उसी समय उत्पन्न हुई प्रतिक्रिया को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατείδωλον
  choice: मूर्तियों से भरा हुआ
  rationale: नगर में मूर्तियों की अत्यधिक व्यापकता का स्पष्ट और सहज अर्थ देता है, बिना यह अतिरिक्त दावा किए कि नगर ने स्वयं को मूर्तियों के हवाले कर दिया था।
- source_word: πόλιν
  choice: नगर
  rationale: स्रोत में आए ‘नगर’ को बनाए रखता है; पूर्वोक्त एथेंस इसका स्पष्ट संदर्भ है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ प्रबल विरोध नहीं, बल्कि कथानक की प्रगति दर्शाता है। कालगत ‘जब…तब’ रचना हिन्दी में इस संबंध को स्वाभाविक रूप देती है।
theological_decisions:
- issue: ‘उसकी आत्मा’ का संदर्भ
  choice: पौलुस की अपनी मानवीय आत्मा
  alternative: पवित्र आत्मा की प्रेरणा की ओर संकेत
  rationale: अधिकारसूचक ‘उसकी’ और ‘उसके भीतर’ पौलुस की आंतरिक प्रतिक्रिया की ओर संकेत करते हैं। पद स्पष्ट रूप से इस प्रतिक्रिया को पवित्र आत्मा का कार्य नहीं कहता, इसलिए अनुवाद ऐसा दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आत्मा’ स्रोत के πνεῦμα को सीधे व्यक्त करता है, जबकि ‘क्षुब्ध’ तीव्र आंतरिक प्रतिक्रिया को संप्रेषित करता है। फुटनोट चिह्न पाठ में उनके संबंधित पदों के तुरंत बाद रखे गए हैं।
