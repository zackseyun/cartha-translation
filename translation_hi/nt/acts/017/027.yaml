  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: hi
  text: कि वे परमेश्वर को खोजें—शायद वे उसे टटोलकर खोजें और उसे पा लें—हालाँकि वह हममें से हर एक से दूर नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητεῖν
  choice: कि वे ... खोजें
  rationale: पिछले वाक्य पर आश्रित इस infinitive का प्रयोजनात्मक भाव हिन्दी में ‘कि वे ... खोजें’ से स्वाभाविक और स्पष्ट रहता है।
- source_word: τὸν θεόν
  choice: परमेश्वर को
  rationale: यहाँ निश्चित लेख का हिन्दी में अलग अनुवाद आवश्यक नहीं; ‘परमेश्वर’ सामान्य आधुनिक हिन्दी में स्वाभाविक ईश्वर-संबोधन है।
- source_word: εἰ ἄρα γε
  choice: शायद
  rationale: यह कण-समूह खोज के परिणाम को अनिश्चित और संभाव्य रखता है; ‘शायद’ उस संकोचपूर्ण संभावना को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ψηλαφήσειαν
  choice: वे उसे टटोलें
  rationale: क्रिया स्पर्श के सहारे, मानो अँधेरे या सीमित बोध में, खोजने का चित्र प्रस्तुत करती है। ‘टटोलें’ इस रूपक को बनाए रखता है।
- source_word: καὶ εὕροιεν
  choice: और पा लें
  rationale: यह ψηλαφήσειαν के साथ समान optative बल में जुड़ा है; ‘शायद’ दोनों क्रियाओं पर लागू होता है और ‘पा लें’ संभावित उपलब्धि को व्यक्त करता है।
- source_word: καί γε
  choice: हालाँकि
  rationale: यहाँ अगला कथन मानव की अनिश्चित खोज के बावजूद परमेश्वर की वास्तविक निकटता स्पष्ट करता है; ‘हालाँकि’ इस concessive संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐ μακρὰν
  choice: दूर नहीं है
  rationale: यह यूनानी अभिव्यक्ति का सीधा, सहज और अर्थ-सटीक हिन्दी रूप है।
- source_word: ἀπὸ ἑνὸς ἑκάστου ἡμῶν
  choice: हममें से हर एक से
  rationale: यह ἑνὸς ἑκάστου के वितरणात्मक जोर को सुरक्षित रखता है और प्रत्येक व्यक्ति से परमेश्वर की निकटता बताता है।
- source_word: ὑπάρχοντα
  choice: वह ... है
  rationale: यह participle परमेश्वर की वास्तविक निकटता बताता है; हिन्दी में finite construction ‘वह ... है’ सबसे स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर की निकटता और मनुष्य की सीमित खोज
  choice: ‘शायद वे उसे टटोलें और पा लें’ के द्वारा मानवीय खोज की अनिश्चितता तथा ‘हालाँकि वह ... दूर नहीं है’ के द्वारा परमेश्वर की वास्तविक निकटता—दोनों को साथ रखा गया है।
  alternative: रूपक हटाकर केवल ‘शायद वे उसे खोजकर पा लें’ कहना, या खोज को निश्चित सफलता के रूप में प्रस्तुत करना।
  rationale: यूनानी पाठ मनुष्य के सीमित बोध और परमेश्वर की सच्ची निकटता के बीच तनाव को बनाए रखता है; अनुवाद इसे न तो निराशाजनक खोज बनाता है, न सहज निश्चितता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पाठ में सहज है। ‘टटोलें’ मूल रूपक को साधारण पाठक के लिए बोधगम्य रखते हुए संरक्षित करता है।
