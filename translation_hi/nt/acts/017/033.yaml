lexical_decisions:
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह प्रसंग के समापन को सूचित करने वाला संबंधसूचक शब्द है। ‘इस प्रकार’ उसके निष्कर्षात्मक और वर्णनात्मक भाव को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ὁ Παῦλος
