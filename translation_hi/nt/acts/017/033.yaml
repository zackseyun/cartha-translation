  rationale: व्यक्ति के नाम का प्रचलित मानक हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: ἐξῆλθεν
  choice: निकल गया
  rationale: ἐξέρχομαι के ठोस गति-सूचक अर्थ ‘बाहर जाना/निकलना’ को सुरक्षित रखता है और ‘उनके बीच से’ के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: ἐκ μέσου αὐτῶν
  choice: उनके बीच से
  rationale: यह समूह के मध्य से चले जाने का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
