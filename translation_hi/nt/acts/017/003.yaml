  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: hi
  text: वह अर्थ खोलकर समझाता और प्रमाण सामने रखता था कि मसीह को दुःख सहना और मरे हुओं में से जी उठना आवश्यक था[a], और कि यही यीशु, जिसकी मैं तुम्हें घोषणा करता हूँ, मसीह है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में सक्रिय रूप है: “जी उठना।” नए नियम में अन्य स्थानों पर यीशु के परमेश्वर द्वारा जिलाए जाने की बात भी कही गई है।'
    reason: ἀναστῆναι के सक्रिय रूप और ‘जिलाया जाना’ वाले वैकल्पिक अनुवाद के बीच अंतर स्पष्ट करता है।
lexical_decisions:
- source_word: διανοίγων
  choice: अर्थ खोलकर समझाता
  rationale: यह पद संदर्भ में पवित्र शास्त्र का अर्थ खोलने और स्पष्ट करने की क्रिया बताता है; यह हिन्दी में स्वाभाविक रहते हुए मूल रूपक की झलक भी रखता है।
- source_word: παρατιθέμενος
  choice: प्रमाण सामने रखता
  rationale: मूल क्रिया का भाव बातों या प्रमाणों को श्रोताओं के सामने विचारार्थ रखने का है; यह 'सिद्ध करता' की अपेक्षा तर्क की शक्ति को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: τὸν χριστόν / ὁ χριστός
  choice: मसीह
  rationale: दोनों स्थानों पर Χριστός उपाधि के रूप में प्रयुक्त है और अपेक्षित अभिषिक्त जन को सूचित करता है; हिन्दी में 'मसीह' इसका स्थापित और सुबोध रूप है।
- source_word: ἔδει
  choice: आवश्यक था
  rationale: यह शास्त्र और परमेश्वर की योजना में निहित आवश्यकता को व्यक्त करता है तथा हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: παθεῖν
  choice: दुःख सहना
  rationale: यह πάσχω का सीधा और प्रचलित हिन्दी रूप है, जो मसीह के दुःखों को व्यक्त करता है।
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: मरे हुओं में से जी उठना
  rationale: सक्रिय अनंत क्रिया का सीधा अर्थ 'जी उठना' है; ἐκ νεκρῶν का बहुवचन-सदृश सामूहिक भाव 'मरे हुओं में से' से सुरक्षित रहता है।
- source_word: καταγγέλλω ὑμῖν
  choice: जिसकी घोषणा मैं तुम्हारे बीच करता हूँ
  rationale: καταγγέλλω सार्वजनिक रूप से संदेश घोषित करने का भाव रखता है। दत्तिव ὑμῖν को 'तुम्हारे बीच' कहना हिन्दी में इस संबोधन और सार्वजनिक घोषणा के संदर्भ को स्वाभाविक बनाता है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में कैसे व्यक्त किया जाए
  choice: दोनों स्थानों पर ‘मसीह’
  alternative: ‘ख्रीस्त’ अथवा ‘अभिषिक्त जन’
  rationale: यहाँ तर्क अपेक्षित यहूदी मसीह की पहचान यीशु से कराता है। ‘मसीह’ हिन्दी पाठकों के लिए स्थापित उपाधि है और इसे निजी नाम में नहीं बदलता।
- issue: ἀναστῆναι की वाच्य-संबंधी सूक्ष्मता
  choice: जी उठना
  alternative: जिलाया जाना
  rationale: यूनानी पाठ में सक्रिय अनंत क्रिया है, इसलिए ‘जी उठना’ उसका सीधा रूप है। अन्य पदों की ‘परमेश्वर ने जिलाया’ वाली भाषा को यहाँ आरोपित नहीं किया गया।
- issue: ἔδει में व्यक्त आवश्यकता
  choice: आवश्यक था
  alternative: होना ही था
  rationale: यह शास्त्रीय/दैवी आवश्यकता को बनाए रखता है, पर उसके दार्शनिक या कारणगत स्वरूप को पाठ से अधिक स्पष्ट करके विवाद को नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। ‘अर्थ खोलकर समझाता’ और ‘प्रमाण सामने रखता’ मूल के दोनों कृदंतों का अंतर बनाए रखते हैं। मुख्य पाठ में एकमात्र पाद-टिप्पणी चिह्न [a] उसके संबंधित वाक्यांश के तुरंत बाद दिया गया है।
