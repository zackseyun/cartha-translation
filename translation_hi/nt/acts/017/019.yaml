  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοί ⸀τε αὐτοῦ ἐπὶ τὸν Ἄρειον Πάγον ἤγαγον, λέγοντες· Δυνάμεθα γνῶναι τίς ἡ καινὴ αὕτη ἡ ὑπὸ σοῦ λαλουμένη διδαχή;
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: hi
  text: तब वे उसे पकड़कर अरियुपगुस[a] में ले गए, और कहते हुए बोले, “क्या हम जान सकते हैं कि यह नई शिक्षा, जो तुम सुना रहे हो, क्या है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अरियुपगुस’ से स्वयं पहाड़ी या उससे संबद्ध परिषद का संकेत हो सकता है। इसका पारंपरिक नाम ‘मार्स हिल’ भी है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: पकड़कर
  rationale: यह क्रिया शारीरिक रूप से थामने या पकड़ने का संकेत देती है। ‘पकड़कर’ पहल और कुछ दृढ़ता बनाए रखता है, पर इसे औपचारिक गिरफ्तारी नहीं बनाता।
- source_word: τε
  choice: तब
  rationale: यह हल्का संयोजक कथा को पिछले प्रसंग से जोड़ता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक कथात्मक प्रगति व्यक्त करता है।
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: अरियुपगुस में
  rationale: यूनानी नाम का लिप्यंतरण स्थान और उससे संबद्ध परिषद के बीच की संभावित अस्पष्टता को सुरक्षित रखता है। ‘में’ हिन्दी में गंतव्य के लिए स्वाभाविक है और किसी एक ऐतिहासिक व्याख्या को कठोरता से नहीं थोपता।
- source_word: ἤγαγον
  choice: ले गए
  rationale: ἄγω का सामान्य अर्थ ले जाना या अगुवाई करके पहुँचाना है; ‘पकड़कर ... ले गए’ हिन्दी में सहज है।
- source_word: λέγοντες
  choice: और कहने लगे
  rationale: यह मुख्य क्रिया के साथ चल रही वाणी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Δυνάμεθα γνῶναι
  choice: क्या हम जान सकते हैं
  rationale: यह विनम्र जिज्ञासा या अनुरोध का स्वर बनाए रखता है और सामर्थ्य-सूचक यूनानी रचना को भी दर्शाता है।
- source_word: καινὴ
  choice: नई
  rationale: सुनने वालों के लिए नवीन या अपरिचित शिक्षा का व्यापक और सहज हिन्दी समतुल्य।
- source_word: ὑπὸ σοῦ λαλουμένη
  choice: जिसे तुम सुना रहे हो
  rationale: यूनानी निष्क्रिय कृदंत का आशय स्वाभाविक हिन्दी सक्रिय रचना में व्यक्त होता है; ‘सुना रहे हो’ शिक्षा को लोगों के सामने मौखिक रूप से प्रस्तुत करने का भाव देता है।
- source_word: διδαχή
  choice: शिक्षा
  rationale: यह आधुनिक हिन्दी में स्पष्ट और सामान्य शब्द है; ‘सिद्धान्त’ यहाँ अनावश्यक रूप से तकनीकी या धर्म-सांप्रदायिक लग सकता है।
theological_decisions:
- issue: पौलुस को अरियुपगुस ले जाने की क्रिया का स्वर
  choice: दृढ़ शारीरिक पहल, पर आवश्यक रूप से शत्रुतापूर्ण गिरफ्तारी नहीं
  alternative: औपचारिक गिरफ्तारी; या केवल विनम्र निमंत्रण
  rationale: ἐπιλαμβάνομαι पकड़ने या थामने का बोध देता है, जबकि निकट संदर्भ जिज्ञासा दिखाता है। इसलिए अनुवाद न तो शारीरिक पहल मिटाता है, न इसे गिरफ्तारी घोषित करता है।
- issue: Ἄρειος Πάγος का संकेत
  choice: उचित नाम ‘अरियुपगुस’, जो स्थान या उससे संबद्ध परिषद दोनों के लिए खुला रहे
  alternative: ‘मंगल पहाड़ी’ जैसे स्थान-विशेष का अनुवाद; या स्पष्टतः ‘अरियुपगुस की परिषद’
  rationale: यूनानी पद पहाड़ी और उससे संबद्ध निकाय, दोनों को सूचित कर सकता है। मुख्य पाठ इस ऐतिहासिक अस्पष्टता को अनावश्यक रूप से हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पकड़कर’ मूल की शारीरिकता बचाता है, जबकि ‘जिसे तुम सुना रहे हो’ शब्दशः निष्क्रिय रचना की अपेक्षा स्वाभाविक हिन्दी देता है।
