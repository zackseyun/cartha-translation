id: ACT.17.24
reference: Acts 17:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: hi
  text: जिस परमेश्वर ने संसार और उसमें जो कुछ है, सब बनाया, वही स्वर्ग और पृथ्वी का प्रभु होकर मनुष्यों के हाथों बनाए हुए मंदिरों में निवास नहीं करता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσας
  choice: जिस ... ने ... बनाया
  rationale: भूतकालिक कृदंत परमेश्वर को संसार के बनानेवाले के रूप में विशेषित करता है; हिन्दी में संबंधवाचक वाक्य स्वाभाविक और अर्थनिष्ठ है।
- source_word: κόσμον
  choice: संसार
  rationale: यहाँ शब्द समूची सृष्टि-व्यवस्था की ओर संकेत करता है; ‘संसार’ आधुनिक हिन्दी में व्यापक और सहज है।
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: उसमें जो कुछ है, सब
  rationale: यह κόσμον के भीतर की हर वस्तु और प्राणी को समेटनेवाली अभिव्यक्ति है; यह रूप πάντα की व्यापकता बनाए रखता है।
- source_word: ὑπάρχων κύριος
  choice: प्रभु होकर
  rationale: यह परमेश्वर की विद्यमान स्थिति को व्यक्त करता है और कृदंत को कारणवाचक बनाकर अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: οὐρανοῦ καὶ γῆς
  choice: स्वर्ग और पृथ्वी का
  rationale: यह κύριος पर आश्रित संबंधकारक पद है; हिन्दी का यह पारंपरिक और स्पष्ट युग्म मूल के एकवचन रूप को दर्शाता है।
- source_word: χειροποιήτοις
  choice: मनुष्यों के हाथों बनाए हुए
  rationale: शब्द का आशय मानव-निर्मित है। ‘मनुष्यों’ जोड़ने से हिन्दी में स्पष्ट होता है कि बात मानव हाथों से बने मंदिरों की है, न कि परमेश्वर द्वारा बनाई वस्तुओं की।
- source_word: ναοῖς
  choice: मंदिरों
  rationale: यह पवित्र उपासना-स्थलों को दर्शाता है; अरियुपगुस के संदर्भ में ‘मंदिर’ सबसे स्पष्ट सामान्य हिन्दी शब्द है।
- source_word: κατοικεῖ
  choice: निवास नहीं करता
  rationale: यह स्थायी रूप से रहने या वास करने का भाव देता है; ‘निवास करना’ गरिमापूर्ण होने के साथ आधुनिक पाठकों के लिए सुबोध है।
theological_decisions:
- issue: परमेश्वर की पारलौकिकता और मंदिरों में स्थानीयकरण
  choice: सृष्टिकर्ता और स्वर्ग-पृथ्वी का प्रभु मानव-निर्मित मंदिरों में निवास नहीं करता।
  alternative: परमेश्वर मंदिरों में सीमित नहीं है।
  rationale: सीधा कथन मूल यूनानी के निकट रहता है और ‘सीमित’ जैसी व्याख्यात्मक धारणा जोड़ने के बजाय उसके धर्मवैज्ञानिक तनाव को यथावत रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘वही’ οὗτος के संकेतात्मक बल को व्यक्त करता है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि χειροποιήτοις का अर्थ मुख्य पाठ में ही स्पष्ट कर दिया गया है।
