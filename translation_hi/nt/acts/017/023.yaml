  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ βωμὸν ἐν ᾧ ἐπεγέγραπτο· Ἀγνώστῳ θεῷ. ⸀ὃ οὖν ἀγνοοῦντες εὐσεβεῖτε, ⸀τοῦτο ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: hi
  text: क्योंकि तुम्हारे बीच से होकर जाते और तुम्हारी पूज्य वस्तुओं को ध्यान से देखते हुए मुझे एक वेदी भी मिली, जिस पर लिखा था, “एक अज्ञात देवता के लिए।” इसलिए जिसकी तुम अनजाने में आराधना करते हो, उसी को मैं तुम्हें घोषित करता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διερχόμενος
  choice: जब मैं घूमते हुए
  rationale: वर्तमान कृदंत नगर में होकर जाने का भाव देता है; प्रसंग में स्वाभाविक हिन्दी के लिए इसे कालसूचक उपवाक्य में रखा गया है।
- source_word: ἀναθεωρῶν
  choice: ध्यान से देख रहा था
  rationale: यह केवल देखने नहीं, बल्कि ध्यानपूर्वक निरीक्षण करने का भाव रखता है।
- source_word: σεβάσματα
  choice: उपासना की वस्तुओं
  rationale: यह पूजित धार्मिक वस्तुओं और स्थलों के लिए व्यापक शब्द है; ‘मन्दिरों’ जैसा संकरा अर्थ नहीं लिया गया।
- source_word: βωμὸν
  choice: वेदी
  rationale: बलि अथवा धार्मिक अर्पण की वेदी के लिए मानक हिन्दी शब्द।
- source_word: ἐπεγέγραπτο
  choice: जिस पर लिखा था
  rationale: यूनानी पूर्णभूत कर्मवाच्य का परिणाम—वेदी पर पहले से अंकित लेख—सरल और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: Ἀγνώστῳ θεῷ
  choice: एक अज्ञात देवता के लिए
  rationale: यूनानी में उपपद नहीं है; समर्पण-लेख के रूप में अनिश्चित अर्थ को मुख्य पाठ में रखा गया है।
- source_word: ὃ οὖν
  choice: इसलिए जिसे
  rationale: οὖν का निष्कर्षसूचक बल ‘इसलिए’ से रखा गया है। हिन्दी में ‘जिसे’ स्वाभाविक है, पर यह यूनानी नपुंसकलिंग सर्वनाम की अवैयक्तिकता को कुछ कम कर सकता है; इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἀγνοοῦντες
  choice: बिना जाने
  rationale: उपासना के ढंग को बताने वाला कृदंत है और ‘अज्ञात’ के साथ वक्तृत्वपूर्ण संबंध बनाए रखता है।
- source_word: εὐσεβεῖτε
  choice: पूजते हैं
  rationale: यह श्रद्धापूर्ण धार्मिक भक्ति को व्यक्त करता है; इस प्रसंग में ‘पूजना’ साधारण पाठक के लिए स्पष्ट है।
- source_word: καταγγέλλω
  choice: घोषणा करता हूँ
  rationale: सार्वजनिक और अधिकारपूर्ण रूप से बताने के अर्थ को व्यक्त करता है।
theological_decisions:
- issue: नपुंसकलिंग सम्बन्धवाचक सर्वनाम ὃ का सन्दर्भ
  choice: मुख्य पाठ में स्वाभाविक हिन्दी ‘जिसे आप बिना जाने पूजते हैं’ रखा गया, साथ ही पादटिप्पणी में अधिक अवैयक्तिक रूप दिया गया।
  alternative: ‘जिस वस्तु की आप अनजाने में उपासना करते हैं’
  rationale: यूनानी ‘क्या/जिस वस्तु को’ के निकट है और सीधे ‘जिस व्यक्ति को’ नहीं कहता। हिन्दी में परमेश्वर के सन्दर्भ में अवैयक्तिक रूप अत्यन्त अस्वाभाविक हो सकता है, इसलिए मुख्य पाठ पठनीय रखा गया, पर मूल की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली। धार्मिक शब्दावली में ‘उपासना’, ‘वेदी’, ‘अज्ञात देवता’ और ‘घोषणा’ जैसे व्यापक रूप से समझे जाने वाले शब्द चुने गए हैं।
