source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: hi
  text: एपिकूरी और स्तोइकी दार्शनिकों में से कुछ भी उससे चर्चा करने लगे[a]। उनमें से कुछ कह रहे थे, “यह बकवादी[b] आखिर कहना क्या चाहता है?” पर दूसरे कह रहे थे, “यह तो विदेशी देवताओं[c] का घोषक जान पड़ता है।” वे ऐसा इसलिए कहते थे कि पौलुस यीशु और पुनरुत्थान के विषय में शुभ समाचार सुना रहा था[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उससे बातचीत करने लगे” अथवा “उससे वाद-विवाद करने लगे”; यूनानी क्रिया सक्रिय चर्चा या विवाद को सूचित कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: “बकवादी” एक तिरस्कारसूचक यूनानी शब्द का अनुवाद है, जिसका शाब्दिक अर्थ “बीज बीनने वाला” है। यह इधर-उधर से विचारों के टुकड़े बटोरकर उन्हें दोहराने वाले व्यक्ति के लिए कहा जाता था।
    reason: cultural_note
  - marker: c
    text: या “विदेशी दैवी सत्ताओं” अथवा “पराए देवताओं।” यहाँ वक्ताओं का आशय अपने बहुदेववादी दृष्टिकोण के अनुसार अपरिचित दैवी सत्ताओं से है, आवश्यक रूप से मसीही अर्थ में दुष्टात्माओं से नहीं।
    reason: alternative_reading
  - marker: d
    text: कुछ व्याख्याकारों के अनुसार एथेनियों ने “पुनरुत्थान” को किसी दूसरी देवी या दैवी सत्ता का नाम समझा होगा, क्योंकि पौलुस यीशु और पुनरुत्थान के विषय में शुभ समाचार सुना रहा था।
    reason: alternative_reading
lexical_decisions:
- source_word: συνέβαλλον αὐτῷ
  choice: उससे बातचीत और वाद-विवाद करने लगे
  rationale: क्रिया यहाँ सक्रिय चर्चा से लेकर विवाद तक का अर्थ दे सकती है। संयुक्त अभिव्यक्ति दार्शनिक संदर्भ में इसकी व्यापकता को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: σπερμολόγος
  choice: बकवादी
  rationale: यह एक तिरस्कारसूचक शब्द है, जिसका शाब्दिक संबंध बिखरे बीज चुनने वाले से है और जो इधर-उधर से विचारों के टुकड़े बटोरकर दोहराने वाले व्यक्ति के लिए प्रयुक्त होता था। ‘बकवादी’ उपहास और अवमानना को संक्षेप में व्यक्त करता है।
- source_word: Τί ἂν θέλοι ... λέγειν
  choice: आखिर कहना क्या चाहता है?
  rationale: ἄν के साथ optative अनुमान और कुछ तिरस्कार का भाव देता है। ‘आखिर’ सहित यह प्रश्न आधुनिक हिन्दी में उस लहजे को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ξένων δαιμονίων
  choice: विदेशी देवताओं
  rationale: एथेनियों के बहुदेववादी दृष्टिकोण में δαιμόνια अपरिचित दैवी सत्ताओं को सूचित करता है; यहाँ ‘दुष्टात्माओं’ कहना बाद की मसीही अर्थछाया आरोपित कर सकता है।
- source_word: καταγγελεὺς
  choice: प्रचारक
  rationale: यह संज्ञा सार्वजनिक रूप से घोषणा करने वाले को सूचित करती है। हिन्दी में ‘प्रचारक’ स्पष्ट और प्रसंगानुकूल है, यद्यपि आधुनिक संस्थागत अर्थछाया के कारण ‘घोषक’ भी संभव है।
- source_word: εὐηγγελίζετο
  choice: शुभ समाचार सुना रहा था
  rationale: क्रिया अच्छी खबर घोषित करने का विशिष्ट अर्थ रखती है; यह रूप सामान्य ‘उपदेश दे रहा था’ से अधिक सटीक है।
- source_word: ἀνάστασιν
  choice: पुनरुत्थान
  rationale: यहाँ लूका पौलुस के संदेश की विषयवस्तु बताता है। संज्ञा को व्यक्तिनाम न बनाकर सामान्य धार्मिक अवधारणा के रूप में रखा गया है।
- source_word: Ἐπικουρείων καὶ Στοϊκῶν φιλοσόφων
  choice: इपीकुरी और स्तोईकी दार्शनिकों
  rationale: दोनों ऐतिहासिक दर्शन-परंपराओं के नामों को प्रचलित हिन्दी विशेषण-रूप में रखते हुए यूनानी संबंधकारक संरचना को स्वाभाविक हिन्दी बनाया गया है।
theological_decisions:
- issue: बहुदेववादी वक्ताओं के कथन में δαιμόνια का अनुवाद
  choice: विदेशी देवताओं
  alternative: विदेशी दैवी सत्ताओं; पराए देवताओं; विदेशी दुष्टात्माओं
  rationale: वक्ताओं की अपनी धार्मिक श्रेणियों को व्यक्त करना आवश्यक है। ‘दुष्टात्माएँ’ उनके आशय में अनिवार्य नैतिक बुराई जोड़ देगा, जो इस संदर्भ में निश्चित नहीं है।
- issue: ἀνάστασιν को व्यक्तित्वयुक्त देवी के नाम की तरह प्रस्तुत करना या सामान्य संज्ञा रखना
  choice: पुनरुत्थान
  alternative: ‘पुनरुत्थान’ को किसी देवी का नाम समझे जाने का संकेत मुख्य पाठ में देना
  rationale: यूनानी कथावाचक इसे पौलुस के संदेश की विषयवस्तु के रूप में प्रस्तुत करता है। एथेनियों द्वारा इसे दूसरी दैवी सत्ता समझने की संभावना वास्तविक पर अनिश्चित है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज स्तर रखा गया है। ‘इपीकुरी’ और ‘स्तोईकी’ ऐतिहासिक दर्शन-समुदायों के नाम हैं। वाक्य-विन्यास यूनानी प्रतिक्रियाओं—कुछ…कुछ…पर दूसरे—के क्रम और विरोध को बनाए रखता है।
