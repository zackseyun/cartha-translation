  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: hi
  text: जब उन्होंने मरे हुओं के जी उठने के बारे में सुना, तो कुछ लोग उपहास करने लगे, पर दूसरों ने कहा, “हम इस विषय में तुमसे फिर सुनेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: जब उन्होंने ... सुनी, तो
  rationale: कालवाचक कृदंत को स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है; δὲ यहाँ हल्की कथात्मक प्रगति दिखाता है, जिसे अलग शब्द जोड़ने के बजाय वाक्य-संरचना वहन करती है।
- source_word: ἀνάστασιν νεκρῶν
  choice: मरे हुओं के जी उठने की बात
  rationale: यह सामान्य पाठक के लिए स्वाभाविक है और मृतकों के पुनरुत्थान की धारणा को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के व्यक्त करता है।
- source_word: οἱ μὲν ... οἱ δὲ
  choice: कुछ लोग ... पर दूसरों ने
  rationale: दो श्रोता-समूहों की विपरीत प्रतिक्रियाओं को स्पष्ट और सहज हिन्दी में बनाए रखता है।
- source_word: ἐχλεύαζον
  choice: उपहास करने लगे
  rationale: अपूर्ण भूतकाल प्रतिक्रिया के आरम्भ होकर चलने का संकेत दे सकता है; यह हिन्दी प्रयोग प्रसंग में स्वाभाविक है, यद्यपि साधारण 'उपहास किया' भी संभव है।
- source_word: Ἀκουσόμεθά σου
  choice: हम ... तुमसे ... सुनेंगे
  rationale: ἀκούω के साथ संबंधवाचक सर्वनाम का अर्थ किसी व्यक्ति को सुनना है; हिन्दी में 'तुमसे सुनेंगे' वही अर्थ स्वाभाविक रूप से देता है।
- source_word: περὶ τούτου καὶ πάλιν
  choice: इस विषय में ... फिर
  rationale: περὶ τούτου को 'इस विषय में' और καὶ πάλιν की स्पष्ट पुनरावृत्तिकालीन शक्ति को 'फिर' से सीधे व्यक्त किया गया है।
theological_decisions:
- issue: ἀνάστασιν νεκρῶν का अर्थ
  choice: मरे हुओं के जी उठने की बात
  alternative: मरे हुओं में से जी उठने की बात
  rationale: मूल पद मृतकों को एक वर्ग के रूप में लेकर उनके पुनरुत्थान की धारणा बताता है; चुना हुआ पाठ किसी एक व्यक्ति के मृतकों में से उठने तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सहज। 'पुनरुत्थान' की अपेक्षा 'जी उठना' अधिक सुलभ है। मूल का καὶ πάλιν मुख्य पाठ में 'फिर' के रूप में सुरक्षित है, इसलिए पादटिप्पणी आवश्यक नहीं।
