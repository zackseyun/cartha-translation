  text: οὐδὲ ὑπὸ χειρῶν ⸀ἀνθρωπίνων θεραπεύεται προσδεόμενός τινος, αὐτὸς διδοὺς πᾶσι ζωὴν καὶ πνοὴν ⸂καὶ τὰ⸃ πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: hi
  text: और न उसकी सेवा मनुष्य के हाथों से की जाती है[a], मानो उसे किसी चीज़ की आवश्यकता हो; क्योंकि वही सबको जीवन, साँस और सब कुछ देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य के हाथों से उसकी आराधना की जाती है।” यूनानी क्रिया धार्मिक प्रसंग में की जाने वाली सेवा या परिचर्या का बोध करा सकती है; यहाँ आशय यह है कि परमेश्वर मनुष्यों की सेवा पर निर्भर नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θεραπεύεται
  choice: उसकी सेवा ... की जाती है
  rationale: यहाँ क्रिया का अर्थ चंगा करना नहीं, बल्कि सेवा या धार्मिक परिचर्या पाना है। निष्क्रिय रूप और परमेश्वर की आत्मनिर्भरता का तर्क दोनों सुरक्षित रहते हैं।
- source_word: ὑπὸ χειρῶν ἀνθρωπίνων
  choice: मनुष्य के हाथों से
  rationale: यह ठोस यूनानी मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है और मानवीय धार्मिक सेवा की ओर संकेत करता है।
- source_word: προσδεόμενός τινος
  choice: मानो उसे किसी चीज़ की आवश्यकता हो
  rationale: 'यह कृदन्त के प्रसंगगत, अनुमानात्मक बल को व्यक्त करता है: परमेश्वर की सेवा इस प्रकार नहीं होती जैसे वह किसी अभाव की पूर्ति चाहता हो।'
- source_word: αὐτὸς
  choice: वही
  rationale: 'बलाघातपूर्ण सर्वनाम का विरोधाभास सुरक्षित रहता है: आवश्यकता पाने वाला नहीं, स्वयं देने वाला परमेश्वर है।'
- source_word: διδοὺς
  choice: देता है
  rationale: हिन्दी में स्वतंत्र क्रिया कारणात्मक सम्बन्ध को सहजता से व्यक्त करती है।
- source_word: πᾶσι
  choice: सबको
  rationale: मूल का व्यापक और अनिर्बंध दायरा बनाए रखता है, बिना उसे स्पष्टतः केवल मनुष्यों तक सीमित किए।
- source_word: ζωὴν
  choice: जीवन
  rationale: मानक और प्रसंगानुकूल अनुवाद।
- source_word: πνοὴν
  choice: साँस
  rationale: ‘जीवन’ के साथ यह प्राणीगत निर्भरता को व्यक्त करता है; ‘आत्मा’ यहाँ अनावश्यक अर्थ-विस्तार होगा।
- source_word: καὶ τὰ πάντα
  choice: और सब कुछ
  rationale: यह जीवन और साँस से आगे पूर्ण व्यापकता को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐδὲ
  choice: और न
  rationale: पिछले पद के निषेध को आगे बढ़ाने वाला सम्बन्ध हिन्दी में स्पष्ट रहता है।
theological_decisions:
- issue: θεραπεύεται को स्पष्टतः आराधना के रूप में अनुवादित किया जाए या व्यापक धार्मिक सेवा के रूप में
  choice: उसकी सेवा ... की जाती है
  alternative: उसकी आराधना ... की जाती है
  rationale: पौलुस का तर्क यह है कि परमेश्वर मनुष्यों द्वारा दी जाने वाली धार्मिक परिचर्या पर निर्भर नहीं है। ‘सेवा’ उपासना-संबंधी संदर्भ को समाहित करती है, पर मूल क्रिया को केवल आराधना तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मनुष्य के हाथों’ का बाइबिलीय ठोस मुहावरा और ‘वही’ का बलाघात सुरक्षित रखा गया है।
