  text: ἐποίησέν τε ἐξ ⸀ἑνὸς πᾶν ἔθνος ἀνθρώπων κατοικεῖν ἐπὶ ⸂παντὸς προσώπου⸃ τῆς γῆς, ὁρίσας προστεταγμένους καιροὺς καὶ τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: hi
  text: और उसने एक ही मनुष्य से हर मानव समुदाय को सारी पृथ्वी पर रहने के लिए बनाया, और उनके ठहराए हुए समयों और उनके निवास की सीमाओं को निर्धारित किया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में “एक ही से” के स्थान पर “एक ही लहू से” है। मुख्य पाठ SBLGNT के “एक ही से” का अनुसरण करता है और अर्थ स्पष्ट करने के लिए “मनुष्य” जोड़ता है।
    reason: textual_variant
  - marker: b
    text: “उनके ठहराए हुए समयों” का अनुवाद “उनके लिए नियत समयों” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν
  choice: बनाया
  rationale: यहाँ ποιέω मानवजाति के साझा उद्गम को अस्तित्व में लाने का व्यापक भाव रखता है; ‘बनाया’ स्वाभाविक है और अनावश्यक रूप से सृष्टि की प्रक्रिया को अधिक विशिष्ट नहीं करता।
- source_word: ἐξ ἑνὸς
  choice: एक ही मनुष्य से
  rationale: यूनानी पाठ में शाब्दिक रूप से ‘एक से’ है। हिंदी में अभिप्रेत मानवीय संदर्भ स्पष्ट और सहज करने के लिए ‘मनुष्य’ जोड़ा गया है; ‘लहू’ मुख्य पाठ की रीडिंग नहीं है।
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: मनुष्यों की हर जाति
  rationale: ἔθνος यहाँ अलग-अलग मानव समुदायों को दर्शाता है। ‘हर जाति’ स्रोत की वितरणात्मक अभिव्यक्ति को बनाए रखती है, जबकि ‘मनुष्यों की’ पूरे मानव परिवार का संदर्भ स्पष्ट करती है।
- source_word: κατοικεῖν
  choice: रहें
  rationale: यह धातु बसने या निवास करने का भाव देती है; ‘रहें’ आधुनिक हिंदी में सहज है और आगे आने वाला भौगोलिक संदर्भ निवास का अर्थ स्पष्ट रखता है।
- source_word: ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: सारी पृथ्वी पर
  rationale: ‘पृथ्वी के सारे मुख पर’ हिंदी में कृत्रिम लगेगा। ‘सारी पृथ्वी पर’ मूल मुहावरे का अर्थ स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: ὁρίσας
  choice: निर्धारित कीं
  rationale: यह कृदंत समयों और सीमाओं को ठहराने या निश्चित करने का भाव देता है; हिंदी में अलग समन्वित वाक्य बनाकर इसका संबंध स्पष्ट और पठनीय रखा गया है।
- source_word: προστεταγμένους καιροὺς
  choice: उनके नियत समय
  rationale: καιροί विशिष्ट कालों या अवसरों को और προστεταγμένους पहले से ठहराए जाने को दर्शाता है। ‘नियत समय’ इस संयुक्त भाव को संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν
  choice: उनके निवास की सीमाएँ
  rationale: ὁροθεσία सीमा-निर्धारण को और κατοικία निवास-स्थान को दर्शाता है; यह अभिव्यक्ति भौगोलिक अर्थ को स्पष्ट रखते हुए यूनानी संरचना के निकट है।
theological_decisions:
- issue: ἐξ ἑνὸς में निहित संदर्भ को स्पष्ट करना
  choice: एक ही मनुष्य से
  alternative: एक ही से
  rationale: मुख्य यूनानी पाठ केवल ‘एक से’ कहता है, पर हिंदी में यह अधूरा या अस्पष्ट लग सकता है। ‘मनुष्य’ जोड़ना मानवजाति के साझा उद्गम को स्पष्ट करता है, जबकि ‘लहू’ वाली पाठ-परंपरा को मुख्य पाठ में नहीं लाता।
- issue: मानव समूहों के समय और सीमाओं में परमेश्वर की भूमिका
  choice: उसने उनके नियत समय और उनके निवास की सीमाएँ भी निर्धारित कीं
  alternative: उसने उनके लिए समय और निवास की सीमाएँ ठहराईं
  rationale: अनुवाद परमेश्वर द्वारा समयों और सीमाओं के निर्धारण को स्पष्ट रखता है, पर यह आगे बढ़कर इस निर्धारण की सटीक रीति या उसके दार्शनिक निहितार्थ तय नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी के लंबे वाक्य को हिंदी में दो वाक्यों में बाँटा गया है; ‘भी’ मूल τε के संयोजक भाव को व्यक्त करता है। ‘जाति’ का अर्थ यहाँ मानव समुदाय या राष्ट्र है, सामाजिक जाति-व्यवस्था नहीं।
