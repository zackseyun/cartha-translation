source:
  edition: SBLGNT
  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: hi
  text: इसलिए, चूँकि हम परमेश्वर की संतान हैं, हमें यह नहीं समझना चाहिए कि दिव्य सत्ता[a] सोने, चाँदी या पत्थर की, मनुष्य की कला और कल्पना से गढ़ी हुई किसी आकृति[b] के समान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देवता,” “ईश्वरीय स्वरूप,” अथवा “ईश्वरत्व।” यूनानी पद τὸ θεῖον व्यापक रूप से उस सत्ता को सूचित करता है जो दिव्य है; यहाँ पौलुस के तर्क में इसका संकेत सच्चे परमेश्वर की ओर है।
    reason: lexical_alternative
  - marker: b
    text: या “कोई तराशी हुई प्रतिमा” अथवा “कोई उत्कीर्ण वस्तु।”
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: संतान
  rationale: यहाँ मनुष्यों का परमेश्वर से उद्भव और संबंध व्यक्त होता है; ‘संतान’ जातीय अर्थ से बचते हुए इस भाव को स्वाभाविक हिन्दी में बताता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकाले गए निष्कर्ष को स्पष्ट करता है।
- source_word: ὑπάρχοντες
  choice: जब हम ... हैं
  rationale: संदर्भ में कृदंत कारणसूचक है; हिन्दी में ‘जब हम ... हैं’ आधार और उससे निकलने वाले निष्कर्ष का स्वाभाविक संबंध दिखाता है।
- source_word: οὐκ ὀφείλομεν νομίζειν
  choice: हमें यह नहीं समझना चाहिए
  rationale: यह केवल संभावना का निषेध नहीं, बल्कि ऐसा मानने की अनुचितता और नैतिक बाध्यता व्यक्त करता है।
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: सोने, चाँदी या पत्थर के समान
  rationale: यूनानी पाठ में उल्लिखित तीनों सामग्रियों और तुलना की संरचना को बनाए रखता है।
- source_word: χαράγματι
  choice: गढ़ी हुई कोई आकृति
  rationale: शब्द उत्कीर्ण, तराशी या बनाई गई वस्तु/प्रतिमा को दर्शाता है; यह चयन हिन्दी में व्यापक और स्पष्ट है।
- source_word: τέχνης καὶ ἐνθυμήσεως ἀνθρώπου
  choice: मनुष्य की कारीगरी और कल्पना से
  rationale: τέχνη की शिल्प-कुशलता और ἐνθύμησις की मानसिक परिकल्पना, दोनों को संक्षेप और सहज रूप में व्यक्त करता है।
- source_word: τὸ θεῖον
  choice: ईश्वरत्व
  rationale: यह व्यापक दार्शनिक पद उस सत्ता या तत्त्व को सूचित करता है जो दिव्य है। ‘ईश्वरत्व’ संबोधन के दार्शनिक स्वर और वास्तविक परमेश्वर की ओर उसके संदर्भ, दोनों को बनाए रखता है।
theological_decisions:
- issue: दार्शनिक ढंग से प्रयुक्त τὸ θεῖον का अनुवाद
  choice: ईश्वरत्व
  alternative: दिव्य सत्ता; ईश्वरीय स्वरूप
  rationale: पौलुस श्रोताओं के परिचित व्यापक दार्शनिक पद का उपयोग करते हुए सच्चे परमेश्वर की बात करता है। ‘ईश्वरत्व’ इसे न तो किसी निर्जीव शक्ति तक सीमित करता है, न बाद की तकनीकी धर्मवैज्ञानिक भाषा आरोपित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखा गया है। ‘कारीगरी और कल्पना’ मूर्ति-निर्माण के बाहरी कौशल और भीतरी परिकल्पना दोनों को व्यक्त करता है।
