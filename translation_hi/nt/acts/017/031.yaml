source:
  edition: SBLGNT
  text: ⸀καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/031.yaml
  text: because he has fixed a day on which he is going to judge the inhabited world in righteousness by a man whom he appointed[b][a], having given proof to all by raising him from the dead.
translation:
  language: hi
  text: क्योंकि उसने एक दिन निश्चित किया है, जिस दिन वह अपने नियुक्त किए हुए एक मनुष्य के द्वारा धार्मिकता से[a] सारे संसार का न्याय करने वाला है। उसने उसे मृतकों में से जिलाकर सबको प्रमाण[b] दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्यायपूर्वक’। यूनानी δικαιοσύνῃ का अर्थ यहाँ ‘धार्मिकता’ या ‘न्याय’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘आश्वासन’; अधिक शाब्दिक रूप से, ‘सबको विश्वास दिया’। यहाँ यूनानी वाक्यांश का भाव सार्वजनिक प्रमाण या आश्वासन देना है।
    reason: alternative_reading
lexical_decisions:
- source_word: καθότι
  choice: क्योंकि
  rationale: यह पिछले पद में मन फिराने की पुकार का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में स्वाभाविक रूप से कारण व्यक्त करता है।
- source_word: ἔστησεν ἡμέραν
  choice: एक दिन ठहराया है
  rationale: यह परमेश्वर द्वारा निश्चित और स्थापित समय को स्पष्ट, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐν ᾗ μέλλει κρίνειν
  choice: जिसमें ... न्याय करने वाला है
  rationale: यह μέλλει के भावी अभिप्राय को केवल साधारण भविष्य में सीमित किए बिना स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὴν οἰκουμένην
  choice: सारे बसे हुए संसार
  rationale: οἰκουμένη के ‘मनुष्यों से बसा हुआ संसार’ वाले शाब्दिक अर्थ और न्याय के सार्वभौमिक मानवीय दायरे, दोनों को बनाए रखता है।
- source_word: ἐν δικαιοσύνῃ
  choice: धार्मिकता से
  rationale: δικαιοσύνη का सामान्य धार्मिक अर्थ बनाए रखते हुए न्याय किए जाने की रीति को स्वाभाविक हिन्दी में व्यक्त करता है; ‘न्यायपूर्वक’ को पादटिप्पणी में रखा गया है।
- source_word: ἐν ἀνδρὶ ᾧ ὥρισεν
  choice: अपने नियुक्त किए हुए एक मनुष्य के द्वारा
  rationale: ἀνήρ का पुरुषवाची अर्थ और यूनानी वाक्यांश का अनिश्चित रूप सुरक्षित रहता है; ὥρισεν के लिए ‘नियुक्त’ स्पष्ट है।
- source_word: πίστιν παρασχὼν πᾶσιν
  choice: सभी को इसका प्रमाण दे दिया है
  rationale: इस मुहावरे में πίστις का आशय सार्वजनिक प्रमाण या आश्वासन है; ‘इसका’ न्याय के लिए उस मनुष्य की नियुक्ति की पुष्टि की ओर संकेत करता है।
- source_word: ἀναστήσας αὐτὸν ἐκ νεκρῶν
  choice: उस मनुष्य को मरे हुओं में से जिलाकर
  rationale: 'कृदंत को साधन के रूप में व्यक्त करता है: पुनरुत्थान के द्वारा प्रमाण दिया गया। ‘मरे हुओं में से’ बहुवचन νεκρῶν को सुरक्षित रखता है।'
theological_decisions:
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता से
  alternative: न्यायपूर्वक
  rationale: ‘धार्मिकता’ मूल शब्द की व्यापक नैतिक-धार्मिक अर्थछाया बचाती है, जबकि न्याय के संदर्भ में सम्भव ‘न्यायपूर्वक’ को पादटिप्पणी में दिया गया है।
- issue: πίστις का अर्थ πίστιν παρασχὼν πᾶσιν में
  choice: प्रमाण
  alternative: आश्वासन; अधिक शाब्दिक रूप से ‘विश्वास’
  rationale: παρέχω के साथ इस प्रसंग में शब्द का अर्थ प्रमाण या आश्वासन देना है; ‘विश्वास’ अकेले रखने से अर्थ अस्पष्ट हो सकता है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἀνδρί की लैंगिक और व्याकरणिक विशिष्टता
  choice: एक मनुष्य
  alternative: उस मनुष्य
  rationale: ἀνήρ पुरुषवाची है और यूनानी में इसके साथ निश्चित उपपद नहीं है; इसलिए अनिश्चित ‘एक मनुष्य’ चुना गया, यद्यपि प्रसंग में संकेत यीशु की ओर है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य स्तर रखा गया है। ‘बसे हुए संसार’ मूल οἰκουμένη की विशिष्टता बनाए रखता है; वाक्य को पठनीयता के लिए दो हिन्दी वाक्यों में बाँटा गया है।
