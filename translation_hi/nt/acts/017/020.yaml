source:
  edition: SBLGNT
  text: ξενίζοντα γάρ τινα εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν· βουλόμεθα οὖν γνῶναι ⸂τίνα θέλει⸃ ταῦτα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/020.yaml
  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
translation:
  language: hi
  text: क्योंकि तुम कुछ अनजानी बातें हमारे कानों तक पहुँचा रहे हो[a]। इसलिए हम जानना चाहते हैं कि इन बातों का अर्थ क्या है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पराई बातें’ अथवा ‘अपरिचित बातें।’ यूनानी शब्द ऐसी बातों के लिए आ सकता है जो सुनने वाले को नई या बाहरी होने के कारण अनजानी लगें।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘ये बातें क्या होना चाहती हैं’; यह एक मुहावरा है, जिसका अर्थ है, ‘इन बातों का क्या अर्थ है’ या ‘इनका क्या महत्त्व है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζοντα
  choice: अनजानी
  rationale: यह शब्द यहाँ ऐसी बातों को दर्शाता है जो श्रोताओं के लिए नई, अपरिचित या बाहरी लगती हैं। ‘अनजानी’ आधुनिक हिन्दी में स्वाभाविक है और आश्चर्य का भाव अनावश्यक रूप से नहीं बढ़ाती।
- source_word: τινα
  choice: कुछ ... बातें
  rationale: अनिश्चित सर्वनाम के अनिर्दिष्ट भाव को सहज हिन्दी में सुरक्षित रखता है।
- source_word: εἰσφέρεις
  choice: पहुँचा रहे हो
  rationale: वर्तमान काल की जारी क्रिया और बातों को श्रोताओं के कानों तक लाने के रूपक, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὰς ἀκοὰς ἡμῶν
  choice: हमारे कानों तक
  rationale: मूल के शारीरिक रूपक को बनाए रखते हुए आधुनिक हिन्दी में सहज अभिव्यक्ति है।
- source_word: βουλόμεθα
  choice: हम ... चाहते हैं
  rationale: इच्छा या अभिलाषा का सीधा और समकालीन हिन्दी रूप।
- source_word: γνῶναι
  choice: जानना
  rationale: उनकी इच्छा के विषय को सीधे व्यक्त करता है और प्रसंग में स्वाभाविक है।
- source_word: τίνα θέλει ταῦτα εἶναι
  choice: इन बातों का अर्थ क्या है
  rationale: यूनानी मुहावरे का आशय इन बातों के अभिप्राय या महत्त्व के विषय में पूछना है; शाब्दिक विचित्रता को मुख्य पाठ में रखने के बजाय अर्थ को स्पष्ट किया गया है।
- source_word: γάρ
  choice: क्योंकि
  rationale: पिछले कथन से कारणसूचक संबंध को स्पष्ट करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: पहले कथन से निकलने वाले निष्कर्ष को सहज हिन्दी में व्यक्त करता है।
