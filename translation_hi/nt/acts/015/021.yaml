base_translation:
  language: en
  yaml_path: translation/nt/acts/015/021.yaml
  text: For from ancient generations Moses has had those who proclaim him in every city[a], being read in the synagogues every Sabbath.
translation:
  language: hi
  text: क्योंकि प्राचीन पीढ़ियों से हर नगर में मूसा का प्रचार करने वाले रहे हैं[a], और वह हर सब्त को आराधनालयों में पढ़ा जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में भाव है, “मूसा के पास उसका प्रचार करने वाले हैं ... और वह पढ़ा जाता है।” यहाँ “मूसा” से लाक्षणिक रूप में मूसा से संबंधित लेखों या व्यवस्था का अभिप्राय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μωϋσῆς
  choice: मूसा
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित बाइबलीय रूप; मूल की लाक्षणिकता को बनाए रखा गया है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण प्रस्तुत करता है; हिन्दी में संबंध स्वाभाविक रूप से स्पष्ट होता है।
- source_word: ἐκ γενεῶν ἀρχαίων
  choice: प्राचीन पीढ़ियों से
  rationale: बहुवचन γενεῶν और दीर्घकाल से चली आ रही स्थिति—दोनों को सुरक्षित रखता है।
- source_word: κατὰ πόλιν
  choice: हर नगर में
  rationale: κατά के वितरणात्मक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τοὺς κηρύσσοντας αὐτὸν
  choice: मूसा का प्रचार करनेवाले
  rationale: मूल के ‘उसका प्रचार करनेवाले’ का आशय स्पष्ट करते हुए मूसा के लिए प्रयुक्त लाक्षणिक उल्लेख को बनाए रखता है; यहाँ मूसा से संबंधित व्यवस्था/लेख अभिप्रेत हैं।
- source_word: ἔχει
  choice: होते आए हैं
  rationale: वर्तमान काल की उस निरंतर स्थिति को व्यक्त करता है जो प्राचीन पीढ़ियों से वर्तमान तक चली आई है।
- source_word: ἐν ταῖς συναγωγαῖς
  choice: आराधनालयों में
  rationale: συναγωγή के यहूदी सभा-स्थल संबंधी अर्थ के लिए हिन्दी बाइबल परंपरा में समझ में आनेवाला शब्द।
- source_word: κατὰ πᾶν σάββατον
  choice: हर सब्त को
  rationale: नियमित वितरणात्मक पुनरावृत्ति को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀναγινωσκόμενος
  choice: और वह ... पढ़ा जाता है
  rationale: पुल्लिंग एकवचन निष्क्रिय कृदंत को स्वतंत्र समन्वित उपवाक्य में स्वाभाविक हिन्दी के साथ प्रस्तुत करता है, बिना स्पष्ट कारणार्थक संबंध जोड़ने के।
theological_decisions:
- issue: ‘मूसा’ का लाक्षणिक प्रयोग
  choice: मुख्य पाठ में ‘मूसा’ और ‘वह’ बनाए रखे गए हैं।
  alternative: ‘मूसा की व्यवस्था’ अथवा ‘मूसा के लेख’ स्पष्ट रूप से लिखना।
  rationale: यूनानी पाठ व्यक्ति ‘मूसा’ को उसके लेखों या व्यवस्था के लिए लाक्षणिक रूप में रखता है। इसे मुख्य पाठ में बनाए रखने से मूल की अभिव्यक्ति और उसकी हल्की अस्पष्टता सुरक्षित रहती है; पादटिप्पणी आशय स्पष्ट करती है।
- issue: ἀναγινωσκόμενος का संबंध
  choice: ‘और वह ... पढ़ा जाता है’
  alternative: ‘क्योंकि वह ... पढ़ा जाता है’ या ‘पढ़ा जाता हुआ’
  rationale: कृदंत का प्रसंगगत संबंध व्याख्यायित किया जा सकता है, पर मूल में स्पष्ट कारणसूचक संयोजक नहीं है। समन्वित हिन्दी अनावश्यक रूप से कारणार्थक अर्थ तय नहीं करती।
