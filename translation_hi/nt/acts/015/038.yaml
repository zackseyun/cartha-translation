  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘का दृढ़ मत था’ पौलुस की दृढ़ता बताता है, जबकि ‘छोड़कर लौट गया’ घटना का नकारात्मक संकेत बनाए रखते हुए ‘त्यागकर’ का अधिक कठोर निर्णय मुख्य पाठ पर नहीं थोपता। पादटिप्पणी-चिह्न संबंधित कथन के बाद रखा गया है।
