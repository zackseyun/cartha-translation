  text: Παῦλος δὲ ἠξίου, τὸν ἀποστάντα ἀπ’ αὐτῶν ἀπὸ Παμφυλίας καὶ μὴ συνελθόντα αὐτοῖς εἰς τὸ ἔργον, μὴ ⸀συμπαραλαμβάνειν τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/038.yaml
  text: But Paul insisted that they should not take along this man[a], who had withdrawn from them from Pamphylia and had not gone with them to the work.
translation:
  language: hi
  text: पर पौलुस का आग्रह था कि उस व्यक्ति को, जो पंफूलिया में उनसे अलग हो गया था[a] और उनके साथ उस काम में नहीं गया था, वे अपने साथ न लें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो व्यक्ति पंफूलिया में उन्हें त्यागकर चला गया था।” यूनानी कृदंत का अर्थ अधिक कठोर रूप में भी लिया जा सकता है; मुख्य पाठ कम व्याख्यात्मक भाषा रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠξίου
  choice: का दृढ़ मत था
  rationale: अपूर्णकालीन क्रिया यहाँ विवाद के संदर्भ में पौलुस के दृढ़ निर्णय को व्यक्त करती है; यह केवल साधारण पसंद नहीं, पर हिन्दी में अनावश्यक रूप से उग्र भी नहीं लगती।
- source_word: ἀποστάντα
  choice: छोड़कर लौट गया था
  rationale: ἀφίσταμαι का मूल भाव अलग हो जाने या हट जाने का है। प्रेरितों 13:13 के संदर्भ में ‘लौट गया’ यात्रा की वास्तविकता स्पष्ट करता है, जबकि ‘छोड़कर’ उसके साथियों से अलग होने का भाव बनाए रखता है; अधिक कठोर ‘त्याग दिया था’ पादटिप्पणी में रखा गया है।
- source_word: ἀπ’ αὐτῶν ἀπὸ Παμφυλίας
  choice: पम्फूलिया से उन्हें छोड़कर
  rationale: दोनों ἀπό पदबंधों को स्वाभाविक हिन्दी में समेटते हुए साथियों से अलगाव और पम्फूलिया से वापसी—दोनों भाव सुरक्षित रहते हैं।
- source_word: μὴ συνελθόντα αὐτοῖς
  choice: उनके साथ ... नहीं गया था
  rationale: यात्रा और सेवाकार्य के संदर्भ में साथ आगे न जाने का सीधा और स्वाभाविक अर्थ देता है।
- source_word: εἰς τὸ ἔργον
  choice: उस काम में
  rationale: लेखयुक्त ἔργον को किसी सामान्य काम के बजाय पहले से पहचाने गए सेवाकार्य के रूप में रखता है, बिना ‘मिशन’ जैसी अधिक व्याख्यात्मक संज्ञा जोड़े।
- source_word: μὴ συμπαραλαμβάνειν τοῦτον
  choice: उसे वे अपने साथ न ले जाएँ
  rationale: μή सहित क्रियार्थक संज्ञा पौलुस के मत की विषयवस्तु बताती है; ‘अपने साथ ले जाएँ’ συμπαραλαμβάνειν का सहज हिन्दी रूप है।
