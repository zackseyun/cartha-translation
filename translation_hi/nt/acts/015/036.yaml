source:
  edition: SBLGNT
  text: Μετὰ δέ τινας ἡμέρας εἶπεν ⸂πρὸς Βαρναβᾶν Παῦλος⸃· Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα τοὺς ⸀ἀδελφοὺς κατὰ ⸂πόλιν πᾶσαν⸃ ἐν αἷς κατηγγείλαμεν τὸν λόγον τοῦ κυρίου, πῶς ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/036.yaml
  text: After some days[a], Paul said to Barnabas, “Let us return now and visit the brothers in every city where we proclaimed the word of the Lord, and see how they are.”
translation:
  language: hi
  text: कुछ दिन बाद पौलुस ने बरनबास से कहा, “आओ, अब हम लौट चलें और हर उस नगर में भाई-बहनों[a] से मिलें जहाँ हमने प्रभु के वचन का प्रचार किया था, और देखें कि वे कैसे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “भाइयों” है; यहाँ यह शब्द सम्भवतः स्त्री और पुरुष, दोनों विश्वासियों के पूरे समुदाय के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δέ τινας ἡμέρας
  choice: कुछ दिन बाद
  rationale: यह समय-सूचक पद अनिश्चित अंतराल के बाद की बात बताता है; यह हिन्दी में निकट और स्वाभाविक रूप है।
- source_word: εἶπεν πρὸς Βαρναβᾶν Παῦλος
  choice: पौलुस ने बरनबास से कहा
  rationale: यह वक्ता, संबोधित व्यक्ति और सामान्य कथन-क्रिया को स्पष्ट तथा स्वाभाविक हिन्दी में रखता है।
- source_word: Ἐπιστρέψαντες δὴ ἐπισκεψώμεθα
  choice: आओ, अब हम लौटकर ... से मिलें
  rationale: कृदन्त और प्रेरणार्थक संभावनार्थक क्रिया को एक स्वाभाविक सामूहिक प्रस्ताव के रूप में व्यक्त किया गया है; δή का आग्रह ‘अब’ से प्रकट होता है।
- source_word: τοὺς ἀδελφοὺς
  choice: भाई-बहनों
  rationale: ἀδελφοί व्याकरणतः पुल्लिंग बहुवचन है, पर इस प्रसंग में सम्भवतः विश्वासियों के मिश्रित समुदाय को दर्शाता है। आधुनिक हिन्दी में ‘भाई-बहन’ पारिवारिक संबोधन और प्रतिनिधिक व्यापकता दोनों को स्पष्ट करता है; स्रोत-रूप की सूचना पादटिप्पणी में दी गई है।
- source_word: κατὰ πόλιν πᾶσαν
  choice: हर उस नगर में
  rationale: κατά की वितरणात्मक शक्ति और पूर्व सेवकाई वाले प्रत्येक नगर का भाव सुरक्षित रहता है।
- source_word: ἐν αἷς κατηγγείλαμεν
  choice: जहाँ हमने ... सुनाया था
  rationale: καταγγέλλω सार्वजनिक घोषणा का बोध देता है; ‘सुनाया’ सामान्य आधुनिक हिन्दी में सुसमाचार-संदेश के प्रचार को सहज रूप से व्यक्त करता है।
- source_word: τὸν λόγον τοῦ κυρίου
  choice: प्रभु का वचन
  rationale: यह λόγος के संदेश/वचन के भाव और κυρίου के संबंधसूचक अर्थ को परिचित, गरिमापूर्ण बाइबलीय हिन्दी में रखता है।
- source_word: πῶς ἔχουσιν
  choice: देखें कि वे कैसे हैं
  rationale: यह यूनानी मुहावरे में निहित उनकी दशा और कुशल-क्षेम जानने की चिंता को बिना अनावश्यक विस्तार के व्यक्त करता है।
theological_decisions:
- issue: मिश्रित समुदाय के लिए ἀδελφοί का अनुवाद
  choice: भाई-बहनों
  alternative: भाइयों
  rationale: संज्ञा का रूप पुल्लिंग है, किंतु प्रसंग में पूरा विश्वासी समुदाय सम्भावित है। मुख्य पाठ में स्वाभाविक और आशय-स्पष्ट हिन्दी रखी गई है तथा शाब्दिक रूप पादटिप्पणी में बताया गया है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस प्रसंग में ‘प्रभु’ नए नियम के धार्मिक संबोधन को स्वाभाविक और परंपरागत रूप से व्यक्त करता है, बिना संदर्भ से अधिक विशिष्ट पहचान थोपे।
- issue: ἐπισκεψώμεθα में भेंट और देखभाल का भाव
  choice: से मिलें
  alternative: उनकी सुधि लें
  rationale: क्रिया में चिंतापूर्ण निरीक्षण या कुशल जानने का भाव हो सकता है, पर ‘सुधि लें’ उसे कुछ अधिक स्पष्ट कर देता। ‘से मिलें’ के साथ अंतिम वाक्यांश उस चिंता को पर्याप्त रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘आओ’ सामूहिक प्रस्ताव को स्वाभाविक बनाता है; ‘प्रभु का वचन’ परिचित बाइबलीय पदावली है।
