  text: διὸ ἐγὼ κρίνω μὴ παρενοχλεῖν τοῖς ἀπὸ τῶν ἐθνῶν ἐπιστρέφουσιν ἐπὶ τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/019.yaml
  text: Therefore I judge that we should not trouble those from among the Gentiles who are turning to God[b][a],
translation:
  language: hi
  text: इसलिए मेरा निर्णय है[b] कि गैर-यहूदियों[a] में से जो लोग परमेश्वर की ओर फिर रहे हैं, उन्हें परेशान न किया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राष्ट्रों में से।” यूनानी शब्द का अर्थ “राष्ट्र” भी हो सकता है, पर यहाँ उसका आशय गैर-यहूदी लोगों से है।
    reason: lexical_alternative
  - marker: b
    text: या “इसलिए मैं मानता हूँ कि हमें … परेशान नहीं करना चाहिए”; अथवा “मैं निर्णय करता हूँ कि … परेशान न किया जाए।”
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह याकूब के पिछले तर्क से निकलने वाले निष्कर्ष को स्वाभाविक और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: ἐγὼ κρίνω
  choice: मेरा निर्णय है
  rationale: यह प्रथम पुरुष की स्पष्टता और याकूब के विचारपूर्ण निर्णय—दोनों को बनाए रखता है; केवल निजी राय जैसा कमजोर अर्थ नहीं देता।
- source_word: μὴ παρενοχλεῖν
  choice: परेशान न किया जाए
  rationale: निषेधात्मक infinitive को निर्णय की विषयवस्तु के रूप में व्यक्त करता है और किसी पर अनावश्यक कठिनाई या बाधा डालने का भाव सुरक्षित रखता है। कर्मवाच्य हिंदी यूनानी में अस्पष्ट छोड़े गए कर्ता को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: τοῖς ἀπὸ τῶν ἐθνῶν
  choice: गैर-यहूदियों में से जो लोग
  rationale: यह अमूर्त समुदाय के बजाय उस समुदाय में से आने वाले व्यक्तियों को दर्शाता है और आधुनिक पाठक के लिए स्वाभाविक है।
- source_word: ἐθνῶν
  choice: गैर-यहूदियों
  rationale: इस यहूदी-मसीही संदर्भ में शब्द गैर-यहूदी लोगों को सूचित करता है; शाब्दिक विकल्प ‘राष्ट्रों’ को पादटिप्पणी में रखा गया है।
- source_word: ἐπιστρέφουσιν
  choice: फिर रहे हैं
  rationale: वर्तमान कृदंत के चलते हुए परिवर्तन और परमेश्वर की ओर मुड़ने की मूल क्रियात्मक छवि को बनाए रखता है, बिना बाद की तकनीकी धर्मशास्त्रीय शब्दावली जोड़े।
- source_word: ἐπὶ τὸν θεόν
  choice: परमेश्वर की ओर
  rationale: दिशा के भाव को स्पष्ट रूप से सुरक्षित रखता है और ἐπιστρέφω के साथ सहज हिंदी बनाता है।
theological_decisions:
- issue: क्या इसे केवल याकूब की निजी राय या सभा के लिए प्रस्तावित निर्णय के रूप में व्यक्त किया जाए
  choice: “मेरा निर्णय है … परेशान न किया जाए”
  alternative: “मैं मानता हूँ कि हमें … परेशान नहीं करना चाहिए”
  rationale: यूनानी प्रथम पुरुष एकवचन को स्पष्ट रखती है, जबकि निषेधात्मक infinitive के अनिर्दिष्ट कर्ता को ‘हम’ जोड़कर सीमित नहीं करती। साथ ही यह सभा पर लागू होने वाले व्यावहारिक निर्णय का बल बनाए रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। ‘गैर-यहूदी’ को अपेक्षाकृत स्पष्ट आधुनिक पद के रूप में चुना गया है; ‘अन्यजाति’ जैसे अधिक पारंपरिक किंतु संभावित रूप से अस्पष्ट पद से बचा गया है।
