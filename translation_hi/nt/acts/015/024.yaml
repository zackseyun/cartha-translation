  text: ἐπειδὴ ἠκούσαμεν ὅτι τινὲς ἐξ ἡμῶν ⸀ἐξελθόντες ἐτάραξαν ὑμᾶς λόγοις ἀνασκευάζοντες τὰς ψυχὰς ⸀ὑμῶν οἷς οὐ διεστειλάμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/024.yaml
  text: Since we have heard that some went out from us and troubled you with words[a], unsettling your souls, to whom we gave no instructions[b],
translation:
  language: hi
  text: क्योंकि हमने सुना है कि हममें से कुछ लोग, जिन्हें हमने कोई निर्देश नहीं दिया था[b], निकलकर अपनी बातों से आपको परेशान कर गए और आपके मनों को विचलित कर दिया[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में, “आपकी आत्माओं/प्राणों को अस्थिर करते हुए।” यहाँ “आत्माओं/प्राणों” का अर्थ केवल भावनाएँ नहीं, बल्कि उनका भीतरी जीवन या व्यक्तित्व है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिन्हें हमने कोई आज्ञा नहीं दी थी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: क्योंकि
  rationale: यह पत्र में आगे कही जाने वाली बात का कारण प्रस्तुत करता है; आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: τινὲς ἐξ ἡμῶν ἐξελθόντες
  choice: हममें से कुछ लोग निकलकर
  rationale: ἐξ ἡμῶν उनके समूह से संबंध और ἐξελθόντες उनके वहाँ से जाने—दोनों को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐτάραξαν ὑμᾶς λόγοις
  choice: अपनी बातों से आपको परेशान कर गए
  rationale: λόγοις का साधनात्मक अर्थ ‘अपनी बातों से’ और ἐτάραξαν का अशांति या व्याकुलता उत्पन्न करना स्पष्ट होता है।
- source_word: ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν
  choice: आपके मनों को अस्थिर कर दिया
  rationale: इस प्रसंग में ψυχαί व्यक्तियों के भीतरी जीवन या मन को सूचित करता है; ‘मन’ आधुनिक हिन्दी में ‘आत्मा’ की अपेक्षा अपेक्षित प्रभाव अधिक सहजता से बताता है।
- source_word: οἷς οὐ διεστειλάμεθα
  choice: जबकि हमने उन्हें कोई निर्देश नहीं दिया था
  rationale: संबंधवाचक उपवाक्य का आशय स्पष्ट करता है कि वे लोग यरूशलेम के नेतृत्व की आज्ञा या अनुमति के बिना गए थे; ‘जबकि’ विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या उपद्रव करने वालों के पास प्रेरितीय निर्देश न होने की बात स्पष्ट की जाए
  choice: हमने उन्हें कोई निर्देश नहीं दिया था
  alternative: हमने उन्हें ऐसी कोई आज्ञा नहीं दी थी
  rationale: यूनानी पाठ स्पष्ट रूप से उन लोगों के लिए निर्देश अथवा आदेश दिए जाने का निषेध करता है। ‘निर्देश’ अधिकारहीनता को बनाए रखता है, पर अनावश्यक रूप से कठोर सैनिक भाव नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानसूचक बहुवचन और पत्रात्मक गरिमा। वाक्य को सरल रखते हुए यूनानी के कारणसूचक आरंभ, साधनात्मक ‘बातों से’, भीतरी अस्थिरता और अधिकार न दिए जाने—सभी को सुरक्षित रखा गया है।
