  verdict: revise
  source_fidelity: The draft conveys the causal opening, the group’s departure, their troubling speech, and the lack of authorization. However, “जबकि” introduces an explicit adversative/concessive relation not expressed by the Greek relative clause. The authorization clause should directly modify the people concerned.
  naturalness: The Hindi is generally clear and appropriately formal. “मनों को अस्थिर” is understandable, but “मनों को विचलित” is more idiomatic in this context. Placing the relative clause next to “कुछ लोग” also makes its referent unambiguous.
  terminology: “निर्देश” is a suitable modern rendering of διεστειλάμεθα. “मन” is an acceptable contextual rendering of ψυχάς when supported by a note that preserves the broader sense of inner life/personhood.
  issues:
  - severity: medium
    issue: “जबकि” adds a contrast/concession absent from the Greek.
    rationale: οἷς οὐ διεστειλάμεθα is a relative clause, “whom we did not instruct/command,” rather than a concessive or adversative clause. Hindi should retain this as a modifier of the persons.
  - severity: low
    issue: The wording of footnote a is overly rigid and “प्राणों को उलट-पुलट” is not a natural explanation of the Greek phrase in Hindi.
    rationale: ἀνασκευάζοντες describes unsettling/overturning, while ψυχάς can denote persons’ inner lives, selves, or lives. The note should explain this without presenting an awkward pseudo-literal Hindi phrase as the only literal sense.
  revised_text: क्योंकि हमने सुना है कि हममें से कुछ लोग, जिन्हें हमने कोई निर्देश नहीं दिया था[b], निकलकर अपनी बातों से आपको परेशान कर गए और आपके मनों को विचलित कर दिया[a],
