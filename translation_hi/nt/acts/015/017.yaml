  text: ὅπως ἂν ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων τὸν κύριον, καὶ πάντα τὰ ἔθνη ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς, λέγει ⸀κύριος ποιῶν ⸀ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/017.yaml
  text: so that the remnant of mankind may seek the Lord[a], even all the Gentiles on whom my name has been called, says the Lord[c][b], who does these things
translation:
  language: hi
  text: ताकि मानवजाति में से बचे हुए लोग प्रभु को खोजें, और वे सभी गैर-यहूदी भी, जो मेरे नाम से कहलाते हैं—प्रभु ऐसा कहता है[c], जो ये बातें करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: यह कथन आमोस 9:12 की प्रतिध्वनि है, उस रूप में जो यूनानी धर्मग्रन्थों में मिलता है; वहाँ प्रभु का नाम धारण करने वाली जातियों पर बल है।
    reason: cross_reference
lexical_decisions:
- source_word: ὅπως ἂν
  choice: ताकि
  rationale: यह प्रयोग उद्देश्य अथवा अपेक्षित परिणाम व्यक्त करता है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक रूप से वही बल बनाए रखता है।
- source_word: ἐκζητήσωσιν
  choice: खोजें
  rationale: सन्दर्भ में इसका अर्थ प्रभु की ओर मुड़कर उसे खोजना है। उपसर्ग से सम्भव गहनता को मुख्य पाठ में बढ़ा-चढ़ाकर व्यक्त नहीं किया गया।
- source_word: οἱ κατάλοιποι τῶν ἀνθρώπων
  choice: मानवजाति के शेष लोग
  rationale: κατάλοιποι बचे हुए अथवा शेष लोगों को दर्शाता है और ἀνθρώπων यहाँ पूरी मानवजाति के लिए सामान्य शब्द है, केवल पुरुषों के लिए नहीं।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: κύριος के लिए प्रतिष्ठित, गरिमापूर्ण और सर्वसुलभ हिन्दी पद।
- source_word: πάντα τὰ ἔθνη
  choice: वे सभी गैर-यहूदी
  rationale: ἔθνη का अर्थ ‘जातियाँ’ भी हो सकता है, पर प्रेरितों के काम 15 में तत्काल प्रसंग गैर-यहूदियों के सम्मिलित किए जाने का है। ‘वे’ जोड़ने से हिन्दी वाक्य का व्याकरण स्पष्ट होता है।
- source_word: ἐφ’ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ’ αὐτούς
  choice: जो मेरे नाम के कहलाते हैं
  rationale: यह यूनानी मुहावरा प्रभु के नाम से पहचाने जाने और उसके अपने होने का भाव रखता है। स्वाभाविक हिन्दी रूप मुख्य पाठ में रखा गया है और अधिक शब्दशः रूप पादटिप्पणी में दिया गया है।
- source_word: λέγει κύριος
  choice: यह प्रभु कहता है
  rationale: भविष्यद्वाणी के उद्धरण में प्रयुक्त मानक कथन-सूत्र को वर्तमान काल में रखा गया है।
- source_word: ποιῶν ταῦτα
  choice: जो ये काम करता है
  rationale: वर्तमान कृदन्त प्रभु के कार्य करने को व्यक्त करता है; यह रूप स्पष्ट करता है कि सम्बन्धवाचक उपवाक्य ‘प्रभु’ को विशेषित करता है।
theological_decisions:
- issue: यहूदी–गैर-यहूदी सम्मिलन के प्रसंग में ἔθνη का अनुवाद
  choice: गैर-यहूदी
  alternative: जातियाँ / राष्ट्र
  rationale: यरूशलेम सभा का तत्काल प्रश्न गैर-यहूदियों का परमेश्वर की प्रजा में सम्मिलित होना है। फिर भी भविष्यद्वाणी की व्यापक ‘जातियाँ’ वाली ध्वनि को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ईश्वरीय नाम के पुकारे जाने का मुहावरा
  choice: जो मेरे नाम के कहलाते हैं
  alternative: जिन पर मेरा नाम पुकारा गया है
  rationale: मुख्य पाठ का रूप आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर से सम्बन्ध तथा उसके अधिकार में होने का भाव देता है; शाब्दिक संरचना पादटिप्पणी में संरक्षित है।
- issue: οἱ κατάλοιποι τῶν ἀνθρώπων में मानव-सन्दर्भ
  choice: मानवजाति के शेष लोग
  alternative: शेष मनुष्य
  rationale: मूल पद पूरे मानव समुदाय के लिए सामान्य है, पुरुष-विशेष के लिए नहीं। ‘मानवजाति’ इस व्यापकता को स्पष्ट रखते हुए भविष्यद्वाणी के ‘शेष’ भाव को भी बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘मानवजाति के शेष लोग’ भविष्यद्वाणी की ‘शेष’ धारणा को बनाए रखता है, जबकि ‘गैर-यहूदी’ प्रेरितों के काम 15 के तत्काल विवाद को स्पष्ट करता है। विराम-चिह्न उद्धरण-सूत्र और उसके सम्बन्धवाचक उपवाक्य को सहज रूप से अलग करते हैं।
