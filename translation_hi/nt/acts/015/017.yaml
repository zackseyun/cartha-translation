  source_fidelity: The draft accurately conveys the purpose clause, the remnant motif, the contextual sense of ἔθνη as non-Jews, and the Lord's continuing agency. However, ‘मेरे नाम के कहलाते हैं’ is not idiomatic Hindi and weakens the Greek naming/identification idiom. ‘यह प्रभु कहता है’ is also less natural than the standard prophetic formula.
  naturalness: A small revision makes the relative clause and prophetic citation formula natural in modern standard Hindi. ‘ये बातें करता है’ is more idiomatic than ‘ये काम करता है’ for ταῦτα in this citation context.
  terminology: ‘प्रभु,’ ‘मानवजाति,’ and ‘गैर-यहूदी’ are suitable for the stated register and context. The alternative ‘जातियाँ’ remains appropriately preserved in a footnote.
  issues:
  - severity: medium
    issue: ‘जो मेरे नाम के कहलाते हैं’ is grammatically and idiomatically awkward.
    rationale: The Greek perfect-passive naming idiom indicates people identified as bearing God's name. Hindi ‘जो मेरे नाम से कहलाते हैं’ expresses this naturally while retaining the intended relationship.
  - severity: low
    issue: ‘यह प्रभु कहता है’ is an unnatural rendering of the prophetic citation formula.
    rationale: ‘प्रभु ऐसा कहता है’ is standard modern Hindi and retains λέγει κύριος without adding meaning.
  - severity: low
    issue: ‘ये काम करता है’ is slightly less natural in this scriptural formula.
    rationale: ‘ये बातें करता है’ is a natural Hindi equivalent of ποιῶν ταῦτα and retains the demonstrative reference.
