source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τῆς χάριτος τοῦ κυρίου Ἰησοῦ πιστεύομεν σωθῆναι καθ’ ὃν τρόπον κἀκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/011.yaml
  text: But through the grace of the Lord Jesus we believe that we will be saved[b][a], just as they also will be.
translation:
  language: hi
  text: परन्तु हम विश्वास करते हैं कि हम प्रभु यीशु के अनुग्रह के द्वारा उद्धार पाएँगे, ठीक जैसे वे भी पाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: परन्तु
  rationale: यह पिछले कथन के साथ प्रबल विरोध दर्शाता है और गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: διὰ τῆς χάριτος
  choice: अनुग्रह के द्वारा
  rationale: सम्बन्धकारक के साथ διά साधन या माध्यम व्यक्त करता है; यह पदबंध उसी अर्थ को स्पष्ट रखता है।
- source_word: χάριτος
  choice: अनुग्रह
  rationale: यहाँ शब्द प्रभु यीशु की उद्धारकारी कृपा को व्यक्त करता है; ‘अनुग्रह’ हिन्दी बाइबलीय भाषा में सटीक और परिचित है।
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: प्रभु यीशु के
  rationale: सम्बन्धकारक ‘अनुग्रह’ को प्रभु यीशु से जोड़ता है—अर्थात उनका दिया हुआ या उनसे मिलने वाला अनुग्रह।
- source_word: πιστεύομεν
  choice: हम विश्वास करते हैं
  rationale: यह क्रिया यहाँ दृढ़ धारणा व्यक्त करती है और इसके बाद उद्धार-विषयक कथन आता है।
- source_word: σωθῆναι
  choice: हमारा उद्धार होगा
  rationale: विश्वास-सूचक क्रिया के बाद आए भूतकालिक कर्मवाच्य infinitive को सहज हिन्दी में भावी उद्धार के रूप में व्यक्त किया गया है, बिना समय-संबंधी अर्थ को आवश्यकता से अधिक निश्चित किए।
- source_word: καθ’ ὃν τρόπον
  choice: ठीक उसी प्रकार
  rationale: यह रीति और तुलना दोनों व्यक्त करने वाला मुहावरा है; हिन्दी में तुलना को स्वाभाविक और स्पष्ट बनाता है।
- source_word: κἀκεῖνοι
  choice: उनका भी
  rationale: κἀκεῖνοι में καί का ‘भी’ सुरक्षित है। प्रसंग में ‘वे’ गैर-यहूदी हैं; संक्षिप्त हिन्दी वाक्यांश यूनानी में लुप्त उद्धार-क्रिया को स्वाभाविक रूप से ग्रहण करता है।
theological_decisions:
- issue: पतरस के कथन में तुलना की दिशा
  choice: ‘हमारा उद्धार ... ठीक उसी प्रकार उनका भी’—यहूदी विश्वासियों के उद्धार की तुलना गैर-यहूदियों के उद्धार से की गई है।
  alternative: ‘उनका उद्धार भी वैसे ही होगा जैसे हमारा’
  rationale: 'यूनानी वाक्य पहले ‘हम’ को रखता है और फिर ‘उनका भी’ कहता है। इस उलटी प्रतीत होने वाली दिशा को बनाए रखना प्रसंग का महत्त्वपूर्ण बल सुरक्षित रखता है: गैर-यहूदियों को यहूदी बनने की आवश्यकता नहीं है।'
- issue: अनुग्रह और उद्धार का सम्बन्ध
  choice: उद्धार को प्रभु यीशु के अनुग्रह के द्वारा बताया गया है, और ‘विश्वास करते हैं’ को कथन की भूमिका के रूप में रखा गया है।
  alternative: ‘केवल अनुग्रह और केवल विश्वास से उद्धार’ जैसी विस्तृत धर्मसैद्धान्तिक व्याख्या
  rationale: मूल पाठ अनुग्रह और विश्वास दोनों का उल्लेख करता है, पर बाद की सम्प्रदायगत सूत्रावली नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। ‘परन्तु’, ‘अनुग्रह’ और ‘उद्धार’ बाइबलीय रूप से परिचित हैं; वाक्य-विन्यास को सहज रखते हुए यूनानी तुलना की दिशा और ‘भी’ का बल सुरक्षित रखा गया है।
