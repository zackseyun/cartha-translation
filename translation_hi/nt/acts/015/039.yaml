  text: ἐγένετο ⸀δὲ παροξυσμὸς ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων, τόν τε Βαρναβᾶν παραλαβόντα τὸν Μᾶρκον ἐκπλεῦσαι εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/039.yaml
  text: And there arose such a sharp disagreement that they separated from one another[a], and Barnabas took Mark and sailed away to Cyprus,
translation:
  language: hi
  text: तब उनमें इतना तीखा मतभेद हुआ कि वे एक-दूसरे से अलग हो गए[a]; और बरनबास मरकुस को साथ लेकर कुप्रुस के लिए जहाज़ से रवाना हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनमें ऐसा तीखा टकराव हुआ कि वे एक-दूसरे से अलग हो गए।” यूनानी शब्द प्रबल उत्तेजना या तीव्र संघर्ष का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: तब ... हुआ
  rationale: कथा में नई घटना को स्वाभाविक ढंग से आगे बढ़ाता है; δέ को अत्यधिक विरोधात्मक बनाए बिना संक्रमण व्यक्त करता है।
- source_word: παροξυσμὸς
  choice: तीखा मतभेद
  rationale: यह प्रसंग में तीव्र टकराव या असहमति बताता है, केवल भीतर की झुँझलाहट नहीं। आधुनिक हिन्दी में यह स्पष्ट और गरिमापूर्ण है।
- source_word: ὥστε ἀποχωρισθῆναι αὐτοὺς ἀπ’ ἀλλήλων
  choice: इतना ... कि वे एक-दूसरे से अलग हो गए
  rationale: ὥστε और infinitive के परिणामसूचक संबंध को स्वाभाविक हिन्दी में परिमाण-परिणाम रचना द्वारा व्यक्त करता है।
- source_word: τόν τε Βαρναβᾶν
  choice: और बरनबास
  rationale: τε आगे आने वाली विभाजित कार्रवाइयों में पहले पक्ष का परिचय देता है; यहाँ सरल 'और' कथाप्रवाह बनाए रखता है।
- source_word: παραλαβόντα τὸν Μᾶρκον
  choice: मरकुस को साथ लेकर
  rationale: परिस्थितिवाचक participle को मुख्य क्रिया के साथ स्वाभाविक रूप से जोड़ता है और 'साथ ले जाने' का भाव स्पष्ट करता है।
- source_word: ἐκπλεῦσαι εἰς Κύπρον
  choice: कुप्रुस के लिए जहाज़ से रवाना हो गया
  rationale: ἐκπλέω में समुद्र के रास्ते प्रस्थान करने का भाव है; यह हिन्दी अभिव्यक्ति गंतव्य और जलयात्रा दोनों को स्पष्ट रखती है।
theological_decisions:
- issue: प्रेरितीय सहकर्मियों के बीच संघर्ष का वर्णन
  choice: संघर्ष को बिना नरम किए 'तीखा मतभेद' कहना
  alternative: तीखा टकराव / भारी झगड़ा
  rationale: पद वास्तविक और तीव्र असहमति बताता है। अनुवाद न तो इसे सामंजस्य के लिए हल्का करता है, न उपलब्ध यूनानी प्रमाण से अधिक नैतिक दोष या उग्रता आरोपित करता है।
