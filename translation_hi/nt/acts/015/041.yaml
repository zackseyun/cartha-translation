  yaml_path: translation/nt/acts/015/041.yaml
  text: And he went through Syria and Cilicia, strengthening the churches.
translation:
  language: hi
  text: और वह सीरिया और किलिकिया से होकर जाता रहा और कलीसियाओं को दृढ़ करता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διήρχετο
  choice: से होकर जाता रहा
  rationale: अपूर्णकालीन क्रिया उन क्षेत्रों में जारी यात्रा को व्यक्त करती है; यह हिंदी प्रयोग उस निरंतर गति को स्वाभाविक ढंग से बनाए रखता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘और’ इसका सहज तथा अनावश्यक रूप से बल न देने वाला अनुवाद है।
- source_word: Συρίαν
  choice: सीरिया
  rationale: इस क्षेत्रीय नाम का आधुनिक हिंदी में प्रचलित रूप।
- source_word: Κιλικίαν
  choice: किलिकिया
  rationale: इस प्राचीन क्षेत्रीय नाम का मानक हिंदी लिप्यंतरण।
- source_word: ἐπιστηρίζων
  choice: दृढ़ करता रहा
  rationale: कृदंत यात्रा के साथ चल रही उस गतिविधि को बताता है जिसके द्वारा स्थानीय विश्वास-समुदायों को स्थिर और मजबूत किया जा रहा था; ‘दृढ़’ भावनात्मक प्रोत्साहन तक अर्थ को सीमित नहीं करता।
- source_word: ἐκκλησίας
  choice: कलीसियाओं
  rationale: प्रेरितों के काम में यह शब्द स्थानीय मसीही समुदायों के लिए प्रयुक्त है; ‘कलीसिया’ हिंदी बाइबलीय प्रयोग में स्पष्ट और प्रतिष्ठित शब्द है।
