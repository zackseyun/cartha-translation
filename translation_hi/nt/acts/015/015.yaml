  text: καὶ τούτῳ συμφωνοῦσιν οἱ λόγοι τῶν προφητῶν, καθὼς γέγραπται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/015.yaml
  text: 'And with this the words of the prophets agree[a], just as it is written:'
translation:
  language: hi
  text: 'और भविष्यद्वक्ताओं के वचन इससे सहमत हैं, जैसा लिखा है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह याकूब के तर्क में आगे जोड़े गए शास्त्रीय समर्थन को स्वाभाविक रूप से जोड़ता है।
- source_word: τούτῳ
  choice: इससे
  rationale: नपुंसकलिंग संकेतवाचक सर्वनाम पीछे कही गई बात या घटना की ओर व्यापक रूप से संकेत करता है; συμφωνέω के साथ हिंदी में ‘इससे सहमत’ स्वाभाविक है।
- source_word: συμφωνοῦσιν
  choice: सहमत हैं
  rationale: वर्तमानकालीन क्रिया का स्पष्ट और सहज अर्थ ‘मेल खाना’ अथवा ‘सहमत होना’ है; यहाँ कथनों के लिए ‘सहमत हैं’ स्वाभाविक है।
- source_word: οἱ λόγοι
  choice: वचन
  rationale: यह लिखित रूप में उद्धृत भविष्यसूचक कथनों को दर्शाता है; ‘वचन’ बाइबलीय संदर्भ में परिचित, गरिमापूर्ण और सीधा है।
- source_word: τῶν προφητῶν
  choice: भविष्यद्वक्ताओं के
  rationale: संबंधकारक रूप इन वचनों को भविष्यद्वक्ताओं से संबद्ध करता है और हिंदी में सहज संबंध व्यक्त करता है।
- source_word: καθὼς
  choice: जैसा
  rationale: आने वाले शास्त्रीय उद्धरण को पिछली बात के अनुरूप प्रस्तुत करता है; हिंदी में ‘जैसा’ संक्षिप्त और स्वाभाविक है।
- source_word: γέγραπται
  choice: लिखा है
  rationale: यह शास्त्र-उद्धरण की प्रचलित पूर्ण निष्क्रिय अभिव्यक्ति है; हिंदी में ‘लिखा है’ मानक और स्पष्ट रूप है।
theological_decisions:
- issue: τούτῳ का संदर्भ
  choice: ‘इससे’ के रूप में व्यापक संकेत बनाए रखा गया
  alternative: इसे विशेष रूप से गैर-यहूदियों के मन-फिराव, पतरस के कथन, या परमेश्वर की योजना के रूप में स्पष्ट करना
  rationale: यूनानी पाठ पिछली बात की ओर संकेत करता है, पर उसका आशय किसी एक व्याख्या तक स्पष्ट रूप से सीमित नहीं करता; अनुवाद उसी अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और मौखिक पाठ के लिए सहज है। ‘भविष्यद्वक्ता’ और ‘वचन’ परिचित बाइबलीय शब्दावली हैं। अंग्रेज़ी में दत्तिव के कारण ‘with/to this’ का विकल्प है, पर हिंदी ‘इससे सहमत’ दोनों संबंधों को स्वाभाविक रूप से व्यक्त करती है, इसलिए पादटिप्पणी आवश्यक नहीं मानी गई।
