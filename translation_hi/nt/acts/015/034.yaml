lexical_decisions:
- source_word: ἔδοξε (δοκέω)
  choice: उचित लगा
  rationale: दत्तिव τῷ Σίλᾳ के साथ यह निर्वैयक्तिक प्रयोग ‘सीलास को उचित लगा’ का भाव देता है। यह निर्णय या इच्छा को व्यक्त करता है, पर यूनानी वाक्य की संरचना को अनावश्यक रूप से ‘उसने निश्चय किया’ में नहीं बदलता।
- source_word: ἐπιμεῖναι (ἐπιμένω)
