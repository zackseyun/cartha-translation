base_translation:
  language: en
  yaml_path: translation/nt/acts/015/025.yaml
  text: it seemed good to us[a], having come to one accord, to choose men and send them to you with our beloved Barnabas and Paul[b],
translation:
  language: hi
  text: एकमत हो जाने पर[a] हमें यह उचित लगा कि हम पुरुषों[b] को चुनकर उन्हें अपने प्रिय बरनबास और पौलुस के साथ आपके पास भेजें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
