    reason: lexical_alternative
  - marker: b
    text: अर्थात पुरुष प्रतिनिधि; यूनानी शब्द विशेष रूप से पुरुषों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν ἡμῖν
  choice: हमें यह उचित लगा
  rationale: यह सामूहिक विचार-विमर्श से बनी सम्मति को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है, बिना इसे स्पष्ट आदेश या नैतिक निर्णय के रूप में अधिक प्रबल बनाए।
- source_word: γενομένοις ὁμοθυμαδόν
  choice: एकमत हो जाने पर
  rationale: यह कृदन्त में निहित एक स्थिति तक पहुँचने की प्रक्रिया और ὁμοθυμαδόν की सामूहिक एकता—दोनों को बनाए रखता है।
- source_word: ἐκλεξαμένοις
  choice: चुनकर
  rationale: हिन्दी में मुख्य क्रिया ‘भेजें’ के साथ यह स्वाभाविक रूप से चयन को भेजने से पहले की क्रिया बताता है।
- source_word: ἄνδρας
  choice: कुछ पुरुषों
  rationale: ἀνήρ यहाँ वयस्क पुरुषों को सूचित करता है; प्रसंग में वे यहूदा और सीलास हैं। हिन्दी वाक्य में अनिश्चित बहुवचन को स्वाभाविक बनाने के लिए ‘कुछ’ जोड़ा गया है।
- source_word: πέμψαι πρὸς ὑμᾶς
  choice: उन्हें ... आपके पास भेजें
  rationale: ‘उन्हें’ चुने गए पुरुषों की ओर स्पष्ट संकेत करता है और πρὸς ὑμᾶς का स्वाभाविक हिन्दी रूप ‘आपके पास’ है।
- source_word: σὺν
  choice: के साथ
  rationale: यह साधारण साथ या सहगमन का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: τοῖς ἀγαπητοῖς ἡμῶν
  choice: अपने प्रिय
  rationale: यह बरनबास और पौलुस के प्रति समुदाय के स्नेह और सम्मान को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: Βαρναβᾷ καὶ Παύλῳ
  choice: बरनबास और पौलुस
  rationale: नामों को प्रचलित हिन्दी बाइबलीय वर्तनी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: यरूशलेम की सभा के पत्र का सामूहिक विचार-विमर्श वाला स्वर
  choice: हमें यह उचित लगा
  alternative: हमने निर्णय किया
  rationale: δοκέω की यह रचना सामूहिक सम्मति या उचित जान पड़ने को व्यक्त करती है। ‘हमने निर्णय किया’ अधिक निर्णायक और अधिकारपूर्ण हो सकता है; चुना हुआ रूप मूल के संयत स्वर को बनाए रखता है।
- issue: सभा की एकता का स्वरूप
  choice: एकमत हो जाने पर
  alternative: एक मन होकर
  rationale: मूल पाठ सामूहिक सहमति तक पहुँचने की बात कहता है, पर उस सहमति के धार्मिक या संस्थागत स्वरूप को और परिभाषित नहीं करता। चुना हुआ रूप इसी सीमा को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण और सामुदायिक पत्र-शैली वाला रूप। ‘एकमत हो जाने पर’ मूल के कृदन्तीय भाव को रखता है, और ‘हमें यह उचित लगा’ विचार-विमर्श के संयत स्वर को बनाए रखता है।
