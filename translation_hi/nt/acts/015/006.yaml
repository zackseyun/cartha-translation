source:
  edition: SBLGNT
  text: Συνήχθησάν ⸀τε οἱ ἀπόστολοι καὶ οἱ πρεσβύτεροι ἰδεῖν περὶ τοῦ λόγου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/006.yaml
  text: So the apostles and the elders gathered together to consider this matter[a][b].
translation:
  language: hi
  text: तब प्रेरित और प्राचीन इस विषय पर विचार करने के लिए एकत्र हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνήχθησάν
  choice: एकत्र हुए
  rationale: यद्यपि यूनानी रूप व्याकरणतः कर्मवाच्य है, इस प्रसंग में यह सभा के एक साथ आने को स्वाभाविक रूप से व्यक्त करता है। ‘एकत्र हुए’ आधुनिक हिन्दी में सामूहिक जुटने का अर्थ स्पष्ट रखता है।
- source_word: τε
  choice: तब
  rationale: यह अव्यय पिछले प्रसंग से हल्का संबंध और कथा की अगली प्रगति दिखाता है। हिन्दी में ‘तब’ विवाद के बाद सभा होने के क्रम को सहज रूप से व्यक्त करता है।
- source_word: ἀπόστολοι
  choice: प्रेरित
  rationale: प्रेरितों के काम में यह मान्य प्रेरित अगुवों को सूचित करता है; ‘प्रेरित’ इसका स्थापित और सटीक हिन्दी रूप है।
- source_word: πρεσβύτεροι
  choice: प्राचीन
  rationale: यहाँ शब्द केवल अधिक आयु के पुरुषों के लिए नहीं, बल्कि समुदाय के मान्य अगुवों के लिए है। ‘प्राचीन’ बाइबलीय हिन्दी में इस भूमिका का परिचित शब्द है और बाद की किसी विशिष्ट कलीसियाई व्यवस्था को अनावश्यक रूप से नहीं थोपता।
- source_word: ἰδεῖν
  choice: विचार करने के लिए
  rationale: शाब्दिक अर्थ ‘देखना’ है, पर यहाँ क्रिया किसी प्रश्न की जाँच और उस पर विचार-विमर्श करने का भाव रखती है। यह अनुवाद निर्णय को पहले से निश्चित नहीं बताता।
- source_word: περὶ τοῦ λόγου τούτου
  choice: इस विषय पर
  rationale: λόγος यहाँ किसी बोले हुए ‘शब्द’ के बजाय पिछले पद में उठे विवादित मामले या प्रश्न को सूचित करता है। ‘इस विषय पर’ हिन्दी में प्रसंगानुकूल और स्वाभाविक है।
theological_decisions:
- issue: यरूशलेम की सभा में πρεσβύτεροι की संस्थागत बारीकी
  choice: ‘प्राचीन’ रखा गया है, बिना बाद की किसी विशेष सांप्रदायिक पद-व्यवस्था को इसमें पढ़े।
  alternative: इसे बाद की कलीसिया के तकनीकी पद के अर्थ में अधिक विशिष्ट बनाना।
  rationale: पद यरूशलेम की कलीसिया के मान्य अगुवों की पहचान कराता है, पर स्वयं पाठ बाद में विकसित किसी खास कलीसियाई शासन-प्रणाली की माँग नहीं करता।
- issue: सभा का विचार-विमर्श संबंधी उद्देश्य
  choice: ‘इस विषय पर विचार करने के लिए’
  alternative: ‘इस विषय का निर्णय करने के लिए’
  rationale: ἰδεῖν यहाँ विषय को जाँचने और उस पर विचार करने की प्रक्रिया बताता है। ‘निर्णय करने’ से इस बिंदु पर परिणाम को आवश्यकता से अधिक पहले से निश्चित बताया जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य संक्षिप्त है और कथा-संबंध के लिए ‘तब’ प्रयुक्त हुआ है। ‘प्राचीन’ स्थापित बाइबलीय पद है, जबकि शेष संरचना सामान्य आधुनिक हिन्दी के निकट रखी गई है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई, क्योंकि मुख्य पाठ में यूनानी भाव बिना महत्वपूर्ण अस्पष्टता खोए स्पष्ट है।
