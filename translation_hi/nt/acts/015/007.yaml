  text: πολλῆς δὲ ⸀ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς· Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ’ ἡμερῶν ἀρχαίων ⸂ἐν ὑμῖν ἐξελέξατο ὁ θεὸς⸃ διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/007.yaml
  text: And after much debate had taken place[a], Peter stood up and said to them, “Brothers[c][b], you know that from ancient days God chose among you that through my mouth the Gentiles should hear the word of the gospel and believe.”
translation:
  language: hi
  text: बहुत वाद-विवाद होने के बाद पतरस उठ खड़े होकर उनसे कहा, “भाइयो,[a] तुम जानते हो कि बहुत पहले परमेश्वर ने तुम्हारे बीच मुझे चुना, ताकि मेरे मुँह से गैर-यहूदी लोग[b] सुसमाचार का वचन सुनें और विश्वास करें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “पुरुषो, भाइयो।” यूनानी सम्बोधन पुरुषवाचक बहुवचन में है; यह एक प्रचलित प्रतिनिधिक सम्बोधन भी हो सकता था।
    reason: lexical_alternative
  - marker: b
    text: या “जातियाँ।” यहाँ आशय गैर-यहूदी लोगों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῆς ... ζητήσεως γενομένης
  choice: बहुत वाद-विवाद हो चुकने के बाद
  rationale: सम्बन्धकारक निरपेक्ष रचना पहले घट चुकी परिस्थिति बताती है। यहाँ ζήτησις यरूशलेम की सभा में गंभीर विचार-विमर्श और मतभेद दोनों को व्यक्त करता है; ‘वाद-विवाद’ इस तनाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀναστὰς
  choice: खड़े होकर
  rationale: यह कृदन्त पतरस के बोलने से पहले उठकर खड़े होने की क्रिया बताता है।
- source_word: Ἄνδρες ἀδελφοί
  choice: भाइयो
  rationale: यह पुरुषवाचक बहुवचन में प्रचलित सम्बोधन है। ‘भाइयो’ पारिवारिक भाव और यूनानी रूप को रखता है; सम्भावित व्यापक प्रतिनिधिक प्रयोग को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐπίστασθε
  choice: तुम जानते हो
  rationale: क्रिया श्रोताओं को पहले से ज्ञात बात की ओर संकेत करती है; यह सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἀφ’ ἡμερῶν ἀρχαίων
  choice: बहुत पहले
  rationale: वाक्यांश श्रोताओं को ज्ञात आरम्भिक समय की ओर संकेत करता है। शाब्दिक ‘प्राचीन दिनों से’ आधुनिक हिन्दी में इस निकट इतिहास को अनावश्यक रूप से अत्यन्त पुराना दर्शा सकता है।
- source_word: ἐν ὑμῖν ἐξελέξατο ὁ θεός
  choice: परमेश्वर ने तुम्हारे बीच मुझे चुना
  rationale: ἐν ὑμῖν चुनाव के समूह या दायरे को बताता है। प्रसंग और διὰ τοῦ στόματός μου से स्पष्ट कर्म ‘मुझे’ हिन्दी में स्वाभाविक वाक्य-रचना के लिए व्यक्त किया गया है, जबकि ‘तुम्हारे बीच’ मूल की सम्भावित सूक्ष्मता बनाए रखता है।
- source_word: διὰ τοῦ στόματός μου
  choice: मेरे मुँह से
  rationale: यह पतरस को बोलने के साधन के रूप में प्रस्तुत करने वाली मूल की सजीव अभिव्यक्ति को सुरक्षित रखता है।
- source_word: τὰ ἔθνη
  choice: गैर-यहूदी
  rationale: इस सभा के प्रसंग में ἔθνη से यहूदियों के बाहर के लोग अभिप्रेत हैं। ‘गैर-यहूदी’ सामान्य आधुनिक हिन्दी में स्पष्ट है; व्यापक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: τὸν λόγον τοῦ εὐαγγελίου
  choice: सुसमाचार का वचन
  rationale: यह λόγος और εὐαγγέλιον दोनों की औपचारिक बनावट को बनाए रखते हुए हिन्दी बाइबलीय शैली में समझने योग्य है।
- source_word: ἀκοῦσαι ... καὶ πιστεῦσαι
  choice: सुनें और विश्वास करें
  rationale: दोनों समन्वित अनन्त क्रियाओं को समान रूप में रखा गया है और विश्वास के अर्थ में कोई अतिरिक्त धर्मशास्त्रीय व्याख्या नहीं जोड़ी गई।
theological_decisions:
- issue: Ἄνδρες ἀδελφοί का लिंग-सूचक सम्बोधन
  choice: भाइयो
  alternative: पुरुषो, भाइयो; भाइयो और बहनो
  rationale: मुख्य पाठ में पुरुषवाचक बहुवचन और आत्मीय सम्बोधन को सुरक्षित रखा गया है। ‘भाइयो और बहनो’ सम्भावित समावेशी प्रयोग को स्पष्ट करता, पर मूल में निहित न होने वाला स्त्रीवाचक पद जोड़ देता; इसलिए यह बात पादटिप्पणी में रखी गई है।
- issue: τὰ ἔθνη का उद्धार-ऐतिहासिक अर्थ
  choice: गैर-यहूदी
  alternative: जातियाँ; राष्ट्र
  rationale: प्रेरितों 15 का तत्काल प्रसंग यहूदी और गैर-यहूदी विश्वासियों के सम्बन्ध का है। इसलिए सन्दर्भगत अभिप्राय मुख्य पाठ में दिया गया है, जबकि व्यापक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: ἐν ὑμῖν के साथ चुनाव का सम्बन्ध
  choice: तुम्हारे बीच मुझे चुना
  alternative: तुममें यह चुनाव किया; तुममें से मुझे चुना
  rationale: पाठ में चुनाव का कर्म व्याकरणतः प्रत्यक्ष रूप से नहीं लिखा गया, किंतु ‘मेरे मुँह से’ पतरस की भूमिका स्पष्ट करता है। ‘मुझे’ हिन्दी में आवश्यक स्पष्टता देता है, और ‘तुम्हारे बीच’ को बनाए रखने से यह अस्पष्टता अनावश्यक रूप से ‘तुममें से’ तक सीमित नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘बहुत पहले’ निकटवर्ती आरम्भिक कलीसियाई इतिहास के लिए स्वाभाविक है। ‘गैर-यहूदी’ सामान्य पाठक के लिए ‘अन्यजाति’ से अधिक तत्काल स्पष्ट है, जबकि ‘सुसमाचार का वचन’ लूका की औपचारिक धार्मिक अभिव्यक्ति को बनाए रखता है।
