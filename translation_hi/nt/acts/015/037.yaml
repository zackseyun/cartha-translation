lexical_decisions:
- source_word: Βαρναβᾶς
  choice: बरनबास
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: δὲ
  choice: पर
  rationale: पिछले कथन के साथ हल्का विरोध दर्शाता है; आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐβούλετο
  choice: चाहते थे
  rationale: अपूर्ण भूतकाल में व्यक्त इच्छा या मंशा को सहज हिन्दी में प्रकट करता है, बिना उसे दृढ़ निर्णय बना देने के।
- source_word: συμπαραλαβεῖν
  choice: साथ ले जाना
  rationale: किसी को यात्रा-दल में अपने साथ लेने का अर्थ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: καὶ
  choice: भी
  rationale: यूहन्ना को साथ लेने पर दिए गए योगात्मक बल को सुरक्षित रखता है।
- source_word: Ἰωάννην
  choice: यूहन्ना
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: τὸν καλούμενον Μᾶρκον
  choice: जो मरकुस कहलाता था
  rationale: कृदन्तीय पदबंध को पहचान बताने वाले स्वाभाविक हिन्दी उपवाक्य में प्रस्तुत करता है और यूनानी में स्पष्ट रूप से न दिए गए अतिरिक्त ‘भी’ को नहीं जोड़ता।
- source_word: Μᾶρκον
  choice: मरकुस
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप।
