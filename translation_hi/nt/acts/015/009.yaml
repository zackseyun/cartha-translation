  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। ‘उसने’ का संदर्भ पिछले पदों के परमेश्वर से है। पद छोटा और मौखिक पाठ के लिए सहज रखा गया है।
