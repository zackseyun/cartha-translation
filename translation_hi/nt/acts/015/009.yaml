base_translation:
  language: en
  yaml_path: translation/nt/acts/015/009.yaml
  text: And he made no distinction between us and them[a], having cleansed their hearts by faith.
translation:
  language: hi
  text: और विश्वास के द्वारा[a] उनके हृदयों को शुद्ध करके, उसने हमारे और उनके बीच कोई भेद नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वास से।” यूनानी सम्प्रदान कारक साधन या माध्यम का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθὲν διέκρινεν
  choice: कोई भेद नहीं किया
  rationale: यह संयुक्त अभिव्यक्ति स्वाभाविक आधुनिक हिन्दी में समूहों के बीच किसी प्रकार का भेद न किए जाने को स्पष्ट करती है।
- source_word: μεταξὺ ἡμῶν τε καὶ αὐτῶν
  choice: हमारे और उनके बीच
  rationale: यूनानी संबंधसूचक वाक्यांश और τε ... καὶ के समन्वय को सहज हिन्दी में यथावत व्यक्त करता है।
- source_word: τῇ πίστει
  choice: विश्वास के द्वारा
  rationale: सम्प्रदान कारक यहाँ साधन का भाव व्यक्त कर सकता है; यह अनुवाद बताता है कि शुद्धीकरण विश्वास के माध्यम से हुआ।
- source_word: καθαρίσας
  choice: शुद्ध किया
  rationale: कृदन्त को हिन्दी में समन्वित क्रिया के रूप में रखना स्वाभाविक है और हृदयों के शुद्धीकरण की मूल छवि सुरक्षित रखता है।
- source_word: τὰς καρδίας αὐτῶν
  choice: उनके हृदयों को
  rationale: καρδία के आंतरिक व्यक्ति संबंधी अर्थ को पारंपरिक, सुबोध और धर्मवैचारिक रूप से तटस्थ हिन्दी में बनाए रखता है।
theological_decisions:
- issue: πίστις का अनुवाद
  choice: विश्वास
  alternative: भरोसा
  rationale: इस प्रसंग में πίστις सामान्यतः परमेश्वर पर विश्वास को दर्शाता है; ‘विश्वास’ प्रचलित और सटीक हिन्दी विकल्प है, जबकि ‘भरोसा’ संभव है पर अपेक्षाकृत बोलचाल का है।
- issue: τῇ πίστει में साधन का भाव
  choice: विश्वास के द्वारा
  alternative: विश्वास से
  rationale: यूनानी सम्प्रदान कारक साधन या माध्यम व्यक्त कर सकता है। मुख्य पाठ में ‘के द्वारा’ इस संबंध को स्पष्ट करता है, बिना यह निर्धारित किए कि विश्वास स्वयं प्रभावकारी कर्ता है।
- issue: καθαρίσας और मुख्य क्रिया का संबंध
  choice: बल्कि ... शुद्ध किया
  alternative: उनके हृदयों को शुद्ध करके ... कोई भेद नहीं किया
  rationale: यूनानी कृदन्त के सटीक कालगत संबंध में कुछ लचीलापन है। हिन्दी की समन्वित रचना दोनों दैवी कार्यों को स्पष्ट रखती है; ‘बल्कि’ बताता है कि भेद करने के स्थान पर समान शुद्धीकरण हुआ, यद्यपि यह संबंध मूल में निहित है, औपचारिक संयोजक से व्यक्त नहीं।
