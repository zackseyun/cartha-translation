translation:
  language: hi
  text: जो प्राचीन काल से ज्ञात हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ हस्तलिपियों में अधिक विस्तृत पाठ है: ‘जो अनंतकाल से ज्ञात हैं’ या ‘जो प्राचीन काल से इन बातों को प्रकट करता आया है।’'
    reason: textual_variant
lexical_decisions:
- source_word: γνωστὰ
  choice: ज्ञात
  rationale: यह विशेषण इस क्रियारहित यूनानी वाक्यांश में विधेय के रूप में प्रयुक्त है। ‘ज्ञात’ उसका सीधा और स्वाभाविक हिन्दी रूप है; ‘प्रकट किए गए’ मूल पाठ में निहित न होने वाला क्रियात्मक भाव जोड़ देगा।
- source_word: ἀπ’
  choice: से
  rationale: यहाँ ἀπό समय के आरंभ-बिंदु को दर्शाता है। हिन्दी में ‘से’ इस संक्षिप्त कालगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: αἰῶνος
  choice: प्राचीन काल
  rationale: इस कालगत प्रयोग में αἰών बहुत पुराने समय या दीर्घ अतीत का बोध करा सकता है। ‘प्राचीन काल से’ आधुनिक हिन्दी में सहज है और SBLGNT के संक्षिप्त पाठ को ‘अनंतकाल’ जैसे अधिक प्रबल अर्थ में नहीं बदलता।
theological_decisions:
- issue: इस संक्षिप्त वाक्यांश में परमेश्वर के ज्ञान की कालगत सीमा
  choice: वाक्यांश को ‘प्राचीन काल से ज्ञात’ के रूप में रखा गया है, बिना इसे अनन्त पूर्वज्ञान संबंधी अधिक प्रबल सैद्धान्तिक कथन में विस्तृत किए।
  alternative: ‘अनंतकाल से ज्ञात’ अथवा ‘जो प्राचीन काल से इन बातों को प्रकट करता आया है’
  rationale: 'SBLGNT का पाठ अत्यंत संक्षिप्त है: γνωστὰ ἀπ’ αἰῶνος। इसलिए मुख्य पाठ में न तो लंबे पाठांतर के शब्द जोड़े गए हैं, न धर्मवैज्ञानिक निष्कर्ष द्वारा कथन को विस्तृत किया गया है; पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।'
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जो’ प्रसंग से जुड़ाव बनाए रखता है, जबकि मूल यूनानी की संक्षिप्तता और कुछ हद तक उसकी संरचनात्मक अस्पष्टता भी सुरक्षित रहती है।
