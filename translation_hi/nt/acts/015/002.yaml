source:
  edition: SBLGNT
  text: γενομένης ⸀δὲ στάσεως καὶ ζητήσεως οὐκ ὀλίγης τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτοὺς ἔταξαν ἀναβαίνειν Παῦλον καὶ Βαρναβᾶν καί τινας ἄλλους ἐξ αὐτῶν πρὸς τοὺς ἀποστόλους καὶ πρεσβυτέρους εἰς Ἰερουσαλὴμ περὶ τοῦ ζητήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/002.yaml
  text: And after no small dissension and debate had arisen between Paul and Barnabas and them[c][b][a], they appointed Paul and Barnabas and some others from among them to go up to the apostles and elders in Jerusalem about this issue.
translation:
  language: hi
  text: जब पौलुस और बरनबास का उन लोगों के साथ गंभीर मतभेद और वाद-विवाद हुआ, तो उन्होंने यह ठहराया कि पौलुस, बरनबास और उनमें से कुछ अन्य लोग इस प्रश्न के विषय में प्रेरितों और प्राचीनों के पास यरूशलेम जाएँ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक भाव ‘यरूशलेम ऊपर जाएँ’ है। यरूशलेम की यात्रा के लिए ‘ऊपर जाना’ एक प्रचलित भौगोलिक और सांस्कृतिक मुहावरा था।
    reason: cultural_note
lexical_decisions:
- source_word: γενομένης δὲ
  choice: तब ... हुआ
  rationale: सम्बन्धकारक निरपेक्ष रचना मुख्य कार्य से पहले उत्पन्न परिस्थिति बताती है। ‘तब ... हुआ’ आधुनिक हिन्दी में स्वाभाविक है और δέ के कथात्मक संक्रमण को भी व्यक्त करता है।
- source_word: στάσεως
  choice: तीखा मतभेद
  rationale: यहाँ शब्द गंभीर विरोध और कलह का बोध कराता है, पर हिंसा या विद्रोह का अर्थ आवश्यक नहीं। ‘तीखा मतभेद’ उसकी प्रबलता को सहज हिन्दी में रखता है।
- source_word: ζητήσεως
  choice: वाद-विवाद
  rationale: στάσις के साथ यह सक्रिय मौखिक बहस या विवाद को दर्शाता है। ‘वाद-विवाद’ मतभेद से अलग उस चर्चा के विवादपूर्ण स्वर को बनाए रखता है।
- source_word: οὐκ ὀλίγης
  choice: बहुत तीखा
  rationale: यूनानी में ‘कम नहीं’ वाला अल्पोक्ति-प्रयोग मात्रा और गंभीरता पर बल देता है। हिन्दी में ‘बहुत तीखा’ उसका अर्थ स्पष्ट और स्वाभाविक ढंग से पहुँचाता है।
- source_word: τῷ Παύλῳ καὶ τῷ Βαρναβᾷ πρὸς αὐτούς
  choice: पौलुस और बरनबास का उन लोगों के साथ
  rationale: यह रचना विवाद में सम्मिलित दोनों पक्षों को बताती है। ‘उन लोगों’ का संदर्भ पिछले पद में यहूदिया से आए लोगों से है; अनुवाद इससे अधिक शत्रुतापूर्ण भाव नहीं जोड़ता।
- source_word: ἔταξαν
  choice: उन्होंने ठहराया
  rationale: τάσσω यहाँ प्रतिनिधियों की यात्रा निर्धारित करने या उन्हें नामित करने का भाव रखता है। ‘ठहराया’ सामुदायिक निर्णय को व्यक्त करता है, पर ऐसी औपचारिक पद-व्यवस्था नहीं जोड़ता जिसे पाठ स्पष्टतः नहीं कहता।
- source_word: ἀναβαίνειν
  choice: जाएँ
  rationale: ἀναβαίνω का शाब्दिक अर्थ ‘ऊपर जाना’ है और यरूशलेम की यात्रा के लिए यह प्रचलित मुहावरा था। आधुनिक हिन्दी में केवल ‘जाएँ’ अधिक स्वाभाविक है; सांस्कृतिक-भौगोलिक भाव पादटिप्पणी में दिया गया है।
- source_word: τινας ἄλλους ἐξ αὐτῶν
  choice: उनमें से कुछ अन्य लोग
  rationale: यह स्थानीय समुदाय में से चुने गए अतिरिक्त प्रतिनिधियों को दर्शाता है। ‘लोग’ लिंग के विषय में यूनानी से अधिक विशिष्टता नहीं जोड़ता।
- source_word: τοὺς ἀποστόλους καὶ πρεσβυτέρους
  choice: प्रेरितों और प्राचीनों
  rationale: प्रेरित Acts में मान्य पदनाम है। πρεσβύτεροι के लिए ‘प्राचीन’ हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला नेतृत्व-सूचक शब्द है।
- source_word: περὶ τοῦ ζητήματος τούτου
  choice: इस प्रश्न के विषय में
  rationale: ζήτημα उस विवादित प्रश्न या मामले को दर्शाता है जिस पर विचार होना था। ‘प्रश्न’ बहसाधीन विषय को स्पष्ट करता है और किसी निष्कर्ष को पहले से निर्धारित नहीं करता।
theological_decisions:
- issue: विवाद में सम्मिलित पक्षों की पहचान
  choice: विवाद को पौलुस और बरनबास तथा ‘उन लोगों’ के बीच बताया गया है; ‘उन लोगों’ का संकेत पिछले पद में यहूदिया से आए व्यक्तियों की ओर है।
  alternative: इसे अधिक ढीले रूप में ‘पौलुस और बरनबास ने उनके साथ बहुत वाद-विवाद किया’ कहा जा सकता है।
  rationale: यह मुख्यतः वाक्य-विन्यास का निर्णय है। चुना हुआ रूप निकटवर्ती कथात्मक संदर्भ को स्पष्ट रखता है और कोई अतिरिक्त सिद्धान्तगत निष्कर्ष नहीं जोड़ता।
- issue: ἔταξαν में सामुदायिक या संस्थागत भाव
  choice: ‘उन्होंने ठहराया’ द्वारा प्रतिनिधियों के विषय में किए गए सामूहिक और सुव्यवस्थित निर्णय को व्यक्त किया गया है।
  alternative: ‘उन्होंने नियुक्त किया’ या ‘उन्होंने निश्चय किया।’
  rationale: ‘ठहराया’ प्रतिनिधिमंडल भेजने के व्यवस्थित निर्णय को रखता है, किंतु पाठ के आधार से आगे बढ़कर किसी विशिष्ट कलीसियाई शासन-पद्धति का दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी अल्पोक्ति ‘कम नहीं’ को शब्दशः अस्वाभाविक हिन्दी में रखने के बजाय ‘बहुत तीखा’ से उसका बल व्यक्त किया गया है। ‘प्रेरित’ और ‘प्राचीन’ जैसे स्थापित बाइबलीय पद सुरक्षित रखे गए हैं।
