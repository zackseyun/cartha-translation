  terminology: “पौलुस,” “बरनबास,” “प्रेरितों,” and “प्राचीनों” are suitable established biblical terms. “इस प्रश्न के विषय में” accurately represents the disputed matter. The footnote should state the Greek idiom more idiomatically in Hindi.
