base_translation:
  language: en
  yaml_path: translation/nt/acts/015/013.yaml
  text: And after they became silent[a], James answered, saying, “Brothers[b], listen to me.”
translation:
  language: hi
  text: जब वे चुप हो गए[a], तब याकूब ने उत्तर देते हुए कहा, “भाइयो[b], मेरी बात सुनिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब उन्होंने बोलना बंद किया।” यूनानी अभिव्यक्ति पिछले वक्ताओं के बोलना बंद कर देने के बाद का समय बताती है।
    reason: lexical_alternative
  - marker: b
    text: संबोधन का शब्दशः रूप “पुरुषो, भाइयो” है—यह एक औपचारिक पुल्लिंग संबोधन है। प्रसंग में यह सभा में उपस्थित भाइयों को संबोधित करता है, यद्यपि व्यापक सभा में अन्य लोग भी थे।
    reason: cultural_note
lexical_decisions:
- source_word: μετὰ δὲ τὸ σιγῆσαι αὐτοὺς
  choice: जब वे चुप हो गए, तब
  rationale: μετά के साथ क्रियार्थक संज्ञा-विन्यास बाद के समय को दर्शाता है; σιγάω यहाँ बोलना बंद करके चुप हो जाने के अर्थ में है। हिंदी का ‘जब…तब’ क्रम को स्वाभाविक और स्पष्ट रखता है।
- source_word: ἀπεκρίθη
  choice: उत्तर देते हुए कहा
  rationale: ἀποκρίνομαι का मूल अर्थ ‘उत्तर देना/प्रतिक्रिया देना’ है। अगले λέγων के साथ संयुक्त हिंदी अभिव्यक्ति दोनों को दर्शाती है और कथन को सहज रखती है।
- source_word: Ἰάκωβος
  choice: याकूब
  rationale: यूनानी Ἰάκωβος से निकट और हिंदी बाइबलीय परंपरा में प्रचलित नाम-रूप ‘याकूब’ चुना गया है।
- source_word: λέγων
  choice: कहा
  rationale: यह कृदंत प्रत्यक्ष कथन का परिचय देता है; हिंदी में ‘उत्तर देते हुए कहा’ स्वाभाविक रूप से इसका कार्य व्यक्त करता है।
- source_word: Ἄνδρες ἀδελφοί
  choice: भाइयो
  rationale: यह औपचारिक संबोधन शब्दशः ‘पुरुषो, भाइयो’ है। आधुनिक हिंदी में ‘भाइयो’ सभा में उपस्थित पुरुष सहविश्वासियों के लिए स्वाभाविक, सम्मानपूर्ण संबोधन है; दोहरे यूनानी रूप की जानकारी पाद-टिप्पणी में रखी गई है।
- source_word: ἀκούσατέ μου
  choice: मेरी बात सुनिए
  rationale: आज्ञार्थक रूप ध्यान से सुनने का आग्रह करता है। आदरसूचक बहुवचन ‘सुनिए’ सभा-संबोधन के अनुरूप है, और ‘मेरी बात’ हिंदी में स्वाभाविक रूप से ‘मुझे सुनो’ का आशय देता है।
theological_decisions:
- issue: सार्वजनिक सभा में पुल्लिंग संबोधन Ἄνδρες ἀδελφοί
  choice: मुख्य पाठ में ‘भाइयो’ और पाद-टिप्पणी में शब्दशः पुल्लिंग रूप की सूचना
  alternative: ‘पुरुषो, भाइयो’
  rationale: दोनों यूनानी संबोधन पुल्लिंग हैं, पर हिंदी में ‘पुरुषो, भाइयो’ अत्यंत अस्वाभाविक और अर्थ की दृष्टि से अनावश्यक पुनरुक्ति लगेगी। ‘भाइयो’ संबोधित समूह का पुल्लिंग रूप बनाए रखता है; पाद-टिप्पणी मूल के दोहरे औपचारिक संबोधन को पारदर्शी बनाती है और व्यापक सभा के संदर्भ को भी बिना मुख्य पाठ बदलने के बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक सभा के अनुरूप रखी गई है। ‘सुनिए’ आदरसूचक बहुवचन है। ‘उत्तर देते हुए कहा’ यूनानी ἀπεκρίθη λέγων को स्वाभाविक हिंदी में प्रस्तुत करता है।
