lexical_decisions:
- source_word: ἀνθρώποις
  choice: ऐसे पुरुष
  rationale: यह शब्द यद्यपि सामान्य रूप से ‘मनुष्य/लोग’ भी दर्शा सकता है, यहाँ निकट संदर्भ में बरनबास और पौलुस के लिए प्रयुक्त है; इसलिए ‘पुरुष’ विशिष्ट और स्वाभाविक है।
- source_word: παραδεδωκόσι
  choice: जोखिम में डाल दिए हैं
  rationale: परिपूर्ण कृदंत का शाब्दिक अर्थ ‘सौंप चुके’ है, पर ‘प्राणों’ के साथ यह घातक संकट के सामने स्वयं को प्रस्तुत करने का भाव देता है। हिंदी मुहावरा ‘प्राण जोखिम में डालना’ यह अर्थ स्पष्ट करता है, बिना यह कहे कि उनकी मृत्यु हो चुकी थी।
- source_word: τὰς ψυχὰς αὐτῶν
  choice: अपने प्राण
  rationale: यहाँ ψυχή का अर्थ अमूर्त ‘आत्मा’ नहीं, बल्कि संकट में पड़ी हुई ‘जान/जीवन’ है। ‘प्राण’ वर्तमान हिंदी में गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: ὑπὲρ
  choice: के लिए
  rationale: संबंधकारक के साथ ὑπέρ यहाँ कारण या हित का भाव देता है; ‘के लिए’ संक्षिप्त और स्वाभाविक है।
- source_word: τοῦ ὀνόματος
  choice: नाम
  rationale: ‘नाम’ को बनाए रखने से व्यक्ति, अधिकार और सम्मान से जुड़ी बाइबिलीय अर्थ-व्याप्ति सुरक्षित रहती है।
- source_word: τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु
  rationale: ‘प्रभु’ κύριος के मसीही पद और नए नियम के प्रचलित प्रयोग दोनों को सुरक्षित रखता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός यहाँ यीशु का पद है, जिसका अर्थ ‘मसीह’ है; हिंदी में ‘यीशु मसीह’ स्वाभाविक रूप से इसी पदवाचक अर्थ को व्यक्त करता है।
theological_decisions:
- issue: κυρίου ἡμῶν Ἰησοῦ Χριστοῦ में Χριστοῦ का अनुवाद
  choice: हमारे प्रभु यीशु मसीह
  alternative: हमारे प्रभु यीशु ख्रीस्त
  rationale: Χριστός को अर्थपूर्ण पद ‘मसीह’ के रूप में प्रस्तुत किया गया है, न कि केवल नाम के एक अंश के रूप में। यह मूल के मसीहाई आशय को स्पष्ट रखते हुए मानक हिंदी प्रयोग के अनुरूप है।
- issue: παραδεδωκόσι τὰς ψυχὰς αὐτῶν में बलिदान और जोखिम का संबंध
  choice: अपने प्राण जोखिम में डाल दिए हैं
  alternative: अपने प्राण सौंप दिए हैं
  rationale: मूल अभिव्यक्ति प्राणघातक खतरे के प्रति आत्मसमर्पण का प्रबल भाव रखती है, पर यह आवश्यक रूप से वास्तविक मृत्यु नहीं बताती। मुख्य पाठ में जोखिम का आशय और पादटिप्पणी में शाब्दिक रूप रखकर इस तनाव को सुरक्षित किया गया है।
