  text: ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ ⸀πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. ἔρρωσθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/029.yaml
  text: to abstain from food sacrificed to idols[a], from blood, from what has been strangled, and from sexual immorality. If you keep yourselves from these things, you will do well[d][c][b]. Farewell.
translation:
  language: hi
  text: कि तुम मूर्तियों को चढ़ाया हुआ भोजन[a], लहू, गला घोंटकर मारे गए पशुओं का मांस[b] और यौन अनैतिकता[c] से दूर रहो। यदि तुम अपने आप को इन बातों से बचाए रखोगे, तो अच्छा करोगे। विदा।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्तियों को चढ़ाई हुई वस्तुएँ।”
    reason: lexical_alternative
  - marker: b
    text: या, “गला घोंटकर मारे गए पशु” अथवा “गला घोंटी हुई चीज़ें।”
    reason: lexical_alternative
  - marker: c
    text: यहाँ अनूदित यूनानी शब्द का अर्थ व्यापक हो सकता है; फिर भी कुछ व्याख्याकार लैव्यव्यवस्था के निषेधों के प्रकाश में इसे अधिक विशिष्ट अर्थ में समझते हैं।
    reason: alternative_reading
  - marker: d
    text: या, “स्वस्थ रहो।” यूनानी में यह पत्र समाप्त करने का एक प्रचलित ढंग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθαι
  choice: से दूर रहो
  rationale: यह निर्देश की विषयवस्तु बताने वाले infinitive का स्वाभाविक हिन्दी रूप है और निरंतर परहेज़ का भाव रखता है।
- source_word: εἰδωλοθύτων
  choice: मूरतों को चढ़ाई हुई वस्तुओं
  rationale: यह व्यापक substantive अर्थ को सुरक्षित रखता है; संदर्भ में प्रायः भोजन या मांस अभिप्रेत है, पर यूनानी शब्द स्वयं केवल भोजन तक सीमित नहीं है।
- source_word: αἵματος
  choice: लहू
  rationale: यूनानी में संक्षेप से केवल ‘लहू’ है; आहार-संबंधी संदर्भ का अर्थ जोड़े बिना वही संक्षिप्तता रखी गई है।
- source_word: πνικτῶν
  choice: गला घोंटे हुए पशुओं का मांस
  rationale: पाठकों के लिए आशय स्पष्ट करता है कि बात ऐसे पशुओं से प्राप्त मांस की है जिनका लहू नहीं बहाया गया था।
- source_word: πορνείας
  choice: यौन अनैतिकता
  rationale: यह πορνεία के व्यापक अर्थ को आधुनिक और गरिमापूर्ण हिन्दी में व्यक्त करता है, बिना इसे किसी एक विशेष अपराध तक सीमित किए।
- source_word: ἐξ ὧν
  choice: इन बातों से
  rationale: यह पहले दी गई पूरी सूची की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: διατηροῦντες ἑαυτούς
  choice: यदि तुम ... अपने आप को बचाए रखोगे
  rationale: यूनानी participle को हिन्दी में स्वाभाविक शर्तीय वाक्य के रूप में व्यक्त किया गया है; ‘बचाए रखना’ सावधानी से परहेज़ करने का भाव देता है।
- source_word: εὖ πράξετε
  choice: तो अच्छा करोगे
  rationale: यह यूनानी मुहावरे का सीधा और स्वाभाविक हिन्दी समतुल्य है, जो इस आचरण को उचित और सराहनीय बताता है।
- source_word: ἔρρωσθε
  choice: स्वस्थ रहो
  rationale: यह पत्र के पारंपरिक समापन का मूल स्वास्थ्य/कुशलता-संबंधी भाव भी दिखाता है और हिन्दी में संक्षिप्त रहता है।
theological_decisions:
- issue: प्रेरितों के निर्णय में πορνεία का अर्थ
  choice: मुख्य पाठ में व्यापक ‘यौन अनैतिकता’
  alternative: व्यभिचार; अवैध वैवाहिक संबंध अथवा लैव्यव्यवस्था 18 में निषिद्ध संबंध
  rationale: इस संदर्भ में कुछ व्याख्याकार इसे विशेष लैव्यव्यवस्थीय निषेधों से जोड़ते हैं, पर पद स्वयं अर्थ को इतना संकीर्ण नहीं करता; इसलिए व्यापक शाब्दिक अर्थ मुख्य पाठ में और विशिष्ट संभावना टिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘मूरत’ साधारण धार्मिक शब्दावली में सहज है; वाक्य को पिछले पद से जुड़े उद्देश्यसूचक ‘कि’ के साथ रखा गया है। समापन के औपचारिक अर्थ और उसके पत्रात्मक कार्य—दोनों को मुख्य पाठ और टिप्पणी में सुरक्षित रखा गया है।
