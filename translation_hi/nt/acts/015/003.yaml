id: ACT.15.3
reference: Acts 15:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν προπεμφθέντες ὑπὸ τῆς ἐκκλησίας διήρχοντο τήν ⸀τε Φοινίκην καὶ Σαμάρειαν ἐκδιηγούμενοι τὴν ἐπιστροφὴν τῶν ἐθνῶν, καὶ ἐποίουν χαρὰν μεγάλην πᾶσι τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/003.yaml
  text: So then[a], having been sent on their way by the church, they passed through both Phoenicia and Samaria, describing in detail the conversion of the Gentiles[b], and they brought great joy to all the brothers.
translation:
  language: hi
  text: इस प्रकार कलीसिया ने उन्हें यात्रा के लिए विदा किया; वे फीनीके और सामरिया दोनों से होकर गए और गैर-यहूदियों के परिवर्तन[a] का विस्तार से वर्णन करते हुए सभी भाइयों[b] को बहुत आनन्दित करते गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गैर-यहूदियों का मुड़ना।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भाइयों” से सम्भवतः स्त्री-पुरुष सभी साथी विश्वासी अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεμφθέντες
  choice: यात्रा के लिए विदा किया
  rationale: यह क्रिया केवल भेजने के बजाय यात्रा में आगे बढ़ने के लिए विदा करने और आवश्यक सहयोग देने का भाव रख सकती है। हिंदी में यह चयन यात्रा-संबंधी अर्थ को स्वाभाविक ढंग से व्यक्त करता है, बिना यह मान लेने के कि उनके साथ कोई दल अवश्य गया था।
- source_word: ἐκκλησίας
  choice: कलीसिया
  rationale: प्रेरितों के काम में यह शब्द सामान्यतः मसीही विश्वासियों के समुदाय के लिए प्रयुक्त है। ‘कलीसिया’ आधुनिक हिंदी मसीही प्रयोग में स्पष्ट और प्रचलित है।
- source_word: διήρχοντο
  choice: से होकर गए
  rationale: अपूर्णकालिक क्रिया उनके उन क्षेत्रों से होकर लगातार यात्रा करने का चित्र देती है। हिंदी वाक्य में आगे का ‘वर्णन करते गए’ इस जारी गतिविधि को स्पष्ट रखता है।
- source_word: τε ... καὶ
  choice: फीनीके और सामरिया
  rationale: ग्रीक सहसंबंधी रचना दोनों क्षेत्रों को साथ जोड़ती है। हिंदी में साधारण ‘और’ यही संबंध स्वाभाविक रूप से व्यक्त करता है; ‘दोनों’ जोड़ना आवश्यक नहीं है।
- source_word: Φοινίκην
  choice: फीनीके
  rationale: यह क्षेत्र के यूनानी नाम का हिंदी में प्रचलित लिप्यंतरण है।
- source_word: Σαμάρειαν
  choice: सामरिया
  rationale: यह क्षेत्र के नाम का हिंदी में मानक और प्रचलित रूप है।
- source_word: ἐκδιηγούμενοι
  choice: विस्तार से वर्णन करते गए
  rationale: यौगिक क्रिया पूरी तरह या विस्तारपूर्वक सुनाने का भाव देती है। ‘करते गए’ यात्रा के दौरान जारी वर्णन को भी व्यक्त करता है।
- source_word: ἐπιστροφὴν
  choice: मन-फिराव
  rationale: यहाँ संज्ञा गैर-यहूदियों के धार्मिक रूप से मुड़ने का संकेत करती है। ‘मन-फिराव’ हिंदी में उस दिशा-परिवर्तन को व्यक्त करता है, पर यह नहीं बताता कि उसका कोई बाद का तकनीकी सिद्धान्तगत रूप ही अभिप्रेत है।
- source_word: τῶν ἐθνῶν
  choice: गैर-यहूदियों
  rationale: प्रेरितों के काम 15 के संदर्भ में यह शब्द यहूदियों से भिन्न लोगों को दर्शाता है। ‘गैर-यहूदी’ सामान्य आधुनिक हिंदी पाठक के लिए ‘अन्यजाति’ की तुलना में अधिक तुरंत स्पष्ट है।
- source_word: ἐποίουν χαρὰν μεγάλην
  choice: इससे ... बहुत आनन्द हुआ
  rationale: ग्रीक मुहावरा बताता है कि उनके समाचार ने बड़ा आनन्द उत्पन्न किया। हिंदी में यह परिणामसूचक रचना स्वाभाविक है और उसी कारणात्मक भाव को रखती है।
- source_word: ἀδελφοῖς
  choice: भाइयों
  rationale: ग्रीक में पुल्लिंग बहुवचन रूप है, इसलिए मुख्य पाठ में स्रोत-सदृश ‘भाइयों’ रखा गया है। प्रसंग में इसके व्यापक, स्त्री-पुरुष दोनों को समेटने वाले संभावित अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: गैर-यहूदियों के संबंध में ἐπιστροφή का अर्थ
  choice: मन-फिराव
  alternative: मुड़ना / परिवर्तन
  rationale: पद सुसमाचार के प्रत्युत्तर में गैर-यहूदियों के धार्मिक दिशा-परिवर्तन का समाचार देता है। ‘मन-फिराव’ इस अर्थ को व्यक्त करता है, पर पाठ में निहित से अधिक विकसित धर्मसैद्धान्तिक परिभाषा नहीं जोड़ता। अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- issue: मिश्रित विश्वासी समुदाय में ἀδελφοί का अर्थ
  choice: भाइयों
  alternative: भाइयों और बहनों / सभी विश्वासियों
  rationale: मुख्य पाठ में व्याकरणिक पुल्लिंग रूप सुरक्षित रखा गया है। चूँकि प्रारम्भिक मसीही समुदाय के ऐसे प्रयोग में स्त्रियाँ भी सम्मिलित हो सकती हैं, समावेशी संदर्भ को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘गैर-यहूदी’ सामान्य पाठक के लिए सहज है, जबकि ‘मन-फिराव’ मूल के धार्मिक दिशा-परिवर्तन को संक्षेप में सुरक्षित रखता है। लंबे यूनानी वाक्य को दो हिंदी वाक्यों में बाँटा गया है, जिससे यात्रा और मार्ग में जारी वर्णन का क्रम स्पष्ट होता है।
