  text: ποιήσαντες δὲ χρόνον ἀπελύθησαν μετ’ εἰρήνης ἀπὸ τῶν ἀδελφῶν πρὸς τοὺς ⸂ἀποστείλαντας αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/033.yaml
  text: And after spending some time there[a], they were sent off in peace from the brothers to those who had sent them.
translation:
  language: hi
  text: कुछ समय वहाँ बिताने के बाद, भाइयों[a] ने उन्हें शांति के साथ उन लोगों के पास विदा किया जिन्होंने उन्हें भेजा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयों’ के लिए अथवा ‘भाइयों और बहनों’; यूनानी में ‘भाइयों’ है, पर इस प्रसंग में सम्भवतः पूरा विश्वासी समुदाय अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες ... χρόνον
  choice: कुछ समय वहाँ बिताने के बाद
  rationale: यूनानी मुहावरे का अर्थ किसी स्थान पर कुछ समय बिताना या ठहरना है। ‘वहाँ’ मूल में स्पष्ट नहीं है, पर सन्दर्भ में अन्ताकिया के ठहराव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ
  choice: अलग संयोजक के बिना वाक्य-क्रम
  rationale: यह हल्का कथात्मक संयोजक है। हिन्दी में पूर्ववर्ती प्रसंग से क्रम स्वतः स्पष्ट है; ‘और’ जोड़ना अनावश्यक और कुछ अस्वाभाविक लगता है।
- source_word: ἀπελύθησαν
  choice: विदा किया
  rationale: यहाँ अर्थ प्रतिनिधियों को समुदाय द्वारा सद्भावपूर्वक रवाना करने का है; ‘छोड़ दिया’ या ‘मुक्त किया’ गलत बोध करा सकता है।
- source_word: μετ’ εἰρήνης
  choice: शान्ति के साथ
  rationale: यह विदाई के समय शान्ति और सद्भाव को व्यक्त करने वाला पारम्परिक वाक्यांश है; अनावश्यक रूप से ‘आशीष’ शब्द नहीं जोड़ा गया।
- source_word: ἀπὸ τῶν ἀδελφῶν
  choice: भाइयों ने
  rationale: यूनानी में कर्तृवाचक कर्मवाच्य संरचना है, जिसे स्वाभाविक हिन्दी के लिए कर्तृवाच्य बनाया गया है। ‘भाइयों’ मूल के पुल्लिंग बहुवचन रूप को सुरक्षित रखता है, जबकि समावेशी सामुदायिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: πρὸς τοὺς ἀποστείλαντας αὐτούς
  choice: उन लोगों के पास ... जिन्होंने उन्हें भेजा था
  rationale: संज्ञीकृत कृदन्त उन लोगों को दर्शाता है जिन्होंने पहले उन्हें भेजा था। ‘वापस’ प्रसंग से सम्भव है, पर मूल में स्पष्ट न होने के कारण नहीं जोड़ा गया।
theological_decisions:
- issue: ἀδελφοί का समावेशी अर्थ
  choice: भाइयों
  alternative: भाइयों और बहनों / विश्वासियों
  rationale: मूल यूनानी रूप पुल्लिंग बहुवचन है, इसलिए मुख्य पाठ में ‘भाइयों’ रखा गया है; इस प्रसंग में पूरे विश्वासी समुदाय की सम्भावित समावेशी ओर पादटिप्पणी संकेत करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। स्वाभाविकता के लिए यूनानी कर्मवाच्य को हिन्दी कर्तृवाच्य में बदला गया है; अर्थ और सहभागियों की भूमिकाएँ सुरक्षित हैं।
