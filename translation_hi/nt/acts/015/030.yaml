source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν ἀπολυθέντες ⸀κατῆλθον εἰς Ἀντιόχειαν, καὶ συναγαγόντες τὸ πλῆθος ἐπέδωκαν τὴν ἐπιστολήν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/030.yaml
  text: So[a], after being sent off, they went down to Antioch, and after gathering the multitude[c][b], they delivered the letter.
translation:
  language: hi
  text: इस प्रकार विदा किए जाने के बाद वे नीचे उतरकर अन्ताकिया गए,[a] और जनसमूह को इकट्ठा करके उन्होंने पत्र सौंप दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नीचे उतरकर” यूनानी क्रिया की दिशात्मकता को दर्शाता है—सम्भवतः ऊँचाई पर स्थित यरूशलेम से अन्ताकिया की ओर।
    reason: cultural_note
  - marker: b
    text: “जनसमूह” का अनुवाद “सभा” या “समुदाय” भी किया जा सकता है। यहाँ आशय अन्ताकिया में इकट्ठे हुए समूह से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολυθέντες
  choice: विदा किए जाने के बाद
  rationale: यह कर्मवाच्य कृदन्त औपचारिक रूप से विदा किए या भेजे जाने का भाव देता है; सन्दर्भ में ‘विदा किए जाने’ से अर्थ स्वाभाविक रहता है और ‘मुक्त किए जाने’ का अनचाहा बन्धन-संबंधी भाव नहीं आता।
- source_word: κατῆλθον
  choice: नीचे गए
  rationale: क्रिया के दिशात्मक अर्थ को सुरक्षित रखता है, सम्भवतः ऊँचाई पर स्थित यरूशलेम से अन्ताकिया की ओर उतरने के संकेत के साथ।
- source_word: συναγαγόντες
  choice: इकट्ठा करके
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की क्रिया दर्शाता है; यह हिन्दी में क्रम को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ πλῆθος
  choice: पूरी सभा
  rationale: यहाँ वाक्यांश अन्ताकिया में एकत्र विश्वासियों के समुदाय की ओर संकेत करता है। ‘पूरी सभा’ सामान्य पाठक के लिए स्वाभाविक है और ‘भीड़’ की आकस्मिकता से बचता है, यद्यपि यूनानी में समूह के स्वरूप की कुछ व्यापकता बनी रहती है।
- source_word: ἐπέδωκαν
  choice: सौंप दिया
  rationale: पत्र को उपस्थित समूह के हाथ औपचारिक रूप से देने का भाव स्पष्ट करता है।
- source_word: ἐπιστολήν
  choice: पत्र
  rationale: यह आधुनिक हिन्दी का सहज और सटीक समतुल्य है; ‘पत्री’ की अपेक्षा कम पारिभाषिक है।
theological_decisions:
- issue: τὸ πλῆθος से अभिप्रेत समूह का स्वरूप
  choice: पूरी सभा
  alternative: समूचे समुदाय / भीड़
  rationale: सन्दर्भ विश्वासियों की एकत्र मंडली का है, पर यूनानी शब्द अपने आप में किसी विशिष्ट कलीसियाई पदावली को अनिवार्य नहीं करता। इसलिए मुख्य पाठ में सहज ‘सभा’ रखा गया और विकल्प पादटिप्पणी में बताए गए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किन्तु सरल वाक्य-विन्यास। ‘विदा किए जाने’, ‘नीचे गए’ और ‘सौंप दिया’ द्वारा मूल की क्रमिकता और औपचारिकता सुरक्षित रखी गई है।
