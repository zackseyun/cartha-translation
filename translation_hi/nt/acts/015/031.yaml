  text: And when they had read it[a], they rejoiced because of its encouragement.
translation:
  language: hi
  text: जब उन्होंने वह पत्र पढ़ा, तो उसके प्रोत्साहन के कारण वे आनन्दित हुए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस प्रोत्साहन पर आनन्दित हुए।” यहाँ “प्रोत्साहन” का अनुवाद “आग्रह” या “सांत्वना” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνόντες
  choice: जब उन्होंने वह पत्र पढ़ा
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई क्रिया बताता है। यूनानी में कर्म निहित है; पिछले पद से स्पष्ट है कि वह पत्र है, इसलिए हिन्दी में स्वाभाविक स्पष्टता के लिए ‘वह पत्र’ जोड़ा गया है।
- source_word: δὲ
  choice: तो
  rationale: δέ यहाँ हल्का कथात्मक संबंध दिखाता है। ‘जब…तो’ की हिन्दी संरचना क्रम और संबंध को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἐχάρησαν
  choice: आनन्दित हुए
  rationale: χαίρω का यह रूप सक्रिय अर्थ रखता है। ‘आनन्दित हुए’ मूल के भावात्मक बल को गरिमापूर्ण और सहज हिन्दी में बनाए रखता है।
- source_word: ἐπὶ
  choice: से
  rationale: दत्तिव के साथ ἐπί यहाँ आनन्द के आधार या कारण को सूचित करता है। हिन्दी में ‘प्रोत्साहन से आनन्दित हुए’ इस कारणात्मक संबंध को सहजता से व्यक्त करता है।
- source_word: τῇ παρακλήσει
  choice: उसके प्रोत्साहन
  rationale: παράκλησις का अर्थ प्रसंगानुसार प्रोत्साहन, आग्रह या सांत्वना हो सकता है। यहाँ पत्र ने विश्वासियों को आश्वस्त और दृढ़ किया, इसलिए ‘प्रोत्साहन’ उपयुक्त है; ‘उसके’ से पत्र के साथ संबंध स्पष्ट होता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण वाक्य रखा गया है। ‘वह पत्र’ प्रसंग से पूरित कर्म है। παράκλησις की अर्थ-व्याप्ति को मुख्य पाठ में एक स्वाभाविक विकल्प और पादटिप्पणी में अन्य संभावनाओं सहित सुरक्षित रखा गया है।
