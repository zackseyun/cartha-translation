  text: And the whole assembly fell silent[a], and they listened to Barnabas and Paul as they related what signs and wonders God had done among the Gentiles through them.
translation:
  language: hi
  text: तब पूरी सभा चुप हो गई और बरनबास तथा पौलुस को सुनने लगी। वे उन सब चिन्हों और अद्भुत कार्यों का वर्णन कर रहे थे जो परमेश्वर ने उनके द्वारा गैर-यहूदियों[a] के बीच किए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राष्ट्रों के बीच।” इस प्रसंग में यह शब्द गैर-यहूदियों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐσίγησεν
  choice: चुप हो गई
  rationale: अओरिस्ट क्रिया सभा के मौन होने की घटना बताती है; यह सहज आधुनिक हिन्दी में आरंभिक/घटनात्मक भाव बनाए रखता है।
- source_word: πᾶν τὸ πλῆθος
  choice: पूरी सभा
  rationale: यरूशलेम में विचार-विमर्श के लिए एकत्र समुदाय के संदर्भ में ‘सभा’ उपयुक्त है और ‘भीड़’ से अधिक सटीक है।
- source_word: ἤκουον
  choice: सुनने लगी
  rationale: इम्परफेक्ट रूप लगातार और ध्यानपूर्वक सुनने को दर्शाता है; ‘लगी’ कथा में उस जारी क्रिया का आरंभ और प्रवाह स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Βαρναβᾶ καὶ Παύλου
  choice: बरनबास तथा पौलुस
  rationale: नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं।
- source_word: ἐξηγουμένων
  choice: वे बता रहे थे
  rationale: यह विस्तृत वृत्तांत सुनाने या वर्णन करने का भाव देता है; ‘समझा रहे थे’ अनावश्यक रूप से व्याख्या का अर्थ जोड़ सकता है।
- source_word: ὅσα
  choice: कितने
  rationale: चिह्नों और अद्भुत कामों की बहुलता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी व्यापक और अस्पष्ट कर्म-समूह को जोड़ने के।
- source_word: ἐποίησεν ὁ θεὸς
  choice: परमेश्वर ने ... किए थे
  rationale: परमेश्वर को क्रिया का कर्ता बनाए रखता है; पूर्वपूर्ण काल उनके द्वारा सुनाए जा रहे पहले के कार्यों को स्पष्ट करता है।
- source_word: σημεῖα καὶ τέρατα
  choice: चिह्न और अद्भुत काम
  rationale: लूका के प्रचलित युग्म के दोनों तत्व अलग रखता है और ‘चमत्कारी’ जैसा अतिरिक्त विशेषण नहीं जोड़ता।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: गैर-यहूदियों के बीच
  rationale: यरूशलेम सभा के संदर्भ में शब्द विशेष रूप से गैर-यहूदी लोगों को सूचित करता है। यह आधुनिक पाठकों के लिए ‘अन्यजातियों’ से अधिक तत्काल स्पष्ट है; व्यापक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: δι’ αὐτῶν
  choice: उनके द्वारा
  rationale: 'διά के साधनवाचक भाव को रखता है: मुख्य कर्ता परमेश्वर हैं और बरनबास तथा पौलुस उनके माध्यम हैं।'
theological_decisions:
- issue: प्रेरिताई सेवा में परमेश्वर की कर्तृता
  choice: चिह्न और अद्भुत काम करने वाले मुख्य कर्ता परमेश्वर हैं; वे बरनबास और पौलुस के द्वारा कार्य करते हैं।
  alternative: बरनबास और पौलुस को इन कामों का मुख्य कर्ता समझना।
  rationale: यूनानी वाक्य में ὁ θεὸς, ἐποίησεν का कर्ता है और δι’ αὐτῶν बरनबास तथा पौलुस को माध्यम के रूप में दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। दो छोटे वाक्यों का प्रयोग हिन्दी में कर्ताओं को स्पष्ट करता है। ‘गैर-यहूदी’ प्रसंगगत अर्थ को सामान्य पाठक के लिए सीधे व्यक्त करता है, जबकि यूनानी शब्द का व्यापक अर्थ पादटिप्पणी में दिया गया है।
