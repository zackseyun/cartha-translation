source:
  edition: SBLGNT
  text: νῦν οὖν τί πειράζετε τὸν θεόν, ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον τῶν μαθητῶν ὃν οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς ἰσχύσαμεν βαστάσαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/010.yaml
  text: Now then[c][b][a], why are you testing God by putting a yoke on the neck of the disciples that neither our fathers nor we have been able to bear?
translation:
  language: hi
  text: तो अब, चेलों की गर्दन पर ऐसा जूआ[b] रखकर तुम परमेश्वर की परीक्षा क्यों ले रहे हो[a]—ऐसा जूआ जिसे न तो हमारे पुरखे[c] उठा सके, न हम?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम परमेश्वर को क्यों परख रहे हो?”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “जूआ” थोपी गई बाध्यता का रूपक है; प्रसंग में इसका संबंध चेलों पर रखी जा रही मांगों से है।
    reason: cultural_note
  - marker: c
    text: या, “हमारे पूर्वज।”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν οὖν
  choice: तो अब
  rationale: यह पदबंध निष्कर्ष और प्रसंग-परिवर्तन दोनों का संकेत देता है; ‘तो अब’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τί πειράζετε τὸν θεόν
  choice: परमेश्वर को क्यों परख रहे हो
  rationale: πειράζω यहाँ परमेश्वर को परीक्षा में डालने या उसकी इच्छा को चुनौती देने के अर्थ में है; प्रश्न की वाग्मयात्मक तीव्रता सुरक्षित रखी गई है।
- source_word: ἐπιθεῖναι ζυγὸν ἐπὶ τὸν τράχηλον
  choice: गर्दन पर ... जूआ रखकर
  rationale: मूल पाठ के सजीव रूपक को बनाए रखते हुए infinitive की रीति/साधन-सूचक भूमिका को ‘रखकर’ से व्यक्त किया गया है।
- source_word: τῶν μαθητῶν
  choice: चेलों की
  rationale: प्रेरितों के काम में μαθητής के लिए प्रचलित, सहज और सुसंगत हिन्दी शब्द ‘चेला’ है।
- source_word: οὔτε οἱ πατέρες ἡμῶν οὔτε ἡμεῖς
  choice: न हमारे पुरखे ... और न हम
  rationale: πατέρες यहाँ पिछली पीढ़ियों के पूर्वजों को सूचित करता है; ‘पुरखे’ स्वाभाविक हिन्दी है और ऐतिहासिक आशय स्पष्ट रखता है।
- source_word: ἰσχύσαμεν βαστάσαι
  choice: उठा सके
  rationale: क्षमता और जूए का भार उठाने—दोनों भावों को संक्षेप तथा स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘जूआ’ रूपक का आशय
  choice: रूपक को बिना संकीर्ण व्याख्या के बनाए रखा गया है।
  alternative: इसे स्पष्ट रूप से पूरी मूसा की व्यवस्था, या केवल खतना और उससे जुड़ी मांगें कहना।
  rationale: निकटवर्ती प्रसंग गैर-यहूदी विश्वासियों पर रखी जा रही मांगों से संबंधित है, पर यह पद स्वयं ‘जूआ’ रूपक के दायरे को और संकीर्ण नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘जूआ’ और ‘गर्दन’ की मूल छवि सुरक्षित है; ‘पुरखे’ सामान्य पाठक के लिए ‘पितरों’ की अपेक्षा अधिक सहज है।
