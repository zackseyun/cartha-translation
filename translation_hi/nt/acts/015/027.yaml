  rationale: वर्तमान कृदंत यहाँ भेजे गए व्यक्तियों के आगामी कार्य को बताता है; हिन्दी में भविष्यकालीन सीमित क्रिया अधिक स्वाभाविक है।
- source_word: τὰ αὐτά
