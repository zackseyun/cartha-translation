  text: Μετὰ ταῦτα ἀναστρέψω καὶ ἀνοικοδομήσω τὴν σκηνὴν Δαυὶδ τὴν πεπτωκυῖαν καὶ τὰ ⸀κατεσκαμμένα αὐτῆς ἀνοικοδομήσω καὶ ἀνορθώσω αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/016.yaml
  text: After these things I will return[a], and I will rebuild the fallen tent of David; I will rebuild its ruins, and I will restore it[b],
translation:
  language: hi
  text: इन बातों के बाद मैं लौटूँगा और दाऊद के गिरे हुए तंबू[a] को फिर बनाऊँगा; उसके ढहे हुए भागों को फिर बनाऊँगा और उसे फिर खड़ा करूँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र-स्थान का तंबू।’ यूनानी शब्द का अर्थ ‘तंबू’ या ‘तम्बू/मंडप’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘दाऊद का तंबू’ एक भविष्यद्वाणी का रूपक है, जो दाऊद की वंश-रेखा या राज्य से जुड़ी पुनर्स्थापना की ओर संकेत करता है।
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: इन बातों के बाद
  rationale: यह बहुवचन संकेतवाचक पद और उद्धरण के कालगत संक्रमण—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀναστρέψω
  choice: मैं लौटूँगा
  rationale: इस प्रसंग में क्रिया का अर्थ वापस आने या लौटने का है; प्रथम पुरुष में परमेश्वर की प्रतिज्ञा को यथावत रखा गया है।
- source_word: ἀνοικοδομήσω
  choice: फिर बनाऊँगा
  rationale: क्रिया किसी चीज़ को दोबारा बनाने का बोध देती है। ‘फिर बनाऊँगा’ आधुनिक हिन्दी में सहज है और पुनर्स्थापना की छवि बनाए रखता है।
- source_word: σκηνὴν Δαυὶδ
  choice: दाऊद के ... तंबू
  rationale: σκηνή का मूल अर्थ ‘तंबू’ है और प्रसंग में इसे रूपक के रूप में बनाए रखना उचित है; ‘दाऊद का घराना’ कहना अर्थ की व्याख्या को सीधे मुख्य पाठ में रख देता।
- source_word: τὴν πεπτωκυῖαν
  choice: गिरे हुए
  rationale: पूर्णकालिक कृदंत गिरने से उत्पन्न वर्तमान दशा बताता है; ‘गिरे हुए’ इस दशा को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὰ κατεσκαμμένα αὐτῆς
  choice: उसके ढहे हुए भागों
  rationale: नपुंसकलिंग बहुवचन कृदंत उन हिस्सों का बोध देता है जो गिरा या ढहा दिए गए हैं। यह अनुवाद सामूहिक अर्थ को ‘खंडहर’ की अपेक्षा संरचना के भागों के रूप में स्पष्ट रखता है।
- source_word: ἀνορθώσω
  choice: उसे फिर खड़ा करूँगा
  rationale: क्रिया का मूल चित्र सीधा करने या दोबारा खड़ा करने का है। यह ‘पुनर्स्थापित करूँगा’ की तुलना में भौतिक रूपक को अधिक स्पष्टता से बचाए रखता है।
- source_word: αὐτήν
  choice: उसे
  rationale: सर्वनाम का संदर्भ ‘तंबू’ से है; हिन्दी में ‘उसे’ स्वाभाविक और संदर्भानुकूल है।
theological_decisions:
- issue: ‘दाऊद के तंबू’ की रूपकात्मक शक्ति
  choice: मुख्य पाठ में ‘दाऊद के तंबू’ का रूपक बनाए रखा गया है।
  alternative: ‘दाऊद का घराना’, ‘दाऊद का गिरा हुआ राजवंश’ या ‘दाऊद का राज्य’
  rationale: भविष्यद्वाणी का यह चित्र दाऊद से जुड़ी राजकीय वंश-रेखा या राज्य की बहाली की ओर संकेत कर सकता है, पर यूनानी पाठ स्वयं इसकी व्याख्या खोलकर नहीं करता। इसलिए मुख्य पाठ में रूपक और उसकी धर्मवैचारिक व्यापकता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘फिर बनाऊँगा’ और ‘फिर खड़ा करूँगा’ पुनर्निर्माण की क्रमिक तथा दृश्यात्मक समानता को बनाए रखते हैं; रूपक की व्याख्या मुख्य पाठ में थोपने के बजाय पादटिप्पणी में दी गई है।
