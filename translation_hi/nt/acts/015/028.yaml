  text: ἔδοξεν γὰρ τῷ ⸂πνεύματι τῷ ἁγίῳ⸃ καὶ ἡμῖν μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν ⸂τούτων τῶν ἐπάναγκες⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/028.yaml
  text: For it seemed good to the Holy Spirit and to us to place on you no greater burden than these necessary things:[a][b]
translation:
  language: hi
  text: क्योंकि पवित्र आत्मा को और हमें यह उचित जान पड़ा[a] कि आप पर इन आवश्यक बातों[b] के सिवा कोई और बोझ न डालें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र आत्मा और हमने यह निर्णय किया।” यूनानी मुहावरा औपचारिक निर्णय-सूत्र के रूप में भी अनूदित किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “इन अनिवार्य बातों” अथवा “इन आवश्यक अपेक्षाओं”।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοξεν
  choice: उचित जान पड़ा
  rationale: यह यूनानी निर्णय-सूचक मुहावरे के विचार-विमर्श और अनुमोदन, दोनों भावों को स्वाभाविक व गरिमापूर्ण हिन्दी में रखता है; इसे केवल निजी राय के रूप में प्रस्तुत नहीं करता।
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: पवित्र आत्मा को
  rationale: सम्प्रदान कारक ἔδοξεν के साथ जुड़ता है। यह हिन्दी में मानक पद है और आत्मा की व्यक्तिगत भूमिका को बनाए रखता है।
- source_word: καὶ ἡμῖν
  choice: और हमें
  rationale: यह ‘पवित्र आत्मा को’ के समानान्तर सम्प्रदान रूप को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: μηδὲν πλέον
  choice: कोई और
  rationale: βάρος के साथ यह निर्दिष्ट बातों से आगे कोई अतिरिक्त बोझ न रखने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπιτίθεσθαι
  choice: डालें
  rationale: ‘बोझ डालना’ वर्तमान हिन्दी में स्वाभाविक मुहावरा है और मूल के रखने/लादने के रूपक को बनाए रखता है।
- source_word: ὑμῖν
  choice: आप पर
  rationale: यह बोझ पाने वालों को स्पष्ट करता है और आदरपूर्ण बहुवचन सम्बोधन देता है।
- source_word: βάρος
  choice: बोझ
  rationale: यह दायित्वों के लिए प्रयुक्त मूल रूपक का सीधा और प्रचलित हिन्दी समतुल्य है।
- source_word: πλὴν
  choice: के सिवा
  rationale: नकारात्मक कथन के बाद यह अपवाद को स्पष्ट और सहज रूप से प्रस्तुत करता है।
- source_word: τούτων τῶν ἐπάναγκες
  choice: इन आवश्यक बातों
  rationale: यह अगले पद में आने वाले विशेष निर्देशों की ओर संकेत करता है और उनकी प्रकृति की अतिरिक्त व्याख्या किए बिना मूल के निकट रहता है।
theological_decisions:
- issue: पवित्र आत्मा और सभा के निर्णय का सम्बन्ध
  choice: ‘पवित्र आत्मा को और हमें यह उचित जान पड़ा’
  alternative: ‘पवित्र आत्मा और हमने यह निर्णय किया’
  rationale: चुना हुआ रूप आत्मा और प्रेरितीय सभा की संयुक्त स्वीकृति तथा आत्मा की व्यक्तिगत भूमिका को बनाए रखता है, पर यूनानी मुहावरे को आवश्यकता से अधिक कठोर निर्णय-वाक्य में नहीं बदलता।
- issue: गैर-यहूदी विश्वासियों पर निर्णय का प्रभाव
  choice: निर्दिष्ट आवश्यक बातों के अतिरिक्त कोई और बोझ न डालना
  alternative: सभी दायित्वों का निषेध, अथवा मूसा की पूरी व्यवस्था का आरोपण
  rationale: यह पद के सीमित दायरे को सुरक्षित रखता है और व्यवस्था तथा अनुग्रह के विषय में बाद की किसी धर्मवैज्ञानिक प्रणाली को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण बहुवचन ‘आप’ और गरिमापूर्ण किन्तु सहज वाक्य-विन्यास अपनाया गया है। ‘उचित जान पड़ा’ deliberative निर्णय-सूत्र को सुरक्षित रखता है; ‘बोझ डालना’ मूल रूपक को स्वाभाविक हिन्दी में व्यक्त करता है।
