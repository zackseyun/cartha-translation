  edition: SBLGNT
  text: ἀλλὰ ἐπιστεῖλαι αὐτοῖς τοῦ ⸀ἀπέχεσθαι τῶν ἀλισγημάτων τῶν εἰδώλων καὶ τῆς πορνείας καὶ ⸀τοῦ πνικτοῦ καὶ τοῦ αἵματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/020.yaml
  text: but to write to them to abstain from the pollutions of idols[a], and from sexual immorality, and from what has been strangled[c][b], and from blood.
translation:
  language: hi
  text: बल्कि उन्हें लिखना चाहिए कि वे मूर्तियों से जुड़ी अशुद्धताओं[a], यौन अनैतिकता[b], गला घोंटे हुए पशु के मांस[c] और लहू से दूर रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मूर्तियों के कारण होने वाली अशुद्धताओं।’ कुछ अनुवाद इसे ‘मूर्तियों को चढ़ाया हुआ भोजन’ तक सीमित करते हैं, पर यहाँ प्रयुक्त यूनानी अभिव्यक्ति अधिक व्यापक है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का अर्थ व्यापक रूप से यौन अनैतिकता हो सकता है; कुछ लोग यहाँ इसे विशेष रूप से निषिद्ध यौन संबंधों के लिए प्रयुक्त मानते हैं।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से ‘गला घोंटा हुआ’; आशय ऐसे पशु के मांस से है जिसका लहू ठीक तरह से नहीं निकाला गया था।
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιστεῖλαι
  choice: लिखें
  rationale: यरूशलेम सभा के पत्र के संदर्भ में यह लिखित निर्देश भेजने को व्यक्त करता है; ‘लिखें’ स्वाभाविक और संक्षिप्त है।
- source_word: ἀπέχεσθαι
  choice: दूर रहें
  rationale: मध्यवाच्य रूप का अर्थ किसी वस्तु से अपने को अलग रखना या परहेज़ करना है; ‘दूर रहें’ सामान्य आधुनिक हिन्दी में स्पष्ट है और पूरी सूची पर लागू होता है।
- source_word: ἀλισγημάτων τῶν εἰδώλων
  choice: मूर्तियों से जुड़ी अशुद्धताओं
  rationale: ἀλίσγημα धार्मिक या संस्कारगत अशुद्धि को सूचित करता है। यह अनुवाद यूनानी पद की व्यापकता बचाता है और उसे केवल मूर्तियों को चढ़ाए भोजन तक सीमित नहीं करता।
- source_word: πορνείας
  choice: यौन अनैतिकता
  rationale: यह व्यापक यौन दुराचार को व्यक्त करता है और संदर्भ में सम्भव अधिक विशिष्ट अर्थ—निषिद्ध यौन संबंध—को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τοῦ πνικτοῦ
  choice: गला घोंटे हुए पशु के मांस
  rationale: शाब्दिक अर्थ ‘गला घोंटा हुआ’ है। हिन्दी में आशय स्पष्ट करने के लिए ‘पशु के मांस’ जोड़ा गया है, क्योंकि संदर्भ ऐसे पशु का मांस खाने से है जिसका लहू ठीक से नहीं निकला।
- source_word: τοῦ αἵματος
  choice: लहू
  rationale: मूल में संक्षिप्त रूप से ‘लहू’ है। ‘लहू’ बाइबलीय संदर्भ में स्वाभाविक, गरिमापूर्ण और साधारण पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: मूर्ति-संबंधी निषेध का दायरा
  choice: मूर्तियों से जुड़ी अशुद्धताओं
  alternative: मूर्तियों को चढ़ाया हुआ भोजन
  rationale: यहाँ यूनानी अभिव्यक्ति εἰδωλόθυτα नहीं बल्कि व्यापक ἀλισγημάτων τῶν εἰδώλων है; इसलिए पाठ को केवल बलि के भोजन तक सीमित नहीं किया गया।
- issue: πορνεία का आशय
  choice: यौन अनैतिकता
  alternative: निषिद्ध यौन संबंध
  rationale: शब्द व्यापक यौन अनैतिकता बता सकता है, जबकि कुछ लोग इस प्रसंग में इसे विशेष रूप से निषिद्ध संबंधों के अर्थ में लेते हैं। मुख्य पाठ इस प्रश्न का निर्णय नहीं करता।
- issue: सूचीबद्ध निषेधों की अवधि और धार्मिक स्थिति
  choice: सिर्फ निषेधों को ज्यों का त्यों प्रस्तुत किया गया
  alternative: इन्हें अस्थायी सहभोज नियम या सभी विश्वासियों के लिए स्थायी आदेश बताना
  rationale: पद स्वयं इन आदेशों की अवधि अथवा पूर्ण धर्मवैज्ञानिक आधार स्पष्ट नहीं करता, इसलिए अनुवाद किसी साम्प्रदायिक निष्कर्ष को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘अशुद्धताओं’ से संस्कारगत और धार्मिक संदर्भ बना रहता है; ‘यौन अनैतिकता’ पुरातन या अत्यधिक संकीर्ण शब्दावली से बचती है। सूची को हिन्दी की स्वाभाविक समानांतर रचना में रखा गया है।
