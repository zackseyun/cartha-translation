source:
  edition: SBLGNT
  text: Συμεὼν ἐξηγήσατο καθὼς πρῶτον ὁ θεὸς ἐπεσκέψατο λαβεῖν ἐξ ἐθνῶν ⸀λαὸν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/014.yaml
  text: Simeon has recounted how God first visited the Gentiles to take from them a people for his name[a][b][c].
translation:
  language: hi
  text: सिमेओन[a] ने बताया है कि परमेश्वर ने पहली बार गैर-यहूदियों[b] की सुधि ली, ताकि उनमें से अपने नाम के लिए एक प्रजा लेने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “साइमन।” यहाँ याकूब अधिक परिचित ‘साइमन’ के बजाय ‘सिमेओन’ रूप का प्रयोग करता है।
    reason: lexical_alternative
  - marker: b
    text: अथवा, “जातियों में से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συμεὼν
  choice: शिमोन
  rationale: मूल पाठ में आए विशिष्ट रूप ‘सिमेओन/शिमोन’ को अधिक परिचित ‘साइमन’ से समरूप किए बिना सुरक्षित रखा गया है; ‘शिमोन’ हिन्दी में स्वाभाविक बाइबिलीय रूप है।
- source_word: ἐξηγήσατο
  choice: ने बताया है
  rationale: क्रिया सभा के सामने अभी दिए गए वृत्तांत का सार बताती है। ‘बताया है’ आधुनिक हिन्दी में स्वाभाविक है और हाल में संपन्न कथन का वर्तमान प्रसंग से संबंध बनाए रखता है।
- source_word: καθὼς
  choice: कि ... कैसे
  rationale: यहाँ शब्द बताए गए वृत्तांत की विषयवस्तु और रीति को प्रस्तुत करता है; हिन्दी में ‘कि ... कैसे’ इस संबंध को सहजता से व्यक्त करता है।
- source_word: πρῶτον
  choice: पहली बार
  rationale: यह गैर-यहूदियों की ओर परमेश्वर के इस कार्य के आरंभिक अवसर को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπεσκέψατο
  choice: की सुधि ली
  rationale: यह केवल देखने नहीं, बल्कि सरोकार के साथ ध्यान देने और उद्देश्यपूर्ण हस्तक्षेप करने का भाव रखता है। ‘सुधि ली’ उस कृपालु भेंट/ध्यान के बाइबिलीय भाव को हिन्दी में स्वाभाविक रूप से संप्रेषित करता है।
- source_word: λαβεῖν
  choice: ले
  rationale: उद्देश्यसूचक क्रिया को सीधे ‘ले’ से व्यक्त किया गया है; ‘चुन ले’ या ‘बना ले’ कहने से बचा गया है क्योंकि वे मूल से अधिक व्याख्या जोड़ते हैं।
- source_word: ἐξ ἐθνῶν
  choice: गैर-यहूदियों ... में से
  rationale: प्रेरितों के काम 15 के प्रसंग में यह गैर-यहूदी लोगों को सूचित करता है। ‘गैर-यहूदी’ सामान्य आधुनिक पाठक के लिए स्पष्ट है, जबकि ‘में से’ स्रोत के ἐξ को बनाए रखता है।
- source_word: λαὸν
  choice: एक प्रजा
  rationale: ‘प्रजा’ परमेश्वर से संबंधित सामूहिक जन का भाव रखती है और इसे केवल जातीय जनसमूह तक सीमित नहीं करती।
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: अपने नाम के लिए
  rationale: यह स्रोत की वाचा-संबंधी बाइबिलीय अभिव्यक्ति को सुरक्षित रखता है और इसे केवल ‘अपने लिए’ कहकर सपाट नहीं करता।
theological_decisions:
- issue: ἐξ ἐθνῶν को ‘गैर-यहूदी’ या ‘जातियाँ’ कहना
  choice: गैर-यहूदी
  alternative: जातियों में से
  rationale: तात्कालिक प्रसंग परमेश्वर की प्रजा में गैर-यहूदियों के सम्मिलित होने का है। मुख्य पाठ में ‘गैर-यहूदी’ यहूदी–गैर-यहूदी भेद को स्पष्ट करता है, और वैकल्पिक शाब्दिक रूप पादटिप्पणी में रखा गया है।
- issue: τῷ ὀνόματι αὐτοῦ को ‘अपने नाम के लिए’ या ‘अपने लिए’ कहना
  choice: अपने नाम के लिए
  alternative: अपने लिए
  rationale: ‘अपने नाम के लिए’ मूल की अर्थगर्भित वाचा-संबंधी भाषा और उससे जुड़ी पहचान व स्वामित्व—दोनों को खुला रखता है; ‘अपने लिए’ उस तनाव को समय से पहले सरल कर देता।
- issue: ἐπεσκέψατο में दैवी भेंट अथवा कृपालु ध्यान का भाव
  choice: की सुधि ली
  alternative: भेंट की
  rationale: हिन्दी में ‘भेंट की’ केवल मिलने का सीमित अर्थ दे सकती है। ‘सुधि ली’ सरोकार और उद्देश्यपूर्ण दैवी पहल को व्यक्त करती है, पर उसे किसी विशिष्ट धार्मिक सिद्धांत में नहीं बाँधती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘गैर-यहूदी’ सामान्य पाठक के लिए स्पष्ट है; ‘प्रजा’ और ‘अपने नाम के लिए’ मूल की बाइबिलीय तथा वाचा-संबंधी गूँज को बनाए रखते हैं।
