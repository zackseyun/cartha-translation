source:
  edition: SBLGNT
  text: ἐξανέστησαν δέ τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες, λέγοντες ὅτι δεῖ περιτέμνειν αὐτοὺς παραγγέλλειν τε τηρεῖν τὸν νόμον Μωϋσέως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/005.yaml
  text: But some of those from the party of the Pharisees who had believed stood up[a], saying that it is necessary to circumcise them and to command them to keep the law of Moses.
translation:
  language: hi
  text: परन्तु फ़रीसियों के दल[a] में से कुछ लोग, जिन्होंने विश्वास किया था, उठ खड़े हुए और कहने लगे, “उनका खतना करना और उन्हें मूसा की व्यवस्था का पालन करने की आज्ञा देना आवश्यक है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दल” के स्थान पर “पंथ” भी सम्भव है। यहाँ यूनानी शब्द किसी मान्य समूह या संप्रदाय को दर्शाता है, बाद के तकनीकी अर्थ में “विधर्म” को आवश्यक रूप से नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξανέστησαν
  choice: उठ खड़े हुए
  rationale: सभा में बोलने के लिए उठने की कथात्मक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसमें विरोध या विद्रोह का अतिरिक्त भाव जोड़े।
- source_word: τινες
  choice: कुछ लोग
  rationale: अनिश्चित बहुवचन को सहज हिन्दी में व्यक्त करता है; मूल में निहित न होने वाली अतिरिक्त लैंगिक विशिष्टता नहीं जोड़ता।
- source_word: τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων
  choice: फ़रीसियों के दल में से
  rationale: αἵρεσις यहाँ किसी पहचाने हुए धार्मिक समूह या विचारधारा को सूचित करता है, बाद के तकनीकी अर्थ में विधर्म को नहीं। 'दल' आधुनिक पाठक के लिए स्पष्ट और अपेक्षाकृत तटस्थ है।
- source_word: πεπιστευκότες
  choice: जिन्होंने विश्वास किया था
  rationale: पूर्णकालिक कृदन्त के पूर्व में घटित कार्य और उसके बने हुए परिणाम को सुरक्षित रखता है तथा इस तनाव को नहीं मिटाता कि विश्वास कर चुके ये लोग यह माँग कर रहे थे।
- source_word: λέγοντες
  choice: कहने लगे
  rationale: मुख्य क्रिया के साथ चल रही वाणी को स्वाभाविक हिन्दी कथन-शैली में व्यक्त करता है; 'ज़ोर देकर' जैसा अतिरिक्त स्वर नहीं जोड़ता।
- source_word: δεῖ
  choice: आवश्यक है
  rationale: अनिवार्यता के निर्वैयक्तिक दावे को बनाए रखता है और इस आवश्यकता का स्रोत मूल की तरह अनकहा छोड़ता है।
- source_word: περιτέμνειν αὐτούς
  choice: उनका खतना करना
  rationale: यूनानी सक्रिय अनन्त क्रिया की सीधी और प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: παραγγέλλειν
  choice: आज्ञा देना
  rationale: क्रिया के अधिकारपूर्ण बल को सुरक्षित रखता है; केवल 'समझाना' या 'निर्देश देना' अपेक्षाकृत हल्का होता।
- source_word: τε τηρεῖν
  choice: और ... पालन करने
  rationale: व्यवस्था के निरन्तर अनुपालन या मानने का स्वाभाविक हिन्दी अर्थ देता है।
- source_word: τὸν νόμον Μωϋσέως
  choice: मूसा की व्यवस्था
  rationale: मूल के संबंधकारक पदबंध का सीधा और हिन्दी बाइबलीय प्रयोग में सुबोध रूप है।
theological_decisions:
- issue: यहूदी समूह के संदर्भ में αἵρεσις का अर्थ
  choice: दल
  alternative: पंथ
  rationale: यहाँ शब्द फ़रीसियों के एक मान्य समूह/विचारधारा से संबंध बताता है, बाद के मसीही तकनीकी अर्थ में 'विधर्म' नहीं। 'दल' अनावश्यक नकारात्मक अर्थ से बचता है।
- issue: πεπιστευκότες का कालगत और धर्मवैज्ञानिक बल
  choice: जिन्होंने विश्वास किया था
  alternative: जो विश्वासी थे
  rationale: क्रियात्मक रूप उनके पहले विश्वास करने और वर्तमान में उस अवस्था में होने दोनों को उभारता है तथा उनके विश्वास और उनकी माँग के बीच पाठ में उपस्थित तनाव को सुरक्षित रखता है।
- issue: δεῖ में आवश्यकता का स्रोत
  choice: आवश्यक है
  alternative: उन्हें अवश्य करना चाहिए
  rationale: मूल पाठ आवश्यकता का दावा करता है, पर यह स्पष्ट नहीं करता कि उसे परमेश्वर की प्रत्यक्ष आज्ञा, व्यवस्था की माँग या वक्ताओं की व्याख्या से जोड़ा जाए; अनुवाद इस अस्पष्टता को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। 'फ़रीसी', 'खतना' और 'मूसा की व्यवस्था' जैसे प्रचलित बाइबलीय पद बनाए गए हैं। प्रत्यक्ष कथन से माँग की स्पष्टता बनी रहती है।
