base_translation:
  language: en
  yaml_path: translation/nt/acts/015/023.yaml
  text: 'Having written by their hand: “The apostles and the elder brothers[a], to the brothers from among the Gentiles in Antioch and Syria and Cilicia[c][b], greetings.”'
translation:
  language: hi
  text: 'उन्होंने उनके हाथ यह लिख भेजा: “प्रेरित और पुरनिए भाई[a], अन्ताकिया, सीरिया और किलिकिया में रहनेवाले गैर-यहूदियों में से आए भाइयों[b] को नमस्कार।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पुरनिए भाई” का अनुवाद “पुरनियों और भाइयों” भी किया जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “भाइयों” यहाँ विश्वासी समुदाय के लिए समावेशी रूप से प्रयुक्त हो सकता है, जिसमें स्त्रियाँ भी शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: γράψαντες διὰ χειρὸς αὐτῶν
  choice: उन्होंने उनके हाथ यह लिखकर भेजा
  rationale: यूनानी कृदन्त और ‘उनके हाथ के द्वारा’ मुहावरे—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; आशय है कि पत्र उन्हीं प्रतिनिधियों के हाथ भेजा गया।
- source_word: ἀπόστολοι
  choice: प्रेरितों
  rationale: यरूशलेम के मान्य दूत-अगुवों के लिए प्रचलित और स्पष्ट बाइबिलीय पद।
- source_word: πρεσβύτεροι ἀδελφοὶ
  choice: पुरनिए भाइयों
  rationale: दूसरे पद के पहले पृथक उपपद न होने के कारण ἀδελφοί को πρεσβύτεροι के साथ निकटतः जोड़ता है, बिना उसे निश्चित रूप से तीसरा समन्वित समूह बनाए।
- source_word: τοῖς ἐξ ἐθνῶν
  choice: गैर-यहूदी जातियों में से आए
  rationale: ἐξ की उद्गम-सूचक शक्ति और ἔθνη के इस प्रसंग में गैर-यहूदी समुदायों के अर्थ को स्पष्ट करता है।
- source_word: ἀδελφοῖς
  choice: भाई-बहनों
  rationale: पत्र का संबोधन सम्भवतः पूरी विश्वासी संगति को, स्त्रियों सहित, समेटता है; आधुनिक हिन्दी में यह समावेशी सामुदायिक अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: पत्रारम्भ में यह आनन्दित होने की आज्ञा नहीं, बल्कि परम्परागत अभिवादन है।
- source_word: κατὰ τὴν Ἀντιόχειαν καὶ Συρίαν καὶ Κιλικίαν
  choice: अन्ताकिया, सीरिया और किलिकिया में रहनेवाले
  rationale: κατά यहाँ नामित स्थानों में फैले हुए प्राप्तकर्ताओं का स्थान दर्शाता है; ‘में रहनेवाले’ हिन्दी संबोधन में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: πρεσβύτεροι ἀδελφοὶ में समूहों का संबंध
  choice: प्रेरितों और पुरनिए भाइयों
  alternative: प्रेरितों, पुरनियों और भाइयों
  rationale: यूनानी में ἀδελφοί से पहले दूसरा उपपद नहीं है, इसलिए इसे πρεσβύτεροι से निकटतः जुड़ा पढ़ना अधिक स्वाभाविक है; फिर भी समन्वित तीसरे समूह की प्रचलित व्याख्या पादटिप्पणी में सुरक्षित है।
- issue: मिश्रित विश्वासी समुदाय के लिए ἀδελφοῖς
  choice: भाई-बहनों
  alternative: भाइयों
  rationale: व्याकरणिक रूप पुल्लिंग बहुवचन है, पर पत्र का सामुदायिक संबोधन सम्भवतः स्त्रियों को भी शामिल करता है; हिन्दी में ‘भाई-बहनों’ से सम्भावित समावेशी संदर्भ स्पष्ट होता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक वाचन के योग्य हिन्दी। ‘उनके हाथ’ मूल यूनानी मुहावरे की छवि बनाए रखता है, जबकि ‘भेजा’ उसका आशय स्पष्ट करता है। ‘पुरनिए’ कलीसियाई अगुवों के लिए प्रचलित पद है; ‘भाई-बहनों’ पूरे विश्वासी समुदाय के सम्भावित समावेशी संदर्भ को व्यक्त करता है।
