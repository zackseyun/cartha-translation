id: ACT.15.8
reference: Acts 15:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὁ καρδιογνώστης θεὸς ἐμαρτύρησεν αὐτοῖς ⸀δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/008.yaml
  text: And God[a], who knows the heart, bore witness to them by giving them the Holy Spirit just as he did to us,
translation:
  language: hi
  text: और हृदयों को जानने वाले परमेश्वर ने उन्हें भी हमारी ही तरह पवित्र आत्मा देकर उनके पक्ष में गवाही दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδιογνώστης
  choice: हृदयों को जानने वाले
  rationale: यह दुर्लभ संयुक्त शब्द मनुष्यों के भीतरी मन को जानने वाले को दर्शाता है। बहुवचन ‘हृदयों’ से यूनानी शब्द की व्यापकता बनी रहती है और हिंदी स्वाभाविक रहती है।
- source_word: θεὸς
  choice: परमेश्वर
  rationale: यहाँ θεός के लिए आधुनिक हिंदी बाइबलीय प्रयोग में स्वाभाविक और गरिमापूर्ण शब्द; καρδιογνώστης इसके विशेषणात्मक वर्णन के रूप में लिया गया है।
- source_word: ἐμαρτύρησεν αὐτοῖς
  choice: उनके पक्ष में गवाही दी
  rationale: क्रिया का अर्थ गवाही देना या पुष्टि करना है। प्रसंग में परमेश्वर ने उन्हें आत्मा देकर उनके स्वीकार किए जाने की पुष्टि की; हिंदी में ‘उनके पक्ष में’ दत्तिव αὐτοῖς के आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δοὺς
  choice: देकर
  rationale: अओरिस्ट कृदंत उस माध्यम को बताता है जिसके द्वारा परमेश्वर ने गवाही दी; ‘देकर’ इस संबंध को संक्षेप और सहज ढंग से व्यक्त करता है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: यह इस निश्चित पदवी का मानक, वर्तमान हिंदी रूप है।
- source_word: καθὼς καὶ ἡμῖν
  choice: उन्हें भी हमारी ही तरह
  rationale: यूनानी में ‘देना’ क्रिया यहाँ अध्याहृत है। हिंदी शब्दक्रम तुलना और καί के समावेशी बल—उन्हें भी—दोनों को स्पष्ट करता है।
theological_decisions:
- issue: अन्यजातियों को आत्मा दिए जाने के द्वारा परमेश्वर की गवाही
  choice: ‘उन्हें’ सर्वनाम को बनाए रखते हुए कहा गया है कि परमेश्वर ने उन्हें भी उसी तरह पवित्र आत्मा दिया जैसे ‘हमें’।
  alternative: ‘उन्हें’ के स्थान पर व्याख्यात्मक रूप से ‘अन्यजातियों को’ कहा जा सकता था।
  rationale: αὐτοῖς स्वयं उनकी जातीय पहचान नहीं बताता; यह पहचान प्रसंग से मिलती है। इसलिए मूल की सर्वनामात्मक अभिव्यक्ति और उसके निहित तनाव को सुरक्षित रखा गया है।
- issue: ἐμαρτύρησεν αὐτοῖς में दत्तिव का संबंध
  choice: ‘उनके पक्ष में गवाही दी’
  alternative: ‘उन्हें गवाही दी’
  rationale: प्रसंग में आत्मा का दिया जाना उन लोगों के विषय में परमेश्वर की पुष्टिकारक गवाही है। ‘उनके पक्ष में’ हिंदी में यह अर्थ स्पष्ट करता है, पर इससे आगे कोई संप्रदायगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। वाक्य में कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘हृदयों को जानने वाले’ मूल संयुक्त शब्द को स्वाभाविक और पर्याप्त रूप से व्यक्त करता है।
