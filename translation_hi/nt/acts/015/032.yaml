  yaml_path: translation/nt/acts/015/032.yaml
  text: Judas and Silas[a], who were themselves prophets, encouraged the brothers at length and strengthened them.
translation:
  language: hi
  text: यहूदा और सीलास, जो स्वयं भी भविष्यद्वक्ता थे, ने बहुत-सी बातें कहकर भाइयों[a] को प्रोत्साहित किया और उन्हें सुदृढ़ किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘भाइयों’; यूनानी शब्द यहाँ स्त्रियों सहित पूरे विश्वासी समुदाय के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας τε καὶ Σιλᾶς
  choice: यहूदा और सीलास
  rationale: दोनों नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं; τε καὶ का स्वाभाविक समन्वय ‘और’ से व्यक्त होता है।
- source_word: καὶ αὐτοὶ προφῆται ὄντες
  choice: स्वयं भी भविष्यद्वक्ता थे
  rationale: αὐτοὶ के बल को ‘स्वयं’ और καὶ के समावेशी भाव को ‘भी’ से व्यक्त किया गया है; ‘भविष्यद्वक्ता’ पद को बिना कमजोर किए सीधे रखा गया है।
- source_word: διὰ λόγου πολλοῦ
  choice: बहुत देर तक बोलकर
  rationale: शाब्दिक भाव ‘बहुत वचन/बात के द्वारा’ है; प्रसंग में यह विस्तृत मौखिक संबोधन बताता है। यह हिन्दी में सहज है और अवधि/विस्तार का भाव सुरक्षित रखता है।
- source_word: παρεκάλεσαν
  choice: प्रोत्साहित किया
  rationale: यहाँ παρακαλέω का भाव उत्साह देने और आग्रहपूर्ण ढंग से संभालने का है; ‘प्रोत्साहित किया’ आधुनिक, स्पष्ट और प्रसंगानुकूल है।
- source_word: τοὺς ἀδελφοὺς
  choice: भाई-बहनों
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन ‘भाइयों’ है, पर आरम्भिक मसीही प्रयोग में यह प्रायः पूरी विश्वासी मंडली, स्त्रियों सहित, को दर्शाता है। मुख्य पाठ में आशय-स्पष्ट हिन्दी चुनी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: ἐπεστήριξαν
  choice: उन्हें दृढ़ किया
  rationale: क्रिया का अर्थ मजबूत या स्थिर करना है। ‘दृढ़ किया’ पहले कार्य ‘प्रोत्साहित किया’ से भिन्न दूसरे कार्य को स्पष्ट रखता है।
theological_decisions:
- issue: मिश्रित विश्वासी समुदाय के लिए ἀδελφοὺς का अनुवाद
  choice: भाई-बहनों
  alternative: भाइयों
  rationale: मूल शब्द पुल्लिंग बहुवचन है, किंतु इस प्रसंग में संभवतः संपूर्ण विश्वासी समुदाय का प्रतिनिधिक उल्लेख है। हिन्दी में ‘भाई-बहनों’ संभावित समावेशी आशय को स्पष्ट करता है, जबकि पादटिप्पणी मूल की व्याकरणिक अभिव्यक्ति सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दो छोटी वाक्य-इकाइयों से भारी कृदन्तीय यूनानी रचना को स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि ‘स्वयं भी’, ‘भविष्यद्वक्ता’, विस्तृत बोलने, प्रोत्साहन और दृढ़ीकरण के सभी अर्थगत घटक सुरक्षित हैं।
