source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ εἰς ⸀Ἱεροσόλυμα ⸀παρεδέχθησαν ⸀ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων, ἀνήγγειλάν τε ὅσα ὁ θεὸς ἐποίησεν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/004.yaml
  text: When they arrived in Jerusalem[a], they were welcomed by the church and the apostles and the elders, and they reported all that God had done with them.
translation:
  language: hi
  text: जब वे यरूशलेम पहुँचे, तो कलीसिया, प्रेरितों और प्राचीनों ने उनका स्वागत किया। और उन्होंने वह सब बताया जो परमेश्वर ने उनके साथ किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो परमेश्वर ने उनके द्वारा किया था,” अथवा “जो परमेश्वर ने उनके बीच किया था।” यूनानी में शाब्दिक अर्थ “उनके साथ” है।
    reason: मूल यूनानी μετ’ αὐτῶν सहचर्य बताता है, पर प्रसंग में साधनात्मक (‘उनके द्वारा’) या समुदायगत (‘उनके बीच’) अर्थ-संकेत भी सम्भव हैं।
lexical_decisions:
- source_word: παραγενόμενοι δὲ εἰς Ἱεροσόλυμα
  choice: जब वे यरूशलेम पहुँचे
  rationale: कालसूचक कृदन्त को स्वाभाविक आधुनिक हिन्दी में मुख्य घटनाओं से पहले की परिस्थिति के रूप में व्यक्त किया गया है; δέ का हल्का संयोजक बल इसी रचना में समाहित है।
- source_word: παρεδέχθησαν ἀπὸ τῆς ἐκκλησίας καὶ τῶν ἀποστόλων καὶ τῶν πρεσβυτέρων
  choice: कलीसिया, प्रेरितों और प्राचीनों ने उनका स्वागत किया
  rationale: यूनानी कर्मवाच्य को सहज हिन्दी कर्तृवाच्य में बदला गया है। ‘स्वागत किया’ यहाँ आदरपूर्वक ग्रहण किए जाने का भाव देता है।
- source_word: ἐκκλησίας
  choice: कलीसिया
  rationale: यहाँ शब्द यरूशलेम के विश्वासियों के समुदाय को दर्शाता है; ‘कलीसिया’ हिन्दी बाइबिलीय प्रयोग में परिचित और प्रसंगानुकूल है।
- source_word: πρεσβυτέρων
  choice: प्राचीनों
  rationale: इस कलीसियाई प्रसंग में यह मान्य अगुवों के लिए पदनाम है, केवल अधिक आयु वाले पुरुषों के लिए नहीं।
- source_word: ἀνήγγειλάν τε ὅσα
  choice: तब उन्होंने वह सब बताया
  rationale: क्रिया का आशय घटनाओं का वृत्तान्त देना है। ‘वह सब बताया’ स्पष्ट और सामान्य हिन्दी है; ‘तब’ घटनाक्रम को सहजता से जोड़ता है।
- source_word: ὁ θεὸς ἐποίησεν
  choice: परमेश्वर ने ... किया था
  rationale: परमेश्वर स्पष्ट कर्ता है, और हिन्दी का पूर्ण भूतकाल बताने की घटना से पहले पूरे हुए कार्य को दर्शाता है।
- source_word: μετ’ αὐτῶν
  choice: उनके साथ मिलकर
  rationale: μετά के मूल सहचर्य-भाव को बनाए रखते हुए हिन्दी में ‘साथ मिलकर’ वाक्य को स्वाभाविक बनाता है; फिर भी इसके साधनात्मक या समुदायगत अर्थ-संकेतों को पादटिप्पणी में खुला रखा गया है।
theological_decisions:
- issue: μετ’ αὐτῶν में परमेश्वर के कार्य और मानवीय सहभागिता का सम्बन्ध
  choice: परमेश्वर ने उनके साथ मिलकर किया था
  alternative: परमेश्वर ने उनके द्वारा किया था; परमेश्वर ने उनके बीच किया था
  rationale: मूल पदबंध परमेश्वर को प्रधान कर्ता रखते हुए पौलुस और बरनबास को उसके कार्य से जोड़ता है। मुख्य पाठ सहचर्य को व्यक्त करता है और पादटिप्पणी साधन तथा स्थान/समुदाय के सम्भव भावों को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कलीसिया’, ‘प्रेरित’ और ‘प्राचीन’ जैसे परिचित बाइबिलीय पद बनाए गए हैं। यूनानी कर्मवाच्य को प्राकृतिक हिन्दी के लिए कर्तृवाच्य किया गया है।
