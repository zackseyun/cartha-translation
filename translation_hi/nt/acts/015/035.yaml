id: ACT.15.35
reference: Acts 15:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Παῦλος δὲ καὶ Βαρναβᾶς διέτριβον ἐν Ἀντιοχείᾳ διδάσκοντες καὶ εὐαγγελιζόμενοι μετὰ καὶ ἑτέρων πολλῶν τὸν λόγον τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/035.yaml
  text: But Paul and Barnabas stayed in Antioch[a], teaching and proclaiming the good news of the word of the Lord[c][b], with many others also.
translation:
  language: hi
  text: पर पौलुस और बरनबास अन्ताकिया में कुछ समय तक रहे[a]। वे बहुत-से अन्य लोगों के साथ प्रभु का वचन[c] सिखाते और उसका शुभ समाचार सुनाते रहे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अन्ताकिया में रहे।” यूनानी क्रिया वहाँ कुछ समय तक बने रहने या समय बिताने पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसका सुसमाचार प्रचार करते रहे।” यूनानी क्रिया शुभ समाचार की घोषणा करने को व्यक्त करती है।
    reason: lexical_alternative
  - marker: c
    text: “प्रभु का वचन” प्रेरितों के काम में प्रभु के संदेश के लिए प्रचलित अभिव्यक्ति है; “प्रभु का संदेश” भी सम्भव अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: कुछ समय तक रहे
  rationale: अपूर्णकालीन क्रिया किसी स्थान पर समय बिताते हुए बने रहने की निरंतरता व्यक्त करती है; यह हिन्दी में स्वाभाविक रूप से उस भाव को रखती है।
- source_word: διδάσκοντες
  choice: सिखाते रहे
  rationale: कृदन्त उनके वहाँ रहने के दौरान जारी गतिविधि बताता है; ‘सिखाते रहे’ उस निरंतरता को स्पष्ट करता है।
- source_word: εὐαγγελιζόμενοι
  choice: उसका शुभ समाचार सुनाते रहे
  rationale: क्रिया शुभ समाचार घोषित करने का भाव रखती है। सर्वनाम ‘उसका’ इसे ‘प्रभु का वचन’ से जोड़ता है, जबकि ‘शुभ समाचार सुनाना’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: μετὰ καὶ ἑτέρων πολλῶν
  choice: बहुत-से अन्य लोगों के साथ
  rationale: यह पौलुस और बरनबास के अतिरिक्त अनेक सहभागी सेवकों को दर्शाता है; ‘अन्य’ ἑτέρων तथा संदर्भगत अतिरिक्तता दोनों को व्यक्त करता है।
- source_word: λόγον
  choice: वचन
  rationale: λόγος यहाँ ‘संदेश’ भी हो सकता है, पर ‘प्रभु का वचन’ प्रेरितों के काम की परिचित अभिव्यक्ति और साहित्यिक निरंतरता को सुरक्षित रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος की उपाधि को बिना उसके संदर्भ को आवश्यकता से अधिक निश्चित किए मानक हिन्दी ‘प्रभु’ से व्यक्त किया गया है।
theological_decisions:
- issue: ‘प्रभु का वचन’ में ‘प्रभु’ का संदर्भ
  choice: ग्रीक उपाधि के अनुरूप केवल ‘प्रभु’ रखा गया है।
  alternative: ‘प्रभु यीशु का वचन’ अथवा व्यापक अर्थ में परमेश्वर की ओर से आया संदेश
  rationale: प्रेरितों के काम में ‘प्रभु’ विशेष रूप से यीशु की ओर संकेत कर सकता है, पर इस पद में ग्रीक पाठ केवल κύριος कहता है; इसलिए अनुवाद उस संदर्भ को अतिरिक्त रूप से निश्चित नहीं करता।
- issue: शिक्षा और शुभ समाचार की विषयवस्तु
  choice: दोनों गतिविधियों को ‘प्रभु का वचन’ से अर्थगत रूप से जोड़ा गया है।
  alternative: केवल शुभ समाचार सुनाने को ‘प्रभु का वचन’ से जोड़ना
  rationale: ग्रीक में τὸν λόγον τοῦ κυρίου दोनों समन्वित कृदन्तों—‘सिखाते’ और ‘शुभ समाचार सुनाते’—की विषयवस्तु के रूप में स्वाभाविक रूप से समझा जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘अन्ताकिया’, ‘पौलुस’, ‘बरनबास’, ‘प्रभु’ और ‘वचन’ जैसे स्थापित बाइबलीय रूप साहित्यिक निरंतरता के लिए रखे गए हैं। दो वाक्यों में विभाजन हिन्दी की स्वाभाविकता बढ़ाता है और मूल की अर्थगत संरचना सुरक्षित रखता है।
