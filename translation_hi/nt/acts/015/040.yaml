  text: Παῦλος δὲ ἐπιλεξάμενος Σιλᾶν ἐξῆλθεν παραδοθεὶς τῇ χάριτι τοῦ ⸀κυρίου ὑπὸ τῶν ἀδελφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/040.yaml
  text: But Paul chose Silas and departed[b][a], having been commended by the brothers to the grace of the Lord.
translation:
  language: hi
  text: परन्तु पौलुस ने सीलास को चुना और प्रस्थान किया; भाइयों[b] ने उसे प्रभु के अनुग्रह के भरोसे कर दिया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे प्रभु के अनुग्रह में सौंप दिया था।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भाइयों” में सन्दर्भ के अनुसार स्त्रियों सहित व्यापक विश्वासी समुदाय सम्मिलित हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: परन्तु
  rationale: पिछले पद में बरनबास के प्रस्थान के साथ हल्का विरोध दर्शाता है।
- source_word: ἐπιλεξάμενος
  choice: चुना
  rationale: पौलुस द्वारा प्रस्थान से पहले सीलास को स्वयं चुनने का स्वाभाविक और सटीक अर्थ देता है।
- source_word: Σιλᾶν
  choice: सीलास
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: ἐξῆλθεν
  choice: चला गया
  rationale: यात्रा-वृत्तांत में बाहर निकलने अथवा प्रस्थान करने का सहज आधुनिक हिन्दी रूप।
- source_word: παραδοθεὶς
  choice: सौंप दिया था
  rationale: यहाँ कर्मवाच्य कृदन्त समुदाय द्वारा पौलुस को प्रभु के अनुग्रहपूर्ण संरक्षण में सौंपे जाने को व्यक्त करता है; वाक्य-विभाजन हिन्दी में सम्बन्ध स्पष्ट करता है।
- source_word: τῇ χάριτι
  choice: अनुग्रह को
  rationale: हिन्दी में ‘सौंपना’ के साथ परसर्गयुक्त कर्म स्वाभाविक है और χάρις के धर्मवैचारिक संज्ञा-रूप को बनाए रखता है।
- source_word: τοῦ κυρίου
  choice: प्रभु के
  rationale: κύριος की अस्पष्ट निर्दिष्टता को बनाए रखते हुए न तो यीशु और न परमेश्वर पिता को स्पष्ट रूप से जोड़ता है।
- source_word: ὑπὸ τῶν ἀδελφῶν
  choice: भाइयों ने
  rationale: मूल के व्याकरणिक पुल्लिंग बहुवचन को मुख्य पाठ में रखता है; सम्भावित व्यापक विश्वासी समुदाय का अर्थ पाद-टिप्पणी में बताया गया है।
theological_decisions:
- issue: ‘प्रभु’ का अभिप्रेत व्यक्ति
  choice: केवल ‘प्रभु’
  alternative: ‘प्रभु यीशु’ अथवा ‘परमेश्वर’
  rationale: यूनानी पाठ κύριος कहता है, पर उसका अभिप्रेत व्यक्ति स्पष्ट नहीं करता; अनुवाद उसी स्तर की अस्पष्टता रखता है।
- issue: ‘भाइयों’ का दायरा
  choice: मुख्य पाठ में ‘भाइयों’, साथ में व्याख्यात्मक पाद-टिप्पणी
  alternative: ‘भाई-बहनों’ अथवा ‘विश्वासियों’
  rationale: ἀδελφῶν व्याकरणतः पुल्लिंग बहुवचन है, किन्तु सन्दर्भ में व्यापक विश्वासी समुदाय को भी समेट सकता है।
- issue: παραδοθεὶς का भाव
  choice: ‘सौंप दिया था’
  alternative: ‘अनुग्रह की देखरेख में भेजा था’ अथवा ‘अनुग्रह के भरोसे कर दिया था’
  rationale: मूल क्रिया के सौंपे अथवा सुपुर्द किए जाने के अर्थ को रखता है और अनुग्रह को केवल सामान्य संरक्षण में नहीं बदलता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। मूल participial संरचना को दो वाक्यों में व्यक्त किया गया है ताकि कर्ता और कर्म स्पष्ट रहें। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
