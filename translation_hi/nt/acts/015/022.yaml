id: ACT.15.22
reference: Acts 15:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τότε ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν ⸀τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν ⸀καλούμενον Βαρσαββᾶν καὶ Σιλᾶν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/022.yaml
  text: 'Then it seemed good to the apostles and the elders, together with the whole church, to choose men from among them and send them to Antioch with Paul and Barnabas: Judas, who was called Barsabbas, and Silas, men who were leading among the brothers.'
translation:
  language: hi
  text: तब प्रेरितों और प्राचीनों ने, पूरी कलीसिया के साथ मिलकर, यह उचित समझा कि वे अपने बीच से पुरुषों को चुनें और उन्हें पौलुस और बरनबास के साथ अन्ताकिया भेजें—यहूदा को, जो बरसब्बास कहलाता था, और सीलास को। ये दोनों ऐसे पुरुष थे जो भाइयों में अगुवा थे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये दोनों भाइयों में प्रमुख पुरुष थे।”
    reason: ἡγουμένους को सक्रिय रूप में ‘अगुवा’ या विशेषणात्मक रूप में ‘प्रमुख’ समझने की निकटवर्ती अनुवाद-सम्भावना।
  - marker: b
    text: यहाँ “भाइयों” से सम्भवतः स्त्रियों सहित विश्वासियों का व्यापक समुदाय अभिप्रेत है।
    reason: ἀδελφοῖς व्याकरणिक रूप से पुल्लिंग बहुवचन है, पर आरम्भिक मसीही समुदाय के लिए इसका प्रयोग व्यापक अर्थ में हो सकता है।
lexical_decisions:
- source_word: ἔδοξε
  choice: यह उचित समझा
  rationale: विचार-विमर्श के बाद बने सामूहिक मत को स्वाभाविक हिन्दी में व्यक्त करता है, पर इसे अत्यधिक औपचारिक आदेश नहीं बनाता।
- source_word: πρεσβυτέροις
  choice: प्राचीनों
  rationale: आरम्भिक कलीसिया के मान्य अगुवों के लिए प्रचलित और गरिमापूर्ण बाइबलीय हिन्दी शब्द।
- source_word: σὺν ὅλῃ τῇ ἐκκλησίᾳ
  choice: पूरी कलीसिया के साथ मिलकर
  rationale: समूचे विश्वासी समुदाय की सहभागिता को सुरक्षित रखता है।
- source_word: ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν
  choice: अपने बीच से कुछ पुरुषों को चुनें
  rationale: चुने गए प्रतिनिधियों के पुरुष होने और उसी समुदाय में से लिए जाने—दोनों बातों को स्पष्ट करता है; हिन्दी में अनिश्चित बहुवचन के लिए 'कुछ' स्वाभाविक है।
- source_word: πέμψαι εἰς Ἀντιόχειαν
  choice: अन्ताकिया भेजें
  rationale: गंतव्य और भेजने की क्रिया का सीधा, स्वाभाविक अनुवाद।
- source_word: καλούμενον Βαρσαββᾶν
  choice: जो बरसब्बा कहलाता था
  rationale: नाम अथवा उपनाम के रूप में परिचित होने का वर्णनात्मक भाव बनाए रखता है।
- source_word: ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς
  choice: भाइयों के बीच अगुवाई करनेवाले पुरुष
  rationale: ἡγουμένους की सक्रिय, मान्य नेतृत्व-भूमिका को व्यक्त करता है, बिना उसे किसी निश्चित पदनाम में बदलने के।
- source_word: ἀδελφοῖς
  choice: भाइयों
  rationale: यूनानी के पुल्लिंग बहुवचन रूप को मुख्य पाठ में बनाए रखता है; समुदायगत व्यापक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: निर्णय में पूरी कलीसिया की सहभागिता
  choice: प्रेरितों और प्राचीनों के साथ पूरी कलीसिया को सामूहिक निर्णय में सम्मिलित दिखाया गया है।
  alternative: केवल प्रेरितों और प्राचीनों ने निर्णय लिया और कलीसिया मात्र उपस्थित थी।
  rationale: σὺν ὅλῃ τῇ ἐκκλησίᾳ स्वाभाविक रूप से पूरी कलीसिया को ἔδοξε तथा चुनने और भेजने की कार्रवाई के साथ जोड़ता है, पर अनुवाद किसी विशिष्ट कलीसियाई शासन-पद्धति को आरोपित नहीं करता।
- issue: ἀδελφοῖς का समुदायगत विस्तार
  choice: मुख्य पाठ में 'भाइयों', और पादटिप्पणी में व्यापक विश्वासी समुदाय की सम्भावना।
  alternative: मुख्य पाठ में 'भाई-बहनों' अथवा 'विश्वासियों'।
  rationale: स्रोत का व्याकरणिक पुल्लिंग रूप सुरक्षित रखा गया है, जबकि आरम्भिक मसीही प्रयोग में उसके सम्भावित समावेशी अर्थ को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। 'प्रेरित', 'प्राचीन', 'कलीसिया' और 'अगुवाई' जैसे परिचित बाइबलीय शब्द प्रयुक्त हैं। लम्बे यूनानी वाक्य को पठनीयता के लिए दो हिन्दी वाक्यों में बाँटा गया है; आशय और व्याकरणिक संबंध सुरक्षित हैं।
