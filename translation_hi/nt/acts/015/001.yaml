source:
  edition: SBLGNT
  text: Καί τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας ἐδίδασκον τοὺς ἀδελφοὺς ὅτι Ἐὰν μὴ ⸀περιτμηθῆτε τῷ ἔθει ⸀τῷ Μωϋσέως, οὐ δύνασθε σωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/015/001.yaml
  text: And some men came down from Judea and were teaching the brothers[a], “Unless you are circumcised according to the custom of Moses, you cannot be saved.”
translation:
  language: hi
  text: और यहूदिया से कुछ लोग उतरकर भाइयों[a] को सिखा रहे थे, “यदि मूसा की रीति के अनुसार तुम्हारा खतना न हो, तो तुम उद्धार नहीं पा सकते।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाइयों और बहनों”; यूनानी में “भाइयों” है और संभवतः इससे पूरा विश्वासी समुदाय अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: और
  rationale: यह सामान्य संयोजक कथा के प्रवाह को उसी सरल ढंग से आगे बढ़ाता है।
- source_word: τινες κατελθόντες ἀπὸ τῆς Ἰουδαίας
  choice: यहूदिया से कुछ लोग उतरकर
  rationale: τινες को स्वाभाविक हिंदी में ‘कुछ लोग’ कहा गया है; κατελθόντες की भौगोलिक और कथात्मक गति ‘उतरकर’ से बनी रहती है।
- source_word: ἐδίδασκον
  choice: यह शिक्षा दे रहे थे
  rationale: अपूर्णकालिक क्रिया की जारी या बार-बार होने वाली गतिविधि को ‘दे रहे थे’ व्यक्त करता है।
- source_word: τοὺς ἀδελφοὺς
  choice: भाइयों
  rationale: यूनानी शब्द पुल्लिंग बहुवचन है; मुख्य पाठ में इसका प्रत्यक्ष रूप रखा गया है और समुदाय-सूचक समावेशी संभावना पादटिप्पणी में दी गई है।
- source_word: Ἐὰν μὴ περιτμηθῆτε
  choice: यदि … तुम्हारा खतना न हो
  rationale: नकारात्मक शर्त को सहज आधुनिक हिंदी में व्यक्त किया गया है और कर्मवाच्य भाव सुरक्षित रखा गया है।
- source_word: τῷ ἔθει τῷ Μωϋσέως
  choice: मूसा की रीति के अनुसार
  rationale: ἔθος स्थापित रीति या प्रथा को दर्शाता है; ‘के अनुसार’ संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: οὐ δύνασθε σωθῆναι
  choice: तुम उद्धार नहीं पा सकते
  rationale: असमर्थता और उद्धार-संबंधी अर्थ दोनों को प्रचलित, स्पष्ट हिंदी में सुरक्षित रखा गया है।
theological_decisions:
- issue: यरूशलेम सभा के विवाद में σωθῆναι का अर्थ
  choice: उद्धार पाना
  alternative: छुटकारा पाना
  rationale: प्रसंग परमेश्वर के लोगों में सम्मिलित होने और उद्धार के लिए खतने की कथित अनिवार्यता से संबंधित है; ‘उद्धार’ इस धर्मवैचारिक बल को बिना किसी संप्रदायगत विस्तार के बनाए रखता है।
- issue: ἀδελφοὺς का लिंग और सामुदायिक संदर्भ
  choice: भाइयों
  alternative: भाइयों और बहनों / विश्वासियों
  rationale: मूल शब्द व्याकरणतः पुल्लिंग बहुवचन है, किंतु संभवतः पूरे विश्वासी समुदाय के लिए प्रतिनिधिक रूप में प्रयुक्त है; इसलिए मूल रूप मुख्य पाठ में और संभावित समावेशी आशय पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यह शिक्षा दे रहे थे’ निरंतर क्रिया को स्पष्ट करता है, जबकि उद्धृत कथन में मूल की कठोर अनिवार्यता और धर्मवैचारिक तनाव यथावत हैं।
