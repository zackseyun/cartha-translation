  text: Ἀναχθέντες δὲ ἀπὸ τῆς Πάφου οἱ ⸀περὶ Παῦλον ἦλθον εἰς Πέργην τῆς Παμφυλίας· Ἰωάννης δὲ ἀποχωρήσας ἀπ’ αὐτῶν ὑπέστρεψεν εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: hi
  text: फिर पाफ़ोस से समुद्री यात्रा पर निकलकर[a] पौलुस और उसके साथी[b] पम्फूलिया के पिरगा नगर पहुँचे। परन्तु यूहन्ना उनसे अलग होकर यरूशलेम लौट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘समुद्र में निकलकर।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘पौलुस के आसपास के लोग।’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: समुद्री यात्रा पर निकलकर
  rationale: यात्रा-वृत्तांत में ἀνάγω के कृदन्त का अर्थ समुद्र में निकलना या जहाज़ से प्रस्थान करना है। यह हिन्दी में स्वाभाविक है और समुद्री यात्रा का भाव बनाए रखता है।
- source_word: οἱ περὶ Παῦλον
  choice: पौलुस और उसके साथी
  rationale: οἱ περὶ + कर्मकारक किसी प्रमुख व्यक्ति से जुड़े समूह को दर्शाता है। यह हिन्दी अभिव्यक्ति अर्थ को सहज रूप से स्पष्ट करती है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: ἦλθον
  choice: पहुँचे
  rationale: गंतव्य तक यात्रा के वर्णन में हिन्दी का ‘पहुँचे’ स्वाभाविक रूप से ἔρχομαι का प्रसंगगत अर्थ व्यक्त करता है।
- source_word: Πέργην τῆς Παμφυλίας
  choice: पम्फूलिया के पिरगा नगर
  rationale: सम्बन्धकारक यहाँ पिरगा की क्षेत्रीय स्थिति बताता है। ‘पम्फूलिया के पिरगा नगर’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: ἀποχωρήσας
  choice: उनसे अलग होकर
  rationale: ἀποχωρέω का अर्थ अलग होना, चले जाना या हट जाना हो सकता है। यह चयन यूहन्ना के उद्देश्य या नैतिक दोष के विषय में कुछ जोड़े बिना क्रिया बताता है।
- source_word: ὑπέστρεψεν
  choice: लौट गया
  rationale: ὑποστρέφω का सामान्य अर्थ लौटना है; हिन्दी कथात्मक शैली में ‘लौट गया’ सहज है।
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: नगर के नाम का प्रचलित हिन्दी रूप।
theological_decisions:
- issue: यूहन्ना के अलग होने का सम्भावित नैतिक संकेत
  choice: ‘उनसे अलग होकर’ कहकर कार्य को तटस्थ रूप में प्रस्तुत किया गया है।
  alternative: ‘उन्हें छोड़कर’ या ‘उनका साथ त्यागकर’
  rationale: इस पद में यूहन्ना के उद्देश्य या उसके कार्य का नैतिक मूल्यांकन नहीं बताया गया। बाद के प्रसंग से मिलने वाले सम्भावित नकारात्मक संकेत को यहाँ पहले से आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। समुद्री प्रस्थान को स्पष्ट रखा गया है और यूहन्ना के अलग होने के कारण पर पाठ की चुप्पी सुरक्षित रखी गई है। पादटिप्पणी-चिह्न उनके वास्तविक सम्बद्ध वाक्यांशों के बाद रखे गए हैं।
