source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: hi
  text: 'कि परमेश्वर ने यीशु को उठाकर हमारे बच्चों के लिए इसे पूरा किया है[a], जैसा कि दूसरे भजन में भी लिखा है:


    “तू मेरा पुत्र है;

    आज मैंने तुझे जन्म दिया है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे लिए, जो उनकी संतान हैं।” कुछ हस्तलिपियों में “हमारे बच्चों के लिए” है, जबकि अन्य में “हमारे लिए, जो उनकी संतान हैं” का पाठ मिलता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: पूरा किया है
  rationale: पूर्णकाल की पूरी हो चुकी और वर्तमान में प्रभावी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है तथा प्रतिज्ञा-पूर्ति का भाव बनाए रखता है।
- source_word: ταύτην
  choice: इसे
  rationale: यह सर्वनाम पिछले पद की प्रतिज्ञा की ओर संकेत करता है; मूल की तरह यहाँ कोई संज्ञा जोड़े बिना संदर्भ खुला रखा गया है।
- source_word: τοῖς τέκνοις ἡμῶν
  choice: हमारे बच्चों के लिए
  rationale: प्रस्तुत SBLGNT पाठ में ἡμῶν का स्वाभाविक औपचारिक अनुवाद है; पाठांतर को पादटिप्पणी में रखा गया है।
- source_word: ἀναστήσας Ἰησοῦν
  choice: यीशु को खड़ा करके
  rationale: ἀνίστημι की यहाँ विद्यमान अस्पष्टता—यीशु को सामने लाना/नियुक्त करना अथवा मृतकों में से जिलाना—को यथासंभव बनाए रखता है।
- source_word: γέγραπται
  choice: लिखा है
  rationale: पवित्रशास्त्र के उद्धरण की प्रचलित और स्वाभाविक हिन्दी अभिव्यक्ति है, जिसमें लिखे हुए वचन की स्थायी प्रासंगिकता बनी रहती है।
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: दूसरे भजन में
  rationale: यूनानी पदबंध का सीधा और सहज हिन्दी रूप है।
- source_word: Υἱός μου εἶ σύ
  choice: तू मेरा पुत्र है
  rationale: उद्धरण की निकट संबोधन-शैली और पुत्र की स्पष्ट पहचान को स्वाभाविक हिन्दी में रखता है।
- source_word: σήμερον γεγέννηκά σε
  choice: आज मैंने तुझे जन्म दिया है
  rationale: γεννάω का सीधा, बोधगम्य हिन्दी रूप है और भजन 2:7 के धर्मवैज्ञानिक भार को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: ἀναστήσας Ἰησοῦν का आशय
  choice: मुख्य पाठ में “यीशु को खड़ा करके”
  alternative: “यीशु को मृतकों में से जिलाकर” अथवा “यीशु को सामने लाकर/नियुक्त करके”
  rationale: अगले पद में पुनरुत्थान अधिक स्पष्ट है, जबकि प्रेरितों के काम में ἀνίστημι किसी उद्धारकर्ता को उठाने या सामने लाने के अर्थ में भी आता है। इसलिए मुख्य पाठ किसी एक व्याख्या को निर्णायक नहीं बनाता।
- issue: “आज मैंने तुझे जन्म दिया है” का मसीह-संबंधी आशय
  choice: उद्धरण को सीधे रूप में रखा गया है
  alternative: राज्यारोहण/गोद लिए जाने की भाषा अथवा पुनरुत्थान द्वारा प्रमाणित किए जाने की भाषा के रूप में व्याख्या
  rationale: अनुवाद में भजन 2:7 के आशय पर बाद की धर्मवैज्ञानिक व्याख्या आरोपित नहीं की गई है; वास्तविक तनाव सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। भजन के उद्धरण में “तू/तुझे” रखा गया है, जो हिन्दी बाइबलीय काव्य और परमेश्वर के सीधे संबोधन में स्वाभाविक है। मुख्य पाठ में सर्वनाम और क्रियात्मक अस्पष्टता को अनावश्यक व्याख्या से नहीं भरा गया।
