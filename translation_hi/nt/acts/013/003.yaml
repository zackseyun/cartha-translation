  text: Then[a], after fasting and praying and laying their hands on them, they sent them off.
translation:
  language: hi
  text: तब उपवास करने, प्रार्थना करने और उन पर हाथ रखने के बाद, उन्होंने उन्हें विदा किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें जाने दिया” अथवा “उन्हें मुक्त किया।” इस प्रसंग में अर्थ यह है कि बरनबास और शाऊल को मिशन के लिए प्रस्थान करने दिया गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह पहले दिए गए पवित्र आत्मा के निर्देश के बाद होने वाली कार्रवाई को स्वाभाविक और स्पष्ट रूप से दर्शाता है।
- source_word: νηστεύσαντες
  choice: उपवास करके
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले की तैयारी को दर्शाता है; यह हिन्दी में सहज रहते हुए उस क्रम को बनाए रखता है।
- source_word: προσευξάμενοι
  choice: प्रार्थना करके
  rationale: समन्वित कृदंत को पिछले पदबंध के समान रूप में रखना तैयारी के कार्यों की श्रृंखला को स्पष्ट करता है।
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: उन पर हाथ रखकर
  rationale: यह ठोस संकेतात्मक कार्य को बिना किसी विशेष संस्कार, अभिषेक या पदस्थापन की व्याख्या जोड़े सुरक्षित रखता है।
- source_word: ἀπέλυσαν
  choice: उन्हें विदा किया
  rationale: क्रिया का मूल अर्थ छोड़ देने या जाने देने का है; इस प्रसंग में ‘विदा किया’ मिशन के लिए प्रस्थान की अनुमति और समुदाय की सहभागिता दोनों के अनुकूल है, पर औपचारिक ‘भेजे जाने’ को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: αὐτοῖς
  choice: उन पर
  rationale: दत्तिव सर्वनाम हाथ रखने की अभिव्यक्ति से जुड़ा है और बरनबास तथा शाऊल की ओर संकेत करता है।
theological_decisions:
- issue: हाथ रखने के कार्य का स्वरूप
  choice: कार्य को वर्णनात्मक रूप से ‘उन पर हाथ रखकर’ कहा गया है।
  alternative: इसे दीक्षा, अभिषेक, आशीर्वाद या औपचारिक नियुक्ति कहना।
  rationale: पद इस कार्य का विशिष्ट कलीसियाई या संस्कारात्मक अर्थ निर्धारित नहीं करता; इसलिए अनुवाद किसी सांप्रदायिक निष्कर्ष को आरोपित नहीं करता।
- issue: ἀπέλυσαν में भेजने और जाने देने का संबंध
  choice: ‘उन्हें विदा किया’
  alternative: ‘उन्हें भेज दिया’ या ‘उन्हें जाने दिया’
  rationale: मूल क्रिया में रिहा करने, जाने देने या विदा करने की अर्थ-सीमा है। प्रसंग मिशन के लिए प्रस्थान का है, किंतु क्रिया को सीधे औपचारिक प्रेषण मानना संभावित तनाव को समाप्त कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। कृदंतों की क्रमिक संरचना मूल यूनानी वाक्य की तैयारी और मुख्य कार्रवाई के संबंध को बनाए रखती है।
