  text: But God raised him from the dead.
translation:
  language: hi
  text: परन्तु परमेश्वर ने उसे मरे हुओं में से जिलाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: परन्तु
  rationale: यह संयोजक पिछले कथन में मनुष्यों द्वारा किए गए कार्य के विपरीत परमेश्वर के कार्य को सामने लाता है; ‘परन्तु’ इस विरोध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: θεὸς
  choice: परमेश्वर
  rationale: यह संज्ञा यहाँ क्रिया के कर्ता, अर्थात परमेश्वर, को सीधे सूचित करती है।
- source_word: ἤγειρεν
  choice: जिलाया
  rationale: पुनरुत्थान के प्रसंग में ἐγείρω का अर्थ मृत अवस्था से उठाना या जीवित करना है। ‘जिलाया’ आधुनिक हिन्दी में इस अर्थ को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: αὐτὸν
  choice: उसे
  rationale: यह सर्वनाम निकटवर्ती प्रसंग में यीशु की ओर संकेत करता है; हिन्दी में ‘उसे’ स्वाभाविक रूप है।
- source_word: ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: यह पदबंध मृतकों के बीच से निकलने का भाव रखता है। ‘मरे हुओं में से’ उसके बहुवचन और पुनरुत्थान-संबंधी अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: पुनरुत्थान की अभिव्यक्ति
  choice: परमेश्वर ने उसे मरे हुओं में से जिलाया
  alternative: परमेश्वर ने उसे मृतकों में से उठाया
  rationale: चुना हुआ पाठ पुनरुत्थान को परमेश्वर के कार्य के रूप में स्पष्ट करता है और ἐκ νεκρῶν के ‘मरे हुओं में से’ भाव को बनाए रखता है। ‘उठाया’ भी संभव है, पर हिन्दी में प्रसंग से अलग होने पर वह केवल शारीरिक रूप से उठाने का अर्थ दे सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘परन्तु’ स्पष्ट विरोध दर्शाता है, जबकि ‘मरे हुओं में से जिलाया’ मूल यूनानी की पुनरुत्थान-संबंधी अभिव्यक्ति को स्वाभाविक हिन्दी में प्रस्तुत करता है।
