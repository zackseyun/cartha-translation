  text: ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: hi
  text: जब उन्होंने उसके विषय में लिखी हुई सभी बातें पूरी कर दीं, तब उसे वृक्ष[a] से उतारकर एक कब्र में रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘क्रूस’; यूनानी शब्द ξύλον का शाब्दिक अर्थ ‘वृक्ष’ या ‘लकड़ी’ है। यह लकड़ी के वध-उपकरण के लिए भी प्रयुक्त होता था और संभवतः व्यवस्थाविवरण 21:23 की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: जब ... तब
  rationale: यह पद पिछले वृत्तांत से जुड़ते हुए समय-संबंध बताता है; हिन्दी में ‘जब ... तब’ घटनाओं का क्रम स्वाभाविक और स्पष्ट बनाता है।
- source_word: ἐτέλεσαν
  choice: पूरी कर दीं
  rationale: यहाँ क्रिया का अर्थ लिखी हुई बातों को अपने कार्यों द्वारा अंजाम तक पहुँचाना है। ‘पूरी कर दीं’ मानवीय कर्ता और पूर्णता—दोनों को व्यक्त करता है, बिना यह अस्पष्टता मिटाए कि उनके कार्यों से लिखी बातें पूरी हुईं।
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: उसके विषय में लिखी हुई सभी बातें
  rationale: यह वाक्यांश यीशु के विषय में पहले से लिखी बातों की समग्रता को बनाए रखता है; यूनानी में ‘पवित्रशास्त्र’ शब्द स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: καθελόντες
  choice: उतारकर
  rationale: पूर्वकालिक कृदंत मुख्य क्रिया से पहले हुई कार्रवाई बताता है; हिन्दी का ‘उतारकर’ इस क्रम को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπὸ τοῦ ξύλου
  choice: काठ पर से
  rationale: ξύλον का मूल अर्थ लकड़ी/काठ या वृक्ष है और यहाँ लकड़ी के वध-उपकरण के लिए प्रयुक्त है। ‘काठ’ मूल शब्द की ठोस लकड़ी-संबंधी छवि तथा संभावित व्यवस्थाविवरण 21:23 की प्रतिध्वनि को बचाता है; अधिक परिचित प्रसंगगत अर्थ ‘क्रूस’ पादटिप्पणी में दिया गया है।
- source_word: ἔθηκαν
  choice: रख दिया
  rationale: τίθημι का सामान्य अर्थ रखना या स्थापित करना है। शव को कब्र में रखने के लिए ‘रख दिया’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: εἰς μνημεῖον
  choice: एक कब्र में
  rationale: इस प्रसंग में μνημεῖον दफनाने की कब्र को दर्शाता है। हिन्दी में ‘कब्र’ साधारण पाठक के लिए सहज और सटीक है; अनिश्चित स्थान के कारण ‘एक’ उपयुक्त है।
theological_decisions:
- issue: दुःखभोग के प्रसंग में ξύλον का अनुवाद
  choice: काठ
  alternative: क्रूस; वृक्ष
  rationale: यूनानी पाठ में ξύλον है, σταυρός नहीं। ‘काठ’ लकड़ी के अर्थ और शास्त्रीय संकेत की संभावना को बनाए रखता है, जबकि ‘क्रूस’ प्रसंगगत और परंपरागत व्याख्या है, जिसे पादटिप्पणी में सुरक्षित रखा गया है। ‘वृक्ष’ अधिक शाब्दिक विकल्प है, पर हिन्दी में उस पर से शव उतारने का वाक्य इस प्रसंग में अनावश्यक भ्रम पैदा कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘उसके विषय में’ मूल की औपचारिकता बनाए रखता है; ‘पूरी कर दीं’ और ‘उतारकर ... रख दिया’ सामान्य पाठक के लिए स्वाभाविक हैं।
