lexical_decisions:
- source_word: Σαῦλος
  choice: शाऊल
  rationale: व्यक्तिनाम को हिन्दी बाइबलीय परम्परा के प्रचलित रूप में लिप्यंतरित किया गया है।
- source_word: δέ
  choice: परन्तु
  rationale: यह पिछले प्रसंग से शाऊल की प्रतिक्रिया की ओर हल्का विरोध अथवा कथात्मक मोड़ दिखाता है।
- source_word: ὁ καὶ Παῦλος
  choice: जो पौलुस भी था
  rationale: यूनानी पदबंध शाऊल की पहचान उसके दूसरे नाम पौलुस से कराता है; मूल में ‘कहलाता था’ के लिए कोई स्पष्ट क्रिया नहीं है, इसलिए मुख्य पाठ अधिक औपचारिक रूप से रखा गया है और स्वाभाविक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: πλησθεὶς
  choice: भरकर
  rationale: यह अओरिस्ट कर्मवाच्य कृदन्त का स्वाभाविक हिन्दी रूप है और आत्मा द्वारा परिपूर्ण किए जाने का भाव बनाए रखता है।
- source_word: πνεύματος ἁγίου
  choice: पवित्र आत्मा से
  rationale: ‘भरना’ के साथ हिन्दी में ‘से’ स्वाभाविक है; प्रेरितों के काम के प्रसंग में यह परमेश्वर के पवित्र आत्मा का निर्देश करता है।
- source_word: ἀτενίσας
  choice: टकटकी लगाई
  rationale: यह स्थिर और ध्यानपूर्वक देखने की तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰς αὐτόν
  choice: उसकी ओर
  rationale: ἀτενίζω के साथ εἰς दृष्टि की दिशा और लक्ष्य बताता है; हिन्दी में ‘उसकी ओर’ इसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: πνεύματος ἁγίου का निर्देश
  choice: पवित्र आत्मा
  alternative: कोई पवित्र आत्मा
  rationale: प्रेरितों के काम में यह पदबंध, विशेषकर सामर्थ्य से भरने के प्रसंगों में, परमेश्वर के पवित्र आत्मा को सूचित करता है; अनिश्चित अर्थ यहाँ प्रसंगानुकूल नहीं है।
- issue: शाऊल और पौलुस के नामों का संबंध
  choice: जो पौलुस भी था
  alternative: जो पौलुस भी कहलाता था
  rationale: मुख्य पाठ यूनानी की संक्षिप्त समानाधिकरणीय रचना को सुरक्षित रखता है और नाम बदलने जैसी अतिरिक्त धारणा नहीं जोड़ता; अधिक मुहावरेदार व्याख्या पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और कथात्मक है। ‘टकटकी लगाई’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘जो पौलुस भी था’ मूल यूनानी की संक्षिप्तता और वास्तविक अर्थगत खुलापन बनाए रखता है।
