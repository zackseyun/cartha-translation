id: ACT.13.22
reference: Acts 13:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: hi
  text: और उसे हटा देने के बाद, परमेश्वर ने उनके लिए दाऊद को राजा के रूप में खड़ा किया। उसके विषय में उन्होंने गवाही देकर कहा, “मैंने यिशै के पुत्र दाऊद को पाया है—एक ऐसा मनुष्य जो मेरे मन के अनुसार है[a] और मेरी सारी इच्छाएँ पूरी करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे हृदय के अनुसार।” यहाँ “हृदय” व्यक्ति के भीतर के विचार, इच्छा और उद्देश्य को दर्शा सकता है।
    reason: मूल यूनानी मुहावरे का अधिक शाब्दिक रूप और उसके अर्थ-क्षेत्र को बताना।
lexical_decisions:
- source_word: μεταστήσας
  choice: उसे हटा देने के बाद
  rationale: यहाँ संकेत शाऊल को राजपद से हटाने का है। ‘हटा देने’ का प्रयोग स्वाभाविक है और मृत्यु अथवा केवल राजनीतिक पदच्युति जैसी किसी अधिक संकीर्ण व्याख्या को अनावश्यक रूप से नहीं थोपता।
- source_word: ἤγειρεν
  choice: खड़ा किया
  rationale: ἐγείρω यहाँ किसी अगुवे को आगे लाने या स्थापित करने के अर्थ में है। ‘राजा के रूप में खड़ा किया’ बाइबलीय मुहावरे को बनाए रखता है, जबकि प्रसंग पुनरुत्थान का अर्थ नहीं रहने देता।
- source_word: αὐτοῖς εἰς βασιλέα
  choice: उनके लिए ... राजा के रूप में
  rationale: αὐτοῖς हित या लाभ का भाव देता है और εἰς βασιλέα दाऊद की भूमिका या परिणति को व्यक्त करता है।
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: उसके विषय में उन्होंने गवाही देकर कहा
  rationale: यूनानी संबंधवाचक सर्वनाम व्याकरणतः संप्रदान कारक में है, पर कथन दाऊद के विषय में गवाही है; हिन्दी में ‘उसके विषय में’ अर्थ को स्वाभाविक और स्पष्ट बनाता है। आदरसूचक बहुवचन ‘उन्होंने’ परमेश्वर के लिए आधुनिक मानक हिन्दी के अनुरूप है।
- source_word: Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί
  choice: मैंने यिशै के पुत्र दाऊद को पाया है
  rationale: पूर्ण वर्तमान हिन्दी में पूरी हो चुकी खोज और उसके वर्तमान परिणाम को स्वाभाविक ढंग से व्यक्त करता है; जननवाचक वाक्यांश को ‘यिशै के पुत्र’ के रूप में स्पष्ट किया गया है।
- source_word: ἄνδρα κατὰ τὴν καρδίαν μου
  choice: एक ऐसा मनुष्य जो मेरे मन के अनुसार है
  rationale: यह κατά की अनुरूपता को निकटता से व्यक्त करता है और केवल भावनात्मक लगाव का अर्थ आरोपित नहीं करता।
- source_word: πάντα τὰ θελήματά μου
  choice: मेरी सारी इच्छाएँ
  rationale: θελήματα मूल पाठ में बहुवचन है। ‘सारी इच्छाएँ’ हिन्दी में स्वाभाविक रहते हुए परमेश्वर की विभिन्न अभिलाषाओं, संकल्पों या उद्देश्यों की बहुलता सुरक्षित रखता है।
- source_word: ποιήσει
  choice: पूरी करेगा
  rationale: शाब्दिक ‘करेगा’ सम्भव है, पर हिन्दी में इच्छाओं के साथ ‘पूरी करेगा’ अधिक स्वाभाविक है और उन्हें कार्यान्वित करने का भाव देता है।
theological_decisions:
- issue: दाऊद का ‘परमेश्वर के मन के अनुसार’ होना
  choice: मेरे मन के अनुसार
  alternative: मेरे मन का / मेरे हृदय के अनुसार
  rationale: ‘मन के अनुसार’ यूनानी κατὰ τὴν καρδίαν μου की अनुरूपता को बनाए रखता है और इसे मात्र भावनात्मक निकटता या दाऊद की पूर्ण नैतिक निर्दोषता के दावे में नहीं बदलता।
- issue: दाऊद को खड़ा करना
  choice: राजा के रूप में खड़ा किया
  alternative: राजा नियुक्त किया
  rationale: ‘खड़ा किया’ ἐγείρω की बाइबलीय व्यापकता सुरक्षित रखता है; ‘राजा के रूप में’ स्पष्ट करता है कि यहाँ पुनरुत्थान नहीं, नेतृत्व और राजपद के लिए आगे लाना अभिप्रेत है।
- issue: परमेश्वर की इच्छाओं का बहुवचन
  choice: मेरी सारी इच्छाएँ
  alternative: मेरी सारी इच्छा / मेरी पूरी इच्छा
  rationale: यूनानी θελήματα बहुवचन है। हिन्दी बहुवचन को बनाए रखने से परमेश्वर के विविध उद्देश्यों या निर्देशों का भाव सुरक्षित रहता है, बिना उन्हें किसी व्यवस्थित धर्मवैज्ञानिक श्रेणी में बाँधे।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। परमेश्वर के उल्लेख में आदरसूचक बहुवचन रखा गया है। ‘मन के अनुसार’ मुख्य पाठ में अधिक स्वाभाविक है, जबकि ‘हृदय’ का शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
