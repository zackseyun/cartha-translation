  text: ἀκούοντα δὲ τὰ ἔθνη ⸀ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ ⸀κυρίου, καὶ ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: hi
  text: यह सुनकर गैर-यहूदी आनन्दित होने और प्रभु के वचन की महिमा करने लगे; और जितने लोग अनन्त जीवन के लिए ठहराए गए थे[a], उन सबने विश्वास किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “अनन्त जीवन की ओर प्रवृत्त थे।” यूनानी कृदन्त को व्याख्याकारों ने अलग-अलग ढंग से समझा है, किन्तु यहाँ उसका सबसे सीधा अर्थ कर्मवाच्य “ठहराए गए थे” है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: यह सुनकर
  rationale: वर्तमान कृदन्त को मुख्य क्रियाओं की परिस्थिति बताने वाले स्वाभाविक हिन्दी वाक्यांश के रूप में रखा गया है; ‘यह’ पिछले कथन की ओर संकेत करता है।
- source_word: τὰ ἔθνη
  choice: गैर-यहूदी
  rationale: इस प्रसंग में यह पद यहूदियों से भिन्न लोगों को दर्शाता है। ‘गैर-यहूदी’ आधुनिक पाठक के लिए ‘अन्यजाति’ की अपेक्षा अधिक सहज और स्पष्ट है।
- source_word: ἔχαιρον καὶ ἐδόξαζον
  choice: आनन्दित होने और ... महिमा करने लगे
  rationale: दोनों अपूर्णकालीन क्रियाओं की चलती हुई तथा प्रसंगानुसार आरम्भिक क्रिया को हिन्दी के ‘होने/करने लगे’ से व्यक्त किया गया है।
- source_word: τὸν λόγον τοῦ κυρίου
  choice: प्रभु के वचन
  rationale: ‘वचन’ λόγος की बाइबलीय प्रतिध्वनि बनाए रखता है, जबकि प्रसंग में उसका अर्थ घोषित सन्देश है। κύριος का अनुवाद ‘प्रभु’ किया गया है।
- source_word: ἐπίστευσαν
  choice: विश्वास किया
  rationale: साधारण भूतकाल यूनानी अओरिस्ट का संक्षिप्त और स्वाभाविक प्रतिनिधित्व करता है तथा विश्वास के विषय को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ὅσοι
  choice: जितने लोग ... उन सबने
  rationale: यह रचना यूनानी पद की परिमाणसूचक शक्ति—‘जितने’ अथवा ‘वे सभी जो’—को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: τεταγμένοι
  choice: ठहराए गए थे
  rationale: τάσσω के पूर्ण कर्मवाच्य कृदन्त का सबसे सीधा अर्थ पहले से ठहराया या नियुक्त किया जाना है। ‘ठहराए गए थे’ कर्मवाच्य और पूर्णता दोनों बनाए रखता है, बिना किसी विस्तृत धर्मसैद्धान्तिक निष्कर्ष को जोड़े।
- source_word: εἰς ζωὴν αἰώνιον
  choice: अनन्त जीवन के लिए
  rationale: εἰς के लक्ष्यसूचक भाव को ‘के लिए’ स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: τεταγμένοι में ईश्वरीय ठहराव और मानवीय प्रतिक्रिया का सम्बन्ध
  choice: अनन्त जीवन के लिए ठहराए गए थे
  alternative: अनन्त जीवन की ओर प्रवृत्त थे
  rationale: पूर्ण कर्मवाच्य रूप का सबसे सीधा पाठ नियुक्ति या ठहराव को व्यक्त करता है। मुख्य पाठ उसी व्याकरणिक बल को रखता है, पर यह पद किस प्रकार की नियुक्ति या उसके धर्मसैद्धान्तिक क्रम को बताता है, इस पर पद से आगे कोई निष्कर्ष नहीं जोड़ता। विवादित वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण रूप अपनाया गया है। ‘गैर-यहूदी’ सामान्य पाठक के लिए स्पष्ट है; ‘वचन’, ‘प्रभु’, ‘अनन्त जीवन’ और ‘विश्वास किया’ परिचित बाइबलीय शब्दावली बनाए रखते हैं।
