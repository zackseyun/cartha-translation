  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु सामान्य पाठकों के लिए सहज रखी गई है। ‘गैर-यहूदी’ पारम्परिक ‘अन्यजाति’ की अपेक्षा आज अधिक स्पष्ट है। कारणसूचक यूनानी वाक्य को स्वाभाविक हिन्दी के ‘चूँकि…इसलिए’ ढाँचे में रखा गया है।
