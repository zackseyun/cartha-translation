  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: hi
  text: तब पौलुस और बरनबास ने निडर होकर कहा, “परमेश्वर का वचन पहले तुम्हें सुनाया जाना आवश्यक था। चूँकि तुम उसे ठुकरा रहे हो और अपने आप को अनन्त जीवन के योग्य नहीं ठहराते, इसलिए देखो, हम गैर-यहूदियों[a] की ओर मुड़ रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जातियों” अथवा “राष्ट्रों।” यहाँ यह शब्द आराधनालय में उपस्थित यहूदी श्रोताओं के विपरीत गैर-यहूदियों के लिए आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησιασάμενοί
  choice: निडर होकर कहा
  rationale: कृदन्त निर्भीक और खुलकर बोलने का भाव व्यक्त करता है। हिन्दी में इसे मुख्य क्रिया के साथ क्रियाविशेषण रूप में रखना स्वाभाविक है।
- source_word: τέ
  choice: तब
  rationale: यह हल्का संयोजक कथानक को आगे बढ़ाता है; ‘तब’ हिन्दी में प्रसंगगत प्रवाह को सहज रूप से व्यक्त करता है।
- source_word: Ὑμῖν
  choice: तुम्हें
  rationale: सम्प्रदान कारक उस आरम्भिक श्रोता-समूह को सूचित करता है जिसे वचन सुनाया जाना था।
- source_word: ἀναγκαῖον
  choice: आवश्यक
  rationale: यह आवश्यकता या अनिवार्यता का सीधा अर्थ बनाए रखता है।
- source_word: πρῶτον
  choice: पहले
  rationale: यह क्रमगत प्राथमिकता बताता है—वचन पहले यहूदी श्रोताओं को सुनाया गया।
- source_word: λαληθῆναι
  choice: सुनाया जाना
  rationale: यूनानी में यह ‘बोला जाना’ है; ‘सुनाया जाना’ हिन्दी में श्रोताओं को वचन कहे जाने का भाव स्वाभाविक ढंग से देता है, बिना इसे अनावश्यक रूप से तकनीकी बनाने के।
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: यह स्थापित बाइबलीय अभिव्यक्ति है और परमेश्वर के सन्देश का अर्थ सुरक्षित रखती है।
- source_word: ἐπειδὴ
  choice: चूँकि
  rationale: यह गैर-यहूदियों की ओर मुड़ने का कारण प्रस्तुत करता है। हिन्दी में ‘चूँकि…इसलिए’ कारण-परिणाम सम्बन्ध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἀπωθεῖσθε
  choice: ठुकरा रहे हो
  rationale: वर्तमान रूप सक्रिय और जारी अस्वीकार को दर्शाता है; ‘ठुकराना’ धकेल देने या अस्वीकार करने की शक्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: αὐτὸν
  choice: उसे
  rationale: सर्वनाम का निकटतम व्याकरणिक पूर्वपद ‘वचन’ है; हिन्दी में ‘उसे’ इसी सन्दर्भ को स्वाभाविक रूप से बनाए रखता है।
- source_word: οὐκ ἀξίους κρίνετε ἑαυτοὺς
  choice: अपने आप को … योग्य नहीं ठहराते
  rationale: ‘ठहराते’ κρίνω के निर्णयात्मक भाव और ‘अपने आप को’ उसके आत्मवाचक बल को सुरक्षित रखता है।
- source_word: τῆς αἰωνίου ζωῆς
  choice: अनन्त जीवन के
  rationale: ‘योग्य’ के साथ सम्बन्ध को हिन्दी में ‘अनन्त जीवन के योग्य’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह श्रोताओं का ध्यान आगामी निर्णायक कथन की ओर खींचने वाला उद्गार है।
- source_word: τὰ ἔθνη
  choice: गैर-यहूदियों
  rationale: तात्कालिक विरोध आराधनालय के यहूदी श्रोताओं और गैर-यहूदी लोगों के बीच है। ‘गैर-यहूदी’ आधुनिक सामान्य हिन्दी में स्पष्ट है; शाब्दिक विकल्प ‘जातियाँ/राष्ट्र’ फुटनोट में सुरक्षित है।
theological_decisions:
- issue: उद्धार-ऐतिहासिक प्रसंग में τὰ ἔθνη का अर्थ
  choice: गैर-यहूदी
  alternative: जातियाँ या राष्ट्र
  rationale: तात्कालिक प्रसंग में ‘तुम’ आराधनालय के यहूदी श्रोताओं को और τὰ ἔθνη उनसे भिन्न गैर-यहूदियों को दर्शाता है। मुख्य पाठ इस विरोध को स्पष्ट रखता है, जबकि व्यापक शाब्दिक अर्थ फुटनोट में दिया गया है।
- issue: οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς का कर्ता और बल
  choice: श्रोता अपने आप को अनन्त जीवन के योग्य नहीं ठहराते
  alternative: पौलुस उन्हें अनन्त जीवन के अयोग्य घोषित करते हैं
  rationale: यूनानी पाठ में निर्णय की क्रिया श्रोताओं पर ही रखी गई है और ἑαυτούς आत्मवाचक है। अनुवाद इसी तनाव को बनाए रखता है और उससे आगे कोई धर्मसैद्धान्तिक निष्कर्ष नहीं जोड़ता।
