source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: hi
  text: और अब देख, प्रभु का हाथ तुझ पर है। तू कुछ समय तक अंधा रहेगा और सूर्य को नहीं देखेगा। उसी क्षण उस पर धुंध और अंधकार छा गए, और वह इधर-उधर घूमकर ऐसे लोगों को खोजने लगा जो उसका हाथ पकड़कर उसे ले चलें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देख
  rationale: आधुनिक हिन्दी में स्वाभाविक ध्यानाकर्षक शब्द; यूनानी की संकेतात्मक और आकस्मिक बलवत्ता बनाए रखता है।
- source_word: χεὶρ κυρίου
  choice: प्रभु का हाथ
  rationale: ईश्वरीय सक्रिय सामर्थ्य और यहाँ न्याय को सूचित करने वाला बाइबलीय रूपक अक्षुण्ण रखा गया है।
- source_word: ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον
  choice: तू ... अंधा रहेगा और सूर्य को नहीं देखेगा
  rationale: भविष्यकाल और सूर्य के स्पष्ट उल्लेख को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἄχρι καιροῦ
  choice: कुछ समय तक
  rationale: एक अस्थायी किंतु अनिर्दिष्ट अवधि का स्वाभाविक हिन्दी रूप।
- source_word: παραχρῆμα
  choice: उसी क्षण
  rationale: घटना की तत्कालता और आकस्मिकता स्पष्ट करता है।
- source_word: ἀχλὺς καὶ σκότος
  choice: धुंध और अंधकार
  rationale: दृष्टि पर छाने वाली अस्पष्टता और अंधकार की संयुक्त ठोस छवि बनाए रखता है।
- source_word: περιάγων
  choice: इधर-उधर घूमकर
  rationale: मूल का घूमने या चारों ओर जाने का भाव रखता है, बिना 'टटोलने' का अर्थ स्पष्ट रूप से जोड़े।
- source_word: ἐζήτει χειραγωγούς
  choice: ऐसे लोगों को खोजने लगा जो उसका हाथ पकड़कर उसे ले चलें
  rationale: χειραγωγός के विशिष्ट अर्थ—हाथ पकड़कर मार्ग दिखाने वाला—को सामान्य पाठक के लिए स्पष्ट करता है।
theological_decisions:
- issue: ‘प्रभु का हाथ’ का स्वरूप
  choice: रूपक को ‘प्रभु का हाथ’ के रूप में बनाए रखा
  alternative: प्रभु का दंड तुझ पर है / प्रभु तुझे मार रहा है
  rationale: संदर्भ में यह ईश्वरीय न्यायपूर्ण हस्तक्षेप है, पर अनुवाद मूल बाइबलीय रूपक को व्याख्यात्मक कथन से प्रतिस्थापित नहीं करता।
