  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक घोषणा के अनुरूप है। एलीमास को संबोधन में एकवचन ‘तू/तुझ’ मूल के द्वितीय पुरुष एकवचन और कठोर न्याय-वचन की सीधाई को दर्शाता है।
