source:
  edition: SBLGNT
  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: hi
  text: क्योंकि दाऊद ने अपनी पीढ़ी में परमेश्वर के उद्देश्य की सेवा करने के बाद[a] सो गया[b], अपने पितरों के पास जा मिला[c] और उसने सड़न देखी[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की इच्छा के अनुसार अपनी पीढ़ी की सेवा करने के after।” यूनानी वाक्यरचना दोनों अर्थों की अनुमति देती है।
    reason: syntactic_alternative
  - marker: b
    text: “सो गया” मृत्यु के लिए बाइबिल में प्रयुक्त एक शिष्ट रूपक है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, “अपने पितरों के पास जोड़ दिया गया”; यह मृत्यु में अपने पूर्वजों के साथ हो जाने का बाइबिलीय मुहावरा है।
    reason: lexical_alternative
  - marker: d
    text: अर्थात उसका शरीर सड़ गया; अगले पद में इसके विपरीत बात कही गई है।
    reason: context_note
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ
  choice: अपनी पीढ़ी में
  rationale: यह दत्तिव पदबंध दाऊद की सेवा के समय और ऐतिहासिक दायरे को व्यक्त कर सकता है। ‘अपनी पीढ़ी में’ इस अर्थ को स्वाभाविक ढंग से रखता है और इसे अनावश्यक रूप से ‘अपनी पीढ़ी के लिए’ नहीं बनाता।
- source_word: ὑπηρετήσας
  choice: सेवा करने के बाद
  rationale: एओरिस्ट कृदंत मुख्य क्रियाओं से पहले की सेवा को दर्शाता है। यह रूप क्रम को स्पष्ट करता है और ‘सेवा’ यूनानी क्रिया की व्यापकता बनाए रखता है।
- source_word: τῇ τοῦ θεοῦ βουλῇ
  choice: परमेश्वर के उद्देश्य की
  rationale: βουλή का अर्थ यहाँ उद्देश्य, अभिप्राय या इच्छा हो सकता है। ‘उद्देश्य’ आधुनिक हिन्दी में सहज है और परमेश्वर के अभिप्राय को व्यक्त करता है, यद्यपि वाक्य के दत्तिव पदबंधों का संबंध व्याकरणतः एक से अधिक प्रकार से समझा जा सकता है।
- source_word: ἐκοιμήθη
  choice: सो गया
  rationale: मूल में मृत्यु के लिए प्रयुक्त नींद का रूपक सुरक्षित रखा गया है; संदर्भ से मृत्यु का अर्थ स्पष्ट है।
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: अपने पुरखों में मिला दिया गया
  rationale: यह सामी शैली का मुहावरा है, जिसका आशय मृत्यु में अपने पूर्वजों के साथ हो जाना है। चुना हुआ रूप मूल के कर्मवाच्य और ‘पुरखों’ की पारिवारिक छवि को बनाए रखता है।
- source_word: εἶδεν διαφθοράν
  choice: उसने सड़न देखी
  rationale: यह मूल अभिव्यक्ति का निकट अनुवाद है और अगले पद में आने वाले विरोध को सुरक्षित रखता है; आशय शरीर के सड़ने से है।
theological_decisions:
- issue: दत्तिव पदबंधों ἰδίᾳ γενεᾷ और τῇ τοῦ θεοῦ βουλῇ का परस्पर संबंध
  choice: अपनी पीढ़ी में परमेश्वर के उद्देश्य की सेवा करने के बाद
  alternative: परमेश्वर की इच्छा के अनुसार अपनी पीढ़ी की सेवा करने के बाद
  rationale: यूनानी वाक्यरचना दोनों संबंधों की संभावना देती है। मुख्य पाठ व्यापक रूप से स्वीकृत समझ को रखता है, जबकि पादटिप्पणी वास्तविक व्याकरणिक विकल्प को स्पष्ट करती है।
- issue: दाऊद की मृत्यु के लिए नींद का रूपक
  choice: सो गया
  alternative: मर गया
  rationale: मूल क्रिया मृत्यु को सीधे कहने के बजाय सोने का रूपक अपनाती है। इसे बनाए रखना पाठ की बाइबिलीय अभिव्यक्ति को सुरक्षित रखता है और अपने आप कोई अतिरिक्त सैद्धांतिक निष्कर्ष नहीं जोड़ता।
- issue: διαφθορά का शारीरिक आशय
  choice: सड़न देखी
  alternative: नाश का अनुभव किया
  rationale: संदर्भ, विशेषकर अगले पद का विरोध, शरीर के सड़ने की ओर संकेत करता है। निकट अनुवाद भजन के उद्धरण से शब्दगत संबंध भी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली अपनाई गई है। ‘दाऊद’, ‘परमेश्वर’, ‘पुरखे’ और ‘सड़न’ सामान्य पाठक के लिए बोधगम्य हैं। मृत्यु के मूल रूपक तथा वाक्यरचनात्मक अस्पष्टता को पादटिप्पणियों सहित सुरक्षित रखा गया है।
