reference: Acts 13:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: κἀκεῖθεν ᾐτήσαντο βασιλέα, καὶ ἔδωκεν αὐτοῖς ὁ θεὸς τὸν Σαοὺλ υἱὸν Κίς, ἄνδρα ἐκ φυλῆς Βενιαμίν, ἔτη τεσσεράκοντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: hi
  text: इसके बाद उन्होंने अपने लिए एक राजा माँगा[a], और परमेश्वर ने उन्हें कीश के पुत्र शाऊल को, जो बिन्यामीन के गोत्र का एक पुरुष था, चालीस वर्ष के लिए दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वहाँ से उन्होंने अपने लिए एक राजा माँगा।” आरम्भिक यूनानी पद ऐतिहासिक क्रम में संक्रमण दिखा सकता है और उसका अधिक शाब्दिक अर्थ “वहाँ से” है।
    reason: lexical_alternative
  - marker: b
    text: पुराने नियम के कालक्रम से तुलना करने पर “चालीस वर्ष” के विषय में प्रश्न उठ सकते हैं; अनुवाद यहाँ लूका के कथन को जैसा है वैसा ही सुरक्षित रखता है।
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: इसके बाद
  rationale: यह पद पिछले ऐतिहासिक क्रम को आगे बढ़ाता है। यहाँ स्थानगत ‘वहाँ से’ की अपेक्षा कालक्रम-सूचक ‘इसके बाद’ स्वाभाविक हिन्दी है और यूनानी पद के संक्रमणकारी अर्थ को सुरक्षित रखता है।
- source_word: ᾐτήσαντο
  choice: उन्होंने अपने लिए ... माँगा
  rationale: मध्यवाच्य रूप लोगों द्वारा अपने लिए किए गए अनुरोध को व्यक्त करता है। ‘माँगा’ सहज है और ‘हठ किया’ जैसा अतिरिक्त भाव नहीं जोड़ता।
- source_word: βασιλέα
  choice: एक राजा
  rationale: अनिश्चित रूप किसी पहले से पहचाने हुए व्यक्ति के बजाय माँगे गए शासक के प्रकार को दर्शाता है।
- source_word: ἔδωκεν
  choice: दिया
  rationale: सामान्य क्रिया का सीधा अर्थ रखा गया है; ‘नियुक्त किया’ या ‘प्रदान किया’ अर्थ को अनावश्यक रूप से संकरा या व्याख्यात्मक बना सकता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: यूनानी में स्पष्ट कर्ता को मानक, गरिमापूर्ण हिन्दी पद से व्यक्त किया गया है।
- source_word: τὸν Σαοὺλ
  choice: शाऊल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: υἱὸν Κίς
  choice: कीश के पुत्र
  rationale: वंश-सूचक पदबंध का स्वाभाविक और औपचारिक हिन्दी रूप।
- source_word: ἄνδρα
  choice: एक पुरुष
  rationale: ἀνήρ यहाँ वयस्क पुरुष शाऊल का वर्णन करता है; ‘पुरुष’ अर्थ और गरिमा दोनों को बनाए रखता है।
- source_word: ἐκ φυλῆς Βενιαμίν
  choice: बिन्यामीन के गोत्र का
  rationale: यह शाऊल की गोत्रीय उत्पत्ति स्पष्ट करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἔτη τεσσεράκοντα
  choice: चालीस वर्ष के लिए
  rationale: कर्मकारक पदबंध अवधि व्यक्त करता है और निकटतम मुख्य कथन—परमेश्वर द्वारा शाऊल को दिए जाने—से स्वाभाविक रूप से जुड़ता है।
theological_decisions:
- issue: ἔτη τεσσεράκοντα की अवधि किससे जुड़ती है
  choice: ‘चालीस वर्ष के लिए’ को परमेश्वर द्वारा शाऊल दिए जाने, अर्थात उसके राजकीय काल, से जोड़ा गया है।
  alternative: इसे ऐतिहासिक सारांश में अधिक ढीले रूप से समझा जा सकता है; पुराने नियम के कालक्रम से तुलना करने पर कुछ पाठकों को प्रश्न दिखाई दे सकते हैं।
  rationale: यूनानी वाक्यक्रम में अवधि निकटवर्ती कथन से सबसे स्वाभाविक रूप से जुड़ती है। अनुवाद लूका के कथन को यथावत रखता है और कालक्रम का सामंजस्य बैठाने का प्रयास नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज पर गरिमापूर्ण शैली। ‘इसके बाद’ कथात्मक क्रम को स्वाभाविक बनाता है; ‘अपने लिए’ मध्यवाच्य का भाव रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
