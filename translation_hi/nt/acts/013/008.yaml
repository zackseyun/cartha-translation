id: ACT.13.8
reference: Acts 13:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀνθίστατο δὲ αὐτοῖς Ἐλύμας ὁ μάγος, οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ, ζητῶν διαστρέψαι τὸν ἀνθύπατον ἀπὸ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
translation:
  language: hi
  text: परन्तु एलीमास जादूगर[b] उनका विरोध कर रहा था—क्योंकि उसके नाम का अर्थ यही है—और प्रोकौंसुल को विश्वास[a] से दूर करने का प्रयत्न कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अर्थ: “मसीही विश्वास से दूर।” यूनानी पदबंध का अर्थ विशेष रूप से मसीही विश्वास से दूर करना या अधिक सामान्य रूप से विश्वास करने से रोकना—दोनों हो सकता है।'
    reason: alternative_reading
  - marker: b
    text: “एलीमास” को यहाँ अनूदित या अर्थ समझाए गए नाम के रूप में प्रस्तुत किया गया है; इसकी ठीक व्युत्पत्ति अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθίστατο
  choice: विरोध किया
  rationale: अपूर्ण काल लगातार या जारी विरोध का भाव देता है; हिन्दी में यह सहज है, जबकि संदर्भ उस निरंतरता को स्पष्ट करता है।
- source_word: δὲ
  choice: परन्तु
  rationale: पिछले प्रसंग की अनुकूल प्रतिक्रिया के विपरीत एलीमास के विरोध को दर्शाता है।
- source_word: αὐτοῖς
  choice: उनका
  rationale: मूल पाठ के सर्वनाम को बनाए रखता है और पौलुस तथा बरनबास को अनावश्यक रूप से दोहराता नहीं।
- source_word: Ἐλύμας
  choice: एलीमास
  rationale: व्यक्तिनाम का प्रचलित देवनागरी लिप्यंतरण।
- source_word: ὁ μάγος
  choice: जादूगर
  rationale: μάγος के अर्थ-क्षेत्र को सामान्य आधुनिक हिन्दी में व्यक्त करता है और ‘टोना करनेवाला’ जैसी अधिक निंदात्मक व्याख्या नहीं जोड़ता।
- source_word: οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ
  choice: क्योंकि उसके नाम का अनुवाद यही है
  rationale: नाम के अनुवाद अथवा अर्थ-व्याख्या को सूचित करनेवाले यूनानी कथन को स्वाभाविक हिन्दी में बनाए रखता है; व्युत्पत्ति की अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: ζητῶν
  choice: प्रयत्न कर रहा था
  rationale: मुख्य विरोध के साथ चल रहे उद्देश्यपूर्ण प्रयास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διαστρέψαι
  choice: दूर करने
  rationale: व्यक्ति को किसी बात से हटाने के संदर्भ में ἀπό के साथ प्रयुक्त क्रिया का आशय स्पष्ट करता है, बिना ‘भ्रष्ट करना’ जैसी अतिरिक्त नैतिक छाया जोड़े।
- source_word: τὸν ἀνθύπατον
  choice: सूबेदार
  rationale: रोमी प्रांतीय अधिकारी के ऐतिहासिक पद को दर्शाने वाला परिचित बाइबलीय हिन्दी शब्द; इसे सामान्य ‘राज्यपाल’ कहने से पद की विशिष्टता घटती।
- source_word: ἀπὸ τῆς πίστεως
  choice: विश्वास से दूर
  rationale: πίστις का मूल अर्थ ‘विश्वास’ सुरक्षित रहता है; निश्चित लेख के कारण ‘मसीही विश्वास’ का संकेत संभव है, पर हिन्दी में जानबूझकर ऐसा रूप रखा गया है जो व्यक्तिगत विश्वास और विश्वास-मत, दोनों संभावनाएँ खुली रखता है।
theological_decisions:
- issue: πίστις का निश्चित अथवा सामान्य अर्थ
  choice: विश्वास से दूर
  alternative: मसीही विश्वास से दूर
  rationale: यूनानी निश्चित लेख संदर्भ में मसीही विश्वास की ओर संकेत कर सकता है, पर पदबंध विश्वास करने की प्रतिक्रिया से दूर करने का अर्थ भी दे सकता है। मुख्य पाठ इस वास्तविक अस्पष्टता को सुरक्षित रखता है और पादटिप्पणी दोनों आयाम स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। व्याख्यात्मक वाक्यांश के लिए दीर्घ विराम-चिह्न रखा गया है। ‘सूबेदार’ ऐतिहासिक पद की विशिष्टता बनाए रखता है, जबकि पादटिप्पणियाँ नाम और πίστις की वास्तविक अनिश्चितता सुरक्षित रखती हैं।
