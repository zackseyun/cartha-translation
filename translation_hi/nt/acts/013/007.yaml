  text: ὃς ἦν σὺν τῷ ἀνθυπάτῳ Σεργίῳ Παύλῳ, ἀνδρὶ συνετῷ. οὗτος προσκαλεσάμενος Βαρναβᾶν καὶ Σαῦλον ἐπεζήτησεν ἀκοῦσαι τὸν λόγον τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: hi
  text: वह रोमी प्रांताध्यक्ष सर्गियुस पौलुस के साथ था, जो एक समझदार व्यक्ति था। इस प्रांताध्यक्ष ने बरनबास और शाऊल को अपने पास बुलवाया और परमेश्वर का वचन सुनने की इच्छा की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθυπάτῳ
  choice: सूबेदार
  rationale: यह रोमी प्रांतीय अधिकारी की विशिष्ट उपाधि है। आधुनिक हिन्दी में ‘सूबेदार’ सहज है, यद्यपि आज इसके अन्य प्रशासनिक और सैनिक प्रयोग भी मिलते हैं।
- source_word: σὺν
  choice: के साथ
  rationale: यहाँ संगति या साथ होने का सीधा और स्वाभाविक अर्थ है।
- source_word: ἀνδρὶ συνετῷ
  choice: समझदार व्यक्ति
  rationale: συνετός बुद्धि, समझ और विवेक का बोध देता है; ‘समझदार’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है और नैतिक सद्गुण का अनावश्यक दावा नहीं जोड़ता।
- source_word: οὗτος
  choice: उसने
  rationale: यूनानी संकेतवाचक का संदर्भ सूबेदार से है। हिन्दी में संज्ञा को पिछले वाक्य में दोहराकर फिर ‘उसने’ कहना संदर्भ को स्पष्ट और प्रवाहपूर्ण रखता है।
- source_word: προσκαλεσάμενος
  choice: अपने पास बुलवाया
  rationale: मध्यवाच्य कृदंत किसी को अपने पास बुलाने की पहल बताता है; अधिकारी के प्रसंग में ‘बुलवाया’ स्वाभाविक है और अनिवार्य रूप से बलप्रयोग नहीं दर्शाता।
- source_word: ἐπεζήτησεν
  choice: इच्छा की
  rationale: क्रिया यहाँ उत्सुकतापूर्वक चाहने या प्रयास करने का भाव देती है। ‘इच्छा की’ अगले अनंत क्रियार्थक ‘सुनने’ के साथ स्वाभाविक हिन्दी बनाती है।
- source_word: ἀκοῦσαι
  choice: सुनने
  rationale: यह यूनानी अनंत क्रिया का सीधा तथा प्रसंगानुकूल रूप है।
- source_word: λόγον τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: यह स्रोत की संबंधवाचक संरचना और परिचित बाइबलीय अभिव्यक्ति को बनाए रखता है; प्रसंग में इसका आशय परमेश्वर से आने वाला सुनाया गया संदेश है।
- source_word: Σεργίῳ Παύλῳ
  choice: सर्गियुस पौलुस
  rationale: नाम को प्रचलित देवनागरी ध्वन्यंतरण में रखा गया है।
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: बरनबास और शाऊल
  rationale: व्यक्तिनामों को प्रचलित हिन्दी बाइबल-रूपों में ध्वन्यंतरित किया गया है।
theological_decisions:
- issue: λόγον τοῦ θεοῦ का अनुवाद
  choice: परमेश्वर का वचन
  alternative: परमेश्वर का संदेश
  rationale: ‘वचन’ स्रोत की शब्दावली को अधिक प्रत्यक्ष रूप से सुरक्षित रखता है, जबकि प्रसंग में प्रचारित संदेश का अर्थ भी समाहित है; किसी अतिरिक्त सिद्धान्तगत अर्थ को निश्चित नहीं किया गया।
- issue: सर्गियुस पौलुस के लिए συνετῷ की अर्थछाया
  choice: समझदार व्यक्ति
  alternative: बुद्धिमान व्यक्ति; विवेकी व्यक्ति
  rationale: यह बौद्धिक समझ या विवेक की सकारात्मक विशेषता बताता है, पर इसे धार्मिक या नैतिक सद्गुण के रूप में बढ़ाकर नहीं कहता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। यूनानी का पहला संबंधवाचक खंड पिछले पद के व्यक्ति की ओर संकेत करता है; इस पद को स्वतंत्र रूप से सुबोध बनाने के लिए ‘वह’ रखा गया है। लंबे यूनानी वाक्य को हिन्दी में तीन छोटे वाक्यों में बाँटा गया है ताकि ‘समझदार व्यक्ति’ स्पष्टतः सूबेदार सर्गियुस पौलुस का वर्णन करे।
