  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: hi
  text: तब पौलुस खड़ा हुआ और हाथ से इशारा करके बोला, “इस्राएली पुरुषो और तुम जो परमेश्वर का भय मानते हो,[a] सुनो!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर-भक्तो।” यह पदबंध सम्भवतः आराधनालय से जुड़े उन गैर-यहूदियों की ओर संकेत करता है जो इस्राएल के परमेश्वर की उपासना करते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: खड़ा हुआ
  rationale: यह पौलुस के बोलने से पहले उठ खड़े होने की ठोस शारीरिक क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ विरोध नहीं, बल्कि कथा की अगली घटना की ओर बढ़ने का संकेत देता है; ‘तब’ हिन्दी में इस क्रम को सहज रूप से व्यक्त करता है।
- source_word: κατασείσας τῇ χειρὶ
  choice: हाथ से संकेत करके
  rationale: यह ध्यान आकर्षित करने या शान्त होने का संकेत देनेवाली हाथ की गति को व्यक्त करता है और अनावश्यक रूप से ‘हाथ हिलाने’ का अर्थ नहीं देता।
- source_word: εἶπεν
  choice: बोला
  rationale: प्रत्यक्ष संबोधन से पहले आनेवाली सामान्य कथात्मक वाणी-क्रिया के लिए यह स्वाभाविक हिन्दी है।
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: इस्राएली पुरुषो
  rationale: यह सम्बोधन के पुरुषवाचक रूप और इस्राएली पहचान, दोनों को बनाए रखता है।
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: परमेश्वर का भय माननेवालो
  rationale: यह कृदन्त पदबंध की क्रियात्मक शक्ति को बनाए रखता है और पाठकों के लिए किसी तकनीकी पद की अपेक्षा अधिक स्पष्ट है।
- source_word: ἀκούσατε
  choice: सुनो
  rationale: यह ध्यानपूर्वक सुनने की आज्ञा को संक्षिप्त, प्रत्यक्ष और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सभा में इस्राएलियों और परमेश्वर का भय माननेवाले दूसरे समूह का संबोधन
  choice: “इस्राएली पुरुषो और परमेश्वर का भय माननेवालो”
  alternative: “इस्राएली पुरुषो और परमेश्वर-भक्तो”
  rationale: यूनानी पाठ इस्राएलियों और परमेश्वर का भय माननेवाले एक दूसरे समूह में भेद करता है। चुना हुआ अनुवाद उस भेद और मूल पदबंध की क्रियात्मक भाषा को बनाए रखता है, जबकि यह निश्चित रूप से नहीं जोड़ता कि दूसरे समूह के सभी लोग गैर-यहूदी थे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और मौखिक संबोधन के अनुकूल शैली। ‘भय माननेवालो’ बाइबलीय भाव को बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य है; पदटिप्पणी सम्भावित ऐतिहासिक संदर्भ बताती है, पर उसे मुख्य पाठ में निश्चित नहीं करती।
