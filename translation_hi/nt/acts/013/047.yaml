source:
  edition: SBLGNT
  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: hi
  text: 'क्योंकि प्रभु ने हमें यह आज्ञा दी है: “मैंने तुम्हें राष्ट्रों के लिए ज्योति ठहराया है[a], ताकि तुम पृथ्वी के छोर तक उद्धार के लिए हो[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गैर-यहूदियों के लिए ज्योति।” यूनानी शब्द ἐθνῶν का अर्थ “राष्ट्रों” या अनेक प्रसंगों में “गैर-यहूदियों” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “पृथ्वी के छोरों तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως γὰρ
  choice: क्योंकि ... यह
  rationale: γάρ पिछले कथन का आधार बताता है, और οὕτως आगामी उद्धरण की ओर संकेत करता है; स्वाभाविक हिन्दी में ‘क्योंकि ... यह’ दोनों का बल व्यक्त करता है।
- source_word: ἐντέταλται ἡμῖν
  choice: हमें यह आज्ञा दी है
  rationale: पूर्णकालिक रूप ऐसी दी हुई आज्ञा दर्शाता है जिसका प्रभाव बना हुआ है; यह हिन्दी में अधिकार और वर्तमान प्रासंगिकता दोनों बनाए रखता है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: यह उद्धृत पवित्रशास्त्र के दिव्य वक्ता को सूचित करता है; ‘प्रभु’ प्रचलित, गरिमापूर्ण और धर्मवैज्ञानिक रूप से उपयुक्त है।
- source_word: Τέθεικά σε
  choice: मैंने तुम्हें ... ठहराया है
  rationale: τίθημι का पूर्णकाल किसी स्थापित नियुक्ति को व्यक्त करता है; ‘ठहराया है’ हिन्दी में इस नियुक्ति का भाव स्वाभाविक रूप से देता है।
- source_word: εἰς φῶς ἐθνῶν
  choice: राष्ट्रों के लिए ज्योति
  rationale: εἰς नियुक्त भूमिका को और φῶς रूपक को व्यक्त करता है। ἐθνῶν का व्यापक अर्थ ‘राष्ट्रों’ मुख्य पाठ में रखा गया है, जबकि ‘गैर-यहूदियों’ का संदर्भगत विकल्प पादटिप्पणी में दिया गया है।
- source_word: τοῦ εἶναί σε εἰς σωτηρίαν
  choice: ताकि तुम ... उद्धार का माध्यम बनो
  rationale: τοῦ सहित क्रियार्थक संज्ञा उद्देश्य/परिणाम दर्शाती है। हिन्दी में केवल ‘उद्धार के लिए बनो’ अस्वाभाविक है; ‘उद्धार का माध्यम’ अर्थ स्पष्ट करता है, पर यह दावा नहीं करता कि सम्बोधित व्यक्ति स्वयं ही उद्धार है।
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: पृथ्वी के छोर तक
  rationale: यूनानी में ἐσχάτου एकवचन है और पृथ्वी की चरम सीमा का बोध कराता है; ‘छोर तक’ इस रूप और अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: यशायाह के सेवक-वचन का पौलुस और बरनबास के मिशन पर प्रयोग
  choice: उद्धरण में एकवचन ‘तुम्हें/तुम’ बनाए रखा गया है और सम्बोधित व्यक्ति की पहचान स्पष्ट करके नहीं जोड़ी गई।
  alternative: मुख्य पाठ में उद्धरण को बहुवचन बनाना या स्पष्ट रूप से प्रेरितों अथवा मसीह के विषय में बताना।
  rationale: यूनानी पाठ सीधे एकवचन में पवित्रशास्त्र उद्धृत करता है और सेवक-वचन तथा प्रेरितीय मिशन के सम्बन्ध को निहित छोड़ता है; अनुवाद उसी धर्मवैज्ञानिक तनाव को बनाए रखता है।
- issue: εἰς σωτηρίαν में सम्बोधित व्यक्ति और उद्धार का सम्बन्ध
  choice: ‘उद्धार का माध्यम’
  alternative: ‘उद्धार बनो’
  rationale: ‘माध्यम’ स्वाभाविक हिन्दी में उद्देश्य का भाव देता है और यह अनावश्यक रूप से निर्धारित नहीं करता कि सम्बोधित व्यक्ति स्वयं उद्धार है या उद्धार पहुँचाने वाला; फिर भी ‘बनो’ द्वारा यूनानी εἶναι की रचना बची रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। उद्धरण की एकवचन सम्बोधन-रचना और मूल की धर्मवैज्ञानिक अनिर्णीतता सुरक्षित रखी गई है; संस्कृतनिष्ठ जटिलता से बचते हुए ‘प्रभु’, ‘ज्योति’ और ‘उद्धार’ जैसे परिचित बाइबलीय पद रखे गए हैं।
