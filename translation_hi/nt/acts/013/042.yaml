  text: Ἐξιόντων δὲ ⸀αὐτῶν ⸀παρεκάλουν εἰς τὸ μεταξὺ σάββατον λαληθῆναι αὐτοῖς τὰ ῥήματα ⸀ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/042.yaml
  text: As they were going out[b][a], they were urging that these words be spoken to them on the next Sabbath.
translation:
  language: hi
  text: जब वे बाहर जा रहे थे[a][b], तो वे आग्रह कर रहे थे कि अगले सब्त के दिन उन्हें ये बातें सुनाई जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में अधिक स्पष्ट रूप से लिखा है, “जब पौलुस और बरनबास बाहर जा रहे थे, तो लोग आग्रह कर रहे थे कि अगले सब्त के दिन उन्हें ये बातें सुनाई जाएँ।”
    reason: textual_variant
  - marker: b
    text: इसका अनुवाद यह भी हो सकता है, “जब वे वहाँ से जा रहे थे, तो वे अनुरोध कर रहे थे कि आने वाले सब्त के दिन उन्हें ये बातें सुनाई जाएँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξιόντων
  choice: जब वे बाहर जा रहे थे
  rationale: वर्तमान कृदंत वाले संबंधकारक निरपेक्ष प्रयोग को कालसूचक उपवाक्य के रूप में रखा गया है। ‘बाहर जा रहे थे’ क्रिया की जारी अवस्था को बनाए रखता है।
- source_word: δὲ
  choice: तो
  rationale: यहाँ δέ हल्का संयोजक है; हिन्दी में ‘जब...तो’ की स्वाभाविक रचना के भीतर इसका संबंधसूचक कार्य व्यक्त होता है।
- source_word: αὐτῶν
  choice: वे
  rationale: मूल पाठ केवल सर्वनाम देता है और उसका संदर्भ पाठांतर तथा प्रसंग के कारण विवादित है। ‘वे’ मुख्य पाठ में इस अस्पष्टता को बनाए रखता है।
- source_word: παρεκάλουν
  choice: आग्रह कर रहे थे
  rationale: अपूर्ण भूतकाल जारी या बार-बार किए जा रहे अनुरोध को दिखाता है। यहाँ παρακαλέω का भाव साधारण पूछने से अधिक गंभीर अनुरोध का है।
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: अगले सब्त के दिन
  rationale: यह यूनानी पदबंध बीच में आने वाले, अर्थात अगले, सब्त की ओर संकेत करता है। यह आधुनिक हिन्दी में स्वाभाविक कालसूचक अभिव्यक्ति है।
- source_word: λαληθῆναι
  choice: सुनाई जाएँ
  rationale: यूनानी में कर्मवाच्य अनंत क्रिया है। हिन्दी में ‘उन्हें ये बातें सुनाई जाएँ’ बोलकर पहुँचाए जाने के भाव और कर्मवाच्य दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: अनंत क्रिया के साथ यह संप्रदान कारक है और हिन्दी में ‘उन्हें’ इसका स्वाभाविक रूप है।
- source_word: τὰ ῥήματα ταῦτα
  choice: ये बातें
  rationale: ῥήματα बोले गए शब्दों या बातों को दर्शाता है। ‘ये बातें’ वर्तमान हिन्दी में स्वाभाविक है और पौलुस के अभी-अभी कहे गए कथन की ओर संकेत करता है।
- source_word: (contextual implication of repetition)
  choice: फिर
  rationale: अगले सब्त पर वही बातें सुनाने के अनुरोध में पुनरावृत्ति प्रसंग से निहित है; ‘फिर’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक बनाता है, बिना विषयवस्तु बदले।
theological_decisions:
- issue: पद में आए सर्वनामों का संदर्भ
  choice: मुख्य पाठ में ‘वे’ और ‘उन्हें’ रखकर संदर्भ की अस्पष्टता बनाए रखी गई है।
  alternative: लोगों ने पौलुस और बरनबास से आग्रह किया; अथवा पौलुस और बरनबास ने लोगों से आग्रह किया।
  rationale: इस पाठरूप में कर्ताओं और संबोधित लोगों की स्पष्ट पहचान संज्ञाओं से नहीं की गई है। किसी एक व्याख्या को मुख्य पाठ में थोपने के बजाय मूल की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सब्त’ प्रचलित बाइबलीय पद है। दो बार आया ‘वे’ जानबूझकर मूल पाठ की संदर्भगत अस्पष्टता को बनाए रखता है; पादटिप्पणी पाठांतर को स्पष्ट करती है।
