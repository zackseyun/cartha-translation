source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: hi
  text: हे भाइयो[a], अब्राहम के वंश के पुत्रो, और तुममें से परमेश्वर का भय माननेवालो[b], इस उद्धार का संदेश[c] हम तक भेजा गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हे पुरुषो, भाइयो।” यूनानी संबोधन पुल्लिंग है; फिर भी यह वहाँ एकत्र व्यापक श्रोतृसमूह को संबोधित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसे “तुममें से परमेश्वर-भक्तो” भी समझा जा सकता है—सम्भवतः उन गैर-यहूदियों के लिए प्रयुक्त पद, जो आराधनालय से जुड़े थे और इस्राएल के परमेश्वर की उपासना करते थे।
    reason: cultural_note
  - marker: c
    text: या, “इस उद्धार का वचन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: हे भाइयो
  rationale: यूनानी संबोधन शाब्दिक रूप से पुल्लिंग है। ‘हे भाइयो’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है; व्यापक सभा के सम्मिलित होने की संभावना पादटिप्पणी में रखी गई है।
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: अब्राहम के वंश के पुत्रो
  rationale: υἱοί के स्पष्ट ‘पुत्र’ और γένος के कुल/वंश संबंधी अर्थ, दोनों को सुरक्षित रखता है।
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: तुममें से परमेश्वर का भय माननेवालो
  rationale: वाक्यांश को वर्णनात्मक रूप में रखा गया है; इससे सम्भावित ऐतिहासिक, अर्ध-पारिभाषिक अर्थ को मुख्य पाठ में अनिवार्य नहीं बनाया जाता।
- source_word: ἡμῖν
  choice: हमारे पास
  rationale: ἐξαπεστάλη के साथ दत्तिव ἡμῖν संदेश भेजे जाने की दिशा अथवा प्राप्तकर्ताओं को दर्शाता है। हिन्दी में ‘हमारे पास भेजा गया’ स्वाभाविक है।
- source_word: ὁ λόγος
  choice: संदेश
  rationale: इस प्रचार-संदर्भ में λόγος का आशय कही या घोषित की गई बात से है; ‘संदेश’ आधुनिक हिन्दी में अर्थ को स्पष्ट और सहज बनाता है।
- source_word: τῆς σωτηρίας ταύτης
  choice: इस उद्धार का
  rationale: 'सम्बन्धकारक रचना को जानबूझकर खुला रखा गया है: यह इस उद्धार से संबंधित या इसका संदेश हो सकता है। ‘उद्धार’ लूका–प्रेरितों के काम के धार्मिक संदर्भ में σωτηρία का उपयुक्त मानक रूप है।'
- source_word: ἐξαπεστάλη
  choice: भेजा गया है
  rationale: अओरिस्ट कर्मवाच्य भेजे जाने की पूर्ण घटना बताता है; हिन्दी का पूर्ण वर्तमान भाषण के समय उसकी वर्तमान प्रासंगिकता भी स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: φοβούμενοι τὸν θεόν द्वारा श्रोताओं की पहचान
  choice: ‘परमेश्वर का भय माननेवालो’ के रूप में वर्णनात्मक अनुवाद
  alternative: ‘परमेश्वर-भक्तो’—गैर-यहूदी आराधनालय-संबद्ध लोगों के सम्भावित ऐतिहासिक वर्ग के रूप में
  rationale: यूनानी शब्द वर्णनात्मक रूप से भी पढ़े जा सकते हैं। मुख्य पाठ में तकनीकी ऐतिहासिक वर्ग थोपे बिना यहूदी और उनके साथ आराधना करनेवाले गैर-यहूदी श्रोताओं की सम्भावना बनी रहती है।
- issue: संबोधन में पुल्लिंग संबंध-सूचक भाषा
  choice: ‘हे भाइयो’ को मुख्य पाठ में बनाए रखना
  alternative: ‘हे भाइयो और बहनो’
  rationale: यूनानी रूप व्याकरणतः पुल्लिंग है। सभा में स्त्रियाँ भी रही हों, यह सम्भव है, पर उन्हें स्पष्ट रूप से जोड़ना स्रोत से अधिक विशिष्ट होगा; व्यापक श्रोतृसमूह की सम्भावना पादटिप्पणी में दी गई है।
- issue: ‘इस उद्धार का संदेश’ में सम्बन्धकारक का आशय
  choice: संक्षिप्त सम्बन्धकारक रचना को बनाए रखना
  alternative: ‘इस उद्धार के विषय का संदेश’ अथवा ‘इस उद्धार का वचन’
  rationale: यूनानी τῆς σωτηρίας ταύτης संदेश की विषयवस्तु अथवा उसके स्वरूप/सम्बन्ध को दर्शा सकता है। हिन्दी की संक्षिप्त रचना इस लचीलेपन को पर्याप्त रूप से बचाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सार्वजनिक, गरिमापूर्ण संबोधन रखा गया है। ‘माननेवालो’ का संयुक्त रूप सामान्य आधुनिक वर्तनी के अनुरूप है। वाक्य की यूनानी संबोधन-श्रृंखला को बनाए रखते हुए हिन्दी में स्पष्टता के लिए ‘हे’ केवल आरम्भ में रखा गया है।
