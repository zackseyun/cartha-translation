  text: In him everyone who believes is justified[a].
translation:
  language: hi
  text: उसी में हर एक जो विश्वास करता है, धर्मी ठहराया जाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसी व्यक्ति के द्वारा हर एक जो विश्वास करता है, धर्मी ठहराया जाता है।” यूनानी पदबंध का अधिक शाब्दिक अनुवाद “इसी में/इसी व्यक्ति के द्वारा” हो सकता है; इसका संकेत यीशु की ओर है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: उसी में
  rationale: निकटवर्ती प्रसंग में संकेतवाचक सर्वनाम का संदर्भ यीशु से है। ‘उसी में’ व्यक्तिगत और पूर्वसंदर्भी अर्थ को स्वाभाविक हिन्दी में बनाए रखता है, जबकि यूनानी पदबंध की ‘इसी के द्वारा’ वाली संभावित छाया को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: πᾶς ὁ πιστεύων
  choice: हर एक विश्वास करनेवाला
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत सामान्य रूप से प्रत्येक विश्वास करनेवाले व्यक्ति को दर्शाता है। यह हिन्दी प्रयोग सहज है और व्यापक अर्थ बनाए रखता है।
- source_word: δικαιοῦται
  choice: धर्मी ठहराया जाता है
  rationale: यह δικαιόω के न्यायिक अर्थ को व्यक्त करता है और नैतिक रूपांतरण का अर्थ आरोपित किए बिना धर्मी घोषित किए जाने की धारणा सुरक्षित रखता है।
theological_decisions:
- issue: ἐν τούτῳ का संदर्भ
  choice: 'यीशु की ओर व्यक्तिगत संकेत: ‘उसी में’'
  alternative: ‘इसी के द्वारा’ अथवा अधिक शाब्दिक ‘इसी में’
  rationale: पिछले कथन में यीशु के द्वारा पापों की क्षमा की घोषणा हुई है; इसलिए यहाँ संकेतवाचक पद उसी व्यक्ति की ओर लौटता है। फिर भी साधनवाचक अनुवाद की वास्तविक संभावना पादटिप्पणी में दी गई है।
- issue: पौलुस के प्रसंग में δικαιοῦται का अनुवाद
  choice: ‘धर्मी ठहराया जाता है’
  alternative: ‘धर्मी घोषित किया जाता है’ अथवा ‘निर्दोष ठहराया जाता है’
  rationale: व्यवस्था और धर्मी ठहराए जाने के निकटवर्ती विरोध में न्यायिक अर्थ प्रमुख है। चुना हुआ रूप केवल निर्दोष छोड़े जाने तक अर्थ को सीमित नहीं करता और न इसे नैतिक परिवर्तन में मिला देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘धर्मी ठहराया जाता है’ बाइबलीय-न्यायिक भाव को स्पष्ट रखते हुए प्रचलित हिन्दी अभिव्यक्ति है।
