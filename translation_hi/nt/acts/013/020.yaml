  text: ⸂ὡς ἔτεσι τετρακοσίοις καὶ πεντήκοντα. καὶ μετὰ ταῦτα⸃ ἔδωκεν κριτὰς ἕως Σαμουὴλ ⸀τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: hi
  text: लगभग चार सौ पचास वर्ष तक।[a] इसके बाद परमेश्वर ने भविष्यद्वक्ता शमूएल तक न्यायी दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, कुछ अनुवादों में समय-सूचक वाक्यांश का सम्बन्ध अलग ढंग से जोड़ा गया है: “उसने भविष्यद्वक्ता शमूएल तक लगभग चार सौ पचास वर्षों के लिए न्यायी दिए।” यहाँ यूनानी शब्द-विन्यास और विराम-निर्धारण विवादित हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: लगभग
  rationale: संख्या के साथ ὡς यह बताता है कि अवधि सटीक नहीं, अनुमानित है; ‘लगभग’ आधुनिक हिन्दी में इसका स्वाभाविक समतुल्य है।
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: चार सौ पचास वर्ष तक
  rationale: दत्तिव पद समय की अवधि व्यक्त करता है। ‘वर्ष तक’ इसे हिन्दी में सहज रूप से व्यक्त करता है, जबकि वाक्य की स्रोतगत कठिनता बनी रहती है।
- source_word: καὶ μετὰ ταῦτα
  choice: इसके बाद
  rationale: यह कथानक में अगला क्रम बताता है। शाब्दिक ‘इन बातों के बाद’ की अपेक्षा ‘इसके बाद’ वर्तमान हिन्दी में अधिक स्वाभाविक है और अर्थ सुरक्षित रखता है।
- source_word: ἔδωκεν
  choice: दिए
  rationale: δίδωμι का मूल अर्थ ‘देना’ है। यहाँ परमेश्वर द्वारा न्यायियों को उपलब्ध कराने या नियुक्त करने का बाइबलीय मुहावरा सुरक्षित रखा गया है।
- source_word: κριτὰς
  choice: न्यायी
  rationale: यह इस्राएल के राजतंत्र से पहले के विशिष्ट ऐतिहासिक अगुओं को सूचित करता है; ‘न्यायी’ हिन्दी बाइबल-परंपरा में स्थापित और सटीक पद है।
- source_word: ἕως
  choice: के समय तक
  rationale: ἕως अवधि का अंतिम बिंदु बताता है। व्यक्ति के नाम के साथ ‘के समय तक’ हिन्दी में केवल ‘तक’ की अपेक्षा अधिक स्पष्ट और स्वाभाविक है।
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: शमूएल भविष्यद्वक्ता
  rationale: सम्बन्धकारक समानाधिकरण शमूएल की भूमिका बताता है; यह रूप उपाधि को सुरक्षित रखते हुए स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: ‘लगभग चार सौ पचास वर्ष’ का स्थान और सम्बन्ध
  choice: दिए गए SBLGNT पाठ के अनुसार अवधि को पहले एक स्वतंत्र कथन के रूप में रखा गया है और उसके बाद न्यायियों का उल्लेख किया गया है।
  alternative: 'अवधि को न्यायियों के दिए जाने से जोड़ना: ‘उसने लगभग चार सौ पचास वर्ष तक, शमूएल भविष्यद्वक्ता के समय तक, न्यायी दिए।’'
  rationale: इस पद का यूनानी वाक्यविन्यास और विराम-निर्धारण विवादित है। मुख्य पाठ दिए गए यूनानी क्रम का अनुसरण करता है और वैकल्पिक सम्बन्ध को पादटिप्पणी में रखता है, ताकि अनिश्चितता को सिद्धान्तगत रूप से हल न किया जाए।
- issue: ἔδωκεν में परमेश्वर कर्ता का स्पष्ट किया जाना
  choice: हिन्दी में ‘परमेश्वर ने’ स्पष्ट किया गया है।
  alternative: केवल ‘उसने’ रखकर पिछले संदर्भ से कर्ता समझना।
  rationale: यूनानी में कर्ता पूर्ववर्ती प्रसंग से निहित है। अलग अवधि-वाक्य के बाद आधुनिक हिन्दी में अस्पष्टता से बचने के लिए परमेश्वर का नाम स्पष्ट किया गया है; इससे कोई नई धर्मवैज्ञानिक धारणा नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘न्यायी’ और ‘भविष्यद्वक्ता’ जैसे स्थापित बाइबलीय पद बनाए गए हैं। मुख्य पाठ में स्रोत के असामान्य, खंडित समय-वाक्य को जानबूझकर सुरक्षित रखा गया है और पादटिप्पणी-चिह्न [a] उसी वाक्य में दिया गया है।
