  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: hi
  text: “देखो, हे तिरस्कार करनेवालो[a], चकित हो जाओ और नष्ट हो जाओ[b], क्योंकि मैं तुम्हारे दिनों में एक काम कर रहा हूँ—ऐसा काम, जिसके विषय में यदि कोई तुम्हें विस्तार से बताए[c], तो भी तुम उस पर कदापि विश्वास नहीं करोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपहास करनेवालो।” यूनानी शब्द अवमानना या तिरस्कार से व्यवहार करनेवालों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “मिट जाओ।” हबक्कूक 1:5 के यूनानी रूप से लिया गया यह वाक्यांश विनाश की गंभीर चेतावनी देता है।
    reason: alternative_reading
  - marker: c
    text: यूनानी क्रिया का अर्थ “पूरा वृत्तांत सुनाना” या “विस्तार से बताना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: देखो
  rationale: बहुवचन आज्ञार्थक क्रिया ध्यान आकर्षित करती है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक और सजीव है।
- source_word: καταφρονηταί
  choice: तिरस्कार करनेवालो
  rationale: यह संबोधन उन लोगों के लिए है जो अवमानना के साथ अस्वीकार करते हैं। यह अनुवाद मूल अर्थ को सीधे रखता है; संदर्भगत ‘उपहास करनेवालो’ को पादटिप्पणी में दिया गया है।
- source_word: θαυμάσατε
  choice: चकित हो जाओ
  rationale: आज्ञार्थक रूप और भविष्यद्वाणी के तीखे विस्मय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀφανίσθητε
  choice: नष्ट हो जाओ
  rationale: निष्क्रिय आज्ञार्थक रूप यहाँ विनाश की गंभीर चेतावनी देता है। ‘नष्ट हो जाओ’ इस न्याय-संबंधी बल को बनाए रखता है, जबकि ‘मिट जाओ’ शब्दगत विकल्प है।
- source_word: ἔργον
  choice: काम
  rationale: यह परमेश्वर के महत्त्वपूर्ण कार्य को सूचित करता है। ‘काम’ व्यापक, स्पष्ट और सामान्य हिन्दी में स्वाभाविक है।
- source_word: ἐργάζομαι ἐγώ
  choice: मैं ... कर रहा हूँ
  rationale: वर्तमानकालीन क्रिया और स्पष्ट ἐγώ परमेश्वर की सक्रिय तथा बलाघातयुक्त कार्रवाई को व्यक्त करते हैं।
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: तुम्हारे दिनों में
  rationale: मूल के काल-संदर्भ और श्रोताओं के लिए उसकी तात्कालिकता को बनाए रखता है।
- source_word: οὐ μὴ πιστεύσητε
  choice: कदापि विश्वास नहीं करोगे
  rationale: οὐ μή के प्रबल निषेध को स्पष्ट, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: यदि कोई तुम्हें विस्तार से बताए
  rationale: ἐκδιηγέομαι केवल बताने से अधिक, पूरा विवरण सुनाने का भाव रख सकता है; ‘विस्तार से बताए’ उस सूक्ष्मता को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: हबक्कूक 1:5 से लिए गए भविष्यद्वाणी-संबंधी चेतावनी-वचन की तीव्रता
  choice: ‘नष्ट हो जाओ’ और ‘कदापि विश्वास नहीं करोगे’ द्वारा न्याय और प्रबल अविश्वास की भाषा को बनाए रखना
  alternative: ‘मिट जाओ’ या अपेक्षाकृत हल्का ‘अचंभित रह जाओ’
  rationale: प्रेरितों के काम में यह उद्धरण परमेश्वर के कार्य को तिरस्कार से अस्वीकार करने के विरुद्ध गंभीर चेतावनी है। अनुवाद चेतावनी को न तो नरम करता है, न उसके आगे कोई विशिष्ट धर्मसिद्धान्त जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा और सार्वजनिक पाठ के योग्य रूप। भविष्यद्वाणी-संबंधी संबोधन की तीक्ष्णता बनाए रखी गई है; अत्यधिक संस्कृतनिष्ठ या पुरातन शब्दावली से बचा गया है।
