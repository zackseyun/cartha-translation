source:
  edition: SBLGNT
  text: λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον· Ἀφορίσατε δή μοι τὸν Βαρναβᾶν ⸀καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: hi
  text: जब वे प्रभु की सेवा[a] कर रहे थे और उपवास रख रहे थे, तब पवित्र आत्मा ने कहा, “बरनबास और शाऊल को उस काम के लिए मेरे लिए अलग कर दो, जिसके लिए मैंने उन्हें बुलाया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रभु की आराधना।” यूनानी क्रिया ऐसी सेवा को भी व्यक्त कर सकती है जिसमें आराधना या धार्मिक अनुष्ठान की छटा हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργούντων
  choice: सेवा कर रहे थे
  rationale: यह क्रिया ऐसी सेवा को व्यक्त करती है जिसमें आराधनात्मक या उपासना-संबंधी भाव हो सकते हैं। ‘सेवा’ मूल शब्द की व्यापकता बनाए रखती है; पादटिप्पणी संदर्भ में संभव ‘आराधना’ अर्थ बताती है।
- source_word: τῷ κυρίῳ
  choice: प्रभु की
  rationale: यूनानी संप्रदान कारक सेवा के लक्ष्य को बताता है। हिंदी में ‘प्रभु की सेवा’ स्वाभाविक रूप से ‘प्रभु के प्रति/लिए सेवा’ का अर्थ देता है।
- source_word: νηστευόντων
  choice: उपवास रख रहे थे
  rationale: यह वर्तमान कृदंत की समकालिक और जारी क्रिया को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: यह आधुनिक हिंदी में मानक पद है और यूनानी वाक्य की तरह पवित्र आत्मा को बोलने वाले व्यक्तिगत कर्ता के रूप में रखता है।
- source_word: Ἀφορίσατε δή μοι
  choice: मेरे निमित्त अलग कर दो
  rationale: ‘अलग कर दो’ किसी विशेष उद्देश्य के लिए पृथक करने का भाव रखता है, जबकि ‘मेरे निमित्त’ μοι का उद्देश्यपरक अर्थ स्पष्ट करता है। δή की आग्रहपूर्ण तत्परता आज्ञार्थक शैली में निहित है।
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: बरनबास और शाऊल
  rationale: व्यक्तिनाम प्रचलित हिंदी बाइबलीय रूपों में लिप्यंतरित किए गए हैं।
- source_word: εἰς τὸ ἔργον
  choice: उस काम के लिए
  rationale: ‘काम’ ἔργον की व्यापकता बनाए रखता है और इसे तकनीकी ‘सेवकाई’ या किसी पद तक सीमित नहीं करता।
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: जिसके लिए मैंने उन्हें बुलाया है
  rationale: पूर्णकालिक यूनानी रूप पहले दिए गए बुलावे और उसके वर्तमान प्रभाव को व्यक्त करता है; हिंदी पूर्ण पक्ष ‘बुलाया है’ इसे स्वाभाविक ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: सामुदायिक भक्ति के संदर्भ में λειτουργούντων का अर्थ
  choice: प्रभु की सेवा कर रहे थे
  alternative: प्रभु की आराधना कर रहे थे
  rationale: मूल क्रिया में सेवा और आराधनात्मक/अनुष्ठानिक सेवा दोनों की छाया हो सकती है। मुख्य पाठ में व्यापक ‘सेवा’ रखा गया है और वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: τὸ πνεῦμα τὸ ἅγιον का कर्तृत्व और व्यक्तित्व
  choice: पवित्र आत्मा ने कहा
  alternative: कोई अवैयक्तिक दिव्य प्रेरणा हुई
  rationale: यूनानी पाठ सीधे पवित्र आत्मा को बोलने वाला कर्ता बताता है; अनुवाद इसे बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- issue: ἀφορίσατε ... εἰς τὸ ἔργον का आशय
  choice: काम के लिए ... अलग कर दो
  alternative: सेवकाई में नियुक्त कर दो
  rationale: पाठ एक विशेष कार्य के लिए दिव्य पृथक्करण बताता है, पर यहाँ तकनीकी अभिषेक, नियुक्ति या कलीसियाई पद को निर्दिष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सेवा’ और ‘आराधना’ के बीच मूल शब्द की अर्थगत व्यापकता पादटिप्पणी द्वारा सुरक्षित है; ‘काम’ को किसी तकनीकी कलीसियाई पद या विधि तक सीमित नहीं किया गया।
