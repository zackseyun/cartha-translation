source:
  edition: SBLGNT
  text: ὃς ὤφθη ἐπὶ ἡμέρας πλείους τοῖς συναναβᾶσιν αὐτῷ ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ, οἵτινες ⸀νῦν εἰσὶ μάρτυρες αὐτοῦ πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/031.yaml
  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: hi
  text: वह बहुत दिनों तक उन लोगों को दिखाई दिया[a], जो उसके साथ गलील से यरूशलेम गए थे। वे अब लोगों[b] के सामने उसके गवाह हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत दिनों तक देखा गया।” पुनरुत्थान के बाद दिखाई देने के संदर्भों में यूनानी क्रिया का अधिक शब्दशः अनुवाद इस प्रकार भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “लोगों” से सम्भवतः विशेष रूप से यहूदी लोग, अर्थात इस्राएल के लोग, अभिप्रेत हैं।
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: वह
  rationale: यह संबंधवाचक सर्वनाम पिछले पद में उल्लिखित यीशु की ओर संकेत करता है। स्वतंत्र हिन्दी वाक्य के आरम्भ में ‘वह’ स्वाभाविक है और संदर्भ स्पष्ट रखता है।
- source_word: ὤφθη
  choice: दिखाई दिया
  rationale: ὁράω का यह रूप पुनरुत्थान के बाद के दर्शनों के संदर्भ में ‘प्रकट हुआ’ या अधिक रूपात्मक ढंग से ‘देखा गया’ व्यक्त कर सकता है। ‘दिखाई दिया’ दोनों पहलुओं को स्वाभाविक हिन्दी में निकटता से बनाए रखता है।
- source_word: ἐπὶ ἡμέρας πλείους
  choice: बहुत दिनों तक
  rationale: ἐπί और कर्मकारक यहाँ समयावधि बताते हैं। यह अनुवाद अवधि को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: उन लोगों को, जो उसके साथ ... गए थे
  rationale: समुच्चययुक्त कृदंत उन लोगों को बताता है जो यीशु के साथ यात्रा पर गए थे। ‘गए थे’ इस यात्रा के दर्शनों से पहले होने को स्वाभाविक ढंग से दर्शाता है।
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: गलील से यरूशलेम
  rationale: भौगोलिक आरम्भ और गंतव्य को सीधे व्यक्त किया गया है। हिन्दी में ‘ऊपर गए’ कहना यहाँ अनावश्यक रूप से भौतिक ऊँचाई पर बल दे सकता है।
- source_word: οἵτινες νῦν εἰσὶν
  choice: वे ही अब ... हैं
  rationale: οἵτινες उसी समूह की पहचान गवाहों के रूप में कराता है। ‘वे ही’ इस पहचानात्मक बल को हिन्दी में संक्षेप और स्वाभाविकता से व्यक्त करता है।
- source_word: μάρτυρες αὐτοῦ
  choice: उसके गवाह
  rationale: सम्बन्धकारक यीशु से उनका संबंध और उसके विषय में उनकी गवाही—दोनों को समेट सकता है। ‘उसके गवाह’ इस खुलापन को बनाए रखता है।
- source_word: πρὸς τὸν λαόν
  choice: लोगों के सामने
  rationale: πρός यहाँ उस जनसमूह की ओर निर्देशित गवाही को सूचित करता है। ‘के सामने’ सार्वजनिक साक्ष्य देने की भूमिका को सहज हिन्दी में व्यक्त करता है।
- source_word: λαόν
  choice: लोगों
  rationale: संदर्भ में यह सम्भवतः इस्राएल के लोगों को दर्शाता है, पर यूनानी पाठ केवल λαός कहता है; इसलिए मुख्य पाठ में स्पष्ट विस्तार नहीं जोड़ा गया।
theological_decisions:
- issue: पुनरुत्थान के बाद दिखाई देने की भाषा
  choice: दिखाई दिया
  alternative: प्रकट हुआ; देखा गया
  rationale: ‘दिखाई दिया’ पुनरुत्थान के बाद शिष्यों द्वारा यीशु को देखने की घटना को व्यक्त करता है, पर क्रिया को केवल दर्शकों की निष्क्रिय दृष्टि या केवल अलौकिक प्रकटीकरण तक सीमित नहीं करता।
- issue: ‘लोगों’ का संदर्भ
  choice: लोगों
  alternative: इस्राएल के लोगों; यहूदी लोगों
  rationale: निकटवर्ती संदर्भ इस्राएल की ओर संकेत करता है, फिर भी मूल पाठ में यहाँ जातीय पहचान स्पष्ट रूप से नहीं जोड़ी गई। मुख्य पाठ उसकी संक्षिप्तता बनाए रखता है और टिप्पणी संदर्भ समझाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली रखी गई है। ‘यरूशलेम’ और ‘गलील’ प्रचलित बाइबलीय नामरूप हैं। दो वाक्यों में विभाजन से लम्बी यूनानी संरचना सामान्य पाठक के लिए स्पष्ट होती है।
