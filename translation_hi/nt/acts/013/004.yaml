base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: hi
  text: इस प्रकार पवित्र आत्मा द्वारा भेजे गए वे[a] सिलूकिया की ओर नीचे गए और वहाँ से जहाज़ से साइप्रस के लिए रवाना हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे स्वयं।” यूनानी में सर्वनाम स्पष्ट रूप से दिया गया है और उसमें कुछ बल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: वे
  rationale: स्पष्ट सर्वनाम को रखा गया है; हिन्दी में ‘वे’ प्रसंगानुसार हल्का बल भी वहन करता है, जबकि ‘वे स्वयं’ अनावश्यक रूप से अधिक जोर देता।
- source_word: μὲν οὖν
  choice: इसलिए
  rationale: यह संयोजन पिछले प्रसंग में हुए भेजे जाने से निष्कर्ष और कथा की आगे की गति दोनों दिखाता है; ‘इसलिए’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκπεμφθέντες
  choice: भेजे जाकर
  rationale: यह पूर्वकालिक निष्क्रिय कृदन्त है; अनुवाद निष्क्रिय भाव और मुख्य क्रियाओं से पहले हुए भेजे जाने को बनाए रखता है।
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: पवित्र आत्मा के द्वारा
  rationale: ὑπό के साथ संबंधकारक कर्ता या अभिकर्ता को दर्शाता है। प्रेरितों के काम में यह व्यक्तिगत दिव्य अभिकर्ता का संदर्भ है।
- source_word: κατῆλθον
  choice: उतर गए
  rationale: क्रिया नीचे की ओर जाने, विशेषतः तट की ओर उतरने, का ठोस भाव रखती है; ‘उतर गए’ उसे सुरक्षित रखता है।
- source_word: εἰς Σελεύκειαν
  choice: सिलूकिया को
  rationale: गंतव्य नगर का नाम मानक हिन्दी लिप्यंतरण में दिया गया है; ‘को उतर गए’ यहाँ तटवर्ती स्थान की ओर गति को व्यक्त करता है।
- source_word: ἐκεῖθεν τε
  choice: और वहाँ से
  rationale: स्थान से प्रस्थान और अगली क्रिया से संबंध, दोनों को सहज कथात्मक हिन्दी में व्यक्त करता है।
- source_word: ἀπέπλευσαν
  choice: जहाज़ पर … रवाना हुए
  rationale: ἀποπλέω समुद्र के मार्ग से प्रस्थान करने को दर्शाता है। ‘जहाज़ पर … रवाना हुए’ आधुनिक पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: εἰς Κύπρον
  choice: साइप्रस के लिए
  rationale: यह गंतव्य को दर्शाता है; द्वीप का नाम प्रचलित आधुनिक हिन्दी रूप में दिया गया है।
theological_decisions:
- issue: ἁγίου πνεύματος का रूपांकन
  choice: पवित्र आत्मा
  alternative: पवित्र आत्मा/पवित्र आत्मिक शक्ति जैसा गैर-व्यक्तिगत अर्थ
  rationale: इस वाक्य में भेजने की क्रिया स्पष्ट अभिकर्तृत्व दिखाती है, और प्रेरितों के काम में यह पद व्यक्तिगत दिव्य अभिकर्ता को सूचित करता है। फिर भी अनुवाद केवल स्रोत में उपस्थित अभिकर्तृत्व कहता है, अतिरिक्त धर्मसैद्धान्तिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की कृदन्तीय संरचना तथा तट की ओर ‘उतरने’ का भौगोलिक भाव यथासंभव सुरक्षित रखा गया है।
