  edition: SBLGNT
  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: hi
  text: परन्तु जब यहूदियों ने भीड़ को देखा[a], तो वे ईर्ष्या से भर गए[b] और निन्दा करते हुए पौलुस जो बातें कह रहा था, उनका विरोध करने लगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् इस प्रसंग में पौलुस का विरोध करने वाला स्थानीय यहूदी समूह, न कि समस्त यहूदी लोग।
    reason: cultural_note
  - marker: b
    text: या “जोश से भर गए”; यहाँ प्रसंग नकारात्मक अर्थ “ईर्ष्या” का समर्थन करता है।
    reason: lexical_alternative
  - marker: c
    text: या “पौलुस की कही बातों का विरोध करने लगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες δὲ
  choice: परन्तु जब ... देखा
  rationale: अओरिस्ट कृदन्त को स्वाभाविक हिन्दी में कालवाचक उपवाक्य बनाया गया है; δέ पिछले प्रसंग से विरोध का मोड़ दिखाता है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदियों
  rationale: यूनानी पाठ के सामान्य जाति-सूचक पद को बनाए रखा गया है; प्रसंगगत सीमा फुटनोट में स्पष्ट की गई है।
- source_word: τοὺς ὄχλους
  choice: भीड़
  rationale: यूनानी में बहुवचन है, पर इस दृश्य में एकत्र जनसमूह के लिए हिन्दी में सामूहिक एकवचन ‘भीड़’ अधिक स्वाभाविक है।
- source_word: ἐπλήσθησαν ζήλου
  choice: ईर्ष्या से भर गए
  rationale: ζῆλος में ‘उत्साह’ और ‘ईर्ष्या’ दोनों अर्थ संभव हैं; भीड़ को देखकर विरोध और निन्दा करने के प्रसंग में नकारात्मक अर्थ उपयुक्त है।
- source_word: ἀντέλεγον
  choice: विरोध करने लगे
  rationale: अपूर्ण भूतकाल की आरम्भिक और जारी क्रिया को सहज हिन्दी में व्यक्त करता है; इसमें बोलकर प्रतिवाद करने का भाव प्रसंग से स्पष्ट है।
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: पौलुस की कही बातों का
  rationale: कर्तृवाचक ὑπό Παύλου सहित कर्मवाच्य कृदन्त का आशय स्वाभाविक हिन्दी में ‘पौलुस की कही बातें’ से व्यक्त होता है।
- source_word: βλασφημοῦντες
  choice: निन्दा करते हुए
  rationale: कृदन्त मुख्य क्रिया के साथ होने वाली रीति बताता है। ‘निन्दा’ यूनानी पद की गंभीरता रखता है, पर उसका अनिर्दिष्ट लक्ष्य स्वयं से नहीं जोड़ता।
theological_decisions:
- issue: οἱ Ἰουδαῖοι को समस्त यहूदी लोगों के विरुद्ध कथन समझे जाने की सम्भावना
  choice: यहूदियों
  alternative: यहूदी अगुवों / यहूदिया के लोगों
  rationale: मूल पाठ केवल ‘यहूदी’ कहता है और इसे अगुवों तक सीमित नहीं करता। फुटनोट स्पष्ट करता है कि यहाँ इस दृश्य में पौलुस का विरोध करने वाला स्थानीय समूह अभिप्रेत है, समस्त यहूदी लोग नहीं।
- issue: ζῆλος का द्विअर्थ
  choice: ईर्ष्या
  alternative: उत्साह / जोश
  rationale: इस प्रसंग में भीड़ को देखकर विरोध और निन्दा करना नकारात्मक भाव की ओर संकेत करता है; फिर भी वास्तविक शाब्दिक विकल्प फुटनोट में सुरक्षित है।
- issue: βλασφημοῦντες का लक्ष्य
  choice: निन्दा करते हुए
  alternative: परमेश्वर की निन्दा करते हुए / पौलुस को अपशब्द कहते हुए
  rationale: यूनानी पाठ निन्दा का लक्ष्य स्पष्ट नहीं करता, इसलिए अनुवाद उसे निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। ‘परन्तु’, ‘ईर्ष्या’, ‘विरोध’ और ‘निन्दा’ जैसे व्यापक रूप से समझे जाने वाले शब्द चुने गए हैं। वाक्य-विन्यास हिन्दी की स्वाभाविकता के अनुसार बदला गया है, जबकि मूल की अस्पष्टताएँ फुटनोट और निर्णयों में सुरक्षित हैं।
