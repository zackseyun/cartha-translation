source:
  edition: SBLGNT
  text: καὶ μηδεμίαν αἰτίαν θανάτου εὑρόντες ᾐτήσαντο Πιλᾶτον ἀναιρεθῆναι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/028.yaml
  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: hi
  text: और यद्यपि उन्होंने उसमें मृत्युदंड के योग्य कोई दोष नहीं पाया[a], फिर भी उन्होंने पिलातुस से उसे मृत्युदंड दिलाने की माँग की[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मृत्यु के योग्य कोई आरोप नहीं” अथवा “मृत्युदंड देने का कोई कानूनी आधार नहीं।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसे मार डालने की माँग की।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: मृत्युदंड के योग्य कोई दोष नहीं
  rationale: न्यायिक प्रसंग में αἰτία आरोप, दोष या कानूनी आधार को और θανάτου मृत्युदंड को सूचित करता है। यह हिंदी प्रयोग अर्थ को स्वाभाविक ढंग से व्यक्त करता है और केवल सामान्य ‘मृत्यु का कारण’ समझे जाने से बचाता है।
- source_word: εὑρόντες
  choice: यद्यपि उन्होंने ... नहीं पाया
  rationale: कृदंत मुख्य क्रिया से पहले की परिस्थिति बताता है; प्रसंग में स्पष्ट विरोधात्मक तनाव है कि कोई मृत्युदंड-योग्य दोष न मिलने पर भी उन्होंने दंड की माँग की।
- source_word: ᾐτήσαντο
  choice: माँग की
  rationale: यह पिलातुस के सामने किए गए औपचारिक अनुरोध को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: Πιλᾶτον
  choice: पिलातुस
  rationale: नाम का प्रचलित मानक हिंदी लिप्यंतरण रखा गया है।
- source_word: ἀναιρεθῆναι αὐτόν
  choice: उसे मृत्युदंड दिलाने
  rationale: इस न्यायिक प्रसंग में ἀναιρέω का अर्थ मार डालना अथवा मृत्युदंड देना है। यह चयन निष्पादन की आधिकारिक प्रकृति और पिलातुस से उसे करवाने की माँग—दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: καὶ
  choice: और
  rationale: यह कथानक की सीधी निरंतरता बनाए रखता है।
theological_decisions:
- issue: कृदंत खंड में विरोधात्मक भाव को स्पष्ट करना
  choice: और यद्यपि उन्होंने ... नहीं पाया, फिर भी उन्होंने ... माँग की
  alternative: और उन्होंने ... कोई दोष न पाकर, पिलातुस से ... माँग की
  rationale: यूनानी कृदंत अपने रूप में परिस्थितिजन्य है, पर संदर्भ में नैतिक और कथात्मक विरोध स्पष्ट है। ‘यद्यपि ... फिर भी’ उस तनाव को प्रकट करता है, बिना कोई अतिरिक्त धार्मिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। न्यायिक अर्थ को बनाए रखने के लिए ‘मृत्युदंड’, ‘दोष’ और ‘माँग’ का प्रयोग किया गया है; दोनों पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित वाक्यांशों के साथ दिए गए हैं।
