source:
  edition: SBLGNT
  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: hi
  text: 'व्यवस्था और भविष्यद्वक्ताओं के लेखों का पाठ हो जाने के बाद, आराधनालय के अगुओं ने उनके पास यह संदेश भेजा: “भाइयो[a], यदि आप में से किसी के पास लोगों के लिए प्रोत्साहन की कोई बात[b] हो, तो कहिए।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “पुरुषो, भाइयो”; यह आदर और आत्मीयता का पुरुषवाची संबोधन है।
    reason: lexical_alternative
  - marker: b
    text: या “समझाइश की बात” अथवा “उपदेश की बात।” यूनानी पद में प्रोत्साहन और आग्रहपूर्ण समझाइश, दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: पाठ
  rationale: आराधनालय में पवित्रशास्त्र को सभा के सामने पढ़े जाने का संकेत देता है; ‘पाठ’ संक्षिप्त और स्वाभाविक है।
- source_word: τοῦ νόμου καὶ τῶν προφητῶν
  choice: व्यवस्था और भविष्यद्वक्ताओं के ग्रंथों
  rationale: ये आराधनालय में पढ़े जाने वाले पवित्रशास्त्र के मान्य विभाग हैं। ‘ग्रंथों’ जोड़ने से हिन्दी में यह स्पष्ट होता है कि भविष्यद्वक्ताओं के व्यक्तियों को नहीं, उनके लेखों को पढ़ा गया।
- source_word: ἀρχισυνάγωγοι
  choice: आराधनालय के अगुए
  rationale: यह बहुवचन पद आराधनालय की सभा और उपासना-क्रम की देखरेख करने वाले अधिकारियों को दर्शाता है; ‘अगुए’ नागरिक शासक होने का अनावश्यक भाव नहीं देता।
- source_word: ἀπέστειλαν ... πρὸς αὐτοὺς λέγοντες
  choice: उनके पास यह संदेश भेजा
  rationale: यहाँ भेजी गई बात या सूचना का भाव है; हिन्दी में ‘संदेश भेजा’ इस संप्रेषण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἄνδρες ἀδελφοί
  choice: भाइयो
  rationale: यह पुरुषों के लिए प्रयुक्त आदरपूर्ण, आत्मीय संबोधन है; शाब्दिक द्वित्व को हिन्दी में अस्वाभाविक बनाए बिना मूल का पुरुषवाची स्वर सुरक्षित रखा गया है।
- source_word: εἴ τίς ἐστιν ἐν ὑμῖν
  choice: यदि आप लोगों के पास ... कोई ... हो
  rationale: मूल की अपेक्षाकृत निर्वैयक्तिक रचना का स्वाभाविक हिन्दी रूप है और समूह में किसी के पास संदेश होने की संभावना व्यक्त करता है।
- source_word: λόγος παρακλήσεως
  choice: प्रोत्साहन का कोई संदेश
  rationale: παράκλησις में ढाढ़स देने और आग्रहपूर्वक शिक्षा या समझाइश देने, दोनों की अर्थ-छाया हो सकती है; मुख्य पाठ में सरल और व्यापक विकल्प रखा गया है।
- source_word: πρὸς τὸν λαόν
  choice: जनसमुदाय के लिए
  rationale: यह सभा में उपस्थित लोगों को संदेश के लक्षित श्रोता के रूप में प्रस्तुत करता है।
- source_word: λέγετε
  choice: कहिए
  rationale: यह सभा को संबोधित करने का विनम्र निमंत्रण है; बहुवचन आदरसूचक आज्ञार्थ हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: आराधनालय में पुरुषवाची संबोधन
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: यूनानी Ἄνδρες ἀδελφοί स्पष्ट रूप से पुरुषवाची है और पौलुस तथा उसके पुरुष साथियों को बोलने का निमंत्रण देता है; इसलिए इसे लिंग-समावेशी बनाकर विस्तृत नहीं किया गया।
- issue: παράκλησις की अर्थ-सीमा
  choice: प्रोत्साहन
  alternative: उपदेश / समझाइश
  rationale: संदर्भ में यह शब्द उत्साह देने के साथ आग्रहपूर्ण शिक्षा का अर्थ भी रख सकता है। मुख्य पाठ किसी संकीर्ण धार्मिक तकनीकी अर्थ को थोपे बिना ‘प्रोत्साहन’ रखता है और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप रखा गया है। ‘आराधनालय’, ‘व्यवस्था’ और ‘भविष्यद्वक्ता’ जैसे परिचित बाइबलीय शब्द बनाए रखे गए हैं, जबकि वाक्य-विन्यास को बोलचाल से ऊपर परंतु सामान्य पाठक के लिए स्पष्ट रखा गया है।
