  yaml_path: translation/nt/acts/013/035.yaml
  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: hi
  text: इसलिए वह एक और भजन में भी कहता है, “तू अपने पवित्र जन को सड़न देखने नहीं देगा।”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा में केवल ‘किसी अन्य में’ है; इसका अनुवाद ‘किसी अन्य स्थान में’ या ‘किसी अन्य अंश में’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने विश्वासयोग्य जन को’।
    reason: lexical_alternative
  - marker: c
    text: या ‘भ्रष्टता’।
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: इसलिए
  rationale: संदर्भ में यह पिछले कथन से निष्कर्ष निकालकर एक और शास्त्रीय प्रमाण प्रस्तुत करता है; ‘इसलिए’ इस अनुमानसूचक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ
  choice: भी
  rationale: यह पहले दिए गए शास्त्रीय प्रमाण के साथ एक और प्रमाण जोड़ता है।
- source_word: ἐν ἑτέρῳ
  choice: एक दूसरे भजन में
  rationale: यूनानी में केवल ‘दूसरे में’ है और संज्ञा अध्याहृत है। उद्धरण भजन 16 से है, इसलिए हिन्दी में ‘भजन’ जोड़ना संदर्भ को स्पष्ट करता है।
- source_word: λέγει
  choice: वह ... कहता है
  rationale: वर्तमान काल के शास्त्र-उद्धरण सूत्र और यूनानी के अध्याहृत पुल्लिंग कर्ता को बनाए रखता है; संदर्भ में कर्ता परमेश्वर समझा जा सकता है।
- source_word: Οὐ δώσεις
  choice: नहीं देगा
  rationale: δίδωμι के साथ infinitive यहाँ अनुमति देने के अर्थ में है; हिन्दी की ‘करने नहीं देगा’ संरचना इस मुहावरे को स्वाभाविक रूप से व्यक्त करती है।
- source_word: τὸν ὅσιόν σου
  choice: अपने पवित्र जन को
  rationale: ὅσιος पवित्रता, भक्ति या निष्ठा का भाव रख सकता है। ‘पवित्र जन’ सामान्य संज्ञा-संरचना को बनाए रखते हुए इस संदर्भ में यीशु की ओर संकेत को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἰδεῖν
  choice: देखने
  rationale: मूल क्रिया का सीधा अर्थ ‘देखना’ है और ‘सड़न देखना’ शास्त्रीय रूपक को सुरक्षित रखता है।
- source_word: διαφθοράν
  choice: सड़न
  rationale: पुनरुत्थान के संदर्भ में यह शारीरिक विघटन या क्षय को दर्शाता है; ‘सड़न’ साधारण आधुनिक हिन्दी में स्पष्ट और ठोस है।
theological_decisions:
- issue: भजन के उद्धरण में τὸν ὅσιόν σου का मसीह-संबंधी संकेत
  choice: अपने पवित्र जन को
  alternative: अपने विश्वासयोग्य जन को
  rationale: प्रेरितों 13 में पौलुस इस कथन को यीशु के पुनरुत्थान पर लागू करता है। ‘पवित्र जन’ उस संदर्भगत संकेत को बनाए रखता है, पर यूनानी शब्द में संभव निष्ठा के अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἐν ἑτέρῳ के बाद अध्याहृत संज्ञा
  choice: एक दूसरे भजन में
  alternative: एक दूसरे स्थान में / एक दूसरे अंश में
  rationale: मूल में संज्ञा नहीं है, पर उद्धरण भजन 16 से आता है। मुख्य पाठ में ‘भजन’ पाठक के लिए संदर्भ स्पष्ट करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- issue: λέγει का अध्याहृत कर्ता
  choice: वह ... कहता है
  alternative: कहा गया है / शास्त्र कहता है
  rationale: यूनानी में क्रिया तृतीय पुरुष एकवचन है और कर्ता व्यक्त नहीं किया गया। ‘वह’ मूल रूप को बनाए रखता है और संदर्भ में परमेश्वर को कर्ता समझने देता है, बिना मुख्य पाठ में उसे स्पष्ट रूप से जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। उद्धरण में परमेश्वर को संबोधित करने के लिए ‘तू’ रखा गया है, जो हिन्दी बाइबलीय शैली में घनिष्ठ एकवचन संबोधन है। ‘सड़न’ को ‘भ्रष्टता’ की अपेक्षा प्राथमिकता दी गई क्योंकि यहाँ देह के क्षय का संदर्भ है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
