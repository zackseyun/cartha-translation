  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: hi
  text: उसके आने से पहले[a], यूहन्ना ने इस्राएल की सारी प्रजा को मन फिराव के बपतिस्मे की घोषणा की थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके प्रवेश के मुख के आगे”; यह किसी के आगमन से पहले होने का यूनानी मुहावरा है। इसे “उसके पहुँचने से पहले” भी अनूदित किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मन फिराव के लिए बपतिस्मा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: घोषित किया था
  rationale: क्रिया सार्वजनिक रूप से पहले की गई घोषणा को व्यक्त करती है। हिंदी में पूर्ण भूतकाल मुख्य घटना से इसकी कालगत पूर्वता स्वाभाविक रूप से दिखाता है।
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: उसके आने से पहले
  rationale: यूनानी मुहावरे का आशय किसी के आगमन से पहले है; यह रूप अर्थ को स्पष्ट और स्वाभाविक हिंदी में रखता है, जबकि सर्वनाम को मूल के समान बनाए रखता है।
- source_word: βάπτισμα μετανοίας
  choice: मन फिराव का बपतिस्मा
  rationale: सम्बन्धकारक रचना को यथासंभव सुरक्षित रखते हुए μετάνοια के लिए प्रचलित और अर्थपूर्ण बाइबलीय हिंदी ‘मन फिराव’ चुना गया है।
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: इस्राएल की सारी प्रजा में
  rationale: यह वाक्यांश घोषणा के व्यापक श्रोता-वर्ग—इस्राएल की पूरी प्रजा—को व्यक्त करता है; ‘में’ हिंदी में सार्वजनिक प्रचार के क्षेत्र/समुदाय को स्वाभाविक रूप से दर्शाता है।
- source_word: Ἰωάννου
  choice: यूहन्ना
  rationale: नए नियम की हिंदी परंपरा में इस नाम का मानक रूप ‘यूहन्ना’ है।
theological_decisions:
- issue: ‘उसके’ का संदर्भ
  choice: सर्वनाम को बनाए रखा गया; प्रसंग में यह यीशु, अर्थात दाऊद के वंश से आए उद्धारकर्ता, की ओर संकेत करता है।
  alternative: पद में स्पष्ट रूप से ‘यीशु’ जोड़ना।
  rationale: प्रेरितों के काम 13:23–25 का प्रसंग संदर्भ को पर्याप्त रूप से स्पष्ट करता है; मूल पद में नाम न होने के कारण उसे जोड़ना अनावश्यक व्याख्यात्मक विस्तार होता।
- issue: βάπτισμα μετανοίας में सम्बन्ध
  choice: ‘मन फिराव का बपतिस्मा’
  alternative: ‘मन फिराव के लिए बपतिस्मा’
  rationale: यूनानी सम्बन्धकारक उद्देश्य, संबंध या विशेषता की कुछ अर्थगत खुली जगह छोड़ता है; मुख्य पाठ में ‘का’ इस तनाव को बेहतर सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिंदी। ‘मन फिराव’ और ‘बपतिस्मा’ नए नियम की परिचित शब्दावली हैं। वाक्य-क्रम हिंदी की स्वाभाविकता के अनुसार रखा गया है और मूल की अर्थगत अस्पष्टता को पादटिप्पणियों में सुरक्षित किया गया है।
