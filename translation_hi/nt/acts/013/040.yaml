  text: 'Therefore watch out[a], lest what has been spoken in the prophets come upon you:'
translation:
  language: hi
  text: इसलिए सावधान रहो, कहीं ऐसा न हो कि भविष्यद्वक्ताओं के ग्रंथों में कही गई बात तुम पर आ पड़े:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘भविष्यद्वक्ताओं में।’ इसका अर्थ ‘भविष्यद्वक्ताओं के द्वारा’ भी समझा जा सकता है। यहाँ सम्भवतः भविष्यद्वाणी-संबंधी ग्रंथों का संकेत है, जिनमें यह चेतावनी लिखी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: सावधान रहो
  rationale: द्वितीय पुरुष बहुवचन वर्तमान आज्ञार्थक यहाँ तत्काल और निरंतर चेतावनी देता है। ‘सावधान रहो’ आधुनिक हिंदी में स्वाभाविक और गंभीर है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले उपदेश से निकलने वाले निष्कर्ष और चेतावनी का तार्किक संबंध स्पष्ट करता है।
- source_word: μὴ ἐπέλθῃ
  choice: तुम पर न आ पड़े
  rationale: आज्ञार्थक के बाद μή और एओरिस्ट सब्जंक्टिव आशंका-युक्त निषेध व्यक्त करते हैं। ‘न आ पड़े’ आने वाले न्याय के संदर्भ में ἐπέρχομαι की आकस्मिक और गंभीर छाया को स्वाभाविक हिंदी में रखता है।
- source_word: τὸ εἰρημένον
  choice: जो बात ... कही गई है
  rationale: लेखयुक्त नपुंसकलिंग पूर्णकालिक कर्मवाच्य कृदंत संज्ञा के रूप में प्रयुक्त है। ‘कही गई है’ पूर्णकाल के वर्तमान-प्रासंगिक परिणाम को बनाए रखता है।
- source_word: ἐν τοῖς προφήταις
  choice: भविष्यद्वक्ताओं की पुस्तकों में
  rationale: ἐν का स्थान-संबंधी अर्थ बनाए रखते हुए यह हिंदी पाठक को स्पष्ट करता है कि चेतावनी भविष्यद्वाणी-संबंधी धर्मग्रंथों में लिखी है; इसे केवल मानवीय कर्ता के अर्थ में ‘भविष्यद्वक्ताओं के द्वारा’ नहीं बनाया गया।
theological_decisions:
- issue: ‘भविष्यद्वक्ताओं’ का अभिप्राय
  choice: भविष्यद्वक्ताओं की पुस्तकों/भविष्यद्वाणी-संबंधी धर्मग्रंथों का संग्रह
  alternative: मुख्यतः वे मनुष्य जिन्होंने भविष्यद्वाणी कही
  rationale: अगले पद में हबक्कूक से उद्धरण आता है, इसलिए संदर्भ लिखित भविष्यद्वाणी-साहित्य की ओर है। मुख्य पाठ इसे स्पष्ट करता है और पादटिप्पणी यूनानी की संक्षिप्त अभिव्यक्ति तथा दूसरी सम्भव समझ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भविष्यद्वक्ताओं की पुस्तकों’ से यूनानी वाक्यांश का आशय स्पष्ट होता है, जबकि [a] मूल की संक्षिप्तता और वास्तविक वैकल्पिक समझ दर्ज करती है।
