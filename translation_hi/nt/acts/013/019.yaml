base_translation:
  language: en
  yaml_path: translation/nt/acts/013/019.yaml
  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: hi
  text: और कनान देश में सात जातियों का नाश करने के बाद, उसने उनका देश इस्राएलियों को विरासत के रूप में दे दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उनका देश विरासत के रूप में बाँट दिया” या “आवंटित कर दिया।” यूनानी क्रिया भूमि को विरासत के रूप में बाँटने या आवंटित करने पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: नाश करके
  rationale: यहाँ καθαιρέω कनान की जातियों के विरुद्ध परमेश्वर की विजयी कार्रवाई बताता है। ‘नाश करके’ प्रसंग की प्रबलता को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἔθνη ἑπτὰ
  choice: सात जातियों
  rationale: ἔθνη यहाँ कनान में रहने वाले अलग-अलग जनसमूहों को दर्शाता है। ऐतिहासिक-बाइबलीय प्रसंग में ‘जातियाँ’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἐν γῇ Χανάαν
  choice: कनान देश में
  rationale: अनुवाद γῇ (‘देश/भूमि’) को बनाए रखता है और हिन्दी की स्वाभाविक पदावली ‘कनान देश’ अपनाता है।
- source_word: κατεκληρονόμησεν
  choice: विरासत में दे दिया
  rationale: क्रिया भूमि को विरासत के रूप में बाँटने या सौंपने का भाव रखती है। मुख्य पाठ में ‘विरासत में दे दिया’ उस भाव को सहज हिन्दी में व्यक्त करता है; बाँटने का शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: τὴν γῆν αὐτῶν
  choice: उनका देश
  rationale: αὐτῶν का संकेत अभी उल्लिखित सात जातियों की ओर है। ‘उनका देश’ इस संबंध को सीधे बनाए रखता है।
theological_decisions:
- issue: क्रियाओं का कर्ता और विरासत पाने वाले
  choice: दोनों क्रियाओं का कर्ता परमेश्वर है, और सात जातियों का देश इस्राएलियों को विरासत में मिलता है।
  alternative: यूनानी के समान केवल ‘उसने उनका देश विरासत में बाँट दिया’, प्राप्तकर्ताओं को स्पष्ट किए बिना।
  rationale: निकटवर्ती प्रसंग में कर्ता परमेश्वर है। यूनानी में प्राप्तकर्ता प्रत्यक्ष रूप से नहीं लिखा गया, पर ऐतिहासिक संदर्भ में वे इस्राएली हैं। इसलिए स्पष्टता हेतु ‘इस्राएलियों को’ जोड़ा गया है, बिना किसी संप्रदायगत अर्थ को आरोपित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘विरासत’ सामान्य पाठक के लिए बोधगम्य है और मूल के उत्तराधिकार-संबंधी भाव को बनाए रखती है।
