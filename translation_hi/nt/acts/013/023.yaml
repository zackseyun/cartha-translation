  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: hi
  text: इसी दाऊद के वंश[a] से परमेश्वर ने अपनी प्रतिज्ञा के अनुसार[b] इस्राएल के लिए एक उद्धारकर्ता, यीशु, को लाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘बीज’; यहाँ अर्थ दाऊद का वंश या उसकी संतान है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘प्रतिज्ञा के अनुरूप’; ‘जैसा उसने प्रतिज्ञा की थी।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου
  choice: इसी दाऊद के
  rationale: यह संबंधवाचक संकेतवाचक सर्वनाम पिछले पद के दाऊद की ओर लौटता है। हिन्दी में संदर्भ को स्वाभाविक और स्पष्ट रखने के लिए पूर्ववर्ती व्यक्ति का नाम दोहराया गया है।
- source_word: ἀπὸ τοῦ σπέρματος
  choice: वंश से
  rationale: σπέρμα का मूल अर्थ ‘बीज’ है, पर यहाँ यह दाऊद की वंशावली और उससे उत्पन्न वंशज को सूचित करता है। ‘वंश से’ आधुनिक हिन्दी में स्वाभाविक है और वंशगत संबंध बनाए रखता है।
- source_word: κατ’ ἐπαγγελίαν
  choice: अपनी प्रतिज्ञा के अनुसार
  rationale: वाक्यांश बताता है कि परमेश्वर का कार्य पहले की गई प्रतिज्ञा के अनुरूप था। ‘अपनी’ कर्ता परमेश्वर से इसका संबंध स्पष्ट करता है, पर प्रतिज्ञा का विस्तृत विषय मुख्य पाठ में नहीं जोड़ता।
- source_word: ἤγαγεν
  choice: भेजा
  rationale: ἄγω का सामान्य अर्थ ‘लाना/ले आना’ है। इस प्रसंग में परमेश्वर द्वारा इस्राएल को उद्धारकर्ता दिए जाने के भाव को वर्तमान हिन्दी में ‘भेजा’ स्वाभाविक रूप से व्यक्त करता है; ‘जिलाया’ जैसे पुनरुत्थान-सूचक अर्थ से बचा गया है।
- source_word: τῷ Ἰσραήλ
  choice: इस्राएल के लिए
  rationale: दत्तिव यहाँ लक्ष्य और हित—दोनों का भाव रख सकता है। ‘इस्राएल के लिए’ हिन्दी में स्वाभाविक है और उद्धारकर्ता के हितकारी उद्देश्य को व्यक्त करता है।
- source_word: σωτῆρα
  choice: एक उद्धारकर्ता
  rationale: σωτήρ के उद्धार और छुटकारे से जुड़े अर्थ तथा मसीही उपाधि के भार को ‘उद्धारकर्ता’ ठीक प्रकार बनाए रखता है।
- source_word: Ἰησοῦν
  choice: यीशु
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित मानक रूप अपनाया गया है।
theological_decisions:
- issue: यीशु और दाऊद से संबंधित प्रतिज्ञा का संबंध
  choice: पाठ यीशु को दाऊद के वंश से आया उद्धारकर्ता और परमेश्वर की प्रतिज्ञा के अनुरूप भेजा गया बताता है।
  alternative: इसे स्पष्ट विस्तार देकर ‘दाऊद से की गई प्रतिज्ञा की पूर्ति में’ कहा जा सकता था।
  rationale: यूनानी पाठ दाऊदी वंश और प्रतिज्ञा को जोड़ता है, पर मुख्य वाक्य प्रतिज्ञा को स्पष्ट रूप से ‘दाऊद से की गई’ नहीं कहता। इसलिए पूर्ति का भाव रखा गया है, पर व्याख्यात्मक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इसी दाऊद’ पिछले पद के संकेत को स्पष्ट करता है; ‘उद्धारकर्ता’ धर्मवैचारिक उपाधि को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
