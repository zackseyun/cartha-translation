  text: οἱ δὲ ἐκτιναξάμενοι τὸν κονιορτὸν τῶν ⸀ποδῶν ἐπ’ αὐτοὺς ἦλθον εἰς Ἰκόνιον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: hi
  text: पर उन्होंने अपने पैरों की धूल उनके विरुद्ध झाड़ दी और इकुनियुम चले गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अपने पैरों की धूल झाड़ देना उन लोगों से संबंध-विच्छेद और उनके विरुद्ध गवाही का प्रतीकात्मक कार्य था जिन्होंने संदेश को अस्वीकार कर दिया था।
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: पर उन्होंने
  rationale: δέ यहाँ पिछले प्रसंग से हल्का विरोध अथवा कथात्मक संक्रमण दिखाता है; संज्ञा के रूप में प्रयुक्त कृदंत का कर्ता पौलुस और बरनबास हैं, इसलिए हिन्दी में सर्वनाम स्वाभाविक है।
- source_word: ἐκτιναξάμενοι
  choice: झाड़ दी
  rationale: यह बलपूर्वक धूल झाड़ देने की क्रिया बताता है। हिन्दी में पूर्वकालिक कृदंत को अगले क्रियापद के साथ समन्वित पूर्ण क्रिया के रूप में रखना स्वाभाविक है।
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: अपने पैरों की धूल
  rationale: κονιορτός के लिए ‘धूल’ सटीक और प्रचलित है; आत्मवाचक ‘अपने’ स्पष्ट करता है कि धूल पौलुस और बरनबास के पैरों की थी।
- source_word: ἐπ’ αὐτοὺς
  choice: उनके विरुद्ध
  rationale: ἐπί के साथ कर्मकारक यहाँ प्रतीकात्मक क्रिया की विरोधात्मक अथवा साक्ष्यात्मक दिशा व्यक्त करता है; ‘विरुद्ध’ मूल की संक्षिप्तता और अस्पष्टता बनाए रखता है।
- source_word: ἦλθον εἰς Ἰκόνιον
  choice: इकुनियुम चले गए
  rationale: यह नामित गंतव्य की ओर यात्रा बताता है; ‘चले गए’ आधुनिक हिन्दी में कथावाचक दृष्टिकोण से स्वाभाविक है। स्थाननाम का रूप यूनानी Ἰκόνιον के निकट रखा गया है।
theological_decisions:
- issue: पैरों की धूल झाड़ने की प्रतीकात्मक क्रिया
  choice: मुख्य पाठ में इसे केवल ‘उनके विरुद्ध’ की गई क्रिया के रूप में रखा गया है।
  alternative: ‘उनके विरुद्ध गवाही के रूप में’ अथवा ‘उन पर न्याय के चिह्न के रूप में’
  rationale: मूल यूनानी क्रिया और उसकी दिशा बताता है, पर उसका पूरा धार्मिक अर्थ स्पष्ट करके नहीं जोड़ता। इसलिए व्याख्या को मुख्य पाठ में आरोपित न करके सांस्कृतिक टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘झाड़ दी’ बोलचाल में स्पष्ट है, जबकि ‘उनके विरुद्ध’ मूल पाठ की औपचारिक और धार्मिक गंभीरता बनाए रखता है।
