  text: καὶ ἡμεῖς ὑμᾶς εὐαγγελιζόμεθα τὴν πρὸς τοὺς πατέρας ἐπαγγελίαν γενομένην
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/032.yaml
  text: And we ourselves proclaim to you the good news of the promise made to the fathers,[a]
translation:
  language: hi
  text: और हम स्वयं तुम्हें उस प्रतिज्ञा का शुभ समाचार सुनाते हैं, जो पूर्वजों[a] से की गई थी,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘पितरों’; अर्थात् इस्राएल के पूर्वपुरुषों से।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक पिछले कथन से प्रवाह बनाए रखता है और कोई अतिरिक्त व्याख्यात्मक अर्थ नहीं जोड़ता।
- source_word: ἡμεῖς
  choice: हम स्वयं
  rationale: यूनानी में स्पष्ट सर्वनाम बलसूचक है; ‘हम स्वयं’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: εὐαγγελιζόμεθα के साथ संबोधित जन को हिन्दी में ‘तुम्हें’ कहना स्वाभाविक और सटीक है।
- source_word: εὐαγγελιζόμεθα
  choice: शुभ समाचार सुनाते हैं
  rationale: यह क्रिया शुभ समाचार की घोषणा करने का अर्थ देती है; यह चयन प्रचलित धार्मिक पारिभाषिकता पर निर्भर हुए बिना अर्थ स्पष्ट करता है।
- source_word: τὴν ... ἐπαγγελίαν
  choice: उस प्रतिज्ञा
  rationale: संदर्भ परमेश्वर की पहले से उल्लिखित विशिष्ट प्रतिज्ञा का है; ‘उस’ हिन्दी में निश्चितता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πρὸς τοὺς πατέρας
  choice: पूर्वजों से
  rationale: प्रतिज्ञा के प्राप्तकर्ताओं के लिए हिन्दी में ‘पूर्वजों से प्रतिज्ञा करना’ स्वाभाविक है; यह इस्राएल के पुरखों की वाचा-ऐतिहासिक ओर संकेत करता है।
- source_word: γενομένην
  choice: की गई थी
  rationale: यह कृदंत प्रतिज्ञा के किए जाने को बताता है; ‘पूरी की गई’ कहना अगले पद की बात को समय से पहले जोड़ देता।
theological_decisions:
- issue: πατέρες का अनुवाद
  choice: पूर्वजों
  alternative: पितरों
  rationale: πατέρες शाब्दिक रूप से ‘पिता/पितर’ है और यहाँ इस्राएल के पूर्वपुरुषों का वाचा-ऐतिहासिक उल्लेख करता है। मुख्य पाठ में ‘पूर्वजों’ आधुनिक पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी मूल के पुरुषवाचक पारिवारिक पद को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘हम स्वयं’ से यूनानी सर्वनाम का बल रखा गया है; ‘शुभ समाचार सुनाते हैं’ चर्चीय जार्गन से बचते हुए क्रिया का अर्थ देता है।
