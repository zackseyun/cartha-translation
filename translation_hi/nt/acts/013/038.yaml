source:
  edition: SBLGNT
  text: γνωστὸν οὖν ἔστω ὑμῖν, ἄνδρες ἀδελφοί, ὅτι διὰ τούτου ὑμῖν ἄφεσις ἁμαρτιῶν καταγγέλλεται, καὶ ἀπὸ πάντων ὧν οὐκ ἠδυνήθητε ⸀ἐν νόμῳ Μωϋσέως δικαιωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: hi
  text: इसलिए, भाइयो[a], तुम यह जान लो कि इसी व्यक्ति[b] के द्वारा तुम्हें पापों की क्षमा की घोषणा की जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, यदि यह सम्बोधन वहाँ एकत्र पूरी सभा के लिए समावेशी रूप में समझा जाए, “भाइयो और बहनो।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात् यीशु, जिनका उल्लेख ठीक पहले हुआ है।
    reason: cross_reference
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: इसलिए ... तुम यह जान लो
  rationale: यह हिन्दी में स्वाभाविक ढंग से यूनानी निर्वैयक्तिक आज्ञार्थक रचना का घोषणात्मक बल व्यक्त करता है; ‘इसलिए’ οὖν को दर्शाता है।
- source_word: ἄνδρες ἀδελφοί
  choice: भाइयो
  rationale: सम्बोधन का पारिवारिक और सामुदायिक भाव बनाए रखते हुए आधुनिक हिन्दी की स्वाभाविक सम्बोधन-शैली अपनाई गई है। यूनानी का पुल्लिंग रूप मुख्य पाठ में सुरक्षित है; सम्भावित समावेशी आशय पादटिप्पणी में दिया गया है।
- source_word: διὰ τούτου
  choice: इसी व्यक्ति के द्वारा
  rationale: τούτου निकटतम पूर्ववर्ती व्यक्ति, यीशु, की ओर संकेत करता है। ‘इसी व्यक्ति’ हिन्दी में व्यक्तिगत संकेत को स्पष्ट रखता है, जबकि नाम को मुख्य पाठ में जोड़ता नहीं।
- source_word: ἄφεσις ἁμαρτιῶν
  choice: पापों की क्षमा
  rationale: इस प्रसंग में यह स्पष्ट, प्रचलित और अर्थ-सटीक हिन्दी अभिव्यक्ति है।
- source_word: καταγγέλλεται
  choice: संदेश सुनाया जाता है
  rationale: वर्तमान कर्मवाच्य में सार्वजनिक घोषणा का भाव है। यह हिन्दी में ‘प्रचार किया जाता है’ की अपेक्षा अधिक सहज ढंग से उस घोषणा को व्यक्त करता है।
theological_decisions:
- issue: διὰ τούτου का मसीही सन्दर्भ
  choice: इसी व्यक्ति के द्वारा
  alternative: इन्हीं के द्वारा / इनके द्वारा
  rationale: संकेतवाचक सर्वनाम को यीशु नाम से बदलकर व्याख्यात्मक विस्तार नहीं किया गया; साथ ही हिन्दी में यह स्पष्ट रखा गया कि सन्दर्भ किसी व्यक्ति का है।
- issue: ἄνδρες ἀδελφοί में लिंग-सूचक सम्बोधन
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: मुख्य पाठ यूनानी के व्याकरणिक पुल्लिंग को सुरक्षित रखता है। यदि सम्बोधन पूरी मिश्रित सभा को समावेशी रूप से लक्षित समझा जाए, तो वह सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दिए गए यूनानी अंश में अगले पद (13:39) की आरम्भिक पंक्ति भी जुड़ी है, पर वह अधूरी है; पद-सन्दर्भ ACT.13.38 के अनुसार यहाँ केवल 13:38 का पूर्ण पाठ प्रस्तुत किया गया है।
