id: ACT.13.14
reference: Acts 13:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: αὐτοὶ δὲ διελθόντες ἀπὸ τῆς Πέργης παρεγένοντο εἰς Ἀντιόχειαν ⸂τὴν Πισιδίαν⸃, καὶ ⸀εἰσελθόντες εἰς τὴν συναγωγὴν τῇ ἡμέρᾳ τῶν σαββάτων ἐκάθισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/014.yaml
  text: But they went on from Perga and came to Antioch in Pisidia[a], and on the Sabbath day they entered the synagogue and sat down.
translation:
  language: hi
  text: पर वे पिरगा से आगे बढ़कर पिसिदिया के अंताकिया[a] पहुँचे। सब्त के दिन वे आराधनालय में गए और बैठ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पिसिदियाई अंताकिया।” यूनानी पाठ का शाब्दिक अर्थ है, “पिसिदिया का अंताकिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: पर वे
  rationale: δέ यात्रा-वृत्तांत को हल्के विरोध अथवा परिवर्तन के साथ आगे बढ़ाता है; हिन्दी में स्पष्ट सर्वनाम ‘वे’ αὐτοὶ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: पिरगा से आगे बढ़कर
  rationale: διέρχομαι यहाँ यात्रा जारी रखने का भाव देता है; यह प्रयोग उस गति को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παρεγένοντο
  choice: पहुँचे
  rationale: यात्रा-संदर्भ में παραγίνομαι किसी स्थान पर पहुँचने को दर्शाता है।
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: पिसिदिया के अंताकिया
  rationale: यूनानी पदबंध अंताकिया नगर की पहचान पिसिदिया क्षेत्र से करता है; ‘पिसिदिया के अंताकिया’ उस संबंध को निकटता से बनाए रखता है।
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: आराधनालय में गए
  rationale: यह यहूदी συναγωγή को सामान्य आधुनिक हिन्दी में स्पष्ट करता है और कृदंत को स्वाभाविक समापिका क्रिया के रूप में प्रस्तुत करता है।
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: सब्त के दिन
  rationale: यूनानी बहुवचन रूप यहाँ यहूदी सब्त के दिन के लिए प्रचलित मुहावरा है; हिन्दी में एकवचन स्वाभाविक है।
- source_word: ἐκάθισαν
  choice: बैठ गए
  rationale: यह साधारण भूतकालीन क्रिया बैठने की आरंभिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करती है।
