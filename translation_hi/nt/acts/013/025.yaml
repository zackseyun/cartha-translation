id: ACT.13.25
reference: Acts 13:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπλήρου ⸀Ἰωάννης τὸν δρόμον, ἔλεγεν· ⸂Τί ἐμὲ⸃ ὑπονοεῖτε εἶναι; οὐκ εἰμὶ ἐγώ· ἀλλ’ ἰδοὺ ἔρχεται μετ’ ἐμὲ οὗ οὐκ εἰμὶ ἄξιος τὸ ὑπόδημα τῶν ποδῶν λῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: hi
  text: और जब यूहन्ना अपनी दौड़ पूरी कर रहा था, तो वह बार-बार कहता था, “तुम मुझे क्या मानते हो? मैं वह नहीं हूँ।”[a] पर देखो, मेरे बाद वह आ रहा है, जिसके पाँवों की जूतियाँ खोलने के योग्य भी मैं नहीं हूँ।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक स्पष्ट रूप में अर्थ हो सकता है, “तुम मुझे क्या मानते हो? मैं मसीह नहीं हूँ।” यूनानी पाठ में अस्वीकार की गई पहचान कही नहीं गई है, यद्यपि संदर्भ मसीह की ओर संकेत करता है।
    reason: alternative_reading
  - marker: b
    text: कुछ पांडुलिपियाँ और अनुवाद इसे अधिक विशेष रूप से “उसकी जूतियों के पट्टे खोलने” के रूप में देते हैं, पर यहाँ मुद्रित यूनानी पाठ में केवल “उसके पाँवों की जूती/जूतियाँ ... खोलना” है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: अपनी दौड़ पूरी करने पर था
  rationale: दρόμος के रूपक को ‘दौड़’ के रूप में बनाए रखता है और अपूर्ण भूतकाल की चल रही, समापन की ओर बढ़ती क्रिया को व्यक्त करता है।
- source_word: ἔλεγεν
  choice: बार-बार कहता था
  rationale: अपूर्ण भूतकाल यहाँ यूहन्ना की लगातार या दोहराई जाने वाली गवाही का संकेत देता है।
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: तुम मुझे क्या समझते हो?
  rationale: यह स्वाभाविक आधुनिक हिन्दी में उस पहचान को पूछता है जिसे लोग यूहन्ना से जोड़ रहे थे।
- source_word: οὐκ εἰμὶ ἐγώ
  choice: मैं वह नहीं हूँ
  rationale: यूनानी की संक्षिप्त और संकेतात्मक अस्वीकृति को बनाए रखता है; मुख्य पाठ में ‘मसीह’ जोड़कर निहित अर्थ को स्पष्ट नहीं किया गया।
- source_word: ἀλλ’ ἰδοὺ
  choice: पर देखो
  rationale: ἰδού के ध्यान आकर्षित करने वाले बल को आधुनिक और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: मेरे बाद वह आ रहा है
  rationale: वर्तमान काल के सजीव और आसन्न भाव को बनाए रखता है तथा हिन्दी में निहित कर्ता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: जिसके पाँवों की जूतियाँ खोलने
  rationale: मुद्रित यूनानी पाठ में ‘पट्टा’ नहीं है; ‘जूतियाँ’ ὑπόδημα का प्रसंगानुकूल, सर्वसुलभ हिन्दी रूप है और λύω के लिए ‘खोलना’ स्वाभाविक है।
- source_word: ἄξιος
  choice: योग्य
  rationale: ἄξιος की योग्यता और पात्रता की धारणा को सीधे व्यक्त करता है।
theological_decisions:
- issue: οὐκ εἰμὶ ἐγώ में यूहन्ना द्वारा अस्वीकार की गई पहचान
  choice: मैं वह नहीं हूँ
  alternative: मैं मसीह नहीं हूँ
  rationale: संदर्भ मसीह की ओर संकेत करता है, पर यूनानी पाठ पहचान को स्पष्ट रूप से नाम नहीं देता; इसलिए मुख्य पाठ में उसकी संक्षिप्तता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज स्तर रखा गया है। ‘दौड़’ प्रेरितों के काम में जीवन-कार्य या नियुक्त सेवकाई के रूपक को बचाती है; ‘बार-बार कहता था’ अपूर्ण भूतकाल की पुनरावृत्ति व्यक्त करता है। दोनों पादटिप्पणी-चिह्न संबंधित कथनों के तुरंत बाद रखे गए हैं।
