    rationale: ‘जब यूहन्ना अपनी दौड़ पूरी करने पर था’ is not as idiomatic as an imperfect-progressive construction and can sound as though completion has already been reached. ‘पूरी कर रहा था’ naturally conveys the Greek imperfect, ongoing completion.
  - severity: low
    issue: Footnote anchors are placed together at the end rather than at their respective referents.
    rationale: Marker a explains the elliptical denial ‘मैं वह नहीं हूँ,’ while marker b concerns the footwear expression. Direct placement improves anchor clarity without affecting meaning.
