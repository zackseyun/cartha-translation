id: ACT.13.44
reference: Acts 13:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: hi
  text: अगले सब्त के दिन[a] लगभग पूरा नगर प्रभु का वचन[b] सुनने के लिए इकट्ठा हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आने वाले सब्त के दिन’ अथवा ‘उसके बाद के सब्त के दिन’।
    reason: lexical_alternative
  - marker: b
    text: ‘प्रभु का वचन’ का अर्थ ‘प्रभु का संदेश’ या, संदर्भ के अनुसार, ‘प्रभु के विषय में संदेश’ भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: अगले सब्त के दिन
  rationale: कालवाचक दत्तिव और ἐρχομένῳ का स्वाभाविक हिन्दी अर्थ यहाँ ‘अगले सब्त के दिन’ है; यह आगामी अथवा उसके बाद आने वाले सब्त का भाव रखता है।
- source_word: σχεδὸν
  choice: लगभग
  rationale: σχεδόν का सीधा अर्थ ‘लगभग’ है और ‘पूरा नगर’ के साथ स्वाभाविक लगता है।
- source_word: πᾶσα ἡ πόλις
  choice: पूरा नगर
  rationale: यह नगर की आबादी के लिए व्यापक, अलंकारिक प्रयोग है; इसका आशय अनिवार्य रूप से प्रत्येक व्यक्ति नहीं है।
- source_word: συνήχθη
  choice: इकट्ठा हो गया
  rationale: συνάγω का कर्मवाच्य रूप यहाँ अकर्मक अर्थ में लोगों के एकत्र होने को व्यक्त करता है।
- source_word: ἀκοῦσαι
  choice: सुनने के लिए
  rationale: अनन्त क्रिया सभा के उद्देश्य को व्यक्त करती है।
- source_word: τὸν λόγον
  choice: वचन
  rationale: λόγος के लिए ‘वचन’ लूका-प्रेरितों के प्रचार-संबंधी आवर्ती प्रयोग को बनाए रखता है, जबकि यहाँ उसका अर्थ संदेश भी है।
- source_word: τοῦ κυρίου
  choice: प्रभु का
  rationale: सम्बन्धकारक रचना को सीधे रूप में रखा गया है; इससे वचन के प्रभु से होने, प्रभु का होने अथवा प्रभु के विषय में होने की परस्पर जुड़ी संभावनाएँ अनावश्यक रूप से सीमित नहीं होतीं।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ आधुनिक हिन्दी बाइबलीय भाषा में κύριος का प्रतिष्ठित और स्वाभाविक रूप है तथा संदर्भ से अधिक निश्चित पहचान आरोपित नहीं करता।
- issue: ‘प्रभु का वचन’ का आशय
  choice: पारंपरिक सम्बन्धकारक अभिव्यक्ति ‘प्रभु का वचन’ बनाए रखना
  alternative: ‘प्रभु का संदेश’ अथवा ‘प्रभु के विषय में संदेश’
  rationale: यूनानी सम्बन्धकारक में स्वामित्व, स्रोत और विषय के भाव एक-दूसरे पर चढ़ सकते हैं। सीधे वाक्यांश को बनाए रखने से यह वास्तविक अर्थगत और धर्मवैज्ञानिक खुलापन सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘सब्त’, ‘प्रभु’ और ‘वचन’ जैसे परिचित बाइबलीय पद रखे गए हैं; वाक्य-विन्यास हिन्दी के स्वाभाविक क्रम में है।
