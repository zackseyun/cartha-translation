  text: διελθόντες δὲ ⸀ὅλην τὴν νῆσον ἄχρι Πάφου εὗρον ⸀ἄνδρα τινὰ μάγον ψευδοπροφήτην Ἰουδαῖον ᾧ ὄνομα ⸀Βαριησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/006.yaml
  text: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
translation:
  language: hi
  text: और पूरे द्वीप में से होते हुए पाफुस तक पहुँचने के बाद, उन्हें एक व्यक्ति मिला जो जादूगर, झूठा भविष्यद्वक्ता और यहूदी था। उसका नाम बर-यीशु[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बर-यीशु को ‘बरयीशु’ भी लिखा जा सकता है। यह सामी मूल का नाम संभवतः ‘यीशु का पुत्र’ या ‘यहोशू का पुत्र’ अर्थ रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθόντες δὲ ὅλην τὴν νῆσον ἄχρι Πάφου
  choice: और पूरे द्वीप से होकर पाफुस तक जाने के बाद
  rationale: क्रिया-विशेषणात्मक अओरिस्ट कृदन्त को मुख्य क्रिया से पहले पूरी हुई यात्रा के रूप में व्यक्त किया गया है। ‘से होकर ... तक’ द्वीप को पार करने और पाफुस को यात्रा का अंतिम बिंदु बताता है, जबकि δέ को हल्के कथात्मक संयोजक ‘और’ से रखा गया है।
- source_word: εὗρον ἄνδρα τινὰ
  choice: उन्हें एक व्यक्ति मिला
  rationale: εὗρον की खोज अथवा सामना होने की सामान्य कथात्मक भावना को स्वाभाविक हिन्दी में रखा गया है। ‘एक व्यक्ति’ τινά की अनिश्चितता को पर्याप्त रूप से व्यक्त करता है; ‘एक निश्चित व्यक्ति’ हिन्दी में कृत्रिम होता।
- source_word: μάγον
  choice: जादूगर
  rationale: यह सुलभ आधुनिक हिन्दी में गुप्त अथवा जादुई कलाओं के अभ्यासी का संकेत देता है। ‘तांत्रिक’ अधिक सांस्कृतिक अर्थ जोड़ता और ‘मागी’ अधिकांश पाठकों के लिए अस्पष्ट होता।
- source_word: ψευδοπροφήτην
  choice: झूठा भविष्यद्वक्ता
  rationale: यह यौगिक शब्द के दोनों तत्वों—झूठा और भविष्यद्वक्ता—को सीधे तथा पारदर्शी रूप में सुरक्षित रखता है।
- source_word: Ἰουδαῖον
  choice: यहूदी
  rationale: यहाँ शब्द उस व्यक्ति की जातीय-धार्मिक पहचान बताता है; केवल भौगोलिक ‘यहूदिया निवासी’ का अर्थ संदर्भ में अपेक्षित नहीं है।
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: उसका नाम बर-यीशु था
  rationale: यूनानी मुहावरे को स्वाभाविक हिन्दी में प्रस्तुत किया गया है और व्यक्तिगत नाम का अर्थानुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है।
theological_decisions:
- issue: Βαριησοῦ नाम का रूप
  choice: बर-यीशु
  alternative: यीशु का पुत्र / बरयीशु
  rationale: पाठ में यह एक व्यक्तिगत नाम है, इसलिए उसके सामी अर्थ को मुख्य पाठ में अनुवादित करना नाम और व्याख्या को मिला देता। योजक-चिह्न नाम की संरचना स्पष्ट करता है, और अर्थ को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यूनानी के सघन समानाधिकरण को हिन्दी की स्पष्टता के लिए दो वाक्यों में बाँटा गया है, पर जादूगर, झूठा भविष्यद्वक्ता और यहूदी—तीनों परिचय उसी व्यक्ति से जुड़े रखे गए हैं।
