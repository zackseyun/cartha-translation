lexical_decisions:
- source_word: οἵ τε
  choice: और
  rationale: τε पिछले वृत्तांत से इस वाक्य को जोड़कर कथा की निरंतरता दिखाता है; वाक्य के आरम्भ में ‘और’ स्वाभाविक हिन्दी है।
- source_word: μαθηταὶ
  choice: चेले
  rationale: यह यीशु के अनुयायियों/विश्वासियों के लिए प्रचलित और साधारण पाठक को समझ आने वाला हिन्दी बाइबलीय शब्द है।
- source_word: ἐπληροῦντο
  choice: भरते जा रहे थे
  rationale: अपूर्ण भूतकाल और कर्मवाच्य को ध्यान में रखते हुए यह निरंतर या बार-बार होते भराव का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: χαρᾶς
  choice: आनन्द से
  rationale: πληρόω के साथ यूनानी संबंध को हिन्दी में ‘से’ द्वारा स्वाभाविक रूप से व्यक्त किया जाता है; ‘आनन्द’ χαρά का सीधा और गरिमापूर्ण समतुल्य है।
- source_word: πνεύματος ἁγίου
  choice: पवित्र आत्मा से
  rationale: प्रेरितों के काम के संदर्भ में यह कलीसिया के मिशन में सक्रिय दिव्य पवित्र आत्मा की ओर संकेत करता है; हिन्दी में नाम के साथ पृथक निश्चित उपपद आवश्यक नहीं है।
theological_decisions:
- issue: πνεύματος ἁγίου को व्यक्तिगत दिव्य संदर्भ मानना या केवल गुणात्मक ‘पवित्र आत्मा/भाव’
  choice: पवित्र आत्मा
  alternative: पवित्र आत्मिक भाव
  rationale: प्रेरितों के काम में यह पद सामान्यतः मिशन में सक्रिय दिव्य पवित्र आत्मा को सूचित करता है; फिर भी हिन्दी में बिना कृत्रिम व्याख्यात्मक विस्तार के मूल पद ही रखा गया है।
