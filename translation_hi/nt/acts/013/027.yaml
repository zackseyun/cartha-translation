source:
  edition: SBLGNT
  text: οἱ γὰρ κατοικοῦντες ἐν Ἰερουσαλὴμ καὶ οἱ ἄρχοντες αὐτῶν τοῦτον ἀγνοήσαντες καὶ τὰς φωνὰς τῶν προφητῶν τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας κρίναντες ἐπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: hi
  text: क्योंकि यरूशलेम के निवासियों और उनके शासकों ने इस व्यक्ति को नहीं पहचाना[a] और हर सब्त को पढ़ी जाने वाली भविष्यद्वक्ताओं की वाणियों[b] को उसे दोषी ठहराकर पूरा कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे।” यूनानी में संकेतवाचक शब्द का शाब्दिक अर्थ “इस व्यक्ति को” है, जो यीशु की ओर वक्ता के संकेत पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “भविष्यद्वक्ताओं की आवाज़ों।” इसका अर्थ “भविष्यद्वक्ताओं के वचन” भी हो सकता है। यूनानी वाक्यरचना को इस प्रकार भी समझा जा सकता है कि उन्होंने इस व्यक्ति को और हर सब्त पढ़ी जाने वाली भविष्यद्वक्ताओं की वाणियों को नहीं पहचाना/समझा, और उसे दोषी ठहराकर उन्हें पूरा कर दिया।
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλὴμ
  choice: यरूशलेम के निवासी
  rationale: संज्ञा की तरह प्रयुक्त कृदन्त को स्वाभाविक और वर्तमान मानक हिन्दी में व्यक्त करता है।
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: उनके शासक
  rationale: ἄρχοντες के प्रशासनिक और न्यायिक अधिकार के भाव को ‘अगुवों’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: τοῦτον
  choice: इस व्यक्ति को
  rationale: यूनानी संकेतवाचक सर्वनाम का स्पष्ट संकेत बनाए रखता है और हिन्दी में ‘इसे’ की अपेक्षा अधिक गरिमापूर्ण सुनाई देता है।
- source_word: ἀγνοήσαντες
  choice: नहीं पहचाना
  rationale: यह केवल जानकारी के अभाव के बजाय यीशु की पहचान न कर पाने के प्रसंगगत अर्थ को व्यक्त करता है।
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: भविष्यद्वक्ताओं की वाणियाँ
  rationale: φωνάς के मूल ‘आवाज़ों/वाणियों’ के चित्र को बनाए रखते हुए हिन्दी में भविष्यसूचक उद्घोषणा के लिए स्वाभाविक अभिव्यक्ति देता है।
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: हर सब्त को पढ़ी जाने वाली
  rationale: वर्तमान कर्मवाच्य कृदन्त और नियमित साप्ताहिक पाठ—दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: κρίναντες
  choice: उसे दोषी ठहराकर
  rationale: इस प्रसंग में सामान्य निर्णय नहीं, बल्कि यीशु की न्यायिक निन्दा/दोषसिद्धि अभिप्रेत है; ‘ठहराकर’ इसके साधनात्मक संबंध को भी बनाए रखता है।
- source_word: ἐπλήρωσαν
  choice: पूरा कर दिया
  rationale: भविष्यद्वक्ताओं की कही बातों के पूर्ण होने का प्रचलित और स्पष्ट हिन्दी रूप है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पिछले कथन के लिए दिए जा रहे कारण अथवा स्पष्टीकरण को सहज हिन्दी में जोड़ता है।
theological_decisions:
- issue: यीशु के विषय में अज्ञान का स्वरूप
  choice: इस व्यक्ति को नहीं पहचाना
  alternative: उसके विषय में अनजान थे / उसे नहीं जानते थे
  rationale: यह यीशु के अस्तित्व की पूर्ण अनभिज्ञता कहे बिना उसकी वास्तविक पहचान न कर पाने का भाव रखता है और उत्तरदायित्व तथा अज्ञान के बीच पाठ में उपस्थित तनाव को बनाए रखता है।
- issue: τὰς φωνὰς का वाक्यगत संबंध
  choice: ‘वाणियों’ को ἐπλήρωσαν (‘पूरा कर दिया’) का कर्म मानना
  alternative: ‘इस व्यक्ति’ और ‘वाणियों’ दोनों को ἀγνοήσαντες (‘नहीं पहचाना/समझा’) के कर्म मानना
  rationale: शब्दक्रम और निकटवर्ती मुख्य क्रिया के आधार पर चुना हुआ पाठ सहज है तथा वाणियों को दोषी ठहराने के द्वारा पूरा किए जाने का स्पष्ट अर्थ देता है; फिर भी यूनानी रचना वैकल्पिक संबंध की कुछ गुंजाइश रखती है, जिसे टिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘सब्त’, ‘भविष्यद्वक्ता’ और ‘वाणी’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं; वाक्य की यूनानी संरचनात्मक अस्पष्टता को मुख्य पाठ में बोझिल किए बिना पादटिप्पणी में सुरक्षित रखा गया है।
