reference: Acts 13:50
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ δὲ Ἰουδαῖοι παρώτρυναν τὰς σεβομένας ⸀γυναῖκας τὰς εὐσχήμονας καὶ τοὺς πρώτους τῆς πόλεως καὶ ἐπήγειραν διωγμὸν ἐπὶ τὸν Παῦλον ⸀καὶ Βαρναβᾶν, καὶ ἐξέβαλον αὐτοὺς ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/050.yaml
  text: But the Jews stirred up the devout women of high standing and the leading men of the city[b][a], and stirred up persecution against Paul and Barnabas and drove them out of their district.
translation:
  language: hi
  text: परन्तु यहूदियों ने परमेश्वर की उपासना करने वाली प्रतिष्ठित स्त्रियों[a] और नगर के प्रमुख पुरुषों को उकसाया। उन्होंने पौलुस और बरनबास के विरुद्ध उत्पीड़न भड़काया और उन्हें नगर के क्षेत्र[b] से बाहर निकाल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भक्त स्त्रियों’ अथवा ‘परमेश्वर का भय मानने वाली स्त्रियों’। यूनानी पद उन स्त्रियों को दर्शा सकता है जो इस्राएल के परमेश्वर की उपासना करती थीं—संभवतः आराधनालय से जुड़ी गैर-यहूदी अनुयायी स्त्रियाँ।
    reason: lexical_alternative
  - marker: b
    text: या ‘नगर के प्रदेश से’ अथवा ‘नगर की सीमाओं से’। यूनानी शब्द सीमा-रेखाओं या उनके भीतर के क्षेत्र, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: परन्तु यहूदियों ने
  rationale: δέ पिछले पद की सकारात्मक प्रतिक्रिया के विपरीत कथा में मोड़ लाता है; ‘परन्तु’ इस विरोध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: παρώτρυναν
  choice: उकसाया
  rationale: यह क्रिया दूसरों को सक्रिय रूप से विरोध के लिए प्रेरित करने का भाव रखती है; ‘उकसाया’ प्रसंग की शत्रुतापूर्ण सामाजिक कार्रवाई को संक्षेप में व्यक्त करता है।
- source_word: τὰς σεβομένας γυναῖκας
  choice: परमेश्वर की उपासना करने वाली ... स्त्रियों
  rationale: सहभागी कृदन्त उन स्त्रियों को दर्शाता है जो इस्राएल के परमेश्वर की श्रद्धापूर्वक उपासना करती थीं; यह रूप तकनीकी धार्मिक श्रेणी को अनावश्यक रूप से निश्चित किए बिना मूल भाव खोलता है।
- source_word: τὰς εὐσχήμονας
  choice: प्रतिष्ठित
  rationale: शब्द सामाजिक सम्मान, शिष्ट प्रतिष्ठा या ऊँचे स्थान का संकेत देता है; ‘प्रतिष्ठित’ आधुनिक हिन्दी में इन पहलुओं को स्वाभाविक रूप से समेटता है।
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: नगर के प्रमुख पुरुषों
  rationale: πρώτους नागरिक पद और प्रभाव में अग्रणी लोगों को सूचित करता है; मूल का पुल्लिंग बहुवचन ‘पुरुषों’ द्वारा सुरक्षित रखा गया है।
- source_word: ἐπήγειραν διωγμὸν
  choice: उत्पीड़न भड़काया
  rationale: क्रिया-संज्ञा संयोजन उत्पीड़न को उठाने या आरम्भ कराने का कारणात्मक भाव देता है; ‘भड़काया’ हिन्दी में सक्रिय उकसावे को स्पष्ट करता है।
- source_word: ἐπὶ τὸν Παῦλον καὶ Βαρναβᾶν
  choice: पौलुस और बरनबास के विरुद्ध
  rationale: διωγμός के साथ ἐπί शत्रुतापूर्ण दिशा बताता है, जिसे ‘के विरुद्ध’ ठीक प्रकार व्यक्त करता है।
- source_word: ἐξέβαλον
  choice: बाहर निकाल दिया
  rationale: ἐκβάλλω बलपूर्वक निष्कासन का भाव रखता है; यह हिन्दी अभिव्यक्ति स्पष्ट और स्वाभाविक है तथा केवल विनम्र विदाई का अर्थ नहीं देती।
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: अपने क्षेत्र से
  rationale: ὅρια सीमाओं के साथ-साथ उनसे घिरे भूभाग या क्षेत्र को भी दर्शा सकता है; ‘क्षेत्र’ नगर के अधिकाराधीन इलाके के प्रसंग में सहज है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: σεβομένας का धार्मिक आशय
  choice: परमेश्वर की उपासना करने वाली स्त्रियाँ
  alternative: भक्त स्त्रियाँ; परमेश्वर का भय मानने वाली स्त्रियाँ
  rationale: प्रेरितों के काम में यह पद प्रायः यहूदी आराधनालय से जुड़ी गैर-यहूदी उपासकों की ओर संकेत कर सकता है, पर यहाँ उनकी औपचारिक स्थिति पूर्णतः निश्चित नहीं है। चुना हुआ रूप धार्मिक आशय स्पष्ट करता है, पर किसी तकनीकी वर्ग को थोपता नहीं।
- issue: नगर के प्रभावशाली लोगों का लिंग-सूचक वर्णन
  choice: नगर के प्रमुख पुरुष
  alternative: नगर के अगुवे
  rationale: मूल यूनानी में स्पष्ट पुल्लिंग बहुवचन है; इसलिए स्वाभाविक हिन्दी में भी पुरुष-संदर्भ बनाए रखा गया है।
- issue: ὅρια की भौगोलिक व्यापकता
  choice: क्षेत्र
  alternative: प्रदेश; सीमाएँ
  rationale: शब्द सीमा-रेखाओं अथवा उनके भीतर के भूभाग दोनों को व्यक्त कर सकता है। मुख्य पाठ में प्रसंगानुकूल ‘क्षेत्र’ रखा गया और वास्तविक शब्दार्थ-विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रूप। दो छोटे वाक्यों में विभाजन से घटनाक्रम सहज हुआ है। ‘उत्पीड़न’ औपचारिक पर प्रचलित धार्मिक-सामाजिक शब्द है; ‘उकसाया’ और ‘भड़काया’ दोनों यूनानी क्रियाओं के सक्रिय, कारणात्मक बल को अलग-अलग स्वाभाविक हिन्दी में रखते हैं।
