  text: ὃν δὲ ὁ θεὸς ἤγειρεν οὐκ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/037.yaml
  text: But the one whom God raised up did not see decay[a].
translation:
  language: hi
  text: परन्तु जिसे परमेश्वर ने जिलाया, उसने सड़न नहीं देखी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विनाश’। यूनानी शब्द शरीर के गलने-सड़ने का बोध करा सकता है; भजन 16:10 के यूनानी अनुवाद में भी यही शब्द प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: जिसे
  rationale: सम्बन्धवाचक सर्वनाम पहले से चर्चा में आए व्यक्ति, अर्थात् यीशु, की ओर संकेत करता है और क्रिया का कर्म है; हिन्दी में ‘जिसे’ स्वाभाविक और पर्याप्त है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह दाऊद और यीशु के बीच स्पष्ट विरोध दिखाता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: आधुनिक मानक हिन्दी के बाइबलीय सन्दर्भ में θεός के लिए यह स्पष्ट, प्रतिष्ठित और सहज रूप है।
- source_word: ἤγειρεν
  choice: मरे हुओं में से जिलाया
  rationale: निकटवर्ती सन्दर्भ में दाऊद की मृत्यु और सड़न की तुलना यीशु के पुनरुत्थान से है; इसलिए यहाँ क्रिया का पुनरुत्थान-संबंधी अर्थ निर्णायक है। हिन्दी में केवल ‘उठाया’ अस्पष्ट हो सकता है, जबकि यह रूप आशय स्पष्ट करता है।
- source_word: οὐκ εἶδεν
  choice: नहीं देखी
  rationale: यूनानी मुहावरे का ‘देखना’ सुरक्षित रखा गया है, जिससे भजन 16 और तत्काल प्रसंग की शब्दावली की प्रतिध्वनि बनी रहती है।
- source_word: διαφθοράν
  choice: सड़न
  rationale: यह शरीर के गलने-सड़ने को साधारण आधुनिक हिन्दी में स्पष्ट करता है; अधिक पारम्परिक ‘विनाश’ को पाठ-टिप्पणी में रखा गया है क्योंकि यूनानी शब्द और भजन की प्रतिध्वनि में उसका व्यापक अर्थ सम्भव है।
theological_decisions:
- issue: ἤγειρεν का पुनरुत्थान-संबंधी अर्थ
  choice: मरे हुओं में से जिलाया—अर्थात् परमेश्वर ने यीशु को मृत्यु से जीवित किया
  alternative: उठाया या प्रकट किया—अर्थात् किसी भूमिका के लिए नियुक्त करके सामने लाया
  rationale: तत्काल प्रसंग दाऊद के मरने और सड़न देखने की तुलना उस व्यक्ति से करता है जिसे परमेश्वर ने जिलाया और जिसने सड़न नहीं देखी; इसलिए यहाँ पुनरुत्थान का अर्थ प्रसंग से निश्चित होता है।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सहज रखी गई है। ‘परन्तु’ से दाऊद के साथ विरोध और ‘नहीं देखी’ से मूल मुहावरा तथा भजन की प्रतिध्वनि सुरक्षित है।
