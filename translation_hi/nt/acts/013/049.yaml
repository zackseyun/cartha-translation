  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: hi
  text: और प्रभु का वचन पूरे क्षेत्र में फैलाया जा रहा था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘प्रभु का संदेश।’
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφέρετο
  choice: फैलता जा रहा था
  rationale: अपूर्णकालीन कर्मवाच्य रूप अतीत में जारी प्रसार को दर्शाता है। हिन्दी में यह प्रयोग उस निरंतर प्रक्रिया को स्वाभाविक ढंग से व्यक्त करता है; संदर्भ में वचन का लोगों द्वारा फैलाया जाना स्वतः स्पष्ट है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है, स्पष्ट विरोधसूचक नहीं।
- source_word: ὁ λόγος
  choice: वचन
  rationale: प्रेरितों के काम में λόγος प्रायः घोषित सुसमाचार-संदेश को सूचित करता है। ‘वचन’ उस आवर्ती बाइबलीय अभिव्यक्ति को बनाए रखता है, जबकि ‘संदेश’ अर्थगत विकल्प है।
- source_word: τοῦ κυρίου
  choice: प्रभु का
  rationale: यह सम्बन्धसूचक पद संदेश के प्रभु से संबंधित या उनके अधिकार से आने का भाव बनाए रखता है; ‘प्रभु’ κύριος का प्रतिष्ठित और स्वाभाविक हिन्दी रूप है।
- source_word: δι’ ὅλης
  choice: पूरे ... में
  rationale: सम्बन्धकारक के साथ διά किसी पूरे भूभाग में विस्तार व्यक्त करता है; ‘पूरे ... में’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τῆς χώρας
  choice: क्षेत्र
  rationale: χώρα यहाँ आसपास के भौगोलिक इलाके को दर्शाता है, आधुनिक राष्ट्र-राज्य को नहीं; इसलिए ‘क्षेत्र’ स्पष्ट और उपयुक्त है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ अधिकार के साथ इस पद की मसीही और बाइबलीय अनुगूँज को भी बनाए रखता है, जबकि ‘स्वामी’ अर्थ को केवल अधिकार-संबंध की ओर संकुचित कर सकता है।
- issue: λόγος का अर्थ
  choice: वचन
  alternative: संदेश
  rationale: ‘वचन’ लूका की आवर्ती अभिव्यक्ति और उसकी धर्मवैचारिक अनुगूँज सुरक्षित रखता है; पादटिप्पणी स्पष्ट करती है कि प्रसंग में इसका आशय घोषित संदेश भी हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली। ‘फैलता जा रहा था’ निरंतर अतीतकालीन क्रिया को सहज रूप में व्यक्त करता है।
