base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: hi
  text: जब वे सलमीस पहुँचे, तो उन्होंने यहूदियों के आराधनालयों में परमेश्वर के वचन की घोषणा की। उनके साथ यूहन्ना भी सहायक के रूप में था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके साथ यूहन्ना भी सेवक के रूप में था”; मूल शब्द का अर्थ “सहायक,” “परिचर” या “सेवक” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενοι ἐν Σαλαμῖνι
  choice: जब वे सलमीस पहुँचे
  rationale: स्थान-सूचक वाक्यांश के साथ γενόμενοι यहाँ किसी स्थान पर पहुँचने का भाव देता है। कालवाचक उपवाक्य स्वाभाविक हिन्दी में यूनानी कृदंत का संबंध स्पष्ट करता है।
- source_word: κατήγγελλον
  choice: घोषणा की
  rationale: यह क्रिया सार्वजनिक रूप से संदेश सुनाने या घोषित करने को व्यक्त करती है; ‘घोषणा की’ इसे केवल औपचारिक उपदेश तक सीमित नहीं करती।
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर के वचन
  rationale: यह चयन मूल संबंधकारक रचना को बनाए रखता है और परमेश्वर से आने वाले संदेश के अर्थ को अनावश्यक रूप से नहीं खोलता।
- source_word: ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων
  choice: यहूदियों के आराधनालयों में
  rationale: सन्दर्भ यहूदी सभाओं अथवा उनके उपासना-स्थलों का है। ‘आराधनालय’ आधुनिक हिन्दी में प्रचलित और स्पष्ट बाइबलीय पद है।
- source_word: εἶχον δὲ καὶ Ἰωάννην
  choice: उनके साथ यूहन्ना भी ... था
  rationale: शाब्दिक ‘वे यूहन्ना को रखते थे’ हिन्दी में अस्वाभाविक होगा। यह रचना सहभागिता तथा καί के ‘भी’ वाले भाव को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ὑπηρέτην
  choice: सहायक के रूप में
  rationale: यह शब्द अधीनस्थ सहायक या परिचर को सूचित कर सकता है। ‘सहायक’ यात्रा और सेवाकार्य के सन्दर्भ में उपयुक्त है तथा दासत्व का अनावश्यक भाव नहीं जोड़ता।
