  text: τότε ἰδὼν ὁ ἀνθύπατος τὸ γεγονὸς ἐπίστευσεν ἐκπλησσόμενος ἐπὶ τῇ διδαχῇ τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/012.yaml
  text: Then[a], when the proconsul saw what had happened, he believed[b], being astonished at the teaching of the Lord.
translation:
  language: hi
  text: तब रोमी प्रांतपाल ने जो कुछ हुआ था, उसे देखकर विश्वास किया। वह प्रभु की शिक्षा से चकित था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रभु की शिक्षा” का अर्थ “प्रभु से मिली शिक्षा” या “प्रभु के विषय में शिक्षा” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कथा में अगले घटनाक्रम को स्वाभाविक और संक्षिप्त रूप से दर्शाता है।
- source_word: ἰδὼν
  choice: देखकर
  rationale: कालवाचक/पूर्ववर्ती कृदंत का सहज हिन्दी रूप है और देखने तथा विश्वास करने का संबंध बनाए रखता है।
- source_word: ὁ ἀνθύπατος
  choice: सूबेदार
  rationale: यह रोमी पद ἀνθύπατος के लिए प्रचलित हिन्दी बाइबलीय शब्द है और सामान्य 'राज्यपाल' से अधिक विशिष्ट है।
- source_word: τὸ γεγονός
  choice: जो कुछ हुआ था
  rationale: पूर्ण हो चुकी घटना का संकेत देने वाले substantival perfect participle का स्वाभाविक हिन्दी रूप।
- source_word: ἐπίστευσεν
  choice: विश्वास किया
  rationale: यूनानी में कर्म व्यक्त नहीं है; इसलिए 'प्रभु पर' या 'संदेश पर' जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: ἐκπλησσόμενος
  choice: चकित था
  rationale: मुख्य क्रिया के साथ चल रही विस्मय की अवस्था को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τῇ διδαχῇ
  choice: शिक्षा से
  rationale: ἐπί के कारण/आधार अथवा अवसर के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῦ κυρίου
  choice: प्रभु की
  rationale: सम्बन्धकारक को निकटता से बनाए रखता है, यद्यपि हिन्दी में यह रूप स्वामित्व/स्रोत की ओर कुछ झुकता है; अर्थगत विकल्प पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: बिना व्यक्त कर्म के πιστεύω का अर्थ
  choice: केवल 'विश्वास किया'
  alternative: '''प्रभु पर विश्वास किया'' या ''संदेश पर विश्वास किया'''
  rationale: संदर्भ मसीही विश्वास की ओर संकेत करता है, पर मूल पाठ कर्म को व्यक्त नहीं करता; संक्षिप्तता और खुलापन सुरक्षित रखा गया।
- issue: τοῦ κυρίου सम्बन्धकारक का आशय
  choice: मुख्य पाठ में 'प्रभु की शिक्षा'
  alternative: '''प्रभु के विषय में शिक्षा'' या ''प्रभु से मिली शिक्षा'''
  rationale: यूनानी सम्बन्धकारक स्वामित्व/स्रोत अथवा विषय का संकेत दे सकता है। हिन्दी मुख्य पाठ सबसे निकट और स्वाभाविक रूप रखता है तथा पादटिप्पणी अन्य सम्भावना बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ऐतिहासिक पद की विशिष्टता के लिए 'सूबेदार' रखा गया है। यूनानी के लंबे वाक्य को स्पष्टता के लिए दो हिन्दी वाक्यों में बाँटा गया है।
