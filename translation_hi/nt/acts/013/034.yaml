source:
  edition: SBLGNT
  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: hi
  text: 'और इस विषय में कि उसने उसे मरे हुओं में से जिलाया, और वह अब फिर कभी सड़न में लौटने वाला नहीं था, उसने इस प्रकार कहा है: “मैं तुम्हें दाऊद से जुड़ी पवित्र और अटल आशीषें दूँगा।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत रूप से, “दाऊद की अटल दयाएँ।” यूनानी पदबंध यशायाह 55:3 की प्रतिध्वनि है और दाऊद से संबंधित पवित्र तथा विश्वसनीय वाचा-प्रतिज्ञाओं या आशीषों की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: उसने उसे मरे हुओं में से जिलाया
  rationale: ἐκ νεκρῶν के साथ ἀνέστησεν स्पष्ट रूप से पुनरुत्थान को दर्शाता है। ‘जिलाया’ आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर की क्रिया को बनाए रखता है।
- source_word: μηκέτι μέλλοντα ὑποστρέφειν
  choice: ताकि वह फिर कभी … न लौटे
  rationale: यह प्रयोग भविष्य में वापसी के निषेध को व्यक्त करता है। हिन्दी में ‘फिर कभी न लौटे’ स्वाभाविक ढंग से स्थायी परिणाम बताता है; ‘ताकि’ प्रसंग में पुनरुत्थान और सड़न में न लौटने का संबंध स्पष्ट करता है।
- source_word: διαφθοράν
  choice: सड़न
  rationale: पुनरुत्थान के संदर्भ में शब्द शारीरिक क्षय या विघटन का संकेत देता है। ‘सड़न’ सामान्य पाठक के लिए स्पष्ट है और नैतिक भ्रष्टता का भ्रामक अर्थ नहीं देता।
- source_word: οὕτως εἴρηκεν
  choice: उसने इस प्रकार कहा है
  rationale: पूर्णकालिक εἴρηκεν के वर्तमान तक बने रहने वाले शास्त्रीय कथन के भाव को ‘कहा है’ सुरक्षित रखता है।
- source_word: Δώσω ὑμῖν
  choice: मैं तुम्हें … दूँगा
  rationale: यह सीधे भविष्यकालीन प्रतिज्ञा है; बहुवचन ὑμῖν को प्रसंगानुसार ‘तुम्हें’ से व्यक्त किया गया है।
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: दाऊद से जुड़ी पवित्र और अटल आशीषें
  rationale: यशायाह 55:3 की प्रतिध्वनि वाला यह कठिन और संक्षिप्त पदबंध दाऊद से संबंधित पवित्र, विश्वसनीय वाचा-लाभों या प्रतिज्ञाओं की ओर संकेत करता है। ‘से जुड़ी’ संबंध की मूल अस्पष्टता को अनावश्यक रूप से यह तय किए बिना रखता है कि वे दाऊद को दी गईं या उसके द्वारा प्राप्त होंगी।
theological_decisions:
- issue: τὰ ὅσια Δαυὶδ τὰ πιστά में दाऊदी वाचा-संबंधी पदबंध
  choice: दाऊद से जुड़ी पवित्र और अटल आशीषें
  alternative: दाऊद पर की गई अटल दयाएँ; दाऊद को दी गई पवित्र और अटल प्रतिज्ञाएँ
  rationale: यूनानी पदबंध अंडाकार है और ‘पवित्र वस्तुएँ/लाभ’, ‘दयाएँ’, ‘आशीषें’ या ‘प्रतिज्ञाएँ’ जैसे अनुवादों की अनुमति देता है। मुख्य पाठ में ‘आशीषें’ अर्थ को सहज बनाता है, जबकि ‘दाऊद से जुड़ी’ संबंध को खुला रखता है और किसी संकीर्ण धर्मसैद्धांतिक व्याख्या को आरोपित नहीं करता। परंपरागत वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- issue: μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν का आशय
  choice: ताकि वह फिर कभी सड़न की ओर न लौटे
  alternative: जो अब सड़न की ओर लौटने वाला नहीं था
  rationale: दोनों रूप यीशु के पुनरुत्थान के स्थायी परिणाम को व्यक्त करते हैं। चुना हुआ हिन्दी रूप सहज है, पर पुनरुत्थान और अक्षयता के संबंध से आगे कोई अतिरिक्त सिद्धांत नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली अपनाई गई है। ‘मरे हुओं में से जिलाया’ प्रचलित बाइबलीय पुनरुत्थान-भाषा है; ‘सड़न’ शारीरिक क्षय को स्पष्ट करता है। उद्धरण में कठिन दाऊदी पदबंध को मुख्य पाठ में सहज रखा गया है और उसकी पारंपरिक तथा वाचा-संबंधी व्याख्या पादटिप्पणी में सुरक्षित है।
