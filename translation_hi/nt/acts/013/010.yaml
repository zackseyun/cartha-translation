source:
  edition: SBLGNT
  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: hi
  text: उसने कहा, “तू हर प्रकार के छल और हर प्रकार की धूर्तता से भरा हुआ है—शैतान का पुत्र, सारी धार्मिकता[a] का शत्रु! क्या तू प्रभु के सीधे मार्गों को टेढ़ा करना नहीं छोड़ेगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर प्रकार के न्याय का शत्रु।” यूनानी शब्द का अर्थ प्रसंग के अनुसार “धार्मिकता” या “न्याय” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: हर प्रकार के छल से भरा हुआ
  rationale: πλήρης के साथ संबंधकारक किसी बात से भरे या उसी से पहचाने जाने का भाव देता है। παντός की व्यापकता को स्वाभाविक हिन्दी में ‘हर प्रकार के’ से व्यक्त किया गया है।
- source_word: πάσης ῥᾳδιουργίας
  choice: हर प्रकार की दुष्टता
  rationale: ῥᾳδιουργία अनैतिक, बेईमान और नीच आचरण का बोध कराता है। ‘दुष्टता’ सामान्य पाठक के लिए स्पष्ट है और इसे ‘छल’ में मिला नहीं देता।
- source_word: υἱὲ διαβόλου
  choice: शैतान का पुत्र
  rationale: υἱέ का सीधा अर्थ ‘पुत्र’ है; यह बाइबलीय मुहावरे में नैतिक समानता या संबंध भी जता सकता है। तीखी फटकार को ज्यों का त्यों रखा गया है।
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: सारी धार्मिकता का शत्रु
  rationale: δικαιοσύνη यहाँ नैतिक खराई और जो उचित है उसका व्यापक बोध देता है। ‘धार्मिकता’ मुख्य पाठ में रखा गया है और ‘न्याय’ की संभव व्याख्या पादटिप्पणी में दी गई है।
- source_word: οὐ παύσῃ
  choice: क्या तू ... करना नहीं छोड़ेगा?
  rationale: भविष्यकालीन रूप यहाँ फटकार भरे आलंकारिक प्रश्न की तरह काम करता है। हिन्दी में यह रचना उसी टकरावपूर्ण बल को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: διαστρέφων
  choice: टेढ़ा करना
  rationale: क्रिया का अर्थ किसी सीधी या सही चीज़ को मोड़ना, बिगाड़ना या विकृत करना है। ‘सीधे मार्गों’ के साथ ‘टेढ़ा करना’ मूल रूपक को स्पष्ट रूप से बनाए रखता है।
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: प्रभु के सीधे मार्गों
  rationale: ὁδοί के शाब्दिक और रूपक दोनों अर्थों को ‘मार्ग’ समेटता है। εὐθείας की सीधाई को बनाए रखने से अगली क्रिया ‘टेढ़ा करना’ के साथ मूल का विरोधाभास सुरक्षित रहता है।
- source_word: Ὦ
  choice: तू ... है
  rationale: Ὦ जोरदार प्रत्यक्ष संबोधन का चिह्न है। आधुनिक हिन्दी में अलग से ‘हे’ रखने के बजाय ‘तू’ और विस्मयात्मक आरोपों के द्वारा उसका तीखा संबोधन स्वाभाविक रूप में व्यक्त होता है।
theological_decisions:
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: इस प्रसंग में शब्द नैतिक खराई और हर सही बात के व्यापक विरोध को सूचित करता है, इसलिए मुख्य पाठ में ‘धार्मिकता’ उपयुक्त है। फिर भी δικαιοσύνη में ‘न्याय’ का भाव संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी रखी गई है, पर मूल की कठोर फटकार को नरम नहीं किया गया। एकवचन ‘तू’ अपमानपूर्ण प्रत्यक्ष संबोधन और लगातार प्रयुक्त एकवचन रूपों के अनुकूल है। डैश से संबोधन में आए आरोपों की श्रृंखला स्पष्ट होती है।
