source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: hi
  text: 'अन्ताकिया की कलीसिया में भविष्यद्वक्ता और शिक्षक थे: बरनबास, शिमोन जो नीगर[a] कहलाता था, कुरेनेवासी लूकियुस[b], मनाहेम, जो चौथाई प्रदेश के शासक हेरोदेस के साथ पला-बढ़ा था[c], और शाऊल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नीगर” एक लैटिन नाम है, जिसका अर्थ “काला” है। यहाँ इसे नाम के रूप में ही रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात लूकियुस उत्तरी अफ्रीका के कुरेने नगर का निवासी था।
    reason: cultural_note
  - marker: c
    text: या, “हेरोदेस का घनिष्ठ साथी।” यूनानी शब्द का अर्थ “हेरोदेस के साथ पाला-बढ़ाया गया व्यक्ति” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: थे
  rationale: Ἦσαν अस्तित्व सूचित करता है; δέ हल्का कथानक-संयोजक है, जिसे हिन्दी में अलग शब्द से व्यक्त करना आवश्यक नहीं।
- source_word: ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: अन्ताकिया की कलीसिया में
  rationale: यह वाक्यांश अन्ताकिया की स्थानीय मसीही मण्डली को बताता है; संक्षिप्त हिन्दी अभिव्यक्ति स्थान और समुदाय दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: προφῆται καὶ διδάσκαλοι
  choice: भविष्यद्वक्ता और शिक्षक
  rationale: दोनों सेवकाई-भूमिकाओं को सीधे और बिना किसी बाद की संस्थागत व्यवस्था को आरोपित किए प्रस्तुत करता है।
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: शिमोन जो नीगर कहलाता था
  rationale: कृदन्त καλούμενος को स्वाभाविक हिन्दी में व्यक्त किया गया है और लैटिन उपनाम को अनूदित करने के बजाय लिप्यंतरित किया गया है।
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: कुरेनेवासी लूकियुस
  rationale: ὁ Κυρηναῖος का अर्थ कुरेने का निवासी है; हिन्दी में ‘कुरेनेवासी’ संक्षिप्त और स्पष्ट है।
- source_word: Μαναήν
  choice: मनाहेम
  rationale: यह नाम हिब्रानी पृष्ठभूमि के अनुरूप प्रचलित हिन्दी बाइबलीय रूप में दिया गया है।
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: चौथाई प्रदेश के शासक हेरोदेस
  rationale: τετραάρχης ऐतिहासिक शासकीय पद है; अर्थपूर्ण हिन्दी पदवी पाठक को केवल लिप्यंतरण से अधिक स्पष्टता देती है।
- source_word: σύντροφος
  choice: के साथ पला-बढ़ा
  rationale: शब्द साझा पालन-पोषण या साथ बड़े होने का संबंध सूचित कर सकता है; यह व्यापक अर्थ को रखता है और निश्चित रूप से ‘दूध-भाई’ नहीं ठहराता।
theological_decisions:
- issue: अन्ताकिया में सेवकाई की भूमिकाओं का स्वरूप
  choice: ‘भविष्यद्वक्ता और शिक्षक’ को स्थानीय कलीसिया में पहचानी गई भूमिकाओं के रूप में सीधे प्रस्तुत किया गया।
  alternative: इन्हें बाद की किसी विशिष्ट औपचारिक पद-व्यवस्था के पद मानना।
  rationale: पद इन व्यक्तियों की भूमिकाएँ बताता है, पर किसी बाद की सम्प्रदायगत पदानुक्रम व्यवस्था को परिभाषित नहीं करता।
- issue: मनाहेम और हेरोदेस के बीच σύντροφος का संबंध
  choice: ‘के साथ पला-बढ़ा’
  alternative: ‘दूध-भाई’ या केवल ‘घनिष्ठ साथी’
  rationale: मूल शब्द साझा परवरिश का संकेत देता है, पर वास्तविक जैविक या पालन-संबंध की संकीर्ण प्रकृति निश्चित नहीं करता; मुख्य पाठ और पादटिप्पणी इस अस्पष्टता को बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘कलीसिया’ परिचित हिन्दी बाइबलीय शब्द है; व्यक्तिनामों में प्रचलित हिन्दी रूप अपनाए गए हैं। सूची को सहज बनाने के लिए ‘कई’ जोड़ा गया है, जो बहुवचन और उसके बाद दी गई नामावली का स्वाभाविक हिन्दी संकेत है।
