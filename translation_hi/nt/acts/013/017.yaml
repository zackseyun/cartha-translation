source:
  edition: SBLGNT
  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: hi
  text: इस्राएल की इस प्रजा के परमेश्वर ने हमारे पूर्वजों[a] को चुना, और मिस्र देश में परदेशी होकर रहने के दौरान उस प्रजा को महान बनाया[b]; और ऊँची भुजा से[c] उन्हें वहाँ से निकाल लाया[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हमारे पितरों।”
    reason: lexical_alternative
  - marker: b
    text: या “उस प्रजा को ऊँचा उठाया” अथवा “उस प्रजा को बढ़ाया।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “ऊँची भुजा के साथ”; यह निर्गमन से जुड़ा मुहावरा है, जो परमेश्वर के सामर्थ्यपूर्ण छुटकारे को दर्शाता है।
    reason: cultural_note
  - marker: d
    text: या “उन्हें वहाँ से बाहर ले आया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: इस इस्राएली प्रजा के परमेश्वर
  rationale: यूनानी संबंधसूचक रचना का स्वाभाविक हिन्दी रूप है और ‘इस्राएल’ को प्रजा की पहचान के रूप में स्पष्ट करता है।
- source_word: ἐξελέξατο
  choice: चुन लिया
  rationale: मध्यवाच्य रूप को हिन्दी में सहज ढंग से व्यक्त करता है; अलग से ‘अपने लिए’ जोड़ना आवश्यक नहीं।
- source_word: τοὺς πατέρας ἡμῶν
  choice: हमारे पूर्वजों
  rationale: सन्दर्भ में इस्राएल की पिछली पीढ़ियों और कुलपिताओं का बोध है; आधुनिक हिन्दी में ‘पूर्वज’ अधिक स्वाभाविक है, जबकि शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: τὸν λαὸν ὕψωσεν
  choice: इस प्रजा को महान बनाया
  rationale: ὕψωσεν में ऊँचा उठाने, प्रतिष्ठित करने या बढ़ाने की सम्भावना है; ‘महान बनाया’ अर्थ को किसी एक आयाम तक सीमित नहीं करता।
- source_word: ἐν τῇ παροικίᾳ ἐν γῇ Αἰγύπτου
  choice: जब यह प्रजा मिस्र देश में परदेशी होकर रह रही थी
  rationale: παροικία के विदेशी निवास के भाव को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है और γῇ को ‘देश’ से दर्शाता है।
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: अपना ऊँचा उठा हुआ भुजबल दिखाकर
  rationale: निर्गमन-परम्परा के ‘ऊँची भुजा’ रूपक को बनाए रखते हुए हिन्दी में उसके सामर्थ्य-प्रदर्शन के आशय को बोधगम्य बनाता है।
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: वह उन्हें वहाँ से निकाल लाया
  rationale: ἐξάγω की बाहर निकालने की दिशात्मकता और मिस्र की ओर संकेत, दोनों स्वाभाविक हिन्दी में व्यक्त होते हैं।
theological_decisions:
- issue: इस्राएल के पितरों के लिए पद
  choice: हमारे पूर्वजों
  alternative: हमारे पितरों
  rationale: यूनानी में पुल्लिंग πατέρας है, पर इस ऐतिहासिक सन्दर्भ में आधुनिक हिन्दी का ‘पूर्वज’ उसी पुरुष पूर्वज-समूह को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- issue: मिस्र में ὕψωσεν का अर्थ
  choice: प्रजा को महान बनाया
  alternative: प्रजा को ऊँचा उठाया; प्रजा को बढ़ाया
  rationale: क्रिया प्रतिष्ठा, उत्कर्ष या संख्यात्मक वृद्धि की ओर संकेत कर सकती है। मुख्य पाठ जानबूझकर व्यापक अर्थ रखता है और विकल्प पादटिप्पणी में देता है।
- issue: ‘ऊँची भुजा’ का निर्गमन रूपक
  choice: अपना ऊँचा उठा हुआ भुजबल दिखाकर
  alternative: अपनी सामर्थी भुजा से
  rationale: रूपक को मिटाए बिना परमेश्वर के सामर्थ्यपूर्ण उद्धार का आशय स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। ‘प्रजा’, ‘परदेशी होकर रहना’ और ‘भुजबल’ बाइबलीय-ऐतिहासिक स्वर बनाए रखते हैं, पर वाक्यरचना सामान्य पाठक के लिए स्पष्ट रखी गई है।
