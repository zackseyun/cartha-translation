revisions:
- from: इस इस्राएली प्रजा के परमेश्वर ने हमारे पूर्वजों[a] को चुन लिया। जब यह प्रजा मिस्र देश में परदेशी होकर रह रही थी, तब उसने इसे महान बनाया[b]; और अपना ऊँचा उठा हुआ भुजबल दिखाकर[c] वह उन्हें वहाँ से निकाल लाया[d]।
  to: इस्राएल की इस प्रजा के परमेश्वर ने हमारे पूर्वजों[a] को चुना, और मिस्र देश में परदेशी होकर रहने के दौरान उस प्रजा को महान बनाया[b]; और ऊँची भुजा से[c] उन्हें वहाँ से निकाल लाया[d]।
  rationale: The revision preserves the source’s appositional identification of Israel, removes minor overtranslation in “चुन लिया,” and, most importantly, restores the concrete “high arm” Exodus idiom without adding that God displayed his strength. The rendering of ὕψωσεν as “महान बनाया” remains suitably broad, with alternatives retained in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:54:35Z'
review_pass:
  verdict: revise
  source_fidelity: Draft preserves the principal historical sequence and the broad sense of ἐξελέξατο, ὕψωσεν, παροικία, and ἐξήγαγεν. However, “अपना ऊँचा उठा हुआ भुजबल दिखाकर” adds an act of displaying and converts the concrete biblical image “with a high/uplifted arm” into an abstract display of strength. This should be revised to retain the source image without added action.
  naturalness: The draft is generally readable in modern standard Hindi. “इस्राएली प्रजा” is less close to the appositional “this people, Israel” and can be made more natural and precise as “इस्राएल की इस प्रजा.” “चुना” is simpler and more direct than “चुन लिया” here.
  terminology: “परमेश्वर,” “पूर्वजों,” “प्रजा,” and “मिस्र देश” suit a dignified public-reading register. “पूर्वजों” is an acceptable idiomatic rendering of πατέρας when the literal masculine-family term is retained in a footnote. “ऊँची भुजा” appropriately preserves the Exodus idiom.
  issues:
  - severity: medium
    issue: The rendering of μετὰ βραχίονος ὑψηλοῦ adds content.
    rationale: “अपना ऊँचा उठा हुआ भुजबल दिखाकर” introduces “दिखाकर” and changes βραχίων (“arm”) into “भुजबल” (“strength of the arm”). The Greek states the means/image, not that God displayed it. “ऊँची भुजा से” retains the idiom and avoids interpretive expansion.
  - severity: low
    issue: “इस इस्राएली प्रजा” does not best reflect “this people Israel.”
    rationale: The Greek identifies the people as Israel in apposition. “इस्राएल की इस प्रजा” keeps Israel as the name of the people and makes the demonstrative explicit.
  - severity: low
    issue: “चुन लिया” slightly overexpresses the verb’s aspect/nuance.
    rationale: The aorist middle ἐξελέξατο is adequately and more neutrally rendered by “चुना”; no additional completed-result nuance is needed.
  revised_text: इस्राएल की इस प्रजा के परमेश्वर ने हमारे पूर्वजों[a] को चुना, और मिस्र देश में परदेशी होकर रहने के दौरान उस प्रजा को महान बनाया[b]; और ऊँची भुजा से[c] उन्हें वहाँ से निकाल लाया[d]।
