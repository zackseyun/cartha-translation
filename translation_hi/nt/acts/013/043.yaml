  text: λυθείσης δὲ τῆς συναγωγῆς ἠκολούθησαν πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων τῷ Παύλῳ καὶ τῷ Βαρναβᾷ, οἵτινες προσλαλοῦντες ⸀αὐτοῖς ἔπειθον· αὐτοὺς ⸀προσμένειν τῇ χάριτι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: hi
  text: आराधनालय की सभा समाप्त होने पर[a], बहुत-से यहूदी और यहूदी धर्म अपनाने वाले भक्त लोग पौलुस और बरनबास के पीछे चल पड़े। पौलुस और बरनबास उनसे बातचीत करते हुए उन्हें समझाते रहे कि वे परमेश्वर के अनुग्रह में बने रहें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आराधनालय की सभा बिखरने पर।” यूनानी में आशय भवन का बंद होना नहीं, एकत्र सभा का समाप्त होना है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन्हें प्रेरित करते रहे कि वे परमेश्वर के अनुग्रह में बने रहें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης ... τῆς συναγωγῆς
  choice: आराधनालय की सभा समाप्त होने पर
  rationale: यह संबंधकारक निरपेक्ष रचना पहले घटित परिस्थिति बताती है। यहाँ συναγωγή का आशय भवन से अधिक वहाँ एकत्र सभा है; इसलिए हिंदी में स्वाभाविक रूप से सभा के समाप्त होने को स्पष्ट किया गया है।
- source_word: ἠκολούθησαν
  choice: पीछे हो लिए
  rationale: यहाँ लोग सभा के बाद पौलुस और बरनबास के साथ उनके पीछे गए। ‘पीछे हो लिए’ प्रत्यक्ष क्रिया को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων
  choice: यहूदी और भक्त यहूदी-मतान्तरित
  rationale: प्रσήλυτος यहूदी धर्म स्वीकार करने वाले व्यक्ति को दर्शाता है, केवल सहानुभूति रखने वाले परमेश्वर-भक्त को नहीं। σεβομένων उनकी भक्तिपरायणता जोड़ता है।
- source_word: προσλαλοῦντες αὐτοῖς
  choice: उनसे बातचीत करते हुए
  rationale: कृदन्त साथ-साथ चल रही, उन लोगों की ओर निर्देशित बातचीत को दर्शाता है। यह हिंदी में स्वाभाविक और अर्थानुकूल है।
- source_word: ἔπειθον
  choice: समझाया
  rationale: अपूर्ण काल निरंतर प्रयास का संकेत देता है। संदर्भ में क्रिया आग्रह और कायल करने, दोनों की छाया रखती है; ‘समझाया’ हिंदी में इस संवादात्मक प्रोत्साहन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτοὺς προσμένειν
  choice: वे ... बने रहें
  rationale: προσμένω का अर्थ टिके रहना या जारी रहना है। ‘बने रहें’ अगली दत्तिवाचक अभिव्यक्ति के साथ सहज हिंदी बनाता है।
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: परमेश्वर के अनुग्रह में
  rationale: ‘अनुग्रह’ χάρις के धार्मिक और संबंधपरक भार को बनाए रखता है, और ‘में’ उस अनुग्रह के क्षेत्र में बने रहने का खुला अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: ‘परमेश्वर के अनुग्रह में बने रहें’ का आशय
  choice: परमेश्वर के अनुग्रह में बने रहें
  alternative: परमेश्वर की कृपा के पात्र बने रहें; परमेश्वर के अनुग्रह के संदेश पर टिके रहें
  rationale: यूनानी पद परमेश्वर के अनुग्रहपूर्ण कार्य, उसकी कृपा में जीवन, और अनुग्रह के सुसमाचार से जुड़े रहने—इन अर्थछायाओं को समेट सकता है। अधिक संकीर्ण व्याख्या थोपने के बजाय मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘आराधनालय’, ‘मतान्तरित’ और ‘अनुग्रह’ संदर्भगत सटीकता रखते हैं; वाक्य को हिंदी की स्वाभाविक पठनीयता के लिए दो भागों में रखा गया है।
