source:
  edition: SBLGNT
  text: διὰ τοῦτο ηὐφράνθη ⸂ἡ καρδία μου⸃ καὶ ἠγαλλιάσατο ἡ γλῶσσά μου, ἔτι δὲ καὶ ἡ σάρξ μου κατασκηνώσει ἐπ’ ἐλπίδι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/026.yaml
  text: Because of this my heart was glad[a], and my tongue rejoiced; moreover, even my flesh will dwell in hope.
translation:
  language: hi
  text: इसी कारण मेरा हृदय आनन्दित हुआ और मेरी जीभ उल्लसित हुई; इतना ही नहीं, मेरा तन[a] भी आशा में निवास करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा शरीर भी आशा में विश्राम करेगा।”
    reason: σάρξ को ‘शरीर’ और κατασκηνώσει को प्रसंगानुसार ‘विश्राम करेगा’ समझने वाला सम्भव वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: διά के साथ कर्मकारक τοῦτο कारण या आधार व्यक्त करता है। ‘इसी कारण’ इस कारणात्मक सम्बन्ध को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: ηὐφράνθη ἡ καρδία μου
  choice: मेरा हृदय आनन्दित हुआ
  rationale: यह अतीतकालीन निष्क्रिय रूप यहाँ अवस्था को व्यक्त करने वाले अकर्मक भाव में है। ‘हृदय’ बाइबलीय मानवीय रूपक को बिना मनोवैज्ञानिक संकुचन के बनाए रखता है।
- source_word: ἠγαλλιάσατο ἡ γλῶσσά μου
  choice: मेरी जीभ मगन हुई
  rationale: क्रिया प्रबल और उल्लासपूर्ण आनन्द व्यक्त करती है। ‘जीभ’ मूल काव्यात्मक बिम्ब को बनाए रखती है; इसे व्याख्यात्मक रूप से ‘मुँह’ या ‘वाणी’ नहीं किया गया।
- source_word: ἔτι δὲ καὶ
  choice: इतना ही नहीं ... भी
  rationale: यह संयोजन कथन को आगे बढ़ाकर अगले अंग पर बल देता है। यह हिन्दी संरचना विस्तार और बल दोनों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἡ σάρξ μου
  choice: मेरा तन
  rationale: σάρξ यहाँ नैतिक अर्थ में ‘पापी स्वभाव’ नहीं, बल्कि देहधारी अस्तित्व को सूचित करता है। ‘तन’ मूल के शारीरिक भाव को रखते हुए हिन्दी में ‘मांस’ से अधिक स्वाभाविक और काव्यात्मक है।
- source_word: κατασκηνώσει
  choice: निवास करेगा
  rationale: क्रिया का मूल बिम्ब डेरा डालने या बसे रहने का है। ‘निवास करेगा’ इस बिम्ब को बनाए रखता है और इसे केवल ‘विश्राम करेगा’ के अर्थ तक सीमित नहीं करता।
- source_word: ἐπ’ ἐλπίδι
  choice: आशा में
  rationale: ἐπί के साथ सम्प्रदान कारक यहाँ आधार या क्षेत्र का भाव दे सकता है। ‘आशा में’ इस अर्थगत विस्तार और आशापूर्ण सुरक्षा को बिना अतिरिक्त व्याख्या के बनाए रखता है।
theological_decisions:
- issue: पुनरुत्थान के सन्दर्भ में σάρξ का अनुवाद
  choice: मेरा तन
  alternative: मेरा शरीर
  rationale: यहाँ σάρξ शाब्दिक और मानवशास्त्रीय अर्थ में है, नैतिक अर्थ में नहीं। ‘तन’ देहधारी अस्तित्व को स्वाभाविक हिन्दी में व्यक्त करता है और पुनरुत्थान का निष्कर्ष पद के भीतर स्पष्ट रूप से जोड़ने से बचता है।
- issue: κατασκηνώσει ἐπ’ ἐλπίδι का भाव
  choice: आशा में निवास करेगा
  alternative: आशा में विश्राम करेगा
  rationale: चुना गया अनुवाद सुरक्षित निवास के बिम्ब को बनाए रखता है। ‘विश्राम करेगा’ सम्भव प्रासंगिक अर्थ है, पर वह क्रिया के व्यापक निवास-बिम्ब को कुछ संकुचित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘हृदय’, ‘जीभ’ और ‘तन’ मूल के मानवीय बिम्बों को सुरक्षित रखते हैं; ‘निवास करेगा’ जानबूझकर रूपक को पूरी तरह व्याख्यायित नहीं करता।
