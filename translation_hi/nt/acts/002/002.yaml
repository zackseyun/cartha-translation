source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἄφνω ἐκ τοῦ οὐρανοῦ ἦχος ὥσπερ φερομένης πνοῆς βιαίας καὶ ἐπλήρωσεν ὅλον τὸν οἶκον οὗ ἦσαν καθήμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/002.yaml
  text: And suddenly there came from heaven a sound like that of a violent rushing wind[a], and it filled the whole house where they were sitting.
translation:
  language: hi
  text: और अचानक स्वर्ग से ऐसी आवाज़ आई, मानो प्रचण्ड वेग से हवा चल रही हो[a]; और उस आवाज़ से वह पूरा घर भर गया, जहाँ वे बैठे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रचण्ड वेग से बहती हवा जैसी आवाज़।” यूनानी पाठ उस आवाज़ की तुलना गतिशील, बलशाली वायु से करता है; वह स्पष्ट रूप से यह नहीं कहता कि वहाँ वास्तव में हवा चल रही थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: आई
  rationale: अवैयक्तिक घटना-वर्णन को स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ कर्ता ‘आवाज़’ है।
- source_word: ἄφνω
  choice: अचानक
  rationale: घटना के अकस्मात घटने का सीधा और प्रचलित आधुनिक हिन्दी रूप।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से
  rationale: लूका-प्रेरितों के प्रसंग में केवल आकाशीय दिशा नहीं, बल्कि स्वर्गीय स्रोत का भाव भी सुरक्षित रखता है।
- source_word: ἦχος
  choice: आवाज़
  rationale: यह व्यापक और सहज हिन्दी शब्द है; ‘गर्जना’ मूल से अधिक विशिष्ट होती।
- source_word: ὥσπερ
  choice: मानो
  rationale: स्पष्ट करता है कि पाठ हवा और आवाज़ के बीच उपमा देता है, वास्तविक हवा की उपस्थिति को सीधे नहीं कहता।
- source_word: φερομένης πνοῆς βιαίας
  choice: प्रचण्ड वेग से हवा चल रही हो
  rationale: गतिशील और बलशाली वायु के संयुक्त बिंब को स्वाभाविक हिन्दी में रखता है; ‘चल रही हो’ φερομένης की गति को व्यक्त करता है।
- source_word: ἐπλήρωσεν
  choice: भर गया
  rationale: यूनानी में ‘आवाज़’ ही घर को भरती है; हिन्दी वाक्य में ‘उस आवाज़ से’ जोड़कर इस संबंध को स्पष्ट और सहज रखा गया है।
- source_word: ὅλον τὸν οἶκον
  choice: वह पूरा घर
  rationale: ὅλον की समग्रता और पहले से पहचाने जा रहे स्थान का संकेत सुरक्षित रखता है।
- source_word: οὗ ἦσαν καθήμενοι
  choice: जहाँ वे बैठे थे
  rationale: सरल, समकालीन हिन्दी में स्थानवाचक संबंध और जारी अवस्था दोनों व्यक्त करता है।
theological_decisions:
- issue: हवा से तुलना की गई घटना का स्वरूप
  choice: मुख्य पाठ इसे ऐसी आवाज़ बताता है, मानो प्रचण्ड वेग से हवा चल रही हो।
  alternative: वास्तव में प्रचण्ड हवा ने घर को भर दिया।
  rationale: ὥσπερ उपमा को चिह्नित करता है। अनुवाद वास्तविक हवा की उपस्थिति मान लेने के बजाय मूल पाठ की संयमित और खुली अभिव्यक्ति बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली। ‘प्रचण्ड वेग’ बल और गति दोनों को व्यक्त करता है। मुख्य पाठ में [a] का चिह्न संबंधित उपमा के तुरंत बाद रखा गया है।
