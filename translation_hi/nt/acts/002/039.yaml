source:
  edition: SBLGNT
  text: ὑμῖν γάρ ἐστιν ἡ ἐπαγγελία καὶ τοῖς τέκνοις ὑμῶν καὶ πᾶσι τοῖς εἰς μακρὰν ὅσους ἂν προσκαλέσηται κύριος ὁ θεὸς ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/039.yaml
  text: For the promise is for you and for your children and for all who are far off[b][a], as many as the Lord our God calls.
translation:
  language: hi
  text: क्योंकि यह प्रतिज्ञा तुम्हारे लिए, तुम्हारी संतानों के लिए, और उन सबके लिए है जो दूर हैं[a]—जितनों को प्रभु, हमारा परमेश्वर, बुलाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन सभी के लिए जो बहुत दूर हैं।” यह वाक्यांश भौगोलिक दूरी, परमेश्वर की वाचा से दूरी, या दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन सभी के लिए जिन्हें प्रभु, हमारा परमेश्वर, बुलाता है।” यूनानी का शाब्दिक भाव है, “जितनों को प्रभु, हमारा परमेश्वर, बुलाए।”
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले पद में पतरस के आह्वान का आधार बताता है और हिन्दी में कारणसूचक संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπαγγελία
  choice: प्रतिज्ञा
  rationale: यूनानी संज्ञा सीधे 'प्रतिज्ञा' को बताती है; निकट संदर्भ में पवित्र आत्मा का वरदान है, पर यहाँ स्वयं प्रतिज्ञा कही गई है।
- source_word: τέκνοις
  choice: संतानों
  rationale: यह पारिवारिक अर्थ बनाए रखता है और केवल कम आयु के बच्चों तक सीमित किए बिना बच्चों अथवा वंशजों को समेट सकता है।
- source_word: πᾶσι τοῖς εἰς μακράν
  choice: उन सबके लिए ... जो दूर हैं
  rationale: यह भौगोलिक अथवा वाचा-संबंधी दूरी—या दोनों—की सम्भावना खुली रखता है।
- source_word: ὅσους ἂν προσκαλέσηται
  choice: जितनों को ... बुलाएगा
  rationale: यह अनिश्चित किन्तु व्यापक समूह को व्यक्त करता है। हिन्दी का भविष्यकाल प्रसंग में स्वाभाविक है और बुलाहट की प्रणाली को सिद्धान्तगत रूप से परिभाषित नहीं करता।
- source_word: κύριος ὁ θεὸς ἡμῶν
  choice: प्रभु हमारा परमेश्वर
  rationale: मूल की उपाधि, संबंध और कर्ता की पहचान सीधे सुरक्षित रहती है।
theological_decisions:
- issue: '''जो दूर हैं'' का दायरा'
  choice: वाक्यांश को व्यापक रखा गया है और उसे केवल दूर बसे यहूदियों या केवल गैर-यहूदियों तक सीमित नहीं किया गया।
  alternative: दूर बसे प्रवासी यहूदी; गैर-यहूदी; अथवा भौगोलिक और वाचा-संबंधी दोनों अर्थों में दूर लोग।
  rationale: मूल वाक्यांश अनेक संकेतों को सम्भव बनाता है; अनुवाद उस वास्तविक अस्पष्टता को सुरक्षित रखता है।
- issue: ईश्वरीय बुलाहट का स्वरूप
  choice: ‘जितनों को ... बुलाएगा’ कहकर कथन को मूल के निकट रखा गया है।
  alternative: विशेष रूप से प्रभावकारी बुलाहट; अथवा सामान्य निमंत्रण।
  rationale: यह पद बुलाहट की प्रक्रिया अथवा धार्मिक तंत्र को परिभाषित नहीं करता, इसलिए किसी सम्प्रदायगत निष्कर्ष को नहीं जोड़ा गया।
- issue: ὅσους ἂν का पिछले पदांश से संबंध
  choice: ‘अर्थात’ और दीर्घ विराम द्वारा इसे प्रतिज्ञा पाने वालों के दायरे को स्पष्ट करने वाले पदांश के रूप में प्रस्तुत किया गया है।
  alternative: साधारण अल्पविराम के साथ ‘जितनों को...’ या ‘उन सभी के लिए जिन्हें...’।
  rationale: यह हिन्दी में संबंध को स्पष्ट करता है, पर बुलाए जाने वालों की संख्या या पहचान को मूल से अधिक निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय और सामान्य पाठक के लिए सहज शैली रखी गई है। ‘प्रतिज्ञा’, ‘प्रभु’ और ‘परमेश्वर’ बाइबलीय शब्दावली की निरन्तरता रखते हैं; ‘संतानों’ से आयु को अनावश्यक रूप से सीमित नहीं किया गया।
