source:
  edition: SBLGNT
  text: προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ χριστοῦ ὅτι ⸂οὔτε ἐγκατελείφθη⸃ εἰς ⸀ᾅδην ⸀οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/031.yaml
  text: 'Foreseeing this[a], he spoke about the resurrection of the Messiah: that he was neither abandoned to Hades[d][c][b], nor did his flesh see decay.'
translation:
  language: hi
  text: उसने यह पहले से देखकर मसीह के पुनरुत्थान के विषय में कहा कि वह न तो अधोलोक के हवाले छोड़ा गया[a], और न उसकी देह ने सड़न देखी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अधोलोक में नहीं छोड़ा गया।” ‘अधोलोक’ से आशय मृतकों का लोक है, विशेष रूप से अंतिम दंड का स्थान नहीं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसके मांस ने सड़न नहीं देखी”; अर्थात उसकी देह सड़ी नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδὼν
  choice: पहले से यह देखकर
  rationale: अओरिस्ट कृदंत आने वाली बात को पहले ही देख लेने का भाव देता है। संदर्भ से ‘यह’ जोड़ने पर हिन्दी स्वाभाविक रहती है।
- source_word: ἐλάλησεν
  choice: कहा
  rationale: यहाँ दाऊद द्वारा भविष्यसूचक कथन व्यक्त करने के लिए सहज आधुनिक हिन्दी में ‘कहा’ उपयुक्त है।
- source_word: περὶ τῆς ἀναστάσεως
  choice: पुनरुत्थान के विषय में
  rationale: περί के साथ संबंधकारक का अर्थ ‘के विषय में’ है; यह औपचारिक किंतु सुबोध हिन्दी है।
- source_word: τοῦ χριστοῦ
  choice: मसीह के
  rationale: यहाँ Χριστός पवित्रशास्त्र में प्रतिज्ञात अभिषिक्त जन की उपाधि के रूप में प्रयुक्त है; ‘मसीह’ हिन्दी में स्थापित और शीर्षकीय अर्थ वाला रूप है।
- source_word: οὔτε ἐγκατελείφθη
  choice: न तो वह ... छोड़ दिया गया
  rationale: निष्क्रिय ἐγκαταλείπω का अर्थ छोड़ देना या त्याग देना है। ‘छोड़ दिया गया’ स्वाभाविक है और οὔτε...οὔτε की युग्मित नकारात्मक रचना को बनाए रखता है।
- source_word: εἰς ᾅδην
  choice: अधोलोक में
  rationale: ᾅδης मृतकों के लोक को सूचित करता है, अंतिम दंड-स्थान को अनिवार्यतः नहीं। इस उद्धरण में εἰς को स्थिति के अर्थ में ‘में’ कहना हिन्दी में स्वाभाविक है; ‘के हवाले’ भी संभव है।
- source_word: ἡ σὰρξ αὐτοῦ
  choice: उसके शरीर
  rationale: σάρξ का मूल अर्थ ‘मांस’ है, पर यहाँ वह ठोस रूप से मसीह की देह को सूचित करता है। ‘शरीर’ आधुनिक हिन्दी में स्पष्ट है और किसी नैतिक ‘पापी स्वभाव’ का गलत संकेत नहीं देता।
- source_word: εἶδεν διαφθοράν
  choice: सड़न देखी
  rationale: यूनानी मुहावरे ‘सड़न देखना’ को निकटता से सुरक्षित रखा गया है; διαφθορά यहाँ शारीरिक विघटन या सड़ने को बताता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: पतरस के शास्त्रीय तर्क में यह प्रतिज्ञात अभिषिक्त की उपाधि है। ‘मसीह’ हिन्दी पाठकों में स्थापित है और शीर्षकीय अर्थ को व्यक्त करता है।
- issue: ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: मृतकों का लोक; पाताल
  rationale: ‘अधोलोक’ मृतकों के लोक का संकेत देता है और इसे अंतिम न्याय के दंड-स्थान ‘नरक’ के साथ नहीं मिलाता।
- issue: σάρξ का अनुवाद
  choice: शरीर
  alternative: मांस; देह
  rationale: यहाँ शब्द नैतिक या रूपकात्मक ‘पापी स्वभाव’ नहीं, भौतिक देह को दर्शाता है। ‘शरीर’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी मूल शब्द का शाब्दिक रूप बताती है।
- issue: εἰς ᾅδην में संबंध
  choice: अधोलोक में छोड़ दिया गया
  alternative: अधोलोक के हवाले छोड़ दिया गया
  rationale: यूनानी εἰς सामान्यतः ‘में/की ओर’ है, पर इस भजन-उद्धरण में क्रिया के साथ स्थान अथवा अधिकार के हवाले किए जाने—दोनों की छाया संभव है। मुख्य पाठ स्वाभाविक स्थानगत अर्थ रखता है और पादटिप्पणी विकल्प दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सुबोध रूप रखा गया है। वाक्य में οὔτε...οὔτε के समानांतर ‘न तो...और न’ संरचना सुरक्षित है। ‘अधोलोक’ को ‘नरक’ से अलग रखा गया है, और शरीर-संबंधी अर्थ स्पष्ट करने के लिए मुख्य पाठ में ‘शरीर’ तथा पादटिप्पणी में शाब्दिक ‘मांस’ दिया गया है।
