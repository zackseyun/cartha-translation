source:
  edition: SBLGNT
  text: ἀσφαλῶς οὖν γινωσκέτω πᾶς οἶκος Ἰσραὴλ ὅτι καὶ κύριον ⸂αὐτὸν καὶ χριστὸν⸃ ⸂ἐποίησεν ὁ θεός⸃, τοῦτον τὸν Ἰησοῦν ὃν ὑμεῖς ἐσταυρώσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/036.yaml
  text: Therefore let all the house of Israel know for certain that God has made him both Lord and Messiah—this Jesus whom you crucified[a][b].
translation:
  language: hi
  text: इसलिए इस्राएल का सारा घराना निश्चयपूर्वक जान ले कि परमेश्वर ने इसी यीशु को—जिसे तुमने क्रूस पर चढ़ाया—प्रभु और मसीहा[a], दोनों बनाया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा ‘मसीह’। यूनानी पदवी Χριστός (ख्रिस्तोस) का अर्थ ‘अभिषिक्त जन’ है; यहाँ इस्राएल को दिए गए पतरस के संबोधन में उसके पदवीगत अर्थ को स्पष्ट करने के लिए ‘मसीहा’ कहा गया है।
    reason: alternative_reading
  - marker: b
    text: ‘प्रभु और मसीहा दोनों बनाया है’ से आशय है कि परमेश्वर ने यीशु को इन भूमिकाओं में ऊँचा उठाकर सार्वजनिक रूप से प्रतिष्ठित किया; यह उसके दिव्य स्वभाव में परिवर्तन की बात नहीं कहता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλῶς
  choice: निश्चयपूर्वक
  rationale: यह क्रिया-विशेषण पतरस के कथन की निश्चितता पर बल देता है; ‘निश्चयपूर्वक’ आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्पष्ट रूप से जोड़ता है।
- source_word: γινωσκέτω
  choice: जान ले
  rationale: तीसरे पुरुष की आज्ञार्थक क्रिया है, जो सामूहिक रूप से ‘इस्राएल के सारे घराने’ को संबोधित करती है; एकवचन ‘जान ले’ उसके व्याकरणिक रूप और आग्रह दोनों को बनाए रखता है।
- source_word: πᾶς οἶκος Ἰσραήλ
  choice: इस्राएल का सारा घराना
  rationale: यह वाचा के लोगों के लिए प्रयुक्त बाइबलीय सामूहिक अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: κύριον
  choice: प्रभु
  rationale: इस प्रसंग में यह यीशु के ऊँचे अधिकार को व्यक्त करता है और पिछले भजन-उद्धरण से भी जुड़ता है; ‘स्वामी’ अपेक्षाकृत कमजोर होगा।
- source_word: χριστόν
  choice: मसीहा
  rationale: इस्राएल को दिए गए संबोधन में यह पदवीगत अर्थ रखता है; ‘मसीहा’ अभिषिक्त प्रतिज्ञात राजा की धारणा को स्पष्ट करता है।
- source_word: ἐποίησεν
  choice: बनाया है
  rationale: मूल क्रिया के सामान्य अर्थ को बनाए रखते हुए पूर्ण किए गए उस कार्य की वर्तमान प्रासंगिकता व्यक्त होती है; अधिक व्याख्यात्मक ‘नियुक्त किया’ को मुख्य पाठ में नहीं रखा गया।
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: इसी यीशु को
  rationale: ‘इसी’ यूनानी संकेतवाचक की बलाघातपूर्ण पहचान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: जिसे तुमने क्रूस पर चढ़ाया
  rationale: यह श्रोताओं की भूमिका पर पतरस के सीधे और आरोपात्मक बल को सुरक्षित रखता है।
theological_decisions:
- issue: ‘परमेश्वर ने ... प्रभु और मसीहा दोनों बनाया है’ का मसीह-विज्ञान संबंधी अर्थ
  choice: मूल के ‘बनाया’ को बनाए रखते हुए पादटिप्पणी में इसे यीशु के उद्धार-इतिहास संबंधी उत्कर्ष और सार्वजनिक प्रतिष्ठापन के रूप में स्पष्ट किया गया है।
  alternative: मुख्य पाठ में ‘नियुक्त किया’ या ‘ठहराया’ कहना; अथवा इसे यीशु के दिव्य स्वभाव में परिवर्तन मानना।
  rationale: ἐποίησεν का सीधा अर्थ दबाया नहीं जाना चाहिए, पर प्रसंग पुनरुत्थान और उत्कर्ष के द्वारा यीशु की प्रभुता और मसीहाई पद की सार्वजनिक स्थापना पर केंद्रित है; पाठ स्वयं उसके मूल स्वभाव में परिवर्तन नहीं कहता।
- issue: Χριστός का अनुवाद
  choice: मसीहा
  alternative: मसीह
  rationale: ‘इस्राएल के सारे घराने’ को संबोधित इस घोषणा में प्रतिज्ञात अभिषिक्त जन की पदवी प्रमुख है; इसलिए ‘मसीहा’ अर्थ को अधिक प्रत्यक्ष बनाता है, जबकि प्रचलित ‘मसीह’ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण और सार्वजनिक उद्घोषणा के अनुकूल शैली रखी गई है। ‘इस्राएल का सारा घराना’ मूल की सामूहिक बाइबलीय अभिव्यक्ति को बनाए रखता है; डैश आरोपात्मक संबंधवाचक उपवाक्य पर उचित बल देता है।
