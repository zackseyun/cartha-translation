source:
  edition: SBLGNT
  text: τῇ δεξιᾷ οὖν τοῦ θεοῦ ὑψωθεὶς τήν τε ἐπαγγελίαν τοῦ ⸂πνεύματος τοῦ ἁγίου⸃ λαβὼν παρὰ τοῦ πατρὸς ἐξέχεεν τοῦτο ⸀ὃ ⸀ὑμεῖς βλέπετε καὶ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/033.yaml
  text: Therefore[a], having been exalted to the right hand of God, and having received from the Father the promise of the Holy Spirit[b], he has poured out this that you yourselves are seeing and hearing.
translation:
  language: hi
  text: इसलिए[a], परमेश्वर के दाहिने हाथ पर ऊँचा उठाए जाने के बाद और पिता से पवित्र आत्मा की प्रतिज्ञा[b] पाकर, उसने यह उंडेल दिया है, जिसे तुम स्वयं देख और सुन रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के दाहिने हाथ से।” यूनानी कारक का अर्थ या तो स्थान—“दाहिने हाथ पर”—या साधन—“दाहिने हाथ से”—हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “प्रतिज्ञात पवित्र आत्मा।” यूनानी वाक्यांश स्वयं आत्मा को प्रतिज्ञात वरदान या आत्मा के विषय में की गई प्रतिज्ञा—दोनों रूपों में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δεξιᾷ τοῦ θεοῦ
  choice: परमेश्वर के दाहिने हाथ पर
  rationale: यहाँ यूनानी कारक को स्थानवाचक समझना निकटवर्ती भजन 110 के सिंहासनारोहण-संदर्भ से मेल खाता है; करणवाचक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को व्यक्त करता है, केवल घटनाक्रम को नहीं।
- source_word: ὑψωθεὶς
  choice: ऊँचा उठाए जाने
  rationale: कर्मवाच्य रूप परमेश्वर द्वारा यीशु के उन्नयन को दर्शाता है; हिंदी में यह स्वाभाविक है और संदर्भ में प्रतिष्ठित किए जाने का भाव रखता है।
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος τοῦ ἁγίου
  choice: पवित्र आत्मा की प्रतिज्ञा
  rationale: 'यह संरचना के औपचारिक रूप और उसकी वास्तविक अस्पष्टता को बनाए रखती है: आशय स्वयं प्रतिज्ञात आत्मा भी हो सकता है या आत्मा के विषय में की गई प्रतिज्ञा।'
- source_word: λαβὼν παρὰ τοῦ πατρὸς
  choice: पिता से ... पाने के बाद
  rationale: यह पिता को स्रोत और कृदंत की मुख्य क्रिया से पूर्वता को सहज हिंदी में व्यक्त करता है।
- source_word: ἐξέχεεν
  choice: उसने ... उंडेल दिया है
  rationale: अतीत में पूरी हुई क्रिया के वर्तमान में दिखाई-सुनाई दे रहे परिणाम को हिंदी पूर्ण रूप से व्यक्त किया गया है।
- source_word: τοῦτο ὃ ὑμεῖς βλέπετε καὶ ἀκούετε
  choice: यह ... जिसे तुम स्वयं देख और सुन रहे हो
  rationale: ‘यह’ के अनिर्दिष्ट संकेत को सुरक्षित रखा गया है और स्पष्ट ὑμεῖς का बल ‘तुम स्वयं’ द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: τῇ δεξιᾷ का स्थानवाचक या करणवाचक अर्थ
  choice: परमेश्वर के दाहिने हाथ पर
  alternative: परमेश्वर के दाहिने हाथ से
  rationale: आसपास का सिंहासनारोहण-संदर्भ स्थानवाचक अर्थ का समर्थन करता है, पर यूनानी करणवाचक अर्थ की भी अनुमति देता है; इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
- issue: पवित्र आत्मा को प्रतिज्ञात वरदान मानना या आत्मा के विषय की प्रतिज्ञा
  choice: पवित्र आत्मा की प्रतिज्ञा
  alternative: प्रतिज्ञा किया हुआ पवित्र आत्मा
  rationale: मुख्य पाठ यूनानी संबंधकारक की अस्पष्टता को बनाए रखता है; अगला वाक्यांश आत्मा को उंडेले गए प्रतिज्ञात वरदान के रूप में समझने का समर्थन करता है, पर दूसरे अर्थ को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए स्पष्ट रूप। ‘दाहिने हाथ पर’ बाइबलीय सिंहासनारोहण की भाषा को बनाए रखता है। ‘उंडेल दिया है’ मूल रूपक और वर्तमान परिणाम दोनों को स्वाभाविक ढंग से व्यक्त करता है।
