  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। पद मूल वाक्य की सूची का अंश है, इसलिए अंत में अल्पविराम बनाए रखा गया है। जातियों और प्राचीन क्षेत्रों के परिचित हिन्दी नाम प्रयुक्त किए गए हैं; आधुनिक ‘एशिया’ से भ्रम टालने के लिए रोमी प्रांत का नाम ‘आसिया’ रखा गया और पादटिप्पणी जोड़ी गई है।
