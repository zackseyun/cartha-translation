  text: Πάρθοι καὶ Μῆδοι καὶ Ἐλαμῖται, καὶ οἱ κατοικοῦντες τὴν Μεσοποταμίαν, Ἰουδαίαν τε καὶ Καππαδοκίαν, Πόντον καὶ τὴν Ἀσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/009.yaml
  text: Parthians and Medes and Elamites[a], and those living in Mesopotamia, Judea and Cappadocia, Pontus and Asia[b],
translation:
  language: hi
  text: पार्थी, मादी और एलामी, तथा मेसोपोटामिया, यहूदिया तथा[b] कप्पदूकिया, पुन्तुस और आसिया[a] में रहनेवाले,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “आसिया” से आशय पश्चिमी एशिया माइनर में स्थित रोमी प्रांत आसिया है, आधुनिक एशिया महाद्वीप नहीं।
    reason: cultural_note
  - marker: b
    text: यूनानी संयोजन τε καί का अनुवाद साधारण “और” भी किया जा सकता है; “तथा” उसमें निहित हल्के योगात्मक भाव को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάρθοι
  choice: पार्थी
  rationale: इस प्राचीन जनसमूह के लिए प्रचलित हिन्दी जातिवाचक नाम; यूनानी बहुवचन का भाव बनाए रखता है।
- source_word: Μῆδοι
  choice: मादी
  rationale: मादै क्षेत्र के लोगों के लिए प्रचलित बाइबलीय हिन्दी नाम।
- source_word: Ἐλαμῖται
  choice: एलामी
  rationale: एलाम के निवासियों का स्वाभाविक हिन्दी जातिवाचक रूप।
- source_word: οἱ κατοικοῦντες
  choice: में रहनेवाले
  rationale: संज्ञा की तरह प्रयुक्त वर्तमान कृदंत को सहज हिन्दी में व्यक्त करता है और निवास के जारी भाव को बनाए रखता है।
- source_word: τὴν Μεσοποταμίαν
  choice: मेसोपोटामिया
  rationale: प्राचीन भौगोलिक क्षेत्र का मानक हिन्दी नाम।
- source_word: Ἰουδαίαν
  choice: यहूदिया
  rationale: क्षेत्र के नाम का प्रचलित हिन्दी रूप; इसे जातीय या धार्मिक अर्थ में विस्तृत नहीं करता।
- source_word: τε καὶ
  choice: तथा
  rationale: हल्के संयोजक अथवा योगात्मक बल को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है; इसका अर्थ केवल साधारण ‘और’ भी हो सकता है।
- source_word: Καππαδοκίαν
  choice: कप्पदूकिया
  rationale: प्राचीन क्षेत्र के नाम का स्थापित बाइबलीय हिन्दी रूप।
- source_word: Πόντον
  choice: पुन्तुस
  rationale: प्राचीन क्षेत्र के नाम का स्थापित हिन्दी लिप्यंतरण।
- source_word: τὴν Ἀσίαν
  choice: आसिया
  rationale: मूल भौगोलिक नाम को बनाए रखा गया है; आधुनिक महाद्वीप से भेद पादटिप्पणी में स्पष्ट किया गया है।
