  text: Ἀκούσαντες δὲ κατενύγησαν ⸂τὴν καρδίαν⸃, εἶπόν τε πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους· Τί ⸀ποιήσωμεν, ἄνδρες ἀδελφοί;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/037.yaml
  text: When they heard this[a], they were pierced to the heart, and they said to Peter and the rest of the apostles, “What should we do[b], brothers?”
translation:
  language: hi
  text: यह सुनकर उनका हृदय बिंध गया[a], और उन्होंने पतरस तथा बाकी प्रेरितों से कहा, “भाइयो[b], हमें क्या करना चाहिए?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके हृदय को गहरी चोट पहुँची।” यूनानी अभिव्यक्ति तीखे आंतरिक आघात या व्याकुलता का वर्णन करती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “पुरुषो, भाइयो”; यह एक रूढ़ संबोधन है, जिसका अर्थ प्रसंगानुसार “भाइयो” या “भाइयो और बहनो” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: यह सुनकर
  rationale: अओरिस्ट कृदन्त पिछली वाणी सुनने के बाद हुई प्रतिक्रिया को व्यक्त करता है। प्रसंग से ‘यह’ स्वाभाविक रूप से स्पष्ट है; δέ को अलग शब्द से व्यक्त करना हिन्दी में आवश्यक नहीं है।
- source_word: κατενύγησαν τὴν καρδίαν
  choice: उनका हृदय बिंध गया
  rationale: यह रूपक तीखी भीतरी चोट, व्याकुलता और दोष-बोध का भाव रखता है। ‘हृदय बिंध गया’ मूल की चुभने वाली छवि को बनाए रखते हुए गरिमापूर्ण और बोधगम्य हिन्दी है।
- source_word: εἶπόν τε
  choice: और उन्होंने ... कहा
  rationale: τε पहले परिणाम के साथ अगली क्रिया को निकटता से जोड़ता है। ‘कहा’ λέγω का सीधा अनुवाद है; ‘पूछा’ कथन की विषयवस्तु से निकला हुआ अधिक व्याख्यात्मक विकल्प होता।
- source_word: πρὸς τὸν Πέτρον καὶ τοὺς λοιποὺς ἀποστόλους
  choice: पतरस तथा बाकी प्रेरितों से
  rationale: λοιπούς पतरस से अलग शेष प्रेरितों को सूचित करता है। ‘बाकी प्रेरित’ आधुनिक, सहज हिन्दी में इस भेद को स्पष्ट रखता है।
- source_word: Τί ποιήσωμεν
  choice: हमें क्या करना चाहिए?
  rationale: विचारार्थक अओरिस्ट सब्जंक्टिव उचित कार्यवाही पूछता है। ‘क्या करना चाहिए’ आधुनिक हिन्दी में इस विचारार्थक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἄνδρες ἀδελφοί
  choice: भाइयो
  rationale: यह एक रूढ़ संबोधन है। ‘भाइयो’ पारिवारिक संबोधन ἀδελφοί को बनाए रखता है और दोनों यूनानी शब्दों के यांत्रिक अनुवाद से उत्पन्न असहज दोहराव से बचता है।
theological_decisions:
- issue: लिंगसूचक संबोधन
  choice: भाइयो
  alternative: भाइयो और बहनो; पुरुषो, भाइयो
  rationale: यूनानी पद व्याकरण की दृष्टि से पुल्लिंग है, इसलिए मुख्य पाठ में उसे पूरी तरह लिंग-निरपेक्ष नहीं बनाया गया। फिर भी रूढ़ संबोधन के रूप में वह प्रसंगानुसार व्यापक समुदाय को शामिल कर सकता है; यह संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। मूल रूपक को मुख्य पाठ में बचाया गया है और उसके भावार्थ को पादटिप्पणी में स्पष्ट किया गया है।
