  yaml_path: translation/nt/acts/002/012.yaml
  text: And they all were amazed and perplexed[a], saying to one another, “What does this mean?”
translation:
  language: hi
  text: वे सब चकित और उलझन में थे, और एक-दूसरे से कह रहे थे, “इसका क्या अर्थ है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξίσταντο
  choice: चकित थे
  rationale: यह क्रिया प्रबल आश्चर्य की निरंतर अवस्था व्यक्त करती है। ‘चकित थे’ आधुनिक हिन्दी में स्वाभाविक है और संदर्भ के चमत्कारपूर्ण आश्चर्य को स्पष्ट रखता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है, प्रबल विरोधसूचक नहीं; ‘और’ प्रसंग के प्रवाह के अनुकूल है।
- source_word: πάντες
  choice: वे सब
  rationale: यह रूप समूह के प्रत्येक व्यक्ति को समेटने वाला बल बनाए रखता है और हिन्दी में स्पष्ट विषय देता है।
- source_word: διηπόρουν
  choice: उलझन में पड़े थे
  rationale: क्रिया गहरी दुविधा और समझ न पाने की अवस्था बताती है। यह पदबंध अपूर्ण भूतकाल की जारी स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἄλλος πρὸς ἄλλον
  choice: एक-दूसरे से
  rationale: यह पारस्परिक अभिव्यक्ति का सहज और सटीक आधुनिक हिन्दी रूप है।
- source_word: λέγοντες
  choice: कह रहे थे
  rationale: वर्तमान कृदंत को मुख्य अपूर्ण क्रियाओं के साथ चल रही वाणी के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: Τί θέλει τοῦτο εἶναι;
  choice: इसका क्या अर्थ है?
  rationale: τί θέλει + infinitive यहाँ घटना के आशय या महत्त्व के विषय में पूछने वाला मुहावरा है। शब्दशः रूप हिन्दी में अस्वाभाविक और भ्रामक होगा।
