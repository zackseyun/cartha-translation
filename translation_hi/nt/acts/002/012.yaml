translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक। यूनानी अपूर्ण क्रियाओं की जारी अवस्था को ‘थे’ और ‘पड़े थे’ से व्यक्त किया गया है। किसी पादटिप्पणी की आवश्यकता नहीं, क्योंकि यूनानी मुहावरे का अर्थ हिन्दी में सीधे और स्वाभाविक ढंग से दिया जा सकता है।
