id: ACT.2.18
reference: Acts 2:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καί γε ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου ἐν ταῖς ἡμέραις ἐκείναις ἐκχεῶ ἀπὸ τοῦ πνεύματός μου, καὶ προφητεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/018.yaml
  text: Even on my male servants and my female servants in those days I will pour out from my Spirit[b][a], and they will prophesy.
translation:
  language: hi
  text: यहाँ तक कि उन दिनों मैं अपने दासों और अपनी दासियों[a] पर भी अपने आत्मा में से उंडेलूँगा,[b] और वे भविष्यवाणी करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्दों का अनुवाद “अपने सेवकों और अपनी सेविकाओं” भी हो सकता है। यहाँ “दासों” और “दासियों” से उनकी निम्न और बंधित सामाजिक स्थिति पर बल बना रहता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में अधिक शाब्दिक रूप से “अपने आत्मा में से” है। भावानुसार अनुवाद “अपना आत्मा उंडेलूँगा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καί γε
  choice: यहाँ तक कि ... भी
  rationale: यह प्रयोग पिछले कथन को बल देते हुए उसके दायरे में समाज के निम्न समझे जाने वाले लोगों को भी स्पष्ट रूप से सम्मिलित करता है। यह हिन्दी में स्वाभाविक ढंग से ‘even’ का उत्कर्षात्मक भाव व्यक्त करता है।
- source_word: ἐπὶ τοὺς δούλους μου καὶ ἐπὶ τὰς δούλας μου
  choice: अपने दासों और अपनी दासियों पर
  rationale: ‘दास’ और ‘दासी’ यूनानी के पुल्लिंग और स्त्रीलिंग रूपों तथा उनकी निम्न सामाजिक स्थिति—दोनों को बनाए रखते हैं। ‘अपने/अपनी’ की पुनरावृत्ति दोनों समूहों के साथ μου को दर्शाती है।
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: उन दिनों
  rationale: यह समयसूचक वाक्यांश आधुनिक हिन्दी में सहज है और यूनानी संकेतवाचक विशेषण का भाव सुरक्षित रखता है।
- source_word: ἐκχεῶ
  choice: उंडेलूँगा
  rationale: यह भविष्यकालीन क्रिया प्रचुर मात्रा में बहाकर देने के रूपक को संक्षेप और स्वाभाविक ढंग से बनाए रखती है।
- source_word: ἀπὸ τοῦ πνεύματός μου
  choice: अपने आत्मा में से
  rationale: यह ἀπό के ‘में से/से’ भाव को स्पष्ट रखता है और उसे केवल ‘अपना आत्मा’ बनाकर स्रोत की अभिव्यक्ति को समतल नहीं करता। हिन्दी में परमेश्वर के आत्मा के लिए परंपरागत पुल्लिंग ‘आत्मा’ रखा गया है।
- source_word: προφητεύσουσιν
  choice: वे भविष्यवाणी करेंगे
  rationale: यह क्रिया का सीधा और प्रचलित बाइबलीय अनुवाद है; पुरुषों और स्त्रियों के संयुक्त बहुवचन के लिए हिन्दी का सामान्य रूप प्रयुक्त हुआ है।
theological_decisions:
- issue: δοῦλος/δούλη में सेवक और दास के बीच चयन
  choice: दासों और दासियों
  alternative: सेवकों और सेविकाओं
  rationale: इस संदर्भ में दोनों लिंगों के सामाजिक रूप से अधीन लोगों का स्पष्ट उल्लेख आत्मा के उंडेले जाने की व्यापकता पर बल देता है। ‘दास/दासी’ उस निम्न और बंधित सामाजिक स्थिति को ‘सेवक/सेविका’ से अधिक स्पष्ट रखता है, जबकि पादटिप्पणी शब्दों के व्यापक अर्थ की सूचना देती है।
- issue: ἀπὸ τοῦ πνεύματός μου का संबंध
  choice: अपने आत्मा में से
  alternative: अपना आत्मा
  rationale: यूनानी पाठ में ἀπό स्पष्ट रूप से उपस्थित है। मुख्य पाठ में उसका ‘में से’ भाव रखने से मूल की संभावित अंशसूचक या स्रोतसूचक बारीकी सुरक्षित रहती है; अधिक प्रचलित अभिव्यक्ति पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘यहाँ तक कि ... भी’ बलाघात को स्वाभाविक हिन्दी में व्यक्त करता है। ‘दास/दासी’ सामान्य पाठक के लिए समझने योग्य है और प्रसंग की सामाजिक तीक्ष्णता बनाए रखता है; ‘अपने आत्मा में से’ जानबूझकर कुछ अधिक औपचारिक है ताकि यूनानी ἀπό की वास्तविक अस्पष्टता न मिटे।
