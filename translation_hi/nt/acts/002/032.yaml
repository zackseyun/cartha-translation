base_translation:
  language: en
  yaml_path: translation/nt/acts/002/032.yaml
  text: God raised up this Jesus[a], of whom we all are witnesses.
translation:
  language: hi
  text: इसी यीशु को परमेश्वर ने जिलाया, जिसके हम सब गवाह हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον τὸν Ἰησοῦν
  choice: इसी यीशु को
  rationale: τοῦτον का संकेतात्मक और बलाघाती भाव ‘इसी’ से स्वाभाविक हिन्दी में सुरक्षित रहता है और अभी-अभी उल्लिखित यीशु की ओर स्पष्ट संकेत करता है।
- source_word: ἀνέστησεν
  choice: मरे हुओं में से जिलाया
  rationale: यहाँ क्रिया का आशय पुनरुत्थान है। हिन्दी में ‘जिलाया’ सकर्मक रूप से परमेश्वर को कर्ता बनाए रखता है; ‘मरे हुओं में से’ प्रसंगगत अर्थ को स्पष्ट करता है।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: यूनानी वाक्य के स्पष्ट कर्ता को सीधे और प्रतिष्ठित हिन्दी में रखा गया है।
- source_word: οὗ
  choice: इस बात के
  rationale: यूनानी सम्बन्धवाचक सर्वनाम शाब्दिक रूप से ‘जिसके’ हो सकता है, पर साक्षी होने का आशय यीशु के पुनरुत्थान की घटना से है; ‘इस बात के’ पिछले पूरे कथन की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: πάντες ἡμεῖς
  choice: हम सब
  rationale: यह क्रम यूनानी के बल को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐσμεν μάρτυρες
  choice: गवाह हैं
  rationale: संज्ञात्मक संरचना ‘are witnesses’ को हिन्दी में ‘गवाह हैं’ स्वाभाविक और ठीक रूप से व्यक्त करती है।
theological_decisions:
- issue: पुनरुत्थान की अभिव्यक्ति
  choice: परमेश्वर ने मरे हुओं में से जिलाया
  alternative: परमेश्वर ने उठाया
  rationale: ‘जिलाया’ इस प्रसंग में पुनरुत्थान का अर्थ स्पष्ट करता है और परमेश्वर को क्रिया का कर्ता बनाए रखता है। ‘उठाया’ मूल क्रिया के रूप के अधिक निकट है, पर आधुनिक हिन्दी में केवल शारीरिक रूप से उठाने के अर्थ में समझा जा सकता है।
- issue: गवाही का विषय
  choice: इस बात के गवाह
  alternative: जिसके गवाह
  rationale: οὗ व्याकरणतः यीशु की ओर संकेत कर सकता है, जबकि अर्थ में गवाही उनके पुनरुत्थान की भी है। मुख्य पाठ घटना-संबंधी अर्थ को सहज हिन्दी में देता है और पादटिप्पणी व्यक्ति-संबंधी सम्भावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। ‘इसी यीशु’ मूल के संकेतात्मक बल को रखता है, जबकि ‘मरे हुओं में से जिलाया’ पुनरुत्थान का आशय सामान्य पाठक के लिए स्पष्ट करता है।
