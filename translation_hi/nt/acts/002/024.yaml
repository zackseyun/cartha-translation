source:
  edition: SBLGNT
  text: ὃν ὁ θεὸς ἀνέστησεν λύσας τὰς ὠδῖνας τοῦ θανάτου, καθότι οὐκ ἦν δυνατὸν κρατεῖσθαι αὐτὸν ὑπ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/024.yaml
  text: whom God raised up[a], having loosed the pains of death[b], because it was not possible for him to be held by it.
translation:
  language: hi
  text: जिसे परमेश्वर ने मृत्यु की पीड़ाओं[a] से छुड़ाकर जीवित कर उठाया, क्योंकि यह संभव नहीं था कि मृत्यु उसे अपने वश में रखे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मृत्यु की प्रसव-पीड़ाएँ’ भी संभव; यूनानी शब्द विशेष रूप से प्रसव-वेदना के लिए भी प्रयुक्त होता है और यहाँ मृत्यु की टूटती पकड़ की सजीव छवि दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उसके द्वारा’; यह सर्वनाम सबसे स्वाभाविक रूप से ‘मृत्यु’ की ओर संकेत करता है—अर्थात मृत्यु उसे पकड़े नहीं रख सकती थी।
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: उसी को
  rationale: यह संबंधवाचक सर्वनाम पिछले पद में उल्लिखित यीशु की ओर संकेत करता है। ‘उसी को’ हिन्दी में पूर्ववर्ती कथन से संबंध बनाए रखता है।
- source_word: ἀνέστησεν
  choice: जीवित कर उठाया
  rationale: यहाँ क्रिया का अर्थ परमेश्वर द्वारा यीशु को मृत्यु से उठाना है। केवल ‘उठाया’ शारीरिक रूप से खड़ा करने के अर्थ में समझा जा सकता है; ‘जीवित कर उठाया’ प्रसंगगत अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: λύσας
  choice: से मुक्त करके
  rationale: λύω का मूल भाव खोलना, छुड़ाना या मुक्त करना है। ‘पीड़ाओं को खोलकर’ हिन्दी में अस्वाभाविक है, इसलिए ‘से मुक्त करके’ उसी मुक्ति और टूटती पकड़ की छवि को सहज रूप में व्यक्त करता है।
- source_word: τὰς ὠδῖνας τοῦ θανάτου
  choice: मृत्यु की पीड़ाओं
  rationale: ὠδῖνας तीव्र पीड़ाओं अथवा प्रसव-पीड़ाओं को सूचित कर सकता है। मुख्य पाठ में ‘पीड़ाओं’ से अर्थ स्पष्ट रहता है, जबकि प्रसव-पीड़ा की संभावित छवि पादटिप्पणी में सुरक्षित है।
- source_word: καθότι
  choice: क्योंकि
  rationale: यह परमेश्वर के कार्य का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ सबसे सहज समतुल्य है।
- source_word: οὐκ ἦν δυνατὸν
  choice: यह संभव नहीं था
  rationale: यह यूनानी की निर्वैयक्तिक रचना और उसके व्याख्यात्मक स्वर को निकटता से बनाए रखता है।
- source_word: κρατεῖσθαι
  choice: अपने वश में रखे
  rationale: निष्क्रिय क्रिया यहाँ पकड़े रखने या अधिकार में रोके रखने का भाव देती है। हिन्दी में यह मृत्यु की पकड़ की छवि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὑπ’ αὐτοῦ
  choice: मृत्यु उसे
  rationale: सर्वनाम का सबसे स्वाभाविक पूर्वपद θανάτου, अर्थात ‘मृत्यु’, है। हिन्दी में अस्पष्ट ‘उसके द्वारा’ के बजाय कर्तृवाच्य रचना स्पष्ट और सहज है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ὑπ’ αὐτοῦ का संदर्भ
  choice: सर्वनाम ‘मृत्यु’ की ओर संकेत करता है
  alternative: शाब्दिक रूप ‘उसके द्वारा’; व्याकरणतः पुल्लिंग ‘उसके’ को किसी पुरुष-संदर्भ से जोड़ना भी संभव समझा जा सकता है
  rationale: निकटतम और प्रसंगानुकूल पूर्वपद θανάτου है। अगला कथन यही समझाता है कि मृत्यु यीशु को पकड़े नहीं रख सकती थी। मुख्य पाठ में ‘मृत्यु’ स्पष्ट करना हिन्दी की स्वाभाविकता के लिए उचित है, जबकि मूल की सर्वनामात्मक रचना पादटिप्पणी में सुरक्षित है।
- issue: ὠδῖνας का अर्थ
  choice: मुख्य पाठ में ‘पीड़ाओं’
  alternative: ‘प्रसव-पीड़ाओं’ या ‘यातनाओं’
  rationale: यह शब्द प्रसव-वेदना और तीव्र पीड़ा दोनों के लिए प्रयुक्त हो सकता है। यहाँ मृत्यु की पकड़ का तत्काल प्रसंग ‘पीड़ाओं’ का समर्थन करता है, पर प्रसव-पीड़ा की वास्तविक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- issue: ἀνέστησεν में पुनरुत्थान का भाव
  choice: ‘जीवित कर उठाया’
  alternative: ‘उठाया’ या ‘मरे हुओं में से जिलाया’
  rationale: प्रसंग मृत्यु से उठाए जाने का है। चुना हुआ रूप इस अर्थ को स्पष्ट करता है, पर ‘मरे हुओं में से’ जैसे शब्द जो इस पद में प्रत्यक्ष नहीं हैं, नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जीवित कर उठाया’ पुनरुत्थान के प्रसंग को स्पष्ट करता है; ‘अपने वश में रखे’ मृत्यु की पकड़ का रूपक बनाए रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित पदों के तुरंत बाद दिए गए हैं।
