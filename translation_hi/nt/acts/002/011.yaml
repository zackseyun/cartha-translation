lexical_decisions:
- source_word: Ἰουδαῖοί
  choice: यहूदी
  rationale: यहाँ यह शब्द यहूदी लोगों के जातीय-धार्मिक समुदाय को सूचित करता है, केवल यहूदिया प्रदेश के निवासियों को नहीं।
- source_word: τε καὶ
  choice: और
  rationale: हिन्दी में जुड़े हुए दोनों समूहों को स्वाभाविक रूप से साथ रखता है; अलग से ‘दोनों’ जोड़ना इस सूची में बोझिल होता।
- source_word: προσήλυτοι
  choice: यहूदी मत अपनानेवाले
  rationale: यह गैर-यहूदियों में से यहूदी धर्म स्वीकार करनेवालों को स्पष्ट करता है और आधुनिक सामान्य पाठक के लिए पारिभाषिक ‘धर्मान्तरितों’ से अधिक सहज है।
- source_word: Κρῆτες
  choice: क्रेतेवासी
  rationale: क्रेते द्वीप के निवासियों के लिए स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: Ἄραβες
  choice: अरब
  rationale: अरब लोगों के लिए प्रचलित आधुनिक हिन्दी नाम।
- source_word: ἀκούομεν
  choice: हम ... सुन रहे हैं
  rationale: वर्तमान काल की तत्काल अनुभूति और चल रही घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λαλούντων αὐτῶν
  choice: हम उन्हें ... बोलते सुन रहे हैं
  rationale: ἀκούομεν के साथ आए संबंधवाचक कृदन्त का अर्थ बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: ταῖς ἡμετέραις γλώσσαις
  choice: अपनी-अपनी भाषाओं
  rationale: पिन्तेकुस्त के तत्काल प्रसंग में γλῶσσα पहचानी जानेवाली मानवीय भाषाओं को सूचित करता है; ‘अपनी-अपनी’ भीड़ के अलग-अलग भाषाई अनुभव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰ μεγαλεῖα
  choice: महान कार्यों
  rationale: परमेश्वर के उल्लेखनीय और सामर्थ्यपूर्ण कामों का व्यापक अर्थ बनाए रखता है; किसी खास प्रकार के चमत्कार तक अर्थ सीमित नहीं करता।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर के
  rationale: सम्बन्धकारक रूप इन महान कार्यों को परमेश्वर के कार्य बताता है।
theological_decisions:
- issue: पिन्तेकुस्त के प्रसंग में γλώσσαις का अर्थ
  choice: पहचानी जानेवाली मानवीय भाषाएँ
  alternative: अमानवीय या भावावेशपूर्ण अन्यभाषी वाणी
  rationale: आस-पास का वर्णन अलग-अलग क्षेत्रों से आए लोगों के अपनी-अपनी भाषा में सुनने पर बल देता है। ‘भाषाओं’ अनुवाद कथानक के प्रत्यक्ष अर्थ को दर्शाता है, फिर भी पादटिप्पणी मूल शब्द के ‘जीभ/अन्य भाषा’ अर्थक्षेत्र को बताती है।
