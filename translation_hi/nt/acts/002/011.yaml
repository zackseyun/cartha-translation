    issue: The phrase “परमेश्वर के महान कार्यों के बारे में बोलते” adds “के बारे में” and makes the Greek direct object less direct.
    rationale: τὰ μεγαλεῖα τοῦ θεοῦ denotes God’s great or mighty acts. Hindi “परमेश्वर के महान कार्यों की चर्चा करते” expresses proclamation/discussion of those acts naturally without the avoidable circumlocution.
  - severity: medium
    issue: “यहूदी मत अपनानेवाले” is broader and potentially ambiguous for προσήλυτοι.
    rationale: In this setting προσήλυτοι refers specifically to Gentile adherents/converts to Judaism. “यहूदी धर्म अपनानेवाले” preserves that specification more clearly.
