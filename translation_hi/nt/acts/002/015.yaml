lexical_decisions:
- source_word: οὐ γὰρ
  choice: क्योंकि ... नहीं
  rationale: γάρ पिछले कथन के उत्तर में व्याख्यात्मक कारण देता है, और οὐ आरोप का निषेध करता है। हिंदी में ‘क्योंकि’ इस तर्क-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὡς ὑμεῖς ὑπολαμβάνετε
  choice: जैसा तुम समझ रहे हो
  rationale: ὑπολαμβάνετε यहाँ ‘मानना/समझना’ है। वर्तमान संदर्भ में ‘समझ रहे हो’ सीधा संबोधन और चल रही धारणा दोनों को सहज हिंदी में रखता है।
- source_word: οὗτοι
  choice: ये लोग
  rationale: οὗτοι आरोपित समूह की ओर संकेत करता है। केवल ‘ये’ की अपेक्षा ‘ये लोग’ हिंदी में अधिक स्वाभाविक है और समूह का लिंग अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: μεθύουσιν
  choice: नशे में हैं
  rationale: क्रिया यहाँ मदिरा के प्रभाव में होने की आरोपित अवस्था बताती है। ‘नशे में हैं’ आधुनिक हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: ἔστιν γὰρ ὥρα τρίτη τῆς ἡμέρας
  choice: अभी तो दिन का तीसरा पहर ही है
  rationale: दूसरा γάρ निषेध का कारण देता है। ‘अभी तो ... ही’ हिंदी में उस कारणात्मक और बलात्मक प्रवाह को स्वाभाविक बनाता है, जबकि समय की प्राचीन गणना मुख्य पाठ में बनी रहती है।
- source_word: ὥρα τρίτη
  choice: तीसरा पहर
  rationale: यह सूर्योदय से गिनी गई तीसरी घड़ी, लगभग सुबह नौ बजे, को दर्शाता है। ‘तीसरा पहर’ शाब्दिक समय-संकेत को बनाए रखता है; आधुनिक समय पादटिप्पणी में स्पष्ट किया गया है।
