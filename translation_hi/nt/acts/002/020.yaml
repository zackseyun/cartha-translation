  rationale: भविष्यत् कर्मवाच्य और परिवर्तन की छवि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; एकवचन क्रिया निकटवर्ती ‘चाँद’ से जुड़ती है और पहले खंड में भी वही क्रिया समझी जाती है।
