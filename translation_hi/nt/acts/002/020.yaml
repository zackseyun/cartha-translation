- source_word: εἰς αἷμα
  choice: लहू में
  rationale: यूनानी की तीखी, शाब्दिक भविष्यद्वाणी-संबंधी छवि को बनाए रखता है और इसे व्याख्यात्मक रूप से केवल ‘लहू-सा लाल’ नहीं बनाता।
- source_word: πρὶν ἢ ἐλθεῖν
  choice: आने से पहले
  rationale: दो घटनाओं के समय-संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡμέραν κυρίου
  choice: प्रभु का ... दिन
  rationale: भविष्यद्वाणी में प्रयुक्त स्थापित बाइबलीय पदबंध को सुरक्षित रखता है और इसे सप्ताह के किसी दिन के अर्थ से अलग रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος का सामान्य और गरिमापूर्ण हिन्दी समतुल्य है तथा योएल की पृष्ठभूमि की ओर संकेत बनाए रखता है।
- source_word: μεγάλην
  choice: महान
  rationale: μέγας का सीधा अर्थ देता है और ऊँची भविष्यद्वाणी-संबंधी शैली बनाए रखता है।
- source_word: ἐπιφανῆ
  choice: प्रकट
  rationale: शब्द के ‘दिखाई देने वाला, स्पष्टतः प्रकट’ अर्थ को सीधे सुरक्षित रखता है; ‘महिमामय’ भी प्रसंगानुकूल सम्भव अर्थ है, इसलिए उसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: योएल के उद्धरण में ἡμέραν κυρίου का अनुवाद
  choice: प्रभु का दिन
  alternative: प्रभु-दिवस
  rationale: ‘प्रभु का दिन’ ईश्वरीय आगमन/हस्तक्षेप के भविष्यद्वाणी-संबंधी पदबंध को स्पष्ट रखता है और बाद की कलीसियाई शब्दावली को आरोपित नहीं करता।
- issue: अन्तकालीन प्रसंग में ἐπιφανῆ का अर्थ
  choice: प्रकट
  alternative: महिमामय
  rationale: ἐπιφανής में प्रकट या दृष्टिगोचर होने और वैभवशाली होने—दोनों की अर्थ-छायाएँ सम्भव हैं। मुख्य पाठ में अधिक प्रत्यक्ष शाब्दिक अर्थ रखा गया है और दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
