  source_fidelity: The draft accurately represents the daily, united persistence in the temple complex, the breaking of bread, participation in food, gladness, and simplicity of heart. However, “घर-घर जाकर” adds an explicit sense of going/traveling that is not expressed by κατ’ οἶκον. The distributive sense is adequately retained by “घर-घर” without this added motion.
