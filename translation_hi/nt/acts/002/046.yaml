  terminology: “मन्दिर-परिसर” appropriately distinguishes ἱερόν, the temple complex, from the inner sanctuary. “रोटी तोड़ते” properly retains the source expression without deciding whether it is ordinary table fellowship or the Lord’s Supper. The footnotes preserve the relevant lexical and interpretive alternatives.
