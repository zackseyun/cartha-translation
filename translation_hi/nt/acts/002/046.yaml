id: ACT.2.46
reference: Acts 2:46
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν τε προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ, κλῶντές τε κατ’ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/046.yaml
  text: And day by day[a], continuing together with one purpose in the temple courts, and breaking bread from house to house, they were sharing meals with gladness and simplicity of heart[d][c][b],
translation:
  language: hi
  text: वे हर दिन एक मन होकर मन्दिर-परिसर[a] में निरन्तर उपस्थित रहते थे; वे घर-घर रोटी तोड़ते[b] और आनन्द तथा मन की सरलता[d] के साथ मिलकर भोजन[c] करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द पूरे मन्दिर-परिसर को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं।
    reason: cultural_note
  - marker: b
    text: ‘रोटी तोड़ना’ साधारण साझा भोजन को सूचित कर सकता है; कुछ लोग इसमें प्रभु-भोज भी सम्मिलित समझते हैं।
    reason: alternative_reading
  - marker: c
    text: 'शाब्दिक अर्थ: ‘भोजन-वस्तु’ या ‘खाना’।'
    reason: lexical_alternative
  - marker: d
    text: इसका अनुवाद ‘निष्कपट मन’ या ‘उदार मन’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: हर दिन
  rationale: κατά के साथ यह वितरणात्मक प्रयोग प्रतिदिन दोहराई जाने वाली गतिविधि बताता है; ‘हर दिन’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: προσκαρτεροῦντες
  choice: निरन्तर उपस्थित रहते थे
  rationale: वर्तमान कृदन्त लगातार बने रहने या नियमित रूप से लगे रहने का भाव देता है। मन्दिर-परिसर के स्थानवाचक पद के साथ ‘उपस्थित रहते थे’ स्वाभाविक है और अनावश्यक रूप से भक्ति-संबंधी अर्थ नहीं जोड़ता।
- source_word: ὁμοθυμαδόν
  choice: एक मन होकर
  rationale: यह शब्द सामूहिक एकता और समान उद्देश्य दोनों व्यक्त करता है; ‘एक मन होकर’ प्रचलित, सहज और गरिमापूर्ण हिन्दी है।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर-परिसर में
  rationale: ἱερόν पूरे मन्दिर-परिसर को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं। ‘मन्दिर-परिसर’ इस भेद को स्पष्ट रखता है।
- source_word: κλῶντές ... ἄρτον
  choice: रोटी तोड़ते
  rationale: मूल अभिव्यक्ति को अक्षुण्ण रखा गया है, क्योंकि यह सामान्य सामूहिक भोजन को सूचित कर सकती है और प्रभु-भोज की ओर भी संकेत कर सकती है।
- source_word: κατ’ οἶκον
  choice: घर-घर जाकर
  rationale: κατά का वितरणात्मक भाव विभिन्न घरों में बार-बार होने वाली गतिविधि को दर्शाता है; ‘घर-घर जाकर’ हिन्दी में इसे स्पष्ट करता है।
- source_word: μετελάμβανον τροφῆς
  choice: मिलकर भोजन करते थे
  rationale: अपूर्णकालीन क्रिया लगातार की जाने वाली सहभागिता बताती है। ‘मिलकर भोजन करते थे’ प्रसंग की सामुदायिकता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना भोजन की धार्मिक प्रकृति निश्चित किए।
- source_word: ἐν ἀγαλλιάσει
  choice: आनन्द के साथ
  rationale: ἀγαλλίασις प्रफुल्ल और उमंगपूर्ण आनन्द दर्शाता है; ‘आनन्द’ सामान्य पाठक के लिए सहज और गरिमापूर्ण है।
- source_word: ἀφελότητι καρδίας
  choice: मन की सरलता के साथ
  rationale: ἀφελότης निष्कपट, बनावटरहित सरलता या एकनिष्ठता का व्यापक भाव रखता है। ‘मन की सरलता’ मूल की व्यापकता बनाए रखती है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: क्या ‘रोटी तोड़ना’ स्पष्ट रूप से प्रभु-भोज के रूप में अनूदित किया जाए
  choice: मुख्य पाठ में व्यापक अभिव्यक्ति ‘रोटी तोड़ते’ बनाए रखी गई है।
  alternative: इसे केवल साधारण साझा भोजन या स्पष्ट रूप से प्रभु-भोज कहना।
  rationale: लूका–प्रेरितों के काम में यह अभिव्यक्ति सामान्य भोजन-संगति को सूचित कर सकती है और प्रभु-भोज की अनुगूँज भी रख सकती है। निकट प्रसंग में τροφή (‘भोजन’) साधारण सामूहिक भोजन का समर्थन करता है, पर धार्मिक संकेत को पूर्णतः नकारता नहीं; इसलिए अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण सामुदायिक वर्णन रखा गया है। ‘एक मन होकर’, ‘मन्दिर-परिसर’ और ‘रोटी तोड़ते’ जैसे पद मूल के अर्थ तथा उसकी सम्भावित धार्मिक अनुगूँज दोनों को सुरक्षित रखते हैं।
