source:
  edition: SBLGNT
  text: ἐξίσταντο ⸀δὲ καὶ ἐθαύμαζον ⸀λέγοντες· ⸀Οὐχ ἰδοὺ ⸀πάντες οὗτοί εἰσιν οἱ λαλοῦντες Γαλιλαῖοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/007.yaml
  text: And they were astonished and amazed[a], saying, “Look, are not all these who are speaking Galileans?”
translation:
  language: hi
  text: और वे चकित और विस्मित थे और कह रहे थे, “देखो[a], क्या बोलने वाले ये सभी गलीली नहीं हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देखिए।”
    reason: ἰδοὺ ध्यान आकर्षित करने वाला उद्गार है; ‘देखो’ के स्थान पर ‘देखिए’ भी उसका भाव व्यक्त कर सकता है।
lexical_decisions:
- source_word: ἐξίσταντο
  choice: चकित
  rationale: यहाँ क्रिया गहरे अचम्भे या स्तब्धता की दशा व्यक्त करती है। ‘चकित’ आधुनिक हिन्दी में स्वाभाविक है और प्रतिक्रिया की तीव्रता बनाए रखता है।
- source_word: δὲ
  choice: और
  rationale: यह हल्का कथात्मक संयोजक है, जो वर्णन को आगे बढ़ाता है; प्रसंग में ‘और’ स्वाभाविक है।
- source_word: καὶ
  choice: और
  rationale: यह दोनों प्रतिक्रियाओं को जोड़कर उनके संचयी भाव को बनाए रखता है।
- source_word: ἐθαύμαζον
  choice: विस्मित
  rationale: यह आश्चर्य और कौतुक की प्रतिक्रिया व्यक्त करता है। ‘विस्मित’ पहले ‘चकित’ के साथ मिलकर मूल की दोहरी अभिव्यक्ति को बनाए रखता है।
- source_word: λέγοντες
  choice: कहने लगे
  rationale: यह कृदन्त उनकी प्रतिक्रिया के साथ-साथ बोले गए शब्दों का परिचय देता है। हिन्दी कथन-शैली में ‘कहने लगे’ स्वाभाविक है।
- source_word: Οὐχ
  choice: क्या ... नहीं हैं?
  rationale: यह ऐसा नकारात्मक प्रश्न आरम्भ करता है जिसमें सकारात्मक उत्तर अपेक्षित है। हिन्दी की नकारात्मक प्रश्न-रचना उसी संकेत को व्यक्त करती है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह श्रोताओं का ध्यान खींचने वाला उद्गार है। ‘देखो’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: πάντες οὗτοί
  choice: ये सभी
  rationale: यह सामने चर्चित पूरे समूह को सूचित करता है; मूल में ‘पुरुष’ स्पष्ट रूप से नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: οἱ λαλοῦντες
  choice: जो बोल रहे हैं
  rationale: मूल का संज्ञा-सदृश वर्तमान कृदन्त चल रही वाणी की क्रिया को दिखाता है; यह हिन्दी में उसका स्वाभाविक रूप है।
- source_word: Γαλιλαῖοι
  choice: गलीली
  rationale: यह गलील प्रदेश से संबंधित लोगों का क्षेत्रीय नाम है। हिन्दी में प्रचलित रूप ‘गलीली’ मूल की सादी क्षेत्रीय पहचान को बनाए रखता है।
theological_decisions:
- issue: ‘गलीली’ शब्द में निहित सामाजिक या क्षेत्रीय आशय
  choice: केवल क्षेत्रीय पहचान ‘गलीली’ रखी गई है।
  alternative: ‘अनपढ़ गलीली’ या उच्चारण, सामाजिक स्तर अथवा उत्तरी मूल की व्याख्या जोड़ना।
  rationale: पद वक्ताओं के गलीली होने पर आश्चर्य व्यक्त करता है, पर आश्चर्य का कारण स्पष्ट नहीं करता। कोई सामाजिक, शैक्षिक या भाषायी व्याख्या जोड़ना पाठ से आगे जाना होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चकित और विस्मित’ मूल की निकटार्थी दो क्रियाओं की संचयी तीव्रता को सुरक्षित रखता है। नकारात्मक प्रश्न का रूप इस अपेक्षा को बनाए रखता है कि उत्तर ‘हाँ’ होगा।
