  yaml_path: translation/nt/acts/002/047.yaml
  text: praising God and having favor with all the people[a]. And the Lord was adding day by day those who were being saved to them.
translation:
  language: hi
  text: वे परमेश्वर की स्तुति करते थे और सभी लोगों की सद्भावना पाते थे। और प्रभु प्रतिदिन उन लोगों को, जिनका उद्धार हो रहा था, उनके साथ[a] जोड़ता जाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, यूनानी वाक्यांश ἐπὶ τὸ αὐτό का अर्थ “एक साथ” अथवा “एक ही स्थान पर” भी हो सकता है; संदर्भ में इसका अर्थ “उनकी संख्या में” भी समझा जाता है।
    reason: ἐπὶ τὸ αὐτό के अर्थ और προσετίθει के साथ उसके वाक्य-संबंध में वास्तविक अस्पष्टता।
lexical_decisions:
- source_word: αἰνοῦντες
  choice: स्तुति करते थे
  rationale: वर्तमान कृदंत समुदाय की निरंतर गतिविधि बताता है; हिंदी में अपूर्ण भूतकाल इसका स्वाभाविक रूप है।
- source_word: ἔχοντες χάριν πρὸς ὅλον τὸν λαόν
  choice: सब लोगों की कृपा के पात्र थे
  rationale: यह मुहावरा सामान्यतः लोगों से अनुग्रह या सद्भाव पाने का अर्थ देता है, न कि उनकी ओर सद्भाव रखने का।
- source_word: ὁ δὲ κύριος προσετίθει
  choice: और प्रभु ... जोड़ता जाता था
  rationale: δέ को सहज कथात्मक संयोजक से व्यक्त किया गया है और अपूर्णकाल προσετίθει की लगातार/बार-बार होती क्रिया को ‘जोड़ता जाता था’ से सुरक्षित रखा गया है।
- source_word: τοὺς σῳζομένους
  choice: जिनका उद्धार हो रहा था
  rationale: वर्तमान कर्मवाच्य कृदंत उद्धार को यहाँ जारी दैवी क्रिया के रूप में प्रस्तुत करता है; इसे पूर्ण अवस्था में नहीं बदला गया।
- source_word: καθ’ ἡμέραν
  choice: प्रतिदिन
  rationale: यह क्रमशः हर दिन होने वाली क्रिया का स्वाभाविक और संक्षिप्त हिंदी रूप है।
- source_word: ἐπὶ τὸ αὐτό
  choice: उनके साथ
  rationale: संदर्भ में यह मौजूदा समुदाय से जोड़े जाने का संभावित अर्थ देता है, जबकि यूनानी वाक्यांश की वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: τοὺς σῳζομένους में उद्धार का पक्ष
  choice: जिनका उद्धार हो रहा था
  alternative: जिनका उद्धार हो चुका था; उद्धार पाए हुए लोग
  rationale: यूनानी वर्तमान कर्मवाच्य कृदंत प्रक्रिया का भाव रखता है। अनुवाद व्यापक उद्धार-क्रम संबंधी मतभेदों का निर्णय किए बिना उसी पक्ष को सुरक्षित रखता है।
- issue: ἐπὶ τὸ αὐτό का अर्थ और संबंध
  choice: उनके साथ
  alternative: एक साथ; एक ही स्थान पर; उनकी संख्या में
  rationale: προσετίθει के साथ संदर्भ समुदाय में सम्मिलित किए जाने की ओर संकेत करता है, पर वाक्यांश स्वयं ‘एक साथ’ या ‘एक ही स्थान पर’ भी हो सकता है। इसलिए मुख्य पाठ स्वाभाविक सामुदायिक अर्थ देता है और विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सामुदायिक वर्णन के अनुरूप। ‘कृपा के पात्र’ स्थापित हिंदी मुहावरा है, और ‘जोड़ता जाता था’ अपूर्णकाल की निरंतरता स्पष्ट करता है। पादटिप्पणी-चिह्न उसी विवादित यूनानी वाक्यांश के अनुवाद के बाद रखा गया है।
