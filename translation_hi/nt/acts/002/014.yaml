id: ACT.2.14
reference: Acts 2:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Σταθεὶς δὲ ⸀ὁ Πέτρος σὺν τοῖς ἕνδεκα ἐπῆρεν τὴν φωνὴν αὐτοῦ καὶ ἀπεφθέγξατο αὐτοῖς· Ἄνδρες Ἰουδαῖοι καὶ οἱ κατοικοῦντες Ἰερουσαλὴμ ⸀πάντες, τοῦτο ὑμῖν γνωστὸν ἔστω καὶ ἐνωτίσασθε τὰ ῥήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/014.yaml
  text: 'But Peter[a], standing with the eleven, raised his voice and declared to them: “Men of Judea and all who dwell in Jerusalem, let this be known to you[b], and give ear to my words.”'
translation:
  language: hi
  text: परन्तु पतरस उन ग्यारह के साथ खड़ा हुआ, अपनी आवाज़ ऊँची की और उनसे कहा, “यहूदिया के पुरुषो[a] और यरूशलेम के सभी निवासियो, यह बात जान लो और मेरी बातों को ध्यान से सुनो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदी पुरुषो।”
    reason: Ἰουδαῖοι का अर्थ प्रसंग के अनुसार ‘यहूदिया के लोग’ या ‘यहूदी’ हो सकता है।
lexical_decisions:
- source_word: Σταθεὶς δὲ ὁ Πέτρος
  choice: परन्तु पतरस ... खड़ा हुआ
  rationale: Σταθείς दृश्य की आरम्भिक क्रिया बताता है; ‘खड़ा हुआ’ स्वाभाविक हिन्दी है। δέ पिछले पद में उपहास करने वालों की बात से विरोधात्मक मोड़ दिखाता है, इसलिए ‘परन्तु’ चुना गया।
- source_word: σὺν τοῖς ἕνδεκα
  choice: उन ग्यारह के साथ
  rationale: σύν सहचर्य व्यक्त करता है। ‘उन ग्यारह’ शेष प्रेरितों की ओर संकेत को बनाए रखता है।
- source_word: ἐπῆρεν τὴν φωνὴν αὐτοῦ
  choice: ऊँचे स्वर में
  rationale: यह यूनानी मुहावरा सार्वजनिक रूप से आवाज़ ऊँची करके बोलने का भाव देता है। हिन्दी में ‘ऊँचे स्वर में’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀπεφθέγξατο αὐτοῖς
  choice: उनसे कहने लगा
  rationale: क्रिया सार्वजनिक और प्रभावपूर्ण कथन का संकेत दे सकती है। ‘कहने लगा’ भाषण के आरम्भ को स्पष्ट करता है, पर क्रिया में स्वतः प्रेरित या भविष्यसूचक वाणी का अतिरिक्त धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
- source_word: Ἄνδρες Ἰουδαῖοι
  choice: यहूदिया के पुरुषो
  rationale: ἄνδρες के स्पष्ट पुल्लिंग सम्बोधन को रखा गया है। Ἰουδαῖοι भौगोलिक रूप से यहूदिया के लोगों अथवा जातीय-धार्मिक रूप से यहूदियों को सूचित कर सकता है; मुख्य पाठ में प्रसंगानुकूल भौगोलिक अर्थ रखा और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: οἱ κατοικοῦντες Ἰερουσαλὴμ πάντες
  choice: यरूशलेम के सभी निवासियो
  rationale: वर्तमान कृदन्त वहाँ रहने वालों को सूचित करता है और πάντες की समावेशी व्यापकता ‘सभी’ में सुरक्षित है। सम्बोधन के कारण ‘निवासियो’ स्वाभाविक है।
- source_word: τοῦτο ὑμῖν γνωστὸν ἔστω
  choice: यह बात जान लो
  rationale: आज्ञार्थक अभिव्यक्ति औपचारिक रूप से बात को जान लेने या स्पष्ट रूप से समझ लेने का आग्रह करती है। ‘जान लो’ आधुनिक हिन्दी में संक्षिप्त और प्रभावपूर्ण है।
- source_word: ἐνωτίσασθε τὰ ῥήματά μου
  choice: मेरी बातों पर ध्यान दो
  rationale: ἐνωτίσασθε केवल सुनने नहीं, ध्यानपूर्वक सुनने की आज्ञा देता है। ‘मेरी बातों पर ध्यान दो’ उस बल को स्वाभाविक हिन्दी में रखता है और ῥήματα के बहुवचन भाव को भी व्यक्त करता है।
theological_decisions:
- issue: Ἄνδρες के लिंग-विशिष्ट सम्बोधन को बनाए रखना
  choice: पुरुषो
  alternative: लोगो
  rationale: यूनानी ἄνδρες स्पष्ट रूप से पुरुषों को सम्बोधित करता है; इसे लिंग-निरपेक्ष बनाना स्रोत की विशिष्टता मिटा देता।
- issue: ἀπεφθέγξατο में प्रेरित या भविष्यसूचक वाणी का अर्थ स्पष्ट रूप से जोड़ना या न जोड़ना
  choice: कहने लगा
  alternative: प्रेरणा से घोषणा की
  rationale: प्रसंग में पवित्र आत्मा का कार्य महत्त्वपूर्ण है, पर इस क्रिया के अनुवाद में अकेले उसी आधार पर ‘प्रेरणा से’ जोड़ना पद में निहित से अधिक व्याख्या कर देगा।
- issue: Ἰουδαῖοι का भौगोलिक अथवा जातीय-धार्मिक अर्थ
  choice: यहूदिया के
  alternative: यहूदी
  rationale: यरूशलेम के सार्वजनिक सम्बोधन में भौगोलिक अर्थ उपयुक्त है, फिर भी यूनानी रूप दोनों अर्थ ग्रहण कर सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक भाषण के अनुकूल हिन्दी रखी गई है। ‘परन्तु’, सम्बोधन-रूप ‘पुरुषो/निवासियो’ और आदेशात्मक ‘जान लो… ध्यान दो’ पतरस के औपचारिक तथा दृढ़ वक्तव्य का स्वर बनाए रखते हैं।
