  text: τοῦτον τῇ ὡρισμένῃ βουλῇ καὶ προγνώσει τοῦ θεοῦ ⸀ἔκδοτον διὰ ⸀χειρὸς ἀνόμων προσπήξαντες ἀνείλατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/023.yaml
  text: this man[a], delivered up according to the determined plan and foreknowledge of God[b], you killed by nailing him to a cross through the hands of lawless men.
translation:
  language: hi
  text: इसी यीशु को[a]—जो परमेश्वर की ठहराई हुई योजना और पूर्वज्ञान के अनुसार सौंपा गया था—तुमने अधर्मी लोगों[b] के हाथों उसे क्रूस पर कीलों से जड़वाकर मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “इसी को” या “इस व्यक्ति को”; संदर्भ में संकेत यीशु की ओर है।
    reason: संदर्भगत स्पष्टीकरण
  - marker: b
    text: “अधर्मी” का अर्थ यहाँ “व्यवस्था-विहीन” या “व्यवस्था को न माननेवाले” भी हो सकता है।
    reason: शाब्दिक विकल्प
lexical_decisions:
- source_word: τοῦτον
  choice: इसी यीशु को
  rationale: संकेतवाचक सर्वनाम का बल ‘इसी’ से सुरक्षित रहता है। निकटवर्ती संदर्भ में इसका संकेत यीशु की ओर है; नाम दोहराने से आधुनिक हिन्दी में संदर्भ स्पष्ट और स्वाभाविक रहता है।
- source_word: τῇ ὡρισμένῃ βουλῇ
  choice: ठहराई हुई योजना के अनुसार
  rationale: ὡρισμένῃ किसी निश्चित या निर्धारित बात को और βουλή योजना, उद्देश्य या सम्मति को व्यक्त करता है। ‘के अनुसार’ दत्तिव विभक्ति के मानक/आधार संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ προγνώσει τοῦ θεοῦ
  choice: और परमेश्वर के पूर्वज्ञान
  rationale: ‘पूर्वज्ञान’ πρόγνωσις का सटीक और प्रचलित धार्मिक हिन्दी प्रतिशब्द है। ‘परमेश्वर के’ को योजना और पूर्वज्ञान दोनों से संबद्ध समझा जाता है।
- source_word: ἔκδοτον
  choice: सौंपा गया था
  rationale: यह शब्द किसी को दूसरे के अधिकार में दे दिए जाने को दर्शाता है। कर्मवाच्य रूप मूल पाठ की संक्षिप्तता बनाए रखता है और यहाँ सौंपने वाले कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: διὰ χειρὸς ἀνόμων
  choice: अधर्मी लोगों के हाथों
  rationale: διά के साथ संबंधकारक मध्यस्थ साधन या कर्तृत्व दर्शाता है। यूनानी में ‘हाथ’ एकवचन है, पर हिन्दी का ‘के हाथों’ स्वाभाविक मुहावरा है। ‘अधर्मी’ ἀνόμων की व्यवस्था-विरोधी अथवा व्यवस्था-रहित धारणा को सामान्य पाठक के लिए सहज रूप में व्यक्त करता है।
- source_word: προσπήξαντες
  choice: क्रूस पर कीलों से जड़वाकर
  rationale: क्रिया का अर्थ ठोंककर या कीलों से जड़कर बाँधना है। प्रसंग क्रूस-दंड का है; ‘जड़वाकर’ मध्यस्थ लोगों के हाथों किए गए कार्य और संबोधित श्रोताओं की जिम्मेदारी, दोनों को स्पष्ट रखता है।
- source_word: ἀνείλατε
  choice: मार डाला
  rationale: यहाँ ἀναιρέω का अर्थ मार डालना या प्राण लेना है। सीधा वाक्यांश पतरस के आरोप की तीव्रता को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर की योजना और मनुष्य की जिम्मेदारी का संबंध
  choice: यीशु का सौंपा जाना परमेश्वर की ठहराई हुई योजना और पूर्वज्ञान के अनुसार था, फिर भी संबोधित लोगों से सीधे कहा गया है कि ‘तुमने’ उसे मार डाला।
  alternative: या तो परमेश्वर के निर्धारण को हल्का करना, अथवा हत्या की जिम्मेदारी केवल अधर्मी लोगों पर डाल देना।
  rationale: यूनानी पाठ दोनों कथनों को साथ रखता है और उनके बीच के धर्मवैचारिक तनाव को स्वयं हल नहीं करता; अनुवाद भी दोनों को बिना नरम किए सुरक्षित रखता है।
- issue: क्रूस पर चढ़ाने में प्रत्यक्ष और मध्यस्थ कर्तृत्व
  choice: ‘तुमने ... अधर्मी लोगों के हाथों ... जड़वाकर मार डाला’
  alternative: ‘अधर्मी लोगों ने उसे मार डाला’
  rationale: मूल पाठ में मुख्य क्रिया का कर्ता संबोधित ‘तुम’ है, जबकि अधर्मी लोग मध्यस्थ साधन हैं। हिन्दी का प्रेरणार्थक ‘जड़वाकर’ इस दोहरे कर्तृत्व को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पूर्वज्ञान’ धर्मवैचारिक सटीकता के लिए रखा गया है; ‘के हाथों’ और ‘जड़वाकर’ स्वाभाविक हिन्दी में मध्यस्थ कर्तृत्व व्यक्त करते हैं।
