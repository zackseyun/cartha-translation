  text: καὶ δώσω τέρατα ἐν τῷ οὐρανῷ ἄνω καὶ σημεῖα ἐπὶ τῆς γῆς κάτω, αἷμα καὶ πῦρ καὶ ἀτμίδα καπνοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/019.yaml
  text: 'And I will give wonders in the heaven above and signs on the earth below: blood and fire and a cloud of smoke.'
translation:
  language: hi
  text: और मैं ऊपर आकाश में अद्भुत घटनाएँ और नीचे पृथ्वी पर चिन्ह प्रकट करूँगा—लहू, आग और धुएँ का गुबार[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “धुएँ की वाष्प।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δώσω
  choice: प्रकट करूँगा
  rationale: δίδωμι का मूल अर्थ ‘देना’ है, पर इस संदर्भ में अद्भुत घटनाओं और चिन्हों को ‘प्रकट करना’ स्वाभाविक हिन्दी है और यूनानी के आशय को बिना ‘दूँगा’ जैसी असहज अभिव्यक्ति के व्यक्त करता है।
- source_word: τέρατα
  choice: अद्भुत घटनाएँ
  rationale: यह शब्द विस्मय उत्पन्न करने वाली असाधारण घटनाओं को सूचित करता है। ‘चमत्कार’ इसे अलौकिक सामर्थ्य के कार्यों तक सीमित कर सकता है, जबकि यहाँ ब्रह्मांडीय शकुन-सदृश घटनाएँ भी सम्मिलित हैं।
- source_word: ἐν τῷ οὐρανῷ ἄνω
  choice: ऊपर आकाश में
  rationale: οὐρανός यहाँ पृथ्वी के विपरीत ब्रह्मांडीय क्षेत्र को दर्शाता है। ‘आकाश’ आधुनिक हिन्दी में स्वाभाविक है और ऊपर/नीचे की समानांतर रचना बनाए रखता है।
- source_word: σημεῖα
  choice: चिन्ह
  rationale: यह अर्थपूर्ण संकेतों को दर्शाता है; ‘चिन्ह’ सामान्य बाइबलीय और आधुनिक हिन्दी में स्पष्ट समतुल्य है।
- source_word: ἐπὶ τῆς γῆς κάτω
  choice: नीचे पृथ्वी पर
  rationale: आकाश के साथ विरोध में γῆ का व्यापक अर्थ ‘पृथ्वी’ है, न कि केवल किसी स्थानीय भूमि का।
- source_word: αἷμα
  choice: लहू
  rationale: मूल की ठोस और प्रबल छवि को बनाए रखने वाला प्रतिष्ठित बाइबलीय हिन्दी शब्द।
- source_word: πῦρ
  choice: आग
  rationale: सीधा और स्वाभाविक अनुवाद, जो भविष्यसूचक चित्रण की तीव्रता बनाए रखता है।
- source_word: ἀτμίδα καπνοῦ
  choice: धुएँ का गुबार
  rationale: ἀτμίς वाष्प, भाप या धुंध-जैसे उठते समूह को सूचित करता है। ‘धुएँ का गुबार’ हिन्दी में दृश्य को स्वाभाविक ढंग से व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: योएल के उद्धरण में ब्रह्मांडीय स्थानों का अनुवाद
  choice: ऊपर आकाश में ... नीचे पृथ्वी पर
  alternative: ऊपर स्वर्ग में ... नीचे भूमि पर
  rationale: पद आकाश और पृथ्वी के बीच व्यापक, ब्रह्मांडीय विरोध प्रस्तुत करता है। ‘आकाश’ दृश्य ब्रह्मांडीय घटनाओं के संदर्भ में स्वाभाविक है, जबकि ‘पृथ्वी’ चित्रण को स्थानीय भूमि तक सीमित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। समानांतर ‘ऊपर...नीचे’ संरचना और लहू, आग तथा धुएँ की सजीव भविष्यसूचक छवियाँ सुरक्षित हैं। सूची को स्पष्ट करने के लिए दीर्घ विराम-चिह्न का प्रयोग किया गया है।
