id: ACT.2.22
reference: Acts 2:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἄνδρες Ἰσραηλῖται, ἀκούσατε τοὺς λόγους τούτους. Ἰησοῦν τὸν Ναζωραῖον, ἄνδρα ⸂ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ⸃ εἰς ὑμᾶς δυνάμεσι καὶ τέρασι καὶ σημείοις οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς ἐν μέσῳ ὑμῶν, ⸀καθὼς αὐτοὶ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/022.yaml
  text: 'Men of Israel[a], hear these words: Jesus the Nazarene, a man attested to you by God with miracles and wonders and signs that God did through him in your midst[b], just as you yourselves know—'
translation:
  language: hi
  text: '“इस्राएली पुरुषों, ये बातें सुनो: नासरी यीशु एक मनुष्य था, जिसे परमेश्वर ने सामर्थ्य के कामों, अद्भुत कामों और चिन्हों के द्वारा तुम्हारे लिए प्रमाणित किया; ये वही काम हैं जो परमेश्वर ने उसके द्वारा तुम्हारे बीच किए, जैसा कि तुम स्वयं जानते हो—”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: इस्राएली पुरुषो
  rationale: सम्बोधन में प्रयुक्त दोनों पुल्लिंग बहुवचन शब्दों को सुरक्षित रखते हुए यह आधुनिक हिन्दी में सीधा और स्पष्ट है।
- source_word: ἀκούσατε τοὺς λόγους τούτους
  choice: ये बातें सुनो
  rationale: आज्ञार्थक ध्यान-आह्वान और λόγους के बहुवचन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: नासरी यीशु
  rationale: Ναζωραῖος के पहचानसूचक रूप को हिन्दी की प्रचलित और संक्षिप्त अभिव्यक्ति में रखता है।
- source_word: ἄνδρα
  choice: एक मनुष्य
  rationale: ग्रीक में यीशु के लिए स्पष्ट रूप से आए ‘मनुष्य’ को बनाए रखता है और उसे अस्पष्ट नहीं करता।
- source_word: ἀποδεδειγμένον ἀπὸ τοῦ θεοῦ εἰς ὑμᾶς
  choice: जिसे परमेश्वर ने ... तुम्हारे सामने प्रमाणित किया
  rationale: क्रिया के सार्वजनिक प्रदर्शन/प्रमाणीकरण के भाव, परमेश्वर की कर्तृता और श्रोताओं की ओर उसके निर्देश को स्पष्ट करता है।
- source_word: δυνάμεσι καὶ τέρασι καὶ σημείοις
  choice: सामर्थ्य के कामों, अद्भुत कामों और चिन्हों
  rationale: त्रयी को अलग-अलग बनाए रखते हुए δυνάμεις में निहित शक्ति-प्रदर्शन को ‘सामर्थ्य के काम’ से व्यक्त करता है।
- source_word: οἷς ἐποίησεν δι’ αὐτοῦ ὁ θεὸς
  choice: ये काम परमेश्वर ने उसके द्वारा ... किए
  rationale: मूल के अनुसार परमेश्वर को कर्ता और यीशु को माध्यम बनाए रखता है।
- source_word: ἐν μέσῳ ὑμῶν
  choice: तुम्हारे बीच
  rationale: ग्रीक मुहावरे का सहज आधुनिक हिन्दी रूप।
- source_word: καθὼς αὐτοὶ οἴδατε
  choice: जैसा कि तुम स्वयं जानते हो
  rationale: αὐτοὶ के बलाघात को ‘स्वयं’ द्वारा सुरक्षित रखता है।
theological_decisions:
- issue: ἄνδρα की मसीह-विषयक अभिव्यक्ति
  choice: मुख्य पाठ में ‘एक मनुष्य’ बनाए रखा
  alternative: ‘एक व्यक्ति’ अथवा सर्वनाम से इसे अस्पष्ट करना
  rationale: मूल पाठ यीशु की वास्तविक मनुष्यता को स्पष्ट रूप से कहता है; अनुवाद व्यापक मसीह-विज्ञान के आधार पर इस कथन को न तो कम करता है, न बढ़ाता है।
- issue: अद्भुत कार्यों की कर्तृता और माध्यम
  choice: ‘ये काम परमेश्वर ने उसके द्वारा ... किए’
  alternative: ‘जो उसने किए’ अथवा ऐसी रचना जिसमें परमेश्वर की स्पष्ट कर्तृता मिट जाए
  rationale: ὁ θεὸς व्याकरणिक कर्ता है और δι’ αὐτοῦ यीशु को माध्यम बताता है; पद की अपनी धार्मिक तनावपूर्ण अभिव्यक्ति सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक वक्तव्य के अनुकूल है। ‘इस्राएली पुरुषो’ मूल के स्पष्ट पुल्लिंग सम्बोधन को रखता है। ‘सामर्थ्य के काम’ ने δυνάμεις को केवल सामान्य ‘चमत्कार’ में समेटने के बजाय त्रयी की विशिष्टता बचाई है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में दीर्घ डैश रखा गया है।
