- from: '“इस्राएली पुरुषो, ये बातें सुनो: नासरी यीशु एक मनुष्य था, जिसे परमेश्वर ने सामर्थ्य के कामों, अद्भुत कामों और चिन्हों के द्वारा तुम्हारे सामने प्रमाणित किया। ये काम परमेश्वर ने उसके द्वारा तुम्हारे बीच किए, जैसा कि तुम स्वयं जानते हो—”'
  to: '“इस्राएली पुरुषों, ये बातें सुनो: नासरी यीशु एक मनुष्य था, जिसे परमेश्वर ने सामर्थ्य के कामों, अद्भुत कामों और चिन्हों के द्वारा तुम्हारे लिए प्रमाणित किया; ये वही काम हैं जो परमेश्वर ने उसके द्वारा तुम्हारे बीच किए, जैसा कि तुम स्वयं जानते हो—”'
  rationale: The revision makes the direct address natural in modern standard Hindi and distinguishes more clearly between εἰς ὑμᾶς (‘तुम्हारे लिए’) and ἐν μέσῳ ὑμῶν (‘तुम्हारे बीच’). It preserves the Greek appositional assertion that Jesus was a man, the explicit divine agency, and the threefold description of the works. ‘ये वही काम हैं’ makes the relative connection to the preceding triad explicit without changing its referent.
