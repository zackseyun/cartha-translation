lexical_decisions:
- source_word: πῶς
  choice: यह कैसे हो रहा है
  rationale: यह प्रश्न आश्चर्य प्रकट करता है; वर्तमान प्रसंग में यह सहज हिन्दी है और यूनानी वर्तमान क्रिया ἀκούομεν के साथ चल रही घटना का भाव रखती है।
- source_word: ἡμεῖς ... ἕκαστος
  choice: हममें से हर एक
  rationale: ἡμεῖς की समावेशी प्रमुखता और ἕκαστος के प्रत्येक व्यक्ति पर अलग-अलग बल—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀκούομεν
  choice: सुन रहा है
  rationale: वितरणात्मक कर्ता ‘हर एक’ के अनुसार हिन्दी में एकवचन क्रिया स्वाभाविक है; वर्तमान काल उस समय के प्रत्यक्ष अनुभव को व्यक्त करता है।
- source_word: τῇ ἰδίᾳ διαλέκτῳ ἡμῶν
  choice: अपनी उस भाषा में
  rationale: ἰδίᾳ का ‘अपनी’ और διάλεκτος का व्यापक अर्थ ‘भाषा’ से व्यक्त होता है; ‘उस’ आगे आने वाले संबंधवाचक उपवाक्य से भाषा को जोड़ता है।
- source_word: ἐν ᾗ ἐγεννήθημεν
  choice: जिसमें वह जन्मा था
  rationale: मूल के स्पष्ट जन्म-संबंधी उपवाक्य को संक्षिप्त विशेषण में समेटने के बजाय बनाए रखता है। वितरणात्मक ‘हर एक’ के कारण ‘वह’ और एकवचन क्रिया हिन्दी में सहज हैं।
