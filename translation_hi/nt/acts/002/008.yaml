  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘तो फिर’ पिछले पद में व्यक्त विस्मय से प्रश्न का स्वाभाविक संबंध दिखाता है। मुख्य पाठ में मूल यूनानी के जन्म-संबंधी उपवाक्य को स्पष्ट रूप से रखा गया है और ‘भाषा/बोली’ की संभावित अस्पष्टता पाद-टिप्पणी में दी गई है।
