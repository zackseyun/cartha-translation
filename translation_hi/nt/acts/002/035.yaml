  text: until I make your enemies a footstool for your feet[a][b].
translation:
  language: hi
  text: जब तक कि मैं तुम्हारे शत्रुओं को तुम्हारे पाँवों की चौकी न बना दूँ।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “जब तक कि मैं तुम्हारे शत्रुओं को तुम्हारे पाँवों की चौकी के रूप में न रख दूँ।”'
    reason: lexical_alternative
  - marker: b
    text: यह पंक्ति भजन 110:1 को प्रतिध्वनित करती है, जो राजा के सिंहासनारोहण और मसीह से संबंधित पाठ है।
    reason: cross_reference
lexical_decisions:
- source_word: ἕως ἂν
  choice: जब तक कि … न
  rationale: यह यूनानी पदबंध भविष्य के उस बिंदु तक की अवधि बताता है जहाँ तक पहले कही गई बात लागू रहती है। हिन्दी में ‘जब तक कि … न’ इसका स्वाभाविक और सटीक रूप है।
- source_word: θῶ
  choice: बना दूँ
  rationale: τίθημι का मूल अर्थ ‘रखना/स्थापित करना’ है, पर यहाँ विधेयात्मक प्रयोग में शत्रुओं को पाँवों की चौकी ‘बना देना’ स्वाभाविक हिन्दी है और मूल रूपक को बनाए रखता है।
- source_word: τοὺς ἐχθρούς σου
  choice: तुम्हारे शत्रुओं को
  rationale: यह ἐχθρούς और संबंधवाचक σου का सीधा अनुवाद है तथा व्यक्तिगत और राजकीय विरोध—दोनों अर्थों को खुला रखता है।
- source_word: ὑποπόδιον
  choice: पाँवों की चौकी
  rationale: यह नीचे पाँव रखने की चौकी को दर्शाता है और अधीनता के ठोस राजकीय रूपक को सुरक्षित रखता है।
- source_word: τῶν ποδῶν σου
  choice: तुम्हारे पाँवों की
  rationale: संबंधकारक यूनानी वाक्यांश का निकट और हिन्दी में समझने योग्य रूप है; इसे ‘तुम्हारे पाँवों तले’ करना अर्थ को अधिक व्याख्यात्मक बना देता।
theological_decisions:
- issue: भजन 110:1 के उद्धरण में राजकीय अधीनता का रूपक
  choice: ‘तुम्हारे पाँवों की चौकी’ का ठोस चित्र बनाए रखा गया है।
  alternative: ‘तुम्हारे शत्रुओं को पूरी तरह तुम्हारे अधीन कर दूँ।’
  rationale: यह पंक्ति भजन 110:1 की राजकीय/मसीही सिंहासनारोहण भाषा को प्रतिध्वनित करती है। रूपक को व्याख्यात्मक कथन में बदलने के बजाय सुरक्षित रखने से अंतर्पाठीय और धर्मवैज्ञानिक तनाव बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘पाँवों की चौकी’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल रूपक और भजन-संबंध को सुरक्षित रखती है।
