base_translation:
  language: en
  yaml_path: translation/nt/acts/002/006.yaml
  text: And when this sound occurred[a], the crowd came together and was bewildered[b], because each one was hearing them speaking in his own dialect.
translation:
  language: hi
  text: जब यह आवाज़ हुई, तो भीड़ इकट्ठी हो गई और उलझन में पड़ गई, क्योंकि हर व्यक्ति उन्हें अपनी बोली[a] में बोलते सुन रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी भाषा’। यूनानी शब्द किसी भाषा को व्यापक रूप में भी सूचित कर सकता है, यद्यपि ‘बोली’ उसके स्थानीय या क्षेत्रीय रूप का भाव अधिक निकटता से व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης ... τῆς φωνῆς ταύτης
  choice: यह आवाज़ होने पर
  rationale: जननात्मक निरपेक्ष रचना समय की परिस्थिति बताती है। यहाँ φωνή सुनाई देने वाली घटना के लिए है; ‘आवाज़’ सहज हिन्दी है और यह तय नहीं करती कि वह वाणी थी या कोई अन्य ध्वनि।
- source_word: συνῆλθε τὸ πλῆθος
  choice: भीड़ इकट्ठी हो गई
  rationale: यह पद लोगों के एक स्थान पर जमा होने को बताता है; यह आधुनिक हिन्दी में स्वाभाविक और अर्थ के निकट है।
- source_word: συνεχύθη
  choice: उलझन में पड़ गई
  rationale: निष्क्रिय क्रिया भीड़ के भ्रमित और असमंजस में पड़ने को व्यक्त करती है। यह अनावश्यक रूप से तीव्र अर्थ जोड़े बिना प्रसंगगत भाव रखती है।
- source_word: ἤκουον
  choice: सुन रहा था
  rationale: अपूर्ण भूतकाल चल रही अनुभूति को दर्शाता है। ‘सुन रहा था’ उस निरंतरता को सुरक्षित रखता है।
- source_word: εἷς ἕκαστος
  choice: हर व्यक्ति
  rationale: यूनानी पद का वितरणात्मक बल है—भीड़ का प्रत्येक व्यक्ति स्वयं यह अनुभव कर रहा था।
- source_word: τῇ ἰδίᾳ διαλέκτῳ
  choice: अपनी-अपनी बोली
  rationale: διάλεκτος किसी भाषा या विशेषतः स्थानीय/मातृभाषिक बोली को सूचित कर सकता है। ‘अपनी-अपनी’ प्रत्येक श्रोता के लिए वितरणात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λαλούντων αὐτῶν
  choice: उन्हें ... बोलते
  rationale: सर्वनाम पहले से उल्लिखित वक्ताओं की ओर संकेत करता है। ‘उन्हें’ पाठ से अधिक संकीर्ण पहचान आरोपित नहीं करता।
theological_decisions:
- issue: प्रत्येक श्रोता की अपनी बोली में सुनने का वितरणात्मक कथन
  choice: हर व्यक्ति उन्हें अपनी-अपनी बोली में बोलते सुन रहा था
  alternative: वे सब उन्हें अपनी भाषा में बोलते सुन रहे थे
  rationale: एकवचन वितरणात्मक यूनानी रचना प्रत्येक व्यक्ति के अनुभव पर बल देती है। हिन्दी का ‘हर व्यक्ति ... अपनी-अपनी’ इस बल को रखता है और किसी विशेष लिंग को अनावश्यक रूप से आगे नहीं लाता।
- issue: διάλεκτος का अर्थ-क्षेत्र
  choice: बोली
  alternative: भाषा
  rationale: ‘बोली’ लूका के अधिक विशिष्ट शब्द-चयन को दर्शाती है, पर पादटिप्पणी यह स्वीकार करती है कि यूनानी शब्द व्यापक अर्थ में ‘भाषा’ भी हो सकता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘उलझन में पड़ गई’ सामान्य पाठक के लिए स्वाभाविक है, और ‘अपनी-अपनी बोली’ मूल की वितरणात्मक संरचना को बिना असहज लिंग-चिह्नन के व्यक्त करती है।
