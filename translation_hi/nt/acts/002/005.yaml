  yaml_path: translation/nt/acts/002/005.yaml
  text: There were Jews living in Jerusalem[b][a], devout men from every nation under heaven.
translation:
  language: hi
  text: यरूशलेम में भक्त यहूदी[a] पुरुष रहते थे, जो आकाश के नीचे[b] के हर राष्ट्र के थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया के निवासी”; यहाँ संदर्भ व्यापक जातीय-धार्मिक अर्थ “यहूदी” के पक्ष में है, क्योंकि ये लोग आकाश के नीचे के हर राष्ट्र से संबंधित बताए गए हैं।
    reason: alternative_reading
  - marker: b
    text: “आकाश के नीचे” एक बाइबलीय मुहावरा है, जिसका अर्थ है “संसार भर में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: रहते थे
  rationale: δέ एक हल्का कथात्मक संयोजक है; हिन्दी में अलग संयोजक जोड़े बिना वाक्य का स्वाभाविक प्रवाह इसका कार्य पूरा करता है। Ἦσαν का भाव मुख्य क्रिया ‘रहते थे’ में समाहित है।
- source_word: ἐν Ἰερουσαλὴμ κατοικοῦντες
  choice: यरूशलेम में ... रहते थे
  rationale: κατοικοῦντες किसी स्थान पर निवास करने का भाव देता है, न कि केवल कुछ समय ठहरने का।
- source_word: Ἰουδαῖοι
  choice: यहूदी
  rationale: ‘हर राष्ट्र’ से उनके संबंध के कारण यहाँ शब्द का व्यापक जातीय-धार्मिक अर्थ अधिक स्वाभाविक है, केवल यहूदिया प्रदेश के निवासियों का अर्थ नहीं।
- source_word: ἄνδρες εὐλαβεῖς
  choice: भक्त ... पुरुष
  rationale: ἄνδρες का पुरुषवाचक अर्थ बनाए रखा गया है और εὐλαβεῖς की परमेश्वर के प्रति श्रद्धापूर्ण भक्ति को सरल आधुनिक हिन्दी में ‘भक्त’ कहा गया है।
- source_word: ἀπὸ παντὸς ἔθνους
  choice: हर राष्ट्र से आए थे
  rationale: ἀπό यहाँ मूल स्थान या Herkunft को दर्शाता है; हिन्दी में ‘से आए थे’ इस संबंध को सहज रूप से व्यक्त करता है, बिना यह बताने के कि वे हाल ही में आए थे।
- source_word: τῶν ὑπὸ τὸν οὐρανόν
  choice: आकाश के नीचे के
  rationale: मूल बाइबलीय मुहावरे को बनाए रखा गया है; इसका आशय संसार भर के राष्ट्रों से है।
theological_decisions:
- issue: Ἰουδαῖοι का अर्थ
  choice: यहूदी
  alternative: यहूदिया निवासी
  rationale: वाक्य उन्हें ‘आकाश के नीचे के हर राष्ट्र’ से आया हुआ बताता है, इसलिए केवल क्षेत्रीय पहचान की अपेक्षा व्यापक जातीय-धार्मिक अर्थ संदर्भ के अधिक अनुकूल है।
- issue: ἄνδρες का लिंग-सटीक अनुवाद
  choice: पुरुष
  alternative: लोग
  rationale: मूल में सामान्य मनुष्यवाचक शब्द नहीं, बल्कि स्पष्ट पुरुषवाचक संज्ञा है; इसलिए उसे तटस्थ ‘लोग’ बनाकर अर्थ को व्यापक नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल की जानकारी को स्वाभाविक हिन्दी क्रम में रखा गया है और किसी अनावश्यक कालसूचक शब्द को नहीं जोड़ा गया।
