  edition: SBLGNT
  text: καὶ ἔσται πᾶς ὃς ⸀ἐὰν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/021.yaml
  text: And it shall be that everyone who calls on the name of the Lord will be saved[a].
translation:
  language: hi
  text: और ऐसा होगा कि जो कोई प्रभु का नाम पुकारेगा, वह उद्धार पाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर व्यक्ति जो प्रभु का नाम पुकारेगा।” यह वाक्य योएल 2:32 की प्रतिध्वनि है, जहाँ “प्रभु” याहवे को दर्शाता है; प्रेरितों के काम में पतरस इसे यीशु के विषय में अपनी उद्घोषणा के संदर्भ में उद्धृत करता है।
    reason: वैकल्पिक अनुवाद और पुराने नियम के उद्धरण का संदर्भ स्पष्ट करना।
lexical_decisions:
- source_word: ἔσται
  choice: ऐसा होगा
  rationale: भविष्यकालीन परिचयात्मक सूत्र को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है तथा भविष्यवाणी के शास्त्रीय स्वर को बनाए रखता है।
- source_word: πᾶς ὃς ἐὰν
  choice: हर कोई जो
  rationale: यह अनिश्चित सार्वभौमिक शर्त को व्यक्त करता है। ‘हर कोई जो’ व्यापकता को स्पष्ट रखता है और आधुनिक हिन्दी में सहज है।
- source_word: ἐπικαλέσηται
  choice: पुकारेगा
  rationale: ‘नाम’ के साथ यह क्रिया श्रद्धापूर्ण निर्भरता में आह्वान करने का भाव देती है। ‘पुकारेगा’ सामान्य पाठक के लिए स्वाभाविक है और बाइबिलीय मुहावरे को बनाए रखता है।
- source_word: τὸ ὄνομα
  choice: नाम
  rationale: ‘प्रभु का नाम पुकारना’ एक स्थापित बाइबिलीय अभिव्यक्ति है; इसे शाब्दिक रूप में रखना इसके उपासना और वाचा-संबंधी अर्थों को सुरक्षित रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος का सामान्य और गरिमापूर्ण हिन्दी अनुवाद ‘प्रभु’ है। इससे योएल के मूल संदर्भ और प्रेरितों के काम में यीशु-केंद्रित उद्घोषणा के बीच विद्यमान तनाव को बिना सुलझाए सुरक्षित रखा जाता है।
- source_word: σωθήσεται
  choice: उद्धार पाएगा
  rationale: भविष्यकालीन कर्मवाच्य को स्वाभाविक हिन्दी में व्यक्त करता है और संकट से बचाए जाने तथा व्यापक उद्धार—दोनों अर्थ-छायाओं को बनाए रखता है।
theological_decisions:
- issue: प्रेरितों के काम में प्रयुक्त योएल के उद्धरण में ‘प्रभु’ का संदर्भ
  choice: मुख्य पाठ में κύριος का अनुवाद केवल ‘प्रभु’ रखा गया है।
  alternative: योएल के मूल संदर्भ में याहवे; प्रेरितों के काम में पतरस की यीशु-केंद्रित उद्घोषणा में यीशु की ओर संकेत।
  rationale: यूनानी पाठ स्वयं ‘प्रभु’ कहता है। मुख्य पाठ में संदर्भ को किसी एक ओर सीमित न करने से मूल उद्धरण और प्रेरितों के काम के मसीह-केंद्रित संदर्भ के बीच वास्तविक धर्मवैज्ञानिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और शास्त्रीय उद्धरण के अनुरूप। ‘हर कोई जो’ सार्वभौमिकता को स्पष्ट करता है, जबकि पादटिप्पणी अधिक मुहावरेदार ‘जो कोई’ विकल्प देती है।
