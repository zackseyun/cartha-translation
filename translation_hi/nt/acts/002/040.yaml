- from: और उसने बहुत-सी दूसरी बातों से गंभीरतापूर्वक गवाही दी और उनसे लगातार आग्रह करते हुए कहा, “इस टेढ़ी पीढ़ी से बचाए जाओ।”[a]
  to: और भी बहुत-सी बातों के द्वारा उसने दृढ़तापूर्वक गवाही दी और उनसे यह कहते हुए लगातार आग्रह किया, “इस टेढ़ी पीढ़ी से बचाए जाओ।”[a]
  rationale: The revision preserves every substantive element of the source while improving Hindi syntax and making the two coordinated Greek actions explicit. It retains the passive ‘बचाए जाओ’ and the existing alternative-rendering footnote, thereby preserving the source’s grammatical voice and the interpretive ambiguity noted in the English audit trail.
