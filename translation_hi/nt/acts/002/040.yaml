  text: ἑτέροις τε λόγοις πλείοσιν διεμαρτύρατο, καὶ παρεκάλει ⸀αὐτοὺς λέγων· Σώθητε ἀπὸ τῆς γενεᾶς τῆς σκολιᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/040.yaml
  text: And with many other words he solemnly testified and kept urging them[a], saying, “Be saved from this crooked generation.”
translation:
  language: hi
  text: और भी बहुत-सी बातों के द्वारा उसने दृढ़तापूर्वक गवाही दी और उनसे यह कहते हुए लगातार आग्रह किया, “इस टेढ़ी पीढ़ी से बचाए जाओ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने आप को इस टेढ़ी पीढ़ी से बचाओ।” यूनानी क्रिया कर्मवाच्य है (“बचाए जाओ”), पर प्रसंग में श्रोताओं से अपेक्षित प्रत्युत्तर को उभारने के लिए कुछ अनुवाद इसे अधिक कर्तृवाच्य रूप में प्रस्तुत करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἑτέροις τε λόγοις πλείοσιν
  choice: बहुत-सी दूसरी बातों से
  rationale: यह दत्तिवाचक पद पतरस के आगे के कथन के साधन अथवा ढंग को व्यक्त करता है। ‘बहुत-सी दूसरी बातों से’ ἑτέροις और πλείοσιν दोनों का स्वाभाविक हिन्दी रूप है।
- source_word: διεμαρτύρατο
  choice: गंभीरतापूर्वक गवाही दी
  rationale: διαμαρτύρομαι में प्रबल और गंभीर साक्ष्य देने का भाव है; यह अनुवाद उसे केवल ‘चेतावनी दी’ तक सीमित नहीं करता।
- source_word: παρεκάλει
  choice: लगातार आग्रह करते हुए
  rationale: अपूर्ण काल जारी अथवा बार-बार की गई क्रिया दर्शाता है। यह रूप उस निरंतर आग्रह और प्रोत्साहन को सहज हिन्दी में व्यक्त करता है।
- source_word: αὐτοὺς
  choice: उनसे
  rationale: यह पतरस के श्रोताओं को सूचित करता है। हिन्दी में ‘आग्रह करना’ के साथ ‘से’ स्वाभाविक कारक है।
- source_word: Σώθητε
  choice: बचाए जाओ
  rationale: यह σῴζω का अओरिस्ट कर्मवाच्य आज्ञार्थक रूप है। ‘बचाए जाओ’ कर्मवाच्य और श्रोताओं को दिए गए वास्तविक आह्वान—दोनों को बनाए रखता है।
- source_word: ἀπὸ
  choice: से
  rationale: यह पृथक्करण का मानक अर्थ व्यक्त करता है।
- source_word: γενεᾶς
  choice: पीढ़ी
  rationale: γενεά समकालीन पीढ़ी अथवा लोगों के समूह को सूचित कर सकता है। ‘पीढ़ी’ मूल रूपक और बाइबलीय प्रयोग को सुरक्षित रखती है।
- source_word: σκολιᾶς
  choice: टेढ़ी
  rationale: σκολιός के प्रत्यक्ष नैतिक रूपक को सहज आधुनिक हिन्दी में बनाए रखता है; ‘भ्रष्ट’ संभव है, पर मूल की टेढ़ेपन वाली छवि को खो देता है।
theological_decisions:
- issue: Σώθητε में वाच्य और कर्तृत्व
  choice: बचाए जाओ
  alternative: अपने आप को बचाओ
  rationale: यूनानी क्रिया कर्मवाच्य आज्ञार्थक है। चुना हुआ रूप उद्धार को स्वायत्त मानवीय आत्म-उद्धार के रूप में प्रस्तुत किए बिना कर्मवाच्य को सुरक्षित रखता है, जबकि आज्ञार्थकता श्रोताओं से वास्तविक प्रत्युत्तर की माँग भी व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। ‘गंभीरतापूर्वक गवाही दी’ औपचारिक साक्ष्य के भाव को और ‘लगातार आग्रह’ अपूर्ण काल की निरंतरता को व्यक्त करता है।
