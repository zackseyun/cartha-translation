source:
  edition: SBLGNT
  text: προφήτης οὖν ὑπάρχων, καὶ εἰδὼς ὅτι ὅρκῳ ὤμοσεν αὐτῷ ὁ θεὸς ἐκ καρποῦ τῆς ὀσφύος ⸀αὐτοῦ καθίσαι ἐπὶ ⸂τὸν θρόνον⸃ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/030.yaml
  text: Therefore[a], being a prophet and knowing that God had sworn to him with an oath to seat one from the fruit of his loins on his throne,
translation:
  language: hi
  text: इसलिए, दाऊद भविष्यद्वक्ता होने के नाते जानता था कि परमेश्वर ने उससे शपथ खाई थी कि वह दाऊद के शारीरिक वंश में से एक को दाऊद के सिंहासन पर बैठाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προφήτης
  choice: भविष्यद्वक्ता
  rationale: ईश्वरीय प्रकाशन के आधार पर बोलने वाले व्यक्ति के लिए मानक और प्रसंगानुकूल हिन्दी शब्द।
- source_word: οὖν
  choice: इसलिए
  rationale: पिछले कथन से निकलने वाले निष्कर्ष और तर्क-संबंध को स्पष्ट करता है।
- source_word: ὑπάρχων
  choice: होने के कारण
  rationale: कृदन्त की परिस्थितिजन्य तथा संभावित कारणवाचक शक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: εἰδὼς
  choice: यह जानता था
  rationale: ग्रीक कृदन्त को स्वाभाविक हिन्दी उपवाक्य में व्यक्त करता है और दाऊद के ज्ञान को मुख्य कथन से जोड़ता है।
- source_word: ὅρκῳ ὤμοσεν αὐτῷ ὁ θεός
  choice: परमेश्वर ने उससे शपथ खाकर कहा था
  rationale: संज्ञा और क्रिया से व्यक्त शपथ की गंभीरता को सुरक्षित रखते हुए हिन्दी में पूर्ण प्रतिज्ञा का स्वाभाविक बोध देता है।
- source_word: ἐκ καρποῦ τῆς ὀσφύος αὐτοῦ
  choice: उसके वंशजों में से एक को
  rationale: शारीरिक वंश की यूनानी मुहावरेदार अभिव्यक्ति का स्पष्ट आधुनिक हिन्दी अर्थ; शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: καθίσαι
  choice: बैठाएगा
  rationale: परमेश्वर को कर्ता मानते हुए क्रिया की कारकवाचक शक्ति—किसी को सिंहासन पर प्रतिष्ठित करना—सुरक्षित रखता है।
- source_word: ἐπὶ τὸν θρόνον αὐτοῦ
  choice: उसके सिंहासन पर
  rationale: राज्यारोहण की भाषा को स्वाभाविक रूप में रखता है; अंतिम सर्वनाम का निकटतम प्रसंगगत संकेत दाऊद की ओर है।
theological_decisions:
- issue: दाऊद से की गई मसीही राजकीय प्रतिज्ञा
  choice: वंशज और सिंहासन की प्रतिज्ञात्मक भाषा को ज्यों का त्यों रखा गया है; पद में सीधे ‘मसीह’ नहीं जोड़ा गया।
  alternative: ‘मसीह को उसके सिंहासन पर बैठाएगा’ कहना।
  rationale: आसपास का प्रसंग इस प्रतिज्ञा को यीशु पर लागू करता है, पर इस पद का वाक्य स्वयं दाऊद के वंशज और उसके सिंहासन की भाषा में है। अनुवाद संदर्भ को यह संबंध प्रकट करने देता है।
- issue: αὐτοῦ (‘उसके’) का संदर्भ
  choice: सिंहासन को दाऊद का सिंहासन समझा गया।
  alternative: सिंहासन को आने वाले वंशज का सिंहासन समझना।
  rationale: दाऊदी वाचा और वंशगत राजसत्ता के प्रसंग में दाऊद का सिंहासन सबसे स्वाभाविक संदर्भ है, यद्यपि ग्रीक सर्वनाम स्वयं नाम को दोहराता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। पद पूर्ववर्ती वाक्य से व्याकरणिक रूप से जुड़ा है; हिन्दी में स्पष्टता के लिए ‘दाऊद’ कर्ता को दोहराया गया है।
