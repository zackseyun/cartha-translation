  text: ⸀Ἐγίνετο δὲ πάσῃ ψυχῇ φόβος, πολλά ⸀τε τέρατα καὶ σημεῖα διὰ τῶν ἀποστόλων ἐγίνετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/043.yaml
  text: And fear came upon every soul[a], and many wonders and signs were being done through the apostles.
translation:
  language: hi
  text: और हर व्यक्ति पर भय छाने लगा[a], और प्रेरितों के द्वारा बहुत-से आश्चर्य और चिन्ह होते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर किसी पर विस्मय छाने लगा।” यूनानी में शाब्दिक रूप से “हर प्राण पर भय छाने लगा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγίνετο ... φόβος
  choice: भय छाने लगा
  rationale: अपूर्ण भूतकाल Ἐγίνετο के उदय और जारी रहने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; यह केवल स्थिर अवस्था बताने वाले ‘भय था’ से अधिक उपयुक्त है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाता है, प्रबल विरोध नहीं दर्शाता; इसलिए ‘और’ सहज प्रवाह बनाए रखता है।
- source_word: πάσῃ ψυχῇ
  choice: हर व्यक्ति पर
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘हर प्राण पर’ है, पर आधुनिक हिन्दी में ‘हर व्यक्ति पर’ उसका स्वाभाविक और स्पष्ट अर्थ देता है। शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: φόβος
  choice: भय
  rationale: φόβος में डर और विस्मययुक्त श्रद्धा दोनों की छाया हो सकती है। ‘भय’ उसका सीधा समतुल्य है और अर्थ के तनाव को किसी एक दिशा में सीमित नहीं करता।
- source_word: πολλά
  choice: बहुत-से
  rationale: यह बहुसंख्या का सहज आधुनिक हिन्दी रूप है और दोनों संज्ञाओं—आश्चर्यकर्म और चिन्ह—से जुड़ता है।
- source_word: τέρατα
  choice: आश्चर्यकर्म
  rationale: यह शब्द उन कार्यों के विस्मय उत्पन्न करने वाले स्वरूप पर बल देता है और इसे σημεῖα से अलग रखता है।
- source_word: σημεῖα
  choice: चिन्ह
  rationale: ‘चिन्ह’ कार्यों के संकेत देने अथवा किसी सत्य की ओर इंगित करने वाले पक्ष को बनाए रखता है।
- source_word: διὰ τῶν ἀποστόλων
  choice: प्रेरितों के द्वारा
  rationale: सम्बन्धकारक के साथ διά माध्यम अथवा अभिकरण बताता है। यह रूप प्रेरितों को माध्यम बताता है और परमेश्वर को निहित अंतिम कर्ता रहने देता है।
- source_word: ἐγίνετο
  choice: होते रहे
  rationale: दूसरा अपूर्ण भूतकाल आश्चर्यकर्मों और चिन्हों के लगातार घटित होने को दर्शाता है। ‘होते रहे’ इस पुनरावृत्त अथवा जारी क्रिया को स्पष्ट करता है।
theological_decisions:
- issue: प्रेरितों के द्वारा हुए चिन्हों के प्रत्युत्तर में φόβος का भाव
  choice: भय
  alternative: विस्मय; श्रद्धामिश्रित भय
  rationale: मूल शब्द वास्तविक भय और ईश्वरीय कार्य के सामने उत्पन्न विस्मय, दोनों को समेट सकता है। ‘भय’ मूल की तीव्रता और धर्मवैचारिक तनाव को बनाए रखता है; पादटिप्पणी वैकल्पिक भाव बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘हर व्यक्ति’ शाब्दिक ‘हर प्राण’ की अपेक्षा अधिक स्वाभाविक है, जबकि पादटिप्पणी मूल अभिव्यक्ति को सुरक्षित रखती है। ‘आश्चर्यकर्म और चिन्ह’ युग्म दोनों यूनानी शब्दों के अलग-अलग बल को बनाए रखता है।
