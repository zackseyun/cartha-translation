theological_decisions:
- issue: ‘सब प्राणियों’ का दायरा और σάρξ की भविष्यवाणी-संबंधी छवि
  choice: मुख्य पाठ में ‘सब प्राणियों पर’ और पादटिप्पणी में शाब्दिक ‘हर देह पर’
  alternative: सब मनुष्यों पर; सारी मानवजाति पर; हर देह पर
  rationale: यह परमेश्वर के आत्मा के व्यापक उंडेले जाने और आगे गिनाए गए मानवीय वर्गों को स्पष्ट करता है, पर मूल भविष्यवाणी की ‘देह’ वाली छवि को पादटिप्पणी में बनाए रखता है।
- issue: πνεῦμα का दैवी संदर्भ
  choice: आत्मा
  alternative: आत्मा/जीवन-श्वास को सामान्य संज्ञा के रूप में समझना
  rationale: वक्ता परमेश्वर है और ‘मेरे आत्मा’ की बात करता है; संदर्भ इसे परमेश्वर के आत्मा के रूप में पहचानता है, बिना पद में इससे अधिक व्यवस्थित धर्मशास्त्रीय विवरण जोड़े।
- issue: ἀπὸ τοῦ πνεύματός μου में स्रोत अथवा अंश का भाव
  choice: अपने आत्मा में से
  alternative: अपना आत्मा; अपने आत्मा को
  rationale: यूनानी ἀπό को लुप्त नहीं किया गया है। साथ ही अनुवाद ‘आत्मा का एक अंश’ नहीं जोड़ता, इसलिए दैवी आत्मा के विभाजन का निष्कर्ष आरोपित नहीं होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। उद्धरण-रचना परमेश्वर के कथन को स्पष्ट करती है। ‘बेटे…बेटियाँ’, ‘जवान…बूढ़े’ की समानांतर लय और व्यापक भागीदारी पर मूल पाठ का बल सुरक्षित है।
