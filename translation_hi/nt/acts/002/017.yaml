  text: Καὶ ἔσται ἐν ταῖς ἐσχάταις ἡμέραις, λέγει ὁ θεός, ἐκχεῶ ἀπὸ τοῦ πνεύματός μου ἐπὶ πᾶσαν σάρκα, καὶ προφητεύσουσιν οἱ υἱοὶ ὑμῶν καὶ αἱ θυγατέρες ὑμῶν, καὶ οἱ νεανίσκοι ὑμῶν ὁράσεις ὄψονται, καὶ οἱ πρεσβύτεροι ὑμῶν ⸀ἐνυπνίοις ἐνυπνιασθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/017.yaml
  text: And it will be in the last days[a], says God, that I will pour out from my Spirit on all flesh, and your sons and your daughters will prophesy, and your young men will see visions[b], and your old men will dream dreams.
translation:
  language: hi
  text: ‘अन्तिम दिनों में ऐसा होगा,’ परमेश्वर कहता है, ‘कि मैं अपने आत्मा में से[a] सब लोगों पर[b] उंडेलूँगा। तुम्हारे बेटे और तुम्हारी बेटियाँ भविष्यवाणी करेंगे, तुम्हारे जवान दर्शन देखेंगे, और तुम्हारे बूढ़े स्वप्न देखेंगे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘अपने आत्मा में से’ है; इसका अर्थ यह आवश्यक नहीं कि आत्मा को भागों में बाँटा गया है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक अभिव्यक्ति ‘हर देह पर’ है, जो यहाँ सभी लोगों के लिए प्रयुक्त भविष्यवाणी-संबंधी मुहावरा है।
    reason: lexical_alternative
