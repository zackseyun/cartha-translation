base_translation:
  language: en
  yaml_path: translation/nt/acts/002/003.yaml
  text: And tongues like fire appeared to them, being divided, and it came to rest on each one of them[a].
translation:
  language: hi
  text: और उन्हें आग जैसी जीभें दिखाई दीं, जो बँट रही थीं; और वह उनमें से हर एक पर आ ठहरी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे ‘बँटी हुई, मानो आग की जीभें’ भी समझा जा सकता है। यूनानी वाक्य दृश्य रूप और उनके बीच उसके अलग-अलग बँटने—दोनों पर बल देता है। अंतिम क्रिया यूनानी में एकवचन है: ‘वह ... ठहरी।’'
    reason: शब्दार्थ और व्याकरण की वास्तविक अस्पष्टता
lexical_decisions:
- source_word: ὤφθησαν
  choice: दिखाई दीं
  rationale: यहाँ क्रिया का भाव किसी दृश्य वस्तु के उनके सामने प्रकट होने का है। ‘दिखाई दीं’ स्वाभाविक हिन्दी में दृश्य प्रकटता को व्यक्त करता है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: सम्प्रदान कारक उन लोगों को सूचित करता है जिनके सामने यह दृश्य प्रकट हुआ।
- source_word: διαμεριζόμεναι
  choice: जो बँट रही थीं
  rationale: वर्तमानकालिक मध्य/कर्मवाच्य कृदन्त ‘जीभें’ का वर्णन करता है। यह अनुवाद बँटने या अलग-अलग वितरित होने की प्रक्रिया को खुला रखता है।
- source_word: γλῶσσαι
  choice: जीभें
  rationale: मूल शब्द का अर्थ ‘जीभें’ भी है और आगे आने वाली भाषा/वाणी की घटना से इसका शब्दगत संबंध है। ‘लपटें’ कहने से यह संबंध मिट जाता।
- source_word: ὡσεὶ πυρός
  choice: आग जैसी
  rationale: ὡσεὶ तुलना व्यक्त करता है, पहचान नहीं; इसलिए पाठ यह नहीं कहता कि वे सचमुच आग थीं।
- source_word: ἐκάθισεν
  choice: वह ... आ ठहरी
  rationale: यूनानी क्रिया एकवचन है। स्त्रीलिंग एकवचन ‘वह ... आ ठहरी’ उस वितरित दृश्य-प्रकटन या प्रत्येक जीभ के एक व्यक्ति पर ठहरने की संभावना को बनाए रखता है, भले ही पहले ‘जीभें’ बहुवचन है।
- source_word: ἐφ’ ἕνα ἕκαστον αὐτῶν
  choice: उनमें से हर एक पर
  rationale: यह वाक्यांश उपस्थित प्रत्येक व्यक्ति पर अलग-अलग वितरण का बल बनाए रखता है।
theological_decisions:
- issue: पिन्तेकुस्त के दृश्य प्रकटन का स्वरूप
  choice: ‘आग जैसी जीभें’
  alternative: ‘आग की लपटें’ या ‘आग जैसी भाषाएँ’
  rationale: मूल में ‘जीभें’ और तुलना-सूचक ‘जैसी’ दोनों हैं। इससे दृश्य आकृति और आगे की वाणी/भाषा—दोनों से संबंध बना रहता है, बिना इसे वास्तविक आग या केवल भाषाओं के रूप में निश्चित किए।
- issue: बहुवचन ‘जीभें’ के बाद एकवचन क्रिया
  choice: ‘वह ... आ ठहरी’ द्वारा एकवचन को बनाए रखा
  alternative: ‘वे ... आ ठहरीं’ कहकर अर्थानुसार बहुवचन करना
  rationale: मूल पाठ में अंतिम क्रिया एकवचन है। हिन्दी में कुछ असामान्यता रहने देना मूल की व्याकरणिक तनावशीलता को सुरक्षित रखता है और सामूहिक प्रकटन अथवा प्रत्येक अलग जीभ—दोनों संभावनाओं को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘जीभें’ की बाइबिलीय छवि को बनाए रखते हुए ‘आग जैसी’ ने तुलना स्पष्ट रखी है। अर्धविराम अंतिम एकवचन खंड की असामान्य संरचना को पढ़ने में सहायता देता है।
