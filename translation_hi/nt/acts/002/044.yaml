lexical_decisions:
- source_word: πάντες
  choice: सभी
  rationale: यह शब्द विश्वास करने वालों के पूरे समूह को समावेशी रूप से सूचित करता है और यूनानी संरचना की व्यापकता बनाए रखता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाता है; स्पष्ट विरोध न होने के कारण ‘लेकिन’ की अपेक्षा ‘और’ अधिक स्वाभाविक है।
- source_word: οἱ πιστεύοντες
  choice: विश्वासी
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त विश्वास करने वाले समुदाय को दर्शाता है; ‘विश्वासी’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἦσαν ἐπὶ τὸ αὐτό
  choice: एक साथ रहते थे
  rationale: यह मुहावरा साथ होने या एक स्थान पर इकट्ठा होने का भाव दे सकता है। ‘एक साथ रहते थे’ सामुदायिक निरंतरता को सहज हिन्दी में व्यक्त करता है, जबकि स्थानगत अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: εἶχον
  choice: रखते थे
  rationale: अपूर्ण भूतकाल की जारी या प्रचलित स्थिति को हिन्दी का ‘रखते थे’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἅπαντα κοινά
  choice: सब कुछ साझा
  rationale: यह उनकी वस्तुओं और संसाधनों के साझे उपयोग या अधिकार को स्पष्ट, वर्तमान हिन्दी में व्यक्त करता है, बिना उसके व्यावहारिक स्वरूप को आवश्यकता से अधिक निर्धारित किए।
theological_decisions:
- issue: समुदाय के साझा जीवन का स्वरूप
  choice: पद को विश्वासियों के साझा जीवन के वर्णन के रूप में प्रस्तुत किया गया है।
  alternative: इसे सभी मसीही समुदायों के लिए किसी निश्चित आर्थिक व्यवस्था की सार्वभौमिक आज्ञा मानना।
  rationale: यूनानी पाठ बताता है कि विश्वासी क्या कर रहे थे; वह यहाँ कोई स्पष्ट सार्वभौमिक आदेश नहीं देता। इसलिए अनुवाद वर्णनात्मक रहता है और पाठ से परे कोई राजनीतिक या सम्प्रदायगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामुदायिक भाव वाला अनुवाद। ‘साझा रखते थे’ स्वामित्व और उपयोग की सीमा को अत्यधिक निश्चित किए बिना κοινά का भाव बनाए रखता है।
