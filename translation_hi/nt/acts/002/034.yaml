id: ACT.2.34
reference: Acts 2:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς, λέγει δὲ αὐτός· Εἶπεν ⸀ὁ κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/034.yaml
  text: For David did not ascend into the heavens[a], but he himself says, ‘The Lord said to my Lord, “Sit at my right hand,”’
translation:
  language: hi
  text: क्योंकि दाऊद स्वर्गों में नहीं चढ़ा[a], बल्कि वह स्वयं कहता है, “प्रभु ने मेरे प्रभु से कहा, ‘मेरे दाहिने बैठ,’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'भजन 110:1। इब्रानी पाठ में पहला ‘प्रभु’ परमेश्वर के दिव्य नाम YHWH को दर्शाता है; तुलना करें: ‘यहोवा ने मेरे प्रभु से कहा।’'
    reason: इब्रानी मूल में निहित दिव्य नाम और यूनानी उद्धरण की शब्दावली के बीच अंतर स्पष्ट करना।
lexical_decisions:
- source_word: ἀνέβη
  choice: नहीं चढ़ा
  rationale: यहाँ ἀναβαίνω का अर्थ स्वर्गों में ऊपर चढ़ना है। ‘चढ़ा’ स्वाभाविक हिन्दी में गति और प्रसंग का अर्थ बनाए रखता है।
- source_word: τοὺς οὐρανούς
  choice: स्वर्गों में
  rationale: यूनानी में बहुवचन है; ‘स्वर्गों’ स्रोत की संख्या और शास्त्रीय प्रतिध्वनि दोनों को सुरक्षित रखता है।
- source_word: λέγει δὲ αὐτός
  choice: बल्कि वह स्वयं कहता है
  rationale: δέ पिछले कथन से हल्का विरोध दिखाता है और αὐτός का बल ‘स्वयं’ से व्यक्त होता है। वर्तमान काल ‘कहता है’ उद्धृत शास्त्र को वर्तमान साक्ष्य की तरह प्रस्तुत करता है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: यूनानी पाठ में κύριος है, इसलिए मुख्य पाठ में ‘प्रभु’ रखा गया है; भजन 110:1 के इब्रानी पाठ में निहित YHWH की पृष्ठभूमि पादटिप्पणी में दी गई है।
- source_word: τῷ κυρίῳ μου
  choice: मेरे प्रभु से
  rationale: ‘प्रभु’ κύριος का सुसंगत और गरिमापूर्ण अनुवाद है। हिन्दी में ‘कहा’ के साथ ‘से’ स्वाभाविक है।
- source_word: Κάθου
  choice: बैठ
  rationale: प्रत्यक्ष आज्ञा का संक्षिप्त और स्वाभाविक रूप; अभिषिक्त व्यक्ति को संबोधित एकवचन अर्थ सुरक्षित है।
- source_word: ἐκ δεξιῶν μου
  choice: मेरे दाहिने
  rationale: यह सम्मान और अधिकार के स्थान का स्थापित मुहावरा है। ‘मेरे दाहिने’ हिन्दी में स्वाभाविक है और अनावश्यक रूप से ‘हाथ’ जोड़ने से बचता है।
theological_decisions:
- issue: भजन 110:1 के उद्धरण में κύριος के दोनों प्रयोग
  choice: 'मुख्य पाठ में दोनों के लिए ‘प्रभु’: ‘प्रभु ने मेरे प्रभु से कहा।’'
  alternative: पहले प्रयोग को ‘यहोवा’ या विशिष्ट रूप से ‘याहवे’ लिखना
  rationale: सामने उपलब्ध यूनानी स्रोत दोनों स्थानों पर κύριος रखता है। इसलिए मुख्य पाठ उस समानता को बनाए रखता है, जबकि पहले पद के पीछे इब्रानी दिव्य नाम YHWH होने की महत्त्वपूर्ण जानकारी पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सरल शास्त्रीय शैली। यूनानी बहुवचन ‘स्वर्गों’ और αὐτός के बलसूचक अर्थ ‘स्वयं’ को बनाए रखा गया है। उद्धरण-चिह्नों के स्तर स्पष्ट रखे गए हैं।
