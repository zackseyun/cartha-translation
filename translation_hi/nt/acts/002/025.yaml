source:
  edition: SBLGNT
  text: Δαυὶδ γὰρ λέγει εἰς αὐτόν· Προορώμην τὸν κύριον ἐνώπιόν μου διὰ παντός, ὅτι ἐκ δεξιῶν μού ἐστιν ἵνα μὴ σαλευθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/025.yaml
  text: For David says concerning him, ‘I kept seeing the Lord before me continually, because he is at my right hand, so that I may not be shaken.’
translation:
  language: hi
  text: क्योंकि दाऊद उसके विषय में कहता है, “मैं प्रभु[b] को निरन्तर अपने सामने देखता रहा[a], क्योंकि वह मेरी दाहिनी ओर है, ताकि मैं डगमगा न जाऊँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने प्रभु को सदा अपने सामने पहले से देखा था।” यूनानी क्रिया कुछ प्रसंगों में ‘पहले से देखना’ का अर्थ दे सकती है, पर यहाँ आसपास के शब्द प्रभु को लगातार अपने सामने देखने या रखने के भाव का समर्थन करते हैं।
    reason: lexical_alternative
  - marker: b
    text: पतरस यहाँ भजन 16:8 उद्धृत कर रहा है। भजन के इब्रानी पाठ में इस स्थान पर परमेश्वर का वह विशिष्ट नाम है जिसे कई हिन्दी अनुवाद ‘यहोवा’ या ‘याहवे’ लिखते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: λέγει εἰς αὐτόν
  choice: उसके विषय में कहता है
  rationale: यहाँ εἰς αὐτόν प्रत्यक्ष संबोधन नहीं, बल्कि किसी के विषय में कहने का भाव देता है; प्रसंग में दाऊद के कथन को मसीह से संबंधित बताया गया है।
- source_word: Προορώμην
  choice: मैं ... देखता रहा
  rationale: अपूर्ण भूतकाल निरन्तर क्रिया का भाव देता है। διὰ παντός के साथ यह भविष्य को पहले से देखने की अपेक्षा प्रभु को लगातार अपने सामने देखने या रखने का भाव व्यक्त करता है।
- source_word: κύριον
  choice: प्रभु
  rationale: κύριος का स्वाभाविक और धर्मवैचारिक रूप से खुला हिन्दी रूप ‘प्रभु’ है; उद्धरण में इसके संदर्भित व्यक्ति को अनुवाद द्वारा अधिक स्पष्ट नहीं किया गया।
- source_word: ἐνώπιόν μου διὰ παντός
  choice: निरन्तर अपने सामने
  rationale: यह स्थान-संबंधी बिंब और निरन्तरता—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐκ δεξιῶν μού
  choice: मेरे दाहिने हाथ की ओर
  rationale: यह दाहिनी ओर उपस्थित होने के यूनानी मुहावरे को स्पष्ट हिन्दी में व्यक्त करता है और सहारे तथा संरक्षण के निहित बिंब को अनावश्यक रूप से नहीं खोलता।
- source_word: ἵνα μὴ σαλευθῶ
  choice: ताकि मैं डगमगा न जाऊँ
  rationale: ἵνα के उद्देश्य/परिणाम के भाव और σαλεύω के स्थिरता से हिल जाने के रूपक को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: भजन के उद्धरण में ‘प्रभु’ का संदर्भ
  choice: अनुवाद में केवल ‘प्रभु’ रखा गया
  alternative: ‘यहोवा’ या ‘मसीह’
  rationale: प्रेरितों के काम में पतरस इस भजन को मसीह से जोड़ता है, जबकि उद्धृत यूनानी पाठ κύριον कहता है। ‘प्रभु’ मूल शब्दावली और उसके धर्मवैचारिक तनाव को सुरक्षित रखता है; ‘यहोवा’ इब्रानी पृष्ठभूमि को और ‘मसीह’ पतरस की व्याख्यात्मक पहचान को सीधे मुख्य पाठ में ले आते।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘देखता रहा’ से यूनानी अपूर्ण भूतकाल की निरन्तरता रखी गई है; ‘डगमगा न जाऊँ’ मूल रूपक को स्वाभाविक हिन्दी में व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
