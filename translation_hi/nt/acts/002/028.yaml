  yaml_path: translation/nt/acts/002/028.yaml
  text: You made known to me the paths of life[b][a]; you will fill me with gladness with your presence.
translation:
  language: hi
  text: तूने मुझे जीवन के मार्ग बताए; तू अपने सान्निध्य में मुझे आनन्द से भर देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώρισάς μοι
  choice: तूने मुझे … बताए
  rationale: अओरिस्ट क्रिया और संप्रदानवाचक सर्वनाम का स्वाभाविक हिन्दी रूप; यह ‘ज्ञात कराया’ की अपेक्षा अधिक सहज है और causative अर्थ बनाए रखता है।
- source_word: ὁδοὺς ζωῆς
  choice: जीवन के मार्ग
  rationale: बहुवचन ὁδούς को ‘मार्ग’ और ζωῆς को संबंधकारक ‘जीवन के’ से व्यक्त किया गया है। यह जीवन की ओर ले जाने वाले अथवा जीवन से चिह्नित मार्गों की मूल अस्पष्टता को खुला रखता है।
- source_word: πληρώσεις με εὐφροσύνης
  choice: मुझे आनन्द से भर देगा
  rationale: भविष्यकाल और ‘भरना’ की विषय-वस्तु को सीधे व्यक्त करता है। εὐφροσύνη के हर्षपूर्ण भाव के लिए सामान्य, गरिमापूर्ण ‘आनन्द’ चुना गया है।
- source_word: μετὰ τοῦ προσώπου σου
  choice: अपने सान्निध्य में
  rationale: शाब्दिक रूप ‘तेरे मुख के साथ’ है, पर यहाँ ‘मुख’ व्यक्तिगत उपस्थिति का मुहावरा है। ‘सान्निध्य में’ अर्थ को स्वाभाविक और संबंधपरक हिन्दी में संप्रेषित करता है।
theological_decisions:
- issue: परमेश्वर की उपस्थिति के मुहावरे का अनुवाद
  choice: अपने सान्निध्य में
  alternative: अपने मुख के सामने / अपने मुख के साथ
  rationale: यह रूप परमेश्वर की निकट व्यक्तिगत उपस्थिति में मिलने वाले आनन्द को स्पष्ट रखता है, जबकि शाब्दिक ‘मुख के साथ’ हिन्दी में अस्वाभाविक और भ्रमकारी होगा। इससे किसी विशेष सिद्धान्तगत व्याख्या को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक उद्धरण के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट भाषा। परमेश्वर को संबोधन में निकट एकवचन ‘तू’ रखा गया है।
