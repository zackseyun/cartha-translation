source:
  edition: SBLGNT
  text: Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν ⸂πάντες ὁμοῦ⸃ ἐπὶ τὸ αὐτό,
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/001.yaml
  text: And when the day of Pentecost had fully come[a], they were all together in one place.
translation:
  language: hi
  text: जब पिन्तेकुस्त का दिन पूरा हो रहा था[a], तब वे सब एक साथ एक ही स्थान पर थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब पिन्तेकुस्त का दिन पूरी तरह आ पहुँचा था।”
    reason: स्रोत अभिव्यक्ति को पूर्ण होने की प्रक्रिया या पूर्णतः आ पहुँचने के परिणाम पर बल देते हुए समझा जा सकता है।
lexical_decisions:
- source_word: συμπληροῦσθαι
  choice: पूरा हो रहा था
  rationale: ἐν τῷ के साथ वर्तमानकालिक कर्मवाच्य infinitive समय-सूचक रचना बनाता है और किसी अवधि के पूर्ण होने की प्रक्रिया व्यक्त करता है। यह अनुवाद उस प्रक्रियात्मक भाव को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: πεντηκοστῆς
  choice: पिन्तेकुस्त
  rationale: यह फसह के बाद पचासवें दिन मनाए जाने वाले यहूदी पर्व का नए नियम में प्रचलित यूनानी नाम है। हिन्दी बाइबल परंपरा में ‘पिन्तेकुस्त’ परिचित और सटीक रूप है।
- source_word: πάντες
  choice: सब
  rationale: यह पिछले प्रसंग में उल्लिखित पूरे समूह को सूचित करता है; ‘सब’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: ὁμοῦ
  choice: एक साथ
  rationale: यह समूह के साथ होने या संगति में उपस्थित होने का भाव व्यक्त करता है।
- source_word: ἐπὶ τὸ αὐτό
  choice: एक ही स्थान पर
  rationale: इस मुहावरे का स्थानवाचक भाव यहाँ उपयुक्त है। इससे ὁμοῦ के ‘एक साथ’ भाव की अनावश्यक पुनरावृत्ति किए बिना दोनों अभिव्यक्तियों का अर्थ सुरक्षित रहता है।
theological_decisions:
- issue: ἦσαν में निहित कर्ता की पहचान
  choice: वे सब एक साथ एक ही स्थान पर थे
  alternative: सब एक साथ एक ही स्थान पर थे
  rationale: यूनानी पाठ कर्ता को दोबारा स्पष्ट नहीं करता; वह पिछले प्रसंग से समझा जाता है। स्वाभाविक हिन्दी के लिए ‘वे’ जोड़ना केवल कथात्मक निरंतरता स्पष्ट करता है, कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पिन्तेकुस्त’ परिचित बाइबलीय नाम के रूप में रखा गया है। ‘एक साथ एक ही स्थान पर’ यूनानी की दो निकटार्थक अभिव्यक्तियों में संगति और स्थान—दोनों पहलुओं को सुरक्षित रखता है।
