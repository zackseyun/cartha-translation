lexical_decisions:
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह संयोजक पिछले संदर्भ में भीड़ की गलत समझ का सुधार करता है; ‘बल्कि’ इस विरोधात्मक-सुधारात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῦτό
  choice: यह
  rationale: नपुंसकलिंग संकेतवाचक सर्वनाम सामने घट रही घटना की ओर संकेत करता है; ‘यह’ सहज और पर्याप्त रूप से स्पष्ट है।
- source_word: ἐστιν
  choice: है
  rationale: साधारण योजक क्रिया को सीधे रखा गया है; ‘अर्थ है’ जैसे अधिक व्याख्यात्मक अनुवाद से बचा गया है।
- source_word: τὸ εἰρημένον
  choice: वही ... जो ... कहा गया था
  rationale: लेख सहित पूर्ण निष्क्रिय कृदन्त संज्ञात्मक रूप में प्रयुक्त है। यह हिन्दी अभिव्यक्ति निष्क्रिय भाव को बनाए रखते हुए स्वाभाविक है; ‘वही’ यूनानी संरचना के पहचानसूचक बल को स्पष्ट करता है।
- source_word: διὰ
  choice: के द्वारा
  rationale: संबंधकारक के साथ διά मानवीय माध्यम अथवा कर्तृत्व व्यक्त कर सकता है। हिन्दी में ‘के द्वारा’ दोनों संभावनाओं को रहने देता है, यद्यपि संदर्भ में भविष्यद्वक्ता का माध्यम होना प्रमुख है।
- source_word: τοῦ προφήτου
  choice: भविष्यद्वक्ता
  rationale: यह διά का संबंधकारक पूरक है और योएल की मान्य भविष्यद्वक्ताई भूमिका को सीधे व्यक्त करता है।
- source_word: Ἰωήλ
  choice: योएल
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण अपनाया गया है।
theological_decisions:
- issue: διὰ τοῦ προφήτου Ἰωήλ में भविष्यद्वक्ताई मध्यस्थता
  choice: योएल भविष्यद्वक्ता के द्वारा
  alternative: योएल भविष्यद्वक्ता से
  rationale: ‘के द्वारा’ यूनानी διά के साधन/माध्यम और कर्तृत्व के अर्थ-क्षेत्र को बनाए रखता है तथा योएल को संदेश का मानवीय माध्यम समझने की गुंजाइश देता है, बिना पाठ से आगे बढ़कर प्रेरणा या वचन-लेखन का कोई विशिष्ट सिद्धान्त आरोपित किए।
