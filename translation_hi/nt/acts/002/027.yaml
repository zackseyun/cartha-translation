id: ACT.2.27
reference: Acts 2:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ⸀ᾅδην, οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/027.yaml
  text: because you will not abandon my soul to Hades[c][b][a], nor will you let your Holy One see decay.
translation:
  language: hi
  text: क्योंकि तू मेरे प्राण को अधोलोक[a] में नहीं छोड़ेगा, और न अपने पवित्र जन[b] को सड़न[c] देखने देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शिओल में’; यह इस उद्धरण के पीछे के इब्रानी पाठ को दर्शाता है। यहाँ यूनानी में ‘हेडेस’ है।
    reason: alternative_reading
  - marker: b
    text: या ‘अपने विश्वासयोग्य जन को’।
    reason: lexical_alternative
  - marker: c
    text: अर्थात शरीर का सड़ना या विघटित होना; पारंपरिक अनुवादों में प्रायः ‘भ्रष्टता’ मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκαταλείψεις
  choice: नहीं छोड़ेगा
  rationale: यह भविष्यकालीन क्रिया किसी व्यक्ति को किसी दशा या स्थान में छोड़ देने के अर्थ में है। ‘नहीं छोड़ेगा’ आधुनिक हिन्दी में स्वाभाविक है और त्याग दिए जाने का भाव बनाए रखता है।
- source_word: ψυχήν
  choice: प्राण
  rationale: इस भजन-उद्धरण में ψυχή का अर्थ ‘जीवन’, ‘स्वयं’ या ‘प्राण’ हो सकता है। ‘प्राण’ मूल अभिव्यक्ति का मानवीय भार बनाए रखता है, पर शरीर और आत्मा के विषय में पाठ से अधिक तकनीकी निष्कर्ष नहीं जोड़ता।
- source_word: εἰς ᾅδην
  choice: अधोलोक में
  rationale: ᾅδης यहाँ मृतकों के लोक को सूचित करता है, न कि बाद की धारणाओं से जुड़ा ‘नरक’। ‘छोड़ना’ के साथ हिन्दी में ‘अधोलोक में’ स्वाभाविक है। इब्रानी पृष्ठभूमि का ‘शिओल’ पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: δώσεις
  choice: देखने देगा
  rationale: δώσεις का शाब्दिक अर्थ ‘देगा’ है, पर क्रिया के अनंत रूप के साथ यह अनुमति देने का मुहावरा है; इसलिए ‘देखने देगा’ स्पष्ट और स्वाभाविक है।
- source_word: τὸν ὅσιόν σου
  choice: अपने पवित्र जन
  rationale: ὅσιος परमेश्वर के प्रति पवित्र, भक्त या विश्वासयोग्य व्यक्ति को दर्शा सकता है। ‘पवित्र जन’ अर्थ-सीमा और इस प्रसंग के मसीह-संबंधी संकेत दोनों को सुरक्षित रखता है।
- source_word: ἰδεῖν διαφθοράν
  choice: सड़न देखने
  rationale: यह मूल मुहावरे के निकट रहते हुए शारीरिक विघटन का अर्थ स्पष्ट करता है। ‘भ्रष्टता’ आधुनिक हिन्दी में नैतिक बिगाड़ का भ्रम पैदा कर सकती है।
theological_decisions:
- issue: पुनरुत्थान के प्रसंग में ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: मृतकों का लोक; शिओल; कब्र
  rationale: यह चयन ‘नरक’ से जुड़ी बाद की धर्मवैज्ञानिक धारणाएँ पाठ में नहीं डालता और यूनानी शब्द के मृतकों के लोक वाले अर्थ को बनाए रखता है। इब्रानी भजन की पृष्ठभूमि में आए ‘शिओल’ को पाद-टिप्पणी में दिया गया है।
- issue: τὸν ὅσιόν σου की मसीह-संबंधी पहचान
  choice: अपने पवित्र जन
  alternative: अपने विश्वासयोग्य जन; अपने भक्त जन
  rationale: प्रेरितों के काम 2 में पतरस इस भजन को यीशु के पुनरुत्थान पर लागू करता है। ‘पवित्र जन’ शब्द के अर्थ और प्रसंग के मसीह-संबंधी बल को बनाए रखता है, पर पाठ से आगे कोई विशिष्ट सांप्रदायिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर को संबोधन होने के कारण ‘तू’ का प्रयोग भजन की सीधी और आत्मीय शैली को बनाए रखता है। ‘अधोलोक’ को ‘नरक’ पर प्राथमिकता दी गई है ताकि अनावश्यक धर्मवैज्ञानिक अर्थ न जुड़ें; पाद-टिप्पणी यूनानी और इब्रानी पृष्ठभूमि स्पष्ट करती है।
