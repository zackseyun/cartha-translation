language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη, καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/029.yaml
  text: Men[a], brothers, I may speak to you with boldness about the patriarch David, that he both died and was buried, and his tomb is among us to this day.
translation:
  language: hi
  text: पुरुषो और भाइयो[a], मैं कुलपिता दाऊद के विषय में आपसे निःसंकोच कह सकता हूँ कि वह मरा भी और दफनाया भी गया, और उसकी कब्र आज तक हमारे बीच है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘पुरुषो, भाइयो’ है; यह वहाँ उपस्थित अपने ही इस्राएली लोगों को किया गया औपचारिक संबोधन है।
    reason: यूनानी के दोहरे पुल्लिंग संबोधन Ἄνδρες ἀδελφοί को स्पष्ट करना; मुख्य पाठ में हिन्दी की स्वाभाविक संबोधन-रचना के लिए ‘और’ प्रयुक्त है।
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: भाइयो[a]
  rationale: यह सभा में उपस्थित अपने ही लोगों को किया गया सम्मानपूर्ण संबोधन है। सहज आधुनिक हिन्दी में दोनों यूनानी संबोधनों को अलग-अलग दोहराना अस्वाभाविक होता; इसलिए मुख्य पाठ में ‘भाइयो’ रखा गया है और शाब्दिक दोहरा संबोधन पादटिप्पणी में बताया गया है।
- source_word: ἐξὸν εἰπεῖν μετὰ παρρησίας
  choice: निःसंकोच कह सकता हूँ
  rationale: ἐξόν बोलने की स्वतंत्रता या अनुमति व्यक्त करता है, जबकि παρρησία खुलेपन, निर्भीकता और स्पष्टवादिता का भाव रखता है। यह हिन्दी वाक्यांश दोनों भावों को स्वाभाविक रूप से साथ रखता है; केवल शारीरिक क्षमता का अर्थ अभिप्रेत नहीं है।
- source_word: περὶ τοῦ πατριάρχου Δαυίδ
  choice: कुलपिता दाऊद के विषय में
  rationale: ‘कुलपिता’ πατριάρχης की पदवी और वंश के आदिपुरुष होने का भाव बनाए रखता है। यूनानी में ‘हमारे’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: καὶ ἐτελεύτησεν καὶ ἐτάφη
  choice: वह मरा भी और गाड़ा भी गया
  rationale: ‘भी…भी’ दोनों καί के संयुक्त बल को हिन्दी में स्पष्ट करता है। ἐτελεύτησεν का प्रसंगानुकूल अर्थ ‘मरा’ और ἐτάφη का अर्थ ‘गाड़ा गया’ है।
- source_word: τὸ μνῆμα αὐτοῦ
  choice: उसकी कब्र
  rationale: μνῆμα यहाँ ज्ञात दफन-स्थान को दर्शाता है। ‘कब्र’ साधारण आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης
  choice: आज तक हमारे बीच है
  rationale: यह दाऊद की कब्र के वक्ता और श्रोताओं के समुदाय अथवा स्थान में अब भी विद्यमान होने को व्यक्त करता है। ‘आज तक’ यूनानी कालवाचक मुहावरे का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: आरंभिक पुल्लिंग दोहरे संबोधन को कैसे व्यक्त किया जाए
  choice: मुख्य पाठ में ‘भाइयो’ और पादटिप्पणी में शाब्दिक रूप
  alternative: ‘पुरुषो, भाइयो’ अथवा ‘भाइयो और बहनो’
  rationale: यूनानी में ἄνδρες और ἀδελφοί, दोनों पुल्लिंग संबोधन हैं। ‘पुरुषो, भाइयो’ आधुनिक हिन्दी में कृत्रिम लगता है, जबकि ‘भाइयो और बहनो’ स्रोत में स्त्रीलिंग संबोधन जोड़ देता। ‘भाइयो’ संबोधन का स्वाभाविक कार्य निभाता है और पादटिप्पणी स्रोत की वास्तविक बनावट को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक भाषण के अनुकूल रखी गई है। ‘निःसंकोच’ खुले और निर्भीक कथन का भाव देता है; ‘कुलपिता’ पदवी को सुरक्षित रखता है।
