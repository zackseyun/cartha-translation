- issue: γλώσσαις को ‘जीभों’ या ‘भाषाओं’ के रूप में प्रस्तुत करना
  choice: अन्य भाषाओं[a] में
  alternative: अन्य जीभों से
  rationale: यूनानी शब्द दोनों अर्थ रख सकता है, पर आधुनिक हिन्दी में ‘जीभों से बोलना’ अस्पष्ट और अप्राकृतिक होगा। आगे का प्रसंग श्रोताओं द्वारा पहचानी गई मानवीय भाषाओं का वर्णन करता है; पादटिप्पणी मूल शब्द की शाब्दिक और व्यापक अर्थ-सीमा सुरक्षित रखती है।
