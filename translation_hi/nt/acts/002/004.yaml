lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: भर गए
  rationale: यहाँ क्रिया का अओरिस्ट कर्मवाच्य रूप पवित्र आत्मा से पूर्ण किए जाने को दर्शाता है। ‘भर गए’ स्वाभाविक हिन्दी है और आत्मा द्वारा सामर्थ्य दिए जाने के प्रसंग के अनुकूल है।
- source_word: πάντες
  choice: सब
  rationale: यह उपस्थित पूरे समूह को समेटता है और यूनानी शब्द के समग्रता-सूचक बल को संक्षेप में व्यक्त करता है।
- source_word: πνεύματος ἁγίου
  choice: पवित्र आत्मा
  rationale: प्रेरितों के काम 2 में यह यीशु द्वारा प्रतिज्ञा किए गए और बोलने की सामर्थ्य देने वाले दिव्य आत्मा का विशिष्ट उल्लेख है। हिन्दी में इसके साथ अलग निश्चित उपपद आवश्यक नहीं है।
- source_word: ἤρξαντο λαλεῖν
  choice: बोलने लगे
  rationale: यह आरम्भसूचक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἑτέραις γλώσσαις
  choice: अन्य भाषाओं[a] में
  rationale: ἑτέραις का अर्थ उनकी सामान्य बोली से भिन्न ‘अन्य’ है। γλώσσαις का मूल अर्थ ‘जीभों’ और विस्तृत अर्थ ‘भाषाओं’ दोनों से जुड़ा है; हिन्दी में ‘अन्य भाषाओं में बोलना’ सबसे स्वाभाविक है, जबकि पादटिप्पणी मूल शब्द की व्यापकता बताती है।
- source_word: καθὼς
  choice: जैसे-जैसे
  rationale: यह बोलने और आत्मा द्वारा निरन्तर सामर्थ्य दिए जाने के साथ-साथ चलते सम्बन्ध को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: ἐδίδου
  choice: देता था
  rationale: अपूर्णकालीन रूप जारी अथवा बार-बार होने वाली क्रिया बताता है; ‘देता था’ उस निरन्तरता को बनाए रखता है।
- source_word: ἀποφθέγγεσθαι αὐτοῖς
  choice: उन्हें बोलने की सामर्थ्य
  rationale: क्रिया सार्वजनिक रूप से स्पष्ट वचन बोलने या उच्चारित करने का संकेत देती है। ‘बोलने की सामर्थ्य’ आत्मा से प्राप्त सक्षमकरण को सहज हिन्दी में व्यक्त करती है, बिना इसे केवल भविष्यवाणी जैसे किसी एक प्रकार के वचन तक सीमित किए।
