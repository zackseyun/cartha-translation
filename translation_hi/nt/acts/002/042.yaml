  yaml_path: translation/nt/acts/002/042.yaml
  text: And they were devoting themselves to the apostles' teaching and the fellowship[c][b][a], to the breaking of bread and the prayers.
translation:
  language: hi
  text: और वे प्रेरितों की शिक्षा, संगति[a], रोटी तोड़ने[b] और प्रार्थनाओं[c] में निरंतर समर्पित रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘साझा करना,’ ‘सहभागिता’ अथवा ‘सामुदायिक सहभागिता।’
    reason: lexical_alternative
  - marker: b
    text: ‘रोटी तोड़ना’ सामान्य रूप से साथ मिलकर भोजन करने का उल्लेख कर सकता है, यद्यपि बहुत-से लोग समझते हैं कि यहाँ प्रभु-भोज भी सम्मिलित है।
    reason: alternative_reading
  - marker: c
    text: या ‘नियत प्रार्थनाओं’; यहाँ प्रयुक्त निश्चित उपपद प्रार्थना के पहचाने हुए समयों या रूपों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δὲ προσκαρτεροῦντες
  choice: और वे … में निरंतर लगे रहते थे
  rationale: ἦσαν के साथ वर्तमान कृदंत अतीत में चलती और नियमित क्रिया दिखाता है, जबकि προσκαρτερέω दृढ़ता से लगे रहने का भाव रखता है। यह हिंदी वाक्यांश दोनों पक्षों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῇ διδαχῇ τῶν ἀποστόλων
  choice: प्रेरितों की शिक्षा
  rationale: संबंधकारक पद को स्वाभाविक हिंदी में ‘प्रेरितों की’ कहा गया है। ‘शिक्षा’ यहाँ गतिविधि और विषयवस्तु दोनों को व्यक्त करता है तथा ‘धर्मसिद्धांत’ की अपेक्षा कम संकीर्ण है।
- source_word: τῇ κοινωνίᾳ
  choice: संगति
  rationale: κοινωνία में साझा सहभागिता, साझापन और सामुदायिक जीवन का व्यापक भाव है। ‘संगति’ आधुनिक हिंदी मसीही संदर्भ में स्वाभाविक है, पर इसके संभावित व्यापक अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τῇ κλάσει τοῦ ἄρτου
  choice: रोटी तोड़ने
  rationale: यह लूका–प्रेरितों में प्रयुक्त ठोस अभिव्यक्ति को बनाए रखता है और इसे केवल सामान्य भोजन या केवल प्रभु-भोज तक सीमित नहीं करता।
- source_word: ταῖς προσευχαῖς
  choice: प्रार्थनाओं
  rationale: बहुवचन को स्पष्ट रखा गया है। यूनानी निश्चित उपपद संभवतः पहचानी हुई प्रार्थनाओं, समयों या रूपों की ओर संकेत करता है; हिंदी मुख्य पाठ में ‘नियत’ जोड़ना उस संभावना को अनावश्यक रूप से निश्चित कर देता।
theological_decisions:
- issue: क्या κλάσει τοῦ ἄρτου को स्पष्ट रूप से प्रभु-भोज के रूप में अनूदित किया जाए
  choice: रोटी तोड़ने
  alternative: प्रभु-भोज; साझा भोजन, जिसमें प्रभु-भोज भी सम्मिलित था
  rationale: मूल अभिव्यक्ति साझा भोजन का उल्लेख कर सकती है और इस संदर्भ में प्रभु-भोज को भी सम्मिलित कर सकती है, पर केवल संस्कार-संबंधी अर्थ निश्चित नहीं करती। इसलिए व्यापक अभिव्यक्ति मुख्य पाठ में रखी गई है।
- issue: क्या κοινωνία को केवल संपत्ति बाँटने या संस्कारगत सहभागिता तक सीमित किया जाए
  choice: संगति
  alternative: साझा करना; सहभागिता; सहभाग
  rationale: यह शब्द साझा जीवन और भागीदारी का व्यापक क्षेत्र रखता है, जिसमें भौतिक और आत्मिक साझापन दोनों हो सकते हैं। ‘संगति’ इस व्यापकता को अपेक्षाकृत सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सूची को हिंदी की स्वाभाविक समानांतर संरचना में रखा गया है। ‘निरंतर लगे रहते थे’ मूल की आदतन, दृढ़ और जारी क्रिया को व्यक्त करता है।
