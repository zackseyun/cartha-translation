  text: οἱ μὲν ⸀οὖν ἀποδεξάμενοι τὸν λόγον αὐτοῦ ἐβαπτίσθησαν, καὶ προσετέθησαν ⸀ἐν τῇ ἡμέρᾳ ἐκείνῃ ψυχαὶ ὡσεὶ τρισχίλιαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/041.yaml
  text: So those who received his word were baptized[a], and about three thousand souls were added on that day.
translation:
  language: hi
  text: अतः जिन्होंने उसका वचन ग्रहण किया, उन्होंने बपतिस्मा लिया; और उस दिन लगभग तीन हज़ार लोग जोड़ दिए गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ μὲν οὖν
  choice: इसलिए जिन्होंने
  rationale: यह पदबंध पिछले उपदेश के परिणाम और कथा की आगे की गति को दर्शाता है। ‘इसलिए’ उस संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἀποδεξάμενοι
  choice: ग्रहण किया
  rationale: यह क्रिया संदेश का अनुकूल भाव से स्वागत और स्वीकार करना बताती है। ‘ग्रहण किया’ मूल अर्थ के निकट रहते हुए गरिमापूर्ण और सहज है।
- source_word: τὸν λόγον αὐτοῦ
  choice: उसका वचन
  rationale: यहाँ λόγος पतरस द्वारा सुनाए गए संदेश को दर्शाता है। ‘वचन’ यूनानी शब्द से पारदर्शी संबंध बनाए रखता है और प्रेरितों के काम के संदर्भ में स्वाभाविक है।
- source_word: ἐβαπτίσθησαν
  choice: उन्होंने बपतिस्मा लिया
  rationale: हिंदी में निष्क्रिय यूनानी रूप का स्वाभाविक समतुल्य ‘बपतिस्मा लिया’ है; यह विधि या धार्मिक प्रभाव के बारे में कोई अतिरिक्त दावा नहीं जोड़ता।
- source_word: προσετέθησαν
  choice: और जुड़ गए
  rationale: यह समुदाय में सम्मिलित होने का भाव देता है। हिंदी में अकेला ‘जोड़े गए’ अस्पष्ट और अप्राकृतिक लग सकता है; ‘जुड़ गए’ अभिप्रेत समावेश को व्यक्त करता है, जबकि किसके साथ जुड़े यह स्पष्ट रूप से नहीं जोड़ता।
- source_word: ψυχαὶ
  choice: प्राणी
  rationale: यहाँ ψυχαί मनुष्यों की गिनती के लिए प्रयुक्त है। ‘प्राणी’ मूल की पारदर्शिता कुछ हद तक बनाए रखता है, और पादटिप्पणी स्पष्ट करती है कि आशय व्यक्तियों से है, न कि शरीर से अलग आत्माओं की तकनीकी गणना से।
- source_word: ὡσεὶ τρισχίλιαι
  choice: लगभग तीन हज़ार
  rationale: ὡσεί अनुमान सूचित करता है; ‘लगभग तीन हज़ार’ इसका सहज आधुनिक हिंदी रूप है।
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: उस दिन
  rationale: काल-सूचक पदबंध का सीधा और स्वाभाविक हिंदी अनुवाद।
theological_decisions:
- issue: ‘जुड़ गए’ के लक्ष्य को कलीसिया या विश्वासियों के समुदाय के रूप में स्पष्ट करना
  choice: 'लक्ष्य को अव्यक्त रखा गया: ‘और जुड़ गए’'
  alternative: ‘उनमें जुड़ गए’ या ‘कलीसिया में जुड़ गए’
  rationale: यूनानी पाठ इस पद में यह स्पष्ट नहीं करता कि वे किसमें या किनके साथ जोड़े गए। संदर्भ समुदाय की ओर संकेत करता है, पर मुख्य पाठ उस निहितार्थ को स्पष्ट कथन में नहीं बदलता।
- issue: ψυχαί का मानवशास्त्रीय अर्थ
  choice: मुख्य पाठ में ‘प्राणी’, पादटिप्पणी में ‘व्यक्ति’ या ‘लोग’
  alternative: मुख्य पाठ में ‘व्यक्ति’ या ‘लोग’
  rationale: संदर्भ में यह मनुष्यों की संख्या बताने का सामान्य ढंग है। पादटिप्पणी तकनीकी शरीर-आत्मा संबंधी अर्थ आरोपित किए बिना सामान्य अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘बपतिस्मा’ स्थापित बाइबलीय शब्दावली के रूप में रखा गया है। वाक्य में मूल पाठ की परिणाम-सूचक गति, अनुमान और ‘जुड़ने’ के अव्यक्त लक्ष्य को सुरक्षित रखा गया है।
