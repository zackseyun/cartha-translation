  yaml_path: translation/nt/acts/002/045.yaml
  text: And they were selling their property and possessions and distributing them to all[a], as anyone had need.
translation:
  language: hi
  text: वे अपनी ज़मीन-जायदाद और अन्य संपत्ति[a] बेचते थे और उन्हें सब लोगों में, हर एक की ज़रूरत के अनुसार, बाँटते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “भूमि और संपत्ति।” दोनों यूनानी शब्द संभवतः स्वामित्व की अलग-अलग प्रकार की वस्तुओं को दर्शाते हैं: पहला प्रायः भूमि या अचल संपत्ति को, और दूसरा अधिक सामान्य रूप से संपत्ति या अन्य स्वामित्व की वस्तुओं को।'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτήματα
  choice: ज़मीन-जायदाद
  rationale: यह शब्द अर्जित संपत्ति, विशेषकर भूमि या अचल संपत्ति, का संकेत दे सकता है। यह चयन अगले शब्द ὑπάρξεις से स्वाभाविक भेद बनाए रखता है।
- source_word: ὑπάρξεις
  choice: दूसरी संपत्ति
  rationale: यह सामान्यतः किसी की मिल्कियत की वस्तुओं या संपत्ति को दर्शाता है। 'दूसरी संपत्ति' पहले पद की अचल संपत्ति से व्यापक अन्य वस्तुओं का भेद स्पष्ट करती है, बिना केवल चल वस्तुओं तक अर्थ सीमित किए।
- source_word: ἐπίπρασκον
  choice: बेचते रहते थे
  rationale: अपूर्ण भूतकाल ongoing अथवा बार-बार होने वाली क्रिया व्यक्त करता है; इसलिए इसे एक बार पूरी हुई बिक्री के रूप में नहीं रखा गया।
- source_word: διεμέριζον
  choice: बाँट देते थे
  rationale: यहाँ क्रिया समुदाय के बीच वस्तुओं या उनसे प्राप्त धन के वितरण को व्यक्त करती है। हिंदी में यह स्वाभाविक है और वितरण की ठीक प्रक्रिया को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: αὐτά
  choice: उन्हें
  rationale: सर्वनाम को उसी रूप में रखा गया है ताकि वह संपत्ति अथवा निहित रूप से उसकी बिक्री से प्राप्त साधनों—दोनों की संभावना खुली रखे।
- source_word: πᾶσιν
  choice: सब में
  rationale: दत्तिव बहुवचन समुदाय के सभी ज़रूरतमंद सदस्यों की ओर वितरण व्यक्त करता है; 'सब में बाँट देते थे' सहज हिंदी है।
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: हर एक की ज़रूरत के अनुसार
  rationale: यह व्यक्ति-व्यक्ति की आवश्यकता के अनुपात में वितरण का भाव स्वाभाविक और संक्षिप्त हिंदी में व्यक्त करता है।
theological_decisions:
- issue: विश्वासियों द्वारा संपत्ति बाँटने का स्वरूप
  choice: पद को ज़रूरत के अनुसार संपत्ति बेचने और बाँटने की निरंतर या बार-बार की प्रथा के वर्णन के रूप में रखा गया है।
  alternative: इसे समस्त निजी स्वामित्व के अनिवार्य और स्थायी उन्मूलन की शिक्षा के रूप में प्रस्तुत करना।
  rationale: दोनों यूनानी क्रियाओं के अपूर्ण भूतकाल रूप दोहराई जाती या जारी क्रिया दिखाते हैं। पद स्वयं न तो यह कहता है कि निजी स्वामित्व पूरी तरह समाप्त हो गया था, न इसे सभी मसीहियों के लिए सार्वभौमिक व्यवस्था घोषित करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'बेचते रहते थे' अपूर्ण भूतकाल की निरंतरता को स्पष्ट करता है। 'ज़मीन-जायदाद' सामान्य पाठक के लिए बोधगम्य है, जबकि पाद-टिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
