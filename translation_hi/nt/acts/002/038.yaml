source:
  edition: SBLGNT
  text: Πέτρος δὲ ⸂πρὸς αὐτούς· Μετανοήσατε⸃, καὶ βαπτισθήτω ἕκαστος ὑμῶν ⸀ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν ⸀τῶν ἁμαρτιῶν ⸀ὑμῶν, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/002/038.yaml
  text: And Peter said to them[a], “Repent, and let each of you be baptized in the name of Jesus the Messiah for the forgiveness of your sins[b], and you will receive the gift of the Holy Spirit.”
translation:
  language: hi
  text: पतरस ने उनसे कहा, “मन फिराओ, और तुममें से हर एक अपने पापों की क्षमा के लिए[b] यीशु मसीह[a] के नाम पर बपतिस्मा ले, और तुम पवित्र आत्मा का वरदान पाओगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मसीह’ के लिए यूनानी शब्द Χριστός है, जिसका अनुवाद ‘ख्रीस्त’ भी किया जाता है; यहाँ इसे यीशु की उपाधि और उसके अर्थ को बनाए रखने के लिए ‘मसीह’ कहा गया है।
    reason: alternative_reading
  - marker: b
    text: ‘अपने पापों की क्षमा के लिए’ यूनानी वाक्यांश का सीधा अनुवाद है। यहाँ बपतिस्मा और क्षमा के बीच ठीक किस प्रकार का सम्बन्ध है, इस पर व्याख्याकारों में मतभेद है; अनुवाद उस प्रश्न का निर्णय पाठ के शब्दों से आगे जाकर नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετανοήσατε
  choice: मन फिराओ
  rationale: यह बहुवचन आज्ञा मन, दिशा और आचरण के निर्णायक परिवर्तन को व्यक्त करती है। केवल भावनात्मक खेद तक सीमित किए बिना ‘मन फिराओ’ पश्चाताप और जीवन की दिशा बदलने—दोनों का भाव बनाए रखता है।
- source_word: βαπτισθήτω ἕκαστος ὑμῶν
  choice: तुममें से हर एक ... बपतिस्मा ले
  rationale: यूनानी में तीसरे पुरुष की एकवचन कर्मवाच्य आज्ञा ‘हर एक’ पर व्यक्तिगत बल देती है। प्रचलित और स्वाभाविक हिन्दी ‘बपतिस्मा ले’ व्यक्ति के बपतिस्मा ग्रहण करने का भाव रखती है।
- source_word: ἐπὶ τῷ ὀνόματι
  choice: के नाम में
  rationale: बपतिस्मा के सन्दर्भ में यह स्वाभाविक हिन्दी प्रयोग है और आधार, अधिकार या अंगीकार में से किसी एक सूक्ष्मार्थ को अनावश्यक रूप से निर्णायक नहीं बनाता।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: प्रेरितों के काम 2 के घोषणात्मक सन्दर्भ में Χριστός उपाधि के रूप में सक्रिय है; ‘मसीह’ उसके अर्थ को हिन्दी में स्पष्ट और परम्परागत ढंग से व्यक्त करता है।
- source_word: εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν
  choice: अपने पापों की क्षमा के लिए
  rationale: यह यूनानी वाक्यांश का सीधा और सहज अनुवाद है। ‘के लिए’ उद्देश्य या परिणाम की दिशा को बनाए रखते हुए बपतिस्मा और क्षमा के सम्बन्ध पर किसी विशिष्ट साम्प्रदायिक व्याख्या को नहीं थोपता।
- source_word: λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος
  choice: तुम पवित्र आत्मा का वरदान पाओगे
  rationale: भविष्यकालीन प्रतिज्ञा को सहज आधुनिक हिन्दी में व्यक्त किया गया है। ‘वरदान’ δωρεά की निःशुल्क देन का भाव रखता है।
theological_decisions:
- issue: बपतिस्मा और पापों की क्षमा का सम्बन्ध
  choice: ‘अपने पापों की क्षमा के लिए’ का सीधा अनुवाद
  alternative: ‘ताकि तुम्हारे पाप क्षमा हों’ अथवा ‘तुम्हारे पाप क्षमा हो चुके हैं, इसलिए’
  rationale: εἰς ἄφεσιν को सीधा रखा गया है; पाठ स्वयं बपतिस्मा की प्रभावकारिता, क्रम या प्रतीकात्मकता को जितना स्पष्ट करता है, अनुवाद उससे आगे जाकर विवाद का समाधान नहीं करता।
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस सन्दर्भ में यह यीशु की मसीहाई उपाधि है। ‘मसीह’ हिन्दी पाठक के लिए अर्थपूर्ण और स्वाभाविक है, जबकि वैकल्पिक पारम्परिक रूप को पादटिप्पणी में बताया गया है।
- issue: ‘पवित्र आत्मा का वरदान’ में सम्बन्ध
  choice: सम्बन्धकारक संरचना को यथावत रखना
  alternative: ‘पवित्र आत्मा से मिलने वाला वरदान’ अथवा ‘वरदान के रूप में पवित्र आत्मा’
  rationale: यूनानी सम्बन्धकारक को किसी एक व्याख्या में सीमित किए बिना हिन्दी में उसी संक्षिप्तता से रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘मन फिराओ’ और ‘बपतिस्मा’ जैसे स्थापित बाइबलीय पद अर्थगत सटीकता के लिए रखे गए हैं; वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाया गया है।
