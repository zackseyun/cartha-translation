  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: hi
  text: कुप्रुस को दृष्टि में पाकर[a] और उसे अपनी बाईं ओर छोड़कर, हम सीरिया की ओर जहाज़ से आगे बढ़े और सोर पहुँचे[b], क्योंकि वहाँ जहाज़ का माल उतारा जा रहा था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुप्रुस दिखाई देने पर” या “कुप्रुस दृष्टिगोचर होने पर।”
    reason: lexical_alternative
  - marker: b
    text: या, “सोर को नीचे आए।” यूनानी में क्रिया का शाब्दिक अर्थ “नीचे आना” है।
    reason: lexical_alternative
  - marker: c
    text: या, “जहाज़ अपना माल उतार रहा था” या “अपना माल उतार रहा था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: दिखाई देने पर
  rationale: यह कृदन्त मुख्य क्रिया से पहले कुप्रुस के दृष्टिगोचर होने को बताता है। यह हिंदी में स्वाभाविक है और समुद्री यात्रा के प्रसंग को बनाए रखता है।
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: उसे अपने बाईं ओर छोड़कर
  rationale: εὐώνυμον यहाँ यात्रा की दिशा के अनुसार बाईं ओर को सूचित करता है; अर्थात जहाज़ कुप्रुस को बाईं ओर रखते हुए आगे बढ़ा।
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: हम सीरिया की ओर आगे जहाज़ से चले
  rationale: अपूर्णकालिक ἐπλέομεν जारी समुद्री यात्रा को दर्शाता है। ‘आगे जहाज़ से चले’ उस निरंतरता को सहज हिंदी में व्यक्त करता है।
- source_word: κατήλθομεν εἰς Τύρον
  choice: सोर उतर आए
  rationale: κατέρχομαι का दिशासूचक भाव ‘नीचे आना/उतरना’ है। बंदरगाह पर पहुँचने के संदर्भ में ‘उतर आए’ स्वाभाविक है और मूल मुहावरे का कुछ अंश सुरक्षित रखता है।
- source_word: ἀποφορτιζόμενον τὸν γόμον
  choice: जहाज़ का माल उतारा जा रहा था
  rationale: मध्य/कर्मवाच्य रूप के कारण इसे कर्मवाच्य रखना व्याकरणिक अस्पष्टता का सम्मान करता है। γόμος जहाज़ पर लदा माल है।
