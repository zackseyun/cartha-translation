revisions:
- from: 'परन्तु विश्वास करनेवाले गैर-यहूदियों के विषय में हम यह संदेश भेज चुके हैं कि हमने निर्णय किया है: वे मूर्तियों को बलि चढ़ाई हुई वस्तुओं, लहू, गला घोंटे हुए पशुओं[a] और व्यभिचार से अपने आपको दूर रखें।'
  to: परन्तु जो गैर-यहूदी विश्वास में आए हैं, उनके विषय में हमने यह निर्णय करके संदेश भेजा कि वे मूर्तियों को चढ़ाए हुए भोजन, रक्त, गला घोंटे हुए पशुओं[a] और यौन अनैतिकता से अपने आपको दूर रखें।
  rationale: The revision retains the source sequence and the decree's ambiguity concerning its rationale or duration. It improves idiomatic Hindi, renders the idol-sacrifice item naturally, and replaces the overly narrow «व्यभिचार» with a broader equivalent for πορνεία. The existing explanatory footnote is retained, with «रक्त» aligned to the revised main text.
  reviewer_model: gpt-5.6-terra
