review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the transition, the Gentile believers, the implicit object of ἀπεστείλαμεν, and the fourfold decree. However, modern Hindi «व्यभिचार» normally denotes adultery and is too narrow for πορνεία, which denotes sexual immorality more broadly. The wording for εἰδωλόθυτον is also unnecessarily awkward; the term concerns food offered in idol sacrifice.
  naturalness: «विश्वास करनेवाले» should be written as the usual separated form «विश्वास करने वाले». Restructuring the sentence with «यह निर्णय करके» reflects the antecedent participle κρίναντες and produces more fluent Hindi without adding content.
  terminology: Use «यौन अनैतिकता» for πορνεία to avoid narrowing the term. «मूर्तियों को चढ़ाया हुआ भोजन» is a clear, natural rendering of εἰδωλόθυτον; it does not restrict the item to a particular kind of meat. «रक्त» is a suitably direct modern-standard term alongside the formal register of the verse.
  issues:
  - severity: high
    issue: «व्यभिचार» renders πορνεία too narrowly.
    rationale: In current standard Hindi, «व्यभिचार» primarily means adultery, whereas πορνεία is a broader category of illicit sexual conduct. «यौन अनैतिकता» preserves the lexical breadth without defining it doctrinally.
  - severity: medium
    issue: «मूर्तियों को बलि चढ़ाई हुई वस्तुओं» is awkward and pluralizes a generic singular expression.
    rationale: εἰδωλόθυτον refers to food offered in idol sacrifice. «मूर्तियों को चढ़ाया हुआ भोजन» is idiomatic Hindi and conveys the referent directly.
  - severity: low
    issue: «विश्वास करनेवाले» is nonstandard spacing in modern Hindi.
    rationale: «विश्वास करने वाले» is the usual contemporary orthography.
  revised_text: परन्तु जो गैर-यहूदी विश्वास में आए हैं, उनके विषय में हमने यह निर्णय करके संदेश भेजा कि वे मूर्तियों को चढ़ाए हुए भोजन, रक्त, गला घोंटे हुए पशुओं[a] और यौन अनैतिकता से अपने आपको दूर रखें।
