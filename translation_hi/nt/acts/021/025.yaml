id: ACT.21.25
reference: Acts 21:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ⸀ἀπεστείλαμεν ⸀κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον ⸀καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: hi
  text: परन्तु जो गैर-यहूदी विश्वास में आए हैं, उनके विषय में हमने यह निर्णय करके संदेश भेजा कि वे मूर्तियों को चढ़ाए हुए भोजन, रक्त, गला घोंटे हुए पशुओं[a] और यौन अनैतिकता से अपने आपको दूर रखें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ऐसे पशु जिन्हें गला घोंटकर मारा गया और जिनका रक्त नहीं निकाला गया।
    reason: cultural_note
lexical_decisions:
- source_word: περὶ δὲ
  choice: परन्तु … के विषय में
  rationale: περί विषय प्रस्तुत करता है और δέ पिछले कथन से हल्का संक्रमण अथवा विरोध दिखाता है।
- source_word: τῶν πεπιστευκότων ἐθνῶν
  choice: विश्वास करनेवाले गैर-यहूदियों
  rationale: सिद्ध वर्तमान कृदन्त विश्वास में आ चुके और बने हुए लोगों को दर्शाता है; संदर्भ में ἔθνη का अर्थ गैर-यहूदी है।
- source_word: ἀπεστείλαμεν
  choice: हम यह संदेश भेज चुके हैं
  rationale: यूनानी क्रिया का कर्म अव्यक्त है; 'संदेश' कहना पत्र को अनिवार्य रूप से जोड़ने से बचता है, जबकि प्रेरितों के काम 15 के निर्णय-संचार की ओर संकेत बनाए रखता है।
- source_word: κρίναντες
  choice: हमने निर्णय किया है
  rationale: यह परिषद के विचारपूर्वक किए गए निर्णय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: वे … से अपने आपको दूर रखें
  rationale: मध्यम वाच्य का आत्म-संबंधी भाव सुरक्षित रहता है और निषिद्ध वस्तुओं से बचने का आशय स्पष्ट होता है।
- source_word: τό τε εἰδωλόθυτον
  choice: मूर्तियों को बलि चढ़ाई हुई वस्तुओं
  rationale: यह εἰδωλόθυτον को केवल मांस तक संकुचित किए बिना मूर्ति-बलि से संबद्ध वस्तुओं के रूप में प्रस्तुत करता है।
- source_word: αἷμα
  choice: लहू
  rationale: मूल के संक्षिप्त और सीधे पद को बनाए रखता है; संदर्भ में सेवन का आशय है, पर उसे मुख्य पाठ में जोड़ा नहीं गया।
- source_word: πνικτόν
  choice: गला घोंटे हुए पशुओं
  rationale: यह ऐसे पशुओं को दर्शाता है जिन्हें गला घोंटकर मारा गया और जिनका लहू नहीं निकाला गया; हिन्दी में केवल 'गला घोंटी हुई वस्तु' की अपेक्षा अधिक स्वाभाविक है।
- source_word: πορνείαν
  choice: व्यभिचार
  rationale: यह अवैध यौन आचरण के व्यापक अर्थ को गरिमापूर्ण और सामान्य हिन्दी में व्यक्त करता है; इसे केवल विवाहेतर संबंध के संकीर्ण आधुनिक अर्थ में नहीं समझना चाहिए।
theological_decisions:
- issue: प्रेरितों के निर्णय में निषेधों का स्वरूप और अवधि
  choice: चारों निषेधों को सीधे रूप में प्रस्तुत किया गया है, बिना उनकी अवधि या व्यवस्थित धर्मवैज्ञानिक आधार को निर्धारित किए।
  alternative: इन्हें केवल अस्थायी संगति-संबंधी रियायत अथवा सर्वकालिक सार्वभौमिक व्यवस्था के रूप में स्पष्ट करना।
  rationale: यह पद पूर्व निर्णय की विषयवस्तु बताता है, पर इन निषेधों की पूर्ण धर्मवैज्ञानिक व्याख्या या अवधि नहीं बताता; अतः मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। 'गैर-यहूदी' सामान्यतः समझ में आने वाला पद है; 'हम' की उपस्थिति मूल के स्पष्ट ἡμεῖς को सुरक्षित रखती है।
