lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα
  choice: जब हम यरूशलेम पहुँचे
  rationale: यह संबंधकारक निरपेक्ष रचना आगमन का समय और परिस्थिति बताती है। आधुनिक हिन्दी में यह स्वाभाविक रूप से गंतव्य तक पहुँचने को व्यक्त करती है।
- source_word: ἀσμένως
  choice: खुशी से
  rationale: यह क्रिया-विशेषण प्रसन्नता और तत्परता के साथ किसी को ग्रहण करने का भाव देता है; ‘खुशी से’ सरल और अर्थ-सन्निकट है।
- source_word: ἀπεδέξαντο
  choice: स्वागत किया
  rationale: इस प्रसंग में क्रिया आतिथ्यपूर्वक ग्रहण करने को दर्शाती है; आधुनिक हिन्दी में ‘स्वागत किया’ इस पारस्परिक भाव को स्पष्ट करता है।
- source_word: οἱ ἀδελφοί
  choice: भाइयों
  rationale: यूनानी में पुल्लिंग बहुवचन संज्ञा है। मुख्य पाठ उसके रूप को बनाए रखता है, जबकि आरम्भिक मसीही प्रयोग में व्यापक विश्वासी समुदाय के समावेश की सम्भावना पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: यरूशलेम के मसीही समुदाय के लिए ἀδελφοί का लिंग-सूचक अनुवाद
  choice: भाइयों
  alternative: भाई-बहनों; विश्वासियों
  rationale: मुख्य पाठ यूनानी के पुल्लिंग बहुवचन रूप को सुरक्षित रखता है और उसे लिंग-निरपेक्ष शब्द से समतल नहीं करता। फिर भी यह शब्द इस प्रसंग में स्त्री-पुरुष दोनों विश्वासियों को व्यापक रूप से सूचित कर सकता है; इसलिए वह सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जब…पहुँचे, तो…’ हिन्दी में समय-संबंध स्पष्ट करता है; ‘खुशी से हमारा स्वागत किया’ मूल के प्रसन्नतापूर्ण आतिथ्य को स्वाभाविक ढंग से व्यक्त करता है।
