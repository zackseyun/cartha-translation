base_translation:
  language: en
  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: hi
  text: जब हमने ये बातें सुनीं, तो हम और वहाँ के लोग उससे आग्रह करते रहे[a] कि वह यरूशलेम न जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उससे विनती करते रहे।” इस क्रिया में बहुत आग्रह से, यहाँ तक कि गिड़गिड़ाकर, कहने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἠκούσαμεν ταῦτα
  choice: जब हमने ये बातें सुनीं
  rationale: यह वाक्यांश समय-संबंधी परिस्थिति और हल्की कथात्मक प्रगति बताता है। “ये बातें” बहुवचन को बनाए रखते हुए पिछली भविष्यवाणी की बातों की ओर संकेत करता है।
- source_word: παρεκαλοῦμεν
  choice: आग्रह करने लगे
  rationale: παρακαλέω यहाँ आग्रह या विनती का भाव रखता है। अपूर्ण भूतकाल की जारी या बार-बार की गई क्रिया को सहज हिन्दी में “करने लगे” से व्यक्त किया गया है।
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: हम और वहाँ के लोग
  rationale: यह कथावाचक के साथियों और उस स्थान के निवासियों—दोनों समूहों को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν εἰς Ἰερουσαλήμ
  choice: कि वह यरूशलेम न जाए
  rationale: यह आग्रह की विषयवस्तु को स्वाभाविक हिन्दी में व्यक्त करता है। हिन्दी में यरूशलेम की यात्रा के लिए “ऊपर न जाए” असहज और संभावित रूप से भ्रामक होता, इसलिए गंतव्य का अर्थ स्पष्ट रखा गया है।
theological_decisions:
- issue: यरूशलेम जाने के लिए दिशासूचक मुहावरा
  choice: यरूशलेम न जाए
  alternative: यरूशलेम को ऊपर न जाए
  rationale: यूनानी ἀναβαίνειν में यरूशलेम की ओर “ऊपर जाने” का पारंपरिक दिशासूचक प्रयोग है। आधुनिक हिन्दी में शाब्दिक रूप अनावश्यक भौगोलिक जोर या अस्वाभाविकता पैदा करता; इसलिए आशय को सहज रूप में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “वहाँ के लोग” सामान्य पाठक के लिए “स्थानीय निवासी” से अधिक स्वाभाविक है; “आग्रह करने लगे” मूल के अपूर्ण भूतकाल और earnest appeal—दोनों को संतुलित करता है।
