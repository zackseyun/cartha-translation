  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: κράζοντες· Ἄνδρες Ἰσραηλῖται, βοηθεῖτε· οὗτός ἐστιν ὁ ἄνθρωπος ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου πάντας ⸀πανταχῇ διδάσκων, ἔτι τε καὶ Ἕλληνας εἰσήγαγεν εἰς τὸ ἱερὸν καὶ κεκοίνωκεν τὸν ἅγιον τόπον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/028.yaml
  text: shouting[a], “Men of Israel, help! This is the man who teaches everyone everywhere against the people and the law and this place. And besides that, he has even brought Greeks into the temple and has defiled this holy place.”
translation:
  language: hi
  text: वे पुकार रहे थे, “इस्राएली भाइयो, सहायता करो! यही वह आदमी है जो हर जगह सब लोगों को हमारी प्रजा, व्यवस्था और इस स्थान के विरुद्ध शिक्षा देता है। इतना ही नहीं, यह यूनानियों को भी मन्दिर-परिसर[a] में ले आया है और इस पवित्र स्थान को अशुद्ध कर दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द ἱερόν से आशय पूरे मन्दिर-परिसर या उसके प्रांगणों से है, विशेष रूप से भीतरी पवित्रस्थान से नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: κράζοντες
  choice: वे पुकार रहे थे
  rationale: वर्तमान कृदन्त आरोप लगाने के ढंग को बताता है; यह अनुवाद ऊँची, सार्वजनिक और तात्कालिक पुकार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: इस्राएली भाइयो
  rationale: शाब्दिक रूप ‘इस्राएली पुरुषो’ आधुनिक हिन्दी में अस्वाभाविक है। पुरुष श्रोताओं को संबोधित करने वाला ‘भाइयो’ सामान्य, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: βοηθεῖτε
  choice: सहायता करो!
  rationale: आज्ञार्थक पुकार को बिना अनावश्यक कर्म जोड़कर व्यक्त करता है।
- source_word: οὗτός ἐστιν ὁ ἄνθρωπος
  choice: यही वह आदमी है
  rationale: पहचान और आरोप के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου
  choice: हमारी प्रजा, व्यवस्था और इस स्थान के विरुद्ध
  rationale: κατά के विरोधार्थक अर्थ को स्पष्ट रखता है। प्रसंग में ὁ λαός इस्राएली/यहूदी प्रजा है; हिन्दी में ‘हमारी’ संदर्भ को स्वाभाविक रूप से स्पष्ट करता है। ‘व्यवस्था’ मूसा की व्यवस्था का प्रचलित बाइबलीय पद है।
- source_word: πάντας πανταχῇ διδάσκων
  choice: हर जगह सब लोगों को ... शिक्षा देता है
  rationale: πάντας और πανταχῇ दोनों की व्यापकता तथा आरोप की अतिशयोक्तिपूर्ण ध्वनि सुरक्षित रहती है।
- source_word: ἔτι τε καὶ
  choice: इतना ही नहीं
  rationale: आगे जोड़े गए अधिक गंभीर आरोप की संचयी और बलात्मक प्रकृति व्यक्त करता है।
- source_word: Ἕλληνας
  choice: यूनानियों
  rationale: मूल में विशिष्ट शब्द ‘यूनानी’ है, व्यापक ‘गैर-यहूदी’ नहीं; इसलिए प्रत्यक्ष शब्दार्थ रखा गया है।
- source_word: εἰσήγαγεν εἰς τὸ ἱερὸν
  choice: मन्दिर-परिसर में ले आया है
  rationale: ἱερόν पूरे मन्दिर-परिसर/प्रांगणों को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं। ‘ले आया है’ पूर्ण हुई क्रिया के वर्तमान आरोपात्मक प्रभाव को दर्शाता है।
- source_word: κεκοίνωκεν
  choice: अशुद्ध कर दिया है
  rationale: धार्मिक शुद्धता के प्रसंग में κοινόω का अर्थ अपवित्र अथवा धार्मिक रीति से अशुद्ध करना है; ‘अशुद्ध’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: τὸν ἅγιον τόπον τοῦτον
  choice: इस पवित्र स्थान
  rationale: पवित्रता और संकेतवाचक बल दोनों को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: τοῦ νόμου का संदर्भ
  choice: व्यवस्था
  alternative: कानून
  rationale: यरूशलेम और मन्दिर के प्रसंग में इसका संकेत मूसा की व्यवस्था की ओर है। ‘व्यवस्था’ हिन्दी बाइबल की परिचित और अर्थपूर्ण अभिव्यक्ति है, पर पाठ में ऐसा कुछ नहीं जो आरोप की सत्यता को स्वीकार करे।
- issue: ἱερόν का विस्तार
  choice: मन्दिर-परिसर
  alternative: मन्दिर
  rationale: मूल शब्द समूचे मन्दिर-परिसर को दर्शाता है, न कि विशेष रूप से भीतरी पवित्रस्थान को। मुख्य पाठ में अधिक सटीक पद रखने से ऐतिहासिक आरोप स्पष्ट होता है।
- issue: आरोप की कथात्मक स्थिति
  choice: आरोप को वक्ताओं के कथन के रूप में यथावत रखा
  alternative: कथन को तथ्य की तरह स्पष्ट करना या उसका तत्काल खंडन जोड़ना
  rationale: पद भीड़ का आरोप प्रस्तुत करता है; अनुवाद न उसे सत्य घोषित करता है, न इस पद में अनुपस्थित खंडन जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक आरोप की तीव्रता वाला कथन। ‘मन्दिर’ की वर्तनी अपनाई गई है। संबोधन में अस्वाभाविक ‘इस्राएली पुरुषो’ के स्थान पर पुरुष श्रोताओं के लिए स्वाभाविक ‘इस्राएली भाइयो’ रखा गया है।
