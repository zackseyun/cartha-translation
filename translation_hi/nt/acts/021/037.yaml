  edition: SBLGNT
  text: Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ· Εἰ ἔξεστίν μοι εἰπεῖν ⸀τι πρὸς σέ; ὁ δὲ ἔφη· Ἑλληνιστὶ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: hi
  text: जब पौलुस को छावनी[a] में ले जाने ही वाले थे, तो उसने सहस्रपति[b] से कहा, “क्या मुझे आपसे कुछ कहने की अनुमति है?” उसने कहा, “क्या तुम यूनानी भाषा जानते हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् रोमी सैनिकों के रहने और तैनात रहने का परिसर, संभवतः अन्तोनिया किले के भीतर।
    reason: cultural_note
  - marker: b
    text: या “सेनापति।” यूनानी शब्द रोमी सेना के एक उच्च अधिकारी को सूचित करता है, जो सामान्यतः लगभग एक हजार सैनिकों का अधिकारी होता था।
    reason: cultural_note
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: जब ... भीतर ले जाया जाने वाला था
  rationale: μέλλω निकट भविष्य को और वर्तमान कर्मवाच्य infinitive εἰσάγεσθαι पौलुस को किसी अन्य के द्वारा भीतर ले जाए जाने को व्यक्त करता है। हिंदी में कालवाचक उपवाक्य मूल कृदन्तीय रचना को स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: παρεμβολή
  choice: छावनी
  rationale: इस यरूशलेम प्रसंग में शब्द रोमी सैनिक परिसर अथवा सैनिक निवास को सूचित करता है। ‘छावनी’ सहज हिंदी है; परिसर की अधिक स्पष्ट जानकारी पादटिप्पणी में दी गई है।
- source_word: χιλίαρχος
  choice: सहस्रपति
  rationale: यह रोमी सैन्य पद है, जिसका शाब्दिक संबंध लगभग एक हजार सैनिकों की कमान से है। ‘सहस्रपति’ ऐतिहासिक विशिष्टता बनाए रखता है; अधिक सामान्य विकल्प ‘सेनापति’ है।
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: क्या मुझे आपसे कुछ कहने की अनुमति है?
  rationale: ἔξεστιν अनुमति अथवा अधिकार को व्यक्त करता है। हिंदी में ‘क्या ... अनुमति है?’ विनम्र प्रश्न के रूप में मूल आशय और औपचारिकता दोनों सुरक्षित रखता है।
- source_word: τι
  choice: कुछ
  rationale: इस संदर्भ में अनिश्चित सर्वनाम का स्वाभाविक अर्थ ‘कुछ’ है।
- source_word: Ἑλληνιστί γινώσκεις
  choice: क्या तुम यूनानी भाषा जानते हो?
  rationale: Ἑλληνιστί का अर्थ ‘यूनानी में/यूनानी भाषा’ और γινώσκεις का मूल अर्थ ‘जानते हो’ है। यह अनुवाद भाषाज्ञान का भाव बनाए रखता है, बिना उसे केवल बोलने या समझने की क्षमता तक सीमित किए।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। पौलुस अधिकारी को सम्मानपूर्वक ‘आप’ कहता है, जबकि अधिकारी पौलुस को ‘तुम’ कहता है; यह प्रसंग की सामाजिक असमानता को स्वाभाविक हिंदी में दर्शाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
