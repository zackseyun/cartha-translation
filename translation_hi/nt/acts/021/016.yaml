  text: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν, ἄγοντες παρ’ ᾧ ξενισθῶμεν Μνάσωνί τινι Κυπρίῳ, ἀρχαίῳ μαθητῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: hi
  text: कैसरिया के कुछ शिष्य भी हमारे साथ चले, और वे हमें साइप्रस के मनासोन नामक एक व्यक्ति के पास ले गए[a]। वह लंबे समय से शिष्य था[b], और हमें उसके यहाँ ठहरना था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे हमें मनासोन के पास ले जा रहे थे … जिसके यहाँ हम ठहरें,” अथवा “वे हमें मनासोन के घर ले गए।” यूनानी कृदंत और आतिथ्य-संबंधी क्रिया को थोड़े भिन्न, पर निकट अर्थों में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “आरंभिक दिनों से शिष्य।” इसका अर्थ यह हो सकता है कि मनासोन लंबे समय से, संभवतः इस आंदोलन के आरंभिक दिनों से, शिष्य था।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆλθον δὲ καὶ τῶν μαθητῶν ἀπὸ Καισαρείας σὺν ἡμῖν
  choice: कैसरिया के कुछ शिष्य भी हमारे साथ चले
  rationale: τῶν μαθητῶν का अंशवाचक भाव ‘कुछ शिष्य’ से व्यक्त होता है; συνῆλθον और σὺν ἡμῖν यात्रा में साथ चलने का अर्थ देते हैं।
- source_word: ἄγοντες
  choice: वे हमें ... के पास ले गए
  rationale: यात्रा और आतिथ्य के प्रसंग में क्रिया का स्वाभाविक अर्थ मार्ग दिखाते हुए किसी मेजबान के पास ले जाना है।
- source_word: παρ’ ᾧ ξενισθῶμεν
  choice: जिसके यहाँ हमें ठहरना था
  rationale: ξενίζω यहाँ अतिथि के रूप में ठहराए जाने का भाव रखता है; हिंदी में ‘जिसके यहाँ ठहरना’ घर और आतिथ्य दोनों को सहज रूप से व्यक्त करता है।
- source_word: Μνάσωνί τινι Κυπρίῳ
  choice: साइप्रस के मनासोन नामक एक ... शिष्य
  rationale: τινι किसी पहले से अपरिचित व्यक्ति का परिचय देता है; ‘नामक एक’ आधुनिक हिंदी में स्वाभाविक है और Κυπρίῳ को ‘साइप्रस के’ के रूप में स्पष्ट करता है।
- source_word: ἀρχαίῳ μαθητῇ
  choice: एक आरंभिक शिष्य
  rationale: ἀρχαῖος उसके आरंभिक काल से शिष्य होने या बहुत समय से शिष्य रहने की ओर संकेत कर सकता है; मुख्य पाठ में संक्षिप्त ‘आरंभिक शिष्य’ रखा गया और विकल्प टिप्पणी में दिया गया है।
theological_decisions:
- issue: ἀρχαίῳ μαθητῇ का कालगत अर्थ
  choice: आरंभिक शिष्य
  alternative: बहुत समय से शिष्य
  rationale: यूनानी पद यह निश्चित नहीं करता कि मनासोन सबसे पहले शिष्यों में से था या केवल लंबे समय से शिष्य था। मुख्य पाठ संभावित आरंभिक संबंध को रखता है, जबकि टिप्पणी वास्तविक अर्थगत अस्पष्टता बचाती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘मनासोन’ नाम का ध्वन्यात्मक रूप है; ‘जिसके यहाँ’ सामान्य हिंदी में आतिथ्य और निवास-स्थान दोनों व्यक्त करता है। दोनों टिप्पणी-चिह्न संबंधित वाक्य के अंत में साथ रखे गए हैं, क्योंकि वे क्रमशः ले जाने/ठहरने की रचना और ‘आरंभिक शिष्य’ के अर्थ को स्पष्ट करते हैं।
