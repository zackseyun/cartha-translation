  edition: SBLGNT
  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: hi
  text: तब पौलुस ने उत्तर दिया, “तुम क्या कर रहे हो, जो रो-रोकर मेरा हृदय तोड़ रहे हो?[a] क्योंकि मैं प्रभु यीशु के नाम के लिए[b] यरूशलेम में न केवल बाँधे जाने, बल्कि मरने के लिए भी तैयार हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रो-रोकर मेरे हृदय को चूर कर रहे हो।” यूनानी क्रिया केवल दुःखी करने से अधिक प्रबल है और भीतर से टूट जाने की भावात्मक छवि प्रस्तुत करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “प्रभु यीशु के नाम की खातिर।” बाइबल में “नाम” व्यक्ति स्वयं, उसके अधिकार और उससे जुड़े उद्देश्य की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε ἀπεκρίθη ὁ Παῦλος
  choice: तब पौलुस ने उत्तर दिया
  rationale: यूनानी कथात्मक क्रम और सामान्य उत्तर-वाचक क्रिया को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: Τί ποιεῖτε
  choice: तुम यह क्या कर रहे हो?
  rationale: मूल के सीधे प्रश्न को बनाए रखता है; अगले सहभागी पदों को हिन्दी में अलग प्रश्न के रूप में रखने से भाव स्पष्ट और स्वाभाविक बनता है।
- source_word: κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν
  choice: रो-रोकर मेरा हृदय क्यों तोड़ रहे हो?
  rationale: κλαίοντες की निरंतर भावात्मक क्रिया को ‘रो-रोकर’ और συνθρύπτω के प्रबल हृदय-विदारक रूपक को ‘हृदय तोड़ रहे हो’ से व्यक्त किया गया है। ‘क्यों’ हिन्दी में इस भावात्मक प्रतिवाद को स्वाभाविक बनाता है, यद्यपि यूनानी में प्रश्नशब्द τί है।
- source_word: δεθῆναι
  choice: बाँधा जाने
  rationale: निष्क्रिय अनंत क्रिया का सीधा अर्थ सुरक्षित रखता है और इसे केवल ‘कैद किए जाने’ तक सीमित नहीं करता।
- source_word: ἀποθανεῖν
  choice: मरने
  rationale: मूल क्रिया का सीधा और सहज हिन्दी समतुल्य।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: इस संदर्भ में आगामी बंधन और मृत्यु के स्थान को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक ‘यरूशलेम को’ यहाँ असहज होगा।
- source_word: ἑτοίμως ἔχω
  choice: तैयार हूँ
  rationale: यूनानी मुहावरे का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: नाम के लिए
  rationale: ‘नाम’ के बाइबलीय मुहावरे और उसके धार्मिक भार को बनाए रखता है; फुटनोट इसके आशय को स्पष्ट करता है।
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: प्रभु यीशु
  rationale: κύριος को मसीही उपाधि के रूप में ‘प्रभु’ से अनूदित किया गया है, बिना उसे कमजोर या व्याख्यात्मक रूप देने के।
theological_decisions:
- issue: यीशु के लिए κύριος का अनुवाद
  choice: प्रभु यीशु
  alternative: स्वामी यीशु
  rationale: ‘प्रभु’ आधुनिक हिन्दी बाइबल-परंपरा में स्वाभाविक मसीही उपाधि है और मूल की धार्मिक गंभीरता बनाए रखता है।
- issue: ‘नाम’ के बाइबलीय मुहावरे का संरक्षण
  choice: प्रभु यीशु के नाम के लिए
  alternative: प्रभु यीशु के लिए
  rationale: मूल में ‘नाम’ स्पष्ट रूप से उपस्थित है और यीशु के व्यक्तित्व, अधिकार तथा उनसे जुड़ी गवाही का व्यापक संकेत देता है; इसे केवल व्यक्ति के लिए परिभाषित कर देना अर्थ को संकरा कर सकता है।
- issue: पौलुस की तत्परता का विस्तार
  choice: न केवल बाँधा जाने, बल्कि मरने के लिए भी
  alternative: न केवल कैद होने, बल्कि मरने के लिए भी
  rationale: ‘बाँधा जाना’ मूल क्रिया δέω की ठोस छवि को बनाए रखता है और संभावित कारावास को अनुवाद में पहले से निर्णीत नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘रो-रोकर’ दृश्य की भावनात्मक तीव्रता व्यक्त करता है; ‘हृदय तोड़ना’ सामान्य पाठक के लिए स्वाभाविक रहते हुए मूल रूपक को सुरक्षित रखता है। सभी फुटनोट चिह्न मुख्य पाठ में उपस्थित हैं।
