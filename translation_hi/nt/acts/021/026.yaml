id: ACT.21.26
reference: Acts 21:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: hi
  text: तब पौलुस उन पुरुषों को अपने साथ लेकर, अगले दिन उनके साथ शुद्ध होकर, मन्दिर-परिसर में प्रवेश कर रहा था और शुद्धि के दिनों की अवधि पूरी होने की सूचना दे रहा था, जब तक कि उनमें से प्रत्येक के लिए भेंट न चढ़ाई गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραλαβὼν τοὺς ἄνδρας
  choice: उन पुरुषों को अपने साथ ले गया
  rationale: παραλαμβάνω यहाँ साथ ले जाने का भाव रखता है; यह हिन्दी में केवल ‘लिया’ से अधिक स्पष्ट और स्वाभाविक है।
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: अगले दिन
  rationale: यह निकटवर्ती अगले दिन का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: उनके साथ शुद्धि की विधि पूरी करके
  rationale: सन्दर्भ धार्मिक शुद्धि का है। यह रूप अनुष्ठानिक अर्थ स्पष्ट करता है, बिना यह तय किए कि क्रिया पूर्णतः आत्मवाचक थी या कर्मवाच्य।
- source_word: εἰσῄει
  choice: गया
  rationale: यूनानी अपूर्ण भूतकाल प्रक्रिया या पृष्ठभूमि सूचित कर सकता है, पर इस प्रसंग में हिन्दी का सामान्य भूतकाल अधिक स्वाभाविक है और प्रवेश की कथात्मक घटना को ठीक व्यक्त करता है।
- source_word: τὸ ἱερόν
  choice: मन्दिर-परिसर
  rationale: ἱερόν पूरे मन्दिर-परिसर को दर्शाता है, केवल भीतरी पवित्रस्थान को नहीं; इसलिए यह ‘मन्दिर’ से अधिक सटीक है।
- source_word: διαγγέλλων
  choice: सूचना दी
  rationale: यह मन्दिर-सम्बन्धी प्रक्रिया में औपचारिक रूप से बताने या सूचित करने का भाव व्यक्त करता है।
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: शुद्धि के दिन कब पूरे होंगे
  rationale: ग्रीक संज्ञात्मक वाक्यांश को स्वाभाविक हिन्दी उपवाक्य में खोला गया है; भाव निर्धारित अवधि की समाप्ति का है।
- source_word: ἕως οὗ προσηνέχθη ... ἡ προσφορά
  choice: और ... भेंट कब चढ़ाई जाएगी
  rationale: ἕως οὗ यहाँ उस समय-बिन्दु से जुड़ता है जब भेंट चढ़ेगी। हिन्दी में समन्वित ‘कब’ संरचना अस्पष्ट ग्रीक वाक्यविन्यास को अनावश्यक रूप से कठोर बनाए बिना समय-सम्बन्ध व्यक्त करती है।
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: उनमें से प्रत्येक के लिए
  rationale: ὑπέρ यहाँ प्रत्येक व्यक्ति की ओर से अथवा उसके हित में दी जाने वाली भेंट का सम्बन्ध बताता है।
- source_word: ἡ προσφορά
  choice: भेंट
  rationale: यह सामान्य अर्पण-सूचक शब्द है; ‘बलिदान’ कहना मूल की अपेक्षा अर्थ को अधिक संकीर्ण कर सकता है।
theological_decisions:
- issue: मन्दिर की शुद्धि-विधि में पौलुस की भागीदारी
  choice: घटना को बिना किसी धर्मवैचारिक टिप्पणी के सीधे वर्णित किया गया है।
  alternative: भाषा में यह संकेत जोड़ना कि पौलुस ने व्यवस्था की स्थायी वैधता को स्वीकार या अस्वीकार किया।
  rationale: पद केवल पौलुस की कार्यवाही बताता है; वह मसीहियों के लिए मन्दिर-विधियों की व्यापक धर्मवैचारिक स्थिति का निर्णय नहीं करता।
- issue: προσηνέχθη का काल और बलिदानी अर्थ
  choice: ‘भेंट ... चढ़ाई जाएगी’
  alternative: ‘भेंट चढ़ाई गई’ या ‘बलिदान चढ़ाया गया’
  rationale: सूचना भावी समाप्ति और अर्पण के समय से सम्बन्धित प्रतीत होती है; ‘भेंट’ मूल पद की व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘मन्दिर-परिसर’ शब्द ἱερόν और भीतरी पवित्रस्थान के बीच का भेद मुख्य पाठ में ही स्पष्ट करता है। वाक्य को स्वाभाविक हिन्दी बनाने के लिए भारी संज्ञात्मक ग्रीक संरचना को कालवाचक उपवाक्यों में बदला गया है।
