translation:
  language: hi
  text: जब हम वहाँ कई दिनों तक ठहरे हुए थे, तब यहूदिया से अगाबुस नाम का एक भविष्यद्वक्ता नीचे आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμενόντων
  choice: जब हम वहाँ कई दिनों तक ठहरे हुए थे
  rationale: वर्तमानकालिक संबंधवाचक कृदंत वाला संबंधकारक स्वतंत्र वाक्यांश यहाँ समय का भाव देता है। कर्ता प्रसंग से पौलुस और उसके सहयात्री हैं, इसलिए हिंदी में स्वाभाविक रूप से ‘हम’ रखा गया है; ‘ठहरे हुए थे’ लगातार वहाँ रहने का भाव व्यक्त करता है।
- source_word: δὲ
  choice: तब
  rationale: δέ हल्के कथात्मक संक्रमण को चिह्नित करता है। समयसूचक आश्रित वाक्य के साथ ‘तब’ हिंदी में मुख्य घटना को स्वाभाविक ढंग से आगे बढ़ाता है।
- source_word: ἡμέρας πλείους
  choice: कई दिनों तक
  rationale: यह समय की अवधि बताने वाला पद है। πλείους का शाब्दिक अर्थ ‘अधिक’ है, पर यहाँ वह कुछ और दिनों तक ठहरने का मुहावरेदार भाव देता है; ‘कई दिनों तक’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: κατῆλθέν
  choice: नीचे आया
  rationale: κατέρχομαι की दिशात्मक छवि को बनाए रखा गया है। यहूदिया से कैसरिया की ओर यात्रा के वर्णन और कथावाचक के स्थानिक दृष्टिकोण के अनुसार ‘नीचे आया’ उपयुक्त है।
- source_word: τις
  choice: एक
  rationale: अनिश्चित सर्वनाम एक नए पात्र का परिचय देता है। ‘एक भविष्यद्वक्ता’ हिंदी में स्वाभाविक है और अनिश्चितता बनाए रखता है।
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: यहूदिया से
  rationale: मूल भौगोलिक अभिव्यक्ति का सीधा और प्रचलित हिंदी रूप।
- source_word: προφήτης
  choice: भविष्यद्वक्ता
  rationale: प्रोφήτης के लिए मानक और व्यापक रूप से समझा जाने वाला हिंदी पद; यहाँ पात्र की मान्य भविष्यसूचक भूमिका बताई गई है।
- source_word: ὀνόματι Ἅγαβος
  choice: अगबुस नाम का
  rationale: ὀνόματι वाला यूनानी मुहावरा ‘नाम का/जिसका नाम ... था’ के अर्थ में है। ‘अगबुस नाम का’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक परिचय है।
