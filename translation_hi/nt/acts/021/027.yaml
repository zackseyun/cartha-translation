- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: उसे पकड़ लिया
  rationale: ग्रीक मुहावरा किसी पर हाथ डालकर बलपूर्वक काबू करने को दर्शाता है। हिंदी में 'पकड़ लिया' इसका स्पष्ट, स्वाभाविक अर्थ देता है।
