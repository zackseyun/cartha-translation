- source_word: ἐν τῷ ἱερῷ
  choice: मंदिर-परिसर में
  rationale: ἱερόν पूरे मंदिर-परिसर को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं; इसलिए यह अधिक सटीक और फिर भी सहज अनुवाद है।
