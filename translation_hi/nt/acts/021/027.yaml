  text: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι, οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ συνέχεον πάντα τὸν ὄχλον καὶ ἐπέβαλον ⸂ἐπ’ αὐτὸν τὰς χεῖρας⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: hi
  text: जब वे सात दिन पूरे होने ही वाले थे, तब एशिया प्रांत से आए यहूदियों ने पौलुस को मंदिर-परिसर[c] में देखकर सारी भीड़ को भड़का दिया[a] और उसे पकड़ लिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारी भीड़ में खलबली मचा दी।” यूनानी क्रिया भीड़ को भड़काने या उलझन और अव्यवस्था में डालने—दोनों भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उस पर हाथ डाल दिए”; यह किसी को बलपूर्वक पकड़ लेने का मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: “मंदिर-परिसर” से आशय पूरे मंदिर-क्षेत्र से है, केवल भीतरी पवित्रस्थान से नहीं।
    reason: cultural_note
