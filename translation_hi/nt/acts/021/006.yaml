translation_notes:
  register: 'भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपने-अपने घर’ यूनानी मुहावरे εἰς τὰ ἴδια का स्वाभाविक हिंदी रूप है। अंग्रेज़ी परामर्श-पाठ में दूसरे पाद-टिप्पणी चिह्न का स्थान असंगत था: वह ‘जहाज़’ पर लगा था, जबकि टिप्पणी εἰς τὰ ἴδια से संबंधित थी। हिंदी मुख्य पाठ में मुहावरे का अर्थ स्पष्ट होने के कारण उसके लिए अलग पाद-टिप्पणी आवश्यक नहीं मानी गई।'
