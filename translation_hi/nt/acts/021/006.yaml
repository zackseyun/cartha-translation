  text: After we had said farewell to one another[a], we boarded the ship[b], and they returned to their own homes.
translation:
  language: hi
  text: एक-दूसरे से विदा लेने के बाद[a], हम जहाज़ पर चढ़ गए, और वे अपने-अपने घर[b] लौट गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘एक-दूसरे से विदा होकर।’ यूनानी अभिव्यक्ति अभिवादन या विदाई—दोनों का संकेत दे सकती है; यहाँ प्रस्थान का प्रसंग विदाई के अर्थ के पक्ष में है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘अपनी चीज़ों/अपने स्थानों की ओर।’ यह एक मुहावरा है, जिसका अर्थ ‘अपने घरों’ या ‘अपने स्थानों’ को लौटना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: एक-दूसरे से विदा लेने के बाद
  rationale: क्रिया अभिवादन या विदाई—दोनों का भाव दे सकती है; यहाँ प्रस्थान का प्रसंग विदाई के अर्थ का समर्थन करता है।
- source_word: ἐνέβημεν
  choice: हम जहाज़ पर चढ़ गए
  rationale: जहाज़ के संदर्भ में यह क्रिया उसमें प्रवेश करने या उस पर सवार होने को व्यक्त करती है; यह हिंदी में स्वाभाविक कथन है।
- source_word: πλοῖον
  choice: जहाज़
  rationale: शब्द नाव या जहाज़ के लिए प्रयुक्त हो सकता है; प्रेरितों के काम की समुद्री यात्रा के इस प्रसंग में ‘जहाज़’ उपयुक्त है।
- source_word: ὑπέστρεψαν
  choice: वे ... लौट गए
  rationale: क्रिया का सीधा अर्थ वापस लौटना है और यह कथा की गति को सरलता से व्यक्त करता है।
- source_word: εἰς τὰ ἴδια
  choice: अपने-अपने घर
  rationale: शाब्दिक रूप से ‘अपनी वस्तुओं/स्थानों की ओर’ एक मुहावरा है, जो अपने स्थान या घर लौटने का भाव देता है; बहुवचन समूह के लिए ‘अपने-अपने घर’ स्वाभाविक हिंदी है।
