lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: उन दिनों के बाद
  rationale: μετά के साथ कर्मकारक समय-क्रम को दर्शाता है। हिंदी कथात्मक शैली में “उन दिनों के बाद” पिछले प्रसंग में बताए गए दिनों की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: ἐπισκευασάμενοι
  choice: यात्रा की तैयारी करके
  rationale: यह कृदंत स्वयं को तैयार या सुसज्जित करने का व्यापक अर्थ रखता है। यात्रा के संदर्भ में “यात्रा की तैयारी करके” सामान बाँधने सहित सामान्य तैयारी को समेटता है और यूनानी शब्द के अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἀνεβαίνομεν
  choice: हम ... ऊपर जाने लगे
  rationale: अपूर्ण भूतकाल यात्रा की जारी या आरंभ होती गति को कथात्मक अतीत में प्रस्तुत करता है। “ऊपर जाने लगे” यरूशलेम की ओर आरोहण के दिशात्मक भाव को बनाए रखता है।
- source_word: εἰς Ἱεροσόλυμα
  choice: यरूशलेम की ओर
  rationale: εἰς गंतव्य की ओर गति व्यक्त करता है; “यरूशलेम की ओर” हिंदी में स्वाभाविक है और नगर की दिशा में यात्रा का भाव स्पष्ट करता है।
