  text: ἄλλοι δὲ ἄλλο τι ⸀ἐπεφώνουν ἐν τῷ ὄχλῳ· μὴ ⸂δυναμένου δὲ αὐτοῦ⸃ γνῶναι τὸ ἀσφαλὲς διὰ τὸν θόρυβον ἐκέλευσεν ἄγεσθαι αὐτὸν εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: hi
  text: भीड़ में कुछ लोग एक बात चिल्ला रहे थे और दूसरे कुछ और। हंगामे के कारण वह मामले की निश्चित बात[a] न जान सका, इसलिए उसने उसे सैनिक छावनी[b] में ले जाने का आदेश दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मामले की सच्चाई” अथवा “जो निश्चित था।”
    reason: lexical_alternative
  - marker: b
    text: “सैनिक छावनी” से आशय रोमी सैनिकों के ठहरने के स्थान से है, जो सम्भवतः मंदिर-क्षेत्र से लगे किले के परिसर में था।
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν ἐν τῷ ὄχλῳ
  choice: पर भीड़ में कोई कुछ चिल्ला रहा था और कोई कुछ और
  rationale: ἄλλοι...ἄλλο τι के वितरणात्मक विरोध और अपूर्णकाल ἐπεφώνουν की जारी चिल्लाहट को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। ‘भीड़’ तटस्थ है और ‘उपद्रवी दल’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι
  choice: जब वह ... का पता न लगा सका
  rationale: संबंधवाचक निरपेक्ष रचना को प्रसंगगत कारण/परिस्थिति के रूप में सहज हिन्दी में रखा गया है; γνῶναι यहाँ सूचना की वास्तविकता जान लेने या पता लगाने का भाव देता है।
- source_word: τὸ ἀσφαλές
  choice: पक्की बात
  rationale: यह पद उस बात को सूचित करता है जो निश्चित और भरोसेमंद हो। ‘पक्की बात’ सरल हिन्दी में यही अर्थ देता है, जबकि पादटिप्पणी मूल की अन्य सम्भव अर्थछटाएँ सुरक्षित रखती है।
- source_word: διὰ τὸν θόρυβον
  choice: हंगामे के कारण
  rationale: θόρυβος केवल ऊँची आवाज़ नहीं, बल्कि कोलाहल और अव्यवस्था भी दर्शाता है; ‘हंगामा’ इस दृश्य के लिए स्वाभाविक है।
- source_word: ἐκέλευσεν ἄγεσθαι αὐτὸν
  choice: उसने उसे ... ले जाने का आदेश दिया
  rationale: आदेश की निर्णायकता और निष्क्रिय अनन्त रूप का आशय सुरक्षित है; ले जाने वालों की पहचान मूल पाठ की तरह अनिर्दिष्ट रहती है।
- source_word: εἰς τὴν παρεμβολήν
  choice: छावनी में
  rationale: इस प्रसंग में शब्द रोमी सैनिकों के आवासीय सैन्य परिसर को दर्शाता है। ‘छावनी’ आधुनिक हिन्दी में स्पष्ट और संक्षिप्त है; पादटिप्पणी इसका ऐतिहासिक संदर्भ बताती है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कोई कुछ...और कोई कुछ और’ भीड़ में परस्पर विरोधी पुकारों को बोलचाल की स्वाभाविकता के साथ व्यक्त करता है। मूल के सर्वनामों को नामों से स्पष्ट नहीं किया गया, ताकि अनावश्यक व्याख्या न जुड़े। पादटिप्पणी-चिह्न अर्थ की दृष्टि से सम्बद्ध शब्दों—‘पक्की बात’ और ‘छावनी’—पर लगाए गए हैं।
