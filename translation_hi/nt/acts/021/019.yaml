  text: καὶ ἀσπασάμενος αὐτοὺς ἐξηγεῖτο καθ’ ἓν ἕκαστον ὧν ἐποίησεν ὁ θεὸς ἐν τοῖς ἔθνεσιν διὰ τῆς διακονίας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: hi
  text: और उनका अभिवादन करने के बाद, वह एक-एक करके विस्तार से बताने लगा कि परमेश्वर ने उसकी सेवा के द्वारा गैर-यहूदियों[a] के बीच क्या-क्या किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘जातियों के बीच’; इस प्रसंग में इसका अर्थ यहूदी न होने वाले लोग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: अभिवादन करने के बाद
  rationale: एओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई क्रिया बताता है; यह आधुनिक हिन्दी में स्वाभाविक रूप से क्रम को स्पष्ट करता है।
- source_word: ἐξηγεῖτο
  choice: विस्तार से बताने लगा
  rationale: अपूर्णकालीन क्रिया विस्तृत और जारी वृत्तांत का संकेत देती है; ‘बताने लगा’ उसके आरम्भ और प्रगतिशील पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καθ’ ἓν ἕκαστον
  choice: एक-एक करके
  rationale: यह वाक्यांश प्रत्येक बात को क्रमशः बताने पर बल देता है।
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: परमेश्वर ने ... क्या-क्या किया था
  rationale: यह विशिष्ट अनेक कार्यों को हिन्दी में सहजता से व्यक्त करता है और परमेश्वर को स्पष्ट रूप से कर्ता बनाए रखता है।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: गैर-यहूदियों के बीच
  rationale: इस प्रसंग में ἔθνη राजनीतिक राष्ट्रों के बजाय अन्यजातीय, अर्थात यहूदी न होने वाले लोगों, को सूचित करता है।
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: उसकी सेवा के द्वारा
  rationale: διά के साथ सम्बन्धकारक माध्यम को व्यक्त करता है; ‘सेवा’ διακονία का स्वाभाविक और गैर-पदवीपरक हिन्दी रूप है।
theological_decisions:
- issue: पौलुस के मिशनरी वृत्तांत में कर्तृत्व
  choice: परमेश्वर को कार्य करने वाला और पौलुस की सेवा को माध्यम के रूप में प्रस्तुत किया गया है।
  alternative: पौलुस ने गैर-यहूदियों के बीच जो स्वयं सिद्ध किया, उसका वर्णन किया।
  rationale: ὁ θεὸς स्पष्ट रूप से क्रिया का कर्ता है, जबकि διὰ τῆς διακονίας αὐτοῦ पौलुस की सेवा को माध्यम बताता है; अनुवाद ईश्वरीय कर्तृत्व और मानवीय सेवा दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘गैर-यहूदी’ प्रासंगिक अर्थ को स्पष्ट करता है, और ‘सेवा’ अनावश्यक संस्थागत या पदवीपरक अर्थ से बचाती है।
