source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: hi
  text: यह सुनकर उन्होंने परमेश्वर की महिमा की और पौलुस से कहा, “भाई, तुम देख रहे हो कि यहूदियों में[b] विश्वास करनेवालों के कितने ही दसियों हज़ार हैं,[a] और वे सब व्यवस्था के प्रति उत्साही हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द μυριάδες का अर्थ दस हज़ार की इकाइयाँ अथवा सामान्यतः बहुत बड़ी संख्या हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “यहूदियों में” का अनुवाद “यहूदिया के लोगों में” भी हो सकता है, यदि इसे जातीय-धार्मिक के बजाय भौगोलिक अर्थ में लिया जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: यह सुनकर
  rationale: पूर्ववर्ती वृत्तांत को निहित कर्म मानते हुए कालवाचक कृदन्त का स्वाभाविक और संक्षिप्त हिन्दी रूप।
- source_word: ἐδόξαζον τὸν θεόν
  choice: उन्होंने परमेश्वर की महिमा की
  rationale: δοξάζω के परमेश्वर को महिमा देने के धार्मिक अर्थ को सीधे बनाए रखता है।
- source_word: εἶπόν τε αὐτῷ
  choice: और पौलुस से कहा
  rationale: αὐτῷ का संदर्भ पौलुस है; हिन्दी में नाम देने से कथन स्वाभाविक और स्पष्ट बनता है, जबकि τέ का संयोजक बल ‘और’ से व्यक्त होता है।
- source_word: Θεωρεῖς
  choice: तुम देख रहे हो
  rationale: वर्तमानकालीन कथन पौलुस का ध्यान प्रत्यक्ष स्थिति की ओर खींचता है।
- source_word: ἀδελφέ
  choice: भाई
  rationale: एक विशिष्ट पुरुष, पौलुस, के लिए प्रयुक्त सम्बोधन का सीधा रूप।
- source_word: πόσαι μυριάδες
  choice: कितनी ही हज़ारों की संख्या
  rationale: मूल शब्द की अत्यन्त बड़ी संख्या की धारणा को सहज हिन्दी में व्यक्त करता है, बिना उसे अनिवार्य रूप से ठीक दस-दस हज़ार की इकाइयों तक सीमित किए।
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: यहूदियों में
  rationale: यहाँ जातीय-धार्मिक समुदाय प्रमुख है; भौगोलिक अर्थ ‘यहूदिया के लोगों में’ भी सम्भव है और पादटिप्पणी में रखा गया है।
- source_word: τῶν πεπιστευκότων
  choice: विश्वास करनेवालों
  rationale: पूर्णकालिक कृदन्त का परिणामस्वरूप बनी हुई विश्वासी अवस्था हिन्दी में स्वाभाविक रीति से व्यक्त होती है।
- source_word: ζηλωταὶ τοῦ νόμου ὑπάρχουσιν
  choice: वे सब व्यवस्था के लिए बड़े उत्साही हैं
  rationale: ζηλωταί की तीव्र प्रतिबद्धता ‘बड़े उत्साही’ से और νόμος का मूसा की व्यवस्था वाला संदर्भ ‘व्यवस्था’ से व्यक्त होता है।
theological_decisions:
- issue: ἐν τοῖς Ἰουδαίοις का संदर्भ
  choice: यहूदियों में
  alternative: यहूदिया के लोगों में
  rationale: सन्दर्भ में विश्वास करनेवाले यहूदियों और मूसा की व्यवस्था के प्रति उनके उत्साह पर बल है, इसलिए जातीय-धार्मिक अर्थ मुख्य पाठ में अधिक उपयुक्त है; सम्भव भौगोलिक अर्थ को दबाया नहीं गया।
- issue: μυριάδες का संख्यात्मक बल
  choice: कितनी ही हज़ारों की संख्या
  alternative: कितने ही दसियों हज़ार
  rationale: μυριάδες ठीक दस हज़ार की इकाइयाँ अथवा सामान्यतः बहुत बड़ी संख्या सूचित कर सकता है। मुख्य पाठ व्यापक अर्थ बनाए रखता है और अधिक निश्चित विकल्प पादटिप्पणी में देता है।
- issue: τοῦ νόμου का संदर्भ
  choice: व्यवस्था
  alternative: तोरा
  rationale: यह मूसा की व्यवस्था को सूचित करता है। प्रचलित हिन्दी बाइबलीय शब्द ‘व्यवस्था’ अर्थ को स्पष्ट रखता है और अनावश्यक लिप्यन्तरण से बचता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘परमेश्वर की महिमा की’ और ‘व्यवस्था’ जैसे परिचित बाइबलीय पद रखे गए हैं। दोनों पादटिप्पणी-चिह्न सम्बद्ध वाक्यांशों के तुरन्त बाद मुख्य पाठ में दिए गए हैं।
