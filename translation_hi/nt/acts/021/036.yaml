base_translation:
  language: en
  yaml_path: translation/nt/acts/021/036.yaml
  text: For the crowd of the people was following[a], shouting, “Take him away!”
translation:
  language: hi
  text: क्योंकि लोगों की भीड़ उसके पीछे चली आ रही थी और चिल्ला रही थी, “इसे हटा दो!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसे दूर करो!”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: पीछे चली आ रही थी
  rationale: अपूर्ण भूतकाल बीते समय में जारी क्रिया को व्यक्त करता है; यह वाक्यांश उस निरंतर पीछे आने की क्रिया को स्वाभाविक हिन्दी में रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करने वाले संयोजक को स्पष्ट रूप से दर्शाता है।
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: लोगों की भीड़
  rationale: यह πλῆθος की सामूहिकता और τοῦ λαοῦ के तटस्थ अर्थ, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है; 'उपद्रवी भीड़' जैसी अतिरिक्त नकारात्मक छाया नहीं जोड़ता।
- source_word: κράζοντες
  choice: चिल्ला रही थी
  rationale: यह साथ-साथ चल रही जोरदार पुकार को स्वाभाविक ढंग से व्यक्त करता है; क्रिया का स्त्रीलिंग एकवचन रूप हिन्दी में 'भीड़' के साथ सामंजस्य रखता है।
- source_word: Αἶρε αὐτόν
  choice: इसे हटा दो!
  rationale: इस प्रसंग में αἴρω का आदेश केवल उठाने का नहीं, बल्कि व्यक्ति को रास्ते से हटाने या समाप्त कर देने की शत्रुतापूर्ण माँग है। 'हटा दो' इस तीव्रता को बनाए रखते हुए मूल की अर्थगत व्यापकता भी बचाता है।
theological_decisions:
- issue: Αἶρε αὐτόν में हटाने और मार डालने के संकेत के बीच अर्थगत तनाव
  choice: इसे हटा दो!
  alternative: इसे मार डालो! / इसे ले जाओ!
  rationale: मूल आदेश प्रसंग में मृत्यु की माँग का संकेत दे सकता है, पर क्रिया स्वयं सीधे 'मार डालो' नहीं कहती। इसलिए मुख्य पाठ में अपेक्षाकृत व्यापक अभिव्यक्ति रखी गई और विकल्प पादटिप्पणी में दिया गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और कथात्मक है। 'लोगों की भीड़' तटस्थ सामूहिक अर्थ रखता है, जबकि उद्धृत आदेश की शत्रुता 'हटा दो' और पादटिप्पणी के अधिक तीव्र विकल्प से सामने आती है।
