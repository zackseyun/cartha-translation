  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य को हिन्दी में स्वाभाविक बनाने के लिए कृदन्तीय संरचना को क्रमिक क्रियाओं में बदला गया है। ‘भीड़’ सन्दर्भगत कर्ता को स्पष्ट करता है, जबकि मुख्य अर्थ और घटनाक्रम सुरक्षित हैं।
