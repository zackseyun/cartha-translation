source:
  edition: SBLGNT
  text: ὃς ἐξαυτῆς παραλαβὼν στρατιώτας καὶ ἑκατοντάρχας κατέδραμεν ἐπ’ αὐτούς, οἱ δὲ ἰδόντες τὸν χιλίαρχον καὶ τοὺς στρατιώτας ἐπαύσαντο τύπτοντες τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/032.yaml
  text: He immediately took soldiers and centurions and ran down to them[a], and when they saw the tribune and the soldiers, they stopped beating Paul.
translation:
  language: hi
  text: वह तुरन्त सैनिकों और शताध्यक्षों को साथ लेकर उनके पास दौड़कर नीचे आया। पर जब भीड़ ने सेनानायक[a] और सैनिकों को देखा, तो उसने पौलुस को पीटना बन्द कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सैन्य ट्रिब्यून’ अथवा ‘कोहोर्ट का कमांडर’; यूनानी χιλίαρχος रोमी सैन्य अधिकारी के लिए प्रयुक्त पद है, जो सामान्यतः एक कोहोर्ट की कमान संभालता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: तुरन्त
  rationale: यह क्रियाविशेषण तत्काल कार्रवाई का भाव देता है; ‘तुरन्त’ सहज और वर्तमान मानक हिन्दी है।
- source_word: παραλαβὼν
  choice: साथ लिया
  rationale: कृदन्त बताता है कि अधिकारी सैनिकों और सूबेदारों को अपने साथ लेकर गया; ‘साथ लिया’ इस आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: στρατιώτας
  choice: सैनिकों
  rationale: यह सामान्य रूप से व्यक्तिगत रोमी सैनिकों को दर्शाता है; ‘सैनिक’ सटीक और सहज है।
- source_word: ἑκατοντάρχας
  choice: सूबेदारों
  rationale: यह रोमी शताध्यक्षों का पद है। हिन्दी बाइबल-परम्परा में ‘सूबेदार’ जाना-पहचाना और पठनीय पदनाम है, यद्यपि यह पूर्ण ऐतिहासिक समानार्थी नहीं है।
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: दौड़कर भीड़ के पास नीचे पहुँचा
  rationale: क्रिया तीव्र गति और सन्दर्भतः किले से नीचे आने, दोनों को व्यक्त करती है। पूर्ववर्ती सन्दर्भ से समूह भीड़ है; ‘पास’ ἐπί को अनावश्यक शत्रुता दिए बिना लक्ष्य की ओर गति दिखाता है।
- source_word: χιλίαρχον
  choice: सेनापति
  rationale: यह रोमी सैन्य अधिकारी, सामान्यतः एक कोहोर्ट के कमांडर, का पद है। ‘सेनापति’ सामान्य पाठक के लिए सहज है; ऐतिहासिक पद की अधिक सटीक जानकारी पादटिप्पणी में दी गई है।
- source_word: ἐπαύσαντο
  choice: बन्द कर दिया
  rationale: मध्यवाच्य रूप चल रही क्रिया को रोक देने का अर्थ देता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τύπτοντες
  choice: पीटना
  rationale: वर्तमान कृदन्त लगातार या बार-बार प्रहार करने की हिंसक क्रिया दर्शाता है; ‘पीटना’ इसे ‘मारना’ की सम्भावित घातक अस्पष्टता के बिना व्यक्त करता है।
