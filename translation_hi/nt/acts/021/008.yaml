  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: hi
  text: अगले दिन हम निकलकर कैसरिया आए। हम सुसमाचार-प्रचारक फ़िलिप्पुस के घर में गए और उसके यहाँ ठहरे। फ़िलिप्पुस उन सात जनों में से एक था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उन सात जनों में से एक, जिन्हें पहले यरूशलेम में सेवा के लिए नियुक्त किया गया था (देखें प्रेरितों 6:3–6)।
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: अगले दिन
  rationale: यह स्वाभाविक हिन्दी में कथा के अगले दिन की ओर बढ़ने को स्पष्ट करता है; δέ को अलग से अनूदित करना आवश्यक नहीं है।
- source_word: ἐξελθόντες
  choice: हम वहाँ से निकलकर
  rationale: कृदन्त यात्रा के पिछले स्थान से प्रस्थान को दर्शाता है। ‘वहाँ से’ हिन्दी में संदर्भगत गति को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ἤλθομεν εἰς Καισάρειαν
  choice: हम कैसरिया आए
  rationale: मुख्य क्रिया गन्तव्य तक पहुँचने को बताती है। ‘आए’ यूनानी ἤλθομεν के निकट और यात्रा-वर्णन में सहज है।
- source_word: Καισάρειαν
  choice: कैसरिया
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है; मूल पाठ समुद्रतटीय कैसरिया जैसा विस्तार नहीं करता।
- source_word: εἰσελθόντες εἰς τὸν οἶκον
  choice: उसके घर गए
  rationale: शाब्दिक ‘घर में प्रवेश करके’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और घर के भीतर जाने की क्रिया को पर्याप्त रूप से व्यक्त करता है।
- source_word: Φιλίππου
  choice: फ़िलिप्पुस
  rationale: यूनानी नाम Φίλιππος का स्रोत-निकट देवनागरी लिप्यंतरण है।
- source_word: τοῦ εὐαγγελιστοῦ
  choice: सुसमाचार-प्रचारक
  rationale: यह εὐαγγελιστής के कार्य और पद-सदृश वर्णन को साधारण पाठक के लिए स्पष्ट रखता है, बिना किसी बाद की कलीसियाई पद-व्यवस्था को आरोपित किए।
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: वह उन सात जनों में से एक था
  rationale: यह फ़िलिप्पुस की पहचान पहले उल्लिखित सात जनों में से एक के रूप में बनाए रखता है। अलग वाक्य हिन्दी में संबंध को अस्पष्ट होने से बचाता है।
- source_word: ἐμείναμεν παρ’ αὐτῷ
  choice: उसके यहाँ ठहरे
  rationale: आतिथ्य और यात्रा के संदर्भ में μένω तथा παρά के संयुक्त अर्थ के लिए यह सबसे सहज आधुनिक हिन्दी अभिव्यक्ति है।
theological_decisions:
- issue: फ़िलिप्पुस की पहचान ‘सात जनों में से एक’ के रूप में
  choice: ऐतिहासिक संकेत को ‘उन सात जनों में से एक’ के रूप में रखा गया है और पादटिप्पणी में प्रेरितों 6:3–6 से जोड़ा गया है।
  alternative: ‘सात सेवकों में से एक’ या किसी तकनीकी कलीसियाई पदनाम का प्रयोग करना
  rationale: मूल पद केवल ‘सात’ कहता है। किसी विशिष्ट बाद के पदनाम को जोड़ना पाठ से आगे जाकर कलीसियाई संरचना का निष्कर्ष आरोपित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। यूनानी वाक्य को स्पष्टता के लिए तीन छोटे वाक्यों में विभाजित किया गया है; घटनाक्रम और ऐतिहासिक पहचान अपरिवर्तित हैं।
