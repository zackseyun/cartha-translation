    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: तो अब क्या किया जाए?
  rationale: शाब्दिक अर्थ ‘तो क्या है?’ है, पर प्रसंग में यह स्थिति को देखते हुए अगले कदम के विषय में व्यावहारिक प्रश्न है। चुना हुआ रूप आधुनिक हिन्दी में इस आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πάντως
  choice: निश्चय ही
  rationale: यहाँ क्रियाविशेषण आगे होने वाली बात की निश्चितता पर बल देता है।
- source_word: ἀκούσονται
  choice: वे ... सुनेंगे
  rationale: भविष्यत् रूप यहाँ सक्रिय अर्थ में है। बहुवचन कर्ता यूनानी में निहित है और प्रसंग से समुदाय के लोगों की ओर संकेत करता है।
- source_word: ὅτι
  choice: कि
  rationale: यह सुनी जाने वाली बात की विषयवस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: ἐλήλυθας
  choice: तुम आ गए हो
  rationale: पूर्णकाल पौलुस के आने और अब उपस्थित होने के परिणाम को व्यक्त करता है; ‘आ गए हो’ हिन्दी में इस पक्ष को स्वाभाविक रूप से बनाए रखता है।
