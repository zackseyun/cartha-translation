base_translation:
  language: en
  yaml_path: translation/nt/acts/021/018.yaml
  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: hi
  text: अगले दिन[a] पौलुस हमारे साथ याकूब के पास गया, और सभी प्राचीन उपस्थित थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके अगले दिन।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘सभी प्राचीन आ पहुँचे थे।’ यूनानी क्रिया आगमन या उपस्थिति, दोनों पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: अगले दिन
  rationale: यह दत्तिव कृदन्तीय पदबंध अगले अथवा उसके बाद आने वाले दिन को सूचित करने वाला मुहावरा है। ‘अगले दिन’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: εἰσῄει
  choice: गया
  rationale: क्रिया भीतर जाने या प्रवेश करने की गति व्यक्त करती है। हिन्दी में किसी व्यक्ति के पास जाने के संदर्भ में ‘गया’ स्वाभाविक है; ‘भीतर गया’ ऐसा स्थान-संबंधी विवरण जोड़ सकता है जो यहाँ स्पष्ट नहीं है।
- source_word: σὺν ἡμῖν
  choice: हमारे साथ
  rationale: σύν तथा दत्तिव संगति या साथ होने का सीधा अर्थ देते हैं।
- source_word: πρὸς Ἰάκωβον
  choice: याकूब के पास
  rationale: πρός तथा कर्मकारक किसी व्यक्ति की ओर गति को दर्शाते हैं। हिन्दी में ‘याकूब के पास’ इसी भाव को बिना अतिरिक्त व्याख्या के स्वाभाविक रूप से व्यक्त करता है।
- source_word: πάντες τε
  choice: और सभी
  rationale: τέ यहाँ हल्के संयोजक बल से अगली बात को जोड़ता है; साधारण ‘और’ हिन्दी में पर्याप्त और सहज है।
- source_word: παρεγένοντο
  choice: वहाँ उपस्थित थे
  rationale: παραγίνομαι का अर्थ ‘आ पहुँचना’ या ‘उपस्थित होना’ हो सकता है। संदर्भ में सभा में उनकी उपस्थिति प्रमुख लगती है; ‘वहाँ’ हिन्दी वाक्य को स्पष्ट और स्वाभाविक बनाता है। वैकल्पिक आगमनार्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: οἱ πρεσβύτεροι
  choice: प्राचीन
  rationale: प्रेरितों के काम में यह शब्द कलीसिया के मान्य अगुओं के लिए प्रयुक्त है। ‘प्राचीन’ प्रचलित बाइबलीय पद है और किसी बाद की विशिष्ट सांप्रदायिक पद-व्यवस्था को आरोपित नहीं करता।
theological_decisions:
- issue: Ἰάκωβον की पहचान और भूमिका
  choice: केवल व्यक्तिगत नाम ‘याकूब’
  alternative: ‘प्रभु का भाई याकूब’ अथवा ‘यरूशलेम की कलीसिया का अगुआ याकूब’
  rationale: इस पद में व्यक्ति का नाम बिना किसी परिचयात्मक उपाधि के दिया गया है। संदर्भ पहचान में सहायता करता है, पर मुख्य पाठ में परिचय जोड़ना मूल से अधिक कहना होगा।
- issue: οἱ πρεσβύτεροι का कलीसियाई अर्थ
  choice: ‘प्राचीन’
  alternative: ‘पुरोहित’, ‘प्रेस्बिटर’ अथवा सामान्यीकृत ‘कलीसिया के अगुए’
  rationale: यह पद यरूशलेम की कलीसिया के मान्य नेतृत्व को सूचित करता है, पर किसी बाद की सांप्रदायिक शासन-पद्धति को निश्चित नहीं करता। ‘प्राचीन’ lexical अर्थ और धर्मवैज्ञानिक तटस्थता दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सरल किंतु गरिमापूर्ण रखी गई है। ‘याकूब’ और ‘प्राचीन’ हिन्दी बाइबल-परंपरा में परिचित रूप हैं। παρεγένοντο की आगमन और उपस्थिति संबंधी अर्थ-सीमा को मुख्य पाठ में ‘उपस्थित थे’ से व्यक्त किया गया है।
