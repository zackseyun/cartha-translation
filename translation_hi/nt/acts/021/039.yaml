language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: hi
  text: पर पौलुस ने कहा,[a] “मैं तो यहूदी हूँ—किलिकिया के तरसुस का नागरिक, और वह कोई मामूली नगर नहीं है। मैं आपसे विनती करता हूँ, मुझे लोगों से बोलने की अनुमति दीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं यहूदी हूँ, किलिकिया का तरसुसवासी हूँ और ऐसे नगर का नागरिक हूँ जो कोई मामूली नगर नहीं है।”
    reason: मूल यूनानी में ἄνθρωπος, Ταρσεύς और πολίτης की पद-रचना को अधिक निकटता से प्रतिबिंबित करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ἄνθρωπος ... Ἰουδαῖος
  choice: मैं तो यहूदी हूँ
  rationale: हिन्दी में ‘मैं एक यहूदी मनुष्य हूँ’ अस्वाभाविक है। ‘मैं तो यहूदी हूँ’ पुरुषवाचक वक्ता की पहचान को स्वाभाविक ढंग से व्यक्त करता है और μέν का बल भी बनाए रखता है।
- source_word: Ταρσεὺς τῆς Κιλικίας ... πολίτης
  choice: किलिकिया के तरसुस का नागरिक
  rationale: यह तरसुस से पौलुस का नागरिक संबंध स्पष्ट करता है और नगर तथा प्रांत, दोनों को सुरक्षित रखता है।
- source_word: οὐκ ἀσήμου πόλεως
  choice: वह कोई मामूली नगर नहीं है
  rationale: मूल यूनानी की नकारात्मक अलंकारिक अभिव्यक्ति को सहज आधुनिक हिन्दी में बनाए रखता है, उसे केवल ‘महत्त्वपूर्ण नगर’ में समतल नहीं करता।
- source_word: δέομαι δέ σου
  choice: मैं आपसे विनती करता हूँ
  rationale: सैन्य अधिकारी से की गई आग्रहपूर्ण और सम्मानसूचक प्रार्थना का बल व्यक्त करता है।
- source_word: ἐπίτρεψόν μοι λαλῆσαι
  choice: मुझे ... बोलने की अनुमति दीजिए
  rationale: औपचारिक अनुमति माँगने के भाव और सार्वजनिक रूप से बोलने के प्रसंग को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρὸς τὸν λαόν
  choice: लोगों से
  rationale: πρός के संबोधन-संबंधी भाव को हिन्दी में स्वाभाविक रूप से व्यक्त करता है; ‘भीड़’ की अपेक्षा λαός के व्यापक सामुदायिक अर्थ को सुरक्षित रखता है।
- source_word: μέν
  choice: तो
  rationale: पौलुस के आत्म-परिचय पर हल्का बल देता है और हिन्दी संवाद में ‘निश्चय ही’ से अधिक स्वाभाविक लगता है।
theological_decisions:
- issue: संदर्भ में Ἰουδαῖος का अर्थ
  choice: यहूदी
  alternative: यहूदिया का निवासी
  rationale: पौलुस अपनी जातीय-धार्मिक पहचान बता रहा है और उसके बाद अपने भौगोलिक तथा नागरिक मूल के रूप में किलिकिया के तरसुस को अलग से नाम देता है; इसलिए ‘यहूदी’ उपयुक्त है।
translation_notes:
  register: आधुनिक, सम्मानपूर्ण और सार्वजनिक संवाद के अनुकूल हिन्दी। ‘आपसे’ और ‘दीजिए’ अधिकारी के प्रति शिष्टता रखते हैं; ‘कोई मामूली नगर नहीं’ मूल की वक्रोक्ति को सहज रूप में सुरक्षित रखता है।
