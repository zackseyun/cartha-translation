  text: τούτῳ δὲ ἦσαν θυγατέρες ⸂τέσσαρες παρθένοι⸃ προφητεύουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/009.yaml
  text: He had four unmarried daughters who were prophesying.
translation:
  language: hi
  text: उसकी चार कुँवारी बेटियाँ थीं, जो भविष्यवाणी करती थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτῳ
  choice: उसकी
  rationale: यह संकेतवाचक सर्वनाम निकटवर्ती संदर्भ में फिलिप्पुस की ओर संकेत करता है; दत्तिवाचक अस्तित्व-सूचक रचना को हिंदी में स्वाभाविक अधिकार-संबंध के रूप में व्यक्त किया गया है।
- source_word: δὲ
  choice: —
  rationale: यहाँ यह हल्का संयोजक है; हिंदी वाक्य-प्रवाह में इसका अलग अनुवाद आवश्यक नहीं है।
- source_word: ἦσαν
  choice: थीं
  rationale: τούτῳ ... ἦσαν की रचना को 'उसकी ... थीं' के रूप में व्यक्त करना आधुनिक हिंदी में स्वाभाविक है।
- source_word: θυγατέρες
  choice: बेटियाँ
  rationale: पारिवारिक संबंध का सामान्य, सटीक और सहज हिंदी शब्द।
- source_word: τέσσαρες
  choice: चार
  rationale: यह बेटियों की संख्या बताने वाला मूल संख्या-वाचक शब्द है।
- source_word: παρθένοι
  choice: कुँवारी
  rationale: यह शब्द उनके विवाह और यौन स्थिति—दोनों से जुड़ा अर्थ रख सकता है। 'कुँवारी' आधुनिक हिंदी में 'अविवाहित' की अपेक्षा मूल के 'virgin' अर्थ को अधिक सीधे बनाए रखता है, बिना पद में बताए गए से अधिक धर्मवैचारिक निष्कर्ष निकाले।
- source_word: προφητεύουσαι
  choice: जो भविष्यवाणी करती थीं
  rationale: वर्तमान सक्रिय कृदंत बेटियों की जारी अथवा पहचानी जाने वाली गतिविधि बताता है; यह हिंदी संबंधवाचक उपवाक्य उस गुणात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: παρθένοι का अनुवाद और भविष्यवाणी करने वाली स्त्रियों का वर्णन
  choice: कुँवारी
  alternative: अविवाहित
  rationale: पद उनकी कुँवारी स्थिति और भविष्यवाणी की गतिविधि दोनों बताता है, पर दोनों के बीच कोई धर्मवैचारिक संबंध स्पष्ट नहीं करता। 'कुँवारी' मूल शब्द को सीधे दर्शाता है और पाठ में निहित तनाव को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सहज, संक्षिप्त और गरिमापूर्ण कथात्मक शैली। 'भविष्यवाणी करती थीं' को केवल भविष्य बताने तक सीमित न समझकर यूनानी προφητεύω की व्यापक भविष्यद्वक्तात्मक वाणी के लिए रखा गया है।
