source:
  edition: SBLGNT
  text: ὅτε δὲ ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας, ἐξελθόντες ἐπορευόμεθα προπεμπόντων ἡμᾶς πάντων σὺν γυναιξὶ καὶ τέκνοις ἕως ἔξω τῆς πόλεως, καὶ θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλὸν ⸀προσευξάμενοι
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/005.yaml
  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: hi
  text: जब हमारे वहाँ रहने के दिन पूरे हो गए, तो हम निकलकर अपनी यात्रा पर चल पड़े। वे सब, अपनी पत्नियों और बच्चों सहित, हमें विदा करने हमारे साथ नगर के बाहर तक आए[a]। फिर समुद्र-तट[b] पर घुटने टेककर हमने प्रार्थना की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वे सब हमें नगर के बाहर तक पहुँचाने आए।’ यूनानी क्रिया प्रस्थान के समय किसी के साथ जाकर उसे विदा करने या पहुँचाने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘किनारे’ अथवा ‘समुद्र के किनारे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας
  choice: जब हमारे वहाँ रहने के दिन पूरे हो गए
  rationale: यूनानी पदबंध ठहरने की अवधि समाप्त होने और प्रस्थान का समय आ जाने को दर्शाता है। स्वाभाविक हिन्दी के लिए ‘वहाँ रहने’ को संदर्भानुसार स्पष्ट किया गया है, जबकि ‘दिन पूरे हो गए’ अवधि की पूर्णता बनाए रखता है।
- source_word: ἐξελθόντες ἐπορευόμεθα
  choice: हम निकलकर अपनी यात्रा पर चल पड़े
  rationale: ‘निकलकर’ प्रस्थान को और ‘यात्रा पर चल पड़े’ उसके बाद आगे बढ़ने को व्यक्त करता है; इस प्रकार कृदंत और अपूर्णकालीन मुख्य क्रिया, दोनों का भाव बना रहता है।
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: वे सब ... हमें ... छोड़ने आए
  rationale: προπέμπω यहाँ प्रस्थान के समय किसी के साथ जाकर उसे विदा करने का भाव रखता है। ‘छोड़ने आए’ आधुनिक हिन्दी में इस दृश्य को स्वाभाविक रूप से व्यक्त करता है; साथ चलकर विदा करने का विकल्प पादटिप्पणी में रखा गया है।
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: अपनी पत्नियों और बच्चों सहित
  rationale: πάντων के पुल्लिंग बहुवचन और पूरे परिवारों के विदाई में सम्मिलित होने के प्रसंग में γυναιξὶ का अर्थ ‘पत्नियाँ’ सबसे स्वाभाविक है। ‘अपनी’ हिन्दी में संबंध को स्पष्ट और सहज बनाता है।
- source_word: ἕως ἔξω τῆς πόλεως
  choice: नगर के बाहर तक
  rationale: यह नगर की सीमा से बाहर के बिंदु तक साथ जाने की दिशात्मक सीमा को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θέντες τὰ γόνατα
  choice: घुटने टेककर
  rationale: शाब्दिक रूप से ‘घुटने रखकर’ कहने के बजाय हिन्दी का प्रचलित मुहावरा उस शारीरिक मुद्रा को ठीक प्रकार व्यक्त करता है।
- source_word: ἐπὶ τὸν αἰγιαλὸν
  choice: समुद्र-तट पर
  rationale: αἰγιαλός समुद्र के किनारे या रेतीले तट को दर्शाता है। ‘समुद्र-तट’ गरिमापूर्ण, स्पष्ट और पर्याप्त व्यापक हिन्दी पद है।
- source_word: προσευξάμενοι
  choice: हमने प्रार्थना की
  rationale: बहुवचन कृदंत को हिन्दी में स्वाभाविक कथात्मक क्रम के लिए पूर्ण क्रिया बनाया गया है। प्रथम पुरुष ‘हमने’ लूका के यात्रा-वृत्तांत का दृष्टिकोण बनाए रखता है।
