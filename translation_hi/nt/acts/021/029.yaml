  text: ἦσαν γὰρ ⸀προεωρακότες Τρόφιμον τὸν Ἐφέσιον ἐν τῇ πόλει σὺν αὐτῷ, ὃν ἐνόμιζον ὅτι εἰς τὸ ἱερὸν εἰσήγαγεν ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: hi
  text: क्योंकि उन्होंने पहले इफिसुस के निवासी त्रुफिमुस को नगर में पौलुस के साथ देखा था, और वे मान बैठे थे कि पौलुस उसे मंदिर[a] में ले गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मंदिर’ के लिए प्रयुक्त यूनानी शब्द पूरे मंदिर-परिसर या उसके प्रांगणों को भी दर्शा सकता है, केवल भीतरी पवित्रस्थान को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν ... προεωρακότες
  choice: इससे पहले ... देखा था
  rationale: यह परिभाषात्मक पूर्णभूतकाल उस घटना से पहले देखे जाने को व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: इफिसुसवासी त्रुफिमुस
  rationale: विशेषण Ἐφέσιον त्रुफिमुस का मूल स्थान बताता है; ‘इफिसुसवासी’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐν τῇ πόλει
  choice: नगर में
  rationale: यह यरूशलेम के नगरीय क्षेत्र को मन्दिर-परिसर से अलग संदर्भित करता है।
- source_word: σὺν αὐτῷ
  choice: पौलुस के साथ
  rationale: यूनानी सर्वनाम का संदर्भ प्रसंग में पौलुस है; हिन्दी में नाम दोहराने से अस्पष्टता दूर होती है।
- source_word: ἐνόμιζον
  choice: समझा था
  rationale: यह उपलब्ध जानकारी के आधार पर निकाले गए अनुमान को व्यक्त करता है, निश्चित ज्ञान को नहीं।
- source_word: εἰς τὸ ἱερὸν
  choice: मन्दिर में
  rationale: ἱερόν पूरे मन्दिर-परिसर या उसके प्रांगणों को सूचित कर सकता है; मुख्य पाठ में प्रचलित ‘मन्दिर’ रखा गया है और व्यापक अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: εἰσήγαγεν
  choice: ले गया है
  rationale: क्रिया किसी को भीतर ले जाने का बोध देती है; ‘समझा था कि ... ले गया है’ हिन्दी में उस समय से पूर्व मानी गई घटना को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: आरोप में ἱερόν का क्षेत्रगत अर्थ
  choice: मुख्य पाठ में ‘मन्दिर’, पाद-टिप्पणी में मन्दिर-परिसर या प्रांगणों की सम्भावना
  alternative: ‘मन्दिर-परिसर’ अथवा ‘मन्दिर के प्रांगणों में’
  rationale: ἱερόν विशेष रूप से केवल भीतरी पवित्रस्थान (ναός) नहीं, बल्कि व्यापक मन्दिर-परिसर को भी दर्शाता है। पठनीयता बनाए रखते हुए ऐतिहासिक सूक्ष्मता पाद-टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘पौलुस’ को दोहराकर सर्वनाम की सम्भावित अस्पष्टता हटाई गई है; अनुमान का भाव ‘समझा था’ से सुरक्षित है।
