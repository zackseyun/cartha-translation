source:
  edition: SBLGNT
  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: hi
  text: परन्तु उन्हें तुम्हारे विषय में यह बताया गया है कि तुम गैर-यहूदियों के बीच रहने वाले सभी यहूदियों को मूसा को त्यागना[a][b] सिखाते हो और उनसे कहते हो कि वे अपने बच्चों का खतना न कराएँ और न ही रीति-रिवाजों के अनुसार चलें।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम मूसा से विमुख होना सिखाते हो।” यूनानी में ἀποστασία संज्ञा है, जिसका अर्थ त्याग या विमुखता हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मूसा” से आशय मूसा की व्यवस्था और पैतृक यहूदी प्रथाओं से है।
    reason: cultural_note
  - marker: c
    text: या, “न ही रीति-रिवाजों के अनुसार जीवन बिताएँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηχήθησαν
  choice: उन्हें ... यह बताया गया है
  rationale: यहाँ कर्मवाच्य क्रिया उस मौखिक सूचना या रिपोर्ट को व्यक्त करती है जो लोगों को पौलुस के विषय में मिली थी। पूर्ण वर्तमान अर्थ वर्तमान स्थिति पर उस रिपोर्ट के प्रभाव को बनाए रखता है।
- source_word: ἀποστασίαν ... ἀπὸ Μωϋσέως
  choice: मूसा को त्यागना
  rationale: ἀποστασία त्याग या विमुखता को दर्शाता है। अमूर्त पद 'मूसा से धर्मत्याग' की अपेक्षा यह स्वाभाविक हिन्दी में आरोप की तीव्रता व्यक्त करता है और 'मूसा' को मूल पाठ की तरह बनाए रखता है।
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: गैर-यहूदियों के बीच रहने वाले सभी यहूदियों को
  rationale: यह पद विभिन्न राष्ट्रों में गैर-यहूदियों के बीच बसे यहूदियों को सूचित करता है। 'रहने वाले' हिन्दी में संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: λέγων
  choice: उनसे कहते हो
  rationale: यह कृदन्त आरोपित शिक्षा की विषय-वस्तु बताता है और स्वाभाविक हिन्दी में पहले उल्लिखित यहूदियों से जुड़ता है।
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: वे अपने बच्चों का खतना न कराएँ
  rationale: वाक्य का आशय यह है कि यहूदी अपने बच्चों का खतना न करवाएँ। 'बच्चों' से मूल के τέκνα की व्यापक शब्दावली सुरक्षित रहती है, जबकि 'कराएँ' संस्कार करवाने के सामान्य हिन्दी प्रयोग के अनुरूप है।
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: न ही रीति-रिवाजों के अनुसार चलें
  rationale: περιπατεῖν जीवन-आचरण का रूपक है। 'अनुसार चलें' उस रूपक को हिन्दी में बोधगम्य रखते हुए ἔθεσιν को पैतृक यहूदी रीति-रिवाजों के रूप में व्यक्त करता है।
theological_decisions:
- issue: मूसा के विषय में पौलुस पर लगाए गए आरोप का स्वरूप
  choice: आरोप को 'मूसा को त्यागना सिखाते हो' के रूप में प्रस्तुत किया गया है, बिना उसे सत्य मानने या मूसा की व्यवस्था के विषय में कोई अतिरिक्त सैद्धान्तिक निष्कर्ष जोड़ने के।
  alternative: '''मूसा से धर्मत्याग करना सिखाते हो'' अथवा ''मूसा की व्यवस्था को छोड़ना सिखाते हो''।'
  rationale: पद पौलुस के बारे में फैली सूचना को उद्धृत करता है; यह लेखक की ओर से उस आरोप की पुष्टि नहीं है। अनुवाद आरोप की तीव्रता और पाठ की धर्मवैचारिक कसावट दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। 'गैर-यहूदी', 'खतना' और 'रीति-रिवाज' सामान्य पाठक के लिए स्पष्ट हैं। 'अनुसार चलें' मूल के जीवन-आचरण वाले रूपक को बनाए रखता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में सम्मिलित हैं।
