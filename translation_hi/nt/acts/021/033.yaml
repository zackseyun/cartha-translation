  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘सेनापति’ सामान्य पाठक के लिए बोधगम्य है, जबकि रोमी पद की तकनीकी जानकारी पाद-टिप्पणी में रखी गई है। मुख्य पाठ में मूल के क्रम और चल रही पूछताछ का भाव स्वाभाविक हिन्दी के अनुसार सुरक्षित रखा गया है।
