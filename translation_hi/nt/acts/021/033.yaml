  text: ⸂τότε ἐγγίσας⸃ ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσε δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο ⸀τίς εἴη καὶ τί ἐστιν πεποιηκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: hi
  text: तब सेनापति पास आया,[a] पौलुस को पकड़ लिया और आदेश दिया कि उसे दो ज़ंजीरों से बाँधा जाए।[b] वह पूछ रहा था कि वह कौन है और उसने क्या किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक अर्थ ‘हज़ार सैनिकों का प्रधान’ है; यहाँ यह रोमी सेना के एक उच्च अधिकारी का पद था।
    reason: lexical_alternative
  - marker: b
    text: ‘दो ज़ंजीरें’ प्रेरितों के काम 21:11 में यरूशलेम में पौलुस के बाँधे जाने की भविष्यवाणी की ओर संकेत कर सकती हैं।
    reason: cross_reference
lexical_decisions:
- source_word: χιλίαρχος
  choice: सेनापति
  rationale: यह रोमी सेना के एक उच्च अधिकारी को दर्शाता है, जो सामान्यतः एक दल का अधिपति था। ‘सेनापति’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है; पद का अधिक विशिष्ट विवरण पाद-टिप्पणी में दिया गया है।
- source_word: ἐγγίσας
  choice: पास आया
  rationale: अओरिस्ट कृदंत मुख्य कार्रवाई से पहले अधिकारी के निकट आने को व्यक्त करता है।
- source_word: ἐπελάβετο αὐτοῦ
  choice: उसे पकड़ लिया
  rationale: यहाँ क्रिया पौलुस को शारीरिक रूप से अधिकार में लेने या पकड़ने का भाव देती है।
- source_word: ἐκέλευσε δεθῆναι
  choice: आदेश दिया कि उसे ... बाँधा जाए
  rationale: यह अधिकारपूर्ण आदेश और δεθῆναι के कर्मवाच्य भाव, दोनों को सुरक्षित रखता है।
- source_word: ἁλύσεσι δυσί
  choice: दो ज़ंजीरों से
  rationale: हिरासत के प्रसंग में ἅλυσις का सीधा अर्थ ‘ज़ंजीर’ है; द्विवचन संख्या को स्पष्ट रखा गया है।
- source_word: ἐπυνθάνετο
  choice: पूछने लगा
  rationale: अपूर्ण भूतकाल चल रही पूछताछ को दिखाता है; हिन्दी कथा में ‘पूछने लगा’ इसका स्वाभाविक निरूपण है।
- source_word: τίς εἴη
  choice: यह कौन है
  rationale: भूतकालीन कथन के बाद परोक्ष प्रश्न को स्वाभाविक हिन्दी में प्रस्तुत किया गया है; मूल का प्रश्नवाचक आशय बना रहता है।
- source_word: τί ἐστιν πεποιηκώς
  choice: इसने क्या किया है
  rationale: परिप्रयुक्त पूर्णकाल पूरी हुई किंतु वर्तमान में प्रासंगिक कार्रवाई का बोध देता है; ‘क्या किया है’ इस पक्ष को ‘क्या किया था’ से अधिक स्पष्ट रूप से सुरक्षित रखता है।
