  text: Ἡμεῖς δὲ τὸν πλοῦν διανύσαντες ἀπὸ Τύρου κατηντήσαμεν εἰς Πτολεμαΐδα, καὶ ἀσπασάμενοι τοὺς ἀδελφοὺς ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: hi
  text: हम सूर से समुद्री यात्रा पूरी करके पतुलिमयिस पहुँचे, और भाइयों[a] का अभिवादन करके उनके यहाँ एक दिन ठहरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘भाइयों’; यह पुल्लिंग बहुवचन व्यापक अर्थ में साथी विश्वासियों को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: हमने
  rationale: स्पष्ट सर्वनाम यात्रा-वृत्तांत के कर्ता पर बल देता है; δέ का हल्का संक्रमण हिन्दी वाक्य-प्रवाह में स्वाभाविक रूप से समाहित है।
- source_word: τὸν πλοῦν διανύσαντες
  choice: समुद्री यात्रा पूरी करके
  rationale: πλοῦς समुद्री यात्रा और διανύω उसे पूरा करने को व्यक्त करता है; कृदन्त की पूर्वकालिक क्रिया हिन्दी में ‘करके’ से स्वाभाविक है।
- source_word: ἀπὸ Τύρου
  choice: सूर से
  rationale: ἀπό प्रस्थान-बिंदु बताता है; Τύρος का प्रचलित हिन्दी बाइबलीय रूप ‘सूर’ है।
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: पतुलिमयिस पहुँचे
  rationale: यात्रा-संदर्भ में καταντάω गंतव्य पर पहुँचने का अर्थ देता है; Πτολεμαΐς के लिए ‘पतुलिमयिस’ पारंपरिक और पहचानने योग्य हिन्दी रूप है।
- source_word: ἀσπασάμενοι
  choice: भेंट करके
  rationale: ἀσπάζομαι अभिवादन करने या स्नेहपूर्वक मिलने को दर्शाता है; यहाँ ‘भेंट करके’ आधुनिक हिन्दी में मुलाकात और अभिवादन दोनों का स्वाभाविक भाव देता है।
- source_word: τοὺς ἀδελφοὺς
  choice: भाई-बहनों
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन ‘भाइयों’ है, पर आरम्भिक मसीही समुदाय में यह व्यापक रूप से सहविश्वासियों को, सम्भवतः स्त्रियों सहित, सूचित कर सकता है; इस अर्थ को मुख्य पाठ में स्वाभाविक हिन्दी से व्यक्त किया गया है और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς
  choice: उनके साथ एक दिन ठहरे
  rationale: μένω ठहरने, accusative ἡμέραν μίαν अवधि, और παρά के साथ dative संगति/सान्निध्य को व्यक्त करता है।
theological_decisions:
- issue: मसीही समुदाय के संदर्भ में ἀδελφοὺς का अनुवाद
  choice: भाई-बहनों
  alternative: भाइयों / सहविश्वासियों
  rationale: मूल का पुल्लिंग बहुवचन रूप सुरक्षित रूप से पादटिप्पणी में बताया गया है, जबकि प्रसंग में शब्द पूरे स्थानीय विश्वासी समुदाय को सूचित कर सकता है। ‘भाई-बहनों’ इस सम्भावित समावेश को स्पष्ट करता है, बिना यह दावा किए कि पाठ ने स्त्रियों का अलग उल्लेख किया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल और गरिमापूर्ण यात्रा-वृत्तांत शैली। स्थान-नामों के लिए प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
