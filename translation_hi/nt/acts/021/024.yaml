id: ACT.21.24
reference: Acts 21:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: hi
  text: इन पुरुषों को अपने साथ ले जाओ, उनके साथ अपने को शुद्ध करो और उनका खर्च उठाओ, ताकि वे अपने सिर मुँड़वा सकें। तब सब जान लेंगे कि तुम्हारे विषय में उन्हें जो बातें बताई गई हैं[a], उनमें कोई सच्चाई नहीं है, बल्कि तुम स्वयं भी व्यवस्था का पालन करते हुए उसके अनुसार चलते हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे विषय में उन्हें जो शिक्षा दी गई है।” यूनानी क्रिया का अर्थ “शिक्षा देना” या सामान्य रूप से “सूचना देना” हो सकता है; यहाँ यह पौलुस के विषय में फैली बातों को सूचित करती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पंक्ति में चलते हो”; अर्थात व्यवस्था का पालन करते हुए उसके अनुरूप जीवन बिताते हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: इन पुरुषों को अपने साथ ले जाओ
  rationale: संदर्भ में τούτους पिछले पद के चार पुरुषों की ओर संकेत करता है। παραλαμβάνω साथ लेने का भाव देता है; सहभागी रूप को हिन्दी में स्वाभाविक आज्ञा के रूप में व्यक्त किया गया है।
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: उनके साथ अपने को शुद्ध करो
  rationale: यह धार्मिक रीति से शुद्ध होने की क्रिया है। मध्यम/कर्मवाच्य आज्ञार्थक का आत्मवाचक भाव ‘अपने को शुद्ध करो’ से स्पष्ट होता है।
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: उनका खर्च उठाओ
  rationale: वाक्यांश का अर्थ उन पुरुषों की ओर से, सम्भवतः उनकी मन्नत से जुड़े, खर्च का भुगतान करना है। ‘खर्च उठाओ’ सहज और सटीक हिन्दी है।
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: ताकि वे अपने सिर मुँड़वा सकें
  rationale: ἵνα के बाद भविष्यकालीन रूप यहाँ उद्देश्य अथवा अपेक्षित परिणाम बताता है। यूनानी में एकवचन ‘सिर’ वितरणात्मक है; हिन्दी में ‘अपने सिर’ प्रत्येक व्यक्ति पर लागू होता है।
- source_word: γνώσονται πάντες
  choice: तब सब जान लेंगे
  rationale: भविष्यकाल और पिछले निर्देश के फलस्वरूप होने वाले ज्ञान, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: तुम्हारे विषय में उन्हें जो बातें बताई गई हैं
  rationale: κατηχέω का अर्थ शिक्षा देना या सूचना देना हो सकता है। यहाँ पौलुस के विषय में फैली बातों का प्रसंग है, इसलिए मुख्य पाठ में तटस्थ ‘बताई गई हैं’ चुना गया है और व्यापक अर्थ-पहलू पादटिप्पणी में रखा गया है।
- source_word: οὐδέν ἐστιν
  choice: उनमें कोई सच्चाई नहीं है
  rationale: इस मुहावरे का आशय है कि सुनी हुई बातों का कोई वास्तविक आधार नहीं। हिन्दी में यह अभिव्यक्ति स्वाभाविक है, पर दावों की विषय-वस्तु को विस्तार से निर्धारित नहीं करती।
- source_word: ἀλλὰ στοιχεῖς
  choice: बल्कि ... उसके अनुसार चलते हो
  rationale: στοιχέω का मूल भाव पंक्ति में चलना और लाक्षणिक अर्थ किसी मानक के अनुरूप आचरण करना है। ‘उसके अनुसार चलते हो’ मूल रूपक को कुछ हद तक रखते हुए अर्थ स्पष्ट करता है।
- source_word: καὶ αὐτὸς
  choice: तुम स्वयं भी
  rationale: αὐτός का बल और καί का समावेशी भाव, दोनों सुरक्षित रखे गए हैं।
- source_word: φυλάσσων τὸν νόμον
  choice: व्यवस्था का पालन करते हुए
  rationale: φυλάσσω यहाँ व्यवस्था को मानने या पालन करने का अर्थ देता है। सहभागी रूप को जारी आचरण के रूप में रखा गया है।
- source_word: νόμον
  choice: व्यवस्था
  rationale: संदर्भ में यह यहूदी व्यवस्था की ओर संकेत करता है। ‘मूसा की व्यवस्था’ जोड़ना सम्भव है, पर वह मूल से अधिक स्पष्ट व्याख्या होती; इसलिए पारंपरिक और संदर्भ-संगत ‘व्यवस्था’ रखा गया है।
theological_decisions:
- issue: इस वृत्तांत में व्यवस्था के साथ पौलुस के सम्बन्ध की प्रकृति
  choice: 'कथन को पौलुस के दिखाई देने वाले आचरण के रूप में अनूदित किया गया है: ‘तुम स्वयं भी व्यवस्था का पालन करते हुए उसके अनुसार चलते हो।’'
  alternative: ‘तुम स्वयं भी व्यवस्था को मानते हो’ अथवा ‘तुम भी नियमपूर्वक चलते और व्यवस्था का पालन करते हो।’
  rationale: पद बताता है कि शुद्धिकरण में भाग लेने और खर्च उठाने से लोग क्या जानेंगे। अनुवाद इस स्थानीय कथात्मक दावे को रखता है और पौलुस की व्यवस्था-संबंधी व्यापक धर्मवैचारिक स्थिति का समाधान इसमें आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। धार्मिक शुद्धिकरण के लिए ‘अपने को शुद्ध करो’ और νόμος के लिए ‘व्यवस्था’ रखा गया है। वाक्य की आज्ञात्मक गति और निष्कर्षसूचक ‘तब’ सुरक्षित हैं।
