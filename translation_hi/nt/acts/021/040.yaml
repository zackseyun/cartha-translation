  text: ἐπιτρέψαντος δὲ αὐτοῦ ὁ Παῦλος ἑστὼς ἐπὶ τῶν ἀναβαθμῶν κατέσεισε τῇ χειρὶ τῷ λαῷ, πολλῆς δὲ σιγῆς γενομένης ⸀προσεφώνησεν τῇ Ἑβραΐδι διαλέκτῳ λέγων
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: hi
  text: 'जब उसने अनुमति दे दी, तब पौलुस सीढ़ियों पर खड़ा होकर लोगों की ओर हाथ से संकेत किया। जब गहरा सन्नाटा छा गया, तो उसने इब्रानी भाषा[a] में उन्हें संबोधित करते हुए कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, ‘अरामी भाषा में।’ यूनानी पाठ में ‘इब्रानी बोली/भाषा में’ है, जो इस प्रसंग में अरामी कहलाने वाली स्थानीय सामी भाषा की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: जब उसने अनुमति दे दी
  rationale: यह सम्बन्धवाचक निरपेक्ष रचना पिछले प्रसंग के सेनापति की ओर संकेत करती है। हिन्दी में यह समय और अनुमति—दोनों भाव स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: सीढ़ियों पर खड़े होकर
  rationale: पूर्ण कृदन्त यहाँ पौलुस की स्थिति बताता है; ἀναβαθμοί के लिए ‘सीढ़ियाँ’ सहज और प्रसंगानुकूल है।
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: लोगों को हाथ से संकेत किया
  rationale: क्रिया सार्वजनिक रूप से बोलने या शान्त कराने के लिए हाथ का संकेत करने को दर्शाती है। यह अनावश्यक रूप से संकेत का उद्देश्य निश्चित नहीं करती।
- source_word: τῷ λαῷ
  choice: लोगों को
  rationale: λαός का सीधा और स्वाभाविक हिन्दी प्रतिरूप ‘लोग’ है; प्रसंग में यही एकत्र जनसमूह है।
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: जब पूरी तरह शान्ति छा गई
  rationale: यह पर्याप्त या गहरी निस्तब्धता के उत्पन्न होने का भाव देता है। ‘शान्ति छा गई’ आधुनिक हिन्दी में स्वाभाविक घटना-वाचक अभिव्यक्ति है।
- source_word: προσεφώνησεν
  choice: उन्हें सम्बोधित करते हुए
  rationale: क्रिया किसी जनसमूह को सार्वजनिक रूप से सम्बोधित करने के अर्थ में है। λέγων के साथ हिन्दी में संयुक्त रूप वाक्य को सहज बनाता है।
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: इब्रानी भाषा
  rationale: मुख्य पाठ यूनानी अभिव्यक्ति का प्रत्यक्ष अर्थ सुरक्षित रखता है; इस प्रसंग में अरामी सम्भव होने की बात पादटिप्पणी में दी गई है।
- source_word: λέγων
  choice: 'कहने लगा:'
  rationale: यह अगले पद में आने वाले प्रत्यक्ष भाषण का परिचय देता है; ‘कहने लगा:’ हिन्दी में निरन्तर कथन के आरम्भ को स्वाभाविक रूप से दर्शाता है।
theological_decisions:
- issue: τῇ Ἑβραΐδι διαλέκτῳ से अभिप्रेत भाषा
  choice: मुख्य पाठ में ‘इब्रानी भाषा’
  alternative: ‘अरामी भाषा’
  rationale: यूनानी पाठ स्पष्टतः ‘इब्रानी’ कहता है, जबकि ऐतिहासिक-भाषायी प्रसंग में अरामी सम्भव है। वास्तविक अस्पष्टता को मुख्य पाठ और पादटिप्पणी के द्वारा सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। ‘इब्रानी’ स्रोत-पाठ की शब्दावली को बनाए रखता है और भाषायी अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
