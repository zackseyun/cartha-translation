  yaml_path: translation/nt/acts/021/031.yaml
  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: hi
  text: जब वे पौलुस को मार डालने की कोशिश कर रहे थे, तब पलटन के सेनापति[a] तक यह खबर पहुँची कि सारे यरूशलेम में खलबली मची हुई है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पलटन का सेनापति’ वहाँ तैनात रोमी सैन्य दल का कमांडर था।
    reason: cultural_note
  - marker: b
    text: या ‘सारा यरूशलेम उलझन में पड़ा हुआ है’ अथवा ‘सारे यरूशलेम में उथल-पुथल मची हुई है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητούντων τε αὐτὸν ἀποκτεῖναι
  choice: जब वे पौलुस को मार डालने की कोशिश कर रहे थे
  rationale: वर्तमान कृदंत जारी और मुख्य क्रिया के साथ-साथ चल रही कार्रवाई दिखाता है। हिन्दी में अस्पष्ट सर्वनाम से बचने के लिए प्रसंगानुसार ‘पौलुस’ रखा गया है; ‘मार डालने’ से ἀποκτεῖναι का सीधा अर्थ व्यक्त होता है।
- source_word: ἀνέβη φάσις
  choice: यह खबर पहुँची
  rationale: यूनानी मुहावरे में खबर के ‘ऊपर जाने’ की छवि है, संभवतः दुर्ग की ओर; स्वाभाविक आधुनिक हिन्दी में ‘खबर पहुँची’ वही आशय स्पष्ट रूप से व्यक्त करता है।
- source_word: τῷ χιλιάρχῳ τῆς σπείρης
  choice: पलटन के सेनापति
  rationale: χιλίαρχος रोमी सैन्य अधिकारी और σπεῖρα एक कोहोर्ट को सूचित करते हैं। ‘पलटन के सेनापति’ सामान्य पाठक के लिए सुबोध है, जबकि पद और सैन्य इकाई दोनों का संबंध बनाए रखता है।
- source_word: ὅτι ὅλη Ἰερουσαλήμ
  choice: कि सारे यरूशलेम में
  rationale: ‘सारा यरूशलेम’ नगर और उसके निवासियों के लिए संक्षिप्त लक्षणा है; ‘में’ जोड़ने से हिन्दी वाक्य स्वाभाविक बनता है।
- source_word: συγχύννεται
  choice: खलबली मची हुई है
  rationale: वर्तमान कर्मवाच्य नगर में जारी अव्यवस्था, भ्रम या उथल-पुथल की दशा बताता है। ‘खलबली’ भीड़ के उपद्रव और व्यापक हलचल दोनों को स्वाभाविक हिन्दी में व्यक्त करती है।
