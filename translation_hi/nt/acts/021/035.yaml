lexical_decisions:
- source_word: ὅτε δὲ
  choice: जब
  rationale: ὅτε कालवाचक उपवाक्य आरम्भ करता है; हल्के संयोजक δέ को स्वाभाविक हिन्दी में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: वह सीढ़ियों पर पहुँचा
  rationale: γίνομαι के साथ ἐπί और कर्मकारक यहाँ किसी स्थान पर पहुँचने का भाव देते हैं।
- source_word: ἀναβαθμούς
  choice: सीढ़ियों
  rationale: यह शब्द ऊपर जाने वाली सीढ़ियों अथवा सोपानों को दर्शाता है; प्रसंग में रोमी छावनी की ओर जाने वाली सीढ़ियाँ अभिप्रेत हैं।
- source_word: συνέβη
  choice: तो ऐसा हुआ कि
  rationale: यह अनुवाद लूका की घटनावर्णन शैली को बनाए रखते हुए आगे आई परिणामी परिस्थिति का परिचय देता है।
- source_word: βαστάζεσθαι
  choice: उसे उठाकर ले जा रहे थे
  rationale: वर्तमानकालिक कर्मवाच्य अनन्तरूप चल रही क्रिया का संकेत देता है। हिन्दी में सक्रिय वाक्यरचना अधिक स्वाभाविक है, जबकि ‘उसे’ से पौलुस पर हुई क्रिया स्पष्ट रहती है।
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: सैनिक उसे
  rationale: यह कर्मवाच्य क्रिया के कर्ता सैनिकों को दर्शाता है; स्वाभाविक हिन्दी में उन्हें सक्रिय कर्ता बनाया गया है।
- source_word: διὰ τὴν βίαν τοῦ ὄχλου
  choice: भीड़ की हिंसा के कारण
  rationale: διά के साथ कर्मकारक कारण बताता है; βία इस दंगाई प्रसंग में बलप्रयोग या हिंसा का अर्थ रखता है, और ὄχλος के लिए ‘भीड़’ तटस्थ तथा सटीक है।
