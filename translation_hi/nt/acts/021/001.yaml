  text: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς ἀποσπασθέντας ἀπ’ αὐτῶν, εὐθυδρομήσαντες ἤλθομεν εἰς τὴν ⸀Κῶ, τῇ δὲ ἑξῆς εἰς τὴν Ῥόδον, κἀκεῖθεν εἰς Πάταρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: hi
  text: जब हम बड़ी कठिनाई से उनसे अलग होकर समुद्र के लिए रवाना हुए, तो सीधा समुद्री मार्ग लेते हुए कूस पहुँचे; अगले दिन रोदुस, और वहाँ से पतरा पहुँचे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: जब
  rationale: यह यूनानी कथात्मक मुहावरा अगली घटना का समय बताता है; ‘जब’ हिन्दी में स्वाभाविक रूप से मुख्य क्रिया से जुड़ता है।
- source_word: ἀναχθῆναι
  choice: समुद्र में जहाज़ खुलवाया
  rationale: नौपरिवहन के संदर्भ में क्रिया का अर्थ तट से जहाज़ लेकर समुद्र में निकलना है; यह हिन्दी प्रयोग यात्रा के आरम्भ को स्पष्ट करता है।
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: उनसे बड़ी कठिनाई से विदा होकर
  rationale: ἀποσπάω में स्वयं को खींचकर अलग करने का प्रबल भाव है। शाब्दिक ‘अपने आप को फाड़कर’ अस्वाभाविक होता; यह चयन भावनात्मक रूप से कठिन बिछोह को सहज हिन्दी में बनाए रखता है।
- source_word: εὐθυδρομήσαντες
  choice: सीधा मार्ग लेकर
  rationale: यह नौपरिवहन-संबंधी क्रिया सीधे मार्ग पर चलने को व्यक्त करती है; संदर्भ से जहाज़ द्वारा यात्रा स्पष्ट है।
- source_word: ἤλθομεν εἰς
  choice: पहुँचे
  rationale: यात्रा-वृत्तांत में यह गंतव्य पर आगमन को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Κῶ
  choice: कोस
  rationale: यूनानी Κῶ का निकट देवनागरी लिप्यंतरण।
- source_word: τῇ δὲ ἑξῆς
  choice: अगले दिन
  rationale: समय-सूचक दत्तिव का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: Ῥόδον
  choice: रोदुस
  rationale: यूनानी Ῥόδον के नामरूप Ῥόδος का स्रोत-निकट देवनागरी लिप्यंतरण।
- source_word: κἀκεῖθεν
  choice: और वहाँ से
  rationale: καί और ἐκεῖθεν दोनों के संयोजक तथा स्थान-सूचक अर्थ को सुरक्षित रखता है।
- source_word: Πάταρα
  choice: पतरा
  rationale: यूनानी स्थाननाम का प्रचलित हिन्दी बाइबलीय रूप।
