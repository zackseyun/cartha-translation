id: ACT.21.14
reference: Acts 21:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: hi
  text: जब वह मानने को तैयार न हुआ, तो हम यह कहकर शांत हो गए[a], “प्रभु की इच्छा पूरी हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हम चुप हो गए।”
    reason: ἡσυχάσαμεν शांत हो जाने, चुप हो जाने, अथवा आग्रह करना बंद कर देने का भाव दे सकता है।
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: जब वह मानने को तैयार न हुआ
  rationale: यह जननात्मक निरपेक्ष रचना उस परिस्थिति को व्यक्त करती है जिसमें पौलुस उनकी विनती से सहमत नहीं हुआ। ‘मानने को तैयार न हुआ’ प्रसंग में πείθω के मध्य/कर्मवाच्य भाव और उसके न मानने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡσυχάσαμεν
  choice: हम ... शांत हो गए
  rationale: यहाँ क्रिया का अर्थ आग्रह करना छोड़कर शांत हो जाना है। ‘शांत हो गए’ आरम्भसूचक अओरिस्ट भाव को बनाए रखता है और केवल बोलना बंद करने से कुछ व्यापक अर्थ देता है।
- source_word: εἰπόντες
  choice: यह कहकर
  rationale: अओरिस्ट कृदन्त को मुख्य क्रिया से जोड़ने के लिए ‘यह कहकर’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: Τοῦ κυρίου
  choice: प्रभु की
  rationale: κύριος के लिए ‘प्रभु’ सामान्य, गरिमापूर्ण अनुवाद है। यूनानी की तरह अनुवाद भी संदर्भित व्यक्ति को और अधिक स्पष्ट नहीं करता।
- source_word: τὸ θέλημα
  choice: इच्छा
  rationale: θέλημα यहाँ प्रभु की इच्छा अथवा संकल्प को दर्शाता है; ‘इच्छा’ इस प्रार्थनापूर्ण कथन में प्रचलित और उपयुक्त है।
- source_word: γινέσθω
  choice: पूरी हो
  rationale: γίνομαι का आज्ञार्थक रूप यहाँ प्रभु की इच्छा के घटित या संपन्न होने के प्रति समर्पण व्यक्त करता है। ‘पूरी हो’ हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: κύριος का अनुवाद और उसका संदर्भ
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ κύριος का सामान्य बाइबलीय हिन्दी रूप है। प्रसंग में यह संभवतः प्रभु यीशु की ओर संकेत करता है, पर यूनानी पाठ केवल ‘प्रभु’ कहता है; इसलिए अनुवाद संदर्भ को स्पष्ट करके किसी धर्मवैज्ञानिक तनाव को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज वाक्य रखा गया है। ‘मानने को तैयार न हुआ’ और ‘शांत हो गए’ मूल के भाव को बिना अनावश्यक व्याख्या के व्यक्त करते हैं।
