  text: τοῦτο οὖν ποίησον ὅ σοι λέγομεν· εἰσὶν ἡμῖν ἄνδρες τέσσαρες εὐχὴν ἔχοντες ⸀ἀφ’ ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: hi
  text: 'इसलिए जो हम तुमसे कहते हैं, वह करो: हमारे यहाँ चार आदमी हैं, जिन्होंने मन्नत मानी हुई है[a][b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मन्नत के अधीन हैं।” यूनानी में शाब्दिक रूप से, “अपने ऊपर मन्नत रखते हुए” है।
    reason: lexical_alternative
  - marker: b
    text: व्यापक प्रसंग नाज़ीर-जैसी मन्नत का संकेत दे सकता है, पर यह पद केवल “मन्नत” कहता है।
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν
  choice: इसलिए ... वह
  rationale: οὖν पिछले कथन से निष्कर्षसूचक संबंध दिखाता है; τοῦτο को अगले संबंधवाचक उपवाक्य के साथ स्वाभाविक हिन्दी में ‘जो...वह’ द्वारा व्यक्त किया गया है।
- source_word: ποίησον
  choice: करो
  rationale: ποιέω के आज्ञार्थक रूप का सीधा, स्वाभाविक और प्रसंगानुकूल अनुवाद।
- source_word: ὅ σοι λέγομεν
  choice: जो हम तुमसे कहते हैं
  rationale: संबंधवाचक रचना और वर्तमान काल को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: εἰσὶν ἡμῖν
  choice: हमारे यहाँ ... हैं
  rationale: अस्तित्वसूचक क्रिया और सम्प्रदान कारक का यह हिन्दी मुहावरा ‘हमारे पास/हमारे बीच’ के भाव को स्वाभाविक ढंग से व्यक्त करता है, बिना स्वामित्व का अनुचित संकेत दिए।
- source_word: ἄνδρες τέσσαρες
  choice: चार पुरुष
  rationale: ἀνήρ यहाँ वयस्क पुरुषों को सूचित करता है; ‘पुरुष’ गरिमापूर्ण और लिंग-सटीक है।
- source_word: εὐχὴν ἔχοντες
  choice: एक मन्नत ले रखी है
  rationale: शाब्दिक ‘मन्नत रखते हुए’ की अपेक्षा यह जारी बंधन/स्थिति को स्वाभाविक हिन्दी में बताता है।
- source_word: ἀφ’ ἑαυτῶν
  choice: अपने ऊपर
  rationale: प्रतिवाचक पदबंध को निकटता से सुरक्षित रखता है और बताता है कि मन्नत उन्हीं पर लागू है।
theological_decisions:
- issue: मन्नत का स्वरूप
  choice: मुख्य पाठ में केवल ‘मन्नत’
  alternative: ‘नाज़ीर की मन्नत’
  rationale: व्यापक प्रसंग नाज़ीर-जैसी मन्नत की ओर संकेत कर सकता है, पर इस पद में εὐχή केवल सामान्य रूप से ‘मन्नत’ कहता है; इसलिए विशिष्ट प्रकार आरोपित नहीं किया गया।
- issue: εὐχὴν ἔχοντες की क्रियात्मक बारीकी
  choice: ‘मन्नत ले रखी है’
  alternative: ‘मन्नत के अधीन हैं’
  rationale: चुना हुआ रूप स्वाभाविक हिन्दी में मन्नत लेने और उसकी जारी स्थिति दोनों को व्यक्त करता है; पद यह स्पष्ट नहीं करता कि मन्नत कब या किन विधियों से ली गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। ‘मन्नत’ सामान्य पाठक के लिए परिचित है। ‘अपने ऊपर ... ले रखी है’ मूल के प्रतिवाचक भाव और मन्नत की जारी बाध्यता को सहज रूप में व्यक्त करता है।
