reference: Acts 21:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂ἀνευρόντες δὲ τοὺς⸃ μαθητὰς ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά, οἵτινες τῷ Παύλῳ ἔλεγον διὰ τοῦ πνεύματος μὴ ⸀ἐπιβαίνειν εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: hi
  text: चेलों को ढूँढ़ लेने के बाद हम वहाँ सात दिन ठहरे। वे आत्मा के द्वारा[a] पौलुस से बार-बार कहते रहे कि वह यरूशलेम न जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ऐसा भी समझा जा सकता है कि आत्मा ने पौलुस पर आने वाले कष्टों को प्रकट किया था, और चेलों ने उससे यह निष्कर्ष निकाला कि उसे यरूशलेम नहीं जाना चाहिए।
    reason: यह पादटिप्पणी ‘आत्मा के द्वारा’ पदबंध और निषेध के संबंध में व्याख्यात्मक अस्पष्टता को सुरक्षित रखती है; यह किसी एक व्याख्या को निर्णायक नहीं बनाती।
lexical_decisions:
- source_word: ἀνευρόντες
  choice: ढूँढ़ लेने के बाद
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले पूरी हुई क्रिया को दिखाता है। यह अभिव्यक्ति स्वाभाविक हिन्दी में उस क्रम को बनाए रखती है।
- source_word: μαθητάς
  choice: चेलों
  rationale: प्रेरितों के काम में μαθητής के लिए यह प्रचलित और सामान्य हिन्दी शब्द है; यह केवल ‘विश्वासियों’ की अपेक्षा मूल शब्द के शिष्यत्व-संबंधी अर्थ को बेहतर बनाए रखता है।
- source_word: ἐπεμείναμεν αὐτοῦ
  choice: हम वहाँ ... ठहरे
  rationale: ἐπιμένω का अर्थ यहाँ ठहरना है और αὐτοῦ स्थानवाचक रूप में ‘वहाँ’ है।
- source_word: ἡμέρας ἑπτά
  choice: सात दिन
  rationale: यह समयावधि बताने वाला कर्मकारक है; हिन्दी में ‘सात दिन ठहरे’ स्वाभाविक और स्पष्ट है।
- source_word: οἵτινες
  choice: वे
  rationale: यह पहले आए ‘चेलों’ की ओर संकेत करता है। नया वाक्य ‘वे’ से आरम्भ करना आधुनिक हिन्दी में सहज है।
- source_word: ἔλεγον
  choice: बार-बार कहते रहे
  rationale: अपूर्ण भूतकाल निरंतर या दोहराई गई क्रिया का संकेत देता है; यह अनुवाद उस पक्ष को स्पष्ट करता है।
- source_word: διὰ τοῦ πνεύματος
  choice: आत्मा के द्वारा
  rationale: διά के साथ संबंधकारक साधन या माध्यम बताता है। मूल में ‘पवित्र’ विशेषण नहीं है, इसलिए केवल ‘आत्मा’ रखा गया है, जो प्रसंग में पवित्र आत्मा को सूचित करता है।
- source_word: μὴ ἐπιβαίνειν
  choice: न जाए
  rationale: यरूशलेम को गंतव्य बताने वाले इस यात्रा-प्रसंग में ἐπιβαίνω का स्वाभाविक अर्थ वहाँ जाना है। हिन्दी में ‘ऊपर न जाए’ भौगोलिक दिशा पर अनावश्यक बल देता, इसलिए सरल ‘न जाए’ चुना गया।
- source_word: εἰς Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: εἰς यहाँ गंतव्य दर्शाता है; ‘यरूशलेम न जाए’ हिन्दी में स्वाभाविक रूप से ‘यरूशलेम को/की ओर’ का भाव व्यक्त करता है।
theological_decisions:
- issue: आत्मा के द्वारा कही गई बात और पौलुस की यरूशलेम-यात्रा के बीच संबंध
  choice: आत्मा के द्वारा ... कहते रहे कि वह यरूशलेम न जाए
  alternative: आत्मा ने आने वाले कष्ट प्रकट किए, जिनसे चेलों ने स्वयं यह निष्कर्ष निकाला कि पौलुस को नहीं जाना चाहिए
  rationale: यूनानी वाक्य व्याकरण की दृष्टि से निषेध को ‘आत्मा के द्वारा’ कही गई बात के रूप में प्रस्तुत करता है, पर प्रेरितों के काम 19:21 और 20:22-23 के साथ इसका संबंध व्याख्यात्मक तनाव उत्पन्न करता है। मुख्य पाठ मूल कथन को सीधे रखता है और पादटिप्पणी संभावित व्याख्या बताती है, बिना तनाव को निर्णायक रूप से सुलझाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चेलों’, ‘ठहरे’ और ‘आत्मा के द्वारा’ जैसे परिचित बाइबलीय शब्दों का प्रयोग किया गया है, जबकि अनावश्यक रूप से पुरातन या सांप्रदायिक शब्दावली से बचा गया है।
