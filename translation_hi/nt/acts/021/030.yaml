source:
  edition: SBLGNT
  text: ἐκινήθη τε ἡ πόλις ὅλη καὶ ἐγένετο συνδρομὴ τοῦ λαοῦ, καὶ ἐπιλαβόμενοι τοῦ Παύλου εἷλκον αὐτὸν ἔξω τοῦ ἱεροῦ, καὶ εὐθέως ἐκλείσθησαν αἱ θύραι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: hi
  text: और सारे नगर में हलचल मच गई, और लोग दौड़कर इकट्ठे हो गए। उन्होंने पौलुस को पकड़ लिया और उसे घसीटते हुए मन्दिर-परिसर के बाहर ले गए; और तुरन्त द्वार बन्द कर दिए गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκινήθη ... ἡ πόλις ὅλη
  choice: सारे नगर में हलचल मच गई
  rationale: यहाँ κινέω का कर्मवाच्य प्रयोग नगर में फैली सामूहिक उत्तेजना और अशान्ति को व्यक्त करता है; हिन्दी का यह मुहावरा भाव को स्वाभाविक रूप से पहुँचाता है।
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: लोग दौड़कर इकट्ठे हो गए
  rationale: συνδρομή में लोगों के अचानक एक साथ दौड़ आने का भाव है। यह अनुवाद केवल स्थिर ‘भीड़ बन गई’ की अपेक्षा उस गतिशील अभिसरण को अधिक स्पष्ट रखता है।
- source_word: ἐπιλαβόμενοι τοῦ Παύλου
  choice: उन्होंने पौलुस को पकड़ लिया
  rationale: ἐπιλαμβάνομαι यहाँ किसी व्यक्ति को बलपूर्वक पकड़ने का अर्थ देता है; ‘पकड़ लिया’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: εἷλκον
  choice: घसीटते हुए ... ले गए
  rationale: ἕλκω का अपूर्णकाल चलती हुई बलपूर्वक क्रिया को चित्रित करता है। संयुक्त हिन्दी अभिव्यक्ति दिशा और निरन्तरता दोनों को स्वाभाविक रूप से बताती है।
- source_word: ἔξω τοῦ ἱεροῦ
  choice: मन्दिर-परिसर के बाहर
  rationale: ἱερόν यहाँ केवल भीतरी पवित्रस्थान नहीं, पूरे मन्दिर-परिसर को सूचित करता है; मुख्य पाठ में ‘परिसर’ जोड़ने से यह ऐतिहासिक-सांस्कृतिक भेद स्पष्ट रहता है।
- source_word: εὐθέως
  choice: तुरन्त
  rationale: यह शीघ्रता सूचित करने वाले क्रियाविशेषण का संक्षिप्त और प्रचलित हिन्दी समतुल्य है।
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: द्वार बन्द कर दिए गए
  rationale: कर्मवाच्य रूप को सुरक्षित रखा गया है, जिससे यूनानी पाठ की तरह द्वार बन्द करने वालों की पहचान अनिर्दिष्ट रहती है। ‘द्वार’ मन्दिर के प्रवेश-द्वारों के लिए उपयुक्त है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मन्दिर-परिसर’ सांस्कृतिक सटीकता देता है और अलग पादटिप्पणी की आवश्यकता घटाता है; कर्मवाच्य अन्त मूल पाठ की अनिर्दिष्ट कर्तृता को बनाए रखता है।
