id: ACT.21.11
reference: Acts 21:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: hi
  text: वह हमारे पास आया और पौलुस का कमरबंद लेकर उसने अपने ही पाँव और हाथ बाँध लिए। फिर उसने कहा, “पवित्र आत्मा यों कहता है:[a] ‘जिस मनुष्य का यह कमरबंद है, उसे यरूशलेम में यहूदी इसी प्रकार बाँधेंगे और गैर-यहूदियों के हाथों में सौंप देंगे।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र आत्मा यह कहता है।”
    reason: alternative_reading
lexical_decisions:
- source_word: ζώνην
  choice: कमरबंद
  rationale: यह कमर पर बाँधे जाने वाले पटके या बेल्ट को दर्शाता है। ‘कमरबंद’ आधुनिक हिंदी में स्पष्ट है और उस वस्त्र-संदर्भ को बनाए रखता है।
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: उसने अपने ही पाँव और हाथ बाँध लिए
  rationale: निजवाचक ἑαυτοῦ बताता है कि अगबुस ने पौलुस को नहीं, स्वयं को बाँधा। ‘अपने ही’ इस बात को स्पष्ट करता है, और ‘बाँध’ भविष्यकालीन δήσουσιν के साथ शब्दगत संबंध बनाए रखता है।
- source_word: Τάδε λέγει
  choice: यों कहता है
  rationale: यह धर्मशास्त्रीय भविष्यवाणी की गंभीर उद्घोषणा-शैली को स्वाभाविक और संक्षिप्त हिंदी में बनाए रखता है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: यह आधुनिक हिंदी में प्रचलित और सीधे अर्थ देने वाला पद है।
- source_word: Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη
  choice: जिस मनुष्य का यह कमरबंद है
  rationale: यह संबंधवाचक यूनानी रचना को सहज हिंदी में रखता है और भविष्यवाणी की औपचारिक शैली भी बनाए रखता है।
- source_word: οὕτως
  choice: इसी प्रकार
  rationale: यह अगबुस द्वारा किए गए प्रतीकात्मक कार्य को आने वाली घटना से प्रत्यक्ष रूप से जोड़ता है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदी
  rationale: यूनानी पाठ सामान्य रूप से ‘यहूदियों’ का उल्लेख करता है; केवल अगुओं तक अर्थ सीमित करना पाठ में अनुपस्थित विशिष्टता जोड़ देता।
- source_word: παραδώσουσιν
  choice: सौंप देंगे
  rationale: यह विरोधी अधिकारियों के अधीन कर दिए जाने का स्वाभाविक आधुनिक हिंदी रूप है; इसमें ‘विश्वासघात’ का अनावश्यक अर्थ नहीं जोड़ा गया।
- source_word: εἰς χεῖρας ἐθνῶν
  choice: गैर-यहूदियों के हाथों में
  rationale: ‘हाथों में’ मूल मुहावरे और किसी के अधिकार में दिए जाने की धारणा को बनाए रखता है। इस संदर्भ में ἐθνῶν का आशय गैर-यहूदी लोगों से है।
theological_decisions:
- issue: पवित्र आत्मा की ओर से प्रत्यक्ष भविष्यवाणी का सूत्र
  choice: पवित्र आत्मा यों कहता है
  alternative: पवित्र आत्मा यह कहता है
  rationale: ‘यों कहता है’ मूल के भविष्यसूचक उद्घोषणा-सूत्र और उसके अधिकारपूर्ण स्वर को सुरक्षित रखता है, जबकि पादटिप्पणी सहज वैकल्पिक अभिव्यक्ति बताती है।
- issue: ἑαυτοῦ का संदर्भ
  choice: अगबुस ने अपने ही पाँव और हाथ बाँधे
  alternative: अगबुस ने पौलुस के पाँव और हाथ बाँधे
  rationale: निजवाचक सर्वनाम स्वाभाविक रूप से कृदंत के कर्ता अगबुस की ओर लौटता है; इसलिए यह स्वयं को बाँधकर किया गया प्रतीकात्मक भविष्यसूचक कार्य है।
- issue: οἱ Ἰουδαῖοι की व्याप्ति
  choice: यहूदी
  alternative: यहूदी अगुए
  rationale: मूल पाठ ‘अगुए’ नहीं कहता। व्यापक पद को बनाए रखना दोषारोपण की सीमा को व्याख्यात्मक रूप से न तो बढ़ाता है, न घटाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘कमरबंद’ ऐतिहासिक वस्त्र-संदर्भ को स्पष्ट करता है; ‘गैर-यहूदी’ पारंपरिक ‘अन्यजाति’ की अपेक्षा आज अधिक तुरंत समझ में आता है। छोटे वाक्य-विभाजन से लंबी यूनानी संरचना हिंदी में सहज बनी है, बिना घटनाक्रम बदले।
