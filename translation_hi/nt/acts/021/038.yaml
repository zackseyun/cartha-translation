source:
  edition: SBLGNT
  text: οὐκ ἄρα σὺ εἶ ὁ Αἰγύπτιος ὁ πρὸ τούτων τῶν ἡμερῶν ἀναστατώσας καὶ ἐξαγαγὼν εἰς τὴν ἔρημον τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: hi
  text: “तो क्या तुम वह मिस्री नहीं हो, जिसने कुछ दिन पहले विद्रोह भड़काया और उन चार हज़ार छुरेबाज़ों[a] को वीराने में ले गया था?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सिकारियों”; यूनानी में यह नाम ऐसे लोगों के लिए है जो छिपे हुए छोटे खंजर से हमला करने के लिए जाने जाते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: तो क्या ... नहीं हो
  rationale: यह प्रश्न के रूप में निकाले गए निष्कर्ष को व्यक्त करता है; आधुनिक हिन्दी में ‘तो क्या ... नहीं’ स्वाभाविक रूप से वही भाव देता है।
- source_word: ὁ Αἰγύπτιος
  choice: वह मिस्री
  rationale: लेख एक परिचित या कुख्यात व्यक्ति की ओर संकेत करता है; ‘वह मिस्री’ इस निश्चित संदर्भ को स्पष्ट रखता है।
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: कुछ दिन पहले
  rationale: यह मुहावरा वर्तमान समय से कुछ समय पहले की ओर संकेत करता है, बिना ठीक अवधि बताए।
- source_word: ἀναστατώσας
  choice: विद्रोह भड़काया
  rationale: राजनीतिक संदर्भ में क्रिया केवल अव्यवस्था नहीं, बल्कि उपद्रव या विद्रोह खड़ा करने का अर्थ देती है।
- source_word: ἐξαγαγὼν
  choice: ले गया
  rationale: यह लोगों को अपने साथ किसी स्थान से बाहर ले जाने का स्वाभाविक हिन्दी रूप है; गन्तव्य ‘वीराने में’ से दिशा स्पष्ट है।
- source_word: εἰς τὴν ἔρημον
  choice: वीराने में
  rationale: ἔρημος निर्जन क्षेत्र को सूचित करता है; ‘वीराना’ किसी विशेष रेतीले भूभाग का अनावश्यक संकेत दिए बिना अर्थ बताता है।
- source_word: τοὺς τετρακισχιλίους ἄνδρας
  choice: उन चार हज़ार ... को
  rationale: लेख इस निश्चित, पहले से पहचाने जाने वाले समूह को सूचित करता है; ‘उन’ उस विशिष्टता को बनाए रखता है।
- source_word: τῶν σικαρίων
  choice: छुरेबाज़ों
  rationale: यह नाम छिपे हुए छोटे खंजर से हत्या करने वाले समूह के लिए प्रयुक्त था। ‘छुरेबाज़’ अर्थ और ऐतिहासिक छवि को संक्षेप में व्यक्त करता है; वैकल्पिक ऐतिहासिक नाम पादटिप्पणी में दिया गया है।
