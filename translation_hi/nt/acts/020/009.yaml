source:
  edition: SBLGNT
  text: ⸀καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη νεκρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/009.yaml
  text: And a certain young man named Eutychus[a], sitting in the window, was sinking into a deep sleep while Paul was speaking at length; and being overcome by sleep, he fell down from the third story and was picked up dead.
translation:
  language: hi
  text: यूतुखुस नाम का एक युवक खिड़की में बैठा हुआ था। जब पौलुस देर तक बोल रहा था, तब वह गहरी नींद में डूबता जा रहा था। फिर नींद के वश में आकर वह तीसरी मंज़िल से नीचे गिर पड़ा, और उसे मरा हुआ उठाया गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे मरा हुआ उठाकर ले जाया गया।” यूनानी क्रिया का अर्थ “उठाया गया” या “ले जाया गया” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεζόμενος δέ τις νεανίας
  choice: एक युवक ... बैठा हुआ था
  rationale: वर्तमान कृदन्त युवक की चलती हुई अवस्था बताता है। τις की अनिश्चितता हिन्दी के स्वाभाविक ‘एक युवक’ में व्यक्त होती है; ‘कोई एक’ यहाँ अनावश्यक रूप से कृत्रिम होता।
- source_word: ὀνόματι Εὔτυχος
  choice: यूतुखुस नाम का
  rationale: नामसूचक दत्तिव का स्वाभाविक हिन्दी रूप; यूनानी नाम का निकट देवनागरी लिप्यंतरण रखा गया है।
- source_word: ἐπὶ τῆς θυρίδος
  choice: खिड़की में
  rationale: θυρίς खिड़की या उसके खुले स्थान को सूचित करता है। गिरने के प्रसंग में ‘खिड़की में’ उसकी स्थिति को बिना ‘चौखट’ जैसी अतिरिक्त विशिष्टता जोड़े व्यक्त करता है।
- source_word: καταφερόμενος ὕπνῳ βαθεῖ
  choice: गहरी नींद में डूबता गया
  rationale: यह क्रमशः नींद के वश में आने की प्रक्रिया को सजीव और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον
  choice: पौलुस बहुत देर तक बोलता रहा
  rationale: सम्बन्धवाचक स्वतंत्र रचना और ἐπὶ πλεῖον की दीर्घ अवधि दोनों स्पष्ट होती हैं। यहाँ διαλέγομαι का आशय लम्बा भाषण/विचार-विमर्श करना है; ‘बोलता रहा’ प्रसंग में सहज है।
- source_word: κατενεχθεὶς ἀπὸ τοῦ ὕπνου
  choice: नींद से पूरी तरह दब जाने पर
  rationale: पहले वर्णित क्रमिक उनींदेपन के बाद नींद के निर्णायक रूप से हावी हो जाने को दर्शाता है और उसी मूल क्रिया की पुनरावृत्ति का बल बनाए रखता है।
- source_word: ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω
  choice: तीसरी मंज़िल से नीचे गिर पड़ा
  rationale: τρίστεγον को आधुनिक पाठक के लिए स्पष्ट ‘तीसरी मंज़िल’ और κάτω को ‘नीचे’ से व्यक्त किया गया है।
- source_word: ἤρθη νεκρός
  choice: मरा हुआ उठाया गया
  rationale: निष्क्रिय ἤρθη का सीधा अर्थ ‘उठाया गया’ है और νεκρός को बिना नरम किए ‘मरा हुआ’ रखा गया है।
theological_decisions:
- issue: क्या νεκρός को ‘मरा हुआ’ के बजाय ‘मरा हुआ-सा’ या ‘मृत समझकर’ कहा जाए
  choice: मरा हुआ
  alternative: मरा हुआ-सा / मृत समझकर
  rationale: यूनानी पाठ मृत्यु को सीधे बताता है और उसमें अनिश्चितता का कोई संकेत नहीं है। आगे के वृत्तांत के कारण यहाँ कथन को नरम करना मूल पाठ की धार्मिक-आख्यानात्मक तनाव को समय से पहले सुलझा देगा।
- issue: ἤρθη में उठाने और ले जाने के बीच अर्थ-चयन
  choice: उठाया गया
  alternative: ले जाया गया
  rationale: αἴρω दोनों अर्थ ले सकता है, पर गिरने के तुरन्त बाद के दृश्य में ‘उठाया गया’ न्यूनतम और सीधा अर्थ है। ‘ले जाया गया’ स्थानांतरण को अधिक स्पष्ट कर देता है, जो इस पद में अनिवार्य नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य को तीन हिन्दी वाक्यों में बाँटा गया है ताकि यूनानी के लम्बे कृदन्तीय क्रम की घटनाएँ साधारण पाठक के लिए स्पष्ट रहें। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि αἴρω की सम्भावित अर्थ-छाया मुख्य पाठ में ‘उठाया गया’ से पर्याप्त रूप से संरक्षित है।
