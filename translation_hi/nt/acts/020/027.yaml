  text: οὐ γὰρ ὑπεστειλάμην τοῦ μὴ ἀναγγεῖλαι ⸂πᾶσαν τὴν βουλὴν τοῦ θεοῦ ὑμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/027.yaml
  text: For I did not shrink back from declaring to you the whole counsel of God[a].
translation:
  language: hi
  text: क्योंकि मैं तुम्हें परमेश्वर की पूरी मंशा[a] बताने से पीछे नहीं हटा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परमेश्वर का पूरा उद्देश्य,’ ‘परमेश्वर की पूरी योजना,’ अथवा ‘परमेश्वर की पूरी इच्छा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है; हिन्दी में ‘क्योंकि’ संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: ὑπεστειλάμην
  choice: पीछे नहीं हटा
  rationale: मध्यवाच्य रूप यहाँ किसी कार्य से डरकर या संकोचवश पीछे हटने का भाव देता है। यह रूपक को बनाए रखता है और प्रेरितों के काम 20:20 से प्रसंगगत संगति भी रखता है।
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: बताने से
  rationale: नकारात्मक अर्थ वाले मुख्य क्रिया-रूप के बाद यह पदबंध उस काम को बताता है जिससे पौलुस पीछे नहीं हटा। ‘बताने से’ साधारण आधुनिक हिन्दी में घोषणा करने और अवगत कराने, दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πᾶσαν
  choice: पूरी
  rationale: एकवचन βουλή के साथ यह संपूर्णता पर बल देता है।
- source_word: βουλήν
  choice: मंशा
  rationale: βουλή में विचार, उद्देश्य, योजना या इच्छा का व्यापक भाव हो सकता है। ‘मंशा’ आधुनिक हिन्दी में गरिमापूर्ण और सुबोध है तथा इसे केवल आदेश, इच्छा या पूर्वनिर्धारित योजना तक सीमित नहीं करती।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर की
  rationale: सम्बन्धकारक रूप बताता है कि यह मंशा परमेश्वर की है या उसी से निकलती है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: यह घोषणा के प्राप्तकर्ताओं—इफिसुस के अगुओं—को सीधा संबोधन है।
theological_decisions:
- issue: βουλή τοῦ θεοῦ का अर्थ
  choice: परमेश्वर की पूरी मंशा
  alternative: परमेश्वर का पूरा उद्देश्य / परमेश्वर की पूरी योजना / परमेश्वर की पूरी इच्छा
  rationale: यूनानी βουλή में उद्देश्य, योजना, इच्छा और परामर्शगत अभिप्राय की अर्थ-छायाएँ हैं। ‘मंशा’ इस व्यापकता को बनाए रखती है और किसी एक सिद्धान्तगत अर्थ को अनावश्यक रूप से निर्णायक नहीं बनाती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पीछे नहीं हटा’ मूल रूपक और निकटवर्ती पद 20:20 की पुनरावृत्ति को सुरक्षित रखता है।
