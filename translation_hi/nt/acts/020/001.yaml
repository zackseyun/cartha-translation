base_translation:
  language: en
  yaml_path: translation/nt/acts/020/001.yaml
  text: After the uproar had ceased[a], Paul sent for the disciples, and after encouraging them and saying farewell, he departed to go to Macedonia.
translation:
  language: hi
  text: उपद्रव शांत होने के बाद पौलुस ने चेलों को अपने पास बुलवाया और उन्हें प्रोत्साहित करके तथा उनसे विदा लेकर[a] मकिदुनिया जाने के लिए रवाना हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनका अभिवादन करके’; यूनानी शब्द का अर्थ अभिवादन करना हो सकता है, और प्रस्थान के प्रसंग में विदा लेना भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὸ παύσασθαι
  choice: जब ... शांत हो गया, तब
  rationale: μετά के साथ प्रयुक्त व्यक्तिवाचक क्रियारूप पूर्व घटना के समाप्त होने के बाद का समय बताता है। हिंदी में ‘जब...तब’ इस कालक्रम को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: θόρυβον
  choice: उपद्रव
  rationale: यह शब्द इफिसुस की सार्वजनिक अशांति और भीड़ के हंगामे को दर्शाता है; ‘उपद्रव’ उसकी गंभीरता और कथानक के संदर्भ दोनों के अनुकूल है।
- source_word: μεταπεμψάμενος
  choice: बुलवाया
  rationale: मध्यवाच्य कृदंत का भाव किसी को अपने पास बुलाने के लिए संदेश भेजना है। ‘बुलवाया’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: τοὺς μαθητὰς
  choice: चेलों
  rationale: प्रेरितों के काम में μαθηταί यीशु के अनुयायियों के लिए प्रयुक्त विशिष्ट शब्द है। ‘चेले’ इस लूकीय शब्दावली को बनाए रखता है।
- source_word: παρακαλέσας
  choice: प्रोत्साहित करने
  rationale: παρακαλέω में उत्साहित करने, समझाने और सांत्वना देने के भाव हो सकते हैं। अशांति के बाद विदाई के इस प्रसंग में ‘प्रोत्साहित’ सहारा देकर दृढ़ करने के व्यापक भाव को बिना अनावश्यक संकीर्णता के व्यक्त करता है।
- source_word: ἀσπασάμενος
  choice: उनसे विदा लेने
  rationale: ἀσπάζομαι का सामान्य अर्थ अभिवादन करना है, किंतु प्रस्थान के प्रसंग में यह विदा लेने का भाव दे सकता है। यहाँ यात्रा आरंभ होने के कारण ‘विदा लेने’ को मुख्य पाठ में रखा गया है और वास्तविक शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: ἐξῆλθεν
  choice: रवाना हुआ
  rationale: यात्रा-वृत्तांत में यह क्रिया केवल बाहर निकलने के बजाय प्रस्थान को सूचित करती है। ‘रवाना हुआ’ आधुनिक हिंदी में गंतव्य की ओर यात्रा शुरू करने का स्वाभाविक भाव देता है।
- source_word: πορεύεσθαι εἰς Μακεδονίαν
  choice: मकिदुनिया जाने के लिए
  rationale: क्रियारूप प्रस्थान के उद्देश्य और गंतव्य को व्यक्त करता है; यह हिंदी रूप दोनों को स्पष्ट रखता है।
