  text: I coveted no one's silver or gold or clothing[a].
translation:
  language: hi
  text: मैंने किसी की चाँदी, सोने या कपड़ों का लालच नहीं किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने किसी की चाँदी, सोने या कपड़ों की इच्छा नहीं की।”
    reason: ἐπιθυμέω का अर्थ सामान्य रूप से ‘इच्छा करना’ भी हो सकता है; यह विकल्प मूल की अर्थ-सीमा को सुरक्षित रखता है।
lexical_decisions:
- source_word: ἀργυρίου
  choice: चाँदी
  rationale: यह शब्द मूलतः चाँदी को दर्शाता है; सोने और कपड़ों के साथ यह मूल्यवान वस्तुओं की ठोस सूची बनाता है।
- source_word: χρυσίου
  choice: सोना
  rationale: चाँदी और कपड़ों के साथ समन्वित इस संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἱματισμοῦ
  choice: कपड़े
  rationale: यह पहनने के वस्त्रों को दर्शाता है; ‘कपड़े’ आधुनिक सामान्य हिन्दी में सहज और स्पष्ट है।
- source_word: οὐδενὸς
  choice: किसी की
  rationale: सम्बन्धकारक रूप सूचीबद्ध वस्तुओं को किसी व्यक्ति की सम्पत्ति के रूप में प्रस्तुत करता है; हिन्दी में ‘किसी की’ इस सम्बन्ध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπεθύμησα
  choice: लालच नहीं किया
  rationale: इस प्रसंग में क्रिया दूसरों की सम्पत्ति पाने की अनुचित इच्छा बताती है; ‘लालच करना’ नैतिक अर्थ को स्पष्ट रखते हुए सामान्य आधुनिक हिन्दी है।
- source_word: ἢ ... ἢ ... ἢ
  choice: या ... या ... या
  rationale: नकारात्मक वाक्य में भी बार-बार आए विकल्पसूचक संयोजक की संरचना को बनाए रखता है।
theological_decisions:
- issue: भौतिक सम्पत्ति के सम्बन्ध में ἐπιθυμέω का नैतिक भाव
  choice: ‘लालच नहीं किया’
  alternative: ‘इच्छा नहीं की’
  rationale: पौलुस अपने लोभरहित आचरण का बचाव कर रहा है। इसलिए नैतिक रूप से नकारात्मक ‘लालच’ प्रसंग के अनुकूल है, जबकि पादटिप्पणी अपेक्षाकृत तटस्थ सम्भावना को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ में सहज। ‘वस्त्र’ की अपेक्षा ‘कपड़े’ सामान्य पाठक के लिए अधिक स्वाभाविक है।
