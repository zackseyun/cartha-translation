translation:
  language: hi
  text: ये बातें कहने के बाद, उसने उन सबके साथ घुटने टेककर प्रार्थना की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: '[अलग से अनूदित नहीं]'
  rationale: यूनानी में यह सामान्य कथात्मक संयोजक है। हिन्दी में पिछले प्रसंग से संबंध और घटनाक्रम ‘यह कहने के बाद’ से स्वाभाविक रूप से स्पष्ट है; आरंभ में ‘और’ जोड़ना अनावश्यक रूप से असहज होता।
- source_word: ταῦτα εἰπὼν
  choice: यह कहने के बाद
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले हुई क्रिया बताता है। ‘यह’ निकटवर्ती भाषण की बातों को स्वाभाविक हिन्दी में समेटता है।
- source_word: θεὶς τὰ γόνατα αὐτοῦ
  choice: उसने ... घुटने टेककर
  rationale: शाब्दिक अर्थ ‘अपने घुटने रखकर’ है, पर यह घुटने टेकने का यूनानी मुहावरा है। हिन्दी मुहावरा उसी क्रिया को स्पष्ट करता है और आकस्मिक रूप से गिर पड़ने का भाव नहीं जोड़ता।
- source_word: σὺν πᾶσιν αὐτοῖς
  choice: उन सबके साथ
  rationale: σύν संगति को और πᾶσιν पूरे समूह को सूचित करता है; यह रूप दोनों बातों को संक्षेप और स्वाभाविकता से बनाए रखता है।
- source_word: προσηύξατο
  choice: प्रार्थना की
  rationale: प्रσεύχομαι प्रार्थना करने का सामान्य क्रियापद है। हिन्दी में ‘प्रार्थना की’ इसका सीधा और प्रचलित अनुवाद है।
