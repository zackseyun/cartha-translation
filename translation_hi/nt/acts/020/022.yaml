source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ ⸂δεδεμένος ἐγὼ⸃ τῷ πνεύματι πορεύομαι εἰς Ἰερουσαλήμ, τὰ ἐν αὐτῇ συναντήσοντά ⸀μοι μὴ εἰδώς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/022.yaml
  text: And now, behold, bound in the Spirit, I am going to Jerusalem, not knowing what will happen to me there,
translation:
  language: hi
  text: और अब, देखो, मैं आत्मा में बँधा हुआ[a] यरूशलेम जा रहा हूँ, यह नहीं जानता कि वहाँ मेरे साथ क्या होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आत्मा में बँधा हुआ” का अर्थ “अपनी आत्मा में बँधा हुआ” भी हो सकता है; यूनानी पदबंध पौलुस की अपनी आत्मा या पवित्र आत्मा—दोनों की ओर संकेत कर सकता है। इसका अनुवाद “आत्मा के द्वारा विवश किया हुआ” भी किया जा सकता है।
    reason: वैकल्पिक अर्थ और मूल यूनानी की वास्तविक अस्पष्टता।
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह पौलुस के कथन में जोरदार परिवर्तन और श्रोताओं का ध्यान खींचने वाला संकेत है; आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल का बल बनाए रखता है।
- source_word: δεδεμένος
  choice: बँधा हुआ
  rationale: पूर्णकालिक कर्मवाच्य कृदंत के बंधन-रूपक को सुरक्षित रखता है और उसे केवल ‘विवश’ या ‘प्रेरित’ अर्थ में सीमित नहीं करता।
- source_word: τῷ πνεύματι
  choice: आत्मा में
  rationale: 'यूनानी पदबंध की वास्तविक अस्पष्टता को बनाए रखता है: आशय पवित्र आत्मा से भी हो सकता है और पौलुस की अपनी आत्मा से भी; प्रसंग में पवित्र आत्मा अधिक संभावित है।'
- source_word: πορεύομαι
  choice: जा रहा हूँ
  rationale: चल रही अथवा निकटवर्ती यात्रा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὰ ἐν αὐτῇ συναντήσοντά μοι
  choice: वहाँ मेरे साथ क्या-क्या होगा
  rationale: शाब्दिक ‘जो बातें वहाँ मुझसे मिलेंगी’ का स्वाभाविक हिन्दी अर्थ देता है और अनिश्चित बहुवचन भाव को ‘क्या-क्या’ से बनाए रखता है।
- source_word: μὴ εἰδώς
  choice: मैं नहीं जानता
  rationale: यूनानी कृदंत के अर्थ को स्पष्ट और सहज हिन्दी स्वतंत्र वाक्य में व्यक्त करता है।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: इस स्थान-नाम का प्रचलित मानक हिन्दी रूप।
theological_decisions:
- issue: τῷ πνεύματι का संदर्भ और कारक-भाव
  choice: मुख्य पाठ में ‘आत्मा में’
  alternative: ‘अपनी आत्मा में बँधा हुआ’ अथवा ‘आत्मा के द्वारा विवश किया हुआ’
  rationale: प्रेरितों के काम का प्रसंग पवित्र आत्मा की ओर संकेत करता है, पर यूनानी वाक्यांश पौलुस की अपनी आत्मा अथवा आत्मा की प्रेरक भूमिका को व्याकरणतः पूरी तरह बाहर नहीं करता। इसलिए मुख्य पाठ अस्पष्टता बचाता है और पाद-टिप्पणी विकल्प बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘देखो’ मूल के संवाद-संकेत को रखता है; ‘बँधा हुआ’ रूपक तथा ‘आत्मा में’ धर्मवैज्ञानिक अस्पष्टता सुरक्षित रखते हैं।
