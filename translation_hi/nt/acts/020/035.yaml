source:
  edition: SBLGNT
  text: πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/035.yaml
  text: In everything I showed you that by laboring in this way it is necessary to help the weak[a], and to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive.’
translation:
  language: hi
  text: 'मैंने तुम्हें हर बात में दिखाया कि इस प्रकार परिश्रम करते हुए निर्बलों की सहायता करना[a] और प्रभु यीशु के उन वचनों को स्मरण रखना आवश्यक है, जो उन्होंने स्वयं कहे थे: ‘लेने की अपेक्षा देना अधिक धन्य है।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निर्बलों को सहारा देना।’ यूनानी क्रिया केवल क्षणिक सहायता ही नहीं, बल्कि लगातार सहारा देने का भाव भी रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: हर बात में
  rationale: इसे ὑπέδειξα के साथ क्रियाविशेषणीय अर्थ में लिया गया है; यह पौलुस के व्यापक उदाहरण को व्यक्त करता है।
- source_word: ὑπέδειξα
  choice: मैंने ... दिखाया
  rationale: यह दिखाने या अपने आचरण से उदाहरण प्रस्तुत करने का भाव रखता है; सरल हिंदी में ‘दिखाया’ स्वाभाविक है।
- source_word: οὕτως κοπιῶντας
  choice: इस प्रकार परिश्रम करते हुए
  rationale: οὕτως पिछले संदर्भ में वर्णित कार्य-रीति की ओर संकेत करता है, और κοπιῶντας कठिन, श्रमसाध्य काम का भाव बनाए रखता है।
- source_word: δεῖ
  choice: आवश्यक है
  rationale: यह दायित्व या आवश्यकता व्यक्त करता है और यूनानी पाठ की अनिर्दिष्ट कर्तृ-संरचना को सुरक्षित रखता है।
- source_word: ἀντιλαμβάνεσθαι
  choice: सहायता करना
  rationale: यह सहायता देने या सहारा देने को दर्शाता है; मुख्य पाठ में सहज ‘सहायता करना’ और पादटिप्पणी में दीर्घकालिक सहारे की संभावना रखी गई है।
- source_word: τῶν ἀσθενούντων
  choice: निर्बलों
  rationale: यह शारीरिक, आर्थिक या सामाजिक रूप से कमजोर लोगों के लिए व्यापक रह सकता है; किसी एक अर्थ तक सीमित नहीं किया गया।
- source_word: μνημονεύειν τε
  choice: और ... स्मरण रखना
  rationale: τε पिछले अनंत क्रिया-रूप के साथ समन्वय करता है; ‘स्मरण रखना’ लगातार ध्यान में रखने का स्वाभाविक भाव देता है।
- source_word: τῶν λόγων τοῦ κυρίου Ἰησοῦ
  choice: प्रभु यीशु के उन वचनों
  rationale: λόγων को ‘वचनों’ और κύριος को प्रतिष्ठित, प्रचलित उपाधि ‘प्रभु’ से व्यक्त किया गया है।
- source_word: αὐτὸς εἶπεν
  choice: उन्होंने स्वयं कहे थे
  rationale: ‘स्वयं’ αὐτός के बलाघात को सुरक्षित रखता है कि यह कथन यीशु ने स्वयं कहा था।
- source_word: Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν
  choice: लेने की अपेक्षा देना अधिक धन्य है
  rationale: तुलनात्मक संरचना और μακάριον के धार्मिक-सार्थक भाव को संक्षिप्त, प्रतिष्ठित हिंदी में बनाए रखा गया है।
theological_decisions:
- issue: ‘निर्बलों’ का दायरा
  choice: व्यापक ‘निर्बलों’
  alternative: गरीबों; रोगियों; विश्वास में कमजोर लोगों
  rationale: ἀσθενούντων का अर्थ व्यापक है। संदर्भ सहायता और श्रम से जुड़ा है, पर पाठ कमजोरी का कोई एक प्रकार निश्चित नहीं करता।
- issue: ἀντιλαμβάνεσθαι में सहायता की प्रकृति
  choice: मुख्य पाठ में ‘सहायता करना’
  alternative: सहारा देना
  rationale: ‘सहायता’ सामान्य पाठक के लिए स्पष्ट है, जबकि क्रिया में निरंतर सहारा देने की संभावना पादटिप्पणी में सुरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘धन्य’ बाइबलीय अर्थ को बनाए रखता है; ‘निर्बलों’ जानबूझकर व्यापक रखा गया है।
