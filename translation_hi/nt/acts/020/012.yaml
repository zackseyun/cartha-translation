translation:
  language: hi
  text: फिर वे उस लड़के को जीवित वहाँ से ले गए, और उन्हें बहुत सांत्वना मिली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: ले आए
  rationale: ἄγω का अर्थ ‘ले जाना’ या ‘ले आना’ हो सकता है। इस प्रसंग में समुदाय द्वारा यूतुखुस को जीवित अवस्था में अपने साथ लाने के भाव को ‘ले आए’ सहज और संदर्भानुकूल रूप से व्यक्त करता है।
- source_word: παῖδα
  choice: लड़के
  rationale: παῖς के अर्थों में बच्चा, लड़का और सेवक सम्मिलित हैं। यहाँ यह यूतुखुस के लिए प्रयुक्त है, इसलिए ‘लड़का’ उपयुक्त है और सेवक होने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ζῶντα
  choice: जीवित
  rationale: यह कृदंत लड़के की उस समय की अवस्था बताता है जब वे उसे ले आए; ‘जीवित’ इस अर्थ को स्पष्ट और संक्षेप में व्यक्त करता है।
- source_word: παρεκλήθησαν
  choice: उन्हें सांत्वना मिली
  rationale: संदर्भ में मृत्यु-जैसी दुर्घटना के बाद यूतुखुस को जीवित पाने से उपस्थित लोगों को राहत और ढाढ़स मिला। यह हिंदी प्रयोग यूनानी कर्मवाच्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὐ μετρίως
  choice: बहुत
  rationale: शाब्दिक अर्थ ‘मामूली रूप से नहीं’ है; यह न्यूनोक्ति अत्यधिक मात्रा व्यक्त करती है। आधुनिक हिंदी में ‘बहुत’ वही बल स्पष्ट और स्वाभाविक रूप से देता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। यूनानी न्यूनोक्ति οὐ μετρίως को अस्पष्ट शाब्दिक रूप में रखने के बजाय स्वाभाविक हिंदी ‘बहुत’ से व्यक्त किया गया है।
