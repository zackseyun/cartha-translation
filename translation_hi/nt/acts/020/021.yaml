  text: διαμαρτυρόμενος Ἰουδαίοις τε καὶ Ἕλλησιν τὴν ⸀εἰς θεὸν μετάνοιαν καὶ ⸀πίστιν εἰς τὸν κύριον ἡμῶν ⸀Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/021.yaml
  text: solemnly testifying to both Jews and Greeks about repentance toward God and faith in our Lord Jesus[a].
translation:
  language: hi
  text: और यहूदियों और यूनानियों, दोनों को, गंभीरता से गवाही देता रहा कि परमेश्वर की ओर मन फिराने और हमारे प्रभु यीशु पर विश्वास करने के विषय में[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे प्रभु यीशु पर भरोसा करने के विषय में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτυρόμενος
  choice: गंभीरता से गवाही देता रहा
  rationale: यह क्रियाविशेषणीय कृदंत जोरदार और गंभीर साक्ष्य देने का भाव रखता है; प्रसंग में निरंतर बीते कार्य के रूप में इसे स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: Ἰουδαίοις τε καὶ Ἕλλησιν
  choice: यहूदियों और यूनानियों, दोनों के सामने
  rationale: यूनानियों मूल जातीय-सांस्कृतिक पद को बनाए रखता है; इसे व्यापक बनाकर गैर-यहूदी नहीं किया गया। दोनों जोड़े की समावेशी संरचना स्पष्ट करता है।
- source_word: μετάνοιαν
  choice: मन फिराना
  rationale: यह केवल बौद्धिक विचार-बदलाव नहीं, बल्कि दिशा और जीवन के परिवर्तन का भाव देता है; आधुनिक हिन्दी में प्रचलित बाइबलीय अभिव्यक्ति है।
- source_word: εἰς θεόν
  choice: परमेश्वर की ओर
  rationale: εἰς यहाँ पश्चात्ताप की दिशा या अभिमुखता बताता है।
- source_word: πίστιν
  choice: विश्वास
  rationale: स्पष्ट व्यक्ति-वाचक लक्ष्य के साथ πίστις के लिए विश्वास स्वाभाविक और धर्मवैचारिक रूप से अनिर्णायक मुख्य-पाठ विकल्प है; भरोसा को पादटिप्पणी में रखा गया है।
- source_word: εἰς τὸν κύριον ἡμῶν Ἰησοῦν
  choice: हमारे प्रभु यीशु पर
  rationale: विश्वास के साथ हिन्दी में किसी व्यक्ति को विश्वास का लक्ष्य बताने के लिए पर स्वाभाविक है; प्रभु पद की मसीही गरिमा बनाए रखता है।
theological_decisions:
- issue: πίστις का धर्मवैचारिक रूप से भारित अनुवाद
  choice: हमारे प्रभु यीशु पर विश्वास
  alternative: हमारे प्रभु यीशु पर भरोसा
  rationale: यहाँ यीशु विश्वास के स्पष्ट लक्ष्य हैं; इसलिए यह πίστις Χριστοῦ वाली कर्तृवाचक/कर्मवाचक अस्पष्टता नहीं है। विश्वास मुख्य पाठ में परंपरागत और व्यापक है, जबकि भरोसा वास्तविक अर्थ-विकल्प के रूप में पादटिप्पणी में सुरक्षित है।
- issue: μετάνοια का स्वरूप
  choice: परमेश्वर की ओर मन फिराना
  alternative: परमेश्वर की ओर पश्चात्ताप
  rationale: मन फिराना दिशा-परिवर्तन और परमेश्वर की ओर उन्मुख होने का भाव सहजता से व्यक्त करता है; पश्चात्ताप संभावित विकल्प है, पर आधुनिक पाठक के लिए कभी-कभी केवल खेद तक सीमित समझा जा सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सामान्य पाठक के लिए सुबोध रखी गई है। पद पिछले वाक्य की क्रियात्मक संरचना पर निर्भर है, इसलिए आरंभ में “और” तथा निरंतर भूतकाल “देता रहा” रखा गया है। यूनानियों को गैर-यहूदियों से प्रतिस्थापित नहीं किया गया।
