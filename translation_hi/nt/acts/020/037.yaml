lexical_decisions:
- source_word: ἱκανὸς δὲ κλαυθμὸς ἐγένετο πάντων
  choice: वे सब फूट-फूटकर रोने लगे
  rationale: यह स्वाभाविक आधुनिक हिन्दी में सभी उपस्थित लोगों के अत्यधिक रोने को व्यक्त करता है। ἱκανός यहाँ पर्याप्त/बहुत अधिक मात्रा का बोध कराता है, जबकि ἐγένετο घटना के आरम्भ या घटित होने को दर्शाता है।
- source_word: ἐπιπεσόντες ἐπὶ τὸν τράχηλον τοῦ Παύλου
  choice: पौलुस के गले से लिपटकर
  rationale: यूनानी मुहावरे का आशय स्नेहपूर्ण आलिंगन है; यह अनुवाद गले के स्पष्ट बिंब को बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: κατεφίλουν αὐτόν
  choice: उसे बार-बार चूमते रहे
  rationale: καταφιλέω का स्नेहपूर्वक चूमना और अपूर्ण भूतकाल का निरंतर अथवा दोहराया गया पक्ष, दोनों इस वाक्यांश में व्यक्त होते हैं।
