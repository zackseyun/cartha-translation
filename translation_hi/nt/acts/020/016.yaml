- source_word: κεκρίκει
  choice: निश्चय किया था
  rationale: पूर्णभूतकालिक रूप कथा में पहले किए जा चुके दृढ़ निर्णय को व्यक्त करता है।
- source_word: παραπλεῦσαι τὴν Ἔφεσον
  choice: इफिसुस के पास से समुद्र-मार्ग से निकल जाए
  rationale: क्रिया समुद्र से किसी स्थान के पास से आगे निकलने का अर्थ देती है; यह अनुवाद समुद्री यात्रा का भाव स्पष्ट रखता है।
- source_word: ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι
  choice: ताकि उसे ... समय न बिताना पड़े
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप, जो वहाँ समय लगने से बचने का व्यावहारिक आशय रखता है।
- source_word: ἐν τῇ Ἀσίᾳ
  choice: आसिया में
  rationale: ऐतिहासिक भौगोलिक नाम को मुख्य पाठ में रखा गया है; आधुनिक महाद्वीप से भेद पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἔσπευδεν
  choice: वह जल्दी कर रहा था
  rationale: अपूर्णकाल यात्रा के दौरान जारी तत्परता और शीघ्रता को दिखाता है।
- source_word: εἰ δυνατὸν εἴη αὐτῷ
  choice: यदि सम्भव हो
  rationale: यह संक्षिप्त और स्वाभाविक हिन्दी में सम्भाव्यता की शर्त को सुरक्षित रखता है।
- source_word: τὴν ἡμέραν τῆς πεντηκοστῆς
  choice: पिन्तेकुस्त के दिन
  rationale: नए नियम में प्रचलित पर्वनाम और समय-सन्दर्भ दोनों स्पष्ट रहते हैं।
- source_word: γενέσθαι εἰς Ἱεροσόλυμα
  choice: यरूशलेम में रहे
  rationale: प्रयोग उस दिन वहाँ उपस्थित होने को सूचित कर सकता है; पहुँचने का वैकल्पिक बल पादटिप्पणी में रखा गया है।
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: स्थाननाम का मानक हिन्दी बाइबलीय रूप।
