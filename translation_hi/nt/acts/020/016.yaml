source:
  edition: SBLGNT
  text: ⸀κεκρίκει γὰρ ὁ Παῦλος παραπλεῦσαι τὴν Ἔφεσον, ὅπως μὴ γένηται αὐτῷ χρονοτριβῆσαι ἐν τῇ Ἀσίᾳ, ἔσπευδεν γὰρ εἰ δυνατὸν ⸀εἴη αὐτῷ τὴν ἡμέραν τῆς πεντηκοστῆς γενέσθαι εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/016.yaml
  text: For Paul had decided to sail past Ephesus[a], so that he might not have to spend time in Asia; for he was hurrying to be in Jerusalem, if possible[b], on the day of Pentecost.
translation:
  language: hi
  text: क्योंकि पौलुस ने यह निश्चय किया था कि वह जहाज़ से इफिसुस के पास से आगे निकल जाए, ताकि उसे एशिया[a] में समय न बिताना पड़े; क्योंकि वह, यदि सम्भव हो, तो पिन्तेकुस्त के दिन यरूशलेम में होने की जल्दी में था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘एशिया’ से आशय पश्चिमी एशिया माइनर में स्थित रोमी प्रान्त एशिया से है, आधुनिक एशिया महाद्वीप से नहीं।
    reason: cultural_note
  - marker: b
    text: या, ‘पिन्तेकुस्त के दिन यरूशलेम पहुँचे।’ यूनानी अभिव्यक्ति उस दिन तक वहाँ उपस्थित होने या उसी दिन वहाँ पहुँचने—दोनों में से किसी पर बल दे सकती है।
    reason: alternative_reading
