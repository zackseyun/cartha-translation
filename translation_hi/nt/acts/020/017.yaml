  text: From Miletus he sent to Ephesus and called for the elders of the church[a].
translation:
  language: hi
  text: मिलेतुस से उसने इफिसुस को संदेश भेजा[a] और कलीसिया के प्राचीनों को बुलवाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इफिसुस को भेजकर कलीसिया के प्राचीनों को बुलवाया।” यूनानी पाठ यह स्पष्ट नहीं करता कि उसने संदेश भेजा था या दूतों को; आशय यह है कि उसने इफिसुस में प्राचीनों को अपने पास आने के लिए कहलवाया।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς Μιλήτου
  choice: मिलेतुस से
  rationale: ἀπό संबंधकारक के साथ प्रस्थान या स्थान का बिंदु बताता है। δέ हल्का संयोजक है; इस एक-वाक्यीय संदर्भ में अलग शब्द जोड़ना आवश्यक नहीं।
- source_word: πέμψας εἰς Ἔφεσον
  choice: इफिसुस में संदेश भेजकर
  rationale: कृदंत मुख्य क्रिया से पहले की सहायक कार्रवाई बताता है। यूनानी में भेजी गई वस्तु या व्यक्ति स्पष्ट नहीं है; ‘संदेश’ प्रसंगगत आशय को स्वाभाविक हिंदी में व्यक्त करता है, अर्थात पौलुस ने वहाँ सूचना भिजवाई।
- source_word: μετεκαλέσατο
  choice: अपने पास बुलवाया
  rationale: मध्यवाच्य क्रिया किसी को अपने पास बुलाने या बुलवा भेजने का भाव रखती है। ‘बुलवाया’ दूरी पर स्थित लोगों को संदेश द्वारा बुलाने के प्रसंग के अनुकूल है और अनावश्यक रूप से अधिकारपूर्ण ‘तलब किया’ से बचता है।
- source_word: τοὺς πρεσβυτέρους
  choice: प्राचीनों
  rationale: यहाँ πρεσβύτεροι केवल अधिक आयु के पुरुष नहीं, बल्कि कलीसिया के मान्य अगुए हैं। ‘प्राचीन’ हिंदी बाइबलीय प्रयोग में इस पद को व्यक्त करता है, बिना किसी बाद की विशिष्ट संप्रदायगत व्यवस्था को थोपे।
- source_word: τῆς ἐκκλησίας
  choice: कलीसिया के
  rationale: लूका-प्रेरितों के काम में ἐκκλησία यहाँ मसीही समुदाय को दर्शाता है। ‘कलीसिया’ आधुनिक हिंदी के स्थापित मसीही प्रयोग में स्वाभाविक है।
theological_decisions:
- issue: कलीसियाई संदर्भ में πρεσβυτέρους का अर्थ
  choice: मान्य कलीसियाई अगुए, जिन्हें ‘प्राचीन’ कहा गया है
  alternative: मंडली के वृद्ध पुरुष; अथवा तकनीकी लिप्यंतरण ‘प्रेस्बिटर’
  rationale: कथा में पौलुस इफिसुस की कलीसिया के जिम्मेदार अगुओं को बुला रहा है। ‘प्राचीन’ मूल पद का अर्थ सुरक्षित रखता है, पर बाद की किसी विशिष्ट शासन-पद्धति को पाठ में नहीं डालता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए स्पष्ट रखी गई है। ‘संदेश भेजकर ... बुलवाया’ यूनानी की दो जुड़ी क्रियाओं को सहज हिंदी में व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ में संदेश भेजकर बुलाने का आशय स्पष्ट है।
