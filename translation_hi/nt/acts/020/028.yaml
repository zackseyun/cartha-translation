reference: Acts 20:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ ⸀θεοῦ, ἣν περιεποιήσατο διὰ τοῦ ⸂αἵματος τοῦ ἰδίου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/028.yaml
  text: Pay careful attention to yourselves and to all the flock[a], in which the Holy Spirit has appointed you overseers, to shepherd the church of God[c][b], which he obtained through the blood of his own.
translation:
  language: hi
  text: अपनी और सारे झुंड की देखभाल करते रहो, जिसमें पवित्र आत्मा ने तुम्हें निरीक्षक ठहराया है, ताकि तुम परमेश्वर की कलीसिया[a] की चरवाही करो, जिसे उसने अपने पुत्र के लहू के द्वारा अपने लिए प्राप्त किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में “परमेश्वर की कलीसिया” के स्थान पर “प्रभु की कलीसिया” है।
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से, “अपने [जन] के लहू के द्वारा।” या, “जिसे उसने अपने ही लहू से अपने लिए प्राप्त किया।”
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχετε
  choice: सावधान रहो
  rationale: वर्तमान काल की आज्ञा निरंतर सतर्कता व्यक्त करती है; यह स्वाभाविक हिन्दी में आत्मिक और चरवाही-संबंधी चौकसी का भाव रखती है।
- source_word: παντὶ τῷ ποιμνίῳ
  choice: सारे झुंड
  rationale: ‘झुंड’ मूल चरवाही-रूपक को बनाए रखता है और παντί की समग्रता को ‘सारे’ से व्यक्त करता है।
- source_word: ἐν ᾧ
  choice: उसी झुंड में
  rationale: यह निरीक्षकों को झुंड से बाहर नहीं, उसके भीतर रखे जाने का भाव स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔθετο
  choice: ठहराया है
  rationale: यहाँ τίθημι किसी दायित्वपूर्ण भूमिका में नियुक्त करने का अर्थ देता है; ‘ठहराया है’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और गरिमापूर्ण है।
- source_word: ἐπισκόπους
  choice: निरीक्षक
  rationale: यह शब्द देखरेख करने वाले अगुओं को दर्शाता है और बाद के संस्थागत पदनाम ‘बिशप’ को पाठ में आरोपित नहीं करता।
- source_word: ποιμαίνειν
  choice: चरवाही करो
  rationale: यह मूल के चरवाहे वाले रूपक को बनाए रखता है और केवल प्रशासन नहीं, देखभाल तथा अगुवाई दोनों व्यक्त करता है।
- source_word: ἐκκλησίαν
  choice: कलीसिया
  rationale: इस मसीही संदर्भ में यह परमेश्वर के एकत्र लोगों को दर्शाता है; ‘कलीसिया’ हिन्दी बाइबल पाठकों के लिए स्थापित और सुबोध शब्द है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर की
  rationale: मुख्य पाठ में दिए SBLGNT के θεοῦ का सीधा अनुवाद है; ‘प्रभु की’ पाठांतर को पादटिप्पणी में रखा गया है।
- source_word: περιεποιήσατο
  choice: अपने लिए प्राप्त किया
  rationale: मध्यवाच्य का ‘अपने लिए अर्जित/प्राप्त करना’ भाव सुरक्षित रहता है और व्यापारिक ‘खरीदा’ को आवश्यकता से अधिक प्रमुख नहीं बनाया जाता।
- source_word: διὰ τοῦ αἵματος
  choice: लहू के द्वारा
  rationale: διά + संबंधकारक यहाँ साधन व्यक्त करता है; यह बलिदानी और छुटकारे के भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: τοῦ ἰδίου
  choice: अपने निज जन के
  rationale: ἴδιος के संज्ञात्मक प्रयोग को हिन्दी में अधूरा छोड़े बिना ‘अपने निजी/प्रिय जन’ का भाव दिया गया है, पर ‘पुत्र’ को मुख्य पाठ में स्पष्ट रूप से जोड़कर अस्पष्टता पूरी तरह हल नहीं की गई।
theological_decisions:
- issue: τοῦ αἵματος τοῦ ἰδίου का संदर्भ और अर्थ
  choice: अपने निज जन के लहू के द्वारा
  alternative: अपने पुत्र के लहू के द्वारा; अपने ही लहू से
  rationale: यूनानी में ‘पुत्र’ संज्ञा स्पष्ट रूप से नहीं है, यद्यपि संज्ञात्मक ἴδιος को प्रायः ‘अपने निज जन’, अर्थात पुत्र, समझा जाता है। मुख्य पाठ स्वाभाविक हिन्दी देता है पर संदर्भ को पूरी तरह निर्णीत नहीं करता; पारंपरिक और स्पष्ट व्याख्याएँ पादटिप्पणी में सुरक्षित हैं।
- issue: τοῦ θεοῦ का पाठांतर
  choice: परमेश्वर की कलीसिया
  alternative: प्रभु की कलीसिया
  rationale: दिए गए SBLGNT मुख्य पाठ में θεοῦ है; σημαν पाठांतर κυρίου को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। ‘झुंड/चरवाही’ के मूल रूपक को बनाए रखा गया है। वाक्य को हिन्दी की स्पष्टता के लिए दो वाक्यों में बाँटा गया है। ‘निज जन’ कुछ ऊँचा किंतु समझने योग्य पद है, जो τοῦ ἰδίου की वास्तविक व्याख्यात्मक गुंजाइश को ‘पुत्र’ जोड़कर पूरी तरह बंद नहीं करता।
