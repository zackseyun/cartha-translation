  text: ὡς δὲ ⸀συνέβαλλεν ἡμῖν εἰς τὴν Ἆσσον, ἀναλαβόντες αὐτὸν ἤλθομεν εἰς Μιτυλήνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/014.yaml
  text: And when he met us at Assos[a], we took him on board and came to Mitylene.
translation:
  language: hi
  text: जब वह अस्सोस में हमसे आ मिला[a], तो हम उसे जहाज़ पर चढ़ाकर मितुलेने पहुँचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अस्सोस में हमसे जुड़ गया’ अथवा ‘अस्सोस में हमारे साथ आ मिला।’ यूनानी क्रिया मिलने या एक साथ आने का अर्थ दे सकती है; यहाँ भाव यह है कि पौलुस वहाँ फिर से दल के साथ हो गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβαλλεν
  choice: हमसे आ मिला
  rationale: यात्रा-वृत्तांत में क्रिया का स्वाभाविक अर्थ पौलुस का दल से अस्सोस में मिलना या फिर से जुड़ना है। ‘आ मिला’ गंतव्य की ओर उसके आने और दल में सम्मिलित होने—दोनों भावों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἡμῖν
  choice: हमसे
  rationale: समुद्री यात्रा कर रहे वक्ता और उसके साथियों को सूचित करने वाला बहुवचन सम्प्रदान रूप है; हिन्दी में ‘मिलना’ के साथ ‘हमसे’ स्वाभाविक है।
- source_word: εἰς τὴν Ἆσσον
  choice: अस्सोस में
  rationale: εἰς मूलतः दिशा सूचित कर सकता है, पर मिलने की घटना के स्थान को हिन्दी में स्वाभाविक रूप से ‘अस्सोस में’ कहा जाता है।
- source_word: ἀναλαβόντες
  choice: उसे जहाज़ पर चढ़ाकर
  rationale: समुद्री यात्रा के प्रसंग में कृदन्त का अर्थ उसे अपने साथ जहाज़ पर ले लेना है। जहाज़ मूल यूनानी में अंतर्निहित है; इसे स्पष्ट करने से हिन्दी पाठ सहज और प्रसंगानुकूल बनता है।
- source_word: αὐτόν
  choice: उसे
  rationale: सर्वनाम पिछले प्रसंग के पौलुस की ओर संकेत करता है; मूल पाठ की तरह नाम दोहराए बिना सर्वनाम रखा गया है।
- source_word: ἤλθομεν
  choice: पहुँचे
  rationale: गंतव्य तक यात्रा की पूर्ण घटना के लिए ‘पहुँचे’ स्वाभाविक आधुनिक हिन्दी है और यूनानी अओरिस्ट की कथा-गत पूर्णता को बिना अतिरिक्त जोर के व्यक्त करता है।
- source_word: εἰς Μιτυλήνην
  choice: मितुलेने
  rationale: गंतव्य को ‘पहुँचे’ क्रिया के साथ हिन्दी में परसर्ग के बिना रखा जा सकता है; यूनानी स्थान-नाम Μιτυλήνη का निकट देवनागरी लिप्यंतरण ‘मितुलेने’ है।
