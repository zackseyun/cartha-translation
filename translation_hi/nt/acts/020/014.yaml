  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण यात्रा-वृत्तांत। ‘आ मिला’ मूल क्रिया की संभावित अर्थ-सीमा को बनाए रखता है, जबकि ‘जहाज़ पर’ समुद्री प्रसंग में निहित अर्थ को पाठक के लिए स्पष्ट करता है।
