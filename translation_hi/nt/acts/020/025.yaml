  edition: SBLGNT
  text: Καὶ νῦν ἰδοὺ ἐγὼ οἶδα ὅτι οὐκέτι ὄψεσθε τὸ πρόσωπόν μου ὑμεῖς πάντες ἐν οἷς διῆλθον κηρύσσων τὴν ⸀βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/025.yaml
  text: And now, look, I know that none of you among whom I went about proclaiming the kingdom will see my face again.
translation:
  language: hi
  text: और अब, देखो, मैं जानता हूँ कि तुम सब, जिनके बीच मैं राज्य की घोषणा करता हुआ फिरा, मेरा चेहरा फिर कभी नहीं देखोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह श्रोताओं का ध्यान आगे कही जाने वाली गंभीर बात की ओर खींचने वाला स्वाभाविक और सीधा संबोधन है।
- source_word: διῆλθον
  choice: फिरा
  rationale: यह विभिन्न स्थानों या लोगों के बीच घूमते हुए सेवा करने की क्रिया को संक्षेप और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: κηρύσσων
  choice: प्रचार करता हुआ
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ चल रही घोषणा की सेवकाई को दर्शाता है।
- source_word: τὴν βασιλείαν
  choice: राज्य
  rationale: मूल पाठ में बिना किसी स्पष्ट विशेषण के केवल ‘राज्य’ है; इसलिए ‘परमेश्वर का’ जोड़कर पाठ की वास्तविक संक्षिप्तता और संभावित संदर्भगत अर्थ को नहीं बदला गया।
- source_word: τὸ πρόσωπόν μου
  choice: मेरा मुँह
  rationale: यह यूनानी मुहावरे के निकट रहते हुए हिंदी में व्यक्तिगत उपस्थिति और प्रत्यक्ष भेंट का भाव व्यक्त करता है।
- source_word: οὐκέτι
  choice: फिर कभी नहीं
  rationale: यह भविष्य में दोबारा न देखने के अर्थ को स्वाभाविक हिंदी में स्पष्ट करता है।
theological_decisions:
- issue: ‘राज्य’ की पहचान
  choice: राज्य
  alternative: परमेश्वर का राज्य
  rationale: यद्यपि संदर्भ में परमेश्वर का राज्य अभिप्रेत हो सकता है, इस पद के SBLGNT पाठ में θεοῦ नहीं है; इसलिए अनिर्दिष्ट रूप को सुरक्षित रखा गया है।
- issue: पौलुस के कथन की निश्चितता
  choice: मैं जानता हूँ ... फिर कभी ... नहीं देखोगे
  alternative: मुझे लगता है कि ... शायद फिर नहीं देखोगे
  rationale: οἶδα और οὐκέτι को उनकी पूर्ण कथनात्मक शक्ति के साथ रखा गया है; कथन को अनुमान या संभावना में नरम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक संबोधन के अनुकूल रखी गई है। ‘तुम सब’ सामूहिक श्रोताओं को स्पष्ट करता है, और वाक्य-विन्यास गंभीर विदाई-संदर्भ की सहजता बनाए रखता है।
