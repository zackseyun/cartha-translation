source:
  edition: SBLGNT
  text: ὡς οὐδὲν ὑπεστειλάμην τῶν συμφερόντων τοῦ μὴ ἀναγγεῖλαι ὑμῖν καὶ διδάξαι ὑμᾶς δημοσίᾳ καὶ κατ’ οἴκους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/020.yaml
  text: how I did not shrink back from declaring to you anything that was profitable and teaching you publicly and from house to house,[a]
translation:
  language: hi
  text: कि जो कुछ तुम्हारे लिए लाभदायक था, उसे तुम्हें बताने और तुम्हें सार्वजनिक रूप से तथा घर-घर जाकर सिखाने से मैं पीछे नहीं हटा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ तुम्हारे लिए हितकर था, उसे तुम्हें बताने और तुम्हें सार्वजनिक रूप से तथा घर-घर जाकर सिखाने से मैंने अपने आप को नहीं रोका।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεστειλάμην
  choice: मैं पीछे नहीं हटा
  rationale: मध्यवाच्य रूप का अर्थ किसी काम से स्वयं को रोकना, पीछे हटना या संकोच करना हो सकता है। ‘पीछे नहीं हटा’ पौलुस की निर्भीक सेवकाई का मुहावरेदार और स्वाभाविक हिन्दी रूप है।
- source_word: τῶν συμφερόντων
  choice: जो कुछ तुम्हारे लिए लाभदायक था
  rationale: यह पद उन बातों को सूचित करता है जो श्रोताओं के हित में थीं। ‘लाभदायक’ मूल के व्यापक अर्थ को बनाए रखता है और इसे आर्थिक लाभ तक सीमित नहीं करता।
- source_word: τοῦ μὴ ἀναγγεῖλαι
  choice: बताने से
  rationale: नकार सहित आर्टिकुलर इनफिनिटिव उस कार्य को व्यक्त करता है जिससे पौलुस पीछे नहीं हटा। हिन्दी में ‘बताने से ... पीछे नहीं हटा’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀναγγεῖλαι
  choice: बताने
  rationale: क्रिया का अर्थ घोषणा करना, सूचना देना या अवगत कराना है। यहाँ ‘बताना’ सामान्य पाठक के लिए सहज है और आगे आने वाले ‘सिखाना’ से भिन्न किंतु संबंधित कार्य को दर्शाता है।
- source_word: διδάξαι
  choice: सिखाने
  rationale: διδάσκω का सीधा अर्थ ‘सिखाना’ है। इसे ‘बताने’ के साथ उसी मुख्य क्रिया ‘पीछे नहीं हटा’ के अधीन रखा गया है।
- source_word: δημοσίᾳ
  choice: सार्वजनिक रूप से
  rationale: यह खुले, सार्वजनिक परिवेश में किए गए शिक्षण को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατ’ οἴκους
  choice: घर-घर जाकर
  rationale: κατά के वितरणात्मक प्रयोग को यह रूप सुरक्षित रखता है और अलग-अलग घरों में की गई व्यक्तिगत सेवकाई का भाव देता है।
- source_word: ὡς
  choice: कि
  rationale: संदर्भ में ὡς पिछली बात के अंतर्गत पौलुस के आचरण का विवरण आरंभ करता है। स्वतंत्र पद-प्रस्तुति में ‘कि’ पूर्ववर्ती वाक्य से इसके संबंध को बनाए रखता है।
theological_decisions:
- issue: ‘लाभदायक’ का आशय
  choice: श्रोताओं के हित की हर बात, संदर्भ में मुख्यतः आत्मिक और पासबानी हित
  alternative: सामान्य व्यावहारिक रूप से लाभकारी बात
  rationale: संदर्भ पौलुस की इफिसुस में की गई सेवकाई का है, इसलिए आत्मिक हित प्रमुख है; फिर भी मुख्य पाठ व्यापक मूल अर्थ ‘लाभदायक’ को रखता है और अर्थ को किसी संकीर्ण धर्मवैज्ञानिक व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘लाभदायक’ मूल की व्यापकता बनाए रखता है; ‘घर-घर जाकर’ वितरणात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ में [a] चिह्न सम्मिलित है।
