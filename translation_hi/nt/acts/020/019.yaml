  text: δουλεύων τῷ κυρίῳ μετὰ πάσης ταπεινοφροσύνης ⸀καὶ δακρύων καὶ πειρασμῶν τῶν συμβάντων μοι ἐν ταῖς ἐπιβουλαῖς τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/019.yaml
  text: serving the Lord with all humility and with tears and trials that happened to me through the plots of the Jews[a][b].
translation:
  language: hi
  text: और मैं प्रभु की सेवा बड़ी विनम्रता, आँसुओं और उन परीक्षाओं के साथ करता रहा जो यहूदियों की साज़िशों के चलते मुझ पर आईं[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रलोभनों” अथवा “परीक्षणों”; यहाँ आशय विरोध से उत्पन्न बाहरी परीक्षाओं का है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात पौलुस के विरुद्ध साज़िश करने वाले कुछ विशिष्ट यहूदी विरोधी; यह सभी यहूदियों के बारे में कथन नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: δουλεύων
  choice: सेवा करता रहा
  rationale: वर्तमान कृदंत पौलुस की सेवकाई के निरंतर ढंग को बताता है। यहाँ स्वाभाविक हिन्दी में समर्पित सेवा का भाव प्रमुख है, दास-स्थिति पर विशेष बल नहीं।
- source_word: τῷ κυρίῳ
  choice: प्रभु की
  rationale: κύριος के पदवी-रूप को बिना अधिक स्पष्ट किए रखा गया है; प्रसंग में इसका संकेत प्रभु यीशु की ओर है।
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: पूरी दीनता से
  rationale: πάσης की व्यापक और प्रबल अर्थ-छाया को 'पूरी' व्यक्त करता है; 'दीनता' आधुनिक बाइबलीय हिन्दी में विनम्र आत्मभाव को स्वाभाविक ढंग से बताती है।
- source_word: δακρύων
  choice: आँसू बहाते हुए
  rationale: ठोस बहुवचन 'आँसू' की भावनात्मक सजीवता रखी गई है; हिन्दी में क्रियात्मक पदबंध अधिक स्वाभाविक है।
- source_word: πειρασμῶν
  choice: परीक्षाओं
  rationale: इस प्रसंग में शब्द बाहरी विरोध से उत्पन्न कठिन परीक्षाओं को सूचित करता है, पाप के प्रलोभन को नहीं; वैकल्पिक अर्थ फुटनोट में सुरक्षित है।
- source_word: τῶν συμβάντων μοι
  choice: जो ... मुझ पर आईं
  rationale: यह पदबंध उन परीक्षाओं को निर्दिष्ट करता है जो पौलुस के साथ घटीं; 'मुझ पर आईं' स्पष्ट और सहज हिन्दी है।
- source_word: ἐν ταῖς ἐπιβουλαῖς
  choice: साज़िशों के कारण
  rationale: ἐν यहाँ परिस्थितिजन्य अथवा कारण-साधन संबंध व्यक्त कर सकता है। हिन्दी में 'के कारण' उन साज़िशों और परीक्षाओं का संबंध स्पष्ट करता है, बिना मूल आशय बदलने के।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों की
  rationale: मूल का सीधा जातीय-सामुदायिक पद रखा गया है; तत्कालीन प्रसंग इसे पौलुस के विरुद्ध साज़िश करने वाले विशिष्ट यहूदी विरोधियों तक सीमित करता है, जिसकी स्पष्टता फुटनोट में दी गई है।
theological_decisions:
- issue: '''यहूदियों'' को सभी यहूदियों के विरुद्ध कथन समझे जाने की संभावना'
  choice: मुख्य पाठ में मूल के अनुरूप 'यहूदियों' रखा गया और प्रसंगगत सीमा फुटनोट में स्पष्ट की गई।
  alternative: '''यहूदी अगुवों'' अथवा ''यहूदिया के लोगों'''
  rationale: यूनानी पाठ Ἰουδαίων कहता है और तत्काल शब्दावली इसे केवल अगुवों तक सीमित नहीं करती। फिर भी संदर्भ सभी यहूदियों पर सार्वभौमिक आरोप नहीं, बल्कि पौलुस के विशिष्ट यहूदी विरोधियों की साज़िशों की ओर संकेत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। पद पिछले वाक्य पर निर्भर कृदंतीय संरचना है, इसलिए हिन्दी में प्रवाह के लिए 'और मैं ... करता रहा' प्रयोग किया गया। 'आँसू बहाते हुए' भाव को स्वाभाविक बनाता है, जबकि दोनों फुटनोट-चिह्न संबंधित कथन के अंत में मुख्य पाठ में उपस्थित हैं।
