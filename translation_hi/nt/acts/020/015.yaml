  text: κἀκεῖθεν ἀποπλεύσαντες τῇ ἐπιούσῃ κατηντήσαμεν ⸀ἄντικρυς Χίου, τῇ δὲ ἑτέρᾳ παρεβάλομεν εἰς ⸀Σάμον, τῇ ⸀δὲ ἐχομένῃ ἤλθομεν εἰς Μίλητον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/015.yaml
  text: And from there[a], after setting sail, on the next day we came opposite Chios; on the following day we touched at Samos[b]; and on the day after that we came to Miletus.
translation:
  language: hi
  text: और वहाँ से जहाज़ से रवाना होकर हम अगले दिन खियोस के सामने पहुँचे[a]। उसके अगले दिन हम सामोस में ठहरे[b], और फिर अगले दिन मिलेतुस पहुँचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खियोस के पार” अथवा “खियोस के निकट समुद्र में।” यूनानी शब्द द्वीप के सामने की स्थिति बताता है; इससे यह आवश्यक नहीं कि वे वहाँ किनारे पर उतरे हों।
    reason: lexical_alternative
  - marker: b
    text: या, “हम सामोस में जहाज़ लगाकर रुके।” यहाँ प्रयुक्त यूनानी क्रिया जहाज़ को किनारे या बंदरगाह पर लगाने, अथवा किसी स्थान पर रुकने के लिए प्रयुक्त समुद्री शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: वहाँ से
  rationale: κἀκεῖθεν में καί और ἐκεῖθεν दोनों निहित हैं। हिंदी में पूर्ववर्ती प्रसंग से संबंध और प्रस्थान-बिंदु को स्वाभाविक रूप से व्यक्त करने के लिए ‘वहाँ से’ पर्याप्त है; वाक्यक्रम स्वयं संयोजक भाव देता है।
- source_word: ἀποπλεύσαντες
  choice: जहाज़ खोलकर
  rationale: यह समुद्री यात्रा आरम्भ करने का बोध देने वाला क्रियाविशेषणीय कृदंत है। ‘जहाज़ खोलकर’ आधुनिक हिंदी में नौका के प्रस्थान का स्वाभाविक और संक्षिप्त वर्णन है।
- source_word: τῇ ἐπιούσῃ
  choice: अगले दिन
  rationale: कालवाचक दत्तिव अगले दिन को सूचित करता है; हिंदी में परसर्ग के बिना ‘अगले दिन’ सहज है।
- source_word: κατηντήσαμεν
  choice: पहुँचे
  rationale: यात्रा-वृत्तांत में क्रिया किसी स्थान या स्थिति तक पहुँचने का अर्थ देती है।
- source_word: ἄντικρυς Χίου
  choice: खियोस के सामने
  rationale: ἄντικρυς द्वीप के आमने-सामने या उसके सामने समुद्र में स्थिति बताता है, वहाँ उतरना आवश्यक रूप से नहीं।
- source_word: τῇ δὲ ἑτέρᾳ
  choice: उसके अगले दिन
  rationale: यह यात्रा के दिनों की क्रमिक अगली अवस्था को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: παρεβάλομεν εἰς Σάμον
  choice: सामोस में जा लगे
  rationale: समुद्री संदर्भ में παραβάλλω जहाज़ को किनारे या बंदरगाह पर लगाने अथवा वहाँ ठहरने का संकेत देता है; ‘जा लगे’ उस नौवहन-भाव को बनाए रखता है।
- source_word: τῇ δὲ ἐχομένῃ
  choice: फिर अगले दिन
  rationale: यह क्रम में उसके बाद आने वाले दिन को सूचित करता है; ‘फिर’ यात्रा की चरणबद्ध प्रगति स्पष्ट करता है।
- source_word: ἤλθομεν εἰς Μίλητον
  choice: मिलेतुस पहुँचे
  rationale: गंतव्य की ओर आने/पहुँचने का सामान्य यात्रा-वाचक अर्थ है; हिंदी में ‘पहुँचे’ अधिक स्वाभाविक है।
- source_word: Χίου / Σάμον / Μίλητον
  choice: खियोस / सामोस / मिलेतुस
  rationale: यूनानी स्थान-नामों का देवनागरी में स्रोत-आधारित लिप्यंतरण किया गया है।
