translation:
  language: hi
  text: 'वे सबसे अधिक उसकी उस बात से दुःखी थे जो उसने कही थी: “अब वे उसका मुख नहीं देखेंगे।”[a] फिर वे उसे जहाज़ तक पहुँचाने के लिए उसके साथ गए।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे अब उसका मुख देखनेवाले नहीं हैं।”
    reason: lexical_alternative
  - marker: b
    text: या, “वे उसे जहाज़ तक पहुँचाने गए।” मूल क्रिया सम्मानपूर्वक किसी के साथ जाकर उसे विदा करने का भाव भी रखती है।
    reason: lexical_alternative
