- source_word: ἐπὶ τῷ λόγῳ ᾧ εἰρήκει
  choice: उसकी इस बात से … कि उसने कहा था
  rationale: ग्रीक के ‘उस वचन पर जो उसने कहा था’ का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और पूर्वकालिकता बनाए रखता है।
- source_word: οὐκέτι μέλλουσιν
  choice: अब … फिर कभी … न देखेंगे
  rationale: οὐκέτι और μέλλω के संयुक्त भाव को भविष्य-सापेक्ष हिन्दी में सहज रूप से व्यक्त करता है; यहाँ संदर्भ स्थायी पुनर्मिलन-वियोग का संकेत देता है।
- source_word: τὸ πρόσωπον αὐτοῦ θεωρεῖν
  choice: उसका मुख … देखेंगे
  rationale: ‘उसका मुख देखना’ मूल की व्यक्तिगत और भावपूर्ण अभिव्यक्ति को बनाए रखता है।
- source_word: προέπεμπον
  choice: विदा करने … साथ गए
  rationale: क्रिया में किसी को सम्मानपूर्वक विदा करने के लिए उसके साथ जाने का भाव है; हिन्दी में यह संयुक्त अभिव्यक्ति सबसे स्वाभाविक है।
- source_word: εἰς τὸ πλοῖον
  choice: जहाज़ तक
  rationale: गंतव्य की ओर साथ जाने का भाव ‘जहाज़ तक’ से सहज रूप में प्रकट होता है।
