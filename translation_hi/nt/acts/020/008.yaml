- source_word: δὲ
  choice: अलग शब्द के रूप में अनूदित नहीं
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है। हिन्दी में स्वतंत्र ‘अब’ या ‘परन्तु’ जोड़ना अनावश्यक कालगत या विरोधात्मक अर्थ दे सकता है; वाक्य का प्रवाह बिना इसके स्वाभाविक है।
- source_word: λαμπάδες
  choice: दीपक
  rationale: λαμπάς का अर्थ दीपक या मशाल हो सकता है। घर के ऊपरी कमरे के भीतरी परिवेश में ‘दीपक’ अधिक सम्भावित और स्वाभाविक है।
- source_word: ἱκαναὶ
  choice: बहुत-से
  rationale: यहाँ ἱκανός दीपकों की पर्याप्त या बड़ी संख्या बताता है; ‘बहुत-से’ आधुनिक हिन्दी में सहज है और ‘पर्याप्त’ की अपेक्षा प्रसंगानुकूल है।
- source_word: ἐν τῷ ὑπερῴῳ
  choice: ऊपरी कमरे में
  rationale: ὑπερῷον घर के ऊपरी भाग में स्थित कमरे को दर्शाता है। ‘ऊपरी कमरा’ स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: οὗ
  choice: जिस ... वहाँ
  rationale: स्थानवाचक सम्बन्ध को हिन्दी की स्वाभाविक सम्बन्ध-सहसम्बन्ध रचना ‘जिस...वहाँ’ से व्यक्त किया गया है।
- source_word: συνηγμένοι
  choice: इकट्ठे थे
  rationale: पूर्ण निष्क्रिय कृदन्त समूह के पहले एकत्र हो चुकने और उस समय एकत्र अवस्था में होने को दर्शाता है; ‘इकट्ठे थे’ इस स्थिति को सहज रूप में व्यक्त करता है।
- source_word: ἦσαν
  choice: जल रहे थे
  rationale: दीपकों के विषय में केवल अस्तित्वसूचक ‘थे’ हिन्दी में सम्भव है, पर भीतरी कक्ष में उपस्थित दीपकों के अभिप्रेत प्रकाशमान होने को ‘जल रहे थे’ स्वाभाविक रूप से स्पष्ट करता है। यह प्रसंगगत अभिव्यक्ति है, स्रोत में अलग से ‘जलना’ क्रिया नहीं है।
