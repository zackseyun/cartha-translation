  text: συνείπετο δὲ ⸀αὐτῷ Σώπατρος ⸀Πύρρου Βεροιαῖος, Θεσσαλονικέων δὲ Ἀρίσταρχος καὶ Σεκοῦνδος, καὶ Γάϊος Δερβαῖος καὶ Τιμόθεος, Ἀσιανοὶ δὲ Τυχικὸς καὶ Τρόφιμος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/004.yaml
  text: And Sopater son of Pyrrhus[a], a Berean, accompanied him; and Aristarchus and Secundus from Thessalonica; and Gaius of Derbe, and Timothy[b]; and Tychicus and Trophimus from Asia.
translation:
  language: hi
  text: उसके साथ बेरिया निवासी पिर्रुस का पुत्र सोपात्रुस, थिस्सलुनीके के अरिस्तार्खुस और सिकुन्दुस, दिरबे का गयुस और तीमुथियुस, तथा आसिया प्रान्त[a] के तुखिकुस और त्रुफिमुस यात्रा कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् रोमी प्रान्त आसिया, आधुनिक एशिया महाद्वीप नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: συνείπετο
  choice: उसके साथ गया
  rationale: अपूर्ण भूतकालीन συνέπομαι यात्रा में किसी के साथ चलने को व्यक्त करता है; हिन्दी में ‘उसके साथ गया’ स्वाभाविक और संदर्भानुकूल है।
- source_word: Σώπατρος Πύρρου Βεροιαῖος
  choice: पिर्रुस का पुत्र, बेरिया निवासी सोपात्रुस
  rationale: Πύρρου को स्वाभाविक रूप से पितृनाम (‘पिर्रुस का पुत्र’) और Βεροιαῖος को भौगोलिक पहचान (‘बेरिया निवासी’) माना गया है।
- source_word: Θεσσαλονικέων
  choice: थिस्सलुनीके से
  rationale: मूल में बहुवचन संबंधकारक का शाब्दिक अर्थ ‘थिस्सलुनीकियों में से’ है; वर्तमान हिन्दी में नगर-मूल बताने के लिए ‘थिस्सलुनीके से’ अधिक सहज है।
- source_word: Γάϊος Δερβαῖος
  choice: दिरबे का गयुस
  rationale: Δερβαῖος गयुस की दिरबे से भौगोलिक संबद्धता बताता है।
- source_word: Ἀσιανοὶ
  choice: आसिया प्रदेश के
  rationale: यह आधुनिक महाद्वीप नहीं, रोमी प्रान्त आसिया को सूचित करता है; ‘प्रदेश’ जोड़ने से ऐतिहासिक अर्थ स्पष्ट होता है।
- source_word: δέ ... δέ ... δέ
  choice: और ... और ... और
  rationale: बार-बार आने वाला δέ सूची में अगले समूह जोड़ता है; हिन्दी में पुनरावृत्त ‘और’ इस संरचना को सहज रूप से रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज सूची-रचना रखी गई है। व्यक्तिनामों और स्थाननामों को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के निकट रखा गया है। अंतिम ‘भी उसके साथ थे’ हिन्दी में सूची को स्पष्ट करता है, यद्यपि यूनानी में साथ जाने वाली क्रिया आरम्भ में एक बार आती है।
