  text: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων συνηγμένων ⸀ἡμῶν κλάσαι ἄρτον ὁ Παῦλος διελέγετο αὐτοῖς, μέλλων ἐξιέναι τῇ ἐπαύριον, παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/007.yaml
  text: On the first day of the week[a], when we had gathered to break bread, Paul was speaking to them, intending to depart the next day[b], and he prolonged the message until midnight.
translation:
  language: hi
  text: सप्ताह के पहले दिन, जब हम रोटी तोड़ने के लिए इकट्ठे हुए थे[a], पौलुस उनसे बातचीत कर रहा था; अगले दिन प्रस्थान करने वाला होने के कारण[b], उसने अपनी बात आधी रात तक जारी रखी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रोटी तोड़ना’ साथ मिलकर भोजन करने का संकेत हो सकता है और इसमें प्रभु-भोज का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “पौलुस उनसे बातचीत कर रहा था, क्योंकि वह अगले दिन प्रस्थान करने वाला था, और उसने अपनी बात आधी रात तक जारी रखी।”
    reason: syntactic_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῇ μιᾷ τῶν σαββάτων
  choice: सप्ताह के पहले दिन
  rationale: यह यूनानी भाषा का प्रचलित मुहावरा है, जिसका अर्थ सप्ताह का पहला दिन है; शाब्दिक रूप से ‘सब्तों में से एक’ कहना हिन्दी में भ्रामक होगा। δέ का हल्का संयोजक भाव हिन्दी में अलग शब्द के बिना स्वाभाविक रूप से व्यक्त होता है।
- source_word: συνηγμένων ἡμῶν
  choice: जब हम ... इकट्ठे हुए थे
  rationale: यह वाक्य की परिस्थिति बताने वाली genitive absolute रचना है और प्रथम पुरुष बहुवचन के कथन-दृष्टिकोण को बनाए रखती है।
- source_word: κλάσαι ἄρτον
  choice: रोटी तोड़ने के लिए
  rationale: उद्देश्यसूचक infinitive और मूल मुहावरे दोनों को सुरक्षित रखा गया है; इसे केवल सामान्य भोजन या केवल प्रभु-भोज तक सीमित नहीं किया गया।
- source_word: διελέγετο αὐτοῖς
  choice: उनसे बातचीत कर रहा था
  rationale: अपूर्णकाल जारी क्रिया को दर्शाता है और διαλέγομαι में निहित संवादात्मक भाव को ‘बातचीत’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μέλλων ἐξιέναι τῇ ἐπαύριον
  choice: क्योंकि वह अगले दिन जाने वाला था
  rationale: μέλλων निकट भविष्य की मंशा या अपेक्षा बताता है। participle को यहाँ प्रसंगानुकूल कारणसूचक उपवाक्य के रूप में व्यक्त किया गया है, यद्यपि इसका संबंध परिस्थितिजन्य भी समझा जा सकता है।
- source_word: παρέτεινέν τε τὸν λόγον μέχρι μεσονυκτίου
  choice: इसलिए वह आधी रात तक बोलता रहा
  rationale: παρατείνω और λόγος का आशय उसके बोलने को लंबा खींचना है। वर्तमान हिन्दी में ‘बोलता रहा’ इसी जारी और विस्तारित कथन को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: आरंभिक मसीही सभा में ‘रोटी तोड़ने’ का अर्थ
  choice: ‘रोटी तोड़ने’ का मूल मुहावरा बनाए रखा गया है।
  alternative: ‘प्रभु-भोज मनाने’ या ‘साथ भोजन करने’ के रूप में स्पष्ट करना
  rationale: प्रेरितों के काम में यह पदबंध सामूहिक भोजन का संकेत दे सकता है और प्रभु-भोज की प्रतिध्वनि भी रख सकता है। मूल पाठ किसी एक अर्थ को स्पष्ट रूप से सीमित नहीं करता, इसलिए धार्मिक परंपराओं के बीच विवादित सूक्ष्मता को अनावश्यक रूप से हल नहीं किया गया।
- issue: μέλλων participle का वाक्यगत संबंध
  choice: इसे पौलुस के लंबे समय तक बोलने का कारण मानते हुए ‘क्योंकि ... इसलिए’ से व्यक्त किया गया है।
  alternative: ‘अगले दिन जाने का इरादा रखते हुए’ के रूप में केवल साथ की परिस्थिति बताना
  rationale: यूनानी participle कारणसूचक या सामान्य परिस्थितिजन्य दोनों रूपों में समझा जा सकता है। मुख्य पाठ स्वाभाविक हिन्दी में संभावित कारण-संबंध देता है और पादटिप्पणी वैकल्पिक संरचना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पौलुस’ हिन्दी बाइबलीय प्रयोग में परिचित नामरूप है। संवादात्मक διαλέγετο के लिए ‘बातचीत कर रहा था’ चुना गया है; ‘उपदेश दे रहा था’ कहकर क्रिया को एकतरफा या अधिक धार्मिक-तकनीकी अर्थ तक सीमित नहीं किया गया।
