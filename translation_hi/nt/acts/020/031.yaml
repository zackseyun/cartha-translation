source:
  edition: SBLGNT
  text: διὸ γρηγορεῖτε, μνημονεύοντες ὅτι τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/031.yaml
  text: Therefore stay alert[a], remembering that for three years, night and day, I did not stop admonishing each one with tears.
translation:
  language: hi
  text: इसलिए सतर्क रहो और यह याद रखो कि तीन वर्ष तक, रात-दिन, मैंने आँसुओं के साथ हर एक को समझाता और चेतावनी देता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले निष्कर्ष को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γρηγορεῖτε
  choice: सतर्क रहो
  rationale: वर्तमान काल की आज्ञा लगातार चौकसी का भाव रखती है; ‘सतर्क रहो’ आधुनिक हिन्दी में स्वाभाविक है और जागते रहने के रूपक का आशय स्पष्ट करता है।
- source_word: μνημονεύοντες
  choice: और यह याद रखो
  rationale: यूनानी कृदन्त मुख्य आज्ञा के साथ जुड़ी हुई निरन्तर क्रिया बताता है। हिन्दी में समन्वित आज्ञा वाक्य इस सम्बन्ध को सहज रूप से व्यक्त करता है।
- source_word: τριετίαν
  choice: तीन वर्ष तक
  rationale: कालावधि सूचक कर्मकारक को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: νύκτα καὶ ἡμέραν
  choice: रात-दिन
  rationale: मूल क्रम और निरन्तर सेवा के भाव को संक्षिप्त हिन्दी मुहावरे में सुरक्षित रखता है।
- source_word: οὐκ ἐπαυσάμην
  choice: मैंने ... नहीं छोड़ा
  rationale: यह पौलुस के बिना रुके कार्य करते रहने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μετὰ δακρύων
  choice: आँसुओं के साथ
  rationale: मूल में आँसुओं की संगति और सेवकाई की भावनात्मक तीव्रता दोनों बनी रहती हैं।
- source_word: νουθετῶν
  choice: समझाना-बुझाना
  rationale: यह शब्द मन को संबोधित करने वाली शिक्षा, सुधार और चेतावनी का संयुक्त भाव रखता है। ‘समझाना-बुझाना’ सामान्य हिन्दी में उसके व्यक्तिगत और सुधारात्मक स्वर को व्यक्त करता है।
- source_word: ἕνα ἕκαστον
  choice: हर एक को
  rationale: यह प्रत्येक व्यक्ति पर दिए गए अलग-अलग ध्यान के वितरणात्मक बल को बनाए रखता है।
theological_decisions:
- issue: νουθετῶν का पासबानी और सुधारात्मक बल
  choice: समझाना-बुझाना
  alternative: चेतावनी देना
  rationale: मुख्य पाठ का चयन शिक्षा और सुधार दोनों को समेटता है, जबकि पादटिप्पणी स्पष्ट करती है कि यूनानी क्रिया में चेतावनी का अधिक प्रबल भाव भी हो सकता है; इस प्रकार किसी एक पक्ष को अनावश्यक रूप से निर्णायक नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सतर्क रहो’ निरन्तर चौकसी को, और ‘समझाना-बुझाना’ व्यक्तिगत, भावपूर्ण तथा सुधारात्मक सेवकाई को व्यक्त करता है।
