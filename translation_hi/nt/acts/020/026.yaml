  text: ⸀διότι μαρτύρομαι ὑμῖν ἐν τῇ σήμερον ἡμέρᾳ ὅτι καθαρός ⸀εἰμι ἀπὸ τοῦ αἵματος πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/026.yaml
  text: Therefore I testify to you on this day that I am innocent of the blood of all[a][b].
translation:
  language: hi
  text: इसलिए मैं आज के दिन तुमसे गवाही देता हूँ कि मैं सबके लहू से निर्दोष हूँ[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं सबके लहू से शुद्ध हूँ”; यूनानी मुहावरे का अर्थ दूसरों के विषय में दोष या उत्तरदायित्व से मुक्त होना है।
    reason: lexical_alternative
  - marker: b
    text: यह कथन संभवतः यहेजकेल में पहरेदार और रक्त-दोष की छवि की ओर संकेत करता है (यहेजकेल 3:18–19; 33:6–9)।
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्ष निकालता है और हिन्दी में प्रसंग का तार्किक संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: μαρτύρομαι ὑμῖν
  choice: मैं तुम्हारे सामने गवाही देता हूँ
  rationale: क्रिया की गंभीर, व्यक्तिगत साक्ष्य देने की शक्ति को बनाए रखता है; ‘तुम्हारे सामने’ दत्तिव के श्रोतृ-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῇ σήμερον ἡμέρᾳ
  choice: आज के दिन
  rationale: साधारण ‘आज’ की तुलना में मूल अभिव्यक्ति का गंभीर और औपचारिक स्वर सुरक्षित रखता है।
- source_word: καθαρός εἰμι
  choice: मैं ... निर्दोष हूँ
  rationale: ‘शुद्ध/साफ़’ की शाब्दिकता के बजाय इस प्रसंग में दोष या उत्तरदायित्व से मुक्त होने का नैतिक-कानूनी अर्थ स्पष्ट करता है।
- source_word: ἀπὸ τοῦ αἵματος πάντων
  choice: सबके खून से
  rationale: मूल रूपक और व्यापक ‘सब’ को बनाए रखता है; ‘से निर्दोष’ हिन्दी में दोषमुक्ति का अर्थ स्वाभाविक ढंग से देता है।
theological_decisions:
- issue: ‘सबके खून से निर्दोष’ का आशय
  choice: पौलुस दूसरों के विषय में अपने चेतावनी और शिक्षा देने के दायित्व को पूरा करने के कारण उनके विनाश के दोष या उत्तरदायित्व से मुक्त होने की घोषणा करता है।
  alternative: इसे केवल किसी की शारीरिक मृत्यु में प्रत्यक्ष सहभागिता से निर्दोष होने का संकीर्ण कथन मानना।
  rationale: प्रसंग में परमेश्वर की पूरी योजना बताने की पौलुस की निष्ठा और यहेजकेल के पहरेदार से जुड़ी रक्त-दोष की पृष्ठभूमि व्यापक उत्तरदायित्व का संकेत देती है; अनुवाद रूपक को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सार्वजनिक गवाही का स्वर रखा गया है। ‘खून’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पदटिप्पणी मुहावरे का नैतिक और शास्त्रीय संदर्भ स्पष्ट करती है।
