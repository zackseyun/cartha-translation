source:
  edition: SBLGNT
  text: ἀναβὰς δὲ καὶ κλάσας ⸀τὸν ἄρτον καὶ γευσάμενος ἐφ’ ἱκανόν τε ὁμιλήσας ἄχρι αὐγῆς, οὕτως ἐξῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/011.yaml
  text: Then he went upstairs[a], broke the bread, and ate; and after talking for a long time, until dawn[b], he departed.
translation:
  language: hi
  text: फिर वह ऊपर गया, रोटी तोड़ी[a] और खाया[b]; और भोर तक बहुत देर बातचीत करने के बाद, इस प्रकार वह चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘रोटी तोड़ी।’ यूनानी अभिव्यक्ति केवल साथ मिलकर भोजन करने का अर्थ भी दे सकती है, यद्यपि कुछ लोग इसमें प्रभु-भोज भी सम्मिलित मानते हैं।
    reason: alternative_reading
  - marker: b
    text: या, ‘चखा’ या ‘भोजन किया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβὰς
  choice: ऊपर गया
  rationale: यह ἀναβαίνω का एओरिस्ट कृदंत है और प्रसंग में पौलुस के नीचे जाने के बाद फिर ऊपरी कमरे में चढ़ने को दर्शाता है। हिंदी में ‘ऊपर गया’ स्थानगत गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κλάσας τὸν ἄρτον
  choice: रोटी तोड़ी
  rationale: यूनानी में ‘रोटी’ के साथ निश्चित उपपद है। ‘रोटी तोड़ी’ ठोस क्रिया को बनाए रखता है, पर यह तय नहीं करता कि यहाँ साधारण भोजन, संगति-भोज या प्रभु-भोज अभिप्रेत है।
- source_word: γευσάμενος
  choice: खाई
  rationale: γεύομαι का मूल अर्थ ‘चखना’ हो सकता है, किंतु भोजन के प्रसंग में इसका अर्थ खाना अथवा भोजन ग्रहण करना भी है। ‘खाई’ वर्तमान हिंदी में स्वाभाविक है और केवल थोड़ा-सा चखने का भ्रामक संकेत नहीं देता।
- source_word: ἐφ’ ἱκανόν
  choice: बहुत देर तक
  rationale: यह मुहावरा पर्याप्त या लंबी अवधि को व्यक्त करता है। ‘बहुत देर तक’ स्पष्ट और स्वाभाविक हिंदी है।
- source_word: ὁμιλήσας
  choice: बातचीत करने के बाद
  rationale: ὁμιλέω यहाँ लंबे संवाद या वार्तालाप को दर्शाता है। ‘बातचीत’ केवल औपचारिक उपदेश का अर्थ आरोपित किए बिना पारस्परिक संवाद की संभावना बनाए रखता है।
- source_word: ἄχρι αὐγῆς
  choice: भोर होने तक
  rationale: αὐγή भोर या दिन निकलने के समय को दर्शाता है। ‘भोर होने तक’ आधुनिक हिंदी में स्पष्ट है।
- source_word: οὕτως ἐξῆλθεν
  choice: वह वहाँ से चला गया
  rationale: ἐξῆλθεν का अर्थ निकलना या चले जाना है; οὕτως पिछली घटनाओं के क्रम से इसे जोड़ता है। हिंदी में ‘वहाँ से चला गया’ कथानक का परिणाम स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: क्या κλάσας τὸν ἄρτον को प्रभु-भोज का स्पष्ट उल्लेख मानकर अनूदित किया जाए
  choice: ‘रोटी तोड़ी’ के रूप में तटस्थ अनुवाद
  alternative: इसे प्रभु-भोज का तकनीकी उल्लेख मानना, अथवा केवल साधारण/साझे भोजन का उल्लेख मानना
  rationale: प्रेरितों के काम में यह अभिव्यक्ति प्रभु-भोज से जुड़ी हो सकती है, पर यह पद स्वयं किसी एक अर्थ को निर्विवाद रूप से निश्चित नहीं करता। इसलिए अनुवाद मूल पाठ की अस्पष्टता और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सहज और गरिमापूर्ण रखी गई है। वाक्य का क्रम यूनानी घटनाक्रम के निकट है, लेकिन हिंदी की स्वाभाविकता के लिए कृदंतों को क्रमबद्ध क्रियाओं और ‘के बाद’ की रचना में व्यक्त किया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ स्वयं मूल की अर्थगत खुली संभावना को बनाए रखता है।
