id: ACT.20.30
reference: Acts 20:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες λαλοῦντες διεστραμμένα τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω ⸀ἑαυτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/030.yaml
  text: and from among your own selves men will arise[a], speaking twisted things, to draw away the disciples after themselves.
translation:
  language: hi
  text: और तुम्हारे अपने ही बीच से पुरुष उठ खड़े होंगे, जो विकृत बातें कहेंगे[a], ताकि चेलों को अपने पीछे खींच लें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “टेढ़ी बातें” अथवा “तोड़ी-मरोड़ी बातें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: तुम्हारे अपने ही बीच से
  rationale: ἐξ तथा αὐτῶν का बल इस बात पर है कि संकट समुदाय के बाहर से नहीं, बल्कि उन्हीं के अपने बीच से उत्पन्न होगा। हिंदी में ‘अपने ही’ इस बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἀναστήσονται
  choice: उठ खड़े होंगे
  rationale: यहाँ क्रिया का भाव ऐसे लोगों के उभरने या सामने आने का है। ‘उठ खड़े होंगे’ भविष्यसूचक बल और सक्रिय विरोध—दोनों को सहज हिंदी में व्यक्त करता है।
- source_word: ἄνδρες
  choice: पुरुष
  rationale: ग्रीक संज्ञा विशेष रूप से पुरुषों को दर्शाती है; इसलिए इसे लिंग-निरपेक्ष ‘लोग’ से नहीं बदला गया।
- source_word: λαλοῦντες
  choice: जो ... बातें कहेंगे
  rationale: कृदंत उनकी बोलने की गतिविधि बताता है। हिंदी में संबंधवाचक उपवाक्य पद्य को स्पष्ट और स्वाभाविक बनाता है।
- source_word: διεστραμμένα
  choice: विकृत बातें
  rationale: यह नपुंसकलिंग बहुवचन रूप संज्ञा के समान प्रयुक्त होकर ऐसी बातों को बताता है जिन्हें सत्य या सीधे मार्ग से मोड़ दिया गया है। ‘विकृत’ doctrinal और नैतिक—दोनों प्रकार के भटकाव की व्यापकता को खुला रखता है।
- source_word: τοῦ ἀποσπᾶν
  choice: ताकि ... खींच लें
  rationale: τοῦ के साथ infinitive उद्देश्य व्यक्त करता है। ‘ताकि’ इस प्रयोजन को स्पष्ट करता है और ‘खींच लें’ ἀποσπάω में निहित अलग कर ले जाने के रूपक को बनाए रखता है।
- source_word: τοὺς μαθητὰς
  choice: चेलों को
  rationale: प्रेरितों के काम में μαθηταί यीशु के चेलों के लिए स्थापित पद है। ‘चेले’ हिंदी बाइबलीय प्रयोग में परिचित और सामान्य पाठक के लिए सुबोध है।
- source_word: ὀπίσω ἑαυτῶν
  choice: अपने पीछे
  rationale: यह मुहावरा उन पुरुषों के पीछे चलने और उनके प्रति निष्ठा रखने का भाव देता है। ‘अपने पीछे’ निजी अनुयायी बनाने के आशय को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: झूठे शिक्षकों की बातों का स्वरूप
  choice: विकृत बातें
  alternative: टेढ़ी बातें; तोड़ी-मरोड़ी बातें
  rationale: मूल पाठ किसी खास विधर्म या केवल नैतिक भ्रष्टता को निर्दिष्ट नहीं करता। ‘विकृत बातें’ चेतावनी को व्यापक रखती हैं और अनावश्यक रूप से उसका अर्थ सीमित नहीं करतीं।
- issue: ἄνδρες का लिंग-सूचक अनुवाद
  choice: पुरुष
  alternative: लोग; व्यक्ति
  rationale: मूल ग्रीक शब्द पुरुषवाचक है। ‘पुरुष’ उसका लिंग-सूचक अर्थ सुरक्षित रखता है, जबकि ‘लोग’ या ‘व्यक्ति’ उसे तटस्थ कर देते।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तुम्हारे अपने ही बीच से’ आंतरिक संकट पर दिए गए बल को दर्शाता है; ‘अपने पीछे खींच लें’ निजी अनुयायी बनाने के उद्देश्य को सहज हिंदी में व्यक्त करता है।
