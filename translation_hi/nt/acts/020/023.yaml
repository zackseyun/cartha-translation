  text: πλὴν ὅτι τὸ πνεῦμα τὸ ἅγιον κατὰ πόλιν διαμαρτύρεταί ⸀μοι λέγον ὅτι δεσμὰ ⸂καὶ θλίψεις με⸃ μένουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/023.yaml
  text: except that the Holy Spirit testifies to me in city after city[c][b][a], saying that chains and afflictions await me.
translation:
  language: hi
  text: सिवाय इसके कि पवित्र आत्मा नगर-नगर में[a][c] मुझे यह गवाही देता है कि बेड़ियाँ और क्लेश मेरी प्रतीक्षा कर रहे हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक नगर से दूसरे नगर में,” अथवा “हर नगर में।” यूनानी मुहावरा वितरणात्मक है और क्रमशः विभिन्न नगरों में बार-बार दी गई गवाही का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: “बेड़ियाँ” के लिए “बंधन” भी अनुवाद किया जा सकता है। “बेड़ियाँ” यूनानी के ठोस बिंब को बनाए रखता है, जबकि “बंधन” अधिक पारंपरिक रूप है।
    reason: lexical_alternative
  - marker: c
    text: कुछ पांडुलिपियों में “क्लेशों” के साथ “मेरी” के स्थान या उसकी उपस्थिति को लेकर थोड़ा पाठांतर है; फिर भी आशय यही रहता है कि बेड़ियाँ और क्लेश पौलुस की प्रतीक्षा कर रहे हैं।
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν ὅτι
  choice: सिवाय इसके कि
  rationale: यह पिछले कथन पर एकमात्र अपवाद या सीमा प्रस्तुत करता है और यूनानी पदबंध के विरोधात्मक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: दिव्य आत्मा के लिए आधुनिक मानक हिन्दी में प्रचलित और गरिमापूर्ण पद।
- source_word: κατὰ πόλιν
  choice: नगर-नगर में
  rationale: κατά के वितरणात्मक प्रयोग को व्यक्त करता है—एक के बाद दूसरे नगर में बार-बार—पर इसे अनिवार्य रूप से हर एक नगर तक विस्तृत नहीं करता।
- source_word: διαμαρτύρεταί μοι
  choice: मुझे गवाही देकर
  rationale: क्रिया के गंभीर और दृढ़ साक्ष्य देने के भाव को रखता है; केवल 'चेतावनी देता है' कहना भविष्यवाणी-संबंधी कथन को आवश्यकता से अधिक व्याख्यायित करता।
- source_word: λέγον
  choice: कहता है
  rationale: वर्तमान कृदंत द्वारा प्रस्तुत गवाही की विषयवस्तु को सहज हिन्दी वाक्य में व्यक्त करता है।
- source_word: δεσμὰ
  choice: बेड़ियाँ
  rationale: कैद को अमूर्त रूप में कहने के बजाय यूनानी के ठोस बंधन या जंजीर के बिंब को बनाए रखता है।
- source_word: θλίψεις
  choice: क्लेश
  rationale: दबाव, विपत्ति और दुःख की गंभीरता को संक्षिप्त, बाइबिल-सुलभ और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: με
  choice: मेरी
  rationale: प्रकाशित यूनानी पाठ में कर्मवाचक सर्वनाम पौलुस को उस व्यक्ति के रूप में स्पष्ट करता है जिसकी प्रतीक्षा बेड़ियाँ और क्लेश कर रहे हैं। हिन्दी में 'मेरी प्रतीक्षा' स्वाभाविक रूप है।
- source_word: μένουσιν
  choice: प्रतीक्षा कर रहे हैं
  rationale: संदर्भ में भाव यह है कि ये बातें पौलुस के लिए आगे निश्चित रूप से रखी हुई हैं; यह चयन उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘पवित्र आत्मा’ का संदर्भ और कर्तृत्व
  choice: पवित्र आत्मा को पौलुस से गवाही देकर बोलने वाले व्यक्तिगत दिव्य कर्ता के रूप में प्रस्तुत किया गया है।
  alternative: इसे मात्र एक अवैयक्तिक आत्मिक प्रभाव समझना।
  rationale: पाठ स्वयं पवित्र आत्मा को गवाही देने और कहने का कार्य सौंपता है। अनुवाद इस व्यक्तिगत कर्तृत्व को बनाए रखता है, पर पद से आगे कोई अतिरिक्त सैद्धांतिक विवरण नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। “नगर-नगर में” पुनरावृत्ति का भाव सहजता से देता है; “बेड़ियाँ और क्लेश” मूल के ठोस बिंब और गंभीरता दोनों को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
