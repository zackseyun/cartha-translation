  yaml_path: translation/nt/acts/020/005.yaml
  text: These men went on ahead and were waiting for us in Troas[a].
translation:
  language: hi
  text: ये लोग आगे जाकर त्रोआस में हमारी प्रतीक्षा कर रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτοι
  choice: ये लोग
  rationale: पुल्लिंग बहुवचन संकेतवाचक सर्वनाम पहले बताए गए सहयात्रियों की ओर संकेत करता है; ‘ये लोग’ आधुनिक हिन्दी में संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: δὲ
  choice: —
  rationale: यह हल्का संयोजक है; यहाँ हिन्दी में अलग संयोजक जोड़ना आवश्यक नहीं और उसे अव्यक्त रखने से प्रवाह स्वाभाविक रहता है।
- source_word: προσελθόντες
  choice: आगे जाकर
  rationale: यात्रा-वृत्तांत के संदर्भ में कृदंत का आशय कथावाचक के दल से पहले त्रोआस पहुँचने से है; ‘आगे जाकर’ इस पूर्ववर्ती क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: ἔμενον
  choice: प्रतीक्षा कर रहे थे
  rationale: μένω का मूल अर्थ ‘ठहरना/बने रहना’ है, पर व्यक्ति-वाचक कर्म ἡμᾶς के साथ यहाँ किसी के आने की प्रतीक्षा करना अभिप्रेत है; अपूर्ण भूतकाल की जारी अवस्था भी इस रूप में सुरक्षित रहती है।
- source_word: ἡμᾶς
  choice: हमारी
  rationale: प्रथम पुरुष बहुवचन सर्वनाम को हिन्दी में ‘प्रतीक्षा करना’ की स्वाभाविक संरचना के अनुसार संबंधकारक ‘हमारी’ से व्यक्त किया गया है।
- source_word: ἐν Τρῳάδι
  choice: त्रोआस में
  rationale: ἐν तथा स्थानवाचक दत्तिव का सीधा और स्वाभाविक स्थानसूचक अनुवाद।
