  text: ποιήσας τε μῆνας τρεῖς· γενομένης ⸂ἐπιβουλῆς αὐτῷ⸃ ὑπὸ τῶν Ἰουδαίων μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν ἐγένετο ⸀γνώμης τοῦ ὑποστρέφειν διὰ Μακεδονίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/003.yaml
  text: After spending three months there[a], when a plot was made against him by the Jews as he was about to sail for Syria[d][c][b], he decided to return through Macedonia.
translation:
  language: hi
  text: वहाँ तीन महीने बिताने के बाद, जब वे सीरिया के लिए जहाज़ से रवाना होने वाले थे, तब यहूदियों[a] ने उनके विरुद्ध षड्यंत्र रचा। इसलिए उन्होंने मकिदुनिया होकर लौटने का निश्चय किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “यहूदियों” से प्रसंग में पौलुस का विरोध करनेवाला एक विशेष समूह अभिप्रेत है, न कि बिना भेद किए सभी यहूदी लोग।
    reason: cultural_note
lexical_decisions:
- source_word: ποιήσας τε μῆνας τρεῖς
  choice: वहाँ तीन महीने बिताने के बाद
  rationale: समयावधि के साथ ποιέω का अर्थ यहाँ किसी अवधि को बिताना है। पिछले पद के संदर्भ से स्थानसूचक ‘वहाँ’ स्वाभाविक रूप से जोड़ा गया है।
- source_word: γενομένης ἐπιβουλῆς αὐτῷ
  choice: उनके विरुद्ध षड्यंत्र रचा
  rationale: ἐπιβουλή किसी हानिकारक गुप्त योजना या षड्यंत्र को दर्शाता है। कर्तृवाच्य हिंदी वाक्य स्वाभाविक है और अगले पदांश में दिए कर्ता को स्पष्ट रखता है।
- source_word: ὑπὸ τῶν Ἰουδαίων
  choice: यहूदियों ने
  rationale: यूनानी पाठ में जातिवाचक संज्ञा स्पष्ट रूप से है; मुख्य पाठ में उसे बनाए रखा गया है, जबकि संदर्भगत सीमा पादटिप्पणी में स्पष्ट की गई है।
- source_word: μέλλοντι ἀνάγεσθαι εἰς τὴν Συρίαν
  choice: जब वे सीरिया के लिए जहाज़ से रवाना होनेवाले थे
  rationale: μέλλω आसन्न कार्य और ἀνάγομαι इस यात्रा-संदर्भ में समुद्री प्रस्थान को व्यक्त करता है।
- source_word: ἐγένετο γνώμης τοῦ ὑποστρέφειν
  choice: उन्होंने लौटने का निश्चय किया
  rationale: ἐγένετο γνώμης निर्णय या संकल्प पर पहुँचने का मुहावरा है; हिंदी में ‘निश्चय किया’ गरिमापूर्ण और सहज है।
- source_word: διὰ Μακεδονίας
  choice: मकिदुनिया होकर
  rationale: संबंधकारक के साथ διά यात्रा का मार्ग बताता है; ‘होकर’ इसका स्वाभाविक हिंदी समतुल्य है।
theological_decisions:
- issue: संघर्ष-वर्णन में ‘यहूदियों’ का संदर्भ
  choice: मुख्य पाठ में ‘यहूदियों’ रखा और पादटिप्पणी में संदर्भगत सीमा स्पष्ट की
  alternative: ‘कुछ यहूदियों’ या ‘यहूदी विरोधियों’ कहना
  rationale: मूल पाठ οἱ Ἰουδαῖοι को स्पष्ट रूप से रखता है, पर प्रसंग किसी विशिष्ट विरोधी समूह की ओर संकेत करता है, समस्त यहूदी लोगों की ओर नहीं। मुख्य पाठ में ‘कुछ’ जोड़ना मूल से अधिक निश्चित व्याख्या होती।
translation_notes:
  register: आधुनिक मानक हिंदी; कथात्मक प्रवाह के लिए लंबे यूनानी वाक्य को दो वाक्यों में बाँटा गया है। पौलुस के लिए आदरसूचक बहुवचन रखा गया है। ‘मकिदुनिया’ बाइबलीय स्थान-नाम की प्रचलित हिंदी वर्तनी है।
