  text: ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς· Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/018.yaml
  text: When they came to him[a], he said to them[b], “You yourselves know how I lived among you the whole time from the first day that I set foot in Asia,”
translation:
  language: hi
  text: जब वे उसके पास आए, तो उसने उनसे कहा, “तुम स्वयं जानते हो कि आसिया[a] में मेरे कदम रखने के पहले दिन से ही मैं पूरे समय तुम्हारे बीच किस प्रकार रहा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “आसिया” से आधुनिक महाद्वीप एशिया नहीं, बल्कि पश्चिमी एशिया माइनर का रोमी प्रांत अभिप्रेत है।
    reason: cultural_note
  - marker: b
    text: या, “उस पूरे समय मैं तुम्हारे साथ कैसा रहा।” यूनानी अभिव्यक्ति पौलुस की जीवन-रीति या उनके बीच उसकी निरंतर उपस्थिति—दोनों पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγένοντο πρὸς αὐτόν
  choice: वे उसके पास आए
  rationale: यह वाक्यांश इफिसुस के प्राचीनों के पौलुस के पास पहुँचने को व्यक्त करता है; आधुनिक हिन्दी में यह सहज और संबंधपरक है।
- source_word: Ὑμεῖς ἐπίστασθε
  choice: तुम स्वयं जानते हो
  rationale: अलग से प्रयुक्त सर्वनाम Ὑμεῖς के बल को ‘स्वयं’ सुरक्षित रखता है, और ἐπίστασθε के लिए ‘जानते हो’ स्पष्ट तथा स्वाभाविक है।
- source_word: ἀπὸ πρώτης ἡμέρας ἀφ’ ἧς
  choice: जिस पहले दिन से
  rationale: यह पौलुस के आचरण और उपस्थिति के आरंभ-बिंदु को सटीक रूप से व्यक्त करता है।
- source_word: ἐπέβην εἰς τὴν Ἀσίαν
  choice: मैंने आसिया में कदम रखा
  rationale: ‘कदम रखा’ यूनानी क्रिया की सजीवता बनाए रखता है; ‘आसिया’ प्राचीन रोमी प्रांत का नाम है, जिसकी पहचान पाद-टिप्पणी में स्पष्ट की गई है।
- source_word: μεθ’ ὑμῶν τὸν πάντα χρόνον ἐγενόμην
  choice: उस पूरे समय मैं तुम्हारे बीच किस तरह रहा
  rationale: यह अवधि, सामुदायिक निकटता और πῶς द्वारा सूचित जीवन-रीति को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘रहा’ मूल अभिव्यक्ति की संभावित उपस्थिति-संबंधी छाया भी बनाए रखता है।
