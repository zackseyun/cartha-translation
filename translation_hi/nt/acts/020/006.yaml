  text: ἡμεῖς δὲ ἐξεπλεύσαμεν μετὰ τὰς ἡμέρας τῶν ἀζύμων ἀπὸ Φιλίππων, καὶ ἤλθομεν πρὸς αὐτοὺς εἰς τὴν Τρῳάδα ἄχρι ἡμερῶν πέντε, ⸀οὗ διετρίψαμεν ἡμέρας ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/006.yaml
  text: But we sailed away from Philippi after the days of Unleavened Bread[a], and came to them at Troas within five days, where we stayed seven days.
translation:
  language: hi
  text: पर हम अख़मीरी रोटी के दिनों के बाद फ़िलिप्पी से जहाज़ पर रवाना हुए और पाँच दिनों में[a] त्रोआस में उनके पास पहुँचे। वहाँ हम सात दिन ठहरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पाँच दिनों के भीतर।” यूनानी अभिव्यक्ति आगमन तक की यात्रा की अवधि बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλεύσαμεν
  choice: जहाज़ पर रवाना हुए
  rationale: ἐκπλέω जहाज़ से प्रस्थान करने को बताता है; यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक रूप से समुद्री यात्रा का आरम्भ व्यक्त करती है।
- source_word: μετὰ τὰς ἡμέρας τῶν ἀζύμων
  choice: अख़मीरी रोटी के दिनों के बाद
  rationale: मूल यूनानी में पर्व का नाम जोड़े बिना शाब्दिक रूप से ‘अख़मीरी रोटी के दिनों के बाद’ है; यह यहूदी पर्व-अवधि का पारंपरिक और समझने योग्य संकेत है।
- source_word: ἀπὸ Φιλίππων
  choice: फ़िलिप्पी से
  rationale: ἀπό यहाँ प्रस्थान-बिंदु बताता है; नगर का प्रचलित हिन्दी रूप ‘फ़िलिप्पी’ रखा गया है।
- source_word: ἤλθομεν πρὸς αὐτοὺς
  choice: उनके पास पहुँचे
  rationale: πρός के साथ यह वाक्यांश व्यक्तियों की ओर जाकर उनके पास पहुँचने को दर्शाता है; ‘पहुँचे’ यात्रा की पूर्णता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὴν Τρῳάδα
  choice: त्रोआस में
  rationale: गन्तव्य को हिन्दी में ‘पहुँचे’ के साथ स्थानवाचक ‘में’ द्वारा सहज रूप से व्यक्त किया गया है।
- source_word: ἄχρι ἡμερῶν πέντε
  choice: पाँच दिनों में
  rationale: यह अभिव्यक्ति आगमन तक यात्रा की पाँच दिन की अवधि बताती है; ‘पाँच दिनों में’ मूल कालावधि को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: οὗ
  choice: वहाँ
  rationale: सम्बन्धवाचक क्रियाविशेषण का संकेत त्रोआस की ओर है; नए हिन्दी वाक्य में ‘वहाँ’ स्वाभाविक है।
- source_word: διετρίψαμεν ἡμέρας ἑπτά
  choice: हम सात दिन ठहरे
  rationale: διατρίβω यात्रा-वृत्तान्त में किसी स्थान पर समय बिताने या ठहरने को दर्शाता है; ‘ठहरे’ संक्षिप्त और स्वाभाविक है।
