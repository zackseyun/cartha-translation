translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज कथात्मक हिन्दी। 'पैदल' को मुख्य पाठ में रखा गया है क्योंकि πεζεύειν का सामान्य विशिष्ट अर्थ यही है; व्यापक 'स्थल-मार्ग से' पादटिप्पणी में सुरक्षित है। सभी पादटिप्पणी-चिह्न सम्बन्धित वाक्यांशों के तुरंत बाद दिए गए हैं।
