source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ ⸀προελθόντες ⸀ἐπὶ τὸ πλοῖον ἀνήχθημεν ἐπὶ τὴν Ἆσσον, ἐκεῖθεν μέλλοντες ἀναλαμβάνειν τὸν Παῦλον, οὕτως γὰρ ⸂διατεταγμένος ἦν⸃ μέλλων αὐτὸς πεζεύειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/013.yaml
  text: But we[a], having gone ahead to the ship, set sail for Assos, intending to take Paul on board from there, for so he had arranged[b], since he himself intended to go by land.
translation:
  language: hi
  text: परन्तु हम पहले निकलकर जहाज़ पर चढ़े और अस्सुस के लिए रवाना हुए। हमारा इरादा था कि वहाँ से पौलुस को जहाज़ पर ले लें, क्योंकि उसने ऐसा ही प्रबंध किया था,[a] क्योंकि वह स्वयं पैदल जाने का इरादा रखता था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि ऐसा ही प्रबंध किया गया था।” यूनानी अभिव्यक्ति औपचारिक रूप से कर्मवाच्य है, यद्यपि सन्दर्भ में पौलुस की अपनी व्यवस्था या हिदायत का भाव सम्भावित है।
    reason: alternative_reading
  - marker: b
    text: या, “वह स्वयं स्थल-मार्ग से जाने का इरादा रखता था।” यूनानी क्रिया विशेष रूप से दल की समुद्री यात्रा के विपरीत स्थल-यात्रा, सामान्यतः पैदल यात्रा, का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθόντες
  choice: आगे जाकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई कार्रवाई और पौलुस से पहले दल के निकलने का भाव व्यक्त करता है।
- source_word: ἐπὶ τὸ πλοῖον
  choice: जहाज़ पर चढ़े
  rationale: गति के साथ ἐπί जहाज़ पर सवार होने का संकेत देता है; हिन्दी में इसे स्पष्ट करना स्वाभाविक है।
- source_word: ἀνήχθημεν
  choice: रवाना हुए
  rationale: यह समुद्री यात्रा के प्रसंग में जहाज़ से प्रस्थान करने के अर्थ में प्रयुक्त है; निकटवर्ती 'जहाज़ पर चढ़े' से नौकायन स्पष्ट है।
- source_word: ἐπὶ τὴν Ἆσσον
  choice: अस्सुस के लिए
  rationale: गंतव्य को स्वाभाविक हिन्दी में व्यक्त करता है और यूनानी स्थान-नाम का निकट लिप्यंतरण रखता है।
- source_word: μέλλοντες ἀναλαμβάνειν
  choice: इरादा था कि ... जहाज़ पर ले लें
  rationale: μέλλω यहाँ योजना या इरादा बताता है और ἀναλαμβάνω का प्रसंगगत अर्थ किसी को जहाज़ पर साथ लेना है।
- source_word: ἐκεῖθεν
  choice: वहाँ से
  rationale: स्थान से आगे ले जाने या सवार करने का अपादान भाव सुरक्षित रहता है।
- source_word: διατεταγμένος ἦν
  choice: उसने ऐसी ही व्यवस्था की थी
  rationale: सन्दर्भ में पौलुस की पूर्व योजना सबसे स्वाभाविक है, यद्यपि यूनानी रूप औपचारिक रूप से कर्मवाच्य है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: μέλλων αὐτὸς πεζεύειν
  choice: वह स्वयं पैदल जाने का इरादा रखता था
  rationale: πεζεύειν स्थल-यात्रा को समुद्री यात्रा से अलग करता है और प्रायः पैदल जाने का विशिष्ट भाव देता है; αὐτός का बल 'स्वयं' से सुरक्षित है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह कथावाचक दल और पौलुस की अलग-अलग यात्रा-योजनाओं के बीच हल्का विरोध दर्शाता है।
