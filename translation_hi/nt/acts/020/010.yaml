source:
  edition: SBLGNT
  text: καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν· Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/010.yaml
  text: But Paul went down and fell upon him[a], and embracing him said, “Do not be alarmed[b], for his life is in him.”
translation:
  language: hi
  text: पर पौलुस नीचे उतरा, उस पर गिर पड़ा और उसे बाँहों में भरकर बोला, “घबराओ मत, क्योंकि उसका जीवन[a] उसमें है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी आत्मा उसमें है।” यूनानी शब्द ψυχή का अर्थ “जीवन,” “व्यक्ति” या “आत्मा” हो सकता है; यहाँ किसी के मृत या जीवित होने का प्रसंग होने के कारण “जीवन” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: पौलुस के शब्दों का अर्थ यह हो सकता है कि युवक वास्तव में मरा नहीं था, या यह कि उसका जीवन लौटा दिया गया था। यूनानी कथन स्वयं इस प्रश्न को स्पष्ट रूप से तय नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: καταβὰς
  choice: नीचे गया
  rationale: यह पौलुस के ऊपरी स्थान से नीचे उतरने की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन के बाद हल्का विरोध और घटनाक्रम में नया मोड़ दिखाता है।
- source_word: ἐπέπεσεν αὐτῷ
  choice: उस पर झुक पड़ा
  rationale: यह पौलुस की शारीरिक क्रिया को बनाए रखता है और ‘उस पर गिर पड़ा’ से उत्पन्न अनचाहे दुर्घटनात्मक अर्थ से बचते हुए सम्भावित भविष्यद्वक्ताई पुनर्जीवन-वृत्तान्तों की प्रतिध्वनि को भी पूरी तरह मिटाता नहीं।
- source_word: συμπεριλαβὼν
  choice: उसे बाँहों में भरकर
  rationale: यह चारों ओर से थामने या आलिंगन में लेने की शारीरिक और करुणामय क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: Μὴ θορυβεῖσθε
  choice: घबराओ मत
  rationale: सन्दर्भ में यह उपस्थित लोगों की व्याकुलता और हलचल को सम्बोधित करता है; ‘घबराओ मत’ आधुनिक हिन्दी में इसका स्वाभाविक भाव है।
- source_word: ἡ γὰρ ψυχὴ αὐτοῦ
  choice: क्योंकि उसका जीवन
  rationale: ψυχή के अर्थों में ‘जीवन’, ‘प्राण’, ‘व्यक्ति’ और ‘आत्मा’ सम्मिलित हो सकते हैं। यहाँ प्रश्न युवक के जीवित या मृत होने का है, इसलिए ‘जीवन’ सबसे सन्दर्भानुकूल है और अनावश्यक दार्शनिक अर्थ आरोपित नहीं करता।
- source_word: ἐν αὐτῷ ἐστιν
  choice: उसमें है
  rationale: यह यूनानी कथन को सीधा रखता है और यह तय नहीं करता कि जीवन उसमें बना रहा था या लौटा दिया गया था।
theological_decisions:
- issue: जीवन-मृत्यु के सन्दर्भ में ψυχή का अर्थ
  choice: मुख्य पाठ में ‘जीवन’
  alternative: ‘आत्मा’ या ‘प्राण’
  rationale: निकटवर्ती सन्दर्भ युवक की शारीरिक दशा से सम्बन्धित है। ‘जीवन’ उपयुक्त अर्थ देता है, जबकि ‘आत्मा’ यहाँ पाठ से अधिक विशिष्ट मानव-स्वरूप सम्बन्धी धारणा का संकेत दे सकता है।
- issue: क्या यूतुखुस वास्तव में मरा नहीं था या फिर जीवित किया गया
  choice: ‘उसका जीवन उसमें है’—तटस्थ कथन
  alternative: ‘वह जीवित है’ अथवा ‘उसका जीवन लौट आया है’
  rationale: यूनानी वाक्य यह स्पष्ट नहीं करता कि जीवन पहले से उसमें था या पुनः लौटा था। इसलिए अनुवाद इस धर्मवैचारिक और कथात्मक अस्पष्टता को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘झुक पड़ा’ शारीरिक निकटता को व्यक्त करता है, जबकि ‘बाँहों में भरकर’ συμπεριλαβών का स्वाभाविक हिन्दी रूप है। वाक्य जानबूझकर युवक की मृत्यु और पुनर्जीवन के प्रश्न को निर्णायक रूप से नहीं सुलझाता।
