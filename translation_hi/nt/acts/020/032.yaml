source:
  edition: SBLGNT
  text: καὶ τὰ νῦν παρατίθεμαι ⸀ὑμᾶς τῷ ⸀θεῷ καὶ τῷ λόγῳ τῆς χάριτος αὐτοῦ, τῷ δυναμένῳ ⸀οἰκοδομῆσαι καὶ δοῦναι ⸀τὴν κληρονομίαν ἐν τοῖς ἡγιασμένοις πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/032.yaml
  text: And now I entrust you to God and to the word of his grace[a], which is able to build up and to give the inheritance among all those who have been sanctified.
translation:
  language: hi
  text: और अब मैं तुम्हें परमेश्वर और उसके अनुग्रह के वचन के भरोसे सौंपता हूँ[a], जो तुम्हें दृढ़ करने और उन सबके साथ विरासत देने में समर्थ है जो पवित्र किए गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “जो ... समर्थ है” का सम्बन्ध मुख्यतः परमेश्वर से समझा जा सकता है: “और अब मैं तुम्हें परमेश्वर और उसके अनुग्रह के वचन के भरोसे सौंपता हूँ। वह तुम्हें दृढ़ करने और उन सबके साथ विरासत देने में समर्थ है।”'
    reason: वैकल्पिक व्याकरणिक अर्थ
lexical_decisions:
- source_word: παρατίθεμαι
  choice: भरोसे सौंपता हूँ
  rationale: मध्यवाच्य क्रिया यहाँ श्रोताओं को परमेश्वर की देखभाल में सौंपने का भाव देती है; यह आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से स्पष्ट है।
- source_word: τῷ θεῷ
  choice: परमेश्वर
  rationale: παρατίθεμαι के साथ सम्प्रदान कारक उस व्यक्ति को दर्शाता है जिसके भरोसे श्रोताओं को सौंपा जा रहा है। हिन्दी की संयुक्त रचना में ‘परमेश्वर और ... के भरोसे’ यही सम्बन्ध व्यक्त करती है।
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: उसके अनुग्रह के वचन
  rationale: यह चयन यूनानी सम्बन्धवाचक संरचना और λόγος के धर्मवैचारिक महत्व को बनाए रखता है; यहाँ ‘वचन’ घोषित संदेश का भी बोध करा सकता है।
- source_word: τῷ δυναμένῳ
  choice: जो ... समर्थ है
  rationale: एकवचन कृदन्त निकटतम पद ‘उसके अनुग्रह के वचन’ की ओर संकेत कर सकता है, यद्यपि उसका सम्बन्ध परमेश्वर से लेना भी व्याकरणतः सम्भव है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: οἰκοδομῆσαι
  choice: तुम्हें उन्नत करने
  rationale: क्रिया का रूपक अर्थ आत्मिक निर्माण या उन्नति है। सन्दर्भ से निहित कर्म ‘तुम्हें’ जोड़ने पर हिन्दी स्पष्ट और स्वाभाविक रहती है।
- source_word: δοῦναι τὴν κληρονομίαν
  choice: विरासत देने
  rationale: यह सीधा अनुवाद है; पाने वाले सन्दर्भ और आगे आने वाले समूह से समझे जाते हैं।
- source_word: κληρονομίαν
  choice: विरासत
  rationale: यह सामान्य आधुनिक हिन्दी शब्द है और परमेश्वर से मिलने वाले भावी भाग के बाइबलीय अर्थ को बनाए रखता है।
- source_word: ἐν τοῖς ἡγιασμένοις πᾶσιν
  choice: उन सबके बीच ... जो पवित्र किए गए हैं
  rationale: पूर्णकालिक कर्मवाच्य कृदन्त को क्रियात्मक रूप में प्रस्तुत किया गया है, जिससे किए जा चुके पवित्रीकरण और उसके वर्तमान परिणाम का भाव बना रहता है; ἐν को समूह-सहभागिता के अर्थ में ‘के बीच’ कहा गया है।
theological_decisions:
- issue: τῷ δυναμένῳ का सम्बन्ध किससे है
  choice: मुख्य पाठ में ‘जो ... समर्थ है’ का निकटतम सम्बन्ध ‘उसके अनुग्रह के वचन’ से रखा गया है।
  alternative: इसे परमेश्वर के लिए ‘वह ... समर्थ है’ समझा जा सकता है।
  rationale: यूनानी वाक्य-विन्यास दोनों अर्थों की अनुमति देता है। निकटतम पूर्वपद ‘अनुग्रह का वचन’ है और पवित्रशास्त्र वचन को प्रभावशाली भी बताता है; फिर भी विरासत देने वाला व्यक्तिगत कर्ता परमेश्वर समझा जा सकता है। वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘अनुग्रह’, ‘वचन’, ‘विरासत’ और ‘पवित्र किए गए’ मूल पाठ की प्रमुख धर्मवैचारिक शब्दावली तथा व्याकरणिक रूप को यथासम्भव सुरक्षित रखते हैं।
