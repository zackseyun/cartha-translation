- from: मैं जानता हूँ कि मेरे चले जाने के बाद[a] भयंकर भेड़िए तुम्हारे बीच घुस आएँगे[b] और झुंड को नहीं छोड़ेंगे।
  to: मैं जानता हूँ कि मेरे चले जाने के बाद[a] भयंकर भेड़िए[b] तुम्हारे बीच घुस आएँगे और झुंड को बख्शेंगे नहीं।
  rationale: 'The revision makes one necessary semantic correction: it renders μὴ φειδόμενοι τοῦ ποιμνίου as “झुंड को बख्शेंगे नहीं,” rather than implying that the wolves will not leave the flock. It also relocates footnote b to its proper lexical anchor. The departure rendering and the wolf/flock metaphor are retained, preserving the source text''s contextual meaning and ambiguity.'
