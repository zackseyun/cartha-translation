  text: ἐγὼ ⸀οἶδα ὅτι εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/029.yaml
  text: I know that after my departure fierce wolves will come in among you[b][a], not sparing the flock.
translation:
  language: hi
  text: मैं जानता हूँ कि मेरे चले जाने के बाद[a] भयंकर भेड़िए[b] तुम्हारे बीच घुस आएँगे और झुंड को बख्शेंगे नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे आने/पहुँचने के बाद”; संदर्भ में आशय “मेरे चले जाने के बाद” है।
    reason: lexical_alternative
  - marker: b
    text: या “हिंसक भेड़िए।” यूनानी विशेषण कठोर, अत्याचारी या हिंसक उग्रता का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: मैं जानता हूँ
  rationale: यह पौलुस के दृढ़ ज्ञान को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰσελεύσονται
  choice: घुस आएँगे
  rationale: यह समुदाय के भीतर प्रवेश करने और भेड़ियों के अनधिकृत, खतरनाक प्रवेश—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μετὰ τὴν ἄφιξίν μου
  choice: मेरे चले जाने के बाद
  rationale: ἄφιξις सामान्यतः आने या पहुँचने का अर्थ दे सकता है, पर यहाँ विदाई-भाषण के संदर्भ में पौलुस की अनुपस्थिति, अर्थात उसके चले जाने के बाद का समय अभिप्रेत है।
- source_word: λύκοι βαρεῖς
  choice: भयंकर भेड़िए
  rationale: βαρεῖς का शाब्दिक अर्थ ‘भारी’ है, पर यहाँ यह कठोर, हिंसक और विनाशकारी तीव्रता बताता है; ‘भयंकर’ आधुनिक हिन्दी में इस खतरे को स्पष्ट रखता है।
- source_word: εἰς ὑμᾶς
  choice: तुम्हारे बीच
  rationale: यह उन लोगों के समुदाय में घुस आने का भाव स्पष्ट करता है और भेड़ियों तथा झुंड के रूपक के अनुकूल है।
- source_word: μὴ φειδόμενοι τοῦ ποιμνίου
  choice: झुंड को नहीं छोड़ेंगे
  rationale: यह यूनानी मुहावरे का अर्थ है कि वे झुंड को बख्शेंगे नहीं; हिन्दी में ‘नहीं छोड़ेंगे’ सहज है और निर्दय हानि का भाव देता है।
theological_decisions:
- issue: ‘भेड़ियों’ के रूपक की पहचान
  choice: मुख्य पाठ में ‘भेड़िए’ का रूपक बनाए रखा गया।
  alternative: झूठे शिक्षक, विनाशकारी लोग या सताने वाले
  rationale: पद स्वयं इन भेड़ियों की पहचान किसी एक वर्ग के रूप में स्पष्ट नहीं करता। रूपक बनाए रखने से उसकी वाग्मय शक्ति और वास्तविक अस्पष्टता सुरक्षित रहती है।
- issue: ἄφιξις का संदर्भगत अर्थ
  choice: ‘चले जाने’ के अर्थ में अनुवाद किया गया।
  alternative: ‘आने’ या ‘पहुँचने’ के बाद
  rationale: शब्द का प्रचलित अर्थ ‘आगमन’ हो सकता है, किंतु इस विदाई-संदर्भ में चेतावनी पौलुस के वहाँ से चले जाने और अनुपस्थित होने के बाद की है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और मौखिक रूप से स्पष्ट रूप चुना गया है। ‘झुंड’ और ‘भेड़िए’ के चरवाही-रूपक को सुरक्षित रखा गया है; किसी विशिष्ट धार्मिक समूह की व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
