source:
  edition: SBLGNT
  text: ἀλλ’ οὐδενὸς ⸀λόγου ⸀ποιοῦμαι τὴν ⸀ψυχὴν τιμίαν ἐμαυτῷ ὡς ⸀τελειῶσαι τὸν δρόμον ⸀μου καὶ τὴν διακονίαν ἣν ἔλαβον παρὰ τοῦ κυρίου Ἰησοῦ, διαμαρτύρασθαι τὸ εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/020/024.yaml
  text: 'But I do not count my life as of any value to myself[c][b][a], if only I may finish my course and the ministry that I received from the Lord Jesus: to testify to the gospel of the grace of God.'
translation:
  language: hi
  text: पर मैं अपने जीवन को अपने लिए किसी भी मूल्य का नहीं समझता[a]। मेरी बस यही इच्छा है कि मैं अपनी दौड़[b] और उस सेवा को पूरा कर सकूँ जो मुझे प्रभु यीशु से मिली है—अर्थात् परमेश्वर के अनुग्रह के सुसमाचार की गवाही देना[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने प्राण को अपने लिए बहुमूल्य नहीं मानता।” यहाँ “जीवन” इसलिए रखा गया है कि प्रसंग में पौलुस अपना मिशन पूरा करने के लिए मृत्यु का सामना करने को तैयार है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपना मार्ग।” यूनानी शब्द पूरा किए जाने वाले मार्ग या दौड़ को दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “साक्षी देना” अथवा “गंभीरता से गवाही देना।” यूनानी क्रिया में दृढ़ या गंभीर साक्ष्य देने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδενὸς λόγου ποιοῦμαι ... τιμίαν ἐμαυτῷ
  choice: अपने लिए किसी भी मूल्य का नहीं समझता
  rationale: यह यूनानी मुहावरे के मूल्यांकनात्मक भाव और ἐμαυτῷ के व्यक्तिगत संदर्भ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ψυχήν
  choice: जीवन
  rationale: प्रसंग में पौलुस मृत्यु का सामना करते हुए अपने प्राण बचाने की अपेक्षा मिशन पूरा करने की बात करता है; यहाँ अमूर्त ‘आत्मा’ से अधिक ‘जीवन’ उपयुक्त है।
- source_word: ὡς τελειῶσαι
  choice: बस इतना कि ... पूरा कर सकूँ
  rationale: संक्षिप्त यूनानी रचना पौलुस की सर्वोपरि अभिलाषा व्यक्त करती है; यह हिन्दी रूप उद्देश्य और प्रबल आकांक्षा दोनों को खुला रखता है।
- source_word: δρόμον
  choice: दौड़
  rationale: शब्द पूरा किए जाने वाले मार्ग या दौड़ का रूपक रखता है; ‘दौड़’ हिन्दी में सजीव और सहज है।
- source_word: διακονίαν
  choice: सेवा
  rationale: यह प्रभु यीशु से प्राप्त दायित्वपूर्ण सेवाकार्य को दर्शाता है और सामान्य पाठकों के लिए ‘मिनिस्ट्री’ से अधिक स्वाभाविक है।
- source_word: παρὰ τοῦ κυρίου Ἰησοῦ
  choice: प्रभु यीशु से
  rationale: παρά के संबंधकारक प्रयोग में स्रोत का भाव है, जिसे ‘से’ सीधे व्यक्त करता है।
- source_word: διαμαρτύρασθαι
  choice: गवाही देना
  rationale: यह साक्षी देने के अर्थ को स्पष्ट रखता है; क्रिया में निहित गंभीरता को पादटिप्पणी में बताया गया है।
- source_word: εὐαγγέλιον τῆς χάριτος τοῦ θεοῦ
  choice: परमेश्वर के अनुग्रह का सुसमाचार
  rationale: यह संबंधकारक शृंखला को सुरक्षित रखता है और जानबूझकर यह तय नहीं करता कि सुसमाचार अनुग्रह के विषय में है या उससे विशिष्ट है।
theological_decisions:
- issue: ψυχή का अर्थ
  choice: जीवन
  alternative: प्राण; आत्मा
  rationale: निकट प्रसंग में पौलुस अपने मिशन के लिए कष्ट और मृत्यु का सामना करने को तैयार है; ‘जीवन’ अनावश्यक देह-आत्मा द्वैत आरोपित नहीं करता।
- issue: ὡς τελειῶσαι का बल
  choice: बस इतना कि मैं ... पूरा कर सकूँ
  alternative: ताकि मैं ... पूरा करूँ; इस प्रकार कि मैं ... पूरा करूँ
  rationale: यह पौलुस के प्रधान उद्देश्य या एकमात्र चिंता का भाव व्यक्त करता है, पर व्याकरण को केवल कठोर प्रयोजनवाचक अर्थ तक सीमित नहीं करता।
- issue: τῆς χάριτος τοῦ θεοῦ में संबंधकारक का संबंध
  choice: परमेश्वर के अनुग्रह का सुसमाचार
  alternative: परमेश्वर के अनुग्रह के विषय में सुसमाचार
  rationale: औपचारिक संबंध को बनाए रखने से सुसमाचार के विषय, स्रोत या विशेषता में से किसी एक अर्थ को अनावश्यक रूप से निर्णायक नहीं बनाया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अनुग्रह’, ‘सुसमाचार’ और ‘प्रभु’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं; वाक्य की प्रबल किंतु संक्षिप्त वक्तृता को दीर्घ व्याख्या से नहीं दबाया गया।
