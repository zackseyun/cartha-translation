  text: Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις ⸂οὐκ ὀλίγην ἐργασίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/024.yaml
  text: For a certain man named Demetrius[a], a silversmith who made silver shrines of Artemis[b], was providing the craftsmen with no small business.
translation:
  language: hi
  text: क्योंकि देमेत्रियुस नाम का एक चाँदी का कारीगर था, जो अरतेमिस के चाँदी के मंदिर[a] बनाता था और कारीगरों को अच्छा-खासा काम[b] देता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “अरतेमिस के चाँदी के मंदिर।” सम्भवतः ये अरतेमिस की उपासना से जुड़े छोटे चाँदी के देवालय या मंदिर की प्रतिकृतियाँ थीं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में, “कम काम नहीं”; यह अल्पोक्ति पर्याप्त काम, व्यापार या कमाई का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Δημήτριος
  choice: देमेत्रियुस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन की पृष्ठभूमि और कारण स्पष्ट करने वाला संयोजक है।
- source_word: ἀργυροκόπος
  choice: सुनार
  rationale: यह चाँदी पर काम करने वाले कारीगर को दर्शाता है; सामान्य आधुनिक हिन्दी में 'सुनार' सबसे सहज है।
- source_word: ποιῶν
  choice: बनवाता था
  rationale: व्यवसाय के स्वामी द्वारा कारीगरों के माध्यम से उत्पादन कराने का प्रसंगगत भाव व्यक्त करता है, हालांकि यूनानी क्रिया स्वयं केवल 'बनाना' कहती है।
- source_word: ναοὺς ἀργυροῦς Ἀρτέμιδος
  choice: अरतेमिस के चाँदी के मंदिरों के नमूने
  rationale: ναός का मूल अर्थ मंदिर/पवित्र स्थान है, पर व्यापारिक प्रसंग में छोटी चाँदी की प्रतिकृतियाँ अभिप्रेत होने की संभावना है; मुख्य पाठ इस आशय को स्पष्ट करता है और पादटिप्पणी वास्तविक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: Ἀρτέμιδος
  choice: अरतेमिस
  rationale: यूनानी देवी के नाम का सीधा लिप्यंतरण है; रोमी समकक्ष 'डायना' नहीं अपनाया गया।
- source_word: παρείχετο
  choice: देता था
  rationale: अपूर्ण भूतकाल नियमित या निरंतर व्यावसायिक गतिविधि को दर्शाता है।
- source_word: τοῖς τεχνίταις
  choice: कारीगरों को
  rationale: यह व्यापार में लगे कुशल हस्तशिल्पियों के लिए स्वाभाविक आधुनिक हिन्दी शब्द है।
- source_word: οὐκ ὀλίγην ἐργασίαν
  choice: अच्छा-खासा कारोबार
  rationale: यूनानी अल्पोक्ति 'कम नहीं' पर्याप्त व्यापार, काम या आय का संकेत देती है; हिन्दी मुहावरा आर्थिक प्रसंग में यही प्रभाव देता है।
