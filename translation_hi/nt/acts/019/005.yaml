lexical_decisions:
- source_word: ἀκούσαντες
  choice: यह सुनकर
  rationale: कालवाचक एओरिस्ट कृदंत है। यूनानी में कर्म व्यक्त नहीं है; हिन्दी में पिछले कथन की ओर संकेत करने वाला ‘यह’ वाक्य को स्वाभाविक और स्पष्ट बनाता है।
- source_word: δὲ
  choice: अलग से अनूदित नहीं
  rationale: यह हल्का कथात्मक संयोजक है। ‘यह सुनकर’ हिन्दी में प्रसंग का क्रम पर्याप्त रूप से व्यक्त करता है; ‘और’ जोड़ना आवश्यक नहीं।
- source_word: ἐβαπτίσθησαν
  choice: उन्हें ... बपतिस्मा दिया गया
  rationale: एओरिस्ट कर्मवाच्य को सुरक्षित रखते हुए यह आधुनिक हिन्दी में स्वाभाविक धार्मिक अभिव्यक्ति है।
- source_word: εἰς τὸ ὄνομα
  choice: नाम में
  rationale: εἰς की दिशात्मक और संबंध-सूचक शक्ति को यथासंभव बनाए रखता है। परिचित ‘नाम पर’ को वैकल्पिक पाठ के रूप में पादटिप्पणी में रखा गया है।
- source_word: τοῦ κυρίου
  choice: प्रभु
  rationale: यहाँ κύριος यीशु की उपाधि है; ‘प्रभु’ मानक, गरिमापूर्ण और प्रसंगानुकूल हिन्दी है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: Ἰησοῦς नाम का मानक हिन्दी रूप।
theological_decisions:
- issue: बपतिस्मा-वाक्यांश में εἰς τὸ ὄνομα का अनुवाद
  choice: प्रभु यीशु के नाम में
  alternative: प्रभु यीशु के नाम पर
  rationale: ‘नाम में’ यूनानी εἰς की दिशात्मक/संबंधात्मक बारीकी को बनाए रखता है और बाद की किसी पूजा-पद्धति के सूत्र से पाठ का मौन सामंजस्य नहीं कराता। ‘नाम पर’ अधिक पारंपरिक और परिचित हिन्दी है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘बपतिस्मा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला शब्द है; कर्मवाच्य मूल यूनानी के व्याकरण को सुरक्षित रखता है।
