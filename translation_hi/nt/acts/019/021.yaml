id: ACT.19.21
reference: Acts 19:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν πορεύεσθαι εἰς ⸀Ἱεροσόλυμα, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ δεῖ με καὶ Ῥώμην ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/021.yaml
  text: After these things were completed[a], Paul resolved in the Spirit to go to Jerusalem after passing through Macedonia and Achaia, saying, “After I have been there[b], I must also see Rome.”
translation:
  language: hi
  text: जब ये बातें पूरी हो गईं, तो पौलुस ने आत्मा में निश्चय किया[a] कि वह मकिदुनिया और अखाया से होकर यरूशलेम जाए। उसने कहा, “वहाँ पहुँचने के बाद[b] मुझे रोम भी देखना है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने मन में निश्चय किया।” यूनानी वाक्यांश पौलुस के अपने भीतरी निश्चय या पवित्र आत्मा के मार्गदर्शन—दोनों में से किसी को सूचित कर सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ, “मेरे वहाँ होने के बाद।”
    reason: literal_rendering
lexical_decisions:
- source_word: ἐπληρώθη
  choice: पूरी हो गईं
  rationale: यहाँ निष्क्रिय क्रिया पिछली घटनाओं के पूरा हो जाने को बताती है, न कि किसी भविष्यवाणी की पूर्ति को।
- source_word: ἔθετο
  choice: निश्चय किया
  rationale: मध्यवाच्य प्रयोग अपने भीतर ठानने या उद्देश्य निर्धारित करने का भाव देता है; आधुनिक हिन्दी में ‘निश्चय किया’ स्वाभाविक और दृढ़ है।
- source_word: ἐν τῷ πνεύματι
  choice: आत्मा में
  rationale: यूनानी पद पौलुस की अपनी आत्मा अथवा पवित्र आत्मा के मार्गदर्शन, दोनों की ओर संकेत कर सकता है; हिन्दी में ‘आत्मा में’ मूल अस्पष्टता बनाए रखता है।
- source_word: διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν
  choice: मकिदुनिया और अखाया से होकर
  rationale: कृदंत नियोजित मार्ग और यरूशलेम जाने से पहले की यात्रा को व्यक्त करता है।
- source_word: πορεύεσθαι εἰς Ἱεροσόλυμα
  choice: यरूशलेम जाए
  rationale: गंतव्य की ओर जाने का सामान्य और स्वाभाविक हिन्दी रूप।
- source_word: Μετὰ τὸ γενέσθαι με ἐκεῖ
  choice: वहाँ पहुँचने के बाद
  rationale: शाब्दिक अर्थ ‘मेरे वहाँ होने के बाद’ है; यात्रा-संदर्भ में ‘वहाँ पहुँचने के बाद’ सहज हिन्दी है और क्रम स्पष्ट करता है।
- source_word: δεῖ με
  choice: मुझे ... है
  rationale: ‘मुझे ... देखना है’ हिन्दी में आवश्यकता या बाध्यता का स्वाभाविक भाव देता है, जो δεῖ की शक्ति बनाए रखता है।
- source_word: Ῥώμην ἰδεῖν
  choice: रोम भी देखना
  rationale: ‘देखना’ यूनानी ἰδεῖν के निकट रहते हुए यात्रा-संदर्भ में रोम जाने या वहाँ उपस्थित होने का भाव देता है।
theological_decisions:
- issue: ἐν τῷ πνεύματι का अभिप्राय
  choice: आत्मा में
  alternative: अपने मन में / अपनी आत्मा में
  rationale: मूल यूनानी में कोई स्पष्ट संबंधसूचक सर्वनाम नहीं है। इसलिए यह पौलुस के आंतरिक निश्चय या पवित्र आत्मा की प्रेरणा, दोनों को सूचित कर सकता है; मुख्य पाठ और पादटिप्पणी मिलकर इस वास्तविक अस्पष्टता को सुरक्षित रखते हैं।
- issue: δεῖ में आवश्यकता का स्वरूप
  choice: मुझे रोम भी देखना है
  alternative: मेरे लिए रोम को भी देखना आवश्यक है
  rationale: लूका-प्रेरितों में δεῖ कभी-कभी ईश्वरीय उद्देश्य का संकेत देता है, पर इस पद में उसे स्पष्ट रूप से ‘परमेश्वर की इच्छा’ कहना मूल से अधिक निश्चित होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्थान-नामों के प्रचलित हिन्दी रूप ‘मकिदुनिया,’ ‘अखाया,’ ‘यरूशलेम’ और ‘रोम’ अपनाए गए हैं। वाक्य-विन्यास हिन्दी की स्वाभाविक गति के अनुसार दो वाक्यों में रखा गया है।
