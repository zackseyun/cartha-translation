  text: ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχεν χρόνον εἰς τὴν Ἀσίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/022.yaml
  text: So after sending into Macedonia two of those who were ministering to him—Timothy and Erastus—he himself stayed for a time in Asia[a].
translation:
  language: hi
  text: तब उसने उसकी सेवा करनेवाले लोगों में से दो जनों—तीमुथियुस और इरास्तुस—को मकिदुनिया भेजने के बाद, स्वयं कुछ समय तक आसिया[a] में ठहर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात एशिया माइनर के पश्चिमी भाग में स्थित रोमी प्रांत आसिया, न कि आज का एशिया महाद्वीप।
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλας
  choice: भेजने के बाद
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले पूरी हुई क्रिया बताता है; यह पदबंध घटनाओं का क्रम स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: δὲ
  choice: इसलिए
  rationale: यहाँ δέ कथा को आगे बढ़ानेवाला हल्का संयोजक है; संदर्भ में ‘इसलिए’ पूर्ववर्ती योजना और इस कार्रवाई के संबंध को सहज रूप से व्यक्त करता है।
- source_word: εἰς τὴν Μακεδονίαν
  choice: मकिदुनिया
  rationale: ‘भेजना’ के साथ हिंदी में गंतव्य को बिना परसर्ग के व्यक्त करना स्वाभाविक है; इससे εἰς की दिशात्मकता बनी रहती है।
- source_word: δύο τῶν διακονούντων αὐτῷ
  choice: अपनी सेवा करनेवालों में से दो जनों
  rationale: यह चुनाव संबंधवाचक यूनानी संरचना और διακονέω के सामान्य सेवा-अर्थ को बनाए रखता है, बिना इसे किसी औपचारिक कलीसियाई पद के रूप में निर्धारित किए।
- source_word: Τιμόθεον καὶ Ἔραστον
  choice: तीमुथियुस और इरास्तुस
  rationale: व्यक्तिगत नामों के लिए प्रचलित हिंदी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: αὐτὸς
  choice: स्वयं
  rationale: स्पष्ट यूनानी सर्वनाम पौलुस और उसके भेजे हुए दोनों व्यक्तियों के बीच बलयुक्त विरोध को दर्शाता है।
- source_word: ἐπέσχεν χρόνον
  choice: कुछ समय तक ... ठहर गया
  rationale: यूनानी मुहावरा किसी अवधि तक बने रहने का अर्थ देता है; यह हिंदी में स्पष्ट और स्वाभाविक अभिव्यक्ति है।
- source_word: εἰς τὴν Ἀσίαν
  choice: आसिया में
  rationale: ἐπέσχεν χρόνον के साथ εἰς स्थानवाचक अर्थ देता है। ‘आसिया’ प्राचीन रोमी प्रांत का नाम है, जिसे पादटिप्पणी स्पष्ट करती है।
