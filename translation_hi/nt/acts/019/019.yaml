  text: ἱκανοὶ δὲ τῶν τὰ περίεργα πραξάντων συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν καὶ εὗρον ἀργυρίου μυριάδας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/019.yaml
  text: And many of those who had practiced magic arts brought their books together and were burning them in front of everyone[b][a]; and they totaled up their value and found it to be fifty thousand pieces of silver.
translation:
  language: hi
  text: और जादू-टोना करनेवालों में से बहुत-से लोग अपनी पुस्तकें इकट्ठी करके सबके सामने जला रहे थे। उन्होंने उन पुस्तकों का मूल्य जोड़कर देखा कि वह चाँदी के पचास हज़ार सिक्कों के बराबर था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में शाब्दिक रूप से “चाँदी की पाँच दस-हज़ारियाँ” है, अर्थात पचास हज़ार। किस प्रकार के चाँदी के सिक्के थे, यह नहीं बताया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκανοὶ
  choice: बहुत-से लोग
  rationale: यहाँ शब्द पर्याप्तता नहीं, बल्कि लोगों की बड़ी संख्या को सूचित करता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὰ περίεργα πραξάντων
  choice: जादू-टोना करनेवालों
  rationale: इफिसुस के प्रसंग में यह अभिव्यक्ति जादुई अथवा गुप्त तांत्रिक क्रियाओं की ओर संकेत करती है, केवल अनोखे या जिज्ञासापूर्ण कामों की ओर नहीं।
- source_word: συνενέγκαντες τὰς βίβλους
  choice: अपनी पुस्तकें इकट्ठी करके
  rationale: यह पुस्तकों को एक स्थान पर लाकर जमा करने की ठोस क्रिया व्यक्त करता है; 'अपनी' प्रसंग से स्पष्ट स्वामित्व को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: κατέκαιον
  choice: जला रहे थे
  rationale: अपूर्ण भूतकाल क्रिया को जारी घटना के रूप में प्रस्तुत करता है, जिसे हिन्दी की अपूर्ण पक्षीय रचना सुरक्षित रखती है।
- source_word: ἐνώπιον πάντων
  choice: सबके सामने
  rationale: यह कार्य की सार्वजनिक प्रकृति को सरल और वर्तमान हिन्दी में व्यक्त करता है।
- source_word: συνεψήφισαν τὰς τιμὰς αὐτῶν
  choice: उन पुस्तकों का मूल्य जोड़कर देखा
  rationale: क्रिया का अर्थ कुल राशि की गणना करना है; यह हिन्दी में स्वाभाविक रूप से उसी गणना को व्यक्त करता है।
- source_word: ἀργυρίου μυριάδας πέντε
  choice: चाँदी के पचास हज़ार सिक्कों के बराबर
  rationale: मूल अभिव्यक्ति शाब्दिक रूप से 'चाँदी की पाँच दस-हज़ारियाँ' है। राशि पचास हज़ार है, पर सिक्के का सटीक प्रकार नहीं बताया गया; 'के बराबर' इसे मूल्यांकन के रूप में रखता है।
theological_decisions:
- issue: इफिसुस के प्रसंग में τὰ περίεργα का स्वरूप
  choice: जादू-टोना
  alternative: गुप्त तांत्रिक क्रियाएँ; अनोखी कलाएँ
  rationale: निकटवर्ती प्रसंग में दुष्टात्माएँ, झाड़-फूँक करनेवाले और जादुई ग्रंथ आते हैं। इसलिए 'जादू-टोना' ऐतिहासिक-धार्मिक अर्थ को स्पष्ट करता है, पर किसी विशेष सम्प्रदाय की व्याख्या नहीं जोड़ता।
- issue: ἀργυρίου की मौद्रिक अनिश्चितता
  choice: चाँदी के पचास हज़ार सिक्कों के बराबर
  alternative: चाँदी की पचास हज़ार मुद्राएँ; पचास हज़ार दीनार
  rationale: यूनानी पाठ किसी निश्चित सिक्का-नाम का उल्लेख नहीं करता। इसलिए 'दीनार' जैसे विशिष्ट मूल्यवर्ग से बचते हुए अनिश्चितता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण कथात्मक शैली। 'जादू-टोना' सामान्य पाठक के लिए स्पष्ट है, और 'जला रहे थे' यूनानी अपूर्ण भूतकाल के जारी पक्ष को सुरक्षित रखता है।
