lexical_decisions:
- source_word: ἦσαν
  choice: थे
  rationale: यूनानी क्रिया यहाँ समूह की संख्या बताती है; हिंदी में ‘थे’ के साथ यह वाक्य स्वाभाविक और स्पष्ट है।
- source_word: δὲ
  choice: —
  rationale: यह हल्का संयोजक है और यहाँ कोई प्रबल विरोध नहीं दर्शाता; आधुनिक हिंदी में इसे व्यक्त न करना अधिक स्वाभाविक है।
- source_word: οἱ πάντες
  choice: कुल मिलाकर
  rationale: यह पूरे समूह की कुल संख्या पर बल देता है; ‘कुल मिलाकर’ हिंदी में उसी सार-सूचक भाव को सहज रूप से व्यक्त करता है।
- source_word: ἄνδρες
  choice: पुरुष
  rationale: ἀνήρ यहाँ सामान्यतः व्यक्तियों के बजाय पुरुषों को निर्दिष्ट करता है, इसलिए लिंग-सटीक अनुवाद रखा गया है।
- source_word: ὡσεὶ
  choice: लगभग
  rationale: यह संख्या के अनुमानित होने को दर्शाता है; ‘लगभग’ आधुनिक मानक हिंदी का स्पष्ट समतुल्य है।
- source_word: δώδεκα
  choice: बारह
  rationale: मूल संख्या का सीधा और स्वाभाविक हिंदी रूप।
