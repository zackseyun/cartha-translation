lexical_decisions:
- source_word: Παύλου
  choice: पौलुस
  rationale: Παῦλος नाम का हिन्दी बाइबल-परंपरा में प्रचलित और मानक लिप्यंतरण।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले प्रसंग से हल्का विरोध अथवा कथा में नया मोड़ दिखाता है; आधुनिक हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: βουλομένου
  choice: जब ... जाना चाहता था
  rationale: सम्बन्धवाचक स्वतंत्र रचना पौलुस की इच्छा या मंशा बताती है; यह चयन अर्थ और कालगत सम्बन्ध दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: εἰσελθεῖν
  choice: के बीच जाना
  rationale: क्रिया भीतर प्रवेश करने को बताती है; एकत्र जनसमूह के सन्दर्भ में ‘के बीच जाना’ सहज है।
- source_word: εἰς τὸν δῆμον
  choice: जनसभा के बीच
  rationale: δῆμος यहाँ सार्वजनिक रूप से एकत्र लोगों अथवा नागरिक सभा को सूचित कर सकता है। ‘जनसभा’ नागरिक-सार्वजनिक रंग बनाए रखती है, जबकि ‘के बीच’ उपस्थित लोगों में प्रवेश का भाव देती है।
- source_word: οὐκ εἴων
  choice: जाने नहीं दिया
  rationale: अपूर्ण भूतकाल उनकी लगातार रोक अथवा दृढ़ निषेध को व्यक्त करता है; हिन्दी में यह वाक्यांश स्वाभाविक रूप से वही प्रभाव देता है।
- source_word: αὐτὸν
  choice: उसे
  rationale: सर्वनाम का संकेत पौलुस की ओर है।
- source_word: οἱ μαθηταί
  choice: शिष्यों
  rationale: μαθηταί का सीधा और प्रचलित हिन्दी समतुल्य ‘शिष्य’ है; मूल में निहित न होने के कारण ‘उसके’ नहीं जोड़ा गया।
