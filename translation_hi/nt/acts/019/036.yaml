  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भीड़ को संबोधित करने के कारण बहुवचन ‘तुम’ का प्रयोग हुआ है; वाक्य में तर्कपूर्ण आग्रह और संयम की चेतावनी सुरक्षित है।
