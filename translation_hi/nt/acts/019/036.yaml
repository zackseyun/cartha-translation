  yaml_path: translation/nt/acts/019/036.yaml
  text: Therefore[a], since these things are undeniable[c][b], it is necessary for you to remain calm and to do nothing rash.
translation:
  language: hi
  text: इसलिए, चूँकि ये बातें निर्विवाद हैं, तुम्हारे लिए आवश्यक है कि तुम शांत रहो और उतावली में कुछ न करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναντιρρήτων
  choice: निर्विवाद
  rationale: यह शब्द ऐसी बात को दर्शाता है जिसका खंडन या विरोध नहीं किया जा सकता; ‘निर्विवाद’ आधुनिक मानक हिन्दी में स्वाभाविक और सटीक है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकले निष्कर्ष को स्पष्ट करता है और नगर-सचिव के तर्क का संबंध बनाए रखता है।
- source_word: ὄντων τούτων
  choice: जब ये बातें ... हैं
  rationale: सम्बन्धवाचक निरपेक्ष रचना यहाँ आगामी आग्रह का आधार बताती है; हिन्दी में ‘जब’ इस परिस्थितिजन्य और कारणात्मक संबंध को सहज रूप से व्यक्त करता है।
- source_word: δέον ἐστίν
  choice: आवश्यक है
  rationale: यह निर्वैयक्तिक पदबंध आवश्यकता या दायित्व व्यक्त करता है; ‘आवश्यक है’ उसके बल को बनाए रखता है।
- source_word: κατεσταλμένους ὑπάρχειν
  choice: शांत रहो
  rationale: यह शांत और संयत अवस्था में बने रहने का आग्रह है; ‘शांत रहो’ केवल चुप रहने के बजाय संयमित रहने का अर्थ देता है।
- source_word: μηδὲν προπετὲς πράσσειν
  choice: उतावली में कुछ न करो
  rationale: προπετής जल्दबाजी या बिना सोचे किए गए काम को दर्शाता है; यह हिन्दी पदबंध चेतावनी को स्वाभाविक ढंग से व्यक्त करता है।
