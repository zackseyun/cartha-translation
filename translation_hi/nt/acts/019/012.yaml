id: ACT.19.12
reference: Acts 19:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ⸀ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια καὶ ἀπαλλάσσεσθαι ἀπ’ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ⸀ἐκπορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/012.yaml
  text: so that even handkerchiefs or work aprons were carried away from his body to the sick[a], and the diseases left them[b], and the evil spirits went out.
translation:
  language: hi
  text: यहाँ तक कि उसके शरीर से रूमाल या काम के एप्रन भी बीमारों के पास ले जाए जाते थे, और बीमारियाँ उनसे दूर हो जाती थीं और दुष्ट आत्माएँ उनमें से निकल जाती थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: यहाँ तक कि
  rationale: यह पिछले पद में बताए गए असाधारण चमत्कारों का परिणाम प्रस्तुत करता है; हिंदी में यह वाक्य-संबंध स्वाभाविक रूप से परिणाम की तीव्रता दिखाता है।
- source_word: ἐπὶ τοὺς ἀσθενοῦντας
  choice: बीमारों के पास
  rationale: गति के संदर्भ में यह उन बीमार लोगों तक वस्तुएँ पहुँचाए जाने का स्वाभाविक हिंदी रूप है।
- source_word: ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ
  choice: उसके शरीर से छुए हुए ... ले जाए जाते थे
  rationale: χρώς मूलतः त्वचा/शरीर की बाहरी सतह को दर्शाता है। शब्दशः 'त्वचा से' हिंदी में अस्वाभाविक और संदर्भ में अस्पष्ट होगा; 'शरीर से छुए हुए' वस्तुओं के पौलुस के शरीर के संपर्क में होने और फिर वहाँ से ले जाए जाने—दोनों बातों को स्पष्ट करता है।
- source_word: σουδάρια
  choice: रूमाल
  rationale: यह पसीना या चेहरा पोंछने वाले कपड़े का प्रचलित और सहज हिंदी समतुल्य है।
- source_word: σιμικίνθια
  choice: काम के एप्रन
  rationale: यह हस्तश्रम के समय पहने जाने वाले एप्रन या कार्य-वस्त्र को सूचित करता है; 'काम के' से वस्तु का प्रकार स्पष्ट होता है।
- source_word: ἀπαλλάσσεσθαι ... τὰς νόσους
  choice: उनकी बीमारियाँ दूर हो जाती थीं
  rationale: क्रिया अलग होने या हट जाने का भाव देती है। हिंदी में बीमारी के संदर्भ में 'दूर हो जाती थीं' स्वाभाविक है और रोगियों से रोग के हटने का अर्थ बनाए रखता है।
- source_word: τά ... πνεύματα τὰ πονηρά
  choice: दुष्ट आत्माएँ
  rationale: यह शत्रुतापूर्ण आध्यात्मिक प्राणियों के लिए स्पष्ट और परंपरागत किंतु आधुनिक हिंदी अभिव्यक्ति है।
- source_word: ἐκπορεύεσθαι
  choice: निकल जाती थीं
  rationale: आत्माओं के किसी व्यक्ति से बाहर जाने के लिए यह सीधा और स्वाभाविक हिंदी प्रयोग है।
theological_decisions:
- issue: पौलुस के शरीर के संपर्क में आए कपड़ों के माध्यम से चंगाई और दुष्ट आत्माओं का निकलना
  choice: घटना को कथा में बताए अनुसार सीधे रूप में प्रस्तुत किया गया है, बिना किसी धार्मिक अवशेष, संस्कार-सिद्धांत या अंधविश्वास संबंधी व्याख्या जोड़े।
  alternative: इसे धार्मिक अवशेषों की वंदना का समर्थन मानना, या चमत्कार को केवल प्रतीकात्मक बनाकर प्रस्तुत करना।
  rationale: पाठ अलौकिक घटना का वर्णन करता है, लेकिन उसके लिए कोई बाद की धार्मिक व्यवस्था या यांत्रिक कारण नहीं बताता; अनुवाद उसी सीमित दावे को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'एप्रन' आज के हिंदी प्रयोग में समझ में आने वाला उधार-शब्द है; 'काम के' उसका ऐतिहासिक कार्य-संदर्भ स्पष्ट करता है।
