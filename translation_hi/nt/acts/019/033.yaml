  yaml_path: translation/nt/acts/019/033.yaml
  text: And from the crowd they brought forward Alexander[a], since the Jews had pushed him forward; and Alexander, motioning with his hand[b], wanted to make a defense to the assembly.
translation:
  language: hi
  text: भीड़ में से उन्होंने सिकंदर को आगे कर दिया[a], क्योंकि यहूदियों ने उसे आगे कर दिया था। सिकंदर ने हाथ से इशारा करके जनसभा[b] के सामने बचाव में बोलना चाहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने सिकंदर को आगे किया ... यहूदियों ने उसे आगे किया था।” यूनानी में सिकंदर को सार्वजनिक रूप से आगे लाने के लिए दो सम्बन्धित क्रियाएँ प्रयुक्त हुई हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “जनता।” यहाँ प्रयुक्त शब्द नागरिक रूप से एकत्र जनता का अर्थ भी दे सकता है और पद के आरम्भ में आए “भीड़” के शब्द से भिन्न है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεβίβασαν
  choice: लोगों ने ... आगे कर दिया
  rationale: ἐκ τοῦ ὄχλου के साथ यहाँ अर्थ भीड़ में से किसी व्यक्ति को सार्वजनिक रूप से सामने लाने का है; ‘आगे कर दिया’ आधुनिक हिन्दी में स्वाभाविक है और निर्देश देने या समझाने का अर्थ नहीं लाता।
- source_word: προβαλόντων αὐτὸν τῶν Ἰουδαίων
  choice: क्योंकि यहूदियों ने उसे आगे बढ़ाया था
  rationale: सम्बन्धकारक निरपेक्ष रचना सिकंदर के सामने आने की परिस्थिति समझाती है। ‘आगे बढ़ाया’ सार्वजनिक रूप से सामने करने का भाव रखता है, पर अनावश्यक रूप से शारीरिक हिंसा नहीं दर्शाता।
- source_word: κατασείσας τὴν χεῖρα
  choice: हाथ से इशारा किया
  rationale: यह ध्यान आकर्षित करने या शान्ति चाहने के हाथ के संकेत को व्यक्त करता है, पर स्रोत में स्पष्ट न किए गए उद्देश्य को अनुवाद में नहीं जोड़ता।
- source_word: ἤθελεν ἀπολογεῖσθαι
  choice: अपना पक्ष रखना चाहा
  rationale: ἤθελεν इच्छा या प्रयास का आरम्भ बताता है, पूर्ण हुई क्रिया नहीं। ‘अपना पक्ष रखना’ सार्वजनिक प्रतिरक्षा का भाव देता है और सामान्य पाठक के लिए ‘प्रतिवाद करना’ से अधिक सहज है।
- source_word: τῷ δήμῳ
  choice: जनसभा
  rationale: δῆμος यहाँ नागरिक रूप से एकत्र जनता या सार्वजनिक सभा को सूचित करता है। ‘जनसभा’ इस भाव को रखता और पहले आए ὄχλος से भेद करता है।
- source_word: ὄχλου
  choice: भीड़
  rationale: ὄχλος सामान्य जनसमूह है; ‘भीड़’ आधुनिक हिन्दी का सहज और सटीक पर्याय है।
- source_word: Ἀλέξανδρον / Ἀλέξανδρος
  choice: सिकंदर
  rationale: Ἀλέξανδρος के लिए हिन्दी बाइबिल परम्परा और सामान्य हिन्दी में प्रचलित नाम-रूप ‘सिकंदर’ अपनाया गया है।
