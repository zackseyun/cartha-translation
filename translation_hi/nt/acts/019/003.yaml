source:
  edition: SBLGNT
  text: εἶπέν ⸀τε· Εἰς τί οὖν ἐβαπτίσθητε; οἱ δὲ εἶπαν· Εἰς τὸ Ἰωάννου βάπτισμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/003.yaml
  text: And he said[a], “Into what then were you baptized?” And they said, “Into John's baptism.”
translation:
  language: hi
  text: तब उसने कहा, “तो फिर तुमने किसमें बपतिस्मा लिया?” उन्होंने कहा, “यूहन्ना के बपतिस्मे में।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπέν τε
  choice: तब उसने कहा
  rationale: λέγω का सामान्य अर्थ ‘कहना’ है। τε पिछले संवाद से हल्का कथात्मक संबंध जोड़ता है; हिंदी में ‘तब’ इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Εἰς τί
  choice: किसमें
  rationale: εἰς का मूल संबंध यहाँ बपतिस्मे के संबद्ध क्षेत्र या पहचान से है। ‘किसमें’ उत्तर में दोहराए गए εἰς के साथ समानांतरता बनाए रखता है।
- source_word: οὖν
  choice: तो फिर
  rationale: οὖν पिछले उत्तर से निकलने वाला निष्कर्ष या अगला प्रश्न सूचित करता है; संवाद में ‘तो फिर’ स्वाभाविक और स्पष्ट है।
- source_word: ἐβαπτίσθητε
  choice: तुमने ... बपतिस्मा लिया
  rationale: यद्यपि यूनानी रूप कर्मवाच्य है, आधुनिक हिंदी में ‘बपतिस्मा लिया’ इस संस्कार को ग्रहण करने का स्वाभाविक और प्रचलित ढंग है तथा अर्थ को सुरक्षित रखता है।
- source_word: Εἰς τὸ Ἰωάννου βάπτισμα
  choice: यूहन्ना के बपतिस्मे में
  rationale: दोहराए गए εἰς को ‘में’ द्वारा सुरक्षित रखा गया है और Ἰωάννου के संबंधकारक को ‘यूहन्ना के’ से व्यक्त किया गया है।
- source_word: βάπτισμα
  choice: बपतिस्मा
  rationale: यह βάπτισμα के लिए हिंदी में स्थापित और संदर्भानुकूल धार्मिक शब्द है; इसे किसी व्याख्यात्मक संप्रदायगत पद से नहीं बदला गया।
theological_decisions:
- issue: प्रश्न और उत्तर, दोनों में εἰς को सुरक्षित रखना
  choice: ‘किसमें ...?’ / ‘... बपतिस्मे में’
  alternative: ‘तुमने कौन-सा बपतिस्मा लिया?’ / ‘यूहन्ना का बपतिस्मा’
  rationale: ‘में’ की पुनरावृत्ति यूनानी प्रश्नोत्तर की समानांतर रचना और बपतिस्मे से जुड़ी पहचान या संबद्धता को बनाए रखती है, बिना उसके धर्मवैज्ञानिक अर्थ को किसी विशेष मत के अनुसार तय किए।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, संवादात्मक किंतु गरिमापूर्ण है। ‘तुम’ बहुवचन श्रोताओं के लिए स्वाभाविक है। पद में कोई पादटिप्पणी आवश्यक नहीं; अंग्रेज़ी परत में दिया गया वैकल्पिक पाठ वस्तुतः उसी उत्तर का शैलीगत रूप है और हिंदी मुख्य पाठ में अर्थ स्पष्ट है।
