  to: इस प्रकार प्रभु का वचन बड़ी सामर्थ्य से बढ़ता और प्रबल होता गया।
  rationale: A minimal stylistic revision makes the adverbial force of κατὰ κράτος idiomatic in modern standard Hindi while retaining the source’s resultative transition, title, two imperfect verbal ideas, and theological restraint.
