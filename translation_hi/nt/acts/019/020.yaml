base_translation:
  language: en
  yaml_path: translation/nt/acts/019/020.yaml
  text: So the word of the Lord was growing mightily and prevailing[a].
translation:
  language: hi
  text: इस प्रकार प्रभु का वचन बड़ी सामर्थ्य से बढ़ता और प्रबल होता गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह पिछले घटनाक्रम का परिणाम बताता है और यूनानी के निष्कर्षसूचक बल को स्वाभाविक, गरिमापूर्ण हिन्दी में रखता है।
- source_word: κατὰ κράτος
  choice: सामर्थ्य के साथ
  rationale: यह पदबंध बल और प्रभावशाली सामर्थ्य का भाव देता है। संज्ञात्मक अभिव्यक्ति κράτος को बनाए रखते हुए यह दोनों क्रियाओं—बढ़ने और प्रबल होने—से स्वाभाविक रूप से जुड़ता है।
- source_word: τοῦ κυρίου
  choice: प्रभु का
  rationale: यूनानी पाठ केवल उपाधि ‘प्रभु’ देता है; इसलिए मुख्य पाठ में संदर्भित व्यक्ति को ‘यीशु’ कहकर स्पष्ट नहीं किया गया।
- source_word: ὁ λόγος
  choice: वचन
  rationale: यह प्रचार किए जा रहे सुसमाचार-संदेश की ओर संकेत करता है और प्रेरितों के काम में बार-बार आने वाली ‘प्रभु का वचन’ अभिव्यक्ति को सुरक्षित रखता है।
- source_word: ηὔξανεν
  choice: बढ़ता ... गया
  rationale: अपूर्ण काल की निरंतर प्रगति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἴσχυεν
  choice: प्रबल होता गया
  rationale: यह मजबूत और प्रभावी होते जाने का अर्थ व्यक्त करता है; ‘बढ़ता और प्रबल होता गया’ दोनों यूनानी क्रियाओं को अलग और स्पष्ट रखता है।
theological_decisions:
- issue: τοῦ κυρίου में ‘प्रभु’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘प्रभु’
  alternative: ‘प्रभु यीशु’
  rationale: संदर्भ से यीशु अभिप्रेत जान पड़ते हैं, पर यूनानी पाठ में नाम नहीं है; अतः अनुवाद उस निहित पहचान को स्पष्ट जोड़कर तनाव समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य है। ‘सामर्थ्य के साथ’ को वाक्य में इस तरह रखा गया है कि वह वचन की समूची बढ़ती और प्रबल होती प्रगति का वर्णन करे।
