  text: καὶ ἐπλήσθη ἡ ⸀πόλις τῆς συγχύσεως, ὥρμησάν τε ὁμοθυμαδὸν εἰς τὸ θέατρον συναρπάσαντες Γάϊον καὶ Ἀρίσταρχον Μακεδόνας, συνεκδήμους Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/029.yaml
  text: And the city was filled with confusion[a], and they rushed together into the theater, dragging along Gaius and Aristarchus, Macedonians who were Paul’s traveling companions.
translation:
  language: hi
  text: और नगर में अफरा-तफरी मच गई। वे गयुस और अरिस्तर्खुस को—जो मकिदुनिया के निवासी और पौलुस के सहयात्री थे—पकड़कर घसीटते हुए एक साथ रंगशाला में जा घुसे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गयुस और अरिस्तर्खुस को बलपूर्वक पकड़कर।” यूनानी शब्द में बलपूर्वक पकड़ लेने और साथ ले जाने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη ἡ πόλις τῆς συγχύσεως
  choice: पूरा नगर कोलाहल से भर गया
  rationale: ग्रीक निष्क्रिय क्रिया और संबंधकारक रचना को स्वाभाविक हिन्दी में रखा गया है। यहाँ συγχύσεως भीड़ की भ्रमपूर्ण अव्यवस्था और हंगामे को दर्शाता है; ‘कोलाहल’ दृश्य की श्रव्य और सामाजिक अशांति दोनों व्यक्त करता है।
- source_word: ὥρμησάν
  choice: जा घुसे
  rationale: क्रिया अचानक और प्रबल सामूहिक गति बताती है। ‘जा घुसे’ रंगशाला की ओर भीड़ के आवेगपूर्ण प्रवेश को सहज हिन्दी में व्यक्त करता है।
- source_word: ὁμοθυμαδόν
  choice: एक साथ
  rationale: दंगे के संदर्भ में यह सामूहिक कार्रवाई है, सकारात्मक मनोभाव की एकता नहीं; ‘एक साथ’ इस अर्थ को बिना अतिरिक्त धार्मिक रंग दिए व्यक्त करता है।
- source_word: θέατρον
  choice: रंगशाला
  rationale: θέατρον नगर की सार्वजनिक नाट्य एवं सभा-स्थली को दर्शाता है। ‘रंगशाला’ आधुनिक हिन्दी में ‘थिएटर’ की अपेक्षा प्राचीन सार्वजनिक स्थल के लिए अधिक उपयुक्त और गरिमापूर्ण है, जबकि ‘अखाड़ा’ या ‘एम्फीथिएटर’ अनावश्यक विशिष्टता लाते।
- source_word: συναρπάσαντες
  choice: पकड़कर घसीटते हुए
  rationale: कृदंत बलपूर्वक पकड़ लेने और साथ ले जाने दोनों को समेटता है। यह चुनाव भीड़ की हिंसा और रंगशाला की ओर गति को स्पष्ट रखता है।
- source_word: Γάϊον καὶ Ἀρίσταρχον
  choice: गयुस और अरिस्तर्खुस
  rationale: व्यक्तिनामों का प्रचलित हिन्दी बाइबलीय लिप्यंतरण किया गया है।
- source_word: Μακεδόνας
  choice: मकिदुनिया के निवासी
  rationale: भौगोलिक पहचान को सामान्य पाठक के लिए ‘मकिदुनी’ की अपेक्षा अधिक स्पष्ट ढंग से व्यक्त करता है।
- source_word: συνεκδήμους Παύλου
  choice: पौलुस के सहयात्री
  rationale: यह शब्द पौलुस के साथ घर से बाहर यात्रा करने वाले साथियों को दर्शाता है; ‘सहयात्री’ संक्षिप्त, स्वाभाविक और सटीक है।
- source_word: τε
  choice: वे
  rationale: ग्रीक संयोजक अगले घटनाक्रम को पहले से जोड़ता है। हिन्दी में नया वाक्य और सर्वनाम घटनाओं का प्रवाह स्वाभाविक रखते हैं; अलग ‘और’ अनिवार्य नहीं है।
