base_translation:
  language: en
  yaml_path: translation/nt/acts/019/018.yaml
  text: And many of those who had believed were coming[a], confessing and disclosing their practices.
translation:
  language: hi
  text: और जिन लोगों ने विश्वास किया था, उनमें से बहुत-से लोग आते थे और अपने कामों को स्वीकार करते और उनका खुलासा करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοί
  choice: बहुत-से लोग
  rationale: यह बहुवचन परिमाण को सहज और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τε
  choice: और
  rationale: यह पद पिछले वृत्तांत से वाक्य का हल्का संबंध बनाए रखता है।
- source_word: τῶν πεπιστευκότων
  choice: जिन्होंने विश्वास किया था, उनमें से
  rationale: पूर्ण कृदन्त पहले किए गए विश्वास और उसकी बनी हुई प्रासंगिकता को व्यक्त करता है; इसे केवल तकनीकी समूह-संज्ञा ‘विश्वासियों’ में नहीं बदला गया।
- source_word: ἤρχοντο
  choice: आते थे
  rationale: अपूर्ण भूतकाल बीते समय में जारी या बार-बार होने वाली क्रिया को दर्शाता है।
- source_word: ἐξομολογούμενοι
  choice: स्वीकार करके
  rationale: यह अंगीकार या स्वीकार करने का सीधा भाव देता है और यह अनावश्यक रूप से तय नहीं करता कि उन्होंने पाप, कर्म या संलिप्तता में से किसका अंगीकार किया।
- source_word: ἀναγγέλλοντες
  choice: खुलासा करते थे
  rationale: सन्दर्भ में पहले छिपी हुई गतिविधियों को प्रकट करने का भाव है; ‘खुलासा’ स्वीकार करने की क्रिया से अर्थपूर्ण भेद भी बनाए रखता है।
- source_word: τὰς πράξεις αὐτῶν
  choice: अपने कामों
  rationale: ‘काम’ यूनानी पद की व्यापकता बनाए रखता है और सन्दर्भ में व्यवहार या गतिविधियों की ओर संकेत कर सकता है, बिना उसे केवल ‘पापों’ या केवल ‘जादू-टोने’ तक सीमित किए।
theological_decisions:
- issue: क्या πεπιστευκότων को स्थायी समूह-संज्ञा ‘विश्वासियों’ के रूप में प्रस्तुत किया जाए या पहले किए गए विश्वास की क्रिया के रूप में।
  choice: जिन्होंने विश्वास किया था
  alternative: विश्वासियों में से
  rationale: पूर्ण कृदन्त पहले विश्वास करने और उसके वर्तमान परिणाम का संकेत देता है; चुना हुआ रूप इस कालगत सूक्ष्मता को बनाए रखता है।
- issue: क्या τὰς πράξεις αὐτῶν को विशेष रूप से पाप, जादुई क्रियाएँ या सामान्य काम कहा जाए।
  choice: अपने कामों
  alternative: अपनी प्रथाओं / अपने पापों
  rationale: निकटवर्ती सन्दर्भ जादुई गतिविधियों से जुड़ा है, पर यूनानी संज्ञा स्वयं अधिक व्यापक है। ‘कामों’ उस व्यापकता और सन्दर्भगत तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आते थे’ से अपूर्ण भूतकाल की जारी या पुनरावृत्त क्रिया व्यक्त होती है; वाक्य में अंगीकार और प्रकट करने की दोनों अलग क्रियाएँ सुरक्षित हैं।
