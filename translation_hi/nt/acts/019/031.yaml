source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτὸν παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/031.yaml
  text: And even some of the Asiarchs[a], being his friends[c][b], sent word to him and urged him not to venture into the theater.
translation:
  language: hi
  text: यहाँ तक कि आसिया के कुछ प्रमुख अधिकारी[a] भी, जो उसके मित्र थे, उसके पास संदेश भेजकर[b] उससे आग्रह करते रहे कि वह रंगशाला में जाकर अपने आपको खतरे में न डाले।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में इनके लिए विशेष पदनाम ‘आसियार्ख’ है। ये रोमी प्रांत आसिया से जुड़े प्रतिष्ठित प्रांतीय अधिकारी थे।
    reason: cultural_note
  - marker: b
    text: या, “उसके पास किसी को भेजकर।” यूनानी में भेजी गई वस्तु या व्यक्ति नहीं बताया गया है।
    reason: lexical_alternative
  - marker: c
    text: अधिक शाब्दिक रूप से, “वह अपने आपको रंगशाला में प्रस्तुत न करे” या “रंगशाला में न जाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ καὶ
  choice: यहाँ तक कि ... कुछ ... भी
  rationale: τινὲς की अनिश्चित बहुवचन भावना को ‘कुछ’ से और καί के बलाघात को ‘यहाँ तक कि ... भी’ से व्यक्त किया गया है; δέ को हिंदी के स्वाभाविक कथाप्रवाह में अलग शब्द देना आवश्यक नहीं है।
- source_word: τῶν Ἀσιαρχῶν
  choice: आसिया के कुछ प्रमुख अधिकारी
  rationale: Ἀσιάρχης रोमी प्रांत आसिया से जुड़ी एक विशिष्ट प्रतिष्ठित उपाधि थी। मुख्य पाठ में सहज और समझने योग्य वर्णन रखा गया है, जबकि पद की तकनीकी प्रकृति पादटिप्पणी में बताई गई है।
- source_word: ὄντες αὐτῷ φίλοι
  choice: जो उसके मित्र थे
  rationale: यह सहभागी पदबंध पृष्ठभूमि में उनके और उस व्यक्ति के मैत्री-संबंध को बताता है; हिंदी संबंधवाचक उपवाक्य स्वाभाविक है और φίλοι का सीधा अर्थ बनाए रखता है।
- source_word: πέμψαντες πρὸς αὐτὸν
  choice: उसके पास संदेश भेजकर
  rationale: यूनानी में भेजी गई वस्तु या व्यक्ति स्पष्ट नहीं है। प्रसंग में सूचना पहुँचाना अभिप्रेत है, इसलिए ‘संदेश’ स्वाभाविक पूर्ति है; वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
- source_word: παρεκάλουν
  choice: आग्रह करते रहे
  rationale: παρακαλέω की गंभीर विनती और अपूर्ण भूतकाल की जारी या पुनरावृत्त क्रिया—दोनों को संक्षेप में व्यक्त करता है।
- source_word: μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον
  choice: वह रंगशाला में जाकर अपने आपको खतरे में न डाले
  rationale: शाब्दिक रूप ‘अपने आपको रंगशाला में न दे’ हिंदी में अस्पष्ट है। प्रसंग में अर्थ स्वेच्छा से उस खतरनाक भीड़ के बीच जाने का है; यह रूप उस भाव को स्वाभाविक हिंदी में व्यक्त करता है, और अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: τὸ θέατρον
  choice: रंगशाला
  rationale: यह नगर का सार्वजनिक नाट्य और सभा-स्थल था। ‘रंगशाला’ आधुनिक हिंदी में स्थान का स्वरूप बताती है, बिना उसे केवल मंच या केवल अखाड़ा कहने के।
