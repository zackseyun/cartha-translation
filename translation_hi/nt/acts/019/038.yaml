source:
  edition: SBLGNT
  text: εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται ἔχουσιν πρός τινα λόγον, ἀγοραῖοι ἄγονται καὶ ἀνθύπατοί εἰσιν, ἐγκαλείτωσαν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/038.yaml
  text: If[a], then, Demetrius and the craftsmen with him have a complaint against anyone, court sessions are being held and there are proconsuls[b]; let them bring charges against one another.
translation:
  language: hi
  text: इसलिए यदि देमेत्रियुस और उसके साथ के कारीगरों को किसी के विरुद्ध कोई शिकायत है, तो अदालतें बैठती हैं[a] और रोमी प्रान्तपाल[b] मौजूद हैं; वे एक-दूसरे पर आरोप लगाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात आधिकारिक न्यायिक कार्यवाहियाँ आयोजित हो रही हैं। यूनानी पदबंध का अनुवाद ‘अदालतों की बैठकें हो रही हैं’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘प्रान्तपाल’ (रोमी प्रान्तों के उच्च अधिकारी; प्रोकॉन्सल) बहुवचन में है। इसका आशय यह भी हो सकता है कि ऐसे अधिकारी उपलब्ध या उपस्थित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: इसलिए यदि
  rationale: οὖν के निष्कर्षात्मक-संक्रमणकारी भाव को ‘इसलिए’ और εἰ को ‘यदि’ से स्वाभाविक हिन्दी में व्यक्त किया गया है; μέν को अलग शब्द देकर वाक्य को बोझिल नहीं बनाया गया।
- source_word: Δημήτριος
  choice: देमेत्रियुस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी में स्रोत-निकट लिप्यंतरण।
- source_word: οἱ σὺν αὐτῷ τεχνῖται
  choice: उसके साथ के कारीगर
  rationale: τεχνῖται कुशल शिल्पकारों को दर्शाता है; ‘कारीगर’ सामान्य पाठक के लिए सहज है और ‘उसके साथ के’ संबंध को यूनानी से अधिक विशिष्ट नहीं बनाता।
- source_word: ἔχουσιν πρός τινα λόγον
  choice: किसी के विरुद्ध कोई शिकायत है
  rationale: यह पदबंध कानूनी विवाद या शिकायत का संकेत देता है; ‘शिकायत’ न्यायिक संदर्भ को स्पष्ट और स्वाभाविक रूप से पहुँचाता है।
- source_word: ἀγοραῖοι ἄγονται
  choice: अदालतें बैठती हैं
  rationale: यह आधिकारिक रूप से आयोजित न्यायिक कार्यवाहियों को दर्शाता है। हिन्दी मुहावरे में ‘अदालतें बैठती हैं’ संक्षिप्त, स्वाभाविक और संस्थागत अर्थ के अनुरूप है।
- source_word: ἀνθύπατοί εἰσιν
  choice: हाकिम मौजूद हैं
  rationale: ἀνθύπατοι रोमी प्रांतीय अधिकारियों के लिए प्रयुक्त है। मुख्य पाठ में बोधगम्य ‘हाकिम’ रखा गया है और सटीक पदनाम पादटिप्पणी में दिया गया है; बहुवचन को सुरक्षित रखा गया है।
- source_word: ἐγκαλείτωσαν ἀλλήλοις
  choice: वे एक-दूसरे पर विधिवत आरोप लगाएँ
  rationale: ἐγκαλείτωσαν न्यायिक रूप से अभियोग लगाने का भाव देता है और ἀλλήλοις पारस्परिकता रखता है। ‘विधिवत’ यहाँ उचित कानूनी प्रक्रिया को स्पष्ट करता है, जो पूरे प्रसंग में निहित है।
