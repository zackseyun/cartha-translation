  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज न्यायिक रजिस्टर अपनाया गया है। ‘अदालतें बैठती हैं’ सामान्य हिन्दी मुहावरा है। ‘हाकिम’ पाठ में समझने योग्य है, जबकि रोमी पद की ऐतिहासिक सटीकता पादटिप्पणी में दी गई है।
