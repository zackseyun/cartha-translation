  text: τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/010.yaml
  text: This continued for two years[a], so that all who lived in Asia heard the word of the Lord, both Jews and Greeks.
translation:
  language: hi
  text: यह क्रम दो वर्ष तक चलता रहा, जिसके फलस्वरूप आसिया[a] में रहनेवाले सभी लोगों ने प्रभु का वचन सुना—यहूदी और यूनानी दोनों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘आसिया’ से आशय पश्चिमी एशिया माइनर के रोमी प्रांत से है, आधुनिक एशिया महाद्वीप से नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο δὲ ἐγένετο
  choice: यह क्रम ... चलता रहा
  rationale: ἐγένετο मूलतः ‘हुआ’ है, पर पिछले पद में बताई गई नियमित शिक्षा-व्यवस्था और उसकी अवधि की ओर संकेत करता है। ‘यह क्रम चलता रहा’ उस निरंतर गतिविधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ ἔτη δύο
  choice: दो वर्ष तक
  rationale: ἐπί यहाँ समयावधि व्यक्त करता है; ‘दो वर्ष तक’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: ὥστε
  choice: जिसके फलस्वरूप
  rationale: ὥστε पूर्ववर्ती गतिविधि का परिणाम बताता है। ‘जिसके फलस्वरूप’ उसके परिणामसूचक बल को स्पष्ट रखता है।
- source_word: πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν
  choice: आसिया में रहनेवाले सभी लोगों
  rationale: संज्ञा के रूप में प्रयुक्त participle κατοικοῦντας वहाँ निवास करनेवालों को और πάντας उनकी समग्रता को व्यक्त करता है। ‘आसिया’ रोमी प्रांत का प्राचीन नाम है, जिसकी व्याख्या पाद-टिप्पणी में दी गई है।
- source_word: ἀκοῦσαι
  choice: सुना
  rationale: ὥστε के बाद aorist infinitive परिणामी सुनने को व्यक्त करता है; ‘सुना’ सीधा और पर्याप्त अनुवाद है।
- source_word: τὸν λόγον
  choice: वचन
  rationale: λόγος यहाँ प्रचारित सुसमाचार-संदेश के लिए लूका का बार-बार प्रयुक्त धर्मवैचारिक पद है। ‘वचन’ उस साहित्यिक और धर्मवैचारिक बनावट को बनाए रखता है।
- source_word: τοῦ κυρίου
  choice: प्रभु का
  rationale: यह genitive λόγον को विशेषित करता है। κύριος के लिए प्रतिष्ठित, गरिमापूर्ण और सामान्य हिन्दी रूप ‘प्रभु’ है।
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: यहूदी और यूनानी दोनों
  rationale: τε καὶ दोनों समूहों को समावेशी रूप से जोड़ता है; यह रचना उस व्यापकता को स्वाभाविक हिन्दी में सुरक्षित रखती है।
theological_decisions:
- issue: Ἀσία का भौगोलिक अर्थ
  choice: मुख्य पाठ में प्राचीन नाम ‘आसिया’, और पाद-टिप्पणी में रोमी प्रांत की पहचान
  alternative: आधुनिक एशिया महाद्वीप अथवा मुख्य पाठ में विस्तार से ‘आसिया का रोमी प्रांत’
  rationale: प्रेरितों के काम में Ἀσία सामान्यतः पश्चिमी एशिया माइनर के रोमी प्रांत का नाम है। प्राचीन नाम को मुख्य पाठ में रखने और ऐतिहासिक स्पष्टीकरण पाद-टिप्पणी में देने से पाठ संक्षिप्त रहता है तथा आधुनिक महाद्वीप से भ्रम भी दूर होता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आसिया’ प्राचीन प्रांतीय नाम को आधुनिक ‘एशिया’ महाद्वीप से अलग दिखाता है; पाद-टिप्पणी का चिह्न मुख्य पाठ में उपस्थित है।
