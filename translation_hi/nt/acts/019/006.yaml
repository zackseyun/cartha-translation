  yaml_path: translation/nt/acts/019/006.yaml
  text: And when Paul laid his hands on them[a], the Holy Spirit came upon them, and they began speaking in tongues and prophesying.
translation:
  language: hi
  text: और जब पौलुस ने उन पर हाथ रखे, तो पवित्र आत्मा उन पर आया, और वे भाषाओं में बोलने[a] और भविष्यवाणी करने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द γλώσσαις का अर्थ ‘जीभें’ या ‘भाषाएँ’ हो सकता है। यहाँ यह निश्चित नहीं किया गया है कि ये ज्ञात मानवीय भाषाएँ थीं या किसी अन्य प्रकार की आत्मा-प्रेरित वाणी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας
  choice: जब पौलुस ने उन पर हाथ रखे
  rationale: सम्बन्धकारक निरपेक्ष अओरिस्ट कृदन्त को स्वाभाविक हिन्दी कालवाचक उपवाक्य में व्यक्त किया गया है; ‘हाथ रखे’ मूल मुहावरे को बनाए रखता है।
- source_word: ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτούς
  choice: पवित्र आत्मा उन पर आया
  rationale: यह ἔρχομαι और ἐπί की दिशात्मकता तथा लूका–प्रेरितों की कथात्मक अभिव्यक्ति को सरल, प्रचलित हिन्दी में सुरक्षित रखता है।
- source_word: ἐλάλουν τε γλώσσαις
  choice: वे भाषाओं में बोलने लगे
  rationale: अपूर्ण काल कथानक में आरम्भ होकर जारी रहने वाली क्रिया का संकेत दे सकता है; ‘बोलने लगे’ इसे स्वाभाविक हिन्दी में व्यक्त करता है। γλώσσαις की बहुवचनता रखी गई है, पर उसकी प्रकृति को मुख्य पाठ में परिभाषित नहीं किया गया।
- source_word: καὶ ἐπροφήτευον
  choice: और भविष्यवाणी करने लगे
  rationale: क्रिया के भविष्यसूचक वचन बोलने के सीधे अर्थ और अपूर्ण काल के समानान्तर पक्ष को स्पष्ट, स्थापित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रेरितों 19:6 में γλώσσαις का स्वरूप
  choice: मुख्य पाठ में ‘भाषाओं में’ रखकर इस वाणी का स्वरूप अनिर्धारित छोड़ा गया है।
  alternative: ‘अन्य भाषाएँ’ कहकर ज्ञात मानवीय भाषाओं पर बल देना, अथवा ऐसी शब्दावली अपनाना जो उन्मत्त/अज्ञात वाणी को निश्चित करे।
  rationale: γλῶσσα का अर्थ ‘जीभ’ अथवा ‘भाषा’ हो सकता है, और यह पद अकेले इस विवाद को निर्णायक रूप से हल नहीं करता। इसलिए किसी साम्प्रदायिक निष्कर्ष को पाठ में नहीं जोड़ा गया।
- issue: पवित्र आत्मा के आने और हाथ रखने का सम्बन्ध
  choice: घटनाओं को उनके कथात्मक क्रम में बताया गया है, बिना कारणात्मक या संस्कार-संबंधी व्याख्या जोड़े।
  alternative: हाथ रखने को पवित्र आत्मा के आने का अनिवार्य कारण या सार्वभौमिक विधि बताना।
  rationale: मूल पाठ घटना और क्रम बताता है, पर उनके सम्पूर्ण धर्मवैज्ञानिक तंत्र की व्याख्या नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘पवित्र आत्मा’, ‘हाथ रखे’ और ‘भविष्यवाणी’ जैसे व्यापक रूप से समझे जाने वाले बाइबिलीय पद रखे गए हैं; वाक्य में अनावश्यक संस्कृतनिष्ठता और साम्प्रदायिक तकनीकी भाषा से बचा गया है।
