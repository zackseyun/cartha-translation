source:
  edition: SBLGNT
  text: καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ οὐ δυνησόμεθα ⸀ἀποδοῦναι λόγον ⸀περὶ τῆς συστροφῆς ταύτης. καὶ ταῦτα εἰπὼν ἀπέλυσεν τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/040.yaml
  text: For indeed we are in danger of being charged with rioting over what happened today[a], since there is no cause for it, and we will not be able to give an account for this commotion. And after saying these things[c][b], he dismissed the assembly.
translation:
  language: hi
  text: क्योंकि सचमुच आज की घटना को लेकर हम पर दंगे का आरोप लगाए जाने का खतरा है[a], क्योंकि ऐसा कोई आधार नहीं है जिसके सहारे हम इस जमावड़े[b] का स्पष्टीकरण दे सकें। इतना कहकर उसने सभा[c] को विदा कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विद्रोह’ अथवा ‘राजद्रोह’; यूनानी शब्द गंभीर नागरिक बगावत का भी बोध करा सकता है, पर यहाँ सार्वजनिक हंगामे के प्रसंग में ‘दंगा’ अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हंगामे’ अथवा ‘अव्यवस्थित जमावड़े’; यूनानी शब्द अशांत ढंग से इकट्ठी हुई भीड़ को सूचित करता है और आगे आए अधिक औपचारिक ‘सभा’ से भिन्न है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ ‘सभा’ के लिए वही यूनानी शब्द है जिसका अनुवाद अन्य स्थानों पर प्रायः ‘कलीसिया’ किया जाता है; पर इस प्रसंग में इसका अर्थ इफिसुस की नागरिक सभा है।
    reason: cross_reference
