- source_word: ἐγκαλεῖσθαι
  choice: आरोप लगाए जाने
  rationale: नगर के अधिकारी और रोमी प्रशासन के संदर्भ में क्रिया का कानूनी-अभियोगात्मक भाव सुरक्षित रहता है।
- source_word: στάσεως
  choice: दंगा कराने का
  rationale: यहाँ सार्वजनिक व्यवस्था भंग करने वाले नागरिक उपद्रव का भाव है; ‘दंगा’ प्रसंगानुकूल है, जबकि ‘राजद्रोह’ सम्भवतः राजनीतिक अर्थ को आवश्यकता से अधिक प्रबल कर देता।
- source_word: περὶ τῆς σήμερον
  choice: आज की घटना को लेकर
  rationale: ग्रीक की संक्षिप्त अभिव्यक्ति को स्वाभाविक हिन्दी में स्पष्ट करता है, बिना किसी अतिरिक्त घटना का विवरण जोड़े।
- source_word: μηδενὸς αἰτίου ὑπάρχοντος
  choice: जबकि इसका कोई उचित कारण नहीं है
  rationale: कारण या वैध आधार के अभाव को व्यक्त करता है और αἴτιον के न्यायिक भाव को ‘उचित कारण’ से बनाए रखता है।
- source_word: ἀποδοῦναι λόγον
  choice: कोई जवाब ... दे सकेंगे
  rationale: अधिकारियों के सामने स्पष्टीकरण या हिसाब देने के प्रचलित भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: συστροφῆς
  choice: उपद्रव
  rationale: अव्यवस्थित, अशांत जमावड़े से उत्पन्न हलचल को संक्षेप में व्यक्त करता है और आगे के औपचारिक ‘सभा’ से भेद रखता है।
- source_word: ἐκκλησίαν
  choice: सभा
  rationale: यहाँ कलीसिया नहीं, इफिसुस में एकत्र नागरिक सभा अभिप्रेत है; ‘सभा’ इस प्रसंग में स्वाभाविक और सटीक है।
- source_word: ἀπέλυσεν
  choice: विदा कर दिया
  rationale: सभा समाप्त करके उपस्थित लोगों को जाने देने का अर्थ स्वाभाविक हिन्दी में देता है।
- source_word: καὶ γὰρ
  choice: क्योंकि सचमुच
  rationale: पूर्व कथन से कारणात्मक संबंध और कथन का बल—दोनों बनाए रखता है।
