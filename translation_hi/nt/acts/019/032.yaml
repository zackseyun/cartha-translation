  text: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον, ἦν γὰρ ἡ ἐκκλησία συγκεχυμένη, καὶ οἱ πλείους οὐκ ᾔδεισαν τίνος ἕνεκα συνεληλύθεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/032.yaml
  text: So then some were shouting one thing and some another[a], for the assembly was in confusion, and most of them did not know why they had come together.
translation:
  language: hi
  text: तब कुछ लोग एक बात चिल्ला रहे थे और कुछ दूसरी, क्योंकि सभा[a] में भ्रम फैला हुआ था, और उनमें से अधिकांश नहीं जानते थे कि वे किस कारण इकट्ठे हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जमाव” या “भीड़।” यूनानी शब्द ἐκκλησία यहाँ कलीसिया के बजाय नागरिक सभा के अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον
  choice: इसलिए कोई कुछ चिल्ला रहा था और कोई कुछ और
  rationale: वितरणात्मक विरोध ‘कोई... कोई...’ के द्वारा स्वाभाविक हिन्दी में व्यक्त होता है। अपूर्णकाल ἔκραζον लगातार हो रहे शोर को ‘चिल्ला रहा था’ से दर्शाता है; οὖν को ‘इसलिए’ से जोड़ा गया है।
- source_word: ἐκκλησία
  choice: सभा
  rationale: इस नागरिक उपद्रव के प्रसंग में यह शब्द मसीही कलीसिया नहीं, बल्कि एकत्र सार्वजनिक सभा को सूचित करता है। ‘सभा’ मूल शब्द के औपचारिक-सामूहिक भाव को सुरक्षित रखता है।
- source_word: συγκεχυμένη
  choice: बड़ी उलझन थी
  rationale: सिद्ध कृदन्त सभा की बनी हुई भ्रम और अव्यवस्था की दशा बताता है। ‘बड़ी उलझन थी’ आधुनिक हिन्दी में इस परिणामगत स्थिति को सहजता से व्यक्त करता है।
- source_word: οἱ πλείους
  choice: उनमें से अधिकांश
  rationale: यह संज्ञात्मक तुलनात्मक रूप एकत्र लोगों के बहुमत को दर्शाता है।
- source_word: τίνος ἕνεκα
  choice: किसलिए
  rationale: यह मुहावरा कारण अथवा प्रयोजन पूछता है; ‘किसलिए’ संक्षिप्त और स्वाभाविक है तथा दोनों की संभावित छाया बनाए रखता है।
- source_word: συνεληλύθεισαν
  choice: इकट्ठे हुए थे
  rationale: पूर्वपूर्णकाल कथानक के उस क्षण से पहले पूर्ण हो चुके एकत्र होने को दर्शाता है; ‘हुए थे’ उस पूर्वता को सुरक्षित रखता है।
theological_decisions:
- issue: ἐκκλησία का अर्थ
  choice: सभा
  alternative: कलीसिया
  rationale: प्रसंग इफिसुस की नागरिक भीड़/सभा का है, मसीही समुदाय का नहीं; इसलिए ‘कलीसिया’ यहाँ भ्रामक धार्मिक अर्थ ले आएगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘सभा’ औपचारिक नागरिक जमाव का भाव देता है, जबकि पादटिप्पणी प्रसंगानुकूल वैकल्पिक अर्थ स्पष्ट करती है।
