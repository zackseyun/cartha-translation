- source_word: διὰ τῶν χειρῶν Παύλου
  choice: पौलुस के हाथों से
  rationale: διά के साथ सम्बन्धकारक माध्यम को दर्शाता है। ‘हाथों से’ मूल की ठोस अभिव्यक्ति बनाए रखता और पौलुस को माध्यम के रूप में प्रस्तुत करता है।
- source_word: Παύλου
