- issue: सामर्थ्य के कामों में कर्तृत्व
  choice: परमेश्वर काम करने वाला कर्ता है और पौलुस उसका मानवीय माध्यम है।
  alternative: पौलुस स्वयं इन कामों का स्वतंत्र कर्ता था।
  rationale: यूनानी में ὁ θεὸς क्रिया ἐποίει का व्याकरणिक कर्ता है, जबकि διὰ τῶν χειρῶν Παύλου माध्यम बताता है। अनुवाद इस भेद को बनाए रखता है।
