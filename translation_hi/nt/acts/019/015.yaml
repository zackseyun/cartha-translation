source:
  edition: SBLGNT
  text: ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπεν ⸀αὐτοῖς· ⸀Τὸν Ἰησοῦν γινώσκω καὶ τὸν Παῦλον ἐπίσταμαι, ὑμεῖς δὲ τίνες ἐστέ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/015.yaml
  text: But the evil spirit answered them[a], “Jesus I know, and Paul I recognize—but who are you?”
translation:
  language: hi
  text: पर दुष्ट आत्मा ने उन्हें उत्तर दिया, “यीशु को मैं जानता हूँ, और पौलुस को पहचानता हूँ[a]; पर तुम कौन हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पौलुस के विषय में जानता हूँ।” यूनानी में “जानता हूँ” (γινώσκω) और “पहचानता हूँ/जानता हूँ” (ἐπίσταμαι) के लिए दो अलग क्रियाएँ हैं; उनके भाव में कुछ अंतर हो सकता है।
    reason: मूल भाषा की दो भिन्न ज्ञान-सूचक क्रियाओं और ἐπίσταμαι के स्वीकार्य वैकल्पिक अर्थ को दर्शाना।
lexical_decisions:
- source_word: ἀποκριθὲν ... εἶπεν αὐτοῖς
  choice: ने उन्हें उत्तर दिया
  rationale: यूनानी कृदंत और मुख्य क्रिया मिलकर उत्तर में कही गई बात का परिचय देते हैं। हिंदी में ‘ने उन्हें उत्तर दिया’ स्वाभाविक है और प्रत्युत्तर का भाव बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: यहाँ δέ पिछले घटनाक्रम से हल्का विरोध और नया मोड़ दिखाता है; ‘पर’ इसे संक्षेप में व्यक्त करता है।
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: दुष्ट आत्मा
  rationale: इस प्रसंग में πνεῦμα एक व्यक्तिगत आत्मिक सत्ता और πονηρόν उसकी दुष्ट प्रकृति को सूचित करता है। ‘दुष्ट आत्मा’ स्पष्ट और प्रचलित हिंदी है।
- source_word: Τὸν Ἰησοῦν γινώσκω
  choice: यीशु को मैं जानता हूँ
  rationale: γινώσκω का सीधा अर्थ ‘जानना’ है। ‘मैं’ को व्यक्त रखने से यूनानी में नाम को आगे रखकर दिए गए बल और आगे आने वाले ‘तुम’ के विरोध को सहारा मिलता है।
- source_word: τὸν Παῦλον ἐπίσταμαι
  choice: पौलुस से परिचित हूँ
  rationale: ἐπίσταμαι जानने या किसी के विषय में अवगत होने का भाव रखता है। ‘परिचित हूँ’ पहले प्रयुक्त ‘जानता हूँ’ से शब्दगत अंतर बनाए रखता है, पर ज्ञान की किसी निश्चित श्रेणी का अनावश्यक दावा नहीं करता।
- source_word: ὑμεῖς δὲ τίνες ἐστέ
  choice: पर तुम कौन हो?
  rationale: ὑμεῖς पर बल है और यह बहुवचन है। हिंदी ‘तुम’ प्रसंग में समूह को संबोधित करता है, जबकि ‘पर’ यीशु और पौलुस के साथ तीखा विरोध प्रकट करता है।
theological_decisions:
- issue: γινώσκω और ἐπίσταμαι के बीच अंतर को कैसे व्यक्त किया जाए
  choice: ‘यीशु को मैं जानता हूँ और पौलुस से परिचित हूँ’—दो अलग हिंदी अभिव्यक्तियाँ
  alternative: ‘यीशु को मैं जानता हूँ और पौलुस के विषय में जानता हूँ’ अथवा दोनों स्थानों पर ‘जानता हूँ’
  rationale: मूल यूनानी दो अलग क्रियाएँ प्रयोग करता है, संभवतः अलंकारिक प्रभाव के लिए। अलग हिंदी अभिव्यक्तियाँ उस अंतर को बचाती हैं, लेकिन दुष्ट आत्मा के ज्ञान की मात्रा या प्रकार के बारे में ऐसा धर्मवैज्ञानिक निष्कर्ष नहीं जोड़तीं जिसे पद स्वयं स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, संक्षिप्त और गरिमापूर्ण वाक्य। ‘दुष्ट आत्मा’ सामान्य पाठक के लिए स्पष्ट है। प्रत्यक्ष कथन में ‘मैं’ और अंतिम ‘तुम’ विरोध को उभारते हैं; विरामचिह्न संवाद की तीक्ष्णता बनाए रखते हैं।
