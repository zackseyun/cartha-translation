source:
  edition: SBLGNT
  text: καὶ ⸀ἐφαλόμενος ⸂ὁ ἄνθρωπος ἐπ’ αὐτοὺς⸃ ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρὸν ⸂κατακυριεύσας ἀμφοτέρων⸃ ἴσχυσεν κατ’ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/016.yaml
  text: And the man in whom the evil spirit was leaped on them[a], and after overpowering both of them, prevailed against them[c][b], so that they fled out of that house naked and wounded.
translation:
  language: hi
  text: और जिस मनुष्य में दुष्ट आत्मा थी, वह उन पर झपट पड़ा[a] और उन दोनों को वश में करके[b] उन पर हावी हो गया, यहाँ तक कि वे उस घर से नंगे और घायल होकर भाग निकले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन पर उछल पड़ा।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में “उन दोनों” है। व्यापक प्रसंग में स्केवा के सात पुत्रों का उल्लेख है, फिर भी यहाँ “दोनों” शब्द ही आया है।
    reason: textual_narrative_tension
lexical_decisions:
- source_word: ἐφαλόμενος
  choice: झपट पड़ा
  rationale: यह क्रिया अचानक उछलकर आक्रमण करने का भाव देती है; ‘झपट पड़ा’ आधुनिक हिन्दी में हिंसक और आकस्मिक क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ ἄνθρωπος
  choice: मनुष्य
  rationale: पुल्लिंग एकवचन व्यक्ति का सीधा और गरिमापूर्ण उल्लेख है।
- source_word: ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν
  choice: जिस मनुष्य में दुष्ट आत्मा थी
  rationale: यह यूनानी वाक्य-संरचना के निकट रहते हुए आत्मा के उस मनुष्य में होने की बात कहता है और कोई अतिरिक्त तकनीकी शब्दावली नहीं जोड़ता।
- source_word: τὸ πνεῦμα τὸ πονηρόν
  choice: दुष्ट आत्मा
  rationale: यह प्रसंग में आत्मा की बुरी प्रकृति को स्पष्ट करने वाला प्रचलित और सहज हिन्दी पद है।
- source_word: κατακυριεύσας
  choice: काबू पाकर
  rationale: यह उन पर प्रभुत्व या नियंत्रण पा लेने की बलपूर्ण क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀμφοτέρων
  choice: उन दोनों
  rationale: यूनानी पाठ स्पष्ट रूप से ‘दोनों’ कहता है; व्यापक प्रसंग से उत्पन्न तनाव को मिटाए बिना वही संख्या सुरक्षित रखी गई है।
- source_word: ἴσχυσεν κατ’ αὐτῶν
  choice: उन्हें परास्त कर दिया
  rationale: यह उनके विरुद्ध अधिक बलवान सिद्ध होने और विजय पाने का भाव देता है तथा पहले के ‘काबू पाकर’ से अलग परिणामी क्रिया बनाए रखता है।
- source_word: γυμνούς
  choice: नंगे
  rationale: यूनानी विशेषण उनकी परिणामी दशा को सीधे ‘नंगा’ बताता है; कपड़े फटने या उतारे जाने का विवरण नहीं जोड़ा गया।
- source_word: τετραυματισμένους
  choice: घायल
  rationale: पूर्ण निष्क्रिय कृदन्त उनके घायल हो चुके और उसी दशा में होने को दर्शाता है; ‘घायल’ संक्षिप्त और पर्याप्त रूप से स्पष्ट है।
- source_word: ἐκφυγεῖν
  choice: भाग निकले
  rationale: यह भागने और बच निकलने, दोनों भावों को स्वाभाविक हिन्दी में समेटता है।
- source_word: ἐκ τοῦ οἴκου ἐκείνου
  choice: उस घर से
  rationale: यह उस विशिष्ट घर से बाहर निकल जाने की दिशा को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दुष्ट आत्मा के मनुष्य में होने का वर्णन
  choice: जिस मनुष्य में दुष्ट आत्मा थी
  alternative: जो मनुष्य दुष्ट आत्मा से ग्रस्त था
  rationale: चुना हुआ रूप स्रोत के ‘जिसमें आत्मा थी’ वाले कथन के निकट है और बाद की तकनीकी या सम्प्रदायगत शब्दावली नहीं थोपता।
- issue: व्यापक समूह के संदर्भ में ἀμφοτέρων का दायरा
  choice: उन दोनों
  alternative: उन सबको
  rationale: यद्यपि पिछले संदर्भ में सात पुत्रों का उल्लेख है, इस पद का यूनानी पाठ स्पष्ट रूप से ‘दोनों’ कहता है। अनुवाद इस वास्तविक पाठगत-कथात्मक तनाव को सुलझाने के बजाय सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण कथात्मक रूप अपनाया गया है। लम्बे यूनानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, जबकि क्रियाओं का क्रम और ‘उन दोनों’ की वास्तविक अस्पष्टता/तनाव सुरक्षित रखा गया है।
