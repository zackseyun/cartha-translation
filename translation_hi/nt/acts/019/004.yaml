source:
  edition: SBLGNT
  text: εἶπεν δὲ Παῦλος· ⸀Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ’ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ’ ἔστιν εἰς ⸀τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/004.yaml
  text: And Paul said[a], “John baptized with a baptism of repentance, telling the people to believe in the one coming after him—that is, in Jesus.”
translation:
  language: hi
  text: तब पौलुस ने कहा, “यूहन्ना ने पश्चात्ताप का बपतिस्मा दिया और लोगों से कहा कि वे उसके बाद आनेवाले पर विश्वास करें—अर्थात् यीशु पर।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβάπτισεν βάπτισμα μετανοίας
  choice: पश्चात्ताप का बपतिस्मा दिया
  rationale: यह अनुवाद यूनानी की सजातीय क्रिया-संज्ञा रचना का अर्थ बनाए रखते हुए स्वाभाविक हिन्दी देता है। μετανοίας यहाँ बपतिस्मे की विशेषता या विषय को व्यक्त करता है।
- source_word: τῷ λαῷ
  choice: लोगों से
  rationale: λαός का सामान्य सामूहिक अर्थ रखा गया है; यहाँ स्पष्ट रूप से ‘इस्राएल के लोग’ जोड़ना मूल पाठ से अधिक विशिष्ट होता।
- source_word: λέγων
  choice: कहा
  rationale: यह कृदंत यूहन्ना के बपतिस्मा देने के साथ चलनेवाली घोषणा को प्रस्तुत करता है। संयुक्त वाक्य में ‘और लोगों से कहा’ स्वाभाविक हिन्दी है।
- source_word: εἰς τὸν ἐρχόμενον μετ’ αὐτὸν
  choice: उसके बाद आनेवाले पर
  rationale: πιστεύω के साथ εἰς विश्वास के लक्ष्य को दर्शाता है, जिसे हिन्दी में ‘पर विश्वास करना’ कहा जाता है। μετ’ αὐτόν यहाँ क्रम या उत्तरवर्तिता का भाव देता है।
- source_word: ἵνα πιστεύσωσιν
  choice: कि वे ... विश्वास करें
  rationale: बोलने की क्रिया के बाद ἵνα कथन के आशय या उद्देश्य को व्यक्त कर सकता है। यह रूप उस अर्थ को सहज हिन्दी में बनाए रखता है।
- source_word: τοῦτ’ ἔστιν
  choice: अर्थात्
  rationale: यह व्याख्यात्मक सूत्र पहले उल्लिखित ‘आनेवाले’ की पहचान स्पष्ट करता है।
- source_word: εἰς τὸν Ἰησοῦν
  choice: यीशु पर
  rationale: पिछले खंड से ‘विश्वास करें’ यहाँ भी समझा जाता है। मूल पाठ में केवल यीशु का नाम है, इसलिए कोई उपाधि नहीं जोड़ी गई।
theological_decisions:
- issue: यूहन्ना के बपतिस्मे और यीशु पर विश्वास का संबंध
  choice: यूहन्ना का बपतिस्मा पश्चात्ताप से संबंधित बताया गया है, और उसके साथ उसने अपने बाद आनेवाले पर विश्वास करने को कहा; उस आनेवाले की पहचान यीशु के रूप में की गई है।
  alternative: यूहन्ना का बपतिस्मा स्वयं मसीही विश्वास उत्पन्न करता था।
  rationale: वाक्य-रचना बपतिस्मा देने और उसके साथ की गई घोषणा को संबंधित किंतु अलग बातों के रूप में रखती है। अनुवाद इससे आगे कोई संस्कार-संबंधी निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘पश्चात्ताप’ व्यापक रूप से समझा जाने वाला शब्द है; वाक्य में अनावश्यक धार्मिक पारिभाषिक विस्तार नहीं जोड़ा गया।
