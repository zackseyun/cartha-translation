  text: εἶπέν ⸀τε πρὸς αὐτούς· Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες; οἱ ⸀δὲ πρὸς αὐτόν· Ἀλλ’ οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/002.yaml
  text: And he said to them[a], “Did you receive the Holy Spirit when you believed?” And they said to him, “No[b], we have not even heard that there is a Holy Spirit.”
translation:
  language: hi
  text: और उसने उनसे कहा, “क्या तुमने जब विश्वास किया, तब पवित्र आत्मा को प्राप्त किया था?[a]” उन्होंने उससे कहा, “नहीं, हमने तो यह भी नहीं सुना कि पवित्र आत्मा है।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुमने विश्वास करने के बाद पवित्र आत्मा को प्राप्त किया था?” यूनानी कृदंत में कालगत अर्थ की थोड़ी भिन्न छाया संभव है।
    reason: lexical_alternative
  - marker: b
    text: या, “हमने तो यह भी नहीं सुना कि पवित्र आत्मा है या नहीं”; अथवा अधिक व्याख्यात्मक रूप में, “हमने तो यह भी नहीं सुना कि पवित्र आत्मा दिया गया है।”
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: और उसने उनसे कहा
  rationale: τε पिछले वृत्तांत से हल्का संबंध जोड़ता है; हिंदी में ‘और’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: Εἰ πνεῦμα ἅγιον ἐλάβετε πιστεύσαντες
  choice: क्या तुमने विश्वास करते समय पवित्र आत्मा पाया था?
  rationale: πιστεύσαντες और ἐλάβετε के बीच कालगत संबंध है, पर यूनानी अपने आप यह निश्चित नहीं करती कि आत्मा विश्वास के बाद मिला या उसी अवसर पर। ‘विश्वास करते समय’ इस लचीलेपन को बनाए रखता है।
- source_word: πνεῦμα ἅγιον
  choice: पवित्र आत्मा
  rationale: इस प्रसंग में यह परमेश्वर के पवित्र आत्मा का व्यक्तिगत संदर्भ है; आधुनिक हिंदी बाइबलीय प्रयोग में ‘पवित्र आत्मा’ स्वाभाविक और स्पष्ट है।
- source_word: οἱ δὲ πρὸς αὐτόν
  choice: उन्होंने उससे कहा
  rationale: δέ संवाद की हल्की प्रगति या भिन्न प्रतिक्रिया दिखाता है; हिंदी में अलग विरोधसूचक शब्द जोड़े बिना यह वाक्य स्वाभाविक रहता है।
- source_word: Ἀλλ’ οὐδ’
  choice: नहीं, ... तो यह भी नहीं
  rationale: यह संयोजन उत्तर में प्रबल निषेध देता है; हिंदी में ‘नहीं’ और ‘तो यह भी नहीं’ उस बल को सहज रूप से व्यक्त करते हैं।
- source_word: οὐδ’ εἰ πνεῦμα ἅγιον ἔστιν ἠκούσαμεν
  choice: हमने तो यह भी नहीं सुना कि पवित्र आत्मा है
  rationale: यह यूनानी वाक्य का सीधा अर्थ रखता है और ‘पवित्र आत्मा दिया गया है’ जैसी प्रसंगानुकूल परंतु अव्यक्त व्याख्या को मुख्य पाठ में नहीं जोड़ता।
theological_decisions:
- issue: विश्वास और पवित्र आत्मा पाने का कालगत संबंध
  choice: ‘विश्वास करते समय’
  alternative: ‘विश्वास करने के बाद’ या ‘विश्वास करते ही’
  rationale: अओरिस्ट कृदंत कालगत संबंध दर्शाता है, लेकिन क्रमिकता या ठीक उसी क्षण होने को निर्णायक रूप से स्थापित नहीं करता। मुख्य अनुवाद इस धर्मवैज्ञानिक तनाव को खुला रखता है।
- issue: पवित्र आत्मा के विषय में शिष्यों की अनभिज्ञता
  choice: ‘हमने तो यह भी नहीं सुना कि पवित्र आत्मा है’
  alternative: ‘हमने तो यह भी नहीं सुना कि पवित्र आत्मा है या नहीं’ अथवा व्याख्यात्मक रूप में ‘हमने तो यह भी नहीं सुना कि पवित्र आत्मा दिया गया है’
  rationale: यूनानी οὐδὲ εἰ संक्षिप्त और कुछ हद तक अर्थगत रूप से खुला है। मुख्य पाठ सीधा अर्थ देता है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण संवाद-शैली। ‘पाया था’ प्रश्न के भूतकालीन संदर्भ को स्वाभाविक बनाता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
