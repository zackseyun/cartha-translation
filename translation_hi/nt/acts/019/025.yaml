translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कारीगर’, ‘धंधा’ और ‘समृद्धि’ व्यापारिक प्रसंग को स्पष्ट करते हैं; संबोधन ‘भाइयो’ हिन्दी की स्वाभाविक सार्वजनिक वाणी के अनुरूप है।
