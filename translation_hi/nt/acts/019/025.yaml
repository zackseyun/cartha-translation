  text: οὓς συναθροίσας καὶ τοὺς περὶ τὰ τοιαῦτα ἐργάτας εἶπεν· Ἄνδρες, ἐπίστασθε ὅτι ἐκ ταύτης τῆς ἐργασίας ἡ εὐπορία ⸀ἡμῖν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/025.yaml
  text: After gathering them together[a], along with the workmen occupied with such things, he said, “Men, you know that from this business we have our prosperity.
translation:
  language: hi
  text: उसने उन्हें और ऐसे कामों में लगे कारीगरों को इकट्ठा करके कहा, “भाइयो, तुम जानते हो कि इसी धंधे से हमें समृद्धि मिलती है।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इसी धंधे से हमारी संपन्नता आती है।”
    reason: εὐπορία के लिए ‘समृद्धि’ और ‘संपन्नता’ दोनों संभव हैं; वैकल्पिक रूप आर्थिक अर्थ को अधिक स्पष्ट करता है।
lexical_decisions:
- source_word: συναθροίσας
  choice: इकट्ठा करके
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले हुई क्रिया बताता है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक रूप से उस क्रम को व्यक्त करता है।
- source_word: τοὺς περὶ τὰ τοιαῦτα ἐργάτας
  choice: ऐसे कामों में लगे कारीगरों
  rationale: ἐργάτας का मूल अर्थ काम करने वाले है; प्रसंग में मूर्तिनुमा मंदिर बनाने वाले शिल्पकार हैं। ‘कारीगर’ प्रसंग के अनुकूल है, जबकि ‘ऐसे कामों में लगे’ यूनानी की सामान्य अभिव्यक्ति को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: Ἄνδρες
  choice: भाइयो
  rationale: यह पुरुष सहकर्मियों के लिए संबोधन है। हिन्दी में ‘हे पुरुषो’ अस्वाभाविक है; ‘भाइयो’ पुरुष-समूह का स्वाभाविक, सम्मानजनक और प्रसंगानुकूल संबोधन है।
- source_word: ἐπίστασθε
  choice: तुम जानते हो
  rationale: क्रिया पहले से विदित बात या समझ को व्यक्त करती है; ‘जानते हो’ सीधा और सहज समतुल्य है।
- source_word: ἐκ ταύτης τῆς ἐργασίας
  choice: इसी धंधे से
  rationale: ἐργασία यहाँ आय देने वाले व्यावसायिक काम को दर्शाता है। ‘धंधा’ आधुनिक हिन्दी में व्यापार या जीविका के काम का स्पष्ट और स्वाभाविक शब्द है।
- source_word: ἡ εὐπορία ἡμῖν ἐστιν
  choice: हमें समृद्धि मिलती है
  rationale: εὐπορία आर्थिक खुशहाली या संपन्नता को व्यक्त करता है। यह अनुवाद यूनानी के संबंधसूचक भाव को स्वाभाविक हिन्दी में रखता है।
