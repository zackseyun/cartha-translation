  text: Ἐγένετο δὲ ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ⸀ἐλθεῖν εἰς Ἔφεσον καὶ ⸀εὑρεῖν τινας μαθητάς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/001.yaml
  text: It happened that while Apollos was in Corinth[a], Paul passed through the inland regions and came to Ephesus and found some disciples[b],
translation:
  language: hi
  text: जब अपुल्लोस कुरिन्थुस में था, तब ऐसा हुआ कि पौलुस भीतरी प्रदेशों[a] से होकर इफिसुस आया और उसे कुछ चेले[b] मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊपरी प्रदेशों” अथवा “अंदरूनी प्रदेशों”; सम्भवतः यह तटवर्ती सड़क के बजाय भीतर के ऊँचे भूभाग से होकर जाने वाले मार्ग को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “चेलों” की पहचान स्पष्ट नहीं की गई है; अगले पद बताते हैं कि उनका संबंध यूहन्ना के बपतिस्मे से था।
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: तब ऐसा हुआ कि
  rationale: यह लूका की कथात्मक संक्रमण-शैली को स्वाभाविक हिन्दी में व्यक्त करता है। ‘तब’ पिछले प्रसंग से हल्का संबंध दिखाता है, पर किसी स्पष्ट ‘अब’ का अर्थ नहीं जोड़ता।
- source_word: ἐν τῷ τὸν Ἀπολλῶ εἶναι ἐν Κορίνθῳ
  choice: जब अपुल्लोस कुरिन्थुस में था
  rationale: ἐν τῷ के साथ क्रियार्थक संज्ञा समकालिकता व्यक्त करती है; ‘जब…था’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: διελθόντα τὰ ἀνωτερικὰ μέρη
  choice: भीतरी प्रदेशों से होकर
  rationale: ἀνωτερικά का मूल अर्थ ‘ऊपरी’ है, पर इस भौगोलिक संदर्भ में तटवर्ती मार्ग के विपरीत अंदरूनी अथवा ऊँचे भूभागों से होकर जाने का भाव संभावित है। ‘भीतरी प्रदेश’ मुख्य भौगोलिक अर्थ को सहज हिन्दी में रखता है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐλθεῖν εἰς Ἔφεσον
  choice: इफिसुस आया
  rationale: यह इफिसुस की ओर गति और वहाँ पहुँचने को सीधी, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ εὑρεῖν τινας μαθητάς
  choice: और उसे कुछ चेले मिले
  rationale: τινας की अनिश्चितता ‘कुछ’ से बनी रहती है। हिन्दी में ‘उसे…मिले’ घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है, और μαθητάς के लिए प्रचलित ‘चेले’ रखा गया है।
theological_decisions:
- issue: μαθητάς की पहचान
  choice: मुख्य पाठ में केवल ‘कुछ चेले’
  alternative: ‘यूहन्ना के कुछ चेले’ या ‘यीशु के कुछ चेले’
  rationale: यूनानी पाठ यहाँ उनकी पहचान स्पष्ट नहीं करता। अगले पदों से यूहन्ना के बपतिस्मे से उनका संबंध सामने आता है; इसलिए इस पद में पहले से कोई विशिष्ट पहचान जोड़ना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। वाक्य में समकालिक परिस्थिति, यात्रा का क्रम और चेलों की अनिर्दिष्ट पहचान सुरक्षित हैं।
