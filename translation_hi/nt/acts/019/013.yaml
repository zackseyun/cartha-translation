id: ACT.19.13
reference: Acts 19:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐπεχείρησαν δέ τινες ⸀καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ κυρίου Ἰησοῦ λέγοντες· ⸀Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν ⸀ὃν Παῦλος κηρύσσει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/013.yaml
  text: But some also of the itinerant Jewish exorcists attempted to invoke the name of the Lord Jesus over those who had evil spirits[a], saying, “I adjure you by Jesus[d][c][b], whom Paul proclaims.”
translation:
  language: hi
  text: परन्तु घूमते-फिरते यहूदी दुष्टात्मा निकालनेवालों में से कुछ ने भी उन लोगों के ऊपर, जिनमें दुष्ट आत्माएँ थीं,[a] प्रभु यीशु के नाम का प्रयोग करने का प्रयास किया। वे कहते थे, “मैं तुम्हें उस यीशु की शपथ देकर आज्ञा देता हूँ, जिसका प्रचार पौलुस करता है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो दुष्ट आत्माएँ रखते थे।”
    reason: मूल यूनानी की अभिव्यक्ति को दर्शाने और यह स्पष्ट करने के लिए कि मुख्य पाठ ‘ग्रस्त’ या ‘वश में’ जैसा अधिक प्रबल अर्थ नहीं जोड़ता।
  - marker: b
    text: या, “मैं तुम्हें यीशु के नाम की शपथ देकर आज्ञा देता हूँ,” अथवा “मैं यीशु के द्वारा तुम्हें गंभीर आज्ञा देता हूँ।”
    reason: ὁρκίζω के शपथ-आधारित, गंभीर आज्ञा देने के भाव को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: ἐπεχείρησαν
  choice: प्रयास किया
  rationale: यह क्रिया किसी काम को करने का बीड़ा उठाने या कोशिश करने का भाव देती है; ‘प्रयास किया’ सफलता को पहले से मानकर नहीं चलता।
- source_word: τινες καὶ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν
  choice: जगह-जगह घूमनेवाले कुछ यहूदी दुष्टात्मा निकालनेवालों ने भी
  rationale: τινες का अर्थ ‘कुछ’, καὶ का यहाँ योगात्मक भाव ‘भी’, और περιερχομένων का अर्थ स्थान-स्थान घूमना है। ‘दुष्टात्मा निकालनेवाले’ ἐξορκισταί का स्पष्ट, सामान्य हिन्दी रूप है और ‘ओझा’ से जुड़ी अनावश्यक स्थानीय धारणाओं से बचता है।
- source_word: ὀνομάζειν ἐπὶ ... τὸ ὄνομα
  choice: उन लोगों पर ... नाम लेने का
  rationale: यह पदबंध किसी के ऊपर नाम का उच्चारण अथवा आह्वान करने को दर्शाता है। ‘नाम लेने’ से उस सूत्रात्मक प्रयोग का भाव स्वाभाविक हिन्दी में आता है, जबकि वाक्य का ‘पर’ यूनानी ἐπί को बनाए रखता है।
- source_word: τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρά
  choice: उन लोगों पर, जिनमें दुष्ट आत्माएँ थीं
  rationale: मूल का शाब्दिक भाव ‘दुष्ट आत्माएँ रखनेवाले’ है। हिन्दी में ‘जिनमें ... थीं’ स्वाभाविक है और ‘दुष्टात्मा से ग्रस्त’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: τὸ ὄνομα τοῦ κυρίου Ἰησοῦ
  choice: प्रभु यीशु का नाम
  rationale: ‘प्रभु’ κύριος के सम्मानसूचक और मसीह-संबंधी भार को बनाए रखता है; पूरा पदबंध हिन्दी में सहज है।
- source_word: Ὁρκίζω ὑμᾶς τὸν Ἰησοῦν
  choice: उसी की शपथ देकर मैं तुम्हें आदेश देता हूँ
  rationale: ὁρκίζω किसी को शपथ के अधीन करने या अत्यन्त गंभीरता से आदेश देने का भाव रखता है। यह रूप हिन्दी में अर्थ और झाड़-फूँक के औपचारिक स्वर दोनों को स्पष्ट करता है।
- source_word: ὃν Παῦλος κηρύσσει
  choice: जिस यीशु का प्रचार पौलुस करता है
  rationale: κηρύσσει सार्वजनिक रूप से घोषणा या प्रचार करने को दर्शाता है। ‘प्रचार करता है’ आधुनिक धार्मिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: τοῦ κυρίου Ἰησοῦ में κύριος का अनुवाद
  choice: प्रभु यीशु
  alternative: स्वामी यीशु
  rationale: ‘प्रभु’ सम्मानसूचक तथा मसीह-संबंधी अर्थभार को बनाए रखता है और प्रेरितों के काम की हिन्दी धार्मिक भाषा में स्वाभाविक है।
- issue: दुष्ट आत्माओं से प्रभावित लोगों की दशा को कितना स्पष्ट किया जाए
  choice: जिनमें दुष्ट आत्माएँ थीं
  alternative: जो दुष्ट आत्माओं के वश में थे
  rationale: यूनानी पाठ शाब्दिक रूप से उनके ‘दुष्ट आत्माएँ रखने’ की बात करता है। चुना हुआ रूप इस कथन को स्वाभाविक हिन्दी में रखता है, पर नियंत्रण या पूर्ण वशीकरण की अधिक प्रबल धारणा नहीं जोड़ता।
- issue: ὁρκίζω की शपथ-संबंधी शक्ति
  choice: शपथ देकर ... आदेश देता हूँ
  alternative: तुम्हें शपथ देता हूँ
  rationale: मूल क्रिया शपथ के द्वारा गंभीर आदेश या आग्रह का भाव देती है। मुख्य पाठ में दोनों पहलुओं को व्यक्त किया गया है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘ओझा’ के स्थान पर वर्णनात्मक ‘दुष्टात्मा निकालनेवाले’ चुना गया है। वाक्य में ‘भी’ को बनाए रखकर καὶ का योगात्मक भाव सुरक्षित रखा गया है।
