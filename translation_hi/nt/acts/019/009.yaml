id: ACT.19.9
reference: Acts 19:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ’ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ’ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ ⸀Τυράννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/009.yaml
  text: But when some became hardened and disobedient[a], speaking evil of the Way before the crowd, he withdrew from them and set apart the disciples[c][b], reasoning daily in the lecture hall of Tyrannus.
translation:
  language: hi
  text: लेकिन जब कुछ लोग हठी होते गए और मानने से इनकार करते रहे, और भीड़ के सामने मार्ग[a] के बारे में बुरा-भला कहते रहे, तो पौलुस उनसे अलग हो गया और शिष्यों को अलग कर दिया। वह हर दिन तुरन्नुस के व्याख्यान-कक्ष[b] में तर्क करता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में “मार्ग”; प्रेरितों के काम में यह यीशु के अनुयायियों के आंदोलन का एक आरंभिक नाम है।
    reason: cultural_note
  - marker: b
    text: या “तुरन्नुस की पाठशाला में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκληρύνοντο
  choice: कठोर होते गए
  rationale: अपूर्ण काल में चलती या बढ़ती हुई अवस्था का भाव है; यह रूप क्रमशः दृढ़ होते विरोध को व्यक्त करता है और कर्तृत्व को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἠπείθουν
  choice: विश्वास करने से इनकार करते हुए
  rationale: ἀπειθέω में विश्वास न करना, न मानना और समझाए जाने से इनकार करना—ये परस्पर जुड़े भाव हो सकते हैं। संदर्भ में संदेश के प्रति जानबूझकर प्रतिरोध है; यह अनुवाद उस अस्पष्टता को सामान्य हिन्दी में काफी हद तक बनाए रखता है।
- source_word: κακολογοῦντες
  choice: बुरा कहने लगे
  rationale: यह सार्वजनिक और विरोधपूर्ण निंदा को स्वाभाविक हिन्दी में व्यक्त करता है, बिना विधिक अर्थ वाले ‘बदनाम करने’ को अनिवार्य बनाए।
- source_word: τὴν ὁδὸν
  choice: इस पंथ
  rationale: प्रेरितों के काम में यह यीशु के अनुयायी आंदोलन का परिचित नाम है। हिन्दी में शाब्दिक ‘मार्ग’ इस संदर्भ में अस्पष्ट लग सकता है; ‘इस पंथ’ ऐतिहासिक आंदोलन-सूचक प्रयोग को सहज बनाता है, और पादटिप्पणी मूल पदबंध बताती है।
- source_word: ἐνώπιον τοῦ πλήθους
  choice: भीड़ के सामने
  rationale: विरोध के सार्वजनिक स्वरूप को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀποστὰς ἀπ’ αὐτῶν
  choice: उनसे अलग हो गया
  rationale: पौलुस के निर्णायक प्रस्थान और विरोधी समूह से दूरी बनाने, दोनों का भाव रखता है।
- source_word: ἀφώρισεν τοὺς μαθητάς
  choice: शिष्यों को भी अलग कर लिया
  rationale: ἀφορίζω जानबूझकर अलग करने को दर्शाता है; ‘भी’ से स्पष्ट होता है कि पौलुस ने स्वयं के साथ शिष्यों को भी विरोधी समूह से अलग किया।
- source_word: καθ’ ἡμέραν
  choice: हर दिन
  rationale: नियमित दैनिक गतिविधि का सहज आधुनिक हिन्दी रूप।
- source_word: διαλεγόμενος
  choice: तर्क-वितर्क करता था
  rationale: διαλέγομαι यहाँ विचारपूर्ण संवाद, विवेचन और समझाने के प्रयास को दर्शाता है; ‘तर्क-वितर्क’ केवल भाषण के बजाय संवादात्मक विचार-विनिमय को सामने लाता है।
- source_word: σχολῇ
  choice: व्याख्यान-कक्ष
  rationale: स्थान को आधुनिक विद्यालय समझे जाने से बचाते हुए शिक्षण या विचार-विमर्श के लिए प्रयुक्त कक्ष का अर्थ देता है।
- source_word: Τυράννου
  choice: तुरन्नुस
  rationale: यूनानी नाम Τύραννος का देवनागरी लिप्यंतरण।
theological_decisions:
- issue: τὴν ὁδὸν का आंदोलन-सूचक अर्थ
  choice: ‘इस पंथ’ द्वारा आरंभिक मसीही आंदोलन का संकेत
  alternative: ‘मार्ग’ को उपाधि के रूप में रखना
  rationale: प्रेरितों के काम में पदबंध एक पहचाने जाने वाले आंदोलन के लिए प्रयुक्त है। ‘इस पंथ’ सामान्य हिन्दी पाठक को वह कार्यात्मक अर्थ देता है, जबकि पादटिप्पणी शाब्दिक ‘मार्ग’ सुरक्षित रखती है और किसी संप्रदायगत विशिष्टता को नहीं जोड़ती।
- issue: ἠπείθουν में अविश्वास और अवज्ञा का संबंध
  choice: ‘विश्वास करने से इनकार करते हुए’
  alternative: ‘आज्ञा नहीं मानते थे’ अथवा ‘विश्वास नहीं करते थे’
  rationale: यूनानी क्रिया विश्वास न करने और न मानने दोनों भाव समेट सकती है। चुना गया रूप संदर्भ के जानबूझकर प्रतिरोध को रखता है, पर इसे केवल आज्ञाभंग या केवल बौद्धिक अविश्वास तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लंबे यूनानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है। ‘पंथ’ यहाँ तटस्थ आंदोलन-सूचक अर्थ में है, अपमानजनक ‘कुपंथ’ के अर्थ में नहीं।
