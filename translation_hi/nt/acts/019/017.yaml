id: ACT.19.17
reference: Acts 19:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον, καὶ ⸀ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/017.yaml
  text: And this became known to all the Jews and Greeks living in Ephesus[a], and fear fell upon them all[b], and the name of the Lord Jesus was being magnified.
translation:
  language: hi
  text: यह बात इफिसुस में रहने वाले सभी यहूदियों और यूनानियों को मालूम हो गई। उन सब पर भय छा गया[a], और प्रभु यीशु के नाम की महिमा होती रही[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन सब पर भय आ पड़ा।”
    reason: ἐπέπεσεν φόβος के रूपक का अधिक शाब्दिक वैकल्पिक अनुवाद।
  - marker: b
    text: या, “प्रभु यीशु का नाम ऊँचा किया जाता रहा,” अथवा “प्रभु यीशु का नाम बड़े आदर से लिया जाता रहा।”
    reason: ἐμεγαλύνετο में महिमा करने, ऊँचा करने और अत्यधिक आदर देने के अर्थ-सूक्ष्म भेद संभव हैं।
lexical_decisions:
- source_word: τοῦτο
  choice: यह बात
  rationale: एकवचन संकेतवाचक शब्द पिछले वर्णित प्रसंग की ओर संकेत करता है; हिन्दी में ‘यह बात’ स्पष्ट और स्वाभाविक है।
- source_word: ἐγένετο γνωστὸν
  choice: मालूम हो गई
  rationale: यह पदबंध किसी बात के लोगों में ज्ञात हो जाने को व्यक्त करता है और आरंभिक भाव को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησιν τοῖς κατοικοῦσιν τὴν Ἔφεσον
  choice: इफिसुस में रहने वाले सभी यहूदियों और यूनानियों को
  rationale: सम्प्रदान कारक उन लोगों को चिह्नित करता है जिन्हें घटना ज्ञात हुई; कृदंत दोनों समुदायों को इफिसुस के निवासी बताता है।
- source_word: ἐπέπεσεν φόβος ἐπὶ πάντας αὐτούς
  choice: उन सब पर भय छा गया
  rationale: यह हिन्दी में स्वाभाविक रूप से मूल के जीवंत रूपक—भय का उन पर आ पड़ना—और πάντας के व्यापक अर्थ को व्यक्त करता है।
- source_word: φόβος
  choice: भय
  rationale: शब्द भय, आतंक या श्रद्धामिश्रित विस्मय का भाव दे सकता है; ‘भय’ सबसे व्यापक और न्यूनतम व्याख्यात्मक विकल्प है।
- source_word: ἐμεγαλύνετο
  choice: महिमा होती रही
  rationale: अपूर्ण भूतकाल और कर्मवाच्य को जारी सार्वजनिक बड़ाई के रूप में व्यक्त करता है; ‘होती रही’ निरंतरता को सुरक्षित रखता है।
- source_word: τὸ ὄνομα
  choice: नाम
  rationale: मूल में स्पष्टतः ‘नाम’ है, जिसमें प्रतिष्ठा, अधिकार और सम्मान की व्यापक बाइबिलीय अनुगूँज बनी रहती है।
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: प्रभु यीशु के
  rationale: सम्बन्धकारक ‘नाम’ पर निर्भर है; κύριος को यीशु की उपाधि के रूप में ‘प्रभु’ कहना स्वाभाविक और स्रोत-संगत है।
theological_decisions:
- issue: यीशु के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ κύριος मसीही उपाधि के रूप में प्रयुक्त है; ‘प्रभु’ उसके प्रचलित बाइबिलीय और धर्मवैचारिक भार को बिना संप्रदायगत विस्तार के सुरक्षित रखता है।
- issue: τὸ ὄνομα को शाब्दिक ‘नाम’ कहना या ‘प्रतिष्ठा’ के रूप में स्पष्ट करना
  choice: प्रभु यीशु के नाम की महिमा होती रही
  alternative: प्रभु यीशु की प्रतिष्ठा बढ़ती गई
  rationale: ‘नाम’ मूल अभिव्यक्ति तथा व्यक्ति, अधिकार और सार्वजनिक सम्मान से जुड़ी उसकी धर्मवैचारिक व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘मालूम हो गई’ सामान्य पाठक के लिए सहज है, जबकि ‘प्रभु’, ‘भय’ और ‘महिमा’ बाइबिलीय गरिमा बनाए रखते हैं। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न सम्बद्ध पदबंधों के तुरंत बाद रखे गए हैं।
