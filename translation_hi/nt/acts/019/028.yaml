base_translation:
  language: en
  yaml_path: translation/nt/acts/019/028.yaml
  text: When they heard this and became full of wrath[a], they were crying out, saying, “Great is Artemis of the Ephesians!”
translation:
  language: hi
  text: जब उन्होंने यह सुना और वे क्रोध से भर गए[a], तो वे चिल्लाते रहे, “इफिसियों की अरतिमिस महान है!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे रोष से भर गए,” “वे क्रोध से आग-बबूला हो गए,” अथवा “वे अत्यन्त क्रोधित हो उठे।” यूनानी अभिव्यक्ति का शाब्दिक अर्थ है “वे θυμός से भर गए”; यह तीव्र क्रोध या रोष को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: जब उन्होंने यह सुना
  rationale: कालवाचक एओरिस्ट कृदंत मुख्य क्रिया से पहले की परिस्थिति बताता है; प्रसंग से निहित कर्म को ‘यह’ के रूप में स्पष्ट करना स्वाभाविक है।
- source_word: γενόμενοι πλήρεις θυμοῦ
  choice: वे क्रोध से भर गए
  rationale: यह यूनानी अभिव्यक्ति तीव्र क्रोध से पूर्ण हो जाने का भाव देती है; हिंदी में यह मुहावरा अर्थ और तीव्रता दोनों को सहज रूप से रखता है।
- source_word: ἔκραζον
  choice: वे चिल्लाते रहे
  rationale: अपूर्ण भूतकाल जारी या बार-बार होने वाली पुकार को दर्शाता है; ‘चिल्लाते रहे’ उसकी कालगत शक्ति को सुरक्षित रखता है।
- source_word: λέγοντες
  choice: प्रत्यक्ष कथन से व्यक्त
  rationale: हिंदी में ‘कहते हुए चिल्लाते रहे’ अनावश्यक रूप से भारी होता; उद्धृत नारे को सीधे जोड़ना स्वाभाविक है और अर्थ अक्षुण्ण रहता है।
- source_word: Ἄρτεμις
  choice: अरतिमिस
  rationale: देवी के यूनानी नाम का देवनागरी लिप्यंतरण किया गया है, अनुवाद नहीं।
- source_word: Ἐφεσίων
  choice: इफिसियों की
  rationale: सम्बन्धकारक बहुवचन इफिसुस के लोगों को सूचित करता है; ‘इफिसियों की’ नगर की अपेक्षा यूनानी रूप को अधिक सटीकता से दर्शाता है।
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: इफिसियों की अरतिमिस महान है!
  rationale: यह उद्घोषात्मक नाममात्र वाक्य है। हिंदी में यह क्रम स्पष्ट, स्वाभाविक और नारे जैसा है।
theological_decisions:
- issue: एक मूर्तिपूजक उद्घोष को बिना धार्मिक समर्थन जोड़े प्रस्तुत करना
  choice: “इफिसियों की अरतिमिस महान है!”
  alternative: “महान है इफिसियों की अरतिमिस!”
  rationale: इसे भीड़ के सीधे उद्धृत नारे के रूप में रखा गया है; अनुवाद न तो कथन को नरम करता है, न उसे अनुवादक की स्वीकृति बनाता है। वैकल्पिक क्रम अधिक काव्यात्मक है, पर चुना हुआ रूप आधुनिक हिंदी में अधिक सहज है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और जनसुलभ शैली रखी गई है। भीड़ की निरंतर पुकार को ‘चिल्लाते रहे’ से व्यक्त किया गया है।
