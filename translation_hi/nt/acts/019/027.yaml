id: ACT.19.27
reference: Acts 19:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς ⸂Ἀρτέμιδος ἱερὸν⸃ εἰς οὐθὲν λογισθῆναι, μέλλειν ⸀τε καὶ καθαιρεῖσθαι ⸂τῆς μεγαλειότητος⸃ αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/027.yaml
  text: And not only is this trade of ours in danger of coming into disrepute, but also the temple of the great goddess Artemis may be counted as nothing, and even her majesty—whom all Asia and the world worships—may be brought down.
translation:
  language: hi
  text: और केवल यही खतरा नहीं है कि हमारा यह व्यवसाय बदनाम हो जाए, बल्कि यह भी कि महान देवी अरतिमिस का मन्दिर तुच्छ समझा जाए और उसकी महिमा भी घटा दी जाए—उस अरतिमिस की, जिसकी उपासना सारा आसिया और समूचा संसार[a] करते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समूचा बसा हुआ संसार।” यूनानी शब्द प्रायः आबाद संसार, विशेषकर व्यापक रोमी जगत, को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: “उसकी महिमा भी घटा दी जाए” का अनुवाद “उसे उसकी भव्यता से वंचित कर दिया जाए” भी हो सकता है। यूनानी वाक्य-विन्यास कठिन है और अरतिमिस की ऊँची प्रतिष्ठा या वैभव के गिराए जाने को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κινδυνεύει
  choice: खतरा है
  rationale: यह वर्तमान जोखिम या संकट को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ μέρος
  choice: हमारा यह व्यवसाय
  rationale: सन्दर्भ में यह कारीगरों के आर्थिक काम-धन्धे या व्यवसाय को सूचित करता है, किसी अमूर्त ‘भाग’ को नहीं।
- source_word: εἰς ἀπελεγμὸν ἐλθεῖν
  choice: बदनाम हो जाए
  rationale: यह निन्दा, अपयश या प्रतिष्ठा खोने की अवस्था में पहुँचने का सहज और स्पष्ट हिन्दी रूप है।
- source_word: ἱερὸν
  choice: मन्दिर
  rationale: इफिसुस के अरतिमिस-सम्बन्धी पवित्र परिसर के लिए सामान्य पाठक हेतु ‘मन्दिर’ सर्वाधिक स्पष्ट है।
- source_word: εἰς οὐθὲν λογισθῆναι
  choice: तुच्छ समझा जाए
  rationale: यह ‘कुछ न समझा जाना’ या महत्वहीन माना जाना संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μέλλειν τε καὶ καθαιρεῖσθαι τῆς μεγαλειότητος αὐτῆς
  choice: उसकी महिमा भी घटा दी जाए
  rationale: कठिन यूनानी रचना अरतिमिस की ऊँची प्रतिष्ठा या वैभव के नीचे गिराए जाने की आशंका बताती है; यह हिन्दी उस अर्थ को बिना अनावश्यक स्पष्टता थोपे व्यक्त करती है।
- source_word: ὅλη ἡ Ἀσία
  choice: सारा आसिया
  rationale: यह रोमी प्रान्त आसिया को सूचित करता है; प्राचीन भौगोलिक नाम को आधुनिक महाद्वीप ‘एशिया’ से अलग रखने के लिए ‘आसिया’ चुना गया है।
- source_word: ἡ οἰκουμένη
  choice: समूचा संसार
  rationale: मुख्य पाठ में वक्ता की आलंकारिक व्यापकता बनी रहती है; पादटिप्पणी ‘बसा हुआ संसार’ का अधिक शाब्दिक अर्थ देती है।
- source_word: σέβεται
  choice: उपासना करता है
  rationale: मूर्तिपूजक धार्मिक सन्दर्भ में यह श्रद्धापूर्ण धार्मिक आराधना को सीधे व्यक्त करता है।
theological_decisions:
- issue: मूर्तिपूजक धार्मिक दावे को बिना नरम किए या समर्थन जोड़े प्रस्तुत करना
  choice: महान देवी अरतिमिस ... जिसकी उपासना सारा आसिया और समूचा संसार करता है
  alternative: तथाकथित महान देवी अरतिमिस ... जिसका आदर करता है
  rationale: यह दिमेत्रियुस का कथन है। यूनानी पाठ में न पाया जाने वाला दूरी-सूचक ‘तथाकथित’ जोड़ने के बजाय उसके दृष्टिकोण को प्रत्यक्ष कथित वाणी के रूप में सुरक्षित रखा गया है।
- issue: महिमा के हटाए या गिराए जाने वाली कठिन यूनानी रचना
  choice: उसकी महिमा भी घटा दी जाए
  alternative: वह अपनी महिमा से वंचित कर दी जाए
  rationale: मूल रचना संकुचित और व्याकरण की दृष्टि से कठिन है। चुना हुआ पाठ अरतिमिस की प्रतिष्ठा या भव्यता के पतन का भाव रखता है, जबकि पादटिप्पणी वैकल्पिक अभिव्यक्ति सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक कथन के अनुकूल रखी गई है। ‘अरतिमिस’ यूनानी Ἄρτεμις का लिप्यन्तरण है; ‘आसिया’ प्राचीन रोमी प्रान्त को आधुनिक महाद्वीप से अलग दिखाता है। ‘मन्दिर’, ‘उपासना’ और ‘महिमा’ सामान्य हिन्दी पाठक के लिए परिचित धार्मिक शब्द हैं।
