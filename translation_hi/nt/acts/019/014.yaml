base_translation:
  language: en
  yaml_path: translation/nt/acts/019/014.yaml
  text: There were seven sons of a Jewish chief priest named Sceva doing this[a].
translation:
  language: hi
  text: एक यहूदी प्रधान याजक, जिसका नाम स्केवा था, उसके सात बेटे यह कर रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महायाजक।” यूनानी शब्द किसी विशिष्ट महायाजक के लिए, अथवा व्यापक अर्थ में किसी प्रधान याजक या उच्च याजकीय पद वाले व्यक्ति के लिए प्रयुक्त हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δέ
  choice: भी थे
  rationale: δέ यहाँ कथा को आगे बढ़ाता है और पिछले वाक्य में बताए गए काम से इन सात बेटों को जोड़ता है। स्वाभाविक हिन्दी में ‘भी थे’ यह संबंध स्पष्ट करता है, बिना अनावश्यक कालसूचक शब्द जोड़े।
- source_word: τινος Σκευᾶ
  choice: स्केवा
  rationale: τινος व्यक्ति को अनिर्दिष्ट रूप में प्रस्तुत करता है, पर हिन्दी में नाम और पद-संबंध के साथ अलग से ‘एक व्यक्ति’ कहना भारी पड़ता। ‘स्केवा के’ स्वाभाविक रूप से संबंध व्यक्त करता है।
- source_word: Ἰουδαίου
  choice: यहूदी
  rationale: यहाँ शब्द जातीय-धार्मिक पहचान बताता है, केवल भौगोलिक यहूदिया-निवास नहीं।
- source_word: ἀρχιερέως
  choice: प्रधान याजक
  rationale: यह पद यूनानी शब्द की उच्च याजकीय हैसियत को व्यक्त करता है, पर ‘महायाजक’ की अपेक्षा व्यापक अर्थ की गुंजाइश रखता है।
- source_word: ἑπτὰ υἱοὶ
  choice: सात बेटे
  rationale: साधारण आधुनिक हिन्दी में पारिवारिक संबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: τοῦτο ποιοῦντες
  choice: यह काम करनेवालों में
  rationale: एकवचन संकेतवाचक τοῦτο तत्काल पिछले संदर्भ में बताए गए कार्य की ओर संकेत करता है। हिन्दी में यह रचना चल रहे कार्य और कर्ताओं का संबंध स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions:
- issue: स्केवा के लिए ἀρχιερεύς का अर्थ
  choice: प्रधान याजक
  alternative: महायाजक
  rationale: यूनानी शब्द विशिष्ट महायाजक अथवा अधिक व्यापक रूप से प्रधान/उच्च याजकीय वर्ग के व्यक्ति को बता सकता है। स्केवा के यरूशलेम के एकमात्र पदासीन महायाजक होने का स्वतंत्र प्रमाण न होने के कारण मुख्य पाठ में व्यापक अर्थ रखा गया और दूसरा अर्थ पादटिप्पणी में दिया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘यह काम’ पिछले पद की क्रिया की ओर संकेत करता है। ‘प्रधान याजक’ संस्थागत दावे को आवश्यकता से अधिक निश्चित किए बिना मूल की अर्थगत गुंजाइश बनाए रखता है।
