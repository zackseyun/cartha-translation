base_translation:
  language: en
  yaml_path: translation/nt/acts/019/034.yaml
  text: But when they recognized that he was a Jew[a], one voice arose from them all, crying out for about two hours, “Great is Artemis of the Ephesians!”
translation:
  language: hi
  text: पर जब उन्होंने पहचान लिया कि वह यहूदी था, तो वे सब एक स्वर में लगभग दो घंटे तक चिल्लाते रहे, “इफिसियों की अरतिमिस महान है!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: जब उन्होंने पहचान लिया
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले की परिस्थिति बताता है; भीड़ ने सिकन्दर की यहूदी पहचान जान ली।
- source_word: δὲ
  choice: पर
  rationale: पिछले संदर्भ में उसके बोलने के प्रयास के विपरीत मोड़ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἰουδαῖός
  choice: यहूदी
  rationale: इफिसुस के प्रवासी संदर्भ में भौगोलिक ‘यहूदिया-वासी’ की अपेक्षा व्यापक जातीय-धार्मिक अर्थ अधिक संभावित है।
- source_word: φωνὴ ἐγένετο μία ἐκ πάντων
  choice: वे सब एक स्वर में
  rationale: यूनानी मुहावरे का आशय भीड़ की एकजुट आवाज़ है; यह हिंदी में स्वाभाविक रहते हुए μία की एकता बनाए रखता है।
- source_word: ὡς ἐπὶ ὥρας δύο
  choice: लगभग दो घंटे तक
  rationale: ὡς माप के साथ अनुमान सूचित करता है, इसलिए समय को ठीक दो घंटे न बताकर लगभग कहा गया है।
- source_word: κραζόντων
  choice: चिल्लाते रहे
  rationale: वर्तमान कृदंत लगातार जारी ऊँची पुकार दर्शाता है; ‘रहे’ उसकी अवधि को स्पष्ट करता है।
- source_word: Μεγάλη ἡ Ἄρτεμις Ἐφεσίων
  choice: इफिसियों की अरतिमिस महान है!
  rationale: देवी के नाम और इफिसियों से उसके संबंध को स्पष्ट, स्वाभाविक हिंदी उद्घोष में प्रस्तुत करता है।
theological_decisions:
- issue: Ἰουδαῖος का अर्थ
  choice: यहूदी
  alternative: यहूदिया-वासी
  rationale: यहाँ भीड़ की प्रतिक्रिया सिकन्दर की जातीय-धार्मिक पहचान पर है; उसके यहूदिया प्रदेश का निवासी होने पर नहीं। फिर भी शब्द की भौगोलिक संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी; सार्वजनिक भीड़ के एकजुट और लगातार उद्घोष को सहज, गरिमापूर्ण भाषा में रखा गया है। ‘अरतिमिस’ यूनानी नाम Ἄρτεμις का निकट देवनागरी लिप्यंतरण है।
