  text: At that time there arose no small disturbance concerning the Way[a].
translation:
  language: hi
  text: उस समय ‘मार्ग’ के संबंध में काफी हलचल मच गई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘मार्ग’। प्रेरितों के काम में यह मसीही आंदोलन के लिए बार-बार प्रयुक्त नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: खड़ा हो गया
  rationale: यहाँ क्रिया किसी घटना के घटित होने या उठ खड़े होने को व्यक्त करती है; ‘उपद्रव खड़ा हो गया’ स्वाभाविक हिन्दी है और घटनात्मक भाव बनाए रखती है।
- source_word: δὲ
  choice: अलग शब्द के रूप में व्यक्त नहीं
  rationale: यह हल्का कथात्मक संयोजक है। हिन्दी में इस वाक्य के आरम्भ और प्रसंग-प्रवाह से इसका कार्य स्वाभाविक रूप से व्यक्त हो जाता है; ‘अब’ जोड़ने से अनावश्यक कालगत अर्थ उभर सकता है।
- source_word: κατὰ τὸν καιρὸν ἐκεῖνον
  choice: उस समय
  rationale: यह मूल यूनानी के काल-सूचक वाक्यांश का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: τάραχος
  choice: उपद्रव
  rationale: शब्द अव्यवस्था, हलचल या अशांति को सूचित करता है। ‘उपद्रव’ आगामी घटनाओं के अनुकूल है, पर इस चरण पर ‘दंगा’ जैसा अधिक विशिष्ट कानूनी अर्थ नहीं थोपता।
- source_word: οὐκ ὀλίγος
  choice: भारी
  rationale: यूनानी में शाब्दिक अल्पोक्ति ‘कम नहीं’ है। हिन्दी में ‘कम उपद्रव नहीं’ असहज लगता है; ‘भारी’ उसी तीव्रता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: περὶ
  choice: को लेकर
  rationale: सम्बन्धित विषय या कारण को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῆς ὁδοῦ
  choice: इस पंथ
  rationale: प्रेरितों के काम में यह यीशु के अनुयायियों के आन्दोलन के लिए एक पहचाना हुआ नाम है। हिन्दी में केवल ‘मार्ग’ यहाँ भौतिक रास्ता समझा जा सकता है; ‘इस पंथ’ सन्दर्भगत अर्थ स्पष्ट करता है, जबकि पाद-टिप्पणी शाब्दिक रूप सुरक्षित रखती है।
theological_decisions:
- issue: τῆς ὁδοῦ को मसीही आन्दोलन के नाम के रूप में प्रस्तुत करना
  choice: इस पंथ
  alternative: मार्ग
  rationale: सन्दर्भ में अभिप्राय किसी भौतिक रास्ते से नहीं, यीशु के अनुयायियों के आन्दोलन से है। ‘इस पंथ’ साधारण हिन्दी पाठक को यह संकेत देता है, जबकि पाद-टिप्पणी बताती है कि मूल शब्द का शाब्दिक अर्थ ‘मार्ग’ है; इससे कोई अतिरिक्त सम्प्रदायगत दावा नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, कथात्मक और गरिमापूर्ण रखी गई है। ‘भारी उपद्रव’ सहज हिन्दी में यूनानी अल्पोक्ति का बल व्यक्त करता है; ‘इस पंथ’ के साथ पाद-टिप्पणी मूल रूपक और प्रेरितों के काम में उसके विशेष प्रयोग दोनों को सुरक्षित रखती है।
