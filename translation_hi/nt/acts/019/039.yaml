  edition: SBLGNT
  text: εἰ δέ τι ⸀περαιτέρω ἐπιζητεῖτε, ἐν τῇ ἐννόμῳ ἐκκλησίᾳ ἐπιλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/039.yaml
  text: But if you seek anything further[a], it will be settled in the lawful assembly.
translation:
  language: hi
  text: पर यदि आप कोई और बात उठाना चाहते हैं, तो उसका निपटारा विधिसम्मत सभा[a] में किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कानूनी सभा में” अथवा “नियमित सभा में।” यूनानी पद का संकेत कानून के अनुसार गठित नागरिक सभा की ओर है, कलीसिया की ओर नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: περαιτέρω
  choice: और
  rationale: यह क्रियाविशेषण वर्तमान विषय से अतिरिक्त या आगे की बात को सूचित करता है; ‘कोई और बात’ आधुनिक हिन्दी में स्वाभाविक रूप से यह अर्थ देता है।
- source_word: ἐπιζητεῖτε
  choice: उठाना चाहते हैं
  rationale: नागरिक और विधिक प्रसंग में यह किसी अतिरिक्त विषय को आगे लाने या उस पर कार्रवाई चाहने का भाव व्यक्त करता है; ‘उठाना चाहते हैं’ न तो अत्यधिक तकनीकी है, न आक्रामक।
- source_word: τι
  choice: कोई ... बात
  rationale: शर्तवाचक वाक्य में अनिश्चित अतिरिक्त विषय के लिए यह सहज हिन्दी रूप है।
- source_word: ἐννόμῳ
  choice: विधिवत्
  rationale: यह कानून के अनुरूप और उचित प्रक्रिया से गठित सभा का बोध कराता है; ‘विधिवत्’ कानूनी वैधता और नियमित प्रक्रिया दोनों को संक्षेप में व्यक्त करता है।
- source_word: ἐκκλησίᾳ
  choice: सभा
  rationale: यहाँ शब्द मसीही कलीसिया नहीं, इफिसुस की नागरिक सभा को सूचित करता है; ‘सभा’ मूल के एकत्र निकाय वाले अर्थ को बनाए रखता है।
- source_word: ἐπιλυθήσεται
  choice: निपटारा ... किया जाएगा
  rationale: भविष्यत् कर्मवाच्य का यह स्वाभाविक हिन्दी रूप है और नागरिक-विधिक प्रक्रिया में विषय के समाधान को व्यक्त करता है।
theological_decisions:
- issue: गैर-मसीही नागरिक प्रसंग में ἐκκλησία का अनुवाद
  choice: सभा
  alternative: कलीसिया; बैठक
  rationale: संदर्भ इफिसुस की विधिवत् नागरिक सभा का है, मसीही समुदाय का नहीं। ‘कलीसिया’ भ्रामक धार्मिक अर्थ जोड़ता, जबकि ‘सभा’ मूल के सार्वजनिक एकत्रीकरण के अर्थ को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘विधिवत् सभा’ नागरिक-कानूनी संदर्भ को स्पष्ट करती है, जबकि पादटिप्पणी ἐννόμῳ की वैकल्पिक छटाएँ और ἐκκλησία का गैर-कलीसियाई अर्थ सुरक्षित रखती है।
