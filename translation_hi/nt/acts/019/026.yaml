source:
  edition: SBLGNT
  text: καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/026.yaml
  text: And you see and hear that not only in Ephesus but in almost all of Asia[a], this Paul has persuaded and turned away a considerable crowd[b], saying that gods made by hands are not gods.
translation:
  language: hi
  text: और तुम देखते और सुनते हो कि न केवल इफिसुस में, बल्कि लगभग पूरे आसिया प्रदेश[a] में, इस पौलुस ने काफी बड़े जनसमूह को समझा-बुझाकर उसका रुख बदल दिया है, यह कहते हुए कि हाथों से बनाए जानेवाले देवता[b] देवता नहीं हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘आसिया’ से रोमी साम्राज्य का आसिया प्रांत अभिप्रेत है, न कि आज का पूरा एशिया महाद्वीप।
    reason: historical_geographical_note
  - marker: b
    text: 'शाब्दिक अर्थ: ‘जो हाथों के द्वारा बनाए जाते हैं’; आशय मनुष्य की कारीगरी से गढ़ी गई देव-मूर्तियों से है।'
    reason: cultural_note
lexical_decisions:
- source_word: θεωρεῖτε καὶ ἀκούετε
  choice: तुम देखते और सुनते हो
  rationale: दोनों वर्तमानकालिक क्रियाओं को साथ रखकर दिमेत्रियुस की प्रत्यक्ष और सार्वजनिक प्रमाण की अपील सुरक्षित रखी गई है।
- source_word: οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας
  choice: न केवल इफिसुस में, बल्कि लगभग पूरे आसिया प्रदेश में
  rationale: यूनानी संबंधकारक को प्रसंगानुसार स्थानवाचक अर्थ में व्यक्त किया गया है। ‘प्रदेश’ जोड़ने से प्राचीन रोमी प्रांत आसिया को आधुनिक महाद्वीप एशिया समझने की संभावना घटती है।
- source_word: ὁ Παῦλος οὗτος
  choice: इस पौलुस
  rationale: संकेतवाचक οὗτος का तिरस्कारपूर्ण या उपेक्षापूर्ण भाषण-स्वर बिना अतिरंजित अपमान जोड़े सुरक्षित रहता है।
- source_word: πείσας μετέστησεν
  choice: समझा-बुझाकर फेर दिया है
  rationale: πείσας को मनाने-समझाने के साधन के रूप में और μετέστησεν को पहले रुख से हटाकर दूसरी ओर करने के अर्थ में व्यक्त किया गया है; ‘भटका दिया’ जैसी अधिक निर्णायक व्याख्या से बचा गया है।
- source_word: ἱκανὸν ὄχλον
  choice: बहुत बड़ी भीड़
  rationale: यहाँ ἱκανός उल्लेखनीय या पर्याप्त बड़ी संख्या दर्शाता है; यह अभिव्यक्ति सामान्य आधुनिक हिंदी में स्वाभाविक है।
- source_word: λέγων ὅτι
  choice: वह कहता है कि
  rationale: यूनानी कृदंत को हिंदी में स्पष्ट स्वतंत्र वाक्य बनाकर स्वाभाविक प्रवाह दिया गया है, जबकि पौलुस के कथन का आशय यथावत है।
- source_word: οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι
  choice: हाथों से बनाए जानेवाले देवता देवता नहीं हैं
  rationale: निर्मित वस्तुओं के देवत्व का सीधा निषेध सुरक्षित रखा गया है। ‘वास्तव में’ जैसा व्याख्यात्मक शब्द नहीं जोड़ा गया।
theological_decisions:
- issue: मनुष्य-निर्मित देवताओं के विषय में पौलुस के निषेध का स्वरूप
  choice: हाथों से बनाए जानेवाले देवता देवता नहीं हैं
  alternative: मनुष्य के हाथों की बनाई वस्तुएँ देवता नहीं हैं
  rationale: चुना हुआ रूप θεοί की पुनरावृत्ति और कथन की विवादात्मक धार बनाए रखता है, पर पाठ से आगे बढ़कर कोई व्यापक दार्शनिक दावा नहीं जोड़ता।
- issue: μετέστησεν में परिवर्तन और भ्रमित करने के बीच अर्थ
  choice: फेर दिया है
  alternative: भटका दिया है
  rationale: ‘फेर दिया’ लोगों के पूर्व रुख या उपासना से हटने को व्यक्त करता है और दिमेत्रियुस के आरोप का बल बनाए रखता है; ‘भटका दिया’ पौलुस को वस्तुगत रूप से धोखेबाज ठहराने का अधिक व्याख्यात्मक प्रभाव डाल सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘इस पौलुस’ भाषण में निहित उपेक्षापूर्ण संकेत को रखता है। ‘समझा-बुझाकर फेर दिया’ मूल की दोनों क्रियाओं को अलग पहचान देता है और अनावश्यक सांप्रदायिक या दार्शनिक विस्तार से बचता है।
