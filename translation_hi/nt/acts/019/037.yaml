  text: ἠγάγετε γὰρ τοὺς ἄνδρας τούτους οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὸν ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/037.yaml
  text: For you have brought these men here who are neither temple robbers nor blasphemers of our goddess[a].
translation:
  language: hi
  text: क्योंकि जिन पुरुषों को तुम यहाँ लाए हो, वे न तो मंदिरों को लूटनेवाले हैं और न हमारी देवी[a] की निंदा करनेवाले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘हमारे देव’ है, और उसके साथ स्त्रीलिंग लेख प्रयुक्त है; प्रसंग में अभिप्रेत अरतिमिस है, इसलिए यहाँ ‘हमारी देवी’ कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάγετε
  choice: तुम यहाँ लाए हो
  rationale: सम्बोधन बहुवचन है और क्रिया पूर्ण हो चुकी घटना को वर्तमान सभा से जोड़ती है; ‘यहाँ’ प्रसंग में उपस्थित व्यक्तियों की ओर संकेत को स्वाभाविक बनाता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन में कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: τοὺς ἄνδρας τούτους
  choice: जिन पुरुषों को
  rationale: ἀνήρ यहाँ वयस्क पुरुषों के लिए है। सम्बन्धवाचक रचना हिन्दी वाक्य को सहज बनाती है और τούτους का संकेत ‘यहाँ’ से व्यक्त होता है।
- source_word: οὔτε ... οὔτε
  choice: न तो ... और न
  rationale: यूनानी के सहसम्बन्धी निषेध को स्वाभाविक हिन्दी संरचना में सुरक्षित रखता है।
- source_word: ἱεροσύλους
  choice: मंदिरों को लूटनेवाले
  rationale: शब्द का ठोस अर्थ पवित्र स्थलों या उनकी सम्पत्ति को लूटनेवालों से है; बहुवचन ‘मंदिरों’ सामान्य श्रेणी को दर्शाता है।
- source_word: βλασφημοῦντας
  choice: निंदा करनेवाले
  rationale: यह किसी देवता के विरुद्ध अपमानजनक या निंदात्मक वाणी को दर्शाता है। ‘निंदा’ सामान्य आधुनिक हिन्दी में स्पष्ट है और प्रसंग में धार्मिक आरोप का भाव रखती है।
- source_word: τὴν θεὸν ἡμῶν
  choice: हमारी देवी
  rationale: प्रसंग में संकेत इफिसुस की अरतिमिस की ओर है, इसलिए स्त्रीलिंग ‘देवी’ हिन्दी में वास्तविक अभिप्रेत को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: अरतिमिस के लिए θεὸν ἡμῶν का अनुवाद
  choice: हमारी देवी
  alternative: हमारे देवता
  rationale: वक्ता इफिसुस का गैर-यहूदी अधिकारी है और अरतिमिस की बात कर रहा है। ‘देवी’ प्रसंगगत लिंग और अभिप्रेत को स्पष्ट करता है; यह उसकी उपासना का धार्मिक अनुमोदन नहीं है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और सार्वजनिक सभा के औपचारिक कथन के अनुरूप है। ‘लूटनेवाले’ और ‘निंदा करनेवाले’ सामान्य पाठकों के लिए सहज हैं; वाक्य यूनानी के दोनों निषेधों और कारणसूचक सम्बन्ध को बनाए रखता है।
