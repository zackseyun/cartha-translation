  naturalness: The Hindi is generally clear and suitably formal. ‘इफिसुस के पुरुषो’ is an idiomatic elevated public vocative. ‘नगर-सचिव’ and ‘मंदिर का संरक्षक’ are natural in this register.
  terminology: ‘नगर-सचिव,’ ‘महान अरतिमिस,’ and ‘आकाश से गिरी हुई प्रतिमा’ appropriately retain the civic and cultic language. The footnote preserves the fact that διοπετοῦς itself denotes a supposedly sky-fallen thing and does not intrinsically specify an image.
  issues:
  - severity: low
    issue: Footnote anchor is placed after the closing quotation rather than at the ambiguous expression.
    rationale: The note explains ‘आकाश से गिरी हुई प्रतिमा’; placing [a] immediately after ‘प्रतिमा’ gives readers an unambiguous anchor.
  - severity: low
    issue: ‘महान अरतिमिस के मंदिर और आकाश से गिरी हुई प्रतिमा का संरक्षक’ introduces ‘मंदिर’ as an explicit coordinate object in a way that can obscure νεωκόρος as the city’s cultic title.
    rationale: ‘महान अरतिमिस और आकाश से गिरी हुई प्रतिमा का मंदिर का संरक्षक’ more directly presents the city as bearing the temple-custodian title in relation to the goddess and the purportedly heaven-fallen object, while remaining readable Hindi.
