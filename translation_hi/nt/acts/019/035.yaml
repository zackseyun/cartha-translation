id: ACT.19.35
reference: Acts 19:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καταστείλας δὲ ⸂ὁ γραμματεὺς τὸν ὄχλον⸃ φησίν· Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ⸀ἀνθρώπων ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς ⸀μεγάλης Ἀρτέμιδος καὶ τοῦ διοπετοῦς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/035.yaml
  text: But after the city clerk had quieted the crowd, he said, “Men of Ephesus, for what man is there who does not know that the city of the Ephesians is temple-keeper of the great Artemis and of the image fallen from heaven?”
translation:
  language: hi
  text: तब नगर-सचिव ने भीड़ को शांत करके कहा, “इफिसुस के पुरुषो, भला मनुष्यों में कौन है जो यह नहीं जानता कि इफिसियों का नगर महान अरतिमिस और आकाश से गिरी हुई प्रतिमा[a] के मंदिर का संरक्षक है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आकाश से गिरी हुई वस्तु।” यहाँ संभवतः अरतिमिस से जुड़ी पवित्र प्रतिमा अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστείλας
  choice: शांत करके
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई कार्रवाई बताता है; हिंदी में ‘शांत करके’ क्रम और स्वाभाविकता दोनों बनाए रखता है।
- source_word: ὁ γραμματεὺς
  choice: नगर-सचिव
  rationale: यहाँ शब्द यहूदी शास्त्री नहीं, इफिसुस के एक नागरिक प्रशासनिक अधिकारी को सूचित करता है।
- source_word: Ἄνδρες Ἐφέσιοι
  choice: इफिसुस के पुरुषो
  rationale: संबोधन का स्पष्ट पुल्लिंग रूप और औपचारिक सार्वजनिक संबोधन सुरक्षित रखा गया है।
- source_word: νεωκόρον
  choice: मंदिर ... का संरक्षक
  rationale: यह उपाधि उस नगर को दर्शाती है जिसे किसी मंदिर या पंथ का आधिकारिक संरक्षक माना जाता था; हिंदी में ‘संरक्षक’ अर्थ को सहज रूप से व्यक्त करता है।
- source_word: τῆς μεγάλης Ἀρτέμιδος
  choice: महान अरतिमिस
  rationale: देवी के नाम के साथ प्रयुक्त सम्मानसूचक विशेषण को सीधे रखा गया है; नाम का लिप्यंतरण यूनानी उच्चारण के निकट है।
- source_word: τοῦ διοπετοῦς
  choice: आकाश से गिरी हुई प्रतिमा
  rationale: शब्द मूलतः आकाश से गिरी मानी जाने वाली किसी वस्तु को बताता है। प्रसंग में प्रतिमा संभावित संदर्भ है, पर स्रोत की अस्पष्टता बताने के लिए पादटिप्पणी दी गई है।
theological_decisions:
- issue: अरतिमिस और आकाश से गिरी वस्तु के विषय में मूर्तिपूजक दावा
  choice: 'वक्ता के दावे के रूप में इसे सीधे प्रस्तुत किया गया है: ‘आकाश से गिरी हुई प्रतिमा।’'
  alternative: ‘आकाश से गिरी हुई वस्तु’ अथवा ‘ज़ीउस से गिरी हुई वस्तु’
  rationale: यह नगर-सचिव का धार्मिक दावा है, कथाकार द्वारा उसकी सत्यता की पुष्टि नहीं। ‘आकाश’ प्रचलित अर्थ देता है और ‘प्रतिमा’ प्रसंगगत संकेत स्पष्ट करती है, जबकि पादटिप्पणी वास्तविक शाब्दिक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक भाषण के अनुकूल रखी गई है। ‘नगर-सचिव’ प्रशासनिक पद को स्पष्ट करता है; ‘इफिसुस के पुरुषो’ मूल के औपचारिक पुल्लिंग संबोधन को सुरक्षित रखता है।
