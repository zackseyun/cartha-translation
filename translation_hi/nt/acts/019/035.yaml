  to: तब नगर-सचिव ने भीड़ को शांत करके कहा, “इफिसुस के पुरुषो, भला मनुष्यों में कौन है जो यह नहीं जानता कि इफिसियों का नगर महान अरतिमिस और आकाश से गिरी हुई प्रतिमा[a] के मंदिर का संरक्षक है?”
