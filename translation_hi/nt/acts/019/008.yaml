source:
  edition: SBLGNT
  text: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ ⸀πείθων περὶ τῆς βασιλείας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/019/008.yaml
  text: And entering the synagogue[a], he spoke boldly for three months[b], reasoning and persuading them about the kingdom of God.
translation:
  language: hi
  text: फिर वह आराधनालय में प्रवेश करके तीन महीने तक निडरता से बोलता रहा, और परमेश्वर के राज्य के विषय में तर्क करता और उन्हें मनाता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν
  choice: फिर वह आराधनालय में गया
  rationale: δέ कथा को आगे बढ़ाने वाला हलका संयोजक है, इसलिए ‘फिर’ स्वाभाविक है। एओरिस्ट कृदन्त Εἰσελθών को हिन्दी में मुख्य क्रिया के साथ क्रमिक रूप में व्यक्त किया गया है। συναγωγή के लिए प्रचलित और स्पष्ट ‘आराधनालय’ चुना गया है।
- source_word: ἐπαρρησιάζετο
  choice: निडर होकर बोलता रहा
  rationale: इम्परफेक्ट रूप निरंतर क्रिया को और क्रिया स्वयं खुले साहस के साथ बोलने को व्यक्त करती है; ‘बोलता रहा’ तथा ‘निडर होकर’ दोनों पक्षों को सहज हिन्दी में रखते हैं।
- source_word: ἐπὶ μῆνας τρεῖς
  choice: तीन महीने तक
  rationale: ἐπί और कर्मकारक यहाँ समयावधि बताते हैं; हिन्दी में ‘तक’ स्वाभाविक रूप से यही अर्थ देता है।
- source_word: διαλεγόμενος
  choice: विचार-विमर्श करता
  rationale: शब्द में संवाद के द्वारा तर्क और व्याख्या करने का भाव है। ‘विचार-विमर्श’ इस पारस्परिक पहलू को बिना अनावश्यक आक्रामकता के व्यक्त करता है।
- source_word: πείθων
  choice: लोगों को सहमत करने का प्रयास करता रहा
  rationale: शब्द मनाने या सहमत कराने की सक्रिय प्रक्रिया बताता है। प्रसंग से निहित श्रोताओं को ‘लोगों’ द्वारा स्पष्ट किया गया है। ‘प्रयास’ परिणाम को निश्चित मानने से बचाता है; अधिक प्रत्यक्ष विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: परमेश्वर के राज्य के विषय में
  rationale: περί के संबंधसूचक अर्थ को ‘के विषय में’ और βασιλεία τοῦ θεοῦ को परिचित तथा सटीक पद ‘परमेश्वर का राज्य’ से व्यक्त किया गया है।
theological_decisions:
- issue: πείθων से प्रयास सूचित होता है या सफल परिणाम
  choice: लोगों को सहमत करने का प्रयास करता रहा
  alternative: लोगों को सहमत करता रहा
  rationale: वर्तमान कृदन्त मनाने की जारी गतिविधि को स्पष्ट करता है, पर यह आवश्यक नहीं कि सभी श्रोता वास्तव में सहमत हो गए। मुख्य पाठ परिणाम को अनिर्णीत रखता है और पाद-टिप्पणी अधिक प्रत्यक्ष व्याकरणिक विकल्प देती है।
- issue: βασιλεία τοῦ θεοῦ का अर्थक्षेत्र
  choice: परमेश्वर का राज्य
  alternative: परमेश्वर का शासन
  rationale: βασιλεία में राज्य और शासन दोनों का भाव हो सकता है। इस प्रसंग में ‘परमेश्वर का राज्य’ सटीक, परिचित और नए नियम के प्रमुख पद के रूप में उपयुक्त है; पाठ किसी एक संकीर्ण धर्मवैज्ञानिक व्याख्या को नहीं थोपता।
- issue: πείθων का निहित कर्म
  choice: लोगों को
  alternative: कर्म को अव्यक्त छोड़ना
  rationale: यूनानी में कर्म स्पष्ट रूप से नहीं लिखा है, पर आराधनालय में उपस्थित श्रोता प्रसंग से निहित हैं। स्वाभाविक हिन्दी के लिए ‘लोगों को’ जोड़ा गया है, बिना किसी नए समूह या परिणाम का दावा किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘निडर होकर बोलता रहा’ इम्परफेक्ट की निरंतरता को स्पष्ट करता है। दो वाक्यों में विभाजन हिन्दी में पठनीयता बढ़ाता है, जबकि मूल की सहभागी क्रियाओं का आपसी संबंध बना रहता है।
