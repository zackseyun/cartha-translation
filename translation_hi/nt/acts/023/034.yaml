  yaml_path: translation/nt/acts/023/034.yaml
  text: After reading it and asking what province he was from[a], and learning that he was from Cilicia,
translation:
  language: hi
  text: पत्र पढ़कर उसने पूछा कि वह किस प्रान्त से है, और जब उसे पता चला कि वह किलिकिया से है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγνοὺς
  choice: पत्र पढ़कर
  rationale: अओरिस्ट कृदन्त पूर्ववर्ती पत्र को पढ़ने की क्रिया बताता है; हिन्दी में संदर्भानुसार ‘पत्र’ स्पष्ट करना स्वाभाविक है।
- source_word: δὲ
  choice: —
  rationale: यहाँ δέ हल्का प्रसंग-संयोजक है; हिन्दी वाक्य-प्रवाह में अलग शब्द के बिना इसका कार्य स्वाभाविक रूप से व्यक्त होता है।
- source_word: καὶ ἐπερωτήσας
  choice: उसने पूछा
  rationale: καί क्रम में अगली क्रिया जोड़ता है और ἐπερωτήσας सीधे पूछताछ का बोध देता है; हिन्दी में कर्ता और परिमित क्रिया रखने से वाक्य सहज बनता है।
- source_word: ἐκ ποίας ἐπαρχείας ἐστὶν
  choice: कि वह किस प्रान्त का है
  rationale: ἐπαρχία रोमी प्रशासनिक प्रान्त को दर्शाता है; ‘किस प्रान्त का है’ आधुनिक हिन्दी में मूल प्रश्न का स्वाभाविक और प्रशासनिक अर्थ सुरक्षित रखने वाला रूप है।
- source_word: πυθόμενος
  choice: जब उसे पता चला
  rationale: मध्यवाच्य कृदन्त सूचना प्राप्त होने को व्यक्त करता है; यह रूप क्रियाओं का क्रम स्पष्ट और सहज रखता है।
- source_word: ὅτι ἀπὸ Κιλικίας
  choice: कि वह किलिकिया का है
  rationale: ἀπό स्थानगत मूल या Herkunft दर्शाता है; हिन्दी में ‘किलिकिया का’ उसी उद्गम को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Κιλικίας
  choice: किलिकिया
  rationale: यूनानी स्थान-नाम का हिन्दी में प्रचलित लिप्यंतरण।
