  text: Claudius Lysias[a], to the most excellent governor Felix, greetings.
translation:
  language: hi
  text: क्लौदियुस लूसियास की ओर से परम माननीय राज्यपाल फेलिक्स को नमस्कार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κλαύδιος Λυσίας
  choice: क्लौदियुस लूसियास
  rationale: यूनानी रूपों के निकट रहते हुए दोनों व्यक्तिगत नामों का देवनागरी में लिप्यंतरण किया गया है।
- source_word: τῷ κρατίστῳ
  choice: परम माननीय
  rationale: यह उच्च अधिकारी के लिए प्रयुक्त औपचारिक आदरसूचक संबोधन है। ‘परम माननीय’ उसके उच्च आदर और पत्र की सरकारी शैली को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡγεμόνι
  choice: राज्यपाल
  rationale: इस रोमी प्रांतीय संदर्भ में यह किसी शासकीय अधिकारी को सूचित करता है; ‘राज्यपाल’ स्पष्ट है और अनावश्यक रूप से अधिक विशिष्ट पदनाम नहीं थोपता।
- source_word: Φήλικι
  choice: फेलिक्स
  rationale: व्यक्तिगत नाम का प्रचलित और स्रोत-संगत देवनागरी लिप्यंतरण।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: पत्र के आरंभ में यह रूढ़ अभिवादन है, न कि ‘आनन्दित हो’ की शाब्दिक आज्ञा। औपचारिक हिन्दी पत्र-शैली में ‘नमस्कार’ इसका स्वाभाविक समतुल्य है।
