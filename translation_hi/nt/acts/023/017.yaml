base_translation:
  language: en
  yaml_path: translation/nt/acts/023/017.yaml
  text: So Paul called one of the centurions and said[a], “Take this young man to the commander, for he has something to report to him.”
translation:
  language: hi
  text: तब पौलुस ने सूबेदारों में से एक को अपने पास बुलाकर कहा, “इस युवक को सेनापति के पास ले जाओ, क्योंकि उसे उन्हें कुछ सूचना देनी[a] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे उनसे कुछ कहना है।” यूनानी क्रिया का अर्थ सूचना देना, समाचार पहुँचाना, या बताना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: अपने पास बुलाकर
  rationale: मध्यवाच्य कृदंत का आशय किसी को अपने पास बुलाने से है; यह हिंदी में स्वाभाविक रूप से पूर्ववर्ती क्रिया भी व्यक्त करता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ तीव्र विरोध नहीं, बल्कि कथा की अगली घटना को आगे बढ़ाता है।
- source_word: ἕνα τῶν ἑκατονταρχῶν
  choice: सूबेदारों में से एक
  rationale: ἑκατοντάρχης रोमी सेना में लगभग सौ सैनिकों के अधिकारी को दर्शाता है। हिंदी बाइबल-परंपरा में ‘सूबेदार’ समझने योग्य पदनाम है, यद्यपि यह पूर्ण तकनीकी समतुल्य नहीं है।
- source_word: νεανίαν
  choice: जवान
  rationale: νεανίας एक युवा पुरुष को दर्शाता है; ‘जवान’ यहाँ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἄπαγε
  choice: ले जाओ
  rationale: आज्ञार्थक ἄπαγε का अर्थ किसी व्यक्ति को साथ लेकर दूसरे के पास पहुँचाना है।
- source_word: χιλίαρχον
  choice: सेनापति
  rationale: यहाँ शब्द रोमी सैन्य ट्रिब्यून, अर्थात बड़े सैन्य अधिकारी, के लिए है। ‘सेनापति’ सामान्य पाठक के लिए सहज है और पद की अधिकारपूर्ण भूमिका बताता है।
- source_word: ἔχει ... ἀπαγγεῖλαί τι αὐτῷ
  choice: इसे उनसे कुछ कहना है
  rationale: ἔχει + infinitive यहाँ बताता है कि युवक के पास अधिकारी से कहने या सूचित करने के लिए कुछ है। हिंदी में यह रचना सहज है और मूल की व्यापक अर्थ-सीमा बचाए रखती है।
