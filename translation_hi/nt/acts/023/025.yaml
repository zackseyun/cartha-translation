lexical_decisions:
- source_word: γράψας
  choice: उसने ... लिखा
  rationale: यह γράφω का एओरिस्ट कृदंत है और पिछले पद के कर्ता द्वारा पत्र लिखे जाने को बताता है। स्वाभाविक हिन्दी कथन-शैली में इसे पूर्ण क्रिया के रूप में व्यक्त किया गया है।
- source_word: ἐπιστολήν
  choice: एक पत्र
  rationale: ἐπιστολή का अर्थ लिखित संदेश या पत्र है। आधुनिक हिन्दी में ‘पत्र’ स्पष्ट और गरिमापूर्ण है।
- source_word: ἔχουσαν
  choice: जिसका ... था
  rationale: यह वर्तमान कृदंत ἐπιστολήν का विशेषण है। हिन्दी का संबंधवाचक उपवाक्य मूल संबंध को स्वाभाविक ढंग से बनाए रखता है।
- source_word: τύπον
  choice: स्वरूप
  rationale: यहाँ τύπος पत्र के रूप, ढाँचे या शब्द-विन्यास की ओर संकेत करता है। ‘स्वरूप’ निकट अर्थ रखता है और ‘विषय-वस्तु’ या ‘शब्दावली’ जैसी अधिक संकीर्ण व्याख्या से बचता है।
- source_word: τοῦτον
  choice: यह
  rationale: यह संकेतवाचक आगे दिए जाने वाले पत्र की ओर संकेत करता है। ‘यह’ मूल की अग्रसूचक अभिव्यक्ति को बनाए रखता है।
