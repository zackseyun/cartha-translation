id: ACT.23.6
reference: Acts 23:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Γνοὺς δὲ ὁ Παῦλος ὅτι τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων ⸀ἔκραζεν ἐν τῷ συνεδρίῳ· Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς ⸀Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ⸀ἐγὼ κρίνομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/006.yaml
  text: But Paul[a], knowing that one part were Sadducees and the other Pharisees, cried out in the council, “Men, brothers, I am a Pharisee, a son of Pharisees[c][b]. It is concerning the hope and resurrection of the dead that I am being judged.”
translation:
  language: hi
  text: पर पौलुस ने यह जानकर कि सभा का एक दल सदूकियों का और दूसरा फरीसियों का है, महासभा में[a] ऊँची आवाज़ में कहा, “भाइयो, मैं फरीसी और फरीसियों का पुत्र हूँ।[b] आशा और मरे हुओं के पुनरुत्थान के विषय में मेरा न्याय किया जा रहा है।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदी महासभा में” अथवा “सन्हेद्रिन में।” यूनानी शब्द विशेष रूप से यहूदी शासकीय परिषद को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अर्थ “फरीसी माता-पिता का पुत्र” या “फरीसियों का वंशज” भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या “मरे हुओं के पुनरुत्थान की आशा के विषय में मेरा न्याय किया जा रहा है।”
    reason: alternative_reading
lexical_decisions:
- source_word: Γνοὺς
  choice: यह जानकर
  rationale: अओरिस्ट कृदंत पौलुस के बोलने की परिस्थिति और कारण बताता है; ‘यह जानकर’ उसके कृदंतीय बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὸ ἓν μέρος ... τὸ δὲ ἕτερον
  choice: सभा का एक दल ... दूसरा
  rationale: μέρος सभा के भीतर के दो हिस्सों को दर्शाता है। हिन्दी में ‘दल’ उस सामाजिक विभाजन को ‘भाग’ की अपेक्षा अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Σαδδουκαίων / Φαρισαίων
  choice: सदूकियों / फरीसियों
  rationale: इन यहूदी धार्मिक दलों के लिए प्रचलित हिन्दी रूप अपनाए गए हैं।
- source_word: ἔκραζεν
  choice: ऊँची आवाज़ में कहा
  rationale: κράζω सार्वजनिक रूप से जोर से बोलने का भाव देता है; यह रूप उस बल को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ συνεδρίῳ
  choice: महासभा में
  rationale: संदर्भ में συνέδριον यहूदी शासकीय परिषद को सूचित करता है। ‘महासभा’ अर्थपूर्ण हिन्दी रूप है; ‘यहूदी महासभा’ और ‘सन्हेद्रिन’ पादटिप्पणी में दिए गए हैं।
- source_word: Ἄνδρες ἀδελφοί
  choice: भाइयो
  rationale: यह संबोधन सभा में उपस्थित पुरुषों को आत्मीय रूप से संबोधित करता है। शब्दशः ‘पुरुषो, भाइयो’ आधुनिक हिन्दी में अस्वाभाविक है; ‘भाइयो’ दोनों शब्दों के संबोधन-बल को सहज रूप से व्यक्त करता है।
- source_word: Φαρισαῖός εἰμι
  choice: मैं फरीसी हूँ
  rationale: वर्तमान काल में पौलुस की सीधी आत्म-पहचान को बनाए रखता है।
- source_word: υἱὸς Φαρισαίων
  choice: फरीसियों का पुत्र
  rationale: बहुवचन Φαρισαίων और पारिवारिक मुहावरे को बिना यह तय किए सुरक्षित रखा गया है कि संकेत माता-पिता, पूर्वजों या दलगत परंपरा की ओर है।
- source_word: περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν
  choice: आशा और मरे हुओं के पुनरुत्थान के विषय में
  rationale: περί मुकदमे के विषय को बताता है। καί से जुड़े ‘आशा’ और ‘पुनरुत्थान’ को मुख्य पाठ में अलग किंतु संबंधित पदों के रूप में रखा गया है, जबकि νεκρῶν को स्वाभाविक रूप से ‘पुनरुत्थान’ से जोड़ा गया है।
- source_word: κρίνομαι
  choice: मेरा न्याय किया जा रहा है
  rationale: वर्तमान कर्मवाच्य पौलुस की चल रही न्यायिक स्थिति को स्पष्ट रूप से व्यक्त करता है; ‘मुझ पर मुकदमा चल रहा है’ अधिक मुहावरेदार पर कुछ अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: υἱὸς Φαρισαίων में पौलुस के दावे का अर्थ
  choice: ‘फरीसियों का पुत्र’ रखकर पारिवारिक मुहावरे और बहुवचन को सुरक्षित रखा गया।
  alternative: ‘फरीसी माता-पिता का पुत्र’ अथवा ‘फरीसियों का वंशज’।
  rationale: यूनानी वाक्यांश माता-पिता, वंश अथवा विरासत में मिली दलगत पहचान की ओर संकेत कर सकता है; मुख्य पाठ किसी एक ऐतिहासिक निष्कर्ष को अनिवार्य नहीं बनाता।
- issue: ‘आशा’ और ‘पुनरुत्थान’ का पारस्परिक संबंध
  choice: ‘आशा और मरे हुओं के पुनरुत्थान’ के रूप में समन्वय बनाए रखा गया।
  alternative: ‘मरे हुओं के पुनरुत्थान की आशा’।
  rationale: यूनानी में ἐλπίδος और ἀναστάσεως καί से जुड़े हैं। यह दो निकट संबंधी विषयों या पुनरुत्थान पर केंद्रित एक आशा को सूचित कर सकता है; मुख्य पाठ समन्वित रूप को और पादटिप्पणी दूसरा संभव अर्थ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, सार्वजनिक वाचन योग्य और गरिमापूर्ण शैली रखी गई है। ‘भाइयो’ हिन्दी के सामान्य पुरुष-संबोधन के रूप में Ἄνδρες ἀδελφοί का संप्रेषण करता है। न्यायिक संदर्भ के लिए ‘मेरा न्याय किया जा रहा है’ मूल के वर्तमान कर्मवाच्य के निकट है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित स्थानों पर दिए गए हैं।
