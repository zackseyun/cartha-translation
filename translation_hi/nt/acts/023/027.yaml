source:
  edition: SBLGNT
  text: τὸν ἄνδρα τοῦτον συλλημφθέντα ὑπὸ τῶν Ἰουδαίων καὶ μέλλοντα ἀναιρεῖσθαι ὑπ’ αὐτῶν ἐπιστὰς σὺν τῷ στρατεύματι ⸀ἐξειλάμην, μαθὼν ὅτι Ῥωμαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/027.yaml
  text: This man was seized by the Jews and was about to be killed by them[a], and I came with the troops and rescued him, having learned that he is a Roman.
translation:
  language: hi
  text: इस व्यक्ति को यहूदियों[a] ने पकड़ लिया था और वे उसे मार डालने ही वाले थे। यह जानकर कि वह रोमी है, मैं सैनिकों के साथ आया और उसे बचा लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहूदिया के निवासियों ने।’ यूनानी शब्द जातीय-धार्मिक अर्थ में यहूदियों अथवा भौगोलिक अर्थ में यहूदिया के निवासियों को सूचित कर सकता है; यहाँ संभवतः यरूशलेम में पौलुस का विरोध करने वाली यहूदी भीड़ का उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συλλημφθέντα
  choice: पकड़ लिया था
  rationale: यहाँ निष्क्रिय कृदन्त शत्रुतापूर्ण ढंग से धर लिए जाने को दर्शाता है; ‘पकड़ लिया था’ स्वाभाविक है और औपचारिक गिरफ्तारी का अनावश्यक संकेत नहीं देता।
- source_word: Ἰουδαίων
  choice: यहूदियों
  rationale: Ἰουδαῖοι जातीय-धार्मिक यहूदियों अथवा भौगोलिक अर्थ में यहूदिया के लोगों को सूचित कर सकता है। यहाँ यरूशलेम में पौलुस का विरोध करने वाले यहूदी समूह का संदर्भ है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: μέλλοντα ἀναιρεῖσθαι
  choice: मार डालने ही वाले थे
  rationale: μέλλω और धातुरूप ἀναιρεῖσθαι निकट भविष्य में हत्या किए जाने को व्यक्त करते हैं; सक्रिय हिंदी वाक्य स्रोत के कर्ता ‘उनके द्वारा’ को स्पष्ट और स्वाभाविक रूप में रखता है।
- source_word: ἐπιστὰς
  choice: वहाँ पहुँचकर
  rationale: ἐφίστημι का कृदन्त अचानक पहुँचने या हस्तक्षेप करने का भाव देता है; ‘वहाँ पहुँचकर’ अगले बचाव-कार्य के साथ यह अर्थ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: σὺν τῷ στρατεύματι
  choice: सैनिकों के साथ
  rationale: στράτευμα एक सैन्य दल को सूचित करता है। ‘सैनिकों के साथ’ सहज हिंदी है और दल का आकार अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐξειλάμην
  choice: उसे बचा लिया
  rationale: यहाँ ἐξαιρέω का मध्यम रूप आसन्न खतरे से छुड़ाने या बचाने के अर्थ में है।
- source_word: μαθὼν
  choice: क्योंकि मुझे पता चला
  rationale: यह कृदन्त जान लेने की घटना को बचाव से जोड़ता है। ‘क्योंकि’ हिंदी में उस प्रेरक संबंध को स्वाभाविक रूप से व्यक्त करता है जिसे पत्र का लेखक प्रस्तुत करता है, बिना व्यापक कथानक से उसका सामंजस्य बैठाए।
- source_word: Ῥωμαῖός ἐστιν
  choice: वह रोमी है
  rationale: यह यूनानी पद का सीधा अनुवाद है। प्रसंग में रोमी नागरिकता निहित है, पर मुख्य पाठ में ‘नागरिक’ जोड़कर अर्थ को अधिक स्पष्ट नहीं किया गया।
theological_decisions:
- issue: सेनापति के पत्र का ऐतिहासिक-अलंकारिक प्रस्तुतीकरण
  choice: सेनापति के दावे को उसी के दृष्टिकोण से सीधे प्रस्तुत किया गया है।
  alternative: प्रेरितों 21–22 के विस्तृत वृत्तांत के अनुसार घटनाक्रम को स्पष्ट करने या दोनों विवरणों का सामंजस्य कराने वाला भावानुवाद।
  rationale: यह पद क्लौदियुस लूसियास के अपने पत्र की भाषा है, जिसमें वह अपने कार्य को अनुकूल रूप में प्रस्तुत करता है। अनुवाद को कथात्मक तनाव मिटाए बिना यूनानी कथन को बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली अपनाई गई है। यूनानी कृदन्त-शृंखला को स्वाभाविक हिंदी वाक्यों में बदला गया है, जबकि घटनाक्रम और कथात्मक तनाव सुरक्षित रखा गया है।
