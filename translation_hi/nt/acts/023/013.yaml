  yaml_path: translation/nt/acts/023/013.yaml
  text: There were more than forty who had formed this conspiracy[a].
translation:
  language: hi
  text: इस षड्यंत्र को रचने वाले चालीस से अधिक लोग थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείους τεσσεράκοντα
  choice: चालीस से अधिक
  rationale: तुलनात्मक πλείους के साथ संख्या τεσσεράκοντα का अर्थ स्वाभाविक रूप से ‘चालीस से अधिक’ है; यह परिमाण को स्पष्ट रखता है और यूनानी में न पाया जाने वाला कोई संज्ञा नहीं जोड़ता।
- source_word: συνωμοσίαν
  choice: षड्यंत्र
  rationale: συνωμοσία किसी गुप्त मिलीभगत या साज़िश को दर्शाता है। ‘षड्यंत्र’ आधुनिक मानक हिन्दी में सटीक और गरिमापूर्ण है; ‘शपथ-बद्ध षड्यंत्र’ निकटवर्ती संदर्भ की बात को इस शब्द में जोड़ देता।
- source_word: ποιησάμενοι
  choice: रचनेवाले
  rationale: ποιέω का अओरिस्ट मध्य कृदंत συνωμοσίαν के साथ षड्यंत्र ‘करने/रचने’ का भाव देता है। ‘षड्यंत्र रचना’ हिन्दी का स्वाभाविक संयोग है और कृदंत की विशेषणात्मक भूमिका को बनाए रखता है।
- source_word: ἦσαν δὲ
  choice: … लोग थे
  rationale: ἦσαν समूह के अस्तित्व और संख्या को बताता है। हिन्दी में वाक्य के अंत में ‘थे’ रखना स्वाभाविक है। हल्का संयोजक δέ प्रसंग के प्रवाह से स्पष्ट है, इसलिए अलग से ‘और’ या ‘अब’ जोड़ना आवश्यक नहीं।
- source_word: οἱ ταύτην τὴν συνωμοσίαν ποιησάμενοι
  choice: इस षड्यंत्र को रचनेवाले … लोग
  rationale: लेखयुक्त कृदंत का अर्थ ‘वे जिन्होंने यह षड्यंत्र रचा’ है। हिन्दी में ‘इस षड्यंत्र को रचनेवाले लोग’ उसी निर्देशात्मक अर्थ को सहज रूप से व्यक्त करता है।
