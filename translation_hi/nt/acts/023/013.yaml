  register: आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण शैली। ‘षड्यंत्र’ स्रोत के औपचारिक अर्थ को रखता है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्वाभाविक है। अंग्रेज़ी फुटनोट ‘over forty’ केवल अंग्रेज़ी शैलीगत विकल्प है; हिन्दी में उसका अलग अर्थपूर्ण विकल्प नहीं बनता, इसलिए फुटनोट नहीं रखा गया।
