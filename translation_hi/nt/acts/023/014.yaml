  text: οἵτινες προσελθόντες τοῖς ἀρχιερεῦσιν καὶ τοῖς πρεσβυτέροις εἶπαν· Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς μηδενὸς γεύσασθαι ἕως οὗ ἀποκτείνωμεν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/014.yaml
  text: These men came to the chief priests and the elders and said[a], “We have bound ourselves under a curse to taste nothing until we kill Paul.”
translation:
  language: hi
  text: वे प्रधान याजकों और बुज़ुर्गों के पास जाकर बोले[a], “हमने अपने आप को शाप के अधीन बाँध लिया है कि पौलुस को मार डालने तक हम कुछ भी न चखें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “हमने अपने आप को शाप के अधीन कर लिया है।” यूनानी वाक्यांश आत्म-अभिशाप वाली शपथ को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: वे
  rationale: यह संबंधवाचक सर्वनाम पिछले पद के षड्यंत्रकारियों की ओर संकेत करता है; हिन्दी में “वे” संदर्भ को स्वाभाविक रूप से आगे बढ़ाता है।
- source_word: προσελθόντες
  choice: पास जाकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया “बोले” से पहले की क्रिया बताता है; “पास जाकर” इसका स्वाभाविक कथात्मक रूप है।
- source_word: ἀρχιερεῦσιν
  choice: प्रधान याजकों
  rationale: द्वितीय-मंदिरकालीन यहूदी नेतृत्व के संदर्भ में यह प्रचलित और स्पष्ट बहुवचन पद है।
- source_word: πρεσβυτέροις
  choice: पुरनियों
  rationale: यहाँ शब्द केवल अधिक आयु वाले पुरुषों के लिए नहीं, बल्कि मान्य सामुदायिक अगुओं के पद के लिए प्रयुक्त है।
- source_word: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς
  choice: हमने अपने आप को शाप के अधीन बाँध लिया है
  rationale: संज्ञा और उसी मूल की क्रिया मिलकर आत्म-शापयुक्त गंभीर प्रतिज्ञा व्यक्त करती हैं; यह रूप उसकी कठोरता और आत्मबद्धता दोनों बनाए रखता है।
- source_word: μηδενὸς γεύσασθαι
  choice: कुछ भी न चखें
  rationale: “चखना” γεύομαι का निकट औपचारिक समतुल्य है और यहाँ किसी भी खाद्य पदार्थ को ग्रहण न करने का भाव देता है।
- source_word: ἕως οὗ
  choice: जब तक ... तब तक
  rationale: यह प्रतिज्ञा की समय-सीमा को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀποκτείνωμεν
  choice: हम ... मार न डालें
  rationale: अओरिस्ट सब्जंक्टिव भावी अपेक्षित घटना को दर्शाता है; “मार डालें” सीधा है और “हत्या” जैसा अतिरिक्त वैधानिक मूल्यांकन नहीं जोड़ता।
- source_word: τὸν Παῦλον
  choice: पौलुस
  rationale: Παῦλος नाम का हिन्दी बाइबलीय परंपरा में मान्य लिप्यंतरण।
theological_decisions:
- issue: Ἀναθέματι ἀνεθεματίσαμεν ἑαυτοὺς की शपथ-संरचना
  choice: हमने अपने आप को शाप के अधीन बाँध लिया है
  alternative: हमने अपने आप को शापित किया है / हमने कठोर शपथ खाई है
  rationale: मूल वाक्य आत्म-अभिशाप वाली प्रतिज्ञा व्यक्त करता है। चुना हुआ रूप केवल सामान्य शपथ कहकर उसकी गंभीरता घटाता नहीं और बाद की कलीसियाई पारिभाषिक धारणा भी आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। “पुरनियों” और “प्रधान याजकों” को संस्थागत यहूदी नेतृत्व के परिचित बाइबलीय पदों के रूप में रखा गया है; शपथ की आत्म-अभिशापात्मक तीव्रता स्पष्ट की गई है।
