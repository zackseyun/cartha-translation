  text: Οἱ μὲν οὖν στρατιῶται κατὰ τὸ διατεταγμένον αὐτοῖς ἀναλαβόντες τὸν Παῦλον ἤγαγον ⸀διὰ νυκτὸς εἰς τὴν Ἀντιπατρίδα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/031.yaml
  text: So the soldiers[a], according to what had been ordered them[b], took Paul and brought him by night to Antipatris.
translation:
  language: hi
  text: तब सैनिकों ने, जैसा उन्हें आदेश दिया गया था, पौलुस को अपने साथ लिया और रात के समय उसे अन्तिपत्रिस ले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ μὲν οὖν στρατιῶται
  choice: तब सैनिकों ने
  rationale: οὖν यहाँ कथा की अगली घटना की ओर बढ़ाता है, जबकि μέν अगले पद के साथ संरचनात्मक संबंध बनाता है; स्वाभाविक हिन्दी में μέν को अलग से व्यक्त किए बिना ‘तब’ कथा-प्रवाह को स्पष्ट करता है।
- source_word: κατὰ τὸ διατεταγμένον αὐτοῖς
  choice: जैसा उन्हें आदेश दिया गया था
  rationale: यह अनुवाद पूर्ण निष्क्रिय कृदन्त के पूर्व में दिए गए आदेश और उसके निष्क्रिय भाव—‘जो उन्हें आदेश दिया गया था’—दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: ἀναλαβόντες
  choice: अपने साथ लिया
  rationale: यह पूर्ववर्ती सहायक क्रिया पौलुस को साथ लेकर आगे जाने का भाव देती है; ‘अपने साथ लिया’ हिन्दी में स्वाभाविक है और केवल ‘पकड़ा’ जैसे अनावश्यक बलपूर्वक अर्थ से बचता है।
- source_word: ἤγαγον
  choice: ले गए
  rationale: ἄγω का अर्थ यहाँ किसी व्यक्ति को निर्दिष्ट गंतव्य तक ले जाना है। हिन्दी दृष्टिकोण से सैनिक पौलुस को वर्तमान स्थान से अन्तिपत्रिस ‘ले गए’।
- source_word: διὰ νυκτός
  choice: रात के समय
  rationale: διά के साथ संबंधकारक νυκτός रात के दौरान होने का समय बताता है; ‘रात के समय’ पूरी रात यात्रा चलने का अनावश्यक संकेत दिए बिना अर्थ स्पष्ट करता है।
- source_word: Ἀντιπατρίδα
  choice: अन्तिपत्रिस
  rationale: स्थान-नाम का देवनागरी में ऐसा लिप्यंतरण किया गया है जो यूनानी Ἀντιπατρίς के निकट है और हिन्दी में पढ़ने योग्य है।
