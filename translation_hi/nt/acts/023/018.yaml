  text: ὁ μὲν οὖν παραλαβὼν αὐτὸν ἤγαγεν πρὸς τὸν χιλίαρχον καὶ φησίν· Ὁ δέσμιος Παῦλος προσκαλεσάμενός με ἠρώτησεν τοῦτον τὸν ⸀νεανίαν ἀγαγεῖν πρὸς σέ, ἔχοντά τι λαλῆσαί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/018.yaml
  text: So he took him and brought him to the commander and said[a], “The prisoner Paul called me to him and asked me to bring this young man to you[b], because he has something to say to you.”
translation:
  language: hi
  text: तब वह उस युवक को साथ लेकर सेनानायक[a] के पास गया और बोला, “बंदी पौलुस ने मुझे अपने पास बुलाकर अनुरोध किया कि मैं इस युवक को आपके पास ले आऊँ, क्योंकि इसे आपसे कुछ कहना है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द χιλίαρχος रोमी सेना के एक उच्च अधिकारी का पद था; इसका शाब्दिक अर्थ लगभग ‘एक हज़ार सैनिकों का सेनापति’ है।
    reason: cultural_note
lexical_decisions:
- source_word: παραλαβὼν αὐτὸν
  choice: उस युवक को साथ लेकर
  rationale: παραλαμβάνω यहाँ युवक को अपने साथ ले जाकर अधिकारी तक पहुँचाने की सहायक क्रिया बताता है। ‘साथ लेकर’ आधुनिक हिन्दी में स्वाभाविक है और αὐτόν का संदर्भ स्पष्ट करता है।
- source_word: ἤγαγεν πρὸς τὸν χιλίαρχον
  choice: सेनानायक के पास गया
  rationale: ἄγω का भाव किसी को गंतव्य तक ले जाने का है। ‘उस युवक को साथ लेकर ... के पास गया’ हिन्दी में ‘ले गया’ की अनावश्यक पुनरावृत्ति से बचते हुए गति और गंतव्य दोनों व्यक्त करता है।
- source_word: χιλίαρχον
  choice: सेनानायक
  rationale: χιλίαρχος रोमी सेना के एक उच्च अधिकारी का पद था। ‘सेनानायक’ सामान्य पाठक के लिए स्पष्ट है; पद की ऐतिहासिक जानकारी पादटिप्पणी में दी गई है।
- source_word: φησίν
  choice: बोला
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथात्मक शैली में भूतकाल से प्रस्तुत करना स्वाभाविक है।
- source_word: Ὁ δέσμιος Παῦλος
  choice: बंदी पौलुस
  rationale: δέσμιος हिरासत या बंधन में रखे व्यक्ति को दर्शाता है। ‘बंदी’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: προσκαλεσάμενός με
  choice: मुझे अपने पास बुलाकर
  rationale: मध्यवाच्य कृदन्त यह स्पष्ट करता है कि पौलुस ने सैनिक को अपने पास बुलाया था।
- source_word: ἠρώτησεν
  choice: अनुरोध किया
  rationale: ἐρωτάω यहाँ प्रश्न पूछने के बजाय विनती या अनुरोध करने के अर्थ में है। ‘अनुरोध किया’ आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: νεανίαν
  choice: युवक
  rationale: νεανίας का अर्थ युवा पुरुष है। ‘युवक’ आधुनिक मानक हिन्दी में सहज और सम्मानजनक है।
- source_word: ἔχοντά τι λαλῆσαί σοι
  choice: क्योंकि इसे आपसे कुछ कहना है
  rationale: यह कृदन्तीय वाक्यांश युवक का वर्णन करता और उसे लाने के अनुरोध का कारण बताता है। हिन्दी में कारणसूचक उपवाक्य इसे स्वाभाविक रूप देता है।
