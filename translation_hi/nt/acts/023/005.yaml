source:
  edition: SBLGNT
  text: ἔφη τε ὁ Παῦλος· Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ⸀ὅτι Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/005.yaml
  text: And Paul said, “I did not know, brothers, that he is the high priest; for it is written, ‘You shall not speak evil of a ruler of your people.’”
translation:
  language: hi
  text: और पौलुस ने कहा, “भाइयो, मैं नहीं जानता था कि वह महायाजक है; क्योंकि लिखा है, ‘तुम अपनी प्रजा के किसी शासक को बुरा न कहो।’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम अपनी प्रजा के किसी शासक की निंदा न करो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε ὁ Παῦλος
  choice: तब पौलुस ने कहा
  rationale: τέ हल्का कथात्मक संयोजक है; ‘तब’ हिंदी में प्रसंग का स्वाभाविक प्रवाह बनाए रखता है, और ἔφη प्रत्यक्ष कथन का परिचय देता है।
- source_word: Οὐκ ᾔδειν
  choice: मैं नहीं जानता था
  rationale: यह ज्ञान के अभाव को सीधे और स्वाभाविक हिंदी में व्यक्त करता है; ‘पहचान नहीं पाया’ जैसी अधिक विशिष्ट व्याख्या नहीं जोड़ी गई।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: पुंलिंग संबोधन और महासभा के प्रसंग को यथार्थ रूप से रखता है।
- source_word: ὅτι ἐστὶν ἀρχιερεύς
  choice: कि वह महायाजक है
  rationale: ἐστίν के वर्तमान काल को ‘है’ के रूप में सुरक्षित रखा गया है; ‘महायाजक’ इस पद का प्रचलित और स्पष्ट हिंदी रूप है।
- source_word: γέγραπται γὰρ
  choice: क्योंकि लिखा है
  rationale: धर्मग्रंथ उद्धरण का परिचित सूत्र है और यूनानी पूर्ण कर्मवाच्य के स्थायी प्रामाणिक भाव को सहज हिंदी में व्यक्त करता है।
- source_word: Ἄρχοντα τοῦ λαοῦ σου
  choice: अपनी प्रजा के किसी शासक को
  rationale: ἄρχων के लिए ‘शासक’ उपयुक्त है; अनिर्दिष्ट, सामान्य निषेध को हिंदी में ‘किसी’ स्पष्ट करता है, और λαός के सामुदायिक भाव के लिए ‘प्रजा’ प्रसंगानुकूल है।
- source_word: οὐκ ἐρεῖς κακῶς
  choice: बुरा न कहो
  rationale: भविष्यकालीन रूप की आज्ञार्थक शक्ति को हिंदी निषेधात्मक आज्ञा में व्यक्त किया गया है और κακῶς की व्यापकता सुरक्षित है।
theological_decisions:
- issue: ἀδελφοί को समावेशी रूप में प्रस्तुत करना या व्याकरणिक पुंलिंग बनाए रखना
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: यहाँ पौलुस महासभा के पुरुष सदस्यों को संबोधित कर रहा है; इसलिए स्रोत और प्रसंग दोनों के अनुसार पुंलिंग संबोधन रखा गया है।
- issue: पौलुस के कथन में महायाजक के पद का काल
  choice: वह महायाजक है
  alternative: वह महायाजक था
  rationale: यूनानी पाठ में ἐστίν वर्तमान काल है। हिंदी में प्रत्यक्ष कथन के भीतर वर्तमान ‘है’ स्वाभाविक भी है और स्रोत का तनाव सुरक्षित रखता है।
- issue: निर्गमन 22:28 के उद्धरण में κακῶς की अभिव्यक्ति
  choice: बुरा न कहो
  alternative: निंदा न करो
  rationale: ‘बुरा न कहो’ मूल अभिव्यक्ति की व्यापकता बनाए रखता है; ‘निंदा’ अधिक संकीर्ण या तकनीकी अर्थ दे सकती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और पाठयोग्य शैली रखी गई है। उद्धरण की कानूनी-धार्मिक गंभीरता बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
