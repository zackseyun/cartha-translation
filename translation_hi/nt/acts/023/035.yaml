  text: Διακούσομαί σου, ἔφη, ὅταν καὶ οἱ κατήγοροί σου παραγένωνται· ⸀κελεύσας ἐν τῷ πραιτωρίῳ ⸀τοῦ Ἡρῴδου φυλάσσεσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/035.yaml
  text: “I will hear your case,” he said[b][a], “when your accusers also arrive.” And he ordered that he be kept under guard in Herod’s praetorium.
translation:
  language: hi
  text: उसने कहा, “जब तुम पर अभियोग लगानेवाले भी आ जाएँगे, तब मैं तुम्हारा मुकदमा सुनूँगा[a]।” फिर उसने आदेश दिया कि उसे हेरोदेस के प्रेटोरियम[b] में पहरे में रखा जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हारी पूरी बात सुनूँगा।” यूनानी क्रिया का अर्थ किसी की बात अंत तक या पूरी तरह सुनना हो सकता है; इस न्यायिक प्रसंग में इसका आशय मुकदमे की पूरी सुनवाई करना है।
    reason: lexical_alternative
  - marker: b
    text: “प्रेटोरियम” रोमी राज्यपाल के आधिकारिक निवास या मुख्यालय को कहा जाता था; यहाँ संभवतः कैसरिया में स्थित हेरोदेस का महल अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: Διακούσομαί σου
  choice: मैं तुम्हारा मुकदमा सुनूँगा
  rationale: διακούω में किसी की बात पूरी तरह सुनने का भाव हो सकता है। यहाँ न्यायिक प्रसंग में ‘मुकदमा सुनना’ स्वाभाविक हिन्दी है और क्रिया के कानूनी आशय को स्पष्ट करता है; ‘पूरी बात सुनूँगा’ को पादटिप्पणी में रखा गया है।
- source_word: ὅταν καὶ οἱ κατήγοροί σου παραγένωνται
  choice: जब तुम पर अभियोग लगानेवाले भी आ जाएँगे
  rationale: ὅταν के साथ संभावनार्थक क्रिया भविष्य की शर्त व्यक्त करती है। κατήγοροί कानूनी अर्थ में अभियोग लगानेवालों को और καί ‘भी’ को व्यक्त करता है।
- source_word: κελεύσας
  choice: फिर उसने आदेश दिया
  rationale: भूतकालिक कृदन्त को सहज हिन्दी कथन में क्रमसूचक मुख्य क्रिया के रूप में व्यक्त किया गया है।
- source_word: ἐν τῷ πραιτωρίῳ τοῦ Ἡρῴδου
  choice: हेरोदेस के प्रेटोरियम में
  rationale: πραιτώριον रोमी राज्यपाल के आधिकारिक निवास या मुख्यालय का प्रशासनिक शब्द है। ऐतिहासिक पद को लिप्यंतरित करके उसका अर्थ पादटिप्पणी में समझाया गया है।
- source_word: φυλάσσεσθαι αὐτόν
  choice: कि उसे ... पहरे में रखा जाए
  rationale: निष्क्रिय क्रिया यहाँ निगरानी में हिरासत को दर्शाती है। यह अनुवाद दंडात्मक कारावास का अतिरिक्त भाव जोड़े बिना निरंतर पहरे को स्पष्ट करता है।
