  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी अपनाई गई है। न्यायिक प्रसंग के लिए ‘अभियोग लगानेवाले’ और ‘मुकदमा सुनूँगा’ चुने गए हैं। ऐतिहासिक प्रशासनिक शब्द ‘प्रेटोरियम’ को सुरक्षित रखकर पादटिप्पणी में समझाया गया है।
