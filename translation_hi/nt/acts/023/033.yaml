  text: When they entered Caesarea and delivered the letter to the governor[b][a], they also presented Paul to him.
translation:
  language: hi
  text: कैसरिया में पहुँचकर उन्होंने राज्यपाल को पत्र सौंपा और पौलुस को भी उसके सामने पेश किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: वे
  rationale: यह सर्वनाम पिछले पद के घुड़सवारों की ओर संकेत करता है; हिन्दी में स्वतंत्र वाक्य के आरम्भ में ‘वे’ स्वाभाविक है।
- source_word: εἰσελθόντες εἰς τὴν Καισάρειαν
  choice: जब वे कैसरिया पहुँचे
  rationale: पूर्वकालिक कृदन्त को हिन्दी के स्वाभाविक कालवाचक उपवाक्य से व्यक्त किया गया है; नगर के संदर्भ में ‘पहुँचे’ सहज और अर्थसंगत है।
- source_word: ἀναδόντες τὴν ἐπιστολήν
  choice: पत्र सौंपा
  rationale: ἀναδίδωμι यहाँ अधिकारी को आधिकारिक पत्र देने का भाव रखता है; ‘सौंपा’ औपचारिक संदर्भ के अनुकूल है।
- source_word: τῷ ἡγεμόνι
  choice: राज्यपाल को
  rationale: ἡγεμών यहाँ रोमी प्रान्तीय शासक के पद को बताता है; आधुनिक हिन्दी में ‘राज्यपाल’ स्पष्ट और प्रचलित समतुल्य है।
- source_word: παρέστησαν καὶ τὸν Παῦλον αὐτῷ
  choice: पौलुस को भी उसके सामने उपस्थित किया
  rationale: παρίστημι कानूनी-प्रशासनिक संदर्भ में किसी व्यक्ति को अधिकारी के सामने पेश करने का भाव देता है; ‘भी’ दूसरे καί की योगात्मक शक्ति को व्यक्त करता है।
- source_word: Παῦλον
  choice: पौलुस
  rationale: Παῦλος का हिन्दी बाइबलीय परम्परा में मानक लिप्यंतरण ‘पौलुस’ है।
