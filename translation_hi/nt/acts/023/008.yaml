id: ACT.23.8
reference: Acts 23:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Σαδδουκαῖοι ⸀μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν ⸀μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/008.yaml
  text: For the Sadducees say there is no resurrection[a], nor angel nor spirit, but the Pharisees acknowledge both.
translation:
  language: hi
  text: क्योंकि सदूकी कहते हैं कि न पुनरुत्थान है, न स्वर्गदूत, न आत्मा; पर फरीसी इन दोनों[a] को मानते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फरीसी इन तीनों को मानते हैं”—अर्थात पुनरुत्थान, स्वर्गदूत और आत्मा। यूनानी पाठ में “दोनों” है, जो सबसे सीधे तौर पर “स्वर्गदूत” और “आत्मा” की ओर संकेत करता है; पर कुछ लोग प्रसंग के आधार पर इसे अधिक व्यापक अर्थ में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: Σαδδουκαῖοι
  choice: सदूकी
  rationale: यह यहूदी धार्मिक दल के नाम का हिन्दी में प्रचलित लिप्यंतरण है।
- source_word: μὲν γὰρ
  choice: क्योंकि
  rationale: यह संयोजन पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λέγουσιν
  choice: कहते हैं
  rationale: वर्तमान काल का सामान्य कथन सदूकियों की मान्यता बताता है।
- source_word: μὴ εἶναι
  choice: न ... है
  rationale: यूनानी अस्तित्ववाचक वाक्य को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἀνάστασιν
  choice: पुनरुत्थान
  rationale: यह मृतकों के फिर जी उठने की वास्तविकता या धारणा को सूचित करने वाला मानक बाइबलीय शब्द है।
- source_word: μήτε ἄγγελον μήτε πνεῦμα
  choice: न स्वर्गदूत, न आत्मा
  rationale: दोनों एकवचन संज्ञाओं और दोहरे निषेध को बनाए रखता है तथा ‘आत्मा’ की संभावित व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: Φαρισαῖοι
  choice: फरीसी
  rationale: यह इस यहूदी धार्मिक दल के नाम का हिन्दी में प्रचलित लिप्यंतरण है।
- source_word: ὁμολογοῦσιν
  choice: मानते हैं
  rationale: यहाँ क्रिया का अर्थ किसी बात को सत्य स्वीकार करना या उसकी पुष्टि करना है; ‘मानते हैं’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: τὰ ἀμφότερα
  choice: इन दोनों
  rationale: यूनानी शब्द का सीधा अर्थ ‘दोनों’ है और निकटतम युग्म ‘स्वर्गदूत’ तथा ‘आत्मा’ है; संकेतवाचक ‘इन’ हिन्दी में संदर्भ स्पष्ट करता है।
theological_decisions:
- issue: फरीसियों द्वारा मानी जाने वाली ‘दोनों’ बातों का दायरा
  choice: मुख्य पाठ में ‘इन दोनों’ रखा गया है, जिसका निकटतम संदर्भ स्वर्गदूत और आत्मा है।
  alternative: इसे पुनरुत्थान, स्वर्गदूत और आत्मा—तीनों—के व्यापक संदर्भ में समझना।
  rationale: यूनानी में τὰ ἀμφότερα अर्थात ‘दोनों’ है, ‘तीनों’ नहीं। इसलिए मुख्य पाठ मूल शब्दावली को सुरक्षित रखता है; फिर भी प्रसंग में फरीसियों की पुनरुत्थान-संबंधी मान्यता भी सम्मिलित समझी जा सकती है, अतः इस संभावना को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर निषेध ‘न ... न ... न ...’ मूल सूची की संक्षिप्तता बनाए रखता है, और अर्धविराम विरोधी कथन को स्पष्ट करता है।
