source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπιούσῃ νυκτὶ ἐπιστὰς αὐτῷ ὁ κύριος εἶπεν· ⸀Θάρσει, ὡς γὰρ διεμαρτύρω τὰ περὶ ἐμοῦ εἰς Ἰερουσαλὴμ οὕτω σε δεῖ καὶ εἰς Ῥώμην μαρτυρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/011.yaml
  text: But on the following night[a], the Lord stood by him and said, “Take courage, for just as you have testified about me in Jerusalem[b], so you must also testify in Rome.”
translation:
  language: hi
  text: लेकिन अगली रात प्रभु उसके पास आ खड़े हुए और कहा, “हिम्मत रखो! क्योंकि जैसे तुमने यरूशलेम में मेरे विषय में गवाही दी है, वैसे ही तुम्हें रोम में भी गवाही देनी है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ δὲ ἐπιούσῃ νυκτί
  choice: लेकिन अगली रात
  rationale: ἐπιούσῃ νυκτί अगली रात को सूचित करता है। δέ को हल्के कथात्मक मोड़ के रूप में ‘लेकिन’ से व्यक्त किया गया है।
- source_word: ἐπιστὰς αὐτῷ
  choice: उसके पास आ खड़े हुए
  rationale: ἐφίστημι यहाँ निकट आकर खड़े होने का भाव देता है; यह ‘दिखाई दिए’ की अपेक्षा प्रभु की निकट और सहायक उपस्थिति को अधिक सीधे रूप में रखता है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: मूल पाठ की उपाधि को बिना ‘यीशु’ जोड़कर ज्यों का त्यों रखा गया है; हिन्दी में ‘प्रभु’ स्वाभाविक है।
- source_word: Θάρσει
  choice: हिम्मत रख
  rationale: वर्तमान आज्ञार्थक प्रोत्साहन देता है। ‘हिम्मत रख’ आधुनिक, सहज और गरिमापूर्ण हिन्दी है।
- source_word: διεμαρτύρω
  choice: तूने ... गवाही दी है
  rationale: क्रिया का अर्थ साक्ष्य देना या दृढ़तापूर्वक गवाही देना है। ‘गवाही दी है’ पूर्ण हो चुके यरूशलेम के साक्ष्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ περὶ ἐμοῦ
  choice: मेरे विषय में
  rationale: यह यीशु से संबंधित बातों को दर्शाता है; ‘मेरे विषय में’ स्पष्ट और गरिमापूर्ण है।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: नगर के साथ εἰς यहाँ उस स्थान को दर्शाता है जहाँ गवाही दी गई; हिन्दी में ‘में’ स्वाभाविक है।
- source_word: οὕτω
  choice: वैसे ही
  rationale: यह यरूशलेम में दी गई गवाही और रोम में दी जाने वाली गवाही के बीच समानता को स्पष्ट करता है।
- source_word: σε δεῖ
  choice: तुझे ... देनी है
  rationale: यह आवश्यकताबोधक संरचना हिन्दी में स्वाभाविक रूप से बाध्यता व्यक्त करती है, पर भाग्यवाद का अतिरिक्त अर्थ नहीं जोड़ती।
- source_word: καὶ εἰς Ῥώμην
  choice: रोम में भी
  rationale: καί रोम को गवाही के अगले स्थान के रूप में जोड़ता है; ‘भी’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: μαρτυρῆσαι
  choice: गवाही देनी
  rationale: ‘गवाही’ दोनों यूनानी साक्ष्य-संबंधी क्रियाओं का संबंध हिन्दी में भी बनाए रखती है।
theological_decisions:
- issue: ὁ κύριος की पहचान
  choice: ‘प्रभु’
  alternative: ‘प्रभु यीशु’
  rationale: संदर्भ में वक्ता पुनरुत्थित यीशु हैं, पर यूनानी पाठ केवल ‘प्रभु’ कहता है। इसलिए अनुवाद पहचान को स्पष्ट करने के लिए कोई अतिरिक्त नाम नहीं जोड़ता।
- issue: δεῖ का बल
  choice: ‘तुझे ... देनी है’
  alternative: ‘तेरे लिए ... आवश्यक है’ अथवा ‘तेरा ... देना नियत है’
  rationale: यह ईश्वरीय आवश्यकता को स्वाभाविक हिन्दी में व्यक्त करता है, लेकिन उसे भाग्य या पूर्वनियति की अधिक प्रबल व्याख्या में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है। प्रभु के सीधे संबोधन में एकवचन ‘तू/तुझे’ आत्मीय और प्रसंगानुकूल है। वाक्य गरिमापूर्ण रखा गया है, जबकि ‘हिम्मत रख’ साधारण पाठकों के लिए सहज है।
