base_translation:
  language: en
  yaml_path: translation/nt/acts/023/002.yaml
  text: But the high priest Ananias ordered those standing by him to strike him on the mouth[a].
translation:
  language: hi
  text: परन्तु महायाजक हनन्याह ने अपने पास खड़े लोगों को आदेश दिया कि वे पौलुस के मुँह पर मारें[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पौलुस के मुँह पर थप्पड़ मारें।” यूनानी क्रिया सामान्य रूप से किसी को मारने या प्रहार करने के अर्थ में आ सकती है; “थप्पड़ मारें” यहाँ संभव, पर अधिक विशिष्ट अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: परन्तु
  rationale: यह हल्के विरोध और कथा में तत्काल प्रतिक्रिया को व्यक्त करता है; पौलुस के पिछले कथन के बाद आए तीखे प्रत्युत्तर को स्वाभाविक रूप से जोड़ता है।
- source_word: ἀρχιερεὺς
  choice: महायाजक
  rationale: इस पद के लिए प्रचलित, सटीक और सामान्य हिन्दी पर्याय।
- source_word: Ἁνανίας
  choice: हनन्याह
  rationale: व्यक्तिनाम को हिन्दी बाइबलीय परंपरा और स्रोत के उच्चारण के अनुरूप लिप्यंतरित किया गया है।
- source_word: ἐπέταξεν
  choice: आदेश दिया
  rationale: क्रिया अधिकारपूर्वक आज्ञा देने का भाव रखती है; यह आधुनिक हिन्दी में स्वाभाविक है और पदाधिकारी के अधिकार को बनाए रखती है।
- source_word: τοῖς παρεστῶσιν αὐτῷ
  choice: अपने पास खड़े लोगों को
  rationale: यह उन व्यक्तियों को दर्शाता है जो हनन्याह के निकट उपस्थित थे; स्थानगत अर्थ को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: τύπτειν
  choice: मारें
  rationale: यूनानी क्रिया सामान्य रूप से प्रहार करने को दर्शाती है और प्रहार का विशेष ढंग निश्चित नहीं करती; ‘मारें’ साधारण आधुनिक हिन्दी में उसी व्यापकता को बनाए रखता है।
- source_word: αὐτοῦ τὸ στόμα
  choice: पौलुस के मुँह पर
  rationale: यूनानी में सर्वनाम का संकेत प्रसंगानुसार पौलुस की ओर है। हिन्दी में संभावित सर्वनाम-संदेह दूर करने के लिए नाम दोहराया गया है और प्रहार के लक्ष्य को मुहावरेदार ढंग से व्यक्त किया गया है।
