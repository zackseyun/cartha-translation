id: ACT.23.10
reference: Acts 23:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πολλῆς δὲ ⸀γινομένης στάσεως ⸀φοβηθεὶς ὁ χιλίαρχος μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν ἐκέλευσεν τὸ στράτευμα ⸀καταβὰν ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν, ἄγειν ⸀τε εἰς τὴν παρεμβολήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/010.yaml
  text: And when a great dispute arose[a], the commander, fearing that Paul might be torn apart by them, ordered the troops to go down, seize him from among them[c][b], and bring him into the barracks.
translation:
  language: hi
  text: जब बहुत बड़ा हंगामा होने लगा,[a] तो सेनापति को डर हुआ कि कहीं वे पौलुस के टुकड़े-टुकड़े न कर डालें। इसलिए उसने सैनिकों को आज्ञा दी कि वे नीचे उतरें, पौलुस को उनके बीच से बलपूर्वक निकाल लें और छावनी में ले जाएँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हंगामा’ के स्थान पर ‘भारी फूट’, ‘तीखा विवाद’ या ‘उपद्रव’ भी अनुवाद हो सकता है। यूनानी शब्द στάσις तीखे आंतरिक संघर्ष और कभी-कभी नागरिक अशांति को भी सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘छावनी’ से आशय यरूशलेम में रोमी सैनिकों के किलेबंद निवास से है; यूनानी शब्द का अधिक शाब्दिक अर्थ ‘सैन्य शिविर’ भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: πολλῆς ... γινομένης στάσεως
  choice: जब बहुत बड़ा हंगामा होने लगा
  rationale: जनन-संबंधी स्वतंत्र वाक्यांश परिस्थिति बताता है। στάσις तीखा विवाद, फूट या उपद्रव सूचित कर सकता है; प्रसंग में बहस हिंसक रूप ले रही है, इसलिए ‘हंगामा’ स्वाभाविक है और πολλῆς का बल ‘बहुत बड़ा’ से बना रहता है।
- source_word: φοβηθεὶς ὁ χιλίαρχος
  choice: सेनापति को डर हुआ
  rationale: φοβηθεὶς आगामी आदेश का कारण बताता है। χιλίαρχος रोमी सैन्य अधिकारी है; सामान्य पाठक के लिए ‘सेनापति’ स्पष्ट और गरिमापूर्ण है।
- source_word: μὴ διασπασθῇ ὁ Παῦλος ὑπ’ αὐτῶν
  choice: कहीं वे पौलुस के टुकड़े-टुकड़े न कर डालें
  rationale: μή के साथ संभावित भय को ‘कहीं ... न’ से व्यक्त किया गया है। διασπάω की अत्यंत सजीव और हिंसक शक्ति ‘टुकड़े-टुकड़े’ में सुरक्षित रहती है।
- source_word: ἐκέλευσεν τὸ στράτευμα
  choice: उसने सैनिकों को आज्ञा दी
  rationale: सैन्य प्रसंग में ἐκέλευσεν के लिए ‘आज्ञा दी’ और सामूहिक στράτευμα के लिए सहज हिंदी ‘सैनिकों’ उपयुक्त है।
- source_word: καταβὰν
  choice: नीचे उतरें
  rationale: किले/छावनी से नीचे सभा की ओर स्थानिक गति को सीधे व्यक्त करता है।
- source_word: ἁρπάσαι αὐτὸν ἐκ μέσου αὐτῶν
  choice: पौलुस को उनके बीच से बलपूर्वक निकाल लें
  rationale: ἁρπάζω बलपूर्वक पकड़कर या झपटकर निकालने का भाव रखता है। ‘बलपूर्वक निकाल लें’ सैनिकों के उद्धारात्मक हस्तक्षेप को स्पष्ट करता है, बिना इसे केवल गिरफ्तारी बना देने के।
- source_word: ἄγειν τε εἰς τὴν παρεμβολήν
  choice: और छावनी में ले जाएँ
  rationale: ἄγω को गंतव्य सहित स्वाभाविक हिंदी में ‘ले जाएँ’ कहा गया है। παρεμβολή मूलतः शिविर/सैन्य ठिकाना है और यहाँ यरूशलेम के रोमी सैनिक-निवास को सूचित करता है।
theological_decisions: []
