  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण शैली। हिंसक दृश्य की तीव्रता बनाए रखी गई है। ‘सेनापति’ और ‘छावनी’ सामान्य पाठक के लिए सुलभ हैं; आवश्यक ऐतिहासिक सूक्ष्मता पादटिप्पणी में दी गई है।
