id: ACT.23.9
reference: Acts 23:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐγένετο δὲ κραυγὴ μεγάλη, καὶ ἀναστάντες ⸂τινὲς τῶν γραμματέων⸃ τοῦ μέρους τῶν Φαρισαίων διεμάχοντο λέγοντες· Οὐδὲν κακὸν εὑρίσκομεν ἐν τῷ ἀνθρώπῳ τούτῳ· εἰ δὲ πνεῦμα ἐλάλησεν αὐτῷ ἢ ⸀ἄγγελος—
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/009.yaml
  text: Then a great outcry arose[a], and some of the scribes of the party of the Pharisees stood up and contended, saying, “We find nothing wrong in this man[b]. But if a spirit or an angel has spoken to him—”
translation:
  language: hi
  text: तब बड़ा कोलाहल मच गया। फरीसियों के दल के कुछ शास्त्री उठ खड़े हुए और ज़ोरदार बहस करते हुए कहने लगे, “हमें इस आदमी में कोई दोष नहीं मिलता। पर यदि किसी आत्मा[a] ने या किसी स्वर्गदूत ने उससे बात की हो—”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘आत्मा’ का अर्थ सामान्य रूप से कोई आत्मिक सत्ता भी हो सकता है। कुछ पाठक इसे ‘पवित्र आत्मा’ समझते हैं, पर ‘स्वर्गदूत’ के साथ इसका प्रयोग सामान्य अर्थ के पक्ष में है।
    reason: alternative_reading
  - marker: b
    text: यूनानी पाठ में यह वाक्य अचानक अधूरा रह जाता है।
    reason: textual_feature
lexical_decisions:
- source_word: κραυγὴ μεγάλη
  choice: बड़ा कोलाहल
  rationale: यह पद ऊँची सामूहिक पुकार, शोर या हंगामे को दर्शाता है; ‘बड़ा कोलाहल’ संज्ञा और तीव्रता दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἀναστάντες
  choice: उठ खड़े हुए
  rationale: यह सभा में बोलने के लिए शारीरिक रूप से खड़े होने की क्रिया को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τινὲς τῶν γραμματέων
  choice: कुछ शास्त्री
  rationale: यहूदी धार्मिक-कानूनी संदर्भ में γραμματεῖς के लिए ‘शास्त्री’ प्रचलित, संक्षिप्त और सटीक पद है।
- source_word: τοῦ μέρους τῶν Φαρισαίων
  choice: फरीसियों के दल के
  rationale: μέρος यहाँ महासभा के भीतर पक्ष या गुट को सूचित करता है; ‘दल’ इस संबद्धता को साफ़ रखता है।
- source_word: διεμάχοντο
  choice: ज़ोरदार बहस करते हुए
  rationale: क्रिया लगातार और तीखे विवाद का बोध कराती है; यह चयन उसकी तीव्रता और अपूर्णकालीन प्रवाह दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: Οὐδὲν κακὸν εὑρίσκομεν
  choice: हमें ... कोई दोष नहीं मिलता
  rationale: न्यायिक प्रसंग में κακόν किसी बुराई, गलती या दोषारोपण योग्य बात को दर्शाता है; ‘कोई दोष नहीं मिलता’ स्वाभाविक और संदर्भानुकूल है।
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: इस आदमी में
  rationale: यह पौलुस की ओर सीधे संकेत करता है; ‘इस आदमी में’ आधुनिक सामान्य हिन्दी में मूल अभिव्यक्ति की सीधाई बनाए रखता है।
- source_word: εἰ δὲ
  choice: पर यदि
  rationale: यह अधिक औपचारिक रूप से शर्तसूचक आरम्भ को रखता है और यूनानी के अधूरे वाक्य को बिना पूरा किए प्रस्तुत करने देता है।
- source_word: πνεῦμα
  choice: किसी आत्मा
  rationale: ἄγγελος के साथ विकल्प के रूप में आने के कारण यहाँ सामान्य आत्मिक सत्ता का अर्थ सबसे स्वाभाविक है; ‘किसी’ अनिश्चितता को बनाए रखता है।
- source_word: ἐλάλησεν αὐτῷ
  choice: ने उससे बात की हो
  rationale: यह सम्भावित पूर्ण घटना और उसकी वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी शर्तसूचक रूप में व्यक्त करता है।
- source_word: ἄγγελος
  choice: किसी स्वर्गदूत
  rationale: अलौकिक संदर्भ में ἄγγελος मानव संदेशवाहक नहीं, स्वर्गदूत को दर्शाता है।
theological_decisions:
- issue: ἄγγελος के विपरीत πνεῦμα का अर्थ
  choice: किसी आत्मा, अर्थात सामान्य रूप से कोई आत्मिक सत्ता
  alternative: पवित्र आत्मा
  rationale: ‘आत्मा या स्वर्गदूत’ का निकट संबंध फरीसियों द्वारा मानी जाने वाली आत्मिक सत्ताओं की श्रेणियों की ओर संकेत करता है। पाठ किसी विशिष्ट पहचान की पुष्टि नहीं करता, इसलिए अनिश्चितता सुरक्षित रखी गई है।
- issue: अंतिम शर्तसूचक वाक्य का अधूरापन
  choice: वाक्य को दीर्घ डैश के साथ अधूरा रखा गया
  alternative: निहित निष्कर्ष जोड़कर इसे पूर्ण प्रश्न बनाना
  rationale: यूनानी पाठ ‘पर यदि किसी आत्मा ने उससे बात की हो या किसी स्वर्गदूत ने—’ पर अचानक रुक जाता है। कोई निष्कर्ष जोड़ना मूल की अलंकारिक और कथात्मक अस्पष्टता को कम कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठकों के लिए सहज किंतु गरिमापूर्ण रखी गई है। ‘शास्त्री’, ‘फरीसी’ और ‘स्वर्गदूत’ जैसे स्थापित बाइबलीय पद बनाए गए हैं; वाक्य के आकस्मिक अधूरेपन को मूल के अनुसार सुरक्षित रखा गया है।
