  text: ὁ μὲν οὖν χιλίαρχος ἀπέλυσε τὸν ⸀νεανίσκον παραγγείλας μηδενὶ ἐκλαλῆσαι ὅτι ταῦτα ἐνεφάνισας πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/022.yaml
  text: So the commander dismissed the young man[a], instructing him, “Tell no one that you have reported these things to me.”
translation:
  language: hi
  text: तब सेनापति ने उस युवक को यह निर्देश देकर विदा किया, “किसी से मत कहना कि तुमने मुझे इन बातों की सूचना दी है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιλίαρχος
  choice: सेनापति
  rationale: यह रोमी सैन्य अधिकारी के लिए प्रयुक्त पद है। ‘सेनापति’ आधुनिक हिन्दी में उसके अधिकार और सैन्य भूमिका को स्पष्ट करता है, बिना अत्यधिक तकनीकी पदनाम अपनाए।
- source_word: ἀπέλυσε
  choice: विदा किया
  rationale: सन्दर्भ में अधिकारी भेंट समाप्त करके युवक को जाने देता है; ‘विदा किया’ स्वाभाविक है और हिरासत से रिहाई का अनावश्यक संकेत नहीं देता।
- source_word: νεανίσκον
  choice: युवक
  rationale: यह शब्द अपेक्षाकृत कम आयु के पुरुष को दर्शाता है; ‘युवक’ सम्मानजनक और सहज आधुनिक हिन्दी है।
- source_word: παραγγείλας
  choice: यह निर्देश देकर
  rationale: कृदन्त एक अधिकारपूर्ण निर्देश दिए जाने को व्यक्त करता है। ‘निर्देश देकर’ आदेश की शक्ति बनाए रखता है, पर अनावश्यक कठोरता नहीं जोड़ता।
- source_word: μηδενὶ ἐκλαλῆσαι
  choice: किसी से मत कहना
  rationale: यह किसी भी व्यक्ति के सामने बात प्रकट न करने का निषेध है; यह हिन्दी में संक्षिप्त और स्वाभाविक अभिव्यक्ति है।
- source_word: ἐνεφάνισας
  choice: सूचना दी है
  rationale: क्रिया किसी बात को, विशेषकर किसी अधिकारी के सामने, ज्ञात कराने या सूचित करने का अर्थ देती है। ‘सूचना दी है’ इस सन्दर्भ में स्वाभाविक है।
- source_word: ταῦτα
  choice: इन बातों
  rationale: बहुवचन संकेतवाचक अभी-अभी दी गई जानकारी की विभिन्न बातों की ओर संकेत करता है; ‘इन बातों’ बहुवचन को सुरक्षित रखता है।
- source_word: πρὸς ἐμέ
  choice: मुझे
  rationale: सूचित करने की क्रिया के साथ πρός दिशा या प्राप्तकर्ता को दर्शाता है; हिन्दी में ‘मुझे’ इसका सहज रूप है।
theological_decisions: []
