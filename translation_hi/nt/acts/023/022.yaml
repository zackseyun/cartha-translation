  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वाक्य में अधिकारी की औपचारिक भूमिका और उसके गोपनीयता-संबंधी निर्देश दोनों सहज हिन्दी में व्यक्त हैं।
