  text: Καὶ προσκαλεσάμενός ⸂τινας δύο⸃ τῶν ἑκατονταρχῶν εἶπεν· Ἑτοιμάσατε στρατιώτας διακοσίους ὅπως πορευθῶσιν ἕως Καισαρείας, καὶ ἱππεῖς ἑβδομήκοντα καὶ δεξιολάβους διακοσίους, ἀπὸ τρίτης ὥρας τῆς νυκτός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/023.yaml
  text: And calling two of the centurions to him[a], he said, “Prepare two hundred soldiers to go as far as Caesarea, and seventy horsemen and two hundred spearmen[b], at the third hour of the night.”
translation:
  language: hi
  text: उसने दो शतपतियों को अपने पास बुलाकर कहा, “दो सौ सैनिक, सत्तर घुड़सवार और दो सौ भालाधारी[a] तैयार करो, ताकि वे रात के तीसरे घंटे में[b] कैसरिया तक जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाहिने हाथ के रक्षक”; “भालाधारी” अनूदित दुर्लभ यूनानी शब्द का सटीक अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात रात होने के लगभग तीन घंटे बाद, करीब रात नौ बजे।
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενός
  choice: अपने पास बुलाकर
  rationale: मध्यवाच्य कृदन्त का स्वाभाविक हिन्दी रूप; किसी को अपनी उपस्थिति में बुलाने का भाव स्पष्ट करता है।
- source_word: τινας δύο τῶν ἑκατονταρχῶν
  choice: दो सूबेदारों
  rationale: τινας δύο का स्वाभाविक अर्थ केवल ‘दो’ है। ἑκατοντάρχης रोमी शताधिकारी पद है; ‘सूबेदार’ हिन्दी पाठकों के लिए परिचित सैन्य पदनाम है, यद्यपि पूर्ण ऐतिहासिक समतुल्य नहीं।
- source_word: Ἑτοιμάσατε
  choice: तैयार करो
  rationale: बहुवचन सैन्य आदेश का सीधा और वर्तमान हिन्दी में स्वाभाविक रूप।
- source_word: στρατιώτας διακοσίους
  choice: दो सौ पैदल सैनिक
  rationale: यह दल घुड़सवारों और δεξιολάβοι से अलग है; प्रसंग में ‘पैदल’ जोड़ने से सैन्य दलों का भेद स्पष्ट होता है।
- source_word: ὅπως πορευθῶσιν
  choice: ताकि वे ... जाएँ
  rationale: ὅπως के साथ विधिलिंग का प्रयोजनार्थक बल सुरक्षित रखा गया है।
- source_word: ἕως Καισαρείας
  choice: कैसरिया तक
  rationale: ἕως के स्थानगत सीमा-बोध को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἱππεῖς ἑβδομήκοντα
  choice: सत्तर घुड़सवार
  rationale: सवार सैन्य दल के लिए स्पष्ट और प्रचलित हिन्दी शब्द।
- source_word: δεξιολάβους διακοσίους
  choice: दो सौ भालाधारी
  rationale: दुर्लभ सैन्य पद का सटीक अर्थ अनिश्चित है। ‘भालाधारी’ सम्भावित सैन्य भूमिका को सहज ढंग से व्यक्त करता है; अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: ἀπὸ τρίτης ὥρας τῆς νυκτός
  choice: रात के तीसरे पहर
  rationale: प्रस्थान आरम्भ होने का समय बताता है। यहाँ ‘पहर’ पठनीय है, पर आधुनिक हिन्दी में ‘पहर’ प्रायः तीन घंटे की अवधि भी समझा जा सकता है; इसलिए पादटिप्पणी में लगभग रात नौ बजे स्पष्ट किया गया है।
