source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν· Τύπτειν σε μέλλει ὁ θεός, τοῖχε κεκονιαμένε· καὶ σὺ κάθῃ κρίνων με κατὰ τὸν νόμον, καὶ παρανομῶν κελεύεις με τύπτεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/003.yaml
  text: Then Paul said to him[a], “God is about to strike you, you whitewashed wall! And do you sit judging me according to the law, and yet in violation of the law command me to be struck?”
translation:
  language: hi
  text: तब पौलुस ने उससे कहा, “परमेश्वर तुझे मारने ही वाला है[a], हे सफेदी पुती दीवार! क्या तू व्यवस्था के अनुसार मेरा न्याय करने बैठा है, और व्यवस्था का उल्लंघन करके मुझे पिटवाने का आदेश देता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “परमेश्वर तुझे मारेगा।” यूनानी में शाब्दिक रूप से, “परमेश्वर तुझे मारने ही वाला है,” जो आसन्नता पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τύπτειν σε μέλλει ὁ θεός
  choice: परमेश्वर तुझे मारने ही वाला है
  rationale: μέλλει + infinitive आसन्न या निकट भविष्य की क्रिया व्यक्त करता है। ‘मारने ही वाला है’ उस आसन्नता को सहज हिन्दी में बनाए रखता है; τύπτειν के लिए ‘मारने’ से प्रहार का अर्थ स्पष्ट होता है।
- source_word: τοῖχε κεκονιαμένε
  choice: हे पुती हुई दीवार
  rationale: κεκονιαμένε चूने या पलस्तर से पुती हुई दीवार का चित्र प्रस्तुत करता है। ‘पुती हुई दीवार’ रूपक को सीधे और स्वाभाविक ढंग से सुरक्षित रखता है, बिना उसके निहित नैतिक अर्थ को मुख्य पाठ में व्याख्या बनाकर जोड़ने के।
- source_word: κάθῃ
  choice: बैठा है
  rationale: ठोस क्रिया ‘बैठना’ को बनाए रखने से न्यायासन पर बैठे व्यक्ति के प्रति प्रश्न की तीक्ष्णता सुरक्षित रहती है।
- source_word: κρίνων με κατὰ τὸν νόμον
  choice: व्यवस्था के अनुसार मेरा न्याय करने
  rationale: κατὰ τὸν νόμον कानूनी मानदंड के अनुरूप न्याय करने का भाव देता है। ‘व्यवस्था के अनुसार’ सटीक और प्रतिष्ठित हिन्दी है।
- source_word: παρανομῶν
  choice: व्यवस्था का उल्लंघन करके
  rationale: यह व्यवस्था के विपरीत आचरण को व्यक्त करता है और ‘व्यवस्था के अनुसार’ के साथ जानबूझकर रखा गया विरोध स्पष्ट बनाए रखता है।
- source_word: κελεύεις με τύπτεσθαι
  choice: मुझे मारने की आज्ञा देता है
  rationale: 'κελεύεις की अधिकारपूर्ण आज्ञा और τύπτεσθαι का कर्मवाच्य आशय हिन्दी में स्वाभाविक रूप से व्यक्त होता है: आज्ञा व्यक्ति को मारने की है, स्वयं मारने की नहीं।'
- source_word: τότε ὁ Παῦλος πρὸς αὐτὸν εἶπεν
  choice: तब पौलुस ने उससे कहा
  rationale: यह बिना अनावश्यक विस्तार के यूनानी कथात्मक भूमिका का सीधा और स्वाभाविक अनुवाद है।
theological_decisions:
- issue: ‘परमेश्वर तुझे मारने ही वाला है’ कथन का स्वरूप
  choice: इसे आने वाले दैवी प्रहार की घोषणात्मक बात के रूप में रखा गया है।
  alternative: 'इच्छा या शाप के रूप में: ‘परमेश्वर तुझे मारे।’'
  rationale: μέλλει + infinitive सामान्यतः आसन्न क्रिया का कथन करता है, इच्छा का नहीं। अनुवाद पौलुस के कथन की नैतिक उचितता पर निर्णय दिए बिना उसकी तीव्रता और धार्मिक तनाव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु तीखा न्यायिक और वादात्मक स्वर रखा गया है। ‘व्यवस्था’ प्रेरितों के काम के यहूदी कानूनी संदर्भ के अनुकूल है। संबोधन में ‘तू/तुझे’ मूल की कठोर फटकार को व्यक्त करता है।
