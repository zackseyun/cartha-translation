  to: तब पौलुस ने उससे कहा, “परमेश्वर तुझे मारने ही वाला है[a], हे सफेदी पुती दीवार! क्या तू व्यवस्था के अनुसार मेरा न्याय करने बैठा है, और व्यवस्था का उल्लंघन करके मुझे पिटवाने का आदेश देता है?”
