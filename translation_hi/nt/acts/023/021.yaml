  text: σὺ οὖν μὴ πεισθῇς αὐτοῖς, ἐνεδρεύουσιν γὰρ αὐτὸν ἐξ αὐτῶν ἄνδρες πλείους τεσσεράκοντα, οἵτινες ἀνεθεμάτισαν ἑαυτοὺς μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀνέλωσιν αὐτόν, καὶ νῦν ⸂εἰσιν ἕτοιμοι⸃ προσδεχόμενοι τὴν ἀπὸ σοῦ ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/021.yaml
  text: So do not be persuaded by them, for more than forty men from among them are lying in ambush for him, who have bound themselves under a curse neither to eat nor to drink until they have killed him. And now they are ready, waiting for the promise from you.
translation:
  language: hi
  text: इसलिए तुम उनकी बातों में मत आना, क्योंकि उनमें से चालीस से अधिक पुरुष उस पर घात लगाए बैठे हैं। उन्होंने अपने आप को शाप के बंधन में बाँध लिया है[a] कि जब तक वे उसे मार न डालें, तब तक न कुछ खाएँगे, न पिएँगे। अब वे तैयार हैं और तुम्हारे आश्वासन[b] की प्रतीक्षा कर रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने शपथ खाई है”; यूनानी अभिव्यक्ति में यह भाव भी है कि शपथ पूरी न करने पर वे अपने ऊपर शाप बुला रहे थे।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तुम्हारी ओर से प्रतिज्ञा”; यहाँ आशय तुम्हारी सहमति या अनुमति से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθῇς
  choice: उनकी बातों में मत आना
  rationale: निष्क्रिय निषेधात्मक क्रिया का प्रसंगानुकूल, स्वाभाविक हिन्दी रूप; इसका आशय उनके अनुरोध से प्रभावित होकर सहमत न होना है।
- source_word: ἐνεδρεύουσιν
  choice: घात लगाए बैठे हैं
  rationale: घात लगाकर प्रतीक्षा करने की ठोस और शत्रुतापूर्ण छवि को सुरक्षित रखता है।
- source_word: ἐξ αὐτῶν
  choice: उनमें से
  rationale: स्पष्ट करता है कि ये पुरुष अभी उल्लिखित समूह में से हैं।
- source_word: ἄνδρες πλείους τεσσεράκοντα
  choice: चालीस से अधिक पुरुष
  rationale: संख्या और तुलनात्मक बल का सीधा, स्वाभाविक हिन्दी अनुवाद।
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: अपने आपको शाप के अधीन बाँध लिया है
  rationale: ऐसी शपथ का भाव रखता है जिसमें विफल होने पर व्यक्ति अपने ऊपर शाप बुलाता है; केवल ‘शपथ खाई’ कहने की अपेक्षा मूल अभिव्यक्ति का शाप-संबंधी तत्व भी बचता है।
- source_word: μήτε φαγεῖν μήτε πιεῖν
  choice: न कुछ खाएँगे, न पिएँगे
  rationale: दोनों निषेधों की समांतर संरचना बनाए रखते हुए मुहावरेदार हिन्दी देता है।
- source_word: ἕως οὗ ἀνέλωσιν αὐτόν
  choice: जब तक वे उसे मार न डालें
  rationale: यहाँ ἀναιρέω हिंसक रीति से प्राण लेने को व्यक्त करता है; ‘मार डालें’ हत्या के इरादे को स्पष्ट और सटीक रखता है।
- source_word: εἰσιν ἕτοιμοι
  choice: वे तैयार हैं
  rationale: विशेषण सहित क्रिया का सीधा और स्वाभाविक रूप।
- source_word: προσδεχόμενοι
  choice: प्रतीक्षा कर रहे हैं
  rationale: अपेक्षापूर्ण प्रतीक्षा का भाव व्यक्त करता है।
- source_word: τὴν ἀπὸ σοῦ ἐπαγγελίαν
  choice: तुम्हारी स्वीकृति
  rationale: ἐπαγγελία का सामान्य अर्थ ‘प्रतिज्ञा/आश्वासन’ है, पर इस प्रसंग में सेनापति की सहमति या अनुमति अभिप्रेत है; मुख्य पाठ में ‘स्वीकृति’ हिन्दी में अपेक्षित आशय को स्वाभाविक रूप से व्यक्त करती है और पादटिप्पणी मूल शब्दार्थ बताती है।
