  yaml_path: translation/nt/acts/023/004.yaml
  text: Those standing nearby said[a], “Are you insulting God’s high priest?”
translation:
  language: hi
  text: जो लोग पास खड़े थे, उन्होंने कहा[a], “क्या तुम परमेश्वर के महायाजक का अपमान कर रहे हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्या तुम परमेश्वर के महायाजक को बुरा-भला कह रहे हो?”
    reason: λοιδορεῖς के अधिक स्पष्ट वाणी-संबंधी वैकल्पिक अनुवाद को देना।
lexical_decisions:
- source_word: οἱ δὲ παρεστῶτες
  choice: जो लोग पास खड़े थे
  rationale: यह संज्ञा के रूप में प्रयुक्त कृदंत उन उपस्थित लोगों को दर्शाता है जो पौलुस के निकट खड़े थे; यह अनुवाद स्थान-संबंधी भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἶπαν
  choice: उन्होंने कहा
  rationale: एओरिस्ट यहाँ कथा को आगे बढ़ाने वाली सामान्य भूतकालीन क्रिया है।
- source_word: ἀρχιερέα
  choice: महायाजक
  rationale: इस प्रसंग में यह यहूदी महायाजक के पद का मानक और सटीक हिन्दी पद है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर के
  rationale: सम्बन्धकारक पदबंध महायाजक के पद का परमेश्वर से संबंध व्यक्त करता है; हिन्दी में यह रूप स्वाभाविक है।
- source_word: λοιδορεῖς
  choice: अपमान कर रहे हो
  rationale: क्रिया का अर्थ निंदापूर्ण या अपमानजनक वाणी बोलना है; ‘अपमान करना’ आधुनिक पाठक के लिए स्पष्ट है और प्रश्न की फटकार को व्यक्त करता है।
theological_decisions:
- issue: महायाजक के लिए τοῦ θεοῦ का आशय
  choice: ‘परमेश्वर के महायाजक’ के रूप में अनुवाद, जो पद का परमेश्वर से संबंध बताता है
  alternative: ‘परमेश्वर के प्रधान याजक’
  rationale: यूनानी पदबंध महायाजक के पद की पहचान परमेश्वर के संबंध में करता है; अनुवाद उस व्यक्ति के आचरण पर परमेश्वर की स्वीकृति का अतिरिक्त दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘महायाजक’ बाइबलीय संदर्भ में परिचित और सटीक पद है; मुख्य पाठ में ‘अपमान’ सहज है, जबकि पादटिप्पणी क्रिया के मौखिक दुर्वचन वाले भाव को स्पष्ट करती है।
