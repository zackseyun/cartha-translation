  text: ἀτενίσας δὲ ⸂ὁ Παῦλος τῷ συνεδρίῳ⸃ εἶπεν· Ἄνδρες ἀδελφοί, ἐγὼ πάσῃ συνειδήσει ἀγαθῇ πεπολίτευμαι τῷ θεῷ ἄχρι ταύτης τῆς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/001.yaml
  text: And Paul[a], looking intently at the council, said, “Brothers, I have lived before God with an entirely good conscience up to this day.”
translation:
  language: hi
  text: और पौलुस ने महासभा की ओर एकटक देखकर कहा, “भाइयो, मैंने आज के दिन तक परमेश्वर के सामने पूरी तरह अच्छे विवेक के साथ आचरण किया है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने परमेश्वर के सामने नागरिक के रूप में आचरण किया है”; यूनानी क्रिया में नागरिक के रूप में आचरण करने की छाया हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτενίσας
  choice: टकटकी लगाकर
  rationale: यह पद निर्देशित और स्थिर दृष्टि का भाव व्यक्त करता है; यह हिन्दी में स्वाभाविक रूप से उसकी तीव्रता बनाए रखता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ यह कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘तब’ प्रसंग में सहज है।
- source_word: τῷ συνεδρίῳ
  choice: महासभा
  rationale: इस प्रसंग में यह यहूदी शासकीय परिषद को सूचित करता है; ‘महासभा’ प्रचलित, स्पष्ट हिन्दी पद है और लिप्यंतरण से बचता है।
- source_word: Ἄνδρες ἀδελφοί
  choice: भाइयो
  rationale: दोहरे सम्बोधन का स्वाभाविक हिन्दी रूप है और पुरुष श्रोताओं को किया गया प्रत्यक्ष सम्बोधन बनाए रखता है।
- source_word: πάσῃ συνειδήσει ἀγαθῇ
  choice: पूरी तरह शुद्ध विवेक से
  rationale: यह रीति या नैतिक अंतःस्थिति बताने वाला पदबंध है; πάσῃ की व्यापकता को ‘पूरी तरह’ और ἀγαθῇ को प्रसंगानुकूल ‘शुद्ध’ व्यक्त करता है।
- source_word: πεπολίτευμαι
  choice: अपना जीवन बिताया है
  rationale: पूर्णकालिक रूप अतीत से वर्तमान तक जीवन-आचरण का पुनरावलोकन करता है। मुख्य पाठ में स्वाभाविक व्यापक अर्थ रखा गया है, जबकि नागरिक आचरण की संभावित छाया पादटिप्पणी में दी गई है।
- source_word: τῷ θεῷ
  choice: परमेश्वर के सामने
  rationale: दत्तिव यहाँ परमेश्वर के संबंध और उनकी दृष्टि में किए गए जीवन-आचरण को व्यक्त करता है; हिन्दी में यह विवेक की भाषा के साथ स्वाभाविक है।
- source_word: ἄχρι ταύτης τῆς ἡμέρας
  choice: आज के दिन तक
  rationale: यह अतीत से वर्तमान क्षण तक निरंतरता स्पष्ट करता है।
theological_decisions:
- issue: πεπολίτευμαι में पौलुस के आत्मवर्णन का आशय
  choice: परमेश्वर के सामने अपने जीवन-आचरण का सामान्य नैतिक दावा
  alternative: ‘मैंने परमेश्वर के सामने एक नागरिक के समान आचरण किया है,’ जिसमें नागरिकता की छाया अधिक प्रत्यक्ष हो
  rationale: क्रिया में नागरिक जीवन की व्युत्पत्तिगत या प्रसंगगत छाया हो सकती है, पर यहाँ मुख्य बल परमेश्वर के सामने अच्छे विवेक से किए गए जीवन-आचरण पर है। अनुवाद इसे पापरहित सिद्धता का दावा नहीं बनाता और नागरिक अर्थ को भी पूर्णतः छिपाता नहीं है।
