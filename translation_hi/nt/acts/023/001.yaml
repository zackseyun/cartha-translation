  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। ‘महासभा,’ ‘टकटकी लगाकर,’ और ‘शुद्ध विवेक’ जैसे पद स्पष्टता तथा स्रोत-पाठ की औपचारिक शक्ति के बीच संतुलन रखते हैं।
