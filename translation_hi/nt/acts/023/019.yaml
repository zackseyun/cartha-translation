source:
  edition: SBLGNT
  text: ἐπιλαβόμενος δὲ τῆς χειρὸς αὐτοῦ ὁ χιλίαρχος καὶ ἀναχωρήσας κατ’ ἰδίαν ἐπυνθάνετο· Τί ἐστιν ὃ ἔχεις ἀπαγγεῖλαί μοι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/019.yaml
  text: So the commander took him by the hand and[a], drawing aside in private, began asking[b], “What is it that you have to report to me?”
translation:
  language: hi
  text: तब सेनानायक उसका हाथ पकड़कर उसे एकांत में अलग ले गया[a] और उससे पूछने लगा[b], “तुम्हें मुझे क्या सूचना देनी है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका हाथ पकड़कर एकांत में अलग चला गया।”
    reason: यूनानी में अलग जाने की क्रिया का कर्म स्पष्ट नहीं है; प्रसंग से युवक को साथ ले जाना निहित है।
  - marker: b
    text: या, “उससे पूछा।”
    reason: यूनानी अपूर्ण भूतकाल को यहाँ आरंभिक भाव (“पूछने लगा”) या सामान्य कथात्मक भूतकाल (“पूछा”) के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: ἐπιλαβόμενος ... τῆς χειρὸς αὐτοῦ
  choice: उसका हाथ पकड़कर
  rationale: यह वाक्यांश हाथ थामने या पकड़ने की ठोस क्रिया व्यक्त करता है। हिंदी में यह स्वाभाविक है और अनावश्यक बलप्रयोग का भाव नहीं जोड़ता।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को अगली घटना की ओर बढ़ाता है; “तब” आधुनिक हिंदी में इस क्रम को सहजता से व्यक्त करता है।
- source_word: ὁ χιλίαρχος
  choice: सेनानायक
  rationale: यह रोमी सैन्य अधिकारी के लिए प्रयुक्त पद है। “सेनानायक” स्पष्ट और गरिमापूर्ण है, जबकि शाब्दिक “सहस्रपति” आज के सामान्य पाठक के लिए अपरिचित होगा।
- source_word: ἀναχωρήσας κατ’ ἰδίαν
  choice: एकांत में अलग चला गया
  rationale: यह अन्यों से हटकर निजी स्थान में जाने का अर्थ सुरक्षित रखता है और यूनानी पाठ की उस संरचना का अनुसरण करता है जिसमें युवक को कर्म के रूप में दोबारा स्पष्ट नहीं किया गया।
- source_word: ἐπυνθάνετο
  choice: पूछने लगा
  rationale: अपूर्ण भूतकाल का आरंभिक या जारी क्रिया वाला भाव “पूछने लगा” से स्वाभाविक रूप में प्रकट होता है।
- source_word: ὃ ἔχεις ἀπαγγεῖλαί μοι
  choice: तुम्हें मुझे क्या सूचना देनी है
  rationale: ἀπαγγεῖλαι किसी बात की सूचना देने या उसे पहुँचाने का भाव रखता है। सैन्य और कानूनी प्रसंग में “सूचना देनी” सामान्य “बताना” से अधिक सटीक है।
