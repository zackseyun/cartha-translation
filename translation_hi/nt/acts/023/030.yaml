base_translation:
  language: en
  yaml_path: translation/nt/acts/023/030.yaml
  text: And when I was informed that there would be a plot against the man[a], I sent him to you at once, also ordering his accusers to state their case before you.
translation:
  language: hi
  text: जब मुझे यह सूचना मिली कि उस व्यक्ति के विरुद्ध एक षड्यंत्र होने वाला है, तो मैंने उसे तुरन्त आपके पास भेज दिया। मैंने उसके आरोप लगाने वालों को भी आदेश दिया कि वे आपके सामने उस पर अपने आरोप प्रस्तुत करें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे आपके सामने उसके विरुद्ध बोलें।” यूनानी में शाब्दिक रूप से “उसके विरुद्ध/उससे बोलना” है, जो यहाँ न्यायिक संदर्भ में आरोप प्रस्तुत करने का अर्थ देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μηνυθείσης
  choice: जब मुझे यह सूचना मिली
  rationale: एओरिस्ट कर्मवाच्य जेनिटिव ऐब्सल्यूट को स्वाभाविक हिन्दी कालवाचक उपवाक्य में व्यक्त किया गया है; कर्मवाच्य भाव बना रहता है।
- source_word: ἐπιβουλῆς
  choice: षड्यंत्र
  rationale: यह शब्द किसी के विरुद्ध रची गई शत्रुतापूर्ण योजना को दर्शाता है; ‘षड्यंत्र’ प्रसंगानुकूल है और ‘घात’ की अपेक्षा कम विशिष्ट है।
- source_word: εἰς τὸν ἄνδρα
  choice: इस व्यक्ति के विरुद्ध
  rationale: εἰς यहाँ शत्रुतापूर्ण दिशा बताता है। ‘इस व्यक्ति’ पत्र में संदर्भित पौलुस की ओर संकेत करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἔσεσθαι
  choice: रचा जाने वाला है
  rationale: भविष्यत् infinitive आसन्न षड्यंत्र की सूचना का विषय है; हिन्दी में इसे संज्ञा के साथ स्वाभाविक भाववाच्य रूप में व्यक्त किया गया है।
- source_word: ἐξαυτῆς
  choice: तुरन्त
  rationale: क्रियाविशेषण तत्काल कार्रवाई को व्यक्त करता है; ‘तुरन्त’ संक्षिप्त और सहज है।
- source_word: ἔπεμψα πρὸς σέ
  choice: मैंने उसे आपके पास भेज दिया
  rationale: यूनानी में कर्म प्रसंग से स्पष्ट है; हिन्दी में ‘उसे’ जोड़ना आवश्यक और स्वाभाविक है।
- source_word: παραγγείλας
  choice: मैंने ... आदेश दिया
  rationale: एओरिस्ट कृदन्त साथ हुई अतिरिक्त कार्रवाई बताता है; अलग वाक्य में ‘भी’ के साथ उसका संबंध स्पष्ट रखा गया है।
- source_word: κατηγόροις
  choice: उसके आरोप लगाने वालों
  rationale: संज्ञा का न्यायिक अर्थ स्पष्ट करते हुए पौलुस से उसका संबंध ‘उसके’ द्वारा व्यक्त किया गया है।
- source_word: λέγειν πρὸς αὐτὸν
  choice: उस पर अपने आरोप प्रस्तुत करें
  rationale: शाब्दिक अर्थ ‘उससे/उसके विरुद्ध बोलें’ है, पर न्यायिक संदर्भ में आशय अभियोग प्रस्तुत करना है। यह हिन्दी रूप उसी अदालती आशय को स्पष्ट करता है।
- source_word: ἐπὶ σοῦ
  choice: आपके सामने
  rationale: यह न्यायिक अधिकारी की उपस्थिति और अधिकार के सामने पेश होने का भाव देता है; ‘आपके सामने’ स्वाभाविक और पर्याप्त औपचारिक है।
