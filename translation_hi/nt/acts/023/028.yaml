    reason: lexical_alternative
lexical_decisions:
- source_word: βουλόμενός τε ἐπιγνῶναι
  choice: और मैं यह जानना चाहता था
  rationale: कृदन्तीय रचना को स्वाभाविक हिन्दी उपवाक्य में बदला गया है; ‘चाहता था’ उद्देश्य और इच्छा दोनों को व्यक्त करता है, जबकि ‘जानना’ यहाँ ठीक-ठीक पता लगाने के भाव को सहज रूप में रखता है।
- source_word: τὴν αἰτίαν δι’ ἣν
  choice: किस आरोप के कारण
  rationale: कानूनी प्रसंग में αἰτία आरोप के आधार को सूचित करता है। प्रश्नवाचक हिन्दी रचना यूनानी संबंधवाचक वाक्यांश का स्वाभाविक और स्पष्ट रूप है।
- source_word: ἐνεκάλουν αὐτῷ
  choice: वे उस पर ... दोष लगा रहे थे
  rationale: ‘दोष लगा रहे थे’ कानूनी आरोप का भाव देता है और अपूर्ण काल की जारी क्रिया को बनाए रखता है।
- source_word: κατήγαγον
  choice: मैं उसे नीचे ... ले गया
  rationale: ‘नीचे’ यूनानी क्रिया में निहित स्थानिक दिशा को सुरक्षित रखता है; ‘ले गया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὸ συνέδριον αὐτῶν
  choice: उनकी महासभा
  rationale: ‘महासभा’ यरूशलेम की यहूदी शासकीय परिषद के लिए समझने योग्य हिन्दी पद है, फिर भी पादटिप्पणी में अधिक सामान्य ‘परिषद’ और पारंपरिक ‘सनहेद्रिन’ विकल्प दिए गए हैं।
