source:
  edition: SBLGNT
  text: νῦν οὖν ὑμεῖς ἐμφανίσατε τῷ χιλιάρχῳ σὺν τῷ συνεδρίῳ ⸀ὅπως ⸂καταγάγῃ αὐτὸν εἰς⸃ ὑμᾶς ὡς μέλλοντας διαγινώσκειν ἀκριβέστερον τὰ περὶ αὐτοῦ· ἡμεῖς δὲ πρὸ τοῦ ἐγγίσαι αὐτὸν ἕτοιμοί ἐσμεν τοῦ ἀνελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/015.yaml
  text: Now therefore[a], you, together with the council, make it known to the commander so that he may bring him down to you, as though you were about to examine more carefully the things concerning him[c][b]. But we are ready to kill him before he comes near.
translation:
  language: hi
  text: इसलिए अब आप महासभा के साथ मिलकर सेनापति को यह सूचना दें कि वह पौलुस को आपके पास नीचे ले आए, मानो आप उसके विषय में और अधिक ठीक-ठीक जाँच करने वाले हों। पर उसके निकट आने से पहले ही हम उसे मार डालने के लिए तैयार हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμφανίσατε
  choice: यह सूचना दें
  rationale: यहाँ क्रिया किसी अधिकारी को औपचारिक रूप से बात बताने का भाव रखती है; ‘सूचना दें’ स्वाभाविक है और इसे केवल ‘निवेदन करें’ तक सीमित नहीं करती।
- source_word: χιλιάρχῳ
  choice: सेनापति
  rationale: यह रोमी सैन्य अधिकारी का पद है। ‘सेनापति’ सामान्य हिन्दी पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: σὺν τῷ συνεδρίῳ
  choice: महासभा के साथ मिलकर
  rationale: σύν की सहभागिता और συνέδριον से अभिप्रेत यहूदी शासकीय परिषद—दोनों को स्पष्ट करता है।
- source_word: καταγάγῃ αὐτὸν εἰς ὑμᾶς
  choice: वह पौलुस को आपके पास नीचे ले आए
  rationale: κατάγω में नीचे लाने की दिशात्मक छाया है; सर्वनाम की पहचान प्रसंग से स्पष्ट होने के कारण हिन्दी में ‘पौलुस’ स्वाभाविक स्पष्टता देता है।
- source_word: ὡς μέλλοντας
  choice: मानो आप ... करने वाले हों
  rationale: ὡς के साथ कृदन्त प्रस्तुत अथवा दिखावटी मंशा व्यक्त करता है; ‘मानो’ छलपूर्ण बहाने को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: διαγινώσκειν ἀκριβέστερον
  choice: और अधिक ठीक-ठीक जाँच करने
  rationale: न्यायिक जाँच तथा तुलनात्मक सटीकता—दोनों भाव सुरक्षित रहते हैं।
- source_word: πρὸ τοῦ ἐγγίσαι αὐτὸν
  choice: उसके निकट आने से पहले ही
  rationale: ἐγγίζω का स्थानगत ‘निकट आना’ अक्षुण्ण रहता है; ‘ही’ घात लगाने की समय-संबंधी तत्परता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: उसे मार डालने
  rationale: इस प्रसंग में ἀναιρέω का सीधा अर्थ हत्या करना है; ‘मार डालना’ स्पष्ट है और क्रिया में निहित न होने वाला अतिरिक्त नैतिक विशेषण नहीं जोड़ता।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और कथात्मक रूप रखा गया है। ‘महासभा’ यहूदी परिषद के लिए और ‘सेनापति’ रोमी χιλίαρχος के लिए पाठक-सुलभ पद हैं। यूनानी पाठ की दिखावटी न्यायिक जाँच और वास्तविक घात की विडंबना स्पष्ट रखी गई है।
