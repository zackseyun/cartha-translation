lexical_decisions:
- source_word: τοῦτο δὲ αὐτοῦ λαλοῦντος
  choice: जब वह यह कह ही रहा था
  rationale: संबंधकारक निरपेक्ष रचना और वर्तमान कृदंत उस समय जारी क्रिया को व्यक्त करते हैं। ‘कह ही रहा था’ उसी समकालिकता को सहज हिन्दी में बनाए रखता है।
- source_word: ἐγένετο στάσις
  choice: मतभेद उठ खड़ा हुआ
  rationale: ἐγένετο किसी स्थिति के उत्पन्न होने को और στάσις यहाँ विरोध, फूट या विवाद को सूचित करता है। यह प्रयोग संघर्ष के आरम्भ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: फरीसियों और सदूकियों के बीच
  rationale: यूनानी संबंधकारक दोनों विरोधी पक्षों को बताता है; हिन्दी में ‘के बीच’ उनका परस्पर विरोध स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐσχίσθη
  choice: दो भागों में बँट गई
  rationale: σχίζω का कर्मवाच्य रूप शाब्दिक रूप से फटने या विभाजित होने का भाव देता है। सामाजिक समूह के संदर्भ में ‘बँट गई’ स्वाभाविक है, और ‘दो भागों में’ प्रसंग के दो विरोधी पक्षों को स्पष्ट करता है।
- source_word: τὸ πλῆθος
  choice: सभा
  rationale: यहाँ πλῆθος उस एकत्रित निकाय को दर्शाता है जिसके सामने पौलुस बोल रहा था। ‘सभा’ औपचारिक प्रसंग के अनुकूल है, यद्यपि ‘भीड़’ भी शाब्दिक रूप से संभव है।
