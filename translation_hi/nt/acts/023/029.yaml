  text: I found that he was being accused concerning questions of their law[b][a], but charged with nothing deserving death or imprisonment.
translation:
  language: hi
  text: मैंने पाया कि उस पर उनकी व्यवस्था से संबंधित विवादास्पद प्रश्नों के बारे में आरोप लगाए जा रहे थे, पर उसके विरुद्ध ऐसा कोई आरोप नहीं था जो मृत्यु-दंड या कैद के योग्य हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: मैंने पाया
  rationale: यह अधिकारी की जाँच के बाद निकले निष्कर्ष को स्वाभाविक और सीधा रूप देता है।
- source_word: ἐγκαλούμενον
  choice: उस पर ... आरोप लगाए जा रहे थे
  rationale: निष्क्रिय कृदन्त के जारी आरोपों वाले भाव को सुरक्षित रखता है और दोष सिद्ध होने का अर्थ नहीं देता।
- source_word: περὶ ζητημάτων
  choice: विवादित प्रश्नों के विषय में
  rationale: ζητήματα में प्रश्नों के साथ बहस या विवाद का भाव भी है; यह चयन दोनों पहलुओं को व्यक्त करता है।
- source_word: τοῦ νόμου αὐτῶν
  choice: उनके व्यवस्था-विधान से जुड़े
  rationale: αὐτῶν के 'उनके' को बनाए रखते हुए νόμος को इस यहूदी धार्मिक-कानूनी संदर्भ में सहज हिन्दी देता है।
- source_word: μηδὲν ... ἄξιον θανάτου ἢ δεσμῶν
  choice: ऐसा कोई अपराध ... जो मृत्यु-दण्ड या कैद के योग्य हो
  rationale: न्यायिक दायित्व का अर्थ स्पष्ट करता है; δεσμῶν का शाब्दिक अर्थ 'बेड़ियाँ' है, पर यहाँ उससे अभिप्रेत कारावास को 'कैद' स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔχοντα ἔγκλημα
  choice: उस पर ऐसा कोई अपराध नहीं लगाया गया था
  rationale: आरोप होने का भाव व्यक्त करता है, दोष सिद्ध होने का नहीं; हिन्दी में वाक्य को स्पष्ट रखने के लिए नकारात्मक खंड में स्वाभाविक रूप दिया गया है।
