revisions:
- from: मैंने पाया कि उस पर उनके व्यवस्था-विधान से जुड़े विवादित प्रश्नों के विषय में आरोप लगाए जा रहे थे, पर उस पर ऐसा कोई अपराध नहीं लगाया गया था जो मृत्यु-दण्ड या कैद के योग्य हो।
  to: मैंने पाया कि उस पर उनकी व्यवस्था से संबंधित विवादास्पद प्रश्नों के बारे में आरोप लगाए जा रहे थे, पर उसके विरुद्ध ऐसा कोई आरोप नहीं था जो मृत्यु-दंड या कैद के योग्य हो।
  rationale: The revision retains the passive, ongoing sense of the accusations and the Roman official’s reference to ‘their law.’ It replaces ‘अपराध’ with ‘आरोप’ to represent ἔγκλημα as an accusation rather than proven wrongdoing, and streamlines the law terminology without narrowing its meaning.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:57:20Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the investigation, accusations relating to disputed questions within the other party’s law, and the absence of any death- or imprisonment-worthy charge. However, ‘अपराध’ can denote an actual offense rather than the Greek ἔγκλημα, which here means a charge/accusation; ‘आरोप’ should be retained in the final clause.
  naturalness: The wording is generally clear, but ‘व्यवस्था-विधान’ is unnecessarily doubled and ‘...अपराध नहीं लगाया गया था’ is less direct than a formulation centered on an accusation existing against him. ‘उनकी व्यवस्था’ is natural in this biblical-legal context.
  terminology: ‘मृत्यु-दंड’ and ‘कैद’ appropriately render the legal force of θανάτου ἢ δεσμῶν. ‘उनकी व्यवस्था’ preserves αὐτῶν and avoids over-specifying νόμος as either merely civil law or only religious law.
  issues:
  - severity: medium
    issue: ‘अपराध’ is used for ἔγκλημα in the negative clause.
    rationale: In this context ἔγκλημα is a legal charge or accusation, not a statement that Paul committed an offense. Rendering it as ‘आरोप’ avoids even a possible implication of actual guilt and matches the preceding passive accusation language.
  - severity: low
    issue: ‘व्यवस्था-विधान’ is stylistically redundant.
    rationale: ‘उनकी व्यवस्था’ is a clearer established Hindi biblical/legal expression for νόμος and retains the source’s ambiguity and possessive perspective.
  revised_text: मैंने पाया कि उस पर उनकी व्यवस्था से संबंधित विवादास्पद प्रश्नों के बारे में आरोप लगाए जा रहे थे, पर उसके विरुद्ध ऐसा कोई आरोप नहीं था जो मृत्यु-दंड या कैद के योग्य हो।
  revised_footnotes: []
  revision_rationale: The revision retains the passive, ongoing sense of the accusations and the Roman official’s reference to ‘their law.’ It replaces ‘अपराध’ with ‘आरोप’ to represent ἔγκλημα as an accusation rather than proven wrongdoing, and streamlines the law terminology without narrowing its meaning.
