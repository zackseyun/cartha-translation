  text: Γενομένης δὲ ἡμέρας ποιήσαντες ⸂συστροφὴν οἱ Ἰουδαῖοι⸃ ἀνεθεμάτισαν ἑαυτοὺς λέγοντες μήτε φαγεῖν μήτε πιεῖν ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/012.yaml
  text: When day came[a], the Jews formed a conspiracy and bound themselves under a curse[b], saying that they would neither eat nor drink until they had killed Paul.
translation:
  language: hi
  text: जब दिन निकला, तो यहूदियों ने[a] षड्यंत्र रचा और अपने आपको शाप के अधीन करके शपथ ली[b] कि वे पौलुस को मार डालने तक न खाएँगे न पिएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में “यहूदी” है; यहाँ इसका संकेत षड्यंत्र में शामिल यहूदियों के एक विशेष समूह की ओर है, समस्त यहूदी लोगों की ओर नहीं।
    reason: cultural_note
  - marker: b
    text: या, “अपने आपको शाप के अधीन कर लिया।” इसका अर्थ है कि उन्होंने ऐसी शपथ ली जिसमें असफल होने पर अपने ही ऊपर दंड आने का आह्वान किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: जब दिन हुआ
  rationale: यह संबंधवाचक स्वतंत्र पदबंध समय के परिवर्तन को सूचित करता है; यह रूप हिन्दी में स्वाभाविक है और मूल के 'दिन होने' के भाव को बनाए रखता है।
- source_word: ποιήσαντες συστροφὴν
  choice: षड्यंत्र रचा
  rationale: संदर्भ में यह सुनियोजित गुप्त मिलीभगत और हत्या की योजना को व्यक्त करता है; 'भीड़ जुटाई' से दंगे का अनुचित भाव आता।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदियों ने
  rationale: मुख्य पाठ मूल के स्पष्ट शब्द को बनाए रखता है। संदर्भ से यह एक विशेष षड्यंत्रकारी समूह है, समस्त यहूदी लोग नहीं; इसलिए स्पष्टीकरण पादटिप्पणी में दिया गया है।
- source_word: ἀνεθεμάτισαν ἑαυτοὺς
  choice: अपने ऊपर शाप की शपथ ली
  rationale: यह अभिव्यक्ति ऐसी आत्म-अभिशापयुक्त शपथ बताती है जिसमें असफल होने पर व्यक्ति अपने लिए दंड का आह्वान करता है। यह हिन्दी में अर्थ को स्पष्ट और संक्षिप्त रखती है।
- source_word: λέγοντες μήτε φαγεῖν μήτε πιεῖν
  choice: कि ... न कुछ खाएँगे, न पिएँगे
  rationale: यह अनन्त क्रिया-रचना उनकी शपथ की विषयवस्तु व्यक्त करती है; युग्मित निषेध को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ἕως οὗ ἀποκτείνωσιν τὸν Παῦλον
  choice: जब तक वे पौलुस को मार न डालें
  rationale: यह शपथ की समय-सीमा बताता है। 'मार न डालें' हत्या पूर्ण कर लेने का लक्ष्य स्पष्ट करता है और हिन्दी के 'जब तक ... न' विन्यास के अनुरूप है।
