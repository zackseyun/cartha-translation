  to: अगले दिन, घुड़सवारों को पौलुस के साथ आगे जाने देकर, वे छावनी[a] में लौट गए।
  rationale: Revised the mild connective into idiomatic Hindi without forcing contrast, and rendered the aorist participle as “जाने देकर” to preserve its antecedent action. The lexical ambiguity of παρεμβολή is retained in the footnote.
