  yaml_path: translation/nt/acts/023/032.yaml
  text: But on the next day[a], after letting the horsemen go on with him, they returned to the barracks.
translation:
  language: hi
  text: अगले दिन, घुड़सवारों को पौलुस के साथ आगे जाने देकर, वे छावनी[a] में लौट गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सैनिक बैरकों में।” यूनानी शब्द का अर्थ छावनी या सैनिकों के रहने का स्थान हो सकता है; यहाँ सम्भवतः यरूशलेम का रोमी किला अथवा उसके सैनिक बैरक अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: पर अगले दिन
  rationale: यह यूनानी मुहावरा ‘अगले दिन’ का अर्थ देता है। δέ को हल्के कथात्मक बदलाव के रूप में ‘पर’ कहा गया है, बिना प्रबल विरोध उत्पन्न किए।
- source_word: ἐάσαντες
  choice: जाने दिया
  rationale: ἐάω का अर्थ यहाँ अनुमति देना है; कृदंत की पूर्वकालिक क्रिया को स्वाभाविक हिन्दी वाक्य-क्रम में व्यक्त किया गया है।
- source_word: τοὺς ἱππεῖς
  choice: घुड़सवारों
  rationale: यह शब्द घोड़े पर सवार सैनिकों को दर्शाता है। ‘घुड़सवार’ निकट, स्पष्ट और सामान्य हिन्दी है।
- source_word: ἀπέρχεσθαι σὺν αὐτῷ
  choice: पौलुस के साथ आगे जाने
  rationale: सन्दर्भ में घुड़सवार पौलुस के साथ यात्रा जारी रखते हैं, जबकि अन्य सैनिक लौट जाते हैं। सर्वनाम की स्पष्टता के लिए ‘उसके’ की जगह ‘पौलुस के’ कहा गया है।
- source_word: ὑπέστρεψαν
  choice: लौट गए
  rationale: ὑποστρέφω का सामान्य अर्थ लौटना या वापस जाना है; ‘लौट गए’ स्वाभाविक कथात्मक हिन्दी है।
- source_word: εἰς τὴν παρεμβολήν
  choice: छावनी
  rationale: παρεμβολή सैनिक छावनी या सैन्य निवास-स्थान को दर्शा सकता है। ‘छावनी’ मूल शब्द की व्यापकता को बनाए रखता है; सन्दर्भगत विकल्प फुटनोट में दिया गया है।
