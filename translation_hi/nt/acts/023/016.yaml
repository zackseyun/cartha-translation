  text: Ἀκούσας δὲ ὁ υἱὸς τῆς ἀδελφῆς Παύλου ⸂τὴν ἐνέδραν⸃ παραγενόμενος καὶ εἰσελθὼν εἰς τὴν παρεμβολὴν ἀπήγγειλεν τῷ Παύλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/016.yaml
  text: But when Paul’s sister’s son heard of the ambush[c][b][a], he came and entered the barracks and reported it to Paul.
translation:
  language: hi
  text: लेकिन जब पौलुस की बहन के बेटे ने घात लगाने की योजना[a] के बारे में सुना, तो वह वहाँ पहुँचा और छावनी[b] में प्रवेश करके पौलुस को इसकी सूचना दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घात” अथवा “षड्यंत्र।” यूनानी शब्द विशेष रूप से घात लगाकर प्रतीक्षा करने का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: या “सैनिक बैरक।” यूनानी शब्द का अर्थ “छावनी” या “बैरक” हो सकता है; यहाँ संभवतः रोमी सैनिकों का बैरक अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: जब ... सुना
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले हुई क्रिया को दर्शाता है; हिंदी में कालवाचक उपवाक्य स्वाभाविक है।
- source_word: δὲ
  choice: लेकिन
  rationale: 'यह कथा में परिवर्तन के साथ हल्का विरोध दिखाता है: षड्यंत्र रचा गया, लेकिन उसकी खबर पौलुस के भांजे को लग गई।'
- source_word: ὁ υἱὸς τῆς ἀδελφῆς Παύλου
  choice: पौलुस की बहन के बेटे
  rationale: मूल यूनानी में संबंध स्पष्ट रूप से ‘पौलुस की बहन का बेटा’ है; यह ‘भांजा’ की तुलना में मूल अभिव्यक्ति को अधिक सीधे सुरक्षित रखता है।
- source_word: τὴν ἐνέδραν
  choice: घात लगाने की योजना
  rationale: ἐνέδρα घात या छिपकर आक्रमण करने के लिए प्रतीक्षा को दर्शाता है। ‘घात लगाने की योजना’ इस प्रसंग में ठोस अर्थ और नियोजित कार्रवाई दोनों व्यक्त करता है।
- source_word: παραγενόμενος καὶ εἰσελθὼν
  choice: वह ... गया और भीतर जाकर
  rationale: दोनों कृदंत क्रमिक गतिविधियां दर्शाते हैं—वह पहुंचा और अंदर गया; हिंदी में इसे सहज क्रियाक्रम के रूप में रखा गया है।
- source_word: εἰς τὴν παρεμβολὴν
  choice: छावनी में
  rationale: παρεμβολή का अर्थ ‘छावनी’ या सैनिक बैरक हो सकता है। यरूशलेम में रोमी सैन्य परिसर के इस संदर्भ में ‘छावनी’ स्वाभाविक है और शब्द की व्यापकता भी रखता है।
- source_word: ἀπήγγειλεν
  choice: सूचना दी
  rationale: यह क्रिया प्राप्त जानकारी को जाकर बताने या सूचित करने का भाव देती है; हिंदी में ‘सूचना दी’ प्रसंगानुकूल और स्पष्ट है।
- source_word: τῷ Παύλῳ
  choice: पौलुस को
  rationale: दत्तिव अप्रत्यक्ष कर्म का सीधा और स्वाभाविक हिंदी रूप।
