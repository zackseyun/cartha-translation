source:
  edition: SBLGNT
  text: εἶπεν δὲ ὅτι Οἱ Ἰουδαῖοι συνέθεντο τοῦ ἐρωτῆσαί σε ὅπως αὔριον ⸂τὸν Παῦλον καταγάγῃς εἰς τὸ συνέδριον⸃ ὡς ⸀μέλλον τι ἀκριβέστερον πυνθάνεσθαι περὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/023/020.yaml
  text: He said[a], “The Jews have agreed to ask you to bring Paul down to the Sanhedrin tomorrow[b], as though they were going to inquire more accurately about him.”
translation:
  language: hi
  text: उसने कहा, “यहूदी[a] इस बात पर सहमत हुए हैं कि वे आपसे अनुरोध करें कि आप कल पौलुस को नीचे महासभा[b] में ले आएँ, मानो वे उसके विषय में कुछ और अधिक ठीक-ठीक पता लगाने वाले हों।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘यहूदी’ से आशय पौलुस के विरुद्ध इस योजना में सम्मिलित विशेष यहूदी समूह से है, सभी यहूदियों से नहीं।
    reason: contextual_clarification
  - marker: b
    text: या ‘यहूदी परिषद’; यूनानी शब्द यहाँ संभवतः सनहेद्रिन, अर्थात् यहूदियों की शासकीय महासभा, को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘मानो वे उसके विषय में कुछ और अधिक बारीकी से पूछताछ करने वाले हों।’
    reason: alternative_rendering
lexical_decisions:
- source_word: συνέθεντο
  choice: इस बात पर सहमत हुए हैं
  rationale: मध्यवाच्य क्रिया का अर्थ मिलकर सहमत होना या योजना तय करना है। यह चयन प्रसंग में उनकी साझा योजना को व्यक्त करता है, पर शब्द में अपने-आप ‘षड्यंत्र’ का अर्थ नहीं जोड़ता।
- source_word: τοῦ ἐρωτῆσαί σε
  choice: कि वे आपसे अनुरोध करें
  rationale: सव्यय आर्टिकुलर इनफिनिटिव सहमति की विषय-वस्तु या उद्देश्य बताता है। अधिकारी से किसी कार्य को कराने की बात होने के कारण ‘अनुरोध करें’ स्वाभाविक है।
- source_word: καταγάγῃς
  choice: नीचे ... ले आएँ
  rationale: κατά- की नीचे की ओर गति को सुरक्षित रखता है और किले से महासभा तक पौलुस को लाने के कथानक-संदर्भ के अनुकूल है।
- source_word: συνέδριον
  choice: महासभा
  rationale: यहाँ शब्द यरूशलेम की यहूदी शासकीय परिषद, अर्थात् सनहेद्रिन, को सूचित करता है। ‘महासभा’ सामान्य हिन्दी पाठक के लिए स्पष्ट और प्रचलित बाइबिलीय पद है।
- source_word: ὡς
  choice: मानो
  rationale: यह अनुरोध के दिखावटी या कथित उद्देश्य को व्यक्त करता है, बिना छल की बात को मूल से अधिक स्पष्ट करके जोड़ने के।
- source_word: μέλλον τι ἀκριβέστερον πυνθάνεσθαι
  choice: और अधिक बारीकी से पूछताछ करने वाले हों
  rationale: μέλλον आगामी अभिप्राय, πυνθάνομαι पूछताछ द्वारा जानकारी लेने, और ἀκριβέστερον अधिक सूक्ष्मता या ठीक-ठीक जाँच करने का भाव देता है। हिन्दी में यह संयोजन स्वाभाविक रहते हुए तुलनात्मक बल को बनाए रखता है।
- source_word: περὶ αὐτοῦ
  choice: उसके विषय में
  rationale: पूर्वसर्गीय वाक्यांश का सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: Οἱ Ἰουδαῖοι
  choice: यहूदी
  rationale: मूल पाठ के व्यापक पद को संकीर्ण करके ‘यहूदी अगुए’ नहीं बनाया गया है। प्रसंग बताता है कि आशय पौलुस के विरुद्ध योजना में सम्मिलित विशेष समूह से है, सभी यहूदियों से नहीं।
theological_decisions:
- issue: विरोधी कथानक में ‘यहूदी’ का संदर्भ
  choice: मूल के Οἱ Ἰουδαῖοι के अनुरूप ‘यहूदी’ रखा गया है और प्रसंगगत सीमा पादटिप्पणी में स्पष्ट की गई है।
  alternative: यहूदी अगुए; यहूदिया के लोग
  rationale: मूल यूनानी स्वयं संदर्भ को ‘अगुओं’ तक सीमित नहीं करता। फिर भी इसे समस्त यहूदी जाति पर आरोप समझना अनुचित होगा; निकटवर्ती प्रसंग पौलुस के विरुद्ध योजना बनाने वाले विशेष लोगों को सूचित करता है।
- issue: ὡς द्वारा व्यक्त कथित उद्देश्य
  choice: ‘मानो’ द्वारा दिखावटी उद्देश्य को खुला रखा गया है।
  alternative: ‘इस बहाने से कि’
  rationale: ‘इस बहाने से’ छल को अधिक व्याख्यात्मक ढंग से स्पष्ट करता, जबकि ‘मानो’ मूल की संक्षिप्तता और निहित तनाव को बेहतर सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक ‘आप’ और विनम्र क्रियारूप रखा गया है, क्योंकि युवक रोमी सेनापति से बोल रहा है। भाषा स्वाभाविक और गरिमापूर्ण है; ‘नीचे’ मूल क्रिया की दिशात्मकता को सुरक्षित रखता है।
