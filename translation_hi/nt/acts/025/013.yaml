lexical_decisions:
- source_word: Ἡμερῶν δὲ διαγενομένων τινῶν
  choice: कुछ दिन बीतने के बाद
  rationale: यह संबंधकारक निरपेक्ष रचना समय की पृष्ठभूमि बताती है। δέ का हल्का कथात्मक संबंध हिन्दी में अलग शब्द जोड़ने के बिना स्वाभाविक रूप से व्यक्त हो जाता है।
- source_word: Ἀγρίππας ὁ βασιλεὺς
  choice: राजा अग्रिप्पा
  rationale: हिन्दी की स्वाभाविक पद-नाम संरचना अपनाते हुए βασιλεύς की वास्तविक राजकीय उपाधि सुरक्षित रखी गई है।
- source_word: Βερνίκη
  choice: बिरनीके
  rationale: यूनानी उच्चारण और वर्तनी के निकट देवनागरी लिप्यंतरण चुना गया है; प्रचलित वैकल्पिक रूप फुटनोट में दिया गया है।
- source_word: κατήντησαν εἰς Καισάρειαν
  choice: कैसरिया पहुँचे
  rationale: यात्रा के गंतव्य तक आने का भाव हिन्दी में ‘पहुँचे’ से सहज और सटीक व्यक्त होता है।
- source_word: ἀσπασάμενοι τὸν Φῆστον
  choice: फ़ेस्तुस से भेंट करने
  rationale: ἀσπάζομαι यहाँ अभिवादन या शिष्टाचारपूर्ण मुलाकात का भाव रखता है। ‘भेंट करने’ प्रसंग में स्वाभाविक है और दरबारी सम्मान की अतिरिक्त धारणा नहीं जोड़ता।
- source_word: Φῆστον
  choice: फ़ेस्तुस
  rationale: यूनानी रूप के निकट और हिन्दी में स्पष्ट देवनागरी लिप्यंतरण।
