source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἀδικῶ καὶ ἄξιον θανάτου πέπραχά τι, οὐ παραιτοῦμαι τὸ ἀποθανεῖν· εἰ δὲ οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου, οὐδείς με δύναται αὐτοῖς χαρίσασθαι· Καίσαρα ἐπικαλοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: hi
  text: अतः यदि मैं अन्याय कर रहा हूँ और मैंने ऐसा कुछ किया है जो मृत्यु के योग्य है, तो मैं मरने से इनकार नहीं करता। लेकिन यदि जिन बातों का ये लोग मुझ पर आरोप लगाते हैं, उनमें कुछ भी नहीं है, तो कोई भी मुझे उन्हें खुश करने के लिए उनके हवाले नहीं कर सकता[a]। मैं कैसर से अपील करता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, «कोई मुझे उनके पक्ष में उन्हें नहीं सौंप सकता।» यूनानी क्रिया में किसी को कृपा या रियायत के तौर पर सौंप देने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: मैं अन्याय कर रहा हूँ
  rationale: वर्तमान काल के नैतिक-कानूनी भाव को बनाए रखता है और दोष को किसी अधिक विशिष्ट अपराध तक सीमित नहीं करता।
- source_word: ἄξιον θανάτου
  choice: मृत्यु-दण्ड के योग्य
  rationale: न्यायिक संदर्भ में मृत्यु के योग्य होने और प्राणदण्ड की देयता, दोनों भाव स्पष्ट करता है।
- source_word: πέπραχά τι
  choice: मैंने ऐसा कुछ किया है
  rationale: पूर्ण काल की वर्तमान प्रासंगिकता और अनिश्चित τι की व्यापकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: मैं मरने से इनकार नहीं करता
  rationale: παραιτέομαι के ‘अस्वीकार करना’ भाव को सीधे व्यक्त करता है और दोषी होने की दशा में मृत्यु स्वीकारने की सशर्त बात बनाए रखता है।
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: जिन बातों का ये लोग मुझ पर आरोप लगा रहे हैं, यदि उनमें कोई सच्चाई नहीं है
  rationale: आरोपों के निराधार होने का मुहावरेदार अर्थ स्पष्ट करता है; ‘सच्चाई’ निहित अर्थ को व्यक्त करती है, किसी अतिरिक्त कानूनी निष्कर्ष को नहीं।
- source_word: χαρίσασθαι
  choice: उन पर उपकार करने के लिए उनके हवाले करना
  rationale: क्रिया में निहित किसी को कृपा या रिआयत के रूप में सौंप देने का भाव सुरक्षित रहता है।
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: मैं कैसर से न्याय की अपील करता हूँ
  rationale: रोमी सम्राट के समक्ष की गई तकनीकी कानूनी अपील को सामान्य हिन्दी पाठक के लिए स्पष्ट करता है।
- source_word: μὲν οὖν ... δὲ
  choice: इसलिए यदि ... लेकिन ... यदि
  rationale: दो परस्पर-विरोधी सशर्त शाखाओं और पिछले कथन से उनके तर्कसंगत संबंध को सहज हिन्दी में दर्शाता है।
theological_decisions:
- issue: मृत्यु-दण्ड और न्यायिक अपील के विषय में पौलुस के कथन का आशय
  choice: पौलुस दोष सिद्ध होने की स्थिति में मृत्यु स्वीकारने की सशर्त तत्परता व्यक्त करता है, पर निराधार आरोपों पर अभियोग लगाने वालों को सौंपे जाने का विरोध करता है।
  alternative: इसे हर परिस्थिति में मृत्यु-दण्ड की व्यापक धार्मिक स्वीकृति अथवा केवल अलंकारिक कथन समझना।
  rationale: पद का मुख्य प्रसंग कानूनी है। अनुवाद सशर्त स्वीकार और न्याय की माँग दोनों को रखता है, पर इससे कोई व्यापक साम्प्रदायिक सिद्धान्त नहीं निकालता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कानूनी प्रसंग के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध भाषा। ‘कैसर’ ऐतिहासिक पदनाम के रूप में रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि χαρίσασθαι का कृपा/उपकार वाला भाव मुख्य पाठ में व्यक्त है।
