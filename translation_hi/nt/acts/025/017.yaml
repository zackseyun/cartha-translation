  text: συνελθόντων ⸀οὖν ἐνθάδε ἀναβολὴν μηδεμίαν ποιησάμενος τῇ ἑξῆς καθίσας ἐπὶ τοῦ βήματος ἐκέλευσα ἀχθῆναι τὸν ἄνδρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/017.yaml
  text: So when they had come together here[a], I made no delay, but on the next day I sat on the judgment seat and ordered the man to be brought.
translation:
  language: hi
  text: इसलिए जब वे यहाँ इकट्ठे हुए, तो मैंने कोई देर नहीं की, बल्कि अगले दिन न्यायासन[a] पर बैठकर उस आदमी को लाए जाने का आदेश दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय-मंच पर अपना आसन ग्रहण करके।” यूनानी शब्द βῆμα अधिकारी के न्यायिक आसन या न्यायिक मंच को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελθόντων
  choice: जब वे यहाँ इकट्ठे हुए
  rationale: यह सम्बन्धकारक निरपेक्ष रचना है, जिसका निहित कर्ता पौलुस के अभियोग लगाने वाले लोग हैं। ‘इकट्ठे हुए’ सभा के लिए साथ आने का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह फेस्तुस के कथन में पिछले प्रसंग से निष्कर्ष अथवा क्रमसूचक सम्बन्ध दिखाता है।
- source_word: ἐνθάδε
  choice: यहाँ
  rationale: स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἀναβολὴν μηδεμίαν ποιησάμενος
  choice: मैंने कोई देर नहीं की
  rationale: यह मुहावरा कार्यवाही को न टालने का अर्थ देता है; चुना हुआ रूप कानूनी-प्रशासनिक आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: τῇ ἑξῆς
  choice: अगले ही दिन
  rationale: यह कालवाचक प्रयोग अगले दिन को सूचित करता है। ‘ही’ इस बात को स्पष्ट करता है कि कोई विलम्ब नहीं किया गया, बिना अर्थ में नया तथ्य जोड़े।
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: न्यायासन पर बैठकर
  rationale: βῆμα यहाँ अधिकारी के न्यायिक आसन अथवा न्याय-मंच को दर्शाता है। ‘न्यायासन’ संक्षिप्त, गरिमापूर्ण और सन्दर्भानुकूल है।
- source_word: ἐκέλευσα
  choice: आदेश दिया
  rationale: यह आधिकारिक निर्देश देने को व्यक्त करता है; न्यायिक प्रसंग में ‘आदेश दिया’ स्वाभाविक है।
- source_word: ἀχθῆναι
  choice: लाए जाने
  rationale: ἄγω के कर्मवाच्य अनन्त रूप का सीधा अर्थ रखा गया है; ‘अन्दर’ जैसा कोई अनकहा स्थानवाचक तत्व नहीं जोड़ा गया।
- source_word: τὸν ἄνδρα
  choice: उस आदमी को
  rationale: यह पौलुस के लिए प्रयुक्त सामान्य पुरुषवाचक संज्ञा है। ‘आदमी’ आधुनिक हिन्दी में स्वाभाविक है और मूल में स्पष्ट न किए गए ‘अभियुक्त’ जैसे विवरण को नहीं जोड़ता।
