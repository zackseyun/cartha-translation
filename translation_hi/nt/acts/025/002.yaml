lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: अपना मामला रखा
  rationale: राज्यपाल के सामने कानूनी प्रसंग में यह क्रिया किसी विषय को अधिकारी के समक्ष रखने या आरोप प्रस्तुत करने का भाव देती है। ‘अपना मामला रखा’ न्यायिक संकेत को व्यक्त करता है, पर यूनानी से अधिक स्पष्ट औपचारिक अभियोग नहीं जोड़ता।
- source_word: τέ
