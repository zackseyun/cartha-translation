  rationale: यह संयोजक कण पिछले कथन से कथा का संबंध जोड़ता है। आधुनिक हिन्दी में ‘तब’ स्वाभाविक कथात्मक संक्रमण देता है।
- source_word: αὐτῷ
  choice: उसके सामने
  rationale: संदर्भ में सर्वनाम फेस्तुस की ओर संकेत करता है। कानूनी प्रसंग में ‘उसके सामने’ हिन्दी में अधिकारी के समक्ष मामला रखने का स्वाभाविक प्रयोग है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: यरूशलेम के उच्च पुरोहितीय नेतृत्व के लिए यह प्रचलित और स्पष्ट हिन्दी पद है तथा यूनानी बहुवचन को बनाए रखता है।
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: यहूदियों के प्रमुख लोगों
  rationale: πρῶτοι यहाँ सामाजिक या राजनीतिक प्रतिष्ठा रखने वाले प्रमुख व्यक्तियों को दर्शाता है। यह अनुवाद यूनानी संबंधवाचक संरचना और समूह के विशिष्ट अभिजात भाव को सुरक्षित रखता है।
- source_word: κατὰ τοῦ Παύλου
  choice: पौलुस के विरुद्ध
  rationale: यहाँ κατά के साथ संबंधकारक विरोध और आरोप का भाव देता है; ‘के विरुद्ध’ इस प्रतिकूल कानूनी मुद्रा को स्पष्ट करता है।
- source_word: παρεκάλουν
  choice: आग्रह करने लगे
  rationale: अपूर्णकालिक क्रिया निरंतर या बार-बार किए जा रहे अनुरोध का संकेत दे सकती है। ‘आग्रह करने लगे’ प्रसंगानुकूल दबावपूर्ण निवेदन और चलती हुई क्रिया दोनों व्यक्त करता है।
- source_word: αὐτόν
  choice: उससे
  rationale: यह सर्वनाम पुनः फेस्तुस की ओर संकेत करता है और हिन्दी क्रिया ‘आग्रह करना’ के साथ ‘उससे’ स्वाभाविक कारक-रूप है।
