id: ACT.25.21
reference: Acts 25:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοῦ δὲ Παύλου ἐπικαλεσαμένου τηρηθῆναι αὐτὸν εἰς τὴν τοῦ Σεβαστοῦ διάγνωσιν, ἐκέλευσα τηρεῖσθαι αὐτὸν ἕως οὗ ⸀ἀναπέμψω αὐτὸν πρὸς Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: hi
  text: पर जब पौलुस ने अपील की कि उसे सम्राट[a] के न्याय-निर्णय के लिए हिरासत में रखा जाए, तो मैंने आदेश दिया कि उसे तब तक हिरासत में रखा जाए, जब तक मैं उसे कैसर के पास न भेज दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘सेबास्तोस’ है, जिसका अर्थ ‘परम आदरणीय’ है; यह रोमी सम्राट की उपाधि थी और लातीनी ‘औगुस्तुस’ के समकक्ष थी।
    reason: मूल यूनानी शाही उपाधि और उसके ऐतिहासिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: अपील की
  rationale: रोमी कानूनी संदर्भ में यह औपचारिक रूप से उच्च अधिकारी के समक्ष अपील करने को दर्शाता है; ‘अपील की’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: हिरासत में रखा जाए
  rationale: यहाँ τηρέω साधारण रखवाली नहीं, बल्कि आधिकारिक बंदी-अवस्था को सूचित करता है। दोनों प्रयोगों में एक ही अनुवाद रखा गया है।
- source_word: διάγνωσιν
  choice: न्याय-निर्णय
  rationale: संज्ञा न्यायिक जाँच के फलस्वरूप किए जाने वाले निर्णय को दर्शा सकती है। ‘न्याय-निर्णय’ कानूनी संदर्भ स्पष्ट करता है, पर दोषसिद्धि का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: Σεβαστοῦ
  choice: सम्राट
  rationale: Σεβαστός यहाँ रोमी शासक की उपाधि है, निजी नाम नहीं। ‘सम्राट’ सामान्य हिन्दी पाठक के लिए इसका स्वाभाविक संदर्भगत अनुवाद है; मूल उपाधि की जानकारी पादटिप्पणी में दी गई है।
- source_word: ἀναπέμψω
  choice: भेज दूँ
  rationale: संदर्भ में पौलुस को उच्चतर शाही प्राधिकारी के पास भेजना अभिप्रेत है। हिन्दी में ‘भेज दूँ’ इस भाव को सहज रूप से व्यक्त करता है।
- source_word: πρὸς Καίσαρα
  choice: कैसर के पास
  rationale: Καίσαρ यहाँ रोमी सम्राट की ऐतिहासिक उपाधि के रूप में प्रयुक्त है। ‘कैसर’ शब्दावली की ऐतिहासिक विशिष्टता बनाए रखता है।
