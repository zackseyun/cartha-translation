  register: भाषा आधुनिक, गरिमापूर्ण और न्यायिक प्रसंग के अनुरूप रखी गई है। ‘अपील’, ‘हिरासत’ और ‘न्याय-निर्णय’ आज के पाठक के लिए स्पष्ट कानूनी शब्द हैं; ‘कैसर’ ऐतिहासिक पदनाम को सुरक्षित रखता है।
