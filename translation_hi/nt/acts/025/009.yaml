source:
  edition: SBLGNT
  text: ὁ Φῆστος δὲ ⸂θέλων τοῖς Ἰουδαίοις⸃ χάριν καταθέσθαι ἀποκριθεὶς τῷ Παύλῳ εἶπεν· Θέλεις εἰς Ἱεροσόλυμα ἀναβὰς ἐκεῖ περὶ τούτων ⸀κριθῆναι ἐπ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: hi
  text: परन्तु फ़ेस्तुस यहूदियों[a] पर उपकार करना चाहता था; इसलिए उसने पौलुस को उत्तर दिया, “क्या तुम यरूशलेम जाकर वहाँ इन बातों के विषय में मेरे सामने तुम्हारे मामले की सुनवाई होने देना चाहते हो?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “यहूदियों” से प्रसंगानुसार पौलुस पर अभियोग लगाने वाले यहूदी अगुए या अभियोगकर्ता अभिप्रेत हैं, बिना भेद किए सभी यहूदी लोग नहीं।
    reason: cultural_note
  - marker: b
    text: या, “इन बातों के विषय में मेरे सामने तुम्हारा न्याय किया जाए?” अथवा “मेरे सामने तुम्हारे मामले की सुनवाई हो?”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: चाहता था
  rationale: वर्तमान कृदन्त फ़ेस्तुस की उस समय जारी मंशा को व्यक्त करता है; यह सहज आधुनिक हिन्दी है।
- source_word: τοῖς Ἰουδαίοις
  choice: यहूदियों
  rationale: मूल यूनानी का व्यापक जातीय-धार्मिक पद सुरक्षित रखा गया है; प्रसंग में इसका संकेत मुकदमा चलाने वाले यहूदी अभियोगकर्ताओं या अगुओं की ओर है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: χάριν καταθέσθαι
  choice: पर कृपा करना
  rationale: यह मुहावरा किसी का उपकार करने या उसका अनुग्रह अर्जित करने का भाव रखता है। ‘कृपा करना’ राजनीतिक चालाकी का ऐसा अतिरिक्त भाव नहीं जोड़ता जो यूनानी में अनिवार्य नहीं है।
- source_word: ἀποκριθεὶς τῷ Παύλῳ εἶπεν
  choice: उसने पौलुस से कहा
  rationale: हिन्दी कथन-शैली में ‘उत्तर देकर कहा’ अनावश्यक रूप से दोहरावपूर्ण होता; ‘से कहा’ संवाद आरम्भ होने का स्वाभाविक अर्थ देता है।
- source_word: Θέλεις
  choice: क्या तुम ... चाहते हो
  rationale: यह पौलुस की इच्छा के विषय में सीधा प्रश्न है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: यरूशलेम जाकर
  rationale: हिन्दी में ‘यरूशलेम को ऊपर जाकर’ अस्वाभाविक है; ‘जाकर’ गन्तव्य को स्पष्ट रखते हुए मूल क्रिया का व्यावहारिक अर्थ देता है।
- source_word: περὶ τούτων
  choice: इन बातों के विषय में
  rationale: यह विवादाधीन विषयों का व्यापक उल्लेख बनाए रखता है और मूल से अधिक विशिष्ट ‘आरोपों’ को पाठ में नहीं जोड़ता।
- source_word: κριθῆναι
  choice: अपना मुकदमा चलवाना
  rationale: न्यायिक प्रसंग में कर्मवाच्य क्रिया का अर्थ मुकदमे की सुनवाई या न्यायिक निर्णय के अधीन होना है; यह हिन्दी में ‘न्याय किया जाना’ से अधिक स्पष्ट और स्वाभाविक है।
- source_word: ἐπ’ ἐμοῦ
  choice: मेरे सामने
  rationale: यह फ़ेस्तुस की उपस्थिति और अध्यक्षतापूर्ण अधिकार को व्यक्त करता है, पर यह अनावश्यक रूप से नहीं कहता कि वही अकेला निर्णायक होगा।
theological_decisions:
- issue: ‘यहूदियों’ से सभी यहूदियों पर दोष मढ़े जाने की सम्भावना
  choice: मुख्य पाठ में मूल के अनुरूप ‘यहूदियों’ रखा और पादटिप्पणी में प्रसंगगत सीमा स्पष्ट की।
  alternative: ‘यहूदी अगुओं’ या ‘यहूदी अभियोगकर्ताओं’ को मुख्य पाठ में रखना।
  rationale: मूल पद की व्यापकता सुरक्षित रखना आवश्यक है, जबकि प्रसंग यह बताता है कि यहाँ पौलुस पर अभियोग लगाने वाले पक्ष की बात है, हर यहूदी व्यक्ति की नहीं।
- issue: κριθῆναι का न्यायिक अर्थ
  choice: ‘अपना मुकदमा चलवाना’
  alternative: ‘न्याय किया जाना’ या ‘मुकदमे की सुनवाई करवाना’
  rationale: चुना हुआ रूप न्यायिक कार्यवाही को स्पष्ट करता है और यह खुला रखता है कि बात सुनवाई, विचार और निर्णय की समग्र प्रक्रिया की है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज न्यायिक कथन। ‘फ़ेस्तुस’, ‘पौलुस’ और ‘यरूशलेम’ प्रचलित बाइबलीय नाम-रूप हैं। ‘परन्तु’ कथात्मक विरोध को और ‘इसलिए’ यूनानी वाक्य-संरचना में निहित प्रेरणा से कथन की ओर संक्रमण को स्वाभाविक बनाता है।
