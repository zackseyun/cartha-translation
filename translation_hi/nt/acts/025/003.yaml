lexical_decisions:
- source_word: αἰτούμενοι χάριν κατ’ αὐτοῦ
  choice: उसके विरुद्ध यह कृपा माँगी
  rationale: यूनानी मुहावरे में किसी से अनुग्रह या रियायत माँगने का भाव है; κατ’ αὐτοῦ संदर्भ में पौलुस के विरुद्ध शत्रुतापूर्ण आशय व्यक्त करता है।
- source_word: ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ
  choice: कि वह पौलुस को यरूशलेम बुलवा भेजे
  rationale: ὅπως अनुरोध की विषयवस्तु/मंशा बताता है। μεταπέμψηται का अर्थ किसी को बुलाने के लिए संदेश भेजना अथवा उसे मँगवाना है; 'बुलवा भेजे' इस कारणात्मक भाव को स्वाभाविक हिंदी में रखता है। सर्वनाम की अस्पष्टता से बचने हेतु संदर्भानुसार 'पौलुस' रखा गया है।
- source_word: ἐνέδραν ποιοῦντες
  choice: वे ... घात लगा रहे थे
  rationale: सहवर्ती कृदंत उस समय चल रही गुप्त कार्रवाई बताता है; 'घात लगाना' आधुनिक हिंदी का स्वाभाविक और सटीक प्रयोग है।
- source_word: ἀνελεῖν αὐτὸν
  choice: उसे ... मार डालने के लिए
  rationale: यहाँ ἀναιρέω स्पष्टतः हत्या करने का अर्थ देता है; 'मार डालना' प्रत्यक्ष है और अनावश्यक कानूनी या नैतिक अर्थ नहीं जोड़ता।
- source_word: κατὰ τὴν ὁδόν
  choice: रास्ते में
  rationale: यात्रा के मार्ग पर किए जाने वाले हमले के लिए संक्षिप्त और स्वाभाविक हिंदी अभिव्यक्ति।
