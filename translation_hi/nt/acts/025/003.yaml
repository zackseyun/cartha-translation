  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद पिछले वाक्य पर व्याकरणतः निर्भर है, इसलिए आरंभ में “और” रखा गया है। मुख्य पाठ में शत्रुतापूर्ण अनुरोध और साथ-साथ रची जा रही घात स्पष्ट हैं, जबकि μεταπέμψηται की वास्तविक अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है।
