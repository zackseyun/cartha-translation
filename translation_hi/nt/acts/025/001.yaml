lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से कथा की परिणति और आगे बढ़ने का संकेत देता है; ‘इसलिए’ इसके संयोजक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐπιβὰς τῇ ἐπαρχείᾳ
  choice: प्रान्त में पहुँचने के
  rationale: कृदन्त का मूल भाव प्रान्त में प्रवेश या वहाँ पहुँचने का है। यह अनुवाद समय-संबंध को स्पष्ट रखता है और पदभार सँभालने का आशय अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐπαρχείᾳ
  choice: प्रान्त
  rationale: यह रोमी प्रशासनिक प्रान्त के लिए सीधा और ऐतिहासिक रूप से उपयुक्त शब्द है।
- source_word: μετὰ τρεῖς ἡμέρας
  choice: तीन दिन बाद
  rationale: μετά के साथ कर्मकारक यहाँ समय में उत्तरवर्तिता बताता है; आधुनिक हिन्दी में ‘तीन दिन बाद’ स्वाभाविक है।
- source_word: ἀνέβη
  choice: गया
  rationale: यूनानी क्रिया यरूशलेम की ओर ‘ऊपर जाने’ की पारंपरिक भौगोलिक अभिव्यक्ति है, पर आधुनिक हिन्दी में ‘गया’ अधिक स्वाभाविक है; दिशा कैसरिया से यरूशलेम तक स्पष्ट है।
- source_word: εἰς Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: गन्तव्य को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त करता है।
- source_word: ἀπὸ Καισαρείας
  choice: कैसरिया से
  rationale: ἀπό प्रस्थान-बिन्दु बताता है; ‘कैसरिया से’ इसका सटीक रूप है।
- source_word: Φῆστος
  choice: फ़ेस्तुस
  rationale: यूनानी नाम Φῆστος का देवनागरी में निकट और प्रचलित लिप्यंतरण।
