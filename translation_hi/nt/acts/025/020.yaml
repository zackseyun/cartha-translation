  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सुबोध और हल्का न्यायिक-प्रशासनिक भाव रखा गया है। यूनानी ζήτησιν की संज्ञात्मक रचना को ‘जाँच’ से बनाए रखा गया है; अस्पष्ट वैकल्पिक अर्थ ‘विवाद’ पादटिप्पणी में दिया गया है।
