  text: ἀπορούμενος δὲ ἐγὼ τὴν περὶ ⸀τούτων ζήτησιν ἔλεγον εἰ βούλοιτο πορεύεσθαι εἰς ⸀Ἱεροσόλυμα κἀκεῖ κρίνεσθαι περὶ τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: hi
  text: इन बातों की जाँच के विषय में असमंजस में पड़कर[a] मैंने उससे पूछा कि क्या वह यरूशलेम जाना चाहता था और वहाँ इन बातों के विषय में उसका न्याय हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन बातों से जुड़े विवाद के विषय में असमंजस में पड़कर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπορούμενος
  choice: असमंजस में पड़कर
  rationale: यह कृदन्त फेस्तुस की अनिश्चितता या उलझन व्यक्त करता है; यह हिंदी प्रयोग स्वाभाविक है और संदर्भ में निहित कारणात्मक संबंध को भी रहने देता है।
- source_word: ζήτησιν
  choice: जाँच
  rationale: न्यायिक-प्रशासनिक संदर्भ में यह विचाराधीन पूछताछ या जाँच को सूचित करता है; वैकल्पिक अर्थ ‘विवाद’ पादटिप्पणी में सुरक्षित है।
- source_word: περὶ τούτων
  choice: इन बातों के विषय में
  rationale: यह आरोपों और विचाराधीन विषयों की ओर संकेत करने वाला औपचारिक किंतु सुबोध कानूनी प्रयोग है।
- source_word: ἔλεγον
  choice: मैंने उससे पूछा
  rationale: शाब्दिक अर्थ ‘मैं कह रहा था’ है, पर εἰ से आरम्भ अप्रत्यक्ष प्रश्न के कारण यहाँ क्रियात्मक अर्थ ‘पूछा’ है।
- source_word: εἰ βούλοιτο
  choice: क्या वह ... जाना चाहता है
  rationale: अप्रत्यक्ष प्रश्न में यह पौलुस की इच्छा जानने को व्यक्त करता है; ‘इच्छुक है’ भी संभव है।
- source_word: πορεύεσθαι
  choice: जाना
  rationale: गंतव्य के साथ सामान्य और स्वाभाविक हिंदी रूप।
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: स्थान-नाम का हिंदी में प्रचलित बाइबलीय रूप।
- source_word: κἀκεῖ
  choice: और वहाँ
  rationale: संयुक्त अर्थ ‘और वहाँ’ को स्वाभाविक हिंदी क्रम में रखा गया है।
- source_word: κρίνεσθαι
  choice: उसका न्याय किया जाए
  rationale: न्यायिक निष्पादन का व्यापक अर्थ सुरक्षित रहता है और इसे केवल औपचारिक मुकदमे तक सीमित नहीं किया जाता।
- source_word: περὶ τούτων
  choice: इन बातों के विषय में
  rationale: दूसरी आवृत्ति को बनाए रखने से यूनानी पाठ की पुनरुक्ति और संदर्भ स्पष्ट रहते हैं।
