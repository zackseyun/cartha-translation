base_translation:
  language: en
  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: hi
  text: तब अग्रिप्पा ने फेस्तुस से कहा, “मैं स्वयं भी उस व्यक्ति को सुनना चाहता हूँ।” फेस्तुस ने कहा,[a] “कल आप उसे सुनेंगे।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यहाँ ऐतिहासिक वर्तमान है: “वह कहता है।”'
    reason: lexical_alternative
  - marker: b
    text: या, “आप उसकी बात सुनेंगे।” यूनानी अभिव्यक्ति का अर्थ उस व्यक्ति को स्वयं बोलते हुए सुनना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας
  choice: अग्रिप्पा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: δὲ
  choice: तब
  rationale: यहाँ कथा की प्रगति को स्वाभाविक हिन्दी में व्यक्त करता है, बिना प्रबल विरोध का भाव जोड़े।
- source_word: πρὸς τὸν Φῆστον
  choice: फेस्तुस से कहा
  rationale: बोलने की दिशा बताने वाले यूनानी वाक्यांश को स्वाभाविक हिन्दी संवाद-रचना में व्यक्त किया गया है।
- source_word: Ἐβουλόμην
  choice: सुनना चाहता हूँ
  rationale: संदर्भ में अग्रिप्पा की विनम्र वर्तमान इच्छा को स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी अपूर्ण भूतकाल को शब्दशः रखने पर हिन्दी में अनचाहा पूर्वकालीन अर्थ उभर सकता है।
- source_word: καὶ αὐτὸς
  choice: मैं स्वयं भी
  rationale: καί के योगात्मक और αὐτός के बलसूचक—दोनों संभावित बलों को संक्षेप में बनाए रखता है।
- source_word: τοῦ ἀνθρώπου
  choice: इस मनुष्य को
  rationale: यह पौलुस नामक विशिष्ट पुरुष की ओर संकेत करता है; ‘इस’ हिन्दी संदर्भ में पहचाने हुए व्यक्ति को स्वाभाविक ढंग से सूचित करता है।
- source_word: Αὔριον
  choice: कल
  rationale: समयवाचक क्रियाविशेषण का सीधा और स्वाभाविक अनुवाद।
- source_word: φησίν
  choice: उसने कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथा की सामान्य भूतकालीन शैली में सहज बनाया गया है; मूल रूप की सूचना पादटिप्पणी में है।
- source_word: ἀκούσῃ αὐτοῦ
  choice: आप उसकी बात सुनेंगे
  rationale: संबंधकारक के साथ ἀκούω यहाँ उस व्यक्ति को बोलते हुए सुनने का अर्थ देता है; यह हिन्दी में ‘उसे सुनेंगे’ की अपेक्षा अधिक स्वाभाविक और स्पष्ट है।
