base_translation:
  language: en
  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: hi
  text: इसलिए[a] तुममें से जो प्रभावशाली लोग हैं, वे मेरे साथ नीचे जाएँ; और यदि उस व्यक्ति में कुछ अनुचित है, तो वे उस पर आरोप लगाएँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुममें से जो समर्थ लोग हैं,’ ‘तुममें जो प्रमुख लोग हैं,’ अथवा ‘तुममें जो अधिकार-संपन्न लोग हैं।’ यूनानी δυνατοί का अर्थ समर्थ, प्रभावशाली, प्रमुख, या अधिकार रखने वाले लोग हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तो वे उसके विरुद्ध अभियोग प्रस्तुत करें।’
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν
  choice: इसलिए ... वे
  rationale: οὖν कथन की तार्किक निरंतरता या निष्कर्ष को दिखाता है; हिन्दी में ‘इसलिए’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: तुममें जो समर्थ लोग हैं
  rationale: δυνατοί का अर्थ सामर्थ्यवान, प्रभावशाली, अधिकार-संपन्न अथवा सक्षम हो सकता है। ‘समर्थ लोग’ इस संदर्भ में साथ जाकर विधिवत आरोप लगाने की योग्यता/हैसियत को व्यक्त करता है और यूनानी की वास्तविक अर्थगत अस्पष्टता को पूरी तरह समाप्त नहीं करता।
- source_word: φησίν
  choice: मुख्य पाठ में अलग से व्यक्त नहीं
  rationale: यह बीच में आया हुआ ‘वह कहता है’ है, जो कथन का श्रेय वक्ता को देता है। प्रत्यक्ष कथन के प्रवाह में हिन्दी में इसे दोहराना अस्वाभाविक होगा।
- source_word: συγκαταβάντες
  choice: मेरे साथ नीचे चलें
  rationale: σύν का साथ होने का भाव ‘मेरे साथ’ से और καταβαίνω का भौगोलिक ‘नीचे जाना’ ‘नीचे चलें’ से व्यक्त हुआ है।
- source_word: εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ἄτοπον
  choice: यदि इस व्यक्ति में कोई अनुचित बात है
  rationale: शर्त और अनिश्चितता सुरक्षित रखी गई है। ἄτοπον को ‘अपराध’ कहना आवश्यकता से अधिक कानूनी और निश्चित होता; ‘अनुचित बात’ उसके व्यापक अर्थ को बनाए रखता है।
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: वे उस पर आरोप लगाएँ
  rationale: कानूनी प्रसंग में κατηγορέω का स्वाभाविक हिन्दी रूप ‘आरोप लगाना’ है; इससे अभियोग प्रस्तुत करने का भाव स्पष्ट होता है।
