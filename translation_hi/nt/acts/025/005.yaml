  to: इसलिए[a] तुममें से जो प्रभावशाली लोग हैं, वे मेरे साथ नीचे जाएँ; और यदि उस व्यक्ति में कुछ अनुचित है, तो वे उस पर आरोप लगाएँ।[b]
