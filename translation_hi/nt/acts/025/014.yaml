  text: ὡς δὲ πλείους ἡμέρας ⸀διέτριβον ἐκεῖ, ὁ Φῆστος τῷ βασιλεῖ ἀνέθετο τὰ κατὰ τὸν Παῦλον λέγων· Ἀνήρ τίς ἐστιν καταλελειμμένος ὑπὸ Φήλικος δέσμιος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/014.yaml
  text: And as they stayed there many days[a], Festus laid before the king the matters concerning Paul, saying[b], “There is a certain man left behind by Felix as a prisoner,”
translation:
  language: hi
  text: जब वे वहाँ कई दिन ठहरे, तो फेस्तुस ने राजा के सामने पौलुस से संबंधित बातें[b] रखीं[a] और कहा, “एक व्यक्ति है, जिसे फेलिक्स कैदी के रूप में छोड़ गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजा को इसकी सूचना दी।” यूनानी शब्द का भाव केवल जानकारी देने के बजाय किसी विषय को विचार के लिए सामने रखना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “पौलुस का मामला।” यह पदबंध विशेष रूप से पौलुस की कानूनी स्थिति की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείους ἡμέρας
  choice: बहुत दिनों तक
  rationale: समय-सूचक इस प्रयोग में तुलनात्मक रूप πλείους प्रसंगानुसार लंबी अवधि, अर्थात ‘बहुत’ या ‘कई’ दिनों का भाव देता है; यहाँ अनावश्यक रूप से ‘और अधिक दिन’ कहना उचित नहीं।
- source_word: διέτριβον
  choice: ठहरे रहे
  rationale: διατρίβω किसी स्थान पर समय बिताने या ठहरे रहने को व्यक्त करता है। अपूर्ण काल के साथ ‘ठहरे रहे’ जारी रहने का भाव स्वाभाविक रूप से देता है।
- source_word: ἀνέθετο
  choice: सामने ... रखीं
  rationale: मध्यवाच्य ἀνατίθεμαι किसी विषय को विचार के लिए किसी के सामने रखने का अर्थ दे सकता है; यह केवल सूचना देने से अधिक विशिष्ट है।
- source_word: τὰ κατὰ τὸν Παῦλον
  choice: पौलुस से संबंधित बातें
  rationale: यूनानी बहुवचन पदबंध पौलुस से जुड़े विषयों या उसकी कानूनी स्थिति को सूचित करता है। ‘बातें’ बहुवचन और मूल की सामान्यता बनाए रखता है।
- source_word: Ἀνήρ τίς
  choice: एक व्यक्ति
  rationale: यह पदबंध किसी अनिश्चित किंतु विशिष्ट पुरुष का परिचय देता है। आधुनिक हिंदी में ‘एक व्यक्ति’ सहज और सम्मानजनक है।
- source_word: καταλελειμμένος
  choice: छोड़ गया था
  rationale: पूर्ण निष्क्रिय कृदंत किसी को पीछे छोड़ दिए जाने और उसकी बनी हुई अवस्था को दर्शाता है; हिंदी वाक्य-रचना में कर्ता ‘फेलिक्स’ के साथ सक्रिय रूप अधिक स्वाभाविक है।
- source_word: δέσμιος
  choice: कैदी के रूप में
  rationale: यह बताता है कि फेलिक्स ने उस व्यक्ति को कैदी की स्थिति में छोड़ा था; ‘कैदी के रूप में’ इस विधेयात्मक संबंध को स्पष्ट रखता है।
- source_word: βασιλεῖ
  choice: राजा
  rationale: मूल पाठ इस पद में नाम दोहराए बिना केवल उपाधि देता है; संदर्भ से राजा की पहचान स्पष्ट है।
