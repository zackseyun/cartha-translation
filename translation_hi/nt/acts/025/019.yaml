  text: ζητήματα δέ τινα περὶ τῆς ἰδίας δεισιδαιμονίας εἶχον πρὸς αὐτὸν καὶ περί τινος Ἰησοῦ τεθνηκότος, ὃν ἔφασκεν ὁ Παῦλος ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: hi
  text: बल्कि, पौलुस के साथ उनके कुछ विवाद उनके अपने धर्म[a] और किसी यीशु के विषय में थे, जो मर चुका था और जिसके बारे में पौलुस दावा करता था कि वह जीवित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके अपने अंधविश्वास।” यूनानी शब्द का प्रयोग तटस्थ अर्थ में धर्म के लिए या किसी बाहरी व्यक्ति द्वारा अधिक निंदात्मक अर्थ में अंधविश्वास के लिए हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: विवाद ... कुछ विषयों को लेकर
  rationale: यह शब्द केवल तटस्थ प्रश्नों के बजाय विवादित विषयों को दर्शाता है; हिंदी में यह संरचना विरोधात्मक संदर्भ को स्वाभाविक रूप से व्यक्त करती है।
- source_word: δέ
  choice: बल्कि
  rationale: पिछली आयत में अपेक्षित अपराधों के अभाव और वास्तविक आरोपों के बीच सुधारात्मक विरोध को स्पष्ट करता है।
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: उनकी अपनी धार्मिक मान्यताओं से जुड़े
  rationale: δεισιδαιμονία धर्म अथवा अंधविश्वास, दोनों अर्थच्छायाएँ रख सकता है। मुख्य पाठ में तटस्थ और सहज पद रखा गया है, जबकि संभावित निंदात्मक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: εἶχον πρὸς αὐτόν
  choice: उनके साथ उसका विवाद
  rationale: यूनानी वाक्य-विन्यास बताता है कि आरोपियों और पौलुस के बीच विवाद था; हिंदी में कर्ताओं को स्पष्ट करने के लिए स्वाभाविक पुनर्गठन किया गया है।
- source_word: περί τινος Ἰησοῦ
  choice: किसी यीशु के विषय में
  rationale: τινος फेस्तुस की दूरी या अपरिचय को व्यक्त करता है; ‘किसी यीशु’ इस भाव को बनाए रखता है।
- source_word: τεθνηκότος
  choice: जो मर चुका था
  rationale: पूर्ण कृदंत मृत्यु से उत्पन्न वर्तमान अवस्था दर्शाता है और जीवित होने के दावे के साथ स्पष्ट विरोध बनाता है।
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: जिसके बारे में पौलुस दावा करता था कि वह जीवित है
  rationale: φάσκω किसी कथन को बिना समर्थन दिए ‘दावा करना’ के रूप में प्रस्तुत कर सकता है; यह फेस्तुस के बाहरी दृष्टिकोण को सुरक्षित रखता है।
theological_decisions:
- issue: फेस्तुस के कथन में δεισιδαιμονία का अनुवाद
  choice: धार्मिक मान्यताओं
  alternative: अंधविश्वास
  rationale: मुख्य पाठ में आधुनिक हिंदी का अत्यधिक निंदात्मक अर्थ थोपे बिना धार्मिक संदर्भ व्यक्त किया गया है। यूनानी शब्द की संभावित निंदात्मक छाया पादटिप्पणी में दी गई है।
- issue: यीशु के जीवित होने के कथन की प्रस्तुति
  choice: पौलुस दावा करता था कि वह जीवित है
  alternative: पौलुस कहता था कि वह जीवित है
  rationale: यह फेस्तुस द्वारा पौलुस के कथन की रिपोर्ट है, इस उपवाक्य में कथावाचक की सीधी पुष्टि नहीं। ‘दावा करता था’ इस दृष्टिकोण को बनाए रखता है, बिना दावे को असत्य ठहराए।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली रखी गई है। फेस्तुस की बाहरी दृष्टि ‘उनकी अपनी’ और ‘किसी यीशु’ से सुरक्षित है; लंबे यूनानी वाक्य को अर्थ-स्पष्ट हिंदी क्रम में पुनर्गठित किया गया है।
