id: ACT.25.26
reference: Acts 25:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: hi
  text: उसके विषय में मेरे पास अपने स्वामी[a] को लिखने के लिए कोई निश्चित बात नहीं है। इसलिए मैं उसे आप सबके सामने, और विशेषकर आपके सामने, हे राजा अग्रिप्पा, पेश किया है, ताकि जाँच[b] हो जाने के बाद मुझे लिखने के लिए कुछ मिल सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्पष्ट रूप से, “सम्राट को।” यूनानी में “अपने स्वामी को” है; इस साम्राज्यिक संदर्भ में κύριος एक प्रचलित औपचारिक उपाधि है।
    reason: alternative_reading
  - marker: b
    text: “जाँच” का अनुवाद “सुनवाई” या “पूछताछ” भी हो सकता है; यहाँ पौलुस के मामले की न्यायिक पड़ताल का उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλές τι
  choice: कोई निश्चित बात
  rationale: यह पदबंध किसी पक्की, विश्वसनीय या स्पष्ट बात को सूचित करता है; प्रशासनिक संदर्भ में इसका आशय ऐसी ठोस बात से है जिसे आधिकारिक रूप से लिखा जा सके।
- source_word: τῷ κυρίῳ
  choice: अपने स्वामी
  rationale: κύριος का मूल अर्थ ‘स्वामी’ है; यहाँ औपचारिक रोमी संदर्भ में इसका संकेत सम्राट की ओर है। मुख्य पाठ मूल शब्दावली को रखता है और पादटिप्पणी संदर्भ स्पष्ट करती है।
- source_word: προήγαγον αὐτὸν ἐφ’ ὑμῶν
  choice: मैंने उसे आप सबके सामने ... पेश किया है
  rationale: प्रयोग किसी व्यक्ति को सभा के सामने लाने या प्रस्तुत करने का है। ‘आप सब’ बहुवचन ὑμῶν को अगले एकवचन संबोधन से अलग दिखाता है।
- source_word: μάλιστα ἐπὶ σοῦ
  choice: विशेष रूप से आपके सामने
  rationale: μάλιστα व्यापक सभा के भीतर अग्रिप्पा पर विशेष बल देता है।
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: जाँच हो जाने के बाद
  rationale: ἀνάκρισις न्यायिक पूछताछ, सुनवाई या जाँच का बोध कराता है; संबंधकारक निरपेक्ष रचना को स्वाभाविक कालवाचक रूप में व्यक्त किया गया है।
- source_word: σχῶ τί γράψω
  choice: मेरे पास लिखने के लिए कुछ हो
  rationale: यह यूनानी वाक्यांश जाँच से आधिकारिक पत्र में लिखने योग्य सामग्री प्राप्त होने का आशय देता है।
theological_decisions:
- issue: गैर-ईश्वरीय, शाही संदर्भ में κύριος का अनुवाद
  choice: अपने स्वामी
  alternative: सम्राट
  rationale: यहाँ κύριος परमेश्वर या मसीह के लिए नहीं, बल्कि रोमी शासक के औपचारिक संबोधन के रूप में प्रयुक्त है। ‘स्वामी’ मूल शब्द का रूप बनाए रखता है, जबकि पादटिप्पणी उसके संदर्भित व्यक्ति को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक किंतु गरिमापूर्ण न्यायिक-प्रशासनिक शैली रखी गई है। ‘आप सब’ और ‘आपके’ से यूनानी के बहुवचन श्रोताओं तथा अग्रिप्पा के एकवचन संबोधन का अंतर सुरक्षित है।
