source:
  edition: SBLGNT
  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: hi
  text: और फ़ेस्तुस ने कहा, “राजा अग्रिप्पा और हमारे साथ उपस्थित सभी सज्जनो, आप इस मनुष्य को देख रहे हैं। इसके विषय में यहूदियों के पूरे जनसमूह ने, यरूशलेम में और यहाँ भी, मुझसे विनती की और चिल्लाकर कहा कि इसे अब और जीवित नहीं रहना चाहिए[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि इसका अब और जीवित रहना उचित नहीं है।”
    reason: यूनानी वाक्यांश में आवश्यकता अथवा औचित्य का भाव है; यह वैकल्पिक रूप उसे बिना किसी निहित कर्ता को जोड़े व्यक्त करता है।
lexical_decisions:
- source_word: φησιν
  choice: ने कहा
  rationale: यूनानी ऐतिहासिक वर्तमान कथा को सजीव बनाता है, पर आधुनिक हिन्दी कथा में भूतकाल अधिक स्वाभाविक है; अर्थ और प्रसंग यथावत रहते हैं।
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: हमारे साथ उपस्थित सभी सज्जनो
  rationale: सह-उपस्थिति और पुरुषों को किए गए औपचारिक संबोधन—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θεωρεῖτε τοῦτον
  choice: आप इस मनुष्य को देख रहे हैं
  rationale: वर्तमान सूचक क्रिया और सभा के सामने पौलुस की ओर ध्यान खींचने का भाव सुरक्षित रहता है।
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: यहूदियों के पूरे समुदाय
  rationale: πλῆθος के सामूहिक भाव और फ़ेस्तुस की व्यापक अलंकारिक संक्षिप्ति को रखता है, बिना यह अनिवार्य किए कि हर एक यहूदी इसमें सम्मिलित था।
- source_word: ἐνέτυχόν μοι
  choice: मुझसे विनती की
  rationale: यहाँ क्रिया किसी अधिकारी के पास औपचारिक आग्रह लेकर आने को दर्शाती है; ‘विनती की’ सहज हिन्दी में उस भाव को व्यक्त करती है।
- source_word: βοῶντες
  choice: चिल्लाकर कहा
  rationale: तेज आवाज़ में आग्रह करने की सजीवता को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: इसे अब और जीवित नहीं रहना चाहिए
  rationale: δεῖν की आवश्यकता अथवा औचित्य की शक्ति को बनाए रखता है, पर इसे पाठ से अधिक स्पष्ट न्यायिक मृत्युदंड-सूत्र नहीं बनाता।
theological_decisions:
- issue: विरोधी कानूनी प्रसंग में ‘यहूदियों’ का सामूहिक उल्लेख
  choice: ‘यहूदियों के पूरे समुदाय’ रखा गया
  alternative: ‘सभी यहूदी’ या ‘यहूदी अगुवे’
  rationale: यूनानी पाठ स्पष्टतः τῶν Ἰουδαίων कहता है, इसलिए इसे केवल अगुवों तक सीमित नहीं किया गया। साथ ही πλῆθος एक सामूहिक अभिव्यक्ति है और कथन फ़ेस्तुस का सारांश है; अतः अनिवार्य व्यक्तिगत सार्वभौमिकता नहीं थोपी गई।
- issue: μὴ δεῖν ... ζῆν की माँग की शक्ति
  choice: ‘अब और जीवित नहीं रहना चाहिए’
  alternative: ‘अब और जीवित रहने योग्य नहीं है’ या ‘इसे मार डालना चाहिए’
  rationale: चुना गया रूप आवश्यकता/औचित्य की अस्पष्टता को बनाए रखता है और निहित मृत्युदंड को पाठ से अधिक प्रत्यक्ष नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक न्यायिक सभा के अनुकूल हिन्दी। ‘सज्जनो’ औपचारिक पुरुष-संबोधन को, और ‘समुदाय’ सामूहिक अभिव्यक्ति को सहज रूप में व्यक्त करता है।
