  text: παραγενομένου δὲ αὐτοῦ περιέστησαν ⸀αὐτὸν οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι, πολλὰ καὶ βαρέα αἰτιώματα ⸀καταφέροντες ἃ οὐκ ἴσχυον ἀποδεῖξαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/007.yaml
  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
translation:
  language: hi
  text: जब वह पहुँचा, तो यरूशलेम से आए यहूदियों ने उसे घेर लिया[a] और उस पर बहुत-से गंभीर आरोप लगाए, जिन्हें वे प्रमाणित नहीं कर सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके चारों ओर खड़े हो गए।” इस यूनानी क्रिया का अर्थ किसी के चारों ओर खड़ा होना या उसे घेर लेना हो सकता है; यहाँ अदालती प्रसंग में इस मुद्रा से दबाव का भाव भी प्रकट होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: जब वह पहुँचा
  rationale: संबंधकारक निरपेक्ष रचना समय की परिस्थिति बताती है। यह स्वाभाविक हिन्दी में घटनाक्रम को स्पष्ट रखता है।
- source_word: περιέστησαν αὐτὸν
  choice: उसे घेर लिया
  rationale: क्रिया का मूल भाव किसी के चारों ओर खड़े होने या उसे घेरने का है। कानूनी प्रसंग में यह शारीरिक मुद्रा और दबाव दोनों को स्वाभाविक हिन्दी में व्यक्त करता है, बिना हिंसा का अर्थ जोड़े।
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: यरूशलेम से आए यहूदियों
  rationale: Ἰουδαῖοι यहाँ यरूशलेम से आए यहूदी आरोपकर्ताओं को सूचित करता है, केवल यहूदिया प्रदेश के निवासियों को नहीं। καταβεβηκότες का शाब्दिक 'नीचे आए' हिन्दी में अनावश्यक भौगोलिक मुहावरा लगेगा, इसलिए 'आए' रखा गया है।
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: बहुत-से गंभीर आरोप
  rationale: αἰτιώματα औपचारिक कानूनी आरोप हैं और βαρέα उनकी गंभीरता बताता है। यह चयन स्पष्ट, वर्तमान और न्यायिक प्रसंग के अनुकूल है।
- source_word: καταφέροντες
  choice: उस पर ... आरोप लगाए
  rationale: कानूनी संदर्भ में कृदंत का अर्थ किसी के विरुद्ध आरोप प्रस्तुत करना या लगाना है। हिन्दी में 'उस पर आरोप लगाए' स्वाभाविक और स्पष्ट है।
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: जिन्हें वे प्रमाणित नहीं कर सके
  rationale: ἰσχύω के साथ अनंत क्रिया सामर्थ्य दर्शाती है और ἀποδείκνυμι प्रमाणित करने का भाव देता है। यह अनुवाद कार्यवाही के दौरान उनकी असमर्थता को सटीक रूप से व्यक्त करता है।
