reference: Acts 25:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τῇ οὖν ἐπαύριον ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης μετὰ πολλῆς φαντασίας καὶ εἰσελθόντων εἰς τὸ ἀκροατήριον σύν ⸀τε χιλιάρχοις καὶ ἀνδράσιν τοῖς κατ’ ⸀ἐξοχὴν τῆς πόλεως καὶ κελεύσαντος τοῦ Φήστου ἤχθη ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/023.yaml
  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: hi
  text: फिर अगले दिन अग्रिप्पा और बिरनीके बड़े ठाट-बाट के साथ आए[a] और सैन्य अधिकारियों तथा नगर के प्रमुख पुरुषों के साथ सुनवाई-भवन में गए। फ़ेस्तुस की आज्ञा पर पौलुस को लाया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बड़ी धूमधाम से” अथवा “बड़े प्रदर्शन के साथ।”
    reason: φαντασία के अर्थ में समारोहपूर्ण वैभव और दिखावे दोनों की छाया है; वैकल्पिक अनुवाद इस अर्थ-परास को दिखाते हैं।
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: इसलिए अगले दिन
  rationale: कालसूचक दत्तिव पदबंध का अर्थ ‘अगले दिन’ है; οὖν को कथा के परिणामात्मक-संयोजक प्रवाह के लिए ‘इसलिए’ कहा गया है।
- source_word: ἐλθόντος
  choice: आए
  rationale: यूनानी संबंध-विरहित षष्ठी रचना को स्वाभाविक हिन्दी में समापिका क्रिया के रूप में व्यक्त किया गया है।
- source_word: Ἀγρίππα ... Βερνίκης
  choice: अग्रिप्पा और बिरनीके
  rationale: नामों का लिप्यंतरण यूनानी उच्चारण के निकट और हिन्दी पाठक के लिए पठनीय रखा गया है।
- source_word: μετὰ πολλῆς φαντασίας
  choice: बड़े ठाट-बाट के साथ
  rationale: यह पद सार्वजनिक वैभव, तड़क-भड़क और समारोहपूर्ण प्रदर्शन को सूचित करता है; हिन्दी मुहावरा दृश्य की भव्यता और दिखावे दोनों को व्यक्त करता है।
- source_word: εἰσελθόντων εἰς τὸ ἀκροατήριον
  choice: सुनवाई-भवन में प्रवेश किया
  rationale: ἀκροατήριον यहाँ आधिकारिक सुनवाई के स्थान को दर्शाता है; ‘सुनवाई-भवन’ आधुनिक हिन्दी में संदर्भ को स्पष्ट रखता है।
- source_word: σύν τε χιλιάρχοις
  choice: सैन्य अधिकारियों ... के साथ
  rationale: χιλίαρχος रोमी उच्च सैन्य अधिकारी को दर्शाता है। शाब्दिक ‘हज़ारपति’ भ्रामक होता, इसलिए पद का कार्यात्मक रूप चुना गया है; τε अगले समूह से समन्वय करता है।
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: नगर के प्रतिष्ठित पुरुषों
  rationale: κατ’ ἐξοχήν सामाजिक विशिष्टता या प्रमुखता बताता है; ἀνδράσιν का पुरुषवाची संकेत भी सुरक्षित रखा गया है।
- source_word: κελεύσαντος τοῦ Φήστου
  choice: फ़ेस्तुस की आज्ञा पर
  rationale: संबंध-विरहित षष्ठी को संक्षिप्त और स्वाभाविक हिन्दी पदबंध में व्यक्त किया गया है, जिसमें अधिकारी का आदेश स्पष्ट है।
- source_word: ἤχθη ὁ Παῦλος
  choice: पौलुस को भीतर लाया गया
  rationale: निष्क्रिय क्रिया बताती है कि पौलुस को अन्य लोग उस कक्ष में लेकर आए; ‘भीतर’ प्रवेश का संदर्भ स्पष्ट करता है।
