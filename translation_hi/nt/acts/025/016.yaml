  text: πρὸς οὓς ἀπεκρίθην ὅτι οὐκ ἔστιν ἔθος Ῥωμαίοις χαρίζεσθαί τινα ⸀ἄνθρωπον πρὶν ἢ ὁ κατηγορούμενος κατὰ πρόσωπον ἔχοι τοὺς κατηγόρους τόπον τε ἀπολογίας λάβοι περὶ τοῦ ἐγκλήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: hi
  text: मैंने उन्हें उत्तर दिया कि रोमियों की यह प्रथा नहीं है कि किसी व्यक्ति को तब तक सौंप दें[a][b], जब तक अभियुक्त अपने आरोप लगाने वालों के आमने-सामने न हो और उसे आरोप के विषय में अपना बचाव करने का अवसर न मिल जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी व्यक्ति को किसी के पक्ष में सौंप दें”; यूनानी क्रिया में किसी आरोप लगाने वाले का अनुरोध मानकर किसी व्यक्ति को उसके हवाले कर देने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “किसी मनुष्य को”; इस कानूनी संदर्भ में यह अभिव्यक्ति सामान्य रूप से किसी भी व्यक्ति के लिए प्रयुक्त है।
    reason: lexical_alternative
