  choice: सौंप दें
  rationale: इस संदर्भ में क्रिया किसी व्यक्ति को अनुरोध करने वालों के हवाले कर देने या उनके पक्ष में दे देने का भाव रखती है।
- source_word: τινα ἄνθρωπον
  choice: किसी मनुष्य को
  rationale: यूनानी में ἄνθρωπον स्पष्ट रूप से उपस्थित है; ‘किसी मनुष्य’ स्रोत की अभिव्यक्ति को सुरक्षित रखता है और इस कानूनी संदर्भ में सामान्य अर्थ में प्रयुक्त है।
- source_word: ὁ κατηγορούμενος
  choice: अभियुक्त
  rationale: यह आरोप के अधीन व्यक्ति को दर्शाता है; ‘अभियुक्त’ संक्षिप्त और कानूनी संदर्भ के लिए उपयुक्त है।
- source_word: κατὰ πρόσωπον
  choice: आमने-सामने
  rationale: यह प्रत्यक्ष व्यक्तिगत सामना दर्शाने वाला मुहावरा है; ‘आमने-सामने’ उसके बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τόπον ... ἀπολογίας
  choice: अपना बचाव प्रस्तुत करने का अवसर
  rationale: τόπος यहाँ भौतिक स्थान नहीं, अवसर का सूचक है, और ἀπολογία कानूनी बचाव को दर्शाता है।
- source_word: ἐγκλήματος
  choice: आरोप
  rationale: यह कानूनी आरोप या अभियोग को दर्शाता है; ‘आरोप’ स्पष्ट, प्रचलित और अनावश्यक रूप से तकनीकी नहीं है।
