base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: hi
  text: जब मैं यरूशलेम पहुँचा, तब प्रधान याजकों और यहूदियों के बुज़ुर्गों ने मुझे उसके विषय में सूचना दी और उसके विरुद्ध दोषसिद्धि की माँग की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके विरुद्ध दंडादेश की माँग की” अथवा “माँग की कि उसे दोषी ठहराया जाए।”
    reason: καταδίκην के न्यायिक अर्थ की सम्भव वैकल्पिक अभिव्यक्तियाँ।
lexical_decisions:
- source_word: περὶ οὗ
  choice: उसके विषय में
  rationale: यह पदबंध पौलुस की ओर संकेत करता है और उसके संबंध में उठाए गए मामले का परिचय देता है।
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: जब मैं यरूशलेम पहुँचा
  rationale: संबंधकारक निरपेक्ष रचना और εἰς के साथ γίνομαι यहाँ किसी स्थान पर पहुँचने का समय बताती है।
- source_word: ἐνεφάνισαν
  choice: मेरे सामने आरोप रखे
  rationale: कानूनी-प्रशासनिक संदर्भ में क्रिया का अर्थ अधिकारी के सामने मामला या सूचना प्रस्तुत करना है; प्रसंग के अनुसार ‘आरोप रखे’ स्वाभाविक और स्पष्ट है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: बहुवचन पदवी के लिए यह प्रचलित हिन्दी रूप है और प्रमुख याजकीय अधिकारियों को सूचित करता है।
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: यहूदियों के पुरनियों
  rationale: यह अनुवाद संबंधकारक रचना को बनाए रखते हुए संबंधित यहूदी अगुओं की पहचान करता है।
- source_word: αἰτούμενοι
  choice: माँग की
  rationale: कृदंत उनके द्वारा अधिकारी से की गई औपचारिक विनती या माँग को व्यक्त करता है।
- source_word: κατ’ αὐτοῦ
  choice: उसे
  rationale: दोषी ठहराने की क्रिया के कर्म के रूप में स्वाभाविक हिन्दी में विरोधी कानूनी कार्रवाई का लक्ष्य स्पष्ट होता है।
- source_word: καταδίκην
  choice: दोषी ठहराया जाए
  rationale: शब्द न्यायिक दोषनिर्णय या दंडादेश को सूचित करता है; यह रूप सामान्य पाठक के लिए स्पष्ट रहते हुए कानूनी आशय बनाए रखता है।
