source:
  edition: SBLGNT
  text: ἄλογον γάρ μοι δοκεῖ πέμποντα δέσμιον μὴ καὶ τὰς κατ’ αὐτοῦ αἰτίας σημᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: hi
  text: क्योंकि किसी कैदी को भेजते समय उसके विरुद्ध लगाए गए आरोपों को भी स्पष्ट न करना मुझे अनुचित लगता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλογον
  choice: अनुचित
  rationale: यहाँ शब्द ऐसी प्रशासनिक कार्रवाई को बताता है जो तर्कसंगत या उचित न हो। ‘अनुचित’ आधुनिक हिन्दी में स्वाभाविक है और ‘बेतुका’ की अपेक्षा प्रसंग के औपचारिक स्वर के अधिक अनुकूल है।
- source_word: δοκεῖ μοι
  choice: मुझे ... लगता है
  rationale: यह यूनानी वाक्यांश व्यक्तिगत और कुछ हद तक सौम्य आकलन व्यक्त करता है; ‘मुझे लगता है’ उस भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πέμποντα
  choice: भेजते समय
  rationale: वर्तमान कृदन्त मुख्य क्रिया की परिस्थिति बताता है; ‘भेजते समय’ इस संबंध को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: δέσμιον
  choice: किसी कैदी को
  rationale: न्यायिक संदर्भ में यह हिरासत में रखे गए व्यक्ति के लिए सामान्य शब्द है; ‘कैदी’ इसका स्पष्ट आधुनिक हिन्दी समतुल्य है।
- source_word: μὴ καὶ
  choice: भी ... न करना
  rationale: ‘भी’ καί के योगात्मक बल को सुरक्षित रखता है—कैदी को भेजने के साथ आरोपों की सूचना देना भी अपेक्षित है।
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: उसके विरुद्ध लगाए गए आरोपों को
  rationale: न्यायिक प्रसंग में αἰτίαι का अर्थ आरोप है। ‘लगाए गए’ हिन्दी में संबंध को स्वाभाविक बनाता है, जबकि ‘उसके विरुद्ध’ मूल संरचना को बनाए रखता है।
- source_word: σημᾶναι
  choice: स्पष्ट करना
  rationale: यहाँ क्रिया का आशय आरोपों को सूचित या निर्दिष्ट करना है। ‘स्पष्ट करना’ औपचारिक प्रशासनिक संदर्भ में सहज है और यह अनावश्यक रूप से नहीं मानता कि हर विवरण लिखित रूप में देना था।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रशासनिक-न्यायिक प्रसंग के अनुरूप रखी गई है। वाक्य Festus के व्यक्तिगत आकलन की विनम्रता तथा καί के ‘भी’ वाले बल को सुरक्षित रखता है।
