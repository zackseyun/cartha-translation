source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· ⸂Ἐπὶ τοῦ βήματος Καίσαρος ἑστώς⸃ εἰμι, οὗ με δεῖ κρίνεσθαι. Ἰουδαίους οὐδὲν ⸀ἠδίκησα, ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: hi
  text: परन्तु पौलुस ने कहा, “मैं कैसर के न्यायासन[a] के समक्ष खड़ा हूँ[b], जहाँ मेरा न्याय किया जाना चाहिए। मैंने यहूदियों के प्रति कोई अन्याय[c] नहीं किया है, जैसा कि आप स्वयं भली-भाँति जानते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्यायाधिकरण।” यूनानी βῆμα अधिकारी के आधिकारिक न्यायासन अथवा न्यायालय को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं कैसर के न्यायासन के समक्ष खड़ा हूँ।” यूनानी रचना पौलुस की वर्तमान कानूनी स्थिति पर बल देती है।
    reason: lexical_alternative
  - marker: c
    text: या, “यहूदियों के विरुद्ध कोई अपराध नहीं किया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: βῆμα
  choice: न्यायासन
  rationale: यह शब्द रोमी अधिकारी के उस आधिकारिक आसन अथवा न्यायाधिकरण को सूचित करता है जहाँ मुकदमे सुने जाते थे। ‘न्यायासन’ कानूनी संदर्भ और आसन की मूल छवि, दोनों को बनाए रखता है।
- source_word: Καίσαρος
  choice: कैसर के
  rationale: यहाँ Καῖσαρ रोमी सम्राट की उपाधि है। ‘कैसर’ ऐतिहासिक और कानूनी परिवेश को सीधे बनाए रखता है।
- source_word: ἑστώς εἰμι
  choice: मैं ... खड़ा हूँ
  rationale: पूर्ण कृदंत और εἰμί की परिभाषात्मक रचना पौलुस की वर्तमान कानूनी स्थिति पर बल देती है; हिंदी में ‘खड़ा हूँ’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὗ
  choice: जहाँ
  rationale: यह न्यायासन की ओर लौटकर उसे न्याय किए जाने का उचित स्थान बताता है; ‘जहाँ’ हिंदी में सहज और स्पष्ट है।
- source_word: δεῖ
  choice: होना चाहिए
  rationale: यहाँ δεῖ कानूनी आवश्यकता अथवा उचित अधिकार-क्षेत्र का भाव देता है, जिसे ‘चाहिए’ स्वाभाविक रूप से प्रकट करता है।
- source_word: κρίνεσθαι
  choice: मेरा न्याय होना
  rationale: निष्क्रिय कानूनी प्रयोग में इसका अर्थ न्याय किया जाना या मुकदमा सुना जाना है; ‘मेरा न्याय होना’ यूनानी अभिव्यक्ति के निकट रहते हुए बोधगम्य है।
- source_word: Ἰουδαίους
  choice: यहूदियों
  rationale: संदर्भ में यह पौलुस पर आरोप लगाने वाले व्यापक यहूदी पक्ष की ओर संकेत करता है; ‘यहूदियों’ सीधा और ऐतिहासिक रूप से उपयुक्त अनुवाद है।
- source_word: οὐδὲν ἠδίκησα
  choice: मैंने ... कोई अन्याय नहीं किया है
  rationale: ἀδικέω किसी के साथ बुरा या अन्याय करना और कानूनी अपराध करना, दोनों अर्थ दे सकता है। यह अनुवाद इसके नैतिक-कानूनी बल को बनाए रखता है।
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: जैसा कि आप स्वयं भली-भाँति जानते हैं
  rationale: καὶ σὺ में सामने वाले पर बल है, जबकि κάλλιον और ἐπιγινώσκεις मिलकर पक्के अथवा अच्छी तरह जानने का भाव देते हैं। ‘आप स्वयं भली-भाँति जानते हैं’ आधुनिक हिंदी में स्वाभाविक है और आशय को सुरक्षित रखता है।
