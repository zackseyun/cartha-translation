  terminology: ‘सम्राट’ correctly identifies Σεβαστός in this setting as the Roman imperial title. The footnote responsibly preserves ‘औगुस्तुस’ as a lexical alternative and explains the title without confusing it with the specific earlier emperor Augustus.
