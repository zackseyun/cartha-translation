  text: ἐγὼ δὲ ⸀κατελαβόμην μηδὲν ἄξιον ⸂αὐτὸν θανάτου⸃ πεπραχέναι, ⸀αὐτοῦ δὲ τούτου ἐπικαλεσαμένου τὸν Σεβαστὸν ἔκρινα ⸀πέμπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/025.yaml
  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: hi
  text: परन्तु मैंने पाया कि उसने ऐसा कुछ नहीं किया जो मृत्यु के योग्य हो; और क्योंकि उसने स्वयं सम्राट[a] से अपील की थी, इसलिए मैंने उसे भेजने का निर्णय किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘औगुस्तुस।’ यूनानी पदवी Σεβαστός यहाँ रोमी सम्राट को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελαβόμην
  choice: मैंने पाया
  rationale: न्यायिक प्रसंग में यह जाँच के बाद फेस्तुस के निष्कर्ष को व्यक्त करता है; यह स्वाभाविक है और औपचारिक न्यायिक निर्णय का अनावश्यक संकेत नहीं देता।
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: ऐसा कुछ नहीं ... जो मृत्यु के योग्य हो
  rationale: यह मूल वाक्यांश के निकट रहते हुए प्राणदंड योग्य किसी कार्य के अभाव को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: πεπραχέναι
  choice: किया
  rationale: यह πράσσω के व्यापक अर्थ को बनाए रखता है; न्यायिक भाव आसपास के वाक्यांश से स्पष्ट है, इसलिए ‘अपराध किया’ जोड़ना आवश्यकता से अधिक व्याख्यात्मक होता।
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: क्योंकि उसने स्वयं ... से अपील की थी
  rationale: ‘स्वयं’ यूनानी सर्वनाम के बलाघात को और ‘क्योंकि’ उस परिस्थिति के प्रसंगगत कारणात्मक संबंध को व्यक्त करता है।
- source_word: τὸν Σεβαστόν
  choice: सम्राट
  rationale: यहाँ Σεβαστός रोमी शासक की पदवी है, ऐतिहासिक व्यक्ति औगुस्तुस का निजी नाम नहीं; ‘सम्राट’ आधुनिक पाठक के लिए आशय स्पष्ट करता है।
- source_word: ἔκρινα πέμπειν
  choice: भेजने का निर्णय किया
  rationale: यह फेस्तुस के आधिकारिक प्रक्रियात्मक निर्णय और पूरक क्रिया, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
