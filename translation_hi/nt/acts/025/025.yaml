  source_fidelity: The translation accurately conveys Festus’s judicial finding (κατελαβόμην), the denial of any deed meriting death (μηδὲν ἄξιον ... θανάτου πεπραχέναι), Paul’s own appeal to the emperor, and Festus’s consequent decision to send him. The causal connection and emphatic ‘स्वयं’ are appropriately represented.
