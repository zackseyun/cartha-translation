lexical_decisions:
- source_word: περὶ οὗ
  choice: उसके विषय में
  rationale: περί के साथ संबंधकारक सर्वनाम चर्चा के व्यक्ति, अर्थात पौलुस, की ओर संकेत करता है। यह रूप अर्थ को स्पष्ट रखते हुए स्वाभाविक और गरिमापूर्ण हिन्दी देता है।
- source_word: σταθέντες
  choice: जब ... खड़े हुए
  rationale: ἵστημι का यह अओरिस्ट कृदन्त प्रसंग में कालवाचक है और न्यायिक कार्यवाही में आरोप लगानेवालों के अपना पक्ष रखने के लिए खड़े होने को व्यक्त करता है।
- source_word: οἱ κατήγοροι
  choice: आरोप लगानेवाले
  rationale: κατήγοροι न्यायिक प्रसंग में आरोप प्रस्तुत करनेवालों को दर्शाता है। यह सामान्य पाठक के लिए 'अभियोजक' से अधिक सहज है।
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: किसी का भी आरोप नहीं लगाया
  rationale: न्यायिक मुहावरे φέρειν αἰτίαν का अर्थ आरोप लाना या प्रस्तुत करना है। हिन्दी में 'आरोप लगाना' स्वाभाविक है।
- source_word: ἐγὼ ὑπενόουν
  choice: जिनका मुझे संदेह था
  rationale: ὑπονοέω का अपूर्ण भूतकाल पहले से बनी हुई आशंका या अपेक्षा दर्शाता है। हिन्दी में यह रूप स्वाभाविक रहते हुए उस पूर्ववर्ती संदेह को व्यक्त करता है।
- source_word: πονηρῶν
  choice: बुरी बातों
  rationale: नपुंसकलिंग बहुवचन πονηρῶν सामान्य रूप से बुरे कामों या गलत बातों को सूचित कर सकता है। 'अपराधों' कहना कानूनी अर्थ को आवश्यकता से अधिक निश्चित कर देता।
