    text: या, “न्याय के आसन पर बैठने के बाद।” यूनानी शब्द βῆμα अधिकारी के न्यायिक आसन या न्याय-मंच को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Διατρίψας
  choice: बिताने के बाद
  rationale: यह भूतकालिक कृदंत पहले पूरी हुई क्रिया बताता है; ‘दिन बिताने के बाद’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐν αὐτοῖς
  choice: उनके बीच
  rationale: यह पहले उल्लिखित लोगों के बीच ठहरने या समय बिताने को व्यक्त करता है।
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: आठ या दस दिन से अधिक न
  rationale: यह अनिश्चित संख्या के साथ अधिकतम अवधि का भाव रखता है; ‘आठ या दस’ की मूल अस्पष्टता सुरक्षित रखी गई है।
- source_word: καταβὰς εἰς Καισάρειαν
  choice: वह कैसरिया उतर गया
  rationale: यरूशलेम से कैसरिया की ओर यात्रा के लिए प्रयुक्त दिशात्मक भाषा को ‘उतर गया’ से बनाए रखा गया है।
- source_word: τῇ ἐπαύριον
  choice: अगले दिन
  rationale: आगमन के ठीक बाद वाले दिन का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: न्याय-आसन पर बैठकर
  rationale: βῆμα यहाँ अधिकारी के न्यायिक आसन अथवा मंच को सूचित करता है; ‘न्याय-आसन’ कानूनी प्रसंग और बैठने की क्रिया दोनों बनाए रखता है।
- source_word: ἐκέλευσεν
  choice: आदेश दिया
  rationale: न्यायिक अधिकारी द्वारा दिए गए औपचारिक निर्देश के लिए उपयुक्त आधुनिक हिन्दी।
- source_word: τὸν Παῦλον ἀχθῆναι
  choice: पौलुस को लाए जाने
  rationale: मूल के कर्मवाच्य अनंत क्रिया-रूप को बनाए रखता है और बिना बताए कर्ता जोड़े न्यायिक उपस्थिति में लाने का भाव देता है।
