base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: hi
  text: पौलुस ने अपना बचाव करते हुए कहा, “मैंने न तो यहूदियों की व्यवस्था के विरुद्ध, न मंदिर के विरुद्ध, और न ही कैसर के विरुद्ध कोई पाप[a] किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने न तो यहूदियों की व्यवस्था के विरुद्ध, न मंदिर के विरुद्ध, और न ही कैसर के विरुद्ध कोई अपराध किया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: अपना बचाव करते हुए कहा
  rationale: यह न्यायिक प्रसंग में पौलुस के प्रतिरक्षात्मक उत्तर को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: νόμον τῶν Ἰουδαίων
  choice: यहूदियों की व्यवस्था
  rationale: यूनानी संबंधवाचक रचना को सुरक्षित रखते हुए धार्मिक, जातीय या क्षेत्रीय अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἱερὸν
  choice: मंदिर
  rationale: यहाँ शब्द सामान्यतः पूरे मंदिर-परिसर को सूचित करता है; ‘मंदिर’ स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: Καίσαρά
  choice: कैसर
  rationale: यूनानी में प्रयुक्त रोमी शासकीय नाम/उपाधि को लिप्यंतरित करके कानूनी-राजनीतिक संदर्भ बनाए रखा गया है।
- source_word: τι ἥμαρτον
  choice: कोई पाप किया है
  rationale: निषेध के साथ τι दावे की व्यापकता दिखाता है, जबकि ‘पाप किया’ ἁμαρτάνω के नैतिक शब्दार्थ को सुरक्षित रखता है।
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: न तो ... न ... और न ही
  rationale: तीन अलग आरोप-क्षेत्रों के पूर्ण निषेध को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ἥμαρτον का कानूनी बनाम नैतिक भाव
  choice: कोई पाप किया है
  alternative: कोई अपराध नहीं किया है / कुछ गलत नहीं किया है
  rationale: प्रसंग न्यायिक है, फिर भी यूनानी क्रिया सामान्यतः ‘पाप करना’ भी व्यक्त करती है। मुख्य पाठ नैतिक प्रतिध्वनि को बनाए रखता है और पादटिप्पणी कानूनी अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; न्यायालयीन प्रसंग के अनुरूप गरिमापूर्ण पर सहज भाषा। ‘व्यवस्था’, ‘मंदिर’ और ‘कैसर’ जैसे स्थापित बाइबलीय पद रखे गए हैं।
