  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: hi
  text: तब फ़ेस्तुस ने परिषद के साथ विचार-विमर्श करने के बाद उत्तर दिया, “तुमने कैसर से अपील की है; कैसर के पास[a] जाओगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कैसर के सामने जाओगे।” यह वाक्यांश कैसर से अपील करने पर सम्राट के न्यायासन के सामने उपस्थित होने का कानूनी अर्थ रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कथानक में अगली घटना को स्वाभाविक रूप से जोड़ने वाला काल-सूचक शब्द है।
- source_word: ὁ Φῆστος
  choice: फ़ेस्तुस
  rationale: व्यक्तिनाम का प्रचलित देवनागरी लिप्यंतरण रखा गया है।
- source_word: συλλαλήσας
  choice: विचार-विमर्श करने के बाद
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले हुई सलाहपूर्ण बातचीत को व्यक्त करता है।
- source_word: μετὰ τοῦ συμβουλίου
  choice: परिषद से
  rationale: συμβούλιον यहाँ प्रशासनिक सलाह देने वाले निकाय को सूचित करता है; यूनानी में ‘उसकी’ स्पष्ट नहीं है।
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: न्यायिक प्रसंग के अनुरूप सीधा और गरिमापूर्ण कथात्मक प्रयोग है।
- source_word: Καίσαρα
  choice: कैसर
  rationale: रोमी सम्राट की उपाधि को लिप्यंतरित करके कानूनी और ऐतिहासिक संदर्भ सुरक्षित रखा गया है।
- source_word: ἐπικέκλησαι
  choice: अपील की है
  rationale: पूर्णकालिक मध्यवाच्य रूप यहाँ सम्राट के न्यायाधिकार का कानूनी आह्वान करने के अर्थ में है।
- source_word: ἐπὶ Καίσαρα
  choice: कैसर के पास
  rationale: πορεύσῃ के साथ यह कैसर की ओर जाने को व्यक्त करता है, जबकि न्यायिक अर्थ में ‘कैसर के सामने’ भी संभव है।
- source_word: πορεύσῃ
  choice: जाओगे
  rationale: भविष्यकाल की गमन-क्रिया को सीधे रखता है; ‘भेजे जाओगे’ जैसा कर्मवाच्य भाव मूल में स्पष्ट नहीं है।
