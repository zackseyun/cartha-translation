source:
  edition: SBLGNT
  text: λαβεῖν τὸν ⸀τόπον τῆς διακονίας ταύτης καὶ ἀποστολῆς, ⸀ἀφ’ ἧς παρέβη Ἰούδας πορευθῆναι εἰς τὸν τόπον τὸν ἴδιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/025.yaml
  text: to take the place of this ministry and apostleship[b][a], from which Judas turned aside to go to his own place.
translation:
  language: hi
  text: कि वह इस सेवा और प्रेरिताई का स्थान ग्रहण करे[a], जिससे यहूदा हटकर अपने ही स्थान चला गया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात इस सेवा में प्रेरित का रिक्त हुआ पद ग्रहण करे।
    reason: metaphorical_clarification
  - marker: b
    text: ‘अपने ही स्थान’ से केवल यहूदा से संबंधित स्थान का संकेत हो सकता है, या अधिक गंभीर रूप से उसके योग्य न्याय के स्थान का। मूल यूनानी अभिव्यक्ति गंतव्य को स्पष्ट नहीं करती।
    reason: alternative_reading
lexical_decisions:
- source_word: λαβεῖν τὸν τόπον
  choice: वह स्थान ले
  rationale: यह पद रिक्त हुई भूमिका को ग्रहण करने की बात करता है। ‘स्थान ले’ यूनानी रूपक को बनाए रखता है और पद के उत्तरार्ध में ‘अपने ही स्थान’ के साथ जानबूझकर आए शब्द-संबंध को भी सुरक्षित रखता है।
- source_word: διακονίας
  choice: सेवा
  rationale: διακονία सौंपी गई सेवा या सेवकाई को सूचित करता है। ‘सेवा’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ को अनावश्यक रूप से संस्थागत नहीं बनाता।
- source_word: ἀποστολῆς
  choice: प्रेरिताई
  rationale: यहाँ ἀποστολή सामान्य मिशन नहीं, प्रेरित के दायित्व और पद को सूचित करता है। ‘प्रेरिताई’ उस विशिष्ट भूमिका को संक्षेप में व्यक्त करती है।
- source_word: ἀφ’ ἧς παρέβη
  choice: जिससे यहूदा भटककर
  rationale: παραβαίνω यहाँ निर्धारित सेवा से हटने या उससे विमुख होने का भाव रखता है। ‘भटककर’ नैतिक गंभीरता को बनाए रखता है, पर इसे किसी अधिक तकनीकी धर्मवैज्ञानिक कथन में नहीं बदलता।
- source_word: πορευθῆναι
  choice: चला गया
  rationale: πορεύομαι का सामान्य गतिशील अर्थ सहज हिन्दी में ‘चला गया’ से व्यक्त होता है।
- source_word: εἰς τὸν τόπον τὸν ἴδιον
  choice: अपने ही स्थान को
  rationale: यह यूनानी की संक्षिप्त और अर्थगर्भित अभिव्यक्ति को बनाए रखता है तथा यह निर्धारित नहीं करता कि वह स्थान केवल मृत्यु, कब्र या दण्ड का स्थान है।
theological_decisions:
- issue: यहूदा के ‘अपने ही स्थान’ का आशय
  choice: मुख्य पाठ में अस्पष्ट अभिव्यक्ति ‘अपने ही स्थान’ बनाए रखी गई।
  alternative: इसे कब्र, मृत्यु, नरक या न्याय के उस स्थान के रूप में स्पष्ट करना जो यहूदा के योग्य था।
  rationale: यूनानी वाक्यांश गंतव्य को स्पष्ट रूप से परिभाषित नहीं करता। इसलिए अनुवाद उसके गंभीर संकेत को रखता है, पर उससे अधिक निश्चित धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: यहूदा का प्रेरिताई से संबंध-विच्छेद
  choice: ‘भटककर’
  alternative: ‘छोड़कर’, ‘हटकर’ या ‘पतन करके’।
  rationale: मूल क्रिया विचलन, अतिक्रमण या प्रस्थान का अर्थ दे सकती है। ‘भटककर’ इस बहुअर्थता का पर्याप्त प्रतिनिधित्व करता है; पाद-टिप्पणी अन्य सम्भावनाएँ बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘स्थान’ की पुनरावृत्ति जानबूझकर रखी गई है, जिससे यूनानी पाठ में प्रेरिताई के स्थान और यहूदा के अपने स्थान के बीच का विरोध बना रहे।
