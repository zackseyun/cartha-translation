source:
  edition: SBLGNT
  text: ἀλλὰ λήμψεσθε δύναμιν ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς, καὶ ἔσεσθέ ⸀μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/008.yaml
  text: But you will receive power when the Holy Spirit has come upon you[a], and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the end of the earth.
translation:
  language: hi
  text: परन्तु जब पवित्र आत्मा तुम पर आ जाएगा, तब तुम सामर्थ्य पाओगे; और यरूशलेम में, सारे यहूदिया में और सामरिया में, और पृथ्वी के छोर तक[a] मेरे गवाह होगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी के छोरों तक।” यूनानी वाक्यांश में “छोर” एकवचन है, पर यह मुहावरे के रूप में पृथ्वी के सबसे दूरस्थ विस्तार को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: परन्तु
  rationale: यह पद 7 के कथन के साथ स्पष्ट विरोध दिखाता है और गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: λήμψεσθε δύναμιν
  choice: तुम सामर्थ्य पाओगे
  rationale: λαμβάνω यहाँ दी हुई वस्तु प्राप्त करने के अर्थ में है; δύναμις आत्मा द्वारा दी जाने वाली सक्षम शक्ति को दर्शाता है।
- source_word: ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ’ ὑμᾶς
  choice: जब पवित्र आत्मा तुम पर आएगा
  rationale: Genitive absolute को स्वाभाविक कालवाचक उपवाक्य से व्यक्त किया गया है; ἐπί के आगमन/ऊपर आने के भाव को सुरक्षित रखा गया है।
- source_word: ἔσεσθέ μου μάρτυρες
  choice: मेरे गवाह होगे
  rationale: μου को यीशु से संबंधसूचक 'मेरे' और μάρτυρες को साक्ष्य देने वालों के अर्थ में 'गवाह' किया गया है, न कि बाद में विकसित 'शहीद' अर्थ में।
- source_word: ἐν πάσῃ τῇ Ἰουδαίᾳ
  choice: सारे यहूदिया में
  rationale: πάσῃ का पूरे भौगोलिक प्रदेश में विस्तार 'सारे' से स्पष्ट रहता है।
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: पृथ्वी के छोर तक
  rationale: यूनानी में 'छोर' एकवचन है और पृथ्वी की दूरस्थतम सीमा का मुहावरेदार बोध देता है; हिन्दी में एकवचन रखकर रूप और अर्थ दोनों सुरक्षित किए गए हैं।
theological_decisions:
- issue: τοῦ ἁγίου πνεύματος में πνεῦμα का दैवी व्यक्तिगत संदर्भ
  choice: पवित्र आत्मा
  alternative: पवित्र रूह
  rationale: मानक आधुनिक हिन्दी बाइबिलीय प्रयोग में 'पवित्र आत्मा' स्पष्ट और स्वाभाविक है; पाठ से परे कोई अतिरिक्त धर्मसैद्धान्तिक व्याख्या नहीं जोड़ी गई।
- issue: गवाही के आदेश का भौगोलिक विस्तार
  choice: यरूशलेम से पृथ्वी के छोर तक वास्तविक विस्तृत भूगोल
  alternative: पूरी तरह प्रतीकात्मक आत्मिक भूगोल
  rationale: स्थाननाम और क्रम ठोस भौगोलिक विस्तार प्रस्तुत करते हैं; अनुवाद इस क्रम को बनाए रखता है, पर इससे आगे कोई कलीसियाई कार्यक्रम आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सहज। 'सामर्थ्य' ने δύναμις के आत्मा-प्रदत्त सक्षम बल को रखा है। विरामचिह्नों से कालवाचक शर्त और उसके परिणाम को स्पष्ट किया गया है; सभी मूल स्थाननाम और विस्तारक्रम सुरक्षित हैं।
