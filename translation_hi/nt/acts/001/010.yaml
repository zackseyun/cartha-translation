  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘टकटकी लगाए’ एकाग्र दृष्टि को, और ‘तो देखो’ कथात्मक ध्यानाकर्षण को व्यक्त करता है। पद के अगले वाक्य से जुड़ने के कारण अंत में अल्पविराम रखा गया है।
