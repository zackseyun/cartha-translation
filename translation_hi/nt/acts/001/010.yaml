lexical_decisions:
- source_word: ἀτενίζοντες
  choice: टकटकी लगाए देख रहे थे
  rationale: यह प्रयोग लगातार और एकाग्र होकर देखने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὐρανόν
  choice: स्वर्ग
  rationale: शब्द का अर्थ ‘आकाश’ या ‘स्वर्ग’ दोनों हो सकता है। यीशु के आरोहण के प्रसंग में ‘स्वर्ग’ उपयुक्त है, जबकि पादटिप्पणी वास्तविक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: πορευομένου αὐτοῦ
  choice: उसके जाते समय
  rationale: यह समकालिक क्रिया को व्यक्त करता है और यूनानी पाठ से आगे बढ़कर गंतव्य या प्रस्थान का ढंग निर्धारित नहीं करता।
- source_word: ἰδοὺ
  choice: तो देखो
  rationale: यह आगे होने वाली बात की ओर ध्यान खींचने वाला कथात्मक संकेत है; ‘तो देखो’ उसकी विशिष्टता को सहज हिन्दी में बनाए रखता है।
- source_word: ἄνδρες δύο
  choice: दो पुरुष
  rationale: यूनानी पाठ स्पष्ट रूप से ‘दो पुरुष’ कहता है; उनकी स्वर्गदूतीय पहचान इस पद में सीधे नहीं जोड़ी गई है।
- source_word: παρειστήκεισαν
  choice: उनके पास खड़े थे
  rationale: यह उनके पास उपस्थित होकर खड़े होने का अर्थ देता है। ‘प्रकट हुए’ कहना मूल क्रिया से अधिक अर्थ जोड़ता।
- source_word: ἐσθήσεσι λευκαῖς
  choice: सफेद वस्त्र पहने
  rationale: ἐσθής सामान्य रूप से पहनावे या वस्त्र को सूचित करता है; यह अनुवाद किसी विशेष प्रकार के चोगे का अनुमान नहीं लगाता।
theological_decisions:
- issue: आरोहण के प्रसंग में οὐρανός का अनुवाद
  choice: स्वर्ग
  alternative: आकाश
  rationale: आरोहण का निकट प्रसंग ‘स्वर्ग’ का समर्थन करता है, पर यूनानी शब्द की स्थानगत अस्पष्टता को पादटिप्पणी में बनाए रखा गया है।
- issue: दो पुरुषों की पहचान
  choice: दो पुरुष
  alternative: दो स्वर्गदूत
  rationale: इस पद का यूनानी पाठ उन्हें ‘पुरुष’ कहता है, ‘स्वर्गदूत’ नहीं; इसलिए उनकी सम्भावित पहचान को अनुवाद में आरोपित नहीं किया गया।
