    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: खड़ा हुआ
  rationale: भाषण आरम्भ करने से पहले पतरस के उठकर खड़े होने की ठोस क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν μέσῳ
  choice: के बीच
  rationale: एकत्र समुदाय के भीतर पतरस की स्थिति को सहज और अर्थनिष्ठ हिन्दी में दर्शाता है।
- source_word: ἀδελφῶν
  choice: भाइयों
  rationale: यूनानी के पुल्लिंग बहुवचन को मुख्य पाठ में बनाए रखता है; सम्भावित समावेशी अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ὄχλος ὀνομάτων
  choice: लोग
  rationale: शाब्दिक रूप से ‘नामों की भीड़’ व्यक्तियों के गिने हुए समूह के लिए एक मुहावरा है; ‘लोग’ आधुनिक हिन्दी में उसका स्वाभाविक अर्थ देता है और असहज ‘नामों की संख्या’ से बचता है।
- source_word: ἐπὶ τὸ αὐτό
  choice: एक साथ
  rationale: समुदाय के एकत्र होने का भाव संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὡς ἑκατὸν εἴκοσι
  choice: लगभग एक सौ बीस
  rationale: संख्या के साथ ὡς द्वारा व्यक्त अनुमान को स्पष्ट रूप से बनाए रखता है।
- source_word: τε
  choice: वहाँ … थे
  rationale: कोष्ठकीय सूचना का संयोजक भाव हिन्दी वाक्य-विन्यास में स्वाभाविक अस्तित्ववाचक कथन से व्यक्त होता है; अलग ‘और’ आवश्यक नहीं है।
theological_decisions:
- issue: एकत्र समुदाय में ἀδελφῶν का लिंग-संबंधी आशय
  choice: मुख्य पाठ में ‘भाइयों’, और पादटिप्पणी में सम्भावित समावेशी अर्थ
  alternative: ‘भाइयों और बहनों’ अथवा ‘विश्वासियों’
  rationale: यह रूप यूनानी पुल्लिंग बहुवचन को छिपाता नहीं, पर इस सम्भावना को भी सुरक्षित रखता है कि संबोधन में स्त्री विश्वासी भी सम्मिलित थीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कोष्ठकीय कथन को हिन्दी में स्वाभाविक बनाने के लिए ‘नामों की भीड़’ के यूनानी मुहावरे का अर्थ ‘लोग’ किया गया है।
