source:
  edition: SBLGNT
  text: δεῖ οὖν τῶν συνελθόντων ἡμῖν ἀνδρῶν ἐν παντὶ χρόνῳ ⸀ᾧ εἰσῆλθεν καὶ ἐξῆλθεν ἐφ’ ἡμᾶς ὁ κύριος Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/021.yaml
  text: Therefore[a], it is necessary that one of the men who accompanied us during all the time in which the Lord Jesus went in and out among us[b],
translation:
  language: hi
  text: इसलिए यह आवश्यक है कि उन पुरुषों में से एक, जो उस पूरे समय हमारे साथ रहे[a] जब प्रभु यीशु हमारे बीच आते-जाते रहे[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो हमारे साथ थे”; अथवा अधिक शाब्दिक रूप से, “जो हमारे साथ इकट्ठे हुए थे।”
    reason: lexical_alternative
  - marker: b
    text: “हमारे बीच आते-जाते रहे” एक मुहावरा है, जो शिष्यों की संगति में यीशु के निरंतर सार्वजनिक जीवन और कार्य को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: δεῖ
  choice: यह आवश्यक है
  rationale: यह निर्वैयक्तिक क्रिया आवश्यकता व्यक्त करती है। यह रूप अगले पद में पूरा होने वाले वाक्य-संबंध को बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकाले गए निष्कर्ष को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῶν συνελθόντων ἡμῖν ἀνδρῶν
  choice: उन पुरुषों में से कोई एक, जो ... हमारे साथ रहे
  rationale: ἀνδρῶν का पुरुष-वाचक अर्थ सुरक्षित रखा गया है। συνελθόντων का शाब्दिक अर्थ साथ इकट्ठे होना है, पर यहाँ लंबे समय तक शिष्यों की संगति में रहने का भाव है। ‘कोई एक’ अगले पद में पूरे होने वाले यूनानी वाक्य का आशय हिन्दी में स्पष्ट करता है।
- source_word: ἐν παντὶ χρόνῳ
  choice: उस पूरे समय
  rationale: यह यीशु की शिष्यों के बीच सेवकाई की संपूर्ण अवधि को सूचित करता है, न कि प्रत्येक अलग अवसर को।
- source_word: ᾧ
  choice: जब
  rationale: कालवाचक संबंध को आधुनिक हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: εἰσῆλθεν καὶ ἐξῆλθεν
  choice: आते-जाते रहे
  rationale: यह स्रोत की गतिशील छवि को बनाए रखते हुए निरंतर संगति और गतिविधि का मुहावरेदार भाव देता है।
- source_word: ἐφ’ ἡμᾶς
  choice: हमारे बीच
  rationale: यह समूह के बीच यीशु की उपस्थिति और गतिविधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ κύριος Ἰησοῦς
  choice: प्रभु यीशु
  rationale: κύριος के मसीही पदनाम और उसके धार्मिक भार को स्थापित हिन्दी प्रयोग ‘प्रभु’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: κύριος का मसीही पदनाम
  choice: प्रभु यीशु
  alternative: स्वामी यीशु
  rationale: ‘प्रभु’ नए नियम में इस पदनाम के सम्मानसूचक और धर्मवैचारिक दोनों अर्थों को सुरक्षित रखता है; ‘स्वामी’ यहाँ अपेक्षाकृत सीमित अर्थ दे सकता है।
- issue: ἀνδρῶν का लिंग-विशिष्ट संदर्भ
  choice: पुरुषों
  alternative: लोगों / व्यक्तियों
  rationale: मूल पाठ में ἀνήρ विशेष रूप से पुरुषों को दर्शाता है, इसलिए इसे लिंग-निरपेक्ष नहीं किया गया।
- issue: अगले पद में पूर्ण होने वाला वाक्य
  choice: कोई एक
  alternative: मूल यूनानी की तरह ‘उन पुरुषों में से’ पर पद समाप्त करना
  rationale: यूनानी में मुख्य पूरक अगले पद में आता है। हिन्दी में समझ और व्याकरणगत प्रवाह के लिए ‘कोई एक’ स्पष्ट किया गया है, जबकि अंतिम अल्पविराम दिखाता है कि वाक्य अगले पद में जारी है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। पद का अंतिम अल्पविराम मूल वाक्य के अगले पद में जारी रहने को दर्शाता है।
