  text: Ἄνδρες ἀδελφοί, ἔδει πληρωθῆναι τὴν ⸀γραφὴν ἣν προεῖπε τὸ πνεῦμα τὸ ἅγιον διὰ στόματος Δαυὶδ περὶ Ἰούδα τοῦ γενομένου ὁδηγοῦ τοῖς συλλαβοῦσιν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/016.yaml
  text: Men[a], brothers, it was necessary for the Scripture to be fulfilled, which the Holy Spirit spoke beforehand through the mouth of David concerning Judas, who became a guide to those who arrested Jesus[c][b],
translation:
  language: hi
  text: हे भाइयो और सज्जनो, पवित्रशास्त्र का वह वचन पूरा होना आवश्यक था, जिसे पवित्र आत्मा ने दाऊद के मुख से[b] यहूदा के विषय में पहले ही कहा था[a], जो यीशु को पकड़नेवालों[c] का मार्गदर्शक बना था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पहले से कह दिया था’; इस क्रिया का अनुवाद ‘भविष्यवाणी की थी’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘दाऊद के मुख के द्वारा’; यह किसी मनुष्य के माध्यम से कही गई बात के लिए प्रयुक्त मुहावरा है।
    reason: cultural_note
  - marker: c
    text: या ‘यीशु को बंदी बनानेवालों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: हे पुरुषो, भाइयो
  rationale: दोनों संबोधन-पदों के पुल्लिंग बहुवचन रूप को बनाए रखा गया है। यद्यपि यह हिन्दी में औपचारिक सुनाई देता है, यह यूनानी संबोधन में ἄνδρες और ἀδελφοί दोनों की उपस्थिति को नहीं मिटाता।
- source_word: ἔδει πληρωθῆναι
  choice: पूरा होना आवश्यक था
  rationale: यह अनिवार्यता और पवित्रशास्त्र की पूर्ति—दोनों को व्यक्त करता है, पर उस अनिवार्यता के दार्शनिक या धर्मवैज्ञानिक तंत्र को पाठ से आगे जाकर निर्धारित नहीं करता।
- source_word: τὴν γραφὴν
  choice: पवित्रशास्त्र के उस वचन
  rationale: यहाँ γραφή किसी सामान्य लेख का नहीं, पवित्रशास्त्र के एक विशिष्ट कथन का संकेत है। हिन्दी में ‘उस वचन’ आगे आने वाले संबंधवाचक उपवाक्य के साथ स्वाभाविक है।
- source_word: προεῖπε
  choice: पहले ही कहा था
  rationale: क्रिया का मूल भाव ‘पहले कहा’ है। यह ‘भविष्यवाणी की’ की अपेक्षा कम व्याख्यात्मक है और पूर्वकथन का भाव बनाए रखता है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: यह आधुनिक हिन्दी में प्रचलित और स्रोत के अनुरूप पद है।
- source_word: διὰ στόματος Δαυὶδ
  choice: दाऊद के मुख से
  rationale: मूल की सजीव अभिव्यक्ति और दाऊद के माध्यम से पवित्र आत्मा के बोलने का साधनात्मक भाव सुरक्षित रखा गया है।
- source_word: περὶ Ἰούδα
  choice: यहूदा के विषय में
  rationale: περί के संबंध-सूचक अर्थ को औपचारिक किंतु सहज हिन्दी में व्यक्त करता है।
- source_word: τοῦ γενομένου ὁδηγοῦ
  choice: मार्गदर्शक बना था
  rationale: γενομένου के ‘बनने’ के भाव को सुरक्षित रखता है और अनिर्दिष्ट ὁδηγοῦ पर अनावश्यक निश्चितता नहीं थोपता।
- source_word: τοῖς συλλαβοῦσιν Ἰησοῦν
  choice: यीशु को पकड़नेवालों
  rationale: गिरफ्तारी के प्रसंग में συλλαμβάνω का अर्थ ‘पकड़ना’ या ‘बंदी बनाना’ है। ‘पकड़नेवाले’ स्पष्ट, स्वाभाविक और मूल कृदंत के निकट है।
theological_decisions:
- issue: पवित्रशास्त्र की पूर्ति की अनिवार्यता
  choice: ‘आवश्यक था’ कहा गया है, बिना यह बताए कि यह अनिवार्यता किस प्रकार कार्य करती थी।
  alternative: ‘परमेश्वर ने पहले से ऐसा ठहराया था’ या केवल ‘ऐसा होना उचित था।’
  rationale: पद अनिवार्यता बताता है, पर पूर्वनियति, पूर्वज्ञान और मानवीय उत्तरदायित्व के संबंध को विस्तार से नहीं समझाता; इसलिए उस तनाव को खुला रखा गया है।
- issue: प्रेरणा में दिव्य और मानवीय अभिकरण
  choice: पवित्र आत्मा को बोलनेवाला और दाऊद को वह मानवीय माध्यम रखा गया है जिसके मुख से वचन कहा गया।
  alternative: ‘दाऊद ने पवित्र आत्मा की प्रेरणा से कहा’ या ‘आत्मा ने दाऊद से लिखवाया।’
  rationale: यूनानी वाक्य में पवित्र आत्मा कर्ता है और दाऊद माध्यम; अनुवाद उसी संरचना को बनाए रखता है और लेखन का उल्लेख नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘हे पुरुषो, भाइयो’ कुछ औपचारिक है, पर मूल के दोहरे पुरुषवाचक संबोधन को सुरक्षित रखता है। वाक्य को हिन्दी की पठनीयता के लिए दो वाक्यों में बाँटा गया है; ‘यही यहूदा’ संबंधवाचक कृदंत का संदर्भ स्पष्ट करता है।
