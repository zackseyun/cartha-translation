  text: Οἱ μὲν οὖν συνελθόντες ⸀ἠρώτων αὐτὸν λέγοντες· Κύριε, εἰ ἐν τῷ χρόνῳ τούτῳ ἀποκαθιστάνεις τὴν βασιλείαν τῷ Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/006.yaml
  text: So when they had come together[a], they asked him, saying, “Lord, is it at this time that you are restoring the kingdom to Israel?”
translation:
  language: hi
  text: इसलिए जब वे इकट्ठे हुए, तो उन्होंने उससे पूछा, “प्रभु, क्या तू इसी समय इस्राएल को राज्य लौटा रहा है[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तू इसी समय इस्राएल के लिए राज्य फिर से स्थापित कर रहा है?” यूनानी में “इस्राएल” का रूप “इस्राएल को” अथवा “इस्राएल के लिए”—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ μὲν οὖν συνελθόντες
  choice: इसलिए जब वे इकट्ठे हुए
  rationale: सहभागी कृदन्त συνελθόντες को प्रसंगानुसार कालवाचक रूप में रखा गया है। μὲν οὖν कथा को आगे बढ़ाने वाला संबंधसूचक पदबंध है; ‘इसलिए’ पूर्ववर्ती प्रसंग से स्वाभाविक संबंध दिखाता है।
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: तो उन्होंने उससे पूछा
  rationale: अपूर्णकाल ἠρώτων का सरल हिन्दी कथात्मक रूप ‘पूछा’ स्वाभाविक है। λέγοντες को अलग से ‘कहते हुए’ कहना हिन्दी में अनावश्यक बोझिल होता, इसलिए उद्धरण के साथ ‘पूछा’ में समाहित किया गया है।
- source_word: Κύριε
  choice: प्रभु
  rationale: κύριος के सम्मानसूचक और धर्मवैज्ञानिक भार को बनाए रखने के लिए मानक हिन्दी ‘प्रभु’ चुना गया है।
- source_word: ἐν τῷ χρόνῳ τούτῳ
  choice: इसी समय
  rationale: यह पद किसी समयावधि या वर्तमान अवसर की ओर संकेत करता है। ‘इसी समय’ प्रश्न में निहित समय-संबंधी बल को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀποκαθιστάνεις
  choice: फिर से सौंप रहा है
  rationale: ἀποκαθίστημι किसी वस्तु को उसकी पूर्व दशा या धारक के पास पुनः स्थापित करने का भाव रखता है। राज्य को ‘इस्राएल को’ दिए जाने की संरचना में ‘फिर से सौंपना’ स्वाभाविक है और पुनर्स्थापना का भाव बनाए रखता है।
- source_word: τὴν βασιλείαν
  choice: राज्य
  rationale: βασιλεία शासन या राज्य दोनों का बोध करा सकता है। यहाँ इस्राएल को उसकी पुनर्स्थापना की बात होने के कारण ‘राज्य’ शिष्यों की ठोस अपेक्षा को बिना अधिक व्याख्या के सुरक्षित रखता है।
- source_word: τῷ Ἰσραήλ
  choice: इस्राएल को
  rationale: यूनानी सम्प्रदान कारक का सीधा संबंध पुनर्स्थापित किए जाने वाले राज्य के प्राप्तकर्ता से हो सकता है। ‘इस्राएल को’ इस संरचना को निकटता से बनाए रखता है।
theological_decisions:
- issue: इस्राएल के राज्य के विषय में शिष्यों की अपेक्षा का स्वरूप
  choice: प्रश्न को इस्राएल को राज्य फिर से सौंपे जाने की अपेक्षा के रूप में सीधा रखा गया है।
  alternative: इसे केवल राजनीतिक राज्य, केवल आत्मिक शासन, अथवा ‘इस्राएल का राज्य’ कहकर अधिक निश्चित करना।
  rationale: पद शिष्यों का प्रश्न दर्ज करता है; वह उनकी हर धारणा का न तो अनुमोदन करता है, न इसी पद में उसका खंडन। इसलिए ऐतिहासिक और धर्मवैज्ञानिक तनाव को व्याख्यात्मक रूप से हल नहीं किया गया।
- issue: τῷ Ἰσραήλ में सम्प्रदान कारक का अर्थ
  choice: मुख्य पाठ में ‘इस्राएल को’
  alternative: ‘इस्राएल के लिए’
  rationale: सम्प्रदान कारक प्राप्तकर्ता अथवा हित—दोनों अर्थ दे सकता है। मुख्य पाठ में अधिक प्रत्यक्ष संबंध रखा गया है और वास्तविक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। यीशु के लिए प्रत्यक्ष संबोधन में पारंपरिक आदरसूचक एकवचन ‘तू’ रखा गया है। वाक्यरचना को यूनानी के निकट रखते हुए अप्राकृतिक ‘कहते हुए पूछा’ से बचा गया है।
