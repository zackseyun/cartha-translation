language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὅτε εἰσῆλθον, ⸂εἰς τὸ ὑπερῷον ἀνέβησαν⸃ οὗ ἦσαν καταμένοντες, ὅ τε Πέτρος καὶ ⸂Ἰωάννης καὶ Ἰάκωβος⸃ καὶ Ἀνδρέας, Φίλιππος καὶ Θωμᾶς, Βαρθολομαῖος καὶ Μαθθαῖος, Ἰάκωβος Ἁλφαίου καὶ Σίμων ὁ ζηλωτὴς καὶ Ἰούδας Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/013.yaml
  text: 'And when they had entered[a], they went up to the upstairs room where they were staying: Peter, John, James, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus, and Simon the Zealot, and Judas the son of James.'
translation:
  language: hi
  text: जब वे अंदर आए, तो ऊपर के उस कमरे में गए जहाँ वे ठहरे हुए थे। वहाँ पतरस, यूहन्ना, याकूब और अन्द्रियास; फिलिप्पुस और थोमा; बरतुलमै और मत्ती; हलफई का पुत्र याकूब; ज़ीलोती शमौन; और याकूब का पुत्र[a] यहूदा थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘याकूब का भाई यहूदा।’ यूनानी में केवल ‘याकूब का यहूदा’ है; दोनों के बीच ठीक कौन-सा सम्बन्ध था, यह स्पष्ट नहीं किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσῆλθον
  choice: वे अंदर आए
  rationale: क्रिया प्रवेश करने का भाव देती है, पर इस वाक्य में स्थान स्पष्ट नहीं किया गया है। इसलिए किसी स्थान, जैसे नगर या घर, को जोड़ने के बजाय मूल की अस्पष्टता बनाए रखी गई है।
- source_word: εἰς τὸ ὑπερῷον ἀνέβησαν
  choice: ऊपर के उस कमरे में गए
  rationale: यह अभिव्यक्ति ऊपर जाने की गति और ऊपर स्थित कमरे—दोनों को व्यक्त करती है। यह आधुनिक हिन्दी में स्वाभाविक है और किसी बाद की कलीसियाई धारणा को नहीं जोड़ती।
- source_word: οὗ ἦσαν καταμένοντες
  choice: जहाँ वे ठहरे हुए थे
  rationale: यहाँ लगातार कुछ समय तक रहने या ठहरे रहने का भाव है; ‘ठहरे हुए थे’ उस कालगत और अस्थायी निवास के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: Ἰάκωβος Ἁλφαίου
  choice: हलफई का पुत्र याकूब
  rationale: सम्बन्धवाचक षष्ठी इस याकूब की पहचान बताती है और प्रसंग में पितृनाम सबसे स्वाभाविक अर्थ है।
- source_word: Σίμων ὁ ζηλωτὴς
  choice: उत्साही कहलानेवाला शमौन
  rationale: ζηλωτής यहाँ पहचानसूचक उपाधि है। ‘उत्साही कहलानेवाला’ इसके मूल अर्थ को पाठक के लिए स्पष्ट रखता है और किसी सुव्यवस्थित राजनीतिक दल की सदस्यता को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: Ἰούδας Ἰακώβου
  choice: याकूब का पुत्र यहूदा
  rationale: पुरुषों की इस नामावली में षष्ठी को पितृनाम समझना सबसे सम्भावित है; फिर भी यूनानी में सम्बन्ध स्पष्ट नहीं किया गया, इसलिए दूसरी सम्भावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: Ἰούδας Ἰακώβου में यहूदा और याकूब का सम्बन्ध
  choice: याकूब का पुत्र यहूदा
  alternative: याकूब का भाई यहूदा
  rationale: यूनानी पाठ केवल ‘याकूब का यहूदा’ कहता है। नामावली के प्रसंग में ‘पुत्र’ अधिक सम्भावित है, पर ‘भाई’ व्याकरणतः सम्भव होने के कारण मूल की अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। नामों के समूहों को अर्धविरामों से अलग किया गया है ताकि यूनानी सूची की संरचना स्पष्ट रहे, पर प्रत्येक καί को यांत्रिक रूप से दोहराया नहीं गया।
