  naturalness: The Hindi is generally clear, modern, and suitably dignified. ‘शमौन ज़ीलोती’ is a more concise and established title-like rendering in this apostolic list than ‘उत्साही कहलानेवाला शमौन.’
  terminology: The personal names and patronymics are suitable. Rendering ζηλωτής as ‘ज़ीलोती’ preserves its function as Simon’s distinguishing epithet without deciding whether it denotes a formal political affiliation in this instance.
  issues:
  - severity: medium
    issue: The epithet ὁ ζηλωτής is rendered as ‘उत्साही कहलानेवाला.’
    rationale: The Greek presents an identifying title, conventionally ‘the Zealot.’ ‘उत्साही कहलानेवाला’ turns this into a generalized characterization and the added ‘कहलानेवाला’ is less direct. ‘ज़ीलोती’ retains the title and avoids overdefining its historical-political force.
