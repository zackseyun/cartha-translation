  text: καὶ γνωστὸν ἐγένετο πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ, ὥστε κληθῆναι τὸ χωρίον ἐκεῖνο τῇ ⸀ἰδίᾳ διαλέκτῳ αὐτῶν Ἁκελδαμάχ, τοῦτ’ ἔστιν Χωρίον Αἵματος.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/019.yaml
  text: And it became known to all those living in Jerusalem[a], so that in their own language that field was called Akeldamach, that is[b], Field of Blood.
translation:
  language: hi
  text: और यह बात यरूशलेम के सभी निवासियों को मालूम हो गई; फलस्वरूप उनकी अपनी भाषा[a] में उस खेत का नाम हकेलदमाख[b] पड़ गया, अर्थात् “लहू का खेत।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी अपनी बोली में।” यूनानी शब्द διάλεκτος किसी क्षेत्रीय बोली या अधिक सामान्य अर्थ में किसी भाषा को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: कई अनुवादों में इस नाम का अधिक परिचित रूप “हकलदमा” मिलता है; यहाँ यूनानी पाठ का रूप Ἁκελδαμάχ है।
    reason: alternative_reading
lexical_decisions:
- source_word: γνωστὸν ἐγένετο
  choice: यह बात ... मालूम हो गई
  rationale: यूनानी निर्वैयक्तिक अभिव्यक्ति बताती है कि पहले कही गई घटना व्यापक रूप से ज्ञात हो गई। संदर्भ को स्वाभाविक हिन्दी में जोड़ने के लिए “यह बात” का प्रयोग किया गया है।
- source_word: πᾶσι τοῖς κατοικοῦσιν Ἰερουσαλήμ
  choice: यरूशलेम के सभी निवासियों को
  rationale: यह κατοικοῦσιν के स्थायी या सामान्य निवास के भाव को संक्षिप्त और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὥστε
  choice: फलस्वरूप
  rationale: यहाँ ὥστε परिणाम बताता है; “फलस्वरूप” उसी संबंध को स्पष्ट करता है, उसे केवल तार्किक निष्कर्ष नहीं बनाता।
- source_word: κληθῆναι
  choice: नाम ... पड़ गया
  rationale: हिन्दी में किसी स्थान के प्रचलित नाम को व्यक्त करने के लिए “नाम पड़ गया” स्वाभाविक है और यूनानी कर्मवाच्य के परिणामात्मक भाव को बनाए रखता है।
- source_word: τὸ χωρίον ἐκεῖνο
  choice: उस खेत
  rationale: χωρίον भूमि के एक टुकड़े या खेत को सूचित कर सकता है। आगे दिए गए नामार्थ “लहू का खेत” से शब्दगत संगति रखने के लिए “खेत” चुना गया है।
- source_word: τῇ ἰδίᾳ διαλέκτῳ αὐτῶν
  choice: उनकी अपनी भाषा में
  rationale: διάλεκτος का अर्थ “भाषा” या “बोली” दोनों हो सकता है। मुख्य पाठ में सहज व्यापक शब्द “भाषा” रखा गया है और संकरा विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: Ἁκελδαμάχ
  choice: हकेलदमाख
  rationale: यह SBLGNT में दिए यूनानी रूप का निकट देवनागरी लिप्यंतरण है, जिसमें आरंभिक श्वास-ध्वनि और अंतिम χ को दर्शाया गया है। अधिक परिचित छोटा रूप पाद-टिप्पणी में दिया गया है।
- source_word: τοῦτ’ ἔστιν
  choice: अर्थात्
  rationale: यह सूत्र आगे आने वाले नामार्थ की व्याख्या करता है; “अर्थात्” संक्षिप्त, स्पष्ट और गरिमापूर्ण है।
- source_word: Χωρίον Αἵματος
  choice: लहू का खेत
  rationale: यह यूनानी पाठ में स्वयं दिया गया स्थान-नाम का अर्थ है। “लहू” साधारण पाठकों के लिए बोधगम्य और बाइबलीय प्रसंग में स्वाभाविक है।
