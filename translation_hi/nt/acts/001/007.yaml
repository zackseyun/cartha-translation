source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ πρὸς αὐτούς· Οὐχ ὑμῶν ἐστιν γνῶναι χρόνους ἢ καιροὺς οὓς ὁ πατὴρ ἔθετο ἐν τῇ ἰδίᾳ ἐξουσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/007.yaml
  text: But he said to them[b][a], “It is not for you to know times or seasons that the Father has set by his own authority.”
translation:
  language: hi
  text: पर उसने उनसे कहा, “उन समयों या अवसरों[a] को जानना तुम्हारा काम नहीं है, जिन्हें पिता ने अपने ही अधिकार में रखा है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “समयों या नियत घड़ियों।” यूनानी में दो संबंधित शब्द हैं: एक समय या कालावधि पर और दूसरा उपयुक्त, निर्णायक अथवा नियत अवसर पर बल दे सकता है।'
    reason: lexical_alternative
  - marker: b
    text: या “जिन्हें पिता ने अपने ही अधिकार से निर्धारित किया है।” यूनानी का शाब्दिक भाव “अपने ही अधिकार में” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह शिष्यों के प्रश्न से यीशु के सुधारात्मक उत्तर की ओर हल्का विरोध अथवा विमर्शगत मोड़ दिखाता है।
- source_word: Οὐχ ὑμῶν ἐστιν γνῶναι
  choice: जानना तुम्हारा काम नहीं है
  rationale: यह स्वाभाविक आधुनिक हिन्दी में बताता है कि यह ज्ञान शिष्यों के अधिकार-क्षेत्र या जिम्मे की बात नहीं है; इससे केवल असमर्थता का अर्थ नहीं निकलता।
- source_word: χρόνους ἢ καιροὺς
  choice: समयों या अवसरों
  rationale: ‘समयों’ से अवधि या काल का सामान्य भाव और ‘अवसरों’ से उपयुक्त, निर्णायक अथवा नियत घड़ी का भाव व्यक्त होता है; दोनों निकट-संबंधी शब्दों का भेद कठोर तकनीकी अर्थ दिए बिना बचता है।
- source_word: ὁ πατὴρ
  choice: पिता
  rationale: यूनानी पाठ में ‘पिता’ उपाधि है, ‘मेरे पिता’ नहीं; हिन्दी में संदर्भ के अनुसार बिना अनावश्यक विस्तार के रखा गया है।
- source_word: ἔθετο
  choice: रखा है
  rationale: τίθημι यहाँ निर्धारित करने या अपने अधिकार में स्थापित रखने का भाव देता है; निकटवर्ती ἐν τῇ ἰδίᾳ ἐξουσίᾳ के साथ ‘अधिकार में रखा है’ स्वाभाविक और अर्थपूर्ण हिन्दी है।
- source_word: ἐν τῇ ἰδίᾳ ἐξουσίᾳ
  choice: अपने ही अधिकार में
  rationale: ἐν का स्थानिक/क्षेत्रगत रूप और ἰδίᾳ का ‘अपने ही’ बल सुरक्षित रहता है; यह पिता के विशिष्ट अधिकार-क्षेत्र को व्यक्त करता है।
theological_decisions:
- issue: χρόνους और καιρούς के काल-संबंधी युग्म का अनुवाद
  choice: समयों या अवसरों
  alternative: समयों या नियत घड़ियों
  rationale: पाठ दो संबंधित कालगत धारणाओं में भेद करता है, पर उन्हें किसी कठोर भविष्यवाणी-प्रणाली के तकनीकी पद नहीं बनाता। मुख्य पाठ सहज रखा गया और वैकल्पिक सूक्ष्मता पादटिप्पणी में दी गई।
- issue: पिता के संबंध में ἐξουσία का अर्थ
  choice: अपने ही अधिकार में रखा है
  alternative: अपने ही अधिकार से निर्धारित किया है
  rationale: यह पिता के संप्रभु विशेषाधिकार को स्पष्ट करता है और यूनानी ἐν के ‘अधिकार के क्षेत्र में’ वाले रूप को भी बचाता है, बिना बाद की किसी विशिष्ट धर्मसैद्धांतिक शब्दावली को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘तुम्हारा काम नहीं’ सामान्य पाठक के लिए स्वाभाविक है और अधिकार-क्षेत्र का भाव देता है; ‘अपने ही अधिकार में’ मूल यूनानी संरचना तथा धर्मवैचारिक संयम को बनाए रखता है।
