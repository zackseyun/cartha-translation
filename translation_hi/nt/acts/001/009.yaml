  text: καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/009.yaml
  text: And after he said these things[a], as they were watching, he was lifted up[c][b], and a cloud took him out of their sight.
translation:
  language: hi
  text: ये बातें कहने के बाद, उनके देखते-देखते वह ऊपर उठाया गया[a], और एक बादल ने उसे उनकी दृष्टि से ओझल कर दिया[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे ऊपर ले लिया गया।”
    reason: lexical_alternative
  - marker: b
    text: या अधिक शाब्दिक रूप में, “एक बादल उसे उनकी दृष्टि से ले गया।”
    reason: lexical_alternative
  - marker: c
    text: बाइबिल के कुछ प्रसंगों में बादल परमेश्वर की उपस्थिति का संकेत देता है; यहाँ ऐसा संकेत हो सकता है, पर यह पद इसे स्पष्ट रूप से नहीं कहता।
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: सरल कथात्मक संयोजक के रूप में यह पिछले कथन से घटना को जोड़ता है और यूनानी पाठ से अधिक समय-संबंधी अर्थ नहीं जोड़ता।
- source_word: ταῦτα εἰπὼν
  choice: ये बातें कहने के बाद
  rationale: बहुवचन संकेतवाचक यीशु के पिछले वचनों की ओर लौटता है; भूतकालिक कृदंत मुख्य घटना से पहले पूर्ण हुए कथन को दर्शाता है।
- source_word: βλεπόντων αὐτῶν
  choice: उनके देखते-देखते
  rationale: यह संबंधविहीन संबंधकारक रचना उस समय चल रही प्रत्यक्ष दृष्टि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: ἐπήρθη
  choice: ऊपर उठा लिया गया
  rationale: कर्मवाच्य रूप दृश्य रूप से ऊपर उठाए जाने को व्यक्त करता है और कर्ता को अनकहा ही रखता है, जैसा यूनानी पाठ में है।
- source_word: νεφέλη
  choice: एक बादल
  rationale: एकवचन संज्ञा के साथ उपपद नहीं है; ‘एक बादल’ सहज अनिश्चित अर्थ देता है और मुख्य पाठ में प्रतीकात्मक पहचान नहीं जोड़ता।
- source_word: ὑπέλαβεν αὐτὸν
  choice: उसे ... ओझल कर दिया
  rationale: क्रिया का अर्थ ‘ले लेना/ग्रहण कर लेना’ हो सकता है; अगले पदबंध के साथ मिलकर इसका प्रसंगगत परिणाम यह है कि वह उनकी दृष्टि से ओझल हो गया। अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἀπὸ τῶν ὀφθαλμῶν αὐτῶν
  choice: उनकी दृष्टि से
  rationale: ‘उनकी आँखों से’ का यह स्वाभाविक हिन्दी मुहावरा दृश्य बोध से हट जाने का अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: ἐπήρθη में ऊपर उठने की घटना को किस प्रकार व्यक्त किया जाए
  choice: ऊपर उठा लिया गया
  alternative: ऊपर उठाया गया
  rationale: चुना हुआ रूप दृश्य गति और यूनानी कर्मवाच्य—दोनों को सुरक्षित रखता है, पर यह स्पष्ट नहीं करता कि किसने उठाया; इस प्रकार पाठ से आगे कोई कर्ता नहीं जोड़ा जाता।
- issue: बादल को परमेश्वर की उपस्थिति का स्पष्ट प्रतीक बनाया जाए या नहीं
  choice: मुख्य पाठ में केवल ‘एक बादल’
  alternative: परमेश्वर की उपस्थिति का बादल
  rationale: बाइबिल के अन्य प्रसंगों में बादल परमेश्वर की उपस्थिति से जुड़ सकता है, पर यह पद स्वयं उस अर्थ को स्पष्ट नहीं करता। इसलिए संभावित अनुगूँज पादटिप्पणी में है, मुख्य पाठ में नहीं।
- issue: ὑπέλαβεν का शाब्दिक या परिणामसूचक अनुवाद
  choice: दृष्टि से ओझल कर दिया
  alternative: दृष्टि से ले लिया
  rationale: चुना हुआ पाठ आधुनिक हिन्दी में घटना का अभिप्राय स्पष्ट करता है; पादटिप्पणी क्रिया की वास्तविक शाब्दिक अनिश्चितता को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘उनके देखते-देखते’ प्रत्यक्षदर्शी परिस्थिति को सहज रूप देता है। ‘ओझल कर दिया’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी में अधिक शाब्दिक विकल्प देकर मूल क्रिया की अर्थ-सीमा सुरक्षित रखी गई है।
