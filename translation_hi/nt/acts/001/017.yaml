  text: ὅτι κατηριθμημένος ἦν ⸀ἐν ἡμῖν καὶ ἔλαχεν τὸν κλῆρον τῆς διακονίας ταύτης.—
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/017.yaml
  text: For he was numbered among us and received a share in this ministry[a].
translation:
  language: hi
  text: क्योंकि वह हमारे बीच गिना गया था और उसे इस सेवा में भाग मिला था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे इस सेवा का चिट्ठी द्वारा निकला भाग मिला था।” यूनानी शब्द κλῆρος का अर्थ “चिट्ठी द्वारा निकला भाग” या “हिस्सा/आवंटित भाग” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ यह संयोजक पतरस के कथन का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ उसके व्याख्यात्मक-कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κατηριθμημένος ἦν
  choice: गिना गया था
  rationale: यह रचना यह बताती है कि यहूदा वास्तव में उस समूह में सम्मिलित माना गया था। निष्क्रिय भाव बनाए रखने के लिए ‘गिना गया था’ चुना गया है।
- source_word: ἐν ἡμῖν
  choice: हममें
  rationale: यह केवल साथ रहने के बजाय समूह के भीतर सदस्यता व्यक्त करता है; ‘हममें’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἔλαχεν
  choice: मिला था
  rationale: λαγχάνω पाने या आवंटित होने का अर्थ दे सकता है। ‘मिला था’ सहज हिन्दी है, जबकि आवंटन का संभावित भाव ‘भाग’ और पादटिप्पणी में सुरक्षित है।
- source_word: τὸν κλῆρον
  choice: अपना भाग
  rationale: κλῆρος का अर्थ ‘चिट्ठी’, ‘आवंटित हिस्सा’ या ‘भाग’ हो सकता है। प्रसंग में ‘अपना भाग’ सेवकाई में वास्तविक सहभागिता व्यक्त करता है और हिन्दी में किसी तत्काल चिट्ठी डालने की घटना का भ्रामक संकेत नहीं देता।
- source_word: τῆς διακονίας ταύτης
  choice: इस सेवा में
  rationale: διακονία यहाँ प्रेरितों के सौंपे हुए सेवाकार्य को दर्शाता है। ‘इस सेवा में’ सामान्य आधुनिक पाठक के लिए स्पष्ट, स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: प्रेरिताई की सेवा से यहूदा का संबंध
  choice: पद यह कहता है कि यहूदा उनमें गिना गया था और उसे इस सेवा में वास्तविक भाग मिला था।
  alternative: इसे केवल समूह के साथ बाहरी संगति के रूप में कमजोर करके समझा जा सकता है।
  rationale: यूनानी पाठ सदस्यता और सहभागिता दोनों को स्पष्ट करता है। अनुवाद इस ऐतिहासिक वास्तविकता को बनाए रखता है, पर इससे यहूदा की स्वीकृति, अंतिम स्थिति या किसी व्यापक सिद्धान्त के विषय में पाठ से आगे निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; शैली सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘सेवा’ धार्मिक पारिभाषिकता से अनावश्यक रूप से बोझिल हुए बिना διακονία का अर्थ देता है।
