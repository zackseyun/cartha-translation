id: ACT.1.24
reference: Acts 1:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ προσευξάμενοι εἶπαν Σὺ κύριε καρδιογνῶστα πάντων, ἀνάδειξον ὃν ἐξελέξω, ἐκ τούτων τῶν δύο ἕνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/024.yaml
  text: And after praying[a], they said, “You, Lord, knower of the hearts of all[b], show which one of these two you have chosen,”
translation:
  language: hi
  text: और प्रार्थना करने के बाद उन्होंने कहा, “हे प्रभु, आप सबके हृदयों को जानते हैं; इन दोनों में से उस एक को प्रकट कीजिए[a] जिसे आपने चुना है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बताइए” अथवा “नियुक्त कीजिए”; यूनानी क्रिया किसी को प्रकट करने या सार्वजनिक रूप से निर्दिष्ट करने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “प्रभु” का संबोधन सामान्य रूप से परमेश्वर के लिए या विशेष रूप से यीशु के लिए समझा जा सकता है; यूनानी पाठ अभिप्रेत व्यक्ति को स्पष्ट रूप से नहीं बताता।
    reason: alternative_reading
lexical_decisions:
- source_word: προσευξάμενοι
  choice: प्रार्थना करने के बाद
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई क्रिया को दर्शाता है; यह हिंदी में स्वाभाविक रूप से क्रम को स्पष्ट करता है।
- source_word: Σὺ κύριε
  choice: हे प्रभु, आप
  rationale: ‘हे प्रभु’ संबोधन को और ‘आप’ मूल के बलयुक्त सर्वनाम को बनाए रखता है; आदरार्थक रूप प्रार्थना के प्रसंग में स्वाभाविक है।
- source_word: καρδιογνῶστα πάντων
  choice: आप सबके हृदयों को जानते हैं
  rationale: ग्रीक संयुक्त संबोधन का अर्थ साधारण आधुनिक हिंदी में स्पष्ट करता है और πάντων को ‘सबके’ के रूप में सुरक्षित रखता है।
- source_word: ἀνάδειξον
  choice: प्रकट कीजिए
  rationale: यहाँ प्रभु से पहले चुने गए व्यक्ति की पहचान जाहिर करने की विनती है; ‘प्रकट कीजिए’ नियुक्ति का अर्थ अनावश्यक रूप से आरोपित नहीं करता।
- source_word: ὃν ἐξελέξω
  choice: जिसे आपने चुना है
  rationale: मध्यवाच्य क्रिया प्रभु के अपने चुनाव को व्यक्त करती है; हिंदी पूर्णकाल पूर्व चुनाव और उसकी वर्तमान प्रासंगिकता दोनों को स्वाभाविक ढंग से बताता है।
- source_word: ἐκ τούτων τῶν δύο ἕνα
  choice: इन दोनों में से उस एक को
  rationale: चुनाव के दायरे और एक व्यक्ति को चुनने की बात दोनों को बिना ‘पुरुष’ जैसे अप्रकट शब्द जोड़े व्यक्त करता है।
theological_decisions:
- issue: प्रार्थना में ‘प्रभु’ का अभिप्रेत व्यक्ति
  choice: अनुवाद में केवल ‘प्रभु’ रखा गया है और यह निर्धारित नहीं किया गया कि संबोधन पिता परमेश्वर से है या यीशु से।
  alternative: इसे सामान्य रूप से परमेश्वर अथवा विशेष रूप से पुनर्जीवित यीशु को संबोधित मानना।
  rationale: ग्रीक पाठ κύριε के संदर्भ को स्पष्ट रूप से नहीं पहचानता; इसलिए अनुवाद मूल की धार्मिक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, आदरपूर्ण और सार्वजनिक पाठ के योग्य शैली। वाक्य विन्यास सहज रखा गया है, जबकि मूल पाठ का बल, चयन की पूर्वता और ‘प्रभु’ के संदर्भ की अस्पष्टता सुरक्षित हैं।
