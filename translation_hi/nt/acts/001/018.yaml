id: ACT.1.18
reference: Acts 1:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὗτος μὲν οὖν ἐκτήσατο χωρίον ἐκ μισθοῦ τῆς ἀδικίας, καὶ πρηνὴς γενόμενος ἐλάκησεν μέσος, καὶ ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/018.yaml
  text: So this man acquired a field with the wages of unrighteousness[a], and falling headlong he burst open in the middle[c][b], and all his intestines spilled out.
translation:
  language: hi
  text: इसलिए इस व्यक्ति ने अधर्म की कमाई से एक खेत प्राप्त किया[a], और सिर के बल गिरने पर वह बीच से फट गया[b], और उसकी सारी आँतें बाहर निकल पड़ीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘प्राप्त किया’ है। इसका अर्थ यह हो सकता है कि उस धन से जुड़ा खेत उसके अधिकार में आया; यह आवश्यक नहीं कि उसने स्वयं सीधे उसे खरीदा हो। ‘अधर्म की कमाई’ का अनुवाद ‘बुराई का प्रतिफल’ भी हो सकता है।
    reason: शाब्दिक विकल्प और खेत की प्राप्ति के ढंग की वास्तविक अस्पष्टता स्पष्ट करना।
  - marker: b
    text: या, ‘औंधा हो जाने पर वह बीच से फट गया।’ यूनानी पद सिर की ओर या मुँह के बल पड़ी अवस्था का संकेत दे सकता है।
    reason: πρηνὴς γενόμενος के वैकल्पिक शाब्दिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: Οὗτος μὲν οὖν
  choice: इसलिए इस आदमी ने
  rationale: Οὗτος यहूदा की ओर संकेत करता है और μέν οὖν कथा को आगे बढ़ाते हुए निष्कर्षात्मक संबंध दिखाता है। ‘इसलिए इस आदमी ने’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκτήσατο
  choice: प्राप्त किया
  rationale: κτάομαι का अर्थ किसी वस्तु को प्राप्त करना या उस पर अधिकार पाना है। ‘प्राप्त किया’ ‘खरीदा’ की अपेक्षा व्यापक है और यह निर्धारित नहीं करता कि खेत की खरीद स्वयं यहूदा ने सीधे की थी।
- source_word: χωρίον
  choice: एक खेत
  rationale: χωρίον यहाँ भूमि के एक भाग या खेत को दर्शाता है। ‘खेत’ सरल, प्रचलित और प्रसंगानुकूल है।
- source_word: ἐκ μισθοῦ τῆς ἀδικίας
  choice: अधर्म की कमाई से
  rationale: μισθός मेहनताना, मजदूरी, प्रतिफल या कमाई और ἀδικία अधर्म/अन्याय को व्यक्त करता है। ‘अधर्म की कमाई से’ यूनानी रूपक की नैतिक तीव्रता रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: πρηνὴς γενόμενος
  choice: सिर के बल गिरने पर
  rationale: πρηνής औंधे, मुँह के बल या सिर की ओर गिरने की अवस्था बताता है। प्रसंग में ‘सिर के बल गिरने पर’ संभावित गतिशील अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐλάκησεν μέσος
  choice: उसका शरीर बीच से फट गया
  rationale: λακάω फट जाने या चिर जाने और μέσος मध्य भाग को सूचित करता है। हिन्दी में कर्ता को स्पष्ट करने के लिए ‘उसका शरीर’ जोड़ा गया है; मूल का आशय नहीं बदला गया।
- source_word: ἐξεχύθη πάντα τὰ σπλάγχνα αὐτοῦ
  choice: उसकी सारी आँतें बाहर निकल पड़ीं
  rationale: ἐκχέω बाहर बहने/उंडेल दिए जाने का और σπλάγχνα भीतरी अंगों या आँतों का बोध देता है। ‘आँतें बाहर निकल पड़ीं’ आधुनिक पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: खेत प्राप्त करने में यहूदा की भूमिका
  choice: ἐκτήσατο का अनुवाद ‘प्राप्त किया’ किया गया है, ‘खरीदा’ नहीं।
  alternative: ‘उसने खेत खरीदा’ अथवा ‘उसके धन से/उसके नाम पर खेत खरीदा गया।’
  rationale: यूनानी क्रिया प्राप्ति या अधिकार को व्यक्त कर सकती है, पर खरीद की विधि को अनिवार्य रूप से निर्धारित नहीं करती। यह अनुवाद मत्ती 27:5–8 के साथ संबंध को स्वयं सुलझाए बिना मूल पाठ का तनाव बनाए रखता है।
- issue: πρηνὴς γενόμενος में गिरने की मुद्रा
  choice: ‘सिर के बल गिरने पर’
  alternative: ‘औंधा हो जाने पर’ या ‘मुँह के बल गिरने पर।’
  rationale: शब्द सिर की ओर/औंधी अवस्था की वास्तविक अस्पष्टता रखता है। मुख्य पाठ संभावित गतिशील अर्थ देता है और पाद-टिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, स्पष्ट और गरिमापूर्ण रखी गई है। हिंसक विवरण को मूल के अनुरूप सीधे व्यक्त किया गया है, पर अनावश्यक रूप से अलंकृत नहीं किया गया। ‘प्राप्त किया’ द्वारा पाठ की धर्मवैचारिक और कथात्मक अस्पष्टता सुरक्षित रखी गई है।
