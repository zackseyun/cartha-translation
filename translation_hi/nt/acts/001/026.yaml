  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चिट्ठियाँ डालना’ चयन की प्रक्रिया के लिए सामान्य हिन्दी मुहावरा है, जबकि ‘साथ गिना गया’ मूल यूनानी की सावधानी और निष्क्रिय रूप को सुरक्षित रखता है।
