    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν κλήρους αὐτοῖς
  choice: उन्होंने उन दोनों के लिए चिट्ठियाँ डालीं
  rationale: यूनानी वाक्यांश का शाब्दिक अर्थ ‘उन्होंने उन्हें चिट्ठियाँ दीं’ है, पर इस प्रसंग में यह चयन के लिए चिट्ठी डालने की प्रचलित क्रिया को दर्शाता है। αὐτοῖς पूर्वपद में बताए गए दो प्रत्याशियों की ओर संकेत करता है, इसलिए ‘उन दोनों के लिए’ अर्थ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: κλήρους / ὁ κλῆρος
  choice: चिट्ठियाँ / चिट्ठी
  rationale: इस कथात्मक प्रसंग में κλῆρος का अर्थ भाग या विरासत नहीं, बल्कि चयन के लिए प्रयुक्त चिट्ठी है।
- source_word: ἔπεσεν ὁ κλῆρος ἐπὶ Μαθθίαν
  choice: चिट्ठी मत्तियाह के नाम निकली
  rationale: यह स्वाभाविक आधुनिक हिन्दी में चिट्ठी द्वारा हुए चयन का परिणाम व्यक्त करता है और यूनानी मुहावरे ‘चिट्ठी मत्तियाह पर पड़ी’ का आशय बनाए रखता है।
- source_word: Μαθθίαν
  choice: मत्तियाह
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: συγκατεψηφίσθη
  choice: साथ गिना गया
  rationale: क्रिया किसी व्यक्ति को एक समूह के साथ गिनने या उसी में मानने को दर्शाती है। यह रूप निष्क्रियता को बनाए रखता है और ‘जोड़ा गया’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: μετὰ τῶν ἕνδεκα ἀποστόλων
  choice: ग्यारह प्रेरितों के साथ
  rationale: सम्बन्धकारक के साथ μετά का सीधा अर्थ ‘के साथ’ है; इससे मत्तियाह को पहले से विद्यमान ग्यारह प्रेरितों के साथ गिने जाने का भाव मिलता है।
theological_decisions:
- issue: क्या συγκατεψηφίσθη का अनुवाद कथन से आगे बढ़कर किसी विशिष्ट दैवी या कलीसियाई नियुक्ति का संकेत दे
  choice: वह ग्यारह प्रेरितों के साथ गिना गया
  alternative: वह ग्यारह प्रेरितों में जोड़ दिया गया
  rationale: यूनानी पाठ परिणाम को निष्क्रिय रूप में बताता है, पर कर्ता को स्पष्ट नहीं करता। ‘साथ गिना गया’ उस अनिर्दिष्टता को बनाए रखता है और नियुक्ति की प्रक्रिया के बारे में अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
