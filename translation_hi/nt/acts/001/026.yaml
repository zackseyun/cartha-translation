  text: और उन्होंने उनके लिए चिट्ठियाँ डालीं[a]। चिट्ठी मत्तियाह के नाम निकली, और वह ग्यारह प्रेरितों के साथ गिना गया[b]।
  philosophy: optimal-equivalence
  footnotes:
