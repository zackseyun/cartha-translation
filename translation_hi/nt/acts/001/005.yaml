id: ACT.1.5
reference: Acts 1:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ ⸂ἐν πνεύματι βαπτισθήσεσθε⸃ ἁγίῳ οὐ μετὰ πολλὰς ταύτας ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/005.yaml
  text: For John baptized with water[a], but you will be baptized in the Holy Spirit not many days from now.
translation:
  language: hi
  text: क्योंकि यूहन्ना ने पानी से बपतिस्मा दिया, पर तुम अब से कुछ ही दिनों बाद पवित्र आत्मा में[a] बपतिस्मा पाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र आत्मा से।’ यूनानी संबंधबोधक शब्द का अर्थ यहाँ ‘में’ या ‘से’ समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐβάπτισεν
  choice: बपतिस्मा दिया
  rationale: प्रचलित धार्मिक पद को बनाए रखता है और बपतिस्मे की विधि को अनावश्यक रूप से ‘डुबोना’ कहकर सीमित नहीं करता।
- source_word: ὕδατι
  choice: पानी से
  rationale: यहाँ विभक्ति साधन का भाव दे सकती है; ‘पानी से बपतिस्मा दिया’ सहज हिन्दी है और आगे पवित्र आत्मा के साथ किए गए विरोध को स्पष्ट रखती है।
- source_word: ἐν πνεύματι ἁγίῳ
  choice: पवित्र आत्मा में
  rationale: ἐν के स्थानीय या क्षेत्रगत भाव को मुख्य पाठ में प्रत्यक्ष रखता है और ‘में’ तथा ‘से’ के बीच वास्तविक व्याख्यात्मक तनाव को सुरक्षित रखता है।
- source_word: βαπτισθήσεσθε
  choice: बपतिस्मा पाओगे
  rationale: भविष्यकालीन कर्मवाच्य का स्वाभाविक हिन्दी रूप है; कर्ता को यूनानी पाठ की तरह अनकहा छोड़ता है और यूहन्ना के बपतिस्मे से शाब्दिक संबंध बनाए रखता है।
- source_word: οὐ μετὰ πολλὰς ταύτας ἡμέρας
  choice: अब से कुछ ही दिनों बाद
  rationale: समय-सूचक वाक्यांश का स्वाभाविक और स्पष्ट हिन्दी रूप है; यह निकट भविष्य का भाव व्यक्त करता है।
theological_decisions:
- issue: ἐν πνεύματι ἁγίῳ में ἐν का अर्थ
  choice: पवित्र आत्मा में
  alternative: पवित्र आत्मा से
  rationale: ἐν यहाँ क्षेत्र (‘में’) या साधन (‘से’) का बोध करा सकता है। मुख्य पाठ अधिक रूप-समीपी विकल्प रखता है और पादटिप्पणी दूसरे वैध अर्थ को देती है, जिससे आत्मा के बपतिस्मे के विषय में पाठ की व्याख्यात्मक खुलावट बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बपतिस्मा’ तथा ‘पवित्र आत्मा’ जैसे व्यापक रूप से पहचाने जाने वाले बाइबलीय पद बनाए गए हैं; किसी विशिष्ट बपतिस्मा-विधि या संप्रदायगत व्याख्या को पाठ में नहीं जोड़ा गया।
