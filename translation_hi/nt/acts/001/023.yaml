  text: καὶ ἔστησαν δύο, Ἰωσὴφ τὸν καλούμενον Βαρσαββᾶν, ὃς ἐπεκλήθη Ἰοῦστος, καὶ Μαθθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/023.yaml
  text: 'And they put forward two: Joseph called Barsabbas[a], who was also called Justus, and Matthias.'
translation:
  language: hi
  text: 'तब उन्होंने दो व्यक्तियों को सामने रखा[a]: यूसुफ़, जो बरसब्बास कहलाता था और युस्तुस भी कहलाता था, और मत्तियाह।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दो व्यक्तियों को नियुक्त किया” या “दो व्यक्तियों को प्रस्तुत किया।” यूनानी क्रिया का अर्थ लोगों को किसी समूह के सामने खड़ा करना हो सकता है; यहाँ संभवतः आशय उन्हें उम्मीदवारों के रूप में सामने रखने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: सामने रखा
  rationale: चयन के इस प्रसंग में क्रिया का अर्थ दो व्यक्तियों को समुदाय के सामने उम्मीदवारों के रूप में प्रस्तुत करना है; यह केवल उन्हें खड़ा करने या पहले से नियुक्त कर देने का संकेत नहीं देती।
- source_word: δύο
  choice: दो व्यक्तियों
  rationale: मूल में केवल ‘दो’ है, पर हिन्दी में संदर्भ स्पष्ट और स्वाभाविक बनाने के लिए ‘व्यक्तियों’ जोड़ा गया है।
- source_word: καλούμενον
  choice: कहलाता था
  rationale: यह यूसुफ़ के एक अन्य नाम या पहचान को बताता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Βαρσαββᾶν
  choice: बरसब्बा
  rationale: यूनानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: ἐπεκλήθη
  choice: भी कहलाता था
  rationale: यह एक और नाम या उपनाम प्रस्तुत करता है; ‘भी’ दोनों नाम-सूचक उपवाक्यों का संबंध सहज रूप से स्पष्ट करता है।
- source_word: Ἰοῦστος
  choice: युस्तुस
  rationale: यूनानी रूप के निकट और हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: Μαθθίαν
  choice: मत्तियाह
  rationale: मूल नाम के निकट हिन्दी लिप्यंतरण।
- source_word: καὶ ... καὶ
  choice: तब ... और
  rationale: पहला καί पिछले वृत्तांत की निरंतरता दिखाता है, जिसे हिन्दी में ‘तब’ स्वाभाविक रूप से व्यक्त करता है; दूसरा दोनों व्यक्तियों को जोड़ने के लिए ‘और’ है।
theological_decisions:
- issue: ἔστησαν में चयन-प्रक्रिया का आशय
  choice: दो व्यक्तियों को ‘सामने रखा’ गया
  alternative: ‘नियुक्त किया’ या ‘प्रस्तावित किया’
  rationale: ‘सामने रखा’ उम्मीदवारों को समुदाय के समक्ष प्रस्तुत करने का प्रक्रियात्मक अर्थ बनाए रखता है, लेकिन यह समय से पहले औपचारिक नियुक्ति का निष्कर्ष नहीं देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नामों के लिए हिन्दी बाइबल परंपरा के परिचित रूप अपनाए गए हैं।
