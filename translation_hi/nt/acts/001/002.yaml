  yaml_path: translation/nt/acts/001/002.yaml
  text: until the day when[a], after giving commands through the Holy Spirit to the apostles whom he had chosen, he was taken up.
translation:
  language: hi
  text: उस दिन तक, जिस दिन वह पवित्र आत्मा के द्वारा[a] अपने चुने हुए प्रेरितों को आज्ञाएँ देने के बाद ऊपर उठा लिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र आत्मा के माध्यम से।” यूनानी पद साधन या कर्तृत्व का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι ἧς ἡμέρας
  choice: उस दिन तक का वर्णन किया, जब
  rationale: यह पद 1 के वाक्य को आगे बढ़ाता है और पहले वृत्तांत की समय-सीमा बताता है। हिन्दी में संदर्भ सहित यह संयोजन स्वाभाविक है।
- source_word: ἐντειλάμενος
  choice: आज्ञाएँ देने के बाद
  rationale: अओरिस्ट कृदंत की क्रिया मुख्य क्रिया से पहले हुई है। ‘आज्ञाएँ’ ἐντέλλομαι का अपेक्षाकृत सटीक और दृढ़ अर्थ रखता है।
- source_word: τοῖς ἀποστόλοις
  choice: प्रेरितों को
  rationale: लूका–प्रेरितों के काम में ἀπόστολοι के लिए ‘प्रेरित’ स्थापित और अर्थ-संगत हिन्दी पद है।
- source_word: διὰ πνεύματος ἁγίου
  choice: पवित्र आत्मा के द्वारा
  rationale: सम्बन्धकारक के साथ διά साधन अथवा माध्यम व्यक्त करता है। ‘के द्वारा’ हिन्दी में दोनों सम्भावनाओं को पर्याप्त रूप से खुला रखता है।
- source_word: οὓς ἐξελέξατο
  choice: अपने चुने हुए
  rationale: यह सम्बन्धवाचक उपवाक्य उन प्रेरितों की पहचान कराता है जिन्हें यीशु पहले चुन चुका था। ‘अपने’ मध्यवाच्य की हल्की आत्म-संबद्ध छाया को स्वाभाविक हिन्दी में व्यक्त करता है, पर कोई अतिरिक्त उद्देश्य नहीं जोड़ता।
- source_word: ἀνελήμφθη
  choice: ऊपर उठा लिया गया
  rationale: कर्मवाच्य रूप को बनाए रखता है और ‘स्वर्ग में’ नहीं जोड़ता, क्योंकि वह स्थान इस पद में स्पष्ट नहीं है।
theological_decisions:
- issue: यीशु की आज्ञाओं और पवित्र आत्मा का सम्बन्ध
  choice: यीशु ने पवित्र आत्मा के द्वारा प्रेरितों को आज्ञाएँ दीं।
  alternative: यीशु ने पवित्र आत्मा के माध्यम से प्रेरितों को आज्ञाएँ दीं।
  rationale: वाक्य-विन्यास διὰ πνεύματος ἁγίου को ἐντειλάμενος से जोड़ता है। ‘के द्वारा’ साधन और कर्तृत्व की वास्तविक भाषिक निकटता को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के बनाए रखता है।
- issue: ἀνελήμφθη में गन्तव्य
  choice: ऊपर उठा लिया गया
  alternative: स्वर्ग में उठा लिया गया
  rationale: पद कर्मवाच्य उठाए जाने को कहता है, पर गन्तव्य को स्पष्टतः नहीं बताता; इसलिए ‘स्वर्ग में’ जोड़ना टाला गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। पद 1 से वाक्यगत निरन्तरता दिखाने के लिए ‘का वर्णन किया’ जोड़ा गया है; प्रकाशन में पद 1–2 साथ पढ़े जाने पर इसे संयुक्त वाक्य के रूप में रखा जाए।
