id: ACT.1.3
reference: Acts 1:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἷς καὶ παρέστησεν ἑαυτὸν ζῶντα μετὰ τὸ παθεῖν αὐτὸν ἐν πολλοῖς τεκμηρίοις, δι’ ἡμερῶν τεσσεράκοντα ὀπτανόμενος αὐτοῖς καὶ λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/003.yaml
  text: To them he also presented himself alive after he had suffered[a], by many proofs[b], appearing to them over forty days and speaking about the kingdom of God.
translation:
  language: hi
  text: दुःख उठाने के बाद उसने बहुत-से पक्के प्रमाणों[a] के द्वारा अपने आप को उनके सामने जीवित दिखाया। वह चालीस दिनों के दौरान[b] उन्हें दिखाई देता रहा और परमेश्वर के राज्य के विषय में बातें करता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहुत-से प्रमाणों’ अथवा ‘बहुत-से विश्वास दिलानेवाले प्रमाणों’। यूनानी शब्द ऐसे साक्ष्य को सूचित करता है जो निश्चितता स्थापित करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘चालीस दिनों तक’। यह वाक्यांश उस पूरी अवधि में अलग-अलग अवसरों पर हुए दर्शनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: उनके सामने
  rationale: यह सम्बन्धवाचक सर्वनाम पिछले पद के प्रेरितों की ओर संकेत करता है। हिन्दी में ‘उनके सामने’ अगले वाक्यांश ‘अपने आप को ... दिखाया’ के साथ स्वाभाविक है और यूनानी में निहित न होने के कारण ‘पुरुषों’ नहीं जोड़ता।
- source_word: παρέστησεν ἑαυτὸν ζῶντα
  choice: अपने आप को उनके सामने जीवित दिखाया
  rationale: यह पदबंध यीशु के अपने को प्रत्यक्ष रूप से जीवित प्रस्तुत करने को व्यक्त करता है। ‘जीवित दिखाया’ आधुनिक हिन्दी में स्वाभाविक है और पुनरुत्थान के बाद की जीवित अवस्था स्पष्ट रखता है।
- source_word: μετὰ τὸ παθεῖν αὐτὸν
  choice: दुःख उठाने के बाद
  rationale: μετά के साथ क्रियार्थक संज्ञा-रचना समयक्रम बताती है। ‘दुःख उठाना’ यीशु की पीड़ा और मृत्यु से जुड़ी व्यापक अभिव्यक्ति को बिना अनावश्यक विस्तार के रखता है।
- source_word: ἐν πολλοῖς τεκμηρίοις
  choice: बहुत-से पक्के प्रमाणों के द्वारा
  rationale: τεκμήριον ऐसा प्रमाण है जो बात की निश्चितता स्थापित करता है। ‘पक्के प्रमाण’ इस प्रबल साक्ष्यात्मक अर्थ को सामान्य आधुनिक हिन्दी में व्यक्त करता है; ‘के द्वारा’ ἐν के साधनार्थक प्रयोग को दर्शाता है।
- source_word: δι’ ἡμερῶν τεσσεράκοντα
  choice: चालीस दिनों के दौरान
  rationale: διά के सम्बन्धकारक प्रयोग से समयावधि में फैली घटनाएँ सूचित होती हैं। ‘के दौरान’ यह स्पष्ट करता है कि दर्शन उस अवधि में होते रहे, न कि एक ही दर्शन लगातार चालीस दिन चला।
- source_word: ὀπτανόμενος αὐτοῖς
  choice: उन्हें दिखाई देता रहा
  rationale: ὀπτάνομαι यहाँ बार-बार प्रकट होने या दिखाई देने के अर्थ में है। ‘दिखाई देता रहा’ चालीस दिनों में हुए अनेक दर्शनों के भाव के अनुकूल है।
- source_word: λέγων τὰ περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: परमेश्वर के राज्य के विषय में बातें करता रहा
  rationale: τὰ περὶ का अर्थ ‘से सम्बन्धित बातें’ है। यह रूप सहज हिन्दी में शिक्षा की जारी गतिविधि और उसके विषय—परमेश्वर का राज्य—दोनों को बनाए रखता है।
- source_word: βασιλείας τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: βασιλεία में राजकीय शासन और राज्य, दोनों अर्थ-संकेत हो सकते हैं। स्थापित हिन्दी अभिव्यक्ति ‘परमेश्वर का राज्य’ इस अर्थ-विस्तार को ‘शासन’ तक सीमित नहीं करती।
theological_decisions:
- issue: पुनरुत्थान और प्रमाणों का साक्ष्यात्मक बल
  choice: यीशु ने दुःख उठाने के बाद पक्के प्रमाणों द्वारा अपने को जीवित दिखाया।
  alternative: उसने अपने दुःखभोग के बाद अनेक अचूक प्रमाणों द्वारा अपने को जीवित प्रस्तुत किया।
  rationale: यूनानी पाठ दुःख के बाद उसके जीवित होने और उसके प्रमाणों को स्पष्ट रूप से कहता है। ‘पक्के’ τεκμήριον का बल रखता है, जबकि ‘अचूक’ मूल से अधिक पूर्ण निरपेक्षता का भाव ला सकता है और ‘दुःखभोग’ सामान्य पाठक के लिए अपेक्षाकृत पारिभाषिक है।
- issue: οἷς के पूर्वपद का लिंग-स्पष्टीकरण
  choice: उनके सामने
  alternative: उन पुरुषों के सामने
  rationale: सन्दर्भ में प्रेरित पुरुष हैं, पर οἷς स्वयं ‘पुरुष’ शब्द नहीं जोड़ता। हिन्दी सर्वनाम संदर्भ को पर्याप्त स्पष्ट रखता है और मूल से अतिरिक्त लैंगिक संज्ञा नहीं जोड़ता।
- issue: चालीस दिनों की अवधि में दर्शनों का स्वरूप
  choice: चालीस दिनों के दौरान उन्हें दिखाई देता रहा
  alternative: चालीस दिनों तक उन्हें दिखाई देता रहा
  rationale: मूल वाक्य दर्शनों के उस अवधि में फैले होने की अनुमति देता है; ‘के दौरान’ लगातार, बिना विराम दिखाई देते रहने का अनपेक्षित अर्थ घटाता है, फिर भी समय-संबंधी वास्तविक अस्पष्टता को टिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दुःख उठाने’, ‘पक्के प्रमाण’, ‘दिखाई देता रहा’ और ‘परमेश्वर का राज्य’ जैसे प्रचलित पद चुने गए हैं। मूल की सहभागी रचना को हिन्दी की स्पष्टता के लिए दो वाक्यों में बाँटा गया है, पर समयक्रम और विचार-संबंध बनाए रखे गए हैं।
