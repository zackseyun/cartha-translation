  source_fidelity: The draft accurately renders the direct address, the standing-and-looking construction, Jesus being taken up from the disciples into heaven, and the comparison of his future coming with their seeing him go. The first directional expression is idiomatically conveyed by “स्वर्ग की ओर.”
  naturalness: The phrase “तुम क्यों खड़े स्वर्ग की ओर देख रहे हो” is grammatically incomplete/awkward in modern Hindi because the attendant action needs “होकर” or an equivalent. “तुम से” is also a more direct and natural rendering of ἀφ’ ὑμῶν than “तुम्हारे पास से.”
  terminology: “स्वर्ग” suitably reflects οὐρανός in this ascension context. “यह यीशु” properly avoids adding “वही/यही” to the main text. “हे गलीली पुरुषो” is elevated but acceptable in the passage’s formal scriptural register and preserves the masculine vocative.
  issues:
