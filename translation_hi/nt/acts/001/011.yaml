id: ACT.1.11
reference: Acts 1:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἳ καὶ εἶπαν· Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε ⸀βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/011.yaml
  text: They also said[a], “Men of Galilee, why do you stand looking into heaven? This Jesus, who was taken up from you into heaven, will come in the same way that you saw him going into heaven.”
translation:
  language: hi
  text: उन्होंने यह भी कहा, “हे गलीली पुरुषो, तुम क्यों खड़े होकर स्वर्ग की ओर देख रहे हो? यह यीशु[a], जो तुम से स्वर्ग में उठा लिया गया है, उसी प्रकार आएगा जिस प्रकार तुमने उसे स्वर्ग में जाते देखा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पारंपरिक रूप से, “यही यीशु।” यूनानी में स्पष्ट रूप से “यह यीशु” है; “ही” पहचान पर बल देने वाला व्याख्यात्मक विस्तार है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες Γαλιλαῖοι
  choice: हे गलीली पुरुषो
  rationale: सम्बोधन बहुवचन और स्पष्ट पुल्लिंग रूप को बनाए रखते हुए यह आधुनिक, गरिमापूर्ण हिन्दी में प्रत्यक्ष सम्बोधन व्यक्त करता है।
- source_word: τί ἑστήκατε βλέποντες εἰς τὸν οὐρανόν
  choice: तुम क्यों खड़े स्वर्ग की ओर देख रहे हो
  rationale: ἑστήκατε की वर्तमान अवस्था और βλέποντες की साथ चल रही क्रिया दोनों व्यक्त होती हैं। देखने की क्रिया के साथ εἰς का स्वाभाविक हिन्दी रूप ‘की ओर’ है।
- source_word: οὐρανός
  choice: स्वर्ग
  rationale: इस आरोहण और प्रतिज्ञात आगमन के प्रसंग में ‘स्वर्ग’ दृश्य आकाश से आगे निहित धार्मिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὗτος ὁ Ἰησοῦς
  choice: यह यीशु
  rationale: οὗτος के स्पष्ट संकेतवाचक बल को बिना ‘वही’ या ‘यही’ जैसा व्याख्यात्मक शब्द जोड़े सीधे रखा गया है।
- source_word: ὁ ἀναλημφθεὶς ἀφ’ ὑμῶν εἰς τὸν οὐρανόν
  choice: जो तुम्हारे पास से स्वर्ग में उठा लिया गया है
  rationale: कर्मवाच्य रूप और ऊपर उठाए जाने की दिशा सुरक्षित रहती है; ‘तुम्हारे पास से’ शिष्यों की उपस्थिति से अलग होने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὕτως ἐλεύσεται ὃν τρόπον
  choice: उसी प्रकार आएगा जिस प्रकार
  rationale: दोनों यूनानी अभिव्यक्तियों की तुलनात्मक संरचना को स्पष्ट और सहज हिन्दी में बनाए रखा गया है।
- source_word: ἐθεάσασθε αὐτὸν πορευόμενον
  choice: तुमने उसे … जाते देखा
  rationale: प्रत्यक्ष दर्शन और चलते/जाते हुए देखने का अर्थ बिना ‘निहारना’ जैसे अधिक प्रबल भाव के व्यक्त होता है।
theological_decisions:
- issue: आरोहण और पुनरागमन के प्रसंग में οὐρανός का अर्थ
  choice: स्वर्ग
  alternative: आकाश
  rationale: οὐρανός दोनों अर्थ रख सकता है, पर यहाँ यीशु के उठा लिए जाने और फिर आने की प्रतिज्ञा वाला प्रसंग ‘स्वर्ग’ का समर्थन करता है; दृश्य दिशा ‘की ओर’ से बनी रहती है।
- issue: οὗτος ὁ Ἰησοῦς में पहचान के बल को कैसे व्यक्त किया जाए
  choice: यह यीशु
  alternative: यही यीशु
  rationale: यूनानी में संकेतवाचक ‘यह’ स्पष्ट है, पर ‘ही’ के लिए अलग शब्द नहीं है। मुख्य पाठ निकटतर रूप रखता है और पारंपरिक, पहचान-बल देने वाला विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘हे’ प्रत्यक्ष सम्बोधन को स्पष्ट करता है; ‘गलीली पुरुषो’ स्रोत के पुल्लिंग रूप को सुरक्षित रखता है।
