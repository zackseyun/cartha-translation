    issue: Missing connective in “खड़े स्वर्ग की ओर देख रहे हो”
    rationale: 'Hindi requires “खड़े होकर” (or an equivalent) to express the Greek perfect-state verb plus participle naturally: “why are you standing, looking...?”'
  - severity: low
    issue: “तुम्हारे पास से” is less direct than the source
    rationale: ἀφ’ ὑμῶν means “from you.” “तुम से” retains the separation from the addressed disciples without the added spatial nuance of “पास.”
