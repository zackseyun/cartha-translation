  text: οὗτοι πάντες ἦσαν προσκαρτεροῦντες ὁμοθυμαδὸν τῇ ⸀προσευχῇ σὺν γυναιξὶν καὶ ⸀Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ καὶ ⸀σὺν τοῖς ἀδελφοῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/014.yaml
  text: All of these were continually devoting themselves with one accord to prayer[a], together with the women, and Mary the mother of Jesus[c][b], and with his brothers.
translation:
  language: hi
  text: ये सभी एक मन होकर[a] निरंतर प्रार्थना में लगे रहते थे, स्त्रियों[b], यीशु की माता मरियम और उसके भाइयों[c] के साथ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक उद्देश्य से” अथवा “एकमत होकर”; यूनानी शब्द एक स्थान पर इकट्ठे होने के साथ-साथ साझा मन और उद्देश्य पर भी बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या “स्त्रियों के साथ।” यूनानी में “स्त्रियों” के साथ निश्चित उपपद नहीं है, पर संदर्भ में इससे शिष्यों से जुड़ी हुई परिचित स्त्रियों का समूह अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “भाइयों” यूनानी शब्द ἀδελφοί का अनुवाद है। कुछ लोग यहाँ इसे निकट संबंधियों या कुटुंबियों के व्यापक अर्थ में समझते हैं; इस पद में उनका सटीक पारिवारिक संबंध नहीं बताया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι πάντες
  choice: ये सभी
  rationale: यह अनुवाद οὗτοι के संकेतवाचक भाव और πάντες की समावेशी व्यापकता, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἦσαν προσκαρτεροῦντες
  choice: निरंतर ... लगे रहते थे
  rationale: ἦσαν के साथ वर्तमान कृदंत προσκαρτεροῦντες जारी और दृढ़तापूर्ण गतिविधि को व्यक्त करता है; ‘निरंतर ... लगे रहते थे’ उस कालगत और स्थिर समर्पण के भाव को सहज हिन्दी में देता है।
- source_word: ὁμοθυμαδόν
  choice: एक मन होकर
  rationale: यह केवल एक स्थान पर साथ होने से बढ़कर साझा उद्देश्य और एकता का भाव व्यक्त करता है, जो लूका के लेखन में इस क्रियाविशेषण की विशेषता है।
- source_word: τῇ προσευχῇ
  choice: प्रार्थना में
  rationale: προσκαρτερέω के साथ दत्तिव कारक उस गतिविधि को बताता है जिसमें वे दृढ़तापूर्वक लगे थे। हिन्दी में ‘प्रार्थना में लगे रहते थे’ स्वाभाविक है; यूनानी निश्चित उपपद को यहाँ अलग से दिखाना आवश्यक नहीं।
- source_word: σὺν γυναιξίν
  choice: उनके साथ स्त्रियाँ ... भी थीं
  rationale: σύν संगति को व्यक्त करता है। यूनानी में ‘स्त्रियों’ के साथ उपपद नहीं है, इसलिए मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और संभावित अर्थभेद को पादटिप्पणी में बताया गया है।
- source_word: Μαριὰμ τῇ μητρὶ τοῦ Ἰησοῦ
  choice: यीशु की माता मरियम
  rationale: यह संबंधसूचक समानाधिकरण को स्पष्ट और प्रचलित हिन्दी नाम-रूप के साथ सीधे व्यक्त करता है।
- source_word: σὺν τοῖς ἀδελφοῖς αὐτοῦ
  choice: उसके भाई
  rationale: ἀδελφοῖς व्याकरण की दृष्टि से पुल्लिंग बहुवचन है और यहाँ एक पृथक पारिवारिक समूह को सूचित करता है। ‘भाई’ मूल शब्द का सामान्य अर्थ बनाए रखता है, जबकि उनके सटीक पारिवारिक संबंध पर कोई अतिरिक्त निष्कर्ष नहीं थोपता।
theological_decisions:
- issue: यीशु के ἀδελφοί का सटीक पारिवारिक संबंध
  choice: ‘उसके भाई’
  alternative: ‘उसके निकट संबंधी’ या व्यापक अर्थ में ‘उसके कुटुंबी’
  rationale: ἀδελφοί का सामान्य और प्रत्यक्ष अर्थ ‘भाई’ है, पर विभिन्न परंपराएँ इन व्यक्तियों को सगे भाई, सौतेले भाई या निकट संबंधी मानती हैं। मुख्य पाठ मूल शब्द का सामान्य अर्थ रखता है और पादटिप्पणी पाठ में अनिर्दिष्ट व्यापक संभावना का उल्लेख करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी वाक्य की एकसूत्रता को हिन्दी की स्पष्टता के लिए दो वाक्यों में व्यक्त किया गया है; दूसरे वाक्य का ‘भी थे’ पहले वाक्य की सामूहिक गतिविधि में स्त्रियों, मरियम और भाइयों की सहभागिता को बनाए रखता है। सभी पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद दिए गए हैं।
