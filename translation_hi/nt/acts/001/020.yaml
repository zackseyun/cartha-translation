  text: γέγραπται γὰρ ἐν βίβλῳ ψαλμῶν· Γενηθήτω ἡ ἔπαυλις αὐτοῦ ἔρημος καὶ μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ, καί· Τὴν ἐπισκοπὴν αὐτοῦ ⸀λαβέτω ἕτερος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/020.yaml
  text: For it is written in the book of Psalms[a], ‘Let his dwelling place become desolate, and let there be no one dwelling in it,’ and[c][b], ‘Let another take his office.’
translation:
  language: hi
  text: क्योंकि भजनों की पुस्तक में लिखा है, “उसका निवास-स्थान[a] उजाड़ हो जाए और उसमें कोई रहनेवाला न हो,[b]” और “उसका पद[c] कोई दूसरा ले ले।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निवास-स्थान’ के लिए ‘बसेरा’ या ‘रहने की जगह’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसमें कोई निवास न करे,” अथवा “उसमें कोई निवासी न हो।”
    reason: lexical_alternative
  - marker: c
    text: यूनानी शब्द ἐπισκοπή का अर्थ यहाँ ‘देखरेख का दायित्व’ भी हो सकता है। इसे बाद की किसी विशिष्ट कलीसियाई पदवी तक सीमित समझना आवश्यक नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: लिखा है
  rationale: यूनानी पूर्णकालीन कर्मवाच्य यहाँ पवित्रशास्त्र के उद्धरण का प्रचलित सूत्र है; ‘लिखा है’ स्वाभाविक हिन्दी में उसके वर्तमान प्रमाणिक बल को बनाए रखता है।
- source_word: βίβλῳ ψαλμῶν
  choice: भजनों की पुस्तक
  rationale: यह संबंधकारक रचना उद्धृत शास्त्रीय संग्रह की पहचान कराती है; यह हिन्दी में स्पष्ट और प्रचलित रूप है।
- source_word: Γενηθήτω
  choice: हो जाए
  rationale: अओरिस्ट आज्ञार्थक यहाँ उद्धृत इच्छा अथवा न्यायसूचक कामना व्यक्त करता है; ‘हो जाए’ उस भाव को सहज हिन्दी में रखता है।
- source_word: ἔπαυλις
  choice: निवास-स्थान
  rationale: शब्द किसी रहने की जगह या बसेरे को दर्शाता है; ‘निवास-स्थान’ व्यापक, स्पष्ट और प्रसंगानुकूल है।
- source_word: ἔρημος
  choice: उजाड़
  rationale: प्रसंग में इसका अर्थ निर्जन या निवासियों से खाली हो जाना है; ‘उजाड़’ भजन के गंभीर काव्यात्मक स्वर को बनाए रखता है।
- source_word: μὴ ἔστω ὁ κατοικῶν ἐν αὐτῇ
  choice: उसमें कोई रहनेवाला न हो
  rationale: यह निषेध और संज्ञा के रूप में प्रयुक्त कृदंत, दोनों को निकटता से और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπισκοπή
  choice: पद
  rationale: यहाँ शब्द यहूदा के उत्तरदायित्वपूर्ण स्थान या निगरानी के कार्य को सूचित करता है; ‘पद’ बाद की किसी विशेष कलीसियाई संरचना को आरोपित किए बिना अर्थ देता है।
- source_word: λαβέτω ἕτερος
  choice: कोई दूसरा ले ले
  rationale: अओरिस्ट आज्ञार्थक और ἕτερος का यह रूप उत्तराधिकार के भाव तथा उद्धरण की आज्ञार्थक शैली को सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: प्रेरिताई उत्तराधिकार के प्रसंग में ἐπισκοπή का अनुवाद
  choice: पद
  alternative: देखरेख का दायित्व; निरीक्षक का पद
  rationale: यह पद भजन 109:8 को यहूदा के खाली हुए स्थान पर लागू करता है। ‘पद’ एक मान्य भूमिका के भरे जाने का भाव देता है, पर बाद की किसी संप्रदायगत पद-व्यवस्था को पाठ में नहीं लाता। मूल शब्द में निहित देखरेख का भाव पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘उजाड़ हो जाए’ और ‘ले ले’ उद्धृत भजन की आज्ञार्थक-कामनात्मक शक्ति रखते हैं। ‘निवास-स्थान’ स्पष्टता देता है, जबकि ‘पद’ संक्षिप्त रहकर अनावश्यक संप्रदायगत तकनीकी अर्थ से बचता है।
