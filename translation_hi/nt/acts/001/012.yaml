base_translation:
  language: en
  yaml_path: translation/nt/acts/001/012.yaml
  text: Then they returned to Jerusalem from the mount called Olivet[a], which is near Jerusalem[b], a Sabbath day’s journey away.
translation:
  language: hi
  text: तब वे जैतून नाम के पहाड़[a] से यरूशलेम लौट आए, जो यरूशलेम के पास, सब्त-दिन की यात्रा की दूरी पर है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक पारंपरिक रूप में, “जैतून का पहाड़।”
    reason: lexical_alternative
  - marker: b
    text: “सब्त-दिन की यात्रा” उस प्रचलित दूरी को दर्शाती है, जितनी दूर यहूदी लोग सब्त के दिन यात्रा कर सकते थे।
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह घटनाक्रम में अगली घटना को जोड़ने वाला स्वाभाविक और संक्षिप्त कालसूचक शब्द है।
- source_word: ὑπέστρεψαν εἰς Ἰερουσαλὴμ
  choice: वे यरूशलेम लौट आए
  rationale: क्रिया का अर्थ वापस लौटना है; शहर की ओर गति को आधुनिक हिन्दी में सहज रूप से व्यक्त किया गया है।
- source_word: ἀπὸ ὄρους τοῦ καλουμένου Ἐλαιῶνος
  choice: जैतून नामक पहाड़ से
  rationale: ὄρος को ‘पहाड़’ और स्थाननाम Ἐλαιῶνος को ‘जैतून’ के रूप में रखा गया है। ‘नामक’ मूल के ‘कहलाने वाले’ भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ὅ ἐστιν ἐγγὺς Ἰερουσαλὴμ
  choice: यह पहाड़ यरूशलेम के पास था
  rationale: सम्बन्धवाचक उपवाक्य को स्पष्ट आधुनिक हिन्दी वाक्य में बदला गया है; निकटता का अर्थ यथावत है।
- source_word: σαββάτου ἔχον ὁδόν
  choice: सब्त के दिन की यात्रा जितनी दूरी पर
  rationale: यह यहूदी सांस्कृतिक दूरी-सूचक मुहावरा है। अनिश्चित दूरी को कृत्रिम माप में बदले बिना उसके मूल ढाँचे और आशय दोनों को सुरक्षित रखा गया है।
theological_decisions:
- issue: σαββάτου ἔχον ὁδόν में यहूदी सब्त-दूरी का सांस्कृतिक संकेत
  choice: सब्त के दिन की यात्रा जितनी दूरी पर
  alternative: सब्त के दिन जितनी दूर चलने की अनुमति थी, उतनी दूरी पर
  rationale: मुख्य पाठ में मूल सांस्कृतिक अभिव्यक्ति को बनाए रखा गया है और उसका स्पष्टीकरण पादटिप्पणी में दिया गया है, ताकि पाठ अनावश्यक रूप से व्याख्यात्मक न बने।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सब्त’ जैसे स्थापित बाइबलीय सांस्कृतिक शब्द को बनाए रखते हुए पादटिप्पणी में उसका प्रसंग स्पष्ट किया गया है।
