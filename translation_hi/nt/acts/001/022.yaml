id: ACT.1.22
reference: Acts 1:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου ἕως τῆς ἡμέρας ἧς ἀνελήμφθη ἀφ’ ἡμῶν, μάρτυρα τῆς ἀναστάσεως αὐτοῦ ⸂σὺν ἡμῖν γενέσθαι⸃ ἕνα τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/022.yaml
  text: beginning from the baptism of John until the day when he was taken up from us[b][a], one of these must become a witness with us of his resurrection.
translation:
  language: hi
  text: यूहन्ना के बपतिस्मे[a] से लेकर उस दिन तक, जब वह हमारे पास से ऊपर उठा लिया गया, इनमें से एक को हमारे साथ उसके पुनरुत्थान का गवाह[b] बनना आवश्यक है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “यूहन्ना द्वारा दिए गए बपतिस्मे से।”
    reason: यूनानी संबंधकारक ‘यूहन्ना के बपतिस्मे’ का अर्थ यूहन्ना द्वारा दिया गया बपतिस्मा भी हो सकता है।
  - marker: b
    text: अथवा, “उसके पुनरुत्थान की गवाही देने वाला।”
    reason: यूनानी में शाब्दिक रूप से ‘उसके पुनरुत्थान का गवाह’ है; हिन्दी में भूमिका को क्रियात्मक ढंग से भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ τοῦ βαπτίσματος Ἰωάννου
  choice: यूहन्ना के बपतिस्मे से आरम्भ करके
  rationale: कृदन्त और ἀπό से आरम्भ होने वाली समय-सीमा को बनाए रखता है। ‘यूहन्ना के बपतिस्मे’ में यूनानी संबंधकारक की वास्तविक अस्पष्टता बनी रहती है।
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: उस दिन तक, जब
  rationale: समय की अंतिम सीमा और संबंधवाचक उपवाक्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀνελήμφθη ἀφ’ ἡμῶν
  choice: वह हमारे पास से ऊपर उठा लिया गया
  rationale: कर्मवाच्य तथा ऊपर उठाए जाने की दिशा को सुरक्षित रखता है, पर मूल में अनुपस्थित ‘स्वर्ग’ को नहीं जोड़ता। ‘हमारे पास से’ ἀφ’ ἡμῶν का सीधा और स्वाभाविक रूप है।
- source_word: μάρτυρα τῆς ἀναστάσεως αὐτοῦ
  choice: उसके पुनरुत्थान का गवाह
  rationale: संबंधकारक संरचना को स्वाभाविक हिन्दी में बनाए रखता है। ‘गवाह’ सामान्य पाठक के लिए स्पष्ट है और व्यक्ति की भूमिका व्यक्त करता है।
- source_word: σὺν ἡμῖν γενέσθαι
  choice: हमारे साथ ... गवाह बनना
  rationale: चुना गया व्यक्ति वर्तमान प्रेरितों के साथ पुनरुत्थान का गवाह बनेगा; हिन्दी शब्दक्रम इस संबंध को स्पष्ट और सहज रखता है।
- source_word: ἕνα τούτων
  choice: इनमें से एक को
  rationale: मूल में केवल ‘इनमें से एक’ है; पिछले पद से स्पष्ट ‘पुरुषों’ को अनावश्यक रूप से नहीं जोड़ा गया।
theological_decisions:
- issue: पिछले पद से आने वाली आवश्यकता का भाव
  choice: ‘बनना आवश्यक है’ द्वारा δεῖ का निहित शासन व्यक्त किया
  alternative: केवल ‘बनना’ कहना और हिन्दी वाक्य को अधूरा छोड़ना
  rationale: यह पद व्याकरण की दृष्टि से पिछले पद के δεῖ पर निर्भर है। ‘आवश्यक है’ कोई नया सिद्धान्त नहीं जोड़ता, बल्कि संयुक्त यूनानी वाक्य की शक्ति स्पष्ट करता है।
- issue: यीशु के ऊपर उठाए जाने का उल्लेख
  choice: ‘ऊपर उठा लिया गया’
  alternative: ‘स्वर्ग पर चढ़ गया’ या ‘हमसे दूर ले जाया गया’
  rationale: चुना हुआ रूप कर्मवाच्य और ऊर्ध्व दिशा दोनों बनाए रखता है, जबकि मूल में स्पष्ट रूप से न आए ‘स्वर्ग’ या कर्तृवाच्य को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘गवाह’ सामान्य बोलचाल में बोधगम्य है, जबकि वाक्य-विन्यास मूल की समय-सीमा और पद 21 पर उसकी व्याकरणिक निर्भरता को सुरक्षित रखता है।
