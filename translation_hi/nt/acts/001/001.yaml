id: ACT.1.1
reference: Acts 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τὸν μὲν πρῶτον λόγον ἐποιησάμην περὶ πάντων, ὦ Θεόφιλε, ὧν ἤρξατο ⸀ὁ Ἰησοῦς ποιεῖν τε καὶ διδάσκειν
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/001.yaml
  text: In the first account[a], O Theophilus, I wrote about all that Jesus began both to do and to teach,
translation:
  language: hi
  text: हे थियुफिलुस, मैंने पहले वृत्तांत[a] में उस सब के विषय में लिखा, जो यीशु ने करना और सिखाना आरम्भ किया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पिछले वृत्तांत” अथवा “पहली पुस्तक”।
    reason: λόγος यहाँ लिखित विवरण, वृत्तांत या पुस्तक का बोध करा सकता है; πρῶτον का अर्थ क्रम में ‘पहला’ या संदर्भ में ‘पिछला’ समझा जा सकता है।
lexical_decisions:
- source_word: Τὸν μὲν πρῶτον λόγον
  choice: अपने पहले वृत्तांत में
  rationale: यहाँ λόγος किसी एक ‘शब्द’ को नहीं, बल्कि पहले लिखे गए विवरण या ग्रंथ को सूचित करता है। ‘पहला वृत्तांत’ πρῶτον के क्रमसूचक अर्थ को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है। μέν अगले कथन की ओर संकेत करता है; हिन्दी में अलग शब्द जोड़े बिना वाक्य-विन्यास से यह भूमिका व्यक्त होती है।
- source_word: ἐποιησάμην
  choice: मैंने ... लिखा
  rationale: λόγος के साथ ποιέω का अर्थ किसी लिखित रचना को तैयार करना है। ‘लिखा’ इस प्रसंग में सबसे स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: περὶ πάντων ... ὧν
  choice: उस सब के विषय में ... जो
  rationale: περί संबंध या विषय को व्यक्त करता है और πάντων के साथ ὧν जुड़ा है। यह रूप यूनानी संरचना का संबंध बनाए रखते हुए हिन्दी में सहज है और वर्णन को अनावश्यक रूप से पूर्णतः सर्वसमावेशी नहीं बनाता।
- source_word: ὦ Θεόφιλε
  choice: हे थियुफिलुस
  rationale: ὦ प्रत्यक्ष संबोधन का चिह्न है। ‘हे’ संबोधन को बनाए रखता है, पर ‘प्रिय’ जैसी ऐसी आत्मीयता नहीं जोड़ता जो मूल पाठ में स्पष्ट नहीं है। नाम को प्रचलित हिन्दी रूप में लिप्यंतरित किया गया है।
- source_word: ἤρξατο
  choice: आरम्भ किया
  rationale: क्रिया का स्पष्ट अर्थ ‘आरम्भ किया’ है। इसे बनाए रखने से यीशु के कार्य की आगे की निरंतरता का संभावित संकेत सुरक्षित रहता है, पर उसे अनुवाद में स्पष्ट व्याख्या बनाकर नहीं जोड़ा जाता।
- source_word: ποιεῖν τε καὶ διδάσκειν
  choice: करना और सिखाना
  rationale: τε καί दोनों क्रियाओं को निकटता से जोड़ता है। हिन्दी में ‘करना और सिखाना’ स्वाभाविक रूप से दोनों पहलुओं को व्यक्त करता है; अतिरिक्त ‘दोनों’ जोड़ना आवश्यक नहीं और यहाँ वाक्य को बोझिल कर सकता है।
theological_decisions:
- issue: ἤρξατο (‘आरम्भ किया’) से प्रेरितों के काम में यीशु के कार्य की निरंतरता का संभावित संकेत
  choice: मुख्य पाठ में ‘आरम्भ किया’ को यथावत रखना, पर निरंतरता को स्पष्ट करके न जोड़ना
  alternative: इसे केवल ‘यीशु ने किया और सिखाया’ कहना, या ‘अपने प्रेरितों के द्वारा आगे करता रहा’ जैसी व्याख्या जोड़ना
  rationale: यूनानी पाठ स्पष्ट रूप से ‘आरम्भ किया’ कहता है। यह आगे जारी रहने वाले कार्य का संकेत दे सकता है, लेकिन अनुवाद को इस संभावित धार्मिक निहितार्थ का निर्णय करके उसे विस्तृत नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हे’ मूल के स्पष्ट संबोधन को दर्शाता है। वाक्य का अंतिम अल्पविराम अगले पद में जारी रहने वाली यूनानी वाक्य-संरचना को सूचित करता है।
