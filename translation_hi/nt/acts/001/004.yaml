source:
  edition: SBLGNT
  text: καὶ συναλιζόμενος παρήγγειλεν αὐτοῖς ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι, ἀλλὰ περιμένειν τὴν ἐπαγγελίαν τοῦ πατρὸς ἣν ἠκούσατέ μου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/001/004.yaml
  text: And while staying with them[a], he ordered them not to depart from Jerusalem, but to wait for the promise of the Father, which you heard from me.
translation:
  language: hi
  text: 'और उनके साथ रहते हुए उन्होंने उन्हें आज्ञा दी: “यरूशलेम से मत जाओ, बल्कि पिता की उस प्रतिज्ञा की प्रतीक्षा करो जो तुम ने मुझसे सुनी है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναλιζόμενος
  choice: जब वह उनके साथ ठहरे हुए थे
  rationale: यह कृदन्त शाब्दिक और पाठगत दृष्टि से कठिन है। संदर्भ में यीशु का प्रेरितों के साथ होना स्पष्ट है। यह चयन स्वाभाविक हिन्दी में उस सामान्य अर्थ को रखता है; ‘एकत्र होते समय’ और ‘साथ भोजन करते समय’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: παρήγγειλεν
  choice: आज्ञा दी
  rationale: क्रिया अधिकारपूर्वक दिए गए निर्देश को व्यक्त करती है। ‘आज्ञा दी’ आधुनिक हिन्दी में उसके बल को स्पष्ट और गरिमापूर्ण ढंग से रखता है।
- source_word: ἀπὸ Ἱεροσολύμων μὴ χωρίζεσθαι
  choice: यरूशलेम से बाहर न जाएँ
  rationale: इस संदर्भ में वाक्यांश का अर्थ नगर को न छोड़ना है। ‘बाहर न जाएँ’ सहज हिन्दी है और स्थान से प्रस्थान का आशय स्पष्ट करता है।
- source_word: περιμένειν
  choice: प्रतीक्षा करें
  rationale: यह चयन अपेक्षापूर्वक ठहरने के भाव को स्पष्ट, संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὴν ἐπαγγελίαν τοῦ πατρὸς
  choice: पिता की प्रतिज्ञा
  rationale: यह संबंधवाचक रचना को सीधा रखता है और अनावश्यक रूप से ‘प्रतिज्ञात वरदान’ जोड़कर प्रतिज्ञा की वस्तु को स्पष्ट नहीं करता।
- source_word: ἣν ἠκούσατέ μου
  choice: जिसके विषय में तुम मुझसे सुन चुके हो
  rationale: यूनानी में संबंधवाचक सर्वनाम स्त्रीलिंग होने के कारण ‘प्रतिज्ञा’ की ओर संकेत करता है, जबकि ‘मुझसे सुना’ स्रोत को बताता है। हिन्दी में ‘जिसके विषय में’ निहित सुनाई गई बात को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: पुनरुत्थान के बाद यीशु की गतिविधि के संबंध में συναλιζόμενος का अर्थ
  choice: सामान्य रूप से शिष्यों के साथ ठहरे होने के रूप में अनुवाद
  alternative: उनके साथ एकत्र होते समय; उनके साथ भोजन करते समय
  rationale: इस पद में विशिष्ट रूप से भोजन करने का अर्थ निश्चित नहीं है। सामान्य अनुवाद विवादित शाब्दिक सूक्ष्मता को आवश्यकता से अधिक निश्चित किए बिना दृश्य को सुरक्षित रखता है; विकल्प पादटिप्पणी में दिए गए हैं।
- issue: ‘पिता की प्रतिज्ञा’ में संबंध का स्वरूप
  choice: ‘पिता की प्रतिज्ञा’ को बिना विस्तार के रखा गया
  alternative: पिता का प्रतिज्ञात वरदान
  rationale: मूल पाठ प्रतिज्ञा की विषयवस्तु को इस पद में संज्ञा जोड़कर स्पष्ट नहीं करता। सीधा रूप संदर्भ को अर्थ खोलने देता है और वास्तविक अभिव्यक्ति को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक बहुवचन क्रिया-रूपों के साथ। भाषा सामान्य पाठक के लिए सहज किंतु गरिमापूर्ण रखी गई है। यीशु के प्रत्यक्ष कथन को स्पष्ट करने के लिए उद्धरण-चिह्न लगाए गए हैं; मूल में कथन का आश्रित से प्रत्यक्ष रूप की ओर संक्रमण स्वाभाविक है।
