translation:
  language: hi
  text: कि वे वह सब करें जिसे आपके हाथ और आपकी योजना ने पहले से घटित होने के लिए ठहराया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पहले से निर्धारित किया था’ अथवा ‘पहले ही निश्चय किया था।’ यूनानी क्रिया पहले से किए गए निर्धारण को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι
  choice: करें
  rationale: अनन्त क्रिया का आशय पिछले पद के कर्ताओं द्वारा किए गए कार्य से है; हिन्दी में संदर्भानुसार ‘करें’ सीधा और स्वाभाविक है।
- source_word: ὅσα
  choice: वह सब, जिसे
  rationale: नपुंसकलिंग बहुवचन सम्बन्धवाचक सर्वनाम की व्यापकता को ‘वह सब’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: χείρ
  choice: हाथ
  rationale: शाब्दिक बिंब बनाए रखा गया है; यहाँ ‘हाथ’ परमेश्वर की सामर्थ्य और सक्रियता का रूपक है, पर अनुवाद उसे व्याख्यात्मक रूप से ‘सामर्थ्य’ नहीं बनाता।
- source_word: βουλή
  choice: योजना
  rationale: यह शब्द विचारपूर्वक निर्धारित अभिप्राय या संकल्प को व्यक्त करता है। ‘योजना’ आधुनिक हिन्दी में सहज है और ‘सम्मति’ की अपेक्षा संदर्भ में अधिक स्पष्ट है।
- source_word: προώρισεν
  choice: पहले से ठहरा दिया था
  rationale: क्रिया पूर्व-निर्धारण को व्यक्त करती है। यह हिन्दी पदबंध उस प्रबल अर्थ और घटनाओं से पहले किए गए निर्धारण—दोनों को रखता है, बिना किसी सम्प्रदायगत तकनीकी शब्दावली को थोपे।
- source_word: γενέσθαι
  choice: घटित हो
  rationale: यहाँ γίνομαι घटनाओं के घटने या अस्तित्व में आने को दर्शाता है; ‘घटित हो’ गरिमापूर्ण, स्पष्ट और संदर्भानुकूल है।
theological_decisions:
- issue: 'प्रोओरिज़ो (προώρισεν) का अनुवाद: परमेश्वर की प्रभुता और मानवीय उत्तरदायित्व'
  choice: पहले से ठहरा दिया था
  alternative: पहले से निर्धारित कर दिया था; पहले ही निश्चय कर लिया था
  rationale: मूल क्रिया स्पष्ट रूप से पहले से निर्धारण का बोध देती है। मुख्य पाठ इस प्रबल अर्थ को बनाए रखता है, पर इससे जुड़ी व्यापक धर्मवैज्ञानिक प्रणालियों का निर्णय नहीं करता और न ही प्रसंग में उपस्थित मानवीय उत्तरदायित्व को मिटाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थना में परमेश्वर के लिए आदरसूचक ‘आपके’ रखा गया है। वाक्य को गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखा गया है और ‘हाथ’ का बाइबलीय रूपक सुरक्षित है।
