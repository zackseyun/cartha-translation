  text: (καὶ ⸂Ἅννας ὁ ἀρχιερεὺς καὶ Καϊάφας καὶ Ἰωάννης καὶ Ἀλέξανδρος⸃ καὶ ὅσοι ἦσαν ἐκ γένους ἀρχιερατικοῦ),
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/006.yaml
  text: and Annas the high priest[a], and Caiaphas, and John, and Alexander, and all who were of the high-priestly family,
translation:
  language: hi
  text: और हन्ना महायाजक, और कैफा, और यूहन्ना, और सिकन्दर, और वे सभी जो महायाजकीय कुल[a] के थे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महायाजकीय वंश के” अथवा “महायाजकीय परिवार के।”
    reason: γένος परिवार, कुल या वंश को सूचित कर सकता है; मुख्य पाठ स्वाभाविक हिन्दी में ‘कुल’ चुनता है और अन्य वास्तविक अर्थछटाएँ टिप्पणी में रखता है।
lexical_decisions:
- source_word: Ἅννας
  choice: हन्ना
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी बाइबल परंपरा में प्रचलित लिप्यंतरण।
- source_word: ὁ ἀρχιερεὺς
  choice: महायाजक
  rationale: एकवचन पदवी को सीधे सुरक्षित रखता है; ऐतिहासिक परिस्थिति के आधार पर इसे ‘पूर्व महायाजक’ बनाकर पाठ की व्याख्या नहीं करता।
- source_word: Καϊάφας
  choice: कैफा
  rationale: यूनानी नाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: Ἰωάννης
  choice: यूहन्ना
  rationale: Ἰωάννης का हिन्दी बाइबल परंपरा में परिचित रूप, जो पाठकों के लिए स्वाभाविक है।
- source_word: Ἀλέξανδρος
  choice: सिकन्दर
  rationale: Ἀλέξανδρος का हिन्दी में सुस्थापित और आसानी से पहचाना जाने वाला रूप।
- source_word: ὅσοι ἦσαν
  choice: वे सभी जो ... के थे
  rationale: बहुवचन परिमाणवाचक संबंधसूचक अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκ γένους ἀρχιερατικοῦ
  choice: महायाजकीय कुल के
  rationale: γένος के परिवार, वंश या कुल-संबंधी अर्थ और ἀρχιερατικός के महायाजकत्व-संबंधी विशेषणभाव को संक्षेप और स्पष्टता से सुरक्षित रखता है।
theological_decisions:
- issue: उस समय कैफा के पदासीन होने के बावजूद हन्ना के लिए ὁ ἀρχιερεύς पदवी
  choice: हन्ना महायाजक
  alternative: हन्ना, जो पहले महायाजक था; हन्ना प्रधान याजक
  rationale: यूनानी पाठ हन्ना को स्पष्टतः यह पदवी देता है। अनुवाद ऐतिहासिक सामंजस्य के लिए ‘पूर्व’ नहीं जोड़ता और पाठ में विद्यमान तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। पद्य पिछले वाक्य की सूची का अंश है, इसलिए मूल के अनुरूप अंत में अल्पविराम रखा गया है। बार-बार आया καί सूची में ‘और’ के रूप में सुरक्षित है।
