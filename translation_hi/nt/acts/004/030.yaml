source:
  edition: SBLGNT
  text: ἐν τῷ τὴν χεῖρά ⸀σου ἐκτείνειν σε εἰς ἴασιν καὶ σημεῖα καὶ τέρατα γίνεσθαι διὰ τοῦ ὀνόματος τοῦ ἁγίου παιδός σου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/030.yaml
  text: while you stretch out your hand for healing[a], and signs and wonders are done through the name of your holy servant Jesus.
translation:
  language: hi
  text: जब आप चंगाई के लिए अपना हाथ बढ़ाते हैं और आपके पवित्र सेवक यीशु के नाम के द्वारा चिन्ह और चमत्कार होते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ ... ἐκτείνειν
  choice: जब ... बढ़ाते हैं
  rationale: ἐν τῷ के साथ क्रिया का infinitive रूप साथ-साथ घटित होने वाली परिस्थिति व्यक्त करता है। प्रार्थना के इस वाक्य में ‘जब’ स्वाभाविक हिन्दी है और मुख्य क्रिया के साथ समकालिकता बनाए रखता है।
- source_word: τὴν χεῖρά σου
  choice: अपना हाथ
  rationale: यह सीधा और स्वाभाविक अनुवाद है तथा परमेश्वर की सामर्थ्य और कार्य के बाइबलीय रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: εἰς ἴασιν
  choice: चंगाई के लिए
  rationale: ἴασις का अर्थ चंगा करना या चंगाई है; εἰς यहाँ उद्देश्य अथवा परिणाम की दिशा बताता है। ‘चंगाई के लिए’ दोनों संभावनाओं को पर्याप्त रूप से खुला रखता है।
- source_word: σημεῖα καὶ τέρατα
  choice: चिन्ह और अद्भुत काम
  rationale: यह प्रेरितों के काम में प्रयुक्त स्थापित युग्म का स्पष्ट, स्वाभाविक हिन्दी रूप है। ‘चमत्कारी’ जोड़ना अनावश्यक व्याख्या होती।
- source_word: γίνεσθαι
  choice: होते हैं
  rationale: γίνομαι यहाँ घटनाओं के घटित होने को व्यक्त करता है। ‘होते हैं’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी के अकर्मक भाव को सुरक्षित रखता है।
- source_word: διὰ τοῦ ὀνόματος
  choice: नाम के द्वारा
  rationale: διά के संबंधकारक रूप के साथ साधन अथवा माध्यम का अर्थ है। ‘नाम के द्वारा’ यीशु के नाम से जुड़ी सामर्थ्य और अधिकार को बिना आवश्यकता से अधिक स्पष्ट किए बनाए रखता है।
- source_word: τοῦ ἁγίου παιδός σου Ἰησοῦ
  choice: आपके पवित्र सेवक यीशु
  rationale: παῖς का अर्थ ‘सेवक’ या ‘बालक’ दोनों हो सकता है। प्रेरितों 3:13, 3:26 और यहाँ यशायाह के सेवक-विषय की प्रतिध्वनि के कारण ‘सेवक’ अधिक उपयुक्त है; वास्तविक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: यीशु के लिए παῖς का अनुवाद
  choice: सेवक
  alternative: बालक
  rationale: शब्द स्वयं दोनों अर्थ ग्रहण कर सकता है, पर प्रेरितों के काम के निकटवर्ती प्रयोग और यशायाह के सेवक की प्रतिध्वनि ‘सेवक’ के पक्ष में हैं। यह चयन यीशु के पुत्रत्व का निषेध नहीं करता; वह अन्य शब्दों और संदर्भों में व्यक्त होता है। अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रार्थना में परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है। ‘चंगाई’, ‘चिन्ह’ और ‘अद्भुत काम’ हिन्दी बाइबल की परिचित शब्दावली हैं, किंतु वाक्य-विन्यास वर्तमान हिन्दी के अनुरूप है।
