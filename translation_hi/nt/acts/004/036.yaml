id: ACT.4.36
reference: Acts 4:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀Ἰωσὴφ δὲ ὁ ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων, ὅ ἐστιν μεθερμηνευόμενον υἱὸς παρακλήσεως, Λευίτης, Κύπριος τῷ γένει,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/036.yaml
  text: Joseph[a], who was called Barnabas by the apostles—which translated means son of encouragement—a Levite, a native of Cyprus,
translation:
  language: hi
  text: और यूसुफ, जिसे प्रेरितों ने बरनबास कहा था—जिसका अनुवाद है, “प्रोत्साहन का पुत्र”[a]—एक लेवी था और जन्म से कुप्रुस का निवासी था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समझाने-बुझाने का पुत्र,” “सांत्वना का पुत्र,” अथवा “ढाढ़स का पुत्र।” यूनानी शब्द में प्रोत्साहित करने, आग्रहपूर्वक समझाने और सांत्वना देने के अर्थ हो सकते हैं।
    reason: παράκλησις के वास्तविक और प्रसंगतः संभव अर्थ-क्षेत्र को सुरक्षित रखना।
lexical_decisions:
- source_word: Ἰωσὴφ
  choice: यूसुफ
  rationale: इस व्यक्तिगत नाम का प्रचलित और मानक हिन्दी रूप।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा में हल्का संक्रमण करते हुए एक नए व्यक्ति का परिचय देता है; ‘और’ बिना अनावश्यक विरोध या काल-सूचक अर्थ जोड़े उस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπικληθεὶς Βαρναβᾶς ἀπὸ τῶν ἀποστόλων
  choice: जिसे प्रेरितों ने बरनबास कहा था
  rationale: यह नामकरण अथवा प्रचलित संबोधन और उसके स्रोत को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है; ‘भी’ नहीं जोड़ा गया क्योंकि उसका स्पष्ट स्रोतगत आधार नहीं है।
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: जिसका अनुवाद है
  rationale: लेखक द्वारा दिए गए नाम के अर्थ-संबंधी स्पष्टीकरण को संक्षिप्त और सहज रूप में रखता है।
- source_word: υἱὸς παρακλήσεως
  choice: प्रोत्साहन का पुत्र
  rationale: παράκλησις के प्रोत्साहन, आग्रह और सांत्वना से जुड़े व्यापक अर्थ-क्षेत्र में ‘प्रोत्साहन’ सहज और पर्याप्त व्यापक मुख्य-पाठ विकल्प है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: Λευίτης
  choice: एक लेवी
  rationale: जातीय तथा धार्मिक पहचान के लिए प्रचलित हिन्दी पद।
- source_word: Κύπριος τῷ γένει
  choice: जन्म से कुप्रुस का निवासी
  rationale: τῷ γένει यहाँ जन्म अथवा मूल को बताता है; यह रूप व्यक्ति की भौगोलिक उत्पत्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: बरनबास की व्याख्या में παρακλήσεως का अर्थ
  choice: मुख्य पाठ में ‘प्रोत्साहन’
  alternative: ‘समझाने-बुझाने’, ‘सांत्वना’ या ‘ढाढ़स’
  rationale: मूल शब्द उत्साहित करने, आग्रहपूर्वक समझाने और सांत्वना देने के अर्थ रख सकता है। पद किसी एक संकुचित अर्थ को निर्णायक नहीं बनाता, इसलिए मुख्य पाठ में व्यापक विकल्प और पादटिप्पणी में अन्य अर्थ रखे गए हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘प्रोत्साहन का पुत्र’ में मूल की सामी अभिव्यक्ति बनाए रखी गई है। अंतिम अल्पविराम इसलिए रखा गया है कि यूनानी वाक्य अगले पद के कृदन्तीय कथन में जारी रहता है।
