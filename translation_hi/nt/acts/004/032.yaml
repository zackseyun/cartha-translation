source:
  edition: SBLGNT
  text: Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν ⸀καρδία καὶ ⸀ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων ⸀αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ’ ἦν αὐτοῖς ⸀πάντα κοινά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/032.yaml
  text: The multitude of those who had believed were of one heart and soul[a], and not even one of them said that anything belonging to him was his own[b], but all things were held in common among them.
translation:
  language: hi
  text: विश्वास करनेवालों का बड़ा समूह हृदय और प्राण में एक था[a]। उनमें से एक भी व्यक्ति अपनी किसी वस्तु को अपनी नहीं कहता था[b], बल्कि उनकी सभी वस्तुएँ साझी थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वे अपने भीतरी जीवन और अभिप्राय में एक थे।
    reason: मुहावरे ‘हृदय और प्राण में एक’ की व्याख्या।
  - marker: b
    text: यूनानी में यहाँ एकवचन रूप है, जो समुदाय के प्रत्येक व्यक्ति को अलग-अलग ध्यान में रखता है।
    reason: वितरणात्मक एकवचन की व्याख्या।
lexical_decisions:
- source_word: πλήθους
  choice: पूरा समुदाय
  rationale: πλῆθος विश्वास करनेवालों के बड़े समूह को दर्शाता है। ‘पूरा समुदाय’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ केवल आकस्मिक ‘भीड़’ का भाव उत्पन्न नहीं करता।
- source_word: τῶν πιστευσάντων
  choice: जिन्होंने विश्वास किया था
  rationale: यह अनुवाद क्रियात्मक रूप को बनाए रखता है और विश्वास करने की घटना को इस वर्णन से पहले की क्रिया के रूप में व्यक्त करता है।
- source_word: καρδία καὶ ψυχὴ μία
  choice: हृदय और प्राण एक था
  rationale: दोनों यूनानी संज्ञाओं और उनकी एकता को बनाए रखते हुए यह वाक्यांश समुदाय की आंतरिक और जीवनगत एकता व्यक्त करता है।
- source_word: οὐδὲ εἷς
  choice: एक भी व्यक्ति ... नहीं
  rationale: यह οὐδὲ की बलयुक्त नकारात्मकता को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: τι τῶν ὑπαρχόντων αὐτῷ
  choice: अपनी किसी वस्तु को
  rationale: यह प्रत्येक व्यक्ति से संबंधित संपत्ति या वस्तु का अर्थ देता है और यूनानी के वितरणात्मक एकवचन को हिन्दी के स्वाभाविक निजवाचक रूप ‘अपनी’ से व्यक्त करता है।
- source_word: ἔλεγεν ἴδιον εἶναι
  choice: अपनी नहीं कहता था
  rationale: यह निजी स्वामित्व के दावे का भाव रखता है, पर ‘केवल अपनी’ जैसे अतिरिक्त अर्थ को मूल पाठ में नहीं जोड़ता।
- source_word: πάντα κοινά
  choice: सभी वस्तुएँ साझी थीं
  rationale: यह यूनानी की संयोजक-विधेय संरचना और सामूहिक उपयोग/अधिकार का भाव सरल, स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: यरूशलेम के विश्वासियों की संपत्ति का सामुदायिक स्वरूप
  choice: पद को इस रूप में वर्णनात्मक रखा गया है कि कोई अपनी वस्तुओं पर निजी दावा नहीं करता था और सब वस्तुएँ साझी थीं।
  alternative: ‘वे हर वस्तु के संयुक्त स्वामी थे’ जैसा अधिक प्रबल संस्थागत कथन, अथवा साझेपन को कम करके केवल उदारता बताना।
  rationale: मूल पाठ निजी दावे के अभाव और सब वस्तुओं के κοινά होने—दोनों को कहता है, पर किसी बाद की आर्थिक, राजनीतिक या कलीसियाई व्यवस्था का नाम नहीं देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हृदय और प्राण’ मूल के दोनों रूपकों को सुरक्षित रखता है; ‘साझी थीं’ किसी विशिष्ट आधुनिक आर्थिक व्यवस्था का संकेत दिए बिना κοινά का सामुदायिक भाव व्यक्त करता है।
