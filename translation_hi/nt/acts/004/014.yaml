  text: τόν ⸀τε ἄνθρωπον βλέποντες σὺν αὐτοῖς ἑστῶτα τὸν τεθεραπευμένον οὐδὲν εἶχον ἀντειπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/014.yaml
  text: And seeing the man who had been healed standing with them[a], they had nothing to say in reply.
translation:
  language: hi
  text: और जिस मनुष्य को चंगा किया गया था, उसे उनके साथ खड़ा देखकर, उनके पास प्रतिवाद में कहने को कुछ न था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनके पास उत्तर में कहने को कुछ न था’; या, ‘वे इसका खंडन नहीं कर सके।’
    reason: मूल यूनानी εἶχον ἀντειπεῖν का अर्थ उत्तर में विरोध करने के लिए कुछ न होना, या खंडन न कर पाना, हो सकता है।
lexical_decisions:
- source_word: τε
  choice: और
  rationale: यह अव्यय इस वाक्य को पिछले घटनाक्रम से जोड़ता है; सरल ‘और’ हिन्दी में इसके संयोजक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἄνθρωπον
  choice: मनुष्य
  rationale: यह पिछले प्रसंग में चंगे किए गए विशिष्ट पुरुष को सूचित करता है। ‘मनुष्य’ गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: βλέποντες
  choice: देखकर
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ घट रही परिस्थिति बताता है। हिन्दी में ‘देखकर’ इस सम्बन्ध को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: σὺν αὐτοῖς
  choice: उनके साथ
  rationale: σύν और सम्प्रदान कारक साथ या संगति का अर्थ देते हैं; ‘उनके साथ’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: ἑστῶτα
  choice: खड़ा
  rationale: ἵστημι का पूर्ण कृदन्त उस व्यक्ति की खड़े होने की वर्तमान अवस्था बताता है; हिन्दी में ‘खड़ा’ स्वाभाविक रूप से इस स्थितिपरक अर्थ को व्यक्त करता है।
- source_word: τεθεραπευμένον
  choice: जिस मनुष्य को चंगा किया गया था
  rationale: θεραπεύω का पूर्ण कर्मवाच्य कृदन्त पूरी हो चुकी चंगाई और उसके बने हुए परिणाम को सूचित करता है। यह वाक्यांश कर्मवाच्य और पहचान—दोनों को स्पष्ट रखता है।
- source_word: οὐδὲν
  choice: कुछ न
  rationale: यह पूर्ण निषेध व्यक्त करता है। ‘कुछ न’ हिन्दी वाक्य-विन्यास में ‘कुछ भी नहीं’ की अपेक्षा अधिक सहज बैठता है और अर्थ को पूरा रखता है।
- source_word: εἶχον ἀντειπεῖν
  choice: विरोध में कुछ न कह सके
  rationale: यह संरचना उनके पास प्रतिवाद करने के लिए कुछ न होने या प्रतिवाद न कर सकने को व्यक्त करती है। चुना गया रूप ἀντειπεῖν के विरोधात्मक बल को बनाए रखते हुए सहज आधुनिक हिन्दी देता है।
