  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘चंगा किया गया था’ चमत्कारी चंगाई के प्रसंग और यूनानी कर्मवाच्य को बनाए रखता है; ‘विरोध में’ मूल क्रिया के प्रतिवादी अर्थ को स्पष्ट करता है।
