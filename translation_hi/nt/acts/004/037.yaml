source:
  edition: SBLGNT
  text: ὑπάρχοντος αὐτῷ ἀγροῦ πωλήσας ἤνεγκεν τὸ χρῆμα καὶ ἔθηκεν ⸀παρὰ τοὺς πόδας τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/037.yaml
  text: Since he owned a field[b][a], he sold it and brought the money and laid it at the apostles’ feet.
translation:
  language: hi
  text: उसके पास एक खेत था[a]; उसने उसे बेचकर रकम[b] लाकर प्रेरितों के पाँवों के पास रख दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका एक खेत था।” यूनानी रचना पृष्ठभूमि की परिस्थिति बताती है; इसका अर्थ “क्योंकि उसके पास एक खेत था” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात बिक्री से मिली धनराशि; या “पैसा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάρχοντος αὐτῷ ἀγροῦ
  choice: उसके पास एक खेत था
  rationale: यूनानी संबंधकारक निरपेक्ष रचना पृष्ठभूमि की परिस्थिति प्रस्तुत करती है। यह हिंदी अभिव्यक्ति स्वाभाविक है और खेत पर उसके अधिकार को बताती है, बिना कारण-संबंध को अनावश्यक रूप से निश्चित किए।
- source_word: ἀγροῦ
  choice: एक खेत
  rationale: ἀγρός खेत या भूमि के किसी भूखंड को सूचित कर सकता है। यहाँ ‘खेत’ सीधा, व्यापक और सामान्य पाठक के लिए सहज है।
- source_word: πωλήσας
  choice: उसे बेचकर
  rationale: भूतकालिक कृदंत मुख्य क्रियाओं से पहले हुई बिक्री को दर्शाता है। ‘बेचकर’ हिंदी में इस क्रम को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἤνεγκεν
  choice: लाकर
  rationale: φέρω यहाँ किसी वस्तु को लाने का अर्थ देता है। संयुक्त क्रिया-क्रम में ‘लाकर ... रख दी’ सहज हिंदी है।
- source_word: τὸ χρῆμα
  choice: रकम
  rationale: χρῆμα यहाँ धनराशि, प्रसंगतः बिक्री से मिली रकम, को दर्शाता है। ‘रकम’ संक्षिप्त और स्वाभाविक है तथा मूल से अधिक विवरण मुख्य पाठ में नहीं जोड़ता।
- source_word: ἔθηκεν
  choice: रख दी
  rationale: τίθημι का मूल अर्थ रखना या धरना है। हिंदी में स्त्रीलिंग ‘रकम’ के अनुसार ‘रख दी’ स्वाभाविक है।
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: प्रेरितों के पाँवों के पास
  rationale: यह अनुवाद यूनानी का ठोस स्थानिक चित्र बनाए रखता है और रकम को प्रेरितों की देखरेख में सौंपने का कथात्मक संकेत भी सुरक्षित रखता है।
theological_decisions:
- issue: धन को प्रेरितों के अधिकार या देखरेख में प्रस्तुत करने के भौतिक मुहावरे को बनाए रखना
  choice: ‘प्रेरितों के पाँवों के पास रख दी’ का ठोस चित्र बनाए रखा गया।
  alternative: केवल भावार्थ देकर ‘प्रेरितों को दे दी’ कहना।
  rationale: मूल पाठ वास्तविक क्रिया और सौंपे जाने के सामाजिक अर्थ—दोनों को व्यक्त करता है। ठोस चित्र को बनाए रखना किसी अतिरिक्त कलीसियाई व्यवस्था को आरोपित किए बिना दोनों पहलुओं की रक्षा करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। अर्धविराम पृष्ठभूमि और उसके बाद की क्रिया को जोड़ता है, पर यूनानी रचना के संभावित कारण-संबंध को मुख्य पाठ में निश्चित नहीं करता।
