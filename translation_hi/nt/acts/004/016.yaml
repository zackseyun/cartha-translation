reference: Acts 4:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγοντες· Τί ⸀ποιήσωμεν τοῖς ἀνθρώποις τούτοις; ὅτι μὲν γὰρ γνωστὸν σημεῖον γέγονεν δι’ αὐτῶν πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν, καὶ οὐ δυνάμεθα ⸀ἀρνεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/016.yaml
  text: saying[a], “What should we do with these men? For indeed, a notable sign has happened through them, evident to all who live in Jerusalem, and we cannot deny it.”
translation:
  language: hi
  text: वे कह रहे थे, “हम इन आदमियों के साथ क्या करें? क्योंकि निःसंदेह, उनके द्वारा एक जाना-माना चिन्ह हुआ है, जो यरूशलेम में रहने वाले सभी लोगों को स्पष्ट है, और हम इससे इनकार नहीं कर सकते।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: वे कह रहे थे
  rationale: वर्तमान कृदंत पिछली घटना से जुड़ी परिषद की बातचीत का परिचय देता है; हिन्दी में यह रूप स्वाभाविक रूप से उस जारी विचार-विमर्श को व्यक्त करता है।
- source_word: Τί ποιήσωμεν τοῖς ἀνθρώποις τούτοις
  choice: हम इन लोगों के साथ क्या करें?
  rationale: विचारार्थक aorist subjunctive को आधुनिक हिन्दी के स्वाभाविक प्रश्न से व्यक्त किया गया है; सन्दर्भ में ये लोग पतरस और यूहन्ना हैं।
- source_word: ὅτι μὲν γὰρ
  choice: क्योंकि
  rationale: यह पिछले प्रश्न का कारण प्रस्तुत करता है; अतिरिक्त बल पूरे वाक्य की स्पष्ट स्वीकारोक्ति से स्वाभाविक रूप में उभरता है।
- source_word: γνωστὸν σημεῖον
  choice: एक जाना-माना चिन्ह
  rationale: γνωστόν यहाँ सार्वजनिक रूप से ज्ञात और स्वीकार किए गए होने का भाव रखता है; ‘जाना-माना’ उस अर्थ को ‘असाधारण’ जैसे अधिक व्याख्यात्मक शब्द के बिना व्यक्त करता है।
- source_word: γέγονεν
  choice: हुआ है
  rationale: पूर्ण काल सम्पन्न घटना और उसके वर्तमान प्रभाव दोनों को सूचित करता है; ‘हुआ है’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: δι’ αὐτῶν
  choice: उनके द्वारा
  rationale: διά के साथ सम्बन्धकारक माध्यम अथवा अभिकरण बताता है; यह अनुवाद प्रेरितों की स्वतंत्र सामर्थ्य को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: πᾶσιν τοῖς κατοικοῦσιν Ἰερουσαλὴμ φανερόν
  choice: यह यरूशलेम के सभी निवासियों पर स्पष्ट है
  rationale: φανερόν के सार्वजनिक रूप से प्रत्यक्ष और निर्विवाद होने का भाव तथा दत्तिव पद का सम्बन्ध स्पष्ट रखा गया है।
- source_word: οὐ δυνάμεθα ἀρνεῖσθαι
  choice: हम इससे इनकार नहीं कर सकते
  rationale: यूनानी में कर्म निहित है; हिन्दी में ‘इससे’ पिछले कथन—चिन्ह के घटित होने और स्पष्ट होने—की ओर स्वाभाविक संकेत करता है।
theological_decisions:
- issue: सार्वजनिक चंगाई के प्रसंग में σημεῖον का स्वरूप
  choice: चिन्ह
  alternative: चमत्कार
  rationale: प्रेरितों के काम में σημεῖον घटना के आश्चर्यजनक स्वरूप के साथ उसके संकेतकारी धार्मिक अर्थ को भी बनाए रखता है; ‘चमत्कार’ उस अर्थ को केवल अद्भुत कार्य तक सीमित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में बोधगम्य रखी गई है। ‘इन लोगों’ सन्दर्भ में पतरस और यूहन्ना को सूचित करता है, जबकि हिन्दी में कृत्रिम या अनावश्यक रूप से कठोर लिंग-सूचक अभिव्यक्ति से बचता है।
