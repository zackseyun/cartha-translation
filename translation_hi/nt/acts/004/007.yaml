source:
  edition: SBLGNT
  text: καὶ στήσαντες αὐτοὺς ἐν ⸀τῷ μέσῳ ἐπυνθάνοντο· Ἐν ποίᾳ δυνάμει ἢ ἐν ποίῳ ὀνόματι ἐποιήσατε τοῦτο ὑμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/007.yaml
  text: And after setting them in the midst[a], they began asking, “By what power or in what name did you do this?”
translation:
  language: hi
  text: और उन्हें बीच में खड़ा करने के बाद वे पूछने लगे, “तुमने यह किस शक्ति से या किस नाम से किया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στήσαντες
  choice: खड़ा करके
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई परिस्थिति-सूचक क्रिया बताता है। ‘खड़ा करके’ हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν τῷ μέσῳ
  choice: बीच में
  rationale: यह यूनानी पदबंध का सीधा और स्वाभाविक हिन्दी समतुल्य है तथा सभा के मध्य खड़ा किए जाने की न्यायिक-जाँच जैसी परिस्थिति को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: ἐπυνθάνοντο
  choice: वे पूछने लगे
  rationale: अपूर्ण भूतकाल यहाँ आरंभिक या जारी पूछताछ का संकेत दे सकता है। मुख्य पाठ में ‘पूछने लगे’ कथात्मक संदर्भ के अनुकूल है; अन्य सम्भावना पादटिप्पणी में दी गई है।
- source_word: Ἐν ποίᾳ δυνάμει
  choice: किस सामर्थ्य से
  rationale: ἐν का यहाँ साधनवाचक भाव है। δύναμις के लिए ‘सामर्थ्य’ मूल अर्थ ‘शक्ति’ को रखता है और इसे ‘अधिकार’ में व्याख्यायित नहीं करता।
- source_word: ἢ ἐν ποίῳ ὀνόματι
  choice: या किस नाम में
  rationale: ‘नाम में’ बाइबलीय मुहावरे को बनाए रखता है, जिसमें किसी के प्रतिनिधित्व, आह्वान या अधिकार से कार्य करने का भाव हो सकता है; इन अर्थों में से किसी एक को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: ἐποιήσατε τοῦτο
  choice: तुमने यह ... किया
  rationale: अओरिस्ट को सहज भूतकाल में रखा गया है। ‘यह’ संदर्भित चंगाई या चिन्ह की ओर संकेत करता है, पर मुख्य पाठ में अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: ὑμεῖς
  choice: तुमने
  rationale: स्पष्ट यूनानी सर्वनाम का बल हिन्दी में ‘तुमने’ द्वारा पर्याप्त रूप से उभरता है; ‘तुम लोगों ने स्वयं’ अनावश्यक रूप से भारी होता।
theological_decisions:
- issue: δύναμις का अनुवाद ‘सामर्थ्य’ किया जाए या ‘अधिकार’
  choice: सामर्थ्य
  alternative: अधिकार
  rationale: मूल में δύναμις है, जिसका सामान्य अर्थ शक्ति या सामर्थ्य है; साथ का ‘किस नाम में’ प्रतिनिधिक अधिकार का भाव पहले ही सम्भव बनाता है। ‘सामर्थ्य’ दोनों प्रश्नांशों का भेद सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘सामर्थ्य’ और ‘नाम में’ स्रोत के अर्थगत तथा धार्मिक तनाव को बिना सांप्रदायिक व्याख्या के सुरक्षित रखते हैं।
