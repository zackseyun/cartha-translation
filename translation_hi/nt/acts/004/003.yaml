  register: आधुनिक मानक हिन्दी; कथन संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘हिरासत’ कानूनी संदर्भ को स्पष्ट करता है, जबकि पादटिप्पणियाँ यूनानी मुहावरे और अभिरक्षा के अनिर्दिष्ट स्वरूप को सुरक्षित रखती हैं।
