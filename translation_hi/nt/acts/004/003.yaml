  text: καὶ ἐπέβαλον αὐτοῖς τὰς χεῖρας καὶ ἔθεντο εἰς τήρησιν εἰς τὴν αὔριον, ἦν γὰρ ἑσπέρα ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/003.yaml
  text: And they laid hands on them and put them in custody until the next day[b][a], for it was already evening.
translation:
  language: hi
  text: उन्होंने उन्हें पकड़ लिया[a] और अगले दिन तक हिरासत में रख दिया[b], क्योंकि शाम हो चुकी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “उन पर हाथ डाले”; इस यूनानी मुहावरे का अर्थ यहाँ उन्हें बलपूर्वक पकड़ना या गिरफ्तार करना है।'
    reason: lexical_alternative
  - marker: b
    text: या “पहरे में रख दिया” अथवा “बंदी बनाकर रखा।” यूनानी पाठ अभिरक्षा में रखने की बात कहता है, पर किसी विशेष स्थान का उल्लेख नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον αὐτοῖς τὰς χεῖρας
  choice: उन्होंने उन्हें पकड़ लिया
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘उन पर हाथ डाले’ है, पर इस विरोधपूर्ण कानूनी प्रसंग में इसका भाव बलपूर्वक पकड़ना या गिरफ्तार करना है। ‘पकड़ लिया’ स्वाभाविक हिन्दी में यह भाव देता है और पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: यह बहुवचन सर्वनाम पतरस और यूहन्ना की ओर संकेत करता है।
- source_word: ἔθεντο εἰς τήρησιν
  choice: हिरासत में रख दिया
  rationale: τήρησις निगरानी अथवा अभिरक्षा में रखने को दर्शाता है; ‘हिरासत’ आधिकारिक बंदीकरण व्यक्त करता है, पर किसी विशेष कारागार का अनावश्यक अनुमान नहीं लगाता।
- source_word: εἰς τὴν αὔριον
  choice: अगले दिन तक
  rationale: यह समय-सूचक वाक्यांश कथात्मक हिन्दी में स्वाभाविक ढंग से अगले दिन तक की अवधि बताता है।
- source_word: ἦν γὰρ ἑσπέρα ἤδη
  choice: क्योंकि शाम हो चुकी थी
  rationale: यह सुनवाई टालने का कारण बताता है और यूनानी में उल्लिखित संध्या को स्पष्ट रूप से बनाए रखता है।
theological_decisions: []
