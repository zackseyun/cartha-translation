source:
  edition: SBLGNT
  text: εἰ ἡμεῖς σήμερον ἀνακρινόμεθα ἐπὶ εὐεργεσίᾳ ἀνθρώπου ἀσθενοῦς, ἐν τίνι οὗτος ⸀σέσωσται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/009.yaml
  text: If we are being examined today concerning a good deed done to a sick man[b][a], by what means this man has been healed—
translation:
  language: hi
  text: यदि आज हमसे एक अशक्त व्यक्ति के प्रति की गई भलाई के विषय में पूछताछ की जा रही है कि वह किस माध्यम से चंगा हुआ है[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बचाया गया है’ अथवा ‘स्वस्थ किया गया है।’ यूनानी क्रिया बचाने, उद्धार करने या चंगा करने के अर्थ में आ सकती है; यहाँ तत्काल प्रसंग शारीरिक चंगाई का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακρινόμεθα
  choice: हमसे … पूछताछ की जा रही है
  rationale: यह न्यायिक या आधिकारिक जाँच-पड़ताल का संकेत देता है। ‘पूछताछ’ आधुनिक हिन्दी में स्वाभाविक है और ‘मुकदमा चलाया जा रहा है’ जितना निश्चित या ‘कड़ी पूछताछ’ जितना तीखा अर्थ नहीं जोड़ता।
- source_word: ἐπὶ εὐεργεσίᾳ
  choice: की गई भलाई के विषय में
  rationale: ἐπί के साथ संप्रदान यहाँ पूछताछ का आधार या प्रसंग बताता है, और εὐεργεσία किसी हितकारी कार्य को दर्शाता है। यह रूप उस विडंबना को बनाए रखता है कि जाँच एक भले कार्य को लेकर हो रही है।
- source_word: ἀνθρώπου ἀσθενοῦς
  choice: एक अशक्त मनुष्य के साथ
  rationale: ἀσθενής शारीरिक दुर्बलता या असमर्थता बता सकता है। प्रसंग में व्यक्ति जन्म से चलने में असमर्थ था; ‘अशक्त’ स्रोत की व्यापकता बनाए रखता है और उसे केवल बीमारी तक सीमित नहीं करता।
- source_word: ἐν τίνι
  choice: किसके द्वारा
  rationale: ἐν के साथ प्रश्नवाचक संप्रदान साधन या कर्ता की ओर संकेत कर सकता है। अगले पद में उत्तर एक व्यक्ति, यीशु मसीह, के नाम से दिया जाता है; हिन्दी में ‘किसके द्वारा’ स्वाभाविक है, जबकि मूल की साधन-संबंधी छाया पूरी तरह नकारता नहीं।
- source_word: σέσωσται
  choice: चंगा हुआ है
  rationale: σῴζω का पूर्णकालिक कर्मवाच्य रूप यहाँ पहले अशक्त व्यक्ति की वर्तमान स्वस्थ दशा बताता है। ‘चंगा हुआ है’ तत्काल शारीरिक प्रसंग को स्पष्ट करता है; ‘बचाया गया है’ वाला व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: चंगाई के प्रसंग में σέσωσται का अनुवाद
  choice: चंगा हुआ है
  alternative: बचाया गया है; स्वस्थ किया गया है
  rationale: तात्कालिक प्रसंग शारीरिक बहाली का है, इसलिए मुख्य पाठ में चंगाई का अर्थ सर्वोचित है। फिर भी यही क्रिया उद्धार या बचाव के लिए भी प्रयुक्त होती है; इस अर्थगत और धर्मवैचारिक प्रतिध्वनि को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण रखी गई है। पद यूनानी की शर्तसूचक, अगले पद तक चलने वाली संरचना के कारण दीर्घ विराम पर समाप्त होता है। ‘अशक्त’ व्यक्ति की वास्तविक शारीरिक असमर्थता को ‘बीमार’ से अधिक सटीक और बिना अनावश्यक विस्तार के व्यक्त करता है।
