source:
  edition: SBLGNT
  text: καὶ τὰ νῦν, κύριε, ἔπιδε ἐπὶ τὰς ἀπειλὰς αὐτῶν καὶ δὸς τοῖς δούλοις σου μετὰ παρρησίας πάσης λαλεῖν τὸν λόγον σου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/029.yaml
  text: And now[a], Lord, look upon their threats and grant your servants to speak your word with all boldness,
translation:
  language: hi
  text: और अब, हे प्रभु, उनकी धमकियों पर ध्यान दे, और अपने दासों[a] को यह वर दे कि वे पूरे साहस के साथ तेरा वचन बोलें,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवकों’; यूनानी शब्द उस व्यक्ति को दर्शा सकता है जो किसी स्वामी के अधीन है और उसका होकर रहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τὰ νῦν
  choice: और अब
  rationale: यह प्रार्थना में पिछले कथन से वर्तमान विनती की ओर स्वाभाविक संक्रमण है और यूनानी पदबंध के ‘अब, जैसी स्थिति है’ वाले भाव को संक्षेप में रखता है।
- source_word: κύριε
  choice: हे प्रभु
  rationale: यह परमेश्वर को प्रार्थना में किया गया सीधा संबोधन है; ‘हे’ हिन्दी में संबोधन को स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: ἔπιδε ἐπὶ
  choice: पर ध्यान दे
  rationale: आज्ञार्थक क्रिया परमेश्वर से धमकियों को देखने, उन पर ध्यान देने या उनका संज्ञान लेने की विनती करती है। ‘ध्यान दे’ आधुनिक हिन्दी में स्वाभाविक है और भाव को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: τὰς ἀπειλὰς αὐτῶν
  choice: उनकी धमकियों
  rationale: बहुवचन ἀπειλάς का सीधा और प्रचलित हिन्दी रूप ‘धमकियों’ है।
- source_word: δὸς
  choice: यह वर दे
  rationale: शाब्दिक अर्थ ‘दे’ है, पर यहाँ प्रार्थना में किसी कार्य के लिए अवसर और सामर्थ्य दिए जाने की विनती है। ‘यह वर दे कि’ हिन्दी में विनती का आशय स्वाभाविक रूप से व्यक्त करता है, बिना इसे केवल अनुमति तक सीमित किए।
- source_word: τοῖς δούλοις σου
  choice: अपने दासों
  rationale: δοῦλος स्वामी के अधीन और उसका होकर रहने वाले व्यक्ति को दर्शाता है। ‘दास’ उस प्रबल संबंध को बचाता है; आधुनिक पाठक के लिए ‘सेवकों’ का विकल्प पादटिप्पणी में दिया गया है।
- source_word: μετὰ παρρησίας πάσης
  choice: पूरे साहस के साथ
  rationale: παρρησία यहाँ निर्भीक और खुलकर बोलने का भाव रखता है, और πάσης उसकी पूर्णता पर बल देता है। ‘पूरे साहस के साथ’ दोनों तत्वों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λαλεῖν
  choice: बोलें
  rationale: यह δὸς पर निर्भर अनंत क्रिया का प्रयोजन व्यक्त करता है। ‘बोलें’ मूल क्रिया का सीधा अर्थ रखता है; ‘प्रचार करें’ उससे अधिक व्याख्यात्मक होता।
- source_word: τὸν λόγον σου
  choice: तेरा वचन
  rationale: प्रेरितों के काम में λόγος परमेश्वर के सुनाए जाने वाले संदेश को दर्शा सकता है। ‘वचन’ बाइबलीय अभिव्यक्ति और धर्मवैचारिक अनुगूँज को बनाए रखता है, जबकि ‘संदेश’ अधिक व्याख्यात्मक है।
theological_decisions:
- issue: परमेश्वर से संबंध में δοῦλος का अनुवाद
  choice: अपने दासों
  alternative: अपने सेवकों
  rationale: ‘दास’ परमेश्वर के अधिकार के अधीन होने और उसका होकर रहने के अर्थ को अधिक स्पष्टता से सुरक्षित रखता है। ‘सेवक’ प्रार्थना के संदर्भ में सहज विकल्प है, पर मूल शब्द के स्वामित्व और पूर्ण अधीनता के पहलू को कुछ हल्का कर सकता है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और प्रार्थनापूर्ण रखी गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तेरा’ और क्रियाएँ ‘दे/ध्यान दे’ लगातार प्रयुक्त हैं। पद के अंत का अल्पविराम यूनानी वाक्य के अगले पद में जारी रहने को दर्शाता है।
