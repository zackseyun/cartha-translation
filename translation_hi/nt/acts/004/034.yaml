  text: οὐδὲ γὰρ ἐνδεής τις ⸀ἦν ἐν αὐτοῖς· ὅσοι γὰρ κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον, πωλοῦντες ἔφερον τὰς τιμὰς τῶν πιπρασκομένων
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/034.yaml
  text: For there was not even any needy person among them[a], for as many as were owners of fields or houses were selling them and bringing the proceeds of what was sold.
translation:
  language: hi
  text: क्योंकि उनमें एक भी ज़रूरतमंद व्यक्ति नहीं था। जितने लोग खेतों या घरों के मालिक थे, वे उन्हें बेचते थे और उनकी बिक्री से मिली रकम[a] लाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बेची जा रही चीज़ों के दाम।”
    reason: मूल यूनानी में ‘दाम/मूल्य’ है; मुख्य पाठ में प्रसंगानुकूल स्वाभाविक हिन्दी ‘बिक्री से मिली रकम’ दी गई है।
lexical_decisions:
- source_word: οὐδὲ γὰρ ἐνδεής τις ἦν ἐν αὐτοῖς
  choice: क्योंकि उनमें एक भी ज़रूरतमंद व्यक्ति नहीं था
  rationale: γάρ का पिछले कथन से व्याख्यात्मक संबंध ‘क्योंकि’ से और οὐδέ का बल ‘एक भी ... नहीं’ से व्यक्त होता है। ἐνδεής को ‘गरीब’ तक सीमित न करके व्यापक अभाव-सूचक ‘ज़रूरतमंद’ रखा गया है।
- source_word: ὅσοι γὰρ κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον
  choice: जितने लोग खेतों या घरों के मालिक थे
  rationale: ὅσοι का वर्ग के भीतर व्यापक अर्थ ‘जितने लोग’ से सुरक्षित रहता है। χωρίων के लिए प्रसंगानुकूल और सहज ‘खेतों’ तथा κτήτορες के लिए ‘मालिक’ चुना गया है। दूसरे γάρ का संबंध हिन्दी में वाक्य-क्रम और अगले स्पष्टीकरण से स्पष्ट है; लगातार दो बार ‘क्योंकि’ कहना असहज होता।
- source_word: πωλοῦντες ἔφερον
  choice: वे उन्हें बेचते और ... लाकर देते थे
  rationale: अपूर्ण भूतकाल ἔφερον और सहभागी क्रिया πωλοῦντες मिलकर बार-बार या प्रचलित रूप से होने वाली गतिविधि बताते हैं। ‘बेचते ... थे’ इस प्रवृत्तिगत अर्थ को स्वाभाविक हिन्दी में रखता है। ‘देते’ प्राप्त रकम समुदाय/प्रेरितों के पास पहुँचाने के आशय को सहज बनाता है, यद्यपि मूल क्रिया का आधारभूत अर्थ ‘लाते’ है।
- source_word: τὰς τιμὰς τῶν πιπρασκομένων
  choice: बिक्री से मिली रकम
  rationale: τιμάς का शाब्दिक अर्थ ‘दाम/मूल्य’ है, पर यहाँ आशय बेची गई संपत्ति से प्राप्त धनराशि है। ‘बिक्री से मिली रकम’ आधुनिक हिन्दी में वही अर्थ स्पष्ट रूप से व्यक्त करती है; अधिक शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: क्या पद सभी विश्वासियों द्वारा अनिवार्य रूप से सारी संपत्ति बेच देने का दावा करता है?
  choice: ‘जितने लोग ... मालिक थे, वे उन्हें बेचते’
  alternative: ‘सभी संपत्ति-मालिकों ने अपनी सारी संपत्ति बेच दी’
  rationale: ὅσοι वर्णित वर्ग को समेटता है, पर मूल पाठ न तो ‘सारी’ जोड़ता है, न एकबारगी पूर्ण विक्रय को स्पष्ट करता है। अपूर्ण क्रिया-रूप चलती या बार-बार होने वाली प्रथा की ओर संकेत करते हैं; इसलिए अनिवार्य सामूहिक स्वामित्व जैसी अतिरिक्त धार्मिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘ज़रूरतमंद’ अभाव के अर्थ को केवल आर्थिक निर्धनता तक सीमित नहीं करता। वाक्य-विभाजन हिन्दी की पठनीयता के लिए किया गया है, जबकि दोनों खंडों का कारणात्मक संबंध बना रहता है।
