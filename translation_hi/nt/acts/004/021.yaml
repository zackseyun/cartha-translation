source:
  edition: SBLGNT
  text: οἱ δὲ προσαπειλησάμενοι ἀπέλυσαν αὐτούς, μηδὲν εὑρίσκοντες τὸ πῶς ⸀κολάσωνται αὐτούς, διὰ τὸν λαόν, ὅτι πάντες ἐδόξαζον τὸν θεὸν ἐπὶ τῷ γεγονότι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/021.yaml
  text: So after further threatening them[a], they released them, finding no way to punish them because of the people, since everyone was glorifying God for what had happened.
translation:
  language: hi
  text: पर उन्होंने उन्हें और धमकियाँ देकर[a] छोड़ दिया, क्योंकि लोगों के कारण उन्हें दण्ड देने का कोई उपाय नहीं मिल रहा था; इसलिए कि जो कुछ हुआ था, उसके कारण सभी लोग परमेश्वर की महिमा कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘फिर से धमकाकर’ अथवा ‘और अधिक धमकाकर।’ यूनानी शब्द पहले दी गई धमकियों के बाद और अधिक या अधिक तीव्र धमकियाँ देने का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαπειλησάμενοι
  choice: और भी धमकाकर
  rationale: उपसर्ग προς- यहाँ पहले दी गई धमकियों में और धमकी जोड़ने या उन्हें तीव्र करने का भाव देता है। यह हिन्दी में स्वाभाविक रहते हुए उस अतिरिक्तता को बनाए रखता है।
- source_word: ἀπέλυσαν
  choice: छोड़ दिया
  rationale: यहाँ क्रिया का अर्थ हिरासत से जाने देना है; ‘छोड़ दिया’ आधुनिक हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: μηδὲν εὑρίσκοντες τὸ πῶς κολάσωνται αὐτούς
  choice: उन्हें यह समझ नहीं आ रहा था कि उन्हें किस तरह दण्ड दें
  rationale: शाब्दिक रूप से ‘कुछ न पाते हुए कि कैसे दण्ड दें’ का आशय दण्ड देने का व्यावहारिक उपाय न मिलना है। हिन्दी वाक्य इस विचार-विमर्श और असमर्थता को स्पष्ट रखता है।
- source_word: διὰ τὸν λαόν
  choice: लोगों के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण बताता है। λαός व्यापक जनसमुदाय को सूचित करता है, इसलिए ‘लोग’ ‘भीड़’ से अधिक उपयुक्त है।
- source_word: πάντες
  choice: सभी लोग
  rationale: सन्दर्भ में यह सामान्य जनसमुदाय के सब लोगों की ओर संकेत करता है; संज्ञा जोड़ने से हिन्दी में सन्दर्भ स्पष्ट और स्वाभाविक होता है।
- source_word: ἐδόξαζον τὸν θεόν
  choice: परमेश्वर की महिमा कर रहे थे
  rationale: ‘महिमा करना’ δοξάζω के परमेश्वर को आदर और गौरव देने वाले अर्थ को सुरक्षित रखता है; ‘कर रहे थे’ यूनानी अपूर्ण काल की जारी क्रिया व्यक्त करता है।
- source_word: ἐπὶ τῷ γεγονότι
  choice: जो कुछ हुआ था उसके लिए
  rationale: यह पूर्ण हो चुकी घटना को परमेश्वर की महिमा करने के आधार या कारण के रूप में प्रस्तुत करता है।
