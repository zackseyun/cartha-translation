id: ACT.4.18
reference: Acts 4:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ καλέσαντες αὐτοὺς παρήγγειλαν ⸀τὸ καθόλου μὴ φθέγγεσθαι μηδὲ διδάσκειν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/018.yaml
  text: And after calling them in[a], they ordered them not to speak at all nor teach in the name of Jesus.
translation:
  language: hi
  text: फिर उन्होंने उन्हें बुलाकर आदेश दिया कि वे यीशु के नाम से बिल्कुल न बोलें[a] और न शिक्षा दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यीशु के नाम से कुछ भी न कहें और न शिक्षा दें।’
    reason: φθέγγεσθαι और τὸ καθόλου के संयुक्त बल को ‘बिल्कुल न बोलें’ अथवा ‘कुछ भी न कहें’ के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: καλέσαντες
  choice: उन्हें बुलाकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले की कार्रवाई बताता है। ‘बुलाकर’ हिन्दी में इस कालक्रम को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: παρήγγειλαν
  choice: आदेश दिया
  rationale: यह क्रिया अधिकारपूर्वक दिए गए निर्देश को दर्शाती है; ‘आदेश दिया’ आधुनिक हिन्दी में उसका बल स्पष्ट रखता है।
- source_word: τὸ καθόλου
  choice: बिल्कुल
  rationale: यह निषेध की पूर्णता और प्रबलता पर जोर देता है। ‘बिल्कुल न’ हिन्दी में इस व्यापक निषेध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μὴ φθέγγεσθαι
  choice: न बोलें
  rationale: φθέγγομαι बोलने या मुख से कुछ कहने का अर्थ देता है। ‘न बोलें’ सामान्य, स्पष्ट और प्रसंगानुकूल है।
- source_word: μηδὲ διδάσκειν
  choice: और न शिक्षा दें
  rationale: μηδέ पहली निषिद्ध क्रिया के साथ दूसरी निषिद्ध क्रिया जोड़ता है। ‘और न’ हिन्दी में दोनों पर समान रूप से लागू निषेध को स्पष्ट करता है।
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: यीशु के नाम से
  rationale: यह पदबंध यीशु के नाम के संदर्भ में और उनके नाम के अधिकार के आधार पर बोलने या सिखाने का भाव रख सकता है। ‘नाम से’ हिन्दी में इस संबंध और अधिकार दोनों की गुंजाइश बनाए रखता है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: व्यक्तिवाचक नाम का प्रचलित मानक हिन्दी रूप।
theological_decisions:
- issue: यीशु से संबंधित गवाही पर लगाए गए निषेध का विस्तार
  choice: यीशु के नाम से बोलने और शिक्षा देने—दोनों पर व्यापक निषेध
  alternative: केवल सार्वजनिक प्रचार पर निषेध
  rationale: τὸ καθόλου के साथ μὴ φθέγγεσθαι μηδὲ διδάσκειν एक प्रबल और व्यापक रोक व्यक्त करता है। अनुवाद इसे केवल सार्वजनिक प्रचार तक सीमित नहीं करता।
- issue: ‘यीशु के नाम’ के साथ संबंध
  choice: ‘यीशु के नाम से’
  alternative: ‘यीशु के नाम के विषय में’ या ‘यीशु के नाम के आधार पर’
  rationale: ἐπὶ τῷ ὀνόματι संदर्भ और अधिकार—दोनों अर्थछायाएँ रख सकता है। ‘नाम से’ किसी एक अर्थ को अनावश्यक रूप से अंतिम नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘आदेश दिया’ अधिकारपूर्ण स्वर बनाए रखता है, जबकि ‘बिल्कुल न बोलें’ निषेध की प्रबलता को सामान्य पाठक के लिए सहज रूप में व्यक्त करता है।
