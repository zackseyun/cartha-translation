source:
  edition: SBLGNT
  text: συνήχθησαν γὰρ ἐπ’ ἀληθείας ⸂ἐν τῇ πόλει ταύτῃ⸃ ἐπὶ τὸν ἅγιον παῖδά σου Ἰησοῦν, ὃν ἔχρισας, Ἡρῴδης τε καὶ Πόντιος Πιλᾶτος σὺν ἔθνεσιν καὶ λαοῖς Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/027.yaml
  text: For truly in this city Herod and Pontius Pilate[a], together with the Gentiles and the peoples of Israel, were gathered against your holy servant Jesus, whom you anointed[b],
translation:
  language: hi
  text: क्योंकि सचमुच इसी नगर में हेरोदेस और पोंतियुस पीलातुस, गैर-यहूदियों और इस्राएल के लोगों[b] के साथ, आपके पवित्र सेवक[a] यीशु के विरुद्ध इकट्ठे हुए, जिसका आपने अभिषेक किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपका पवित्र बालक यीशु।” यूनानी शब्द παῖς का अर्थ “सेवक” या “बालक” हो सकता है; यहाँ यशायाह के ‘सेवक’ की भाषा की संभावित प्रतिध्वनि के कारण “सेवक” को मुख्य पाठ में रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “जातियाँ और इस्राएल के जनसमूह।” यूनानी में “जातियाँ/गैर-यहूदी” और इस्राएल के “लोग/जनसमूह” (बहुवचन) हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν
  choice: इकट्ठे हुए
  rationale: यह पूर्ण हो चुके सामूहिक जुटाव को स्वाभाविक हिन्दी में व्यक्त करता है। यूनानी रूप कर्मवाच्य है; हिन्दी में ‘इकट्ठे हुए’ अनावश्यक रूप से कर्ता या प्रेरक निश्चित किए बिना उसी भाव को सहजता से रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले पदों में उद्धृत वचन और वर्तमान व्याख्या के बीच कारणसूचक संबंध दिखाता है।
- source_word: ἐπ’ ἀληθείας
  choice: सचमुच
  rationale: यह यूनानी क्रियाविशेषणीय पदबंध की पुष्टि और बल को आधुनिक, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: इसी नगर में
  rationale: ‘इसी’ निकट-संदर्भ और बल दोनों व्यक्त करता है; प्रसंग से नगर यरूशलेम है, इसलिए नाम जोड़ना आवश्यक नहीं।
- source_word: ἐπὶ τὸν
  choice: के विरुद्ध
  rationale: विरोधी उद्देश्य से इकट्ठा होने के संदर्भ में ἐπί और कर्मकारक का प्रतिकूल अर्थ है।
- source_word: ἅγιον
  choice: पवित्र
  rationale: यह परमेश्वर के लिए अलग किए जाने और पवित्रता, दोनों अर्थ-संकेतों को बनाए रखता है।
- source_word: παῖδά σου
  choice: आपके पवित्र सेवक
  rationale: παῖς का अर्थ सेवक या बालक हो सकता है। यहाँ यशायाह के सेवक-विषयक कथनों की संभावित प्रतिध्वनि और प्रेरितों के काम में समान प्रयोग के कारण ‘सेवक’ संदर्भानुकूल है; अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: ὃν ἔχρισας
  choice: जिसका आपने अभिषेक किया था
  rationale: यह χρίω का सीधा अर्थ और मसीही नियुक्ति का संकेत सुरक्षित रखता है, बिना वहाँ ‘मसीह’ उपाधि जोड़ने के जहाँ मूल में संज्ञा नहीं है।
- source_word: ἔθνεσιν
  choice: गैर-यहूदियों
  rationale: इस्राएल के लोगों के साथ विरोधी समानांतरता में यह जातीय-धार्मिक भेद को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: λαοῖς Ἰσραήλ
  choice: इस्राएल के लोगों
  rationale: यह हिन्दी में स्वाभाविक सामूहिक अभिव्यक्ति है; मूल यूनानी में ‘लोग/जनसमूह’ बहुवचन है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: यीशु के लिए παῖς का अनुवाद
  choice: सेवक
  alternative: बालक; पुत्र
  rationale: इस प्रार्थना में यशायाह के सेवक की भाषा की प्रतिध्वनि और प्रेरितों के काम 3:13, 3:26; 4:30 के प्रयोग ‘सेवक’ को अधिक संभावित बनाते हैं। ‘पुत्र’ सही मसीही सत्य हो सकता है, पर इस पद के यूनानी शब्द का अनावश्यक धर्मवैज्ञानिक विस्तार होगा।
- issue: ἔθνεσιν का इस्राएल के साथ संबंध
  choice: गैर-यहूदी
  alternative: जातियाँ/राष्ट्र
  rationale: ‘इस्राएल के लोगों’ के साथ इसका संयोजन यहाँ राजनीतिक राष्ट्रों से अधिक गैर-यहूदी समुदायों की ओर संकेत करता है; फिर भी शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- issue: विरोधी समूहों के एकत्र होने में दैवी या मानवीय प्रेरक
  choice: प्रेरक को अनिर्दिष्ट रखा गया
  alternative: परमेश्वर ने उन्हें इकट्ठा किया; वे स्वयं एकत्र हुए
  rationale: यूनानी कर्मवाच्य केवल उनके इकट्ठा किए जाने/होने को बताता है और इस पद में प्रेरक स्पष्ट नहीं करता। हिन्दी ‘इकट्ठे हुए’ इस तनाव को बिना समयपूर्व समाधान के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थना के आदरपूर्ण संबोधन के लिए ‘आपके/आपने’ रखा गया है। वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। नामों के प्रचलित हिन्दी बाइबलीय रूप ‘हेरोदेस’ और ‘पोंतियुस पीलातुस’ अपनाए गए हैं। पादटिप्पणी-चिह्न अर्थ-संबंधित शब्दों के ठीक बाद रखे गए हैं।
