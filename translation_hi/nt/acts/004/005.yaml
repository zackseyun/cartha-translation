  text: Ἐγένετο δὲ ἐπὶ τὴν αὔριον συναχθῆναι αὐτῶν τοὺς ἄρχοντας καὶ ⸀τοὺς πρεσβυτέρους καὶ ⸁τοὺς γραμματεῖς ⸀ἐν Ἰερουσαλήμ
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/005.yaml
  text: And it happened that on the next day their rulers and elders and scribes were gathered together in Jerusalem,[a]
translation:
  language: hi
  text: अगले दिन ऐसा हुआ कि उनके शासक, बुज़ुर्ग और शास्त्री यरूशलेम में एकत्र हुए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इकट्ठे हुए’ या ‘एक साथ आए।’ यूनानी क्रिया कर्मवाच्य रूप में है।
    reason: यूनानी कर्मवाच्य रूप की सूचना देते हुए ऐसे हिन्दी विकल्प दिए गए हैं जो अनकहे बाहरी कर्ता का संकेत नहीं जोड़ते।
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ऐसा हुआ कि
  rationale: यह कथात्मक सूत्र वृत्तांत को आगे बढ़ाता है। ‘ऐसा हुआ कि’ उसके कथात्मक भाव को स्वाभाविक, अनार्किक हिन्दी में बनाए रखता है।
- source_word: ἐπὶ τὴν αὔριον
  choice: अगले दिन
  rationale: यह मुहावरा अगले या बाद के दिन को सूचित करता है; हिन्दी में ‘अगले दिन’ संक्षिप्त और स्वाभाविक है।
- source_word: συναχθῆναι
  choice: एकत्र हुए
  rationale: सन्दर्भ में यह नेतृत्व-समूह के एक जगह जुटने की घटना बताता है। यूनानी रूप कर्मवाच्य है, पर हिन्दी में ‘एकत्र किए गए’ किसी अनकहे बाहरी कर्ता का अधिक प्रबल संकेत दे सकता है; इसलिए स्वाभाविक मुख्य पाठ के साथ रूपगत विकल्प पादटिप्पणी में दिया गया है।
- source_word: αὐτῶν
  choice: उनके
  rationale: यह यूनानी सम्बन्धवाचक सर्वनाम को सुरक्षित रखता है और इस पद में उसके पूर्वपद को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: τοὺς ἄρχοντας
  choice: शासक
  rationale: यहाँ शब्द यहूदी समाज के शासन-अधिकार रखने वाले नेतृत्व के लिए है; ‘शासक’ उसके अधिकार-सूचक अर्थ को बनाए रखता है।
- source_word: τοὺς πρεσβυτέρους
  choice: पुरनिये
  rationale: यह केवल अधिक आयु के पुरुषों के बजाय मान्य सामुदायिक पदाधिकारियों को दर्शाता है। ‘पुरनिये’ हिन्दी बाइबलीय प्रयोग में इस संस्थागत अर्थ को संक्षेप में व्यक्त करता है।
- source_word: τοὺς γραμματεῖς
  choice: शास्त्री
  rationale: यह मान्य लेखकीय और व्यवस्था-विशेषज्ञ वर्ग का पारम्परिक, संक्षिप्त नाम है; ‘व्यवस्था के शिक्षक’ उनकी भूमिका को अधिक व्याख्यायित करता।
- source_word: ἐν Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: यह स्थानवाचक वाक्यांश का सीधा और स्वाभाविक अनुवाद है।
theological_decisions:
- issue: αὐτῶν का पूर्वपद
  choice: ‘उनके’ रखकर सम्बन्ध को सुरक्षित रखा गया, पर पूर्वपद को पद के भीतर निश्चित नहीं किया गया।
  alternative: ‘यहूदियों के शासक’ कहना या सर्वनाम को छोड़ देना।
  rationale: यूनानी पाठ में सर्वनाम स्पष्ट है, जबकि उसका पूर्वपद सन्दर्भ से ग्रहण किया जाता है। अधिक विशिष्ट पहचान जोड़ना अस्पष्टता को अनुचित रूप से सुलझा देता।
- issue: συναχθῆναι का कर्मवाच्य रूप
  choice: मुख्य पाठ में स्वाभाविक हिन्दी ‘एकत्र हुए’ और पादटिप्पणी में शाब्दिक कर्मवाच्य विकल्प।
  alternative: मुख्य पाठ में ‘इकट्ठे किए गए’।
  rationale: यूनानी का कर्मवाच्य रूप उल्लेखनीय है, पर हिन्दी कर्मवाच्य अनिवार्य रूप से किसी बाहरी कर्ता का अधिक स्पष्ट आभास दे सकता है। पादटिप्पणी रूपगत तथ्य को बिना अनचाहा धार्मिक कर्तृत्व आरोपित किए सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पुरनिये’ और ‘शास्त्री’ संस्थागत पदनाम हैं; शेष वाक्य-विन्यास सामान्य आधुनिक हिन्दी के अनुरूप है।
