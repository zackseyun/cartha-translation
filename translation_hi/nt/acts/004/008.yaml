  text: τότε Πέτρος πλησθεὶς πνεύματος ἁγίου εἶπεν πρὸς αὐτούς· Ἄρχοντες τοῦ λαοῦ καὶ ⸀πρεσβύτεροι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/008.yaml
  text: Then Peter, filled with the Holy Spirit, said to them, “Rulers of the people and elders,”
translation:
  language: hi
  text: तब पतरस ने पवित्र आत्मा से भरकर उनसे कहा, “हे लोगों के शासकों और बुज़ुर्गों,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह अगले घटनाक्रम को आरम्भ करने वाला कालसूचक संकेत है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: Πέτρος
  choice: पतरस
  rationale: हिन्दी बाइबल परंपरा में इस नाम का प्रचलित रूप ‘पतरस’ है।
- source_word: πλησθεὶς
  choice: भरकर
  rationale: अओरिस्ट कर्मवाच्य कृदंत का स्वाभाविक हिन्दी रूप; प्रसंग और ‘से’ की रचना से यह स्पष्ट रहता है कि पतरस पवित्र आत्मा से परिपूर्ण हुआ।
- source_word: πνεύματος ἁγίου
  choice: पवित्र आत्मा से
  rationale: πίμπλημι के साथ संबंध को हिन्दी में ‘से भरकर’ स्वाभाविक रूप से व्यक्त किया जाता है; यह प्रेरितों के काम में परमेश्वर के पवित्र आत्मा को सूचित करता है।
- source_word: εἶπεν πρὸς αὐτούς
  choice: उनसे कहा
  rationale: सीधा और स्वाभाविक कथात्मक वाक्यांश।
- source_word: Ἄρχοντες
  choice: शासको
  rationale: सम्बोधन बहुवचन में यह शासन और न्यायिक अधिकार रखने वालों को दर्शाता है; ‘शासक’ उस आधिकारिक अर्थ को बनाए रखता है।
- source_word: τοῦ λαοῦ
  choice: लोगों के
  rationale: यह जनसमुदाय, इस प्रसंग में इस्राएल की प्रजा, से उनके संबंध को सीधे व्यक्त करता है।
- source_word: πρεσβύτεροι
  choice: पुरनियो
  rationale: यह केवल अधिक आयु वाले पुरुषों के बजाय मान्यताप्राप्त सामुदायिक पदाधिकारियों के लिए प्रचलित बाइबलीय सम्बोधन है।
theological_decisions:
- issue: πνεύματος ἁγίου का अभिप्राय
  choice: पवित्र आत्मा
  alternative: पवित्र आत्मा/एक पवित्र आत्मिक प्रभाव को सामान्य संज्ञा के रूप में पढ़ना
  rationale: प्रेरितों के काम के निकटवर्ती और व्यापक प्रसंग में यह साक्षी और वाणी के लिए सामर्थ्य देने वाले परमेश्वर के पवित्र आत्मा को सूचित करता है; हिन्दी में नामवत् प्रयोग इसी संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक सम्बोधन के अनुकूल है। ‘हे’ यूनानी में अलग शब्द का अनुवाद नहीं, बल्कि हिन्दी में सम्बोधन को स्वाभाविक और स्पष्ट बनाने वाला व्याकरणिक संकेत है। पद मूल वाक्य की तरह अधूरे सम्बोधन पर समाप्त होता है, क्योंकि आगे का कथन अगले पद में जारी है।
