  text: καὶ ⸂δυνάμει μεγάλῃ⸃ ἀπεδίδουν τὸ μαρτύριον οἱ ἀπόστολοι ⸂τῆς ἀναστάσεως τοῦ κυρίου Ἰησοῦ⸃, χάρις τε μεγάλη ἦν ἐπὶ πάντας αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/033.yaml
  text: And with great power the apostles were giving their testimony about the resurrection of the Lord Jesus[a], and great favor was upon them all.
translation:
  language: hi
  text: और प्रेरित बड़ी सामर्थ्य के साथ प्रभु यीशु के जी उठने के विषय में अपनी गवाही देते रहे, और उन सब पर बड़ा अनुग्रह[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन सब पर बड़ी कृपादृष्टि थी।” यूनानी शब्द χάρις का अर्थ “अनुग्रह” या “कृपादृष्टि/अनुकूल भाव” हो सकता है; यहाँ परमेश्वर की अनुग्रहपूर्ण उपस्थिति और विश्वासियों के प्रति लोगों के अनुकूल भाव—दोनों का संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμει μεγάλῃ
  choice: बड़ी सामर्थ्य के साथ
  rationale: करणवाचक भाव और लूका-प्रेरितों में δύναμις के प्रभावशाली, परमेश्वर-प्रदत्त सामर्थ्य के अर्थ को स्वाभाविक हिन्दी में रखता है, पर चमत्कारों को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: ἀπεδίδουν
  choice: देते रहे
  rationale: अपूर्ण भूतकाल की निरंतर या बार-बार होने वाली क्रिया को व्यक्त करता है।
- source_word: τὸ μαρτύριον
  choice: अपनी गवाही
  rationale: गवाही देने की स्वाभाविक हिन्दी अभिव्यक्ति है; 'अपनी' यूनानी कर्ता प्रेरितों से निहित संबंध को स्पष्ट करता है।
- source_word: τῆς ἀναστάσεως
  choice: जी उठने के विषय में
  rationale: संबंधकारक को गवाही की विषयवस्तु के रूप में समझते हुए आधुनिक पाठक के लिए स्पष्ट और सहज रूप देता है।
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: प्रभु यीशु के
  rationale: κύριος को परंपरागत और अर्थ-सटीक 'प्रभु' से प्रस्तुत करता है और पुनरुत्थान को यीशु से स्पष्ट रूप से जोड़ता है।
- source_word: χάρις μεγάλη
  choice: बड़ा अनुग्रह
  rationale: χάρις के ईश्वरीय अनुग्रह और अनुकूल कृपादृष्टि—दोनों संभावित अर्थों के लिए हिन्दी में पर्याप्त अर्थ-विस्तार रखता है।
- source_word: ἐπὶ πάντας αὐτούς
  choice: उन सब पर
  rationale: पूरे समुदाय पर किसी चीज़ के रहने या छाए होने की यूनानी छवि तथा सर्वसमावेशी बल को सुरक्षित रखता है।
theological_decisions:
- issue: इस प्रसंग में χάρις का अर्थ और स्रोत
  choice: अनुग्रह, जिसका स्रोत या स्वरूप मुख्य पाठ में सीमित नहीं किया गया
  alternative: लोगों की ओर से बड़ा अनुकूल भाव / केवल परमेश्वर का उद्धारकारी अनुग्रह
  rationale: यूनानी पाठ यह स्पष्ट नहीं करता कि χάρις विशेष रूप से परमेश्वर की कृपा है, लोगों की अनुकूल दृष्टि है, या दोनों का समावेश करता है। 'अनुग्रह' और पाद-टिप्पणी इस अर्थगत तनाव को बनाए रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। 'जी उठने' को सामान्य पाठकों की स्पष्टता के लिए चुना गया है, जबकि 'सामर्थ्य', 'प्रभु' और 'अनुग्रह' बाइबलीय गरिमा बनाए रखते हैं।
