id: ACT.4.24
reference: Acts 4:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες ὁμοθυμαδὸν ἦραν φωνὴν πρὸς τὸν θεὸν καὶ εἶπαν· Δέσποτα, ⸀σὺ ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/024.yaml
  text: When they heard this[a], they lifted their voices together to God and said, “Master, you are the one who made heaven and earth and sea[b], and everything in them,”
translation:
  language: hi
  text: यह सुनकर उन्होंने एक मन होकर परमेश्वर की ओर अपनी आवाज़ उठाई और कहा, “हे स्वामी[a], आप ही ने आकाश, पृथ्वी, समुद्र और जो कुछ उनमें है, सब बनाया है,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे सर्वाधिपति।” यूनानी शब्द Δέσποτα पूर्ण अधिकार रखने वाले स्वामी की उपाधि है और κύριος (“प्रभु”) से भिन्न है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: यह सुनकर
  rationale: अओरिस्ट कृदंत यहाँ समयसूचक है। प्रसंग से सुनाई गई बात स्पष्ट होने के कारण स्वाभाविक हिन्दी में ‘यह’ जोड़ा गया है।
- source_word: ὁμοθυμαδόν
  choice: एक मन होकर
  rationale: यह समूह की साझा सहमति और एकता को व्यक्त करता है; प्रार्थना के प्रसंग में यह आधुनिक हिन्दी का स्वाभाविक और गरिमापूर्ण प्रयोग है।
- source_word: ἦραν φωνὴν πρὸς τὸν θεόν
  choice: परमेश्वर से ऊँचे स्वर में कहने लगे
  rationale: यूनानी मुहावरे का आशय परमेश्वर को संबोधित करते हुए सामूहिक रूप से आवाज़ उठाना है। हिन्दी में यह रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Δέσποτα
  choice: हे स्वामी
  rationale: δεσπότης स्वामी या मालिक के पूर्ण अधिकार पर बल देता है और κύριος से अलग पद है। ‘स्वामी’ इस भेद को बनाए रखता है।
- source_word: σὺ ὁ ποιήσας
  choice: आप ही ने ... बनाया है
  rationale: सर्वनाम और साभिधान कृदंत परमेश्वर को सृष्टिकर्ता के रूप में बलपूर्वक पहचानते हैं; ‘आप ही ने’ उस बल को सहज हिन्दी में सुरक्षित रखता है।
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν
  choice: आकाश, पृथ्वी, समुद्र
  rationale: यह प्रचलित सृष्टि-सूत्र है और यूनानी के तीनों एकवचन संज्ञापदों को स्पष्ट रूप से रखता है।
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: जो कुछ उनमें है, सब
  rationale: यह तीनों क्षेत्रों में विद्यमान समस्त सृष्टि को समावेशी और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के लिए Δέσποτα उपाधि का अनुवाद
  choice: हे स्वामी
  alternative: हे सर्वाधिपति
  rationale: ‘स्वामी’ मूल पद के मालिकाना और पूर्ण अधिकार के भाव को सीधे व्यक्त करता तथा इसे κύριος (‘प्रभु’) से अलग रखता है। ‘सर्वाधिपति’ अधिकार के भाव को अधिक स्पष्ट करता है, पर मूल से अधिक व्याख्यात्मक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सामूहिक प्रार्थना का गरिमापूर्ण किंतु सहज स्वर रखा गया है। ‘एक मन होकर’ समूह की एकता और ‘ऊँचे स्वर में’ सामूहिक रूप से आवाज़ उठाने का भाव व्यक्त करते हैं।
