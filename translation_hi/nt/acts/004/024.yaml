revisions:
- from: यह सुनकर वे सब एक मन होकर परमेश्वर से ऊँचे स्वर में कहने लगे, “हे स्वामी[a], आप ही ने आकाश, पृथ्वी, समुद्र और जो कुछ उनमें है, सब बनाया है।”
  to: यह सुनकर उन्होंने एक मन होकर परमेश्वर की ओर अपनी आवाज़ उठाई और कहा, “हे स्वामी[a], आप ही ने आकाश, पृथ्वी, समुद्र और जो कुछ उनमें है, सब बनाया है,”
  rationale: The revision removes the unsupported ‘began to speak’ nuance, renders the prayer’s direction to God more accurately, and retains the source image of collectively raising a voice. It preserves the draft’s faithful rendering of Δέσποτα, the emphatic ‘आप ही ने,’ and the inclusive creation formula. The concluding comma reflects that the Greek sentence continues into the following verse.
