reference: Acts 4:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία, ⸀οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ⸂ὑπὸ τὸν οὐρανὸν⸃ τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/012.yaml
  text: And there is salvation in no one else[a], for there is no other name under heaven given among men by which we must be saved.
translation:
  language: hi
  text: और किसी और में उद्धार नहीं है, क्योंकि स्वर्ग के नीचे मनुष्यों के बीच ऐसा कोई दूसरा नाम नहीं दिया गया है[a], जिसके द्वारा हमारा उद्धार होना आवश्यक है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानवजाति में दिया गया है।” यूनानी शब्द यहाँ सामान्य अर्थ में समस्त मानवजाति के लिए प्रयुक्त है।
    reason: ἐν ἀνθρώποις के ‘मनुष्यों के बीच’ अर्थ को बनाए रखते हुए उसके सामान्य, समावेशी मानवजाति-संदर्भ को स्पष्ट करता है; ‘मनुष्यों को’ जैसे कम संभावित संबंध को विकल्प के रूप में नहीं रखता।
lexical_decisions:
- source_word: σωτηρία
  choice: उद्धार
  rationale: यहाँ शब्द यीशु के द्वारा मिलने वाले बचाव को उसके व्यापक धार्मिक अर्थ सहित व्यक्त करता है; ‘उद्धार’ प्रेरितों के काम के इस प्रसंग में स्वाभाविक और सटीक है।
- source_word: ἐν ἄλλῳ οὐδενί
  choice: किसी अन्य में नहीं
  rationale: यह अनुवाद यूनानी पूर्वसर्ग ἐν को बनाए रखता है और इस बात पर बल देता है कि उद्धार किसी अन्य व्यक्ति में नहीं है; इसे केवल ‘किसी अन्य के द्वारा नहीं’ कहकर साधन तक सीमित नहीं किया गया।
- source_word: ὄνομα
  choice: नाम
  rationale: ‘नाम’ को ‘व्यक्ति’ या ‘अधिकार’ कहकर स्पष्ट नहीं किया गया, ताकि मूल में निहित व्यक्ति, अधिकार और प्रकट पहचान के अर्थ खुले रहें।
- source_word: ἕτερον
  choice: दूसरा
  rationale: नकारात्मक वाक्य में ‘कोई दूसरा नाम नहीं’ सहज हिन्दी है और मूल की अनन्यता को स्पष्ट रखता है।
- source_word: ὑπὸ τὸν οὐρανόν
  choice: स्वर्ग के नीचे
  rationale: यह बाइबलीय मुहावरा मानव-जगत के सार्वभौमिक दायरे को व्यक्त करता है और मूल की गंभीर शैली बनाए रखता है।
- source_word: δεδομένον ἐν ἀνθρώποις
  choice: मनुष्यों के बीच ... दिया गया
  rationale: ἐν ἀνθρώποις मानव-समुदाय के बीच दिए जाने का भाव रखता है। ‘मनुष्यों’ से सभी मानवों का समावेश स्वाभाविक रूप से स्पष्ट होता है; ‘मनुष्यों को’ संभावित विकल्प के रूप में टिप्पणी में रखा गया है।
- source_word: ἐν ᾧ
  choice: जिसके द्वारा
  rationale: सम्बन्धवाचक सर्वनाम ‘नाम’ की ओर संकेत करता है और यहाँ उद्धार के माध्यम को व्यक्त करता है; हिन्दी में ‘जिसके द्वारा’ स्वाभाविक है।
- source_word: δεῖ
  choice: आवश्यक है
  rationale: यह मूल में व्यक्त अनिवार्यता को बनाए रखता है और उसे केवल संभावना या अनुमति में नहीं बदलता।
- source_word: σωθῆναι ἡμᾶς
  choice: हमारा उद्धार होना
  rationale: कर्मवाच्य अर्थ और प्रथम पुरुष बहुवचन दोनों सुरक्षित हैं तथा σωτηρία के लिए चुने गए ‘उद्धार’ से शब्दगत संगति बनी रहती है।
theological_decisions:
- issue: यीशु के संबंध में उद्धार की अनन्यता
  choice: ‘किसी अन्य में उद्धार नहीं है’
  alternative: ‘उद्धार का कोई और मार्ग नहीं है’
  rationale: मूल पाठ उद्धार के किसी अन्य व्यक्ति में न होने की बात सीधे कहता है। चुना गया रूप इस अनन्य दावे को बिना नरम किए और बिना अतिरिक्त सिद्धान्तगत व्याख्या जोड़े सुरक्षित रखता है।
- issue: ἐν ᾧ और δεῖ का संयुक्त बल
  choice: ‘जिसके द्वारा हमारा उद्धार होना आवश्यक है’
  alternative: ‘जिसमें हम उद्धार पा सकते हैं’
  rationale: वैकल्पिक रूप संभावना का भाव देता, जबकि δεῖ आवश्यकता व्यक्त करता है। चुना गया अनुवाद नाम के माध्यम और उद्धार की आवश्यकता दोनों को बनाए रखता है।
- issue: ἀνθρώποις का समावेशी आशय
  choice: ‘मनुष्यों के बीच’
  alternative: ‘मनुष्यों को’
  rationale: ἀνθρώποις यहाँ किसी एक लिंग तक सीमित नहीं, बल्कि संपूर्ण मानवजाति के लिए प्रयुक्त है। आधुनिक हिन्दी में ‘मनुष्यों’ यही समावेशी अर्थ स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण और घोषणात्मक शैली अपनाई गई है। ‘उद्धार’, ‘स्वर्ग के नीचे’ और ‘नाम’ जैसे बाइबलीय शब्दों को मूल की धार्मिक गहराई और मुहावरे के कारण बनाए रखा गया है।
