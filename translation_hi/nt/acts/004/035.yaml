  yaml_path: translation/nt/acts/004/035.yaml
  text: and they were laying them at the apostles’ feet[b][a], and it was being distributed to each one according as anyone had need.
translation:
  language: hi
  text: और वे उन्हें प्रेरितों के पाँवों के पास[a][b] रखते थे, और हर एक को उसकी आवश्यकता के अनुसार दिया जाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “प्रेरितों के पाँवों के पास”; इसका भाव उनके सामने या उनकी देखरेख में रखना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उन्हें” और दी जाने वाली वस्तु पिछले पद से समझी जाती है—बेची गई संपत्तियों से प्राप्त रकम।
    reason: cross_reference
lexical_decisions:
- source_word: ἐτίθουν
  choice: रख देते थे
  rationale: अपूर्ण भूतकाल निरंतर या बार-बार होने वाली क्रिया दर्शाता है; ‘रख देते थे’ हिंदी में उस प्रचलित क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων
  choice: प्रेरितों के पाँवों के पास
  rationale: यह अनुवाद वास्तविक स्थानगत बिंब को बनाए रखता है और साथ ही वस्तु को प्रेरितों की देखरेख में सौंपने का भाव संदर्भ से उभरने देता है।
- source_word: διεδίδετο
  choice: बाँट दिया जाता था
  rationale: अपूर्ण कर्मवाच्य नियमित रूप से किए जा रहे वितरण को व्यक्त करता है; हिंदी में यह रूप स्वाभाविक है और बाँटने वाले को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: ἑκάστῳ
  choice: हर एक को
  rationale: यह एक-एक व्यक्ति को किए जाने वाले वितरण का भाव स्पष्ट और सहज हिंदी में रखता है।
- source_word: καθότι ἄν τις χρείαν εἶχεν
  choice: जिसमें जितनी आवश्यकता होती थी, उसके अनुसार
  rationale: यह वाक्यांश आवश्यकता के अनुरूप वितरण का आनुपातिक भाव सुरक्षित रखता है और आधुनिक हिंदी में स्वाभाविक है।
- source_word: τις
  choice: जिसमें
  rationale: संबंधवाचक रचना में यह यूनानी अनिश्चित सर्वनाम का सामान्य, गैर-लिंगविशिष्ट भाव व्यक्त करता है।
- source_word: χρείαν
  choice: आवश्यकता
  rationale: ‘आवश्यकता’ χρεία के अर्थ को स्पष्ट, गरिमापूर्ण और सामान्य आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: रखी और बाँटी जाने वाली वस्तु को स्पष्ट करना या न करना
  choice: पहली क्रिया में केवल ‘उसे’ रखा गया है और दूसरी में वस्तु को कर्मवाच्य रचना में निहित रहने दिया गया है।
  alternative: दोनों स्थानों पर ‘बिक्री से मिली धनराशि’ या ‘रुपया’ स्पष्ट रूप से जोड़ना।
  rationale: यूनानी पाठ वस्तु को पिछले पद के संदर्भ से समझने देता है। सर्वनाम और कर्मवाच्य रचना पाठ की अंतर्निहितता बनाए रखते हैं तथा धन या आय जैसी अतिरिक्त विशिष्टता नहीं जोड़ते।
