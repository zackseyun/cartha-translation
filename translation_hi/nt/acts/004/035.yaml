review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the implicit object, the physical image of placing it at the apostles’ feet, and the passive sense of distribution. However, “रख देते थे” can suggest completed, punctual acts more strongly than the Greek imperfect, and “जिसमें जितनी आवश्यकता होती थी” is not idiomatic Hindi for the generic individual sense of τις and can obscure the direct relation between each recipient and that person’s need.
  naturalness: “और जिसमें जितनी आवश्यकता होती थी, उसके अनुसार हर एक को...” is awkward and syntactically unclear in modern standard Hindi. “हर एक को उसकी आवश्यकता के अनुसार दिया जाता था” is clear, natural, and retains the Greek’s unspecified distributed object.
  terminology: “प्रेरितों,” “पाँवों के पास,” and “आवश्यकता” are appropriate in register and meaning. “उन्हें” appropriately leaves the antecedent supplied by the preceding verse, without unnecessarily specifying money or proceeds.
  issues:
  - severity: medium
    issue: The need clause is awkward and imprecise in Hindi.
    rationale: “जिसमें जितनी आवश्यकता होती थी” normally frames need as being ‘in’ someone and does not naturally convey ‘according as anyone had need.’ Recasting it with “हर एक को उसकी आवश्यकता के अनुसार” expresses the distributive correspondence clearly.
  - severity: low
    issue: “रख देते थे” slightly overstates completion.
    rationale: The imperfect ἐτίθουν presents repeated/ongoing placing. “रखते थे” more directly reflects that imperfective portrayal without the completive shade often associated with देना.
  revised_text: और वे उन्हें प्रेरितों के पाँवों के पास[a][b] रखते थे, और हर एक को उसकी आवश्यकता के अनुसार दिया जाता था।
  revised_footnotes:
