  register: आधुनिक मानक हिंदी; सरल किंतु गरिमापूर्ण कथात्मक शैली। दोनों अपूर्ण क्रियाओं के बार-बार या लगातार होने के भाव को ‘रख देते थे’ और ‘बाँट दिया जाता था’ से व्यक्त किया गया है।
