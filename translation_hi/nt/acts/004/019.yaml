source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ Ἰωάννης ἀποκριθέντες ⸂εἶπον πρὸς αὐτούς⸃· Εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ, κρίνατε,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/019.yaml
  text: But Peter and John answered and said to them[a], “If it is right in the sight of God to listen to you rather than to God, judge for yourselves.”
translation:
  language: hi
  text: परन्तु पतरस और यूहन्ना ने उन्हें उत्तर दिया, “आप ही निर्णय कीजिए कि परमेश्वर की दृष्टि में परमेश्वर की अपेक्षा आपकी बात सुनना उचित है या नहीं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ Πέτρος καὶ Ἰωάννης
  choice: परन्तु पतरस और यूहन्ना
  rationale: δέ यहाँ अधिकारियों के आदेश के प्रत्युत्तर में हल्का विरोध दर्शाता है; ‘परन्तु’ इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀποκριθέντες εἶπον πρὸς αὐτούς
  choice: ने उन्हें उत्तर दिया
  rationale: शाब्दिक ‘उत्तर देकर उनसे कहा’ हिन्दी में अनावश्यक पुनरुक्ति लगेगी। यह सामी प्रभाव वाली यूनानी अभिव्यक्ति का स्वाभाविक हिन्दी रूप है और उत्तर देने की क्रिया को पूरा बनाए रखता है।
- source_word: δίκαιόν
  choice: उचित
  rationale: सन्दर्भ में यह परमेश्वर के सामने नैतिक रूप से सही और न्यायसंगत होने का बोध देता है; आधुनिक हिन्दी में ‘उचित’ प्रत्यक्ष प्रश्न में स्वाभाविक है।
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर की दृष्टि में
  rationale: यह परमेश्वर के मूल्यांकन और न्याय के सामने उचित ठहरने का भाव सुरक्षित रखता है।
- source_word: ἀκούειν
  choice: सुनना
  rationale: मूल क्रिया का सीधा अर्थ ‘सुनना/ध्यान देना’ है। प्रसंग में अधिकार मानने का भाव निहित है, पर मुख्य पाठ में ‘आज्ञा मानना’ रखने से अनुवाद मूल से अधिक स्पष्टार्थक हो जाता।
- source_word: μᾶλλον ἢ
  choice: की अपेक्षा
  rationale: दो व्यक्तियों की बात सुनने या मानने के बीच प्राथमिकता का तुलनात्मक विरोध हिन्दी में संक्षेप और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: κρίνατε
  choice: आप ही निर्णय कीजिए
  rationale: आज्ञार्थक चुनौती को बनाए रखते हुए ‘ही’ श्रोताओं को स्वयं मूल्यांकन करने पर दिए गए बल को स्वाभाविक हिन्दी में प्रकट करता है।
theological_decisions:
- issue: ἀκούειν को ‘सुनना’ अनूदित किया जाए या प्रसंगानुसार ‘आज्ञा मानना’
  choice: मुख्य पाठ में ‘परमेश्वर की अपेक्षा आपकी सुनना’
  alternative: ‘परमेश्वर की अपेक्षा आपकी आज्ञा मानना’
  rationale: प्रसंग आज्ञापालन का है, फिर भी यूनानी पाठ अधिक स्पष्ट आज्ञापालन-सूचक क्रिया के बजाय ἀκούω का प्रयोग करता है। ‘सुनना’ मूल रूपक और यह तनाव सुरक्षित रखता है; निहित अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। सम्बोधित अधिकारी बहुवचन हैं, इसलिए ‘आप/आपकी’ रखा गया है। प्रश्न की यूनानी संरचना और ‘स्वयं निर्णय करो’ वाली चुनौती को हिन्दी में स्पष्ट करने के लिए वाक्य-विन्यास को स्वाभाविक रूप से पुनर्गठित किया गया है।
