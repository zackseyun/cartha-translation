source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃ διὰ ⸂πνεύματος ἁγίου⸃ στόματος Δαυὶδ παιδός σου εἰπών· Ἱνατί ἐφρύαξαν ἔθνη καὶ λαοὶ ἐμελέτησαν κενά;
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/025.yaml
  text: 'who[a], through the Holy Spirit, by the mouth of David your servant, said: ‘Why did the nations rage[b], and the peoples devise vain things?’'
translation:
  language: hi
  text: 'जिसने[a] पवित्र आत्मा के द्वारा तेरे सेवक दाऊद के मुख से कहा:


    “राष्ट्र क्यों भड़क उठे[b],


    और लोगों ने व्यर्थ की योजनाएँ क्यों बनाईं?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ पांडुलिपियों में “हमारे पिता दाऊद, तेरे सेवक” आया है; तब आरंभ इस प्रकार होगा: “जिसने पवित्र आत्मा के द्वारा हमारे पिता दाऊद, जो तेरे सेवक हैं, के मुख से कहा।”'
    reason: textual_variant
  - marker: b
    text: या “उग्र हो उठे।” यूनानी क्रिया उद्दंडता से उफनने या अशांत हो उठने का भाव देती है। अगले वाक्यांश का अनुवाद “व्यर्थ बातों का मनन किया” या संदर्भानुसार “व्यर्थ षड्यंत्र रचे” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ⸂τοῦ πατρὸς ἡμῶν⸃
  choice: जिसने
  rationale: यह पिछले पद में संबोधित परमेश्वर से संबंध जोड़ता है। विवादित ‘हमारे पिता’ पदबंध को मुख्य पाठ में असहज रूप से जोड़ने के बजाय पाठांतर-सूचना में रखा गया है।
- source_word: διὰ πνεύματος ἁγίου
  choice: पवित्र आत्मा के द्वारा
  rationale: διά के साथ संबंधकारक यहाँ माध्यम अथवा कर्तृत्व सूचित करता है; यह अनुवाद आत्मा की स्पष्ट भूमिका बनाए रखता है।
- source_word: στόματος Δαυὶδ παιδός σου
  choice: अपने सेवक दाऊद के मुख से
  rationale: ‘मुख से’ भविष्यद्वाणी के वचन कहे जाने का बाइबलीय मुहावरा सुरक्षित रखता है; παῖς के लिए दाऊद के संदर्भ में ‘सेवक’ सर्वाधिक उपयुक्त है।
- source_word: ἐφρύαξαν
  choice: क्रोध में उथल-पुथल मचाई
  rationale: यह क्रियापद उद्दंड और अशांत उत्तेजना व्यक्त करता है। हिंदी में यह पदबंध उस प्रचंड विरोध को स्वाभाविक ढंग से बताता है।
- source_word: ἔθνη
  choice: राष्ट्रों
  rationale: भजन के संदर्भ में यह व्यापक रूप से राष्ट्रों को दर्शाता है, केवल गैर-यहूदियों की धार्मिक-सामाजिक श्रेणी को नहीं।
- source_word: λαοὶ
  choice: जन-जन
  rationale: ग्रीक बहुवचन और काव्यात्मक समानांतरता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐμελέτησαν
  choice: सोचीं
  rationale: इसका मूल अर्थ मनन करना या मन में विचारना है; विरोधी संदर्भ में इसमें योजना बनाने का भाव भी हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: κενά
  choice: व्यर्थ बातें
  rationale: κενά की रिक्तता और निष्फलता दोनों को सहज आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: उद्धरण-परिचय का पाठांतर
  choice: मुख्य पाठ में ‘हमारे पिता’ को शामिल न करके परमेश्वर से संबंध जोड़ने वाला ‘जिसने’ रखा गया है।
  alternative: कुछ पांडुलिपियों के अनुसार ‘हमारे पिता दाऊद, अपने सेवक, के मुख से’ या ‘हमारे पिता, अपने सेवक दाऊद, के मुख से’।
  rationale: इस पदबंध का पाठ संदिग्ध और वाक्य-विन्यास कठिन है। मुख्य पाठ को पठनीय रखते हुए वास्तविक पाठांतर को पादटिप्पणी में स्पष्ट किया गया है।
- issue: ἐμελέτησαν का अर्थ
  choice: सोचीं
  alternative: षड्यंत्र रचा या योजना बनाई
  rationale: क्रिया ‘मनन करना/सोचना’ और संदर्भानुसार ‘योजना बनाना’ दोनों अर्थ दे सकती है; मुख्य पाठ मूल शब्द की व्यापकता रखता है और संदर्भगत विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मुख से’ बाइबलीय उद्धरण-शैली को बनाए रखता है, जबकि काव्यात्मक प्रश्नों में मूल समानांतरता सुरक्षित है।
