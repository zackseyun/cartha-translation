  text: ἐτῶν γὰρ ἦν πλειόνων τεσσεράκοντα ὁ ἄνθρωπος ἐφ’ ὃν ⸀γεγόνει τὸ σημεῖον τοῦτο τῆς ἰάσεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/022.yaml
  text: For the man on whom this sign of healing had happened was more than forty years old[a].
translation:
  language: hi
  text: क्योंकि जिस मनुष्य के साथ चंगाई का यह चिन्ह घटित हुआ था, वह चालीस वर्ष से अधिक आयु का था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चंगाई का यह चिन्ह’ अथवा ‘चंगाई का यह चमत्कार।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτῶν ... πλειόνων τεσσεράκοντα
  choice: चालीस वर्ष से अधिक आयु का
  rationale: तुलनात्मक πλειόνων के साथ यह यूनानी रचना आयु बताती है। यह हिंदी में सटीक, स्वाभाविक और गरिमापूर्ण अभिव्यक्ति है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण या व्याख्यात्मक आधार देता है; ‘क्योंकि’ हिंदी में इस संबंध को स्पष्ट करता है।
- source_word: ὁ ἄνθρωπος
  choice: जिस मनुष्य ... वह
  rationale: यह पहले से पहचाने गए पुरुष को सूचित करता है। ‘मनुष्य’ मूल शब्द के निकट रहते हुए वर्तमान वाक्य में स्वाभाविक है।
- source_word: ἐφ’ ὃν
  choice: जिस मनुष्य पर
  rationale: ἐπί के साथ संबंधवाचक सर्वनाम उस व्यक्ति को दर्शाता है जो घटना से प्रभावित हुआ; ‘पर’ इस संबंध को सीधे बनाए रखता है।
- source_word: γεγόνει
  choice: प्रकट हुआ था
  rationale: γίνομαι का पूर्णभूत रूप पहले घट चुकी घटना को दर्शाता है। ‘प्रकट हुआ था’ चिन्ह के घटित और दिखाई देने का भाव देता है तथा किसी कर्ता को व्याकरण में अनावश्यक रूप से नहीं जोड़ता।
- source_word: τὸ σημεῖον τοῦτο
  choice: यह चिन्ह
  rationale: ‘चिन्ह’ लूका द्वारा प्रयुक्त σημεῖον के प्रमाणात्मक और अर्थसूचक पहलू को बनाए रखता है; केवल ‘चमत्कार’ कहने से यह सूक्ष्मता घट सकती है।
- source_word: τῆς ἰάσεως
  choice: चंगा किए जाने का
  rationale: ἴασις आरोग्य या चंगाई को सूचित करता है। हिंदी में ‘चंगा किए जाने का चिन्ह’ घटना को स्पष्ट और सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: चमत्कारी प्रसंग में σημεῖον का अनुवाद
  choice: चिन्ह
  alternative: चमत्कार
  rationale: ‘चिन्ह’ घटना के केवल आश्चर्यजनक होने के बजाय उसके प्रमाणात्मक और प्रकाशनकारी अर्थ को भी सुरक्षित रखता है।
- issue: γεγόνει में निहित कर्तृत्व
  choice: प्रकट हुआ था
  alternative: किया गया था
  rationale: मूल यूनानी में ‘करना’ की स्पष्ट कर्मवाच्य क्रिया नहीं, बल्कि γίνομαι है। चुनी हुई अभिव्यक्ति घटना पर केंद्रित रहती है और इस पद में किसी कर्ता को अधिक स्पष्ट बनाकर नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिंदी; वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखा गया है। ‘चिन्ह’ को मुख्य पाठ में रखकर लूका की शब्दावली सुरक्षित की गई है, जबकि अधिक प्रचलित ‘चमत्कार’ को पादटिप्पणी में दिया गया है।
