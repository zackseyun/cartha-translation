lexical_decisions:
- source_word: Ἀπολυθέντες
  choice: रिहा किए जाने के बाद
  rationale: ἀπολύω का अओरिस्ट कर्मवाच्य कृदंत मुख्य क्रिया से पहले हुई कार्रवाई दर्शाता है। कानूनी और हिरासत के संदर्भ में ‘रिहा’ स्वाभाविक तथा सटीक है।
- source_word: δὲ
  choice: अलग से अनूदित नहीं
  rationale: δέ हल्का कथात्मक संयोजक है; हिन्दी में ‘रिहा किए जाने के बाद’ से घटनाक्रम का संबंध स्वाभाविक रूप से स्पष्ट है, इसलिए अलग ‘तब’ जोड़ना आवश्यक नहीं।
- source_word: ἦλθον
  choice: गए
  rationale: ἔρχομαι का अनुवाद दृष्टिकोण के अनुसार ‘आए’ या ‘गए’ हो सकता है। कथावाचक का दृष्टिकोण गंतव्य पर स्थित नहीं है, इसलिए यहाँ ‘गए’ अधिक स्वाभाविक है।
- source_word: πρὸς τοὺς ἰδίους
  choice: अपने लोगों के पास
  rationale: शाब्दिक अर्थ ‘अपनों के पास’ है और संदर्भ अपने साथियों अथवा समुदाय का है। ‘अपने लोगों’ स्पष्ट और सहज है, पर किसी अधिक विशिष्ट समूह को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: ἀπήγγειλαν
  choice: बताया
  rationale: ἀπαγγέλλω सूचना पहुँचाने या वृत्तांत सुनाने को व्यक्त करता है। आधुनिक हिन्दी में ‘बताया’ सहज है और यहाँ पूरी बात पहुँचाने का भाव देता है।
- source_word: ὅσα
  choice: वह सब
  rationale: ὅσα कथन की समस्त विषयवस्तु को समेटता है; ‘वह सब’ इसके व्यापक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πρὸς αὐτοὺς
  choice: उनसे
  rationale: λέγω के साथ πρός + कर्मकारक उन व्यक्तियों को दर्शाता है जिनसे बात कही गई। हिन्दी में ‘उनसे कहा था’ स्वाभाविक है; ‘उनके विरुद्ध’ कहना मूल पूर्वसर्ग में अनावश्यक विरोध का अर्थ जोड़ता।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: बहुवचन पद leading priestly authorities को दर्शाता है। ‘प्रधान याजक’ हिन्दी बाइबलीय प्रयोग में मान्य है और अनेक ‘महायाजकों’ का भ्रामक संकेत नहीं देता।
- source_word: οἱ πρεσβύτεροι
  choice: पुरनियों
  rationale: यहाँ πρεσβύτεροι केवल आयु में बड़े पुरुष नहीं, बल्कि मान्य यहूदी अगुवे अथवा परिषद के सदस्य हैं। ‘पुरनिये’ इस संस्थागत पद का प्रचलित हिन्दी बाइबलीय रूप है।
- source_word: εἶπαν
  choice: कहा था
  rationale: ‘था’ से स्पष्ट होता है कि प्रधान याजकों और पुरनियों का कहना, पतरस और यूहन्ना द्वारा उसके बताए जाने से पहले हुआ था।
