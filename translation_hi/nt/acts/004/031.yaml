source:
  edition: SBLGNT
  text: καὶ δεηθέντων αὐτῶν ἐσαλεύθη ὁ τόπος ἐν ᾧ ἦσαν συνηγμένοι, καὶ ἐπλήσθησαν ἅπαντες ⸂τοῦ ἁγίου πνεύματος⸃, καὶ ἐλάλουν τὸν λόγον τοῦ θεοῦ μετὰ παρρησίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/031.yaml
  text: And when they had prayed[a], the place in which they were gathered was shaken[b], and they were all filled with the Holy Spirit and were speaking the word of God with boldness.
translation:
  language: hi
  text: जब उन्होंने प्रार्थना की, तो वह स्थान, जहाँ वे इकट्ठे थे[a], हिल गया; और वे सब पवित्र आत्मा से भर गए और परमेश्वर का वचन निर्भीकता से[b] बोलते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जहाँ वे एकत्र हुए थे।” यूनानी रचना उनके एकत्रित होने की अवस्था बताती है।
    reason: lexical_alternative
  - marker: b
    text: या, “साहस के साथ” अथवा “खुलकर।” यह शब्द खुले और निडर होकर बोलने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δεηθέντων αὐτῶν
  choice: उनके प्रार्थना करने के बाद
  rationale: सम्बन्धकारक निरपेक्ष रचना और भूतकालिक कृदन्त मुख्य घटना से पहले हुई सामूहिक प्रार्थना की कालगत पृष्ठभूमि देते हैं।
- source_word: ἐσαλεύθη
  choice: हिल उठा
  rationale: यह कर्मवाच्य भूतकालिक रूप उस स्थान के प्रत्यक्ष रूप से हिलने को व्यक्त करता है; हिन्दी में ‘हिल उठा’ घटना की तीव्रता और स्वाभाविकता बनाए रखता है।
- source_word: ἐν ᾧ ἦσαν συνηγμένοι
  choice: जहाँ वे इकट्ठे थे
  rationale: ἦσαν के साथ पूर्ण कृदन्त उनके इकट्ठा हो चुके होने की अवस्था बताता है; यह अनुवाद उस अवस्था को सहज हिन्दी में रखता है।
- source_word: ἐπλήσθησαν ἅπαντες
  choice: वे सब ... से भर गए
  rationale: कर्मवाच्य अर्थ और समूह के प्रत्येक सदस्य को समेटने वाला ἅπαντες दोनों सुरक्षित रहते हैं।
- source_word: τοῦ ἁγίου πνεύματος
  choice: पवित्र आत्मा से
  rationale: πίμπλημι के साथ सम्बन्धकारक यहाँ भरने की विषय-वस्तु दर्शाता है; ‘पवित्र आत्मा से भर गए’ लूका की प्रचलित अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐλάλουν
  choice: सुनाते रहे
  rationale: अपूर्ण भूतकाल जारी वाणी को दर्शाता है। ‘सुनाते रहे’ परमेश्वर के वचन के मौखिक संप्रेषण को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘आरम्भ किया’ जोड़ने के।
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: यह लूका की परिचित अभिव्यक्ति है और घोषित किए जाने वाले ईश्वरीय संदेश का बाइबलीय भार बनाए रखती है।
- source_word: μετὰ παρρησίας
  choice: साहस के साथ
  rationale: παρρησία खुले, निर्भीक और बिना संकोच के बोलने को दर्शाता है; ‘साहस के साथ’ आधुनिक हिन्दी में व्यापक और स्पष्ट है।
theological_decisions:
- issue: पवित्र आत्मा से भरने की भाषा
  choice: वे सब पवित्र आत्मा से भर गए
  alternative: वे सब पवित्र आत्मा के द्वारा भर दिए गए
  rationale: यूनानी सम्बन्धकारक को यहाँ भरने की विषय-वस्तु के रूप में पढ़ना लूका की शैली के अनुरूप है। यह कथन को यथावत रखता है और आत्मा से भरने के अनुभव के बारे में कोई संकीर्ण साम्प्रदायिक क्रम नहीं जोड़ता।
- issue: ἐλάλουν का कालगत पक्ष
  choice: सुनाते रहे
  alternative: सुनाया / सुनाने लगे
  rationale: अपूर्ण भूतकाल निरन्तर चल रही घोषणा पर बल देता है; इसलिए इसे केवल एक बार की घटना या अनिवार्यतः आरम्भिक क्रिया नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘हिल उठा’ और ‘सुनाते रहे’ सहज हिन्दी हैं; वाक्य का प्रवाह बनाए रखते हुए यूनानी के कर्मवाच्य, सामूहिक पूर्णता और जारी घोषणा को सुरक्षित रखा गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न अर्थतः विस्थापित दिखते हैं; हिन्दी में [a] को ‘इकट्ठे थे’ और [b] को ‘साहस के साथ’ पर लगाया गया है, ताकि प्रत्येक टिप्पणी अपने वास्तविक पद से जुड़े।
