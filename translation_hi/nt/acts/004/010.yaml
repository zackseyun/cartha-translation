source:
  edition: SBLGNT
  text: γνωστὸν ἔστω πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραὴλ ὅτι ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/010.yaml
  text: let it be known to all of you and to all the people of Israel that in the name of Jesus the Messiah the Nazarene[a], whom you crucified[c][b], whom God raised from the dead—by this name this man stands before you healthy.
translation:
  language: hi
  text: आप सब और इस्राएल की सारी जनता जान लें कि नासरत के यीशु मसीह[a] के नाम से—जिसे आप लोगों ने क्रूस पर चढ़ाया और जिसे परमेश्वर ने मरे हुओं में से जिलाया—इसी नाम से[b] यह व्यक्ति स्वस्थ[c] आपके सामने खड़ा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यीशु मसीह नासरी।” यूनानी शब्द Ναζωραῖος का अर्थ “नासरी” अथवा “नासरत का” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या “उसी के द्वारा।” यूनानी वाक्यांश ἐν τούτῳ अभी उल्लिखित नाम की ओर अधिक विशेष रूप से संकेत कर सकता है, या यीशु स्वयं को माध्यम बता सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “भला-चंगा” अथवा “पूरी तरह ठीक।” यूनानी ὑγιής स्वस्थ या बहाल शारीरिक दशा को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: जान ले
  rationale: यह सार्वजनिक घोषणा के आदेशात्मक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πᾶσιν ὑμῖν καὶ παντὶ τῷ λαῷ Ἰσραήλ
  choice: आप सब और इस्राएल की सारी जनता
  rationale: तात्कालिक श्रोताओं और इस्राएल के व्यापक जनसमुदाय—दोनों को अलग रखते हुए समावेशी विस्तार सुरक्षित है।
- source_word: ἐν τῷ ὀνόματι
  choice: के नाम से
  rationale: यह यूनानी मुहावरे के साथ-साथ उस प्रभावकारी सामर्थ्य अथवा माध्यम को भी दर्शाता है जिसके द्वारा चंगाई हुई।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός की उपाधिगत, मसीह-संबंधी अर्थवत्ता को हिन्दी के प्रचलित और अर्थपूर्ण रूप में बनाए रखता है।
- source_word: τοῦ Ναζωραίου
  choice: नासरी
  rationale: यह व्यक्ति-सूचक विशेषण को संक्षिप्त, प्रतिष्ठित और बाइबलीय हिन्दी में व्यक्त करता है; ‘नासरत के’ भी संभव है।
- source_word: ὃν ὑμεῖς ἐσταυρώσατε
  choice: जिसे आप लोगों ने क्रूस पर चढ़ाया
  rationale: प्रत्यक्ष आरोप और श्रोताओं पर दिए गए बल को बनाए रखता है।
- source_word: ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν
  choice: जिसे परमेश्वर ने मरे हुओं में से जिलाया
  rationale: परमेश्वर की स्पष्ट कर्तृता और पुनरुत्थान के कथन को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ἐν τούτῳ
  choice: उसी के द्वारा
  rationale: निकटतम व्यक्ति यीशु की ओर संकेत करते हुए करणार्थक अर्थ देता है; ‘इसी नाम से’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: οὗτος παρέστηκεν ἐνώπιον ὑμῶν
  choice: यह व्यक्ति ... आपके सामने खड़ा है
  rationale: चंगा हुए उपस्थित व्यक्ति तथा पूर्णकाल से प्राप्त वर्तमान दृश्य अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑγιής
  choice: स्वस्थ
  rationale: शारीरिक स्वस्थता और बहाल दशा का स्पष्ट आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: Χριστοῦ को उपाधि के रूप में या नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: इस्राएल के अगुओं के सामने घोषणा के प्रसंग में उपाधि का अर्थ सक्रिय है; ‘मसीह’ उस अर्थ को स्पष्ट रखता है और उसे केवल व्यक्तिगत नाम नहीं बनाता।
- issue: ἐν τούτῳ का संदर्भ
  choice: उसी के द्वारा
  alternative: इसी नाम से
  rationale: पुल्लिंग संकेतवाचक सर्वनाम स्वाभाविक रूप से अभी-अभी उल्लिखित यीशु की ओर लौट सकता है और करणार्थक है; फिर भी पहले आए ‘नाम’ की अवधारणा के कारण वैकल्पिक समझ वास्तविक है और पादटिप्पणी में सुरक्षित रखी गई है।
- issue: पुनरुत्थान की अभिव्यक्ति
  choice: जिसे परमेश्वर ने मरे हुओं में से जिलाया
  alternative: जिसे परमेश्वर ने मृतकों में से उठाया
  rationale: यह परमेश्वर की कर्तृता तथा मृत अवस्था से जीवन में उठाए जाने के दावे को स्पष्ट रखता है, बिना उससे आगे कोई सिद्धान्तगत विवरण जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में सार्वजनिक, गरिमापूर्ण और मौखिक घोषणा के अनुकूल शैली। ‘आप लोगों’ से यूनानी ὑμεῖς का आरोपात्मक बल उभरता है; ‘जनता’ सामान्य पाठक के लिए सहज है। सभी वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं और उनके चिह्न मुख्य पाठ में उपस्थित हैं।
