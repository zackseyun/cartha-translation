source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ’ ὑμῶν τῶν ⸀οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/011.yaml
  text: This is the stone that was rejected by you[a], the builders, which has become the cornerstone.
translation:
  language: hi
  text: यह वही पत्थर है जिसे तुमने—निर्माण करने वालों ने—तुच्छ समझकर ठुकरा दिया था, और जो कोने का प्रधान पत्थर[a] बन गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शिखर-पत्थर’; अधिक शाब्दिक रूप से, ‘कोने का सिर।’
    reason: मूल यूनानी पदबंध के सटीक स्थापत्य-संदर्भ की अनिश्चितता को सुरक्षित रखना।
lexical_decisions:
- source_word: οὗτός
  choice: यह वही
  rationale: संकेतवाचक सर्वनाम प्रसंग में यीशु की ओर बलपूर्वक संकेत करता है; ‘यह वही’ हिन्दी में पहचान और बल दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: λίθος
  choice: पत्थर
  rationale: यह सामान्य अर्थ है और भजन 118:22 के भवन-निर्माण रूपक को बनाए रखता है।
- source_word: ἐξουθενηθεὶς
  choice: तुच्छ जानकर ठुकरा दिया
  rationale: क्रिया में किसी को नगण्य या बेकार समझने का भाव है; संयुक्त अभिव्यक्ति अवमानना और निर्माण के लिए अस्वीकार किए जाने, दोनों को व्यक्त करती है।
- source_word: ὑφ’ ὑμῶν τῶν οἰκοδόμων
  choice: जिसे तुम राजमिस्त्रियों ने
  rationale: द्वितीय पुरुष बहुवचन का सीधा आरोप और ‘निर्माण करने वालों’ का रूपक सुरक्षित रहता है; ‘राजमिस्त्री’ सामान्य हिन्दी में भवन बनाने वाले कारीगरों के लिए स्पष्ट है।
- source_word: ὁ γενόμενος
  choice: और जो ... बन गया
  rationale: परिवर्तन की पूर्ण घटना और उसके वर्तमान महत्व को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κεφαλὴν γωνίας
  choice: कोने का प्रधान पत्थर
  rationale: शाब्दिक चित्र ‘कोने का सिर’ को अस्वाभाविक बनाए बिना ‘प्रधान’ और ‘कोने’ दोनों तत्त्व सुरक्षित रखता है तथा विवादित स्थापत्य-संदर्भ को केवल ‘नींव का पत्थर’ कहकर सीमित नहीं करता।
theological_decisions:
- issue: भजन 118:22 के स्थापत्य-चित्र का अनुवाद
  choice: कोने का प्रधान पत्थर
  alternative: कोने का आधार-पत्थर; चोटी का पत्थर; शाब्दिक रूप से ‘कोने का सिर’
  rationale: मूल पदबंध पत्थर की प्रधानता और कोने से उसके संबंध को बताता है, पर यह निश्चित नहीं करता कि वह नींव का पत्थर है या भवन के ऊपरी भाग का। मुख्य पाठ अस्पष्टता को यथासंभव बनाए रखता है और विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘तुच्छ जानकर ठुकरा दिया’ मूल क्रिया के अवमानना-भाव को उभारता है, जबकि ‘कोने का प्रधान पत्थर’ भजन के रूपक और उसकी वास्तविक अस्पष्टता को बनाए रखता है।
