source:
  edition: SBLGNT
  text: Λαλούντων δὲ αὐτῶν πρὸς τὸν λαὸν ἐπέστησαν αὐτοῖς οἱ ⸀ἱερεῖς καὶ ὁ στρατηγὸς τοῦ ἱεροῦ καὶ οἱ Σαδδουκαῖοι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/001.yaml
  text: While they were speaking to the people[a], the priests and the captain of the temple and the Sadducees came upon them[b],
translation:
  language: hi
  text: जब वे लोगों से बात कर रहे थे, तो याजक, मंदिर का सेनापति[a] और सदूकी उनके पास आ पहुँचे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मंदिर का सेनापति’ मंदिर-परिसर में व्यवस्था और सुरक्षा का उत्तरदायी अधिकारी था।
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद ‘उनके पास आए’ या ‘उनके निकट आ खड़े हुए’ भी हो सकता है। यूनानी क्रिया अचानक पहुँचने या पास आने का भाव दे सकती है; संदर्भ में यह अधिकारियों के आधिकारिक रूप से आ जाने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Λαλούντων δὲ αὐτῶν
  choice: जब वे … बात कर रहे थे, तभी
  rationale: संबंधकारक निरपेक्ष रचना को स्वाभाविक हिंदी की कालवाचक अधीन रचना में व्यक्त किया गया है। δέ की कथा-अग्रगामी भूमिका को अलग से ‘अब’ जोड़ने के बजाय ‘तभी’ से सहज रूप में रखा गया है।
- source_word: πρὸς τὸν λαὸν
  choice: लोगों से
  rationale: λαός यहाँ मंदिर में एकत्र सामान्य लोगों को दर्शाता है। ‘लोगों’ सटीक और सहज है; ‘भीड़’ अपेक्षाकृत अधिक व्याख्यात्मक होता।
- source_word: ἐπέστησαν αὐτοῖς
  choice: उनके पास आ पहुँचे
  rationale: ἐφίστημι निकट आने या अचानक उपस्थित होने का भाव दे सकता है। ‘आ पहुँचे’ आगमन और व्यवधान का संकेत देता है, पर क्रिया में स्पष्ट न किए गए शत्रुतापूर्ण ‘सामना किया’ जैसे भाव को नहीं जोड़ता।
- source_word: οἱ ἱερεῖς
  choice: याजक
  rationale: मूल में साधारण ἱερεῖς है, ἀρχιερεῖς नहीं; इसलिए ‘प्रधान याजक’ जोड़ना अनुचित होता।
- source_word: ὁ στρατηγὸς τοῦ ἱεροῦ
  choice: मंदिर का सेनापति
  rationale: στρατηγός व्यवस्था और सुरक्षा के लिए उत्तरदायी अधिकारी या कमांडर को दर्शाता है। ‘मंदिर का सेनापति’ पदनाम को संक्षिप्त रूप में रखता है; उसका कार्य पादटिप्पणी में स्पष्ट किया गया है।
- source_word: οἱ Σαδδουκαῖοι
  choice: सदूकी
  rationale: इस यहूदी धार्मिक समूह के लिए प्रचलित हिंदी नाम अपनाया गया है।
theological_decisions:
- issue: अधिकारियों के आगमन में संभावित विरोधी भाव
  choice: ‘उनके पास आ पहुँचे’
  alternative: ‘उनका सामना करने आ गए’
  rationale: आगे का प्रसंग विरोध दिखाता है, पर इस पद की क्रिया अपने आप में केवल निकट या अचानक आने को व्यक्त कर सकती है। तटस्थ अनुवाद कथा के तनाव को बनाए रखता है और शत्रुता को समय से पहले स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘बात कर रहे थे’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पदनाम ‘मंदिर का सेनापति’ मूल की औपचारिकता बनाए रखता है।
