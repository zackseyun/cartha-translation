  rationale: मूल शब्द उन्हें बुद्धिहीन या अनिवार्यतः निरक्षर नहीं कहते, बल्कि औपचारिक विद्वत्तापूर्ण प्रशिक्षण और आधिकारिक पेशेवर हैसियत से रहित बताते हैं। चुना हुआ रूप यही अंतर बनाए रखता है।
