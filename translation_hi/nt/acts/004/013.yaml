  text: Θεωροῦντες δὲ τὴν τοῦ Πέτρου παρρησίαν καὶ Ἰωάννου καὶ καταλαβόμενοι ὅτι ἄνθρωποι ἀγράμματοί εἰσιν καὶ ἰδιῶται, ἐθαύμαζον, ἐπεγίνωσκόν τε αὐτοὺς ὅτι σὺν τῷ Ἰησοῦ ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/013.yaml
  text: As they observed the boldness of Peter and John[a], and realized that they were uneducated and ordinary men, they were astonished, and they recognized that they had been with Jesus.
translation:
  language: hi
  text: पतरस और यूहन्ना की निर्भीकता देखकर और यह समझकर कि वे औपचारिक प्रशिक्षण से रहित साधारण लोग हैं[a], वे चकित हुए; और पहचान गए कि वे यीशु के साथ रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अशिक्षित और गैर-पेशेवर लोग।” यूनानी शब्दों का आशय यह है कि उन्हें औपचारिक विद्वत्तापूर्ण प्रशिक्षण नहीं मिला था और वे किसी आधिकारिक पेशेवर पद पर नहीं थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωροῦντες
  choice: जब उन्होंने ... देखा
  rationale: यह कृदंत विचारपूर्वक देखने और उसी से आगे निष्कर्ष निकालने का भाव देता है; हिंदी में आश्रित कालवाचक उपवाक्य स्वाभाविक है।
- source_word: παρρησίαν
  choice: साहस
  rationale: प्रसंग में यह सार्वजनिक रूप से खुलकर और निडरता से बोलने का साहस है। ‘साहस’ आधुनिक हिंदी में स्वाभाविक है और निर्भीकता तथा स्पष्टवादिता, दोनों के लिए पर्याप्त स्थान रखता है।
- source_word: καταλαβόμενοι
  choice: यह समझा
  rationale: यह उनके पतरस और यूहन्ना के विषय में किसी निष्कर्ष पर पहुँचने को व्यक्त करता है।
- source_word: ἀγράμματοί
  choice: औपचारिक शिक्षा न पाए हुए
  rationale: यहाँ आशय आवश्यक रूप से निरक्षर होने से नहीं, बल्कि औपचारिक शास्त्रीय या विद्वत्तापूर्ण प्रशिक्षण न पाने से है।
- source_word: ἰδιῶται
  choice: साधारण लोग
  rationale: यह प्रशिक्षित या आधिकारिक धार्मिक विशेषज्ञों के विपरीत सामान्य, गैर-पेशेवर सामाजिक स्थिति बताता है; ‘साधारण’ अनावश्यक अपमानसूचक अर्थ से बचता है।
- source_word: ἐθαύμαζον
  choice: वे चकित हुए
  rationale: यह उनकी विस्मयभरी प्रतिक्रिया को सहज और गरिमापूर्ण आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἐπεγίνωσκόν
  choice: वे ... पहचान गए
  rationale: क्रिया पहचानने या पहचान लेने का भाव देती है। हिंदी में ‘पहचान गए’ उनके उस निष्कर्ष को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: σὺν τῷ Ἰησοῦ ἦσαν
  choice: ये यीशु के साथ रहे थे
  rationale: भूतपूर्व संगति को दिखाने के लिए पूर्ण भूतकाल प्रयुक्त है; यह वर्तमान साहस की पृष्ठभूमि बताता है।
- source_word: δὲ ... τε
  choice: जब ...; और ... भी
  rationale: ये अव्यय कथानक और समन्वय को जोड़ते हैं, किसी प्रबल विरोध को नहीं। हिंदी संरचना में ‘और ... भी’ दूसरे अवलोकन को जोड़ता है।
