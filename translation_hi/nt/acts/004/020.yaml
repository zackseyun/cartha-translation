  text: οὐ δυνάμεθα γὰρ ἡμεῖς ἃ εἴδαμεν καὶ ἠκούσαμεν μὴ λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/020.yaml
  text: For we are not able not to speak about what we have seen and heard[a].
translation:
  language: hi
  text: क्योंकि हमने जो देखा और सुना है, उसके बारे में न बोलना हमारे लिए संभव नहीं है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार रूप में: “क्योंकि हमने जो देखा और सुना है, उसके बारे में बोले बिना हम नहीं रह सकते।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δυνάμεθα ... μὴ λαλεῖν
  choice: न बोलना हमारे लिए संभव नहीं है
  rationale: यह अभिव्यक्ति यूनानी की निषेधयुक्त संरचना और बोलने से चुप न रह सकने की असमर्थता—दोनों को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करने वाले व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡμεῖς
  choice: हमने / हमारे लिए
  rationale: यूनानी में स्पष्ट सर्वनाम का बल हिन्दी वाक्य में कर्ता और ‘हमारे लिए’ के द्वारा पर्याप्त रूप से व्यक्त होता है; ‘हम स्वयं’ कहना अनावश्यक रूप से अधिक बल देता।
- source_word: ἃ
  choice: जो
  rationale: यह देखी और सुनी गई बातों को स्वाभाविक रूप से संबोधित करता है, बिना ‘वे बातें जिन्हें’ जैसी भारी संरचना के।
- source_word: εἴδαμεν καὶ ἠκούσαμεν
  choice: हमने जो देखा और सुना है
  rationale: संयुक्त गवाही का प्रत्यक्षदर्शी और प्रत्यक्षश्रवण स्वर सुरक्षित रहता है; ‘है’ उन अनुभवों की वर्तमान प्रासंगिकता दर्शाता है।
- source_word: λαλεῖν
  choice: उसके बारे में ... बोलना
  rationale: संदर्भ में बोलने की विषयवस्तु देखी-सुनी बातें हैं; ‘उसके बारे में’ हिन्दी में यह संबंध स्पष्ट करता है।
theological_decisions:
- issue: प्रेरितों का बोलना केवल दृढ़ इच्छा है या बोलने से रुक सकने की असमर्थता
  choice: वचन को इस रूप में रखा गया है कि उनके लिए न बोलना संभव नहीं है।
  alternative: इसे ‘हम बोलना बंद नहीं करेंगे’ जैसी दृढ़ प्रतिज्ञा के रूप में कहा जा सकता था।
  rationale: οὐ δυνάμεθα ... μὴ λαλεῖν सीधे तौर पर न बोल सकने की असमर्थता व्यक्त करता है। चुना हुआ रूप इसे केवल इच्छा या निर्णय तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। मुख्य पाठ यूनानी की निषेधयुक्त ‘न बोलना संभव नहीं’ संरचना को बनाए रखता है, जबकि पादटिप्पणी उसी अर्थ का अधिक मुहावरेदार विकल्प देती है।
