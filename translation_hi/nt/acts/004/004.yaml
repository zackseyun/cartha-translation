source:
  edition: SBLGNT
  text: πολλοὶ δὲ τῶν ἀκουσάντων τὸν λόγον ἐπίστευσαν, καὶ ἐγενήθη ⸀ὁ ἀριθμὸς τῶν ἀνδρῶν ⸀ὡς χιλιάδες πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/004.yaml
  text: But many of those who had heard the message believed[b][a], and the number of the men became about five thousand.
translation:
  language: hi
  text: परन्तु जो वचन[a] सुन चुके थे, उनमें से बहुतों ने विश्वास किया, और पुरुषों की संख्या[b] लगभग पाँच हज़ार हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संदेश।” यहाँ “वचन” से आशय प्रेरितों द्वारा सुनाई गई घोषणा या संदेश है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “पुरुषों की संख्या”; सम्भवतः यहाँ पूरे मिले-जुले जनसमूह के बजाय पुरुषों की गिनती बताई गई है।
    reason: cultural_note
lexical_decisions:
- source_word: πολλοὶ
  choice: बहुतों
  rationale: यह यूनानी के अनिश्चित बहुवचन परिमाण को स्वाभाविक हिन्दी में व्यक्त करता है, बिना कोई अतिरिक्त संज्ञा जोड़े।
- source_word: δὲ
  choice: परन्तु
  rationale: पिछले प्रसंग के विरोध और गिरफ्तारी के विपरीत यहाँ लोगों के विश्वास करने को दर्शाता है।
- source_word: ἀκουσάντων τὸν λόγον
  choice: वचन सुननेवालों
  rationale: कृदन्त को हिन्दी में स्वाभाविक संबंधवाचक रूप दिया गया है। λόγος को ‘वचन’ रखा गया है, जबकि यहाँ उसका आशय प्रेरितों द्वारा सुनाया गया संदेश है; यह अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐπίστευσαν
  choice: विश्वास किया
  rationale: यह πιστεύω का सीधा और धार्मिक रूप से अनावश्यक विस्तार से बचने वाला अनुवाद है।
- source_word: ἐγενήθη
  choice: हो गई
  rationale: संख्या की परिणामी अवस्था को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ ἀριθμὸς τῶν ἀνδρῶν
  choice: पुरुषों की संख्या
  rationale: ἀνδρῶν के पुरुष-वाचक अर्थ को बनाए रखता है और उसे सामान्य ‘लोगों’ में नहीं बदलता।
- source_word: ὡς χιλιάδες πέντε
  choice: लगभग पाँच हज़ार
  rationale: संख्या से पहले ὡς द्वारा व्यक्त अनुमान को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: τῶν ἀνδρῶν में पुरुष-विशिष्ट गणना
  choice: पुरुषों की संख्या
  alternative: लोगों की संख्या; विश्वासियों की संख्या
  rationale: ἀνήρ सामान्यतः वयस्क पुरुष को सूचित करता है। अनुवाद मूल के पुरुष-वाचक रूप को बनाए रखता है, पर इससे यह निष्कर्ष नहीं निकाला जाता कि पूरे विश्वासी समुदाय में स्त्रियाँ नहीं थीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘सुननेवालों’ का संयुक्त रूप प्रवाह बनाए रखता है; ‘वचन’ बाइबलीय परिचितता रखता है और उसकी प्रसंगगत व्यापकता पादटिप्पणी में दी गई है।
