  yaml_path: translation/nt/acts/004/017.yaml
  text: But so that it may not spread any further among the people, let us warn them not to speak any longer to anyone in this name.
translation:
  language: hi
  text: लेकिन यह लोगों में और अधिक न फैले, इसलिए हम उन्हें धमकाएँ[a] कि वे अब इस नाम से किसी से भी न बोलें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें कड़ी चेतावनी दें।” यूनानी क्रिया में अधिकारियों द्वारा भय दिखाने या धमकाने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεμηθῇ
  choice: फैले
  rationale: यह क्रिया किसी बात के लोगों में प्रसारित होने को दर्शाती है। प्रसंग में हिन्दी ‘फैले’ स्वाभाविक है और मूल के कर्मवाच्य भाव को पर्याप्त रूप से व्यक्त करता है।
- source_word: ἐπὶ πλεῖον
  choice: और अधिक
  rationale: यह पद वर्तमान सीमा से आगे विस्तार का तुलनात्मक भाव रखता है; ‘और अधिक’ उस भाव को संक्षेप में बनाए रखता है।
- source_word: λαός
  choice: लोगों
  rationale: यहाँ व्यापक जनसमुदाय अभिप्रेत है; आधुनिक हिन्दी में ‘लोगों’ सहज और पर्याप्त रूप से व्यापक है।
- source_word: ἀπειλησώμεθα
  choice: हम उन्हें धमकी दें
  rationale: क्रिया का मूल अर्थ केवल सावधान करना नहीं, बल्कि अधिकारपूर्वक डराना या धमकाना है। परिषद के दमनकारी आशय को स्पष्ट रखने के लिए ‘धमकी दें’ चुना गया है।
- source_word: μηκέτι λαλεῖν
  choice: अब ... कुछ न कहें
  rationale: ‘अब’ μηκέτι के इस समय से आगे बंद कर देने के भाव को व्यक्त करता है; ‘कुछ न कहें’ निषिद्ध वाणी को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: इस नाम से
  rationale: यह पद इस नाम के आधार, अधिकार या संबंध में बोलने का भाव रखता है। ‘इस नाम से’ हिन्दी में संक्षिप्त और स्वाभाविक है तथा अर्थ को केवल नाम का उल्लेख करने तक सीमित नहीं करता।
- source_word: μηδενὶ ἀνθρώπων
  choice: किसी भी व्यक्ति से
  rationale: यह बोलने के श्रोताओं पर पूर्ण निषेध व्यक्त करता है। ‘किसी भी व्यक्ति से’ मूल के सामान्य, लिंग-निरपेक्ष अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: परिषद की कार्रवाई में ἀπειλησώμεθα की तीव्रता
  choice: मुख्य पाठ में ‘धमकी दें’
  alternative: ‘कड़ी चेतावनी दें’
  rationale: मूल क्रिया में अधिकारियों द्वारा भय दिखाने का स्पष्ट बल है। ‘धमकी दें’ उस दमनकारी स्वर को बिना नरम किए सुरक्षित रखता है; अधिक शिष्ट सुनाई देने वाला विकल्प पादटिप्पणी में दिया गया है।
- issue: ‘इस नाम से’ का आशय
  choice: मूल की व्यापक संबद्धता और अधिकार का भाव खुला रखा गया है
  alternative: ‘इस नाम के आधार पर’ अथवा ‘इस नाम के विषय में’
  rationale: ἐπὶ τῷ ὀνόματι नाम के आधार, अधिकार या उससे संबद्ध होकर बोलने का संकेत दे सकता है। किसी एक व्याख्या को अनावश्यक रूप से निश्चित न करने के लिए संक्षिप्त अभिव्यक्ति चुनी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में परिषद की रोक लगाने वाली, दमनकारी मुद्रा स्पष्ट है; साथ ही ‘इस नाम से’ मूल पद की अर्थ-व्याप्ति को किसी एक संकीर्ण व्याख्या में नहीं बाँधता।
