id: ACT.4.26
reference: Acts 4:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: παρέστησαν οἱ βασιλεῖς τῆς γῆς καὶ οἱ ἄρχοντες συνήχθησαν ἐπὶ τὸ αὐτὸ κατὰ τοῦ κυρίου καὶ κατὰ τοῦ χριστοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/004/026.yaml
  text: The kings of the earth took their stand[a], and the rulers were gathered together against the Lord and against his Messiah.
translation:
  language: hi
  text: पृथ्वी के राजा डटकर खड़े हुए, और शासक प्रभु के विरुद्ध और उसके मसीह[a] के विरुद्ध एक साथ इकट्ठे हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ख्रीस्त”; यूनानी में “उसका ख्रिस्तोस,” अर्थात “उसका अभिषिक्त जन।”
    reason: alternative_reading
lexical_decisions:
- source_word: παρέστησαν
  choice: उठ खड़े हुए
  rationale: यह भजन 2:2 की प्रतिध्वनि है और केवल खड़े होने के बजाय जान-बूझकर विरोध में डटने का भाव व्यक्त करता है।
- source_word: βασιλεῖς
  choice: राजा
  rationale: यह विशिष्ट राजकीय पद को बनाए रखता है और भजन के समानांतर विन्यास के अनुरूप है।
- source_word: τῆς γῆς
  choice: पृथ्वी के
  rationale: इस उद्धरण में व्यापक, विश्वव्यापी अर्थ अधिक संभावित है; इसलिए स्थानीय ‘देश’ या ‘भूमि’ के बजाय ‘पृथ्वी’ चुना गया है।
- source_word: ἄρχοντες
  choice: शासक
  rationale: यह राजाओं के समानांतर सत्ता रखने वालों के लिए आधुनिक और स्वाभाविक हिन्दी शब्द है।
- source_word: συνήχθησαν
  choice: इकट्ठे हुए
  rationale: यह सामूहिक रूप से एकत्र होने का अर्थ सहज हिन्दी में व्यक्त करता है; यूनानी का रूप कर्मवाच्य है, पर यहाँ हिन्दी में ‘इकट्ठे किए गए’ अनावश्यक रूप से किसी अज्ञात कर्ता का संकेत देगा।
- source_word: ἐπὶ τὸ αὐτό
  choice: एक साथ
  rationale: मुहावरे का आशय एक ही स्थान या उद्देश्य में साथ आने से है; ‘एक साथ’ समन्वित विरोध को संक्षेप में व्यक्त करता है।
- source_word: κατὰ
  choice: के विरुद्ध
  rationale: दोनों प्रयोगों में खुला विरोध अभिप्रेत है।
- source_word: κυρίου
  choice: प्रभु
  rationale: उद्धरण में यह परमेश्वर के लिए प्रयुक्त शास्त्रीय और धर्मवैचारिक रूप से महत्त्वपूर्ण संबोधन है।
- source_word: χριστοῦ
  choice: मसीह
  rationale: भजन 2 के संदर्भ में यह उपाधि है और प्रभु के अभिषिक्त राजा को सूचित करती है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित है।
- source_word: αὐτοῦ
  choice: उसके
  rationale: सर्वनाम स्वाभाविक रूप से ‘प्रभु’ की ओर लौटता है और यूनानी के संबंधसूचक भाव को बनाए रखता है।
theological_decisions:
- issue: भजन 2 के उद्धरण में Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त; अभिषिक्त जन
  rationale: यहाँ शब्द नाम की तरह नहीं, प्रभु के नियुक्त और अभिषिक्त व्यक्ति की उपाधि के रूप में आया है। ‘मसीह’ उस मसीही ढाँचे को बनाए रखता है, जबकि पादटिप्पणी यूनानी शब्द के शाब्दिक अर्थ और वैकल्पिक रूप को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। भजन 2 की काव्यात्मक समानांतरता बचाने के लिए ‘राजा’ और ‘शासक’ तथा दोनों बार ‘के विरुद्ध’ बनाए रखे गए हैं।
