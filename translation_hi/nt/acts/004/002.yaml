translation:
  language: hi
  text: वे इस बात से बहुत खिन्न थे कि वे लोगों को शिक्षा दे रहे थे और यीशु में मरे हुओं में से जी उठने की घोषणा कर रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु के विषय में मरे हुओं में से जी उठने की घोषणा कर रहे थे।” यूनानी में “यीशु में” का वाक्यांश खास तौर पर यीशु के अपने जी उठने में प्रकट हुए पुनरुत्थान की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: διαπονούμενοι
  choice: बहुत खिन्न थे
  rationale: यह शब्द अधिकारियों की तीव्र झुँझलाहट और बेचैनी व्यक्त करता है। ‘बहुत खिन्न’ इसकी तीव्रता को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: διὰ τὸ διδάσκειν
  choice: इस बात से … कि वे … शिक्षा दे रहे थे
  rationale: διά के साथ articular infinitive कारण बताता है; हिन्दी में ‘इस बात से … कि’ कारण और अधिकारियों की प्रतिक्रिया दोनों को स्पष्ट रूप से जोड़ता है।
- source_word: αὐτοὺς
  choice: वे
  rationale: सर्वनाम का संकेत पिछले संदर्भ में बताए गए पतरस और यूहन्ना की ओर है। केवल ‘वे’ रखने से मूल पाठ के सर्वनाम-संबंध को बिना अनावश्यक विस्तार के सुरक्षित रखा गया है।
- source_word: τὸν λαὸν
  choice: लोगों को
  rationale: λαός यहाँ सामूहिक रूप से जनता को दर्शाता है, केवल किसी आकस्मिक भीड़ को नहीं। ‘लोगों’ आधुनिक हिन्दी में सहज है।
- source_word: καταγγέλλειν
  choice: घोषणा कर रहे थे
  rationale: क्रिया सार्वजनिक रूप से किसी संदेश को घोषित करने का भाव रखती है; ‘घोषणा करना’ इस औपचारिक सार्वजनिक संदर्भ के अनुकूल है।
- source_word: ἐν τῷ Ἰησοῦ
  choice: यीशु में
  rationale: शाब्दिक और खुला अनुवाद यूनानी ἐν की संभावित बारीकियों को सुरक्षित रखता है—पुनरुत्थान यीशु में प्रकट, उन पर केंद्रित, या उनके उदाहरण में दिखाया गया है।
- source_word: ἀνάστασιν
  choice: जी उठने
  rationale: ‘जी उठना’ आधुनिक सामान्य पाठक के लिए ‘पुनरुत्थान’ से अधिक सहज है और मृत अवस्था से उठने का मूल अर्थ स्पष्ट रखता है।
- source_word: τὴν ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: यह वाक्यांश मृत लोगों के बीच से उठने को दर्शाता है। ‘मरे हुओं में से’ यूनानी अभिव्यक्ति की सामूहिक बारीकी को सुरक्षित रखता है।
theological_decisions:
- issue: ἐν τῷ Ἰησοῦ और पुनरुत्थान की घोषणा का संबंध
  choice: मुख्य पाठ में ‘यीशु में’ रखा गया है, जिससे पुनरुत्थान का यीशु में प्रकट या उन पर केंद्रित होना खुला रहता है।
  alternative: ‘यीशु के विषय में’ या ‘यीशु के द्वारा’ मरे हुओं में से जी उठने की घोषणा
  rationale: ἐν यहाँ कई निकटवर्ती अर्थ दे सकता है। मुख्य पाठ किसी एक अर्थ को निर्णायक नहीं बनाता; पादटिप्पणी विशेष रूप से यीशु के अपने जी उठने वाले अर्थ को बताती है।
- issue: ‘मरे हुओं में से जी उठने’ का दायरा
  choice: वाक्य यीशु के जी उठने और उनमें प्रमाणित व्यापक पुनरुत्थान—दोनों की संभावना खुली रखता है।
  alternative: केवल यीशु के अपने पुनरुत्थान का संदर्भ, अथवा केवल भावी सामान्य पुनरुत्थान का सिद्धांत
  rationale: लूका की भाषा तत्काल यीशु के पुनरुत्थान और उनमें आधारित व्यापक पुनरुत्थान-आशा दोनों को जगा सकती है; अनुवाद इसे अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘जी उठना’ सामान्य पाठकों के लिए स्पष्ट है, जबकि ‘मरे हुओं में से’ मूल यूनानी की विशिष्टता बनाए रखता है। वाक्य का आरंभ पिछले पद के अधिकारियों से जुड़ता है; इसलिए मूल कृदंत को स्वाभाविक हिन्दी में पूर्ण क्रिया के रूप में व्यक्त किया गया है।
