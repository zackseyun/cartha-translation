  edition: SBLGNT
  text: ⸂τῇ δὲ⸃ ἐπαύριον ⸀εἰσῆλθεν εἰς τὴν Καισάρειαν. ὁ δὲ Κορνήλιος ἦν προσδοκῶν αὐτοὺς συγκαλεσάμενος τοὺς συγγενεῖς αὐτοῦ καὶ τοὺς ἀναγκαίους φίλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: hi
  text: अगले दिन वह कैसरिया में पहुँचा।[a] कुरनेलियुस उनकी प्रतीक्षा कर रहा था और उसने अपने रिश्तेदारों और घनिष्ठ मित्रों को बुलाकर इकट्ठा किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में क्रिया एकवचन है—“वह पहुँचा”—लेकिन आगे सर्वनाम बहुवचन है—“उनकी”; संभवतः वहाँ पतरस को प्रमुख व्यक्ति मानकर उसका उल्लेख किया गया है, जबकि कुरनेलियुस पतरस और उसके साथियों की प्रतीक्षा कर रहा था।
    reason: व्याकरणिक अस्पष्टता
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: अगले दिन
  rationale: यह स्वाभाविक हिन्दी काल-सूचक वाक्यांश है, जो कथा के अगले दिन की ओर बढ़ने को स्पष्ट रखता है; δέ को अलग शब्द देकर अनावश्यक रूप से नहीं उभारा गया।
- source_word: εἰσῆλθεν εἰς τὴν Καισάρειαν
  choice: वह कैसरिया में पहुँचा
  rationale: क्रिया का एकवचन सुरक्षित रखा गया है। नगर के संदर्भ में ‘में पहुँचा’ सहज आधुनिक हिन्दी है और भीतर आने/प्रवेश करने का भाव व्यक्त करता है।
- source_word: Καισάρειαν
  choice: कैसरिया
  rationale: यूनानी स्थान-नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: ὁ δὲ Κορνήλιος
  choice: कुरनेलियुस
  rationale: δέ यहाँ केवल कथा का केंद्र कुरनेलियुस की ओर मोड़ता है; हिन्दी में अलग संयोजक के बिना विषय-परिवर्तन स्वाभाविक और पर्याप्त है।
- source_word: ἦν προσδοκῶν αὐτούς
  choice: उनकी प्रतीक्षा कर रहा था
  rationale: पर्यायवाची क्रियारचना की निरंतरता और अपेक्षापूर्ण प्रतीक्षा दोनों व्यक्त होते हैं; αὐτούς का बहुवचन ‘उनकी’ में सुरक्षित है।
- source_word: συγκαλεσάμενος
  choice: इकट्ठा बुला लिया था
  rationale: यह कुरनेलियुस द्वारा पहले ही लोगों को एक साथ बुलाने की पूर्ण हुई क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: अपने रिश्तेदारों
  rationale: συγγενεῖς के लिए स्पष्ट, वर्तमान और सामान्य हिन्दी अभिव्यक्ति।
- source_word: τοὺς ἀναγκαίους φίλους
  choice: घनिष्ठ मित्रों
  rationale: ἀναγκαῖος यहाँ शाब्दिक ‘आवश्यक’ नहीं, बल्कि निकट या अंतरंग मित्रों का बोध देता है; ‘घनिष्ठ मित्र’ गरिमामय और सटीक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमामय और सामान्य पाठकों के लिए स्पष्ट रखी गई है। एकवचन क्रिया और बहुवचन सर्वनाम के बीच मूल पाठ का तनाव मुख्य पाठ तथा पाद-टिप्पणी में सुरक्षित है।
