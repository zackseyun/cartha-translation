source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: hi
  text: और उसने हमें आज्ञा दी कि हम लोगों के बीच प्रचार करें और गंभीरता से गवाही दें कि यही वह है जिसे परमेश्वर ने जीवितों और मरे हुओं का न्यायी नियुक्त किया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे परमेश्वर ने जीवितों और मरे हुओं का न्यायी ठहराया है।”
    reason: ὁρίζω के लिए ‘नियुक्त किया’ के साथ ‘ठहराया’ भी एक संभव शाब्दिक विकल्प है।
lexical_decisions:
- source_word: παρήγγειλεν
  choice: आज्ञा दी
  rationale: यह क्रिया अधिकारपूर्वक दिए गए आदेश को व्यक्त करती है; ‘आज्ञा दी’ उसके बल को स्वाभाविक और स्पष्ट हिंदी में बनाए रखती है।
- source_word: κηρύξαι
  choice: प्रचार करें
  rationale: यह सार्वजनिक रूप से घोषणा करने का भाव रखता है। ‘प्रचार करें’ वर्तमान हिंदी बाइबलीय प्रयोग में स्वाभाविक है और केवल औपचारिक उपदेश तक सीमित नहीं है।
- source_word: τῷ λαῷ
  choice: लोगों में
  rationale: मूल पाठ में इस्राएल का नाम स्पष्ट रूप से नहीं है। ‘लोगों में’ संबोधित समुदाय के बीच सार्वजनिक प्रचार का स्वाभाविक हिंदी रूप है और पाठ से अधिक विशिष्टता नहीं जोड़ता।
- source_word: διαμαρτύρασθαι
  choice: गंभीरता से गवाही दें
  rationale: यह साधारण गवाही से अधिक आग्रहपूर्ण और गंभीर साक्ष्य देने का अर्थ रखता है; यह पदबंध दोनों पहलुओं को बनाए रखता है।
- source_word: οὗτός
  choice: यही वह है
  rationale: यह यीशु की ओर संकेत करने वाले सर्वनाम का जोर बनाए रखता है और हिंदी में स्पष्ट तथा स्वाभाविक है।
- source_word: ὁ ὡρισμένος
  choice: जिसे ... नियुक्त किया है
  rationale: पूर्ण निष्क्रिय कृदंत परमेश्वर द्वारा किए गए निश्चित नियुक्तिकरण और उसके बने रहने वाले परिणाम को व्यक्त करता है। ‘नियुक्त’ आधुनिक हिंदी में स्पष्ट है।
- source_word: ὑπὸ τοῦ θεοῦ
  choice: परमेश्वर ने
  rationale: यूनानी निष्क्रिय वाक्यांश में परमेश्वर कर्ता-अभिकर्ता है। हिंदी में सक्रिय रचना अधिक स्वाभाविक रहते हुए उसी संबंध को सुरक्षित रखती है।
- source_word: κριτὴς
  choice: न्यायी
  rationale: यह उस व्यक्ति की भूमिका बताता है जो न्याय करता है। ‘न्यायी’ इस पदवी को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ζώντων καὶ νεκρῶν
  choice: जीवितों और मरे हुओं का
  rationale: यह जोड़ी न्याय के सार्वभौमिक दायरे को व्यक्त करती है। हिंदी में यह रूप स्पष्ट है और मूल की गंभीरता बनाए रखता है।
theological_decisions:
- issue: न्याय करने के लिए यीशु की ईश्वरीय नियुक्ति
  choice: जिसे परमेश्वर ने जीवितों और मरे हुओं का न्यायी नियुक्त किया है
  alternative: जिसे परमेश्वर ने जीवितों और मरे हुओं का न्यायी ठहराया है
  rationale: पद स्पष्ट रूप से कहता है कि परमेश्वर ने यीशु को जीवितों और मृतकों का न्याय करने वाला नियुक्त किया। अनुवाद इस कथन को बनाए रखता है, पर बाद की धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। ‘प्रचार’, ‘गवाही’, ‘परमेश्वर’ और ‘न्यायी’ परिचित बाइबलीय शब्द हैं; वाक्य-विन्यास मूल के अर्थ और जोर को रखते हुए स्वाभाविक हिंदी में ढाला गया है।
