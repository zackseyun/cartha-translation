  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक गद्य। ‘अपने यहाँ ठहराया’ आतिथ्य और निवास दोनों को स्पष्ट करता है। स्थान-नाम Ἰόππη के लिए प्रचलित बाइबलीय हिंदी रूप ‘याफा’ अपनाया गया है।
