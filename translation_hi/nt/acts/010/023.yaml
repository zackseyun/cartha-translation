  text: εἰσκαλεσάμενος οὖν αὐτοὺς ἐξένισεν. Τῇ δὲ ἐπαύριον ⸀ἀναστὰς ἐξῆλθεν σὺν αὐτοῖς, καί τινες τῶν ἀδελφῶν τῶν ἀπὸ Ἰόππης συνῆλθον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: hi
  text: इसलिए उसने उन्हें भीतर बुलाया और अपने यहाँ ठहराया[a]। अगले दिन वह उठा और उनके साथ निकल पड़ा, और याफा से कुछ भाई उसके साथ गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनका अतिथि-सत्कार किया”; यूनानी क्रिया विशेष रूप से रहने की जगह देकर अतिथि-सत्कार करने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: “भाइयों” के लिए यूनानी में पुल्लिंग बहुवचन है; आरंभिक मसीही प्रयोग में यह शब्द कभी-कभी अधिक व्यापक अर्थ में “भाई-बहन” या “साथी विश्वासी” भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: भीतर बुलाया
  rationale: मध्यवाच्य कृदंत यहाँ पतरस द्वारा उन लोगों को उस घर के भीतर बुलाने का बोध कराता है; यह सहज हिंदी है और आतिथ्य के अगले कार्य से स्वाभाविक रूप से जुड़ता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले संवाद के परिणामस्वरूप हुई कार्रवाई को जोड़ता है।
- source_word: ἐξένισεν
  choice: अपने यहाँ ठहराया
  rationale: ξενίζω यहाँ अतिथियों को निवास देकर आतिथ्य करने का ठोस अर्थ रखता है; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: Τῇ δὲ ἐπαύριον
  choice: अगले दिन
  rationale: समय-क्रम बताने वाला सरल और प्रचलित हिंदी प्रयोग।
- source_word: ἀναστὰς ἐξῆλθεν
  choice: उठा और ... चल पड़ा
  rationale: 'दोनों क्रियात्मक तत्व सुरक्षित हैं: पहले उठना और फिर प्रस्थान करना। शाब्दिक ‘बाहर गया’ की अपेक्षा यात्रा के प्रसंग में ‘चल पड़ा’ अधिक स्वाभाविक है।'
- source_word: σὺν αὐτοῖς
  choice: उनके साथ
  rationale: साधारण संगति अथवा साथ यात्रा करने का सीधा अनुवाद।
- source_word: τινες
  choice: कुछ
  rationale: अनिश्चित बहुवचन का स्वाभाविक हिंदी समतुल्य।
- source_word: ἀδελφῶν
  choice: भाइयों
  rationale: यूनानी शब्द पुल्लिंग बहुवचन है; मुख्य पाठ में उसका रूप सुरक्षित रखा गया है, जबकि व्यापक आरंभिक मसीही प्रयोग की संभावना पाद-टिप्पणी में दी गई है।
- source_word: τῶν ἀπὸ Ἰόππης
  choice: याफा के ... में से
  rationale: यह उन भाइयों को याफा से संबंधित बताता है; ‘में से’ τινες की अंशसूचक संरचना को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: συνῆλθον αὐτῷ
  choice: उसके साथ गए
  rationale: संदर्भ में इसका अर्थ यात्रा में पतरस का साथ देना है।
theological_decisions:
- issue: कलीसियाई संदर्भ में ἀδελφῶν का दायरा
  choice: भाइयों
  alternative: भाई-बहन; साथी विश्वासियों
  rationale: पुल्लिंग बहुवचन को मुख्य पाठ में बनाए रखा गया है। फिर भी आरंभिक मसीही प्रयोग में यह शब्द कभी-कभी व्यापक रूप से साथी विश्वासियों को भी समेट सकता है; इसलिए इस वास्तविक अर्थ-संभावना को पाद-टिप्पणी में रखा गया है।
