  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: hi
  text: तब उसने आदेश दिया कि उन्हें यीशु मसीह के नाम पर बपतिस्मा दिया जाए। फिर उन्होंने उससे अनुरोध किया कि वह कुछ दिन ठहरे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέταξεν
  choice: आदेश दिया
  rationale: यह क्रिया अधिकारपूर्वक निर्देश देने का भाव व्यक्त करती है; ‘आदेश दिया’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से प्रबल है।
- source_word: δὲ
  choice: इसलिए
  rationale: यहाँ δέ पिछले वृत्तांत से आगे बढ़ते हुए परिणामसूचक संबंध दर्शाता है; ‘इसलिए’ प्रसंग के प्रवाह को स्पष्ट करता है।
- source_word: ἐν τῷ ὀνόματι
  choice: के नाम में
  rationale: यह मूल मुहावरे की व्यापकता बनाए रखता है, जिसमें अधिकार, संबंध और आह्वान के भाव समाए हो सकते हैं; इसे केवल ‘के अधिकार से’ कहना अर्थ को संकीर्ण कर देता।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός उपाधि है; हिन्दी में ‘मसीह’ उसका प्रचलित और अर्थपूर्ण रूप है तथा ‘यीशु मसीह’ स्वाभाविक नाम-उपाधि संरचना है।
- source_word: βαπτισθῆναι
  choice: बपतिस्मा दिया जाए
  rationale: यूनानी निष्क्रिय क्रिया-रूप को सीधे और धार्मिक परंपराओं के बीच अनावश्यक पक्ष ग्रहण किए बिना व्यक्त करता है।
- source_word: τότε
  choice: तब
  rationale: अगली घटना के क्रम को संक्षेप और स्वाभाविक ढंग से दिखाता है।
- source_word: ἠρώτησαν
  choice: अनुरोध किया
  rationale: इस प्रसंग में क्रिया साधारण प्रश्न पूछने के बजाय किसी से कुछ करने के लिए विनती करने का अर्थ रखती है।
- source_word: ἐπιμεῖναι
  choice: ठहरने
  rationale: यहाँ अर्थ किसी स्थान पर कुछ समय और बने रहने का है; ‘ठहरने’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἡμέρας τινάς
  choice: कुछ दिन
  rationale: मूल वाक्य अवधि को अनिश्चित रखता है; ‘कुछ दिन’ उसी अनिश्चितता को सुरक्षित रखता है।
theological_decisions:
- issue: बपतिस्मा-सूत्र में Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ Χριστός यीशु की उपाधि है। ‘मसीह’ हिन्दी में प्रचलित होने के साथ ‘अभिषिक्त जन’ की उपाधिगत पहचान को बनाए रखता है; ‘ख्रीष्ट’ अधिक लिप्यंतरणपरक है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘बपतिस्मा’ तथा ‘मसीह’ जैसे व्यापक रूप से पहचाने जाने वाले बाइबलीय शब्द बनाए गए हैं। दूसरे वाक्य में ‘उन्होंने’ का संदर्भ प्रसंग से स्पष्ट रहने दिया गया है, जैसा यूनानी पाठ में है।
