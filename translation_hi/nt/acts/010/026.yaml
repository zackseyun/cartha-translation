lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: उसे उठाया
  rationale: ἐγείρω का यहाँ स्वाभाविक अर्थ झुके या गिरे हुए कुरनेलियुस को उठाना है। यह क्रिया की भौतिकता बनाए रखता है, पर यह नहीं जोड़ता कि पतरस ने ठीक किस प्रकार सहायता की।
- source_word: Ἀνάστηθι
  choice: खड़े हो जाओ
  rationale: ἀνίστημι का आदेशात्मक रूप यहाँ कुरनेलियुस को अपने पैरों पर खड़ा होने का सीधा आदेश है। आधुनिक हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: καὶ ἐγὼ αὐτὸς
  choice: मैं स्वयं भी
  rationale: καί समावेश (‘भी’) और αὐτός बल (‘स्वयं’) देता है। हिन्दी में ‘मैं स्वयं भी’ दोनों तत्वों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ἄνθρωπός εἰμι
  choice: मनुष्य हूँ
  rationale: ἄνθρωπος साझा मानवता पर बल देता है। ‘मनुष्य हूँ’ सीधा और स्वाभाविक है; ‘केवल मनुष्य’ अनावश्यक रूप से ‘केवल’ जोड़ता।
- source_word: δὲ
  choice: पर
  rationale: δέ पिछले पद में कुरनेलियुस के पतरस के चरणों पर गिरने और पतरस की सुधारात्मक प्रतिक्रिया के बीच हल्का विरोध दिखाता है।
theological_decisions:
- issue: पतरस द्वारा आदरपूर्ण दण्डवत् की प्रतिक्रिया
  choice: पतरस कुरनेलियुस को उठाकर अपनी समान मानवता पर बल देता है।
  alternative: इसे किसी व्यापक धार्मिक निष्कर्ष के बिना केवल पतरस की विनम्रता की अभिव्यक्ति माना जा सकता है।
  rationale: ‘मैं स्वयं भी मनुष्य हूँ’ पाठ के स्पष्ट विरोध को बनाए रखता है, पर उपासना या धार्मिक सम्मान के विषय में कोई विकसित सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद सीधा, सम्मानजनक और सामान्य पाठकों के लिए सहज रखा गया है। ‘पतरस’ प्रचलित हिन्दी बाइबलीय नाम-रूप है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
