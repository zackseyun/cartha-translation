id: ACT.10.38
reference: Acts 10:38
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: hi
  text: नासरत के यीशु[a] के बारे में—कैसे परमेश्वर ने पवित्र आत्मा और सामर्थ्य से उनका अभिषेक किया; वे भलाई करते और उन सबको चंगा करते हुए जगह-जगह गए जो शैतान के दमन के अधीन थे, क्योंकि परमेश्वर उनके साथ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘नासरत से आए यीशु’।
    reason: ἀπὸ Ναζαρέθ को ‘नासरत के’ के बजाय उद्गम बताने वाली अभिव्यक्ति के रूप में अनूदित किया जा सकता है।
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: नासरत के यीशु को
  rationale: ἀπό मूलतः नासरत से संबंध या उद्गम बताता है। हिंदी में ‘नासरत के यीशु’ स्वाभाविक और परिचित है; कर्मकारक ‘को’ यूनानी वाक्य की पिछले पद से जुड़ी संरचना को बनाए रखता है।
- source_word: ὡς
  choice: कैसे
  rationale: यहाँ ὡς यीशु के विषय में आगे कही जाने वाली बात का परिचय देता है। ‘कैसे’ व्याख्यात्मक प्रवाह को बनाए रखता है और इसे केवल तुलनात्मक ‘जैसे’ नहीं बनाता।
- source_word: ἔχρισεν
  choice: अभिषेक किया
  rationale: यह χρίω का सीधा और धर्मवैचारिक प्रतिध्वनि बनाए रखने वाला अनुवाद है; इसमें ‘मसीहा नियुक्त किया’ जैसी अतिरिक्त व्याख्या नहीं जोड़ी गई।
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: पवित्र आत्मा और सामर्थ्य से
  rationale: दोनों दत्तिवों का साधनात्मक अर्थ ‘से’ द्वारा व्यक्त होता है। ‘सामर्थ्य’ व्यापक दिव्य सामर्थ्य को दर्शाता है, केवल चमत्कारी शक्ति तक सीमित नहीं करता।
- source_word: διῆλθεν
  choice: जगह-जगह गए
  rationale: क्रिया यीशु की भ्रमणशील सेवा का संकेत देती है। यह आधुनिक हिंदी में ‘चारों ओर घूमे’ की अपेक्षा अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: εὐεργετῶν
  choice: भलाई करते हुए
  rationale: कृदंत का अर्थ लोगों का हित करना है; ‘भलाई करना’ स्पष्ट और व्यापक हिंदी अभिव्यक्ति है।
- source_word: ἰώμενος
  choice: चंगा करते रहे
  rationale: यह निरंतर भ्रमणशील सेवा के दौरान आरोग्य देने की गतिविधि को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου
  choice: उन सबको ... जो शैतान के अत्याचार के अधीन थे
  rationale: καταδυναστεύω कठोर दमन या प्रभुत्व का बोध देता है। ‘अत्याचार के अधीन’ व्यक्तिगत शैतानी दमन को स्पष्ट करता है और उसे केवल सामान्य दुःख नहीं बनाता।
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: क्योंकि परमेश्वर उनके साथ था
  rationale: ὅτι का कारणसूचक बल स्पष्ट रखा गया है। सम्मानसूचक ‘उनके’ यीशु के लिए प्रयुक्त हिंदी सर्वनाम-शैली के अनुरूप है।
theological_decisions:
- issue: यीशु के अभिषेक और उनकी पहचान तथा मिशन का संबंध
  choice: ‘अभिषेक किया’ को बिना विस्तारात्मक धर्मसैद्धांतिक व्याख्या के बनाए रखा गया।
  alternative: ‘मसीहा ठहराया’ या केवल ‘सामर्थ्य दिया’
  rationale: मूल पाठ अभिषेक की भाषा और पवित्र आत्मा तथा सामर्थ्य को साथ रखता है। सीधा अनुवाद मसीही प्रतिध्वनि बचाता है, पर पद में न कही गई व्याख्या नहीं जोड़ता।
- issue: πνεύματι ἁγίῳ का संदर्भ
  choice: व्यक्तिगत दिव्य ‘पवित्र आत्मा’
  alternative: अव्यक्तिगत ‘पवित्र शक्ति’ या ‘पवित्र आत्मिक सामर्थ्य’
  rationale: प्रेरितों के काम में यह पदबंध सामान्यतः पवित्र आत्मा का व्यक्तिगत संदर्भ है, और यहाँ ‘सामर्थ्य’ उससे अलग भी उल्लिखित है।
- issue: ‘क्योंकि परमेश्वर उनके साथ था’ का कारणसूचक संबंध
  choice: यीशु की भलाई और चंगाई की सेवा के कारण या आधार के रूप में कथन को सुरक्षित रखा गया।
  alternative: केवल साथ होने का ढीला उल्लेख, अथवा इस कथन से यीशु की पहचान पर अतिरिक्त निष्कर्ष निकालना
  rationale: अनुवाद ὅτι की कारणसूचक भूमिका को व्यक्त करता है, पर पद की सीमा से आगे जाकर मसीह-विज्ञान को न घटाता है, न परिभाषित करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सम्मानसूचक बहुवचन सर्वनाम (‘उनका’, ‘वे’, ‘उनके’) यीशु के लिए रखे गए हैं। पद मूल यूनानी में पिछले वाक्य पर निर्भर कर्मकारक खंड है; इसलिए ‘यीशु को’ और उसके बाद का द्विबिंदु संरचनात्मक संबंध बनाए रखते हैं, जबकि अर्धविराम लंबे विवरण को पठनीय बनाता है।
