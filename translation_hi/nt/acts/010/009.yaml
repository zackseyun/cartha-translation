base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: hi
  text: अगले दिन[a], जब वे लोग यात्रा करते हुए नगर के निकट पहुँच रहे थे, तब पतरस प्रार्थना करने के लिए घर की छत पर चढ़ा, लगभग छठे घंटे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात यहूदी दिन-गणना के अनुसार दोपहर के करीब।
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: अगले दिन
  rationale: यह पदबंध अगले दिन का समय बताता है। δέ का हल्का कथात्मक संयोजक-भाव हिन्दी में स्वाभाविक प्रवाह के लिए अलग शब्द से व्यक्त नहीं किया गया।
- source_word: ὁδοιπορούντων ἐκείνων
  choice: जब वे लोग यात्रा करते हुए
  rationale: समकालिक क्रिया बताने वाले संबंध-मुक्त षष्ठी पदबंध को स्वाभाविक हिन्दी में ‘जब’ उपवाक्य से व्यक्त किया गया; ‘वे लोग’ पहले बताए गए कुरनेलियुस के दूतों की ओर संकेत करता है।
- source_word: καὶ τῇ πόλει ἐγγιζόντων
  choice: नगर के निकट पहुँच रहे थे
  rationale: ἐγγίζω के निकट आने के अर्थ तथा चल रही समकालिक क्रिया, दोनों को बनाए रखा गया है।
- source_word: ἀνέβη
  choice: चढ़ा
  rationale: घर की सपाट छत की ओर ऊपर जाने के लिए यह संक्षिप्त और स्वाभाविक हिन्दी क्रिया है।
- source_word: ἐπὶ τὸ δῶμα
  choice: घर की छत पर
  rationale: δῶμα यहाँ घर की उपयोग में आने वाली सपाट छत को दर्शाता है; ‘घर की छत’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: προσεύξασθαι
  choice: प्रार्थना करने के लिए
  rationale: यह उद्देश्यसूचक अनंत क्रिया है, इसलिए हिन्दी में ‘करने के लिए’ स्वाभाविक रूप है।
- source_word: περὶ ὥραν ἕκτην
  choice: लगभग छठे पहर
  rationale: περί की अनुमानसूचक शक्ति ‘लगभग’ से और प्राचीन समय-गणना ‘छठे पहर’ से सुरक्षित रखी गई है; आधुनिक समय का स्पष्टीकरण पादटिप्पणी में दिया गया है।
