  yaml_path: translation/nt/acts/010/006.yaml
  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: hi
  text: वह शमौन नाम के एक चर्मकार के यहाँ ठहरा हुआ है[a], जिसका घर समुद्र के किनारे है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह शमौन नाम के एक चर्मकार के यहाँ अतिथि के रूप में रह रहा है।”
    reason: ξενίζεται में केवल ठहरने के साथ-साथ किसी के द्वारा अतिथि के रूप में रखे जाने का भाव भी हो सकता है।
lexical_decisions:
- source_word: ξενίζεται
  choice: ठहरा हुआ है
  rationale: यह वर्तमान मध्य/कर्मवाच्य रूप किसी के यहाँ अतिथि के रूप में रहने या ठहरने का भाव देता है। ‘ठहरा हुआ है’ आधुनिक हिन्दी में स्वाभाविक है और अस्थायी निवास का अर्थ बनाए रखता है।
- source_word: παρά τινι
  choice: एक ... के यहाँ
  rationale: सम्प्रदान कारक के साथ παρά किसी व्यक्ति के साथ या उसके निवास-स्थान पर होने को व्यक्त करता है, और τις अनिश्चितता दर्शाता है। हिन्दी में ‘एक ... के यहाँ’ दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Σίμωνι
  choice: शमौन
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: βυρσεῖ
  choice: चर्मकार
  rationale: βυρσεύς विशेष रूप से पशु-चर्म को कमाकर तैयार करने वाले कारीगर को दर्शाता है। ‘चर्मकार’ व्यापक ‘चमड़े का काम करने वाला’ की अपेक्षा अधिक सटीक और संक्षिप्त है।
- source_word: ᾧ ἐστιν οἰκία
  choice: जिसका घर ... है
  rationale: सम्बन्धवाचक सर्वनाम और ‘घर है’ वाली रचना स्वाभाविक हिन्दी में शमौन के घर का परिचय ‘जिसका घर ... है’ से देती है।
- source_word: παρὰ θάλασσαν
  choice: समुद्र के किनारे
  rationale: कर्मकारक के साथ παρά यहाँ निकटता या समीपवर्ती स्थान बताता है। ‘समुद्र के किनारे’ हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: οὗτος
  choice: वह
  rationale: सन्दर्भ में यह सर्वनाम पहले उल्लिखित पतरस की ओर संकेत करता है; हिन्दी में ‘वह’ स्वाभाविक है।
