base_translation:
  language: en
  yaml_path: translation/nt/acts/010/045.yaml
  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: hi
  text: और खतना कराने वालों में से जो विश्वासी पतरस के साथ आए थे, वे चकित हो गए कि पवित्र आत्मा का वरदान गैर-यहूदियों पर भी उंडेला गया है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से, “खतने में से आए विश्वासी”; अर्थात यहूदी विश्वासी। अनुवाद यह भी हो सकता है: “खतना किए हुए विश्वासी।”'
    reason: lexical_alternative
  - marker: b
    text: “उंडेला गया है” यूनानी पूर्णकाल का अनुवाद है, जो पूरी हो चुकी क्रिया और उसके बने हुए परिणाम पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: चकित रह गए
  rationale: यह क्रिया यहाँ तीव्र आश्चर्य व्यक्त करती है; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: खतना-समुदाय के विश्वासी
  rationale: यह यूनानी अभिव्यक्ति यहूदी विश्वासियों को खतने से पहचाने जाने वाले समूह के रूप में दर्शाती है; केवल ‘खतना किए हुए विश्वासी’ कहने की अपेक्षा यह सामुदायिक पहचान को अधिक स्पष्ट रखती है।
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: पतरस के साथ आए ... सभी
  rationale: ὅσοι की समावेशी शक्ति को ‘सभी’ से और साथ आने के भाव को सहज हिंदी में व्यक्त किया गया है।
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: गैर-यहूदियों पर भी
  rationale: प्रसंग में ἔθνη यहूदियों से भिन्न लोगों को सूचित करता है। ‘भी’ जोड़ और आश्चर्य दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἡ δωρεὰ
  choice: वरदान
  rationale: δωρεά स्वतंत्र रूप से दी गई भेंट को सूचित करता है; पवित्र आत्मा के संदर्भ में ‘वरदान’ प्रतिष्ठित और समझने योग्य हिंदी है।
- source_word: τοῦ ἁγίου πνεύματος
  choice: पवित्र आत्मा का
  rationale: यह आधुनिक मानक हिंदी में व्यापक, संप्रदाय-निरपेक्ष रूप है।
- source_word: ἐκκέχυται
  choice: उंडेला गया है
  rationale: हिंदी का पूर्ण पक्ष ‘गया है’ पूर्ण हुई क्रिया और उसके वर्तमान परिणाम—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ἔθνη का उद्धार-ऐतिहासिक संदर्भ
  choice: गैर-यहूदी
  alternative: अन्यजाति / जातियाँ
  rationale: प्रेरितों के काम 10 में मुख्य विरोध यहूदी विश्वासियों और गैर-यहूदियों के बीच है। ‘गैर-यहूदी’ सामान्य आधुनिक पाठक के लिए संदर्भ को सबसे सीधे ढंग से स्पष्ट करता है।
- issue: ἐκκέχυται का काल-पक्ष
  choice: उंडेला गया है
  alternative: उंडेला गया था
  rationale: यूनानी पूर्णकाल पूरी हो चुकी घटना के बने हुए परिणाम पर बल देता है। हिंदी ‘गया है’ इस पक्ष को कथा-संदर्भ में स्पष्ट रूप से बनाए रखता है।
- issue: τοῦ ἁγίου πνεύματος में संबंध
  choice: पवित्र आत्मा का वरदान
  alternative: पवित्र आत्मा द्वारा दिया गया वरदान
  rationale: यूनानी संबंधकारक को जानबूझकर खुला रखा गया है; हिंदी का ‘का’ यह निश्चित नहीं करता कि पवित्र आत्मा स्वयं वरदान है या उससे संबंधित/उसके द्वारा दिया गया वरदान।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठकों के लिए स्पष्ट रखी गई है। ‘खतना-समुदाय’ स्रोत की सामूहिक पहचान को सुरक्षित रखता है, जबकि ‘गैर-यहूदी’ प्रसंगगत अर्थ को सहज हिंदी में व्यक्त करता है।
