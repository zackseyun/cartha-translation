translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। ‘रेंगनेवाले’ संयुक्त विशेषण को एक शब्द के रूप में रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ स्रोत की अर्थ-सीमा को पर्याप्त रूप से व्यक्त करता है।
