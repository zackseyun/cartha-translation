  yaml_path: translation/nt/acts/010/012.yaml
  text: In it were all the four-footed animals and reptiles of the earth[c][b][a], and birds of the sky.
translation:
  language: hi
  text: उसमें सब प्रकार के चौपाए, धरती पर रेंगनेवाले जीव और आकाश के पक्षी थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: उसमें
  rationale: संबंधवाचक पद उस चादरनुमा पात्र की ओर संकेत करता है जिसका वर्णन पिछले पद में है; ‘उसमें’ आधुनिक हिन्दी में स्वाभाविक है और स्थानवाचक अर्थ बनाए रखता है।
- source_word: ὑπῆρχεν
  choice: थे
  rationale: यहाँ अपूर्णकालीन क्रिया उस पात्र के भीतर जीवों की उपस्थिति बताती है; ‘थे’ सरल है और ‘भरे हुए थे’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: πάντα
  choice: सब प्रकार के
  rationale: नपुंसकलिंग बहुवचन πάντα सूचीबद्ध जीव-वर्गों की व्यापक समग्रता प्रकट करता है। हिन्दी में केवल ‘सब चौपाए’ प्रत्येक अलग-अलग पशु का अर्थ दे सकता है; ‘सब प्रकार के’ दर्शन की वर्गगत व्यापकता स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὰ τετράποδα
  choice: चौपाए
  rationale: ‘चौपाए’ स्पष्ट, प्रचलित और साधारण पाठक के लिए सहज है; तकनीकी ‘चतुष्पद’ की आवश्यकता नहीं है।
- source_word: ἑρπετὰ τῆς γῆς
  choice: धरती के ... रेंगनेवाले जीव
  rationale: ἑρπετά केवल आधुनिक जैविक वर्ग ‘सरीसृप’ तक सीमित नहीं है, बल्कि व्यापक रूप से जमीन पर रेंगनेवाले जीवों को दर्शा सकता है। ‘धरती के’ संबंधसूचक पद को स्पष्ट रूप से बनाए रखता है।
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: आकाश के पक्षी
  rationale: सूची के संदर्भ में πετεινά का स्वाभाविक अर्थ ‘पक्षी’ है और οὐρανός यहाँ दृश्य आकाश को दर्शाता है; इसलिए ‘आकाश’ आधुनिक हिन्दी में ‘स्वर्ग’ से अधिक उपयुक्त है।
- source_word: καὶ ... καὶ
  choice: '..., ... और ...'
  rationale: हिन्दी की स्वाभाविक सूची-रचना अपनाई गई है; इससे यूनानी के समन्वयात्मक संबंध का अर्थ बना रहता है, यद्यपि प्रत्येक καί को अलग ‘और’ से नहीं दोहराया गया।
