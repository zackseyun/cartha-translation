base_translation:
  language: en
  yaml_path: translation/nt/acts/010/032.yaml
  text: Therefore send to Joppa and summon Simon[a], who is called Peter. He is lodging in the house of Simon, a tanner[b], by the sea.
translation:
  language: hi
  text: इसलिए याफ़ा को भेजो और शमौन को बुलवा लो[a], जो पतरस कहलाता है। वह समुद्र के किनारे चमड़ा पकाने वाले शमौन के घर में अतिथि के रूप में ठहरा हुआ है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शमौन को बुलाने के लिए भेजो”; यूनानी क्रिया का अर्थ किसी को बुलवाना या बुलाने के लिए भेजना है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया से यह भाव भी मिलता है कि वह वहाँ अतिथि के रूप में ठहरा है।
    reason: lexical_nuance
lexical_decisions:
- source_word: πέμψον οὖν εἰς Ἰόππην
  choice: इसलिए याफ़ा में लोगों को भेजो
  rationale: οὖν पिछले कथन से निष्कर्ष या अगला निर्देश जोड़ता है, इसलिए ‘इसलिए’ उपयुक्त है। πέμψον का कर्म संदर्भ से समझा जाता है; स्वाभाविक हिन्दी में ‘लोगों को भेजो’ उस निहित कर्म को स्पष्ट करता है। Ἰόππη के लिए प्रचलित हिन्दी रूप ‘याफ़ा’ रखा गया है।
- source_word: μετακάλεσαι
  choice: बुलवा लो
  rationale: मध्यवाच्य क्रिया का भाव किसी को अपने पास बुलाने या बुलवाने का है। ‘बुलवा लो’ आदेश और कराए जाने—दोनों भावों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: शमौन को, जो पतरस कहलाता है
  rationale: यह पद दूसरे नाम से पहचान बताता है। ‘कहलाता है’ यूनानी की सहज और निकट अभिव्यक्ति है तथा ‘उपनाम’ जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: ξενίζεται
  choice: अतिथि के रूप में ठहरा हुआ है
  rationale: क्रिया केवल वहाँ रहने की नहीं, किसी के यहाँ आतिथ्य पाने की ओर संकेत करती है। यह अनुवाद उस भाव को स्पष्ट रखते हुए स्वाभाविक है।
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: चमड़ा पकाने वाले शमौन के घर में
  rationale: βυρσεύς कच्ची खाल को संसाधित कर चमड़ा बनाने वाले व्यक्ति को दर्शाता है। ‘चमड़ा पकाने वाला’ सामान्य पाठक के लिए ‘चर्मकार’ की अपेक्षा इस विशिष्ट पेशे को अधिक स्पष्ट करता है।
- source_word: παρὰ θάλασσαν
  choice: समुद्र के किनारे
  rationale: παρά के साथ कर्मकारक यहाँ समुद्र के पास स्थित होने का बोध देता है; ‘समुद्र के किनारे’ स्वाभाविक और सटीक हिन्दी है।
