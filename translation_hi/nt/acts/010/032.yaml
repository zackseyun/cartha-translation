  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण निर्देशात्मक रूप अपनाया गया है। नामों के लिए प्रचलित बाइबलीय हिन्दी रूप ‘याफ़ा’, ‘शमौन’ और ‘पतरस’ रखे गए हैं। पेशे को केवल ‘चर्मकार’ कहने के बजाय ‘चमड़ा पकाने वाला’ कहा गया है, ताकि βυρσεύς का विशिष्ट अर्थ सामान्य पाठक के लिए स्पष्ट रहे।
