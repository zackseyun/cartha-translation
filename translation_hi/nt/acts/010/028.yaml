language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: hi
  text: और उसने उनसे कहा, “आप लोग स्वयं जानते हैं कि किसी यहूदी पुरुष के लिए किसी अन्य जाति के व्यक्ति के साथ मेल-जोल रखना या उसके यहाँ जाना नियम-विरुद्ध है; फिर भी परमेश्वर ने मुझे दिखाया है कि मैं किसी भी मनुष्य को साधारण[a] या अशुद्ध न कहूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “साधारण” (κοινός) शुद्धता-संबंधी भाषा का शब्द है और “अशुद्ध” (ἀκάθαρτος) से अलग है; इसका अर्थ ऐसा भी समझा जा सकता है जिसे पवित्र उपयोग से बाहर या अपवित्र माना जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε πρὸς αὐτούς
  choice: और उसने उनसे कहा
  rationale: τέ को हल्के संयोजक के रूप में रखते हुए यह कथन को पिछले प्रसंग से स्वाभाविक रूप से जोड़ता है।
- source_word: Ὑμεῖς ἐπίστασθε
  choice: आप लोग स्वयं जानते हैं
  rationale: स्पष्ट सर्वनाम Ὑμεῖς के बल को ‘स्वयं’ से व्यक्त किया गया है; बहुवचन संबोधन के लिए आदरपूर्ण और स्वाभाविक हिन्दी रखी गई है।
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: नियम-विरुद्ध है
  rationale: ἀθέμιτος उस बात को दर्शाता है जो स्वीकृत धार्मिक-सामाजिक नियम के विरुद्ध या अनुमत नहीं मानी जाती; यह शब्द न तो इसे केवल अशिष्टता बनाता है, न किसी विशिष्ट लिखित व्यवस्था का अनावश्यक दावा करता है।
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: किसी यहूदी पुरुष के लिए
  rationale: यूनानी का एकवचन और स्पष्ट पुल्लिंग रूप सुरक्षित रहता है।
- source_word: κολλᾶσθαι
  choice: के साथ मेल-जोल रखना
  rationale: क्रिया का मूल भाव किसी से जुड़ने का है; सामाजिक प्रसंग में ‘मेल-जोल रखना’ सहज और सटीक है।
- source_word: ἢ προσέρχεσθαι
  choice: या उसके यहाँ जाना
  rationale: प्रसंग किसी अन्य जाति के व्यक्ति के घर आने से जुड़ा है; यह ‘पास जाना’ की अपेक्षा हिन्दी में अधिक स्वाभाविक है, पर आतिथ्य या घर में प्रवेश से अधिक कुछ नहीं जोड़ता।
- source_word: ἀλλοφύλῳ
  choice: किसी अन्य जाति के व्यक्ति
  rationale: ἀλλόφυλος का अर्थ दूसरे लोगों या जातीय समुदाय का व्यक्ति है। यह ‘गैर-यहूदी’ की सम्भावित व्याख्या को जबरन थोपे बिना मूल भाव व्यक्त करता है।
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: फिर भी परमेश्वर ने मुझे दिखाया है
  rationale: κἀμοί का संयोजक भाव यहाँ विरोध की ओर मुड़ता है; पूर्ण वर्तमान हिन्दी में उस प्रकाशन की वर्तमान प्रासंगिकता व्यक्त करता है।
- source_word: μηδένα ... ἄνθρωπον
  choice: किसी भी मनुष्य को ... न कहूँ
  rationale: यह सार्वभौमिक निषेध को स्वाभाविक हिन्दी में रखता है और ἄνθρωπος को केवल पुरुष तक सीमित नहीं करता।
- source_word: κοινὸν
  choice: साधारण
  rationale: यह κοινός और ἀκάθαρτος के बीच का शब्दगत भेद बनाए रखता है; यहाँ ‘साधारण’ शुद्धता-संबंधी अर्थ में है, जिसकी व्याख्या पादटिप्पणी में दी गई है।
- source_word: ἢ ἀκάθαρτον
  choice: या अशुद्ध
  rationale: ἀκάθαρτος के मानक शुद्धता-संबंधी अर्थ को सीधे व्यक्त करता है और पहले विशेषण में विलीन नहीं करता।
theological_decisions:
- issue: यहूदी सीमा-प्रथा और परमेश्वर के प्रकाशन का संबंध
  choice: पहले कथन को यहूदी पुरुष के लिए नियम-विरुद्ध मानी जाने वाली प्रथा के रूप में व्यक्त किया गया है, फिर परमेश्वर द्वारा किसी मनुष्य को साधारण या अशुद्ध न कहने की शिक्षा को स्पष्ट रखा गया है।
  alternative: ἀθέμιτον को केवल सामाजिक रूप से अनुचित कहना, या दोनों शुद्धता-संबंधी विशेषणों को एक ही अर्थ में मिला देना।
  rationale: पद यहूदी अलगाव की समझ और पतरस को मिले परमेश्वर के प्रकाशन के बीच तनाव रखता है। अनुवाद न पहले कथन को केवल शिष्टाचार का मामला बनाता है, न यह दावा जोड़ता है कि यह सीधे किसी विशिष्ट लिखित आज्ञा का उद्धरण है; साथ ही दर्शन के मानवीय अनुप्रयोग को ‘किसी भी मनुष्य’ पर बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, बोलचाल में समझ आने वाला रूप। पतरस के बहुवचन संबोधन के लिए ‘आप लोग’ रखा गया है। ‘अन्य जाति के व्यक्ति’ मूल के जातीय बाहरीपन को व्यक्त करता है, जबकि ‘मेल-जोल’ और ‘उसके यहाँ जाना’ सामाजिक तथा घरेलू प्रसंग को स्वाभाविक बनाते हैं।
