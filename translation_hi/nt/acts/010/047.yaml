  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: hi
  text: “क्या कोई पानी रोक सकता है कि इन लोगों को बपतिस्मा न दिया जाए? इन्होंने भी तो हमारी ही तरह पवित्र आत्मा प्राप्त किया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μήτι
  choice: क्या कोई ... कर सकता है?
  rationale: μήτι ऐसा प्रश्न प्रस्तुत करता है जिसका अपेक्षित उत्तर ‘नहीं’ है। हिन्दी में प्रसंग और प्रश्न-रचना इस नकारात्मक अपेक्षा को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: τὸ ὕδωρ
  choice: पानी
  rationale: यह बपतिस्मे के लिए आवश्यक विशिष्ट पानी को सूचित करता है। हिन्दी में ‘पानी को मना करना’ असामान्य होते हुए भी यूनानी अभिव्यक्ति की सजीवता और अस्पष्टता को बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: δύναται κωλῦσαί τις
  choice: क्या कोई ... रोकने के लिए ... मना कर सकता है
  rationale: κωλύω में रोकने, बाधा डालने या मना करने का अर्थ है। वाक्य-विन्यास पानी को न देने और बपतिस्मे को रोकने—दोनों संबंधित धारणाओं को सुरक्षित रखता है।
- source_word: τοῦ μὴ βαπτισθῆναι
  choice: बपतिस्मा लेने से रोकने के लिए
  rationale: μή सहित कर्मवाच्य आर्टिक्युलर इनफिनिटिव किसी कार्य को होने से रोकने का भाव देता है। ‘बपतिस्मा लेने’ आधुनिक हिन्दी में स्वाभाविक कर्मवाच्य-सदृश प्रयोग है।
- source_word: τούτους
  choice: इन लोगों को
  rationale: संदर्भित समूह के लिए समावेशी और स्वाभाविक आधुनिक हिन्दी।
- source_word: οἵτινες
  choice: इन्होंने
  rationale: सर्वनाम इन लोगों की पहचान उस आधार से कराता है कि उन्हें पवित्र आत्मा मिला है; अलग वाक्य हिन्दी में कारणात्मक बल को स्पष्ट और स्वाभाविक रखता है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: यह मानक आधुनिक हिन्दी बाइबलीय पद है और मूल के धार्मिक आशय को बनाए रखता है।
- source_word: ἔλαβον
  choice: पाया है
  rationale: यूनानी अओरिस्ट एक पूर्ण घटना बताता है जिसका वर्तमान तर्क में प्रभाव है; हिन्दी पूर्ण काल इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὡς καὶ ἡμεῖς
  choice: हमारी ही तरह
  rationale: ‘ही’ तुलनात्मक समानता पर बल देता है और अन्यजातियों के अनुभव को यहूदी विश्वासियों के अनुभव के समान रखता है।
theological_decisions:
- issue: पवित्र आत्मा पाने और पानी के बपतिस्मे का संबंध
  choice: पाठ स्पष्ट करता है कि इन लोगों ने पहले ही पवित्र आत्मा पाया है और इसी आधार पर पतरस उनके पानी के बपतिस्मे को रोकने का विरोध करता है।
  alternative: ऐसा अनुवाद जो आत्मा पाने और पानी के बपतिस्मे के कथात्मक क्रम को अस्पष्ट कर दे।
  rationale: यूनानी पाठ में ἔλαβον पूर्ण घटना है और प्रस्तावित बपतिस्मा अभी होना है। इस क्रम को किसी विशिष्ट सांप्रदायिक संस्कार-सिद्धांत में बदले बिना सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। अलंकारिक प्रश्न का अपेक्षित उत्तर ‘नहीं’ है। मुख्य पाठ में यूनानी की असामान्य ‘पानी को मना करना’ अभिव्यक्ति को कुछ हद तक सुरक्षित रखा गया है और पादटिप्पणी में अधिक स्वाभाविक विकल्प दिया गया है।
