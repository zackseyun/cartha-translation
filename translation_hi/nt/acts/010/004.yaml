id: ACT.10.4
reference: Acts 10:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ἀτενίσας αὐτῷ καὶ ἔμφοβος γενόμενος εἶπεν· Τί ἐστιν, κύριε; εἶπεν δὲ αὐτῷ· Αἱ προσευχαί σου καὶ αἱ ἐλεημοσύναι σου ἀνέβησαν εἰς μνημόσυνον ⸀ἔμπροσθεν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/004.yaml
  text: But he stared at him[a], and becoming afraid, said, “What is it, Lord?” And he said to him, “Your prayers and your acts of mercy have gone up as a memorial before God.”
translation:
  language: hi
  text: उसने स्वर्गदूत को ध्यान से देखा और डरकर कहा, “क्या बात है, प्रभु?” स्वर्गदूत ने उससे कहा, “तुम्हारी प्रार्थनाएँ और तुम्हारे दान परमेश्वर के सामने स्मरण के रूप में ऊपर पहुँची हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσας
  choice: ध्यान से देखा
  rationale: यह शब्द एकटक और ध्यानपूर्वक देखने का भाव देता है। ‘ध्यान से देखा’ आधुनिक हिन्दी में स्वाभाविक है और दृष्टि की तीव्रता को पर्याप्त रूप से व्यक्त करता है।
- source_word: ἔμφοβος γενόμενος
  choice: डरकर
  rationale: मूल वाक्यांश भय की अवस्था में आने को व्यक्त करता है। ‘डरकर’ हिन्दी में संक्षिप्त और स्वाभाविक रूप से उसी घटनाक्रम को बताता है, बिना भय की तीव्रता बढ़ाए।
- source_word: Τί ἐστιν
  choice: क्या बात है?
  rationale: इस प्रसंग में कुरनेलियुस पूछता है कि स्वर्गदूत के प्रकट होने का प्रयोजन क्या है। ‘क्या बात है?’ प्रत्यक्ष और स्वाभाविक हिन्दी है।
- source_word: κύριε
  choice: प्रभु
  rationale: यह सम्मानसूचक संबोधन है। ‘प्रभु’ मूल की गरिमा बनाए रखता है, पर यहाँ अपने आप में यीशु के विषय में पूर्ण मसीही अंगीकार का संकेत नहीं देता।
- source_word: προσευχαί
  choice: प्रार्थनाएँ
  rationale: यह προσευχαί का मानक, स्पष्ट हिन्दी रूप है।
- source_word: ἐλεημοσύναι
  choice: दान
  rationale: यह शब्द विशेष रूप से जरूरतमंदों को दयापूर्वक दी गई सहायता के लिए प्रयुक्त होता है। ‘दान’ सामान्य आधुनिक हिन्दी में सहज है; पाद-टिप्पणी इसके विशेष अर्थ को स्पष्ट करती है।
- source_word: ἀνέβησαν
  choice: ऊपर पहुँचे हैं
  rationale: यह अनुवाद ऊपर की ओर जाने के रूपक को बनाए रखता है और पूर्ण क्रिया के वर्तमान परिणाम को भी व्यक्त करता है।
- source_word: εἰς μνημόσυνον
  choice: स्मरण के लिए
  rationale: मूल पदबंध परमेश्वर के सामने स्मरण में आने का भाव देता है और बलिदान-संबंधी भाषा की प्रतिध्वनि रख सकता है। ‘स्मरण के लिए’ उस भाव को बिना अनावश्यक व्याख्या जोड़े सुरक्षित रखता है।
- source_word: ἔμπροσθεν τοῦ θεοῦ
  choice: परमेश्वर के सामने
  rationale: यह परमेश्वर की उपस्थिति या दृष्टि में होने का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: स्वर्गीय दूत को संबोधित करते समय κύριε का आशय
  choice: ‘प्रभु’—स्वर्गदूत के प्रति श्रद्धापूर्ण संबोधन
  alternative: ‘महोदय’ या ‘स्वामी’
  rationale: प्रसंग में यह श्रद्धापूर्ण संबोधन है; ‘प्रभु’ मूल शब्द और दृश्य की गरिमा को सुरक्षित रखता है। इससे अनिवार्य रूप से यह निष्कर्ष नहीं निकलता कि कुरनेलियुस स्वर्गदूत को परमेश्वर या यीशु मान रहा था।
- issue: εἰς μνημόσυνον में स्मरण का भाव
  choice: ‘स्मरण के लिए’
  alternative: ‘स्मरण-भेंट के रूप में’
  rationale: मूल भाषा बलिदान-संबंधी स्मरण की प्रतिध्वनि दे सकती है, किंतु स्पष्ट रूप से ‘भेंट’ नहीं कहती। इसलिए अधिक विशिष्ट धार्मिक अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक शैली सरल, स्वाभाविक और गरिमापूर्ण रखी गई है। संदर्भ की स्पष्टता के लिए दोनों जगह सर्वनाम के स्थान पर ‘स्वर्गदूत’ रखा गया है।
