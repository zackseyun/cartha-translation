  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τούτῳ πάντες οἱ προφῆται μαρτυροῦσιν, ἄφεσιν ἁμαρτιῶν λαβεῖν διὰ τοῦ ὀνόματος αὐτοῦ πάντα τὸν πιστεύοντα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: hi
  text: सभी भविष्यद्वक्ता उसी के विषय में यह गवाही देते हैं[a] कि जो कोई उस पर विश्वास करता है, वह उसके नाम के द्वारा पापों की क्षमा पाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभी भविष्यद्वक्ता उसके संबंध में साक्षी देते हैं।”
    reason: τούτῳ और μαρτυροῦσιν के संबंध का एक निकट, अधिक औपचारिक अनुवाद प्रस्तुत करता है।
lexical_decisions:
- source_word: τούτῳ
  choice: उसी के विषय में
  rationale: μαρτυροῦσιν के साथ यह दत्तिव रूप यीशु के विषय में दी गई गवाही को व्यक्त करता है। ‘उसी’ निकटवर्ती संदर्भ में यीशु की ओर संकेत को स्पष्ट रखता है।
- source_word: πάντες οἱ προφῆται
  choice: सभी भविष्यद्वक्ता
  rationale: यह समस्त भविष्यद्वक्ताओं की साक्षी का स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: μαρτυροῦσιν
  choice: गवाही देते हैं
  rationale: यह क्रिया के साक्ष्यात्मक भाव को सहज, वर्तमान हिन्दी में बनाए रखता है।
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: पापों की क्षमा
  rationale: यह नए नियम की इस स्थापित अभिव्यक्ति का स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: λαβεῖν
  choice: पाता है
  rationale: अनंत क्रिया यहाँ भविष्यद्वक्ताओं की गवाही की विषयवस्तु बताती है; हिन्दी में सामान्य सत्य के रूप में ‘पाता है’ स्वाभाविक है और ‘प्राप्त करता है’ से अधिक सहज है।
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: उसके नाम के द्वारा
  rationale: यह मूल के माध्यम-सूचक वाक्यांश और बाइबिलीय ‘नाम’ की व्यापक अर्थवत्ता को रखता है, बिना उसे केवल ‘अधिकार’ कहकर सीमित किए।
- source_word: πάντα τὸν πιστεύοντα
  choice: जो कोई ... विश्वास करता है
  rationale: एकवचन पुल्लिंग कृदंत यहाँ सार्वभौमिक और लिंग-समावेशी अर्थ रखता है; ‘जो कोई’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: εἰς αὐτόν
  choice: उस पर
  rationale: πιστεύω εἰς का भाव किसी व्यक्ति की ओर निर्देशित भरोसा है; हिन्दी में ‘उस पर विश्वास करना’ इसका स्वाभाविक समतुल्य है।
theological_decisions:
- issue: क्षमा का दायरा और विश्वास से उसका संबंध
  choice: जो कोई यीशु पर विश्वास करता है, वह उसके नाम के द्वारा पापों की क्षमा पाता है।
  alternative: इसे उद्धार की प्रक्रिया के विषय में अधिक विस्तृत धर्मसैद्धांतिक शब्दों में समझाना।
  rationale: अनुवाद यीशु, विश्वास और क्षमा के बीच मूल पाठ में कही गई बात को सुरक्षित रखता है और किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: सार्वभौमिक पुल्लिंग कृदंत
  choice: जो कोई ... विश्वास करता है
  alternative: हर वह पुरुष जो विश्वास करता है
  rationale: यूनानी पुल्लिंग एकवचन यहाँ केवल पुरुषों तक सीमित नहीं, बल्कि प्रत्येक विश्वास करने वाले व्यक्ति के लिए प्रयुक्त है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गवाही देते हैं,’ ‘उस पर विश्वास करता है,’ और ‘पापों की क्षमा पाता है’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि ‘उसके नाम के द्वारा’ मूल की बाइबिलीय अभिव्यक्ति को सुरक्षित रखता है।
