  yaml_path: translation/nt/acts/010/011.yaml
  text: and he sees heaven opened[a], and something like a large sheet descending, being lowered by its four corners to the earth[c][b],
translation:
  language: hi
  text: और वह स्वर्ग को खुला हुआ[a] और एक बड़ी चादर जैसी कोई वस्तु[b] नीचे उतरती हुई देखता है, जो अपने चारों कोनों[c] से पृथ्वी की ओर उतारी जा रही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आकाश को खुला हुआ।” यूनानी शब्द का अर्थ “आकाश” या “स्वर्ग” दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “कोई वस्तु” के लिए प्रयुक्त यूनानी पद का अनुवाद “कोई पात्र” भी हो सकता है; वह जानबूझकर अनिश्चित है।
    reason: lexical_alternative
  - marker: c
    text: या “अपने चारों सिरों से नीचे छोड़ी जा रही है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: देखता है
  rationale: ऐतिहासिक वर्तमान की जीवंतता बनाए रखने के लिए वर्तमान काल रखा गया है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: स्वर्ग को खुला हुआ
  rationale: οὐρανός का अर्थ ‘आकाश’ या ‘स्वर्ग’ हो सकता है; दर्शन और प्रकाशन के इस प्रसंग में ‘स्वर्ग’ उपयुक्त है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: καταβαῖνον
  choice: नीचे उतरती हुई
  rationale: वर्तमान कृदन्त वस्तु की जारी अधोगति बताता है; ‘नीचे उतरती हुई’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: σκεῦός τι
  choice: कोई वस्तु
  rationale: σκεῦος व्यापक और τι अनिश्चित है; ‘कोई वस्तु’ पात्र या बरतन जैसी अनावश्यक विशिष्टता जोड़े बिना इस अनिश्चितता को बनाए रखता है।
- source_word: ὡς ὀθόνην μεγάλην
  choice: बड़ी चादर के समान
  rationale: ὡς की उपमा और ὀθόνη के चादर/बड़े कपड़े वाले अर्थ को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है; कपड़े की सामग्री निर्धारित नहीं की गई।
- source_word: τέσσαρσιν ἀρχαῖς
  choice: अपने चारों कोनों से
  rationale: ἀρχή यहाँ सिरों या छोरों के अर्थ में है; चादर-जैसी वस्तु के संदर्भ में ‘कोनों’ सबसे स्वाभाविक है।
- source_word: καθιέμενον
  choice: उतारी जा रही है
  rationale: निष्क्रिय वर्तमान कृदन्त को जारी क्रिया के रूप में व्यक्त किया गया है; इससे καταβαῖνον की सामान्य अधोगति और καθιέμενον के उतारे जाने का भेद बना रहता है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: नीचे की ओर गति के साथ ἐπί लक्ष्य या गंतव्य दर्शाता है; ‘पृथ्वी पर’ व्यापक अर्थ और दर्शन की गरिमा बनाए रखता है।
theological_decisions:
- issue: दर्शन के संदर्भ में οὐρανός का अनुवाद
  choice: स्वर्ग
  alternative: आकाश
  rationale: वस्तु ऊपर से एक ईश्वरीय दर्शन में उतरती है, इसलिए ‘स्वर्ग’ प्रकाशनात्मक आयाम को बनाए रखता है; फिर भी यूनानी शब्द की वास्तविक वैकल्पिक संभावना पादटिप्पणी में दी गई है।
