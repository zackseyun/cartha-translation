id: ACT.10.15
reference: Acts 10:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ φωνὴ πάλιν ἐκ δευτέρου πρὸς αὐτόν· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/015.yaml
  text: 'And a voice came to him again a second time: “What God has made clean[a], you must not call common.”'
translation:
  language: hi
  text: और फिर दूसरी बार उससे एक आवाज़ ने कहा, “जिसे परमेश्वर ने शुद्ध किया है, उसे तुम अपवित्र[a] न ठहराओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “साधारण न ठहराओ” अथवा “अशुद्ध न मानो।”
    reason: κοινόω यहाँ किसी वस्तु को सामान्य, धार्मिक रूप से अपवित्र या अशुद्ध मानने के अर्थ में प्रयुक्त हो सकता है।
lexical_decisions:
- source_word: φωνὴ
  choice: एक आवाज़
  rationale: अनिश्चित संज्ञा का स्वाभाविक हिन्दी रूप; ध्यान स्वर्गीय वाणी के दोबारा सुनाई देने पर है, वक्ता को किसी उपाधि से पहचानने पर नहीं।
- source_word: πάλιν ἐκ δευτέρου
  choice: फिर दूसरी बार
  rationale: यूनानी के दोनों पुनरावृत्ति-सूचक पदों को सहज हिन्दी में रखते हुए उसके बल को सुरक्षित करता है।
- source_word: πρὸς αὐτόν
  choice: उससे ... कहा
  rationale: पतरस को संबोधित वाणी के लिए स्वाभाविक हिन्दी प्रयोग।
- source_word: Ἃ
  choice: जिसे
  rationale: नपुंसकलिंग बहुवचन संबंधवाचक सर्वनाम यहाँ सामान्य और सामूहिक अर्थ देता है; हिन्दी में ‘जिसे’ इस कथन को स्वाभाविक रूप से व्यक्त करता है और दृश्य में भोजन तथा आगे लोगों पर होने वाले अनुप्रयोग—दोनों के लिए खुला रहता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: एकमात्र परमेश्वर के लिए प्रचलित, गरिमापूर्ण और सहज हिन्दी पद।
- source_word: ἐκαθάρισεν
  choice: शुद्ध किया है
  rationale: परमेश्वर के निर्णायक कार्य और उसके वर्तमान परिणाम को व्यक्त करता है तथा विधि-संबंधी शुद्धता की प्रतिध्वनि बनाए रखता है।
- source_word: σὺ
  choice: तुम
  rationale: यूनानी के स्पष्ट सर्वनाम का हल्का बल बनाए रखते हुए आधुनिक मानक हिन्दी में सम्मानजनक और स्वाभाविक संबोधन देता है।
- source_word: μὴ κοίνου
  choice: अपवित्र न ठहराओ
  rationale: κοινόω के विधि-संबंधी अर्थ—सामान्य/अपवित्र मानना—को व्यक्त करता है, साथ ही इसे ἀκάθαρτος के अधिक सीधे समकक्ष ‘अशुद्ध’ से अलग रखता है। ‘ठहराओ’ पतरस द्वारा किसी वस्तु की धार्मिक स्थिति निर्धारित करने के भाव को दर्शाता है।
theological_decisions:
- issue: पतरस के दर्शन में शुद्धता-संबंधी भाषा
  choice: मुख्य पाठ में ‘अपवित्र न ठहराओ’
  alternative: ‘साधारण न ठहराओ’ या ‘अशुद्ध न मानो’
  rationale: यह καθαρίζω और κοινόω के बीच का विरोध सुरक्षित रखता है। ‘अशुद्ध’ अर्थ की व्याख्या करता है, पर κοινός और ἀκάθαρτος के भेद को कुछ हद तक समतल कर सकता है; ‘साधारण’ अधिक शाब्दिक है, पर आधुनिक हिन्दी में धार्मिक अशुद्धता का आशय तुरंत स्पष्ट नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण प्रत्यक्ष वचन। ‘तुम’ सामान्य आधुनिक संबोधन है; ‘अपवित्र न ठहराओ’ शुद्धता-विषयक अर्थ और मूल्यांकन की क्रिया दोनों को बनाए रखता है।
