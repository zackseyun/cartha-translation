    reason: lexical_alternative
lexical_decisions:
- source_word: συνομιλῶν
  choice: बातचीत करते हुए
  rationale: वर्तमानकालिक कृदन्त मुख्य क्रिया के साथ-साथ चल रही बातचीत को व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: αὐτῷ
  choice: उससे
  rationale: συνομιλέω के साथ सम्प्रदान कारक बातचीत के दूसरे सहभागी को दर्शाता है; हिन्दी में ‘उससे बातचीत’ पारस्परिक संवाद का स्वाभाविक प्रयोग है।
- source_word: εἰσῆλθεν
  choice: वह भीतर गया
  rationale: अनिश्चित भूतकाल की मुख्य क्रिया घटनाक्रम में अगले कदम को बताती है; ‘भीतर गया’ घर में प्रवेश को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: εὑρίσκει
  choice: उसने ... पाया
  rationale: यूनानी में सजीव वर्णन के लिए ऐतिहासिक वर्तमान है, पर स्वाभाविक हिन्दी कथा में इसे सामान्य भूतकाल से व्यक्त किया गया है।
- source_word: συνεληλυθότας
  choice: इकट्ठा
  rationale: पूर्णकालिक कृदन्त लोगों के पहले से एकत्र होकर उपस्थित होने की परिणामी अवस्था दर्शाता है; ‘इकट्ठा पाया’ इसे संक्षेप और स्वाभाविकता से व्यक्त करता है।
- source_word: πολλούς
  choice: बहुत-से लोगों को
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त होकर अनेक व्यक्तियों को सूचित करता है; हिन्दी में स्पष्टता के लिए ‘लोगों’ जोड़ा गया है।
