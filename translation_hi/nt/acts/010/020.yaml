source:
  edition: SBLGNT
  text: ἀλλὰ ἀναστὰς κατάβηθι καὶ πορεύου σὺν αὐτοῖς μηδὲν διακρινόμενος, ⸀ὅτι ἐγὼ ἀπέσταλκα αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: hi
  text: परन्तु उठ, नीचे जा और उनके साथ बिना हिचकिचाए चला जा[a], क्योंकि मैंने ही उन्हें भेजा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई भेद किए बिना”; यूनानी कृदन्त का अर्थ “संदेह या हिचकिचाहट न करना” अथवा “भेद न करना” हो सकता है। दूसरा अर्थ इस अध्याय में यहूदी और गैर-यहूदी के विषय से जुड़ा हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: परन्तु
  rationale: यह पतरस की पिछली उलझन से विपरीत दिशा में तत्काल कार्य करने का निर्देश देता है; ‘परन्तु’ संक्षिप्त और स्वाभाविक विरोधसूचक है।
- source_word: ἀναστὰς
  choice: उठ
  rationale: यह कृदन्त अगले आदेशों के साथ आदेशात्मक क्रम में है और तत्काल उठकर कार्य करने का भाव देता है।
- source_word: κατάβηθι
  choice: नीचे जा
  rationale: क्रिया छत पर स्थित पतरस के वहाँ से नीचे जाने की वास्तविक दिशा को बनाए रखती है।
- source_word: πορεύου
  choice: चला जा
  rationale: यह गमन की आज्ञा है; ‘उनके साथ चला जा’ साथ यात्रा करने का अर्थ सहज रूप से व्यक्त करता है।
- source_word: σὺν αὐτοῖς
  choice: उनके साथ
  rationale: यह संदेशवाहकों के साथ जाने का सीधा और स्वाभाविक अनुवाद है।
- source_word: μηδὲν διακρινόμενος
  choice: बिना कुछ संदेह किए
  rationale: तात्कालिक प्रसंग में διακρίνομαι पतरस की उलझन के बीच संदेह या हिचकिचाहट न करने को सूचित करता है। ‘कुछ’ μηδέν की व्यापक निषेधात्मक शक्ति को व्यक्त करता है; भेद न करने का संभव अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पतरस को साथ जाने की आज्ञा का कारण प्रस्तुत करता है।
- source_word: ἐγὼ
  choice: मैंने ही
  rationale: यूनानी में व्यक्त सर्वनाम ἐγώ पर बल है; हिन्दी का ‘ही’ इस बल को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπέσταλκα
  choice: भेजा है
  rationale: पूर्ण काल भेजने के संपन्न कार्य और उसके वर्तमान परिणाम—उन पुरुषों का वहाँ उपस्थित होना—दोनों को व्यक्त करता है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: यह नीचे आए संदेशवाहकों के लिए प्रयुक्त सीधा कर्मवाचक सर्वनाम है।
theological_decisions:
- issue: μηδὲν διακρινόμενος का अर्थ और गैर-यहूदियों को सम्मिलित किए जाने से उसका संबंध
  choice: मुख्य पाठ में ‘बिना कुछ संदेह किए’ रखा गया है, जो पतरस को बिना हिचकिचाहट आज्ञा मानने पर बल देता है।
  alternative: ‘कोई भेद किए बिना’ अथवा ‘बिना हिचकिचाए’
  rationale: तात्कालिक कथा में पतरस दर्शन को लेकर उलझन में है और आत्मा उसे आए हुए पुरुषों के साथ जाने का निर्देश देता है, इसलिए संदेह या हिचकिचाहट का अर्थ प्रबल है। फिर भी पूरे अध्याय में यहूदी और गैर-यहूदी के बीच भेद न करने का विषय उपस्थित है। इस वास्तविक अर्थगत और धर्मवैज्ञानिक तनाव को मिटाने के बजाय वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष आदेशात्मक शैली अपनाई गई है। एकवचन आज्ञार्थक रूप मूल पाठ के संबोधन को बनाए रखते हैं। अस्पष्ट यूनानी कृदन्त का तात्कालिक अर्थ मुख्य पाठ में और उसका प्रसंगानुकूल वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
