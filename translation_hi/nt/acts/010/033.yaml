source:
  edition: SBLGNT
  text: ἐξαυτῆς οὖν ἔπεμψα πρὸς σέ, σύ τε καλῶς ἐποίησας παραγενόμενος. νῦν οὖν πάντες ἡμεῖς ἐνώπιον τοῦ θεοῦ πάρεσμεν ἀκοῦσαι πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: hi
  text: इसलिए मैंने तुरन्त[a] आपको बुलवा भेजा, और आपने यहाँ आकर अच्छा किया। अब तो हम सब परमेश्वर के सामने उपस्थित हैं, ताकि हम वह सब सुनें जो प्रभु[b] ने आपको आज्ञा दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बिना देर किए।’
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘प्रभु’। संदर्भ में इसका संकेत सम्भवतः यीशु की ओर है, यद्यपि कुछ लोग इसे अधिक सामान्य रूप से परमेश्वर के लिए समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: तुरन्त
  rationale: यह क्रियाविशेषण बिना विलंब के तत्काल किए गए कार्य को बताता है; ‘तुरन्त’ सहज और सटीक आधुनिक हिन्दी है।
- source_word: οὖν
  choice: इसलिए
  rationale: पहला οὖν पिछली बात से निष्कर्ष और अगली कार्रवाई को जोड़ता है।
- source_word: ἔπεμψα πρὸς σέ
  choice: आपको बुलवा भेजा
  rationale: संदर्भ में कुरनेलियुस ने पतरस को बुलाने के लिए दूत भेजे थे; यह हिन्दी मुहावरा उस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: σύ τε καλῶς ἐποίησας παραγενόμενος
  choice: और आपने यहाँ आकर अच्छा किया
  rationale: यह पतरस के आने की सराहना करने वाले यूनानी मुहावरे का स्वाभाविक और निकट हिन्दी रूप है।
- source_word: νῦν οὖν
  choice: अब
  rationale: यह सभा के उद्देश्य की ओर संवाद का संक्रमण दिखाता है; हिन्दी में ‘अब’ पर्याप्त और स्वाभाविक है।
- source_word: πάντες ἡμεῖς
  choice: हम सब
  rationale: यह एकत्र पूरे समूह पर दिए गए बल को बनाए रखता है।
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर के सामने
  rationale: यह परमेश्वर की सचेत उपस्थिति में होने का गंभीर भाव बनाए रखता है।
- source_word: πάρεσμεν
  choice: उपस्थित हैं
  rationale: यह ‘मौजूद होना’ का गरिमापूर्ण और स्वाभाविक हिन्दी रूप है।
- source_word: ἀκοῦσαι
  choice: ताकि ... सुनें
  rationale: उद्देश्यसूचक infinitive को हिन्दी में ‘ताकि’ उपवाक्य द्वारा स्पष्ट रूप से व्यक्त किया गया है।
- source_word: πάντα τὰ προστεταγμένα σοι
  choice: वह सब ... जिसकी आज्ञा ... आपको दी है
  rationale: यह पूर्णता और अधिकारपूर्वक दिए गए निर्देश—दोनों को सुरक्षित रखता है।
- source_word: ὑπὸ τοῦ κυρίου
  choice: प्रभु ने
  rationale: कर्तृवाच्य हिन्दी अधिक स्वाभाविक है और ‘प्रभु’ मूल κύριος को बिना उसके संदर्भ को अधिक स्पष्ट किए बनाए रखता है।
theological_decisions:
- issue: τοῦ κυρίου (‘प्रभु’) का संदर्भ
  choice: मुख्य पाठ में केवल ‘प्रभु’ रखा गया है।
  alternative: इसे संदर्भानुसार ‘परमेश्वर’ समझना, या व्याख्यात्मक रूप से ‘प्रभु यीशु’ कहना।
  rationale: यूनानी पाठ केवल κύριος कहता है। संदर्भ में यीशु सम्भावित हैं, पर स्पष्ट नाम जोड़ना मूल की वास्तविक अस्पष्टता को मिटा देगा।
