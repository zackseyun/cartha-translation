  register: आधुनिक मानक हिन्दी; आदरसूचक ‘आप’; सहज पर गरिमापूर्ण कथन। ‘बुलवा भेजा’ दूत भेजकर बुलाने के प्रसंग को स्वाभाविक ढंग से व्यक्त करता है।
