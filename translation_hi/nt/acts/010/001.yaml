- source_word: ὀνόματι Κορνήλιος
  choice: कुरनेलियुस नाम का
  rationale: ὀνόματι के साथ नाम का स्वाभाविक हिन्दी रूप; यूनानी नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: ἑκατοντάρχης
  choice: शतपति
  rationale: रोमी सेना के इस ऐतिहासिक अधिकारी-पद के लिए संक्षिप्त और सटीक हिन्दी पद; अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐκ σπείρης
  choice: सैन्य टुकड़ी का
  rationale: σπεῖρα रोमी सेना की ‘कोहोर्ट’ नामक इकाई को दर्शाता है। मुख्य पाठ में बोधगम्य हिन्दी और पादटिप्पणी में ऐतिहासिक विवरण दिया गया है।
- source_word: τῆς καλουμένης Ἰταλικῆς
  choice: “इताली पलटन” कहलाने वाली
  rationale: καλουμένης का अर्थ “कहलाने वाली” रखा गया है और Ἰταλικῆς को सैन्य इकाई के नाम के रूप में प्रस्तुत किया गया है।
