  yaml_path: translation/nt/acts/010/037.yaml
  text: You yourselves know the thing that happened throughout all Judea[a], beginning from Galilee after the baptism that John proclaimed[b],
translation:
  language: hi
  text: तुम स्वयं उस बात को जानते हो जो पूरे यहूदिया में हुई[a], जिसका आरम्भ गलील से उस बपतिस्मे के बाद हुआ जिसका प्रचार यूहन्ना ने किया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस वचन/संदेश को जो पूरे यहूदिया में फैल गया।” यूनानी ῥῆμα का अर्थ ‘वचन’, ‘संदेश’, ‘बात’ या ‘मामला’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल यूनानी में “आरम्भ” के लिए प्रयुक्त कृदंत का पूर्ववर्ती शब्द से व्याकरणिक संबंध असहज है, पर आशय स्पष्ट है कि इस बात का आरम्भ गलील से हुआ।
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ὑμεῖς οἴδατε
  choice: उसे तुम स्वयं जानते हो
  rationale: स्पष्ट सर्वनाम ὑμεῖς के बल को ‘तुम स्वयं’ से व्यक्त किया गया है; οἴδατε का यहाँ वर्तमान अर्थ है।
- source_word: τὸ γενόμενον ῥῆμα
  choice: जो बात ... हुई
  rationale: ῥῆμα का अर्थ ‘वचन’, ‘संदेश’, ‘बात’ या ‘मामला’ हो सकता है। γενόμενον के साथ ‘बात ... हुई’ घटनाओं और उनके विषय में फैले संदेश—दोनों की गुंजाइश रखता है और हिन्दी में स्वाभाविक है।
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: सारे यहूदिया में
  rationale: κατά और संबंधकारक यहाँ पूरे क्षेत्र में विस्तार को दर्शाते हैं; यह हिन्दी प्रयोग व्यापकता को बनाए रखता है।
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: वह गलील से आरम्भ हुई
  rationale: ग्रीक कृदंत का वाक्यगत संबंध असहज है, पर आरम्भ-बिंदु गलील स्पष्ट है। हिन्दी में अलग वाक्य द्वारा अर्थ स्वाभाविक रखा गया है, बिना कर्ता के विषय में अतिरिक्त दावा किए।
- source_word: μετὰ τὸ βάπτισμα
  choice: उस बपतिस्मे के बाद
  rationale: μετά के कर्मकारक के साथ समय-संबंध ‘के बाद’ है; βάπτισμα के लिए प्रचलित और स्पष्ट ‘बपतिस्मा’ रखा गया है।
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: जिसका प्रचार यूहन्ना ने किया था
  rationale: κηρύσσω की सार्वजनिक घोषणा का भाव ‘प्रचार किया’ से स्वाभाविक हिन्दी में व्यक्त होता है; नाम का मानक हिन्दी रूप ‘यूहन्ना’ है।
theological_decisions:
- issue: पतरस के सारांश में ῥῆμα का अर्थ
  choice: ‘बात’—जिसमें सार्वजनिक घटना और उसके विषय का संदेश दोनों समा सकते हैं
  alternative: ‘वचन’, ‘संदेश’ या ‘घटना’
  rationale: संदर्भ किसी एक कथन तक सीमित नहीं है, फिर भी केवल ‘घटना’ कहने से ῥῆμα का संदेश-संबंधी अर्थ दब सकता है। ‘बात’ मूल की व्यापकता और अस्पष्टता को बेहतर बनाए रखता है।
- issue: ἀρξάμενος का वाक्यगत संबंध
  choice: पूर्वोक्त ‘बात’ को हिन्दी में ‘वह ... आरम्भ हुई’ के रूप में ग्रहण किया गया
  alternative: इसे किसी निहित पुरुष कर्ता से जोड़ना या शाब्दिक कृदंत ‘आरम्भ होते हुए’ रखना
  rationale: मूल में पुल्लिंग कृदंत और नपुंसकलिंग ῥῆμα का मेल असहज है। स्पष्ट अर्थ को रखते हुए हिन्दी वाक्य को सहज बनाया गया है, पर किसी विशेष निहित कर्ता को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘तुम स्वयं’ से मूल का बल रखा गया है। लंबे और असहज यूनानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है; अर्थगत अस्पष्टता को पादटिप्पणियों में सुरक्षित रखा गया है।
