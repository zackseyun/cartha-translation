  text: And they called out and asked whether Simon[a], who is called Peter, was staying here.
translation:
  language: hi
  text: उन्होंने पुकारकर पूछा कि क्या शमौन, जो पतरस कहलाता है, यहीं अतिथि के रूप में ठहरा हुआ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνήσαντες
  choice: बाहर से पुकारकर
  rationale: क्रिया-विशेषणात्मक कृदन्त मुख्य प्रश्न से पहले पुकारने की क्रिया बताता है। प्रसंग में आगन्तुक घर के बाहर से भीतर वालों को पुकार रहे हैं; ‘बाहर से पुकारकर’ इसे स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἐπυνθάνοντο
  choice: पूछा
  rationale: अपूर्ण भूतकाल पूछताछ की चलती या प्रयत्नशील क्रिया दर्शा सकता है, पर इस संक्षिप्त कथात्मक क्रम में सामान्य हिन्दी ‘पूछा’ स्वाभाविक है और प्रसंगगत अर्थ बनाए रखता है।
- source_word: εἰ
  choice: क्या
  rationale: यह अप्रत्यक्ष प्रश्न का परिचय देता है। हिन्दी में ‘पूछा कि क्या’ इसका स्वाभाविक और सटीक रूप है।
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: शमौन, जो पतरस कहलाता है
  rationale: यह दोनों नामों को सुरक्षित रखते हुए वर्तमान कर्मवाच्य पहचान को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐνθάδε
  choice: यहीं
  rationale: स्थानसूचक अर्थ ‘यहाँ’ है; प्रश्न के संदर्भ में ‘यहीं’ उस घर पर हल्का और स्वाभाविक बल देता है।
- source_word: ξενίζεται
  choice: अतिथि के रूप में ठहरा हुआ है
  rationale: यह क्रिया केवल ठहरने से अधिक, किसी के यहाँ अतिथि बनकर आवास पाने का भाव रखती है। यह हिन्दी रूप आतिथ्य-संबंधी अर्थ को स्पष्ट रखते हुए सहज है।
