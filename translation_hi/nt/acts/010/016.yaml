  text: This happened three times[b][a], and immediately the vessel was taken up into heaven.
translation:
  language: hi
  text: यह तीन बार हुआ, और तुरंत वह वस्तु[a] स्वर्ग[b] में उठा ली गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह चादर।” यूनानी शब्द का सामान्य अर्थ “पात्र” या “वस्तु” है, पर पहले का प्रसंग इसे चादर-जैसी वस्तु बताता है।
    reason: lexical_alternative
  - marker: b
    text: या, “आकाश में।” यूनानी शब्द का अर्थ “आकाश” या “स्वर्ग,” दोनों हो सकता है; इस दर्शन के प्रसंग में “स्वर्ग” अधिक उपयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο
  choice: यह
  rationale: यह नपुंसकलिंग संकेतवाचक सर्वनाम पिछली दृष्टि में घटी पूरी घटना की ओर संकेत करता है; ‘यह’ स्वाभाविक और संक्षिप्त है।
- source_word: δὲ
  choice: —
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है; हिन्दी में अलग शब्द जोड़ने के बजाय वाक्य-प्रवाह में समाहित करना अधिक स्वाभाविक है।
- source_word: ἐγένετο
  choice: हुआ
  rationale: γίνομαι का यहाँ घटनासूचक प्रयोग है; ‘हुआ’ सहज आधुनिक हिन्दी है।
- source_word: ἐπὶ τρίς
  choice: तीन बार
  rationale: यह पद घटना की तीन बार पुनरावृत्ति बताता है; ‘तीन बार’ स्पष्ट और प्रचलित अभिव्यक्ति है।
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह क्रिया के बिना विलम्ब घटित होने को व्यक्त करता है और कथा की आकस्मिक गति बनाए रखता है।
- source_word: ἀνελήμφθη
  choice: उठा लिया गया
  rationale: ἀναλαμβάνω के अओरिस्ट कर्मवाच्य रूप और ऊपर की दिशा, दोनों को यह अभिव्यक्ति सुरक्षित रखती है।
- source_word: τὸ σκεῦος
  choice: वह पात्र
  rationale: σκεῦος का अर्थ व्यापक रूप से पात्र, साधन या वस्तु हो सकता है। ‘पात्र’ मूल शब्द की व्यापकता रखता है; प्रसंग में चादर-जैसी वस्तु होने की सूचना पादटिप्पणी में दी गई है।
- source_word: εἰς τὸν οὐρανόν
  choice: स्वर्ग में
  rationale: εἰς गंतव्य की ओर गति दर्शाता है। इस दर्शन के प्रसंग में οὐρανός के लिए ‘स्वर्ग’ उपयुक्त है, यद्यपि ‘आकाश’ भी शब्दार्थ की दृष्टि से सम्भव है।
theological_decisions:
- issue: पतरस के दर्शन में οὐρανός का आशय
  choice: स्वर्ग
  alternative: आकाश
  rationale: οὐρανός दोनों अर्थ रख सकता है, पर इस प्रकाशनात्मक दर्शन में वस्तु का वहीं लौटना जहाँ से वह उतरी थी, ‘स्वर्ग’ को अधिक प्रसंगानुकूल बनाता है। वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
