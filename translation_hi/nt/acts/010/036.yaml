translation:
  language: hi
  text: उस संदेश को जो उसने इस्राएल के पुत्रों को भेजा था और जिसमें यीशु मसीह के द्वारा शांति का शुभ समाचार सुनाया गया था—वही सबका प्रभु है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों को।” यह पारंपरिक पदबंध इस्राएल के लोगों को सामूहिक रूप से दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: उस संदेश को
  rationale: यहाँ λόγος किसी एक शब्द के बजाय परमेश्वर द्वारा भेजी गई घोषणा की विषयवस्तु को दर्शाता है। कर्मकारक रूप को ‘को’ के साथ रखा गया है, जिससे मूल वाक्य की संरचना और निकटवर्ती संदर्भ से उसका संबंध बना रहता है।
- source_word: ὃν ἀπέστειλεν
  choice: जो उसने ... भेजा
  rationale: संबंधवाचक उपवाक्य को स्वाभाविक हिन्दी में रखा गया है। कर्ता मूल में व्यक्त नहीं है; निकटवर्ती संदर्भ से वह परमेश्वर है, इसलिए नाम जोड़कर अस्पष्टता दूर नहीं की गई।
- source_word: τοῖς υἱοῖς Ἰσραὴλ
  choice: इस्राएल की संतानों के पास
  rationale: यह सामूहिक बाइबलीय पदबंध इस्राएल के लोगों को सूचित करता है। ‘संतानों’ से वंशगत संबंध बना रहता है और आधुनिक हिन्दी में स्त्री-पुरुष दोनों सम्मिलित होते हैं।
- source_word: εὐαγγελιζόμενος
  choice: शुभ समाचार सुनाते हुए
  rationale: क्रिया में केवल घोषणा नहीं, शुभ समाचार की घोषणा का भाव स्पष्ट है; इसलिए इसे ‘सुनाते हुए’ मात्र नहीं किया गया। कृदंत-संरचना रखी गई है ताकि मूल में इसके व्याकरणिक संबंध को अनावश्यक रूप से निश्चित न किया जाए।
- source_word: εἰρήνην
  choice: शांति
  rationale: यह सीधा और प्रचलित समतुल्य है, जिसमें मेल-मिलाप और कुशलता की व्यापक बाइबलीय ध्वनि भी बनी रहती है।
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह के द्वारा
  rationale: διά के साधनात्मक भाव को ‘के द्वारा’ व्यक्त किया गया है। Χριστός यहाँ पदवी के रूप में है, जिसके लिए हिन्दी का स्थापित अर्थानुवाद ‘मसीह’ उपयुक्त है।
- source_word: οὗτός
  choice: वही
  rationale: ‘वही’ साधारण ‘वह’ की अपेक्षा यूनानी संकेतवाचक के बलाघात को स्वाभाविक हिन्दी में अधिक अच्छी तरह बनाए रखता है।
- source_word: πάντων κύριος
  choice: सबका प्रभु
  rationale: ‘सबका’ सार्वभौमिक अधिकार को सीधे व्यक्त करता है और ‘प्रभु’ κύριος का धार्मिक तथा अधिकारसूचक भार बनाए रखता है।
theological_decisions:
- issue: Χριστός को पदवी या नाम की तरह प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: इस प्रसंग में Χριστός यीशु की मसीही पदवी को व्यक्त करता है। ‘मसीह’ अर्थ और यहूदी-मसीही संदर्भ दोनों को स्पष्ट रखते हुए हिन्दी में स्थापित रूप है।
- issue: οὗτός ἐστιν πάντων κύριος के बलाघात को रखना
  choice: वही सबका प्रभु है
  alternative: वह सबका प्रभु है
  rationale: οὗτός यीशु पर विशेष बल देता है। ‘वही’ उस बल को बनाए रखता है, पर मूल से आगे कोई नया सिद्धान्त नहीं जोड़ता।
- issue: εὐαγγελιζόμενος का कर्ता और संबंध
  choice: कृदंत रूप ‘शुभ समाचार सुनाते हुए’
  alternative: उसने ... शुभ समाचार सुनाया
  rationale: मूल का कृदंत मुख्यतः परमेश्वर के संदेश भेजने से जुड़ता है, किंतु हिन्दी में पूर्ण उपवाक्य बनाने से संबंध अधिक निश्चित हो जाता। कृदंत रूप मूल की संक्षिप्तता और कुछ संरचनात्मक खुलापन बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उस संदेश को’ मूल के कर्मकारक और पिछले प्रसंग से जुड़े वाक्य-विन्यास को सुरक्षित रखता है; इसलिए यह पद अकेले पढ़ने पर कुछ अपूर्ण-सा लग सकता है। ‘वही’ से οὗτός का बलाघात रखा गया है।
