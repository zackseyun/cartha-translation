  text: οὐ παντὶ τῷ λαῷ ἀλλὰ μάρτυσι τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ, ἡμῖν, οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/041.yaml
  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: hi
  text: सभी लोगों को नहीं, बल्कि उन गवाहों को जिन्हें परमेश्वर ने पहले से चुन रखा था[a]—अर्थात् हमें, जिन्होंने उसके मरे हुओं में से जी उठने[b] के बाद उसके साथ खाया-पिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्हें परमेश्वर ने पहले से नियुक्त कर रखा था।”
    reason: lexical_alternative
  - marker: b
    text: या, “जब उसे मरे हुओं में से जिलाया गया था।” यहाँ यूनानी का स्वाभाविक अनुवाद “उसके जी उठने के बाद” है, यद्यपि नए नियम में अन्य स्थानों पर कर्मवाच्य अभिव्यक्ति भी मिलती है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: सभी लोगों को नहीं
  rationale: यह वाक्यांश उन लोगों के दायरे को बताता है जिन्हें यीशु दिखाई दिए; यह आगे आने वाले सीमित गवाह-समूह के साथ मूल विरोध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: μάρτυσι
  choice: गवाहों को
  rationale: प्रेरितों के काम में यह शब्द सामान्यतः प्रत्यक्ष अनुभव के आधार पर गवाही देने वालों के लिए आता है; ‘गवाह’ स्पष्ट और प्रचलित हिन्दी शब्द है।
- source_word: τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ
  choice: जिन्हें परमेश्वर ने पहले से चुन रखा था
  rationale: पूर्णकालिक कर्मवाच्य कृदंत पहले हुए दैवी चयन और उसके बने रहने वाले परिणाम को व्यक्त करता है। ‘चुन रखा था’ इसे स्वाभाविक हिन्दी में दर्शाता है; ‘पहले से नियुक्त किया था’ भी संभव है।
- source_word: ἡμῖν
  choice: अर्थात् हमको
  rationale: यह ‘गवाहों’ का समानाधिकरण करते हुए उनकी पहचान बताता है। ‘अर्थात्’ हिन्दी में इस स्पष्टीकरण को स्पष्ट करता है।
- source_word: οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: जिन्होंने ... उसके साथ खाया-पिया
  rationale: συν-युक्त क्रियाएँ साथ बैठकर भोजन और पेय ग्रहण करने की ठोस सहभागिता पर बल देती हैं; ‘उसके साथ खाया-पिया’ संक्षिप्त और सहज है।
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: उसके मरे हुओं में से जी उठने के बाद
  rationale: μετά के साथ यह रचना समयसूचक ‘के बाद’ है; ἀναστῆναι यहाँ अकर्मक अर्थ में ‘जी उठना’ और ἐκ νεκρῶν ‘मरे हुओं में से’ को व्यक्त करता है।
theological_decisions:
- issue: ἀναστῆναι αὐτὸν ἐκ νεκρῶν में पुनरुत्थान की अभिव्यक्ति
  choice: उसके मरे हुओं में से जी उठने के बाद
  alternative: जब परमेश्वर ने उसे मरे हुओं में से जिलाया, उसके बाद
  rationale: मूल यूनानी रूप यहाँ स्वाभाविक रूप से यीशु के ‘जी उठने’ को व्यक्त करता है। इससे पुनरुत्थान में परमेश्वर की भूमिका का निषेध नहीं होता; यह केवल इसी पद की अभिव्यक्ति का अनुसरण करता है और वैकल्पिक कर्मवाच्य अर्थ को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘मरे हुओं में से’ मूल यूनानी पुनरुत्थान-अभिव्यक्ति को बनाए रखता है, और ‘खाया-पिया’ साझा भोजन की ठोस तथा सामान्य बोलचाल की छवि देता है।
