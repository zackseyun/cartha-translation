base_translation:
  language: en
  yaml_path: translation/nt/acts/010/008.yaml
  text: And after explaining everything to them, he sent them to Joppa.
translation:
  language: hi
  text: और उन्हें सारी बातें समझाने के बाद उसने उन्हें याफ़ा भेज दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: समझाने के बाद
  rationale: यह अओरिस्ट मध्यवाच्य कृदंत मुख्य क्रिया से पहले पूरी हुई क्रिया को व्यक्त करता है। ‘समझाने के बाद’ स्वाभाविक आधुनिक हिन्दी में विस्तार से पूरा वृत्तांत बताने का भाव व्यक्त करता है।
- source_word: ἅπαντα
  choice: सारी बातें
  rationale: नपुंसकलिंग बहुवचन यहाँ समूचे प्रसंग या सभी बातों को सूचित करता है। ‘सारी बातें’ हिन्दी में ‘सब कुछ’ की अपेक्षा इस संदर्भ में अधिक स्वाभाविक है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: सम्प्रदान कारक सर्वनाम ἐξηγησάμενος के अप्रत्यक्ष कर्म को दर्शाता है; हिन्दी में ‘उन्हें’ इसका सहज रूप है।
- source_word: ἀπέστειλεν
  choice: उसने ... भेज दिया
  rationale: ἀποστέλλω का सामान्य अर्थ ‘भेजना’ है। ‘भेज दिया’ पूर्ववर्ती विवरण के बाद प्रस्थान की पूर्ण क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अनावश्यक तात्कालिकता जोड़े।
- source_word: εἰς τὴν Ἰόππην
  choice: याफ़ा
  rationale: εἰς गंतव्य की ओर गति बताता है। हिन्दी में ‘भेजना’ के साथ गंतव्य को सीधे ‘याफ़ा’ कहना स्वाभाविक है। स्थान-नाम का रूप आधुनिक हिन्दी बाइबलीय प्रचलन और मूल नाम के निकट रखा गया है।
