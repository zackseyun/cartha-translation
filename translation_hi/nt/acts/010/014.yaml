review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Peter’s emphatic refusal (Μηδαμῶς), the respectful but contextually open address κύριε (“प्रभु”), the causal ὅτι (“क्योंकि”), and the claim that he has never eaten anything characterized as κοινόν and ἀκάθαρτον. “अपवित्र और अशुद्ध” preserves the two coordinated Greek terms without collapsing them into one category.
  naturalness: “कदापि नहीं” is understandable but is elevated/archaizing rather than natural modern standard Hindi dialogue. “बिलकुल नहीं” conveys the same emphatic refusal in idiomatic contemporary Hindi. “कोई अपवित्र और अशुद्ध वस्तु” is otherwise clear and suitable.
  terminology: “प्रभु,” “अपवित्र,” and “अशुद्ध” are appropriate. “अपवित्र” is a contextually sound rendering of κοινόν here (ritually/profanely common), while “अशुद्ध” renders ἀκάθαρτον. The coordinated “और” should remain because the SBLGNT text has καὶ.
