  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: hi
  text: पर पतरस ने कहा, “बिलकुल नहीं, प्रभु! क्योंकि मैंने कभी कोई अपवित्र और अशुद्ध वस्तु नहीं खाई।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: कदापि नहीं
  rationale: यह पतरस के तीव्र निषेध को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κύριε
  choice: प्रभु
  rationale: सम्बोधन की धार्मिक और कथात्मक अस्पष्टता को बनाए रखता है; यह तय नहीं करता कि पतरस वक्ता को किस रूप में पहचानता है।
- source_word: κοινὸν
  choice: अपवित्र
  rationale: यहाँ शब्द का अर्थ सामान्यतः धार्मिक रीति से अपवित्र या निषिद्ध है, केवल ‘सामान्य’ नहीं।
- source_word: ἀκάθαρτον
  choice: अशुद्ध
  rationale: भोजन-संबंधी धार्मिक अशुद्धता के लिए प्रचलित और सटीक हिन्दी पद है।
- source_word: καὶ
  choice: और
  rationale: SBLGNT के संयोजक को उसके साधारण संयुक्त अर्थ में रखा गया है, जिससे ‘अपवित्र और अशुद्ध’ दोनों विशेषण एक ही वस्तु का वर्णन कर सकते हैं।
- source_word: ὅτι
  choice: क्योंकि
  rationale: पतरस के निषेध के लिए दिए गए कारण को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: κοινὸν καὶ ἀκάθαρτον के बीच संबंध
  choice: अपवित्र और अशुद्ध
  alternative: अपवित्र या अशुद्ध
  rationale: दिए गए SBLGNT पाठ में καὶ है; इसलिए संयुक्त ‘और’ को सुरक्षित रखा गया है, बिना दोनों श्रेणियों के संबंध को अतिरिक्त रूप से समझाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद में दृढ़ता और आदर दोनों रखे गए हैं। ‘कोई ... वस्तु’ भोजन के व्यापक संदर्भ को स्वाभाविक बनाता है, जबकि मूल के अर्थ से आगे नहीं जाता।
