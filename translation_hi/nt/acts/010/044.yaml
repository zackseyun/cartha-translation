  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: hi
  text: पतरस अभी ये बातें कह ही रहा था कि पवित्र आत्मा वचन सुन रहे सभी लोगों पर उतर आया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र आत्मा वचन सुनने वाले सभी लोगों पर आ पड़ा।”
    reason: ἐπέπεσε की अधिक शाब्दिक और चित्रात्मक अभिव्यक्ति।
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: पतरस अभी ... कह ही रहा था कि
  rationale: यूनानी संबंधवाचक स्वतंत्र रचना और वर्तमान कृदंत जारी क्रिया तथा मुख्य घटना की समकालिकता दिखाते हैं; यह हिंदी रूप उसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰ ῥήματα ταῦτα
  choice: ये बातें
  rationale: यहाँ ῥήματα पतरस के अभी बोले जा रहे कथनों को सूचित करता है; ‘ये बातें’ आधुनिक हिंदी में स्वाभाविक है और बहुवचन भाव बनाए रखता है।
- source_word: ἐπέπεσε
  choice: उतर आया
  rationale: ἐπιπίπτω का चित्रात्मक अर्थ किसी पर अचानक आने का है। पवित्र आत्मा के संदर्भ में ‘उतर आया’ स्वाभाविक हिंदी है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: यह आधुनिक मानक हिंदी में प्रचलित और सटीक पद है।
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: सुनने वाले सभी लोगों पर
  rationale: यह रूप ἐπί के संबंध और πάντας की समावेशिता को स्पष्ट रखते हुए वर्तमान कृदंत से व्यक्त तत्कालीन श्रवण को बनाए रखता है।
- source_word: τὸν λόγον
  choice: वचन
  rationale: ‘वचन’ λόγος से निकट lexical correspondence रखता है और संदर्भ में पतरस द्वारा सुनाए जा रहे संदेश को दर्शाता है।
theological_decisions:
- issue: पवित्र आत्मा की क्रिया ἐπέπεσε का अनुवाद
  choice: पवित्र आत्मा उतर आया
  alternative: पवित्र आत्मा उन पर आ पड़ा
  rationale: मुख्य पाठ स्वाभाविक और गरिमामय हिंदी देता है, जबकि पादटिप्पणी यूनानी क्रिया की अधिक चित्रात्मक अभिव्यक्ति सुरक्षित रखती है; किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
- issue: λόγος का अर्थ
  choice: वचन
  alternative: संदेश
  rationale: ‘वचन’ मूल शब्द के साथ निकटता और लूका के कथन की धार्मिक गूंज बनाए रखता है, जबकि इस संदर्भ में उसका आशय सुनाया जा रहा संदेश है।
translation_notes:
  register: आधुनिक मानक हिंदी; सहज, गरिमामय और सामान्य पाठक के लिए स्पष्ट। ‘कह ही रहा था कि’ अचानक घटित मुख्य घटना और चल रहे भाषण की समकालिकता व्यक्त करता है।
