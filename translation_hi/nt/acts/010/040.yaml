lexical_decisions:
- source_word: τοῦτον
  choice: इसी को
  rationale: वाक्य के आरम्भ में रखा संकेतवाचक सर्वनाम यीशु पर विशेष बल देता है। ‘इसी को’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: कर्ता के रूप में प्रयुक्त सामान्य बाइबलीय पद; हिन्दी में निश्चित उपपद की आवश्यकता नहीं है।
- source_word: ἤγειρεν
  choice: जिलाया
  rationale: पुनरुत्थान के प्रसंग में ἐγείρω का अर्थ मृतकों में से जीवित करना है। ‘जिलाया’ संक्षिप्त, प्रचलित और स्रोत के दैवी कर्तृत्व को स्पष्ट रखने वाला अनुवाद है।
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: तीसरे दिन
  rationale: कालवाचक दत्तिव का स्वाभाविक हिन्दी रूप; दिन-गणना को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: ἔδωκεν
  choice: होने दिया
  rationale: पूरक infinitive के साथ δίδωμι यहाँ किसी बात को घटित होने देने अथवा प्रदान करने का भाव रखता है। ‘होने दिया’ हिन्दी में स्वाभाविक है और इसे सीधे ‘प्रकट किया’ कहकर रचना को समतल नहीं करता।
- source_word: αὐτὸν
  choice: उसे
  rationale: यीशु की ओर संकेत करने वाला कर्मकारक सर्वनाम।
- source_word: ἐμφανῆ
  choice: प्रकट
  rationale: ἐμφανής का अर्थ दिखाई देने योग्य, प्रत्यक्ष या प्रकट है। यहाँ ‘प्रकट’ पुनरुत्थान के बाद दिखाई देने के प्रसंग में स्वाभाविक है।
- source_word: γενέσθαι
  choice: होने
  rationale: γίνομαι के ‘होना/हो जाना’ भाव को सहायक क्रिया-रचना ‘प्रकट होने दिया’ में सुरक्षित रखा गया है।
theological_decisions:
- issue: पुनरुत्थान में परमेश्वर का कर्तृत्व
  choice: इसी को परमेश्वर ने तीसरे दिन जिलाया
  alternative: परमेश्वर ने उसे तीसरे दिन जीवित किया
  rationale: स्रोत स्पष्ट रूप से परमेश्वर को यीशु को जिलाने वाला बताता है। ‘इसी को’ आरम्भिक संकेतवाचक के बल को भी बनाए रखता है।
- issue: पुनरुत्थान के बाद यीशु का प्रकट होना
  choice: उसे प्रकट होने दिया
  alternative: उसे प्रत्यक्ष किया
  rationale: यूनानी पाठ पुनरुत्थान और उसके बाद दिखाई देने को अलग-अलग कथनों में रखता है। चुना हुआ रूप ἔδωκεν ... ἐμφανῆ γενέσθαι की विशेष रचना को यथासंभव सुरक्षित रखता है, जबकि वैकल्पिक रूप दैवी कारणता को अधिक प्रत्यक्ष ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘इसी को’ सामान्य बोलचाल से थोड़ा अधिक बलयुक्त है, पर स्रोत के अग्रस्थ संकेतवाचक का बल सुरक्षित रखता है। ‘जिलाया’ बाइबलीय हिन्दी में परिचित और संक्षिप्त है; ‘प्रकट होने दिया’ स्रोत की असामान्य किंतु अर्थपूर्ण रचना को स्वाभाविक सीमा तक बनाए रखता है।
