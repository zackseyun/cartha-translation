  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: hi
  text: और अब आदमियों को याफा भेज और शमौन नाम के एक व्यक्ति को बुलवा, जो पतरस कहलाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  choice: और अब
  rationale: यह προηγούμε कथन से संबंध और वर्तमान निर्देश—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πέμψον
  choice: भेज
  rationale: एकवचन आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἄνδρας
  choice: कुछ आदमियों को
  rationale: मूल में स्पष्ट पुल्लिंग बहुवचन है; 'कुछ' हिन्दी में अनिश्चित व्यक्तियों के इस उल्लेख को स्वाभाविक बनाता है, यद्यपि Greek में अलग से 'कुछ' नहीं है।
- source_word: εἰς Ἰόππην
  choice: याफा
  rationale: दिशा का भाव 'भेज' के साथ परसर्ग 'को' से स्पष्ट होता है; Ἰόππη के लिए प्रचलित हिन्दी बाइबलीय स्थाननाम 'याफा' रखा गया है।
- source_word: μετάπεμψαι
  choice: बुलवा
  rationale: मध्यवाच्य आज्ञार्थक का आशय किसी को भेजकर उस व्यक्ति को अपने पास बुलाने का है; 'बुलवा' इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Σίμωνά τινα
  choice: शमौन नाम के एक व्यक्ति को
  rationale: τινα का अनिश्चित, किंतु पहचाने जा सकने वाले व्यक्ति का भाव आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त होता है; 'एक निश्चित शमौन' कृत्रिम होता।
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: जो पतरस कहलाता है
  rationale: यह उसके प्रचलित दूसरे नाम का भाव सीधे रखता है और 'उपनाम' जैसी अधिक विशिष्ट व्याख्या से बचता है।
