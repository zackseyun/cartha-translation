    text: या, ‘परमेश्वर का भय माननेवाला था।’ यह अभिव्यक्ति इस्राएल के परमेश्वर की उपासना करने वाले किसी गैर-यहूदी के लिए प्रचलित परिचय भी हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘बहुत-से दान।’ यूनानी शब्द प्रायः जरूरतमंदों को दिए जाने वाले दान के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβὴς
  choice: भक्त
  rationale: यह शब्द धार्मिक जीवन में प्रकट श्रद्धा और भक्ति को व्यक्त करता है। ‘भक्त’ आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: φοβούμενος τὸν θεὸν
  choice: परमेश्वर का भय मानता था
  rationale: यह अनुवाद यूनानी क्रियात्मक अभिव्यक्ति और बाइबिलीय मुहावरे को बनाए रखता है; यहाँ भय में श्रद्धा और आदर का भाव निहित है।
- source_word: σὺν παντὶ τῷ οἴκῳ αὐτοῦ
  choice: अपने सारे घराने सहित
  rationale: οἶκος यहाँ भवन नहीं, बल्कि परिवार और आश्रितों से बने पूरे घरेलू समुदाय का बोध कराता है।
- source_word: ποιῶν ἐλεημοσύνας πολλὰς
  choice: बहुत दान देता था
  rationale: शाब्दिक ‘बहुत-से दान के काम करता था’ की अपेक्षा यह स्वाभाविक हिन्दी है और जरूरतमंदों की सहायता हेतु दान देने का आशय स्पष्ट करती है।
- source_word: τῷ λαῷ
  choice: लोगों को
  rationale: सम्प्रदान कारक दान पाने वाले लाभार्थियों को सूचित करता है; ‘लोगों को’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: δεόμενος τοῦ θεοῦ
  choice: परमेश्वर से प्रार्थना करता था
  rationale: δέομαι में विनती या याचना का भाव है; इस प्रसंग में ‘प्रार्थना करता था’ स्पष्ट और स्वाभाविक है, जबकि ‘से’ प्रार्थना के लक्ष्य को दर्शाता है।
- source_word: διὰ παντός
  choice: निरन्तर
  rationale: यह मुहावरा नियमित और सतत अभ्यास बताता है; ‘निरन्तर’ बिना हर क्षण अविच्छिन्न क्रिया का अनावश्यक दावा किए उस भाव को व्यक्त करता है।
theological_decisions:
- issue: कुरनेलियुस के लिए परमेश्वर-भय सम्बन्धी अभिव्यक्ति
  choice: परमेश्वर का भय मानता था
  alternative: परमेश्वर का भय माननेवाला था; परमेश्वर का आदर करता था
  rationale: मुख्य पाठ यूनानी की क्रियात्मक अभिव्यक्ति और श्रद्धापूर्ण भय, दोनों को सुरक्षित रखता है। साथ ही पाद-टिप्पणी यह संभावना खुली रखती है कि यह इस्राएल के परमेश्वर की उपासना करने वाले गैर-यहूदी का पहचाना हुआ वर्णन भी हो सकता है।
