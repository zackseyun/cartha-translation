translation:
  language: hi
  text: वह धर्मपरायण था और अपने सारे घराने सहित परमेश्वर का भय मानता था[a], लोगों को बहुत-से दान देता था[b] और निरन्तर परमेश्वर से प्रार्थना करता था।
  philosophy: optimal-equivalence
  footnotes:
