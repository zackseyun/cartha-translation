  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली अपनाई गई है। वर्णनात्मक यूनानी कृदन्त-श्रृंखला को स्वाभाविक हिन्दी के अपूर्ण भूतकालीन वाक्यों में व्यक्त किया गया है। ‘घराना’ सामाजिक घरेलू इकाई को और ‘परमेश्वर का भय मानना’ बाइबिलीय श्रद्धाभाव को बनाए रखता है।
