- source_word: ἐν ἑαυτῷ διηπόρει
  choice: अपने मन में उलझन में था
  rationale: ἐν ἑαυτῷ आंतरिक विचार को और अपूर्णकालीन διηπόρει जारी गहरी असमंजस को व्यक्त करता है।
- source_word: τί ἂν εἴη
  choice: उसका क्या अर्थ हो सकता है
  rationale: शाब्दिक रूप से ‘वह क्या हो सकता है’ संभव है, पर संदर्भ में पतरस दर्शन का अभिप्राय समझने का प्रयास कर रहा है; पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: τὸ ὅραμα ὃ εἶδεν
  choice: उसने जो दर्शन देखा था
  rationale: ‘दर्शन’ ὅραμα का प्रचलित और संदर्भानुकूल धार्मिक-आख्यानात्मक शब्द है; ‘देखा था’ कथाक्रम की पूर्वता दिखाता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह उल्लेखनीय और आकस्मिक कथात्मक विकास की ओर पाठक का ध्यान खींचता है।
- source_word: οἱ ἄνδρες οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: कुरनेलियुस के भेजे हुए पुरुष
  rationale: वयस्क पुरुषों का संकेत और कर्मवाच्य संबंध दोनों स्पष्ट रखे गए हैं।
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: शमौन के घर का पता पूछते-पूछते
  rationale: यह दर्शाता है कि उन्होंने पूछताछ करके घर खोजा; हिंदी में यह पूर्ववर्ती क्रिया और खोज की प्रक्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπέστησαν ἐπὶ τὸν πυλῶνα
  choice: द्वार पर आ खड़े हुए
  rationale: ἐπέστησαν में पहुँचकर किसी स्थान पर खड़े होने का भाव है; ‘आ खड़े हुए’ दोनों पहलुओं को संक्षेप में व्यक्त करता है।
theological_decisions:
