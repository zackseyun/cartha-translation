  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: hi
  text: जब पतरस मन-ही-मन उलझन में था कि उसने जो दर्शन देखा था उसका क्या अर्थ हो सकता है[a], इतने में कुरनेलियुस के भेजे हुए लोग शमौन के घर का पता पूछकर द्वार[b] पर आ खड़े हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने जो दर्शन देखा था, वह क्या हो सकता है।” यूनानी को अधिक शाब्दिक रूप से इस प्रकार अनुवाद किया जा सकता है, पर यहाँ संभवतः दर्शन के अर्थ या महत्त्व की बात है।
    reason: lexical_alternative
  - marker: b
    text: या, “प्रवेश-द्वार” या “फाटक।” यूनानी शब्द घर के द्वार या प्रवेश-क्षेत्र का संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
