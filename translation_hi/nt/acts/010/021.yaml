  yaml_path: translation/nt/acts/010/021.yaml
  text: So Peter went down to the men and said[a], “Look, I am the one you are looking for. Why are you here?”
translation:
  language: hi
  text: तब पतरस नीचे उतरकर उन पुरुषों से कहा, “देखिए, जिसे आप ढूँढ़ रहे हैं, वह मैं ही हूँ। आप यहाँ किस कारण आए हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβὰς
  choice: नीचे उतरकर
  rationale: यह क्रिया पतरस के ऊपरी स्थान से नीचे उपस्थित आगंतुकों के पास उतरने को व्यक्त करती है; कृदंत का स्वाभाविक हिन्दी रूप रखा गया है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ प्रबल विरोध नहीं, बल्कि कथा की अगली घटना को चिह्नित करता है।
- source_word: πρὸς τοὺς ἄνδρας
  choice: उन पुरुषों से
  rationale: संदर्भ में पतरस उनके पास जाकर उन्हें संबोधित करता है; हिन्दी में ‘से कहा’ स्वाभाविक है।
- source_word: Ἰδοὺ
  choice: देखिए
  rationale: ἰδού ध्यान आकर्षित करने वाला संवाद-सूचक है; आदरसूचक बहुवचन संबोधन के अनुरूप ‘देखिए’ वर्तमान और स्वाभाविक है।
- source_word: ἐγώ εἰμι ὃν ζητεῖτε
  choice: जिसे आप ढूँढ़ रहे हैं, वह मैं ही हूँ
  rationale: यह संरचना सम्बन्धवाचक उपवाक्य और ἐγώ पर पड़े पहचान-संबंधी बल दोनों को सहज हिन्दी में बनाए रखती है।
- source_word: τίς ἡ αἰτία δι’ ἣν πάρεστε
  choice: आपके यहाँ आने का कारण क्या है?
  rationale: αἰτία के स्पष्ट ‘कारण’ को बनाए रखते हुए πάρεστε की उपस्थित/आ पहुँचे होने की संदर्भगत धारणा को स्वाभाविक हिन्दी में व्यक्त करता है।
