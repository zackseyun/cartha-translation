  text: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον, συναντήσας αὐτῷ ὁ Κορνήλιος πεσὼν ἐπὶ τοὺς πόδας προσεκύνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/025.yaml
  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: hi
  text: जब पतरस भीतर आया, तो कुरनेलियुस उससे मिला और उसके चरणों में गिरकर उसे दण्डवत् प्रणाम किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी आराधना की।” यूनानी क्रिया प्रसंग के अनुसार आराधना करने या दण्डवत् होकर श्रद्धा प्रकट करने—दोनों अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν
  choice: जब ... भीतर आया, तो
  rationale: यह यूनानी कथात्मक मुहावरे के काल-संबंध और δέ के संयोजक प्रवाह को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘ऐसा हुआ कि’ जोड़ना अनावश्यक रूप से शाब्दिक होता।
- source_word: εἰσελθεῖν τὸν Πέτρον
  choice: पतरस भीतर आया
  rationale: एओरिस्ट क्रिया को एक साधारण पूर्ण घटना के रूप में व्यक्त किया गया है और हिन्दी में कर्ता को स्वाभाविक स्थान दिया गया है।
- source_word: συναντήσας αὐτῷ
  choice: कुरनेलियुस उससे मिला
  rationale: यह कृदन्त से व्यक्त भेंट की क्रिया को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: उसके चरणों में गिरकर
  rationale: यह शारीरिक मुद्रा और विनम्रता के संकेत दोनों को बनाए रखता है; ‘चरणों में’ इस प्रसंग में dignified और सहज हिन्दी है।
- source_word: προσεκύνησεν
  choice: उसे दण्डवत किया
  rationale: προσκυνέω यहाँ भूमि पर झुककर अत्यधिक आदर प्रकट करने से लेकर आराधना तक अर्थ दे सकता है। ‘दण्डवत किया’ दृश्य क्रिया और श्रद्धापूर्ण भाव को सुरक्षित रखता है, पर मुख्य पाठ में केवल दैवी आराधना का अर्थ थोपता नहीं। वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: पतरस के प्रति προσκυνέω का अर्थ
  choice: उसे दण्डवत किया
  alternative: उसकी आराधना की
  rationale: शब्द का अर्थ-क्षेत्र दण्डवत होकर सम्मान देने और आराधना करने दोनों को समेट सकता है। अगले पद में पतरस इस कृत्य को यह कहकर रोकता है कि वह भी मनुष्य है; इसलिए मुख्य पाठ कृत्य की गंभीरता बनाए रखता है, जबकि यह पहले से तय नहीं करता कि कुरनेलियुस का आशय निश्चित रूप से दैवी आराधना ही था।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज कथात्मक वाक्य रखा गया है। ‘पतरस’ और ‘कुरनेलियुस’ प्रचलित हिन्दी बाइबलीय नाम-रूप हैं। ‘चरणों’ और ‘दण्डवत’ से गरिमापूर्ण लेकिन सामान्य पाठक के लिए बोधगम्य शैली मिलती है।
