translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और बोलचाल में सहज रखी गई है। ‘बिना कोई आपत्ति किए’ मूल यूनानी के प्रतिवाद न करने वाले अर्थ को स्पष्ट करता है; ‘चला आया’ हिन्दी में आगमन को स्वाभाविक रूप से व्यक्त करता है।
