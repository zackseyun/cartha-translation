base_translation:
  language: en
  yaml_path: translation/nt/acts/010/029.yaml
  text: Therefore I came without objection when I was sent for[a]. So I ask[b], for what reason did you send for me?
translation:
  language: hi
  text: 'इसलिए, जब मुझे बुलाया गया, तो मैं बिना कोई आपत्ति किए चला आया। अब मैं पूछता हूँ[a]: आपने मुझे किस कारण बुलाया?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो मैं पूछता हूँ।” यूनानी शब्द यहाँ निष्कर्ष या अगले प्रश्न की ओर संक्रमण का भाव देता है।
    reason: discourse_ambiguity
lexical_decisions:
- source_word: διὸ καὶ
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्ष प्रकट करता है। καί का हल्का बल हिन्दी वाक्य-प्रवाह में समाहित है; अलग से ‘भी’ कहना अस्वाभाविक होता।
- source_word: ἀναντιρρήτως
  choice: बिना कोई आपत्ति किए
  rationale: यह यूनानी क्रियाविशेषण विरोध, प्रतिवाद या आपत्ति न करने का भाव देता है; यह ‘बिना हिचकिचाए’ से अधिक निकट है।
- source_word: ἦλθον
  choice: चला आया
  rationale: वक्ता का श्रोताओं के पास आने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μεταπεμφθείς
  choice: जब मुझे बुलाया गया
  rationale: निष्क्रिय कृदन्त का अर्थ किसी को बुलवा भेजना या बुलाना है; हिन्दी में यह रूप स्पष्ट और सहज है।
- source_word: πυνθάνομαι οὖν
  choice: इसलिए मैं पूछता हूँ
  rationale: οὖν निष्कर्ष अथवा अगले प्रश्न की ओर संक्रमण दिखाता है और πυνθάνομαι पूछने या जानना चाहने का भाव देता है।
- source_word: τίνι λόγῳ
  choice: किस कारण
  rationale: शाब्दिक अर्थ ‘किस कारण से’ है; संक्षिप्त हिन्दी में ‘किस कारण’ अर्थ और औपचारिकता दोनों बनाए रखता है।
- source_word: μετεπέμψασθέ με
  choice: आपने मुझे ... बुलाया
  rationale: क्रिया का अर्थ ‘किसी को बुलवा भेजना/बुलाना’ है। पहले खंड के साथ शब्दगत संगति रखी गई है।
