  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बहुत भूख लगी’ πρόσπεινος की तीव्रता बताता है; ‘बेसुध-सी अवस्था’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल के ἔκστασις को किसी सम्प्रदाय-विशिष्ट तकनीकी शब्द में सीमित नहीं करता।
