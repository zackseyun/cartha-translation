  yaml_path: translation/nt/acts/010/010.yaml
  text: He became very hungry and wanted to eat[a]; but while they were preparing it[b], a trance came over him.
translation:
  language: hi
  text: तब उसे बहुत भूख लगी और वह कुछ खाना चाहता था[a]। पर जब वे भोजन तैयार कर रहे थे, तो उस पर एक तंद्रा-सी अवस्था छा गई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुछ चखना चाहता था”; यूनानी क्रिया का शाब्दिक अर्थ “चखना” हो सकता है, पर यहाँ उसका आशय भोजन करने से है।
    reason: lexical_alternative
  - marker: b
    text: या, “उस पर एक समाधि-सी दशा छा गई”; यूनानी शब्द यहाँ सामान्य चेतना से भिन्न, दर्शन से जुड़ी अवस्था को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο πρόσπεινος
  choice: उसे बहुत भूख लगी
  rationale: यह स्वाभाविक आधुनिक हिन्दी में भूख लगने की आरम्भिक अवस्था और πρόσπεινος की तीव्रता—साधारण भूख से अधिक—दोनों व्यक्त करता है।
- source_word: ἤθελεν γεύσασθαι
  choice: कुछ खाना चाहता था
  rationale: γεύομαι का मूल अर्थ ‘चखना’ है, पर इस प्रसंग में इसका सामान्य आशय भोजन करना है; ‘कुछ खाना’ हिन्दी में स्वाभाविक है और अनिर्दिष्ट वस्तु को भी बनाए रखता है।
- source_word: παρασκευαζόντων αὐτῶν
  choice: जब वे भोजन तैयार कर रहे थे
  rationale: सम्बन्धकारक निरपेक्ष रचना साथ-साथ चल रही क्रिया दर्शाती है। भोजन का उल्लेख प्रसंग से निहित है और हिन्दी में आशय स्पष्ट करता है।
- source_word: ἐγένετο ἐπ’ αὐτὸν ἔκστασις
  choice: वह बेसुध-सी अवस्था में चला गया
  rationale: यह अभिव्यक्ति उस पर अचानक आई सामान्य चेतना से भिन्न अवस्था को सहज हिन्दी में बताती है, बिना इसे केवल आश्चर्य या किसी विशिष्ट रहस्यवादी साधना के रूप में निर्धारित किए।
theological_decisions:
- issue: ἔκστασις द्वारा व्यक्त पतरस की दर्शनीय अवस्था का स्वरूप
  choice: बेसुध-सी अवस्था
  alternative: समाधि; भावावेश; तंद्रा
  rationale: आगे का प्रसंग प्रकाशनात्मक दर्शन से जुड़ी चेतना की बदली हुई अवस्था दिखाता है। ‘बेसुध-सी अवस्था’ इस अर्थ को व्यक्त करती है, पर इसे किसी बाद की धार्मिक या रहस्यवादी तकनीकी धारणा से नहीं बाँधती। ‘-सी’ यह भी स्पष्ट करता है कि इसका अर्थ मात्र अचेत हो जाना नहीं है।
