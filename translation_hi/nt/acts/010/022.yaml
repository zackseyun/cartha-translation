  to: उन्होंने कहा, “कुरनेलियुस, एक सूबेदार, धर्मी और परमेश्वर का भय मानने वाला मनुष्य है, जिसकी समस्त यहूदी लोगों में अच्छी प्रतिष्ठा है। एक पवित्र स्वर्गदूत के द्वारा उसे ईश्वरीय निर्देश मिला है कि वह आपको अपने घर बुलवाए और आपसे बातें सुने।”
