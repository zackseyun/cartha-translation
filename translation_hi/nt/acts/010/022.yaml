id: ACT.10.22
reference: Acts 10:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: hi
  text: उन्होंने कहा, “कुरनेलियुस, एक सूबेदार, धर्मी और परमेश्वर का भय मानने वाला मनुष्य है, जिसकी समस्त यहूदी लोगों में अच्छी प्रतिष्ठा है। एक पवित्र स्वर्गदूत के द्वारा उसे ईश्वरीय निर्देश मिला है कि वह आपको अपने घर बुलवाए और आपसे बातें सुने।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: सूबेदार
  rationale: रोमी सेना के लगभग सौ सैनिकों पर नियुक्त अधिकारी के लिए हिन्दी बाइबल परंपरा में परिचित ऐतिहासिक पद; आधुनिक पाठक के लिए सहज, यद्यपि यह भारतीय सैन्य पद से पूर्णतः समान नहीं है।
- source_word: ἀνὴρ δίκαιος
  choice: धर्मी ... मनुष्य
  rationale: δίκαιος के नैतिक और धार्मिक अर्थ को बनाए रखता है और Cornelius के विषय में पाठ से आगे कोई सैद्धांतिक निष्कर्ष नहीं जोड़ता।
- source_word: φοβούμενος τὸν θεόν
  choice: परमेश्वर का भय मानने वाला
  rationale: यूनानी की क्रियात्मक अभिव्यक्ति और बाइबिलीय मुहावरे को सुरक्षित रखता है; इसे केवल सामान्य ‘भक्त’ बनाकर संभावित ऐतिहासिक संकेत को नहीं मिटाता।
- source_word: μαρτυρούμενος
  choice: उसका आदर करते हैं
  rationale: अनुकूल गवाही और अच्छी प्रतिष्ठा का स्वाभाविक आधुनिक हिन्दी रूप; संदर्भ में यहूदी समुदाय द्वारा उसके सम्मानित होने को व्यक्त करता है।
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: समस्त यहूदी लोग
  rationale: ἔθνος को आधुनिक राजनीतिक राष्ट्र-राज्य के अर्थ से बचाते हुए पूरे यहूदी जनसमुदाय के रूप में व्यक्त करता है।
- source_word: ἐχρηματίσθη
  choice: परमेश्वर से यह निर्देश मिला
  rationale: इस प्रसंग में क्रिया अलौकिक/ईश्वरीय संदेश मिलने को दर्शाती है; ‘चेतावनी’ से अधिक उपयुक्त और स्पष्ट है।
- source_word: ἀγγέλου ἁγίου
  choice: एक पवित्र स्वर्गदूत के द्वारा
  rationale: ἁγίου को स्पष्ट रूप से बनाए रखता है और माध्यम सूचक ὑπό का स्वाभाविक रूप देता है।
- source_word: μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ
  choice: वह आपको अपने घर बुलवाए
  rationale: μεταπέμπομαι का अर्थ किसी को लाने के लिए बुलावा भेजना है; ‘बुलवाए’ इसे संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: आपसे बातें सुने
  rationale: यूनानी ‘आपसे वचन/बातें सुनना’ के निकट रहते हुए हिन्दी में सहज है और सामग्री को अनावश्यक रूप से ‘उपदेश’ या औपचारिक ‘संदेश’ नहीं ठहराता।
theological_decisions:
- issue: कुरनेलियुस की धार्मिकता का वर्णन बिना बाद की धर्मवैज्ञानिक श्रेणियाँ आरोपित किए
  choice: धर्मी और परमेश्वर का भय मानने वाला मनुष्य
  alternative: धर्मपरायण और परमेश्वर-भक्त मनुष्य
  rationale: चुना हुआ रूप δίκαιος और φοβούμενος τὸν θεόν दोनों को अलग-अलग सुरक्षित रखता है तथा कुरनेलियुस की वाचा-संबंधी या उद्धार-संबंधी स्थिति पर पाठ से आगे निर्णय नहीं देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाक्य को हिन्दी की स्वाभाविक लय के लिए विभाजित किया गया है। ‘सूबेदार’ ऐतिहासिक पद का परिचित पारंपरिक रूप है; ‘समस्त यहूदी लोग’ राजनीतिक ‘राष्ट्र’ की आधुनिक गलतफहमी से बचाता है।
