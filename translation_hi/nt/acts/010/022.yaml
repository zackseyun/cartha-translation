review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal clauses, but «समस्त यहूदी लोग उसका आदर करते हैं» is stronger and somewhat different from μαρτυρούμενος, which denotes receiving favorable testimony/a good reputation. «परमेश्वर से यह निर्देश मिला» adds God as the direct source alongside the explicitly stated holy angel; an explicitly divine instruction mediated by a holy angel is safer and clearer.
  naturalness: The Hindi is generally clear and suitably dignified. Recasting the identification of Cornelius appositionally and using «जिसकी अच्छी प्रतिष्ठा है» produces more idiomatic Hindi while retaining the Greek participial sense.
  terminology: «सूबेदार», «धर्मी», and «परमेश्वर का भय मानने वाला» are acceptable established biblical-Hindi renderings. «पवित्र स्वर्गदूत» correctly represents ἀγγέλου ἁγίου. «बातें सुने» appropriately leaves ῥήματα unspecified.
  issues:
  - severity: medium
    issue: «समस्त यहूदी लोग उसका आदर करते हैं» for μαρτυρούμενος ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
    rationale: The Greek says that Cornelius is well attested or well spoken of by the whole Jewish people. Being honored is related but can imply a greater degree of public esteem than the source states. «समस्त यहूदी लोगों में जिसकी अच्छी प्रतिष्ठा है» more closely preserves the passive reputational sense.
  - severity: low
    issue: «परमेश्वर से यह निर्देश मिला»
    rationale: The divine character belongs to ἐχρηματίσθη, while the stated agent is «by a holy angel.» Saying the instruction came directly «from God» is interpretive. «एक पवित्र स्वर्गदूत के द्वारा उसे ईश्वरीय निर्देश मिला» retains both elements without specifying more than the text.
  revised_text: उन्होंने कहा, “कुरनेलियुस, एक सूबेदार, धर्मी और परमेश्वर का भय मानने वाला मनुष्य है, जिसकी समस्त यहूदी लोगों में अच्छी प्रतिष्ठा है। एक पवित्र स्वर्गदूत के द्वारा उसे ईश्वरीय निर्देश मिला है कि वह आपको अपने घर बुलवाए और आपसे बातें सुने।”
