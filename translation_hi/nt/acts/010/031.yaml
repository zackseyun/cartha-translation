  text: καὶ φησί· Κορνήλιε, εἰσηκούσθη σου ἡ προσευχὴ καὶ αἱ ἐλεημοσύναι σου ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/031.yaml
  text: And he said[a], ‘Cornelius, your prayer has been heard, and your alms have been remembered before God.’
translation:
  language: hi
  text: और उसने कहा, “कुरनेलियुस, तुम्हारी प्रार्थना सुन ली गई है, और तुम्हारे दान[a] परमेश्वर के सामने स्मरण किए गए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दया के काम” या “ज़रूरतमंदों को दी गई सहायता।” यूनानी शब्द जरूरतमंदों के लिए दया से दिए गए दान या की गई सहायता को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φησί
  choice: उसने कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान, शाब्दिक रूप से ‘वह कहता है’, आया है; आधुनिक हिन्दी की कथा-शैली में भूतकाल ‘उसने कहा’ अधिक स्वाभाविक है।
- source_word: Κορνήλιε
  choice: कुरनेलियुस
  rationale: सम्बोधन को बनाए रखते हुए नाम का प्रचलित हिन्दी लिप्यंतरण किया गया है।
- source_word: εἰσηκούσθη
  choice: सुन ली गई है
  rationale: अओरिस्ट कर्मवाच्य प्रार्थना को स्वीकारपूर्वक सुने जाने का भाव देता है; पूर्ण वर्तमान उसका वर्तमान प्रसंग से सम्बन्ध भी बनाए रखता है।
- source_word: ἡ προσευχὴ
  choice: तुम्हारी प्रार्थना
  rationale: यूनानी के एकवचन और सामान्य धार्मिक अर्थ को सीधे बनाए रखा गया है।
- source_word: αἱ ἐλεημοσύναι
  choice: तुम्हारे दान के काम
  rationale: यह बहुवचन जरूरतमंदों के प्रति दया से किए गए दान या सहायता के ठोस कार्यों को दर्शाता है। ‘दान के काम’ आधुनिक हिन्दी में सहज है और केवल धनराशि तक अर्थ को सीमित नहीं करता।
- source_word: ἐμνήσθησαν
  choice: स्मरण किए गए हैं
  rationale: कर्मवाच्य बहुवचन और बाइबलीय ‘स्मरण’ की गंभीर भाषा सुरक्षित रखी गई है; इसे मात्र ‘ध्यान दिया गया’ कहकर हल्का नहीं किया गया।
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर के सामने
  rationale: यह परमेश्वर की उपस्थिति और उनकी दृष्टि में मान्यता—दोनों को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: कुरनेलियुस के दान के कामों का अर्थ
  choice: ‘दान के काम’ कहा गया है, पर इन्हें उद्धार कमाने का साधन नहीं बताया गया।
  alternative: ‘दान’, ‘दया के काम’ या ‘ज़रूरतमंदों को दी गई सहायता’
  rationale: पद दया से किए गए ठोस कार्यों को परमेश्वर के सामने स्मरण किए जाने की बात कहता है, लेकिन उनके आधार पर पुण्य या उद्धार की कोई विशेष धर्मसैद्धान्तिक व्यवस्था स्पष्ट नहीं करता।
- issue: परमेश्वर के सामने स्मरण
  choice: ‘स्मरण किए गए हैं’ की बाइबलीय भाषा बनाए रखी गई है।
  alternative: ‘परमेश्वर ने ध्यान दिया है’
  rationale: मूल का कर्मवाच्य और सम्बन्धपरक ‘स्मरण’ सुरक्षित रहता है; साथ ही यह नहीं बताया जाता कि परमेश्वर पहले भूल गए थे या इन कामों से कोई निश्चित फल अर्जित हुआ।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथा में हिन्दी के स्वाभाविक भूतकाल का प्रयोग किया गया है, जबकि ‘स्मरण किए गए हैं’ द्वारा मूल की बाइबलीय गंभीरता और कर्मवाच्य संरचना सुरक्षित रखी गई है।
