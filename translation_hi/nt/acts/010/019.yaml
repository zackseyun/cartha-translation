  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: hi
  text: जब पतरस उस दर्शन पर मनन कर रहा था, तब आत्मा ने उससे कहा, “देखो, कुछ पुरुष तुम्हें ढूँढ़ रहे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διενθυμουμένου
  choice: गहराई से सोच ही रहा था
  rationale: यह कृदंत लगातार चल रहे भीतरी मनन को व्यक्त करता है। ‘गहराई से सोच’ विचार की गंभीरता और ‘ही रहा था’ उस समय जारी क्रिया को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: περὶ τοῦ ὁράματος
  choice: उस दर्शन के बारे में
  rationale: περί के संबंधसूचक अर्थ को स्पष्ट रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है; ‘उस’ पूर्ववर्ती संदर्भ के दर्शन की ओर संकेत करता है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: इस प्रसंग में निश्चित पदबंध परमेश्वर के आत्मा को सूचित करता है। यूनानी में यहाँ ἅγιον नहीं है, इसलिए ‘पवित्र’ नहीं जोड़ा गया।
- source_word: εἶπεν αὐτῷ
  choice: उससे कहा
  rationale: यह यूनानी अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। ‘देखो’ आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज है।
- source_word: ἄνδρες
  choice: कुछ पुरुष
  rationale: ἀνήρ यहाँ वयस्क पुरुषों को सूचित करता है, इसलिए लिंग-सूचना सुरक्षित रखी गई है। हिन्दी में अनिर्दिष्ट बहुवचन को स्वाभाविक बनाने के लिए ‘कुछ’ जोड़ा गया है।
- source_word: ζητοῦντές σε
  choice: तुम्हें ढूँढ़ रहे हैं
  rationale: ζητέω का प्रसंगानुकूल अर्थ किसी व्यक्ति को खोजने या उसका पता लगाने का प्रयास करना है। ‘ढूँढ़ रहे हैं’ हिन्दी में ‘तुम्हारी खोज कर रहे हैं’ की अपेक्षा अधिक स्वाभाविक है।
theological_decisions:
- issue: τὸ πνεῦμα का अभिप्रेत संदर्भ
  choice: ‘आत्मा’ परमेश्वर के आत्मा के रूप में
  alternative: कोई अनिर्दिष्ट आत्मा या आंतरिक प्रेरणा
  rationale: प्रेरितों 10 के विस्तृत प्रसंग में यही आत्मा पतरस को अन्यजातियों के पास जाने के लिए निर्देश देता है। निश्चित रूप ‘आत्मा’ इस दैवी वक्ता को बनाए रखता है, पर जहाँ मूल में ‘पवित्र’ नहीं है वहाँ उसे जोड़ता नहीं।
- issue: ἄνδρες का लिंग-सूचक अनुवाद
  choice: पुरुष
  alternative: लोग या आगंतुक
  rationale: मूल शब्द सामान्य मानव-समूह के बजाय पुरुष व्यक्तियों को निर्दिष्ट करता है; इसलिए इसे लिंग-निरपेक्ष नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘देखो’ ने पुरातन ‘निहारो’ या अत्यधिक संस्कृतनिष्ठ विकल्पों से बचते हुए Ἰδού का ध्यानाकर्षक बल रखा है। वाक्य कथात्मक, स्पष्ट और गरिमापूर्ण है।
