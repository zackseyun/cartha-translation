  yaml_path: translation/nt/acts/010/013.yaml
  text: 'And a voice came to him: “Get up[a], Peter; kill and eat.”'
translation:
  language: hi
  text: और एक आवाज़ ने उससे कहा, “उठो, पतरस; मारो[a] और खाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बलि चढ़ाओ।” यहाँ अनूदित यूनानी क्रिया का अर्थ “बलि चढ़ाना” भी हो सकता है, पर इस दर्शन के संदर्भ में संभवतः भोजन के लिए किसी पशु को मारना अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: सुनाई दी
  rationale: φωνή के साथ यह क्रिया आवाज़ के प्रकट होने या आने को व्यक्त करती है। हिन्दी में ‘एक आवाज़ सुनाई दी’ स्वाभाविक है और घटना का भाव बनाए रखता है।
- source_word: φωνὴ
  choice: एक आवाज़
  rationale: इस प्रकाशनात्मक प्रसंग में यह किसी अस्पष्ट ध्वनि के बजाय बोलने वाली आवाज़ को सूचित करता है।
- source_word: πρὸς αὐτόν
  choice: उसे
  rationale: वाणी के प्रसंग में πρός + कर्मकारक संबोधन की दिशा बताता है; ‘उसे ... सुनाई दी’ आधुनिक हिन्दी में स्वाभाविक रूप से यही अर्थ देता है।
- source_word: Ἀναστάς
  choice: उठो
  rationale: यह कृदन्त यहाँ आगे आने वाली आज्ञाओं के साथ आज्ञार्थक बल रखता है। ‘उठो’ संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: Πέτρε
  choice: पतरस
  rationale: Πέτρος के संबोधन रूप का प्रचलित हिन्दी बाइबलीय नामरूप ‘पतरस’ है।
- source_word: θῦσον
  choice: मारो
  rationale: क्रिया का अर्थ ‘बलि चढ़ाना’ भी हो सकता है, पर दर्शन में पशुओं को भोजन के लिए तैयार करने के संदर्भ में ‘मारो’ मुख्य आशय को सहज रूप से व्यक्त करता है; वैकल्पिक बलिदानी अर्थ पादटिप्पणी में रखा गया है।
- source_word: φάγε
  choice: खाओ
  rationale: प्रत्यक्ष आज्ञार्थक क्रिया का सरल और स्वाभाविक हिन्दी रूप।
- source_word: καὶ
  choice: तब / और
  rationale: आरम्भिक καί कथा को आगे बढ़ाता है, जिसे हिन्दी में ‘तब’ स्वाभाविक रूप से व्यक्त करता है; दूसरी καί क्रमबद्ध आज्ञाओं को ‘और’ से जोड़ती है।
theological_decisions:
- issue: क्या θῦσον का अनुवाद बलिदानी भाषा में किया जाए
  choice: मुख्य पाठ में ‘मारो’
  alternative: ‘बलि चढ़ाओ’
  rationale: तात्कालिक संदर्भ पशुओं को मारकर खाने की आज्ञा का है, किसी उपासना-विधि का नहीं। फिर भी यूनानी क्रिया में बलि चढ़ाने का वास्तविक अर्थ संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज आज्ञार्थक शैली। ‘उसे एक आवाज़ सुनाई दी’ शाब्दिक ‘एक आवाज़ उसकी ओर हुई’ की अपेक्षा स्वाभाविक हिन्दी है।
