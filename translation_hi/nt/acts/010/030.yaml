source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: hi
  text: कुरनेलियुस ने कहा, “चार दिन पहले ठीक इसी समय मैं अपने घर में नौवें घंटे[a] प्रार्थना कर रहा था, और देखो, चमकीले वस्त्र पहने एक पुरुष मेरे सामने आ खड़ा हुआ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, दोपहर के लगभग तीन बजे।
    reason: cultural_note
lexical_decisions:
- source_word: ἔφη
  choice: ने कहा
  rationale: कथात्मक प्रसंग में यह यूनानी एओरिस्ट वाणी का स्वाभाविक परिचय देता है।
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: चार दिन पहले ठीक इसी समय
  rationale: यह स्वाभाविक हिंदी में चार दिन पहले के इसी समय-बिंदु को व्यक्त करता है और यूनानी काल-संबंध को अनावश्यक रूप से शाब्दिक नहीं बनाता।
- source_word: ἤμην ... προσευχόμενος
  choice: प्रार्थना कर रहा था
  rationale: परिपदात्मक अपूर्णकाल अतीत में जारी क्रिया को दर्शाता है; हिंदी का अपूर्ण पक्ष इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν ἐνάτην
  choice: नौवें पहर
  rationale: मूल संस्कृति की समय-गणना को मुख्य पाठ में सुरक्षित रखा गया है; आधुनिक समय का समतुल्य पादटिप्पणी में दिया गया है।
- source_word: ἐν τῷ οἴκῳ μου
  choice: अपने घर में
  rationale: यह भौतिक स्थान के अर्थ को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἰδοὺ
  choice: तभी देखो
  rationale: ‘देखो’ कथन की जीवंतता बनाए रखता है और ‘तभी’ दृश्य के अचानक सामने आने को स्वाभाविक हिंदी में संकेतित करता है।
- source_word: ἀνὴρ
  choice: एक पुरुष
  rationale: यह शब्द यहाँ पुरुष रूप में दिखाई देने वाली आकृति को स्पष्ट करता है और उसे केवल सामान्य ‘व्यक्ति’ बनाकर लिंग-सूचना नहीं खोता।
- source_word: ἔστη ἐνώπιόν μου
  choice: मेरे सामने आ खड़ा हुआ
  rationale: यह किसी के सामने स्थान ग्रहण करके खड़े होने की गतिशीलता को हिंदी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: चमकीले वस्त्र पहने
  rationale: ἐσθής और λαμπρός की दृश्यात्मक शक्ति को स्पष्ट, वर्तमान और गरिमापूर्ण हिंदी में रखा गया है।
theological_decisions:
- issue: τὴν ἐνάτην में समय का सांस्कृतिक रूप
  choice: नौवें पहर
  alternative: दोपहर के लगभग तीन बजे
  rationale: मुख्य पाठ में प्राचीन समय-पद्धति को बनाए रखने से स्रोत की सांस्कृतिक बनावट सुरक्षित रहती है; पाठक की सुविधा के लिए आधुनिक समतुल्य पादटिप्पणी में है।
- issue: दिखाई देने वाले ἀνὴρ की पहचान
  choice: एक पुरुष
  alternative: एक स्वर्गदूत
  rationale: इस पद में वक्ता आकृति के दिखाई देने वाले रूप का वर्णन ‘पुरुष’ के रूप में करता है; उसे सीधे ‘स्वर्गदूत’ कहना पाठ की अपनी अभिव्यक्ति से अधिक स्पष्ट पहचान जोड़ देता।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘नौवें पहर’ मूल सांस्कृतिक समय-संकेत को रखता है, जबकि पादटिप्पणी आधुनिक घड़ी के अनुसार अर्थ स्पष्ट करती है।
