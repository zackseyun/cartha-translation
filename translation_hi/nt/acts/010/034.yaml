    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: मुँह खोलकर कहा
  rationale: यह बोलना आरम्भ करने का सामी प्रभाव वाला औपचारिक मुहावरा है। हिन्दी में यह स्वाभाविक रूप से समझ में आता है और कथन की गंभीरता भी बनाए रखता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा की अगली घटना की ओर बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस प्रवाह को स्पष्ट करता है।
- source_word: Ἐπ’ ἀληθείας
  choice: सचमुच
  rationale: यह पदबंध पतरस की वास्तविक और दृढ़ पहचान को व्यक्त करता है; ‘सचमुच’ सहज तथा अर्थ-सटीक है।
- source_word: καταλαμβάνομαι
  choice: मैं ... समझ गया हूँ
  rationale: मध्यवाच्य वर्तमान रूप यहाँ किसी बात को पकड़ लेने या पहचान लेने का भाव देता है। प्रसंग में यह पतरस की प्राप्त समझ को दर्शाता है; ‘अब’ यूनानी में अलग शब्द के रूप में नहीं है, पर वर्तमान प्रसंग में उभरती अनुभूति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προσωπολήμπτης
  choice: किसी का पक्षपात नहीं करता
  rationale: यह संज्ञा व्यक्ति का मुँह देखकर पक्ष लेने वाले को सूचित करती है। हिन्दी में क्रियात्मक अभिव्यक्ति अधिक स्वाभाविक है और पक्षपात या तरफ़दारी का आशय स्पष्ट रखती है।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: θεός के लिए मानक, गरिमापूर्ण और सामान्य हिन्दी बाइबलीय पद।
theological_decisions:
- issue: परमेश्वर की निष्पक्षता के कथन को बाद की धर्मवैज्ञानिक व्यवस्था से सीमित किए बिना प्रस्तुत करना
  choice: परमेश्वर किसी का पक्षपात नहीं करता
  alternative: परमेश्वर व्यक्तियों का लिहाज़ करने वाला नहीं है
  rationale: चुना हुआ पाठ परमेश्वर द्वारा बाहरी पहचान या हैसियत के आधार पर तरफ़दारी न करने का दावा स्पष्ट करता है, पर अगले पदों के साथ उसके संबंध को किसी विशिष्ट धर्मसैद्धांतिक निष्कर्ष में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘मुँह खोलकर कहा’ मूल की औपचारिक अभिव्यक्ति को सुरक्षित रखता है, जबकि ‘पक्षपात नहीं करता’ दुर्बोध शाब्दिक मुहावरे का स्वाभाविक हिन्दी अर्थ देता है।
