source:
  edition: SBLGNT
  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: hi
  text: और हम उन सब कामों के गवाह हैं जो उसने यहूदियों के प्रदेश और यरूशलेम में किए। और उसी को उन्होंने पेड़[a] पर लटकाकर मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘लकड़ी पर’; व्याख्यात्मक रूप से, ‘क्रूस पर।’ यूनानी शब्द का अर्थ ‘पेड़’ या ‘लकड़ी’ हो सकता है और यहाँ संभवतः व्यवस्थाविवरण 21:23 की प्रतिध्वनि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: गवाह
  rationale: यह प्रेरितों की प्रत्यक्षदर्शी गवाही को स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πάντων ὧν ἐποίησεν
  choice: उन सब कामों के…जो उसने…किए
  rationale: यह πάντων की समग्रता और यूनानी संबंधवाचक वाक्य-रचना, दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: यहूदियों के प्रदेश में
  rationale: प्रदेश χώρα के देश, भूभाग या क्षेत्र संबंधी अर्थ को व्यक्त करता है, पर इसे स्पष्ट रूप से रोमी प्रांत यहूदिया ठहराकर मूल की संभावित व्यापकता को सीमित नहीं करता।
- source_word: καὶ Ἰερουσαλήμ
  choice: और यरूशलेम में
  rationale: यूनानी में पूर्वसर्ग दोबारा नहीं आया है, पर स्पष्ट और स्वाभाविक हिन्दी के लिए ‘में’ निहित रूप से लागू होता है।
- source_word: ἀνεῖλαν
  choice: मार डाला
  rationale: यहाँ क्रिया का अर्थ जान लेना या मृत्यु के घाट उतारना है; ‘मार डाला’ आधुनिक हिन्दी में सीधा, स्पष्ट और प्रसंगानुकूल है।
- source_word: κρεμάσαντες ἐπὶ ξύλου
  choice: काठ पर लटकाकर
  rationale: ‘लटकाकर’ कृदंत को मृत्यु के साधन के रूप में स्वाभाविक ढंग से व्यक्त करता है। ‘काठ’ ξύλον के लकड़ी/पेड़ संबंधी शब्द-चयन और व्यवस्थाविवरण 21:23 की संभावित प्रतिध्वनि को बनाए रखता है, बिना उसे सीधे ‘क्रूस’ कर देने के।
theological_decisions:
- issue: क्रूस पर चढ़ाए जाने के प्रसंग में ξύλον का अनुवाद
  choice: काठ
  alternative: पेड़; व्याख्यात्मक रूप से ‘क्रूस’
  rationale: मूल में σταυρός नहीं, बल्कि ξύλον है। ‘काठ’ लकड़ी/पेड़ की अर्थ-सीमा तथा व्यवस्थाविवरण 21:23 की संभावित ओर-संकेत को बचाता है; ‘क्रूस’ कहना मूल की अपेक्षा व्याख्या को अधिक स्पष्ट कर देता।
- issue: ὃν καὶ में यीशु की ओर लौटता संबंध और बल
  choice: उसी को
  alternative: जिसे उन्होंने भी
  rationale: ‘उसी को’ पिछले वाक्य के कर्ता यीशु को स्पष्ट रूप से फिर सामने लाता है और καί के बल को सहज हिन्दी में दर्शाता है, बिना किसी अतिरिक्त कर्ता या धर्मवैज्ञानिक निष्कर्ष को जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गवाह,’ ‘प्रदेश’ और ‘मार डाला’ सामान्य पाठकों के लिए स्पष्ट हैं; ‘काठ’ कुछ अधिक साहित्यिक है, पर मूल की जानबूझकर चुनी गई लकड़ी/पेड़ संबंधी अभिव्यक्ति और उसके शास्त्रीय संकेत को सुरक्षित रखता है।
