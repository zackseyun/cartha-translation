source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ἔθνει ὁ φοβούμενος αὐτὸν καὶ ἐργαζόμενος δικαιοσύνην δεκτὸς αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: hi
  text: परन्तु हर जाति में जो उसका भय मानता है और धार्मिकता के काम करता है, वह उसे स्वीकार्य है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘और धार्मिकता करता है’ / ‘और धार्मिकता का आचरण करता है।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘परमेश्वर उसे स्वीकार करता है।’
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: बल्कि
  rationale: यह पिछले कथन—परमेश्वर पक्षपात नहीं करता—के विपरीत नहीं, बल्कि उसके सकारात्मक प्रतिपक्ष को प्रस्तुत करता है; इसलिए ‘बल्कि’ स्वाभाविक है।
- source_word: ἐν παντὶ ἔθνει
  choice: हर जाति में
  rationale: ἔθνος यहाँ लोगों के राष्ट्रीय या जातीय समुदाय को सूचित करता है। ‘हर जाति में’ आधुनिक राष्ट्र-राज्य तक अर्थ को सीमित किए बिना वितरक παντί को बनाए रखता है।
- source_word: ὁ φοβούμενος αὐτὸν
  choice: जो उससे डरता
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत को ‘जो...’ से स्वाभाविक और लिंग-निरपेक्ष ढंग से व्यक्त किया गया है। ‘डरता’ परमेश्वर के प्रति श्रद्धायुक्त भय की बाइबलीय धारणा बनाए रखता है।
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: और धार्मिकता के काम करता है
  rationale: यह सक्रिय आचरण व्यक्त करता है और δικαιοσύνη का ‘धार्मिकता’ अर्थ स्पष्ट रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: वह उसे स्वीकार्य है
  rationale: यह विधेय विशेषण की रचना और δεκτός के ‘स्वीकार्य’ अर्थ को निकटता से बनाए रखता है तथा ‘परमेश्वर उसे स्वीकार कर लेता है’ जैसी अधिक घटनात्मक या व्याख्यात्मक अभिव्यक्ति से बचता है।
theological_decisions:
- issue: क्या यह पद कर्मों द्वारा उद्धार सिखाता है या जातीय पक्षपात से रहित परमेश्वर की स्वीकृति का वर्णन करता है
  choice: पाठ के अनुसार परमेश्वर से डरने और धार्मिकता के काम करनेवाला व्यक्ति उसे स्वीकार्य है—इसी कथन को बिना अतिरिक्त सिद्धान्तगत व्याख्या के रखा गया है।
  alternative: ‘अपने कर्मों से परमेश्वर की स्वीकृति अर्जित करता है’ अथवा ‘इससे उसके उद्धारकारी विश्वास का प्रमाण मिलता है।’
  rationale: यूनानी पाठ भय और धार्मिक आचरण के संबंध में स्वीकार्यता कहता है, पर न तो ‘अर्जित करता है’ कहता है और न इस पद में विश्वास के प्रमाण की व्याख्या जोड़ता है। अतः मूल धार्मिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जाति’ का अर्थ यहाँ हर राष्ट्रीय या जातीय समुदाय है; ‘धार्मिकता’ प्रमुख बाइबलीय शब्दावली को सुरक्षित रखती है। सर्वनाम का निकटतम संदर्भ परमेश्वर है, जैसा पिछले पद से स्पष्ट है।
