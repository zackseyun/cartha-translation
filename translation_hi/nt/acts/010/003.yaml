source:
  edition: SBLGNT
  text: εἶδεν ἐν ὁράματι φανερῶς ὡσεὶ ⸀περὶ ὥραν ἐνάτην τῆς ἡμέρας ἄγγελον τοῦ θεοῦ εἰσελθόντα πρὸς αὐτὸν καὶ εἰπόντα αὐτῷ· Κορνήλιε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/003.yaml
  text: He saw clearly in a vision[a], about the ninth hour of the day, an angel of God coming in to him and saying to him[b], “Cornelius.”
translation:
  language: hi
  text: उसने एक दर्शन में साफ़-साफ़ देखा कि दिन के लगभग नौवें घंटे में[a] परमेश्वर का एक स्वर्गदूत उसके पास आया और उससे कहा, “कुरनेलियुस!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात आधुनिक समय-गणना के अनुसार लगभग दोपहर बाद तीन बजे।
    reason: cultural_note
lexical_decisions:
- source_word: εἶδεν
  choice: उसने...देखा
  rationale: ὁράω का एओरिस्ट रूप सामान्य कथात्मक भूतकाल में प्रत्यक्ष देखने को व्यक्त करता है; ‘देखा’ स्वाभाविक और ठोस है।
- source_word: ἐν ὁράματι
  choice: एक दर्शन में
  rationale: ὅραμα अलौकिक दृश्य या दर्शन को सूचित करता है; ‘दर्शन’ उसके स्वरूप को अनावश्यक रूप से अधिक परिभाषित नहीं करता।
- source_word: φανερῶς
  choice: साफ़-साफ़
  rationale: क्रियाविशेषण दर्शन की स्पष्ट और प्रत्यक्ष प्रकृति पर बल देता है; आधुनिक हिन्दी में ‘साफ़-साफ़’ सहज और जोरदार है।
- source_word: ὡσεὶ περὶ ὥραν ἐνάτην τῆς ἡμέρας
  choice: दिन के लगभग नौवें घंटे में
  rationale: ‘लगभग’ ὡσεὶ और περὶ की अनुमानात्मक शक्ति को समेटता है; ‘नौवाँ घंटा’ प्राचीन समय-गणना को मुख्य पाठ में बनाए रखता है।
- source_word: ἄγγελον τοῦ θεοῦ
  choice: परमेश्वर का एक स्वर्गदूत
  rationale: दर्शन के संदर्भ में ἄγγελος मनुष्य-दूत नहीं, स्वर्गीय दूत है; हिन्दी में ‘स्वर्गदूत’ इस अर्थ को स्पष्ट और प्रचलित ढंग से व्यक्त करता है।
- source_word: εἰσελθόντα πρὸς αὐτὸν
  choice: उसके पास भीतर आया
  rationale: εἰσελθόντα प्रवेश करने की गति को व्यक्त करता है; ‘भीतर आया’ उस अर्थ को बनाए रखता है, जबकि ‘उसके पास’ गंतव्य बताता है।
- source_word: καὶ εἰπόντα αὐτῷ
  choice: और उससे बोला
  rationale: यूनानी में सहभागी रूप है, पर हिन्दी में समापिका क्रिया ‘बोला’ अधिक स्वाभाविक कथात्मक प्रवाह देती है और घटनाक्रम को यथावत रखती है।
- source_word: Κορνήλιε
  choice: कुरनेलियुस
  rationale: यह Κορνήλιος का संबोधन रूप है; हिन्दी में नाम का प्रचलित लिप्यंतरण ‘कुरनेलियुस’ है, और विस्मयादिबोधक चिह्न सीधे संबोधन को दर्शाता है।
theological_decisions:
- issue: इस संदर्भ में ἄγγελος का स्वरूप
  choice: स्वर्गीय दूत
  alternative: मानवीय संदेशवाहक
  rationale: घटना स्पष्टतः दर्शन में घटती है और दूत को ‘परमेश्वर का’ कहा गया है; इसलिए स्वर्गीय दूत संदर्भगत सीधा अर्थ है, बिना किसी अतिरिक्त doctrinal विवरण के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्राचीन ‘नौवें घंटे’ की अभिव्यक्ति स्रोत-पारदर्शिता के लिए मुख्य पाठ में रखी गई और आधुनिक समय पादटिप्पणी में दिया गया। φανερῶς को निकटतम स्वाभाविक हिन्दी ‘साफ़-साफ़’ से व्यक्त किया गया है।
