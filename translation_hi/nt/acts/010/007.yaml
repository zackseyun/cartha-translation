  text: ὡς δὲ ἀπῆλθεν ὁ ἄγγελος ὁ λαλῶν ⸀αὐτῷ, φωνήσας δύο τῶν ⸀οἰκετῶν καὶ στρατιώτην εὐσεβῆ τῶν προσκαρτερούντων αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/007.yaml
  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: hi
  text: जब उससे बात करने वाला स्वर्गदूत चला गया, तो उसने अपने घर के सेवकों[a] में से दो को और अपनी सेवा में लगे रहने वालों में से एक धर्मपरायण सैनिक को बुलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घराने के दासों।” यूनानी शब्द οἰκέται घराने में दासत्व या अधीन सेवा करने वाले व्यक्तियों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἀπῆλθεν
  choice: जब ... चला गया, तो
  rationale: यह वाक्यांश पहले पूरी हुई घटना और उसके बाद हुई कार्रवाई का समय-संबंध स्पष्ट करता है; ‘जब ... तो’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὁ ἄγγελος ὁ λαλῶν αὐτῷ
  choice: उससे बात करने वाला स्वर्गदूत
  rationale: संदर्भ में ἄγγελος एक स्वर्गीय दूत है, और वर्तमान कृदंत उस स्वर्गदूत की पहचान उससे बात करने वाले के रूप में कराता है।
- source_word: δύο τῶν οἰκετῶν
  choice: अपने घर के सेवकों में से दो
  rationale: οἰκέτης घराने में अधीन सेवा करने वाले व्यक्ति को दर्शाता है। ‘घर के सेवक’ घरेलू परिवेश और अंशवाची संबंध दोनों को सहज हिन्दी में व्यक्त करता है; ‘अपने’ कुरनेलियुस के घराने के संदर्भ से स्पष्ट है।
- source_word: στρατιώτην εὐσεβῆ
  choice: एक भक्त सैनिक
  rationale: εὐσεβής श्रद्धापूर्ण धार्मिक निष्ठा का भाव देता है। ‘भक्त’ संक्षिप्त, स्वाभाविक और ‘परमेश्वर का भय मानने वाला’ जैसी अधिक विशिष्ट धारणा जोड़े बिना अर्थ व्यक्त करता है।
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: अपनी सेवा में लगे रहने वाले सैनिकों में से
  rationale: प्रसंग में यह अंशवाची वाक्यांश उस समूह को बताता है जिसमें से सैनिक चुना गया था। προσκαρτερέω की निरंतर उपस्थित रहकर सेवा करने की छाया ‘सेवा में लगे रहने वाले’ से व्यक्त होती है।
- source_word: φωνήσας
  choice: बुलाया
  rationale: यह कृदंत अगले पद में जारी कार्रवाई से पहले लोगों को बुलाने का कार्य बताता है। हिन्दी में पूर्ण क्रिया के रूप में अनुवाद पद को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: संदर्भ में ἄγγελος का स्वरूप
  choice: स्वर्गदूत
  alternative: दूत
  rationale: प्रेरितों के काम 10 के निकटवर्ती संदर्भ में कुरनेलियुस को दर्शन में एक दिव्य प्राणी दिखाई देता है; इसलिए यहाँ केवल सामान्य ‘दूत’ नहीं, बल्कि ‘स्वर्गदूत’ संदर्भानुकूल है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। ‘सेवा में लगे रहने वाले’ निरंतर व्यक्तिगत उपस्थिति का भाव बचाता है, और ‘घर के सेवक’ के साथ पादटिप्पणी यूनानी शब्द में निहित दासत्व की सम्भावना को खुला रखती है।
