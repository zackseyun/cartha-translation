- source_word: σφοδρῶς
  choice: बुरी तरह
  rationale: यह क्रियाविशेषण तूफ़ान के प्रचंड प्रभाव को तीव्र करता है; ‘बुरी तरह’ आधुनिक हिंदी में उसकी गंभीरता और बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: χειμαζομένων
  choice: तूफ़ान हमें ... झकझोर रहा था
  rationale: मूल कृदंत तूफ़ान से संकट में पड़ने और उसके थपेड़ों का निष्क्रिय रूप से सामना करने का भाव देता है। हिंदी में यह रचना जहाज़ के साथ यात्रियों के अनुभव को स्वाभाविक और सजीव बनाती है।
- source_word: ἡμῶν
  choice: हमें
  rationale: संबंधकारक स्वतंत्र रचना को हिंदी में कालवाचक आश्रित वाक्य के कर्म के रूप में व्यक्त किया गया है।
- source_word: τῇ ἑξῆς
  choice: अगले दिन
  rationale: यह मानक कालवाचक पद अगले अथवा उसके बाद के दिन को दर्शाता है।
- source_word: ἐκβολὴν
  choice: जहाज़ का माल समुद्र में फेंकने
  rationale: यह समुद्री शब्द जहाज़ को हल्का करने के लिए वस्तुएँ, सामान्यतः माल, बाहर फेंकने को दर्शाता है। संदर्भानुसार ‘जहाज़ का माल’ स्पष्ट किया गया है।
- source_word: ἐποιοῦντο
  choice: फेंकने लगे
  rationale: अपूर्णकालीन मध्यवाच्य रूप चल रही अथवा आरंभ हुई कार्रवाई बताता है; कथानक में ‘लगे’ उस आरंभ को स्वाभाविक हिंदी में व्यक्त करता है।
