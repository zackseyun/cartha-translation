lexical_decisions:
- source_word: παρέστη
  choice: मेरे पास आ खड़ा हुआ
  rationale: यह प्रयोग पौलुस के पास स्वर्गदूत की अचानक उपस्थिति और स्थानगत निकटता दोनों को व्यक्त करता है; केवल ‘मुझे दिखाई दिया’ कहना अधिक व्याख्यात्मक होता।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन में व्यक्त पौलुस के भरोसे का कारण प्रस्तुत करता है और हिन्दी में स्वाभाविक कारणसूचक संबंध बनाता है।
- source_word: ταύτῃ τῇ νυκτί
  choice: इसी रात
  rationale: संकेतवाचक पद की तात्कालिकता और बल को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: τοῦ θεοῦ
  choice: उस परमेश्वर का
  rationale: सम्बन्धकारक रूप ‘स्वर्गदूत’ को परमेश्वर से जोड़ता है; ‘उस’ आगे आने वाले सम्बन्धवाचक उपवाक्यों के साथ हिन्दी में स्वाभाविक है।
- source_word: οὗ εἰμι
  choice: जिसका मैं हूँ
  rationale: यूनानी की संक्षिप्त और जानबूझकर खुली स्वामित्व/सम्बद्धता की अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखता है; इसका अर्थ फुटनोट में स्पष्ट किया गया है।
- source_word: ᾧ καὶ λατρεύω
  choice: जिसकी मैं आराधना भी करता हूँ
  rationale: λατρεύω यहाँ परमेश्वर के प्रति धार्मिक सेवा या उपासना को दर्शाता है; ‘आराधना’ इस धार्मिक अर्थ को स्पष्ट रखती है और καί को ‘भी’ से व्यक्त करती है।
- source_word: ἄγγελος
  choice: एक स्वर्गदूत
  rationale: ईश्वरीय आश्वासन वाले इस प्रसंग में अलौकिक दूत अभिप्रेत है, सामान्य मानवीय संदेशवाहक नहीं।
theological_decisions:
- issue: οὗ εἰμι का अनुवाद
  choice: जिसका मैं हूँ
  alternative: जिसका मैं अपना हूँ / जिससे मैं सम्बन्ध रखता हूँ
  rationale: मुख्य पाठ मूल की शाब्दिक संक्षिप्तता तथा परमेश्वर से सम्बन्ध और उसके अधिकार—दोनों की गुंजाइश बनाए रखता है, बिना किसी अधिक विशिष्ट सिद्धान्त को जोड़ने के।
- issue: λατρεύω का अनुवाद
  choice: आराधना करता हूँ
  alternative: सेवा करता हूँ
  rationale: परमेश्वर के संदर्भ में क्रिया धार्मिक सेवा और उपासना का बोध देती है। ‘आराधना’ मुख्य अर्थ को स्पष्ट करती है, जबकि व्यापक ‘सेवा’ को फुटनोट में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। ‘मेरे पास आ खड़ा हुआ’ स्थानगत अर्थ और अचानक उपस्थिति को बनाए रखता है। सभी फुटनोट चिह्न मुख्य पाठ में उनके सम्बद्ध पदों के तुरंत बाद रखे गए हैं।
