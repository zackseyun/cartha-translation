lexical_decisions:
- source_word: εὔθυμοι
  choice: हौसला बढ़ा
  rationale: यह पदबंध भय और निराशा से अच्छे मनोबल की ओर हुए परिवर्तन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘प्रसन्न’ इस संकटपूर्ण प्रसंग में कुछ अधिक हल्का लग सकता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ प्रबल विरोध के बजाय कथा में अगले घटनाक्रम को चिह्नित करता है।
- source_word: γενόμενοι
  choice: बढ़ा
  rationale: εὔθυμοι के साथ यह किसी अवस्था में आने का भाव देता है; हिन्दी में ‘उनका हौसला बढ़ा’ उसी परिवर्तन को सहज रूप से प्रकट करता है।
- source_word: πάντες
  choice: उन सबका
  rationale: जहाज़ पर उपस्थित पूरे समूह पर बल बनाए रखता है।
- source_word: καὶ αὐτοὶ
  choice: उन्होंने भी स्वयं
  rationale: ‘भी’ पौलुस के उदाहरण का अनुसरण दिखाता है और ‘स्वयं’ αὐτοί के बलात्मक भाव को बनाए रखता है।
- source_word: προσελάβοντο
  choice: लिया
  rationale: भोजन के साथ यह ‘भोजन ग्रहण किया/खाया’ के अर्थ में है; ‘भोजन लिया’ मूल अभिव्यक्ति के निकट और स्वाभाविक है।
- source_word: τροφῆς
  choice: भोजन
  rationale: इस प्रसंग में खाने के लिए आहार का सीधा और सामान्य हिन्दी शब्द है।
