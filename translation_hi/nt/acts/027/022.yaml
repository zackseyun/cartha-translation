  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण संवादात्मक रूप अपनाया गया है। ‘तुम्हें/तुममें’ बहुवचन श्रोताओं को संबोधित करता है। ‘जान नहीं जाएगी’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी मूल की संज्ञात्मक अभिव्यक्ति को स्पष्ट करती है।
