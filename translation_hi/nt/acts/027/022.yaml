review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys that no person among the group will lose physical life and that the ship alone will be lost. However, “सलाह देता हूँ” is somewhat weaker than παραινῶ in this urgent exhortation, and “नष्ट होगा” is more specific than the source’s general term ἀποβολή (“loss”).
  naturalness: The Hindi is clear and modern. “हिम्मत बनाए रखने का आग्रह करता हूँ” is more idiomatic for an urgent reassurance, and “जहाज़ का नुकसान होगा” retains a natural expression of loss without asserting outright destruction.
  terminology: “जान” appropriately renders ψυχή in this context. The explanatory footnote correctly guards against reading it as a reference specifically to an immaterial soul.
  issues:
  - severity: low
    issue: The rendering “सलाह देता हूँ” slightly softens παραινῶ.
    rationale: In context Paul is urgently exhorting the listeners, not merely offering neutral advice.
  - severity: low
    issue: “जहाज़ नष्ट होगा” narrows ἀποβολή to destruction.
    rationale: The Greek states that the ship will be lost; a Hindi expression of loss or damage better preserves the lexical breadth.
