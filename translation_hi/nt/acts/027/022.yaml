  text: καὶ τὰ νῦν παραινῶ ὑμᾶς εὐθυμεῖν, ἀποβολὴ γὰρ ψυχῆς οὐδεμία ἔσται ἐξ ὑμῶν πλὴν τοῦ πλοίου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/022.yaml
  text: And now I urge you to take courage[a], for there will be no loss of life among you[b], except for the ship.
translation:
  language: hi
  text: और अब मैं तुमसे हिम्मत बनाए रखने का आग्रह करता हूँ[a], क्योंकि तुममें से किसी की भी जान नहीं जाएगी[b]; केवल जहाज़ का नुकसान होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हिम्मत रखो” अथवा “अपना मनोबल बनाए रखो।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक अर्थ “जीवन की कोई हानि नहीं होगी” है; यहाँ ψυχή का अर्थ शारीरिक जीवन है, विशेष रूप से ‘आत्मा’ नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: अब
  rationale: यह पदबंध वर्तमान परिस्थिति में पौलुस के आग्रह की ओर संकेत करता है; ‘अब’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: παραινῶ
  choice: मैं ... सलाह देता हूँ
  rationale: क्रिया में परामर्श के साथ प्रोत्साहन का भाव है; ‘सलाह देता हूँ’ मूल के उपदेशात्मक, पर गैर-आदेशात्मक बल को बनाए रखता है।
- source_word: εὐθυμεῖν
  choice: साहस बनाए रखने
  rationale: यहाँ क्रिया अच्छे मनोबल और हिम्मत को कायम रखने का भाव देती है, जो समुद्री संकट के प्रसंग में स्वाभाविक है।
- source_word: ἀποβολὴ
  choice: नहीं जाएगी / नष्ट होगा
  rationale: ἀποβολή का मूल भाव ‘हानि’ है। व्यक्ति की ψυχή के साथ हिन्दी में ‘जान जाना’ और जहाज़ के संबंध में ‘नष्ट होना’ अर्थ को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: ψυχῆς
  choice: जान
  rationale: इस प्रसंग में ψυχή शारीरिक जीवन को दर्शाता है, किसी अमूर्त ‘आत्मा’ को विशेष रूप से नहीं।
- source_word: οὐδεμία ἔσται
  choice: किसी की भी ... नहीं जाएगी
  rationale: यह रूप पूर्ण निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξ ὑμῶν
  choice: तुममें से
  rationale: समूह में से एक भी व्यक्ति न खोने का अर्थ सीधे और स्पष्ट रूप में देता है।
- source_word: πλὴν τοῦ πλοίου
  choice: केवल जहाज़ नष्ट होगा
  rationale: πλήν अपवाद सूचित करता है। हिन्दी में यह स्वतंत्र उपवाक्य स्पष्ट करता है कि लोगों की जान के विपरीत जहाज़ की हानि होगी।
