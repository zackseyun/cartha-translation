base_translation:
  language: en
  yaml_path: translation/nt/acts/027/003.yaml
  text: And on the next day we put in at Sidon[a], and Julius, treating Paul kindly[b], permitted him to go to his friends and receive care.
translation:
  language: hi
  text: अगले दिन हम सीदोन के बंदरगाह पर पहुँचे। यूलियुस ने पौलुस के साथ दयालुता से व्यवहार किया[a] और उसे अपने मित्रों के पास जाकर उनसे देखभाल पाने की अनुमति दी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''दयालुता से व्यवहार किया'' का अनुवाद ''मानवीय व्यवहार किया'' भी हो सकता है; यूनानी शब्द एक बंदी के प्रति यूलियुस के कृपालु आचरण पर बल देता है।'
    reason: lexical_alternative
  - marker: b
    text: '''देखभाल पाने'' का अनुवाद ''आवश्यक सहायता पाने'' या ''सेवा-सुश्रूषा पाने'' भी हो सकता है; यूनानी अभिव्यक्ति मित्रों से मिलने वाली आवश्यक मदद के लिए व्यापक है।'
    reason: lexical_alternative
