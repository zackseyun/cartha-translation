    reason: lexical_alternative
lexical_decisions:
- source_word: πέλαγος
  choice: खुला समुद्र
  rationale: यह शब्द सामान्यतः समुद्र के खुले विस्तार को सूचित करता है; इसलिए ‘खुला समुद्र’ समुद्री यात्रा की विशिष्टता बनाए रखता है।
- source_word: τὸ κατὰ τὴν Κιλικίαν καὶ Παμφυλίαν
  choice: किलिकिया और पम्फूलिया के तटवर्ती
  rationale: यह भौगोलिक प्रयोग उन प्रदेशों के तट के साथ या तट से कुछ दूर समुद्री मार्ग को सूचित करता है। ‘तटवर्ती’ उस संबंध को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: διαπλεύσαντες
  choice: पार करके
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले पूरी हुई समुद्री यात्रा बताता है; ‘पार करके’ उस क्रम को सहज हिन्दी में रखता है।
- source_word: κατήλθομεν
  choice: हम ... उतरे
  rationale: क्रिया का शाब्दिक दिशात्मक अर्थ ‘नीचे आना/उतरना’ है और यात्रा-वृत्तान्त में गंतव्य पर पहुँचने का अर्थ भी हो सकता है। ‘उतरे’ समुद्री संदर्भ में दोनों भावों को स्वाभाविक रूप से समेटता है।
- source_word: Μύρα τῆς Λυκίας
  choice: लूकिया के मूरा नगर में
  rationale: सम्बन्धकारक मूरा को लूकिया प्रदेश में स्थित बताता है। ‘नगर’ जोड़ने से आधुनिक हिन्दी पाठक के लिए स्थान का प्रकार स्पष्ट होता है, बिना अर्थ बदले।
- source_word: τε
  choice: फिर
  rationale: τε कथा की पिछली कड़ी से हल्का संबंध बनाता है। हिन्दी में ‘फिर’ यात्रा-वृत्तान्त की निरंतरता और अगले चरण को स्वाभाविक ढंग से व्यक्त करता है।
