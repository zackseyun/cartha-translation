source:
  edition: SBLGNT
  text: ἐπιβάντες δὲ πλοίῳ Ἀδραμυττηνῷ ⸀μέλλοντι πλεῖν ⸀εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους ἀνήχθημεν ὄντος σὺν ἡμῖν Ἀριστάρχου Μακεδόνος Θεσσαλονικέως·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/002.yaml
  text: So we boarded an Adramyttian ship that was about to sail to the places along Asia, and put out to sea, with Aristarchus, a Macedonian from Thessalonica, being with us.
translation:
  language: hi
  text: तब हम अद्रमुत्तियुम के एक जहाज़ पर चढ़े, जो आसिया[a] के तटवर्ती स्थानों[b] की ओर जाने वाला था, और समुद्र में निकल पड़े। अरिस्तर्खुस, जो मकिदुनिया का थिस्सलुनीके निवासी था, हमारे साथ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “आसिया” से आशय पश्चिमी एशिया माइनर में स्थित रोमी प्रांत आसिया है, आधुनिक एशिया महाद्वीप नहीं।
    reason: cultural_note
  - marker: b
    text: या, “आसिया के तट के बंदरगाहों की ओर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιβάντες
  choice: जहाज़ पर चढ़ गए
  rationale: समुद्री प्रसंग में क्रिया का अर्थ जहाज़ पर सवार होना है; यह स्वाभाविक हिन्दी में मुख्य क्रिया से पहले की घटना भी स्पष्ट करती है।
- source_word: δὲ
  choice: इसलिए
  rationale: यहाँ δέ कथा को आगे बढ़ाता है और पिछले पद से घटनाक्रम जोड़ता है; हिन्दी में ‘इसलिए’ उस प्रवाह को सहज रूप देता है, बिना तीव्र विरोध जताए।
- source_word: πλοίῳ Ἀδραμυττηνῷ
  choice: अद्रमुत्तियुम के एक जहाज़
  rationale: विशेषण जहाज़ का संबंध उसके नगर अथवा गृह-बंदरगाह अद्रमुत्तियुम से बताता है। हिन्दी में नगर के नाम के साथ संबंधसूचक रचना स्पष्ट और स्वाभाविक है।
- source_word: μέλλοντι πλεῖν
  choice: जाने वाला था
  rationale: μέλλω और infinitive निकट भविष्य अथवा नियोजित यात्रा दर्शाते हैं; जहाज़ के संदर्भ में यह स्वाभाविक हिन्दी है।
- source_word: εἰς τοὺς κατὰ τὴν Ἀσίαν τόπους
  choice: आसिया के तटवर्ती स्थानों की ओर
  rationale: κατά की भौगोलिक शक्ति आसिया के साथ-साथ स्थित स्थानों को दर्शाती है। समुद्री प्रसंग तटीय स्थानों का संकेत देता है, पर मुख्य पाठ ‘बंदरगाह’ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: Ἀσίαν
  choice: आसिया
  rationale: यह आधुनिक महाद्वीप नहीं, रोमी प्रांत का ऐतिहासिक नाम है; मुख्य पाठ नाम को बनाए रखता है और पादटिप्पणी अर्थ स्पष्ट करती है।
- source_word: ἀνήχθημεν
  choice: समुद्र में निकल पड़े
  rationale: यह बंदरगाह छोड़कर समुद्री यात्रा आरम्भ करने की प्रचलित नौवहन अभिव्यक्ति है।
- source_word: ὄντος σὺν ἡμῖν
  choice: हमारे साथ था
  rationale: Genitive absolute साथ होने की परिस्थिति जोड़ता है; अलग वाक्य में यह अर्थ स्पष्ट और आधुनिक हिन्दी में सहज है।
- source_word: Ἀριστάρχου
  choice: अरिस्तर्खुस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: Μακεδόνος
  choice: मकिदुनिया का था
  rationale: यह अरिस्तर्खुस की क्षेत्रीय पहचान बताता है; हिन्दी में संबंधसूचक रचना स्वाभाविक है।
- source_word: Θεσσαλονικέως
  choice: थिस्सलुनीके का रहने वाला
  rationale: यह उसके नगर को अधिक विशिष्ट रूप से बताता है और हिन्दी में दो जातिवाचक विशेषणों का असहज ढेर लगाने से बचता है।
