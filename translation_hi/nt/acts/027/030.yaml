  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। वाक्य के अंत में अल्पविराम रखा गया है, क्योंकि यूनानी पाठ में यह अगले पद से जुड़ा हुआ आश्रित वाक्यांश है।
