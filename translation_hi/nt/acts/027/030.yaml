source:
  edition: SBLGNT
  text: τῶν δὲ ναυτῶν ζητούντων φυγεῖν ἐκ τοῦ πλοίου καὶ χαλασάντων τὴν σκάφην εἰς τὴν θάλασσαν προφάσει ὡς ἐκ πρῴρης ⸂ἀγκύρας μελλόντων⸃ ἐκτείνειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/030.yaml
  text: And when the sailors were seeking to escape from the ship and had lowered the skiff into the sea under the pretense of being about to lay out anchors from the bow[b][a],
translation:
  language: hi
  text: जब नाविक जहाज़ से भाग निकलने की कोशिश कर रहे थे और यह बहाना करके छोटी नाव[a] को समुद्र में उतार चुके थे कि वे जहाज़ के अगले भाग[b] से लंगर डालने वाले हैं,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यानी जहाज़ के साथ रखी हुई छोटी नाव।
    reason: lexical_clarification
  - marker: b
    text: या “जहाज़ के अगले सिरे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ναυτῶν
  choice: नाविक
  rationale: जहाज़ चलाने वाले कर्मियों के लिए सहज और प्रचलित आधुनिक हिन्दी शब्द।
- source_word: ζητούντων φυγεῖν
  choice: भाग निकलने की कोशिश कर रहे थे
  rationale: ζητέω और infinitive यहाँ प्रयास को व्यक्त करते हैं; प्रसंग में वे जहाज़ छोड़कर बच निकलना चाहते थे।
- source_word: ἐκ τοῦ πλοίου
  choice: जहाज़ से
  rationale: मूल के संबंध को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: χαλασάντων τὴν σκάφην
  choice: छोटी नाव को समुद्र में उतार चुके थे
  rationale: σκάφη जहाज़ के साथ रखी छोटी नाव है; ‘छोटी नाव’ सामान्य पाठक के लिए ‘स्किफ़’ से अधिक स्पष्ट है और ‘जीवनरक्षक नाव’ जैसी अतिरिक्त धारणा नहीं जोड़ता।
- source_word: εἰς τὴν θάλασσαν
  choice: समुद्र में
  rationale: प्रत्यक्ष और स्वाभाविक अनुवाद।
- source_word: προφάσει
  choice: यह बहाना करके
  rationale: यह शब्द वास्तविक मंशा छिपाने के लिए दिए गए झूठे कारण को दर्शाता है।
- source_word: ὡς
  choice: कि
  rationale: बहाने की कथित मंशा को सहज हिन्दी में जोड़ता है।
- source_word: ἐκ πρῴρης
  choice: जहाज़ के अगले भाग से
  rationale: πρῷρα के नौसैनिक अर्थ को ऐसे रूप में व्यक्त करता है जिसे सामान्य हिन्दी पाठक तुरंत समझ सके।
- source_word: ἀγκύρας
  choice: लंगर
  rationale: हिन्दी में गिननीय प्रयोग में एकवचन रूप भी बहुवचन संदर्भ व्यक्त कर सकता है; यहाँ कई लंगरों का आशय प्रसंग से स्पष्ट है।
- source_word: μελλόντων ἐκτείνειν
  choice: डालने वाले हैं
  rationale: μέλλω निकट भविष्य या अभिप्राय और ἐκτείνω इस नौसैनिक प्रसंग में लंगर बाहर डालने की क्रिया बताता है।
theological_decisions: []
