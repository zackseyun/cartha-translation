lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: सूबेदार
  rationale: रोमी सैन्य अधिकारी के लिए हिन्दी बाइबल परंपरा में परिचित और सामान्य पाठक के लिए सुबोध पद; संदर्भ में यह आधुनिक भारतीय सैन्य पद का तकनीकी दावा नहीं करता।
- source_word: κυβερνήτῃ
  choice: जहाज़ चलाने वाला
  rationale: जहाज़ को चलाने और दिशा देने वाले व्यक्ति का अर्थ स्पष्ट करता है तथा ναύκληρος से भूमिका का भेद बनाए रखता है।
- source_word: ναυκλήρῳ
  choice: जहाज़ का मालिक
  rationale: जहाज़ के स्वामी अथवा प्रधान संचालक का संभावित अर्थ व्यक्त करता है और κυβερνήτης से अलग भूमिका दिखाता है।
- source_word: μᾶλλον ἐπείθετο
  choice: अधिक सहमत हुआ
  rationale: πείθω के यहाँ निहित किसी की सलाह मानने या उससे राज़ी होने के अर्थ और μᾶλλον की तुलना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῖς ὑπὸ Παύλου λεγομένοις
  choice: पौलुस की कही बातों
  rationale: पौलुस द्वारा कही गई चेतावनी अथवा सलाह को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: परन्तु
  rationale: पिछले पद में पौलुस की चेतावनी और सूबेदार की प्रतिक्रिया के बीच विरोध स्पष्ट करता है।
- source_word: ἢ
  choice: की अपेक्षा
  rationale: μᾶλλον के साथ तुलना को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
