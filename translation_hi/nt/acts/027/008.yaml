base_translation:
  language: en
  yaml_path: translation/nt/acts/027/008.yaml
  text: And with difficulty coasting along it[a], we came to a certain place called Fair Havens, near which was a city named Lasea.
translation:
  language: hi
  text: और बड़ी कठिनाई से उसके तट के साथ-साथ नाव चलाते हुए[a] हम एक स्थान पर पहुँचे, जिसे सुंदर बंदरगाह कहा जाता था। उसके पास लसया नाम का एक नगर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बड़ी कठिनाई से उसके तट के पास-पास नाव चलाते हुए।” यूनानी क्रिया समुद्र-तट के साथ-साथ नाव से आगे बढ़ने के लिए प्रयुक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις
  choice: बड़ी कठिनाई से
  rationale: यह यात्रा की अत्यंत कठिन प्रगति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; केवल 'मुश्किल से' संभावित 'किसी तरह' का भाव भी दे सकता था।
- source_word: τε
  choice: और
  rationale: यह पिछले वृत्तांत से इस वाक्य का संयोजन बनाए रखता है, बिना यूनानी संबंधबोधक कण को आवश्यकता से अधिक उभारने के।
- source_word: παραλεγόμενοι
  choice: तट के साथ-साथ चलते हुए
  rationale: समुद्री संदर्भ में यह क्रिया तटरेखा के सहारे नौका चलाने को दर्शाती है। हिन्दी में यह वाक्यांश स्पष्ट और सहज है; पादटिप्पणी इसके नौवहन-संबंधी अर्थ को स्पष्ट करती है।
- source_word: αὐτὴν
  choice: उसके
  rationale: सर्वनाम का संदर्भ पिछले पद के क्रेते से है। हिन्दी में संबंधसूचक रूप तट के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: ἤλθομεν
  choice: हम ... पहुँचे
  rationale: गंतव्य तक आने के अर्थ को कथात्मक हिन्दी में 'पहुँचे' अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς τόπον τινά
  choice: एक स्थान पर
  rationale: τινά की अनिश्चितता को बनाए रखते हुए यह आधुनिक हिन्दी में सहज है; 'किसी एक स्थान' अनावश्यक रूप से भारी होता।
- source_word: καλούμενον
  choice: जिसे ... कहा जाता था
  rationale: स्थान का नाम प्रस्तुत करने के लिए यह स्वाभाविक हिन्दी रूप है और यूनानी कृदंत का वर्णनात्मक कार्य बनाए रखता है।
- source_word: Καλοὺς Λιμένας
  choice: सुंदर बंदरगाह
  rationale: यूनानी स्थाननाम का अर्थ 'अच्छे/सुंदर बंदरगाह' है। हिन्दी पाठक के लिए अर्थपूर्ण अनुवाद चुना गया है, न कि अंग्रेज़ी पारंपरिक नाम का लिप्यंतरण।
- source_word: ᾧ ἐγγὺς ἦν πόλις Λασαία
  choice: उसके पास लसया नाम का एक नगर था
  rationale: ᾧ का पूर्वपद उस स्थान से है, ἐγγύς निकटता बताता है, और अनिर्दिष्ट πόλις को 'एक नगर' से व्यक्त किया गया है।
