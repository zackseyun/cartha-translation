    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कथा में अगले क्रमिक कार्य को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἀπέκοψαν
  choice: काट दीं
  rationale: ἀποκόπτω का अर्थ काटकर अलग कर देना है; रस्सियों के साथ यह हिंदी में स्वाभाविक प्रयोग है।
- source_word: οἱ στρατιῶται
  choice: सैनिकों ने
  rationale: कर्ता का सीधा और सामान्य आधुनिक हिंदी रूप।
- source_word: τὰ σχοινία
  choice: रस्सियाँ
  rationale: समुद्री प्रसंग में σχοινία के लिए स्पष्ट और सर्वसुलभ शब्द।
- source_word: τῆς σκάφης
  choice: छोटी नाव
  rationale: σκάφη यहाँ मुख्य जहाज़ से जुड़ी सहायक नाव को दर्शाता है; ‘छोटी नाव’ जहाज़ से उसका भेद सहज रूप से स्पष्ट करता है।
- source_word: εἴασαν
  choice: जाने दिया
  rationale: ἐάω के ‘अनुमति देना/होने देना’ अर्थ को हिंदी की स्वाभाविक संयुक्त क्रिया में व्यक्त करता है।
- source_word: αὐτὴν
  choice: उसे
  rationale: स्त्रीलिंग एकवचन सर्वनाम का संदर्भ छोटी नाव से है।
- source_word: ἐκπεσεῖν
  choice: बह जाने
  rationale: समुद्री संदर्भ में ἐκπίπτω अलग होकर बह जाने का अर्थ दे सकता है; यह रस्सियाँ कटने के बाद नाव की गति को सहज हिंदी में व्यक्त करता है, जबकि मूल की ‘गिर/अलग हो जाने’ की छवि पादटिप्पणी में सुरक्षित है।
