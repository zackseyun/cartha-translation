base_translation:
  language: en
  yaml_path: translation/nt/acts/027/027.yaml
  text: When the fourteenth night had come[a], as we were being driven along in the Adriatic Sea[b], about midnight the sailors began to suspect that some land was drawing near to them.
translation:
  language: hi
  text: जब चौदहवीं रात आई और हम अद्रिया सागर[a] में बहते चले जा रहे थे, तो आधी रात के लगभग नाविकों को आभास होने लगा कि कोई भू-भाग उनके निकट आ रहा था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राचीन काल में ‘अद्रिया’ नाम केवल आज के एड्रियाटिक सागर के लिए नहीं, बल्कि इस क्षेत्र के मध्य भूमध्यसागरीय जल के एक अधिक विस्तृत भाग के लिए भी प्रयुक्त हो सकता था।
    reason: cultural_note
  - marker: b
    text: अर्थात नाविकों को लगा कि वे किसी भू-भाग के निकट पहुँच रहे हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσαρεσκαιδεκάτη νὺξ ἐγένετο
  choice: चौदहवीं रात आई
  rationale: समय-सूचक इस यूनानी मुहावरे का सहज और संक्षिप्त हिन्दी रूप; यह तूफ़ानी यात्रा की चौदहवीं रात के आ पहुँचने को व्यक्त करता है।
- source_word: διαφερομένων ἡμῶν
  choice: हम ... बहते चले जा रहे थे
  rationale: वर्तमानकालिक कर्मवाच्य कृदन्त अनियंत्रित और जारी गति को दिखाता है। प्रसंग में जहाज़ हवा और लहरों के वश में था; ‘बहते चले जा रहे थे’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ Ἀδρίᾳ
  choice: अद्रिया सागर में
  rationale: ‘अद्रिया’ प्राचीन भौगोलिक नाम को सुरक्षित रखता है; ‘सागर’ हिन्दी पाठक को इसका आशय स्पष्ट करता है, जबकि पादटिप्पणी प्राचीन और आधुनिक भौगोलिक सीमाओं का अंतर बताती है।
- source_word: κατὰ μέσον τῆς νυκτός
  choice: आधी रात के लगभग
  rationale: मूल वाक्यांश रात के मध्य के आसपास का समय बताता है; ‘लगभग’ उसकी अनुमानात्मकता बनाए रखता है।
- source_word: ὑπενόουν
  choice: आभास होने लगा
  rationale: अपूर्ण भूतकाल उभरते हुए अनुमान या संदेह को सूचित कर सकता है। नाविकों के अनुभवजन्य अनुमान के लिए यह वर्तमान हिन्दी में स्वाभाविक है।
- source_word: τινὰ ... χώραν
  choice: कोई भू-भाग
  rationale: 'τινά की अनिश्चितता बनाए रखी गई है: नाविकों को निकट भूमि का आभास था, पर वे नहीं जानते थे कि वह कौन-सी भूमि थी।'
- source_word: προσάγειν ... αὐτοῖς
  choice: उनके निकट आ रहा है
  rationale: यह यूनानी वाक्य की दृष्टि और चित्रात्मकता को बनाए रखता है, जिसमें भू-भाग नाविकों के निकट आता हुआ प्रतीत होता है।
