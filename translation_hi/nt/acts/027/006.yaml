  yaml_path: translation/nt/acts/027/006.yaml
  text: There the centurion found an Alexandrian ship sailing for Italy[a], and he put us on board it.
translation:
  language: hi
  text: वहाँ सूबेदार को सिकंदरिया का एक जहाज़ मिला, जो इटली जा रहा था, और सूबेदार ने हमें उस पर चढ़ा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖ
  choice: वहाँ
  rationale: κἀκεῖ का अर्थ ‘और वहाँ’ है; हिन्दी कथा-प्रवाह में पूर्ववर्ती संबंध स्वतः स्पष्ट होने के कारण ‘वहाँ’ स्वाभाविक है।
- source_word: εὑρὼν
  choice: मिला
  rationale: 'पूर्वकालिक कृदंत को स्वाभाविक हिन्दी में मुख्य क्रिया के साथ क्रमबद्ध रूप में व्यक्त किया गया है: सूबेदार को जहाज़ मिला और फिर उसने यात्रियों को उस पर चढ़ाया।'
- source_word: ἑκατοντάρχης
  choice: सूबेदार
  rationale: यह रोमी सैन्य पदाधिकारी के लिए प्रचलित और सामान्य पाठक के लिए सुबोध हिन्दी बाइबलीय पद है; संदर्भ में लगभग सौ सैनिकों के अधिकारी का बोध कराता है।
- source_word: πλοῖον Ἀλεξανδρῖνον
  choice: सिकंदरिया का एक जहाज़
  rationale: Ἀλεξανδρῖνον जहाज़ का सिकंदरिया से संबंध बताता है, पर ठीक-ठीक जन्मस्थान, प्रस्थान-बंदरगाह या पंजीकरण तय नहीं करता; ‘सिकंदरिया का’ इस व्यापकता को बनाए रखता है।
- source_word: πλέον εἰς τὴν Ἰταλίαν
  choice: जो इटली जा रहा था
  rationale: वर्तमान कृदंत जहाज़ की यात्रा-दिशा या गंतव्य बताता है; यह सरल हिन्दी में समुद्री यात्रा का आशय स्पष्ट करता है।
- source_word: ἐνεβίβασεν ἡμᾶς εἰς αὐτό
  choice: उसने हमें उस पर चढ़ा दिया
  rationale: क्रिया का कारक अर्थ है कि अधिकारी ने उन्हें जहाज़ पर सवार कराया; ‘चढ़ा दिया’ इसे सहज और स्पष्ट हिन्दी में व्यक्त करता है।
