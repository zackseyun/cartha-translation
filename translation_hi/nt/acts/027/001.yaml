source:
  edition: SBLGNT
  text: Ὡς δὲ ἐκρίθη τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν, παρεδίδουν τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ σπείρης Σεβαστῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/001.yaml
  text: When it was decided that we should sail for Italy[a], they handed over both Paul and some other prisoners to a centurion named Julius, of the Augustan Cohort.
translation:
  language: hi
  text: जब यह निर्णय हुआ कि हम इटली के लिए जहाज़ से रवाना हों, तो उन्होंने पौलुस और कुछ अन्य कैदियों को यूलियुस नाम के एक सेंचुरियन के हवाले कर दिया, जो सम्राटीय पलटन[a] का था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “औगुस्तुस की पलटन”; संभवतः “सेबास्ते की पलटन।” यूनानी शब्द Σεβαστῆς औगुस्तुस अथवा सम्राट से संबंधित उपाधि को दर्शाता है, पर यह निश्चित नहीं है कि यहाँ किस सैन्य इकाई का उल्लेख है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκρίθη
  choice: यह तय हुआ
  rationale: कर्मवाच्य में प्रयुक्त इस क्रिया का यहाँ भाव एक प्रशासनिक निर्णय का है; यह हिंदी में स्वाभाविक रहते हुए मूल की अनिश्चित कर्तृवाचकता बनाए रखती है।
- source_word: τοῦ ἀποπλεῖν ἡμᾶς εἰς τὴν Ἰταλίαν
  choice: कि हम जहाज़ से इतालिया जाएँ
  rationale: यह निर्णय की विषयवस्तु व्यक्त करता है। ‘जहाज़ से’ समुद्री यात्रा का भाव स्पष्ट करता है, और ‘हम’ प्रथम-पुरुष बहुवचन को सुरक्षित रखता है।
- source_word: παρεδίδουν
  choice: उन्होंने … हवाले कर दिया
  rationale: यह औपचारिक रूप से बंदियों की अभिरक्षा सौंपने का स्वाभाविक आधुनिक हिंदी रूप है। यूनानी अपूर्णकाल को कथानक में हिंदी का सामान्य भूतकाल सहजता से व्यक्त करता है।
- source_word: τόν τε Παῦλον καί τινας ἑτέρους δεσμώτας
  choice: पौलुस और कुछ अन्य कैदियों को
  rationale: τε…καί के संयुक्त बल को हिंदी में ‘और’ स्वाभाविक रूप से वहन करता है; δεσμώτας के लिए ‘कैदी’ स्पष्ट और प्रचलित है।
- source_word: ἑκατοντάρχῃ ὀνόματι Ἰουλίῳ
  choice: यूलियुस नाम के एक सूबेदार के
  rationale: ‘सूबेदार’ रोमी centurion के लिए हिंदी बाइबलीय परंपरा में परिचित कार्यात्मक पदनाम है; ‘एक’ इस व्यक्ति के पहली बार परिचय को दर्शाता है।
- source_word: σπείρης Σεβαστῆς
  choice: सम्राटीय पलटन
  rationale: σπεῖρα एक रोमी सैन्य दल को और Σεβαστή सम्राट/औगुस्तुस से संबद्ध उपाधि को सूचित करता है। ‘सम्राटीय पलटन’ सामान्य पाठक के लिए अर्थ स्पष्ट करता है; ऐतिहासिक इकाई की अनिश्चितता पाद-टिप्पणी में रखी गई है।
theological_decisions:
- issue: σπείρης Σεβαστῆς नामक विवादित सैन्य पदनाम
  choice: सम्राटीय पलटन
  alternative: ‘औगुस्तीय पलटन’ या ‘सेबास्ते की पलटन’
  rationale: यह मुख्यतः ऐतिहासिक, न कि सिद्धान्तगत, प्रश्न है। मुख्य पाठ में अर्थ-सुलभ रूप चुना गया है, जबकि अधिक शाब्दिक संभावनाएँ और सटीक इकाई की अनिश्चितता पाद-टिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण कथात्मक शैली। रोमी पदों के लिए सामान्य पाठक को समझ आने वाले ‘सूबेदार’ और ‘पलटन’ चुने गए हैं। मुख्य पाठ का [a] पाद-टिप्पणी से मेल खाता है।
