  text: Ὅτε δὲ ἡμέρα ἐγένετο, τὴν γῆν οὐκ ἐπεγίνωσκον, κόλπον δέ τινα κατενόουν ἔχοντα αἰγιαλὸν εἰς ὃν ⸀ἐβουλεύοντο εἰ ⸀δύναιντο ⸀ἐξῶσαι τὸ πλοῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/039.yaml
  text: When day came[a], they did not recognize the land, but they noticed a certain bay with a beach, into which they planned, if they could, to run the ship ashore.
translation:
  language: hi
  text: जब दिन हुआ, तब वे उस भूमि को पहचान नहीं सके। पर उन्होंने एक खाड़ी देखी, जिसके पास समुद्र-तट था। वे विचार करने लगे कि यदि वे ऐसा कर सकें, तो जहाज़ को उस खाड़ी के तट पर चढ़ा दें[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जहाज़ को किनारे पर चढ़ा दें।” यूनानी क्रिया में जहाज़ को आगे धकेलकर या बलपूर्वक तट पर चढ़ाने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ ἡμέρα ἐγένετο
  choice: जब दिन निकला
  rationale: यह अभिव्यक्ति दिन का उजाला होने का स्वाभाविक आधुनिक हिन्दी रूप है; δέ की हल्की कथात्मक संक्रमण-भूमिका को अलग शब्द जोड़कर अधिक स्पष्ट नहीं किया गया।
- source_word: τὴν γῆν οὐκ ἐπεγίνωσκον
  choice: वे उस भूभाग को पहचान नहीं पाए
  rationale: ἐπιγινώσκω यहाँ पहचानने या जगह की पहचान कर पाने के अर्थ में है। γῆ का सीधा अर्थ ‘भूमि’ है, पर इस संदर्भ में दिखाई देने वाला स्थल या तटीय भूभाग अभिप्रेत है।
- source_word: κόλπον δέ τινα κατενόουν
  choice: पर उन्हें एक खाड़ी दिखाई दी
  rationale: κόλπος समुद्री संदर्भ में खाड़ी है और τινα की अनिश्चितता ‘एक’ से बनी रहती है। κατενόουν ध्यान देकर देखने या गौर करने को दर्शाता है; हिन्दी में ‘दिखाई दी’ प्रसंगानुकूल और सहज है।
- source_word: ἔχοντα αἰγιαλὸν
  choice: जिसका एक समुद्र-तट था
  rationale: αἰγιαλός समुद्र के किनारे या तट को दर्शाता है। ‘समुद्र-तट’ ठोस और स्पष्ट है तथा मूल पाठ में न होने के कारण ‘रेतीला’ नहीं जोड़ा गया।
- source_word: ἐβουλεύοντο
  choice: उन्होंने योजना बनाई
  rationale: βουλεύομαι विचार, निश्चय या योजना बनाने को व्यक्त कर सकता है। यहाँ जहाज़ को तट तक पहुँचाने की सोची हुई कार्रवाई अभिप्रेत है।
- source_word: εἰ δύναιντο
  choice: यदि हो सके
  rationale: यह मूल यूनानी की संभावना और अनिश्चितता को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐξῶσαι τὸ πλοῖον
  choice: जहाज़ को ... तट पर चढ़ा दें
  rationale: ἐξωθέω जहाज़ को बलपूर्वक किनारे की ओर ले जाकर तट पर चढ़ाने का भाव देता है। यह हिन्दी रूप समुद्री कार्रवाई को स्पष्ट करता है।
