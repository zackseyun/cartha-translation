  register: भाषा आधुनिक, कथात्मक और गरिमापूर्ण रखी गई है। छोटे वाक्यों से समुद्री घटनाक्रम स्पष्ट होता है। मूल पाठ की अनिश्चितता ‘यदि हो सके’ में सुरक्षित है और स्थल की पहचान के बारे में कोई अतिरिक्त अनुमान नहीं जोड़ा गया।
