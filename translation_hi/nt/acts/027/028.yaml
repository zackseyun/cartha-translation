    reason: lexical_alternative
lexical_decisions:
- source_word: βολίσαντες
  choice: गहराई नापी
  rationale: यह कृदन्त समुद्र की गहराई नापने के लिए भार लगी डोरी डालने की नाविक क्रिया को दर्शाता है। मुख्य पाठ में स्वाभाविक आधुनिक हिन्दी रखी गई है और विशिष्ट विधि पादटिप्पणी में स्पष्ट की गई है।
- source_word: εὗρον
  choice: वह ... निकली
  rationale: माप के प्राप्त परिणाम को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है; दोनों स्थलों पर यूनानी εὗρον का आशय सुरक्षित है।
- source_word: ὀργυιὰς
  choice: फ़ैदम
  rationale: ὀργυιά लगभग छह फुट की समुद्री गहराई की इकाई है। ऐतिहासिक माप को आधुनिक इकाई में बदलने के बजाय नाविक इकाई को लिप्यंतरित किया गया है।
- source_word: εἴκοσι
  choice: बीस
  rationale: संख्या का सीधा अनुवाद।
- source_word: βραχὺ διαστήσαντες
  choice: थोड़ा आगे बढ़कर
  rationale: इस यात्रा-संदर्भ में थोड़ी दूरी आगे जाने का अर्थ देता है और हिन्दी में सहज है।
- source_word: πάλιν
  choice: दोबारा
  rationale: गहराई नापने की क्रिया की पुनरावृत्ति स्पष्ट करता है।
- source_word: δεκαπέντε
  choice: पंद्रह
  rationale: संख्या का सीधा अनुवाद।
- source_word: καὶ ... δὲ ... καὶ
  choice: '... फिर ...'
  rationale: यहाँ संयोजक मुख्यतः घटनाओं का क्रम बताते हैं, प्रबल विरोध नहीं; हिन्दी में स्वाभाविक कथात्मक क्रम रखा गया है।
