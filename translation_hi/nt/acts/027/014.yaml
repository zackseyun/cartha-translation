  text: But not long after[b][a], a typhonic wind called Euraquilo rushed down against it.
translation:
  language: hi
  text: परन्तु थोड़ी ही देर बाद उस पर ‘यूराकीलोन’[a] कहलाने वाली प्रचंड तूफानी हवा[b] टूट पड़ी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में ‘यूराकीलोन’ के स्थान पर ‘यूरोक्लूदोन’ पढ़ा जाता है।
    reason: textual_variant
  - marker: b
    text: या, ‘प्रचंड उत्तर-पूर्वी हवा’। यह नाम संभवतः उत्तर-पूर्व से आने वाली तूफानी हवा को सूचित करता है, पर यूनानी पाठ इसे नाम के रूप में प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολὺ
  choice: थोड़ी ही देर बाद
  rationale: यह मुहावरेदार समय-सूचक पद थोड़े समय के बाद की बात बताता है; यह हिंदी में स्वाभाविक और सटीक है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह कथा में आए अचानक प्रतिकूल मोड़ को हल्के विरोध के साथ व्यक्त करता है।
- source_word: ἔβαλεν κατ’ αὐτῆς
  choice: उस पर ... टूट पड़ी
  rationale: हवा के हिंसक और आकस्मिक वेग को स्वाभाविक हिंदी में व्यक्त करता है। स्त्रीलिंग सर्वनाम का संभावित संदर्भ निकटवर्ती द्वीप/तट है; ‘उस पर’ मूल की संदर्भगत संक्षिप्तता को बनाए रखता है।
- source_word: ἄνεμος τυφωνικὸς
  choice: प्रचंड बवंडरी हवा
  rationale: τυφωνικός एक हिंसक, घूमती हुई तूफानी हवा का बोध कराता है। यह अभिव्यक्ति आधुनिक मौसम-विज्ञान की किसी कठोर श्रेणी को आरोपित किए बिना उसकी तीव्रता और प्रकृति बताती है।
- source_word: ὁ καλούμενος
  choice: कहलाने वाली
  rationale: यह किसी नाम या प्रचलित पदनाम का परिचय देने वाला स्वाभाविक हिंदी रूप है।
- source_word: Εὐρακύλων
  choice: यूराकुलोन
  rationale: SBLGNT में दिए यूनानी व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण है; इसे अर्थानुवाद करके ‘उत्तर-पूर्वी हवा’ नहीं बनाया गया।
