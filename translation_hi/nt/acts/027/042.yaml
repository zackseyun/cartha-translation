- source_word: βουλὴ ἐγένετο
  choice: यह योजना बनाई
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप; इससे सैनिकों के बीच बनी योजना का भाव स्पष्ट होता है।
- source_word: τοὺς δεσμώτας
  choice: कैदियों को
  rationale: सन्दर्भ में हिरासत में रखे गए व्यक्तियों के लिए आधुनिक और सहज हिन्दी शब्द।
- source_word: ἐκκολυμβήσας διαφύγῃ
  choice: तैरकर भाग न निकले
  rationale: दोनों क्रियाओं—तैरकर निकलने और बच भागने—का अर्थ संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
