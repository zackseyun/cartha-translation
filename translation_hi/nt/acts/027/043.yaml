translation:
  language: hi
  text: लेकिन सूबेदार पौलुस को बचाना चाहता था, इसलिए उसने सैनिकों को उनकी योजना पूरी करने से रोक दिया। फिर उसने तैर सकने वालों को आदेश दिया कि वे पहले जहाज़ से कूदकर किनारे पर जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: सूबेदार
  rationale: रोमी सैन्य अधिकारी के पद के लिए हिन्दी बाइबल परंपरा में परिचित और सामान्य पाठक के लिए सहज शब्द; यह आधुनिक भारतीय पद से पूर्णतः समानता का दावा किए बिना अधिकारी की भूमिका बताता है।
- source_word: βουλόμενος
  choice: चाहता था
  rationale: कृदंत अधिकारी की इच्छा या मंशा व्यक्त करता है; यह स्वाभाविक हिन्दी है और उसके निश्चय को अनावश्यक रूप से प्रबल नहीं बनाता।
- source_word: διασῶσαι
  choice: बचाना
  rationale: संदर्भ में पौलुस का प्राण सुरक्षित रखना अभिप्रेत है; ‘बचाना’ स्पष्ट और स्वाभाविक है।
- source_word: ἐκώλυσεν αὐτοὺς τοῦ βουλήματος
  choice: उसने उन्हें अपनी योजना पूरी करने से रोक दिया
  rationale: यह पदबंध सैनिकों को पिछले पद में बताई गई मंशा कार्यान्वित करने से रोकने का अर्थ देता है; ‘अपनी’ का संदर्भ ‘उन्हें’ अर्थात सैनिकों से है।
- source_word: ἐκέλευσέν τε
  choice: फिर उसने ... आदेश दिया
  rationale: κελεύω अधिकारपूर्वक आदेश देने को व्यक्त करता है; ‘फिर’ कथात्मक क्रम को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: τοὺς δυναμένους κολυμβᾶν
  choice: तैर सकने वालों को
  rationale: यह जहाज़ पर उपस्थित लोगों में से तैरने में समर्थ समूह को संक्षेप और स्पष्ट रूप में पहचानता है।
- source_word: ἀπορίψαντας
  choice: जहाज़ से कूदकर
  rationale: शाब्दिक अर्थ स्वयं को नीचे/बाहर फेंकना है; समुद्री संदर्भ में ‘जहाज़ से कूदकर’ अभिप्रेत क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: πρώτους
  choice: पहले
  rationale: यह तैर सकने वालों के अन्य लोगों से पहले जाने का क्रम सूचित करता है।
- source_word: ἐπὶ τὴν γῆν ἐξιέναι
  choice: किनारे पर जाएँ
  rationale: समुद्र से स्थल की ओर निकलने की दिशा व्यक्त होती है; ‘किनारे पर जाएँ’ लक्ष्य को स्पष्ट रखता है, पर वहाँ पहुँच जाने की सफलता को अनावश्यक रूप से पूर्वनिर्धारित नहीं करता।
