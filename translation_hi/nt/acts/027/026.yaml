  text: εἰς νῆσον δέ τινα δεῖ ἡμᾶς ἐκπεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/026.yaml
  text: But we must run aground on some island[a].
translation:
  language: hi
  text: पर हमें किसी द्वीप पर जा लगना ही होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहकर किसी द्वीप के तट पर जा पड़ना होगा।”
    reason: ἐκπεσεῖν के समुद्री प्रयोग का वैकल्पिक अनुवाद, जिसमें बाहरी शक्तियों द्वारा बहाए जाने का भाव अधिक स्पष्ट है।
lexical_decisions:
- source_word: δέ
  choice: पर
  rationale: यह निकटवर्ती कथन से हल्का विरोध अथवा आगे बढ़ने का संकेत देता है; यहाँ ‘पर’ स्वाभाविक है।
- source_word: τινα
  choice: किसी
  rationale: अनिश्चित सर्वनाम द्वीप की पहचान को अनिर्दिष्ट रखता है।
- source_word: δεῖ
  choice: ही होगा
  rationale: यह आवश्यक होने का प्रबल भाव व्यक्त करता है और हिन्दी में प्रसंगानुकूल स्वाभाविक है।
- source_word: ἡμᾶς
  choice: हमें
  rationale: δεῖ के साथ प्रयुक्त क्रिया के कर्ता को हिन्दी में ‘हमें ... होगा’ की सहज रचना से व्यक्त किया गया है।
- source_word: εἰς νῆσον
  choice: किसी द्वीप पर
  rationale: εἰς की दिशात्मकता और νῆσον का अर्थ प्राकृतिक हिन्दी में ‘द्वीप पर’ से व्यक्त होता है।
- source_word: ἐκπεσεῖν
  choice: जा लगना
  rationale: समुद्री प्रसंग में यह जहाज़ के बहते या मार्ग से हटकर तट/भूमि पर जा लगने को सूचित करता है; यह हिन्दी में संक्षिप्त और स्वाभाविक है, जबकि वैकल्पिक निष्क्रिय भाव पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: δεῖ में निहित आवश्यकता का स्वरूप
  choice: ‘ही होगा’ द्वारा आवश्यकता को स्पष्ट रखा गया
  alternative: इसे केवल संभावना के रूप में ‘शायद’ या ‘हो सकता है’ कहना
  rationale: मूल पाठ आवश्यकता व्यक्त करता है, पर इस छोटे वाक्य में उसके दैवी या केवल परिस्थितिजन्य स्रोत को अलग से निर्धारित नहीं करता; अनुवाद भी यह तनाव खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखा गया है। ‘जा लगना’ समुद्री घटना को स्वाभाविक रूप से व्यक्त करता है, और पादटिप्पणी मूल क्रिया की वैकल्पिक निष्क्रिय छाया सुरक्षित रखती है।
