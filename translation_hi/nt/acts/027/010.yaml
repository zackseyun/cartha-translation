source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Ἄνδρες, θεωρῶ ὅτι μετὰ ὕβρεως καὶ πολλῆς ζημίας οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ τῶν ψυχῶν ἡμῶν μέλλειν ἔσεσθαι τὸν πλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/010.yaml
  text: saying to them[a], “Men, I perceive that the voyage is about to be with disaster and great loss, not only of the cargo and the ship[b], but also of our lives.”
translation:
  language: hi
  text: उसने उनसे कहा, “सज्जनो, मैं समझता हूँ कि इस समुद्री यात्रा में विपत्ति आएगी और बहुत भारी हानि होगी—न केवल माल और जहाज़ की, बल्कि हमारे प्राणों की भी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: उसने उनसे कहा
  rationale: यूनानी वर्तमान कृदंत कथानक में सहगामी क्रिया बताता है; स्वाभाविक हिन्दी में इसे पूर्ण क्रिया के रूप में व्यक्त किया गया है।
- source_word: Ἄνδρες
  choice: भाइयो
  rationale: यह पुरुषों के समूह को संबोधित करने वाला बहुवचन संबोधन है। आधुनिक हिन्दी में ‘भाइयो’ प्रत्यक्ष और स्वाभाविक संबोधन है, जबकि ‘पुरुषो’ असहज लगता है।
- source_word: θεωρῶ
  choice: मुझे लगता है
  rationale: यहाँ शब्द केवल आँखों से देखने के बजाय परिस्थिति के आधार पर समझने या अनुमान करने का भाव देता है।
- source_word: μετὰ ὕβρεως καὶ πολλῆς ζημίας
  choice: विपत्ति और भारी हानि के साथ
  rationale: समुद्री संदर्भ में ὕβρις हिंसक कठिनाई या विपत्ति की ओर संकेत करता है, और ζημία नुकसान अथवा हानि को व्यक्त करता है। यह हिन्दी गंभीरता और दोनों संज्ञाओं का भेद बनाए रखती है।
- source_word: οὐ μόνον τοῦ φορτίου καὶ τοῦ πλοίου ἀλλὰ καὶ
  choice: न केवल माल और जहाज़ की, बल्कि ... भी
  rationale: φορτίον के लिए जहाज़ी संदर्भ में ‘माल’ सहज है। सम्बन्धकारक रूपों को ‘हानि’ से जोड़कर हिन्दी में संक्षिप्त रूप से व्यक्त किया गया है।
- source_word: τῶν ψυχῶν ἡμῶν
  choice: हमारे प्राणों की
  rationale: इस संभावित जहाज़-डूबने और मृत्यु के संदर्भ में ψυχή का अर्थ जीवन है। ‘प्राण’ गरिमापूर्ण और स्पष्ट हिन्दी है तथा इसे अमूर्त आत्मा के सिद्धान्त तक सीमित नहीं करता।
- source_word: μέλλειν ἔσεσθαι
  choice: होने वाली है
  rationale: यह अभिव्यक्ति आसन्न या अपेक्षित परिणाम का भाव देती है, जिसे हिन्दी भविष्यसूचक संरचना स्वाभाविक रूप से व्यक्त करती है।
- source_word: τὸν πλοῦν
  choice: यह समुद्री यात्रा
  rationale: πλοῦς विशेष रूप से समुद्र की यात्रा या जलयात्रा को दर्शाता है; ‘समुद्री यात्रा’ साधारण पाठक के लिए स्पष्ट है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज रखी गई है। ‘भाइयो’ संबोधन पुरुषों के जहाज़ी समूह को दर्शाता है; ‘प्राणों’ का अर्थ यहाँ भौतिक जीवन है। स्रोत में मौजूद तीव्रता को ‘विपत्ति और भारी हानि’ से बनाए रखा गया है।
