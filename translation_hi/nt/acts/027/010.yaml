review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the anticipated maritime disaster, extensive loss, cargo, ship, and threatened physical lives. However, ‘भाइयो’ introduces a fraternal/kinship nuance not expressed by the Greek vocative Ἄνδρες (‘men’).
  naturalness: The Hindi is generally clear and modern. Recasting the prediction as ‘इस समुद्री यात्रा में विपत्ति आएगी और बहुत भारी हानि होगी’ is more idiomatic than making ‘यात्रा’ itself ‘विपत्ति और हानि के साथ होने वाली’ and preserves the Greek sense.
  terminology: ‘माल,’ ‘जहाज़,’ and ‘प्राण’ are suitable in context. ‘प्राण’ properly communicates physical lives here, rather than immaterial souls. ‘सज्जनो’ is a natural formal Hindi address without adding the kinship implication of ‘भाइयो.’
  issues:
  - severity: medium
    issue: ‘भाइयो’ for Ἄνδρες
    rationale: Ἄνδρες is an address to men, not an assertion of brotherhood. Although ‘भाइयो’ can be idiomatic in Hindi public address, it adds a relational nuance absent from the source. ‘सज्जनो’ is a natural formal address in modern Hindi and avoids that addition.
  - severity: low
    issue: Awkward predication of disaster and loss
    rationale: ‘यात्रा विपत्ति और भारी हानि के साथ होने वाली है’ is understandable but less natural Hindi. Expressing that disaster will come and great loss will occur during the voyage reads more smoothly while retaining the source’s anticipated-result sense.
  revised_text: उसने उनसे कहा, “सज्जनो, मैं समझता हूँ कि इस समुद्री यात्रा में विपत्ति आएगी और बहुत भारी हानि होगी—न केवल माल और जहाज़ की, बल्कि हमारे प्राणों की भी।”
  revised_footnotes: []
  revision_rationale: The revision removes the added fraternal nuance in the form of address and improves Hindi sentence flow. It retains the warning’s prospective force, the distinction between calamity and great loss, and the contextual sense of ψυχαί as physical lives.
