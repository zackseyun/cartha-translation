- from: उसने उनसे कहा, “भाइयो, मुझे लगता है कि यह समुद्री यात्रा विपत्ति और भारी हानि के साथ होने वाली है—न केवल माल और जहाज़ की, बल्कि हमारे प्राणों की भी।”
