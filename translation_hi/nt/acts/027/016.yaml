  language: hi
  text: फिर हम कौदा नामक एक छोटे-से द्वीप की आड़ में पहुँचे[a], तो बड़ी कठिनाई से जहाज़ की छोटी नाव को काबू में कर सके।
  philosophy: optimal-equivalence
  footnotes:
