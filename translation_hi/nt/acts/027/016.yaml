    reason: lexical_alternative
lexical_decisions:
- source_word: νησίον ... τι
  choice: एक छोटे द्वीप
  rationale: νησίον का लघुतासूचक रूप छोटे द्वीप का भाव देता है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: δέ
  choice: फिर
  rationale: यहाँ δέ कथा में हल्का संक्रमण दिखाता है; हिन्दी में ‘फिर’ प्रसंग के प्रवाह को स्वाभाविक रखता है, बिना अनावश्यक प्रबल विरोध जोड़े।
- source_word: ὑποδραμόντες
  choice: की आड़ में पहुँचे
  rationale: समुद्री प्रसंग में क्रिया का अर्थ हवा से बचने के लिए द्वीप की ओट या आड़ की ओर बढ़ना है। यह अनुवाद तकनीकी भाषा के बिना उस आश्रयकारी दिशा को स्पष्ट करता है।
- source_word: καλούμενον Καῦδα
  choice: कौदा नामक
  rationale: यह द्वीप का सीधा नामनिर्देशन है; Καῦδα का हिन्दी लिप्यंतरण ‘कौदा’ रखा गया है।
- source_word: ἰσχύσαμεν μόλις
  choice: बड़ी कठिनाई से ... सके
  rationale: यह पदसमूह काम को लगभग असमर्थता की सीमा तक कठिन होने के रूप में व्यक्त करता है; हिन्दी में यह मुहावरेदार ढंग से वही अर्थ देता है।
- source_word: περικρατεῖς γενέσθαι
  choice: अपने काबू में कर सके
  rationale: पद का मूल भाव किसी वस्तु पर अधिकार या नियंत्रण पा लेना है। यह विकल्प नाव को पकड़कर नियंत्रित करने का अर्थ रखता है, केवल बाँध देने का अधिक विशिष्ट अर्थ नहीं थोपता।
- source_word: τῆς σκάφης
  choice: जहाज़ की छोटी नाव
  rationale: σκάφη बड़े जहाज़ के साथ रहने वाली छोटी नाव को दर्शाता है। ‘जहाज़ की छोटी नाव’ सामान्य पाठक के लिए स्पष्ट है।
