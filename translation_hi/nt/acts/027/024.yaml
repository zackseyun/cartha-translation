source:
  edition: SBLGNT
  text: λέγων· Μὴ φοβοῦ, Παῦλε· Καίσαρί σε δεῖ παραστῆναι, καὶ ἰδοὺ κεχάρισταί σοι ὁ θεὸς πάντας τοὺς πλέοντας μετὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/024.yaml
  text: saying, ‘Do not be afraid, Paul. You must stand before Caesar, and look, God has granted to you all those sailing with you.’
translation:
  language: hi
  text: उसने कहा, “पौलुस, मत डर! तुझे कैसर के सामने उपस्थित होना ही है। और देख, परमेश्वर ने तेरे साथ समुद्र-यात्रा कर रहे सभी लोगों को तुझे प्रदान किया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖ
  choice: होना ही है
  rationale: यह दैवी आवश्यकता या अनिवार्यता का भाव व्यक्त करता है, केवल भविष्य की साधारण सूचना नहीं।
- source_word: παραστῆναι
  choice: के सामने उपस्थित होना
  rationale: न्यायिक या राजकीय उपस्थिति के संदर्भ में स्वाभाविक हिन्दी, जो मूल के ‘सामने खड़े होने/पेश होने’ के भाव को बनाए रखती है।
- source_word: Καίσαρί
  choice: कैसर
  rationale: यह रोमी सम्राट की उपाधि है; परिचित बाइबलीय रूप ‘कैसर’ रखा गया है।
- source_word: ἰδοὺ
  choice: देख
  rationale: वक्ता के ध्यान आकर्षित करने वाले मूल उद्गार को प्रत्यक्ष रूप में सुरक्षित रखता है।
- source_word: κεχάρισταί σοι
  choice: तुझे प्रदान किया है
  rationale: मूल क्रिया अनुग्रहपूर्वक देने का भाव रखती है। वाक्य में लोगों को पौलुस के कारण बचाए जाने का निहितार्थ हो सकता है, पर अनुवाद उसे स्पष्ट जोड़कर मूल की अभिव्यक्ति को संकीर्ण नहीं करता।
- source_word: τοὺς πλέοντας μετὰ σοῦ
  choice: तेरे साथ जहाज़ में यात्रा कर रहे सभी लोगों को
  rationale: πλέω के समुद्री यात्रा करने के अर्थ को सामान्य पाठक के लिए स्पष्ट और स्वाभाविक बनाया गया है।
theological_decisions:
- issue: परमेश्वर द्वारा सहयात्रियों को पौलुस को ‘देने’ का आशय
  choice: सभी लोगों को भी तुझे प्रदान किया है
  alternative: तेरे साथ यात्रा कर रहे सभी लोगों के प्राण परमेश्वर ने तेरे कारण बचा दिए हैं
  rationale: वैकल्पिक रूप प्रसंगगत आशय स्पष्ट करता है, किंतु ‘प्राण’, ‘तेरे कारण’ और ‘बचा दिए’ को प्रत्यक्ष रूप से जोड़ता है। चुना हुआ रूप मूल की अनुग्रहपूर्ण प्रदान किए जाने की भाषा और उसकी संभावित व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण संबोधन रखा गया है। ‘मत डर’, ‘होना ही है’ और ‘और देख’ से वाणी की तात्कालिकता बनी रहती है; ‘जहाज़ में यात्रा’ सामान्य पाठक के लिए समुद्री संदर्भ स्पष्ट करती है।
