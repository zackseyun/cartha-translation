  text: εἶπεν ὁ Παῦλος τῷ ἑκατοντάρχῃ καὶ τοῖς στρατιώταις· Ἐὰν μὴ οὗτοι μείνωσιν ἐν τῷ πλοίῳ, ὑμεῖς σωθῆναι οὐ δύνασθε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/031.yaml
  text: Paul said to the centurion and the soldiers[a], “Unless these men remain in the ship, you cannot be saved.”
translation:
  language: hi
  text: पौलुस ने सूबेदार और सैनिकों से कहा, “यदि ये लोग जहाज़ पर न रहें, तो तुम बच नहीं सकते।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बचाए नहीं जा सकते।” यूनानी क्रिया का अर्थ “बचाना” या “उद्धार करना” है; यहाँ बात शारीरिक रूप से जीवित बचने की है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: सूबेदार
  rationale: रोमी सैन्य पद के लिए हिन्दी बाइबल परंपरा में प्रचलित और संक्षिप्त शब्द; यहाँ सौ सैनिकों के अधिकारी का बोध कराता है।
- source_word: οὗτοι
  choice: ये लोग
  rationale: संकेतवाचक शब्द प्रसंग में जहाज़ छोड़ने का प्रयास कर रहे नाविकों की ओर संकेत करता है; ‘लोग’ जोड़ने से हिन्दी में संदर्भ स्वाभाविक रूप से स्पष्ट होता है।
- source_word: μείνωσιν
  choice: रहें
  rationale: μένω के ‘ठहरे रहें/बने रहें’ अर्थ को सरल और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πλοίῳ
  choice: जहाज़
  rationale: समुद्री यात्रा में प्रयुक्त बड़े पोत के लिए ‘जहाज़’ सबसे स्वाभाविक और सटीक हिन्दी शब्द है।
- source_word: σωθῆναι
  choice: बच
  rationale: σῴζω का मूल ‘बचाया जाना/बचना’ अर्थ सुरक्षित रहता है; इस प्रसंग में यह तूफ़ान और जहाज़ टूटने से शारीरिक प्राणरक्षा को दर्शाता है।
- source_word: οὐ δύνασθε
  choice: नहीं सकते
  rationale: नकार सहित सामर्थ्य के क्रियापद का सीधा, स्पष्ट और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: σωθῆναι को व्यापक ‘उद्धार’ शब्द से व्यक्त किया जाए या प्रसंगानुसार शारीरिक बचाव के रूप में।
  choice: बच नहीं सकते
  alternative: उद्धार नहीं पा सकते / सुरक्षित नहीं बच सकते
  rationale: तात्कालिक प्रसंग समुद्री संकट में प्राण बचने का है। ‘बच’ यूनानी क्रिया के व्यापक अर्थ से संगत रहते हुए हिन्दी पाठक को यहाँ अनावश्यक रूप से अनन्त उद्धार का अर्थ लेने से रोकता है; पादटिप्पणी मूल क्रिया की व्यापकता बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। ‘सूबेदार’ पारंपरिक रूप से पहचाना जाने वाला पदनाम है; वाक्य की प्रत्यक्ष चेतावनी और शर्तीय बल बनाए रखा गया है।
