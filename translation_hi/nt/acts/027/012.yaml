  text: And because the harbor was unsuitable for wintering[a], the majority decided to put out from there[c][b], if somehow they might reach Phoenix and spend the winter there—a harbor of Crete facing southwest and northwest.
translation:
  language: hi
  text: और क्योंकि वह बंदरगाह सर्दियाँ बिताने के लिए उपयुक्त नहीं था, इसलिए अधिकांश ने वहाँ से रवाना होने का निर्णय किया, इस आशा से कि वे किसी तरह फ़ीनिक्स पहुँचकर वहाँ सर्दियाँ बिता सकें—फ़ीनिक्स क्रेते का एक बंदरगाह था, जो दक्षिण-पश्चिम और उत्तर-पश्चिम[a] की ओर खुलता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम दिशासूचक वाक्यांश का अर्थ निश्चित नहीं है। परंपरागत अनुवाद है, “दक्षिण-पश्चिम और उत्तर-पश्चिम”; कुछ लोग दूसरे शब्द को अधिक विशेष रूप से “पश्चिम-उत्तर-पश्चिम” समझते हैं।
    reason: lexical_alternative
