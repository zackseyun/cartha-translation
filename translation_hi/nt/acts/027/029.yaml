id: ACT.27.29
reference: Acts 27:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: φοβούμενοί τε ⸂μή που κατὰ⸃ τραχεῖς τόπους ἐκπέσωμεν ἐκ πρύμνης ῥίψαντες ἀγκύρας τέσσαρας ηὔχοντο ἡμέραν γενέσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/029.yaml
  text: And fearing that we might run aground on rocky places[b][a], they dropped four anchors from the stern and prayed for day to come.
translation:
  language: hi
  text: और इस डर से कि कहीं हम चट्टानी जगहों पर जा न टकराएँ,[a] उन्होंने जहाज़ के पिछले भाग से चार लंगर डाल दिए और दिन निकलने की प्रार्थना करते रहे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कि कहीं हम ऊबड़-खाबड़ चट्टानों पर न जा पड़ें” अथवा “चट्टानों पर बहकर न चढ़ जाएँ।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “दिन हो जाने की प्रार्थना करते रहे”; इसका अर्थ “दिन का उजाला आने की प्रार्थना करते रहे” भी हो सकता है। यहाँ “प्रार्थना” के स्थान पर “कामना” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβούμενοί
  choice: इस डर से
  rationale: कृदन्त द्वारा व्यक्त परिस्थिति और आगे की कार्रवाई का कारण स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: μή που κατὰ τραχεῖς τόπους ἐκπέσωμεν
  choice: कि कहीं हम चट्टानी जगहों पर जा न टकराएँ
  rationale: समुद्री संदर्भ में जहाज़ के ऊबड़-खाबड़, चट्टानी तट या जलमग्न चट्टानों की ओर बहकर टकराने की आशंका व्यक्त करता है, बिना स्थान को अनावश्यक रूप से निश्चित किए।
- source_word: ἐκ πρύμνης
  choice: जहाज़ के पिछले भाग से
  rationale: πρύμνα का सटीक अर्थ जहाज़ का पिछला भाग है; यह सामान्य हिन्दी पाठक के लिए तकनीकी शब्द 'पिछाड़ी' से अधिक सहज है।
- source_word: ῥίψαντες ἀγκύρας τέσσαρας
  choice: चार लंगर डाल दिए
  rationale: लंगर पानी में छोड़ने की क्रिया के लिए स्वाभाविक आधुनिक हिन्दी है और मुख्य क्रिया से पहले हुई कार्रवाई को स्पष्ट रखता है।
- source_word: ηὔχοντο
  choice: प्रार्थना करते रहे
  rationale: εὔχομαι के प्रार्थना-संबंधी अर्थ तथा अपूर्ण काल की जारी क्रिया—दोनों को व्यक्त करता है।
- source_word: ἡμέραν γενέσθαι
  choice: दिन निकलने की
  rationale: शाब्दिक 'दिन हो जाने' को सहज हिन्दी में व्यक्त करता है और यहाँ अपेक्षित उजाला आने का आशय बनाए रखता है।
theological_decisions:
- issue: ηὔχοντο का अर्थ प्रार्थना करना या केवल कामना करना
  choice: प्रार्थना करते रहे
  alternative: दिन निकलने की कामना करते रहे
  rationale: क्रिया सामान्यतः प्रार्थना के अर्थ में प्रयुक्त हो सकती है; संदर्भ में व्याकरणिक रूप से 'कामना' भी संभव है, इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। समुद्री तकनीकी अर्थ को स्पष्ट करने के लिए 'जहाज़ के पिछले भाग' और 'लंगर डाल दिए' चुने गए हैं।
