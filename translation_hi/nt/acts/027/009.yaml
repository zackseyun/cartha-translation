  text: Ἱκανοῦ δὲ χρόνου διαγενομένου καὶ ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι, παρῄνει ὁ Παῦλος
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/009.yaml
  text: Since considerable time had passed and the voyage was already dangerous[a], because even the Fast had already gone by, Paul was advising them[b],
translation:
  language: hi
  text: बहुत समय बीत चुका था और समुद्री यात्रा पहले ही जोखिम भरी हो गई थी, क्योंकि उपवास भी बीत चुका था[a]। पौलुस उन्हें सलाह दे रहा था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उपवास’ संभवतः प्रायश्चित-दिवस के वार्षिक यहूदी उपवास को दर्शाता है। उसके बीत जाने से संकेत मिलता था कि वह ऋतु आ चुकी थी जब समुद्री यात्रा अधिक जोखिम भरी होती थी।
    reason: cultural_note
lexical_decisions:
- source_word: Ἱκανοῦ ... χρόνου διαγενομένου
  choice: बहुत समय बीत चुका था
  rationale: यह स्वाभाविक हिन्दी में पर्याप्त समय बीत जाने का भाव व्यक्त करता है और यूनानी संबंधकारक निरपेक्ष रचना का कालगत अर्थ बनाए रखता है।
- source_word: ὄντος ἤδη ἐπισφαλοῦς τοῦ πλοὸς
  choice: समुद्री यात्रा अब जोखिम भरी हो गई थी
  rationale: πλοῦς यहाँ जहाज़ नहीं, समुद्री यात्रा को सूचित करता है; ἐπισφαλής के लिए ‘जोखिम भरी’ खतरे की स्थिति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: διὰ τὸ καὶ τὴν νηστείαν ἤδη παρεληλυθέναι
  choice: क्योंकि उपवास का दिन भी बीत चुका था
  rationale: διά के कारणसूचक बल और पूर्ण infinitive के पहले ही बीत चुकने के भाव को सुरक्षित रखा गया है। ‘दिन’ सांस्कृतिक संकेत को हिन्दी में स्पष्ट करता है, जबकि विशिष्ट पहचान पाद-टिप्पणी में दी गई है।
- source_word: παρῄνει
  choice: सलाह देने लगा
  rationale: क्रिया सलाह देने या आग्रह करने का अर्थ रखती है। अगले पद में आने वाली पौलुस की बात के आरंभ को स्वाभाविक कथा-हिन्दी में प्रस्तुत किया गया है, बिना इसे अनावश्यक रूप से ‘चेतावनी’ बनाने के।
