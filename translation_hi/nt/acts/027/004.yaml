  yaml_path: translation/nt/acts/027/004.yaml
  text: And from there[a], after putting out to sea, we sailed under the lee of Cyprus, because the winds were against us.
translation:
  language: hi
  text: और वहाँ से समुद्र में निकलकर हम साइप्रस की आड़ में होकर जहाज़ चलाते गए, क्योंकि हवाएँ हमारे विरुद्ध थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: वहाँ से
  rationale: καί और ἐκεῖθεν के कथात्मक संबंध को सहज आधुनिक हिन्दी में व्यक्त करता है; वाक्य का आरंभ पिछले पद से प्रवाह बनाए रखता है।
- source_word: ἀναχθέντες
  choice: समुद्र में निकलकर
  rationale: नौवहन के संदर्भ में ἀνάγω के कृदन्त का अर्थ लंगर उठाने की विशिष्ट क्रिया से अधिक व्यापक रूप से समुद्र में निकलना या यात्रा आरंभ करना है।
- source_word: ὑπεπλεύσαμεν
  choice: ओट वाली ओर से होकर आगे बढ़े
  rationale: यह नौवहन-संबंधी क्रिया किसी द्वीप की हवा से सुरक्षित, आड़ वाली ओर से जहाज़ चलाने को सूचित करती है। यह चयन तकनीकी अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: τὴν Κύπρον
  choice: साइप्रस
  rationale: Κύπρος द्वीप का प्रचलित आधुनिक हिन्दी नाम।
- source_word: διὰ τὸ ... εἶναι
  choice: क्योंकि ... थीं
  rationale: διά के साथ सव्ययी क्रियार्थक संज्ञा यहाँ कारण बताती है; ‘क्योंकि’ स्वाभाविक हिन्दी समतुल्य है।
- source_word: τοὺς ἀνέμους
  choice: हवाएँ
  rationale: यूनानी बहुवचन का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἐναντίους
  choice: हमारे विरुद्ध थीं
  rationale: प्रतिरोधी दिशा का भाव स्पष्ट करता है। ‘हमारे’ यूनानी में अलग से व्यक्त नहीं है, पर यात्रा के संदर्भ में निहित है और हिन्दी में अर्थ को स्वाभाविक बनाता है।
