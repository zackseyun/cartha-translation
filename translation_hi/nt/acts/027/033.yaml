revisions:
- from: जब पौ फटने ही वाली थी, तब पौलुस उन सब से कुछ भोजन कर लेने का आग्रह करता रहा। उसने कहा, “आज चौदहवाँ दिन है कि तुम बाट जोहते हुए भूखे रहे हो और कुछ भी नहीं खाया है।”
  to: भोर होने ही वाली थी, तब तक पौलुस उन सबसे कुछ भोजन करने का आग्रह करता रहा और कहता था, “आज चौदहवाँ दिन है कि तुम प्रतीक्षा करते हुए भूखे रहे हो और कुछ भी नहीं खाया है।”
  rationale: The revision restores the limiting force of Ἄχρι δὲ οὗ (‘until’) while retaining the imminence expressed by ἤμελλεν. It also uses natural modern Hindi for προσδοκῶντες and keeps the two related statements about their not eating, as in the Greek.
