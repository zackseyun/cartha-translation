source:
  edition: SBLGNT
  text: Ἄχρι δὲ οὗ ⸂ἡμέρα ἤμελλεν⸃ γίνεσθαι παρεκάλει ὁ Παῦλος ἅπαντας μεταλαβεῖν τροφῆς λέγων· Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν προσδοκῶντες ἄσιτοι διατελεῖτε, μηθὲν προσλαβόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/033.yaml
  text: Until the day was about to dawn[a], Paul kept urging them all to take some food, saying, “Today is the fourteenth day that you have continued in suspense without eating, having taken nothing.”
translation:
  language: hi
  text: भोर होने ही वाली थी, तब तक पौलुस उन सबसे कुछ भोजन करने का आग्रह करता रहा और कहता था, “आज चौदहवाँ दिन है कि तुम प्रतीक्षा करते हुए भूखे रहे हो और कुछ भी नहीं खाया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄχρι δὲ οὗ ἡμέρα ἤμελλεν γίνεσθαι
  choice: जब पौ फटने ही वाली थी
  rationale: यूनानी वाक्यांश दिन होने की आसन्न अवस्था बताता है। आधुनिक हिन्दी में ‘पौ फटना’ भोर होने का स्वाभाविक और सटीक वर्णन है; ‘ही वाली थी’ μέλλω की आसन्नता व्यक्त करता है।
- source_word: παρεκάλει
  choice: आग्रह करता रहा
  rationale: अपूर्ण भूतकाल निरंतर या बार-बार किए गए आग्रह को दर्शाता है; ‘करता रहा’ इस कालगत पक्ष को बनाए रखता है।
- source_word: ἅπαντας μεταλαβεῖν τροφῆς
  choice: उन सब से कुछ भोजन कर लेने का
  rationale: ‘उन सब’ ἅπαντας की समावेशिता और ‘कुछ भोजन कर लेने’ भोजन ग्रहण करने तथा τροφῆς के अंशवाची भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Τεσσαρεσκαιδεκάτην σήμερον ἡμέραν
  choice: आज चौदहवाँ दिन है
  rationale: यह मूल पाठ में वर्तमान दिन पर दिए गए बल को स्पष्ट और सहज हिन्दी में बनाए रखता है।
- source_word: προσδοκῶντες
  choice: बाट जोहते हुए
  rationale: यह अपेक्षा या प्रतीक्षा के मूल अर्थ को सुरक्षित रखता है और प्रसंग की तनावपूर्ण स्थिति को बिना ‘चिंतित’ जैसा भाव स्पष्ट रूप से जोड़ने के संकेतित होने देता है।
- source_word: ἄσιτοι διατελεῖτε
  choice: भूखे रहे हो
  rationale: यह लगातार न खाने की अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है और धार्मिक उपवास का अनुचित संकेत नहीं देता।
- source_word: μηθὲν προσλαβόμενοι
  choice: कुछ भी नहीं खाया है
  rationale: यह व्याख्यात्मक कृदंत को स्पष्ट करता है कि उन्होंने भोजन ग्रहण नहीं किया था; हिन्दी में ‘कुछ भी नहीं लिया’ की अपेक्षा यह अधिक स्वाभाविक और प्रसंगानुकूल है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बाट जोहते हुए’ अपेक्षा और तनाव के बीच मूल पाठ की संभावित अर्थ-छाया को खुला रखता है।
