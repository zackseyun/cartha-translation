review_pass:
  verdict: revise
  source_fidelity: 'Draft renders the imminent dawn, Paul''s continuing appeal, the fourteen-day duration, waiting, and lack of food substantially well. However, its opening ‘जब ... तब’ means ‘when,’ whereas Ἄχρι δὲ οὗ marks the limit of Paul''s urging: ‘until.’'
  naturalness: The wording is generally clear, but ‘बाट जोहते हुए’ is somewhat literary for modern standard Hindi, and separating ‘उसने कहा’ into a new sentence weakens the direct connection between Paul’s ongoing urging and his words.
  terminology: ‘पौलुस,’ ‘भोजन,’ and ‘भूखे रहे हो’ are suitable. ‘प्रतीक्षा करते हुए’ is a natural modern rendering of προσδοκῶντες without adding an unwarranted emotional interpretation.
  issues:
  - severity: medium
    issue: Temporal connective does not convey ‘until.’
    rationale: ‘जब पौ फटने ही वाली थी, तब’ presents a point in time (‘when’), but the Greek says Paul continued urging them up to that point. ‘... तब तक’ preserves the temporal limit.
  - severity: low
    issue: Speech is unnecessarily detached from the ongoing urging.
    rationale: The Greek participle λέγων directly qualifies ‘kept urging.’ Joining it with ‘और कहता था’ better reflects the syntax and flow.
  revised_text: भोर होने ही वाली थी, तब तक पौलुस उन सबसे कुछ भोजन करने का आग्रह करता रहा और कहता था, “आज चौदहवाँ दिन है कि तुम प्रतीक्षा करते हुए भूखे रहे हो और कुछ भी नहीं खाया है।”
  revised_footnotes: []
  revision_rationale: The revision restores the limiting force of Ἄχρι δὲ οὗ (‘until’) while retaining the imminence expressed by ἤμελλεν. It also uses natural modern Hindi for προσδοκῶντες and keeps the two related statements about their not eating, as in the Greek.
