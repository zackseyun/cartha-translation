  yaml_path: translation/nt/acts/027/044.yaml
  text: and the rest[a], some on planks and some on pieces from the ship. And so it happened that all were brought safely to land.
translation:
  language: hi
  text: और बाकी लोगों में से कुछ तख्तों के सहारे और कुछ जहाज़ की वस्तुओं के सहारे किनारे पहुँचे। इस प्रकार सभी सकुशल भूमि पर पहुँच गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभी सुरक्षित भूमि पर पहुँचाए गए” अथवा “सभी सकुशल किनारे निकल आए।” यहाँ यूनानी क्रिया जहाज़ टूटने के संकट से शारीरिक रूप से बचने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς λοιποὺς
  choice: बाकी लोग
  rationale: यह उन शेष यात्रियों को सूचित करता है जिनका पिछले पद में उल्लेख नहीं हुआ था; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: οὓς μὲν ... οὓς δὲ
  choice: कुछ ... और कुछ
  rationale: यह सहसंबंधी रचना बाकी लोगों को दो समूहों में बाँटती है और यूनानी विरोध को सहज हिन्दी में व्यक्त करती है।
- source_word: ἐπὶ σανίσιν
  choice: तख्तों के सहारे
  rationale: σανίς जहाज़ के तख्ते या पटरे को दर्शाता है। प्रसंग में लोग उन पर टिककर किनारे पहुँचे, इसलिए ‘के सहारे’ स्वाभाविक हिन्दी है।
- source_word: ἐπί τινων τῶν ἀπὸ τοῦ πλοίου
  choice: जहाज़ की दूसरी चीज़ों के सहारे
  rationale: यूनानी पाठ वस्तुओं को अनिश्चित रखता है; यह अनुवाद उन्हें अनावश्यक रूप से ‘टुकड़े’ या ‘मलबा’ नहीं ठहराता और जहाज़ से उनका संबंध स्पष्ट करता है।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह अभी बताए गए ढंग का सार प्रस्तुत करता है।
- source_word: ἐγένετο
  choice: ऐसा हुआ
  rationale: यह कथानक में परिणाम सामने आने का सामान्य मुहावरा है।
- source_word: πάντας διασωθῆναι
  choice: सभी सुरक्षित ... पहुँच गए
  rationale: διασῴζω यहाँ जहाज़ टूटने के संकट से सकुशल बच निकलने को दर्शाता है। यह चयन भौतिक सुरक्षा को स्पष्ट रखता है और निष्क्रिय यूनानी रचना को सहज हिन्दी परिणाम-वाक्य में व्यक्त करता है।
- source_word: ἐπὶ τὴν γῆν
  choice: किनारे
  rationale: समुद्री प्रसंग में γῆ पानी के विपरीत स्थल या तट को सूचित करता है; ‘किनारे’ सामान्य हिन्दी में सबसे स्वाभाविक है।
theological_decisions:
- issue: διασωθῆναι में उद्धार-संबंधी संभावित अर्थच्छाया
  choice: सुरक्षित किनारे पहुँच गए
  alternative: सबका बचाव हुआ और वे किनारे पहुँचे / सभी सकुशल किनारे निकल आए
  rationale: तात्कालिक प्रसंग जहाज़ टूटने से शारीरिक रूप से बचने का है, आध्यात्मिक उद्धार का नहीं। चुनी हुई अभिव्यक्ति प्रसंगगत अर्थ स्पष्ट करती है और कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद की आरंभिक अधूरी रचना पिछले पद से जुड़ती है; डैश उस संबंध को पढ़ने में स्पष्ट बनाता है। ‘के सहारे’ दोहराने से जहाज़ के तख्तों और अन्य वस्तुओं पर टिककर बचने का आशय स्वाभाविक हिन्दी में आता है।
