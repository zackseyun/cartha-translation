source:
  edition: SBLGNT
  text: Πολλῆς ⸀τε ἀσιτίας ὑπαρχούσης τότε σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν εἶπεν· Ἔδει μέν, ὦ ἄνδρες, πειθαρχήσαντάς μοι μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης κερδῆσαί τε τὴν ὕβριν ταύτην καὶ τὴν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/021.yaml
  text: Since they had gone a long time without food, then Paul stood up among them and said, “Men, you should have listened to me and not set sail from Crete, and so have avoided this damage and loss.”
translation:
  language: hi
  text: बहुत समय से भोजन न करने के बाद[a], पौलुस उनके बीच खड़ा होकर बोला, “सज्जनो, तुम्हें मेरी बात माननी[b] और क्रेते से समुद्र में नहीं निकलना चाहिए था; तब तुम इस क्षति और हानि से बच जाते[c][d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत समय से उपवास चल रहा था।” यूनानी शब्द ἀσιτία भोजन के अभाव और भोजन से विरत रहने—दोनों को सूचित कर सकता है; इस तूफ़ानी परिस्थिति में लंबे समय तक न खाना अधिक संभावित है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरी आज्ञा माननी।” यहाँ प्रयुक्त क्रिया किसी निर्देश या अधिकार का पालन करने का अर्थ भी दे सकती है; इस प्रसंग में पौलुस की सलाह पर ध्यान देने की बात है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी क्रिया का मूल अर्थ “लाभ पाना” है। यहाँ इसका आशय यह है कि पौलुस की सलाह मानकर वे इस क्षति और हानि से बच सकते थे।
    reason: translation_note
  - marker: d
    text: “क्षति और हानि” की इस जोड़ी में संभवतः झेले गए आघात या नुकसान और भौतिक हानि के बीच अंतर है।
    reason: cultural_note
lexical_decisions:
- source_word: Πολλῆς τε ἀσιτίας ὑπαρχούσης
  choice: बहुत समय से किसी ने भोजन नहीं किया था
  rationale: यह संबंधवाचक निरपेक्ष रचना पौलुस के बोलने की परिस्थिति बताती है। ἀσιτία भोजन का अभाव या भोजन से विरत रहना, दोनों अर्थ दे सकता है; तूफ़ान के संदर्भ में लंबे समय से न खाना अधिक स्वाभाविक है।
- source_word: σταθεὶς ὁ Παῦλος ἐν μέσῳ αὐτῶν
  choice: पौलुस उनके बीच खड़ा हुआ
  rationale: यह पौलुस के समूह के बीच खड़े होकर सार्वजनिक रूप से बोलने की स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: Ἔδει μέν, ὦ ἄνδρες
  choice: सज्जनो, तुम्हें ... चाहिए था
  rationale: ἔδει बीते समय में वह काम बताता है जो किया जाना उचित था। ‘सज्जनो’ पुरुषों के प्रत्यक्ष संबोधन को आधुनिक और सम्मानपूर्ण हिन्दी में व्यक्त करता है।
- source_word: πειθαρχήσαντάς μοι
  choice: मेरी बात माननी
  rationale: πειθαρχέω में किसी निर्देश को मानने या आज्ञापालन करने का भाव हो सकता है। यहाँ पौलुस की पहले दी गई सलाह मानने की बात है।
- source_word: μὴ ἀνάγεσθαι ἀπὸ τῆς Κρήτης
  choice: क्रेते से जहाज़ नहीं खोलना
  rationale: नौचालन के संदर्भ में ἀνάγω का अर्थ समुद्र की ओर निकलना या जहाज़ खोलना है।
- source_word: κερδῆσαί τε
  choice: ऐसा करने पर ... बच जाते
  rationale: κερδαίνω का मूल भाव ‘लाभ पाना’ है, पर इस प्रसंग में अर्थ यह है कि सलाह मानने से वे आने वाली क्षति और हानि अपने ऊपर लेने से बच जाते।
- source_word: τὴν ὕβριν ταύτην καὶ τὴν ζημίαν
  choice: इस क्षति और हानि
  rationale: इस समुद्री प्रसंग में ὕβρις अपमान के सामान्य अर्थ के बजाय झेली गई क्षति या कठोर आघात को सूचित करता है, जबकि ζημία हानि को; हिन्दी में दोनों पदों को अलग रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जहाज़ खोलना’ समुद्री प्रस्थान के लिए प्रचलित हिन्दी मुहावरा है। मूल यूनानी की संभावित अस्पष्टताओं को पाठ और पादटिप्पणियों में सुरक्षित रखा गया है।
