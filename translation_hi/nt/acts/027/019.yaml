lexical_decisions:
- source_word: τῇ τρίτῃ
  choice: तीसरे दिन
  rationale: क्रमवाचक संख्या के साथ प्रयुक्त दत्तिव यहाँ समय बताता है; हिन्दी में ‘तीसरे दिन’ स्वाभाविक और स्पष्ट है।
- source_word: αὐτόχειρες
  choice: अपने ही हाथों से
  rationale: यह शब्द लोगों द्वारा स्वयं प्रत्यक्ष रूप से काम करने पर बल देता है; ‘ही’ मूल के विशेष जोर को बनाए रखता है।
- source_word: τὴν σκευὴν τοῦ πλοίου
  choice: जहाज़ का सामान
  rationale: नौकायन के संदर्भ में σκευή जहाज़ के उपकरण या साज-सामान को दर्शाता है। ‘जहाज़ का सामान’ साधारण आधुनिक हिन्दी में व्यापक और सहज है, बिना किसी अनावश्यक तकनीकी विशिष्टता के।
- source_word: ἔρριψαν
  choice: समुद्र में फेंक दिया
  rationale: क्रिया का अर्थ ‘फेंकना’ है। प्रसंग में जहाज़ से भार हल्का करने के लिए वस्तुएँ बाहर समुद्र में फेंकी जा रही हैं; हिन्दी में दिशा को स्पष्ट करना स्वाभाविक है।
