source:
  edition: SBLGNT
  text: διὸ παρακαλῶ ὑμᾶς ⸀μεταλαβεῖν τροφῆς, τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει· οὐδενὸς γὰρ ὑμῶν θρὶξ ⸀ἀπὸ τῆς κεφαλῆς ⸀ἀπολεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/034.yaml
  text: Therefore I urge you to take some food[a], for this is for your preservation; for not a hair from the head of any of you will perish.
translation:
  language: hi
  text: इसलिए मैं आपसे आग्रह करता हूँ कि कुछ भोजन कर लें, क्योंकि यह आपके बचाव के लिए है[a]; आप में से किसी के सिर का एक बाल भी नष्ट नहीं होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपके उद्धार के लिए।” यहाँ यूनानी शब्द का अर्थ “उद्धार,” “बचाव” या “सुरक्षा” हो सकता है; इस प्रसंग में इसका संकेत शारीरिक रूप से जीवित बचने की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निकलने वाले निष्कर्ष और आग्रह का स्वाभाविक तार्किक संबंध व्यक्त करता है।
- source_word: παρακαλῶ ὑμᾶς
  choice: मैं आपसे आग्रह करता हूँ
  rationale: यह पौलुस की गंभीर किंतु प्रोत्साहनपूर्ण अपील को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: μεταλαβεῖν τροφῆς
  choice: कुछ भोजन कर लें
  rationale: यूनानी पदबंध का अर्थ पोषण के लिए भोजन ग्रहण करना है; यह हिन्दी में सहज है और प्रसंगानुकूल आदरपूर्ण बहुवचन बनाए रखता है।
- source_word: τοῦτο γὰρ πρὸς τῆς ὑμετέρας σωτηρίας ὑπάρχει
  choice: क्योंकि यह आपके बचाव के लिए है
  rationale: समुद्री संकट के प्रसंग में σωτηρία शारीरिक रक्षा, बचाव या जीवित रहने को सूचित करता है। 'बचाव' मूल शब्द की उद्धार-संबंधी व्यापकता की कुछ प्रतिध्वनि रखते हुए प्रसंग में स्वाभाविक है।
- source_word: οὐδενὸς γὰρ ὑμῶν θρὶξ ἀπὸ τῆς κεφαλῆς
  choice: आप में से किसी के सिर का एक बाल भी
  rationale: यह पूर्ण शारीरिक सुरक्षा व्यक्त करने वाली उक्त‍ि को स्वाभाविक हिन्दी में रखता है और οὐδενὸς की वितरणात्मक शक्ति बनाए रखता है।
- source_word: ἀπολεῖται
  choice: नष्ट नहीं होगा
  rationale: भविष्यकालीन क्रिया के 'खो जाना/नाश होना' अर्थ को बनाए रखता है तथा आश्वासन की दृढ़ता प्रकट करता है।
theological_decisions:
- issue: इस प्रसंग में σωτηρία का अर्थ
  choice: शारीरिक बचाव/जीवित रहना
  alternative: उद्धार
  rationale: तात्कालिक प्रसंग तूफ़ान और जहाज़ के संकट से यात्रियों के जीवित बचने का है। मुख्य पाठ में 'उद्धार' अकेले रखने से आत्मिक उद्धार का ऐसा संकेत मिल सकता है जो यहाँ कथानक का मुख्य आशय नहीं है; फिर भी शब्द की वास्तविक अर्थ-व्याप्ति पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए सहज, किंतु गरिमापूर्ण। 'कर लें' सामूहिक संबोधन में स्वाभाविक आग्रह व्यक्त करता है। पादटिप्पणी का चिह्न मुख्य पाठ में सम्मिलित है।
