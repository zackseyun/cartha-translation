  text: ἐν ἱκαναῖς δὲ ἡμέραις βραδυπλοοῦντες καὶ μόλις γενόμενοι κατὰ τὴν Κνίδον, μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου, ὑπεπλεύσαμεν τὴν Κρήτην κατὰ Σαλμώνην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/007.yaml
  text: For many days we were sailing slowly[a], and with difficulty we came opposite Cnidus. Since the wind did not allow us to go farther, we sailed under the lee of Crete[b], off Salmone.
translation:
  language: hi
  text: कई दिनों तक हम धीरे-धीरे जहाज़ चलाते रहे और बड़ी कठिनाई से कनिदुस के सामने पहुँचे। हवा ने हमें आगे बढ़ने नहीं दिया[a], इसलिए हम क्रेते की आड़ में होकर सलमोने के पास से निकले[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हवा ने हमें वहाँ पहुँचने नहीं दिया।” यूनानी वाक्यांश आगे बढ़ने अथवा किसी स्थान के निकट पहुँचने—दोनों में से किसी भाव को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “हम क्रेते के नीचे होकर चले”—अर्थात द्वीप के उस ओर, जहाँ उसकी आड़ के कारण हवा कम लगती थी।
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἱκαναῖς δὲ ἡμέραις
  choice: कई दिनों तक
  rationale: ἐν के साथ कालवाचक दत्तिव यहाँ लंबे समय की अवधि व्यक्त करता है; यह हिंदी में स्वाभाविक और अर्थ-सटीक है।
- source_word: βραδυπλοοῦντες
  choice: हम धीरे-धीरे जहाज़ चलाते रहे
  rationale: यह कृदंत जहाज़ की धीमी गति या धीमी प्रगति बताता है; इससे अगले μόλις की कठिनाई का अलग अर्थ भी बना रहता है।
- source_word: μόλις γενόμενοι κατὰ τὴν Κνίδον
  choice: बड़ी कठिनाई से कनिदुस के सामने पहुँचे
  rationale: μόλις कठिनाई से पहुँचने का भाव देता है और κατά यहाँ समुद्री भौगोलिक स्थिति में किसी स्थान के सामने या निकट होने का संकेत करता है।
- source_word: μὴ προσεῶντος ἡμᾶς τοῦ ἀνέμου
  choice: हवा ने हमें आगे बढ़ने नहीं दिया
  rationale: यह संबंधकारक निरपेक्ष रचना मार्ग बदलने का कारण बताती है; προσεάω में आगे जाने या निकट पहुँचने की अनुमति न मिलने का भाव है।
- source_word: ὑπεπλεύσαμεν τὴν Κρήτην
  choice: क्रेते की आड़ में जहाज़ चलाने लगे
  rationale: समुद्री प्रयोग में ὑποπλέω द्वीप के हवा से सुरक्षित, ओट वाले भाग में जहाज़ चलाने को दर्शाता है।
- source_word: κατὰ Σαλμώνην
  choice: सलमोने के पास से होते हुए
  rationale: तटीय स्थलचिह्न के साथ κατά यहाँ उस स्थान के निकट या सामने से मार्ग लेने का संकेत देता है; हिंदी में यह मार्ग-वर्णन स्वाभाविक है।
- source_word: Κνίδον / Κρήτην / Σαλμώνην
  choice: कनिदुस / क्रेते / सलमोने
  rationale: यूनानी स्थान-नामों का देवनागरी में स्रोत-सन्निकट लिप्यंतरण किया गया है।
