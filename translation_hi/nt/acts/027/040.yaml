  text: καὶ τὰς ἀγκύρας περιελόντες εἴων εἰς τὴν θάλασσαν, ἅμα ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων, καὶ ἐπάραντες τὸν ἀρτέμωνα τῇ πνεούσῃ κατεῖχον εἰς τὸν αἰγιαλόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/040.yaml
  text: And after casting off the anchors[a], they left them in the sea; at the same time loosening the ropes of the rudders, and hoisting the foresail to the wind[b], they made for the beach.
translation:
  language: hi
  text: लंगरों को छोड़कर उन्होंने उन्हें समुद्र में ही रहने दिया। साथ ही उन्होंने पतवारों के बंधन खोल दिए और हवा की ओर अगला पाल[a] उठाकर तट की ओर जहाज़ ले चले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ऊपरी पाल’ अथवा ‘जहाज़ के अगले भाग का पाल’; इस यूनानी समुद्री शब्द से ठीक किस पाल का संकेत है, यह निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περιελόντες τὰς ἀγκύρας
  choice: लंगरों को खोलकर
  rationale: क्रिया पहले की गई कार्रवाई दर्शाती है। यहाँ लंगरों को जहाज़ से अलग कर समुद्र में छोड़ देने का भाव है; ‘खोलकर’ सहज हिंदी में रस्से या बंधन से मुक्त करने की क्रिया व्यक्त करता है।
- source_word: εἴων εἰς τὴν θάλασσαν
  choice: समुद्र में ही छोड़ दिया
  rationale: ἐάω यहाँ लंगरों को जाने देने अथवा वहीं त्याग देने के अर्थ में है। ‘ही’ से यह स्पष्ट होता है कि उन्हें वापस जहाज़ पर नहीं लिया गया।
- source_word: ἅμα ἀνέντες τὰς ζευκτηρίας τῶν πηδαλίων
  choice: उसी समय उन्होंने पतवारों को बाँधने वाली रस्सियाँ खोल दीं
  rationale: ἅμα समकालिकता दर्शाता है। दुर्लभ ζευκτηρίας पतवारों/नियंत्रक चप्पुओं को सुरक्षित रखने वाले बंधनों को सूचित करता है; ‘बाँधने वाली रस्सियाँ’ तकनीकी बात को सामान्य पाठक के लिए स्पष्ट करती है।
- source_word: τῶν πηδαλίων
  choice: पतवारों
  rationale: बहुवचन प्राचीन जहाज़ की दो नियंत्रक पतवारों अथवा steering oars के अनुकूल है। हिंदी में ‘पतवार’ सबसे स्वाभाविक और बोधगम्य समुद्री शब्द है।
- source_word: ἐπάραντες τὸν ἀρτέμωνα
  choice: अगला पाल चढ़ाकर
  rationale: ἐπαίρω पाल को ऊपर उठाने/चढ़ाने की क्रिया है। ἀρτέμων का ठीक तकनीकी आशय अनिश्चित है, पर जहाज़ के आगे का पाल एक प्रचलित और संभावित अर्थ है; अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: τῇ πνεούσῃ
  choice: हवा के सामने
  rationale: स्त्रीलिंग कृदंत के साथ निहित ‘हवा’ का अर्थ है। यह पाल को चलती हवा के लिए चढ़ाने की कार्रवाई को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: κατεῖχον εἰς τὸν αἰγιαλόν
  choice: तट की ओर बढ़ने लगे
  rationale: κατέχω का यहाँ समुद्री अर्थ किसी दिशा में जहाज़ ले जाना/मार्ग बनाए रखना है और αἰγιαλός रेतीले तट अथवा समुद्र-किनारे को दर्शाता है। चुना हुआ रूप उद्देश्यपूर्ण गति को सहज हिंदी में व्यक्त करता है।
