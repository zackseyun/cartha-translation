source:
  edition: SBLGNT
  text: περιπεσόντες δὲ εἰς τόπον διθάλασσον ⸀ἐπέκειλαν τὴν ναῦν, καὶ ἡ μὲν πρῷρα ἐρείσασα ἔμεινεν ἀσάλευτος, ἡ δὲ πρύμνα ἐλύετο ὑπὸ τῆς ⸀βίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/041.yaml
  text: But falling into a place where two seas met[a], they ran the ship aground; and the bow, having stuck fast, remained immovable, but the stern was being broken up by the force.
translation:
  language: hi
  text: परन्तु वे ऐसी जगह जा पड़े जहाँ दो समुद्र मिलते थे[a], और उन्होंने जहाज़ को वहाँ उथले में चढ़ा दिया। जहाज़ का अगला भाग धँसकर अचल पड़ा रहा, पर पिछला भाग बल के कारण टूटता जा रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दो समुद्रों के बीच की जगह।” यूनानी अभिव्यक्ति दुर्लभ है और इसका संकेत किसी जलमार्ग, रेतीले उथले भाग, अथवा दो जलराशियों या धाराओं के मिलने के स्थान की ओर हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπεσόντες
  choice: जा पड़े
  rationale: यह अचानक और प्रतिकूल रूप से उस स्थान में पहुँच जाने का भाव देता है, बिना किसी विशिष्ट नौचालन क्रिया को अनावश्यक रूप से मान लेने के।
- source_word: τόπον διθάλασσον
  choice: ऐसी जगह जहाँ दो समुद्री धाराएँ मिलती थीं
  rationale: दुर्लभ यूनानी पद का ‘दो जलराशियों/धाराओं’ से संबंधित अर्थ सहज हिन्दी में व्यक्त होता है; ‘रेतीला टीला’ जैसी अधिक विशिष्ट भौगोलिक व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
- source_word: ἐπέκειλαν τὴν ναῦν
  choice: जहाज़ को वहाँ उथले में चढ़ा दिया
  rationale: नौचालन-संदर्भ में क्रिया का अर्थ जहाज़ को उथले में फँसा या चढ़ा देना है; यह सामान्य हिन्दी पाठक के लिए स्पष्ट है।
- source_word: πρῷρα
  choice: जहाज़ का अगला भाग
  rationale: तकनीकी शब्द ‘अग्रभाग’ की अपेक्षा यह अधिक सहज और समान रूप से सटीक है।
- source_word: ἐρείσασα
  choice: धँसकर
  rationale: यह अगले भाग के मजबूती से टिक या फँस जाने की परिणति को संक्षेप में व्यक्त करता है।
- source_word: ἔμεινεν ἀσάλευτος
  choice: अचल हो गया
  rationale: यह उसके स्थिर और न हिल सकने की दशा को स्वाभाविक हिन्दी में बताता है।
- source_word: πρύμνα
  choice: पिछला भाग
  rationale: जहाज़ के पीछे के हिस्से का स्पष्ट, सर्वसुलभ हिन्दी रूप।
- source_word: ἐλύετο
  choice: टूटता जा रहा था
  rationale: अपूर्ण भूतकालीन निष्क्रिय क्रिया जहाज़ के पिछले भाग के लगातार विघटित होने की प्रक्रिया दर्शाती है।
- source_word: ὑπὸ τῆς βίας
  choice: पानी के प्रचण्ड वेग से
  rationale: βία का मूल भाव बल या प्रचण्डता है। समुद्री प्रसंग में पानी निहित माध्यम है; ‘लहरों’ को स्पष्टतः जोड़ने के बजाय ‘पानी के ... वेग’ से संदर्भ सहज किया गया है।
