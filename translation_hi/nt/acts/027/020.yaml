id: ACT.27.20
reference: Acts 27:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων ἐπὶ πλείονας ἡμέρας, χειμῶνός τε οὐκ ὀλίγου ἐπικειμένου, λοιπὸν περιῃρεῖτο ⸂ἐλπὶς πᾶσα⸃ τοῦ σῴζεσθαι ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/020.yaml
  text: And when neither sun nor stars appeared for many days[a], and no small storm was pressing on us, from then on all hope of our being saved was gradually taken away.
translation:
  language: hi
  text: कई दिनों तक न तो सूरज दिखाई दिया, न तारे, और प्रचंड तूफ़ान हम पर छाया रहा। तब से हमारे बचने की सारी आशा धीरे-धीरे खत्म होती गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε δὲ ἡλίου μήτε ἄστρων ἐπιφαινόντων
  choice: न तो सूरज दिखाई दिया, न तारे
  rationale: ἐπιφαίνω यहाँ आकाशीय पिंडों के दिखाई देने या प्रकाश देने का भाव रखता है। ‘दिखाई दिया’ बादलों से ढके आकाश और समुद्री दिशा-निर्धारण के संदर्भ में स्वाभाविक है।
- source_word: ἐπὶ πλείονας ἡμέρας
  choice: कई दिनों तक
  rationale: यह पदबंध लंबी अवधि को व्यक्त करता है; ‘कई दिनों तक’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: χειμῶνός τε οὐκ ὀλίγου
  choice: प्रचंड तूफ़ान
  rationale: समुद्री संदर्भ में χειμών तूफ़ानी मौसम को दर्शाता है। यूनानी का शाब्दिक अल्पोक्ति-प्रयोग ‘छोटा-मोटा नहीं’ हिन्दी में असहज होता; ‘प्रचंड’ उसका बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπικειμένου
  choice: हम पर छाया रहा
  rationale: क्रिया निरंतर दबाव डालने या ऊपर मंडराने का भाव देती है। ‘हम पर छाया रहा’ तूफ़ान की लगातार बनी हुई विकट स्थिति को सहज हिन्दी में व्यक्त करता है।
- source_word: λοιπὸν
  choice: तब
  rationale: यहाँ यह परिस्थिति के अगले परिणामी चरण को चिह्नित करता है; ‘तब’ उस संक्रमण को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: περιῃρεῖτο
  choice: धीरे-धीरे जाती रही
  rationale: अपूर्ण भूतकाल कर्मवाच्य आशा के एकाएक नहीं, बल्कि लगातार मिटते जाने की प्रक्रिया दिखाता है।
- source_word: ἐλπὶς πᾶσα
  choice: सारी आशा
  rationale: यह समस्त आशा के समाप्त होने का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: τοῦ σῴζεσθαι ἡμᾶς
  choice: हमारे बचने की
  rationale: इस समुद्री संकट में σῴζεσθαι का अर्थ मृत्यु से शारीरिक रूप से बचना है। ‘बचने’ से यह अर्थ स्पष्ट रहता है और अनावश्यक आध्यात्मिक अर्थ नहीं जुड़ता।
theological_decisions:
- issue: समुद्री कथा में σῴζεσθαι का अर्थ
  choice: हमारे बचने की
  alternative: हमारे उद्धार पाने की
  rationale: प्रसंग जहाज़, तूफ़ान और समुद्र में मृत्यु से जीवित बच निकलने का है। इसलिए ‘बचना’ भौतिक रक्षा को स्पष्ट करता है, जबकि ‘उद्धार’ हिन्दी पाठक को अनावश्यक रूप से आध्यात्मिक अर्थ की ओर ले जा सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। यूनानी अल्पोक्ति को हिन्दी में स्वाभाविक तीव्रता-सूचक ‘प्रचंड’ से व्यक्त किया गया है। किसी पादटिप्पणी की आवश्यकता नहीं है, क्योंकि ‘बचने’ से प्रसंगगत अर्थ सीधे स्पष्ट हो जाता है।
