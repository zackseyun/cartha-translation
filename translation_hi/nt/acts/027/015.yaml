  text: And when the ship was caught and could not face the wind[a], we gave way and were driven along.
translation:
  language: hi
  text: जब जहाज़ हवा की चपेट में आ गया और हवा के सामने टिक न सका, तब हमने उसे हवा के हवाले कर दिया और बहते चले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναρπασθέντος
  choice: आँधी की चपेट में आ गया
  rationale: यह निष्क्रिय कृदंत जहाज़ के किसी बाहरी प्रबल शक्ति द्वारा अचानक पकड़ लिए जाने का भाव देता है। संदर्भ में वह शक्ति तूफ़ानी हवा है; ‘चपेट में आ गया’ स्वाभाविक हिंदी में आकस्मिक और अनियंत्रित स्थिति व्यक्त करता है।
- source_word: πλοίου
  choice: जहाज़
  rationale: समुद्री यात्रा के इस प्रसंग में आधुनिक हिंदी का सहज और स्पष्ट शब्द।
- source_word: μὴ δυναμένου
  choice: न कर सका
  rationale: यह रचना असमर्थता व्यक्त करती है; हिंदी में सीमित क्रिया द्वारा इसे स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ἀντοφθαλμεῖν
  choice: सामना
  rationale: जहाज़ के हवा की ओर टिककर आगे न बढ़ सकने का समुद्री भाव बनाए रखता है, बिना अनावश्यक तकनीकी विवरण जोड़े।
- source_word: ἀνέμῳ
  choice: हवा
  rationale: मूल शब्द का सामान्य अर्थ ‘हवा’ है; तूफ़ानी तीव्रता व्यापक प्रसंग और ‘आँधी की चपेट’ से स्पष्ट होती है।
- source_word: ἐπιδόντες
  choice: उसे हवा के भरोसे छोड़ दिया
  rationale: यहाँ चालक दल द्वारा हवा का प्रतिरोध छोड़कर जहाज़ को उसके प्रभाव में जाने देने का भाव है। सर्वनाम ‘उसे’ जहाज़ को सूचित करता है और हिंदी में नौवहन-संबंधी अर्थ स्पष्ट करता है।
- source_word: ἐφερόμεθα
  choice: बहते चले गए
  rationale: अपूर्ण निष्क्रिय क्रिया बाहरी शक्ति के अधीन जारी गति बताती है। ‘बहते चले गए’ हिंदी में निरंतर और अनियंत्रित समुद्री गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δέ
  choice: लेकिन
  rationale: यह पिछले प्रयास और अब जहाज़ के वश से बाहर हो जाने के बीच कथात्मक विरोध को सहज हिंदी में दर्शाता है।
