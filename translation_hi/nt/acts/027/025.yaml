  text: διὸ εὐθυμεῖτε, ἄνδρες· πιστεύω γὰρ τῷ θεῷ ὅτι οὕτως ἔσται καθ’ ὃν τρόπον λελάληταί μοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/025.yaml
  text: Therefore[a], take courage, men, for I believe God that it will be just as it has been told to me.
translation:
  language: hi
  text: इसलिए, सज्जनो, हिम्मत रखो, क्योंकि मैं परमेश्वर पर भरोसा करता हूँ[a] कि ठीक वैसा ही होगा जैसा मुझसे कहा गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं परमेश्वर की बात पर विश्वास करता हूँ।” यूनानी रचना परमेश्वर पर भरोसा करने या उनकी कही बात पर विश्वास करने, दोनों का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले आश्वासन से निकलने वाले निष्कर्ष और प्रोत्साहन को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: εὐθυμεῖτε
  choice: हिम्मत रखो
  rationale: संकट के बीच साहस और आत्मविश्वास बनाए रखने की आज्ञा को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἄνδρες
  choice: पुरुषो
  rationale: मूल में ἀνήρ का संबोधन बहुवचन है और जहाज़ पर उपस्थित पुरुषों को सीधे संबोधित करता है; इसलिए इसे लिंग-विशिष्ट रखा गया है।
- source_word: πιστεύω τῷ θεῷ
  choice: मैं परमेश्वर की बात पर विश्वास करता हूँ
  rationale: πιστεύω के साथ संप्रदान कारक परमेश्वर पर भरोसा करने और उनके कथन को सच मानने—दोनों का संकेत दे सकता है। हिंदी में यह वाक्यांश प्रसंगानुसार परमेश्वर के वचन को विश्वसनीय मानने का भाव स्पष्ट करता है।
- source_word: ὅτι
  choice: कि
  rationale: यह पौलुस के विश्वास की विषय-वस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: οὕτως ἔσται καθ’ ὃν τρόπον
  choice: जैसा ... वैसा ही होगा
  rationale: यह जो कहा गया था और जो घटित होगा, उनके ठीक अनुरूप होने को स्वाभाविक हिंदी तुलनात्मक रचना में व्यक्त करता है।
- source_word: λελάληταί μοι
  choice: मुझसे कहा गया है
  rationale: पूर्णकालिक कर्मवाच्य पूर्व में दिए गए संदेश की वर्तमान प्रासंगिकता बनाए रखता है; हिंदी में 'मुझसे कहा गया है' स्वाभाविक और अर्थ-संगत है।
theological_decisions:
- issue: πιστεύω τῷ θεῷ का अनुवाद
  choice: मैं परमेश्वर की बात पर विश्वास करता हूँ
  alternative: मैं परमेश्वर पर भरोसा करता हूँ
  rationale: यूनानी संप्रदान रचना परमेश्वर को विश्वसनीय मानने, अर्थात उनकी कही बात को सच स्वीकार करने पर बल दे सकती है। मुख्य पाठ में इस प्रसंगगत अर्थ को स्पष्ट किया गया है, जबकि पादटिप्पणी भरोसे के व्यापक संभावित भाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और मौखिक संबोधन के अनुकूल है। 'पुरुषो' मूल के लिंग-विशिष्ट संबोधन को बनाए रखता है।
