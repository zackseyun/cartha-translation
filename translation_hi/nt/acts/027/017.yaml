  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दुर्लभ तकनीकी पद के बदले क्रिया का चित्र स्पष्ट किया गया है, जबकि σκεῦος की वास्तविक अनिश्चितता मुख्य पाठ और पादटिप्पणी में सुरक्षित रखी गई है।
