  text: ἣν ἄραντες βοηθείαις ἐχρῶντο ὑποζωννύντες τὸ πλοῖον· φοβούμενοί τε μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν, χαλάσαντες τὸ σκεῦος, οὕτως ἐφέροντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/017.yaml
  text: After hoisting it up[a], they used supporting cables to undergird the ship; and fearing that they might run aground on the Syrtis[c][b], they lowered the sea anchor and so were driven along.
translation:
  language: hi
  text: उसे ऊपर खींच लेने के बाद उन्होंने जहाज़ के चारों ओर सहायक रस्से कसकर उसे मज़बूत किया। फिर इस डर से कि कहीं वे सिर्तिस[a] में जा पड़ें, उन्होंने जहाज़ का उपकरण नीचे कर दिया[b] और इस प्रकार बहाए जाते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सिर्तिस उत्तरी अफ्रीका के तट के पास रेतीले उथले स्थानों और बालू-तटों का एक कुख्यात क्षेत्र था।
    reason: cultural_note
  - marker: b
    text: यूनानी में शाब्दिक अर्थ “उपकरण” या “साज-सामान” है। संभव है कि इससे पाल-साज, कोई लंगर, अथवा जहाज़ की गति घटाने वाला अन्य उपकरण अभिप्रेत हो; ठीक वस्तु निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ἄραντες
  choice: उसे ऊपर खींच लेने के बाद
  rationale: ἣν पिछले पद की छोटी नाव को सूचित करता है; अओरिस्ट कृदंत मुख्य क्रिया से पहले पूरी हुई कार्रवाई बताता है।
- source_word: βοηθείαις ἐχρῶντο ὑποζωννύντες τὸ πλοῖον
  choice: जहाज़ को नीचे से कसकर मज़बूत करने के लिए सहायक रस्सों का इस्तेमाल किया
  rationale: नौसैनिक संदर्भ में βοηθείαις जहाज़ के ढाँचे को थामने वाले साधनों और ὑποζωννύντες जहाज़ के नीचे/चारों ओर रस्से कसने की क्रिया को दर्शाता है; यह अनुवाद तकनीकी अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: μὴ εἰς τὴν Σύρτιν ἐκπέσωσιν
  choice: कहीं वे सिर्तिस की रेतीली उथली जगहों में जा फँसें
  rationale: ἐκπίπτω यहाँ हवा से खतरनाक तटवर्ती उथले क्षेत्र में जा पड़ने को बताता है; 'जा फँसें' परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Σύρτιν
  choice: सिर्तिस
  rationale: भौगोलिक नाम का देवनागरी लिप्यंतरण रखा गया है और उसके खतरनाक उथले स्वरूप को पाठ तथा पादटिप्पणी में स्पष्ट किया गया है।
- source_word: χαλάσαντες τὸ σκεῦος
  choice: उन्होंने जहाज़ का सामान नीचे कर दिया
  rationale: σκεῦος सामान्यतः सामान, उपकरण या साज-सामान है। यहाँ ठीक कौन-सा नौसैनिक उपकरण अभिप्रेत है, यह अनिश्चित है; इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया है।
- source_word: οὕτως ἐφέροντο
  choice: इस प्रकार हवा में बहते चले गए
  rationale: अपूर्णकालीन कर्मवाच्य बाहरी शक्ति द्वारा लगातार बहाए जाने को दर्शाता है; संदर्भ में वह शक्ति हवा है।
