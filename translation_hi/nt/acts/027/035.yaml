id: ACT.27.35
reference: Acts 27:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀εἴπας δὲ ταῦτα καὶ λαβὼν ἄρτον εὐχαρίστησεν τῷ θεῷ ἐνώπιον πάντων καὶ κλάσας ἤρξατο ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/027/035.yaml
  text: And after saying these things and taking bread[a], he gave thanks to God in the presence of all, and after breaking it, he began to eat.
translation:
  language: hi
  text: ये बातें कहने के बाद उसने रोटी ली, सबके सामने[a] परमेश्वर को धन्यवाद दिया, और रोटी तोड़कर खाने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सबकी उपस्थिति में।”
    reason: ἐνώπιον πάντων के स्थानगत और सार्वजनिक भाव को व्यक्त करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: εἴπας δὲ ταῦτα
  choice: ये बातें कहने के बाद
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले की क्रिया बताता है; δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है, जिसे हिन्दी में अलग शब्द से व्यक्त करना आवश्यक नहीं। ταῦτα पिछली बातों की ओर संकेत करता है।
- source_word: λαβὼν ἄρτον
  choice: उसने रोटी ली
  rationale: ἄρτον अनिश्चित रूप में है; ‘रोटी’ न तो पूरी लोई का अनावश्यक संकेत देती है, न किसी मात्रा को निश्चित करती है।
- source_word: εὐχαρίστησεν τῷ θεῷ
  choice: परमेश्वर को धन्यवाद दिया
  rationale: εὐχαριστέω का सामान्य अर्थ धन्यवाद देना है, और τῷ θεῷ उसके स्पष्ट प्राप्तकर्ता को बताता है।
- source_word: ἐνώπιον πάντων
  choice: सबके सामने
  rationale: यह पदबंध कार्य के सार्वजनिक रूप से, सबकी दृष्टि या उपस्थिति में होने को व्यक्त करता है।
- source_word: κλάσας
  choice: रोटी तोड़कर
  rationale: अओरिस्ट कृदंत अगली क्रिया से पहले रोटी तोड़ने को बताता है; स्पष्टता के लिए अन्तर्निहित कर्म ‘रोटी’ दोहराया गया है।
- source_word: ἤρξατο ἐσθίειν
  choice: खाने लगा
  rationale: ἄρχομαι और infinitive का स्वाभाविक आधुनिक हिन्दी रूप आरम्भिक भाव को ठीक तरह व्यक्त करता है।
theological_decisions:
- issue: रोटी लेने, धन्यवाद देने, तोड़ने और खाने के क्रम में प्रभु-भोज की सम्भावित प्रतिध्वनि
  choice: क्रियाओं को साधारण कथात्मक भाषा में रखा गया है।
  alternative: शब्दावली को पारम्परिक प्रभु-भोज या संस्कार-संबंधी भाषा के अधिक निकट किया जा सकता था।
  rationale: वर्णन अन्य भोजन-वृत्तान्तों की याद दिला सकता है, पर यह पद स्वयं इस कार्य को प्रभु-भोज नहीं कहता। इसलिए अनिर्दिष्ट धार्मिक अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। कृदंतों का क्रम स्वाभाविक हिन्दी वाक्य-रचना में रखा गया है और मूल की सम्भावित धार्मिक प्रतिध्वनि को बिना बढ़ाए सुरक्षित रखा गया है।
