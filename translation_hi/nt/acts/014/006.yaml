lexical_decisions:
- source_word: συνιδόντες
  choice: जब उन्हें इसका पता चला
  rationale: यह क्रिया-विशेषणात्मक भूतकालिक कृदंत पिछली आयत में बताए गए खतरे को समझ लेने या उससे अवगत हो जाने का भाव देता है। हिन्दी में संदर्भ से ‘इसका’ जोड़ना स्वाभाविक और स्पष्ट है।
- source_word: κατέφυγον
  choice: भाग गए
  rationale: संदर्भ में आसन्न हिंसा से बचने के लिए तत्काल प्रस्थान मुख्य भाव है। ‘शरण लेने चले गए’ भी संभव है, पर यहाँ ‘भाग गए’ अधिक सीधा और स्वाभाविक है।
- source_word: εἰς
  choice: में
  rationale: गति की दिशा और गंतव्य को हिन्दी में नगरों तथा क्षेत्र के साथ ‘में’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὰς πόλεις τῆς Λυκαονίας
  choice: लुकाउनिया के नगरों
  rationale: यह क्षेत्र-संबंधी संबंधकारक संरचना को बनाए रखता है और आगे दिए नगरों के नामों को उसी की व्याख्या के रूप में प्रस्तुत करता है।
- source_word: Λύστραν καὶ Δέρβην
  choice: लुस्त्रा और दिरबे
  rationale: स्थान-नामों के प्रचलित हिन्दी लिप्यंतरण चुने गए हैं; ये ‘नगरों’ की पहचान बताते हैं।
- source_word: τὴν περίχωρον
  choice: आसपास के क्षेत्र
  rationale: यह नामवत प्रयुक्त शब्द नामित नगरों के चारों ओर के व्यापक इलाके को सूचित करता है; ‘आसपास का क्षेत्र’ शहरी और ग्रामीण दोनों परिवेश समेट सकता है।
- source_word: καὶ ... καὶ
  choice: —लुस्त्रा और दिरबे—और
  rationale: डैश नगरों के नामों को पहले आए ‘नगरों’ की व्याख्या के रूप में स्पष्ट करते हैं, जबकि अंतिम ‘और’ आसपास के क्षेत्र को जोड़ता है।
