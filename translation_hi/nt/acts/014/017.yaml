base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: hi
  text: फिर भी उसने अपने विषय में गवाही दिए बिना नहीं छोड़ा[a], भलाई करते हुए उसने तुम्हें स्वर्ग से वर्षाएँ और फलदायी ऋतुएँ[b] दीं और तुम्हारे हृदयों[c] को भोजन और आनन्द से भर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने विषय में साक्ष्य दिए बिना नहीं छोड़ा।”
    reason: lexical_alternative
  - marker: b
    text: या, “फल देने वाली ऋतुएँ।”
    reason: lexical_alternative
  - marker: c
    text: कुछ पाण्डुलिपियों में “हमारे हृदयों” का पाठ है; SBLGNT में “तुम्हारे हृदयों” है।
    reason: textual_variant
