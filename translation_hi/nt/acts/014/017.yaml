- source_word: καίτοι
  choice: फिर भी
  rationale: यह पिछले कथन के बावजूद परमेश्वर की निरन्तर भलाई को दिखाने वाला स्वाभाविक रियायती संयोजक है।
- source_word: ἀμάρτυρον αὑτὸν ἀφῆκεν
  choice: उसने अपने विषय में गवाही दिए बिना नहीं छोड़ा
  rationale: यह यूनानी की नकारात्मक अभिव्यक्ति और आत्मवाचक बल—परमेश्वर द्वारा अपने विषय में गवाही—दोनों को बनाए रखता है।
- source_word: ἀγαθουργῶν
  choice: वह भलाई करता रहा
  rationale: वर्तमान कृदन्त परमेश्वर के उपकारी कार्य को व्यक्त करता है और आगे आने वाले उदाहरणों की भूमिका बनता है।
- source_word: οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς
  choice: तुम्हें आकाश से वर्षा देता रहा
  rationale: ‘आकाश’ यहाँ वर्षा के दृश्य स्रोत के लिए स्वाभाविक हिन्दी है; ‘देता रहा’ कृदन्त की जारी व्याख्यात्मक क्रिया को प्रकट करता है।
- source_word: καιροὺς καρποφόρους
  choice: फलदायी ऋतुएँ
  rationale: यह कृषि-संबंधी उत्पादकता और नियत मौसमी अवधियों, दोनों को संक्षेप और सहज रूप में व्यक्त करता है।
- source_word: ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης
  choice: भोजन और आनन्द से भरता रहा
  rationale: ‘भरता रहा’ परिपूर्ण उपलब्धता की छवि बनाए रखता है; ‘आनन्द’ आधुनिक हिन्दी में εὐφροσύνη का स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: τὰς καρδίας ὑμῶν
  choice: तुम्हारे हृदयों को
  rationale: SBLGNT के द्वितीय पुरुष बहुवचन ὑμῶν को सीधे दर्शाता है और ‘हृदय’ की मूल रूपकात्मक अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: सृष्टि और उपकारी प्रबन्ध के द्वारा परमेश्वर की गवाही
  choice: वर्षा, फलदायी ऋतुएँ, भोजन और आनन्द को परमेश्वर द्वारा अपने विषय में दी गई गवाही के रूप में प्रस्तुत करना
  alternative: इन बातों को केवल निरपेक्ष प्राकृतिक प्रक्रियाओं के रूप में प्रस्तुत करना
  rationale: αὑτὸν और ἀμάρτυρον के साथ परमेश्वर के सक्रिय कृदन्त स्पष्ट करते हैं कि उसकी उपकारी व्यवस्था उसके विषय में गवाही देती है; इससे आगे कोई विस्तृत सिद्धान्त आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। यूनानी वाक्य की रियायती शुरुआत, नकारात्मक गवाही-सूत्र और कृदन्तों की व्याख्यात्मक प्रगति को स्वाभाविक हिन्दी में बनाए रखा गया है।
