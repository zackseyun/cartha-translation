id: ACT.14.21
reference: Acts 14:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εὐαγγελισάμενοί τε τὴν πόλιν ἐκείνην καὶ μαθητεύσαντες ἱκανοὺς ὑπέστρεψαν εἰς τὴν Λύστραν καὶ ⸀εἰς Ἰκόνιον καὶ ⸁εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: hi
  text: और उस नगर में सुसमाचार सुनाने[a] और बहुत-से लोगों को चेला बनाने के बाद, वे लुस्त्रा, इकुनियुम और अन्ताकिया लौट गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुभ समाचार का प्रचार करने के बाद।”
    reason: εὐαγγελίζोμαι के पारम्परिक ‘सुसमाचार सुनाना’ और अधिक सामान्य ‘शुभ समाचार का प्रचार करना’—दोनों अर्थ-संगत अभिव्यक्तियाँ हैं।
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: सुसमाचार सुनाने के बाद
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले पूरी हुई क्रिया बताता है। ‘सुसमाचार सुनाना’ आधुनिक हिन्दी में सहज है और शुभ समाचार घोषित करने का भाव बनाए रखता है।
- source_word: τε
  choice: और
  rationale: यह हल्का संयोजक पिछले कथन से प्रवाह जोड़ता है; हिन्दी में ‘और’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν πόλιν ἐκείνην
  choice: उस नगर में
  rationale: यह प्रसंग में पहले उल्लिखित दिरबे की ओर संकेत करता है; πόλις के लिए ‘नगर’ सीधा और गरिमापूर्ण विकल्प है।
- source_word: μαθητεύσαντες
  choice: चेला बनाने के बाद
  rationale: क्रिया का अर्थ लोगों को चेला बनाना है। संयुक्त रचना में इसे पहले कृदन्त के साथ ‘...और...के बाद’ के अंतर्गत रखा गया है।
- source_word: ἱκανοὺς
  choice: बहुत-से लोगों को
  rationale: यहाँ शब्द पर्याप्तता नहीं, बल्कि बड़ी संख्या का बोध देता है; कर्म को स्पष्ट करने के लिए ‘लोगों को’ जोड़ा गया है।
- source_word: ὑπέστρεψαν
  choice: वे लौटकर ... गए
  rationale: मुख्य क्रिया वापसी की यात्रा बताती है। हिन्दी में गन्तव्यों की सूची के साथ ‘लौटकर ... गए’ अधिक स्वाभाविक है।
- source_word: εἰς τὴν Λύστραν καὶ εἰς Ἰκόνιον καὶ εἰς Ἀντιόχειαν
  choice: लुस्त्रा, इकुनियुम और अन्ताकिया गए
  rationale: εἰς प्रत्येक स्थान को यात्रा के गन्तव्य के रूप में चिह्नित करता है। हिन्दी में एक ही ‘गए’ के साथ सूची देना स्वाभाविक है और यात्रा-क्रम सुरक्षित रहता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चेला बनाना’ μαθητεύω का सक्रिय अर्थ सुरक्षित रखता है। स्थान-नामों के क्रम को यूनानी पाठ के अनुसार बनाए रखा गया है। अंग्रेज़ी परामर्श-पाठ में [a] का स्थान ‘disciples’ के बाद था, पर उसकी टिप्पणी Εὐαγγελισάμενοί से सम्बद्ध है; इसलिए हिन्दी मुख्य पाठ में चिह्न सही पद के बाद रखा गया है।
