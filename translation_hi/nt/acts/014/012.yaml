  text: ἐκάλουν τε ⸀τὸν Βαρναβᾶν Δία, τὸν δὲ Παῦλον Ἑρμῆν, ἐπειδὴ αὐτὸς ἦν ὁ ἡγούμενος τοῦ λόγου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: hi
  text: और वे बरनबास को ज़ीउस और पौलुस को हर्मेस कहते थे, क्योंकि वही मुख्य वक्ता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάλουν
  choice: कहते थे
  rationale: अपूर्ण भूतकाल चलती या बार-बार होने वाली क्रिया व्यक्त करता है; ‘कहते थे’ भीड़ द्वारा उन नामों से पुकारे जाने का यही भाव रखता है।
- source_word: τε
  choice: और
  rationale: यह पिछले वृत्तांत से हल्का संबंध जोड़ता है; ‘और’ हिंदी में स्वाभाविक संयोजक है।
- source_word: Δία
  choice: ज़ीउस
  rationale: यूनानी पाठ में यूनानी देवता ज़ीउस का ही नाम है; रोमी समकक्ष ‘बृहस्पति’ या ‘ज्यूपिटर’ को लाना मूल-पाठ से दूर होगा।
- source_word: Ἑρμῆν
  choice: हेरमीस
  rationale: यूनानी पाठ हेरमीस का नाम लेता है; रोमी समकक्ष ‘मरकुरी’ के बजाय मूल नाम रखा गया है।
- source_word: ἐπειδὴ
  choice: क्योंकि
  rationale: यह उस कारण को स्पष्ट करता है जिसके चलते भीड़ ने पौलुस को हेरमीस माना।
- source_word: αὐτὸς
  choice: वही
  rationale: सर्वनाम का बल पौलुस को बरनबास से अलग करके दिखाता है; ‘वही’ इस ज़ोर को सहज हिंदी में व्यक्त करता है।
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: बोलने में अगुवाई करता था
  rationale: यह वाक्यांश उस व्यक्ति को बताता है जो भाषण या संवाद में प्रमुख भूमिका निभा रहा था; यह अनुवाद ‘मुख्य वक्ता’ के अर्थ को रखते हुए मूल की क्रियात्मक अभिव्यक्ति भी बचाता है।
theological_decisions:
- issue: गैर-यहूदी देवताओं के नामों का अनुवाद
  choice: मुख्य पाठ में ‘ज़ीउस’ और ‘हेरमीस’
  alternative: ‘ज्यूपिटर/बृहस्पति’ और ‘मरकुरी/बुध’
  rationale: वचन भीड़ द्वारा बरनबास और पौलुस की यूनानी देवताओं से पहचान का वर्णन करता है। मूल यूनानी नाम रखने से रोमी या भारतीय समकक्षों के कारण पैदा होने वाली अनावश्यक व्याख्या से बचा जाता है।
- issue: ὁ ἡγούμενος τοῦ λόγου का अर्थ
  choice: ‘बोलने में अगुवाई वही करता था’
  alternative: ‘वही मुख्य वक्ता था’
  rationale: दोनों अर्थसंगत हैं, पर चुना हुआ रूप ‘अगुवाई करने’ की कृदंतात्मक शक्ति और λόγος के यहाँ वाणी/भाषण संबंधी अर्थ को अधिक प्रत्यक्ष रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली। यूनानी व्यक्तिनामों के प्रचलित हिंदी लिप्यंतरण रखे गए हैं और मुहावरेदार हिंदी के लिए वाक्य-विन्यास स्वाभाविक बनाया गया है।
