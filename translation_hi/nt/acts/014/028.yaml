  text: And they stayed with the disciples for no little time[a].
translation:
  language: hi
  text: और वे चेलों के साथ बहुत समय तक रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέτριβον
  choice: वे ... रहे
  rationale: अपूर्ण भूतकाल यहाँ किसी स्थान पर लगातार समय बिताने या ठहरे रहने का भाव देता है; हिंदी में ‘रहे’ इस कालगत निरंतरता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ
  choice: और
  rationale: δέ हल्का कथात्मक संयोजक है; ‘और’ प्रसंग की निरंतरता को सहज ढंग से बनाए रखता है।
- source_word: χρόνον οὐκ ὀλίγον
  choice: बहुत समय तक
  rationale: यूनानी में शाब्दिक रूप ‘थोड़ा समय नहीं’ एक न्यूनोक्ति है, जिसका स्वाभाविक हिंदी अर्थ ‘बहुत समय तक’ है। ‘कम समय तक नहीं’ औपचारिक संरचना तो बचाता, पर आधुनिक हिंदी में असहज और अर्थ की दृष्टि से कम स्पष्ट होता।
- source_word: σὺν τοῖς μαθηταῖς
  choice: चेलों के साथ
  rationale: σύν के साथ संबंध या संगति का सीधा अर्थ है; ‘चेलों के साथ’ स्थानीय विश्वासी समुदाय के साथ रहने को स्वाभाविक रूप से व्यक्त करता है।
