  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: hi
  text: जब लोगों की भीड़ ने देखा कि पौलुस ने क्या किया था, तो उसने अपनी आवाज़ ऊँची की और लुकाउनियाई भाषा में कहा, “देवता मनुष्यों के समान होकर हमारे पास उतर आए हैं!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵ τε ὄχλοι ἰδόντες
  choice: जब भीड़ ने देखा
  rationale: τέ कथा के प्रवाह को आगे बढ़ाता है और ἰδόντες मुख्य क्रिया की परिस्थिति बताने वाला कालवाचक कृदंत है। हिन्दी में ‘जब … देखा’ स्वाभाविक रूप से इस संबंध को व्यक्त करता है। यूनानी बहुवचन ὄχλοι के बावजूद यहाँ एकत्र जनसमूह के लिए हिन्दी का सामूहिक एकवचन ‘भीड़’ सहज है।
- source_word: ὃ ἐποίησεν Παῦλος
  choice: कि पौलुस ने क्या किया था
  rationale: यह निकटपूर्व चंगाई के कार्य की ओर संकेत करता है। ‘किया था’ मुख्य प्रतिक्रिया से पहले घटे कार्य का क्रम स्पष्ट करता है।
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: वे … ऊँचे स्वर से कहने लगे
  rationale: यह मुहावरा जोर से बोलने या पुकारने को दर्शाता है। ‘ऊँचे स्वर से’ अर्थ को स्वाभाविक हिन्दी में रखता है और केवल ‘चिल्लाए’ की अपेक्षा मूल रूपक के निकट है।
- source_word: Λυκαονιστί
  choice: लुकाउनिया की भाषा में
  rationale: यह क्रियाविशेषण लुकाउनियाई भाषा में बोलने को बताता है। आधुनिक पाठक के लिए ‘भाषा’ स्पष्ट करना उपयोगी है।
- source_word: Οἱ θεοὶ
  choice: देवता
  rationale: बहुवचन θεοί यहाँ भीड़ द्वारा माने गए अनेक स्थानीय देवताओं को दर्शाता है; ‘देवता’ इस मूर्तिपूजक संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: मनुष्यों के समान होकर
  rationale: अओरिस्ट कर्मवाच्य कृदंत और सम्प्रदान ἀνθρώποις समानता का भाव देते हैं। ‘मनुष्यों के समान होकर’ कृदंतीय रचना और वास्तविक अस्पष्टता को बचाता है, बिना किसी विशिष्ट अवतार-सिद्धांत को आरोपित किए।
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: हमारे पास उतर आए हैं
  rationale: καταβαίνω नीचे आने को व्यक्त करता है। ‘उतर आए हैं’ भीड़ की तत्काल और उत्साहित अनुभूति को स्वाभाविक हिन्दी में प्रकट करता है।
theological_decisions:
- issue: भीड़ की बहुदेववादी व्याख्या को किसी मसीही अवतार-सिद्धांत में बदलने से बचाना
  choice: देवता मनुष्यों के समान होकर हमारे पास उतर आए हैं
  alternative: देवता मनुष्य रूप धारण करके हमारे पास उतर आए हैं
  rationale: ‘मनुष्यों के समान होकर’ ὁμοιωθέντες की समानता-वाचक और कर्मवाच्य अभिव्यक्ति के निकट रहता है। ‘मनुष्य रूप धारण करके’ अधिक व्याख्यात्मक है और ऐसी सुस्पष्ट अवतार-धारणा सुझा सकता है जिसे कथन स्वयं आवश्यक रूप से स्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक शैली सरल, गरिमापूर्ण और मौखिक उद्घोष के लिए स्वाभाविक रखी गई है। पद में कोई पादटिप्पणी आवश्यक नहीं मानी गई, इसलिए मुख्य पाठ में कोई चिह्न नहीं जोड़ा गया।
