revisions:
- from: इसलिए वे वहाँ बहुत समय तक रहे और प्रभु के लिए निडर होकर बोलते रहे[a]। प्रभु उनके हाथों से चिह्न और अद्भुत काम करवाता था और इस प्रकार अपने अनुग्रह के वचन की गवाही देता था।
  to: इसलिए वे वहाँ काफी समय तक ठहरे और प्रभु के लिए निडर होकर बोलते रहे[a], जो अपने अनुग्रह के वचन की गवाही देता था और उनके हाथों से चिन्ह और चमत्कार होने देता था।
  rationale: 'The revision preserves the original sequence and coordination: the Lord is both bearing witness to the word of his grace and granting signs and wonders to occur through the missionaries’ hands. It removes the interpretive connective “इस प्रकार,” retains the ambiguity of ἐπὶ τῷ κυρίῳ in the footnote, and uses the natural biblical collocation “चिन्ह और चमत्कार.”'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:54:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the duration, bold speech, the Lord’s attestation, and miracles through their hands. However, it reverses the source’s participial relation: the Lord bears witness to the word of grace by/granting signs and wonders, whereas the draft says he performs signs and wonders and thereby bears witness. “इस प्रकार” makes that connection explicit and interpretive rather than retaining the Greek construction.'
  naturalness: The Hindi is generally clear and modern. “अद्भुत काम” is understandable but less idiomatic and less concise than the established biblical pair “चिन्ह और चमत्कार.” A relative clause attached to “प्रभु” makes the sequence and relationship clearer without undue heaviness.
  terminology: “प्रभु,” “अनुग्रह,” and “वचन” appropriately preserve the source terms without over-specifying the Lord’s identity or resolving the sense of ἐπὶ τῷ κυρίῳ. The alternate sense in the footnote is useful and should remain.
  issues:
  - severity: medium
    issue: The main text changes the source’s syntactic and semantic relationship between the Lord’s witness and the granting of signs and wonders.
    rationale: The Greek describes “the Lord, bearing witness to the word of his grace, granting signs and wonders to occur through their hands.” The draft’s “...चिह्न और अद्भुत काम करवाता था और इस प्रकार ... गवाही देता था” presents the signs first and makes the witness a stated result. The revised wording retains both coordinated present participles without adding “इस प्रकार.”
  - severity: low
    issue: “अद्भुत काम” is a less natural rendering of τέρατα in the fixed collocation σημεῖα καὶ τέρατα.
    rationale: “चिन्ह और चमत्कार” is natural modern Hindi and preserves the conventional biblical pairing of evidentiary signs and wondrous acts.
  revised_text: इसलिए वे वहाँ काफी समय तक ठहरे और प्रभु के लिए निडर होकर बोलते रहे[a], जो अपने अनुग्रह के वचन की गवाही देता था और उनके हाथों से चिन्ह और चमत्कार होने देता था।
