id: ACT.14.3
reference: Acts 14:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἱκανὸν μὲν οὖν χρόνον διέτριψαν παρρησιαζόμενοι ἐπὶ τῷ κυρίῳ τῷ μαρτυροῦντι ⸀τῷ λόγῳ τῆς χάριτος αὐτοῦ, διδόντι σημεῖα καὶ τέρατα γίνεσθαι διὰ τῶν χειρῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/003.yaml
  text: So they stayed there a considerable time[a], speaking boldly for the Lord, who was bearing witness to the word of his grace, granting signs and wonders to be done through their hands.
translation:
  language: hi
  text: इसलिए वे वहाँ काफी समय तक ठहरे और प्रभु के लिए निडर होकर बोलते रहे[a], जो अपने अनुग्रह के वचन की गवाही देता था और उनके हाथों से चिन्ह और चमत्कार होने देता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु में निडर होकर बोलते रहे”; इसका अर्थ “प्रभु पर भरोसा रखकर निडर होकर बोलते रहे” भी हो सकता है।
    reason: यूनानी ἐπὶ τῷ κυρίῳ उनके निर्भीक बोलने का आधार, क्षेत्र, या प्रभु पर निर्भरता व्यक्त कर सकता है।
lexical_decisions:
- source_word: ἱκανὸν ... χρόνον
  choice: बहुत समय तक
  rationale: यह यूनानी मुहावरा पर्याप्त रूप से लंबी अवधि बताता है। ‘बहुत समय तक’ स्वाभाविक हिन्दी है और अवधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: διέτριψαν
  choice: वे वहाँ ... रहे
  rationale: यह क्रिया किसी स्थान पर समय बिताने या ठहरे रहने को व्यक्त करती है; प्रसंग से स्पष्ट ‘वहाँ’ हिन्दी वाक्य को स्वाभाविक बनाता है।
- source_word: παρρησιαζόμενοι
  choice: निडर होकर बोलते रहे
  rationale: यह क्रिया खुले और निर्भीक भाषण का भाव रखती है। ‘बोलते रहे’ उस जारी गतिविधि को भी व्यक्त करता है।
- source_word: ἐπὶ τῷ κυρίῳ
  choice: प्रभु के लिए
  rationale: मुख्य पाठ में यह उनके निर्भीक प्रचार को प्रभु की सेवा और पक्ष से जोड़ता है। आधार, भरोसे या क्षेत्र का निकटतर भाव पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τῷ κυρίῳ
  choice: प्रभु
  rationale: κύριος की उपाधि को बिना ‘यीशु’ या ‘परमेश्वर’ जोड़कर उसी रूप में रखा गया है।
- source_word: τῷ μαρτυροῦντι
  choice: गवाही देता था
  rationale: यह जारी रहने वाली पुष्टि को व्यक्त करता है और μαρτυρέω के साक्ष्य देने वाले भाव को बनाए रखता है।
- source_word: τῷ λόγῳ τῆς χάριτος αὐτοῦ
  choice: अपने अनुग्रह के वचन की
  rationale: ‘अनुग्रह का वचन’ मूल संबंधवाचक रचना को सुरक्षित रखता है; इसका अर्थ अनुग्रह से चिह्नित या अनुग्रह के विषय में संदेश हो सकता है।
- source_word: διδόντι
  choice: करवाता था
  rationale: यहाँ प्रभु चिह्न और अद्भुत काम होने की सामर्थ्य और अनुमति देता है। ‘करवाता था’ प्रेरक कर्तृत्व और प्रेरितों की साधनात्मक भूमिका दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σημεῖα καὶ τέρατα
  choice: चिह्न और अद्भुत काम
  rationale: यह प्रचलित बाइबलीय युग्म चमत्कारों के प्रमाणसूचक और विस्मयकारी दोनों पहलुओं को व्यक्त करता है।
- source_word: γίνεσθαι
  choice: करवाता था
  rationale: संयुक्त हिन्दी अभिव्यक्ति ‘काम करवाता था’ इन घटनाओं के प्रभु द्वारा संपन्न कराए जाने को स्पष्ट करती है।
- source_word: διὰ τῶν χειρῶν αὐτῶν
  choice: उनके हाथों से
  rationale: यह मूल की ठोस साधनात्मक अभिव्यक्ति को सुरक्षित रखता है और हिन्दी में भी सहज है।
theological_decisions:
- issue: ‘प्रभु’ का संदर्भ
  choice: केवल ‘प्रभु’ रखा गया है
  alternative: ‘प्रभु यीशु’ अथवा ‘परमेश्वर’
  rationale: यूनानी पाठ में केवल τῷ κυρίῳ है। किसी विशेष संदर्भ को स्पष्ट रूप से जोड़ना मूल से अधिक कहना होता।
- issue: ἐπὶ τῷ κυρίῳ का अर्थ-संबंध
  choice: मुख्य पाठ में ‘प्रभु के लिए’
  alternative: ‘प्रभु में’ अथवा ‘प्रभु पर भरोसा रखकर’
  rationale: पूर्वसर्गीय वाक्यांश आधार, भरोसे, संबंध या सेवा का भाव दे सकता है। सहज मुख्य पाठ के साथ पादटिप्पणी इस वास्तविक अस्पष्टता को सुरक्षित रखती है।
- issue: अनुग्रह के वचन का संबंध
  choice: ‘अपने अनुग्रह के वचन’
  alternative: ‘अपने अनुग्रह के संदेश’ अथवा ‘अपने अनुग्रहपूर्ण वचन’
  rationale: मूल संबंधवाचक पदबंध यह खुला छोड़ता है कि वचन अनुग्रह के विषय में है या अनुग्रह से चिह्नित है; शाब्दिक संबंध को बनाए रखने से यह तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘निडर होकर’, ‘अनुग्रह का वचन’ और ‘उनके हाथों से’ मूल के प्रमुख बाइबलीय और धर्मवैचारिक भावों को बनाए रखते हैं।
