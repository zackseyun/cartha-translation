  revision_rationale: 'The revision preserves the original sequence and coordination: the Lord is both bearing witness to the word of his grace and granting signs and wonders to occur through the missionaries’ hands. It removes the interpretive connective “इस प्रकार,” retains the ambiguity of ἐπὶ τῷ κυρίῳ in the footnote, and uses the natural biblical collocation “चिन्ह और चमत्कार.”'
