  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह यात्रा-वृत्तांत की अगली घटना को सीधे जोड़ता है; इससे यूनानी संयोजक का सरल प्रवाह बना रहता है।
- source_word: λαλήσαντες
  choice: सुनाने के बाद
  rationale: यह भूतकालिक कृदन्त की मुख्य क्रिया से पहले पूरी हुई क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है। केवल ‘बोलने’ की अपेक्षा यहाँ सन्दर्भगत रूप से सन्देश सुनाने का भाव स्पष्ट है, पर ‘प्रचार करने’ जैसा अधिक विशिष्ट अर्थ नहीं जोड़ा गया।
- source_word: τὸν λόγον
  choice: वचन
  rationale: यह लूका के लेखन में मसीही सन्देश के लिए प्रयुक्त परिचित अभिव्यक्ति को सुरक्षित रखता है। ‘प्रभु का वचन’ पाठ में नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: ἐν Πέργῃ
  choice: पिरगा में
  rationale: नगर के नाम के साथ ἐν का स्वाभाविक हिन्दी रूप ‘में’ है।
- source_word: κατέβησαν
  choice: उतर गए
  rationale: यह भीतरी भूभाग के पिरगा से तटीय अत्तलिया की ओर नीचे जाने के भौगोलिक भाव को संक्षिप्त और स्वाभाविक ढंग से बनाए रखता है।
- source_word: εἰς Ἀττάλειαν
  choice: अत्तलिया
  rationale: ‘उतर गए’ के साथ गन्तव्य बिना ‘को’ के स्वाभाविक हिन्दी में व्यक्त होता है; नगर का नाम यूनानी रूप के निकट लिप्यन्तरित है।
