  text: ὃς ἐν ταῖς παρῳχημέναις γενεαῖς εἴασεν πάντα τὰ ἔθνη πορεύεσθαι ταῖς ὁδοῖς αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: hi
  text: बीती पीढ़ियों में उसने सब राष्ट्रों को अपने-अपने मार्गों पर चलने दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब गैर-यहूदी लोगों को उनके मार्गों पर जाने दिया।”
    reason: ἔθνη का अर्थ ‘राष्ट्र’ या ‘गैर-यहूदी लोग’ और πορεύεσθαι का अर्थ ‘चलना’ या ‘जाना’ हो सकता है।
lexical_decisions:
- source_word: ὃς
  choice: उसने
  rationale: यूनानी में संबंधवाचक सर्वनाम ‘जिसने’ है, पर इसका कर्ता पिछले पद का जीवित परमेश्वर है। स्वतंत्र हिन्दी वाक्य में ‘उसने’ अधिक स्वाभाविक है और उसी संदर्भ को बनाए रखता है।
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: बीती पीढ़ियों में
  rationale: यह पदबंध गुजर चुकी पीढ़ियों या पूर्वकाल को दर्शाता है। ‘बीती पीढ़ियों में’ आधुनिक, सहज और समय-संबंधी अर्थ के निकट है।
- source_word: εἴασεν
  choice: चलने दिया
  rationale: ἐάω का अर्थ अनुमति देना या होने देना है। ‘दिया’ परमेश्वर की अनुमति अथवा सहनशीलता व्यक्त करता है, उन मार्गों की स्वीकृति नहीं।
- source_word: πάντα τὰ ἔθνη
  choice: सब राष्ट्रों को
  rationale: ἔθνη का अर्थ ‘राष्ट्र’ अथवा ‘गैर-यहूदी लोग’ हो सकता है। यहाँ ‘सब राष्ट्र’ यूनानी के व्यापक सामूहिक अर्थ और उसकी संभावित अस्पष्टता को बेहतर बनाए रखता है।
- source_word: πορεύεσθαι
  choice: चलने
  rationale: क्रिया का मूल अर्थ जाना या चलना है; ‘मार्गों’ के साथ यह जीवन-आचरण का रूपक बनती है। ‘चलने’ से रूपक और बाइबलीय प्रतिध्वनि दोनों सुरक्षित रहते हैं।
- source_word: ταῖς ὁδοῖς αὐτῶν
  choice: अपने-अपने मार्गों पर
  rationale: ὁδοῖς ‘मार्गों’ को और αὐτῶν प्रत्येक राष्ट्र से संबंधित उनके मार्गों को सूचित करता है। ‘अपने-अपने’ हिन्दी में इस वितरणात्मक अधिकार-संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की अनुमति बनाम नैतिक स्वीकृति
  choice: परमेश्वर ने राष्ट्रों को उनके अपने मार्गों पर चलने दिया
  alternative: परमेश्वर ने उन मार्गों को सही ठहराया या उन्हें अनिवार्य रूप से निर्धारित किया
  rationale: εἴασεν अनुमति या होने देने का भाव देता है। अनुवाद परमेश्वर की प्रभुता और मनुष्य की जिम्मेदारी के बीच तनाव को बनाए रखता है, पर नैतिक अनुमोदन या नियतिवाद नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘बीती पीढ़ियों’, ‘सब राष्ट्रों’ और ‘अपने-अपने मार्गों पर चलने दिया’ जैसे पद सामान्य पाठक के लिए स्पष्ट हैं और मूल रूपक को सुरक्षित रखते हैं।
