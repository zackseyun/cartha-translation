  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह साधारण संयोजक यात्रा-वृत्तांत को पिछले प्रसंग से जोड़ता है।
- source_word: διελθόντες
  choice: से होकर
  rationale: διέρχομαι का यह अओरिस्ट कृदन्त मुख्य क्रिया से पहले पूरी हुई यात्रा को व्यक्त करता है। हिंदी में ‘पिसिदिया से होकर ... पहुँचे’ इस संबंध को स्वाभाविक और संक्षिप्त रूप से स्पष्ट करता है।
- source_word: τὴν Πισιδίαν
  choice: पिसिदिया
  rationale: क्षेत्र के यूनानी नाम का प्रचलित हिंदी लिप्यंतरण। परसर्ग ‘से होकर’ के साथ क्षेत्र को पार करने का भाव व्यक्त होता है।
- source_word: ἦλθον
  choice: वे ... पहुँचे
  rationale: ἔρχομαι यहाँ यात्रा के गंतव्य तक आने का वर्णन करता है। हिंदी यात्रा-वृत्तांत में ‘पहुँचे’ ‘आए’ की अपेक्षा अधिक स्वाभाविक है और प्रसंग से बाहर वक्ता की स्थिति नहीं जोड़ता।
- source_word: εἰς ⸀τὴν Παμφυλίαν
  choice: पम्फूलिया पहुँचे
  rationale: εἰς गंतव्य की ओर और उसमें प्रवेश की गति दर्शाता है। हिंदी में स्थान के नाम के साथ ‘पहुँचे’ यह दिशात्मक भाव स्वाभाविक रूप से व्यक्त करता है; यूनानी नाम को ‘पम्फूलिया’ रूप में लिप्यंतरित किया गया है।
