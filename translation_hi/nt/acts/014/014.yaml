  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος, διαρρήξαντες τὰ ἱμάτια ⸀αὐτῶν ⸀ἐξεπήδησαν εἰς τὸν ὄχλον κράζοντες
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/014.yaml
  text: But when the apostles Barnabas and Paul heard, they tore their garments and rushed out into the crowd, crying out,
translation:
  language: hi
  text: पर जब प्रेरित बरनबास और पौलुस ने यह सुना, तो उन्होंने अपने वस्त्र फाड़ डाले[a] और चिल्लाते हुए भीड़ में जा घुसे[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वस्त्र फाड़ना शोक, भयावह आपत्ति या ईशनिन्दात्मक सम्मान के विरोध का प्रचलित संकेत था।
    reason: cultural_note
  - marker: b
    text: या, “भीड़ में उछलकर जा पहुँचे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: जब ... ने यह सुना
  rationale: कालवाचक एओरिस्ट कृदन्त को स्वाभाविक हिन्दी में क्रमबद्ध क्रिया के रूप में व्यक्त किया गया है; ‘यह’ पिछले प्रसंग की बात की ओर संकेत करता है।
- source_word: δὲ
  choice: पर
  rationale: भीड़ के बलिदान चढ़ाने के प्रयास और प्रेरितों की प्रतिक्रिया के बीच हल्का विरोध और कथात्मक मोड़ व्यक्त करता है।
- source_word: οἱ ἀπόστολοι Βαρναβᾶς καὶ Παῦλος
  choice: प्रेरित बरनबास और पौलुस
  rationale: यूनानी समानाधिकरण बरनबास और पौलुस को इस प्रसंग में ‘प्रेरित’ कहता है; इसे बिना व्याख्यात्मक संकुचन के बनाए रखा गया है।
- source_word: διαρρήξαντες τὰ ἱμάτια αὐτῶν
  choice: उन्होंने अपने वस्त्र फाड़ डाले
  rationale: यह शोक, भयावह आपत्ति या ईशनिन्दात्मक सम्मान के विरोध की सांस्कृतिक क्रिया है; ‘वस्त्र’ गरिमापूर्ण और स्पष्ट है, जबकि ‘फाड़ डाले’ क्रिया की तीव्रता रखता है।
- source_word: ἐξεπήδησαν
  choice: जा घुसे
  rationale: क्रिया अचानक और जोरदार गति बताती है। प्रसंग में ‘भीड़ में जा घुसे’ स्वाभाविक हिन्दी में तत्परता व्यक्त करता है, बिना यूनानी में अनुपस्थित किसी निश्चित स्थान से ‘बाहर’ आने को जोड़ने के।
- source_word: εἰς τὸν ὄχλον
  choice: भीड़ में
  rationale: εἰς लोगों के समूह के भीतर की ओर गति दर्शाता है।
- source_word: κράζοντες
  choice: चिल्लाते हुए
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ चलने वाली ऊँची और तीव्र पुकार व्यक्त करता है; कथन की विषयवस्तु अगले पद में आती है।
theological_decisions:
- issue: ‘प्रेरित’ शब्द का बरनबास और पौलुस के लिए प्रयोग
  choice: ‘प्रेरित बरनबास और पौलुस’ को मुख्य पाठ में यथावत रखा गया है।
  alternative: ‘बरनबास और पौलुस, जो संदेशवाहक थे’ अथवा इस पदवी को केवल बारह प्रेरितों तक सीमित करने वाली व्याख्या।
  rationale: यूनानी पाठ इस प्रसंग में बरनबास और पौलुस को सीधे ἀπόστολοι कहता है। अनुवाद को प्रेरिताई के दायरे पर बाद की धर्मसैद्धान्तिक बहस का निर्णय आरोपित नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘वस्त्र’ सांस्कृतिक क्रिया के लिए उपयुक्त औपचारिकता रखता है; ‘जा घुसे’ अचानक और तत्पर गति को बोलचाल में अत्यधिक ढीला हुए बिना व्यक्त करता है।
