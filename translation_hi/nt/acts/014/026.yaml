base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: hi
  text: और वहाँ से वे जहाज़ से अन्ताकिया गए, जहाँ से वे उस काम के लिए, जिसे उन्होंने पूरा कर लिया था, परमेश्वर के अनुग्रह के भरोसे सौंपे गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: और वहाँ से
  rationale: संयोजक और स्थान-सूचक दोनों भावों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀπέπλευσαν εἰς Ἀντιόχειαν
  choice: वे जहाज़ से अन्ताकिया लौट गए
  rationale: क्रिया समुद्र-मार्ग से प्रस्थान को दर्शाती है; प्रसंग में अन्ताकिया पहले का प्रस्थान-स्थान है, इसलिए ‘लौट गए’ लक्ष्य की ओर वापसी को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὅθεν
  choice: जहाँ से
  rationale: मूल के स्रोत-सूचक अर्थ को स्पष्ट रूप से बनाए रखता है।
- source_word: ἦσαν παραδεδομένοι
  choice: सौंपे गए थे
  rationale: परिप्रयुक्त भूतपूर्व काल पहले घटित सौंपे जाने को दिखाता है; यह पद किसी विशिष्ट कलीसियाई विधि को आरोपित किए बिना παραδίδωμι का भाव देता है।
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: परमेश्वर के अनुग्रह को
  rationale: सम्प्रदान कारक उस सत्ता को दर्शाता है जिसकी देखरेख में उन्हें सौंपा गया था; ‘अनुग्रह’ χάρις का प्रतिष्ठित और बोधगम्य धार्मिक पर्याय है।
- source_word: εἰς τὸ ἔργον
  choice: उस काम के लिए
  rationale: ἔργον के सामान्य अर्थ को सुरक्षित रखता है और ‘मिशन’ जैसा अधिक व्याख्यात्मक शब्द नहीं जोड़ता।
- source_word: ὃ ἐπλήρωσαν
  choice: जिसे उन्होंने पूरा कर लिया था
  rationale: यहाँ πληρόω सौंपे गए कार्य को पूर्ण करने का अर्थ देता है; हिन्दी में ‘पूरा कर लिया था’ स्वाभाविक और कालगत रूप से स्पष्ट है।
theological_decisions:
- issue: पौलुस और बरनबास को पहले परमेश्वर के अनुग्रह के हवाले किए जाने का स्वरूप
  choice: परमेश्वर के अनुग्रह को सौंपे गए थे
  alternative: परमेश्वर के अनुग्रह पर छोड़ दिए गए थे
  rationale: ‘सौंपे गए थे’ परमेश्वर की अनुग्रहपूर्ण देखरेख का भाव रखता है, पर किसी विशेष सम्प्रदायगत अभिषेक या नियुक्ति-विधि को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमामय किंतु साधारण पाठक के लिए सहज। ‘अन्ताकिया’ प्रचलित हिन्दी बाइबलीय स्थान-नाम है। वाक्य-विन्यास में ‘जहाँ से’ मूल यूनानी की स्थानगत स्पष्टता बनाए रखता है।
