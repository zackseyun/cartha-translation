translation:
  language: hi
  text: और वहाँ भी वे शुभ समाचार सुनाते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖ
  choice: और वहाँ भी
  rationale: κἀκεῖ में καί और ἐκεῖ दोनों का बल है; ‘और वहाँ भी’ पिछले प्रसंग से संबंध तथा नए स्थान पर उसी कार्य की निरंतरता स्पष्ट करता है।
- source_word: εὐαγγελιζόμενοι
  choice: शुभ समाचार सुनाते
  rationale: εὐαγγελίζω का मूल अर्थ शुभ समाचार घोषित करना है। ‘शुभ समाचार सुनाना’ आधुनिक हिन्दी में स्वाभाविक और सामान्य पाठक के लिए स्पष्ट है, जबकि ‘सुसमाचार प्रचार करना’ अधिक कलीसियाई शब्दावली हो सकती है।
- source_word: ἦσαν
  choice: रहे
  rationale: εὐαγγελιζόμενοι के साथ ἦσαν अपूर्णकालिक परिभाषात्मक रचना बनाता है, जो अतीत में जारी गतिविधि को दर्शाती है; हिन्दी में ‘सुनाते रहे’ इसे सहज रूप से व्यक्त करता है।
