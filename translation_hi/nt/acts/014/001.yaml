  text: Ἐγένετο δὲ ἐν Ἰκονίῳ κατὰ τὸ αὐτὸ εἰσελθεῖν αὐτοὺς εἰς τὴν συναγωγὴν τῶν Ἰουδαίων καὶ λαλῆσαι οὕτως ὥστε πιστεῦσαι Ἰουδαίων τε καὶ Ἑλλήνων πολὺ πλῆθος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/001.yaml
  text: In Iconium they entered together into the synagogue of the Jews and spoke in such a way that a great multitude of both Jews and Greeks believed[a].
translation:
  language: hi
  text: इकुनियुम में वे दोनों साथ-साथ यहूदियों के आराधनालय[a] में गए और इस प्रकार बोले कि यहूदियों और यूनानियों की एक बड़ी संख्या ने विश्वास किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदी आराधनालय में।” यूनानी पाठ का शाब्दिक अर्थ है, “यहूदियों के आराधनालय में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: प्रत्यक्ष रूप से अलग शब्द में व्यक्त नहीं किया
  rationale: यह कथात्मक संक्रमण-सूत्र है। हिंदी में अनावश्यक ‘तब ऐसा हुआ’ जोड़े बिना मुख्य वाक्य से आरंभ करना अधिक स्वाभाविक है।
- source_word: ἐν Ἰκονίῳ
  choice: इकुनियुम में
  rationale: स्थानवाचक पद का सीधा लिप्यंतरण और अनुवाद।
- source_word: κατὰ τὸ αὐτό
  choice: दोनों साथ-साथ
  rationale: यहाँ पौलुस और बरनबास की संयुक्त क्रिया को व्यक्त करता है; ‘दोनों’ निहित बहुवचन कर्ता को स्पष्ट करता है।
- source_word: εἰσελθεῖν αὐτοὺς
  choice: वे ... में गए
  rationale: ἐγένετο के साथ आश्रित infinitive को स्वाभाविक हिंदी में पूर्ण क्रिया बनाया गया है; ‘में गए’ प्रवेश का भाव सहज रूप से देता है।
- source_word: εἰς τὴν συναγωγὴν τῶν Ἰουδαίων
  choice: यहूदियों के आराधनालय में
  rationale: सम्बन्धकारक τῶν Ἰουδαίων को स्पष्ट रखते हुए συναγωγή के लिए सामान्य और प्रतिष्ठित हिंदी शब्द ‘आराधनालय’ चुना गया है।
- source_word: λαλῆσαι
  choice: बोले
  rationale: क्रिया को बिना अनावश्यक व्याख्या के सीधे रूप में रखा गया है।
- source_word: οὕτως ὥστε
  choice: इस प्रकार ... कि
  rationale: बोलने के ढंग और उसके परिणाम—दोनों को सुरक्षित रखता है।
- source_word: πιστεῦσαι
  choice: विश्वास किया
  rationale: πιστεύω का सामान्य, संदर्भानुकूल धार्मिक अर्थ सुरक्षित है; किस पर या किस संदेश में विश्वास किया, यह पाठ में जोड़ा नहीं गया।
- source_word: Ἰουδαίων τε καὶ Ἑλλήνων
  choice: यहूदियों और यूनानियों—दोनों में से
  rationale: τε καὶ द्वारा जुड़े दोनों समुदायों को स्पष्ट रूप से समाविष्ट करता है।
- source_word: πολὺ πλῆθος
  choice: बड़ी संख्या में लोगों ने
  rationale: ‘एक बड़ी भीड़’ की अपेक्षा आधुनिक हिंदी में अधिक सहज है और बड़ी संख्या का बल बनाए रखता है।
theological_decisions:
- issue: कथात्मक मन-फिराव के संदर्भ में πιστεῦσαι का अर्थ
  choice: विश्वास किया
  alternative: विश्वास में आए / संदेश पर विश्वास किया
  rationale: मूल क्रिया केवल विश्वास करने की प्रतिक्रिया बताती है। चुना हुआ रूप इस अर्थ को सुरक्षित रखता है और कर्म अथवा धर्मशास्त्रीय विवरण को अनकहा ही रहने देता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और कथात्मक। ‘आराधनालय’ पाठकों में प्रचलित बाइबिलीय शब्दावली को बनाए रखता है, जबकि पादटिप्पणी सम्बन्धकारक पद की वैकल्पिक स्वाभाविक अभिव्यक्ति बताती है।
