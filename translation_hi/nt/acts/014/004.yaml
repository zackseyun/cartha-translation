  text: ἐσχίσθη δὲ τὸ πλῆθος τῆς πόλεως, καὶ οἱ μὲν ἦσαν σὺν τοῖς Ἰουδαίοις οἱ δὲ σὺν τοῖς ἀποστόλοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/004.yaml
  text: But the people of the city were divided[a], and some were with the Jews and some with the apostles.
translation:
  language: hi
  text: परन्तु नगर के लोग बँट गए[a]। कुछ यहूदियों के साथ थे और कुछ प्रेरितों के साथ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नगर का जनसमुदाय विभाजित हो गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσχίσθη
  choice: बँट गए थे
  rationale: σχίζω के कर्मवाच्य रूप का अर्थ ‘बँट जाना’ या ‘विभाजित हो जाना’ है। सामूहिक कर्ता ‘नगर के लोग’ के साथ यह स्वाभाविक आधुनिक हिन्दी में सामाजिक विभाजन को स्पष्ट करता है।
- source_word: τὸ πλῆθος τῆς πόλεως
  choice: नगर के लोग
  rationale: πλῆθος यहाँ किसी एक अवसर पर इकट्ठी भीड़ से अधिक नगर के जनसमुदाय को सूचित करता है; ‘नगर के लोग’ सहज और प्रसंगानुकूल है।
- source_word: δὲ
  choice: परन्तु
  rationale: δέ पिछले कथन से हल्का विरोध या नया घटनाक्रम प्रकट करता है; ‘परन्तु’ उस विरोध को गरिमापूर्ण और स्पष्ट ढंग से व्यक्त करता है।
- source_word: οἱ μὲν ... οἱ δὲ
  choice: कुछ ... और कुछ
  rationale: यह सहसंबंधी रचना लोगों के दो विपरीत दल दिखाती है; ‘कुछ ... और कुछ’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: σὺν
  choice: के साथ
  rationale: σύν संबंध या पक्ष-संगति बताता है। ‘के साथ’ मूल की सादगी बनाए रखता है, जबकि प्रसंग से पक्ष लेना स्वतः स्पष्ट है।
- source_word: Ἰουδαίοις
  choice: यहूदियों
  rationale: पद स्वयं संदर्भ को केवल अगुओं तक सीमित नहीं करता; इसलिए सामान्य समूहवाचक ‘यहूदियों’ मूल के अनुरूप है।
- source_word: ἀποστόλοις
  choice: प्रेरितों
  rationale: प्रेरित’ ἀπόστολος का स्थापित और सुबोध हिन्दी पारिभाषिक रूप है; इस प्रसंग में यह पौलुस और बरनबास के लिए प्रयुक्त कथात्मक पदवी को बनाए रखता है।
theological_decisions:
- issue: ‘प्रेरितों’ का संदर्भ
  choice: पौलुस और बरनबास के लिए कथाकार की पदवी के रूप में ‘प्रेरितों’ को बनाए रखा गया।
  alternative: अधिक सामान्य रूप में ‘दूतों’ या ‘सन्देशवाहकों’ का अनुवाद।
  rationale: इसी अध्याय में लूका बरनबास और पौलुस को स्पष्टतः ‘प्रेरित’ कहता है (प्रेरितों 14:14)। सीधा अनुवाद पाठ की शब्दावली सुरक्षित रखता है और उससे आगे कोई संकीर्ण धर्मसैद्धान्तिक परिभाषा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण। ‘नगर के लोग’ सामूहिक अर्थ को स्वाभाविक बनाता है; ‘बँट गए थे’ सामाजिक पक्ष-विभाजन को स्पष्ट करता है।
