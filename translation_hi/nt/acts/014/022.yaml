id: ACT.14.22
reference: Acts 14:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐπιστηρίζοντες τὰς ψυχὰς τῶν μαθητῶν, παρακαλοῦντες ἐμμένειν τῇ πίστει καὶ ὅτι διὰ πολλῶν θλίψεων δεῖ ἡμᾶς εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/022.yaml
  text: strengthening the souls of the disciples[a], encouraging them to remain in the faith[c][b], and saying that through many afflictions we must enter the kingdom of God.
translation:
  language: hi
  text: वे शिष्यों के मनों को दृढ़ करते और उन्हें विश्वास में बने रहने के लिए प्रोत्साहित करते थे। वे कहते थे, “हमें बहुत-से क्लेशों से होकर परमेश्वर के राज्य में प्रवेश करना है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστηρίζοντες
  choice: दृढ़ करते
  rationale: यह वर्तमान कृदंत शिष्यों को लगातार स्थिर और मजबूत करने की क्रिया बताता है; ‘दृढ़ करते’ स्वाभाविक और अर्थ-संगत है।
- source_word: τὰς ψυχὰς
  choice: मनों को
  rationale: यहाँ ψυχή शिष्यों के भीतरी व्यक्तित्व या अंतर्मन को सूचित करता है। हिंदी में ‘मनों को दृढ़ करना’ स्वाभाविक है और मनुष्य को देह से अलग आत्मा मानने की अनावश्यक धारणा नहीं जोड़ता।
- source_word: τῶν μαθητῶν
  choice: शिष्यों के
  rationale: μαθητής के लिए ‘शिष्य’ नया नियम की मानक, स्पष्ट और प्रचलित हिंदी अभिव्यक्ति है।
- source_word: παρακαλοῦντες
  choice: प्रोत्साहित करते थे
  rationale: संदर्भ में यह सहायक आग्रह को व्यक्त करता है; ‘प्रोत्साहित’ सांत्वना और दृढ़ आग्रह के बीच का भाव स्वाभाविक हिंदी में रखता है।
- source_word: ἐμμένειν
  choice: बने रहने
  rationale: क्रिया किसी बात में स्थिरतापूर्वक टिके या जारी रहने का अर्थ देती है; ‘बने रहने’ इसके निरंतर भाव को व्यक्त करता है।
- source_word: τῇ πίστει
  choice: विश्वास में
  rationale: सप्रत्यय पद निश्चित, साझा मसीही विश्वास की ओर संकेत कर सकता है; हिंदी में ‘विश्वास में बने रहना’ इस निश्चितता को संदर्भ से ग्रहण करने देता है और अस्वाभाविक ‘उस विश्वास’ से बचता है।
- source_word: διὰ πολλῶν θλίψεων
  choice: बहुत-से क्लेशों से होकर
  rationale: θλῖψις दबाव, दुःख और उत्पीड़न का गंभीर भाव रखता है। ‘क्लेश’ बाइबलीय हिंदी में परिचित है, और ‘से होकर’ διά की मार्ग-सूचक शक्ति व्यक्त करता है।
- source_word: δεῖ ἡμᾶς
  choice: हमें … करना है
  rationale: यह हिंदी में आवश्यकता को स्पष्ट रूप से व्यक्त करता है, बिना उसके कारण या तात्त्विक स्वरूप को पाठ से आगे बढ़ाकर समझाए।
- source_word: εἰσελθεῖν εἰς
  choice: में प्रवेश करना
  rationale: गंतव्य की ओर प्रवेश का अर्थ स्पष्ट और स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर के राज्य
  rationale: यह βασιλεία की राज्य और शासन—दोनों संभावित छायाओं को समेटने वाली मानक तथा सहज हिंदी अभिव्यक्ति है।
theological_decisions:
- issue: τῇ πίστει का निश्चित अथवा सामान्य अर्थ
  choice: विश्वास में
  alternative: उस विश्वास में
  rationale: यूनानी लेख निश्चित सामुदायिक विश्वास की ओर संकेत करता है, पर हिंदी में ‘उस विश्वास में’ पूर्वनिर्दिष्ट संज्ञा के बिना भारी और अस्वाभाविक लगेगा। ‘विश्वास में बने रहना’ संदर्भगत निश्चितता को बनाए रखते हुए व्यक्तिपरक भरोसे तक अर्थ को सीमित नहीं करता।
- issue: δεῖ द्वारा व्यक्त आवश्यकता
  choice: हमें बहुत-से क्लेशों से होकर परमेश्वर के राज्य में प्रवेश करना है
  alternative: हमारे लिए बहुत-से क्लेशों से होकर परमेश्वर के राज्य में प्रवेश करना आवश्यक है
  rationale: ‘करना है’ यूनानी आवश्यकता की शक्ति को सहज हिंदी में रखता है, लेकिन यह नहीं बताता कि क्लेश राज्य में प्रवेश कमाने का साधन हैं; पाठ केवल उस मार्ग की अनिवार्यता बताता है।
- issue: θλῖψις में दुःख अथवा सताव का विस्तार
  choice: क्लेशों
  alternative: संकटों
  rationale: ‘क्लेश’ व्यापक दबाव, दुःख और विरोध को समेटता है तथा अर्थ को केवल सामान्य कठिनाइयों या केवल धार्मिक उत्पीड़न तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय किंतु सहज शैली रखी गई है। पद मूल वाक्य का अंश है, फिर भी हिंदी में स्वतंत्र पठनीयता के लिए चल रही क्रियाओं को ‘करते थे’ और कथन को प्रत्यक्ष वचन में प्रस्तुत किया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
