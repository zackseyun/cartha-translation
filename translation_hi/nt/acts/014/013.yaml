base_translation:
  language: en
  yaml_path: translation/nt/acts/014/013.yaml
  text: And the priest of Zeus[a], whose temple was before the city[b], brought bulls and wreaths to the gates and wanted to offer sacrifice with the crowds.
translation:
  language: hi
  text: तब नगर के बाहर स्थित ज़ीउस का याजक बैल और मालाएँ[a] फाटकों तक लाकर भीड़ के साथ बलि चढ़ाना चाहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅ τε
  choice: तब
  rationale: यह पदबंध कथा को आगे बढ़ाता है; हिंदी में “तब” प्रसंग का स्वाभाविक क्रम व्यक्त करता है।
- source_word: ἱερεὺς τοῦ Διὸς
  choice: ज़ीउस के मंदिर का याजक
  rationale: Ζεύς यूनानी देवता ज़ीउस का नाम है, इसलिए रोमी समकक्ष नाम नहीं अपनाया गया। “मंदिर का” अगले स्थान-सूचक पदबंध में निहित उपासना-स्थल को स्पष्ट करता है।
- source_word: τοῦ ὄντος πρὸ τῆς πόλεως
  choice: नगर के बाहर स्थित
  rationale: πρὸ τῆς πόλεως का स्थानगत अर्थ नगर के सामने अथवा नगर की सीमा के बाहर है। संदर्भ में यह ज़ीउस के मंदिर या देवस्थान की स्थिति बताता है; शाब्दिक अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: ταύρους
  choice: बैल
  rationale: ταῦρος बलि के संदर्भ में नर गोवंश, अर्थात बैल, को सूचित करता है। हिंदी में “बैल” का यही रूप बहुवचन में भी स्वाभाविक है।
- source_word: στέμματα
  choice: मालाएँ
  rationale: यह बलि-जुलूस में प्रयुक्त मालाओं या हारों को सूचित करता है; “मालाएँ” आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: ἐπὶ τοὺς πυλῶνας
  choice: फाटकों पर
  rationale: पदबंध गति के साथ नगर या परिसर के प्रवेश-द्वारों तक आने को व्यक्त करता है। स्रोत का बहुवचन “फाटकों” में रखा गया है।
- source_word: ἐνέγκας
  choice: लेकर ... आया
  rationale: अओरिस्ट कृदंत मुख्य क्रिया की पृष्ठभूमि में वस्तुओं को वहाँ लाने की क्रिया बताता है; हिंदी में कृदंतीय रचना स्वाभाविक है।
- source_word: σὺν τοῖς ὄχλοις
  choice: भीड़ के साथ
  rationale: यूनानी में व्याकरणिक बहुवचन है, पर आधुनिक हिंदी में सामूहिक अर्थ के लिए “भीड़” अधिक सहज है और लोगों के साथ मिलकर कार्य करने का भाव रखता है।
- source_word: ἤθελεν θύειν
  choice: बलि चढ़ाना चाहता था
  rationale: θέλω के साथ infinitive इच्छा या मंशा व्यक्त करता है, और θύω यहाँ धार्मिक बलिदान चढ़ाने के अर्थ में है।
theological_decisions:
- issue: τοῦ ὄντος πρὸ τῆς πόλεως में निहित संबंध
  choice: इसे नगर के बाहर स्थित ज़ीउस के मंदिर का संकेत मानकर स्पष्ट किया गया है।
  alternative: 'अधिक शाब्दिक रूप: “नगर के सामने स्थित ज़ीउस का याजक।”'
  rationale: यूनानी व्याकरण में पदबंध सीधे ज़ीउस को विशेषित करता दिखाई देता है, किंतु प्राचीन प्रयोग में देवता को उसके देवस्थान की स्थिति से पहचाना जा सकता था। कथा में याजक और बलि का संदर्भ मंदिर/देवस्थान को निहित मानने का समर्थन करता है, फिर भी वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “याजक,” “बलि चढ़ाना” और “फाटक” धार्मिक तथा कथात्मक संदर्भ के अनुकूल हैं।
