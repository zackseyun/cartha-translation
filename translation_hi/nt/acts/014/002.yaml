source:
  edition: SBLGNT
  text: οἱ δὲ ⸀ἀπειθήσαντες Ἰουδαῖοι ἐπήγειραν καὶ ἐκάκωσαν τὰς ψυχὰς τῶν ἐθνῶν κατὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/002.yaml
  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: hi
  text: परन्तु जिन यहूदियों ने विश्वास करने से इनकार किया, उन्होंने गैर-यहूदियों को भड़काया और भाई-बहनों के विरुद्ध उनके मनों में ज़हर भर दिया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्होंने आज्ञा नहीं मानी।” यूनानी शब्द संदेश पर विश्वास न करने और उसे न मानने—दोनों भाव रख सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “भाइयों”; यहाँ सम्भवतः साथी विश्वासियों का पूरा समुदाय अभिप्रेत है, जिसमें स्त्रियाँ भी शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειθήσαντες
  choice: विश्वास करने से इनकार किया
  rationale: प्रेरितों के काम के इस सुसमाचार-प्रचार संबंधी प्रसंग में शब्द संदेश को न मानने का भाव रखता है; ‘इनकार किया’ उसकी इच्छापूर्ण अस्वीकृति को भी बनाए रखता है।
- source_word: Ἰουδαῖοι
  choice: यहूदियों
  rationale: यहाँ संकेत स्थानीय आराधनालय में संदेश का विरोध करने वाले यहूदियों की ओर है, सभी यहूदियों की ओर नहीं; संबंधवाचक वाक्यांश यह सीमा स्पष्ट करता है।
- source_word: ἐπήγειραν
  choice: भड़काया
  rationale: यह विरोधी भावना और कार्रवाई के लिए उकसाने का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: ἐκάκωσαν τὰς ψυχὰς
  choice: उनके मनों में ज़हर भर दिया
  rationale: शाब्दिक ‘प्राणों को बुरा किया’ के बजाय यह मुहावरेदार हिन्दी उनके भीतरी रुझान को दूषित और कटु बनाने का अर्थ व्यक्त करती है।
- source_word: τῶν ἐθνῶν
  choice: गैर-यहूदियों
  rationale: यहूदी और अन्यजातीय लोगों के प्रसंग में ἔθνη का आशय यहूदी न होने वाले लोग हैं; आधुनिक हिन्दी में यह स्पष्ट है।
- source_word: κατὰ τῶν ἀδελφῶν
  choice: भाई-बहनों के विरुद्ध
  rationale: ἀδελφῶν व्याकरणतः पुल्लिंग बहुवचन है, पर आरम्भिक मसीही सामुदायिक प्रयोग में यह सामान्यतः सभी साथी विश्वासियों को समेटता है; हिन्दी में ‘भाई-बहन’ उस सामुदायिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ἀδελφῶν का मिश्रित-लिंग विश्वासी समुदाय के लिए प्रयोग
  choice: भाई-बहनों
  alternative: भाइयों / विश्वासियों
  rationale: यूनानी पुल्लिंग बहुवचन सामूहिक रूप से स्त्री-पुरुष दोनों साथी विश्वासियों का द्योतक हो सकता है। ‘भाई-बहनों’ से सम्भावित समावेशी आशय स्पष्ट होता है, जबकि पादटिप्पणी मूल रूप की जानकारी सुरक्षित रखती है।
- issue: ἀπειθήσαντες में अविश्वास और अवज्ञा का तनाव
  choice: विश्वास करने से इनकार किया
  alternative: अवज्ञाकारी थे / नहीं माने
  rationale: तात्कालिक प्रचार-प्रसंग विश्वास न करने की ओर संकेत करता है, पर क्रिया में जानबूझकर न मानने का भाव भी है; ‘इनकार किया’ दोनों पहलुओं को निकट रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘मनों में ज़हर भर दिया’ स्रोत के मुहावरेदार अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘गैर-यहूदी’ स्पष्ट समकालीन शब्दावली है।
