  source_fidelity: The translation accurately conveys the contrastive δέ, the participial sense of ἀπειθήσαντες in its evangelistic context ('विश्वास करने से इनकार किया'), the local group denoted by Ἰουδαῖοι, the incitement of the Gentiles, and the corrupting/embittering of their inner disposition against the Christian community. 'उनके मनों में ज़हर भर दिया' is a natural Hindi idiom for ἐκάκωσαν τὰς ψυχὰς without importing a technical sense of 'soul.'
