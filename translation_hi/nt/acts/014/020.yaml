source:
  edition: SBLGNT
  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: hi
  text: पर जब चेले उसके चारों ओर इकट्ठे हुए[a], तब वह उठा[b] और नगर में प्रवेश किया। और अगले दिन वह बरनबास के साथ दिरबे के लिए निकल गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चेलों ने उसे चारों ओर से घेर लिया।”
    reason: lexical_alternative
  - marker: b
    text: या, “वह खड़ा हुआ।” यूनानी शब्द का अनुवाद “वह उठा” भी हो सकता है; यहाँ संभवतः पौलुस के शारीरिक रूप से उठने की बात है, न कि स्पष्ट रूप से पुनरुत्थान की।
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: चारों ओर इकट्ठे हो गए
  rationale: क्रिया का मूल भाव किसी के चारों ओर घेरा बनाना है। प्रसंग में चेले शत्रुतापूर्वक घेर नहीं रहे, इसलिए यह स्वाभाविक हिन्दी उस स्थानिक भाव को बनाए रखती है।
- source_word: δὲ
  choice: पर
  rationale: पिछले पद में पौलुस को मरा समझकर छोड़ दिए जाने और अब उसके उठने के बीच हल्का विरोध तथा आश्चर्यजनक घटनाक्रम प्रकट करता है।
- source_word: τῶν μαθητῶν
  choice: चेले
  rationale: प्रेरितों के काम में μαθητής के लिए प्रचलित, सहज और सुसंगत हिन्दी शब्द।
- source_word: ἀναστὰς
  choice: उठकर
  rationale: यहाँ पौलुस की शारीरिक क्रिया व्यक्त होती है; यह अनुवाद पुनरुत्थान का ऐसा स्पष्ट दावा नहीं जोड़ता जो यूनानी पाठ स्वयं नहीं करता।
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: नगर में गया
  rationale: नगर के भीतर जाने की गति को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῇ ἐπαύριον
  choice: अगले दिन
  rationale: कालवाचक पद का सीधा और आधुनिक हिन्दी रूप।
- source_word: ἐξῆλθεν ... εἰς Δέρβην
  choice: दिरबे के लिए निकल गया
  rationale: ἐξέρχομαι के बाहर जाने और उल्लिखित गंतव्य की ओर प्रस्थान करने—दोनों भावों को स्वाभाविक हिन्दी में समेटता है।
- source_word: σὺν τῷ Βαρναβᾷ
  choice: बरनबास के साथ
  rationale: साथ होने या संगति का स्पष्ट और संक्षिप्त रूप।
- source_word: Δέρβην
  choice: दिरबे
  rationale: स्थान-नाम का हिन्दी बाइबलीय लिप्यंतरण।
theological_decisions:
- issue: क्या ἀναστὰς को पुनरुत्थान या चमत्कारिक रूप से जिलाए जाने के संकेत के साथ अनूदित किया जाए
  choice: सामान्य शारीरिक क्रिया के रूप में “उठकर”
  alternative: “जी उठा” या “उठाया गया”
  rationale: यद्यपि पिछले प्रसंग में पौलुस को मरा समझा गया था, इस पद का कर्तृवाचक कृदंत केवल उसके उठने को बताता है। अनुवाद पाठ से आगे बढ़कर पुनरुत्थान या किसी विशेष चमत्कार का दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। “चेले,” “नगर,” और “निकल गया” सामान्य पाठकों के लिए सहज हैं; पादटिप्पणियाँ यूनानी पाठ की वास्तविक शब्दगत संभावनाएँ सुरक्षित रखती हैं।
