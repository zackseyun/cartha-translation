id: ACT.14.15
reference: Acts 14:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: hi
  text: और यह कहते हुए, “भाइयो, आप यह सब क्यों कर रहे हैं? हम भी तुम्हारी ही तरह मनुष्य हैं और तुम्हारे समान मानवीय अनुभवों के अधीन हैं। हम तुम्हें शुभ समाचार सुना रहे हैं कि तुम इन व्यर्थ बातों से मुड़कर उस जीवित परमेश्वर की ओर आओ, जिसने आकाश, पृथ्वी, समुद्र और उन सब में जो कुछ है, बनाया।”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तुम्हारे समान मानवीय अनुभवों के अधीन” का अर्थ है कि पौलुस और बरनबास भी श्रोताओं के समान ही मानव प्रकृति और अनुभव रखते थे।
    reason: lexical_alternative
  - marker: b
    text: “व्यर्थ बातों” से प्रसंग में मूर्तियों समेत निष्फल मूर्तिपूजक आराधना और व्यवहार का संकेत है।
    reason: cultural_note
lexical_decisions:
- source_word: Ἄνδρες
  choice: भाइयो
  rationale: यह पुरुषों के समूह को किया गया प्रत्यक्ष संबोधन है। आधुनिक हिंदी में ‘भाइयो’ स्वाभाविक और सम्मानपूर्ण संबोधन है; इसका आशय पारिवारिक संबंध बताना नहीं है।
- source_word: ὁμοιοπαθεῖς ... ἄνθρωποι
  choice: आपकी ही तरह मनुष्य हैं और उन्हीं मानवीय दशाओं के अधीन हैं
  rationale: यह पौलुस और बरनबास की साझा मानवीय प्रकृति और अनुभव को व्यक्त करता है तथा उन्हें देवता मानने का स्पष्ट खंडन करता है। केवल ‘समान स्वभाव’ हिंदी में अस्पष्ट या नैतिक स्वभाव का संकेत दे सकता था।
- source_word: εὐαγγελιζόμενοι
  choice: शुभ समाचार सुना रहे हैं
  rationale: क्रिया के घोषणात्मक अर्थ को सहज आधुनिक हिंदी में व्यक्त करता है और अनावश्यक पारिभाषिक शब्दावली से बचता है।
- source_word: ματαίων
  choice: व्यर्थ चीज़ों
  rationale: ग्रीक शब्द का अर्थ निष्फल, खोखली या मूल्यहीन वस्तुएँ/व्यवहार है। प्रसंग में मूर्तिपूजक आराधना सम्मिलित है, पर मुख्य पाठ में इसे केवल ‘मूर्तियाँ’ कहना मूल से अधिक संकीर्ण होता।
- source_word: ἐπιστρέφειν ἐπὶ θεὸν ζῶντα
  choice: फिरकर उस जीवित परमेश्वर की ओर आएँ
  rationale: दिशा-परिवर्तन और जीवित परमेश्वर की ओर मुड़ने का भाव स्वाभाविक हिंदी में सुरक्षित रहता है। ‘उस’ से आगे आने वाले संबंधवाचक उपवाक्य से संबंध स्पष्ट होता है।
- source_word: ἐποίησεν
  choice: बनाईं
  rationale: सृष्टि-कार्य के लिए ποιέω का सीधा और सामान्य हिंदी समतुल्य है। क्रिया निकटवर्ती बहुवचन स्त्रीलिंग वस्तुओं के अनुसार रखी गई है।
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς
  choice: आकाश, पृथ्वी, समुद्र और उनमें की सब वस्तुएँ
  rationale: सृष्टि-सूत्र की क्रमबद्धता और बार-बार आए καί को बनाए रखते हुए आधुनिक हिंदी में व्यापक अर्थ व्यक्त किया गया है।
theological_decisions:
- issue: पौलुस और बरनबास की मानवीय स्थिति बनाम उन्हें दिया जा रहा दैवी सम्मान
  choice: हम भी आपकी ही तरह मनुष्य हैं और उन्हीं मानवीय दशाओं के अधीन हैं
  alternative: हम भी आपके समान स्वभाव वाले मनुष्य हैं
  rationale: मुख्य बात साझा मानवता है, न केवल समान भावनाएँ। चुना हुआ पाठ प्रेरितों को देवता मानने का निषेध स्पष्ट करता है, पर मूल से आगे जाकर ‘केवल मनुष्य’ नहीं जोड़ता।
- issue: ‘व्यर्थ चीज़ों’ का दायरा
  choice: मुख्य पाठ में व्यापक ‘व्यर्थ चीज़ों’
  alternative: मूर्तियाँ
  rationale: प्रसंग में बलि, मूर्तियाँ और मूर्तिपूजक आराधना हैं, किंतु ग्रीक में मूर्ति के लिए स्पष्ट संज्ञा नहीं है। व्यापक शब्द मूल की अर्थगत गुंजाइश बचाता है; टिप्पणी प्रसंग स्पष्ट करती है।
- issue: ‘जीवित परमेश्वर’ का विरोधाभास
  choice: जीवित परमेश्वर
  alternative: सच्चे और जीवित परमेश्वर
  rationale: ζῶντα केवल ‘जीवित’ कहता है। ‘सच्चे’ का विचार प्रसंगानुकूल हो सकता है, पर उसे मुख्य पाठ में जोड़ना मूल से आगे जाता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सार्वजनिक वाचन के योग्य रखी गई है। ‘भाइयो’ पुरुषवाचक संबोधन Ἄνδρες को स्वाभाविक हिंदी में दर्शाता है। साझा मानवता को स्पष्ट करने के लिए ὁμοιοπαθεῖς का कुछ विस्तार किया गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
