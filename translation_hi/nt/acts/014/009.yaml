source:
  edition: SBLGNT
  text: οὗτος ⸀ἤκουσεν τοῦ Παύλου λαλοῦντος· ὃς ἀτενίσας αὐτῷ καὶ ἰδὼν ὅτι ⸂ἔχει πίστιν⸃ τοῦ σωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/009.yaml
  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: hi
  text: यह व्यक्ति पौलुस को बोलते हुए सुन रहा था। पौलुस ने उस पर ध्यान से दृष्टि टिकाई और यह देखकर कि उसमें चंगा होने का विश्वास था[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उद्धार पाने का विश्वास था।” यहाँ प्रयुक्त यूनानी क्रिया का अर्थ “बचाना” या “चंगा करना” हो सकता है; इस प्रसंग में शारीरिक चंगाई प्रमुख है।
    reason: σωθῆναι की व्यापक अर्थ-सीमा को सुरक्षित रखते हुए प्रसंगगत चंगाई के अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: οὗτος
  choice: यह व्यक्ति
  rationale: यह संकेतवाचक शब्द पिछले पद में बताए गए जन्म से लँगड़े व्यक्ति की ओर स्पष्ट रूप से संकेत करता है।
- source_word: ἤκουσεν
  choice: सुन रहा था
  rationale: संदर्भ में वह पौलुस के बोलने को ध्यानपूर्वक सुन रहा है; हिन्दी में चल रही परिस्थिति को स्वाभाविक ढंग से व्यक्त करने के लिए यह रूप चुना गया है।
- source_word: τοῦ Παύλου λαλοῦντος
  choice: पौलुस को बोलते हुए
  rationale: सम्बन्धवाचक कृदन्त-रचना को सहज आधुनिक हिन्दी में रखा गया है और सार्वजनिक वचन के लिए गरिमापूर्ण ‘बोलते हुए’ चुना गया है।
- source_word: ἀτενίσας αὐτῷ
  choice: उस पर ध्यान से दृष्टि टिकाई
  rationale: ἀτενίζω एकाग्र और लगातार देखने का भाव देता है; यह अभिव्यक्ति उस तीव्रता को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: ἰδὼν
  choice: यह देखकर
  rationale: मूल के प्रत्यक्ष बोध वाले शब्द को बनाए रखता है, जबकि संदर्भ में परख लेने का भाव भी संभव रहने देता है।
- source_word: ἔχει πίστιν
  choice: उसमें ... विश्वास था
  rationale: πίστις यहाँ विश्वास या भरोसे को व्यक्त करता है, न कि उस व्यक्ति की विश्वासयोग्यता को। हिन्दी वाक्य में काल-सामंजस्य के लिए ‘था’ प्रयुक्त है।
- source_word: τοῦ σωθῆναι
  choice: चंगा होने का
  rationale: σῴζω का मूल अर्थ ‘बचाना/उद्धार देना’ भी है, पर लँगड़े व्यक्ति के तत्काल शारीरिक रूप से स्वस्थ किए जाने के संदर्भ में ‘चंगा होना’ अभिप्रेत अर्थ को स्पष्ट करता है; व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: चंगाई के वृत्तांत में σωθῆναι का अर्थ
  choice: चंगा होने का
  alternative: उद्धार पाने का / बचाए जाने का
  rationale: अगला पद शारीरिक चंगाई को प्रकट करता है, इसलिए मुख्य पाठ में संदर्भगत अर्थ दिया गया है। फिर भी यूनानी क्रिया की व्यापक उद्धार-संबंधी अर्थ-छाया को पादटिप्पणी में रखा गया है, ताकि संभावित धार्मिक तनाव मिटाया न जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। पद मूल वाक्य की निरंतरता के कारण अल्पविराम पर समाप्त होता है। ‘दृष्टि टिकाई’ एकाग्र देखने का भाव देता है और ‘विश्वास’ पारंपरिक तथा सामान्य पाठक दोनों के लिए बोधगम्य है।
