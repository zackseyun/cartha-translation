lexical_decisions:
- source_word: ὡς δὲ ἐγένετο
  choice: जब ... प्रयत्न किया
  rationale: यह पद पिछले वृत्तांत से जुड़ी अगली घटना का समय बताता है। हिंदी में यह संयुक्त रचना स्वाभाविक है और शत्रुतापूर्ण कार्रवाई के आरंभ को व्यक्त करती है।
- source_word: ὁρμὴ
  choice: प्रयत्न[a]
  rationale: यह शब्द तीव्र धावा, हमला या उग्र प्रवृत्ति को सूचित कर सकता है। इसके बाद आए उद्देश्यसूचक क्रियारूपों के कारण ‘प्रयत्न’ यह स्पष्ट करता है कि यहाँ इरादा और आरंभ वर्णित है, कार्रवाई की पूर्णता नहीं।
- source_word: τῶν ἐθνῶν
  choice: गैर-यहूदियों
  rationale: यहूदियों के साथ इसके विरोधात्मक उल्लेख में यह शब्द अन्यजातीय लोगों को दर्शाता है; ‘गैर-यहूदी’ आधुनिक हिंदी में स्पष्ट और सहज है।
- source_word: τε καὶ
  choice: —दोनों
  rationale: यह गैर-यहूदियों और यहूदियों की संयुक्त भागीदारी पर बल देने वाली सहसंबंधी संरचना को व्यक्त करता है।
- source_word: Ἰουδαίων
  choice: यहूदियों
  rationale: इस प्रसंग में इसका आशय यहूदी विरोधियों के समूह से है, न कि अनिवार्य रूप से केवल यहूदिया प्रदेश के निवासियों से।
- source_word: σὺν τοῖς ἄρχουσιν αὐτῶν
  choice: अपने अगुओं के साथ मिलकर
  rationale: ἄρχοντες अधिकार रखने वाले नेतृत्वकर्ताओं को दर्शाता है; ‘अगुए’ सामुदायिक अथवा नागरिक नेतृत्व को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ὑβρίσαι
  choice: उनके साथ दुर्व्यवहार करने
  rationale: यह शब्द अपमानजनक और उद्दंड हिंसक व्यवहार तक का व्यापक अर्थ रखता है; ‘दुर्व्यवहार’ इसे केवल मौखिक अपमान तक सीमित नहीं करता।
- source_word: καὶ λιθοβολῆσαι
  choice: और उन्हें पत्थरवाह करने
  rationale: यह मूल क्रिया को परिणाम जोड़े बिना व्यक्त करता है; ‘मार डालने’ को जोड़ना संभावित घातक मंशा को मूल पाठ से अधिक स्पष्ट कर देता।
- source_word: αὐτούς
  choice: उनके ... उन्हें
  rationale: सर्वनाम निकटवर्ती प्रसंग में पौलुस और बरनबास को सूचित करता है; पद में उनके नाम अनावश्यक रूप से नहीं जोड़े गए।
