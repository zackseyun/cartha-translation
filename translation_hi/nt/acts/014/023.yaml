source:
  edition: SBLGNT
  text: χειροτονήσαντες δὲ αὐτοῖς ⸂κατ’ ἐκκλησίαν πρεσβυτέρους⸃ προσευξάμενοι μετὰ νηστειῶν παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/023.yaml
  text: And after appointing elders for them in every church[a], and praying with fasting, they entrusted them to the Lord[c][b], in whom they had believed.
translation:
  language: hi
  text: और उन्होंने हर कलीसिया के लिए प्राचीनों को नियुक्त किया[a] और उपवास के साथ प्रार्थना करके उन्हें प्रभु को सौंप दिया[b], जिस पर वे विश्वास कर चुके थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर कलीसिया के लिए प्राचीनों को चुना।” यूनानी क्रिया कुछ संदर्भों में हाथ उठाकर चुनने का भाव दे सकती है, लेकिन यहाँ इसका अर्थ केवल नियुक्त करना भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “उन्हें” से आशय सभी विश्वासी हो सकते हैं; यह केवल नए नियुक्त प्राचीनों की ओर भी संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονήσαντες
  choice: नियुक्त किए
  rationale: क्रिया यहाँ अगुवों के चयन और स्थापना को व्यक्त करती है। ‘नियुक्त किए’ मूल अर्थ को स्पष्ट रखता है, पर मतदान या हाथ उठाने की किसी विशेष प्रक्रिया को अनिवार्य नहीं ठहराता।
- source_word: κατ’ ἐκκλησίαν
  choice: हर कलीसिया में
  rationale: κατά का यह वितरणात्मक प्रयोग प्रत्येक स्थानीय सभा की ओर संकेत करता है।
- source_word: πρεσβυτέρους
  choice: प्राचीन
  rationale: इस कलीसियाई संदर्भ में शब्द मान्य अगुवों के पद को सूचित करता है, केवल अधिक आयु के पुरुषों को नहीं। ‘प्राचीन’ हिन्दी बाइबलीय प्रयोग में परिचित पदनाम है।
- source_word: προσευξάμενοι μετὰ νηστειῶν
  choice: उपवास सहित प्रार्थना करके
  rationale: यह नियुक्ति के साथ मुख्य क्रिया से पहले की सहवर्ती क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; बहुवचन νηστειῶν को हिन्दी में सामूहिक अभ्यास ‘उपवास’ से व्यक्त किया गया है।
- source_word: παρέθεντο
  choice: सौंप दिया
  rationale: मध्यवाच्य क्रिया व्यक्तियों को किसी दूसरे की देखभाल में सौंपने का भाव देती है।
- source_word: τῷ κυρίῳ
  choice: उस प्रभु को
  rationale: सम्बन्धवाचक उपवाक्य में उसी प्रभु की ओर स्पष्ट संकेत होने के कारण ‘उस प्रभु को’ हिन्दी में स्वाभाविक है और दत्तिव कारक के अभिप्राय को रखता है।
- source_word: εἰς ὃν πεπιστεύκεισαν
  choice: जिस पर उन्होंने विश्वास किया था
  rationale: πιστεύω εἰς का अर्थ विश्वास को किसी व्यक्ति पर केंद्रित करना है; पूर्णभूतकाल पूर्व में किए गए और बने रहे विश्वास को दर्शाता है।
- source_word: αὐτοῖς ... αὐτοὺς
  choice: उनके लिए ... उन्हें
  rationale: सर्वनामों को सर्वनाम ही रखा गया है। पहला स्थानीय विश्वासियों के लिए प्राचीन नियुक्त किए जाने को बताता है; दूसरे का सटीक संदर्भ संदिग्ध है और पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: χειροτονήσαντες और कलीसियाई शासन-प्रणाली
  choice: प्राचीन नियुक्त किए
  alternative: प्राचीन चुने / हाथ उठाकर प्राचीन चुने
  rationale: शब्द में ऐतिहासिक रूप से हाथ उठाकर चयन का भाव हो सकता है, पर इस प्रसंग में चयन की औपचारिक विधि स्पष्ट नहीं है। ‘नियुक्त किए’ किसी खास सम्प्रदायगत शासन-प्रणाली को पाठ में नहीं जोड़ता।
- issue: παρέθεντο αὐτοὺς में αὐτούς का संदर्भ
  choice: मुख्य पाठ में ‘उन्हें’ रखकर विश्वासियों/कलीसियाओं की ओर स्वाभाविक संकेत
  alternative: केवल नए नियुक्त प्राचीन
  rationale: व्यापक प्रसंग शिष्यों और कलीसियाओं पर केंद्रित है, इसलिए सामूहिक विश्वासी स्वाभाविक संदर्भ हैं; फिर भी निकटवर्ती ‘प्राचीन’ के कारण दूसरा अर्थ सम्भव है, जिसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। ‘कलीसिया’, ‘प्राचीन’ और ‘प्रभु’ परिचित बाइबलीय पद हैं। यूनानी वाक्य के दोनों पूर्वकालिक कृदंतों को ‘नियुक्त किए’ और ‘प्रार्थना करके’ के क्रम में रखा गया है; अनावश्यक अंग्रेज़ी विराम-चिह्न संरचना नहीं अपनाई गई।
