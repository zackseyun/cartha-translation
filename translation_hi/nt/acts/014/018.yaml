translation:
  language: hi
  text: ये बातें कहने पर भी वे भीड़ को उन्हें बलि चढ़ाने से बड़ी कठिनाई से रोक पाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: ये बातें कहकर भी
  rationale: 'यहाँ καί का संदर्भगत बल रियायती है: इतना समझाने के बावजूद परिणाम कठिनाई से मिला। इससे अंग्रेज़ी consultation layer के “Even” और यूनानी वाक्य के आशय दोनों स्वाभाविक हिन्दी में आते हैं।'
- source_word: μόλις κατέπαυσαν
  choice: बड़ी कठिनाई से रोक पाए
  rationale: μόλις केवल ‘मुश्किल से’ नहीं, बल्कि प्रयास के बाद लगभग असफल होते-होते रोकने का भाव देता है; ‘रोक पाए’ उस कठिन उपलब्धि को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τοὺς ὄχλους
  choice: भीड़
  rationale: यूनानी बहुवचन स्थानीय रूप से एकत्र जनसमूह को सूचित करता है; हिन्दी में सामूहिक एकवचन ‘भीड़’ अधिक स्वाभाविक है।
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: कि वह उनके लिए बलि न चढ़ाए
  rationale: निषेधात्मक infinitive construction को रोकने की विषय-वस्तु के रूप में ‘कि…न’ से व्यक्त किया गया है। αὐτοῖς को ‘उनके लिए’ रखा गया है, जो इन व्यक्तियों को बलि अर्पित करने का भाव देता है।
theological_decisions:
- issue: αὐτοῖς का संबंध और बलि का लक्ष्य
  choice: उनके लिए बलि न चढ़ाए
  alternative: उन्हें बलि न चढ़ाए
  rationale: दोनों हिन्दी रूप पौलुस और बरनबास को बलि अर्पित करने का आशय दे सकते हैं। ‘उनके लिए’ मूल के dative को स्पष्ट और सहज रखते हुए यह नहीं कहता कि प्रेरितों ने बलि स्वीकार की; प्रसंग में वे इसे रोक रहे हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बड़ी कठिनाई से रोक पाए’ मूल के μόλις की तीव्रता को सामान्य पाठक के लिए स्पष्ट करता है; कोई अनावश्यक पारिभाषिक या सांप्रदायिक शब्दावली नहीं जोड़ी गई।
