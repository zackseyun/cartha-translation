lexical_decisions:
- source_word: Καί
  choice: और
  rationale: सरल कथात्मक संयोजक के रूप में पिछले प्रसंग से संबंध बनाए रखता है।
- source_word: τις ἀνὴρ
  choice: एक मनुष्य
  rationale: एक विशेष किंतु अनाम व्यक्ति का स्वाभाविक हिन्दी परिचय देता है; ‘कोई एक मनुष्य’ अपेक्षाकृत असहज होता।
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: जिसके पैरों में शक्ति नहीं थी
  rationale: ἀδύνατος के शक्ति-अभाव वाले मूल भाव को सुरक्षित रखता है और इसे अगले χωλός (‘लँगड़ा’) में मिला नहीं देता।
- source_word: ἐν Λύστροις
  choice: लुस्त्रा में
  rationale: स्थान-नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: ἐκάθητο
  choice: बैठा था
  rationale: अपूर्ण भूतकाल की जारी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी में निहित न होने के कारण ‘वहाँ’ नहीं जोड़ा गया।
- source_word: χωλός
  choice: लँगड़ा
  rationale: चलने की जन्मजात अक्षमता के लिए सीधा और सामान्य हिन्दी शब्द है तथा पहले बताए शक्ति-अभाव से अलग वर्णन बनाए रखता है।
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: अपनी माँ के गर्भ से ही
  rationale: स्रोत की सजीव गर्भ-संबंधी अभिव्यक्ति को रखते हुए जन्मजात अवस्था का अर्थ स्पष्ट करता है।
- source_word: οὐδέποτε περιεπάτησεν
  choice: कभी चला नहीं था
  rationale: उस समय तक जीवन भर न चल पाने की पूर्ववर्ती अवस्था को पूर्ण भूतकाल से व्यक्त करता है।
