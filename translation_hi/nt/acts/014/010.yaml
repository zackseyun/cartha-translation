  text: εἶπεν ⸀μεγάλῃ φωνῇ· Ἀνάστηθι ἐπὶ τοὺς πόδας σου ⸀ὀρθός· καὶ ⸀ἥλατο καὶ περιεπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/010.yaml
  text: He said in a loud voice[b][a], “Stand upright on your feet.” And he leaped up and began walking.
translation:
  language: hi
  text: उसने ऊँची आवाज़ में कहा, “अपने पैरों पर सीधे खड़े हो जाओ।” तब वह उछलकर खड़ा हो गया और चलने लगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उछला और चलता रहा।” अन्तिम क्रिया अपूर्ण भूतकाल में है, जो जारी क्रिया या चलने के आरम्भ पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ φωνῇ
  choice: ऊँची आवाज़ में
  rationale: रीति बताने वाला यह दत्तिव वाक्यांश स्वाभाविक आधुनिक हिन्दी में सार्वजनिक और प्रबल स्वर को व्यक्त करता है।
- source_word: Ἀνάστηθι
  choice: खड़े हो जाओ
  rationale: आज्ञार्थक क्रिया यहाँ शरीर को उठाकर खड़े होने की आज्ञा देती है; अगले वाक्यांश के साथ यह हिन्दी में सहज है।
- source_word: ἐπὶ τοὺς πόδας σου ὀρθός
  choice: अपने पैरों पर सीधे
  rationale: यह वाक्यांश अपने पैरों के सहारे सीधी मुद्रा में खड़े होने का स्पष्ट निर्देश देता है।
- source_word: ἥλατο
  choice: उछलकर खड़ा हो गया
  rationale: क्रिया अचानक उछलने का जीवंत भाव रखती है; सन्दर्भ में ‘खड़ा हो गया’ हिन्दी में निहित परिणाम स्पष्ट करता है।
- source_word: περιεπάτει
  choice: चलने लगा
  rationale: अपूर्ण भूतकाल को यहाँ आरम्भिक अर्थ में लेना तत्काल शुरू हुई और आगे जारी चलने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: चंगाई और शारीरिक मुद्रा की आज्ञा
  choice: आज्ञा और उसके तत्काल शारीरिक परिणाम को सीधे वर्णित किया गया है।
  alternative: घटना में अतिरिक्त धार्मिक या मनोवैज्ञानिक व्याख्या जोड़ना।
  rationale: यूनानी पाठ सीधी आज्ञा के बाद दिखाई देने वाली तत्काल प्रतिक्रिया बताता है; अनुवाद इसी ठोस वर्णन को बिना मत-सिद्धान्तगत विस्तार के रखता है।
- issue: περιεπάτει के अपूर्ण भूतकाल का अर्थ
  choice: चलने लगा
  alternative: चलता रहा / चल रहा था
  rationale: सन्दर्भ आरम्भिक अर्थ का समर्थन करता है, पर अपूर्ण भूतकाल में जारी क्रिया का भाव भी सम्भव है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘अपने पैरों पर सीधे खड़े हो जाओ’ स्वाभाविकता के साथ मूल की मुद्रा-संबंधी स्पष्टता बनाए रखता है।
