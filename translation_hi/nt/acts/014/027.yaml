base_translation:
  language: en
  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: hi
  text: जब वे पहुँचे और कलीसिया को इकट्ठा किया, तो उन्होंने बताया कि परमेश्वर ने उनके साथ[a] क्या-क्या किया था और यह कि उसने गैर-यहूदियों के लिए विश्वास का एक द्वार खोल दिया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर ने उनके द्वारा क्या-क्या किया था।” यूनानी में अधिक शाब्दिक अर्थ “उनके साथ” है।
    reason: lexical_alternative
  - marker: b
    text: या, “जातियों के लिए विश्वास का एक द्वार खोल दिया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: जब वे वहाँ पहुँचे
  rationale: अओरिस्ट कृदन्त मुख्य घटना से पहले उनके आगमन को दर्शाता है; यह हिंदी में सहज कालवाचक अभिव्यक्ति है।
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: कलीसिया को इकट्ठा किया
  rationale: यह स्थानीय मसीही सभा को एकत्र करने का संकेत देता है; ‘कलीसिया’ प्रेरितों के काम में ἐκκλησία का प्रचलित और सटीक हिंदी रूप है।
- source_word: ἀνήγγελλον
  choice: उन्होंने बताया
  rationale: अपूर्ण भूतकाल उनके विस्तृत वृत्तांत देने को दर्शाता है; ‘बताया’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: ὅσα
  choice: क्या-क्या
  rationale: यह बहुवचन-सापेक्ष भाव को सहज हिंदी में व्यक्त करता है और उनके द्वारा सुनाए गए समस्त कार्यों को समेटता है।
- source_word: ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: परमेश्वर ने उनके साथ मिलकर क्या-क्या किया था
  rationale: ‘उनके साथ मिलकर’ μετά के मूल ‘साथ’ संबंध को बनाए रखता है और उसे केवल साधनवाचक ‘उनके द्वारा’ में सीमित नहीं करता।
- source_word: ἤνοιξεν
  choice: खोल दिया था
  rationale: रिपोर्ट की जा रही पूर्व-सम्पन्न घटना को हिंदी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῖς ἔθνεσιν
  choice: गैर-यहूदियों के लिए
  rationale: इस प्रसंग में ἔθνη का आशय यहूदी जाति से बाहर के लोगों से है; ‘गैर-यहूदी’ आधुनिक पाठकों के लिए स्पष्ट है।
- source_word: θύραν πίστεως
  choice: विश्वास का द्वार
  rationale: मूल रूपक और संबंधवाचक रचना दोनों सुरक्षित रहते हैं।
- source_word: πίστεως
  choice: विश्वास
  rationale: यहाँ πίστις का आशय विश्वास से है; ‘विश्वास’ स्वाभाविक और धर्मवैचारिक रूप से संयत अनुवाद है।
theological_decisions:
- issue: परमेश्वर के कार्य के संबंध में μετ’ αὐτῶν का अर्थ
  choice: उनके साथ मिलकर
  alternative: उनके द्वारा
  rationale: यह यूनानी पूर्वसर्ग के ‘साथ’ भाव को बनाए रखता है। परमेश्वर मुख्य कर्ता है, जबकि पौलुस और बरनबास उसके कार्य में सहभागी हैं; अनुवाद उनकी भूमिका को अनावश्यक रूप से केवल साधनवाचक नहीं बनाता।
- issue: ἔθνεσιν का अनुवाद
  choice: गैर-यहूदियों
  alternative: जातियों
  rationale: प्रेरितों के काम के इस प्रसंग में यह शब्द भू-राजनीतिक राष्ट्रों के बजाय गैर-यहूदी लोगों को सूचित करता है।
- issue: θύραν πίστεως में संबंध का अर्थ
  choice: विश्वास का द्वार
  alternative: विश्वास के लिए द्वार
  rationale: मुख्य पाठ यूनानी संबंधवाचक पदबंध की वास्तविक व्यापकता बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘कलीसिया’ और ‘विश्वास’ जैसे परिचित बाइबलीय शब्द रखे गए हैं, जबकि ‘गैर-यहूदी’ से प्रसंगगत अर्थ स्पष्ट किया गया है।
