  text: Ἐπῆλθαν δὲ ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι, καὶ πείσαντες τοὺς ὄχλους καὶ λιθάσαντες τὸν Παῦλον ἔσυρον ἔξω τῆς πόλεως, ⸀νομίζοντες αὐτὸν τεθνηκέναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: hi
  text: लेकिन अंताकिया और इकुनियुम से यहूदी आए। भीड़ों को राज़ी करके और पौलुस पर पत्थर मारकर, वे उसे मरा हुआ समझते हुए नगर के बाहर घसीट ले गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह समझकर कि वह मर चुका था।” यूनानी पाठ उनका अनुमान बताता है; वह स्पष्ट रूप से यह नहीं कहता कि पौलुस वास्तव में मर गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπῆλθαν δὲ
  choice: लेकिन ... आए
  rationale: δέ पिछले अनुकूल घटनाक्रम के विपरीत मोड़ दिखाता है; Ἐπῆλθαν विरोधियों के दूसरे नगरों से आने को व्यक्त करता है।
- source_word: ἀπὸ Ἀντιοχείας καὶ Ἰκονίου
  choice: अन्ताकिया और इकुनियुम से
  rationale: दोनों स्थान-नामों और ἀπό के उद्गम-संबंध को सीधे और स्वाभाविक ढंग से रखा गया है।
- source_word: Ἰουδαῖοι
  choice: कुछ यहूदी
  rationale: संज्ञा अनिर्दिष्ट व्यक्तियों के एक समूह को बताती है; हिन्दी में “कुछ” जोड़ने से यह स्पष्ट रहता है कि कथन सभी यहूदियों के विषय में नहीं है।
- source_word: πείσαντες τοὺς ὄχλους
  choice: उन्होंने भीड़ों को अपने पक्ष में कर लिया
  rationale: πείθω यहाँ लोगों को राजी करके विरोधियों की ओर मोड़ने का भाव रखता है; ὄχλους का बहुवचन “भीड़ों” में सुरक्षित है।
- source_word: λιθάσαντες τὸν Παῦλον
  choice: पौलुस को पत्थरवाह किया
  rationale: क्रिया जान से मारने के उद्देश्य से पत्थर मारने की संगठित कार्रवाई बताती है; “पत्थरवाह किया” संक्षिप्त और सटीक है।
- source_word: ἔσυρον ἔξω τῆς πόλεως
  choice: घसीटते हुए नगर के बाहर ले गए
  rationale: ἔσυρον का अपूर्ण भूतकाल जारी हिंसक क्रिया को चित्रित करता है; हिन्दी वाक्यांश गंतव्य भी स्पष्ट करता है।
- source_word: νομίζοντες αὐτὸν τεθνηκέναι
  choice: उसे मरा हुआ समझकर
  rationale: νομίζοντες इसे आक्रमणकारियों की धारणा के रूप में रखता है, जबकि पूर्ण infinitive मृत्यु के परिणामस्वरूप अवस्था को व्यक्त करता है।
theological_decisions:
- issue: क्या पौलुस वास्तव में मर गया था या आक्रमणकारियों ने केवल ऐसा समझा
  choice: 'मुख्य पाठ केवल उनकी धारणा बताता है: “उसे मरा हुआ समझकर।”'
  alternative: कुछ व्याख्याकार मानते हैं कि पौलुस सचमुच मर गया और बाद में जीवित हुआ।
  rationale: यूनानी पाठ νομίζοντες के द्वारा स्पष्ट रूप से आक्रमणकारियों का अनुमान बताता है; वह पौलुस की वास्तविक मृत्यु को स्वतंत्र कथन के रूप में घोषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण कथात्मक शैली अपनाई गई है। हिंसा और क्रियाओं का क्रम स्पष्ट रखने के लिए यूनानी participial श्रृंखला को छोटे वाक्यों में बाँटा गया है। स्थान-नाम प्रचलित हिन्दी बाइबलीय रूपों में दिए गए हैं।
