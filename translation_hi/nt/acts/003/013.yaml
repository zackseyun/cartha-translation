source:
  edition: SBLGNT
  text: ὁ θεὸς Ἀβραὰμ καὶ ⸂Ἰσαὰκ καὶ⸃ Ἰακώβ, ὁ θεὸς τῶν πατέρων ἡμῶν, ἐδόξασεν τὸν παῖδα αὐτοῦ Ἰησοῦν, ὃν ὑμεῖς ⸀μὲν παρεδώκατε καὶ ⸀ἠρνήσασθε κατὰ πρόσωπον Πιλάτου, κρίναντος ἐκείνου ἀπολύειν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/013.yaml
  text: The God of Abraham and Isaac and Jacob[a], the God of our fathers, has glorified his servant Jesus, whom you handed over and denied before Pilate, when he had decided to release him.
translation:
  language: hi
  text: अब्राहम और इसहाक और याकूब के परमेश्वर, हमारे पूर्वजों के परमेश्वर ने अपने सेवक[a] यीशु को महिमा दी है, जिसे तुमने पिलातुस के सामने सौंप दिया और अस्वीकार कर दिया, जबकि उसने उसे रिहा करने का निर्णय किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने बालक यीशु।” यूनानी शब्द παῖς का अर्थ “बालक” या “सेवक” हो सकता है। यहाँ यशायाह में वर्णित प्रभु के सेवक की संभावित प्रतिध्वनि के कारण “सेवक” को मुख्य पाठ में रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: अब्राहम और इसहाक और याकूब के परमेश्वर
  rationale: निर्गमन 3:6 की वाचा-संबंधी अभिव्यक्ति को सुरक्षित रखते हुए यूनानी में आए प्रत्येक καὶ को “और” से व्यक्त किया गया है।
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: हमारे पूर्वजों के परमेश्वर
  rationale: “पूर्वज” आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है तथा यहाँ πατέρων के सामूहिक, वंशगत अर्थ को व्यक्त करता है; “पितरों” से उत्पन्न संभावित धार्मिक-सांस्कृतिक भ्रम से भी बचता है।
- source_word: ἐδόξασεν
  choice: महिमा दी है
  rationale: यह δοξάζω का स्वाभाविक और धर्मवैचारिक भार बनाए रखने वाला हिन्दी रूप है। पूर्णतासूचक “दी है” परमेश्वर के किए कार्य के वर्तमान महत्व को व्यक्त करता है, यद्यपि यूनानी अओरिस्ट स्वयं हिन्दी काल का यह रूप अनिवार्य नहीं करता।
- source_word: τὸν παῖδα αὐτοῦ Ἰησοῦν
  choice: अपने सेवक यीशु
  rationale: παῖς का अर्थ “सेवक” या “बालक” हो सकता है। यहाँ यशायाह के प्रभु के सेवक की संभावित प्रतिध्वनि के कारण “सेवक” मुख्य पाठ में उपयुक्त है, जबकि वास्तविक शब्दार्थगत अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: παρεδώκατε
  choice: सौंप दिया
  rationale: यह न्यायिक अधिकारियों के हवाले किए जाने का स्वाभाविक हिन्दी वर्णन है; “विश्वासघात किया” प्रसंग से अधिक अर्थ जोड़ देता।
- source_word: ἠρνήσασθε
  choice: नकार दिया
  rationale: यह ἀρνέομαι का सीधा और आधुनिक हिन्दी में सहज रूप है तथा यीशु को सार्वजनिक रूप से अस्वीकार करने का भाव रखता है।
- source_word: κατὰ πρόσωπον Πιλάτου
  choice: पिलातुस के सामने
  rationale: शाब्दिक रूप से “पिलातुस के मुख के सामने” आने वाले यूनानी मुहावरे को स्वाभाविक हिन्दी में सार्वजनिक और प्रत्यक्ष उपस्थिति के अर्थ सहित व्यक्त करता है।
- source_word: κρίναντος ἐκείνου ἀπολύειν
  choice: जबकि पिलातुस ने उसे छोड़ देने का निर्णय कर लिया था
  rationale: कृदंत रचना को प्रसंग में निहित समय और विरोध दोनों के साथ व्यक्त किया गया है। संज्ञा “पिलातुस” दोहराने से हिन्दी में सर्वनाम का संदर्भ स्पष्ट रहता है।
theological_decisions:
- issue: यीशु के लिए παῖς का अनुवाद
  choice: सेवक
  alternative: बालक
  rationale: यशायाह के सेवक-विषयक पाठों की संभावित अंतर्पाठीय प्रतिध्वनि “सेवक” के पक्ष में है। फिर भी παῖς में “बालक” का अर्थ भी संभव है, इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है और इसे पुत्रत्व की किसी अलग शब्दावली से नहीं मिलाया गया।
- issue: ἐδόξασεν का हिन्दी काल-पक्ष
  choice: महिमा दी है
  alternative: महिमा दी
  rationale: यूनानी अओरिस्ट केवल पूर्ण भूतकाल की हिन्दी अभिव्यक्ति को बाध्य नहीं करता। “दी है” परमेश्वर के कार्य की वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में सामने लाता है, बिना कोई अतिरिक्त धर्मसैद्धांतिक दावा जोड़े।
- issue: κρίναντος के संबंध का प्रस्तुतीकरण
  choice: जबकि
  alternative: जब
  rationale: कृदंत का मूल समयगत संबंध बना रहता है, पर प्रसंग में श्रोताओं के नकारने और पिलातुस के छोड़ने के निर्णय के बीच स्पष्ट विरोध भी है। “जबकि” इस तनाव को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाचा-संबंधी आरंभिक सूत्र में बार-बार आए “और” को जानबूझकर बनाए रखा गया है। “पूर्वज” को “पितरों” की अपेक्षा अधिक स्पष्ट आधुनिक विकल्प माना गया है; “महिमा दी है” पारंपरिक धार्मिक अर्थ और सहज हिन्दी के बीच संतुलन रखता है।
