source:
  edition: SBLGNT
  text: ⸂Πέτρος δὲ⸃ καὶ Ἰωάννης ἀνέβαινον εἰς τὸ ἱερὸν ἐπὶ τὴν ὥραν τῆς προσευχῆς τὴν ἐνάτην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/001.yaml
  text: Peter and John were going up to the temple at the hour of prayer[a], the ninth hour.
translation:
  language: hi
  text: पतरस और यूहन्ना प्रार्थना के समय, अर्थात् नौवें घंटे[a], मन्दिर जा रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् आज की समय-गणना के अनुसार लगभग दोपहर के तीन बजे।
    reason: cultural_note
lexical_decisions:
- source_word: ⸂Πέτρος δὲ⸃ καὶ Ἰωάννης
  choice: पतरस और यूहन्ना
  rationale: δέ हल्का कथात्मक संयोजक है; आधुनिक हिन्दी में अलग ‘अब’ या ‘परन्तु’ जोड़ना अनावश्यक और अर्थ की दृष्टि से अधिक स्पष्ट होगा। καί को स्वाभाविक रूप से ‘और’ कहा गया है।
- source_word: ἀνέβαινον
  choice: जा रहे थे
  rationale: अपूर्ण भूतकाल क्रिया की जारी अवस्था को ‘जा रहे थे’ व्यक्त करता है। यूनानी में निहित ‘ऊपर जाने’ का भाव हिन्दी में मन्दिर जाने के इस प्रसंग में ‘जा रहे थे’ से अधिक स्वाभाविक ढंग से आता है; ‘ऊपर जा रहे थे’ यहाँ स्थानिक भ्रम पैदा कर सकता है।
- source_word: εἰς τὸ ἱερὸν
  choice: मन्दिर
  rationale: ἱερόν पूरे मन्दिर-परिसर को सूचित करता है, न कि केवल भीतरी पवित्रस्थान को। मुख्य पाठ में प्रचलित ‘मन्दिर’ सहज है।
- source_word: ἐπὶ τὴν ὥραν τῆς προσευχῆς
  choice: प्रार्थना के समय
  rationale: यह निर्धारित प्रार्थना-समय को दर्शाने वाला स्वाभाविक हिन्दी प्रयोग है और यूनानी संबंध को स्पष्ट रखता है।
- source_word: τὴν ἐνάτην
  choice: अर्थात् नौवें घंटे
  rationale: मूल यहूदी-रोमी समय-गणना को मुख्य पाठ में सुरक्षित रखा गया है। ‘अर्थात्’ इसे पहले आए प्रार्थना के समय की पहचान के रूप में स्पष्ट करता है; आधुनिक समय फुटनोट में दिया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘मन्दिर’ की पारंपरिक वर्तनी अपनाई गई है। वाक्य-विन्यास हिन्दी के स्वाभाविक क्रम में है, जबकि जारी क्रिया और प्राचीन समय-गणना सुरक्षित रखी गई है।
