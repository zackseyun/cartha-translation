source:
  edition: SBLGNT
  text: καί τις ἀνὴρ χωλὸς ἐκ κοιλίας μητρὸς αὐτοῦ ὑπάρχων ἐβαστάζετο, ὃν ἐτίθουν καθ’ ἡμέραν πρὸς τὴν θύραν τοῦ ἱεροῦ τὴν λεγομένην Ὡραίαν τοῦ αἰτεῖν ἐλεημοσύνην παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/002.yaml
  text: And a certain man[a], lame from his mother’s womb, was being carried, whom they would place every day at the gate of the temple called Beautiful, to ask for alms from those entering into the temple[c][b],
translation:
  language: hi
  text: एक मनुष्य, जो अपनी माँ के गर्भ से ही लँगड़ा था,[b] उठाकर ले जाया जाता था। लोग उसे हर दिन मंदिर-परिसर[a] के उस द्वार पर बैठा देते थे, जो ‘सुंदर’ कहलाता था,[c] ताकि वह मंदिर-परिसर में प्रवेश करने वालों से दान माँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी ἱερόν से आशय पूरे मंदिर-परिसर से है, केवल भीतरी पवित्र भवन से नहीं।
    reason: cultural_note
  - marker: b
    text: अर्थात ‘जन्म से ही’।
    reason: lexical_alternative
  - marker: c
    text: द्वार के नाम का शाब्दिक अर्थ ‘सुंदर’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τις ἀνὴρ
  choice: एक मनुष्य
  rationale: यह पदबंध किसी अनिश्चित, परंतु विशेष व्यक्ति का परिचय देता है। ‘एक मनुष्य’ कथा की विशिष्टता और ἀνήρ का अर्थ दोनों बनाए रखता है।
- source_word: χωλὸς
  choice: लँगड़ा
  rationale: यह चलने में जन्म से चली आ रही शारीरिक असमर्थता का सीधा और सामान्य हिंदी वर्णन है; अधिक कठोर या अत्यधिक चिकित्सकीय शब्दावली से बचा गया है।
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: अपनी माँ के गर्भ से ही
  rationale: यह मूल की गर्भ-संबंधी छवि को बनाए रखता है और हिंदी में स्वाभाविक ढंग से जन्म से विद्यमान दशा व्यक्त करता है।
- source_word: ἐβαστάζετο
  choice: उठाकर ले जाया जा रहा था
  rationale: अपूर्ण भूतकाल और कर्मवाच्य को रखते हुए किसी के द्वारा उसे लगातार ले जाए जाने का भाव स्पष्ट किया गया है।
- source_word: ἐτίθουν
  choice: बिठा देते थे
  rationale: अपूर्ण भूतकाल की प्रतिदिन दोहराई जाने वाली क्रिया को स्वाभाविक हिंदी में व्यक्त करता है। संदर्भ में द्वार के पास भीख माँगने के लिए रखे जाने का व्यावहारिक अर्थ बैठाना है।
- source_word: καθ’ ἡμέραν
  choice: प्रतिदिन
  rationale: वितरणात्मक अर्थ को संक्षिप्त, स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: θύραν τοῦ ἱεροῦ
  choice: मंदिर के उस द्वार
  rationale: सार्वजनिक स्थापत्य के संदर्भ में θύρα के लिए ‘द्वार’ उपयुक्त है। ἱερόν के व्यापक परिसर-संबंधी अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: τὴν λεγομένην Ὡραίαν
  choice: जो ‘सुंदर’ कहलाता था
  rationale: मूल विशेषण को द्वार के नाम के रूप में रखते हुए उसका शाब्दिक अर्थ भी सुरक्षित किया गया है।
- source_word: τοῦ αἰτεῖν ἐλεημοσύνην
  choice: ताकि वह … भीख माँगे
  rationale: उद्देश्यसूचक infinitive को ‘ताकि’ से स्पष्ट किया गया है और ἐλεημοσύνη के ऐतिहासिक-सामाजिक अर्थ के लिए सामान्य हिंदी ‘भीख’ चुना गया है।
- source_word: παρὰ τῶν εἰσπορευομένων εἰς τὸ ἱερόν
  choice: मंदिर में प्रवेश करने वालों से
  rationale: प्रवेश की प्रक्रिया में लगे लोगों और उनसे माँगने—दोनों संबंधों को सहज हिंदी में सुरक्षित रखता है।
