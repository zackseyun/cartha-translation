  text: ἔσται δὲ πᾶσα ψυχὴ ἥτις ⸀ἂν μὴ ἀκούσῃ τοῦ προφήτου ἐκείνου ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/023.yaml
  text: And every person who does not listen to that prophet will be utterly destroyed from among the people[a].
translation:
  language: hi
  text: और ऐसा होगा कि जो कोई उस भविष्यद्वक्ता की न सुनेगा, वह लोगों के बीच से पूरी तरह नष्ट कर दिया जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह लोगों के बीच से काटकर अलग कर दिया जाएगा।”
    reason: ἐξολεθρευθήσεται के विनाशकारी बल के साथ पुराने नियम की पृष्ठभूमि में समुदाय से ‘काट दिए जाने’ का वैकल्पिक भाव भी संभव है।
lexical_decisions:
- source_word: πᾶσα ψυχὴ
  choice: जो कोई
  rationale: शाब्दिक अर्थ ‘हर प्राण’ है, पर इस यूनानी मुहावरे में ψυχή किसी व्यक्ति को दर्शाता है। ‘जो कोई’ अगले संबंधवाचक वाक्य के साथ स्वाभाविक आधुनिक हिन्दी में सार्वभौमिक अर्थ व्यक्त करता है और मनुष्य की संरचना के बारे में अनावश्यक दार्शनिक संकेत नहीं देता।
- source_word: ἥτις ἂν μὴ ἀκούσῃ
  choice: जो कोई ... न सुनेगा
  rationale: ἥτις ἂν तथा विधिलिंग अनिश्चित संबंधवाचक अर्थ, ‘जो कोई,’ देते हैं। ἀκούω यहाँ केवल ध्वनि सुनने के बजाय ध्यान देकर मानने का भाव रख सकता है; हिन्दी ‘की सुनना’ इसी उत्तरदायी श्रवण का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῦ προφήτου ἐκείνου
  choice: उस भविष्यद्वक्ता की
  rationale: यह पिछले पद में मूसा के समान आनेवाले विशिष्ट भविष्यद्वक्ता की ओर संकेत करता है। ‘उस’ संकेतवाचक बल बनाए रखता है; कोई अतिरिक्त औपचारिक मसीही उपाधि आरोपित नहीं की गई।
- source_word: ἐξολεθρευθήσεται
  choice: पूरी तरह नष्ट कर दिया जाएगा
  rationale: ἐξολεθρεύω साधारण विनाश से अधिक, पूर्ण उन्मूलन या हटा दिए जाने का प्रबल भाव देता है। कर्मवाच्य हिन्दी यूनानी कर्मवाच्य को सुरक्षित रखती है और कर्ता को स्पष्ट रूप से जोड़ती नहीं।
- source_word: ἐκ τοῦ λαοῦ
  choice: लोगों के बीच से
  rationale: ἐκ समुदाय के भीतर से हटाए जाने का भाव देता है। ‘लोगों के बीच से’ इस सामुदायिक अर्थ को रखता है और यूनानी में अनुपस्थित ‘उसके’ जैसे संबंधसूचक शब्द को नहीं जोड़ता।
theological_decisions:
- issue: घोषित न्याय का स्वरूप
  choice: विनाश और समुदाय के बीच से हटाए जाने की गंभीर भाषा को रखा गया, पर न्याय के समय या प्रकार को निश्चित नहीं किया गया।
  alternative: इसे केवल वाचा-समुदाय से बहिष्कार अथवा केवल अंतिम ईश्वरीय न्याय के रूप में स्पष्ट करना।
  rationale: पद कठोर दैवी न्याय घोषित करता है, किंतु स्वयं यह नहीं बताता कि वह लौकिक, सामुदायिक या अंतिम न्याय है। अनुवाद इस धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भविष्यद्वक्ता की सुनना’ हिन्दी का स्वाभाविक मुहावरा है, जो केवल सुनने और आज्ञापूर्वक ध्यान देने—दोनों भावों को समेटता है।
