base_translation:
  language: en
  yaml_path: translation/nt/acts/003/004.yaml
  text: And Peter[a], together with John, fixed his gaze on him and said, “Look at us.”
translation:
  language: hi
  text: और पतरस ने यूहन्ना के साथ उस पर दृष्टि गड़ाकर कहा, “हमारी ओर देखो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀτενίσας
  choice: ध्यान से दृष्टि टिकाई
  rationale: यह कृदंत साधारणतः देखने के बजाय एकाग्र और लगातार दृष्टि लगाने का भाव व्यक्त करता है; यह हिंदी प्रयोग उस तीव्रता को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है। ‘तब’ प्रसंग का क्रम स्वाभाविक रूप से दिखाता है और अनावश्यक विरोध का भाव नहीं लाता।
- source_word: σὺν τῷ Ἰωάννῃ
  choice: यूहन्ना के साथ
  rationale: σύν के साथ संबंध और सहभागिता का सीधा अर्थ व्यक्त किया गया है।
- source_word: εἶπεν
  choice: कहा
  rationale: इस प्रसंग में λέγω बोलने की सामान्य क्रिया है; ‘कहा’ इसका सीधा और स्वाभाविक हिंदी रूप है।
- source_word: Βλέψον
  choice: देखो
  rationale: एकवचन आज्ञार्थक रूप सामने वाले व्यक्ति को सीधा आदेश देता है; ‘देखो’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: εἰς ἡμᾶς
  choice: हमारी ओर
  rationale: देखने की क्रिया के साथ εἰς लक्ष्य की ओर निर्देशित ध्यान बताता है; हिंदी में ‘हमारी ओर देखो’ स्वाभाविक है।
- source_word: εἰς αὐτόν
  choice: उस पर
  rationale: ἀτενίζω के साथ εἰς उस व्यक्ति को केंद्रित दृष्टि का लक्ष्य बनाता है; ‘उस पर दृष्टि टिकाई’ इस दिशा और एकाग्रता को व्यक्त करता है।
- source_word: Πέτρος
  choice: पतरस
  rationale: नए नियम के इस यूनानी नाम का प्रचलित और स्पष्ट हिंदी रूप ‘पतरस’ रखा गया है।
- source_word: Ἰωάννῃ
  choice: यूहन्ना
  rationale: नए नियम के इस यूनानी नाम का प्रचलित हिंदी रूप ‘यूहन्ना’ रखा गया है।
