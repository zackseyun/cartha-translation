  text: Κρατοῦντος δὲ ⸀αὐτοῦ τὸν Πέτρον καὶ ⸀τὸν Ἰωάννην συνέδραμεν ⸂πᾶς ὁ λαὸς πρὸς αὐτοὺς⸃ ἐπὶ τῇ στοᾷ τῇ καλουμένῃ Σολομῶντος ἔκθαμβοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/011.yaml
  text: While he was holding on to Peter and John[a], all the people, utterly astonished[b], ran together to them at the portico called Solomon’s.
translation:
  language: hi
  text: जब वह पतरस और यूहन्ना को पकड़े हुए था[a], तो सारे लोग अत्यन्त चकित होकर उनके पास उस बरामदे में दौड़े आए, जो सुलैमान का बरामदा कहलाता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पतरस और यूहन्ना से लिपटा हुआ था।’ यूनानी क्रिया कसकर पकड़ने या थामे रहने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘बरामदा’ मंदिर-परिसर में छत से ढके स्तंभों वाले मार्ग या मंडप को दर्शाता है, जिसे परंपरागत रूप से सुलैमान का बरामदा कहा जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: Κρατοῦντος δὲ αὐτοῦ
  choice: जब वह ... को पकड़े हुए था
  rationale: वर्तमान कृदन्त के साथ संबंधकारक निरपेक्ष रचना मुख्य घटना के साथ-साथ चल रही क्रिया बताती है। κρατέω यहाँ थामे रहने या कसकर पकड़े रहने का भाव देता है; ‘पकड़े हुए था’ स्वाभाविक है और उसके मनोभाव को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τὸν Πέτρον καὶ τὸν Ἰωάννην
  choice: पतरस और यूहन्ना
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और पाठकों के लिए परिचित नाम-रूप।
- source_word: συνέδραμεν
  choice: दौड़े आए
  rationale: συντρέχω तेज़ी से एक साथ किसी ओर दौड़कर जुटने का बोध कराता है। बहुवचन कर्ता ‘सारे लोग’ सामूहिकता स्पष्ट करता है, इसलिए हिन्दी में ‘दौड़े आए’ स्वाभाविक और अर्थपूर्ण है।
- source_word: πᾶς ὁ λαὸς
  choice: सारे लोग
  rationale: यह यूनानी पद मंदिर में उपस्थित समूचे जनसमूह की ओर संकेत करता है। ‘सारे लोग’ निकट, सहज और किसी अधिक संकीर्ण पहचान को आरोपित न करने वाला अनुवाद है।
- source_word: πρὸς αὐτούς
  choice: उनके पास
  rationale: πρός के साथ कर्मकारक यहाँ व्यक्तियों की ओर गति बताता है; हिन्दी में ‘उनके पास’ यही दिशा स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπὶ τῇ στοᾷ
  choice: उस बरामदे में
  rationale: στοά छतदार स्तंभ-मंडप या बरामदे को दर्शाता है। मंदिर-परिसर के संदर्भ में ‘बरामदा’ सामान्य हिन्दी पाठक के लिए स्पष्ट है; हिन्दी स्थान-प्रयोग में ‘में’ स्वाभाविक है।
- source_word: τῇ καλουμένῃ Σολομῶντος
  choice: जो सुलैमान का बरामदा कहलाता था
  rationale: καλουμένῃ नाम या प्रचलित पदवी को दर्शाता है। हिन्दी में संज्ञा को दोहराने से स्थान-नाम स्पष्ट रहता है और वाक्य सहज बनता है।
- source_word: ἔκθαμβοι
  choice: अत्यन्त चकित होकर
  rationale: ἔκθαμβος तीव्र विस्मय का भाव रखता है। यूनानी में यह लोगों की अवस्था बताता है; हिन्दी में क्रियाविशेषणीय ‘अत्यन्त चकित होकर’ उसी तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
