source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς ἃ προκατήγγειλεν διὰ στόματος πάντων τῶν ⸀προφητῶν παθεῖν τὸν χριστὸν ⸀αὐτοῦ ἐπλήρωσεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/018.yaml
  text: But God thus fulfilled what he had announced beforehand through the mouth of all the prophets[b][a], that his Messiah would suffer.
translation:
  language: hi
  text: परन्तु परमेश्वर ने इस प्रकार उस बात को पूरा किया, जिसकी घोषणा उसने पहले ही सभी भविष्यद्वक्ताओं के मुख से की थी[a]—कि उसका मसीह दुःख उठाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभी भविष्यद्वक्ताओं के द्वारा।” यूनानी में शाब्दिक रूप से “सभी भविष्यद्वक्ताओं के मुख से” है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “उसका ख्रीस्त,” अर्थात “उसका अभिषिक्त जन”; यहाँ Χριστός एक उपाधि के रूप में प्रयुक्त है, इसलिए इसका अनुवाद “मसीह” किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: परन्तु
  rationale: पिछले पद में लोगों के किए हुए कार्य और अब बताए जा रहे परमेश्वर के कार्य के बीच विरोध को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: προκατήγγειλεν
  choice: जिसकी घोषणा उसने पहले ही ... की थी
  rationale: क्रिया में निहित पूर्व-घोषणा और सार्वजनिक कथन, दोनों भावों को स्पष्ट रखता है।
- source_word: διὰ στόματος πάντων τῶν προφητῶν
  choice: सभी भविष्यद्वक्ताओं के मुख से
  rationale: मूल यूनानी के ठोस बाइबलीय मुहावरे को बनाए रखता है और आधुनिक हिन्दी में समझने योग्य है।
- source_word: παθεῖν
  choice: दुःख उठाएगा
  rationale: अनन्त क्रिया को पहले की गई घोषणा की विषय-वस्तु के रूप में स्वाभाविक हिन्दी में प्रस्तुत करता है; इसमें ‘अवश्य’ जोड़कर आवश्यकता का भाव अधिक स्पष्ट नहीं किया गया।
- source_word: τὸν χριστὸν αὐτοῦ
  choice: उसका मसीह
  rationale: Χριστός यहाँ उपाधि है; ‘मसीह’ यहूदी मसीही संदर्भ और αὐτοῦ के संबंधसूचक अर्थ को सुरक्षित रखता है।
- source_word: ἐπλήρωσεν
  choice: पूरी की
  rationale: भविष्यद्वाणी की पूर्ति के संदर्भ में सहज आधुनिक हिन्दी है और पूर्ण किए जाने का भाव स्पष्ट रखता है।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह बताता है कि परमेश्वर ने पहले घोषित बात को इसी रीति से, अर्थात मसीह के दुःख उठाने की घटना द्वारा, पूरा किया।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट / अभिषिक्त जन
  rationale: यहाँ शब्द व्यक्तिगत नाम से अधिक एक उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उस अर्थ और पतरस के यहूदी संदर्भ को स्वाभाविक रूप से सुरक्षित रखता है।
- issue: παθεῖν में निहित भाव
  choice: कि उसका मसीह दुःख उठाएगा
  alternative: कि उसके मसीह को दुःख उठाना ही था
  rationale: चुना गया रूप भविष्यद्वाणी की विषय-वस्तु बताता है, पर मूल अनन्त क्रिया में स्पष्ट न किए गए अनिवार्यता के भाव को नहीं जोड़ता।
- issue: οὕτως का संबंध
  choice: पूर्ति की रीति के साथ—‘इस प्रकार ... पूरी की’
  alternative: अगले कथन के साथ—‘इस प्रकार दुःख उठाएगा’
  rationale: शब्द-क्रम और वाक्य के समग्र अर्थ के अनुसार इसे ἐπλήρωσεν के साथ जोड़ना अधिक स्वाभाविक है, जबकि मूल की संक्षिप्तता को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी में; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘मुख से’ मूल बाइबलीय मुहावरे को सुरक्षित रखता है, और डैश घोषणा की विषय-वस्तु को स्पष्ट करता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
