  text: μετανοήσατε οὖν καὶ ἐπιστρέψατε ⸀πρὸς τὸ ἐξαλειφθῆναι ὑμῶν τὰς ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/019.yaml
  text: Therefore repent and turn back[a], so that your sins may be wiped away,
translation:
  language: hi
  text: इसलिए पश्चाताप करो और लौट आओ, ताकि तुम्हारे पाप मिटा दिए जाएँ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पोंछ दिए जाएँ।”
    reason: ἐξαλείφω के ‘पोंछकर हटाने/मिटाने’ वाले चित्रात्मक अर्थ का वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: μετανοήσατε
  choice: पश्चाताप करो
  rationale: यह अओरिस्ट सक्रिय आज्ञार्थक निर्णायक मन-परिवर्तन और पाप से विमुख होने का आह्वान करता है। ‘पश्चाताप करो’ आधुनिक हिन्दी में इसका नैतिक और वाचा-संबंधी भार बनाए रखता है तथा अगले क्रियापद की पुनरावृत्ति नहीं करता।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἐπιστρέψατε
  choice: लौट आओ
  rationale: सक्रिय आज्ञार्थक का लौटने वाला दिशात्मक भाव सुरक्षित रहता है। ‘मन फिराओ’ कहने से पहले क्रियापद के साथ अनावश्यक अर्थ-समानता होती, और ‘परिवर्तित हो जाओ’ सक्रिय रूप को धुँधला कर सकता था। परमेश्वर की ओर लौटना संदर्भ में निहित है, पर मूल वाक्य में कर्म नहीं है, इसलिए उसे मुख्य पाठ में जोड़ा नहीं गया।
- source_word: πρὸς τὸ ἐξαλειφθῆναι
  choice: ताकि ... मिटा दिए जाएँ
  rationale: सव्यय आर्टिक्युलर इनफिनिटिव के उद्देश्य/परिणाम-संबंध को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना उसे केवल कारणात्मक संबंध बना देने के।
- source_word: ἐξαλειφθῆναι
  choice: मिटा दिए जाएँ
  rationale: निष्क्रिय रूप और पूर्ण निष्कासन की छवि दोनों बने रहते हैं। अधिक चित्रात्मक ‘पोंछकर मिटा दिए जाएँ’ को पादटिप्पणी में रखा गया है।
- source_word: ἁμαρτίας
  choice: पाप
  rationale: बहुवचन यूनानी संज्ञा के लिए हिन्दी में सामूहिक रूप ‘तुम्हारे पाप’ सीधा, स्वाभाविक और पर्याप्त व्यापक है।
theological_decisions:
- issue: पश्चाताप तथा लौटने का पापों के मिटाए जाने से संबंध
  choice: उद्देश्य/परिणाम के रूप में ‘ताकि तुम्हारे पाप मिटा दिए जाएँ’
  alternative: 'अधिक कारणात्मक रूप: ‘तुम्हारे पापों के मिटाए जाने के लिए’'
  rationale: पद आज्ञापित प्रत्युत्तर को पापों के हटाए जाने से जोड़ता है, पर उद्धार-क्रम की विस्तृत doctrinal व्यवस्था नहीं बताता। ‘ताकि’ इस संबंध और उसकी वास्तविक धार्मिक गंभीरता को सुरक्षित रखता है, बिना किसी संप्रदायगत तंत्र को आरोपित किए।
- issue: ἐπιστρέψατε में लौटने का लक्ष्य
  choice: मुख्य पाठ में कर्मरहित ‘लौट आओ’
  alternative: ‘परमेश्वर की ओर लौट आओ’
  rationale: संदर्भ में परमेश्वर की ओर लौटना स्वाभाविक रूप से समझा जाता है, किंतु यूनानी पद में लक्ष्य स्पष्ट रूप से लिखा नहीं है। अनुवाद वास्तविक निहितार्थ को खुला रखते हुए मूल की संक्षिप्तता बचाता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पश्चाताप करो’ परिचित धार्मिक पद है, जबकि ‘लौट आओ’ सक्रिय आज्ञा और वापसी की दिशा को सरल हिन्दी में बनाए रखता है। पादटिप्पणी-चिह्न उसी शब्दसमूह के बाद रखा गया है जिससे उसका शाब्दिक विकल्प संबंधित है।
