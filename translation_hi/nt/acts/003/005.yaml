lexical_decisions:
- source_word: ὁ δὲ
  choice: तब वह
  rationale: δέ यहाँ कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘तब’ प्रसंग में स्वाभाविक है, और ‘वह’ पिछले पद के लँगड़े व्यक्ति की ओर संकेत करता है।
- source_word: ἐπεῖχεν
  choice: ध्यान लगाए रहा
  rationale: यह क्रिया यहाँ किसी की ओर ध्यान टिकाए रखने का अर्थ देती है। अपूर्णकाल के निरंतर भाव को ‘लगाए रहा’ व्यक्त करता है।
- source_word: αὐτοῖς
  choice: उन पर
  rationale: यह पतरस और यूहन्ना की ओर संकेत करता है और ‘ध्यान लगाना’ के साथ ‘उन पर’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: προσδοκῶν
  choice: आशा में
  rationale: कृदंत उस व्यक्ति की प्रत्याशा बताता है; ‘आशा में’ अपेक्षापूर्ण प्रतीक्षा को सहज हिन्दी में व्यक्त करता है।
- source_word: τι
  choice: कुछ
  rationale: मूल पाठ किसी अनिर्दिष्ट वस्तु या दान की ओर संकेत करता है; ‘कुछ’ इस अनिश्चितता को बनाए रखता है।
- source_word: παρ’ αὐτῶν
  choice: उनसे
  rationale: παρά के संबंधकारक रूप में स्रोत का भाव है; ‘उनसे’ इसे स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: λαβεῖν
  choice: पाने
  rationale: इस संदर्भ में भिक्षा या कोई वस्तु मिलने की अपेक्षा है; ‘पाने’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और ग्रहण करने का भाव देता है।
