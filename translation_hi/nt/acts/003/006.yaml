  edition: SBLGNT
  text: εἶπεν δὲ Πέτρος· Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, ὃ δὲ ἔχω τοῦτό σοι δίδωμι· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου ⸀περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/006.yaml
  text: 'But Peter said[a], “Silver and gold I do not have, but what I do have, this I give to you: in the name of Jesus the Messiah the Nazarene[b], walk.”'
translation:
  language: hi
  text: 'परन्तु पतरस ने कहा, “चाँदी और सोना मेरे पास नहीं है, पर जो मेरे पास है, वही मैं तुम्हें देता हूँ: नासरी[a] यीशु मसीह के नाम से चलो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नासरत के यीशु मसीह।” यूनानी में प्रयुक्त शब्द का अधिक शाब्दिक अर्थ “नासरी” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀργύριον καὶ χρυσίον
  choice: चाँदी और सोना
  rationale: यूनानी में दोनों धातुओं का स्पष्ट युग्म है, जो धन-संपत्ति का भी संकेत करता है; शाब्दिक युग्म हिन्दी में स्वाभाविक है।
- source_word: οὐχ ὑπάρχει μοι
  choice: मेरे पास नहीं है
  rationale: यह अधिकार या उपलब्धता बताने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: ὃ δὲ ἔχω τοῦτό σοι δίδωμι
  choice: पर जो मेरे पास है, वही मैं तुम्हें देता हूँ
  rationale: ‘वही’ τοῦτο के बल और पहले कथन से विरोध को सहज हिन्दी में बनाए रखता है।
- source_word: ἐν τῷ ὀνόματι
  choice: के नाम से
  rationale: यह हिन्दी में स्वाभाविक नाम-सूत्र है और नाम के साथ जुड़ी सत्ता या अधिकार की सम्भावना को बिना अधिक व्याख्या किए सुरक्षित रखता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός का अर्थगत पदनाम ‘मसीह’ रखा गया है; इस नाम-सूत्र में हिन्दी का प्रचलित और स्वाभाविक रूप ‘यीशु मसीह’ है।
- source_word: τοῦ Ναζωραίου
  choice: नासरी
  rationale: यह Ναζωραῖος के विशेषण/उपाधि-सदृश रूप को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: περιπάτει
  choice: चलो
  rationale: वर्तमान आज्ञार्थक का सीधा और प्रसंगानुकूल हिन्दी अनुवाद; ‘चलना शुरू करो’ अनावश्यक रूप से आरम्भिक भाव जोड़ता।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός पदनाम का अर्थ बनाए रखना उचित है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और व्यापक रूप से बोधगम्य है।
- issue: ἐν τῷ ὀνόματι में निहित अधिकार
  choice: के नाम से
  alternative: के अधिकार से
  rationale: मूल वाक्यांश नाम और अधिकार दोनों की धार्मिक अनुगूँज रख सकता है; मुख्य पाठ में ‘के नाम से’ इस व्यापकता को सुरक्षित रखता है।
- issue: τοῦ Ναζωραίου का सम्बन्ध
  choice: नासरी यीशु मसीह
  alternative: नासरत के यीशु मसीह
  rationale: मुख्य पाठ यूनानी के विशेषण/उपाधि-सदृश रूप के निकट रहता है; स्थान-संबंधी अर्थ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज संवादात्मक रूप। ‘परन्तु’ कथात्मक विरोध को रखता है, और प्रत्यक्ष वचन में ‘चलो’ सामान्य आज्ञार्थक है।
