base_translation:
  language: en
  yaml_path: translation/nt/acts/003/022.yaml
  text: Moses indeed said[a], ‘The Lord God will raise up for you a prophet from among your brothers, like me[b]. You shall listen to him in everything he says to you.’
translation:
  language: hi
  text: मूसा ने सचमुच कहा था, “प्रभु परमेश्वर[b] तुम्हारे लिए तुम्हारे भाइयों में से[a] मेरे समान एक भविष्यद्वक्ता खड़ा करेगा। वह तुमसे जो कुछ कहे, उस हर बात में उसकी बात सुनना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तुम्हारे भाइयों में से’ का अर्थ यहाँ ‘तुम्हारे सहजात इस्राएलियों में से’ भी समझा जा सकता है। यूनानी में पुल्लिंग संबंधवाची भाषा है, जिसका प्रयोग वाचा-समुदाय के प्रतिनिधिक अर्थ में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रेरितों के काम में व्यवस्थाविवरण 18:15 का उद्धरण कुछ भिन्न शब्दों में है। विशेष रूप से, यहाँ यूनानी पाठ ‘प्रभु परमेश्वर’ कहता है, ‘प्रभु तुम्हारा परमेश्वर’ नहीं।
    reason: cross_reference
lexical_decisions:
- source_word: Μωϋσῆς
  choice: मूसा
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित और मानक बाइबलीय रूप।
- source_word: μὲν
  choice: सचमुच
  rationale: यह कण कथन पर बल देता और विचार को आगे बढ़ाता है; ‘सचमुच’ आधुनिक हिन्दी में इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἶπεν ὅτι
  choice: ने ... कहा था, “...”
  rationale: प्रत्यक्ष उद्धरण हिन्दी में स्वाभाविक है; ‘था’ प्रसंग में मूसा के पूर्वकालीन कथन को स्पष्ट करता है।
- source_word: Προφήτην
  choice: एक भविष्यद्वक्ता
  rationale: अनिश्चित रूप को बनाए रखता है और मूल पाठ से आगे बढ़कर ‘वही भविष्यद्वक्ता’ या ‘मसीह’ नहीं जोड़ता।
- source_word: ἀναστήσει
  choice: खड़ा करेगा
  rationale: यहाँ किसी भविष्यद्वक्ता को उत्पन्न/नियुक्त करने का भाव है; ‘खड़ा करेगा’ व्यवस्थाविवरण से जुड़े पारंपरिक शाब्दिक संबंध को भी बचाता है, पर पुनरुत्थान को प्राथमिक अर्थ नहीं बनाता।
- source_word: κύριος ὁ θεὸς
  choice: प्रभु परमेश्वर
  rationale: प्रेरितों के काम के यूनानी पाठ में ‘तुम्हारा’ नहीं है; इसलिए व्यवस्थाविवरण से उसका शब्द जोड़कर सामंजस्य नहीं किया गया।
- source_word: ἐκ τῶν ἀδελφῶν ὑμῶν
  choice: तुम्हारे भाइयों में से
  rationale: ἐκ का ‘में से’ और पुल्लिंग संबंधवाची ἀδελφῶν का ‘भाइयों’ स्वाभाविक हिन्दी में सुरक्षित है; संदर्भ में यह वाचा-समुदाय के सहजात इस्राएलियों का प्रतिनिधिक उल्लेख है।
- source_word: ὡς ἐμέ
  choice: मेरे समान
  rationale: सीधी तुलनात्मक अभिव्यक्ति को अक्षुण्ण रखता है।
- source_word: αὐτοῦ ἀκούσεσθε
  choice: उसकी सुनना
  rationale: भविष्यत् रूप में निहित आज्ञार्थक/वाचागत बल और आज्ञाकारी ध्यान, दोनों को हिन्दी के स्वाभाविक निर्देशात्मक रूप में व्यक्त करता है।
- source_word: κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς
  choice: वह तुमसे जो कुछ कहे, उस हर बात में
  rationale: ὅσα ἂν की व्यापकता और κατὰ πάντα की समग्रता को स्पष्ट, आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: व्यवस्थाविवरण 18 का उद्धरण और मसीही पहचान
  choice: मुख्य पाठ में ‘एक भविष्यद्वक्ता’ रखा गया है।
  alternative: ‘वही भविष्यद्वक्ता’ लिखना या मुख्य पाठ में उसे स्पष्टतः ‘मसीह’ कहना।
  rationale: पतरस प्रसंग में इस वचन को यीशु पर लागू करता है, फिर भी इस पद का यूनानी पाठ स्वयं ‘एक भविष्यद्वक्ता’ कहता है। अनुवाद उद्धरण में व्याख्यात्मक पहचान नहीं जोड़ता।
- issue: ἀδελφῶν का लिंग और सामुदायिक अर्थ
  choice: ‘भाइयों’
  alternative: ‘भाई-बहनों’ अथवा ‘सहजात इस्राएलियों’
  rationale: मूल शब्द व्याकरणतः पुल्लिंग बहुवचन है और वाचा-संबंधी जातीय बंधुत्व दर्शाता है। मुख्य पाठ में उसका रूप सुरक्षित है, जबकि व्यापक प्रतिनिधिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- issue: κύριος ὁ θεὸς में संबंधवाचक सर्वनाम
  choice: ‘प्रभु परमेश्वर’
  alternative: व्यवस्थाविवरण 18:15 के अनुरूप ‘प्रभु तुम्हारा परमेश्वर’
  rationale: प्रेरितों के काम के इस यूनानी पाठ में ‘तुम्हारा’ नहीं है। पाठांतर-सदृश उद्धरणभेद को सामंजस्य करके मिटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘भविष्यद्वक्ता’, ‘प्रभु परमेश्वर’ और ‘मूसा’ जैसे स्थापित बाइबलीय पद रखे गए हैं। दोनों पादटिप्पणी चिह्न मुख्य पाठ में संबंधित कथनों के तुरंत बाद दिए गए हैं।
