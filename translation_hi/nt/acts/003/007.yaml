  text: καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν ⸀αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν ⸂αἱ βάσεις αὐτοῦ⸃ καὶ τὰ ⸀σφυδρά,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/007.yaml
  text: And taking him by the right hand[a], he raised him up; and immediately his feet and ankles were strengthened.
translation:
  language: hi
  text: और उसके दाहिने हाथ को पकड़कर, उसने उसे उठाया; और उसी क्षण उसके पाँव और टखने[a] मज़बूत हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘टखने की हड्डियाँ’।
    reason: τὰ σφυδρά के लिए अधिक विशिष्ट शारीरिक वैकल्पिक अर्थ।
lexical_decisions:
- source_word: πιάσας
  choice: पकड़कर
  rationale: यह कृदन्त मुख्य क्रिया से पहले की शारीरिक क्रिया बताता है। ‘पकड़कर’ सहज हिन्दी है और प्रसंग की सहायक क्रिया को बिना अनावश्यक कठोरता के व्यक्त करता है।
- source_word: τῆς δεξιᾶς χειρός
  choice: उसका दाहिना हाथ
  rationale: πιάσας के बाद आया सम्बन्धकारक अंग को पकड़ने का भाव देता है। हिन्दी में ‘उसका दाहिना हाथ पकड़कर’ स्वाभाविक है; ‘उसका’ प्रसंग से स्पष्ट व्यक्ति को सूचित करता है।
- source_word: ἤγειρεν αὐτόν
  choice: उसने उसे उठाया
  rationale: ἐγείρω यहाँ शारीरिक रूप से उठाने को बताता है। यह अनुवाद मूल क्रिया की सीधी शक्ति बनाए रखता है और ‘उठने में सहायता की’ जैसी व्याख्यात्मक नरमी से बचता है।
- source_word: παραχρῆμα
  choice: उसी क्षण
  rationale: यह क्रिया-विशेषण चंगाई की तत्कालता पर बल देता है। ‘उसी क्षण’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἐστερεώθησαν
  choice: मज़बूत हो गए
  rationale: निष्क्रिय क्रिया शरीर के अंगों में तत्काल आई दृढ़ता/शक्ति को व्यक्त करती है। हिन्दी का यह रूप स्वाभाविक है और कर्ता को स्पष्ट रूप से जोड़े बिना परिणाम बताता है।
- source_word: αἱ βάσεις αὐτοῦ
  choice: उसके पाँव
  rationale: βάσεις मूलतः आधार या सहारा देने वाले भाग हैं और इस शारीरिक प्रसंग में पाँव को सूचित करते हैं। ‘पाँव’ सामान्य पाठक के लिए सबसे स्वाभाविक विकल्प है।
- source_word: τὰ σφυδρά
  choice: टखने
  rationale: यह शब्द टखने के भाग अथवा जोड़ को सूचित करता है। ‘टखने’ पर्याप्त सटीक और सहज है; सम्भव अधिक विशिष्ट अर्थ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: चंगाई के स्वरूप का वर्णन
  choice: तत्काल शारीरिक मज़बूती की सीधी रिपोर्ट
  alternative: ‘चंगे हो गए’ कहना या इस वाक्य में परमेश्वर को स्पष्ट कर्ता बनाना
  rationale: यूनानी पाठ घटना को पाँवों और टखनों के मज़बूत होने के रूप में ठोस ढंग से बताता है। अनुवाद चमत्कारी आशय को प्रसंग पर छोड़ता है और इस उपवाक्य में ऐसी व्याख्या नहीं जोड़ता जो स्पष्ट रूप से कही नहीं गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘उसी क्षण’ तत्कालता को स्वाभाविक रूप से व्यक्त करता है और ‘मज़बूत हो गए’ मूल के निष्क्रिय, परिणामसूचक भाव को सहज हिन्दी में रखता है।
