id: ACT.3.15
reference: Acts 3:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὸν δὲ ἀρχηγὸν τῆς ζωῆς ἀπεκτείνατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, οὗ ἡμεῖς μάρτυρές ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/015.yaml
  text: but you killed the Author of life[a], whom God raised from the dead[b], of which we are witnesses.
translation:
  language: hi
  text: परन्तु जीवन के कर्ता[a] को तुमने मार डाला, जिसे परमेश्वर ने मरे हुओं में से जिलाया; हम इसी बात के गवाह हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जीवन के अगुआ,” “जीवन के अधिपति,” अथवा “जीवन के प्रवर्तक।” यूनानी शब्द में आरम्भ करने, अगुआई करने और प्रधान होने के भाव हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “हम उसी के गवाह हैं।” यूनानी वाक्य जी उठे हुए यीशु स्वयं या उनके जी उठने की घटना—दोनों की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: परन्तु
  rationale: 'यह पिछले पद के साथ जुड़ते हुए तीखा विरोध भी प्रकट करता है: उन्होंने जीवन के कर्ता को मार डाला।'
- source_word: ἀρχηγὸν
  choice: कर्ता
  rationale: ἀρχηγός में आरम्भ करने वाले, अगुआ और प्रधान होने के भाव समाए हैं। ‘जीवन के कर्ता’ यहाँ जीवन से उसके मूलभूत सम्बन्ध और कथन की विडम्बना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῆς ζωῆς
  choice: जीवन के
  rationale: सम्बन्धकारक पदबंध को संक्षिप्त और उपाधि-सदृश रूप में रखा गया है।
- source_word: ἀπεκτείνατε
  choice: तुमने मार डाला
  rationale: क्रिया का सीधा आरोप सुरक्षित रहता है; ‘हत्या की’ मूल क्रिया से अधिक विधिक-मौलिक अर्थ जोड़ता।
- source_word: ἤγειρεν ἐκ νεκρῶν
  choice: मरे हुओं में से जिलाया
  rationale: ἐκ νεκρῶν का बहुवचन और ‘उनके बीच से’ का भाव सुरक्षित रखते हुए यह पुनरुत्थान की स्वाभाविक बाइबलीय हिन्दी है।
- source_word: οὗ
  choice: इसी बात के
  rationale: सम्बन्धवाचक सर्वनाम को निकटवर्ती पुनरुत्थान की घटना के सन्दर्भ में समझा गया है; यूनानी में यीशु स्वयं इसका सन्दर्भ हों, यह भी सम्भव है।
- source_word: μάρτυρές ἐσμεν
  choice: हम ... के गवाह हैं
  rationale: संज्ञात्मक अभिव्यक्ति को बनाए रखने से प्रेरितों की गवाही और गवाह की उनकी भूमिका दोनों स्पष्ट रहती हैं।
theological_decisions:
- issue: मसीह के लिए ἀρχηγός की उपाधि
  choice: जीवन के कर्ता
  alternative: जीवन के अगुआ / जीवन के अधिपति / जीवन के प्रवर्तक
  rationale: ‘कर्ता’ उत्पत्ति या आरम्भ के भाव को स्पष्ट करता है और उस विरोधाभास को उभारता है कि जीवन से मूलभूत रूप से सम्बद्ध व्यक्ति को मार डाला गया। पादटिप्पणी शब्द के नेतृत्व और प्रधानता वाले सम्भव अर्थों को सुरक्षित रखती है।
- issue: οὗ का सन्दर्भ
  choice: हम इसी बात के गवाह हैं
  alternative: हम उसी के गवाह हैं
  rationale: निकटवर्ती पुनरुत्थान की घटना सन्दर्भ के रूप में स्वाभाविक है, पर यूनानी व्याकरण जी उठे व्यक्ति की ओर संकेत की सम्भावना भी खुली रखता है; इसे पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी हिन्दी। ‘परन्तु’ आरोप के विरोधात्मक बल को, ‘मार डाला’ क्रिया की स्पष्टता को, और अर्धविराम यूनानी वाक्य के सतत प्रवाह को बनाए रखता है।
