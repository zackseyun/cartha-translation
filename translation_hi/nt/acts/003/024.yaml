  yaml_path: translation/nt/acts/003/024.yaml
  text: And all the prophets from Samuel and those after him[a], as many as spoke[c][b], also announced these days.
translation:
  language: hi
  text: और शमूएल से लेकर उसके बाद आनेवाले सभी भविष्यवक्ताओं ने—जितने भी बोले—इन दिनों[c] की घोषणा[b] की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या ‘प्रचार किया’; अधिक व्याख्यात्मक रूप में, ‘भविष्यवाणी की’।
    reason: lexical_alternative
  - marker: c
    text: या ‘इन समयों की’। यह पदबंध पतरस के कथन में पूर्ति के वर्तमान समय की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες δὲ οἱ προφῆται
  choice: सभी भविष्यवक्ता
  rationale: δέ यहाँ हल्का संयोजक है, इसलिए उसे स्वाभाविक हिन्दी में ‘और’ से व्यक्त किया गया है; πάντες का समावेशी बल ‘सभी’ से सुरक्षित रहता है।
- source_word: ἀπὸ Σαμουὴλ
  choice: शमूएल से लेकर
  rationale: ἀπό यहाँ भविष्यवक्ताओं के क्रम का आरम्भ-बिंदु बताता है। ‘से लेकर’ आधुनिक हिन्दी में इस क्रम को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῶν καθεξῆς
  choice: उनके बाद क्रम से आनेवाले
  rationale: καθεξῆς उत्तराधिकार या क्रम का बोध कराता है। यह अनुवाद शमूएल के बाद आनेवाले भविष्यवक्ताओं का आशय बनाए रखता है।
- source_word: ὅσοι ἐλάλησαν
  choice: जितने भी भविष्यवक्ता बोले
  rationale: ὅσοι की व्यापक मात्रात्मकता ‘जितने भी’ से और ἐλάλησαν का सामान्य अर्थ ‘बोले’ से व्यक्त होता है; अनुवाद में कोई अतिरिक्त दैवी-वाणी संबंधी पद नहीं जोड़ा गया।
- source_word: καὶ κατήγγειλαν
  choice: भी घोषणा की
  rationale: καταγγέλλω का मूल भाव किसी बात की घोषणा या सार्वजनिक उद्घोषणा करना है। ‘भविष्यवाणी की’ संदर्भ में संभव है, पर वह यूनानी क्रिया से अधिक व्याख्यात्मक होता।
- source_word: τὰς ἡμέρας ταύτας
  choice: इन दिनों
  rationale: यह यूनानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप है तथा पतरस द्वारा बताए जा रहे वर्तमान पूर्ति-काल की ओर संकेत करते हुए भी उसकी सीमा को अधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: भविष्यवक्ताओं का वर्तमान उद्धार-ऐतिहासिक काल की ओर संकेत
  choice: इन दिनों
  alternative: इस काल की
  rationale: ‘इन दिनों’ मूल पाठ की काल-संबंधी अभिव्यक्ति को बनाए रखता है। यह मसीह और वर्तमान पूर्ति के संदर्भ को नकारता नहीं, पर अनुवाद में उस युगांत-संबंधी अर्थ को मूल से अधिक स्पष्ट भी नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी वाक्य की अपेक्षाकृत जटिल रचना को स्वाभाविक हिन्दी के ‘जितने भी… उन सभी ने’ ढाँचे में रखा गया है, बिना उसके समावेशी बल या भविष्यवक्ताओं के क्रम को खोए।
