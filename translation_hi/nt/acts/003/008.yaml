  text: And leaping up, he stood and began to walk, and he entered the temple with them, walking and jumping and praising God.
translation:
  language: hi
  text: वह उछलकर खड़ा हुआ और चलने लगा। फिर वह उनके साथ मन्दिर में प्रवेश किया—चलता, उछलता और परमेश्वर की स्तुति करता हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαλλόμενος
  choice: उछलकर
  rationale: यह कृदन्त अचानक और उत्साहपूर्ण उछलने की क्रिया व्यक्त करता है; ‘उछलकर’ स्वाभाविक हिन्दी में मुख्य क्रिया ‘खड़ा हो गया’ से जुड़ता है।
- source_word: περιεπάτει
  choice: चलने लगा
  rationale: अपूर्ण भूतकाल यहाँ आरम्भ होकर जारी रहने वाली क्रिया का संकेत देता है; ‘चलने लगा’ सन्दर्भ में उस व्यक्ति की नई मिली चलने की क्षमता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸ ἱερὸν
  choice: मन्दिर
  rationale: यह शब्द व्यापक मन्दिर-परिसर को दर्शा सकता है; हिन्दी में ‘मन्दिर’ इस पद में सामान्य और सुबोध समतुल्य है।
- source_word: ἁλλόμενος
  choice: उछलता
  rationale: चलने के साथ बार-बार उछलने की क्रिया को व्यक्त करता है और ἐξαλλόμενος के साथ शब्दगत संबंध भी बनाए रखता है।
- source_word: αἰνῶν τὸν θεόν
  choice: परमेश्वर की स्तुति करता हुआ
  rationale: यह वाक्यांश परमेश्वर की प्रशंसा करते रहने की समकालिक क्रिया को स्वाभाविक, प्रतिष्ठित हिन्दी में व्यक्त करता है।
