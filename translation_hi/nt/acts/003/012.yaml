id: ACT.3.12
reference: Acts 3:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ⸀ὁ Πέτρος ἀπεκρίνατο πρὸς τὸν λαόν· Ἄνδρες Ἰσραηλῖται, τί θαυμάζετε ἐπὶ τούτῳ, ἢ ἡμῖν τί ἀτενίζετε ὡς ἰδίᾳ δυνάμει ἢ εὐσεβείᾳ πεποιηκόσιν τοῦ περιπατεῖν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/012.yaml
  text: But when Peter saw it[a], he answered the people, “Men of Israel, why do you marvel at this[b], or why do you stare at us as though by our own power or godliness we had made him walk?”
translation:
  language: hi
  text: यह देखकर पतरस ने लोगों से कहा, “इस्राएली पुरुषो, तुम इस बात पर क्यों अचम्भा करते हो? और हमारी ओर टकटकी लगाकर[a] क्यों देखते हो, मानो हमने अपनी ही सामर्थ्य या ईश्वर-भक्ति[b] से इस मनुष्य को चलने योग्य बनाया हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारी ओर लगातार क्यों देखते हो?” मूल क्रिया स्थिर अथवा लगातार दृष्टि लगाए रखने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: या “भक्तिपरायणता।” पतरस इस बात से इनकार करता है कि उस मनुष्य की चंगाई प्रेरितों की अपनी धार्मिक निष्ठा या आध्यात्मिक गुणवत्ता से हुई।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πέτρος
  choice: यह देखकर पतरस ने
  rationale: ἰδών को पूर्वकालिक क्रिया के रूप में स्वाभाविक हिन्दी में रखा गया है; ‘यह’ पिछले प्रसंग में भीड़ की प्रतिक्रिया की ओर संकेत करता है। δέ का हल्का संक्रमण हिन्दी वाक्य-प्रवाह में अलग संयोजक के बिना व्यक्त हो जाता है।
- source_word: ἀπεκρίνατο πρὸς τὸν λαόν
  choice: लोगों से कहा
  rationale: यहाँ कोई स्पष्ट मौखिक प्रश्न नहीं है; क्रिया परिस्थिति के प्रत्युत्तर में बोलने को बताती है। ‘लोगों से कहा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: इस्राएली पुरुषो
  rationale: सम्बोधन के पुरुषवाचक रूप ἄνδρες को बनाए रखते हुए अभिव्यक्ति को स्पष्ट और गरिमापूर्ण रखा गया है।
- source_word: τί θαυμάζετε ἐπὶ τούτῳ
  choice: तुम इस बात पर क्यों अचम्भा करते हो
  rationale: θαυμάζω के आश्चर्यचकित होने के भाव और ἐπὶ τούτῳ के चंगाई की घटना की ओर संकेत—दोनों को सुरक्षित रखा गया है।
- source_word: ἢ ἡμῖν τί ἀτενίζετε
  choice: और हमारी ओर टकटकी लगाकर क्यों देखते हो
  rationale: ἀτενίζω लगातार और ध्यान से देखने का बोध देता है; ‘टकटकी लगाकर’ उस तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है। प्रश्न की दूसरी शाखा के लिए ‘और’ हिन्दी में अधिक सहज है।
- source_word: ὡς ἰδίᾳ δυνάμει
  choice: मानो हमने अपनी ही सामर्थ्य ... से
  rationale: ὡς उस गलत धारणा को प्रस्तुत करता है जिसका पतरस खण्डन करता है, और ἰδίᾳ व्यक्तिगत अथवा स्वयं की सामर्थ्य पर बल देता है।
- source_word: εὐσεβείᾳ
  choice: ईश्वर-भक्ति
  rationale: शब्द श्रद्धापूर्ण धार्मिक निष्ठा या भक्तिपरायणता को दर्शाता है। ‘ईश्वर-भक्ति’ आधुनिक हिन्दी में स्पष्ट है और इसे सामान्य नैतिक ‘धार्मिकता’ समझे जाने से बचाता है।
- source_word: πεποιηκόσιν τοῦ περιπατεῖν αὐτόν
  choice: इस मनुष्य को चलने योग्य बनाया हो
  rationale: यह कथित कारण और उसके पूर्ण परिणाम को व्यक्त करता है। ‘चलने योग्य बनाया’ हिन्दी में स्वाभाविक रूप से बताता है कि पहले न चल सकने वाला व्यक्ति अब चल सका, बिना चंगाई का वास्तविक स्रोत बताए।
theological_decisions:
- issue: क्या εὐσεβείᾳ को प्रेरितों के आध्यात्मिक पुण्य या योग्यता के तकनीकी दावे के रूप में व्यक्त किया जाए
  choice: ईश्वर-भक्ति
  alternative: धार्मिकता; भक्तिपरायणता
  rationale: पतरस अपनी और यूहन्ना की निजी धार्मिक गुणवत्ता को चंगाई का कारण मानने से इनकार करता है। अनुवाद इस निषेध को बनाए रखता है, पर बाद की किसी पुण्य-सिद्धान्त संबंधी शब्दावली को पाठ में नहीं जोड़ता।
- issue: Ἄνδρες Ἰσραηλῖται का लिंगसूचक सम्बोधन
  choice: इस्राएली पुरुषो
  alternative: इस्राएल के लोगो; इस्राएलियो
  rationale: मूल यूनानी में पुरुषवाचक सम्बोधन स्पष्ट है; इसलिए उसे सामान्य लिंग-निरपेक्ष सम्बोधन में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, सार्वजनिक वचन के अनुरूप गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अचम्भा’, ‘सामर्थ्य’ और ‘ईश्वर-भक्ति’ बाइबलीय गरिमा रखते हुए भी प्रचलित और बोधगम्य हैं। footnote markers को उन शब्दों के ठीक बाद रखा गया है जिनसे उनके विकल्प सम्बद्ध हैं।
