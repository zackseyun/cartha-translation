  naturalness: The rendering is fluent modern standard Hindi with an appropriately dignified public-speech register. ‘टकटकी लगाकर’ naturally conveys an intent, sustained gaze. ‘इस्राएली पुरुषो’ is a suitably formal masculine vocative corresponding to the Greek.
