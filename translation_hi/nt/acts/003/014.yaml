  text: ὑμεῖς δὲ τὸν ἅγιον καὶ δίκαιον ἠρνήσασθε καὶ ᾐτήσασθε ἄνδρα φονέα χαρισθῆναι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/014.yaml
  text: But you denied the Holy and Righteous One[a], and asked for a murderer to be granted to you,
translation:
  language: hi
  text: पर तुमने उस पवित्र और धर्मी जन का इनकार किया और माँगा कि तुम्हें एक हत्यारा रिहा कर दिया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς δὲ
  choice: पर तुमने
  rationale: δέ पिछले कथन से विरोध प्रकट करता है और स्पष्ट ὑμεῖς कर्ता पर बल देता है। हिन्दी में अलग से ‘तुम ही’ जोड़ना संभव है, पर क्रिया के साथ ‘तुमने’ सीधा आरोप स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸν ἅγιον καὶ δίκαιον
  choice: उस पवित्र और धर्मी जन
  rationale: एक ही लेख के अधीन दोनों विशेषण substantival हैं और यीशु को एक विशिष्ट उपाधिसदृश वर्णन से सूचित करते हैं। ‘जन’ दोनों विशेषणों को एक ही व्यक्ति से जोड़ते हुए सम्मानपूर्ण और स्वाभाविक हिन्दी देता है।
- source_word: ἠρνήσασθε
  choice: इनकार किया
  rationale: ἀρνέομαι यहाँ यीशु को स्वीकार न करने और उनका परित्याग करने का भाव रखता है। ‘इनकार किया’ यूनानी के निकट और सामान्य हिन्दी में स्पष्ट है।
- source_word: ᾐτήσασθε
  choice: माँगा
  rationale: αἰτέω का मूल अर्थ माँगना या अनुरोध करना है। न्यायिक प्रसंग में भी ‘माँगा’ स्वाभाविक है और ‘दबाव डालकर माँगा’ जैसा अतिरिक्त भाव नहीं जोड़ता।
- source_word: ἄνδρα φονέα
  choice: एक हत्यारे
  rationale: φονεύς स्वयं व्यक्ति-सूचक संज्ञा है; इसलिए हिन्दी में ‘एक हत्यारा आदमी’ अनावश्यक और अस्वाभाविक होगा। ‘एक हत्यारे’ ἄνδρα की अनिश्चित व्यक्ति-संदर्भता और φονέα का अर्थ दोनों स्वाभाविक रूप से व्यक्त करता है।
- source_word: χαρισθῆναι ὑμῖν
  choice: तुम्हारे लिए छोड़ दिया जाए
  rationale: χαρίζομαι का व्यापक अर्थ अनुग्रहपूर्वक देना या प्रदान करना है, पर इस न्यायिक प्रसंग में व्यक्ति को रिहा कर देना अभिप्रेत है। ‘तुम्हारे लिए छोड़ दिया जाए’ उस प्रसंगगत अर्थ को सहज हिन्दी में व्यक्त करता है और ὑμῖν को भी स्पष्ट रखता है।
theological_decisions:
- issue: ‘पवित्र और धर्मी’ का मसीह-संबंधी उपाधिसदृश बल
  choice: दोनों विशेषणों को एक ही व्यक्ति के लिए ‘उस पवित्र और धर्मी जन’ के रूप में प्रस्तुत किया
  alternative: इन्हें केवल सामान्य वर्णन मानकर ‘उस पवित्र और धर्मी व्यक्ति’ कहना, अथवा दो अलग उपाधियाँ समझना
  rationale: यूनानी में एक लेख दोनों substantival विशेषणों को एक ही निर्दिष्ट व्यक्ति से जोड़ता है। ‘जन’ सम्मान और उपाधिसदृश बल रखता है, बिना पाठ से आगे कोई संप्रदायगत निष्कर्ष जोड़े।
- issue: χαρισθῆναι का न्यायिक अर्थ
  choice: प्रसंगानुसार ‘छोड़ दिया जाए’
  alternative: अधिक शब्दशः ‘तुम्हें प्रदान किया जाए’
  rationale: क्रिया सामान्यतः अनुग्रहपूर्वक देने का भाव रखती है, किंतु यहाँ माँगा गया व्यक्ति बरअब्बा है और क्रिया उसकी रिहाई की ओर संकेत करती है। हिन्दी में ‘प्रदान किया जाए’ व्यक्ति के लिए कृत्रिम तथा संभावित रूप से भ्रामक है; ‘छोड़ दिया जाए’ मूल के प्रसंगगत आशय को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधा, गंभीर और सार्वजनिक वाचन के योग्य। ‘धर्मी जन’ सम्मानपूर्ण है, जबकि ‘माँगा’ और ‘छोड़ दिया जाए’ साधारण पाठक के लिए सहज हैं।
