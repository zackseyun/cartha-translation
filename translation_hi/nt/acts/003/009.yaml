  text: And all the people saw him walking and praising God,
translation:
  language: hi
  text: और सब लोगों ने उसे चलते और परमेश्वर की स्तुति करते देखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक कथा के प्रवाह को बिना अतिरिक्त कालगत अर्थ जोड़े स्वाभाविक रूप से आगे बढ़ाता है।
- source_word: εἶδεν
  choice: देखा
  rationale: यह चंगे हुए व्यक्ति को लोगों द्वारा प्रत्यक्ष देखने का सीधा कथात्मक वर्णन है। हिंदी में संयुक्त क्रियात्मक पूरकों के बाद 'देखा' रखना स्वाभाविक है।
- source_word: πᾶς ὁ λαὸς
  choice: सब लोगों ने
  rationale: यह पदबंध लोगों को सामूहिक रूप से दर्शाता है। 'सब लोगों' आधुनिक हिंदी में स्वाभाविक है और इसे केवल भीड़ के अर्थ तक सीमित नहीं करता।
- source_word: αὐτὸν
  choice: उसे
  rationale: यह पिछले संदर्भ के चंगे हुए पुरुष की ओर संकेत करने वाला कर्मवाचक सर्वनाम है।
- source_word: περιπατοῦντα
  choice: चलते
  rationale: वर्तमान कृदंत उस व्यक्ति की दिखाई दे रही क्रिया बताता है; 'चलते' चंगाई के संदर्भ में मुख्य और स्पष्ट अर्थ सुरक्षित रखता है।
- source_word: καὶ αἰνοῦντα
  choice: और ... स्तुति करते
  rationale: αἰνέω आराधनापूर्ण प्रशंसा व्यक्त करता है। 'स्तुति करना' परमेश्वर के प्रति इस क्रिया के लिए स्वाभाविक और गरिमापूर्ण हिंदी है।
- source_word: τὸν θεόν
  choice: परमेश्वर की
  rationale: ग्रीक में परमेश्वर स्तुति का कर्म है; हिंदी मुहावरे में इसे 'परमेश्वर की स्तुति करना' के संबंधकारक निर्माण से स्वाभाविक रूप से व्यक्त किया जाता है।
