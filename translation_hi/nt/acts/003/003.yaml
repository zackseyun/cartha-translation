lexical_decisions:
- source_word: ὃς ἰδὼν
  choice: जब उसने ... देखा
  rationale: सम्बन्धवाचक सर्वनाम पिछले पद के जन्म से लँगड़े व्यक्ति की ओर संकेत करता है; कृदन्त को कालवाचक उपवाक्य के रूप में रखना स्वाभाविक हिन्दी है।
- source_word: Πέτρον καὶ Ἰωάννην
  choice: पतरस और यूहन्ना
  rationale: हिन्दी बाइबल परम्परा में प्रचलित नाम-रूप रखे गए हैं।
- source_word: μέλλοντας εἰσιέναι
  choice: प्रवेश करनेवाला
  rationale: μέλλω और infinitive यहाँ निकट भविष्य—प्रवेश करने ही की स्थिति—को व्यक्त करते हैं; प्रसंग में यह रूप हिन्दी में सहज है।
- source_word: εἰς τὸ ἱερόν
  choice: मन्दिर-परिसर में
  rationale: ἱερόν पूरे मन्दिर-परिसर को सूचित करता है, केवल भीतरी पवित्र भवन को नहीं।
- source_word: ἠρώτα
  choice: माँगने लगा
  rationale: अपूर्ण भूतकाल जारी या बार-बार किए गए निवेदन को दर्शा सकता है; 'माँगने लगा' दृश्य की प्रगतिशीलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐλεημοσύνην λαβεῖν
  choice: दान माँगने
  rationale: इस प्रसंग में ἐλεημοσύνη निर्धन को दिया जाने वाला दान है। हिन्दी में 'दान माँगना' उद्देश्य को स्वाभाविक रूप से समेटता है, जबकि शाब्दिक 'दान प्राप्त करने के लिए माँगना' बोझिल होगा।
