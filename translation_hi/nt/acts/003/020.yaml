source:
  edition: SBLGNT
  text: ὅπως ἂν ἔλθωσιν καιροὶ ἀναψύξεως ἀπὸ προσώπου τοῦ κυρίου καὶ ἀποστείλῃ τὸν προκεχειρισμένον ὑμῖν χριστὸν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/020.yaml
  text: so that times of refreshing may come from the presence of the Lord[a], and that he may send the Messiah appointed for you, Jesus,
translation:
  language: hi
  text: ताकि प्रभु की उपस्थिति से ताज़गी के समय आएँ और वह तुम्हारे लिए नियुक्त मसीहा यीशु को भेजे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως ἂν
  choice: ताकि
  rationale: यह पिछले पद में मन फिराने के आह्वान से जुड़ा उद्देश्य अथवा परिणाम प्रकट करता है। ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक अनिश्चितता नहीं जोड़ता।
- source_word: ἔλθωσιν
  choice: आएँ
  rationale: सम्भावनार्थक क्रिया-रूप को ‘ताकि’ के साथ हिन्दी के स्वाभाविक विधिलिंग द्वारा व्यक्त किया गया है।
- source_word: καιροὶ
  choice: समय
  rationale: καιρός उपयुक्त अवसर, काल या अवधि का बोध करा सकता है। ‘समय’ अर्थ को व्यापक रखता है और अन्त-समय सम्बन्धी कोई अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: ἀναψύξεως
  choice: ताज़गी
  rationale: यह शब्द राहत, नई स्फूर्ति या ताज़गी का अर्थ दे सकता है। ‘ताज़गी’ मूल रूपक को बनाए रखते हुए साधारण आधुनिक हिन्दी में सहज है।
- source_word: ἀπὸ προσώπου τοῦ κυρίου
  choice: प्रभु की उपस्थिति से
  rationale: πρόσωπον का शाब्दिक अर्थ ‘मुख’ है, पर इस मुहावरे में ‘उपस्थिति’ अभिप्रेत है। यह वाक्यांश बताता है कि ताज़गी प्रभु की ओर से, उसकी उपस्थिति से आती है।
- source_word: ἀποστείλῃ
  choice: वह ... भेजे
  rationale: यह भी ὅπως ἂν पर निर्भर सम्भावनार्थक क्रिया है; हिन्दी विधिलिंग मूल वाक्य की उद्देश्य/परिणाम सम्बन्धी संरचना सुरक्षित रखता है।
- source_word: προκεχειρισμένον
  choice: नियुक्त
  rationale: यह कृदन्त पहले से चुनने या नियुक्त करने का भाव रखता है। मुख्य पाठ में ‘नियुक्त’ संक्षिप्त और स्वाभाविक है; पूर्वता का स्पष्ट रूप पाद-टिप्पणी में रखा गया है।
- source_word: ὑμῖν
  choice: तुम्हारे लिए
  rationale: सम्प्रदान कारक का अर्थ ‘तुम्हारे लिए’ अथवा ‘तुम्हें’ हो सकता है। यहाँ ‘तुम्हारे लिए’ हिन्दी में स्वाभाविक है और श्रोताओं के सम्बन्ध में नियुक्ति का भाव सुरक्षित रखता है।
- source_word: χριστὸν
  choice: मसीहा
  rationale: यहाँ χριστός यीशु की मसीही उपाधि के रूप में प्रयुक्त है; ‘मसीहा’ यहूदी सन्दर्भ और उपाधि का अर्थ स्पष्ट रखता है।
- source_word: Ἰησοῦν
  choice: यीशु
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित रूप।
theological_decisions:
- issue: χριστὸν को उपाधि के रूप में अनुवाद करना या पारम्परिक ‘ख्रीष्ट/मसीह’ रूप रखना
  choice: मसीहा
  alternative: मसीह
  rationale: इस प्रसंग में χριστός नाम के अंग से अधिक एक उपाधि है। ‘मसीहा’ उस उपाधि का अर्थ और प्रेरितों के काम के यहूदी सन्दर्भ को स्पष्ट रखता है।
- issue: προκεχειρισμένον ὑμῖν का अर्थ
  choice: तुम्हारे लिए नियुक्त
  alternative: तुम्हारे लिए पहले से नियुक्त; तुम्हें नियुक्त किया हुआ
  rationale: कृदन्त में पूर्व नियुक्ति का भाव हो सकता है और ὑμῖν को ‘के लिए’ या ‘को/तुम्हें’ समझा जा सकता है। मुख्य पाठ सहज हिन्दी में मूल अर्थ देता है, जबकि वास्तविक भाषिक विकल्प पाद-टिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ताज़गी के समय’ मूल रूपक और बहुवचन काल-अवधियों को बनाए रखता है। पाद-टिप्पणी का चिह्न उसी विवादित वाक्यांश के बाद रखा गया है जिससे वह सम्बन्धित है।
