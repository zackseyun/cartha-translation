base_translation:
  language: en
  yaml_path: translation/nt/acts/003/017.yaml
  text: And now[a], brothers, I know that you acted in ignorance, just as your rulers also did.
translation:
  language: hi
  text: और अब, भाइयो,[a] मैं जानता हूँ कि तुमने अज्ञानता में ऐसा किया, जैसा तुम्हारे शासकों ने भी किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाइयो और बहनो’; यूनानी में शाब्दिक रूप से ‘भाइयो’ है, जो सम्भवतः स्त्री-पुरुषों के व्यापक समूह को प्रतिनिधिक रूप से संबोधित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ νῦν
  choice: और अब
  rationale: καί और νῦν दोनों को रखते हुए पिछले आरोप से वर्तमान संबोधन और अपील की ओर स्वाभाविक संक्रमण दिखाता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: सम्बोधन रूप का सीधा और स्वाभाविक हिन्दी समतुल्य है। यूनानी शब्द शाब्दिक रूप से ‘भाइयों’ को दर्शाता है, यद्यपि वह व्यापक मिश्रित समूह को प्रतिनिधिक रूप से संबोधित कर सकता है।
- source_word: οἶδα
  choice: मैं जानता हूँ
  rationale: पतरस के ज्ञान के दावे को सीधे और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατὰ ἄγνοιαν
  choice: अज्ञानता में
  rationale: ज्ञान या समझ के अभाव में किए गए कार्य का भाव रखता है, पर इसे पूर्ण निर्दोषता के रूप में नहीं समझाता।
- source_word: ἐπράξατε
  choice: तुमने ... ऐसा किया
  rationale: क्रिया को व्यापक रखता है और पूर्ववर्ती प्रसंग की ओर संकेत करने के लिए स्वाभाविक हिन्दी ‘ऐसा’ का प्रयोग करता है, बिना इस पद में कोई अधिक विशिष्ट कर्म जोड़ने के।
- source_word: ὥσπερ καὶ
  choice: जैसे ... ने भी
  rationale: तुलना और अतिरिक्त समानता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ ἄρχοντες ὑμῶν
  choice: तुम्हारे शासकों
  rationale: यरूशलेम के अधिकार-संपन्न नेतृत्व के लिए उपयुक्त है और ἄρχοντες के शासन तथा अधिकार के भाव को बनाए रखता है।
theological_decisions:
- issue: क्या अज्ञानता का उल्लेख दोष को पूरी तरह मिटाता हुआ प्रस्तुत किया जाए
  choice: ‘अज्ञानता में’ कहकर ज्ञान के अभाव को स्वीकार करना, पर दोषमुक्ति का निष्कर्ष न जोड़ना
  alternative: ‘तुम्हें पता नहीं था, इसलिए तुम निर्दोष थे’ जैसे स्पष्ट दोषमुक्तिकारक शब्द
  rationale: यह पद अज्ञानता को उनके कार्य का एक वास्तविक पहलू बताता है, जबकि आगे का प्रसंग फिर भी मन फिराने का आह्वान करता है। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘अज्ञानता में’ जानबूझकर कुछ औपचारिक है, ताकि मूल के नैतिक और ज्ञान-संबंधी तनाव को ‘अनजाने में’ कहकर आवश्यकता से अधिक हल्का न किया जाए।
