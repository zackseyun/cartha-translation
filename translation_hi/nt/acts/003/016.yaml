source:
  edition: SBLGNT
  text: καὶ ⸀ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ τοῦτον ὃν θεωρεῖτε καὶ οἴδατε ἐστερέωσεν τὸ ὄνομα αὐτοῦ, καὶ ἡ πίστις ἡ δι’ αὐτοῦ ἔδωκεν αὐτῷ τὴν ὁλοκληρίαν ταύτην ἀπέναντι πάντων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/016.yaml
  text: And on the basis of faith in his name[a], his name itself has made strong this man whom you see and know[c][b]; and the faith that is through him has given him this wholeness in the presence of all of you.
translation:
  language: hi
  text: और उसके नाम पर विश्वास के आधार पर[a], उसके नाम ने ही इस मनुष्य को—जिसे तुम देखते और जानते हो—मज़बूत किया है; और वह विश्वास जो उसके द्वारा है, उसी ने उसे तुम सबके सामने यह पूर्ण स्वास्थ्य दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके नाम पर भरोसे के आधार पर।’ यूनानी शब्द का अर्थ ‘विश्वास’ या ‘भरोसा’ हो सकता है और कुछ प्रसंगों में ‘विश्वासयोग्यता’ भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῇ πίστει τοῦ ὀνόματος αὐτοῦ
  choice: उसके नाम पर विश्वास के आधार पर
  rationale: ἐπί के साथ चतुर्थी यहाँ आधार या कारण का भाव दे सकती है। यह अनुवाद साधारण साधनवाचक अर्थ से आगे बढ़कर उस आधार को स्पष्ट करता है, जबकि πίστις को ‘विश्वास’ और नाम को यीशु के व्यक्ति तथा अधिकार के संकेत के रूप में बनाए रखता है।
- source_word: ἐστερέωσεν τὸ ὄνομα αὐτοῦ
  choice: उसके नाम ही ने ... सामर्थी बनाया है
  rationale: क्रिया का अर्थ दृढ़ या शक्तिशाली करना है। ‘ही’ यूनानी में ‘उसके नाम’ की प्रभावशाली पुनरावृत्ति और कर्तृभाव को स्वाभाविक हिन्दी में उभारता है।
- source_word: θεωρεῖτε καὶ οἴδατε
  choice: जिसे तुम देखते और जानते हो
  rationale: यह प्रत्यक्ष देखने और पहले से पहचानने, दोनों बातों को संक्षेप और स्वाभाविक रूप में सुरक्षित रखता है।
- source_word: ἡ πίστις ἡ δι’ αὐτοῦ
  choice: जो विश्वास उसके द्वारा है
  rationale: यह जानबूझकर कुछ खुला रखा गया है, क्योंकि यूनानी वाक्यांश यह स्पष्ट नहीं करता कि विश्वास यीशु के द्वारा उत्पन्न, मध्यस्थित या किसी अन्य अर्थ में ‘उसके द्वारा’ है।
- source_word: ὁλοκληρίαν
  choice: पूर्ण स्वस्थता
  rationale: यह शब्द शारीरिक संपूर्णता, निरोगता और पूरी बहाली का भाव देता है। प्रसंग में ‘पूर्ण स्वस्थता’ स्पष्ट और स्वाभाविक है।
- source_word: ἀπέναντι πάντων ὑμῶν
  choice: तुम सबके सामने
  rationale: यह चंगाई के सार्वजनिक और प्रत्यक्ष रूप से प्रमाणित होने के भाव को सरल हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: विश्वास किसका है और चंगाई में उसकी भूमिका क्या है
  choice: विश्वास को ‘उसके नाम पर’ और ‘उसके द्वारा’ कहा गया है, पर उसके मानवीय कर्ता की पहचान नहीं की गई।
  alternative: इसे चंगे हुए मनुष्य का विश्वास, प्रेरितों का विश्वास, या यीशु द्वारा उत्पन्न विश्वास मानना।
  rationale: यूनानी पाठ विश्वास रखने वाले व्यक्ति को स्पष्ट रूप से नहीं बताता। अनुवाद इस धर्मवैचारिक तनाव को सुलझाने के बजाय सुरक्षित रखता है।
- issue: ‘नाम’ का लाक्षणिक और कर्तृवाचक प्रयोग
  choice: ‘उसके नाम ही ने’ को मुख्य पाठ में बनाए रखा गया है।
  alternative: ‘यीशु ने’ या ‘उसके नाम की सामर्थ्य ने’।
  rationale: प्रेरितों के काम में ‘नाम’ यीशु के व्यक्ति और अधिकार का संकेत है। मूल अभिव्यक्ति बनाए रखने से लूका का विशेष जोर सुरक्षित रहता है और अनुवाद अतिरिक्त व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए प्रसंगानुकूल बहुवचन ‘तुम’ रखा गया है। शैली सार्वजनिक उपदेश के अनुरूप dignified किंतु सामान्य पाठक के लिए सुबोध है। ‘जो विश्वास उसके द्वारा है’ अपेक्षाकृत सघन है, पर मूल की वास्तविक अस्पष्टता को अनावश्यक रूप से सुलझाने से बचता है।
