source:
  edition: SBLGNT
  text: ὑμῖν πρῶτον ⸂ἀναστήσας ὁ θεὸς⸃ τὸν παῖδα ⸀αὐτοῦ ἀπέστειλεν αὐτὸν εὐλογοῦντα ὑμᾶς ἐν τῷ ἀποστρέφειν ἕκαστον ἀπὸ τῶν πονηριῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/026.yaml
  text: To you first[a], God, having raised up his servant[b], sent him to bless you by turning each of you from your wicked ways.
translation:
  language: hi
  text: परमेश्वर ने अपने सेवक[b] को उठाकर[a] सबसे पहले तुम्हारे पास भेजा, कि वह तुममें से हर एक को तुम्हारी बुराइयों से फेरकर तुम्हें आशीष दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘उठाकर’ का अर्थ ‘खड़ा करके’ या ‘प्रकट करके’ भी हो सकता है; यह आवश्यक नहीं कि इसका अर्थ विशेष रूप से ‘मरे हुओं में से जिलाकर’ ही हो।
    reason: alternative_reading
  - marker: b
    text: या ‘बालक’; यूनानी शब्द का अर्थ ‘सेवक’ या ‘बालक’ हो सकता है, पर यहाँ संभवतः यशायाह में वर्णित प्रभु के सेवक की पृष्ठभूमि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῖν πρῶτον
  choice: सबसे पहले तुम्हारे पास
  rationale: यह यहूदी श्रोताओं को दी गई प्राथमिकता और उनके प्रति भेजे जाने—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀναστήσας
  choice: उठाकर
  rationale: 'यह यूनानी क्रिया की जानबूझकर बनी हुई व्यापकता को बचाता है: इसका संकेत मृतकों में से उठाने की ओर भी हो सकता है और किसी को खड़ा करने या प्रकट करने की ओर भी।'
- source_word: τὸν παῖδα αὐτοῦ
  choice: अपने सेवक
  rationale: यहाँ ‘सेवक’ यशायाह के सेवक की पृष्ठभूमि के अनुकूल है; ‘बालक’ शाब्दिक रूप से संभव है, पर इस प्रसंग में कम संभावित, और ‘पुत्र’ मूल से अधिक व्याख्यात्मक होगा।
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: सरल और स्वाभाविक शब्द, जो भेजे जाने के भाव को बिना अतिरिक्त अर्थ जोड़े व्यक्त करता है।
- source_word: εὐλογοῦντα ὑμᾶς
  choice: तुम्हें आशीष दे
  rationale: कृदंत को उद्देश्य या परिणाम के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἐν τῷ ἀποστρέφειν ἕκαστον
  choice: तुममें से हर एक को ... फेरकर
  rationale: यह आशीष मिलने के साधन और ἕκαστον के व्यक्ति-व्यक्ति पर लागू होने वाले भाव, दोनों को स्पष्ट रखता है।
- source_word: ἀπὸ τῶν πονηριῶν ὑμῶν
  choice: उसके बुरे कामों से
  rationale: बहुवचन πονηρίαι को ठोस बुरे आचरण के रूप में सहज हिन्दी में व्यक्त किया गया है; ‘उसके’ हर एक व्यक्ति के साथ व्याकरणिक सामंजस्य रखता है।
theological_decisions:
- issue: यीशु के संबंध में ἀναστήσας का अर्थ
  choice: मुख्य पाठ में ‘उठाकर’ रखा गया है और यह निर्दिष्ट नहीं किया गया कि अभिप्राय पुनरुत्थान ही है।
  alternative: ‘मरे हुओं में से जिलाकर’ अथवा ‘खड़ा करके/प्रकट करके’
  rationale: यूनानी शब्द पुनरुत्थान की ओर संकेत कर सकता है, पर किसी भविष्यद्वक्ता या सेवक को खड़ा करने की प्रतिज्ञा की प्रतिध्वनि भी हो सकता है; अनुवाद इस तनाव को खुला रखता है।
- issue: παῖς का मसीही अर्थ-संकेत
  choice: सेवक
  alternative: बालक; पुत्र
  rationale: ‘सेवक’ यशायाह की सेवक-पृष्ठभूमि को सुरक्षित रखता है और इस पद में यूनानी शब्द से अधिक स्पष्ट पुत्रत्व-संबंधी शब्दावली नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘तुम्हारे पास’ संबोधन की निकटता रखता है, जबकि वाक्य-विन्यास आशीष के साधन—बुराई से फेरना—को स्पष्ट करता है।
