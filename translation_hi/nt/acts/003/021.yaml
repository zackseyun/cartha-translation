  text: whom heaven must receive until the times of the restoration of all things that God spoke through the mouth of his holy prophets from of old.
translation:
  language: hi
  text: स्वर्ग को उसे तब तक ग्रहण किए रखना आवश्यक है, जब तक सब बातों की पुनर्स्थापना के समय न आ जाएँ, जिनके विषय में परमेश्वर ने प्राचीन काल से अपने पवित्र भविष्यवक्ताओं के मुख से कहा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖ ... οὐρανὸν ... δέξασθαι
  choice: उसे स्वर्ग में ... रहना आवश्यक है
  rationale: यूनानी में शाब्दिक भाव ‘स्वर्ग का उसे ग्रहण करना आवश्यक है’ है। हिन्दी में ‘स्वर्ग में रहना’ अधिक स्वाभाविक है और मसीह के स्वर्ग में बने रहने की समय-सीमा को व्यक्त करता है।
- source_word: ἄχρι χρόνων
  choice: उस समय तक, जब ... समय आएँगे
  rationale: ἄχρι सीमा दर्शाता है और χρόνων बहुवचन है; यह रचना हिन्दी में उस भाव को स्पष्ट और सहज रखती है।
- source_word: ἀποκαταστάσεως πάντων
  choice: सब बातों की पुनर्स्थापना
  rationale: ἀποκατάστασις का मूल भाव फिर से स्थापित करने या पूर्व दशा में लाने का है। ‘सब बातों’ से πάντων की व्यापकता बनी रहती है, बिना उसके दायरे को धर्मवैज्ञानिक रूप से सीमित या विस्तृत किए।
- source_word: ὧν ἐλάλησεν ὁ θεὸς
  choice: जिनके विषय में परमेश्वर ने ... कहा था
  rationale: 'सम्बन्धवाचक ὧν को ‘जिनके विषय में’ समझना स्वाभाविक है: परमेश्वर ने भविष्यवक्ताओं द्वारा पुनर्स्थापना से जुड़ी इन बातों की घोषणा की थी। यह वाक्यगत सम्बन्ध को स्पष्ट करता है, पर उसकी विषय-वस्तु को अतिरिक्त रूप से परिभाषित नहीं करता।'
- source_word: διὰ στόματος
  choice: मुख से
  rationale: यह भविष्यवक्ताओं को परमेश्वर की वाणी के माध्यम के रूप में दिखाने वाला सेमिटिक मुहावरा है; हिन्दी बाइबलीय शैली में ‘मुख से’ समझने योग्य और गरिमापूर्ण है।
- source_word: ἀπ’ αἰῶνος
  choice: प्राचीन काल से
  rationale: यहाँ पदबंध बहुत पुराने समय से चले आ रहे भविष्यसूचक वचन की ओर संकेत करता है; ‘प्राचीन काल से’ इसका स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ‘सब बातों की पुनर्स्थापना’ का दायरा
  choice: वाक्यांश को व्यापक और अनिर्धारित रखा गया
  alternative: इसे केवल इस्राएल की पुनर्स्थापना या सभी प्राणियों के अंतिम उद्धार के रूप में स्पष्ट करना
  rationale: मूल पाठ πάντων कहता है, पर इस एक पद में उसका पूरा धर्मवैज्ञानिक दायरा निर्धारित नहीं करता। अनुवाद को उस तनाव को बनाए रखना चाहिए।
- issue: ὧν का सम्बन्ध
  choice: ‘जिनके विषय में’—परमेश्वर की भविष्यसूचक घोषणा का विषय
  alternative: ‘जिन बातों को परमेश्वर ने कहा था’
  rationale: सम्बन्धवाचक सर्वनाम का यह अर्थ प्रसंग और हिन्दी वाक्य-विन्यास में अधिक स्पष्ट है। वैकल्पिक रूप सम्भव है, किंतु वह ‘बातों’ को परमेश्वर द्वारा बोले गए शब्दों के साथ अधिक सीधे समान ठहरा सकता है।
- issue: स्वर्ग की भूमिका
  choice: ‘उसे स्वर्ग में ... रहना आवश्यक है’
  alternative: ‘स्वर्ग का उसे ग्रहण करना आवश्यक है’
  rationale: वैकल्पिक रूप यूनानी व्याकरण के अधिक निकट है, पर हिन्दी में कृत्रिम और संभावित रूप से भ्रामक है। चुना हुआ रूप कोई अतिरिक्त सिद्धान्त जोड़े बिना अस्थायी स्वर्गीय निवास का भाव देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘पुनर्स्थापना’ मुख्य धर्मवैज्ञानिक पद के रूप में रखा गया है। वाक्य में मूल के समयगत और भविष्यसूचक सम्बन्ध सुरक्षित हैं।
