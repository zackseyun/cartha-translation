  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐπεγίνωσκον ⸀δὲ αὐτὸν ὅτι ⸀οὗτος ἦν ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος ἐπὶ τῇ Ὡραίᾳ Πύλῃ τοῦ ἱεροῦ, καὶ ἐπλήσθησαν θάμβους καὶ ἐκστάσεως ἐπὶ τῷ συμβεβηκότι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/010.yaml
  text: And they recognized him[a], that this was the man who used to sit for alms at the Beautiful Gate of the temple[b], and they were filled with amazement and astonishment at what had happened to him.
translation:
  language: hi
  text: और उन्होंने उसे पहचान लिया कि यह वही व्यक्ति था जो मन्दिर[b] के सुन्दर फाटक पर दान पाने के लिए बैठा करता था[a]। उसके साथ जो हुआ था, उस पर वे अचम्भे और विस्मय से भर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “दान पाने के लिए बैठा हुआ व्यक्ति।” यहाँ “बैठा करता था” सन्दर्भ में उसकी नियमित आदत और पहले की स्थिति को स्पष्ट करता है।'
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द ἱερόν सामान्यतः पूरे मन्दिर-परिसर को दर्शाता है, केवल भीतरी पवित्रस्थान को नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεγίνωσκον
  choice: उन्होंने उसे पहचान लिया
  rationale: यह क्रिया लोगों द्वारा उस व्यक्ति की पहचान कर लेने को व्यक्त करती है। हिन्दी कथन में पूर्ण क्रिया स्वाभाविक है, जबकि यूनानी अपूर्ण काल भीड़ में चल रही पहचान की प्रक्रिया की पृष्ठभूमि देता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है; ‘और’ बिना अनावश्यक विरोध जोड़े कथा को आगे बढ़ाता है।
- source_word: οὗτος ἦν
  choice: यह वही व्यक्ति था
  rationale: '‘वही’ संकेतवाचक बल को स्पष्ट करता है: चंगा हुआ व्यक्ति वही जाना-पहचाना आदमी था जो पहले वहाँ बैठता था।'
- source_word: ὁ πρὸς τὴν ἐλεημοσύνην καθήμενος
  choice: जो ... दान पाने के लिए बैठा करता था
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त उस व्यक्ति की नियमित, पूर्व भूमिका बताता है। ‘बैठा करता था’ इस प्रचलित क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐλεημοσύνην
  choice: दान
  rationale: सन्दर्भ में यह गरीब को दिए जाने वाले धन या उपहार का द्योतक है। ‘दान पाने’ का प्रयोग आधुनिक हिन्दी में सहज है और ‘भीख’ की सम्भावित तिरस्कारपूर्ण छाया से बचता है।
- source_word: ἐπὶ τῇ Ὡραίᾳ Πύλῃ
  choice: सुन्दर फाटक पर
  rationale: Ὡραία यहाँ फाटक का परिचित नाम है; ‘सुन्दर फाटक’ संक्षिप्त और स्वाभाविक नाम के रूप में रखा गया है।
- source_word: τοῦ ἱεροῦ
  choice: मन्दिर के
  rationale: ἱερόν पूरे मन्दिर-परिसर को सूचित कर सकता है। मुख्य पाठ में प्रचलित ‘मन्दिर’ रखा गया है और व्यापक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐπλήσθησαν
  choice: भर गए
  rationale: भाववाचक संज्ञाओं के साथ निष्क्रिय क्रिया का स्वाभाविक हिन्दी रूप ‘... से भर गए’ है।
- source_word: θάμβους καὶ ἐκστάσεως
  choice: अचम्भे और विस्मय
  rationale: दोनों शब्द तीव्र आश्चर्य के निकटवर्ती, किंतु अलग आयाम व्यक्त करते हैं। युग्म को बनाए रखने से मूल का भावात्मक जोर सुरक्षित रहता है।
- source_word: ἐπὶ τῷ συμβεβηκότι αὐτῷ
  choice: उसके साथ जो हुआ था, उस पर
  rationale: पूर्ण कृदन्त पहले घट चुकी और वर्तमान में प्रभावशाली घटना को दर्शाता है; हिन्दी भूतपूर्ण ‘हुआ था’ इस सम्बन्ध को स्पष्ट रखता है।
