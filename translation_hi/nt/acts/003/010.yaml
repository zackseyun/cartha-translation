  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘बैठा करता था’ बोलचाल में सहज रहते हुए उस व्यक्ति की पूर्व नियमित स्थिति बताता है। ‘अचम्भे और विस्मय’ मूल के दो भाववाचक शब्दों को अलग-अलग बनाए रखता है।
