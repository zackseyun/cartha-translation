id: ACT.3.25
reference: Acts 3:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὑμεῖς ἐστε ⸀οἱ υἱοὶ τῶν προφητῶν καὶ τῆς διαθήκης ἧς ⸂διέθετο ὁ θεὸς⸃ πρὸς τοὺς πατέρας ⸀ὑμῶν, λέγων πρὸς Ἀβραάμ Καὶ ἐν τῷ σπέρματί σου ⸀ἐνευλογηθήσονται πᾶσαι αἱ πατριαὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/003/025.yaml
  text: You are the sons of the prophets and of the covenant that God made with your fathers[a], saying to Abraham[b], ‘And in your offspring all the families of the earth will be blessed.’
translation:
  language: hi
  text: तुम भविष्यद्वक्ताओं के वंशज[a] और उस वाचा के उत्तराधिकारी हो, जिसे परमेश्वर ने तुम्हारे पूर्वजों के साथ बाँधी थी, जब उसने अब्राहम से कहा, ‘और तेरे वंश[b] में पृथ्वी के सभी कुल आशीष पाएँगे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘पुत्र’। यहाँ यह भविष्यद्वक्ताओं की प्रतिज्ञाओं और वाचा की विरासत में भागीदारी का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बीज’। यूनानी शब्द अब्राहम की संतति को सामूहिक रूप से दर्शा सकता है और बाइबलीय संदर्भ में किसी एक प्रतिनिधि वंशज का संकेत भी दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: संतान और ... वारिस
  rationale: शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ संबंध जैविक पुत्रत्व का नहीं बल्कि भविष्यद्वक्ताओं की विरासत और वाचा में उत्तराधिकार/भागीदारी का है। ‘संतान’ के साथ ‘वारिस’ हिंदी में इस वाचाई भाव को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: προφητῶν
  choice: भविष्यद्वक्ताओं की
  rationale: सीधा संबंधकारक अनुवाद; आशय उनकी भविष्यवाणियों और प्रतिज्ञाओं की विरासत में खड़े लोगों से है।
- source_word: διαθήκης
  choice: वाचा
  rationale: अब्राहम और पूर्वजों के संदर्भ में यह परमेश्वर की बाँधी हुई covenant को दर्शाता है; ‘वाचा’ मानक और सटीक बाइबलीय हिंदी है।
- source_word: διέθετο ὁ θεὸς
  choice: परमेश्वर ने ... बाँधा था
  rationale: διατίθεμαι और διαθήκη के संयुक्त प्रयोग का स्वाभाविक हिंदी मुहावरा ‘वाचा बाँधना’ है; यह स्थापना और संबंध दोनों को व्यक्त करता है।
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: तुम्हारे पूर्वजों के साथ
  rationale: वाचा बाँधने की संबंधपरक क्रिया के कारण πρός को हिंदी में स्वाभाविक ‘के साथ’ से व्यक्त किया गया है; πατέρες यहाँ पितृपुरुषों/पूर्वजों को सूचित करता है।
- source_word: λέγων πρὸς Ἀβραάμ
  choice: उसने अब्राहम से कहा था
  rationale: ग्रीक कृदंत को स्पष्ट हिंदी वाक्य बनाया गया है, जिससे उद्धरण का वक्ता परमेश्वर बना रहता है।
- source_word: σπέρματί
  choice: वंश
  rationale: ‘वंश’ हिंदी में सामूहिक संतति को व्यक्त करता है और एक प्रतिनिधि वंशज की संभावित ध्वनि को पूरी तरह बंद नहीं करता; ‘बीज’ यहाँ अस्वाभाविक और भ्रमकारी होता।
- source_word: ἐνευλογηθήσονται
  choice: आशीष पाएँगे
  rationale: भविष्यकालीन कर्मवाच्य का स्वाभाविक हिंदी रूप, जो आशीष के प्राप्तकर्ता होने का भाव बनाए रखता है।
- source_word: πατριαὶ
  choice: कुल
  rationale: πατριά परिवार-समूह या कुल को दर्शाता है; ‘कुल’ उत्पत्ति की प्रतिज्ञा के संदर्भ में सटीक और व्यापक है।
- source_word: γῆς
  choice: पृथ्वी
  rationale: प्रतिज्ञा का सार्वभौमिक विस्तार यहाँ ‘देश’ या ‘भूमि’ की अपेक्षा ‘पृथ्वी’ से बेहतर व्यक्त होता है।
theological_decisions:
- issue: υἱοὶ का प्रतिनिधिक और वाचाई अर्थ
  choice: संतान और उस वाचा के वारिस
  alternative: पुत्र
  rationale: ‘पुत्र’ ग्रीक रूप के अधिक निकट है, किंतु आधुनिक हिंदी में जैविक और पुरुष-मात्र अर्थ दे सकता है। संदर्भ में श्रोता भविष्यद्वक्ताओं की प्रतिज्ञाओं और वाचा के उत्तराधिकारी हैं; ‘संतान’ तथा ‘वारिस’ स्रोत के संबंध और उत्तराधिकार दोनों को व्यक्त करते हैं। पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- issue: σπέρμα का सामूहिक अथवा एकवचन प्रतिनिधिक संकेत
  choice: वंश
  alternative: बीज; वंशज
  rationale: ‘वंश’ अब्राहम की सामूहिक संतति के अर्थ को रखता है और व्यापक बाइबलीय संदर्भ में किसी एक प्रतिनिधि वंशज की संभावना को निर्णायक रूप से समाप्त नहीं करता। पादटिप्पणी इस वास्तविक अर्थगत तनाव को स्पष्ट करती है।
- issue: ἐν τῷ σπέρματί में ἐν का संबंध
  choice: तेरे वंश में
  alternative: तेरे वंश के द्वारा
  rationale: ‘में’ ग्रीक ἐν को औपचारिक रूप से सुरक्षित रखता है और स्थानिक/समावेशी तथा साधनात्मक संभावनाओं में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वाचा बाँधना’, ‘पूर्वज’, ‘वंश’ और ‘कुल’ मानक बाइबलीय हिंदी हैं। मुख्य पाठ में स्रोत की वाचाई उत्तराधिकार-ध्वनि स्पष्ट की गई है, जबकि शाब्दिक ‘पुत्र’ और σπέρμα की वास्तविक अर्थगत व्यापकता पादटिप्पणियों में सुरक्षित हैं।
