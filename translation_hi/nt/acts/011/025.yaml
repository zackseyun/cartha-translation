lexical_decisions:
- source_word: ἐξῆλθεν
  choice: गया
  rationale: यह ἐξέρχομαι का भूतकालीन रूप है। हिंदी में गंतव्य के साथ ‘तरसुस गया’ स्वाभाविक रूप से बाहर निकलकर जाने की गति व्यक्त करता है; ‘निकल गया’ यहाँ अनावश्यक प्रस्थान-बल दे सकता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है। ‘तब’ क्रम को सहज ढंग से व्यक्त करता है, बिना किसी ऐसे विरोध के जिसे ‘परन्तु’ सूचित करता।
- source_word: εἰς Ταρσόν
  choice: तरसुस
  rationale: εἰς गति के गंतव्य को दर्शाता है; हिंदी में ‘तरसुस गया’ उचित और स्वाभाविक है। नगर के नाम का मानक हिंदी लिप्यंतरण ‘तरसुस’ रखा गया है।
- source_word: ἀναζητῆσαι
  choice: ढूँढ़ने के लिए
  rationale: उद्देश्यवाचक अनंत क्रिया को सहज आधुनिक हिंदी में व्यक्त करता है। ἀναζητέω में खोजने या पता लगाने का भाव है; मुख्य पाठ का ‘ढूँढ़ना’ स्पष्ट है, जबकि अधिक सघन ‘खोज करना’ पादटिप्पणी में सुरक्षित है।
- source_word: Σαῦλον
  choice: शाऊल
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
