  yaml_path: translation/nt/acts/011/002.yaml
  text: But when Peter went up to Jerusalem[a], those of the circumcision were disputing with him.
translation:
  language: hi
  text: पर जब पतरस यरूशलेम गया, तो खतने से जुड़े लोग[a] उससे विवाद कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘खतने में से लोग’; इसका अनुवाद ‘खतनेवाले लोग,’ ‘खतना-दल के लोग,’ या ‘खतना किए हुए विश्वासी’ भी हो सकता है। यूनानी में इस समूह की पहचान खतने से उसके संबंध के आधार पर की गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: पर जब
  rationale: δέ कथा को आगे बढ़ाते हुए हल्का विरोध या परिवर्तन दिखाता है; ‘पर जब’ इस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀνέβη
  choice: गया
  rationale: यरूशलेम के साथ ἀναβαίνω का अर्थ परंपरागत रूप से ‘ऊपर जाना’ है। हिन्दी में ‘यरूशलेम गया’ अधिक स्वाभाविक है; स्थलाकृतिक भाव को कृत्रिम ‘ऊपर गया’ से नहीं थोपा गया।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: διεκρίνοντο
  choice: विवाद करने लगे
  rationale: इस प्रसंग में क्रिया मन के संदेह के बजाय पतरस से प्रत्यक्ष असहमति और तर्क-वितर्क व्यक्त करती है। अपूर्ण भूतकाल की प्रवाहमान क्रिया को हिन्दी में प्रसंगानुकूल आरंभिक रूप से व्यक्त किया गया है।
- source_word: πρὸς αὐτόν
  choice: उससे
  rationale: विवाद-सूचक क्रिया के साथ πρός उस व्यक्ति को दर्शाता है जिसके साथ विवाद किया जा रहा था; ‘उससे’ स्वाभाविक और अनावश्यक रूप से शत्रुतापूर्ण नहीं है।
- source_word: οἱ ἐκ περιτομῆς
  choice: खतने से जुड़े लोग
  rationale: शाब्दिक भाव ‘खतने में से/खतने से संबंधित लोग’ है। यह अनुवाद समूह की पहचान खतने से जोड़ता है, पर उन्हें किसी औपचारिक दल के रूप में निश्चित नहीं करता।
theological_decisions:
- issue: οἱ ἐκ περιτομῆς की पहचान
  choice: खतने से पहचाने या उससे जुड़े वे लोग जिन्होंने पतरस का विरोध किया
  alternative: सभी यहूदी विश्वासी सामान्य रूप से; या बाद के तकनीकी अर्थ में कोई औपचारिक ‘खतना-दल’
  rationale: यूनानी पद खतने के आधार पर पहचाने गए लोगों को सूचित करता है, लेकिन अपने आप यह स्पष्ट नहीं करता कि वे सभी यहूदी विश्वासी थे या एक औपचारिक दल। इसलिए अनुवाद इस अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘खतना’ सामान्य हिन्दी पाठक के लिए प्रचलित शब्द है। ‘खतने से जुड़े लोग’ मूल की समूहगत पहचान को व्यक्त करता है, जबकि ‘दल’ या ‘विश्वासी’ जैसे प्रसंगगत निष्कर्ष मुख्य पाठ में नहीं जोड़ता।
