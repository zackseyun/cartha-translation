source:
  edition: SBLGNT
  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: hi
  text: '“मैं याफा नगर में प्रार्थना कर रहा था और तंद्रा की अवस्था में मैंने एक दर्शन देखा: कोई वस्तु[a], जो एक बड़ी चादर जैसी थी, अपने चारों कोनों से स्वर्ग से नीचे उतारी जा रही थी[b], और वह मेरे पास आ पहुँची।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई पात्र”; यहाँ यूनानी शब्द किसी वस्तु या पात्र के लिए व्यापक अर्थ रखता है, जिसकी तुलना आगे एक बड़ी चादर से की गई है।
    reason: lexical_alternative
  - marker: b
    text: या “चारों सिरों से स्वर्ग से नीचे छोड़ी जा रही थी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος
  choice: मैं याफा नगर में प्रार्थना कर रहा था
  rationale: स्पष्ट प्रथम पुरुष सर्वनाम और ‘नगर’ दोनों सुरक्षित रखे गए हैं; हिंदी का अपूर्ण भूतकाल प्रार्थना की जारी क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν ἐκστάσει ὅραμα
  choice: तंद्रा की अवस्था में एक दर्शन
  rationale: 'दोनों यूनानी पदों को अलग-अलग रखा गया है: ἔκστασις दर्शनीय चेतना-अवस्था को और ὅραμα देखे गए दर्शन को बताता है। ‘तंद्रा’ रहस्यवादी परमानंद या सामान्य बेहोशी का अनावश्यक अर्थ नहीं जोड़ता।'
- source_word: σκεῦός τι
  choice: कोई वस्तु
  rationale: σκεῦος का अर्थ व्यापक रूप से वस्तु, पात्र या साधन हो सकता है। ‘कोई वस्तु’ अनिश्चित τι को सुरक्षित रखता है और अगली उपमा से पहले अर्थ को जरूरत से ज्यादा सीमित नहीं करता।
- source_word: ὡς ὀθόνην μεγάλην
  choice: मानो एक बड़ी चादर हो
  rationale: ὀθόνη कपड़े की बड़ी चादर को सूचित करता है; ‘मानो’ यूनानी तुलना ὡς को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: अपने चारों कोनों से स्वर्ग से नीचे उतारी जा रही थी
  rationale: चार छोरों/कोनों, निष्क्रिय रूप से नीचे उतारे जाने और स्वर्ग से आने—तीनों तत्वों को सुरक्षित रखा गया है। ‘कोने’ चादर की छवि के साथ हिंदी में सबसे स्वाभाविक है।
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: वह मेरे पास आ पहुँची
  rationale: ἄχρι गति की अंतिम सीमा को दर्शाता है; ‘आ पहुँची’ वस्तु के पतरस तक पहुँचने का भाव स्पष्ट करता है।
theological_decisions:
- issue: ἐκστάσει और ὅραμα के दर्शनीय शब्दों को बिना रहस्यवादी अर्थ बढ़ाए व्यक्त करना
  choice: तंद्रा की अवस्था में एक दर्शन देखा
  alternative: समाधि में एक दर्शन देखा; बेसुध होकर एक दर्शन देखा
  rationale: चुना हुआ पाठ चेतना की असामान्य अवस्था और उसमें देखे गए दर्शन—दोनों को अलग रखता है। ‘समाधि’ किसी विशिष्ट धार्मिक साधना का भाव ला सकता है, जबकि ‘बेसुध’ पूर्ण अचेतनता का संकेत दे सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। ‘याफा’ प्रचलित बाइबलीय स्थान-नाम है। वाक्य-विन्यास को हिंदी में सहज बनाने के लिए पहले कथन के बाद पूर्णविराम रखा गया है, जबकि दर्शन की सामग्री को द्विबिंदु से प्रस्तुत किया गया है।
