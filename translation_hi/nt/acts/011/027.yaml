  yaml_path: translation/nt/acts/011/027.yaml
  text: In those days prophets came down from Jerusalem to Antioch[a].
translation:
  language: hi
  text: उन दिनों यरूशलेम से भविष्यद्वक्ता अन्ताकिया में उतर आए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम से अन्ताकिया में उतर गए।” यूनानी क्रिया का अनुवाद “उतर आए” या “उतर गए” किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: उन दिनों
  rationale: यह पदबंध कथा के लिए समय-सूचक चौखटा देता है। δέ का हल्का संयोजक बल हिन्दी में अलग शब्द जोड़े बिना स्वाभाविक रूप से व्यक्त हो जाता है।
- source_word: κατῆλθον
  choice: आए
  rationale: κατέρχομαι का अर्थ ‘नीचे आना/जाना’ हो सकता है। यहाँ गंतव्य अन्ताकिया की ओर आगमन को हिन्दी में ‘आए’ स्वाभाविक रूप से व्यक्त करता है; ‘नीचे’ भौगोलिक भाव को अधिक स्पष्ट करता, पर साधारण हिन्दी में अनावश्यक रूप से भारी लग सकता है। पाठ की दिशात्मक अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: ἀπὸ Ἱεροσολύμων
  choice: यरूशलेम से
  rationale: ἀπό प्रस्थान-बिंदु बताता है। यूनानी स्थान-नाम का रूप व्याकरणतः बहुवचन है, पर हिन्दी में प्रचलित एकवचन नाम ‘यरूशलेम’ उचित है।
- source_word: προφῆται
  choice: भविष्यद्वक्ता
  rationale: यह प्रचलित और व्यापक हिन्दी बाइबलीय पद है तथा यहाँ उनकी सेवकाई की प्रकृति को अनावश्यक रूप से सीमित नहीं करता।
- source_word: εἰς Ἀντιόχειαν
  choice: अन्ताकिया
  rationale: εἰς गंतव्य की ओर गति बताता है। हिन्दी में ‘यरूशलेम से … अन्ताकिया आए’ स्वाभाविक रचना है, इसलिए अलग ‘को’ या ‘में’ आवश्यक नहीं।
theological_decisions:
- issue: यरूशलेम और अन्ताकिया की कलीसियाओं के संदर्भ में ‘भविष्यद्वक्ताओं’ की प्रकृति
  choice: προφῆται का अनुवाद केवल ‘भविष्यद्वक्ता’ किया गया है।
  alternative: भविष्यवाणी करनेवाले शिक्षक; परमेश्वर की प्रेरणा से बोलनेवाले संदेशवाहक
  rationale: यूनानी पाठ इस पद में उनकी सेवकाई की सटीक सीमा परिभाषित नहीं करता। व्यापक पद रखने से उन्हें न तो पुराने नियम के धर्मग्रंथ-लेखक भविष्यद्वक्ताओं के समान ठहराया जाता है, न केवल प्रचारकों तक सीमित किया जाता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘भविष्यद्वक्ता’ परिचित धार्मिक शब्द है। स्थान-नामों के लिए प्रचलित हिन्दी रूप ‘यरूशलेम’ और ‘अन्ताकिया’ रखे गए हैं।
