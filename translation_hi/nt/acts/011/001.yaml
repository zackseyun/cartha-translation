base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: hi
  text: प्रेरितों और यहूदिया भर में रहनेवाले भाइयों ने सुना कि गैर-यहूदियों ने भी परमेश्वर का वचन ग्रहण कर लिया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाई-बहनों”; यूनानी में “भाइयों” है, और यहाँ इसका अर्थ व्यापक रूप से साथी विश्वासी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: सुना
  rationale: ἀκούω के अओरिस्ट रूप का सीधा और स्वाभाविक अनुवाद; इससे उन्हें समाचार मिलने का भाव व्यक्त होता है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया
  rationale: यहाँ δέ मुख्यतः कथानक में अगले प्रसंग की ओर संक्रमण कराता है, प्रबल विरोध नहीं; आधुनिक हिन्दी में वाक्य-क्रम स्वयं यह संक्रमण स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἱ ἀπόστολοι
  choice: प्रेरितों
  rationale: प्रेरितों के मान्य समूह के लिए हिन्दी बाइबलीय परंपरा का सटीक और प्रचलित पद।
- source_word: οἱ ἀδελφοὶ
  choice: भाइयों
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन है। यहाँ यह सम्भवतः व्यापक विश्वासी समुदाय को भी समावेशी रूप से सूचित करता है; इस सम्भावना को पादटिप्पणी में रखा गया है।
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: यहूदिया भर में रहनेवाले
  rationale: κατά का वितरणात्मक भाव केवल ‘यहूदिया में’ नहीं, बल्कि उस पूरे क्षेत्र में फैले होने की ओर संकेत करता है।
- source_word: καὶ τὰ ἔθνη
  choice: गैर-यहूदियों ने भी
  rationale: इस प्रसंग में ἔθνη राजनीतिक राष्ट्रों के बजाय यहूदी न होनेवाले लोगों को सूचित करता है; καί उनके भी सम्मिलित होने पर बल देता है।
- source_word: ἐδέξαντο
  choice: ग्रहण किया है
  rationale: δέχομαι यहाँ संदेश को स्वीकार/ग्रहण करने का भाव देता है। हिन्दी पूर्ण वर्तमान उस घटना के समाचार मिलने से पहले घटित होने और वर्तमान प्रासंगिकता, दोनों को सहज रूप से व्यक्त करता है।
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: परमेश्वर की घोषित शुभ-संदेशात्मक वाणी के लिए स्थापित बाइबलीय अभिव्यक्ति, जो मूल के धार्मिक अनुनाद को बनाए रखती है।
theological_decisions:
- issue: मिश्रित विश्वासी समुदाय के संदर्भ में ἀδελφοὶ का अनुवाद
  choice: भाइयों
  alternative: भाई-बहनों; विश्वासियों
  rationale: मूल का व्याकरणिक पुल्लिंग रूप सुरक्षित रखा गया है, जबकि उसके सम्भावित प्रतिनिधिक और समावेशी अर्थ को पादटिप्पणी स्पष्ट करती है; इस तरह न तो मूल रूप मिटता है और न समुदाय की सम्भावित व्यापकता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली। ‘गैर-यहूदी’ प्रसंगानुकूल स्पष्टता देता है; ‘परमेश्वर का वचन’ स्थापित बाइबलीय पदावली को बनाए रखता है।
