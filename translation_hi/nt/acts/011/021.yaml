  yaml_path: translation/nt/acts/011/021.yaml
  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: hi
  text: और प्रभु का हाथ[a] उनके साथ था, और विश्वास करने वाले[b] बहुत-से लोग प्रभु की ओर मुड़ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रभु का हाथ’ बाइबल में प्रभु की सक्रिय सामर्थ्य या कृपा के लिए प्रयुक्त रूपक है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘विश्वास करके।’
    reason: lexical_alternative
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: प्रभु का हाथ
  rationale: यह बाइबलीय रूपक प्रभु की सक्रिय सामर्थ्य, उपस्थिति और कृपा को व्यक्त करता है। शाब्दिक रूप रखने से मूल रूपक और पुराने नियम से उसका संबंध सुरक्षित रहता है।
- source_word: κύριος
  choice: प्रभु
  rationale: ‘प्रभु’ κύριος का स्वाभाविक और प्रतिष्ठित हिन्दी समतुल्य है। यहाँ संदर्भ यीशु की ओर संकेत कर सकता है, पर अनुवाद मूल पाठ से आगे जाकर संदर्भ को स्पष्ट नहीं करता।
- source_word: μετ’ αὐτῶν
  choice: उनके साथ
  rationale: सम्बन्धकारक के साथ μετά का सामान्य अर्थ ‘साथ’ है; यहाँ यह प्रचारकों के साथ प्रभु की उपस्थिति और सहायता दर्शाता है।
- source_word: πολύς τε ἀριθμός
  choice: बहुत-से लोग
  rationale: शाब्दिक ‘एक बड़ी संख्या’ आधुनिक हिन्दी में अस्वाभाविक है। ‘बहुत-से लोग’ व्यक्तियों की बड़ी संख्या का अर्थ सहज रूप से देता है।
- source_word: ὁ πιστεύσας
  choice: विश्वास करनेवाले
  rationale: संज्ञीकृत एओरिस्ट कृदन्त सामूहिक रूप से उन लोगों का वर्णन करता है जिन्होंने विश्वास किया। यह रूप कृदन्त की संरचना बनाए रखता है, यद्यपि विश्वास और फिरने के आपसी संबंध को अत्यधिक निश्चित नहीं करता।
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: प्रभु की ओर फिर गए
  rationale: यह वाक्यांश प्रभु की ओर परिवर्तन या उन्मुख होने को दर्शाता है। ‘फिर गए’ मूल दिशा-रूपक को बनाए रखता है और पाठ में स्पष्ट रूप से न आए ‘पश्चाताप’ जैसे शब्द को नहीं जोड़ता।
theological_decisions:
- issue: दोनों स्थानों पर ‘प्रभु’ का संदर्भ
  choice: दोनों बार κύριος का अनुवाद केवल ‘प्रभु’ किया गया है।
  alternative: संदर्भ को स्पष्ट करते हुए ‘यीशु’ या ‘परमेश्वर’ कहना।
  rationale: प्रेरितों के काम में यह उपाधि संदर्भानुसार यीशु की ओर संकेत कर सकती है, विशेषकर लोगों के प्रभु की ओर फिरने के प्रसंग में; फिर भी यूनानी पाठ केवल κύριος कहता है। ‘प्रभु’ रखने से मूल पाठ का खुलापन सुरक्षित रहता है।
- issue: विश्वास और प्रभु की ओर फिरने का संबंध
  choice: ‘विश्वास करनेवाले ... प्रभु की ओर फिर गए’
  alternative: ‘विश्वास करके ... प्रभु की ओर फिर गए’
  rationale: एओरिस्ट कृदन्त को समय या साधन के रूप में समझा जा सकता है, पर मूल संरचना केवल समूह को ‘विश्वास करनेवाले’ कहकर वर्णित करती है। मुख्य पाठ अनावश्यक रूप से कठोर कालक्रम निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘प्रभु का हाथ’ जैसा मुख्य बाइबलीय रूपक सुरक्षित रखा गया है; ‘बहुत-से लोग’ शाब्दिक किन्तु अस्वाभाविक ‘एक बड़ी संख्या’ के स्थान पर स्वाभाविक हिन्दी है।
