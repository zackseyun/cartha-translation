  yaml_path: translation/nt/acts/011/024.yaml
  text: For he was a good man[a], full of the Holy Spirit and of faith. And a considerable crowd was added to the Lord.
translation:
  language: hi
  text: क्योंकि वह एक भला मनुष्य था और पवित्र आत्मा तथा विश्वास से परिपूर्ण था। और एक बड़ी भीड़ प्रभु से जुड़ गई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु से जोड़ दी गई।” “विश्वास” का अर्थ यहाँ “विश्वासयोग्यता” भी हो सकता है।
    reason: προσετέθη के निष्क्रिय भाव के एक निकट वैकल्पिक हिन्दी रूप और πίστεως के संभावित वैकल्पिक अर्थ को सुरक्षित रखता है।
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्वाभाविक संयोजक है।
- source_word: ἀνὴρ ἀγαθὸς
  choice: एक भला मनुष्य
  rationale: पुल्लिंग संदर्भ और नैतिक गुण दोनों सुरक्षित रहते हैं; ‘भला’ सहज और गरिमापूर्ण हिन्दी है।
- source_word: πλήρης πνεύματος ἁγίου καὶ πίστεως
  choice: पवित्र आत्मा तथा विश्वास से परिपूर्ण
  rationale: दोनों संबंधकारक पदों को ‘से परिपूर्ण’ के अधीन रखते हुए यूनानी संरचना और अर्थ सुरक्षित रखे गए हैं।
- source_word: πίστεως
  choice: विश्वास
  rationale: πίστις का सामान्य अर्थ ‘विश्वास’ यहाँ उपयुक्त है; चरित्र-वर्णन के कारण ‘विश्वासयोग्यता’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: ὄχλος ἱκανὸς
  choice: बहुत-से लोग
  rationale: शाब्दिक ‘काफी बड़ी भीड़’ की अपेक्षा यह वर्तमान हिन्दी में उन व्यक्तियों की बड़ी संख्या अधिक स्वाभाविक रूप से व्यक्त करता है जो प्रभु से जुड़े।
- source_word: προσετέθη ... τῷ κυρίῳ
  choice: प्रभु में आ मिले
  rationale: निष्क्रिय यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और स्पष्ट वस्तु ‘प्रभु’ को बनाए रखता है; इसे कलीसिया में जुड़ने से नहीं बदला गया।
theological_decisions:
- issue: πνεύματος ἁγίου का आशय
  choice: व्यक्तिगत ईश्वरीय पवित्र आत्मा
  alternative: पवित्र स्वभाव या आत्मिक प्रवृत्ति
  rationale: लूका-प्रेरितों के काम में यह पद सामान्यतः पवित्र आत्मा का निर्देश करता है और यहाँ बरनबास के आत्मा-सामर्थ्य से युक्त चरित्र का वर्णन है।
- issue: πίστεως का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता
  rationale: ‘विश्वास’ प्राथमिक और व्यापक अर्थ है, पर चरित्र-वर्णन में ‘विश्वासयोग्यता’ भी संभव है; विकल्प पादटिप्पणी में सुरक्षित है।
- issue: प्रभु से जोड़े जाने की अभिव्यक्ति
  choice: प्रभु में आ मिले
  alternative: कलीसिया या समुदाय में जोड़े गए
  rationale: मूल पाठ स्पष्ट रूप से ‘प्रभु’ कहता है; सामुदायिक समावेश निहित हो सकता है, पर उसे मूल के प्रत्यक्ष कर्म के स्थान पर नहीं रखा गया।
