  text: εἰς ἣν ἀτενίσας κατενόουν καὶ εἶδον τὰ τετράποδα τῆς γῆς καὶ τὰ θηρία καὶ τὰ ἑρπετὰ καὶ τὰ πετεινὰ τοῦ οὐρανοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: hi
  text: मैंने उसमें टकटकी लगाकर देखा और उसका ध्यान से निरीक्षण कर रहा था; तब मैंने पृथ्वी के चौपाए, जंगली पशु, रेंगने वाले जीव[a] और आकाश के पक्षी देखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सरीसृप।” यूनानी शब्द का अर्थ अधिक व्यापक रूप से रेंगने या जमीन पर सरकने वाले जीव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: उसमें
  rationale: यह स्त्रीलिंग संबंधवाचक पद पिछले पद में आए चादर-जैसे पात्र की ओर संकेत करता है। ἀτενίζω के साथ εἰς दृष्टि के भीतर की ओर जाने का भाव देता है।
- source_word: ἀτενίσας
  choice: टकटकी लगाकर ध्यान से देखा
  rationale: यह केंद्रित और लगातार दृष्टि गड़ाने का भाव व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: κατενόουν
  choice: उस पर गौर करने लगा
  rationale: अपूर्ण भूतकाल ongoing attentive consideration को दिखाता है और आगे के पूर्ण दृश्य-बोध εἶδον से भेद बनाए रखता है।
- source_word: εἶδον
  choice: मैंने … देखे
  rationale: साधारण भूतकाल दृश्य को स्पष्ट रूप से देखने की घटना को व्यक्त करता है।
- source_word: τὰ τετράποδα τῆς γῆς
  choice: पृथ्वी के चौपाए
  rationale: ‘चौपाए’ सामान्य पाठक के लिए सहज है और यूनानी वर्गीकरण तथा ‘पृथ्वी के’ संबंध को बनाए रखता है।
- source_word: τὰ θηρία
  choice: जंगली पशु
  rationale: यह τετράποδα की व्यापक श्रेणी से अलग जंगली पशुओं का अर्थ स्पष्ट करता है।
- source_word: τὰ ἑρπετὰ
  choice: रेंगनेवाले जीव
  rationale: यह यूनानी शब्द की व्यापक श्रेणी को बनाए रखता है और केवल आधुनिक जैविक वर्ग ‘सरीसृप’ तक अर्थ को सीमित नहीं करता।
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: आकाश के पक्षी
  rationale: इस प्राणी-सूची में πετεινά के लिए ‘पक्षी’ स्वाभाविक है और ‘आकाश के’ ठोस स्थान-संबंध को व्यक्त करता है।
theological_decisions:
- issue: सृष्टि और शुद्धता-विधि से संबंधित प्राणी-वर्गों की व्यापकता
  choice: ‘रेंगनेवाले जीव’ द्वारा व्यापक वर्ग-भाषा को बनाए रखा गया
  alternative: ‘सरीसृप’
  rationale: यूनानी ἑρπετά आधुनिक जैविक अर्थ में केवल reptiles तक सीमित नहीं है; व्यापक अनुवाद बाइबलीय वर्गीकरण की प्रतिध्वनि को बिना किसी धर्मसिद्धान्तीय निष्कर्ष के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘टकटकी लगाकर’ और ‘गौर करने लगा’ क्रमशः ἀτενίσας की केंद्रित दृष्टि तथा κατενόουν की जारी विचारपूर्ण जाँच के बीच भेद बनाए रखते हैं।
