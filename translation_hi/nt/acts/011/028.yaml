source:
  edition: SBLGNT
  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: hi
  text: उनमें से अगबुस नाम का एक व्यक्ति खड़ा हुआ और उसने आत्मा के द्वारा संकेत दिया कि पूरे बसे हुए संसार में एक बड़ा अकाल पड़ने वाला था[a]—और यह क्लौदियुस के समय में हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरे संसार में”; लूका और प्रेरितों के काम में “बसा हुआ संसार” विशेष रूप से रोमी जगत की ओर भी संकेत कर सकता है।
    reason: οἰκουμένη के व्यापक तथा रोमी-जगत-संबंधी दोनों सम्भावित अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἀναστὰς
  choice: खड़ा हुआ
  rationale: सभा में अगबुस के उठकर बोलने की क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐσήμανεν
  choice: संकेत दिया
  rationale: यह σημαίνω के ‘संकेत देना/जताना’ अर्थ को बनाए रखता है और कथन को अनावश्यक रूप से किसी निश्चित भविष्यवाणी-सूत्र में नहीं बदलता।
- source_word: διὰ τοῦ πνεύματος
  choice: आत्मा के द्वारा
  rationale: διά के साधन अथवा कर्तृत्व के भाव को व्यक्त करता है। प्रसंग में ‘आत्मा’ से पवित्र आत्मा अभिप्रेत है; मूल में न पाए जाने वाले विशेषण ‘पवित्र’ को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: λιμὸν μεγάλην
  choice: एक बड़ा अकाल
  rationale: विशेषण μεγάλην के सीधे अर्थ ‘बड़ा’ को सुरक्षित रखता है; ‘भयंकर’ या ‘भीषण’ सम्भव अर्थ हैं, पर अधिक व्याख्यात्मक होते।
- source_word: μέλλειν ἔσεσθαι
  choice: पड़ने वाला है
  rationale: अकाल के साथ स्वाभाविक हिन्दी मुहावरा है और μέλλω के आसन्न अथवा अपेक्षित भविष्य के भाव को व्यक्त करता है।
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: सारे बसे हुए संसार में
  rationale: οἰκουμένη के शाब्दिक दायरे को बनाए रखता है और मुख्य पाठ में उसे पहले से केवल ‘रोमी संसार’ तक सीमित नहीं करता।
- source_word: ἐγένετο
  choice: हुआ
  rationale: घटना के घटित होने को सरल, स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ Κλαυδίου
  choice: क्लौदियुस के समय में
  rationale: शासक के काल को सूचित करने वाले ἐπί + संबंधकारक का सुलभ और सटीक हिन्दी रूप है।
theological_decisions:
- issue: διὰ τοῦ πνεύματος में ‘आत्मा’ का संदर्भ
  choice: प्रसंगानुसार पवित्र आत्मा अभिप्रेत है, पर पाठ में ‘आत्मा’ रखा गया है
  alternative: ‘पवित्र आत्मा के द्वारा’
  rationale: प्रेरितों के काम में भविष्यसूचक प्रकाशन के प्रसंग में ‘आत्मा’ सामान्यतः पवित्र आत्मा को दर्शाता है। फिर भी यूनानी पाठ में ‘पवित्र’ विशेषण नहीं है, इसलिए हिन्दी मुख्य पाठ स्रोत की संक्षिप्तता बनाए रखता है।
- issue: οἰκουμένη का दायरा
  choice: ‘सारा बसा हुआ संसार’
  alternative: ‘सारा संसार’ अथवा ‘सारा रोमी संसार’
  rationale: शब्द व्यापक रूप से बसे हुए संसार को और प्रसंगानुसार रोमी जगत को भी दर्शा सकता है। मुख्य पाठ में व्यापक शब्दावली और पादटिप्पणी में सम्भावित सीमित अर्थ रखने से मूल की अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अकाल पड़ना’ स्वाभाविक हिन्दी प्रयोग है। पादटिप्पणी-चिह्न उसी पदबंध के बाद रखा गया है जिसकी व्याख्या पादटिप्पणी करती है।
