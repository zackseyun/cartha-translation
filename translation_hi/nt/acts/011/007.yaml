  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστάς
  choice: उठ
  rationale: संदर्भ में यह उठकर कार्य करने की सीधी आज्ञा है; आधुनिक हिंदी में संक्षिप्त और स्वाभाविक।
- source_word: θῦσον
  choice: मार
  rationale: यहाँ पशुओं को भोजन के लिए मारने का भाव है। ‘बलि चढ़ा’ अनावश्यक धार्मिक अर्थ ला सकता है और ‘वध कर’ सामान्य पाठक के लिए अपेक्षाकृत औपचारिक है।
- source_word: φάγε
  choice: खा
  rationale: मूल की सीधी एकवचन आज्ञा को सहज हिंदी में सुरक्षित रखता है।
- source_word: φωνῆς λεγούσης μοι
  choice: एक आवाज़ भी सुनी, जो मुझसे कह रही थी
  rationale: ग्रीक संबंधवाचक कृदंत के आशय को स्वाभाविक हिंदी वाक्य-विन्यास में व्यक्त करता है।
