  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: hi
  text: जब वह वहाँ पहुँचा और उसने परमेश्वर का अनुग्रह देखा[a], तो वह आनन्दित हुआ और उन सब से आग्रह करता रहा कि वे अपने हृदय में दृढ़ निश्चय करके प्रभु के साथ बने रहें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर की कृपा।” यह पद उनके बीच परमेश्वर के अनुग्रह से हुए दिखाई देने वाले कार्य की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “प्रभु के प्रति समर्पित बने रहें” अथवा “प्रभु के प्रति विश्वासयोग्य बने रहें।”
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: वहाँ पहुँचा
  rationale: यह आगमन को व्यक्त करने वाला भूतकालिक कृदन्त है। ‘वहाँ पहुँचा’ प्रसंग के स्थान-संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἰδὼν
  choice: देखा
  rationale: ὁράω का सामान्य दृश्यार्थ रखा गया है; प्रसंग में परमेश्वर के कार्य को पहचानने का भाव हो सकता है, पर अनुवाद उसे स्पष्ट व्याख्या में नहीं बदलता।
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: परमेश्वर का अनुग्रह
  rationale: ‘अनुग्रह’ χάρις का धर्मवैचारिक भार बनाए रखता है और यहाँ दिखाई देने वाले परमेश्वर के कृपापूर्ण कार्य को समेट सकता है, बिना इसे केवल ‘परमेश्वर ने जो किया’ कहकर सीमित किए।
- source_word: ἐχάρη
  choice: आनन्दित हुआ
  rationale: यह क्रिया प्रसन्न होने या आनन्द मनाने का भाव देती है। ‘आनन्दित हुआ’ गरिमापूर्ण और सहज आधुनिक हिन्दी है।
- source_word: παρεκάλει
  choice: आग्रह करता रहा
  rationale: अपूर्ण भूतकाल बार-बार या लगातार किए गए प्रोत्साहनपूर्ण आग्रह को सूचित करता है। यह रूप उस निरन्तरता और उपदेशात्मक बल दोनों को व्यक्त करता है।
- source_word: πάντας
  choice: उन सब से
  rationale: यह अन्ताकिया के सभी सम्बद्ध विश्वासियों की ओर संकेत करता है; हिन्दी में परोक्ष कर्म के साथ ‘से’ स्वाभाविक है।
- source_word: τῇ προθέσει τῆς καρδίας
  choice: हृदय के दृढ़ संकल्प के साथ
  rationale: πρόθεσις उद्देश्य या निश्चय और καρδία भीतरी इच्छा तथा संकल्प को दर्शाता है। ‘दृढ़ संकल्प’ प्रसंगगत स्थिरता व्यक्त करता है, जबकि ‘हृदय’ मूल रूपक को बनाए रखता है।
- source_word: προσμένειν
  choice: जुड़े रहें
  rationale: προσμένω यहाँ किसी के साथ बने रहने और उससे निरन्तर सम्बद्ध रहने का भाव देता है। ‘जुड़े रहें’ आधुनिक हिन्दी में स्थायी लगाव को स्वाभाविक रूप से व्यक्त करता है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: τῷ κυρίῳ
  choice: प्रभु से
  rationale: κύριος का मानक रूप ‘प्रभु’ रखा गया है। ‘जुड़े रहें’ के साथ हिन्दी में ‘से’ अपेक्षित परसर्ग है; प्रेरितों के काम के प्रसंग में संकेत जी उठे यीशु की ओर है, पर अनुवाद मूल उपाधि को ही रखता है।
theological_decisions:
- issue: ‘परमेश्वर का अनुग्रह’ का प्रसंगगत अर्थ
  choice: अन्ताकिया के विश्वासियों के बीच दिखाई देने वाला परमेश्वर का कृपापूर्ण कार्य
  alternative: परमेश्वर की कृपापूर्ण मनोवृत्ति; विश्वासियों की कृपालुता
  rationale: प्रसंग प्रत्यक्ष रूप से पहचाने जा सकने वाले ईश्वरीय अनुग्रह की ओर संकेत करता है। फिर भी मुख्य पाठ में ‘अनुग्रह’ ही रखा गया है, ताकि इसे केवल किसी एक प्रभाव या कार्य तक सीमित न किया जाए।
- issue: προσμένειν τῷ κυρίῳ का बल
  choice: प्रभु के साथ निरन्तर और दृढ़ता से जुड़े रहना
  alternative: प्रभु के साथ बने रहना; प्रभु के प्रति विश्वासयोग्य बने रहना
  rationale: यूनानी पद स्थायी संगति, लगाव या निष्ठा व्यक्त कर सकता है। ‘प्रभु से जुड़े रहें’ इस व्यापकता को सहज हिन्दी में रखता है और बाद की किसी विशिष्ट सिद्धान्तगत परिभाषा को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज रखी गई है। अपूर्ण भूतकाल को ‘करता रहा’ से व्यक्त किया गया है। ‘हृदय के दृढ़ संकल्प’ में बाइबलीय हृदय-रूपक सुरक्षित है, जबकि ‘प्रभु से जुड़े रहें’ मूल की सम्बन्धपरक अस्पष्टता को स्वाभाविक हिन्दी में बनाए रखता है।
