  text: ὃς λαλήσει ῥήματα πρὸς σὲ ἐν οἷς σωθήσῃ σὺ καὶ πᾶς ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: hi
  text: वह तुमसे ऐसी बातें कहेगा, जिनके द्वारा तुम और तुम्हारे घराने के सब लोग उद्धार पाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिनमें”; यूनानी अभिव्यक्ति यह दर्शाती है कि ये बातें उद्धार का माध्यम हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: वह
  rationale: यह संबंधवाचक सर्वनाम पिछले प्रसंग में बताए गए व्यक्ति को सूचित करता है; स्वतंत्र हिन्दी वाक्य में ‘वह’ स्वाभाविक है।
- source_word: λαλήσει ῥήματα πρὸς σὲ
  choice: तुमसे ऐसी बातें कहेगा
  rationale: ‘कहेगा’ भविष्यकाल को और ‘तुमसे’ श्रोता की ओर संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है। ῥήματα के बहुवचन को ‘बातें’ से रखा गया है; ‘ऐसी’ आगे आने वाले संबंधवाचक वाक्य से इसे सहजता से जोड़ता है।
- source_word: ἐν οἷς
  choice: जिनके द्वारा
  rationale: 'यहाँ ἐν साधन का भाव देता है: कही गई बातें उद्धार पहुँचने का माध्यम हैं। ‘जिनके द्वारा’ इस अर्थ को स्पष्ट रखते हुए मूल अभिव्यक्ति की सीमा में रहता है।'
- source_word: σωθήσῃ
  choice: उद्धार पाएँगे
  rationale: σῴζω का निष्क्रिय भविष्यरूप यहाँ सुसमाचार-संबंधी उद्धार को सूचित करता है। संयुक्त कर्ता के कारण हिन्दी में बहुवचन ‘पाएँगे’ प्रयुक्त है।
- source_word: σὺ καὶ πᾶς ὁ οἶκός σου
  choice: तुम और तुम्हारे घराने के सब लोग
  rationale: स्पष्ट σὺ को ‘तुम’ से रखा गया है। οἶκος यहाँ भवन नहीं, परिवार/गृहस्थी के लोगों का समूह है; ‘घराने के सब लोग’ साधारण आधुनिक हिन्दी में इसका सामूहिक और मानवीय अर्थ स्पष्ट करता है।
theological_decisions:
- issue: कुरनेलियुस के घराने के प्रसंग में σωθήσῃ का अर्थ
  choice: उद्धार पाएँगे
  alternative: बचाए जाएँगे
  rationale: प्रसंग सुसमाचार सुनने और उद्धार पाने का है। अनुवाद उद्धार के धार्मिक अर्थ को बनाए रखता है, पर उसकी प्रक्रिया के विषय में पद से आगे कोई सिद्धान्त नहीं जोड़ता।
- issue: ‘तुम्हारे घराने के सब लोग’ का दायरा
  choice: सारे घराने को प्रतिज्ञा के दायरे में सामूहिक रूप से रखा गया है
  alternative: इसे प्रत्येक सदस्य के प्रत्युत्तर से निरपेक्ष स्वतः उद्धार के रूप में स्पष्ट करना
  rationale: मूल पाठ घराने के सभी लोगों का उल्लेख करता है, पर इसी पद में प्रत्येक के सहभागी होने की रीति नहीं बताता। इसलिए न स्वतः उद्धार जोड़ा गया है, न उसे नकारने वाली कोई व्याख्या।
- issue: ἐν οἷς में माध्यम का भाव
  choice: जिनके द्वारा
  alternative: जिनमें
  rationale: साधनार्थक अर्थ प्रसंग में उपयुक्त है, फिर भी पादटिप्पणी मूल यूनानी की अधिक शाब्दिक वैकल्पिक अभिव्यक्ति को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घराना’ बाइबलीय संदर्भ में परिचित है, और ‘के सब लोग’ जोड़ने से यह स्पष्ट होता है कि आशय भवन नहीं बल्कि उससे जुड़े लोग हैं।
