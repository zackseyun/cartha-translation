id: ACT.11.22
reference: Acts 11:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: hi
  text: उनके विषय में समाचार यरूशलेम की कलीसिया के कानों तक पहुँचा[a], और उन्होंने बरनबास को अन्ताकिया तक भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके विषय की बात यरूशलेम की कलीसिया ने सुनी”; शाब्दिक रूप से, “उनके विषय की बात यरूशलेम की कलीसिया के कानों में सुनी गई।”
    reason: मूल यूनानी की निष्क्रिय रचना और उसके शाब्दिक मुहावरे का वैकल्पिक रूप देना।
lexical_decisions:
- source_word: ἠκούσθη
  choice: पहुँचा
  rationale: क्रिया का मूल रूप निष्क्रिय है, ‘सुना गया,’ पर εἰς τὰ ὦτα के साथ यह सूचना के किसी के ध्यान में आने का मुहावरा है। हिंदी में ‘कानों तक पहुँचा’ स्वाभाविक ढंग से वही भाव व्यक्त करता है।
- source_word: ὁ λόγος
  choice: समाचार
  rationale: इस प्रसंग में λόγος किसी भाषण या धर्मवैज्ञानिक ‘वचन’ के बजाय अन्ताकिया में हुई घटनाओं की खबर को दर्शाता है।
- source_word: εἰς τὰ ὦτα
  choice: कानों तक
  rationale: यूनानी बिंब को बनाए रखते हुए यह हिंदी में सूचना के किसी समुदाय तक पहुँचने का स्वाभाविक मुहावरा है।
- source_word: ἐκκλησίας
  choice: कलीसिया
  rationale: प्रेरितों के काम में यह मसीही समुदाय को दर्शाता है; ‘कलीसिया’ हिंदी बाइबलीय प्रयोग में प्रचलित और संदर्भानुकूल है।
- source_word: τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: यरूशलेम की
  rationale: सहभागी पदबंध उस कलीसिया की पहचान उसके स्थान से कराता है; हिंदी में संबंधकारक रचना संक्षिप्त और स्वाभाविक है।
- source_word: περὶ αὐτῶν
  choice: उनके विषय में
  rationale: बहुवचन सर्वनाम का स्वाभाविक संबंध पिछले प्रसंग में बताए गए लोगों, और उनसे जुड़ी घटनाओं, से है; अनुवाद उसी अस्पष्ट विस्तार को पूरी तरह सीमित नहीं करता।
- source_word: ἐξαπέστειλαν
  choice: उन्होंने … भेजा
  rationale: संयुक्त क्रिया का अर्थ ‘भेजना/रवाना करना’ है। हिंदी में ‘भेजा’ स्वाभाविक है और अनावश्यक रूप से किसी औपचारिक नियुक्ति का भाव नहीं जोड़ता।
- source_word: Βαρναβᾶν
  choice: बरनबास
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: ἕως Ἀντιοχείας
  choice: अन्ताकिया तक
  rationale: ἕως स्थानगत सीमा अथवा गंतव्य व्यक्त कर सकता है; ‘तक’ यूनानी अभिव्यक्ति की सीमा-संबंधी छाया को बनाए रखता है।
- source_word: δὲ
  choice: वाक्य-संयोजन में निहित
  rationale: δὲ हल्का कथात्मक संयोजक है। अलग से ‘अब’ जोड़ना हिंदी में अनावश्यक कालगत अर्थ दे सकता है; अगले खंड का ‘और’ कथा के प्रवाह को स्वाभाविक रूप से आगे बढ़ाता है।
theological_decisions:
- issue: ‘उन्होंने भेजा’ का कर्ता
  choice: सर्वनाम ‘उन्होंने’ का निकटतम पूर्वपद यरूशलेम की कलीसिया है, इसलिए कलीसिया को सामूहिक कर्ता रहने दिया गया है।
  alternative: इसे विशेष रूप से प्रेरितों, प्राचीनों या कलीसिया के अन्य अगुओं का निर्णय बताना।
  rationale: मूल पाठ किसी संकुचित नेतृत्व-समूह का नाम नहीं लेता। अनुवाद ऐसी कलीसियाई शासन-व्यवस्था नहीं जोड़ता जिसे पद स्वयं स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘कानों तक पहुँचा’ मूल बिंब को बचाता है, जबकि ‘समाचार’ कथात्मक संदर्भ को स्पष्ट करता है। ‘कलीसिया,’ ‘यरूशलेम,’ ‘बरनबास’ और ‘अन्ताकिया’ के प्रचलित हिंदी बाइबलीय रूप रखे गए हैं।
