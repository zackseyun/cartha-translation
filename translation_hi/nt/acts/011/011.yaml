lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: वृत्तांत में अचानक आए महत्त्वपूर्ण घटनाक्रम की ओर ध्यान खींचने वाले संकेत को स्पष्ट और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: ἐξαυτῆς
  choice: उसी क्षण
  rationale: पूर्ववर्ती घटना के साथ तात्कालिक समय-संबंध और ‘ठीक तभी’ का भाव व्यक्त करता है।
- source_word: τρεῖς ἄνδρες
  choice: तीन पुरुष
  rationale: संख्या और पुरुषवाचक संज्ञा का सीधा, संदर्भानुकूल अनुवाद है।
- source_word: ἐπέστησαν ἐπὶ τὴν οἰκίαν
  choice: उस घर पर आ पहुँचे
  rationale: यहाँ क्रिया का आशय उस स्थान पर पहुँचकर उपस्थित हो जाना है; ‘आ पहुँचे’ उसके सजीव कथात्मक बल को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐν ᾗ ἦμεν
  choice: जहाँ हम थे
  rationale: मूल के साधारण स्थानवाचक कथन को बिना ‘ठहरे हुए’ जैसी अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
- source_word: ἀπεσταλμένοι
  choice: उन्हें ... भेजा गया था
  rationale: पूर्ण निष्क्रिय कृदंत से प्रकट उनके पहुँचने से पहले भेजे जाने की क्रिया को हिंदी में स्पष्ट करता है।
- source_word: ἀπὸ Καισαρείας πρός με
  choice: कैसरिया से मेरे पास
  rationale: ἀπό से उद्गम-स्थान और πρός से पतरस की ओर भेजे जाने की दिशा को सीधे व्यक्त करता है।
