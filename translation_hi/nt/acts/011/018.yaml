source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: hi
  text: ये बातें सुनकर वे शांत हो गए और यह कहते हुए परमेश्वर की महिमा की, “तो फिर परमेश्वर ने गैर-यहूदियों[a] को भी वह पश्चाताप दिया है, जो जीवन की ओर ले जाता है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जातियों” या “राष्ट्रों।” यहाँ इसका अर्थ यहूदी न होने वाले लोग है।
    reason: lexical_alternative
  - marker: b
    text: इसे “जीवन के लिए पश्चाताप” या “जीवन तक पहुँचाने वाला पश्चाताप” भी अनुवाद किया जा सकता है। यूनानी पदबंध लक्ष्य अथवा परिणाम का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: ये बातें सुनकर
  rationale: कालवाचक कृदंत को स्वाभाविक हिन्दी में रखा गया है; δέ यहाँ हल्का संयोजक है और अलग शब्द के बिना प्रवाह में समाहित है।
- source_word: ἡσύχασαν
  choice: वे शांत हो गए
  rationale: यह विरोध या आपत्ति बंद करके शांत हो जाने का भाव व्यक्त करता है।
- source_word: ἐδόξασαν τὸν θεόν
  choice: परमेश्वर की महिमा करने लगे
  rationale: δοξάζω के धार्मिक भार को ‘महिमा करना’ सुरक्षित रखता है; हिन्दी में प्रतिक्रिया के आरम्भ को स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: Ἄρα καὶ
  choice: तो फिर ... भी
  rationale: Ἄρα से निकाले गए निष्कर्ष और καί से समावेश के बल—दोनों को स्पष्ट किया गया है।
- source_word: τοῖς ἔθνεσιν
  choice: गैर-यहूदियों
  rationale: इस प्रसंग में ἔθνη राजनीतिक राष्ट्रों के बजाय यहूदी न होने वाले लोगों को दर्शाता है।
- source_word: τὴν μετάνοιαν
  choice: वह मन-फिराव
  rationale: ‘मन-फिराव’ μετάνοια के दिशा-परिवर्तन और आंतरिक बदलाव को व्यक्त करता है; ‘वह’ यूनानी निश्चित पदबंध और आगे आने वाले विशेषणात्मक वाक्यांश से मेल खाता है।
- source_word: εἰς ζωὴν
  choice: जो जीवन की ओर ले जाता है
  rationale: εἰς के लक्ष्य अथवा परिणाम के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करते हुए उसकी वास्तविक अर्थगत गुंजाइश बनाए रखी गई है।
- source_word: ἔδωκεν
  choice: दिया है
  rationale: परमेश्वर को कर्ता और मन-फिराव को दी गई वस्तु के रूप में सुरक्षित रखा गया है; पूर्ण क्रिया के वर्तमान महत्व को हिन्दी पूर्णकाल व्यक्त करता है।
theological_decisions:
- issue: मन-फिराव का परमेश्वर द्वारा दिया जाना
  choice: परमेश्वर ने ... मन-फिराव दिया है
  alternative: लोगों को मन फिराने का अवसर दिया है
  rationale: यूनानी पाठ स्वयं μετάνοια को परमेश्वर द्वारा दी गई वस्तु के रूप में प्रस्तुत करता है। ‘अवसर’ जोड़ना पाठ के कथन को हल्का कर देता; वहीं अनुग्रह और मानवीय प्रत्युत्तर के संबंध पर इससे आगे कोई सिद्धान्त आरोपित नहीं किया गया है।
- issue: εἰς ζωήν में लक्ष्य या परिणाम
  choice: जीवन की ओर ले जाता है
  alternative: जीवन के लिए / जीवन का परिणाम देने वाला
  rationale: पदबंध जीवन की दिशा, लक्ष्य या परिणाम व्यक्त कर सकता है; मुख्य पाठ स्वाभाविक हिन्दी में इस गतिशील संबंध को रखता है और टिप्पणी विकल्पों को दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण रूप अपनाया गया है। ‘गैर-यहूदी’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘मन-फिराव’ केवल पछतावे के बजाय दिशा और मन के बदलाव का व्यापक भाव बनाए रखता है।
