lexical_decisions:
- source_word: λέγοντες
  choice: वे कहने लगे
  rationale: वर्तमान कृदन्त पिछले कथानक से जुड़कर आरोप के कथन का परिचय देता है; हिन्दी में यह स्वाभाविक कथात्मक रूप है।
- source_word: ὅτι
  choice: प्रत्यक्ष उद्धरण
  rationale: यह आरोप की विषयवस्तु प्रस्तुत करता है; हिन्दी में उद्धरण-चिह्नों द्वारा प्रत्यक्ष कथन स्वाभाविक है।
- source_word: Εἰσῆλθες πρὸς ἄνδρας
  choice: तुम ऐसे पुरुषों के यहाँ गए
  rationale: πρός व्यक्तियों की ओर जाने और उनके संग/स्थान में प्रवेश करने का भाव रखता है; ‘के यहाँ गए’ हिन्दी में आरोप की सामाजिक निकटता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀκροβυστίαν ἔχοντας
  choice: जिनका खतना नहीं हुआ था
  rationale: शाब्दिक सामी अभिव्यक्ति का स्पष्ट हिन्दी रूप, जो अन्यजातियों का अर्थ सीधे डालने के बजाय खतने की वाचा-संबंधी सीमा को बनाए रखता है।
- source_word: συνέφαγες αὐτοῖς
  choice: उनके साथ भोजन किया
  rationale: साथ मिलकर खाने का अर्थ सीधे और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: ἀκροβυστίαν ἔχοντας को ‘अन्यजाति’ कहना या खतना-रहित अवस्था को स्पष्ट रखना
  choice: जिनका खतना नहीं हुआ था
  alternative: अन्यजाति पुरुषों
  rationale: आरोप केवल जातीय पहचान पर नहीं, बल्कि खतने से चिह्नित वाचा और सामाजिक-धार्मिक सीमा पर केंद्रित है; इसलिए मूल अभिव्यक्ति का तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। ‘पुरुषों’ से ἄνδρας की लिंग-विशिष्टता बनी रहती है; ‘के यहाँ गए’ सामाजिक संगति और उनके स्थान में जाने—दोनों का स्वाभाविक संकेत देता है।
