source:
  edition: SBLGNT
  text: ἦσαν δέ τινες ἐξ αὐτῶν ἄνδρες Κύπριοι καὶ Κυρηναῖοι, οἵτινες ⸀ἐλθόντες εἰς Ἀντιόχειαν ἐλάλουν ⸀καὶ πρὸς τοὺς ⸀Ἑλληνιστάς, εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: hi
  text: परन्तु उनमें से कुछ पुरुष साइप्रस और कुरेने के थे। वे अन्ताकिया पहुँचकर यूनानी-भाषी यहूदियों से भी बात करते थे और प्रभु यीशु के विषय में शुभ समाचार सुनाते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन हस्तलिपियों में ‘यूनानी-भाषी यहूदियों’ के स्थान पर ‘यूनानियों’ लिखा है। यदि यही मूल पाठ है, तो आशय यह होगा कि वे केवल यूनानी-भाषी यहूदियों को ही नहीं, बल्कि गैर-यहूदियों को भी संदेश सुना रहे थे।
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: कुछ
  rationale: यह पहले बताए गए समूह के एक अनिर्दिष्ट हिस्से को दर्शाता है; आधुनिक हिन्दी में ‘कुछ’ स्वाभाविक है।
- source_word: ἄνδρες
  choice: पुरुष
  rationale: यूनानी पाठ में वयस्क पुरुषों के लिए विशिष्ट पुल्लिंग संज्ञा प्रयुक्त है, इसलिए लिंग-सटीक अनुवाद रखा गया है।
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: साइप्रस और कुरेने के थे
  rationale: ये विशेषण उनके मूल स्थान को बताते हैं; हिन्दी में स्थान-नामों के साथ ‘के थे’ सहज और स्पष्ट है।
- source_word: οἵτινες
  choice: वे
  rationale: वर्णनात्मक सम्बन्धवाचक उपवाक्य को हिन्दी में नए वाक्य के सर्वनाम ‘वे’ से स्वाभाविक रूप दिया गया है।
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: अन्ताकिया पहुँचकर
  rationale: एओरिस्ट कृदन्त यहाँ पहले घटित समयगत क्रिया दर्शाता है; ‘पहुँचकर’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐλάλουν
  choice: बात करते
  rationale: अपूर्ण काल जारी या बार-बार होने वाली क्रिया सूचित करता है; ‘करते’ उस पक्ष को बनाए रखता है।
- source_word: καὶ
  choice: भी
  rationale: यह पहले वर्णित प्रचार के श्रोताओं में विस्तार का संकेत देता है; हिन्दी में ‘भी’ इस योगात्मक अर्थ को स्पष्ट करता है।
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: यूनानी-भाषी यहूदियों से
  rationale: SBLGNT का Ἑλληνιστάς सामान्यतः यूनानी भाषा बोलने वाले यहूदियों को दर्शाता है। पाठांतर ‘यूनानियों’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: εὐαγγελιζόμενοι
  choice: शुभ समाचार सुनाते
  rationale: यह कृदन्त उनके बोलने का स्वरूप और विषय बताता है; यह पदावली साधारण पाठक के लिए स्पष्ट है और सुसमाचार की घोषणा का अर्थ रखती है।
- source_word: τὸν κύριον Ἰησοῦν
  choice: प्रभु यीशु का
  rationale: κύριος की मसीही उपाधि ‘प्रभु’ रखी गई है; सम्बन्धकारक रचना हिन्दी में शुभ समाचार के विषय को स्वाभाविक रूप से व्यक्त करती है।
theological_decisions:
- issue: τοὺς Ἑλληνιστάς की पहचान और पाठांतर Ἕλληνας
  choice: मुख्य पाठ में SBLGNT के अनुसार ‘यूनानी-भाषी यहूदी’
  alternative: ‘यूनानी’, अर्थात गैर-यहूदी लोग
  rationale: Ἑλληνιστάς का सामान्य अर्थ यूनानी-भाषी यहूदी है, जबकि महत्वपूर्ण पाठांतर Ἕλληνας गैर-यहूदी यूनानियों की ओर संकेत करता है। यह भेद सुसमाचार के गैर-यहूदियों तक विस्तार की कथा के लिए अर्थपूर्ण है, इसलिए मुख्य पाठ स्रोत-संस्करण का अनुसरण करता है और विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। ‘अन्ताकिया’ और ‘कुरेने’ जैसे प्रचलित बाइबलीय स्थान-रूप रखे गए हैं; ‘यूनानी-भाषी यहूदी’ तकनीकी ‘हेलेनिस्ट’ की अपेक्षा अधिक बोधगम्य है।
