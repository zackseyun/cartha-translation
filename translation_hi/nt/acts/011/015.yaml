  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: hi
  text: और जब मैंने बोलना शुरू ही किया था,[a] तो पवित्र आत्मा उन पर उतर आया, ठीक वैसे ही जैसे आरम्भ में हम पर उतरा था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और जैसे ही मैंने बोलना शुरू किया।” यूनानी रचना का अनुवाद “जब” या “जैसे ही” किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “आरम्भ में” सम्भवतः चेलों पर पवित्र आत्मा के पहली बार उंडेले जाने, अर्थात पिन्तेकुस्त, की ओर संकेत करता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: और जब मैंने बोलना आरम्भ ही किया
  rationale: ἐν + सन्धियुक्त क्रियार्थक संज्ञा यहाँ समकालिक समय बताती है। ‘जब’ स्वाभाविक हिन्दी है, और ‘ही’ यह भाव बनाए रखता है कि पवित्र आत्मा पतरस के बोलना शुरू करते ही आया।
- source_word: ἐπέπεσεν
  choice: उतर आया
  rationale: ἐπιπίπτω का शाब्दिक चित्र ‘पर गिरना’ है, पर पवित्र आत्मा के लिए ‘उन पर गिर पड़ा’ आधुनिक हिन्दी में अस्वाभाविक और भ्रामक हो सकता है। ‘उतर आया’ आगमन की सजीवता और ἐπί के ‘पर’ संबंध को सहज रूप में व्यक्त करता है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: यह यूनानी पद का मानक, स्पष्ट और समकालीन हिन्दी रूप है।
- source_word: ἐπ’ αὐτούς
  choice: उन पर
  rationale: ἐπί का स्थानिक-संबंधात्मक भाव सुरक्षित रहता है और आगे के ‘हम पर’ के साथ समानांतरता बनती है।
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: ठीक वैसे ही जैसे ... हम पर
  rationale: ὥσπερ निकट समानता दर्शाता है और καί ‘भी’ का भाव जोड़ता है। हिन्दी वाक्य में ‘ठीक वैसे ही जैसे’ तुलना को स्पष्ट और स्वाभाविक बनाता है; संदर्भ से निहित क्रिया दोहराई गई है।
- source_word: ἐν ἀρχῇ
  choice: आरम्भ में
  rationale: यह समय-सूचक अभिव्यक्ति है। ‘आरम्भ में’ संभावित संदर्भ को खुला रखता है और सृष्टि के आरम्भ का अनावश्यक संकेत नहीं देता।
theological_decisions:
- issue: ‘आरम्भ में’ (ἐν ἀρχῇ) का संदर्भ
  choice: मुख्य पाठ में व्यापक समय-सूचक रूप ‘आरम्भ में’ रखा गया है; टिप्पणी में पिन्तेकुस्त को संभावित संदर्भ बताया गया है।
  alternative: इसे स्पष्ट रूप से ‘पिन्तेकुस्त के दिन’ अनूदित करना, अथवा सामान्य अर्थ में केवल ‘पहले’ कहना।
  rationale: संदर्भ सम्भवतः चेलों पर आत्मा के आरम्भिक उण्डेले जाने, अर्थात पिन्तेकुस्त, की ओर संकेत करता है; फिर भी यूनानी पाठ स्वयं घटना का नाम नहीं लेता। इसलिए मुख्य पाठ उसकी वास्तविक व्यापकता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बोलना आरम्भ ही किया’ आरम्भिक क्षण पर बल देता है। ‘उतर आया’ हिन्दी में आत्मा के आगमन का स्वाभाविक धार्मिक-आख्यानात्मक मुहावरा है, जबकि तुलना में ‘हम पर उतरा था’ निहित यूनानी क्रिया को स्पष्ट करती है।
