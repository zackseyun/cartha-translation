id: ACT.11.13
reference: Acts 11:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπήγγειλεν ⸀δὲ ἡμῖν πῶς εἶδεν τὸν ἄγγελον ἐν τῷ οἴκῳ αὐτοῦ σταθέντα καὶ ⸀εἰπόντα· Ἀπόστειλον εἰς ⸀Ἰόππην καὶ μετάπεμψαι Σίμωνα τὸν ἐπικαλούμενον Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/013.yaml
  text: And he reported to us how he had seen the angel standing in his house and saying[a], ‘Send to Joppa and summon Simon, who is called Peter.’
translation:
  language: hi
  text: और उसने हमें बताया कि उसने अपने घर में स्वर्गदूत को खड़े और यह कहते देखा था, “याफा भेजो और शमौन को बुलवा लो, जो पतरस कहलाता है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: बताया
  rationale: यह क्रिया किसी घटना का समाचार या वृत्तांत दूसरों तक पहुँचाने का भाव रखती है; आधुनिक हिन्दी में ‘बताया’ स्वाभाविक और पर्याप्त है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है, स्पष्ट विरोध नहीं; ‘और’ प्रसंग को सहजता से आगे बढ़ाता है।
- source_word: πῶς εἶδεν
  choice: कि उसने ... देखा था
  rationale: यूनानी πῶς मूलतः ‘कैसे/किस प्रकार’ का भाव रख सकता है, पर यहाँ रिपोर्ट की विषयवस्तु प्रस्तुत करता है। हिन्दी में ‘कैसे उसने देखा था’ अस्वाभाविक लगेगा; ‘कि ... देखा था’ अर्थ को स्वाभाविक रूप से व्यक्त करता है, और ‘था’ घटना की पूर्वता दिखाता है।
- source_word: τὸν ἄγγελον
  choice: स्वर्गदूत को
  rationale: ἄγγελος के लिए प्रचलित और स्पष्ट बाइबलीय हिन्दी ‘स्वर्गदूत’ है। हिन्दी में निश्चितता के लिए अलग उपपद आवश्यक नहीं है; प्रसंग उसी विशिष्ट स्वर्गदूत की ओर संकेत करता है।
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: अपने घर में
  rationale: कर्ता और αὐτοῦ दोनों उसी व्यक्ति की ओर संकेत करते हैं, इसलिए हिन्दी का निजवाचक ‘अपने’ सर्वाधिक स्वाभाविक और स्पष्ट है।
- source_word: σταθέντα καὶ εἰπόντα
  choice: खड़े और यह कहते
  rationale: दोनों कृदन्त स्वर्गदूत की दशा और वाणी को समानांतर रखते हैं; हिन्दी में यह संरचना प्रवाहपूर्ण है। ‘यह’ आने वाले प्रत्यक्ष कथन को स्पष्टता से प्रस्तुत करता है।
- source_word: Ἀπόστειλον εἰς Ἰόππην
  choice: याफा में लोगों को भेजो
  rationale: आज्ञा में भेजे जाने वालों का कर्म यूनानी में निहित है। हिन्दी में केवल ‘याफा में भेजो’ अधूरा लगता है, इसलिए प्रसंगानुसार सामान्य ‘लोगों को’ जोड़ा गया है; किसी विशेष संख्या या पहचान को आरोपित नहीं किया गया। Ἰόππη के लिए हिन्दी बाइबलीय परंपरा में ‘याफा’ सुबोध नाम है।
- source_word: μετάπεμψαι
  choice: बुलवा लो
  rationale: मध्यवाच्य क्रिया का अर्थ किसी को लाने के लिए भेजना, अर्थात ‘अपने पास बुलवा लेना’ है। ‘बुलवा लो’ आधुनिक हिन्दी में इस प्रेरणार्थक और लाभार्थक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Σίμωνα τὸν ἐπικαλούμενον Πέτρον
  choice: शमौन को, जो पतरस कहलाता है
  rationale: यह पद शमौन की पहचान उसके प्रचलित दूसरे नाम से कराता है। ‘जो पतरस कहलाता है’ स्रोत की विशेषणात्मक रचना और पहचानसूचक बल को सुरक्षित रखता है।
