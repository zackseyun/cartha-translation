review_pass:
  verdict: revise
  source_fidelity: The draft adds “लोगों को” (‘people’) to the imperative. Although persons sent are implicit pragmatically and occur in the related account, they are not expressed in Acts 11:13. The source simply commands, ‘Send to Joppa,’ followed by ‘send for/summon Simon.’ The addition should be removed to preserve the source’s ellipsis. The rendering of the angel’s posture and speech is otherwise faithful.
  naturalness: The wording is generally clear and modern. However, “याफा में ... भेजो” is less idiomatic for a destination than “याफा को भेजो” or “याफा भेजो.” With the implicit object retained, “याफा भेजो” is concise and natural. “बुलवा लो” is a natural rendering of μεταπέμψαι.
  terminology: “स्वर्गदूत,” “याफा,” “शमौन,” and “पतरस” are appropriate established Hindi biblical forms. “जो पतरस कहलाता है” accurately identifies Simon by his other name. No theological terminology issue is present.
  issues:
  - severity: medium
    issue: The phrase “लोगों को” has been added to the command.
    rationale: ἀπόστειλον has no stated object in this verse. Supplying ‘people’ imports an element not expressed in the Greek and is unnecessary in Hindi.
  - severity: low
    issue: “याफा में ... भेजो” uses a locative form for a destination.
    rationale: εἰς Ἰόππην marks destination. “याफा भेजो” preserves the destination sense more naturally in Hindi while leaving the implicit object unstated.
  revised_text: और उसने हमें बताया कि उसने अपने घर में स्वर्गदूत को खड़े और यह कहते देखा था, “याफा भेजो और शमौन को बुलवा लो, जो पतरस कहलाता है।”
  revised_footnotes: []
  revision_rationale: The revision removes the unstated object ‘लोगों को’ and uses the natural Hindi destination expression ‘याफा भेजो.’ It retains the past-perfect sequence, the angel’s standing and speaking, and the identifying designation of Simon as Peter.
