  to: और उसने हमें बताया कि उसने अपने घर में स्वर्गदूत को खड़े और यह कहते देखा था, “याफा भेजो और शमौन को बुलवा लो, जो पतरस कहलाता है।”
  rationale: The revision removes the unstated object ‘लोगों को’ and uses the natural Hindi destination expression ‘याफा भेजो.’ It retains the past-perfect sequence, the angel’s standing and speaking, and the identifying designation of Simon as Peter.
