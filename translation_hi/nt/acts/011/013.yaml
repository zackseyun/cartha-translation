  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल कथात्मक शैली रखी गई है। ‘शमौन’, ‘पतरस’, ‘याफा’ और ‘स्वर्गदूत’ जैसे परिचित हिन्दी बाइबलीय रूप अपनाए गए हैं। कोई पादटिप्पणी नहीं दी गई, क्योंकि μεταπέμψαι का अर्थ ‘बुलवा लो’ में स्पष्ट रूप से समाहित है और अलग हिन्दी विकल्प अर्थ में उल्लेखनीय तनाव उत्पन्न नहीं करता।
