id: ACT.11.16
reference: Acts 11:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐμνήσθην δὲ τοῦ ῥήματος ⸀τοῦ κυρίου ὡς ἔλεγεν· Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ βαπτισθήσεσθε ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: hi
  text: तब मुझे प्रभु की वह बात याद आई कि उन्होंने कहा था, “यूहन्ना ने जल से बपतिस्मा दिया, पर तुम पवित्र आत्मा में[a] बपतिस्मा पाओगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र आत्मा से।” यूनानी पूर्वसर्ग का अर्थ यहाँ “में” अथवा “से”—दोनों समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην
  choice: मुझे…याद आई
  rationale: यह रूप अर्थ की दृष्टि से सक्रिय है; आधुनिक हिन्दी में ‘मुझे वह बात याद आई’ स्वाभाविक और स्रोत के अनुरूप है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ तीखा विरोध नहीं, बल्कि वृत्तांत में अगली बात की ओर बढ़ने का संकेत देता है।
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: प्रभु की वह बात
  rationale: ῥῆμα यहाँ कही हुई बात को दर्शाता है; ‘वह बात’ आगामी उद्धरण की ओर स्वाभाविक संकेत करता है, और κύριος का धार्मिक व अधिकारपूर्ण भार ‘प्रभु’ से सुरक्षित रहता है।
- source_word: ὡς ἔλεγεν
  choice: कि उन्होंने कहा था
  rationale: सन्दर्भ में यह याद किए गए कथन का परिचय है। हिन्दी का ‘कहा था’ पूर्वकालिकता और अपूर्ण भूतकाल की पृष्ठभूमिगत प्रकृति को स्वाभाविक रूप से व्यक्त करता है, बिना अनावश्यक रूप से बार-बार कहने का भाव जोड़े।
- source_word: Ἰωάννης μὲν ... ὑμεῖς δὲ
  choice: यूहन्ना ने…पर तुम
  rationale: μέν…δέ का विरोध हिन्दी में संक्षेप और स्वाभाविक ढंग से ‘पर’ द्वारा व्यक्त होता है; स्पष्ट ‘तुम’ दोनों पक्षों के विरोध को बनाए रखता है।
- source_word: ἐβάπτισεν ὕδατι
  choice: जल से बपतिस्मा दिया
  rationale: ὕδατι साधनसूचक दत्तिव है; ‘जल से’ इसे स्पष्ट करता है। ‘बपतिस्मा’ इस प्रसंग का स्थापित और सटीक धार्मिक पद है।
- source_word: βαπτισθήσεσθε
  choice: बपतिस्मा पाओगे
  rationale: भविष्यत् कर्मवाच्य का स्वाभाविक हिन्दी रूप है और कर्ता के बजाय प्राप्त होने वाली क्रिया पर बल बनाए रखता है।
- source_word: ἐν πνεύματι ἁγίῳ
  choice: पवित्र आत्मा में
  rationale: ἐν के स्थानवाची अर्थ को मुख्य पाठ में बनाए रखा गया है; साधनवाची ‘से’ भी सम्भव है और उसे पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस प्रसंग में यह यीशु के अधिकारपूर्ण कथन को सूचित करता है; ‘प्रभु’ प्रचलित अर्थ और धार्मिक भार दोनों को सुरक्षित रखता है।
- issue: ἐν πνεύματι ἁγίῳ में ἐν का अर्थ
  choice: पवित्र आत्मा में
  alternative: पवित्र आत्मा से
  rationale: यूनानी पूर्वसर्ग स्थानवाची अथवा साधनवाची समझा जा सकता है। मुख्य पाठ ‘में’ रखता है और वास्तविक वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। ‘जल’ और ‘बपतिस्मा’ बाइबलीय प्रसंग में परिचित हैं। सम्मानसूचक एकवचन ‘उन्होंने’ प्रभु यीशु के लिए स्वाभाविक हिन्दी प्रयोग है। पादटिप्पणी-चिह्न उस वाक्यांश के बाद रखा गया है जिससे वह संबंधित है।
