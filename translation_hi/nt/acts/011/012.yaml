source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: hi
  text: आत्मा ने मुझसे कहा कि मैं उनके साथ जाऊँ और कोई भेद न करूँ[a]। ये छह भाई भी मेरे साथ आए, और हम उस आदमी के घर में गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बिना हिचकिचाए” अथवा “बिना संदेह किए।” यूनानी कृदन्त का अर्थ “भेद न करना” या “हिचकिचाना/संदेह करना,” दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: आत्मा
  rationale: प्रेरितों के काम में प्रकाशनात्मक मार्गदर्शन के इस प्रसंग में यह पवित्र आत्मा को सूचित करता है; फिर भी मूल में विशेषण ‘पवित्र’ नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: εἶπεν ... μοι
  choice: मुझसे कहा
  rationale: यह निर्देश प्रस्तुत करने वाला स्वाभाविक और मूल के निकट हिन्दी प्रयोग है।
- source_word: συνελθεῖν αὐτοῖς
  choice: उनके साथ जाऊँ
  rationale: यहाँ क्रिया उन लोगों के साथ जाने या उनका साथ देने को व्यक्त करती है।
- source_word: μηδὲν διακρίναντα
  choice: बिना कोई भेद किए
  rationale: यह प्रसंग यहूदी और गैर-यहूदी के बीच सामाजिक-धार्मिक भेद न करने की ओर दृढ़ता से संकेत करता है; यूनानी पदबंध की दूसरी सम्भव समझ पादटिप्पणी में रखी गई है।
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: ये छह भाई
  rationale: सन्दर्भ में छह पुरुष सहयात्री हैं; ‘ये’ οὗτοι को स्पष्ट रूप से व्यक्त करता है।
- source_word: εἰσήλθομεν
  choice: हम ... में गए
  rationale: घर में प्रवेश करने के लिए आधुनिक हिन्दी में यह अधिक स्वाभाविक कथात्मक अभिव्यक्ति है।
- source_word: τὸν οἶκον τοῦ ἀνδρός
  choice: उस पुरुष के घर
  rationale: मूल पाठ स्पष्ट संज्ञा ‘पुरुष’ का प्रयोग करता है; अनावश्यक सर्वनाम-प्रतिस्थापन से बचते हुए उसे बनाए रखा गया है।
theological_decisions:
- issue: μηδὲν διακρίναντα का अर्थ
  choice: बिना कोई भेद किए
  alternative: बिना हिचकिचाए; बिना सन्देह किए
  rationale: निकटवर्ती प्रसंग में पतरस यहूदी और गैर-यहूदी की सीमा पार करने का स्पष्टीकरण दे रहा है, इसलिए ‘भेद न करना’ उपयुक्त है। फिर भी यूनानी कृदन्त डगमगाने, हिचकिचाने या सन्देह करने का अर्थ भी दे सकता है; इस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘आत्मा’ मूल की संक्षिप्तता बनाए रखता है और ‘पवित्र’ नहीं जोड़ता। पादटिप्पणी-चिह्न सम्बन्धित विवादित पदबंध के तुरन्त बाद रखा गया है।
