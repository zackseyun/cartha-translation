base_translation:
  language: en
  yaml_path: translation/nt/acts/011/010.yaml
  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: hi
  text: यह तीन बार हुआ, और फिर सब कुछ ऊपर खींचकर स्वर्ग में ले लिया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: यह
  rationale: यह संकेतवाचक सर्वनाम पिछले पदों में वर्णित घटना की ओर संकेत करता है; ‘दर्शन’ जोड़ना अनावश्यक रूप से स्पष्ट करना होता।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को हल्के ढंग से आगे जोड़ता है; हिन्दी में दूसरे उपवाक्य के आरम्भ में ‘और’ स्वाभाविक है।
- source_word: ἐγένετο
  choice: हुआ
  rationale: सन्दर्भ में क्रिया किसी घटना के घटित होने को व्यक्त करती है; ‘हुआ’ सहज और संक्षिप्त है।
- source_word: ἐπὶ τρίς
  choice: तीन बार
  rationale: यह मुहावरा घटना की तीन बार पुनरावृत्ति बताता है; आधुनिक हिन्दी में यही सबसे स्वाभाविक रूप है।
- source_word: ἀνεσπάσθη
  choice: ऊपर ... खींच लिया गया
  rationale: निष्क्रिय क्रिया किसी बाहरी शक्ति द्वारा ऊपर की ओर खींचे जाने का बिम्ब बनाए रखती है और कर्ता को अनिर्दिष्ट छोड़ती है।
- source_word: πάλιν
  choice: फिर
  rationale: यह पुनरावृत्ति अथवा वापस ऊपर लिए जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἅπαντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन समग्रता व्यक्त करता है, पर चादर या पशुओं को विशेष रूप से निर्दिष्ट नहीं करता।
- source_word: εἰς τὸν οὐρανόν
  choice: स्वर्ग में
  rationale: εἰς की दिशात्मकता और दर्शन के सन्दर्भ में οὐρανός का अर्थ सुरक्षित रहता है; ‘ऊपर’ खींचे जाने की दिशा को स्पष्ट करता है।
theological_decisions:
- issue: पतरस के दर्शन के वृत्तान्त में ἅπαντα का संदर्भ
  choice: ‘सब कुछ’—संदर्भ को व्यापक और अनिर्दिष्ट रखा गया।
  alternative: ‘वह सब’, ‘पूरी वस्तु’, या ‘सारे पशु’
  rationale: यूनानी शब्द समग्रता तो बताता है, पर इस पद में किसी एक विशिष्ट वस्तु को स्पष्ट नहीं करता; व्यापक अनुवाद मूल अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। निष्क्रिय वाक्य-विन्यास और ऊपर खींचे जाने का दृश्य-बिम्ब सुरक्षित रखा गया है।
