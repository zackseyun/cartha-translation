base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: hi
  text: पर मैंने कहा, “बिलकुल नहीं, प्रभु, क्योंकि कोई भी अपवित्र या अशुद्ध चीज़ कभी मेरे मुँह में नहीं गई है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: कदापि नहीं
  rationale: यह पतरस के प्रबल निषेध को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κύριε
  choice: प्रभु
  rationale: सम्बोधन रूप को सुरक्षित रखता है और प्रसंग में बोलने वाले दिव्य अधिकारी के प्रति पतरस की प्रतिक्रिया दर्शाता है।
- source_word: κοινὸν
  choice: अपवित्र
  rationale: यहाँ शब्द का अर्थ सामान्यतः धार्मिक रीति से अपवित्र या भोजन के लिए निषिद्ध है; केवल ‘सामान्य’ कहना हिन्दी में अपेक्षित भाव स्पष्ट नहीं करेगा।
- source_word: ἀκάθαρτον
  choice: अशुद्ध
  rationale: मूसा की व्यवस्था की शुद्धता-संबंधी श्रेणी को सीधे और प्रचलित बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: εἰσῆλθεν εἰς τὸ στόμα μου
  choice: मेरे मुँह में नहीं गई
  rationale: मूल रूपक को बनाए रखता है; हिन्दी में इसका आशय कुछ खाने से स्वाभाविक रूप से समझ में आता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: पतरस के निषेध के बाद दिए गए कारण को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: κοινόν और ἀκάθαρτον के बीच भेद
  choice: अपवित्र या अशुद्ध
  alternative: सामान्य या अशुद्ध
  rationale: दोनों यूनानी विशेषणों को अलग रखा गया है, पर κοινόν का संस्कारगत अर्थ चुना गया है ताकि इसे साधारण या आम वस्तु न समझा जाए।
- issue: पतरस के कथन का स्वर
  choice: उसके कठोर निषेध और जीवनभर के आहार-अनुशासन को बिना अतिरिक्त व्याख्या के प्रस्तुत करना
  alternative: इसे नई वाचा के आहार-सिद्धान्त की स्पष्ट घोषणा के रूप में विस्तार देना
  rationale: पद स्वयं केवल पतरस की प्रतिक्रिया बताता है; व्यापक धर्मवैज्ञानिक निष्कर्ष आसपास के प्रसंग पर छोड़ा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है। ‘कदापि नहीं’ प्रबल निषेध को व्यक्त करता है, जबकि ‘अपवित्र या अशुद्ध’ मूल के दो निकटार्थक किन्तु पृथक धार्मिक पदों को सुरक्षित रखता है।
