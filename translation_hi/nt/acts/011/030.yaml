lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: उन्होंने ऐसा ही किया
  rationale: नपुंसकलिंग संबंधवाचक सर्वनाम ὃ पिछले पद में बताए गए सहायता भेजने के निश्चय की ओर संकेत करता है। हिंदी में ‘ऐसा ही किया’ संक्षिप्त और स्वाभाविक रूप से इस पूर्वसंदर्भ को व्यक्त करता है।
- source_word: ἀποστείλαντες
  choice: भेज दी
  rationale: अओरिस्ट कृदंत मुख्य क्रिया को पूरा करने का ढंग बताता है। हिंदी में समन्वित क्रिया-विन्यास मूल कथात्मक सार को सहजता से व्यक्त करता है।
- source_word: implicit object from context
  choice: वह सहायता
  rationale: यूनानी में कर्म संदर्भ से समझा जाता है; हिंदी में ‘वह सहायता’ पिछले पद से संबंध स्पष्ट करता है और अस्पष्ट सर्वनाम से बचाता है।
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: प्राचीनों के पास
  rationale: πρεσβύτεροι समुदाय के मान्य अगुओं को दर्शाता है। ‘प्राचीन’ हिंदी बाइबलीय प्रयोग में परिचित, संक्षिप्त और पदनाम के रूप में उपयुक्त है।
- source_word: διὰ χειρὸς
  choice: के हाथों
  rationale: यह यूनानी मुहावरा नियुक्त संदेशवाहकों की मध्यस्थता या अभिकरण दर्शाता है। ‘के हाथों’ मूल बिंब को बनाए रखते हुए हिंदी में समझ में आता है।
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: बरनबास और शाऊल
  rationale: व्यक्तिनामों को हिंदी की प्रचलित बाइबलीय वर्तनी के अनुसार लिप्यंतरित किया गया है।
