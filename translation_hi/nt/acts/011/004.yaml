  verdict: approve
  source_fidelity: The translation accurately conveys the transitional δέ ('परन्तु'), Peter as subject, the sequential sense of καθεξῆς ('क्रम से'), and Peter's commencement of an explanatory account. The Hindi construction 'समझाना आरम्भ किया' idiomatically renders the participial ἀρξάμενος together with the imperfect ἐξετίθετο; 'उसने कहा,' suitably introduces the following direct speech.
  naturalness: The wording is clear, modern, and appropriately dignified Hindi. 'पतरस ने उन्हें क्रम से समझाना आरम्भ किया। उसने कहा,' is natural prose, even though it recasts the Greek participial linkage as two Hindi clauses.
  terminology: '''पतरस'' is the established Hindi biblical form of the name, and ''क्रम से'' is a concise, accurate equivalent for the orderly/sequential force of καθεξῆς. No theological terminology is at issue.'
