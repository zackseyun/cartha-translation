lexical_decisions:
- source_word: ἀρξάμενος
  choice: आरम्भ किया
  rationale: यह क्रियाविशेषणीय एओरिस्ट कृदन्त है, जो मुख्य क्रिया के साथ पतरस द्वारा अपना उत्तर आरम्भ करने का भाव देता है। आधुनिक हिन्दी में संयुक्त रूप ‘समझाना आरम्भ किया’ स्वाभाविक है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले पद के आरोप और पतरस के उत्तर के बीच हल्का विरोध अथवा संक्रमण दिखाता है।
- source_word: Πέτρος
  choice: पतरस
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: ἐξετίθετο
  choice: समझाना
  rationale: यहाँ अर्थ किसी बात को विस्तार से सामने रखना या स्पष्ट करना है। ‘समझाना’ साधारण आधुनिक हिन्दी में स्पष्ट है; अपूर्णकालिक पक्ष को ‘आरम्भ किया’ के साथ पूरी अभिव्यक्ति से स्वाभाविक रूप मिला है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: दत्तिव बहुवचन सर्वनाम पतरस के श्रोताओं को सूचित करता है; हिन्दी में ‘उन्हें’ स्वाभाविक समतुल्य है।
- source_word: καθεξῆς
  choice: क्रम से
  rationale: यह क्रियाविशेषण घटनाओं या बातों को सिलसिलेवार, व्यवस्थित ढंग से प्रस्तुत करने का अर्थ देता है। ‘क्रम से’ संक्षिप्त और सटीक है।
- source_word: λέγων
  choice: उसने कहा
  rationale: वर्तमान कृदन्त आगामी प्रत्यक्ष कथन का परिचय देता है। हिन्दी में अलग वाक्य ‘उसने कहा,’ कथन की ओर सहज संक्रमण कराता है, जबकि स्रोत का संबंध बनाए रखता है।
