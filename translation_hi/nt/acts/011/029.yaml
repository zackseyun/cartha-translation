    text: या “जैसी जिसकी सम्पन्नता थी,” अर्थात जितना हर कोई दे सकता था।
    reason: lexical_alternative
  - marker: b
    text: “भाइयों” से सम्भवतः यहूदिया के साथी विश्वासी अभिप्रेत हैं, जिनमें व्यापक मसीही समुदाय शामिल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητῶν
  choice: चेलों
  rationale: प्रेरितों के काम में μαθητής के लिए प्रचलित, सहज और सटीक हिन्दी शब्द।
- source_word: καθὼς εὐπορεῖτό τις
  choice: अपनी सामर्थ्य के अनुसार
  rationale: यह वाक्यांश प्रत्येक व्यक्ति के उपलब्ध साधनों या देने की क्षमता के अनुपात को व्यक्त करता है; वैकल्पिक शाब्दिक रंग को पादटिप्पणी में रखा गया है।
- source_word: ὥρισαν
  choice: निश्चय किया
  rationale: ὁρίζω यहाँ सोच-समझकर निर्णय लेने या ठानने का भाव देता है।
- source_word: ἕκαστος αὐτῶν
  choice: उनमें से हर एक
  rationale: यूनानी के स्पष्ट वितरणात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἰς διακονίαν πέμψαι
  choice: सहायता के लिए कुछ भेजे
  rationale: सन्दर्भ में διακονία जरूरतमंद विश्वासियों के लिए व्यावहारिक सहायता है। यूनानी में भेजी जाने वाली वस्तु व्यक्त नहीं है, इसलिए हिन्दी में स्वाभाविकता हेतु अनिश्चित ‘कुछ’ जोड़ा गया है, बिना उसके रूप को निश्चित किए।
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ
  choice: यहूदिया में रहने वाले
  rationale: सहभागी वाक्यांश का सीधा और स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: ἀδελφοῖς
  choice: भाइयों
  rationale: यूनानी में पुल्लिंग बहुवचन पारिवारिक संबोधन है; आरम्भिक मसीही प्रयोग में यह व्यापक विश्वासी समुदाय को भी समेट सकता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: यहूदिया के मसीही समुदाय के लिए प्रयुक्त लिंगसूचक पारिवारिक शब्द ἀδελφοῖς
  choice: भाइयों
  alternative: भाई-बहनों; साथी विश्वासियों
  rationale: मुख्य पाठ यूनानी के पुल्लिंग बहुवचन रूप को बनाए रखता है, जबकि उसके सम्भावित समावेशी सामुदायिक अर्थ को पादटिप्पणी में बताया गया है; इस प्रकार स्रोत-रूप और सन्दर्भगत विस्तार दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘सहायता के लिए कुछ भेजे’ अकाल-सन्दर्भ में व्यावहारिक राहत को व्यक्त करता है, पर दान के सटीक रूप को अनावश्यक रूप से निश्चित नहीं करता।
