source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: hi
  text: इसलिए जो लोग स्तिफनुस के संबंध में उत्पन्न हुए क्लेश[a] के कारण तितर-बितर हो गए थे, वे फीनीके, कुप्रुस और अन्ताकिया तक जा पहुँचे। वे केवल यहूदियों को ही[c] वचन[b] सुनाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उत्पीड़न।” यूनानी शब्द प्रसंग के अनुसार क्लेश, संकट या उत्पीड़न का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “वचन” से आशय यीशु के विषय में घोषित संदेश है; या “संदेश।”
    reason: lexical_alternative
  - marker: c
    text: 'यूनानी में विशेष बल है: “केवल यहूदियों को” या “सिर्फ यहूदियों को ही।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διασπαρέντες
  choice: तितर-बितर हो गए थे
  rationale: अओरिस्ट कर्मवाच्य कृदंत पहले घट चुकी तितर-बितर होने की घटना को मुख्य क्रिया की पृष्ठभूमि बनाता है; यह चयन कर्मवाच्य भाव और पूर्वकालिकता दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: θλίψεως
  choice: क्लेश
  rationale: यह शब्द संकट, पीड़ा या दबाव का व्यापक अर्थ रखता है। प्रसंग में उत्पीड़न सम्मिलित है, पर मूल शब्द को अनावश्यक रूप से संकीर्ण नहीं किया गया।
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: स्तिफनुस के कारण उठे
  rationale: ἐπί के साथ यह रचना स्तिफनुस की घटना से जुड़े या उसके कारण भड़के क्लेश की ओर संकेत करती है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: διῆλθον ἕως
  choice: तक जा पहुँचे
  rationale: यात्रा की भौगोलिक सीमा को सहज हिन्दी में व्यक्त करता है, बिना यात्रा-पथ का अतिरिक्त विवरण जोड़े।
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: फीनीके, कुप्रुस और अन्ताकिया
  rationale: इन स्थान-नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं।
- source_word: μηδενὶ λαλοῦντες
  choice: किसी और को ... नहीं सुनाते थे
  rationale: नकारात्मक दत्तिव और वर्तमान कृदंत की साथ-साथ जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν λόγον
  choice: वचन
  rationale: लूका-प्रेरितों में बार-बार आने वाली विषयगत अभिव्यक्ति को बनाए रखता है; यहाँ इसका आशय यीशु के विषय में घोषित संदेश से है।
- source_word: εἰ μὴ μόνον Ἰουδαίοις
  choice: यहूदियों को छोड़ किसी और को
  rationale: εἰ μή और μόνον द्वारा दर्शाए गए विशिष्ट प्रतिबंध को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: स्तिफनुस के बाद हुए विरोध का स्वरूप
  choice: मुख्य पाठ में व्यापक शब्द ‘क्लेश’
  alternative: उत्पीड़न
  rationale: प्रसंग उत्पीड़न का है, पर θλῖψις का अर्थ उससे व्यापक है। पादटिप्पणी प्रसंगानुकूल संकीर्ण विकल्प देती है।
- issue: τὸν λόγον का आशय
  choice: मुख्य पाठ में ‘वचन’
  alternative: संदेश; यीशु के विषय का संदेश
  rationale: यह चयन लूका की आवर्ती शब्दावली को बनाए रखता है और व्याख्यात्मक विस्तार को मुख्य पाठ में नहीं जोड़ता।
- issue: संदेश सुनने वालों पर प्रतिबंध
  choice: ‘यहूदियों को छोड़ किसी और को’
  alternative: केवल यहूदियों को
  rationale: दोनों अर्थतः निकट हैं; चुना हुआ रूप यूनानी निषेधात्मक रचना और उसके बल को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली। ‘क्लेश’ और ‘वचन’ जैसे स्रोत-समीप बाइबलीय शब्द पादटिप्पणियों से स्पष्ट किए गए हैं। लंबे यूनानी वाक्य को पठनीयता के लिए दो हिन्दी वाक्यों में बाँटा गया है।
