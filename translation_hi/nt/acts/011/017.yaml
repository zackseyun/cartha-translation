  text: εἰ οὖν τὴν ἴσην δωρεὰν ἔδωκεν αὐτοῖς ὁ θεὸς ὡς καὶ ἡμῖν πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν, ⸀ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: hi
  text: इसलिए, यदि परमेश्वर ने उन्हें भी वही वरदान दिया जो उसने हमें, जिन्होंने प्रभु यीशु मसीह पर विश्वास किया था, दिया था,[a][b] तो मैं कौन था कि परमेश्वर को रोक पाता?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अधिक कालवाचक रूप में: “जो उसने हमें दिया था जब हमने प्रभु यीशु मसीह पर विश्वास किया।”'
    reason: lexical_alternative
  - marker: b
    text: यूनानी Χριστόν का अर्थ “मसीह” है; “ख्रीस्त” इसका एक प्रचलित लिप्यंतरण है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: वही वरदान
  rationale: ἴσην समानता या बराबरी को व्यक्त करता है। प्रसंग में पतरस अन्यजातियों को मिले वरदान की तुलना यहूदी विश्वासियों को मिले वरदान से करता है; इसलिए सहज हिन्दी में ‘वही वरदान’ उपयुक्त है।
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: जब हमने प्रभु यीशु मसीह पर विश्वास किया
  rationale: दत्तिव बहुवचन कृदन्त πιστεύσασιν ἡμῖν से जुड़ा है। मुख्य पाठ में इसका कालवाचक भाव सहज हिन्दी में व्यक्त किया गया है; वर्णनात्मक रूप को पादटिप्पणी में रखा गया है। ἐπὶ के साथ विश्वास की दिशा या आधार को ‘पर विश्वास किया’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: κύριον
  choice: प्रभु
  rationale: यहाँ κύριος यीशु की उपाधि है, केवल ‘स्वामी’ के सामान्य अर्थ में नहीं।
- source_word: Χριστόν
  choice: मसीह
  rationale: यहाँ Χριστός की उपाधिगत शक्ति सक्रिय है; ‘मसीह’ उसके अभिषिक्त उद्धारकर्ता संबंधी अर्थ को बनाए रखता है।
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: मैं कौन था कि ... सकता
  rationale: यह यूनानी आलंकारिक प्रश्न परमेश्वर के कार्य के सामने वक्ता की असमर्थता और विनम्रता दिखाता है। हिन्दी मुहावरा उसी बल को स्वाभाविक ढंग से रखता है।
- source_word: κωλῦσαι τὸν θεόν
  choice: परमेश्वर को रोक सकता
  rationale: κωλύω का अर्थ रोकना, बाधा डालना या निषेध करना हो सकता है। प्रत्यक्ष कर्म ‘परमेश्वर’ को बनाए रखने से मूल की तीखी बात सुरक्षित रहती है कि अन्यजातियों का विरोध करना स्वयं परमेश्वर को रोकने जैसा होता।
theological_decisions:
- issue: πιστεύσασιν का ἡμῖν से संबंध
  choice: 'मुख्य पाठ में कालवाचक: ‘जब हमने ... विश्वास किया’'
  alternative: 'वर्णनात्मक: ‘हम पर भी, जिन्होंने ... विश्वास किया था’'
  rationale: कृदन्त व्याकरणतः ἡμῖν से सहमति रखता है और वर्णनात्मक अनुवाद संभव है, पर प्रसंग में कालवाचक हिन्दी अधिक सहज है। पादटिप्पणी वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखती है और उद्धार-क्रम के बारे में अनावश्यक निष्कर्ष नहीं थोपती।
- issue: Χριστόν का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस विश्वास-घोषणा में यह अर्थपूर्ण उपाधि है, केवल नाम का स्थिर अंग नहीं। ‘मसीह’ यहूदी मसीहाई अर्थ को बनाए रखता है; प्रचलित लिप्यंतरण पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। ‘वही वरदान’, ‘प्रभु’, ‘मसीह’ और ‘परमेश्वर को रोक सकता’ जैसे पद मूल के प्रत्यक्ष और आलंकारिक बल को बनाए रखते हैं।
