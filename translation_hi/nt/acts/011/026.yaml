id: ACT.11.26
reference: Acts 11:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: hi
  text: और उसे ढूँढ़ लेने पर वह उसे अन्ताकिया ले आया। फिर वे पूरे एक वर्ष तक कलीसिया के साथ इकट्ठे होते रहे[a] और बहुत-से लोगों को शिक्षा देते रहे; और अन्ताकिया ही में चेलों को पहली बार ‘मसीही’ कहा गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कलीसिया में इकट्ठे होते रहे।” यहाँ “कलीसिया” का अर्थ मसीही समुदाय है; आवश्यक नहीं कि किसी भवन की ओर संकेत हो।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में शाब्दिक भाव है, “चेलों को पहली बार मसीही कहा गया।” नाम देने वाला कौन था, यह नहीं बताया गया है; सम्भवतः अन्ताकिया में यह उनका सार्वजनिक पदनाम बना।
    reason: cultural_note
lexical_decisions:
- source_word: εὑρὼν
  choice: उसे ढूँढ़ लेने पर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की पूरी हुई क्रिया दिखाता है; यह हिन्दी में क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἤγαγεν
  choice: उसे अन्ताकिया ले आया
  rationale: सन्दर्भ में ἄγω का अर्थ शाऊल को अन्ताकिया लाना है; ‘ले आया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐγένετο δὲ αὐτοῖς καὶ ἐνιαυτὸν ὅλον
  choice: फिर वे पूरे एक वर्ष तक
  rationale: यूनानी कथात्मक मुहावरे को अनगढ़ शाब्दिकता से बचाते हुए बरनबास और शाऊल से सम्बद्ध पूरे वर्ष की अवधि स्पष्ट की गई है।
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: कलीसिया के साथ इकट्ठे होते रहे
  rationale: यह रूप मसीही समुदाय के साथ एकत्र होने का भाव देता है और ‘कलीसिया’ को भवन मान लेने से बचाता है; अवधि के कारण ‘होते रहे’ उपयुक्त है।
- source_word: ἐκκλησίᾳ
  choice: कलीसिया
  rationale: प्रेरितों के काम में यह सामान्यतः मसीही समुदाय को दर्शाता है; हिन्दी बाइबलीय प्रयोग में ‘कलीसिया’ स्थापित और परिचित शब्द है।
- source_word: διδάξαι ὄχλον ἱκανόν
  choice: बहुत-से लोगों को शिक्षा देते रहे
  rationale: ἱκανός यहाँ पर्याप्त बड़ी संख्या बताता है। ‘बहुत-से लोग’ हिन्दी में ‘एक पर्याप्त बड़ी भीड़’ से अधिक स्वाभाविक है, और वर्षभर की गतिविधि के लिए निरन्तर रूप उपयुक्त है।
- source_word: χρηματίσαι
  choice: कहा गया
  rationale: यहाँ क्रिया किसी नाम या सार्वजनिक पदनाम से पुकारे जाने का अर्थ देती है; कर्मवाच्य मूल की अस्पष्टता बनाए रखता है कि नाम किसने दिया।
- source_word: πρώτως
  choice: पहली बार
  rationale: यह नाम के प्रथम प्रयोग को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Χριστιανούς
  choice: ‘मसीही’
  rationale: यह Χριστός से बना समूह-नाम है। हिन्दी में ‘मसीही’ स्थापित, अर्थपूर्ण और स्वाभाविक पदनाम है; उद्धरण-चिह्न नाम दिए जाने पर बल देते हैं।
theological_decisions:
- issue: Χριστιανούς को मसीह-सम्बन्धी समूह-नाम के रूप में प्रस्तुत करना
  choice: ‘मसीही’
  alternative: ‘क्रिश्चियन’ अथवा ‘मसीहवादी’
  rationale: ‘मसीही’ आधुनिक हिन्दी के धार्मिक प्रयोग में स्थापित समूह-नाम है और यूनानी शब्द का मसीह से सम्बन्ध बनाए रखता है। ‘क्रिश्चियन’ अनावश्यक अंग्रेज़ी-आश्रित है, जबकि ‘मसीहवादी’ कृत्रिम तथा सम्भावित रूप से सम्प्रदायगत लगता है।
- issue: χρηματίσαι में नाम देने वाले की पहचान
  choice: कर्मवाच्य ‘कहा गया’ द्वारा अनिर्दिष्ट रखना
  alternative: नगर के लोगों ने उन्हें मसीही नाम दिया
  rationale: यूनानी पाठ नाम देने वाले कर्ता को व्यक्त नहीं करता। किसी विशिष्ट समूह को कर्ता बनाना पाठ से अधिक कहना होगा।
- issue: ἐκκλησίᾳ का समुदाय या भवन अर्थ
  choice: कलीसिया के साथ
  alternative: कलीसिया में
  rationale: सन्दर्भ आरम्भिक मसीही समुदाय का है; ‘के साथ’ भवन का अर्थ थोपे बिना सामुदायिक सभा को व्यक्त करता है, यद्यपि ‘में’ व्याकरणतः सम्भव है।
translation_notes:
  register: भाषा आधुनिक, प्रवाहपूर्ण और गरिमापूर्ण रखी गई है। ‘कलीसिया’, ‘चेले’ और ‘मसीही’ जैसे प्रचलित हिन्दी बाइबलीय शब्द बनाए गए हैं। वाक्य का अन्तिम खण्ड ‘अन्ताकिया ही में’ द्वारा मूल के स्थानगत बल को स्वाभाविक हिन्दी में उभारता है।
