base_translation:
  language: en
  yaml_path: translation/nt/acts/011/009.yaml
  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: hi
  text: परन्तु स्वर्ग से एक आवाज़ ने दूसरी बार उत्तर दिया, “जो कुछ परमेश्वर ने शुद्ध किया है, उसे तुम साधारण[a] मत कहो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “अशुद्ध न मानो” या “अपवित्र न कहो।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: ἀποκρίνομαι का सामान्य कथात्मक अर्थ ‘उत्तर देना’ है; यह पिछले कथन के प्रत्युत्तर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φωνὴ
  choice: एक आवाज़
  rationale: यूनानी पाठ वक्ता की पहचान स्पष्ट नहीं करता; ‘एक आवाज़’ इस अनिश्चितता को बनाए रखता है।
- source_word: ἐκ δευτέρου
  choice: दूसरी बार
  rationale: यह मुहावरा ‘दूसरी बार’ का अर्थ देता है और हिन्दी में सहज है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से
  rationale: इस दर्शन के प्रसंग में οὐρανός केवल आकाश नहीं, बल्कि स्वर्ग को सूचित करता है।
- source_word: Ἃ
  choice: जिसे
  rationale: नपुंसकलिंग बहुवचन सम्बन्धवाचक रूप को हिन्दी में सामूहिक एकवचन ‘जिसे’ से स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: आधुनिक हिन्दी बाइबिलीय शैली में θεός का स्पष्ट और प्रतिष्ठित समतुल्य है।
- source_word: ἐκαθάρισεν
  choice: शुद्ध किया है
  rationale: καθαρίζω के शुद्धता-संबंधी अर्थ और पूर्ण हुई क्रिया की वर्तमान प्रासंगिकता दोनों को व्यक्त करता है।
- source_word: σὺ
  choice: तुम
  rationale: स्पष्ट यूनानी सर्वनाम का व्यक्तिगत और कुछ हद तक बलात्मक आशय बनाए रखा गया है।
- source_word: μὴ κοίνου
  choice: अशुद्ध न ठहराओ
  rationale: यह निषेध किसी वस्तु को धार्मिक शुद्धता की दृष्टि से κοινός मानने या घोषित करने से रोकता है। ‘ठहराओ’ निर्णय अथवा वर्गीकरण का भाव देता है; अधिक शाब्दिक ‘साधारण न कहो’ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: κοινόω में शुद्धता-संबंधी अर्थ
  choice: अशुद्ध न ठहराओ
  alternative: साधारण न कहो / अपवित्र न मानो
  rationale: κοινόω का मूल भाव ‘सामान्य बनाना/मानना’ है, पर यहूदी शुद्धता के इस प्रसंग में ‘अशुद्ध या अपवित्र मानना’ अभिप्रेत है। मुख्य पाठ में सहज हिन्दी अर्थ दिया गया है, जबकि ‘साधारण’ वाला निकटतर शाब्दिक विकल्प पादटिप्पणी में रखकर वैचारिक तनाव सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परन्तु’ कथात्मक विरोध को, और ‘ठहराओ’ मानवीय वर्गीकरण के भाव को व्यक्त करता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में संबंधित शब्द के साथ दिया गया है।
