source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: hi
  text: तीन दिन बाद पौलुस ने यहूदियों के प्रमुख लोगों[a] को एक साथ बुलाया। जब वे इकट्ठे हुए, तो उसने उनसे कहा, “भाइयो[b], यद्यपि मैंने अपने लोगों या अपने पूर्वजों के रीति-रिवाजों[c] के विरुद्ध कुछ भी नहीं किया था, फिर भी मुझे यरूशलेम से बन्दी के रूप में रोमियों के हाथों में सौंप दिया गया[d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदियों के नेताओं” अथवा “यहूदियों में सबसे प्रतिष्ठित लोगों”।
    reason: πρῶτοι यहाँ प्रमुखता, नेतृत्व या प्रतिष्ठा का बोध करा सकता है।
  - marker: b
    text: यूनानी में संबोधन शाब्दिक रूप से “पुरुष भाइयो” है; पौलुस अपने बुलाए हुए यहूदी पुरुष अगुओं से बात कर रहा है।
    reason: स्रोत के लिंग-विशिष्ट और आत्मीय संबोधन की सांस्कृतिक जानकारी देना।
  - marker: c
    text: या “पैतृक रीति-रिवाजों”।
    reason: πατρῴοις पूर्वजों से प्राप्त या पैतृक परंपराओं को दर्शाता है।
  - marker: d
    text: शाब्दिक रूप से, “यरूशलेम से बन्दी के रूप में रोमियों के हाथों में सौंप दिया गया।”
    reason: मूल के निष्क्रिय कानूनी/हिरासती भाव और ‘हाथों में’ मुहावरे को दिखाना।
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: तीन दिन बाद
  rationale: यूनानी कथात्मक संक्रमण को हिंदी में अलग से ‘ऐसा हुआ कि’ कहना अनावश्यक और बोझिल होगा; समय-सूचक वाक्यांश घटना को स्वाभाविक रूप से आगे बढ़ाता है।
- source_word: συγκαλέσασθαι αὐτὸν
  choice: पौलुस ने ... एक साथ बुलाया
  rationale: συν- के सामूहिक भाव को ‘एक साथ’ व्यक्त करता है। हिंदी में सर्वनाम की अस्पष्टता से बचने के लिए प्रसंगगत कर्ता ‘पौलुस’ स्पष्ट किया गया है।
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: यहूदियों के प्रमुख लोगों
  rationale: πρῶτοι यहाँ क्रम नहीं, सामाजिक प्रमुखता या नेतृत्व दर्शाता है; ‘प्रमुख लोग’ पद को अनावश्यक रूप से औपचारिक बनाए बिना अर्थ रखता है।
- source_word: συνελθόντων δὲ αὐτῶν
  choice: जब वे इकट्ठे हुए
  rationale: यूनानी संबंधवाचक स्वतंत्र रचना को स्वाभाविक हिंदी कालवाचक उपवाक्य में व्यक्त किया गया है।
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: भाइयो
  rationale: संबोधन में पुरुष यहूदी अगुओं के प्रति आत्मीय एकता व्यक्त होती है। अलग से ‘पुरुषो’ कहना आधुनिक हिंदी में अस्वाभाविक है; Ἐγώ का बल अगले ‘मैंने’ से पर्याप्त रूप से प्रकट होता है।
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: यद्यपि मैंने ... के विरुद्ध कुछ भी नहीं किया था
  rationale: 'संदर्भ में कृदंत का रियायती/विरोधात्मक बल है: निर्दोष होते हुए भी पौलुस को सौंपा गया। ‘यद्यपि ... फिर भी’ यह तनाव स्पष्ट और स्वाभाविक रखता है।'
- source_word: τῷ λαῷ
  choice: अपने लोगों
  rationale: यहाँ λαός यहूदी लोगों को सूचित करता है। यूनानी में संबंध प्रसंग से स्पष्ट है; हिंदी में ‘अपने’ पौलुस की उसी समुदाय से एकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: अपने पूर्वजों की रीति-रिवाजों
  rationale: πατρῷος का वंशानुगत/पैतृक भाव ‘पूर्वजों की’ से स्पष्ट होता है; ‘रीति-रिवाज’ सामान्य आधुनिक हिंदी है।
- source_word: δέσμιος ἐξ Ἱεροσολύμων παρεδόθην
  choice: मुझे यरूशलेम से बन्दी बनाकर ... सौंप दिया गया
  rationale: δέσμιος की बंदी-अवस्था और निष्क्रिय παραδίδωμι के हिरासत में सौंपे जाने के अर्थ को सहज हिंदी में जोड़ा गया है।
- source_word: εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: रोमियों के हाथों
  rationale: यूनानी ‘हाथों में’ मुहावरे का हिंदी समतुल्य ‘हाथों’ हिरासत और अधिकार में दिए जाने का भाव बनाए रखता है।
theological_decisions:
- issue: ἄνδρες ἀδελφοί का संबोधन
  choice: भाइयो
  alternative: भाइयो और बहनो / हे पुरुष भाइयो
  rationale: यहाँ बुलाए गए यहूदी प्रमुख पुरुष हैं। ‘भाइयो’ स्रोत के पुल्लिंग संबोधन और पौलुस की सामुदायिक एकता दोनों को रखता है, जबकि विस्तृत रूप आधुनिक हिंदी में अस्वाभाविक होगा।
- issue: οὐδὲν ἐναντίον ποιήσας का संबंध
  choice: 'रियायती अर्थ: ‘यद्यपि ... फिर भी’'
  alternative: 'काल/परिस्थिति-सूचक: ‘कुछ भी न करने के बाद भी’ या शाब्दिक ‘कुछ भी न करके’'
  rationale: वक्तव्य पौलुस के निर्दोष आचरण और उसके रोमी हिरासत में सौंपे जाने के बीच विरोध को उभारता है; यह अनुवाद उसी तनाव को रखता है, कोई अतिरिक्त धर्मवैचारिक निष्कर्ष नहीं जोड़ता।
- issue: τῷ λαῷ में निहित सामुदायिक संबंध
  choice: अपने लोगों
  alternative: लोगों / इस्राएल के लोगों
  rationale: संज्ञा यहूदी समुदाय को इंगित करती है। ‘अपने’ प्रसंगगत संबंध स्पष्ट करता है, पर ‘इस्राएल’ जैसा स्रोत में अनुपस्थित विशिष्ट नाम नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘पौलुस’ को प्रसंगगत स्पष्टता के लिए जोड़ा गया है; ‘तीन दिन बाद’ ने यूनानी कथात्मक सूत्र को हिंदी में स्वाभाविक बनाया है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न [a]–[d] उपस्थित हैं।
