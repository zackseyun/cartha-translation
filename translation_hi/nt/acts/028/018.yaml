translation:
  language: hi
  text: उन्होंने मेरी जाँच करने के बाद मुझे रिहा करना चाहा, क्योंकि मेरे विरुद्ध ऐसा कोई आरोप नहीं था जिसके लिए मृत्युदंड दिया जा सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: उन्होंने
  rationale: पूर्ववर्ती बहुवचन व्यक्तियों की ओर संकेत करते हुए हिन्दी में स्वतंत्र वाक्य-प्रवाह के लिए ‘उन्होंने’ स्वाभाविक है; यहाँ ὅστις की विशेष गुणात्मक छाया प्रमुख नहीं है।
- source_word: ἀνακρίναντές με
  choice: मेरी जाँच करने के बाद
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई न्यायिक जाँच को दर्शाता है। ‘जाँच’ न्यायिक संदर्भ रखता है और ‘पूछताछ’ की अपेक्षा अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: ἐβούλοντο
  choice: चाहा
  rationale: यह भूतकाल में उनकी इच्छा या मंशा व्यक्त करता है; ‘चाहा’ सरल और स्वाभाविक हिन्दी है।
- source_word: ἀπολῦσαι
  choice: मुझे छोड़ देना
  rationale: हिरासत और न्यायिक संदर्भ में इसका अर्थ रिहा करना है। ‘छोड़ देना’ साधारण पाठक के लिए सहज है और संदर्भ में स्वतंत्र करने का भाव स्पष्ट करता है।
- source_word: διὰ τὸ ... ὑπάρχειν
  choice: क्योंकि ... नहीं पाया गया था
  rationale: διά के साथ आर्टिकुलर इनफिनिटिव कारण बताता है। हिन्दी में यह रचना कारण तथा जाँच के परिणाम—दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: मृत्युदंड के योग्य कोई अपराध नहीं
  rationale: न्यायिक संदर्भ में αἰτία आरोप, अपराध या दंड का आधार हो सकता है; θανάτου के साथ इसका आशय ऐसा दोष है जो मृत्यु का दंड उचित ठहराए। यह रूप कानूनी भाव को स्पष्ट रखता है।
- source_word: ἐν ἐμοί
  choice: मुझमें ... नहीं पाया गया था
  rationale: शाब्दिक स्थानिक अभिव्यक्ति को सुरक्षित रखते हुए हिन्दी में इसका न्यायिक आशय है कि पौलुस में/उसके विषय में ऐसा दोष नहीं मिला।
