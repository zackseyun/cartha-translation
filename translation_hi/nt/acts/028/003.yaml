base_translation:
  language: en
  yaml_path: translation/nt/acts/028/003.yaml
  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: hi
  text: पर जब पौलुस ने सूखी टहनियों का एक गट्ठर बटोरकर आग पर रखा, तो गर्मी के कारण[a] एक विषधर साँप निकल आया और उसके हाथ पर जा चिपक गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गर्मी से।” यूनानी पूर्वसर्ग का अधिक शाब्दिक अनुवाद इस प्रकार हो सकता है, यद्यपि यहाँ वह सम्भवतः कारण बताता है—साँप आग की गर्मी के कारण बाहर निकला।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके हाथ को जकड़ लिया”; अथवा, “उसके हाथ को काट लिया।” यूनानी क्रिया का व्यापक अर्थ किसी से दृढ़ता से लग जाना या उसे पकड़ लेना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: बटोरकर
  rationale: यह क्रिया यहाँ आग जलाने की सामग्री को इकट्ठा करने का भाव देती है। कृदंत की पूर्वकालिक क्रिया को स्वाभाविक हिन्दी क्रम में व्यक्त किया गया है।
- source_word: φρυγάνων τι πλῆθος
  choice: सूखी टहनियों का एक गट्ठर
  rationale: φρύγανα ईंधन के काम आने वाली सूखी छोटी लकड़ियों या झाड़-झंखाड़ को सूचित करता है, और τι πλῆθος उनकी अनिश्चित मात्रा को। यह रूप हिन्दी में ठोस और सहज है।
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: आग पर रखा
  rationale: यह पौलुस की अगली क्रिया को सरल आधुनिक हिन्दी में व्यक्त करता है; πυρά यहाँ जलती हुई आग है।
- source_word: ἔχιδνα
  choice: विषधर साँप
  rationale: ἔχιδνα सामान्य साँप से अधिक विशिष्ट रूप से वाइपर अथवा विषैले साँप को दर्शाता है। 'विषधर साँप' आधुनिक हिन्दी में सहज रहते हुए उसके विषैले होने को बनाए रखता है।
- source_word: ἀπὸ τῆς θέρμης
  choice: गर्मी के कारण
  rationale: ἀπό का मूल भाव 'से' है, पर इस प्रसंग में आग की गर्मी साँप के निकलने का कारण है। कारणवाचक अनुवाद हिन्दी में अर्थ को स्पष्ट करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐξελθοῦσα
  choice: निकल आया
  rationale: यह साँप के बाहर आने की पूर्ण क्रिया को स्वाभाविक कथात्मक हिन्दी में व्यक्त करता है।
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: उसके हाथ से जा चिपका
  rationale: καθάπτω का अर्थ पकड़ लेना या किसी से दृढ़ता से लग जाना हो सकता है। यह अनुवाद साँप के हाथ से जुड़े रहने का चित्र बनाए रखता है और केवल 'काट लिया' कहकर क्रिया को अनावश्यक रूप से संकीर्ण नहीं करता।
