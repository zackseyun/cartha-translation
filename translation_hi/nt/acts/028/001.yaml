- source_word: ἐπέγνωμεν
  choice: हमें पता चला
  rationale: यहाँ क्रिया किसी जानकारी को जान लेने या मालूम करने के अर्थ में है। ‘हमें पता चला’ द्वीप का नाम जानने के प्रसंग में सहज हिंदी है।
- source_word: Μελίτη
  choice: माल्टा
  rationale: यूनानी नाम Μελίτη परंपरागत रूप से माल्टा द्वीप के लिए पहचाना जाता है; ‘माल्टा’ इसका प्रचलित आधुनिक हिंदी नाम है।
- source_word: ἡ νῆσος
  choice: उस द्वीप
  rationale: निश्चित पदबंध को प्रसंगानुकूल हिंदी में ‘उस द्वीप’ कहा गया है, क्योंकि यात्री अब उसी द्वीप पर पहुँच चुके थे।
- source_word: καλεῖται
  choice: नाम … है
  rationale: यूनानी वर्तमान कर्मवाच्य का शाब्दिक भाव ‘कहलाता है’ है। नाम बताने के लिए ‘नाम माल्टा है’ अधिक स्वाभाविक हिंदी है और वर्तमान काल को भी बनाए रखता है।
