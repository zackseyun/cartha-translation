lexical_decisions:
- source_word: διασωθέντες
  choice: जब हम सुरक्षित बच गए
  rationale: यह क्रिया संकट से सकुशल बच निकलने या बचाए जाने का भाव देती है। हिंदी में यह रूप जहाज़ टूटने के संकट से सुरक्षित उद्धार को स्वाभाविक ढंग से व्यक्त करता है, जबकि कर्तृवाच्य और कर्मवाच्य के बीच स्रोत में उपस्थित अर्थ-व्याप्ति को पादटिप्पणी में रखा गया है।
- source_word: τότε
