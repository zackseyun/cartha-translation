source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: hi
  text: क्योंकि इस प्रजा का हृदय सुन्न हो गया है[a]; उनके कान सुनने में भारी हो गए हैं, और उन्होंने अपनी आँखें मूँद ली हैं—कहीं ऐसा न हो कि वे आँखों से देखें, कानों से सुनें, हृदय से समझें और लौट आएँ[b], और मैं उन्हें चंगा कर दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मोटा हो गया है”; यहाँ भाव है कि उनका हृदय संवेदनहीन या ग्रहण करने में जड़ हो गया है।
    reason: metaphor_clarification
  - marker: b
    text: “लौट आएँ” का अनुवाद “मुड़ें,” “वापस आएँ,” या संदर्भ में “पश्चाताप करें” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: सुन्न हो गया है
  rationale: शाब्दिक अर्थ ‘मोटा हो गया’ है, पर यहाँ रूपक रूप में संवेदनहीनता या ग्रहणशक्ति की जड़ता व्यक्त होती है। ‘सुन्न’ आधुनिक हिन्दी में इस रूपक का स्वाभाविक अर्थ देता है।
- source_word: καρδία
  choice: हृदय
  rationale: बाइबलीय मानव-विज्ञान का मूल पद बनाए रखता है और आगे ‘हृदय से समझें’ के साथ स्रोत की शब्दगत एकता सुरक्षित रखता है।
- source_word: βαρέως ἤκουσαν
  choice: कानों से कठिनाई से सुनते हैं
  rationale: βαρέως का भारीपन/दुर्बोध ग्रहण का भाव स्वाभाविक हिन्दी में व्यक्त करता है; ‘भारी होकर सुना’ अस्वाभाविक होता। उद्धरण की वर्तमान स्थिति को हिन्दी में सामान्य वर्तमान से व्यक्त किया गया है।
- source_word: ἐκάμμυσαν
  choice: अपनी आँखें मूँद ली हैं
  rationale: आँखों को जानबूझकर बंद करने का अर्थ स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
- source_word: μήποτε
  choice: कहीं ऐसा न हो कि
  rationale: ग्रीक के निषेधात्मक आशंका/उद्देश्यगत बल को सुरक्षित रखता है और दैवी न्याय तथा मानवीय उत्तरदायित्व के तनाव को हल किए बिना सामने रखता है।
- source_word: ἐπιστρέψωσιν
  choice: लौट आएँ
  rationale: मुड़ने या वापस लौटने की दिशात्मक छवि को बनाए रखता है और इसे केवल ‘पश्चाताप करें’ जैसे अधिक संकीर्ण धार्मिक पद में सीमित नहीं करता।
- source_word: ἰάσομαι
  choice: मैं उन्हें चंगा करूँ
  rationale: μήποτε से आरम्भ समन्वित आशंकात्मक क्रम के अंतर्गत हिन्दी संभाव्य रूप स्वाभाविक है और चंगाई की मूल छवि बनाए रखता है।
theological_decisions:
- issue: यशायाह के उद्धरण में दैवी अभिप्राय और कठोरता
  choice: मुख्य पाठ में ‘कहीं ऐसा न हो कि’
  alternative: ‘नहीं तो’ या ‘ऐसा न हो कि वे...’ को केवल परिणामसूचक ढंग से पढ़ना
  rationale: μήποτε में आशंका के साथ उद्देश्य/निवारण का अधिक प्रबल भाव संभव है। चुना हुआ रूप दैवी न्याय और लोगों द्वारा आँखें मूँदने—दोनों को बनाए रखता है, बिना इस तनाव को किसी एक धर्मवैज्ञानिक व्याख्या से समाप्त किए।
- issue: ἐπιστρέψωσιν का परिवर्तन-संबंधी अर्थ
  choice: लौट आएँ
  alternative: मुड़ें; वापस आएँ; पश्चाताप करें
  rationale: ‘लौट आएँ’ परमेश्वर की ओर वापसी का संदर्भगत अर्थ व्यक्त करता है, पर क्रिया को किसी विशिष्ट मतगत तकनीकी पद में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘हृदय,’ ‘मूँद ली,’ और ‘चंगा’ बाइबलीय छवियों को बनाए रखते हैं; वाक्य का क्रम यथासंभव स्रोत के समान रखा गया है।
