  text: And some were persuaded by what was being said[a], but others disbelieved.
translation:
  language: hi
  text: और कुछ लोग कही जा रही बातों से आश्वस्त हो रहे थे, पर दूसरे विश्वास नहीं कर रहे थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अविश्वास कर रहे थे”; या, “नहीं मान रहे थे।”
