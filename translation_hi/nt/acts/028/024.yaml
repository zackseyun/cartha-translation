lexical_decisions:
- source_word: ἐπείθοντο
  choice: सहमत हो रहे थे
  rationale: अपूर्ण काल में यह क्रिया पौलुस की बातों से प्रभावित होकर सहमत होने की चल रही प्रतिक्रिया व्यक्त करती है। यह केवल पूर्ण धार्मिक विश्वास का निष्कर्ष नहीं जोड़ती।
- source_word: τοῖς λεγομένοις
  choice: कही जा रही बातों से
  rationale: वर्तमान कर्मवाच्य कृदन्त उस समय कही जा रही बातों की विषयवस्तु और भाषण की जारी प्रकृति को व्यक्त करता है।
- source_word: ἠπίστουν
  choice: विश्वास नहीं कर रहे थे
  rationale: यह ἀπιστέω का सीधा और स्वाभाविक हिन्दी रूप है। इसमें अविश्वास की प्रतिक्रिया बनी रहती है, पर जानबूझकर इनकार करने का अतिरिक्त भाव नहीं जोड़ा जाता।
- source_word: οἱ μὲν ... οἱ δὲ
  choice: कुछ लोग ... पर दूसरे
  rationale: यह समूह के भीतर दो अलग प्रतिक्रियाओं का स्वाभाविक और स्पष्ट विरोध प्रकट करता है।
- source_word: καὶ
  choice: और
  rationale: यह पद को पिछले वृत्तांत से जोड़ता है, बिना संबंध का अधिक अर्थ निर्धारित किए।
theological_decisions:
- issue: दो प्रकार की प्रतिक्रियाओं का स्वरूप
  choice: 'पद को तत्काल कथात्मक स्तर पर रखा गया है: कुछ लोग पौलुस की बातों से सहमत हो रहे थे और दूसरे विश्वास नहीं कर रहे थे।'
  alternative: पहले समूह को पूर्ण अर्थ में उद्धार पाया हुआ और दूसरे को जानबूझकर कठोर बने अविश्वासी घोषित करना।
  rationale: यूनानी पाठ यहाँ संदेश के प्रति भिन्न प्रतिक्रियाएँ बताता है, पर प्रत्येक व्यक्ति की अंतिम आत्मिक दशा को स्पष्ट रूप से परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “सहमत हो रहे थे” चल रही प्रतिक्रिया को व्यक्त करता है और “विश्वास नहीं कर रहे थे” दूसरे समूह की विपरीत प्रतिक्रिया को बिना अनावश्यक रूप से हठ या जानबूझकर इनकार का भाव जोड़े सामने रखता है।
