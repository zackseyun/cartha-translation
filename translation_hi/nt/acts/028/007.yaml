source:
  edition: SBLGNT
  text: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον ὑπῆρχεν χωρία τῷ πρώτῳ τῆς νήσου ὀνόματι Ποπλίῳ, ὃς ἀναδεξάμενος ἡμᾶς ⸂τρεῖς ἡμέρας⸃ φιλοφρόνως ἐξένισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: hi
  text: उस स्थान के आस-पास उस द्वीप के प्रमुख व्यक्ति[a], पुब्लियुस, की ज़मीनें[b] थीं। उसने हमारा स्वागत किया और तीन दिन तक बड़ी आत्मीयता से हमारी मेहमाननवाज़ी की।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “द्वीप का प्रधान व्यक्ति।” यूनानी अभिव्यक्ति उस द्वीप के अग्रणी अथवा सर्वोच्च पद वाले व्यक्ति का संकेत दे सकती है।
    reason: alternative_reading
  - marker: b
    text: या “जागीरें”; यूनानी शब्द से आस-पास स्थित भू-संपत्ति का बोध होता है।
    reason: lexical_alternative
  - marker: c
    text: या “उसने हमारा स्वागत किया और तीन दिन तक कृपापूर्वक हमारा आतिथ्य किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: उस स्थान के आस-पास
  rationale: यह पदबंध निकटवर्ती क्षेत्र का संकेत देता है। δέ हल्का कथात्मक संयोजक है; इस स्वतंत्र पद में अलग से “अब” जोड़ना आवश्यक नहीं है।
- source_word: χωρία
  choice: ज़मीनें
  rationale: बहुवचन χωρία यहाँ आस-पास स्थित भू-संपत्ति या जागीरों को दर्शाता है। “ज़मीनें” बहुवचन और अर्थ की व्यापकता दोनों बनाए रखता है।
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: उस द्वीप के प्रमुख व्यक्ति
  rationale: πρῶτος यहाँ क्रम में ‘पहला’ होने के बजाय प्रतिष्ठा या उच्च पद का सूचक है। “प्रमुख व्यक्ति” संभावित आधिकारिक पद को अनावश्यक रूप से निश्चित किए बिना उसकी अग्रणी स्थिति बताता है।
- source_word: ὀνόματι Ποπλίῳ
  choice: पुब्लियुस
  rationale: ὀνόματι के साथ व्यक्ति का नाम बताया गया है। Πόπλιος के लिए “पुब्लियुस” निकट और प्रचलित देवनागरी लिप्यंतरण है।
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: उसने हमारा स्वागत किया
  rationale: क्रिया मेहमानों को स्वीकार करने और अपनापन दिखाने का भाव रखती है; “स्वागत किया” प्रसंग में स्वाभाविक है।
- source_word: τρεῖς ἡμέρας
  choice: तीन दिन तक
  rationale: यह समयावधि का कर्मकारक है और मेहमाननवाज़ी की अवधि बताता है।
- source_word: φιλοφρόνως ἐξένισεν
  choice: बड़ी आत्मीयता से हमारी मेहमाननवाज़ी की
  rationale: ξενίζω अतिथि के रूप में ठहराने और सत्कार करने को, तथा φιλοφρόνως मैत्रीपूर्ण और कृपालु ढंग को व्यक्त करता है। संयुक्त हिन्दी अभिव्यक्ति दोनों भावों को स्वाभाविक रूप से संप्रेषित करती है।
theological_decisions:
- issue: τῷ πρώτῳ τῆς νήσου पदवी है या सामान्य प्रतिष्ठा-सूचक वर्णन
  choice: प्रमुख व्यक्ति
  alternative: द्वीप का प्रधान अधिकारी
  rationale: यूनानी अभिव्यक्ति उच्चतम या अग्रणी स्थिति का संकेत देती है, पर पद किसी निश्चित प्रशासनिक कार्यालय का तकनीकी नाम था या नहीं, यह पद स्वयं स्पष्ट नहीं करता। इसलिए अनिश्चितता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। “मेहमाननवाज़ी” सामान्य पाठक के लिए स्वाभाविक है; फुटनोट में अधिक औपचारिक “आतिथ्य” दिया गया है।
