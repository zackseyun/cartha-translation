  text: ἀξιοῦμεν δὲ παρὰ σοῦ ἀκοῦσαι ἃ φρονεῖς, περὶ μὲν γὰρ τῆς αἱρέσεως ταύτης γνωστὸν ⸂ἡμῖν ἐστιν⸃ ὅτι πανταχοῦ ἀντιλέγεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: hi
  text: लेकिन हम उचित समझते हैं कि आपसे सुनें कि आपके विचार क्या हैं; क्योंकि इस पंथ[a] के विषय में हमें मालूम है कि हर जगह इसके विरुद्ध बातें कही जाती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दल” या “आंदोलन”; यहाँ यूनानी शब्द αἵρεσις का अर्थ आवश्यक रूप से बाद के तकनीकी अर्थ वाला “विधर्म” नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: हम उचित समझते हैं
  rationale: यहाँ क्रिया विनम्र और औपचारिक ढंग से किसी बात को उचित मानने का भाव व्यक्त करती है, न कि माँग करने का।
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: आपसे सुनें
  rationale: παρά के साथ संबंधवाचक रूप इस बात पर बल देता है कि वे पौलुस से स्वयं उसकी बात सुनना चाहते हैं।
- source_word: ἃ φρονεῖς
  choice: आपके विचार क्या हैं
  rationale: φρονέω यहाँ सोच या दृष्टिकोण के अर्थ में है; यह वाक्यांश आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: αἱρέσεως
  choice: पंथ
  rationale: प्रेरितों के काम के इस संदर्भ में शब्द किसी धार्मिक दल या आंदोलन को सूचित करता है, बाद के तकनीकी अर्थ में विधर्म को नहीं।
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: हमें मालूम है
  rationale: यूनानी के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और अनावश्यक रूप से कृत्रिम कर्मवाच्य से बचता है।
- source_word: πανταχοῦ
  choice: हर जगह
  rationale: यह πανταχοῦ के व्यापक स्थानवाचक अर्थ का सहज हिन्दी रूप है।
- source_word: ἀντιλέγεται
  choice: इसके विरुद्ध बातें कही जाती हैं
  rationale: कर्मवाच्य और बोलकर विरोध किए जाने, दोनों भावों को बनाए रखता है; केवल 'विरोध होता है' कहने से वाचिक पक्ष खो जाता।
theological_decisions:
- issue: αἵρεσις का अनुवाद
  choice: पंथ
  alternative: विधर्म; दल; आंदोलन
  rationale: यहाँ वक्ता मसीही समुदाय को एक पहचाने जाने वाले धार्मिक समूह के रूप में देखते हैं। 'विधर्म' बाद का तकनीकी, निंदात्मक अर्थ आरोपित कर सकता है, जो इस प्रसंग में आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में विनम्र, औपचारिक और सहज शैली रखी गई है। 'इसके विरुद्ध बातें कही जाती हैं' मूल के कर्मवाच्य तथा वाचिक विरोध को सुरक्षित रखता है।
