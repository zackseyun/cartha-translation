lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: इसलिए उसने
  rationale: यहाँ ὁ सर्वनाम की तरह पौलुस की ओर संकेत करता है, और μέν οὖν कथा को आगे बढ़ाने वाला हल्का संक्रमण व्यक्त करता है। ‘इसलिए उसने’ पूर्ववर्ती घटना के परिणामस्वरूप हुई क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀποτινάξας
  choice: झटककर
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले हुई क्रिया बताता है। ‘झटककर’ हिन्दी में इस पूर्वकालिक संबंध को संक्षेप और स्वाभाविक रूप से रखता है।
- source_word: τὸ θηρίον
  choice: उस जीव को
  rationale: θηρίον सामान्यतः किसी पशु या जीव के लिए प्रयुक्त होता है; यद्यपि संदर्भ में यह साँप है, मूल पद यहाँ विशिष्ट शब्द नहीं अपनाता। ‘उस जीव’ मूल की सामान्यता और पूर्ववर्ती संदर्भ दोनों बनाए रखता है।
- source_word: εἰς τὸ πῦρ
  choice: आग में गिरा दिया
  rationale: εἰς + कर्मकारक आग के भीतर की ओर गति व्यक्त करता है। ‘आग में गिरा दिया’ झटकने से उत्पन्न दिशा और परिणाम को सहज हिन्दी में स्पष्ट करता है।
- source_word: ἔπαθεν οὐδὲν κακόν
  choice: उसे कुछ भी हानि नहीं हुई
  rationale: πάσχω और οὐδὲν κακόν का संयुक्त अर्थ किसी चोट या बुरे प्रभाव का न होना है। यह हिन्दी प्रयोग अर्थ को स्वाभाविक और सटीक ढंग से व्यक्त करता है।
