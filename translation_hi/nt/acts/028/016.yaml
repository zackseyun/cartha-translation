  text: Ὅτε δὲ ⸀εἰσήλθομεν εἰς Ῥώμην, ⸂ἐπετράπη τῷ Παύλῳ⸃ μένειν καθ’ ἑαυτὸν σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: hi
  text: जब हम रोम में पहुँचे, तो पौलुस को उसकी रखवाली करने वाले सैनिक के साथ अलग रहने की अनुमति दी गई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पौलुस को एक सैनिक के साथ, जो उसकी रखवाली करता था, अलग से रहने की अनुमति दी गई।”
    reason: ‘रहने’ के लिए वैकल्पिक अभिव्यक्ति तथा सैनिक के उल्लेख को अनिश्चित रूप में व्यक्त करने की सम्भावना।
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: जब ... तो
  rationale: Ὅτε समय-संबंधी उपवाक्य आरम्भ करता है; δέ यहाँ हल्का संयोजक है, जिसे हिन्दी में मुख्य वाक्य के ‘तो’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: हम रोम में पहुँचे
  rationale: यद्यपि यूनानी पदबंध का शाब्दिक अर्थ ‘रोम में प्रवेश किया’ है, यात्रा-वृत्तांत में ‘रोम में पहुँचे’ आधुनिक हिन्दी में स्वाभाविक है और गंतव्य तक आने का भाव बनाए रखता है।
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: पौलुस को ... अनुमति दी गई
  rationale: निष्क्रिय क्रिया अनुमति दिए जाने को व्यक्त करती है; यह हिन्दी में औपचारिक, स्पष्ट और स्रोत के निकट है।
- source_word: μένειν
  choice: रहने
  rationale: संदर्भ में यह किसी स्थान पर ठहरकर रहने का बोध देता है; ‘रहने’ सहज और पर्याप्त व्यापक है।
- source_word: καθ’ ἑαυτόν
  choice: अलग
  rationale: इसका अर्थ दूसरों से अलग या अपने तौर पर रहना है। ‘अकेले’ कहने से अगले वाक्यांश में सैनिक की उपस्थिति के साथ अनावश्यक विरोधाभास पैदा हो सकता है।
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: अपनी रखवाली करने वाले सैनिक के साथ
  rationale: σύν साथ होने का भाव देता है और वर्तमान कृदंत सैनिक की भूमिका बताता है। यूनानी निश्चित लेख प्रसंग में नियुक्त सैनिक की ओर संकेत करता है, इसलिए ‘सैनिक’ को अनिश्चित ‘एक सैनिक’ के रूप में मुख्य पाठ में नहीं रखा गया।
