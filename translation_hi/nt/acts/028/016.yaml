  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘अलग रहने’ से पौलुस का अन्य बंदियों से पृथक निवास स्पष्ट होता है, बिना यह संकेत दिए कि उसके पास कोई पहरेदार नहीं था।
