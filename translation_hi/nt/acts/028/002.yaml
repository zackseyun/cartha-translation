  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बर्बर’ के आज के अपमानजनक अर्थ से बचते हुए मूल के जातीय-भाषायी संकेत को पादटिप्पणी में सुरक्षित रखा गया है।
