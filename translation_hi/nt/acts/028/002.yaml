source:
  edition: SBLGNT
  text: οἵ ⸀τε βάρβαροι παρεῖχον οὐ τὴν τυχοῦσαν φιλανθρωπίαν ἡμῖν, ⸀ἅψαντες γὰρ πυρὰν προσελάβοντο πάντας ἡμᾶς διὰ τὸν ὑετὸν τὸν ἐφεστῶτα καὶ διὰ τὸ ψῦχος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/002.yaml
  text: And the local people showed us extraordinary kindness[b][a], for they lit a fire and welcomed all of us because of the rain that had set in and because of the cold.
translation:
  language: hi
  text: वहाँ के निवासियों[a] ने हम पर असाधारण दयालुता[b] दिखाई। उन्होंने आग जलाई और हम सबका स्वागत किया, क्योंकि वर्षा हो रही थी और ठंड थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द βάρβαροι का शाब्दिक अर्थ ‘बर्बर लोग’ है, अर्थात यूनानी न बोलने वाले लोग। यहाँ इसका आशय द्वीप के स्थानीय निवासियों से है; इससे यह आवश्यक रूप से नहीं समझना चाहिए कि वे असभ्य या क्रूर थे।
    reason: lexical_alternative
  - marker: b
    text: या, “साधारण से कहीं बढ़कर दयालुता।” शाब्दिक रूप में, “कोई साधारण दयालुता नहीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: वहाँ के निवासी
  rationale: यह शब्द यहाँ द्वीप के गैर-यूनानी-भाषी स्थानीय लोगों को सूचित करता है। आधुनिक हिन्दी में ‘बर्बर’ अनावश्यक रूप से असभ्यता या क्रूरता का भाव देता, इसलिए संदर्भगत अर्थ को स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: असाधारण दयालुता
  rationale: यूनानी मुहावरे का अर्थ ‘साधारण नहीं’ या सामान्य से बढ़कर दयालुता है। यह चयन उसके बल को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παρεῖχον
  choice: व्यवहार किया
  rationale: φιλανθρωπία के साथ यह क्रिया दयालुता दिखाने या बरतने का भाव देती है; ‘दयालुता का व्यवहार किया’ हिन्दी में आतिथ्यपूर्ण आचरण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἅψαντες πυρὰν
  choice: आग जलाई
  rationale: यह पद आग सुलगाने या जलाने को दर्शाता है; सरल आधुनिक हिन्दी में ‘आग जलाई’ सटीक है।
- source_word: προσελάβοντο πάντας ἡμᾶς
  choice: हम सबका स्वागत किया
  rationale: मध्यवाच्य क्रिया यहाँ आतिथ्यपूर्वक ग्रहण करने का भाव रखती है, और ‘हम सब’ मूल के समावेशी बल को बनाए रखता है।
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: क्योंकि वर्षा आ पड़ी थी
  rationale: पूर्ण कृदंत ऐसी वर्षा का चित्र देता है जो आ चुकी थी और उस समय जारी थी। ‘आ पड़ी थी’ उसके अचानक उपस्थित और प्रतिकूल होने के भाव को संक्षेप में रखता है।
- source_word: διὰ τὸ ψῦχος
  choice: और ठंड थी
  rationale: ψῦχος ठंड या ठंडे मौसम को दर्शाता है; यह सीधा और स्वाभाविक हिन्दी रूप है।
