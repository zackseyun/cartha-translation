source:
  edition: SBLGNT
  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: hi
  text: 'यह कहते हुए[a], “इस प्रजा के पास जाओ और कहो: ‘तुम सुनोगे तो सही, पर कभी भी नहीं समझोगे; और देखते हुए देखोगे[b], पर कभी भी नहीं पहचानोगे।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यह वर्तमान कृदंत है: “यह कहते हुए”; यह पिछले वाक्य से जुड़ा है।'
    reason: grammar
  - marker: b
    text: 'अधिक शाब्दिक रूप: “और देखते हुए देखोगे, पर निश्चय ही नहीं देखोगे।” यूनानी में दृष्टि-संबंधी शब्द दोहराए गए हैं; प्रसंग में अंतिम क्रिया का अर्थ भीतर से पहचानना या समझना भी हो सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: यह कहते हुए
  rationale: वर्तमान कृदंत को पिछले वाक्य से जोड़ते हुए उद्धरण का परिचय देता है; ‘यह कहते हुए’ उस व्याकरणिक संबंध को बनाए रखता है।
- source_word: Πορεύθητι
  choice: जाओ
  rationale: गमन की आज्ञा के लिए स्वाभाविक और सीधा हिन्दी रूप।
- source_word: λαὸν τοῦτον
  choice: इस प्रजा
  rationale: सामूहिक और भविष्यद्वाणी-संबंधी संबोधन को बनाए रखता है; ‘प्रजा’ यहाँ λαός के सामूहिक भाव के अनुकूल है।
- source_word: Ἀκοῇ ἀκούσετε
  choice: तुम सुनते तो रहोगे
  rationale: सजातीय संज्ञा और क्रिया से बने सामी-शैली के बलाघात को स्वाभाविक हिन्दी में व्यक्त करता है और सुनने तथा समझने के विरोध को उभारता है।
- source_word: οὐ μὴ συνῆτε
  choice: पर कभी समझोगे नहीं
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को ‘कभी ... नहीं’ से व्यक्त किया गया है।
- source_word: βλέποντες βλέψετε
  choice: देखते तो रहोगे
  rationale: दोहराई गई दृष्टि-संबंधी भाषा और पहले खंड के समानांतर बलाघात को सहज हिन्दी में सुरक्षित रखता है।
- source_word: οὐ μὴ ἴδητε
  choice: पर कभी बूझोगे नहीं
  rationale: अंतिम दृष्टि-क्रिया के प्रसंगगत आंतरिक ग्रहण-बोध को ‘बूझना’ व्यक्त करता है, जबकि शाब्दिक ‘देखना’ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: यशायाह के उद्धरण में बाहरी सुनने-देखने और आंतरिक समझ-बोध के बीच तनाव
  choice: अंतिम क्रिया को ‘बूझोगे’ कहना
  alternative: ‘देखोगे’ कहना
  rationale: प्रसंग में शारीरिक दृष्टि और आंतरिक ग्रहण के बीच विरोध है। ‘बूझोगे’ इस अर्थ को संप्रेषित करता है, पर यूनानी की दृष्टि-संबंधी पुनरावृत्ति को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल भविष्यद्वाणी-शैली अपनाई गई है। ‘सुनते तो रहोगे’ और ‘देखते तो रहोगे’ से मूल के बलाघातपूर्ण समानांतर विन्यास को स्वाभाविक हिन्दी में रखा गया है; ‘प्रजा’ सामूहिक संबोधन को बनाए रखता है।
