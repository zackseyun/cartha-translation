source:
  edition: SBLGNT
  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: hi
  text: तीन महीने बाद हम सिकन्दरिया के एक जहाज़ पर समुद्र में निकले। उस जहाज़ ने उस द्वीप पर जाड़ा बिताया था और उस पर दियुस्कूरी[a] का चिह्न था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दियुस्कूरी यूनानी-रोमी पौराणिक कथाओं में ज़ीउस के जुड़वाँ पुत्र कैस्टर और पोलक्स का नाम है।
    reason: अपरिचित पौराणिक नाम और जहाज़ के चिह्न का सांस्कृतिक संदर्भ स्पष्ट करना।
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: तीन महीने बाद
  rationale: μετά के साथ कर्मकारक बीते हुए समयांतराल के बाद का समय बताता है। हल्का संयोजक δέ हिन्दी में अलग से व्यक्त किए बिना स्वाभाविक रूप से निहित है।
- source_word: ἀνήχθημεν
  choice: हम ... सवार होकर समुद्र में निकले
  rationale: नौपरिवहन के प्रसंग में ἀνάγω का अर्थ समुद्र में यात्रा के लिए निकलना है। हिन्दी में यह वाक्यांश जहाज़ पर चढ़ने और प्रस्थान करने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν πλοίῳ ... Ἀλεξανδρίνῳ
  choice: एक सिकन्दरिया के जहाज़ पर
  rationale: πλοῖον यहाँ बड़े समुद्री जहाज़ के लिए है और Ἀλεξανδρῖνος उसके सिकन्दरिया से संबंध या उद्गम को बताता है। 'सिकन्दरिया के जहाज़' आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: उस जहाज़ ने उस द्वीप पर जाड़ा बिताया था
  rationale: परिपूर्ण कृदन्त बताता है कि जहाज़ पहले ही उस द्वीप पर पूरी शीत ऋतु बिता चुका था। अलग वाक्य हिन्दी में संबंधों को स्पष्ट रखता है।
- source_word: παρασήμῳ Διοσκούροις
  choice: उस पर दियुस्कूरी का चिह्न था
  rationale: παράσημος जहाज़ की पहचान कराने वाले चिह्न, प्रतीक अथवा अग्रभाग की आकृति को सूचित कर सकता है। स्रोत में केवल 'figurehead' निश्चित नहीं है, इसलिए व्यापक 'चिह्न' मूल की सम्भावित अस्पष्टता बचाता है। Διόσκουροι को अर्थानुवाद करने के बजाय नाम के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: जहाज़ के गैर-यहूदी धार्मिक चिह्न Διοσκούροι का अनुवाद
  choice: दियुस्कूरी
  alternative: जुड़वाँ देवता / कैस्टर और पोलक्स
  rationale: मूल यूनानी में पौराणिक युगल का विशिष्ट नाम है। लिप्यंतरण वृत्तांत को न तो समर्थन के रूप में प्रस्तुत करता है, न उसकी धार्मिक पहचान को छिपाता है; पादटिप्पणी पाठक को आवश्यक सांस्कृतिक जानकारी देती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। समुद्री क्रिया को स्पष्ट करने के लिए 'समुद्र में निकले' और παρασήμῳ की व्यापकता बनाए रखने के लिए 'चिह्न' चुना गया है।
