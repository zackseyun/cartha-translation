  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: hi
  text: ऐसा हुआ कि पुब्लियुस का पिता बुखार के दौरों और पेचिश से जकड़ा हुआ[a] पड़ा था। पौलुस उसके पास गया और प्रार्थना करने के बाद उस पर अपने हाथ रखकर उसे चंगा कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुखार के दौरों और पेचिश से पीड़ित।” यूनानी कृदंत इन रोगों से पीड़ित या उनकी पकड़ में होने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: ऐसा हुआ कि
  rationale: यह लूका-प्रेरितों में घटना का परिचय देने वाला स्वाभाविक कथात्मक प्रयोग है। ‘ऐसा हुआ कि’ इसके घटना-आरंभकारी भाव को बिना किसी अतिरिक्त कालसूचक शब्द के व्यक्त करता है।
- source_word: τὸν πατέρα τοῦ Ποπλίου
  choice: पुब्लियुस का पिता
  rationale: यह यूनानी संबंधकारक रचना का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: πυρετοῖς
  choice: बुखार के दौरों
  rationale: यूनानी में बहुवचन है; ‘बुखार के दौरों’ से बार-बार या अनेक बार चढ़ने वाले बुखार का भाव स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: δυσεντερίῳ
  choice: पेचिश
  rationale: यह मूल चिकित्सा-संबंधी अर्थ का सीधा और आधुनिक हिन्दी में समझ आने वाला शब्द है।
- source_word: συνεχόμενον
  choice: से जकड़ा हुआ
  rationale: कृदंत रोगों से पकड़े या दबे होने की निरंतर दशा बताता है; ‘जकड़ा हुआ’ उसकी तीव्रता को सहज हिन्दी में व्यक्त करता है।
- source_word: κατακεῖσθαι
  choice: पड़ा था
  rationale: क्रिया लेटे या पड़े रहने को बताती है, विशेषकर बीमारी की दशा में; इससे मूल भाव सुरक्षित रहता है और ‘बिस्तर से उठ न सकना’ जैसी अतिरिक्त बात नहीं जोड़ी जाती।
- source_word: πρὸς ὃν ὁ Παῦλος εἰσελθὼν
  choice: पौलुस उसके पास भीतर गया
  rationale: यह पौलुस के उस स्थान में प्रवेश करने और रोगी के पास जाने, दोनों भावों को संक्षेप में रखता है।
- source_word: προσευξάμενος
  choice: प्रार्थना करने के बाद
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई प्रार्थना को दर्शाता है; यह हिन्दी में क्रम को स्पष्ट करता है।
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: उस पर अपने हाथ रखकर
  rationale: यह दोनों हाथ रखने के संकेत को सुरक्षित रखते हुए बाइबलीय प्रसंग में स्वाभाविक हिन्दी है।
- source_word: ἰάσατο αὐτόν
  choice: उसे चंगा कर दिया
  rationale: यह चंगा करने की कथात्मक घोषणा का सीधा और परिचित हिन्दी रूप है, जिसमें अतिरिक्त चिकित्सकीय या सांप्रदायिक व्याख्या नहीं जोड़ी गई।
theological_decisions:
- issue: पौलुस द्वारा चंगा किए जाने का स्वरूप
  choice: प्रार्थना, हाथ रखने और चंगा करने के क्रम को सीधे कथन के रूप में प्रस्तुत किया गया है।
  alternative: इसे स्पष्ट रूप से ‘चमत्कारी’ कहना या केवल चिकित्सकीय स्वस्थ होना बताना।
  rationale: पद चंगा किए जाने का दावा करता है, पर स्वयं यह नहीं बताता कि वह तत्काल हुआ, तकनीकी अर्थ में चमत्कार था, या किसी संस्कार के द्वारा हुआ। इसलिए अनुवाद कथन को रखता है, पर अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘बुखार के दौरों’ से यूनानी बहुवचन को अस्वाभाविक ‘बुखारों’ कहे बिना व्यक्त किया गया है। पादटिप्पणी का चिह्न उसी वाक्यांश पर रखा गया है जिससे उसका संबंध है।
