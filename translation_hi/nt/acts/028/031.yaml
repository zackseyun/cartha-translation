id: ACT.28.31
reference: Acts 28:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: κηρύσσων τὴν βασιλείαν τοῦ θεοῦ καὶ διδάσκων τὰ περὶ τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ πάσης παρρησίας ἀκωλύτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/031.yaml
  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: hi
  text: वह परमेश्वर के राज्य का प्रचार करता और प्रभु यीशु मसीहा[a] के विषय में शिक्षा देता रहा—पूरे साहस के साथ और बिना किसी रोक-टोक के।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अथवा: “यीशु मसीह।” यूनानी शब्द Χριστός एक उपाधि (“मसीहा”) के रूप में या कुछ संदर्भों में नाम-सदृश पद (“मसीह”) के रूप में प्रयुक्त हो सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσων
  choice: प्रचार करता रहा
  rationale: वर्तमान कृदंत पौलुस की लगातार चल रही सार्वजनिक घोषणा को व्यक्त करता है; हिंदी में प्रसंगानुकूल सीमित क्रिया-विन्यास अधिक स्वाभाविक है।
- source_word: βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह प्रचलित और स्वाभाविक पदबंध βασιλεία के राज्य और शासन—दोनों अर्थ-आयामों को खुला रखता है।
- source_word: διδάσκων
  choice: शिक्षा देता रहा
  rationale: यह κηρύσσων के समानांतर पौलुस की निरंतर शिक्षण-सेवा को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: τὰ περὶ
  choice: के विषय में
  rationale: शाब्दिक ‘विषय की बातें’ की अपेक्षा यह स्वाभाविक हिंदी है और यूनानी पदबंध के आशय को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: यह नए नियम में यीशु के लिए प्रयुक्त स्थापित सम्मानसूचक और मसीही उपाधि को सुरक्षित रखता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीहा
  rationale: मसीहा Χριστός के उपाधिसूचक अर्थ को स्पष्ट करता है; ‘मसीह’ की परिचित नाम-सदृश अभिव्यक्ति को पादटिप्पणी में रखा गया है।
- source_word: μετὰ πάσης παρρησίας
  choice: पूरे साहस के साथ
  rationale: यह निर्भीक और खुलकर बोलने के भाव को व्यक्त करता है तथा πάσης की तीव्रता बनाए रखता है।
- source_word: ἀκωλύτως
  choice: बिना किसी रोक-टोक के
  rationale: 'यह समापन क्रिया-विशेषण का जोर स्वाभाविक हिंदी में रखता है: पौलुस की घोषणा रोकी नहीं गई।'
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστός का उपाधि अथवा नाम-सदृश प्रयोग
  choice: यीशु मसीहा
  alternative: यीशु मसीह
  rationale: इस मसीही उपाधि का अर्थ पाठक के सामने प्रत्यक्ष रखने के लिए ‘मसीहा’ चुना गया है; फिर भी यूनानी Χριστός कुछ संदर्भों में नाम-सदृश ‘मसीह’ के रूप में भी ग्रहण किया जा सकता है, इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिंदी। यूनानी कृदंतों को प्रसंगगत निरंतरता दिखाने वाले ‘करता/देता रहा’ से व्यक्त किया गया है। अंतिम ἀκωλύτως को प्रभावपूर्ण वाक्यांत स्थान दिया गया है।
