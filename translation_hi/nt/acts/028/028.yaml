source:
  edition: SBLGNT
  text: γνωστὸν οὖν ⸂ἔστω ὑμῖν⸃ ὅτι τοῖς ἔθνεσιν ἀπεστάλη ⸀τοῦτο τὸ σωτήριον τοῦ θεοῦ· αὐτοὶ καὶ ⸀ἀκούσονται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: hi
  text: इसलिए तुम यह जान लो कि परमेश्वर का यह उद्धार गैर-यहूदियों के पास भेजा गया है[a]; वे भी सुनेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की ओर से यह उद्धार।” यूनानी सम्बन्धकारक को एक से अधिक निकटवर्ती अर्थों में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे भी ध्यान से सुनेंगे।” यहाँ प्रयुक्त क्रिया का अर्थ प्रसंग के अनुसार केवल सुनना अथवा ध्यान देकर ग्रहण करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: इसलिए तुम यह जान लो
  rationale: यह स्वाभाविक आधुनिक हिन्दी में निष्कर्षसूचक οὖν तथा सार्वजनिक घोषणा के भाव वाले यूनानी मुहावरे को स्पष्ट रूप से व्यक्त करता है।
- source_word: τοῖς ἔθνεσιν
  choice: गैर-यहूदियों के पास
  rationale: इस प्रसंग में ἔθνη यहूदियों से भिन्न अन्य लोगों को सूचित करता है; ‘गैर-यहूदी’ आधुनिक पाठक के लिए ‘अन्यजाति’ से अधिक सहज और स्पष्ट है।
- source_word: ἀπεστάλη
  choice: भेजा गया है
  rationale: अओरिस्ट कर्मवाच्य एक पूर्ण भेजे जाने को व्यक्त करता है जिसका वर्तमान प्रसंग में परिणाम बना हुआ है; हिन्दी पूर्णकाल इसे स्वाभाविक ढंग से रखता है।
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: परमेश्वर का यह उद्धार
  rationale: σωτήριον को उसके व्यापक मूल अर्थ ‘उद्धार’ में रखा गया है, ‘उद्धार का संदेश’ जैसा व्याख्यात्मक विस्तार नहीं किया गया। सम्बन्धकारक τοῦ θεοῦ की संभावित अर्थ-छायाएँ मुख्य पाठ में खुली रहती हैं।
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: वे भी सुनेंगे
  rationale: ἀκούω का मूल अर्थ ‘सुनना’ सुरक्षित रहता है, जबकि प्रसंग में ध्यान देकर ग्रहण करने की सम्भावना को पादटिप्पणी में दर्शाया गया है; αὐτοὶ καί का बल ‘वे भी’ से व्यक्त होता है।
theological_decisions:
- issue: σωτήριον का प्रसंगगत अर्थ
  choice: उद्धार
  alternative: उद्धार का संदेश
  rationale: यूनानी शब्द स्वयं उद्धार को सूचित करता है। प्रसंग में प्रचार निहित है, पर ‘संदेश’ जोड़ना मूल से अधिक विशिष्ट व्याख्या होती।
- issue: τοῦ θεοῦ सम्बन्धकारक का अर्थ
  choice: परमेश्वर का
  alternative: परमेश्वर की ओर से
  rationale: ‘परमेश्वर का’ मूल की वास्तविक अस्पष्टता को बनाए रखता है—यह उद्धार के स्रोत, सम्बन्ध या स्वामित्व की निकटवर्ती अर्थ-छायाएँ दे सकता है।
- issue: ἀκούσονται का बल
  choice: सुनेंगे
  alternative: ध्यान से सुनेंगे / मानेंगे
  rationale: ‘सुनेंगे’ शब्दार्थ को सुरक्षित रखता है और ग्रहणशील प्रतिक्रिया को निश्चित धर्म-परिवर्तन तक नहीं बढ़ाता; प्रसंगगत वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्पष्ट और गरिमापूर्ण शैली। ‘गैर-यहूदी’ सामान्य पाठकों के लिए सहज है। ‘तुम’ बहुवचन श्रोताओं को संबोधित करता है; वाक्य में अनावश्यक संस्कृतनिष्ठता से बचते हुए मूल की घोषणात्मक दृढ़ता रखी गई है।
