source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: hi
  text: पर वे यह उम्मीद कर रहे थे कि उसका शरीर सूज जाएगा या वह अचानक गिरकर मर जाएगा। पर जब वे बहुत देर तक प्रतीक्षा करते रहे और उन्होंने देखा कि उसके साथ कुछ भी असामान्य नहीं हो रहा था[a], तो उन्होंने अपनी राय बदल ली और कहने लगे कि वह कोई देवता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके साथ कोई अनहोनी” या “कोई गड़बड़ी” नहीं हो रही थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεδόκων
  choice: यह उम्मीद कर रहे थे
  rationale: अपूर्ण काल उनकी लगातार बनी हुई अपेक्षा को व्यक्त करता है; आधुनिक हिंदी में यह स्वाभाविक और स्पष्ट है।
- source_word: πίμπρασθαι
  choice: उसका शरीर सूज जाएगा
  rationale: सर्पदंश के प्रसंग में क्रिया शारीरिक सूजन को सूचित करती है; ‘शरीर’ जोड़ने से हिंदी में आशय स्वाभाविक रूप से स्पष्ट होता है।
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: वह अचानक गिरकर मर जाएगा
  rationale: यह अनुवाद अचानक गिरने और मृत्यु—दोनों भावों को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: ἐπὶ πολὺ
  choice: बहुत देर तक
  rationale: यह वाक्यांश लंबे समय तक प्रतीक्षा और निरीक्षण किए जाने को दर्शाता है।
- source_word: θεωρούντων
  choice: उन्होंने देखा
  rationale: प्रसंग में ध्यानपूर्वक देखते रहने से प्राप्त प्रत्यक्ष बोध अभिप्रेत है; संयुक्त वाक्य में ‘देखा’ सहज है।
- source_word: μηδὲν ἄτοπον
  choice: कुछ भी असामान्य नहीं
  rationale: ἄτοπος के ‘असामान्य/अनहोना’ अर्थ को सुरक्षित रखता है और केवल ‘हानिकारक’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: μεταβαλόμενοι
  choice: उन्होंने अपनी राय बदल ली
  rationale: यह उनके निष्कर्ष या मत में आए उलटाव को स्पष्ट करता है।
- source_word: ἔλεγον
  choice: कहने लगे
  rationale: अपूर्ण काल को आरंभिक और जारी कथन के रूप में स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: θεόν
  choice: कोई देवता
  rationale: बहुदेववादी प्रसंग में अनिश्चित अर्थ उपयुक्त है; इससे पौलुस को एकमात्र परमेश्वर बताने का गलत संकेत नहीं मिलता।
theological_decisions:
- issue: αὐτὸν εἶναι θεόν का ऐसा अनुवाद जो पौलुस के विषय में बाद की ईसाई धार्मिक धारणा न जोड़े
  choice: कि वह कोई देवता है
  alternative: कि वह परमेश्वर है; कि वह दिव्य है
  rationale: वर्णन द्वीपवासियों के गलत, बहुदेववादी निष्कर्ष को रिपोर्ट करता है। अनिर्दिष्ट θεόν और प्रसंग के कारण ‘कोई देवता’ संदर्भानुकूल है तथा एकमात्र परमेश्वर के साथ भ्रम से बचाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सहज और गरिमापूर्ण रखी गई है। ‘उम्मीद’, ‘असामान्य’ और ‘अपनी राय बदल ली’ सामान्य पाठकों के लिए स्पष्ट हैं; ‘कोई देवता’ स्थानीय बहुदेववादी दृष्टिकोण को व्यक्त करता है।
