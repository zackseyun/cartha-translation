  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: hi
  text: पर यहूदियों के विरोध करने के कारण मुझे कैसर के पास अपील करने के लिए विवश होना पड़ा—इसलिए नहीं कि मेरे पास अपने राष्ट्र के विरुद्ध लगाने के लिए कोई आरोप था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: जब ... ने विरोध किया
  rationale: वर्तमान कृदंत वाला संबंधकारक निरपेक्ष प्रयोग उस परिस्थिति को बताता है जिसके कारण पौलुस ने अपील की। ‘विरोध किया’ कानूनी संदर्भ में स्वाभाविक है और केवल मौखिक असहमति तक अर्थ को सीमित नहीं करता।
- source_word: δὲ
  choice: पर
  rationale: पिछली बात से हल्का विरोध या नया मोड़ दिखाता है।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों
  rationale: यूनानी पाठ के सामान्य पद को बनाए रखा गया है; संदर्भ में इसका संकेत पौलुस का विरोध करने वाले यहूदी पक्ष की ओर है, जिसकी स्पष्टता पादटिप्पणी में दी गई है।
- source_word: ἠναγκάσθην
  choice: विवश होना पड़ा
  rationale: निष्क्रिय क्रिया बाहरी दबाव या बाध्यता व्यक्त करती है; यह हिंदी में स्वाभाविक रहते हुए उस विवशता को सुरक्षित रखती है।
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: कैसर से अपील करने
  rationale: यह सम्राट के न्यायाधिकार की दुहाई देकर कानूनी अपील करने का पारिभाषिक प्रयोग है। ‘कैसर से अपील’ स्पष्ट और परिचित न्यायिक अभिव्यक्ति है।
- source_word: οὐχ ὡς
  choice: ऐसा नहीं कि
  rationale: पौलुस अपने उद्देश्य के विषय में एक संभावित गलत निष्कर्ष को नकारता है; यह हिंदी में स्वाभाविक रूप से उस स्पष्टीकरण को व्यक्त करता है।
- source_word: τοῦ ἔθνους μου
  choice: अपने राष्ट्र
  rationale: ἔθνος यहाँ पौलुस के अपने जातीय-राष्ट्रीय समुदाय को दर्शाता है। ‘राष्ट्र’ मूल के सार्वजनिक और सामूहिक भाव को बनाए रखता है।
- source_word: ἔχων τι κατηγορεῖν
  choice: मुझे ... कोई आरोप लगाना था
  rationale: यह अभिव्यक्ति किसी के विरुद्ध आरोप या अभियोग रखने का न्यायिक भाव देती है; हिंदी वाक्य-विन्यास में इसे सहज रूप दिया गया है।
theological_decisions:
- issue: संवेदनशील जातीय-धार्मिक अभिव्यक्ति ‘यहूदियों’ का संदर्भ
  choice: मुख्य पाठ में τῶν Ἰουδαίων का सीधा अनुवाद ‘यहूदियों’ रखा गया है।
  alternative: ‘यहूदी अगुवों’ या ‘यहूदिया के लोगों’
  rationale: मूल पाठ स्वयं संदर्भ को अगुवों तक सीमित नहीं करता। फिर भी प्रसंग में यह पौलुस के विरोधी और अभियोग लगाने वाले यहूदी पक्ष को सूचित करता है, सभी यहूदियों के बारे में सार्वभौमिक कथन नहीं; यह स्पष्टीकरण पादटिप्पणी में उचित है।
- issue: पौलुस का अपने राष्ट्र के प्रति उद्देश्य
  choice: वाक्य को इस प्रकार रखा गया है कि पौलुस कैसर से की गई अपील को अपने राष्ट्र के विरुद्ध अभियोग के रूप में नकारता है।
  alternative: इसे इस अर्थ में लेना कि पौलुस के पास अपने राष्ट्र के विरुद्ध कोई आरोप था ही नहीं
  rationale: οὐχ ὡς के साथ कृदंत वाक्यांश मुख्यतः अपील के उद्देश्य या भाव को स्पष्ट करता है। हिंदी में ‘ऐसा नहीं कि ... लगाना था’ इस सूक्ष्मता को बनाए रखता है और अत्यधिक निर्णायक विस्तार नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कैसर से अपील’ कानूनी संदर्भ को स्पष्ट करता है; ‘विवश होना पड़ा’ मूल की बाध्यता और ‘अपने राष्ट्र’ उसके सामूहिक जातीय-राष्ट्रीय भाव को बनाए रखते हैं।
