source:
  edition: SBLGNT
  text: οὗ εὑρόντες ἀδελφοὺς παρεκλήθημεν ⸀παρ’ αὐτοῖς ἐπιμεῖναι ἡμέρας ἑπτά· καὶ οὕτως εἰς τὴν Ῥώμην ἤλθαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: hi
  text: वहाँ हमें भाई मिले[a], और हमसे अनुरोध किया गया कि हम उनके यहाँ सात दिन ठहरें। और इस तरह हम रोम पहुँचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाई-बहन”; यूनानी में “भाई” है, पर यहाँ संभवतः सामान्य रूप से साथी विश्वासियों की बात है।
    reason: मूल शब्द के व्याकरणिक रूप और प्रसंग में उसके व्यापक, संभवतः समावेशी अर्थ—दोनों को दिखाना।
lexical_decisions:
- source_word: οὗ
  choice: वहाँ
  rationale: यह स्थानवाचक संबंधसूचक क्रियाविशेषण पिछले पद में बताए गए पुतियुली नगर की ओर संकेत करता है; वाक्य के आरंभ में ‘वहाँ’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: εὑρόντες
  choice: हमें ... मिले
  rationale: अओरिस्ट कृदन्त को हिन्दी में स्वाभाविक क्रमबद्ध क्रिया के रूप में व्यक्त किया गया है; ‘हमें भाई मिले’ मूल के ‘पाकर/ढूँढ़कर पाया’ अर्थ को सहज ढंग से रखता है।
- source_word: ἀδελφοὺς
  choice: भाई
  rationale: मूल यूनानी में पुल्लिंग बहुवचन ‘भाइयों’ का शब्द है, जो यहाँ स्थानीय मसीही विश्वासियों को सूचित करता है। मुख्य पाठ में उसका निकट रूप रखा गया और व्यापक संदर्भगत अर्थ पादटिप्पणी में बताया गया है।
- source_word: παρεκλήθημεν
  choice: हमसे अनुरोध किया गया
  rationale: पराकालेओ का निष्क्रिय रूप यहाँ ठहरने के लिए किए गए निवेदन को दर्शाता है। यह अनुवाद निष्क्रियता और विनम्र आग्रह—दोनों को बनाए रखता है।
- source_word: παρ’ αὐτοῖς
  choice: उनके यहाँ
  rationale: पर्यटन और आतिथ्य के प्रसंग में παρά के साथ दत्तिव उनके निवास या संगति में ठहरने का भाव देता है; ‘उनके यहाँ’ हिन्दी में स्वाभाविक है।
- source_word: ἐπιμεῖναι
  choice: ठहरें
  rationale: यात्रा के संदर्भ में इसका अर्थ किसी स्थान पर कुछ समय रहना है; ‘ठहरना’ आधुनिक हिन्दी का सहज विकल्प है।
- source_word: ἡμέρας ἑπτά
  choice: सात दिन
  rationale: यह समयावधि बताने वाला कर्मकारक प्रयोग है; हिन्दी में अवधि बिना अतिरिक्त परसर्ग के स्पष्ट है।
- source_word: καὶ οὕτως
  choice: और इस तरह
  rationale: यह यात्रा-वृत्तांत में घटनाक्रम और परिणाम को जोड़ता है तथा यूनानी संयोजक की शक्ति को बनाए रखता है।
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: हम रोम पहुँचे
  rationale: εἰς के साथ ἔρχομαι गंतव्य तक आने या पहुँचने को व्यक्त करता है; ‘पहुँचे’ हिन्दी में आगमन को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: ἀδελφοὺς का संदर्भ
  choice: स्थानीय मसीही समुदाय के सहविश्वासी, मुख्य पाठ में ‘भाई’
  alternative: सगे भाई; सामान्य यहूदी बंधु; या मुख्य पाठ में ‘भाई-बहन’
  rationale: प्रेरितों के काम के ऐसे यात्रा और आतिथ्य संबंधी प्रसंगों में यह शब्द सामान्यतः सहविश्वासियों के लिए आता है। फिर भी मूल का पुल्लिंग शब्द मुख्य पाठ में सुरक्षित रखा गया है और उसके संभावित समावेशी संदर्भ को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उनके यहाँ’ आतिथ्य के प्रसंग में बोलचाल की स्वाभाविकता देता है, जबकि ‘हमसे अनुरोध किया गया’ मूल की निष्क्रिय रचना और विनम्र आग्रह को सुरक्षित रखता है।
