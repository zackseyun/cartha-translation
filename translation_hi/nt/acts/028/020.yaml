  text: διὰ ταύτην οὖν τὴν αἰτίαν παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι, ἕνεκεν γὰρ τῆς ἐλπίδος τοῦ Ἰσραὴλ τὴν ἅλυσιν ταύτην περίκειμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: hi
  text: इसी कारण, इसलिए मैंने आप लोगों से मिलने और बातचीत करने का अनुरोध किया, क्योंकि इस्राएल की आशा[a] के कारण ही मैं यह ज़ंजीर पहने हुए हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इस्राएल से जुड़ी आशा’ अथवा ‘इस्राएल को दी गई आशा।’ प्रसंग में इसमें मसीह और पुनरुत्थान की आशा का संकेत हो सकता है।
    reason: यूनानी संबंधकारक पद के संभावित अर्थ-संबंध और धार्मिक संकेत को विकल्पात्मक रूप में स्पष्ट करता है, बिना किसी एक व्याख्या को निश्चित किए।
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: इसलिए
  rationale: यह स्वाभाविक आधुनिक हिन्दी में कारणसूचक पद और निष्कर्षसूचक οὖν—दोनों का संयुक्त भाव व्यक्त करता है; ‘इसी कारण, इसलिए’ अधिक अनावश्यक पुनरुक्ति जैसा लगता।
- source_word: παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι
  choice: मैंने आप लोगों से मिलने और बातचीत करने का अनुरोध किया
  rationale: παρεκάλεσα का विनम्र अनुरोध वाला भाव और दोनों infinitives—मिलना तथा परस्पर बातचीत करना—स्वाभाविक हिन्दी में सुरक्षित रहते हैं।
- source_word: ἕνεκεν γὰρ
  choice: क्योंकि ... के कारण ही
  rationale: ‘क्योंकि’ γάρ की व्याख्यात्मक कड़ी को और ‘के कारण ही’ ἕνεκεν के स्पष्ट कारणात्मक बल को दर्शाता है।
- source_word: τῆς ἐλπίδος τοῦ Ἰσραήλ
  choice: इस्राएल की आशा
  rationale: यह संक्षिप्त संबंधकारक अभिव्यक्ति को बिना यह तय किए सुरक्षित रखता है कि आशा का आशय केवल पुनरुत्थान, मसीही प्रतिज्ञा या व्यापक वाचागत आशा है।
- source_word: τὴν ἅλυσιν ταύτην περίκειμαι
  choice: मैं यह ज़ंजीर पहने हुए हूँ
  rationale: एकवचन ἅλυσιν को बनाए रखता है और περίκειμαι के शरीर पर पड़ी/लिपटी वस्तु के सजीव बिंब को व्यक्त करता है; ‘बंधा हूँ’ उस ठोस बिंब को कुछ समतल कर देता।
theological_decisions:
- issue: ‘इस्राएल की आशा’ का आशय
  choice: वाक्यांश को बिना विस्तार के ‘इस्राएल की आशा’ रखा गया है।
  alternative: ‘इस्राएल से प्रतिज्ञा की गई आशा’, ‘इस्राएल की पुनरुत्थान की आशा’ या ‘इस्राएल की मसीही आशा’।
  rationale: मूल यूनानी वाक्यांश संक्षिप्त और संकेतपूर्ण है। प्रसंग में इसमें वाचा, मसीह और पुनरुत्थान संबंधी आशा की प्रतिध्वनि हो सकती है, पर किसी एक अर्थ को मुख्य पाठ में जोड़ना मूल की धार्मिक व्यापकता और तनाव को संकरा कर देगा।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और बोलचाल में सहज है। ‘आप लोगों’ से बहुवचन स्पष्ट होता है; ‘बातचीत’ προσλαλῆσαι के संवादात्मक भाव को व्यक्त करता है; ‘ज़ंजीर पहने हुए’ पौलुस की हिरासत का ठोस और सजीव चित्र बनाए रखता है।
