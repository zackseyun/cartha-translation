source:
  edition: SBLGNT
  text: κἀκεῖθεν οἱ ἀδελφοὶ ἀκούσαντες τὰ περὶ ἡμῶν ⸀ἦλθαν εἰς ἀπάντησιν ἡμῖν ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν, οὓς ἰδὼν ὁ Παῦλος εὐχαριστήσας τῷ θεῷ ἔλαβε θάρσος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: hi
  text: और वहाँ से भाई[a], हमारे विषय में सुनकर, हमसे मिलने अप्पियुस के फोरुम और तीन सराय तक आए। उन्हें देखकर पौलुस ने परमेश्वर को धन्यवाद दिया और साहस पाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाई-बहन”; यूनानी में “भाई” है। संगी विश्वासियों के लिए प्रयुक्त यह सामान्य संबोधन प्रसंग के अनुसार स्त्रियों को भी सम्मिलित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: वहाँ से
  rationale: καί + ἐκεῖθεν यात्रा-वृत्तांत को आगे बढ़ाते हुए स्थान-परिवर्तन बताता है; हिन्दी में ‘वहाँ से’ स्वाभाविक है।
- source_word: οἱ ἀδελφοὶ
  choice: भाई
  rationale: यह रोम के संगी विश्वासियों के लिए प्रयुक्त संबोधन है। यूनानी का पुल्लिंग बहुवचन रूप मुख्य पाठ में रखा गया है; प्रसंग में स्त्रियाँ भी सम्मिलित हो सकती हैं, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: हमारे विषय में सुनकर
  rationale: कृदंत को कालगत रूप में व्यक्त किया गया है। यह हमारे संबंध में बात सुनने का अर्थ देता है, बिना ‘समाचार’ जैसे अतिरिक्त संज्ञा-पद को अनिवार्य बनाए।
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: हमसे मिलने ... आए
  rationale: यह किसी की अगवानी या उससे मिलने आने का सामान्य मुहावरा है; हिन्दी वाक्यक्रम के अनुसार स्थानों को बीच में रखा गया है।
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: अप्पियुस के बाज़ार और तीन सराय तक
  rationale: ἄχρι दूरी की सीमा दर्शाता है, इसलिए ‘तक’ उपयुक्त है। Φόρον का आशय बाज़ार/फोरम है और Ταβέρναι का सरायों से; नामों को हिन्दी में अर्थ-सह लिप्यंतरित किया गया है।
- source_word: οὓς ἰδὼν ὁ Παῦλος
  choice: उन्हें देखकर पौलुस ने
  rationale: संबंधवाचक सर्वनाम का संकेत पहले उल्लिखित भाइयों की ओर है; कृदंत का स्वाभाविक हिन्दी रूप ‘उन्हें देखकर’ है।
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: परमेश्वर को धन्यवाद दिया
  rationale: क्रिया-क्रम को हिन्दी में पूर्ण क्रिया से व्यक्त किया गया है और τῷ θεῷ का स्पष्ट कर्म सुरक्षित है।
- source_word: ἔλαβε θάρσος
  choice: उसका हौसला बढ़ा
  rationale: शाब्दिक ‘साहस पाया/लिया’ का आशय मन में प्रोत्साहन और साहस प्राप्त होना है; ‘उसका हौसला बढ़ा’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
theological_decisions:
- issue: संभवतः मिश्रित मसीही समुदाय के लिए ἀδελφοί का अनुवाद
  choice: भाई
  alternative: भाई-बहन; विश्वासी
  rationale: मुख्य पाठ में यूनानी के पुल्लिंग बहुवचन रूप को सुरक्षित रखा गया है, जबकि व्यापक समावेशी आशय को पादटिप्पणी में बताया गया है; इससे न तो स्त्रियों को प्रसंग से बाहर मान लिया जाता है, न मूल रूप को चुपचाप बदला जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण यात्रा-वृत्तांत। ‘बाज़ार’ और ‘सराय’ सामान्य पाठक के लिए स्थान-नामों का अर्थ स्पष्ट रखते हैं; ‘हौसला बढ़ा’ मुहावरे का स्वाभाविक हिन्दी रूप है।
