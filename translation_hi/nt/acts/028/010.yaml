  text: They also honored us greatly[a], and when we were setting sail[c][b], they put on board what we needed.
translation:
  language: hi
  text: उन्होंने अनेक प्रकार से हमारा सम्मान किया[a], और जब हम समुद्री यात्रा पर निकलने लगे[b], तो उन्होंने हमारी ज़रूरत की चीज़ें जहाज़ पर रख दीं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्होंने अनेक सम्मानों से हमारा सम्मान किया।”
    reason: lexical_alternative
  - marker: b
    text: या, “जब हम समुद्र में निकलने लगे।” यह यूनानी शब्द जहाज़ से यात्रा आरम्भ करने के लिए प्रयुक्त एक नौपरिवहन संबंधी शब्द है।
    reason: lexical_alternative
  - marker: c
    text: या, “उन्होंने हमारी ज़रूरत की चीज़ें हमें दे दीं।” यूनानी में अधिक शाब्दिक रूप से है कि उन्होंने हमारी ज़रूरतों के लिए आवश्यक वस्तुएँ जहाज़ पर रख दीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλαῖς τιμαῖς
  choice: अनेक प्रकार से हमारा सम्मान किया
  rationale: यह स्वाभाविक हिन्दी में सम्मान की बहुल और ठोस अभिव्यक्तियों का भाव देता है; यूनानी संज्ञा और उसी मूल की क्रिया की पुनरुक्ति को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐτίμησαν
  choice: सम्मान किया
  rationale: τιμάω का सीधा और वर्तमान मानक हिन्दी में सहज अर्थ है।
- source_word: ἀναγομένοις
  choice: जब हम समुद्री यात्रा पर निकलने लगे
  rationale: नौपरिवहन के संदर्भ में ἀνάγω यात्रा आरम्भ करके समुद्र में निकलने को दर्शाता है; अनुवाद समुद्री अर्थ को स्पष्ट रखता है।
- source_word: ἐπέθεντο
  choice: जहाज़ पर रख दीं
  rationale: क्रिया का मूल भाव वस्तुएँ रखने का है; प्रसंग से निहित जहाज़ को हिन्दी में स्पष्ट करना स्वाभाविक है।
- source_word: τὰ πρὸς τὰς χρείας
  choice: हमारी ज़रूरत की चीज़ें
  rationale: यह आवश्यक वस्तुओं या रसद का ठोस बहुवचन भाव बनाए रखते हुए हिन्दी की अनावश्यक पुनरुक्ति से बचता है।
