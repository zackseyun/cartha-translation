lexical_decisions:
- source_word: συζήτησις
  choice: वाद-विवाद
  rationale: यह शब्द चर्चा, बहस या विवाद को दर्शा सकता है। प्रसंग में पौलुस की बात पर यहूदी अगुओं की असहमति की तीव्रता व्यक्त करने के लिए ‘वाद-विवाद’ स्वाभाविक और उपयुक्त है।
- source_word: ἀπέρχομαι
  choice: वहाँ से चले गए
  rationale: यह सामान्य गति-सूचक क्रिया है। आधुनिक हिन्दी में ‘वहाँ से चले गए’ दृश्य से उनके प्रस्थान को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: ἐν ἑαυτοῖς
  choice: आपस में
  rationale: यह अभिव्यक्ति समूह के सदस्यों के परस्पर विचार-विनिमय को दर्शाती है; ‘आपस में’ आधुनिक हिन्दी का स्वाभाविक समतुल्य है।
