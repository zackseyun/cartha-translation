    text: यह पूरा पद सबसे प्राचीन यूनानी हस्तलिपियों में नहीं मिलता, जिनमें तीसरी शताब्दी का पपीरस 74 तथा चौथी शताब्दी की सिनैटिकस और वैटिकनस हस्तलिपियाँ शामिल हैं; यह आरम्भिक कॉप्टिक अनुवादों में भी नहीं है। यह बीजान्टिन बहुसंख्यक पाठ-परम्परा तथा प्राचीन लैटिन और सिरियाई अनुवादों में मिलता है। सम्भवतः यह बाद के किसी नकलनवीस द्वारा यहूदियों के प्रस्थान के वृत्तान्त को पूर्ण करने के लिए जोड़ा गया विस्तार है।
