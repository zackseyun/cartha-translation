lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: रहा
  rationale: यहाँ क्रिया किसी स्थान पर बने रहने या निवास करने को व्यक्त करती है। ‘रहा’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: δὲ
  choice: और
  rationale: यह हल्का कथात्मक संयोजक है, प्रबल विरोध नहीं; इसलिए ‘और’ प्रसंग के प्रवाह के अनुकूल है।
- source_word: διετίαν ὅλην
  choice: पूरे दो वर्ष
  rationale: यह अवधि के पूर्ण दो वर्षों पर दिए गए बल को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἐν ἰδίῳ μισθώματι
  choice: अपने किराए के निवास में
  rationale: μίσθωμα किराए पर लिए गए रहने के स्थान को दर्शाता है। ‘निवास’ इतना व्यापक है कि मूल में अनिश्चित भवन-प्रकार को घर या कमरा मानकर सीमित नहीं करता।
- source_word: ἀπεδέχετο
  choice: स्वागत करता रहा
  rationale: अपूर्ण भूतकालीन रूप निरंतर या बार-बार होने वाली क्रिया दर्शाता है; ‘स्वागत करता रहा’ ग्रहण करने के साथ निहित सौहार्द और जारी क्रिया दोनों को व्यक्त करता है।
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: उन सबका ... जो उसके पास भीतर आते थे
  rationale: ‘भीतर आते थे’ εἰσπορεύομαι की प्रवेश करने वाली स्थानिक बारीकी बनाए रखता है, जबकि वाक्य हिन्दी में बोधगम्य रहता है।
