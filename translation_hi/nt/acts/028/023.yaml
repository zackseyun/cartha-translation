source:
  edition: SBLGNT
  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: hi
  text: जब उन्होंने उसके साथ एक दिन तय किया, तो पहले से अधिक लोग उसके ठहरने के स्थान[a] पर आए। उसने उन्हें परमेश्वर के राज्य के विषय में समझाया और उसके विषय में गंभीरता से गवाही दी; साथ ही, वह मूसा की व्यवस्था और भविष्यद्वक्ताओं के लेखों के आधार पर यीशु के विषय में उन्हें विश्वास दिलाने का प्रयत्न करता रहा[c]। वह सुबह से शाम तक ऐसा करता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके निवास पर’ अथवा ‘जहाँ वह ठहरा हुआ था।’ यूनानी शब्द का अर्थ ठहरने की जगह या आवास है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उन्हें विश्वास दिलाता रहा।’ यूनानी कृदंत मनाने की क्रिया या मनाने के प्रयास—दोनों पर बल दे सकता है; इससे यह आवश्यक नहीं कि सभी श्रोता मान गए।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι ... αὐτῷ ἡμέραν
  choice: उन्होंने उसके साथ एक दिन तय किया
  rationale: यह यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और बैठक के लिए दिन निश्चित करने का भाव व्यक्त करता है।
- source_word: πλείονες
  choice: और भी अधिक लोग
  rationale: तुलनात्मक अर्थ को बनाए रखता है; केवल ‘बहुत-से लोग’ कहने से यह सूक्ष्मता मिट जाती।
- source_word: εἰς τὴν ξενίαν
  choice: उसके ठहरने की जगह पर
  rationale: ξενία रहने के अस्थायी स्थान या निवास-सुविधा को दर्शाता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐξετίθετο
  choice: व्याख्या करता ... रहा
  rationale: अपूर्ण काल में चलती हुई विस्तृत व्याख्या का भाव है।
- source_word: διαμαρτυρόμενος
  choice: उसकी गंभीर गवाही देता रहा
  rationale: क्रिया में दृढ़ और गंभीर साक्ष्य देने का बल है, जिसे केवल ‘गवाही देना’ पूरी तरह व्यक्त नहीं करता।
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह पारदर्शी और प्रचलित समतुल्य है।
- source_word: πείθων τε αὐτοὺς
  choice: उन्हें विश्वास दिलाता रहा
  rationale: यह लगातार मनाने या आश्वस्त करने की क्रिया व्यक्त करता है, पर अनिवार्य रूप से यह नहीं कहता कि सभी श्रोता मान गए।
- source_word: περὶ τοῦ Ἰησοῦ
  choice: यीशु के विषय में
  rationale: औपचारिक किंतु सहज हिन्दी में विषय-संबंध स्पष्ट करता है।
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: मूसा की व्यवस्था और भविष्यद्वक्ताओं के लेखों के आधार पर
  rationale: ἀπό यहाँ तर्क के स्रोत या आधार को दिखाता है। ‘लेखों’ का जोड़ हिन्दी पाठक को स्पष्ट करता है कि भविष्यद्वक्ताओं से आशय उनके धर्मग्रंथीय लेखों से है।
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: सुबह से शाम तक
  rationale: समयावधि का सटीक और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: परमेश्वर के राज्य और यीशु के विषय में पौलुस की गवाही का संबंध
  choice: दोनों को एक ही निरंतर व्याख्या और समझाने के कार्य के जुड़े हुए पहलुओं के रूप में रखा गया है।
  alternative: इन्हें परस्पर असंबद्ध दो अलग विषय मानना।
  rationale: यूनानी वाक्य-विन्यास राज्य की गंभीर गवाही और यीशु के विषय में मनाने को एक ही दीर्घ शास्त्रीय प्रस्तुति में जोड़ता है; अनुवाद इससे आगे कोई व्यवस्थित धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: πείθων में सफलता या प्रयास का भाव
  choice: ‘विश्वास दिलाता रहा’ द्वारा मनाने की चलती हुई क्रिया व्यक्त की गई है, बिना यह घोषित किए कि सभी मान गए।
  alternative: ‘विश्वास दिलाने का प्रयत्न करता रहा,’ जो प्रयास को स्पष्ट करता है, अथवा ‘उन्हें कायल कर दिया,’ जो सफलता को निश्चित करता है।
  rationale: वर्तमान कृदंत मनाने की गतिविधि पर बल देता है; परिणाम को निश्चित करना पाठ की वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लंबे यूनानी वाक्य को स्पष्टता के लिए तीन हिन्दी वाक्यों में बाँटा गया है, जबकि उसकी तार्किक कड़ियाँ बनाए रखी गई हैं। सर्वनाम-संदर्भ में ‘उसके’ का आशय पौलुस है, जो निकटवर्ती प्रसंग से स्पष्ट है।
