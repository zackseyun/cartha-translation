  yaml_path: translation/nt/acts/028/009.yaml
  text: And after this happened[a], the rest of those on the island who had diseases also came and were healed.
translation:
  language: hi
  text: इसके बाद, द्वीप पर रहने वाले बाकी लोग, जो बीमारियों से ग्रस्त थे, भी आते रहे और चंगे किए जाते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: यह हो जाने के बाद
  rationale: संबंधवाचक स्वतंत्र पदबंध और δέ कथा में अगले घटनाक्रम की ओर बढ़ते हैं; यह हिंदी में स्वाभाविक रूप से कालक्रम व्यक्त करता है।
- source_word: οἱ λοιποὶ οἱ ἐν τῇ νήσῳ
  choice: द्वीप के बाकी लोग
  rationale: यह पहले वर्णित व्यक्ति के अतिरिक्त द्वीप पर रहने वाले शेष लोगों को संक्षेप और स्वाभाविक ढंग से दर्शाता है।
- source_word: ἔχοντες ἀσθενείας
  choice: जिन्हें बीमारियाँ थीं
  rationale: बहुवचन ἀσθενείας को बनाए रखते हुए वाक्यांश का सीधा और सहज हिंदी रूप दिया गया है।
- source_word: προσήρχοντο
  choice: आते रहे
  rationale: अपूर्ण भूतकाल अनेक लोगों के क्रमशः या बार-बार आने को संकेत कर सकता है; 'आते रहे' इस पक्ष को व्यक्त करता है और ऐसा कर्म नहीं जोड़ता जो यूनानी में स्पष्ट नहीं है।
- source_word: ἐθεραπεύοντο
  choice: चंगे किए जाते रहे
  rationale: अपूर्ण भूतकाल और कर्मवाच्य दोनों सुरक्षित हैं; यह बताता है कि लोगों के आते रहने के साथ उनका उपचार होता रहा।
- source_word: καὶ
  choice: भी
  rationale: यह पिछले चंगाई-वृत्तांत से निरंतरता जोड़ता है और दर्शाता है कि अन्य लोग भी इस घटना में सम्मिलित हुए।
theological_decisions:
- issue: चंगाई के कर्ता की पहचान
  choice: कर्मवाच्य 'चंगे किए जाते रहे' रखा गया
  alternative: '''पौलुस उन्हें चंगा करता रहा'''
  rationale: यूनानी क्रिया कर्मवाच्य है और इस पद में कर्ता स्पष्ट नहीं किया गया; पौलुस को कर्ता बनाना संदर्भ से संभव है, पर पाठ से अधिक स्पष्टता जोड़ देगा।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और कथात्मक है। 'चंगे किए जाते रहे' बाइबलीय संदर्भ में परिचित है और यूनानी के अपूर्ण कर्मवाच्य रूप को सुरक्षित रखता है।
