source:
  edition: SBLGNT
  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: hi
  text: जब द्वीप के निवासियों[a] ने उस प्राणी को उसके हाथ से लटकते हुए देखा, तो वे आपस में कहने लगे, “निश्चय ही यह आदमी हत्यारा है। यद्यपि यह समुद्र से सुरक्षित बच निकला, फिर भी न्याय[b] ने इसे जीवित नहीं रहने दिया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “बर्बर लोग”; यूनानियों का यह प्रचलित पद गैर-यूनानीभाषी स्थानीय निवासियों के लिए था, इसका अर्थ आवश्यक रूप से “असभ्य” नहीं था।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “न्याय” संभवतः दुष्कर्म का दंड देने वाली मानवीकृत शक्ति है; यह द्वीपवासियों की धार्मिक धारणा में किसी देवी की ओर भी संकेत कर सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: द्वीप के निवासी
  rationale: यह शब्द यहाँ माल्टा के गैर-यूनानीभाषी स्थानीय लोगों के लिए प्रचलित यूनानी पद है, न कि उनके असभ्य होने का नैतिक निर्णय। संदर्भ में ‘द्वीप के निवासी’ स्वाभाविक और भ्रामक अर्थों से मुक्त है।
- source_word: κρεμάμενον
  choice: लटकते
  rationale: यह कृदंत जीव के पौलुस के हाथ से लटके या चिपके होने का दृश्य प्रस्तुत करता है; ‘लटकते’ सीधे और अनिर्णायक रूप से इसे व्यक्त करता है।
- source_word: τὸ θηρίον
  choice: उस जीव
  rationale: मूल संज्ञा सामान्य अर्थ में जीव/पशु है। पिछले पद से साँप स्पष्ट है, फिर भी यहाँ ‘जीव’ यूनानी की सामान्य शब्दावली को बनाए रखता है।
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: वे आपस में कहने लगे
  rationale: ‘आपस में’ पारस्परिकता को स्पष्ट करता है और ‘कहने लगे’ अपूर्ण भूतकाल की चलती हुई बातचीत को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Πάντως
  choice: निश्चय ही
  rationale: यह बोलने वालों के दृढ़ निष्कर्ष को वर्तमान, स्वाभाविक हिन्दी में दर्शाता है।
- source_word: φονεύς
  choice: हत्यारा
  rationale: यह हत्या करने वाले व्यक्ति के लिए स्पष्ट और सामान्य आधुनिक हिन्दी शब्द है।
- source_word: διασωθέντα
  choice: सुरक्षित बच निकला
  rationale: यह समुद्री संकट से सकुशल निकल आने का अर्थ देता है। हिन्दी में कर्तृवाच्य रूप सन्दर्भानुकूल और स्वाभाविक है, यद्यपि यूनानी कृदंत रूपात्मक रूप से कर्मवाच्य है।
- source_word: ἡ δίκη
  choice: न्याय
  rationale: यहाँ न्याय को दुष्कर्म का प्रतिफल देने वाली मानवीकृत शक्ति के रूप में प्रस्तुत किया गया है। मुख्य पाठ में ‘न्याय’ उस तनाव को रखता है, जबकि पादटिप्पणी द्वीपवासियों की धार्मिक धारणा स्पष्ट करती है।
- source_word: ζῆν οὐκ εἴασεν
  choice: जीवित रहने नहीं दिया
  rationale: यह वाक्यांश किसी को आगे जीवित रहने की अनुमति न देने का सीधा और सहज हिन्दी रूप है।
- source_word: ἐκ τῆς θαλάσσης
  choice: समुद्र से
  rationale: ἐκ का स्थानिक अर्थ ‘से/में से’ है; ‘सुरक्षित बच निकला’ के साथ यह समुद्री संकट से बचने का अर्थ बिना अनावश्यक दोहराव के देता है।
theological_decisions:
- issue: ἡ δίκη का मानवीकरण
  choice: मुख्य पाठ में ‘न्याय’ और पादटिप्पणी में मानवीकृत दंडकारी शक्ति की व्याख्या
  alternative: ‘न्याय-देवी’ या ‘प्रतिशोध’
  rationale: यूनानी में δίκη संभवतः द्वीपवासियों की मूर्तिपूजक समझ में दंड देने वाले न्याय का मानवीकरण है। केवल ‘न्याय-देवी’ कहना विशिष्ट पौराणिक पहचान को आवश्यकता से अधिक निश्चित कर देगा, जबकि ‘प्रतिशोध’ न्याय के अर्थ को संकरा कर सकता है। यह कथन द्वीपवासियों का है, कथावाचक की स्वीकृति नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। वाक्यक्रम को स्वाभाविक हिन्दी के लिए पुनर्गठित किया गया है। ‘द्वीप के निवासी’ आधुनिक हिन्दी में βάρβαροι के भ्रामक ‘बर्बर’ अर्थ से बचाता है; मूल का शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
