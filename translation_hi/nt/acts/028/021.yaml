id: ACT.28.21
reference: Acts 28:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὸν εἶπαν· Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας, οὔτε παραγενόμενός τις τῶν ἀδελφῶν ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: hi
  text: पर उन्होंने उससे कहा, “न तो हमें यहूदिया से तुम्हारे विषय में कोई पत्र मिला है, और न ही आए हुए भाइयों[a] में से किसी ने तुम्हारे विषय में कोई बुरी बात बताई या कही है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयों’ से आशय यहूदिया के साथी यहूदियों से हो सकता है; मूल पाठ उन्हें स्पष्ट रूप से मसीही विश्वासी नहीं बताता।
    reason: alternative_reading
  - marker: b
    text: या, “तुम्हारे बारे में कुछ बुरा बताया या कहा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ πρὸς αὐτὸν εἶπαν
  choice: पर उन्होंने उससे कहा
  rationale: δέ को संवाद में हल्के प्रत्युत्तर अथवा विरोध के रूप में ‘पर’ से व्यक्त किया गया है; πρὸς αὐτόν का स्वाभाविक हिन्दी रूप ‘उससे’ है।
- source_word: Ἡμεῖς οὔτε ... οὔτε
  choice: न तो हमें ... और न ही
  rationale: स्पष्ट सर्वनाम Ἡμεῖς का भाव ‘हमें’ में बना रहता है और दोहरी नकारात्मक संरचना οὔτε ... οὔτε स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: γράμματα περὶ σοῦ
  choice: तुम्हारे विषय में कोई पत्र
  rationale: यहाँ γράμματα का अर्थ पत्र अथवा लिखित संदेश है; ‘पत्र’ सामान्य और प्रसंगानुकूल है।
- source_word: ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας
  choice: यहूदिया से ... मिला है
  rationale: δέχομαι यहाँ पत्र प्राप्त होने के अर्थ में है। वर्तमान परिणाम को स्वाभाविक हिन्दी पूर्णकाल से व्यक्त किया गया है।
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: आए हुए भाइयों में से किसी ने
  rationale: परिगामी कृदंत किसी के आ पहुँचने को दर्शाता है; ‘यहाँ’ जोड़े बिना ‘आए हुए’ उस अर्थ को बनाए रखता है। ἀδελφῶν का पुरुषवाची रूप ‘भाइयों’ रखा गया है।
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν τι ... πονηρόν
  choice: कोई बुरी बात बताई या कही
  rationale: ‘बताई’ और ‘कही’ से ἀπαγγέλλω तथा λαλέω के बीच का हल्का भेद बना रहता है; πονηρόν को प्रसंगानुसार ‘बुरी बात’ कहा गया है।
theological_decisions:
- issue: τῶν ἀδελφῶν में ‘भाइयों’ की पहचान
  choice: ‘भाइयों’ रखा गया है, उन्हें स्पष्ट रूप से मसीही विश्वासी नहीं कहा गया।
  alternative: ‘साथी यहूदी’ अथवा ‘मसीही भाई’
  rationale: रोम के यहूदी अगुओं के कथन में यह शब्द यहूदिया से आए साथी यहूदियों को सूचित कर सकता है, पर यूनानी पाठ उनकी पहचान स्पष्ट नहीं करता। इसलिए अनिश्चितता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, सम्मानपूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘तुम्हारे विषय में’ पत्राचार के संदर्भ में गरिमापूर्ण है, जबकि ‘कोई बुरी बात’ सामान्य पाठक के लिए स्पष्ट है।
