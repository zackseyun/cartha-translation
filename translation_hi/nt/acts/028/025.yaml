  text: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους ἀπελύοντο, εἰπόντος τοῦ Παύλου ῥῆμα ἓν ὅτι Καλῶς τὸ πνεῦμα τὸ ἅγιον ἐλάλησεν διὰ Ἠσαΐου τοῦ προφήτου πρὸς τοὺς πατέρας ⸀ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: hi
  text: 'पौलुस के एक अंतिम बात कही[a] के बाद, वे आपस में असहमत होकर जाने लगे: “पवित्र आत्मा ने यशायाह भविष्यद्वक्ता के द्वारा तुम्हारे पुरखों[b] से ठीक ही कहा था:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “एक बात” या “एक वचन”; यहाँ आशय विदा होते समय कही गई निष्कर्षात्मक बात से है।
    reason: lexical_alternative
  - marker: b
    text: या “तुम्हारे पूर्वजों।” यूनानी में शाब्दिक अर्थ “तुम्हारे पिताओं” है और संकेत इस्राएल के पुरखों की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους
  choice: आपस में असहमत होने के कारण
  rationale: यह उनके परस्पर मतभेद की अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है; कृदन्तीय रचना का परिस्थितिजन्य/कारणसूचक संबंध खुला किंतु सहज रूप में दिया गया है।
- source_word: ἀπελύοντο
  choice: वे जाने लगे
  rationale: अपूर्ण काल समूह के बिखरने और प्रस्थान आरम्भ करने की प्रक्रिया दिखाता है।
- source_word: εἰπόντος τοῦ Παύλου
  choice: तब पौलुस ने ... कही
  rationale: सम्बन्धकारक स्वतंत्र रचना को स्वाभाविक कालसूचक हिन्दी वाक्य में बदला गया है; εἰπόντος का अर्थ ‘कहा’ रखा गया है।
- source_word: ῥῆμα ἓν
  choice: एक अंतिम बात
  rationale: शाब्दिक अर्थ ‘एक बात/वचन’ है; प्रसंग में यह विदा होते समय कही गई निष्कर्षात्मक उक्ति है।
- source_word: Καλῶς
  choice: ठीक ही
  rationale: यह पवित्र आत्मा के कथन की सत्यता या उपयुक्तता की पुष्टि करता है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: निश्चित यूनानी पदबंध का मानक और व्यक्तिपरक हिन्दी रूप।
- source_word: ἐλάλησεν
  choice: कहा था
  rationale: भविष्यद्वक्ता के माध्यम से पूर्वकाल में दिए गए संदेश के लिए हिन्दी में ‘कहा था’ स्वाभाविक है।
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: यशायाह भविष्यद्वक्ता के द्वारा
  rationale: διά के साथ सम्बन्धकारक माध्यम अथवा प्रतिनिधि को सूचित करता है।
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: तुम्हारे पुरखों से
  rationale: πατέρες यहाँ इस्राएल के पूर्वजों को सूचित करता है; ‘पुरखे’ आधुनिक हिन्दी में अर्थ को स्पष्ट रखते हुए पुरुषवाचक मूल रूप की छाया बनाए रखता है।
theological_decisions:
- issue: पवित्र आत्मा की भविष्यद्वाणी में भूमिका
  choice: पवित्र आत्मा ने यशायाह भविष्यद्वक्ता के द्वारा ... कहा था
  alternative: यशायाह भविष्यद्वक्ता ने पवित्र आत्मा से प्रेरित होकर कहा था
  rationale: मूल पाठ वाणी का कर्ता सीधे पवित्र आत्मा को और यशायाह को माध्यम बताता है; अनुवाद उसी अभिकरण को सुरक्षित रखता है।
- issue: τοὺς πατέρας ὑμῶν का संदर्भ
  choice: तुम्हारे पुरखों
  alternative: तुम्हारे पूर्वजों
  rationale: ‘पुरखे’ इस्राएल के पितृ-पूर्वजों का संदर्भ और मूल के पुरुषवाचक शब्द, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। पद अगले पद में जारी प्रत्यक्ष कथन का आरम्भ करता है, इसलिए अंत में द्विबिंदु रखा गया है।
