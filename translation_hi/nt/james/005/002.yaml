  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλοῦτος
  choice: धन
  rationale: यह संचित भौतिक संपत्ति के लिए स्वाभाविक और व्यापक आधुनिक हिन्दी शब्द है तथा प्रसंग में धनी लोगों की निन्दा के अनुकूल है।
- source_word: σέσηπεν
  choice: सड़ चुका है
  rationale: पूर्णकाल से उत्पन्न वर्तमान दशा और सड़ने की सजीव छवि—दोनों व्यक्त होती हैं।
- source_word: ἱμάτια
  choice: कपड़े
  rationale: यह सामान्य रूप से पहनने की वस्तुओं के लिए सहज, वर्तमान और व्यापक हिन्दी अभिव्यक्ति है।
- source_word: σητόβρωτα
  choice: कीड़ों से खाए
  rationale: मूल विशेषण वस्त्र खाने वाले पतंगों द्वारा खाए जाने का चित्र देता है। सामान्य हिन्दी में 'कीड़ों से खाए' अधिक स्वाभाविक और तुरंत समझ में आने वाला है।
- source_word: γέγονεν
  choice: जा चुके हैं
  rationale: यह उस प्रक्रिया के पूर्ण होने और उसके फलस्वरूप बनी वर्तमान दशा को व्यक्त करता है।
