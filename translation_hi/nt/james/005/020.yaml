id: JAS.5.20
reference: James 5:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν ⸀αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: hi
  text: तो वह जान ले कि जो किसी पापी को उसके भटके हुए मार्ग से वापस फेरता है, वह उसके प्राण को मृत्यु से बचाएगा[a][b] और बहुत-से पापों को ढक देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके जीवन को मृत्यु से बचाएगा।” यूनानी शब्द का अर्थ “प्राण” या “जीवन” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उसके” का संकेत वापस फेरे गए पापी की ओर हो सकता है; कुछ लोग इसे उसे वापस फेरने वाले व्यक्ति की ओर संकेत मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: तो वह जान ले
  rationale: तीसरे पुरुष का आज्ञार्थक रूप है। ‘वह जान ले’ इसके उपदेशात्मक बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है; ‘तो’ पिछले वाक्य से संबंध स्पष्ट करता है।
- source_word: ὁ ἐπιστρέψας
  choice: जो ... वापस फेरता है
  rationale: संज्ञा की तरह प्रयुक्त कृदन्त का सामान्य अर्थ व्यक्त करता है। ‘वापस’ प्रसंग में भटके व्यक्ति की पुनर्स्थापना दिखाता है, बिना इसे किसी तकनीकी धार्मिक शब्द तक सीमित किए।
- source_word: ἁμαρτωλὸν
  choice: किसी पापी को
  rationale: अनिश्चित और सामान्य श्रेणी-सूचक प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: उसके भटके हुए मार्ग से
  rationale: πλάνη में भूल और भटकाव दोनों के भाव हैं, जबकि ὁδός जीवन-आचरण का रूपक है। यह अभिव्यक्ति दिशात्मक चित्र और नैतिक आशय दोनों बनाए रखती है।
- source_word: σώσει
  choice: बचाएगा
  rationale: भविष्यकालीन σῴζω का सीधा और स्वाभाविक हिन्दी रूप है; उद्धार या रक्षा—दोनों संभावित आयामों को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: ψυχὴν αὐτοῦ
  choice: उसके प्राण को
  rationale: ψυχή का अर्थ ‘प्राण/जीवन’ या ‘आत्मा’ हो सकता है। ‘प्राण’ मृत्यु से बचाने के वाक्य में स्वाभाविक है और व्यक्ति के जीवनगत तथा आध्यात्मिक दोनों आयामों के लिए खुला रहता है। αὐτοῦ के संदर्भ की अस्पष्टता मुख्य पाठ में ‘उसके’ से सुरक्षित है।
- source_word: ἐκ θανάτου
  choice: मृत्यु से
  rationale: मूल के व्यापक शब्द को सीधे रखता है और शारीरिक या आध्यात्मिक मृत्यु में से किसी एक अर्थ को आरोपित नहीं करता।
- source_word: καλύψει
  choice: ढक देगा
  rationale: बाइबलीय रूपक को सुरक्षित रखता है; ‘छिपा देगा’ कहने से संभावित रूप से मिलने वाला गलत आशय टलता है।
- source_word: πλῆθος ἁμαρτιῶν
  choice: बहुत-से पापों को
  rationale: साधारण आधुनिक हिन्दी में πλῆθος का परिमाण स्पष्ट करता है। ‘पापों की बहुतायत’ की अपेक्षा अधिक स्वाभाविक और सुबोध है।
theological_decisions:
- issue: ψυχὴν αὐτοῦ में αὐτοῦ का पूर्वपद
  choice: मुख्य पाठ में ‘उसके’ रखकर पूर्वपद अनिर्धारित रखा गया है
  alternative: इसे लौटाए गए पापी के प्राण अथवा उसे वापस फेरने वाले के प्राण के रूप में स्पष्ट करना
  rationale: यूनानी सर्वनाम व्याकरणतः दोनों से जोड़ा जा सकता है, यद्यपि प्रसंग में पापी अधिक संभावित है। अनुवाद मूल की अस्पष्टता को मुख्य पाठ में बनाए रखता और टिप्पणी में दोनों विकल्प बताता है।
- issue: ψυχή और θάνατος का आशय
  choice: ‘प्राण’ और ‘मृत्यु’ जैसे व्यापक शब्द रखे गए हैं
  alternative: ‘जीवन ... मृत्यु से’ अथवा ‘आत्मा ... आत्मिक मृत्यु से’
  rationale: वचन शारीरिक जीवन की रक्षा, आत्मिक उद्धार, या दोनों की ओर संकेत कर सकता है। किसी एक धर्मवैज्ञानिक योजना तक अर्थ सीमित नहीं किया गया।
- issue: ‘बहुत-से पापों को ढक देगा’ का कर्ता और आशय
  choice: मूल वाक्य की संरचना और रूपक को बिना व्याख्यात्मक विस्तार के रखा गया है
  alternative: पापों को क्षमा कराने, छिपाने, या उनके प्रभाव को रोकने के रूप में स्पष्ट करना
  rationale: καλύψει का बाइबलीय रूपक क्षमा या पाप के हटाए जाने से जुड़ सकता है, पर इस पद में उसकी प्रक्रिया स्पष्ट नहीं की गई; इसलिए अनुवाद उसे नहीं भरता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भटके हुए मार्ग’, ‘प्राण’, ‘मृत्यु’ और ‘पापों को ढक देना’ मूल के रूपकों तथा धर्मवैज्ञानिक विस्तार को सुरक्षित रखते हैं।
