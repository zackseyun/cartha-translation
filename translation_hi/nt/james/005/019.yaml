lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: मेरे भाइयो
  rationale: प्रत्यक्ष संबोधन और यूनानी के पुल्लिंग बहुवचन को बनाए रखता है; संदर्भ में यह पूरी विश्वासी संगति को समावेशी रूप से संबोधित कर सकता है।
- source_word: ἐάν τις ἐν ὑμῖν
  choice: यदि तुम में से कोई
  rationale: शर्त और अनिश्चित एकवचन का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: πλανηθῇ ἀπὸ τῆς ἀληθείας
  choice: सत्य से भटक जाए
  rationale: πλανάω का यह रूप भटकने अथवा भटकाए जाने—दोनों की छाया रख सकता है। हिन्दी में ‘भटक जाए’ स्वाभाविक है और कर्ता की बाहरी एजेंसी को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: और कोई उसे वापस लौटा लाए
  rationale: ἐπιστρέφω के वापस मोड़ने/लाने के भाव को व्यक्त करता है और αὐτόν के एकवचन संदर्भ को ‘उसे’ में सुरक्षित रखता है।
theological_decisions:
- issue: समुदाय के संबोधन में लिंग
  choice: मुख्य पाठ में ‘मेरे भाइयो’
  alternative: ‘मेरे भाइयो और बहनो’
  rationale: यूनानी में संबोधन व्याकरणतः पुल्लिंग बहुवचन है, यद्यपि उसका आशय पूरी संगति को समेट सकता है; इस समावेशी संभावना को पादटिप्पणी में बताया गया है।
- issue: πλανηθῇ की वाच्यगत और अर्थगत अस्पष्टता
  choice: ‘भटक जाए’
  alternative: ‘भटका दिया जाए’ या ‘धोखे में पड़ जाए’
  rationale: संदर्भ सत्य से विचलन का है। हिन्दी का स्वाभाविक मध्यभाव कारण या एजेंसी को निश्चित किए बिना मूल की अर्थगत गुंजाइश बनाए रखता है।
- issue: ἐπιστρέψῃ का पुनर्स्थापनात्मक भाव
  choice: ‘वापस लौटा लाए’
  alternative: ‘वापस मोड़ दे’
  rationale: व्यक्ति को सत्य की ओर पुनः लाने का भाव स्पष्ट होता है, पर यह नहीं जोड़ा जाता कि लौटाने वाला अंतिम उद्धार का कारण है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘तुम’ सामुदायिक संबोधन के अनुरूप है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
