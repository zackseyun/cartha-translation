  yaml_path: translation/nt/james/005/019.yaml
  text: My brothers[a], if anyone among you wanders from the truth and someone turns him back[c][b],
translation:
  language: hi
  text: मेरे भाइयो[a], यदि तुम में से कोई सत्य से भटक जाए[b] और कोई उसे वापस लौटा लाए[c],
