base_translation:
  language: en
  yaml_path: translation/nt/james/005/008.yaml
  text: You also be patient; strengthen your hearts[a], because the coming of the Lord has drawn near.
translation:
  language: hi
  text: तुम भी धीरज रखो और अपने हृदयों को दृढ़ करो, क्योंकि प्रभु का आगमन[a] निकट आ गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रभु की उपस्थिति।’ यूनानी शब्द का अर्थ ‘उपस्थिति’ या ‘आगमन’ हो सकता है; इस संदर्भ में यह अंत समय में प्रभु के आगमन को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμήσατε
  choice: धीरज रखो
  rationale: बहुवचन आज्ञार्थक क्रिया कठिनाई में लंबे समय तक धैर्य बनाए रखने का भाव देती है। आधुनिक हिन्दी में ‘धीरज रखो’ स्वाभाविक है और निकटवर्ती किसान के उदाहरण से मेल खाता है।
- source_word: καὶ ὑμεῖς
  choice: तुम भी
  rationale: यह पिछले पद के उदाहरण से पाठकों को जोड़ता है और बलयुक्त सर्वनाम का भाव सहज हिन्दी में बनाए रखता है।
- source_word: στηρίξατε
  choice: दृढ़ करो
  rationale: यह बहुवचन आज्ञार्थक क्रिया स्थिर या मजबूत करने का अर्थ देती है। ‘अपने हृदयों को दृढ़ करो’ आंतरिक संकल्प और साहस को व्यक्त करते हुए मूल रूपक को बनाए रखता है।
- source_word: τὰς καρδίας ὑμῶν
  choice: अपने हृदयों को
  rationale: मूल के ‘हृदय’ रूपक को रखा गया है; यहाँ वह मनुष्य के भीतरी संकल्प, साहस और इच्छा को समेटता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह दोनों आज्ञाओं का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट कारणसूचक संयोजक है।
- source_word: ἡ παρουσία
  choice: आगमन
  rationale: παρουσία का अर्थ ‘उपस्थिति’ या ‘आगमन’ हो सकता है। याकूब 5:7–8 के भविष्याभिमुख संदर्भ में ‘आगमन’ प्रसंगानुकूल है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τοῦ κυρίου
  choice: प्रभु का
  rationale: κύριος के लिए ‘प्रभु’ प्रतिष्ठित, गरिमापूर्ण और इस मसीही अंत-कालीन संदर्भ में उपयुक्त हिन्दी पद है।
- source_word: ἤγγικεν
  choice: निकट आ गया है
  rationale: पूर्णकालिक रूप ऐसी निकटता व्यक्त करता है जो घटित होकर वर्तमान स्थिति बनी हुई है। ‘निकट आ गया है’ इस पक्ष को केवल ‘निकट है’ की अपेक्षा अधिक स्पष्टता से रखता है।
theological_decisions:
- issue: प्रभु के संबंध में παρουσία का अंत-कालीन अर्थ
  choice: प्रभु का आगमन
  alternative: प्रभु की उपस्थिति
  rationale: शब्द का शाब्दिक दायरा ‘उपस्थिति’ और ‘आगमन’ दोनों को समेटता है, पर याकूब 5:7–8 में प्रतीक्षा और निकटता का संदर्भ प्रभु के भावी आगमन की ओर संकेत करता है। फिर भी वास्तविक शब्दार्थगत अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामूहिक संबोधन रखा गया है। ‘हृदयों’ का बाइबलीय रूपक बनाए रखा गया है; ‘दृढ़ करो’ स्वाभाविक हिन्दी में आंतरिक स्थिरता और साहस व्यक्त करता है।
