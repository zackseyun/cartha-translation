  yaml_path: translation/nt/james/005/006.yaml
  text: You condemned[a], you murdered the righteous one[b]. He does not resist you.
translation:
  language: hi
  text: तुमने धर्मी जन[a] को दोषी ठहराया और उसकी हत्या कर दी। वह तुम्हारा विरोध नहीं करता।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धर्मी जन’ को यहाँ अत्याचार सहने वाला कोई प्रतिनिधि धर्मी व्यक्ति समझा जा सकता है। कुछ व्याख्याकार इसमें यीशु के लिए प्रयुक्त उपाधि ‘धर्मी जन’ की सम्भावित प्रतिध्वनि देखते हैं।
    reason: alternative_reading
  - marker: b
    text: 'यूनानी पाठ को प्रश्न के रूप में भी पढ़ा जा सकता है: “क्या वह तुम्हारा विरोध नहीं करता?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδικάσατε
  choice: तुमने … दोषी ठहराया
  rationale: यह न्यायिक अर्थ को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है। यूनानी क्रिया एओरिस्ट, कर्तृवाच्य और बहुवचन है; इसलिए सामान्य भूतकाल रखा गया है।
- source_word: ἐφονεύσατε
  choice: उसकी हत्या कर दी
  rationale: φονεύω केवल सामान्य रूप से मारने के बजाय अन्यायपूर्ण ढंग से प्राण लेने का प्रबल नैतिक आरोप व्यक्त करता है; ‘हत्या’ उसी बल को बनाए रखता है।
- source_word: τὸν δίκαιον
  choice: धर्मी जन
  rationale: निश्चित पद के साथ प्रयुक्त पुल्लिंग एकवचन विशेषण यहाँ संज्ञा का काम करता है। ‘धर्मी जन’ स्वाभाविक हिन्दी है और इसे न तो अनावश्यक रूप से केवल ‘निर्दोष’ बनाता है, न स्पष्ट रूप से यीशु की उपाधि घोषित करता है।
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: वह तुम्हारा विरोध नहीं करता
  rationale: ἀντιτάσσομαι का अर्थ अपने को किसी के विरुद्ध खड़ा करना, विरोध करना या प्रतिरोध करना है। कथनात्मक रूप प्रसंग में असहाय धर्मी व्यक्ति पर किए गए अत्याचार का आशय स्पष्ट रखता है; यूनानी पाठ में प्रश्न के रूप में विराम-चिह्नित विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘धर्मी जन’ का संकेत किसकी ओर है
  choice: मुख्य पाठ में धनी अत्याचारियों द्वारा सताए गए प्रतिनिधि धर्मी व्यक्ति के रूप में खुला रखा गया है।
  alternative: इसे यीशु के लिए प्रयुक्त ‘धर्मी जन’ की उपाधि का परोक्ष संकेत माना जा सकता है।
  rationale: निकटवर्ती प्रसंग सामान्य रूप से धनी उत्पीड़कों को संबोधित करता है, और एकवचन प्रतिनिधिक हो सकता है। फिर भी सम्भावित मसीह-संबंधी प्रतिध्वनि को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: अंतिम उपवाक्य का कथन या प्रश्न होना
  choice: 'मुख्य पाठ में कथन: ‘वह तुम्हारा विरोध नहीं करता।’'
  alternative: 'प्रश्न: ‘क्या वह तुम्हारा विरोध नहीं करता?’'
  rationale: SBLGNT इसे प्रश्न के रूप में विराम-चिह्नित करता है, पर प्राचीन मूल पांडुलिपियों के विराम-चिह्न निर्णायक नहीं हैं और प्रसंग में इसे असहाय धर्मी व्यक्ति के प्रतिरोध न करने के कथन के रूप में भी समझा जाता है। मुख्य पाठ में सहज आशय रखा गया है और प्रश्नात्मक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गंभीर और आरोपात्मक शैली रखी गई है। ‘धर्मी जन’ सामान्य पाठक के लिए समझने योग्य है और मूल के पुल्लिंग एकवचन तथा सम्भावित प्रतिनिधिक अर्थ दोनों को सुरक्षित रखता है।
