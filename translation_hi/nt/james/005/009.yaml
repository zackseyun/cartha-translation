  text: μὴ στενάζετε, ⸂ἀδελφοί, κατ’ ἀλλήλων⸃, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: hi
  text: हे भाइयो,[a] एक-दूसरे के विरुद्ध शिकायत मत करो, ताकि तुम पर न्याय न किया जाए। देखो, न्यायाधीश द्वारों पर खड़ा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयो’ यूनानी ἀδελφοί का अनुवाद है। संदर्भ के अनुसार यह संबोधन पूरे विश्वासी समुदाय के लिए हो सकता है, जिसमें स्त्रियाँ भी शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: στενάζετε
  choice: कुड़कुड़ाओ
  rationale: यह क्रिया मूलतः कराहने या आह भरने का भाव रख सकती है, पर κατ’ ἀλλήλων के साथ यहाँ साथी विश्वासियों के प्रति असंतोष भरी शिकायत का अर्थ प्रमुख है। ‘कुड़कुड़ाना’ इस पारस्परिक और नैतिक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: सम्बोधन का यूनानी रूप व्याकरणतः पुल्लिंग बहुवचन है, पर सन्दर्भ में यह पूरी विश्वासी संगति—स्त्रियों सहित—को सम्बोधित कर सकता है। स्रोत-रूप को मुख्य पाठ में रखते हुए समावेशी प्रयोग को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: κατ’ ἀλλήλων
  choice: एक-दूसरे पर
  rationale: κατά सम्बन्धित व्यक्तियों की ओर लक्षित विरोध या शिकायत दर्शाता है। ‘एक-दूसरे पर कुड़कुड़ाना’ स्वाभाविक आधुनिक हिन्दी में इसी पारस्परिक वैमनस्य को व्यक्त करता है।
- source_word: κριθῆτε
  choice: तुम पर न्याय न किया जाए
  rationale: κρίνω का कर्मवाच्य रूप न्याय किए जाने को बताता है, पर परिणाम को अनिवार्यतः दोषसिद्धि नहीं ठहराता। इसलिए ‘दोषी न ठहराए जाओ’ की अपेक्षा यह अनुवाद मूल की व्यापकता बनाए रखता है।
- source_word: κριτὴς
  choice: न्यायाधीश
  rationale: यह शब्द न्याय करने वाले व्यक्ति को स्पष्ट और प्रतिष्ठित आधुनिक हिन्दी में व्यक्त करता है। मूल पाठ की तरह उसका निश्चित नाम या परिचय नहीं जोड़ा गया है।
- source_word: πρὸ τῶν θυρῶν
  choice: द्वारों पर
  rationale: मूल यूनानी में ‘द्वार’ बहुवचन है। यह मुहावरा न्यायाधीश की अत्यन्त निकट और आसन्न उपस्थिति दर्शाता है; बहुवचन को जानबूझकर सुरक्षित रखा गया है।
- source_word: ἕστηκεν
  choice: खड़ा है
  rationale: यूनानी पूर्णकाल किसी पूर्व क्रिया से बनी वर्तमान स्थिति को उभारता है। ‘खड़ा है’ तत्पर और वर्तमान उपस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘न्यायाधीश’ का अभिप्रेत व्यक्ति
  choice: अन्तकालीन दिव्य न्यायाधीश, जो सन्दर्भ में सबसे स्वाभाविक रूप से प्रभु की ओर संकेत करता है
  alternative: सामान्य रूप से परमेश्वर न्यायाधीश के रूप में
  rationale: याकूब के निकटवर्ती सन्दर्भ में प्रभु के आगमन और आसन्न न्याय की भाषा है। फिर भी यूनानी केवल ‘न्यायाधीश’ कहता है, इसलिए अनुवाद उसका नाम जोड़कर इस तनाव को समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कुड़कुड़ाओ’ सामान्य पाठक के लिए समझने योग्य है और भीतर ही भीतर असन्तोष रखने तथा उसे दूसरों के विरुद्ध व्यक्त करने—दोनों का भाव देता है। ‘द्वारों’ का अपेक्षाकृत असामान्य बहुवचन स्रोत की वास्तविक संख्या और आसन्नता की छवि को सुरक्षित रखता है।
