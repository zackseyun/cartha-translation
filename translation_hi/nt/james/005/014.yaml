source:
  edition: SBLGNT
  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ’ αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: hi
  text: क्या तुम में कोई बीमार है?[a] वह कलीसिया के प्राचीनों को अपने पास बुलाए, और वे प्रभु के नाम से उस पर तेल लगाते हुए उसके लिए प्रार्थना करें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम में कोई निर्बल है?” यूनानी क्रिया सामान्य रूप से कमजोरी या निर्बलता भी बता सकती है, पर यहाँ प्रार्थना, तेल लगाने और अगले पद में चंगा किए जाने के संदर्भ के कारण बीमारी का अर्थ अधिक सम्भावित है।
    reason: lexical_alternative
  - marker: b
    text: तेल लगाना औषधीय, प्रतीकात्मक या दोनों हो सकता है; पाठ स्वयं यह नहीं बताता कि इसका प्रभाव किस प्रकार समझा जाए।
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: बीमार है
  rationale: संदर्भ में प्रार्थना, तेल लगाना और अगले पद में चंगा किए जाने की बात शारीरिक बीमारी को प्राथमिक अर्थ बनाती है; व्यापक अर्थ ‘निर्बल है’ को पादटिप्पणी में रखा गया है।
- source_word: τις
  choice: कोई
  rationale: यह अनिश्चित सर्वनाम समुदाय के किसी भी व्यक्ति को सूचित करता है और हिन्दी में स्वाभाविक रूप से समावेशी है।
- source_word: ἐν ὑμῖν
  choice: तुम में
  rationale: सम्बोधित समुदाय के भीतर होने का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: προσκαλεσάσθω
  choice: अपने पास बुलाए
  rationale: मध्यवाच्य आज्ञार्थक रूप में अपने पास बुलवाने या उपस्थिति का अनुरोध करने का भाव है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τοὺς πρεσβυτέρους τῆς ἐκκλησίας
  choice: कलीसिया के प्राचीनों
  rationale: यहाँ πρεσβύτεροι केवल अधिक आयु के पुरुष नहीं, बल्कि मसीही समुदाय के मान्य अगुवे हैं; ‘प्राचीन’ प्रचलित और पारदर्शी पद है।
- source_word: προσευξάσθωσαν ἐπ’ αὐτόν
  choice: वे ... उसके लिए प्रार्थना करें
  rationale: ἐπί बीमार व्यक्ति की ओर केन्द्रित और उसके निकट की जाने वाली प्रार्थना दर्शाता है। शब्दशः ‘उसके ऊपर’ आधुनिक हिन्दी में अस्वाभाविक या भ्रामक हो सकता है, इसलिए आशय को स्वाभाविक रूप में दिया गया है।
- source_word: ἀλείψαντες αὐτὸν ἐλαίῳ
  choice: उस पर तेल लगाकर
  rationale: क्रिया शरीर पर तेल लगाने को बताती है। ‘तेल लगाकर’ औषधीय, प्रतीकात्मक या संस्कारात्मक अर्थ में से किसी एक को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: प्रभु के नाम से
  rationale: यह प्रभु के व्यक्ति और अधिकार के सम्बन्ध में कार्य करने की बाइबलीय धारणा बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος के धार्मिक पदनाम को मानक हिन्दी ‘प्रभु’ से व्यक्त किया गया है; पाठ यह पदनाम देता है, पहचान को अनावश्यक रूप से विस्तृत नहीं किया गया।
theological_decisions:
- issue: ἀσθενεῖ का संदर्भगत अर्थ
  choice: मुख्य पाठ में शारीरिक बीमारी
  alternative: सामान्य निर्बलता या आत्मिक कमजोरी
  rationale: प्राचीनों को बुलाना, प्रार्थना, तेल लगाना और अगले पद में उठाए जाने का उल्लेख शारीरिक बीमारी के अर्थ का समर्थन करते हैं, पर व्यापक शब्दार्थ पादटिप्पणी में सुरक्षित है।
- issue: तेल लगाने का प्रयोजन
  choice: प्रयोजन को अनिर्धारित रखते हुए तटस्थ वर्णन
  alternative: केवल औषधीय उपचार, केवल प्रतीकात्मक कार्य, या एक विशिष्ट संस्कार
  rationale: यूनानी पाठ कार्य का उल्लेख करता है, पर उसकी क्रियाविधि या धर्मवैज्ञानिक दर्जा स्पष्ट नहीं करता; इसलिए अनुवाद किसी साम्प्रदायिक निष्कर्ष को नहीं जोड़ता।
- issue: ἐν τῷ ὀνόματι τοῦ κυρίου का सम्बन्ध
  choice: तेल लगाने के साथ निकट सम्बन्ध रखते हुए पूरे कार्य पर प्रभु के अधिकार का भाव खुला रखना
  alternative: इसे केवल प्रार्थना या केवल अभिषेक तक सीमित करना
  rationale: यूनानी पदबंध कृदन्त के निकट है, पर अर्थ की दृष्टि से प्रार्थना और तेल लगाने से बने संयुक्त कार्य को भी रंग सकता है; हिन्दी क्रम निकट सम्बन्ध बनाए रखता है, बिना दायरा कठोरता से सीमित किए।
- issue: अनिश्चित व्यक्ति का लिंग
  choice: लिंग-निरपेक्ष ‘कोई’ और स्वाभाविक सर्वनाम-लोप
  alternative: ‘कोई पुरुष’ या बार-बार पुल्लिंग सर्वनाम
  rationale: τις अनिश्चित और सामान्य है। हिन्दी क्रिया-रूप यहाँ अनावश्यक लिंग-निर्धारण के बिना मूल का सामान्य आशय व्यक्त कर सकते हैं।
