  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामुदायिक और सहज शैली रखी गई है। ‘कलीसिया’ और ‘प्राचीन’ परिचित बाइबलीय पद हैं। ‘तेल लगाकर’ को ‘अभिषेक करके’ पर प्राथमिकता दी गई है ताकि मूल क्रिया का ठोस अर्थ रहे और कोई विशिष्ट संस्कारवादी व्याख्या आरोपित न हो।
