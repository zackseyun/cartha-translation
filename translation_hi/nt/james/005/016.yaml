id: JAS.5.16
reference: James 5:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: hi
  text: इसलिए अपने पाप एक-दूसरे के सामने स्वीकार करो और एक-दूसरे के लिए प्रार्थना करो, ताकि तुम चंगे हो जाओ। धर्मी व्यक्ति की प्रार्थना, जब वह कार्यरत होती है, बहुत सामर्थ्य रखती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मी व्यक्ति की विनती बहुत प्रभाव रखती है, जब वह कार्यरत होती है।”
    reason: δέησις के ‘विनती/याचना’ संबंधी अधिक विशिष्ट अर्थ तथा ἐνεργουμένη के ‘कार्यरत’ होने की खुली अर्थ-छाया को दर्शाता है।
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: सामने ... मान लो
  rationale: यह परस्पर खुलकर पाप स्वीकार करने की आज्ञा व्यक्त करता है; इससे किसी औपचारिक संस्कार या पादरी के सामने ही अंगीकार करने का अर्थ नहीं जोड़ा जाता।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग में प्रार्थना, पाप और बहाली से निकलने वाला निष्कर्ष दर्शाता है।
- source_word: ἀλλήλοις
  choice: एक-दूसरे के सामने
  rationale: दत्तिव कारक की पारस्परिकता को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: τὰς ἁμαρτίας
  choice: अपने पाप
  rationale: पारस्परिक आज्ञा के संदर्भ में 'अपने' निहित संबंध को स्पष्ट करता है, जबकि 'पाप' मूल शब्द का सीधा और प्रचलित अनुवाद है।
- source_word: εὔχεσθε
  choice: प्रार्थना करो
  rationale: आज्ञार्थक रूप का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: ὑπὲρ ἀλλήλων
  choice: एक-दूसरे के लिए
  rationale: ὑπέρ के पक्ष में अथवा हेतु किए जाने वाले मध्यस्थ प्रार्थना के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ὅπως
  choice: ताकि
  rationale: उद्देश्य अथवा परिणाम की शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἰαθῆτε
  choice: तुम चंगे हो जाओ
  rationale: शारीरिक और आत्मिक—दोनों संभावित आयामों को बिना संकुचित किए चंगाई का व्यापक अर्थ सुरक्षित रखता है।
- source_word: πολὺ ἰσχύει
  choice: बहुत सामर्थ्य होती है
  rationale: मुहावरे की प्रबल शक्ति और प्रभावशीलता व्यक्त करता है, पर किसी निश्चित परिणाम को अनावश्यक रूप से नहीं जोड़ता।
- source_word: δέησις
  choice: प्रार्थना
  rationale: याचना या विनती के अर्थ वाला व्यापक और सामान्य पाठक के लिए सहज धार्मिक शब्द।
- source_word: δικαίου
  choice: धर्मी जन की
  rationale: विशेषण के संज्ञात्मक और सामान्य मानवीय प्रयोग को लिंग-विशेष तक सीमित किए बिना व्यक्त करता है।
- source_word: ἐνεργουμένη
  choice: जब प्रभावी होती है
  rationale: कठिन मध्य/कर्मवाच्य कृदंत के क्रियाशील अथवा प्रभावकारी होने के भाव को सुरक्षित रखता है; वैकल्पिक संरचना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: क्या यह पद पुरोहित के सामने संस्कारगत पाप-स्वीकार की आज्ञा देता है या विश्वासियों के बीच पारस्परिक स्वीकार की
  choice: एक-दूसरे के सामने पारस्परिक रूप से पाप मानना
  alternative: अभिषिक्त पुरोहित के माध्यम से पाप-स्वीकार
  rationale: ἀλλήλοις स्पष्टतः पारस्परिकता बताता है। अनुवाद समुदाय के सदस्यों के बीच स्वीकार को सामने रखता है, पर बाद की कलीसियाई प्रथाओं पर अलग से निर्णय नहीं देता।
- issue: ἰαθῆτε में चंगाई का दायरा
  choice: व्यापक अर्थ में चंगे होना
  alternative: केवल शारीरिक चंगाई अथवा केवल आत्मिक चंगाई
  rationale: निकट प्रसंग में बीमारी प्रमुख है, लेकिन पापों का उल्लेख अर्थ-क्षेत्र को व्यापक बनाता है। इसलिए किसी एक आयाम तक सीमित नहीं किया गया।
- issue: δικαίου का लिंग-संबंधी निरूपण
  choice: धर्मी जन
  alternative: धर्मी पुरुष
  rationale: यूनानी पुल्लिंग एकवचन यहाँ कहावत-सदृश सामान्य प्रयोग है; 'जन' स्रोत के सामान्य मानवीय आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- issue: ἐνεργουμένη की वाच्यगत और अर्थगत अस्पष्टता
  choice: जब प्रभावी होती है
  alternative: क्रियाशील प्रार्थना; सामर्थ्यपूर्वक कार्य करने वाली प्रार्थना; प्रेरित की गई प्रार्थना
  rationale: कृदंत को केवल आत्मवाचक या केवल कर्मवाच्य मानकर धर्मवैचारिक निष्कर्ष नहीं निकाला गया। मुख्य पाठ प्रभावशीलता बताता है और पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठक के लिए सहज किंतु गरिमापूर्ण। 'चंगे' बाइबलीय हिन्दी में परिचित है और मूल की व्यापक चंगाई को बनाए रखता है। 'धर्मी जन' समावेशी और स्वाभाविक है। पादटिप्पणी चिह्न [a] मुख्य पाठ में उसी कथन के अंत में दिया गया है जिससे वह संबंधित है।
