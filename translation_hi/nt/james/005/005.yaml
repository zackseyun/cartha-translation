id: JAS.5.5
reference: James 5:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: hi
  text: तुम धरती पर विलासिता में जिए हो[a] और सुख-भोग में लिप्त रहे हो[b]; तुमने वध के दिन अपने हृदयों को मोटा कर लिया है[c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ऐशो-आराम में जिए हो।’
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने ही सुख में डूबे रहे हो।’
    reason: lexical_alternative
  - marker: c
    text: यह चित्र वध से पहले मोटे किए जाने वाले पशुओं का है और संभवतः आने वाले न्याय की ओर संकेत करता है।
    reason: cultural_note
  - marker: d
    text: या ‘वध के दिन के लिए।’
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: विलासिता में जिए हो
  rationale: यह क्रिया ऐशो-आराम और सुख की खोज में बिताए गए जीवन को दर्शाती है। यह चयन आधुनिक और स्वाभाविक हिन्दी में उसके नैतिक आरोप को बनाए रखता है।
- source_word: ἐπὶ τῆς γῆς
  choice: धरती पर
  rationale: γῆ का अर्थ ‘धरती’ या ‘भूमि’ हो सकता है। यहाँ व्यापक सांसारिक परिप्रेक्ष्य में ‘धरती पर’ अधिक उपयुक्त और स्वाभाविक है।
- source_word: ἐσπαταλήσατε
  choice: सुख-भोग में लिप्त रहे हो
  rationale: यह क्रिया पहली क्रिया से अधिक तीव्र होकर असंयमित आत्म-भोग का भाव व्यक्त करती है। ‘लिप्त रहे हो’ निंदा के स्वर को स्पष्ट रखता है, पर अनावश्यक रूप से पुरातन नहीं है।
- source_word: ἐθρέψατε
  choice: मोटा कर लिया है
  rationale: मूल क्रिया सामान्यतः पालने-पोसने या खिलाने को कह सकती है, किंतु वध के प्रसंग में यहाँ पशुओं को वध से पहले मोटा किए जाने की विडंबनापूर्ण छवि है।
- source_word: τὰς καρδίας ὑμῶν
  choice: अपने हृदयों को
  rationale: शाब्दिक रूपक को बनाए रखने से मूल की बाइबिलीय मानव-दृष्टि और तीखी अलंकारिक शक्ति सुरक्षित रहती है।
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: वध के दिन
  rationale: ἐν का निकट अर्थ ‘में/के दिन’ है। हिन्दी में ‘वध के दिन’ स्वाभाविक है और यह स्पष्ट किए बिना भयावह छवि को बनाए रखता है कि वध किसका या किस प्रकार का न्याय है।
theological_decisions:
- issue: ‘वध के दिन’ की रूपकात्मक शक्ति
  choice: मुख्य पाठ में वध और आसन्न न्याय की छवि को बिना स्पष्ट व्याख्या के बनाए रखना
  alternative: इसे सीधे ‘परमेश्वर के न्याय के दिन’ कहना
  rationale: मूल पाठ न्याय का प्रबल संकेत देता है, पर उसे स्पष्ट रूप से नाम नहीं देता। इसलिए रूपक को स्वयं बोलने देना धार्मिक तनाव और वास्तविक अस्पष्टता को सुरक्षित रखता है।
- issue: ἐν ἡμέρᾳ σφαγῆς का कालगत अथवा उद्देश्यगत संबंध
  choice: ‘वध के दिन’
  alternative: ‘वध के दिन के लिए’
  rationale: यूनानी ἐν का सीधा कालगत अर्थ मुख्य पाठ में रखा गया है। फिर भी पशुओं को वध के लिए मोटा करने की छवि के कारण उद्देश्यगत अर्थ संभव है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘विलासिता’ और ‘सुख-भोग’ दोनों यूनानी क्रियाओं के बीच निकटता तथा दूसरी क्रिया की अधिक तीव्र आत्म-लिप्तता को व्यक्त करते हैं। ‘हृदयों को मोटा कर लिया’ जानबूझकर असामान्य और तीखा रूपक है, क्योंकि उसे सहज बनाकर उसकी विडंबना मिटाना उचित नहीं होगा।
