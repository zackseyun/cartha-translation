source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ πλούσιοι, κλαύσατε ὀλολύζοντες ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/001.yaml
  text: Come now[a], you rich, weep[b], wailing over the miseries that are coming upon you.
translation:
  language: hi
  text: अब सुनो, हे धनवानो! तुम पर आनेवाली विपत्तियों के कारण रोओ और विलाप करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: अब सुनो
  rationale: यह तीखे आह्वान अथवा भर्त्सना का वाक्य-संकेत है। आधुनिक हिन्दी में ‘अब सुनो’ उसका सीधा और स्वाभाविक बल व्यक्त करता है।
- source_word: οἱ πλούσιοι
  choice: हे धनवानो
  rationale: व्याकरणतः कर्तृकारक रूप यहाँ संबोधन का कार्य करता है। ‘हे धनवानो’ सीधे और गंभीर संबोधन को स्पष्ट रखता है।
- source_word: κλαύσατε
  choice: रोओ
  rationale: यह प्रत्यक्ष शोक करने की आज्ञा है; ‘रोओ’ सामान्य, स्पष्ट और भारयुक्त हिन्दी पर्याय है।
- source_word: ὀλολύζοντες
  choice: विलाप करो
  rationale: यह ऊँचे स्वर में शोक प्रकट करने का बोध देता है और मुख्य आज्ञा की तीव्रता बढ़ाता है। हिन्दी में संयुक्त आज्ञा-वाक्य अधिक स्वाभाविक है।
- source_word: ἐπὶ ταῖς ταλαιπωρίαις
  choice: विपत्तियों के कारण
  rationale: ἐπί यहाँ शोक के आधार या कारण को बताता है, और ταλαιπωρίαις गंभीर संकटों या दुर्दशाओं को। ‘विपत्तियों के कारण’ अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὑμῶν ταῖς ἐπερχομέναις
  choice: तुम पर आनेवाली
  rationale: आनेवाली विपत्तियों का लक्ष्य संबोधित धनवान हैं। यह रचना आसन्न आगमन को व्यक्त करती है, पर उसकी निश्चित समय-सीमा नहीं जोड़ती।
theological_decisions:
- issue: धनवानों के संबोधन का स्वर और संदर्भ
  choice: आनेवाली विपत्तियों का सामना करनेवाले धनवान लोगों के प्रति भविष्यद्वक्ताओं जैसी भर्त्सना
  alternative: इसे केवल अत्याचारी अविश्वासी भूमिपतियों या केवल मसीही समुदाय के धनी सदस्यों के लिए सीमित करना
  rationale: इस पद में केवल ‘धनवानों’ को सीधे संबोधित करके आनेवाली विपत्तियों की घोषणा की गई है; उनकी सामुदायिक या वाचागत स्थिति स्पष्ट नहीं की गई। इसलिए अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधा, गंभीर और भविष्यद्वक्ताओं की भर्त्सना जैसा स्वर। ‘हे धनवानो’ गरिमापूर्ण संबोधन बनाए रखता है, जबकि ‘रोओ और विलाप करो’ सामान्य पाठक के लिए सहज है।
