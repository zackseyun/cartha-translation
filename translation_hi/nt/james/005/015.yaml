id: JAS.5.15
reference: James 5:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: hi
  text: और विश्वास की प्रार्थना बीमार व्यक्ति को बचाएगी[a], और प्रभु उसे उठा खड़ा करेगा। और यदि उसने पाप किए हों[b], तो उसे क्षमा किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चंगा करेगी” या “स्वस्थ करेगी”; यूनानी में “बचाएगी”।
    reason: lexical_alternative
  - marker: b
    text: या “भले ही उसने पाप किए हों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ
  choice: प्रार्थना
  rationale: पिछले पद में प्राचीनों द्वारा बीमार व्यक्ति के लिए प्रार्थना करने का संदर्भ है; इसलिए यहाँ ‘मन्नत’ नहीं, ‘प्रार्थना’ स्वाभाविक अर्थ है।
- source_word: πίστεως
  choice: विश्वास की
  rationale: संबंधकारक पदबंध को औपचारिक रूप से बनाए रखता है और ऐसी प्रार्थना का संकेत देता है जो परमेश्वर पर विश्वास से चिह्नित है।
- source_word: σώσει
  choice: बचाएगी
  rationale: ग्रीक क्रिया का मूल और व्यापक अर्थ सुरक्षित रहता है; बीमारी के निकट संदर्भ में इसमें चंगा करने या स्वस्थ करने का भाव भी शामिल हो सकता है।
- source_word: τὸν κάμνοντα
  choice: बीमार व्यक्ति को
  rationale: κάμνω थकने या निर्बल होने का अर्थ भी दे सकता है, पर अभिषेक, बीमारी और उठाए जाने के इस संदर्भ में ‘बीमार व्यक्ति’ सबसे स्पष्ट है।
- source_word: ἐγερεῖ
  choice: उठा खड़ा करेगा
  rationale: यह बीमार बिस्तर से उठाने और पुनःस्थापित करने की छवि को स्वाभाविक हिन्दी में बनाए रखता है, बिना इसके व्यापक अनुनाद को सीमित किए।
- source_word: κύριος
  choice: प्रभु
  rationale: नए नियम के ईश्वरीय संबोधन के लिए मानक, गरिमापूर्ण हिन्दी रूप।
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: यदि उसने पाप किए हों
  rationale: शर्त को स्पष्ट रखता है और यह नहीं कहता कि हर बीमारी निजी पाप के कारण होती है; κἄν का रियायती भाव ‘भले ही’ भी संभव है।
- source_word: ἀφεθήσεται αὐτῷ
  choice: उसे क्षमा किया जाएगा
  rationale: भविष्यत् कर्मवाच्य और निहित ईश्वरीय कर्तृत्व सुरक्षित रहते हैं; हिन्दी में यह स्वाभाविक ढंग से व्यक्ति को मिली क्षमा व्यक्त करता है।
theological_decisions:
- issue: σώσει को केवल शारीरिक चंगाई मानना या व्यापक बचाव/पुनःस्थापना
  choice: मुख्य पाठ में ‘बचाएगी’, और पादटिप्पणी में ‘चंगा करेगी/स्वस्थ करेगी’।
  alternative: ‘चंगा करेगी’ या ‘स्वस्थ करेगी’ को मुख्य पाठ में रखना।
  rationale: बीमारी का संदर्भ शारीरिक स्वास्थ्यलाभ की ओर संकेत करता है, फिर भी σῴζω का व्यापक अर्थ बनाए रखना मूल शब्द की अर्थ-समृद्धि को सुरक्षित रखता है।
- issue: क्या यह पद प्रार्थना द्वारा हर दशा में स्वतः चंगाई की गारंटी देता है
  choice: ग्रीक के सीधे भविष्यकालीन कथनों को बिना अतिरिक्त शर्त या अतिशयोक्ति के रखा गया है।
  alternative: ‘स्वस्थ कर सकती है’ कहकर कथन को कमजोर करना, या ‘हर हाल में अवश्य चंगा करेगी’ जोड़ना।
  rationale: अनुवाद न तो मूल प्रतिज्ञात्मक भाषा को कम करता है, न उससे आगे जाकर किसी विशिष्ट चंगाई-सिद्धांत को आरोपित करता है।
- issue: बीमारी और व्यक्तिगत पाप का संबंध
  choice: 'पाप को शर्तगत संभावना के रूप में रखा गया है: ‘यदि उसने पाप किए हों’।'
  alternative: यह संकेत देना कि हर बीमारी व्यक्तिगत पाप से होती है, अथवा ‘भले ही उसने पाप किए हों’।
  rationale: मूल वाक्य पाप को संभव परिस्थिति बताता है, सार्वभौमिक कारण नहीं; ‘भले ही’ का रियायती अर्थ पादटिप्पणी में सुरक्षित है।
- issue: πίστεως का अर्थ
  choice: ‘विश्वास की प्रार्थना’।
  alternative: ‘भरोसे से की गई प्रार्थना’ या, यहाँ कम संभावित रूप से, ‘विश्वासयोग्यता की प्रार्थना’।
  rationale: शाब्दिक संबंध बनाए रखते हुए परमेश्वर पर भरोसे से चिह्नित प्रार्थना का स्वाभाविक अर्थ खुला रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘उठा खड़ा करेगा’ मूल क्रिया की सजीव छवि रखता है। ‘बीमार व्यक्ति’ सामान्य पाठक के लिए स्पष्ट है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
