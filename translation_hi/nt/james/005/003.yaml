id: JAS.5.3
reference: James 5:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: hi
  text: तुम्हारा सोना और चाँदी जंग खा गए हैं[a], और उनकी जंग तुम्हारे विरुद्ध साक्षी होगी और आग की तरह तुम्हारा मांस खा जाएगी[b]। तुमने अंतिम दिनों में धन बटोरकर रखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा सोना और चाँदी क्षरित हो गए हैं।” यहाँ यूनानी क्रिया धातु पर जंग लगने के साथ-साथ उसके क्षरण या मलिन पड़ने को भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुमने अंतिम दिनों में आग की तरह धन बटोरकर रखा है।” कुछ लोग “आग की तरह” को पिछले खंड के बजाय अंतिम खंड से जोड़ते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: जंग लग गया है
  rationale: पूर्णकाल पूर्व में हुई प्रक्रिया से उत्पन्न वर्तमान दशा दिखाता है। सोने-चाँदी के लिए वैज्ञानिक अर्थ में ‘जंग’ सटीक न होते हुए भी यूनानी क्रिया धातुओं के क्षरण या मलिन पड़ने की व्यापक छवि रखती है; हिन्दी में यह भविष्यद्वाणी-सदृश चित्र को स्पष्ट और प्रभावशाली ढंग से बनाए रखता है।
- source_word: ἰὸς
  choice: जंग
  rationale: धातुओं के प्रसंग में इसका अर्थ क्षरण से उत्पन्न परत या प्रभाव है, न कि ‘विष’। ‘जंग’ मुख्य क्रिया के साथ शब्दगत संगति और मूर्त चित्र बनाए रखता है।
- source_word: εἰς μαρτύριον ὑμῖν
  choice: तुम्हारे विरुद्ध गवाही देगा
  rationale: वाक्यांश न्यायिक अर्थ रखता है। ‘विरुद्ध गवाही देगा’ μαρτύριον की साक्षी-संबंधी छवि और प्रसंग का प्रतिकूल भाव दोनों सुरक्षित रखता है।
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: तुम्हारा मांस खा जाएगा
  rationale: यह अत्यन्त सजीव और रूपकात्मक न्याय-चित्र है। ‘खा जाएगा’ यूनानी की चौंकाने वाली ठोस भाषा को ‘भस्म करेगा’ की अपेक्षा अधिक निकटता से रखता है।
- source_word: σάρκας
  choice: मांस
  rationale: यहाँ शब्द शारीरिक विनाश या न्याय की छवि में प्रयुक्त है, इसलिए ‘मांस’ मूल बहुवचन का स्वाभाविक हिन्दी सामूहिक रूप है; ‘शरीर’ चित्र को कुछ नरम कर देता।
- source_word: ὡς πῦρ
  choice: आग के समान
  rationale: 'इसे स्वाभाविक रूप से पहले वाले खंड के साथ जोड़ा गया है: जंग आग के समान मांस खाएगा। इससे उपमा और विनाशकारी न्याय का चित्र स्पष्ट रहता है।'
- source_word: ἐθησαυρίσατε
  choice: धन बटोरकर रखा है
  rationale: क्रिया धन या खजाना जमा करके रखने को व्यक्त करती है। ‘बटोरकर रखा’ संचय और उसके वर्तमान परिणाम दोनों को स्वाभाविक हिन्दी में दिखाता है, जबकि ‘जमाखोरी’ अनावश्यक रूप से अधिक व्याख्यात्मक होती।
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: अन्तिम दिनों में
  rationale: यह प्रचलित युगान्त-संबंधी पद का सीधा और पहचानने योग्य हिन्दी रूप है; यूनानी में निहित न होने के कारण ‘इन’ नहीं जोड़ा गया।
theological_decisions:
- issue: वाक्य में ὡς πῦρ का संबंध
  choice: 'इसे पिछले खंड से जोड़ा गया है: जंग ‘आग के समान’ उनका मांस खाएगा।'
  alternative: 'इसे अगले खंड से जोड़ना: ‘तुमने अन्तिम दिनों में आग के समान [या आग] बटोरकर रखी है।’'
  rationale: निकटवर्ती वाक्य-विन्यास और अर्थ इसे φάγεται के साथ जोड़ने के पक्ष में हैं, जिससे विनाशकारी न्याय की सुसंगत उपमा बनती है। फिर भी दूसरे संबंध की वास्तविक पाठ-विभाजन-संबंधी सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और चेतावनीपूर्ण स्वर रखा गया है। ‘जंग’, ‘गवाही देगा’, ‘मांस खा जाएगा’ और ‘धन बटोरकर रखा’ जैसे सामान्य शब्द मूल की न्यायिक तथा भविष्यद्वाणी-सदृश तीव्रता बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
