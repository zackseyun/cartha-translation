  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: hi
  text: एलिय्याह हमारी ही तरह मानवीय स्वभाव वाला मनुष्य था[a]। उसने लगन से प्रार्थना की कि वर्षा न हो, और देश में तीन वर्ष और छह महीने तक वर्षा नहीं हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एलिय्याह हमारी ही तरह मनुष्य था”; या, “एलिय्याह की भावनाएँ भी हमारी जैसी थीं।”
    reason: ὁμοιοπαθής समान मानवीय दशा/स्वभाव का व्यापक अर्थ दे सकता है, और संदर्भानुसार समान भावनाओं या अनुभूतियों का भी।
lexical_decisions:
- source_word: Ἠλίας
  choice: एलिय्याह
  rationale: हिन्दी बाइबल परंपरा में भविष्यद्वक्ता के नाम का प्रचलित लिप्यंतरण।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: एलिय्याह की सामान्य मानवता पर बल देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: हमारे जैसा दुःख-सुख अनुभव करने वाला
  rationale: यह पद समान मानवीय दशा, अनुभूतियों और सीमाओं की ओर संकेत करता है; केवल भावनाओं या वासनाओं तक अर्थ को सीमित नहीं करता।
- source_word: προσευχῇ προσηύξατο
  choice: मन लगाकर प्रार्थना की
  rationale: सजातीय संज्ञा और क्रिया से व्यक्त प्रार्थना की प्रबलता को सहज आधुनिक हिन्दी में प्रकट करता है।
- source_word: τοῦ μὴ βρέξαι
  choice: कि वर्षा न हो
  rationale: प्रार्थना की विषय-वस्तु अथवा अभिप्रेत परिणाम को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὐκ ἔβρεξεν
  choice: वर्षा नहीं हुई
  rationale: ग्रीक के निरपेक्ष वर्षा-सूचक प्रयोग का स्वाभाविक हिन्दी रूप।
- source_word: ἐπὶ τῆς γῆς
  choice: उस देश में
  rationale: एलिय्याह की कथा के संदर्भ में γῆ स्थानीय भूभाग या देश को दर्शाता है; इससे अनावश्यक वैश्विक अर्थ नहीं निकलता।
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: तीन वर्ष और छः महीने तक
  rationale: अवधि-सूचक कर्मकारक को हिन्दी में ‘तक’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: ὁμοιοπαθὴς द्वारा एलिय्याह और पाठकों के बीच समानता
  choice: एलिय्याह को पाठकों के समान मानवीय दशा और अनुभवों वाला मनुष्य बताया गया है।
  alternative: एलिय्याह की भावनाएँ या वासनाएँ हमारी जैसी थीं।
  rationale: व्यापक मानवीय समानता पद के उत्साहवर्धक आशय को बनाए रखती है और अर्थ को केवल भावनाओं या वासनाओं तक सीमित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘मन लगाकर’ प्रार्थना की तीव्रता को बिना कृत्रिम शब्दशः पुनरुक्ति के व्यक्त करता है; ‘उस देश में’ कथा के स्थानीय संदर्भ को स्पष्ट रखता है।
