reference: James 5:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: hi
  text: देखो! तुम्हारे खेतों की फसल काटने वाले मज़दूरों की वह मज़दूरी, जिसे तुमने रोक रखी है, पुकार रही है; और फसल काटने वालों की पुकारें सेनाओं के प्रभु[a] के कानों तक पहुँच चुकी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु सबाओत।” यूनानी पाठ में यहाँ इब्रानी उपाधि Σαβαώθ का लिप्यंतरण रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान खींचने वाला बलयुक्त उद्गार है; ‘देखो’ आधुनिक और स्वाभाविक हिंदी में उसका प्रभाव बनाए रखता है।
- source_word: μισθὸς τῶν ἐργατῶν
  choice: मज़दूरों की ... मज़दूरी
  rationale: यह श्रमिकों को देय पारिश्रमिक है; हिंदी में ‘मज़दूरी’ कृषि-श्रम के संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: ἀμησάντων τὰς χώρας ὑμῶν
  choice: जिन ... ने तुम्हारे खेतों की फसल काटी
  rationale: ἀμάω कटाई करने को और χώρα यहाँ खेती की भूमि को सूचित करता है; यह अनुवाद दोनों को सहज हिंदी में व्यक्त करता है।
- source_word: ὁ ἀφυστερημένος ἀφ’ ὑμῶν
  choice: जिसे तुमने रोक रखा है
  rationale: यह देय मज़दूरी को अनुचित रूप से रोके रखने का सीधा आरोप व्यक्त करता है, बिना ‘ठगना’ जैसे अधिक व्याख्यात्मक शब्द को जोड़ने के।
- source_word: κράζει
  choice: पुकार रही है
  rationale: एकवचन ‘मज़दूरी’ को सजीव रूप देकर न्याय के लिए पुकारते हुए दिखाया गया है; वर्तमान क्रिया इस जीवंत चित्र को बनाए रखती है।
- source_word: αἱ βοαὶ τῶν θερισάντων
  choice: फसल काटने वालों की पुकार
  rationale: βοαί सहायता अथवा न्याय के लिए उठी तीव्र पुकारों को दर्शाता है; हिंदी में सामूहिक एकवचन ‘पुकार’ स्वाभाविक है।
- source_word: εἰς τὰ ὦτα ... εἰσεληλύθασιν
  choice: कानों तक पहुँच चुकी है
  rationale: यूनानी का पूर्णकाल पूरा हो चुके आगमन और उसके वर्तमान परिणाम को व्यक्त करता है; ‘पहुँच चुकी है’ हिंदी में इसे स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: Κυρίου Σαβαὼθ
  choice: सेनाओं के प्रभु
  rationale: Σαβαώθ इब्रानी उपाधि ‘सेनाएँ/दल’ का लिप्यंतरण है; अर्थानुवाद आधुनिक हिंदी पाठक के लिए उपाधि को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय उपाधि Κυρίου Σαβαὼθ का अनुवाद
  choice: सेनाओं के प्रभु
  alternative: प्रभु सबाओत
  rationale: यूनानी पाठ ने इब्रानी Ṣəḇāʾôṯ को Σαβαώθ के रूप में सुरक्षित रखा है। मुख्य पाठ में उपाधि का अर्थ देना समझने योग्य है, जबकि पारंपरिक लिप्यंतरण को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘मज़दूर’ और ‘मज़दूरी’ कृषि-श्रम के संदर्भ को स्पष्ट करते हैं। वचन का आरोपात्मक बल और रोकी गई मज़दूरी का मानवीकरण सुरक्षित रखा गया है।
