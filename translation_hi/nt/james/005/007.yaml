id: JAS.5.7
reference: James 5:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπ’ ⸀αὐτῷ ἕως ⸀λάβῃ πρόϊμον καὶ ὄψιμον.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/007.yaml
  text: Be patient[a], therefore, brothers, until the coming of the Lord. Look, the farmer waits for the precious fruit of the earth[b], being patient over it until it receives the early and late rains.
translation:
  language: hi
  text: इसलिए, भाइयो,[a] प्रभु के आगमन[b] तक धीरज रखो। देखो, किसान भूमि की बहुमूल्य उपज की बाट जोहता है और उसके लिए तब तक धीरज रखता है, जब तक उसे आरम्भ और अन्त की वर्षा न मिल जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में शाब्दिक रूप से “भाइयो” है; ऐसा संबोधन प्रायः पूरे विश्वासी समुदाय, अर्थात स्त्री और पुरुष दोनों, के लिए प्रयुक्त होता है।
    reason: alternative_reading
  - marker: b
    text: “आगमन” के लिए प्रयुक्त यूनानी शब्द का अर्थ “उपस्थिति” भी हो सकता है; यहाँ यह संभवतः प्रभु के भविष्य में आने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακροθυμήσατε / μακροθυμῶν
  choice: धीरज रखो / धीरज रखता है
  rationale: दोनों रूपों में एक ही यूनानी धातु की पुनरावृत्ति है। हिंदी में “धीरज रखना” सहनशील प्रतीक्षा का भाव स्वाभाविक रूप से व्यक्त करते हुए इस पुनरावृत्ति को बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निकलने वाले निष्कर्ष को स्पष्ट करता है।
- source_word: ἀδελφοί
  choice: भाइयो और बहनो
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन है, पर समुदाय को संबोधित करते समय इसमें स्त्री और पुरुष दोनों सम्मिलित हो सकते हैं; आधुनिक हिंदी में समावेशी आशय स्पष्ट किया गया है और शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: παρουσίας
  choice: आगमन
  rationale: इस भविष्यपरक प्रसंग में παρουσία प्रभु के आने या पहुँचने को सूचित करता है। “आगमन” स्वाभाविक और गरिमापूर्ण है, जबकि “उपस्थिति” की शाब्दिक संभावना पाद-टिप्पणी में सुरक्षित है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह श्रोता का ध्यान किसान के उदाहरण की ओर खींचता है और आधुनिक हिंदी में स्वाभाविक है।
- source_word: γεωργὸς
  choice: किसान
  rationale: सामान्य कृषि-कर्मी के लिए सरल और सटीक हिंदी समतुल्य।
- source_word: ἐκδέχεται
  choice: बाट जोहता है
  rationale: यह लगातार और आशापूर्ण प्रतीक्षा को व्यक्त करता है तथा धीरज के विषय के अनुकूल है।
- source_word: τίμιον καρπὸν τῆς γῆς
  choice: भूमि की बहुमूल्य उपज
  rationale: καρπός यहाँ खेती की पैदावार है; “उपज” हिंदी कृषि-संदर्भ में “फल” से अधिक स्वाभाविक है। τίμιος उसके मूल्य और वांछनीयता को “बहुमूल्य” से व्यक्त करता है।
- source_word: ἐπ’ αὐτῷ
  choice: उसके लिए
  rationale: सर्वनाम का स्वाभाविक संदर्भ उपज है; हिंदी में किसान का उस उपज की प्रतीक्षा में धीरज रखना सहज रूप से व्यक्त होता है।
- source_word: ἕως λάβῃ πρόϊμον καὶ ὄψιμον
  choice: जब तक उसे पहली और पिछली वर्षा न मिल जाए
  rationale: पाठ के व्याकरण में कर्ता सबसे स्वाभाविक रूप से भूमि की उपज है। “पहली और पिछली वर्षा” कृषि ऋतु के आरंभ और अंत की वर्षा को बनाए रखती है; स्रोत में “वर्षा” निहित है।
theological_decisions:
- issue: ἀδελφοί का सामुदायिक संबोधन
  choice: भाइयो और बहनो
  alternative: भाइयो
  rationale: रूपतः शब्द “भाइयो” है, किंतु यूनानी पत्रों में यह पूरे विश्वासी समुदाय का संबोधन हो सकता है। मुख्य पाठ में आशय स्पष्ट किया गया है और रूपगत तथ्य पाद-टिप्पणी में रखा गया है।
- issue: παρουσία τοῦ κυρίου
  choice: प्रभु का आगमन
  alternative: प्रभु की उपस्थिति
  rationale: याकूब के भविष्यपरक उपदेश में अपेक्षित घटना प्रभु का आना है। फिर भी παρουσία की “उपस्थिति” वाली शब्दार्थ-संभावना को पाद-टिप्पणी में संरक्षित किया गया है।
- issue: λάβῃ का कर्ता
  choice: उपज को वर्षा मिलना
  alternative: किसान का पहली और पिछली वर्षा पाना
  rationale: निकटवर्ती नपुंसकलिंग एकवचन καρπός के साथ λάβῃ का संबंध सबसे स्वाभाविक है। पाठगत और व्याकरणिक तनाव को किसी अतिरिक्त धार्मिक अर्थ से नहीं भरा गया।
translation_notes:
  register: भाषा आधुनिक, सामान्य और गरिमापूर्ण रखी गई है। “बाट जोहता है” अपेक्षापूर्ण प्रतीक्षा को सजीव बनाता है; “भूमि की बहुमूल्य उपज” कृषि-संदर्भ में स्वाभाविक है। आदेश और किसान के उदाहरण में μακροθυμ- की पुनरावृत्ति “धीरज रखो/रखता है” द्वारा सुरक्षित है।
