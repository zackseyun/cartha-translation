    reason: lexical_alternative
lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: दुःख उठा रहा है
  rationale: यह क्रिया कठिनाई, विपत्ति या दुःख सहने का व्यापक भाव रखती है; यह इसे केवल बीमारी या उत्पीड़न तक सीमित नहीं करती।
- source_word: τις
  choice: कोई
  rationale: अनिश्चित सर्वनाम के एकवचन और सामान्य प्रतिनिधिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ὑμῖν
  choice: तुम में से
  rationale: सम्बोधित समुदाय के भीतर किसी व्यक्ति को सूचित करने वाला स्वाभाविक हिन्दी प्रयोग है।
- source_word: προσευχέσθω
  choice: वह प्रार्थना करे
  rationale: तीसरे पुरुष के वर्तमान आज्ञार्थक उपदेश को स्पष्ट और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: εὐθυμεῖ
  choice: प्रसन्न है
  rationale: अच्छे मनोभाव या उत्साहित अवस्था को संक्षिप्त, सहज हिन्दी में व्यक्त करता है।
- source_word: ψαλλέτω
  choice: वह स्तुति के गीत गाए
  rationale: यहाँ परमेश्वर की ओर निर्देशित गायन का व्यापक भक्तिपरक भाव व्यक्त होता है, जबकि विशेष रूप से भजन गाने की सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: एकवचन में दिया गया सामान्य उपदेश
  choice: “कोई ... वह ... करे/गाए” के द्वारा एकवचन बनाए रखा
  alternative: वे प्रार्थना करें / वह व्यक्ति प्रार्थना करे
  rationale: यूनानी में अनिश्चित सर्वनाम और दोनों आज्ञार्थक क्रियाएँ एकवचन हैं। हिन्दी का “कोई ... वह” सामान्य और समावेशी अर्थ रखते हुए उस व्याकरणिक संख्या को सुरक्षित रखता है।
- issue: ψαλλέτω का अर्थ
  choice: स्तुति के गीत गाए
  alternative: भजन गाए / संगीत करे
  rationale: सन्दर्भ में व्यापक रूप से स्तुतिगान का अर्थ सुगम है; फिर भी क्रिया के विशेष रूप से भजन गाने वाले सम्भावित अर्थ को पादटिप्पणी में रखा गया है, ताकि पाठ किसी संकीर्ण उपासना-पद्धति को अनिवार्य न ठहराए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामुदायिक सम्बोधन के अनुरूप। “दुःख उठा रहा है” व्यापक कष्ट को और “स्तुति के गीत गाए” भक्तिपरक गायन को स्वाभाविक रूप से व्यक्त करता है।
