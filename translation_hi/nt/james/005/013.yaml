translation:
  language: hi
  text: क्या तुम में कोई कष्ट सह रहा है? वह प्रार्थना करे। क्या कोई प्रसन्न है? वह स्तुतिगान करे[a]।
  philosophy: optimal-equivalence
  footnotes:
