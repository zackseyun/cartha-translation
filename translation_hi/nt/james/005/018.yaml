base_translation:
  language: en
  yaml_path: translation/nt/james/005/018.yaml
  text: And he prayed again[a], and the sky gave rain[b], and the earth produced its fruit.
translation:
  language: hi
  text: और उसने फिर प्रार्थना की, और आकाश ने वर्षा दी[a], और धरती ने अपनी उपज दी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकाश ने पानी बरसाया।’
    reason: lexical_alternative
  - marker: b
    text: या ‘धरती ने अपना फल उगाया’ अथवा ‘भूमि ने अपनी फसल उपजाई।’
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: फिर
  rationale: यह क्रिया की पुनरावृत्ति बताता है; प्रसंग में एलिय्याह की दोबारा की गई प्रार्थना के लिए ‘फिर’ स्वाभाविक और संक्षिप्त है।
- source_word: προσηύξατο
  choice: उसने प्रार्थना की
  rationale: प्रोसेउखोमाइ के इस रूप का सीधा अर्थ ‘उसने प्रार्थना की’ है। इस पद में ‘मन लगाकर’ या ‘बहुत आग्रह से’ जोड़ना उचित नहीं, क्योंकि ऐसा बल पिछले पद से आयात होगा।
- source_word: ὁ οὐρανὸς
  choice: आकाश
  rationale: वर्षा के प्रसंग में οὐρανός दृश्य आकाश को दर्शाता है; ‘आकाश’ आधुनिक हिन्दी में स्वाभाविक है और धार्मिक अर्थ वाले ‘स्वर्ग’ से अनावश्यक भ्रम नहीं पैदा करता।
- source_word: ὑετὸν ἔδωκεν
  choice: वर्षा दी
  rationale: यूनानी पदबंध का निकट अर्थ ‘वर्षा दी’ है। यह हिन्दी में गरिमापूर्ण और समझने योग्य रहते हुए δίδωμι की ‘देने’ वाली अभिव्यक्ति बनाए रखता है।
- source_word: ἡ γῆ
  choice: धरती
  rationale: γῆ का अर्थ धरती, भूमि या मिट्टी हो सकता है। ‘धरती’ आकाश के साथ स्रोत के समानांतर विन्यास को बनाए रखती है और कृषि-संबंधी अर्थ भी समेटती है।
- source_word: ἐβλάστησεν
  choice: उपजाया
  rationale: βλαστάνω उगने, अंकुरित होने या उपज उत्पन्न करने को व्यक्त करता है। καρπός के साथ ‘उपजाया’ स्वाभाविक हिन्दी है और उत्पादन का कृषि-संबंधी भाव स्पष्ट करता है।
- source_word: τὸν καρπὸν αὐτῆς
  choice: अपना फल
  rationale: καρπός यहाँ धरती की उपज को दर्शाता है। ‘अपना फल’ स्रोत के रूपक और संबंध को बनाए रखता है; ‘फसल’ सम्भव है, पर यूनानी अर्थ को कुछ संकरा कर देता है।
theological_decisions:
- issue: एलिय्याह की प्रार्थना और परमेश्वर की प्रत्युत्तरकारी क्रिया
  choice: 'पद को उसकी प्रत्यक्ष अभिव्यक्ति के अनुसार रखा गया है: आकाश ने वर्षा दी और धरती ने फल उपजाया।'
  alternative: ‘परमेश्वर ने वर्षा भेजी’ कहकर ईश्वरीय कर्तृत्व को स्पष्ट करना।
  rationale: प्रसंग में परमेश्वर का प्रत्युत्तर निहित है, पर इस पद में उसे अलग से कर्ता बनाकर नहीं कहा गया। अनुवाद स्रोत की अभिव्यक्ति को बनाए रखता है और अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली अपनाई गई है। ‘आकाश—धरती’ की समानांतर रचना और ‘वर्षा दी’ की स्रोत-सन्निकट अभिव्यक्ति सुरक्षित रखी गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
