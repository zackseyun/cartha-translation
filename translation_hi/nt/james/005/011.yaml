id: JAS.5.11
reference: James 5:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: hi
  text: देखो, हम धीरज धरने वालों को धन्य कहते हैं। तुमने अय्यूब के धीरज के विषय में सुना है और प्रभु की ओर से हुए परिणाम को देखा है—कि प्रभु अत्यन्त करुणामय और दयालु है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακαρίζομεν
  choice: हम ... को धन्य कहते हैं
  rationale: क्रिया का अर्थ किसी को धन्य या सौभाग्यशाली मानना और ऐसा कहना है; ‘धन्य कहते हैं’ बाइबिलीय गरिमा और सहज हिन्दी दोनों बनाए रखता है।
- source_word: ὑπομείναντας / ὑπομονὴν
  choice: धीरज धरने वालों / धीरज
  rationale: दोनों सम्बद्ध यूनानी रूप कठिन परिस्थिति में टिके रहने को व्यक्त करते हैं; समान हिन्दी मूल से उनकी शब्दगत कड़ी बनी रहती है।
- source_word: τὸ τέλος κυρίου
  choice: प्रभु की ओर से हुए परिणाम
  rationale: τέλος यहाँ अंत, परिणति या परिणाम का संकेत दे सकता है। अय्यूब की कथा के सन्दर्भ में ‘परिणाम’ स्वाभाविक है, जबकि ‘की ओर से हुए’ सम्बन्धवाचक κυρίου की वह सम्भावना बनाए रखता है कि यह प्रभु द्वारा लाया गया परिणाम है।
- source_word: πολύσπλαγχνός
  choice: अत्यन्त करुणामय
  rationale: यह दुर्लभ शब्द गहरी और प्रचुर करुणा को व्यक्त करता है; ‘अत्यन्त करुणामय’ आधुनिक, गरिमापूर्ण और अर्थ-सन्निकट है।
- source_word: οἰκτίρμων
  choice: दयालु
  rationale: करुणा और दया दिखाने वाले स्वभाव का सरल, प्रचलित हिन्दी प्रतिरूप।
theological_decisions:
- issue: τὸ τέλος κυρίου का अर्थ
  choice: प्रभु की ओर से हुए परिणाम
  alternative: प्रभु का उद्देश्य / प्रभु का अंत
  rationale: ‘उद्देश्य’ पाठ की वास्तविक अर्थ-व्याप्ति को अनावश्यक रूप से सीमित करता है, और ‘प्रभु का अंत’ हिन्दी में भ्रामक हो सकता है। चुना हुआ रूप अय्यूब के अनुभव की प्रभु-प्रदत्त परिणति को सामने रखता है, पर किसी विशिष्ट धर्मवैचारिक व्याख्या को आरोपित नहीं करता।
- issue: अय्यूब के धीरज और प्रभु के स्वभाव का सम्बन्ध
  choice: वाक्य के निष्कर्ष को प्रत्यक्ष कथन के रूप में रखा गया
  alternative: स्पष्ट व्याख्या जोड़ना कि अय्यूब की बहाली ही प्रभु की करुणा सिद्ध करती है
  rationale: मूल पाठ केवल परिणाम देखने और प्रभु के करुणामय तथा दयालु होने को जोड़ता है; अतिरिक्त व्याख्या न जोड़ने से पाठ की संक्षिप्तता और धर्मवैचारिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल पर गरिमापूर्ण शैली। ‘देखो’ ἰδού की ध्यान आकर्षित करने वाली शक्ति रखता है। अय्यूब नाम का प्रचलित हिन्दी बाइबिलीय रूप अपनाया गया है।
