source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: hi
  text: परन्तु सबसे बढ़कर, मेरे भाइयो[a], शपथ न खाना—न स्वर्ग की, न पृथ्वी की, और न किसी और शपथ की। बल्कि तुम्हारी ‘हाँ’ हाँ हो और ‘नहीं’ नहीं हो[b], ताकि तुम न्याय के अधीन न पड़ो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे भाइयो और बहनो”; यूनानी में “भाइयो” है, और सम्भवतः यह पूरे विश्वासी समुदाय को संबोधित करता है।
    reason: lexical_alternative
  - marker: b
    text: या “ताकि तुम दण्डाज्ञा के अधीन न पड़ो।”
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: सबसे बढ़कर
  rationale: यह स्वाभाविक हिन्दी में उपदेश की विशेष प्राथमिकता और जोर को व्यक्त करता है; शाब्दिक ‘सब वस्तुओं से पहले’ असहज होता।
- source_word: ἀδελφοί μου
  choice: मेरे भाइयो
  rationale: यूनानी के पुल्लिंग बहुवचन संबोधन को रूपगत रूप से सुरक्षित रखा गया है; यहाँ सम्भवतः पूरी विश्वासी मण्डली अभिप्रेत है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: μὴ ὀμνύετε
  choice: शपथ न खाना
  rationale: यह आधुनिक हिन्दी में oath-taking का स्पष्ट और प्रचलित प्रयोग है तथा इसे अपशब्द बोलने के अर्थ से अलग रखता है।
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον
  choice: न स्वर्ग की, न पृथ्वी की, और न किसी दूसरी प्रकार की शपथ
  rationale: तीनों निषेधों की समानान्तर संरचना और व्यापकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: बल्कि तुम्हारी ‘हाँ’ का अर्थ हाँ और ‘नहीं’ का अर्थ नहीं हो
  rationale: यूनानी की संक्षिप्त लोकोक्तिपरक शक्ति बनाए रखते हुए हिन्दी में आशय स्पष्ट करता है कि कथन सीधा और विश्वसनीय हो।
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: ताकि तुम न्याय के अधीन न पड़ो
  rationale: ‘न्याय के अधीन’ ὑπὸ κρίσιν के रूपक और व्यापक अर्थ को सुरक्षित रखता है; ‘दण्डाज्ञा’ उससे अधिक संकीर्ण हो सकती है।
theological_decisions:
- issue: κρίσις को व्यापक ‘न्याय’ या अधिक प्रबल ‘दण्डाज्ञा’ के रूप में प्रस्तुत करना
  choice: न्याय
  alternative: दण्डाज्ञा
  rationale: κρίσις स्वयं अनिवार्य रूप से अन्तिम दोषसिद्धि या दण्डाज्ञा नहीं बताता। मुख्य पाठ में व्यापक अर्थ रखकर धार्मिक निष्कर्ष को अनावश्यक रूप से संकीर्ण नहीं किया गया।
- issue: मिश्रित विश्वासी समुदाय के संबोधन में ἀδελφοί का अनुवाद
  choice: मेरे भाइयो
  alternative: मेरे भाइयो और बहनो
  rationale: मुख्य पाठ यूनानी के व्याकरणिक पुल्लिंग रूप को सुरक्षित रखता है, जबकि पादटिप्पणी सम्भावित समावेशी सामुदायिक संदर्भ बताती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘शपथ न खाना’ साधारण हिन्दी पाठक के लिए सहज है। ‘हाँ’ और ‘नहीं’ को उद्धरण-चिह्नों में रखकर कथन की लोकोक्तिपरक संरचना स्पष्ट की गई है।
