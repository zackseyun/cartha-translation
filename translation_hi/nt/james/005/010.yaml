review_pass:
  verdict: revise
  source_fidelity: Draft correctly identifies the prophets as the exemplars and preserves the two qualities, suffering and patience. However, ‘प्रभु के नाम में होकर’ is not an idiomatic Hindi rendering of ἐν τῷ ὀνόματι κυρίου and obscures the source expression’s sense of speaking in/under the Lord’s name.
  naturalness: The overall sentence is understandable, but ‘नाम में होकर’ is unnatural in modern standard Hindi. ‘प्रभु के नाम से बातें कीं’ is idiomatic, retains the biblical name-expression, and communicates the intended representative/authoritative sense without over-specifying it.
  terminology: ‘भाइयो’ appropriately reflects the masculine plural vocative, with a suitable footnote about its likely community-wide reference. ‘भविष्यवक्ता,’ ‘प्रभु,’ ‘कष्ट सहने,’ and ‘धैर्य रखने’ are clear and suitably elevated modern Hindi biblical terms.
  issues:
  - severity: medium
    issue: ‘प्रभु के नाम में होकर’ is non-idiomatic Hindi.
    rationale: Hindi ordinarily expresses this construction as ‘प्रभु के नाम से’ (or, more interpretively, ‘प्रभु के अधिकार से’). Retaining ‘नाम’ in ‘प्रभु के नाम से’ is both natural and closer to the Greek ἐν τῷ ὀνόματι κυρίου.
