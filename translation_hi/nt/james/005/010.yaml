source:
  edition: SBLGNT
  text: ὑπόδειγμα λάβετε, ⸀ἀδελφοί, τῆς κακοπαθίας καὶ τῆς μακροθυμίας τοὺς προφήτας, οἳ ἐλάλησαν ⸀ἐν τῷ ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/010.yaml
  text: Brothers[a], take the prophets who spoke in the name of the Lord as an example of suffering and patience.
translation:
  language: hi
  text: भाइयो[a], उन भविष्यवक्ताओं को कष्ट सहने और धैर्य रखने का उदाहरण मानो, जिन्होंने प्रभु के नाम से बातें कीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयो’ यूनानी के पुल्लिंग बहुवचन ἀδελφοί का अनुवाद है; यहाँ याकूब सम्भवतः स्त्रियों सहित पूरे विश्वासी समुदाय को सम्बोधित कर रहा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα λάβετε
  choice: उदाहरण मानो
  rationale: ग्रीक पदबंध का अर्थ किसी व्यक्ति को अनुकरण योग्य उदाहरण के रूप में ग्रहण करना है; आधुनिक हिन्दी में ‘उदाहरण मानो’ स्वाभाविक और आज्ञार्थक बल के अनुरूप है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: सम्बोधन का ग्रीक रूप पुल्लिंग बहुवचन है। मुख्य पाठ में उसका रूप सुरक्षित रखा गया है, जबकि समुदाय की सम्भावित समावेशी व्याप्ति पादटिप्पणी में स्पष्ट की गई है।
- source_word: κακοπαθίας
  choice: दुःख सहने
  rationale: यह शब्द कष्ट या विपत्ति झेलने को व्यक्त करता है। ‘दुःख सहने’ संज्ञात्मक भाव को सरल, स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: μακροθυμίας
  choice: धीरज रखने
  rationale: यहाँ दीर्घकाल तक धैर्यपूर्वक सहने का भाव है। ‘धीरज रखने’ सामान्य पाठक के लिए स्पष्ट है और κακοπαθία के साथ समानान्तर बैठता है।
- source_word: τοὺς προφήτας
  choice: उन भविष्यवक्ताओं को
  rationale: ये वे आदर्श व्यक्ति हैं जिन्हें उदाहरण मानने की आज्ञा दी गई है; हिन्दी वाक्यक्रम में संकेतवाचक ‘उन’ अगले सम्बन्धवाचक उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: ἐλάλησαν
  choice: बातें कहीं
  rationale: λαλέω का साधारण अर्थ बोलना है। ‘बातें कहीं’ इसकी सरलता बनाए रखता है और अनावश्यक रूप से ‘घोषणा की’ जैसा अधिक विशिष्ट अर्थ नहीं जोड़ता।
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: प्रभु के नाम में होकर
  rationale: ‘नाम में’ की बाइबलीय अभिव्यक्ति को सुरक्षित रखते हुए ‘होकर’ जोड़ा गया है, ताकि हिन्दी में प्रतिनिधित्व अथवा अधिकार के भाव वाला मुहावरा स्पष्ट और स्वाभाविक रहे।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος के लिए प्रतिष्ठित, गरिमापूर्ण और व्यापक रूप से समझा जाने वाला हिन्दी पद ‘प्रभु’ चुना गया है।
theological_decisions:
- issue: समुदाय को सम्बोधित पुल्लिंग बहुवचन ἀδελφοί
  choice: मुख्य पाठ में ‘भाइयो’, और समावेशी सन्दर्भ की सूचना पादटिप्पणी में
  alternative: ‘भाइयो और बहनो’
  rationale: ग्रीक का व्याकरणिक पुल्लिंग रूप मुख्य पाठ में सुरक्षित है; साथ ही पत्र के सामुदायिक सम्बोधन में स्त्रियों के सम्मिलित होने की सम्भावना को पादटिप्पणी स्पष्ट करती है।
- issue: भविष्यवक्ताओं और ὑπόδειγμα का वाक्यगत सम्बन्ध
  choice: भविष्यवक्ताओं को दुःख सहने और धीरज रखने का उदाहरण मानना
  alternative: दुःख और धीरज में भविष्यवक्ताओं का उदाहरण लेना
  rationale: ग्रीक में ‘भविष्यवक्ताओं’ को प्रत्यक्ष कर्म के रूप में उदाहरण माना गया है, और सम्बन्धकारक पद बताते हैं कि वे किन बातों में उदाहरण हैं। चुना हुआ रूप इस सम्बन्ध को स्पष्ट रखता है।
- issue: ἐν τῷ ὀνόματι κυρίου का आशय
  choice: प्रभु के नाम में होकर
  alternative: प्रभु के अधिकार से
  rationale: मूल अभिव्यक्ति प्रतिनिधित्व और अधिकार दोनों का संकेत दे सकती है। मुख्य पाठ में ‘नाम’ का मुहावरा रखकर इस अर्थ-व्याप्ति को किसी एक व्याख्या तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण किन्तु सहज रखी गई है। ‘दुःख सहने और धीरज रखने’ का समानान्तर रूप सामान्य पाठक के लिए स्पष्ट है। ‘प्रभु के नाम में होकर’ मूल मुहावरे और उसकी प्रतिनिधित्व/अधिकार सम्बन्धी अर्थ-व्याप्ति को बनाए रखता है।
