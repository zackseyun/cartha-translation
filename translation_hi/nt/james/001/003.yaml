lexical_decisions:
- source_word: γινώσκοντες
  choice: क्योंकि तुम जानते हो
  rationale: वर्तमान काल का कर्तृवाचक कृदंत बहुवचन में है और पद 2 की आज्ञा का आधार बताता है। हिन्दी में कारण-सूचक रूप स्वाभाविक है।
- source_word: ὅτι
  choice: कि
  rationale: यह उस बात की विषय-वस्तु प्रस्तुत करता है जिसे पाठक जानते हैं।
- source_word: τὸ δοκίμιον
  choice: परख
  rationale: यह शब्द जाँचने की प्रक्रिया या जाँच से प्रमाणित खरेपन—दोनों को सूचित कर सकता है। मुख्य पाठ में ‘परख’ प्रसंग के अनुकूल, संक्षिप्त और स्वाभाविक है; वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: ὑμῶν τῆς πίστεως
  choice: तुम्हारे विश्वास की
  rationale: सम्बन्धकारक रचना पाठकों के विश्वास की परख को सूचित करती है। यहाँ πίστις के लिए ‘विश्वास’ सर्वाधिक स्पष्ट और प्रचलित विकल्प है।
- source_word: κατεργάζεται
  choice: उत्पन्न करती है
  rationale: क्रिया किसी परिणाम को प्रभावी रूप से लाने का भाव रखती है। ‘उत्पन्न करती है’ आधुनिक हिन्दी में परिणामकारी अर्थ स्पष्ट करती है।
- source_word: ὑπομονήν
  choice: धीरज
  rationale: यह कठिनाइयों के अधीन टिके रहने की क्षमता और दृढ़ता को व्यक्त करता है। हिन्दी में ‘धीरज’ सहज है; ‘दृढ़ता’ और ‘धैर्यपूर्ण सहनशीलता’ वैकल्पिक अर्थ हैं।
theological_decisions:
- issue: πίστις का अनुवाद
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: इस प्रसंग में पाठकों के विश्वास की परीक्षा की बात है। ‘विश्वास’ अर्थ को बिना किसी विशिष्ट सम्प्रदायगत व्याख्या के स्वाभाविक रूप से व्यक्त करता है।
- issue: δοκίμιον की प्रक्रिया और परिणाम के बीच अस्पष्टता
  choice: मुख्य पाठ में ‘परख’
  alternative: ‘तुम्हारे विश्वास का प्रमाणित खरापन’
  rationale: यूनानी शब्द परखने की प्रक्रिया अथवा उससे सिद्ध हुए खरेपन को व्यक्त कर सकता है। प्रसंग में प्रक्रिया अधिक स्वाभाविक है, पर वास्तविक वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
