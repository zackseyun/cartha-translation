source:
  edition: SBLGNT
  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: hi
  text: पर वह विश्वास के साथ[a] माँगे और तनिक भी संदेह न करे, क्योंकि संदेह करनेवाला समुद्र की एक लहर के समान है, जो हवा से धकेली और उछाली जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भरोसे के साथ।” यहाँ “विश्वास” के लिए प्रयुक्त यूनानी शब्द इस संदर्भ में भरोसा रखकर परमेश्वर पर निर्भर होने का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτείτω
  choice: माँगे
  rationale: यह वर्तमान काल का तृतीय-पुरुष आज्ञार्थक रूप है। हिंदी में संदर्भ से जुड़ा ‘वह … माँगे’ इसके उपदेशात्मक बल को स्वाभाविक ढंग से व्यक्त करता है; पिछली आयत में परमेश्वर से बुद्धि माँगने की बात है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछली बात से हल्का विरोध अथवा नई शर्त की ओर बढ़ना दिखाता है। ‘पर’ आधुनिक हिंदी में इस संबंध को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν πίστει
  choice: विश्वास के साथ
  rationale: ग्रीक के ‘विश्वास में’ भाव को शब्दशः अस्वाभाविक बनाए बिना व्यक्त किया गया है। यहाँ विश्वास का आशय परमेश्वर पर भरोसा रखकर माँगना है।
- source_word: μηδὲν διακρινόμενος
  choice: तनिक भी संदेह न करे
  rationale: μηδέν की पूर्ण निषेधात्मक शक्ति को ‘तनिक भी’ व्यक्त करता है। इस संदर्भ में διακρίνομαι भीतरी दुविधा, संदेह या डाँवाडोल होने का भाव रखता है।
- source_word: ὁ γὰρ διακρινόμενος
  choice: क्योंकि संदेह करनेवाला
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत को सामान्य, प्रतिनिधिक अर्थ में रखा गया है; इससे अनावश्यक रूप से केवल पुरुष का संकेत नहीं आता।
- source_word: ἔοικεν
  choice: के समान है
  rationale: तुलना व्यक्त करने वाला स्पष्ट और गरिमापूर्ण हिंदी रूप।
- source_word: κλύδωνι θαλάσσης
  choice: समुद्र की उस लहर
  rationale: κλύδων समुद्र की उठती या उमड़ती लहर को दर्शाता है। हिंदी वाक्य में ‘उस’ आगे आने वाले वर्णन से लहर को स्वाभाविक रूप से जोड़ता है।
- source_word: ἀνεμιζομένῳ
  choice: हवा से चलाई
  rationale: कर्मवाच्य कृदंत हवा द्वारा लहर को गतिमान किए जाने का चित्र देता है। ‘चलाई’ इस बाहरी प्रेरक शक्ति को स्पष्ट रखता है।
- source_word: καὶ ῥιπιζομένῳ
  choice: और उछाली जाती है
  rationale: यह लहर के झकझोरे या इधर-उधर उछाले जाने का चित्र पूरा करता है और व्यक्ति की अस्थिरता को जीवंत रखता है।
theological_decisions:
- issue: प्रार्थना के संदर्भ में πίστις का अनुवाद
  choice: विश्वास
  alternative: भरोसा
  rationale: मुख्य पाठ में ‘विश्वास’ व्यापक बाइबलीय और धर्मवैचारिक निरंतरता बनाए रखता है, जबकि इस प्रसंग में परमेश्वर पर भरोसे के साथ निर्भर रहने की छाया भी उपस्थित है; उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: διακρινόμενος में संदेह और डाँवाडोल होने के बीच अर्थ-संबंध
  choice: संदेह करनेवाला
  alternative: डाँवाडोल होनेवाला
  rationale: निकट संदर्भ में परमेश्वर से माँगते समय संदेह मुख्य भाव है। समुद्री लहर का रूपक अस्थिरता और डाँवाडोल होने की संबंधित छाया को स्वयं सामने लाता है, इसलिए उसे मुख्य पाठ में अतिरिक्त व्याख्या बनाकर नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘तनिक भी’ पूर्ण निषेध को सहज ढंग से उभारता है। समुद्री लहर का रूपक संक्षिप्त रखा गया है और मूल के दोनों कर्मवाच्य कृदंत—हवा से चलाया जाना और उछाला जाना—अलग-अलग सुरक्षित हैं।
