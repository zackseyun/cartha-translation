  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: hi
  text: क्योंकि सूरज अपनी झुलसा देने वाली गर्मी[a] के साथ निकला और उसने घास को सुखा दिया; घास का फूल झड़ गया और उसकी बाहरी शोभा नष्ट हो गई। इसी तरह धनी मनुष्य भी अपनी गतिविधियों[b] में मुरझा जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झुलसा देने वाली लू के साथ’; यूनानी शब्द जलाने वाली गर्मी और कुछ संदर्भों में उससे जुड़ी गर्म हवा, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपनी यात्राओं में’; यूनानी शब्द का अर्थ वास्तविक यात्राएँ या व्यापक रूप से किसी के कार्य-व्यापार और गतिविधियाँ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: चढ़ा
  rationale: सूरज के उदय होने के लिए यह स्वाभाविक आधुनिक हिन्दी प्रयोग है और यूनानी भूतकालीन चित्रण को बनाए रखता है।
- source_word: σὺν τῷ καύσωνι
  choice: अपनी झुलसा देने वाली गर्मी के साथ
  rationale: καύσων जलाने वाली गर्मी अथवा उससे जुड़ी गर्म हवा का संकेत दे सकता है। मुख्य पाठ में सूर्य के संदर्भ में स्वाभाविक अर्थ लिया गया है और विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐξήρανεν τὸν χόρτον
  choice: घास को सुखा दिया
  rationale: यह गर्मी से वनस्पति के सूख जाने का ठोस चित्र स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: उसका फूल झड़ गया
  rationale: ἐκπίπτω के गिरने या अलग हो जाने के भौतिक चित्र को हिन्दी का सहज ‘झड़ गया’ ठीक से व्यक्त करता है।
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: उसके रूप की सुंदरता
  rationale: शाब्दिक ‘उसके मुख की शोभा’ वनस्पति के लिए कृत्रिम लगता; ‘रूप की सुंदरता’ πρόσωπον के बाहरी रूप और εὐπρέπεια की सुंदरता दोनों को सुरक्षित रखता है।
- source_word: ἀπώλετο
  choice: मिट गई
  rationale: यहाँ क्रिया उस सुंदरता के नष्ट होकर लुप्त हो जाने को बताती है; ‘मिट गई’ वर्तमान हिन्दी में स्पष्ट है।
- source_word: ὁ πλούσιος
  choice: धनी मनुष्य
  rationale: यूनानी एकवचन पुल्लिंग प्रतिनिधि व्यक्ति को दर्शाता है; यह चुनाव उसके रूप को बनाए रखते हुए चेतावनी को किसी विशिष्ट व्यक्ति तक सीमित नहीं करता।
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: अपने काम-काज के बीच
  rationale: πορείαις शाब्दिक यात्राओं के साथ-साथ जीवन की गतिविधियों या उद्यमों का अर्थ दे सकता है। संदर्भ में व्यापक गतिविधियाँ मुख्य पाठ में रखी गई हैं और शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: μαρανθήσεται
  choice: मुरझा जाएगा
  rationale: यह भविष्यकालीन कथन वनस्पति के रूपक और परिणाम की निश्चितता दोनों को बनाए रखता है।
theological_decisions:
- issue: ὁ πλούσιος में लिंगयुक्त एकवचन संदर्भ
  choice: धनी मनुष्य
  alternative: धनी व्यक्ति
  rationale: मूल का व्याकरणिक पुल्लिंग एक प्रतिनिधि व्यक्ति के रूप में रखा गया है; इससे चेतावनी का लागू होना केवल पुरुषों तक सीमित नहीं माना जाता।
- issue: πορείαις का अर्थ-क्षेत्र
  choice: काम-काज
  alternative: यात्राएँ
  rationale: यह शब्द वास्तविक यात्राओं या किसी के कार्य-व्यापार और जीवन-क्रम को सूचित कर सकता है। व्यापक संदर्भगत अर्थ मुख्य पाठ में है, जबकि वास्तविक भाषिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घास—फूल—मुरझाना’ का मूल रूपक लगातार बनाए रखा गया है। दोनों वास्तविक शब्दार्थगत विकल्प पादटिप्पणियों में दिए गए हैं और उनके संकेत मुख्य पाठ में संबंधित पदबंधों के तुरंत बाद रखे गए हैं।
