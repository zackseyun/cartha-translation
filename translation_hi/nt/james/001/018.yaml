source:
  edition: SBLGNT
  text: βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: hi
  text: अपनी इच्छा से उसने सत्य के वचन के द्वारा हमें जन्म दिया, ताकि हम उसकी रची हुई सृष्टि की एक प्रकार की पहली उपज[a] हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पहली उपज” कटनी के उस आरम्भिक भाग का बिंब है जो परमेश्वर को समर्पित किया जाता था; यहाँ विश्वासी परमेश्वर की रची हुई सृष्टि में आरम्भिक और समर्पित अंश के रूप में चित्रित हैं।
    reason: cultural_note
lexical_decisions:
- source_word: βουληθεὶς
  choice: अपनी इच्छा से
  rationale: यह रूप परमेश्वर की इच्छा को मुख्य क्रिया से पहले और उसके आधार के रूप में प्रस्तुत करता है। हिन्दी में यह स्वाभाविक है और किसी विशिष्ट धर्मवैज्ञानिक प्रणाली को जोड़े बिना परमेश्वर की पहल बनाए रखता है।
- source_word: ἀπεκύησεν
  choice: उसने ... हमें जन्म दिया
  rationale: क्रिया का जन्म देने का बिंब सुरक्षित रखा गया है; यह पद 15 में अभिलाषा के पाप को जन्म देने के बिंब से भी मेल खाता है।
- source_word: λόγῳ ἀληθείας
  choice: सत्य के वचन के द्वारा
  rationale: करणवाचक दत्तिव को 'के द्वारा' से व्यक्त किया गया है। 'सत्य का वचन' सच्चे सुसमाचार-संदेश की ओर संकेत करने वाला स्थापित बाइबलीय पदबंध है।
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: ताकि हम ... हों
  rationale: यह उद्देश्य अथवा लक्षित परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है और यूनानी रचना की प्रयोजनात्मक शक्ति बनाए रखता है।
- source_word: ἀπαρχήν
  choice: पहला फल
  rationale: यह कटनी के आरम्भिक और परमेश्वर को समर्पित अंश का बिंब बनाए रखता है; आधुनिक हिन्दी में 'पहला फल' अपेक्षाकृत सहज है।
- source_word: τινα
  choice: एक प्रकार का
  rationale: यह विधेय को कुछ सीमित या उपमात्मक बनाता है और τινα की सूक्ष्मता को संख्यात्मक अर्थ दिए बिना व्यक्त करता है।
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: उसकी सृष्ट की हुई वस्तुओं में
  rationale: बहुवचन κτισμάτων को व्यापक रखा गया है ताकि अर्थ केवल मनुष्यों तक सीमित न हो। 'में' हिन्दी में उस व्यापक समूह के बीच पहला फल होने का सम्बन्ध स्पष्ट करता है।
theological_decisions:
- issue: नए जन्म में परमेश्वर की पहल
  choice: '''अपनी इच्छा से'' परमेश्वर की इच्छा को जन्म देने की क्रिया का आधार बताता है।'
  alternative: '''इच्छा करके'' या ''क्योंकि उसने ऐसा चाहा'''
  rationale: यूनानी पाठ परमेश्वर की इच्छा और पहल पर बल देता है, पर किसी पूर्ण पूर्वनियति या पुनर्जन्म-सिद्धान्त को विस्तार से परिभाषित नहीं करता।
- issue: κτισμάτων का दायरा
  choice: '''उसकी सृष्ट की हुई वस्तुओं'' को व्यापक अर्थ में रखा गया है।'
  alternative: '''उसकी सारी सृष्टि'' या ''उसके बनाए हुए मनुष्यों'''
  rationale: बहुवचन संज्ञा सृष्ट प्राणियों अथवा वस्तुओं के व्यापक क्षेत्र की अनुमति देती है; इसे केवल मानवजाति तक सीमित करना पाठ से अधिक विशिष्ट होगा।
- issue: ἀπαρχή का सांस्कृतिक और धर्मवैज्ञानिक बिंब
  choice: मुख्य पाठ में 'पहला फल' और पादटिप्पणी में उसके आरम्भिक तथा समर्पित अंश का अर्थ स्पष्ट किया गया है।
  alternative: '''पहली उपज'' या ''प्रथम अर्पण'''
  rationale: '''पहला फल'' कटनी और समर्पण दोनों की प्रतिध्वनि बचाता है, जबकि पादटिप्पणी पाठक को रूपक समझने में सहायता देती है।'
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पाठ के लिए सहज रखी गई है। जन्म और कटनी के मूल बिंब सुरक्षित हैं।
