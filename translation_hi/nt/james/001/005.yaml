id: JAS.1.5
reference: James 1:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: hi
  text: पर यदि आप में से किसी को बुद्धि की कमी हो, तो वह परमेश्वर से माँगे, जो बिना उलाहना दिए सबको उदारता से देता है, और उसे दी जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ δέ
  choice: पर यदि
  rationale: δέ पिछले कथन से हल्का संबंध या मोड़ दिखाता है; ‘पर यदि’ इसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τις ὑμῶν
  choice: आप में से किसी को
  rationale: अनिश्चित τις और अंशसूचक ὑμῶν का स्वाभाविक हिन्दी रूप है और सीधा सामुदायिक संबोधन बनाए रखता है।
- source_word: λείπεται σοφίας
  choice: बुद्धि की कमी हो
  rationale: यह मुहावरेदार रूप किसी आवश्यक वस्तु के अभाव को बताता है; σοφία का व्यापक अर्थ ‘बुद्धि’ के रूप में सुरक्षित है।
- source_word: αἰτείτω παρὰ τοῦ ... θεοῦ
  choice: वह परमेश्वर से माँगे
  rationale: तीसरे पुरुष की आज्ञार्थकता और παρά के स्रोत-संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πᾶσιν ἁπλῶς
  choice: सबको उदारता से
  rationale: इस प्रसंग में ἁπλῶς निष्कपट और खुले हाथ से देने, अर्थात उदारता, का भाव रखता है; ‘सबको’ πᾶσιν की व्यापकता बनाए रखता है।
- source_word: μὴ ὀνειδίζοντος
  choice: बिना उलाहना दिए
  rationale: ὀνειδίζω यहाँ माँगने वाले को धिक्कारने, लज्जित करने या उसकी कमी जताने का भाव देता है; ‘उलाहना’ साधारण हिन्दी में इस आशय को संक्षेप में व्यक्त करता है।
- source_word: δοθήσεται αὐτῷ
  choice: उसे दी जाएगी
  rationale: भविष्यत् कर्मवाच्य प्रतिज्ञा को सीधे रखता है; स्त्रीलिंग ‘दी’ का अध्याहृत संदर्भ ‘बुद्धि’ है।
theological_decisions:
- issue: एकवचन प्रतिनिधिक भाषा
  choice: किसी को ... वह ... उसे
  alternative: जो कोई ... वे ... उन्हें
  rationale: यूनानी पाठ का अनिश्चित प्रतिनिधिक एकवचन हिन्दी में ‘किसी...वह...उसे’ द्वारा स्वाभाविक रूप से सुरक्षित रहता है और इसे अनावश्यक रूप से बहुवचन नहीं बनाया गया।
- issue: परमेश्वर के देने में ἁπλῶς का अर्थ
  choice: उदारता से
  alternative: सरलता से / निष्कपटता से
  rationale: माँगने वाले को बुद्धि देने के प्रसंग में मुख्य भाव खुले हाथ से, बिना रोक-टोक देना है। फिर भी इस शब्द में निष्कपट या एकनिष्ठ ढंग से देने की छाया संभव है; अनुवाद इसे किसी समृद्धि-सिद्धांत तक नहीं फैलाता।
- issue: μὴ ὀνειδίζοντος का भाव
  choice: बिना उलाहना दिए
  alternative: बिना दोष निकाले / बिना धिक्कारे
  rationale: वाक्य परमेश्वर को ऐसा दाता बताता है जो माँगने वाले को उसकी कमी के कारण लज्जित या तिरस्कृत नहीं करता। ‘उलाहना’ इस संबंधपरक भाव को सहज हिन्दी में रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरसूचक ‘आप’ के साथ प्रतिनिधिक एकवचन ‘वह/उसे’। वाक्य गरिमापूर्ण, स्पष्ट और बोलचाल से अत्यधिक दूर नहीं है। दिए गए अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों और उनकी सामग्री में असंगति है; मूल यूनानी को प्राथमिक मानते हुए अनावश्यक पादटिप्पणियाँ नहीं जोड़ी गईं।
