language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: hi
  text: इसलिए सारी अशुद्धता और बुराई की भरमार को उतार फेंककर, नम्रता से उस वचन को ग्रहण करो जो तुम्हारे भीतर रोपा गया है[c] और जो तुम्हारे प्राणों को बचाने में समर्थ है[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: या “जन्मजात वचन”; परंपरागत रूप से, “कलम लगाया हुआ वचन।”
    reason: lexical_alternative
  - marker: d
    text: या “तुम्हारे जीवनों को” अथवा “स्वयं तुम्हें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले निष्कर्ष को स्वाभाविक और स्पष्ट रूप से जोड़ता है।
- source_word: ἀποθέμενοι
  choice: उतार फेंककर
  rationale: वस्त्र उतारने के रूपक और मुख्य आज्ञा के साथ जुड़ी सहभागी क्रिया—दोनों को बनाए रखता है।
- source_word: πᾶσαν ῥυπαρίαν
  choice: सारी अशुद्धता
  rationale: नैतिक गंदगी का अर्थ देता है और आधुनिक हिन्दी में गरिमापूर्ण तथा सहज है।
- source_word: περισσείαν κακίας
  choice: बुराई की भरमार
  rationale: περισσεία की अधिकता और κακία के व्यापक नैतिक अर्थ को सुरक्षित रखता है; इसे संकीर्ण अर्थ ‘द्वेष’ तक सीमित नहीं करता।
- source_word: ἐν πραΰτητι
  choice: नम्रता से
  rationale: यहाँ πραΰτης में कोमलता के साथ विनीत, सीखने को तैयार मनोभाव निहित है; ‘नम्रता’ आधुनिक हिन्दी में सबसे स्वाभाविक है।
- source_word: δέξασθε
  choice: ग्रहण करो
  rationale: आज्ञार्थक बल को बनाए रखते हुए वचन को स्वीकार करने का सक्रिय भाव व्यक्त करता है।
- source_word: τὸν ἔμφυτον λόγον
  choice: उस वचन को ... जो तुम्हारे भीतर रोपा गया है
  rationale: ἔμφυτος की ‘भीतर रोपे गए’ होने की छवि स्पष्ट करता है, पर यह निर्धारित नहीं करता कि रोपना कब या किस रीति से हुआ।
- source_word: τὸν δυνάμενον σῶσαι
  choice: जो ... बचाने में समर्थ है
  rationale: वचन की सामर्थ्य को व्यक्त करता है, बिना उद्धार की प्रक्रिया के बारे में अतिरिक्त व्याख्या जोड़े।
- source_word: τὰς ψυχὰς ὑμῶν
  choice: तुम्हारे प्राणों
  rationale: ψυχή के व्यक्ति, जीवन या प्राण के अर्थ-क्षेत्र और उद्धार-संबंधी गंभीरता को बनाए रखता है; केवल देह से अलग किसी भाग का अर्थ अनिवार्य नहीं करता।
theological_decisions:
- issue: τὰς ψυχὰς ὑμῶν का उद्धार-संदर्भ में अर्थ
  choice: तुम्हारे प्राणों
  alternative: तुम्हारे जीवनों; स्वयं तुम्हें
  rationale: ‘प्राणों’ पारंपरिक धार्मिक वजन को रखता है, जबकि पादटिप्पणी यह स्पष्ट करती है कि यूनानी पद पूरे व्यक्ति या जीवन को भी सूचित कर सकता है।
- issue: ἔμφυτον λόγον का आशय
  choice: वचन ... जो तुम्हारे भीतर रोपा गया है
  alternative: जन्मजात वचन; कलम लगाया हुआ वचन
  rationale: यह अनुवाद भीतर स्थापित वचन की छवि बनाए रखता है और उसके रोपे जाने की विधि या समय को धर्मवैज्ञानिक रूप से निश्चित नहीं करता।
- issue: वचन की उद्धार करने की सामर्थ्य
  choice: बचाने में समर्थ है
  alternative: बचा सकता है
  rationale: मूल के δύναμαι को निकटता से व्यक्त करता है और वचन की सामर्थ्य स्वीकार करता है, पर उद्धार के साधन या क्रम पर अतिरिक्त दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष उपदेशात्मक शैली। ‘उतार फेंककर’ मूल के रूपक को जीवंत रखता है; ‘भरमार’ अधिकता को सामान्य पाठक के लिए सहज बनाता है। केवल उन्हीं पादटिप्पणियों को रखा गया है जहाँ चुने गए हिन्दी रूप में वास्तविक अर्थगत विकल्प उल्लेखनीय है।
