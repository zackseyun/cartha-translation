  text: ὁ δὲ πλούσιος ἐν τῇ ταπεινώσει αὐτοῦ, ὅτι ὡς ἄνθος χόρτου παρελεύσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/010.yaml
  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: hi
  text: परन्तु धनी अपनी दीन दशा पर गर्व करे[a], क्योंकि वह घास के फूल के समान मिट जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘गर्व करे’ क्रिया पिछले पद से निहित है; हिंदी में वाक्य को स्वाभाविक बनाने के लिए उसे स्पष्ट किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: और धनी
  rationale: δέ पिछले पद के समानांतर कथन को जोड़ता है; इसलिए सहज संयोजक ‘और’ रखा गया है। πλούσιος यहाँ संज्ञा के रूप में प्रयुक्त है, और ‘धनी’ हिंदी में व्यक्ति का बोध स्वाभाविक रूप से करा देता है।
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: अपनी दीन दशा पर
  rationale: ταπείνωσις नीचा किए जाने, प्रतिष्ठा घटने या निम्न दशा का बोध करा सकता है। ‘दीन दशा’ केवल विनम्र स्वभाव नहीं, बल्कि धनी की घटती हुई स्थिति को व्यक्त करती है; ‘पर’ पिछले पद से निहित ‘गर्व करे’ के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह धनी की दीन दशा पर गर्व करने का कारण प्रस्तुत करने वाली स्पष्ट कारणसूचक अभिव्यक्ति है।
- source_word: ὡς ἄνθος χόρτου
  choice: घास के फूल के समान
  rationale: यह यूनानी रूपक की संरचना और क्षणभंगुर वनस्पति की बाइबलीय छवि को सुरक्षित रखता है; ‘जंगली फूल’ अधिक सहज होता, पर मूल से अधिक व्याख्यात्मक है।
- source_word: παρελεύσεται
  choice: मिट जाएगा
  rationale: संदर्भ में क्रिया स्थानिक रूप से ‘गुज़रने’ के बजाय जीवन और वैभव के लुप्त हो जाने को दर्शाती है। ‘मिट जाएगा’ हिंदी में इस क्षणभंगुरता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: पिछले पद से निहित क्रिया
  choice: मुख्य पाठ में निहित ‘गर्व करे’ को जोड़े बिना यूनानी वाक्य की अपूर्ण संरचना सुरक्षित रखी गई है।
  alternative: ‘परन्तु धनी अपनी दीन दशा पर गर्व करे’ कहकर पिछले पद की क्रिया स्पष्ट रूप से जोड़ना।
  rationale: याकूब 1:10 वाक्य-विन्यास की दृष्टि से पद 9 की आज्ञा पर निर्भर है। क्रिया जोड़ने से हिंदी अधिक पूर्ण होती, पर इस पद में अनुपस्थित शब्द मुख्य पाठ में आ जाते; पादटिप्पणी संबंध स्पष्ट करती है।
- issue: धनी की ‘दीन दशा’ का आशय
  choice: इसे धनी के नीचा किए जाने अथवा उसकी प्रतिष्ठा और जीवन की क्षणभंगुरता से जुड़ी दशा के रूप में खुला रखा गया है।
  alternative: इसे केवल स्वेच्छिक नम्रता अथवा केवल निम्न सामाजिक स्थिति मानना।
  rationale: आगे दिया गया कारण—घास के फूल की तरह मिट जाना—धन, प्रतिष्ठा और जीवन की अस्थिरता की ओर संकेत करता है। अनुवाद किसी एक विस्तृत धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सरल रूप अपनाया गया है। पद 9 पर निर्भर मूल यूनानी वाक्य की अपूर्णता जानबूझकर रखी गई है और पादटिप्पणी में स्पष्ट की गई है।
