source:
  edition: SBLGNT
  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: hi
  text: परन्तु जो पूर्ण व्यवस्था, अर्थात् स्वतंत्रता की व्यवस्था, में ध्यान से झाँकता है और उसमें बना रहता है, और सुनकर भूल जाने वाला नहीं बल्कि कार्य करने वाला होता है,[a] वही अपने कार्य में धन्य होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘कार्य का कर्ता’; अंतिम पद का अनुवाद ‘वह जो करता है, उसमें धन्य होगा’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: ध्यान से झाँकता है
  rationale: क्रिया में झुककर या निकट से ध्यानपूर्वक देखने का चित्र निहित है। ‘ध्यान से झाँकता है’ इस सजीव अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: सिद्ध व्यवस्था—स्वतंत्रता की व्यवस्था
  rationale: ‘सिद्ध’ τέλειον को अनावश्यक व्याख्या के बिना व्यक्त करता है। पुनरुक्त ‘व्यवस्था’ यूनानी समानाधिकरण को स्पष्ट रखती है और ‘स्वतंत्रता’ आधुनिक हिन्दी में सहज है।
- source_word: παραμείνας
  choice: उसमें बना रहता है
  rationale: यह व्यवस्था के साथ निरंतर बने रहने और लगे रहने का भाव देता है; केवल एक क्षणिक दृष्टि का नहीं।
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: भूलने वाला सुनने वाला नहीं ... बनता है
  rationale: यूनानी संबंधकारक का आशय स्वाभाविक हिन्दी में ‘भूलने वाला’ से व्यक्त होता है, जबकि γενόμενος का ‘बनता है’ भी बना रहता है।
- source_word: ποιητὴς ἔργου
  choice: काम करने वाला
  rationale: ἔργον को स्पष्ट रखते हुए यह अस्वाभाविक शाब्दिक वाक्यांश ‘काम का कर्ता’ से बचता है और सुनने तथा करने का विरोध बनाए रखता है।
- source_word: μακάριος
  choice: धन्य
  rationale: ‘धन्य’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक है और केवल भावनात्मक ‘खुश’ की अपेक्षा ईश्वरीय अनुग्रह का व्यापक संकेत बनाए रखता है।
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: अपने करने में
  rationale: यह ποίησις की संज्ञात्मकता को बनाए रखता और पहले आए ‘करने वाला’ से शब्दगत संबंध जोड़ता है।
- source_word: ὁ ... οὗτος
  choice: जो ... वही
  rationale: यह प्रतिनिधिक एकवचन को स्वाभाविक, लिंग-समावेशी हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘स्वतंत्रता की व्यवस्था’ का अर्थ
  choice: वाक्यांश को ‘स्वतंत्रता की व्यवस्था’ ही रखा गया है।
  alternative: ‘स्वतंत्रता देने वाली व्यवस्था’ या इसे विशेष रूप से सुसमाचार अथवा नैतिक व्यवस्था बताना
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि संबंधकारक का अर्थ केवल स्रोत, गुण या परिणाम में से कौन-सा है। अतः धर्मवैज्ञानिक तनाव को अनिर्णीत रखा गया है।
- issue: सिद्ध व्यवस्था और स्वतंत्रता की व्यवस्था का संबंध
  choice: 'डैश के द्वारा समानाधिकरण दिखाया गया है: दोनों पद एक ही व्यवस्था का वर्णन करते हैं।'
  alternative: ‘स्वतंत्रता की सिद्ध व्यवस्था’
  rationale: वैकल्पिक रूप व्याकरणतः संभव है, पर पुनरुक्त ‘व्यवस्था’ यूनानी τὸν τῆς ἐλευθερίας की व्याख्यात्मक समानाधिकरणीय शक्ति अधिक स्पष्ट रखती है।
- issue: प्रतिनिधिक पुल्लिंग एकवचन
  choice: ‘जो ... वही’
  alternative: ‘वह मनुष्य’ या पुरुषवाचक सर्वनाम
  rationale: संदर्भ पुरुषों तक सीमित नहीं है; हिन्दी का ‘जो ... वही’ एकवचन और सार्वत्रिक प्रयोग दोनों को सहजता से रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘व्यवस्था’ को νόμος के लिए चुना गया है, क्योंकि यहाँ ईश्वरीय निर्देश/व्यवस्था का अर्थ है, केवल विधिक ‘कानून’ नहीं। डैश समानाधिकरण को स्पष्ट करते हैं।
