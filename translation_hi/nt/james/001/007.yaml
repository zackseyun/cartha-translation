    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γὰρ
  choice: क्योंकि ... न समझे
  rationale: γάρ पिछले पद में वर्णित संदेह करने वाले व्यक्ति के बारे में इस चेतावनी का कारण बताता है; इसलिए ‘क्योंकि’ संबंध को स्पष्ट रखता है। μή के साथ तृतीय पुरुष की आज्ञार्थक अभिव्यक्ति को हिंदी में स्वाभाविक निषेध ‘न समझे’ से व्यक्त किया गया है।
- source_word: οἰέσθω
  choice: समझे
  rationale: οἴομαι का अर्थ यहाँ मन में मानना या अनुमान करना है। ‘समझे’ चेतावनी के लहजे में स्वाभाविक है और परिणाम की ‘आशा रखने’ वाली व्याख्या को समय से पहले पाठ में नहीं जोड़ता।
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: वह मनुष्य
  rationale: यह पदबंध व्याकरण की दृष्टि से पुल्लिंग एकवचन है और पिछले पद में वर्णित संदेह करने वाले व्यक्ति की ओर संकेत करता है। ‘वह मनुष्य’ स्रोत के रूप और निर्देशात्मक बल को बनाए रखता है; उसके प्रतिनिधिक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ὅτι
  choice: कि
  rationale: यह उस विचार की विषय-वस्तु का परिचय देता है जिसे उस मनुष्य को नहीं मानना चाहिए; हिंदी में ‘कि’ इसका सीधा और स्वाभाविक रूप है।
- source_word: λήμψεταί
  choice: उसे ... मिलेगा
  rationale: λαμβάνω के भविष्यकाल का संदर्भानुकूल हिंदी रूप ‘मिलेगा’ है। हिंदी में ‘वह प्राप्त करेगा’ की अपेक्षा ‘उसे ... मिलेगा’ अधिक सहज है और भावी प्राप्ति का अर्थ सुरक्षित रखता है।
- source_word: τι
  choice: कुछ भी
  rationale: निषेधात्मक संदर्भ में τι का व्यापक अर्थ ‘कुछ भी’ है, अर्थात किसी वस्तु की प्राप्ति मान लेने का निषेध।
- source_word: παρὰ τοῦ κυρίου
  choice: प्रभु से
  rationale: संबंधकारक के साथ παρά स्रोत को दर्शाता है, इसलिए ‘से’ उपयुक्त है। κύριος को अधिक स्पष्ट रूप से ‘परमेश्वर’ या किसी अन्य पहचान में बदले बिना ‘प्रभु’ रखा गया है।
theological_decisions:
- issue: τοῦ κυρίου में ‘प्रभु’ का अभिप्रेत व्यक्ति
  choice: प्रभु
  alternative: परमेश्वर / प्रभु परमेश्वर
  rationale: यूनानी पाठ केवल κύριος कहता है। ‘प्रभु’ पाठ की अभिव्यक्ति और उसकी संभावित संदर्भगत व्यापकता को बनाए रखता है तथा उससे अधिक स्पष्ट पहचान नहीं जोड़ता।
- issue: ὁ ἄνθρωπος ἐκεῖνος का लिंग और प्रतिनिधिक प्रयोग
  choice: वह मनुष्य
  alternative: वह व्यक्ति
  rationale: यूनानी पदबंध पुल्लिंग एकवचन है, इसलिए मुख्य पाठ में उसका रूप सुरक्षित रखा गया है। साथ ही, संदर्भ में यह किसी भी संदेह करने वाले व्यक्ति का प्रतिनिधि है, जिसे पादटिप्पणी स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘न समझे’ ने यूनानी निषेधात्मक आज्ञा का बल रखा है, जबकि ‘उसे ... मिलेगा’ स्वाभाविक हिंदी वाक्य-विन्यास देता है।
