  text: Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ⸂ἀκροαταὶ μόνον⸃ παραλογιζόμενοι ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: hi
  text: पर वचन पर चलनेवाले बनो, केवल सुननेवाले नहीं, और अपने आप को धोखा मत दो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने आप को भ्रम में मत डालो’ अथवा ‘गलत तर्क से अपने आप को भटकाओ मत।’
    reason: παραλογιζόμενοι के आत्म-छल के साथ गलत तर्क द्वारा भ्रमित होने की अर्थ-छाया को दर्शाता है; चिह्न संबंधित शब्द पर रखा गया है।
lexical_decisions:
- source_word: Γίνεσθε
  choice: बनो
  rationale: वर्तमानकालीन आज्ञार्थक रूप निरंतर आचरण की पुकार देता है। ‘बनो’ स्वाभाविक हिंदी में आज्ञा का बल रखता है और ‘हो जाओ’ की अपेक्षा केवल एक बार के परिवर्तन का अर्थ कम देता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन से हल्का विरोध या आगे की निर्णायक बात दिखाता है; ‘पर’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: ποιηταὶ λόγου
  choice: वचन पर चलनेवाले
  rationale: शाब्दिक ‘वचन के करनेवाले’ हिंदी में अस्वाभाविक है। ‘वचन पर चलनेवाले’ उस अर्थ को स्पष्ट करता है कि सुनाए गए वचन के अनुसार आचरण करना है, साथ ही λόγος के लिए ‘वचन’ बनाए रखता है।
- source_word: ἀκροαταὶ μόνον
  choice: केवल सुननेवाले
  rationale: संज्ञात्मक समानांतरता और μόνον की सीमित करने वाली शक्ति दोनों सुरक्षित रहती हैं।
- source_word: παραλογιζόμενοι
  choice: धोखा देते हैं
  rationale: कृदंत का आशय आत्म-छल है, जिसमें गलत तर्क से स्वयं को भ्रमित करने की छाया भी है। मुख्य पाठ में ‘धोखा देते हैं’ स्पष्ट और सहज है।
- source_word: ἑαυτούς
  choice: अपने आप को
  rationale: बहुवचन संबोधन के साथ प्रत्यक्ष आत्मवाचक कर्म को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: याकूब 1:22 में λόγος का अर्थ
  choice: वचन
  alternative: संदेश; शिक्षा
  rationale: निकटवर्ती संदर्भ में ‘रोपा गया वचन’ (1:21) से संबंध बनाए रखते हुए यह परमेश्वर से प्राप्त संदेश की बाइबलीय गूँज सुरक्षित रखता है, पर अर्थ को किसी संकीर्ण पारिभाषिक सिद्धांत तक सीमित नहीं करता।
- issue: Γίνεσθε का बल
  choice: निरंतर वचन पर चलनेवाले बनो
  alternative: एक आरंभिक परिवर्तन के अर्थ में ‘हो जाओ’
  rationale: वर्तमान आज्ञार्थक रूप जीवन के जारी रहने वाले ढंग की ओर स्वाभाविक रूप से संकेत करता है; हिंदी ‘बनो’ इसे बिना अनावश्यक व्याख्या के व्यक्त करता है।
- issue: παραλογιζόμενοι की अर्थ-छाया
  choice: अपने आप को धोखा देते हैं
  alternative: अपने आप को भ्रम में डालते हैं; गलत तर्क करके अपने आप को भटकाते हैं
  rationale: मुख्य अर्थ आत्म-छल है। यूनानी शब्द में गलत हिसाब या कुतर्क द्वारा गलत निष्कर्ष पर पहुँचने की छाया है, लेकिन उसे मुख्य पाठ में पूरा खोलना अनावश्यक व्याख्या होता।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘करनेवाले/सुननेवाले’ की तुलना को हिंदी में स्वाभाविक बनाने के लिए ‘वचन पर चलनेवाले’ चुना गया है। कोई पादटिप्पणी नहीं दी गई, क्योंकि उपलब्ध अंग्रेज़ी पादटिप्पणी का वास्तविक संबंध παραλογιζόμενοι से प्रतीत होता है, जबकि उसका चिह्न ‘word’ के बाद रखा गया है; गलत चिह्नांकन को हिंदी पाठ में नहीं दोहराया गया।
