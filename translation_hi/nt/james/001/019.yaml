id: JAS.1.19
reference: James 1:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀Ἴστε, ἀδελφοί μου ἀγαπητοί. ἔστω ⸀δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: hi
  text: 'यह जान लो[a], मेरे प्रिय भाइयो[b]: हर व्यक्ति सुनने में तत्पर, बोलने में धीमा और क्रोध करने में धीमा हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे प्रिय भाइयो, तुम यह जानते हो।” यूनानी क्रिया को आज्ञा के बजाय कथन के रूप में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: अर्थात विश्वास करने वाले भाई और बहनें; यूनानी में शब्दशः “भाइयो” है, पर यह संबोधन संभवतः पूरे विश्वासी समुदाय के लिए है।
    reason: audience_clarification
lexical_decisions:
- source_word: Ἴστε
  choice: यह जान लो
  rationale: यह रूप आज्ञार्थक या निश्चयार्थक—दोनों समझा जा सकता है। आगे आने वाले उपदेशों के प्रवाह में आज्ञार्थक अनुवाद स्वाभाविक है; निश्चयार्थक संभावना पाद-टिप्पणी में रखी गई है।
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: मेरे प्रिय भाइयो
  rationale: यह यूनानी संबोधन व्याकरणतः पुल्लिंग बहुवचन है और विश्वासी समुदाय को संबोधित करता है। ‘प्रिय’ ἀγαπητοί के स्नेहपूर्ण भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔστω δὲ πᾶς ἄνθρωπος
  choice: हर व्यक्ति … हो
  rationale: ἔστω तीसरे पुरुष की आज्ञा है, जिसे हिन्दी में ‘… हो’ स्वाभाविक रूप से व्यक्त करता है। πᾶς ἄνθρωπος का यहाँ सामान्य मानवीय अर्थ है, इसलिए ‘हर व्यक्ति’ स्पष्ट और समावेशी है। δέ हल्का संयोजक है और हिन्दी में विराम तथा वाक्य-क्रम से पर्याप्त रूप से व्यक्त होता है।
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: सुनने में तत्पर
  rationale: ‘तत्पर’ तत्क्षण तैयार रहने की भावना देता है और ‘सुनने में’ यूनानी रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: बोलने में धीमा
  rationale: यह सीधा, सुबोध और समानांतर अनुवाद है, जो विचारपूर्वक बोलने की उपदेशात्मक धार को बनाए रखता है।
- source_word: βραδὺς εἰς ὀργήν
  choice: क्रोध करने में धीमा
  rationale: यह यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और क्रोध में शीघ्र न पड़ने का आशय व्यक्त करता है, बिना ὀργή को किसी अधिक विशिष्ट धार्मिक अर्थ तक सीमित किए।
theological_decisions:
- issue: संबोधन और सामान्य मानवीय निर्देश में लिंग
  choice: संबोधन में ‘भाइयो’ रखा गया और πᾶς ἄνθρωπος को ‘हर व्यक्ति’ किया गया।
  alternative: ‘प्रिय भाई-बहनो’ तथा ‘हर मनुष्य’
  rationale: ἀδελφοί व्याकरणतः पुल्लिंग है, इसलिए उसका रूप मुख्य पाठ में सुरक्षित है, जबकि संभावित मिश्रित समुदाय का आशय पाद-टिप्पणी में स्पष्ट है। ἄνθρωπος यहाँ किसी पुरुष-विशेष के बजाय प्रत्येक मनुष्य के लिए सामान्य रूप से प्रयुक्त है; ‘हर व्यक्ति’ आधुनिक हिन्दी में वही व्यापक आशय स्पष्ट करता है।
- issue: Ἴστε का वाच्यार्थ
  choice: 'आज्ञार्थक: ‘यह जान लो’'
  alternative: 'निश्चयार्थक: ‘तुम यह जानते हो’'
  rationale: रूप दोनों प्रकार समझा जा सकता है। आज्ञार्थक अर्थ आगे के उपदेश के साथ सुचारु है, पर निश्चयार्थक अर्थ भी व्याकरणतः वास्तविक संभावना है और पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सुनने में तत्पर, बोलने में धीमा और क्रोध करने में धीमा’ की समानांतर रचना मूल के उपदेशात्मक लय और क्रम को बनाए रखती है।
