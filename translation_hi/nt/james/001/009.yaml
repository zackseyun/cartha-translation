  yaml_path: translation/nt/james/001/009.yaml
  text: But let the lowly brother boast in his exaltation[b][a],
translation:
  language: hi
  text: पर दीन भाई[a] अपनी ऊँची स्थिति पर गर्व करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नीची दशा वाला भाई या बहन।” यूनानी में पुल्लिंग एकवचन “भाई” है, जो यहाँ किसी भी सहविश्वासी का प्रतिनिधि हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καυχάσθω
  choice: गर्व करे
  rationale: वर्तमानकालीन आज्ञार्थक रूप उपदेश या प्रोत्साहन व्यक्त करता है। ‘गर्व करे’ καυχάομαι की मूल अर्थ-शक्ति को बनाए रखता है; प्रसंग स्पष्ट करता है कि यह आत्म-बड़ाई नहीं, बल्कि परमेश्वर से मिले सम्मान पर गर्व है।
- source_word: δὲ
  choice: पर
  rationale: δέ यहाँ हल्का विरोध या विषयांतर दिखाता है और पद 9–10 में दीन तथा धनवान के बीच रखे गए विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ ἀδελφὸς
  choice: भाई
  rationale: यूनानी शब्द पुल्लिंग एकवचन है और याकूब की पत्री में प्रायः मसीही समुदाय के एक सहविश्वासी को दर्शाता है। मूल रूप को मुख्य पाठ में रखा गया है; उसके प्रतिनिधिक प्रयोग को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ὁ ταπεινὸς
  choice: दीन
  rationale: ταπεινός नम्रता के साथ-साथ नीची सामाजिक या आर्थिक दशा का बोध दे सकता है। ‘दीन’ धनवान के साथ आगामी विरोध को बनाए रखते हुए केवल गरीबी या केवल भीतरी नम्रता तक अर्थ को सीमित नहीं करता।
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: अपने ऊँचे किए जाने पर
  rationale: ὕψος ऊँचाई या ऊँचे स्थान/सम्मान को दर्शाता है। यह चयन दीन विश्वासी को मिले ऊँचे सम्मान और उलटाव के भाव को व्यक्त करता है, पर उसे केवल वर्तमान सामाजिक उन्नति या केवल भावी महिमा तक सीमित नहीं करता।
theological_decisions:
- issue: दीन विश्वासी के ‘ऊँचे किए जाने’ का अर्थ
  choice: इसे परमेश्वर के सामने मिले ऊँचे स्थान या सम्मान के रूप में व्यापक रखा गया है, जिसमें वर्तमान और भावी उलटाव दोनों की संभावना बनी रहती है।
  alternative: इसे केवल वर्तमान सामाजिक उन्नति, केवल आत्मिक प्रतिष्ठा, या केवल भावी युगांतकालीन महिमा मानना।
  rationale: पद 9–10 दीन और धनवान को आमने-सामने रखते हैं और परिस्थिति के उलटाव का संकेत देते हैं। अनुवाद किसी एक संकीर्ण धर्मवैज्ञानिक व्याख्या को निश्चित नहीं करता।
- issue: ἀδελφός का लिंग-संबंधी निरूपण
  choice: मुख्य पाठ में पुल्लिंग एकवचन ‘भाई’ रखा गया है और उसके संभावित प्रतिनिधिक अर्थ को पादटिप्पणी में बताया गया है।
  alternative: ‘भाई या बहन’ अथवा ‘सहविश्वासी’।
  rationale: यह मूल यूनानी के व्याकरणिक लिंग और वचन को सुरक्षित रखता है, साथ ही प्रसंग में स्त्री-पुरुष दोनों विश्वासियों पर लागू होने की संभावना को छिपाता नहीं।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘दीन’ सामाजिक नीचता और नम्रता की अर्थ-छायाओं को साथ रखता है। ‘गर्व करे’ को प्रसंग सकारात्मक रूप देता है, जबकि ‘अपने ऊँचे किए जाने’ में निहित धर्मवैज्ञानिक तनाव को जानबूझकर खुला रखा गया है।
