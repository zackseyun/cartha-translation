translation:
  language: hi
  text: 'वह दुचित्ता मनुष्य[a] अपने सभी मार्गों में अस्थिर है।


    [a] या, “दुचित्ता व्यक्ति, जो अपने सभी मार्गों में अस्थिर है।” यूनानी में पुल्लिंग एकवचन है, पर यहाँ उसका आशय सम्भवतः सामान्य रूप से किसी भी व्यक्ति से है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुचित्ता व्यक्ति, जो अपने सभी मार्गों में अस्थिर है।” यूनानी में पुल्लिंग एकवचन है, पर यहाँ उसका आशय सम्भवतः सामान्य रूप से किसी भी व्यक्ति से है।
    reason: शाब्दिक विकल्प और प्रतिनिधिक पुल्लिंग का स्पष्टीकरण
lexical_decisions:
- source_word: ἀνὴρ
  choice: मनुष्य
  rationale: यह शब्द यूनानी में पुल्लिंग एकवचन है और पिछले पद के प्रार्थना करने वाले व्यक्ति की ओर संकेत करता है। ‘मनुष्य’ मूल के व्याकरणिक रूप और उसके प्रतिनिधिक आशय—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δίψυχος
  choice: दुचित्ता
  rationale: इस दुर्लभ विशेषण का शाब्दिक बोध ‘दो मन/प्राण वाला’ है। ‘दुचित्ता’ आन्तरिक बँटाव, डाँवाडोल निष्ठा और अनिर्णय को संक्षिप्त तथा स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀκατάστατος
  choice: अस्थिर
  rationale: यहाँ शब्द व्यक्ति के जीवन-व्यवहार में स्थिरता और भरोसेमन्द निरन्तरता के अभाव को बताता है। ‘अस्थिर’ इस अर्थ को ‘अव्यवस्थित’ जैसे अधिक सामाजिक या नैतिक अर्थ जोड़े बिना व्यक्त करता है।
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: अपने सभी मार्गों में
  rationale: ‘मार्ग’ ὁδός के रूपकात्मक अर्थ को सुरक्षित रखता है और व्यक्ति के समूचे जीवन-ढंग तथा आचरण की ओर संकेत करता है।
theological_decisions:
- issue: प्रतिनिधिक पुल्लिंग भाषा
  choice: मुख्य पाठ में ‘मनुष्य’ रखा गया
  alternative: ‘व्यक्ति’
  rationale: यूनानी पाठ पुल्लिंग एकवचन का प्रयोग करता है, पर सन्दर्भ में बात केवल पुरुषों तक सीमित नहीं है। मुख्य पाठ मूल रूप को बनाए रखता है और पादटिप्पणी उसके सामान्य, प्रतिनिधिक आशय को स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘दुचित्ता’ बाइबलीय भाव को संक्षेप में व्यक्त करता है; शेष वाक्य सरल रखा गया है।
