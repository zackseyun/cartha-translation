  yaml_path: translation/nt/james/001/020.yaml
  text: For a man's anger does not produce God's righteousness.
translation:
  language: hi
  text: क्योंकि मनुष्य का क्रोध परमेश्वर की धार्मिकता उत्पन्न नहीं करता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ ἀνδρός
  choice: मनुष्य का क्रोध
  rationale: यह वाक्यांश सामान्य मानवीय क्रोध को दर्शाता है; ‘मनुष्य’ यहाँ केवल पुरुष तक सीमित नहीं है।
- source_word: δικαιοσύνην θεοῦ
  choice: परमेश्वर की धार्मिकता
  rationale: संबंधकारक पदबंध की वास्तविक व्यापकता और संभावित अर्थगत तनाव को बनाए रखता है—परमेश्वर के धर्मी मानक, उनके द्वारा चाहा गया धर्मी आचरण, या उनसे संबंधित धार्मिकता।
- source_word: οὐκ ἐργάζεται
  choice: उत्पन्न नहीं करता
  rationale: क्रोध के परिणाम या फल के अर्थ को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: पिछले कथन के कारण या आधार को स्पष्ट रूप से जोड़ता है।
theological_decisions:
- issue: ‘परमेश्वर की धार्मिकता’ का आशय
  choice: परमेश्वर की धार्मिकता
  alternative: वह धार्मिकता जो परमेश्वर चाहता है
  rationale: मूल यूनानी संबंधकारक की बहुअर्थकता को किसी एक व्याख्या में सीमित किए बिना सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य संक्षिप्त रखा गया है और मूल पाठ के कारणसूचक संबंध तथा धार्मिकता-संबंधी अर्थगत व्यापकता को बनाए रखता है।
