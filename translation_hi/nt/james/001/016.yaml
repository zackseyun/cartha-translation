  yaml_path: translation/nt/james/001/016.yaml
  text: Do not be deceived[a], my beloved brothers.
translation:
  language: hi
  text: मेरे प्रिय भाइयो[a], धोखे में न पड़ो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाइयो और बहनो’; यूनानी शब्द ‘भाइयो’ सामूहिक रूप से स्त्री-पुरुष दोनों विश्वासियों को संबोधित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: न
  rationale: वर्तमान आज्ञार्थक के साथ μή निषेध व्यक्त करता है। हिंदी में ‘न खाओ’ स्वाभाविक और स्पष्ट निषेधात्मक आज्ञा है; इससे ऐसा कोई अतिरिक्त पक्षगत अर्थ नहीं जुड़ता जिसे संदर्भ निश्चित न करता हो।
- source_word: πλανᾶσθε
  choice: धोखा खाओ
  rationale: यहाँ πλανάω का मध्य/कर्मवाच्य रूप गलत धारणा में पड़ने या बहकाए जाने से सावधान करता है। ‘धोखा न खाओ’ प्रचलित हिंदी है और संदर्भ में बौद्धिक/आत्मिक भ्रम की चेतावनी को संक्षेप में व्यक्त करता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: संबोधन बहुवचन ἀδελφοί का प्रत्यक्ष अर्थ ‘भाइयो’ है। यह मसीही समुदाय के स्त्री-पुरुष सभी सदस्यों को सामूहिक रूप से संबोधित कर सकता है; इस समावेशी आशय को पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: μου
  choice: मेरे
  rationale: संबंध और आत्मीयता व्यक्त करने वाले μου का सीधा हिंदी रूप ‘मेरे’ है।
- source_word: ἀγαπητοί
  choice: प्रिय
  rationale: ἀγαπητοί स्नेहपूर्ण संबोधन है। आधुनिक मानक हिंदी में ‘प्रिय’ स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सहज है; ‘प्रियो’ के बजाय ‘प्रिय भाइयो’ हिंदी शब्दक्रम में अधिक स्वाभाविक है।
theological_decisions:
- issue: मसीही श्रोताओं के लिए लिंग-सूचक संबोधन
  choice: मुख्य पाठ में ἀδελφοί को ‘भाइयो’ रखा गया और उसके सामूहिक, समावेशी आशय को पाद-टिप्पणी में बताया गया।
  alternative: ‘भाइयो और बहनो’
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है, पर मिश्रित विश्वासी समुदाय को सामूहिक रूप से संबोधित कर सकता है। मुख्य पाठ स्रोत की अभिव्यक्ति को बनाए रखता है, जबकि पाद-टिप्पणी आधुनिक पाठक के लिए उसके संभावित समावेशी संदर्भ को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी का संक्षिप्त, आत्मीय और गरिमापूर्ण संबोधन। यूनानी में निषेध पहले आता है, किंतु हिंदी में ‘मेरे प्रिय भाइयो’ को पहले रखने से वाक्य अधिक स्वाभाविक सुनाई देता है और अर्थ अपरिवर्तित रहता है।
