- from: फिर अभिलाषा गर्भ धारण करके पाप को जन्म देती है; और पाप जब पूरी तरह बढ़ जाता है[a], तो मृत्यु को जन्म देता है।
  to: फिर बुरी इच्छा गर्भ धारण करके पाप को जन्म देती है; और पाप, जब पूर्ण परिपक्व हो जाता है[a], तो मृत्यु को जन्म देता है।
  rationale: 'The revision retains the Greek’s personified reproductive sequence: wrongful desire conceives and gives birth to sin; sin, on reaching completion/maturity, gives birth to death. It improves the contextual sense of ἐπιθυμία and the precision of ἀποτελεσθεῖσα, without specifying the nature of मृत्यु.'
