review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the sequential conception-and-birth metaphor and leaves मृत्यु unqualified. However, ‘अभिलाषा’ commonly has a positive or neutral sense in modern Hindi and does not adequately convey the wrongful desire indicated by ἐπιθυμία in this context. ‘बुरी इच्छा’ is clear, natural, and retains the broad, non-sexualized sense.
  naturalness: The syntax is generally natural. ‘पूरी तरह बढ़ जाता है’ is understandable but somewhat colloquial and less exact for ἀποτελεσθεῖσα; ‘पूर्ण परिपक्व हो जाता है’ more clearly conveys completion/maturity while sustaining the organic imagery.
  terminology: ‘पाप’ and ‘मृत्यु’ are appropriate standard theological terms. Replacing ‘अभिलाषा’ with ‘बुरी इच्छा’ avoids a misleading positive connotation without narrowing the term to sexual lust.
  issues:
  - severity: medium
    issue: ‘अभिलाषा’ is semantically too positive/neutral in this context.
    rationale: The verse concerns desire in the progression of temptation to sin. Modern Hindi ‘अभिलाषा’ often means an aspiration or cherished wish; ‘बुरी इच्छा’ conveys the contextual negative force of ἐπιθυμία without importing a specifically sexual meaning.
  - severity: low
    issue: ‘पूरी तरह बढ़ जाता है’ is less precise than the Greek completion/maturity language.
    rationale: ἀποτελεσθεῖσα denotes having reached completion or maturity. ‘पूर्ण परिपक्व हो जाता है’ is idiomatic in a literary-register Hindi Bible translation and better represents that sense.
  revised_text: फिर बुरी इच्छा गर्भ धारण करके पाप को जन्म देती है; और पाप, जब पूर्ण परिपक्व हो जाता है[a], तो मृत्यु को जन्म देता है।
  revised_footnotes:
  - marker: a
    text: या ‘जब पूरा हो जाता है’ अथवा ‘जब परिपक्व हो जाता है।’
    reason: lexical_alternative
  revision_rationale: 'The revision retains the Greek’s personified reproductive sequence: wrongful desire conceives and gives birth to sin; sin, on reaching completion/maturity, gives birth to death. It improves the contextual sense of ἐπιθυμία and the precision of ἀποτελεσθεῖσα, without specifying the nature of मृत्यु.'
