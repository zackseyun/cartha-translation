base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: hi
  text: फिर बुरी इच्छा गर्भ धारण करके पाप को जन्म देती है; और पाप, जब पूर्ण परिपक्व हो जाता है[a], तो मृत्यु को जन्म देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जब पूरा हो जाता है’ अथवा ‘जब परिपक्व हो जाता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: फिर
  rationale: यह पिछले पद से आगे प्रलोभन, पाप और मृत्यु के क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπιθυμία
  choice: अभिलाषा
  rationale: यहाँ शब्द सामान्य रूप से अनुचित या बुरी इच्छा को दर्शाता है; ‘वासना’ इसे अनावश्यक रूप से केवल यौन अर्थ तक सीमित कर सकती है।
- source_word: συλλαβοῦσα
  choice: गर्भ धारण करके
  rationale: यूनानी कृदंत गर्भधारण की उपमा को बनाए रखता है और मुख्य क्रिया से पहले होने वाली क्रिया बताता है।
- source_word: τίκτει
  choice: जन्म देती है
  rationale: यह प्रसव की सजीव उपमा को स्पष्ट और आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ἁμαρτίαν
  choice: पाप
  rationale: नैतिक बुराई के लिए मानक और प्रसंगानुकूल हिन्दी शब्द।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ तीखा विरोध नहीं, बल्कि घटनाक्रम की अगली कड़ी प्रस्तुत करता है।
- source_word: ἀποτελεσθεῖσα
  choice: जब पूरी तरह बढ़ जाता है
  rationale: यह पाप के पूर्ण विकास या परिपक्वता तक पहुँचने का भाव देता है और जैविक उपमा के साथ स्वाभाविक बैठता है।
- source_word: ἀποκύει
  choice: जन्म देता है
  rationale: यह मूल पाठ की जन्म-संबंधी उपमा को स्पष्ट रूप से बनाए रखता है; हिन्दी में पुनरावृत्ति घटनाक्रम की समानांतरता को उभारती है।
- source_word: θάνατον
  choice: मृत्यु
  rationale: मूल पाठ इसका प्रकार निश्चित नहीं करता, इसलिए इसे बिना किसी धर्मवैज्ञानिक विशेषण के रखा गया है।
theological_decisions:
- issue: अभिलाषा, पाप और मृत्यु को जोड़ने वाली उपमा
  choice: गर्भधारण और जन्म की मानवीकृत उपमा को बनाए रखा गया है।
  alternative: ‘अभिलाषा पाप की ओर ले जाती है, और पाप मृत्यु की ओर’ जैसा अमूर्त कारण-परिणाम कथन।
  rationale: अमूर्त पुनर्कथन मूल की सजीव प्रजनन-उपमा और उसके क्रमिक प्रभाव को कम कर देता।
- issue: θάνατος का आशय
  choice: केवल ‘मृत्यु’
  alternative: ‘आत्मिक मृत्यु’ या ‘अनन्त मृत्यु’
  rationale: यूनानी पाठ मृत्यु के प्रकार को स्पष्ट नहीं करता; अनुवाद को इस अर्थगत व्यापकता और धर्मवैज्ञानिक तनाव को बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘अभिलाषा’ व्यापक अनुचित इच्छा का भाव रखती है, जबकि गर्भधारण और जन्म की मूल उपमा सुरक्षित है।
