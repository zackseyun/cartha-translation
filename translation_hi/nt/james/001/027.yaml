id: JAS.1.27
reference: James 1:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: hi
  text: 'परमेश्वर पिता की दृष्टि में शुद्ध और निष्कलंक धार्मिक आचरण यह है: अनाथों और विधवाओं के दुःख में उनकी देखभाल करना[a], और अपने आप को संसार से बेदाग रखना[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनाथों और विधवाओं के दुःख में उनसे मिलने जाना”; यूनानी क्रिया में मिलने जाने के साथ उनकी सक्रिय देखभाल करने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “संसार” से अभिप्राय परमेश्वर के विरोध में खड़ी नैतिक रूप से भ्रष्ट व्यवस्था है, स्वयं सृष्टि नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: भक्ति
  rationale: यहाँ शब्द बाहरी रूप से प्रकट होने वाले धार्मिक आचरण को दर्शाता है। ‘भक्ति’ आधुनिक हिन्दी में स्वाभाविक है और केवल किसी धार्मिक व्यवस्था का नाम न बताकर जीवन में दिखाई देने वाली ईश्वरनिष्ठा को व्यक्त करती है।
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: शुद्ध और निष्कलंक
  rationale: यह युग्म धार्मिक तथा नैतिक शुद्धता की बलवती समानांतर अभिव्यक्ति को बनाए रखता है।
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: परमेश्वर और पिता की दृष्टि में
  rationale: παρά के साथ चतुर्थी यहाँ परमेश्वर के मूल्यांकन या दृष्टि को सूचित करती है। यूनानी पदबंध ‘परमेश्वर और पिता’ दोनों उपाधियों को एक ही सत्ता से जोड़ता है; हिन्दी में उसे कृत्रिम रूप से ‘परमेश्वर पिता’ में समेटे बिना मूल संरचना रखी गई है।
- source_word: ἐπισκέπτεσθαι
  choice: सुधि लेना
  rationale: यह केवल मिलने जाने तक सीमित नहीं, बल्कि ध्यान देने, सहायता करने और देखभाल करने का भाव भी रखता है। ‘सुधि लेना’ इस व्यापक सक्रिय चिंता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὀρφανοὺς καὶ χήρας
  choice: अनाथों और विधवाओं
  rationale: ये सीधे, प्रचलित हिन्दी समतुल्य हैं और असुरक्षित सामाजिक समूहों की मूल जोड़ी को बनाए रखते हैं।
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: उनके दुःख में
  rationale: θλῖψις संकट, क्लेश या पीड़ा का बोध देता है। ‘दुःख’ सामान्य पाठक के लिए सहज है और प्रसंग की गंभीरता रखता है।
- source_word: ἄσπιλον
  choice: बेदाग
  rationale: यह नैतिक कलंक से मुक्त रहने की छवि को स्पष्ट और वर्तमान हिन्दी में बनाए रखता है।
- source_word: ἑαυτὸν τηρεῖν
  choice: अपने आप को ... रखना
  rationale: एक सामान्य नैतिक निर्देश के रूप में आत्म-संरक्षण का भाव रखा गया है; हिन्दी पदबंध किसी एक लिंग तक सीमित नहीं है।
- source_word: ἀπὸ τοῦ κόσμου
  choice: संसार से
  rationale: मूल के संक्षिप्त और अर्थगर्भित κόσμος को विस्तार देकर व्याख्यायित नहीं किया गया; नैतिक संदर्भ फुटनोट में स्पष्ट किया गया है।
theological_decisions:
- issue: κόσμος का नैतिक आशय
  choice: मुख्य पाठ में ‘संसार’ बनाए रखा गया है और उसके नैतिक आशय को फुटनोट में समझाया गया है।
  alternative: ‘संसार की बुराई’ या ‘भ्रष्ट संसार-व्यवस्था’
  rationale: स्पष्ट विस्तार मूल पाठ की अर्थपूर्ण व्यापकता को समय से पहले सीमित कर देता। यहाँ सृष्टि स्वयं नहीं, बल्कि परमेश्वर के विरोध में खड़ी नैतिक रूप से दूषित व्यवस्था अभिप्रेत है।
- issue: παρὰ τῷ θεῷ καὶ πατρὶ की संरचना
  choice: ‘परमेश्वर और पिता की दृष्टि में’
  alternative: ‘परमेश्वर पिता की दृष्टि में’
  rationale: एक ही व्यक्ति के लिए दोनों संबोधन समझते हुए भी मूल के καί और दोनों उपाधियों की संरचना को दृश्यमान रखा गया है।
- issue: ἑαυτόν का सामान्य निर्देश
  choice: ‘अपने आप को’
  alternative: ‘अपने आपको’ या पुरुषवाचक ‘अपने आपको वह रखे’
  rationale: यूनानी पुल्लिंग एकवचन यहाँ सामान्य नैतिक सूत्र के रूप में कार्य करता है; हिन्दी रूप स्रोत के आशय को बिना अनावश्यक लिंग-सीमा के व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘भक्ति’, ‘सुधि लेना’ और ‘बेदाग’ सामान्य पाठक के लिए बोधगम्य हैं; वाक्य की सूत्रात्मक तथा समानांतर संरचना सुरक्षित रखी गई है।
