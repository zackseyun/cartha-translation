base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a servant of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: hi
  text: 'परमेश्वर और प्रभु यीशु मसीह का दास[a] याकूब, बिखराव[b] में बसे हुए बारह गोत्रों को: नमस्कार।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दास’ का अर्थ ऐसे व्यक्ति से है जो किसी स्वामी का है और उसके अधिकार में रहता है; इसका अनुवाद ‘सेवक’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘बिखराव’ उन समुदायों के लिए प्रयुक्त शब्द था जो अपनी पैतृक भूमि से बाहर अलग-अलग स्थानों में बसे थे। यहाँ ‘बारह गोत्रों’ की भाषा इस्राएल की ओर संकेत करती है।
    reason: cultural_note
lexical_decisions:
- source_word: Ἰάκωβος
  choice: याकूब
  rationale: यूनानी Ἰάκωβος उसी नाम का रूप है जिसे हिन्दी बाइबल-परंपरा और मूल सामी नाम के अनुसार स्वाभाविक रूप से ‘याकूब’ कहा जाता है; अंग्रेज़ी का ‘James’ हिन्दी के लिए आधार नहीं बनाया गया।
- source_word: θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: परमेश्वर और प्रभु यीशु मसीह का
  rationale: दोनों संबंधवाचक पदों को एक साथ δοῦλος से जोड़ा गया है। κύριος के लिए स्थापित ‘प्रभु’ और Χριστός के उपाधिगत अर्थ के लिए ‘मसीह’ रखा गया है।
- source_word: δοῦλος
  choice: दास
  rationale: ‘दास’ स्वामी से संबंध और उसके अधिकार में होने का प्रबल भाव बचाता है, फिर भी आधुनिक हिन्दी में ‘गुलाम’ की अपेक्षा इस पत्रीय आत्मपरिचय के लिए अधिक गरिमापूर्ण और स्वाभाविक है।
- source_word: ταῖς δώδεκα φυλαῖς
  choice: बारह गोत्रों को
  rationale: इस्राएली वाचाई शब्दावली को सामान्यीकृत किए बिना यूनानी दत्तिव वाक्यांश का सीधा और स्वाभाविक अनुवाद।
- source_word: διασπορᾷ
  choice: बिखराव
  rationale: यह διασπορά के बिखरे हुए समुदायों में रहने के अर्ध-पारिभाषिक भाव को बचाता है और ‘प्रवासी’ जैसे अपेक्षाकृत संकुचित आधुनिक अर्थ से बचता है।
- source_word: χαίρειν
  choice: नमस्कार
  rationale: यह पत्र के आरंभ में प्रयुक्त रूढ़ अभिवादन है; शाब्दिक ‘आनन्दित रहो’ यहाँ पत्रीय मुहावरे का अर्थ बिगाड़ देगा।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यहाँ Χριστός यीशु की उपाधि है; ‘मसीह’ उसके अभिषिक्त राजा वाले अर्थ को हिन्दी में जीवित रखता है और केवल नाम-जैसे लिप्यंतरण से बचाता है।
- issue: δοῦλος में अधीनता और सेवा का भाव
  choice: दास
  alternative: सेवक
  rationale: ‘सेवक’ सेवा तो बताता है, पर स्वामी से पूर्ण संबंध और अधिकाराधीनता को हल्का कर सकता है। ‘दास’ उस प्रबल भाव को बनाए रखता है, जबकि ‘गुलाम’ इस प्रसंग में अनावश्यक रूप से कठोर और कम गरिमापूर्ण लगेगा।
- issue: ‘बारह गोत्र’ की पहचान
  choice: मुख्य पाठ में पहचान को खुला रखना
  alternative: इसे स्पष्ट रूप से केवल जातीय यहूदियों या केवल कलीसिया के लिए कहना
  rationale: पद स्वयं ‘बारह गोत्रों’ और ‘बिखराव’ की इस्राएली भाषा का उपयोग करता है, पर संबोधित समूह की पूरी धार्मिक-सामुदायिक सीमा स्पष्ट नहीं करता; इसलिए अनुवाद उस तनाव को नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण पत्रीय हिन्दी में रखी गई है। ‘नमस्कार’ आरंभिक अभिवादन को स्वाभाविक बनाता है; विस्मयादिबोधक चिह्न अभिवादन की स्वतंत्र पत्रीय इकाई को दर्शाता है। ‘बिखराव’ कुछ अर्ध-पारिभाषिक है, इसलिए उसे पादटिप्पणी से स्पष्ट किया गया है।
