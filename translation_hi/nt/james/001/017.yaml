source:
  edition: SBLGNT
  text: Πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον ἄνωθέν ἐστιν, καταβαῖνον ἀπὸ τοῦ πατρὸς τῶν φώτων, παρ’ ᾧ οὐκ ἔνι παραλλαγὴ ἢ τροπῆς ἀποσκίασμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: hi
  text: हर अच्छी देन[a] और हर पूर्ण उपहार ऊपर से, ज्योतियों के पिता की ओर से, उतरते हैं। उनके यहाँ न कोई परिवर्तन है, न घूमने से पड़ने वाली छाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हर अच्छा देना।’ पहला संज्ञा-पद देने के कार्य पर भी बल दे सकता है, जबकि दूसरा दी हुई वस्तु पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘घूमने की छाया’ अथवा ‘बदलती हुई छाया।’ यह वाक्यांश सम्भवतः आकाशीय ज्योतियों की गति के साथ बदलने वाली छायाओं की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ
  choice: हर अच्छा दान
  rationale: δόσις देने के कार्य या दी हुई वस्तु, दोनों को सूचित कर सकता है। ‘दान’ हिन्दी में स्वाभाविक है और कुछ हद तक दोनों अर्थों को खुला रखता है; इसकी अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
- source_word: πᾶν δώρημα τέλειον
  choice: हर सिद्ध वरदान
  rationale: δώρημα दी हुई वस्तु पर बल देता है; ‘वरदान’ इसे पहले पद के ‘दान’ से अलग रखते हुए समानांतरता बनाए रखता है। ‘सिद्ध’ τέλειον के पूर्ण, त्रुटिरहित अथवा पूरी तरह अच्छा होने के भाव को सुरक्षित रखता है।
- source_word: ἄνωθέν ἐστιν, καταβαῖνον
  choice: ऊपर से आता है—… उतरता हुआ
  rationale: ‘ऊपर से’ स्रोत को और ‘उतरता हुआ’ वर्तमान कृदन्त की गतिशील छवि को बनाए रखता है। हिन्दी में ‘आता है’ वाक्य को स्वाभाविक बनाता है।
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: ज्योतियों के पिता की ओर से
  rationale: ‘ज्योतियों के पिता’ मूल रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है; ‘की ओर से’ ἀπό द्वारा व्यक्त स्रोत को स्वाभाविक हिन्दी में बताता है।
- source_word: παρ’ ᾧ οὐκ ἔνι παραλλαγὴ
  choice: उनके यहाँ न कोई परिवर्तन है
  rationale: παρ’ ᾧ के संबंध अथवा उपस्थिति के भाव को ‘उनके यहाँ’ निकटता से व्यक्त करता है और परमेश्वर के विषय में आदरसूचक बहुवचन हिन्दी के अनुरूप है। παραλλαγή के लिए ‘परिवर्तन’ स्पष्ट और स्वाभाविक है।
- source_word: ἢ τροπῆς ἀποσκίασμα
  choice: न घूमने से पड़ने वाली छाया
  rationale: यह कठिन संबंधवाचक पद घूमने के कारण उत्पन्न छाया की छवि दे सकता है। यह अनुवाद उस संभावित संबंध को समझने योग्य बनाता है, पर खगोलीय संकेत को मुख्य पाठ में खोलकर निश्चित नहीं करता।
theological_decisions:
- issue: ‘ज्योतियों के पिता’ की छवि और परमेश्वर की अपरिवर्तनशीलता
  choice: रूपक को बनाए रखते हुए परिवर्तन और घूमने से पड़ने वाली छाया—दोनों का स्पष्ट निषेध रखा गया है।
  alternative: ‘ज्योतियों’ को मुख्य पाठ में सीधे सूर्य, चन्द्रमा और तारों के रूप में समझाना, अथवा अंतिम खंड को केवल ‘जो कभी नहीं बदलते’ कहना।
  rationale: यूनानी पाठ सृष्ट ज्योतियों की बदलती दशाओं और उनके पिता के अपरिवर्तनशील होने के बीच निहित विरोध प्रस्तुत करता है। मुख्य पाठ में इसे किसी विस्तृत धर्मसैद्धान्तिक कथन में बदलना उस काव्यात्मक तनाव को घटा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘ज्योतियों के पिता’ जैसे मूल रूपक और अंतिम खंड की काव्यात्मक कठिनाई को बनाए रखा गया है; ‘उनके यहाँ’ आदरसूचक और संबंधसूचक दोनों है।
