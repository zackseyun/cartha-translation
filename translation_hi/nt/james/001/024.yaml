  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: hi
  text: क्योंकि उसने अपने आपको ध्यान से देखा और चला गया, और तुरन्त भूल गया कि वह कैसा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह किस प्रकार का व्यक्ति था।” यूनानी अभिव्यक्ति इस बात की ओर संकेत करती है कि वह किस प्रकार का व्यक्ति था।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατενόησεν
  choice: ध्यान से देखा
  rationale: κατανοέω यहाँ दर्पण में स्वयं को देखने या ध्यानपूर्वक देखने की ठोस क्रिया बताता है। ‘ध्यान से देखा’ क्रिया की सावधानीपूर्ण छाया को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले पद में दिए गए दृष्टान्त का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस संबंध को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ἑαυτὸν
  choice: अपने आपको
  rationale: मूल में प्रत्यक्ष कर्मवाचक निजवाचक सर्वनाम है। इस पद में ‘चेहरा’ दोहराया नहीं गया, इसलिए ‘अपने आपको’ मूल अभिव्यक्ति के निकट है।
- source_word: ἀπελήλυθεν
  choice: चला गया
  rationale: ἀπέρχομαι का पूर्णकाल रूप चले जाने और उसके परिणाम की छाया रख सकता है, पर इस क्रमिक वर्णन में ‘चला गया’ स्वाभाविक हिन्दी है और अर्थ को विकृत नहीं करता।
- source_word: εὐθέως
  choice: तुरन्त
  rationale: εὐθέως तत्काल होने पर बल देता है; ‘तुरन्त’ वर्तमान मानक हिन्दी में स्पष्ट और सटीक है।
- source_word: ἐπελάθετο
  choice: भूल गया
  rationale: ἐπιλανθάνομαι का यहाँ सीधा अर्थ स्मरण न रखना है; ‘भूल गया’ इसका सबसे स्वाभाविक हिन्दी रूप है।
- source_word: ὁποῖος ἦν
  choice: वह कैसा था
  rationale: ὁποῖος व्यक्ति की पहचान मात्र नहीं, बल्कि उसके प्रकार या गुण को सूचित करता है। ‘वह कैसा था’ इस गुणात्मक अर्थ को संक्षिप्त और सहज ढंग से बनाए रखता है।
theological_decisions:
- issue: दर्पण के दृष्टान्त में व्याकरणिक पुल्लिंग का सामान्य मानवीय अर्थ
  choice: वह कैसा था
  alternative: वह किस प्रकार का पुरुष था
  rationale: यूनानी रूप पुल्लिंग एकवचन है, पर प्रसंग में यह केवल पुरुषों के लिए नहीं बल्कि किसी भी सुनने वाले व्यक्ति के प्रतिनिधि उदाहरण के रूप में प्रयुक्त है। हिन्दी में ‘वह’ स्रोत के व्याकरणिक रूप को सहज रखते हुए अनावश्यक रूप से अर्थ को पुरुषों तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक पठन के योग्य रखी गई है। वाक्य में मूल यूनानी के तीन क्रमिक कार्य—देखना, चले जाना और तुरन्त भूल जाना—स्पष्ट बने रहते हैं।
