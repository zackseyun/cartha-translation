  text: ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω, ἵνα ἦτε τέλειοι καὶ ὁλόκληροι, ἐν μηδενὶ λειπόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/004.yaml
  text: And let endurance have its perfect work[a], so that you may be mature and complete, lacking in nothing.
translation:
  language: hi
  text: और धीरज को अपना पूरा काम करने दो[a], ताकि तुम परिपक्व और संपूर्ण हो जाओ और तुममें किसी बात की कमी न रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धीरज अपना पूर्ण कार्य करे”; यूनानी में संबंधित शब्द किसी लक्ष्य तक पहुँचने और हर भाग में संपूर्ण होने का भाव देते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴ
  choice: धीरज
  rationale: यहाँ शब्द परीक्षाओं के बीच दृढ़ता से टिके रहने को दर्शाता है। ‘धीरज’ आधुनिक हिन्दी में स्वाभाविक है और केवल निष्क्रिय प्रतीक्षा तक सीमित नहीं है।
- source_word: ἔργον τέλειον
  choice: अपना पूरा काम
  rationale: यह अभिव्यक्ति धीरज के उस काम को सूचित करती है जो अपने लक्ष्य तक पहुँचता है। ‘पूरा काम’ मूल के ἔργον और τέλειον दोनों को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐχέτω
  choice: करने दो
  rationale: तीसरे पुरुष की आज्ञार्थक क्रिया का स्वाभाविक हिन्दी रूप है; यह पाठक को धीरज की प्रक्रिया को बाधित न करने का आह्वान देता है।
- source_word: ἵνα ἦτε
  choice: ताकि तुम ... हो जाओ
  rationale: उद्देश्य अथवा परिणाम का भाव सुरक्षित रहता है और हिन्दी में विकास की प्रक्रिया स्वाभाविक रूप से व्यक्त होती है।
- source_word: τέλειοι
  choice: परिपक्व
  rationale: व्यक्तियों के विषय में यह शब्द लक्ष्य तक पहुँची हुई परिपक्वता का संकेत दे सकता है; यह अनिवार्य रूप से निष्पाप सिद्धता का दावा नहीं करता।
- source_word: ὁλόκληροι
  choice: संपूर्ण
  rationale: यह हर भाग में साबुत और अखंड होने का भाव देता है तथा ‘परिपक्व’ से संबंधित, पर अलग, अर्थ बनाए रखता है।
- source_word: ἐν μηδενὶ λειπόμενοι
  choice: तुममें किसी बात की कमी न रहे
  rationale: यह किसी भी क्षेत्र में पीछे या अधूरा न रहने की व्यापकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: और
  rationale: यह पिछले पद की बात को आगे बढ़ाता है; यहाँ तीखा विरोध नहीं है।
theological_decisions:
- issue: पवित्रीकरण के संदर्भ में τέλειοι का अर्थ
  choice: परिपक्व
  alternative: सिद्ध
  rationale: याकूब धीरज से उत्पन्न लक्ष्यगत परिपक्वता और समग्रता की बात करता है। ‘परिपक्व’ अनावश्यक रूप से निष्पाप सिद्धता का सिद्धान्त आरोपित किए बिना मूल अर्थ को रखता है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘धीरज’ को सक्रिय दृढ़ता के अर्थ में तथा ‘परिपक्व और संपूर्ण’ को मूल के दो संबंधित किन्तु भिन्न विशेषणों के अनुरूप रखा गया है।
