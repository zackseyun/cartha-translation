reference: James 1:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: hi
  text: यदि कोई अपने आपको धार्मिक समझता है, पर अपनी जीभ को लगाम नहीं देता, बल्कि अपने हृदय को धोखा देता है, तो उस व्यक्ति का धार्मिक आचरण व्यर्थ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκεῖ
  choice: अपने आपको ... समझता है
  rationale: यहाँ क्रिया व्यक्ति के अपने विषय में किए गए आकलन को व्यक्त करती है; यह अनुवाद केवल बाहरी रूप से ‘दिखने’ का अर्थ थोपे बिना उस भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: θρησκὸς
  choice: धर्मपरायण
  rationale: यह विशेषण धार्मिक होने या धार्मिक आचरण करने का भाव देता है। ‘धर्मपरायण’ आधुनिक हिन्दी में व्यक्ति के धार्मिक होने के दावे को स्पष्ट करता है, यद्यपि यह आंतरिक भक्ति तक सीमित नहीं है।
- source_word: χαλιναγωγῶν
  choice: लगाम ... लगाता
  rationale: मूल यूनानी में पशु को नियंत्रित करने वाली लगाम का सजीव रूपक है; इसे याकूब 3:2 के विषयगत संबंध सहित सुरक्षित रखा गया है।
- source_word: γλῶσσαν αὐτοῦ
  choice: अपनी जीभ
  rationale: शाब्दिक अंग-संज्ञा को बनाए रखने से वाणी के नियंत्रण का रूपक और पत्र में ‘जीभ’ का आगे का विषय सुरक्षित रहता है।
- source_word: ἀπατῶν καρδίαν αὐτοῦ
  choice: अपने हृदय को धोखा देता है
  rationale: ‘हृदय’ को ‘अपने आपको’ बनाकर समतल करने के बजाय मूल की ठोस अभिव्यक्ति रखी गई है; यहाँ हृदय भीतरी व्यक्ति और आत्म-मूल्यांकन का केंद्र है।
- source_word: τούτου
  choice: उस व्यक्ति की
  rationale: संकेतवाचक सर्वनाम पूर्वोक्त प्रकार के व्यक्ति की ओर स्पष्ट रूप से लौटता है; यह हिन्दी में स्वाभाविक जननवाचक रचना है।
- source_word: μάταιος
  choice: व्यर्थ
  rationale: यह शब्द निष्फल, खोखला या बेकार होने का मूल्यांकन व्यक्त करता है। ‘व्यर्थ’ संक्षिप्त, गरिमापूर्ण और सामान्य हिन्दी में बोधगम्य है।
- source_word: ἡ θρησκεία
  choice: धार्मिकता
  rationale: संज्ञा यहाँ धार्मिक आचरण या धर्मपालन को सूचित करती है। ‘धार्मिकता’ विशेषण ‘धर्मपरायण’ से अर्थगत संबंध रखते हुए हिन्दी में सहज है, हालांकि इसे नैतिक righteousness के अर्थ में न पढ़ा जाए।
theological_decisions:
- issue: लिंग-सूचक सामान्य संदर्भ
  choice: यदि कोई ... अपनी ... अपने ... उस व्यक्ति
  alternative: यदि कोई पुरुष ... उसकी ... उसका
  rationale: यूनानी में पुल्लिंग एकवचन रूप सामान्य मानवीय संदर्भ में हैं। हिन्दी में ‘कोई’ और निजवाचक ‘अपना’ उसी एकवचन सामान्यता को स्वाभाविक रूप से सुरक्षित रखते हैं और अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करते।
- issue: θρησκεία/θρησκός का अर्थ
  choice: धर्मपरायण / धार्मिकता
  alternative: धार्मिक / धर्म; भक्त / भक्ति; धर्माचारी / धर्माचरण
  rationale: वचन धार्मिक पहचान और आचरण के दावे की परीक्षा करता है, न कि किसी खास सम्प्रदाय या मात्र आंतरिक भक्ति की। चुने हुए शब्द हिन्दी में स्वाभाविक हैं और बाहरी धार्मिक व्यवहार की आलोचना को व्यक्त करते हैं।
- issue: अनियंत्रित वाणी और धर्म का मूल्य
  choice: उस व्यक्ति की धार्मिकता व्यर्थ है
  alternative: उसका धर्म झूठा है
  rationale: मूल पाठ उस व्यक्ति के धार्मिक आचरण को μάταιος—निष्फल या व्यर्थ—कहता है; वह सीधे उसे ‘झूठा’ नहीं कहता। इसलिए मूल्यांकन की तीव्रता को न बढ़ाया गया है, न घटाया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘जीभ पर लगाम लगाना’ मूल रूपक को सहज हिन्दी मुहावरे में सुरक्षित रखता है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ में मूल अर्थ और रूपक दोनों स्पष्ट हैं।
