source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: hi
  text: धन्य है वह मनुष्य जो परीक्षा[a] में धीरज धरता है, क्योंकि खरा सिद्ध होने पर वह जीवन का मुकुट[b] पाएगा, जिसकी उसने उन लोगों से प्रतिज्ञा की जो उससे प्रेम रखते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रलोभन” अथवा “परखा जाना”; यूनानी शब्द में परीक्षा और प्रलोभन दोनों के अर्थ आ सकते हैं, पर यहाँ प्रसंग परीक्षा में धीरज रखने पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: “मुकुट” के लिए प्रयुक्त यूनानी शब्द विजेता को दी जानेवाली माला का भी संकेत कर सकता है; यह आवश्यक नहीं कि राजकीय मुकुट हो।
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: धन्य
  rationale: यह आशीर्वचन-सदृश भाव और परमेश्वर की स्वीकृति को व्यक्त करता है; ‘सुखी’ केवल मनोदशा का संकेत दे सकता है।
- source_word: ἀνὴρ
  choice: मनुष्य
  rationale: यूनानी शब्द पुल्लिंग एकवचन है, पर यहाँ प्रतिनिधिक अर्थ में है; हिंदी में ‘मनुष्य’ स्रोत की मानवीय और एकवचन अभिव्यक्ति को स्वाभाविक रूप से रखता है।
- source_word: ὑπομένει
  choice: धीरज धरता है
  rationale: यह दबाव के बीच स्थिर बने रहने और सहनशील दृढ़ता का स्वाभाविक हिंदी बोध देता है।
- source_word: πειρασμόν
  choice: परीक्षा
  rationale: इस प्रसंग में धीरज, खरा सिद्ध होना और प्रतिफल प्रमुख हैं। फिर भी यूनानी शब्द में प्रलोभन और परखे जाने का अर्थ भी संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: δόκιμος γενόμενος
  choice: खरा सिद्ध होने पर
  rationale: यह जाँच के बाद प्रमाणित या स्वीकार्य पाए जाने के मूल्यांकनात्मक अर्थ और कृदंत के कालगत संबंध—उसके बाद—दोनों को संक्षेप में व्यक्त करता है।
- source_word: λήμψεται
  choice: पाएगा
  rationale: भविष्यकालीन प्राप्ति को सरल और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: στέφανον
  choice: मुकुट
  rationale: यह स्थापित और समझने योग्य हिंदी शब्द है; विजेता की माला का सांस्कृतिक संकेत पादटिप्पणी में दिया गया है।
- source_word: τῆς ζωῆς
  choice: जीवन का
  rationale: यूनानी संबंधकारक की सीधी अभिव्यक्ति है और ‘जीवन’ तथा ‘मुकुट’ के संबंध को जानबूझकर अधिक स्पष्ट नहीं करती।
- source_word: ἐπηγγείλατο
  choice: प्रतिज्ञा उसने ... की है
  rationale: प्रतिज्ञा की पूर्ण हुई क्रिया और उसकी वर्तमान प्रासंगिकता हिंदी के स्वाभाविक पूर्णकाल से व्यक्त होती है। संदर्भ में अप्रकट कर्ता परमेश्वर है, पर मूल की तरह पद में उसका नाम नहीं जोड़ा गया।
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: अपने प्रेम रखनेवालों से
  rationale: यह उन लोगों के निरंतर, चरित्रगत प्रेम को व्यक्त करता है और हिंदी में ‘प्रतिज्ञा करना’ के साथ स्वाभाविक संबंध बनाता है।
theological_decisions:
- issue: याकूब 1:12 में πειρασμός का अर्थ
  choice: परीक्षा
  alternative: प्रलोभन; परखा जाना
  rationale: तात्कालिक प्रसंग धीरज, जाँच में खरा सिद्ध होने और प्रतिफल पर बल देता है, इसलिए ‘परीक्षा’ मुख्य पाठ में उपयुक्त है। शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में रखी गई है ताकि परीक्षा और प्रलोभन के बीच का वास्तविक तनाव समाप्त न हो।
- issue: जीवन के मुकुट का संबंध
  choice: ‘जीवन का मुकुट’ के संबंधकारक रूप को यथावत रखना
  alternative: वह मुकुट जो जीवन है; जीवन देनेवाला मुकुट
  rationale: τῆς ζωῆς की व्याख्या जीवन को मुकुट की पहचान या उसके परिणाम के रूप में कर सकती है; मूल पाठ इसे स्पष्ट नहीं करता, इसलिए अनुवाद भी संबंध को खुला रखता है।
- issue: ἐπηγγείλατο का अप्रकट कर्ता
  choice: ‘उसने’ रखकर परमेश्वर का नाम न जोड़ना
  alternative: परमेश्वर ने
  rationale: व्यापक संदर्भ में कर्ता स्वाभाविक रूप से परमेश्वर समझा जाता है, पर यूनानी पद में नाम व्यक्त नहीं है। ‘उसने’ स्रोत की अभिव्यक्ति और संदर्भगत संकेत दोनों सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सरल और सार्वजनिक पाठ के योग्य शैली। ‘धीरज धरता है’ और ‘खरा सिद्ध होने पर’ सामान्य पाठक के लिए स्वाभाविक हैं। सर्वनामगत अस्पष्टता और ‘जीवन का मुकुट’ की धर्मवैचारिक खुलावट मूल के अनुरूप बनाए रखी गई है।
