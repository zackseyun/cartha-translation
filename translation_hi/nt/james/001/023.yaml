id: JAS.1.23
reference: James 1:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: hi
  text: क्योंकि यदि कोई वचन का सुननेवाला है, पर उसे करनेवाला नहीं, तो वह एक पुरुष के समान है जो दर्पण में अपने जन्मजात चेहरे को ध्यान से देखता है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκροατὴς
  choice: सुननेवाला
  rationale: यह कर्तृवाचक संज्ञा का रूप बनाए रखता है और ποιητής के साथ सुनने तथा करने का समानांतर विरोध सुरक्षित रखता है।
- source_word: λόγου
  choice: वचन का
  rationale: λόγος का सीधा अर्थ रखा गया है; संदर्भ में यह परमेश्वर के घोषित वचन की ओर संकेत करता है और आस-पास के पदों से शब्दगत संबंध बनाए रखता है।
- source_word: ποιητής
  choice: करनेवाला
  rationale: संज्ञात्मक रूप और ‘सुननेवाला—करनेवाला’ का नैतिक विरोध सुरक्षित रहता है; ‘उसे’ से स्पष्ट होता है कि आशय वचन के अनुसार आचरण करने से है।
- source_word: ἔοικεν
  choice: के समान है
  rationale: पूर्णकालिक यूनानी रूप के वर्तमान अर्थ को स्वाभाविक हिन्दी तुलना द्वारा व्यक्त किया गया है।
- source_word: ἀνδρὶ
  choice: उस पुरुष
  rationale: ἀνήρ के स्पष्ट पुल्लिंग अर्थ को रखा गया है, जबकि उपमा का सामान्य अनुप्रयोग संदर्भ से समझा जा सकता है।
- source_word: κατανοοῦντι
  choice: ध्यान से देखता है
  rationale: κατανοέω केवल क्षणभर देखने के बजाय ध्यानपूर्वक निरीक्षण का भाव देता है।
- source_word: τὸ πρόσωπον
  choice: चेहरे
  rationale: दर्पण के संदर्भ में πρόσωπον का स्वाभाविक और सीधा अर्थ ‘चेहरा’ है।
- source_word: τῆς γενέσεως αὐτοῦ
  choice: अपने जन्म के
  rationale: असामान्य यूनानी संबंधवाचक पदबंध ‘उसके जन्म का’ को औपचारिक रूप से सुरक्षित रखा गया है; उसके स्वाभाविक अर्थ को पादटिप्पणी स्पष्ट करती है।
- source_word: ἐν ἐσόπτρῳ
  choice: दर्पण में
  rationale: ἔσοπτρον के लिए वर्तमान मानक हिन्दी का स्पष्ट और गरिमापूर्ण शब्द चुना गया है।
theological_decisions:
- issue: ἀνδρὶ में पुल्लिंग प्रतिनिधिक भाषा
  choice: उस पुरुष
  alternative: उस व्यक्ति
  rationale: मूल पाठ सामान्य मानववाची शब्द के बजाय विशेष रूप से पुल्लिंग ἀνήρ का प्रयोग करता है; इसलिए अनुवाद पुल्लिंग रूप को बनाए रखता है और उपमा के व्यापक आशय को संदर्भ पर छोड़ता है।
- issue: वचन को सुनने और करने का संबंध
  choice: वचन का सुननेवाला ... उसे करनेवाला
  alternative: वचन सुनता है ... उसके अनुसार चलता है
  rationale: चुना हुआ रूप दोनों कर्तृवाचक संज्ञाओं का जानबूझकर किया गया विरोध सुरक्षित रखता है और पाठ को किसी विशेष धर्मवैधानिक व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ‘वचन’, ‘दर्पण’ और ‘पुरुष’ जैसे गरिमापूर्ण तथा व्यापक रूप से बोधगम्य शब्द रखे गए हैं। ‘अपने जन्म के चेहरे’ की जानबूझकर असामान्य अभिव्यक्ति मूल यूनानी पदबंध को सुरक्षित रखती है और पादटिप्पणी उसके अर्थ को सहज रूप में खोलती है।
