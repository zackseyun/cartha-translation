  to: क्योंकि यदि कोई वचन का सुननेवाला है, पर उसे करनेवाला नहीं, तो वह एक पुरुष के समान है जो दर्पण में अपने जन्मजात चेहरे को ध्यान से देखता है,
  rationale: ‘उस पुरुष’ को ‘एक पुरुष’ किया गया है ताकि अनिश्चित यूनानी ἀνδρὶ का अर्थ ठीक रहे। ‘अपने जन्म के चेहरे’ को ‘अपने जन्मजात चेहरे’ किया गया है ताकि आधुनिक मानक हिन्दी में स्वाभाविकता और समझ बनी रहे; पादटिप्पणी मूल के शाब्दिक ‘जन्म का चेहरा’ को सुरक्षित रखती है।
