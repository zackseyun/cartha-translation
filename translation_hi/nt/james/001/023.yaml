review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the conditional comparison, the hearer/doer contrast, the masculine ἀνήρ ('पुरुष'), attentive force of κατανοοῦντι, and the mirror image. However, 'उस पुरुष' is demonstrative/definite where Greek has an indefinite 'a man,' and 'अपने जन्म के चेहरे' is not idiomatic Hindi despite being formally motivated.
  naturalness: Most of the verse is clear and appropriately formal. 'अपने जन्म के चेहरे' is markedly unnatural in modern standard Hindi and can distract from the comparison. 'अपने जन्मजात चेहरे' is natural while retaining the sense of the Greek expression; the footnote can preserve its literal wording.
  terminology: ‘वचन,’ ‘सुननेवाला,’ ‘करनेवाला,’ and ‘दर्पण’ are suitable, consistent, and preserve the ethical contrast without importing a doctrinal interpretation. ‘पुरुष’ appropriately reflects the source masculine noun.
  issues:
  - severity: medium
    issue: ‘उस पुरुष’ makes the comparison refer to a particular, already identified man.
    rationale: 'ἀνδρὶ is anarthrous and introduces an indefinite comparison: ‘a man.’ Hindi should use ‘एक पुरुष’ (or omit an article-like element) rather than the demonstrative ‘उस.’'
  - severity: medium
    issue: ‘अपने जन्म के चेहरे’ is structurally literal but unnatural and potentially unclear in Hindi.
    rationale: The genitive phrase τῆς γενέσεως αὐτοῦ idiomatically denotes the person's natural/native face. ‘अपने जन्मजात चेहरे’ communicates that sense in modern Hindi, while a footnote can retain the literal ‘अपने जन्म का चेहरा’ and acknowledge the alternative explanation.
  revised_text: क्योंकि यदि कोई वचन का सुननेवाला है, पर उसे करनेवाला नहीं, तो वह एक पुरुष के समान है जो दर्पण में अपने जन्मजात चेहरे को ध्यान से देखता है,
  revised_footnotes:
  - marker: a
    text: या, “अपने उस स्वाभाविक चेहरे को, जिसके साथ वह जन्मा था।” यूनानी पदबंध का शाब्दिक अर्थ “अपने जन्म का चेहरा” है।
    reason: τῆς γενέσεως αὐτοῦ के शाब्दिक, किंतु हिन्दी में असामान्य, रूप को दर्शाते हुए उसके संदर्भगत अर्थ को स्पष्ट करना।
  revision_rationale: ‘उस पुरुष’ को ‘एक पुरुष’ किया गया है ताकि अनिश्चित यूनानी ἀνδρὶ का अर्थ ठीक रहे। ‘अपने जन्म के चेहरे’ को ‘अपने जन्मजात चेहरे’ किया गया है ताकि आधुनिक मानक हिन्दी में स्वाभाविकता और समझ बनी रहे; पादटिप्पणी मूल के शाब्दिक ‘जन्म का चेहरा’ को सुरक्षित रखती है।
