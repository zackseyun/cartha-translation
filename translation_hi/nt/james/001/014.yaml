  text: ἕκαστος δὲ πειράζεται ὑπὸ τῆς ἰδίας ἐπιθυμίας ἐξελκόμενος καὶ δελεαζόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/014.yaml
  text: But each one is tempted by his own desire[b][a], being drawn away and enticed.
translation:
  language: hi
  text: परन्तु हर व्यक्ति अपनी ही लालसा[a] से खींचे और लुभाए जाने पर प्रलोभित होता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी ही इच्छा” अथवा “अपनी ही वासना।” यूनानी शब्द किसी भी प्रबल इच्छा को सूचित कर सकता है; वह केवल यौन इच्छा तक सीमित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: “खींचे और लुभाए जाने” में शिकार या मछली को बाहर खींचकर चारे से जाल में फँसाने की छवि है।
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: हर व्यक्ति
  rationale: यह यूनानी के वितरणात्मक एकवचन भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: परन्तु
  rationale: 'पद 13 से हल्का विरोध स्पष्ट करता है: परमेश्वर नहीं, बल्कि व्यक्ति की अपनी अभिलाषा प्रलोभन का निकट स्रोत है।'
- source_word: πειράζεται
  choice: परीक्षा में पड़ता है
  rationale: सन्दर्भ में अर्थ पाप की ओर प्रलोभित होने का है; यह हिन्दी मुहावरा उस भाव को व्यक्त करता है और πειράζω में निहित परीक्षा/प्रलोभन की निकटता को पूरी तरह मिटाता नहीं।
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: अपनी ही अभिलाषा से
  rationale: ‘अपनी ही’ व्यक्तिगत उत्तरदायित्व पर दिए गए बल को रखता है; ‘अभिलाषा’ प्रबल इच्छा के व्यापक अर्थ को बनाए रखती है और उसे केवल यौन वासना तक सीमित नहीं करती।
- source_word: ἐξελκόμενος
  choice: खिंचकर
  rationale: बाहर खींचे या बहकाकर ले जाए जाने की रूपकात्मक छवि को संक्षिप्त और स्वाभाविक रूप में रखता है।
- source_word: καὶ δελεαζόμενος
  choice: और लुभाया जाकर
  rationale: चारे से फँसाने अथवा जाल की ओर लुभाने की छवि को हिन्दी में सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: प्रलोभन का स्रोत और परमेश्वर से उसका सम्बन्ध
  choice: व्यक्ति अपनी ही अभिलाषा से परीक्षा में पड़ता है
  alternative: इसे केवल बाहरी कठिन परिस्थितियों द्वारा जाँचे जाने के रूप में प्रस्तुत करना
  rationale: पद 13 के निकट सन्दर्भ और पद 15 में पाप के जन्म के क्रम के अनुसार यहाँ पाप की ओर प्रलोभन अभिप्रेत है। पाठ व्यक्ति की अपनी अभिलाषा को निकट स्रोत बताता है, पर कारणता के विषय में इससे आगे कोई व्यवस्था नहीं गढ़ी गई।
- issue: प्रतिनिधिक एकवचन का हिन्दी रूप
  choice: ‘हर व्यक्ति’ के साथ ‘अपनी ही’
  alternative: लिंग-चिह्नित ‘हर पुरुष ... उसकी अपनी’ अथवा बहुवचन ‘लोग ... अपनी’
  rationale: यूनानी का एकवचन और व्यक्तिगत बल सुरक्षित रहता है, जबकि हिन्दी का आत्मवाचक ‘अपनी’ स्वाभाविक रूप से उसी व्यक्ति की ओर संकेत करता है और अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘अभिलाषा’ व्यापक अर्थ के कारण चुना गया; रूपक को मुख्य पाठ में रखा गया और उसकी शिकार/मछली पकड़ने की पृष्ठभूमि पादटिप्पणी में स्पष्ट की गई।
