lexical_decisions:
- source_word: Πᾶσαν χαρὰν
  choice: पूरा आनन्द
  rationale: यह पदबंध ἡγήσασθε का विधेय पूरक है। ‘पूरा आनन्द’ यूनानी की समग्रता पर बल देता है और ‘शुद्ध आनन्द’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: ἡγήσασθε
  choice: समझो
  rationale: यह बहुवचन आज्ञार्थक रूप किसी परिस्थिति का सोच-विचार कर मूल्यांकन करने को कहता है। ‘समझो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए आज्ञा का बल बनाए रखता है।
- source_word: ἀδελφοί μου
  choice: हे मेरे भाइयो और बहनो
  rationale: व्याकरणिक रूप पुल्लिंग बहुवचन है, पर पत्रीय संबोधन में यह सम्भवतः पूरे विश्वासी समुदाय को समाविष्ट करता है। हिन्दी में ‘भाइयो’ अकेला सामान्य पाठक को केवल पुरुषों तक सीमित लग सकता है; इसलिए आशय को स्पष्ट करने वाला समावेशी संबोधन मुख्य पाठ में रखा गया है और स्रोत-रूप पादटिप्पणी में बताया गया है।
- source_word: ὅταν
  choice: जब कभी
  rationale: सम्भावनार्थक περιπέσητε के साथ यह अनिश्चित या बार-बार घट सकने वाले समय को व्यक्त करता है; ‘जब कभी’ इस बल को सहज हिन्दी में सुरक्षित रखता है।
- source_word: πειρασμοῖς
  choice: परीक्षाओं
  rationale: यहाँ प्रसंग विश्वास को परखने वाली बाहरी कठिनाइयों की ओर संकेत करता है। हिन्दी ‘परीक्षा’ जाँच और कठिन परिस्थिति दोनों का भाव रखती है; शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
- source_word: περιπέσητε
  choice: में पड़ो
  rationale: क्रिया का सजीव अर्थ किसी परिस्थिति में जा पड़ना है। ‘में पड़ो’ हिन्दी में स्वाभाविक है और अनपेक्षित रूप से घिर जाने की छवि बनाए रखता है।
- source_word: ποικίλοις
  choice: तरह-तरह की
  rationale: यह विशेषण विविधता बताता है। ‘तरह-तरह की’ साधारण आधुनिक हिन्दी में ‘विभिन्न प्रकार की’ से अधिक सहज है और अर्थ को ठीक से व्यक्त करता है।
theological_decisions:
- issue: पत्रीय संबोधन ἀδελφοί का समावेशी आशय
  choice: मुख्य पाठ में ‘भाइयो और बहनो’
  alternative: ‘मेरे भाइयो’
  rationale: यूनानी रूप व्याकरणिक रूप से पुल्लिंग है, किन्तु प्रसंग में संबोधन पूरे विश्वासी समुदाय के लिए होने की प्रबल सम्भावना है। मुख्य पाठ में आशय स्पष्ट किया गया है, जबकि शाब्दिक रूप पादटिप्पणी में रखा गया है; इससे किसी संप्रदायगत निष्कर्ष को आरोपित किए बिना स्रोत और संप्रेषित अर्थ दोनों दिखते हैं।
- issue: 'πειρασμοῖς का अर्थ: बाहरी परीक्षाएँ या पाप का प्रलोभन'
  choice: ‘परीक्षाओं’—विश्वास को परखने वाली कठिन परिस्थितियाँ
  alternative: ‘प्रलोभनों’ या ‘परखों’
  rationale: पद 3 में विश्वास की परख का उल्लेख और पद 13 में नैतिक प्रलोभन पर अलग चर्चा यहाँ बाहरी कठिनाइयों को प्राथमिक अर्थ बनाती है। फिर भी यूनानी शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में दी गई है।
