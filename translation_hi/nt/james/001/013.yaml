reference: James 1:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: hi
  text: कोई व्यक्ति, जब प्रलोभित हो, यह न कहे, “मुझे परमेश्वर प्रलोभित कर रहा है,” क्योंकि परमेश्वर बुराइयों से प्रलोभित नहीं हो सकता[a], और वह स्वयं किसी को प्रलोभित नहीं करता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि परमेश्वर बुराइयों के प्रति अप्रलोभनीय है।” यूनानी का अधिक शाब्दिक अर्थ है, “क्योंकि परमेश्वर बुराइयों से अप्रलोभनीय है।”
    reason: दुर्लभ यूनानी विशेषण ἀπείραστος और बहुवचन κακῶν की शब्दार्थगत कठिनाई तथा अधिक शाब्दिक विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: μηδεὶς ... λεγέτω
  choice: कोई ... यह न कहे
  rationale: नकारात्मक अनिश्चित सर्वनाम और तीसरे पुरुष की आज्ञार्थक क्रिया का स्वाभाविक हिन्दी निषेध।
- source_word: πειραζόμενος
  choice: जब किसी की परीक्षा हो रही हो
  rationale: वर्तमान कर्मवाच्य कृदन्त की जारी अवस्था को रखता है। यूनानी πειράζω में ‘परीक्षा’ और ‘प्रलोभन’ दोनों का अर्थ-क्षेत्र है; पहले प्रयोग में व्यापक अभिव्यक्ति आगे के नैतिक आशय के साथ तनाव बनाए रखती है।
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: परमेश्वर मुझे पाप करने के लिए लुभा रहा है
  rationale: ἀπό स्रोत को सूचित करता है। प्रसंग में πειράζομαι का आशय पाप की ओर प्रलोभन है; हिन्दी में कर्तृवाच्य रूप कर्मवाच्य की अपेक्षा अधिक स्वाभाविक है और परमेश्वर को कथित स्रोत/कर्ता के रूप में स्पष्ट रखता है।
- source_word: ἀπείραστός ἐστιν κακῶν
  choice: बुराई परमेश्वर को लुभा नहीं सकती
  rationale: दुर्लभ विशेषण ἀπείραστος को स्वाभाविक हिन्दी में असंभाव्यता की उपवाक्यात्मक अभिव्यक्ति दी गई है। κακῶν रूपतः बहुवचन है, पर यहाँ सामूहिक/गुणवाचक अर्थ में ‘बुराई’ सहज है।
- source_word: πειράζει δὲ αὐτὸς οὐδένα
  choice: और वह स्वयं किसी को पाप करने के लिए नहीं लुभाता
  rationale: αὐτός का बल ‘स्वयं’ से रखा गया है; οὐδένα का अनुवाद ‘किसी को ... नहीं’ है। नैतिक प्रलोभन को सामान्य परीक्षा से अलग और स्पष्ट करने के लिए ‘पाप करने के लिए लुभाता’ चुना गया है।
theological_decisions:
- issue: इस पद में πειράζω के अर्थ की एकरूपता अथवा प्रसंगानुसार भिन्न अभिव्यक्ति
  choice: पहले कृदन्त में ‘परीक्षा’, पर कथित दैवी कारण और निषेध में ‘पाप करने के लिए लुभाना’
  alternative: सभी प्रयोगों में ‘प्रलोभित करना/होना’ या ‘परीक्षा लेना/होना’
  rationale: एक ही यूनानी मूल की पुनरावृत्ति महत्वपूर्ण है, फिर भी हिन्दी में ‘परीक्षा’ 1:2 के व्यापक विषय से संबंध बनाए रखती है, जबकि 1:14–15 और κακῶν नैतिक प्रलोभन का आशय स्पष्ट करते हैं। ‘पाप करने के लिए’ जोड़ना इस प्रसंगगत अर्थ को सहज और असंदिग्ध बनाता है, बिना इस व्यापक बाइबलीय बात का निषेध किए कि परमेश्वर अन्य अर्थ में परीक्षा ले सकता है।
- issue: ἀπείραστός ἐστιν κακῶν का कठिन अर्थ
  choice: बुराई परमेश्वर को लुभा नहीं सकती
  alternative: परमेश्वर बुराई से प्रलोभित नहीं हो सकता; परमेश्वर बुराइयों से अपरिचित/अपरीक्षित है
  rationale: दुर्लभ विशेषण में वास्तविक व्याख्यात्मक कठिनाई है। चुना हुआ पाठ प्रसंग में परमेश्वर की बुराई के प्रति अप्रलोभनीयता व्यक्त करता है; वैकल्पिक अधिक सीधा रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘प्रलोभित’ की अपेक्षा मुख्य पाठ में ‘पाप करने के लिए लुभाना’ अधिक जनसुलभ है। ‘परमेश्वर’ मानक धर्मग्रंथीय संबोधन है। पादटिप्पणी में कठिन यूनानी रचना का अधिक औपचारिक विकल्प सुरक्षित रखा गया है।
