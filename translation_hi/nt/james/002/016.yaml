source:
  edition: SBLGNT
  text: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν· Ὑπάγετε ἐν εἰρήνῃ, θερμαίνεσθε καὶ χορτάζεσθε, μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος, ⸀τί ὄφελος;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/016.yaml
  text: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
translation:
  language: hi
  text: यदि तुम में से कोई उनसे कहे, “शांति से जाओ; गरम रहो और तृप्त हो जाओ,”[a] पर तुम उन्हें शरीर के लिए आवश्यक वस्तुएँ न दो, तो क्या लाभ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “गरम किए जाओ और तृप्त किए जाओ।” यूनानी क्रियारूपों को कर्मवाच्य या मध्यवाच्य अर्थ में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν
  choice: और तुममें से कोई उनसे कहे
  rationale: यह वाक्य एक काल्पनिक उदाहरण प्रस्तुत करता है। ‘तुममें से कोई’ अंशवाची भाव को स्वाभाविक हिन्दी में व्यक्त करता है; δέ को प्रवाह के अनुसार ‘और’ से रखा गया है, जबकि आगे का ‘पर’ मुख्य विरोध स्पष्ट करता है।
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: शान्ति से जाओ
  rationale: यह विदाई अथवा आशीर्वाद का प्रचलित सूत्र है। हिन्दी में यह स्वाभाविक है और प्रसंग की विडम्बना बनाए रखता है।
- source_word: θερμαίνεσθε
  choice: गरम रहो
  rationale: मध्य/कर्मवाच्य रूप अपने को गरम रखने अथवा गरम किए जाने, दोनों अर्थों की गुंजाइश रखता है। ‘गरम रहो’ स्वाभाविक है और अनावश्यक रूप से किसी एक पक्ष को निश्चित नहीं करता।
- source_word: χορτάζεσθε
  choice: तृप्त हो जाओ
  rationale: क्रिया का अर्थ, विशेषकर भोजन के संदर्भ में, भरना या तृप्त होना है। यह चयन केवल ‘खिलाए जाने’ तक अर्थ को सीमित नहीं करता।
- source_word: μὴ δῶτε δὲ αὐτοῖς
  choice: पर तुम उन्हें ... न दो
  rationale: δέ यहाँ कथन और वास्तविक सहायता न देने के बीच स्पष्ट विरोध दिखाता है। काल्पनिक शर्त के अनुरूप हिन्दी में ‘न दो’ स्वाभाविक है।
- source_word: τὰ ἐπιτήδεια τοῦ σώματος
  choice: शरीर की ज़रूरत की चीज़ें
  rationale: ἐπιτήδεια शरीर के लिए आवश्यक साधनों या सामग्री को दर्शाता है। यह आधुनिक, स्पष्ट हिन्दी है और शरीर पर दिए गए ठोस बल को बनाए रखता है।
- source_word: τί ὄφελος;
  choice: तो क्या लाभ?
  rationale: यह व्यावहारिक उपयोगिता पर प्रश्न है। संक्षिप्त हिन्दी अभिव्यक्ति यूनानी की तीखी आलंकारिक शक्ति बनाए रखती है।
theological_decisions:
- issue: θερμαίνεσθε और χορτάζεσθε में मध्यवाच्य/कर्मवाच्य की सम्भावना
  choice: “गरम रहो और तृप्त हो जाओ” द्वारा सामान्य आग्रह व्यक्त किया गया है, बिना यह तय किए कि वे स्वयं ऐसा करें या किसी से यह पाएँ।
  alternative: “गरम किए जाओ और तृप्त किए जाओ” अथवा “अपने को गरम रखो और पेट भर लो।”
  rationale: याकूब का बल भौतिक सहायता के बिना कहे गए शुभ शब्दों की निरर्थकता पर है। अनुवाद क्रियाओं की वाच्यगत अस्पष्टता को किसी आत्म-सहायता या निष्क्रिय प्राप्ति के सिद्धान्त में नहीं बदलता; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। मुख्य पाठ में वाच्यगत अस्पष्टता को यथासम्भव खुला रखा गया है और [a] ठीक सम्बद्ध वाक्यांश के बाद लगाया गया है।
