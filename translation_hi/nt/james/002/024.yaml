  text: ⸀ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/024.yaml
  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: hi
  text: तुम देखते हो कि मनुष्य कर्मों से धर्मी ठहराया जाता है, न कि केवल विश्वास से।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धर्मी सिद्ध होता है” अथवा “सही ठहराया जाता है।” याकूब के शब्दों को यहाँ इस विवाद का निर्णय किए बिना रखा गया है कि उनका प्रयोग पौलुस के “धर्मी ठहराने” संबंधी प्रयोग से किस प्रकार जुड़ता है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में एकवचन पुल्लिंग शब्द है, पर यहाँ वह प्रतिनिधिक अर्थ में सामान्य रूप से किसी भी मनुष्य के लिए प्रयुक्त हुआ है।
    reason: cultural_note
  - marker: c
    text: “विश्वास” के लिए “विश्वासयोग्यता” या “भरोसा” भी संभव अर्थ हैं; फिर भी इस अनुवाद में यूनानी πίστις का सामान्य अनुवाद “विश्वास” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρᾶτε
  choice: तुम देखते हो
  rationale: वर्तमानकालीन कर्तृवाच्य निर्देशार्थक, द्वितीय पुरुष बहुवचन है। यह पिछले उदाहरण से निकले निष्कर्ष की ओर पाठकों को सीधे संकेत करता है; इसलिए आज्ञार्थक ‘देखो’ के बजाय ‘तुम देखते हो’ रखा गया है।
- source_word: ἐξ ἔργων
  choice: कर्मों से
  rationale: ἐξ के साथ संबंधकारक यहाँ आधार या साधन का भाव देता है। ‘कर्मों से’ स्वाभाविक हिन्दी में इस अर्थ को व्यक्त करता है और ‘विश्वास से’ के साथ समानांतरता बनाए रखता है।
- source_word: δικαιοῦται
  choice: धर्मी ठहराया जाता है
  rationale: δικαιόω में धर्मी घोषित करने, धर्मी सिद्ध करने या सही प्रमाणित करने के अर्थ संभव हैं। ‘धर्मी ठहराया जाता है’ इसके प्रमुख न्यायिक-धार्मिक भार और पारिभाषिक निरंतरता को बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यहाँ पुल्लिंग एकवचन संज्ञा प्रतिनिधिक अर्थ में सामान्य मानव के लिए प्रयुक्त है। हिन्दी का ‘मनुष्य’ स्रोत के एकवचन और सामान्य मानवीय संदर्भ—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πίστεως
  choice: विश्वास
  rationale: πίστις का यहाँ स्वाभाविक और प्रमुख अनुवाद ‘विश्वास’ है। ‘विश्वासयोग्यता’ और ‘भरोसा’ संभावित शाब्दिक विकल्प हैं, जिन्हें पादटिप्पणी में रखा गया है।
- source_word: μόνον
  choice: केवल
  rationale: ‘केवल विश्वास से नहीं’ हिन्दी में स्वाभाविक ढंग से विश्वास की अकेली स्थिति का निषेध व्यक्त करता है और μόνον की विशिष्टता बनाए रखता है।
theological_decisions:
- issue: δικαιοῦται का अर्थ और पौलुस की धर्मी ठहराए जाने संबंधी भाषा से इसका संबंध
  choice: मुख्य पाठ में ‘धर्मी ठहराया जाता है’ रखा गया है।
  alternative: ‘धर्मी सिद्ध होता है’ या ‘सही प्रमाणित होता है।’
  rationale: याकूब की अभिव्यक्ति को किसी एक समन्वयकारी व्याख्या में बदलने के बजाय उसका धार्मिक तनाव बनाए रखा गया है। संदर्भगत प्रदर्शनात्मक या समर्थनात्मक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- issue: ἄνθρωπος का प्रतिनिधिक पुल्लिंग एकवचन
  choice: ‘मनुष्य’ रखा गया है, जो हिन्दी में सामान्य मानव के लिए प्रयुक्त हो सकता है।
  alternative: ‘व्यक्ति’ या ‘इंसान।’
  rationale: इससे कथन का एकवचन और सार्वत्रिक मानवीय आशय दोनों सुरक्षित रहते हैं; पादटिप्पणी स्पष्ट करती है कि आशय केवल पुरुष से नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधे, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध वाक्य-विन्यास का प्रयोग किया गया है। ‘धर्मी ठहराया जाता है’ पारंपरिक धार्मिक पदावली होते हुए भी व्यापक रूप से बोधगम्य है और मूल की अर्थगत तथा धर्मवैचारिक अस्पष्टता को सुरक्षित रखता है।
