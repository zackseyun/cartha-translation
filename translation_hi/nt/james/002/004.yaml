  choice: यह पद विश्वासियों के समुदाय में भेदभाव करने की निंदा करता है।
  alternative: यह पद मन के भीतर बँट जाने या संदेह करने की बात करता है।
  rationale: याकूब 2:1–3 का निकट संदर्भ धनी को निर्धन से अधिक सम्मान देने का है; इसलिए यहाँ सामाजिक भेदभाव का अर्थ सबसे उपयुक्त है, यद्यपि क्रिया अन्य संदर्भों में संदेह या विभाजन का भाव रख सकती है।
