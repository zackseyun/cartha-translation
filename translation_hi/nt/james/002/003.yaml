source:
  edition: SBLGNT
  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: hi
  text: और यदि तुम चमकीले वस्त्र पहने हुए व्यक्ति पर ध्यान दो और उससे कहो, “तुम यहाँ अच्छी जगह बैठो,” और उस गरीब आदमी से कहो, “तुम वहाँ खड़े रहो, या मेरी पाँव रखने की चौकी के नीचे बैठो,”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियाँ “या वहाँ बैठो” को छोड़ देती हैं; मुद्रित पाठ में यह वाक्यांश है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: ध्यान दो
  rationale: यह क्रिया यहाँ केवल देखने के बजाय किसी पर विशेष ध्यान देने का भाव रखती है। ‘ध्यान दो’ स्वाभाविक है और पक्षपात को इस पद में व्याख्यात्मक रूप से जोड़ने से बचता है।
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: चमकीले वस्त्र
  rationale: ἐσθής का अर्थ वस्त्र और λαμπρός का अर्थ चमकीला, भव्य या शानदार हो सकता है। ‘चमकीले वस्त्र’ मूल बिंब और ध्यान खींचने वाले पहनावे को बनाए रखता है।
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: तुम यहाँ अच्छी जगह बैठो
  rationale: आज्ञार्थक क्रिया और अनुकूल बैठने के स्थान, दोनों को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῷ πτωχῷ
  choice: उस गरीब आदमी
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण पुल्लिंग एकवचन है और दृश्य में एक विशेष गरीब पुरुष की ओर संकेत करता है।
- source_word: στῆθι
  choice: खड़े रहो
  rationale: यह खड़े होने की सीधी आज्ञा है; हिन्दी में ‘खड़े रहो’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: ἢ κάθου ἐκεῖ
  choice: या वहाँ ... बैठो
  rationale: ἐκεῖ की दूरी सूचकता को ‘वहाँ’ द्वारा बनाए रखा गया है।
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: मेरी पाँव रखने की चौकी के नीचे
  rationale: ὑπό के मूल अर्थ ‘नीचे’ और अपमानजनक सामाजिक स्थान को सुरक्षित रखता है, यद्यपि अभिव्यक्ति जानबूझकर असामान्य लगती है।
theological_decisions:
- issue: सामाजिक पक्षपात की भाषा
  choice: सम्मानित और अपमानित व्यवहार का ठोस वर्णन बनाए रखना
  alternative: मुख्य पाठ में ‘विशेष पक्षपात करो’ जैसी व्याख्यात्मक भाषा जोड़ना
  rationale: पद स्वयं भिन्न व्यवहार को संवाद और क्रिया के द्वारा दिखाता है; पक्षपात की धार्मिक-नैतिक निंदा व्यापक प्रसंग से उभरती है।
- issue: πτωχῷ का लिंग
  choice: गरीब आदमी
  alternative: गरीब व्यक्ति
  rationale: यूनानी रूप पुल्लिंग एकवचन है और इस दृश्य के विशिष्ट आगंतुक को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पाँव रखने की चौकी’ सामान्य ‘पायदान’ की अपेक्षा ὑποπόδιον के आशय को अधिक स्पष्ट करती है।
