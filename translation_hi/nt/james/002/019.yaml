id: JAS.2.19
reference: James 2:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: σὺ πιστεύεις ὅτι ⸂εἷς ἐστιν ὁ θεός⸃; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: hi
  text: तुम विश्वास करते हो कि परमेश्वर एक है[a]; तुम अच्छा करते हो। दुष्टात्माएँ भी विश्वास करती हैं—और थरथराती हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक ही परमेश्वर है।” यूनानी वाक्य का अनुवाद दोनों प्रकार से किया जा सकता है; “परमेश्वर एक है” उसके शब्द-विन्यास के अधिक निकट है और सम्भवतः यहूदी एकेश्वरवादी अंगीकार की प्रतिध्वनि है।
    reason: alternative_reading
  - marker: b
    text: या, “काँपती हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: तुम
  rationale: स्पष्ट सर्वनाम संबोधन पर हल्का बल देता है; हिन्दी में ‘तुम’ इसे स्वाभाविक रूप से बनाए रखता है।
- source_word: πιστεύεις / πιστεύουσιν
  choice: विश्वास करते हो / विश्वास करती हैं
  rationale: दोनों स्थानों पर एक ही धातु का प्रयोग यूनानी की महत्त्वपूर्ण शब्द-पुनरावृत्ति को सुरक्षित रखता है और कथन को सत्य मानने के भाव के अनुकूल है।
- source_word: εἷς ἐστιν ὁ θεός
  choice: परमेश्वर एक है
  rationale: यह यूनानी संरचना के निकट है और एकेश्वरवादी अंगीकार की सम्भावित प्रतिध्वनि को बनाए रखता है; ‘एक ही परमेश्वर है’ भी सम्भव है।
- source_word: καλῶς ποιεῖς
  choice: तुम अच्छा करते हो
  rationale: संक्षिप्त स्वीकृति को औपचारिक किंतु सहज हिन्दी में व्यक्त करता है, बिना व्यंग्य को आवश्यकता से अधिक स्पष्ट किए।
- source_word: καὶ τὰ δαιμόνια
  choice: दुष्टात्माएँ भी
  rationale: '‘भी’ यहाँ आरोही बल व्यक्त करता है: यहाँ तक कि दुष्टात्माएँ भी यही विश्वास रखती हैं। ‘दुष्टात्माएँ’ आधुनिक हिन्दी में δαιμόνια का परिचित और अर्थ-संगत रूप है।'
- source_word: φρίσσουσιν
  choice: थरथराती हैं
  rationale: भय से होने वाली तीव्र शारीरिक प्रतिक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; ‘काँपती हैं’ भी सम्भव है।
theological_decisions:
- issue: εἷς ἐστιν ὁ θεός में एकेश्वरवादी अंगीकार का रूप
  choice: परमेश्वर एक है
  alternative: एक ही परमेश्वर है
  rationale: चुना हुआ रूप यूनानी विधेयात्मक संरचना और इस्राएल के एकेश्वरवादी अंगीकार की सम्भावित प्रतिध्वनि के अधिक निकट है, जबकि पादटिप्पणी वैध अस्तित्वसूचक अनुवाद बताती है।
- issue: मनुष्य के विश्वास और दुष्टात्माओं के विश्वास के बीच विरोध
  choice: दुष्टात्माएँ भी विश्वास करती हैं—और थरथराती हैं
  alternative: और दुष्टात्माएँ विश्वास करती और काँपती हैं
  rationale: ‘भी’ तथा दीर्घ विराम याकूब के तीखे आलंकारिक विरोध को उभारते हैं, पर पाठ से आगे बढ़कर विश्वास की कोई संप्रदायगत परिभाषा नहीं जोड़ते।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठक के लिए सहज। ‘परमेश्वर’ बाइबलीय संदर्भ में स्वाभाविक है; वाक्य की संक्षिप्तता और आलंकारिक तीखापन बनाए रखा गया है।
