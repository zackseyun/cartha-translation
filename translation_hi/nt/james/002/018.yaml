  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀλλ’ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου ⸀χωρὶς τῶν ⸀ἔργων, κἀγώ ⸂σοι δείξω⸃ ἐκ τῶν ἔργων μου τὴν ⸀πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: hi
  text: पर कोई कहेगा[a], “तुम्हारे पास विश्वास[b] है और मेरे पास कर्म हैं।” तुम मुझे कर्मों के बिना[c] अपना विश्वास दिखाओ, और मैं तुम्हें अपने कर्मों से[d] अपना विश्वास दिखाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राचीन यूनानी पांडुलिपियों में आधुनिक उद्धरण-चिह्न नहीं थे; इसलिए कुछ व्याख्याकार इसके बाद आने वाली चुनौती को भी उसी व्यक्ति के कथन का भाग समझते हैं।
    reason: quotation_scope
  - marker: b
    text: यूनानी पिस्तिस; इसका अर्थ “भरोसा” और कुछ प्रसंगों में “विश्वासयोग्यता” भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या, “कर्मों से अलग।” यूनानी पदबंध अलगाव अथवा अभाव—दोनों ढंग से व्यक्त किया जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: यहाँ “से” का अर्थ माध्यम (“के द्वारा”) या आधार/स्रोत (“के आधार पर”) हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλ’
  choice: पर
  rationale: यह याकूब के तर्क में आने वाली आपत्ति या विरोधी कथन को स्वाभाविक और संक्षिप्त ढंग से प्रस्तुत करता है।
- source_word: ἐρεῖ τις
  choice: कोई कहेगा
  rationale: भविष्यकालीन क्रिया एक काल्पनिक आपत्तिकर्ता को सामने लाती है; हिन्दी में यह रूप उसकी अलंकारिक शक्ति बनाए रखता है।
- source_word: πίστιν / πίστιν
  choice: विश्वास
  rationale: यह πίστις का स्थापित, प्रसंगानुकूल हिन्दी रूप है और विश्वास तथा कर्मों के बीच याकूब द्वारा रखे गए तनाव को बिना पहले से सुलझाए सुरक्षित रखता है।
- source_word: ἔργα / ἔργων
  choice: कर्म / कर्मों
  rationale: ‘कर्म’ पूरे अनुच्छेद में अवधारणात्मक संगति बनाए रखता है और केवल व्यवसाय या श्रम के बजाय किए गए कामों अथवा आचरण को व्यक्त करता है।
- source_word: δεῖξόν μοι
  choice: तुम मुझे ... दिखाओ
  rationale: आज्ञार्थक क्रिया एक प्रत्यक्ष चुनौती है; ‘दिखाओ’ स्वाभाविक होने के साथ प्रदर्शन की माँग को बनाए रखता है।
- source_word: χωρὶς τῶν ἔργων
  choice: कर्मों के बिना
  rationale: χωρίς अलगाव अथवा अभाव बता सकता है। ‘के बिना’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी वाक्य का अर्थ ठीक से व्यक्त करता है।
- source_word: κἀγώ σοι δείξω
  choice: और मैं तुम्हें ... दिखाऊँगा
  rationale: यह वक्ता के प्रत्युत्तर और यूनानी भविष्यकाल को स्पष्ट रूप से बनाए रखता है।
- source_word: ἐκ τῶν ἔργων μου
  choice: अपने कर्मों से
  rationale: ἐκ यहाँ कर्मों को विश्वास दिखाने के माध्यम या प्रमाण-आधार के रूप में प्रस्तुत कर सकता है; हिन्दी ‘से’ इस अर्थ-व्याप्ति को स्वाभाविक रूप से संभालता है।
- source_word: τὴν πίστιν
  choice: अपना विश्वास
  rationale: यूनानी में possessive सर्वनाम दोहराया नहीं गया, पर कर्ता और समानांतर संरचना से सम्बन्ध स्पष्ट है; हिन्दी में ‘अपना’ आवश्यक और स्वाभाविक है।
theological_decisions:
- issue: विश्वास और कर्मों की बहस में πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; कुछ प्रसंगों में विश्वासयोग्यता
  rationale: ‘विश्वास’ मूल शब्द की व्यापकता और इस पद के धार्मिक तनाव को सुरक्षित रखता है। ‘विश्वासयोग्यता’ चुनना यहाँ अर्थ को समय से पहले नैतिक आचरण की ओर सीमित कर देता।
- issue: काल्पनिक आपत्तिकर्ता के उद्धरण की सीमा
  choice: केवल “तुम्हारे पास विश्वास है और मेरे पास कर्म हैं” को सीधा उद्धरण माना गया है
  alternative: इसके बाद की चुनौती को भी उसी आपत्तिकर्ता के कथन का भाग माना जा सकता है
  rationale: प्राचीन यूनानी पांडुलिपियों में आधुनिक उद्धरण-चिह्न नहीं थे। दिया गया विराम-विन्यास और तर्क की स्वाभाविक गति मुख्य पाठ के चुनाव का समर्थन करते हैं, पर वैकल्पिक सीमा सम्भव है और उसे टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘विश्वास’ और ‘कर्म’ जैसे परिचित धार्मिक शब्दों को बनाए रखते हुए वाक्य-रचना सामान्य हिन्दी पाठक के लिए सहज बनाई गई है।
