  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: hi
  text: क्योंकि यदि तुम्हारी सभा[a] में सोने की अंगूठियाँ और चमकीले वस्त्र पहने एक आदमी प्रवेश करे, और गंदे वस्त्र पहने एक गरीब आदमी भी प्रवेश करे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदी आराधनालय”; यूनानी शब्द συναγωγή (सुनागोगे) का मूल अर्थ “सभा” है और यह “आराधनालय” के लिए भी प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγήν
  choice: सभा
  rationale: यह शब्द आराधना या सामुदायिक जमावड़े को सूचित करता है। संदर्भ में ‘सभा’ स्वाभाविक है और किसी औपचारिक यहूदी संस्था का अर्थ अनावश्यक रूप से आरोपित नहीं करता; शाब्दिक विकल्प ‘आराधनालय’ पादटिप्पणी में रखा गया है।
- source_word: ἀνὴρ
  choice: कोई पुरुष
  rationale: यूनानी शब्द स्पष्ट रूप से पुल्लिंग एकवचन है; ‘पुरुष’ उस व्याकरणिक और चित्रात्मक विशेषता को बनाए रखता है।
- source_word: χρυσοδακτύλιος
  choice: सोने की अंगूठियाँ ... पहने
  rationale: इस विशेषण का भाव उँगलियों पर सोने के आभूषण धारण करना है। बहुवचन ‘अंगूठियाँ’ संभावित सामान्य अर्थ और धन के दिखावे की छवि को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐσθῆτι λαμπρᾷ
  choice: चमकीले वस्त्र
  rationale: λαμπρός में चमकदार, भव्य या शानदार होने का भाव है; ‘चमकीले’ दृश्य प्रभाव को बनाए रखता है और प्रसंग में समृद्ध पहनावे का संकेत देता है।
- source_word: πτωχὸς
  choice: कोई निर्धन पुरुष
  rationale: यह पुल्लिंग एकवचन में संज्ञा के समान प्रयुक्त विशेषण है और पहले पुरुष के समानांतर है। ‘निर्धन’ सम्मानजनक आधुनिक हिन्दी में आर्थिक दशा स्पष्ट करता है।
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: मैले वस्त्र
  rationale: ῥυπαρός गंदे या मैल से भरे होने का प्रबल भाव रखता है। ‘मैले’ प्राकृतिक हिन्दी है और ‘फटे-पुराने’ जैसा अस्रोतगत अर्थ नहीं जोड़ता।
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: आए ... भी आए
  rationale: हिन्दी में किसी सभा में प्रवेश के लिए ‘आए’ स्वाभाविक है; दोनों स्थानों पर इसकी पुनरावृत्ति यूनानी की समानांतर संरचना बनाए रखती है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का उदाहरण देकर स्पष्टीकरण आरम्भ करता है; ‘क्योंकि’ उस तार्किक संबंध को स्पष्ट और सहज हिन्दी में दर्शाता है।
theological_decisions:
- issue: मसीही संदर्भ वाले पत्र में συναγωγή का अनुवाद
  choice: सभा
  alternative: आराधनालय
  rationale: पद कलीसियाई व्यवस्था पर कोई सिद्धान्त निर्धारित नहीं करता। ‘सभा’ एकत्र समुदाय के अर्थ को व्यक्त करता है, जबकि यूनानी शब्द की शाब्दिक यहूदी-पृष्ठभूमि वाली संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। काल्पनिक शर्त के लिए ‘यदि ... आए’ रखा गया है। ‘पुरुष’ मूल के पुल्लिंग एकवचन को और ‘मैले वस्त्र’ सामाजिक विरोध को बिना अनावश्यक विस्तार के बनाए रखते हैं।
