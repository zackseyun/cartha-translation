id: JAS.2.25
reference: James 2:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: hi
  text: और इसी प्रकार, क्या राहाब वेश्या भी कामों से धर्मी नहीं ठहराई गई[a], जब उसने उन दूतों[b] का स्वागत किया और उन्हें दूसरे मार्ग से विदा किया?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धर्मी सिद्ध हुई” अथवा “धर्मी घोषित की गई।” यूनानी में “धर्मी ठहराई गई” है; यहाँ उसके आशय से जुड़ी धर्मवैज्ञानिक बहस को हल किए बिना वही शब्दावली रखी गई है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “दूतों”; संदर्भ राहाब द्वारा ग्रहण किए गए मनुष्यों का है (यहोशू 2), स्वर्गदूतों का नहीं।
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: और इसी प्रकार ... भी
  rationale: यह पद अब्राहम के पिछले उदाहरण से तुलना करते हुए राहाब को दूसरे उदाहरण के रूप में जोड़ता है; यह अनुवाद संयोजक और समावेशी दोनों बलों को स्वाभाविक हिन्दी में रखता है।
- source_word: Ῥαὰβ
  choice: राहाब
  rationale: यह नाम हिन्दी बाइबल परंपरा में प्रचलित रूप में लिप्यंतरित किया गया है।
- source_word: ἡ πόρνη
  choice: वेश्या
  rationale: πόρνη का सीधा अर्थ वेश्या है; यह आधुनिक हिन्दी में स्पष्ट है और यूनानी शब्द के सामाजिक तथा नैतिक भार को बनाए रखता है।
- source_word: οὐκ ... ἐδικαιώθη
  choice: धर्मी नहीं ठहराई गई
  rationale: δικαιόω के निष्क्रिय रूप के लिए यह हिन्दी का स्वाभाविक और परंपरागत समतुल्य है। यह वाक्य को केवल ‘धर्मी सिद्ध हुई’ या केवल न्यायिक घोषणा तक सीमित नहीं करता।
- source_word: ἐξ ἔργων
  choice: कामों से
  rationale: ἐκ के साथ संबंध यहाँ साधन या आधार को व्यक्त करता है। ‘कामों से’ संक्षिप्त है और याकूब 2 के निकटवर्ती तर्क से शब्दगत संबंध बनाए रखता है।
- source_word: ὑποδεξαμένη
  choice: जब उसने ... का स्वागत किया
  rationale: कृदंत आतिथ्यपूर्वक ग्रहण करने का भाव देता है; ‘स्वागत किया’ आधुनिक हिन्दी में स्वाभाविक है और ‘जब’ मुख्य क्रिया से उसका परिस्थितिजन्य संबंध स्पष्ट करता है।
- source_word: τοὺς ἀγγέλους
  choice: उन दूतों
  rationale: ἄγγελος का अर्थ दूत या स्वर्गदूत हो सकता है। यहोशू 2 के प्रसंग में ये मनुष्य हैं, इसलिए ‘दूत’ उपयुक्त है; ‘जासूस’ संदर्भगत पहचान है, पर यूनानी शब्द का सीधा अर्थ नहीं।
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: और उन्हें दूसरे मार्ग से विदा किया
  rationale: यहाँ ἐκβάλλω बलपूर्वक निकालने के बजाय बाहर भेजने या विदा करने के अर्थ में है। ‘दूसरे मार्ग से’ ἑτέρᾳ ὁδῷ के भेदसूचक भाव को सुरक्षित रखता है।
theological_decisions:
- issue: याकूब 2:25 में विश्वास और कामों के संबंध में δικαιόω का अर्थ
  choice: मुख्य पाठ में ‘धर्मी ठहराई गई’ रखा गया है, बिना इसे केवल आरंभिक न्यायिक धर्मीकरण या बाद में धर्मी सिद्ध होने तक सीमित किए।
  alternative: ‘धर्मी सिद्ध हुई’ अथवा ‘धर्मी घोषित की गई।’
  rationale: याकूब धर्मी ठहराए जाने और कामों के बीच तनावपूर्ण संबंध को बनाए रखता है। किसी एक धर्मवैज्ञानिक प्रणाली की ओर अर्थ को संकुचित न करते हुए मुख्य पाठ यूनानी शब्द और आसपास के तर्क से संबंध बनाए रखता है; संभावित अर्थभेद पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, स्पष्ट और गरिमापूर्ण रखी गई है। ‘कामों से धर्मी ठहराई गई’ जैसी प्रमुख धर्मवैज्ञानिक शब्दावली याकूब के तर्क और उसकी वास्तविक अर्थगत तनातनी को सुरक्षित रखती है।
