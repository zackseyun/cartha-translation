  text: ἡ γὰρ κρίσις ἀνέλεος τῷ μὴ ποιήσαντι ἔλεος· κατακαυχᾶται ⸀ἔλεος κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: hi
  text: क्योंकि जिसने दया नहीं दिखाई, उसके लिए न्याय बिना दया के होगा; दया न्याय पर विजय पाती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दया न्याय पर गर्व करती है।” यूनानी क्रिया में किसी के विरुद्ध गर्व करने या उसके ऊपर जय मनाने का भाव हो सकता है; यहाँ उसका भावार्थ “विजय पाती है” किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: न्याय
  rationale: यहाँ शब्द ईश्वरीय अथवा न्यायिक निर्णय को दर्शाता है। दोनों स्थानों पर ‘न्याय’ रखने से पद का आंतरिक विरोध और पुनरावृत्ति सुरक्षित रहती है।
- source_word: ἀνέλεος
  choice: बिना दया के
  rationale: विधेय विशेषण की शक्ति बनाए रखते हुए यह सहज आधुनिक हिन्दी है और ἔλεος के साथ शब्दगत संबंध स्पष्ट रखती है।
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: जिसने दया नहीं की
  rationale: ποιέω के साथ ἔλεος का अर्थ मुहावरे के रूप में दया करना या दिखाना है। यह अनुवाद स्वाभाविक है और नैतिक प्रत्युत्तर का भाव बनाए रखता है।
- source_word: κατακαυχᾶται
  choice: विजय पाती है
  rationale: क्रिया का मूल चित्र किसी के विरुद्ध गर्व करने या जय मनाने का है; प्रसंग में ‘विजय पाती है’ उसकी अलंकारिक शक्ति को सुबोध हिन्दी में व्यक्त करता है।
- source_word: ἔλεος
  choice: दया
  rationale: यह सामान्य, गरिमापूर्ण और प्रसंगानुकूल हिन्दी है तथा पूरे पद में एक ही प्रमुख अवधारणा को बनाए रखती है।
theological_decisions:
- issue: अंतिम वाक्यांश κατακαυχᾶται ἔλεος κρίσεως का आशय
  choice: 'सामान्य और संक्षिप्त कथन: ‘दया न्याय पर विजय पाती है।’'
  alternative: ‘दया न्याय के सामने गर्व करती है’ अथवा दयालु व्यक्ति की दिखाई हुई दया न्याय के समय प्रबल होती है।
  rationale: यूनानी वाक्य जानबूझकर संक्षिप्त है और यह स्पष्ट नहीं करता कि मुख्य बल परमेश्वर की दया पर है, न्याय में कार्यरत दया पर, या मनुष्य द्वारा दिखाई गई दया के प्रमाण पर। अनुवाद इस तनाव को किसी कर्म-आधारित सिद्धान्त में नहीं बदलता।
