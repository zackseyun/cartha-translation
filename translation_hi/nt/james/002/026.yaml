source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: hi
  text: क्योंकि जिस प्रकार आत्मा[a] के बिना शरीर मरा हुआ है, उसी प्रकार कर्मों के बिना विश्वास[b] भी मरा हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘प्राण’ अथवा ‘साँस।’ यूनानी शब्द का अर्थ ‘आत्मा,’ ‘प्राण’ या ‘साँस’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘भरोसा’ अथवा ‘निष्ठा।’ यूनानी शब्द ‘भरोसा’ या ‘निष्ठा’ का भाव भी व्यक्त कर सकता है; यहाँ मुख्य पाठ में ‘विश्वास’ रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: क्योंकि जैसे
  rationale: γάρ पिछले तर्क का कारण या स्पष्टीकरण देता है, और ὥσπερ तुलना का पहला भाग आरम्भ करता है; यह संयोजन हिन्दी में दोनों संबंधों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ σῶμα
  choice: शरीर
  rationale: भौतिक शरीर के लिए सीधा और सामान्य हिन्दी समतुल्य।
- source_word: χωρὶς πνεύματος
  choice: आत्मा के बिना
  rationale: χωρίς का अर्थ ‘बिना/से अलग’ है। πνεῦμα यहाँ शरीर को जीवन देने वाली आत्मा का बोध करा सकता है; ‘प्राण’ या ‘साँस’ भी सम्भव हैं, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: νεκρόν ἐστιν / νεκρά ἐστιν
  choice: मरा हुआ है
  rationale: दोनों बार आए समान विधेय विशेषण की पुनरावृत्ति और उसके प्रबल अर्थ को सुरक्षित रखता है।
- source_word: οὕτως καὶ
  choice: वैसे ही … भी
  rationale: तुलना के अनुरूप दूसरे भाग को स्पष्ट करता है और καί के समावेशी बल को बनाए रखता है।
- source_word: ἡ πίστις
  choice: विश्वास
  rationale: πίστις का इस तर्क में स्वाभाविक और प्रचलित हिन्दी अनुवाद; ‘विश्वासयोग्यता’ जैसी सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: χωρὶς ἔργων
  choice: कर्मों के बिना
  rationale: ἔργα के लिए ‘कर्म’ याकूब के पूरे तर्क और व्यापक बाइबलीय शब्दावली से संबंध बनाए रखता है।
theological_decisions:
- issue: उपमा में πνεύματος का अर्थ
  choice: आत्मा
  alternative: प्राण या साँस
  rationale: मूल यूनानी शब्द के आत्मिक और जीवनदायी अर्थ-क्षेत्र को बनाए रखते हुए शरीर में जीवन न रहने की उपमा व्यक्त होती है; ‘प्राण/साँस’ की वास्तविक शाब्दिक सम्भावना पादटिप्पणी में दी गई है।
- issue: याकूब 2:26 में πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता या भरोसा
  rationale: मुख्य पाठ में सामान्य अर्थ ‘विश्वास’ रखा गया है, जबकि शब्द की व्यापक अर्थ-सीमा को बिना किसी धर्मवैज्ञानिक विवाद को एकतरफा हल किए पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जैसे … वैसे ही’ मूल उपमा की समानांतर संरचना को स्पष्ट करता है, और ‘मरा हुआ है’ की पुनरावृत्ति मूल के आलंकारिक बल को सुरक्षित रखती है।
