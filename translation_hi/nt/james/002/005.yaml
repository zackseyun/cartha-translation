id: JAS.2.5
reference: James 2:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: hi
  text: 'मेरे प्रिय भाइयो[a], सुनो: क्या परमेश्वर ने उन्हें नहीं चुना जो संसार की दृष्टि में गरीब[b] हैं, कि वे विश्वास[c] में धनी और उस राज्य के वारिस हों, जिसकी प्रतिज्ञा उसने उनसे की है जो उससे प्रेम करते हैं?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे प्रिय भाइयो और बहनो”; यूनानी में “भाइयो” है, पर यह संबोधन पूरी विश्वासी संगति को समावेशी रूप से संबोधित कर सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से “संसार के संबंध में गरीब”; अर्थ “सांसारिक मानदंडों के अनुसार गरीब” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “विश्वास” का अनुवाद “भरोसा” या, यहाँ कम संभावित रूप से, “विश्वासयोग्यता” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक क्रिया सीधे ध्यान देने का आह्वान करती है; ‘सुनो’ आधुनिक हिन्दी में स्वाभाविक और प्रभावपूर्ण है।
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: मेरे प्रिय भाइयो
  rationale: सम्बोधन में यूनानी पुल्लिंग बहुवचन को बनाए रखते हुए ἀγαπητοί का स्वाभाविक अनुवाद ‘प्रिय’ किया गया है; पूरी विश्वासी संगति के समावेश की सम्भावना पादटिप्पणी में दी गई है।
- source_word: οὐχ ὁ θεὸς ἐξελέξατο
  choice: क्या परमेश्वर ने ... नहीं चुना
  rationale: οὐχ ऐसा आलंकारिक प्रश्न आरम्भ करता है जिसका अपेक्षित उत्तर सकारात्मक है। हिन्दी में ‘क्या ... नहीं’ उसी बल को स्पष्ट रखता है।
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: उन्हें ... जो संसार की दृष्टि में गरीब हैं
  rationale: 'τῷ κόσμῳ को सम्बन्ध अथवा मानदण्ड के अर्थ में समझना प्रसंगानुकूल है: वे सांसारिक मूल्यांकन के अनुसार गरीब हैं। यह हिन्दी में ‘संसार में गरीब’ की सम्भावित भौगोलिक अस्पष्टता से बचता है।'
- source_word: πλουσίους ἐν πίστει
  choice: विश्वास में धनी
  rationale: πίστις का यहाँ सर्वाधिक स्वाभाविक अर्थ ‘विश्वास’ है और यह सांसारिक गरीबी के विपरीत आत्मिक धन को व्यक्त करता है; अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: κληρονόμους τῆς βασιλείας
  choice: राज्य के वारिस
  rationale: ‘वारिस’ κληρονόμος के पारिवारिक और उत्तराधिकार-सम्बन्धी भाव को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἧς ἐπηγγείλατο
  choice: जिसकी प्रतिज्ञा उसने ... की है
  rationale: सम्बन्धवाचक सर्वनाम का पूर्वपद ‘राज्य’ है। पूर्ण वर्तमान हिन्दी में प्रतिज्ञा की वर्तमान प्रासंगिकता स्वाभाविक रूप से व्यक्त होती है, बिना यूनानी काल-पक्ष पर अनावश्यक आग्रह के।
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: अपने प्रेम रखने वालों से
  rationale: प्रतिज्ञा करना के साथ हिन्दी में ‘से’ स्वाभाविक है; वर्तमान कृदन्त उन लोगों की चरित्रगत पहचान बताता है जो परमेश्वर से प्रेम रखते हैं।
theological_decisions:
- issue: परमेश्वर के चुनने का सम्भावित सिद्धान्तगत अतिपाठ
  choice: ἐξελέξατο का सीधा अनुवाद ‘चुना’ रखा गया है।
  alternative: ऐसी व्याख्यात्मक भाषा जोड़ना जो पूर्वनियति के किसी विकसित सिद्धान्त को प्रमुख बनाए।
  rationale: यह पद गरीबों के प्रति परमेश्वर के मूल्यांकन और पक्षपात की असंगति पर बल देता है; अनुवाद को बाद की सिद्धान्तगत बहस का निर्णय नहीं करना चाहिए।
- issue: ἀδελφοί का दायरा
  choice: मुख्य पाठ में ‘भाइयो’ रखा गया है और सम्भावित समावेशी दायरा पादटिप्पणी में बताया गया है।
  alternative: मुख्य पाठ में ‘भाइयो और बहनो’ करना।
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन है, यद्यपि पत्रीय सम्बोधन में वह सम्भवतः पूरी विश्वासी संगति को सम्मिलित करता है।
- issue: πίστις का अर्थ
  choice: मुख्य पाठ में ‘विश्वास’।
  alternative: ‘भरोसा’ या, यहाँ कम सम्भावित रूप से, ‘विश्वासयोग्यता’।
  rationale: ‘विश्वास में धनी’ इस रचना और प्रसंग में सर्वाधिक स्वाभाविक है, पर वास्तविक शब्दार्थ-सम्भावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘मेरे प्रिय भाइयो, सुनो’ हिन्दी में स्वाभाविक सम्बोधन-क्रम है। ‘संसार की दृष्टि में’ स्रोत के सम्बन्ध/मानदण्ड वाले दत्तिव को स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप को सुरक्षित रखती है।
