reference: James 2:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: hi
  text: और पवित्रशास्त्र का वह वचन पूरा हुआ जो कहता है, “अब्राहम ने परमेश्वर की बात पर विश्वास किया, और यह उसके लिए धार्मिकता गिना गया,”[a] और वह परमेश्वर का मित्र कहलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके खाते में धार्मिकता के रूप में दर्ज किया गया”; यूनानी क्रिया का अर्थ “श्रेय दिया गया” या “लेखे में गिना गया” भी हो सकता है।
    reason: λoγίζομαι में गिनने, लेखे में रखने या श्रेय देने की अर्थ-छटा को दिखाने के लिए।
lexical_decisions:
- source_word: ἐπληρώθη
  choice: पूरा हुआ
  rationale: पवित्रशास्त्र के वचन के संबंध में प्रयुक्त इस कर्मवाच्य रूप का स्वाभाविक हिन्दी अनुवाद ‘पूरा हुआ’ है; यह याकूब के इस कथन को बनाए रखता है कि उद्धृत वचन अब्राहम के जीवन में अपनी पूर्ति तक पहुँचा।
- source_word: ἡ γραφή ἡ λέγουσα
  choice: पवित्रशास्त्र का यह वचन ... जो कहता है
  rationale: γραφή यहाँ पवित्र माने गए लिखित वचन को दर्शाता है। हिन्दी में उद्धृत विशिष्ट कथन के लिए ‘पवित्रशास्त्र का यह वचन’ स्पष्ट और स्वाभाविक है।
- source_word: Ἐπίστευσεν ... τῷ θεῷ
  choice: अब्राहम ने परमेश्वर पर विश्वास किया
  rationale: यूनानी में πιστεύω के साथ संप्रदान कारक परमेश्वर की बात को विश्वसनीय मानने और उन पर भरोसा करने का भाव देता है। आधुनिक हिन्दी में ‘पर विश्वास किया’ सबसे स्वाभाविक है और केवल परमेश्वर के अस्तित्व में विश्वास करने तक सीमित नहीं है।
- source_word: ἐλογίσθη αὐτῷ
  choice: यह उसके लिए ... गिना गया
  rationale: λογίζομαι का कर्मवाच्य रूप लेखे में मानने या श्रेय देने का भाव रखता है। ‘उसके लिए ... गिना गया’ इस अर्थ को स्रोत के निकट और समझने योग्य ढंग से व्यक्त करता है।
- source_word: εἰς δικαιοσύνην
  choice: धार्मिकता
  rationale: उत्पत्ति के उद्धरण और इस प्रसंग में δικαιοσύνη व्यक्ति के परमेश्वर के सामने धर्मी माने जाने की स्थिति से संबंधित है; ‘धार्मिकता’ इस शब्द की पारंपरिक तथा प्रसंगानुकूल हिन्दी अभिव्यक्ति है।
- source_word: φίλος θεοῦ
  choice: परमेश्वर का मित्र
  rationale: यह संबंधसूचक पद का सीधा और स्वाभाविक हिन्दी रूप है तथा संबंध के स्वरूप को आवश्यकता से अधिक परिभाषित नहीं करता।
- source_word: ἐκλήθη
  choice: कहलाया
  rationale: καλέω का कर्मवाच्य यहाँ किसी पदनाम या मान्यता को व्यक्त करता है। ‘कहलाया’ इस व्यापकता को सुरक्षित रखता है।
theological_decisions:
- issue: अब्राहम के विश्वास और कर्मों का संबंध
  choice: ‘पवित्रशास्त्र का यह वचन पूरा हुआ’ को उसके पूर्ण बल के साथ रखा गया है, बिना यह बताए कि पूर्ति का सैद्धांतिक तंत्र क्या था।
  alternative: पूर्ति को केवल पूर्वकथन की सिद्धि मानना, अथवा कर्मों को विश्वास का स्थान लेने वाला आधार बना देना।
  rationale: याकूब उत्पत्ति 15:6 के विश्वास-वचन को अब्राहम की बाद की आज्ञाकारिता से जोड़ता है। अनुवाद इस तनाव को बनाए रखता है और औचित्य-ठहराए जाने संबंधी किसी साम्प्रदायिक निष्कर्ष को पाठ में नहीं जोड़ता।
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय; धर्मी ठहराया जाना
  rationale: यहाँ संज्ञा δικαιοσύνη का अनुवाद संज्ञा के रूप में रखना स्रोत-संगत है। ‘न्याय’ प्रसंगानुकूल नहीं, और ‘धर्मी ठहराया जाना’ व्याख्यात्मक विस्तार होगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘पवित्रशास्त्र’, ‘धार्मिकता’ और ‘परमेश्वर’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं; वाक्य-विन्यास को हिन्दी में स्वाभाविक रखने के साथ यूनानी उद्धरण-सूत्र की संरचना सुरक्षित रखी गई है।
