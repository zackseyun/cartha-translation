  text: βλέπεις ὅτι ἡ πίστις συνήργει τοῖς ἔργοις αὐτοῦ καὶ ἐκ τῶν ἔργων ἡ πίστις ἐτελειώθη,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/022.yaml
  text: You see that faith was working together with his works[b][a], and by the works faith was brought to completion.
translation:
  language: hi
  text: तुम देखते हो कि विश्वास[a] उसके कामों के साथ मिलकर कार्य कर रहा था, और उन कामों के द्वारा विश्वास को पूर्ण किया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विश्वासयोग्यता’ अथवा ‘भरोसा’; यूनानी πίστις के ये अर्थ भी हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘पूर्णता तक पहुँचाया गया’ अथवा ‘परिपक्व बनाया गया’; यूनानी क्रिया का अर्थ अपने निर्धारित लक्ष्य या परिपक्वता तक पहुँचना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: तुम देखते हो
  rationale: वर्तमानकाल, कर्तृवाच्य, एकवचन संबोधन को सीधे और स्वाभाविक रूप में रखता है तथा याकूब की तर्कपूर्ण संबोधन-शैली को बनाए रखता है।
- source_word: πίστις
  choice: विश्वास
  rationale: संदर्भ में अब्राहम के विश्वास और उसके कामों के संबंध की चर्चा है। ‘विश्वास’ प्रचलित और व्यापक अर्थ को बनाए रखता है, जबकि अन्य संभव अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: συνήργει
  choice: साथ मिलकर कार्य कर रहा था
  rationale: अपूर्ण भूतकाल की जारी क्रिया और συνεργέω में निहित ‘साथ कार्य करने’ के भाव—दोनों को व्यक्त करता है।
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: उसके कामों के साथ
  rationale: सहयोग के संबंध को ‘के साथ’ से स्पष्ट किया गया है। ‘काम’ याकूब के पूरे तर्क में ἔργον के लिए सहज और संगत शब्द है।
- source_word: ἐκ τῶν ἔργων
  choice: उन कामों के द्वारा
  rationale: ἐκ को यहाँ साधन अथवा वह माध्यम समझा गया है जिसके द्वारा विश्वास अपने लक्ष्य तक पहुँचा; ‘के द्वारा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐτελειώθη
  choice: पूर्णता तक पहुँचाया गया
  rationale: τελειόω के निष्क्रिय रूप और उसके लक्ष्य अथवा परिपक्व पूर्णता तक पहुँचने के भाव को बनाए रखता है, बिना यह अनावश्यक संकेत दिए कि विश्वास पहले नैतिक रूप से दोषपूर्ण था।
theological_decisions:
- issue: विश्वास और कामों का संबंध
  choice: पाठ स्पष्ट रूप से कहता है कि विश्वास कामों के साथ मिलकर कार्य कर रहा था और कामों के द्वारा पूर्णता तक पहुँचाया गया।
  alternative: काम केवल मनुष्यों के सामने विश्वास को प्रमाणित करते हैं; अथवा काम विश्वास को परिपक्व करते हैं; अथवा वे विश्वास की आवश्यक अभिव्यक्ति के रूप में उसके साथ सहयोग करते हैं।
  rationale: यूनानी पाठ सहयोग और पूर्णता की बात करता है, पर यहाँ औचित्य-ठहराए जाने की कोई संपूर्ण सिद्धान्तगत व्याख्या नहीं देता। अनुवाद इस तनाव को किसी सम्प्रदायगत निष्कर्ष से नहीं सुलझाता।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता; भरोसा
  rationale: ‘विश्वास’ इस प्रसंग और याकूब 2 के विमर्श से मेल खाता है तथा शब्द की मानक धार्मिक पहचान बनाए रखता है; संबंधित वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और तर्कपूर्ण लहजा रखा गया है। एकवचन ‘तुम’ मूल पाठ के सीधे संबोधन को सुरक्षित रखता है। ‘काम’ को पूरे वाक्य में एकरूप रखा गया है, और ‘पूर्णता तक पहुँचाया गया’ मूल निष्क्रिय क्रिया तथा उसके लक्ष्यपरक अर्थ को व्यक्त करता है।
