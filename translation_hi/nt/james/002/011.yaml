id: JAS.2.11
reference: James 2:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: hi
  text: क्योंकि जिसने कहा, “व्यभिचार न करना,” उसी ने यह भी कहा, “हत्या न करना।” अब यदि तुम व्यभिचार नहीं करते, पर हत्या करते हो, तो तुम व्यवस्था का उल्लंघन करनेवाले बन गए हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: जिसने कहा
  rationale: लेखयुक्त कृदन्त यहाँ संज्ञा की तरह प्रयुक्त है। “जिसने कहा” मूल के व्यक्तिगत संकेत को बनाए रखता है, पर वक्ता के रूप में “परमेश्वर” को स्पष्टतः जोड़ता नहीं।
- source_word: Μὴ μοιχεύσῃς
  choice: व्यभिचार न करना
  rationale: μή के साथ aorist subjunctive निषेधाज्ञा व्यक्त करता है और दस आज्ञाओं की भाषा की प्रतिध्वनि है। यह रूप आधुनिक हिन्दी में उद्धृत आज्ञा के लिए स्वाभाविक और गरिमापूर्ण है।
- source_word: καί
  choice: यह भी
  rationale: यह उसी वक्ता द्वारा दी गई दूसरी आज्ञा को जोड़ता है; “यह भी” तर्कगत संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: Μὴ φονεύσῃς
  choice: हत्या न करना
  rationale: φονεύω का आशय सामान्यतः किसी भी प्रकार जान लेने के बजाय हत्या करना है; इसलिए “हत्या” मूल की नैतिक और विधिक विशिष्टता बनाए रखता है।
- source_word: εἰ δὲ
  choice: अब यदि
  rationale: यह काल्पनिक उदाहरण की ओर तर्कगत संक्रमण दिखाता है। “अब यदि” आधुनिक हिन्दी में प्रवाहपूर्ण है।
- source_word: οὐ μοιχεύεις ... φονεύεις δέ
  choice: तुम व्यभिचार नहीं करते, पर हत्या करते हो
  rationale: वर्तमानकालिक क्रियाओं को सामान्य परिस्थिति के रूप में रखा गया है और δέ का विरोध “पर” से व्यक्त किया गया है।
- source_word: γέγονας
  choice: बन गए हो
  rationale: γίνομαι के perfect रूप में किसी स्थिति में आ जाने और अब उसी स्थिति में होने का भाव है; “बन गए हो” इस परिणामकारी पक्ष को सुरक्षित रखता है।
- source_word: παραβάτης νόμου
  choice: व्यवस्था का उल्लंघन करनेवाले
  rationale: παραβάτης सीमा या आज्ञा का उल्लंघन करने वाले व्यक्ति को सूचित करता है। यह चयन विधिक-नैतिक भाव और पूरी व्यवस्था के साथ संबंध बनाए रखता है।
- source_word: νόμου
  choice: व्यवस्था
  rationale: संदर्भ में यह अभी उद्धृत ईश्वरीय आज्ञाओं से प्रकट मान्य व्यवस्था को दर्शाता है। हिन्दी बाइबिलीय प्रयोग में “व्यवस्था” νόμος का स्वाभाविक और परिचित समतुल्य है।
theological_decisions:
- issue: आज्ञाओं के वक्ता की पहचान
  choice: “जिसने कहा” रखा गया; मुख्य पाठ में “परमेश्वर” नहीं जोड़ा गया।
  alternative: “क्योंकि परमेश्वर ने कहा”
  rationale: संदर्भ में वक्ता परमेश्वर हैं, किंतु यूनानी पाठ उन्हें स्पष्ट संज्ञा से नहीं, बल्कि “जिसने कहा” के रूप में व्यक्त करता है। यह अनुवाद मूल की अभिव्यक्ति और निहितार्थ दोनों को बनाए रखता है।
- issue: व्यवस्था के उल्लंघन का दायरा
  choice: “व्यवस्था का उल्लंघन करनेवाले”
  alternative: “उस आज्ञा का उल्लंघन करनेवाले”
  rationale: याकूब का तर्क उल्लंघन को केवल एक पृथक आज्ञा तक सीमित नहीं करता, बल्कि व्यक्ति को व्यवस्था का उल्लंघनकर्ता ठहराता है। इसलिए मूल के व्यापक विधिक-नैतिक बल को बनाए रखा गया है।
- issue: हत्या और सामान्य रूप से जान लेने का भेद
  choice: “हत्या”
  alternative: “मारना”
  rationale: φονεύω अन्यायपूर्ण मानव-वध अथवा हत्या को सूचित करता है। “मारना” अनावश्यक रूप से व्यापक अर्थ दे सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, जिसमें बाइबिलीय गरिमा और सामान्य पाठक के लिए स्पष्टता का संतुलन रखा गया है। आज्ञाओं के लिए “न करना” और νόμος के लिए परिचित “व्यवस्था” चुना गया है। किसी पाद-टिप्पणी की आवश्यकता नहीं पड़ी।
