  text: So speak and so act as those who are going to be judged through the law of freedom.
translation:
  language: hi
  text: इस तरह बोलो और इस तरह काम करो, उन लोगों के समान जिनका न्याय स्वतंत्रता की व्यवस्था के द्वारा होने वाला है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε
  choice: इस तरह बोलो और इस तरह काम करो
  rationale: दोनों समानांतर आज्ञार्थक क्रियाओं और οὕτως की पुनरावृत्ति को स्पष्ट, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: νόμου ἐλευθερίας
  choice: स्वतंत्रता की व्यवस्था
  rationale: νόμος के लिए प्रसंगानुकूल पारंपरिक 'व्यवस्था' और ἐλευθερία के संबंधवाचक रूप को अक्षुण्ण रखता है।
- source_word: διὰ νόμου
  choice: व्यवस्था के द्वारा
  rationale: διά के साधन अथवा माध्यम-सूचक बल को व्यक्त करता है और इसे केवल 'व्यवस्था के अनुसार' या 'व्यवस्था से' कहकर सीमित नहीं करता।
- source_word: μέλλοντες κρίνεσθαι
  choice: जिनका न्याय ... होने वाला है
  rationale: μέλλω के भावी आशय और κρίνεσθαι के कर्मवाच्य अर्थ, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: न्याय में स्वतंत्रता की व्यवस्था की भूमिका
  choice: स्वतंत्रता की व्यवस्था के द्वारा
  alternative: स्वतंत्रता की व्यवस्था के अनुसार / स्वतंत्रता की व्यवस्था से
  rationale: मूल पाठ का διά + संबंधकारक सामान्यतः माध्यम या साधन दर्शाता है। अनुवाद इस संबंध को ज्यों का त्यों रखता है और यह तय नहीं करता कि व्यवस्था न्याय का मानदंड है, माध्यम है, या दोनों।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण आज्ञार्थक शैली। 'जैसे वे लोग' से ὡς + participle का तुलनात्मक भाव स्वाभाविक रूप में व्यक्त हुआ है।
