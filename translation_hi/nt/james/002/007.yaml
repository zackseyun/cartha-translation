base_translation:
  language: en
  yaml_path: translation/nt/james/002/007.yaml
  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: hi
  text: क्या वे स्वयं उस आदरणीय नाम की निन्दा नहीं करते, जो तुम्हारे ऊपर पुकारा गया है?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भला नाम’ अथवा ‘श्रेष्ठ नाम’।
    reason: lexical_alternative
  - marker: b
    text: या ‘जो तुम्हारे ऊपर उच्चारित किया गया है’; यह वाक्यांश सम्भवतः उस नाम की ओर संकेत करता है जिससे विश्वासियों की पहचान होती है, और इसमें वाचा या बपतिस्मा की भाषा की प्रतिध्वनि हो सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: क्या वे स्वयं ... नहीं करते
  rationale: οὐκ के साथ बलसूचक αὐτοὶ ऐसा आलंकारिक प्रश्न बनाता है जिसका अपेक्षित उत्तर ‘हाँ’ है; ‘वे स्वयं’ उन्हीं लोगों पर जोर बनाए रखता है जिनका अभी उल्लेख हुआ है।
- source_word: βλασφημοῦσιν
  choice: निन्दा करते
  rationale: यह क्रिया अपमानजनक या ईशनिन्दात्मक वाणी को व्यक्त कर सकती है। ‘निन्दा’ आधुनिक हिन्दी में सहज है और यहाँ नाम के धार्मिक अनादर का प्रबल भाव बनाए रखती है।
- source_word: τὸ καλὸν ὄνομα
  choice: उस उत्तम नाम
  rationale: καλός यहाँ अच्छे के साथ आदरणीय, श्रेष्ठ या महान होने का भाव देता है। ‘उत्तम नाम’ मूल की व्यापकता बनाए रखता है और उसका अभिप्राय सीधे मसीह का नाम कहकर सीमित नहीं करता।
- source_word: τὸ ἐπικληθὲν
  choice: जो ... पुकारा गया है
  rationale: ἐπικαλέω का निष्क्रिय कृदन्त किसी व्यक्ति पर नाम पुकारे जाने की क्रिया व्यक्त करता है। यह रूप मूल के निष्क्रिय और अनुष्ठानिक अथवा पहचानसूचक स्वर को बनाए रखता है।
- source_word: ἐφ’ ὑμᾶς
  choice: तुम्हारे ऊपर
  rationale: ἐπί के साथ यह पदबंध शाब्दिक रूप से नाम के किसी पर या उसके ऊपर पुकारे जाने का मुहावरा है। ‘तुम्हारे ऊपर’ वाचा, अधिकार या पहचान की सम्भावित प्रतिध्वनि को बिना स्पष्ट किए सुरक्षित रखता है।
theological_decisions:
- issue: ‘उत्तम नाम’ का अभिप्राय
  choice: विश्वासियों पर पुकारे गए आदरणीय नाम का जानबूझकर व्यापक उल्लेख, जिसका सबसे सम्भावित संकेत यीशु/प्रभु के नाम की ओर है
  alternative: सीधे ‘मसीह का नाम’, ‘परमेश्वर का नाम’, या सामान्यतः विश्वासियों की मसीही पहचान
  rationale: यूनानी पाठ यहाँ यीशु का नाम स्पष्ट रूप से नहीं देता, यद्यपि 2:1 का निकट प्रसंग प्रभु यीशु मसीह की ओर दृढ़ संकेत करता है। इसलिए मुख्य पाठ मूल की व्यापकता और धर्मवैचारिक तनाव दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आलंकारिक प्रश्न, ‘वे स्वयं’ का बल, तथा नाम के ‘ऊपर पुकारे जाने’ का असामान्य पर अर्थपूर्ण मुहावरा सुरक्षित रखा गया है।
