  text: ⸀ἐὰν ἀδελφὸς ἢ ἀδελφὴ γυμνοὶ ὑπάρχωσιν καὶ ⸀λειπόμενοι τῆς ἐφημέρου τροφῆς,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/015.yaml
  text: If a brother or sister is poorly clothed and lacking daily food,[a]
translation:
  language: hi
  text: यदि कोई भाई या बहन पर्याप्त कपड़े न पहने हो[a] और दिन भर के भोजन से वंचित हो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नंगा हो”; यूनानी शब्द का अर्थ सचमुच वस्त्रहीन भी हो सकता है, लेकिन यहाँ संभवतः पर्याप्त कपड़े न होना अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है; ‘यदि’ काल्पनिक स्थिति को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀδελφὸς ἢ ἀδελφή
  choice: कोई भाई या बहन
  rationale: यूनानी पाठ में आए स्पष्ट पुल्लिंग और स्त्रीलिंग युग्म को सीधे और स्वाभाविक ढंग से बनाए रखता है।
- source_word: γυμνοὶ
  choice: अपर्याप्त कपड़ों में
  rationale: इस संदर्भ में शब्द पूर्ण नग्नता के बजाय आवश्यकता के अनुसार पर्याप्त वस्त्र न होने का संकेत संभवतः देता है; पादटिप्पणी उसका शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: ὑπάρχωσιν
  choice: हो
  rationale: यहाँ क्रिया विधेय के साथ अस्तित्वसूचक/संयोजक रूप में काम करती है; हिन्दी में ‘हो’ सहज है और शर्तसूचक भाव बनाए रखता है।
- source_word: λειπόμενοι
  choice: उसके पास … न हो
  rationale: कृदन्त लगातार अभाव की दशा बताता है; हिन्दी में यह रचना उसी अर्थ को स्पष्ट और स्वाभाविक बनाती है।
- source_word: τῆς ἐφημέρου τροφῆς
  choice: प्रतिदिन का भोजन
  rationale: ἐφήμερος दिन-प्रतिदिन की जरूरत और τροφή भोजन/पोषण को दर्शाता है; यह चयन मूल अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मसीही समुदाय में ἀδελφὸς ἢ ἀδελφή का दायरा
  choice: ‘भाई या बहन’ की पारिवारिक भाषा बनाए रखी गई है, जो प्रसंग में संभवतः साथी विश्वासियों को सूचित करती है।
  alternative: इसे सामान्य रूप से किसी भी जरूरतमंद मनुष्य के लिए व्यापक अर्थ में समझना।
  rationale: याकूब निकटवर्ती प्रसंग में विश्वासियों के लिए भाई-बहन की भाषा का स्वाभाविक प्रयोग करता है; अनुवाद पाठ के शब्दों को बनाए रखता है, पर दायरे को व्याख्यात्मक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। वाक्य अगले पद में पूरा होने वाली शर्त का आरम्भ है, इसलिए अंत में अल्पविराम रखा गया है।
