id: JAS.2.8
reference: James 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: hi
  text: परन्तु यदि आप पवित्रशास्त्र के अनुसार राजकीय व्यवस्था[a] को पूरा करते हैं, “तुम अपने पड़ोसी से अपने समान प्रेम करो,” तो आप अच्छा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजा की व्यवस्था” या “राज्य की व्यवस्था।” यूनानी में शाब्दिक रूप से “राजकीय व्यवस्था” है; इससे उसके राजकीय स्रोत या उसके सर्वोच्च स्थान पर बल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: फिर भी, यदि
  rationale: यह εἰ की शर्त और μέντοι के हल्के विरोध अथवा योग्यता-सूचक भाव—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: νόμον ... βασιλικὸν
  choice: राजकीय व्यवस्था
  rationale: ‘राजकीय’ βασιλικός के ‘राजा से संबंधित/शाही’ अर्थ को बनाए रखता है; ‘व्यवस्था’ यहाँ νόμος को ऐसी बाध्यकारी आज्ञा के रूप में व्यक्त करती है जिसे आगे पवित्रशास्त्र से उद्धृत किया गया है।
- source_word: τελεῖτε
  choice: पूरा करते हैं
  rationale: यह τελέω के किसी अपेक्षा या दायित्व को कार्यान्वित/पूर्ण करने के भाव को सुरक्षित रखता है।
- source_word: κατὰ τὴν γραφήν
  choice: पवित्रशास्त्र के अनुसार
  rationale: यह वचन के अनुरूप होने का अर्थ देता है और हिन्दी में स्वाभाविक है।
- source_word: Ἀγαπήσεις
  choice: प्रेम करना
  rationale: यूनानी भविष्यत् रूप यहाँ आज्ञार्थक बल रखता है। हिन्दी में उद्धृत विधि-वाक्य का ‘तुम ... प्रेम करना’ रूप आदेश को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: τὸν πλησίον σου
  choice: अपने पड़ोसी से
  rationale: ‘पड़ोसी’ इस नैतिक-संबंधपरक संदर्भ में πλησίον का स्थापित और बोधगम्य हिन्दी समतुल्य है।
- source_word: ὡς σεαυτόν
  choice: अपने समान
  rationale: यह यूनानी तुलना की संक्षिप्तता बनाए रखता है और अनावश्यक शब्द नहीं जोड़ता।
- source_word: καλῶς ποιεῖτε
  choice: आप अच्छा करते हैं
  rationale: यह वर्तमानकालीन प्रशंसा और सही आचरण—दोनों को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘राजकीय व्यवस्था’ का अर्थ
  choice: मुख्य पाठ में ऐसा वर्णन जो व्यवस्था के राजकीय चरित्र को खुला रखता है
  alternative: राजा द्वारा दी गई व्यवस्था; सर्वोच्च व्यवस्था; राज्य की व्यवस्था
  rationale: βασιλικός उसके राजकीय स्रोत, सर्वोच्च पद, अथवा राज्य-संबंध की ओर संकेत कर सकता है। अनुवाद किसी एक व्याख्या को निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में सम्मानसूचक ‘आप’, जबकि पवित्रशास्त्रीय उद्धरण में मूल के एकवचन दूसरे पुरुष को दिखाने के लिए ‘तुम’। भाषा सरल, गरिमापूर्ण और संप्रदाय-निरपेक्ष रखी गई है।
