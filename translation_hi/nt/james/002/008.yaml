- from: फिर भी, यदि आप पवित्रशास्त्र के अनुसार इस राजकीय व्यवस्था[a] को पूरा करते हैं, “तुम अपने पड़ोसी से अपने समान प्रेम करना,” तो आप अच्छा करते हैं।
  to: परन्तु यदि आप पवित्रशास्त्र के अनुसार राजकीय व्यवस्था[a] को पूरा करते हैं, “तुम अपने पड़ोसी से अपने समान प्रेम करो,” तो आप अच्छा करते हैं।
