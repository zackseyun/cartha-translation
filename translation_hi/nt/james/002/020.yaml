source:
  edition: SBLGNT
  text: θέλεις δὲ γνῶναι, ὦ ἄνθρωπε κενέ, ὅτι ἡ πίστις χωρὶς τῶν ἔργων ⸀ἀργή ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: hi
  text: परन्तु हे नासमझ मनुष्य,[a] क्या तुम यह जानना चाहते हो कि कर्मों के बिना विश्वास निष्फल[b] है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “हे खाली मनुष्य” या “हे खोखले मनुष्य।” इसका आशय विवेक या सार से खाली व्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या “निष्क्रिय” अथवा “बेअसर।” यूनानी शब्द का अर्थ काम न करने वाला या फल न देने वाला भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: परन्तु ... क्या तुम यह जानना चाहते हो
  rationale: θέλω के इच्छासूचक भाव और γνῶναι के ‘जानना’ अर्थ को स्वाभाविक आधुनिक हिन्दी में रखा गया है; δέ यहाँ विरोध अथवा आगे बढ़ती आपत्ति को ‘परन्तु’ से व्यक्त करता है।
- source_word: ὦ ἄνθρωπε κενέ
  choice: हे नासमझ मनुष्य
  rationale: ἄνθρωπε एकवचन संबोधन है और κενέ का मूल बिंब ‘खाली/खोखला’ है। हिन्दी में ‘नासमझ’ इस फटकार का आशय स्वाभाविक ढंग से बताता है; शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: ἡ πίστις
  choice: विश्वास
  rationale: यहाँ πίστις के लिए ‘विश्वास’ प्रचलित, स्पष्ट और न्यूनतम व्याख्यात्मक हिन्दी शब्द है।
- source_word: χωρὶς τῶν ἔργων
  choice: कर्मों के बिना
  rationale: χωρίς + संबंधकारक अलगाव अथवा अभाव बताता है। ‘कर्मों के बिना’ सहज हिन्दी है और याकूब के तर्क में विश्वास और कर्मों के संबंध को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: ἀργή ἐστιν
  choice: निष्फल है
  rationale: ἀργός यहाँ निष्क्रिय, बेअसर अथवा फल न देने वाले होने का भाव रखता है। ‘निष्फल’ इसकी व्यावहारिक अनुत्पादकता को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
theological_decisions:
- issue: याकूब के तर्क में विश्वास और कर्मों का संबंध
  choice: कर्मों के बिना विश्वास को ‘निष्फल’ कहा गया है।
  alternative: इसे ‘निष्क्रिय’ कहना, अथवा निकटवर्ती पदों के आधार पर अधिक प्रबल शब्द ‘मरा हुआ’ लाना।
  rationale: इस पद में ἀργή है, νεκρά नहीं। इसलिए कथन का बल बनाए रखते हुए निकटवर्ती पद की शब्दावली या किसी बाद की मत-पद्धति को इसमें नहीं मिलाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन की फटकार और एकवचन पुरुष-संदर्भ को बनाए रखते हुए भाषा को सामान्य पाठक के लिए स्वाभाविक रखा गया है। ‘तुम’ वर्तमान हिन्दी में सहज एकवचन संबोधन है; ‘तू’ की अनावश्यक कठोरता और ‘आप’ की औपचारिक दूरी से बचा गया है।
