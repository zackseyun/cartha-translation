id: JAS.2.1
reference: James 2:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀδελφοί μου, μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/001.yaml
  text: My brothers[d][c][b][a], do not hold the faith of our Lord Jesus the Messiah with partiality.
translation:
  language: hi
  text: हे मेरे भाइयो[a], हमारे महिमामय प्रभु यीशु मसीह में विश्वास रखते हुए पक्षपात न करो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे मेरे भाइयो और बहनो”; यूनानी में शब्दशः “भाइयो” है, पर संबोधन सम्भवतः पूरे विश्वासी समुदाय से है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी वाक्यरचना का अधिक शब्दानुसार रूप हो सकता है: “हमारे प्रभु यीशु मसीह का विश्वास पक्षपात के साथ न रखो।” अंतिम पदबंध का अनुवाद “हमारे प्रभु यीशु मसीह, महिमा के प्रभु” भी किया जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: हे मेरे भाइयो
  rationale: प्रत्यक्ष संबोधन और व्याकरणिक पुल्लिंग बहुवचन को स्वाभाविक हिन्दी में रखा गया है; व्यापक विश्वासी समुदाय का समावेशी आशय पादटिप्पणी में दिया गया है।
- source_word: μὴ ... ἔχετε
  choice: न करो
  rationale: μή के साथ वर्तमान आज्ञार्थक निषेध व्यक्त करता है। हिन्दी में पक्षपात के साथ ‘न करो’ स्वाभाविक और स्पष्ट है।
- source_word: ἐν προσωπολημψίαις
  choice: पक्षपात
  rationale: शब्द का आशय व्यक्ति का बाहरी दर्जा देखकर भेदभाव या विशेष कृपा करना है; यूनानी बहुवचन को हिन्दी में स्वाभाविक भाववाचक रूप से व्यक्त किया गया है।
- source_word: τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: हमारे ... प्रभु यीशु मसीह में विश्वास रखते हुए
  rationale: हिन्दी में ‘प्रभु ... का विश्वास’ भ्रामक होकर यीशु के अपने विश्वास का अर्थ दे सकता है। प्रसंगानुकूल लक्ष्य-संबंध ‘में विश्वास’ मुख्य पाठ में स्पष्ट किया गया है, जबकि यूनानी संबंध की सम्भावित व्यापकता पादटिप्पणी में सुरक्षित है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यहाँ Χριστός उपाधि के रूप में सक्रिय है; हिन्दी में ‘मसीह’ उसका स्वाभाविक और प्रचलित रूप है।
- source_word: τῆς δόξης
  choice: महिमामय
  rationale: δόξης को प्रभु यीशु मसीह का गुणवाचक निर्धारण मानते हुए पठनीय हिन्दी में ‘महिमामय’ रखा गया है; ‘महिमा के प्रभु’ विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: πίστις के साथ संबंधकारक τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: हमारे प्रभु यीशु मसीह में विश्वास
  alternative: हमारे प्रभु यीशु मसीह से संबंधित विश्वास / हमारे प्रभु यीशु मसीह का विश्वास
  rationale: यूनानी संबंधकारक एक से अधिक प्रकार से समझा जा सकता है। मुख्य पाठ में प्रसंगानुकूल और स्वाभाविक हिन्दी दी गई है, पर दूसरी सम्भावना को पादटिप्पणी में बताया गया है ताकि वास्तविक अस्पष्टता मिटे नहीं।
- issue: τῆς δόξης का संबंध
  choice: हमारे महिमामय प्रभु यीशु मसीह
  alternative: हमारे प्रभु यीशु मसीह, महिमा के प्रभु
  rationale: संबंधकारक को गुणवाचक मानना सहज है, किंतु ‘महिमा के प्रभु’ वाला सामासिक/व्याख्यात्मक पाठ भी सम्भव है और पादटिप्पणी में रखा गया है।
- issue: Ἀδελφοί का लिंग और सामुदायिक दायरा
  choice: मेरे भाइयो
  alternative: मेरे भाइयो और बहनो
  rationale: मुख्य पाठ यूनानी के व्याकरणिक पुल्लिंग को रखता है; संदर्भ में पूरे विश्वासी समुदाय को संबोधन होने की सम्भावना पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य हिन्दी। ‘पक्षपात न करो’ साधारण पाठक के लिए सहज है। ‘मसीह’ को जीवित उपाधि की तरह रखा गया है।
