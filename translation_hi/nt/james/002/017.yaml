base_translation:
  language: en
  yaml_path: translation/nt/james/002/017.yaml
  text: So also faith[a], if it does not have works, is dead by itself.
translation:
  language: hi
  text: इसी तरह विश्वास[a] भी, यदि उसमें कर्म न हों, तो अपने आप में मरा हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भरोसा’; यहाँ ‘निष्ठा’ की संभावना कम है। यूनानी शब्द पिस्तिस में ये अर्थ हो सकते हैं, पर इस पद में याकूब के तर्क के लिए ‘विश्वास’ सबसे उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: इसी तरह ... भी
  rationale: यह पिछले उदाहरण से तुलना और निष्कर्ष का संबंध जोड़ता है; यह हिन्दी में स्वाभाविक रूप से उसी तर्क-सूत्र को बनाए रखता है।
- source_word: ἡ πίστις
  choice: विश्वास
  rationale: इस प्रसंग में यह दावा किए गए विश्वास को सूचित करता है। ‘विश्वास’ याकूब के तर्क और उसकी धर्मवैचारिक तनातनी को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ἐὰν μὴ ἔχῃ ἔργα
  choice: यदि उसमें कर्म न हों
  rationale: शर्त को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है। ‘उसमें’ विश्वास के साथ कर्मों की अनुपस्थिति को बताता है, और ‘कर्म’ आसपास के तर्क से शब्दगत संबंध बनाए रखता है।
- source_word: νεκρά ἐστιν
  choice: मरा हुआ है
  rationale: मूल के प्रबल रूपक को सीधे बनाए रखता है। हिन्दी में ‘विश्वास’ पुल्लिंग होने के कारण विशेषण पुल्लिंग रखा गया है।
- source_word: καθ’ ἑαυτήν
  choice: अपने आप में
  rationale: कर्मों से अलग, अकेले विचार किए गए विश्वास का भाव देता है और वाक्य में निहित अर्थ को अनावश्यक रूप से विस्तार नहीं देता।
theological_decisions:
- issue: विश्वास और कर्मों की बहस के केंद्रीय प्रसंग में πίστις का अनुवाद
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: यहाँ याकूब ऐसे विश्वास की बात करता है जिसके साथ कर्म नहीं हैं। ‘विश्वास’ मूल शब्द की व्यापकता और पद की धर्मवैचारिक तनातनी को बनाए रखता है; अनुवाद यह तय नहीं करता कि अन्य धर्मवैचारिक सूत्रों के साथ इसका संबंध कैसे व्यवस्थित किया जाए।
- issue: ἔργα को नैतिक या धार्मिक कार्यों तक सीमित करना
  choice: कर्म
  alternative: काम; कार्य
  rationale: ‘कर्म’ बाहरी कार्यों के सामान्य अर्थ और निकटवर्ती प्रसंग के शब्दगत संबंध को बनाए रखता है, बिना इसे किसी विशेष प्रकार के धार्मिक अनुष्ठान या पुण्य-कर्म तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। ‘इसी तरह ... भी’ पिछले उदाहरण से संबंध स्पष्ट करता है। ‘कर्म’ को निकटवर्ती प्रसंग की पारिभाषिक निरंतरता के लिए रखा गया है; ‘अपने आप में’ καθ’ ἑαυτήν की स्वाभाविक हिन्दी अभिव्यक्ति है।
