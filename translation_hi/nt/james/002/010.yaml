id: JAS.2.10
reference: James 2:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅστις γὰρ ὅλον τὸν νόμον ⸂τηρήσῃ, πταίσῃ⸃ δὲ ἐν ἑνί, γέγονεν πάντων ἔνοχος.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: hi
  text: क्योंकि जो कोई पूरी व्यवस्था का पालन करता है, पर एक बात में चूक जाता है, वह पूरी व्यवस्था का दोषी हो गया है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक बात में विफल हो जाता है” अथवा “उसके एक भाग को तोड़ देता है।” यूनानी में शाब्दिक अर्थ “एक में ठोकर खाता है” है, जो नैतिक चूक का रूपक है।
    reason: lexical_alternative
  - marker: b
    text: या, “पूरी व्यवस्था के प्रति उत्तरदायी हो गया है।” इसका अर्थ है कि व्यवस्था के एक भाग को तोड़ने पर व्यक्ति पूरी व्यवस्था के सम्बन्ध में जवाबदेह होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: जो कोई
  rationale: यह अनिश्चित सम्बन्धवाचक सर्वनाम एक सामान्य और सर्वव्यापी सिद्धान्त प्रस्तुत करता है; ‘जो कोई’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार बताता है; ‘क्योंकि’ हिन्दी में तार्किक सम्बन्ध स्पष्ट रखता है।
- source_word: ὅλον τὸν νόμον
  choice: पूरी व्यवस्था
  rationale: ὅλον व्यवस्था की सम्पूर्णता पर बल देता है; ‘पूरी व्यवस्था’ सहज और व्यापक अर्थ को सुरक्षित रखता है।
- source_word: τηρήσῃ
  choice: पालन करता है
  rationale: यहाँ τηρέω का अर्थ व्यवस्था को मानना या उसका पालन करना है; हिन्दी में ‘पालन करना’ सर्वाधिक स्वाभाविक है।
- source_word: πταίσῃ
  choice: चूक जाता है
  rationale: πταίω का मूल बिम्ब ठोकर खाने का है और यहाँ नैतिक विफलता सूचित करता है; ‘चूक जाना’ उस बिम्ब की सहज हिन्दी अभिव्यक्ति है।
- source_word: ἐν ἑνί
  choice: एक बात में
  rationale: यह व्यवस्था के किसी एक विषय या बिन्दु के सम्बन्ध में चूक को व्यक्त करता है; ‘एक बात में’ मूल की अनिश्चितता बनाए रखता है।
- source_word: γέγονεν
  choice: हो गया है
  rationale: पूर्णकालीन रूप किसी कार्य से उत्पन्न वर्तमान दशा को दर्शाता है; ‘हो गया है’ इस परिणामात्मक पक्ष को सुरक्षित रखता है।
- source_word: πάντων ἔνοχος
  choice: पूरी व्यवस्था का दोषी
  rationale: वाक्यांश सम्पूर्ण व्यवस्था के प्रति दोष या जवाबदेही बताता है; यह अनुवाद हर आज्ञा को अलग-अलग तोड़ने का अर्थ अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: एक उल्लंघन के कारण पूरी व्यवस्था के प्रति दोष
  choice: एक बात में चूकने वाला पूरी व्यवस्था का दोषी हो गया है
  alternative: एक आज्ञा तोड़ना हर आज्ञा को अलग-अलग तोड़ने के समान है
  rationale: πάντων ἔνοχος सम्पूर्ण व्यवस्था के प्रति दोषी या उत्तरदायी होने की बात करता है; यह आवश्यक रूप से नहीं कहता कि सभी पाप समान गम्भीर हैं या व्यक्ति ने प्रत्येक आज्ञा अलग-अलग तोड़ी है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘व्यवस्था’ बाइबलीय νόμος के लिए स्थापित शब्द है। मुख्य पाठ में नैतिक-वैधानिक बल रखा गया है और पादटिप्पणियों में रूपक तथा ‘दोषी/उत्तरदायी’ की सम्भावना स्पष्ट की गई है।
