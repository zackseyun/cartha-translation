id: JAS.2.14
reference: James 2:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: hi
  text: हे मेरे भाइयो और बहनो,[a] यदि कोई कहे कि उसमें विश्वास है, पर उसके काम न हों, तो इससे क्या लाभ? क्या वह विश्वास उसे बचा सकता है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में शाब्दिक रूप से ‘मेरे भाइयो’ है; पुल्लिंग बहुवचन यहाँ विश्वासियों के पूरे समुदाय के लिए प्रतिनिधिक संबोधन है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘क्या ऐसा विश्वास उसे बचा सकता है?’ भी हो सकता है। यूनानी में शाब्दिक रूप से ‘क्या वह विश्वास उसे बचा सकता है?’ है, जो अभी बताए गए—कामों से रहित कहे गए विश्वास—की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὄφελος
  choice: इससे क्या लाभ?
  rationale: यह यूनानी अलंकारिक प्रश्न का स्वाभाविक हिन्दी रूप है और व्यावहारिक लाभ या उपयोगिता का भाव बनाए रखता है।
- source_word: ἀδελφοί μου
  choice: हे मेरे भाइयो और बहनो
  rationale: यूनानी में पुल्लिंग बहुवचन संबोधन है, जो यहाँ विश्वासियों के पूरे समुदाय के लिए प्रतिनिधिक रूप से प्रयुक्त है; हिन्दी में मिश्रित समुदाय को स्वाभाविक और स्पष्ट रूप से संबोधित किया गया है।
- source_word: πίστιν
  choice: विश्वास
  rationale: यहाँ किसी व्यक्ति द्वारा अपने भीतर होने का दावा किए गए विश्वास का अर्थ है; ‘विश्वास’ धार्मिक और सामान्य दोनों संदर्भों में उपयुक्त तथा प्रचलित है।
- source_word: λέγῃ τις ἔχειν
  choice: यदि कोई कहे कि उसमें ... है
  rationale: यह यूनानी कथन को ‘दावा करे’ जैसी अधिक व्याख्यात्मक भाषा के बिना निकटता से और सहज हिन्दी में व्यक्त करता है।
- source_word: ἔργα
  choice: काम
  rationale: ‘काम’ सरल आधुनिक हिन्दी है और याकूब के विश्वास तथा कामों के तर्क में बार-बार आने वाले शब्द-संबंध को बनाए रखता है।
- source_word: μὴ ἔχῃ
  choice: उसके ... न हों
  rationale: यह अभाव को सीधी, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μὴ δύναται
  choice: क्या ... सकता है?
  rationale: μή वाला प्रश्न नकारात्मक उत्तर की अपेक्षा रखता है; हिन्दी में प्रश्नरूप संदर्भ के द्वारा वही अलंकारिक बल व्यक्त करता है।
- source_word: ἡ πίστις
  choice: वह विश्वास
  rationale: निश्चयवाचक पद पहले बताए गए उस विश्वास की ओर लौटता है जो कहा तो जाता है, पर जिसके साथ काम नहीं हैं; ‘वह’ इस संदर्भसूचक बल को बनाए रखता है।
- source_word: σῶσαι αὐτόν
  choice: उसे बचा सकता है
  rationale: ‘बचाना’ σῴζω का मानक और स्वाभाविक हिन्दी रूप है तथा यहाँ उसके धार्मिक महत्व को बनाए रखता है।
theological_decisions:
- issue: विश्वास और कामों का संबंध
  choice: प्रश्न को उस अभी-अभी वर्णित विश्वास से जोड़ा गया है जिसके होने की बात कही जाती है, पर जिसके साथ काम नहीं हैं।
  alternative: ‘क्या विश्वास उसे बचा सकता है?’ या अधिक व्याख्यात्मक ‘क्या ऐसा विश्वास उसे बचा सकता है?’
  rationale: ‘वह विश्वास’ यूनानी ἡ πίστις के पूर्वसंदर्भसूचक बल को व्यक्त करता है और पद से आगे जाकर विश्वास तथा उद्धार के संबंध का सम्प्रदायगत समाधान नहीं थोपता।
- issue: ἀδελφοί का प्रतिनिधिक पुल्लिंग संबोधन
  choice: मुख्य पाठ में ‘भाइयो और बहनो’ रखकर पूरे मिश्रित विश्वासी समुदाय को स्पष्ट किया गया है।
  alternative: ‘मेरे भाइयो’ रखकर प्रतिनिधिक प्रयोग को केवल पादटिप्पणी में स्पष्ट करना।
  rationale: हिन्दी में ‘भाइयो और बहनो’ मूल संबोधन के सामुदायिक दायरे को स्वाभाविक ढंग से स्पष्ट करता है; पादटिप्पणी मूल यूनानी के पुल्लिंग बहुवचन रूप की जानकारी सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘काम’ सामान्य पाठक के लिए ‘कर्मों’ से अधिक स्वाभाविक है, जबकि आसपास के तर्क में मूल शब्द की पुनरावृत्ति बनाए रखता है। अलंकारिक प्रश्न और उसका अपेक्षित नकारात्मक उत्तर बिना अतिरिक्त व्याख्या के सुरक्षित हैं।
