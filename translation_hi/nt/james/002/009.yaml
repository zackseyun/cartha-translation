base_translation:
  language: en
  yaml_path: translation/nt/james/002/009.yaml
  text: But if you show partiality[d][c][b][a], you commit sin and are convicted by the law as transgressors.
translation:
  language: hi
  text: लेकिन यदि तुम पक्षपात करते हो,[a] तो पाप करते हो और व्यवस्था के द्वारा व्यवस्था का उल्लंघन करनेवाले ठहराए जाते हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों की बाहरी हैसियत देखकर उनके साथ व्यवहार करते हो।” यूनानी क्रिया का अर्थ किसी के रूप, पद, या सामाजिक स्थिति के आधार पर पक्षपात करना है।
    reason: lexical_alternative
  - marker: b
    text: या, “व्यवस्था के द्वारा दोषी सिद्ध किए जाते हो, मानो व्यवस्था तोड़नेवाले।” यूनानी शब्द में दोष को उजागर करके दोषी ठहराए जाने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: लेकिन यदि
  rationale: εἰ शर्त प्रकट करता है और δέ पिछले तर्क के साथ हल्का विरोध या आगे बढ़ना; ‘लेकिन यदि’ दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: προσωπολημπτεῖτε
  choice: तुम पक्षपात करते हो
  rationale: क्रिया बाहरी हैसियत या रूप के आधार पर किसी के साथ भेदभावपूर्ण अनुकूल व्यवहार करने को दर्शाती है; ‘पक्षपात करना’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: पाप करते हो
  rationale: शाब्दिक रूप से ‘पाप करना/उत्पन्न करना’; इस संयोग का स्वाभाविक अर्थ ‘पाप करना’ है। वर्तमान काल को सामान्य वर्तमान से व्यक्त किया गया है।
- source_word: ἐλεγχόμενοι
  choice: ठहराए जाते हो
  rationale: निष्क्रिय कृदन्त का आशय दोष को उजागर करके दोषी सिद्ध करना है; ‘अपराधी ठहराए जाते हो’ कानूनी संदर्भ में स्वाभाविक है और निष्क्रियता बनाए रखता है।
- source_word: ὑπὸ τοῦ νόμου
  choice: व्यवस्था के द्वारा
  rationale: ὑπό कर्ता/साधन के रूप में व्यवस्था को दिखाता है। ‘व्यवस्था’ याकूब के नैतिक और विधिक संदर्भ के अनुकूल स्थापित हिन्दी बाइबलीय शब्द है, बिना इसे किसी संकीर्ण वाचा-संबंधी अर्थ तक सीमित किए।
- source_word: ὡς παραβάται
  choice: अपराधी
  rationale: παραβάται सीमा या विधि का उल्लंघन करने वालों को दर्शाता है। ‘अपराधी’ सहज हिन्दी है; पादटिप्पणी अधिक शाब्दिक ‘व्यवस्था का उल्लंघन करनेवाले’ विकल्प देती है।
theological_decisions:
- issue: याकूब के नैतिक तर्क में νόμος का स्वरूप
  choice: ‘व्यवस्था’—बिना ‘मूसा की व्यवस्था’ या ‘परमेश्वर की व्यवस्था’ जोड़कर अर्थ को संकीर्ण किए
  alternative: ‘मूसा की व्यवस्था’ अथवा ‘परमेश्वर की व्यवस्था’
  rationale: यूनानी पाठ व्यवस्था को वह मानदंड बताता है जो पक्षपात को पाप सिद्ध करती है, पर इस पद में उसकी वाचागत सीमा स्पष्ट नहीं करता। अनुवाद इसी व्यापकता को सुरक्षित रखता है।
- issue: ἐλεγχόμενοι का वाक्यगत संबंध
  choice: मुख्य क्रिया के साथ समन्वित परिणाम के रूप में ‘और ... ठहराए जाते हो’
  alternative: ‘व्यवस्था के द्वारा अपराधी ठहराए जाते हुए’
  rationale: यूनानी में यह वर्तमान निष्क्रिय कृदन्त है। हिन्दी में समन्वित क्रिया अधिक स्वाभाविक है और पाप करने तथा व्यवस्था द्वारा दोषी सिद्ध होने के संबंध को बनाए रखती है, बिना कारण, समय या रीति को अनावश्यक रूप से निश्चित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पक्षपात’, ‘पाप’ और ‘व्यवस्था’ संदर्भ के विधिक-नैतिक स्वर को बनाए रखते हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
