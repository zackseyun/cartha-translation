source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: hi
  text: पर तुमने उस गरीब आदमी का अपमान किया है। क्या धनी लोग ही तुम पर अत्याचार नहीं करते और वे स्वयं तुम्हें घसीटकर अदालतों में नहीं ले जाते?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अदालतों’ के स्थान पर ‘न्यायालयों’ भी अनुवाद किया जा सकता है। यूनानी शब्द न्यायिक अदालतों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: अपमान किया है
  rationale: यह अभिव्यक्ति किसी को आदर से वंचित करने और तुच्छ समझकर व्यवहार करने का भाव रखती है; आधुनिक हिन्दी में स्वाभाविक भी है।
- source_word: τὸν πτωχόν
  choice: उस गरीब आदमी
  rationale: संज्ञीकृत विशेषण एकवचन और पुल्लिंग है तथा पिछले पदों में वर्णित गरीब पुरुष की ओर संकेत करता है; ‘उस’ प्रसंगगत निश्चितता को स्पष्ट करता है।
- source_word: οἱ πλούσιοι
  choice: धनी लोग
  rationale: संज्ञीकृत बहुवचन विशेषण को सहज हिन्दी में वर्ग-सूचक रूप से व्यक्त करता है।
- source_word: καταδυναστεύουσιν
  choice: अत्याचार करते
  rationale: यह शक्ति का कठोर और दमनकारी उपयोग व्यक्त करता है, बिना शोषण के किसी विशेष ढंग को अनावश्यक रूप से जोड़ने के।
- source_word: ἕλκουσιν
  choice: घसीटकर ... ले जाते
  rationale: मूल क्रिया के बलपूर्वक खींचने और कानूनी उत्पीड़न के सजीव भाव को सुरक्षित रखता है।
- source_word: κριτήρια
  choice: अदालतों
  rationale: इस प्रसंग में यह न्यायिक अदालतों को दर्शाता है; ‘अदालत’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: καὶ αὐτοὶ
  choice: और वे स्वयं
  rationale: कर्त्ता पर दिए गए यूनानी बल को बनाए रखता है कि यही धनी लोग ऐसा करते हैं।
- source_word: οὐχ ... ;
  choice: क्या ... नहीं
  rationale: यह ऐसे आलंकारिक प्रश्न का स्वाभाविक हिन्दी रूप है जिसमें सकारात्मक उत्तर अपेक्षित है।
theological_decisions:
- issue: एकवचन ‘गरीब’ का संदर्भ
  choice: सभा के उदाहरण में वर्णित प्रतिनिधि गरीब आदमी
  alternative: सामूहिक अर्थ में सामान्यतः ‘गरीब लोग’
  rationale: याकूब 2:2–3 के तत्काल प्रसंग में एक विशेष गरीब पुरुष का वर्णन है। एकवचन बनाए रखने से प्रसंग का प्रवाह सुरक्षित रहता है, जबकि उसका व्यापक प्रतिनिधिक अर्थ बंद नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पठन में सहज रखी गई है। ‘गरीब आदमी’ तत्काल प्रसंग के पुल्लिंग एकवचन को बनाए रखता है। मुख्य पाठ में पादटिप्पणी-चिह्न संबंधित शब्द ‘अदालतों’ के बाद रखा गया है।
