  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: hi
  text: क्या हमारे पिता अब्राहम कर्मों के द्वारा धर्मी नहीं ठहराए गए, जब उन्होंने अपने पुत्र इसहाक को वेदी पर चढ़ाया?[a]
  philosophy: optimal-equivalence
  footnotes:
