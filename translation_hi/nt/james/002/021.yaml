    text: या “धर्मी सिद्ध किए गए” या “धर्मी प्रमाणित हुए।” यूनानी क्रिया प्रसंग के अनुसार किसी को धर्मी ठहराने या उसके धर्मी होने को प्रमाणित करने का भाव दे सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: हमारे पिता
  rationale: यह वाचा-संबंधी पारिवारिक भाषा और परंपरागत आत्मीयता को बनाए रखता है; ‘हमारे पूर्वज’ की अपेक्षा मूल रूपक के अधिक निकट है।
- source_word: ἐξ ἔργων
  choice: कर्मों के द्वारा
  rationale: ἐξ यहाँ आधार या साधन का भाव दे सकता है। यह स्वाभाविक हिन्दी है और प्रसंग की धर्मवैचारिक शब्दावली को अनावश्यक रूप से नहीं सुलझाती।
- source_word: ἐδικαιώθη
  choice: धर्मी ठहराए गए
  rationale: δικαιόω के घोषणात्मक और प्रमाणित/सही सिद्ध किए जाने वाले दोनों संभावित बलों के बीच मूल तनाव को बनाए रखने हेतु मुख्य पाठ में यह स्थापित हिन्दी धर्मवैचारिक पद रखा गया है।
- source_word: ἀνενέγκας
  choice: जब उन्होंने ... चढ़ाया
  rationale: एओरिस्ट कृदंत को प्रसंगानुकूल कालवाचक रूप में व्यक्त किया गया है और ἀναφέρω का बलिदान चढ़ाने का भाव सुरक्षित रखा गया है।
- source_word: θυσιαστήριον
  choice: वेदी
  rationale: बलिदान की वेदी के लिए मानक, स्पष्ट और संक्षिप्त हिन्दी शब्द।
- source_word: οὐκ ... ἐδικαιώθη;
  choice: क्या ... धर्मी नहीं ठहराए गए
  rationale: यह यूनानी आलंकारिक प्रश्न की उस संरचना को बनाए रखता है जिसमें सकारात्मक उत्तर अपेक्षित है।
theological_decisions:
- issue: याकूब 2:21 में कर्मों के संबंध में δικαιόω का अर्थ
  choice: मुख्य पाठ में ‘धर्मी ठहराए गए’
  alternative: ‘धर्मी सिद्ध किए गए’ या ‘सही प्रमाणित हुए’
  rationale: मुख्य पाठ व्यापक ‘धर्मी ठहराने’ की चर्चा से शाब्दिक संबंध और धर्मवैचारिक तनाव बनाए रखता है; पादटिप्पणी संभावित प्रदर्शनात्मक या समर्थन-सिद्धि वाले अर्थों को दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘हमारे पिता’ मूल की वाचा-संबंधी पारिवारिक अभिव्यक्ति को सुरक्षित रखता है।
