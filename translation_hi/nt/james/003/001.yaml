  text: Μὴ πολλοὶ διδάσκαλοι γίνεσθε, ἀδελφοί μου, εἰδότες ὅτι μεῖζον κρίμα λημψόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: hi
  text: मेरे भाइयो,[a] तुम में से बहुत-से शिक्षक न बनें, यह जानते हुए कि हम अधिक कठोर न्याय पाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे भाइयो”; यहाँ यह संबोधन संभवतः बहनों सहित पूरे समुदाय के लिए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ πολλοὶ
  choice: तुममें से बहुत-से लोग ... न बनें
  rationale: μή के साथ वर्तमान आज्ञार्थक γίνεσθε निषेधात्मक उपदेश देता है। यह हिंदी रूप संबोधित समुदाय को स्पष्ट करते हुए यूनानी की निषेधात्मक शक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: διδάσκαλοι
  choice: शिक्षक
  rationale: यह सामान्यतः सिखाने वालों को दर्शाता है; 'शिक्षक' स्वाभाविक है और पाठ से परे किसी औपचारिक कलीसियाई पद का संकेत नहीं जोड़ता।
- source_word: γίνεσθε
  choice: बनें
  rationale: γίνομαι यहाँ किसी भूमिका में आने का भाव रखता है, इसलिए केवल 'हों' की अपेक्षा 'बनें' अधिक सटीक है।
- source_word: ἀδελφοί μου
  choice: मेरे भाइयो और बहनो
  rationale: यद्यपि यूनानी संज्ञा व्याकरण की दृष्टि से पुल्लिंग बहुवचन है, इस प्रकार का संबोधन सामान्यतः पूरे विश्वासी समुदाय को समेटता है। हिंदी में समावेशी आशय को स्पष्ट किया गया है और शाब्दिक रूप फुटनोट में सुरक्षित है।
- source_word: εἰδότες
  choice: क्योंकि तुम जानते हो
  rationale: परिस्थितिवाचक कृदंत exhortation का ज्ञात आधार प्रस्तुत करता है। हिंदी में कारणसूचक उपवाक्य स्वाभाविक है, यद्यपि यूनानी में संबंध को कृदंत के कारण कुछ खुला रखा गया है।
- source_word: μεῖζον
  choice: अधिक कठोर
  rationale: κρίμα के साथ तुलनात्मक शब्द न्याय की बढ़ी हुई गंभीरता या कठोरता बताता है। 'अधिक कठोर' हिंदी में केवल आकारगत 'बड़ा' कहने की अपेक्षा आशय स्पष्ट करता है।
- source_word: κρίμα
  choice: न्याय
  rationale: शब्द न्याय, निर्णय अथवा दंडादेश का अर्थ दे सकता है। 'न्याय' व्यापक अर्थ बनाए रखता है और इसे अनिवार्यतः अंतिम दंडाज्ञा नहीं ठहराता।
- source_word: λημψόμεθα
  choice: हम ... पाएँगे
  rationale: यह भविष्यकालीन प्रथम पुरुष बहुवचन को सुरक्षित रखता है और लेखक को भी उत्तरदायी शिक्षकों में सम्मिलित दिखाता है।
theological_decisions:
- issue: ἀδελφοί μου का मिश्रित विश्वासी समुदाय के लिए दायरा
  choice: मुख्य पाठ में 'मेरे भाइयो और बहनो', साथ में शाब्दिक रूप का फुटनोट
  alternative: '''मेरे भाइयो'''
  rationale: संबोधन का संभावित सामुदायिक और समावेशी आशय आधुनिक हिंदी पाठक के लिए स्पष्ट किया गया है, जबकि यूनानी के पुल्लिंग रूप को टिप्पणी में बताया गया है।
- issue: κρίμα की शक्ति
  choice: '''न्याय'''
  alternative: '''दंडाज्ञा'' अथवा ''दोष-दंड'''
  rationale: पद शिक्षकों की बढ़ी हुई जवाबदेही की चेतावनी देता है, पर संज्ञा स्वयं अनिवार्य रूप से अंतिम दोष-दंड निश्चित नहीं करती।
- issue: μεῖζον κρίμα में तुलना का भाव
  choice: '''अधिक कठोर न्याय'''
  alternative: '''बड़ा न्याय'' अथवा ''अधिक न्याय'''
  rationale: तुलना न्याय की गंभीरता को सूचित करती है; यह रूप हिंदी में अर्थपूर्ण है और चेतावनी की शक्ति बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक उपदेश के लिए सहज रखी गई है। 'क्योंकि तुम जानते हो' कृदंत को स्वाभाविक हिंदी में खोलता है; 'हम' लेखक की आत्म-सम्मिलित जवाबदेही को बनाए रखता है।
