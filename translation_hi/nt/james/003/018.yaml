  text: καρπὸς ⸀δὲ δικαιοσύνης ἐν εἰρήνῃ σπείρεται τοῖς ποιοῦσιν εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/018.yaml
  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: hi
  text: और धार्मिकता का फल शांति में उन लोगों के द्वारा बोया जाता है जो शांति स्थापित करते हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय का फल।” यूनानी शब्द में नैतिक धार्मिकता के साथ न्याय और सही संबंधों का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन लोगों के लिए जो शांति स्थापित करते हैं।” यहाँ यूनानी सम्प्रदान कारक को एक से अधिक प्रकार से समझा जा सकता है, यद्यपि कर्मवाच्य क्रिया के साथ “के द्वारा” अधिक स्वाभाविक है।
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς
  choice: फल
  rationale: एकवचन संज्ञा और बोने की कृषि-संबंधी छवि को सीधे बनाए रखता है; ‘फसल’ प्रसंग में संभव है, पर मूल रूपक से कुछ दूर जाता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्का संयोजक है, प्रबल विरोधसूचक नहीं; इसलिए ‘और’ पिछले पद से स्वाभाविक संबंध दिखाता है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: δικαιοσύνη के नैतिक अर्थ और पारंपरिक बाइबलीय शब्दावली को बनाए रखता है; न्याय-संबंधी भाव की संभावना पादटिप्पणी में दी गई है।
- source_word: ἐν εἰρήνῃ
  choice: शांति में
  rationale: मूल वाक्यांश की संक्षिप्तता और उसकी संभावित क्रियाविशेषणीय अथवा क्षेत्र-सूचक अस्पष्टता को सुरक्षित रखता है।
- source_word: σπείρεται
  choice: बोया जाता है
  rationale: वर्तमानकालीन कर्मवाच्य को स्वाभाविक हिन्दी कर्मवाच्य में व्यक्त करता और कृषि-रूपक बनाए रखता है।
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: उन लोगों के द्वारा ... जो शांति स्थापित करते हैं
  rationale: कर्मवाच्य क्रिया के साथ करणवाचक अर्थ सबसे स्वाभाविक है; ‘शांति स्थापित करते हैं’ ποιέω + εἰρήνην का वर्तमान हिन्दी में स्पष्ट और गरिमापूर्ण रूप है।
theological_decisions:
- issue: ‘धार्मिकता का फल’ का आशय
  choice: वाक्यांश को यथावत रखा गया है, जिससे धार्मिकता-रूपी फल, धार्मिक चरित्र वाला फल, अथवा धार्मिकता उत्पन्न करने वाला फल—इन निकटवर्ती अर्थों के बीच मूल तनाव बना रहे।
  alternative: इसे स्पष्ट करके ‘धार्मिकता की फसल’ या ‘धार्मिकता उत्पन्न करने वाला फल’ कहना।
  rationale: δικαιοσύνης संबंधकारक की सटीक भूमिका संदर्भ में पूरी तरह निश्चित नहीं है; अनुवाद को किसी एक व्याख्या तक सीमित नहीं करना चाहिए।
- issue: τοῖς ποιοῦσιν εἰρήνην का कारक-संबंध
  choice: 'करणवाचक: ‘उन लोगों के द्वारा जो शांति स्थापित करते हैं।’'
  alternative: 'सम्प्रदानवाचक: ‘उन लोगों के लिए जो शांति स्थापित करते हैं।’'
  rationale: कर्मवाच्य σπείρεται के साथ करणवाचक समझ अधिक स्वाभाविक है, फिर भी यूनानी सम्प्रदान कारक दूसरे अर्थ की अनुमति देता है; इसलिए विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘धार्मिकता’, ‘शांति’ और ‘बोया जाता है’ मूल की प्रमुख धार्मिक तथा कृषि-संबंधी छवियों को बनाए रखते हैं। पादटिप्पणी-चिह्न संबद्ध वाक्य के अंत में क्रमशः दिए गए हैं।
