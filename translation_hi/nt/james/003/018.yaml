  naturalness: The sentence is grammatical, clear, and suitably dignified in modern standard Hindi. “शांति स्थापित करते हैं” is a natural and faithful rendering of “make peace,” while retaining the active sense rather than reducing it to a label such as “शांतिदूत.”
  terminology: “धार्मिकता” is established biblical Hindi terminology for δικαιοσύνη and preserves the source phrase’s theological and genitival openness. The footnote appropriately notes “न्याय” as a viable contextual nuance without replacing the primary rendering. “शांति” and the sowing/fruit imagery are consistently maintained.
