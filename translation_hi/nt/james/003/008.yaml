id: JAS.3.8
reference: James 3:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: hi
  text: पर जीभ को कोई मनुष्य वश में नहीं कर सकता। वह एक चंचल बुराई है[a], और प्राणघातक विष से भरी हुई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह एक अस्थिर बुराई है,” अथवा “वह एक बेलगाम बुराई है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: जीभ
  rationale: शरीर के अंग का सीधा शब्द रखा गया है, क्योंकि संदर्भ में यही मानवीय वाणी का रूपक है और पिछले पदों से चित्रात्मक निरंतरता बनाए रखता है।
- source_word: οὐδεὶς … ἀνθρώπων
  choice: कोई मनुष्य … नहीं
  rationale: यूनानी का स्वाभाविक अर्थ ‘मनुष्यों में से कोई नहीं’ है। हिन्दी में ‘कोई मनुष्य नहीं’ उसी सार्वभौमिक मानवीय आशय को सहज और ठीक रूप में व्यक्त करता है।
- source_word: δαμάσαι δύναται
  choice: वश में नहीं कर सकता
  rationale: δαμάζω का पशुओं को वश में करने वाला भाव सुरक्षित है और निकटवर्ती संदर्भ से क्रियात्मक संबंध बना रहता है; हिन्दी में ‘वश में करना’ स्वाभाविक है।
- source_word: ἀκατάστατον
  choice: चंचल
  rationale: यह शब्द अस्थिर, बेचैन या अनियंत्रित होने का भाव दे सकता है। ‘चंचल’ जीभ की निरंतर और कठिन-से-नियंत्रित सक्रियता को संक्षेप में व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: κακόν
  choice: बुराई
  rationale: यहाँ नैतिक और विनाशकारी बल है, इसलिए केवल ‘हानि’ की अपेक्षा ‘बुराई’ उपयुक्त है।
- source_word: μεστὴ ἰοῦ θανατηφόρου
  choice: प्राणघातक विष से भरी हुई
  rationale: यह सुलभ हिन्दी में मूल के घातक विष वाले प्रबल चित्र को सुरक्षित रखता है।
theological_decisions:
- issue: οὐδεὶς के साथ ἀνθρώπων का मानवीय सार्वभौमिक आशय
  choice: कोई मनुष्य वश में नहीं कर सकता
  alternative: मनुष्यों में से कोई भी वश में नहीं कर सकता
  rationale: पहला रूप आधुनिक हिन्दी में अधिक सहज है और फिर भी कथन को समस्त मानवजाति पर लागू करता है; यह ऐसा निरपेक्ष कथन नहीं बनाता कि परमेश्वर भी जीभ को वश में नहीं कर सकता।
- issue: ἀκατάστατον का अर्थ-क्षेत्र
  choice: चंचल बुराई
  alternative: अस्थिर बुराई / बेलगाम बुराई
  rationale: मूल में अस्थिरता, बेचैनी और अव्यवस्था के बीच अर्थगत खुलापन है। मुख्य पाठ में स्वाभाविक पद चुना गया है और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘जीभ’ के रूपक तथा ‘वश में करना’ के संदर्भगत संबंध को बनाए रखा गया है।
