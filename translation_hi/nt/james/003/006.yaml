  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध रूप। ‘अंग’, ‘अधर्म’ और ‘कलंकित’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; कठिन यूनानी मुहावरे को मुख्य पाठ में संक्षिप्त और पादटिप्पणी में पारदर्शी बनाया गया है।
