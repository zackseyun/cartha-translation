source:
  edition: SBLGNT
  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: hi
  text: और जीभ आग है। जीभ हमारे अंगों में अधर्म के संसार के रूप में स्थित है; वह सारे शरीर को दूषित करती है[a], जन्म के चक्र को प्रज्वलित करती है[b], और स्वयं गेहन्ना द्वारा प्रज्वलित होती है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारे शरीर पर दाग लगाती है” या “सारे शरीर को अशुद्ध करती है।”
    reason: lexical_alternative
  - marker: b
    text: या, “जीवन की गति” या “जीवन-चक्र।” शाब्दिक रूप से, “जन्म का चक्र।”
    reason: lexical_alternative
  - marker: c
    text: गेहन्ना यूनानी शब्द है; परंपरागत रूप से इसका अनुवाद “नरक” किया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: जीभ
  rationale: शरीर के अंग का ठोस रूपक बनाए रखता है, जबकि प्रसंग में वाणी का लाक्षणिक अर्थ भी स्पष्ट रहता है।
- source_word: πῦρ
  choice: आग
  rationale: विनाशकारी शक्ति के प्रत्यक्ष रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: κόσμος τῆς ἀδικίας
  choice: अधर्म का एक संसार
  rationale: यूनानी की असामान्य और व्यापक नैतिक छवि को केवल ‘बुराई से भरी’ कहकर सरल नहीं करता।
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: हमारे अंगों के बीच ... बनकर स्थित है
  rationale: जीभ की देह के अंगों में स्थिति और उसकी वर्णित भूमिका—दोनों को व्यक्त करता है, बिना किसी नियुक्त करने वाले को जोड़ने के।
- source_word: σπιλοῦσα ὅλον τὸ σῶμα
  choice: सारे शरीर को कलंकित करती है
  rationale: दाग लगाने और नैतिक अशुद्धि, दोनों भावों को वर्तमान, सुबोध हिन्दी में समेटता है।
- source_word: φλογίζουσα τὸν τροχὸν τῆς γενέσεως
  choice: जीवन-चक्र में आग लगा देती है
  rationale: τροχός की चक्र-छवि सुरक्षित रखते हुए γένεσις को इस मुहावरे में जीवन/अस्तित्व के रूप में समझने योग्य बनाता है; कठिनाई को पादटिप्पणी में खोला गया है।
- source_word: φλογιζομένη ὑπὸ τῆς γεέννης
  choice: स्वयं गेहन्ना की आग से सुलगती है
  rationale: कर्मवाच्य और आग की आवर्ती छवि को बनाए रखता है तथा γέεννα को सामान्यीकृत किए बिना लिप्यंतरित करता है।
theological_decisions:
- issue: γέεννα का अनुवाद
  choice: गेहन्ना
  alternative: नरक
  rationale: विशिष्ट यूनानी पद और उसकी ऐतिहासिक छवि सुरक्षित रहती है; बाद की व्यापक धर्मवैज्ञानिक धारणाएँ अनावश्यक रूप से पाठ में नहीं डाली जातीं।
- issue: τὸν τροχὸν τῆς γενέσεως का अर्थ
  choice: जीवन-चक्र
  alternative: जन्म का चक्र; जीवन की पूरी गति
  rationale: यूनानी की चक्र-छवि और जीवन/अस्तित्व की व्यापकता दोनों रखी गई हैं; किसी एक व्याख्यात्मक विस्तार को निर्विवाद नहीं बनाया गया।
