source:
  edition: SBLGNT
  text: εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/014.yaml
  text: But if you have bitter jealousy and selfish ambition in your hearts[d][c][b][a], do not boast and lie against the truth.
translation:
  language: hi
  text: पर यदि तुम्हारे हृदयों में[d] कटु ईर्ष्या[a] और स्वार्थी महत्त्वाकांक्षा[b] हों, तो डींग मत मारो और सत्य के विरुद्ध झूठ मत बोलो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कटु जलन’ अथवा ‘कटु उत्साह’।
    reason: lexical_alternative
  - marker: b
    text: या ‘स्वार्थी प्रतिस्पर्धा’ अथवा ‘गुटबाज़ी’।
    reason: lexical_alternative
  - marker: c
    text: या ‘सत्य के प्रतिकूल झूठ मत बोलो’।
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप से ‘तुम्हारे हृदय में’; यहाँ एकवचन का प्रयोग समूह के प्रत्येक व्यक्ति के लिए वितरणात्मक अर्थ में हो सकता है।
    reason: source_form
lexical_decisions:
- source_word: ζῆλον πικρὸν
  choice: कटु ईर्ष्या
  rationale: ζῆλος का अर्थ प्रसंग के अनुसार उत्साह, जलन या ईर्ष्या हो सकता है। यहाँ ἐριθείαν के साथ इसका नकारात्मक प्रयोग है, इसलिए ‘ईर्ष्या’ मुख्य भाव को स्पष्ट करता है और ‘कटु’ πικρόν को सीधे बनाए रखता है।
- source_word: ἐριθείαν
  choice: स्वार्थी महत्त्वाकांक्षा
  rationale: यह शब्द आत्महित साधने वाली प्रतिस्पर्धी या गुटबाज़ प्रवृत्ति को व्यक्त कर सकता है। यह चुनाव भीतर की स्वार्थी प्रेरणा और उससे उत्पन्न विभाजनकारी प्रभाव—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: तुम्हारे हृदयों में
  rationale: यूनानी में ‘हृदय’ एकवचन और ‘तुम्हारे’ बहुवचन है, जो वितरणात्मक प्रयोग हो सकता है। समूह को संबोधित आधुनिक हिन्दी में बहुवचन स्पष्ट और स्वाभाविक है।
- source_word: μὴ κατακαυχᾶσθε
  choice: घमंड मत करो
  rationale: क्रिया में अपने को ऊँचा दिखाने या किसी के विरुद्ध गर्व करने का भाव है। ‘घमंड मत करो’ संक्षिप्त, सहज और प्रसंगानुकूल है।
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: सत्य के विरुद्ध झूठ मत बोलो
  rationale: ψεύδεσθε झूठ बोलने को और κατά + संबंधकारक विरोध को व्यक्त करता है। यह अनुवाद दोनों तत्वों को स्पष्ट रखते हुए वाक्य को स्वाभाविक बनाता है।
- source_word: εἰ δὲ
  choice: पर यदि
  rationale: δέ पिछले पदों में वर्णित ऊपर से आने वाली बुद्धि के साथ विरोध दिखाता है; ‘पर यदि’ इस अंतर को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ‘सत्य’ का आशय
  choice: ‘सत्य’ को व्यापक और अनिर्दिष्ट रखा गया है।
  alternative: इसे विशेष रूप से ‘सुसमाचार का सत्य’, ‘बुद्धि का सच्चा मार्ग’ या केवल ‘बोलने में सच्चाई’ कहना।
  rationale: ἀλήθεια को किसी एक doctrinal सूत्र या मात्र व्यक्तिगत ईमानदारी तक सीमित करना मूल पाठ से अधिक निश्चितता जोड़ देगा। व्यापक रूप आत्म-प्रशंसा और परमेश्वर के सत्य के बीच का तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है—सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘कटु ईर्ष्या’ और ‘स्वार्थी महत्त्वाकांक्षा’ मूल के नैतिक तनाव को बनाए रखते हैं; ‘सत्य’ को जानबूझकर व्यापक रखा गया है।
