  text: οὕτως καὶ ἡ γλῶσσα μικρὸν μέλος ἐστὶν καὶ ⸂μεγάλα αὐχεῖ⸃. Ἰδοὺ ⸀ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/005.yaml
  text: So also the tongue is a small member[a], and yet it boasts of great things[b]. See how small a fire sets ablaze so great a forest.
translation:
  language: hi
  text: इसी तरह जीभ भी शरीर का एक छोटा-सा अंग है, फिर भी वह बड़े-बड़े दावे करती है। देखो, कितनी छोटी आग कितने बड़े जंगल को जला देती है![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देखो, कितनी बड़ी आग कितने बड़े जंगल को जला देती है!” यूनानी शब्दों को विस्मयार्थक अर्थ में भी समझा जा सकता है; मुख्य पाठ में छोटे कारण से बड़े परिणाम का भाव रखा गया है, जो जीभ के छोटे अंग होने की तुलना से मेल खाता है। ὕλη का अर्थ “वन,” “लकड़ी,” या “ईंधन” भी हो सकता है।
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: जीभ
  rationale: शरीर के अंग का ठोस रूपक बनाए रखता है; यहाँ केवल ‘वाणी’ कहना मूल बिंब की व्याख्या कर देना होता।
- source_word: μικρὸν μέλος
  choice: शरीर का एक छोटा-सा अंग
  rationale: ‘अंग’ मूल शारीरिक बिंब को सुरक्षित रखता है, और ‘शरीर का’ जोड़ने से आधुनिक हिन्दी पाठक के लिए अर्थ सहज स्पष्ट होता है।
- source_word: μεγάλα αὐχεῖ
  choice: बड़ी-बड़ी बातों का घमण्ड करती है
  rationale: यह अभिव्यक्ति बड़े दावे करने और डींग मारने का भाव व्यक्त करती है; चुना हुआ रूप स्वाभाविक हिन्दी में गर्वपूर्ण वाणी का आशय बनाए रखता है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: ध्यान खींचने वाली मूल आज्ञार्थक शक्ति को आधुनिक और सहज हिन्दी में व्यक्त करता है।
- source_word: ἡλίκον πῦρ
  choice: कितनी छोटी आग
  rationale: निकटवर्ती तुलना में छोटे अंग द्वारा बड़े प्रभाव का विचार प्रमुख है; इसलिए आकार में छोटी आग का भाव मुख्य पाठ में रखा गया है, यद्यपि यूनानी वाक्यांश को विस्मयार्थक रूप से ‘कितनी बड़ी आग’ भी समझा जा सकता है।
- source_word: ἡλίκην ὕλην
  choice: कितने बड़े जंगल
  rationale: ὕλη वन, लकड़ी या ज्वलनशील सामग्री का बोध करा सकता है; आग के फैलने के इस चित्र में ‘जंगल’ स्वाभाविक और सजीव हिन्दी है।
- source_word: ἀνάπτει
  choice: जला देती है
  rationale: आग द्वारा बड़े जंगल को प्रज्वलित कर देने का परिणाम सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त होता है।
