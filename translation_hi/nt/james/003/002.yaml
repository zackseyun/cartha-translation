id: JAS.3.2
reference: James 3:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: hi
  text: क्योंकि हम सब अनेक प्रकार से ठोकर खाते हैं। यदि कोई बोलने में[a] ठोकर नहीं खाता, तो वही परिपक्व[b] पुरुष[c] है, जो पूरे शरीर को भी लगाम में रखने में समर्थ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “वचन में,” अर्थात वाणी में या अपनी कही हुई बात में।
    reason: lexical_alternative
  - marker: b
    text: या “सिद्ध” अथवा “पूर्ण।” यूनानी τέλειος का अर्थ सिद्ध, संपूर्ण या परिपक्व हो सकता है; यहाँ आशय संभवतः निरपेक्ष निष्पापता के बजाय नैतिक परिपक्वता से है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में “पुरुष” (ἀνήρ) है, जिसका प्रयोग यहाँ सामान्य कथन में प्रतिनिधिक अर्थ से हुआ है।
    reason: cultural_note
lexical_decisions:
- source_word: πολλὰ
  choice: अनेक प्रकार से
  rationale: यह नपुंसकलिंग बहुवचन यहाँ क्रियाविशेषण की तरह प्रयुक्त है और अनेक क्षेत्रों या ढंगों में चूकने का भाव देता है; ‘अनेक प्रकार से’ स्वाभाविक हिंदी में उसकी व्यापकता बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; हिंदी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: πταίομεν / πταίει
  choice: ठोकर खाते हैं / ठोकर नहीं खाता
  rationale: क्रिया शाब्दिक ठोकर और रूपकात्मक नैतिक चूक—दोनों का बोध करा सकती है। ‘ठोकर खाना’ याकूब की चित्रात्मक भाषा को सुरक्षित रखता है और इसे केवल ‘पाप करना’ कहकर सीमित नहीं करता।
- source_word: ἅπαντες
  choice: हम सब
  rationale: यह जोरदार समावेशी अभिव्यक्ति है, जिसमें लेखक स्वयं को भी सम्मिलित करता है।
- source_word: εἴ τις
  choice: यदि कोई
  rationale: यह एक सामान्य, अनिश्चित शर्त प्रस्तुत करता है और हिंदी में सहज है।
- source_word: ἐν λόγῳ
  choice: बोलने में
  rationale: λόγος यहाँ वाणी या कही हुई बात के अर्थ में है। ‘बोलने में’ सामान्य पाठक के लिए स्पष्ट है; शाब्दिक रूप फुटनोट में दिया गया है।
- source_word: οὗτος
  choice: वही
  rationale: निदर्शक सर्वनाम पहले बताए गए व्यक्ति पर जोर देता है; ‘वही’ उस बल को सामान्य ‘वह’ से बेहतर बनाए रखता है।
- source_word: τέλειος
  choice: परिपक्व
  rationale: इस नैतिक संदर्भ में शब्द पूर्णता, समग्रता या परिपक्वता का संकेत देता है। ‘परिपक्व’ आधुनिक हिंदी में निरपेक्ष निष्पापता का अनावश्यक अर्थ दिए बिना चरित्रगत पूर्णता की दिशा व्यक्त करता है।
- source_word: ἀνήρ
  choice: पुरुष
  rationale: यूनानी शब्द स्पष्ट रूप से पुल्लिंग है और यहाँ सामान्य प्रतिनिधिक कथन में आया है। ‘पुरुष’ स्रोत-रूप को बनाए रखता है; ‘यदि कोई’ से कथन का सामान्य अनुप्रयोग स्पष्ट होता है।
- source_word: δυνατὸς
  choice: समर्थ
  rationale: यह क्षमता का सीधा और गरिमापूर्ण हिंदी समतुल्य है।
- source_word: χαλιναγωγῆσαι
  choice: लगाम देने
  rationale: यह लगाम से नियंत्रित करने की चित्रात्मक क्रिया है। ‘लगाम देना’ अगले पदों में घोड़े और लगाम की छवि से संबंध सुरक्षित रखता है।
- source_word: καὶ
  choice: भी
  rationale: यह वाणी पर नियंत्रण के साथ पूरे शरीर पर नियंत्रण की अतिरिक्त क्षमता जोड़ता है।
theological_decisions:
- issue: नैतिक संदर्भ में τέλειος का अर्थ
  choice: परिपक्व
  alternative: सिद्ध या पूर्ण
  rationale: याकूब में यह शब्द चरित्र की समग्रता और परिपक्वता का बोध देता है। ठीक पहले ‘हम सब ... ठोकर खाते हैं’ कहा गया है, इसलिए ऐसा अनुवाद उचित नहीं जो आवश्यक रूप से पूर्ण निष्पापता बताए; फिर भी वैकल्पिक अर्थ फुटनोट में सुरक्षित है।
- issue: ἀνήρ का प्रतिनिधिक पुल्लिंग प्रयोग
  choice: पुरुष, सामान्य प्रतिनिधिक अर्थ में
  alternative: मनुष्य या व्यक्ति
  rationale: स्रोत में पुल्लिंग ἀνήρ है। उसे ‘पुरुष’ से व्यक्त किया गया है, जबकि आरंभिक ‘यदि कोई’ और फुटनोट यह स्पष्ट करते हैं कि कथन सामान्य रूप से लागू है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और चित्रात्मक रूप अपनाया गया है। ‘ठोकर खाना’ और ‘लगाम देना’ मूल की रूपक-श्रृंखला बनाए रखते हैं। वाक्य को अत्यधिक संस्कृतनिष्ठ बनाने से बचाते हुए ‘परिपक्व’ और ‘समर्थ’ जैसे प्रचलित औपचारिक शब्द चुने गए हैं।
