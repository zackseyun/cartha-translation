id: JAS.3.9
reference: James 3:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐν αὐτῇ εὐλογοῦμεν τὸν ⸀κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: hi
  text: इसी से हम प्रभु और पिता की स्तुति करते हैं,[a] और इसी से उन मनुष्यों को शाप देते हैं जो परमेश्वर की समानता के अनुसार बनाए गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “प्रभु और पिता”; इस पदबंध का अर्थ “प्रभु, जो पिता हैं” भी समझा जा सकता है, या इसे परमेश्वर के लिए संयुक्त संबोधन माना जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: इसी से
  rationale: यह पिछले संदर्भ की जीभ की ओर संकेत करता है। करण का भाव हिंदी में ‘इसी से’ द्वारा स्वाभाविक और स्पष्ट रूप से व्यक्त होता है।
- source_word: εὐλογοῦμεν
  choice: हम ... की स्तुति करते हैं
  rationale: परमेश्वर को संबोधित εὐλογέω के लिए ‘स्तुति करना’ आधुनिक हिंदी में स्वाभाविक है और आदरपूर्वक प्रशंसा का भाव रखता है; ‘आशीष देना’ यहाँ सामान्य पाठक को भ्रामक लग सकता है।
- source_word: τὸν κύριον καὶ πατέρα
  choice: प्रभु और पिता
  rationale: दोनों संज्ञाओं के बीच के καί को बनाए रखते हुए यूनानी वाक्यांश की संभावित समानाधिकरणात्मक अथवा युग्मित व्याख्या को अनिर्णीत रखा गया है।
- source_word: καταρώμεθα
  choice: शाप देते हैं
  rationale: यह εὐλογοῦμεν के साथ तीखा नैतिक विरोध बनाए रखता है और यूनानी क्रिया का सीधा हिंदी समतुल्य है।
- source_word: τοὺς ἀνθρώπους
  choice: उन मनुष्यों को
  rationale: ἀνθρώπους यहाँ समस्त मानवजाति के लिए प्रयुक्त है; ‘मनुष्य’ लिंग-समावेशी और सृष्टि-संदर्भ के अनुकूल है।
- source_word: καθ’ ὁμοίωσιν θεοῦ
  choice: परमेश्वर की समानता के अनुसार
  rationale: यह κατά और ὁμοίωσις की औपचारिक भाषा को सुरक्षित रखता है तथा उत्पत्ति की सृष्टि-भाषा की प्रतिध्वनि बनाए रखता है।
- source_word: γεγονότας
  choice: बनाए गए हैं
  rationale: सिद्धकालिक कृदंत के परिणामी वर्तमान भाव को व्यक्त करता है और सृष्टि-संदर्भ में निहित दिव्य कर्तृत्व को स्वाभाविक हिंदी में सामने लाता है।
theological_decisions:
- issue: ‘प्रभु और पिता’ का परस्पर संबंध
  choice: प्रभु और पिता
  alternative: प्रभु, अर्थात् पिता
  rationale: यूनानी पदबंध समानाधिकरण (‘प्रभु, जो पिता हैं’) अथवा एक संयुक्त उपाधि के रूप में समझा जा सकता है। मुख्य पाठ इसे अधिक स्पष्ट करके वास्तविक अस्पष्टता को समाप्त नहीं करता।
- issue: ἀνθρώπους का सामान्य मानव-संदर्भ
  choice: मनुष्यों
  alternative: पुरुषों
  rationale: संदर्भ केवल पुरुषों का नहीं, बल्कि परमेश्वर की समानता में बनाए गए सभी मानवों का है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘इसी से’ की पुनरावृत्ति यूनानी वाक्य की समानांतर संरचना और जीभ के विरोधाभासी उपयोग पर बल देती है।
