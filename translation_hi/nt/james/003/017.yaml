source:
  edition: SBLGNT
  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: hi
  text: परन्तु ऊपर से आने वाली बुद्धि सबसे पहले शुद्ध होती है; फिर वह शांतिप्रिय, सौम्य, समझाने पर मानने वाली, दया और अच्छे फलों से भरपूर, निष्पक्ष[a] और निष्कपट होती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बिना पक्षपात के”; यूनानी शब्द ἀδιάκριτος का अर्थ “अविभाजित” या “बिना दुविधा के” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: ऊपर से आनेवाली
  rationale: यह यूनानी शब्द के स्थान-सूचक रूपक को बनाए रखता है और निकटवर्ती संदर्भ में ‘सांसारिक’ बुद्धि के विपरीत इस बुद्धि के स्रोत को व्यक्त करता है, बिना ‘स्वर्ग से’ कहकर अर्थ को अधिक स्पष्ट करने के।
- source_word: σοφία
  choice: बुद्धि
  rationale: यह इस संदर्भ में वर्णित विवेक और जीवन-दृष्टि के लिए मानक, सहज हिन्दी शब्द है।
- source_word: πρῶτον μὲν … ἔπειτα
  choice: सबसे पहले … फिर
  rationale: यह गुणों के क्रम को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἁγνή
  choice: शुद्ध
  rationale: यह नैतिक पवित्रता और मिलावट-रहित सत्यनिष्ठा, दोनों की संभावना को संक्षेप में व्यक्त करता है।
- source_word: εἰρηνική
  choice: शांतिप्रिय
  rationale: यह केवल शांत अवस्था नहीं, बल्कि शांति की ओर प्रवृत्त स्वभाव को दर्शाता है।
- source_word: ἐπιεικής
  choice: नम्र
  rationale: सामान्य पाठक के लिए सहज शब्द; यह कठोरता के विपरीत सौम्यता और दूसरों के प्रति विचारशील व्यवहार को व्यक्त करता है, यद्यपि यूनानी में उदारता और सहनशीलता की छाया भी है।
- source_word: εὐπειθής
  choice: समझाने पर माननेवाली
  rationale: यह दुर्लभ विशेषण ऐसे ग्रहणशील और हठरहित स्वभाव को दर्शाता है जो उचित बात सुनकर मानने को तैयार हो; इससे अंधी आज्ञाकारिता का भाव नहीं आता।
- source_word: μεστὴ ἐλέους
  choice: दया … से भरपूर
  rationale: यह दया की प्रचुरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καρπῶν ἀγαθῶν
  choice: अच्छे फलों
  rationale: बहुवचन और फल के मूल रूपक को बनाए रखा गया है; इसे ‘अच्छे काम’ कहकर व्याख्यात्मक रूप से सीमित नहीं किया गया।
- source_word: ἀδιάκριτος
  choice: निष्पक्ष
  rationale: नैतिक गुणों की इस सूची और याकूब में पक्षपात की आलोचना के संदर्भ में यह उपयुक्त है; फिर भी शब्द की ‘अविभाजित’ या ‘बिना दुविधा’ होने की संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: ἀνυπόκριτος
  choice: निष्कपट
  rationale: यह दिखावे और कपट से रहित वास्तविकता को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἀδιάκριτος का अर्थ
  choice: निष्पक्ष
  alternative: एकनिष्ठ/अविभाजित, या बिना दुविधा के
  rationale: याकूब 2 में पक्षपात की निंदा और यहाँ दया तथा अच्छे फलों के सामाजिक-नैतिक संदर्भ के कारण ‘निष्पक्ष’ मुख्य पाठ में सबसे उपयुक्त है। फिर भी याकूब 1 और 4 में दुविधाग्रस्त या दोहरे मन की विषयवस्तु अन्य अर्थों को संभव बनाती है, इसलिए उन्हें पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। स्त्रीलिंग विशेषणों की शृंखला ‘बुद्धि’ से जुड़ी है। अर्धविराम पहले और बाद के गुणों के क्रम को स्पष्ट करता है।
