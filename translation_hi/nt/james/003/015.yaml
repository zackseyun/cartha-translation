source:
  edition: SBLGNT
  text: οὐκ ἔστιν αὕτη ἡ σοφία ἄνωθεν κατερχομένη, ἀλλὰ ἐπίγειος, ψυχική, δαιμονιώδης·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: hi
  text: यह बुद्धि ऊपर से उतरने वाली नहीं है, बल्कि पार्थिव, अनात्मिक और दुष्टात्माओं से संबंधित है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: यह वह बुद्धि
  rationale: संकेतवाचक पद संदर्भ में अभी वर्णित बुद्धि की ओर इंगित करता है; यह रूप उस संकेत को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἄνωθεν
  choice: ऊपर से
  rationale: यह यूनानी शब्द का सीधा अर्थ है और याकूब 1:17 के अनुरूप दिव्य उद्गम की प्रतिध्वनि को बिना 'स्वर्ग से' जोड़कर स्पष्ट किए सुरक्षित रखता है।
- source_word: κατερχομένη
  choice: उतरती है
  rationale: वर्तमान कृदन्त की जारी क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπίγειος
  choice: सांसारिक
  rationale: यह ऊपर से आने वाली बुद्धि के विपरीत पृथ्वी के क्षेत्र से संबंधित होने को व्यक्त करता है; हिन्दी में 'पार्थिव' की अपेक्षा अधिक सुबोध है।
- source_word: ψυχική
  choice: आत्मिक नहीं
  rationale: यह आत्मा से संबंधित बात के साथ नकारात्मक विरोध को सामान्य पाठक के लिए स्पष्ट रखता है, जबकि पादटिप्पणी 'स्वाभाविक' अर्थ की वास्तविक शाब्दिक संभावना बताती है।
- source_word: δαιμονιώδης
  choice: दुष्टात्माओं जैसी
  rationale: विशेषण का अर्थ दुष्टात्माओं से संबंधित या उनके स्वभाव की ओर संकेत करना है; यह हिन्दी में स्पष्ट और स्वाभाविक है तथा एकवचन 'शैतानी' से होने वाली अर्थ-संकीर्णता से बचता है।
theological_decisions:
- issue: ψυχική का आत्मिक और नैतिक विरोध
  choice: आत्मिक नहीं
  alternative: स्वाभाविक; प्राण-संबंधी
  rationale: संदर्भ में ऊपर से आने वाली बुद्धि के साथ नकारात्मक धार्मिक विरोध प्रमुख है। फिर भी शब्द केवल स्वाभाविक जीवन से संबंधित होने का अर्थ भी दे सकता है, इसलिए उस संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सुबोध और गरिमापूर्ण हिन्दी। तीनों नकारात्मक विशेषणों की क्रमिक तीव्रता बनाए रखी गई है; तकनीकी और अप्रचलित 'प्राणिक' से बचा गया है।
