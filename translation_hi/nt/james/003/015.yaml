- from: यह वह बुद्धि नहीं है जो ऊपर से उतरती है, बल्कि यह सांसारिक, आत्मिक नहीं[a] और दुष्टात्माओं जैसी है।
  to: यह बुद्धि ऊपर से उतरने वाली नहीं है, बल्कि पार्थिव, अनात्मिक और दुष्टात्माओं से संबंधित है।
