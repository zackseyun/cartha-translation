lexical_decisions:
- source_word: μήτι
  choice: क्या ...?
  rationale: यह प्रश्न नकारात्मक उत्तर की अपेक्षा करता है। हिंदी में संदर्भ के भीतर सरल ‘क्या’ से आरंभ किया गया आलंकारिक प्रश्न इस बल को स्वाभाविक रूप से व्यक्त करता है; ‘क्या ऐसा हो सकता है’ जोड़ना मूल से अधिक व्याख्यात्मक होता।
- source_word: ἡ πηγή
  choice: सोता
  rationale: यहाँ प्राकृतिक जलस्रोत का चित्र है। ‘सोता’ आधुनिक हिंदी में भूमिगत जल के फूट निकलने वाले स्रोत को ठीक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἐκ τῆς αὐτῆς ὀπῆς
  choice: एक ही मुहाने से
  rationale: ὀπή का मूल अर्थ छिद्र या खुला स्थान है। जलस्रोत के संदर्भ में ‘मुहाना’ स्वाभाविक है और भौतिक निकास-बिंदु का चित्र बनाए रखता है।
- source_word: βρύει
  choice: फूटता है
  rationale: क्रिया जल के उमड़ने, फूटने या बह निकलने का बोध देती है। ‘फूटता है’ सोते के लिए स्वाभाविक हिंदी है और गत्यात्मक चित्र बचाए रखता है।
- source_word: τὸ γλυκύ
  choice: मीठा पानी
  rationale: विशेषण संज्ञा के रूप में प्रयुक्त है और आशय जल से है। स्पष्टता के लिए ‘पानी’ जोड़ा गया है; ‘मीठा’ मूल विरोध को बनाए रखता है।
- source_word: τὸ πικρόν
  choice: कड़वा पानी
  rationale: विशेषण संज्ञा के रूप में प्रयुक्त है और आशय जल से है। ‘कड़वा’ γλυκύ के साथ मूल स्वाद-विरोध को सीधे व्यक्त करता है।
