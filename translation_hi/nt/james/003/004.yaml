language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἰδοὺ καὶ τὰ πλοῖα, τηλικαῦτα ὄντα καὶ ὑπὸ ⸂ἀνέμων σκληρῶν⸃ ἐλαυνόμενα, μετάγεται ὑπὸ ἐλαχίστου πηδαλίου ὅπου ⸂ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: hi
  text: जहाज़ों को भी देखो। वे इतने बड़े होते हैं और प्रचण्ड हवाओं से धकेले जाते हैं, फिर भी एक बहुत छोटी-सी पतवार से जिस ओर चलानेवाले की इच्छा[a] होती है, मोड़े जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिधर जहाज़ चलानेवाला जाना चाहता है।” यूनानी में अधिक शाब्दिक रूप से, “जहाँ चलानेवाले की प्रेरणा चाहती है।”
    reason: ὁρμή और βούλεται के असामान्य संयोजन की अधिक सहज तथा अधिक शाब्दिक—दोनों सम्भावनाएँ दिखाने के लिए।
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: जहाज़ों को भी देखो
  rationale: ἰδοὺ को आधुनिक हिन्दी में ध्यान खींचने वाली आज्ञा ‘देखो’ के रूप में रखा गया है; καὶ पिछले उदाहरण के समानांतर एक और उदाहरण जोड़ता है।
- source_word: τηλικαῦτα ὄντα
  choice: वे इतने बड़े होते हैं
  rationale: τηλικαῦτα जहाज़ों के प्रभावशाली आकार पर बल देता है। हिन्दी वाक्य में आगे आने वाली छोटी पतवार के साथ इसका विरोध स्पष्ट है।
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: प्रचण्ड हवाओं से धकेले जाते हैं
  rationale: σκληρῶν यहाँ हवाओं की कठोर और तीव्र शक्ति बताता है; ‘प्रचण्ड’ स्वाभाविक हिन्दी में उस बल को व्यक्त करता है। कर्मवाच्य रूप ἐλαυνόμενα को भी बनाए रखा गया है।
- source_word: μετάγεται
  choice: मोड़े जाते हैं
  rationale: समुद्री संदर्भ में क्रिया जहाज़ों को दिशा देने या मोड़ने का बोध कराती है। ‘मोड़े जाते हैं’ पतवार की दिशा-नियंत्रक भूमिका को सहज हिन्दी में स्पष्ट करता है।
- source_word: ὑπὸ ἐλαχίστου πηδαλίου
  choice: एक बहुत छोटी-सी पतवार से
  rationale: ἐλαχίστου का अतिशयोक्तिपरक बल ‘बहुत छोटी-सी’ से व्यक्त हुआ है, जबकि πηδάλιον के लिए सामान्य और परिचित शब्द ‘पतवार’ चुना गया है।
- source_word: ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: उस ओर ... जिधर उन्हें चलानेवाले की इच्छा होती है
  rationale: यह सहज हिन्दी में गन्तव्य और चालक की इच्छा दोनों व्यक्त करता है। मूल में ὁρμή (‘झुकाव/प्रेरणा’) और βούλεται (‘चाहती है’) का असामान्य संयोजन है; उसकी अधिक शाब्दिक बनावट फुटनोट में सुरक्षित रखी गई है।
theological_decisions:
- issue: चालक की इच्छा बताने वाले वाक्यांश की शाब्दिकता
  choice: जिधर उन्हें चलानेवाले की इच्छा होती है
  alternative: जिधर चलानेवाले के मन का झुकाव चाहता है; अथवा, जिधर जहाज़ चलानेवाला जाना चाहता है
  rationale: मुख्य पाठ में अर्थ को स्वाभाविक आधुनिक हिन्दी में रखा गया है, पर ὁρμή और βούλεται के विशिष्ट मेल को पूरी तरह छिपाया नहीं गया; अधिक शाब्दिक रूप फुटनोट में दिया गया है। इससे रूपक में छोटे साधन के पीछे काम करने वाली चालक की आन्तरिक प्रवृत्ति का संकेत बना रहता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक अर्थ आरोपित किए।
translation_notes:
  register: भाषा आधुनिक, सामान्य और गरिमापूर्ण रखी गई है। ‘जहाज़’, ‘प्रचण्ड हवाएँ’ और ‘पतवार’ साधारण पाठक के लिए परिचित हैं। ‘कर्णधार’ जैसे अधिक साहित्यिक या तकनीकी शब्द से बचा गया है, क्योंकि εὐθύνων केवल दिशा देने वाले व्यक्ति को सूचित करता है।
