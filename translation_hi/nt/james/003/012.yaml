source:
  edition: SBLGNT
  text: μὴ δύναται, ἀδελφοί μου, συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα; ⸂οὔτε ἁλυκὸν⸃ γλυκὺ ποιῆσαι ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: hi
  text: मेरे भाइयो,[a] क्या अंजीर का पेड़ जैतून दे सकता है, या अंगूर की बेल अंजीर? न ही खारा पानी[c] ताज़ा पानी[b] दे सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे भाइयो और बहनो।” यूनानी में “भाइयो” के लिए पुल्लिंग बहुवचन रूप है, जिसका प्रयोग स्त्री-पुरुष दोनों से बने समूह को संबोधित करने के लिए भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “मीठा पानी” है; खारे पानी के विरोध में इसका अर्थ “ताज़ा पानी” है।
    reason: lexical_alternative
  - marker: c
    text: 'यूनानी पाठ में “न ही खारा” शब्द पाठगत रूप से अनिश्चित हैं। पिछले पद के स्रोत के बिंब को ध्यान में रखते हुए वाक्य का अर्थ यह भी हो सकता है: “न ही कोई खारा स्रोत ताज़ा पानी दे सकता है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: मेरे भाइयो
  rationale: यूनानी में संबोधन का पुल्लिंग बहुवचन है। मुख्य पाठ उसके रूप को बनाए रखता है; पूरे समुदाय को समावेशी रूप से संबोधित करने की सम्भावना पाद-टिप्पणी में दी गई है।
- source_word: μὴ δύναται
  choice: क्या ... कर सकता है
  rationale: μή से आरम्भ हुआ यह अलंकारिक प्रश्न नकारात्मक उत्तर की अपेक्षा करता है। हिन्दी में प्रश्नात्मक रूप स्वयं इस आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: συκῆ
  choice: अंजीर का पेड़
  rationale: यह संज्ञा फल नहीं, पेड़ को दर्शाती है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक रूप है।
- source_word: ἐλαίας ποιῆσαι
  choice: जैतून उत्पन्न कर सकता है
  rationale: यहाँ ποιέω का अर्थ फल पैदा करना या फलना है। ‘उत्पन्न करना’ कृषि-संबंधी बिंब को स्पष्ट रखता है।
- source_word: ἄμπελος
  choice: अंगूर की बेल
  rationale: सिर्फ ‘बेल’ की अपेक्षा यह अभिप्रेत पौधे को स्पष्ट करता और समानांतर कृषि-बिंब को बनाए रखता है।
- source_word: σῦκα
  choice: अंजीर
  rationale: बहुवचन फल का सामान्य हिन्दी नाम; हिन्दी में ‘अंजीर’ रूप संख्या के अनुसार प्रायः अपरिवर्तित रहता है।
- source_word: οὔτε ἁλυκὸν
  choice: और न ही खारा पानी
  rationale: यूनानी पद संक्षिप्त और अध्याहारयुक्त है; ἁλυκόν विशेषण का संज्ञावत् प्रयोग ‘खारा [पानी/स्रोत]’ के अर्थ में हुआ है। मुख्य पाठ में ‘खारा पानी’ न्यूनतम आवश्यक स्पष्टता देता है, जबकि ‘खारा स्रोत’ की सम्भावना पाद-टिप्पणी में सुरक्षित है।
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: मीठा पानी उत्पन्न कर सकता है
  rationale: γλυκύς का शाब्दिक अर्थ ‘मीठा’ है और यहाँ वह खारे पानी के विपरीत पीने योग्य ताजे पानी को सूचित करता है। ‘मीठा पानी’ हिन्दी में स्वाभाविक है और मूल शब्द-चित्र को भी बनाए रखता है।
