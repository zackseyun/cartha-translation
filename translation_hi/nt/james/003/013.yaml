id: JAS.3.13
reference: James 3:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: hi
  text: तुम में बुद्धिमान और समझदार कौन है? वह अपने अच्छे चाल-चलन से अपने कामों को उस नम्रता के साथ दिखाए जो बुद्धि से आती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुद्धि की नम्रता के साथ।”
    reason: σοφίας संबंधकारक को स्रोत (‘बुद्धि से आने वाली’) के बजाय गुण या संबंध (‘बुद्धि की’) के रूप में भी समझा जा सकता है।
lexical_decisions:
- source_word: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν
  choice: तुम में बुद्धिमान और समझदार कौन है?
  rationale: प्रश्न की आलंकारिक प्रकृति और समुदाय के भीतर ऐसे व्यक्ति की पहचान को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है। σοφός के लिए ‘बुद्धिमान’ और ἐπιστήμων के लिए ‘समझदार’ नैतिक एवं व्यावहारिक समझ का उपयुक्त युग्म है।
- source_word: δειξάτω
  choice: वह ... दिखाए
  rationale: तीसरे पुरुष एकवचन आज्ञार्थक बल को हिन्दी में स्वाभाविक रूप से व्यक्त करता है। ‘वह’ यूनानी के प्रतिनिधिक एकवचन को रखता है और किसी भी ऐसे व्यक्ति पर लागू हो सकता है।
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: अपने अच्छे चाल-चलन से
  rationale: ἐκ यहाँ माध्यम अथवा प्रकट होने के आधार को सूचित करता है; ἀναστροφή किसी व्यक्ति के आचरण या जीवन-व्यवहार को दर्शाता है। ‘चाल-चलन’ साधारण पाठक के लिए व्यापक और स्वाभाविक है।
- source_word: τὰ ἔργα αὐτοῦ
  choice: अपने कामों को
  rationale: ἔργα का सीधा अर्थ काम या कार्य है और यह याकूब-पत्र में कर्मों पर दिए गए बल से शब्दगत संबंध बनाए रखता है। आत्मवाचक ‘अपने’ हिन्दी में कर्ता से संबंध स्पष्ट करता है।
- source_word: ἐν πραΰτητι σοφίας
  choice: उस नम्रता के साथ ... जो बुद्धि से आती है
  rationale: πραΰτης को ‘नम्रता’ से व्यक्त किया गया है, जो दुर्बलता नहीं बल्कि संयमित और कोमल स्वभाव की नैतिक विशेषता है। σοφίας संबंधवाचक रूप में स्रोत या विशेषता दोनों का संकेत दे सकता है; मुख्य पाठ में स्वाभाविक हिन्दी हेतु स्रोतगत अर्थ लिया गया है और वैकल्पिक संरचना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: पुल्लिंग एकवचन आज्ञार्थक का प्रतिनिधिक बल
  choice: वह ... दिखाए
  alternative: ऐसा व्यक्ति ... दिखाए / वे ... दिखाएँ
  rationale: यूनानी पाठ एकवचन रूप का प्रयोग करता है, जो समुदाय के किसी भी ऐसे व्यक्ति का प्रतिनिधित्व कर सकता है। हिन्दी का ‘वह’ मूल संख्या को बनाए रखते हुए अनावश्यक रूप से आशय सीमित नहीं करता।
- issue: σοφίας संबंधकारक का अर्थ-संबंध
  choice: वह नम्रता जो बुद्धि से आती है
  alternative: बुद्धि की नम्रता / बुद्धि से युक्त नम्रता
  rationale: संबंधकारक को स्रोतगत मानना संभव है, पर वह गुणसूचक भी हो सकता है। इसलिए मुख्य पाठ पठनीय स्रोतगत अर्थ देता है और पादटिप्पणी वास्तविक वैकल्पिक संबंध को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और उपदेशात्मक शैली। ‘चाल-चलन’ सामान्य पाठक के लिए समझने योग्य है; ‘नम्रता’ πραΰτης के नैतिक भाव को स्वाभाविक हिन्दी में व्यक्त करती है।
