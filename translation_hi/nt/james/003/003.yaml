base_translation:
  language: en
  yaml_path: translation/nt/james/003/003.yaml
  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: hi
  text: यदि हम घोड़ों को अपनी बात मानने के लिए उनके मुँह में लगाम की छड़[a] डालते हैं, तो हम उनके पूरे शरीर को भी दिशा देते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘लगाम’; यहाँ विशेष रूप से लगाम का वह हिस्सा अभिप्रेत है जो घोड़े के मुँह में रखा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: यदि
  rationale: यह उदाहरण के रूप में एक शर्त प्रस्तुत करता है। हिन्दी में ‘यदि’ शर्त को स्वाभाविक रूप से व्यक्त करता है; δέ का हल्का संयोजक बल संदर्भ से स्पष्ट है, इसलिए अलग से ‘परन्तु’ जोड़ना आवश्यक नहीं है।
- source_word: χαλινοὺς
  choice: लगाम
  rationale: मुँह में डाली जाने वाली वस्तु के लिए सामान्य हिन्दी में ‘लगाम’ सबसे सहज शब्द है। यूनानी शब्द यहाँ अधिक विशेष रूप से लगाम के उस हिस्से को सूचित करता है जो घोड़े के मुँह में रहता है; इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: εἰς τὰ στόματα βάλλομεν
  choice: घोड़ों के मुँह में ... डालते हैं
  rationale: εἰς के दिशात्मक भाव और βάλλομεν के सामान्य ‘रखना/डालना’ अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: ताकि वे हमारी मानें
  rationale: यहाँ εἰς के साथ क्रियार्थक संज्ञा उद्देश्य व्यक्त करती है, और πείθεσθαι के साथ ἡμῖν का अर्थ ‘हमारी आज्ञा मानना’ है। ‘हमारी मानें’ सहज है और कारणात्मक बल को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: ὅλον τὸ σῶμα αὐτῶν
  choice: उनके पूरे शरीर को
  rationale: यूनानी में ‘शरीर’ एकवचन रूप में बहुवचन घोड़ों के लिए वितरणात्मक ढंग से प्रयुक्त है। हिन्दी में ‘उनके पूरे शरीर को’ इसी विचार को सहज रूप से व्यक्त करता है।
- source_word: μετάγομεν
  choice: हम ... मोड़ लेते हैं
  rationale: क्रिया किसी वस्तु या प्राणी की दिशा मोड़ने अथवा उसे निर्देशित करने का भाव देती है। घोड़े और लगाम के चित्र में ‘मोड़ लेते हैं’ स्वाभाविक और ठोस है।
