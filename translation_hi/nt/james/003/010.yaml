  text: ἐκ τοῦ αὐτοῦ στόματος ἐξέρχεται εὐλογία καὶ κατάρα. οὐ χρή, ἀδελφοί μου, ταῦτα οὕτως γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/010.yaml
  text: From the same mouth come blessing and cursing. My brothers[a], these things ought not to be so.
translation:
  language: hi
  text: उसी मुँह से आशीष और शाप निकलते हैं। मेरे भाइयो[a], ये बातें इस प्रकार नहीं होनी चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे भाइयो और बहनो”; यूनानी में “भाइयो” है, पर सन्दर्भ में याकूब सम्भवतः पूरे विश्वासी समुदाय को संबोधित कर रहा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: उसी मुँह से
  rationale: यह स्रोत या उद्गम के बिंब को सीधे और स्वाभाविक हिन्दी में बनाए रखता है; αὐτοῦ का बल ‘उसी’ से व्यक्त होता है।
- source_word: ἐξέρχεται
  choice: निकलते हैं
  rationale: वाणी के मुँह से बाहर आने के चित्र को स्वाभाविक हिन्दी में व्यक्त करता है। यूनानी में क्रिया एकवचन है, पर संयुक्त कर्ता ‘आशीष और शाप’ के साथ हिन्दी में बहुवचन स्वाभाविक है।
- source_word: εὐλογία
  choice: आशीष
  rationale: संदर्भ में इसका अर्थ मुँह से कही गई आशीष है; यह κατάρα के साथ स्पष्ट विरोध भी बनाए रखता है।
- source_word: κατάρα
  choice: शाप
  rationale: यह शाप देने वाली वाणी को संक्षेप और स्पष्टता से व्यक्त करता है तथा ‘आशीष’ का स्वाभाविक प्रतिलोम है।
- source_word: οὐ χρή
  choice: नहीं होना चाहिए
  rationale: χρή में निहित नैतिक अनुचितता और अपेक्षा को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना इसे पूर्ण असंभवता का कथन बनाए।
- source_word: ἀδελφοί μου
  choice: मेरे भाइयो
  rationale: यूनानी के पुल्लिंग बहुवचन संबोधन को मुख्य पाठ में रूप-संगत ढंग से रखा गया है; व्यापक समुदाय को संबोधित करने की सम्भावना पादटिप्पणी में दी गई है।
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: ऐसा ... होना
  rationale: हिन्दी का एकवचन संकेतवाचक ‘ऐसा’ पहले बताए गए संयुक्त व्यवहार—एक ही मुँह से आशीष और शाप निकलने—को स्वाभाविक रूप से समेटता है और οὕτως का ‘इस प्रकार’ भाव सुरक्षित रखता है।
theological_decisions:
- issue: ἀδελφοί μου में लिंगयुक्त पारिवारिक संबोधन
  choice: मेरे भाइयो
  alternative: मेरे भाइयो और बहनो
  rationale: मुख्य पाठ यूनानी के स्पष्ट पुल्लिंग बहुवचन रूप को दर्शाता है। फिर भी याकूब सम्भवतः पूरे विश्वासी समुदाय को संबोधित कर रहा है, इसलिए समावेशी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘उसी मुँह से’ मूल रूपक को बनाए रखता है; ‘ऐसा नहीं होना चाहिए’ यूनानी निषेध की नैतिक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
