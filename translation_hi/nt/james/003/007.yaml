source:
  edition: SBLGNT
  text: πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων δαμάζεται καὶ δεδάμασται τῇ φύσει τῇ ἀνθρωπίνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: hi
  text: क्योंकि हर प्रकार के जंगली पशु, पक्षी, रेंगनेवाले जीव और समुद्री जीव मनुष्यजाति के द्वारा[a] वश में किए जा रहे हैं और वश में किए गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानवीय स्वभाव के द्वारा” अथवा “मानव प्रकृति के द्वारा।” यूनानी पदबंध को सामूहिक रूप से मनुष्यजाति के लिए या अधिक अमूर्त रूप से मानवीय प्रकृति के लिए समझा जा सकता है; मुख्य पाठ में सामूहिक अर्थ लिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: हर प्रकार
  rationale: प्राणियों की इस सूची में φύσις का आशय ‘प्रकृति’ के बजाय प्रकार या जाति है; ‘हर प्रकार’ πᾶσα की वितरणात्मक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ उस तार्किक संबंध को स्पष्ट रखता है।
- source_word: θηρίων
  choice: जंगली पशु
  rationale: θηρίον सामान्यतः वन्य या अदमित पशु को सूचित करता है; ‘जंगली पशु’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: πετεινῶν
  choice: पक्षी
  rationale: यह उड़नेवाले जीवों, विशेषतः पक्षियों, के लिए प्रयुक्त है; ‘पक्षी’ सूची में संक्षिप्त और सहज है।
- source_word: ἑρπετῶν
  choice: रेंगनेवाले जीव
  rationale: ἑρπετόν केवल आधुनिक जैविक श्रेणी ‘सरीसृप’ तक सीमित नहीं है, बल्कि व्यापक रूप से रेंगनेवाले जीव को दर्शा सकता है; इसलिए व्यापक अर्थ सुरक्षित रखा गया है।
- source_word: ἐναλίων
  choice: समुद्री जीव
  rationale: यह समुद्र में रहनेवाले प्राणियों का व्यापक संकेत है; ‘समुद्री जीव’ संक्षिप्त और स्वाभाविक है।
- source_word: δαμάζεται
  choice: वश में किए जा रहे हैं
  rationale: वर्तमान कर्मवाच्य चलती या सामान्य प्रक्रिया को व्यक्त करता है; यह रूप उस पक्ष को बनाए रखता है।
- source_word: δεδάμασται
  choice: वश में किए गए हैं
  rationale: पूर्ण कर्मवाच्य पहले संपन्न किए गए वशीकरण और उसके वर्तमान परिणाम को संकेत करता है; दोनों क्रियाओं का भेद हिन्दी में रखा गया है।
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: मनुष्यजाति के द्वारा
  rationale: प्रसंग में यह मानव समुदाय को सामूहिक कर्ता के रूप में समझा जा सकता है। ‘मनुष्यजाति’ आधुनिक, समावेशी और सामूहिक अभिव्यक्ति है; वैकल्पिक अमूर्त अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: τῇ φύσει τῇ ἀνθρωπίνῃ का सामूहिक या अमूर्त अर्थ
  choice: मुख्य पाठ में ‘मनुष्यजाति के द्वारा’
  alternative: ‘मानवीय स्वभाव के द्वारा’ अथवा ‘मानव प्रकृति के द्वारा’
  rationale: प्राणियों को वश में करने के प्रसंग में मानवजाति को सामूहिक कर्ता मानना अधिक स्वाभाविक है, पर यूनानी पदबंध अमूर्त ‘मानवीय प्रकृति/स्वभाव’ का अर्थ भी दे सकता है; इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘वश में किए जा रहे हैं’ और ‘वश में किए गए हैं’ द्वारा यूनानी वर्तमान और पूर्ण कर्मवाच्य का अंतर बचाया गया है। पादटिप्पणी-चिह्न उस पूरे पदबंध के बाद रखा गया है जिससे वह संबंधित है।
