id: JAS.3.16
reference: James 3:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: hi
  text: क्योंकि जहाँ ईर्ष्या[a] और स्वार्थी महत्त्वाकांक्षा होती है, वहाँ अव्यवस्था और हर प्रकार का बुरा काम[b] होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जलन।” यूनानी शब्द का अर्थ “उत्साह” भी हो सकता है, पर यहाँ संदर्भ स्पष्ट रूप से नकारात्मक है।
    reason: lexical_alternative
  - marker: b
    text: या, “हर बुरी बात” अथवा “हर बुरा काम।” शाब्दिक रूप से, “हर बुरी वस्तु/बात।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: जहाँ
  rationale: यह एक सामान्य स्थानगत परिस्थिति प्रस्तुत करता है और ἐκεῖ (‘वहाँ’) के साथ ‘जहाँ… वहाँ…’ की स्वाभाविक संरचना बनाता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के कारण या स्पष्टीकरण से इस वाक्य का संबंध बनाए रखता है।
- source_word: ζῆλος
  choice: ईर्ष्या
  rationale: यद्यपि इस शब्द का अर्थ ‘उत्साह’ भी हो सकता है, 3:14-15 का नकारात्मक संदर्भ यहाँ ईर्ष्या या जलन जैसे दुर्गुण का संकेत देता है।
- source_word: ἐριθεία
  choice: स्वार्थी महत्त्वाकांक्षा
  rationale: यह पद स्वार्थपूर्ण उन्नति, प्रतिस्पर्धा और गुटबाज़ी की प्रवृत्ति को व्यक्त करता है; चुना हुआ पदबंध आधुनिक हिन्दी में उद्देश्य और सामाजिक प्रभाव दोनों को स्पष्ट करता है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: यह ὅπου के साथ संबंध रखकर मूल की सूक्तिपरक ‘जहाँ… वहाँ…’ रचना को सुरक्षित रखता है।
- source_word: ἀκαταστασία
  choice: अव्यवस्था
  rationale: यह केवल मानसिक उलझन नहीं, बल्कि अस्थिरता, अशांति और सामुदायिक विघटन का भाव व्यक्त करता है।
- source_word: πᾶν
  choice: हर प्रकार का
  rationale: एकवचन πρᾶγμα के साथ इसका व्यापक वितरणात्मक अर्थ सहज हिन्दी में व्यक्त होता है।
- source_word: φαῦλον
  choice: बुरा
  rationale: संदर्भ में यह नैतिक रूप से निकृष्ट या दुष्ट होने का अर्थ देता है; ‘बुरा’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: πρᾶγμα
  choice: काम
  rationale: इस दुर्गुण-संदर्भ में ‘काम’ किसी कार्य या आचरण को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘वस्तु’ कहना कृत्रिम होता।
theological_decisions:
- issue: संदर्भ में ζῆλος का नैतिक भाव
  choice: नकारात्मक दुर्गुण के अर्थ में ‘ईर्ष्या’
  alternative: तटस्थ या सकारात्मक अर्थ में ‘उत्साह’; अथवा ‘जलन’
  rationale: तत्काल संदर्भ (3:14-15) कड़वी ईर्ष्या और स्वार्थी महत्त्वाकांक्षा को सांसारिक, अस्वाभाविक और दुष्ट बुद्धि के चिह्न बताता है। इसलिए सकारात्मक अर्थ प्रसंग के विपरीत होगा, जबकि ‘जलन’ एक संभव नकारात्मक विकल्प है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की ‘जहाँ… वहाँ…’ संरचना और व्याख्यात्मक संबंध सुरक्षित हैं। यूनानी वाक्य में निहित क्रिया को स्वाभाविक हिन्दी के लिए ‘होती है/होता है’ के रूप में स्पष्ट किया गया है।
