id: JAS.4.3
reference: James 4:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: hi
  text: तुम माँगते हो और पाते नहीं, क्योंकि तुम गलत ढंग से माँगते हो[a], ताकि उसे अपने भोग-विलास पर खर्च कर सको[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गलत मंशा से माँगते हो।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपने सुखों में खर्च कर सको।” यहाँ प्रयुक्त शब्द आत्म-लिप्त इच्छाओं या भोगों का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε / αἰτεῖσθε
  choice: माँगते हो / माँगते हो
  rationale: दोनों रूपों के लिए ‘माँगना’ स्वाभाविक और सीधा है तथा यूनानी की पुनरावृत्ति को बनाए रखता है। मध्यवाच्य रूप को अनावश्यक रूप से ‘अपने लिए माँगते हो’ नहीं बनाया गया।
- source_word: οὐ λαμβάνετε
  choice: पाते नहीं
  rationale: माँगने और पाने का स्वाभाविक हिन्दी संबंध व्यक्त करता है; अर्थ ‘प्राप्त नहीं करते’ के समान है, पर सामान्य पाठक के लिए अधिक सहज है।
- source_word: διότι κακῶς
  choice: क्योंकि ... गलत ढंग से
  rationale: कारण-संबंध स्पष्ट रहता है और κακῶς के व्यापक नैतिक/गुणात्मक अर्थ को केवल ‘गलत उद्देश्यों से’ तक सीमित नहीं किया जाता।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: अपने सुख-विलास पर
  rationale: ἡδονή के सुख, भोग और आत्म-लिप्त इच्छा के संदर्भगत नकारात्मक भाव को सहज हिन्दी में व्यक्त करता है; ‘वासनाएँ’ संभावित विकल्प है, पर वह अर्थ को अधिक संकीर्ण कर सकता है।
- source_word: δαπανήσητε
  choice: खर्च कर दो
  rationale: क्रिया के मूल अर्थ ‘खर्च करना’ को बनाए रखता है; ‘उड़ा दो’ या ‘बरबाद कर दो’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: implicit object of δαπανήσητε
  choice: जो मिले उसे
  rationale: हिन्दी में ‘खर्च कर दो’ को स्वाभाविक बनाने के लिए निहित वस्तु को स्पष्ट किया गया है; यह माँगी और पाई जाने वाली वस्तु की ओर संकेत करता है, कोई नई वस्तु नहीं जोड़ता।
theological_decisions:
- issue: क्या माँगने का संबोधन परमेश्वर की ओर स्पष्ट किया जाए
  choice: 'कर्ता/संबोधन को निहित रखा गया: ‘तुम माँगते हो’'
  alternative: ‘तुम परमेश्वर से माँगते हो’
  rationale: संदर्भ प्रार्थना का संकेत देता है, पर इस पद के यूनानी पाठ में परमेश्वर स्पष्ट रूप से नहीं लिखा है।
- issue: क्या κακῶς को केवल गलत मंशा के रूप में व्यक्त किया जाए
  choice: ‘गलत ढंग से’
  alternative: ‘गलत मंशा से’
  rationale: κακῶς का अर्थ मंशा से व्यापक है; आगे का उद्देश्य-वाक्य उस गलत माँग की प्रकृति समझाता है।
- issue: ἡδοναῖς का नैतिक भाव
  choice: ‘सुख-विलास’
  alternative: ‘वासनाएँ’ या ‘भोग-वासनाएँ’
  rationale: पद आत्म-लिप्त भोग की आलोचना करता है, किंतु शब्द को केवल काम-वासना तक सीमित करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’ है। भाषा सरल किंतु गरिमापूर्ण रखी गई है। ‘फिर भी’ यूनानी καί के संदर्भगत विरोध को सहज हिन्दी में व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
