  verdict: revise
  source_fidelity: The draft accurately preserves the repeated ‘ask,’ the causal clause, the broad sense of κακῶς, and the purposive force of ἵνα. However, ‘फिर भी’ makes the simple connective καί explicitly concessive, and ‘ताकि ... खर्च कर दो’ can sound imperative-like after a purpose connector. The implicit object of δαπανήσητε may be represented by ‘उसे’ without specifying what is received.
  naturalness: The revision uses natural modern standard Hindi. ‘ताकि ... खर्च कर सको’ clearly conveys purpose, while ‘भोग-विलास’ retains the contextually negative but non-sexualized sense of ἡδοναί.
  terminology: ‘गलत ढंग से’ appropriately keeps κακῶς broader than motive alone. ‘भोग-विलास’ is suitable for ἡδοναῖς; the footnote preserves ‘सुखों में’ and the possible sense of self-indulgent desires.
  issues:
  - severity: low
    issue: ‘फिर भी’ is stronger than Greek καί.
    rationale: The source coordinates ‘you ask and do not receive’; it does not explicitly use a concessive particle. Plain ‘और’ is closer while still natural.
  - severity: medium
    issue: ‘ताकि ... खर्च कर दो’ is not the best Hindi rendering of the Greek purpose subjunctive.
    rationale: After ‘ताकि,’ ‘कर दो’ may be heard as an imperative. ‘खर्च कर सको’ naturally expresses the intended purpose of ἵνα ... δαπανήσητε.
