id: JAS.4.13
reference: James 4:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ λέγοντες· Σήμερον ⸀ἢ αὔριον ⸀πορευσόμεθα εἰς τήνδε τὴν πόλιν καὶ ⸀ποιήσομεν ἐκεῖ ⸀ἐνιαυτὸν καὶ ⸀ἐμπορευσόμεθα καὶ ⸀κερδήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: hi
  text: अब सुनो, तुम जो कहते हो, “आज या कल हम इस नगर में जाएँगे, वहाँ एक वर्ष बिताएँगे, व्यापार करेंगे और लाभ कमाएँगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: अब सुनो
  rationale: यह ध्यान आकर्षित करते हुए डाँट या चेतावनी आरम्भ करने वाला मुहावरा है। ‘अब सुनो’ आधुनिक हिन्दी में इसकी सीधी और गंभीर संबोधन-शक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἱ λέγοντες
  choice: तुम जो कहते हो
  rationale: संज्ञार्थक कृदन्त यहाँ संबोधन के रूप में प्रयुक्त है; इसलिए दूरस्थ ‘जो लोग कहते हैं’ के बजाय प्रत्यक्ष संबोधन रखा गया है।
- source_word: Σήμερον ἢ αὔριον
  choice: आज या कल
  rationale: ἢ विकल्पसूचक है, इसलिए ‘या’ निकट भविष्य के बारे में वक्ताओं की निश्चित योजना को ठीक रूप में दर्शाता है।
- source_word: πορευσόμεθα
  choice: हम ... जाएँगे
  rationale: πορεύομαι का सामान्य गतिसूचक अर्थ ‘जाना’ है; हिन्दी में यही सबसे स्वाभाविक और पर्याप्त रूप है।
- source_word: εἰς τήνδε τὴν πόλιν
  choice: इस नगर में
  rationale: τήνδε किसी निश्चित नगर की ओर संकेत करता है। गति के साथ हिन्दी में ‘नगर में जाएँगे’ स्वाभाविक है और यूनानी संकेतवाचक की विशिष्टता बनाए रखता है।
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: वहाँ एक वर्ष बिताएँगे
  rationale: समयवाचक कर्म के साथ ποιέω का अर्थ कोई अवधि बिताना है; शाब्दिक अस्वाभाविकता के बिना यह पूरा कालगत विवरण रखता है।
- source_word: ἐμπορευσόμεθα
  choice: व्यापार करेंगे
  rationale: क्रिया वाणिज्य या कारोबार करने को दर्शाती है; ‘व्यापार करेंगे’ स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी है।
- source_word: κερδήσομεν
  choice: लाभ कमाएँगे
  rationale: व्यापारिक प्रसंग में κερδαίνω आर्थिक लाभ पाने को सूचित करता है; ‘लाभ कमाना’ इसी अर्थ को सटीक रूप से व्यक्त करता है।
theological_decisions:
- issue: प्रेरितीय डाँट का प्रत्यक्ष संबोधन
  choice: ‘तुम जो कहते हो’ के द्वारा प्रत्यक्ष संबोधन
  alternative: ‘जो लोग कहते हैं’ जैसा अप्रत्यक्ष वर्णन
  rationale: वचन वक्ताओं को सीधे चुनौती देता है। प्रत्यक्ष संबोधन मूल की तीक्ष्णता बनाए रखता है, बिना आगे के पद में स्पष्ट किए गए उनके अहंकारी अनुमान को इस पद में समय से पहले व्याख्यायित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण और आम पाठक के लिए सुबोध रखी गई है। ‘नगर’ बाइबलीय गद्य में स्वाभाविक है, जबकि वाक्य-विन्यास समकालीन हिन्दी का है। मूल में जहाँ कोई आवश्यक पाठकीय अस्पष्टता नहीं है, वहाँ अनावश्यक पादटिप्पणी नहीं जोड़ी गई।
