  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: hi
  text: हे व्यभिचारिणियो![a] क्या तुम नहीं जानतीं कि संसार से मित्रता परमेश्वर के प्रति शत्रुता है?[b] इसलिए जो कोई संसार का मित्र होना चाहता है,[c] वह परमेश्वर का शत्रु बन जाता है।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से स्त्रीलिंग बहुवचन संबोधन, ‘व्यभिचारिणियो।’ यहाँ यह संभवतः आत्मिक विश्वासघात के लिए रूपक है, जैसा भविष्यद्वक्ताओं की वाचा-संबंधी भाषा में मिलता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘परमेश्वर के साथ वैर।’ संदर्भ में अर्थ परमेश्वर के प्रति शत्रुता है।
    reason: alternative_reading
  - marker: c
    text: यहाँ ‘संसार’ से आशय सृष्टि स्वयं नहीं, बल्कि परमेश्वर के विरोध में खड़ी मानवीय व्यवस्था और उसके मूल्य हैं।
    reason: cultural_note
  - marker: d
    text: या, ‘वह अपने आप को परमेश्वर का शत्रु बना लेता है।’
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: हे व्यभिचारिणियो!
  rationale: स्त्रीलिंग बहुवचन संबोधन की तीखी और ठोस उपमा को बनाए रखा गया है। संदर्भ में यह संभवतः आत्मिक या वाचा-संबंधी विश्वासघात को दर्शाता है, पर मुख्य पाठ में अर्थ को नरम नहीं किया गया।
- source_word: οὐκ οἴδατε
  choice: क्या तुम नहीं जानतीं
  rationale: नकारात्मक आलंकारिक प्रश्न का स्वाभाविक हिन्दी रूप; स्त्रीलिंग संबोधन के साथ व्याकरणिक सामंजस्य भी रखा गया है।
- source_word: φιλία
  choice: मित्रता रखना
  rationale: ‘मित्रता’ संज्ञा बाद के φίλος (‘मित्र’) से शब्दगत संबंध बनाए रखती है; ‘रखना’ हिन्दी में संबंध की प्रवृत्ति को स्वाभाविक बनाता है।
- source_word: κόσμου
  choice: संसार
  rationale: κόσμος का पारंपरिक और व्यापक हिन्दी समतुल्य। यहाँ आशय परमेश्वर-विरोधी मानवीय व्यवस्था और मूल्यों से है, पर यह व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
- source_word: ἔχθρα τοῦ θεοῦ
  choice: परमेश्वर से शत्रुता
  rationale: यूनानी संबंधकारक को जानबूझकर ऐसे हिन्दी रूप में रखा गया है जो ‘परमेश्वर के प्रति शत्रुता’ और ‘परमेश्वर के साथ वैर’ की निकटवर्ती अर्थ-छायाओं को अत्यधिक सीमित नहीं करता।
- source_word: ὃς ἐὰν οὖν
  choice: इसलिए जो कोई
  rationale: οὖν के निष्कर्षसूचक बल और अनिश्चित संबंधवाचक वाक्य के सामान्यीकरण—दोनों को व्यक्त करता है।
- source_word: βουληθῇ
  choice: होना चाहता है
  rationale: βούλομαι की इच्छापरक और संकल्पात्मक शक्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: संसार का मित्र होना
  rationale: मूल की संज्ञात्मक अभिव्यक्ति और φιλία के साथ शब्दगत संबंध सुरक्षित रखे गए हैं।
- source_word: ἐχθρὸς τοῦ θεοῦ
  choice: परमेश्वर का शत्रु
  rationale: मित्र और शत्रु का स्पष्ट संबंधात्मक विरोध सीधे रूप में सुरक्षित है।
- source_word: καθίσταται
  choice: अपने आप को ... बना लेता है
  rationale: स्थिति में आ जाने के साथ व्यक्ति की चुनी हुई निष्ठा और नैतिक उत्तरदायित्व को व्यक्त करता है; ‘बन जाता है’ भी व्याकरणतः संभव है।
theological_decisions:
- issue: μοιχαλίδες का रूपकात्मक बल
  choice: मुख्य पाठ में स्त्रीलिंग बहुवचन ‘व्यभिचारिणियो’ रखा गया है और आत्मिक विश्वासघात की संभावना पादटिप्पणी में बताई गई है।
  alternative: ‘विश्वासघाती लोगो’ या ‘व्यभिचारी लोगो’
  rationale: यह संबोधन संभवतः भविष्यद्वक्ताओं की वाचा-विषयक भाषा की प्रतिध्वनि है। फिर भी मूल के ठोस, तीखे और स्त्रीलिंग रूप को व्याख्यात्मक सामान्यीकरण से बदलना उचित नहीं।
- issue: κόσμος का आशय
  choice: मुख्य पाठ में केवल ‘संसार’ रखा गया है।
  alternative: ‘परमेश्वर-विरोधी संसार-व्यवस्था’
  rationale: यहाँ सृष्टि स्वयं नहीं, बल्कि परमेश्वर के विरोध में खड़ी मानवीय व्यवस्था और मूल्य अभिप्रेत हैं; इस व्याख्या को पादटिप्पणी में रखना मूल की संक्षिप्तता और व्यापकता सुरक्षित रखता है।
- issue: ἔχθρα τοῦ θεοῦ में संबंधकारक की दिशा
  choice: ‘परमेश्वर से शत्रुता’
  alternative: ‘परमेश्वर के प्रति शत्रुता’
  rationale: संदर्भ परमेश्वर-विरोधी निष्ठा को प्रमुख बनाता है, पर यूनानी रचना संबंध या दिशा की अर्थ-छाया में कुछ खुलापन रखती है। हिन्दी का ‘से’ उस तनाव को स्वाभाविक रूप से सुरक्षित रखता है।
- issue: καθίσταται में मानवीय कर्तृत्व
  choice: ‘अपने आप को ... बना लेता है’
  alternative: ‘... बन जाता है’
  rationale: संसार का मित्र होने की इच्छा के परिणामस्वरूप व्यक्ति स्वयं को परमेश्वर के शत्रु की स्थिति में रखता है। विकल्प अधिक तटस्थ है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। तीखे स्त्रीलिंग संबोधन को मूल के अनुसार बनाए रखते हुए आगे स्त्रीलिंग क्रिया-रूप प्रयुक्त हुआ है; सामान्य कथन ‘जो कोई’ पर पुरुषलिंग एकवचन हिन्दी का प्रचलित अनिर्दिष्ट रूप है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
