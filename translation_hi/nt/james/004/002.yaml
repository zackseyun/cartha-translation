source:
  edition: SBLGNT
  text: ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: hi
  text: तुम लालसा करते हो[a] और तुम्हारे पास नहीं है; तुम हत्या करते हो[b] और ईर्ष्या करते हो[c], और प्राप्त नहीं कर सकते; तुम लड़ते हो और युद्ध करते हो। तुम्हारे पास नहीं है, क्योंकि तुम माँगते नहीं[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम लालायित होते हो।” यूनानी शब्द प्रबल इच्छा व्यक्त कर सकता है, जो इस संदर्भ में अनुचित है।
    reason: lexical_alternative
  - marker: b
    text: या “तुम मार डालते हो।” यूनानी क्रिया प्रायः विशेष रूप से हत्या करने के अर्थ में आती है। कुछ व्याख्याकार इसे अलंकारिक कथन मानते हैं, पर अनुवाद में शब्द का प्रबल अर्थ रखा गया है।
    reason: lexical_alternative
  - marker: c
    text: या “तुम जलन रखते हो।”
    reason: lexical_alternative
  - marker: d
    text: संदर्भ से आशय परमेश्वर से माँगना है, यद्यपि इस पद के यूनानी पाठ में परमेश्वर का उल्लेख स्पष्ट रूप से नहीं है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: तुम लालसा करते हो
  rationale: क्रिया प्रबल इच्छा व्यक्त करती है और यहाँ संदर्भ उसे अनुचित ठहराता है। ‘लालसा’ इस नकारात्मक बल को रखती है, पर इसे केवल यौन वासना या दूसरे की संपत्ति के लोभ तक सीमित नहीं करती।
- source_word: οὐκ ἔχετε
  choice: तुम्हें मिलता नहीं / तुम्हारे पास ... नहीं है
  rationale: पहले प्रयोग में स्वाभाविक हिन्दी और इच्छित वस्तु न पाने का भाव रखने के लिए ‘तुम्हें मिलता नहीं’; अंतिम प्रयोग में ἔχω की सीधी स्वामित्व-संबंधी अभिव्यक्ति के लिए ‘तुम्हारे पास ... नहीं है’।
- source_word: φονεύετε
  choice: तुम हत्या करते हो
  rationale: φονεύω सामान्यतः केवल मारने के बजाय हत्या करने का प्रबल नैतिक अर्थ रखता है; मूल की कठोरता को नरम नहीं किया गया।
- source_word: ζηλοῦτε
  choice: तुम ईर्ष्या करते हो
  rationale: ζηλόω के सकारात्मक और नकारात्मक दोनों अर्थ हो सकते हैं, पर यहाँ वैरपूर्ण संदर्भ नकारात्मक ‘ईर्ष्या’ का समर्थन करता है।
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: जो चाहते हो उसे पा नहीं सकते
  rationale: यह संयोजन इच्छित लक्ष्य या वस्तु को प्राप्त न कर सकने को व्यक्त करता है। पूरक पद हिन्दी में स्पष्टता के लिए निहित इच्छा से लिया गया है, कोई नई विशिष्ट वस्तु नहीं जोड़ी गई।
- source_word: μάχεσθε καὶ πολεμεῖτε
  choice: तुम लड़ते-झगड़ते और युद्ध करते हो
  rationale: पहली क्रिया संघर्ष या झगड़े और दूसरी अधिक तीव्र युद्ध का बोध देती है; हिन्दी युग्म इस बढ़ती तीव्रता को बनाए रखता है।
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: इसलिए ... कि तुम माँगते नहीं
  rationale: διά के साथ articular infinitive कारण व्यक्त करता है। ‘माँगना’ αἰτέω का स्वाभाविक रूप है; किससे माँगना है, यह मूल की तरह निहित रखा गया है।
theological_decisions:
- issue: क्या φονεύετε को रूपक मानकर हल्का किया जाए
  choice: मुख्य पाठ में ‘तुम हत्या करते हो’ रखा गया
  alternative: तुम मारते हो; तुम मन में हत्या करते हो
  rationale: मूल क्रिया स्वयं कठोर है। इसे अलंकारिक, अतिशयोक्तिपूर्ण या रूपक मानना व्याख्या का विषय है; अनुवाद में उसकी शाब्दिक नैतिक गंभीरता सुरक्षित रहनी चाहिए।
- issue: क्या αἰτεῖσθαι के निहित कर्म के रूप में परमेश्वर को स्पष्ट जोड़ा जाए
  choice: ‘तुम माँगते नहीं’—कर्म निहित रखा गया
  alternative: तुम परमेश्वर से माँगते नहीं
  rationale: आसपास के संदर्भ, विशेषकर अगला पद, परमेश्वर को निहित श्रोता बताता है, पर इस पद के यूनानी पाठ में θεός नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सीधा, गरिमापूर्ण और मौखिक रूप से समझ आने वाला प्रयोग। अर्धविरामों से यूनानी उपवाक्यों की क्रमिक संरचना रखी गई है। ‘लड़ते-झगड़ते और युद्ध करते हो’ निकटवर्ती दोनों संघर्ष-क्रियाओं का अंतर बनाए रखता है।
