id: JAS.4.12
reference: James 4:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: hi
  text: व्यवस्था देनेवाला और न्याय करनेवाला एक ही है—वही, जो बचाने और नाश करने में समर्थ है। पर तू कौन है, जो अपने पड़ोसी का न्याय करता है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: व्यवस्था देनेवाला
  rationale: यह सामान्य ‘कानून बनानेवाला’ से अधिक स्वाभाविक रूप से परमेश्वर द्वारा दी गई व्यवस्था के संदर्भ को व्यक्त करता है, और मूल के कर्ता-संज्ञा रूप को बनाए रखता है।
- source_word: κριτής / ὁ κρίνων
  choice: न्याय करनेवाला / जो ... न्याय करता है
  rationale: 'एक ही यूनानी शब्द-परिवार की प्रतिध्वनि बनाए रखी गई है: परमेश्वर वैध न्याय करनेवाला है, जबकि मनुष्य पड़ोसी का न्याय करने का स्थान लेता है।'
- source_word: σῶσαι καὶ ἀπολέσαι
  choice: बचाने और नाश करने
  rationale: दोनों क्रियाओं के प्रबल विरोध और व्यापक अर्थ को बिना नरम किए सुरक्षित रखा गया है।
- source_word: πλησίον
  choice: पड़ोसी
  rationale: नए नियम में प्रचलित संबंधपरक अर्थ को व्यक्त करने वाला सीधा और परिचित हिंदी शब्द है।
- source_word: σὺ δὲ τίς εἶ, ὁ κρίνων
  choice: पर तू कौन है, जो ... न्याय करता है?
  rationale: मूल की सहभागी रचना और अंग्रेज़ी परामर्श-पाठ के ‘who are you, judging’ का भाव सुरक्षित रहता है; हिंदी में यह स्वाभाविक भी है।
theological_decisions:
- issue: ‘व्यवस्था देनेवाला और न्याय करनेवाला’ की एकता
  choice: दोनों भूमिकाओं को एक ही व्यक्ति से स्पष्ट रूप से जोड़ा गया
  alternative: ‘केवल एक व्यवस्था देनेवाला है और एक न्यायी है’
  rationale: εἷς और संयुक्त पदों का आशय एक ही सत्ता द्वारा दोनों भूमिकाएँ निभाना है; वैकल्पिक रूप दो अलग व्यक्तियों का भ्रम उत्पन्न कर सकता है।
- issue: मानवीय न्याय की निंदा का दायरा
  choice: पड़ोसी का न्याय करने वाले व्यक्ति को प्रश्न के रूप में चुनौती दी गई
  alternative: हर प्रकार के विवेक या मूल्यांकन पर पूर्ण प्रतिबंध
  rationale: पद स्वयं पड़ोसी पर न्यायाधीश का स्थान लेने को चुनौती देता है; इससे आगे बढ़कर सभी नैतिक विवेक को निषिद्ध कहना पाठ में आयात होगा।
translation_notes:
  register: आधुनिक मानक हिंदी, सम्मानपूर्ण किंतु सीधी शैली। मूल के σὺ की तीखी, एकवचन संबोधन-शक्ति को बनाए रखने के लिए ‘तू’ चुना गया है; यहाँ यह अपमानसूचक नहीं, बल्कि भविष्यवक्तापरक प्रत्यक्ष चुनौती है। कोई पादटिप्पणी आवश्यक नहीं।
