  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: hi
  text: इसलिए परमेश्वर के अधीन हो जाओ[a]। पर शैतान का विरोध करो, और वह तुमसे भाग जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आप को परमेश्वर के अधीन कर दो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτάγητε
  choice: अधीन हो जाओ
  rationale: यह आज्ञार्थक रूप इस प्रसंग में स्वेच्छा से परमेश्वर के अधिकार के अधीन होने का आह्वान करता है। यह हिंदी में स्वाभाविक है और कर्मवाच्य रूप की संभावित छाया भी बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्पष्ट रूप से जोड़ता है।
- source_word: τῷ θεῷ
  choice: परमेश्वर के
  rationale: ‘अधीन होना’ के साथ हिंदी में संबंधसूचक ‘के’ स्वाभाविक रूप से यूनानी संप्रदान कारक का अर्थ व्यक्त करता है।
- source_word: ἀντίστητε
  choice: विरोध करो
  rationale: यह किसी के विरुद्ध दृढ़ता से खड़े होने और उसका प्रतिरोध करने की आज्ञा व्यक्त करता है; ‘विरोध करो’ सामान्य आधुनिक हिंदी में स्पष्ट है।
- source_word: δὲ
  choice: पर
  rationale: यह परमेश्वर के अधीन होने और शैतान का विरोध करने के बीच हल्का विरोध अथवा नया विकास दिखाता है।
- source_word: τῷ διαβόλῳ
  choice: शैतान का
  rationale: यहाँ शब्द निश्चित व्यक्तिगत दुष्ट विरोधी के लिए प्रयुक्त है; हिंदी बाइबलीय भाषा में ‘शैतान’ सर्वाधिक परिचित और स्वाभाविक पद है।
- source_word: καὶ
  choice: और
  rationale: यह आज्ञा को उसके प्रतिज्ञात परिणाम से सीधे जोड़ता है।
- source_word: φεύξεται
  choice: वह ... भाग जाएगा
  rationale: भविष्यकाल प्रतिरोध के परिणाम को बताता है; हिंदी में स्पष्टता के लिए कर्ता ‘वह’ व्यक्त किया गया है।
- source_word: ἀφ’ ὑμῶν
  choice: तुम्हारे पास से
  rationale: यह उनसे दूर जाने की गति व्यक्त करता है और ‘भाग जाएगा’ के साथ स्वाभाविक हिंदी बनाता है।
theological_decisions:
- issue: διάβολος का अनुवाद
  choice: व्यक्तिगत अलौकिक विरोधी के रूप में ‘शैतान’
  alternative: ‘निंदक’ अथवा बुराई की कोई अवैयक्तिक शक्ति
  rationale: सवाचक पद और आत्मिक संघर्ष का प्रसंग एक व्यक्तिगत विरोधी की ओर संकेत करते हैं। फिर भी अनुवाद मूल पाठ से आगे उसके स्वरूप का अतिरिक्त विवरण नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सीधे आज्ञार्थक वाक्य। ‘अधीन हो जाओ’ सहज है, जबकि पादटिप्पणी यूनानी रूप में निहित आत्मसमर्पण की वैकल्पिक अभिव्यक्ति सुरक्षित रखती है।
