source:
  edition: SBLGNT
  text: ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε· ὁ γέλως ὑμῶν εἰς πένθος ⸀μετατραπήτω καὶ ἡ χαρὰ εἰς κατήφειαν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: hi
  text: दुःखी होओ, शोक मनाओ और रोओ। तुम्हारी हँसी शोक में और तुम्हारा आनन्द उदासी में बदल जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: दुःखी होओ
  rationale: यह आदेश दुःख और दयनीय दशा का तीखा बोध कराता है। ‘दुःखी होओ’ आधुनिक हिन्दी में स्वाभाविक है और आगे आने वाले ‘शोक मनाओ’ तथा ‘रोओ’ से अलग रहते हुए आदेश की कठोरता बनाए रखता है।
- source_word: πενθήσατε
  choice: शोक मनाओ
  rationale: यह क्रिया गहरे दुःख और मातम को व्यक्त करती है; प्रसंग में पश्चात्ताप से जुड़ी शोकपूर्ण प्रतिक्रिया का भार बनाए रखती है।
- source_word: κλαύσατε
  choice: रोओ
  rationale: यह आँसू बहाकर रोने का सीधा और स्वाभाविक हिन्दी रूप है तथा पिछले आदेश से भावात्मक प्रगति को सुरक्षित रखता है।
- source_word: ὁ γέλως ὑμῶν
  choice: तुम्हारी हँसी
  rationale: मूल के ठोस संज्ञात्मक रूप और स्पष्ट संबंधवाचक सर्वनाम को सहज हिन्दी में ज्यों का त्यों रखता है।
- source_word: εἰς πένθος
  choice: शोक में
  rationale: πένθος के मातम और गहरे दुःख के अर्थ को व्यक्त करता है तथा πενθήσατε के साथ मूल की शब्दार्थ-संगति बनाए रखता है।
- source_word: μετατραπήτω
  choice: बदल जाए
  rationale: यह तृतीय पुरुष निष्क्रिय आदेश के आशय को स्वाभाविक हिन्दी में व्यक्त करता है और अवस्था-परिवर्तन को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: ἡ χαρὰ
  choice: तुम्हारा आनन्द
  rationale: यद्यपि ὑμῶν पहले खंड में स्पष्ट है, समानांतर रचना में उसका प्रभाव दूसरे खंड तक स्वाभाविक रूप से पहुँचता है; हिन्दी में संबंधसूचक पद दोहराने से समानता स्पष्ट रहती है।
- source_word: εἰς κατήφειαν
  choice: उदासी में
  rationale: κατήφεια झुकी हुई, विषादपूर्ण मनःस्थिति को दर्शाता है। ‘उदासी’ सामान्य आधुनिक हिन्दी में समझने योग्य है और यहाँ हल्के मनोभाव के बजाय प्रसंगगत गंभीर विषाद व्यक्त करती है।
theological_decisions:
- issue: पश्चात्ताप की भाषा और भावात्मक तीव्रता
  choice: पद को दुःखभरे पश्चात्ताप के लिए कठोर आह्वान के रूप में रखा गया है और आदेशों को नरम नहीं किया गया।
  alternative: इसे केवल गंभीर या संयमित होने की हल्की सीख के रूप में प्रस्तुत करना।
  rationale: याकूब 4:6–10 के प्रसंग में ये आदेश परमेश्वर के सामने दीन होकर लौटने का आह्वान करते हैं। अनुवाद इस तीव्रता को सुरक्षित रखता है, पर पाठ में कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर और गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। तीनों आरंभिक आदेश अलग-अलग क्रियाओं में रखे गए हैं और अंतिम दो समानांतर खंडों की लय सुरक्षित है।
