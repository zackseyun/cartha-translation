reference: James 4:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἵτινες οὐκ ἐπίστασθε ⸀τὸ τῆς αὔριον ⸀ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ⸀ἐστε ⸀ἡ πρὸς ὀλίγον φαινομένη, ⸀ἔπειτα καὶ ἀφανιζομένη·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: hi
  text: तुम तो यह भी नहीं जानते कि कल क्या होगा। तुम्हारा जीवन है ही क्या? तुम तो भाप[a] हो, जो थोड़ी देर दिखाई देती है और फिर गायब हो जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, धुंध।
    reason: ἀτμίς भाप, वाष्प या हल्की धुंध जैसी क्षणिक दृश्य वस्तु को सूचित कर सकता है; ‘धुंध’ वैकल्पिक चित्र को सुरक्षित रखता है।
lexical_decisions:
- source_word: ἐπίστασθε
  choice: जानते
  rationale: यह क्रिया यहाँ भविष्य के विषय में मनुष्य की अनभिज्ञता व्यक्त करती है; आधुनिक हिन्दी में ‘जानते’ सीधा और स्वाभाविक है।
- source_word: τὸ τῆς αὔριον
  choice: कल क्या होगा
  rationale: यूनानी पदबंध संक्षिप्त और अर्थगर्भित है—शाब्दिक रूप से ‘कल की बात’। ‘कल क्या होगा’ भाव को स्पष्ट करता है, पर भविष्य की घटनाओं का अनावश्यक विस्तार नहीं करता।
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: तुम्हारा जीवन है ही क्या?
  rationale: ποία जीवन के स्वरूप या प्रकृति के विषय में आलंकारिक प्रश्न करता है। ‘है ही क्या?’ हिन्दी में उसकी संक्षिप्तता और प्रबल आलंकारिक प्रभाव बनाए रखता है।
- source_word: ἀτμὶς
  choice: भाप
  rationale: शब्द किसी क्षणिक वाष्प या धुंध को दर्शाता है। ‘भाप’ सामान्य हिन्दी में समझने योग्य है और थोड़ी देर दिखाई देकर लुप्त हो जाने की छवि से सहज मेल खाता है।
- source_word: πρὸς ὀλίγον
  choice: थोड़ी देर
  rationale: यह पदबंध अल्प अवधि बताता है; ‘थोड़ी देर’ वर्तमान हिन्दी में स्वाभाविक और सटीक है।
- source_word: φαινομένη
  choice: दिखाई देती है
  rationale: कृदंत दृश्य होने या प्रकट होने का भाव देता है; ‘दिखाई देती है’ भाप की छवि के साथ सहज है।
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: और फिर गायब हो जाती है
  rationale: यह क्रमशः अदृश्य हो जाने को व्यक्त करता है। चुना हुआ वाक्यांश क्रम और क्षणभंगुरता दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: मानव जीवन की क्षणभंगुरता का रूपक
  choice: जीवन को सीधे ‘भाप’ कहने वाली मूल रूपकात्मक भाषा बनाए रखी गई है।
  alternative: इसे व्याख्यात्मक रूप से ‘तुम्हारा जीवन क्षणभंगुर है’ कहना।
  rationale: संदर्भ भविष्य की योजनाओं पर मनुष्य के भरोसे को चुनौती देता है। मूल रूपक जीवन की संक्षिप्तता और अनिश्चितता दोनों व्यक्त करता है; इसे अमूर्त कथन में बदलना उसके साहित्यिक और धर्मवैचारिक तनाव को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, सामान्य और गरिमापूर्ण रखी गई है। ‘तुम’ बहुवचन श्रोताओं के लिए है और निकटवर्ती संबोधन की तीक्ष्णता बनाए रखता है। ‘है ही क्या?’ आलंकारिक प्रश्न का स्वाभाविक हिन्दी रूप है।
