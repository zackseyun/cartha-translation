revisions:
- from: परन्तु अब आप अपनी डींगभरी धारणाओं पर घमण्ड करते हैं। इस प्रकार का हर घमण्ड बुरा है।
  to: पर अब तुम अपनी डींगभरी बातों पर इतराते हो। ऐसी हर शेखी बुरी है।
  rationale: Revision replaces the misleading “डींगभरी धारणाओं” with “डींगभरी बातों,” which directly and naturally conveys arrogant pretensions or boastful claims while preserving the plural. It also uses idiomatic cognate wording—“इतराते हो” and “शेखी”—without adding the interpretive restriction “योजनाएँ.”
  reviewer_model: gpt-5.6-terra
