base_translation:
  language: en
  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: hi
  text: पर अब तुम अपनी डींगभरी बातों पर इतराते हो। ऐसी हर शेखी बुरी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: परन्तु अब
  rationale: यह पद 13–15 में बताई गई प्रभु पर निर्भर विनम्र दृष्टि के विपरीत उनकी वर्तमान दशा को सामने रखता है।
- source_word: καυχᾶσθε
  choice: आप ... घमण्ड करते हैं
  rationale: यह क्रिया अपने विषय में शेखी बघारने या गर्व करने का भाव रखती है और इसी पद के संज्ञा-रूप καύχησις से संबंध भी बनाए रखती है।
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: अपनी डींगभरी धारणाओं पर
  rationale: ἀλαζονεία अहंकारी आत्मविश्वास, दिखावटी दावे या डींगभरी मान्यताओं को व्यक्त करता है। 'धारणाओं' से पहले के पदों की आत्मविश्वासपूर्ण योजनाओं का संदर्भ झलकता है, पर इसे केवल व्यापारिक योजनाओं तक सीमित नहीं किया जाता; बहुवचन का भाव भी बना रहता है।
- source_word: πᾶσα καύχησις τοιαύτη
  choice: इस प्रकार का हर घमण्ड
  rationale: πᾶσα का वितरणात्मक भाव और τοιαύτη का 'इस प्रकार का' गुणात्मक संकेत स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: πονηρά
  choice: बुरा
  rationale: यहाँ शब्द नैतिक निन्दा व्यक्त करता है; 'बुरा' सरल और स्पष्ट हिन्दी में उसी नैतिक मूल्यांकन को देता है।
theological_decisions:
- issue: निन्दित घमण्ड का स्वरूप
  choice: प्रभु के प्रति अधीनता के बिना अपनी योजनाओं और धारणाओं पर किया गया डींगभरा आत्मविश्वास
  alternative: सभी प्रकार के आत्मविश्वास की सामान्य निन्दा; अथवा केवल व्यापारिक योजना की संकीर्ण निन्दा
  rationale: तात्कालिक संदर्भ मनुष्य की भविष्य-योजनाओं के बारे में है, जबकि पद का अंतिम वाक्य इसी प्रकार के घमण्ड पर व्यापक नैतिक निर्णय देता है। अनुवाद दोनों पहलुओं को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानसूचक बहुवचन 'आप' और सरल, गरिमापूर्ण शब्दावली। मूल यूनानी की अस्पष्टता को अनावश्यक रूप से 'योजनाएँ' कहकर सीमित करने के बजाय 'डींगभरी धारणाएँ' चुना गया है।
