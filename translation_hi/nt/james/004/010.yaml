  text: Humble yourselves before the Lord[b][a], and he will exalt you.
translation:
  language: hi
  text: प्रभु के सामने[a] अपने आप को नम्र करो, और वह तुम्हें ऊँचा उठाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
