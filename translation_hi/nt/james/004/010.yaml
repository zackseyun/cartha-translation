    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: अपने आपको दीन करो
  rationale: यह आज्ञार्थक रूप यहाँ आत्मवाचक भाव में स्वेच्छा से स्वयं को नम्र करने की पुकार देता है। ‘अपने आपको दीन करो’ इस सक्रिय आत्म-नम्रता को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: यह ‘के सामने’ या ‘की उपस्थिति में’ का भाव रखता है। ‘के सामने’ संक्षिप्त, स्वाभाविक और संबंधपरक अर्थ को सुरक्षित रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος के निश्चित संदर्भ को ‘प्रभु’ स्वाभाविक रूप से व्यक्त करता है और यह तय नहीं करता कि यहाँ विशेष रूप से परमेश्वर या प्रभु यीशु में से कौन अभिप्रेत है।
- source_word: ὑψώσει
  choice: ऊँचा उठाएगा
  rationale: यहाँ क्रिया नम्रता के बाद मिलने वाली प्रतिष्ठा या उन्नति का रूपक है। ‘ऊँचा उठाएगा’ हिन्दी में रूपक को स्पष्ट और सहज बनाए रखते हुए ‘महान बनाएगा’ जैसी अतिव्याख्या से बचता है।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: यह द्वितीय पुरुष बहुवचन कर्म है। आधुनिक मानक हिन्दी में ‘तुम्हें’ समुदाय को किए गए सीधे संबोधन के लिए स्वाभाविक है।
theological_decisions:
- issue: ‘प्रभु’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘प्रभु’ रखा गया है।
  alternative: ‘परमेश्वर’ या ‘प्रभु यीशु’
  rationale: इस निकट संदर्भ में यूनानी पाठ संदर्भ को इन दोनों में से किसी एक तक स्पष्ट रूप से सीमित नहीं करता। ‘प्रभु’ मूल की वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष आज्ञार्थक स्वर अपनाया गया है। ‘दीन करो’ नैतिक-आध्यात्मिक आत्म-नम्रता व्यक्त करता है, जबकि ‘ऊँचा उठाएगा’ स्रोत के रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है।
