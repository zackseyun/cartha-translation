source:
  edition: SBLGNT
  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: hi
  text: इसके बजाय[a] तुम्हें कहना चाहिए, “यदि प्रभु की इच्छा हो, तो हम जीवित रहेंगे और यह या वह काम भी करेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “तुम्हारे कहने के बदले।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: इसके बदले तुम्हें कहना चाहिए
  rationale: यह रचना शाब्दिक रूप से ‘तुम्हारे कहने के बदले’ है, पर प्रसंग में सुधारात्मक भाव निहित है। चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक ढंग से वही विरोध और कर्तव्य का भाव व्यक्त करता है।
- source_word: Ἐὰν
  choice: यदि
  rationale: यह θελήσῃ के साथ शर्त प्रस्तुत करता है; ‘यदि’ इसका सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: κύριος का सामान्य और गरिमापूर्ण हिन्दी रूप ‘प्रभु’ है। इससे मूल पाठ की संदर्भगत अस्पष्टता बनी रहती है कि विशेष रूप से किस दिव्य व्यक्ति का संकेत है।
- source_word: θελήσῃ
  choice: की इच्छा हो
  rationale: θέλω यहाँ इच्छा या संकल्प को व्यक्त करता है। हिन्दी में ‘प्रभु की इच्छा हो’ स्वाभाविक है और मनुष्य के जीवन तथा योजनाओं पर प्रभु की इच्छा की प्रधानता को सुरक्षित रखता है।
- source_word: καὶ ζήσομεν
  choice: तो हम जीवित रहेंगे
  rationale: भविष्यकालीन कथन दिखाता है कि निरंतर जीवित रहना भी प्रभु की इच्छा पर निर्भर है। शर्त के परिणाम को स्पष्ट और स्वाभाविक बनाने के लिए हिन्दी में ‘तो’ रखा गया है।
- source_word: καὶ ποιήσομεν
  choice: और … काम भी करेंगे
  rationale: ποιέω का व्यापक अर्थ ‘करना’ है। ‘काम करेंगे’ हिन्दी में स्पष्ट है, और ‘भी’ दूसरे καί के योगात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: यह या वह
  rationale: यह अनिश्चित रूप से विभिन्न नियोजित कामों की ओर संकेत करता है; ‘यह या वह’ हिन्दी में संक्षिप्त और मुहावरेदार है।
theological_decisions:
- issue: शर्त में ‘प्रभु’ का संदर्भ और भाव
  choice: मूल के अनुसार केवल ‘प्रभु’ रखा गया है और जीवन तथा कार्य दोनों को उसकी इच्छा पर निर्भर बताया गया है।
  alternative: ‘परमेश्वर’ या ‘प्रभु यीशु’ कहकर संदर्भ को स्पष्ट करना।
  rationale: यूनानी पाठ में केवल ὁ κύριος है। अनुवाद में किसी विशिष्ट दिव्य व्यक्ति को जोड़ना मूल की वास्तविक संदर्भगत अस्पष्टता को अनावश्यक रूप से सुलझा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘काम भी करेंगे’ दोनों भावी क्रियाओं को प्रभु की इच्छा के अधीन रखते हुए यूनानी के दूसरे καί का योगात्मक भाव बनाए रखता है।
