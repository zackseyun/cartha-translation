source:
  edition: SBLGNT
  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: hi
  text: 'लेकिन वह और अधिक अनुग्रह देता है। इसीलिए कहा गया है: “परमेश्वर घमंडियों का विरोध करता है, पर नम्र लोगों को अनुग्रह देता है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μείζονα
  choice: और भी अधिक
  rationale: तुलनात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और पिछले संदर्भ की अपेक्षा अनुग्रह की अधिकता बनाए रखता है।
- source_word: δίδωσιν χάριν
  choice: अनुग्रह देता है / अनुग्रह करता है
  rationale: पहली बार क्रिया-कर्तव्य का सीधा अर्थ रखा गया है; उद्धरण में स्वाभाविक हिन्दी मुहावरे के अनुसार ‘पर अनुग्रह करता है’ कहा गया है, जबकि χάριν का समान अर्थ बना रहता है।
- source_word: διὸ
  choice: इसलिए
  rationale: पूर्व कथन से निकलने वाले निष्कर्ष को संक्षेप और स्पष्ट रूप से दर्शाता है।
- source_word: λέγει
  choice: लिखा है
  rationale: यूनानी में कर्ता निहित है। हिन्दी का निर्वैयक्तिक उद्धरण-सूत्र ‘लिखा है’ पवित्रशास्त्रीय उद्धरण का संकेत देता है, बिना किसी स्पष्ट कर्ता को जोड़ने के।
- source_word: ὑπερηφάνοις
  choice: घमंडियों
  rationale: संज्ञा की तरह प्रयुक्त विशेषण के नैतिक अर्थ को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀντιτάσσεται
  choice: विरोध करता है
  rationale: सक्रिय रूप से विरुद्ध खड़े होने का भाव स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ταπεινοῖς
  choice: दीनों
  rationale: यह घमंडियों के विपरीत नम्र और अपने को न ऊँचा करने वालों को दर्शाता है; ‘दीनों’ संक्षिप्त, प्रतिष्ठित और उद्धरण के अनुरूप है।
- source_word: δὲ
  choice: पर
  rationale: दोनों स्थानों पर विरोधसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: λέγει में उद्धरण-सूत्र का निहित कर्ता
  choice: इसलिए लिखा है
  alternative: इसलिए वह कहता है / इसलिए पवित्रशास्त्र कहता है
  rationale: मूल यूनानी में ‘कहता है’ का कर्ता स्पष्ट नहीं है। निर्वैयक्तिक ‘लिखा है’ उद्धरण को पहचानने योग्य बनाता है, पर परमेश्वर या पवित्रशास्त्र को व्याकरणिक कर्ता के रूप में स्पष्टतः जोड़कर अस्पष्टता का अनावश्यक समाधान नहीं करता।
- issue: ταπεινοῖς का अर्थ-क्षेत्र
  choice: दीनों
  alternative: नम्र लोगों / दबे-कुचलों
  rationale: यह चयन घमंड के नैतिक विपरीत को व्यक्त करता है, फिर भी शब्द को केवल सामाजिक या आर्थिक स्थिति तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘लिखा है’ प्रचलित पवित्रशास्त्रीय उद्धरण-सूत्र है; पद की समानांतर और विरोधात्मक संरचना को बनाए रखा गया है।
