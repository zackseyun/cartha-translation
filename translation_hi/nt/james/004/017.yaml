  text: εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι, ἁμαρτία αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/017.yaml
  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: hi
  text: इसलिए जो भलाई करना जानता है, फिर भी नहीं करता, उसके लिए यह पाप है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδότι
  choice: जो ... जानता है
  rationale: दत्तिव एकवचन कृदंत यहाँ व्यक्ति-सूचक रूप में है। ‘जो ... जानता है’ इसके एकवचन और सामान्य, व्यक्ति-संबंधी अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले विचार से निकले निष्कर्ष को सूचित करता है; ‘इसलिए’ तार्किक संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καλὸν ποιεῖν
  choice: भलाई करना
  rationale: καλόν यहाँ नैतिक रूप से अच्छे या उचित काम को दर्शाता है। ‘भलाई करना’ व्यापक नैतिक अर्थ को संक्षेप और सहजता से व्यक्त करता है।
- source_word: μὴ ποιοῦντι
  choice: फिर भी नहीं करता
  rationale: यह जानते हुए भी कार्य न करने का विरोधाभास व्यक्त करता है। ‘फिर भी’ यूनानी में निहित वैचारिक विरोध को हिन्दी में स्वाभाविक बनाता है, बिना कोई विशिष्ट कर्म जोड़ने के।
- source_word: ἁμαρτία
  choice: पाप
  rationale: निर्देशक रहित विधेय संज्ञा उस चूक के पाप होने का गुणात्मक कथन करती है। हिन्दी में ‘पाप है’ इसी बल को स्वाभाविक रूप से रखता है।
- source_word: αὐτῷ
  choice: उसके लिए
  rationale: दत्तिव यहाँ उस व्यक्ति के संदर्भ में कथन को लागू करता है। ‘उसके लिए’ एकवचन व्यक्तिगत प्रयोग को बनाए रखता है।
- source_word: ἐστιν
  choice: यह ... है
  rationale: ‘यह’ पूर्वोक्त भलाई न करने की ओर संकेत करता है और हिन्दी में विधेय वाक्य को स्पष्ट बनाता है।
theological_decisions:
- issue: जानबूझकर भलाई न करने के विषय में कथन का दायरा
  choice: पद यह कहता है कि भलाई जानकर भी उसे न करना पाप है; भाषा को इतना व्यापक रखा गया है कि वह तत्काल प्रसंग और सामान्य नैतिक सिद्धांत दोनों से जुड़ सके।
  alternative: इसे केवल घमंडी योजनाएँ बनाने के तत्काल प्रसंग तक सीमित करना, या इसे किसी व्यवस्थित धर्मसिद्धान्त की तकनीकी श्रेणी के रूप में प्रस्तुत करना।
  rationale: तत्काल प्रसंग आत्मनिर्भर और घमंडी योजना का है, पर पद की भाषा सामान्य और नीतिवचन-सदृश है। अनुवाद इस व्यापकता और प्रसंगगत संबंध के बीच तनाव को हल किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में सहज। ‘भलाई करना’ सामान्य पाठक के लिए स्वाभाविक है और नैतिक अर्थ को किसी संप्रदायगत तकनीकी शब्दावली में सीमित नहीं करता।
