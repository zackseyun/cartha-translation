source:
  edition: SBLGNT
  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: hi
  text: भाइयो,[a] एक-दूसरे की बुराई मत करो। जो किसी भाई की बुराई करता है या अपने भाई का न्याय करता है, वह व्यवस्था की बुराई करता और व्यवस्था का न्याय करता है। यदि तुम व्यवस्था का न्याय करते हो, तो तुम व्यवस्था के पालनकर्ता नहीं, बल्कि न्यायाधीश हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ व्याकरणतः पुल्लिंग बहुवचन ‘भाइयो’ है; संदर्भ में यह संभवतः पूरी विश्वासी मंडली, अर्थात भाई-बहनों, को संबोधित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: के विरुद्ध बुरा कहना / के विरुद्ध बोलना
  rationale: यूनानी क्रिया किसी के विरुद्ध शत्रुतापूर्ण या बदनाम करनेवाली बात कहने का भाव रखती है। हिंदी में ‘के विरुद्ध बुरा कहना’ निषेध में स्वाभाविक है; आगे ‘के विरुद्ध बोलता’ उसी मूल शब्द की पुनरावृत्ति और व्यवस्था के साथ तर्क-संबंध बनाए रखता है।
- source_word: ἀλλήλων
  choice: एक-दूसरे
  rationale: यह पारस्परिक सर्वनाम का सहज और प्रचलित हिंदी रूप है।
- source_word: ἀδελφοί
  choice: भाइयो और बहनो
  rationale: यूनानी रूप व्याकरणतः पुल्लिंग बहुवचन है, पर इस सामुदायिक संबोधन में पूरी विश्वासी मंडली अभिप्रेत होने की संभावना है। आधुनिक हिंदी में समावेशी संबोधन अर्थ को स्पष्ट और स्वाभाविक बनाता है; स्रोत-रूप का विवरण पादटिप्पणी में रखा गया है।
- source_word: ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: किसी भाई / अपने भाई
  rationale: ‘भाई’ याकूब के पारिवारिक रूपक को बनाए रखता है और ‘सहविश्वासी’ जैसी व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: ἢ
  choice: या
  rationale: यह बोलने और न्याय करने को समानांतर क्रियाओं के रूप में प्रस्तुत करनेवाला सीधा विकल्पसूचक अनुवाद है।
- source_word: κρίνων / κρίνει / κρίνεις
  choice: न्याय करता / न्याय करते
  rationale: ‘न्याय करना’ व्यक्ति और व्यवस्था दोनों के संबंध में यूनानी शब्द की पुनरावृत्ति बनाए रखता है; ‘दोषी ठहराना’ अर्थ को अनावश्यक रूप से संकुचित करता।
- source_word: νόμου / νόμον
  choice: व्यवस्था
  rationale: हिंदी बाइबलीय प्रयोग में νόμος के लिए ‘व्यवस्था’ स्वाभाविक है। पद स्वयं इसे विशेष रूप से मूसा की व्यवस्था, राजकीय व्यवस्था या परमेश्वर की व्यवस्था कहकर सीमित नहीं करता।
- source_word: ποιητὴς νόμου
  choice: व्यवस्था पर चलनेवाले
  rationale: शाब्दिक ‘व्यवस्था का करनेवाला’ आधुनिक हिंदी में अस्वाभाविक है। ‘व्यवस्था पर चलनेवाला’ आज्ञापालन का अर्थ स्पष्ट करता और κριτής के साथ विरोध बनाए रखता है।
- source_word: κριτής
  choice: न्यायी
  rationale: संज्ञा-रूप ‘न्यायी’ ‘चलनेवाले’ के विपरीत भूमिका को स्पष्ट रखता है और उसी κρίνω शब्द-समूह से संबंध दिखाता है।
theological_decisions:
- issue: ἀδελφοί के संबोधन का दायरा
  choice: मुख्य पाठ में ‘भाइयो और बहनो’, साथ में स्रोत के पुल्लिंग रूप की पादटिप्पणी
  alternative: केवल ‘भाइयो’
  rationale: संदर्भ में संबोधन संभवतः पूरी मिश्रित विश्वासी मंडली से है। समावेशी हिंदी उस संभावित दायरे को सीधे संप्रेषित करती है, जबकि पादटिप्पणी व्याकरणिक रूप को पारदर्शी रखती है।
- issue: ‘व्यवस्था’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘व्यवस्था’
  alternative: ‘मूसा की व्यवस्था’, ‘राजकीय व्यवस्था’ या ‘परमेश्वर की व्यवस्था’
  rationale: याकूब के व्यापक संदर्भ में दिव्य नैतिक व्यवस्था, विशेषकर पड़ोसी-प्रेम, ध्यान में हो सकती है; फिर भी यह पद उस संदर्भ को स्पष्ट रूप से संकुचित नहीं करता।
- issue: व्यवस्था का ‘न्याय’ करने का कथन
  choice: रूपक और तर्कगत तनाव को यथावत रखना
  alternative: ‘व्यवस्था को गलत ठहराना’ या ‘अपने को व्यवस्था से ऊपर रखना’
  rationale: वैकल्पिक रूप कथन की व्याख्या करते हैं, जबकि यूनानी पाठ व्यक्ति का न्याय करने और व्यवस्था का न्याय करने के बीच जानबूझकर सीधा संबंध बनाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिंदी। ‘बुरा कहना’ καταλαλέω के निंदात्मक भाव को व्यक्त करता है; ‘व्यवस्था पर चलनेवाले’ शाब्दिक किंतु अस्वाभाविक ‘करनेवाले’ की अपेक्षा सहज हिंदी है। मुख्य पाठ का एकमात्र पादटिप्पणी-चिह्न [a] संबोधन के बाद रखा गया है।
