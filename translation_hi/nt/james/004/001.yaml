source:
  edition: SBLGNT
  text: Πόθεν πόλεμοι καὶ ⸀πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: hi
  text: तुम्हारे बीच युद्ध कहाँ से आते हैं, और लड़ाइयाँ कहाँ से? क्या वे यहीं से नहीं—तुम्हारे उन सुखों से, जो तुम्हारे अंगों में युद्ध करती रहती हैं?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संघर्ष और झगड़े।” यूनानी में शाब्दिक रूप से सैन्य शब्द “युद्ध” और “लड़ाइयाँ” हैं, जिन्हें यहाँ समुदाय के विवादों के लिए रूपक के रूप में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: पहले वाक्यांश का अनुवाद “तुम्हारे भीतर” भी हो सकता है। यूनानी पद पाठकों के आपसी संघर्ष या उनके भीतर के संघर्ष—दोनों का बोध दे सकता है। पूरा पद बाहरी कलह को भीतरी इच्छाओं से जोड़ता है।
    reason: alternative_reading
  - marker: c
    text: “अंगों” शाब्दिक अनुवाद है; इसका अर्थ शरीर के अंग या, अधिक व्यापक रूप से, व्यक्ति के भीतर की क्षमताएँ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  choice: कहाँ से आती हैं
  rationale: उत्पत्ति या स्रोत पूछने वाले दोहराए गए प्रश्नवाचक क्रियाविशेषण का स्वाभाविक हिन्दी रूप है।
- source_word: πόλεμοι
  choice: युद्ध
  rationale: मूल सैन्य रूपक को बनाए रखता है; प्रसंग में यह समुदाय के गंभीर संघर्षों के लिए रूपक हो सकता है।
- source_word: μάχαι
  choice: लड़ाइयाँ
  rationale: πόλεμοι से अलग, अपेक्षाकृत सीमित टकराव का बोध देता है और हिन्दी में सहज है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: प्रथम प्रयोग में समुदाय के सदस्यों के आपसी संघर्ष का अर्थ प्रसंगानुकूल है, जबकि भीतरी आयाम आगे खुलता है।
- source_word: οὐκ ἐντεῦθεν
  choice: क्या वे यहीं से नहीं
  rationale: सकारात्मक उत्तर की अपेक्षा रखने वाले आलंकारिक प्रश्न और आगे बताए जाने वाले स्रोत—दोनों को स्पष्ट करता है।
- source_word: ἡδονῶν
  choice: सुखों
  rationale: ἡδονή के आनंद अथवा आत्मतुष्टि से जुड़े मूल अर्थ को रखता है; ‘अभिलाषाएँ’ कहना अधिक व्याख्यात्मक होता।
- source_word: στρατευομένων
  choice: युद्ध करते हैं
  rationale: चलते हुए आंतरिक संघर्ष की सैन्य छवि को आरंभिक ‘युद्ध’ के साथ बनाए रखता है।
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: तुम्हारे अंगों में
  rationale: शारीरिक रूपक को सुरक्षित रखता है और यह खुला छोड़ता है कि संकेत शरीर के अंगों की ओर है या व्यक्ति की व्यापक क्षमताओं की ओर।
theological_decisions:
- issue: आरंभिक संघर्षों को केवल भीतरी आवेग मानना या सामुदायिक विवाद
  choice: पहले ἐν ὑμῖν को ‘तुम्हारे बीच’ और बाद के वाक्यांश को ‘तुम्हारे अंगों में’ रखा गया है।
  alternative: दोनों को आंतरिक अर्थ में ‘तुम्हारे भीतर’ करना; अथवा अंतिम वाक्यांश को व्याख्यात्मक रूप से ‘तुम्हारे भीतर’ करना।
  rationale: लेखक बाहरी सामुदायिक कलह को भीतर सक्रिय सुख-लालसाओं से जोड़ता है; अनुवाद सामाजिक और आंतरिक दोनों आयामों का तनाव बनाए रखता है।
