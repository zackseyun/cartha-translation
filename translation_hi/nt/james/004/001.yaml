  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘युद्ध’ और ‘अंगों’ जैसे शाब्दिक रूपकों को मुख्य पाठ में रखकर संभावित अर्थ फुटनोटों में दिए गए हैं।
