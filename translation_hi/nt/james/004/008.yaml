  text: ἐγγίσατε τῷ θεῷ, καὶ ⸀ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: hi
  text: परमेश्वर के निकट आओ, और वह तुम्हारे निकट आएगा। हे पापियो, अपने हाथ शुद्ध करो; और हे दो मन वाले लोगो[a], अपने हृदय पवित्र करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “दो आत्माओं वाले।” यह शब्द ऐसे व्यक्ति का वर्णन करता है जिसकी निष्ठा या भीतरी प्रतिबद्धता बँटी हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίσατε
  choice: निकट आओ
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा और स्वाभाविक अनुवाद; यह परमेश्वर के पास आने के संबंधपरक और आत्मिक भाव को बनाए रखता है।
- source_word: τῷ θεῷ
  choice: परमेश्वर के
  rationale: ἐγγίζω के साथ प्रयुक्त दत्तिव का स्वाभाविक हिन्दी रूप ‘परमेश्वर के निकट’ है।
- source_word: ἐγγιεῖ
  choice: वह तुम्हारे निकट आएगा
  rationale: भविष्यकाल को स्पष्ट रखता है और पहले खंड के ‘निकट आओ’ के साथ यूनानी समानांतरता को सुरक्षित रखता है।
- source_word: καθαρίσατε χεῖρας
  choice: अपने हाथ शुद्ध करो
  rationale: ‘हाथ’ की देहगत छवि और उसके नैतिक/शुद्धिकरण संबंधी संकेत दोनों बनाए गए हैं; ‘अपने’ हिन्दी में संबोधन को स्वाभाविक बनाता है।
- source_word: ἁμαρτωλοί
  choice: हे पापियो
  rationale: संबोधन बहुवचन की सीधी और तीखी चेतावनी को ‘हे’ के द्वारा स्पष्ट किया गया है।
- source_word: ἁγνίσατε καρδίας
  choice: अपने हृदय पवित्र करो
  rationale: καθαρίσατε से शब्दगत भेद बनाए रखने के लिए ‘पवित्र करो’ चुना गया है; ‘हृदय’ भीतरी व्यक्ति, अभिप्राय और निष्ठा की बाइबलीय छवि को बनाए रखता है।
- source_word: δίψυχοι
  choice: दो मन वाले लोगो
  rationale: यह विभाजित भीतरी निष्ठा को सामान्य आधुनिक हिन्दी में स्पष्ट करता है, जबकि यूनानी की अधिक शाब्दिक छवि पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: शुद्धिकरण की देहगत छवियों का नैतिक अर्थ
  choice: ‘हाथ’ और ‘हृदय’ की मूल छवियाँ बनाए रखना
  alternative: इन्हें ‘बाहरी काम’ और ‘भीतरी अभिप्राय’ के रूप में व्याख्यात्मक ढंग से कहना
  rationale: पद में नैतिक तथा शुद्धिकरण-संबंधी दोनों अनुगूँजें संभव हैं। मूल छवियाँ रखने से अनुवाद किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
- issue: δίψυχοι का सुलभ किन्तु स्रोत-संगत अनुवाद
  choice: मुख्य पाठ में ‘दो मन वाले लोगो’
  alternative: ‘दुचित्ते लोगो’ या अधिक शाब्दिक ‘दो प्राण वाले लोगो’
  rationale: ‘दो मन वाले’ विभाजित निष्ठा और भीतरी अस्थिरता को सहज हिन्दी में व्यक्त करता है; अधिक शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। समानांतर आज्ञाओं की तीक्ष्णता तथा ‘निकट’ की पुनरावृत्ति सुरक्षित है। प्रत्यक्ष संबोधनों में ‘हे’ प्रयोग कर वाक्य-संबंध स्पष्ट किया गया है।
