  edition: SBLGNT
  text: ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ ⸀κατῴκισεν ἐν ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: hi
  text: या क्या तुम समझते हो कि पवित्रशास्त्र व्यर्थ ही कहता है, “जिस आत्मा को उसने हमारे भीतर बसाया है, वह ईर्ष्यापूर्वक लालसा करती है”[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “जिस मानवीय आत्मा को उसने हमारे भीतर बसाया है, वह ईर्ष्या के साथ लालसा करती है।” यूनानी में “आत्मा” से पवित्र आत्मा या मनुष्य की आत्मा—दोनों में से कोई अभिप्रेत हो सकता है; और “ईर्ष्यापूर्वक” वाले शब्दों का अर्थ “ईर्ष्या के साथ” भी लिया जा सकता है।'
    reason: वैकल्पिक पाठार्थ और वास्तविक व्याकरणिक-धर्मवैचारिक अस्पष्टता
lexical_decisions:
- source_word: κενῶς
  choice: व्यर्थ
  rationale: यह λέγει को विशेषित करता है और निष्फल या निरर्थक ढंग से कहने का भाव देता है; ‘व्यर्थ’ स्वाभाविक तथा औपचारिक हिन्दी है।
- source_word: ἡ γραφὴ
  choice: पवित्रशास्त्र
  rationale: एकवचन और निश्चित पद के साथ यह अधिकारपूर्ण धर्मग्रंथ को सूचित करने वाला प्रचलित नए नियम का प्रयोग है।
- source_word: Πρὸς φθόνον
  choice: ईर्ष्यापूर्वक
  rationale: वाक्यांश को ἐπιποθεῖ के साथ क्रियाविशेषण रूप में रखा गया है। हिन्दी में ‘ईर्ष्या’ और ‘जलन’ दोनों नकारात्मक सुनाई दे सकते हैं; इसलिए कठिन नैतिक अर्थ को मुख्य पाठ में छिपाया नहीं गया और वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
- source_word: ἐπιποθεῖ
  choice: लालसा करता है
  rationale: क्रिया प्रबल इच्छा या उत्कट अभिलाषा व्यक्त करती है; यह चयन तीव्रता बचाता है और कृत्रिम भाषा से बचता है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: यूनानी में पवित्र आत्मा और मनुष्य की आत्मा के बीच व्याकरणिक अस्पष्टता है। हिन्दी में बिना ‘पवित्र’ जोड़े ‘आत्मा’ रखने से मुख्य पाठ स्वयं अस्पष्टता बनाए रखता है।
- source_word: κατῴκισεν
  choice: बसाया है
  rationale: यह κατοικίζω के सकर्मक/कारक भाव—किसी को वास कराना—को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν ἡμῖν
  choice: हमारे भीतर
  rationale: यह केवल समुदाय के बीच उपस्थित होने के बजाय अंतर्वास का स्वाभाविक भाव देता है।
theological_decisions:
- issue: τὸ πνεῦμα का अभिप्राय
  choice: मुख्य पाठ में ‘आत्मा’ रखकर अभिप्राय खुला छोड़ा गया है।
  alternative: ‘पवित्र आत्मा’ या ‘मनुष्य की आत्मा’।
  rationale: व्याकरण दोनों अर्थों की अनुमति देता है। हिन्दी में अनावश्यक बड़े अक्षर का सहारा उपलब्ध नहीं है, और ‘पवित्र’ जोड़ना मूल से अधिक स्पष्ट निर्णय कर देता; इसलिए वास्तविक धर्मवैचारिक तनाव पादटिप्पणी सहित सुरक्षित है।
- issue: φθόνος-सम्बन्धी वाक्यांश का नैतिक भाव
  choice: ‘ईर्ष्यापूर्वक’
  alternative: ‘जलन के साथ’ या ‘ईर्ष्या की ओर’।
  rationale: यूनानी वाक्यांश कठिन है और सामान्यतः नकारात्मक अर्थ भी दे सकता है। इसे स्वतः ‘धर्मसंगत जलन’ बनाकर तनाव मिटाने के बजाय निकट अर्थ रखा गया है और पादटिप्पणी में विकल्प बताया गया है।
- issue: क्या यह प्रत्यक्ष शास्त्रीय उद्धरण है
  choice: उद्धरण-चिह्न रखे गए हैं, पर किसी विशिष्ट पुराने नियम के पद की पहचान नहीं की गई।
  alternative: इसे शास्त्र के सामान्य कथन या सारांश के रूप में विरामित करना।
  rationale: वाक्य उद्धरण-सदृश है, पर पुराने नियम में इसका हूबहू स्रोत नहीं मिलता; अनिश्चित स्रोत की पहचान आरोपित नहीं की गई।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘पवित्रशास्त्र’, ‘आत्मा’ और ‘लालसा’ बाइबलीय प्रसंग के अनुरूप हैं; वाक्य की मूल कठिनता को अत्यधिक सहज बनाकर समाप्त नहीं किया गया है।
