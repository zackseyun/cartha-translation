source:
  edition: SBLGNT
  text: ἐκκαθάρατε τὴν παλαιὰν ζύμην, ἵνα ἦτε νέον φύραμα, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ⸀ἡμῶν ἐτύθη Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/007.yaml
  text: Clean out the old leaven[a], so that you may be a new batch, just as you are unleavened. For Messiah, our Passover lamb[b], has been sacrificed.
translation:
  language: hi
  text: पुराने खमीर को पूरी तरह निकाल दो, ताकि तुम नया गूँधा हुआ आटा बनो, ठीक वैसे ही जैसे तुम बेखमीर हो। क्योंकि मसीह[b], हमारा फसह का मेमना[a], बलि चढ़ाया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्योंकि हमारा फसह बलि चढ़ाया गया—मसीह।” यहाँ “फसह” से फसह का मेमना या फसह-बलिदान समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी Χριστός (ख्रिस्तोस), अर्थात “मसीह” या “अभिषिक्त जन।” यहाँ यह उपाधि के रूप में प्रयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκκαθάρατε
  choice: निकालकर पूरी तरह साफ़ कर दो
  rationale: यह बहुवचन आज्ञार्थक क्रिया किसी दूषित वस्तु को पूरी तरह दूर करने का आग्रह करती है। यह हिंदी अभिव्यक्ति क्रिया की तीव्रता और सामुदायिक आदेश—दोनों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: παλαιὰν ζύμην
  choice: पुराने खमीर
  rationale: ‘खमीर’ रोटी और फसह की छवि को बनाए रखता है तथा संदर्भ में पुराने भ्रष्टकारी प्रभाव के रूपक के लिए भी सहज है।
- source_word: ἵνα ἦτε νέον φύραμα
  choice: ताकि तुम नया गूँधा हुआ आटा बनो
  rationale: φύραμα गूँधे हुए आटे की लोई या पूरे गूँधे हुए आटे को दर्शाता है। ‘गूँधा हुआ आटा’ हिंदी पाठक के लिए स्पष्ट है और खमीर संबंधी रूपक को बनाए रखता है।
- source_word: καθώς ἐστε ἄζυμοι
  choice: ठीक वैसे ही जैसे तुम बेखमीर हो
  rationale: यह अनुवाद καθώς के तुलनात्मक अर्थ को बनाए रखता है और ‘बनने’ की आज्ञा तथा उनकी मौजूदा ‘बेखमीर’ पहचान के बीच के जानबूझकर रखे गए तनाव को नहीं मिटाता।
- source_word: τὸ πάσχα ἡμῶν
  choice: हमारा फसह का मेमना
  rationale: यूनानी में शाब्दिक रूप से ‘हमारा फसह’ है। बलि चढ़ाए जाने के संदर्भ में ‘मेमना’ निहित बलिदानी आशय को हिंदी में स्पष्ट करता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: ἐτύθη
  choice: बलि चढ़ाया जा चुका है
  rationale: θύω बलिदान के रूप में वध किए जाने को व्यक्त करता है। यह हिंदी रूप निष्क्रियता, बलिदानी अर्थ और घटित घटना की वर्तमान प्रासंगिकता को सहजता से संप्रेषित करता है।
- source_word: Χριστός
  choice: मसीह
  rationale: फसह के बलिदानी संदर्भ में Χριστός की उपाधिगत शक्ति प्रमुख है; ‘मसीह’ आधुनिक हिंदी में स्वाभाविक और अर्थपूर्ण धार्मिक उपाधि है।
theological_decisions:
- issue: मसीह के संबंध में πάσχα का अर्थ
  choice: हमारा फसह का मेमना
  alternative: हमारा फसह; हमारा फसह-बलिदान
  rationale: मूल यूनानी में ‘मेमना’ नहीं है, किंतु ἐτύθη और फसह के प्रसंग से बलिदानी पशु निहित है। मुख्य पाठ अर्थ को स्पष्ट करता है और पादटिप्पणी मूल की संक्षिप्तता तथा वैकल्पिक समझ को सुरक्षित रखती है।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ शब्द उपाधि के रूप में प्रयुक्त है और फसह के उद्धारकारी संदर्भ में उसका अभिषिक्त जन वाला अर्थ प्रमुख है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक संबोधन वाली रखी गई है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। रोटी, खमीर और फसह की परस्पर जुड़ी छवियाँ बनाए रखी गई हैं; साथ ही नैतिक आज्ञा और पहले से प्राप्त पहचान के बीच का तनाव सुरक्षित है।
