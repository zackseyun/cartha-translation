id: 1CO.5.10
reference: 1 Corinthians 5:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀οὐ πάντως τοῖς πόρνοις τοῦ κόσμου τούτου ἢ τοῖς πλεονέκταις ⸀καὶ ἅρπαξιν ἢ εἰδωλολάτραις, ἐπεὶ ⸀ὠφείλετε ἄρα ἐκ τοῦ κόσμου ἐξελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/010.yaml
  text: not at all meaning the sexually immoral of this world[a], or the greedy and swindlers, or idolaters[b], since then you would have to go out of the world.
translation:
  language: hi
  text: मेरा मतलब इस संसार के यौन-अनैतिक लोगों, या लोभियों और लुटेरों,[a] या मूर्तिपूजकों से बिल्कुल नहीं था;[b] क्योंकि तब तो तुम्हें संसार से ही बाहर निकलना पड़ता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “लुटेरों” के लिए “ठगों” या “जबरन वसूली करने वालों” का अनुवाद भी सम्भव है; यूनानी शब्द उन लोगों को सूचित कर सकता है जो बल या शोषण से दूसरों की वस्तु छीन लेते हैं।
    reason: lexical_alternative
  - marker: b
    text: पौलुस स्पष्ट कर रहा है कि उसका आशय यह नहीं था कि विश्वासी कलीसिया के बाहर के सभी अनैतिक लोगों से सम्पर्क तोड़ लें; 1 कुरिन्थियों 5:11 से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: οὐ πάντως
  choice: मेरा मतलब ... से बिल्कुल नहीं था
  rationale: संदर्भ में पौलुस अपने पहले निर्देश का आशय स्पष्ट कर रहा है। यह रूप हिन्दी में उस प्रबल निषेधात्मक स्पष्टीकरण को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πόρνοις
  choice: यौन-अनैतिक लोगों
  rationale: यह पद यौन अनैतिकता में लगे लोगों को सूचित करता है; चयन इसकी यौन-विशिष्टता बनाए रखते हुए आधुनिक पाठक के लिए स्पष्ट है।
- source_word: τοῦ κόσμου τούτου
  choice: इस संसार के
  rationale: यहाँ κόσμος कलीसिया के बाहर के मानवीय समाज की ओर संकेत करता है; 'इस संसार के' मूल अभिव्यक्ति के निकट और स्वाभाविक है।
- source_word: πλεονέκταις
  choice: लोभियों
  rationale: यह शब्द अधिक पाने की लालसा रखने वाले, प्रायः शोषणकारी व्यक्ति को दर्शाता है। 'लोभी' संक्षिप्त, प्रचलित और अर्थ-संगत है।
- source_word: ἅρπαξιν
  choice: लुटेरों
  rationale: ἅρπαξ दूसरों की वस्तु बलपूर्वक या शोषण से छीनने वाले व्यक्ति को सूचित कर सकता है। 'लुटेरे' इस छीनने वाले बल को स्पष्ट रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: εἰδωλολάτραις
  choice: मूर्तिपूजकों
  rationale: यह सटीक, संक्षिप्त और आधुनिक हिन्दी में सहज समझा जाने वाला मानक रूप है।
- source_word: ἐπεὶ
  choice: क्योंकि तब तो
  rationale: यह उस परिणाम को सामने लाता है जो पहले कथन को निरपेक्ष अर्थ में लेने पर निकलता; 'तब तो' हिन्दी में इस अनुमानात्मक बल को स्वाभाविक बनाता है।
- source_word: ὠφείλετε
  choice: तुम्हें ... पड़ता
  rationale: इस तर्कात्मक संदर्भ में अपूर्ण भूतकाल व्यावहारिक अनिवार्यता व्यक्त करता है। हिन्दी की 'पड़ता' संरचना संभावित अनिवार्यता को ठीक व्यक्त करती है।
- source_word: ἐκ τοῦ κόσμου ἐξελθεῖν
  choice: संसार से ही बाहर निकलना
  rationale: 'यह मूल की तीखी और कुछ अतिशयोक्तिपूर्ण छवि बनाए रखता है: ऐसे सभी लोगों से बचने के लिए संसार छोड़ना ही पड़ता।'
theological_decisions:
- issue: आसपास के संदर्भ में अलगाव की आज्ञा का दायरा
  choice: पौलुस स्पष्ट करता है कि उसके पहले निर्देश का अर्थ समाज में रहने वाले सभी यौन-अनैतिक अविश्वासियों से पूर्ण अलगाव नहीं था।
  alternative: पौलुस सभी अनैतिक लोगों से पूर्ण सामाजिक अलगाव की आज्ञा देता है।
  rationale: पद स्वयं पहले निर्देश के निरपेक्ष अर्थ को नकारता है, क्योंकि वैसा करना संसार से बाहर निकलने के समान होता। अनुवाद इस स्पष्टीकरण को बनाए रखता है और पाठ से अधिक पृथकतावादी निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य को पिछले पद के स्पष्टीकरण के रूप में स्वाभाविक बनाने के लिए 'मेरा मतलब ... नहीं था' अपनाया गया है। 'यौन-अनैतिक' मूल की विशिष्टता रखता है और 'संसार से ही बाहर निकलना' मूल की जानबूझकर तीखी छवि को बचाता है।
