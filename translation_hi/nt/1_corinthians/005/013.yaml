  text: But God judges those outside[c][b][a]. Remove the evil person from among yourselves.
translation:
  language: hi
  text: परन्तु बाहरवालों का न्याय परमेश्वर करता है। उस दुष्ट व्यक्ति को अपने बीच से निकाल दो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह शब्दावली व्यवस्थाविवरण में बार-बार आने वाली आज्ञा, “अपने बीच से दुष्ट को दूर कर देना,” की प्रतिध्वनि है। इसका अनुवाद यह भी हो सकता है: “उस दुष्ट जन को अपने बीच से दूर कर दो।”'
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ... ἔξω
  choice: बाहरवालों
  rationale: संज्ञा के रूप में प्रयुक्त पद कलीसियाई समुदाय से बाहर के लोगों को दर्शाता है; ‘बाहरवालों’ से यह संबंधपरक अर्थ सहज हिन्दी में बना रहता है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले पद में समुदाय के भीतर वालों के न्याय और बाहर वालों के न्याय के बीच हल्का विरोध प्रकट करता है।
- source_word: κρίνει
  choice: न्याय ... करता है
  rationale: यूनानी क्रिया वर्तमानकाल में है; हिन्दी का सामान्य वर्तमान कथन इस रूप और इसके सार्वकालिक भाव, दोनों को सुरक्षित रखता है।
- source_word: ἐξάρατε
  choice: निकाल दो
  rationale: भूतकालिक आज्ञार्थक रूप निर्णायक कार्रवाई की माँग करता है; ‘निकाल दो’ स्पष्ट है और बाद की संस्थागत शब्दावली नहीं जोड़ता।
- source_word: τὸν πονηρὸν
  choice: उस दुष्ट व्यक्ति को
  rationale: सप्रत्यय एकवचन विशेषण यहाँ संज्ञा के रूप में उस प्रसंगगत अपराधी को दर्शाता है; ‘व्यक्ति’ स्वाभाविक हिन्दी है और यूनानी व्याकरणिक पुल्लिंग को अनावश्यक रूप से जैविक लिंग नहीं बनाता।
- source_word: ἐξ ὑμῶν αὐτῶν
  choice: अपने बीच से
  rationale: यह समुदाय के भीतर से हटाने का मुहावरा है; ‘अपने बीच से’ संक्षिप्त, स्वाभाविक और सामुदायिक अर्थ में स्पष्ट है।
theological_decisions:
- issue: समुदाय के अनुशासन से संबंधित आज्ञा का स्वरूप
  choice: मण्डली को उस अपराधी व्यक्ति को अपने समुदाय से निकालना है, जबकि बाहरवालों का न्याय परमेश्वर करता है।
  alternative: इसे औपचारिक बहिष्कार बताए बिना, समुदाय में से बुराई या दुष्ट व्यक्ति को हटाने की अधिक सामान्य आज्ञा माना जा सकता है।
  rationale: 1 कुरिन्थियों 5 के प्रसंग में पौलुस भीतर और बाहर वालों के न्याय में भेद करते हुए एक विशिष्ट व्यक्ति के विषय में निर्णायक सामुदायिक कार्रवाई कहता है। अनुवाद इस अर्थ को व्यक्त करता है, पर मूल में न पाई जाने वाली बाद की कलीसियाई प्रक्रियात्मक शब्दावली नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सीधा विधान। ‘परन्तु’ से प्रसंगगत विरोध, ‘न्याय करता है’ से यूनानी वर्तमानकाल, और ‘निकाल दो’ से निर्णायक आज्ञा सुरक्षित रखी गई है।
