lexical_decisions:
- source_word: Ἔγραψα
  choice: मैंने ... लिखा था
  rationale: यूनानी एओरिस्ट को भूतकाल में स्वाभाविक रूप से व्यक्त किया गया है। ‘लिखा था’ निकट संदर्भ में पहले दिए गए निर्देश की ओर संकेत करता है, पर पत्र की पहचान तय नहीं करता।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: यह लेखन के अप्रत्यक्ष कर्म को दर्शाने वाला बहुवचन सर्वनाम है; आधुनिक हिंदी में मंडली को संबोधित करने के लिए ‘तुम्हें’ सहज है।
- source_word: ἐν τῇ ἐπιστολῇ
  choice: पत्र में
  rationale: यह निश्चित, ज्ञात पत्र का संकेत देता है। हिंदी में ‘पत्र में’ स्वाभाविक है और यह खुला रखता है कि आशय किसी पिछले पत्र से है या इसी पत्र से।
- source_word: μὴ συναναμίγνυσθαι
  choice: साथ मेल-जोल न रखो
  rationale: यह निषेधात्मक निर्देश सामाजिक संगति या घुलने-मिलने से बचने का भाव देता है। ‘मेल-जोल न रखो’ आधुनिक और स्पष्ट है।
- source_word: πόρνοις
  choice: यौन अनैतिकता में लिप्त लोगों
  rationale: बहुवचन संज्ञा उन व्यक्तियों को दर्शाती है जिनकी पहचान या आचरण यौन अनैतिकता से जुड़ा है। यह चयन किसी संकुचित पारंपरिक शब्द की अपेक्षा व्यापक मूल अर्थ बताता है।
theological_decisions:
- issue: ‘पत्र’ का संदर्भ
  choice: अनुवाद में केवल ‘पत्र’ रखा गया है, उसकी पहचान निश्चित नहीं की गई।
  alternative: इसे पौलुस का पहले लिखा और अब अनुपलब्ध पत्र मानना, या इसी 1 कुरिन्थियों पत्र के किसी पहले भाग का संदर्भ मानना।
  rationale: ἐν τῇ ἐπιστολῇ निश्चित पत्र की ओर संकेत करता है, किंतु अपने आप यह ऐतिहासिक प्रश्न नहीं सुलझाता; इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
