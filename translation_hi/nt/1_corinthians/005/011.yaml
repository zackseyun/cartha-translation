id: 1CO.5.11
reference: 1 Corinthians 5:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: νῦν δὲ ἔγραψα ὑμῖν μὴ συναναμίγνυσθαι ἐάν τις ἀδελφὸς ὀνομαζόμενος ᾖ πόρνος ἢ πλεονέκτης ἢ εἰδωλολάτρης ἢ λοίδορος ἢ μέθυσος ἢ ἅρπαξ, τῷ τοιούτῳ μηδὲ συνεσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/011.yaml
  text: But now I wrote to you not to associate with anyone who is called a brother if he is sexually immoral or greedy or an idolater or abusive or a drunkard or a swindler—not even to eat with such a person.
translation:
  language: hi
  text: पर अब मैंने तुम्हें लिखा है कि यदि कोई भाई कहलाता हो और यौन अनैतिकता करनेवाला, लोभी, मूर्तिपूजक, गाली देनेवाला, पियक्कड़ या ठग हो, तो उसके साथ मेल-जोल न रखो; ऐसे व्यक्ति के साथ खाना भी न खाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συναναμίγνυσθαι
  choice: मेल-जोल न रखो
  rationale: यह क्रिया निकट सामाजिक संगति या घुलने-मिलने से बचने का निर्देश देती है; सामान्य आधुनिक हिन्दी में यह स्वाभाविक और पर्याप्त व्यापक है।
- source_word: ἀδελφὸς ὀνομαζόμενος
  choice: जो भाई कहलाता हो
  rationale: मूल पाठ व्यक्ति के ‘भाई’ कहे जाने पर बल देता है और उसके वास्तविक आत्मिक दर्जे का निर्णय स्पष्ट रूप से नहीं करता; इसलिए अस्पष्टता सुरक्षित रखी गई है।
- source_word: πόρνος
  choice: व्यभिचारी
  rationale: यह यौन अनैतिकता में लगे व्यक्ति को सूचित करता है; ‘व्यभिचारी’ संक्षिप्त, प्रतिष्ठित और सामान्य बाइबलीय हिन्दी में बोधगम्य है।
- source_word: πλεονέκτης
  choice: लोभी
  rationale: यह अधिक पाने की लालसा रखनेवाले व्यक्ति के लिए सामान्य और सीधा हिन्दी समतुल्य है।
- source_word: λοίδορος
  choice: गाली देनेवाला
  rationale: शब्द अपमानजनक, निंदात्मक या कटु वाणी से दूसरों पर आक्रमण करनेवाले को दर्शाता है; यह पद सामान्य पाठक के लिए स्पष्ट है।
- source_word: μέθυσος
  choice: पियक्कड़
  rationale: यह आदतन मदहोश रहनेवाले व्यक्ति का स्वाभाविक आधुनिक हिन्दी वर्णन है, केवल कभी शराब पीनेवाले का नहीं।
- source_word: ἅρπαξ
  choice: लुटेरा
  rationale: यह लोभपूर्वक दूसरों की संपत्ति हड़पने या शोषण करनेवाले व्यक्ति को दर्शाता है; ‘लुटेरा’ शब्द की आक्रामकता को बनाए रखता है।
- source_word: συνεσθίειν
  choice: साथ खाना
  rationale: मूल में किसी के साथ भोजन करने का सीधा अर्थ है; अनिर्दिष्ट धार्मिक या सामाजिक सीमाओं को अनावश्यक रूप से नहीं जोड़ा गया।
theological_decisions:
- issue: ‘भाई कहलाता हो’ व्यक्ति की वास्तविक सदस्यता या विश्वास की स्थिति
  choice: जो भाई कहलाता हो
  alternative: जो अपने आपको भाई कहता हो / जो भाई है
  rationale: ὀνομαζόμενος निष्क्रिय रूप में ‘कहलाया जानेवाला’ है। अनुवाद न तो दावे को केवल आत्म-घोषणा बनाता है, न व्यक्ति को निर्विवाद रूप से सच्चा भाई घोषित करता है।
- issue: ‘साथ खाना’ का दायरा
  choice: ऐसे व्यक्ति के साथ खाना भी न खाना
  alternative: उसके साथ प्रभुभोज भी न करना / कोई भोजन न करना
  rationale: पद स्वयं भोजन के प्रकार को स्पष्ट नहीं करता। इसलिए अनुवाद मूल की व्यापकता और संभावित तनाव को बनाए रखता है तथा इसे केवल प्रभुभोज या हर संभव भोजन तक व्याख्यात्मक रूप से सीमित नहीं करता।
- issue: ἔγραψα का काल
  choice: मैंने तुम्हें लिखा है
  alternative: मैं तुम्हें लिख रहा हूँ
  rationale: यूनानी एओरिस्ट का औपचारिक कालगत रूप बनाए रखते हुए हिन्दी में वर्तमान पत्र-संदर्भ के लिए स्वाभाविक पूर्ण रूप चुना गया है; इसे वर्तमानकाल में बदलकर व्याख्या नहीं की गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सीधी और गरिमापूर्ण रखी गई है। सूची की कठोर नैतिक स्पष्टता बनाए रखते हुए अनावश्यक तकनीकी या सांप्रदायिक शब्दावली से बचा गया है।
