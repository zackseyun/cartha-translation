review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the conditional scope of ἐάν τις and the deliberately noncommittal designation ἀδελφὸς ὀνομαζόμενος (“one called a brother”). It also rightly renders συναναμίγνυσθαι as avoiding social association and συνεσθίειν as not eating with the person, without restricting the latter to the Lord’s Supper. However, “व्यभिचारी” normally denotes an adulterer in modern Hindi and is too narrow for πόρνος, while “लुटेरा” commonly suggests a robber and can over-specify ἅρπαξ, which here denotes a rapacious, defrauding, or exploitative person.
  naturalness: The revised conditional construction is more direct in Hindi than “जो भाई कहलाता हो, फिर भी ... हो,” since the Greek states a condition rather than a concessive contrast. “यौन अनैतिकता करनेवाला” and “ठग” are clear contemporary Hindi expressions in this context.
  terminology: “मूर्तिपूजक,” “लोभी,” “गाली देनेवाला,” and “पियक्कड़” are suitable. “भाई कहलाता हो” preserves the passive and its intended ambiguity. “ठग” better covers the economic exploitation implied by ἅρπαξ than “लुटेरा,” without imposing a specific legal mechanism.
  issues:
  - severity: medium
    issue: “व्यभिचारी” is narrower than πόρνος.
    rationale: In ordinary modern Hindi, “व्यभिचारी” primarily evokes adultery, whereas πόρνος is a broader designation for one engaged in sexual immorality.
  - severity: medium
    issue: “लुटेरा” over-specifies ἅρπαξ.
    rationale: The Greek term can refer to a grasping exploiter or swindler; Hindi “लुटेरा” most readily conveys a robber, often with an implication of forcible theft.
  - severity: low
    issue: “फिर भी” introduces an unwarranted concessive nuance.
    rationale: The source uses ἐάν (“if”), not a contrast equivalent to “yet/nevertheless.” A straightforward conditional preserves the syntax and sense.
  revised_text: पर अब मैंने तुम्हें लिखा है कि यदि कोई भाई कहलाता हो और यौन अनैतिकता करनेवाला, लोभी, मूर्तिपूजक, गाली देनेवाला, पियक्कड़ या ठग हो, तो उसके साथ मेल-जोल न रखो; ऐसे व्यक्ति के साथ खाना भी न खाना।
  revised_footnotes: []
  revision_rationale: The revision corrects two potentially misleading lexical restrictions and replaces the concessive phrasing with an explicit conditional. It otherwise preserves the draft’s register, the aorist-based “मैंने ... लिखा है” consistent with the English POB audit trail, the list structure, and the unrestricted reference to eating together.
