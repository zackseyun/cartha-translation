revisions:
- from: पर अब मैंने तुम्हें लिखा है कि ऐसे किसी व्यक्ति के साथ मेल-जोल न रखो जो भाई कहलाता हो, फिर भी व्यभिचारी, लोभी, मूर्तिपूजक, गाली देनेवाला, पियक्कड़ या लुटेरा हो—ऐसे व्यक्ति के साथ खाना भी न खाना।
  to: पर अब मैंने तुम्हें लिखा है कि यदि कोई भाई कहलाता हो और यौन अनैतिकता करनेवाला, लोभी, मूर्तिपूजक, गाली देनेवाला, पियक्कड़ या ठग हो, तो उसके साथ मेल-जोल न रखो; ऐसे व्यक्ति के साथ खाना भी न खाना।
  rationale: The revision corrects two potentially misleading lexical restrictions and replaces the concessive phrasing with an explicit conditional. It otherwise preserves the draft’s register, the aorist-based “मैंने ... लिखा है” consistent with the English POB audit trail, the list structure, and the unrestricted reference to eating together.
  reviewer_model: gpt-5.6-terra
