  text: Οὐ καλὸν τὸ καύχημα ὑμῶν. οὐκ οἴδατε ὅτι μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/006.yaml
  text: Your boasting is not good[a]. Do you not know that a little leaven leavens the whole batch of dough?
translation:
  language: hi
  text: तुम्हारा घमण्ड करना अच्छा नहीं है। क्या तुम नहीं जानते कि थोड़ा-सा खमीर पूरे गुँधे हुए आटे[a] को खमीरित कर देता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पूरी लोई।’
    reason: φύραμα के लिए संक्षिप्त शाब्दिक विकल्प।
lexical_decisions:
- source_word: καλὸν
  choice: अच्छा
  rationale: यहाँ καλός कुरिन्थियों के घमण्ड का नैतिक और व्यावहारिक मूल्यांकन करता है; ‘अच्छा’ सीधा, स्वाभाविक और प्रसंगानुकूल है।
- source_word: καύχημα
  choice: घमण्ड करना
  rationale: संज्ञा यहाँ घमण्ड करने की क्रिया या भाव को दर्शाती है। हिन्दी में क्रियात्मक रूप फटकार के स्वर को स्पष्ट और स्वाभाविक रखता है।
- source_word: οὐκ οἴδατε
  choice: क्या तुम नहीं जानते
  rationale: यह पौलुस की परिचित आलंकारिक प्रश्न-शैली को बनाए रखता है और यूनानी अभिव्यक्ति का सीधा अर्थ देता है।
- source_word: μικρὰ ζύμη
  choice: थोड़ा-सा खमीर
  rationale: यह प्राचीन रोटी बनाने के चित्र और कहावत-जैसी संक्षिप्तता को सुरक्षित रखता है।
- source_word: ὅλον τὸ φύραμα
  choice: पूरा गुँधा हुआ आटा
  rationale: φύραμα मिले या गुँधे हुए आटे की पूरी मात्रा को दर्शाता है; यह आधुनिक हिन्दी में ‘पूरी लोई’ की अपेक्षा अधिक तुरंत समझ आता है।
- source_word: ζυμοῖ
  choice: खमीर उठा देता है
  rationale: यह खमीर के पूरे आटे में प्रभावी होने की क्रिया को सहज हिन्दी में व्यक्त करता है और ζύμη के साथ शब्द-संबंध भी बनाए रखता है।
theological_decisions:
- issue: खमीर के रूपक का आशय
  choice: रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: ‘थोड़ा-सा पाप पूरी कलीसिया को बिगाड़ देता है’ जैसे अर्थ को सीधे पाठ में जोड़ना।
  rationale: पद स्वयं कहावत-सदृश रूपक प्रस्तुत करता है; उसका नैतिक और सामुदायिक अनुप्रयोग प्रसंग से उभरता है। अनुवाद में उसे स्पष्ट करके किसी एक व्याख्या तक सीमित करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सीधी फटकार की शैली। ‘गुँधा हुआ आटा’ सामान्य पाठक के लिए स्पष्ट है; ‘लोई’ को पाठ-टिप्पणी में रखा गया है।
