source:
  edition: SBLGNT
  text: καὶ ὑμεῖς πεφυσιωμένοι ἐστέ, καὶ οὐχὶ μᾶλλον ἐπενθήσατε, ἵνα ⸀ἀρθῇ ἐκ μέσου ὑμῶν ὁ τὸ ἔργον τοῦτο ⸀ποιήσας;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/002.yaml
  text: And you are puffed up[a], and should you not rather have mourned, so that the one who did this deed might be removed from among you?
translation:
  language: hi
  text: और तुम घमंड से फूले हुए हो! बल्कि क्या तुम्हें शोक नहीं मनाना चाहिए था, ताकि जिसने यह काम किया है, वह तुम्हारे बीच से हटा दिया जाए[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे बीच से उठा लिया जाए।” प्रसंग में इसका आशय संभवतः मंडली के अनुशासन द्वारा समुदाय से अलग किया जाना है।
    reason: ἀρθῇ का शाब्दिक अर्थ ‘उठा लिया जाए’ भी हो सकता है; टिप्पणी इस वैकल्पिक रूप को देते हुए प्रसंगगत अर्थ बताती है, पर उसे मुख्य पाठ में अंतिम रूप से निश्चित नहीं करती।
lexical_decisions:
- source_word: πεφυσιωμένοι
  choice: घमंड से फूले हुए
  rationale: यह पूर्णकालिक कर्मवाच्य कृदंत घमंड से फूले होने की बनी हुई दशा बताता है। यह अनुवाद पौलुस के रूपक को बनाए रखते हुए आधुनिक हिन्दी में उसका आशय स्पष्ट करता है।
- source_word: οὐχὶ μᾶλλον
  choice: क्या तुम्हें इसके बजाय ... नहीं
  rationale: यह डाँट भरा आलंकारिक प्रश्न है, जो उनकी वास्तविक मनोवृत्ति की तुलना उस प्रतिक्रिया से करता है जो उन्हें दिखानी चाहिए थी।
- source_word: ἐπενθήσατε
  choice: शोक नहीं मनाना चाहिए था
  rationale: यह सामान्य दुःख से अधिक प्रबल, संभवतः सामुदायिक और पश्चात्तापपूर्ण शोक व्यक्त करता है; अतीतकाल उस प्रतिक्रिया को दर्शाता है जो उन्हें करनी चाहिए थी।
- source_word: ἵνα ἀρθῇ
  choice: ताकि ... हटा दिया जाए
  rationale: ἵνα के साथ कर्मवाच्य संभावनार्थक क्रिया उद्देश्य या अपेक्षित परिणाम बताती है। 'हटा दिया जाए' αἴρω के व्यापक अर्थ को रखते हुए प्रसंग में स्वाभाविक है।
- source_word: ἐκ μέσου ὑμῶν
  choice: तुम्हारे बीच से
  rationale: यह समुदाय के मध्य से अलग किए जाने का स्वाभाविक हिन्दी मुहावरा है।
- source_word: ὁ τὸ ἔργον τοῦτο ποιήσας
  choice: जिसने यह काम किया है
  rationale: यह कर्ता की पहचान उसके कार्य से कराता है। हिन्दी में यह स्वाभाविक है और अपराध की प्रकृति को आवश्यकता से अधिक विशिष्ट नहीं बनाता।
theological_decisions:
- issue: अपराध करने वाले के प्रति अपेक्षित कार्रवाई का स्वरूप
  choice: तुम्हारे बीच से हटा दिया जाए
  alternative: परमेश्वर द्वारा उठा लिया जाए / मृत्यु के द्वारा दूर किया जाए
  rationale: ἀρθῇ कर्मवाच्य है और अपने आप में कर्ता को स्पष्ट नहीं करता। निकटवर्ती प्रसंग (पद 3–5, 13) सामुदायिक अनुशासन और मंडली से अलग किए जाने का समर्थन करता है, पर अनुवाद 'बहिष्कृत' जैसा अधिक विशिष्ट तकनीकी शब्द न चुनकर यूनानी की कुछ व्यापकता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'घमंड से फूले हुए' पौलुस का रूपक बचाता है; विस्मयादिबोधक चिह्न आरंभिक फटकार को और प्रश्नवाचक चिह्न आलंकारिक प्रश्न को स्पष्ट करता है। पाद-टिप्पणी चिह्न उसी पदांश के बाद रखा गया है जिससे वह संबंधित है।
