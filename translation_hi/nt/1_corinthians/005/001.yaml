source:
  edition: SBLGNT
  text: Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ⸀ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/001.yaml
  text: 'It is actually reported that there is sexual immorality among you, and sexual immorality of such a kind as is not even found among the Gentiles: a man has his father’s wife.'
translation:
  language: hi
  text: 'सचमुच यह सुनने में आ रहा है कि तुम्हारे बीच यौन अनैतिकता हो रही है—और ऐसी यौन अनैतिकता, जो गैर-यहूदियों[a] में भी नहीं पाई जाती: कोई व्यक्ति अपने पिता की पत्नी के साथ यौन संबंध रखता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अन्यजातियों में”; शाब्दिक रूप से “जातियों में।” कुछ अनुवादों में “मूर्तिपूजकों में” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने पिता की पत्नी को रखना।” यह यौन संबंध रखने का मुहावरेदार संकेत है। संभवतः वह उसकी सौतेली माँ थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅλως
  choice: सचमुच
  rationale: यहाँ शब्द मात्रा नहीं, बल्कि आश्चर्य और जोर व्यक्त करता है; ‘सचमुच’ पौलुस के स्तब्ध स्वर को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: ἀκούεται
  choice: यह सुनने में आ रहा है
  rationale: कर्मवाच्य रूप समुदाय के विषय में फैलती हुई सूचना या रिपोर्ट को दर्शाता है; यह हिन्दी में स्वाभाविक है और ‘सुनाई देता है’ से अधिक स्पष्ट है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: यह कुरिन्थ की विश्वासी बिरादरी के भीतर इस स्थिति के होने को व्यक्त करता है।
- source_word: πορνεία
  choice: यौन अनैतिकता
  rationale: यह अवैध या अनैतिक यौन आचरण के व्यापक अर्थ को व्यक्त करता है और किसी एक प्रकार तक सीमित नहीं करता।
- source_word: τοιαύτη πορνεία
  choice: ऐसी यौन अनैतिकता
  rationale: ‘ऐसी’ मूल के गुणात्मक और विस्मयकारी जोर को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὐδὲ ἐν τοῖς ἔθνεσιν
  choice: जो गैर-यहूदियों में भी नहीं पाई जाती
  rationale: ἔθνη यहाँ यहूदी और गैर-यहूदी भेद में प्रयुक्त है; ‘गैर-यहूदी’ आधुनिक पाठकों के लिए स्पष्ट है। ‘पाई जाती’ यूनानी में निहित दीर्घवृत्त को हिन्दी में पूरा करती है।
- source_word: ὥστε
  choice: ':'
  rationale: यहाँ अगला वाक्य उस अनैतिकता का स्वरूप स्पष्ट करता है; हिन्दी में द्विबिंदु इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: γυναῖκά τινα τοῦ πατρὸς
  choice: अपने पिता की पत्नी
  rationale: यह मूल अभिव्यक्ति को निकटता से रखता है और मुख्य पाठ में ‘सौतेली माँ’ जैसी संभावित परंतु अनिश्चित व्याख्या नहीं जोड़ता।
- source_word: ἔχειν
  choice: रखे हुए है
  rationale: इस प्रसंग में ἔχω किसी स्त्री को यौन साथी या पत्नी के रूप में रखने का मुहावरा है। ‘रखे हुए है’ मूल की संक्षिप्तता और संबंध की निरंतरता को बनाए रखता है, जबकि पादटिप्पणी अर्थ स्पष्ट करती है।
theological_decisions:
- issue: ἔθνεσιν को जातियों, अन्यजातियों, गैर-यहूदियों या मूर्तिपूजकों के रूप में प्रस्तुत करना
  choice: गैर-यहूदियों
  alternative: अन्यजातियों; राष्ट्रों में; मूर्तिपूजकों में
  rationale: मूल शब्द यहाँ मुख्यतः यहूदी समुदाय से बाहर के लोगों का वर्णन करता है। ‘गैर-यहूदी’ भेद को स्पष्ट रखता है और ‘मूर्तिपूजक’ जैसा अतिरिक्त मूल्यांकन नहीं जोड़ता।
- issue: स्त्री को मुख्य पाठ में ‘सौतेली माँ’ कहना या ‘पिता की पत्नी’
  choice: अपने पिता की पत्नी
  alternative: अपनी सौतेली माँ
  rationale: ‘सौतेली माँ’ संभावित पहचान है, लेकिन यूनानी में विशिष्ट रिश्तेदारी-संज्ञा नहीं है। ‘पिता की पत्नी’ स्रोत की सीमा और संभावित अस्पष्टता बनाए रखता है।
- issue: ἔχειν का अर्थ केवल अधिकार, विवाह, सहवास या यौन संबंध के रूप में स्पष्ट करना
  choice: रखे हुए है
  alternative: उसके साथ यौन संबंध रखता है; उसके साथ रह रहा है; उससे विवाह किए हुए है
  rationale: मूल मुहावरा संबंध की प्रकृति का संकेत देता है, पर विवाह या एक ही घर में रहने की बात स्पष्ट नहीं करता। इसलिए मुख्य पाठ संक्षिप्त रखा गया है और पादटिप्पणी यौन संबंध का आशय बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर और स्पष्ट शैली रखी गई है। ‘तुम्हारे’ बहुवचन समुदाय को संबोधित करता है। ‘यौन अनैतिकता’ व्यापक नैतिक पद है; ‘पिता की पत्नी’ स्रोत की अनिश्चितता बचाता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में क्रम से दिए गए हैं।
