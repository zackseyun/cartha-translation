source:
  edition: SBLGNT
  text: ἐν τῷ ὀνόματι τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ, συναχθέντων ὑμῶν καὶ τοῦ ἐμοῦ πνεύματος σὺν τῇ δυνάμει τοῦ κυρίου ἡμῶν ⸁Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/004.yaml
  text: In the name of our Lord Jesus[a], when you are assembled, and my spirit is with you, with the power of our Lord Jesus,
translation:
  language: hi
  text: हमारे प्रभु यीशु के नाम में, तुम्हारे इकट्ठे होने पर और मेरी आत्मा के भी तुम्हारे साथ उपस्थित होने पर, हमारे प्रभु यीशु की सामर्थ्य के साथ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ ὀνόματι
  choice: के नाम में
  rationale: यह प्रचलित बाइबलीय मुहावरा यूनानी रूप को बनाए रखते हुए यीशु के अधिकार के अधीन कार्य करने का भाव व्यक्त करता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: यह κύριος के पदवीगत और मसीह-संबंधी महत्व को स्वाभाविक, प्रतिष्ठित हिन्दी में सुरक्षित रखता है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: व्यक्तिनाम का मानक हिन्दी लिप्यंतरण।
- source_word: συναχθέντων ὑμῶν
  choice: जब तुम इकट्ठे हो
  rationale: अओरिस्ट कर्मवाच्य कृदन्त वाले genitive absolute को समयसूचक उपवाक्य के रूप में प्रस्तुत किया गया है; यह सभा के प्रसंग में सहज हिन्दी है।
- source_word: τοῦ ἐμοῦ πνεύματος
  choice: मेरी आत्मा तुम्हारे साथ हो
  rationale: यूनानी की संक्षिप्त संरचना में निहित उपस्थिति को स्पष्ट करता है, पर पौलुस की गैर-शारीरिक सहभागिता का स्वरूप निर्धारित नहीं करता।
- source_word: σὺν
  choice: के साथ
  rationale: सहभागिता अथवा साथ होने का सीधा और स्वाभाविक अनुवाद।
- source_word: δυνάμει
  choice: सामर्थ्य
  rationale: यह केवल औपचारिक अधिकार नहीं, बल्कि अनुशासनात्मक कार्य में प्रभावी शक्ति का भाव रखता है।
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: हमारे प्रभु यीशु की
  rationale: संबंधकारक को बनाए रखकर सामर्थ्य के स्रोत अथवा स्वामित्व की सूक्ष्मता को खुला रखा गया है।
theological_decisions:
- issue: सभा में पौलुस की उपस्थिति का स्वरूप
  choice: “मेरी आत्मा तुम्हारे साथ हो” के द्वारा वास्तविक पर गैर-शारीरिक सहभागिता व्यक्त की गई है।
  alternative: इसे केवल पौलुस की मनोवृत्ति या किसी अधिक विशिष्ट रहस्यात्मक उपस्थिति के रूप में समझना।
  rationale: मूल पाठ पौलुस की गैर-शारीरिक सहभागिता कहता है, पर उसकी तात्त्विक प्रक्रिया नहीं समझाता; अनुवाद इसी तनाव को सुरक्षित रखता है।
- issue: “नाम में” और “सामर्थ्य के साथ” का वाक्यगत संबंध
  choice: दोनों वाक्यांशों को उसी संक्षिप्त और कुछ हद तक बहुअर्थी क्रम में रखा गया है।
  alternative: “नाम में” को केवल इकट्ठे होने से या “सामर्थ्य” को केवल आगामी कार्रवाई से स्पष्ट रूप से जोड़ देना।
  rationale: यह पद अगले पद के साथ एक विस्तृत वाक्य-संरचना का भाग है; मूल यूनानी संबंधों को पूर्णतः स्पष्ट नहीं करता, इसलिए अनुवाद उन्हें कृत्रिम रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में औपचारिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। “तुम” बहुवचन मंडली को संबोधित करता है। पद मूल वाक्य की तरह अल्पविराम पर समाप्त होता है, क्योंकि विचार अगले पद में पूरा होता है।
