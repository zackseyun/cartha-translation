lexical_decisions:
- source_word: τί γάρ μοι
  choice: क्योंकि ... मेरा क्या लेना-देना?
  rationale: यह स्वाभाविक हिन्दी मुहावरा यूनानी पदबंध के आशय—यह मेरी जिम्मेदारी या सरोकार कैसे है—और γάρ के व्याख्यात्मक संबंध, दोनों को बनाए रखता है।
- source_word: τοὺς ἔξω
  choice: बाहरवालों
  rationale: यह कलीसियाई समुदाय से बाहर के लोगों को सूचित करता है और τοὺς ἔσω के साथ स्पष्ट विरोध बनाता है।
- source_word: κρίνειν / κρίνετε
  choice: न्याय करने / न्याय नहीं करते
  rationale: ‘न्याय करना’ अनुशासनात्मक निर्णय सहित κρίνω की व्यापकता को बनाए रखता है। वर्तमान निर्देशात्मक रूप जोड़ने के बजाय यूनानी संकेतार्थक क्रिया की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- source_word: οὐχὶ
  choice: क्या ... नहीं
  rationale: यह ऐसे आलंकारिक प्रश्न को व्यक्त करता है जिसका अपेक्षित उत्तर सकारात्मक है।
- source_word: τοὺς ἔσω
  choice: भीतरवालों
  rationale: यह समुदाय के भीतर के लोगों को दर्शाता है और ‘बाहरवालों’ के समांतर संक्षिप्त विरोध प्रस्तुत करता है।
- source_word: ὑμεῖς
  choice: तुम
  rationale: सर्वनाम को स्पष्ट रखकर पौलुस द्वारा कुरिन्थ की मंडली पर दिए गए बल को व्यक्त किया गया है।
theological_decisions:
- issue: क्या ὑμεῖς κρίνετε वर्णन है या दायित्वसूचक कथन
  choice: ‘क्या तुम ... न्याय नहीं करते?’—संकेतार्थक आलंकारिक प्रश्न
  alternative: ‘क्या तुम्हें ... न्याय नहीं करना है?’
  rationale: यूनानी वर्तमान संकेतार्थक रूप प्रत्यक्षतः ‘तुम न्याय करते हो’ कहता है, यद्यपि संदर्भ में दायित्व का भाव संभव है। मुख्य पाठ रूपगत अस्पष्टता और आलंकारिक बल को बनाए रखता है।
- issue: ‘बाहर’ और ‘भीतर’ का दायरा
  choice: मुख्य पाठ में केवल स्थान-सामुदायिक रूपक रखा गया; पादटिप्पणी में ‘भीतर’ को कलीसिया के समुदाय से स्पष्ट किया गया
  alternative: मुख्य पाठ में सीधे ‘कलीसिया के बाहर/भीतर के लोग’
  rationale: संदर्भ कलीसियाई अनुशासन का है, पर मूल पाठ संक्षिप्त ‘बाहरवालों/भीतरवालों’ कहता है। इसलिए अर्थ स्पष्ट करते हुए मूल की अभिव्यक्ति मुख्य पाठ में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘बाहरवालों/भीतरवालों’ से यूनानी समानांतरता बनी रहती है; ‘मेरा क्या लेना-देना’ स्वाभाविक मुहावरा है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
