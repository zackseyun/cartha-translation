id: 1CO.5.5
reference: 1 Corinthians 5:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/005.yaml
  text: to hand such a man over to Satan for the destruction of the flesh[b][a], so that the spirit may be saved in the day of the Lord.
translation:
  language: hi
  text: ऐसे व्यक्ति को देह के विनाश के लिए[a] शैतान के हवाले कर दो, ताकि प्रभु[b] के दिन आत्मा का उद्धार हो सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देह की बरबादी के लिए।’ यह वाक्यांश कठोर शारीरिक दंड की ओर, अथवा लाक्षणिक रूप से उस व्यक्ति की पापमय या दैहिक प्रवृत्ति के नाश की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: कुछ पांडुलिपियों में केवल ‘प्रभु’ के स्थान पर ‘हमारे प्रभु यीशु’ या ‘प्रभु यीशु’ है।
    reason: textual_variant
lexical_decisions:
- source_word: παραδοῦναι
  choice: हवाले कर दो
  rationale: यह वर्तमान प्रसंग में सभा को निर्देशित कार्रवाई को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और किसी के अधिकार में सौंपने का बल बनाए रखता है।
- source_word: τὸν τοιοῦτον
  choice: ऐसे व्यक्ति को
  rationale: यह उस विशेष अपराधी की ओर संकेत करते हुए यूनानी अभिव्यक्ति का श्रेणीसूचक भाव बनाए रखता है; ‘व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: τῷ Σατανᾷ
  choice: शैतान के हवाले
  rationale: Σατανᾶς के लिए प्रचलित हिन्दी नाम ‘शैतान’ रखा गया है।
- source_word: εἰς ὄλεθρον τῆς σαρκός
  choice: देह के विनाश के लिए
  rationale: ‘विनाश’ ὄλεθρος की गंभीरता को व्यक्त करता है और ‘देह’ σάρξ की उस वास्तविक अस्पष्टता को सुरक्षित रखता है जिसमें शारीरिक दंड और पापमय दैहिक प्रवृत्ति—दोनों अर्थ संभावित हैं।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा अभिप्रेत परिणाम को सहज हिन्दी में व्यक्त करता है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: यूनानी पाठ में कोई स्पष्ट स्वत्ववाचक सर्वनाम नहीं है; इसलिए ‘उसकी आत्मा’ जोड़ने के बजाय मूल की संयमित अभिव्यक्ति रखी गई है।
- source_word: σωθῇ
  choice: उद्धार हो सके
  rationale: यह कर्मवाच्य संभावनार्थक रूप और उद्धार-संबंधी अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν τῇ ἡμέρᾳ τοῦ κυρίου
  choice: प्रभु के दिन
  rationale: यह प्रचलित युगांत-संबंधी हिन्दी अभिव्यक्ति है और आधार-पाठ के केवल κυρίου को बिना विस्तार के प्रस्तुत करती है।
theological_decisions:
- issue: ‘देह के विनाश’ का अर्थ
  choice: मुख्य पाठ में अस्पष्ट अभिव्यक्ति ‘देह के विनाश’ को बनाए रखा गया है।
  alternative: कठोर शारीरिक दंड या मृत्यु; अथवा व्यक्ति की पापमय/दैहिक प्रवृत्ति का नाश।
  rationale: यूनानी वाक्यांश किसी एक व्याख्या को निर्णायक रूप से अनिवार्य नहीं करता; इसलिए अनुवाद शारीरिक न्याय और पापमय अभिमुखता के नाश के बीच तनाव को खुला रखता है।
- issue: ‘आत्मा’ का संदर्भ
  choice: ‘आत्मा’ लिखा गया है, ‘उसकी आत्मा’ नहीं।
  alternative: ‘उसकी आत्मा’।
  rationale: प्रसंग अपराधी के अंतिम उद्धार की ओर संकेत करता है, पर यूनानी में स्वत्ववाचक सर्वनाम स्पष्ट रूप से उपस्थित नहीं है।
- issue: ‘प्रभु का दिन’ और पाठांतर
  choice: SBLGNT के अनुसार केवल ‘प्रभु’ रखा गया है।
  alternative: ‘हमारे प्रभु यीशु’ या ‘प्रभु यीशु’।
  rationale: कुछ पांडुलिपियों में विस्तृत पाठ है, किंतु दिए गए आधार-पाठ में केवल κυρίου है; मुख्य पाठ उसी का अनुसरण करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामुदायिक पाठ के योग्य रखी गई है। ‘देह’, ‘आत्मा’, ‘उद्धार’ और ‘प्रभु का दिन’ जैसे परिचित बाइबलीय पद मूल पाठ की धार्मिक गंभीरता और अर्थगत तनाव को सुरक्षित रखते हैं।
