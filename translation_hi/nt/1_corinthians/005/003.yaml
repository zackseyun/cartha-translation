id: 1CO.5.3
reference: 1 Corinthians 5:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν γάρ, ⸀ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι, ἤδη κέκρικα ὡς παρὼν τὸν οὕτως τοῦτο κατεργασάμενον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/003.yaml
  text: For I[a], though absent in body but present in spirit, have already judged, as though present[b], the one who has done this thing.
translation:
  language: hi
  text: क्योंकि मैं शरीर से तो अनुपस्थित हूँ, पर आत्मा से उपस्थित हूँ[b], और मानो उपस्थित होकर उस व्यक्ति के विषय में, जिसने ऐसा काम किया है, पहले ही निर्णय कर चुका हूँ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “निर्णय कर चुका हूँ” का अनुवाद “न्याय कर चुका हूँ” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “आत्मा से उपस्थित” से संभवतः पौलुस की अपनी आत्मा अभिप्रेत है, पवित्र आत्मा नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन से व्याख्यात्मक संबंध बनाए रखता है।
- source_word: ἀπὼν τῷ σώματι
  choice: शरीर से अनुपस्थित
  rationale: यह शारीरिक अनुपस्थिति को स्पष्ट करता है और मृत्यु अथवा शरीर से आध्यात्मिक पृथक्करण का अनावश्यक संकेत नहीं देता।
- source_word: παρὼν δὲ τῷ πνεύματι
  choice: पर आत्मा में उपस्थित
  rationale: यह σώματι और πνεύματι के संक्षिप्त विरोध को बनाए रखते हुए पौलुस की अपनी आत्मा का स्वाभाविक संकेत देता है, पर वाक्यांश की संभावित धार्मिक गहराई को बंद नहीं करता।
- source_word: ἤδη κέκρικα
  choice: पहले ही निर्णय कर चुका हूँ
  rationale: पूर्णकाल ऐसे निर्णय को दर्शाता है जो पहले लिया जा चुका है और अब भी प्रभावी है। हिंदी में यह 'न्याय कर चुका हूँ' की अपेक्षा अनुशासनात्मक संदर्भ में अधिक स्वाभाविक है।
- source_word: ὡς παρὼν
  choice: मानो उपस्थित होकर
  rationale: यह ὡς की तुलनात्मक शक्ति और पौलुस के इस दावे को सुरक्षित रखता है कि उसका निर्णय उसकी शारीरिक उपस्थिति के समान प्रभाव रखता है।
- source_word: τὸν ... κατεργασάμενον
  choice: उस व्यक्ति ... जिसने ... किया है
  rationale: कृदंत के संज्ञात्मक प्रयोग को स्वाभाविक हिंदी में व्यक्त करता है और अपराधी की पहचान से अधिक कुछ नहीं जोड़ता।
- source_word: οὕτως τοῦτο
  choice: ऐसा काम
  rationale: यह οὕτως और τοῦτο को एक स्वाभाविक हिंदी अभिव्यक्ति में समेटकर पहले वर्णित कर्म के असाधारण स्वरूप को बनाए रखता है।
theological_decisions:
- issue: '''आत्मा में उपस्थित'' का अर्थ'
  choice: मुख्य पाठ में पौलुस की शारीरिक अनुपस्थिति और आत्मिक उपस्थिति का विरोध ज्यों का त्यों रखा गया है।
  alternative: इसे पवित्र आत्मा की उपस्थिति अथवा किसी अधिक विशिष्ट रहस्यवादी उपस्थिति के रूप में स्पष्ट करना।
  rationale: अनुच्छेदरहित πνεύματι और σώματι के सीधे विरोध से पौलुस की अपनी आत्मा सर्वाधिक स्वाभाविक संदर्भ है, लेकिन अनुवाद किसी विशेष सिद्धांत को पाठ पर नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज वाक्य-विन्यास रखा गया है। 'शरीर से अनुपस्थित, पर आत्मा में उपस्थित' मूल के अलंकारिक विरोध को सुरक्षित रखता है।
