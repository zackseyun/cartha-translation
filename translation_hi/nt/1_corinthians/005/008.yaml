  terminology: ‘खमीर,’ ‘अख़मीरी रोटियाँ,’ ‘निष्कपटता,’ and ‘सत्य’ are suitable, dignified, and consistent with the source imagery. The supplied noun ‘रोटियों’ should be explicitly noted rather than presented without clarification.
