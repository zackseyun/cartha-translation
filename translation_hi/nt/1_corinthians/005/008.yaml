  - severity: low
    issue: ‘बैरभाव’ narrows κακία somewhat.
    rationale: κακία can include malice or morally corrupt intent more broadly. ‘दुर्भावना’ preserves the distinction from πονηρία (‘दुष्टता’) without limiting the sense to overt enmity.
