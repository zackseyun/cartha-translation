id: 1CO.5.8
reference: 1 Corinthians 5:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ’ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/005/008.yaml
  text: Therefore let us keep the feast[a], not with old leaven, nor with the leaven of malice and wickedness[b], but with the unleavened bread of sincerity and truth.
translation:
  language: hi
  text: इसलिए आओ, हम पर्व मनाएँ[a]—न पुराने खमीर से, न ही दुर्भावना और दुष्टता के खमीर से, बल्कि निष्कपटता और सत्य की अख़मीरी रोटियों[b] से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आओ, हम उत्सव मनाएँ” अथवा “आओ, हम पर्व का पालन करें।” यूनानी पाठ पिछली आयत से चली आ रही फसह-पर्व की छवि बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक अर्थ “निष्कपटता और सत्य की अख़मीरी [वस्तुओं] से” है; फसह-पर्व की छवि स्पष्ट करने के लिए “रोटियों” जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्वाभाविक और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: ἑορτάζωμεν
  choice: आओ, हम पर्व मनाएँ
  rationale: वर्तमान विधिलिंग के सामूहिक आह्वान को व्यक्त करते हुए पर्व, विशेषतः संदर्भगत फसह, की छवि बनाए रखता है।
- source_word: ζύμῃ παλαιᾷ
  choice: पुराने खमीर से
  rationale: खमीर आधुनिक हिंदी में सहज है और फसह से जुड़ी रूपकात्मक छवि को सुरक्षित रखता है।
- source_word: κακίας
  choice: बैरभाव
  rationale: यहाँ यह दुर्भावना अथवा दूसरों का बुरा चाहने की प्रवृत्ति को व्यक्त करता है और अगले व्यापक नैतिक शब्द से भेद बनाए रखता है।
- source_word: πονηρίας
  choice: दुष्टता
  rationale: नैतिक बुराई का व्यापक और सुबोध अर्थ देता है, जबकि κακία से शब्दार्थगत अंतर भी बना रहता है।
- source_word: ἀζύμοις
  choice: अख़मीरी रोटियों
  rationale: यूनानी में संज्ञा अध्याहृत है; फसह के संदर्भ में 'रोटियों' जोड़ने से छवि स्पष्ट होती है। बहुवचन रूप substantival neuter plural के अनुरूप है।
- source_word: εἰλικρινείας
  choice: निष्कपटता
  rationale: मिलावट-रहित सच्चे चरित्र और शुद्ध मंशा का भाव आधुनिक, dignified हिंदी में व्यक्त करता है।
- source_word: ἀληθείας
  choice: सत्य
  rationale: यूनानी शब्द का सीधा और स्वाभाविक अनुवाद है तथा निष्कपटता के साथ अर्थपूर्ण युग्म बनाता है।
theological_decisions:
- issue: पौलुस के आह्वान में फसह-पर्व की रूपकात्मक छवि
  choice: '''पर्व मनाएँ'' और ''अख़मीरी रोटियों'' द्वारा पर्व की छवि को स्पष्ट बनाए रखना'
  alternative: '''उत्सव मनाएँ'' अथवा ''निष्कपटता और सत्य की अख़मीरी वस्तुओं से'''
  rationale: पिछली आयत में मसीह को फसह का बलिदान कहा गया है; इसलिए नैतिक आह्वान को सामान्यीकृत करने के बजाय पर्व और अख़मीरी रोटी की निरंतर छवि सुरक्षित रखी गई है। 'रोटियों' स्रोत में अध्याहृत संज्ञा का संदर्भगत स्पष्टीकरण है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, सामूहिक और गरिमापूर्ण आह्वान। 'खमीर' तथा 'अख़मीरी रोटियाँ' सामान्य पाठक के लिए बोधगम्य रहते हुए मूल पर्व-संबंधी रूपक को बनाए रखते हैं।
