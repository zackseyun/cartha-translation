id: 1CO.13.1
reference: 1 Corinthians 13:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐὰν ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/001.yaml
  text: If I speak in the tongues of men and of angels[a], but do not have love[c][b], I have become sounding bronze or a clashing cymbal.
translation:
  language: hi
  text: यदि मैं मनुष्यों[b] और स्वर्गदूतों की भाषाएँ[a] बोलूँ, पर प्रेम न रखूँ, तो मैं गूँजता हुआ काँसा[c] या झनझनाती हुई झाँझ बन गया हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बोलियाँ।’ यूनानी शब्द का अर्थ ‘जीभें’ या ‘भाषाएँ’ हो सकता है; यहाँ यह कुरिन्थ में प्रेरित वाणी की चर्चा से भी जुड़ा है।
    reason: lexical_alternative
  - marker: b
    text: ‘मनुष्यों’ से आशय स्त्री-पुरुष सभी मानव प्राणियों से है, जिनकी तुलना यहाँ स्वर्गदूतों से की गई है।
    reason: lexical_clarification
  - marker: c
    text: या ‘गूँजती हुई धातु।’ यूनानी शब्द काँसे या ताँबे जैसी धातु को बताता है, किसी निश्चित वाद्य को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: यदि
  rationale: यह काल्पनिक शर्त को स्वाभाविक और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: ταῖς γλώσσαις
  choice: भाषाएँ
  rationale: γλῶσσα का अर्थ जीभ अथवा भाषा हो सकता है। यहाँ ‘भाषाएँ’ हिंदी में स्वाभाविक है और कुरिन्थ की प्रेरित वाणी संबंधी चर्चा से जुड़ी अर्थ-व्याप्ति को खुला रखता है।
- source_word: τῶν ἀνθρώπων
  choice: मनुष्यों
  rationale: यहाँ शब्द का आशय स्त्री-पुरुष सभी मानव प्राणियों से है, जिनका विरोध स्वर्गदूतों से किया गया है।
- source_word: λαλῶ
  choice: बोलूँ
  rationale: शर्तवाचक वाक्य में यूनानी वर्तमान संभावनार्थक रूप को हिंदी का स्वाभाविक संभावनार्थक रूप व्यक्त करता है।
- source_word: τῶν ἀγγέλων
  choice: स्वर्गदूतों
  rationale: मनुष्यों के साथ किया गया विरोध यहाँ सांसारिक संदेशवाहकों के बजाय स्वर्गीय प्राणियों की ओर संकेत करता है।
- source_word: ἀγάπην
  choice: प्रेम
  rationale: यह आधुनिक हिंदी में व्यापक, स्पष्ट और गरिमापूर्ण समतुल्य है।
- source_word: δὲ μὴ ἔχω
  choice: पर प्रेम न रखूँ
  rationale: ‘पर’ विरोध को और ‘न रखूँ’ प्रेम के अभाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: γέγονα
  choice: बन गया हूँ
  rationale: यह पूर्णकाल की परिणामस्वरूप वर्तमान दशा—‘मैं बन चुका हूँ और वैसा हूँ’—को बनाए रखता है।
- source_word: χαλκὸς ἠχῶν
  choice: गूँजता हुआ काँसा
  rationale: यूनानी में किसी निश्चित वाद्य का नाम नहीं, बल्कि आवाज़ करने वाली काँसे/ताँबे जैसी धातु का उल्लेख है; इसलिए अनावश्यक रूप से ‘घंटा’ या ‘घड़ियाल’ नहीं जोड़ा गया।
- source_word: κύμβαλον ἀλαλάζον
  choice: झनझनाती हुई झाँझ
  rationale: ‘झाँझ’ κύμβαλον का परिचित हिंदी नाम है और ‘झनझनाती हुई’ उसकी ऊँची, कर्कश ध्वनि को सजीव ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘मनुष्यों और स्वर्गदूतों की भाषाएँ’ का अभिप्राय
  choice: मानवीय और स्वर्गदूतीय भाषाओं के बीच अलंकारिक उत्कर्ष को सीधे रूप में रखा गया है।
  alternative: इसे वास्तविक स्वर्गीय भाषाओं का स्पष्ट दावा या केवल अतिशयोक्ति मानना।
  rationale: पद स्वयं यह निर्धारित नहीं करता कि स्वर्गदूतों की भाषाएँ वास्तविक भाषाओं का उल्लेख हैं या सर्वोच्च कल्पनीय वाणी की अलंकारिक अभिव्यक्ति; अनुवाद इस तनाव को खुला रखता है।
- issue: ἀνθρώπων का विस्तार
  choice: मनुष्यों
  alternative: पुरुषों
  rationale: यहाँ विरोध मानव जाति और स्वर्गदूतों के बीच है, न कि पुरुषों और स्त्रियों के बीच; ‘मनुष्यों’ स्रोत के आशय को ठीक व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सहज और गरिमापूर्ण रखी गई है। ‘झाँझ’ जैसे परिचित शब्द से श्रव्य चित्र स्पष्ट होता है, जबकि ‘गूँजता हुआ काँसा’ मूल की अनिश्चित धातु-छवि को किसी खास वाद्य में नहीं बदलता।
