source:
  edition: SBLGNT
  text: νυνὶ δὲ μένει πίστις, ἐλπίς, ἀγάπη· τὰ τρία ταῦτα, μείζων δὲ τούτων ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/013.yaml
  text: 'And now these three remain: faith[a], hope, and love[c][b]. But the greatest of these is love.'
translation:
  language: hi
  text: और अब विश्वास[a], आशा और प्रेम—ये तीनों बने रहते हैं[b]; पर इनमें सबसे बड़ा प्रेम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “विश्वास” का अर्थ यहाँ व्यापक रूप से “भरोसा” भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “बने रहते हैं” का अनुवाद “कायम रहते हैं” या “स्थिर रहते हैं” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: और अब
  rationale: νυνί वर्तमान अथवा निष्कर्षात्मक स्थिति को सूचित करता है, और δέ हल्का संबंध या विरोध व्यक्त कर सकता है। पिछले विचार से स्वाभाविक संबंध रखते हुए “और अब” दोनों तत्वों को सहज हिन्दी में व्यक्त करता है।
- source_word: μένει
  choice: बने रहते हैं
  rationale: μένω का अर्थ यहाँ जारी रहना या स्थिर बने रहना है। बहुवचन कर्ता के अनुसार हिन्दी में “बने रहते हैं” स्वाभाविक है और नाश हो जाने वाली बातों के साथ निहित विरोध को बनाए रखता है।
- source_word: πίστις
  choice: विश्वास
  rationale: इस पौलुसी त्रयी में πίστις के लिए “विश्वास” प्रचलित, स्पष्ट और प्रसंगानुकूल है; “भरोसा” संभव है, पर अर्थ को अपेक्षाकृत संकुचित कर सकता है।
- source_word: ἐλπίς
  choice: आशा
  rationale: पौलुस के प्रयोग और इस धर्मवैचारिक त्रयी में ἐλπίς का स्वाभाविक हिन्दी समानार्थक “आशा” है।
- source_word: ἀγάπη
  choice: प्रेम
  rationale: ἀγάπη के लिए आधुनिक, गरिमापूर्ण और व्यापक रूप से समझा जाने वाला शब्द “प्रेम” है।
- source_word: τὰ τρία ταῦτα
  choice: ये तीनों
  rationale: यह पदबंध अभी-अभी गिनाए गए तीन गुणों की ओर संकेत करता है। “ये तीनों” संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: μείζων δὲ τούτων
  choice: पर इनमें सबसे बड़ा
  rationale: रूप की दृष्टि से μείζων तुलनात्मक है, किंतु τούτων के साथ यह तीनों के समूह में प्रेम की सर्वोच्चता बताता है; हिन्दी में “इनमें सबसे बड़ा” उसी भाव को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: पौलुसी प्रसंग में πίστις का अनुवाद
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: “विश्वास, आशा और प्रेम” की स्थापित त्रयी में “विश्वास” सबसे उपयुक्त है। “विश्वासयोग्यता” इस प्रसंग में कम संभावित है, जबकि “भरोसा” संभावित अर्थ को पाठ-टिप्पणी में सुरक्षित रखता है।
- issue: μείζων की तुलनात्मक अथवा सर्वोत्तम अर्थ-छाया
  choice: इनमें सबसे बड़ा प्रेम है
  alternative: प्रेम इनसे बड़ा है
  rationale: यूनानी तुलनात्मक रूप समूह के भीतर सर्वोच्च स्थान व्यक्त करता है। हिन्दी का श्रेष्ठतासूचक रूप आशय को सहजता से बताता है, बिना प्रेम और अन्य दोनों के संबंध को अनावश्यक रूप से परिभाषित किए।
- issue: νυνὶ δὲ में संबंध और विरोध का संतुलन
  choice: और अब
  alternative: पर अब
  rationale: δέ हल्का विरोध अथवा विचार की अगली कड़ी दोनों हो सकता है। मुख्य पाठ में प्रवाहमय “और अब” रखा गया है और वैकल्पिक विरोधात्मक पाठ को टिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, स्मरणीय और गरिमापूर्ण वाक्य-विन्यास अपनाया गया है। त्रयी की पारंपरिक पहचान बनाए रखते हुए शब्दावली सामान्य पाठक के लिए सहज रखी गई है।
