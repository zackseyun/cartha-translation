id: 1CO.13.7
reference: 1 Corinthians 13:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πάντα στέγει, πάντα πιστεύει, πάντα ἐλπίζει, πάντα ὑπομένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/007.yaml
  text: It bears all things[a], believes all things, hopes all things[b], endures all things.
translation:
  language: hi
  text: वह सब कुछ सह लेता है[a], सब बातों पर विश्वास करता है[b], सब बातों की आशा रखता है, सब कुछ धीरज से सहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सब कुछ ढाँपता है’; στέγει में ढाँपने या सुरक्षित रखने के साथ-साथ सहने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सब बातों पर भरोसा करता है’; इसका अर्थ यह नहीं कि प्रेम भोला होकर हर बात मान लेता है, बल्कि यह कि उसका झुकाव भरोसा करने की ओर होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: सब कुछ / सब बातों
  rationale: हर क्रिया के साथ प्रयुक्त नपुंसकलिंग बहुवचन πάντα का अर्थ व्यापक है। स्वाभाविक हिन्दी के लिए क्रिया के अनुसार ‘सब कुछ’ और ‘सब बातों’ रखा गया है, जबकि चारों पदों में ‘सब’ की पुनरावृत्ति यूनानी अलंकार की व्यापकता बनाए रखती है।
- source_word: στέγει
  choice: सह लेता है
  rationale: στέγω में ‘ढाँपना/सुरक्षित रखना’ और विस्तारित अर्थ में ‘सहना’ दोनों सम्भव हैं। प्रेम के स्थिर गुणों की इस शृंखला में ‘सह लेता है’ स्वाभाविक है; ‘ढाँपता है’ की वास्तविक वैकल्पिक छाया पादटिप्पणी में रखी गई है।
- source_word: πιστεύει
  choice: विश्वास करता है
  rationale: πιστεύω का सीधा अर्थ ‘विश्वास करना’ या ‘भरोसा करना’ है। ‘विश्वास करता है’ संक्षिप्त समानांतर शैली और मूल शब्द की पारदर्शिता बनाए रखता है; यहाँ इसका आशय भोलेपन से हर दावा मान लेना नहीं है।
- source_word: ἐλπίζει
  choice: आशा रखता है
  rationale: वर्तमान काल प्रेम के चारित्रिक आचरण को व्यक्त करता है। ‘आशा रखता है’ आधुनिक हिन्दी में स्वाभाविक और मूल के संक्षिप्त अर्थ के निकट है।
- source_word: ὑπομένει
  choice: धीरज से सहता है
  rationale: ὑπομένω दबाव में टिके रहने, सहने और दृढ़ बने रहने का भाव देता है। ‘धीरज से सहता है’ पहले ‘सह लेता है’ से कुछ भेद रखते हुए इस स्थिर धैर्य को व्यक्त करता है।
theological_decisions:
- issue: प्रेम के साथ πάντα (‘सब’) की बार-बार पुनरावृत्ति का अर्थ
  choice: इसे प्रेम की सर्वांगीण दृढ़ता का अलंकारिक और चरित्र-वर्णनात्मक कथन मानते हुए हर खंड में ‘सब’ बनाए रखा गया है।
  alternative: इसे ऐसा निरपेक्ष कथन मानना कि प्रेम बिना विवेक के हर बात को सच मानता या हर वस्तु को स्वीकार करता है।
  rationale: निकटवर्ती संदर्भ ἀγάπη के चरित्र का काव्यात्मक वर्णन है। अनुवाद पौलुस की व्यापक भाषा को बनाए रखता है, पर मूल में निहित न होने वाला नैतिक अविवेक या भोलापन नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल और लयात्मक शैली रखी गई है। चार समानांतर खंडों में ‘सब’ की पुनरावृत्ति सुरक्षित है। ‘वह’ का संदर्भ पिछले पदों के ‘प्रेम’ से है; हिन्दी में प्रत्येक क्रिया के साथ ‘प्रेम’ दोहराने से बचकर मूल की संक्षिप्त काव्यात्मकता रखी गई है।
