source:
  edition: SBLGNT
  text: Ἡ ἀγάπη οὐδέποτε ⸀πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/008.yaml
  text: Love never fails[a]. But whether there are prophecies, they will be set aside; whether tongues, they will cease; whether knowledge[c][b], it will be set aside.
translation:
  language: hi
  text: प्रेम कभी विफल नहीं होता।[a] पर चाहे भविष्यवाणियाँ हों, वे निष्प्रभावी कर दी जाएँगी; चाहे भाषाएँ हों,[b] वे समाप्त हो जाएँगी; चाहे ज्ञान हो, वह निष्प्रभावी कर दिया जाएगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रेम कभी गिरता नहीं” अथवा “प्रेम का कभी अंत नहीं होता।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जीभें”; इस संदर्भ में अन्य भाषा बोलने के वरदान के लिए प्रयुक्त शब्द।
    reason: alternative_reading
  - marker: c
    text: “निष्प्रभावी कर दिया जाएगा” के लिए वही यूनानी क्रिया है जो भविष्यवाणियों के विषय में “निष्प्रभावी कर दी जाएँगी” के लिए आई है।
    reason: cross_reference
lexical_decisions:
- source_word: ἀγάπη
  choice: प्रेम
  rationale: आधुनिक हिन्दी में यह पौलुस के व्यापक अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: οὐδέποτε πίπτει
  choice: कभी विफल नहीं होता
  rationale: यह प्रेम के स्थायी और भरोसेमंद चरित्र को व्यक्त करता है, पर πίπτει को आगे आने वाली समाप्ति-सूचक क्रियाओं में मिला नहीं देता।
- source_word: προφητεῖαι
  choice: भविष्यवाणियाँ
  rationale: बहुवचन संज्ञा के मानक हिन्दी रूप को रखा गया है; यह भविष्यसूचक संदेशों या कथनों को समेट सकता है।
- source_word: καταργηθήσονται / καταργηθήσεται
  choice: निष्प्रभावी कर दी जाएँगी / निष्प्रभावी कर दिया जाएगा
  rationale: दोनों स्थानों पर एक ही यूनानी क्रिया का समान अर्थ रखा गया है। यह कार्य या प्रभाव के हट जाने को बताता है, अनिवार्य रूप से विनाश को नहीं।
- source_word: γλῶσσαι
  choice: अन्य भाषाएँ
  rationale: हिन्दी में अकेला ‘जीभें’ इस आत्मिक वरदान के संदर्भ में भ्रामक हो सकता है। ‘अन्य भाषाएँ’ अर्थ को सुबोध बनाता है, जबकि घटना की सटीक प्रकृति पर विवाद का निर्णय नहीं करता।
- source_word: παύσονται
  choice: समाप्त हो जाएँगी
  rationale: यह क्रिया के अकर्मक भाव को स्वाभाविक हिन्दी में रखता है और καταργέω से उसका भेद बनाए रखता है।
- source_word: γνῶσις
  choice: ज्ञान
  rationale: यह सामान्य पौलुसी प्रयोग और अगले पदों में आंशिक ज्ञान के संदर्भ के अनुरूप है।
theological_decisions:
- issue: πίπτει का अर्थ
  choice: प्रेम कभी विफल नहीं होता
  alternative: प्रेम कभी गिरता नहीं; प्रेम का कभी अंत नहीं होता
  rationale: ‘विफल नहीं होता’ प्रेम की स्थायी विश्वसनीयता व्यक्त करता है और इसे आगे की समाप्ति-सूचक क्रियाओं के बिल्कुल समान नहीं बनाता।
- issue: γλῶσσαι का संदर्भगत अर्थ
  choice: अन्य भाषाएँ
  alternative: अन्य भाषा बोलने का वरदान; भाषाएँ; जीभें
  rationale: यह 1 कुरिन्थियों 12–14 के आत्मिक वरदान वाले संदर्भ को स्पष्ट करता है, पर यह तय नहीं करता कि वे ज्ञात मानवीय भाषाएँ थीं या किसी अन्य प्रकार की वाणी।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। निष्क्रिय क्रियाओं को बनाए रखा गया है और γλῶσσαι की सटीक प्रकृति को निर्णायक रूप से परिभाषित नहीं किया गया।
