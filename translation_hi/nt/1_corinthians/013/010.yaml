  yaml_path: translation/nt/1_corinthians/013/010.yaml
  text: But when the perfect comes[b][a], the partial will be set aside.
translation:
  language: hi
  text: परन्तु जब पूर्णता[a] आएगी, तब जो आंशिक है, वह समाप्त कर दिया जाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परिपूर्णता” अथवा “परिपक्वता।” यूनानी पद का आशय विवादित है; यह वर्तमान आंशिक अवस्था के विपरीत पूर्णता, परिपक्वता, या अंतिम परिपूर्ण अवस्था को सूचित कर सकता है।
    reason: alternative_reading
  - marker: b
    text: या “निष्प्रभावी कर दिया जाएगा,” “मिट जाएगा,” अथवा “दूर कर दिया जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: जब
  rationale: यह भविष्य में प्रत्याशित घटना का समय बताता है; इस प्रसंग में ‘जब’ स्वाभाविक है और अनावश्यक पुनरावृत्तिपरक अर्थ से बचता है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले पदों में वर्णित आंशिक अवस्था के साथ हल्का विरोध दर्शाता है।
- source_word: ἔλθῃ
  choice: आएगी
  rationale: ὅταν के साथ एओरिस्ट सब्जंक्टिव भविष्य की घटना की ओर संकेत करता है; हिन्दी में ‘जब … आएगी’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ τέλειον
  choice: सिद्धता
  rationale: नपुंसकलिंग संज्ञीकृत विशेषण पूर्णता, परिपक्वता या सिद्ध अवस्था का व्यापक भाव रखता है। ‘सिद्धता’ उसके किसी एक विवादित संदर्भ को निश्चित किए बिना ‘जो अधूरा है’ के साथ स्पष्ट विरोध बनाती है।
- source_word: τὸ ἐκ μέρους
  choice: जो अधूरा है
  rationale: संज्ञा के रूप में प्रयुक्त पदबंध का अर्थ वह है जो केवल अंशतः है; यह हिन्दी में स्वाभाविक है और पूर्णता के विपरीत आंशिकता को व्यक्त करता है।
- source_word: καταργηθήσεται
  choice: समाप्त कर दिया जाएगा
  rationale: भविष्यत् कर्मवाच्य किसी वस्तु के निष्प्रभावी किए जाने या अंत तक पहुँचाए जाने को दर्शाता है; यह चयन विनाश का अनावश्यक अर्थ जोड़े बिना उसकी समाप्ति बताता है।
theological_decisions:
- issue: τὸ τέλειον का अभिप्राय
  choice: मुख्य पाठ में ‘सिद्धता’ रखा गया है और उसके सटीक संदर्भ को अनिर्धारित छोड़ा गया है।
  alternative: ‘पूर्णता’, ‘परिपक्वता’, या मसीह के आगमन और आमने-सामने के ज्ञान से जुड़ी अंतिम सिद्ध अवस्था।
  rationale: यूनानी पद इस वचन में अपने संदर्भ की स्पष्ट पहचान नहीं करता। इसलिए अनुवाद किसी विशिष्ट सिद्धान्त—जैसे परिपक्वता, अंतिम युग की पूर्णता, या पवित्रशास्त्र की पूर्ण संहिता—को पाठ में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘सिद्धता’ पारंपरिक धार्मिक गरिमा रखते हुए भी सामान्य पाठक के लिए बोधगम्य है; पादटिप्पणी वास्तविक अर्थगत और धर्मवैचारिक अस्पष्टता सुरक्षित रखती है।
