source:
  edition: SBLGNT
  text: ὅτε ἤμην νήπιος, ⸂ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος⸃· ⸀ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/011.yaml
  text: When I was a child[a], I spoke like a child, I thought like a child, I reasoned like a child. When I became a man, I put away the things of the child.
translation:
  language: hi
  text: जब मैं बालक था, तब बालक के समान बोलता था, बालक के समान सोचता था और बालक के समान तर्क करता था। जब मैं पुरुष हो गया, तब मैंने बालकपन की बातें[a] छोड़ दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बालक के ढंग।” यूनानी में शाब्दिक अर्थ “बालक की चीज़ें” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: νήπιος
  choice: बालक
  rationale: यह शब्द छोटे और अपरिपक्व बच्चे को दर्शाता है। ‘बालक’ आधुनिक हिन्दी में स्वाभाविक है और आगे आए ἀνήρ (‘पुरुष’) के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: ἐλάλουν
  choice: बोलता था
  rationale: λαλέω का सामान्य अर्थ बोलना है; यह चयन पद की लय और बालक की वाणी के भाव को सहज रूप से व्यक्त करता है।
- source_word: ἐφρόνουν
  choice: सोचता था
  rationale: φρονέω सोच, मनोवृत्ति या दृष्टिकोण को व्यक्त कर सकता है। यहाँ ‘सोचता था’ संक्षिप्त और स्वाभाविक है तथा अगले बौद्धिक क्रियापद से अलग रहता है।
- source_word: ἐλογιζόμην
  choice: विचार करता था
  rationale: λογίζομαι में विचार करने, परखने या तर्क करने का भाव है। ‘विचार करता था’ हिन्दी में स्वाभाविक रहते हुए ἐφρόνουν (‘सोचता था’) से सूक्ष्म भेद बनाए रखता है।
- source_word: γέγονα
  choice: हो गया
  rationale: पूर्णकालीन रूप नई अवस्था में पहुँचने को दर्शाता है। ‘जब मैं पुरुष हो गया’ हिन्दी में स्वाभाविक रूप से इस परिवर्तन को व्यक्त करता है।
- source_word: ἀνήρ
  choice: पुरुष
  rationale: ἀνήρ यहाँ व्याकरणिक और शाब्दिक रूप से पुरुष को सूचित करता है। पौलुस अपने बालकपन और पुरुषावस्था का प्रतिनिधिक उदाहरण दे रहा है, इसलिए मूल का लिंग-सूचक विरोध सुरक्षित रखा गया है।
- source_word: κατήργηκα
  choice: छोड़ दीं
  rationale: संदर्भ में καταργέω का भाव बालकपन से जुड़ी बातों को निष्क्रिय कर पीछे छोड़ देने का है। ‘छोड़ दीं’ परिपक्वता के इस व्यक्तिगत रूपक में स्पष्ट और स्वाभाविक है।
- source_word: τὰ τοῦ νηπίου
  choice: बालकपन की बातें
  rationale: यूनानी पदबंध शाब्दिक रूप से ‘बालक की चीज़ें’ है। ‘बालकपन की बातें’ हिन्दी में उसके व्यापक आशय—बालक के ढंग या उससे जुड़ी बातों—को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक रूप और अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: ἀνήρ में लिंग-सूचक विरोध
  choice: पुरुष
  alternative: वयस्क
  rationale: मूल पाठ νήπιος (‘बालक’) का विरोध स्पष्ट रूप से पुल्लिंग ἀνήρ (‘पुरुष’) से करता है। इसे ‘वयस्क’ करके लिंग-निरपेक्ष नहीं बनाया गया, यद्यपि प्रसंग में यह परिपक्वता का उदाहरण है, पुरुष-श्रेष्ठता का कोई धर्मसैद्धान्तिक दावा नहीं।
- issue: τὰ τοῦ νηπίου की व्यापकता
  choice: बालकपन की बातें
  alternative: बालक के ढंग; बालक की चीज़ें
  rationale: पदबंध जानबूझकर व्यापक है और केवल बोलने, सोचने या विचार करने में से किसी एक तक सीमित नहीं। हिन्दी पाठ में ऐसा व्यापक मुहावरा चुना गया है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। तीन समानांतर क्रियाओं—‘बोलता था,’ ‘सोचता था,’ और ‘विचार करता था’—से मूल की आलंकारिक लय और विचारगत क्रम सुरक्षित रखा गया है।
