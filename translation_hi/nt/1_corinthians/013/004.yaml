  text: Ἡ ἀγάπη μακροθυμεῖ, χρηστεύεται ἡ ἀγάπη, οὐ ζηλοῖ ⸂ἡ ἀγάπη⸃, οὐ περπερεύεται, οὐ φυσιοῦται,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/004.yaml
  text: Love is patient[a], love is kind. It does not envy, it does not boast[b], it is not puffed up.
translation:
  language: hi
  text: प्रेम धीरज रखता है, प्रेम दयालु है। वह ईर्ष्या नहीं करता,[a] अपनी बड़ाई नहीं करता और घमंड से फूल नहीं जाता।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जलन नहीं रखता।” यूनानी क्रिया सकारात्मक उत्साह या नकारात्मक जलन/ईर्ष्या, दोनों व्यक्त कर सकती है; यहाँ नकारात्मक संदर्भ ‘ईर्ष्या’ के पक्ष में है।
    reason: lexical_alternative
  - marker: b
    text: या, “घमंडी नहीं होता।” यूनानी में घमंड के कारण फूल जाने का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: प्रेम
  rationale: ‘प्रेम’ आधुनिक मानक हिन्दी में व्यापक नैतिक और संबंधपरक अर्थ को स्वाभाविक रूप से व्यक्त करता है; ‘दानशीलता’ अर्थ को अनुचित रूप से संकीर्ण कर देती।
- source_word: μακροθυμεῖ
  choice: धीरज रखता है
  rationale: यह क्रिया विशेषकर लोगों के प्रति लंबे समय तक धैर्य और सहनशीलता दिखाने का भाव रखती है। ‘धीरज रखता है’ सहज, वर्तमान और गरिमापूर्ण हिन्दी है।
- source_word: χρηστεύεται
  choice: दयालु है
  rationale: दुर्लभ यूनानी क्रिया भलाई और कृपालुता से व्यवहार करने को बताती है। संक्षिप्त विधेय ‘दयालु है’ आसपास की लय के अनुरूप है।
- source_word: ζηλοῖ
  choice: ईर्ष्या नहीं करता
  rationale: क्रिया उत्साह अथवा जलन/ईर्ष्या दोनों का भाव दे सकती है, पर οὐ के साथ इस नकारात्मक नैतिक सूची में ईर्ष्या का अर्थ संदर्भानुकूल है।
- source_word: περπερεύεται
  choice: अपनी बड़ाई नहीं करता
  rationale: यह आत्म-प्रदर्शन और शेखी बघारने को सूचित करता है। यह चयन स्पष्ट तथा गरिमापूर्ण है और बोलचाल के ‘डींग मारना’ से कम अनौपचारिक है।
- source_word: φυσιοῦται
  choice: घमंड से फूल नहीं जाता
  rationale: यह घमंड से फुलाए जाने का रूपक है। हिन्दी अभिव्यक्ति मूल रूपक को बनाए रखते हुए उसका आशय भी स्पष्ट करती है।
- source_word: ἡ ἀγάπη ... ἡ ἀγάπη ... ⸂ἡ ἀγάπη⸃
  choice: प्रेम ... प्रेम ... वह
  rationale: आरंभ की पुनरावृत्ति अलंकारिक बल के लिए रखी गई है; आगे ‘वह’ हिन्दी में अनावश्यक पुनरावृत्ति से बचाते हुए उसी कर्ता को स्पष्ट रखता है।
- source_word: οὐ
  choice: नहीं
  rationale: हर नकारात्मक विधान में यूनानी निषेध को स्वाभाविक हिन्दी क्रियारूप के साथ व्यक्त किया गया है।
theological_decisions:
- issue: इस प्रसिद्ध नैतिक-धर्मवैचारिक प्रसंग में ἀγάπη का अनुवाद
  choice: प्रेम
  alternative: दानशीलता
  rationale: ‘प्रेम’ शब्द के व्यापक संबंधपरक और नैतिक अर्थ को सुरक्षित रखता है और इसे केवल परोपकारी दान तक सीमित नहीं करता।
- issue: ζηλοῖ का संदर्भगत अर्थ
  choice: ईर्ष्या नहीं करता
  alternative: जलन नहीं रखता / उत्साही नहीं होता
  rationale: क्रिया में सकारात्मक उत्साह का अर्थ संभव है, किंतु यहाँ निषेध और दुर्गुणों की श्रृंखला नकारात्मक ईर्ष्या को इंगित करती है; फिर भी पादटिप्पणी में निकट विकल्प सुरक्षित रखा गया है।
- issue: φυσιοῦται के घमंड-संबंधी रूपक का संरक्षण
  choice: घमंड से फूल नहीं जाता
  alternative: घमंडी नहीं होता
  rationale: चयन पौलुस के ‘फूलने’ के रूपक को बनाए रखता है; वैकल्पिक अनुवाद अर्थ को स्पष्ट करता है पर रूपक को समतल कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। प्रेम को व्यक्तिवाचक कर्ता मानकर पुल्लिंग एकवचन क्रियाएँ रखी गई हैं। आरंभिक ‘प्रेम’ की पुनरावृत्ति मूल की वाक्पटुता को सुरक्षित रखती है; बाद की श्रृंखला में ‘वह’ स्वाभाविक हिन्दी प्रवाह देता है।
