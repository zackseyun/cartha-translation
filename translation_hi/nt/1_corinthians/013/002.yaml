  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂καὶ ἐὰν⸃ ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, ⸄καὶ ἐὰν⸅ ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη ⸀μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/002.yaml
  text: And if I have prophecy and understand all mysteries and all knowledge[a], and if I have all faith so as to move mountains, but do not have love, I am nothing.
translation:
  language: hi
  text: और यदि मुझे भविष्यवाणी प्राप्त हो, और मैं सब रहस्यों और सारे ज्ञान को जानता होऊँ, और यदि मुझ में ऐसा सारा विश्वास[a] हो कि मैं पहाड़ों को हटा दूँ, पर मुझ में प्रेम न हो, तो मैं कुछ भी नहीं हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सारा भरोसा’; कम संभावित, ‘सारी निष्ठा।’ यहाँ संदर्भ असाधारण, पहाड़ों को हटाने वाले विश्वास का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείαν
  choice: भविष्यवाणी करने का वरदान
  rationale: संदर्भ आत्मिक वरदानों का है; यह स्वाभाविक हिन्दी में संज्ञा का व्यापक आशय व्यक्त करता है, बिना किसी पद या कार्यालय को निर्दिष्ट किए।
- source_word: εἰδῶ
  choice: जानता होऊँ
  rationale: οἶδα का मूल अर्थ ‘जानना’ है। ‘भेदों’ और ‘ज्ञान’ के साथ यह गहरी बौद्धिक पकड़ को व्यक्त करता है और यूनानी पाठ की शब्दावली के निकट रहता है।
- source_word: μυστήρια
  choice: भेदों
  rationale: ‘भेद’ पौलुस की उस धार्मिक अवधारणा को व्यक्त करता है जिसमें पहले छिपी बात प्रकट की जाती है; ‘रहस्य’ की तुलना में यह सामान्य हिन्दी पाठक के लिए अधिक सहज है।
- source_word: γνῶσιν
  choice: ज्ञान
  rationale: यह γνῶσις का सीधा और स्थापित हिन्दी समतुल्य है तथा εἰδῶ की क्रिया से संबंधित, फिर भी अलग, संज्ञा को बनाए रखता है।
- source_word: πᾶσαν τὴν πίστιν
  choice: पूरा विश्वास
  rationale: संदर्भ में आशय असाधारण, पर्वत हटाने वाले विश्वास से है। ‘पूरा’ πᾶσαν की समग्रता को स्वाभाविक हिन्दी में व्यक्त करता है; इसे उद्धार-संबंधी तकनीकी श्रेणी के रूप में सीमित नहीं किया गया।
- source_word: ὥστε ὄρη μεθιστάναι
  choice: ऐसा ... कि मैं पहाड़ों को हटा दूँ
  rationale: यह परिणामसूचक यूनानी रचना और पर्वत हटाने की प्रभावशाली छवि दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: ἀγάπην
  choice: प्रेम
  rationale: ‘प्रेम’ आधुनिक हिन्दी में ἀγάπη का व्यापक, स्वाभाविक और धार्मिक रूप से निष्पक्ष अनुवाद है।
- source_word: οὐθέν εἰμι
  choice: मैं कुछ भी नहीं हूँ
  rationale: यह पौलुस के कठोर आत्म-निषेध को बिना व्याख्यात्मक विस्तार के स्पष्ट और बलपूर्ण ढंग से रखता है।
theological_decisions:
- issue: चमत्कारकारी सामर्थ्य के संदर्भ में πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; निष्ठा
  rationale: यहाँ पर्वत हटाने की क्षमता बताने वाला संदर्भ असाधारण विश्वास की ओर संकेत करता है। ‘निष्ठा’ इस वाक्य-विन्यास और संदर्भ में कम संभावित है; किसी विशिष्ट मतगत अर्थ को पाठ में नहीं थोपा गया।
- issue: προφητείαν को क्षमता, कार्य या वरदान के रूप में व्यक्त करना
  choice: भविष्यवाणी करने का वरदान
  alternative: भविष्यवाणी; भविष्यवाणी करने की सामर्थ्य
  rationale: निकटवर्ती प्रसंग आत्मिक वरदानों का है, इसलिए ‘वरदान’ निहित संदर्भ को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि इसे किसी स्थायी पद के अर्थ में नहीं बाँधता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय किंतु सामान्य पाठक के लिए सुबोध। यूनानी वाक्य की क्रमिक अतिशयोक्ति और अंतिम विरोध—‘पर प्रेम न रखूँ’—को सुरक्षित रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि πίστις के वैकल्पिक अर्थ इस संदर्भ में पर्याप्त रूप से संभावित नहीं हैं कि मुख्य पाठ में चिह्न लगाया जाए।
