  text: ⸂καὶ ἐὰν⸃ ψωμίσω πάντα τὰ ὑπάρχοντά μου, ⸄καὶ ἐὰν⸃ παραδῶ τὸ σῶμά μου, ἵνα ⸀καυθήσομαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/003.yaml
  text: And if I give away all my possessions[a], and if I hand over my body so that I may be burned, but do not have love, I gain nothing.
translation:
  language: hi
  text: और यदि मैं अपनी सारी संपत्ति बाँट दूँ, और यदि मैं अपना शरीर सौंप दूँ ताकि मुझे जला दिया जाए[a], पर मुझ में प्रेम न हो, तो मुझे कोई लाभ नहीं होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “ताकि मैं घमंड करूँ” पढ़ा जाता है; “ताकि मुझे जला दिया जाए” नहीं।
    reason: textual_variant
lexical_decisions:
- source_word: ψωμίσω
  choice: बाँट दूँ
  rationale: यह क्रिया मूलतः कौर-कौर करके खिलाने और फिर अंशों में बाँटने का भाव रखती है। सारी संपत्ति के संदर्भ में “बाँट दूँ” दान में सब कुछ वितरित कर देने का स्वाभाविक और स्पष्ट अर्थ देता है।
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: अपनी सारी संपत्ति
  rationale: यह पद व्यक्ति की समस्त भौतिक संपदा या अधिकार में आने वाली वस्तुओं को दर्शाता है; “अपनी सारी संपत्ति” आधुनिक हिन्दी में संक्षिप्त और ठोस है।
- source_word: παραδῶ
  choice: सौंप दूँ
  rationale: “सौंप दूँ” अपने शरीर को किसी परिणाम या कष्ट के लिए दूसरे के अधिकार में दे देने का भाव बनाए रखता है और “बलिदान कर दूँ” जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: τὸ σῶμά μου
  choice: अपना शरीर
  rationale: मूल के ठोस संज्ञा-पद का सीधा और स्वाभाविक अनुवाद।
- source_word: ἵνα καυθήσομαι
  choice: ताकि मुझे जला दिया जाए
  rationale: ἵνα उद्देश्य या अभिप्रेत परिणाम को जोड़ता है और καυθήσομαι जलाए जाने का कर्मवाच्य भाव देता है। हिन्दी में यह रचना स्वाभाविक रहते हुए मूल पाठ की मुख्य पांडुलिपीय रीडिंग को व्यक्त करती है।
- source_word: ἀγάπην
  choice: प्रेम
  rationale: “प्रेम” ἀγάπη का व्यापक, वर्तमान और संप्रदाय-निरपेक्ष हिन्दी समतुल्य है।
- source_word: οὐδὲν ὠφελοῦμαι
  choice: मुझे कुछ भी लाभ नहीं
  rationale: यह वाक्यांश वक्ता को कोई लाभ या फायदा न पहुँचने पर बल देता है; चुनी हुई हिन्दी व्यक्तिगत परिणाम को स्पष्ट रूप से बनाए रखती है।
- source_word: καὶ ἐὰν ... καὶ ἐὰν
  choice: और यदि ... और यदि
  rationale: दोनों शर्तवाचक खंडों को स्पष्ट रखकर पौलुस की क्रमशः तीव्र होती काल्पनिक स्थितियों की आलंकारिक पुनरावृत्ति सुरक्षित रखी गई है।
theological_decisions:
- issue: उद्देश्यवाचक खंड में पाठांतर
  choice: SBLGNT के καυθήσομαι को मुख्य पाठ में “ताकि मुझे जला दिया जाए” अनूदित किया गया है।
  alternative: καυχήσωμαι — “ताकि मैं घमण्ड करूँ”
  rationale: दिए गए मूल-पाठ SBLGNT को प्राथमिकता दी गई है। चूँकि पाठांतर से अर्थ उल्लेखनीय रूप से बदलता है—जलाए जाने के लिए शरीर सौंपना बनाम घमण्ड करने का अवसर—वैकल्पिक पाठ को पारदर्शिता के लिए पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। “बाँट दूँ,” “सौंप दूँ,” और “लाभ” जैसे शब्द मूल की प्रगति तथा गंभीरता को बिना अनावश्यक तकनीकीपन के व्यक्त करते हैं।
