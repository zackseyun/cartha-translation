  yaml_path: translation/nt/1_corinthians/013/006.yaml
  text: it does not rejoice in unrighteousness, but rejoices with the truth.
translation:
  language: hi
  text: वह अधर्म पर आनन्दित नहीं होता,[a] बल्कि सत्य के साथ आनन्दित होता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गलत काम पर’ अथवा ‘अन्याय पर’।
    reason: lexical_alternative
  - marker: b
    text: या ‘सत्य पर आनन्दित होता है।’ यूनानी संयुक्त क्रिया का अर्थ किसी के साथ मिलकर आनन्दित होना या सत्य के कारण आनन्दित होना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρει
  choice: आनन्दित होता
  rationale: यह क्रिया प्रसन्न होने या आनन्द मनाने का भाव व्यक्त करती है। ‘आनन्दित होता’ ऊँची किंतु सहज शैली रखता है और συγχαίρει के साथ क्रियात्मक समानता बनाए रखता है।
- source_word: ἐπὶ τῇ ἀδικίᾳ
  choice: अधर्म पर
  rationale: χαίρει के साथ ἐπί + संप्रदान उस आधार या अवसर को दर्शाता है जिस पर आनन्द होता है। ‘अधर्म’ ἀδικία के व्यापक नैतिक और पौलुसी धार्मिक अर्थ को रखता है; ‘पर’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: συγχαίρει
  choice: के साथ आनन्दित होता
  rationale: संयुक्त क्रिया का συν- उपसर्ग साथ मिलकर आनन्दित होने का भाव जोड़ता है। यह रूप उस अर्थ को स्पष्ट रखता है, जबकि वैकल्पिक ‘सत्य पर आनन्दित होता है’ भी संभव है।
- source_word: δὲ
  choice: बल्कि
  rationale: यहाँ δέ पहले निषेध और उसके विपरीत सकारात्मक कथन के बीच तीखा विरोध दिखाता है; हिन्दी में ‘बल्कि’ इस संरचना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῇ ἀληθείᾳ
  choice: सत्य
  rationale: ‘सत्य’ कथन, आचरण और नैतिक वास्तविकता से जुड़े व्यापक अर्थ को खुला रखता है तथा ἀδικία के साथ मूल विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: पौलुस के नैतिक विरोध में ἀδικία का अनुवाद
  choice: अधर्म
  alternative: गलत काम; अन्याय
  rationale: ‘अधर्म’ केवल कानूनी या सामाजिक अन्याय तक सीमित न होकर व्यापक नैतिक-धार्मिक अर्थ बनाए रखता है। फिर भी संभावित अधिक ठोस अर्थों को पादटिप्पणी में दिया गया है।
- issue: συγχαίρει में सहभागिता का भाव
  choice: सत्य के साथ आनन्दित होता है
  alternative: सत्य पर आनन्दित होता है
  rationale: चुना हुआ पाठ συν- उपसर्ग में निहित साथ आनन्दित होने के भाव को प्रत्यक्ष रखता है, पर यूनानी क्रिया का सत्य के कारण या सत्य पर आनन्दित होने वाला अर्थ भी संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमामय और सहज शैली। ‘प्रेम’ का कर्ता पिछले संदर्भ से समझा जाता है, इसलिए यूनानी की तरह यहाँ सर्वनामात्मक ‘वह’ रखा गया है। समानांतर क्रियाओं में ‘आनन्दित होता’ दोहराकर मूल की अलंकारिक संरचना बनाए रखी गई है।
