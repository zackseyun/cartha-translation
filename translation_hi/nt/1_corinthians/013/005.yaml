id: 1CO.13.5
reference: 1 Corinthians 13:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐκ ἀσχημονεῖ, οὐ ζητεῖ τὰ ἑαυτῆς, οὐ παροξύνεται, οὐ λογίζεται τὸ κακόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/005.yaml
  text: it does not behave disgracefully[a], it does not seek its own, it is not provoked[e][d][c][b], it does not count the wrong.
translation:
  language: hi
  text: वह अशोभनीय व्यवहार नहीं करता[a], अपना स्वार्थ नहीं खोजता[b], भड़क नहीं उठता[c], और बुराई का हिसाब नहीं रखता[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनुचित ढंग से आचरण नहीं करता” अथवा “अभद्र व्यवहार नहीं करता।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “अपनी ही बातों/हितों को नहीं खोजता”; अर्थात वह स्वार्थी नहीं होता।'
    reason: lexical_alternative
  - marker: c
    text: या “उत्तेजित नहीं होता” अथवा “क्रोधित नहीं होता।” मूल पाठ में “जल्दी” शब्द नहीं है।
    reason: alternative_reading
  - marker: d
    text: या “की गई बुराई को नहीं गिनता।” यहाँ हिसाब-किताब का रूपक है; इसका अर्थ “गलतियों का लेखा नहीं रखता” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖ
  choice: अशोभनीय व्यवहार नहीं करता
  rationale: यह क्रिया अनुचित, लज्जाजनक या मर्यादा के विरुद्ध आचरण को व्यक्त करती है। ‘अशोभनीय व्यवहार’ इसके सामाजिक और नैतिक विस्तार को बनाए रखता है और इसे केवल रूखेपन तक सीमित नहीं करता।
- source_word: ζητεῖ τὰ ἑαυτῆς
  choice: अपना स्वार्थ नहीं खोजता
  rationale: शाब्दिक अर्थ ‘अपनी वस्तुओं/हितों को नहीं खोजता’ है। हिन्दी में ‘अपना स्वार्थ खोजना’ आत्मकेन्द्रित हित-साधन को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि मूल की संक्षिप्तता को स्पष्ट करता है।
- source_word: παροξύνεται
  choice: भड़क नहीं उठता
  rationale: यह मध्य/कर्मवाच्य रूप तीखी झुंझलाहट या क्रोध के लिए उकसाए जाने अथवा उत्तेजित होने का भाव देता है। ‘भड़क नहीं उठता’ आधुनिक हिन्दी में स्वाभाविक है और मूल में अनुपस्थित ‘जल्दी’ जैसे क्रियाविशेषण को नहीं जोड़ता।
- source_word: λογίζεται
  choice: हिसाब नहीं रखता
  rationale: क्रिया का अर्थ गिनना, लेखा करना या खाते में दर्ज करना है। ‘हिसाब रखना’ हिन्दी में लेखांकन के रूपक को बनाए रखते हुए स्वाभाविक अभिव्यक्ति देता है।
- source_word: τὸ κακόν
  choice: बुराई
  rationale: सव्याख्यायुक्त नपुंसकलिंग एकवचन ‘बुराई/अनिष्ट’ को सामान्य अथवा संबंधपरक अर्थ में सूचित कर सकता है। ‘बुराई’ इसकी वास्तविक अस्पष्टता बनाए रखता है; इसे केवल ‘अपने साथ किए गए अपराधों’ तक सीमित नहीं करता।
- source_word: ἀγάπη (contextual subject)
  choice: वह
  rationale: पिछले संदर्भ में विषय ‘प्रेम’ है। हिन्दी में पुल्लिंग संज्ञा ‘प्रेम’ के लिए ‘वह’ से क्रम को स्वाभाविक रूप से जारी रखा गया है।
theological_decisions:
- issue: क्या παροξύνεται में ‘जल्दी/आसानी से’ जोड़कर क्रोध की तीव्रता को सीमित किया जाए
  choice: भड़क नहीं उठता
  alternative: जल्दी क्रोधित नहीं होता
  rationale: यूनानी पाठ में ‘जल्दी’ या ‘आसानी से’ के लिए कोई स्पष्ट क्रियाविशेषण नहीं है। चुना हुआ पाठ इस जोड़ से बचता है और कथन की पूर्ण शक्ति बनाए रखता है।
- issue: क्या λογίζεται τὸ κακόν को केवल दूसरों द्वारा किए गए अपराधों का लेखा रखने के रूप में स्पष्ट किया जाए
  choice: बुराई का हिसाब नहीं रखता
  alternative: अपने साथ किए गए अपराधों का लेखा नहीं रखता
  rationale: संदर्भ संबंधपरक अर्थ का समर्थन करता है, पर यूनानी τὸ κακόν व्यापक रूप से ‘बुराई/अनिष्ट’ भी हो सकता है। मुख्य पाठ लेखांकन का रूपक और अर्थगत तनाव दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद के कर्ता ‘प्रेम’ को पिछले संदर्भ से ग्रहण करके ‘वह’ कहा गया है। समानांतर निषेधात्मक वाक्यांशों की लय बनाए रखते हुए अन्तिम खंड से पहले ‘और’ जोड़ा गया है।
