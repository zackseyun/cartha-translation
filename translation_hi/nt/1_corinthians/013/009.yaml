  text: ἐκ μέρους ⸀γὰρ γινώσκομεν καὶ ἐκ μέρους προφητεύομεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/009.yaml
  text: For we know in part[a], and we prophesy in part.
translation:
  language: hi
  text: क्योंकि हम अंशतः जानते हैं[a] और अंशतः भविष्यवाणी करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कुछ अंश में’; यूनानी मुहावरे का शाब्दिक अर्थ ‘एक अंश से’ है और बल देने के लिए दोनों उपवाक्यों में दोहराया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μέρους
  choice: अंशतः
  rationale: यह यूनानी मुहावरे के ‘कुछ अंश में/आंशिक रूप से’ अर्थ को संक्षेप में व्यक्त करता है और दोनों उपवाक्यों में उसकी पुनरावृत्ति बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के साथ व्याख्यात्मक संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: γινώσκομεν
  choice: हम जानते हैं
  rationale: यह क्रिया के सामान्य ज्ञानार्थ को सीधे व्यक्त करता है और उसे ‘समझते हैं’ कहकर अनावश्यक रूप से सीमित नहीं करता।
- source_word: καὶ
  choice: और
  rationale: यह दोनों समानांतर उपवाक्यों को सरलता से जोड़ता और उनकी समरूपता बनाए रखता है।
- source_word: προφητεύομεν
  choice: हम भविष्यवाणी करते हैं
  rationale: यह आत्मिक वरदानों के प्रसंग में प्रयुक्त मूल पारिभाषिक क्रिया को बनाए रखता है तथा उसके अर्थ को केवल भविष्य बताने या सामान्य प्रचार तक सीमित नहीं करता।
theological_decisions:
- issue: कलीसिया में भविष्यवाणी की गतिविधि का अर्थ
  choice: προφητεύομεν को ‘हम भविष्यवाणी करते हैं’ अनूदित किया गया है।
  alternative: ‘हम भविष्य की घटनाएँ बताते हैं’ अथवा ‘हम प्रचार करते हैं’
  rationale: प्रसंग आत्मिक वरदानों का है और यूनानी शब्द केवल भविष्य-कथन से अधिक व्यापक भविष्यसूचक वाणी को समेट सकता है; तटस्थ अनुवाद स्रोत की धर्मवैज्ञानिक व्यापकता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। समानांतर संरचना और मूल की पुनरावृत्ति सुरक्षित रखी गई है।
