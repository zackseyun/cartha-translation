  edition: SBLGNT
  text: βλέπομεν γὰρ ἄρτι δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· ἄρτι γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/013/012.yaml
  text: For now we see in a mirror[a], dimly, but then face to face. Now I know in part, but then I will know fully, just as I also have been fully known.
translation:
  language: hi
  text: क्योंकि अभी हम दर्पण के द्वारा गूढ़ रूप में देखते हैं,[a] पर तब आमने-सामने। अभी मैं आंशिक रूप से जानता हूँ, पर तब पूरी तरह जानूँगा, जैसे मुझे भी पूरी तरह जाना गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से, “दर्पण के द्वारा, पहेली में”; अर्थात वर्तमान दर्शन अप्रत्यक्ष और गूढ़ है। अन्य अनुवाद: “दर्पण में धुँधला-सा।”'
    reason: ἐν αἰνίγματι के शाब्दिक ‘पहेली में’ और प्रचलित अर्थानुवाद ‘धुँधला-सा’—दोनों को दर्शाना।
lexical_decisions:
- source_word: βλέπομεν
  choice: हम ... देखते हैं
  rationale: दृष्टि के रूपक और प्रथम पुरुष बहुवचन को सीधे तथा स्वाभाविक रूप में सुरक्षित रखता है।
- source_word: ἄρτι
  choice: अभी
  rationale: τότε अर्थात ‘तब’ के साथ वर्तमान और भविष्य का स्पष्ट कालगत विरोध बनाए रखता है।
- source_word: δι’ ἐσόπτρου
  choice: दर्पण के द्वारा
  rationale: διά के माध्यमसूचक अर्थ को सुरक्षित रखता है; प्राचीन दर्पण में दिखाई देने वाला प्रतिबिंब अप्रत्यक्ष होता था।
- source_word: ἐν αἰνίγματι
  choice: पहेली-सा
  rationale: αἴνιγμα के ‘पहेली/गूढ़ बात’ वाले मूल अर्थ को सहज हिन्दी में व्यक्त करता है और केवल ‘धुँधला’ कहकर उसके रहस्यमय तथा अप्रत्यक्ष बोध को सीमित नहीं करता।
- source_word: πρόσωπον πρὸς πρόσωπον
  choice: आमने-सामने
  rationale: प्रत्यक्ष भेंट या दर्शन को व्यक्त करने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: γινώσκω ἐκ μέρους
  choice: मैं कुछ ही अंश में जानता हूँ
  rationale: वर्तमान ज्ञान की आंशिकता को स्पष्ट करता है और अगले वाक्यांश के पूर्णतर ज्ञान से विरोध बनाए रखता है।
- source_word: ἐπιγνώσομαι
  choice: मैं पूरी तरह जानूँगा
  rationale: ἐπιγινώσκω की तीव्रता और ἐκ μέρους से विरोध को दर्शाता है, पर सर्वज्ञता का दावा नहीं जोड़ता।
- source_word: καθὼς καὶ ἐπεγνώσθην
  choice: ठीक वैसे ही जैसे मुझे भी पूरी तरह जाना गया है
  rationale: भविष्य के ἐπιγνώσομαι और निष्क्रिय ἐπεγνώσθην के शब्दगत साम्य को बनाए रखता है तथा जानने वाले को यूनानी पाठ की तरह अनिर्दिष्ट छोड़ता है।
theological_decisions:
- issue: भविष्य के ज्ञान की सीमा
  choice: ‘पूरी तरह जानूँगा’
  alternative: ‘सब कुछ जान जाऊँगा’ अथवा ‘सर्वज्ञ हो जाऊँगा’
  rationale: पाठ वर्तमान के आंशिक ज्ञान की तुलना भविष्य के पूर्णतर ज्ञान से करता है, किंतु मनुष्य को ईश्वर के समान सर्वज्ञ बताना आवश्यक नहीं करता।
- issue: ἐπεγνώσθην में जानने वाला कौन है
  choice: निष्क्रिय रचना ‘मुझे ... जाना गया है’ द्वारा उसे अनिर्दिष्ट रखा
  alternative: ‘जैसे परमेश्वर मुझे पूरी तरह जानता है’
  rationale: संदर्भ में परमेश्वर निहित हो सकता है, पर यूनानी वाक्य में कर्ता स्पष्ट नहीं है; अनुवाद इस अंतर्निहितता को व्याख्या बनाकर मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दर्पण’, ‘आमने-सामने’ और ‘पूरी तरह’ जैसे परिचित पद मूल रूपक तथा समानांतर रचना को बनाए रखते हैं।
