source:
  edition: SBLGNT
  text: θέλω ⸀δὲ πάντας ἀνθρώπους εἶναι ὡς καὶ ἐμαυτόν· ἀλλὰ ἕκαστος ἴδιον ⸂ἔχει χάρισμα⸃ ἐκ θεοῦ, ⸀ὁ μὲν οὕτως, ⸁ὁ δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/007.yaml
  text: But I want all men to be as I myself am. Yet each has his own gift from God, one in this way and another in that way.
translation:
  language: hi
  text: पर मैं चाहता हूँ कि सभी लोग मेरे समान हों। फिर भी हर एक को परमेश्वर से अपना-अपना वरदान है—एक को इस प्रकार और दूसरे को उस प्रकार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντας ἀνθρώπους
  choice: सभी पुरुष
  rationale: संदर्भ में पौलुस अपनी अविवाहित अवस्था की चर्चा कर रहा है, और उपलब्ध अंग्रेज़ी परामर्श-पाठ भी पुरुष-संदर्भ को सुरक्षित रखता है। ‘पुरुष’ यहाँ वयस्क पुरुषों के लिए स्वाभाविक और स्पष्ट है।
- source_word: θέλω
  choice: मैं चाहता हूँ
  rationale: ग्रीक क्रिया इच्छा या चाह को व्यक्त करती है; इसे आज्ञा या अनिवार्यता के रूप में नहीं प्रस्तुत किया गया।
- source_word: χάρισμα
  choice: वरदान
  rationale: यह परमेश्वर से अनुग्रहपूर्वक मिले विशेष दान या सामर्थ्य का प्रचलित और संदर्भानुकूल धार्मिक शब्द है।
- source_word: ὁ μὲν οὕτως, ὁ δὲ οὕτως
  choice: किसी को एक प्रकार का और किसी को दूसरे प्रकार का
  rationale: ग्रीक की जानबूझकर सामान्य और समांतर अभिव्यक्ति को बिना यह तय किए रखा गया है कि प्रत्येक ‘प्रकार’ ठीक किस वैवाहिक अवस्था को सूचित करता है।
theological_decisions:
- issue: क्या पौलुस अपनी अवस्था को सबके लिए आदेश या आदर्श घोषित करता है?
  choice: इसे व्यक्तिगत इच्छा के रूप में रखा गया है, जिसके बाद अलग-अलग ईश्वरीय वरदानों की पुष्टि आती है।
  alternative: इसे सभी के लिए अविवाहित रहने की आज्ञा या सार्वभौमिक श्रेष्ठता के दावे के रूप में प्रस्तुत करना।
  rationale: θέλω इच्छा व्यक्त करता है, जबकि ἀλλὰ और प्रत्येक के अपने χάρισμα का उल्लेख इस इच्छा को सार्वभौमिक आदेश बनने से रोकता है।
- issue: ‘वरदान’ का आशय
  choice: 'पाठ की अस्पष्टता बनाए रखी गई है: किसी का वरदान ‘एक प्रकार का’, किसी का ‘दूसरे प्रकार का’ है।'
  alternative: स्पष्ट रूप से कहना कि केवल ब्रह्मचर्य वरदान है, या विवाह और अविवाहित अवस्था की विस्तृत धार्मिक श्रेणियाँ जोड़ना।
  rationale: पद स्वयं दोनों प्रकारों को नाम नहीं देता; इसलिए अनकही व्याख्या को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण वाक्य-विन्यास रखा गया है। ‘फिर भी’ ἀλλά के विरोधात्मक मोड़ को स्वाभाविक ढंग से व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
