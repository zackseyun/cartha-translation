id: 1CO.7.24
reference: 1 Corinthians 7:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἕκαστος ἐν ᾧ ἐκλήθη, ἀδελφοί, ἐν τούτῳ μενέτω παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/024.yaml
  text: Brothers[b][a], let each one remain with God in that condition in which he was called.
translation:
  language: hi
  text: भाइयो[a], हर एक जन जिस दशा में बुलाया गया था, उसी में परमेश्वर के साथ[b] बना रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भाइयो” से पूरी मण्डली को संबोधित किया गया है, जिसमें स्त्रियाँ भी शामिल हैं।
    reason: cultural_note
  - marker: b
    text: या “परमेश्वर के सामने” अथवा “परमेश्वर की उपस्थिति में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: हर एक जन
  rationale: वितरणात्मक एकवचन को स्पष्ट रखता है और निर्देश को प्रत्येक व्यक्ति पर लागू करता है।
- source_word: ἐν ᾧ ... ἐν τούτῳ
  choice: जिस दशा में ... उसी में
  rationale: यूनानी के संबंधवाचक–संकेतवाचक ढाँचे को स्वाभाविक हिन्दी में बनाए रखते हुए प्रसंग की सामाजिक या जीवनगत स्थिति व्यक्त करता है।
- source_word: ἐκλήθη
  choice: बुलाया गया था
  rationale: कर्मवाच्य को बनाए रखता है; प्रसंग में बुलाने वाला परमेश्वर समझा जाता है, पर मूल पाठ में कर्ता स्पष्ट रूप से नहीं जोड़ा गया।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: सम्बोधन के व्याकरणिक पुल्लिंग बहुवचन को सुरक्षित रखता है; यहाँ यह पूरी मण्डली को संबोधित करता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: μενέτω
  choice: बना रहे
  rationale: वर्तमान दशा में निरन्तर रहने की आज्ञा को सहज और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παρὰ θεῷ
  choice: परमेश्वर के साथ
  rationale: παρά के सम्बन्ध या निकटता के भाव को संक्षेप में व्यक्त करता है; ‘परमेश्वर के सामने/उपस्थिति में’ सम्भव अर्थ हैं और पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ἐκλήθη में बुलाने वाले की पहचान
  choice: ‘बुलाया गया था’ कहकर कर्ता को अनकहा रखना
  alternative: ‘परमेश्वर ने बुलाया था’
  rationale: पौलुस के प्रसंग में परमेश्वर का बुलावा निहित है, पर यूनानी वाक्य कर्ता को स्पष्ट नहीं करता; इसलिए अनावश्यक जोड़ से बचा गया।
- issue: मिश्रित मण्डली के लिए ἀδελφοί का अनुवाद
  choice: ‘भाइयो’
  alternative: ‘भाइयो और बहनो’
  rationale: मुख्य पाठ में मूल के पुल्लिंग सम्बोधन को रखा गया है, जबकि उसके प्रतिनिधिक और समावेशी प्रयोग को पादटिप्पणी स्पष्ट करती है।
- issue: παρὰ θεῷ का सम्बन्धगत अर्थ
  choice: ‘परमेश्वर के साथ’
  alternative: ‘परमेश्वर के सामने’ अथवा ‘परमेश्वर की उपस्थिति में’
  rationale: वाक्यांश संक्षिप्त और अर्थगत रूप से खुला है; मुख्य पाठ सम्बन्ध का भाव रखता है और वैकल्पिक निकटता/उपस्थिति का भाव पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और मण्डली-पाठ के योग्य रूप। ‘दशा’ आसपास के प्रसंग में सामाजिक या जीवनगत स्थिति को दर्शाती है; वाक्य-विन्यास यूनानी के ‘जिस... उसी...’ ढाँचे को स्वाभाविक हिन्दी में सुरक्षित रखता है।
