id: 1CO.7.22
reference: 1 Corinthians 7:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος ἀπελεύθερος κυρίου ἐστίν· ⸀ὁμοίως ὁ ἐλεύθερος κληθεὶς δοῦλός ἐστιν Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/022.yaml
  text: For the servant who was called in the Lord is the Lord’s freedman[a]; likewise[b], the free man who was called is Messiah’s servant.
translation:
  language: hi
  text: क्योंकि जिस दास को प्रभु में बुलाया गया, वह प्रभु का मुक्त जन[a] है; उसी प्रकार जिस स्वतंत्र व्यक्ति को बुलाया गया, वह मसीह का दास है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात दासता से मुक्त किया गया व्यक्ति; यूनानी शब्द उस व्यक्ति के लिए प्रयुक्त होता है जिसे दासता से छोड़ा गया हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: दास
  rationale: ‘दास’ बँधी हुई सामाजिक स्थिति और मसीह के प्रति पूर्ण अधीनता—दोनों को व्यक्त करता है तथा पद के जानबूझकर रचे गए विरोधाभास को बनाए रखता है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह पौलुस की संघ अथवा संबंध-क्षेत्र बताने वाली अभिव्यक्ति को बिना उसे ‘प्रभु द्वारा’ में बदलकर अधिक व्याख्यायित किए सुरक्षित रखता है।
- source_word: κληθεὶς
  choice: बुलाया गया
  rationale: अओरिस्ट कर्मवाच्य कृदंत का स्वाभाविक हिन्दी रूप है और परमेश्वर की बुलाहट के पौलुसी भाव को बनाए रखता है।
- source_word: ἀπελεύθερος
  choice: मुक्त जन
  rationale: यह केवल सामान्यतः स्वतंत्र व्यक्ति नहीं, बल्कि दासता से मुक्त किए गए व्यक्ति को सूचित करता है; तकनीकी सामाजिक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: κυρίου
  choice: प्रभु का
  rationale: 'सम्बन्धकारक को स्वाभाविक हिन्दी अधिकार-संबंध में रखा गया है: मुक्त जन प्रभु से संबंधित और उनका है।'
- source_word: ὁμοίως
  choice: उसी प्रकार
  rationale: दोनों समांतर कथनों के संतुलन और उलटाव को स्पष्ट तथा स्वाभाविक ढंग से जोड़ता है।
- source_word: ἐλεύθερος
  choice: स्वतंत्र व्यक्ति
  rationale: सामाजिक रूप से दास न होने की स्थिति को व्यक्त करता है। प्रतिनिधिक पुल्लिंग यूनानी रूप को हिन्दी में सहज और व्यापक ‘व्यक्ति’ से प्रस्तुत किया गया है।
- source_word: Χριστοῦ
  choice: मसीह का
  rationale: Χριστός के अभिषिक्त राजा वाले पदवीगत अर्थ को हिन्दी के स्थापित शब्द ‘मसीह’ से व्यक्त किया गया है।
- source_word: κύριος
  choice: प्रभु
  rationale: यह यीशु की धर्मवैज्ञानिक पदवी को सुरक्षित रखता है; केवल सामाजिक स्वामी का अर्थ देने वाला विकल्प पद के आशय को संकुचित कर देता।
theological_decisions:
- issue: सामाजिक स्थिति और मसीह से संबंध का विरोधाभासी उलटाव
  choice: दास को ‘प्रभु का मुक्त जन’ और स्वतंत्र व्यक्ति को ‘मसीह का दास’ कहा गया है।
  alternative: δοῦλος को दोनों स्थानों पर ‘सेवक’ कहना या ἀπελεύθερος को केवल ‘स्वतंत्र व्यक्ति’ कहना।
  rationale: 'पौलुस का तर्क इसी तीखे उलटाव पर निर्भर है: सांसारिक दास प्रभु में मुक्त है, जबकि सांसारिक रूप से स्वतंत्र व्यक्ति मसीह का दास है।'
- issue: Χριστοῦ का पदवीगत अनुवाद
  choice: मसीह का
  alternative: ख्रीष्ट का / क्राइस्ट का
  rationale: यहाँ Χριστός अभिषिक्त राजा की पदवी है; ‘मसीह’ आधुनिक हिन्दी में स्थापित, अर्थपूर्ण और स्वाभाविक रूप है।
- issue: ἐν κυρίῳ में बुलाहट और प्रभु से संबंध
  choice: प्रभु में बुलाया गया
  alternative: प्रभु द्वारा बुलाया गया
  rationale: ‘प्रभु में’ संघ अथवा संबंध-क्षेत्र की वास्तविक सम्भावना को बनाए रखता है; ‘प्रभु द्वारा’ इसे केवल कर्ता-सूचक अर्थ में सीमित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दास—मुक्त जन—स्वतंत्र व्यक्ति—दास’ का क्रम मूल पद के सामाजिक और धर्मवैज्ञानिक विरोधाभास को स्पष्ट बनाए रखता है।
