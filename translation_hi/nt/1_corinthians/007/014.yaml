  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡγίασται γὰρ ὁ ἀνὴρ ὁ ἄπιστος ἐν τῇ γυναικί, καὶ ἡγίασται ἡ γυνὴ ἡ ἄπιστος ἐν τῷ ⸀ἀδελφῷ· ἐπεὶ ἄρα τὰ τέκνα ὑμῶν ἀκάθαρτά ἐστιν, νῦν δὲ ἅγιά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/014.yaml
  text: For the unbelieving husband has been made holy through his wife[a], and the unbelieving wife has been made holy through the brother; otherwise your children are unclean, but as it is[b], they are holy.
translation:
  language: hi
  text: क्योंकि अविश्वासी पति अपनी पत्नी के द्वारा पवित्र ठहराया गया है, और अविश्वासी पत्नी उस भाई के द्वारा पवित्र ठहराई गई है[a]; नहीं तो तुम्हारे बच्चे अशुद्ध होते, पर अब वे पवित्र हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, विश्वासी पति के द्वारा। यूनानी में शाब्दिक रूप से “उस भाई के द्वारा” है; पौलुस प्रायः “भाई” शब्द का प्रयोग किसी साथी विश्वासी के लिए करता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “पवित्र ठहराया गया है” का संकेत विश्वासी जीवनसाथी और परिवार के संबंध में एक विशेष, परमेश्वर के लिए अलग की हुई स्थिति की ओर है; इसका अर्थ अनिवार्य रूप से व्यक्तिगत उद्धार नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: ἡγίασται
  choice: पवित्र ठहराया गया है / पवित्र ठहराई गई है
  rationale: पूर्णकालिक कर्मवाच्य पूर्व में हुई क्रिया से बनी वर्तमान स्थिति व्यक्त करता है। यह चयन मूल के ‘पवित्र’ शब्द-समूह से संबंध बनाए रखता है, पर अपने आप व्यक्तिगत उद्धार का दावा नहीं करता।
- source_word: ἄπιστος
  choice: अविश्वासी
  rationale: विवाह के इस संदर्भ में यह ऐसे पति या पत्नी को सूचित करता है जो विश्वास नहीं करता; ‘विश्वासघाती’ अर्थ यहाँ उपयुक्त नहीं है।
- source_word: ἐν
  choice: के द्वारा
  rationale: यहाँ ἐν का संबंधात्मक अथवा साधनात्मक भाव है। ‘के द्वारा’ वैवाहिक संबंध के कारण प्राप्त स्थिति को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀνήρ / γυνή
  choice: पति / पत्नी
  rationale: तात्कालिक संदर्भ विवाह का है, इसलिए सामान्य ‘पुरुष / स्त्री’ की अपेक्षा ये संदर्भानुकूल अर्थ हैं।
- source_word: ἀδελφῷ
  choice: उस भाई
  rationale: मूल यूनानी में ‘पति’ के स्थान पर स्पष्टतः ‘भाई’ है। मुख्य पाठ इसे सुरक्षित रखता है; पादटिप्पणी बताती है कि आशय संभवतः विश्वासी पति से है।
- source_word: ἐπεὶ ἄρα
  choice: नहीं तो
  rationale: यह पूर्व कथन के असत्य होने पर निकलने वाला परिणाम प्रस्तुत करता है; आधुनिक हिन्दी में ‘नहीं तो’ स्वाभाविक है।
- source_word: ἀκάθαρτα
  choice: अशुद्ध
  rationale: यह शब्द सामान्य अपवित्रता के साथ धार्मिक और वाचा-संबंधी प्रतिध्वनि भी सुरक्षित रखता है।
- source_word: νῦν δὲ
  choice: पर अब
  rationale: यह काल्पनिक परिणाम के विपरीत वास्तविक वर्तमान स्थिति दिखाता है और यूनानी की संक्षिप्तता बनाए रखता है।
- source_word: ἅγια
  choice: पवित्र
  rationale: यह ἡγίασται के साथ मूल पाठ की शब्दगत कड़ी बनाए रखता है; ‘अलग किए हुए’ अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: अविश्वासी जीवनसाथी के ‘पवित्र ठहराए जाने’ का अर्थ
  choice: मुख्य पाठ मूल की पवित्रता-संबंधी भाषा को बनाए रखता है; पादटिप्पणी इसे विश्वासी जीवनसाथी और परिवार के संबंध में विशेष या समर्पित स्थिति के रूप में समझाती है, अनिवार्य व्यक्तिगत उद्धार के रूप में नहीं।
  alternative: इसे विवाह के कारण अविश्वासी जीवनसाथी का स्वतः उद्धार मानना, अथवा केवल वैवाहिक यौन-संबंध की वैधता तक सीमित करना।
  rationale: पौलुस का तर्क विवाह और बच्चों की शुद्ध/पवित्र स्थिति से जुड़ा है। पद व्यक्तिगत विश्वास के बिना उद्धार को स्पष्ट रूप से नहीं कहता, इसलिए पाठ की धर्मवैज्ञानिक तनावपूर्ण भाषा को बनाए रखा गया है।
- issue: ἀδελφῷ का संदर्भ
  choice: मुख्य पाठ में ‘उस भाई’ रखा गया है, जिसे संदर्भ में विश्वासी पति समझा जा सकता है।
  alternative: समरूपता के लिए सीधे ‘विश्वासी पति’ या ‘पति’ अनुवाद करना।
  rationale: यूनानी पाठ दूसरे उपवाक्य में ἀνήρ नहीं, ἀδελφός प्रयोग करता है। स्रोत की विशिष्ट शब्दावली सुरक्षित रखते हुए पादटिप्पणी पाठक को संभावित आशय बताती है।
- issue: बच्चों की अशुद्धता वाले कथन का व्याकरणिक रूप
  choice: ‘अशुद्ध होते’
  alternative: ‘अशुद्ध हैं’
  rationale: यूनानी में ἐστιν वर्तमानकाल है, पर ἐπεὶ ἄρα एक प्रतिकल्पित परिणाम प्रस्तुत करता है। हिन्दी में ‘नहीं तो ... होते’ इस तर्क को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है, जबकि वास्तविक वर्तमान स्थिति ‘पर अब’ के बाद दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और स्रोत-सचेत शैली। ‘पवित्र ठहराया गया है’ धार्मिक शब्दावली को बनाए रखते हुए ‘पवित्र किया गया है’ की संभावित नैतिक-परिवर्तन संबंधी अतिव्याख्या से कुछ दूरी रखता है। ‘उस भाई’ मूल की असममिति को जानबूझकर सुरक्षित रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
