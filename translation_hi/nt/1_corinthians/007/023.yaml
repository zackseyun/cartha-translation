  yaml_path: translation/nt/1_corinthians/007/023.yaml
  text: You were bought with a price[a]; do not become servants of men.
translation:
  language: hi
  text: तुम दाम देकर खरीदे गए हो; मनुष्यों के दास[a] मत बनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवक”; पर यूनानी शब्द यहाँ बंधी हुई अधीनता और स्वामित्व का प्रबल भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμῆς
  choice: दाम देकर
  rationale: ἀγοράζω के साथ संबंधकारक रूप खरीद की कीमत व्यक्त करता है। “दाम देकर” स्वाभाविक हिन्दी है और किसी निश्चित रकम का संकेत दिए बिना चुकाई गई कीमत का भाव बनाए रखता है।
- source_word: ἠγοράσθητε
  choice: तुम ... खरीदे गए हो
  rationale: यह अओरिस्ट कर्मवाच्य, मध्यम पुरुष बहुवचन है। यह अनुवाद खरीद और स्वामित्व के रूपक को स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: μὴ γίνεσθε
  choice: मत बनो
  rationale: γίνομαι का मूल भाव “बनना” है। निषेधात्मक वर्तमान आज्ञार्थक के साथ “मत बनो” किसी ऐसी अधीनता में आने या बने रहने से रोकता है, बिना केवल स्थिर “मत रहो” का अर्थ देने के।
- source_word: δοῦλοι
  choice: दास
  rationale: संदर्भ में खरीदे जाने, स्वामित्व और अधीनता का रूपक प्रमुख है; इसलिए “दास” इस बंधी हुई स्थिति को “सेवक” की अपेक्षा अधिक ठीक व्यक्त करता है।
- source_word: ἀνθρώπων
  choice: मनुष्यों के
  rationale: यह δοῦλοι पर निर्भर संबंधकारक है। “मनुष्यों” से सभी मानव प्राणी अभिप्रेत हैं और उनका विरोध प्रभु के स्वामित्व से है; यह केवल पुरुषों तक अर्थ सीमित नहीं करता।
theological_decisions:
- issue: δοῦλοι ἀνθρώπων में स्वामित्व और निष्ठा के रूपक को कैसे व्यक्त किया जाए
  choice: मनुष्यों के दास
  alternative: मनुष्यों के सेवक
  rationale: तर्क का बल इस बात पर है कि विश्वासी दाम देकर खरीदे गए हैं, इसलिए वे मनुष्यों के अंतिम स्वामित्व या नियंत्रण में न आएँ। “दास” इस स्वामित्व-संबंधी तनाव को बनाए रखता है; “सेवक” सम्भव है, पर रूपक की तीव्रता घटा सकता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। “मनुष्यों” समावेशी है और यूनानी ἀνθρώπων को केवल पुरुषों तक सीमित नहीं करता। वाक्य की संक्षिप्त आज्ञात्मक शक्ति तथा खरीद के रूपक को बनाए रखा गया है।
