source:
  edition: SBLGNT
  text: ⸀καὶ μεμέρισται. καὶ ἡ γυνὴ ⸂ἡ ἄγαμος⸃ καὶ ἡ ⸀παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία καὶ ⸀τῷ σώματι καὶ ⸁τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ⸀ἀρέσῃ τῷ ἀνδρί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/034.yaml
  text: And she is divided. And the unmarried woman[a], that is, the virgin, is concerned about the things of the Lord, so that she may be holy both in body and in spirit. But the married woman is concerned about the things of the world, how she may please her husband.
translation:
  language: hi
  text: और उसका ध्यान बँटा हुआ है। और अविवाहित स्त्री[a], अर्थात् कुँवारी, प्रभु की बातों की चिन्ता करती है, ताकि वह शरीर और आत्मा—दोनों में पवित्र हो। परन्तु विवाहित स्त्री संसार की बातों की चिन्ता करती है कि वह अपने पति को कैसे प्रसन्न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अविवाहित स्त्री और कुँवारी प्रभु की बातों की चिन्ता करती हैं।” यूनानी वाक्य को अविवाहित स्त्री और कुँवारी—दो अलग श्रेणियों की सूची के रूप में भी पढ़ा जा सकता है, न कि कुँवारी को अविवाहित स्त्री का स्पष्टीकरण मानकर।
    reason: alternative_reading
lexical_decisions:
- source_word: μεμέρισται
  choice: उसके हित बँटे हुए हैं
  rationale: पूर्णकालिक कर्मवाच्य के परिणामस्वरूप बने रहने वाले भाव और बँटे हुए सरोकारों के रूपक को रखता है; हिन्दी में केवल ‘वह बँटी हुई है’ की अपेक्षा आशय अधिक स्वाभाविक ढंग से स्पष्ट होता है।
- source_word: γυνὴ ἡ ἄγαμος
  choice: अविवाहित स्त्री
  rationale: विवाहित स्त्री से स्पष्ट विरोध बनाए रखते हुए γυνή को यहाँ स्वाभाविक रूप से ‘स्त्री’ और ἄγαμος को ‘अविवाहित’ प्रस्तुत करता है।
- source_word: παρθένος
  choice: कुँवारी
  rationale: यूनानी शब्द की विवाहेतर यौन-अनुभव से जुड़ी विशिष्टता को बनाए रखता है; ‘युवती’ इस अर्थ को अनावश्यक रूप से सामान्य कर देता।
- source_word: μεριμνᾷ
  choice: चिन्ता करती है
  rationale: यहाँ इसका अर्थ ध्यान और सरोकार रखना है, अनिवार्यतः पापपूर्ण व्याकुलता नहीं; प्रसंग में प्रचलित हिन्दी पदावली के साथ स्वाभाविक है।
- source_word: τὰ τοῦ κυρίου
  choice: प्रभु की बातें
  rationale: प्रभु से संबंधित विषयों और हितों का व्यापक अर्थ रखता है तथा अगले वाक्यांश ‘संसार की बातें’ के साथ समानांतरता बनाए रखता है।
- source_word: ἵνα ᾖ ἁγία
  choice: ताकि वह ... पवित्र हो
  rationale: ἵνα के उद्देश्य अथवा परिणाम के भाव और ἁγία की स्पष्ट पवित्रता-संबंधी भाषा दोनों को सुरक्षित रखता है।
- source_word: τῷ σώματι καὶ τῷ πνεύματι
  choice: शरीर और आत्मा—दोनों में
  rationale: दोनों क्षेत्रों या पहलुओं में पवित्रता का भाव व्यक्त करता है, बिना किसी विस्तृत मानवशास्त्रीय निष्कर्ष को आरोपित किए।
- source_word: ἡ δὲ γαμήσασα
  choice: परन्तु विवाहित स्त्री
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त को सहज हिन्दी में विवाहित अवस्था के रूप में प्रस्तुत करता और पिछले विषय से विरोध स्पष्ट करता है।
- source_word: τὰ τοῦ κόσμου
  choice: संसार की बातें
  rationale: ‘प्रभु की बातें’ के साथ संरचनात्मक समानांतरता रखता है और इस प्रसंग में आवश्यकता से अधिक नकारात्मक नैतिक अर्थ नहीं जोड़ता।
- source_word: πῶς ἀρέσῃ τῷ ἀνδρί
  choice: कि वह अपने पति को कैसे प्रसन्न करे
  rationale: वैवाहिक प्रसंग में ἀνήρ का अर्थ ‘पति’ है; हिन्दी में चिंता के विषय को स्वाभाविक अप्रत्यक्ष प्रश्न के रूप में व्यक्त करता है।
theological_decisions:
- issue: ἡ γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος को दो अलग श्रेणियाँ माना जाए या समानाधिकरणात्मक स्पष्टीकरण
  choice: 'समानाधिकरणात्मक रूप: ‘अविवाहित स्त्री, अर्थात् कुँवारी’'
  alternative: 'समन्वित रूप: ‘अविवाहित स्त्री और कुँवारी’'
  rationale: एकवचन क्रिया μεριμνᾷ संयुक्त पद को एक विषय के रूप में पढ़ने का समर्थन करती है, पर यूनानी वाक्य-विन्यास दो श्रेणियों की सम्भावना भी खुली रखता है; इसलिए वैकल्पिक पाठ पादटिप्पणी में सुरक्षित है।
- issue: μεμέρισται में विभाजन का विषय
  choice: ‘उसके हित बँटे हुए हैं’ कहकर विभाजित सरोकारों का भाव स्पष्ट किया गया
  alternative: ‘वह बँटी हुई है’
  rationale: मूल का कर्मवाच्य और रूपक सुरक्षित रखते हुए हिन्दी में अस्पष्ट या व्यक्तित्व-विभाजन जैसा अर्थ आने से बचाता है; फिर भी यह पिछले पद से चली आ रही वाक्यगत कठिनाई को पूरी तरह पुनर्व्याख्यायित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘प्रभु’, ‘पवित्र’, ‘शरीर’ और ‘आत्मा’ जैसी स्थापित बाइबलीय शब्दावली रखी गई है। ‘कुँवारी’ मूल की lexical specificity बनाए रखता है। मुख्य पाठ में पादटिप्पणी-चिह्न [a] उपस्थित है।
