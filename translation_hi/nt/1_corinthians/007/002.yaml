- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: अपनी पत्नी
  rationale: विवाह-संबंधी संदर्भ में γυνή का स्वाभाविक अर्थ ‘पत्नी’ है; ἑαυτοῦ का निजवाचक संबंध ‘अपनी’ से व्यक्त होता है।
- source_word: ἐχέτω
  choice: रखे
  rationale: तीसरे पुरुष का वर्तमान आज्ञार्थक रूप सीधे निर्देश देता है। ‘रखे’ मूल के ‘अपने पास/संबंध में रखना’ को बचाता है और ‘विवाह करे’ या ‘वैवाहिक कर्तव्य निभाए’ जैसी व्याख्या नहीं जोड़ता।
- source_word: καὶ ἑκάστη
  choice: और हर स्त्री
  rationale: स्त्रीलिंग वितरणात्मक रूप पहली उपवाक्य-रचना के समानांतर है।
- source_word: τὸν ἴδιον ἄνδρα
  choice: अपना पति
  rationale: विवाह के संदर्भ में ἀνήρ का अर्थ ‘पति’ है, और ἴδιον का बल ‘अपना’ से व्यक्त होता है।
theological_decisions:
- issue: क्या पद को यौन पाप से बचने के लिए विवाह करने की सलाह या वैवाहिक संबंधों के विषय में आदेश के रूप में अधिक स्पष्ट किया जाए
  choice: मूल क्रिया के अनुसार ‘अपनी पत्नी/अपना पति रखे’ कहा गया है।
  alternative: ‘विवाह करे’ या ‘वैवाहिक संबंध निभाए।’
  rationale: यूनानी में विवाह करने अथवा दांपत्य कर्तव्य निभाने की स्पष्ट क्रिया नहीं, बल्कि ἐχέτω (‘रखे/हो’) है। इसलिए व्यापक धर्मवैचारिक निष्कर्ष जोड़े बिना मूल की व्याख्यात्मक खुलावट और तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यौन अनैतिकताओं’ कुछ कम मुहावरेदार होते हुए भी मूल के बहुवचन को जानबूझकर सुरक्षित रखता है; पादटिप्पणी स्वाभाविक एकवचन विकल्प देती है।
