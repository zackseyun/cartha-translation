  choice: लेकिन ... के कारण
  rationale: διά के साथ कर्मकारक कारण व्यक्त करता है, और δέ पिछले कथन से हल्का विरोध या विचार-विकास दिखाता है।
- source_word: τὰς πορνείας
  choice: यौन अनैतिकताओं
  rationale: πορνεία यौन रूप से अनैतिक व्यवहार को दर्शाता है। यूनानी पाठ में बहुवचन है; हिंदी में उसे बनाए रखा गया है, यद्यपि एकवचन अधिक मुहावरेदार हो सकता है।
- source_word: ἕκαστος
