source:
  edition: SBLGNT
  text: Εἰ μὴ ἑκάστῳ ὡς ⸀ἐμέρισεν ὁ ⸀κύριος, ἕκαστον ὡς κέκληκεν ὁ ⸀θεός, οὕτως περιπατείτω· καὶ οὕτως ἐν ταῖς ἐκκλησίαις πάσαις διατάσσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/017.yaml
  text: Only[a], as the Lord has assigned to each one, as God has called each one, so let him walk[b]. And so I direct in all the churches.
translation:
  language: hi
  text: फिर भी, प्रभु ने हर एक को जैसा भाग दिया है[a] और परमेश्वर ने हर एक को जैसा बुलाया है, वह उसी के अनुसार चले[b]। मैं सभी कलीसियाओं में ऐसा ही निर्देश देता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाँटा है,’ ‘ठहराया है’ अथवा ‘हिस्सा दिया है।’ यूनानी क्रिया उस बात का उल्लेख कर सकती है जो प्रभु ने प्रत्येक व्यक्ति को बाँटी या सौंपी है।
    reason: lexical_alternative
  - marker: b
    text: ‘चलना’ यहाँ जीवन जीने और आचरण करने का बाइबलीय रूपक है; अनुवाद ‘जीवन बिताए’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μὴ
  choice: केवल इतना कि
  rationale: यहाँ पदबंध कड़ी शर्त के बजाय पिछले विचार के बाद एक नियंत्रक सिद्धान्त प्रस्तुत करता है। ‘केवल इतना कि’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके सीमितकारी और संक्रमणसूचक बल को बनाए रखता है।
- source_word: ἑκάστῳ / ἕκαστον
  choice: हर एक
  rationale: दोनों बार ‘हर एक’ रखने से यूनानी पाठ की पुनरावृत्ति और प्रत्येक व्यक्ति पर लागू होने वाला भाव सुरक्षित रहता है।
- source_word: ἐμέρισεν
  choice: भाग दिया है
  rationale: यह चयन किसी व्यक्ति को प्रभु द्वारा बाँटे या ठहराए गए हिस्से अथवा जीवन-परिस्थिति का संकेत देता है, पर उसके स्वरूप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: κέκληκεν
  choice: बुलाया है
  rationale: पूर्णकालिक क्रिया के पूर्ण हुए और वर्तमान में प्रभावी बुलावे को ‘बुलाया है’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: περιπατείτω
  choice: वह उसी के अनुसार चले
  rationale: ‘चले’ जीवन-व्यवहार के लिए प्रयुक्त बाइबलीय रूपक को बनाए रखता है; ‘उसी के अनुसार’ दोनों समानान्तर कथनों से जुड़े οὕτως का स्वाभाविक हिन्दी रूप है।
- source_word: διατάσσομαι
  choice: मैं ... निर्देश देता हूँ
  rationale: यह पौलुस के अधिकारपूर्ण निर्देश को व्यक्त करता है, पर ‘आज्ञा देता हूँ’ की अपेक्षा स्वर को अनावश्यक रूप से कठोर नहीं बनाता।
- source_word: ἐν ταῖς ἐκκλησίαις πάσαις
  choice: सभी कलीसियाओं में
  rationale: पौलुस के सन्दर्भ में स्थानीय मसीही समुदायों के लिए ‘कलीसियाएँ’ स्पष्ट और प्रचलित शब्द है।
theological_decisions:
- issue: ‘प्रभु’ और ‘परमेश्वर’ के बीच सन्दर्भगत भेद
  choice: 'दोनों उपाधियों को अलग-अलग रखा गया है: ‘प्रभु ने ... भाग दिया’ और ‘परमेश्वर ने ... बुलाया।’'
  alternative: दोनों को एक ही ईश्वरीय सन्दर्भ की शैलीगत पुनरावृत्ति मानकर एक उपाधि में मिला देना।
  rationale: यूनानी पाठ समानान्तर वाक्यांशों में दो भिन्न उपाधियाँ रखता है। अनुवाद उस भेद और सम्भावित धर्मवैज्ञानिक तनाव को बिना सामंजस्य बैठाए सुरक्षित रखता है।
- issue: περιπατείτω में जीवन-व्यवहार का रूपक
  choice: ‘चले’ के द्वारा रूपक सुरक्षित रखा गया है।
  alternative: इसे स्पष्ट करके ‘जीवन बिताए’ या ‘आचरण करे’ कहना।
  rationale: ‘चलना’ हिन्दी बाइबल की भाषा में समझ में आने वाला जीवन-रूपक है और मूल अभिव्यक्ति की व्यापकता को बनाए रखता है।
- issue: बुलावे और दिए गए भाग का सम्बन्ध
  choice: दोनों कथनों को समानान्तर रखा गया है और ‘बुलाया’ में ‘जिस दशा में’ नहीं जोड़ा गया।
  alternative: ‘जिस दशा में बुलाया गया था’ कहकर बुलावे को स्पष्टतः सामाजिक या वैवाहिक परिस्थिति से जोड़ना।
  rationale: सन्दर्भ ऐसी व्याख्या का समर्थन कर सकता है, पर यूनानी पद में ‘दशा’ स्पष्ट नहीं है। इसलिए अनुवाद मूल की सम्भावित व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘हर एक’ की पुनरावृत्ति मूल के वितरणात्मक बल को बनाए रखती है। ‘केवल इतना कि’ पद को हिन्दी में वाक्यगत रूप से स्वाभाविक बनाता है, और अंतिम वाक्य καὶ οὕτως की निकटता से ‘ऐसा ही’ कहता है।
