source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω κατὰ συγγνώμην, οὐ κατ’ ἐπιταγήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/006.yaml
  text: But I say this as a concession[a], not as a command.
translation:
  language: hi
  text: परन्तु मैं यह बात अनुमति के रूप में कहता हूँ[a], आज्ञा के रूप में नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छूट के रूप में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: यह बात
  rationale: यह संकेतवाचक पद निकटवर्ती कथन की ओर संकेत करता है। ‘यह बात’ स्वाभाविक है और यह अनावश्यक रूप से तय नहीं करता कि संकेत केवल पिछले कथन की ओर है या आगे के कथन की ओर।
- source_word: δὲ
  choice: परन्तु
  rationale: δέ यहाँ हल्का विरोध अथवा संक्रमण दिखाता है; ‘परन्तु’ अनुमति और आज्ञा के बीच आने वाले स्पष्ट भेद को व्यक्त करता है।
- source_word: λέγω
  choice: मैं ... कहता हूँ
  rationale: यूनानी वर्तमानकालीन क्रिया का यह स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: κατὰ συγγνώμην
  choice: अनुमति के रूप में
  rationale: इस प्रसंग में पदबंध अनिवार्य आदेश के विपरीत दी गई छूट या अनुमति बताता है। आधुनिक हिन्दी में ‘अनुमति के रूप में’ स्पष्ट और सहज है।
- source_word: συγγνώμην
  choice: अनुमति
  rationale: यहाँ शब्द का अर्थ क्षमा नहीं, बल्कि अनुमोदित छूट है। ‘अनुमति’ ἐπιταγή के साथ विरोध को स्पष्ट रखती है।
- source_word: οὐ
  choice: नहीं
  rationale: यह मानक निषेध है।
- source_word: κατ’ ἐπιταγήν
  choice: आज्ञा के रूप में
  rationale: पदबंध अधिकारपूर्ण निर्देश को दर्शाता है और ‘अनुमति के रूप में’ के समानांतर स्वाभाविक विरोध बनाता है।
- source_word: ἐπιταγήν
  choice: आज्ञा
  rationale: ‘आज्ञा’ अधिकारपूर्ण आदेश का dignified और सामान्य हिन्दी रूप है।
theological_decisions:
- issue: क्या पौलुस का कथन व्यक्तिगत अनुमति है या अपेक्षाकृत कम स्तर की ईश्वरीय आज्ञा
  choice: कथन को स्पष्ट रूप से अनुमति के रूप में, बाध्यकारी आज्ञा के रूप में नहीं, प्रस्तुत किया गया है।
  alternative: यह परामर्श प्रत्यक्ष आज्ञा न होते हुए भी प्रेरितीय अधिकार रख सकता है।
  rationale: पद स्वयं अनुमति और आज्ञा में भेद करता है। अनुवाद इस भेद को बनाए रखता है, पर पौलुस के प्रेरितीय अधिकार के व्यापक प्रश्न को पाठ से आगे जाकर हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, संक्षिप्त और गरिमापूर्ण रूप। ‘अनुमति’ सामान्य पाठक के लिए ‘रियायत’ की अपेक्षा अधिक स्पष्ट है; पादटिप्पणी में ‘छूट’ मूल शब्द की वैकल्पिक छाया देती है।
