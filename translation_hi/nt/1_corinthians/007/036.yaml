source:
  edition: SBLGNT
  text: Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/036.yaml
  text: But if anyone thinks he is behaving improperly toward his virgin[a], if she is past her youth and it ought to be so, let him do what he wants; he is not sinning. Let them marry.
translation:
  language: hi
  text: पर यदि कोई समझता है कि वह अपनी कुँवारी[a] के प्रति अनुचित व्यवहार कर रहा है, और यदि वह युवावस्था की सीमा पार कर चुकी है और ऐसा ही होना चाहिए, तो वह जो चाहता है करे; वह पाप नहीं करता। वे विवाह कर लें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी मंगेतर/वाग्दत्ता कुँवारी के प्रति”; परंपरागत रूप से इसका अर्थ “अपनी कुँवारी पुत्री के प्रति” भी समझा गया है। ग्रीक में यह पदबंध अस्पष्ट है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσχημονεῖν
  choice: अनुचित व्यवहार कर रहा है
  rationale: यह क्रिया अशोभनीय या अनुपयुक्त ढंग से व्यवहार करने का भाव देती है। यह चयन नैतिक-सामाजिक अनुचितता व्यक्त करता है, पर अर्थ को अनावश्यक रूप से यौन अश्लीलता तक सीमित नहीं करता।
- source_word: ἐπὶ τὴν παρθένον αὐτοῦ
  choice: अपनी कुँवारी के प्रति
  rationale: παρθένος का मूल अर्थ ‘कुँवारी’ है। αὐτοῦ के संबंध की पहचान यहाँ अस्पष्ट है; यह मंगेतर अथवा पुत्री/संरक्षण में रहने वाली कुँवारी की ओर संकेत कर सकता है। मुख्य पाठ में संक्षिप्त पदबंध और पादटिप्पणी इस अस्पष्टता को बनाए रखते हैं।
- source_word: ὑπέρακμος
  choice: उसकी युवावस्था बीत रही है
  rationale: शब्द युवावस्था की परिपक्व अवस्था या उसके चरम से आगे निकलने का संकेत देता है। हिंदी में यह अभिव्यक्ति स्वाभाविक है और कोई निश्चित आधुनिक विवाह-योग्य आयु आरोपित नहीं करती।
- source_word: καὶ οὕτως ὀφείλει γίνεσθαι
  choice: और ऐसा ही होना चाहिए
  rationale: ὀφείλει आवश्यकता या दायित्व व्यक्त करता है, जबकि γίνεσθαι सामान्य रूप से होने/घटित होने का अर्थ देता है। अनुवाद मूल की सामान्यता बनाए रखता है।
- source_word: ὃ θέλει ποιείτω
  choice: वह जो चाहता है करे
  rationale: यह अनुमति देने वाला तृतीय पुरुष आदेश है; हिंदी वाक्य इसकी सीधी और स्वाभाविक आज्ञार्थक शक्ति बनाए रखता है।
- source_word: οὐχ ἁμαρτάνει
  choice: वह पाप नहीं करता
  rationale: वर्तमान काल के कथन को स्वाभाविक हिंदी में रखते हुए यह स्पष्ट किया गया है कि वर्णित कार्य पाप नहीं है।
- source_word: γαμείτωσαν
  choice: वे विवाह कर लें
  rationale: बहुवचन तृतीय पुरुष आदेश दोनों पक्षों के विवाह करने को कहता है। ‘विवाह कर लें’ आधुनिक हिंदी में अनुमति-सहित आदेश का स्वाभाविक रूप है।
theological_decisions:
- issue: ‘अपनी कुँवारी’ (παρθένον αὐτοῦ) की पहचान
  choice: मुख्य पाठ में ‘अपनी कुँवारी’ रखकर ग्रीक की अस्पष्टता सुरक्षित रखी गई है।
  alternative: इसे ‘अपनी मंगेतर/वाग्दत्ता कुँवारी’ या ‘अपनी कुँवारी पुत्री’ समझा जा सकता है।
  rationale: ग्रीक पदबंध संबंध को स्पष्ट नहीं करता, और प्रसंग की व्याख्या परंपरागत रूप से दोनों प्रकार हुई है। किसी एक व्याख्या को मुख्य पाठ में निर्णायक बनाना स्रोत की वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। ‘कुँवारी’ जानबूझकर संज्ञा के रूप में रखा गया है ताकि स्रोत की संबंधगत अस्पष्टता पादटिप्पणी सहित बनी रहे।
