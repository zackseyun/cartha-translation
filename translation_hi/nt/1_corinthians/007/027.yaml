base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/027.yaml
  text: Are you bound to a wife? Do not seek release[a]. Are you released from a wife? Do not seek a wife.
translation:
  language: hi
  text: क्या तुम पत्नी से बँधे हो? छुटकारा मत खोजो।[a] क्या तुम पत्नी से मुक्त हो? पत्नी मत खोजो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक व्याख्यात्मक रूप में: “क्या तुम विवाहित हो? तलाक मत लो। क्या तुम तलाकशुदा हो? पत्नी मत खोजो।” यूनानी में अधिक शाब्दिक रूप से “बँधे” और “मुक्त” होने की बात है।'
    reason: alternative_reading
lexical_decisions:
- source_word: δέδεσαι
  choice: बँधे हो
  rationale: पूर्णकालिक रूप की वर्तमान परिणति और बाँधने के रूपक को बनाए रखता है तथा λύσιν/λέλυσαι के साथ विरोध-साम्य स्पष्ट करता है।
- source_word: γυναικί
  choice: पत्नी से
  rationale: वैवाहिक संदर्भ में γυνή का अर्थ ‘पत्नी’ है; हिन्दी में ‘से बँधे’ स्वाभाविक प्रयोग है।
- source_word: ζήτει
  choice: पाने की कोशिश करो
  rationale: ζητέω के सक्रिय प्रयास के भाव को साधारण आधुनिक हिन्दी में व्यक्त करता है; दोनों आज्ञाओं में समान संरचना रखी गई है।
- source_word: λύσιν
  choice: छुटकारा
  rationale: ‘खोले जाने/मुक्ति’ का भाव रखता है और सीधे ‘तलाक’ कहकर यूनानी से अधिक संकीर्ण अर्थ निर्धारित नहीं करता।
- source_word: λέλυσαι
  choice: मुक्त हो
  rationale: पूर्णकालिक रूप की वर्तमान अवस्था को व्यक्त करता है और बँधे होने के समांतर मुक्ति की छवि बनाए रखता है।
- source_word: ἀπὸ γυναικός
  choice: पत्नी से
  rationale: ἀπό के अलगाव के भाव और वैवाहिक संदर्भ में γυνή के ‘पत्नी’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γυναῖκα
  choice: पत्नी
  rationale: अंतिम निषेध विवाह करने के विषय में है, इसलिए ‘पत्नी’ ‘स्त्री’ से अधिक सटीक है।
theological_decisions:
- issue: क्या पद को स्पष्ट वैवाहिक कानूनी शब्दों (‘विवाहित/तलाकशुदा’) में प्रस्तुत किया जाए या बाँधने और मुक्त होने की पौलुस की छवि रखी जाए?
  choice: मुख्य पाठ में ‘बँधे’, ‘छुटकारा’ और ‘मुक्त’ की छवि रखी गई है।
  alternative: क्या तुम विवाहित हो? तलाक लेने की कोशिश न करो। क्या तुम्हारा तलाक हो चुका है? पत्नी पाने की कोशिश न करो।
  rationale: यूनानी पाठ विवाह और तलाक के अधिक स्पष्ट शब्दों के बजाय δέω/λύω शब्द-समूह का उपयोग करता है। यह चयन असली अस्पष्टता को बनाए रखता है और अर्थ को केवल तलाक तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘पत्नी से बँधे’ तथा ‘पत्नी से मुक्त’ मूल रूपक को रखते हैं; पादटिप्पणी संभावित वैवाहिक व्याख्या स्पष्ट करती है, पर ‘मुक्त’ को अनिवार्य रूप से केवल तलाक नहीं मानती।
