source:
  edition: SBLGNT
  text: τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν ⸀σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ ⸀εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/035.yaml
  text: I say this for your own benefit, not to put a noose on you, but for what is proper and for undistracted devotion to the Lord.
translation:
  language: hi
  text: मैं यह तुम्हारे अपने ही भले के लिए कहता हूँ—तुम पर फंदा डालने के लिए नहीं, बल्कि उचित आचरण और बिना ध्यान भटके प्रभु की सेवा के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφορον
  choice: भले
  rationale: यहाँ शब्द का अर्थ पाठकों के अपने लाभ या हित से है; ‘भले’ सहज और व्यापक हिंदी अभिव्यक्ति है।
- source_word: βρόχον
  choice: फंदा
  rationale: यूनानी शब्द का ठोस अर्थ फंदा है और प्रसंग में बाध्यकारी रोक का रूपक है; रूपक को बनाए रखा गया है।
- source_word: εὔσχημον
  choice: उचित आचरण
  rationale: यह शब्द शालीन, शोभनीय या उचित व्यवहार की ओर संकेत करता है; ‘उचित आचरण’ प्रसंग में स्वाभाविक है।
- source_word: εὐπάρεδρον
  choice: के प्रति समर्पित रहो
  rationale: यह दुर्लभ शब्द प्रभु के पास निरंतर उपस्थित रहने या स्थिर भक्ति का भाव देता है; हिंदी में संबंध और निरंतरता को स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ἀπερισπάστως
  choice: बिना ध्यान भटके
  rationale: क्रियाविशेषण का अर्थ बिना विकर्षण या खिंचाव के है; यह सरल आधुनिक हिंदी में उसी भाव को रखता है।
theological_decisions:
- issue: पौलुस की सलाह का बाध्यकारी स्वर
  choice: ‘तुम पर फंदा डालने के लिए नहीं’ द्वारा गैर-बाध्यकारी उद्देश्य स्पष्ट रखा गया
  alternative: ‘तुम्हें रोकने के लिए नहीं’
  rationale: मूल पाठ का तीखा रूपक बनाए रखने से यह स्पष्ट रहता है कि पौलुस विवेकपूर्ण हित की बात कर रहा है, कोई धार्मिक बंधन नहीं लगा रहा।
- issue: εὐπάρεδρον τῷ κυρίῳ का अर्थ
  choice: प्रभु के प्रति समर्पित रहना
  alternative: प्रभु के पास निरंतर उपस्थित रहना
  rationale: समर्पण का अनुवाद भक्ति-संबंधी आशय को स्वाभाविक हिंदी में देता है, जबकि ‘प्रति’ मूल के संबंध को बनाए रखता है; किसी विशेष धार्मिक व्यवस्था को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य को प्राकृतिक हिंदी उद्देश्य-रचना में ढाला गया है और ‘फंदा’ रूपक सुरक्षित रखा गया है।
