id: 1CO.7.32
reference: 1 Corinthians 7:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Θέλω δὲ ὑμᾶς ἀμερίμνους εἶναι. ὁ ἄγαμος μεριμνᾷ τὰ τοῦ κυρίου, πῶς ⸀ἀρέσῃ τῷ κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/032.yaml
  text: But I want you to be free from anxieties. The unmarried man is concerned with the things of the Lord[a], how he may please the Lord;
translation:
  language: hi
  text: पर मैं चाहता हूँ कि तुम चिंताओं से मुक्त रहो। अविवाहित पुरुष प्रभु की बातों की चिंता करता है[a] कि वह प्रभु को कैसे प्रसन्न करे;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अविवाहित व्यक्ति।” यूनानी में यहाँ पुल्लिंग एकवचन (“अविवाहित पुरुष”) है, हालाँकि आसपास के प्रसंग में पौलुस अविवाहित और विवाहित स्त्री-पुरुषों की अवस्थाओं पर अधिक व्यापक रूप से चर्चा करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω δὲ
  choice: पर मैं चाहता हूँ
  rationale: θέλω इच्छा को सीधे व्यक्त करता है। δέ पिछले कथन से हल्का विरोध अथवा संक्रमण दिखाता है; यहाँ ‘पर’ स्वाभाविक है।
- source_word: ὑμᾶς ἀμερίμνους εἶναι
  choice: कि तुम चिंताओं से मुक्त रहो
  rationale: ἀμέριμνος का अर्थ चिंता या व्याकुल करने वाली फिक्र से मुक्त होना है; यह अनासक्ति का अर्थ नहीं देता।
- source_word: ὁ ἄγαμος
  choice: अविवाहित पुरुष
  rationale: यूनानी पद निश्चित लेख सहित पुल्लिंग एकवचन है। निकटवर्ती पदों में पौलुस पुरुष और स्त्री की स्थितियों का अलग-अलग उल्लेख करता है, इसलिए मुख्य पाठ में व्याकरणिक लिंग सुरक्षित रखा गया है।
- source_word: μεριμνᾷ
  choice: चिंता करता है
  rationale: क्रिया का अर्थ किसी बात की चिंता या परवाह करना है। यहाँ विषय प्रभु की बातें हैं, इसलिए इसका भाव सकारात्मक सरोकार का है, यद्यपि ἀμέριμνος के साथ शब्दगत संबंध भी बना रहता है।
- source_word: τὰ τοῦ κυρίου
  choice: प्रभु की बातें
  rationale: यह व्यापक यूनानी मुहावरा प्रभु से संबंधित बातों या कार्यों को सूचित करता है; ‘प्रभु की बातें’ इसकी व्यापकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κυρίου / κυρίῳ
  choice: प्रभु
  rationale: κύριος के लिए ‘प्रभु’ मानक नए नियम का सम्मानसूचक और धर्मवैचारिक रूप है।
- source_word: πῶς ἀρέσῃ τῷ κυρίῳ
  choice: कि वह प्रभु को कैसे प्रसन्न करे
  rationale: πῶς रीति अथवा लक्ष्य बताता है और ἀρέσῃ का संभावनात्मक क्रियारूप हिन्दी में ‘कैसे ... करे’ से स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: अविवाहित और विवाहित अवस्थाओं के विरोध में पुल्लिंग एकवचन
  choice: मुख्य पाठ में ‘अविवाहित पुरुष’ रखकर पुल्लिंग एकवचन सुरक्षित रखा गया है।
  alternative: ‘अविवाहित व्यक्ति’ या ‘जो अविवाहित है’
  rationale: मूल यूनानी रूप पुल्लिंग एकवचन है और अगले पदों में पुरुष तथा स्त्री के मामलों का अलग उल्लेख है। फिर भी व्यापक प्रसंग दोनों अवस्थाओं और दोनों लिंगों पर विचार करता है; इस बात को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली अपनाई गई है। ‘चिंताओं से मुक्त’ और ‘चिंता करता है’ द्वारा ἀμέριμνος/μεριμνᾷ का जानबूझकर किया गया शब्दगत संबंध सुरक्षित है; संदर्भ इनके नकारात्मक और सकारात्मक भावों में अंतर स्पष्ट करता है।
