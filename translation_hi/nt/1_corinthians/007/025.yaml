source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν παρθένων ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/025.yaml
  text: Concerning virgins[a], I have no command from the Lord[c][b], but I give my judgment as one who by the Lord’s mercy is trustworthy.
translation:
  language: hi
  text: कुँवारियों[a] के विषय में मुझे प्रभु की कोई आज्ञा नहीं मिली है; पर मैं ऐसे व्यक्ति के रूप में अपनी सम्मति[b] देता हूँ, जिस पर प्रभु ने दया की है कि वह विश्वासयोग्य[c] हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अविवाहित स्त्रियों”; संदर्भ की कुछ व्याख्याओं में “कुँवारी बेटियों।” यूनानी में शाब्दिक रूप से “कुँवारियों” है।
    reason: lexical_alternative
  - marker: b
    text: या “अपना विचार” अथवा “अपना परामर्श।” पौलुस यहाँ अपनी विचारपूर्ण सम्मति को प्रभु की प्रत्यक्ष “आज्ञा” से अलग करता है।
    reason: alternative_reading
  - marker: c
    text: या “निष्ठावान।” यूनानी शब्द का अर्थ “विश्वासयोग्य/भरोसेमंद” या “निष्ठावान” हो सकता है; यहाँ संभवतः भाव यह है कि प्रभु की दया से पौलुस भरोसेमंद मार्गदर्शक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: के विषय में
  rationale: यह पौलुस के विषय-परिवर्तन का सामान्य सूत्र है। हिंदी में ‘के विषय में’ स्वाभाविक रूप से नया विषय प्रस्तुत करता है; अलग से कालवाचक ‘अब’ जोड़ना आवश्यक नहीं।
- source_word: τῶν παρθένων
  choice: कुँवारियों
  rationale: παρθένος का मूल अर्थ ऐसे व्यक्ति, विशेषतः युवती, से है जिसने विवाह या यौन-संबंध नहीं किया हो। संदर्भ में निश्चित अभिप्राय विवादित होने के कारण मुख्य पाठ में अपेक्षाकृत सीधा शब्द रखा गया है।
- source_word: ἐπιταγὴν κυρίου
  choice: प्रभु की कोई आज्ञा
  rationale: ἐπιταγή आदेश या आधिकारिक निर्देश को व्यक्त करता है। संबंधवाचक यूनानी रचना हिंदी में ‘प्रभु की आज्ञा’ के रूप में स्वाभाविक है और स्रोत अथवा अधिकार—दोनों की संभावित छाया बनाए रखती है।
- source_word: γνώμην
  choice: अपनी सम्मति
  rationale: γνώμη विचारपूर्वक बने मत, निर्णय या परामर्श को सूचित कर सकता है। ‘सम्मति’ इसे निजी और हल्की राय तक सीमित किए बिना प्रत्यक्ष प्रभु-आज्ञा से इसका अंतर बनाए रखती है।
- source_word: δίδωμι
  choice: देता हूँ
  rationale: वर्तमानकालीन क्रिया का सीधा और स्वाभाविक हिंदी रूप।
- source_word: ὡς
  choice: ऐसे व्यक्ति के रूप में
  rationale: यह उस हैसियत को प्रस्तुत करता है जिसमें पौलुस अपनी सम्मति देता है और निहित प्रथम-पुरुष संदर्भ को हिंदी में स्पष्ट करता है।
- source_word: ἠλεημένος ὑπὸ κυρίου
  choice: जिसे प्रभु की दया से ... माना गया है
  rationale: पूर्ण निष्क्रिय कृदंत प्रभु से दया पाए होने की स्थायी अवस्था बताता है। ‘प्रभु की दया से’ इस बात को बनाए रखता है कि पौलुस की विश्वसनीय हैसियत उसकी अपनी उपलब्धि नहीं, प्रभु की दया का फल है।
- source_word: πιστὸς εἶναι
  choice: विश्वासयोग्य माना गया है
  rationale: πιστός का अर्थ ‘विश्वासयोग्य/भरोसेमंद’ अथवा ‘विश्वासी/निष्ठावान’ हो सकता है। यहाँ पौलुस अपनी सम्मति की विश्वसनीयता का आधार बता रहा है, इसलिए ‘विश्वासयोग्य’ उपयुक्त है; ‘माना गया है’ εἶναι के साथ कृदंत की अभिव्यक्ति को सहज हिंदी देता है, बिना यह कहे कि कोई औपचारिक मान्यता हुई।
theological_decisions:
- issue: प्रत्यक्ष प्रभु-आज्ञा और पौलुस की सम्मति के बीच संबंध
  choice: पाठ स्पष्ट करता है कि इस विषय में पौलुस के पास प्रभु की कोई प्रत्यक्ष आज्ञा नहीं है, फिर भी वह प्रभु की दया से विश्वासयोग्य व्यक्ति के रूप में विचारपूर्ण सम्मति देता है।
  alternative: इसे या तो अधिकारहीन निजी राय मानना, या प्रभु की किसी अज्ञात प्रत्यक्ष आज्ञा के समान प्रस्तुत करना।
  rationale: ἐπιταγή और γνώμη का विरोध वास्तविक भेद रखता है, जबकि ἠλεημένος ... πιστός पौलुस की सम्मति की विश्वसनीय हैसियत भी बनाए रखता है। अनुवाद इस तनाव को न घटाता है, न बढ़ाता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘कुँवारियों’ मूल की अस्पष्टता को यथासंभव रखता है; ‘सम्मति’ विचारपूर्ण निर्णय और प्रत्यक्ष आज्ञा के अंतर को स्वाभाविक हिंदी में व्यक्त करता है।
