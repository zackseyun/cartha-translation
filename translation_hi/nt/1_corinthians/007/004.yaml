source:
  edition: SBLGNT
  text: ἡ γυνὴ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ὁ ἀνήρ· ὁμοίως δὲ καὶ ὁ ἀνὴρ τοῦ ἰδίου σώματος οὐκ ἐξουσιάζει ἀλλὰ ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/004.yaml
  text: The wife does not have authority over her own body[a], but the husband does; likewise also the husband does not have authority over his own body, but the wife does.
translation:
  language: hi
  text: पत्नी को अपने शरीर पर[a] अधिकार नहीं है, बल्कि उसके शरीर पर उसके पति का अधिकार है; उसी प्रकार पति को भी अपने शरीर पर अधिकार नहीं है, बल्कि उसके शरीर पर उसकी पत्नी का अधिकार है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अधिकार का प्रयोग करती है।” यूनानी क्रिया का अर्थ अधिकार रखना या उसका प्रयोग करना हो सकता है; यहाँ आशय दाम्पत्य में पारस्परिक अधिकार है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: पत्नी
  rationale: विवाह और पारस्परिक दाम्पत्य दायित्वों के इस संदर्भ में γυνή का अर्थ सामान्यतः ‘स्त्री’ नहीं, बल्कि विशेष रूप से ‘पत्नी’ है।
- source_word: ὁ ἀνήρ
  choice: पति
  rationale: γυνή के साथ वैवाहिक संदर्भ में प्रयुक्त ἀνήρ का सटीक अर्थ ‘पति’ है, न कि व्यापक ‘पुरुष’।
- source_word: τοῦ ἰδίου σώματος
  choice: अपने शरीर पर
  rationale: ἴδιος व्यक्ति के अपने होने पर बल देता है; ‘अपने शरीर’ इस स्वत्वसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐξουσιάζει
  choice: अधिकार होता
  rationale: क्रिया अधिकार रखने या उसका प्रयोग करने का अर्थ दे सकती है। ‘अधिकार होता’ यहाँ दोनों पति-पत्नी के समानांतर और पारस्परिक संबंध को सीधे व्यक्त करता है, बिना नियंत्रण या बलप्रयोग का अतिरिक्त भाव जोड़े।
- source_word: ἀλλά
  choice: बल्कि
  rationale: ἀλλά तीखा विरोध दिखाता है—अपने अधिकार के विपरीत दूसरे जीवनसाथी का अधिकार; ‘बल्कि’ हिन्दी में इस सुधारात्मक विरोध को स्पष्ट रखता है।
- source_word: ὁμοίως δὲ καὶ
  choice: उसी प्रकार ... भी
  rationale: यह दूसरे कथन को पहले का ठीक समानांतर बनाकर पारस्परिकता पर बल देता है; हिन्दी में ‘उसी प्रकार ... भी’ स्वाभाविक रूप से यह समरूपता बनाए रखता है।
theological_decisions:
- issue: दाम्पत्य अधिकार की प्रकृति
  choice: कथन को पति-पत्नी के पारस्परिक अधिकार के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल ‘शरीर स्वयं का नहीं है’ अथवा अधिक प्रबल रूप में ‘दूसरा जीवनसाथी शरीर को नियंत्रित करता है’ कहना।
  rationale: 'यूनानी पाठ दोनों दिशाओं में एक जैसी संरचना रखता है: पत्नी के विषय में कही बात उसी प्रकार पति के विषय में भी कही गई है। इसलिए अनुवाद इस पारस्परिकता को बनाए रखता है और न तो एकतरफा पदानुक्रम जोड़ता है, न अधिकार को केवल स्वामित्व की ढीली धारणा में बदलता है।'
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज वाक्य-विन्यास। ‘दाम्पत्य’ जैसे व्याख्यात्मक शब्द मुख्य पाठ में नहीं जोड़े गए; यूनानी की संतुलित समानांतर संरचना को ‘उसी प्रकार ... भी’ से सुरक्षित रखा गया है।
