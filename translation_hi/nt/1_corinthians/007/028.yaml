source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ⸀γαμήσῃς, οὐχ ἥμαρτες. καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/028.yaml
  text: But even if you marry[a], you have not sinned; and if the virgin marries, she has not sinned. Yet such people will have tribulation in the flesh[b], and I am sparing you.
translation:
  language: hi
  text: पर यदि तुम विवाह कर भी लो, तो तुमने पाप नहीं किया; और यदि कुँवारी विवाह करे, तो उसने पाप नहीं किया। फिर भी ऐसे लोगों को देह में क्लेश होगा,[a] पर मैं तुम्हें बचाना चाहता हूँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, देहधारी या सांसारिक जीवन में दुःख और कठिनाइयाँ। यहाँ इसका अर्थ ‘पापी स्वभाव’ नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या, “पर मैं तुम्हें बचा रहा हूँ” या “मैं तुम्हें बख्शता हूँ।” पौलुस ऐसी कठिनाइयों के विषय में चेतावनी देकर अपनी पासबानी की मंशा बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γαμήσῃς
  choice: तुम विवाह कर भी लो
  rationale: ἐάν के साथ अओरिस्ट सब्जंक्टिव भविष्य की वास्तविक संभावना व्यक्त करता है। ‘विवाह कर भी लो’ δὲ καί के रियायती भाव और शर्त—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἥμαρτες / ἥμαρτεν
  choice: तुमने पाप नहीं किया / उसने पाप नहीं किया
  rationale: अओरिस्ट इंडिकेटिव इस बात का निषेध करता है कि विवाह का कार्य पाप है। हिन्दी का पूर्ण भूतकाल इस नैतिक आकलन को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἡ παρθένος
  choice: कुँवारी
  rationale: παρθένος का मूल अर्थ ‘कुँवारी’ है। इसे केवल ‘अविवाहित स्त्री’ बनाकर व्यापक करने के बजाय मूल का यौन और वैवाहिक आशय बनाए रखा गया है।
- source_word: θλῖψιν
  choice: क्लेश
  rationale: θλῖψις दबाव, दुःख या कठिनाई का बोध करा सकता है। ‘क्लेश’ गंभीरता बनाए रखता है, पर अपने आप इसे अंतकालीन ‘महाक्लेश’ नहीं बनाता।
- source_word: τῇ σαρκὶ
  choice: देह में
  rationale: σάρξ की ठोस भाषा को सुरक्षित रखा गया है। यहाँ आशय पापी स्वभाव नहीं, बल्कि देहधारी या सांसारिक जीवन में आने वाली कठिनाइयाँ हैं; इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: οἱ τοιοῦτοι
  choice: ऐसे लोगों को
  rationale: यह उन लोगों की ओर सामान्य रूप से संकेत करता है जो विवाह करते हैं। हिन्दी में ‘ऐसे लोगों को’ स्वाभाविक है और यूनानी बहुवचन को बनाए रखता है।
- source_word: φείδομαι
  choice: मैं तुम्हें इससे बचाना चाहता हूँ
  rationale: क्रिया का अर्थ किसी को कष्ट से बचाना या उसके प्रति रियायत करना है। प्रसंग में पौलुस अपनी पासबानी की मंशा बताता है; हिन्दी में इच्छासूचक रूप इस आशय को स्वाभाविक बनाता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: τῇ σαρκί में σάρξ का अर्थ
  choice: देह में—अर्थात देहधारी या सांसारिक जीवन में
  alternative: पापी स्वभाव में
  rationale: प्रसंग मानवीय भ्रष्टता का सिद्धांत नहीं समझा रहा, बल्कि विवाह करने वालों को होने वाली व्यावहारिक कठिनाइयों की चेतावनी देता है। इसलिए ‘देह’ को मुख्य पाठ में रखकर उसका प्रसंगगत अर्थ पादटिप्पणी में समझाया गया है।
- issue: φείδομαι में पौलुस की मंशा और वर्तमान क्रिया
  choice: मैं तुम्हें इससे बचाना चाहता हूँ
  alternative: मैं तुम्हें इससे बचा रहा हूँ
  rationale: यूनानी वर्तमान रूप सीधे ‘मैं तुम्हें बचाता/बचा रहा हूँ’ भी हो सकता है। प्रसंग में चेतावनी देने का उद्देश्य उन्हें कष्ट से बचाना है; हिन्दी में ‘चाहता हूँ’ इस पासबानी की मंशा को सहजता से व्यक्त करता है, और वैकल्पिक अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘कुँवारी’, ‘देह’ और ‘क्लेश’ मूल के प्रमुख शब्दों को निकटता से रखते हैं; पादटिप्पणियाँ संभावित भ्रम दूर करती हैं। वाक्य में रियायती ‘कर भी लो’ और विरोधसूचक ‘फिर भी… पर’ यूनानी तर्क-प्रवाह को स्वाभाविक हिन्दी में व्यक्त करते हैं।
