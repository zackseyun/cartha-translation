id: 1CO.7.39
reference: 1 Corinthians 7:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Γυνὴ ⸀δέδεται ἐφ’ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν ⸀δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/039.yaml
  text: A wife is bound for as long as her husband lives[a]; but if her husband dies, she is free to be married to whom she wishes[b], only in the Lord.
translation:
  language: hi
  text: पत्नी जब तक उसका पति जीवित है, तब तक बंधी हुई है; पर यदि उसका पति सो जाए[a], तो वह जिससे चाहे विवाह करने के लिए स्वतंत्र है—केवल प्रभु में[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, मर जाए। यूनानी में मृत्यु के लिए सामान्य शिष्टोक्ति के रूप में ‘सो जाए’ कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘केवल प्रभु में’ का सामान्य अर्थ है कि विवाह ऐसे व्यक्ति से हो जो प्रभु का है, अर्थात किसी सहविश्वासी से।
    reason: alternative_reading
lexical_decisions:
- source_word: Γυνή
  choice: पत्नी
  rationale: विवाह-संबंधी प्रसंग और ‘उसका पति’ के स्पष्ट उल्लेख के कारण यहाँ सामान्य ‘स्त्री’ के बजाय ‘पत्नी’ उपयुक्त है।
- source_word: δέδεται
  choice: बंधी हुई है
  rationale: पूर्णकालिक कर्मवाच्य रूप वर्तमान में जारी बंधन की अवस्था व्यक्त करता है; यह अनावश्यक रूप से ‘व्यवस्था के द्वारा’ नहीं जोड़ता।
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: जब तक ... जीवित है, तब तक
  rationale: यह अवधि-सूचक यूनानी मुहावरे का स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: उसका पति
  rationale: विवाह के प्रसंग में ἀνήρ का अर्थ ‘पति’ है।
- source_word: κοιμηθῇ
  choice: सो जाए
  rationale: मूल पाठ मृत्यु के लिए ‘सोने’ का शिष्टोक्ति-रूपक रखता है; अर्थ-स्पष्टता के लिए पादटिप्पणी दी गई है।
- source_word: ἐλευθέρα ἐστίν
  choice: स्वतंत्र है
  rationale: यह पहले वैवाहिक बंधन से मुक्त होने को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ᾧ θέλει γαμηθῆναι
  choice: जिससे चाहे विवाह करने के लिए
  rationale: यह नए जीवनसाथी के चुनाव की स्वतंत्रता को व्यक्त करता है; हिन्दी में सक्रिय रूप कर्मवाच्य यूनानी की अपेक्षा अधिक स्वाभाविक है और अर्थ वही रहता है।
- source_word: μόνον ἐν κυρίῳ
  choice: केवल प्रभु में
  rationale: यह पौलुस की संक्षिप्त, धर्मवैचारिक दृष्टि से महत्त्वपूर्ण अभिव्यक्ति और उसके सीमित करने वाले बल को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: पुनर्विवाह के निर्देश में ‘प्रभु में’ का अर्थ
  choice: मुख्य पाठ में ‘केवल प्रभु में’
  alternative: केवल किसी सहविश्वासी से; अथवा प्रभु के प्रति निष्ठा के अनुरूप
  rationale: यूनानी अभिव्यक्ति संक्षिप्त और कुछ हद तक व्याख्या के लिए खुली है। सामान्य समझ पादटिप्पणी में दी गई है, पर मुख्य पाठ किसी एक विस्तृत अर्थ को अनिवार्य नहीं बनाता।
- issue: मृत्यु के लिए शयन-रूपक
  choice: ‘सो जाए’ को मुख्य पाठ में सुरक्षित रखा
  alternative: मर जाए
  rationale: κοιμηθῇ मृत्यु के लिए प्रचलित शिष्टोक्ति है। मूल रूपक को बनाए रखते हुए पादटिप्पणी उसका सीधा आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और स्रोत के निकट है। ‘सो जाए’ मूल रूपक को बचाता है, जबकि ‘केवल प्रभु में’ की अर्थगत संक्षिप्तता को मुख्य पाठ में बरकरार रखा गया है।
