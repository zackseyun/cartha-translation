id: 1CO.7.29
reference: 1 Corinthians 7:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ⸂ἐστίν· τὸ λοιπὸν⸃ ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/029.yaml
  text: 'This is what I mean[a], brothers: the time has been shortened, so that from now on even those who have wives should be as though they had none[b],'
translation:
  language: hi
  text: 'भाइयों,[a] मैं यह कहता हूँ: समय छोटा हो गया है।[b] इसलिए अब से जिनकी पत्नियाँ हैं, वे ऐसे रहें मानो उनकी पत्नियाँ न हों,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयों’ के लिए यूनानी में व्याकरणतः पुल्लिंग बहुवचन शब्द है, जो यहाँ पुरुष और स्त्री—दोनों सहविश्वासियों को संबोधित कर सकता है।
    reason: cultural_note
  - marker: b
    text: या, “नियत समय छोटा हो गया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δέ φημι
  choice: पर ... मैं यह कहता हूँ
  rationale: यूनानी वाक्यांश को स्वाभाविक हिन्दी में रखते हुए δέ के प्रसंगगत संक्रमण और φημι के कथनात्मक बल को सुरक्षित रखा गया है।
- source_word: ἀδελφοί
  choice: हे भाईयो और बहनो
  rationale: ἀδελφοί व्याकरणतः पुल्लिंग बहुवचन है, पर इस पत्र में यह सहविश्वासियों के मिश्रित समुदाय को संबोधित करता है; हिन्दी में समावेशी संबोधन अभिप्रेत श्रोताओं को स्पष्ट करता है।
- source_word: ὁ καιρός
  choice: समय
  rationale: καιρός यहाँ निर्णायक या नियत अवसर/काल को सूचित कर सकता है; मुख्य पाठ में संक्षिप्त और स्वाभाविक 'समय' रखा गया है, जबकि वैकल्पिक सूक्ष्मता पादटिप्पणी में दी गई है।
- source_word: συνεσταλμένος ἐστίν
  choice: संक्षिप्त कर दिया गया है
  rationale: परिप्रयुक्त पूर्णकाल वर्तमान में बनी हुई संकुचित अवस्था दर्शाता है। यह रूप उस परिणामी अवस्था को व्यक्त करता है और कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: τὸ λοιπὸν
  choice: अब से
  rationale: यह शेष समय में आगे के आचरण की ओर संकेत करता है; 'अब से' आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: ἵνα
  choice: अब से,
  rationale: यूनानी पाठ में ἵνα समय के संक्षिप्त होने को आगे दिए जीवन-निर्देश से जोड़ता है। हिन्दी में विराम और 'अब से' द्वारा संबंध स्वाभाविक रखा गया है, बिना इसे केवल उद्देश्य या केवल परिणाम ठहराए।
- source_word: οἱ ἔχοντες γυναῖκας
  choice: जिनकी पत्नियाँ हैं
  rationale: γυναῖκας इस वैवाहिक संदर्भ में विशेषतः 'पत्नियाँ' है; अनिश्चित 'विवाहित लोग' की अपेक्षा यूनानी संरचना से निकटता रखी गई है।
- source_word: ὡς μὴ ἔχοντες
  choice: ऐसे रहें मानो उनकी पत्नियाँ न हों
  rationale: तुलनात्मक अभिव्यक्ति की तीक्ष्णता को बनाए रखते हुए हिन्दी में संदर्भ को स्पष्ट करने के लिए 'पत्नियाँ' दोहराया गया है।
theological_decisions:
- issue: विवाह के विषय में पौलुस के निर्देश का पासबानी और धर्मवैज्ञानिक बल
  choice: 'कथन को उसकी तीक्ष्णता सहित सीधे रूप में रखा गया है: ''ऐसे रहें मानो उनकी पत्नियाँ न हों।'''
  alternative: इसे 'विवाह से अनासक्त रहें' या वैवाहिक उत्तरदायित्व घटाने वाले किसी व्याख्यात्मक भावार्थ में बदलना।
  rationale: पद साधारण सामाजिक स्थितियों को सीमित समय के प्रकाश में सापेक्ष ठहराता है। अनुवाद इस तनाव को बनाए रखता है और न तो वैवाहिक कर्तव्यों के उन्मूलन की व्याख्या जोड़ता है, न अन्यत्र विवाह के सकारात्मक मूल्य के कारण इसे नरम करता है।
- issue: ἵνα का उद्देश्य अथवा परिणाम संबंध
  choice: समय की संक्षिप्तता और आगे के आचरण के बीच संबंध खुला रखा गया है।
  alternative: इसे केवल 'इस उद्देश्य से कि' या केवल 'इस परिणाम से कि' के रूप में निश्चित करना।
  rationale: ἵνα दोनों प्रकार की छाया ग्रहण कर सकता है; विराम-संरचना संबंध को व्यक्त करती है, पर वास्तविक अस्पष्टता को समाप्त नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सहज रूप अपनाया गया है। पद की आकस्मिकता और वैवाहिक कथन की जानबूझकर तीखी तुलना सुरक्षित रखी गई है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
