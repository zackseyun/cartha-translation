translation:
  language: hi
  text: पति अपनी पत्नी के प्रति अपना वैवाहिक कर्तव्य पूरा करे[a], और उसी प्रकार पत्नी भी अपने पति के प्रति अपना वैवाहिक कर्तव्य पूरा करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका देय उसे दे”; अधिक शाब्दिक रूप में, “ऋण/दायित्व अदा करे।” इस संदर्भ में यह पति-पत्नी के एक-दूसरे के प्रति दाम्पत्य दायित्व को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναικί
  choice: पत्नी
  rationale: विवाह-संबंधी निकट प्रसंग में γυνή का अर्थ सामान्यतः ‘स्त्री’ नहीं, बल्कि ‘पत्नी’ है।
- source_word: ἀνήρ / ἀνδρί
  choice: पति
  rationale: पत्नी के साथ समानांतर वैवाहिक संदर्भ में ἀνήρ का आशय ‘पुरुष’ के व्यापक अर्थ के बजाय ‘पति’ है।
- source_word: ὀφειλήν
  choice: वैवाहिक कर्तव्य
  rationale: ὀφειλή मूलतः देय ऋण या दायित्व को दर्शाता है; पद 2 और 4–5 के संदर्भ में यह पति-पत्नी के पारस्परिक दाम्पत्य दायित्व की ओर संकेत करता है। ‘वैवाहिक कर्तव्य’ अर्थ को स्पष्ट करता है, पर उसे अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: ἀποδιδότω
  choice: पूरा करे
  rationale: वर्तमान काल की आज्ञार्थक क्रिया निरंतर दायित्व व्यक्त करती है। हिंदी में कर्तव्य के साथ ‘पूरा करे’ स्वाभाविक है और आज्ञा की शक्ति बनाए रखता है।
- source_word: ὁμοίως δὲ καὶ
  choice: और उसी प्रकार … भी
  rationale: यह पति और पत्नी के दायित्व की पारस्परिक समानता पर बल देते हुए दूसरे उपवाक्य को जोड़ता है।
theological_decisions:
- issue: ὀφειλή द्वारा सूचित वैवाहिक दायित्व को कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘वैवाहिक कर्तव्य’
  alternative: ‘जो उसका हक़ है’; ‘उसके प्रति अपना दायित्व’; ‘दाम्पत्य अधिकार’
  rationale: आसपास का संदर्भ यौन/दाम्पत्य संबंध की ओर संकेत करता है, किंतु संज्ञा स्वयं व्यापक रूप से किसी देय दायित्व को व्यक्त करती है। चुना हुआ रूप संदर्भ स्पष्ट करता है और पति-पत्नी की पारस्परिकता बनाए रखता है, बिना कानूनी या शारीरिक अर्थ को आवश्यकता से अधिक निश्चित किए।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण रूप अपनाया गया है। समानांतर वाक्य-रचना मूल यूनानी पाठ की पारस्परिकता और संतुलन को बनाए रखती है।
