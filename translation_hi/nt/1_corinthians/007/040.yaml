base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/040.yaml
  text: But she is happier if she remains as she is[a], according to my judgment—and I think that I also have the Spirit of God.
translation:
  language: hi
  text: लेकिन मेरे विचार में, यदि वह जैसी है वैसी ही रहे, तो वह अधिक सुखी होगी[a]—और मुझे लगता है कि मुझ में भी परमेश्वर का आत्मा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अधिक धन्य।’ यूनानी तुलनात्मक शब्द μακαριωτέρα अधिक सुख की अवस्था के साथ-साथ अधिक धन्यता भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαριωτέρα
  choice: अधिक सुखी
  rationale: यह μακάριος का तुलनात्मक रूप है। इस व्यावहारिक पास्तरीय परामर्श में ‘अधिक सुखी’ स्वाभाविक हिन्दी है; फिर भी ‘अधिक धन्य’ की सम्भावना पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: ἐὰν οὕτως μείνῃ
  choice: यदि वह जैसी है वैसी ही रहे
  rationale: μένω का अर्थ ‘बने रहना’ है और οὕτως पिछले प्रसंग में वर्णित उसकी वर्तमान, अर्थात् अविवाहित/विधवा, दशा की ओर संकेत करता है; अनुवाद उस दशा को अनावश्यक रूप से स्पष्ट किए बिना संकेत बनाए रखता है।
- source_word: κατὰ τὴν ἐμὴν γνώμην
  choice: मेरे विचार में
  rationale: γνώμη यहाँ सोची-समझी राय या निर्णय है। ‘मेरे विचार में’ आधुनिक हिन्दी में स्वाभाविक है और यह भेद बनाए रखता है कि पौलुस यहाँ अपना विचार दे रहा है।
- source_word: δοκῶ
  choice: मुझे लगता है
  rationale: यह अभिव्यक्ति पौलुस के कथन की विनम्र वाक्शैली को बनाए रखती है, पर उसे केवल अस्थिर अनुमान में नहीं बदलती।
- source_word: κἀγὼ
  choice: मेरे पास भी
  rationale: κἀγώ के योगात्मक बल ‘मैं भी’ को हिन्दी वाक्य-रचना में ‘मेरे पास भी’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: πνεῦμα θεοῦ
  choice: परमेश्वर का आत्मा
  rationale: पौलुसी प्रयोग और इस प्रसंग में यह परमेश्वर के आत्मा का व्यक्तिगत सन्दर्भ है, न कि केवल आध्यात्मिक मनोवृत्ति का।
- source_word: ἔχειν
  choice: पास ... है
  rationale: ἔχω के सीधे अर्थ ‘होना/रखना’ को परमेश्वर के आत्मा के सम्बन्ध में स्वाभाविक हिन्दी ‘मेरे पास ... है’ से व्यक्त किया गया है।
theological_decisions:
- issue: क्या πνεῦμα θεοῦ पवित्र आत्मा को सूचित करता है या सामान्य आध्यात्मिक मनोवृत्ति को
  choice: ‘परमेश्वर का आत्मा’—अर्थात् पवित्र आत्मा
  alternative: परमेश्वर से मिला कोई आत्मिक विवेक या आध्यात्मिक मनोवृत्ति
  rationale: पौलुस के सामान्य प्रयोग में πνεῦμα θεοῦ परमेश्वर के आत्मा को सूचित करता है। यह अनुवाद आत्मा-निर्देशित विचार के दावे को बनाए रखता है, पर इसे प्रभु की प्रत्यक्ष आज्ञा नहीं बनाता।
- issue: δοκῶ ... πνεῦμα θεοῦ ἔχειν में पौलुस के आत्म-सन्दर्भ का बल
  choice: विनम्र वाक्शैली में आत्मा-निर्देशित अधिकार का वास्तविक दावा
  alternative: इस बात पर अनिश्चितता कि उसके पास आत्मा है; या विरोधियों के प्रति व्यंग्य
  rationale: δοκῶ कथन को वाक्शैलीगत नम्रता देता है, पर प्रसंग पौलुस की वास्तविक अनिश्चितता की माँग नहीं करता। ‘मुझे लगता है’ मूल की विनम्रता और उसके दावे—दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट। स्त्रीलिंग सर्वनाम और वर्तमान दशा की ओर संकेत प्रसंग के अनुसार सुरक्षित रखे गए हैं।
