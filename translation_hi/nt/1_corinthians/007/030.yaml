  text: καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/030.yaml
  text: and those who weep as not weeping[a], and those who rejoice as not rejoicing, and those who buy as not possessing,
translation:
  language: hi
  text: और जो रोते हैं, वे ऐसे रहें मानो न रोते हों[a]; और जो आनन्द मनाते हैं, वे ऐसे रहें मानो आनन्द न मनाते हों; और जो खरीदते हैं, वे ऐसे रहें मानो उन्हें अपने पास न रखते हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में तीनों खंडों में बार-बार ‘मानो न’ जैसी रचना है: ‘मानो न रोते हों … मानो आनन्द न मनाते हों … मानो उन्हें अपने पास न रखते हों।’ इसका अर्थ यह नहीं कि ये अनुभव वास्तव में होते ही नहीं, बल्कि यह उनके बीच जीने की रीति बताता है।'
    reason: यूनानी की दोहराई गई ὡς μή रचना और उसके भाव को स्पष्ट करना
lexical_decisions:
- source_word: κλαίοντες
  choice: जो रोते हैं
  rationale: वर्तमान कृदन्त यहाँ संज्ञा की तरह प्रयुक्त है। ‘रोते हैं’ यूनानी क्रिया की ठोस भावात्मक अभिव्यक्ति को बनाए रखता है और ‘शोक करते हैं’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
- source_word: ὡς μὴ κλαίοντες
  choice: ऐसे रहें मानो न रोते हों
  rationale: ὡς μή के साथ कृदन्त वास्तविक रोने का निषेध नहीं, बल्कि जीवन जीने की रीति या दृष्टिकोण व्यक्त करता है। ‘मानो’ स्वाभाविक हिन्दी में यही भाव देता है। ‘रहें’ प्रसंग से पूरित है और उपदेशात्मक आशय स्पष्ट करता है।
- source_word: χαίροντες
  choice: जो आनन्द मनाते हैं
  rationale: χαίρω का यहाँ अर्थ आनन्दित होना या आनन्द मनाना है। यह आधुनिक हिन्दी में सहज है और रोने के साथ भावात्मक समानांतरता बनाए रखता है।
- source_word: ὡς μὴ χαίροντες
  choice: ऐसे रहें मानो आनन्द न मनाते हों
  rationale: पहले खंड की समान यूनानी रचना और उसकी अलंकारिक समानांतरता को हिन्दी में दोहराया गया है।
- source_word: ἀγοράζοντες
  choice: जो खरीदते हैं
  rationale: यह सामान्य आर्थिक लेन-देन में वस्तुएँ मोल लेने को दर्शाता है। ‘खरीदते हैं’ वर्तमान हिन्दी का सीधा और स्वाभाविक रूप है।
- source_word: κατέχοντες
  choice: उनके पास कुछ हो
  rationale: κατέχω के अर्थों में रखना, थामे रखना और अधिकार में रखना शामिल हैं। खरीदने के विपरीत रखे जाने पर यहाँ स्थायी स्वामित्व या कब्जे का भाव है; ‘उनके पास कुछ हो’ इसे सहज हिन्दी में व्यक्त करता है, जबकि निषेध मुख्य वाक्य में ‘न’ से आता है।
- source_word: καὶ
  choice: और / ;
  rationale: आरम्भिक καὶ को ‘और’ से रखा गया है। बाद के समानांतर खंडों को हिन्दी में अर्धविराम से जोड़ा गया है, जिससे संचयी लय बनी रहती है और बार-बार ‘और’ कहने की अस्वाभाविकता से बचा जाता है।
theological_decisions:
- issue: बार-बार आए ὡς μή का व्याख्यात्मक बल
  choice: सांसारिक भावनात्मक और आर्थिक अनुभवों के बीच ऐसी अनासक्त रीति से जीना, मानो वे अंतिम या स्थायी न हों
  alternative: रोने, आनन्द मनाने और खरीदने को अपने आप में अनुचित मानने वाला कठोर तपस्वी अर्थ
  rationale: ὡς μή + कृदन्त इन अनुभवों के घटित होने से इनकार नहीं करता, बल्कि उनके प्रति जीवन-दृष्टि बताता है। निकटवर्ती प्रसंग वर्तमान संकट और संसार के रूप के मिटते जाने की बात करता है; इसलिए अनुवाद वास्तविक अनुभव और युगांत-संबंधी अनासक्ति—दोनों के बीच तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। समानांतर वाक्य-रचना पौलुस की लय को बनाए रखती है। ‘मानो’ संक्षिप्त यूनानी अभिव्यक्ति को स्वाभाविक हिन्दी में प्रस्तुत करता है, और ‘ऐसे रहें’ प्रसंगगत उपदेश को बिना तपस्वी निषेध थोपे स्पष्ट करता है।
