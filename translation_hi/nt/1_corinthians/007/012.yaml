  text: Τοῖς δὲ λοιποῖς ⸂λέγω ἐγώ⸃, οὐχ ὁ κύριος· εἴ τις ἀδελφὸς γυναῖκα ἔχει ἄπιστον, καὶ αὕτη συνευδοκεῖ οἰκεῖν μετ’ αὐτοῦ, μὴ ἀφιέτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/012.yaml
  text: But to the rest I say—I[a], not the Lord—if any brother has an unbelieving wife, and she consents to live with him, he must not divorce her.
translation:
  language: hi
  text: पर बाकी लोगों से मैं कहता हूँ—मैं, न कि प्रभु—कि यदि किसी भाई की पत्नी विश्वास न करने वाली हो और वह उसके साथ रहने के लिए सहमत हो, तो उस भाई को अपनी पत्नी को तलाक नहीं देना चाहिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह उसे न छोड़े” अथवा “वह उसे विदा न करे।” यूनानी क्रिया का अधिक शाब्दिक अनुवाद “छोड़ना” या “विदा करना” हो सकता है, पर यहाँ इसका संबंध विवाह समाप्त करने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ λοιποῖς
  choice: पर बाकी लोगों से
  rationale: यह पद पिछले निर्देशों में संबोधित लोगों से शेष समूह की ओर हल्का संक्रमण करता है; ‘पर’ δέ और ‘बाकी लोगों’ λοιποί का स्वाभाविक हिन्दी रूप है।
- source_word: λέγω ἐγώ, οὐχ ὁ κύριος
  choice: मैं कहता हूँ—मैं, न कि प्रभु—
  rationale: ἐγώ के बल को दोहराए गए ‘मैं’ से सुरक्षित रखा गया है और वाक्यांश की प्रसंगवश टिप्पणी-जैसी प्रकृति को डैश से दिखाया गया है। यह पौलुस की बात और प्रभु यीशु के प्रत्यक्ष कथन के बीच भेद बनाए रखता है।
- source_word: ἀδελφὸς
  choice: भाई
  rationale: एकवचन पुल्लिंग यहाँ विशेष रूप से ऐसे पुरुष विश्वासी को दर्शाता है जिसकी पत्नी का उल्लेख आगे है; इसलिए लिंग-सटीक ‘भाई’ उचित है।
- source_word: γυναῖκα ἔχει ἄπιστον
  choice: किसी भाई की पत्नी विश्वास न करने वाली हो
  rationale: ग्रीक वैवाहिक संबंध को व्यक्त करता है। हिन्दी में संबंधवाचक रचना ‘की पत्नी ... हो’ ‘पत्नी रखता हो’ की अपेक्षा अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: ἄπιστον
  choice: विश्वास न करने वाली
  rationale: यहाँ आशय मसीही विश्वास साझा न करने से है, वैवाहिक बेवफाई से नहीं। यह रूप उसी अर्थ को स्पष्ट रखता है।
- source_word: καὶ αὕτη συνευδοκεῖ
  choice: और वह ... सहमत हो
  rationale: साथ रहने की व्यवस्था के प्रति स्त्री की स्वैच्छिक सहमति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἰκεῖν μετ’ αὐτοῦ
  choice: उसके साथ रहने के लिए
  rationale: यह साझा घरेलू और वैवाहिक जीवन को दर्शाता है; ‘साथ रहना’ आधुनिक हिन्दी में सहज है।
- source_word: μὴ ἀφιέτω αὐτήν
  choice: वह उसे तलाक न दे
  rationale: वैवाहिक संदर्भ में ἀφίημι पत्नी को छोड़ने या विदा करने, अर्थात विवाह समाप्त करने, के अर्थ में है। ‘तलाक न दे’ आधुनिक पाठक के लिए संबंध-विच्छेद का आशय स्पष्ट करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ‘मैं, न कि प्रभु’ का आशय
  choice: पौलुस के इस निर्देश और यीशु के पृथ्वी पर दिए किसी प्रत्यक्ष कथन के बीच भेद को पाठ में बनाए रखना
  alternative: इसे अधिकारहीन निजी राय के रूप में समझना
  rationale: निकटवर्ती प्रसंग उस शिक्षा और ऐसे नए मामले के प्रेरितिक अनुप्रयोग में भेद करता है जिसे यीशु के किसी उद्धृत कथन ने सीधे संबोधित नहीं किया। अनुवाद इस तनाव को सुरक्षित रखता है और प्रेरितिक अधिकार या प्रेरणा पर अतिरिक्त निष्कर्ष आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए सहज, किंतु गरिमापूर्ण। ग्रीक की वैचारिक और व्याकरणिक बलाघात को यथासंभव रखा गया है। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
