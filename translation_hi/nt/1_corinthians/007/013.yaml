base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/013.yaml
  text: And if a woman has an unbelieving husband[a], and he consents to live with her, she must not leave her husband.
translation:
  language: hi
  text: और यदि किसी स्त्री का पति अविश्वासी हो, और वह उसके साथ रहने को सहमत हो, तो वह अपने पति को न छोड़े।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पति से अलग न हो।” यूनानी क्रिया का अधिक शाब्दिक अर्थ “छोड़ना” या “जाने देना” है; यहाँ आशय वैवाहिक संबंध समाप्त करने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ εἴ τις ἔχει ἄνδρα
  choice: यदि किसी स्त्री का पति ... हो
  rationale: यूनानी वाक्यांश शाब्दिक रूप से ‘यदि कोई स्त्री पति रखती हो’ के निकट है, पर आधुनिक हिन्दी में ‘किसी स्त्री का पति हो’ स्वाभाविक है और वैवाहिक संबंध स्पष्ट करता है।
- source_word: ἄπιστον
  choice: विश्वास न करता हो
  rationale: संदर्भ में आशय ऐसे पति से है जो मसीही विश्वास साझा नहीं करता। ‘अविश्वासी’ संभव है, पर यह क्रियात्मक रूप साधारण पाठकों के लिए अधिक सहज है और वैवाहिक बेवफाई का भ्रम नहीं पैदा करता।
- source_word: οὗτος
  choice: वह
  rationale: यह संकेतवाचक सर्वनाम पहले बताए गए पति की ओर लौटता है; हिन्दी में सामान्य सर्वनाम स्वाभाविक है।
- source_word: συνευδοκεῖ
  choice: सहमत हो
  rationale: क्रिया साथ रहने के लिए इच्छापूर्वक सहमति व्यक्त करती है। ‘सहमत हो’ वर्तमान हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: οἰκεῖν μετ’ αὐτῆς
  choice: उसके साथ रहने को
  rationale: यह साझा दांपत्य जीवन जारी रखने को व्यक्त करता है; ‘साथ रहने’ से अर्थ स्वाभाविक रूप में पहुँचता है।
- source_word: μὴ ἀφιέτω τὸν ἄνδρα
  choice: वह अपने पति को न छोड़े
  rationale: ἀφίημι का मूल अर्थ छोड़ना या जाने देना हो सकता है और यहाँ वैवाहिक संबंध समाप्त करने का संदर्भ है। ‘न छोड़े’ यूनानी की व्यापकता बनाए रखता है और केवल किसी विशिष्ट कानूनी प्रक्रिया तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: मिश्रित-विश्वास वाले विवाह में ἀφιέτω का आशय
  choice: अपने पति को न छोड़े
  alternative: अपने पति से तलाक न ले
  rationale: संदर्भ विवाह को समाप्त न करने की आज्ञा देता है, पर यूनानी क्रिया स्वयं आधुनिक कानूनी ‘तलाक’ शब्द से कुछ व्यापक है। इसलिए मुख्य पाठ में ‘न छोड़े’ मूल की वास्तविक अर्थ-सीमा और नैतिक बल दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। ‘अविश्वासी पति’ की अपेक्षा ‘पति विश्वास न करता हो’ अधिक बोलचाल-सुलभ है, जबकि ‘न छोड़े’ मूल यूनानी की अर्थगत व्यापकता को सुरक्षित रखता है।
