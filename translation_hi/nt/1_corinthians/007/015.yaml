base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/015.yaml
  text: But if the unbeliever separates[a], let him separate. The brother or the sister is not enslaved in such cases[c][b], but God has called us in peace.
translation:
  language: hi
  text: पर यदि अविश्वासी अलग होता है[a], तो उसे अलग होने दो। ऐसी परिस्थितियों में भाई या बहन दास नहीं बनाया गया है[b]; लेकिन परमेश्वर ने हमें शान्ति में बुलाया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, प्रसंगानुसार, ‘अविश्वासी पति या पत्नी’।
    reason: lexical_alternative
  - marker: b
    text: या ‘बंधा हुआ नहीं है’। यूनानी क्रिया का मूल अर्थ ‘दास बनाना’ है; यह ‘बाँधना’ के लिए सामान्यतः प्रयुक्त क्रिया नहीं है।
    reason: lexical_alternative
  - marker: c
    text: कुछ पाण्डुलिपियों में ‘हमें’ के स्थान पर ‘तुम्हें’ है।
    reason: textual_variant
lexical_decisions:
- source_word: ὁ ἄπιστος
  choice: अविश्वासी
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त हुआ है। विवाह के प्रसंग में इससे अविश्वासी जीवनसाथी अभिप्रेत है, पर मुख्य पाठ में ‘पति या पत्नी’ जोड़कर निहित बात को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: χωρίζεται / χωριζέσθω
  choice: अलग होता है / उसे अलग होने दो
  rationale: एक ही यूनानी क्रिया की पुनरावृत्ति सुरक्षित रखी गई है। ‘अलग होना’ शारीरिक अलगाव या विधिक तलाक में से किसी एक को अनिवार्य रूप से निश्चित नहीं करता; आज्ञार्थक रूप यहाँ अनुमति या स्वीकृति व्यक्त करता है।
- source_word: οὐ δεδούλωται
  choice: दासत्व में नहीं है
  rationale: δουλόω का मूल अर्थ ‘दास बनाना’ है। यह अनुवाद अधिक सामान्य ‘बाँधना’ वाली क्रिया का भाव आरोपित किए बिना यूनानी शब्द की तीव्रता और पूर्ण काल के वर्तमान परिणाम को बनाए रखता है।
- source_word: ὁ ἀδελφὸς ἢ ἡ ἀδελφὴ
  choice: भाई या बहन
  rationale: पौलुस के विश्वासियों के लिए प्रयुक्त पारिवारिक सम्बोधन और दोनों लिंगों का स्पष्ट उल्लेख सुरक्षित रखा गया है।
- source_word: ἐν τοῖς τοιούτοις
  choice: ऐसी परिस्थितियों में
  rationale: यह स्वाभाविक हिन्दी मुहावरा अभी वर्णित प्रकार की स्थितियों की ओर संकेत करने वाले यूनानी बहुवचन का भाव देता है।
- source_word: ἐν δὲ εἰρήνῃ
  choice: परन्तु ... शान्ति में
  rationale: ἐν को क्षेत्र या दशा के रूप में सीधे व्यक्त किया गया है और δέ के विरोधात्मक सम्बन्ध को ‘परन्तु’ से सुरक्षित रखा गया है।
- source_word: κέκληκεν ἡμᾶς ὁ θεός
  choice: परमेश्वर ने हमें बुलाया है
  rationale: पूर्ण काल को ‘बुलाया है’ से व्यक्त किया गया है, जिससे भूतकाल में हुए बुलावे का बना रहने वाला परिणाम सामने आता है; SBLGNT के ἡμᾶς को ‘हमें’ अनूदित किया गया है।
theological_decisions:
- issue: οὐ δεδούλωται से विवाह-विच्छेद और पुनर्विवाह के विषय में निकाला जाने वाला निष्कर्ष
  choice: ‘दासत्व में नहीं है’ के रूप में शाब्दिक अर्थ दिया गया, पर इस स्वतंत्रता की पूरी सीमा निर्धारित नहीं की गई।
  alternative: ‘बंधा नहीं है’ को पुनर्विवाह की स्पष्ट अनुमति मानना, अथवा इसे केवल चले गए जीवनसाथी को लौटाने के बाध्यकारी प्रयास से मुक्ति मानना।
  rationale: पद स्वयं स्वतंत्रता की सीमा को पूरी तरह परिभाषित नहीं करता। निकटस्थ अनुवाद धर्मसैद्धान्तिक तनाव को सुरक्षित रखता है और किसी सम्प्रदायगत निष्कर्ष को पाठ में नहीं जोड़ता।
- issue: ὁ ἄπιστος का प्रसंगगत संकेत
  choice: मुख्य पाठ में सामान्य संज्ञात्मक रूप ‘अविश्वासी’ रखा गया।
  alternative: ‘अविश्वासी पति या पत्नी’ अथवा ‘अविश्वासी जीवनसाथी’।
  rationale: विवाह का प्रसंग जीवनसाथी को स्पष्ट करता है, किन्तु यूनानी पद स्वयं ‘जीवनसाथी’ शब्द नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अलग होना’ कानूनी तलाक और केवल अलग रहने के बीच मूल पाठ की अनिर्णीतता बनाए रखता है। ‘दासत्व’ अपेक्षाकृत प्रबल शब्द है, पर मूल यूनानी δουλόω की शब्दगत विशिष्टता के कारण जानबूझकर रखा गया है।
