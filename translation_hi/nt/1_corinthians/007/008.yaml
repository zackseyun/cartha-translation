id: 1CO.7.8
reference: 1 Corinthians 7:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Λέγω δὲ τοῖς ἀγάμοις καὶ ταῖς χήραις, καλὸν ⸀αὐτοῖς ἐὰν μείνωσιν ὡς κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/008.yaml
  text: 'I say to the unmarried and to the widows: it is good for them if they remain as I am[a][b].'
translation:
  language: hi
  text: 'पर अविवाहितों[a] और विधवाओं से मैं कहता हूँ: यदि वे मेरी तरह रहें[b], तो यह उनके लिए अच्छा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अविवाहित पुरुषों”; यूनानी शब्द यहाँ पुल्लिंग बहुवचन में है, हालाँकि संदर्भ में पुल्लिंग रूप सब अविवाहित लोगों का प्रतिनिधि भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “जैसा मैं भी हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ
  choice: पर ... मैं कहता हूँ
  rationale: δέ यहाँ हल्का संयोजक अथवा विरोधसूचक है। ‘पर’ पिछले विचार से संबंध बनाए रखता है, बिना किसी स्पष्ट कालसूचक ‘अब’ को जोड़ने के।
- source_word: τοῖς ἀγάμοις
  choice: अविवाहितों
  rationale: ἄγαμος का अर्थ अविवाहित है। यूनानी रूप पुल्लिंग बहुवचन है, पर संदर्भ में यह व्यापक वर्ग का प्रतिनिधि भी हो सकता है; इसलिए अस्पष्टता को पादटिप्पणी सहित सुरक्षित रखा गया है।
- source_word: ταῖς χήραις
  choice: विधवाओं
  rationale: χήρα विशेष रूप से विधवा स्त्रियों को दर्शाता है; इसे सामान्य ‘अविवाहित स्त्रियाँ’ नहीं बनाया गया।
- source_word: καλὸν αὐτοῖς
  choice: यह उनके लिए अच्छा है
  rationale: καλόν यहाँ ‘अच्छा’ या ‘उचित’ होने का भाव देता है, तुलनात्मक ‘बेहतर’ का नहीं; αὐτοῖς को स्वाभाविक रूप से ‘उनके लिए’ कहा गया है।
- source_word: ἐὰν μείνωσιν
  choice: यदि वे ... रहें
  rationale: μένω वर्तमान अवस्था में बने रहने का भाव देता है; ‘रहें’ हिंदी में इसे सहज रूप से व्यक्त करता है।
- source_word: ὡς κἀγώ
  choice: मेरी तरह
  rationale: κἀγώ, καὶ ἐγώ का संक्षिप्त रूप है और शाब्दिक रूप से ‘जैसा मैं भी हूँ’ है। मुख्य पाठ में ‘मेरी तरह’ स्वाभाविक है, जबकि ‘भी’ की योगात्मक बारीकी पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ‘अविवाहितों’ (ἀγάμοις) का दायरा
  choice: व्यापक अर्थ वाला ‘अविवाहितों’ रखा गया है और यूनानी पुल्लिंग रूप की संभावना पादटिप्पणी में बताई गई है।
  alternative: ‘अविवाहित पुरुषों’
  rationale: पुल्लिंग बहुवचन केवल पुरुषों को सूचित कर सकता है, लेकिन प्रतिनिधिक रूप में व्यापक वर्ग को भी। अनुवाद किसी एक व्याख्या को अनावश्यक रूप से निर्णायक नहीं बनाता।
- issue: καλὸν में परामर्श का बल
  choice: ‘अच्छा है’
  alternative: ‘बेहतर है’ अथवा ‘उचित है’
  rationale: मूल विशेषण तुलनात्मक नहीं है। ‘बेहतर’ कहना पाठ से अधिक प्रबल तुलना जोड़ देता, जबकि ‘अच्छा’ उसके विस्तृत मूल्यांकनात्मक अर्थ को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य-क्रम हिंदी की स्वाभाविकता के अनुसार है, जबकि मूल पाठ की शर्त, मूल्यांकन और वैवाहिक स्थिति संबंधी अस्पष्टता सुरक्षित है।
