id: 1CO.7.5
reference: 1 Corinthians 7:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα ⸀σχολάσητε ⸀τῇ προσευχῇ καὶ πάλιν ἐπὶ τὸ αὐτὸ ⸀ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/005.yaml
  text: Do not deprive one another[a], except perhaps by mutual agreement for a time, so that you may devote yourselves to prayer, and then come together again[b], so that Satan may not tempt you because of your lack of self-control.
translation:
  language: hi
  text: एक-दूसरे को वंचित न रखो—सिवाय इसके कि शायद आपसी सहमति से कुछ समय के लिए ऐसा करो[a], ताकि तुम अपने आपको प्रार्थना में लगा सको। फिर दोबारा एक साथ हो जाओ[b], ताकि तुम्हारे आत्म-संयम की कमी के कारण शैतान तुम्हें न लुभाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “जब तक कि शायद आपसी सहमति से न हो।”'
    reason: यूनानी शब्दसमूह सीमित अपवाद को कुछ संकोच के साथ प्रस्तुत करता है; यह विकल्प उस ‘शायद’ के भाव और आपसी सहमति, दोनों को बनाए रखता है।
  - marker: b
    text: शाब्दिक रूप से, “फिर से एक साथ हो जाओ”; संदर्भ में इसका अर्थ पति-पत्नी के रूप में दाम्पत्य जीवन फिर आरम्भ करना है।
    reason: मूल मुहावरे के वैवाहिक और सम्भावित यौन संकेत को स्पष्ट करते हुए उसकी शालीन अप्रत्यक्षता बताना।
lexical_decisions:
- source_word: ἀποστερεῖτε
  choice: वंचित न रखो
  rationale: वैवाहिक संदर्भ में क्रिया का अर्थ जीवनसाथी को उसके उचित वैवाहिक संबंध से वंचित करना है। यह प्रयोग नैतिक गंभीरता बनाए रखता है और अनावश्यक आर्थिक अर्थ से बचता है।
- source_word: ἀλλήλους
  choice: एक-दूसरे को
  rationale: यह पारस्परिकता को स्पष्ट करता है और पति-पत्नी दोनों पर निर्देश को समान रूप से लागू रखता है।
- source_word: εἰ μήτι ἂν ἐκ συμφώνου
  choice: सिवाय इसके कि शायद आपसी सहमति से
  rationale: यह शब्दसमूह एक सीमित और कुछ संकोच के साथ व्यक्त अपवाद बताता है; ‘आपसी सहमति’ निर्णय की द्विपक्षीय प्रकृति को सुरक्षित रखती है।
- source_word: πρὸς καιρόν
  choice: कुछ समय के लिए
  rationale: यह अस्थायी और सीमित अवधि का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: σχολάσητε τῇ προσευχῇ
  choice: अपने आपको प्रार्थना में लगा सको
  rationale: यह प्रार्थना के लिए जानबूझकर समय और ध्यान देने का भाव व्यक्त करता है, बिना क्रिया को अत्यधिक औपचारिक बनाए।
- source_word: πάλιν ἐπὶ τὸ αὐτὸ ἦτε
  choice: फिर दोबारा एक साथ हो जाओ
  rationale: यूनानी मुहावरा वैवाहिक जीवन और दाम्पत्य संबंध फिर से आरम्भ करने की ओर संकेत करता है। यह रूप मूल की शालीन अप्रत्यक्षता बनाए रखता है।
- source_word: πειράζῃ
  choice: न लुभाए
  rationale: शैतान और असंयम के इस संदर्भ में अर्थ निष्पक्ष जाँच नहीं, बल्कि गलत काम की ओर प्रलोभित करना है।
- source_word: Σατανᾶς
  choice: शैतान
  rationale: यह हिन्दी में इस व्यक्तिगत नाम का प्रचलित रूप है।
- source_word: ἀκρασίαν
  choice: आत्म-संयम की कमी
  rationale: यह यौन संदर्भ में अपने ऊपर नियंत्रण न रख पाने का अर्थ स्पष्ट, आधुनिक और गैर-तकनीकी भाषा में देता है।
theological_decisions:
- issue: πάλιν ἐπὶ τὸ αὐτὸ ἦτε को स्पष्ट यौन संबंध के रूप में अनूदित किया जाए या अधिक सामान्य वैवाहिक पुनर्मिलन के रूप में
  choice: ‘फिर दोबारा एक साथ हो जाओ’ के द्वारा वैवाहिक और यौन आशय को संदर्भ में निहित रखा गया है।
  alternative: ‘फिर से दाम्पत्य संबंध बनाओ’
  rationale: संदर्भ में यौन संबंध सम्मिलित है, पर यूनानी अभिव्यक्ति शालीन और अप्रत्यक्ष है। अनुवाद उसी संयम को बनाए रखता है और आशय को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- issue: ὁ Σατανᾶς को व्यक्तिगत नाम माना जाए या सामान्य ‘विरोधी’
  choice: व्यक्तिगत नाम ‘शैतान’
  alternative: ‘विरोधी’
  rationale: यहाँ पौलुस का प्रयोग एक व्यक्तिगत दुष्ट सत्ता को सूचित करता है; केवल सामान्य ‘विरोधी’ कहना उस संदर्भ को अस्पष्ट कर देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और सम्मानपूर्ण रखी गई है। ‘वंचित न रखो’ निर्देश की नैतिक गंभीरता व्यक्त करता है; ‘एक साथ हो जाओ’ मूल पाठ की शालीनता और कुछ हद तक उसकी व्यापकता को सुरक्षित रखता है।
