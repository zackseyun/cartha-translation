source:
  edition: SBLGNT
  text: Δοῦλος ἐκλήθης; μή σοι μελέτω· ἀλλ’ εἰ καὶ δύνασαι ἐλεύθερος γενέσθαι, μᾶλλον χρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/021.yaml
  text: Were you called as a servant? Do not let it trouble you. But if indeed you are able to become free[a], rather make use of it.
translation:
  language: hi
  text: क्या तुम्हें दास होने की अवस्था में बुलाया गया था? इसकी चिंता मत करो। पर यदि तुम्हारे लिए स्वतंत्र हो सकना संभव हो, तो बल्कि उस अवसर का लाभ उठाओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बल्कि [अपनी वर्तमान स्थिति] का उपयोग करो,” अर्थात उसी में बने रहो। यूनानी में “उपयोग करो” का कर्म नहीं बताया गया है; इसलिए इसे दोनों प्रकार से समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: Δοῦλος
  choice: दास
  rationale: यहाँ शब्द बँधी हुई सामाजिक स्थिति को दर्शाता है, क्योंकि आगे स्वतंत्र होने की बात है; इसलिए केवल ‘सेवक’ कहना अर्थ को कमजोर कर देता।
- source_word: ἐκλήθης
  choice: बुलाए गए थे
  rationale: परमेश्वर की बुलाहट का पौलुसी संदर्भ बना रहता है, पर यूनानी पाठ में अनुपस्थित व्याख्यात्मक शब्द नहीं जोड़े गए।
- source_word: μή σοι μελέτω
  choice: इसकी चिंता मत करो
  rationale: यह स्वाभाविक आधुनिक हिन्दी में चिंता न करने का आशय और वाक्य का पासबानी स्वर व्यक्त करता है।
- source_word: ἐλεύθερος γενέσθαι
  choice: स्वतंत्र हो सकते हो
  rationale: दासता से स्वतंत्र सामाजिक स्थिति में आने का अर्थ सीधे और सहज ढंग से व्यक्त होता है।
- source_word: μᾶλλον χρῆσαι
  choice: उस अवसर का लाभ उठाओ
  rationale: निकटतम प्रसंग में स्वतंत्र होने की संभावना को इसका अनकहा कर्म माना गया है। यूनानी में कर्म व्यक्त न होने से दूसरी सम्भावना पाद-टिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: μᾶλλον χρῆσαι की व्याख्यात्मक अस्पष्टता
  choice: यदि स्वतंत्र होने का अवसर मिले, तो उसका लाभ उठाना
  alternative: अपनी वर्तमान दास अवस्था का ही उपयोग करना, अर्थात उसी में बने रहना
  rationale: तत्काल पूर्ववर्ती शर्त स्वतंत्र हो सकने की बात करती है, इसलिए अवसर का लाभ उठाना स्वाभाविक मुख्य पाठ है। फिर भी यूनानी क्रिया का कर्म अनकहा है और वैकल्पिक व्याख्या प्राचीन तथा महत्वपूर्ण है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘दास’ सामाजिक बंधन को स्पष्ट करता है। मुख्य पाठ को स्वाभाविक बनाने के लिए ‘उस अवसर’ स्पष्ट किया गया है, जबकि मूल की वास्तविक अस्पष्टता पाद-टिप्पणी में दी गई है।
