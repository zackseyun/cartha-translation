  text: ἡ περιτομὴ οὐδέν ἐστιν, καὶ ἡ ἀκροβυστία οὐδέν ἐστιν, ἀλλὰ τήρησις ἐντολῶν θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/019.yaml
  text: Circumcision is nothing[a], and uncircumcision is nothing, but keeping the commandments of God.
translation:
  language: hi
  text: खतना कुछ नहीं है[a], और खतनारहित होना भी कुछ नहीं है; महत्त्व इस बात का है कि परमेश्वर की आज्ञाओं का पालन किया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खतना कोई महत्त्व नहीं रखता”; यही अर्थ “खतनारहित होने” के लिए भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομή
  choice: खतना
  rationale: यह प्रचलित और स्पष्ट संज्ञा है तथा पौलुस के वाचा-संबंधी पहचान-चिह्न के संदर्भ को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: οὐδέν ἐστιν
  choice: कुछ नहीं है
  rationale: दोनों बार आए यूनानी वाक्यांश की कठोर और समांतर अभिव्यक्ति को बनाए रखता है; वैकल्पिक अर्थ ‘कोई महत्त्व नहीं रखता’ पादटिप्पणी में दिया गया है।
- source_word: ἀκροβυστία
  choice: खतनारहित होना
  rationale: हिन्दी में ‘अखतना’ की अपेक्षा अधिक स्वाभाविक और समझने योग्य है, और ‘खतना’ के साथ विरोध भी स्पष्ट रखता है।
- source_word: ἀλλά
  choice: महत्त्व इस बात का है कि
  rationale: यूनानी में विरोध के बाद क्रियारहित संज्ञा-वाक्यांश है। हिन्दी में यह अभिव्यक्ति वाक्य को पूर्ण और स्वाभाविक बनाते हुए मुख्य विरोध को स्पष्ट करती है।
- source_word: τήρησις
  choice: पालन किया जाए
  rationale: ‘आज्ञाओं’ के साथ ‘पालन’ आधुनिक हिन्दी का स्वाभाविक संयोजन है और संज्ञा τήρησις के ‘मानने/पालन करने’ के भाव को व्यक्त करता है।
- source_word: ἐντολῶν θεοῦ
  choice: परमेश्वर की आज्ञाओं
  rationale: बहुवचन ‘आज्ञाओं’ और परमेश्वर के साथ संबंध—दोनों को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: खतने और खतनारहित दशा का पौलुस द्वारा मूल्यांकन
  choice: दोनों को ‘कुछ नहीं’ कहकर परमेश्वर की आज्ञाओं के पालन के सामने गौण बताया गया है।
  alternative: इसे हर संदर्भ में खतने के किसी भी सम्भव नैतिक या धार्मिक अर्थ का पूर्ण निषेध मानना।
  rationale: पद की समांतर और विरोधात्मक संरचना सुरक्षित रखी गई है, पर इससे पद के तत्काल कथन से आगे कोई व्यापक धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप। ‘खतना’ आम पाठक के लिए परिचित है; ‘खतनारहित होना’ तकनीकी संज्ञा से अधिक सहज है। अन्तिम खंड में हिन्दी की स्वाभाविक वाक्य-रचना के लिए निहित मूल्य-विरोध को ‘महत्त्व इस बात का है कि’ से स्पष्ट किया गया है।
