base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/010.yaml
  text: 'To the married I give this command—not I[a], but the Lord: a wife must not separate from her husband—'
translation:
  language: hi
  text: विवाहितों को मैं यह आज्ञा देता हूँ—मैं नहीं, बल्कि प्रभु—कि पत्नी अपने पति से अलग न हो—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पति से तलाक न ले।” यूनानी क्रिया का अर्थ वैवाहिक अलगाव हो सकता है, जिसमें इस प्रसंग में तलाक भी सम्मिलित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς δὲ γεγαμηκόσιν
  choice: परन्तु विवाहितों को
  rationale: पूर्णकालिक कृदन्त γεγαμηκόσιν विवाह की वर्तमान अवस्था में रहने वालों को दर्शाता है। ‘विवाहितों को’ संक्षिप्त और स्वाभाविक है; δέ को प्रसंग में हलके संक्रमण/विरोध के रूप में ‘परन्तु’ से व्यक्त किया गया है।
- source_word: παραγγέλλω
  choice: मैं यह आज्ञा देता हूँ
  rationale: क्रिया अधिकारपूर्ण निर्देश बताती है; यह रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके बल को बनाए रखता है।
- source_word: οὐκ ἐγὼ ἀλλὰ ὁ κύριος
  choice: मैं नहीं, बल्कि प्रभु
  rationale: मूल का बलाघाती विरोध ज्यों का त्यों रखा गया है, बिना पौलुस के अधिकार के विषय में कोई अतिरिक्त निष्कर्ष जोड़े।
- source_word: γυναῖκα ἀπὸ ἀνδρὸς
  choice: पत्नी अपने पति से
  rationale: विवाह-संदर्भ में γυνή और ἀνήρ क्रमशः ‘पत्नी’ और ‘पति’ हैं; ‘अपने’ हिन्दी में संबंध को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: μὴ χωρισθῆναι
  choice: अलग न हो
  rationale: χωρίζω का मूल भाव वैवाहिक अलगाव है। ‘अलग न हो’ कानूनी तलाक तक अर्थ को अनावश्यक रूप से सीमित नहीं करता और अगले पद के संदर्भ के लिए अस्पष्टता बचाए रखता है।
theological_decisions:
- issue: ‘मैं नहीं, बल्कि प्रभु’ का आशय
  choice: 'मूल विरोध को सीधे रखा गया है: ‘मैं नहीं, बल्कि प्रभु।’'
  alternative: इसे स्पष्ट करके कहना कि यह यीशु की पहले से दी हुई आज्ञा है, अथवा इससे पौलुस अपने अधिकार का निषेध करता है।
  rationale: पद स्वयं प्रभु की आज्ञा और पौलुस के कथन में भेद करता है, पर प्रेरणा या प्रेरितीय अधिकार की व्यवस्थित व्याख्या नहीं देता; इसलिए तनाव को अनुवाद में खुला रखा गया है।
- issue: χωρισθῆναι का वैवाहिक दायरा
  choice: अलग न हो
  alternative: तलाक न दे / पति को न छोड़े
  rationale: ‘अलग’ मूल क्रिया की व्यापकता को सुरक्षित रखता है; प्रसंग में इसमें तलाक सम्मिलित हो सकता है, किंतु इसे केवल आधुनिक कानूनी तलाक तक सीमित करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य-पाठक-सुलभ शैली। मूल वाक्य का अगले पद तक बढ़ता हुआ अधूरापन अंतिम दीर्घ डैश से बनाए रखा गया है।
