  text: καὶ οἱ χρώμενοι ⸂τὸν κόσμον⸃ ὡς μὴ καταχρώμενοι· παράγει γὰρ τὸ σχῆμα τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/031.yaml
  text: and those who use the world as not making full use of it[b][a]; for the present form of this world is passing away.
translation:
  language: hi
  text: और जो संसार का उपयोग करते हैं, वे उसका उपयोग ऐसे करें जैसे उसका पूरा उपयोग न करते हों[a]; क्योंकि इस संसार का वर्तमान स्वरूप[b] बीतता जा रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे उसका पूरी तरह उपयोग न करते हों”; इस क्रिया का अर्थ “जैसे उसका दुरुपयोग न करते हों” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “इस संसार का बाहरी रूप” अथवा “इस संसार का ढंग।”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρώμενοι
  choice: उपयोग करते हैं
  rationale: χράομαι का सामान्य अर्थ ‘उपयोग करना’ है। यह सीधा और स्वाभाविक अनुवाद संसार की वस्तुओं और व्यवस्थाओं से व्यवहार करने का भाव बनाए रखता है।
- source_word: τὸν κόσμον
  choice: संसार
  rationale: यहाँ κόσμος वर्तमान सामाजिक और भौतिक जगत-व्यवस्था की ओर संकेत करता है। ‘संसार’ मूल शब्द की व्यापकता बनाए रखता है और उसे केवल सृष्टि या केवल समाज तक सीमित नहीं करता।
- source_word: ὡς μὴ καταχρώμενοι
  choice: ऐसे हों मानो उसका पूरा उपयोग नहीं करते
  rationale: καταχράομαι पहले आए χράομαι को तीव्र करता है और ‘पूरा उपयोग करना’ अथवा संदर्भानुसार ‘दुरुपयोग करना’ व्यक्त कर सकता है। मुख्य पाठ शब्द-खेल और इस संसार में पूरी तरह डूब न जाने के भाव को सुरक्षित रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: παράγει
  choice: बीतता जा रहा है
  rationale: वर्तमान काल चल रही प्रक्रिया को व्यक्त करता है। ‘बीतता जा रहा है’ संसार के मौजूदा स्वरूप की अस्थिरता और क्षणभंगुरता को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: τὸ σχῆμα
  choice: वर्तमान स्वरूप
  rationale: σχῆμα किसी वस्तु के रूप, बाहरी आकार या मौजूदा विन्यास को दर्शाता है। ‘वर्तमान स्वरूप’ प्रसंग में उसकी अस्थायी दशा स्पष्ट करता है, बिना उसे संसार की मूल प्रकृति मान लेने के।
- source_word: τοῦ κόσμου τούτου
  choice: इस संसार का
  rationale: ‘इस’ से τούτου का संकेतवाचक बल सुरक्षित रहता है और वर्तमान संसार-व्यवस्था पर ध्यान बना रहता है।
theological_decisions:
- issue: χρώμενοι और καταχρώμενοι के बीच संबंध
  choice: विश्वासी संसार का उपयोग करें, पर उसका पूरा उपयोग करने या उसमें पूरी तरह लग जाने वाले न हों।
  alternative: यहाँ मुख्यतः संसार के नैतिक दुरुपयोग की मनाही है।
  rationale: दोनों संबंधित क्रियाओं का साथ आना ‘उपयोग करना/पूरा उपयोग करना’ का शब्द-खेल बनाता है। मुख्य पाठ इसे बनाए रखता है और ‘दुरुपयोग’ की सम्भावना को पादटिप्पणी में सुरक्षित रखता है।
- issue: σχῆμα का आशय
  choice: संसार का अस्थायी वर्तमान स्वरूप या विन्यास
  alternative: केवल संसार का बाहरी दिखावा, अथवा संसार की मूलभूत प्रकृति
  rationale: प्रसंग वर्तमान जगत-व्यवस्था के बीतने पर बल देता है। इसलिए अनुवाद न तो इसे केवल सतही दिखाई देने वाली चीज़ तक सीमित करता है, न संसार के सार या सृष्टि की मूल प्रकृति के समान ठहराता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सरल शैली रखी गई है। ‘उपयोग’ की पुनरावृत्ति यूनानी χράομαι/καταχράομαι के जानबूझकर किए गए शब्द-खेल को बचाती है। ‘वर्तमान स्वरूप’ और ‘बीतता जा रहा है’ मिलकर क्षणभंगुरता व्यक्त करते हैं, पर किसी विशिष्ट सम्प्रदायगत व्याख्या को आरोपित नहीं करते।
