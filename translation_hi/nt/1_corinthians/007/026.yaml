  text: νομίζω οὖν τοῦτο καλὸν ὑπάρχειν διὰ τὴν ἐνεστῶσαν ἀνάγκην, ὅτι καλὸν ἀνθρώπῳ τὸ οὕτως εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/026.yaml
  text: 'Therefore I think this is good because of the present distress: that it is good for a man to remain as he is[a][b][c].'
translation:
  language: hi
  text: इसलिए वर्तमान संकट[a] के कारण मैं समझता हूँ कि मनुष्य के लिए जैसा वह है, वैसा ही रहना अच्छा है[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वर्तमान आवश्यकता के कारण”; या “आसन्न संकट के कारण।”
    reason: lexical_alternative
  - marker: b
    text: या “किसी व्यक्ति के लिए”; यूनानी “मनुष्य” शब्द सामान्य अर्थ में भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ, “इस प्रकार होना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίζω
  choice: मैं समझता हूँ
  rationale: यह पौलुस के विचारपूर्ण व्यक्तिगत आकलन को व्यक्त करता है, न कि निरपेक्ष आदेश को। आधुनिक हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले विवेचन से निकले निष्कर्ष का संबंध स्पष्ट करता है।
- source_word: τοῦτο καλὸν ὑπάρχειν
  choice: यह अच्छा है
  rationale: यूनानी क्रियार्थक रचना को स्वाभाविक हिन्दी कथन में बदला गया है; ‘अच्छा’ उपयुक्तता का भाव रखता है और नैतिक श्रेष्ठता को अनावश्यक रूप से नहीं जोड़ता।
- source_word: διὰ τὴν ἐνεστῶσαν ἀνάγκην
  choice: वर्तमान संकट के कारण
  rationale: ἀνάγκη दबाव, कठिनाई या आवश्यकता का बोध दे सकता है; प्रसंग में ‘संकट’ बाहरी दबाव को स्वाभाविक ढंग से व्यक्त करता है। ἐνεστῶσαν को ‘वर्तमान’ रखा गया है, यद्यपि वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: ὅτι
  choice: कि
  rationale: यह पौलुस के आकलन की विषयवस्तु प्रस्तुत करता है। डैश दोहराए गए कथन को स्पष्ट करता है।
- source_word: καλὸν
  choice: अच्छा है
  rationale: पद में καλὸν की पुनरावृत्ति को हिन्दी में भी बनाए रखा गया है।
- source_word: ἀνθρώπῳ
  choice: मनुष्य के लिए
  rationale: ἄνθρωπος यहाँ सामान्य अर्थ में व्यक्ति को सूचित कर सकता है। ‘मनुष्य’ स्रोत के एकवचन रूप और सामान्य मानवीय संदर्भ दोनों को बनाए रखता है; पुल्लिंग रूप की संभावना पादटिप्पणी में स्पष्ट की गई है।
- source_word: τὸ οὕτως εἶναι
  choice: जैसा वह है, वैसा ही रहना
  rationale: शाब्दिक अर्थ ‘इस प्रकार होना’ है। प्रसंग में वर्तमान दशा की निरंतरता अभिप्रेत प्रतीत होती है, इसलिए स्वाभाविक हिन्दी में ‘वैसा ही रहना’ चुना गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: पौलुस के कथन का स्वरूप
  choice: इसे वर्तमान संकट से जुड़ा पौलुस का परिस्थितिजन्य आकलन रहने दिया गया है।
  alternative: इसे विवाह के विरुद्ध सार्वकालिक नैतिक निषेध या स्थायी प्राथमिकता मानना।
  rationale: ‘मैं समझता हूँ’ और ‘वर्तमान संकट के कारण’ कथन को विशेष परिस्थिति में दी गई सलाह के रूप में रखते हैं। अनुवाद पाठ से आगे जाकर कोई सार्वकालिक सिद्धान्त आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज पर गरिमापूर्ण शैली। स्रोत की पुनरावृत्ति (‘अच्छा’) और परिस्थितिजन्य स्वर सुरक्षित रखे गए हैं। मुख्य पाठ में अर्थ स्पष्ट किया गया है, जबकि वास्तविक शाब्दिक और संदर्भगत विकल्प पादटिप्पणियों में दिए गए हैं।
