source:
  edition: SBLGNT
  text: ὃς δὲ ἕστηκεν ⸂ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος⸃ μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, καὶ τοῦτο κέκρικεν ἐν τῇ ⸂ἰδίᾳ καρδίᾳ⸃, ⸀τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ⸀ποιήσει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/037.yaml
  text: But whoever stands firm in his heart[a], having no necessity, but has authority over his own will[b], and has decided this in his own heart—to keep his own virgin—he will do well.
translation:
  language: hi
  text: परन्तु जो अपने हृदय में दृढ़ बना हुआ है, जिस पर कोई बाध्यता नहीं है, बल्कि जिसे अपनी इच्छा के संबंध में अधिकार है, और जिसने अपने हृदय में अपनी कुँवारी को बनाए रखने का निश्चय कर लिया है[a], वह अच्छा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपनी कुँवारी” का आशय उसकी कुँवारी बेटी अथवा उसकी मंगेतर, एक कुँवारी स्त्री, हो सकता है; यूनानी अभिव्यक्ति का संदर्भ विवादित है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἕστηκεν ... ἑδραῖος
  choice: दृढ़ है
  rationale: यह पूर्ण हो चुके और स्थिर बने हुए आंतरिक निश्चय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: अपने हृदय में
  rationale: καρδία यहाँ निर्णय और संकल्प के आंतरिक केंद्र को दर्शाता है; हिन्दी में बाइबलीय मुहावरा भी सुरक्षित रहता है।
- source_word: μὴ ἔχων ἀνάγκην
  choice: जिस पर कोई विवशता नहीं है
  rationale: ἀνάγκη की आवश्यकता, दबाव या बाध्यता की अर्थ-सीमा में यहाँ बाहरी विवशता का अभाव संदर्भानुकूल और स्पष्ट है।
- source_word: ἐξουσίαν ... ἔχει περὶ τοῦ ἰδίου θελήματος
  choice: जिसे अपनी इच्छा के विषय में अधिकार है
  rationale: ἐξουσία के अधिकार और θέλημα की इच्छा/मंशा दोनों को निकटता से रखता है, बिना इसे केवल आत्म-संयम के अर्थ में सीमित किए।
- source_word: κέκρικεν
  choice: निश्चय कर लिया है
  rationale: पूर्णकालिक रूप पहले किए गए और अब भी स्थिर निर्णय को दर्शाता है।
- source_word: τηρεῖν τὴν ἑαυτοῦ παρθένον
  choice: अपनी कुँवारी को रखेगा
  rationale: τηρεῖν के ‘रखना/बनाए रखना’ और विवादित παρθένον के शाब्दिक अर्थ को मुख्य पाठ में यथासंभव सुरक्षित रखता है; संभावित संबंध फुटनोट में स्पष्ट किए गए हैं।
- source_word: καλῶς ποιήσει
  choice: वह अच्छा करेगा
  rationale: यूनानी मुहावरे का सीधा, सुबोध और मूल्यांकनात्मक हिन्दी रूप है।
theological_decisions:
- issue: τὴν ἑαυτοῦ παρθένον में ‘अपनी कुँवारी’ का संबंध
  choice: मुख्य पाठ में अस्पष्ट ‘अपनी कुँवारी’ बनाए रखना
  alternative: अपनी कुँवारी बेटी; अपनी मंगेतर/वाग्दत्त कुँवारी
  rationale: यूनानी वाक्यांश से यह निर्णायक रूप से स्पष्ट नहीं होता कि आशय पिता या अभिभावक की कुँवारी बेटी से है अथवा पुरुष की वाग्दत्त स्त्री से। किसी एक व्याख्या को मुख्य पाठ में थोपने के बजाय दोनों को फुटनोट में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और अपेक्षाकृत औपचारिक स्तर रखा गया है। ‘कुँवारी’ मूल की अस्पष्टता बचाती है, यद्यपि अकेले हिन्दी में यह अभिव्यक्ति कुछ असामान्य है; इसलिए आवश्यक व्याख्या फुटनोट में दी गई है।
