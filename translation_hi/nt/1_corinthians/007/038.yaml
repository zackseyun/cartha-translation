  text: ὥστε καὶ ὁ ⸀γαμίζων ⸂τὴν παρθένον ἑαυτοῦ⸃ καλῶς ποιεῖ, ⸂καὶ ὁ⸃ μὴ ⸁γαμίζων κρεῖσσον ⸀ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/038.yaml
  text: So then[a], the one who gives his own virgin in marriage does well, and the one who does not give her in marriage will do better.
translation:
  language: hi
  text: इसलिए, जो अपनी कुँवारी[a] का विवाह कराता है, वह अच्छा करता है; और जो उसका विवाह नहीं कराता, वह बेहतर करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में शाब्दिक रूप से, “अपनी कुँवारी।” इसका सम्बन्ध विवादित है। इसका अर्थ “अपनी कुँवारी कन्या” या “अपनी कुँवारी आश्रिता” हो सकता है। एक अन्य सम्भव अनुवाद है: “जो अपनी कुँवारी मंगेतर से विवाह करता है, वह अच्छा करता है; और जो उससे विवाह नहीं करता, वह बेहतर करेगा।” यहाँ प्रयुक्त यूनानी क्रिया सामान्यतः “किसी का विवाह कराना” के अर्थ में आती है; इसलिए मुख्य पाठ में वही कारक अर्थ रखा गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले तर्क से निकला निष्कर्ष व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: γαμίζων
  choice: विवाह कराता है
  rationale: γαμίζω का कारक अर्थ ‘विवाह कराना/विवाह में देना’ है; यह इसे सामान्य ‘विवाह करना’ (γαμέω) से अलग रखता है।
- source_word: τὴν παρθένον ἑαυτοῦ
  choice: अपनी कुँवारी कन्या
  rationale: शाब्दिक वाक्यांश ‘अपनी कुँवारी’ है, पर हिन्दी में यह अस्वाभाविक और अस्पष्ट है। कारक क्रिया के साथ ‘कुँवारी कन्या’ सम्भावित सामाजिक सम्बन्ध को स्वाभाविक ढंग से व्यक्त करती है; अन्य प्रमुख अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: καλῶς ποιεῖ
  choice: अच्छा करता है
  rationale: यह यूनानी पद के सकारात्मक मूल्यांकन को बिना उसे पूर्ण नैतिक आदेश बनाए व्यक्त करता है।
- source_word: μὴ γαμίζων
  choice: उसका विवाह नहीं कराता
  rationale: पहले कृदन्त के समान कारक अर्थ बनाए रखा गया है और हिन्दी में आवश्यक कर्म को सर्वनाम से व्यक्त किया गया है।
- source_word: κρεῖσσον ποιήσει
  choice: और भी अच्छा करेगा
  rationale: κρεῖσσον तुलनात्मक है; ‘और भी अच्छा’ तुलना को सुरक्षित रखता है, इसे सर्वोत्तम नहीं बनाता।
theological_decisions:
- issue: ‘अपनी कुँवारी’ का सम्बन्ध और γαμίζω का अर्थ
  choice: मुख्य पाठ में γαμίζω का कारक अर्थ ‘विवाह कराना’ रखा गया और स्वाभाविक हिन्दी के लिए सम्भावित सम्बन्ध ‘कन्या’ व्यक्त किया गया।
  alternative: ‘जो अपनी कुँवारी मंगेतर से विवाह करता है, वह अच्छा करता है; और जो उससे विवाह नहीं करता, वह और भी अच्छा करेगा।’
  rationale: 1 कुरिन्थियों 7:36–38 एक प्रसिद्ध व्याख्यात्मक कठिनाई है। γαμίζω सामान्यतः ‘विवाह कराना’ के पक्ष में है, जिससे कन्या/आश्रिता का अर्थ सम्भवतः अभिप्रेत है; फिर भी मंगेतर से विवाह करने की व्याख्या भी प्रचलित है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘विवाह कराना’ कारक यूनानी क्रिया को स्पष्ट करता है। ‘कुँवारी कन्या’ सामान्य पाठक के लिए स्वाभाविक है, जबकि विवादित वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
