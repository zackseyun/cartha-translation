  text: περιτετμημένος τις ἐκλήθη; μὴ ἐπισπάσθω· ἐν ἀκροβυστίᾳ ⸂κέκληταί τις⸃; μὴ περιτεμνέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/018.yaml
  text: Was anyone called while circumcised? He should not try to reverse it[a]. Was anyone called while uncircumcised? He should not be circumcised.
translation:
  language: hi
  text: क्या किसी को उस समय बुलाया गया था जब उसका खतना हो चुका था? वह खतने के चिह्न मिटाने की कोशिश न करे।[a] क्या किसी को खतनारहित दशा में बुलाया गया था? वह खतना न कराए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “वह खतनारहित न बने”—अर्थात वह खतने के चिह्नों को छिपाने या उलटने की कोशिश न करे।
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετμημένος
  choice: जब उसका खतना हो चुका था
  rationale: यूनानी पूर्ण कृदंत खतना हो जाने से बनी वर्तमान दशा को व्यक्त करता है। यह हिंदी रूप उस पूर्ण अवस्था को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: ἐκλήθη / κέκληταί
  choice: बुलाया गया था
  rationale: यहाँ पौलुस के प्रसंग में परमेश्वर द्वारा बुलाए जाने का संकेत है। ‘बुलाया गया’ मूल की धार्मिक अर्थ-गुंजाइश बनाए रखता है और उसे ‘विश्वासी बना’ कहकर सीमित नहीं करता।
- source_word: ἐπισπάσθω
  choice: खतने के चिह्न मिटाने की कोशिश न करे
  rationale: क्रिया का शाब्दिक अर्थ खतनारहित बनने या खतने के दृश्य चिह्न को छिपाने की प्राचीन कोशिश से संबंधित है। चयनित रूप आधुनिक पाठक के लिए क्रिया का व्यावहारिक आशय स्पष्ट करता है; अधिक शाब्दिक विकल्प पाद-टिप्पणी में है।
- source_word: ἐν ἀκροβυστίᾳ
  choice: खतनारहित दशा में
  rationale: यह पद उस अवस्था को बताता है जिसमें व्यक्ति बुलाया गया था। ‘खतनारहित दशा में’ स्पष्ट, सम्मानजनक और मूल के निकट है।
- source_word: περιτεμνέσθω
  choice: खतना न कराए
  rationale: μή के साथ वर्तमान आज्ञार्थक निषेध व्यक्त करता है। हिंदी में ‘खतना न कराए’ इस निर्देश को सहज और सीधे रूप में देता है।
theological_decisions:
- issue: दोनों वाक्यों में ‘बुलाया गया’ का अर्थ
  choice: अपनी तत्कालीन धार्मिक-सामाजिक दशा में परमेश्वर द्वारा बुलाया जाना
  alternative: सामान्य अर्थ में किसी के द्वारा बुलाया जाना
  rationale: 1 कुरिन्थियों 7 के निकटवर्ती प्रसंग में ‘बुलाहट’ विश्वासी जीवन में परमेश्वर की बुलाहट को सूचित करती है। फिर भी अनुवाद में ‘बुलाया गया’ रखा गया है, ताकि मूल की संक्षिप्तता और अर्थ-गुंजाइश बनी रहे।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, स्पष्ट और गरिमापूर्ण शैली। ‘खतनारहित दशा’ मूल अवस्था-सूचक पद को स्पष्ट रखता है; पहले निषेध में प्राचीन शारीरिक प्रक्रिया को अस्पष्ट छोड़े बिना उसका आशय दिया गया है।
