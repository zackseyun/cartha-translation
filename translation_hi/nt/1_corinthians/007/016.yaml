source:
  edition: SBLGNT
  text: τί γὰρ οἶδας, γύναι, εἰ τὸν ἄνδρα σώσεις; ἢ τί οἶδας, ἄνερ, εἰ τὴν γυναῖκα σώσεις;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/016.yaml
  text: For how do you know[a], wife, whether you will save your husband? Or how do you know, husband, whether you will save your wife?
translation:
  language: hi
  text: क्योंकि पत्नी, तुम कैसे जान सकती हो कि तुम अपने पति को बचाओगी? और पति, तुम कैसे जान सकते हो कि तुम अपनी पत्नी को बचाओगे?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अधिक भावानुकूल रूप में: “तुम कैसे जान सकते हो कि शायद तुम अपने जीवनसाथी को बचा सको?” यूनानी में अप्रत्यक्ष प्रश्न के भीतर भविष्यकाल की क्रिया है: “बचाओगी/बचाओगे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ οἶδας
  choice: क्योंकि ... तुम क्या जानती/जानते हो
  rationale: τί + οἶδα का प्रश्न यहाँ किसी परिणाम के अनिश्चित होने को व्यक्त करता है। ‘क्या जानती/जानते हो ... या नहीं’ आधुनिक हिन्दी में स्वाभाविक है और γάρ की कारणसूचक/व्याख्यात्मक शक्ति को ‘क्योंकि’ बनाए रखता है।
- source_word: γύναι
  choice: हे पत्नी
  rationale: विवाह के प्रसंग में γυνή का अर्थ ‘पत्नी’ है; सम्बोधन को स्पष्ट रखने के लिए ‘हे’ प्रयुक्त हुआ है।
- source_word: ἄνερ
  choice: हे पति
  rationale: विवाह के प्रसंग में ἀνήρ का अर्थ ‘पति’ है; यह सम्बोधन स्त्री से किए गए समानांतर प्रश्न को बनाए रखता है।
- source_word: σώσεις
  choice: बचाओगी / बचाओगे
  rationale: भविष्यत् सूचक क्रिया को हिन्दी भविष्यकाल में रखा गया है। अप्रत्यक्ष प्रश्न में εἰ के कारण इसे निश्चित भविष्यवाणी न बनाकर ‘या नहीं’ के साथ अनिश्चित परिणाम के रूप में व्यक्त किया गया है।
- source_word: τὸν ἄνδρα / τὴν γυναῖκα
  choice: अपने पति / अपनी पत्नी
  rationale: यूनानी निश्चित लेख यहाँ सम्बोधित व्यक्ति के जीवनसाथी की ओर संकेत करता है; हिन्दी में ‘अपने/अपनी’ स्वाभाविक और स्पष्ट है।
- source_word: ἢ
  choice: अथवा
  rationale: दो समानांतर प्रश्नों के बीच मूल के विकल्पसूचक सम्बन्ध को गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: वैवाहिक प्रसंग में ‘बचाना’ का अर्थ
  choice: ‘बचाना’ को बिना व्याख्यात्मक विस्तार के रखा गया है
  alternative: ‘विश्वास में लाना’, ‘उद्धार का कारण बनना’, या ‘विवाह को बचाना’
  rationale: σῴζω की उद्धार-संबंधी शक्ति और यहाँ उपस्थित धर्मवैचारिक तनाव को बनाए रखना उचित है। अनुवाद यह तय नहीं करता कि जीवनसाथी किस अर्थ या माध्यम से ‘बचाएगा’।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और लिंग-सटीक सम्बोधन रखा गया है। ‘या नहीं’ εἰ के अप्रत्यक्ष प्रश्नार्थक प्रयोग को स्पष्ट करता है, जबकि मुख्य पाठ में भविष्यकाल मूल यूनानी रूप को सुरक्षित रखता है।
