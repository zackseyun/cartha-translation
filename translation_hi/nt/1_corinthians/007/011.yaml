source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ χωρισθῇ, μενέτω ἄγαμος ἢ τῷ ἀνδρὶ καταλλαγήτω— καὶ ἄνδρα γυναῖκα μὴ ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/011.yaml
  text: But if she does separate[a], let her remain unmarried[b], or else be reconciled to her husband—and a husband must not divorce his wife.
translation:
  language: hi
  text: पर यदि वह अलग हो भी जाए[a], तो वह अविवाहित रहे या अपने पति से मेल-मिलाप कर ले—और पति अपनी पत्नी को तलाक न दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘पर यदि वह अलग हो जाए’ भी हो सकता है। यूनानी में यहाँ ‘यदि ... भी’ जैसा हल्का रियायती भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपनी पत्नी को छोड़ न दे।’ यूनानी क्रिया का अधिक शाब्दिक अर्थ ‘छोड़ देना’ या ‘विदा कर देना’ हो सकता है, यद्यपि इस वैवाहिक प्रसंग में यह सामान्यतः तलाक या पत्नी के त्याग को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ καὶ
  choice: पर यदि ... भी
  rationale: यह शर्त के साथ संभावित रियायती भाव को व्यक्त करता है। ‘भी’ καί के ‘भले ही/यदि ... भी’ वाले सूक्ष्म अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: χωρισθῇ
  choice: अलग हो जाए
  rationale: χωρίζω यहाँ पति-पत्नी के अलग होने को दर्शाता है। यह प्रयोग औपचारिक तलाक को अनिवार्य रूप से नहीं मानता और यूनानी रूप में निहित मध्य/कर्मवाच्य अस्पष्टता को पर्याप्त रूप से खुला रखता है।
- source_word: μενέτω
  choice: रहे
  rationale: μένω का अर्थ ‘रहना/बने रहना’ है; आज्ञार्थक बल ‘वह ... रहे’ में स्वाभाविक और स्पष्ट है।
- source_word: ἄγαμος
  choice: अविवाहित
  rationale: ἄγαμος वैवाहिक स्थिति को ठीक-ठीक बताता है; ‘अकेली’ या ‘सिंगल’ की अपेक्षा ‘अविवाहित’ अधिक सटीक और गरिमापूर्ण है।
- source_word: καταλλαγήτω
  choice: मेल-मिलाप कर ले
  rationale: कर्मवाच्य आज्ञार्थक रूप संबंध की पुनःस्थापना को व्यक्त करता है। ‘मेल-मिलाप कर ले’ हिन्दी में स्वाभाविक है और केवल कानूनी वापसी तक अर्थ को सीमित नहीं करता।
- source_word: τῷ ἀνδρί
  choice: अपने पति से
  rationale: वैवाहिक प्रसंग में ἀνήρ का अर्थ ‘पति’ है; ‘अपने’ हिन्दी में संबंध को सहज रूप से स्पष्ट करता है।
- source_word: ἄνδρα
  choice: पति
  rationale: दूसरे निर्देश में ἀνήρ सामान्य रूप से पति को सूचित करता है।
- source_word: γυναῖκα
  choice: अपनी पत्नी को
  rationale: इस वैवाहिक प्रसंग में γυνή का अर्थ ‘पत्नी’ है; ‘अपनी’ संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: μὴ ἀφιέναι
  choice: तलाक न दे
  rationale: ἀφίημι का मूल भाव ‘छोड़ देना/विदा कर देना’ हो सकता है, पर वैवाहिक संदर्भ में यह पत्नी को त्यागने या तलाक देने का निर्देशात्मक निषेध है। ‘तलाक न दे’ आधुनिक पाठक के लिए स्पष्ट है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: क्या χωρισθῇ और ἀφιέναι दोनों का अनुवाद एक ही वैवाहिक-कानूनी शब्द से किया जाए
  choice: χωρισθῇ के लिए ‘अलग हो जाए’ और ἀφιέναι के लिए ‘तलाक न दे’
  alternative: दोनों को ‘तलाक’ कहना, अथवा दोनों को सामान्य रूप से ‘अलग होना/छोड़ना’ कहना
  rationale: पौलुस ने दो अलग यूनानी क्रियाएँ प्रयुक्त की हैं। उनका भेद बनाए रखने से पहले कथन में औपचारिक कानूनी तलाक का अर्थ अनावश्यक रूप से नहीं थोपा जाता, जबकि दूसरे कथन में पत्नी को वैवाहिक रूप से त्यागने का बल स्पष्ट रहता है।
- issue: χωρισθῇ के स्त्रीलिंग कर्ता को हिन्दी में कैसे स्पष्ट किया जाए
  choice: ‘वह’ का प्रयोग, जिसे निकटवर्ती संदर्भ पत्नी के रूप में निर्धारित करता है
  alternative: हर बार ‘पत्नी’ कहना
  rationale: यूनानी क्रिया का कर्ता पिछले पद के संदर्भ से पत्नी है। हिन्दी में ‘वह’ प्रवाहपूर्ण है और प्रसंगगत स्त्री कर्ता को बदले बिना अनावश्यक पुनरुक्ति से बचाता है।
- issue: καταλλαγήτω में मेल-मिलाप की दिशा
  choice: ‘अपने पति से मेल-मिलाप कर ले’
  alternative: ‘अपने पति के पास लौट जाए’
  rationale: यूनानी क्रिया मेल-मिलाप या संबंध की पुनःस्थापना कहती है; केवल भौतिक रूप से लौटने का अर्थ देना इससे अधिक संकीर्ण होगा।
translation_notes:
  register: भाषा आधुनिक, मानक और गरिमापूर्ण हिन्दी में रखी गई है। ‘अलग हो जाए’ और ‘तलाक न दे’ दो भिन्न यूनानी क्रियाओं का अंतर बनाए रखते हैं। ‘मेल-मिलाप कर ले’ सामान्य पाठक के लिए सहज है और संबंध की पुनःस्थापना का भाव व्यक्त करता है। अंग्रेज़ी परामर्श-पाठ में [b] का स्थान ‘unmarried’ के बाद था, पर उसकी पादटिप्पणी ἀφιέναι (‘send away’) से संबंधित है; इसलिए हिन्दी मुख्य पाठ में [b] को ‘तलाक न दे’ के बाद रखा गया है।
