  text: ἕκαστος ἐν τῇ κλήσει ᾗ ἐκλήθη ἐν ταύτῃ μενέτω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/007/020.yaml
  text: Each one should remain in the calling in which he was called[a][b].
translation:
  language: hi
  text: हर व्यक्ति जिस बुलाहट[a] में बुलाया गया[b], उसी में बना रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘दशा,’ ‘परिस्थिति,’ या ‘जीवन-स्थिति’ भी हो सकता है। यूनानी में शब्दशः ‘बुलाहट’ है, जो इसी वाक्य के ‘बुलाया गया’ से शब्दगत संबंध रखता है।
    reason: lexical_alternative
  - marker: b
    text: मूल यूनानी में प्रतिनिधिक पुल्लिंग एकवचन प्रयोग हुआ है; यह निर्देश प्रत्येक विश्वासी पर लागू होता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: हर व्यक्ति
  rationale: यह चुनाव यूनानी के वितरणात्मक एकवचन का स्वाभाविक आधुनिक हिन्दी में अर्थ देता है और निर्देश को प्रत्येक विश्वासी पर अलग-अलग लागू करता है।
- source_word: κλήσει
  choice: बुलाहट
  rationale: ‘बुलाहट’ अगले पदबंध ‘बुलाया गया’ के साथ मूल पाठ की शब्द-पुनरावृत्ति बनाए रखती है और परमेश्वर की बुलाहट तथा बुलाए जाने के समय की जीवन-स्थिति के बीच निहित अर्थगत तनाव को खुला रखती है।
- source_word: ᾗ ἐκλήθη
  choice: जिस ... में बुलाया गया
  rationale: संबंधवाचक रचना और ἐν का अर्थ सुरक्षित रखा गया है। कर्मवाच्य से बुलाने वाले को अनावश्यक रूप से स्पष्ट किए बिना मूल पाठ का दिव्य कर्मवाच्य बना रहता है।
- source_word: ἐν ταύτῃ
  choice: उसी में
  rationale: यह संकेतवाचक पद पहले कही गई बुलाहट अथवा स्थिति की ओर लौटता है और हिन्दी में स्वाभाविक रूप से यूनानी की पुनरुक्त संरचना को दर्शाता है।
- source_word: μενέτω
  choice: बना रहे
  rationale: वर्तमान काल की आज्ञा किसी वर्तमान दशा में बने रहने का निर्देश देती है। ‘बना रहे’ आधुनिक हिन्दी में स्पष्ट आज्ञार्थक बल रखता है, पर उसे ‘अवश्य’ जोड़कर अधिक निरपेक्ष नहीं बनाता।
theological_decisions:
- issue: κλῆσις का प्रसंगगत अर्थ
  choice: मुख्य पाठ में ‘बुलाहट’ रखा गया है।
  alternative: ‘दशा,’ ‘परिस्थिति,’ या ‘जीवन-स्थिति।’
  rationale: निकटवर्ती प्रसंग खतना, दासता और जीवन की परिस्थितियों से संबंधित है, फिर भी κλήσει और ἐκλήθη के बीच जानबूझकर किया गया शब्द-संबंध परमेश्वर की बुलाहट और उस समय की स्थिति—दोनों को साथ रखता है। ‘बुलाहट’ इस तनाव को किसी एक अर्थ में सीमित नहीं करती।
- issue: व्याकरणिक पुल्लिंग एकवचन का प्रतिनिधिक प्रयोग
  choice: ‘हर व्यक्ति ... बुलाया गया’ के हिन्दी पुल्लिंग एकवचन को प्रतिनिधिक रूप में रखा गया है।
  alternative: बहुवचन या पूरी तरह लिंग-निरपेक्ष पुनर्रचना।
  rationale: यह मूल के वितरणात्मक एकवचन को बनाए रखता है। पादटिप्पणी स्पष्ट करती है कि निर्देश केवल पुरुषों तक सीमित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बुलाहट—बुलाया गया’ की पुनरावृत्ति मूल यूनानी के शब्द-संबंध को बचाती है, जबकि ‘उसी में बना रहे’ हिन्दी में स्पष्ट और स्वाभाविक निर्देश है।
