id: 1CO.6.2
reference: 1 Corinthians 6:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/002.yaml
  text: Or do you not know that the saints will judge the world? And if the world is judged by you[b][a], are you unworthy of the smallest courts?
translation:
  language: hi
  text: या क्या तुम नहीं जानते कि पवित्र जन संसार का न्याय करेंगे? और यदि संसार का न्याय तुम्हारे द्वारा किया जाएगा,[a] तो क्या तुम छोटे-से-छोटे न्यायिक मामलों का निर्णय करने के योग्य नहीं हो?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे बीच”; यूनानी पद का अधिक शाब्दिक अर्थ “यदि संसार का न्याय तुम्हारे बीच किया जाता है” हो सकता है, पर प्रसंग में भाव यह है कि विश्वासी संसार के न्याय में सहभागी होंगे।
    reason: lexical_alternative
  - marker: b
    text: या “छोटे-से-छोटे न्यायालयों के योग्य नहीं हो?” यूनानी शब्द न्यायालयों अथवा न्याय के लिए प्रस्तुत मामलों—दोनों का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: या
  rationale: यह पिछले तर्क को आगे बढ़ाने वाला तीखा आलंकारिक विकल्प प्रस्तुत करता है।
- source_word: οὐκ οἴδατε
  choice: क्या तुम नहीं जानते
  rationale: पौलुस के परिचित आलंकारिक प्रश्न को निकटता और स्वाभाविकता से व्यक्त करता है।
- source_word: οἱ ἅγιοι
  choice: पवित्र जन
  rationale: यह परमेश्वर के लिए अलग किए गए विश्वासियों का सामूहिक उल्लेख है; इससे आधुनिक हिन्दी में विशिष्ट रूप से संत घोषित व्यक्तियों का अर्थ नहीं निकलता।
- source_word: τὸν κόσμον
  choice: संसार का
  rationale: κόσμος के व्यापक मानवीय अथवा सृष्टिगत संदर्भ को सहज हिन्दी में बनाए रखता है।
- source_word: κρινοῦσιν
  choice: न्याय करेंगे
  rationale: भविष्यकाल और न्याय करने के मूल अर्थ, दोनों को सुरक्षित रखता है; न्याय में सहभागिता का ढंग अनिर्दिष्ट रहता है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे द्वारा
  rationale: न्यायिक संदर्भ में यह विश्वासियों की सहभागिता स्पष्ट करता है, जबकि अधिक शाब्दिक ‘तुम्हारे बीच’ को पादटिप्पणी में रखा गया है।
- source_word: κρίνεται
  choice: न्याय किया जाएगा
  rationale: शर्त वाले वाक्य में वर्तमान कर्मवाच्य का भावी संदर्भ हिन्दी में स्वाभाविक भविष्य कर्मवाच्य से स्पष्ट होता है।
- source_word: ἀνάξιοί ἐστε
  choice: क्या तुम ... योग्य नहीं हो
  rationale: ἀνάξιος की योग्यता अथवा पात्रता से जुड़ी आलंकारिक चुभन बनाए रखता है।
- source_word: κριτηρίων ἐλαχίστων
  choice: छोटे-से-छोटे न्यायिक मामलों का निर्णय
  rationale: संदर्भ में न्याय-निर्णय के छोटे मामलों का भाव सहज हिन्दी में देता है; संज्ञा की ‘न्यायालय’ वाली सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ‘पवित्र जन’ की पहचान
  choice: परमेश्वर के लोग अर्थात सामान्य रूप से विश्वासी
  alternative: विशेष रूप से अत्यन्त पवित्र विश्वासियों का कोई सीमित वर्ग
  rationale: पौलुस के सामान्य प्रयोग में यह समूचे विश्वासियों के लिए सामूहिक संबोधन है, न कि किसी विशिष्ट आध्यात्मिक वर्ग के लिए।
- issue: विश्वासियों द्वारा संसार का न्याय
  choice: भविष्य के न्याय में वास्तविक सहभागिता, जिसका ठीक स्वरूप यहाँ नहीं बताया गया
  alternative: केवल रूपकात्मक नैतिक मूल्यांकन, अथवा पूर्णतः स्वतंत्र न्यायिक अधिकार
  rationale: मूल पाठ सहभागिता की पुष्टि करता है, पर उसके ढंग या सीमा का वर्णन नहीं करता; अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘पवित्र जन’ सामान्य पाठक के लिए स्पष्ट है और ‘संत’ से जुड़ी बाद की संस्थागत धारणाओं से बचता है। ‘छोटे-से-छोटे न्यायिक मामले’ प्रसंगगत अर्थ स्पष्ट करता है, जबकि शब्दगत विकल्प पादटिप्पणी में सुरक्षित है।
