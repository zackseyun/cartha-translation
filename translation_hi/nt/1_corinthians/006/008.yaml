lexical_decisions:
- source_word: ἀλλὰ
  choice: पर
  rationale: पिछली बात के साथ प्रबल विरोध प्रकट करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὑμεῖς
  choice: तुम स्वयं
  rationale: यूनानी में स्पष्ट सर्वनाम बलाघातयुक्त है; ‘स्वयं’ कुरिन्थियों के अपने आचरण पर दिया गया बल बनाए रखता है।
- source_word: ἀδικεῖτε
  choice: अन्याय करते
  rationale: यह व्यापक रूप से अनुचित या अन्यायपूर्ण आचरण बताता है और मूल की नैतिक गंभीरता बनाए रखता है।
- source_word: ἀποστερεῖτε
  choice: ठगते हो
  rationale: संदर्भ में किसी को उसके अधिकार की वस्तु से वंचित करने या धोखे से हानि पहुँचाने का भाव है; ‘ठगते’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: καὶ τοῦτο
  choice: —और वह भी
  rationale: यह मुहावरा अपराध की गंभीरता बढ़ाता है; हिन्दी में ‘और वह भी’ उसी आलंकारिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀδελφούς
  choice: अपने भाई-बहनों
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन है, पर पौलुस के सामुदायिक संबोधन में यह प्रायः संगी विश्वासियों के व्यापक समूह को सूचित करता है। ‘भाई-बहनों’ हिन्दी में उस प्रासंगिक व्यापकता को स्पष्ट करता है; पाद-टिप्पणी मूल रूप बताती है।
theological_decisions:
- issue: मिश्रित-लिंग कलीसियाई संदर्भ में ἀδελφούς का अनुवाद
  choice: अपने भाई-बहनों
  alternative: अपने भाइयों; संगी विश्वासियों
  rationale: स्रोत का रूप पुल्लिंग बहुवचन है, किंतु प्रसंग में आशय मसीही समुदाय के सदस्यों से है, केवल पुरुषों से नहीं। मुख्य पाठ में स्वाभाविक और संदर्भतः समावेशी हिन्दी रखी गई है, जबकि पाद-टिप्पणी यूनानी रूप की जानकारी सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘तुम स्वयं’ मूल के बलाघात को, और ‘और वह भी’ वाक्य के तीखे आलंकारिक मोड़ को सुरक्षित रखते हैं।
