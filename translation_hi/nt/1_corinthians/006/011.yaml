source:
  edition: SBLGNT
  text: καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλὰ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ κυρίου ⸀Ἰησοῦ καὶ ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/011.yaml
  text: And such were some of you[a]. But you washed yourselves, but you were sanctified[c][b], but you were justified in the name of the Lord Jesus and in the Spirit of our God.
translation:
  language: hi
  text: और तुम में से कुछ ऐसे थे। पर तुम धोए गए[a]; पर तुम पवित्र किए गए; पर तुम प्रभु यीशु के नाम में और हमारे परमेश्वर की आत्मा में धर्मी ठहराए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस यूनानी क्रिया-रूप का अनुवाद “तुमने अपने आपको धोया” भी किया जा सकता है। प्रसंग में बहुत-से लोग इसे परमेश्वर के उद्धारकारी कार्यों की शृंखला का भाग समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ταῦτά τινες ἦτε
  choice: और तुममें से कुछ ऐसे ही थे
  rationale: यह स्वाभाविक हिन्दी में पूर्ववर्ती दुर्गुण-सूची की ओर संकेत करता है और ταῦτα के संदर्भसूचक बल को बनाए रखता है।
- source_word: ἀλλὰ
  choice: पर
  rationale: तीनों बार दोहराया गया 'पर' पौलुस के प्रबल विरोध और अलंकारिक लय को सुरक्षित रखता है।
- source_word: ἀπελούσασθε
  choice: तुम धोए गए
  rationale: मध्यवाच्य रूप होने पर भी साथ के दो कर्मवाच्य क्रियापदों के बीच यह परमेश्वर की उद्धारकारी क्रिया के रूप में स्वाभाविक है; आत्मवाचक संभावना पादटिप्पणी में रखी गई है।
- source_word: ἡγιάσθητε
  choice: तुम पवित्र किए गए
  rationale: यह ἁγιάζω का स्पष्ट, वर्तमान हिन्दी रूप है और परमेश्वर द्वारा पवित्र बनाए या अलग किए जाने का भाव रखता है।
- source_word: ἐδικαιώθητε
  choice: तुम धर्मी ठहराए गए
  rationale: यह δικαιόω के न्यायिक घोषणात्मक भाव को हिन्दी में 'धर्मी बनाए गए' की अपेक्षा अधिक स्पष्टता से व्यक्त करता है।
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου Ἰησοῦ
  choice: प्रभु यीशु के नाम में
  rationale: औपचारिक अनुवाद ἐν की साधन, अधिकार और क्षेत्र संबंधी संभावनाओं को अनिर्णीत रखता है।
- source_word: ἐν τῷ πνεύματι τοῦ θεοῦ ἡμῶν
  choice: हमारे परमेश्वर के आत्मा में
  rationale: दूसरे ἐν को भी 'में' कहना यूनानी की समानांतर रचना और माध्यम/क्षेत्र की वास्तविक अस्पष्टता बचाता है; 'परमेश्वर का आत्मा' पवित्र आत्मा की ओर संकेत करता है।
theological_decisions:
- issue: ἀπελούσασθε का वाच्य और कर्तृत्व
  choice: 'कर्मवाच्य अर्थ: ''तुम धोए गए'''
  alternative: 'आत्मवाच्य अर्थ: ''तुमने अपने आपको धोया'''
  rationale: यूनानी रूप मध्यवाच्य है, पर इसके बाद के स्पष्ट कर्मवाच्य 'पवित्र किए गए' और 'धर्मी ठहराए गए' इसे उद्धारकारी क्रियाओं की शृंखला में रखते हैं। रूपगत वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: ἐν का अर्थ दोनों अंतिम पदबंधों में
  choice: दोनों स्थानों पर 'में'
  alternative: साधनात्मक रूप से 'के द्वारा'
  rationale: ἐν स्थान/क्षेत्र अथवा साधन व्यक्त कर सकता है। समान हिन्दी रूप मूल की समानांतरता और धर्मवैज्ञानिक तनाव को बिना संकुचित किए बनाए रखता है।
- issue: πνεύματι का संदर्भ
  choice: परमेश्वर का आत्मा अर्थात पवित्र आत्मा
  alternative: सामान्य आध्यात्मिक क्षेत्र
  rationale: '''हमारे परमेश्वर का आत्मा'' पौलुस के प्रयोग में स्वाभाविक रूप से पवित्र आत्मा को सूचित करता है, फिर भी पद में अनुपस्थित ''पवित्र'' शब्द मुख्य पाठ में नहीं जोड़ा गया।'
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। 'पवित्र किए गए' और 'धर्मी ठहराए गए' परिचित बाइबलीय शब्दावली रखते हुए स्पष्ट हैं। दोहराया गया 'पर' मूल की जोरदार लय को सुरक्षित रखता है।
