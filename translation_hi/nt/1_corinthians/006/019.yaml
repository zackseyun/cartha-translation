id: 1CO.6.19
reference: 1 Corinthians 6:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/019.yaml
  text: Or do you not know that your body is a temple of the Holy Spirit within you[a], whom you have from God? And you are not your own[b],
translation:
  language: hi
  text: या क्या तुम नहीं जानते कि तुम्हारी देह उस पवित्र आत्मा का मंदिर है, जो तुममें है और जिसे तुमने परमेश्वर से पाया है? और तुम अपने नहीं हो[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: यूनानी में “देह” एकवचन है, जबकि “तुम्हारी” के लिए प्रयुक्त सर्वनाम बहुवचन है; इसे प्रत्येक व्यक्ति की देह के लिए वितरणात्मक रूप में या सामूहिक रूप से प्रतिनिधिक अर्थ में समझा जा सकता है।
    reason: मूल पाठ की संख्या-सम्बन्धी वास्तविक अस्पष्टता को स्पष्ट करना।
lexical_decisions:
- source_word: ἢ
  choice: या
  rationale: यह पिछले तर्क से जुड़ा हुआ तीखा आलंकारिक विकल्प प्रस्तुत करता है; ‘या’ इसे स्वाभाविक और संक्षिप्त रूप में बनाए रखता है।
- source_word: οὐκ οἴδατε
  choice: क्या तुम नहीं जानते
  rationale: यह पौलुस का सामान्य आलंकारिक प्रश्न है और οἶδα के सीधे अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: τὸ σῶμα ὑμῶν
  choice: तुम्हारी देह
  rationale: ‘देह’ तत्काल प्रसंग में शारीरिक देह को स्पष्ट करता है। यूनानी में ‘देह’ एकवचन और ‘तुम्हारी’ बहुवचन है; हिन्दी में यही रूप उस संरचना को बनाए रखता है।
- source_word: ναὸς
  choice: मन्दिर
  rationale: ναός विशेष रूप से पवित्र मन्दिर या गर्भगृह का बोध कराता है; ‘मन्दिर’ आधुनिक हिन्दी में रूपक की पवित्रता और स्पष्टता दोनों बनाए रखता है।
- source_word: τοῦ ἐν ὑμῖν ἁγίου πνεύματός
  choice: उस पवित्र आत्मा का ... जो तुममें है
  rationale: सम्बन्धकारक रचना को स्वाभाविक हिन्दी में इस प्रकार खोला गया है कि देह पवित्र आत्मा का मन्दिर है और आत्मा उनके भीतर है।
- source_word: οὗ ἔχετε ἀπὸ θεοῦ
  choice: जिसे तुमने परमेश्वर से पाया है
  rationale: हिन्दी में ‘परमेश्वर से पाया है’ वर्तमान प्राप्त-अधिकार और उसके स्रोत दोनों को स्वाभाविक रूप से व्यक्त करता है; οὗ का व्यक्तिगत सन्दर्भ ‘जिसे’ से सुरक्षित है।
- source_word: καὶ οὐκ ἐστὲ ἑαυτῶν
  choice: और तुम अपने नहीं हो
  rationale: यह संक्षिप्त हिन्दी मुहावरा इस अर्थ को बनाए रखता है कि वे स्वयं के स्वामी नहीं हैं, और अगले पद के कारण-वचन की भूमिका तैयार करता है।
theological_decisions:
- issue: सम्बन्धवाचक सर्वनाम οὗ का सन्दर्भ और पवित्र आत्मा का व्यक्तिगत उल्लेख
  choice: इसे पवित्र आत्मा से जोड़कर व्यक्तिगत ‘जिसे’ के रूप में अनूदित किया गया है।
  alternative: वाक्य को अव्यक्तिगत बनाकर ‘जो तुम्हें परमेश्वर से मिला है’ कहना।
  rationale: व्याकरणतः οὗ का सन्दर्भ ἁγίου πνεύματός है। ‘जिसे’ इस सन्दर्भ को स्पष्ट रखता है और पाठ से अधिक कोई अतिरिक्त सिद्धान्तात्मक भाषा नहीं जोड़ता।
- issue: बहुवचन श्रोताओं के साथ एकवचन ‘देह’
  choice: ‘तुम्हारी देह’ के रूप में एकवचन बनाए रखा गया है।
  alternative: ‘तुम्हारी देहें’ करना।
  rationale: यूनानी में τὸ σῶμα एकवचन और ὑμῶν बहुवचन है। स्रोत की इस सम्भावित वितरणात्मक या प्रतिनिधिक अस्पष्टता को बहुवचन बनाकर हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली अपनाई गई है। बहुवचन सम्बोधन के लिए ‘तुम’ रखा गया है। ‘देह’, ‘पवित्र आत्मा’, ‘मन्दिर’ और ‘परमेश्वर’ सामान्य बाइबिलीय शब्दावली हैं; वाक्य की आलंकारिक तीक्ष्णता और मूल की संख्या-सम्बन्धी अस्पष्टता सुरक्षित रखी गई है।
