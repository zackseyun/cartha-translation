source:
  edition: SBLGNT
  text: ἤδη μὲν ⸀οὖν ὅλως ἥττημα ὑμῖν ἐστιν ὅτι κρίματα ἔχετε μεθ’ ἑαυτῶν· διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε; διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/007.yaml
  text: Indeed[a], then, it is already altogether a defeat for you that you have lawsuits among yourselves[c][b]. Why not rather be wronged? Why not rather be defrauded?
translation:
  language: hi
  text: तो, यह तो पहले ही तुम्हारी हर तरह से हार है कि तुम्हारे बीच मुकदमे हैं। इसके बजाय तुम अन्याय क्यों नहीं सहते? इसके बजाय तुम्हें ठगा क्यों नहीं जाता?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हार’ का अनुवाद ‘हानि’ या ‘विफलता’ भी हो सकता है। यूनानी शब्द ἥττημα इन अर्थों को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘ठगा’ का अनुवाद ‘वंचित किया’ या ‘किसी चीज़ से محرूम किया’ भी हो सकता है। यूनानी क्रिया ἀποστερεῖσθε का अर्थ किसी वस्तु, धन, अधिकार या उचित हिस्से से वंचित किया जाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη μὲν οὖν ὅλως
  choice: वास्तव में ... अपने-आप में ही ... पूरी
  rationale: संयुक्त पदावली निष्कर्ष, बल और वर्तमान स्थिति को रेखांकित करती है। स्वाभाविक हिन्दी में यह बताती है कि मुकदमों का होना ही, उनके परिणाम से पहले, पूर्ण हार है।
- source_word: ἥττημα
  choice: हार
  rationale: यह शब्द हानि, विफलता या पराजय का अर्थ दे सकता है। ‘हार’ पौलुस के प्रबल नैतिक आकलन को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: κρίματα ἔχετε μεθ’ ἑαυτῶν
  choice: तुम्हारा आपस में मुकदमे चलाना
  rationale: संदर्भ में κρίματα न्यायालय में ले जाए गए कानूनी विवाद हैं; ‘आपस में’ समुदाय के भीतर के पारस्परिक संघर्ष को बनाए रखता है।
- source_word: διὰ τί οὐχὶ μᾶλλον ἀδικεῖσθε
  choice: इसके बजाय तुम अन्याय क्यों नहीं सह लेते?
  rationale: प्रश्न की आलंकारिक चुनौती, μᾶλλον का तुलनात्मक भाव और क्रिया का कर्मवाच्य अर्थ सुरक्षित रहते हैं।
- source_word: διὰ τί οὐχὶ μᾶλλον ἀποστερεῖσθε
  choice: इसके बजाय तुम अपना हक क्यों नहीं छिन जाने देते?
  rationale: ἀποστερέω वंचित करने, लूटने या धोखा देकर छीनने का अर्थ दे सकता है। यहाँ कर्मवाच्य और स्वेच्छा से हानि सह लेने की चुनौती को स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: विश्वासी समुदाय के भीतर मुकदमेबाजी का पौलुस द्वारा मूल्यांकन
  choice: ‘अपने-आप में ही तुम्हारी पूरी हार’
  alternative: ‘तुम्हारी हानि’ या ‘तुम्हारी विफलता’
  rationale: अनुवाद यह स्पष्ट करता है कि मुकदमों का अस्तित्व ही समुदाय की हार है, पर इसे किसी अतिरिक्त धर्मसैद्धांतिक श्रेणी—जैसे उद्धार की हानि—के रूप में परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘मुकदमे चलाना’ कानूनी संदर्भ को स्पष्ट करता है; ‘अपना हक छिन जाने देते’ सामान्य पाठक के लिए बोधगम्य है और यूनानी क्रिया की अर्थ-व्याप्ति को पादटिप्पणी में सुरक्षित रखता है।
