  text: πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔνι ἐν ὑμῖν ⸂οὐδεὶς σοφὸς⸃ ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ⸀ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/005.yaml
  text: I say this to your shame[a]. Is it really so[b], that there is not among you even one wise man who will be able to judge between his brothers?
translation:
  language: hi
  text: मैं यह तुम्हें लज्जित करने के लिए कहता हूँ। क्या सचमुच तुम्हारे बीच एक भी बुद्धिमान व्यक्ति नहीं है, जो एक भाई और दूसरे के बीच फैसला कर सके?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘अपने भाई के बीच’ है; ‘बीच’ के बाद दूसरा पक्ष संदर्भ से निहित है। ‘भाई’ यहाँ साथी विश्वासी के लिए है और संदर्भ में भाई या बहन दोनों को शामिल कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: तुम्हें लज्जित करने के लिए
  rationale: यह वाक्यांश पौलुस की फटकार और श्रोताओं को उनकी लज्जाजनक स्थिति का बोध कराने के उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὕτως
  choice: क्या सचमुच
  rationale: यहाँ यह शब्द आक्रोश और अविश्वास से भरे आलंकारिक प्रश्न का आरम्भ करता है; ‘क्या सचमुच’ उस बल को सहज हिन्दी में बनाए रखता है।
- source_word: οὐδεὶς σοφὸς
  choice: एक भी बुद्धिमान व्यक्ति नहीं
  rationale: ‘एक भी ... नहीं’ यूनानी नकार के जोर को व्यक्त करता है। ‘व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक है और मिली-जुली कलीसिया को संबोधन के अनुरूप है, जबकि एकवचन बना रहता है।
- source_word: δυνήσεται διακρῖναι
  choice: फैसला कर सके
  rationale: कानूनी विवाद के संदर्भ में διακρῖναι का अर्थ पक्षों के बीच निर्णय देना है। हिन्दी में ‘फैसला कर सके’ भावी सामर्थ्य और न्यायिक अर्थ दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ
  choice: अपने भाई-बंधुओं के बीच
  rationale: यूनानी पद ‘बीच’ के बाद एकवचन ‘अपने भाई’ कहकर संक्षिप्त और व्याकरणिक रूप से असामान्य है; विवाद के दो पक्ष संदर्भ से निहित हैं। ‘भाई-बंधुओं के बीच’ पारिवारिक संबोधन को रखते हुए हिन्दी में संबंध को स्पष्ट करता है।
theological_decisions:
- issue: मिली-जुली कलीसिया में पुल्लिंग प्रतिनिधिक भाषा
  choice: बुद्धिमान व्यक्ति ... भाई-बंधुओं
  alternative: बुद्धिमान पुरुष ... अपने भाई
  rationale: यूनानी में रूप पुल्लिंग एकवचन हैं, पर संबोधन पूरी कलीसिया से है। हिन्दी ‘व्यक्ति’ अनावश्यक रूप से अर्थ को केवल पुरुषों तक सीमित नहीं करता, और ‘भाई-बंधु’ विश्वासियों के पारिवारिक संबंध को बनाए रखता है।
- issue: ἀδελφοῦ के बाद ‘बीच’ की संक्षिप्त अभिव्यक्ति
  choice: भाई-बंधुओं के बीच
  alternative: अपने भाई के बीच
  rationale: शाब्दिक एकवचन हिन्दी में अधूरा और अस्पष्ट होगा। संदर्भ आपसी मुकदमों का है, इसलिए बहुवचन रूप निहित पक्षों को स्पष्ट करता है, बिना किसी खास न्यायिक व्यवस्था को पाठ में जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। आलंकारिक प्रश्न की तीखी फटकार बनी रहती है; ‘फैसला’ सामान्य पाठक के लिए सुबोध है और प्रसंग का न्यायिक स्वर भी बनाए रखता है।
