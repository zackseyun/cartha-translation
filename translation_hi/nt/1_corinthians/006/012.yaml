reference: 1 Corinthians 6:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Πάντα μοι ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. πάντα μοι ἔξεστιν· ἀλλ’ οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/012.yaml
  text: “All things are lawful for me,” but not all things are beneficial[c][b][a]. “All things are lawful for me,” but I will not be mastered by anything.
translation:
  language: hi
  text: “मेरे लिए सब कुछ जायज़ है,”[a] पर सब कुछ लाभदायक[b] नहीं। “मेरे लिए सब कुछ जायज़ है,” पर मैं किसी भी चीज़ के वश में नहीं होऊँगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या उद्धरण-चिह्नों के बिना: मेरे लिए सब कुछ जायज़ है। बहुत से लोग इस वाक्यांश को कुरिन्थियों का नारा मानते हैं, जिसे पौलुस उद्धृत करके फिर सीमित करता है।'
    reason: alternative_reading
  - marker: b
    text: या “हितकर” या “फ़ायदेमंद”।
    reason: lexical_alternative
  - marker: c
    text: या “मैं किसी भी चीज़ के अधिकार में नहीं लाया जाऊँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα μοι ἔξεστιν
  choice: मेरे लिए सब कुछ जायज़ है
  rationale: यह सहज आधुनिक हिन्दी में अनुमति या वैधता का भाव व्यक्त करता है और यूनानी वाक्यांश की व्यापक, नारे-जैसी संरचना को बनाए रखता है।
- source_word: ἀλλ’ οὐ πάντα συμφέρει
  choice: पर सब कुछ लाभदायक नहीं
  rationale: συμφέρει का अर्थ यहाँ हितकर या लाभ पहुँचाने वाला होना है। ‘लाभदायक’ नैतिक और व्यावहारिक हित दोनों को समेटता है और यूनानी में ‘सब कुछ’ की पुनरावृत्ति बचाता है।
- source_word: οὐκ ἐγὼ ἐξουσιασθήσομαι
  choice: पर मैं ... के वश में नहीं होऊँगा
  rationale: भविष्यत् कर्मवाच्य क्रिया किसी के अधिकार या नियंत्रण में आने को दर्शाती है। ‘वश में’ आधुनिक हिन्दी में नियंत्रण के भाव को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ὑπό τινος
  choice: किसी भी चीज़ के
  rationale: τινος व्याकरणतः व्यापक है; निकट प्रसंग में व्यवहारों और अभिलाषाओं को देखते हुए निर्जीव अर्थ स्वाभाविक है, जबकि ‘किसी भी’ इसकी व्यापकता बनाए रखता है।
theological_decisions:
- issue: क्या Πάντα μοι ἔξεστιν को कुरिन्थियों का नारा मानकर उद्धरण-चिह्न लगाए जाएँ
  choice: दोनों बार वाक्यांश को उद्धरण-चिह्नों में रखना
  alternative: उद्धरण-चिह्नों के बिना इसे पौलुस का अपना कथन मानना, जिसे अगला उपवाक्य सीमित करता है
  rationale: बहुत से पाठक इसे कुरिन्थियों का प्रचलित कथन मानते हैं जिसे पौलुस उद्धृत करके सुधारता है। मूल यूनानी पांडुलिपियों में उद्धरण-चिह्न नहीं थे, इसलिए यह सम्भावित किंतु निश्चित नहीं व्याख्या है; पादटिप्पणी में विकल्प सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जायज़’ प्रचलित मानक हिन्दी में अनुमति/वैधता का संक्षिप्त भाव देता है; ‘वश में’ नियंत्रण और प्रभुत्व की अर्थछाया को स्वाभाविक ढंग से व्यक्त करता है।
