  text: Ἢ οὐκ οἴδατε ὅτι ἄδικοι ⸂θεοῦ βασιλείαν⸃ οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/009.yaml
  text: 'Or do you not know that the unrighteous will not inherit the kingdom of God? Do not be deceived: neither the sexually immoral[a], nor idolaters, nor adulterers, nor effeminate men[b], nor men who have sex with men'
translation:
  language: hi
  text: 'या क्या तुम नहीं जानते कि अधर्मी परमेश्वर के राज्य के वारिस नहीं होंगे? धोखे में न पड़ो: न यौन-अनैतिक लोग, न मूर्तिपूजक, न व्यभिचारी, न स्त्रैण पुरुष[a], न पुरुषों के साथ संभोग करनेवाले[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक अर्थ “कोमल” या “नरम” हो सकता है; इसका अर्थ “स्त्रैण पुरुष,” नैतिक रूप से दुर्बल व्यक्ति, संभवतः पुरुष-वेश्या, या पुरुष-पुरुष संभोग में निष्क्रिय साथी भी समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी शब्द दुर्लभ है और उसके सटीक अर्थ पर मतभेद है। संभव अर्थ हैं: “पुरुषों के साथ संभोग करनेवाले” या अधिक व्यापक रूप से “पुरुषों के साथ अनुचित यौन-संबंध रखनेवाले।” बहुत-से विद्वान इसे यूनानी लैव्यव्यवस्था की शब्दावली से जोड़ते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: या
  rationale: पिछले तर्क से जुड़े तीखे आलंकारिक प्रश्न का स्वाभाविक संक्रमण बनाए रखता है।
- source_word: οὐκ οἴδατε
  choice: क्या तुम नहीं जानते
  rationale: पौलुस के परिचित आलंकारिक सूत्र को अर्थ और बल सहित सीधे व्यक्त करता है।
- source_word: ἄδικοι
  choice: अधर्मी
  rationale: यह केवल अलग-अलग गलत कामों के बजाय व्यापक नैतिक श्रेणी को बनाए रखता है।
- source_word: θεοῦ βασιλείαν
  choice: परमेश्वर के राज्य
  rationale: यूनानी संबंधकारक पदबंध का मानक और स्पष्ट बाइबलीय रूप है।
- source_word: κληρονομήσουσιν
  choice: वारिस नहीं होंगे
  rationale: विरासत पाने के वाचाई और भावी अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: μὴ πλανᾶσθε
  choice: धोखा न खाओ
  rationale: निषेधात्मक कर्मवाच्य चेतावनी को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: πόρνοι
  choice: यौन-अनैतिक लोग
  rationale: व्यापक लैंगिक अनैतिकता को व्यक्त करता है और किसी संकीर्ण या पुराने पद से बचता है।
- source_word: εἰδωλολάτραι
  choice: मूर्तिपूजक
  rationale: सीधा, मानक और सामान्य पाठकों के लिए सुबोध पर्याय है।
- source_word: μοιχοὶ
  choice: व्यभिचारी
  rationale: विवाह-संबंधी बेवफाई के विशिष्ट अर्थ को बनाए रखता है।
- source_word: μαλακοὶ
  choice: स्त्रैण पुरुष
  rationale: शब्द के मूल अर्थ ‘कोमल/नरम’ से विकसित स्त्रैणता के भाव को अपेक्षाकृत प्रत्यक्ष रखता है, जबकि संदर्भगत यौन अर्थ की अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: ἀρσενοκοῖται
  choice: पुरुषों के साथ यौन-संबंध रखनेवाले पुरुष
  rationale: दुर्लभ और विवादित शब्द को आधुनिक पहचान-श्रेणी बनाए बिना पुरुष-पुरुष यौन क्रिया के वर्णन के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: μαλακοὶ और ἀρσενοκοῖται का विवादित अर्थ
  choice: मुख्य पाठ में क्रमशः ‘स्त्रैण पुरुष’ और ‘पुरुषों के साथ यौन-संबंध रखनेवाले पुरुष’
  alternative: ‘कोमल पुरुष’ या ‘निष्क्रिय पुरुष यौन-साथी’; तथा ‘पुरुषों से अनुचित यौन-संबंध रखनेवाले’
  rationale: पहले पद के व्यापक और संदर्भगत यौन अर्थों के बीच की वास्तविक अनिश्चितता तथा दूसरे पद की दुर्लभता को छिपाया नहीं गया है। मुख्य पाठ पठनीय है और पादटिप्पणियाँ वैकल्पिक अर्थों को सुरक्षित रखती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, संबोधन में बहुवचन ‘तुम’; भाषा स्पष्ट, गंभीर और सामान्य पाठकों के लिए सुबोध रखी गई है। विवादित यौन-संबंधी पदों को आधुनिक पहचान-आधारित शब्दावली में बदलने के बजाय वर्णनात्मक ढंग से प्रस्तुत किया गया है।
