  edition: SBLGNT
  text: τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ ἀλλὰ τῷ κυρίῳ, καὶ ὁ κύριος τῷ σώματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/013.yaml
  text: Food is for the stomach[a], and the stomach for food—but God will do away with both it and them. But the body is not for sexual immorality, but for the Lord[c][b], and the Lord for the body.
translation:
  language: hi
  text: भोजन पेट के लिए है, और पेट भोजन के लिए—परन्तु परमेश्वर पेट और भोजन, दोनों को समाप्त कर देगा।[a] लेकिन शरीर यौन अनैतिकता के लिए नहीं, बल्कि प्रभु के लिए है, और प्रभु शरीर के लिए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘समाप्त कर देगा’ का अनुवाद ‘नष्ट कर देगा’, ‘हटा देगा’ या ‘निष्प्रभावी कर देगा’ भी हो सकता है। यूनानी में ‘भोजन’ के लिए बहुवचन शब्द है।
    reason: lexical_alternative
  - marker: b
    text: बहुत-से व्याख्याकार ‘भोजन पेट के लिए है, और पेट भोजन के लिए’ को कुरिन्थियों का एक कथन मानते हैं, जिसे पौलुस यहाँ उद्धृत करके सुधारता है; किन्तु यूनानी पाठ इसे स्पष्ट रूप से उद्धरण के रूप में चिह्नित नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ βρώματα
  choice: भोजन
  rationale: यूनानी में बहुवचन है, पर सामान्य कथन में हिन्दी का समूहवाचक एकवचन ‘भोजन’ अधिक स्वाभाविक है और सभी प्रकार के खाने का भाव बनाए रखता है।
- source_word: τῇ κοιλίᾳ / ἡ κοιλία
  choice: पेट
  rationale: यहाँ पाचन और शारीरिक भूख का संदर्भ है; आधुनिक हिन्दी में ‘पेट’ सबसे स्पष्ट और सहज समतुल्य है।
- source_word: καταργήσει
  choice: समाप्त कर देगा
  rationale: क्रिया किसी वस्तु या व्यवस्था को निष्प्रभावी करने अथवा उसका अंत कर देने का भाव रखती है। यह चयन विनाश या सर्वथा मिटा देने का अर्थ अनावश्यक रूप से नहीं थोपता।
- source_word: ταύτην καὶ ταῦτα
  choice: इसको और उसको, दोनों को
  rationale: भिन्न लिंग और वचन वाले यूनानी सर्वनाम क्रमशः पेट और भोजनों की ओर संकेत करते हैं। हिन्दी में स्वाभाविकता के लिए दोनों संकेतों को संक्षिप्त रखा गया है।
- source_word: τὸ σῶμα
  choice: शरीर
  rationale: पौलुस के इस प्रसंग में ठोस मानवीय देह अभिप्रेत है; ‘शरीर’ मानक और गरिमापूर्ण हिन्दी रूप है।
- source_word: τῇ πορνείᾳ
  choice: यौन अनैतिकता
  rationale: यह व्यापक अनुचित यौन आचरण को व्यक्त करता है और आधुनिक पाठक के लिए स्पष्ट है; ‘व्यभिचार’ यहाँ आवश्यकता से अधिक संकीर्ण हो सकता है।
- source_word: τῷ κυρίῳ / ὁ κύριος
  choice: प्रभु
  rationale: यहाँ यीशु के लिए प्रयुक्त उपाधि और शरीर के साथ उनका धर्मवैचारिक संबंध अभिप्रेत है; ‘प्रभु’ उस भार को बनाए रखता है।
- source_word: δὲ
  choice: परन्तु / लेकिन
  rationale: दोनों प्रयोग कथन के भीतर विरोध को स्पष्ट करते हैं। पहले स्थान पर ‘परन्तु’ और दूसरे पर ‘लेकिन’ स्वाभाविक हिन्दी प्रवाह बनाए रखते हैं।
theological_decisions:
- issue: क्या आरम्भिक वाक्य कुरिन्थियों का उद्धृत नारा है
  choice: उद्धरण-चिह्न या ‘तुम कहते हो’ जोड़े बिना कथन को सीधे प्रस्तुत करना
  alternative: इसे कुरिन्थियों के नारे के रूप में उद्धरण-चिह्नों में रखना
  rationale: यूनानी पाठ स्वयं उद्धरण को स्पष्ट रूप से चिह्नित नहीं करता। डैश से अगले कथन का विरोध उभरता है, पर व्याख्यात्मक निर्णय मुख्य पाठ पर थोपा नहीं जाता।
- issue: καταργήσει का भाव
  choice: भविष्य में समाप्त कर देना
  alternative: दोनों को नष्ट कर देना
  rationale: यह उस अस्थायी भोजन-पेट व्यवस्था के अंत या निष्प्रभावी होने को व्यक्त करता है और भौतिक विनाश के प्रश्न को अनावश्यक रूप से तय नहीं करता।
- issue: ‘प्रभु शरीर के लिए’ का आशय
  choice: संक्षिप्त पारस्परिक अभिव्यक्ति को यथावत रखना
  alternative: ‘प्रभु शरीर की देखभाल करते हैं’ जैसे व्याख्यात्मक विस्तार का प्रयोग
  rationale: यूनानी वाक्य जानबूझकर संक्षिप्त और समानांतर है। विस्तार करने से प्रभु और शरीर के संबंध का स्वरूप पाठ से अधिक निश्चित हो जाएगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, स्पष्ट और गरिमापूर्ण शैली रखी गई है। ‘भोजन’, ‘पेट’, ‘शरीर’ और ‘प्रभु’ सामान्य पाठक के लिए सहज हैं। मूल की संक्षिप्त समानांतर रचना और संभावित उद्धरण की अस्पष्टता सुरक्षित रखी गई है।
