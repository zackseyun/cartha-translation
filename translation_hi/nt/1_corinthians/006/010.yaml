  text: οὔτε ⸂κλέπται οὔτε πλεονέκται⸃, ⸀οὐ μέθυσοι, οὐ λοίδοροι, οὐχ ἅρπαγες βασιλείαν ⸀θεοῦ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/010.yaml
  text: nor thieves[a], nor the greedy, nor drunkards, nor revilers[c][b], nor swindlers will inherit the kingdom of God.
translation:
  language: hi
  text: न चोर, न लोभी[a], न पियक्कड़, न गाली-गलौज करनेवाले[b], और न दूसरों की संपत्ति हड़पनेवाले[c] परमेश्वर के राज्य के वारिस नहीं होंगे[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लालची।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात् जो अपमानजनक और कटु वाणी से दूसरों को बुरा-भला कहते हैं।
    reason: lexical_clarification
  - marker: c
    text: या “जबरन धन ऐंठनेवाले” अथवा “लूटनेवाले।”
    reason: lexical_alternative
  - marker: d
    text: अर्थात् उन्हें परमेश्वर के राज्य में विरासत का हिस्सा नहीं मिलेगा।
    reason: idiom_clarification
lexical_decisions:
- source_word: κλέπται
  choice: चोर
  rationale: चोरी करनेवालों के लिए यह सहज और मानक हिन्दी शब्द है तथा दोष-सूची की संक्षिप्त शैली बनाए रखता है।
- source_word: πλεονέκται
  choice: लोभी
  rationale: यह उन लोगों को सूचित करता है जिनकी पहचान अधिक पाने की लालसा से होती है। ‘लोभी’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: μέθυσοι
  choice: पियक्कड़
  rationale: यह केवल कभी नशे में होने की घटना नहीं, बल्कि मद्यपान की आदत से पहचाने जानेवाले व्यक्ति को दर्शाता है। ‘पियक्कड़’ प्रचलित और सहज है।
- source_word: λοίδοροι
  choice: गाली-गलौज करनेवाले
  rationale: शब्द अपमानजनक और कटु वाणी से दूसरों को बुरा-भला कहनेवालों को दर्शाता है; यह ‘निन्दा करनेवाले’ से अधिक व्यापक और आधुनिक हिन्दी में अधिक स्पष्ट है।
- source_word: ἅρπαγες
  choice: दूसरों का धन हड़पनेवाले
  rationale: यह लालच से दूसरों की संपत्ति छीनने, ऐंठने या उनका शोषण करनेवालों को दर्शाता है। यह अनुवाद ‘चोर’ से भेद रखते हुए मूल के हिंसक अथवा शोषक अधिग्रहण का व्यापक भाव रखता है।
- source_word: βασιλείαν θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह स्थापित हिन्दी अभिव्यक्ति परमेश्वर के शासन और राज्य, दोनों की धर्मवैचारिक प्रतिध्वनि बनाए रखती है।
- source_word: κληρονομήσουσιν
  choice: वारिस होंगे
  rationale: यह विरासत में हिस्सा पाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और मूल के भावी तथा उत्तराधिकार-संबंधी अर्थ को बनाए रखता है।
theological_decisions:
- issue: दोष-सूची में व्यक्तियों का चरित्र और राज्य की विरासत
  choice: सूची को ऐसे संज्ञात्मक बहुवचन रूपों में रखा गया है जो इन आचरणों से पहचाने जानेवाले लोगों को दर्शाते हैं, पर मुख्य पाठ में ‘आदतन’ या ‘अपश्चातापी’ जैसे व्याख्यात्मक विशेषण नहीं जोड़े गए।
  alternative: इसे किसी भी एक पृथक कृत्य के लिए स्वतः लागू कथन के रूप में स्पष्ट करना, अथवा केवल ‘अपश्चातापी जीवन-शैली’ कहकर सीमित करना।
  rationale: यूनानी दोष-सूची व्यक्तियों की श्रेणियाँ बताती है, जबकि पद स्वयं पश्चाताप, आवृत्ति या अंतिम न्याय की विस्तृत शर्तें स्पष्ट नहीं करता। अनुवाद इस तनाव को अनसुलझा रखता है।
- issue: κληρονομέω का राज्य-संबंधी अर्थ
  choice: ‘परमेश्वर के राज्य के वारिस होंगे’ द्वारा उत्तराधिकार की रूपक-भाषा सुरक्षित रखी गई है।
  alternative: ‘परमेश्वर के राज्य में प्रवेश करेंगे’ या ‘उसमें हिस्सा पाएँगे।’
  rationale: ‘प्रवेश’ अर्थ को सरल करता है, पर मूल की विरासत और हिस्सेदारी की छवि खो देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोष-सूची की संक्षिप्त लय बनाए रखने के लिए समानांतर ‘न’ संरचना अपनाई गई है। ‘गाली-गलौज करनेवाले’ और ‘दूसरों का धन हड़पनेवाले’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि पादटिप्पणियाँ मूल शब्दों की वैकल्पिक अर्थ-सीमा सुरक्षित रखती हैं।
