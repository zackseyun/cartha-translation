  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: φεύγετε τὴν πορνείαν· πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν, ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/018.yaml
  text: Flee sexual immorality. Every sin that a person may commit is outside the body[a], but the one who commits sexual immorality sins against his own body.
translation:
  language: hi
  text: यौन अनैतिकता से भागो। मनुष्य जो भी पाप करता है, हर ऐसा पाप शरीर के बाहर है[a]; पर जो यौन अनैतिकता करता है, वह अपने ही शरीर के विरुद्ध पाप करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह कथन व्याख्या की दृष्टि से कठिन है। मूल पाठ सीधे कहता है, “शरीर के बाहर है”; वह यह स्पष्ट नहीं करता कि इसे किस सीमा में समझना चाहिए।
    reason: exegetical_ambiguity
lexical_decisions:
- source_word: φεύγετε
  choice: भागो
  rationale: वर्तमानकालीन बहुवचन आज्ञार्थक रूप तत्काल और निरंतर दूरी बनाए रखने का आह्वान करता है; ‘भागो’ उसकी तीव्रता और संक्षिप्तता बनाए रखता है।
- source_word: πορνείαν / πορνεύων
  choice: व्यभिचार / व्यभिचार करता है
  rationale: यहाँ शब्द व्यापक रूप से निषिद्ध यौन आचरण को सूचित करता है। ‘व्यभिचार’ हिंदी बाइबलीय प्रयोग में परिचित और गरिमापूर्ण है, यद्यपि सामान्य आधुनिक प्रयोग में कभी-कभी इसका अर्थ विवाहित व्यक्ति के विवाहेतर संबंध तक सीमित समझा जा सकता है; इसलिए पादटिप्पणी में व्यापक आशय स्पष्ट किया गया है।
- source_word: πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος
  choice: मनुष्य जो भी पाप करता है
  rationale: ‘मनुष्य’ ἄνθρωπος के प्रतिनिधिक, सामान्य अर्थ को स्वाभाविक हिंदी में व्यक्त करता है; ‘जो भी’ सार्वत्रिक और संभाव्य भाव को सहज रूप से समेटता है।
- source_word: ἐκτὸς τοῦ σώματός ἐστιν
  choice: शरीर के बाहर है
  rationale: यह यूनानी के स्थानगत रूपक को सीधे बनाए रखता है और अगली उपवाक्य की तुलना को बिना व्याख्यात्मक समाधान के सुरक्षित रखता है।
- source_word: εἰς τὸ ἴδιον σῶμα ἁμαρτάνει
  choice: अपने ही शरीर के विरुद्ध पाप करता है
  rationale: ‘के विरुद्ध’ इस प्रसंग में εἰς का स्वाभाविक हिंदी अर्थ देता है; ‘अपने ही’ ἴδιον के आत्म-संबंधी बल को बनाए रखता है।
theological_decisions:
- issue: ‘हर पाप शरीर के बाहर है’ कथन का विवादित अर्थ
  choice: कथन को सीधे अनूदित कर उसकी व्याख्यात्मक कठिनाई बनाए रखना
  alternative: इसे कुरिन्थियों का उद्धृत नारा मानना या मुख्य पाठ में धर्मवैज्ञानिक सीमा जोड़ना
  rationale: यूनानी पाठ कथन को प्रत्यक्ष रूप में देता है। अनुवाद को यह तय नहीं करना चाहिए कि यह उद्धरण है, पूर्ण निरपेक्ष दावा है, या किसी सीमित अर्थ में कहा गया है।
- issue: ἄνθρωπος का सामान्य प्रतिनिधिक प्रयोग
  choice: मनुष्य
  alternative: पुरुष / कोई व्यक्ति
  rationale: इस संदर्भ में ἄνθρωπος मानव व्यक्ति को सामान्य रूप से दर्शाता है। ‘मनुष्य’ उसके व्याकरणिक रूप और प्रतिनिधिक व्यापकता दोनों को स्वाभाविक हिंदी में रखता है।
- issue: πορνεία की व्यापकता
  choice: मुख्य पाठ में ‘व्यभिचार’, पादटिप्पणी में व्यापक अर्थ की सूचना
  alternative: यौन अनैतिकता
  rationale: ‘व्यभिचार’ संक्षिप्त, प्रतिष्ठित और हिंदी बाइबलीय पाठकों के लिए परिचित है, पर संभावित संकीर्ण आधुनिक अर्थ के कारण पादटिप्पणी आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, आज्ञात्मक और गरिमापूर्ण शैली रखी गई है। मुख्य पाठ में ‘व्यभिचार’ के पहले प्रयोग पर [b] चिह्न आवश्यक है, ताकि पादटिप्पणी का संकेत पाठ में उपस्थित रहे।
