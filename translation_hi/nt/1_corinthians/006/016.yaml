id: 1CO.6.16
reference: 1 Corinthians 6:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/016.yaml
  text: Or do you not know that the one who joins himself to a prostitute is one body with her? For[a], as he says[b], “The two will become one flesh.”
translation:
  language: hi
  text: या क्या तुम नहीं जानते कि जो वेश्या से जुड़ता है, वह उसके साथ एक देह हो जाता है? क्योंकि वह कहता है,[a] “वे दोनों एक तन हो जाएंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “वह कहता है”; यह उद्धरण उत्पत्ति 2:24 से है।
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: या
  rationale: यह पिछले तर्क को आगे बढ़ाते हुए एक अलंकारिक विकल्प प्रस्तुत करता है; सरल ‘या’ पौलुस के तर्क-प्रवाह को बनाए रखता है।
- source_word: οὐκ οἴδατε
  choice: क्या तुम नहीं जानते
  rationale: यह पौलुस की प्रचलित अलंकारिक प्रश्न-शैली का स्वाभाविक और मूल के निकट हिन्दी रूप है।
- source_word: ὁ κολλώμενος
  choice: जो ... से जुड़ता है
  rationale: κολλάομαι का अर्थ जुड़ना, एक होना या लिपटना हो सकता है। यहाँ यौन-संबंध के प्रसंग में ‘जुड़ता है’ स्पष्ट है और कर्ता की भागीदारी को व्यक्त करता है।
- source_word: τῇ πόρνῃ
  choice: वेश्या से
  rationale: πόρνη विशेष रूप से वेश्या को सूचित करता है, न कि सामान्यतः किसी अनैतिक स्त्री को। यूनानी निश्चित उपपद यहाँ वर्ग-सूचक है।
- source_word: ἓν σῶμά ἐστιν
  choice: वह उसके साथ एक देह हो जाता है
  rationale: यूनानी में शाब्दिक रूप से ‘एक देह है’ है; हिन्दी में ‘उसके साथ’ निहित संबंध को स्पष्ट करता है और ‘हो जाता है’ इस संयोग के परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Ἔσονται γάρ
  choice: क्योंकि ... होंगे
  rationale: γάρ पौलुस के दावे का शास्त्रीय आधार देता है। भविष्यकालीन ἔσονται को उद्धरण में ‘होंगे’ से निकटता से रखा गया है।
- source_word: φησίν
  choice: वह कहता है
  rationale: यह यूनानी के एकवचन और अस्पष्ट कर्ता को सुरक्षित रखता है; अनुवाद कर्ता को ‘परमेश्वर’ या ‘पवित्रशास्त्र’ कहकर अतिरिक्त रूप से निर्धारित नहीं करता।
- source_word: οἱ δύο
  choice: वे दोनों
  rationale: यह यूनानी पद का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: εἰς σάρκα μίαν
  choice: एक तन
  rationale: उत्पत्ति 2:24 के संबंधपरक और शारीरिक अर्थ को ‘एक तन’ सहज हिन्दी में व्यक्त करता है तथा σάρξ को यहाँ ‘पापी स्वभाव’ जैसे अर्थ में लेने से बचाता है।
theological_decisions:
- issue: विवाह के बाहर यौन-संबंध पर उत्पत्ति के उद्धरण का निहितार्थ
  choice: उद्धरण को पौलुस के इस दावे के आधार के रूप में सीधे प्रस्तुत किया गया है कि वेश्या के साथ यौन-संबंध वास्तविक शारीरिक ‘एक तन’ का संयोग बनाता है।
  alternative: उद्धरण को केवल विवाह पर लागू मानना, या पद में विवाह और नैतिक परिणामों पर अतिरिक्त व्याख्या जोड़ना।
  rationale: पौलुस उत्पत्ति 2:24 को वेश्या के साथ संभोग पर तुलनात्मक रूप से लागू करता है। अनुवाद इस तनाव को बनाए रखता है, पर पद के शब्दों से आगे कोई सांप्रदायिक या नैतिक विस्तार नहीं जोड़ता।
- issue: φησίν का अस्पष्ट कर्ता
  choice: ‘वह कहता है’ रखकर यूनानी की व्याकरणिक अस्पष्टता सुरक्षित रखी गई है।
  alternative: ‘पवित्रशास्त्र कहता है’ या ‘परमेश्वर कहता है’।
  rationale: दोनों वैकल्पिक अर्थ संदर्भतः संभव हैं, पर वे यूनानी पाठ की अपेक्षा कर्ता को अधिक स्पष्ट कर देते हैं। स्रोत-संदर्भ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘देह’ और ‘तन’ का भेद क्रमशः σῶμα और σάρξ के शब्दगत भेद को संकेत करता है, बिना कृत्रिम कठोरता के।
