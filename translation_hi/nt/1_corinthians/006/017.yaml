  text: पर जो प्रभु से जुड़ता है, वह उसके साथ एक आत्मा हो जाता है[a][b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो प्रभु से जुड़ा है।” यूनानी क्रिया का अर्थ स्वयं जुड़ना या किसी से जुड़ा होना—दोनों प्रकार से व्यक्त किया जा सकता है।
