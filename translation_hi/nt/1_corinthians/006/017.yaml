  - marker: b
    text: या केवल “वह एक आत्मा हो जाता है।” “उसके साथ” मूल यूनानी में निहित है और हिन्दी में स्पष्टता के लिए जोड़ा गया है।
    reason: lexical_alternative
  - marker: c
    text: कुछ व्याख्याकार यहाँ “आत्मा” को परमेश्वर की आत्मा के संदर्भ में समझते हैं। यूनानी में बड़े और छोटे अक्षरों का भेद नहीं है; यह वाक्य विश्वासी के प्रभु के साथ आत्मिक एकत्व को भी व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: κολλώμενος (κολλάομαι)
  choice: जुड़ता है
  rationale: यह शब्द निकटता से जुड़ने या लग जाने का भाव व्यक्त करता है। पिछले पद में शारीरिक मिलन के साथ तुलना होने के कारण “जुड़ता है” उस संबंधात्मक समानता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κυρίῳ (κύριος)
  choice: प्रभु
  rationale: पौलुस के इस संदर्भ में यह जी उठे यीशु को दर्शाता है; “प्रभु” इसके अधिकार और धर्मवैज्ञानिक महत्त्व, दोनों को सुरक्षित रखता है।
- source_word: ἓν
  choice: एक
  rationale: मूल शब्द वास्तविक एकता को व्यक्त करता है, केवल समान विचार या उद्देश्य को नहीं।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: यहाँ यह शब्द सबसे स्वाभाविक रूप से प्रभु के साथ विश्वासी की आत्मिक एकता बताता है। हिन्दी में बड़े और छोटे अक्षरों का भेद न होने के कारण सम्भावित “आत्मा/पवित्र आत्मा” व्याख्या को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ὁ δὲ ... ἐστιν
  choice: पर जो ... वह ... है
  rationale: संज्ञा के रूप में प्रयुक्त यूनानी कृदन्त को यह प्रतिनिधिक और सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: “एक आत्मा” में व्यक्त एकता का स्वरूप
  choice: इसे प्रभु के साथ वास्तविक आत्मिक एकता के रूप में प्रस्तुत किया गया है, पर विश्वासी और प्रभु के बीच का भेद समाप्त नहीं किया गया।
  alternative: इसे पूर्ण रहस्यात्मक अभिन्नता, अथवा केवल समान मनोभाव और उद्देश्य, के अर्थ में लेना।
  rationale: संदर्भ में पौलुस पिछले पद के शारीरिक मिलन की तुलना प्रभु के साथ आत्मिक एकता से करता है। “उसके साथ एक आत्मा” एकता की प्रबलता और संबंधात्मक स्वरूप, दोनों को बनाए रखता है।
- issue: मूल यूनानी में निहित संबंधसूचक पद को स्पष्ट करना
  choice: स्पष्टता के लिए “उसके साथ” जोड़ा गया है।
  alternative: केवल “वह एक आत्मा है” कहना।
  rationale: यूनानी में संबंध संदर्भ से निहित है, जबकि हिन्दी में “उसके साथ” यह स्पष्ट करता है कि एकता विश्वासी और प्रभु के बीच है।
- issue: πνεῦμα को मानवीय आत्मा या पवित्र आत्मा के संदर्भ में समझना
  choice: मुख्य पाठ में “आत्मा” रखा गया है और सर्वाधिक स्वाभाविक अर्थ को प्रभु के साथ आत्मिक एकता माना गया है।
  alternative: इसे सीधे “पवित्र आत्मा” के रूप में स्पष्ट करना।
  rationale: मूल यूनानी वर्तनी इस व्याख्यात्मक प्रश्न को तय नहीं करती। इसलिए मुख्य पाठ में “पवित्र” जोड़कर सम्भावित अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
