    text: अथवा “अन्यायियों।” कुछ अनुवाद इसका अर्थ खोलकर “अविश्वासियों” लिखते हैं, पर यूनानी में “अधर्मी” या “अन्यायी” शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τολμᾷ
  choice: साहस करता है
  rationale: पौलुस के अलंकारिक प्रश्न और संदर्भ में दुस्साहस की छाया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τις ὑμῶν
  choice: तुममें से कोई
  rationale: अनिश्चित एकवचन और समुदाय को किए गए सीधे संबोधन, दोनों को सुरक्षित रखता है।
- source_word: πρᾶγμα ἔχων
  choice: मामला होने पर
  rationale: न्यायिक संदर्भ को स्पष्ट करता है, पर यूनानी से आगे बढ़कर इसे किसी खास प्रकार का मुकदमा नहीं ठहराता।
- source_word: πρὸς τὸν ἕτερον
  choice: किसी दूसरे के विरुद्ध
  rationale: विवाद अथवा न्यायिक विरोध के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κρίνεσθαι
  choice: न्याय कराने
  rationale: 'मध्य/निष्क्रिय infinitive के न्यायिक आशय को हिन्दी में सहज रूप से व्यक्त करता है: अपना मामला निर्णय के लिए प्रस्तुत करना।'
- source_word: ἐπὶ τῶν ἀδίκων
  choice: अधर्मियों के सामने
  rationale: ἀδίκων के नैतिक-धार्मिक अर्थ को सुरक्षित रखता है और इसे व्याख्यात्मक रूप से केवल ‘अविश्वासी’ नहीं बनाता।
- source_word: καὶ οὐχὶ
  choice: और ... नहीं
  rationale: यूनानी में व्यक्त सीधे विरोध को बिना अतिरिक्त बल जोड़े बनाए रखता है।
- source_word: ἐπὶ τῶν ἁγίων
  choice: पवित्र लोगों के सामने
  rationale: ἁγίων का शाब्दिक अर्थ और पौलुस द्वारा परमेश्वर के लोगों के लिए इसका सामुदायिक प्रयोग, दोनों स्पष्ट करता है; ‘संतों’ से जुड़ी आधुनिक संप्रदायगत भ्रांति से बचता है।
theological_decisions:
- issue: ἀδίκων और ἁγίων के बीच विरोध
  choice: अधर्मियों ... पवित्र लोगों
  alternative: अविश्वासियों ... विश्वासियों
  rationale: मूल यूनानी नैतिक और धार्मिक रूप से अर्थपूर्ण शब्दों का प्रयोग करता है। अनुवाद उस तनाव को बनाए रखता है और उन्हें केवल सामाजिक पहचान में नहीं बदलता।
- issue: ἔχων का प्रतिनिधिक पुल्लिंग एकवचन
  choice: लिंग-निरपेक्ष हिन्दी संरचना ‘मामला होने पर’
  alternative: जब उसका मामला हो
  rationale: यूनानी का एकवचन प्रतिनिधिक है। हिन्दी की कृदंत-संरचना अर्थ को पूर्णतः रखती है और अनावश्यक रूप से किसी एक लिंग को प्रमुख नहीं बनाती।
- issue: ἅγιοι का सामुदायिक अर्थ
  choice: पवित्र लोग
  alternative: संत
  rationale: यहाँ शब्द परमेश्वर के समस्त पवित्र लोगों, अर्थात विश्वासियों, को सूचित करता है; हिन्दी में ‘पवित्र लोग’ इस व्यापक अर्थ को अधिक सीधे व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। न्यायिक प्रसंग के लिए ‘मामला’ और ‘न्याय कराने’ का प्रयोग किया गया है। मूल के नैतिक-धार्मिक विरोध को व्याख्यात्मक रूप से समतल नहीं किया गया।
