translation:
  language: hi
  text: क्या तुममें से कोई ऐसा है कि किसी दूसरे के विरुद्ध कोई मामला होने पर वह पवित्र लोगों के सामने नहीं, बल्कि अधर्मियों[a] के सामने न्याय के लिए जाने का साहस करता है?
  philosophy: optimal-equivalence
  footnotes:
