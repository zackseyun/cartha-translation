  text: Do you not know that we will judge angels? How much more[a], the things of this life!
translation:
  language: hi
  text: क्या तुम नहीं जानते कि हम स्वर्गदूतों का न्याय करेंगे? तो फिर इस जीवन के मामलों का न्याय तो और भी अधिक करेंगे![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर इस जीवन के मामलों की तो बात ही क्या!” अथवा, “फिर इस जीवन के मामलों का तो और भी अधिक न्याय करेंगे!”
    reason: μήτιγε बड़े से छोटे की ओर तर्क को बल देता है; यूनानी में दूसरे खंड की क्रिया निहित है।
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: क्या तुम नहीं जानते
  rationale: पौलुस के परिचित आलंकारिक प्रश्न की औपचारिक शक्ति बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀγγέλους
  choice: स्वर्गदूतों
  rationale: इस भावी न्याय-संदर्भ में यह शब्द मानवीय संदेशवाहकों के बजाय स्वर्गीय प्राणियों को सूचित करता है।
- source_word: κρινοῦμεν
  choice: हम ... न्याय करेंगे
  rationale: भविष्यकाल को स्पष्ट रखता है और न्याय करने की रीति या सीमा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: μήτιγε
  choice: तो फिर ... क्यों नहीं
  rationale: 'यह बड़े से छोटे की ओर दिए गए तर्क को सहज हिन्दी में व्यक्त करता है: यदि स्वर्गदूतों का न्याय करेंगे, तो सांसारिक मामलों का निश्चय ही कर सकते हैं।'
- source_word: βιωτικά
  choice: इस जीवन के मामलों
  rationale: यह साधारण सांसारिक जीवन से संबंधित विषयों का व्यापक अर्थ बनाए रखता है और प्रसंग के विवादों तक इसे अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: विश्वासियों द्वारा स्वर्गदूतों का न्याय
  choice: हम स्वर्गदूतों का न्याय करेंगे
  alternative: हम पतित स्वर्गदूतों को दण्ड देंगे / हम स्वर्गदूतों पर शासन करेंगे
  rationale: मूल पाठ न तो स्वर्गदूतों के किसी वर्ग को निर्दिष्ट करता है, न न्याय की रीति को; इसलिए कथन को बिना व्याख्यात्मक विस्तार के रखा गया है।
- issue: μήτιγε से व्यक्त तुलनात्मक तर्क
  choice: तो फिर इस जीवन के मामलों का क्यों नहीं
  alternative: इस जीवन के मामले तो कहीं अधिक / इस जीवन के मामलों की तो बात ही क्या
  rationale: मूल का आशय बड़े विषय से छोटे विषय की ओर तर्क करना है। मुख्य पाठ में स्वाभाविक हिन्दी दी गई है, जबकि वैकल्पिक अलंकारिक रूप पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। प्रश्नोत्तर की तीक्ष्ण आलंकारिक शैली रखी गई है; ‘न्याय’ कानूनी और विवेकपूर्ण निर्णय—दोनों संभावनाओं को खुला रखता है।
