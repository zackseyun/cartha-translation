  text: ὁ δὲ θεὸς καὶ τὸν κύριον ἤγειρεν καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/014.yaml
  text: And God raised the Lord and will also raise us by his power.
translation:
  language: hi
  text: और परमेश्वर ने प्रभु को जिलाया, और वह अपनी सामर्थ्य से हमें भी जिलाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ तर्क को आगे बढ़ाने वाला हल्का संयोजक है; ‘और’ अनावश्यक विरोध प्रकट किए बिना स्वाभाविक प्रवाह देता है।
- source_word: θεὸς
  choice: परमेश्वर
  rationale: θεός के लिए मानक, गरिमापूर्ण हिन्दी रूप; वही पुनरुत्थान का कर्ता है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: κύριος यहाँ यीशु के लिए मसीही पदवी है; ‘प्रभु’ इसका स्वाभाविक और प्रचलित हिन्दी रूप है।
- source_word: ἤγειρεν
  choice: मरे हुओं में से जिलाया
  rationale: ἐγείρω यहाँ परमेश्वर द्वारा यीशु को मृत्यु से उठाने का संकेत देता है। ‘जिलाया’ हिन्दी में पुनरुत्थान का भाव स्पष्ट करता है; ‘मरे हुओं में से’ अर्थ-स्पष्टता के लिए निहित प्रसंग को व्यक्त करता है।
- source_word: ἡμᾶς
  choice: हमें
  rationale: यह विश्वासियों को सम्मिलित रूप से सूचित करने वाला प्रथम पुरुष बहुवचन कर्म है।
- source_word: ἐξεγερεῖ
  choice: जिलाएगा
  rationale: भविष्यकालीन ἐξεγείρω पहले पुनरुत्थान-क्रिया के समानांतर है; ‘जिलाएगा’ भविष्य में विश्वासियों के पुनरुत्थान को सहज हिन्दी में व्यक्त करता है। साथ का καί ‘भी’ द्वारा व्यक्त है।
- source_word: διὰ τῆς δυνάμεως αὐτοῦ
  choice: अपनी सामर्थ्य से
  rationale: सम्बन्धकारक के साथ διά साधन बताता है। कर्ता परमेश्वर होने के कारण αὐτοῦ को ‘अपनी’ कहना हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: भविष्यकालीन वाक्यांश में पुनरुत्थान का आशय
  choice: विश्वासियों का भविष्य का शारीरिक पुनरुत्थान
  alternative: सामान्य ईश्वरीय समर्थन या रूपकात्मक आत्मिक उठाया जाना
  rationale: निकटवर्ती प्रसंग शरीर से संबंधित है (6:13–20), और ‘प्रभु को...जिलाया’ के साथ समानांतरता वास्तविक भावी पुनरुत्थान की ओर दृढ़ता से संकेत करती है। अनुवाद केवल क्रिया को व्यक्त करता है और अनावश्यक सिद्धान्तगत विस्तार नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण बाइबलीय शैली। ‘सामर्थ्य’ धार्मिक संदर्भ में परिचित है और δύναμις के प्रभावी सामर्थ्य का भाव रखता है। पद छोटा और समानांतर रखा गया है।
