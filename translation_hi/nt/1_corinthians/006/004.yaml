reference: 1 Corinthians 6:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: βιωτικὰ μὲν οὖν κριτήρια ἐὰν ἔχητε, τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ, τούτους καθίζετε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/004.yaml
  text: So if you have courts for matters of this life[c][b][a], do you appoint as judges those who are of no standing in the church?
translation:
  language: hi
  text: इसलिए, यदि तुम्हारे पास इस जीवन के मामलों के लिए न्यायालय हों,[a] तो क्या तुम ऐसे लोगों को न्याय करने के लिए बैठाते हो जिनका कलीसिया में कोई मान नहीं है?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रोज़मर्रा के जीवन के मामले।” यूनानी शब्द साधारण सांसारिक या नागरिक जीवन से संबंधित मामलों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिन्हें कलीसिया में तुच्छ समझा जाता है।” यह अभिव्यक्ति कलीसिया के भीतर नगण्य समझे जाने वाले लोगों अथवा कलीसिया की दृष्टि में कोई स्थान न रखने वालों की ओर संकेत कर सकती है।
    reason: alternative_reading
  - marker: c
    text: 'कुछ लोग इस वाक्य को व्यंग्यात्मक आज्ञा समझते हैं: “जिनका कलीसिया में कोई मान नहीं, उन्हीं को न्याय करने बैठाओ।”'
    reason: alternative_reading
lexical_decisions:
- source_word: βιωτικὰ
  choice: इस जीवन के मामलों
  rationale: यह शब्द साधारण सांसारिक, दैनिक या नागरिक जीवन से जुड़े विषयों को दर्शाता है; यह अनुवाद ‘सांसारिक’ के संभावित नैतिक अर्थ से बचता है।
- source_word: κριτήρια
  choice: न्याय करने की ज़रूरत
  rationale: संदर्भ में संज्ञा न्यायिक मामलों या उनके निपटारे की ओर संकेत करती है। स्वाभाविक हिन्दी में यह वाक्यांश प्रसंग का अर्थ स्पष्ट करता है, यद्यपि यूनानी शब्द ‘न्यायालय’ या ‘मुकदमे’ भी सूचित कर सकता है।
- source_word: ἐὰν ἔχητε
  choice: यदि तुम्हारे बीच ... ज़रूरत पड़े
  rationale: शर्त की शक्ति बनाए रखते हुए हिन्दी में विवादों के उत्पन्न होने और उनके न्याय की आवश्यकता का स्वाभाविक रूप प्रस्तुत करता है।
- source_word: τοὺς ἐξουθενημένους
  choice: ऐसे लोगों ... जिनका ... कोई मान नहीं है
  rationale: कृदंत उन लोगों को दर्शाता है जिन्हें तुच्छ, नगण्य या आदर के अयोग्य समझा जाता है। यह चुनाव उनकी सटीक पहचान को खुला रखता है।
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: कलीसिया में
  rationale: सीधा स्थानसूचक अनुवाद है, जो ‘कलीसिया के भीतर’ और ‘कलीसिया की दृष्टि में’—दोनों संभावित अर्थों को खुला रखता है।
- source_word: τούτους καθίζετε
  choice: क्या तुम ... न्याय करने बैठाते हो
  rationale: καθίζω का मूल अर्थ ‘बैठाना’ है और न्यायिक संदर्भ में किसी को न्याय करने के लिए नियुक्त या आसन देना हो सकता है। यह रूप न्यायिक कार्य और मूल बिंब दोनों बनाए रखता है।
theological_decisions:
- issue: वाक्य को प्रश्न या व्यंग्यात्मक आज्ञा मानना
  choice: 'अलंकारिक प्रश्न: ‘क्या तुम ... न्याय करने बैठाते हो?’'
  alternative: 'व्यंग्यात्मक आज्ञा: ‘जिनका कलीसिया में कोई मान नहीं, उन्हीं को न्याय करने बैठाओ।’'
  rationale: SBLGNT का विराम-चिह्न और 6:1–6 में फटकार का प्रसंग प्रश्नवाचक पाठ का समर्थन करते हैं, पर यूनानी वाक्यरचना आज्ञार्थक समझ की संभावना भी रखती है; उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘जिनका कोई मान नहीं’ की पहचान
  choice: व्यक्ति की पहचान को अनिर्धारित रखा गया है
  alternative: इसे विशेष रूप से गैर-मसीही बाहरी न्यायाधीशों या कलीसिया के भीतर तुच्छ समझे जाने वाले सदस्यों के रूप में निश्चित करना
  rationale: यूनानी अभिव्यक्ति दोनों दिशाओं में समझी जा सकती है। मुख्य पाठ किसी एक पहचान को थोपे बिना सामाजिक विडंबना को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘कलीसिया’ पारंपरिक बाइबलीय पद है। ‘न्याय करने बैठाते हो’ न्यायिक नियुक्ति का अर्थ स्पष्ट करते हुए यूनानी ‘बैठाना’ का बिंब भी सुरक्षित रखता है।
