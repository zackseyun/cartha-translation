  edition: SBLGNT
  text: ἀλλὰ ἀδελφὸς μετὰ ἀδελφοῦ κρίνεται, καὶ τοῦτο ἐπὶ ἀπίστων;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/006.yaml
  text: But brother goes to court against brother[b][a], and this before unbelievers?
translation:
  language: hi
  text: बल्कि एक भाई दूसरे भाई[b] के विरुद्ध अदालत में मुकदमा करता है—और वह भी अविश्वासियों के सामने?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन अविश्वासियों के सामने।” संभवतः आशय कलीसिया से बाहर के लोगों द्वारा संचालित सांसारिक अदालतों से है, पर यूनानी में केवल “अविश्वासियों के सामने” कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: बार-बार आया “भाई” मसीही समुदाय के सहविश्वासी सदस्यों को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पिछले पद में बताए गए आदर्श और वर्तमान निंदनीय स्थिति के बीच तीखा विरोध प्रकट करता है।
- source_word: ἀδελφὸς ... ἀδελφοῦ
  choice: एक भाई दूसरे भाई
  rationale: यूनानी की पुनरुक्त पारिवारिक भाषा को स्वाभाविक हिन्दी में बनाए रखता है; यहाँ 'भाई' मसीही समुदाय के सदस्य का प्रतिनिधिक उल्लेख है।
- source_word: μετὰ
  choice: के विरुद्ध
  rationale: मुकदमे के कानूनी संदर्भ में यह पक्षों के बीच विरोध को व्यक्त करता है, न कि केवल साथ होने को।
- source_word: κρίνεται
  choice: मुकदमा लड़ता है
  rationale: इस प्रसंग में क्रिया का अर्थ कानूनी विवाद में पड़ना या अदालत जाना है; यह हिन्दी में न्यायिक भाव स्पष्ट करता है।
- source_word: καὶ τοῦτο
  choice: और वह भी
  rationale: यह हिन्दी मुहावरा पौलुस के आश्चर्य और भर्त्सना के बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπὶ ἀπίστων
  choice: अविश्वासियों के सामने
  rationale: यह मुकदमे की सुनवाई के स्थान या उपस्थित निर्णायकों का संकेत देता है, पर यूनानी से आगे बढ़कर 'न्यायाधीश' नहीं जोड़ता।
theological_decisions:
- issue: कलीसिया के भीतर ἀδελφός का प्रतिनिधिक प्रयोग
  choice: भाई
  alternative: सहविश्वासी; भाई या बहन
  rationale: पुल्लिंग एकवचन और पौलुस की पारिवारिक भाषा सुरक्षित रखी गई है; टिप्पणी स्पष्ट करती है कि संदर्भ मसीही समुदाय के सदस्यों का है।
- issue: ἀπίστων का दायरा
  choice: अविश्वासियों
  alternative: अविश्वासी न्यायाधीशों; बाहरी लोगों
  rationale: यह विश्वासियों और विश्वास से बाहर के लोगों के बीच मूल विरोध को सुरक्षित रखता है और यूनानी पाठ से अधिक संकीर्ण अर्थ नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कानूनी प्रसंग को 'मुकदमा लड़ता है' से व्यक्त किया गया है, जबकि 'अविश्वासियों' की मूल व्यापकता सुरक्षित है।
