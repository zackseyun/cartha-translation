  text: ἠγοράσθητε γὰρ τιμῆς· δοξάσατε δὴ τὸν θεὸν ἐν τῷ σώματι ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/020.yaml
  text: For you were bought with a price[b][a]; therefore glorify God in your body.
translation:
  language: hi
  text: क्योंकि तुम्हें दाम देकर खरीदा गया है; इसलिए अपने शरीर में परमेश्वर की महिमा करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγοράσθητε
  choice: तुम्हें…खरीदा गया है
  rationale: यूनानी क्रिया का कर्मवाच्य रूप खरीद के रूपक को स्पष्ट रखता है। हिन्दी में पूर्ण वर्तमान पूर्वकालीन घटना के वर्तमान परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन में कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्पष्ट और स्वाभाविक संयोजक है।
- source_word: τιμῆς
  choice: दाम देकर
  rationale: यह खरीद के लिए चुकाए गए मूल्य को दर्शाता है। ‘दाम देकर’ व्यावसायिक रूपक बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: δοξάσατε
  choice: महिमा करो
  rationale: यह आदेशात्मक क्रिया परमेश्वर को महिमा देने का आह्वान करती है; ‘महिमा करो’ धार्मिक भार और आदेश दोनों को बनाए रखता है।
- source_word: δὴ
  choice: इसलिए
  rationale: यह पिछले कारण से निकलने वाले आग्रहपूर्ण निष्कर्ष को दर्शाता है। ‘इसलिए’ हिन्दी में उस अनुमानात्मक और exhortational बल को स्पष्ट करता है।
- source_word: ἐν τῷ σώματι ὑμῶν
  choice: अपने शरीर में
  rationale: ‘शरीर’ तत्काल प्रसंग की देह-संबंधी नैतिकता को ठोस रूप से बनाए रखता है। ‘में’ स्थानगत और साधनगत दोनों संभावनाओं को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: खरीद और छुटकारे का व्यावसायिक रूपक
  choice: ‘दाम देकर खरीदा गया’ के रूप में खरीद का रूपक बनाए रखा
  alternative: ‘मूल्य चुकाकर छुड़ाया गया’
  rationale: मूल पाठ सीधे खरीद की भाषा प्रयोग करता है। उसे बनाए रखने से पाठ का रूपक सुरक्षित रहता है और किसी अधिक विशिष्ट धर्मवैज्ञानिक व्याख्या को अनुवाद में नहीं जोड़ा जाता।
- issue: देहधारी नैतिकता
  choice: σῶμα का ठोस अनुवाद ‘शरीर’
  alternative: ‘जीवन’ या ‘सम्पूर्ण अस्तित्व’
  rationale: निकटवर्ती प्रसंग शारीरिक यौन आचरण से संबंधित है; इसलिए ‘शरीर’ पौलुस के तर्क को स्पष्ट रखता है और अर्थ का अनावश्यक विस्तार नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन ‘शरीर’ के साथ बहुवचन समुदाय को सम्बोधित करने वाला ‘तुम्हें/अपने’ हिन्दी में प्रत्येक श्रोता के देहधारी आचरण पर बल देता है।
