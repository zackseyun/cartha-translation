id: 1CO.6.15
reference: 1 Corinthians 6:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/006/015.yaml
  text: Do you not know that your bodies are members of Messiah? Shall I then take the members of Messiah and make them members of a prostitute? May it never be[a][b].
translation:
  language: hi
  text: क्या तुम नहीं जानते कि तुम्हारे शरीर मसीह[a] के अंग हैं? तो क्या मैं मसीह के अंगों को लेकर उन्हें वेश्या के अंग बना दूँ? ऐसा कभी न हो![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसीहा।” यूनानी पदवी Χριστός का प्रयोग अनूदित पदवी (“मसीहा”) अथवा नाम-जैसे रूप (“मसीह”) में हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “बिलकुल नहीं!” / “निश्चय ही नहीं!” यूनानी μὴ γένοιτο अत्यन्त प्रबल अस्वीकृति व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: क्या तुम नहीं जानते
  rationale: यह पौलुस के आलंकारिक प्रश्न और श्रोताओं से पहले से अपेक्षित ज्ञान—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: σώματα
  choice: शरीर
  rationale: बहुवचन यूनानी शब्द विश्वासियों के वास्तविक देहधारी अस्तित्व को दर्शाता है; हिन्दी में ‘तुम्हारे शरीर’ संख्या और आशय दोनों को स्पष्ट रखता है।
- source_word: μέλη
  choice: अंग
  rationale: ‘अंग’ शरीर के हिस्सों और किसी बड़े समग्र से जुड़े सदस्यों—दोनों अर्थों को वहन कर सकता है, इसलिए पौलुस का शारीरिक रूपक सुरक्षित रहता है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक और व्यापक रूप से समझा जाने वाला रूप है; पादटिप्पणी इसके पदवीगत अर्थ ‘मसीहा’ को स्पष्ट करती है।
- source_word: ἄρας
  choice: लेकर
  rationale: यह कृदन्त को मुख्य आलंकारिक प्रश्न के साथ स्वाभाविक रूप से जोड़ता है और किसी चीज़ को लेकर दूसरी संगति में लगाने की कल्पना को बनाए रखता है।
- source_word: ποιήσω
  choice: बना दूँ
  rationale: यह प्रथम पुरुष के विचाराधीन कार्य तथा उसके चौंकाने वाले परिणाम को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
- source_word: πόρνης
  choice: वेश्या के
  rationale: यूनानी शब्द यहाँ विशेष रूप से वेश्या को दर्शाता है; यह चयन अर्थ को व्यापक ‘अनैतिक स्त्री’ बनाकर कमजोर नहीं करता।
- source_word: μὴ γένοιτο
  choice: ऐसा कदापि न हो!
  rationale: यह प्रबल अस्वीकृति के साथ यूनानी वाक्यांश की कामनार्थक छाया भी सुरक्षित रखता है; विस्मयादिबोधक चिह्न उसकी तीव्रता दर्शाता है।
theological_decisions:
- issue: Χριστός का पदवीगत और नाम-जैसा प्रयोग
  choice: मसीह
  alternative: मसीहा
  rationale: संदर्भ अभिषिक्त जन से विश्वासियों के संबंध की बात करता है, पर यूनानी रूप पदवी और नाम-जैसे प्रयोग के बीच पूर्णतः भेद नहीं करता। मुख्य पाठ में स्वाभाविक हिन्दी ‘मसीह’ रखा गया है और ‘मसीहा’ को पादटिप्पणी में देकर यह अर्थगत संभावना सुरक्षित रखी गई है।
- issue: विश्वासियों के शरीरों का मसीह के अंग होना
  choice: ‘शरीर’ और ‘अंग’ की प्रत्यक्ष रूपकात्मक भाषा बनाए रखना
  alternative: इसे व्याख्यात्मक रूप से ‘मसीह की देह के सदस्य’ कहना
  rationale: मूल पाठ इस वाक्य में ‘मसीह की देह’ नहीं कहता, बल्कि सीधे शरीरों को मसीह के अंग बताता है। अनकही ‘देह’ जोड़ने से तनाव और कथन की तीव्रता अनावश्यक रूप से हल हो जाती।
- issue: μὴ γένοιτο की अस्वीकृति का स्वर
  choice: ऐसा कदापि न हो!
  alternative: बिलकुल नहीं!
  rationale: चयन प्रबल निषेध के साथ ‘ऐसा कभी घटित न हो’ की कामनार्थक छाया रखता है; विकल्प अधिक बोलचाल का है, पर उस व्याकरणिक रंग को कुछ सपाट कर देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘कदापि’ अपेक्षाकृत औपचारिक है, पर यहाँ पौलुस की तीखी अस्वीकृति और कामनार्थक अभिव्यक्ति को संक्षेप में व्यक्त करता है। दोनों बार ‘मसीह के अंग’ रखकर मूल की पुनरावृत्ति और आलंकारिक आघात बनाए गए हैं।
