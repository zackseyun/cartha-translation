  text: ἵνα ἡ πίστις ὑμῶν μὴ ᾖ ἐν σοφίᾳ ἀνθρώπων ἀλλ’ ἐν δυνάμει θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/005.yaml
  text: so that your faith might not be in the wisdom of men[a], but in the power of God.
translation:
  language: hi
  text: ताकि तुम्हारा विश्वास मनुष्यों की बुद्धि पर नहीं, बल्कि परमेश्वर की सामर्थ्य पर टिका हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह पौलुस के उद्देश्य को व्यक्त करने वाले उपवाक्य का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: πίστις
  choice: विश्वास
  rationale: यहाँ इसका आशय कुरिन्थियों के विश्वास करने से है; इसलिए ‘विश्वास’ उपयुक्त है, न कि ‘विश्वासयोग्यता’।
- source_word: μὴ ᾖ
  choice: नहीं ... टिका हो
  rationale: ἵνα के साथ आए वर्तमान संभावनार्थक रूप को उद्देश्यसूचक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है; ‘टिका हो’ दोनों ἐν-वाक्यांशों में निहित आधार या निर्भरता का अर्थ स्पष्ट करता है।
- source_word: ἐν σοφίᾳ ἀνθρώπων
  choice: मनुष्यों की बुद्धि पर
  rationale: ἀνθρώπων यहाँ समस्त मानवजाति के लिए प्रयुक्त है। ‘मनुष्यों’ मूल के बहुवचन और सामान्य मानवीय अर्थ, दोनों को बनाए रखता है; ‘पर’ हिन्दी में विश्वास के आधार को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀλλ’ ἐν δυνάμει θεοῦ
  choice: बल्कि परमेश्वर की सामर्थ्य पर
  rationale: ‘बल्कि’ तीखे विरोध को बनाए रखता है, और ‘पर’ पहले वाक्यांश के समानांतर विश्वास के आधार को व्यक्त करता है। ‘सामर्थ्य’ θεοῦ की प्रभावकारी शक्ति के लिए गरिमापूर्ण और परिचित बाइबलीय हिन्दी है।
theological_decisions:
- issue: विश्वास के संबंध में ἐν का अर्थ
  choice: ‘पर टिका हो’ द्वारा आधार या निर्भरता व्यक्त की गई
  alternative: ‘में हो’
  rationale: यूनानी ἐν में क्षेत्र, आधार या साधन की कुछ अर्थगत व्यापकता हो सकती है। इस संदर्भ में विरोध यह है कि विश्वास मानवीय बुद्धि पर नहीं, परमेश्वर की सामर्थ्य पर निर्भर हो; ‘टिका हो’ इसे स्वाभाविक हिन्दी में व्यक्त करता है, बिना सामर्थ्य की कार्यविधि को और संकीर्ण किए।
- issue: ἀνθρώπων का लिंग-संबंधी अर्थ
  choice: ‘मनुष्यों’
  alternative: ‘मानवीय’ या ‘लोगों की’
  rationale: यह शब्द यहाँ पुरुषों तक सीमित नहीं, बल्कि मनुष्यों को सामान्य रूप से दर्शाता है। हिन्दी ‘मनुष्यों’ इस समावेशी अर्थ को मूल के बहुवचन रूप के साथ सीधे व्यक्त करता है; अतः स्पष्टीकरण हेतु पादटिप्पणी आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। ‘मनुष्यों की बुद्धि’ और ‘परमेश्वर की सामर्थ्य’ का समानांतर विरोध सुरक्षित रखा गया है।
