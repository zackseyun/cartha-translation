id: 1CO.2.16
reference: 1 Corinthians 2:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τίς γὰρ ἔγνω νοῦν κυρίου, ὃς συμβιβάσει αὐτόν; ἡμεῖς δὲ νοῦν Χριστοῦ ἔχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/016.yaml
  text: For who has known the mind of the Lord[b][a], that he may instruct him? But we have the mind of Messiah.
translation:
  language: hi
  text: क्योंकि किसने प्रभु के मन को जाना है[a] कि वह प्रभु को शिक्षा दे सके? पर हमारे पास मसीहा का मन है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पौलुस यहाँ यशायाह 40:13 की प्रतिध्वनि करता है।
    reason: cross_reference
  - marker: b
    text: या, “मसीह का मन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: किसने
  rationale: अलंकारिक प्रश्न को हिन्दी में सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पिछले कथन के साथ पौलुस के व्याख्यात्मक संबंध को बनाए रखता है।
- source_word: ἔγνω
  choice: जाना है
  rationale: यूनानी भूतकाल के वर्तमान-संबद्ध अलंकारिक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: νοῦν
  choice: मन
  rationale: यहाँ νοῦς के विचार, समझ और अभिवृत्ति के व्यापक अर्थ को संक्षेप में बनाए रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος का मानक और गरिमापूर्ण अनुवाद है तथा यशायाह 40:13 की प्रतिध्वनि बनाए रखता है।
- source_word: ὃς συμβιβάσει αὐτόν
  choice: कि वह उसे शिक्षा दे सके
  rationale: सापेक्ष उपवाक्य का रूप बनाए रखते हुए συμβιβάζω के यहाँ प्रयुक्त ‘शिक्षा देना/निर्देश देना’ अर्थ और प्रश्न की असंभवता का भाव स्वाभाविक हिन्दी में देता है।
- source_word: ἡμεῖς δὲ
  choice: पर हमारे
  rationale: मानवीय अयोग्यता और समुदाय के विषय में पौलुस के सकारात्मक कथन के बीच स्पष्ट विरोध दिखाता है।
- source_word: Χριστοῦ
  choice: मसीहा का
  rationale: Χριστός को यहाँ उपाधि के रूप में समझकर उसके यहूदी-मसीहाई आशय को बनाए रखता है।
- source_word: ἔχομεν
  choice: हमारे पास ... है
  rationale: पौलुस के सीधे वर्तमानकालीन दावे को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: νοῦν Χριστοῦ में Χριστοῦ का अनुवाद
  choice: मसीहा का मन
  alternative: मसीह का मन
  rationale: यहाँ Χριστός उपाधि के रूप में सक्रिय है; ‘मसीहा’ उसके अभिषिक्त जन वाले आशय को स्पष्ट रखता है, जबकि वैकल्पिक पारंपरिक रूप फुटनोट में दिया गया है।
- issue: ‘हमारे’ (ἡμεῖς) का संदर्भ
  choice: संदर्भ को अनिर्धारित रखा गया
  alternative: केवल प्रेरितों अथवा सभी विश्वासियों को स्पष्ट रूप से निर्दिष्ट करना
  rationale: यूनानी पाठ स्वयं ‘हम’ की सीमा इस पद में स्पष्ट नहीं करता; इसलिए किसी एक धार्मिक व्याख्या को अनुवाद में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘मन’ को दोनों स्थानों पर दोहराकर यूनानी νοῦν की शब्दगत कड़ी सुरक्षित रखी गई है।
