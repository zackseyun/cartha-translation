id: 1CO.2.11
reference: 1 Corinthians 2:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τίς γὰρ οἶδεν ἀνθρώπων τὰ τοῦ ἀνθρώπου εἰ μὴ τὸ πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ; οὕτως καὶ τὰ τοῦ θεοῦ οὐδεὶς ⸀ἔγνωκεν εἰ μὴ τὸ πνεῦμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/011.yaml
  text: For who among people knows the things of a person except the spirit of the person that is in him? In the same way[b][a], no one has known the things of God except the Spirit of God.
translation:
  language: hi
  text: क्योंकि मनुष्यों में से कौन किसी मनुष्य की बातों को जानता है, सिवाय उस मनुष्य की आत्मा के जो उसके भीतर है? उसी प्रकार, परमेश्वर की बातों को परमेश्वर की आत्मा के सिवाय किसी ने नहीं जाना है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθρώπων / ἀνθρώπου
  choice: मनुष्यों / किसी मनुष्य
  rationale: यहाँ संदर्भ सामान्य मानवजाति का है, पुरुष-विशेष का नहीं। यह चयन यूनानी के एकवचन-बहुवचन भेद और सार्वभौमिक अर्थ दोनों को बनाए रखता है।
- source_word: τὰ τοῦ ἀνθρώπου
  choice: किसी मनुष्य की बातें
  rationale: ‘बातें’ व्यक्ति के भीतर के विचारों और मामलों को व्यापक रूप से व्यक्त करता है तथा आगे आने वाले ‘परमेश्वर की बातों’ के साथ समानांतरता बनाए रखता है।
- source_word: πνεῦμα τοῦ ἀνθρώπου τὸ ἐν αὐτῷ
  choice: उस मनुष्य की आत्मा जो उसके भीतर है
  rationale: यह अनुवाद संबंधवाचक वाक्यांश को स्पष्ट रूप से रखता है और ‘भीतर है’ को ‘आत्मा’ का विशेषण बनने देता है, बिना ‘अंतर्वासी’ जैसी अधिक व्याख्यात्मक शब्दावली जोड़े।
- source_word: οὕτως καὶ
  choice: उसी प्रकार
  rationale: यह दोनों कथनों के बीच निकट उपमा को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἔγνωκεν
  choice: नहीं जाना है
  rationale: पूर्णकाल के रूप को बनाए रखते हुए वर्तमान तक बने परिणाम का भाव व्यक्त किया गया है; पहले खंड के वर्तमानकाल से इसका रूपगत अंतर भी सुरक्षित रहता है।
- source_word: τὰ τοῦ θεοῦ
  choice: परमेश्वर की बातें
  rationale: यह वाक्यांश को केवल ‘विचारों’ तक सीमित नहीं करता और पहले खंड के साथ जानबूझकर रखी गई समानांतरता बचाता है।
- source_word: πνεῦμα τοῦ θεοῦ
  choice: परमेश्वर का आत्मा
  rationale: पौलुस के प्रसंग में यह परमेश्वर के अपने आत्मा का व्यक्तिगत उल्लेख है। हिन्दी बाइबलीय प्रयोग में ‘परमेश्वर का आत्मा’ स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: क्या πνεῦμα τοῦ θεοῦ को व्यक्तिगत दिव्य संदर्भ के रूप में समझाया जाए या सामान्य ‘ईश्वरीय आत्मा’ के रूप में।
  choice: परमेश्वर का आत्मा
  alternative: परमेश्वर की आत्मा
  rationale: निकटवर्ती प्रसंग में आत्मा परमेश्वर की गहरी बातों को जाँचता और प्रकट करता है, इसलिए व्यक्तिगत संदर्भ उपयुक्त है। फिर भी अनुवाद पद में उपलब्ध जानकारी से आगे कोई अतिरिक्त त्रित्ववादी व्याख्या नहीं जोड़ता।
- issue: τὰ τοῦ ἀνθρώπου और τὰ τοῦ θεοῦ का दायरा
  choice: मनुष्य की बातें / परमेश्वर की बातें
  alternative: मनुष्य के विचार / परमेश्वर के विचार
  rationale: यूनानी अभिव्यक्ति व्यापक है; इसे केवल ‘विचार’ कहने से अर्थ अनावश्यक रूप से संकुचित हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘मनुष्य’ को लिंग-विशेष के बजाय मानव व्यक्ति के सामान्य अर्थ में रखा गया है। मूल के दोनों खंडों की समानांतर संरचना और दूसरे खंड के पूर्णकाल को यथासंभव सुरक्षित रखा गया है।
