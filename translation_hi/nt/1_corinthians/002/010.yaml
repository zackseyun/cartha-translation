reference: 1 Corinthians 2:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡμῖν ⸀γὰρ ⸂ἀπεκάλυψεν ὁ θεὸς⸃ διὰ τοῦ ⸀πνεύματος, τὸ γὰρ πνεῦμα πάντα ἐραυνᾷ, καὶ τὰ βάθη τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/010.yaml
  text: For God has revealed these things to us through the Spirit[a], for the Spirit searches all things[b], even the depths of God.
translation:
  language: hi
  text: क्योंकि परमेश्वर ने ये बातें हमें आत्मा के द्वारा प्रकट की हैं[a]; क्योंकि आत्मा सब कुछ खोजती है, यहाँ तक कि परमेश्वर की गहराइयों को भी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें हमें प्रकट किया है”; यूनानी में सीधा कर्म व्यक्त नहीं है और वह पिछले संदर्भ से समझा जाता है।
    reason: alternative_reading
  - marker: b
    text: या “परमेश्वर की गहरी बातों को भी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν
  choice: हम पर
  rationale: यह संप्रदान कारक प्रकाशन पाने वालों को दर्शाता है। हिन्दी में ‘हम पर प्रकट की हैं’ स्वाभाविक रूप से ‘हमें बताई/दिखाई हैं’ का भाव देता है और प्रकाशन की शब्दावली बनाए रखता है।
- source_word: ἀπεκάλυψεν
  choice: प्रकट की हैं
  rationale: यूनानी अओरिस्ट पूर्ण किए गए प्रकाशन को बताता है; हिन्दी का पूर्ण पक्ष उस घटना और उसकी वर्तमान प्रासंगिकता, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: '[implicit object of ἀπεκάλυψεν]'
  choice: ये बातें
  rationale: यूनानी में कर्म निहित है और पिछले संदर्भ से समझा जाता है। ‘ये बातें’ उस संबंध को स्पष्ट करता है; इस पूर्ति को पादटिप्पणी में बताया गया है।
- source_word: διὰ τοῦ πνεύματος
  choice: आत्मा के द्वारा
  rationale: सम्बन्धकारक के साथ διά साधन अथवा माध्यम दर्शाता है; यह अनुवाद उस मध्यस्थ भूमिका को बनाए रखता है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: संदर्भ में यह परमेश्वर के आत्मा, अर्थात् पवित्र आत्मा, का उल्लेख है। मुख्य पाठ मूल की तरह केवल ‘आत्मा’ कहता है।
- source_word: ἐραυνᾷ
  choice: खोजता है
  rationale: यह क्रिया सक्रिय रूप से खोजने और गहराई से छानबीन करने का भाव रखती है; ‘खोजता है’ रूपक और क्रियाशीलता दोनों बचाता है।
- source_word: πάντα
  choice: सब कुछ
  rationale: यह सर्वसमावेशी अर्थ को स्पष्ट, सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καὶ
  choice: यहाँ तक कि ... भी
  rationale: यहाँ καί चरमबोधक है और परमेश्वर की गहराइयों को खोजने पर विशेष बल देता है।
- source_word: τὰ βάθη τοῦ θεοῦ
  choice: परमेश्वर की गहराइयों
  rationale: यह मूल के ‘गहराई’ रूपक को बिना व्याख्यात्मक रूप से सीमित किए सुरक्षित रखता है।
theological_decisions:
- issue: क्या πνεῦμα पवित्र आत्मा को दर्शाता है या सामान्य मानवीय आत्मा को
  choice: दोनों स्थानों पर परमेश्वर का आत्मा (पवित्र आत्मा)
  alternative: सामान्य अर्थ में मानवीय आत्मा
  rationale: आस-पास का संदर्भ प्रकाशन का माध्यम आत्मा को बताता है और उसे परमेश्वर की गहराइयों तक का ज्ञान रखने वाला कहता है; इसलिए पवित्र आत्मा अभिप्रेत होना अधिक सुसंगत है।
- issue: आत्मा के ‘खोजने’ का आशय
  choice: मूल की खोजने वाली भाषा को बनाए रखा गया
  alternative: ‘पूरी तरह जानता है’ जैसे व्याख्यात्मक अनुवाद से खोज को ज्ञान के अर्थ में स्पष्ट करना
  rationale: ‘खोजता है’ को बनाए रखने से पाठ का रूपक और उसका धर्मवैचारिक तनाव सुरक्षित रहता है; इसे परमेश्वर में अज्ञान का संकेत मानकर चुपचाप पुनर्लिखना उचित नहीं होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘आत्मा’ के लिए संदर्भानुसार पुल्लिंग क्रिया ‘खोजता है’ प्रयुक्त हुई है, जैसा पवित्र आत्मा के व्यक्तिगत कर्तृत्व को व्यक्त करने वाली हिन्दी मसीही भाषा में स्वाभाविक है।
