reference: 1 Corinthians 2:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Κἀγὼ ἐλθὼν πρὸς ὑμᾶς, ἀδελφοί, ἦλθον οὐ καθ’ ὑπεροχὴν λόγου ἢ σοφίας καταγγέλλων ὑμῖν τὸ ⸀μαρτύριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/001.yaml
  text: And I[a], when I came to you, brothers, did not come with lofty speech or wisdom[b], proclaiming to you the testimony of God.
translation:
  language: hi
  text: और भाइयो,[a] जब मैं तुम्हारे पास आया, तो परमेश्वर की गवाही[b] तुम्हें सुनाते हुए मैं वाक्पटुता या बुद्धि की श्रेष्ठता लेकर नहीं आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भाइयो” यहाँ सामान्य रूप से साथी विश्वासियों के लिए हो सकता है, जिसमें मण्डली की स्त्रियाँ भी शामिल हैं।
    reason: cultural_note
  - marker: b
    text: कुछ प्राचीन हस्तलिपियों में “परमेश्वर का रहस्य” है।
    reason: textual_variant
lexical_decisions:
- source_word: Κἀγὼ
  choice: और … मैं
  rationale: καί के संयोजक भाव और स्पष्ट प्रथम-पुरुष कर्ता को स्वाभाविक हिन्दी में बनाए रखता है; अतिरिक्त आत्म-बलाघात नहीं जोड़ता।
- source_word: ἐλθὼν … ἦλθον
  choice: जब मैं … आया, तो … मैं … नहीं आया
  rationale: कृदंत और मुख्य क्रिया के संबंध को स्वाभाविक कालवाचक उपवाक्य तथा मुख्य कथन के रूप में व्यक्त करता है, साथ ही यूनानी की पुनरुक्ति भी पर्याप्त रूप से बनाए रखता है।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: पुंलिंग संबोधन का औपचारिक रूप सुरक्षित रखता है; मिश्रित विश्वासी समुदाय की सम्भावित समावेशिता पादटिप्पणी में स्पष्ट की गई है।
- source_word: καθ’ ὑπεροχὴν λόγου ἢ σοφίας
  choice: ऊँची-ऊँची बातों या बुद्धि के साथ
  rationale: ὑπεροχή के श्रेष्ठता, प्रभावोत्पादकता या ऊँचाई के भाव को आम आधुनिक हिन्दी में व्यक्त करता है और प्रभावशाली वाक्पटुता तथा बुद्धि के बीच मूल पाठ के संबंध को खुला रखता है।
- source_word: καταγγέλλων
  choice: सुनाते हुए
  rationale: सार्वजनिक रूप से घोषणा करने के भाव को सहज हिन्दी में व्यक्त करता है और कृदंत की समकालिक क्रिया बनाए रखता है।
- source_word: μαρτύριον
  choice: गवाही
  rationale: SBLGNT के मुद्रित पाठ μαρτύριον का सीधा और धर्मशास्त्रीय रूप से भारयुक्त हिन्दी समतुल्य है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर की
  rationale: सम्बन्धकारक की यह औपचारिक अभिव्यक्ति गवाही के परमेश्वर से होने या परमेश्वर के विषय में होने की सम्भावनाओं को अनावश्यक रूप से निश्चित नहीं करती।
theological_decisions:
- issue: μαρτύριον पर पाठांतर
  choice: परमेश्वर की गवाही
  alternative: परमेश्वर का रहस्य
  rationale: SBLGNT का आधार-पाठ μαρτύριον (‘गवाही’) पढ़ता है। अर्थ को प्रभावित करने वाला प्रसिद्ध पाठांतर μυστήριον (‘रहस्य’) पादटिप्पणी में दिया गया है।
- issue: τοῦ θεοῦ सम्बन्धकारक का अर्थ
  choice: परमेश्वर की
  alternative: परमेश्वर की ओर से / परमेश्वर के विषय में
  rationale: मूल यूनानी सम्बन्धकारक की वास्तविक अर्थगत अस्पष्टता को किसी एक व्याख्या में सीमित किए बिना सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संबोधन को स्पष्ट रखा गया है; पाठांतर और लैंगिक-सांस्कृतिक विस्तार पादटिप्पणियों में दिए गए हैं।
