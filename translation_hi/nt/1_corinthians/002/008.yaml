source:
  edition: SBLGNT
  text: ἣν οὐδεὶς τῶν ἀρχόντων τοῦ αἰῶνος τούτου ἔγνωκεν, εἰ γὰρ ἔγνωσαν, οὐκ ἂν τὸν κύριον τῆς δόξης ἐσταύρωσαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/008.yaml
  text: which none of the rulers of this age has known[a], for if they had known it, they would not have crucified the Lord of glory.
translation:
  language: hi
  text: जिसे इस युग के शासकों में से किसी ने नहीं जाना[a], क्योंकि यदि उन्होंने उसे जाना होता, तो वे महिमा के प्रभु को क्रूस पर न चढ़ाते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इस युग के शासक” से मानवीय अधिकारी, आत्मिक शक्तियाँ, या दोनों अभिप्रेत हो सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: जिसे
  rationale: स्त्रीलिंग एकवचन संबंधवाचक सर्वनाम पूर्ववर्ती ‘बुद्धि’ की ओर संकेत करता है; ‘जिसे’ हिन्दी में इस संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἀρχόντων
  choice: शासकों
  rationale: यह शासन या अधिकार रखने वालों का व्यापक संकेत देता है और मानवीय शासकों, आत्मिक शक्तियों, अथवा दोनों की संभावना को खुला रखता है।
- source_word: αἰῶνος τούτου
  choice: इस युग के
  rationale: αἰών का मूल समय-संबंधी भाव ‘युग’ से अधिक ठीक व्यक्त होता है; ‘संसार’ कहने से अर्थ अनावश्यक रूप से स्थान-संबंधी हो सकता है।
- source_word: ἔγνωκεν / ἔγνωσαν
  choice: नहीं जाना / जाना होता
  rationale: ‘जानना’ γινώσκω का सीधा और प्रसंगानुकूल अनुवाद है। ‘जाना होता’ अवास्तविक भूतकालीन शर्त को स्वाभाविक हिन्दी में व्यक्त करता है और केवल बौद्धिक ‘समझ’ तक अर्थ को सीमित नहीं करता।
- source_word: κύριον
  choice: प्रभु
  rationale: κύριος के धार्मिक और पदवीगत भार को बनाए रखने वाला प्रचलित हिन्दी रूप।
- source_word: δόξης
  choice: महिमा
  rationale: δόξα का मानक धार्मिक हिन्दी अनुवाद, जो गौरव और दिव्य वैभव दोनों का भाव रखता है।
- source_word: κύριον τῆς δόξης
  choice: महिमा के प्रभु
  rationale: यूनानी संबंधकारक संरचना को सुरक्षित रखता है और उसे केवल ‘महिमामय प्रभु’ के गुणसूचक अर्थ में सीमित नहीं करता।
- source_word: ἐσταύρωσαν
  choice: क्रूस पर चढ़ाते
  rationale: क्रूस द्वारा मृत्युदंड की ऐतिहासिक विधि को स्पष्ट और परंपरागत हिन्दी अभिव्यक्ति में व्यक्त करता है।
theological_decisions:
- issue: ‘इस युग के शासकों’ की पहचान
  choice: मुख्य पाठ में तटस्थ ‘इस युग के शासकों’ रखा गया है।
  alternative: मानवीय राजनीतिक/धार्मिक अधिकारी; आत्मिक या दुष्ट शक्तियाँ; अथवा दोनों स्तरों को समेटने वाला संकेत।
  rationale: यूनानी पदबंध इन सभी व्याख्यात्मक संभावनाओं को ग्रहण कर सकता है। पद स्वयं किसी एक पहचान को निर्णायक रूप से निर्दिष्ट नहीं करता, इसलिए अस्पष्टता को पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। ‘महिमा के प्रभु’ जैसे उन्नत धार्मिक पदबंध को मूल की संरचना और धर्मवैचारिक भार बनाए रखने के लिए रखा गया है।
