source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐ τὸ πνεῦμα τοῦ κόσμου ἐλάβομεν ἀλλὰ τὸ πνεῦμα τὸ ἐκ τοῦ θεοῦ, ἵνα εἰδῶμεν τὰ ὑπὸ τοῦ θεοῦ χαρισθέντα ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/012.yaml
  text: But we have not received the spirit of the world[a], but the Spirit from God[b], so that we may know the things graciously given to us by God.
translation:
  language: hi
  text: परन्तु हमने संसार की आत्मा को नहीं, बल्कि परमेश्वर की ओर से आने वाली आत्मा को प्राप्त किया है, ताकि हम उन बातों को जानें[a] जो परमेश्वर ने हमें अनुग्रहपूर्वक दी हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जानें” का अनुवाद “समझें” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अनुग्रहपूर्वक दी हैं” का अनुवाद “उदारता से दी हैं” या “उपहार के रूप में दी हैं” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: आत्मा
  rationale: दोनों occurrences में एक ही हिन्दी शब्द रखकर यूनानी का शब्दगत विरोध सुरक्षित रखा गया है; पहले का आशय संसार की प्रेरक आत्मा या प्रभाव से और दूसरे का परमेश्वर से मिलने वाले पवित्र आत्मा से है।
- source_word: κόσμου
  choice: संसार
  rationale: यह वर्तमान मानव-व्यवस्था को परमेश्वर के विपरीत रूप में सूचित करने वाला स्वाभाविक और मानक हिन्दी समतुल्य है।
- source_word: ἐλάβομεν
  choice: हमने ... पाई है
  rationale: पूर्ण पक्ष भूतकाल में प्राप्ति और उसके वर्तमान परिणाम, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ ἐκ τοῦ θεοῦ
  choice: वह आत्मा ... जो परमेश्वर से है
  rationale: यह ἐκ के स्रोत-संबंध को स्पष्ट रखता है और हिन्दी में आत्मा के साथ स्वाभाविक वाक्य-रचना देता है।
- source_word: ἵνα εἰδῶμεν
  choice: ताकि हम ... जानें
  rationale: उद्देश्यवाचक उपवाक्य स्पष्ट रखा गया है और οἶδα का मूल संज्ञानात्मक अर्थ सुरक्षित है।
- source_word: χαρισθέντα
  choice: अनुग्रहपूर्वक दी हैं
  rationale: χαρίζομαι में निहित अनुग्रह और उपहार के भाव को केवल ‘दी’ कहने की अपेक्षा अधिक पूर्ण रूप से व्यक्त करता है।
- source_word: τὰ ... χαρισθέντα ἡμῖν
  choice: उन बातों को ... जो ... हमें ... दी हैं
  rationale: नपुंसकलिंग बहुवचन का व्यापक दायरा रखा गया है; इसे केवल विशिष्ट आत्मिक वरदानों तक सीमित नहीं किया गया।
theological_decisions:
- issue: क्या πνεῦμα τὸ ἐκ τοῦ θεοῦ विशेष रूप से पवित्र आत्मा को सूचित करता है
  choice: मुख्य पाठ में ‘वह आत्मा ... जो परमेश्वर से है’ और ‘आत्मा’ का आदरसूचक रूप
  alternative: ‘परमेश्वर से मिली आत्मा’ को किसी सामान्य आत्मिक प्रभाव के अर्थ में लेना
  rationale: तात्कालिक संदर्भ में संसार की आत्मा के साथ विरोध परमेश्वर द्वारा विश्वासियों को दिए गए पवित्र आत्मा की ओर सबसे स्वाभाविक संकेत करता है; फिर भी मूल वाक्यांश को ‘पवित्र आत्मा’ कहकर विस्तार नहीं दिया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘पाई है’ हिन्दी में ‘आत्मा’ के व्याकरणिक लिंग के अनुरूप है। मुख्य पाठ में ‘वह आत्मा ... जो परमेश्वर से है’ यूनानी संरचना के निकट रहते हुए स्पष्टता देता है।
