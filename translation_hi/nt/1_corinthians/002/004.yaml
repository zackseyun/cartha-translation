    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: बोलना
  rationale: यहाँ शब्द-विषय से अधिक पौलुस के बोलने के ढंग का संकेत है; ‘बोलना’ इसे κήρυγμα से अलग रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: κήρυγμα
  choice: प्रचार
  rationale: यह उद्घोषणा या प्रचार के अर्थ को सरल, प्रचलित हिन्दी में व्यक्त करता है और λόγος से भेद बनाए रखता है।
- source_word: πειθοῖ σοφίας
  choice: ज्ञान की लुभानेवाली बातें
  rationale: वाक्यांश प्रभावशाली ढंग से मनवा लेने वाली ज्ञानपूर्ण वाणी की ओर संकेत करता है। यूनानी में ‘शब्द’ स्पष्टतः नहीं है, पर हिन्दी में ‘बातें’ अर्थ को स्वाभाविक बनाता है; वैकल्पिक अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: ἀποδείξει
  choice: प्रमाण
  rationale: यह केवल दावा नहीं, बल्कि प्रत्यक्ष प्रदर्शन या प्रमाणित कर दिखाने का भाव देता है और वक्तृत्वपूर्ण मनुहार के विपरीत खड़ा है।
- source_word: πνεύματος
  choice: आत्मा
  rationale: निकटवर्ती संदर्भ में परमेश्वर के आत्मा की कार्यशीलता प्रमुख है; हिन्दी में ‘आत्मा’ अक्षर-रूप से मानव आत्मा की सम्भावना भी खुली रखता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: δυνάμεως
  choice: सामर्थ्य
  rationale: यह Pauline संदर्भ में प्रभावकारी शक्ति का dignified और प्रचलित हिन्दी रूप है तथा ‘आत्मा’ के साथ स्वाभाविक युग्म बनाता है।
theological_decisions:
- issue: πνεύματος से पवित्र आत्मा अभिप्रेत है या मानवीय आत्मा/आत्मिक दशा
  choice: मुख्य पाठ में ‘आत्मा’, संदर्भतः परमेश्वर का आत्मा
  alternative: मानवीय ‘आत्मा’ या ‘आत्मिक भाव’
  rationale: अध्याय का व्यापक प्रवाह परमेश्वर के आत्मा की ओर संकेत करता है, फिर भी यूनानी पद अपने आप में पूरी तरह निरपेक्ष नहीं है। इसलिए मुख्य पाठ में स्वाभाविक ‘आत्मा’ रखा गया और वैकल्पिक अर्थ पादटिप्पणी में बताया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किन्तु गरिमापूर्ण शैली अपनाई गई है। ‘मेरा बोलना और मेरा प्रचार’ यूनानी के दो अलग पदों को बनाए रखता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न अपेक्षित होने के कारण [b] को संबंधित वाक्यांश के बाद रखा जाना चाहिए।
