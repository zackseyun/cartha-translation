base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/013.yaml
  text: These things we also speak[a], not in words taught by human wisdom, but in those taught by the Spirit, interpreting spiritual things to spiritual people.
translation:
  language: hi
  text: इन बातों को हम भी कहते हैं—मानवीय बुद्धि से सिखाए हुए शब्दों में नहीं, बल्कि परमेश्वर की आत्मा द्वारा सिखाए हुए शब्दों में; आत्मिक बातों को आत्मिक शब्दों में व्यक्त करते हुए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आत्मिक बातों की व्याख्या आत्मिक लोगों के लिए करते हुए।” यूनानी में “आत्मिक” शब्द को ‘आत्मिक लोगों’ के अर्थ में भी समझा जा सकता है। मुख्य पाठ में इसे निहित ‘आत्मिक शब्दों’ के साथ समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἃ
  choice: इन्हीं बातों को
  rationale: यह पहले कही गई परमेश्वर-प्रदत्त बातों की ओर संकेत करता है; ‘इन्हीं’ संदर्भ-संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: λαλοῦμεν
  choice: हम कहते भी हैं
  rationale: λαλέω के बोलने या कहने के अर्थ को बनाए रखता है और καί के समावेशी बल को ‘भी’ से व्यक्त करता है।
- source_word: διδακτοῖς ἀνθρωπίνης σοφίας λόγοις
  choice: मानवीय बुद्धि से सिखाए हुए शब्दों में
  rationale: ἐν के साधनवाचक भाव और λόγοις के स्पष्ट अर्थ ‘शब्दों’—दोनों को सुरक्षित रखता है।
- source_word: διδακτοῖς πνεύματος
  choice: आत्मा से सिखाए हुए शब्दों में
  rationale: पिछले λόγοις को स्वाभाविक रूप से दोहराकर लुप्त संज्ञा स्पष्ट की गई है; संदर्भ में πνεῦμα परमेश्वर के आत्मा को सूचित करता है।
- source_word: πνευματικοῖς πνευματικὰ συγκρίνοντες
  choice: आत्मिक बातों को आत्मिक शब्दों में व्यक्त करते हुए
  rationale: तत्काल संदर्भ में वचन और अभिव्यक्ति का विरोध होने के कारण πνευματικοῖς को नपुंसकलिंग साधनवाचक मानकर निहित ‘शब्दों’ के साथ प्रस्तुत किया गया है। वाक्यांश की वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: πνεύματος का अभिप्राय
  choice: परमेश्वर का आत्मा
  alternative: सामान्य रूप से कोई आत्मिक स्रोत
  rationale: 1 कुरिन्थियों 2 के निकटवर्ती संदर्भ में परमेश्वर के आत्मा और मानवीय बुद्धि का स्पष्ट विरोध है। हिंदी मुख्य पाठ में ‘आत्मा’ संदर्भ से व्यक्तिगत दिव्य अभिप्राय वहन करता है।
- issue: πνευματικοῖς का लिंग और संबोधन
  choice: 'नपुंसकलिंग: आत्मिक शब्दों में'
  alternative: 'पुल्लिंग: आत्मिक लोगों को'
  rationale: दोनों व्याकरणिक रूप संभव हैं। मुख्य पाठ में शब्दों के विषय पर तत्काल बल के कारण नपुंसकलिंग अर्थ चुना गया है, जबकि वैकल्पिक पुल्लिंग अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘मानवीय बुद्धि’, ‘आत्मा’, और ‘आत्मिक’ जैसे परिचित बाइबलीय पद रखे गए हैं। अर्धविराम कठिन अंतिम खंड को पूर्ववर्ती विरोध से स्पष्ट रूप से जोड़ता है।
