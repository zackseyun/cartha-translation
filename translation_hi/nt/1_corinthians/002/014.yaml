source:
  edition: SBLGNT
  text: Ψυχικὸς δὲ ἄνθρωπος οὐ δέχεται τὰ τοῦ πνεύματος τοῦ θεοῦ, μωρία γὰρ αὐτῷ ἐστίν, καὶ οὐ δύναται γνῶναι, ὅτι πνευματικῶς ἀνακρίνεται·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/014.yaml
  text: But the natural person does not accept the things of the Spirit of God[a], for they are foolishness to him, and he is not able to know them[b], because they are spiritually discerned.
translation:
  language: hi
  text: परन्तु स्वाभाविक मनुष्य[a] परमेश्वर की आत्मा की बातों को ग्रहण नहीं करता, क्योंकि वे उसके लिए मूर्खता हैं; और वह उन्हें जान नहीं सकता, क्योंकि वे आत्मिक रीति से परखी जाती हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आत्मिक न होने वाला मनुष्य।”
    reason: lexical_alternative
  - marker: b
    text: या, “समझी जाती हैं” या “जाँची जाती हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ψυχικὸς
  choice: स्वाभाविक
  rationale: यह शब्द यहाँ πνευματικός के विपरीत उस मनुष्य को दर्शाता है जो केवल सामान्य मानवीय जीवन के स्तर पर है। “स्वाभाविक” इस विरोध को बनाए रखता है और यूनानी से अधिक स्पष्ट धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग एकवचन है, पर यहाँ प्रतिनिधिक अर्थ रखता है; हिन्दी में “मनुष्य” उसी सामान्य मानवीय संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δέχεται
  choice: ग्रहण नहीं करता
  rationale: “ग्रहण करना” केवल सूचना पाना नहीं, बल्कि उसे स्वीकार करना भी व्यक्त करता है, जो इस प्रसंग में उपयुक्त है।
- source_word: τὰ τοῦ πνεύματος τοῦ θεοῦ
  choice: परमेश्वर के आत्मा की बातें
  rationale: यह यूनानी संबंध-वाचक रचना की व्यापकता बनाए रखता है और परमेश्वर के आत्मा से संबंधित अथवा उसके द्वारा प्रकट बातों को अनावश्यक रूप से सीमित नहीं करता।
- source_word: μωρία
  choice: मूर्खता
  rationale: यह 1 कुरिन्थियों में परमेश्वर की बुद्धि और मानवीय निर्णय के बीच बार-बार आने वाले विरोध को स्पष्ट और संगत रूप में व्यक्त करता है।
- source_word: γνῶναι
  choice: जान नहीं सकता
  rationale: “जानना” यूनानी γινώσκω का सीधा समतुल्य है और यहाँ पहचानने, ग्रहण करने या समझ पाने की अर्थ-छाया को खुला रखता है।
- source_word: πνευματικῶς
  choice: आत्मिक रीति से
  rationale: यह क्रिया-विशेषण के रूप और आत्मिक ढंग अथवा क्षेत्र में परख किए जाने के अर्थ को बनाए रखता है, बिना इसे स्पष्ट रूप से केवल “आत्मा के द्वारा” बना देने के।
- source_word: ἀνακρίνεται
  choice: परखी जाती हैं
  rationale: ἀνακρίνω में जाँचने, मूल्यांकन करने और विवेक से पहचानने की अर्थ-छायाएँ हैं। “परखी जाती हैं” हिन्दी में स्वाभाविक है और इन अर्थों के बीच पर्याप्त खुलापन बनाए रखता है।
theological_decisions:
- issue: ψυχικὸς ἄνθρωπος और आत्मिक परख के बीच विरोध
  choice: स्वाभाविक मनुष्य
  alternative: आत्मिक न होने वाला मनुष्य
  rationale: “स्वाभाविक मनुष्य” मूल शब्द की संक्षिप्तता और उसके धर्मवैज्ञानिक तनाव को बनाए रखता है। विकल्प अर्थ को अधिक स्पष्ट करता है, पर मूल की अपेक्षा कुछ अधिक व्याख्यात्मक है।
- issue: πνευματικῶς का कर्ता या साधन
  choice: आत्मिक रीति से
  alternative: परमेश्वर के आत्मा के द्वारा
  rationale: यूनानी क्रिया-विशेषण ढंग या क्षेत्र को व्यक्त करता है, पर स्वयं स्पष्ट रूप से साधन नहीं बताता। इसलिए अनुवाद इस संभावित अर्थ को किसी एक व्याख्या में सीमित नहीं करता।
- issue: ἀνακρίνεται में समझने और मूल्यांकन करने की अर्थ-छाया
  choice: परखी जाती हैं
  alternative: आत्मिक रीति से समझी जाती हैं
  rationale: “परखी जाती हैं” मूल क्रिया के जाँचने और विवेकपूर्वक मूल्यांकन करने के बल को सुरक्षित रखता है; पादटिप्पणी अन्य वैध अर्थ-छायाएँ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। “स्वाभाविक मनुष्य” और “आत्मिक रीति से” जैसे पद मूल के संक्षिप्त विरोध और जानबूझकर बनी अर्थगत खुलावट को सुरक्षित रखते हैं; वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
