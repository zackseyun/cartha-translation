base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/009.yaml
  text: But just as it is written[a], “What no eye has seen, and no ear has heard[b], and what has not entered into the heart of man—what God has prepared for those who love him.”
translation:
  language: hi
  text: 'परन्तु, जैसा लिखा है: “जो न किसी आँख ने देखा, न किसी कान ने सुना, और जो किसी मनुष्य के हृदय में नहीं आया[a]—वे बातें परमेश्वर ने उनसे प्रेम करने वालों के लिए तैयार की हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी मनुष्य के मन में नहीं आया” अथवा “किसी को सूझा नहीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: परन्तु
  rationale: पिछले विचार के साथ स्पष्ट विरोध दर्शाता है और गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: καθὼς γέγραπται
  choice: जैसा लिखा है
  rationale: पवित्रशास्त्र के उद्धरण-सूत्र और यूनानी पूर्णकाल के वर्तमान प्रभाव को संक्षेप में बनाए रखता है।
- source_word: Ἃ ... ὅσα
  choice: जो ... वही सब
  rationale: दोनों नपुंसकलिंग बहुवचन संबंधवाचकों की पुनरुक्त और पुनर्ग्राही संरचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὀφθαλμὸς ... οὖς
  choice: किसी आँख ... किसी कान
  rationale: यूनानी के एकवचन सामान्य प्रयोग और काव्यात्मक समानांतरता को सुरक्षित रखता है।
- source_word: ἐπὶ καρδίαν ἀνθρώπου οὐκ ἀνέβη
  choice: किसी मनुष्य के हृदय में नहीं उठा
  rationale: ἀνέβη के ‘ऊपर उठने’ वाले रूपक तथा καρδία के बाइबलीय ‘हृदय’ को बनाए रखते हुए सामान्य मानव-संदर्भ स्पष्ट करता है।
- source_word: ἡτοίμασεν
  choice: तैयार किया है
  rationale: पूर्ण किए गए कार्य की वर्तमान प्रासंगिकता को हिन्दी के पूर्ण पक्ष से व्यक्त करता है।
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: उनसे प्रेम करने वालों के लिए
  rationale: वर्तमान कृदन्त के सतत वर्णन को सहज और अर्थनिष्ठ हिन्दी में प्रस्तुत करता है; सर्वनाम का संबंध परमेश्वर से स्पष्ट रहता है।
theological_decisions:
- issue: ἀνθρώπου का सामान्य मानव-संदर्भ
  choice: किसी मनुष्य के हृदय में
  alternative: मानव-हृदय में; किसी के मन में
  rationale: ‘मनुष्य’ मूल के एकवचन सामान्य रूप को बनाए रखता है और उसे केवल पुरुष तक सीमित नहीं करता; ‘हृदय’ को ‘मन’ बनाकर बाइबलीय मानव-विज्ञान को संकुचित नहीं किया गया।
- issue: वचन का आशय—अकल्पित बात बनाम भविष्य का विशेष विवरण
  choice: मूल उद्धरण की व्यापक और काव्यात्मक अभिव्यक्ति बनाए रखी
  alternative: मनुष्य जिसकी कल्पना नहीं कर सकता था
  rationale: मूल में जो नहीं देखा, सुना या हृदय में उठा और जिसे परमेश्वर ने तैयार किया—इसी तनाव को रखा गया है; किसी खास युगांतशास्त्रीय व्याख्या को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। ‘परन्तु’ और ‘हृदय’ शास्त्रीय स्वर बनाए रखते हैं; अत्यधिक संस्कृतनिष्ठ पदावली से बचा गया है। उद्धरण की त्रिस्तरीय काव्यात्मक समानांतरता और अंतिम पुनर्ग्रहण ‘वही सब’ द्वारा सुरक्षित हैं।
