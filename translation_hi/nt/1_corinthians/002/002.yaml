source:
  edition: SBLGNT
  text: οὐ γὰρ ἔκρινά ⸂τι εἰδέναι⸃ ἐν ὑμῖν εἰ μὴ Ἰησοῦν Χριστὸν καὶ τοῦτον ἐσταυρωμένον·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/002.yaml
  text: For I decided to know nothing among you except Jesus the Messiah—and him crucified[a].
translation:
  language: hi
  text: क्योंकि मैंने ठान लिया था कि तुम्हारे बीच यीशु मसीह को छोड़—उसी को, जो क्रूस पर चढ़ाया गया था—और कुछ न जानूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκρινά
  choice: मैंने निश्चय किया था
  rationale: यहाँ क्रिया न्याय करने की नहीं, बल्कि सोच-समझकर दृढ़ निश्चय करने की ओर संकेत करती है। भूतकाल का रूप कुरिन्थियों के बीच पौलुस की सेवकाई के समय लिए गए निश्चय को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τι εἰδέναι
  choice: किसी और बात को न जानूँ
  rationale: οὐ और εἰ μὴ के साथ यह वाक्यांश प्रतिबंधात्मक है। हिंदी में यह रूप स्पष्ट करता है कि पौलुस के संदेश और ध्यान का एकमात्र केंद्र आगे उल्लिखित यीशु था; इसका आशय पौलुस के समस्त अन्य ज्ञान के पूर्ण निषेध से नहीं है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: यह कुरिन्थियों के बीच पौलुस की उपस्थिति और सेवकाई के संदर्भ को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰ μὴ
  choice: के सिवा
  rationale: यह अपवादसूचक रचना का स्पष्ट और प्रचलित हिंदी समतुल्य है।
- source_word: Ἰησοῦν Χριστόν
  choice: यीशु मसीह
  rationale: Χριστός यहाँ यीशु की मसीही पहचान को सामने रखता है। हिंदी में ‘यीशु मसीह’ पारंपरिक, स्वाभाविक और शीर्षकीय अर्थ को वहन करने वाला रूप है।
- source_word: καὶ τοῦτον ἐσταυρωμένον
  choice: और वह भी क्रूस पर चढ़ाया हुआ
  rationale: τοῦτον का बल ‘वह भी’ से उभरता है और पूर्ण निष्क्रिय कृदंत यीशु को क्रूस पर चढ़ाए जा चुके व्यक्ति के रूप में केंद्रित रखता है। यह हिंदी में मूल की संक्षिप्तता और जोर दोनों बचाता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: इस संदर्भ में शब्द यीशु की मसीही उपाधि और पहचान को व्यक्त करता है। ‘मसीह’ आधुनिक हिंदी बाइबलीय प्रयोग में स्वाभाविक है और ‘अभिषिक्त जन’ के अर्थ को अनावश्यक व्याख्या के बिना संजोता है।
- issue: पौलुस के ‘न जानने’ की सीमा
  choice: किसी और बात को न जानूँ
  alternative: कुछ भी न जानूँ
  rationale: अपवादसूचक रचना को बनाए रखते हुए यह पाठ ध्यान और घोषणा की प्राथमिकता व्यक्त करता है। इसे पौलुस द्वारा हर प्रकार के अन्य ज्ञान के त्याग का दार्शनिक दावा बनाकर तनाव को कृत्रिम रूप से नहीं सुलझाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। डैश मूल वाक्य में यीशु के क्रूस पर चढ़ाए जाने पर आए विशेष जोर को दर्शाते हैं।
