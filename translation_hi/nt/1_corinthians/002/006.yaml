language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Σοφίαν δὲ λαλοῦμεν ἐν τοῖς τελείοις, σοφίαν δὲ οὐ τοῦ αἰῶνος τούτου οὐδὲ τῶν ἀρχόντων τοῦ αἰῶνος τούτου τῶν καταργουμένων·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/006.yaml
  text: Yet we do speak wisdom among the mature[a], but not a wisdom of this age or of the rulers of this age[c][b], who are being brought to nothing.
translation:
  language: hi
  text: फिर भी, हम परिपक्व लोगों के बीच बुद्धि की बात करते हैं[a]—ऐसी बुद्धि जो न इस युग की है, न इस युग के शासकों की[b], जिन्हें निष्प्रभावी किया जा रहा है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सिद्ध लोगों” या “पूर्ण लोगों”; यहाँ संभवतः आशय आध्यात्मिक रूप से परिपक्व लोगों से है।
    reason: lexical_alternative
  - marker: b
    text: “इस युग के शासक” मानवीय अधिकारियों, आत्मिक शक्तियों, या दोनों की ओर संकेत कर सकते हैं।
    reason: alternative_reading
  - marker: c
    text: इसका अनुवाद “जो मिटते जा रहे हैं,” “जिनका अंत किया जा रहा है,” या “जिन्हें निष्फल किया जा रहा है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοφίαν
  choice: बुद्धि
  rationale: σοφία का सीधा और प्रचलित हिन्दी अर्थ; पद में इसकी पुनरावृत्ति को भी बनाए रखा गया है।
- source_word: δὲ
  choice: फिर भी
  rationale: पिछले संदर्भ के साथ विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λαλοῦμεν
  choice: हम ... बात कहते हैं
  rationale: λαλέω के मूल अर्थ ‘बोलना/कहना’ को रखता है; ‘घोषणा करना’ जैसा अधिक विशिष्ट अर्थ नहीं जोड़ता।
- source_word: ἐν τοῖς τελείοις
  choice: परिपक्व लोगों के बीच
  rationale: यहाँ τέλειος का संभावित आशय पूर्णता के बजाय परिपक्वता है; ἐν के सामुदायिक प्रयोग के लिए ‘के बीच’ स्वाभाविक है।
- source_word: οὐ τοῦ αἰῶνος τούτου
  choice: ऐसी बुद्धि नहीं जो इस युग की है
  rationale: αἰών को ‘युग’ कहना उसके कालगत अर्थ को बचाता है और उसे κόσμος अर्थात ‘संसार’ में नहीं बदलता।
- source_word: ἀρχόντων
  choice: शासकों
  rationale: व्यापक शब्द चुना गया है, ताकि मानवीय शासकों, आत्मिक शक्तियों या दोनों की संभावना खुली रहे।
- source_word: τῶν καταργουμένων
  choice: जिन्हें निष्प्रभावी किया जा रहा है
  rationale: καταργέω में शक्तिहीन या अप्रभावी कर देने का भाव है; वर्तमान कृदंत की जारी प्रक्रिया भी बनी रहती है।
theological_decisions:
- issue: ‘इस युग के शासकों’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘शासकों’ कहकर संदर्भ को खुला रखा गया है।
  alternative: इसे केवल मानवीय राजनीतिक/धार्मिक शासक, केवल आत्मिक शक्तियाँ, या दोनों माना जा सकता है।
  rationale: यूनानी पदबंध स्वयं किसी एक व्याख्या को अनिवार्य नहीं करता; इसलिए वास्तविक धर्मवैचारिक अस्पष्टता सुरक्षित रखी गई है।
- issue: τελείοις में पूर्णता या परिपक्वता
  choice: मुख्य पाठ में ‘परिपक्व लोगों’
  alternative: ‘सिद्ध लोगों’ या ‘पूर्ण लोगों’
  rationale: संदर्भ में आध्यात्मिक परिपक्वता अधिक स्वाभाविक है, पर शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप। ‘युग’, ‘शासक’ और ‘निष्प्रभावी’ मूल की अर्थगत व्यापकता तथा धर्मवैचारिक तनाव को बनाए रखते हैं।
