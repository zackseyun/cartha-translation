  text: ὁ δὲ πνευματικὸς ἀνακρίνει ⸀τὰ πάντα, αὐτὸς δὲ ὑπ’ οὐδενὸς ἀνακρίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/015.yaml
  text: But the spiritual person evaluates all things[b][a], yet he himself is evaluated by no one.
translation:
  language: hi
  text: परन्तु आत्मिक व्यक्ति[b] सब बातों को परखता है[a], पर वह स्वयं किसी के द्वारा नहीं परखा जाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जाँचता,” “विवेचन करता” अथवा “मूल्यांकन करता”; आगे आए इसी यूनानी क्रिया के कर्मवाच्य रूप के लिए भी यही विकल्प लागू हैं।
    reason: lexical_alternative
  - marker: b
    text: “आत्मिक व्यक्ति” उस यूनानी पुल्लिंग एकवचन विशेषण का अनुवाद है जो यहाँ संज्ञा के रूप में प्रयुक्त हुआ है; यह सामान्य रूप से ऐसे व्यक्ति को दर्शाता है जिसकी पहचान परमेश्वर के आत्मा से है।
    reason: cultural_note
lexical_decisions:
- source_word: πνευματικὸς
  choice: आत्मिक व्यक्ति
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त है और ऐसे व्यक्ति को दर्शाता है जिसकी पहचान परमेश्वर के आत्मा से है। ‘आत्मिक व्यक्ति’ स्वाभाविक हिन्दी है और इसे केवल पुरुष तक सीमित नहीं करता।
- source_word: ἀνακρίνει / ἀνακρίνεται
  choice: परखता है / परखा जाता
  rationale: ‘परखना’ सावधानी से जाँचने, विवेचन करने और मूल्यांकन करने का भाव व्यक्त करता है। दोनों occurrences में एक ही हिन्दी क्रिया रखकर यूनानी की शाब्दिक पुनरावृत्ति सुरक्षित की गई है।
- source_word: τὰ πάντα
  choice: सब बातों को
  rationale: यह यूनानी पद की व्यापकता बनाए रखता है और हिन्दी में प्रसंगानुकूल तथा स्वाभाविक है; मुख्य पाठ में इसे केवल ‘आत्मिक बातों’ तक सीमित नहीं किया गया।
- source_word: αὐτὸς
  choice: स्वयं वह
  rationale: इससे यूनानी सर्वनाम का बलाघात सुरक्षित रहता है और सामान्य व्यक्ति के लिए लिंग-निरपेक्ष अभिव्यक्ति बनी रहती है।
- source_word: ὑπ’ οὐδενὸς
  choice: किसी के द्वारा नहीं
  rationale: यह कर्मवाच्य रचना और यूनानी के पूर्ण निषेध—‘किसी के द्वारा भी नहीं’—को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: आत्मिक व्यक्ति के विषय में पौलुस के कथन का दायरा
  choice: ‘सब बातों’ और ‘किसी के द्वारा नहीं’ की निरपेक्ष अभिव्यक्ति को मुख्य पाठ में बनाए रखा गया।
  alternative: मुख्य पाठ में कथन को स्पष्टतः केवल आत्मिक बातों तक सीमित करना।
  rationale: पद स्वयं कथन को बिना किसी स्पष्ट सीमा के प्रस्तुत करता है; उसका तात्कालिक प्रसंग व्याख्या की रूपरेखा देता है। मुख्य पाठ में सीमा जोड़ना यूनानी में विद्यमान तनाव को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सामान्य पाठक के लिए बोधगम्य शैली। ‘परन्तु’ और ‘फिर भी’ से दोनों विरोधसूचक δέ का प्रवाह व्यक्त किया गया है। फुटनोट चिह्न मुख्य पाठ में स्पष्ट रूप से उपस्थित हैं।
