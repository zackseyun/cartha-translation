review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the contrast, God's wisdom, its formerly hidden character, God's prior determination, the temporal phrase 'before the ages,' and the purpose 'for our glory.' The placement of the notes correctly corresponds to ἐν μυστηρίῳ, πρὸ τῶν αἰώνων, and προώρισεν.
  naturalness: ‘रहस्य में ... बुद्धि की बात करते हैं’ is overly literal and not idiomatic modern Hindi; it can sound as though the speaking occurs inside a mystery. ‘एक रहस्य के रूप में ... बताते हैं’ communicates the same deliberately compact Greek expression naturally.
  terminology: ‘परमेश्वर की बुद्धि,’ ‘रहस्य,’ ‘छिपी हुई,’ ‘पूर्वनिर्धारित,’ ‘युगों,’ and ‘महिमा’ are appropriate, dignified, and theologically non-sectarian. ‘पूर्वनिर्धारित’ adequately renders προώρισεν without resolving doctrinal questions.
  issues:
  - severity: medium
    issue: The main-text phrase ‘रहस्य में ... बात करते हैं’ is not natural Hindi.
    rationale: While formally close to ἐν μυστηρίῳ, this construction is liable to be misunderstood in Hindi. Rendering it ‘एक रहस्य के रूप में’ retains the noun ‘रहस्य’ and Paul’s concealed-plan sense while making the syntax intelligible.
  - severity: low
    issue: Footnote b has inconsistent terminal punctuation within the second quoted alternative.
    rationale: The alternative should be presented as a phrase, consistently with the first alternative, without a full stop inside the quotation.
