reference: 1 Corinthians 2:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλὰ λαλοῦμεν ⸂θεοῦ σοφίαν⸃ ἐν μυστηρίῳ, τὴν ἀποκεκρυμμένην, ἣν προώρισεν ὁ θεὸς πρὸ τῶν αἰώνων εἰς δόξαν ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/002/007.yaml
  text: But we speak God's wisdom in a mystery[c][b][a], the hidden wisdom that God predestined before the ages for our glory.
translation:
  language: hi
  text: बल्कि हम परमेश्वर की बुद्धि को एक रहस्य के रूप में[a] बताते हैं—उस छिपी हुई बुद्धि को, जिसे परमेश्वर ने युगों से पहले[c] हमारी महिमा के लिए पूर्वनिर्धारित किया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गुप्त रूप से” अथवा “रहस्य में।” यूनानी में “रहस्य” शब्द है, जिसे पौलुस प्रायः परमेश्वर की उस योजना के लिए प्रयोग करते हैं जो पहले छिपी थी, पर अब प्रकट की गई है।
    reason: lexical_alternative
  - marker: b
    text: या “पहले से ठहराया था” अथवा “पहले ही निश्चित किया था”।
    reason: lexical_alternative
  - marker: c
    text: या “सभी युगों से पहले।”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦμεν
  choice: हम ... की बात करते हैं
  rationale: यह λαλέω के साधारण अर्थ ‘बोलना/कहना’ को स्वाभाविक हिन्दी में व्यक्त करता है और इसे औपचारिक ‘घोषणा’ का अतिरिक्त अर्थ नहीं देता।
- source_word: θεοῦ σοφίαν
  choice: परमेश्वर की बुद्धि
  rationale: सम्बन्धकारक रचना को सीधे और स्वाभाविक रूप में रखता है।
- source_word: ἐν μυστηρίῳ
  choice: रहस्य में
  rationale: ‘रहस्य’ पौलुस के उस प्रयोग को सुरक्षित रखता है जिसमें परमेश्वर की पहले छिपी रही योजना अब प्रकट की जाती है; ‘गुप्त रूप से’ कहना अर्थ को अनावश्यक रूप से सीमित कर देता।
- source_word: τὴν ἀποκεκρυμμένην
  choice: उस छिपी हुई बुद्धि की
  rationale: स्त्रीलिंग कृदन्त का सम्बन्ध ‘बुद्धि’ से स्पष्ट करते हुए यूनानी की समानाधिकरणात्मक रचना को बनाए रखता है।
- source_word: προώρισεν
  choice: पूर्वनिर्धारित किया था
  rationale: क्रिया में निहित पहले से निर्धारित करने की प्रबल धारणा को सुरक्षित रखता है, पर किसी विशेष सम्प्रदायगत व्यवस्था को पाठ में नहीं जोड़ता।
- source_word: πρὸ τῶν αἰώνων
  choice: युगों से पहले
  rationale: αἰῶνες का अपेक्षाकृत सीधा अनुवाद है और पौलुस की कालगत-ब्रह्माण्डीय अभिव्यक्ति को बनाए रखता है।
- source_word: εἰς δόξαν ἡμῶν
  choice: हमारी महिमा के लिए
  rationale: उद्देश्यसूचक εἰς और δόξα के धार्मिक भार, दोनों को सीधे व्यक्त करता है।
theological_decisions:
- issue: पौलुस के प्रसंग में προώρισεν का धर्मवैज्ञानिक रूप से महत्त्वपूर्ण अनुवाद
  choice: पूर्वनिर्धारित किया था
  alternative: पहले से ठहराया था / पहले ही निश्चित किया था
  rationale: यह परमेश्वर के पूर्व निर्णय को स्पष्ट रूप से व्यक्त करता है, लेकिन यह तय नहीं करता कि इस अवधारणा को किसी व्यापक सम्प्रदायगत सिद्धान्त में कैसे व्यवस्थित किया जाए।
- issue: ἐν μυστηρίῳ में ‘रहस्य’ का आशय
  choice: रहस्य में
  alternative: गुप्त रूप से / एक रहस्य के रूप में
  rationale: मुख्य पाठ मूल की संक्षिप्तता और सम्भावित अर्थ-विस्तार को बनाए रखता है; पादटिप्पणी स्पष्ट करती है कि पौलुस के यहाँ यह केवल अनसुलझी पहेली नहीं, बल्कि पहले छिपी और अब प्रकट परमेश्वर की योजना भी हो सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण धार्मिक गद्य। ‘परमेश्वर’, ‘बुद्धि’, ‘रहस्य’, ‘महिमा’ और ‘पूर्वनिर्धारित’ जैसे परिचित शब्द मूल की धर्मवैज्ञानिक गहनता बनाए रखते हैं। मुख्य वाक्य में दीर्घ विराम-चिह्न समानाधिकरण को स्पष्ट करता है और ‘छिपी हुई बुद्धि’ को पहले आए ‘परमेश्वर की बुद्धि’ से स्वाभाविक रूप से जोड़ता है।
