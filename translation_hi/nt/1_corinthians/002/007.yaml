revisions:
- from: बल्कि हम रहस्य में[a] परमेश्वर की बुद्धि की बात करते हैं—उस छिपी हुई बुद्धि की, जिसे परमेश्वर ने युगों से पहले[c] हमारी महिमा के लिए पूर्वनिर्धारित किया था[b]।
  to: बल्कि हम परमेश्वर की बुद्धि को एक रहस्य के रूप में[a] बताते हैं—उस छिपी हुई बुद्धि को, जिसे परमेश्वर ने युगों से पहले[c] हमारी महिमा के लिए पूर्वनिर्धारित किया था[b]।
  rationale: The revision replaces an unnatural literal Hindi construction with ‘एक रहस्य के रूप में,’ while retaining the key Pauline term ‘रहस्य’ and preserving the appositional relation to ‘उस छिपी हुई बुद्धि।’ It also regularizes the punctuation in footnote b. No interpretive or doctrinal expansion has been introduced.
