base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/017.yaml
  text: But in giving this instruction[a], I do not praise you, because you come together not for the better but for the worse.
translation:
  language: hi
  text: परन्तु यह निर्देश देते हुए[a] मैं तुम्हारी प्रशंसा नहीं करता, क्योंकि तुम बेहतरी के लिए नहीं, बल्कि बदतरी के लिए एकत्र होते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह आदेश देते हुए।” यूनानी क्रिया का अर्थ निर्देश, हिदायत या आदेश देना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: यह
  rationale: नपुंसकलिंग संकेतवाचक सर्वनाम आगे दिए जाने वाले निर्देश की ओर संकेत करता है; हिन्दी में ‘यह’ स्वाभाविक और संक्षिप्त है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले विषय से हल्का विरोध प्रकट करते हुए सुधारात्मक बात की ओर संक्रमण कराता है।
- source_word: παραγγέλλων
  choice: निर्देश देते हुए
  rationale: वर्तमान कृदन्त का अर्थ निर्देश देना, आदेश देना या हिदायत देना हो सकता है। ‘निर्देश देते हुए’ अधिकारपूर्ण भाव को बनाए रखता है, पर अनावश्यक कठोरता नहीं जोड़ता।
- source_word: οὐκ ἐπαινῶ
  choice: मैं तुम्हारी प्रशंसा नहीं करता
  rationale: ἐπαινέω का सीधा अर्थ प्रशंसा या सराहना करना है; यह पद 2 में की गई प्रशंसा के साथ भी स्पष्ट विरोध बनाता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पौलुस द्वारा प्रशंसा न किए जाने का कारण प्रस्तुत करता है।
- source_word: οὐκ εἰς τὸ κρεῖσσον
  choice: भलाई के लिए नहीं
  rationale: εἰς के साथ तुलनात्मक विशेषण परिणाम या प्रभाव बताता है। ‘भलाई के लिए’ आधुनिक हिन्दी में स्वाभाविक है और सकारात्मक परिणाम का भाव देता है।
- source_word: ἀλλὰ εἰς τὸ ἧσσον
  choice: बल्कि हानि के लिए
  rationale: यह पहले वाक्यांश के विपरीत नकारात्मक परिणाम व्यक्त करता है। ‘हानि’ केवल अमूर्त ‘बदतर’ की अपेक्षा हिन्दी में सभा के नुकसानदेह प्रभाव को स्वाभाविक रूप से बताता है।
- source_word: συνέρχεσθε
  choice: तुम्हारा एकत्र होना
  rationale: क्रिया का प्रयोग समुदाय के सभा के लिए जुटने के अर्थ में अकर्मक है। संज्ञात्मक हिन्दी रचना कारणवाचक वाक्य में सहज बैठती है।
theological_decisions:
- issue: παραγγέλλων का अधिकारपूर्ण स्वर
  choice: निर्देश
  alternative: आदेश
  rationale: यूनानी क्रिया दोनों अर्थ ग्रहण कर सकती है। यहाँ पौलुस आराधना-सभा के विषय में सुधारात्मक प्रेरितीय निर्देश देता है; ‘निर्देश’ उसके अधिकार को बनाए रखते हुए स्वर को आवश्यकता से अधिक कठोर नहीं करता।
- issue: κρεῖσσον और ἧσσον का परिणामगत विरोध
  choice: भलाई / हानि
  alternative: बेहतरी / बदतरी
  rationale: यूनानी तुलनात्मक पद सभा के लाभकारी या नुकसानदेह परिणाम का विरोध दिखाते हैं। हिन्दी में ‘भलाई’ और ‘हानि’ वही व्यावहारिक विरोध स्पष्ट करते हैं, बिना यह निश्चित किए कि हानि केवल आत्मिक, नैतिक या सामुदायिक है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘तुम्हारी’ बहुवचन समुदाय को संबोधित करता है। ‘एकत्र होना’ कलीसियाई सभा का भाव रखता है, जबकि अनावश्यक पारिभाषिक शब्दावली से बचता है।
