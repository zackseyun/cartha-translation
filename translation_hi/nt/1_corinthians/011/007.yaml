  text: ἀνὴρ μὲν γὰρ οὐκ ὀφείλει κατακαλύπτεσθαι τὴν κεφαλήν, εἰκὼν καὶ δόξα θεοῦ ὑπάρχων· ⸀ἡ γυνὴ δὲ δόξα ἀνδρός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/007.yaml
  text: For a man ought not to cover his head[a], since he is the image and glory of God[b]; but the woman is the glory of man.
translation:
  language: hi
  text: क्योंकि पुरुष परमेश्वर का प्रतिरूप और महिमा है; इसलिए उसे अपना सिर ढकना[b] नहीं चाहिए। पर स्त्री पुरुष की महिमा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या ‘अपने सिर पर परदा डालना’; यूनानी अभिव्यक्ति अधिक सामान्य रूप से सिर ढकने की बात कहती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ / ἀνδρός
  choice: पुरुष / पुरुष की
  rationale: यहाँ पुरुष और स्त्री के व्यापक सृष्टि-संबंधी विरोध को व्यक्त करने के लिए सामान्य अर्थ रखा गया है। यूनानी शब्द का अर्थ प्रसंग के अनुसार ‘पति’ भी हो सकता है, इसलिए इस संभावना को पादटिप्पणी में दिया गया है।
- source_word: ὀφείλει
  choice: चाहिए
  rationale: यह नैतिक या मानक दायित्व को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना इसे सीधे आदेश के रूप में कठोर बनाए।
- source_word: κατακαλύπτεσθαι τὴν κεφαλήν
  choice: अपना सिर ढकना
  rationale: यह यूनानी अभिव्यक्ति के सामान्य अर्थ को सीधे और सहज रूप में रखता है तथा आवरण के किसी विशेष प्रकार को मुख्य पाठ में निर्धारित नहीं करता।
- source_word: εἰκὼν
  choice: स्वरूप
  rationale: ‘परमेश्वर का स्वरूप’ हिन्दी बाइबलीय भाषा में εἰκών के सृष्टि-वृत्तांत से जुड़े अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: δόξα
  choice: महिमा
  rationale: दोनों स्थानों पर एक ही शब्द रखकर पद की समानांतरता और उसके व्यापक धर्मवैज्ञानिक अर्थ को सुरक्षित रखा गया है।
- source_word: ὑπάρχων
  choice: क्योंकि वह ... है
  rationale: कृदन्त का कारणसूचक संबंध स्पष्ट करने के लिए स्वाभाविक हिन्दी उपवाक्य अपनाया गया है।
- source_word: ἡ γυνὴ
  choice: स्त्री
  rationale: यह पुरुष के साथ व्यापक स्त्री-पुरुष विरोध को बनाए रखता है। ‘पत्नी’ अर्थ संभव है, पर मुख्य पाठ में वह संबंध आवश्यकता से अधिक सीमित कर देगा।
- source_word: θεοῦ
  choice: परमेश्वर का
  rationale: संबंधकारक को बिना विस्तार या व्याख्यात्मक जोड़ के सीधे सुरक्षित रखा गया है।
theological_decisions:
- issue: ἀνήρ और γυνή को ‘पुरुष/स्त्री’ या ‘पति/पत्नी’ के रूप में प्रस्तुत करना
  choice: पुरुष/स्त्री
  alternative: पति/पत्नी
  rationale: सिर ढकने और सृष्टि-विषयक तर्क का निकट प्रसंग व्यापक स्त्री-पुरुष विरोध का समर्थन करता है। फिर भी यूनानी शब्दों की वैवाहिक अर्थ-संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- issue: पौलुस के असममित कथन को नरम करना या सीधे बनाए रखना
  choice: ‘स्त्री पुरुष की महिमा है’ को सीधे बनाए रखना
  alternative: ‘स्त्री पुरुष की महिमा को प्रतिबिंबित करती है’ अथवा ‘स्त्री पुरुष का सम्मान है’
  rationale: यूनानी पाठ में ἐστιν के साथ सीधा विधान है। ‘प्रतिबिंबित करती है’ जोड़ना या δόξα को केवल ‘सम्मान’ तक सीमित करना मूल कथन के तनाव और अर्थ-व्याप्ति को बदल देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘स्वरूप’ और ‘महिमा’ परिचित बाइबलीय शब्दावली रखते हैं, जबकि वाक्य-संरचना साधारण पाठकों के लिए स्पष्ट है।
