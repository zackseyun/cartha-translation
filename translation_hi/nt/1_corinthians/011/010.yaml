lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पिछले तर्क से निकले कारणात्मक निष्कर्ष को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: ὀφείλει
  choice: रखना चाहिए
  rationale: यह नैतिक अथवा उचित दायित्व का भाव देता है, पर इसे निरपेक्ष कानूनी आदेश की तरह अधिक प्रबल नहीं बनाता।
- source_word: ἡ γυνὴ
  choice: स्त्री
  rationale: यहाँ सप्रत्यय एकवचन प्रतिनिधिक या सामान्य अर्थ में है; व्यापक स्त्री-पुरुष चर्चा के कारण ‘पत्नी’ की अपेक्षा ‘स्त्री’ उपयुक्त है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यूनानी पाठ में स्पष्ट रूप से ‘अधिकार’ है; उसमें ‘चिह्न’ या ‘ओढ़ना’ जैसे शब्द नहीं हैं।
- source_word: ἔχειν
  choice: रखना
  rationale: यह ἔχειν के मूल अर्थ ‘होना/रखना’ को सुरक्षित रखता है और प्रसंग से ‘पहनना’ नहीं जोड़ता।
- source_word: ἐπὶ τῆς κεφαλῆς
  choice: अपने सिर पर
  rationale: यह स्थानसूचक वाक्यांश का स्वाभाविक हिन्दी रूप है; ‘अपने’ हिन्दी में संबंध स्पष्ट करता है, बिना उस वस्तु या भाव को परिभाषित किए जो सिर पर है।
- source_word: διὰ τοὺς ἀγγέλους
  choice: स्वर्गदूतों के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण का भाव देता है। ἄγγελοι का सामान्य और इस प्रसंग में अधिक संभावित अर्थ स्वर्गीय दूत है।
theological_decisions:
- issue: ἐξουσίαν ἔχειν ἐπὶ τῆς κεφαλῆς का अर्थ
  choice: मुख्य पाठ में ‘अपने सिर पर अधिकार रखना’ रखकर यूनानी अभिव्यक्ति की कठिनाई और अस्पष्टता सुरक्षित रखी गई है।
  alternative: ‘अपने सिर पर अधिकार का चिह्न धारण करना’ अथवा ‘अधिकार के चिह्न के रूप में सिर ढकना।’
  rationale: मूल पाठ में ‘चिह्न’, ‘ओढ़ना’ या ‘ढकना’ नहीं है। सामान्य व्याख्यात्मक विस्तार पाद-टिप्पणी में दिया गया है, मुख्य पाठ में नहीं।
- issue: ἀγγέλους का अभिप्राय
  choice: स्वर्गदूत
  alternative: दूत या संदेशवाहक
  rationale: ἄγγελος दोनों अर्थ दे सकता है, पर बिना विशेषण वाला बहुवचन पौलुस के प्रयोग में सामान्यतः स्वर्गीय प्राणियों को सूचित करता है। यह अनुवाद उनके उल्लेख का कारण किसी एक सिद्धांत से निर्धारित नहीं करता।
- issue: γυνή का क्षेत्र
  choice: स्त्री
  alternative: पत्नी
  rationale: प्रसंग स्त्री और पुरुष की व्यापक चर्चा में है; इसलिए वैवाहिक अर्थ तक सीमित करना आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत-सन्निकट शैली अपनाई गई है। कठिन यूनानी वाक्यांश को सहज बनाने के नाम पर उसकी विवादित व्याख्या मुख्य पाठ में नहीं जोड़ी गई। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
