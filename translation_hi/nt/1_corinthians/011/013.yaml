  yaml_path: translation/nt/1_corinthians/011/013.yaml
  text: 'Judge for yourselves: is it proper for a woman to pray to God with her head uncovered?[a]'
translation:
  language: hi
  text: 'तुम स्वयं विचार करो: क्या किसी स्त्री का सिर ढके बिना परमेश्वर से प्रार्थना करना उचित है?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसी पत्नी का,” यदि इस पूरे प्रसंग में γυνή को वैवाहिक अर्थ में समझा जाए।
    reason: वैकल्पिक अर्थ
lexical_decisions:
- source_word: ἐν ὑμῖν αὐτοῖς
  choice: तुम स्वयं
  rationale: यह मुहावरा कुरिन्थियों को अपने ही विवेक से निर्णय करने पर बल देता है; आधुनिक हिन्दी में “तुम स्वयं” इस आत्मवाची बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κρίνατε
  choice: विचार करो
  rationale: आज्ञार्थक क्रिया यहाँ मूल्यांकन करके निष्कर्ष निकालने का आह्वान करती है। “विचार करो” हिन्दी में स्वाभाविक है और प्रसंग में अपेक्षित विवेकपूर्ण निर्णय का भाव रखता है।
- source_word: πρέπον ἐστὶν
  choice: क्या ... उचित है?
  rationale: यह अभिव्यक्ति किसी आचरण के शोभनीय, उपयुक्त या मर्यादानुकूल होने के विषय में पूछती है; “उचित” स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: γυναῖκα
  choice: किसी स्त्री का
  rationale: γυνή का अर्थ “स्त्री” या “पत्नी” हो सकता है। इस वाक्य में पति का स्पष्ट उल्लेख नहीं है और प्रश्न सामान्य रूप में है, इसलिए मुख्य पाठ में “स्त्री” रखा गया है; वैवाहिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἀκατακάλυπτον
  choice: सिर बिना ढके
  rationale: शब्द का मूल अर्थ “अनावृत” है। निकटवर्ती प्रसंग सिर ढकने से संबंधित है, इसलिए निहित अंग को स्पष्ट करना हिन्दी में स्वाभाविक और प्रसंग-संगत है।
- source_word: τῷ θεῷ
  choice: परमेश्वर से
  rationale: προσεύχομαι के साथ सम्प्रदान कारक प्रार्थना के संबोधित व्यक्ति को बताता है। हिन्दी में “परमेश्वर से प्रार्थना करना” सर्वाधिक स्वाभाविक प्रयोग है।
- source_word: προσεύχεσθαι
  choice: प्रार्थना करना
  rationale: यह सामान्य क्रिया “प्रार्थना करना” है और प्रश्न इसी आचरण के उचित होने पर केंद्रित है।
theological_decisions:
- issue: सिर ढकने के प्रसंग में γυνή का अर्थ
  choice: स्त्री
  alternative: पत्नी
  rationale: पद स्वयं किसी पति का उल्लेख नहीं करता और प्रश्न सामान्य ढंग से रखा गया है। अतः मुख्य पाठ में व्यापक अर्थ “स्त्री” चुना गया है, जबकि व्यापक प्रसंग में संभव वैवाहिक अर्थ को पादटिप्पणी में दिया गया है ताकि वास्तविक अर्थगत अस्पष्टता बनी रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सहज भाषा। मूल की प्रश्नात्मक शैली और पाठक से स्वयं निर्णय करने की अपील को बनाए रखा गया है।
