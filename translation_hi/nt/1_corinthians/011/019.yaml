  yaml_path: translation/nt/1_corinthians/011/019.yaml
  text: For there must also be factions among you[b][a], so that those who are approved may also become evident among you.
translation:
  language: hi
  text: क्योंकि तुम्हारे बीच गुट भी अवश्य होंगे[a], ताकि तुम्हारे बीच वे लोग भी प्रकट हो जाएँ जो परीक्षा में खरे ठहरे हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विभाजनकारी दल।” बाद के प्रयोग में इस शब्द का अर्थ “विधर्म” भी हुआ, पर यहाँ सम्भवतः मण्डली के भीतर के गुट अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: “जो परीक्षा में खरे ठहरे हैं” का अनुवाद “जो खरे पाए गए हैं,” “जो प्रमाणित हैं,” या “जो सच्चे सिद्ध हुए हैं” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: अवश्य होंगे
  rationale: यह आवश्यकता की प्रबलता बनाए रखता है, पर यह तय नहीं करता कि वह ईश्वरीय योजना है या परिस्थितिजन्य अनिवार्यता।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पिछले कथन के साथ व्याख्यात्मक संबंध स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: καὶ αἱρέσεις
  choice: गुट भी
  rationale: यहाँ αἱρέσεις मण्डली के भीतर बने विभाजनकारी दलों को दर्शाता है; ‘मत-विरोध’ या ‘विधर्म’ कहने से बाद का पारिभाषिक अर्थ अनावश्यक रूप से आ सकता है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: समुदाय के भीतर होने का स्वाभाविक और स्पष्ट हिन्दी रूप; पद के आरम्भ और अन्त दोनों स्थानों पर इसे रखा गया है।
- source_word: ἵνα
  choice: ताकि
  rationale: ग्रीक के प्रयोजन अथवा परिणाम—दोनों की सम्भावना को खुला रखता है।
- source_word: καὶ οἱ δόκιμοι
  choice: वे लोग भी ... जो परखे हुए हैं
  rationale: δόκιμοι उन लोगों को सूचित करता है जो परीक्षा में खरे या प्रमाणित पाए गए हैं; ‘भी’ दूसरे καί को बनाए रखता है।
- source_word: φανεροὶ γένωνται
  choice: प्रकट हो जाएँ
  rationale: किसी के खुले रूप से पहचाने जाने या स्पष्ट हो जाने की प्रक्रिया और परिणाम दोनों व्यक्त करता है।
theological_decisions:
- issue: αἱρέσεις का अर्थ
  choice: गुट
  alternative: विभाजन, पंथ, विधर्म
  rationale: तात्कालिक प्रसंग कुरिन्थ की मण्डली में सामुदायिक दलों और टूट को संबोधित करता है। ‘विधर्म’ बाद के सैद्धान्तिक अर्थ को पाठ में आरोपित कर सकता है।
- issue: δεῖ की शक्ति
  choice: अवश्य होंगे
  alternative: होना आवश्यक है; होकर रहेंगे
  rationale: मूल पाठ आवश्यकता बताता है, पर उसके स्रोत को स्पष्ट नहीं करता। अनुवाद ईश्वरीय आवश्यकता और व्यावहारिक अनिवार्यता के बीच की अस्पष्टता बनाए रखता है।
- issue: ἵνα का संबंध
  choice: ताकि
  alternative: जिसके परिणामस्वरूप
  rationale: यह रूप प्रयोजन और परिणाम के बीच मूल की सम्भावित अर्थ-व्याप्ति को बिना कठोर निर्णय के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामुदायिक प्रसंग के अनुरूप भाषा। ‘मण्डली’ को मुख्य पाठ में जोड़े बिना ‘तुम्हारे बीच’ से मूल की संक्षिप्तता और पुनरुक्ति सुरक्षित रखी गई है।
