id: 1CO.11.6
reference: 1 Corinthians 11:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ γὰρ οὐ κατακαλύπτεται γυνή, καὶ κειράσθω· εἰ δὲ αἰσχρὸν γυναικὶ τὸ κείρασθαι ἢ ξυρᾶσθαι, κατακαλυπτέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/006.yaml
  text: For if a woman does not cover her head[a], she should also have her hair cut off; but if it is disgraceful for a woman to have her hair cut off or to be shaved[b], she should cover her head.
translation:
  language: hi
  text: क्योंकि यदि कोई स्त्री[a] अपना सिर नहीं ढकती[b], तो वह अपने बाल भी छोटे कटवा ले; पर यदि स्त्री के लिए बाल छोटे कटवाना या सिर मुँडवाना लज्जाजनक है, तो वह अपना सिर ढके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पत्नी’; यूनानी शब्द γυνή का अर्थ प्रसंग के अनुसार ‘स्त्री’ या ‘पत्नी’ हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या ‘ढकी नहीं है’ अथवा ‘आवरण में नहीं है’। यूनानी में केवल ढके जाने की बात है; प्रसंग से सिर का ढका जाना समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαλύπτεται / κατακαλυπτέσθω
  choice: अपना सिर नहीं ढकती / अपना सिर ढके
  rationale: क्रिया का अर्थ ढकना या आवरण लेना है। प्रसंग में सिर का ढका जाना अभिप्रेत है, इसलिए स्वाभाविक हिन्दी के लिए ‘सिर’ स्पष्ट किया गया है; किसी विशेष प्रकार के वस्त्र का उल्लेख नहीं जोड़ा गया।
- source_word: γυνή
  choice: स्त्री
  rationale: γυνή का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है। इस पद का कथन सामान्य रूप में है और पति का स्पष्ट उल्लेख नहीं है, इसलिए मुख्य पाठ में अधिक व्यापक ‘स्त्री’ रखा गया है; ‘पत्नी’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: κείρασθω / τὸ κείρασθαι
  choice: अपने बाल भी छोटे कटवा ले / बाल छोटे कटवाना
  rationale: क्रिया बाल कतरने या छोटे कटवाने को सूचित करती है। ‘छोटे’ जोड़ने से सामान्य रूप से थोड़ा बाल कटवाने का अर्थ टलता है और अगले शब्द ‘सिर मुँडवाना’ से भेद बना रहता है।
- source_word: καί
  choice: भी
  rationale: 'यह तर्क में परिणामस्वरूप अगला कदम जोड़ता है: यदि वह सिर नहीं ढकती, तो बाल भी छोटे कटवा ले।'
- source_word: αἰσχρόν
  choice: लज्जाजनक
  rationale: यह शब्द सामाजिक लज्जा और अपमान के भाव को व्यक्त करता है। ‘लज्जाजनक’ आधुनिक, गरिमापूर्ण हिन्दी में इस भाव को स्वाभाविक रूप से रखता है।
- source_word: ξυρᾶσθαι
  choice: सिर मुँडवाना
  rationale: क्रिया उस्तरे से बाल साफ करने का अर्थ देती है। हिन्दी में ‘सिर मुँडवाना’ स्पष्ट है और बाल छोटे कटवाने से इसका भेद बनाए रखता है।
- source_word: γὰρ ... δέ
  choice: क्योंकि ... पर
  rationale: ये संयोजक पिछले कथन का कारण और फिर उसके विपरीत पक्ष को प्रस्तुत करते हैं; ‘क्योंकि ... पर’ हिन्दी में तर्क-प्रवाह को स्पष्ट रखता है।
theological_decisions:
- issue: γυνή को ‘स्त्री’ या ‘पत्नी’ अनूदित करना
  choice: स्त्री
  alternative: पत्नी
  rationale: पद में पति-पत्नी के संबंध का स्पष्ट उल्लेख नहीं है, इसलिए ‘स्त्री’ मूल की व्यापक सम्भावना को बनाए रखता है और कथन को केवल विवाहित स्त्रियों तक सीमित नहीं करता। फिर भी व्यापक प्रसंग के कारण ‘पत्नी’ सम्भव है, अतः उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज और गरिमापूर्ण रखी गई है। ‘अपना सिर ढके’ किसी खास आवरण या स्थानीय रीति को निर्धारित नहीं करता। ‘बाल छोटे कटवाना’ और ‘सिर मुँडवाना’ के बीच मूल यूनानी का भेद सुरक्षित रखा गया है।
