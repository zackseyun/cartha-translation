  text: ⸀οὐδὲ ⸂ἡ φύσις αὐτὴ⸃ διδάσκει ὑμᾶς ὅτι ἀνὴρ μὲν ἐὰν κομᾷ, ἀτιμία αὐτῷ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/014.yaml
  text: Does not even nature itself teach you that if a man wears long hair[a], it is a dishonor to him[b],
translation:
  language: hi
  text: क्या स्वयं प्रकृति[b] भी तुम्हें यह नहीं सिखाती कि यदि कोई पुरुष लंबे बाल रखता है[a], तो यह उसके लिए अपमान की बात है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने बाल बढ़ने देता है’ अथवा ‘उसके बाल लंबे हैं।’ यूनानी क्रिया लंबे बाल रखने या धारण करने का बोध कराती है।
    reason: lexical_alternative
  - marker: b
    text: ‘स्वयं प्रकृति’ से सृष्टिगत व्यवस्था, सामान्य मानवीय समझ, या किसी संस्कृति में स्वाभाविक रूप से उचित मानी जाने वाली बात का संकेत हो सकता है; यहाँ यूनानी अभिव्यक्ति अर्थ को और अधिक सीमित नहीं करती।
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ
  choice: क्या ... भी ... नहीं
  rationale: नकारात्मक आलंकारिक प्रश्न और οὐδέ के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡ φύσις αὐτὴ
  choice: स्वयं प्रकृति
  rationale: αὐτή द्वारा दिए गए बल को बनाए रखता है और φύσις का आशय अनावश्यक रूप से केवल जीवविज्ञान या रीति तक सीमित नहीं करता।
- source_word: διδάσκει ὑμᾶς
  choice: तुम्हें ... सिखाती
  rationale: वर्तमानकालीन क्रिया और उसके प्रत्यक्ष कर्म का स्पष्ट, स्वाभाविक अनुवाद है।
- source_word: ἀνὴρ
  choice: कोई पुरुष
  rationale: यहाँ स्त्री के साथ लिंगगत तुलना है, पति-पत्नी का विशेष संदर्भ नहीं; इसलिए 'पुरुष' उपयुक्त है।
- source_word: μέν
  choice: प्रत्यक्ष रूप से अनूदित नहीं
  rationale: यह अगले पद में आने वाले विरोध के पहले पक्ष को चिह्नित करता है; हिन्दी में इसे यहाँ अलग शब्द से व्यक्त करना अस्वाभाविक होगा।
- source_word: ἐὰν κομᾷ
  choice: यदि कोई पुरुष लंबे बाल रखता है
  rationale: κομάω बाल लंबे रखने या लंबे बाल धारण करने को दर्शाता है; यह हिन्दी में सहज और अर्थसंगत है।
- source_word: ἀτιμία αὐτῷ ἐστιν
  choice: यह उसके लिए अपमान की बात है
  rationale: सम्मान-अपमान के संदर्भ को बनाए रखते हुए यूनानी विधेयात्मक रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पौलुस के तर्क में φύσις का अर्थ
  choice: '''स्वयं प्रकृति'' कहकर अर्थ को व्यापक रखा गया है।'
  alternative: सृष्टिगत व्यवस्था; सामान्य मानवीय समझ; संस्कृति में स्वाभाविक मानी जाने वाली उपयुक्तता
  rationale: यूनानी शब्द यहाँ इनमें से किसी एक अर्थ को स्पष्ट रूप से निर्धारित नहीं करता; इसलिए अनुवाद व्याख्यात्मक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आलंकारिक प्रश्न तथा 'प्रकृति' की वास्तविक अर्थगत व्यापकता सुरक्षित है।
