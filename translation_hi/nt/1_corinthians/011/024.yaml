source:
  edition: SBLGNT
  text: καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀εἶπεν· Τοῦτό μού ἐστιν τὸ σῶμα τὸ ὑπὲρ ⸀ὑμῶν· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/024.yaml
  text: And after giving thanks[a], he broke it and said, “This is my body, which is for you[b]. Keep doing this in remembrance of me.”
translation:
  language: hi
  text: और धन्यवाद देने के बाद उसने रोटी तोड़ी और कहा, “यह मेरी देह है, जो तुम्हारे लिए है।[a][b] मेरी याद में यह करते रहो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी ओर से” अथवा “तुम्हारी खातिर।”
    reason: lexical_alternative
  - marker: b
    text: 'कुछ पांडुलिपियाँ “तुम्हारे लिए” के बाद “तोड़ी जाती है” जोड़ती हैं: “यह मेरी देह है, जो तुम्हारे लिए तोड़ी जाती है।”'
    reason: textual_variant
lexical_decisions:
- source_word: εὐχαριστήσας
  choice: धन्यवाद देने के बाद
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले की क्रिया बताता है; यह रूप क्रम को स्वाभाविक और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: ἔκλασεν
  choice: उसने रोटी तोड़ी
  rationale: क्रिया का अर्थ ‘तोड़ा’ है। यूनानी में कर्म प्रसंग से समझा जाता है; हिंदी में ‘रोटी’ जोड़ने से आशय स्पष्ट और स्वाभाविक होता है।
- source_word: Τοῦτό μού ἐστιν τὸ σῶμα
  choice: यह मेरी देह है
  rationale: सीधे संयोजक वाक्य को बिना व्याख्यात्मक बदलाव के प्रस्तुत किया गया है; ‘इसका अर्थ मेरी देह है’ कहना मूल से अधिक व्याख्या जोड़ता।
- source_word: τὸ ὑπὲρ ὑμῶν
  choice: जो तुम्हारे लिए है
  rationale: ὑπέρ के साथ संबंधकारक लाभ अथवा किसी की ओर से होने का भाव दे सकता है। ‘तुम्हारे लिए’ संक्षिप्त है और किसी विशेष प्रायश्चित्त-सिद्धांत को आरोपित किए बिना मूल भाव बनाए रखता है।
- source_word: τοῦτο ποιεῖτε
  choice: यह करते रहो
  rationale: वर्तमानकालीन आज्ञार्थक इस प्रसंग में बार-बार जारी रहने वाली प्रथा का भाव रख सकता है; ‘करते रहो’ उस सतत बल को सहज हिंदी में व्यक्त करता है।
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: मेरी याद में
  rationale: ἀνάμνησις सक्रिय स्मरण अथवा स्मरणोत्सव का भाव रखता है। ‘मेरी याद में’ सामान्य पाठक के लिए स्वाभाविक है और अनावश्यक रूप से अंतिम-संस्कार जैसा भाव नहीं लाता।
theological_decisions:
- issue: प्रभु-भोज के प्रसंग में ‘यह मेरी देह है’ का अर्थ
  choice: वाक्य को सीधे ‘यह मेरी देह है’ रखा गया है।
  alternative: ‘यह मेरी देह का प्रतीक है’ अथवा किसी विशिष्ट साक्रामेंतीय व्याख्या को स्पष्ट करना
  rationale: यूनानी वाक्य स्वयं बाद की धर्मसैद्धांतिक बहसों में से किसी एक व्याख्या को स्पष्ट नहीं करता; सीधा अनुवाद उस तनाव को सुरक्षित रखता है।
- issue: ὑπὲρ ὑμῶν का बल
  choice: तुम्हारे लिए
  alternative: तुम्हारी ओर से; तुम्हारे हित के लिए
  rationale: पदबंध श्रोताओं के लाभ या उनकी ओर से होने का भाव देता है, पर किसी अधिक तकनीकी प्रायश्चित्त-सूत्र को अनिवार्य नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और संबोधनानुकूल रूप रखा गया है। निकट प्रसंग में रोटी स्पष्ट होने के कारण हिंदी में उसे कर्म के रूप में व्यक्त किया गया है।
