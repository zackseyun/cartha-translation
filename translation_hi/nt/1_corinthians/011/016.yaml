  yaml_path: translation/nt/1_corinthians/011/016.yaml
  text: But if anyone seems to be contentious[a], we have no such custom[b], nor do the churches of God.
translation:
  language: hi
  text: लेकिन यदि कोई झगड़ालू प्रतीत होता है[a], तो हमारी ऐसी कोई रीति नहीं है[b], और न ही परमेश्वर की कलीसियाओं में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि कोई अपने को झगड़ालू समझता है”; अथवा, “यदि कोई विवादप्रिय है।”
    reason: lexical_alternative
  - marker: b
    text: “ऐसी कोई रीति” का संकेत या तो झगड़ालू होने की प्रथा की ओर, या पिछले पदों में चर्चा की गई प्रथा की ओर हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: δοκεῖ
  choice: होना चाहता है
  rationale: δοκεῖ का अर्थ यहाँ केवल बाहरी रूप से ‘लगना’ नहीं, बल्कि ‘अपने को ऐसा मानना/ऐसा होना उचित समझना’ भी हो सकता है। स्वाभाविक हिन्दी में ‘होना चाहता है’ विवाद पर आमादा होने की प्रवृत्ति व्यक्त करता है, यद्यपि यह अर्थगत विकल्प पादटिप्पणी में स्पष्ट किया गया है।
- source_word: φιλόνεικος
  choice: झगड़ालू
  rationale: यह शब्द विवाद या कलह की ओर झुकाव रखने वाले व्यक्ति को दर्शाता है। ‘झगड़ालू’ सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τοιαύτην
  choice: ऐसी
  rationale: यह पीछे कही गई किसी प्रकार की रीति या प्रवृत्ति की ओर संकेत करता है और उसके संदर्भ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: συνήθειαν
  choice: रीति
  rationale: यह प्रचलित व्यवहार, प्रथा या स्थापित चलन को दर्शाता है। ‘रीति’ संक्षिप्त और गरिमापूर्ण है तथा संदर्भ की अस्पष्टता बनाए रखता है।
- source_word: οὐκ ἔχομεν
  choice: हमारी ... नहीं है
  rationale: यह यूनानी ‘हमारे पास नहीं है’ का स्वाभाविक हिन्दी रूप है और ‘हम नहीं मानते’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: ἐκκλησίαι τοῦ θεοῦ
  choice: परमेश्वर की कलीसियाओं
  rationale: यह संबंधवाचक यूनानी पदबंध को निकटता से रखता है और परमेश्वर से संबंधित स्थानीय विश्वास-समुदायों का बहुवचन बनाए रखता है।
theological_decisions:
- issue: ‘ऐसी कोई रीति’ का संदर्भ
  choice: मुख्य पाठ में संदर्भ को खुला रखा गया है।
  alternative: यह या तो झगड़ालू होने की रीति को, या पिछले पदों में चर्चित प्रथा को सूचित कर सकता है।
  rationale: τοιαύτην συνήθειαν संक्षिप्त है और उसका सटीक पूर्वसंदर्भ विवादित है; किसी एक अर्थ को मुख्य पाठ में निश्चित करना मूल की वास्तविक अस्पष्टता मिटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। ‘कलीसिया’ बाइबलीय समुदाय के लिए परिचित पद है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
