source:
  edition: SBLGNT
  text: ⸀εἴ τις πεινᾷ, ἐν οἴκῳ ἐσθιέτω, ἵνα μὴ εἰς κρίμα συνέρχησθε. Τὰ δὲ λοιπὰ ὡς ἂν ἔλθω διατάξομαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/034.yaml
  text: If anyone is hungry[a], let him eat at home, so that you may not come together for judgment. And I will give directions about the rest when I come.
translation:
  language: hi
  text: यदि कोई भूखा हो, तो वह घर पर खा ले, ताकि तुम न्याय के लिए एकत्र न हो।[a] बाकी बातों के विषय में जब मैं आऊँगा, तब निर्देश दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दण्ड के लिए” या “दण्डाज्ञा के लिए।” यूनानी शब्द κρίμα का अर्थ “न्याय,” “दण्ड” या “दण्डाज्ञा” हो सकता है। निकटवर्ती प्रसंग (पद 29–32) में प्रभु के वर्तमान अनुशासनात्मक न्याय का उल्लेख है; इसलिए यहाँ “न्याय” अंतिम दण्डाज्ञा को निश्चित किए बिना अर्थ को खुला रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινᾷ
  choice: भूखा हो
  rationale: वर्तमान दशा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; सशर्त वाक्य में ‘हो’ सहज है।
- source_word: ἐν οἴκῳ
  choice: घर पर
  rationale: घरेलू स्थान पर खाने और कलीसिया की सभा में खाने के बीच का भेद स्पष्ट करता है।
- source_word: ἐσθιέτω
  choice: वह ... खा ले
  rationale: तृतीय पुरुष आज्ञार्थक का स्वाभाविक हिन्दी रूप है और निर्देश की शक्ति बनाए रखता है।
- source_word: εἰς κρίμα
  choice: दण्ड का कारण
  rationale: कρίμα के न्यायिक और प्रतिकूल परिणाम का भाव व्यक्त करता है, जबकि प्रसंग में इसे अनिवार्यतः अंतिम दण्डाज्ञा नहीं ठहराता।
- source_word: συνέρχησθε
  choice: तुम्हारा एकत्र होना
  rationale: इस अनुच्छेद में कलीसिया के एकत्र होने की बार-बार आने वाली धारणा से संबंध बनाए रखता है।
- source_word: Τὰ δὲ λοιπὰ
  choice: बाकी बातों के विषय में
  rationale: शेष मामलों की ओर स्वाभाविक संक्रमण है।
- source_word: ὡς ἂν ἔλθω
  choice: जब मैं आऊँगा
  rationale: पौलुस की अपेक्षित भावी यात्रा को सहज हिन्दी में व्यक्त करता है।
- source_word: διατάξομαι
  choice: निर्देश दूँगा
  rationale: व्यावहारिक मामलों के संबंध में व्यवस्था या आदेश देने का अर्थ स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: प्रभु-भोज की सभा के विषय में चेतावनी में κρίμα का अर्थ
  choice: दण्ड, जिसका स्वरूप पद में खुला रखा गया है
  alternative: न्याय; दण्डाज्ञा
  rationale: निकटवर्ती प्रसंग में प्रभु के वर्तमान अनुशासनात्मक न्याय और संसार के साथ दण्डित होने में भेद है। मुख्य पाठ चेतावनी की गंभीरता रखता है, और पादटिप्पणी सम्भव अर्थों को बिना अंतिम दण्डाज्ञा मान लेने के स्पष्ट करती है।
- issue: अनिश्चित एकवचन τις और एकवचन आज्ञार्थक
  choice: यदि कोई ... तो वह
  alternative: यदि कोई व्यक्ति ... तो वे
  rationale: यूनानी के अनिश्चित एकवचन को स्वाभाविक और लिंग-समावेशी हिन्दी में रखा गया है; ‘वह’ किसी भी व्यक्ति के लिए प्रयुक्त हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानपूर्ण किंतु सामान्य पाठक के लिए सहज। ‘खा ले’ निर्देश को स्वाभाविक बनाता है, और ‘एकत्र होना’ आसपास के सभा-संबंधी प्रसंग से शब्दगत संबंध बनाए रखता है।
