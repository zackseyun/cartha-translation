id: 1CO.11.22
reference: 1 Corinthians 11:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μὴ γὰρ οἰκίας οὐκ ἔχετε εἰς τὸ ἐσθίειν καὶ πίνειν; ἢ τῆς ἐκκλησίας τοῦ θεοῦ καταφρονεῖτε, καὶ καταισχύνετε τοὺς μὴ ἔχοντας; τί ⸂εἴπω ὑμῖν⸃; ἐπαινέσω ὑμᾶς; ἐν τούτῳ οὐκ ἐπαινῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/022.yaml
  text: For do you not have houses for eating and drinking? Or do you despise the church of God and shame those who have nothing? What should I say to you? Should I praise you? In this I do not praise you[a].
translation:
  language: hi
  text: क्या खाने-पीने के लिए तुम्हारे अपने घर नहीं हैं? या तुम परमेश्वर की कलीसिया को तुच्छ समझते और जिनके पास कुछ नहीं है, उन्हें लज्जित करते हो? मैं तुमसे क्या कहूँ? क्या तुम्हारी प्रशंसा करूँ? इस बात में मैं तुम्हारी प्रशंसा नहीं करता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गरीबों को” अथवा “जिनके पास भोजन नहीं है, उन्हें”; यूनानी में शाब्दिक अर्थ है, “जो नहीं रखते।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκίας
  choice: अपने घर
  rationale: बहुवचन निजी घरेलू स्थानों को एकत्रित कलीसिया से अलग दिखाता है। ‘अपने घर’ स्वाभाविक हिन्दी में इस विरोध को स्पष्ट रखता है।
- source_word: εἰς τὸ ἐσθίειν καὶ πίνειν
  choice: खाने-पीने के लिए
  rationale: पूर्वसर्ग और क्रियार्थक संज्ञाओं की रचना उद्देश्य व्यक्त करती है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐκκλησίας τοῦ θεοῦ
  choice: परमेश्वर की कलीसिया
  rationale: यह परमेश्वर से संबंधित एकत्रित विश्वासियों के समुदाय के लिए पौलुस का प्रचलित प्रयोग है; ‘कलीसिया’ संस्थागत अर्थ को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: καταφρονεῖτε
  choice: तुच्छ समझते
  rationale: क्रिया किसी को कम मूल्य का मानने या अवमानना करने का तीखा नैतिक भाव रखती है।
- source_word: καταισχύνετε
  choice: लज्जित करते
  rationale: यह दूसरों को लज्जा या अपमान की स्थिति में डालने का अर्थ सीधे व्यक्त करता है।
- source_word: τοὺς μὴ ἔχοντας
  choice: जिनके पास कुछ नहीं है
  rationale: यूनानी का शाब्दिक अर्थ ‘जो नहीं रखते’ है। यह संदर्भगत निर्धनता की ओर संकेत करते हुए भी अभिव्यक्ति की व्यापकता बनाए रखता है।
- source_word: τί εἴπω ὑμῖν;
  choice: मैं तुमसे क्या कहूँ?
  rationale: विचारात्मक प्रश्न पौलुस की अलंकारिक असमंजस और फटकार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπαινέσω ὑμᾶς;
  choice: क्या तुम्हारी प्रशंसा करूँ?
  rationale: यह विचारात्मक अलंकारिक प्रश्न है जिसका अपेक्षित उत्तर नकारात्मक है।
- source_word: ἐν τούτῳ
  choice: इस बात में
  rationale: यह चर्चा के वर्तमान विषय की ओर संकेत करता है और अस्पष्ट संकेतवाचकता को अनावश्यक रूप से नहीं खोलता।
- source_word: οὐκ ἐπαινῶ
  choice: मैं तुम्हारी प्रशंसा नहीं करता
  rationale: ‘प्रशंसा’ की पुनरावृत्ति यूनानी ἐπαινέσω/ἐπαινῶ के अलंकारिक दोहराव को सुरक्षित रखती है।
theological_decisions:
- issue: प्रभु-भोज के संदर्भ में τοὺς μὴ ἔχοντας का आशय
  choice: जिनके पास कुछ नहीं है
  alternative: गरीब; जिनके पास भोजन नहीं है
  rationale: तात्कालिक संदर्भ आर्थिक रूप से वंचित विश्वासियों का प्रबल संकेत देता है, पर यूनानी अभिव्यक्ति स्वयं अधिक व्यापक है। मुख्य पाठ उसकी व्यापकता बनाए रखता है और पादटिप्पणी संदर्भगत विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। तीखे अलंकारिक प्रश्न और ‘प्रशंसा’ की पुनरावृत्ति मूल की फटकार को बनाए रखते हैं।
