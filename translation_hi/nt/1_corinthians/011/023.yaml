source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ ⸀παρεδίδετο ἔλαβεν ἄρτον
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/023.yaml
  text: 'For I received from the Lord what I also delivered to you: that the Lord Jesus[a], on the night when he was being handed over, took bread'
translation:
  language: hi
  text: 'क्योंकि मैंने प्रभु से वही प्राप्त किया जो मैंने तुम्हें भी सौंप दिया: कि प्रभु यीशु ने, जिस रात उन्हें सौंपा जा रहा था[a], रोटी ली।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या परंपरागत रूप से, “जिस रात उनके साथ विश्वासघात हुआ था।”
    reason: alternative_reading
lexical_decisions:
- source_word: παρέλαβον
  choice: पाया
  rationale: यह पौलुस द्वारा प्रभु-भोज संबंधी परंपरा या शिक्षा ग्रहण करने को व्यक्त करता है। ‘पाया’ आधुनिक और सहज है तथा आगे के ‘सौंप दिया’ के साथ ग्रहण करने और आगे देने का संबंध बनाए रखता है।
- source_word: ἀπὸ τοῦ κυρίου
  choice: प्रभु से
  rationale: यूनानी वाक्यांश स्रोत को सूचित करता है। इसे ‘प्रभु यीशु से’ कहकर विस्तृत नहीं किया गया, क्योंकि अगला उपवाक्य स्वयं ‘प्रभु यीशु’ की पहचान देता है।
- source_word: παρέδωκα
  choice: सौंप दिया
  rationale: यह प्राप्त परंपरा को आगे देने का भाव स्वाभाविक हिन्दी में व्यक्त करता है और इसी पद में आने वाले παραδίδωμι के साथ शब्दगत संबंध भी बनाए रखता है।
- source_word: ὅτι
  choice: ':'
  rationale: हिन्दी में द्विबिंदु उस विषय-वस्तु को स्वाभाविक रूप से आरम्भ करता है जिसे पौलुस ने सौंपा; यहाँ शाब्दिक ‘कि’ की अपेक्षा यह वाक्य-विन्यास अधिक साफ़ है।
- source_word: κύριος
  choice: प्रभु
  rationale: यह श्रद्धापूर्ण और मसीह-संबंधी दोनों अर्थों को सुरक्षित रखने वाला प्रचलित हिन्दी समतुल्य है।
- source_word: ἐν τῇ νυκτὶ ᾗ
  choice: जिस रात
  rationale: यह काल-सूचक संबंधवाचक रचना का संक्षिप्त, स्वाभाविक हिन्दी रूप है।
- source_word: παρεδίδετο
  choice: उन्हें सौंपा जा रहा था
  rationale: अपूर्ण भूतकालिक कर्मवाच्य क्रिया की जारी प्रक्रिया को व्यक्त करता है और ‘पकड़वाया/विश्वासघात किया गया’ जैसे अधिक संकुचित अर्थ तक सीमित नहीं करता।
- source_word: ἔλαβεν ἄρτον
  choice: रोटी ली
  rationale: यह सरल, स्वाभाविक और प्रभु-भोज के प्रसंग में पहचाना जाने वाला रूप है; अनिश्चित ἄρτον के लिए हिन्दी में अनावश्यक रूप से ‘एक रोटी’ कहना जरूरी नहीं है।
theological_decisions:
- issue: प्रभु यीशु के παρεδίδετο का अनुवाद
  choice: उन्हें सौंपा जा रहा था
  alternative: उनके साथ विश्वासघात किया गया था / उन्हें पकड़वाया जा रहा था
  rationale: παραδίδωμι का अर्थ किसी को सौंपना, हवाले करना या प्रसंगानुसार विश्वासघात करके पकड़वाना हो सकता है। मुख्य पाठ का व्यापक रूप मानवीय विश्वासघात और यीशु के सौंपे जाने की व्यापक दुःखभोग-संबंधी अर्थवत्ता दोनों को खुला रखता है; पारंपरिक संकुचित अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘तुम्हें’ बहुवचन समुदाय को संबोधित करता है। मुख्य पाठ में ‘सौंपा’ की पुनरावृत्ति जानबूझकर रखी गई है, क्योंकि यूनानी में παρέδωκα और παρεδίδετο एक ही क्रिया-परिवार से हैं।
