id: 1CO.11.15
reference: 1 Corinthians 11:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: γυνὴ δὲ ἐὰν κομᾷ, δόξα αὐτῇ ἐστιν; ὅτι ἡ κόμη ἀντὶ περιβολαίου ⸀δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/015.yaml
  text: But if a woman has long hair[a], it is her glory[b], because her hair has been given to her instead of a covering.
translation:
  language: hi
  text: पर यदि कोई स्त्री[a] लंबे बाल रखती है, तो यह उसके लिए गौरव की बात है, क्योंकि उसके बाल उसे आवरण के बदले[b] दिए गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पत्नी’। यूनानी शब्द का अर्थ संदर्भ के अनुसार ‘स्त्री’ या ‘पत्नी’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘आवरण के रूप में’। यूनानी संबंधबोधक शब्द अनुरूपता या प्रतिस्थापन व्यक्त कर सकता है; यह वाक्यांश अपने-आप यह तय नहीं करता कि बाल ही आवरण का काम करते हैं या किसी आवरण के संबंध में दिए गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: स्त्री
  rationale: यह शब्द संदर्भ के अनुसार ‘स्त्री’ या ‘पत्नी’ हो सकता है। यहाँ कथन सामान्य रूप में है, इसलिए ‘स्त्री’ अधिक स्वाभाविक है; वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: κομᾷ
  choice: लंबे बाल रखती है
  rationale: क्रिया केवल बाल होने को नहीं, बल्कि बाल लंबे रखने या बढ़ाने को व्यक्त करती है। यह हिंदी में सहज और अर्थ-सटीक है।
- source_word: δόξα
  choice: गौरव की बात
  rationale: यहाँ δόξα उस बात को दर्शाता है जिससे सम्मान या प्रतिष्ठा होती है। ‘गौरव की बात’ हिंदी में स्वाभाविक रहते हुए यूनानी शब्द की अलंकारिक शक्ति बनाए रखता है।
- source_word: κόμη
  choice: बाल
  rationale: शब्द सिर के बालों को, प्रायः लंबे बालों की छाया के साथ, दर्शाता है। पिछली क्रिया में लंबाई पहले ही स्पष्ट है, इसलिए यहाँ केवल ‘बाल’ अनावश्यक दोहराव से बचाता है।
- source_word: ἀντί
  choice: के बदले
  rationale: ἀντί सामान्यतः प्रतिस्थापन या अनुरूपता व्यक्त करता है। ‘के बदले’ उसके प्रमुख बल को बनाए रखता है, जबकि दूसरी सम्भावना पाद-टिप्पणी में दी गई है।
- source_word: περιβολαίου
  choice: आवरण
  rationale: यह किसी लपेटी या ओढ़ी जाने वाली ढकने की वस्तु के लिए सामान्य शब्द है। ‘आवरण’ पर्याप्त व्यापक है; ‘घूँघट’ या ‘ओढ़नी’ यूनानी से अधिक विशिष्ट होते।
- source_word: δέδοται
  choice: दिए गए हैं
  rationale: पूर्णकालिक कर्मवाच्य किसी पूर्व दिए जाने से बनी वर्तमान अवस्था को व्यक्त करता है। हिंदी में ‘दिए गए हैं’ कर्मवाच्य और परिणामी अवस्था दोनों को सहज रूप से रखता है।
theological_decisions:
- issue: क्या περιβόλαιον को विशेष रूप से ‘घूँघट’ या ‘ओढ़नी’ कहा जाए और इस प्रकार बालों को ही इस प्रसंग का अपेक्षित सिर-आवरण माना जाए?
  choice: सामान्य शब्द ‘आवरण’ रखा गया है और ἀντί का अनुवाद ‘के बदले’ किया गया है।
  alternative: ‘ओढ़नी’, ‘घूँघट’, अथवा ‘आवरण के रूप में’
  rationale: यूनानी संज्ञा किसी खास प्रकार के सिर-आवरण को अनिवार्य नहीं करती, और ἀντί प्रतिस्थापन के साथ अनुरूपता भी व्यक्त कर सकता है। यह अनुवाद व्यापक व्याख्यात्मक विवाद को पद के भीतर निर्णीत नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सामान्य पाठक के लिए सहज किंतु गरिमापूर्ण रखी गई है। ‘गौरव की बात’ और ‘आवरण’ जैसे पद अर्थ-सटीक हैं तथा किसी विशिष्ट सांप्रदायिक व्याख्या को आरोपित नहीं करते।
