review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the inferential force of Ὥστε, the indefinite general condition, the disjunction ‘या,’ the adverbial force of ἀναξίως, and the future culpability expressed by ἔνοχος ἔσται. ‘प्रभु की देह और लहू के प्रति दोषी’ is understandable, but ‘के प्रति’ can imply wrongdoing directed toward someone and is less precise for the broad genitive relation after ἔνοχος. ‘के संबंध में दोषी’ better retains the source’s deliberately non-specific liability relation and follows the English audit trail without over-interpreting it.
  naturalness: The wording is clear and suitably solemn. Replacing ‘अयोग्य रीति से’ with ‘अयोग्य ढंग से’ gives slightly more natural modern Hindi while retaining the adverbial focus. Omitting ‘वह’ before ‘रोटी’ is more idiomatic in Hindi and does not lose the definite referent supplied by the context.
  terminology: ‘प्रभु,’ ‘देह,’ and ‘लहू’ are appropriate established biblical terms in a dignified modern-Hindi register. ‘दोषी ठहरेगा’ suitably conveys culpability. The revised relational phrase avoids assigning a more specific legal or theological sense than the Greek supplies.
  issues:
