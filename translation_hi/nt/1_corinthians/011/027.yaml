    issue: ‘प्रभु की देह और लहू के प्रति दोषी’ is an imprecise rendering of the genitive relation with ἔνοχος.
    rationale: In modern Hindi, ‘के प्रति दोषी’ may be heard as guilt directed toward the Lord’s body and blood. ‘प्रभु की देह और लहू के संबंध में दोषी’ more naturally expresses liability concerning them, while preserving the Greek construction’s breadth.
