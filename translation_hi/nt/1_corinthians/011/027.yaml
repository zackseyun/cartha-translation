id: 1CO.11.27
reference: 1 Corinthians 11:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὥστε ὃς ἂν ἐσθίῃ τὸν ⸀ἄρτον ἢ πίνῃ τὸ ποτήριον τοῦ κυρίου ⸀ἀναξίως, ἔνοχος ἔσται τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/027.yaml
  text: Therefore[b][a], whoever eats the bread or drinks the cup of the Lord in an unworthy manner will be guilty concerning the body and blood of the Lord.
translation:
  language: hi
  text: इसलिए, जो कोई अयोग्य ढंग से[a] रोटी खाए या प्रभु का प्याला पिए, वह प्रभु की देह और लहू के संबंध में दोषी ठहरेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अयोग्य ढंग से’ यूनानी में क्रियाविशेषण है। यह बताता है कि कोई किस ढंग से खाता या पीता है; यह उस व्यक्ति को अपने आप में अयोग्य नहीं कहता।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक और पारंपरिक अनुवाद: ‘प्रभु की देह और लहू का दोषी ठहरेगा।’ यूनानी रचना का अर्थ प्रभु की देह और लहू के संबंध में दोषी या उत्तरदायी होना है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: इसलिए
  rationale: यह पिछले विवेचन से निकला निष्कर्ष प्रकट करता है और आधुनिक हिन्दी में तर्क-संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: ὃς ἂν
  choice: जो कोई
  rationale: सापेक्ष सर्वनाम के साथ ἄν का अनिश्चित और सामान्य अर्थ है; ‘जो कोई’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐσθίῃ τὸν ἄρτον
  choice: वह रोटी खाए
  rationale: विधिलिंग सामान्य शर्त का भाग है। निश्चित उपपद पहले से चर्चा में आई रोटी की ओर संकेत करता है, जिसे हिन्दी में ‘वह रोटी’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἢ
  choice: या
  rationale: यूनानी संयोजक स्पष्टतः विकल्पसूचक है; इसलिए इसे ‘और’ में नहीं बदला गया।
- source_word: πίνῃ τὸ ποτήριον τοῦ κυρίου
  choice: प्रभु का प्याला पिए
  rationale: ‘प्याला पीना’ पात्र के द्वारा उसकी सामग्री का संकेत करने वाली स्वाभाविक रूपकात्मक अभिव्यक्ति है और मूल की संक्षिप्तता बनाए रखती है।
- source_word: ἀναξίως
  choice: अयोग्य रीति से
  rationale: यह क्रियाविशेषण खाने और पीने के ढंग का वर्णन करता है, सहभागी के अंतर्निहित मूल्य या योग्यता का नहीं।
- source_word: ἔνοχος ἔσται
  choice: दोषी ठहरेगा
  rationale: यह भविष्य में दोषी या उत्तरदायी माने जाने का गंभीर न्यायिक भाव स्पष्ट करता है।
- source_word: τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου
  choice: प्रभु की देह और लहू के प्रति
  rationale: ἔνοχος के साथ संबंधवाचक रूप उस विषय को बताता है जिसके संबंध में व्यक्ति दोषी है। ‘के प्रति’ हिन्दी में इस उत्तरदायित्व को स्पष्ट करता है, बिना उसकी ठीक कानूनी प्रकृति को आवश्यकता से अधिक निर्धारित किए।
theological_decisions:
- issue: प्रभु-भोज में ἀναξίως का अर्थ
  choice: वचन अयोग्य रीति से खाने या पीने की निंदा करता है।
  alternative: वचन सहभागी को स्वयं एक अयोग्य व्यक्ति घोषित करता है।
  rationale: ἀναξίως क्रियाविशेषण है और ‘खाए’ तथा ‘पिए’ की रीति बताता है; अनुवाद में व्यक्तिगत योग्यता के विषय में बाद की धर्मसैद्धांतिक धारणाएँ नहीं जोड़ी गईं।
- issue: खाने और पीने के बीच ἢ का बल
  choice: चेतावनी दोनों में से किसी भी कार्य को अयोग्य रीति से करने पर लागू होती है।
  alternative: दोनों कार्यों को अनिवार्य संयुक्त जोड़ी मानकर ‘और’ किया जाए।
  rationale: मूल पाठ में विकल्पसूचक ἢ है; इसलिए उसकी वास्तविक असंयोजक शक्ति सुरक्षित रखी गई है।
- issue: देह और लहू के साथ दोष का संबंध
  choice: ‘के प्रति दोषी’ कहकर उत्तरदायित्व का संबंध व्यक्त किया गया है।
  alternative: ‘देह और लहू का दोषी’ अधिक शाब्दिक पारंपरिक रूप है।
  rationale: यूनानी संबंधवाचक रचना दोष या दायित्व का सटीक प्रकार पूरी तरह नहीं खोलती। मुख्य पाठ स्पष्ट हिन्दी देता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गंभीर और गरिमापूर्ण रखी गई है। ‘लहू’ बाइबलीय धार्मिक संदर्भ में व्यापक रूप से समझा जाने वाला शब्द है। वाक्य की शर्तात्मक संरचना और मूल का ‘या’ दोनों सुरक्षित रखे गए हैं।
