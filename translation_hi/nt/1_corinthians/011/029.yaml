  yaml_path: translation/nt/1_corinthians/011/029.yaml
  text: For the one who eats and drinks eats and drinks judgment on himself[b][a], not discerning the body.
translation:
  language: hi
  text: क्योंकि जो खाता और पीता है, वह देह को न पहचानते हुए अपने ही लिए न्याय मोल लेता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में ‘देह’ के स्थान पर ‘प्रभु की देह’ है।
    reason: textual_variant
  - marker: b
    text: या, ‘देह का उचित भेद न करते हुए’। इसका संकेत प्रभु-भोज में प्रभु की देह का महत्व पहचानने, एकत्रित विश्वासियों को मसीह की देह मानने, अथवा दोनों की ओर हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: κρίμα
  choice: न्याय
  rationale: यह शब्द न्यायिक निर्णय को दर्शाता है। संदर्भ में आगे परमेश्वर के अनुशासन की बात है, इसलिए ‘दण्डाज्ञा’ अंतिम विनाश का भाव आवश्यकता से अधिक प्रबल कर देती।
- source_word: ἑαυτῷ
  choice: अपने ऊपर
  rationale: संबंधवाचक रूप बताता है कि खाने-पीने वाला स्वयं इस प्रतिकूल न्याय को अपने ऊपर लाता है।
- source_word: διακρίνων
  choice: पहचानकर
  rationale: यहाँ क्रिया उचित भेद करने, परखने या महत्व समझने का भाव रखती है। ‘पहचानना’ सामान्य हिन्दी में स्वाभाविक है और अर्थ को किसी एक व्याख्या तक सीमित नहीं करता।
- source_word: τὸ σῶμα
  choice: देह
  rationale: मूल पाठ में केवल ‘देह’ है। संक्षिप्त रूप बनाए रखने से मसीह की देह, विश्वासियों की एकत्रित देह, अथवा दोनों से संबंधित संभावित अर्थ खुले रहते हैं।
- source_word: ὁ ... ἐσθίων καὶ πίνων
  choice: जो खाता और पीता है
  rationale: कर्तृवाचक कृदंत का यह सामान्य एकवचन हिन्दी में सहज और मूल संरचना के निकट है।
- source_word: μὴ διακρίνων
  choice: देह को न पहचानकर
  rationale: नकारात्मक कृदंत को हिन्दी के पूर्वकालिक कृदंत से व्यक्त किया गया है; इससे न्याय और देह को न पहचानने के बीच संबंध स्पष्ट रहते हुए यूनानी की कृदंतीय संरचना भी बनी रहती है।
theological_decisions:
- issue: ‘देह’ का अर्थ
  choice: मुख्य पाठ में केवल ‘देह’ रखकर संदर्भ को खुला रखा गया है।
  alternative: ‘प्रभु की देह’ या ‘विश्वासियों की देह’
  rationale: यूनानी पाठ केवल τὸ σῶμα कहता है। प्रसंग में प्रभु-भोज और विश्वासियों के साथ दुर्व्यवहार दोनों उपस्थित हैं, इसलिए अनुवाद को किसी एक अर्थ का निर्णय नहीं करना चाहिए।
- issue: κρίμα का बल
  choice: न्याय
  alternative: दण्डाज्ञा
  rationale: पद 32 में विश्वासियों पर अनुशासन और संसार के साथ दण्डाज्ञा पाने के बीच अंतर किया गया है; अतः यहाँ व्यापक शब्द ‘न्याय’ अधिक उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘खाता और पीता है’ की पुनरावृत्ति मूल की अलंकारिक संरचना को बनाए रखती है।
