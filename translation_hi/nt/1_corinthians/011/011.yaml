  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πλὴν οὔτε ⸂γυνὴ χωρὶς ἀνδρὸς οὔτε ἀνὴρ χωρὶς γυναικὸς⸃ ἐν κυρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/011.yaml
  text: Nevertheless[a], in the Lord woman is not apart from man, nor man apart from woman.
translation:
  language: hi
  text: फिर भी[a], प्रभु में न तो स्त्री पुरुष से अलग है और न पुरुष स्त्री से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पत्नी पति से अलग नहीं है और न पति पत्नी से।” यूनानी शब्दों का अर्थ स्त्री/पुरुष या पत्नी/पति, दोनों हो सकता है। यहाँ व्यापक अर्थ रखा गया है, क्योंकि कथन केवल विवाह तक सीमित न होकर सामान्य जान पड़ता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: फिर भी
  rationale: यह पिछले तर्क के बाद एक संतुलनकारी और सीमित करने वाला मोड़ व्यक्त करता है; आधुनिक हिन्दी में ‘फिर भी’ स्वाभाविक रूप से यह भाव देता है।
- source_word: γυνή
  choice: स्त्री
  rationale: शब्द का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है। यहाँ सृष्टि और उपासना के व्यापक संदर्भ में सामान्य अर्थ ‘स्त्री’ अधिक उपयुक्त है।
- source_word: ἀνήρ
  choice: पुरुष
  rationale: शब्द ‘पुरुष’ या ‘पति’ दोनों अर्थ दे सकता है। γυνή के समानांतर और इस सामान्य कथन में ‘पुरुष’ व्यापक अर्थ को सुरक्षित रखता है।
- source_word: χωρὶς
  choice: से अलग
  rationale: यह पृथकता या स्वतंत्र अस्तित्व का संबंध व्यक्त करता है। ‘से अलग’ मूल की संबंधपरक अस्पष्टता को बिना ‘निर्भर’ जैसे अधिक व्याख्यात्मक शब्द जोड़े बनाए रखता है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह पौलुस का प्रचलित वाक्यांश है, जो प्रभु से संबंध या प्रभु के अधीन जीवन के क्षेत्र को दर्शाता है; ‘प्रभु में’ संक्षिप्त और धर्मशास्त्रीय रूप से खुला रहता है।
- source_word: οὔτε ... οὔτε
  choice: न तो ... और न
  rationale: यह दोनों संतुलित खंडों की सहसंबंधी नकारात्मक संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: γυνή / ἀνήρ का अनुवाद ‘स्त्री/पुरुष’ हो या ‘पत्नी/पति’
  choice: स्त्री/पुरुष
  alternative: पत्नी/पति
  rationale: तात्कालिक संदर्भ सृष्टि और उपासना में स्त्री तथा पुरुष की चर्चा करता है, और यह पद परस्पर संबंध का व्यापक संतुलनकारी कथन प्रतीत होता है। फिर भी यूनानी शब्दों की वैवाहिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: χωρὶς को निर्भरता की भाषा में स्पष्ट किया जाए या पृथकता की भाषा में रखा जाए
  choice: से अलग
  alternative: के बिना / से स्वतंत्र
  rationale: ‘से अलग’ मूल अभिव्यक्ति की व्यापकता बनाए रखता है और यह तय नहीं करता कि पौलुस केवल अस्तित्व, संबंध या स्वतंत्रता में से किस पहलू पर बल दे रहे हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर वाक्य-विन्यास मूल के संतुलन को व्यक्त करता है, जबकि पादटिप्पणी वास्तविक शब्दार्थगत अस्पष्टता सुरक्षित रखती है।
