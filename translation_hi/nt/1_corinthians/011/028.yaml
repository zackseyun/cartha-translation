source:
  edition: SBLGNT
  text: δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/028.yaml
  text: But let a man examine himself, and in this way let him eat from the bread and drink from the cup.
translation:
  language: hi
  text: पर हर व्यक्ति अपने आप को परखे, और इस प्रकार उस रोटी में से खाए और उस प्याले में से पीए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκιμαζέτω
  choice: परखे
  rationale: यह क्रिया जाँचकर सही ठहराने या उपयुक्तता परखने का भाव रखती है; प्रसंग में आत्म-परीक्षण के लिए ‘परखे’ स्वाभाविक और सटीक है।
- source_word: ἄνθρωπος
  choice: हर व्यक्ति
  rationale: यहाँ ἄνθρωπος सामान्य मानव-संदर्भ में है, किसी विशेष पुरुष के लिए नहीं। एकवचन आज्ञार्थक भाव को स्वाभाविक हिन्दी में ‘हर व्यक्ति’ व्यक्त करता है।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: आत्म-परीक्षण के बाद और उसी के अनुरूप खाने-पीने का संबंध बनाए रखता है।
- source_word: ἐκ τοῦ ἄρτου / ἐκ τοῦ ποτηρίου
  choice: उस रोटी में से / उस प्याले में से
  rationale: ἐκ के ‘में से’ भाव और निश्चित उपपदों को सुरक्षित रखते हुए मूल वाक्य की संरचना के निकट रहता है।
theological_decisions:
- issue: आत्म-परीक्षण और सहभागिता का संबंध
  choice: ‘और इस प्रकार ... खाए ... पीए’
  alternative: ‘तभी ... खाए ... पीए’
  rationale: οὕτως का अर्थ ‘इस प्रकार’ है; ‘तभी’ अनावश्यक रूप से कठोर शर्त जोड़ सकता है। पाठ आत्म-परीक्षण के बाद उचित रीति से सहभागिता की आज्ञा देता है, उससे दूर रहने की नहीं।
- issue: ἄνθρωπος का लिंग-संदर्भ
  choice: ‘हर व्यक्ति’
  alternative: ‘मनुष्य’ या ‘पुरुष’
  rationale: मूल शब्द इस प्रसंग में स्त्री-पुरुष सभी सहभागियों को समेटता है। ‘हर व्यक्ति’ आधुनिक हिन्दी में यह सार्वभौमिकता स्पष्ट करता है, जबकि ‘पुरुष’ अर्थ को अनावश्यक रूप से सीमित कर सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य हिन्दी। ‘अपने आप को परखे’ सामान्य पाठक के लिए स्पष्ट है और मूल के आज्ञार्थक, आत्म-परीक्षणात्मक स्वर को बनाए रखता है।
