base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/032.yaml
  text: But when we are judged by the Lord[a], we are disciplined, so that we may not be condemned along with the world.
translation:
  language: hi
  text: परन्तु जब प्रभु हमारा न्याय करते हैं[a], तब हमें अनुशासित किया जाता है, ताकि संसार के साथ हमें दोषी न ठहराया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु द्वारा हमारा न्याय किया जा रहा है, और हमें अनुशासित किया जा रहा है।” यूनानी में वर्तमानकालिक रूप हैं, जो जारी रहने वाली क्रिया पर बल दे सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρινόμενοι
  choice: जब ... हमारा न्याय करते हैं
  rationale: वर्तमानकालिक कर्मवाच्य कृदन्त को प्रसंगानुसार कालवाचक रूप में व्यक्त किया गया है। ‘न्याय’ न्यायिक अर्थ बनाए रखता है, जबकि अगले पदबंध से उसका सुधारात्मक उद्देश्य स्पष्ट होता है। हिन्दी में स्वाभाविकता के लिए कर्मवाच्य यूनानी रूप को कर्तृवाच्य बनाया गया है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले वचन में बताए गए न्याय के परिणाम के साथ हल्का विरोध दर्शाता है।
- source_word: ὑπὸ κυρίου
  choice: प्रभु ... करते हैं
  rationale: ὑπό के साथ सम्बन्धकारक कर्ता को सूचित करता है। ‘प्रभु’ मूल की संक्षिप्त उपाधि को बिना ‘यीशु’ जोड़कर सुरक्षित रखता है।
- source_word: παιδευόμεθα
  choice: हमें अनुशासित किया जाता है
  rationale: यहाँ शब्द दण्ड मात्र नहीं, बल्कि सुधार के उद्देश्य से दिए जाने वाले प्रशिक्षण और ताड़ना का भाव रखता है; ‘अनुशासित’ इस सुधारात्मक बल को आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἵνα μὴ
  choice: ताकि ... न
  rationale: यह उद्देश्य अथवा अभिप्रेत परिणाम को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: σὺν τῷ κόσμῳ
  choice: संसार के साथ
  rationale: यह समान परिणाम में सहभागी होने का भाव सुरक्षित रखता है। ‘संसार’ यहाँ परमेश्वर-विरोधी मानव-जगत को सामूहिक रूप में दर्शाता है।
- source_word: κατακριθῶμεν
  choice: हमें दोषी न ठहराया जाए
  rationale: यह प्रतिकूल और निर्णायक न्याय को व्यक्त करता है तथा पहले आए κρίνω (‘न्याय’) से भेद बनाए रखता है।
theological_decisions:
- issue: प्रभु के वर्तमान न्याय और संसार के साथ दोषी ठहराए जाने का सम्बन्ध
  choice: अनुवाद प्रभु के सुधारात्मक अनुशासन और संसार के साथ होने वाले प्रतिकूल न्याय में भेद रखता है।
  alternative: इसे केवल इस जीवन में मिलने वाले दण्ड का सामान्य कथन समझा जा सकता है, बिना विश्वासियों और संसार के अंतिम परिणाम का स्पष्ट भेद निकाले।
  rationale: κρινόμενοι और κατακριθῶμεν का शब्दगत भेद, παιδευόμεθα का सुधारात्मक भाव, और ἵνα μὴ का उद्देश्यसूचक वाक्य इस भेद का संकेत देते हैं। अनुवाद इससे आगे बढ़कर उद्धार, धीरज या प्रभुभोज के प्रभाव की कोई सम्प्रदायगत व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ताड़ना’ की अपेक्षा ‘अनुशासित’ चुना गया है, क्योंकि वह कम पुरातन है और सुधारात्मक आशय को स्पष्ट रखता है।
