  yaml_path: translation/nt/1_corinthians/011/008.yaml
  text: For man is not from woman[a], but woman from man.
translation:
  language: hi
  text: क्योंकि पुरुष स्त्री से नहीं हुआ,[a] बल्कि स्त्री पुरुष से हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि पति पत्नी से नहीं हुआ, बल्कि पत्नी पति से हुई।” यूनानी शब्दों का अर्थ “पुरुष/स्त्री” या “पति/पत्नी” दोनों हो सकता है; यहाँ व्यापक सृष्टिगत अर्थ को मुख्य पाठ में रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ तर्क-संबंध को स्वाभाविक और स्पष्ट बनाता है।
- source_word: ἀνὴρ / ἀνδρός
  choice: पुरुष
  rationale: सृष्टि-वृत्तांत की ओर संकेत करने वाले इस प्रसंग में शब्द का व्यापक अर्थ ‘पुरुष’ उपयुक्त है, न कि केवल ‘पति’।
- source_word: γυναικός / γυνὴ
  choice: स्त्री
  rationale: यहाँ सृष्टिगत उद्गम की बात है, इसलिए व्यापक अर्थ ‘स्त्री’ चुना गया है; ‘पत्नी’ अर्थ भी भाषाई रूप से संभव है।
- source_word: ἐκ / ἐξ
  choice: से
  rationale: यह उद्गम या स्रोत बताता है; आधुनिक हिन्दी में ‘से’ संक्षिप्त और स्वाभाविक है।
- source_word: οὐ ... ἀλλὰ
  choice: नहीं ... बल्कि
  rationale: यह यूनानी पाठ के स्पष्ट विरोध को हिन्दी में स्वाभाविक ढंग से बनाए रखता है।
- source_word: ἐστιν
  choice: हुआ / हुई
  rationale: मूल क्रिया सामान्यतः ‘है’ है, पर ἐκ के साथ यहाँ उद्गम का भाव है; ‘से हुआ/हुई’ हिन्दी में वही आशय स्पष्ट और सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: ἀνήρ/γυνή का अनुवाद ‘पुरुष/स्त्री’ हो या ‘पति/पत्नी’
  choice: पुरुष/स्त्री
  alternative: पति/पत्नी
  rationale: पौलुस का तर्क सृष्टि में उद्गम पर आधारित है, इसलिए व्यापक सृष्टिगत अर्थ मुख्य पाठ में रखा गया है। फिर भी यूनानी शब्द वैवाहिक अर्थ भी ले सकते हैं, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, तर्कपूर्ण और गरिमापूर्ण शैली। ‘नहीं ... बल्कि’ मूल के विरोध को बनाए रखता है, और लिंगानुसार ‘हुआ/हुई’ स्वाभाविक हिन्दी देता है।
