lexical_decisions:
- source_word: εἰ δὲ
  choice: परन्तु यदि
  rationale: εἰ शर्त प्रकट करता है और δέ पिछले कथन से हल्का विरोध या संक्रमण; ‘परन्तु यदि’ दोनों भाव स्वाभाविक हिन्दी में रखता है।
- source_word: ἑαυτοὺς
  choice: अपने आपको
  rationale: यह क्रिया का कर्म बना आत्मवाचक सर्वनाम है; ‘अपने आपको’ आधुनिक मानक हिन्दी में स्वाभाविक है।
- source_word: διεκρίνομεν (διακρίνω)
  choice: जाँचते
  rationale: सन्दर्भ में इसका अर्थ अपने आचरण और दशा का विवेकपूर्ण मूल्यांकन करना है। ‘जाँचते’ सहज हिन्दी है; पद के दूसरे खण्ड में प्रयुक्त κρίνω के साथ ध्वनित न्याय-संबंध को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: οὐκ ἂν
  choice: न ... जाता
  rationale: ἄν सहित अपूर्णकालिक क्रिया अवास्तविक शर्त का परिणाम व्यक्त करती है; हिन्दी में ‘तो ... न किया जाता’ उसका स्वाभाविक रूप है।
- source_word: ἐκρινόμεθα (κρίνω)
  choice: हमारा न्याय न किया जाता
  rationale: निष्क्रिय क्रिया यहाँ न्याय के अधीन होने को बताती है। ‘न्याय’ अगले पद के अनुशासनात्मक प्रसंग को पहले से ‘दण्डित’ या ‘दोषी ठहराया’ कहकर सीमित नहीं करता।
theological_decisions:
- issue: क्या दूसरे खण्ड का न्याय अन्तिम दण्डाज्ञा है या प्रभु का वर्तमान अनुशासनात्मक न्याय
  choice: इसे सामान्य रूप में ‘हमारा न्याय न किया जाता’ रखा गया है
  alternative: ‘हम दोषी न ठहराए जाते’ अथवा ‘हम दण्डित न किए जाते’
  rationale: पद 32 प्रभु के न्याय और संसार के साथ दोषी ठहराए जाने में भेद करता है। इसलिए यहाँ अधिक प्रबल अन्तिम-दण्ड का अर्थ आरोपित नहीं किया गया।
- issue: διακρίνω और κρίνω के बीच शब्द-संबंध
  choice: मुख्य पाठ में स्वाभाविक ‘जाँचते’ और ‘न्याय’ रखा गया, तथा वैकल्पिक ‘अपना न्याय करते’ को पाद-टिप्पणी में दिया गया
  alternative: दोनों खण्डों में ‘न्याय’ रखकर शब्दालंकार को पूर्णतः प्रत्यक्ष करना
  rationale: यूनानी में संबंधित शब्दों का जानबूझकर विरोध है, पर हिन्दी में ‘अपने आपको न्याय करना’ कम स्वाभाविक है। पाद-टिप्पणी अर्थ और शब्द-संबंध दोनों सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परन्तु’ हल्के विरोध को और शर्तात्मक वाक्य-विन्यास मूल यूनानी की अवास्तविक स्थिति को व्यक्त करता है।
