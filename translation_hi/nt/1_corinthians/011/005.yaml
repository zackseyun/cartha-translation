language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ καταισχύνει τὴν κεφαλὴν ⸀αὐτῆς, ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/005.yaml
  text: But every woman who prays or prophesies with her head uncovered dishonors her head[b][a], for that is one and the same as having been shaved.
translation:
  language: hi
  text: परन्तु हर स्त्री जो सिर ढके बिना[b] प्रार्थना या भविष्यवाणी करती है, अपने सिर[a] का अनादर करती है, क्योंकि यह सिर मुँडाए होने के समान ही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर पत्नी जो प्रार्थना या भविष्यवाणी करती है ... अपने पति या अपने सिर का अनादर करती है।” यूनानी शब्द का अर्थ “स्त्री” या “पत्नी” हो सकता है; इसी प्रकार यहाँ “सिर” का अर्थ शारीरिक सिर या सन्दर्भ के अनुसार रूपकात्मक सिर हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “सिर ढके बिना” से आवरण का ठीक प्रकार अपने आप निश्चित नहीं होता; यह विशेष रूप से घूँघट या ओढ़नी है अथवा सामान्यतः सिर ढकना—इस विषय में अलग-अलग मत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: स्त्री
  rationale: यह शब्द ‘स्त्री’ या ‘पत्नी’ दोनों अर्थ दे सकता है। यहाँ ‘हर वह स्त्री, जो…’ तात्कालिक वाक्य-संरचना का स्वाभाविक सामान्य अर्थ है; ‘पत्नी’ की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: προσευχομένη ἢ προφητεύουσα
  choice: जो ... प्रार्थना या भविष्यवाणी करती है
  rationale: वर्तमान कृदन्त इन कार्यों में लगी स्त्री का वर्णन करते हैं। हिन्दी में सम्बन्धवाचक उपवाक्य स्वाभाविक है और दोनों क्रियाओं को स्पष्ट रखता है।
- source_word: ἀκατακαλύπτῳ τῇ κεφαλῇ
  choice: सिर बिना ढके
  rationale: यह पद सिर के न ढके होने की अवस्था बताता है, पर आवरण का ठीक प्रकार निर्धारित नहीं करता। हिन्दी अभिव्यक्ति इस अस्पष्टता को बनाए रखती है।
- source_word: καταισχύνει
  choice: अनादर करती है
  rationale: क्रिया लज्जित या अपमानित करने का भाव रखती है। ‘अनादर करती है’ सामाजिक मान-अपमान के सन्दर्भ में स्वाभाविक है और ‘सिर’ के सम्भावित रूपक अर्थ के साथ भी काम करता है।
- source_word: τὴν κεφαλὴν αὐτῆς
  choice: अपने सिर का
  rationale: मूलतः ‘उसका सिर’ है। ‘अपने सिर’ हिन्दी में कर्ता की ओर स्पष्ट संकेत करता है, जबकि पादटिप्पणी यह सम्भावना सुरक्षित रखती है कि सन्दर्भ में ‘सिर’ रूपकतः पति या पुरुष को सूचित करे।
- source_word: ἓν γάρ ἐστιν καὶ τὸ αὐτό
  choice: क्योंकि ऐसा करना ... के समान ही है
  rationale: यूनानी मुहावरा प्रबल समानता व्यक्त करता है। यह हिन्दी रूप उस बल को सहज ढंग से संप्रेषित करता है।
- source_word: τῇ ἐξυρημένῃ
  choice: सिर मुँडवा लेने
  rationale: पूर्ण कृदन्त मुँडे होने की परिणामी अवस्था दिखाता है। ‘सिर मुँडवा लेने’ हिन्दी में उस पूर्ण क्रिया और उसके परिणाम को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘अपने सिर का अनादर करती है’ में κεφαλή का अर्थ
  choice: मुख्य पाठ में ‘अपने सिर’ रखकर शारीरिक और रूपकात्मक सम्भावनाओं को निर्णायक रूप से न सुलझाना
  alternative: शारीरिक सिर; अथवा रूपकात्मक सिर, अर्थात् सन्दर्भ में उसका पति/पुरुष
  rationale: यूनानी वाक्यांश शाब्दिक अर्थ की अनुमति देता है, जबकि निकटवर्ती सन्दर्भ रूपकात्मक अर्थ की सम्भावना उठाता है। पादटिप्पणी इस व्याख्यात्मक तनाव को स्पष्ट करती है।
- issue: ἀκατακαλύπτῳ में आवरण का स्वरूप
  choice: सामान्य रूप से ‘सिर बिना ढके’
  alternative: घूँघट/ओढ़नी के बिना; अथवा बालों से सम्बन्धित कोई विशेष अवस्था
  rationale: विशेषण केवल ढका न होने की बात कहता है; वह अपने आप किसी निश्चित वस्त्र, घूँघट या केश-विन्यास को निर्दिष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘भविष्यवाणी’ प्रचलित बाइबलीय शब्दावली के कारण रखा गया है। ‘घूँघट’ को मुख्य पाठ में न रखकर मूल की अनिर्दिष्टता सुरक्षित रखी गई है।
