    text: या ‘शिक्षाओं’ अथवा ‘निर्देशों’। यूनानी में ‘परंपराएँ,’ अर्थात् वह जो सौंपा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπαινῶ
  choice: मैं तुम्हारी प्रशंसा करता हूँ
  rationale: क्रिया का सीधा और सकारात्मक अर्थ व्यक्त करता है तथा इस खंड की प्रशंसात्मक भूमिका बनाए रखता है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं
  rationale: यहाँ δέ हल्के प्रसंग-परिवर्तन का सूचक है; हिन्दी में वाक्य के स्वाभाविक प्रवाह द्वारा इसका कार्य पर्याप्त रूप से व्यक्त होता है, जबकि ‘अब’ समय-संबंधी अर्थ का अनावश्यक आभास दे सकता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: पौलुस की प्रशंसा का कारण स्पष्ट रूप से प्रस्तुत करता है।
- source_word: πάντα μου μέμνησθε
  choice: तुम हर बात में मुझे याद रखते हो
  rationale: πάντα की व्यापकता और μέμνησθε में निहित निरन्तर स्मरण—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καθὼς παρέδωκα ὑμῖν
  choice: जिस तरह मैंने उन्हें तुम्हें सौंपा था
  rationale: καθώς की अनुरूपता और παραδίδωμι के हस्तांतरण-संबंधी अर्थ को सुरक्षित रखता है। ‘सौंपा’ शिक्षाओं या प्रथाओं को आगे देने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: τὰς παραδόσεις
  choice: उन परम्पराओं
  rationale: παράδοσις का मूल भाव ‘जो सौंपा गया’ है। ‘परम्पराओं’ इस शब्द-संबंध को बनाए रखता है और इसे केवल सामान्य शिक्षा या निर्देश तक सीमित नहीं करता।
- source_word: κατέχετε
  choice: दृढ़ता से थामे हुए हो
  rationale: सिर्फ सुरक्षित रखने के बजाय सक्रिय रूप से बनाए रखने और उससे जुड़े रहने का भाव व्यक्त करता है।
theological_decisions:
- issue: कलीसियाई संदर्भ में παραδόσεις का अनुवाद
  choice: परम्पराओं
  alternative: शिक्षाओं; निर्देशों
  rationale: पद में पौलुस द्वारा कुरिन्थियों को सौंपी गई सामग्री या प्रथाओं की बात है। ‘परम्पराओं’ मूल के हस्तांतरण-संबंधी अर्थ और उसकी सम्भावित व्यापकता को बनाए रखता है, पर बाद की किसी विशिष्ट साम्प्रदायिक परम्परा को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। बहुवचन ‘तुम’ को सन्दर्भानुसार सामूहिक सम्बोधन माना गया है।
