  text: मैं तुम्हारी प्रशंसा करता हूँ, क्योंकि तुम हर बात में मुझे याद रखते हो और उन परंपराओं को दृढ़ता से बनाए रखते हो, ठीक उसी प्रकार जैसे मैंने उन्हें तुम्हें सौंपा था।[a]
  philosophy: optimal-equivalence
  footnotes:
