source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι· τοῦτο ποιεῖτε, ὁσάκις ⸀ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/025.yaml
  text: In the same way also[a], after supper, he took the cup, saying, “This cup is the new covenant in my blood. Keep doing this, whenever you drink it[b], in remembrance of me.”
translation:
  language: hi
  text: उसी प्रकार, भोजन के बाद, उसने प्याला भी लिया और कहा, “यह प्याला मेरे लहू में नई वाचा है। जब-जब तुम इसे पियो, मेरी याद में यह करते रहो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡσαύτως καὶ τὸ ποτήριον
  choice: उसी प्रकार ... कटोरा भी लिया
  rationale: ὡσαύτως καί रोटी के साथ की गई पिछली क्रिया से समानता और जोड़, दोनों दर्शाता है। यूनानी में क्रिया प्रसंग से निहित है; स्वाभाविक और पूर्ण हिन्दी वाक्य के लिए “लिया” जोड़ा गया है।
- source_word: ποτήριον
  choice: कटोरा
  rationale: यह सामान्य, सुबोध हिन्दी शब्द है और यूनानी के साधारण अर्थ को बिना अनावश्यक धर्मविधिक रंग दिए व्यक्त करता है।
- source_word: μετὰ τὸ δειπνῆσαι
  choice: भोजन के बाद
  rationale: μετά के साथ articular infinitive समय बताता है—भोजन कर लेने के बाद। “भोजन के बाद” आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: ἡ καινὴ διαθήκη
  choice: नई वाचा
  rationale: यहाँ διαθήκη की पृष्ठभूमि परमेश्वर और उसके लोगों के बीच वाचा की है; “वाचा” इस बाइबलीय अर्थ को “वसीयतनामा” से अधिक ठीक व्यक्त करता है।
- source_word: ἐν τῷ ἐμῷ αἵματι
  choice: मेरे लहू में
  rationale: ἐν का निकट, किंतु स्वाभाविक अनुवाद रखा गया है। “के द्वारा” या “से स्थापित” कहने पर संबंध की व्याख्या मूल से अधिक निश्चित हो जाती।
- source_word: τοῦτο ποιεῖτε
  choice: यही करते रहो
  rationale: वर्तमानकालीन आज्ञार्थक और अगले पुनरावृत्तिमूलक उपवाक्य के कारण लगातार या बार-बार किए जाने का भाव उचित है।
- source_word: ὁσάκις ἐὰν πίνητε
  choice: जब-जब तुम इसे पियो
  rationale: यह पदबंध हर पुनरावृत्त अवसर का भाव देता है। “इसे” का कर्म कटोरे से निहित है और हिन्दी में स्पष्टता के लिए व्यक्त किया गया है।
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: मेरी याद में
  rationale: ἀνάμνησις स्मरण अथवा स्मारक रूप से याद करने की क्रिया बताता है। “मेरी याद में” सामान्य आधुनिक हिन्दी में सक्रिय स्मरण का स्वाभाविक रूप है।
theological_decisions:
- issue: διαθήκη का अर्थ
  choice: वाचा
  alternative: वसीयतनामा
  rationale: यिर्मयाह 31 और वाचा के लहू की बाइबलीय पृष्ठभूमि के अनुसार “वाचा” यहाँ प्रमुख अर्थ है।
- issue: कटोरे और नई वाचा का संबंध
  choice: “यह कटोरा ... नई वाचा है” की सीधी पहचान को बनाए रखा
  alternative: “यह कटोरा नई वाचा का प्रतीक है” अथवा “यह कटोरा मेरे लहू से स्थापित नई वाचा है”
  rationale: यूनानी पाठ सीधी विधेयात्मक भाषा का प्रयोग करता है, पर प्रतीकात्मक या संस्कार-संबंधी तात्पर्य को स्पष्ट नहीं करता। अनुवाद उस धार्मिक तनाव को खुला रखता है।
- issue: ἐν τῷ ἐμῷ αἵματι में ἐν का संबंध
  choice: मेरे लहू में
  alternative: मेरे लहू के द्वारा
  rationale: “में” मूल संरचना और उसकी संभावित अर्थ-व्याप्ति को बनाए रखता है; “के द्वारा” साधन अथवा अनुमोदन का अर्थ अधिक स्पष्ट रूप से आरोपित करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “लहू” और “वाचा” बाइबलीय हिन्दी में परिचित तथा प्रसंगानुकूल हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि “वसीयतनामा” आधुनिक हिन्दी में इस प्रसंग का व्यवहार्य मुख्य विकल्प नहीं है और पुनरावृत्ति का भाव मुख्य पाठ में “जब-जब” तथा “करते रहो” से स्पष्ट है।
