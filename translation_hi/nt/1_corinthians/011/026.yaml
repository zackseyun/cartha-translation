source:
  edition: SBLGNT
  text: ὁσάκις γὰρ ⸀ἐὰν ἐσθίητε τὸν ἄρτον τοῦτον καὶ τὸ ⸀ποτήριον πίνητε, τὸν θάνατον τοῦ κυρίου καταγγέλλετε, ἄχρι ⸀οὗ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/026.yaml
  text: For as often as you eat this bread and drink the cup[b][a], you proclaim the Lord’s death until he comes.
translation:
  language: hi
  text: क्योंकि जितनी बार आप यह रोटी खाते हैं और प्याले[a] में से पीते हैं, उतनी बार आप प्रभु की मृत्यु की घोषणा करते हैं—जब तक कि वह न आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में यहाँ ‘प्याला’ है, ‘यह प्याला’ नहीं; फिर भी निकट प्रसंग से यह स्पष्ट है कि किस प्याले की बात है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσάκις ... ἐὰν
  choice: जब-जब
  rationale: यह अनिश्चित रूप से दोहराए जाने वाले अवसर का बोध कराता है—हर बार जब यह कार्य होता है। ‘जब-जब’ आधुनिक हिन्दी में इस पुनरावृत्तिमूलक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले निर्देश का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट रखता है।
- source_word: ἐσθίητε
  choice: खाते
  rationale: ἐὰν के साथ वर्तमान संभावनार्थक रूप अनिश्चित कालवाचक उपवाक्य में सामान्यतः होने वाली क्रिया बताता है; ‘खाते हैं’ हिन्दी में स्वाभाविक है।
- source_word: ἄρτον τοῦτον
  choice: यह रोटी
  rationale: ἄρτος का सामान्य अर्थ ‘रोटी’ है और τοῦτον संकेतवाचक ‘यह’ है।
- source_word: τὸ ποτήριον πίνητε
  choice: उस प्याले में से पीते हैं
  rationale: मूल में ποτήριον के साथ निश्चित उपपद है, संकेतवाचक ‘यह’ नहीं। हिन्दी में सीधे ‘प्याला पीना’ अस्वाभाविक और वस्तुतः भ्रामक हो सकता है, इसलिए पात्र की सामग्री पीने का स्वाभाविक मुहावरा अपनाया गया है; ‘उस’ पहले से पहचाने गए प्याले को दर्शाता है।
- source_word: καταγγέλλετε
  choice: घोषणा करते हैं
  rationale: शब्द सार्वजनिक रूप से सुनाने या घोषित करने का अर्थ देता है; ‘घोषणा’ इसके औपचारिक और प्रकटकारी बल को बनाए रखती है।
- source_word: τὸν θάνατον τοῦ κυρίου
  choice: प्रभु की मृत्यु
  rationale: यह सम्बन्धकारक रचना का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: κυρίου
  choice: प्रभु
  rationale: पौलुस के इस संदर्भ में κύριος के लिए ‘प्रभु’ स्वाभाविक और स्थापित हिन्दी समतुल्य है।
- source_word: ἄχρι οὗ ἔλθῃ
  choice: जब तक कि वह न आए
  rationale: यह घोषणा की समय-सीमा बताता है। हिन्दी में ‘जब तक कि … न आए’ स्वाभाविक है; नकारात्मक रूप यहाँ निषेध नहीं, ‘जब तक’ वाली मानक वाक्य-रचना है।
theological_decisions:
- issue: ἄχρι οὗ ἔλθῃ में निहित कर्ता
  choice: ‘वह’ का संदर्भ प्रभु यीशु है।
  alternative: कर्ता को नाम लेकर ‘प्रभु आए’ कहना।
  rationale: निकटतम और स्वाभाविक पूर्वपद ‘प्रभु’ है। सर्वनाम मूल की निहितता को बनाए रखता है और संदर्भ से अर्थ स्पष्ट रहता है।
- issue: प्रभु-भोज संबंधी भाषा
  choice: रोटी खाने, प्याले में से पीने और प्रभु की मृत्यु की घोषणा करने को सीधे रूप में रखा गया है।
  alternative: इसे किसी विशिष्ट संस्कारवादी या केवल स्मारकवादी व्याख्या के अनुसार विस्तार देना।
  rationale: पद इस कार्य को प्रभु की मृत्यु की घोषणा बताता है, पर प्रभु-भोज का पूरा धर्मवैज्ञानिक स्वरूप परिभाषित नहीं करता; इसलिए अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘जब-जब … तब’ पुनरावृत्ति को सहज बनाता है। ‘उस प्याले में से’ हिन्दी मुहावरे के अनुसार पात्र की सामग्री पीने का अर्थ देता है और साथ ही यूनानी के निश्चित, पर संकेतवाचक न होने वाले रूप को यथासंभव सुरक्षित रखता है।
