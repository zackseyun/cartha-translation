  yaml_path: translation/nt/1_corinthians/011/009.yaml
  text: For indeed[a], man was not created for the woman, but woman for the man.
translation:
  language: hi
  text: क्योंकि वास्तव में पुरुष स्त्री के लिए नहीं रचा गया, बल्कि स्त्री पुरुष के लिए[a] रची गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्त्री के कारण … पुरुष के कारण।” यूनानी पूर्वसर्ग यहाँ कारण या उद्देश्य व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि
  rationale: यह पद पिछले तर्क का कारण स्पष्ट करता है। हिन्दी में ‘क्योंकि’ γάρ के व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है; καί का हल्का बल अलग शब्द जोड़ने के बजाय वाक्य-संबंध में निहित रहता है।
- source_word: ἐκτίσθη
  choice: रचा गया / रची गई
  rationale: κτίζω का सीधा अर्थ ‘रचना’ या ‘सृष्टि करना’ है। यहाँ निष्क्रिय रूप और उत्पत्ति-वृत्तांत की ओर संकेत दोनों सुरक्षित रहते हैं।
- source_word: ἀνὴρ
  choice: पुरुष
  rationale: सृष्टि-वृत्तांत के संदर्भ में यह सामान्य रूप से पुरुष को दर्शाता है, केवल पति को नहीं।
- source_word: γυνὴ
  choice: स्त्री
  rationale: सृष्टि-वृत्तांत के संदर्भ में यह सामान्य रूप से स्त्री को दर्शाता है, केवल पत्नी को नहीं।
- source_word: διὰ τὴν γυναῖκα / διὰ τὸν ἄνδρα
  choice: स्त्री के लिए / पुरुष के लिए
  rationale: διά के साथ कर्मकारक कारण, उद्देश्य अथवा हित का भाव दे सकता है। ‘के लिए’ इस सृष्टि-संबंधी तर्क में उद्देश्य/अभिमुखता को व्यक्त करते हुए मूल की अर्थगत व्यापकता काफी हद तक बनाए रखता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: नकारात्मक पहले खंड के बाद सकारात्मक विपरीत कथन के लिए हिन्दी में ‘बल्कि’ स्वाभाविक और सटीक है।
theological_decisions:
- issue: ἀνήρ/γυνή को ‘पुरुष/स्त्री’ या ‘पति/पत्नी’ के रूप में प्रस्तुत करना
  choice: पुरुष/स्त्री
  alternative: पति/पत्नी
  rationale: ‘रचा गया’ सृष्टि-वृत्तांत की ओर संकेत करता है, इसलिए कथन का दायरा केवल वैवाहिक संबंध तक सीमित करना उचित नहीं।
- issue: διά को कारण या उद्देश्य के रूप में समझना
  choice: के लिए
  alternative: के कारण
  rationale: संदर्भ में सृष्टि की अभिमुखता या उद्देश्य प्रमुख प्रतीत होता है, पर यूनानी पदबंध कारण भी व्यक्त कर सकता है; इस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। समानांतर खंडों तथा पुरुष/स्त्री के सामान्य सृष्टिगत संदर्भ को बनाए रखा गया है।
