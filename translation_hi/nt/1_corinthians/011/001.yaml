source:
  edition: SBLGNT
  text: μιμηταί μου γίνεσθε, καθὼς κἀγὼ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/001.yaml
  text: Become imitators of me[b][a], just as I also am of the Messiah.
translation:
  language: hi
  text: मेरे अनुकरण करनेवाले बनो, जैसे मैं भी मसीह का अनुकरण करता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μιμηταί
  choice: अनुकरण करनेवाले
  rationale: यह यूनानी संज्ञा किसी के उदाहरण और आचरण का अनुकरण करनेवालों को दर्शाती है। ‘अनुकरण करनेवाले’ स्पष्ट और स्वाभाविक हिंदी है तथा ‘पीछे चलनेवाले’ की अपेक्षा मूल के अनुकरण-भाव को अधिक ठीक रखती है।
- source_word: γίνεσθε
  choice: बनो
  rationale: वर्तमान आज्ञार्थक रूप यहाँ किसी नमूने को अपनाने या वैसा बनने का आह्वान करता है; इसलिए केवल ‘हो’ की अपेक्षा ‘बनो’ अधिक उपयुक्त है।
- source_word: καθὼς κἀγὼ
  choice: जैसे मैं भी
  rationale: 'यह पदबंध तुलना के साथ ‘भी’ का योगात्मक बल बनाए रखता है: पौलुस दूसरों से वही करने को कहता है जो वह स्वयं करता है।'
- source_word: Χριστοῦ
  choice: मसीह का
  rationale: Χριστός का स्थापित और अर्थपूर्ण हिंदी रूप ‘मसीह’ है। संबंधकारक रूप को ‘का’ से व्यक्त किया गया है, जो निहित ‘अनुकरण करनेवाला’ के साथ जुड़ता है।
theological_decisions:
- issue: अंतिम खंड में यूनानी लोप की अभिव्यक्ति
  choice: ‘मसीह का अनुकरण करता हूँ’ कहकर निहित विचार को स्पष्ट करना
  alternative: ‘मैं भी मसीह का हूँ’
  rationale: यूनानी में अंतिम खंड शाब्दिक रूप से ‘जैसे मैं भी मसीह का’ है, जिसमें पहले खंड का ‘अनुकरण करनेवाला’ निहित है। हिंदी में केवल ‘मसीह का हूँ’ कहना संबंध या स्वामित्व का अलग अर्थ दे सकता है; निहित क्रिया को दोहराने से तुलना का आशय स्पष्ट होता है, बिना पौलुस के अनुकरण को स्वतंत्र या निरपेक्ष आदर्श बनाने के।
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: ‘मसीह’ आधुनिक मानक हिंदी में Χριστός के पदवीगत अर्थ को स्वाभाविक ढंग से व्यक्त करता है और किसी संप्रदाय-विशेष की व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अनुकरण’ सामान्य पाठक के लिए बोधगम्य है और मूल के स्पष्ट imitation-विचार को सुरक्षित रखता है।
