    reason: 'वैकल्पिक अर्थ: οὐκ ἔστιν ... φαγεῖν की संक्षिप्त यूनानी रचना को उनके व्यवहार के मूल्यांकन के रूप में भी समझा जा सकता है।'
lexical_decisions:
- source_word: συνερχομένων
  choice: जब तुम ... इकट्ठे होते हो
  rationale: ὑμῶν के साथ संबंधवाचक कृदन्त यहाँ कालसूचक है। यह चयन सामूहिक सभा का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले पदों में बताई गई फूट से निकलने वाला निष्कर्ष सूचित करता है; ‘इसलिए’ उस तार्किक संबंध को स्पष्ट रखता है।
- source_word: ἐπὶ τὸ αὐτό
  choice: एक ही स्थान पर
  rationale: मुहावरा एक स्थान अथवा एक सभा में जुटने की स्थानिक छाया रखता है; केवल ‘साथ’ कहने से συνερχομένων का भाव दोहराया जाता।
- source_word: οὐκ ἔστιν ... φαγεῖν
  choice: तो यह ... खाने के लिए नहीं होता
  rationale: 'यह संक्षिप्त यूनानी रचना के अनिश्चित और मूल्यांकनपरक स्वर को बनाए रखता है: उनके आचरण के कारण सभा का उद्देश्य अथवा परिणाम वास्तव में प्रभु-भोज खाना नहीं ठहरता।'
- source_word: κυριακὸν
  choice: प्रभु-
  rationale: विशेषण का अर्थ ‘प्रभु से संबंधित/प्रभु का’ है। स्थापित हिन्दी पद ‘प्रभु-भोज’ इस संबंध को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: δεῖπνον
  choice: भोज
  rationale: यह मुख्य अथवा सामुदायिक भोजन को सूचित करता है। इस प्रसंग में ‘भोज’ साधारण ‘खाना’ से अधिक उपयुक्त और कलीसियाई प्रयोग में सुबोध है।
- source_word: κυριακὸν δεῖπνον
  choice: प्रभु-भोज
  rationale: यह यूनानी विशेषण-संज्ञा पद का सटीक, प्रचलित और संप्रदाय-निरपेक्ष हिन्दी रूप है।
theological_decisions:
- issue: क्या पौलुस प्रभु-भोज खाना असंभव बताता है, या कहता है कि उनका व्यवहार उस भोजन को प्रभु-भोज कहलाने योग्य नहीं रहने देता?
  choice: मुख्य पाठ संक्षिप्त यूनानी रचना को निकटता से रखते हुए सभा को प्रभु-भोज खाने के लिए न होना बताता है।
  alternative: ‘तुम प्रभु-भोज नहीं खा रहे होते,’ अर्थात उनके आचरण के कारण उनका भोजन प्रभु-भोज ठहरता ही नहीं।
  rationale: पद 21–22 में समस्या भोजन की तात्त्विक असंभवता नहीं, बल्कि विभाजनकारी ढंग है। मुख्य पाठ मूल की तनावपूर्ण अभिव्यक्ति बचाता है और पादटिप्पणी अधिक स्पष्ट मूल्यांकनपरक अर्थ देती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। ‘प्रभु-भोज’ स्थापित किन्तु संप्रदाय-विशेष से असंबद्ध पद है।
