id: 1CO.11.12
reference: 1 Corinthians 11:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ γυνὴ ἐκ τοῦ ἀνδρός, οὕτως καὶ ὁ ἀνὴρ διὰ τῆς γυναικός· τὰ δὲ πάντα ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/012.yaml
  text: For just as the woman is from the man[a], so also the man is through the woman; but all things are from God.
translation:
  language: hi
  text: क्योंकि जैसे स्त्री पुरुष से है,[a] वैसे ही पुरुष भी स्त्री के द्वारा है; परन्तु सब कुछ परमेश्वर से है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पत्नी पति से है, वैसे ही पति भी पत्नी के द्वारा है”; यदि इस संदर्भ में स्त्री-पुरुष के संबंध को सामान्य न मानकर विशेष रूप से वैवाहिक माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: क्योंकि जैसे
  rationale: यह अनुवाद γάρ के व्याख्यात्मक संबंध और ὥσπερ की तुलना—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἡ γυνή
  choice: स्त्री
  rationale: γυνή का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है। सृष्टि और जन्म के व्यापक संदर्भ में यहाँ सामान्य अर्थ ‘स्त्री’ अधिक उपयुक्त है।
- source_word: ἐκ τοῦ ἀνδρός
  choice: पुरुष से
  rationale: ἐκ स्रोत या उत्पत्ति बताता है और स्त्री के पुरुष से लिए जाने के सृष्टि-वृत्तांत की ओर संकेत बनाए रखता है।
- source_word: ὁ ἀνήρ
  choice: पुरुष
  rationale: ἀνήρ का अर्थ ‘पुरुष’ या ‘पति’ हो सकता है; γυνή के साथ पारस्परिक और सामान्य कथन में ‘पुरुष’ उपयुक्त है।
- source_word: διὰ τῆς γυναικός
  choice: स्त्री के द्वारा
  rationale: सम्बन्धकारक के साथ διά माध्यम को व्यक्त करता है। ‘स्त्री के द्वारा’ पुरुष के जन्म में स्त्री की भूमिका बताता है और ἐκ तथा διά का अंतर बनाए रखता है।
- source_word: τὰ δὲ πάντα
  choice: परन्तु सब कुछ
  rationale: δέ यहाँ हल्का विरोध और निष्कर्ष की ओर मोड़ व्यक्त करता है; ‘परन्तु’ मनुष्य की पारस्परिक उत्पत्ति से परमेश्वर को अंतिम स्रोत बताने की ओर संक्रमण स्पष्ट करता है।
- source_word: ἐκ τοῦ θεοῦ
  choice: परमेश्वर से
  rationale: ἐκ स्रोत या उत्पत्ति को व्यक्त करता है; ‘परमेश्वर से’ स्वाभाविक हिन्दी में अंतिम स्रोत का कथन सुरक्षित रखता है।
theological_decisions:
- issue: γυνή और ἀνήρ का अर्थ
  choice: सामान्य अर्थ में ‘स्त्री’ और ‘पुरुष’
  alternative: ‘पत्नी’ और ‘पति’
  rationale: पद स्त्री की सृष्टि में उत्पत्ति और पुरुष के सामान्य मानवीय जन्म—दोनों की बात करता है, इसलिए इसका दायरा केवल विवाह तक सीमित नहीं किया गया; वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- issue: स्त्री और पुरुष की उत्पत्ति का संबंध
  choice: ἐκ के लिए ‘से’ और διά के लिए ‘के द्वारा’ का भेद बनाए रखना
  alternative: दोनों को ‘से’ कहना
  rationale: यह भेद सृष्टि में स्त्री के पुरुष से होने और जन्म में पुरुष के स्त्री के माध्यम से होने की पारस्परिकता तथा तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘परन्तु’ पद के निष्कर्षात्मक विरोध को स्पष्ट करता है; ‘के द्वारा’ मूल के पूर्वसर्गीय भेद को सुरक्षित रखता है।
