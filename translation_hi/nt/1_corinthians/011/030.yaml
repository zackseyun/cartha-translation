  text: διὰ τοῦτο ἐν ὑμῖν πολλοὶ ἀσθενεῖς καὶ ἄρρωστοι καὶ κοιμῶνται ἱκανοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/030.yaml
  text: For this reason many among you are weak and sick[a], and a good number have fallen asleep.
translation:
  language: hi
  text: इसी कारण तुम में बहुत-से निर्बल और बीमार हैं, और काफ़ी लोग सो गए हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक स्पष्ट रूप से, ‘मर गए हैं।’ यहाँ ‘सो गए हैं’ सम्भवतः मृत्यु के लिए आरम्भिक मसीही समुदाय में प्रचलित रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पद पिछले संदर्भ में प्रभु-भोज के अनुचित व्यवहार से स्पष्ट कारणात्मक संबंध जोड़ता है; ‘इसी कारण’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν ὑμῖν
  choice: आप लोगों में
  rationale: यह कुरिन्थ की सामुदायिक मंडली के बीच की स्थिति को व्यक्त करता है, न कि व्यक्तियों के भीतर की दशा को।
- source_word: πολλοὶ
  choice: बहुत-से
  rationale: पुल्लिंग बहुवचन विशेषण का संज्ञात्मक प्रयोग है; ‘बहुत-से’ सहज और संक्षिप्त हिन्दी है।
- source_word: ἀσθενεῖς
  choice: निर्बल
  rationale: यह व्यापक शारीरिक दुर्बलता को व्यक्त करता है और अगले अधिक स्पष्ट बीमारी-सूचक शब्द ἄρρωστοι से भेद बनाए रखता है।
- source_word: ἄρρωστοι
  choice: बीमार
  rationale: आधुनिक सामान्य हिन्दी में रोगग्रस्त होने का स्पष्ट और सुलभ शब्द है।
- source_word: κοιμῶνται
  choice: सो गए हैं
  rationale: मूल पाठ में प्रयुक्त नींद के रूपक को सुरक्षित रखता है; संदर्भ में यह मृत्यु की ओर संकेत करता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: ἱκανοί
  choice: काफ़ी लोग
  rationale: यह एक उल्लेखनीय या पर्याप्त बड़ी संख्या दर्शाता है; ‘काफ़ी लोग’ स्वाभाविक हिन्दी है और पहले आए ‘बहुत-से’ की अनावश्यक पुनरावृत्ति से बचता है।
theological_decisions:
- issue: κοιμῶνται को वास्तविक नींद माना जाए या मृत्यु का रूपक
  choice: मुख्य पाठ में मृत्यु के रूपक को ‘सो गए हैं’ के रूप में सुरक्षित रखा गया
  alternative: ‘मर गए हैं’ कहकर अर्थ को प्रत्यक्ष करना, या इसे वास्तविक नींद समझना
  rationale: दुर्बलता, बीमारी और फिर सो जाने का क्रम तथा ईश्वरीय न्याय का निकट संदर्भ मृत्यु की ओर संकेत करता है; फिर भी पौलुस का अपना रूपक मुख्य पाठ में बनाए रखना अर्थ और धर्मवैज्ञानिक तनाव दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठकों के लिए सहज, पर गरिमापूर्ण। ‘निर्बल’ और ‘बीमार’ से यूनानी के दो अलग शब्दों का भेद रखा गया है। पादटिप्पणी-चिह्न उसी वाक्यांश के बाद रखा गया है जिसकी व्याख्या की गई है।
