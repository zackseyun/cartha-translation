id: 1CO.11.3
reference: 1 Corinthians 11:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: θέλω δὲ ὑμᾶς εἰδέναι ὅτι παντὸς ἀνδρὸς ἡ κεφαλὴ ὁ Χριστός ἐστιν, κεφαλὴ δὲ γυναικὸς ὁ ἀνήρ, κεφαλὴ δὲ ⸀τοῦ Χριστοῦ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/003.yaml
  text: But I want you to know that the head of every man is Messiah[a], and the head of a woman is the man[b], and the head of Messiah is God.
translation:
  language: hi
  text: पर मैं चाहता हूँ कि तुम यह जानो कि हर पुरुष का सिर[a] मसीह है, स्त्री का सिर पुरुष है[b], और मसीह का सिर परमेश्वर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘सिर’ का अर्थ ‘स्रोत’ या ‘अधिकार रखने वाला’ भी समझा जा सकता है; मुख्य पाठ में यूनानी रूपक को ज्यों का त्यों रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘स्त्री’ और ‘पुरुष’ का अर्थ क्रमशः ‘पत्नी’ और ‘पति’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: θέλω
  choice: मैं चाहता हूँ
  rationale: यह पौलुस की वर्तमान और व्यक्तिगत इच्छा को स्वाभाविक आधुनिक हिन्दी में सीधे व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले विचार से हल्के संक्रमण या विरोध को संक्षेप और स्वाभाविक ढंग से दर्शाता है।
- source_word: ὑμᾶς εἰδέναι
  choice: तुम यह जानो
  rationale: यूनानी infinitival रचना का सीधा और सहज हिन्दी रूप है; इसका सूचनात्मक बल बना रहता है।
- source_word: παντὸς ἀνδρὸς
  choice: हर पुरुष का
  rationale: ἀνήρ का अर्थ पुरुष या पति हो सकता है; इस पहले व्यापक कथन में ‘हर पुरुष’ अधिक स्वाभाविक है।
- source_word: κεφαλή
  choice: सिर
  rationale: मूल यूनानी रूपक को बनाए रखा गया है, क्योंकि यहाँ इसका आशय ‘स्रोत’ या ‘अधिकार रखने वाला’ मानना व्याख्यात्मक विवाद को अनुवाद में ही तय कर देगा।
- source_word: ὁ Χριστός / τοῦ Χριστοῦ
  choice: मसीह
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; ‘मसीह’ हिन्दी में उसका स्थापित और अर्थपूर्ण रूप है।
- source_word: γυναικός
  choice: स्त्री का
  rationale: γυνή का अर्थ स्त्री या पत्नी हो सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और वैवाहिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ὁ ἀνήρ
  choice: पुरुष
  rationale: यहाँ ἀνήρ का अर्थ पुरुष या पति दोनों संभव हैं। समानान्तर वाक्यरचना के अनुरूप मुख्य पाठ में ‘पुरुष’ रखकर अस्पष्टता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: θεός का मानक, गरिमापूर्ण और सर्वसुलभ हिन्दी अनुवाद है।
theological_decisions:
- issue: तीनों समानान्तर कथनों में κεφαλή का अर्थ
  choice: मुख्य पाठ में ‘सिर’ रूपक को बनाए रखना
  alternative: ‘स्रोत’ अथवा ‘अधिकार रखने वाला’
  rationale: यूनानी पाठ स्वयं रूपक का प्रयोग करता है और उसका सटीक सम्बन्ध विवादित है; अनुवाद को इस धर्मवैज्ञानिक तनाव का एकतरफा समाधान नहीं करना चाहिए।
- issue: ἀνήρ और γυνή को पुरुष/स्त्री या पति/पत्नी समझना
  choice: मुख्य पाठ में ‘पुरुष’ और ‘स्त्री’
  alternative: ‘पति’ और ‘पत्नी’
  rationale: पद की व्यापक समानान्तर रचना सामान्य पुरुष-स्त्री अर्थ का समर्थन करती है, पर आसपास के वैवाहिक और सामुदायिक सन्दर्भ के कारण पति-पत्नी अर्थ भी वास्तविक सम्भावना है।
- issue: अन्तिम कथन में परमेश्वर और मसीह का सम्बन्ध
  choice: ‘मसीह का सिर परमेश्वर है’ के रूप में बिना विस्तार के अनुवाद
  alternative: ऐसी व्याख्यात्मक पुनर्रचना जो इसे केवल कार्यगत क्रम या तत्त्वगत अधीनता बताए
  rationale: मूल कथन को न तो कमजोर किया गया है, न किसी धर्मसैद्धान्तिक व्याख्या से बढ़ाया गया है; इस प्रकार पाठ की अपनी भाषा और तनाव सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘तुम’ बहुवचन समुदाय को सम्बोधित करता है। समानान्तर वाक्यरचना मूल पद की लय और तर्क को सुरक्षित रखती है।
