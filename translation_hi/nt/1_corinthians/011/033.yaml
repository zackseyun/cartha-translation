  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, συνερχόμενοι εἰς τὸ φαγεῖν ἀλλήλους ἐκδέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/033.yaml
  text: So then[a], my brothers, when you come together to eat, wait for one another.
translation:
  language: hi
  text: इसलिए, मेरे भाइयो,[a] जब तुम खाने के लिए इकट्ठे होते हो, तो एक-दूसरे की प्रतीक्षा करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “मेरे भाइयो और बहनो”; यूनानी में “भाइयो” है, और यह पुल्लिंग रूप प्रायः स्त्री-पुरुष दोनों वाली मण्डली को सम्बोधित करने के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: इसलिए
  rationale: यह निष्कर्षसूचक संयोजक है, जो प्रभु-भोज में हुई अव्यवस्था पर पिछली बातों से व्यावहारिक निष्कर्ष निकालता है।
- source_word: ἀδελφοί μου
  choice: मेरे भाइयो
  rationale: सम्बोधन बहुवचन का स्वाभाविक और स्रोत के व्याकरणिक पुल्लिंग को बनाए रखने वाला हिन्दी रूप; मण्डली की स्त्रियाँ भी इसके आशय में सम्मिलित हो सकती हैं, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: συνερχόμενοι
  choice: जब तुम ... इकट्ठे होते हो
  rationale: वर्तमान कृदन्त आज्ञा की परिस्थिति बताता है; यह हिन्दी में सामुदायिक सभा के प्रसंग को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς τὸ φαγεῖν
  choice: खाने के लिए
  rationale: εἰς के साथ articular infinitive प्रयोजन व्यक्त करता है; यह रूप भोजन का प्रकार अनावश्यक रूप से निश्चित किए बिना अर्थ सुरक्षित रखता है।
- source_word: ἀλλήλους
  choice: एक-दूसरे की
  rationale: पारस्परिक सर्वनाम का स्वाभाविक हिन्दी रूप, जो ἐκδέχεσθε के साथ सम्बन्धकारक संरचना में आता है।
- source_word: ἐκδέχεσθε
  choice: प्रतीक्षा करो
  rationale: यद्यपि क्रिया का अर्थ ग्रहण करना या स्वागत करना भी हो सकता है, पद 21 के संदर्भ में दूसरों के आने अथवा साथ भोजन आरम्भ करने तक प्रतीक्षा करना सबसे सम्भावित व्यावहारिक निर्देश है।
theological_decisions:
- issue: ἀδελφοί में प्रतिनिधिक पुल्लिंग सम्बोधन
  choice: मुख्य पाठ में “भाइयो” रखा और समावेशी आशय पादटिप्पणी में बताया।
  alternative: “भाइयो और बहनो”
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग है, पर मिश्रित मण्डली को सम्बोधित कर सकता है। मुख्य पाठ स्रोत-रूप को बनाए रखता है और पादटिप्पणी उसके सम्भावित व्यापक आशय को स्पष्ट करती है।
- issue: ἐκδέχεσθε का प्रसंगानुसार अर्थ
  choice: “प्रतीक्षा करो”
  alternative: “स्वागत करो” या “ग्रहण करो”
  rationale: निकटवर्ती संदर्भ में कुछ लोग दूसरों से पहले अपना भोजन कर रहे थे; इसलिए यहाँ साथियों की प्रतीक्षा करने का निर्देश अधिक सम्भावित है, यद्यपि क्रिया का व्यापक ग्रहण-संबंधी अर्थ पूर्णतः असम्भव नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामुदायिक उपासना के प्रसंग के अनुकूल भाषा। “प्रतीक्षा करो” सामान्य पाठक के लिए स्पष्ट है; “एक-दूसरे” पारस्परिक उत्तरदायित्व को स्वाभाविक रूप से व्यक्त करता है।
