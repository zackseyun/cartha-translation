  text: πᾶς ἀνὴρ προσευχόμενος ἢ προφητεύων κατὰ κεφαλῆς ἔχων καταισχύνει τὴν κεφαλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/004.yaml
  text: Every man who prays or prophesies with something on his head dishonors his head[a][b].
translation:
  language: hi
  text: हर वह पुरुष, जो सिर पर कुछ रखे हुए प्रार्थना या भविष्यवाणी करता है, अपने सिर का अपमान करता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, परंपरागत रूप से, “सिर ढककर।” यूनानी में शाब्दिक भाव “सिर पर या सिर से नीचे की ओर कुछ लिए हुए” है; किस प्रकार का आवरण था, यह स्पष्ट नहीं किया गया है।
    reason: lexical_alternative
  - marker: b
    text: “अपने सिर” का संकेत शाब्दिक रूप से उसके अपने सिर की ओर हो सकता है; साथ ही, आसपास के संदर्भ में “सिर” के संबंधपरक अर्थ की प्रतिध्वनि भी हो सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ἀνὴρ
  choice: हर वह पुरुष
  rationale: ἀνήρ का अर्थ संदर्भानुसार ‘पुरुष’ या ‘पति’ हो सकता है। पद 5 में ‘स्त्री’ के समानांतर यहाँ सामान्य पुरुष-संदर्भ सबसे कम व्याख्यात्मक है; ‘हर वह पुरुष’ हिन्दी में वाक्य को स्वाभाविक रूप देता है।
- source_word: προσευχόμενος ἢ προφητεύων
  choice: प्रार्थना या भविष्यवाणी करता है
  rationale: दोनों वर्तमान कृदंत प्रार्थना करने और भविष्यवाणी करने की क्रियाओं को साथ रखते हैं। हिन्दी में संयुक्त संबंधवाचक संरचना स्वाभाविक है और स्रोत का अर्थ बनाए रखती है।
- source_word: κατὰ κεφαλῆς ἔχων
  choice: सिर पर कुछ रखकर
  rationale: यूनानी अभिव्यक्ति शाब्दिक रूप से सिर पर अथवा सिर से नीचे लटकती किसी वस्तु के होने की ओर संकेत करती है, पर वस्तु का नाम नहीं बताती। यह अनुवाद बिना किसी खास प्रकार के आवरण को निर्धारित किए उस अस्पष्टता को बचाता है।
- source_word: καταισχύνει
  choice: अपमान करता है
  rationale: क्रिया लज्जित करने, बदनाम करने या अनादर पहुँचाने का भाव रखती है। ‘अपमान करता है’ आधुनिक हिन्दी में सम्मान–अपमान के प्रसंग को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: अपने सिर
  rationale: यह पदबंध पुरुष के वास्तविक सिर को सूचित कर सकता है और आसपास के संदर्भ में ‘सिर’ के संबंधपरक अर्थ की प्रतिध्वनि भी दे सकता है। सरल ‘अपने सिर’ इस द्व्यर्थता को अनावश्यक रूप से हल नहीं करता।
theological_decisions:
- issue: अंतिम खंड में κεφαλή को शारीरिक सिर माना जाए या संबंधपरक रूप से ‘सिर’
  choice: ‘अपने सिर’ कहकर द्व्यर्थता बनाए रखना
  alternative: ‘अपने शारीरिक सिर’ या ‘जो उसका सिर है’
  rationale: पौलुस की भाषा वास्तविक सिर और पद 3 के संबंधपरक ‘सिर’ के बीच अलंकारिक प्रतिध्वनि की अनुमति देती है। मुख्य पाठ में किसी एक अर्थ को निश्चित कर देना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘पुरुष’, ‘प्रार्थना’, ‘भविष्यवाणी’ और ‘अपमान’ जैसे व्यापक रूप से समझे जाने वाले शब्द चुने गए हैं। मुख्य पाठ में यूनानी की अस्पष्टताओं को बनाए रखा गया है और आवश्यक विकल्प पादटिप्पणियों में दिए गए हैं।
