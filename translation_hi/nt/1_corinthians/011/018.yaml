  text: πρῶτον μὲν γὰρ συνερχομένων ὑμῶν ἐν ἐκκλησίᾳ ἀκούω σχίσματα ἐν ὑμῖν ὑπάρχειν, καὶ μέρος τι πιστεύω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/011/018.yaml
  text: For[a], in the first place, when you come together in assembly, I hear that divisions exist among you, and in part I believe it.
translation:
  language: hi
  text: क्योंकि, सबसे पहले, जब तुम कलीसिया के रूप में[a] इकट्ठे होते हो, तो मैं सुनता हूँ कि तुम्हारे बीच विभाजन हैं, और कुछ हद तक मैं इस बात पर विश्वास भी करता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सभा में” अथवा “कलीसिया में”; यूनानी पद किसी विशेष भवन की ओर नहीं, बल्कि एकत्रित मंडली की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρῶτον μὲν
  choice: पहली बात तो यह है
  rationale: यह यूनानी मुहावरा तर्क के पहले बिंदु को प्रस्तुत करता है। हिंदी में यह स्वाभाविक है और μέν के हल्के बल को ‘तो’ से बनाए रखता है, भले ही आगे औपचारिक μέν...δέ युग्म पूरा न हो।
- source_word: συνερχομένων ὑμῶν
  choice: जब तुम ... इकट्ठे होते हो
  rationale: संबंधवाचक स्वतंत्र षष्ठी-रचना यहाँ समय बताती है; यह अनुवाद सामुदायिक एकत्र होने की क्रिया को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἐν ἐκκλησίᾳ
  choice: कलीसिया के रूप में
  rationale: संदर्भ किसी भवन का नहीं, इकट्ठी हुई विश्वासियों की मंडली का है। ‘के रूप में’ सामूहिक पहचान को व्यक्त करता है, जबकि पादटिप्पणी वास्तविक शाब्दिक विकल्प बताती है।
- source_word: ἀκούω
  choice: मैं सुनता हूँ
  rationale: वर्तमान काल और सूचना मिलने के भाव को सीधे बनाए रखता है।
- source_word: σχίσματα
  choice: फूट
  rationale: यह शब्द समुदाय के भीतर दरार या विभाजन को दर्शाता है। ‘फूट’ साधारण हिंदी में स्वाभाविक है और औपचारिक गुटबंदी का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ὑπάρχειν
  choice: हैं
  rationale: हिंदी में अस्तित्वसूचक भाव को सरल ‘हैं’ से स्वाभाविक रूप से व्यक्त किया जाता है; ‘विद्यमान हैं’ अनावश्यक रूप से औपचारिक होता।
- source_word: καὶ μέρος τι
  choice: और कुछ हद तक ... भी
  rationale: यह पौलुस के विश्वास को सीमित करता है और रिपोर्ट की केवल आंशिक स्वीकृति का भाव सुरक्षित रखता है।
- source_word: πιστεύω
  choice: मैं इस पर विश्वास ... करता हूँ
  rationale: निहित कर्म रिपोर्ट है; ‘इस पर’ उसे हिंदी में स्पष्ट करता है, बिना नई सूचना जोड़े।
theological_decisions:
- issue: इस संदर्भ में ἐκκλησία का अर्थ
  choice: इकट्ठी हुई विश्वासियों की मंडली—‘कलीसिया के रूप में’
  alternative: सभा में / कलीसिया में
  rationale: प्रसंग कुरिन्थियों के सामुदायिक रूप से एकत्र होने और प्रभु-भोज का है। यह चयन भवन-केंद्रित अर्थ से बचते हुए सामूहिक कलीसियाई पहचान व्यक्त करता है; पादटिप्पणी वैकल्पिक रूपों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘कलीसिया’ भारतीय हिंदी बाइबल परंपरा में परिचित सामुदायिक शब्द है; पादटिप्पणी भवन-केंद्रित गलतफहमी को रोकती है।
