  yaml_path: translation/nt/1_corinthians/011/021.yaml
  text: For each one goes ahead with his own supper when it is time to eat, and one is hungry while another gets drunk.
translation:
  language: hi
  text: क्योंकि भोजन के समय हर कोई अपना ही भोजन पहले ले लेता है[a], और एक भूखा रहता है, जबकि दूसरा नशे में हो जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूसरों से पहले अपना ही भोजन खा लेता है”; यूनानी क्रिया का अर्थ पहले ले लेना या दूसरों की प्रतीक्षा किए बिना आगे बढ़ जाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “एक भूखा है, और दूसरा नशे में है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: हर कोई
  rationale: यह वितरणात्मक एकवचन का स्वाभाविक आधुनिक हिन्दी रूप है और प्रत्येक सहभागी पर अलग-अलग बल देता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन में कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: τὸ ἴδιον δεῖπνον
  choice: अपना ही भोज
  rationale: ἴδιον के निजी स्वामित्व और साझा प्रभु-भोज से उसके विरोध को ‘ही’ स्पष्ट करता है; ‘भोज’ गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: προλαμβάνει
  choice: पहले खाने लगता है
  rationale: क्रिया में पहले ले लेने या दूसरों की प्रतीक्षा किए बिना आगे बढ़ने, दोनों की संभावना है; मुख्य पाठ सहज है और पादटिप्पणी वास्तविक अर्थ-विकल्प सुरक्षित रखती है।
- source_word: ἐν τῷ φαγεῖν
  choice: भोजन करते समय
  rationale: ἐν के साथ articular infinitive का कालगत अर्थ सीधे और स्वाभाविक हिन्दी में व्यक्त होता है, बिना ‘समय हो जाने’ जैसी अतिरिक्त व्याख्या जोड़े।
- source_word: ὃς μὲν ... ὃς δὲ
  choice: कोई ... और कोई
  rationale: यह अलग-अलग सहभागियों के विपरीत परिणामों को सहज हिन्दी में व्यक्त करता है।
- source_word: πεινᾷ
  choice: भूखा रह जाता है
  rationale: प्रसंग में असमान भोजन के फलस्वरूप किसी के भूखे रहने का भाव है; यह केवल क्षणिक भूख की तुलना में परिणाम को स्वाभाविक हिन्दी में बताता है।
- source_word: μεθύει
  choice: मतवाला हो जाता है
  rationale: यह नशे की वास्तविक अवस्था या उसमें पहुँचने को स्पष्ट करता है और मूल की कठोर आलोचना को नरम नहीं करता।
theological_decisions:
- issue: वितरणात्मक एकवचन और लिंग
  choice: हर कोई अपना ही भोज
  alternative: हर व्यक्ति अपना भोजन
  rationale: हिन्दी में ‘हर कोई ... अपना’ स्वाभाविक वितरणात्मक एकवचन है; यह यूनानी पुल्लिंग को अनावश्यक रूप से सर्वपुरुष कथन नहीं बनाता, फिर भी संख्या और व्यक्तिगत उत्तरदायित्व बनाए रखता है।
- issue: प्रभु-भोज में दुरुपयोग का स्वरूप
  choice: मतवाला हो जाता है
  alternative: नशे में है
  rationale: μεθύει वास्तविक मदहोशी को दर्शाता है; ‘हो जाता है’ प्रक्रिया/परिणाम का संभव भाव रखता है, जबकि विकल्प अवस्था पर बल देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामुदायिक भोजन के प्रसंग के अनुकूल है। ‘भोज’ आसपास के प्रभु-भोज प्रसंग से शब्दगत संबंध रखता है।
