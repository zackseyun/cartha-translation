  yaml_path: translation/nt/1_corinthians/003/004.yaml
  text: For whenever someone says[a], “I am of Paul,” and another, “I am of Apollos,” are you not merely human?
translation:
  language: hi
  text: क्योंकि जब भी कोई कहता है, “मैं पौलुस का हूँ,” और कोई दूसरा, “मैं अपुल्लोस का हूँ,” तो क्या तुम केवल मनुष्य ही नहीं हो?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम मनुष्य नहीं हो?” अथवा, “क्या तुम मनुष्यों के समान आचरण नहीं कर रहे?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: जब
  rationale: यहाँ यह अनिश्चित अथवा बार-बार घटने वाली परिस्थिति को दर्शाता है; हिन्दी में प्रसंग सहित ‘जब कोई’ स्वाभाविक रूप से यह भाव व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले तर्क के साथ पौलुस के व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: λέγῃ τις
  choice: कोई कहता है
  rationale: अनिश्चित एकवचन का सामान्य और सहज हिन्दी रूप है।
- source_word: Ἐγὼ μέν εἰμι Παύλου
  choice: मैं पौलुस का हूँ
  rationale: सम्बन्धकारक रूप दलगत निष्ठा व्यक्त करता है; यह संक्षिप्त यूनानी अभिव्यक्ति को सुरक्षित रखता है, बिना संबंध को अधिक स्पष्ट करके अर्थ थोपे।
- source_word: ἕτερος δέ
  choice: और दूसरा
  rationale: μέν…δέ के युग्मित विरोध को स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: Ἐγὼ Ἀπολλῶ
  choice: मैं अपुल्लोस का
  rationale: पहले खंड से ‘हूँ’ का लोप स्वाभाविक रूप से समझा जाता है और समानांतर दलगत कथन बना रहता है।
- source_word: οὐκ ἄνθρωποί ἐστε;
  choice: क्या तुम केवल मनुष्य ही नहीं हो?
  rationale: नकारात्मक आलंकारिक प्रश्न और सांसारिक मानवोचित आचरण की फटकार दोनों को व्यक्त करता है; ‘केवल’ प्रसंगगत बल को स्पष्ट करता है।
theological_decisions:
- issue: ἄνθρωποι का प्रसंगगत आशय
  choice: केवल मनुष्य
  alternative: क्या तुम मनुष्यों के समान आचरण नहीं कर रहे?
  rationale: मुख्य पाठ मूल संज्ञा ‘मनुष्य’ को बनाए रखते हुए ‘केवल’ से आलंकारिक फटकार व्यक्त करता है; व्यवहार-केंद्रित व्याख्या पादटिप्पणी में रखी गई है ताकि वास्तविक अर्थगत तनाव सुरक्षित रहे।
