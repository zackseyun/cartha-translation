  text: ἐγὼ ἐφύτευσα, Ἀπολλῶς ἐπότισεν, ἀλλὰ ὁ θεὸς ηὔξανεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/006.yaml
  text: I planted[a], Apollos watered, but God gave the growth.
translation:
  language: hi
  text: मैंने रोपा, अपुल्लोस ने सींचा, पर परमेश्वर उसे बढ़ाता रहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “पर परमेश्वर वृद्धि देता रहा।”'
    reason: ηὔξανεν के लिए एक अधिक संज्ञात्मक विकल्प; मुख्य पाठ का ‘बढ़ाता रहा’ आधुनिक हिन्दी में अधिक सीधा है और जारी क्रिया को स्पष्ट रखता है।
lexical_decisions:
- source_word: ἐγὼ ἐφύτευσα
  choice: मैंने रोपा
  rationale: ‘रोपा’ कृषि-रूपक को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है। ‘मैंने’ में कर्ता स्पष्ट है; प्रसंग में अलग से ‘मैं ही’ कहना अनावश्यक रूप से अधिक बल देता।
- source_word: Ἀπολλῶς
  choice: अपुल्लोस
  rationale: यूनानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: ἐπότισεν
  choice: सींचा
  rationale: ‘सींचा’ रोपने और बढ़ने के कृषि-चित्र से स्वाभाविक रूप से जुड़ता है और ποτίζω का अर्थ व्यक्त करता है।
- source_word: ἀλλὰ
  choice: पर
  rationale: यह मानवीय सेवाकार्य और परमेश्वर की निर्णायक क्रिया के बीच यूनानी के स्पष्ट विरोध को सहज आधुनिक हिन्दी में प्रकट करता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: ‘परमेश्वर’ हिन्दी बाइबलीय भाषा में θεός का प्रतिष्ठित, स्पष्ट और गरिमापूर्ण रूप है।
- source_word: ηὔξανεν
  choice: उसे बढ़ाता रहा
  rationale: अपूर्ण भूतकाल की जारी क्रिया को ‘बढ़ाता रहा’ से व्यक्त किया गया है। ‘उसे’ यूनानी में निहित रोपी और सींची गई वस्तु को हिन्दी में स्वाभाविक रूप से स्पष्ट करता है।
theological_decisions:
- issue: मानवीय सेवाकार्य और परमेश्वर की क्रिया का संबंध
  choice: पौलुस और अपुल्लोस के वास्तविक कार्यों को स्वीकार करते हुए परमेश्वर को बढ़ने की जारी और निर्णायक क्रिया का कर्ता बताया गया है।
  alternative: ‘परमेश्वर ने वृद्धि दी’
  rationale: मुख्य पाठ यूनानी के विरोध और अपूर्ण भूतकाल के पक्ष को बनाए रखता है, बिना यह समझाए कि मानवीय श्रम और परमेश्वर की क्रिया दार्शनिक रूप से कैसे संबंधित हैं।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण है। ‘रोपा—सींचा—बढ़ाता रहा’ की समानांतर कृषि-छवि सुरक्षित रखी गई है; अत्यधिक संस्कृतनिष्ठ अभिव्यक्ति से बचा गया है।
