source:
  edition: SBLGNT
  text: εἴ τινος τὸ ἔργον κατακαήσεται, ζημιωθήσεται, αὐτὸς δὲ σωθήσεται, οὕτως δὲ ὡς διὰ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/015.yaml
  text: If anyone’s work is burned up[a], he will suffer loss, but he himself will be saved—yet as through fire.
translation:
  language: hi
  text: यदि किसी का काम जलकर भस्म हो जाए, तो उसे हानि उठानी पड़ेगी; पर वह स्वयं बचाया जाएगा—फिर भी मानो आग में से होकर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परन्तु केवल आग में से होकर”; अथवा, “पर ऐसे जैसे कोई आग से बच निकलता है।”
    reason: अंतिम यूनानी वाक्यांश संक्षिप्त और रूपकात्मक है। ये विकल्प उसकी संभावित अर्थछटाओं को दर्शाते हैं, बिना उसके धर्मवैज्ञानिक आशय को निश्चित किए।
lexical_decisions:
- source_word: εἴ τινος
  choice: यदि किसी का
  rationale: यह अनिश्चित और वास्तविक शर्त को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ ἔργον
  choice: काम
  rationale: संदर्भ में यह व्यक्ति के निर्माण अथवा सेवाकार्य के परिणाम को दर्शाता है; ‘काम’ व्यापक अर्थ और निर्माण-रूपक दोनों के अनुकूल है।
- source_word: κατακαήσεται
  choice: जलकर भस्म हो जाए
  rationale: क्रिया पूरी तरह जलकर नष्ट हो जाने का प्रबल भाव रखती है; यह हिन्दी अभिव्यक्ति उस तीव्रता को स्पष्ट करती है।
- source_word: ζημιωθήσεται
  choice: उसे हानि उठानी पड़ेगी
  rationale: यह हानि या नुकसान सहने का अर्थ बनाए रखता है और हानि को किसी विशेष दंड अथवा प्रतिफल की हानि के रूप में अनावश्यक रूप से सीमित नहीं करता।
- source_word: αὐτὸς δὲ σωθήσεται
  choice: पर वह स्वयं बचाया जाएगा
  rationale: ‘स्वयं’ काम के नष्ट होने और व्यक्ति के बचाए जाने के बीच यूनानी पाठ का बलयुक्त विरोध सुरक्षित रखता है।
- source_word: οὕτως δὲ ὡς διὰ πυρός
  choice: फिर भी मानो आग के बीच से निकलकर
  rationale: यह आग से होकर निकलने के सजीव रूपक को स्वाभाविक हिन्दी में रखता है, पर उसके सटीक धर्मवैज्ञानिक आशय को तय नहीं करता।
theological_decisions:
- issue: क्या अंतिम वाक्यांश को शुद्धिकरण, दंड या केवल बाल-बाल बचने की किसी विशिष्ट धर्मसैद्धांतिक व्याख्या के अनुसार स्पष्ट किया जाए।
  choice: फिर भी मानो आग के बीच से निकलकर
  alternative: फिर भी केवल आग में से होकर; अथवा, पर ऐसे जैसे कोई आग से बच निकलता है
  rationale: यूनानी उपमा संक्षिप्त है और उसका सटीक आशय खुला रहता है। मुख्य पाठ रूपक को बनाए रखता है और पादटिप्पणी संभावित अर्थछटाएँ बताती है, बिना किसी सांप्रदायिक निष्कर्ष को पाठ में जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सहज शैली अपनाई गई है। ‘भस्म’ आग द्वारा पूर्ण विनाश को संक्षेप में व्यक्त करता है, जबकि अंतिम उपमा की वास्तविक अस्पष्टता पादटिप्पणी सहित सुरक्षित रखी गई है।
