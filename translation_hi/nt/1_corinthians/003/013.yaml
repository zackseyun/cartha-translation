source:
  edition: SBLGNT
  text: ἑκάστου τὸ ἔργον φανερὸν γενήσεται, ἡ γὰρ ἡμέρα δηλώσει· ὅτι ἐν πυρὶ ἀποκαλύπτεται, καὶ ἑκάστου τὸ ἔργον ὁποῖόν ἐστιν τὸ πῦρ ⸀αὐτὸ δοκιμάσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/013.yaml
  text: each one’s work will become evident[a], for the Day will disclose it, because it is revealed in fire[b], and the fire itself will test what sort of work each one has.
translation:
  language: hi
  text: हर एक का काम प्रकट हो जाएगा, क्योंकि वह दिन[a] उसे स्पष्ट कर देगा; क्योंकि वह दिन आग में प्रकट होगा[b], और आग स्वयं परखेगी कि हर एक का काम कैसा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वह दिन’ से सम्भवतः ईश्वरीय मूल्यांकन या न्याय का भावी दिन अभिप्रेत है।
    reason: cross_reference
  - marker: b
    text: या ‘आग के द्वारा प्रकट होगा।’ यूनानी पद ἐν πυρί का अर्थ ‘आग में’ अथवा साधनवाचक रूप में ‘आग के द्वारा’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκάστου
  choice: हर एक का
  rationale: यह संबंधकारक एकवचन का वितरणात्मक प्रयोग है; ‘हर एक का’ प्रत्येक व्यक्ति पर अलग-अलग बल बनाए रखता है।
- source_word: τὸ ἔργον
  choice: काम
  rationale: संदर्भ में यह निर्माण करने वाले प्रत्येक सेवक के कार्य और उसके परिणाम को व्यापक रूप से व्यक्त करता है।
- source_word: φανερὸν γενήσεται
  choice: प्रकट हो जाएगा
  rationale: यह विशेषण और भविष्यकालीन क्रिया के संयुक्त अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡ ἡμέρα
  choice: वह दिन
  rationale: निश्चित पद और संदर्भ भावी ईश्वरीय जाँच के विशिष्ट दिन की ओर संकेत करते हैं; ‘वह दिन’ इसे बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: δηλώσει
  choice: स्पष्ट कर देगा
  rationale: यह प्रकट करने या साफ दिखा देने का भाव देता है और अगले ἀποκαλύπτεται से शब्दगत भेद भी बनाए रखता है।
- source_word: ἐν πυρὶ
  choice: आग में
  rationale: यह यूनानी पूर्वसर्ग का सीधा रूप है और स्थानवाचक ‘में’ तथा साधनवाचक ‘आग के द्वारा’ की संभावित अर्थच्छायाओं को टिप्पणी में खुला रखता है।
- source_word: ἀποκαλύπτεται
  choice: प्रकट होता है
  rationale: वर्तमानकालीन कर्मवाच्य अर्थ को सहज हिन्दी में रखता है और दिव्य अनावरण की धारणा बनाए रखता है।
- source_word: ὁποῖόν ἐστιν
  choice: कैसा है
  rationale: यह काम के प्रकार या गुणवत्ता पर केंद्रित संक्षिप्त और स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: δοκιμάσει
  choice: परखेगी
  rationale: क्रिया किसी वस्तु की असलियत या गुणवत्ता जानने के लिए उसकी जाँच करने को दर्शाती है।
- source_word: αὐτὸ
  choice: स्वयं
  rationale: बलवाचक सर्वनाम इस बात पर जोर देता है कि आग ही परखने का कार्य करेगी।
theological_decisions:
- issue: ἡ ἡμέρα सामान्य दिन है या भावी ईश्वरीय मूल्यांकन का विशिष्ट दिन
  choice: ‘वह दिन’
  alternative: ‘दिन’
  rationale: आस-पास का संदर्भ उस भावी अवसर की ओर संकेत करता है जब परमेश्वर प्रत्येक के काम को परखेगा; ‘वह दिन’ इस विशिष्टता को स्वाभाविक हिन्दी में दर्शाता है।
- issue: ἀποκαλύπτεται का निहित कर्ता ‘दिन’ है या निकट संदर्भ का ‘काम’
  choice: ‘वह आग में प्रकट होता है’ कहकर सर्वनामगत संदर्भ को खुला रखा गया
  alternative: ‘वह दिन आग में प्रकट होता है’ या ‘काम आग में प्रकट होता है’
  rationale: यूनानी क्रिया में कर्ता स्पष्ट रूप से दोहराया नहीं गया है। किसी एक संज्ञा को जोड़ने से मूल पाठ की वास्तविक संदर्भगत अस्पष्टता अनावश्यक रूप से समाप्त हो जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कार्य’ की अपेक्षा ‘काम’ अधिक स्वाभाविक है, जबकि ‘प्रकट’, ‘स्पष्ट’ और ‘परखेगी’ न्याय तथा मूल्यांकन के गंभीर संदर्भ को बनाए रखते हैं। सभी टिप्पणी-चिह्न संबंधित पदों के साथ मुख्य पाठ में दिए गए हैं।
