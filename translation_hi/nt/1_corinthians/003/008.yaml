  text: ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, ἕκαστος δὲ τὸν ἴδιον μισθὸν λήμψεται κατὰ τὸν ἴδιον κόπον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/008.yaml
  text: The one who plants and the one who waters are one[a], and each will receive his own reward according to his own labor.
translation:
  language: hi
  text: रोपनेवाला और सींचनेवाला एक हैं[a], और हर एक अपने परिश्रम के अनुसार अपना प्रतिफल पाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “एकजुट हैं” या “उनका उद्देश्य एक है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: φυτεύων
  choice: रोपनेवाला
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त का स्वाभाविक हिन्दी रूप; यह खेती के रूपक और कार्य करनेवाले व्यक्ति—दोनों को बनाए रखता है।
- source_word: ποτίζων
  choice: सींचनेवाला
  rationale: यह खेती के रूपक में पौधों को पानी देने के कार्य को सहज और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἕν
  choice: एक
  rationale: नपुंसकलिंग एकवचन यहाँ व्यक्तियों की एकरूप पहचान नहीं, बल्कि उनकी एकता को व्यक्त करता है। संक्षिप्त ‘एक’ मूल की अर्थगत खुली बनावट बनाए रखता है; अर्थ-स्पष्ट विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: μισθὸν
  choice: प्रतिफल
  rationale: यह सेवा के प्रसंग में मिलनेवाले फल या प्रत्युपकार का भाव देता है और अर्थ को केवल आर्थिक मजदूरी तक सीमित नहीं करता।
- source_word: λήμψεται
  choice: पाएगा
  rationale: भविष्यकाल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; यहाँ यूनानी मध्यम रूप के लिए अलग आत्मवाचक अर्थ आवश्यक नहीं है।
- source_word: κατὰ
  choice: के अनुसार
  rationale: प्रतिफल और किए गए परिश्रम के बीच माप या अनुरूपता के संबंध को सुरक्षित रखता है।
- source_word: κόπον
  choice: परिश्रम
  rationale: यह साधारण ‘काम’ की अपेक्षा श्रम, मेहनत और कठिन प्रयास की धारणा को अधिक ठीक ढंग से व्यक्त करता है।
- source_word: ἴδιον
  choice: अपने / अपना
  rationale: यूनानी में दोहराए गए व्यक्तिगत बल को हिन्दी में ‘अपने परिश्रम’ और ‘अपना प्रतिफल’ द्वारा बनाए रखा गया है।
theological_decisions:
- issue: ἕν εἰσιν (‘एक हैं’) का आशय
  choice: ‘एक हैं’ रखकर सेवकों की एकता को व्यक्त किया गया है, जबकि उनकी अलग-अलग भूमिकाएँ बनी रहती हैं।
  alternative: ‘एकजुट हैं’ या ‘उनका उद्देश्य एक है।’
  rationale: नपुंसकलिंग ἕν व्यक्तिगत पहचान की समानता के बजाय एकता की ओर संकेत करता है। प्रसंग में पौलुस गुटबंदी का विरोध करते हुए अलग-अलग सेवकों के परमेश्वर के अधीन समन्वित कार्य पर बल देता है; फिर भी मुख्य पाठ मूल की संक्षिप्तता और अर्थगत तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘रोपनेवाला’ और ‘सींचनेवाला’ कृषि-रूपक को स्पष्ट रखते हैं; ‘प्रतिफल’ धार्मिक प्रसंग में स्वाभाविक है, और ‘परिश्रम’ κόπος के श्रमसाध्य भाव को व्यक्त करता है।
