source:
  edition: SBLGNT
  text: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι ὡς σοφὸς ἀρχιτέκτων θεμέλιον ⸀ἔθηκα, ἄλλος δὲ ἐποικοδομεῖ. ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/010.yaml
  text: According to the grace of God given to me[a], like a wise master builder I laid a foundation, and another builds on it[c][b]. But let each one be careful how he builds.
translation:
  language: hi
  text: परमेश्वर का जो अनुग्रह मुझे दिया गया, उसके अनुसार मैंने एक बुद्धिमान प्रधान कारीगर[a] के समान नींव डाली, और कोई दूसरा उस पर निर्माण कर रहा है। पर हर एक सावधान रहे कि वह किस प्रकार निर्माण करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वास्तुकार”; यूनानी शब्द ऐसे मुख्य या प्रधान कारीगर को दर्शाता है जो निर्माण-कार्य की देखरेख करता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ τὴν χάριν τοῦ θεοῦ τὴν δοθεῖσάν μοι
  choice: परमेश्वर का जो अनुग्रह मुझे दिया गया, उसके अनुसार
  rationale: κατά यहाँ दिए गए अनुग्रह के अनुरूप कार्य करने का भाव देता है। यह हिंदी रचना उस संबंध को स्पष्ट रखती है और अनुग्रह को परमेश्वर का प्रदान किया हुआ बताती है।
- source_word: ὡς σοφὸς ἀρχιτέκτων
  choice: एक बुद्धिमान प्रधान कारीगर के समान
  rationale: ἀρχιτέκτων प्राचीन संदर्भ में निर्माण की देखरेख करने वाले मुख्य या प्रधान निर्माता को दर्शाता है; केवल आधुनिक अर्थ वाले ‘वास्तुकार’ से इसका कार्यक्षेत्र संकरा हो सकता है।
- source_word: θεμέλιον ἔθηκα
  choice: नींव डाली
  rationale: नींव के साथ ‘डालना’ स्वाभाविक हिंदी प्रयोग है और यूनानी क्रिया का अर्थ ठीक व्यक्त करता है।
- source_word: ἄλλος δὲ ἐποικοδομεῖ
  choice: और कोई दूसरा उस पर निर्माण कर रहा है
  rationale: ἐποικοδομεῖ पहले से डाली गई नींव पर आगे निर्माण करने को दर्शाता है। वर्तमानकालीन ‘कर रहा है’ चल रही गतिविधि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἕκαστος δὲ βλεπέτω πῶς ἐποικοδομεῖ
  choice: पर हर एक सावधान रहे कि वह किस प्रकार निर्माण करता है
  rationale: βλεπέτω यहाँ सचेत रहने की आज्ञा है। ‘हर एक’ यूनानी एकवचन के प्रतिनिधिक और वितरणात्मक बल को बनाए रखता है।
theological_decisions:
- issue: χάρις का अर्थ
  choice: अनुग्रह
  alternative: कृपा / प्रदान की गई योग्यता
  rationale: ‘अनुग्रह’ पौलुस की धर्मवैज्ञानिक शब्दावली का भार बनाए रखता है, पर पाठ में उसे केवल उद्धार-संबंधी या केवल व्यक्तिगत कौशल के अर्थ तक सीमित नहीं करता।
- issue: ἕκαστος का प्रतिनिधिक पुल्लिंग
  choice: हर एक ... वह
  alternative: हर व्यक्ति ... वे / हर पुरुष ... वह
  rationale: यूनानी रूप व्याकरणतः पुल्लिंग एकवचन है, पर संदर्भ में प्रत्येक निर्माणकर्ता को समाविष्ट करता है। हिंदी का ‘हर एक ... वह’ एकवचन और व्यापक प्रतिनिधिक अर्थ दोनों बनाए रखता है।
- issue: दूसरे ἐποικοδομεῖ में नींव का निहित संबंध
  choice: किस प्रकार निर्माण करता है
  alternative: उस पर किस प्रकार निर्माण करता है
  rationale: यूनानी यौगिक क्रिया में ‘ऊपर निर्माण’ का भाव बना रहता है, किंतु तत्काल संदर्भ में नींव स्पष्ट होने से दूसरी बार ‘उस पर’ कहना आवश्यक नहीं है। संक्षिप्त रूप चेतावनी की धार बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली। ‘प्रधान कारीगर’ प्राचीन निर्माण-भूमिका को आधुनिक ‘वास्तुकार’ से अधिक व्यापक रूप में व्यक्त करता है। वाक्य में पौलुस के अनुग्रह-आधारित दावे और प्रत्येक निर्माणकर्ता के उत्तरदायित्व के बीच तनाव सुरक्षित रखा गया है।
