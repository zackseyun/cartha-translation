  text: and you are Messiah's[b][a], and Messiah is God's.
translation:
  language: hi
  text: और तुम मसीह के हो, और मसीह परमेश्वर के हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς
  choice: तुम
  rationale: यह द्वितीय पुरुष बहुवचन सर्वनाम है। आधुनिक हिन्दी में समुदाय को संबोधित करते हुए ‘तुम’ स्वाभाविक है और यूनानी पाठ से अतिरिक्त बल नहीं जोड़ता।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ पिछले विचार को आगे बढ़ाते हुए हल्का विरोध और क्रम दोनों व्यक्त करता है; ‘और’ सम्बन्ध की समानांतर कड़ी को सहज रूप से बनाए रखता है।
- source_word: Χριστοῦ / Χριστός
  choice: मसीह
  rationale: दोनों स्थानों पर एक ही उपाधि को दोहराना यूनानी वाक्य की आलंकारिक समानता बनाए रखता है। ‘मसीह’ आधुनिक हिन्दी में Χριστός के पदवीगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: θεοῦ
  choice: परमेश्वर
  rationale: θεός का प्रचलित, गरिमापूर्ण हिन्दी रूप ‘परमेश्वर’ है; सम्बन्धकारक अर्थ ‘परमेश्वर के’ से व्यक्त होता है।
theological_decisions:
- issue: Χριστοῦ और θεοῦ के सम्बन्धकारक रूपों में निहित अधिकार अथवा सम्बन्ध को कैसे व्यक्त किया जाए
  choice: ‘तुम मसीह के हो, और मसीह परमेश्वर के हैं’
  alternative: ‘तुम मसीह से सम्बन्ध रखते हो, और मसीह परमेश्वर से सम्बन्ध रखते हैं’ अथवा ‘तुम मसीह के अधिकार में हो, और मसीह परमेश्वर के अधिकार में हैं’
  rationale: ‘के हो/के हैं’ यूनानी की संक्षिप्त, समानांतर और कुछ हद तक खुली सम्बन्धसूचक अभिव्यक्ति को बनाए रखता है। अधिक व्याख्यात्मक शब्द जोड़ने से सम्बन्ध का स्वरूप अनावश्यक रूप से निश्चित हो जाता। यीशु के लिए आदरसूचक बहुवचन ‘हैं’ हिन्दी की स्वाभाविक गरिमा है, न कि यूनानी संख्या का परिवर्तन।
translation_notes:
  register: सरल, वर्तमान और गरिमापूर्ण मानक हिन्दी। वाक्य की संक्षिप्तता और दोनों खंडों की समानांतर संरचना सुरक्षित रखी गई है।
