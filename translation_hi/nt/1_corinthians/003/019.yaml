source:
  edition: SBLGNT
  text: ἡ γὰρ σοφία τοῦ κόσμου τούτου μωρία παρὰ τῷ θεῷ ἐστιν· γέγραπται γάρ· Ὁ δρασσόμενος τοὺς σοφοὺς ἐν τῇ πανουργίᾳ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/019.yaml
  text: For the wisdom of this world is foolishness with God[a]. For it is written[b], “He catches the wise in their craftiness.”
translation:
  language: hi
  text: क्योंकि इस संसार की बुद्धि परमेश्वर की दृष्टि में[a] मूर्खता है। क्योंकि लिखा है, “वह बुद्धिमानों को उनकी धूर्तता[b] में पकड़ लेता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “परमेश्वर के यहाँ”; अर्थात परमेश्वर की दृष्टि या निर्णय में।
    reason: lexical_alternative
  - marker: b
    text: या “चालाकी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: बुद्धि
  rationale: यहाँ यह संसार द्वारा बुद्धि मानी जाने वाली समझ को दर्शाता है; ‘बुद्धि’ आधुनिक हिन्दी में इसका स्वाभाविक और संदर्भानुकूल रूप है।
- source_word: κόσμου τούτου
  choice: इस संसार की
  rationale: κόσμος यहाँ वर्तमान सांसारिक व्यवस्था और उसके मूल्यों की ओर संकेत करता है; ‘इस संसार की’ मूल अभिव्यक्ति का सीधा और सहज अनुवाद है।
- source_word: μωρία
  choice: मूर्खता
  rationale: यह पौलुस के जानबूझकर रखे गए विरोध—संसार की बुद्धि बनाम परमेश्वर का मूल्यांकन—को स्पष्ट रूप से बनाए रखता है।
- source_word: παρὰ τῷ θεῷ
  choice: परमेश्वर की दृष्टि में
  rationale: παρά के साथ चतुर्थी यहाँ परमेश्वर के मूल्यांकन या दृष्टिकोण को व्यक्त करती है; यह हिन्दी में अर्थपूर्ण और स्वाभाविक है।
- source_word: γέγραπται
  choice: लिखा है
  rationale: यह पवित्रशास्त्र का उद्धरण प्रस्तुत करने वाला प्रचलित पूर्ण निष्क्रिय सूत्र है; ‘लिखा है’ उसके स्थायी अधिकार के भाव को बनाए रखता है।
- source_word: δρασσόμενος
  choice: पकड़ लेता है
  rationale: क्रिया किसी को झपटकर पकड़ने या उसके अपने उपाय में फँसा लेने का भाव देती है; ‘पकड़ लेता है’ हिन्दी में संक्षिप्त और सजीव है।
- source_word: σοφοὺς
  choice: बुद्धिमानों
  rationale: बहुवचन विशेषण यहाँ बुद्धिमान माने जाने वाले लोगों के लिए संज्ञा के रूप में प्रयुक्त है; ‘बुद्धिमानों’ अनावश्यक लैंगिक विशिष्टता से बचता है।
- source_word: πανουργίᾳ
  choice: धूर्तता
  rationale: शब्द यहाँ नैतिक रूप से नकारात्मक चतुराई या छलपूर्ण चालाकी को दर्शाता है; ‘धूर्तता’ उस नकारात्मक छाया को सुरक्षित रखता है।
theological_decisions:
- issue: अय्यूब 5:13 के उद्धरण में कर्ता की अभिव्यक्ति
  choice: वह बुद्धिमानों को उनकी ही धूर्तता में पकड़ लेता है
  alternative: बुद्धिमानों को उनकी धूर्तता में पकड़ने वाला
  rationale: यूनानी में संज्ञा-सदृश कृदंत का संकेत परमेश्वर की ओर है। ‘वह’ हिन्दी में कर्ता को स्वाभाविक बनाता है, पर कोई नई पहचान या व्याख्या नहीं जोड़ता। ‘ही’ इस विडंबना को उभारता है कि उनकी अपनी धूर्तता उनके पकड़े जाने का माध्यम बनती है।
- issue: सांसारिक बुद्धि के परमेश्वर-संबंधी मूल्यांकन को व्यक्त करना
  choice: परमेश्वर की दृष्टि में मूर्खता
  alternative: परमेश्वर के यहाँ मूर्खता
  rationale: यह चुनाव मूल के मूल्यांकनात्मक अर्थ को स्पष्ट करता है, बिना इस तनाव को कम किए कि जिसे संसार बुद्धि कहता है, परमेश्वर उसे मूर्खता ठहराता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप अपनाया गया है। वाक्य की दोनों ‘क्योंकि’ संरचनाएँ यूनानी γάρ की तर्क-श्रृंखला को बनाए रखती हैं। उद्धरण में सरल वर्तमानकाल और परिचित शब्दावली रखी गई है।
