source:
  edition: SBLGNT
  text: εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, οἵτινές ἐστε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/017.yaml
  text: If anyone destroys God's temple[a], God will destroy him; for God's temple is holy[b], and you are that temple.
translation:
  language: hi
  text: यदि कोई परमेश्वर के मंदिर को नष्ट करता है[a], तो परमेश्वर उसे नष्ट करेगा; क्योंकि परमेश्वर का मंदिर पवित्र है, और तुम सब ही वह मंदिर हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, दोनों प्रयोगों में, “भ्रष्ट करता है/करेगा” अथवा “अपवित्र करता है/करेगा।”
    reason: lexical_alternative
  - marker: b
    text: “तुम सब” बहुवचन है; पौलुस पूरी मण्डली को सामूहिक रूप से परमेश्वर का मंदिर बताता है।
    reason: cultural_note
lexical_decisions:
- source_word: ναός
  choice: मन्दिर
  rationale: यह शब्द परमेश्वर के पवित्र निवास-स्थान को दर्शाता है। आधुनिक हिन्दी में “मन्दिर” स्वाभाविक और स्पष्ट है; प्रसंग से इसका सामूहिक रूपकात्मक अर्थ सामने आता है।
- source_word: φθείρει / φθερεῖ
  choice: नष्ट करता है / नष्ट करेगा
  rationale: दोनों स्थानों पर एक ही हिन्दी क्रिया रखकर यूनानी की शब्द-पुनरावृत्ति और चेतावनी की कठोरता सुरक्षित रखी गई है। क्रिया में भ्रष्ट या अपवित्र करने का भाव भी सम्भव है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: τοῦτον
  choice: उसे
  rationale: यह अनिश्चित एकवचन व्यक्ति τις की ओर लौटता है। “उसे” सहज हिन्दी है और चेतावनी के व्यक्तिगत लक्ष्य को बनाए रखता है।
- source_word: ἅγιος
  choice: पवित्र
  rationale: यह ἅγιος का मानक और स्वाभाविक हिन्दी रूप है, जिसमें परमेश्वर के लिए अलग ठहराए जाने और पवित्र होने—दोनों का भाव बना रहता है।
- source_word: οἵτινές ἐστε ὑμεῖς
  choice: और वह मन्दिर तुम सब हो
  rationale: यह हिन्दी में स्वाभाविक ढंग से पाठकों की पहचान परमेश्वर के मन्दिर के रूप में करता है। “तुम सब” बहुवचन को स्पष्ट करता है, जबकि “मन्दिर” एकवचन रखकर समुदाय की सामूहिक पहचान सुरक्षित रहती है।
theological_decisions:
- issue: क्या परमेश्वर का मन्दिर मुख्यतः व्यक्तिगत विश्वासी है या पूरी मण्डली
  choice: यहाँ बहुवचन “तुम सब” को एकवचन “मन्दिर” से जोड़कर मण्डली को सामूहिक रूप से परमेश्वर का मन्दिर बताया गया है।
  alternative: व्यापक बाइबलीय धर्मविज्ञान के आधार पर इसे कभी-कभी प्रत्येक विश्वासी पर व्यक्तिगत रूप से भी लागू किया जाता है।
  rationale: यूनानी पाठ में ὑμεῖς बहुवचन है और ναός एकवचन; निकटवर्ती प्रसंग भी कुरिन्थ की मण्डली के सामूहिक निर्माण की बात करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सीधा रूप अपनाया गया है। “तुम सब” बहुवचन को खुलकर व्यक्त करता है; एकवचन “मन्दिर” के साथ यह सामूहिक अर्थ को स्पष्ट रखता है।
