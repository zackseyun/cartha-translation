source:
  edition: SBLGNT
  text: Κἀγώ, ἀδελφοί, οὐκ ἠδυνήθην ⸂λαλῆσαι ὑμῖν⸃ ὡς πνευματικοῖς ἀλλ’ ὡς ⸀σαρκίνοις, ὡς νηπίοις ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/001.yaml
  text: And I[a], brothers, was not able to speak to you as spiritual people, but as fleshly people[b], as infants in Messiah.
translation:
  language: hi
  text: और मैं, हे भाइयो,[a] तुमसे आत्मिक लोगों के समान बात नहीं कर सका, बल्कि शारीरिक लोगों के समान, मसीह में शिशुओं के समान, बात की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाइयो और बहनो’; यूनानी में ‘भाइयो’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγώ
  choice: और ... मैं
  rationale: καί के संयोजक बल और स्पष्ट प्रथम-पुरुष सर्वनाम, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: सम्बोधन में प्रयुक्त पुल्लिंग बहुवचन का औपचारिक रूप सुरक्षित है; मण्डली में स्त्रियों के सम्मिलित होने की सम्भावना पाद-टिप्पणी में स्पष्ट की गई है।
- source_word: οὐκ ἠδυνήθην
  choice: बात नहीं कर सका
  rationale: अतीत में असमर्थता का अर्थ सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πνευματικοῖς
  choice: आत्मिक लोगों
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; ‘लोगों’ जोड़ने से अर्थ स्पष्ट होता है, बिना अतिरिक्त व्याख्या के।
- source_word: σαρκίνοις
  choice: शरीरमय लोगों
  rationale: यह चयन σάρξ (‘शरीर/देह’) से शब्दगत सम्बन्ध और ‘आत्मिक’ के साथ विरोध को बनाए रखता है; ‘सांसारिक’ या ‘पापी’ जैसे अधिक व्याख्यात्मक अर्थ नहीं थोपता।
- source_word: νηπίοις
  choice: शिशुओं
  rationale: अपरिपक्वता के रूपक को गरिमापूर्ण और स्पष्ट आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: Χριστός की उपाधिगत शक्ति को हिन्दी के स्थापित शब्द ‘मसीह’ द्वारा व्यक्त करता है।
theological_decisions:
- issue: σαρκίνοις में ‘शरीर’ का आशय
  choice: शरीरमय लोगों
  alternative: सांसारिक लोगों
  rationale: मूल यूनानी शब्द को सीधे नैतिक दोष या ‘संसार’ की श्रेणी में बदलने के बजाय उसकी देह/शरीर-संबंधी अस्पष्टता और ‘आत्मिक’ से तनाव बनाए रखा गया है।
- issue: Χριστῷ का अनुवाद
  choice: मसीह में
  alternative: ख्रीष्ट में
  rationale: यहाँ पदवी का भाव उपस्थित है; ‘मसीह’ आधुनिक हिन्दी में प्रचलित और समझने योग्य रूप है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। अन्त में ‘बात की’ की पूर्ति यूनानी के दीर्घ तुलनात्मक वाक्य को हिन्दी में स्पष्ट करती है और यह अर्थ बनाए रखती है कि पौलुस ने उनसे बात तो की, पर आत्मिक लोगों के समान नहीं।
