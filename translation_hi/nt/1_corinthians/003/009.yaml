  choice: परमेश्वर के सहकर्मी
  alternative: परमेश्वर के साथ काम करनेवाले सहकर्मी
  rationale: यूनानी संबंधकारक दोनों व्याख्याओं की गुंजाइश देता है। निकट संदर्भ में सेवकों के परमेश्वर के अधीन और उसके होने पर बल है; मुख्य पाठ वह भाव रखता है, जबकि पादटिप्पणी वास्तविक वैकल्पिक व्याख्या सुरक्षित रखती है।
