lexical_decisions:
- source_word: εἴ
  choice: यदि
  rationale: यह एक साधारण शर्तसूचक उपवाक्य आरम्भ करता है; ‘यदि’ स्वाभाविक और सटीक है।
- source_word: τινος
  choice: किसी का
  rationale: सम्बन्धकारक अनिश्चित सर्वनाम अधिकार या सम्बन्ध बताता है; हिन्दी में ‘किसी का’ सहज है।
- source_word: τὸ ἔργον
  choice: काम
  rationale: ‘काम’ निर्माण के रूपक के अनुकूल है और अर्थ को किसी विशेष प्रकार के कर्म या सेवा तक सीमित नहीं करता।
- source_word: μενεῖ
  choice: टिका रहेगा
  rationale: भविष्यकालीन क्रिया बने रहने या स्थिर रहने का भाव देती है; आग से जाँच के प्रसंग में ‘टिका रहेगा’ स्वाभाविक है, फिर भी ‘बचा रहेगा’ जितना व्याख्यात्मक नहीं।
- source_word: ὃ ἐποικοδόμησεν
  choice: बनाया हुआ
  rationale: सम्बन्धवाचक उपवाक्य ‘काम’ को विशेषित करता है। हिन्दी में ‘किसी का बनाया हुआ काम’ संक्षिप्त और स्वाभाविक है; निकटवर्ती प्रसंग में नींव पर निर्माण का भाव स्पष्ट है।
- source_word: μισθὸν
  choice: प्रतिफल
  rationale: यह मूल्यांकन के परिणामस्वरूप मिलने वाले फल या भुगतान को व्यक्त करता है; ‘प्रतिफल’ आर्थिक मजदूरी तक अर्थ को सीमित नहीं करता।
- source_word: λήμψεται
  choice: उसे … मिलेगा
  rationale: हिन्दी की स्वाभाविक रचना में भविष्यकालीन ‘प्राप्त करेगा’ का अर्थ ‘उसे … मिलेगा’ से स्पष्ट और सहज रूप में व्यक्त होता है।
theological_decisions:
- issue: μισθός का स्वरूप
  choice: प्रतिफल
  alternative: मजदूरी या भुगतान
  rationale: पद यह नहीं बताता कि प्रतिफल का सटीक स्वरूप क्या है। ‘प्रतिफल’ दैवी मूल्यांकन के प्रसंग को व्यक्त करते हुए इस अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली रखी गई है। ‘बनाया हुआ काम’ निकटवर्ती नींव-और-निर्माण रूपक से जुड़ता है, जबकि हिन्दी में अनावश्यक रूप से ‘नींव पर’ जोड़ने से बचा गया है।
