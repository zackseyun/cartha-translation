  text: γάλα ὑμᾶς ἐπότισα, ⸀οὐ βρῶμα, οὔπω γὰρ ἐδύνασθε. ἀλλ’ ⸀οὐδὲ ἔτι νῦν δύνασθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/002.yaml
  text: I fed you milk[a], not solid food, for you were not yet able. But even now you are still not able[b],
translation:
  language: hi
  text: मैंने तुम्हें दूध पिलाया[a], ठोस भोजन नहीं दिया, क्योंकि तब तक तुम सक्षम नहीं थे। लेकिन अब तक भी तुम सक्षम नहीं हो[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “मैंने तुम्हें दूध पीने को दिया।”'
    reason: lexical_alternative
  - marker: b
    text: “ठोस भोजन” के लिए मूल भाषा में सामान्य शब्द “भोजन” है; दूध के साथ विरोध के कारण यहाँ “ठोस भोजन” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γάλα
  choice: दूध
  rationale: दूध का सीधा और स्वाभाविक हिन्दी पर्याय; यह पौलुस के पोषण-रूपक को बनाए रखता है।
- source_word: ἐπότισα
  choice: मैंने ... पिलाया
  rationale: क्रिया का मूल अर्थ ‘पीने को देना’ है। हिन्दी में ‘दूध पिलाया’ स्वाभाविक है और यूनानी की क्रिया को अंग्रेज़ी परामर्श-पाठ की अपेक्षा अधिक निकटता से दर्शाता है।
- source_word: βρῶμα
  choice: ठोस भोजन
  rationale: शब्द सामान्यतः ‘भोजन’ है, पर दूध के साथ विरोध के कारण यहाँ ‘ठोस भोजन’ आशय को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: οὔπω γὰρ ἐδύνασθε
  choice: क्योंकि तुम तब तक उसके योग्य नहीं थे
  rationale: वाक्य पूर्वकाल में उस समय तक बनी हुई अक्षमता बताता है; ‘उसके’ का संकेत ठोस भोजन की ओर है।
- source_word: ἀλλ’ οὐδὲ ἔτι νῦν δύνασθε
  choice: बल्कि अब भी तुम उसके योग्य नहीं हो
  rationale: ‘अब भी’ वर्तमान तक जारी स्थिति को व्यक्त करता है और ‘बल्कि’ पिछले कथन से तीखा संबंध बनाए रखता है।
theological_decisions:
- issue: पोषण-रूपक का अर्थ
  choice: दूध और ठोस भोजन के रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: ‘मैंने तुम्हें केवल आरम्भिक बातें सिखाईं’ जैसा अर्थ खोलकर कहना
  rationale: यूनानी पाठ स्वयं रूपक का प्रयोग करता है; उसे बनाए रखने से पाठ की धर्मवैचारिक व्यापकता और तनाव सुरक्षित रहते हैं।
- issue: δύναμαι में क्षमता का स्वरूप
  choice: ‘योग्य नहीं थे/हो’
  alternative: ‘सह नहीं सकते थे/हो’ या ‘समझ नहीं सकते थे/हो’
  rationale: मूल क्रिया सामान्य क्षमता बताती है और यह नहीं बताती कि कमी सहनशक्ति, समझ या किसी अन्य प्रकार की तैयारी में थी; ‘योग्य’ यहाँ क्षमता/तैयारी को खुला रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘दूध पिलाया’ हिन्दी मुहावरे के अनुसार स्वाभाविक है। समानांतर काल-भेद को ‘थे/हो’ से रखा गया है।
