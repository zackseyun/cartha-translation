revisions:
- from: इसलिए न तो रोपनेवाला कोई महत्त्व रखता है और न सींचनेवाला, बल्कि परमेश्वर ही महत्त्व रखता है, जो बढ़ाता है[a]।
  to: इसलिए न तो रोपनेवाला कुछ है, न सींचनेवाला; बल्कि परमेश्वर, जो वृद्धि करनेवाला है[a]।
  rationale: The revision removes the interpretive and source-unsupported claim that God ‘has importance’ and restores the source’s rhetorical contrast. It retains the agricultural parallel and expresses God’s growth-giving action in natural, dignified Hindi. The phrase “कुछ है” preserves the Greek idiom without falsely implying that the workers do not exist.
  reviewer_model: gpt-5.6-terra
