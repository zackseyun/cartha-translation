  yaml_path: translation/nt/1_corinthians/003/007.yaml
  text: So neither the one planting is anything[a], nor the one watering, but God who causes the growth.
translation:
  language: hi
  text: इसलिए न तो रोपनेवाला कुछ है, न सींचनेवाला; बल्कि परमेश्वर, जो वृद्धि करनेवाला है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो वृद्धि देता है”; परंपरागत रूप से, “जो बढ़ोतरी देता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ φυτεύων
  choice: रोपनेवाला
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत और कृषि-संबंधी रूपक, दोनों को संक्षिप्त तथा स्वाभाविक ढंग से बनाए रखता है।
- source_word: ἐστίν τι
  choice: कोई महत्त्व रखता है
  rationale: शाब्दिक ‘कुछ है’ हिन्दी में अस्तित्व-संबंधी अर्थ दे सकता है; संदर्भ में यूनानी मुहावरे का आशय किसी मनुष्य के निर्णायक महत्त्व का निषेध करना है।
- source_word: ὁ ποτίζων
  choice: सींचनेवाला
  rationale: ‘रोपनेवाला’ के समानांतर संरचना और कृषि-रूपक को बनाए रखता है।
- source_word: ἀλλ’
  choice: बल्कि
  rationale: मानवीय सेवकों और परमेश्वर के निर्णायक कार्य के बीच प्रबल विरोध को स्पष्ट करता है।
- source_word: ὁ αὐξάνων
  choice: जो बढ़ाता है
  rationale: परमेश्वर को वृद्धि उत्पन्न करनेवाले के रूप में व्यक्त करता है और यूनानी में अनकहे कर्म को मुख्य पाठ में नहीं जोड़ता।
- source_word: θεός
  choice: परमेश्वर
  rationale: आधुनिक मानक हिन्दी में θεός का प्रतिष्ठित और सर्वसुलभ समतुल्य; वाक्य के विरोधी बल को ‘ही’ से स्वाभाविक रूप दिया गया है।
theological_decisions:
- issue: मानवीय सेवकों के महत्त्व और परमेश्वर की भूमिका के बीच विरोध
  choice: ‘कोई महत्त्व रखता है’ का निषेध मनुष्यों पर लागू किया और ‘परमेश्वर ही महत्त्व रखता है’ कहा
  alternative: ‘न तो रोपनेवाला कुछ है ... बल्कि परमेश्वर’
  rationale: यह यूनानी ἐστίν τι का संदर्भगत बल स्पष्ट करता है, बिना यह कहे कि मानवीय सेवकों का अस्तित्व नहीं है या उनका कोई भी मूल्य नहीं; निर्णायक वृद्धि परमेश्वर से आती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘रोपनेवाला/सींचनेवाला’ से पौलुस की समानांतर कृषि-कल्पना बनी रहती है; ‘जो बढ़ाता है’ जानबूझकर कर्म को अनिर्दिष्ट छोड़ता है, जैसा यूनानी पाठ में है।
