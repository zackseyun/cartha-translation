    reason: alternative_reading
  revision_rationale: The revision replaces a Hindi construction that can suggest arrogance toward people with one that naturally expresses boasting with reference to people. It preserves the broad wording of the Greek in the main text and keeps the contextually narrower reference to leaders in the footnote.
