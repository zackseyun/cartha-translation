  text: So then[a], let no one boast in people[b], for all things are yours.
translation:
  language: hi
  text: इसलिए कोई भी लोगों को लेकर घमंड न करे,[a] क्योंकि सब कुछ तुम्हारा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रसंग में इसका अर्थ ‘मानवीय अगुओं को लेकर’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले तर्क से निकला निष्कर्ष व्यक्त करता है; ‘इसलिए’ आधुनिक हिन्दी में इसके अनुमानात्मक बल को स्वाभाविक रूप से रखता है।
- source_word: μηδεὶς
  choice: कोई ... न करे
  rationale: यह व्यापक निषेध है और किसी भी व्यक्ति को अपवाद नहीं देता।
- source_word: καυχάσθω
  choice: घमंड न करे
  rationale: यह सामान्य निषेधात्मक आज्ञा है; ‘घमंड करना’ आत्मश्लाघा के भाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ἀνθρώποις
  choice: मनुष्यों पर
  rationale: ἐν यहाँ घमंड के आधार या विषय को दर्शा सकता है। ‘मनुष्यों पर’ मूल की व्यापक, सामान्य अभिव्यक्ति बनाए रखता है; प्रसंग में अगुए अभिप्रेत हो सकते हैं, पर यह बात मुख्य पाठ में स्पष्ट करके मूल की व्यापकता को सीमित नहीं किया गया।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन व्यापक है; ‘सब कुछ’ आधुनिक हिन्दी में स्वाभाविक ढंग से उसी समग्रता को व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह निषेध का आधार बताता है; हिन्दी में ‘क्योंकि’ उस कारणात्मक संबंध को स्पष्ट रखता है।
- source_word: ὑμῶν ἐστιν
  choice: तुम्हारा है
  rationale: सम्बन्धकारक सर्वनाम और ἐστιν मिलकर अधिकार या सम्बन्ध व्यक्त करते हैं; ‘तुम्हारा है’ सीधा और मुहावरेदार अनुवाद है।
theological_decisions:
- issue: ἀνθρώποις का प्रसंगगत दायरा
  choice: मुख्य पाठ में व्यापक ‘मनुष्यों’ रखा गया
  alternative: ‘मानवीय अगुओं’ या ‘मनुष्य-अगुओं’
  rationale: अध्याय के प्रसंग में पौलुस, अपुल्लोस और कैफा जैसे अगुए सामने हैं, फिर भी यूनानी संज्ञा सामान्य रूप से ‘मनुष्यों’ कहती है। व्यापक शब्द को मुख्य पाठ में रखकर और प्रसंगगत अर्थ को पादटिप्पणी में देकर वास्तविक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मनुष्यों’ मूल यूनानी के सामान्य, लिंग-समावेशी अर्थ को व्यक्त करता है; ‘लोगों’ की अपेक्षा यह यहाँ थोड़ा अधिक औपचारिक और शास्त्रीय प्रसंग के अनुकूल है।
