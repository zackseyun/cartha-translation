revisions:
- from: इसलिए कोई मनुष्यों पर घमंड न करे,[a] क्योंकि सब कुछ तुम्हारा है।
  to: इसलिए कोई भी लोगों को लेकर घमंड न करे,[a] क्योंकि सब कुछ तुम्हारा है।
  rationale: The revision replaces a Hindi construction that can suggest arrogance toward people with one that naturally expresses boasting with reference to people. It preserves the broad wording of the Greek in the main text and keeps the contextually narrower reference to leaders in the footnote.
  reviewer_model: gpt-5.6-terra
