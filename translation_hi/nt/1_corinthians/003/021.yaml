review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inferential force of ὥστε, the general prohibition, and the comprehensive possessive statement. However, “मनुष्यों पर घमंड करना” can naturally imply acting arrogantly toward people, rather than boasting with people as one’s basis or object. “लोगों को लेकर घमंड करना” more clearly represents the intended relation while retaining the Greek noun’s broad scope.
  naturalness: The revised wording is idiomatic modern standard Hindi and avoids the potentially misleading sense of superiority over other people. “सब कुछ तुम्हारा है” is natural for the plural addressees in a collective context.
  terminology: “लोगों” appropriately conveys ἀνθρώποις as a generic human plural without implying that only males are meant. The contextual possibility that Paul particularly has human leaders in view is retained in a footnote rather than imposed in the text.
  issues:
  - severity: medium
    issue: “मनुष्यों पर घमंड न करे” is semantically ambiguous in Hindi.
    rationale: It may be understood as ‘not be arrogant toward people,’ whereas καυχάομαι ἐν ἀνθρώποις concerns boasting in, or making one’s boast with reference to, people.
  revised_text: इसलिए कोई भी लोगों को लेकर घमंड न करे,[a] क्योंकि सब कुछ तुम्हारा है।
  revised_footnotes:
