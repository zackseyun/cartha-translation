translation:
  language: hi
  text: चाहे पौलुस हो, चाहे अपुल्लोस, चाहे कैफा, चाहे संसार, चाहे जीवन, चाहे मृत्यु, चाहे वर्तमान की बातें, चाहे आने वाली बातें—सब तुम्हारा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε … εἴτε
  choice: चाहे … चाहे
  rationale: बार-बार आए विकल्पसूचक संयोजक की अलंकारिक लय और पूरी सूची की संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Παῦλος
  choice: पौलुस
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: Ἀπολλῶς
  choice: अपुल्लोस
  rationale: यूनानी व्यक्तिनाम का निकट और हिन्दी में प्रचलित लिप्यंतरण।
- source_word: Κηφᾶς
  choice: कैफा
  rationale: मूल पाठ में प्रयुक्त सामी नाम-रूप को बनाए रखा गया है; इसे अर्थ-समान नाम 'पतरस' से नहीं बदला गया।
- source_word: κόσμος
  choice: संसार
  rationale: यहाँ विश्व अथवा सृष्टिगत व्यवस्था के व्यापक अर्थ को व्यक्त करने वाला स्वाभाविक हिन्दी शब्द।
- source_word: ζωή
  choice: जीवन
  rationale: सूची में प्रयुक्त संज्ञा का सीधा और स्वाभाविक समतुल्य।
- source_word: θάνατος
  choice: मृत्यु
  rationale: स्रोत संज्ञा का सीधा और गरिमापूर्ण हिन्दी समतुल्य।
- source_word: ἐνεστῶτα
  choice: वर्तमान की बातें
  rationale: संज्ञा की तरह प्रयुक्त कृदंत वर्तमान वास्तविकताओं को दर्शाता है; यह रूप सामान्य पाठक के लिए स्पष्ट है।
- source_word: μέλλοντα
  choice: आनेवाली बातें
  rationale: संज्ञा की तरह प्रयुक्त कृदंत भविष्य की वास्तविकताओं को दर्शाता है और 'वर्तमान की बातें' के साथ स्वाभाविक युग्म बनाता है।
- source_word: πάντα
  choice: सब
  rationale: व्यक्तियों और वस्तुस्थितियों दोनों को समेटती सूची के बाद स्रोत के सर्वसमावेशी बल को संक्षेप में बनाए रखता है।
- source_word: ὑμῶν
  choice: तुम्हारा है
  rationale: समुदाय को संबोधित बहुवचन संबंधकारक का अधिकारसूचक अर्थ स्वाभाविक हिन्दी में व्यक्त करता है; 'सब' को सामूहिक एकक मानकर एकवचन क्रिया रखी गई है।
theological_decisions: []
