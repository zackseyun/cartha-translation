reference: 1 Corinthians 3:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: θεμέλιον γὰρ ἄλλον οὐδεὶς δύναται θεῖναι παρὰ τὸν κείμενον, ὅς ἐστιν Ἰησοῦς Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/011.yaml
  text: For no one can lay another foundation besides the one already laid[a], which is Jesus the Messiah.
translation:
  language: hi
  text: क्योंकि जो नींव पहले ही डाली जा चुकी है—अर्थात् यीशु मसीह—उसके सिवा कोई दूसरी नींव नहीं डाल सकता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεμέλιον
  choice: नींव
  rationale: निर्माण के रूपक में यह स्वाभाविक और स्पष्ट हिन्दी पर्याय है तथा निकटवर्ती प्रसंग की भवन-निर्माण संबंधी भाषा को बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस संबंध को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἄλλον
  choice: दूसरी
  rationale: यह पहले से विद्यमान नींव से भिन्न किसी अन्य नींव को सूचित करता है।
- source_word: οὐδεὶς δύναται θεῖναι
  choice: कोई ... नहीं डाल सकता
  rationale: यह सार्वभौमिक निषेध और सामर्थ्य की धारणा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; नींव के साथ ‘डालना’ प्रचलित प्रयोग है।
- source_word: παρὰ τὸν κείμενον
  choice: जो नींव पहले ही डाली जा चुकी है ... उसके सिवा
  rationale: ‘उसके सिवा’ अपवर्जन का भाव रखता है और पूर्ण कृदन्त κείμενον की वर्तमान परिणामकारी स्थिति को ‘पहले ही डाली जा चुकी है’ से स्पष्ट करता है।
- source_word: ὅς ἐστιν
  choice: अर्थात्
  rationale: यूनानी संबंधवाचक वाक्यांश नींव की पहचान यीशु मसीह के रूप में करता है; हिन्दी में ‘अर्थात्’ इस पहचान को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Ἰησοῦς Χριστός
  choice: यीशु मसीह
  rationale: Ἰησοῦς नाम का प्रचलित हिन्दी रूप ‘यीशु’ है और Χριστός के अभिषिक्त/मसीही पदनाम को ‘मसीह’ स्वाभाविक रूप से सुरक्षित रखता है।
theological_decisions:
- issue: Ἰησοῦς Χριστός में Χριστός का रूपांतरण
  choice: यीशु मसीह
  alternative: यीशु ख्रीस्त / जीसस क्राइस्ट
  rationale: Χριστός को केवल उपनाम न मानकर उसके पदनाम-संबंधी अर्थ को ‘मसीह’ से व्यक्त किया गया है। यह आधुनिक मानक हिन्दी में व्यापक, अर्थपूर्ण और संप्रदाय-निरपेक्ष रूप है।
- issue: नींव और यीशु की पहचान का वाक्य-विन्यास
  choice: —अर्थात् यीशु मसीह—
  alternative: जो यीशु मसीह है
  rationale: मूल पाठ नींव की सीधी पहचान यीशु मसीह से करता है। ‘अर्थात्’ इस पहचान को बनाए रखता है और हिन्दी में निर्जीव ‘नींव’ के लिए असहज संबंधवाचक रचना से बचता है, बिना रूपक को समझाकर समाप्त किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य में मूल यूनानी का कारणसूचक संबंध, अपवर्जन, पहले से स्थापित नींव की स्थिति और यीशु मसीह से उसकी स्पष्ट पहचान सुरक्षित है।
