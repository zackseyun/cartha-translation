source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι ναὸς θεοῦ ἐστε καὶ τὸ πνεῦμα τοῦ θεοῦ ⸂οἰκεῖ ἐν ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/016.yaml
  text: Do you not know that you are God’s temple and that God’s Spirit dwells in you?[a][b][c]
translation:
  language: hi
  text: क्या तुम नहीं जानते कि तुम परमेश्वर का मंदिर[a][b] हो और परमेश्वर की आत्मा तुममें[c] वास करती है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परमेश्वर का पवित्र स्थान।’
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘तुम’ बहुवचन है; पौलुस पूरे समुदाय को सामूहिक रूप से संबोधित कर रहा है।
    reason: cultural_note
  - marker: c
    text: या ‘तुम्हारे बीच।’
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: क्या तुम नहीं जानते
  rationale: यह पौलुस के आलंकारिक प्रश्न का बल बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ναὸς θεοῦ
  choice: परमेश्वर का मन्दिर
  rationale: ναός विशेष रूप से पवित्र मन्दिर या गर्भगृह-सदृश पवित्रस्थान को दर्शाता है; ‘मन्दिर’ स्पष्ट और प्रचलित हिन्दी है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐστε
  choice: तुम ... हो
  rationale: क्रिया द्वितीय पुरुष बहुवचन है। हिन्दी में ‘तुम’ समुदाय को सामूहिक रूप से सम्बोधित कर सकता है।
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: परमेश्वर का आत्मा
  rationale: यह यूनानी सम्बन्धकारक रचना को स्वाभाविक हिन्दी में व्यक्त करता है और अर्थ को संकीर्ण नहीं करता।
- source_word: οἰκεῖ
  choice: वास करता है
  rationale: यह स्थायी निवास का भाव व्यक्त करता है और मन्दिर की उपमा के अनुरूप गरिमापूर्ण हिन्दी है।
- source_word: ἐν ὑμῖν
  choice: तुममें
  rationale: यह मूल ‘ἐν’ का सीधा और स्वाभाविक रूप है; सामुदायिक सन्दर्भ में ‘तुम्हारे बीच’ की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: यह पद मुख्यतः अलग-अलग विश्वासियों की बात करता है या कलीसिया की सामूहिक रूप से
  choice: मुख्य पाठ में बहुवचन ‘तुम’ रखा गया है और समुदाय को स्पष्ट करने वाला अतिरिक्त शब्द नहीं जोड़ा गया।
  alternative: ‘तुम सब मिलकर परमेश्वर का मन्दिर हो’ या व्यक्तिवादी ‘तुममें से हर एक परमेश्वर का मन्दिर है।’
  rationale: यूनानी सम्बोधन बहुवचन है और सन्दर्भ में समुदाय को सम्बोधित करता है, पर मूल पाठ में ‘मिलकर’ या ‘हर एक’ जैसा स्पष्ट पद नहीं है। अतः अनुवाद वास्तविक तनाव को बनाए रखता है।
- issue: ἐν ὑμῖν का स्थानगत अर्थ
  choice: तुममें
  alternative: तुम्हारे बीच
  rationale: दोनों अर्थ सम्भव हैं। मुख्य पाठ अधिक सीधा रूप रखता है, जबकि सामुदायिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘मन्दिर’ और ‘वास करता है’ पवित्र स्थान तथा स्थायी निवास की संयुक्त उपमा को बनाए रखते हैं। बहुवचन ‘तुम’ मूल की सामुदायिक दिशा को बिना अतिरिक्त व्याख्यात्मक शब्द जोड़े सुरक्षित रखता है।
