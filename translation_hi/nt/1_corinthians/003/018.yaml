reference: 1 Corinthians 3:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Μηδεὶς ἑαυτὸν ἐξαπατάτω· εἴ τις δοκεῖ σοφὸς εἶναι ἐν ὑμῖν ἐν τῷ αἰῶνι τούτῳ, μωρὸς γενέσθω, ἵνα γένηται σοφός,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/018.yaml
  text: Let no one deceive himself[a]. If anyone among you thinks he is wise in this age, let him become foolish[b], so that he may become wise.
translation:
  language: hi
  text: कोई अपने आप को धोखा न दे। यदि तुममें कोई इस युग में अपने आप को बुद्धिमान समझता है, तो वह मूर्ख बने[a], ताकि वह बुद्धिमान हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्ख हो जाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς ἑαυτὸν ἐξαπατάτω
  choice: कोई अपने आप को धोखा न दे
  rationale: यूनानी निषेधात्मक आज्ञा और स्पष्ट आत्मवाचक कर्म, दोनों को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: δοκεῖ σοφὸς εἶναι
  choice: अपने आप को बुद्धिमान समझता है
  rationale: δοκεῖ यहाँ व्यक्ति के आत्म-मूल्यांकन को व्यक्त करता है; यह प्रयोग हिन्दी में अर्थ को सहज रूप से स्पष्ट करता है।
- source_word: ἐν ὑμῖν
  choice: तुममें
  rationale: कुरिन्थ की विश्वासी संगति के भीतर किसी व्यक्ति की ओर संकेत करने वाला संक्षिप्त और स्वाभाविक रूप।
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: इस युग में
  rationale: αἰών का काल-संबंधी आयाम बनाए रखता है और वर्तमान युग की बुद्धि तथा परमेश्वर की बुद्धि के बीच पौलुस के विरोध को अनावश्यक रूप से नहीं मिटाता।
- source_word: μωρὸς γενέσθω
  choice: वह मूर्ख बने
  rationale: विशेषण μωρός और आज्ञार्थक γενέσθω को सीधे व्यक्त करते हुए पद के जानबूझकर रखे गए विरोधाभास को बनाए रखता है।
- source_word: ἵνα γένηται σοφός
  choice: ताकि वह बुद्धिमान हो जाए
  rationale: ἵνα के प्रयोजनार्थक संबंध और ‘मूर्ख बनने’ से वास्तविक बुद्धिमत्ता पाने के विरोधाभास को सुरक्षित रखता है।
theological_decisions:
- issue: ἐν τῷ αἰῶνι τούτῳ का अर्थ
  choice: इस युग में
  alternative: इस संसार में; इस युग के मानदंडों के अनुसार
  rationale: ‘युग’ मूल के कालगत और धार्मिक-वैचारिक संकेत को सबसे निकट से रखता है। ‘मानदंडों के अनुसार’ संदर्भगत अर्थ हो सकता है, पर वह मूल में निहित बात को पाठ में स्पष्ट व्याख्या बनाकर जोड़ देता।
- issue: μωρός को विशेषण या संज्ञा के रूप में व्यक्त करना
  choice: मूर्ख बने
  alternative: मूर्खता अपनाए; मूर्ख समझा जाए
  rationale: मूल का विधेय विशेषण और आत्म-विनम्रता का तीखा विरोधाभास सीधे बनाए रखा गया है; इसे केवल सामाजिक धारणा या व्यवहार तक सीमित नहीं किया गया।
- issue: व्याकरणिक पुल्लिंग एकवचन का प्रतिनिधिक प्रयोग
  choice: कोई…वह
  alternative: जो लोग…वे
  rationale: मूल के एकवचन प्रतिनिधिक स्वरूप को बनाए रखते हुए हिन्दी के स्वाभाविक सर्वनामों का प्रयोग किया गया है; कथन का सामान्य अनुप्रयोग सीमित नहीं होता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘अपने आप को बुद्धिमान समझता है’ हिन्दी में आत्म-मूल्यांकन स्पष्ट करता है। मुख्य पाठ में ‘इस युग में’ मूल की वास्तविक अस्पष्टता बनाए रखता है; इसे ‘इस युग के मानदंडों के अनुसार’ कहकर व्याख्यात्मक रूप से संकुचित नहीं किया गया।
