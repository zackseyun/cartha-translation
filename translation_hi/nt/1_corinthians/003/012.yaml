source:
  edition: SBLGNT
  text: εἰ δέ τις ἐποικοδομεῖ ἐπὶ τὸν ⸀θεμέλιον ⸂χρυσόν, ἄργυρον⸃, λίθους τιμίους, ξύλα, χόρτον, καλάμην,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/012.yaml
  text: If anyone builds on the foundation with gold, silver, precious stones, wood, hay, straw,
translation:
  language: hi
  text: यदि कोई उस नींव पर सोने, चाँदी, बहुमूल्य पत्थरों, लकड़ी, सूखी घास, पुआल से निर्माण करता है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ τις
  choice: यदि कोई
  rationale: εἰ शर्त प्रस्तुत करता है और τις का सामान्य, अनिश्चित अर्थ ‘कोई’ है। δέ यहाँ तर्क को हल्के ढंग से आगे बढ़ाता है; हिंदी में अलग संयोजक जोड़ने के बजाय स्वाभाविक वाक्य-प्रवाह से यह संबंध स्पष्ट रहता है।
- source_word: ἐποικοδομεῖ ἐπὶ τὸν θεμέλιον
  choice: उस नींव पर … निर्माण करता है
  rationale: क्रिया और ἐπί मिलकर पहले से रखी गई नींव के ऊपर निर्माण करने का अर्थ देते हैं। ‘उस’ पिछले पद में उल्लिखित निश्चित नींव की ओर संकेत करता है।
- source_word: χρυσόν
  choice: सोने
  rationale: निर्माण-सामग्री के रूप में प्रयुक्त सोने का सीधा और स्वाभाविक हिंदी रूप।
- source_word: ἄργυρον
  choice: चाँदी
  rationale: सूची में सोने के साथ रखी गई धातु का सीधा अनुवाद।
- source_word: λίθους τιμίους
  choice: बहुमूल्य पत्थरों
  rationale: τιμίους मूल्यवान अथवा महँगे होने का भाव देता है; यह रूप रत्नों तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ξύλα
  choice: लकड़ी
  rationale: यहाँ निर्माण-सामग्री का सामूहिक हिंदी नाम स्वाभाविक है।
- source_word: χόρτον
  choice: सूखी घास
  rationale: χόρτος मूलतः घास को दर्शा सकता है; इस निर्माण-सामग्री की सूची और आग की आगामी कसौटी के संदर्भ में ‘सूखी घास’ आशय को स्वाभाविक रूप से व्यक्त करती है, जबकि ‘चारा’ जैसा अतिरिक्त उपयोगगत अर्थ नहीं जोड़ती।
- source_word: καλάμην
  choice: पुआल
  rationale: यह डंठल या भूसे-जैसी सूखी सामग्री को दर्शाता है; आधुनिक हिंदी में ‘पुआल’ निर्माण-सामग्री की इस सूची और सूखी घास से उसके भेद को स्पष्ट रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। पद स्वयं अगले पद में पूरी होने वाली शर्तीय संरचना है, इसलिए अंत में अल्पविराम रखा गया है। सामग्री की सूची को हिंदी में स्वाभाविक बनाने के लिए अंतिम दो मदों के बीच ‘या’ जोड़ा गया है।
