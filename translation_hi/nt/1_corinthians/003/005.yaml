base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/005.yaml
  text: What then is Apollos? And what is Paul? Servants through whom you believed[c][b][a], as the Lord gave to each one.
translation:
  language: hi
  text: तो अपुल्लोस क्या है? और पौलुस क्या है?[a] वे तो सेवक[b] हैं, जिनके द्वारा तुमने विश्वास किया, और हर एक को, जैसा प्रभु ने दिया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो अपुल्लोस कौन है? और पौलुस कौन है?” यूनानी में शब्दशः “क्या” है, जो उनकी पहचान से अधिक उनकी भूमिका पर ध्यान दिलाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “सेवा करने वाले।” यहाँ प्रयुक्त यूनानी शब्द सेवक या सेवा के माध्यम को दर्शाता है; इसका अर्थ आवश्यक रूप से ‘डीकन’ का औपचारिक कलीसियाई पद नहीं है।
    reason: lexical_alternative
  - marker: c
    text: “और हर एक को, जैसा प्रभु ने दिया” यूनानी में संक्षिप्त और लुप्त-पद वाला वाक्यांश है; इसका अनुवाद “जैसा प्रभु ने हर एक को सौंपा” भी किया जाता है। मूल में यह नहीं बताया गया कि प्रभु ने क्या दिया।
    reason: alternative_reading
lexical_decisions:
- source_word: Τί
  choice: क्या
  rationale: नपुंसकलिंग प्रश्नवाचक यहाँ व्यक्तियों की पहचान से अधिक उनकी भूमिका या हैसियत पर बल देता है; इसलिए ‘कौन’ के बजाय ‘क्या’ रखा गया है।
- source_word: οὖν
  choice: तो
  rationale: यह पिछले विचार से निष्कर्ष और आगे बढ़ने का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: διάκονοι
  choice: सेवक
  rationale: संदर्भ में यह सेवा करने वाले माध्यम या कार्यकर्ता को दर्शाता है, किसी औपचारिक कलीसियाई पद को आवश्यक रूप से नहीं।
- source_word: δι’ ὧν
  choice: जिनके द्वारा
  rationale: διά के साधन अथवा माध्यम वाले अर्थ को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ἐπιστεύσατε
  choice: तुमने विश्वास किया
  rationale: यह यूनानी क्रिया के सीधे अर्थ को रखता है और विश्वास के विषय या प्रक्रिया का अनावश्यक विस्तार नहीं करता।
- source_word: καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν
  choice: और हर एक को वैसा ही, जैसा प्रभु ने दिया
  rationale: यूनानी वाक्यांश में ‘दिया’ का कर्म अनकहा है। हिन्दी में ‘वैसा ही’ से संबंध सुबोध होता है, पर कार्य, भूमिका या वरदान जैसा कोई निश्चित कर्म नहीं जोड़ा जाता।
- source_word: κύριος
  choice: प्रभु
  rationale: यह κύριος का स्थापित, गरिमापूर्ण और संदर्भानुकूल हिन्दी रूप है; मुख्य पाठ उसके संदर्भित व्यक्ति को अतिरिक्त रूप से निर्दिष्ट नहीं करता।
theological_decisions:
- issue: ‘प्रभु’ (κύριος) का संदर्भ
  choice: मुख्य पाठ में केवल ‘प्रभु’ रखा गया है; संदर्भ में इसे प्रभु यीशु समझा जा सकता है।
  alternative: इसे सामान्य रूप से परमेश्वर का उल्लेख समझना।
  rationale: तात्कालिक पौलुसी संदर्भ सेवा बाँटने वाले प्रभु की ओर संकेत करता है, पर अनुवाद स्वयं स्रोत से अधिक स्पष्ट पहचान नहीं जोड़ता।
- issue: ‘जैसा प्रभु ने दिया’ में लोप
  choice: दिए गए कार्य, भूमिका, अवसर या वरदान को मुख्य पाठ में स्पष्ट नहीं किया गया।
  alternative: ‘जैसा प्रभु ने हर एक को कार्य सौंपा’ अथवा ‘हर एक को भूमिका दी’ कहना।
  rationale: यूनानी में ‘दिया’ का कर्म अनुपस्थित है। उसे खुला रखने से मूल की संक्षिप्तता और वास्तविक अर्थगत तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए सहज किंतु गरिमापूर्ण रखी गई है। ‘क्या’ की असामान्य पर अर्थपूर्ण प्रश्न-रचना और अंतिम वाक्यांश का लोप मूल के आलंकारिक बल तथा अस्पष्टता को सुरक्षित रखते हैं; पादटिप्पणियाँ स्वाभाविक विकल्प स्पष्ट करती हैं।
