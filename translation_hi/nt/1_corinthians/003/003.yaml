- from: क्योंकि तुम अब भी शरीर के अनुसार चलनेवाले हो। जहाँ तुम्हारे बीच जलन और झगड़ा है, वहाँ क्या तुम शरीर के अनुसार चलनेवाले नहीं हो और मनुष्यों की रीति पर नहीं चलते?[a]
  to: क्योंकि तुम अब भी शारीरिक हो। क्योंकि जहाँ तुम्हारे बीच ईर्ष्या और कलह है, वहाँ क्या तुम शारीरिक नहीं हो और मनुष्य की रीति से नहीं चलते?[a]
  rationale: The revision preserves the source’s twofold σαρκικοί, its two explanatory γὰρ clauses, and the final rhetorical question. ‘शारीरिक’ is necessarily somewhat formal but is concise, established in biblical Hindi, and more source-faithful than converting the adjective into a behavioral paraphrase. The footnote retains the clearer idiomatic alternative without imposing a doctrinal interpretation.
