review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rebuke, the continuing force of ‘still,’ and the rhetorical question. However, rendering σαρκικοί as ‘शरीर के अनुसार चलनेवाले’ turns a repeated adjective (‘fleshly’) into a verbal phrase and anticipates/duplicates the distinct final verb περιπατεῖτε. The two occurrences should remain adjectival in Hindi as far as possible.
  naturalness: ‘जलन’ and ‘झगड़ा’ are understandable, but ‘ईर्ष्या और कलह’ more closely and naturally reflects the paired ethical terms in this formal epistolary context. ‘मनुष्य की रीति से चलते हो’ is idiomatic modern Hindi while retaining the singular-source sense better than ‘मनुष्यों की रीति पर।’
  terminology: ‘शारीरिक’ is retained for σαρκικοί as the established, concise Hindi equivalent tied to ‘शरीर,’ without importing an expanded doctrinal phrase. The footnote supplies the idiomatic alternative for κατὰ ἄνθρωπον together with περιπατεῖτε.
  issues:
  - severity: medium
    issue: σαρκικοί is rendered as ‘शरीर के अनुसार चलनेवाले।’
    rationale: The Greek adjective describes what they are; it does not itself mean ‘walking according to the body.’ This rendering also repeats the action expressed separately by περιπατεῖτε and blurs the distinction between σαρκικοί and κατὰ ἄνθρωπον περιπατεῖτε.
  - severity: low
    issue: The second γὰρ is omitted.
    rationale: Hindi can omit it for smoothness, but retaining ‘क्योंकि’ in both clauses better preserves Paul’s explicit explanatory progression without harming readability.
  - severity: low
    issue: The footnote’s quoted alternative includes a negation disconnected from the quoted alternative.
    rationale: The question’s negation belongs to the surrounding rhetorical construction. The alternative should state the positive verbal phrase, with the question supplied by the main sentence structure.
  revised_text: क्योंकि तुम अब भी शारीरिक हो। क्योंकि जहाँ तुम्हारे बीच ईर्ष्या और कलह है, वहाँ क्या तुम शारीरिक नहीं हो और मनुष्य की रीति से नहीं चलते?[a]
