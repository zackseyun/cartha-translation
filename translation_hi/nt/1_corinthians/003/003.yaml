  revision_rationale: The revision preserves the source’s twofold σαρκικοί, its two explanatory γὰρ clauses, and the final rhetorical question. ‘शारीरिक’ is necessarily somewhat formal but is concise, established in biblical Hindi, and more source-faithful than converting the adjective into a behavioral paraphrase. The footnote retains the clearer idiomatic alternative without imposing a doctrinal interpretation.
