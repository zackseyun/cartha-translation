id: 1CO.3.3
reference: 1 Corinthians 3:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔτι γὰρ σαρκικοί ἐστε. ὅπου γὰρ ἐν ὑμῖν ζῆλος καὶ ⸀ἔρις, οὐχὶ σαρκικοί ἐστε καὶ κατὰ ἄνθρωπον περιπατεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/003/003.yaml
  text: For you are still fleshly. For where there is jealousy and strife among you[a], are you not fleshly and walking according to man?
translation:
  language: hi
  text: क्योंकि तुम अब भी शारीरिक हो। क्योंकि जहाँ तुम्हारे बीच ईर्ष्या और कलह है, वहाँ क्या तुम शारीरिक नहीं हो और मनुष्य की रीति से नहीं चलते?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “केवल मानवीय ढंग से जीवन बिताते हो?”
    reason: κατὰ ἄνθρωπον और περιπατεῖτε का अधिक मुहावरेदार अर्थ-विकल्प।
lexical_decisions:
- source_word: ἔτι
  choice: अब भी
  rationale: यह उनकी जारी अवस्था को दिखाता है और पौलुस की फटकार को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पहले γὰρ के व्याख्यात्मक कारण-संबंध को स्पष्ट करता है; दूसरे को हिन्दी की स्वाभाविकता के लिए अलग शब्द के रूप में दोहराया नहीं गया।
- source_word: σαρκικοί
  choice: शरीर के अनुसार चलनेवाले
  rationale: σάρξ से संबंध बनाए रखता है, पर हिन्दी में अस्पष्ट या अप्राकृतिक ‘शारीरिक’ से बचता है और नैतिक अभिप्राय को संदर्भानुसार व्यक्त करता है।
- source_word: ὅπου
  choice: जहाँ … वहाँ
  rationale: यूनानी के स्थानवाचक ढाँचे को स्वाभाविक हिन्दी सहसंबंधी रचना में सुरक्षित रखता है।
- source_word: ζῆλος
  choice: जलन
  rationale: ἔρις के साथ नकारात्मक संदर्भ में ईर्ष्यापूर्ण भाव का सहज और सामान्य हिन्दी रूप है।
- source_word: ἔρις
  choice: झगड़ा
  rationale: समुदाय के भीतर कलह और विवाद को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὐχὶ
  choice: क्या … नहीं
  rationale: हाँ की अपेक्षा रखनेवाले यूनानी आलंकारिक प्रश्न को सुरक्षित रखता है।
- source_word: κατὰ ἄνθρωπον
  choice: मनुष्यों की रीति पर
  rationale: शाब्दिक ‘मनुष्य के अनुसार’ की असहजता से बचते हुए केवल मानवीय ढंग के अर्थ को रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: περιπατεῖτε
  choice: चलते
  rationale: पौलुस के नैतिक ‘चलने’ के रूपक को हिन्दी में बोधगम्य रूप से बनाए रखता है।
theological_decisions:
- issue: σαρκικοί में σάρξ-संबंधी भाषा
  choice: शरीर के अनुसार चलनेवाले
  alternative: सांसारिक; पापी स्वभाव के वश में
  rationale: यह ‘शरीर’ से शब्दगत संबंध बनाए रखता है, पर पाठ में ऐसा व्यवस्थित धर्मवैज्ञानिक अर्थ नहीं जोड़ता जिसे विशेषण स्वयं स्पष्ट रूप से नहीं कहता।
- issue: κατὰ ἄνθρωπον का नैतिक आशय
  choice: मनुष्यों की रीति पर
  alternative: केवल मानवीय ढंग से
  rationale: मुख्य पाठ स्रोत के रूपक और तनाव को काफी निकट रखता है, जबकि पादटिप्पणी अधिक स्पष्ट अर्थ-विकल्प देती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘चलना’ रूपक सुरक्षित रखा गया है; ‘शरीर के अनुसार चलनेवाले’ दोहराकर पौलुस की फटकार और σάρξ-संबंध बनाए रखा गया है।
