id: 1CO.10.7
reference: 1 Corinthians 10:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μηδὲ εἰδωλολάτραι γίνεσθε, καθώς τινες αὐτῶν· ὥσπερ γέγραπται· Ἐκάθισεν ὁ λαὸς φαγεῖν καὶ πεῖν, καὶ ἀνέστησαν παίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/007.yaml
  text: Do not become idolaters[a], as some of them were; just as it is written, “The people sat down to eat and drink, and rose up to play.”
translation:
  language: hi
  text: मूर्तिपूजक भी न बनो, जैसे उनमें से कुछ बन गए थे। जैसा लिखा है, “लोग खाने-पीने बैठे और खेलने[a] के लिए उठ खड़े हुए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रंग-रेलियाँ मनाने।” यह उद्धरण निर्गमन 32:6 से है, जहाँ यह ‘खेलना’ सोने के बछड़े के चारों ओर इस्राएल के मूर्तिपूजक उत्सव से जुड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: भी न
  rationale: यह पिछले निर्देशों से जुड़ी हुई मनाही है; ‘भी न’ इस क्रमबद्ध निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰδωλολάτραι
  choice: मूर्तिपूजक
  rationale: यह संक्षिप्त और प्रचलित हिन्दी शब्द मूर्तियों की उपासना करने वालों को सटीक रूप से दर्शाता है।
- source_word: γίνεσθε
  choice: बनो
  rationale: γίνομαι यहाँ केवल किसी दशा में होने के बजाय वैसा बन जाने की चेतावनी देता है; ‘बनो’ इस गतिशील भाव को बनाए रखता है।
- source_word: τινες αὐτῶν
  choice: उनमें से कुछ
  rationale: यह जंगल की पीढ़ी में से कुछ लोगों की ओर संकेत करता है और यूनानी वाक्य की अनिश्चितता को बनाए रखता है।
- source_word: ὥσπερ γέγραπται
  choice: जैसा लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण की मानक और स्वाभाविक हिन्दी भूमिका है।
- source_word: Ἐκάθισεν ὁ λαὸς
  choice: लोग ... बैठे
  rationale: सामूहिक ὁ λαός को सहज हिन्दी में ‘लोग’ कहा गया है और बैठने की क्रिया को उद्धरण के प्रवाह में रखा गया है।
- source_word: φαγεῖν καὶ πεῖν
  choice: खाने-पीने
  rationale: दोनों समानांतर क्रियाओं को हिन्दी के स्वाभाविक संयुक्त रूप में सटीकता से व्यक्त किया गया है।
- source_word: ἀνέστησαν
  choice: उठ खड़े हुए
  rationale: यह बैठने के बाद उठने की कथात्मक गति को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: παίζειν
  choice: खेलने
  rationale: मूल क्रिया का सीधा अर्थ बनाए रखा गया है; मूर्तिपूजक उत्सव से जुड़ी रंग-रेलियों का संभावित संदर्भ पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: निर्गमन 32:6 के उद्धरण में παίζειν के आशय को कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘खेलने’ रखा गया है और प्रसंगगत ‘रंग-रेलियाँ मनाने’ का अर्थ पाद-टिप्पणी में दिया गया है।
  alternative: ‘रंग-रेलियाँ मनाने’ या ‘उत्सव मनाने’ के लिए उठ खड़े हुए
  rationale: क्रिया का मूल अर्थ ‘खेलना’ है, पर सोने के बछड़े के प्रसंग में इसमें मूर्तिपूजक भोज और उच्छृंखल उत्सव का भाव हो सकता है। मुख्य पाठ मूल की शब्दगत खुली जगह को बनाए रखता है, जबकि पाद-टिप्पणी प्रसंगगत अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘मूर्तिपूजक’ जैसे परिचित धार्मिक शब्द को रखा गया है, जबकि उद्धरण की भाषा सहज और लयपूर्ण है।
