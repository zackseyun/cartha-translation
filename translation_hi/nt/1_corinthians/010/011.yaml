base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/011.yaml
  text: These things happened to them as examples[a], but they were written for our instruction[c][b], on whom the ends of the ages have come.
translation:
  language: hi
  text: ये बातें उनके साथ उदाहरण के रूप में घटीं[a], और हमारी शिक्षा के लिए लिखी गईं[b]; हम पर युगों के अंत आ पहुँचे हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रतिरूप के रूप में” अथवा “प्रतिरूपात्मक ढंग से”; पौलुस इन घटनाओं को बाद के विश्वासियों के लिए शिक्षाप्रद नमूनों के रूप में प्रस्तुत करता है।
    reason: lexical_alternative
  - marker: b
    text: या “हमारी चेतावनी के लिए” अथवा “हमारी ताड़ना-भरी शिक्षा के लिए”; यूनानी शब्द में सुधारने वाली शिक्षा और चेतावनी—दोनों का भाव है।
    reason: lexical_alternative
  - marker: c
    text: या “युगों का अंत आ पहुँचा है।” यूनानी में “अंत” और “युगों” की अभिव्यक्ति बहुवचन है; मुख्य पाठ पौलुस की इसी उद्धार-ऐतिहासिक शब्दावली को बनाए रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τυπικῶς
  choice: उदाहरण के रूप में
  rationale: यह क्रियाविशेषण उन घटनाओं को बाद के विश्वासियों के लिए अर्थपूर्ण प्रतिरूप या उदाहरण बताता है। यह हिंदी में स्पष्ट है, जबकि तकनीकी विकल्प मुख्य पाठ को कठिन बना सकते हैं।
- source_word: συνέβαινεν
  choice: घटीं
  rationale: अपूर्ण भूतकाल की गतकालीन घटना का स्वाभाविक हिंदी रूप; बहुवचन ‘बातें’ अनेक घटनाओं का भाव व्यक्त करता है।
- source_word: ἐκείνοις
  choice: उनके साथ
  rationale: यह पिछले प्रसंग की जंगल-यात्रा वाली पीढ़ी की ओर संकेत करता है और हिंदी में घटना घटने का स्वाभाविक संबंध व्यक्त करता है।
- source_word: ἐγράφη
  choice: लिखी गईं
  rationale: यूनानी में क्रिया एकवचन है, पर अर्थ पूर्वोक्त घटनाओं के लिखित वृत्तांत से है; हिंदी में ‘बातें’ के साथ बहुवचन सहज और अर्थ-संगत है।
- source_word: πρὸς νουθεσίαν
  choice: हमारी शिक्षा और चेतावनी के लिए
  rationale: νουθεσία में सुधारने वाली शिक्षा और सावधान करने वाली चेतावनी दोनों शामिल हैं; संयुक्त पद हिंदी में इस अर्थ-व्याप्ति को स्पष्ट रखता है।
- source_word: εἰς οὓς
  choice: हम पर, जिन पर
  rationale: यह उन लोगों को बताता है जिन पर युगांत-संबंधी वास्तविकता आ पहुँची है; ‘पर’ यूनानी की दिशात्मक परिणति को बनाए रखता है।
- source_word: τὰ τέλη τῶν αἰώνων
  choice: युगों के अंत
  rationale: τέλη और αἰώνων दोनों के बहुवचन-संबंध को यथासंभव बनाए रखकर पौलुस की उद्धार-ऐतिहासिक अभिव्यक्ति को एकवचन में नहीं समेटा गया।
- source_word: κατήντηκεν
  choice: आ पहुँचे हैं
  rationale: पूर्णकाल किसी ऐसी पूर्ण हुई पहुँच को व्यक्त करता है जिसका वर्तमान प्रभाव बना हुआ है; ‘आ पहुँचे हैं’ यह बल स्वाभाविक हिंदी में देता है।
theological_decisions:
- issue: τὰ τέλη τῶν αἰώνων की उद्धार-ऐतिहासिक अभिव्यक्ति
  choice: युगों के अंत आ पहुँचे हैं
  alternative: युगों का अंत आ पहुँचा है; युगों की परिपूर्णता आ पहुँची है
  rationale: बहुवचन को सुरक्षित रखने से पौलुस की अभिव्यक्ति और उसकी युगांत-संबंधी धार का तनाव बना रहता है; इसे किसी एक व्यवस्थित व्याख्या में नहीं समेटा गया।
- issue: νουθεσία का शिक्षात्मक और चेतावनीपूर्ण बल
  choice: शिक्षा और चेतावनी
  alternative: उपदेश; चेतावनी; अनुशासनात्मक शिक्षा
  rationale: संदर्भ में पूर्व घटनाएँ केवल जानकारी नहीं देतीं, बल्कि पाठकों को सुधारती और सावधान करती हैं; संयुक्त अभिव्यक्ति दोनों पक्षों को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण। ‘परन्तु’ औपचारिकता बनाए रखता है, जबकि वाक्य-विन्यास सामान्य पाठकों के लिए सहज है। तकनीकी ‘प्रतिरूपात्मक’ को मुख्य पाठ के बजाय पादटिप्पणी में रखा गया है।
