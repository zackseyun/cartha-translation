id: 1CO.10.16
reference: 1 Corinthians 10:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ⸂ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ⸃; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/016.yaml
  text: The cup of blessing that we bless—is it not a sharing in the blood of Messiah? The bread that we break—is it not a sharing in the body of Messiah?[a][b]
translation:
  language: hi
  text: आशीष का वह प्याला जिसे हम आशीष देते हैं—क्या वह मसीह के लहू में सहभागिता नहीं है? वह रोटी जिसे हम तोड़ते हैं—क्या वह मसीह की देह में सहभागिता नहीं है?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भागीदारी”; परंपरागत रूप से “संगति।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी Χριστός (ख्रिस्तोस), अर्थात “मसीह” या “अभिषिक्त जन”; इसे “ख्रीस्त” भी कहा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ ποτήριον
  choice: प्याला
  rationale: यह आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण शब्द है तथा बाद की विशिष्ट कलीसियाई शब्दावली को आरोपित नहीं करता।
- source_word: τῆς εὐλογίας
  choice: आशीष का
  rationale: सम्बन्धकारक पदबंध का सीधा अनुवाद है; यह आशीष और धन्यवाद, दोनों से जुड़े भोजन-संदर्भ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ὃ εὐλογοῦμεν
  choice: जिसे हम आशीष देते हैं
  rationale: εὐλογία और εὐλογέω की शब्दगत पुनरावृत्ति को हिन्दी में बनाए रखता है और क्रिया को केवल धन्यवाद देने तक सीमित नहीं करता।
- source_word: οὐχὶ
  choice: क्या ... नहीं है?
  rationale: सकारात्मक उत्तर की अपेक्षा रखने वाले यूनानी आलंकारिक प्रश्न का रूप और बल सुरक्षित रहता है।
- source_word: κοινωνία
  choice: में सहभागिता
  rationale: यह वास्तविक भागीदारी का भाव व्यक्त करता है, पर प्रभु-भोज में उपस्थिति की रीति से जुड़े सम्प्रदायगत निष्कर्ष को अनुवाद में तय नहीं करता।
- source_word: τοῦ αἵματος
  choice: लहू में
  rationale: ‘लहू’ बाइबलीय बलिदानी और वाचागत अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τοῦ Χριστοῦ
  choice: मसीह के/की
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; ‘मसीह’ आधुनिक हिन्दी में उसका प्रचलित और अर्थपूर्ण रूप है।
- source_word: τὸν ἄρτον
  choice: रोटी
  rationale: सामान्य भोजन और प्रभु-भोज, दोनों संदर्भों में यह स्पष्ट और स्वाभाविक हिन्दी है; यूनानी यहाँ अनिवार्य रूप से एक पूरी लोई निर्दिष्ट नहीं करता।
- source_word: ὃν κλῶμεν
  choice: जिसे हम तोड़ते हैं
  rationale: ठोस सामूहिक क्रिया का सीधा और सहज अनुवाद है।
- source_word: τοῦ σώματος
  choice: देह में
  rationale: ‘देह’ पद के मसीह-संबंधी और प्रभु-भोज संबंधी महत्व को बिना व्याख्यात्मक संकुचन के सुरक्षित रखता है।
theological_decisions:
- issue: प्रभु-भोज के संदर्भ में κοινωνία का अर्थ
  choice: में सहभागिता
  alternative: में भागीदारी; की संगति
  rationale: पद मसीह के लहू और देह में वास्तविक भाग लेने की बात करता है, पर उस सहभागिता की रीति को स्पष्ट नहीं करता। ‘सहभागिता’ इस तनाव को बनाए रखती है और इसे न केवल प्रतीक तक घटाती है, न किसी बाद की पारिभाषिक व्याख्या में बाँधती है।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त; अभिषिक्त जन
  rationale: इस प्रसंग में यह उपाधि सक्रिय है। ‘मसीह’ हिन्दी पाठकों के लिए स्वाभाविक है और अभिषिक्त जन का तात्पर्य वहन करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों समानांतर आलंकारिक प्रश्न और ‘आशीष’ की संज्ञा-क्रिया पुनरावृत्ति सुरक्षित हैं। ‘सहभागिता’ को जानबूझकर ऐसा रखा गया है कि पद की प्रभु-भोज संबंधी वास्तविकता बनी रहे, पर किसी विशिष्ट सम्प्रदायगत सिद्धांत का निर्णय अनुवाद में न थोपा जाए।
