  text: μηδὲ ἐκπειράζωμεν τὸν ⸀Χριστόν, ⸀καθώς τινες αὐτῶν ἐπείρασαν, καὶ ὑπὸ τῶν ὄφεων ⸀ἀπώλλυντο.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/009.yaml
  text: Nor should we put Messiah to the test[b][a], as some of them tested him and were being destroyed by the snakes.
translation:
  language: hi
  text: और हम मसीह को परीक्षा में न डालें, जैसे उनमें से कुछ ने उसे परीक्षा में डाला और साँपों से नाश हो रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “मसीह” के स्थान पर “प्रभु” पढ़ा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: μηδὲ
  choice: और हम ... न
  rationale: यह पिछले निषेधों की शृंखला को आगे बढ़ाता है और यूनानी के उपदेशात्मक बहुवचन को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐκπειράζωμεν
  choice: परखें
  rationale: यह किसी को अनुचित ढंग से परीक्षा में डालने या उसकी सीमा आज़माने का भाव देता है; ‘लुभाएँ’ यहाँ भ्रामक होता।
- source_word: τὸν Χριστόν
  choice: मसीह
  rationale: Χριστός यहाँ उपाधि है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और स्वाभाविक है।
- source_word: καθώς
  choice: जैसे
  rationale: इस्राएलियों के उदाहरण के साथ सीधी तुलना व्यक्त करता है।
- source_word: τινες αὐτῶν
  choice: उनमें से कुछ
  rationale: जंगल की पीढ़ी के कुछ लोगों को स्पष्ट और स्वाभाविक ढंग से दर्शाता है।
- source_word: ἐπείρασαν
  choice: परखा
  rationale: ऐतिहासिक कृत्य को व्यक्त करता है और पहले क्रियापद के साथ शब्दगत संबंध बनाए रखता है।
- source_word: ὑπὸ τῶν ὄφεων
  choice: साँपों के द्वारा
  rationale: ὄφις का सामान्य आधुनिक हिन्दी अर्थ ‘साँप’ है; कर्मवाच्य संबंध भी स्पष्ट रहता है।
- source_word: ἀπώλλυντο
  choice: नष्ट किए जा रहे थे
  rationale: अपूर्ण भूतकाल की प्रगतिशीलता और कर्मवाच्य रूप को यथासंभव बनाए रखता है।
theological_decisions:
- issue: τὸν Χριστόν का पाठ और जंगल की घटना में उसका संकेत
  choice: मसीह
  alternative: प्रभु
  rationale: SBLGNT में Χριστόν है, इसलिए मुख्य पाठ में ‘मसीह’ रखा गया है। महत्त्वपूर्ण पांडुलिपीय पाठांतर ‘प्रभु’ को पाद-टिप्पणी में सुरक्षित रखा गया है; इससे संदर्भ की धर्मवैज्ञानिक तीक्ष्णता को न तो दबाया जाता है, न उससे आगे कोई व्याख्या आरोपित की जाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परखें/परखा’ की पुनरावृत्ति मूल यूनानी के शब्दगत संबंध को बनाए रखती है। ‘नष्ट किए जा रहे थे’ कुछ कम बोलचाल का है, पर ἀπώλλυντο के अपूर्ण और कर्मवाच्य पक्ष को सुरक्षित करता है।
