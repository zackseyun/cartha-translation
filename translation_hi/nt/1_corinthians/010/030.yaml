  register: आधुनिक, सहज और सम्मानपूर्ण हिन्दी। भोजन का प्रसंग स्पष्ट करने के लिए μετέχω को ‘खाता हूँ’ कहा गया है। ‘मेरी निंदा की जाती है’ सार्वजनिक दोषारोपण का भाव देता है, बिना परमेश्वर-विषयक ‘ईशनिंदा’ का अर्थ थोपे।
