  yaml_path: translation/nt/1_corinthians/010/030.yaml
  text: If I partake with thankfulness[a], why am I denounced for that for which I give thanks?
translation:
  language: hi
  text: यदि मैं कृतज्ञतापूर्वक खाता हूँ[a], तो जिस बात के लिए मैं धन्यवाद देता हूँ, उसके कारण मेरी निंदा क्यों की जाती है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि मैं अनुग्रह के द्वारा सहभागी होता हूँ, तो जिस बात के लिए मैं धन्यवाद देता हूँ, उसके कारण मेरी निंदा क्यों की जाती है?” यूनानी χάριτι का अर्थ “अनुग्रह के द्वारा” भी हो सकता है; पर यहाँ आगे आए “मैं धन्यवाद देता हूँ” के कारण बहुत-से लोग इसे कृतज्ञतापूर्वक खाने के अर्थ में समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτι
  choice: धन्यवाद देकर
  rationale: भोजन और इसके तुरंत बाद आए εὐχαριστῶ (‘मैं धन्यवाद देता हूँ’) के संदर्भ में यह स्वाभाविक हिन्दी में कृतज्ञतापूर्वक खाने का भाव व्यक्त करता है। ‘अनुग्रह के द्वारा’ सम्भव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: μετέχω
  choice: खाता हूँ
  rationale: क्रिया का मूल भाव ‘भाग लेना/साझी होना’ है, पर तत्काल प्रसंग भोजन का है; हिन्दी में केवल ‘भाग लेता हूँ’ अस्पष्ट और अस्वाभाविक होगा। ‘खाता हूँ’ प्रसंगगत अर्थ को सहज रूप से व्यक्त करता है।
- source_word: βλασφημοῦμαι
  choice: मेरी निंदा की जाती है
  rationale: यहाँ क्रिया परमेश्वर की निन्दा नहीं, बल्कि पौलुस के विरुद्ध कही जाने वाली अपमानजनक या दोषारोपण की बात दर्शाती है। कर्मवाच्य रूप यूनानी संरचना को बनाए रखता है।
- source_word: ὑπὲρ οὗ
  choice: जिस चीज़ के लिए … उसके कारण
  rationale: यह सम्बन्धवाचक संरचना निंदा के आधार या कारण को दिखाती है और हिन्दी में कारण-संबंध स्पष्ट करती है।
- source_word: εὐχαριστῶ
  choice: मैं धन्यवाद देता हूँ
  rationale: यूनानी में धन्यवाद देने वाला और उसका विषय स्पष्ट है, पर जिसे धन्यवाद दिया जाता है उसका नाम नहीं दिया गया; इसलिए ‘परमेश्वर’ को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: τί
  choice: क्यों
  rationale: इस आलंकारिक प्रश्न में τί कारण पूछता है; आधुनिक हिन्दी में ‘क्यों’ इसका स्वाभाविक रूप है।
- source_word: ἐγὼ … ἐγὼ
  choice: मैं … मैं
  rationale: दोनों स्पष्ट सर्वनामों का प्रथम-पुरुष रूप रखकर यूनानी के व्यक्तिगत बल और विरोधाभास को यथासम्भव सुरक्षित रखा गया है।
theological_decisions:
- issue: भोजन और धन्यवाद के सम्बन्ध में χάριτι का अर्थ
  choice: धन्यवाद देकर / कृतज्ञतापूर्वक
  alternative: अनुग्रह के द्वारा
  rationale: निकटवर्ती εὐχαριστῶ (‘मैं धन्यवाद देता हूँ’) कृतज्ञता के अर्थ को प्रबल बनाता है। फिर भी ‘अनुग्रह के द्वारा’ व्याकरण और शब्दार्थ की दृष्टि से सम्भव है; वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है और उद्धार-संबंधी अर्थ मुख्य पाठ में आरोपित नहीं किया गया।
