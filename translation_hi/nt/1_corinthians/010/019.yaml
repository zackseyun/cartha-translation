translation:
  language: hi
  text: तो फिर मैं क्या कह रहा हूँ? क्या यह कि मूर्ति को चढ़ाया गया भोजन कुछ है,[a] या यह कि मूर्ति कुछ है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि मूर्ति को चढ़ाई गई भेंट कुछ है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν φημι
  choice: तो फिर मैं क्या कह रहा हूँ?
  rationale: यह पौलुस के वर्तमानकालीन, प्रथम-पुरुष आलंकारिक प्रश्न को स्वाभाविक आधुनिक हिन्दी में रखता है और उसके तर्क की अगली कड़ी को ‘तो फिर’ से स्पष्ट करता है।
- source_word: ὅτι
  choice: क्या यह कि
  rationale: यह उन दो बातों का परिचय देता है जिन्हें पाठक पौलुस का आशय समझ सकता है; प्रश्नात्मक प्रसंग के कारण हिन्दी में ‘क्या यह कि’ स्वाभाविक है।
- source_word: εἰδωλόθυτόν
  choice: मूर्तियों को चढ़ाया गया भोजन
  rationale: यह शब्द मूर्तिपूजक बलि से जुड़े भोजन या मांस को सूचित करता है। ‘भोजन’ पूरे प्रसंग के अनुरूप व्यापक और सामान्य पाठक के लिए स्पष्ट है।
- source_word: τί ἐστιν
  choice: कुछ है
  rationale: संक्षिप्त अभिव्यक्ति अस्तित्व, वास्तविकता या महत्त्व के बीच यूनानी पाठ की जानबूझकर बनी अस्पष्टता को सुरक्षित रखती है; ‘महत्त्व रखता है’ जैसा अधिक व्याख्यात्मक अनुवाद मुख्य पाठ में नहीं डाला गया।
- source_word: ἢ
  choice: या
  rationale: दो समानांतर संभावित कथनों को सीधे जोड़ने वाला सामान्य विकल्प है।
- source_word: εἴδωλον
  choice: कोई मूर्ति
  rationale: प्रसंग में यह पूजा की मूर्ति को दर्शाता है। ‘कोई’ यूनानी अनिश्चित अर्थ और सामान्य कथन को हिन्दी में स्वाभाविक बनाता है।
theological_decisions:
- issue: क्या पौलुस मूर्तियों या मूर्तियों को चढ़ाए गए भोजन की किसी वास्तविक सत्ता अथवा आत्मिक महत्ता की पुष्टि कर रहा है
  choice: 'दोनों वाक्यांशों को आलंकारिक प्रश्न के रूप में रखा गया है: ‘भोजन कुछ है ... या ... मूर्ति कुछ है?’'
  alternative: ‘क्या मूर्तियों को चढ़ाए गए भोजन का कोई वास्तविक आत्मिक महत्त्व है, या किसी मूर्ति का वास्तविक अस्तित्व है?’
  rationale: मुख्य पाठ पौलुस के प्रश्न की संक्षिप्तता और धर्मवैचारिक तनाव को बनाए रखता है। वह यहाँ वास्तविक देवत्व या भोजन में अंतर्निहित आत्मिक शक्ति की पुष्टि नहीं कर रहा, पर यह स्पष्टीकरण अनुवाद में आरोपित करने के बजाय पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कुछ है’ हिन्दी में कुछ असामान्य होते हुए भी मूल की संक्षिप्त अस्पष्टता को जानबूझकर बचाता है; पादटिप्पणी वैकल्पिक अर्थ को स्पष्ट करती है।
