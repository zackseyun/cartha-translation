lexical_decisions:
- source_word: βλέπετε
  choice: ध्यान दो
  rationale: बहुवचन आज्ञार्थक यहाँ केवल देखने नहीं, बल्कि पौलुस के तर्क पर विचारपूर्वक ध्यान देने का आह्वान करता है।
- source_word: Ἰσραὴλ κατὰ σάρκα
  choice: शरीर के अनुसार इस्राएल
  rationale: मूल पौलुसी अभिव्यक्ति और उसकी वास्तविक अस्पष्टता बनाए रखता है; संदर्भ में आशय प्राकृतिक या वंशगत इस्राएल से है, न कि ‘पापी स्वभाव’ से।
- source_word: οἱ ἐσθίοντες τὰς θυσίας
  choice: बलिदानों को खानेवाले
  rationale: कृदंत और खाने की ठोस क्रिया को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: κοινωνοὶ
  choice: सहभागी
  rationale: बलिदान-संबंधी वास्तविक साझेदारी या सहभागिता का भाव देता है और आधुनिक धार्मिक हिन्दी में स्पष्ट है।
- source_word: τοῦ θυσιαστηρίου
  choice: वेदी के सहभागी
  rationale: सम्बन्धकारक को निकट रूप से बनाए रखता है; हिन्दी में यह वेदी से जुड़ी बलिदानी सहभागिता को व्यक्त करता है, यद्यपि ‘वेदी की सहभागिता में भागी’ अधिक व्याख्यात्मक विकल्प है।
- source_word: οὐχ ... εἰσίν;
  choice: क्या ... नहीं होते?
  rationale: οὐχ से आरम्भ प्रश्न अपेक्षित सकारात्मक उत्तर वाला आलंकारिक प्रश्न है; हिन्दी संरचना उसी बल को बनाए रखती है।
theological_decisions:
- issue: ‘शरीर के अनुसार इस्राएल’ का अर्थ
  choice: मूल अभिव्यक्ति को रखते हुए इसे प्राकृतिक या वंशगत इस्राएल का संकेत समझना
  alternative: ‘वंश के अनुसार इस्राएल’ या ‘भौतिक इस्राएल’
  rationale: यहाँ तुलना इस्राएल की बलिदानी प्रथा से है। शाब्दिक अभिव्यक्ति व्यापक इस्राएल-कलीसिया संबंधी सिद्धान्त को अनावश्यक रूप से तय किए बिना पौलुस के शब्दों का तनाव सुरक्षित रखती है।
- issue: वेदी के साथ सहभागिता का स्वरूप
  choice: ‘वेदी के सहभागी’
  alternative: ‘वेदी की सहभागिता में भागी’ या ‘वेदी से जुड़े सहभागी’
  rationale: κοινωνοί और सम्बन्धकारक वास्तविक धार्मिक सहभागिता दर्शाते हैं। अनुवाद इसे केवल प्रतीकात्मक निरीक्षण या सामाजिक साथ तक सीमित नहीं करता, पर सहभागिता की सटीक तात्त्विक प्रकृति भी नहीं ठहराता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘शरीर के अनुसार’ मूल की विशिष्ट पौलुसी भाषा को सुरक्षित रखता है; फुटनोट उसका संदर्भगत आशय स्पष्ट करता है। ‘खानेवाले’ को संयुक्त रूप में रखा गया है और आलंकारिक प्रश्न का स्वाभाविक हिन्दी क्रम अपनाया गया है।
