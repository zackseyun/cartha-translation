lexical_decisions:
- source_word: μηδεὶς
  choice: कोई ... न
  rationale: यह नकारात्मक अनिश्चित कर्ता, आज्ञार्थक क्रिया के साथ, सबके लिए सामान्य निषेध व्यक्त करता है। हिंदी में ‘कोई ... न’ इसे स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ζητείτω
  choice: खोजे
  rationale: ζητέω का मूल अर्थ ‘खोजना’ या ‘प्रयत्न करना’ है। ‘खोजे’ क्रिया की सरलता और व्यापक अर्थ-सीमा बनाए रखता है।
- source_word: τὸ ἑαυτοῦ
  choice: अपना ही भला
  rationale: यूनानी में नपुंसकलिंग पदबंध का आशय शाब्दिक रूप से ‘अपना’ या ‘जो अपना है’ है और संज्ञा लुप्त है। प्रसंग में ‘भला’ जोड़ने से दूसरे के लाभ की चिंता का नैतिक आशय स्पष्ट होता है; ‘ही’ आत्मकेंद्रित आग्रह के विरोध को स्वाभाविक हिंदी में उभारता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह अपने लाभ और दूसरे के लाभ के बीच स्पष्ट प्रतिकूल तुलना व्यक्त करता है। ‘बल्कि’ निषेध के बाद सुधारात्मक विरोध के लिए स्वाभाविक है।
- source_word: τὸ τοῦ ἑτέρου
  choice: दूसरे का भला
  rationale: यह भी संज्ञा-लोप वाला पदबंध है, जिसका शाब्दिक अर्थ ‘दूसरे का’ है। ‘दूसरे का भला’ प्रसंगगत अर्थ को स्पष्ट करता है और सामने किसी अन्य व्यक्ति की ओर संकेत बनाए रखता है।
theological_decisions:
- issue: τὸ ἑαυτοῦ / τὸ τοῦ ἑτέρου में निहित वस्तु को स्पष्ट करना
  choice: मुख्य पाठ में ‘अपना ही भला’ और ‘दूसरे का भला’
  alternative: ‘जो अपना है ... जो दूसरे का है’ अथवा ‘अपने हित ... दूसरे के हित’
  rationale: यूनानी मूल में वस्तु स्पष्ट रूप से कही नहीं गई है। 1 कुरिन्थियों 10:23-33 का प्रसंग अपने लाभ के बजाय दूसरे के लाभ और उद्धार की चिंता पर केंद्रित है। ‘भला’ नैतिक और व्यापक आशय व्यक्त करता है, जबकि पादटिप्पणी मूल की वास्तविक संक्षिप्तता और अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। ‘भला’ सामान्य पाठक के लिए सहज है और ‘हित’ की अपेक्षा कम प्रशासनिक सुनाई देता है।
