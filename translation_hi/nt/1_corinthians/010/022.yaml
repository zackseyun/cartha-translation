  text: Or are we provoking the Lord to jealousy? Surely we are not stronger than he is, are we?
translation:
  language: hi
  text: या क्या हम प्रभु को ईर्ष्या करने के लिए उकसा रहे हैं? हम उनसे अधिक शक्तिशाली तो नहीं हैं, क्या?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραζηλοῦμεν
  choice: ईर्ष्या दिला रहे हैं
  rationale: क्रिया का अर्थ किसी को ईर्ष्या या जलन के लिए उकसाना है; यह पद के वाचा-संबंधी और चेतावनीपूर्ण स्वर को बिना अतिरिक्त व्याख्या जोड़े बनाए रखता है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: κύριος का स्वाभाविक और संदर्भानुकूल हिन्दी रूप; यूनानी पाठ यहाँ नाम को स्पष्ट नहीं करता।
- source_word: ἰσχυρότεροι αὐτοῦ
  choice: उनसे अधिक शक्तिशाली
  rationale: तुलनात्मक विशेषण और αὐτοῦ के संबंध को सीधे व्यक्त करता है; आदरसूचक बहुवचन हिन्दी में प्रभु के लिए स्वाभाविक है।
theological_decisions:
- issue: प्रभु की ईर्ष्या का अर्थ
  choice: ईर्ष्या दिला रहे हैं
  alternative: प्रभु को क्रोध दिला रहे हैं
  rationale: मूल παραζηλόω विशेष रूप से ईर्ष्या जगाने की भाषा रखता है; इसे केवल क्रोध में बदलना मूल की वाचा-संबंधी प्रतिध्वनि को कम कर देगा।
- issue: दूसरे प्रश्न की अपेक्षित नकारात्मक प्रतिक्रिया
  choice: क्या हम उनसे अधिक शक्तिशाली हैं?
  alternative: निश्चय ही हम उनसे अधिक शक्तिशाली नहीं हैं, है न?
  rationale: यूनानी μή प्रश्न में अपेक्षित उत्तर ‘नहीं’ है, पर हिन्दी का सीधा आलंकारिक प्रश्न उसी आशय को स्वाभाविक ढंग से संप्रेषित करता है और मूल की संक्षिप्तता बनाए रखता है।
