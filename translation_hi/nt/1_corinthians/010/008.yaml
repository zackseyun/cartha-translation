  text: μηδὲ πορνεύωμεν, καθώς τινες αὐτῶν ἐπόρνευσαν, καὶ ἔπεσαν μιᾷ ἡμέρᾳ εἴκοσι τρεῖς χιλιάδες.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/008.yaml
  text: Nor should we commit sexual immorality[a], as some of them committed sexual immorality[b], and twenty-three thousand fell in one day.
translation:
  language: hi
  text: न ही हम यौन अनैतिकता करें, जैसा उनमें से कुछ ने यौन अनैतिकता की; और एक ही दिन में तेईस हज़ार[a] लोग गिर पड़े[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गिनती 25:9 में चौबीस हज़ार लोगों के मरने की बात है। यहाँ पौलुस कहता है कि ‘एक ही दिन में’ तेईस हज़ार गिरे। संभव है कि यह उस दिन मरनेवालों की संख्या को बड़ी कुल संख्या से अलग बताता हो; फिर भी अनुवाद दोनों संख्याओं में सामंजस्य बैठाए बिना पौलुस के शब्दों को सुरक्षित रखता है।
    reason: cross_reference
  - marker: b
    text: अर्थात् ‘मर गए’ या ‘मारे गए’; यूनानी में ‘गिर पड़े’ है, जो न्याय के अधीन मृत्यु का उल्लेख करने का एक प्रचलित ढंग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: और न
  rationale: यह निषेध को पिछले उपदेशों से जोड़ता है और हिन्दी में स्वाभाविक रूप से चेतावनियों की शृंखला को जारी रखता है।
- source_word: πορνεύωμεν / ἐπόρνευσαν
  choice: हम यौन अनैतिकता करें / उनमें से कुछ ने किया
  rationale: दोनों सजातीय यूनानी क्रियाओं की पुनरावृत्ति को हिन्दी में भी बनाए रखा गया है। ‘यौन अनैतिकता’ अर्थ को किसी एक विशेष प्रकार के अवैध यौन व्यवहार तक सीमित नहीं करती।
- source_word: καθώς
  choice: जैसा
  rationale: यह इस्राएल के कुछ लोगों के आचरण के साथ सीधी तुलना व्यक्त करता है।
- source_word: τινες αὐτῶν
  choice: उनमें से कुछ
  rationale: यह जंगल की पीढ़ी के कुछ लोगों को सहज और स्पष्ट हिन्दी में निर्दिष्ट करता है।
- source_word: ἔπεσαν
  choice: गिर पड़े
  rationale: यह πίπτω के प्रत्यक्ष बिंब को सुरक्षित रखता है; प्रसंग में इसका आशय न्याय के अधीन मृत्यु है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: μιᾷ ἡμέρᾳ
  choice: एक ही दिन में
  rationale: यह समय की सीमित अवधि और घटना की भयावह सघनता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἴκοσι τρεῖς χιλιάδες
  choice: तेईस हज़ार
  rationale: यूनानी पाठ की संख्या को बिना परिवर्तन या सामंजस्य के सीधे प्रस्तुत किया गया है।
theological_decisions:
- issue: गिनती 25:9 में दी गई संख्या से संबंध
  choice: मुख्य पाठ में पौलुस की संख्या ‘तेईस हज़ार’ को ज्यों का त्यों रखना
  alternative: इसे ‘चौबीस हज़ार’ करके गिनती 25:9 के साथ मिला देना, अथवा किसी सामंजस्यकारी व्याख्या को मुख्य पाठ में शामिल करना
  rationale: 1 कुरिन्थियों का यूनानी पाठ स्पष्ट रूप से ‘तेईस हज़ार’ कहता है। अनुवाद इस तनाव को मिटाने के बजाय पाठ की गवाही सुरक्षित रखता है; संभावित स्पष्टीकरण केवल पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गंभीर और उपदेशात्मक स्वर रखा गया है। ‘यौन अनैतिकता’ व्यापक यूनानी अर्थ को बनाए रखती है, जबकि ‘गिर पड़े’ मूल बिंब और उसके न्याय-संबंधी निहितार्थ को सुरक्षित रखता है।
