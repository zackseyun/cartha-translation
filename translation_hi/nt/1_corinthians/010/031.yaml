source:
  edition: SBLGNT
  text: Εἴτε οὖν ἐσθίετε εἴτε πίνετε εἴτε τι ποιεῖτε, πάντα εἰς δόξαν θεοῦ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/031.yaml
  text: Therefore, whether you eat or drink, or whatever you do, do everything for the glory of God.
translation:
  language: hi
  text: इसलिए चाहे तुम खाओ, चाहे पियो, या जो कुछ भी करो—सब कुछ परमेश्वर की महिमा के लिए करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴτε ... εἴτε ... εἴτε
  choice: चाहे ... चाहे ... या
  rationale: यह सहसंबंधी रचना वैकल्पिक स्थितियों को रखती है। हिन्दी में तीसरे, व्यापक पद से पहले ‘या’ स्वाभाविक है और यूनानी की क्रमिक संरचना को बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह शब्द पिछले विचार-विमर्श से निकले निष्कर्ष को सूचित करता है; ‘इसलिए’ उस तार्किक संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐσθίετε / πίνετε
  choice: तुम खाओ / पियो
  rationale: वर्तमानकालीन क्रियाएँ यहाँ सामान्य या प्रचलित कार्य बताती हैं। हिन्दी में इस उपदेशात्मक रचना में ‘खाओ’ और ‘पियो’ सहज हैं और मुख्य आज्ञा के साथ वाक्यगत सामंजस्य रखते हैं।
- source_word: τι ποιεῖτε
  choice: जो कुछ भी करो
  rationale: अनिश्चित τι इस कथन का दायरा खाने-पीने से आगे बढ़ाता है। ‘जो कुछ भी’ व्यापकता को वर्तमान हिन्दी में स्पष्ट करता है।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का अर्थ सर्वसमावेशी है; ‘सब कुछ’ आधुनिक हिन्दी में स्वाभाविक रूप से वही व्यापकता व्यक्त करता है।
- source_word: εἰς δόξαν θεοῦ
  choice: परमेश्वर की महिमा के लिए
  rationale: εἰς यहाँ लक्ष्य या उद्देश्य प्रकट करता है। ‘के लिए’ इस आशय को स्पष्ट रखता है, और ‘परमेश्वर की महिमा’ संबंधवाचक पदबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ποιεῖτε
  choice: करो
  rationale: अंतिम क्रिया आज्ञार्थक है और सभी कार्यों को समेटती है। ‘करो’ सीधा, गरिमापूर्ण और सामान्य पाठक के लिए सहज है।
theological_decisions:
- issue: पौलुस के उपदेश का दायरा
  choice: खाने-पीने सहित हर कार्य को परमेश्वर की महिमा की ओर निर्देशित करने वाला व्यापक नैतिक सिद्धांत
  alternative: केवल भोजन और पेय से जुड़े तत्काल विवाद तक सीमित निर्देश
  rationale: विशिष्ट उदाहरणों के बाद ‘जो कुछ भी’ और ‘सब कुछ’ का प्रयोग दायरे को व्यापक बनाता है, फिर भी यह सामान्य सिद्धांत तत्काल संदर्भ में भोजन-पेय के प्रश्न से ही निकलता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, वर्तमान और गरिमापूर्ण शैली। ‘परमेश्वर’ सामान्य बाइबिलीय प्रयोग के अनुरूप है। दीर्घ डैश विशिष्ट उदाहरणों से सर्वसमावेशी मुख्य आज्ञा की ओर मोड़ को स्पष्ट करता है।
