  text: ὅτι εἷς ἄρτος, ἓν σῶμα οἱ πολλοί ἐσμεν, οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/017.yaml
  text: Because there is one bread[a], we who are many are one body, for we all partake of the one bread.
translation:
  language: hi
  text: क्योंकि एक ही रोटी है[a], हम जो अनेक हैं एक देह हैं, क्योंकि हम सब उस एक ही रोटी में से भाग लेते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक पूरी रोटी”; दोनों स्थानों पर “रोटी” के लिए प्रयुक्त यूनानी शब्द एक पूरी रोटी को भी दर्शा सकता है। इससे अनेक लोगों के एक ही स्रोत में से भाग लेने का चित्र और स्पष्ट हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका कारणसूचक बल स्पष्ट रखता है।
- source_word: εἷς ἄρτος
  choice: रोटी एक ही है
  rationale: ἄρτος का अर्थ ‘रोटी’ या एक पूरी ‘लोई’ हो सकता है। ‘रोटी’ प्रसंग की भोजन और प्रभु-भोज संबंधी प्रतिध्वनि बनाए रखती है, जबकि ‘एक ही’ उसकी एकता पर बल देता है।
- source_word: ἓν σῶμα
  choice: एक देह
  rationale: σῶμα का सीधा और धार्मिक रूप से परिचित हिन्दी समतुल्य ‘देह’ है; यह सामुदायिक और प्रभु-भोज संबंधी अर्थ-सघनता को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: οἱ πολλοί ἐσμεν
  choice: हम, जो अनेक हैं, ... हैं
  rationale: यह अनेक विश्वासियों और उनकी एकता के बीच मूल विरोधाभास को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह दूसरे उपवाक्य को पहले कथन की व्याख्या या कारण के रूप में जोड़ता है।
- source_word: πάντες
  choice: हम सब
  rationale: पूरे समूह की साझी सहभागिता पर दिए गए बल को स्पष्ट करता है।
- source_word: ἐκ τοῦ ἑνὸς ἄρτου
  choice: उसी एक रोटी में
  rationale: μετέχω के साथ ἐκ साझे स्रोत अथवा उसमें से भाग लेने का भाव देता है। हिन्दी में ‘रोटी में सहभागी’ स्वाभाविक धार्मिक प्रयोग है और एक रोटी की केंद्रीयता बनाए रखता है।
- source_word: μετέχομεν
  choice: सहभागी होते हैं
  rationale: यह वास्तविक साझी भागीदारी का अर्थ देता है और केवल खाने की क्रिया तक सीमित किए बिना मूल की धार्मिक अर्थ-व्याप्ति बनाए रखता है।
theological_decisions:
- issue: एक रोटी और एक देह का संबंध
  choice: साझी रोटी में सहभागिता और विश्वासियों की एक देह होने के बीच पौलुस के संबंध को यथावत रखा गया है।
  alternative: इसे केवल प्रतीकात्मक एकता के रूप में पढ़ना, या रोटी द्वारा एकता उत्पन्न होने का अधिक विशिष्ट संस्कारवादी दावा करना।
  rationale: यूनानी पाठ दोनों बातों को निकटता से जोड़ता है, पर प्रभु-भोज की प्रकृति पर बाद के साम्प्रदायिक विवादों को स्वयं निर्णीत नहीं करता। अनुवाद उस संबंध और तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘एक देह’ और ‘सहभागी होते हैं’ जैसे परिचित बाइबिलीय पदों को बनाए रखते हुए वाक्य-विन्यास स्वाभाविक हिन्दी में रखा गया है।
