  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ πάντες τὸ αὐτὸ ⸂πνευματικὸν ἔπιον πόμα⸃, ἔπινον γὰρ ἐκ πνευματικῆς ἀκολουθούσης πέτρας, ἡ ⸂πέτρα δὲ⸃ ἦν ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/004.yaml
  text: and all drank the same spiritual drink[a], for they were drinking from a spiritual rock that followed them[b], and the rock was the Messiah.
translation:
  language: hi
  text: और सबने एक ही आत्मिक पेय पिया, क्योंकि वे एक आत्मिक चट्टान से पीते रहते थे, जो उनके पीछे-पीछे चलती रहती थी[a]; और वह चट्टान मसीह था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उनके साथ-साथ चलती थी।” यूनानी वर्तमान कृदन्त जारी संगति या अनुसरण का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द Χριστός का अर्थ “मसीह” या “अभिषिक्त जन” है। यहाँ यह उपाधि के रूप में प्रयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: πνευματικὸν ... πόμα
  choice: आत्मिक पेय
  rationale: यह पौलुस के ‘आत्मिक भोजन’ के समानांतर शब्द-विन्यास को बनाए रखता है और इसे केवल ‘अलौकिक’ या ‘प्रतीकात्मक’ अर्थ तक सीमित नहीं करता।
- source_word: ἔπιον
  choice: पिया
  rationale: अपूर्ण भूतकाल से भिन्न, यूनानी एओरिस्ट पूरी पीढ़ी के साझा अनुभव का संक्षिप्त कथन करता है; हिन्दी में सामान्य भूतकाल स्वाभाविक है।
- source_word: ἔπινον
  choice: पीते थे
  rationale: यूनानी इम्परफेक्ट जारी या बार-बार होने वाली क्रिया दर्शाता है; ‘पीते थे’ इस पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκ πνευματικῆς ἀκολουθούσης πέτρας
  choice: उस आत्मिक चट्टान से ... जो उनके साथ-साथ चलती थी
  rationale: ‘आत्मिक’ मूल शब्द की धर्मवैचारिक व्यापकता बचाता है। वर्तमान कृदन्त ἀκολουθούσης की जारी संगति ‘साथ-साथ चलती थी’ से प्रकट होती है। हिन्दी में पश्चवर्ती निश्चित पहचान के कारण ‘उस’ स्वाभाविक है, यद्यपि यूनानी पदबंध में चट्टान अनिश्चित है।
- source_word: πέτρα
  choice: चट्टान
  rationale: πέτρα बड़ी चट्टान या शैल को दर्शाता है, छोटे पत्थर को नहीं; ‘चट्टान’ बिंब और प्रतीकात्मक बल दोनों बनाए रखता है।
- source_word: ἡ πέτρα δὲ ἦν
  choice: और वह चट्टान ... था
  rationale: δέ यहाँ हल्का संयोजक है; ‘और’ व्याख्यात्मक प्रवाह बनाए रखता है। विधेय ‘मसीह’ के अनुसार हिन्दी में ‘था’ रखा गया है।
- source_word: ὁ Χριστός
  choice: मसीह
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘मसीह’ स्थापित और अर्थपूर्ण रूप है।
- source_word: πάντες τὸ αὐτὸ
  choice: सब ने एक ही
  rationale: यह पूरी पीढ़ी की समान सहभागिता पर पौलुस के जोर को सुरक्षित रखता है।
theological_decisions:
- issue: ‘चट्टान मसीह था’ का पहचान-वाक्य
  choice: 'सीधा पहचान-वाक्य बनाए रखा गया: ‘वह चट्टान मसीह था।’'
  alternative: ‘वह चट्टान मसीह का प्रतीक थी’ अथवा केवल किसी चमत्कारी चट्टान की ओर संकेत
  rationale: यूनानी में सीधा समतामूलक वाक्य है। ‘प्रतीक थी’ कहना पाठ की धर्मवैचारिक तीव्रता को व्याख्या द्वारा कम कर देता; अनुवाद को यह तनाव बनाए रखना चाहिए।
- issue: पेय और चट्टान के लिए ‘आत्मिक’
  choice: πνευματικός को दोनों स्थानों पर ‘आत्मिक’ रखा गया।
  alternative: ‘अलौकिक’ या ‘प्रतीकात्मक’
  rationale: मूल शब्द को बनाए रखने से ईश्वरीय प्रावधान, आत्मा के क्षेत्र और प्रतिरूपात्मक अर्थ की संभावनाएँ खुली रहती हैं; कोई एक व्याख्या थोपी नहीं जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आत्मिक पेय,’ ‘आत्मिक चट्टान’ और ‘मसीह’ जैसे स्थापित धर्मवैचारिक पद सुरक्षित हैं। मुख्य पाठ में गत्यात्मक भाव के लिए ‘साथ-साथ चलती थी’ चुना गया है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
