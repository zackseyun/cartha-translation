  text: πᾶν τὸ ἐν μακέλλῳ πωλούμενον ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/025.yaml
  text: Eat whatever is sold in the meat market[a], asking no questions for the sake of conscience,
translation:
  language: hi
  text: मांस-बाज़ार में जो कुछ बिकता है, उसे खाओ और विवेक के कारण कोई पूछताछ न करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶν τὸ ... πωλούμενον
  choice: जो कुछ बिकता है
  rationale: यह पदबंध व्यापक अर्थ में ‘वहाँ बिकने वाली हर वस्तु/जो कुछ बिकता है’ बताता है। ‘जो कुछ बिकता है’ स्वाभाविक हिन्दी में इसकी समावेशी शक्ति बनाए रखता है।
- source_word: ἐν μακέλλῳ
  choice: मांस-बाज़ार में
  rationale: μάκελλον सामान्य बाज़ार नहीं, विशेष रूप से मांस की बिक्री का स्थान बताता है; इसलिए ‘मांस-बाज़ार’ प्रसंग को स्पष्ट और सटीक रखता है।
- source_word: ἐσθίετε
  choice: उसे खाओ
  rationale: यह वर्तमानकालीन आज्ञार्थक क्रिया है। हिन्दी का सीधा आज्ञार्थक ‘खाओ’ उपयुक्त है; ‘उसे’ बिकने वाले मांस की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: μηδὲν ἀνακρίνοντες
  choice: कोई पूछताछ न करो
  rationale: ἀνακρίνω में जाँचने, छानबीन करने या पूछताछ करने का भाव है। यहाँ आशय मांस की पृष्ठभूमि के विषय में छानबीन न करने से है; ‘कोई पूछताछ न करो’ उस व्यावहारिक अर्थ को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: διὰ τὴν συνείδησιν
  choice: विवेक के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण अथवा प्रेरक आधार व्यक्त करता है। ‘विवेक के कारण’ यूनानी की संक्षिप्तता और इस पद में विवेक के अनिर्दिष्ट संबंध—किसका विवेक—दोनों को बनाए रखता है।
theological_decisions:
- issue: ‘विवेक’ का संदर्भ
  choice: केवल ‘विवेक’ कहा गया है; यह नहीं जोड़ा गया कि वह खाने वाले का है या किसी दूसरे का।
  alternative: ‘अपने विवेक के कारण’ अथवा ‘दूसरे व्यक्ति के विवेक के कारण’
  rationale: यूनानी पाठ में केवल τὴν συνείδησιν, अर्थात ‘विवेक’, है। इसी पद में उसके धारक की स्पष्ट पहचान नहीं की गई; इसलिए आगे के संदर्भ से पहले अस्पष्टता को सुलझाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध भाषा। ‘मांस-बाज़ार’ सटीक ठोस परिवेश देता है और ‘पूछताछ’ मांस की पृष्ठभूमि की जाँच का भाव स्वाभाविक ढंग से व्यक्त करता है।
