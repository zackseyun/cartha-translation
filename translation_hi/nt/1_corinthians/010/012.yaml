translation:
  language: hi
  text: इसलिए जो यह समझता है कि वह खड़ा है, वह सावधान रहे कि कहीं गिर न पड़े।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह संयोजक पिछले चेतावनीपूर्ण उदाहरणों से निष्कर्ष निकालता है; ‘इसलिए’ आधुनिक हिन्दी में उसके तार्किक बल को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ὁ δοκῶν
  choice: जो यह समझता है
  rationale: लेखयुक्त वर्तमान कृदन्त यहाँ संज्ञा के रूप में प्रयुक्त है। ‘जो यह समझता है’ उसके प्रतिनिधिक एकवचन और आत्म-आकलन के भाव को सहज हिन्दी में बनाए रखता है।
- source_word: ἑστάναι
  choice: कि वह खड़ा है
  rationale: ἵστημι का पूर्णकालिक infinitive खड़े होने की वर्तमान अवस्था बताता है। ‘खड़ा है’ मूल रूपक को सुरक्षित रखता है; ‘दृढ़ खड़ा है’ मूल से अतिरिक्त बल जोड़ सकता है।
- source_word: βλεπέτω
  choice: वह सावधान रहे
  rationale: वर्तमान आज्ञार्थक रूप निरन्तर सतर्कता की चेतावनी देता है। ‘सावधान रहे’ आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: μὴ πέσῃ
  choice: कि कहीं गिर न पड़े
  rationale: μή के साथ aorist subjunctive आज्ञा के बाद आशंकापूर्ण निषेध या चेतावनी व्यक्त करता है। ‘कि कहीं गिर न पड़े’ हिन्दी में इस चेतावनी के भाव और ‘गिरने’ के व्यापक रूपक दोनों को बनाए रखता है।
theological_decisions:
- issue: पौलुस की चेतावनी में ‘गिरने’ का स्वरूप
  choice: सामान्य चेतावनी ‘गिर न पड़े’ को बिना अधिक स्पष्टीकरण के रखा गया है।
  alternative: ‘पाप में न गिरे’, ‘दण्ड के अधीन न हो’, या ‘विश्वास से न गिर जाए’।
  rationale: निकटवर्ती प्रसंग इस्राएल की विफलताओं के आधार पर आत्मविश्वास के विरुद्ध चेताता है, पर πέσῃ स्वयं धर्मत्याग, नैतिक विफलता या न्याय में पड़ने में से किसी एक अर्थ को निश्चित नहीं करता। व्यापक शब्दावली मूल की धर्मवैज्ञानिक तनाव और अस्पष्टता को सुरक्षित रखती है।
- issue: प्रतिनिधिक पुल्लिंग एकवचन
  choice: ‘जो...वह’ के एकवचन रूप का प्रयोग।
  alternative: बहुवचन ‘जो लोग...वे’ या पूर्णतः लिंग-निरपेक्ष पुनर्गठन।
  rationale: यूनानी पाठ व्याकरण की दृष्टि से पुल्लिंग एकवचन है, पर प्रतिनिधिक सामान्य कथन के रूप में कार्य करता है। हिन्दी का ‘जो...वह’ स्वाभाविक ढंग से इस एकवचन संरचना को बनाए रखता है और अनावश्यक रूप से जैविक लिंग पर बल भी नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, चेतावनीपूर्ण और गरिमापूर्ण है। मूल का ‘खड़ा होना/गिरना’ रूपक जस का तस रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘इसलिए’ और ‘सो जो’ जैसे विकल्पों का अर्थान्तर हिन्दी पाठ में उल्लेखनीय नहीं है।
