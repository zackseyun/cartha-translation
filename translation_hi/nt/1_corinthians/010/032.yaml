id: 1CO.10.32
reference: 1 Corinthians 10:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπρόσκοποι ⸂καὶ Ἰουδαίοις γίνεσθε⸃ καὶ Ἕλλησιν καὶ τῇ ἐκκλησίᾳ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/032.yaml
  text: Give no offense either to Jews or to Greeks or to the church of God[b][a],
translation:
  language: hi
  text: यहूदियों, यूनानियों और परमेश्वर की कलीसिया—किसी के लिए भी ठोकर का कारण न बनो।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी को ठेस न पहुँचाओ” अथवा “ऐसे बनो कि कोई ठोकर न खाए।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “यूनानी” संभवतः पौलुस के परिवेश में व्यापक रूप से गैर-यहूदियों को सूचित करता है; मूल यूनानी पाठ में विशेष रूप से “यूनानी” ही है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀπρόσκοποι
  choice: ठोकर का कारण न बनो
  rationale: यह पद आसपास के प्रसंग में ऐसे आचरण की माँग करता है जिससे दूसरे ठोकर न खाएँ। यह स्वाभाविक हिन्दी में संबंधपरक और प्रेरणार्थक अर्थ व्यक्त करता है, जबकि केवल ‘निर्दोष’ कहना इस भाव को अस्पष्ट कर सकता है।
- source_word: γίνεσθε
  choice: बनो
  rationale: वर्तमानकालीन आज्ञार्थक रूप निरंतर आचरण के लिए आग्रह करता है। ‘बनो’ हिन्दी में इस आदेश को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἰουδαίοις
  choice: यहूदियों
  rationale: यहाँ यह शब्द यहूदी धार्मिक-जातीय समुदाय को सूचित करता है, न कि केवल यहूदिया प्रदेश के निवासियों को।
- source_word: Ἕλλησιν
  choice: यूनानियों
  rationale: मूल पाठ में स्पष्ट रूप से ‘यूनानी’ कहा गया है। पौलुस के परिवेश में इसका संकेत व्यापक रूप से गैर-यहूदियों की ओर हो सकता है, पर मुख्य पाठ में मूल पद को बनाए रखा गया है।
- source_word: ἐκκλησίᾳ τοῦ θεοῦ
  choice: परमेश्वर की कलीसिया
  rationale: पौलुस के प्रयोग में ἐκκλησία विश्वासियों के समुदाय को सूचित करती है। ‘परमेश्वर की कलीसिया’ हिन्दी बाइबलीय प्रयोग में स्थापित, सटीक और गरिमापूर्ण है।
theological_decisions:
- issue: पौलुस की नैतिक शिक्षा में संबोधित समूह
  choice: यहूदी, यूनानी और परमेश्वर की कलीसिया—तीनों को अलग-अलग उल्लिखित समूहों के रूप में रखा गया है।
  alternative: ‘यूनानियों’ को मुख्य पाठ में सामान्यीकृत करके ‘गैर-यहूदियों’ या ‘अन्यजातियों’ कहना।
  rationale: पद स्वयं तीन समूहों का स्पष्ट नाम लेता है। अनुवाद उन श्रेणियों को न विस्तृत करता है, न संकुचित, और इस आदेश को केवल मिशनरी रणनीति तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘कलीसिया’ स्थापित बाइबलीय शब्दावली के कारण रखा गया है। डैश तीनों समूहों को एक साथ ‘किसी के लिए भी’ से जोड़ता है और हिन्दी वाक्य को स्वाभाविक बनाता है।
