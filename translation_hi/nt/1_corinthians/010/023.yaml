  text: ⸀Πάντα ἔξεστιν· ἀλλ’ οὐ πάντα συμφέρει. ⸁πάντα ἔξεστιν· ἀλλ’ οὐ πάντα οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/023.yaml
  text: “All things are permitted,” but not all things are beneficial[a]. “All things are permitted,” but not all things build up.
translation:
  language: hi
  text: “सब कुछ करना अनुमत है,” लेकिन सब कुछ लाभदायक नहीं।[a] “सब कुछ करना अनुमत है,” लेकिन सब कुछ लोगों को दृढ़ नहीं करता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सब कुछ वैध है।” यूनानी अभिव्यक्ति का अर्थ ‘अनुमत’ या ‘वैध’ हो सकता है। उद्धरण-चिह्न यह संकेत देते हैं कि संभवतः यह कुरिन्थियों का एक कथन था, जिसे पौलुस सीमित कर रहे हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का संज्ञात्मक प्रयोग व्यापक और सर्वसमावेशी है; आधुनिक हिन्दी में ‘सब कुछ’ इसका स्वाभाविक और संक्षिप्त रूप है।
- source_word: ἔξεστιν
  choice: करने की अनुमति है
  rationale: यह क्रिया किसी बात के अनुमत या वैध होने को व्यक्त करती है। ‘करने की अनुमति है’ हिन्दी में स्पष्ट है और कथन के नारे-जैसे संक्षिप्त स्वर को बनाए रखता है।
- source_word: ἀλλ’
  choice: लेकिन
  rationale: सरल विरोधसूचक संबंध को वर्तमान, सहज हिन्दी में व्यक्त करता है।
- source_word: συμφέρει
  choice: लाभदायक
  rationale: यहाँ अर्थ है जो हितकर, उपयोगी या लाभ पहुँचाने वाला हो; ‘लाभदायक’ नैतिक संदर्भ में भी समझने योग्य है और केवल आर्थिक लाभ तक सीमित नहीं है।
- source_word: οἰκοδομεῖ
  choice: उन्नति करता
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘निर्माण करना’ है और पौलुस इसे प्रायः व्यक्ति या समुदाय को दृढ़ करने के रूपक में प्रयोग करता है। ‘उन्नति करता’ आधुनिक हिन्दी में उस सामुदायिक अर्थ को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: क्या Πάντα ἔξεστιν को कुरिन्थियों के उद्धृत नारे के रूप में चिह्नित किया जाए
  choice: 'दोनों बार उद्धरण-चिह्नों में: “सब कुछ करने की अनुमति है”'
  alternative: उद्धरण-चिह्नों के बिना इसे पौलुस का अपना कथन मानकर पढ़ना
  rationale: यूनानी पांडुलिपियों में आधुनिक उद्धरण-चिह्न नहीं थे, इसलिए यह विराम-चिह्न व्याख्यात्मक है। दोहराए गए वाक्य को कुरिन्थियों का संभावित नारा मानना प्रसंग के अनुकूल है, जिसे पौलुस हर बार सीमित करता है; पादटिप्पणी इस अनिश्चितता को स्पष्ट रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दो समानांतर वाक्यों की नारे-जैसी पुनरावृत्ति और पौलुस के विरोधसूचक उत्तर सुरक्षित हैं।
