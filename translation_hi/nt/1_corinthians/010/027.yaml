  text: ⸀εἴ τις καλεῖ ὑμᾶς τῶν ἀπίστων καὶ θέλετε πορεύεσθαι, πᾶν τὸ παρατιθέμενον ὑμῖν ἐσθίετε μηδὲν ἀνακρίνοντες διὰ τὴν συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/027.yaml
  text: If one of the unbelievers invites you and you want to go[a], eat whatever is set before you[b], asking no questions for the sake of conscience.
translation:
  language: hi
  text: यदि अविश्वासियों में से कोई तुम्हें भोजन पर बुलाए और तुम जाना चाहो, तो जो कुछ तुम्हारे सामने परोसा जाए, उसे खाओ और विवेक के कारण कोई पूछताछ न करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पूछताछ’ का अर्थ भोजन के स्रोत या उसकी पृष्ठभूमि की जाँच-पड़ताल करना भी हो सकता है। अगले पद में पौलुस स्पष्ट करता है कि वहाँ दूसरे व्यक्ति के विवेक की बात है, न कि तुम्हारे अपने विवेक की।
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἀπίστων
  choice: अविश्वासियों
  rationale: यह बहुवचन संज्ञात्मक प्रयोग मसीही विश्वास से बाहर के लोगों को सूचित करता है; ‘अविश्वासियों’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: καλεῖ
  choice: भोजन पर बुलाए
  rationale: भोज के प्रसंग में क्रिया का अर्थ केवल ‘बुलाना’ नहीं, बल्कि भोजन के लिए निमंत्रित करना है; ‘भोजन पर’ जोड़ने से निहित सामाजिक प्रसंग स्वाभाविक हिंदी में स्पष्ट होता है।
- source_word: θέλετε πορεύεσθαι
  choice: तुम जाना चाहो
  rationale: यह निमंत्रण स्वीकार करने की इच्छा या तत्परता व्यक्त करता है और शर्त की प्रकृति बनाए रखता है।
- source_word: πᾶν τὸ παρατιθέμενον ὑμῖν
  choice: जो कुछ तुम्हारे सामने परोसा जाए
  rationale: यह भोजन में सामने रखी जाने वाली हर वस्तु को व्यापक रूप से सूचित करता है; ‘जो कुछ’ हिंदी में स्वाभाविक है।
- source_word: ἐσθίετε
  choice: उसे खाओ
  rationale: वर्तमान आज्ञार्थक यहाँ सामान्य निर्देश देता है; साधारण हिंदी आज्ञा इसे पर्याप्त रूप से व्यक्त करती है।
- source_word: μηδὲν ἀνακρίνοντες
  choice: कोई पूछताछ न करो
  rationale: यहाँ आशय भोजन की पृष्ठभूमि या स्रोत की जाँच-पड़ताल न करने से है; ‘पूछताछ’ प्रश्न करने और छानबीन करने दोनों भावों को समेटती है।
- source_word: διὰ τὴν συνείδησιν
  choice: विवेक के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण या नैतिक विचार को व्यक्त करता है। ‘विवेक’ συνείδησις का प्रचलित, संक्षिप्त हिंदी प्रतिरूप है और यह नहीं तय करता कि किसका विवेक अभिप्रेत है।
theological_decisions:
- issue: इस प्रसंग में συνείδησις का आशय
  choice: मुख्य पाठ में ‘विवेक’ को सामान्य और अनिर्दिष्ट रखा गया है।
  alternative: इसे स्पष्ट रूप से विश्वासी का अपना विवेक या अगले पद में उल्लिखित दूसरे व्यक्ति का विवेक कहना।
  rationale: इस पद की भाषा संक्षिप्त है और अगला पद आगे स्पष्टीकरण देता है; इसलिए यहाँ उस अस्पष्टता को समय से पहले नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘भोजन पर बुलाए’ सामाजिक प्रसंग को स्पष्ट करता है; ‘विवेक’ जानबूझकर अनिर्दिष्ट रखा गया है।
