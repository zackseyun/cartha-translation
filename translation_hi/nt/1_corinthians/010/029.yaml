source:
  edition: SBLGNT
  text: συνείδησιν δὲ λέγω οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου· ἱνατί γὰρ ἡ ἐλευθερία μου κρίνεται ὑπὸ ἄλλης συνειδήσεως;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/029.yaml
  text: I mean the other person's conscience[a], not your own[b]. For why is my freedom judged by another conscience?
translation:
  language: hi
  text: मैं तुम्हारे अपने विवेक की नहीं, बल्कि दूसरे व्यक्ति के विवेक की बात कर रहा हूँ।[a] भला मेरी स्वतंत्रता दूसरे के विवेक द्वारा क्यों आँकी जाए?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “अपने विवेक की नहीं, बल्कि दूसरे के विवेक की।” यूनानी में ‘अपने’ का रूप संदर्भ के बिना तीसरे व्यक्ति की ओर भी संकेत कर सकता है; यहाँ संदर्भ में आशय “तुम्हारे अपने विवेक की नहीं” है।'
    reason: lexical_alternative
  - marker: b
    text: यह आलंकारिक प्रश्न पौलुस की अपनी चुनौती भी हो सकता है, या उनके द्वारा सामने रखी गई किसी आपत्ति का कथन भी; यूनानी पाठ में वक्ता-परिवर्तन स्पष्ट रूप से चिह्नित नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: συνείδησιν
  choice: विवेक
  rationale: यहाँ यह शब्द उस नैतिक चेतना को सूचित करता है जिसके द्वारा व्यक्ति किसी कार्य को उचित या अनुचित मानता है; आधुनिक हिन्दी में ‘विवेक’ इसका स्वाभाविक और संक्षिप्त रूप है।
- source_word: δὲ λέγω
  choice: मैं ... की बात कह रहा हूँ
  rationale: यह पद पिछले कथन का आशय स्पष्ट करता है। हिन्दी में यह अभिव्यक्ति स्पष्टीकरण का कार्य स्वाभाविक ढंग से करती है; δέ के लिए अलग ‘परन्तु’ आवश्यक नहीं है।
- source_word: οὐχὶ τὴν ἑαυτοῦ ἀλλὰ τὴν τοῦ ἑτέρου
  choice: तुम्हारे अपने विवेक की नहीं, बल्कि दूसरे व्यक्ति के विवेक की
  rationale: सन्दर्भ में सम्बोधित पाठक के विवेक और दूसरे व्यक्ति के विवेक का विरोध है। ‘तुम्हारे’ सन्दर्भगत अर्थ स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
- source_word: ἐλευθερία
  choice: स्वतंत्रता
  rationale: यह पौलुस की उस स्वतंत्रता को व्यक्त करता है जिसमें कोई कार्य अनुमत माना जा सकता है; ‘स्वतंत्रता’ आधुनिक और गरिमापूर्ण हिन्दी है।
- source_word: κρίνεται
  choice: न्याय ... किया जाए
  rationale: κρίνω का व्यापक अर्थ निर्णय या मूल्यांकन करना है। ‘न्याय किया जाए’ कर्मवाच्य और आलंकारिक प्रश्न को बनाए रखता है, बिना इसे अनिवार्य रूप से ‘दोषी ठहराना’ बनाने के।
- source_word: ὑπὸ ἄλλης συνειδήσεως
  choice: किसी दूसरे के विवेक से
  rationale: यह निर्णय करने वाले माध्यम या कर्ता को निकटता से व्यक्त करता है और हिन्दी में सहज है।
theological_decisions:
- issue: ἑαυτοῦ में स्वत्ववाचक सर्वनाम का सन्दर्भ
  choice: मुख्य पाठ में ‘तुम्हारे अपने विवेक’
  alternative: ‘उसके अपने विवेक’
  rationale: यूनानी रूप तीसरे पुरुष का है, पर निकटवर्ती सन्दर्भ में पौलुस पाठकों को सम्बोधित करते हुए उनके विवेक और दूसरे व्यक्ति के विवेक में भेद स्पष्ट करता है। अधिक शाब्दिक सम्भावना पादटिप्पणी में दी गई है।
- issue: दूसरे वाक्य के आलंकारिक प्रश्न का वक्ता और आशय
  choice: वक्ता-परिवर्तन बताए बिना आलंकारिक प्रश्न के रूप में रखना
  alternative: इसे कुरिन्थियों की आपत्ति के रूप में उद्धृत करना
  rationale: यूनानी पाठ में उद्धरण-चिह्न या स्पष्ट वक्ता-परिवर्तन नहीं है। अतः अनुवाद अस्पष्टता बनाए रखता है और यह तय नहीं करता कि प्रश्न पौलुस की अपनी चुनौती है या उनके द्वारा प्रस्तुत आपत्ति।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘भला ... क्यों’ आलंकारिक बल को स्वाभाविक हिन्दी में व्यक्त करता है। ‘विवेक’ पूरे पद में एकरूप रखा गया है।
