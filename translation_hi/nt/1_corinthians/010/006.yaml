id: 1CO.10.6
reference: 1 Corinthians 10:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ταῦτα δὲ τύποι ἡμῶν ἐγενήθησαν, εἰς τὸ μὴ εἶναι ἡμᾶς ἐπιθυμητὰς κακῶν, καθὼς κἀκεῖνοι ἐπεθύμησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/006.yaml
  text: These things became examples for us[a], so that we might not be people who desire evil things, just as they also desired them.
translation:
  language: hi
  text: ये घटनाएँ हमारे लिए उदाहरण बनीं[a], ताकि हम बुरी बातों की लालसा करनेवाले न हों, जैसे उन लोगों ने भी लालसा की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे लिए प्रतिरूप” अथवा “हमारे लिए नमूने।”
    reason: मूल यूनानी शब्द τύποι का अर्थ संदर्भ के अनुसार उदाहरण, प्रतिरूप या नमूने हो सकता है।
lexical_decisions:
- source_word: Ταῦτα
  choice: ये घटनाएँ
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पद पिछले प्रसंग में वर्णित जंगल की घटनाओं की ओर संकेत करता है। हिन्दी में ‘ये घटनाएँ’ संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: δὲ
  choice: अलग शब्द के रूप में व्यक्त नहीं
  rationale: यहाँ δὲ प्रसंग को आगे बढ़ाने वाला हल्का संक्रमण-सूचक है। हिन्दी में नए वाक्य और स्वाभाविक प्रवाह से इसका कार्य पूरा होता है; ‘परन्तु’ अनावश्यक रूप से तीखा विरोध और ‘अब’ अस्रोत समय-सूचक भाव जोड़ सकता है।
- source_word: τύποι
  choice: उदाहरण
  rationale: इस चेतावनीपरक संदर्भ में शब्द पिछली घटनाओं को शिक्षा देने वाले उदाहरणों या नमूनों के रूप में प्रस्तुत करता है। ‘उदाहरण’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘प्रतिरूप’ अधिक तकनीकी लग सकता है; विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: ἡμῶν
  choice: हमारे लिए
  rationale: τύποι के साथ संबंधवाचक रूप का आशय मसीही समुदाय के लिए इन घटनाओं की प्रासंगिकता है; ‘हमारे लिए’ स्वाभाविक हिन्दी है।
- source_word: ἐγενήθησαν
  choice: बनीं
  rationale: γίνομαι यहाँ किसी भूमिका या रूप में आ जाने का भाव देता है। ‘बनीं’ साधारण ‘थीं’ की तुलना में इस भाव को बनाए रखता है।
- source_word: εἰς τὸ μὴ εἶναι
  choice: ताकि … न हों
  rationale: यह रचना उद्देश्य अथवा अपेक्षित परिणाम व्यक्त करती है। ‘ताकि … न हों’ दोनों के बीच की संभावित अर्थ-छाया को बिना अनावश्यक रूप से सीमित किए सहज हिन्दी देती है।
- source_word: ἐπιθυμητὰς
  choice: लालसा करनेवाले
  rationale: यह संज्ञात्मक प्रयोग उन लोगों को बताता है जो किसी वस्तु की प्रबल इच्छा रखते हैं। ‘लालसा करनेवाले’ उसकी नैतिक गंभीरता और व्यक्ति-वाचक रूप दोनों को बनाए रखता है।
- source_word: κακῶν
  choice: बुरी बातों की
  rationale: बहुवचन रूप लालसा की बुरी वस्तुओं को सूचित करता है। ‘बुरी बातों’ का प्रयोग व्यापक है और इसे केवल किसी एक प्रकार के पाप तक सीमित नहीं करता।
- source_word: καθὼς κἀκεῖνοι
  choice: जैसे उन लोगों ने भी
  rationale: ‘जैसे’ तुलना और ‘भी’ καί का योगात्मक बल व्यक्त करता है; ‘उन लोगों’ से जंगल की पिछली पीढ़ी की ओर संकेत स्पष्ट रहता है।
- source_word: ἐπεθύμησαν
  choice: लालसा की थी
  rationale: यह अनुवाद पहले आए ‘लालसा करनेवाले’ से मूल की शब्दगत पुनरावृत्ति बनाए रखता है। हिन्दी में कर्म को फिर न दोहराने पर भी वह ‘बुरी बातों’ से स्पष्ट समझा जाता है।
theological_decisions:
- issue: इस्राएल की जंगल की घटनाओं के संबंध में τύποι का अर्थ
  choice: नैतिक चेतावनी देने वाले ‘उदाहरण’
  alternative: ‘प्रतिरूप’ या ‘नमूने’
  rationale: निकटवर्ती संदर्भ समुदाय को पिछली पीढ़ी की बुरी लालसाओं से सावधान करता है। ‘उदाहरण’ इस शिक्षाप्रद बल को स्पष्ट रखता है, पर मूल शब्द की व्यापक प्रतिरूपात्मक संभावना को पादटिप्पणी में सुरक्षित किया गया है।
- issue: ἐπιθυμία से जुड़े शब्दों की तीव्रता और दायरा
  choice: ‘लालसा’
  alternative: ‘इच्छा’ या ‘वासना’
  rationale: ‘लालसा’ प्रबल और नैतिक रूप से दूषित चाह को व्यक्त करती है, लेकिन ‘वासना’ की तरह अर्थ को मुख्यतः यौन इच्छा तक सीमित नहीं करती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘बुरी बातों की लालसा करनेवाले’ मूल के व्यक्ति-वाचक संज्ञात्मक रूप को बनाए रखता है, और अंतिम उपवाक्य में ‘लालसा’ की पुनरावृत्ति यूनानी शब्द-संबंध को सुनाई देती है।
