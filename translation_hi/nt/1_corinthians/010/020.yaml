  text: ἀλλ’ ὅτι ἃ ⸀θύουσιν, δαιμονίοις ⸂καὶ οὐ θεῷ θύουσιν⸃, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/020.yaml
  text: No[a], but what they sacrifice, they sacrifice to demons and not to God, and I do not want you to become sharers with demons.
translation:
  language: hi
  text: नहीं, बल्कि जो कुछ वे बलि चढ़ाते हैं, उसे वे दुष्टात्माओं को चढ़ाते हैं, परमेश्वर को नहीं; और मैं नहीं चाहता कि तुम दुष्टात्माओं के साझीदार[a] बनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दुष्टात्माओं के सहभागी” अथवा “दुष्टात्माओं के साथ भाग लेनेवाले।”
    reason: κοινωνός में साझेदारी, सहभागिता और साथ भाग लेने के परस्पर जुड़े अर्थ हैं।
lexical_decisions:
- source_word: ἀλλ’ ὅτι
  choice: नहीं, बल्कि
  rationale: पिछले पद से उत्पन्न संभावित गलत समझ को सुधारने वाले विरोधात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἃ θύουσιν
  choice: वे जो कुछ बलि चढ़ाते हैं
  rationale: नपुंसकलिंग सम्बन्धवाचक सर्वनाम और बलिदान-संबंधी क्रिया के सामान्य अर्थ को बिना अनावश्यक विशिष्टता के सुरक्षित रखता है।
- source_word: δαιμονίοις
  choice: दुष्टात्माओं को
  rationale: नए नियम के प्रसंग में δαιμόνιον दुष्ट आत्मिक प्राणियों को सूचित करता है; यह किसी तटस्थ गौण देवता का संकेत नहीं है।
- source_word: καὶ οὐ θεῷ
  choice: परमेश्वर को नहीं
  rationale: यह दुष्टात्माओं और एकमात्र सच्चे परमेश्वर के बीच पौलुस के स्पष्ट विरोध को व्यक्त करता है।
- source_word: κοινωνοὺς
  choice: साझीदार
  rationale: यह वास्तविक सहभागिता और संबंध, दोनों का भाव देता है तथा केवल सामाजिक मेल-जोल या पूर्ण निष्ठा का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: τῶν δαιμονίων
  choice: दुष्टात्माओं के
  rationale: κοινωνός के साथ आए सम्बन्धकारक को स्वाभाविक हिन्दी में साझेदारी के संबंध के रूप में व्यक्त किया गया है।
- source_word: γίνεσθαι
  choice: बनो
  rationale: यह किसी अवस्था में प्रवेश करने की चेतावनी को सुरक्षित रखता है, न कि केवल उस अवस्था में होने को।
theological_decisions:
- issue: गैर-यहूदी बलिदानी उपासना का स्वरूप
  choice: बलियाँ दुष्टात्माओं को चढ़ाई जाती हैं, परमेश्वर को नहीं
  alternative: यह केवल मूर्तिभोज के सामाजिक अर्थ के विषय में आलंकारिक कथन है
  rationale: पद का स्पष्ट विरोध बिना नरम किए रखा गया है और उसके आगे कोई अनुमान नहीं जोड़ा गया।
- issue: κοινωνοὺς τῶν δαιμονίων का बल
  choice: दुष्टात्माओं के साथ वास्तविक सहभागिता या साझेदारी
  alternative: केवल मूर्तिपूजकों से सामाजिक संगति, अथवा दुष्टात्माओं के प्रति पूर्ण उपासना-निष्ठा
  rationale: आस-पास के पदों में κοινωνία वास्तविक सहभागिता को दर्शाता है; ‘साझीदार’ उस गंभीरता को बनाए रखता है, पर उसे पूर्ण निष्ठा तक नहीं बढ़ाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘बलि चढ़ाना,’ ‘दुष्टात्मा,’ और ‘परमेश्वर’ परिचित धार्मिक शब्द हैं; वाक्य-क्रम मूल के विरोधात्मक बल को बनाए रखता है।
