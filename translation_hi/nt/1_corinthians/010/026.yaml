translation:
  language: hi
  text: क्योंकि “पृथ्वी प्रभु की है, और उसमें जो कुछ है वह सब भी प्रभु का है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'भजन 24:1 से उद्धृत। शाब्दिक रूप में: “और उसकी भरपूरी।”'
    reason: cross_reference
lexical_decisions:
- source_word: κυρίου
  choice: प्रभु की
  rationale: संबंधकारक τοῦ κυρίου स्वामित्व प्रकट करता है; हिंदी में “प्रभु की” स्वाभाविक है और भजन-संदर्भ की धार्मिक गरिमा बनाए रखता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का शास्त्रीय आधार प्रस्तुत करता है; “क्योंकि” इस कारणसूचक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: γῆ
  choice: पृथ्वी
  rationale: भजन 24:1 के व्यापक संदर्भ में γῆ का अर्थ किसी सीमित भूभाग के बजाय समस्त पृथ्वी है।
- source_word: πλήρωμα
  choice: जो कुछ उसमें है
  rationale: τὸ πλήρωμα αὐτῆς का आशय पृथ्वी की सारी सामग्री या उसमें विद्यमान सब कुछ है। यह रूप आधुनिक हिंदी में “परिपूर्णता” की अपेक्षा अधिक स्पष्ट है, फिर भी मूल का समावेशी अर्थ सुरक्षित रखता है।
- source_word: αὐτῆς
  choice: उसमें
  rationale: स्त्रीलिंग सर्वनाम αὐτῆς का पूर्वपद γῆ है; हिंदी में इस आशय को “उसमें” द्वारा स्वाभाविक ढंग से व्यक्त किया गया है।
theological_decisions:
- issue: शास्त्रीय उद्धरण में κύριος का धार्मिक रूप से भारयुक्त अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: पौलुस के यूनानी पाठ में κύριος है। “प्रभु” नए नियम के प्रयोग और भजन के उद्धरण—दोनों को सुरक्षित रखता है, जबकि “यहोवा” सीधे यूनानी पाठ से अधिक विशिष्ट होगा और “स्वामी” यहाँ अपेक्षित धार्मिक अर्थ को पर्याप्त रूप से व्यक्त नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। उद्धरण-चिह्न शास्त्र-उद्धरण को स्पष्ट करते हैं; “जो कुछ उसमें है” πλήρωμα के अर्थ को सामान्य पाठक के लिए स्वाभाविक बनाता है।
