  text: I speak as to sensible people[b][a]; judge for yourselves what I say.
translation:
  language: hi
  text: मैं समझदार लोगों से कह रहा हूँ; जो मैं कहता हूँ, उसका निर्णय तुम स्वयं करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς φρονίμοις
  choice: समझदार लोगों से
  rationale: यह पदबंध श्रोताओं को व्यावहारिक समझ और विवेक रखने वाले मानकर संबोधित करता है। ‘समझदार’ आधुनिक हिन्दी में स्वाभाविक है और ‘बुद्धिमान’ की अपेक्षा अधिक संयत ढंग से φρόνιμος का भाव व्यक्त करता है।
- source_word: λέγω
  choice: मैं ... कह रहा हूँ
  rationale: वर्तमान संदर्भ में पौलुस के सीधे संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κρίνατε
  choice: निर्णय ... करो
  rationale: आज्ञार्थक क्रिया श्रोताओं से कही गई बात का मूल्यांकन करने को कहती है। ‘निर्णय करो’ न्यायिक अर्थ को अनावश्यक रूप से उभारने के बजाय यहाँ अपेक्षित विवेकपूर्ण परख को व्यक्त करता है।
- source_word: ὑμεῖς
  choice: तुम स्वयं
  rationale: मूल में व्यक्त सर्वनाम पर बल है; ‘तुम स्वयं’ उसी बल को स्पष्ट रूप से बनाए रखता है।
- source_word: ὅ φημι
  choice: जो मैं कहता हूँ
  rationale: सापेक्ष पदबंध का सीधा, स्वाभाविक और अर्थनिष्ठ हिन्दी रूप।
theological_decisions:
- issue: श्रोताओं का आलंकारिक वर्णन
  choice: पौलुस कुरिन्थियों को विवेकपूर्ण निर्णय करने में सक्षम मानकर संबोधित करता है, पर उनके समस्त आचरण को अनुमोदित नहीं ठहराता।
  alternative: इसे व्यंग्यपूर्ण संबोधन या उनकी बुद्धिमत्ता की पूर्ण और सीधी प्रशंसा माना जा सकता है।
  rationale: मूल पाठ स्वयं यह तय नहीं करता कि संबोधन में व्यंग्य है या पूर्ण प्रशंसा। ‘समझदार लोगों’ का भाव रखते हुए अनुवाद इस तनाव को अनावश्यक रूप से हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्यक्रम हिन्दी की स्वाभाविकता के अनुसार है, जबकि मूल के जोरदार ὑμεῖς को ‘तुम स्वयं’ से सुरक्षित रखा गया है।
