base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/033.yaml
  text: just as I also please everyone in everything[a], not seeking my own advantage but that of the many[b], so that they may be saved.
translation:
  language: hi
  text: ठीक वैसे ही मैं भी सब बातों में सबको प्रसन्न करता हूँ[a]—अपना लाभ नहीं, बल्कि बहुतों का लाभ चाहता हूँ[b], ताकि वे उद्धार पाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “सबके लिए सब बातों में अनुकूल होता हूँ।” यूनानी में अधिक शाब्दिक रूप से “सब बातों में सबको” है; इसका भाव दूसरों के भले के लिए व्यापक रूप से अनुकूल होना है।
    reason: lexical_alternative
  - marker: b
    text: अथवा, “अपने हित की नहीं ... बहुतों के हित की खोज करता हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς κἀγὼ
  choice: ठीक वैसे ही मैं भी
  rationale: καθὼς तुलना को और κἀγὼ पौलुस के अपने उदाहरण को सामने रखता है; यह हिन्दी में स्वाभाविक रूप से पिछले उपदेश से संबंध जोड़ता है।
- source_word: πάντα πᾶσιν
  choice: सब बातों में सबको
  rationale: यूनानी के व्यापक किंतु संक्षिप्त वाक्यांश को सीधे रखता है और 9:22 की अलग शब्दावली को यहाँ आयात नहीं करता।
- source_word: ἀρέσκω
  choice: प्रसन्न करने का प्रयत्न करता हूँ
  rationale: केवल 'प्रसन्न करता हूँ' हिन्दी में सफलता का अनावश्यक निश्चित भाव दे सकता है; यह चयन दूसरों के हित के लिए अनुकूल होने का संदर्भगत आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μὴ ζητῶν
  choice: अपना लाभ नहीं ... चाहता हूँ
  rationale: वर्तमान कृदन्त पौलुस के आचरण की प्रेरणा और रीति बताता है; हिन्दी में मुख्य क्रिया से जुड़ी यह रचना स्पष्ट और प्रवाहपूर्ण है।
- source_word: τὸ ἐμαυτοῦ σύμφορον
  choice: अपना लाभ
  rationale: σύμφορον उस बात को सूचित करता है जो लाभकारी या हितकर हो; 'लाभ' संक्षिप्त है और अगले समानांतर वाक्यांश से मेल खाता है।
- source_word: ἀλλὰ τὸ τῶν πολλῶν
  choice: बल्कि बहुतों का लाभ
  rationale: मूल की दीर्घवृत्तीय समानांतर रचना को हिन्दी में आवश्यक संज्ञा दोहराकर स्पष्ट किया गया है; οἱ πολλοί की व्यापकता 'बहुतों' से बनी रहती है।
- source_word: ἵνα σωθῶσιν
  choice: ताकि वे उद्धार पाएँ
  rationale: ἵνα उद्देश्य और σωθῶσιν उद्धार के निष्क्रिय भाव को व्यक्त करता है; यह परमेश्वर की एजेंसी को अनावश्यक रूप से निर्दिष्ट किए बिना पौलुस के सामान्य उद्धार-संबंधी अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: σωθῶσιν का अर्थ और दायरा
  choice: '''वे उद्धार पाएँ''—पौलुस के सामान्य उद्धार-संबंधी अर्थ में'
  alternative: '''वे बचाए जाएँ'' या ''वे सुरक्षित रहें'''
  rationale: सुसमाचार और दूसरों के अंतिम हित का प्रसंग उद्धार-संबंधी अर्थ का समर्थन करता है। अनुवाद निष्क्रिय भाव बनाए रखता है और कर्ता को मूल से अधिक स्पष्ट नहीं करता।
- issue: दूसरों को 'प्रसन्न करने' का आशय
  choice: उनके हित और उद्धार के लिए अपने व्यवहार को उनके अनुकूल करना
  alternative: मनुष्यों की स्वीकृति पाने के लिए समझौता करना
  rationale: तुरंत बाद आने वाला विरोध—अपना लाभ नहीं, बल्कि बहुतों का लाभ—ἀρέσκω के आशय को नियंत्रित करता है और चापलूसी या सिद्धान्तहीन जन-प्रसन्नता की व्याख्या को रोकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठक के लिए सहज। 'उद्धार पाएँ' बाइबिलीय गरिमा और निष्क्रिय भाव बनाए रखता है। पद को पिछले संदर्भ से जोड़ने के लिए 'ठीक वैसे ही' रखा गया है; पादटिप्पणियाँ वास्तविक शाब्दिक विकल्प स्पष्ट करती हैं।
