  text: ἐὰν δέ τις ὑμῖν εἴπῃ· Τοῦτο ⸀ἱερόθυτόν ἐστιν, μὴ ἐσθίετε δι’ ἐκεῖνον τὸν μηνύσαντα καὶ τὴν ⸀συνείδησιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/028.yaml
  text: But if someone says to you, “This has been offered in sacrifice,” do not eat it, for the sake of the one who informed you and for conscience’ sake.
translation:
  language: hi
  text: पर यदि कोई तुमसे कहे, “यह बलि में चढ़ाया गया है,”[a] तो उसे मत खाना—उस व्यक्ति के कारण जिसने यह बताया है, और विवेक के कारण।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह बलि का मांस है।” यूनानी विशेषण बलि में चढ़ाई गई किसी वस्तु को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात उस दूसरे व्यक्ति के विवेक के कारण, तुम्हारे अपने विवेक के कारण नहीं; अगला पद देखें।
    reason: cross_reference
lexical_decisions:
- source_word: ἐὰν δέ τις ὑμῖν εἴπῃ
  choice: लेकिन यदि कोई तुमसे कहे
  rationale: ἐὰν के साथ aorist subjunctive एक संभावित परिस्थिति प्रस्तुत करता है; τις का स्वाभाविक हिन्दी रूप ‘कोई’ है। δέ पिछले कथन से विरोध सूचित करता है, इसलिए ‘लेकिन’ रखा गया है।
- source_word: Τοῦτο ἱερόθυτόν ἐστιν
  choice: यह बलि में चढ़ाया गया है
  rationale: ἱερόθυτος बलि में अर्पित वस्तु को दर्शाता है। यह रूप मूल पद में निहित बलि-संबंध को स्पष्ट रखता है, पर ‘मूर्ति’ नहीं जोड़ता, क्योंकि वह इस विशेष शब्द में प्रत्यक्ष नहीं है।
- source_word: μὴ ἐσθίετε
  choice: उसे मत खाना
  rationale: μή के साथ वर्तमान आज्ञार्थक निषेध व्यक्त करता है। प्रसंग में उल्लिखित भोजन के लिए हिन्दी में ‘उसे’ स्वाभाविक रूप से जोड़ा गया है।
- source_word: δι’ ἐκεῖνον τὸν μηνύσαντα
  choice: उस बतानेवाले के कारण
  rationale: διά के साथ कर्मकारक यहाँ उस व्यक्ति के प्रति विचार या उसके कारण को व्यक्त करता है। μηνύσαντα का अर्थ सूचना देने या बतानेवाला है; ‘बतानेवाला’ सहज और अर्थनिष्ठ है।
- source_word: καὶ τὴν συνείδησιν
  choice: और विवेक के कारण
  rationale: συνείδησις का सामान्य और प्रतिष्ठित हिन्दी रूप ‘विवेक’ है। यूनानी वाक्यांश संक्षिप्त है; ‘के कारण’ पहले διά-वाक्यांश के प्रभाव को समन्वित पद तक पहुँचाता है।
theological_decisions:
- issue: τὴν συνείδησιν में किसका विवेक अभिप्रेत है
  choice: मुख्य पाठ में केवल ‘विवेक’ रखा गया है; पादटिप्पणी में इसे बतानेवाले दूसरे व्यक्ति का विवेक स्पष्ट किया गया है।
  alternative: मुख्य पाठ में ‘उसके विवेक के कारण’ लिखना, अथवा इसे खानेवाले का अपना विवेक मानना।
  rationale: अगला पद स्पष्ट करता है कि पौलुस खानेवाले के अपने विवेक की नहीं, दूसरे व्यक्ति के विवेक की बात कर रहा है। फिर भी इस पद की संक्षिप्त अभिव्यक्ति और पौलुस के तर्क का क्रम बनाए रखने के लिए स्पष्टीकरण पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। एकवचन ὑμῖν को प्रसंगानुकूल सामान्य सम्बोधन ‘तुमसे’ से व्यक्त किया गया है। ‘मूर्ति को चढ़ाया गया’ मुख्य पाठ में नहीं जोड़ा गया, ताकि ἱερόθυτος के बलि-संबंधी अर्थ से आगे व्याख्या न थोपी जाए।
