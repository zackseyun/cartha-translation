  revision_rationale: The revision improves lexical and idiomatic precision without altering the source’s parallelism or categorical incompatibility. Repeated ‘दोनों में’ makes explicit in Hindi that the prohibition concerns participation in both spheres, not the inability to drink from either cup independently.
