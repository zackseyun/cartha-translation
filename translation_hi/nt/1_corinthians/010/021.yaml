  verdict: revise
  source_fidelity: The two parallel prohibitions and their categorical force are retained. ‘प्याला’ is a more natural Hindi equivalent for ποτήριον in this ritual and metaphorical context than ‘कटोरा’; ‘दुष्टात्माओं’ adequately renders δαιμονίων without interpretive expansion.
  naturalness: The draft’s ‘मेज़ ... में सहभागी’ is understandable but somewhat calqued. The revision uses ‘... की मेज़ में सहभागी’ with ‘दोनों में’ to make the coordinated participation clear. ‘प्याले में से पीना’ is idiomatic Hindi while preserving the source’s cup imagery.
  terminology: ‘प्रभु,’ ‘प्याला,’ ‘दुष्टात्माएँ,’ ‘मेज़,’ and ‘सहभागी’ maintain an appropriately formal, modern biblical register. The footnote alternative is revised because ‘मेज़ ... से भाग लेना’ is not idiomatic Hindi.
  issues:
  - severity: medium
    issue: ‘कटोरा’ is less natural than ‘प्याला’ for ποτήριον in this context.
    rationale: A कटोरा is ordinarily a bowl, whereas प्याला is the standard drinking vessel and preserves the verse’s established ritual/metaphorical force.
  - severity: medium
    issue: The footnote’s ‘मेज़ ... से भाग नहीं ले सकते’ is idiomatically awkward.
    rationale: Hindi normally expresses participation with ‘में भाग लेना’ or ‘में सहभागी होना’; the alternative has been made grammatical and genuinely lexical.
  revised_text: तुम प्रभु के प्याले और दुष्टात्माओं के प्याले में से—दोनों में से—नहीं पी सकते; तुम प्रभु की मेज़ और दुष्टात्माओं की मेज़ में—दोनों में—सहभागी नहीं हो सकते।[a]
