id: 1CO.10.21
reference: 1 Corinthians 10:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ δύνασθε ποτήριον κυρίου πίνειν καὶ ποτήριον δαιμονίων· οὐ δύνασθε τραπέζης κυρίου μετέχειν καὶ τραπέζης δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/021.yaml
  text: You cannot drink the cup of the Lord and the cup of demons[a]; you cannot partake of the table of the Lord and the table of demons.
translation:
  language: hi
  text: तुम प्रभु के प्याले और दुष्टात्माओं के प्याले में से—दोनों में से—नहीं पी सकते; तुम प्रभु की मेज़ और दुष्टात्माओं की मेज़ में—दोनों में—सहभागी नहीं हो सकते।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम प्रभु की मेज़ और दुष्टात्माओं की मेज़ में—दोनों में—भाग नहीं ले सकते।”
    reason: μετέχειν के लिए ‘सहभागी होना’ के स्थान पर ‘भाग लेना’ एक स्वाभाविक हिन्दी विकल्प है।
lexical_decisions:
- source_word: οὐ δύνασθε
  choice: तुम ... नहीं सकते
  rationale: यह वर्तमान असमर्थता अथवा पूर्ण असंगति को सीधे और स्वाभाविक ढंग से व्यक्त करता है। दोनों खंडों में इसकी पुनरावृत्ति यूनानी पाठ की निर्णायक समानांतरता बनाए रखती है।
- source_word: ποτήριον
  choice: कटोरा
  rationale: ‘कटोरा’ ποτήριον का प्रचलित और सहज हिन्दी पर्याय है तथा इस प्रसंग में पान और धार्मिक सहभागिता, दोनों की छवि को बनाए रखता है।
- source_word: κυρίου
  choice: प्रभु का / प्रभु की
  rationale: κύριος के लिए ‘प्रभु’ मानक और गरिमापूर्ण विकल्प है। सम्बन्धकारक को हिन्दी के स्वाभाविक ‘का/की’ से व्यक्त किया गया है।
- source_word: πίνειν
  choice: पी सकते
  rationale: δύνασθε के साथ आए साधारण क्रियार्थक रूप को आधुनिक हिन्दी में स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: δαιμονίων
  choice: दुष्टात्माओं
  rationale: यह δαιμόνια की व्यक्तिगत, अलौकिक और दुष्ट सत्ता का अर्थ स्पष्ट रखता है; केवल ‘आत्माओं’ कहना नैतिक भाव को अस्पष्ट कर सकता था।
- source_word: τραπέζης
  choice: मेज़
  rationale: यह सीधा शाब्दिक समतुल्य है और सामुदायिक तथा उपासना-संबंधी दोनों संकेतों को बनाए रखता है, बिना ‘वेदी’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: μετέχειν
  choice: सहभागी होना
  rationale: यह वास्तविक भागीदारी अथवा साझेदारी का भाव व्यक्त करता है और आधुनिक, गरिमापूर्ण हिन्दी में स्वाभाविक है।
- source_word: καὶ
  choice: और ... दोनों
  rationale: ‘और’ के साथ ‘दोनों’ जोड़ने से यूनानी के समन्वय और दो असंगत सहभागिताओं की संयुक्त धारणा हिन्दी में स्पष्ट होती है।
theological_decisions:
- issue: प्रभु की मेज़ और दुष्टात्माओं की मेज़ में सहभागिता के बीच संबंध
  choice: दोनों प्रकार की सहभागिता को निर्णायक रूप से असंगत बताया गया है।
  alternative: इसे केवल एक प्रबल नैतिक सलाह या हतोत्साहन मानना।
  rationale: दो बार आया οὐ δύνασθε वास्तविक और स्पष्ट असंगति व्यक्त करता है। अनुवाद ‘नहीं सकते’ को दोनों खंडों में रखता है, पर इस असंगति की प्रकृति पर पाठ से आगे कोई सांप्रदायिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन प्रत्यक्ष और सामान्य बहुवचन ‘तुम’ में है। वाक्य की दो समानांतर धाराएँ और दो बार आया ‘नहीं सकते’ मूल पाठ की लय तथा निर्णायक बल को सुरक्षित रखते हैं।
