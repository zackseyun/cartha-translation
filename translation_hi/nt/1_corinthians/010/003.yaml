lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह पिछले कथन से इस पद को जोड़ने वाला सामान्य समुच्चयबोधक है।
- source_word: πάντες
  choice: सबने
  rationale: यह इस्राएल के पूरे समुदाय की ओर संकेत करता है और मूल के सार्वभौमिक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὸ αὐτὸ
  choice: एक ही
  rationale: इस प्रसंग में यह समानता अथवा एकरूप पहचान व्यक्त करता है; ‘एक ही’ सहज और सटीक हिन्दी है।
- source_word: πνευματικὸν
  choice: आत्मिक
  rationale: पौलुस की शब्दावली के अनुरूप यह भोजन को परमेश्वर के आत्मिक प्रबंध से संबंधित बताता है, बिना अर्थ को केवल ‘अलौकिक’ या ‘आत्मा द्वारा दिया हुआ’ तक सीमित किए।
- source_word: βρῶμα
  choice: भोजन
  rationale: यह सामान्य रूप से खाने की वस्तु को दर्शाता है; ‘भोजन’ इसका सीधा और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: ἔφαγον
  choice: खाया
  rationale: यह भूतकाल की सीधी कथात्मक क्रिया है; ‘सबने ... खाया’ हिन्दी में स्वाभाविक रूप से कर्ता-सामंजस्य व्यक्त करता है।
theological_decisions:
- issue: जंगल के प्रतिरूपात्मक प्रसंग में ‘आत्मिक भोजन’ का अर्थ
  choice: मुख्य पाठ में ‘आत्मिक भोजन’ रखा गया है, पर उसे स्पष्ट रूप से ‘मन्ना’ नहीं कहा गया और न प्रभु-भोज से उसका संबंध प्रत्यक्ष बनाया गया है।
  alternative: ‘परमेश्वर द्वारा दिया गया मन्ना’, ‘पवित्र आत्मा द्वारा दिया गया भोजन’, अथवा प्रभु-भोज का प्रतिरूप
  rationale: यहाँ संभवतः जंगल के मन्ना की ओर संकेत है और निकटवर्ती प्रसंग में प्रतिरूपात्मक बल भी हो सकता है। मूल अभिव्यक्ति बनाए रखने से यह धार्मिक तनाव सुरक्षित रहता है और कोई संकीर्ण व्याख्या पाठ में नहीं जोड़ी जाती।
translation_notes:
