  text: μηδὲ γογγύζετε, ⸀καθάπερ τινὲς αὐτῶν ἐγόγγυσαν, καὶ ἀπώλοντο ὑπὸ τοῦ ὀλοθρευτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/010.yaml
  text: And do not grumble[a], just as some of them grumbled and were destroyed by the destroyer.
translation:
  language: hi
  text: और न कुड़कुड़ाओ, जैसे उनमें से कुछ कुड़कुड़ाए और नाश करनेवाले[a] के द्वारा नष्ट किए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नाश करनेवाले स्वर्गदूत।” यूनानी में शाब्दिक रूप से “नाश करनेवाला” है; यह जंगल में इस्राएल पर आए दण्डों के विनाशकारी कर्ता की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μηδὲ
  choice: और न
  rationale: यह निषेध को पिछले उपदेशों से जोड़ता है और आधुनिक हिन्दी में संयोजक बल बनाए रखता है।
- source_word: γογγύζετε / ἐγόγγυσαν
  choice: कुड़कुड़ाओ / कुड़कुड़ाए
  rationale: यह असंतोष भरी शिकायत का भाव व्यक्त करता है और जंगल में इस्राएल के व्यवहार की ओर संकेत को बनाए रखता है।
- source_word: καθάπερ
  choice: जैसे
  rationale: तुलना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τινὲς αὐτῶν
  choice: उनमें से कुछ
  rationale: समूह के कुछ लोगों को बताने वाले यूनानी अंश का सीधा और सहज अनुवाद है।
- source_word: ἀπώλοντο
  choice: नष्ट किए गए
  rationale: अगले कर्तृवाचक पद के साथ बाहरी विनाशकारी कर्ता को स्पष्ट रखता है।
- source_word: ὑπὸ τοῦ ὀλοθρευτοῦ
  choice: नाश करनेवाले के द्वारा
  rationale: यूनानी पाठ के व्यक्तिवाचक विशेषण-संज्ञा रूप को बनाए रखता है और उसे स्पष्ट रूप से स्वर्गदूत नहीं ठहराता।
theological_decisions:
- issue: ὁ ὀλοθρευτής की पहचान
  choice: नाश करनेवाला
  alternative: नाश करनेवाला स्वर्गदूत
  rationale: यूनानी पाठ विनाश के कर्ता को एक उपाधि से बताता है, पर उसकी पहचान को अधिक विशिष्ट नहीं करता। मुख्य पाठ उसी अस्पष्टता को सुरक्षित रखता है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “कुड़कुड़ाना” बाइबिलीय प्रसंग में असंतोष भरी शिकायत को स्वाभाविक रूप से व्यक्त करता है; “नाश करनेवाला” मूल की जानबूझकर अनिर्दिष्ट पहचान को सुरक्षित रखता है।
