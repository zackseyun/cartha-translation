  text: Οὐ θέλω ⸀γὰρ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι οἱ πατέρες ἡμῶν πάντες ὑπὸ τὴν νεφέλην ἦσαν καὶ πάντες διὰ τῆς θαλάσσης διῆλθον,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/001.yaml
  text: For I do not want you to be unaware[a], brothers, that our fathers were all under the cloud, and all passed through the sea,
translation:
  language: hi
  text: क्योंकि, हे भाइयो[a], मैं नहीं चाहता कि तुम इस बात से अनजान रहो कि हमारे पूर्वज सभी बादल के नीचे थे और सभी समुद्र के बीच से होकर निकले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हे भाइयों और बहनों’; यूनानी में ‘भाइयो’ का प्रयोग मिली-जुली मंडली को संबोधित करने के लिए भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλω ... ἀγνοεῖν
  choice: मैं नहीं चाहता कि तुम ... से अनजान रहो
  rationale: यह पौलुस की नकारात्मक संरचना को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है; ‘मैं चाहता हूँ कि तुम जानो’ मूल की चिह्नित नकारात्मक अभिव्यक्ति को मिटा देता।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले तर्क से व्याख्यात्मक संबंध प्रकट करता है और यूनानी संयोजक का सामान्य हिन्दी समतुल्य है।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: सम्बोधन और स्रोत के पुल्लिंग बहुवचन रूप को स्पष्ट रूप से सुरक्षित रखता है; पूरी मिली-जुली मंडली के लिए इसके प्रतिनिधिक प्रयोग को पादटिप्पणी में बताया गया है।
- source_word: οἱ πατέρες ἡμῶν
  choice: हमारे पूर्वज
  rationale: आधुनिक हिन्दी में यह इस्राएल की पिछली पीढ़ियों के लिए स्वाभाविक और गरिमापूर्ण है तथा कुरिन्थुस की गैर-यहूदी-समावेशी मंडली को भी इस साझा इतिहास से जोड़ने वाली ‘हमारे’ की शक्ति बनाए रखता है।
- source_word: πάντες
  choice: सब-के-सब / सब
  rationale: दोनों बार πάντες की पुनरावृत्ति और पूरे समूह पर दिए गए आलंकारिक बल को सुरक्षित रखा गया है।
- source_word: ὑπὸ τὴν νεφέλην ἦσαν
  choice: बादल के नीचे थे
  rationale: निर्गमन के मार्गदर्शक बादल की ओर संकेत को बिना अतिरिक्त व्याख्या जोड़े सीधे और स्वाभाविक रूप में प्रस्तुत करता है।
- source_word: διὰ τῆς θαλάσσης διῆλθον
  choice: समुद्र के बीच से होकर निकले
  rationale: διά के ‘के बीच/आर-पार होकर’ और διέρχομαι के गतिशील अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना केवल समुद्र पार करने का अर्थ थोपे।
theological_decisions:
- issue: मिली-जुली कलीसिया के लिए ἀδελφοί का सम्बोधन
  choice: हे भाइयो
  alternative: हे भाई-बहनो
  rationale: मुख्य पाठ में यूनानी के पुल्लिंग बहुवचन रूप को रखा गया है, जबकि प्रसंगगत रूप से पूरी मंडली के समावेश को पादटिप्पणी में स्पष्ट किया गया है।
- issue: ‘हमारे पूर्वज’ द्वारा कलीसिया का इस्राएल के इतिहास से सामूहिक संबंध
  choice: हमारे पूर्वज
  alternative: हमारे पिता
  rationale: ‘हमारे’ पौलुस द्वारा कुरिन्थुस की मंडली को इस्राएल की कथा में सम्मिलित करने की आलंकारिक शक्ति बनाए रखता है। ‘पूर्वज’ आधुनिक हिन्दी में οἱ πατέρες के ऐतिहासिक-सामूहिक आशय को स्वाभाविक रूप से व्यक्त करता है, यद्यपि ‘पिता’ अधिक शाब्दिक विकल्प है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘हे भाइयो’ बाइबलीय सम्बोधन की औपचारिकता रखता है; ‘सब-के-सब’ पहले πάντες पर बल देता है और दूसरी बार ‘सब’ पुनरावृत्ति को बनाए रखता है।
