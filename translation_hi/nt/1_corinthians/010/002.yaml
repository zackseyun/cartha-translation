  text: and all were baptized into Moses in the cloud and in the sea[b][a],
translation:
  language: hi
  text: और सबने मूसा में[a], बादल में और समुद्र में[b] बपतिस्मा पाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मूसा के साथ अपनी पहचान जोड़ी” अथवा “मूसा के प्रति निष्ठा में आए।” यूनानी में शाब्दिक रूप से “मूसा में” है, जिससे बपतिस्मे के साथ पौलुस की प्रतिरूपात्मक समानता बनी रहती है।
    reason: alternative_reading
  - marker: b
    text: पौलुस “समुद्र में” कहता है, “समुद्र में से होकर” नहीं; इससे “बादल में” के साथ समानांतर अभिव्यक्ति बनी रहती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: सबने
  rationale: यह उन सभी इस्राएलियों को सामूहिक रूप से सूचित करता है जिनका प्रसंग में उल्लेख है और पौलुस के बार-बार दिए गए ‘सब’ के बल को बनाए रखता है।
- source_word: εἰς τὸν Μωϋσῆν
  choice: मूसा में
  rationale: यह असामान्य यूनानी रचना ‘मूसा में’ को यथासंभव सीधे रखता है, ताकि बपतिस्मे से जुड़ी प्रतिरूपात्मक समानता और प्रतिनिधित्व का संकेत बिना अतिरिक्त व्याख्या के बना रहे।
- source_word: ἐβαπτίσαντο
  choice: बपतिस्मा पाया
  rationale: यूनानी मध्यम रूप को स्वाभाविक हिन्दी में ग्रहणशील अर्थ के साथ व्यक्त करता है; ‘अपने आपको बपतिस्मा दिया’ मध्यम वाच्य पर अनुचित बल डालता।
- source_word: ἐν τῇ νεφέλῃ
  choice: बादल में
  rationale: ἐν का सीधा अर्थ और निर्गमन का बिंब सुरक्षित रहता है; साधन, क्षेत्र या संगति की संभावित अर्थ-छायाएँ खुली रहती हैं।
- source_word: ἐν τῇ θαλάσσῃ
  choice: समुद्र में
  rationale: पौलुस ने διά (‘के द्वारा/में से होकर’) के बजाय ἐν लिखा है; ‘समुद्र में’ ‘बादल में’ के साथ उसका समानांतर बनाए रखता है।
theological_decisions:
- issue: इस्राएलियों का ‘मूसा में बपतिस्मा’ पाना
  choice: प्रतिरूपात्मक और प्रतिनिधिक भाषा ‘मूसा में’ को मुख्य पाठ में बनाए रखना
  alternative: ‘मूसा के साथ एकरूप हुए’ या ‘मूसा के प्रति निष्ठा में आए’
  rationale: पौलुस निर्गमन के अनुभव और मसीही बपतिस्मे के बीच समानता प्रस्तुत करता है। अनुवाद को किसी एक धर्मवैज्ञानिक व्याख्या को निश्चित करने के बजाय मूल तनाव और असामान्य अभिव्यक्ति सुरक्षित रखनी चाहिए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘बपतिस्मा पाया’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक है, जबकि ‘मूसा में’ की जानबूझकर असामान्य रचना मूल यूनानी की वास्तविक अस्पष्टता और धर्मवैज्ञानिक तनाव को सुरक्षित रखती है।
