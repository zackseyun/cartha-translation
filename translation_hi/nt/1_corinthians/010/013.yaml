id: 1CO.10.13
reference: 1 Corinthians 10:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε, ἀλλὰ ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ ⸀δύνασθαι ὑπενεγκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/013.yaml
  text: No temptation has overtaken you except what is common to man[a]. But God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also provide the way out[c][b], so that you may be able to endure it.
translation:
  language: hi
  text: तुम पर ऐसी कोई परीक्षा नहीं आई जो मानवीय अनुभव से परे हो।[a] परन्तु परमेश्वर विश्वासयोग्य है; वह तुम्हें तुम्हारी सामर्थ्य से बढ़कर परीक्षा में पड़ने नहीं देगा,[b] बल्कि परीक्षा के साथ बच निकलने का उपाय भी करेगा,[c] ताकि तुम उसे सह सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “जो मानवीय न हो”; अर्थात जो मानव अनुभव में सामान्य न हो।'
    reason: lexical_alternative
  - marker: b
    text: “परीक्षा” और “परीक्षा में पड़ना” का अनुवाद “प्रलोभन” और “प्रलोभित होना” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “निकलने का मार्ग” अथवा “परिणाम।” यहाँ परमेश्वर की व्यवस्था उन्हें परीक्षा सहने में समर्थ बनाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμός / πειρασθῆναι
  choice: परीक्षा / परीक्षा में पड़ना
  rationale: इन शब्दों में परीक्षा, परख और पाप की ओर खींचने वाले प्रलोभन—तीनों की अर्थ-छाया हो सकती है। हिंदी में ‘परीक्षा’ व्यापक अर्थ को बनाए रखती है, जबकि संदर्भगत नैतिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: εἴληφεν
  choice: आई
  rationale: पूर्णकालिक क्रिया का आशय किसी अनुभव के आ पड़ने या पकड़ लेने से है। ‘आई’ स्वाभाविक आधुनिक हिंदी है और ‘तुम पर’ के साथ उस भाव को स्पष्ट करती है।
- source_word: εἰ μὴ ἀνθρώπινος
  choice: जो मनुष्यों के लिए सामान्य न हो
  rationale: ἀνθρώπινος का अर्थ मानव-संबंधी या मनुष्यों में सामान्य है; यह बताता है कि उनकी परीक्षा अलौकिक या मानव अनुभव से परे नहीं थी।
- source_word: πιστός
  choice: विश्वासयोग्य
  rationale: यह परमेश्वर की भरोसेमंद निष्ठा को व्यक्त करता है।
- source_word: ἐάσει
  choice: पड़ने नहीं देगा
  rationale: ἐάω अनुमति देने के अर्थ में है। निष्क्रिय infinitive के साथ यह हिंदी में स्वाभाविक रूप से ‘परीक्षा में पड़ने नहीं देगा’ बनता है।
- source_word: ὑπὲρ ὃ δύνασθε
  choice: तुम्हारी सामर्थ्य से परे
  rationale: यह उस सीमा को सीधे व्यक्त करता है जिसके आगे परमेश्वर परीक्षा की अनुमति नहीं देगा।
- source_word: ποιήσει
  choice: बनाएगा
  rationale: ποιέω का मूल अर्थ करना या बनाना है। ἔκβασις के साथ यह परमेश्वर द्वारा निकास का मार्ग उपलब्ध कराने को व्यक्त करता है।
- source_word: σὺν τῷ πειρασμῷ
  choice: परीक्षा के साथ
  rationale: σύν साथ-साथ होने का भाव देता है; समाधान परीक्षा के हटने के बजाय उसके साथ उपलब्ध कराया जाता है।
- source_word: ἔκβασιν
  choice: निकलने का मार्ग
  rationale: ἔκβασις निकास, बच निकलने का रास्ता या परिणाम हो सकता है। ‘निकलने का मार्ग’ सहज हिंदी है, पर सहने वाले अंतिम वाक्यांश के कारण इसका अर्थ केवल तत्काल पलायन नहीं है।
- source_word: τοῦ δύνασθαι ὑπενεγκεῖν
  choice: ताकि तुम उसे सह सको
  rationale: यह उद्देश्य या परिणाम बताता है। ὑποφέρω का अर्थ दबाव के नीचे टिके रहना या सहना है; निहित कर्म को हिंदी में ‘उसे’ से स्पष्ट किया गया है।
theological_decisions:
- issue: πειρασμός का अर्थ नैतिक प्रलोभन है या व्यापक परीक्षा
  choice: मुख्य पाठ में ‘परीक्षा’
  alternative: ‘प्रलोभन’ या ‘परख’
  rationale: निकटवर्ती संदर्भ पाप और मूर्तिपूजा की ओर झुकाव से जुड़ा है, इसलिए प्रलोभन की नैतिक छाया मौजूद है; फिर भी यूनानी शब्द व्यापक परीक्षा भी दर्श/class? सकता है। ‘परीक्षा’ इस तनाव को बनाए रखती है और विकल्प पादटिप्पणी में दिया गया है।
- issue: ἔκβασις का आशय परीक्षा से तत्काल छुटकारा है या उसे सहने का साधन
  choice: ‘निकलने का मार्ग’, जिसे उद्देश्य-वाक्य ‘ताकि तुम उसे सह सको’ नियंत्रित करता है
  alternative: ‘बच निकलने का उपाय’ या ‘परिणाम’
  rationale: पाठ परमेश्वर की ऐसी व्यवस्था बताता है जो धीरज से सहना संभव करती है; अनुवाद यह दावा नहीं करता कि हर परीक्षा तत्काल समाप्त हो जाएगी।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सामूहिक संबोधन ‘तुम’ रखा गया है। ‘मनुष्यों’ से ἀνθρώπινος का समावेशी मानवीय आशय स्पष्ट होता है। वाक्य-रचना मूल के विरोध (‘परन्तु’) और साथ-साथ उपलब्ध व्यवस्था (‘परीक्षा के साथ’) को बनाए रखती है।
