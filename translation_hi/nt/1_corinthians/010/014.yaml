  text: Διόπερ, ἀγαπητοί μου, φεύγετε ἀπὸ τῆς εἰδωλολατρίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/010/014.yaml
  text: Therefore[a], my beloved, flee from idolatry.
translation:
  language: hi
  text: इसलिए, मेरे प्रिय लोगो, मूर्तिपूजा से दूर भागो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διόπερ
  choice: इसलिए
  rationale: यह पूर्ववर्ती तर्क से निकला निष्कर्ष प्रकट करता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक है और तार्किक संबंध बनाए रखता है।
- source_word: ἀγαπητοί μου
  choice: मेरे प्रिय लोगो
  rationale: यह स्नेहपूर्ण संबोधन है। ‘मेरे प्रिय लोगो’ पौलुस के आत्मीय भाव को सहज और समावेशी आधुनिक हिन्दी में व्यक्त करता है।
- source_word: φεύγετε
  choice: दूर भागो
  rationale: वर्तमानकालीन बहुवचन आज्ञार्थक रूप खतरे से तत्काल और दृढ़तापूर्वक बचने का आदेश देता है; ‘दूर भागो’ केवल ‘बचे रहो’ से अधिक तीव्र है।
- source_word: ἀπὸ
  choice: से
  rationale: φεύγω के साथ यह उस वस्तु से अलग होने को दर्शाता है जिससे भागना है; हिन्दी में ‘से दूर भागो’ स्वाभाविक संरचना है।
- source_word: τῆς εἰδωλολατρίας
  choice: मूर्तिपूजा
  rationale: εἰδωλολατρία मूर्तियों की पूजा या सेवा को दर्शाता है। ‘मूर्तिपूजा’ संक्षिप्त, स्पष्ट और प्रचलित हिन्दी समतुल्य है।
theological_decisions:
- issue: निषेध का स्वरूप
  choice: मूर्तिपूजा और उससे जुड़ी प्रथाओं में सहभागिता से दूर रहने की सीधी आज्ञा
  alternative: केवल मन के भीतर मूर्तियों के प्रति भक्ति के विरुद्ध सीमित चेतावनी
  rationale: निकटवर्ती संदर्भ में पौलुस गैर-यहूदी धार्मिक भोजों और उपासना-संबंधी व्यवहार में सहभागिता के विरुद्ध चेतावनी देता है। सामान्य शब्द ‘मूर्तिपूजा’ यूनानी की व्यापकता बनाए रखता है और निषेध को केवल आंतरिक मनोवृत्ति तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। बहुवचन संबोधन और आज्ञा को बोलचाल में समझ आने वाले, किंतु प्रकाशन-योग्य रूप में प्रस्तुत किया गया है।
