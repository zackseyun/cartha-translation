lexical_decisions:
- source_word: ἀλλ’
  choice: फिर भी
  rationale: यह पिछले पदों में बताए गए सबके समान आत्मिक विशेषाधिकारों और अब बताए जा रहे अधिकांश लोगों के प्रति परमेश्वर की अप्रसन्नता के बीच प्रबल विरोध प्रकट करता है।
- source_word: οὐκ ἐν τοῖς πλείοσιν αὐτῶν
  choice: उनमें से अधिकतर से ... नहीं
  rationale: यूनानी वाक्य-विन्यास का स्वाभाविक हिन्दी रूप है और बहुसंख्यक होने का अर्थ सुरक्षित रखता है।
- source_word: ηὐδόκησεν ὁ θεός
  choice: परमेश्वर प्रसन्न नहीं हुआ
  rationale: εὐδοκέω का यहाँ अर्थ किसी से प्रसन्न होना या उसमें संतोष पाना है; यह सरल और गरिमापूर्ण हिन्दी है।
- source_word: κατεστρώθησαν
  choice: मारकर गिरा दिए गए
  rationale: क्रिया का मूल बिंब भूमि पर बिछा या गिरा दिए जाने का है और प्रसंग मृत्यु-दंड का है। यह रूप न्याय की गंभीरता तथा गिराए जाने के दृश्यात्मक अर्थ, दोनों को व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह परमेश्वर की अप्रसन्नता का प्रमाण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: ἐν τῇ ἐρήμῳ
  choice: निर्जन प्रदेश में
  rationale: निर्गमन के बाद इस्राएल के भटकने के भौगोलिक परिवेश को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है; केवल रेतीले मरुस्थल का अनावश्यक संकुचित अर्थ नहीं देता।
theological_decisions:
- issue: κατεστρώθησαν में न्याय और मृत्यु का संकेत
  choice: मारकर गिरा दिए गए
  alternative: भूमि पर ढेर हो गए / धराशायी कर दिए गए
  rationale: संदर्भ इस्राएल की अवज्ञा के परिणामस्वरूप परमेश्वर के न्याय की चेतावनी देता है। चुना हुआ अनुवाद मृत्यु और न्याय को स्पष्ट करता है, पर यह नहीं बताता कि हर व्यक्ति किस विशेष रीति से मरा।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘अधिकतर’ सामान्य पाठक के लिए स्वाभाविक है। ‘निर्जन प्रदेश’ ἔρημος की व्यापकता बनाए रखता है, और ‘मारकर गिरा दिए गए’ दुर्लभ शाब्दिक क्रिया के मृत्यु-संबंधी बिंब को व्यक्त करता है।
