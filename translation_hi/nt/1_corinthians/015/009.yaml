source:
  edition: SBLGNT
  text: ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/009.yaml
  text: For I am the least of the apostles[a], who am not worthy to be called an apostle, because I persecuted the church of God.
translation:
  language: hi
  text: क्योंकि मैं प्रेरितों में सबसे छोटा हूँ और प्रेरित कहलाने के योग्य[a] नहीं हूँ, क्योंकि मैंने परमेश्वर की कलीसिया को सताया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रेरित कहलाने के लिए योग्य” अथवा “प्रेरित कहलाने के लिए उपयुक्त।”
    reason: ἱκανός नैतिक पात्रता के साथ-साथ योग्यता या उपयुक्तता भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण स्पष्ट करता है और आधुनिक हिन्दी में तर्क-संबंध को स्वाभाविक ढंग से बनाए रखता है।
- source_word: ἐλάχιστος
  choice: सबसे छोटा
  rationale: यह शारीरिक आकार नहीं, बल्कि प्रेरितों के बीच पौलुस की अपनी दृष्टि में सबसे निम्न स्थिति व्यक्त करता है; ‘सबसे छोटा’ सहज हिन्दी में इस विनम्र आत्म-मूल्यांकन को बनाए रखता है।
- source_word: ἀπόστολος / ἀποστόλων
  choice: प्रेरित / प्रेरितों
  rationale: यहाँ शब्द मान्य प्रेरिताई भूमिका और समूह के लिए प्रयुक्त है, केवल सामान्य संदेशवाहक के अर्थ में नहीं।
- source_word: ἱκανός
  choice: लायक
  rationale: संदर्भ में पौलुस अपने पिछले सताव के कारण स्वयं को यह पदनाम पाने के योग्य नहीं मानता। ‘लायक’ नैतिक योग्यता का भाव स्वाभाविक हिन्दी में देता है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: καλεῖσθαι
  choice: कहलाने
  rationale: यह यूनानी कर्मवाच्य क्रिया-रूप का सीधा और सहज हिन्दी रूप है।
- source_word: διότι
  choice: क्योंकि
  rationale: यह पौलुस के आत्म-मूल्यांकन का स्पष्ट कारण प्रस्तुत करता है।
- source_word: ἐδίωξα
  choice: मैंने ... सताया था
  rationale: यह विश्वासियों के समुदाय के विरुद्ध पौलुस की पूर्व शत्रुतापूर्ण कार्रवाई को ठीक प्रकार व्यक्त करता है; ‘था’ उस कार्रवाई की पूर्वकालिक पृष्ठभूमि स्पष्ट करता है।
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: परमेश्वर की कलीसिया
  rationale: यह परमेश्वर से संबंधित विश्वासियों के समुदाय का परिचित और सटीक हिन्दी पद है तथा संबंधकारक रचना को बनाए रखता है।
- source_word: ὃς
  choice: और ... नहीं हूँ
  rationale: यूनानी संबंधवाचक उपवाक्य को शब्दशः असहज हिन्दी में रखने के बजाय समन्वित वाक्यांश से जोड़ा गया है; अर्थ और पौलुस के दोनों आत्म-कथन सुरक्षित रहते हैं।
theological_decisions:
- issue: पौलुस के प्रेरित होने और स्वयं को उस नाम के अयोग्य मानने के बीच तनाव
  choice: पौलुस को प्रेरितों में शामिल रखते हुए उसके विनम्र आत्म-मूल्यांकन को व्यक्त किया गया है।
  alternative: इसे पौलुस द्वारा अपने प्रेरितत्व का पूर्ण निषेध मानना।
  rationale: ‘मैं प्रेरितों में सबसे छोटा हूँ’ उसे समूह में सम्मिलित करता है, जबकि ‘प्रेरित कहलाने के लायक नहीं’ उसके पिछले सताव के कारण गहरी विनम्रता प्रकट करता है। अनुवाद दोनों बातों को बिना किसी एक को मिटाए बनाए रखता है।
- issue: ἱκανός में नैतिक पात्रता और उपयुक्तता/योग्यता का अर्थ
  choice: मुख्य पाठ में ‘लायक’ रखकर नैतिक अपात्रता का संदर्भगत भाव प्रमुख किया गया है।
  alternative: ‘योग्य’ या ‘उपयुक्त’, जो क्षमता अथवा पद के लिए योग्यता पर अधिक बल दे सकते हैं।
  rationale: सताव का उल्लेख नैतिक अयोग्यता के भाव को प्रमुख बनाता है, पर यूनानी शब्द का व्यापक अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कलीसिया’ और ‘प्रेरित’ हिन्दी बाइबिल-परंपरा के परिचित तकनीकी शब्द हैं। वाक्य की दो ‘क्योंकि’ मूल यूनानी के दो अलग कारण-सूचक संबंधों को सुरक्षित रखती हैं।
