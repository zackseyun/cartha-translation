  text: But if there is no resurrection of the dead[b][a], then not even Messiah has been raised.
translation:
  language: hi
  text: लेकिन यदि मृतकों का पुनरुत्थान नहीं है, तो मसीह[a] भी नहीं जिलाया गया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीस्त।” यूनानी उपाधि Χριστός का शाब्दिक अर्थ “अभिषिक्त” है; “मसीह” इस उपाधि का स्थापित हिन्दी धार्मिक रूप है।
    reason: alternative_reading
  - marker: b
    text: या, “जी उठा है।” यूनानी क्रिया कर्मवाच्य है—“जिलाया गया है”—और कार्य करने वाले का नाम स्पष्ट रूप से नहीं बताती।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: लेकिन यदि
  rationale: εἰ शर्त प्रस्तुत करता है और δέ पिछले तर्क से हल्का विरोध या नया मोड़ दिखाता है; ‘लेकिन यदि’ आधुनिक हिन्दी में दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀνάστασις νεκρῶν
  choice: मृतकों का पुनरुत्थान
  rationale: यह पदबंध मृत व्यक्तियों के वर्ग के पुनरुत्थान की बात करता है। ‘मृतकों का’ यूनानी संबंधकारक बहुवचन को सुरक्षित रखता है, जबकि ‘पुनरुत्थान’ पौलुस के इस तर्क का मानक और स्पष्ट धर्मवैचारिक शब्द है।
- source_word: οὐκ ἔστιν
  choice: नहीं है
  rationale: यह अस्तित्व अथवा वास्तविकता के निषेध को हिन्दी में संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὐδὲ
  choice: तो ... भी ... नहीं
  rationale: संदर्भ में οὐδέ शर्त से निकलने वाला निष्कर्ष व्यक्त करता है। हिन्दी की ‘तो ... भी नहीं’ संरचना इस तार्किक बल को स्पष्ट रखती है।
- source_word: Χριστός
  choice: मसीह
  rationale: यहाँ Χριστός अभिषिक्त जन की उपाधि के रूप में प्रयुक्त है। ‘मसीह’ हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण, प्रचलित और साधारण पाठकों के लिए परिचित रूप है।
- source_word: ἐγήγερται
  choice: जिलाया नहीं गया है
  rationale: यूनानी क्रिया पूर्णकालिक कर्मवाच्य है। ‘जिलाया ... गया है’ पूर्ण हुई घटना के वर्तमान परिणाम और कर्मवाच्य—दोनों को बनाए रखता है तथा कार्य करने वाले को स्पष्ट रूप से जोड़ता नहीं है।
theological_decisions:
- issue: Χριστός को उपाधि या नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस पुनरुत्थान-विषयक तर्क में शब्द का उपाधिगत अर्थ उचित है। ‘मसीह’ हिन्दी में ‘अभिषिक्त जन’ की पारंपरिक और समझ में आने वाली उपाधि है; ‘ख्रीस्त’ यूनानी रूप का अधिक सीधा लिप्यंतरण होता।
- issue: ἐγήγερται का कर्मवाच्य
  choice: जिलाया नहीं गया है
  alternative: जी नहीं उठा है
  rationale: मुख्य पाठ में कर्मवाच्य बनाए रखने से यह संकेत सुरक्षित रहता है कि मसीह को जिलाया गया, पर पाठ में कर्ता—परमेश्वर—को स्पष्ट रूप से नहीं जोड़ा जाता। विकल्प अधिक स्वाभाविक अकर्मक अभिव्यक्ति है, पर यूनानी वाच्य को धुंधला करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण बाइबलीय गद्य अपनाया गया है। वाक्य की शर्त और उससे निकलने वाला निष्कर्ष स्पष्ट रखने के लिए ‘लेकिन यदि ... तो ... भी नहीं’ संरचना प्रयुक्त हुई है।
