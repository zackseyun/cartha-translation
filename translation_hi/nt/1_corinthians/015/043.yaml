source:
  edition: SBLGNT
  text: σπείρεται ἐν ἀτιμίᾳ, ἐγείρεται ἐν δόξῃ· σπείρεται ἐν ἀσθενείᾳ, ἐγείρεται ἐν δυνάμει·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/043.yaml
  text: It is sown in dishonor; it is raised in glory. It is sown in weakness; it is raised in power.
translation:
  language: hi
  text: वह अनादर में बोया जाता है, महिमा में जिलाया जाता है; वह निर्बलता में बोया जाता है, सामर्थ्य में जिलाया जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεται
  choice: बोया जाता है
  rationale: वर्तमानकालिक कर्मवाच्य रूप और बीज/देह के रूपक—दोनों को बनाए रखता है; ‘रोपा जाता है’ की अपेक्षा बुवाई का चित्र अधिक सटीक है।
- source_word: ἀτιμίᾳ
  choice: अनादर में
  rationale: δόξῃ के साथ मूल विरोध को बनाए रखता है और भावनात्मक ‘लज्जा’ को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἐγείρεται
  choice: जिलाया जाता है
  rationale: पुनरुत्थान के संदर्भ में स्वाभाविक हिन्दी है; कर्मवाच्य को बनाए रखते हुए परमेश्वर के निहित कर्तृत्व को स्पष्ट रूप से नहीं जोड़ता।
- source_word: δόξῃ
  choice: महिमा में
  rationale: पुनरुत्थान-संदर्भ में δόξα का स्थापित, व्यापक और धर्मवैज्ञानिक रूप से उपयुक्त प्रतिशब्द है।
- source_word: ἀσθενείᾳ
  choice: निर्बलता में
  rationale: देह की दुर्बल दशा को व्यक्त करता और δύναμις के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: δυνάμει
  choice: सामर्थ्य में
  rationale: पौलुस के प्रयोग की व्यापकता और पुनरुत्थान की रूपांतरित शक्ति को व्यक्त करता है; केवल शारीरिक बल तक सीमित नहीं है।
theological_decisions:
- issue: पुनरुत्थान की भाषा में वाच्य और कर्ता
  choice: ‘जिलाया जाता है’ जैसे कर्मवाच्य रूप का प्रयोग, बिना परमेश्वर को मुख्य पाठ में स्पष्ट कर्ता बनाने के
  alternative: ‘परमेश्वर उसे जिलाता है’
  rationale: यूनानी पाठ कर्मवाच्य है। इसे बनाए रखने से निहित दिव्य कर्तृत्व निहित ही रहता है और मूल की अभिव्यक्ति सुरक्षित रहती है।
- issue: अव्यक्त कर्ता/विषय का संदर्भ
  choice: ‘वह’, जिसका संदर्भ पिछले प्रसंग की देह है
  alternative: ‘देह बोई जाती है ... देह जिलाई जाती है’
  rationale: यूनानी में विषय अलग से व्यक्त नहीं है और निकटवर्ती प्रसंग में देह इसका संदर्भ है। हिन्दी में ‘वह’ इस संबंध को स्वाभाविक रूप से बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप। दोनों समांतर विरोधों की लय और कर्मवाच्य संरचना सुरक्षित रखी गई है। ‘जिलाया जाता है’ पुनरुत्थान के अर्थ को साधारण ‘उठाया जाता है’ की संभावित स्थानगत अस्पष्टता से बचाते हुए व्यक्त करता है।
