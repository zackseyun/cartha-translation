id: 1CO.15.12
reference: 1 Corinthians 15:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσιν ⸂ἐν ὑμῖν τινες⸃ ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/012.yaml
  text: If the Messiah is proclaimed as having been raised from the dead[a], how can some among you say that there is no resurrection of the dead?
translation:
  language: hi
  text: यदि मसीह के विषय में यह प्रचार किया जाता है कि उन्हें मरे हुओं में से जिलाया गया है,[a] तो तुममें से कुछ लोग कैसे कहते हैं कि मरे हुओं का पुनरुत्थान नहीं है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसीह का प्रचार किया जाता है।” यूनानी Χριστός κηρύσσεται को संक्षेप में इस प्रकार भी व्यक्त किया जा सकता है; आगे का ‘कि’ उपवाक्य उस प्रचार की विषयवस्तु बताता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: मसीह
  rationale: यहाँ Χριστός मसीही उपाधि के रूप में प्रयुक्त है; हिंदी में प्रचलित और अर्थपूर्ण रूप ‘मसीह’ स्वाभाविक है।
- source_word: κηρύσσεται
  choice: प्रचार किया जाता है
  rationale: वर्तमानकालीन कर्मवाच्य सार्वजनिक और निरंतर घोषणा का भाव देता है।
- source_word: ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: यह बहुवचन अभिव्यक्ति मृत लोगों के बीच से जिलाए जाने का अर्थ स्वाभाविक हिंदी में सुरक्षित रखती है।
- source_word: ἐγήγερται
  choice: जिलाया गया है
  rationale: पूर्ण कर्मवाच्य रूप पूर्ण हो चुकी क्रिया और उसके वर्तमान परिणाम को व्यक्त करता है तथा परमेश्वर की निहित क्रिया को खुला रखता है।
- source_word: πῶς
  choice: कैसे
  rationale: प्रश्नवाचक शब्द यहाँ कथनों की असंगति पर बल देने वाला आलंकारिक प्रश्न बनाता है।
- source_word: ἐν ὑμῖν τινες
  choice: तुममें से कुछ लोग
  rationale: यह कुरिन्थ की कलीसिया के भीतर के एक समूह को सहज आधुनिक हिंदी में पहचानता है।
- source_word: ἀνάστασις νεκρῶν
  choice: मरे हुओं का पुनरुत्थान
  rationale: यह सामान्य पुनरुत्थान के लिए पौलुस की व्यापक श्रेणी और संबंधकारक रचना दोनों को सुरक्षित रखता है।
- source_word: οὐκ ἔστιν
  choice: नहीं होता
  rationale: सामान्य पुनरुत्थान के निषेध को हिंदी में स्वाभाविक रूप से व्यक्त करता है; ‘अस्तित्व नहीं है’ की तुलना में यह अधिक सुबोध है।
theological_decisions:
- issue: पौलुस के कथन में Χριστός का रूपांतरण
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: संदर्भ में यह उपाधि है; ‘मसीह’ हिंदी में स्थापित रूप है और अभिषिक्त जन की पहचान को मात्र नाम बनाकर अस्पष्ट नहीं करता।
- issue: ἐγήγερται में कर्मकर्ता
  choice: जिलाया गया है
  alternative: जी उठा है
  rationale: कर्मवाच्य को बनाए रखने से पाठ में निहित परमेश्वर की क्रिया सुरक्षित रहती है, पर कर्मकर्ता को वहाँ स्पष्ट नहीं किया जाता जहाँ यूनानी पाठ उसे स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। ‘जिलाया गया है’ पूर्ण कर्मवाच्य के परिणामकारी भाव को रखता है। मुख्य पाठ में व्याख्यात्मक कर्मकर्ता नहीं जोड़ा गया और आरंभ में कोई अस्रोत ‘अब’ नहीं रखा गया।
