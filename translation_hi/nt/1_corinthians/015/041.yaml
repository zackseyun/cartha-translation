  terminology: ‘तेज’ consistently renders δόξα in the verse and is suitable for the celestial imagery. The footnote correctly identifies ‘महिमा,’ ‘वैभव,’ and ‘चमक’ as alternatives; ‘महिमा’ importantly signals the broader rhetorical continuity without being imposed as the main rendering.
