source:
  edition: SBLGNT
  text: ἄλλη δόξα ἡλίου, καὶ ἄλλη δόξα σελήνης, καὶ ἄλλη δόξα ἀστέρων, ἀστὴρ γὰρ ἀστέρος διαφέρει ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/041.yaml
  text: There is one glory of the sun[a], and another glory of the moon, and another glory of the stars; for star differs from star in glory.
translation:
  language: hi
  text: सूर्य का तेज अलग है, चंद्रमा का तेज अलग है और तारों का तेज अलग है; क्योंकि एक तारा तेज में दूसरे तारे से भिन्न होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλη
  choice: अलग
  rationale: बार-बार प्रयुक्त ἄλλη सूर्य, चंद्रमा और तारों के तेज के बीच भेद दिखाता है; ‘अलग’ आधुनिक हिंदी में इस समानांतरता को स्वाभाविक रूप से बनाए रखता है।
- source_word: δόξα
  choice: तेज
  rationale: यहाँ δόξα आकाशीय पिंडों की दिखाई देने वाली दीप्ति या वैभव को दर्शाता है। ‘तेज’ हिंदी में उस दृश्य चमक को स्वाभाविक ढंग से व्यक्त करता है, जबकि व्यापक पुनरुत्थान-तर्क से उसका संबंध पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἡλίου / σελήνης / ἀστέρων
  choice: सूर्य का / चंद्रमा का / तारों का
  rationale: संबंधकारक रूपों को हिंदी में ‘का’ के द्वारा समानांतर और स्पष्ट रूप से व्यक्त किया गया है।
- source_word: ἀστὴρ ... ἀστέρος
  choice: एक तारा दूसरे तारे से
  rationale: यूनानी के एकवचन-से-एकवचन तुलनात्मक संबंध को स्वाभाविक हिंदी में सीधे सुरक्षित रखा गया है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का स्पष्टीकरण देता है; ‘क्योंकि’ हिंदी में इस संबंध को स्पष्ट करता है।
- source_word: διαφέρει
  choice: भिन्न होता है
  rationale: यह क्रिया यहाँ अंतर बताती है। ‘भिन्न होता है’ श्रेष्ठता का अनावश्यक अर्थ जोड़े बिना तुलना को व्यक्त करता है।
- source_word: ἐν δόξῃ
  choice: तेज में
  rationale: यह वाक्यांश बताता है कि तारों में किस दृष्टि से भेद है और δόξα के चुने हुए अनुवाद को दोहराता है।
theological_decisions:
- issue: पुनरुत्थान-विमर्श में आकाशीय उपमा के भीतर δόξα का अनुवाद
  choice: तेज
  alternative: महिमा / वैभव / चमक
  rationale: तात्कालिक संदर्भ में आकाशीय पिंडों की दिखाई देने वाली दीप्ति प्रमुख है, इसलिए ‘तेज’ सामान्य हिंदी पाठक के लिए स्पष्ट और गरिमापूर्ण है। साथ ही पादटिप्पणी बताती है कि यूनानी शब्द ‘महिमा’ का व्यापक अर्थ भी रखता है, जिससे पौलुस के आसपास के तर्क से संबंध अस्पष्ट नहीं होता।
translation_notes:
  register: आधुनिक मानक हिंदी; वाक्यरचना सरल, समानांतर और गरिमापूर्ण रखी गई है। ‘चंद्रमा’ को मानक वर्तनी में और ‘तेज’ को सामान्य पाठक के लिए सहज शब्द के रूप में चुना गया है।
