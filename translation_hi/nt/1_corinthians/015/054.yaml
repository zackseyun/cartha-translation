id: 1CO.15.54
reference: 1 Corinthians 15:54
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅταν δὲ τὸ ⸂φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν καὶ τὸ⸃ θνητὸν τοῦτο ἐνδύσηται ⸀ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος· Κατεπόθη ὁ θάνατος εἰς νῖκος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/054.yaml
  text: 'But when this perishable puts on imperishability[a], and this mortal puts on immortality[d][c][b], then the written word will come to pass: “Death has been swallowed up in victory.”'
translation:
  language: hi
  text: 'पर जब यह नाशवान अविनाशिता को पहन लेगा, और यह मरणशील अमरता को पहन लेगा, तब लिखा हुआ वचन पूरा होगा[a]: “मृत्यु विजय में निगल ली गई है।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तब लिखा हुआ वचन घटित होगा।”
    reason: γενήσεται के सामान्य अर्थ और यूनानी अभिव्यक्ति की अधिक शाब्दिक रचना को सुरक्षित रखना।
  - marker: b
    text: यशायाह 25:8 का उद्धरण; यहाँ शब्दावली उस यूनानी पाठ-परंपरा को दर्शाती है जिसे पौलुस उद्धृत करते हैं।
    reason: उद्धरण के स्रोत और उसकी पाठ-परंपरा की जानकारी देना।
lexical_decisions:
- source_word: φθαρτὸν
  choice: नाशवान
  rationale: यह विशेषण संज्ञा के रूप में वर्तमान देह की नाश और क्षय के अधीन दशा को बताता है; ‘नाशवान’ सहज है और ‘अविनाशिता’ के साथ स्पष्ट विरोध बनाता है।
- source_word: ἐνδύσηται
  choice: पहन लेगा
  rationale: मध्यवाच्य क्रिया के वस्त्र धारण करने के रूपक को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀφθαρσίαν
  choice: अविनाशिता
  rationale: φθαρτός के विपरीत, नाश या क्षय से मुक्त अवस्था का सटीक संज्ञात्मक रूप है।
- source_word: θνητὸν
  choice: मरणशील
  rationale: मृत्यु के अधीन वस्तु के लिए संक्षिप्त और प्रचलित हिन्दी शब्द; ‘अमरता’ के साथ स्वाभाविक विरोध बनाता है।
- source_word: ἀθανασίαν
  choice: अमरता
  rationale: मृत्यु से रहित अवस्था के लिए सीधा और सामान्य हिन्दी पर्याय है।
- source_word: γενήσεται
  choice: पूरा होगा
  rationale: लिखित वचन के संदर्भ में γίνομαι का आशय उसके घटित होकर सत्य सिद्ध होने से है; हिन्दी में ‘वचन पूरा होगा’ स्वाभाविक है, यद्यपि अधिक शाब्दिक अर्थ ‘घटित होगा’ है।
- source_word: ὁ λόγος ὁ γεγραμμένος
  choice: वह वचन जो लिखा है
  rationale: λόγος को ‘वचन’ के रूप में रखते हुए लिखित कथन का अर्थ स्पष्ट करता है और हिन्दी में सहज वाक्यांश देता है।
- source_word: Κατεπόθη
  choice: निगल ली गई है
  rationale: उद्धरण के कर्मवाच्य और निगलने के सजीव रूपक को सुरक्षित रखता है; पूर्ण वर्तमान भावी समय पर सिद्ध परिणाम को व्यक्त करता है।
- source_word: εἰς νῖκος
  choice: विजय में
  rationale: मृत्यु की पूर्ण पराजय के परिणाम या अवस्था को व्यक्त करता है और यूनानी पदबंध का निकट रूप है।
theological_decisions:
- issue: लिखित वचन के संबंध में γενήσεται का अनुवाद
  choice: पूरा होगा
  alternative: घटित होगा / सच हो जाएगा
  rationale: मूल क्रिया सामान्यतः ‘होना/घटित होना’ है, पर लिखित भविष्यवाणी के संदर्भ में ‘पूरा होगा’ स्वाभाविक हिन्दी है। पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है ताकि मूल में औपचारिक ‘पूर्ति’ क्रिया न होने का तथ्य न छिपे।
- issue: Κατεπόθη का काल-पक्ष
  choice: मृत्यु विजय में निगल ली गई है
  alternative: मृत्यु विजय में निगल ली गई / निगल ली जाती है
  rationale: भावी अंतकालीन प्रसंग में उद्धृत अओरिस्ट को सिद्ध परिणाम के रूप में व्यक्त किया गया है; कर्मवाच्य बना रहता है और निगलने वाले कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘नाशवान/अविनाशिता’ और ‘मरणशील/अमरता’ से पौलुस के समानांतर विरोधों को रखा गया है; ‘पहन लेगा’ वस्त्र-रूपक को सुरक्षित रखता है।
