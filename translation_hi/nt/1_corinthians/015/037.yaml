review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the agricultural metaphor, σῶμα as ‘देह,’ the future sense of τὸ γενησόμενον, and the contingency of εἰ τύχοι. However, ‘बाकी प्रकारों में से किसी एक का’ is an overly literal and awkward rendering of τινος τῶν λοιπῶν. ‘केवल एक दाना’ adequately conveys the contrast intended by γυμνὸν κόκκον in idiomatic Hindi.
  naturalness: ‘उसमें तुम वह देह नहीं बोते’ is less natural than directly repeating ‘तुम.’ The closing phrase should be made idiomatic without losing its reference to another kind of seed.
  terminology: ‘देह’ is appropriate and preserves the verse’s significant resurrection vocabulary. ‘दाना’ is a natural contextual equivalent for κόκκος. ‘अस्तित्व में आएगी’ is suitably formal and accurately avoids narrowing the future participle to botanical growth.
  issues:
  - severity: medium
    issue: Awkward rendering of τινος τῶν λοιπῶν
    rationale: ‘बाकी प्रकारों में से किसी एक का’ is structurally comprehensible but not natural modern Hindi. ‘किसी दूसरे प्रकार का’ more naturally communicates ‘of some other kind’ while retaining the indefinite reference.
  - severity: low
    issue: Unnecessary locative wording
    rationale: ‘उसमें तुम वह देह नहीं बोते’ is cumbersome. The Greek simply contrasts what is sown with the future body; ‘तुम वह देह नहीं बोते’ is clearer.
  revised_text: और जो कुछ तुम बोते हो, तुम वह देह नहीं बोते जो अस्तित्व में आएगी, बल्कि केवल एक दाना—शायद गेहूँ का या किसी दूसरे प्रकार का।
  revised_footnotes: []
  revision_rationale: The revision removes an unnatural locative construction and renders the final indefinite phrase idiomatically. It retains ‘देह,’ the future-oriented ‘अस्तित्व में आएगी,’ the contrast of a mere/bare seed, and the tentative force of ‘शायद,’ without adding interpretation.
