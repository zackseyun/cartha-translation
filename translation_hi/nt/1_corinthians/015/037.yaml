source:
  edition: SBLGNT
  text: καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις ἀλλὰ γυμνὸν κόκκον εἰ τύχοι σίτου ἤ τινος τῶν λοιπῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/037.yaml
  text: And what you sow[a], you do not sow the body that will be, but a bare kernel[c][b], perhaps of wheat or of some other kind.
translation:
  language: hi
  text: और जो कुछ तुम बोते हो, तुम वह देह नहीं बोते जो अस्तित्व में आएगी, बल्कि केवल एक दाना—शायद गेहूँ का या किसी दूसरे प्रकार का।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρεις
  choice: बोते हो
  rationale: कृषि-संबंधी क्रिया का सीधा अर्थ ‘बोना’ है; इससे पौलुस का बीज-वाला रूपक और आसपास के तर्क से उसका संबंध बना रहता है।
- source_word: σῶμα
  choice: देह
  rationale: पुनरुत्थान की चर्चा में यह पौलुस का महत्त्वपूर्ण शब्द है। ‘रूप’ जैसे ढीले अनुवाद की अपेक्षा ‘देह’ शारीरिक पुनरुत्थान से संबंध बनाए रखता है।
- source_word: τὸ γενησόμενον
  choice: जो अस्तित्व में आएगी
  rationale: γίνομαι का भाव भविष्य में अस्तित्व में आने का है। यह केवल वनस्पति-वृद्धि का अर्थ थोपे बिना यूनानी अभिव्यक्ति की भावी दिशा स्पष्ट करता है।
- source_word: γυμνὸν κόκκον
  choice: केवल एक दाना
  rationale: γυμνός यहाँ बिना विकसित देह के, साधारण या अनावृत दाने का भाव देता है। हिंदी में ‘नंगा दाना’ अस्वाभाविक है; ‘केवल एक दाना’ वर्तमान बीज और भावी देह का अंतर स्वाभाविक ढंग से रखता है।
- source_word: εἰ τύχοι
  choice: शायद
  rationale: यह मुहावरा संभावना या उदाहरण व्यक्त करता है; ‘शायद’ हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: σίτου
  choice: गेहूँ का
  rationale: यहाँ σῖτος सामान्य अनाज की अपेक्षा ठोस उदाहरण के रूप में गेहूँ को सूचित करता है।
- source_word: τινος τῶν λοιπῶν
  choice: बाकी प्रकारों में से किसी एक का
  rationale: यह अभिव्यक्ति शेष प्रकारों में से किसी एक बीज को बताती है और यूनानी संरचना तथा अनिश्चितता दोनों को बनाए रखती है।
theological_decisions:
- issue: बीज और पुनरुत्थान की देह का संबंध
  choice: ‘देह’ और भविष्यसूचक भाषा को बनाए रखते हुए रूपक की व्याख्या उससे आगे नहीं बढ़ाई गई।
  alternative: ‘जो पौधा उगेगा’ जैसा अधिक गतिशील वनस्पति-केंद्रित अनुवाद।
  rationale: पद देह के पुनरुत्थान में निरंतरता और परिवर्तन की व्यापक दलील का भाग है, पर यहाँ पौलुस कृषि-रूपक का उपयोग करता है। ‘देह’ को बनाए रखना और उसे केवल ‘पौधा’ न बना देना मूल theological tension को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा गरिमापूर्ण, सहज और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘अस्तित्व में आएगी’ थोड़ा औपचारिक है, पर τὸ γενησόμενον के अर्थ को ‘उगेगी’ तक सीमित नहीं करता।
