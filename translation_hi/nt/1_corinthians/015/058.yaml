source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστιν κενὸς ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/058.yaml
  text: Therefore[a], my beloved brothers, become steadfast, immovable, always abounding in the work of the Lord, knowing that your labor in the Lord is not in vain.
translation:
  language: hi
  text: इसलिए, मेरे प्रिय भाइयो[a], दृढ़ बनो, अटल रहो और प्रभु के काम में सदा बढ़ते जाओ, यह जानते हुए कि प्रभु में तुम्हारा परिश्रम व्यर्थ नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयो’ यूनानी शब्द अदेल्फोई का अनुवाद है। प्रसंग के अनुसार यह स्त्रियों सहित सभी सहविश्वासियों के लिए सामूहिक सम्बोधन हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: इसलिए
  rationale: यह निष्कर्षसूचक संयोजक पिछले पुनरुत्थान-विवेचन से इस उपदेश को जोड़ता है; ‘इसलिए’ उसके तार्किक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: मेरे प्रिय भाइयो
  rationale: सम्बोधन में ‘भाइयो’ व्याकरणिक पुल्लिंग बहुवचन को रखता है, जबकि प्रसंग में पूरी विश्वासी मण्डली सम्मिलित है; इस व्यापक अर्थ को पादटिप्पणी में स्पष्ट किया गया है। ‘प्रिय’ आधुनिक हिन्दी में ἀγαπητοί का स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: ἑδραῖοι γίνεσθε
  choice: दृढ़ बनो
  rationale: γίνεσθε के ‘बनो’ वाले क्रियात्मक बल को बनाए रखते हुए ἑδραῖοι की स्थिर और स्थापित दशा व्यक्त होती है।
- source_word: ἀμετακίνητοι
  choice: अटल रहो
  rationale: यह अपने स्थान या विश्वास से न हटाए जाने का प्रबल भाव देता है और हिन्दी में ‘दृढ़ बनो’ के साथ स्वाभाविक युग्म बनाता है।
- source_word: περισσεύοντες
  choice: बढ़ते जाओ
  rationale: वर्तमान कृदन्त निरन्तर और भरपूर संलग्नता बताता है; ‘सदा बढ़ते जाओ’ सामान्य आधुनिक हिन्दी में इस गतिशील प्रचुरता को व्यक्त करता है।
- source_word: ἐν τῷ ἔργῳ τοῦ κυρίου
  choice: प्रभु के काम में
  rationale: यह व्यापक पद सेवा के किसी एक प्रकार तक ἔργον को सीमित नहीं करता और सम्बन्धकारक रचना को स्पष्ट हिन्दी में रखता है।
- source_word: εἰδότες
  choice: क्योंकि तुम जानते हो
  rationale: कृदन्त का यहाँ आधारसूचक या कारणात्मक सम्बन्ध है; पूर्ण वाक्य में यह हिन्दी में अधिक स्वाभाविक है, जबकि ज्ञान को उपदेश का आधार बनाए रखता है।
- source_word: ὁ κόπος ὑμῶν
  choice: तुम्हारा परिश्रम
  rationale: ‘परिश्रम’ थकाने वाले कठिन श्रम का κόπος-संबंधी भार सामान्य और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: οὐκ ἔστιν κενὸς
  choice: व्यर्थ नहीं है
  rationale: इस प्रसंग में κενός निष्फल या निरर्थक होने को दर्शाता है; ‘व्यर्थ नहीं’ इसका स्वाभाविक हिन्दी मुहावरा है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह पौलुस की व्यापक सम्बन्धात्मक अभिव्यक्ति को व्याख्यात्मक रूप से केवल साधन, कारण या दृष्टिकोण तक सीमित किए बिना सुरक्षित रखता है।
theological_decisions:
- issue: ἀδελφοί का लैंगिक और सामुदायिक संकेत
  choice: मुख्य पाठ में ‘भाइयो’, और पादटिप्पणी में स्त्री-पुरुष सभी सहविश्वासियों के सम्भावित समावेश की सूचना।
  alternative: ‘भाइयो और बहनो’
  rationale: यूनानी शब्द व्याकरणिक रूप से पुल्लिंग बहुवचन है, पर पत्र का सम्बोधन पूरी मण्डली को हो सकता है। मुख्य पाठ रूप को और पादटिप्पणी प्रसंगगत व्यापकता को सुरक्षित रखती है।
- issue: पद के अन्त में ἐν κυρίῳ का सम्बन्ध
  choice: ‘प्रभु में तुम्हारा परिश्रम व्यर्थ नहीं है’—इसे परिश्रम की प्रभु-संबंधी स्थिति से जोड़ा गया है।
  alternative: ‘प्रभु के कारण तुम्हारा परिश्रम व्यर्थ नहीं है’
  rationale: यूनानी पदबन्ध कारण, साधन या सम्बन्ध में से किसी एक को स्पष्ट रूप से निर्धारित नहीं करता; ‘प्रभु में’ पौलुस की अभिव्यक्ति की धर्मवैचारिक व्यापकता और तनाव बनाए रखता है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस मसीही और पौलुसी प्रसंग में ‘प्रभु’ प्रचलित, गरिमापूर्ण और धर्मवैचारिक संकेत को सुरक्षित रखने वाला रूप है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामुदायिक उपदेश का लहजा रखा गया है। ‘दृढ़ बनो, अटल रहो’ मूल के निकट समानान्तर बल को बनाए रखता है; ‘बढ़ते जाओ’ शाब्दिक ‘बहुतायत में रहो’ की अपेक्षा सामान्य पाठक के लिए अधिक स्वाभाविक है।
