  yaml_path: translation/nt/1_corinthians/015/046.yaml
  text: But the spiritual is not first[a], but the natural[b]; afterward the spiritual.
translation:
  language: hi
  text: पर पहले आत्मिक नहीं, बल्कि प्राकृतिक है; उसके बाद आत्मिक है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: पहले
  rationale: यहाँ यह क्रम को दर्शाने वाला क्रियाविशेषण है; ‘पहले’ पुनरुत्थान-संबंधी तर्क में समय और क्रम दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πνευματικόν
  choice: आत्मिक
  rationale: यह नपुंसकलिंग एकवचन विशेषण संज्ञा के रूप में प्रयुक्त है। ‘आत्मिक’ यूनानी की संक्षिप्तता बनाए रखता है और निकटवर्ती संदर्भ में आत्मिक देह अथवा आत्मिक अस्तित्व की ओर संकेत करने की गुंजाइश छोड़ता है।
- source_word: ψυχικόν
  choice: प्राकृतिक
  rationale: यह साधारण सजीव या प्राणधारी जीवन से संबंधित अवस्था को सूचित करता है, जिसका विरोध आत्मा से संबंधित भावी अवस्था से है। ‘प्राकृतिक’ आधुनिक हिंदी में अपेक्षाकृत सुबोध है; पादटिप्पणी इसके विशेष यूनानी अर्थ को स्पष्ट करती है।
- source_word: ἔπειτα
  choice: उसके बाद
  rationale: यह अगले क्रम को स्पष्ट रूप से दर्शाता है और हिंदी में सहज कालानुक्रमिक अभिव्यक्ति है।
- source_word: ἀλλ’ οὐ ... ἀλλὰ
  choice: पर ... नहीं, बल्कि ...
  rationale: यह दोहरे विरोध और पहले माने गए क्रम के सुधारात्मक बल को स्वाभाविक हिंदी में सुरक्षित रखता है।
theological_decisions:
- issue: ψυχικόν और πνευματικόν के बीच विरोध का आशय
  choice: मनुष्य के अस्तित्व के क्रमिक रूपों या व्यवस्थाओं का विरोध—पहले साधारण प्राणधारी जीवन से संबंधित, फिर आत्मिक।
  alternative: विशेष रूप से प्राकृतिक देह और आत्मिक देह के बीच विरोध।
  rationale: पद 44 में ‘देह’ स्पष्ट है, पर इस पद के यूनानी पाठ में वह शब्द नहीं है। इसलिए मुख्य पाठ विशेषणों की संक्षिप्तता बनाए रखता है और पादटिप्पणी संदर्भगत विकल्प बताती है।
- issue: क्या ψυχικόν नैतिक रूप से ‘अनात्मिक’ व्यक्ति को दर्शाता है
  choice: इसे यहाँ नैतिक निंदा के बजाय साधारण प्राणधारी जीवन से संबंधित माना गया है।
  alternative: ‘अनात्मिक’ या परमेश्वर के आत्मा से रहित व्यक्ति।
  rationale: इस प्रसंग का मुख्य विषय पुनरुत्थान और अस्तित्व का क्रम है; अतः नैतिक रूप से निंदात्मक अर्थ जोड़ना आवश्यक नहीं है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘आता है’ जोड़ने से हिंदी वाक्य स्वाभाविक बनता है और मूल में निहित क्रम स्पष्ट होता है। ‘प्राकृतिक’ को उसके सामान्य भौतिक अर्थ तक सीमित न समझा जाए, इसलिए पादटिप्पणी दी गई है।
