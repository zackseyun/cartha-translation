id: 1CO.15.50
reference: 1 Corinthians 15:50
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τοῦτο δέ φημι, ἀδελφοί, ὅτι σὰρξ καὶ αἷμα βασιλείαν θεοῦ κληρονομῆσαι οὐ ⸀δύναται, οὐδὲ ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/050.yaml
  text: 'I say this[a], brothers: flesh and blood cannot inherit the kingdom of God[b], nor does the perishable inherit the imperishable.'
translation:
  language: hi
  text: 'हे भाइयो[a], मैं यह कहता हूँ: मांस और लहू[b] परमेश्वर के राज्य को विरासत में नहीं पा सकते, और न जो नाशवान है वह अविनाशी को विरासत में पाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हे भाइयो और बहनो’; यूनानी में ‘भाइयो’ है, जो यहाँ पूरी मंडली को समावेशी रूप से संबोधित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘मांस और लहू’ वर्तमान दशा के नश्वर मानव जीवन का मुहावरा है; इसका अर्थ यह नहीं कि देह का पुनरुत्थान नहीं होगा।
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δέ φημι
  choice: मैं यह कहता हूँ
  rationale: प्रत्यक्ष कथन की शैली और Τοῦτο का संकेत सुरक्षित रहता है। δέ का हल्का संक्रमण हिन्दी में वाक्य-विन्यास और द्विबिंदु से स्वाभाविक रूप से प्रकट होता है; कोई स्पष्ट कालसूचक शब्द नहीं जोड़ा गया।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: यूनानी के पुल्लिंग बहुवचन संबोधन को रखा गया है। पौलुस के पत्रों में इससे प्रायः पूरी मंडली संबोधित होती है; यह समावेशी संभावना पादटिप्पणी में दी गई है।
- source_word: σὰρξ καὶ αἷμα
  choice: मांस और लहू
  rationale: मूल के स्थापित मुहावरे और उसके शाब्दिक चित्र को बनाए रखता है; यहाँ आशय वर्तमान दशा में नश्वर मानव जीवन से है।
- source_word: βασιλείαν θεοῦ
  choice: परमेश्वर के राज्य
  rationale: सम्बन्धकारक रचना और वाक्यांश का धर्मवैचारिक भार सीधे और प्रचलित हिन्दी में सुरक्षित है।
- source_word: κληρονομῆσαι / κληρονομεῖ
  choice: विरासत में पाना
  rationale: κληρονομέω के विरासत-संबंधी अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और दोनों प्रयोगों में समानता बनाए रखता है।
- source_word: οὐ δύναται
  choice: नहीं पा सकते
  rationale: सहायक क्रिया के साथ असमर्थता का भाव स्पष्ट है; हिन्दी में संयुक्त कर्ता ‘मांस और लहू’ के अनुसार बहुवचन स्वाभाविक है।
- source_word: ἡ φθορά
  choice: जो नाशवान है
  rationale: पुनरुत्थान के प्रसंग में क्षय और विनाश के अधीन दशा को स्पष्ट करता है, जबकि अमूर्त ‘भ्रष्टता’ से उत्पन्न नैतिक अर्थभ्रम से बचता है।
- source_word: τὴν ἀφθαρσίαν
  choice: अविनाशी
  rationale: φθορά के साथ मूल विरोध को बनाए रखता है। इसे ‘अमरता’ नहीं किया गया, क्योंकि ἀφθαρσία और ἀθανασία निकट होते हुए भी समान शब्द नहीं हैं।
theological_decisions:
- issue: पुनरुत्थान के संबंध में ‘मांस और लहू’ का अर्थ
  choice: वर्तमान अवस्था का नश्वर और नाशवान मानव जीवन
  alternative: भौतिक शरीर या पदार्थ अपने-आप में परमेश्वर के राज्य में प्रवेश नहीं कर सकता
  rationale: निकटवर्ती प्रसंग देह के परित्याग की नहीं, बल्कि नाशवान से अविनाशी दशा में उसके रूपांतरण की बात करता है। मुख्य पाठ मुहावरे को बनाए रखता है और पादटिप्पणी अतिभौतिक-विरोधी अर्थ से बचाती है।
- issue: ἀδελφοί में संबोधित जन
  choice: मुख्य पाठ में ‘भाइयो’, और संभावित समावेशी संदर्भ पादटिप्पणी में
  alternative: मुख्य पाठ में ‘भाइयो और बहनो’
  rationale: व्याकरणिक पुल्लिंग रूप सुरक्षित रहता है, पर मिश्रित मंडली को संबोधित किए जाने की प्रासंगिक संभावना भी पाठक को बताई जाती है।
- issue: φθορά और ἀφθαρσία का विरोध
  choice: ‘जो नाशवान है’ और ‘अविनाशी’
  alternative: ‘नाश’ और ‘अविनाशिता’
  rationale: चुना हुआ रूप साधारण हिन्दी में पौलुस के विरोध को स्पष्ट करता है, पर इसे केवल आत्मा की अमरता या नैतिक भ्रष्टता के अर्थ में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘विरासत में पाना’ सामान्य पाठक के लिए स्वाभाविक है और मूल की विरासत-संबंधी ध्वनि भी सुरक्षित रखता है। ‘जो नाशवान है’ अमूर्त संज्ञा की अपेक्षा अधिक सुबोध है, जबकि मूल विरोध को बनाए रखता है।
