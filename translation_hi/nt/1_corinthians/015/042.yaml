reference: 1 Corinthians 15:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὕτως καὶ ἡ ἀνάστασις τῶν νεκρῶν. σπείρεται ἐν φθορᾷ, ἐγείρεται ἐν ἀφθαρσίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/042.yaml
  text: 'So also is the resurrection of the dead: it is sown in corruption[a]; it is raised in incorruption.'
translation:
  language: hi
  text: 'मृतकों का पुनरुत्थान भी ऐसा ही है: नश्वरता[a] में बोया जाता है, अनश्वरता में उठाया जाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नाशशीलता में ... अविनाशिता में।”
    reason: φθορά और ἀφθαρσία गुण अथवा अवस्था को सूचित कर सकते हैं; यह वैकल्पिक शब्दावली उस अर्थ-छाया को अधिक औपचारिक रूप से दिखाती है।
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: भी ऐसा ही है
  rationale: यह पिछले पदों में दिए गए बीज के उदाहरण से निष्कर्ष और समानता—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡ ἀνάστασις τῶν νεκρῶν
  choice: मृतकों का पुनरुत्थान
  rationale: यह यूनानी संबंधकारक रचना को ठीक रूप में रखता है और शारीरिक पुनरुत्थान के प्रसंग को स्पष्ट करता है।
- source_word: σπείρεται
  choice: बोया जाता है
  rationale: कर्मवाच्य और बीज का कृषि-रूपक दोनों सुरक्षित रहते हैं; ‘दफनाया जाता है’ कहना रूपक की व्याख्या कर देना होता।
- source_word: ἐν φθορᾷ
  choice: नश्वरता में
  rationale: यह वर्तमान शरीर की नष्ट हो सकने वाली दशा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; केवल ‘सड़न’ कहने से अर्थ अनावश्यक रूप से संकरा हो जाता।
- source_word: ἐγείρεται
  choice: उठाया जाता है
  rationale: कर्मवाच्य सुरक्षित रहता है और पुनरुत्थान के प्रसंग में किसी बाहरी कर्ता द्वारा उठाए जाने का भाव बना रहता है, बिना कर्ता को पाठ में जोड़ने के।
- source_word: ἐν ἀφθαρσίᾳ
  choice: अनश्वरता में
  rationale: यह φθορά के ठीक विपरीत गुण को दर्शाता है और ‘नश्वरता ... अनश्वरता’ की समानांतर शब्द-रचना बनाए रखता है।
theological_decisions:
- issue: पुनरुत्थान में बोए और उठाए जाने वाले का स्वरूप
  choice: ‘बोया जाता है ... उठाया जाता है’ की रूपकात्मक और कर्मवाच्य रचना बनाए रखी गई है; ‘शरीर’ को स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: ‘शरीर दफनाया जाता है ... अविनाशी शरीर के रूप में जिलाया जाता है।’
  rationale: व्यापक प्रसंग शारीरिक पुनरुत्थान से संबंधित है, पर इस वाक्य में यूनानी पाठ ‘शरीर’ शब्द नहीं जोड़ता। वर्तमान रचना देहगत निरंतरता और परिवर्तन के तनाव को सुरक्षित रखती है तथा पुनरुत्थान को केवल आध्यात्मिक या नैतिक अर्थ नहीं देती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘मृतकों का पुनरुत्थान’ धर्मशास्त्रीय सटीकता रखता है, जबकि ‘नश्वरता ... अनश्वरता’ मूल के स्पष्ट विरोध और लय को सहज हिन्दी में बनाए रखता है।
