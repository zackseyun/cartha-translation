base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/045.yaml
  text: 'So also it is written: “The first man[a], Adam, became a living being”[b]; the last Adam became a life-giving spirit.'
translation:
  language: hi
  text: 'इसी प्रकार लिखा भी है: “पहला मनुष्य, आदम, एक जीवित प्राणी बना”[a]; अंतिम आदम जीवन देने वाली आत्मा बना।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक जीवित प्राण” अथवा पारंपरिक रूप में “एक जीवित आत्मा”; यह उत्पत्ति 2:7 की प्रतिध्वनि है।
    reason: lexical_alternative
  - marker: b
    text: या “ऐसी आत्मा बना जो जीवन देती है।” यह पदबंध पहले आदम के साथ अंतिम आदम का विरोध करता है। यूनानी अभिव्यक्ति गुणात्मक है; यह अनिवार्य रूप से मसीह की पवित्र आत्मा के साथ व्यक्तिगत पहचान नहीं कराती।
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ γέγραπται
  choice: इसी प्रकार लिखा भी है
  rationale: यह पदबंध पिछले तर्क को पवित्रशास्त्र के प्रमाण से जोड़ता है। ‘इसी प्रकार’ οὕτως का और ‘भी’ καί का संबंधसूचक बल बनाए रखता है; ‘लिखा है’ शास्त्रीय उद्धरण की स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: Ἐγένετο
  choice: बना
  rationale: यह सृष्टि के फलस्वरूप प्राप्त अवस्था को व्यक्त करता है। ‘बना’ आधुनिक हिन्दी में सहज है और ‘हो गया’ की अपेक्षा यहाँ अधिक गरिमापूर्ण है।
- source_word: ὁ πρῶτος ἄνθρωπος
  choice: पहला मनुष्य
  rationale: आदम और ‘अंतिम आदम’ के प्रतिनिधिक तथा प्रतिरूपात्मक विरोध को बनाए रखने के लिए ‘मनुष्य’ उपयुक्त है।
- source_word: Ἀδὰμ
  choice: आदम
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: εἰς ψυχὴν ζῶσαν
  choice: एक जीवित प्राणी
  rationale: उत्पत्ति 2:7 की प्रतिध्वनि में ψυχή पूरे सजीव व्यक्ति को सूचित करता है, केवल शरीर से अलग किसी अभौतिक अंश को नहीं। ‘जीवित प्राणी’ आधुनिक पाठक तक यह अर्थ स्पष्ट रूप से पहुँचाता है।
- source_word: ὁ ἔσχατος Ἀδὰμ
  choice: अंतिम आदम
  rationale: यह पौलुस के आदम-मसीह प्रतिरूप को सीधे बनाए रखता है; ‘अंतिम’ ἔσχατος के कालगत और पूर्णतासूचक दोनों बलों के अनुकूल है।
- source_word: εἰς πνεῦμα ζῳοποιοῦν
  choice: जीवन देने वाली आत्मा
  rationale: πνεῦμα का स्वाभाविक हिन्दी समतुल्य ‘आत्मा’ है और ζῳοποιοῦν का सक्रिय अर्थ ‘जीवन देने वाली’ से स्पष्ट होता है। यह गुणात्मक अभिव्यक्ति को बनाए रखता है, बिना किसी अतिरिक्त सिद्धान्तगत पहचान को पाठ में जोड़ने के।
theological_decisions:
- issue: उत्पत्ति के उद्धरण में ψυχή का मानवशास्त्रीय अर्थ
  choice: ‘जीवित प्राणी’ रखा गया है।
  alternative: ‘जीवित प्राण’ या ‘जीवित आत्मा’
  rationale: यहाँ अभिव्यक्ति आदम को एक संपूर्ण सजीव प्राणी के रूप में बताती है; यह अलग से अस्तित्व रखने वाली अभौतिक आत्मा की विशिष्ट शिक्षा नहीं देती। पारंपरिक विकल्प पादटिप्पणी में सुरक्षित है।
- issue: ‘अंतिम आदम ... जीवन देने वाली आत्मा’ का अर्थ
  choice: शाब्दिक और गुणात्मक विरोध को रखा गया है।
  alternative: ‘अंतिम आदम जीवन देने वाला आत्मा बना’ अथवा इसे स्पष्ट रूप से ‘पवित्र आत्मा’ के साथ समान ठहराना
  rationale: πνεῦμα के पहले यूनानी उपपद नहीं है और पदबंध गुणात्मक है। इसलिए अनुवाद मसीह और पवित्र आत्मा के व्यक्तित्वों को पाठ से परे जाकर एक नहीं ठहराता, पर मूल के जीवनदायक आत्मा वाले कथन को भी कमज़ोर नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जीवित प्राणी’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘जीवन देने वाली आत्मा’ मूल के संक्षिप्त और धर्मवैज्ञानिक रूप से तनावपूर्ण कथन को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
