source:
  edition: SBLGNT
  text: εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος; εἰ νεκροὶ οὐκ ἐγείρονται, Φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνῄσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/032.yaml
  text: If[a], speaking in merely human terms, I fought with wild beasts in Ephesus, what does it profit me? If the dead are not raised[b], “Let us eat and drink[c], for tomorrow we die.”
translation:
  language: hi
  text: यदि[a] मानवीय दृष्टि से मैंने इफिसुस में जंगली पशुओं से लड़ाई की, तो मुझे क्या लाभ? यदि मृतकों को जिलाया नहीं जाता[b], तो “हम खाएँ और पिएँ[c], क्योंकि कल हम मरेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “यदि, मानवीय ढंग से कहूँ तो, मैंने इफिसुस में जंगली पशुओं से लड़ाई की…” यह वाक्यांश पौलुस के बोलने के ढंग या उसके मानवीय दृष्टिकोण को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “जंगली पशुओं से लड़ाई की” का अर्थ वास्तविक पशुओं से लड़ना या क्रूर मानवीय विरोधियों से संघर्ष करना हो सकता है; मुख्य पाठ मूल यूनानी चित्र को बनाए रखता है।
    reason: alternative_reading
  - marker: c
    text: यशायाह 22:13 का उद्धरण या संकेत।
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ ἄνθρωπον
  choice: केवल मानवीय दृष्टि से
  rationale: यह यूनानी मुहावरा मानवीय स्तर या दृष्टिकोण को सूचित करता है। हिंदी में यह स्वाभाविक है और इस अस्पष्टता को खुला रखता है कि वाक्यांश पौलुस के बोलने के ढंग को बताता है या उसके संघर्ष के मानवीय परिप्रेक्ष्य को।
- source_word: ἐθηριομάχησα
  choice: मैंने ... जंगली पशुओं से लड़ाई की
  rationale: मूल क्रिया का सजीव शाब्दिक चित्र सुरक्षित रखा गया है; मुख्य पाठ यह तय नहीं करता कि पशु वास्तविक थे या क्रूर मानवीय विरोधियों के लिए रूपक।
- source_word: ἐν Ἐφέσῳ
  choice: इफिसुस में
  rationale: स्थान-नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: τί μοι τὸ ὄφελος
  choice: तो मुझे क्या लाभ हुआ?
  rationale: लाभ की धारणा और अलंकारिक प्रश्न की शक्ति दोनों को सहज हिंदी में बनाए रखता है।
- source_word: νεκροὶ
  choice: मरे हुए
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण का सरल और स्वाभाविक हिंदी रूप।
- source_word: ἐγείρονται
  choice: जिलाए नहीं जाते
  rationale: यूनानी कर्मवाच्य को सुरक्षित रखता है और मृतकों के जिलाए जाने की बात कहता है, बिना कर्ता को पाठ में जोड़ने के।
- source_word: Φάγωμεν καὶ πίωμεν
  choice: आओ, हम खाएँ और पिएँ
  rationale: प्रेरणार्थक संभावनार्थक क्रियाओं का स्वाभाविक सामूहिक आह्वान।
- source_word: αὔριον γὰρ ἀποθνῄσκομεν
  choice: क्योंकि कल तो हम मर ही जाएँगे
  rationale: वर्तमान रूप की भविष्याभिमुख उक्ति को स्वाभाविक हिंदी में व्यक्त करता है; ‘तो’ और ‘ही’ उद्धृत कथन की तात्कालिक, नियतिवादी धार को उभारते हैं।
theological_decisions:
- issue: क्या ἐθηριομάχησα वास्तविक जंगली पशुओं से संघर्ष बताता है या क्रूर मानवीय विरोध का रूपक
  choice: मुख्य पाठ में ‘जंगली पशुओं से लड़ाई की’ रखकर प्रश्न को अनिर्णीत छोड़ा गया है।
  alternative: इसे इफिसुस में क्रूर मानवीय विरोधियों से संघर्ष के रूप में स्पष्ट करना।
  rationale: मूल यूनानी पशुओं से लड़ने का चित्र देता है, पर प्रसंग उसके शाब्दिक या रूपक अर्थ को निर्णायक रूप से नहीं सुलझाता; इसलिए व्याख्यात्मक तनाव सुरक्षित रखा गया है।
- issue: κατὰ ἄνθρωπον किसे विशेषित करता है
  choice: ‘केवल मानवीय दृष्टि से’ को ऐसी स्थिति में रखा गया है कि यह पौलुस के कथन या संघर्ष के मानवीय मूल्यांकन से जुड़ सकता है।
  alternative: स्पष्ट रूप से ‘मानवीय ढंग से कहूँ तो’ अनुवाद करके इसे केवल बोलने के ढंग से जोड़ना।
  rationale: वाक्यांश की वास्तविक व्याकरणिक और अर्थगत अस्पष्टता को अत्यधिक स्पष्ट करके समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जिलाए नहीं जाते’ कर्मवाच्य और पुनरुत्थान-संदर्भ दोनों को स्पष्ट रूप से व्यक्त करता है। उद्धरण को बोलचाल की स्वाभाविक प्रेरणात्मक शैली में रखा गया है, जबकि मूल की गंभीर विडंबना बनी रहती है।
