source:
  edition: SBLGNT
  text: χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ ⸀ἡ σὺν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/010.yaml
  text: But by the grace of God I am what I am[a], and his grace toward me did not prove empty. On the contrary, I labored more than all of them—yet not I, but the grace of God that was with me.
translation:
  language: hi
  text: परन्तु परमेश्वर के अनुग्रह से मैं जो हूँ, वही हूँ; और मेरे प्रति उसका अनुग्रह निष्फल नहीं हुआ[a]। बल्कि मैंने उन सब से अधिक परिश्रम किया—फिर भी यह मैंने नहीं, बल्कि परमेश्वर के उस अनुग्रह ने किया जो मेरे साथ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “खाली नहीं हुआ”; या “व्यर्थ नहीं गया।”
    reason: κενός में “खाली,” “परिणामहीन” और “व्यर्थ” के परस्पर जुड़े अर्थ संभव हैं।
lexical_decisions:
- source_word: χάριτι δὲ θεοῦ
  choice: परन्तु परमेश्वर के अनुग्रह से
  rationale: χάριτι के साधनवाचक अर्थ को “से” द्वारा व्यक्त किया गया है; δέ पिछले कथन के साथ हल्का विरोध दिखाता है, इसलिए “परन्तु” उपयुक्त है। “अनुग्रह” पौलुस की केंद्रीय धर्मवैचारिक शब्दावली को बनाए रखता है।
- source_word: εἰμι ὅ εἰμι
  choice: मैं जो हूँ, वही हूँ
  rationale: मूल की पुनरुक्ति और पहचान पर बल को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ
  choice: मुझ पर उसका अनुग्रह
  rationale: εἰς की पौलुस की ओर निर्देशित गति/संबंध को हिन्दी के स्वाभाविक प्रयोग “मुझ पर” से व्यक्त किया गया है।
- source_word: οὐ κενὴ ἐγενήθη
  choice: निष्फल नहीं हुआ
  rationale: κενός यहाँ खालीपन के रूपक के साथ परिणामहीन या व्यर्थ होने का भाव रखता है। “निष्फल” प्रभावशीलता के संदर्भ में संक्षिप्त और स्वाभाविक है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα
  choice: बल्कि मैंने उन सब से अधिक परिश्रम किया
  rationale: κοπιάω के कठिन और थकाने वाले श्रम के भाव को “परिश्रम किया” व्यक्त करता है; तुलनात्मक वाक्यांश को सीधे “उन सब से अधिक” रखा गया है।
- source_word: οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ
  choice: फिर भी यह मैंने नहीं, बल्कि परमेश्वर के उस अनुग्रह ने किया
  rationale: यह वाक्य पौलुस के वास्तविक परिश्रम के दावे को योग्य ठहराता है और प्रभावी कर्तृत्व परमेश्वर के अनुग्रह को देता है। हिन्दी में आवश्यक क्रिया “किया” को स्पष्ट किया गया है, जो पिछले “परिश्रम किया” को दोहराती है।
- source_word: ἡ σὺν ἐμοί
  choice: जो मेरे साथ था
  rationale: σύν का सीधा अर्थ “साथ” है; संबंधवाचक उपवाक्य इसे परमेश्वर के अनुग्रह से स्पष्ट रूप से जोड़ता है।
theological_decisions:
- issue: पौलुस के परिश्रम और परमेश्वर के अनुग्रह का संबंध
  choice: पौलुस के वास्तविक परिश्रम और परमेश्वर के प्रभावी अनुग्रह—दोनों को साथ रखा गया है।
  alternative: वाक्य को या तो परमेश्वर और पौलुस के साझे काम के रूप में स्पष्ट करना, या पौलुस के परिश्रम को लगभग निष्प्रभावी कर देना।
  rationale: 'यूनानी पाठ स्पष्ट रूप से दोनों बातें कहता है: पौलुस ने अधिक परिश्रम किया, फिर भी वह इसे अपने स्वतंत्र कर्तृत्व के बजाय अपने साथ रहे परमेश्वर के अनुग्रह को सौंपता है। अनुवाद इस तनाव को किसी बाद की धर्मवैचारिक प्रणाली के अनुसार हल नहीं करता।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “अनुग्रह,” “निष्फल” और “परिश्रम” जैसे स्थापित किन्तु वर्तमान हिन्दी में समझ आने वाले शब्द मूल के धर्मवैचारिक और रूपकात्मक बल को बनाए रखते हैं।
