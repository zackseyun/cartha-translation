source:
  edition: SBLGNT
  text: τὸ δὲ κέντρον τοῦ θανάτου ἡ ἁμαρτία, ἡ δὲ δύναμις τῆς ἁμαρτίας ὁ νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/056.yaml
  text: The sting of death is sin[b][a], and the power of sin is the law.
translation:
  language: hi
  text: मृत्यु का डंक पाप है, और पाप की शक्ति व्यवस्था है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘व्यवस्था’ से यहाँ सम्भवतः विशेष रूप से मूसा की व्यवस्था का आशय है, यद्यपि शब्दावली उस व्यापक भूमिका को भी समेट सकती है जिसमें व्यवस्था पाप को उजागर करती और उसके प्रभाव को तीव्र करती है।
    reason: alternative_reading
lexical_decisions:
- source_word: κέντρον
  choice: डंक
  rationale: मृत्यु के मानवीकरण और पिछले पद के संदर्भ में यह उस घातक नुकीले साधन का स्वाभाविक रूपक है जिससे मृत्यु हानि पहुँचाती है; ‘अंकुश’ का मूल अर्थ यहाँ कम उपयुक्त है।
- source_word: θανάτου
  choice: मृत्यु का
  rationale: संबंधसूचक रूप को सहज हिन्दी में अधिकार अथवा घनिष्ठ संबंध के रूप में रखा गया है—मृत्यु से संबंधित डंक।
- source_word: ἁμαρτία
  choice: पाप
  rationale: एकवचन बनाए रखा गया है, क्योंकि यहाँ केवल अलग-अलग पापों के बजाय पाप को एक प्रभावी शक्ति या सिद्धांत के रूप में प्रस्तुत किया गया है।
- source_word: δύναμις
  choice: शक्ति
  rationale: यह पाप की सामर्थ्य अथवा प्रभावकारी बल को व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: νόμος
  choice: व्यवस्था
  rationale: पौलुस के प्रयोग में यह सम्भवतः विशेष रूप से मूसा की व्यवस्था की ओर संकेत करता है, पर अनुवाद व्यापक विधि-संबंधी अर्थ की संभावना को बंद नहीं करता।
- source_word: δὲ
  choice: और
  rationale: दोनों δέ यहाँ तीव्र विरोध से अधिक व्याख्यात्मक प्रगति और वाक्य-संबंध दिखाते हैं; हिन्दी में दूसरे खंड के आरम्भ का ‘और’ इसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘व्यवस्था’ से आशय
  choice: ‘व्यवस्था’ रखा गया, जिससे मूसा की व्यवस्था की प्रबल संभावना बनी रहे, पर अर्थ को केवल उसी तक स्पष्ट रूप से सीमित न किया जाए।
  alternative: ‘मूसा की व्यवस्था’ कहकर संदर्भ को स्पष्ट रूप से संकीर्ण करना, या ‘कानून’ कहकर सामान्य सिद्धांत पर बल देना।
  rationale: मूल यूनानी में νόμος मूसा की व्यवस्था की पौलुसी पृष्ठभूमि जगाता है, फिर भी इस संक्षिप्त कथन में व्यापक अर्थगत तनाव मौजूद है; अनुवाद उसे हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज वाक्य। ‘डंक’, ‘पाप’, ‘शक्ति’ और ‘व्यवस्था’ परिचित बाइबलीय शब्द हैं; अनावश्यक आरम्भिक संयोजक नहीं जोड़ा गया है।
