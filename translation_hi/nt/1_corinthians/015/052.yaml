base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/052.yaml
  text: in an instant[a], in the blink of an eye, at the last trumpet. For the trumpet will sound, and the dead will be raised imperishable, and we will be changed.
translation:
  language: hi
  text: एक क्षण में[a], पलक झपकते ही, अंतिम तुरही पर। क्योंकि तुरही बजेगी, और मरे हुए अविनाशी होकर जिलाए जाएँगे, और हम बदल दिए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक अर्थ है, ‘जिसे बाँटा न जा सके’; यहाँ आशय अत्यंत छोटे क्षण से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀτόμῳ
  choice: एक क्षण में
  rationale: ἄτομος मूलतः ऐसी वस्तु या अवधि को सूचित करता है जिसे और विभाजित न किया जा सके; यहाँ अत्यंत छोटे समय-बिंदु का भाव है। ‘एक क्षण में’ आधुनिक हिन्दी में स्वाभाविक रूप से वही तात्कालिकता व्यक्त करता है।
- source_word: ἐν ῥιπῇ ὀφθαλμοῦ
  choice: पलक झपकते ही
  rationale: यह अत्यंत शीघ्रता और आकस्मिकता बताने वाला मुहावरा है। ‘पलक झपकते ही’ हिन्दी का स्वाभाविक समतुल्य है और आँख की तीव्र गति की मूल छवि बनाए रखता है।
- source_word: ἐν τῇ ἐσχάτῃ σάλπιγγι
  choice: अंतिम तुरही के बजने पर
  rationale: ἐν यहाँ समय का संबंध प्रकट करता है। यह अनुवाद ἐσχάτῃ के ‘अंतिम’ अर्थ और तुरही की युगांत-संबंधी छवि को सुरक्षित रखते हुए किसी विशेष घटनाक्रम को पाठ में नहीं जोड़ता।
- source_word: σαλπίσει
  choice: तुरही बजेगी
  rationale: क्रिया का अर्थ तुरही बजना या बजाया जाना है। पिछले वाक्यांश में तुरही का स्पष्ट उल्लेख होने के कारण हिन्दी में ‘तुरही बजेगी’ स्वाभाविक और संदर्भानुकूल है।
- source_word: οἱ νεκροὶ
  choice: मरे हुए
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण मृत लोगों को सामूहिक रूप से दर्शाता है। ‘मरे हुए’ स्पष्ट और सामान्य आधुनिक हिन्दी है।
- source_word: ἐγερθήσονται
  choice: जिलाए जाएँगे
  rationale: पुनरुत्थान के प्रसंग में ἐγείρω का भविष्यत् कर्मवाच्य रूप है। ‘जिलाए जाएँगे’ पुनरुत्थान का अर्थ और कर्मवाच्य—दोनों सुरक्षित रखता है।
- source_word: ἄφθαρτοι
  choice: अविनाशी दशा में
  rationale: यह शब्द सड़न, क्षय और विनाश से मुक्त होने को दर्शाता है। ‘अविनाशी दशा में’ इसे पुनरुत्थान के परिणामी स्वरूप के रूप में स्पष्ट करता है, बिना यह बताए कि वह परिवर्तन किस प्रक्रिया से होगा।
- source_word: ἡμεῖς
  choice: हम
  rationale: यूनानी में सर्वनाम स्पष्ट और बलयुक्त है; इसे बनाए रखने से ‘मरे हुए’ और ‘हम’ के बीच पाठ का विरोध सुरक्षित रहता है।
- source_word: ἀλλαγησόμεθα
  choice: हम बदल दिए जाएँगे
  rationale: ἀλλάσσω का भविष्यत् कर्मवाच्य रूप सीधे ‘बदल दिए जाएँगे’ है। यह अनावश्यक रूप से परिवर्तन की प्रकृति को परिभाषित नहीं करता।
theological_decisions:
- issue: अंतिम तुरही के उल्लेख को किसी विशिष्ट अंत-समय व्यवस्था से जोड़ना
  choice: अंतिम तुरही के बजने पर
  alternative: आखिरी तुरही के साथ
  rationale: मूल पाठ ‘अंतिम तुरही’ कहता है, पर उसके आधार पर घटनाओं की विस्तृत धर्मवैज्ञानिक समय-सारणी नहीं देता। चुना हुआ पाठ उस सीमा का सम्मान करता है।
- issue: ‘हम’ से अभिप्रेत लोगों की पहचान
  choice: हम बदल दिए जाएँगे
  alternative: हममें से जो उस समय जीवित होंगे, वे बदल दिए जाएँगे
  rationale: मूल में प्रथम पुरुष बहुवचन को बिना व्याख्यात्मक विस्तार के रखा गया है। व्यापक संदर्भ संबंध स्पष्ट करता है, पर इस पद में अतिरिक्त परिभाषा जोड़ना उचित नहीं।
- issue: पुनरुत्थित मृतकों की अविनाशी अवस्था
  choice: मरे हुए अविनाशी दशा में जिलाए जाएँगे
  alternative: मरे हुए जिलाए जाएँगे और फिर कभी नाश न होंगे
  rationale: ἄφθαρτοι पुनरुत्थित लोगों की अवस्था बताता है। चुना हुआ रूप इस संबंध को सुरक्षित रखता है और ‘फिर कभी’ जैसी स्रोत में अप्रकट कालगत व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तुरही’, ‘अविनाशी’ और ‘जिलाए जाएँगे’ जैसे शब्द बाइबलीय प्रसंग की गंभीरता और मूल पाठ की धर्मवैज्ञानिक शब्दावली बनाए रखते हैं; वाक्य की तीव्र लय के लिए आरंभिक समय-सूचक पद संक्षिप्त रखे गए हैं।
