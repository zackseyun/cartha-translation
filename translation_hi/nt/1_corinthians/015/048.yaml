id: 1CO.15.48
reference: 1 Corinthians 15:48
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί, καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/048.yaml
  text: As is the man of dust[a], so also are those of dust; and as is the heavenly man, so also are those who are heavenly.
translation:
  language: hi
  text: जैसा मिट्टी से बना मनुष्य है, वैसे ही वे भी हैं जो मिट्टी से बने हैं; और जैसा स्वर्गीय मनुष्य है, वैसे ही वे भी हैं जो स्वर्गीय हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἷος ... τοιοῦτοι
  choice: जैसा ... वैसे ही ...
  rationale: यह सहसंबंधी रचना आदर्श प्रतिनिधि और उससे संबंधित लोगों के बीच समानता व्यक्त करती है। हिंदी में ‘जैसा ... वैसे ही ...’ स्वाभाविक है और दोनों खंडों की समानांतरता बनाए रखता है।
- source_word: χοϊκός
  choice: मिट्टी से बना / मिट्टी से बने
  rationale: यह विशेषण मिट्टी से बने या मिट्टी की प्रकृति वाले होने को दर्शाता है और पिछले पद में आदम की उत्पत्ति की ओर संकेत बनाए रखता है। ‘पार्थिव’ की अपेक्षा यह सामान्य पाठक के लिए अधिक स्पष्ट है और मिट्टी का बिंब सुरक्षित रखता है।
- source_word: ὁ χοϊκός
  choice: मिट्टी से बना मनुष्य
  rationale: यूनानी में विशेषण संज्ञा के रूप में प्रयुक्त है। निकटवर्ती संदर्भ में आदम और मसीह का प्रतिनिधिक विरोध है; इसलिए ‘मनुष्य’ जोड़ना हिंदी को स्वाभाविक और संदर्भ को स्पष्ट बनाता है।
- source_word: οἱ χοϊκοί
  choice: वे जो मिट्टी से बने हैं
  rationale: बहुवचन उन मनुष्यों की ओर संकेत करता है जो मिट्टी से बने प्रतिनिधि की प्रकृति साझा करते हैं। यह रूप एकवचन के साथ शब्दगत संबंध बनाए रखता है।
- source_word: ἐπουράνιος
  choice: स्वर्गीय
  rationale: यह शब्द स्वर्ग से संबंधित या स्वर्गीय होने का अर्थ देता है। ‘स्वर्गीय’ χοϊκός के साथ विशेषणात्मक विरोध बनाए रखता है और पद 47 के ‘स्वर्ग से’ शब्दों को अनावश्यक रूप से इस पद में नहीं लाता।
- source_word: ὁ ἐπουράνιος
  choice: स्वर्गीय मनुष्य
  rationale: संदर्भ में यह मसीह की ओर संकेत करता है। ‘मनुष्य’ जोड़ने से पहले खंड के प्रतिनिधिक व्यक्ति के साथ समानांतरता स्पष्ट रहती है।
- source_word: οἱ ἐπουράνιοι
  choice: वे जो स्वर्गीय हैं
  rationale: यह अनुवाद ऐसे मनुष्यों को दर्शाता है जो स्वर्गीय मनुष्य के अनुरूप हैं, और इसे स्वर्गदूतों के लिए प्रयुक्त पद मानने की संभावना को संदर्भानुसार टालता है, बिना उनकी दशा या नियति को अधिक विशिष्ट किए।
theological_decisions:
- issue: क्या दोनों एकवचन विशेषणों में ‘मनुष्य’ जोड़कर आदम और मसीह का विरोध स्पष्ट किया जाए
  choice: ‘मिट्टी से बना मनुष्य’ और ‘स्वर्गीय मनुष्य’
  alternative: ‘मिट्टी से बना हुआ’ और ‘स्वर्गीय जन’
  rationale: यूनानी में दोनों विशेषण संज्ञा के रूप में हैं, पर पद 45–49 का निकट संदर्भ आदम और मसीह को प्रतिनिधिक व्यक्तियों के रूप में आमने-सामने रखता है। ‘मनुष्य’ जोड़ना संदर्भ को स्पष्ट करता है, किसी अतिरिक्त सांप्रदायिक निष्कर्ष को नहीं।
- issue: οἱ ἐπουράνιοι स्वर्गीय प्राणियों को दर्शाता है या स्वर्गीय मनुष्य के अनुरूप लोगों को
  choice: 'मानवीय संदर्भ: ‘वे जो स्वर्गीय हैं’'
  alternative: ‘स्वर्गीय जन’
  rationale: यह खंड मनुष्यों के पुनरुत्थान और स्वर्गीय मनुष्य की छवि धारण करने की बात कर रहा है, स्वर्गदूतों की नहीं। यह अनुवाद उस मानवीय संदर्भ को बनाए रखते हुए उनके वर्तमान स्वरूप और भावी नियति के बीच की संभावित अर्थगत व्यापकता को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। समानांतर वाक्य-विन्यास और ‘मिट्टी’ का उत्पत्ति-संबंधी बिंब सुरक्षित रखा गया है।
