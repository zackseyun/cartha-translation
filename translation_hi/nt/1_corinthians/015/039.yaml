reference: 1 Corinthians 15:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ, ἀλλὰ ἄλλη μὲν ἀνθρώπων, ἄλλη δὲ σὰρξ κτηνῶν, ἄλλη δὲ ⸂σὰρξ πτηνῶν⸃, ἄλλη δὲ ⸀ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/039.yaml
  text: Not all flesh is the same flesh[a], but one kind is of humans, another flesh of animals, another of birds[b], and another of fish.
translation:
  language: hi
  text: सभी शरीर एक जैसे नहीं होते,[a] बल्कि मनुष्यों के शरीर एक प्रकार के, पशुओं के दूसरे प्रकार के, पक्षियों के दूसरे प्रकार के और मछलियों के दूसरे प्रकार के होते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “सारा मांस एक ही प्रकार का मांस नहीं है।”'
    reason: यूनानी में σάρξ (‘मांस/शारीरिक देह’) की पुनरावृत्ति है; मुख्य पाठ स्वाभाविक हिन्दी में उसके श्रेणीगत आशय को व्यक्त करता है।
lexical_decisions:
- source_word: σὰρξ
  choice: शरीर
  rationale: यहाँ शब्द का अर्थ पापमय स्वभाव नहीं, बल्कि मनुष्यों और अन्य जीवों की भौतिक देह है। हिन्दी में इस संदर्भ में ‘शरीर’ स्वाभाविक और स्पष्ट है; ‘मांस’ अनावश्यक रूप से केवल देह के ऊतक का बोध करा सकता है।
- source_word: οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ
  choice: हर प्रकार का शरीर एक जैसा नहीं होता
  rationale: यूनानी वाक्य का आशय सभी जीवित देहों के एक ही प्रकार के न होने से है। ‘हर प्रकार’ हिन्दी में श्रेणीगत भेद को स्पष्ट करता है और स्वाभाविक निषेध-विन्यास बनाए रखता है।
- source_word: ἄλλη
  choice: दूसरे प्रकार का
  rationale: ἄλλη यहाँ अलग-अलग श्रेणियों का भेद बताता है। दोहराया हुआ ‘दूसरे प्रकार का’ पौलुस की क्रमिक तुलना को स्पष्ट रखता है।
- source_word: ἀνθρώπων
  choice: मनुष्यों
  rationale: यह शब्द समस्त मानवजाति को सूचित करता है, केवल पुरुषों को नहीं।
- source_word: κτηνῶν
  choice: पशुओं
  rationale: इस जीव-श्रेणी की सूची में ‘पशु’ सामान्य और व्यापक हिन्दी शब्द है; यह अर्थ को केवल पालतू पशुओं तक सीमित नहीं करता।
- source_word: πτηνῶν
  choice: पक्षियों
  rationale: इस संदर्भ में उड़ने वाले जीवों के लिए ‘पक्षी’ सबसे स्वाभाविक श्रेणी-सूचक शब्द है।
- source_word: ἰχθύων
  choice: मछलियों
  rationale: यह यूनानी बहुवचन का सामान्य और स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: पौलुस के इस प्रसंग में σάρξ का अनुवाद
  choice: शरीर
  alternative: मांस; पापमय स्वभाव
  rationale: पुनरुत्थान और सृष्ट प्राणियों की भिन्न देहों के इस संदर्भ में σάρξ शाब्दिक भौतिक देह को सूचित करता है। ‘पापमय स्वभाव’ यहाँ अनुचित धर्मवैज्ञानिक अर्थ जोड़ देगा, जबकि ‘मांस’ हिन्दी में देह के पदार्थ पर अधिक संकीर्ण बल डाल सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। मुख्य पाठ में ‘प्रकार’ जोड़कर यूनानी के श्रेणीगत विरोध को स्वाभाविक हिन्दी में स्पष्ट किया गया है, जबकि पादटिप्पणी अधिक शाब्दिक संरचना सुरक्षित रखती है।
