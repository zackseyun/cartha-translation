  text: and that he appeared to Cephas[c][b][a], then to the twelve.
translation:
  language: hi
  text: और यह कि वह कैफा[a] को दिखाई दिया[b], फिर बारहों[c] को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कैफा, पतरस का अरामी नाम है।
    reason: cross_reference
  - marker: b
    text: या, “उसे कैफा ने देखा।” यूनानी क्रिया का रूप कर्मवाच्य है, पर पुनरुत्थान के बाद दर्शनों के प्रसंग में इसका अनुवाद सामान्यतः “दिखाई दिया” किया जाता है।
    reason: lexical_alternative
  - marker: c
    text: “बारहों” यीशु के प्रेरितों के समूह का स्थापित नाम है, भले ही हर समय उस समूह की वास्तविक संख्या बारह न रही हो।
    reason: cultural_note
lexical_decisions:
- source_word: ὤφθη
  choice: दिखाई दिया
  rationale: ὁράω का यह औरिस्ट कर्मवाच्य रूप पुनरुत्थान-दर्शन के संदर्भ में मुहावरेदार रूप से ‘दिखाई दिया’ कहा जाता है। यह स्वाभाविक हिन्दी है और ‘देखा गया’ की औपचारिक कर्मवाच्यता का अर्थ भी टिप्पणी में सुरक्षित रखता है।
- source_word: Κηφᾷ
  choice: कैफा को
  rationale: यह Κηφᾶς नाम का सम्प्रदान कारक रूप है। मूल यूनानी रूप को हिन्दी में लिप्यंतरित किया गया है; इसे अधिक परिचित ‘पतरस’ से नहीं बदला गया।
- source_word: εἶτα
  choice: फिर
  rationale: यह सुनाई जा रही परंपरा में क्रम को सूचित करता है; ‘फिर’ संक्षिप्त और स्वाभाविक है।
- source_word: τοῖς δώδεκα
  choice: बारहों को
  rationale: यह यीशु के प्रेरितों के स्थापित समूह-सूचक नाम को बनाए रखता है और संख्या के विषय में अन्य वृत्तांतों से सामंजस्य बैठाने के लिए इसे ‘ग्यारह’ या ‘प्रेरितों’ में नहीं बदलता।
- source_word: καὶ ὅτι
  choice: और यह कि
  rationale: पद 3–4 से चली आ रही विषय-वाक्यों की शृंखला और मूल की संरचना को बनाए रखता है।
theological_decisions:
- issue: पुनरुत्थान के बाद दर्शन की भाषा
  choice: वह ... को दिखाई दिया
  alternative: उसे ... ने देखा
  rationale: यह पुनरुत्थित यीशु के दृश्य रूप में प्रकट होने के दावे को स्वाभाविक हिन्दी में व्यक्त करता है, पर दर्शन की रीति के बारे में पाठ से अधिक नहीं कहता। औपचारिक कर्मवाच्य विकल्प टिप्पणी में दिया गया है।
- issue: यहूदा की अनुपस्थिति के बावजूद ‘बारहों’ का उल्लेख
  choice: बारहों को
  alternative: ग्यारहों को / प्रेरितों को
  rationale: यूनानी पाठ τοῖς δώδεκα कहता है। इसे स्थापित समूह-सूचक नाम मानकर ज्यों का त्यों रखा गया है और दूसरे वृत्तांतों के आधार पर सामंजस्य नहीं बैठाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘कैफा’ मूल नाम-रूप को सुरक्षित रखता है; ‘बारहों’ स्थापित सामूहिक पदवी को स्वाभाविक हिन्दी में व्यक्त करता है। सभी टिप्पणियों के संकेत मुख्य पाठ में उनके संबंधित पदांश के बाद दिए गए हैं।
