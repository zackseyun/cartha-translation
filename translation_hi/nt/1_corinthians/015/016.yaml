  yaml_path: translation/nt/1_corinthians/015/016.yaml
  text: For if the dead are not raised[a], not even Messiah has been raised.
translation:
  language: hi
  text: क्योंकि यदि मरे हुए जिलाए नहीं जाते, तो मसीह तक नहीं जिलाया गया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ γὰρ
  choice: क्योंकि यदि
  rationale: εἰ की शर्त और γάρ के व्याख्यात्मक/तर्कसूचक संबंध को पौलुस के विचार-क्रम में स्वाभाविक हिंदी में बनाए रखता है।
- source_word: νεκροὶ
  choice: मरे हुए
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में मृत व्यक्तियों को सामान्यतः दर्शाता है; ‘मरे हुए’ सहज और व्यापक है।
- source_word: οὐκ ἐγείρονται
  choice: जिलाए नहीं जाते
  rationale: वर्तमानकालीन कर्मवाच्य को बनाए रखता है और पुनरुत्थान को किसी के द्वारा किए गए जिलाने के कार्य के रूप में व्यक्त करता है।
- source_word: οὐδὲ
  choice: तो ... भी नहीं
  rationale: 'शर्त के परिणाम में समावेशी और बलात्मक अर्थ देता है: ऐसी दशा में मसीह भी जिलाया हुआ नहीं है।'
- source_word: Χριστὸς
  choice: मसीह
  rationale: हिंदी में प्रचलित यह पदवी यूनानी Χριστός के अभिषिक्त/मसीहा संबंधी अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करती है।
- source_word: ἐγήγερται
  choice: जिलाया गया है
  rationale: 'पूर्णकालीन कर्मवाच्य को सुरक्षित रखता है: कार्य पूरा हुआ है और उसका परिणाम वर्तमान में बना हुआ है।'
theological_decisions:
- issue: Χριστός को पदवी के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यहाँ Χριστός मसीही पदवी के रूप में प्रयुक्त है। ‘मसीह’ आधुनिक हिंदी बाइबलीय प्रयोग में अर्थपूर्ण, प्रचलित और किसी विशिष्ट सांप्रदायिक व्याख्या से मुक्त है।
- issue: पुनरुत्थान की क्रिया का वाच्य
  choice: जिलाया गया है
  alternative: जी उठा है
  rationale: यूनानी कर्मवाच्य को बनाए रखने से परमेश्वर के जिलाने के कार्य की अंतर्निहित संभावना मिटती नहीं, जबकि कर्ता को वहाँ स्पष्ट नहीं किया जाता जहाँ मूल पाठ भी उसे स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, तर्कपूर्ण और गरिमापूर्ण। दोनों क्रियाओं में ‘जिलाना’ रखकर यूनानी ἐγείρω की पुनरावृत्ति और वर्तमान बनाम पूर्ण रूप का अंतर यथासंभव सुरक्षित किया गया है।
