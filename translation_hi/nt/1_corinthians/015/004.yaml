    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάφη
  choice: दफनाया गया
  rationale: यह θάπτω का अओरिस्ट कर्मवाच्य रूप है। ‘दफनाया गया’ आधुनिक मानक हिन्दी में स्वाभाविक है, कर्मवाच्य बनाए रखता है, और कब्र या समाधि के स्वरूप के बारे में अतिरिक्त विवरण नहीं जोड़ता।
- source_word: ἐγήγερται
  choice: उठाया गया है
  rationale: यह ἐγείρω का पूर्णकालिक कर्मवाच्य रूप है। ‘उठाया गया है’ बीते हुए पुनरुत्थान और उसके बने रहने वाले वर्तमान परिणाम, दोनों का संकेत देता है तथा मूल का कर्मवाच्य सुरक्षित रखता है। प्रसंग स्पष्ट करता है कि यहाँ मृतकों में से उठाए जाने की बात है, इसलिए वे शब्द मुख्य पाठ में जोड़ना आवश्यक नहीं है।
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: तीसरे दिन
  rationale: यह समयसूचक दत्तिव पदबंध स्वाभाविक हिन्दी में ‘तीसरे दिन’ है। ‘तीन दिन बाद’ कहना मूल से अधिक निश्चित कालक्रम जोड़ देता।
- source_word: κατὰ τὰς γραφάς
  choice: पवित्र शास्त्रों के अनुसार
  rationale: यह मान्य पवित्र लेखों के साक्ष्य और उनके अनुरूपता को व्यक्त करता है। ‘पवित्र शास्त्र’ हिन्दी में इस विशिष्ट धार्मिक संदर्भ का स्वाभाविक नाम है; बहुवचन मूल के γραφάς को दर्शाता है।
- source_word: ὅτι
  choice: यह कि
  rationale: दोनों आशयवाचक उपवाक्यों में इसकी पुनरावृत्ति मूल की सुव्यवस्थित, अंगीकारात्मक लय को बनाए रखती है।
- source_word: καὶ
  choice: और
  rationale: मूल में दोहराए गए साधारण संयोजक को संरचना और लय बनाए रखने के लिए रखा गया है।
theological_decisions:
- issue: पुनरुत्थान की क्रिया में पक्ष और वाच्य
  choice: उठाया गया है
  alternative: उठाया गया था; जी उठा
  rationale: यूनानी पूर्णकाल ἐγήγερται पुनरुत्थान को पूरी हुई घटना के रूप में प्रस्तुत करता है जिसका परिणाम अभी कायम है, और उसका कर्मवाच्य रूप भी महत्त्वपूर्ण है। हिन्दी का ‘उठाया गया है’ इन दोनों बातों को सबसे सीधे ढंग से सुरक्षित रखता है।
- issue: ‘शास्त्रों’ का संदर्भ
  choice: पवित्र शास्त्रों
  alternative: धर्मशास्त्रों; पवित्र लेखों
  rationale: यह पद मान्य शास्त्रीय संग्रह की ओर संकेत करता है, पर उसे और अधिक सीमित या परिभाषित नहीं करता। चुना हुआ रूप आधुनिक पाठक के लिए स्पष्ट है और किसी विशिष्ट ग्रंथ-सूची को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘और यह कि’ की पुनरावृत्ति कुछ औपचारिक है, पर मूल के अंगीकारात्मक क्रम को जानबूझकर सुरक्षित रखती है। ‘उसे’ का प्रयोग हिन्दी में कर्मवाच्य वाक्य को स्वाभाविक बनाता है और कर्ता को बदले बिना पूर्ववर्ती संदर्भ से जोड़ता है।
