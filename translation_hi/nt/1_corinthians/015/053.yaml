  text: क्योंकि इस नाशवान शरीर को अविनश्वरता धारण करनी है, और इस मरणशील शरीर को अमरता धारण करनी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “इस नाशवान को अविनश्वरता धारण करनी है, और इस मरणशील को अमरता धारण करनी है।” यूनानी में इस पद में “शरीर” शब्द स्पष्ट रूप से नहीं है, यद्यपि संदर्भ से शरीर का आशय स्पष्ट है।'
    reason: lexical_alternative
