  choice: यह नाशवान शरीर
  rationale: φθαρτός का अर्थ क्षय या विनाश के अधीन होना है। निकट संदर्भ शरीर के पुनरुत्थान का है, इसलिए स्पष्टता हेतु ‘शरीर’ जोड़ा गया है।
- source_word: ἐνδύσασθαι
  choice: धारण करे
  rationale: यह वस्त्र पहनने के रूपक को dignified और सहज हिन्दी में बनाए रखता है; ‘पहन ले’ की अपेक्षा अमूर्त गुणों के साथ अधिक स्वाभाविक है।
- source_word: ἀφθαρσίαν
  choice: अविनाशिता
  rationale: यह नाशवान के साथ सीधा शब्दगत विरोध बनाए रखता है और क्षय-विनाश से परे अवस्था बताता है।
- source_word: καὶ
  choice: और
  rationale: दो समानांतर उपवाक्यों को साधारण समुच्चय से जोड़ता है।
- source_word: τὸ θνητὸν τοῦτο
  choice: यह मरणशील शरीर
  rationale: θνητός मृत्यु के अधीन होने को व्यक्त करता है। संदर्भ के आधार पर स्पष्टता और समानांतरता हेतु ‘शरीर’ जोड़ा गया है।
- source_word: ἀθανασίαν
  choice: अमरता
  rationale: मृत्यु के अधीन न रहने की अवस्था के लिए यह मानक, स्पष्ट हिन्दी शब्द है और ‘मरणशील’ के साथ स्वाभाविक विरोध बनाता है।
theological_decisions:
- issue: यद्यपि इस पद में σώμα शब्द नहीं है, दोनों उपवाक्यों में ‘शरीर’ जोड़ना
  choice: संदर्भानुसार ‘यह नाशवान शरीर’ और ‘यह मरणशील शरीर’
  alternative: ‘यह नाशवान अविनाशिता को धारण करे, और यह मरणशील अमरता को धारण करे’
  rationale: पद 42–54 का निकट संदर्भ शरीर के पुनरुत्थान और रूपांतरण पर केंद्रित है। ‘शरीर’ जोड़ना निहित संदर्भ को स्पष्ट करता है, पर मूल की अधिक शाब्दिक रचना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘धारण करे’ वस्त्र-संबंधी रूपक को बनाए रखता है। वाक्य के अंत में ‘यह आवश्यक है’ रखने से यूनानी δεῖ की अनिवार्यता और दोनों समानांतर क्रियाओं पर उसका प्रभाव स्पष्ट होता है।
