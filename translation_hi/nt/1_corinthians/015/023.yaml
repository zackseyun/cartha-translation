source:
  edition: SBLGNT
  text: ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ τοῦ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/023.yaml
  text: 'But each in his own order: Messiah the firstfruits[b][a], then those who belong to Messiah at his coming.'
translation:
  language: hi
  text: 'परन्तु हर एक अपने क्रम में: पहला फल मसीह[a] है; फिर, उसके आगमन[b] के समय, वे जो मसीह के हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ख्रीस्त’; ‘मसीह’ का अर्थ ‘अभिषिक्त जन’ है (Χριστός)।
    reason: alternative_reading
  - marker: b
    text: या ‘उपस्थिति’ अथवा ‘आना’; यहाँ παρουσία उसके भविष्य के आगमन को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: हर एक
  rationale: यह वितरणसूचक शब्द पिछले संदर्भ में बताए गए पुनरुत्थान के क्रम में प्रत्येक पक्ष को अलग-अलग दर्शाता है।
- source_word: ἐν τῷ ἰδίῳ τάγματι
  choice: अपने क्रम में
  rationale: τάγμα व्यवस्थित क्रम या स्थान को दर्शा सकता है; यहाँ पुनरुत्थान की घटनाओं का क्रम प्रमुख है, इसलिए सैन्य अर्थ वाला ‘पंक्ति’ या ‘दल’ नहीं चुना गया।
- source_word: ἀπαρχὴ
  choice: पहला फल
  rationale: यह फसल के आरम्भिक अंश की बाइबलीय छवि को बनाए रखता है और संकेत देता है कि इसके बाद और भी फल आएँगे।
- source_word: Χριστός
  choice: मसीह
  rationale: हिन्दी में ‘मसीह’ अभिषिक्त जन की उपाधि को स्वाभाविक और परिचित ढंग से व्यक्त करता है।
- source_word: οἱ τοῦ Χριστοῦ
  choice: वे जो मसीह के हैं
  rationale: सम्बन्धकारक रूप मसीह से सम्बन्ध और उसके होने का भाव व्यक्त करता है; यह अनुवाद उस संक्षिप्तता को सुरक्षित रखता है।
- source_word: παρουσίᾳ
  choice: आगमन
  rationale: इस पौलुसी और युगान्त-संबंधी संदर्भ में यह मसीह के भविष्य में आने को सूचित करता है, जबकि ‘आगमन’ शब्द मूल के आने/उपस्थित होने के भाव को अनावश्यक विस्तार के बिना रखता है।
theological_decisions:
- issue: Χριστός को उपाधि या नाम-सदृश पद के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: इस पद में Χριστός पुनरुत्थान के क्रम में उसके लोगों के विपरीत एक उपाधिसूचक पहचान रखता है। ‘मसीह’ हिन्दी बाइबलीय परम्परा में स्वाभाविक रूप से उस अर्थ को वहन करता है।
- issue: παρουσία का युगान्त-संबंधी अर्थ
  choice: आगमन
  alternative: उपस्थिति / आना
  rationale: संदर्भ भविष्य की उस घटना की ओर संकेत करता है जब मसीह के लोग जिलाए जाएँगे। ‘आगमन’ उस संकेत को स्पष्ट करता है, पर घटना के ढंग या समय के विषय में अतिरिक्त सिद्धान्त नहीं जोड़ता।
- issue: ἀπαρχή के रूपक का संरक्षण
  choice: पहला फल
  alternative: पहली उपज / प्रथम अंश
  rationale: फसल के पहले अंश का रूपक मसीह के पुनरुत्थान और बाद में उसके लोगों के पुनरुत्थान के बीच सम्बन्ध बनाता है; इसे केवल ‘पहला’ कहने से यह छवि खो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वाक्य-विन्यास रखा गया है। ‘हर एक’ सामान्य पाठक के लिए सहज है; ‘पहला फल’ मूल कृषि-रूपक को बनाए रखता है।
