source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ⸀ὑμῶν, ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/017.yaml
  text: But if Messiah has not been raised[a], your faith is futile[b]; you are still in your sins.
translation:
  language: hi
  text: पर यदि मसीह को जिलाया नहीं गया है[a], तो तुम्हारा विश्वास व्यर्थ है[b]; तुम अब भी अपने पापों में हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसीह जी उठा नहीं है।”
    reason: यूनानी क्रिया को कर्तृवाच्य भाव में भी स्वाभाविक रूप से व्यक्त किया जा सकता है, यद्यपि मुख्य पाठ उसके कर्मवाच्य रूप को सुरक्षित रखता है।
  - marker: b
    text: या, “निष्फल है।”
    reason: यूनानी शब्द में व्यर्थता के साथ फलहीनता या उद्देश्य पूरा न होने का भाव भी हो सकता है।
lexical_decisions:
- source_word: Χριστὸς
  choice: मसीह
  rationale: यहाँ Χριστός अभिषिक्त जन की उपाधि के रूप में प्रयुक्त है। ‘मसीह’ आधुनिक हिन्दी में स्वाभाविक और प्रचलित रूप है तथा शीर्षकीय अर्थ बनाए रखता है।
- source_word: ἐγήγερται
  choice: जिलाया गया है
  rationale: यूनानी पूर्णकालिक कर्मवाच्य रूप को हिन्दी के पूर्ण कर्मवाच्य से व्यक्त किया गया है। इससे घटना का वर्तमान परिणाम और निहित, किंतु अनिर्दिष्ट, कर्ता दोनों सुरक्षित रहते हैं।
- source_word: ματαία
  choice: व्यर्थ
  rationale: यह शब्द ऐसे विश्वास को बताता है जो अपेक्षित फल या उद्देश्य तक नहीं पहुँचता। ‘व्यर्थ’ संक्षिप्त, परिचित और प्रसंगानुकूल है।
- source_word: πίστις
  choice: विश्वास
  rationale: इस प्रसंग में यह कुरिन्थियों के विश्वास करने को दर्शाता है, न कि मुख्यतः उनकी विश्वासयोग्यता को।
- source_word: ἔτι
  choice: अब भी
  rationale: यह उस अवस्था के लगातार बने रहने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: अपने पापों में ही हो
  rationale: यूनानी स्थानवाचक रूपक को अत्यधिक व्याख्या किए बिना बनाए रखा गया है; ‘ही’ तर्क में इस स्थिति के जारी रहने पर बल देता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले तर्क के विपरीत परिणाम को सहज आधुनिक हिन्दी में चिह्नित करता है।
theological_decisions:
- issue: पुनरुत्थान की अभिव्यक्ति और कर्ता
  choice: जिलाया गया है
  alternative: जी उठा है
  rationale: कर्मवाच्य अनुवाद यूनानी रूप और पौलुस की अभिव्यक्ति को सुरक्षित रखता है तथा परमेश्वर को स्पष्ट कर्ता बनाकर मूल से अधिक नहीं कहता। विकल्प घटना को कर्तृवाच्य ढंग से व्यक्त करता है।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ शब्द अभिषिक्त जन की धार्मिक-राजकीय उपाधि के रूप में समझा जा सकता है। ‘मसीह’ हिन्दी पाठकों के लिए मानक और अर्थपूर्ण रूप है।
- issue: पापों में बने रहने की अवस्था
  choice: अपने पापों में ही हो
  alternative: अपने पापों के अधीन हो
  rationale: मुख्य पाठ यूनानी रूपक की खुली अर्थ-सीमा बनाए रखता है; ‘अधीन’ दोष या शक्ति की धारणा को अधिक स्पष्ट करके अर्थ को कुछ संकीर्ण कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की तर्कात्मक तीक्ष्णता बनाए रखने के लिए अर्धविराम रखा गया है। ‘अपने पापों में ही हो’ मूल रूपक को सुरक्षित रखता है और किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को मुख्य पाठ में नहीं जोड़ता।
