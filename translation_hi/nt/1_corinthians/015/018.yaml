  rationale: यह अव्यय पिछले तर्क से निकला निष्कर्ष व्यक्त करता है; हिंदी में “तो” पौलुस के काल्पनिक तर्क-प्रवाह में स्वाभाविक है।
- source_word: καὶ
  choice: भी
  rationale: यह पहले बताए गए परिणामों में मसीह में मर चुके लोगों की दशा को भी जोड़ता है।
- source_word: οἱ κοιμηθέντες
  choice: जो ... सो गए हैं
  rationale: यूनानी क्रिया मृत्यु के लिए प्रयुक्त रूपक है। “सो गए हैं” उस रूपक को बनाए रखता है, जबकि पादटिप्पणी उसका आशय स्पष्ट करती है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: यहाँ Χριστός उपाधि के रूप में है और “मसीह में” पौलुस की संबंध/एकता की भाषा को बिना विस्तार दिए सुरक्षित रखता है।
- source_word: ἀπώλοντο
  choice: नाश हो गए
  rationale: यह काल्पनिक स्थिति में उनके विनाश और उसके परिणामी हाल को व्यक्त करता है; “नाश हो गए” सामान्य आधुनिक हिंदी में स्पष्ट और गंभीर है।
theological_decisions:
- issue: पौलुस के वाक्यांश ἐν Χριστῷ में Χριστός का अनुवाद
  choice: मसीह में
  alternative: ख्रीष्ट में / क्राइस्ट में
  rationale: Χριστός यहाँ उपाधि है; “मसीह” आधुनिक हिंदी बाइबलीय भाषा में उसके अर्थ को स्थापित रूप से व्यक्त करता है।
- issue: ἀπώλοντο में निहित विनाश की प्रकृति
  choice: नाश हो गए
  alternative: खो गए / सदा के लिए नष्ट हो गए
  rationale: मूल पाठ विनाश की विस्तृत प्रकृति यहाँ नहीं बताता। इसलिए ऐसा अतिरिक्त धर्मवैज्ञानिक विवरण नहीं जोड़ा गया जो संदर्भ से आगे जाए।
