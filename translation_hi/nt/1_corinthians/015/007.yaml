lexical_decisions:
- source_word: ἔπειτα
  choice: इसके बाद
  rationale: यह कालक्रम में अगले पुनरुत्थान-दर्शन को चिह्नित करता है; आधुनिक हिन्दी में स्वाभाविक रूप से क्रम बनाए रखता है।
- source_word: ὤφθη
  choice: वह ... दिखाई दिया
  rationale: ὁράω का अओरिस्ट कर्मवाच्य यहाँ दर्शन देने के अर्थ में मुहावरेदार है। हिन्दी का ‘दिखाई दिया’ स्वाभाविक है और मूल के दृश्य-प्रकट होने के भाव को सुरक्षित रखता है।
- source_word: Ἰακώβῳ
  choice: याकूब को
  rationale: सम्प्रदान कारक उस व्यक्ति को बताता है जिसे वह दिखाई दिया; Ἰάκωβος का प्रचलित हिन्दी बाइबलीय नाम ‘याकूब’ है।
- source_word: εἶτα
  choice: फिर
  rationale: दूसरा क्रमसूचक क्रियाविशेषण अगले चरण को बताता है; ‘फिर’ स्पष्ट और सहज हिन्दी है।
- source_word: ἀποστόλοις
  choice: प्रेरितों
  rationale: इस सन्दर्भ में यह सामान्य दूतों के बजाय अधिकृत प्रेरित गवाहों के लिए प्रयुक्त पद है; ‘प्रेरित’ इसका स्थापित हिन्दी धार्मिक शब्द है।
- source_word: πᾶσιν
  choice: सभी
  rationale: यह प्रेरितों के पूरे उल्लिखित समूह पर बल देता है, बिना उसकी सदस्यता को और सीमित किए।
theological_decisions:
- issue: याकूब के संबंध में ‘सभी प्रेरितों’ की पहचान और दायरा
  choice: वाक्यांश का सीधा अनुवाद ‘सभी प्रेरितों’ किया गया है और उसके दायरे को परिभाषित नहीं किया गया।
  alternative: इसे विशेष रूप से ‘बारहों’ या बारहों से अलग नियुक्त गवाहों के किसी व्यापक समूह के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ इस समूह की निश्चित सदस्यता नहीं बताता। अनुवाद को याकूब और बाद में ‘सभी प्रेरितों’ के बीच पौलुस द्वारा व्यक्त भेद को बनाए रखना चाहिए, न कि सामंजस्य स्थापित करने वाली व्याख्या जोड़नी चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दिखाई दिया’ स्वाभाविक हिन्दी है, जबकि पादटिप्पणी यूनानी कर्मवाच्य की अधिक शाब्दिक अभिव्यक्ति देती है।
