language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅταν δὲ ὑποταγῇ αὐτῷ τὰ πάντα, ⸀τότε αὐτὸς ὁ υἱὸς ὑποταγήσεται τῷ ὑποτάξαντι αὐτῷ τὰ πάντα, ἵνα ᾖ ὁ θεὸς ⸀πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/028.yaml
  text: But when all things are subjected to him[a], then the Son himself will also be subjected to the one who subjected all things to him[b], so that God may be all in all.
translation:
  language: hi
  text: परन्तु जब सब कुछ उसके अधीन कर दिया जाएगा[a], तब पुत्र स्वयं भी उसके अधीन हो जाएगा, जिसने सब कुछ पुत्र के अधीन किया, ताकि परमेश्वर सब में सब कुछ हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारी वस्तुएँ”; यूनानी में बार-बार τὰ πάντα आया है, जो पौलुस के तर्क के समस्त सृष्टि को समेटने वाले दायरे को बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “परमेश्वर सबका सब कुछ हो” या “परमेश्वर सब कुछ में सब कुछ हो” भी सम्भव है। यूनानी अभिव्यक्ति संक्षिप्त है और उसका सटीक आशय खुला रहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: परन्तु जब
  rationale: ὅταν काल-सूचक उपवाक्य आरम्भ करता है और δέ पिछले तर्क से हल्का विरोध अथवा प्रगति दिखाता है।
- source_word: ὑποταγῇ / ὑποταγήσεται
  choice: अधीन कर दिया जाएगा / अधीन हो जाएगा
  rationale: दोनों रूपों का निष्क्रिय भाव रखा गया है; हिन्दी में यही स्वाभाविक और स्पष्ट है, जबकि एक ही ‘अधीन’ शब्द-मूल पुनरावृत्ति को बनाए रखता है।
- source_word: αὐτῷ
  choice: उसके
  rationale: सन्दर्भ में सर्वनाम पुत्र की ओर संकेत करता है; हिन्दी में ‘उसके अधीन’ सम्बन्ध की दिशा स्पष्ट करता है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का व्यापक, सृष्टिगत आशय आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त होता है; पुनरावृत्ति भी सुरक्षित रखी गई है।
- source_word: τότε αὐτὸς ὁ υἱὸς
  choice: तब पुत्र स्वयं भी
  rationale: τότε का कालक्रम ‘तब’ से और αὐτός का बल ‘स्वयं’ से व्यक्त होता है; ‘भी’ वाक्य में पहले कही गई सार्वभौमिक अधीनता के साथ पुत्र के सम्बन्ध को स्वाभाविक रूप से दर्शाता है।
- source_word: τῷ ὑποτάξαντι
  choice: उसके ... जिसने ... अधीन किया
  rationale: लेखयुक्त कृदन्त को हिन्दी के सम्बन्धवाचक विन्यास में दिया गया है, जिससे कर्ता और क्रिया दोनों स्पष्ट रहते हैं।
- source_word: ἵνα ᾖ
  choice: ताकि ... हो
  rationale: ἵνα के उद्देश्य/परिणाम और सम्भावनार्थक भाव को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: πάντα ἐν πᾶσιν
  choice: सब में सब कुछ
  rationale: यूनानी की संक्षिप्त और व्यापक अभिव्यक्ति को यथासम्भव निकट रखते हुए हिन्दी में बोधगम्य बनाया गया है; इसका दायरा केवल व्यक्तियों तक सीमित नहीं किया गया।
theological_decisions:
- issue: पुत्र का उसे अधीन करनेवाले के अधीन होना
  choice: पुत्र के भावी अधीन होने के कथन को बिना व्याख्यात्मक योग के सीधे रखा गया है।
  alternative: इसे केवल कार्यगत अधीनता बताने वाला विस्तार जोड़ना, अथवा तत्त्वगत हीनता से बचाने के लिए कथन को नरम करना।
  rationale: यूनानी पाठ इस अधीनता को स्पष्ट कहता है, पर उसके तत्त्वमीमांसात्मक अर्थ की व्याख्या नहीं करता। अनुवाद न तो तनाव मिटाता है और न बाद की धर्मवैज्ञानिक भाषा आरोपित करता है।
- issue: τὰ πάντα और πάντα ἐν πᾶσιν का दायरा
  choice: ‘सब कुछ’ और ‘सब में सब कुछ’ द्वारा व्यापकता बनाए रखी गई है।
  alternative: अन्तिम पद को ‘हर व्यक्ति में सब कुछ’ कहना।
  rationale: πᾶς की पुनरावृत्ति पौलुस के व्यापक, सृष्टिगत तर्क का अंग है; ‘हर व्यक्ति’ कहना अर्थ को अनावश्यक रूप से केवल मनुष्यों तक सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘परन्तु’, ‘अधीन’ और ‘ताकि’ जैसे परिचित शब्द औपचारिकता तथा स्पष्टता का संतुलन रखते हैं।
