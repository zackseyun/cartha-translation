language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλὰ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/040.yaml
  text: And there are heavenly bodies and earthly bodies; but the glory of the heavenly is one kind[a], and the glory of the earthly is another.
translation:
  language: hi
  text: स्वर्गीय शरीर भी होते हैं और पार्थिव शरीर भी; पर स्वर्गीय शरीरों की महिमा एक प्रकार की है, और पार्थिव शरीरों की दूसरी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σώματα
  choice: शरीर
  rationale: यह व्यापक और स्वाभाविक समतुल्य है; इससे यहाँ खगोलीय पिंडों, पुनरुत्थित शरीरों या अन्य देहधारी रूपों में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं किया जाता।
- source_word: ἐπουράνια
  choice: स्वर्गीय
  rationale: यह ‘स्वर्ग से संबंधित’ और व्यापक आकाशीय अर्थ—दोनों की संभावना बनाए रखता है तथा ‘खगोलीय’ की अपेक्षा कम संकीर्ण है।
- source_word: ἐπίγεια
  choice: पार्थिव
  rationale: यह ‘पृथ्वी से संबंधित/पृथ्वी पर का’ अर्थ देता है और ‘स्वर्गीय’ के साथ गरिमापूर्ण, स्वाभाविक विरोध बनाता है।
- source_word: ἀλλὰ
  choice: पर
  rationale: यह यूनानी के साधारण विरोधसूचक बल को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἑτέρα μὲν ... ἑτέρα δὲ
  choice: एक प्रकार की ... दूसरी
  rationale: यह केवल संख्या-भेद नहीं, बल्कि गुण या प्रकार के अंतर को स्पष्ट करता है और हिन्दी में सहज है।
- source_word: δόξα
  choice: महिमा
  rationale: यह पौलुस की धर्मवैचारिक शब्दावली को बनाए रखते हुए यहाँ निहित वैभव, तेज या विशिष्ट शोभा का अर्थ भी वहन कर सकता है।
- source_word: τῶν ἐπουρανίων ... τῶν ἐπιγείων
  choice: स्वर्गीय शरीरों की ... पार्थिव शरीरों की
  rationale: यूनानी में ‘शरीरों’ का लोप है, पर हिन्दी में उसे दोहराने से संदर्भ स्पष्ट और वाक्य स्वाभाविक रहता है।
theological_decisions:
- issue: ‘स्वर्गीय शरीरों’ और ‘पार्थिव शरीरों’ का अभिप्राय
  choice: दोनों पदों को व्यापक रूप में रखा गया है, बिना उन्हें केवल खगोलीय पिंड या विशेष प्रकार के प्राणी ठहराए।
  alternative: ‘खगोलीय पिंड और स्थलीय शरीर’ अथवा ‘स्वर्गीय प्राणी और पार्थिव प्राणी।’
  rationale: मूल में σώματα अर्थात ‘शरीर’ है। संदर्भ अलग-अलग प्रकार के शरीर और उनकी अलग महिमा दिखाता है, पर सटीक संदर्भ को संकीर्ण नहीं करता; इसलिए अनिश्चितता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य है। ‘पार्थिव’ को ‘धरती के’ के बजाय चुना गया है ताकि ‘स्वर्गीय’ के साथ संतुलित विरोध रहे, जबकि वाक्य सामान्य पाठक के लिए बोधगम्य बना रहे।
