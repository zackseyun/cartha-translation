  text: Where[a], O death, is your victory? Where, O death, is your sting?
translation:
  language: hi
  text: “हे मृत्यु, तेरी विजय कहाँ है?[a] हे मृत्यु, तेरा डंक कहाँ है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में पहले उपवाक्य का पाठ है, “हे मृत्यु, तेरा डंक कहाँ है?” यही पाठ केजेवी और कुछ अन्य पारंपरिक अनुवादों में मिलता है।
    reason: textual_variant
lexical_decisions:
- source_word: ποῦ
  choice: कहाँ है
  rationale: यह प्रश्नवाचक क्रियाविशेषण चुनौतीपूर्ण आलंकारिक प्रश्न आरम्भ करता है। ‘कहाँ है’ हिन्दी में सीधा और स्वाभाविक है तथा यूनानी पाठ में निहित न होने वाला अतिरिक्त बल नहीं जोड़ता।
- source_word: σου
  choice: तेरी / तेरा
  rationale: द्वितीय पुरुष एकवचन संबंधवाचक सर्वनाम अधिकार या संबंध व्यक्त करता है। हिन्दी में संबोधित संज्ञा के लिंग के अनुसार ‘तेरी विजय’ और ‘तेरा डंक’ स्वाभाविक रूप हैं।
- source_word: θάνατε
  choice: हे मृत्यु
  rationale: सम्बोधन एकवचन में मृत्यु को मानवीकृत करके सीधे पुकारा गया है। ‘हे मृत्यु’ उस काव्यात्मक और चुनौतीपूर्ण सम्बोधन को गरिमापूर्वक बनाए रखता है।
- source_word: νῖκος
  choice: विजय
  rationale: νῖκος का अर्थ विजय या जीत है। ‘विजय’ पुनरुत्थान के प्रसंग और पद 54 में मृत्यु के विजय में निगल लिए जाने के कथन से मेल खाता है।
- source_word: κέντρον
  choice: डंक
  rationale: κέντρον किसी डंक या नुकीली आर को सूचित कर सकता है। यहाँ मृत्यु के मानवीकरण और अगले पद की व्याख्या के संदर्भ में ‘डंक’ सबसे स्पष्ट और प्रचलित हिन्दी समतुल्य है।
theological_decisions:
- issue: पहले उपवाक्य में आलोचनात्मक पाठ का अनुवाद
  choice: मुख्य पाठ में νῖκος का अनुवाद ‘विजय’
  alternative: 'कुछ पांडुलिपियों के अनुसार पहले उपवाक्य में ‘डंक’: ‘हे मृत्यु, तेरा डंक कहाँ है?’'
  rationale: दिया गया SBLGNT पाठ पहले उपवाक्य में νῖκος पढ़ता है, इसलिए मूल-पाठ की प्राथमिकता के अनुसार ‘विजय’ रखा गया है। यह पद 54 के निकटवर्ती संदर्भ से भी जुड़ता है। प्रसिद्ध वैकल्पिक पाठ को पाठांतर-सूचना के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, काव्यात्मक और गरिमापूर्ण रूप। ‘हे मृत्यु’ से यूनानी सम्बोधन और मृत्यु का मानवीकरण सुरक्षित रहता है; ‘तेरी/तेरा’ चुनौती की सीधी, एकवचन शैली बनाए रखते हैं।
