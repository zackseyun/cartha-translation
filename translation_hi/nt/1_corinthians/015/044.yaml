base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/044.yaml
  text: It is sown a natural body; it is raised a spiritual body. If there is a natural body[a], there is also a spiritual body.
translation:
  language: hi
  text: प्राकृतिक शरीर बोया जाता है; आत्मिक शरीर जी उठाया जाता है। यदि प्राकृतिक शरीर[a] है, तो आत्मिक शरीर भी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शब्दशः, “प्राणिक शरीर” ... “आत्मिक शरीर।” यहाँ विरोध भौतिक और अभौतिक के बीच नहीं, बल्कि साधारण मानवीय प्राणी-जीवन से युक्त शरीर और परमेश्वर की आत्मा से जीवन पाने वाले शरीर के बीच है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σπείρεται
  choice: बोया जाता है
  rationale: वर्तमान कर्मवाच्य रूप और निकटवर्ती बीज के रूपक को सीधे बनाए रखता है।
- source_word: σῶμα
  choice: शरीर
  rationale: देहधारी मनुष्य के मरने और पुनरुत्थान के संदर्भ में यह सबसे सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: ψυχικόν
  choice: प्राण-संचालित
  rationale: ψυχικός यहाँ साधारण सृष्ट मानवीय जीवन (ψυχή) से संचालित शरीर को दर्शाता है। केवल ‘स्वाभाविक’ अस्पष्ट हो सकता है, ‘भौतिक’ पदार्थ और अपदार्थ का भ्रामक विरोध बना सकता है, और ‘प्राणिक’ सामान्य पाठक के लिए कम स्पष्ट है।
- source_word: ἐγείρεται
  choice: जिलाया जाता है
  rationale: पुनरुत्थान के संदर्भ में कर्मवाच्य अर्थ व्यक्त करता है और ‘उठाया जाता है’ की स्थानगत अस्पष्टता से बचते हुए मृत शरीर को जीवन दिए जाने का भाव स्पष्ट करता है।
- source_word: πνευματικόν
  choice: आत्मा-संचालित
  rationale: πνευματικός को गैर-भौतिक मानने की गलतफहमी से बचाते हुए उस शरीर का भाव देता है जो आत्मा से संचालित या अभिलक्षित है; ‘आत्मा’ यूनानी πνεῦμα में निहित कुछ संदर्भगत अस्पष्टता भी बनाए रखता है।
- source_word: Εἰ
  choice: यदि
  rationale: यूनानी शर्तवाचक रूप को बिना उसे ‘क्योंकि’ या ‘चूँकि’ में बदलकर निर्णायक बनाए सुरक्षित रखता है।
- source_word: καὶ
  choice: भी
  rationale: दूसरे प्रकार के शरीर के अस्तित्व को पहले के साथ जोड़ने वाला योगात्मक बल स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘प्राण-संचालित शरीर’ और ‘आत्मा-संचालित शरीर’ का विरोध
  choice: इसे साधारण प्राणीगत जीवन से संचालित शरीर और आत्मा से संचालित शरीर का विरोध माना गया है; दोनों को शरीर ही कहा गया है।
  alternative: ‘भौतिक शरीर’ के विपरीत ‘अभौतिक शरीर’; अथवा अधिक शब्दशः ‘प्राणिक शरीर’ और ‘आत्मिक शरीर’।
  rationale: पौलुस का विरोध शरीर और अशरीरी अस्तित्व के बीच नहीं है। σῶμα दोनों पदों में बना रहता है, जबकि विशेषण शरीर के जीवन और स्वरूप की भिन्न दशाओं को बताते हैं। अनुवाद इस तनाव को स्पष्ट रखता है, पर पुनरुत्थान-शरीर को अपदार्थ घोषित नहीं करता।
- issue: πνευματικόν में πνεῦμα का आशय
  choice: मुख्य पाठ में ‘आत्मा-संचालित’ रखा गया है, बिना यह स्पष्ट किए कि यहाँ केवल मानवीय आत्मा अभिप्रेत है या परमेश्वर का आत्मा।
  alternative: ‘पवित्र आत्मा से संचालित’ अथवा केवल ‘आत्मिक’।
  rationale: संदर्भ परमेश्वर के आत्मा की ओर संकेत कर सकता है, पर विशेषण स्वयं इस पद में ‘पवित्र’ नहीं कहता। अतः अनुवाद वास्तविक अर्थ-दिशा को दिखाते हुए अनावश्यक स्पष्टता नहीं थोपता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘प्राण-संचालित’ और ‘आत्मा-संचालित’ समानांतर संरचना से यूनानी विशेषणों का अर्थगत विरोध स्पष्ट किया गया है। फुटनोट-चिह्न [a] मुख्य पाठ में उपस्थित है।
