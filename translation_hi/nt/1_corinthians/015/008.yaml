  text: And last of all[a], as to one untimely born, he appeared also to me.
translation:
  language: hi
  text: और सबसे अंत में, मानो असमय जन्मे व्यक्ति को, वह मुझे भी दिखाई दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “मानो गर्भपात या गर्भस्राव से निकले भ्रूण को” या “मानो गिराए गए भ्रूण को।” पौलुस अपने लिए एक अत्यंत कठोर, आत्म-दीनतापूर्ण रूपक का प्रयोग करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατον δὲ πάντων
  choice: और सबके अंत में
  rationale: ἔσχατον का क्रियाविशेषणीय प्रयोग और πάντων का संबंध मिलकर दर्शन पाने वालों के क्रम में ‘सबके अंत में’ का अर्थ देते हैं; δέ यहाँ क्रम को आगे बढ़ाता है।
- source_word: ὡσπερεὶ
  choice: मानो
  rationale: यह तुलना को अनुमानात्मक ढंग से प्रस्तुत करता है; ‘मानो’ उसके तुलनात्मक और कुछ नरम किए हुए भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τῷ ἐκτρώματι
  choice: अधूरे समय पर जन्मे व्यक्ति को
  rationale: ἔκτρωμα का शाब्दिक संबंध गर्भपात से निकले भ्रूण अथवा असमय/असामान्य जन्म से है। मुख्य पाठ का यह रूपक पठनीय रहते हुए पौलुस के कठोर आत्म-दीनतापूर्ण चित्र को बनाए रखता है; अधिक शाब्दिक अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: ὤφθη
  choice: वह ... दिखाई दिया
  rationale: पुनरुत्थान-दर्शनों के इस प्रसंग में ὁράω का यह कर्मवाच्य रूप दृश्य रूप से प्रकट होने को व्यक्त करता है; हिन्दी में ‘दिखाई दिया’ स्पष्ट और स्वाभाविक है।
- source_word: κἀμοί
  choice: मुझे भी
  rationale: καί और ἐμοί के संक्षिप्त संयुक्त रूप का योगात्मक अर्थ रखता है और पौलुस को पूर्वोक्त साक्षियों की शृंखला में सम्मिलित करता है।
theological_decisions:
- issue: पौलुस के आत्म-वर्णन ἐκτρώματι का अनुवाद
  choice: मुख्य पाठ में ‘अधूरे समय पर जन्मे व्यक्ति’ का रूपक और पाद-टिप्पणी में अधिक शाब्दिक अर्थ
  alternative: ‘गर्भपात से निकले भ्रूण’, ‘गिराए गए गर्भ के समान’ अथवा ‘असामान्य रूप से जन्मे व्यक्ति’
  rationale: यूनानी शब्द अत्यंत कठोर और आत्म-दीनतापूर्ण है, पर यहाँ रूपक का ठीक संकेत विवादित है। अनुवाद उसके असामान्य जन्म और अपमानजनक तीखेपन को रखता है, बिना पौलुस की प्रेरिताई के बारे में कोई अतिरिक्त धर्मसैद्धांतिक व्याख्या आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘अधूरे समय पर जन्मे’ जानबूझकर रूपक की असामान्यता रखता है, जबकि पाद-टिप्पणी मूल यूनानी की अधिक तीखी शाब्दिक संभावना स्पष्ट करती है।
