base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/022.yaml
  text: For just as in Adam all die[a], so also in Messiah all will be made alive.
translation:
  language: hi
  text: क्योंकि जैसे आदम में सब मरते हैं, वैसे ही मसीह[a] में भी सब जिलाए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी उपाधि Χριστός का शाब्दिक अर्थ ‘अभिषिक्त’ है। यहाँ इसका प्रचलित हिन्दी रूप ‘मसीह’ है; इसे ‘ख्रीस्त’ भी लिखा जाता है।
    reason: alternative_rendering
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: क्योंकि जैसे
  rationale: ‘क्योंकि’ γάρ के व्याख्यात्मक संबंध को और ‘जैसे’ ὥσπερ की तुलना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ Ἀδὰμ
  choice: आदम में
  rationale: यह पौलुस की संक्षिप्त प्रतिनिधिक/सामूहिक भाषा को सुरक्षित रखता है और ἐν को ‘के द्वारा’ या ‘के साथ एकता में’ कहकर अनावश्यक रूप से नहीं खोलता।
- source_word: πάντες
  choice: सब
  rationale: दोनों खंडों में यूनानी के व्यापक और समान शब्द को बिना किसी धार्मिक संकीर्णता के ज्यों का त्यों रखा गया है।
- source_word: ἀποθνῄσκουσιν
  choice: मरते हैं
  rationale: वर्तमान काल यहाँ सामान्य और निरंतर सत्य बताता है; हिन्दी का सामान्य वर्तमान इसका स्वाभाविक रूप है।
- source_word: οὕτως καὶ
  choice: वैसे ही … भी
  rationale: यह ὥσπερ के साथ तुलनात्मक समानता तथा καί के योगात्मक बल, दोनों को स्पष्ट और मुहावरेदार हिन्दी में रखता है।
- source_word: ἐν τῷ Χριστῷ
  choice: मसीह में
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उसके अर्थ को व्यक्त करता है और ‘आदम में’ के समानांतर संक्षिप्तता बनाए रखता है।
- source_word: ζῳοποιηθήσονται
  choice: जिलाए जाएँगे
  rationale: यह भविष्यकाल और कर्मवाच्य—दोनों को सुरक्षित रखते हुए जीवन देने की क्रिया को संक्षिप्त, प्रतिष्ठित और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दोनों खंडों में ‘सब’ का दायरा
  choice: दोनों स्थानों पर बिना किसी सीमा या व्याख्यात्मक विशेषण के ‘सब’ रखा गया है।
  alternative: दूसरे ‘सब’ को ‘सब विश्वासियों’ के रूप में सीमित करना, या दोनों प्रयोगों का दायरा स्पष्टतः सर्वथा एक ही घोषित करना।
  rationale: यूनानी पाठ πάντες…πάντες का जानबूझकर समानांतर प्रयोग करता है, पर इसी वाक्य में उसके धर्मवैज्ञानिक विस्तार या रीति को स्पष्ट नहीं करता। अनुवाद इस तनाव को हल किए बिना सुरक्षित रखता है।
- issue: ἐν (‘में’) का संबंधगत अर्थ
  choice: ‘आदम में’ और ‘मसीह में’ की समानांतर भाषा बनाए रखी गई है।
  alternative: ‘आदम के द्वारा’ तथा ‘मसीह के द्वारा’, या ‘आदम/मसीह के साथ एकता में’।
  rationale: ‘में’ मूल की संक्षिप्त और अर्थसमृद्ध भाषा को बनाए रखता है; अन्य विकल्प संबंध को साधन या एकता के रूप में अधिक निश्चित कर देते।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य-विन्यास अपनाया गया है। ‘जिलाए जाएँगे’ बाइबिलीय संदर्भ में परिचित होने के साथ भविष्य कर्मवाच्य को ठीक रूप से व्यक्त करता है; समानांतर ‘आदम में…मसीह में’ और ‘सब…सब’ को जानबूझकर सुरक्षित रखा गया है।
