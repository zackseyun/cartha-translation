  text: The last enemy to be abolished is death[a].
translation:
  language: hi
  text: समाप्त किया जाने वाला अंतिम शत्रु मृत्यु है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “जिस अंतिम शत्रु का नाश किया जाता है, वह मृत्यु है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχατος
  choice: अंतिम
  rationale: यह क्रम में सबसे अन्त में आने वाले शत्रु को सूचित करता है और पौलुस के तर्क में अन्तकालीन क्रम को बनाए रखता है।
- source_word: ἐχθρὸς
  choice: शत्रु
  rationale: यह विरोधी अथवा बैरी शक्ति को दर्शाता है; यहाँ मृत्यु को मानवीकृत विरोधी के रूप में प्रस्तुत किया गया है।
- source_word: καταργεῖται
  choice: समाप्त किया जाने वाला
  rationale: καταργέω का आशय किसी शक्ति को निष्प्रभावी करने, उसका अन्त करने या उसे निष्क्रिय कर देने से हो सकता है। यह अभिव्यक्ति यूनानी वर्तमान निष्क्रिय रूप को स्वाभाविक हिन्दी में क्रमसूचक कथन के रूप में प्रस्तुत करती है और पूर्ण विनाश का अनावश्यक तात्त्विक दावा नहीं जोड़ती।
- source_word: ὁ θάνατος
  choice: मृत्यु
  rationale: निश्चित पद यहाँ मृत्यु को अंतिम विरोधी शक्ति के रूप में मानवीकृत करता है; हिन्दी में ‘मृत्यु’ इसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: मृत्यु की पराजय के संबंध में καταργεῖται का अनुवाद
  choice: समाप्त किया जाने वाला
  alternative: जिसका नाश किया जाता है
  rationale: मुख्य पाठ मृत्यु के शत्रु के रूप में अन्त और निष्प्रभावी हो जाने को व्यक्त करता है, पर क्रिया से अधिक विशिष्ट तात्त्विक अर्थ नहीं निकालता। ‘नाश’ एक वैध और पारंपरिक विकल्प है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘समाप्त किया जाने वाला अंतिम शत्रु’ यूनानी वाक्य के क्रम और अर्थ को स्पष्ट, सामान्य हिन्दी में सुरक्षित रखता है।
