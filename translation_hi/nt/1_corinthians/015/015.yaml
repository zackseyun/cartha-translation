  edition: SBLGNT
  text: εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ ὅτι ἤγειρεν τὸν Χριστόν, ὃν οὐκ ἤγειρεν εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/015.yaml
  text: Then we are even found to be false witnesses about God[a], because we testified about God that he raised the Messiah[b], whom he did not raise if in fact the dead are not raised.
translation:
  language: hi
  text: तब तो हम परमेश्वर के विषय में झूठे गवाह भी ठहरते हैं[a], क्योंकि हमने परमेश्वर के विरुद्ध यह गवाही दी कि उसने मसीह को जिलाया—जिसे उसने नहीं जिलाया, यदि सचमुच मरे हुओं को जिलाया नहीं जाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के विरुद्ध झूठे गवाह।” “परमेश्वर के झूठे गवाह” में यूनानी सम्बन्धकारक का सम्बन्ध कुछ खुला है; पर अगले वाक्यांश में “परमेश्वर के विरुद्ध” स्पष्ट है।
    reason: ψευδομάρτυρες τοῦ θεοῦ में सम्बन्धकारक के सम्भव सम्बन्ध को सुरक्षित रखता है, जबकि κατὰ τοῦ θεοῦ के विरोधार्थक अर्थ को मुख्य पाठ में बनाए रखता है।
lexical_decisions:
- source_word: εὑρισκόμεθα δὲ καὶ
  choice: तब तो हम ... भी ठहरते हैं
  rationale: वर्तमान कर्मवाच्य और निष्कर्षसूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ठहरते हैं’ का अर्थ है कि तर्क के अनुसार वे ऐसे सिद्ध होते हैं।
- source_word: ψευδομάρτυρες τοῦ θεοῦ
  choice: परमेश्वर के विषय में झूठे गवाह
  rationale: सम्बन्धकारक को परमेश्वर के बारे में दी गई गवाही के रूप में समझता है; अगला उपवाक्य इसी आशय को स्पष्ट करता है।
- source_word: ἐμαρτυρήσαμεν κατὰ τοῦ θεοῦ
  choice: हमने परमेश्वर के विषय में यह गवाही दी
  rationale: κατά + सम्बन्धकारक यहाँ गवाही की विषयवस्तु बताने के अर्थ में लिया गया है। ‘परमेश्वर के विरुद्ध’ व्याकरणतः सम्भव है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἤγειρεν τὸν Χριστόν
  choice: उसने मसीह को जिलाया
  rationale: ἐγείρω के पुनरुत्थान-सन्दर्भ में ‘जिलाया’ स्वाभाविक कर्मवाचक हिन्दी है; Χριστός को यहाँ उपाधि के रूप में ‘मसीह’ रखा गया है।
- source_word: ὃν οὐκ ἤγειρεν
  choice: उसने मसीह को नहीं जिलाया
  rationale: हिन्दी में सर्वनाम ‘जिसे’ की अपेक्षा संज्ञा दोहराने से कर्ता और कर्म स्पष्ट रहते हैं तथा यूनानी क्रिया की पुनरावृत्ति का बल बना रहता है।
- source_word: εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται
  choice: यदि सचमुच मरे हुए जिलाए नहीं जाते
  rationale: εἴπερ ἄρα की तर्कार्थक शर्त को ‘यदि सचमुच’ और वर्तमान कर्मवाच्य सामान्य कथन को ‘जिलाए नहीं जाते’ से व्यक्त किया गया है।
theological_decisions:
- issue: Χριστός का रूपान्तरण
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यहाँ शब्द उपाधि के रूप में प्रयुक्त है; हिन्दी में स्थापित अर्थपरक पद ‘मसीह’ उपयुक्त है।
- issue: κατὰ τοῦ θεοῦ का अर्थ
  choice: परमेश्वर के विषय में
  alternative: परमेश्वर के विरुद्ध
  rationale: सन्दर्भ में गवाही की विषयवस्तु—कि परमेश्वर ने मसीह को जिलाया—मुख्य है। फिर भी κατά + सम्बन्धकारक का सामान्य विरोधार्थक अर्थ वास्तविक सम्भावना है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: पुनरुत्थान में क्रिया का कर्मवाच्य बल
  choice: जिलाए नहीं जाते
  alternative: नहीं जी उठते
  rationale: यूनानी ἐγείρονται कर्मवाच्य है; हिन्दी का यह रूप मृतकों पर किए जाने वाले जिलाने के कार्य को बनाए रखता है और स्वयं उठने का भाव नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘तब तो’ तर्क के परिणाम को, ‘झूठे गवाह’ न्यायिक साक्ष्य के भाव को, और ‘जिलाया’ पुनरुत्थान में कर्मवाच्य बल को स्पष्ट रखता है।
