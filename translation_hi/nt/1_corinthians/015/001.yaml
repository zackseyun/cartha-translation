source:
  edition: SBLGNT
  text: Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/001.yaml
  text: I make known to you[a], brothers, the good news that I proclaimed to you, which you also received, in which you also stand,
translation:
  language: hi
  text: हे भाइयो[a], मैं तुम्हें वह शुभ समाचार बताता हूँ जिसे मैंने तुम्हें सुनाया था, जिसे तुमने भी प्राप्त किया, और जिसमें तुम भी स्थिर खड़े हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे भाइयो और बहनो”; यूनानी में “भाइयो” है, और यह पुल्लिंग रूप प्रायः पूरे विश्वासी समुदाय को संबोधित करने के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω
  choice: मैं तुम्हें ... बताता हूँ
  rationale: वर्तमानकालीन क्रिया का सीधा अर्थ ‘ज्ञात कराना/बताना’ है। ‘स्मरण दिलाता हूँ’ प्रसंग में संभव भाव है, पर वह यूनानी क्रिया का मूल अर्थ नहीं है।
- source_word: δὲ
  choice: अलग शब्द से अनूदित नहीं
  rationale: δέ यहाँ हल्का प्रसंग-परिवर्तन सूचित करता है, प्रबल विरोध नहीं। हिन्दी वाक्य में संबोधन और वाक्य-विन्यास से परिवर्तन स्वाभाविक रूप से व्यक्त हो जाता है; ‘अब’ जोड़ने से अनावश्यक कालगत अर्थ आ सकता है।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: यूनानी में पुल्लिंग संबोधन ‘भाइयो’ है। पौलुस के ऐसे प्रयोग में प्रायः पूरी विश्वासी मंडली सम्मिलित होती है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: τὸ εὐαγγέλιον
  choice: शुभ समाचार
  rationale: यह εὐαγγέλιον के पारदर्शी अर्थ ‘अच्छा/शुभ समाचार’ को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εὐηγγελισάμην
  choice: प्रचार किया था
  rationale: क्रिया शुभ समाचार घोषित करने को दर्शाती है। ‘प्रचार किया था’ हिन्दी में स्वाभाविक है और पूर्व में किए गए कार्य को व्यक्त करता है।
- source_word: παρελάβετε
  choice: ग्रहण किया
  rationale: यह संदेश या सौंपी गई शिक्षा को प्राप्त करने का अर्थ बनाए रखता है; ‘स्वीकार किया’ की अपेक्षा इसमें व्यक्तिगत अनुमोदन का अतिरिक्त भाव कम है।
- source_word: ἐν ᾧ
  choice: जिसमें
  rationale: पूर्वसर्गीय संबंध शुभ समाचार को उस क्षेत्र या आधार के रूप में प्रस्तुत करता है जिसमें वे खड़े हैं; इसे ‘जिसके द्वारा’ कहना अगले पद के विचार को समय से पहले ले आएगा।
- source_word: ἑστήκατε
  choice: स्थिर खड़े हो
  rationale: पूर्णकाल भूतकालीन स्थापना से उत्पन्न वर्तमान स्थिर अवस्था बताता है। ‘स्थिर खड़े हो’ उस निरंतर स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मिश्रित विश्वासी समुदाय के लिए ἀδελφοί का संबोधन
  choice: मुख्य पाठ में ‘हे भाइयो’, समावेशी आशय की पादटिप्पणी सहित
  alternative: ‘हे भाइयो और बहनो’
  rationale: मुख्य पाठ यूनानी के पुल्लिंग रूप को सुरक्षित रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि पौलुस के प्रयोग में संबोधन प्रायः पूरी विश्वासी मंडली को समेटता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘शुभ समाचार’ पारदर्शी शब्दावली रखता है; ‘हे भाइयो’ मूल संबोधन की औपचारिकता बनाए रखता है।
