  yaml_path: translation/nt/1_corinthians/015/035.yaml
  text: But someone will say[a], “How are the dead raised, and with what kind of body do they come?”
translation:
  language: hi
  text: लेकिन कोई कहेगा, “मरे हुए कैसे जिलाए जाते हैं[a], और वे किस प्रकार के शरीर के साथ आते हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मरे हुए कैसे जी उठते हैं?” यूनानी क्रिया कर्मवाच्य में है—शाब्दिक रूप से, “जिलाए जाते हैं”—जो दैवी कर्तृत्व की ओर संकेत कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλὰ
  choice: लेकिन
  rationale: यह शब्द एक संभावित आपत्ति या प्रश्न की ओर विरोधसूचक परिवर्तन करता है; ‘लेकिन’ आधुनिक हिन्दी में स्वाभाविक और सीधा है।
- source_word: ἐρεῖ τις
  choice: कोई कहेगा
  rationale: भविष्यत् सूचक क्रिया और अनिश्चित सर्वनाम को बनाए रखते हुए यह काल्पनिक प्रश्नकर्ता का स्वाभाविक परिचय देता है।
- source_word: Πῶς
  choice: कैसे
  rationale: प्रश्नवाचक क्रियाविशेषण को सीधे व्यक्त करता है और रीति अथवा संभावना से जुड़ा प्रश्न खुला रखता है।
- source_word: ἐγείρονται
  choice: जिलाए जाते हैं
  rationale: यूनानी कर्मवाच्य को सुरक्षित रखता है और पुनरुत्थान के प्रसंग में निहित कर्ता की ओर संकेत कर सकता है, पर उसे स्पष्ट रूप से नहीं जोड़ता।
- source_word: οἱ νεκροί
  choice: मरे हुए
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण का सहज सामूहिक हिन्दी रूप है।
- source_word: ποίῳ ... σώματι
  choice: किस प्रकार के शरीर के साथ
  rationale: ποίῳ के गुणात्मक अर्थ—‘किस प्रकार का’—को बनाए रखता है और विभक्ति को हिन्दी में स्वाभाविक रीति से व्यक्त करता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ यह दूसरे प्रश्न को पहले से जोड़ता है; प्रबल विरोध व्यक्त नहीं करता।
- source_word: ἔρχονται
  choice: आते हैं
  rationale: ἔρχομαι का सीधा अनुवाद है; इसे ‘दिखाई देते हैं’ या दूसरी बार ‘जिलाए जाते हैं’ कहकर अधिक व्याख्यायित नहीं किया गया।
theological_decisions:
- issue: पुनरुत्थान की अभिव्यक्ति और कर्तृत्व
  choice: मरे हुए कैसे जिलाए जाते हैं
  alternative: मरे हुए कैसे जी उठते हैं
  rationale: कर्मवाच्य ἐγείρονται को मुख्य पाठ में सुरक्षित रखा गया है, जिससे दैवी कर्तृत्व की संभावित ध्वनि बनी रहती है, पर पद में कर्ता को उससे अधिक स्पष्ट नहीं किया जाता जितना मूल पाठ करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘जिलाए जाते हैं’ कर्मवाच्य और पुनरुत्थान-संबंधी अर्थ को बचाता है; ‘किस प्रकार के शरीर’ ποίῳ की गुणात्मक शक्ति व्यक्त करता है।
