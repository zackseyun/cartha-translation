  rationale: रूपक पौलुस की पुनरुत्थान-संबंधी भाषा को बनाए रखता है, जबकि ‘मृत्यु की’ जोड़ने से आधुनिक पाठक के लिए आशय स्पष्ट होता है; इससे आत्मा की अवस्था के विषय में कोई अतिरिक्त सिद्धांत आरोपित नहीं किया जाता।
