  choice: मुख्य पाठ SBLGNT के अनुसार ‘हम सब मृत्यु की नींद नहीं सोएँगे, पर हम सब बदल दिए जाएँगे’ रखता है
  alternative: एक उल्लेखनीय पाठांतर का आशय है, ‘हम सब मृत्यु की नींद सोएँगे, पर हम सब नहीं बदले जाएँगे’
