  rationale: क्रिया यहाँ नैतिक गुणों के दूषित या खराब होने का भाव देती है। ‘बिगाड़ देती है’ सामान्य पाठक के लिए सहज है और ‘नष्ट कर देती है’ जैसी अतिशयोक्ति से बचती है।
- source_word: ἤθη
