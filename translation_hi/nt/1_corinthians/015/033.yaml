  rationale: यहाँ शब्द सामाजिक शिष्टाचार मात्र नहीं, बल्कि नैतिक आचरण और चरित्रगत आदतों को सूचित करता है। हिन्दी में सामूहिक अर्थ के लिए ‘नैतिकता’ स्वाभाविक है।
- source_word: χρηστὰ
  choice: अच्छी
  rationale: विशेषण का सीधा नैतिक अर्थ ‘अच्छी’ से स्पष्ट और सरल रूप में व्यक्त होता है।
- source_word: ὁμιλίαι
  choice: संगति
  rationale: शब्द मेल-जोल, संग-साथ या बातचीत का संकेत दे सकता है। प्रसंग में लोगों के साथ रहने-मिलने का व्यापक अर्थ ‘संगति’ से स्वाभाविक रूप में आता है; बातचीत वाला संभव अर्थ पादटिप्पणी में रखा गया है।
- source_word: κακαί
