  text: ὁ δὲ θεὸς ⸂δίδωσιν αὐτῷ⸃ σῶμα καθὼς ἠθέλησεν, καὶ ἑκάστῳ τῶν σπερμάτων ⸀ἴδιον σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/038.yaml
  text: But God gives it a body as he willed[a], and to each of the seeds its own body.
translation:
  language: hi
  text: परन्तु परमेश्वर उसे अपनी इच्छा के अनुसार देह देता है, और हर बीज को उसकी अपनी देह।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίδωσιν αὐτῷ
  choice: उसे ... देह देता है
  rationale: वर्तमान काल और सम्प्रदान भाव दोनों सुरक्षित रहते हैं; हिन्दी में यह स्वाभाविक है और पिछले पद के बीज की ओर संकेत करता है।
- source_word: σῶμα
  choice: देह
  rationale: यह पूरे अध्याय में शारीरिक अस्तित्व के लिए प्रयुक्त σῶμα का संगत और गरिमापूर्ण हिन्दी रूप है।
- source_word: καθὼς ἠθέλησεν
  choice: अपनी इच्छा के अनुसार
  rationale: यह परमेश्वर की इच्छा और निर्णय को व्यक्त करता है, बिना किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या के। यूनानी का भूतकालीन रूप यहाँ परमेश्वर की निर्धारित इच्छा को सूचित करता है, जबकि स्वाभाविक हिन्दी में यह वाक्यांश उपयुक्त है।
- source_word: ἑκάστῳ τῶν σπερμάτων
  choice: हर बीज को
  rationale: यूनानी पदबंध का वितरणात्मक अर्थ सरल, आधुनिक हिन्दी में व्यक्त होता है; 'हर प्रकार के बीज' कहना मूल में निहित न होने वाली व्याख्या जोड़ देता।
- source_word: ἴδιον σῶμα
  choice: उसकी अपनी देह
  rationale: ἴδιον के निजी और विशिष्ट सम्बन्ध को स्पष्ट रखता है।
theological_decisions:
- issue: बीज और देह के दृष्टान्त में परमेश्वर की सक्रियता और इच्छा
  choice: परमेश्वर प्रत्येक बीज को उसकी देह अपनी इच्छा के अनुसार देता है।
  alternative: प्रत्येक प्रकार के बीज को अलग प्रकार की देह देता है।
  rationale: चुना हुआ पाठ परमेश्वर की सक्रियता और इच्छा को सुरक्षित रखता है, पर 'प्रकार' जैसी ऐसी श्रेणी नहीं जोड़ता जो यूनानी में स्पष्ट रूप से नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। 'परन्तु' तर्कगत विरोध को और 'देह' अध्याय के पुनरुत्थान-विषयक शब्द-संबंध को बनाए रखता है।
