reference: 1 Corinthians 15:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/027.yaml
  text: For he has subjected all things under his feet. But when it says that all things have been subjected[a], it is clear that this excludes the one who subjected all things to him.
translation:
  language: hi
  text: क्योंकि उसने सब कुछ उसके पैरों तले कर दिया है। पर जब यह कहा जाता है कि “सब कुछ अधीन कर दिया गया है,” तो यह स्पष्ट है कि इसमें वह शामिल नहीं है[a] जिसने सब कुछ उसके अधीन किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसको छोड़कर जिसने सब कुछ उसके अधीन किया है।”
    reason: यूनानी ἐκτός (‘के सिवा/को छोड़कर’) के अपवादात्मक पदबंध का शब्दशः निकट विकल्प।
lexical_decisions:
- source_word: πάντα / τὰ πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का आशय व्यापक रूप से समस्त वस्तुओं और सृष्टि से है, केवल सभी मनुष्यों से नहीं। ‘सब कुछ’ आधुनिक हिन्दी में स्वाभाविक है और भजन 8 की प्रतिध्वनि को बनाए रखता है।
- source_word: ὑπέταξεν
  choice: अधीन कर दिया है
  rationale: ὑποτάσσω किसी को अधीनस्थ स्थिति में रखने को व्यक्त करता है। हिन्दी का पूर्णतासूचक रूप निर्णायक कार्य और उसके वर्तमान प्रभाव दोनों को सहज रूप से व्यक्त करता है।
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: उसके पैरों के नीचे
  rationale: यह प्रभुत्व और अधीनता का बाइबलीय मुहावरा है; शास्त्रीय प्रतिध्वनि बनाए रखने के लिए इसे लगभग शब्दशः रखा गया है।
- source_word: ὅταν δὲ εἴπῃ
  choice: पर जब कहा गया है
  rationale: यूनानी में कर्ता स्पष्ट नहीं है। कर्मवाच्य हिन्दी शास्त्र में कही गई बात की ओर संकेत करता है और कर्ता को अनावश्यक रूप से परमेश्वर ठहराने से बचता है।
- source_word: ὑποτέτακται
  choice: अधीन कर दिया गया है
  rationale: पूर्ण कर्मवाच्य किसी पूरे किए गए कार्य से बनी हुई वर्तमान अवस्था को दर्शाता है; यह हिन्दी रूप कर्मवाच्यता और परिणाम दोनों बचाता है।
- source_word: δῆλον
  choice: यह स्पष्ट है
  rationale: यह पौलुस द्वारा अपेक्षित तार्किक निष्कर्ष को सरल, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα
  choice: इसमें वह शामिल नहीं है जिसने सब कुछ उसके अधीन किया
  rationale: ἐκτός यहाँ अपवाद व्यक्त करता है। यह रूप तर्क को स्वाभाविक हिन्दी में स्पष्ट रखता है कि सब कुछ अधीन करने वाला स्वयं ‘सब कुछ’ में शामिल नहीं है।
- source_word: αὐτῷ
  choice: उसके अधीन
  rationale: समर्पण/अधीनता के भाव वाले ὑποτάσσω के साथ हिन्दी में ‘उसके अधीन’ स्वाभाविक है और उस व्यक्ति को दर्शाता है जिसके प्रति सब कुछ अधीन किया गया।
theological_decisions:
- issue: पुत्र और सब कुछ उसके अधीन करने वाले के बीच संबंध
  choice: ‘सब कुछ’ में उस व्यक्ति को स्पष्ट रूप से शामिल नहीं माना गया जिसने सब कुछ पुत्र के अधीन किया।
  alternative: ‘उसको छोड़कर जिसने सब कुछ उसके अधीन किया’ जैसा अधिक शब्दशः अपवाद-वाक्य।
  rationale: पाठ पुत्र और सब कुछ अधीन करने वाले के बीच भेद रखते हुए स्पष्ट अपवाद बताता है। अनुवाद इस तनाव और संबंध को बनाए रखता है, पर इससे आगे कोई संप्रदायगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल पर गरिमापूर्ण शैली। ‘अधीन’ की पुनरावृत्ति मूल यूनानी के ὑποτάσσω-शब्दसमूह को जानबूझकर सुरक्षित रखती है। सर्वनामों की संभावित संदर्भगत कठिनाई के बावजूद मूल की अभिव्यक्ति को अनावश्यक संज्ञाएँ जोड़कर नहीं सुलझाया गया है।
