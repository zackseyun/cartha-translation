  text: εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ⸀ἄρα τὸ κήρυγμα ἡμῶν, ⸀κενὴ καὶ ἡ πίστις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/014.yaml
  text: And if Messiah has not been raised[a], then our proclamation is empty[c][b], and your faith is empty.
translation:
  language: hi
  text: और यदि मसीह जिलाया नहीं गया है[a], तो हमारा प्रचार व्यर्थ[b] है, और तुम्हारा विश्वास[c] भी व्यर्थ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ख्रीष्ट”। यूनानी शब्द Χριστός का अर्थ “मसीह,” अर्थात् “अभिषिक्त,” है।
    reason: alternative_reading
  - marker: b
    text: “व्यर्थ” के स्थान पर दोनों जगह “खोखला” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “भरोसा”।
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: मसीह
  rationale: यहाँ Χριστός को उसके उपाधि-संबंधी अर्थ में रखा गया है। ‘मसीह’ आधुनिक हिन्दी में परिचित है और अभिषिक्त उद्धारकर्ता की धारणा को बनाए रखता है।
- source_word: ἐγήγερται
  choice: जिलाया नहीं गया है
  rationale: यह पूर्णकालिक कर्मवाच्य रूप है। ‘जिलाया नहीं गया है’ कर्मवाच्य और उसके वर्तमान तक बने परिणाम—दोनों को व्यक्त करता है तथा कर्ता को अनकहा रहने देता है।
- source_word: ἄρα
  choice: तो
  rationale: यह शर्त से निकलने वाले तार्किक निष्कर्ष को सहज हिन्दी में व्यक्त करता है।
- source_word: κήρυγμα
  choice: प्रचार
  rationale: यह सार्वजनिक रूप से घोषित संदेश और उसकी घोषणा के भाव को संक्षिप्त, परिचित हिन्दी में व्यक्त करता है; इसे केवल उपदेश देने की घटना तक सीमित नहीं करता।
- source_word: κενὸν / κενὴ
  choice: खोखला
  rationale: दोनों occurrences में एक ही शब्द रखकर पौलुस की समानांतरता बचाई गई है। ‘खोखला’ पदार्थ, आधार या वैधता से रहित होने का भाव देता है और ‘खाली विश्वास’ की अपेक्षा अधिक स्वाभाविक हिन्दी है।
- source_word: πίστις
  choice: विश्वास
  rationale: इस प्रसंग में यह कुरिन्थियों की विश्वासपूर्ण प्रतिक्रिया को दर्शाता है। ‘विश्वास’ इसका सबसे स्वाभाविक और व्यापक हिन्दी रूप है।
theological_decisions:
- issue: पुनरुत्थान की वाच्यता और कर्तृत्व
  choice: जिलाया नहीं गया है
  alternative: जी नहीं उठा है
  rationale: यूनानी पाठ कर्मवाच्य है। कर्मवाच्य को बनाए रखने से परमेश्वर द्वारा जिलाए जाने की नये नियम की भाषिक रीति सुरक्षित रहती है, पर अनकहे कर्ता को अनावश्यक रूप से स्पष्ट नहीं किया जाता।
- issue: Χριστός का उपाधि-संबंधी अर्थ
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: ‘मसीह’ अभिषिक्त जन की उपाधि का अर्थ बनाए रखता है और इस पुनरुत्थान-विवेचन में उसके मसीही पद को केवल नाम-जैसे रूप में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में ‘तो’ शर्त और निष्कर्ष का स्पष्ट संबंध दिखाता है। ‘भी’ को विश्वास वाले खंड में रखकर यूनानी καί और दोनों निष्कर्षों की समानांतरता व्यक्त की गई है।
