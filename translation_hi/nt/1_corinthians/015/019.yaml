reference: 1 Corinthians 15:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ ἐν τῇ ζωῇ ταύτῃ ⸂ἐν Χριστῷ ἠλπικότες ἐσμὲν⸃ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/019.yaml
  text: If we have hoped in Messiah for this life only[c][b][a], we are more pitiable than all people.
translation:
  language: hi
  text: यदि हमने मसीह में केवल इसी जीवन के लिए आशा रखी है,[a] तो हम सब मनुष्यों से अधिक दया के पात्र हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि केवल इसी जीवन में हमने मसीह में आशा रखी है।” यूनानी वाक्य में “केवल” के संबंध और पदक्रम को हिन्दी में एक से अधिक ढंग से व्यक्त किया जा सकता है।
    reason: वाक्य-विन्यास की वास्तविक सम्भावना और पूर्ववर्ती अधिक औपचारिक रूप को सुरक्षित रखना।
  - marker: b
    text: या, “तो हम सब मनुष्यों में सबसे अधिक दया के पात्र हैं।”
    reason: यूनानी तुलनात्मक रूप को हिन्दी में महत्तम भाव से भी स्वाभाविक रूप से व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: εἰ
  choice: यदि
  rationale: यह शर्तसूचक वाक्य का आरम्भ करता है; ‘यदि’ स्वाभाविक और औपचारिक हिन्दी रूप है।
- source_word: ἐν τῇ ζωῇ ταύτῃ
  choice: इसी जीवन के लिए
  rationale: μόνον के साथ मिलकर आशा को वर्तमान जीवन तक सीमित बताता है; हिन्दी में यह क्रम अर्थ को स्पष्ट रखता है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: पौलुस के महत्त्वपूर्ण संबंधसूचक पदबंध ‘में’ को बनाए रखा गया है और Χριστός का पदवीगत अर्थ ‘मसीह’ से व्यक्त किया गया है।
- source_word: ἠλπικότες ἐσμὲν
  choice: हमने ... आशा रखी है
  rationale: परिप्रयुक्त पूर्णकाल अब तक बनी हुई, स्थापित आशा को दर्शाता है; हिन्दी पूर्ण वर्तमान इसका स्वाभाविक रूप है।
- source_word: μόνον
  choice: केवल
  rationale: इसे ‘इसी जीवन के लिए’ के साथ रखकर स्पष्ट किया गया है कि सीमा आशा की अवधि/क्षेत्र पर है, न कि आशा रखने की क्रिया पर।
- source_word: ἐλεεινότεροι
  choice: अधिक दया के पात्र
  rationale: तुलनात्मक रूप और ‘दया के योग्य’ होने का अर्थ दोनों सुरक्षित रहते हैं; ‘अधिक अभागे’ अनावश्यक रूप से दुःख या दुर्दशा का भाव जोड़ सकता है।
- source_word: πάντων ἀνθρώπων
  choice: सब मनुष्यों से
  rationale: यह मानवजाति के सामान्य संदर्भ और यूनानी तुलनात्मक रचना दोनों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: पौलुस के पदबंध ἐν Χριστῷ में Χριστῷ का अनुवाद
  choice: मसीह में
  alternative: ख्रीस्त में / मसीह पर
  rationale: ‘मसीह’ पदवी का अर्थ सुरक्षित रखता है, और ‘में’ पौलुस के संबंधसूचक पदबंध की धर्मवैचारिक व्यापकता को ‘पर भरोसा’ जैसे एक ही अर्थ तक सीमित नहीं करता।
- issue: μόνον का क्षेत्र
  choice: आशा केवल इसी जीवन के लिए सीमित है
  alternative: इस जीवन में हमने केवल आशा ही रखी है
  rationale: प्रसंग और वाक्य-संरचना का आशय वर्तमान जीवन तक सीमित आशा है। अनुवाद यह स्पष्ट करता है, पर पुनरुत्थान अथवा परलोक के बारे में इस पद से अधिक व्याख्या नहीं जोड़ता।
- issue: ἐλεεινότεροι का तुलनात्मक बल
  choice: सब मनुष्यों से अधिक दया के पात्र
  alternative: सब मनुष्यों में सबसे अधिक दया के पात्र
  rationale: मूल के तुलनात्मक रूप को सीधे सुरक्षित रखा गया है; हिन्दी में महत्तम भाव वाला वैकल्पिक रूप सम्भव है, पर आवश्यक नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप। ‘आशा रखी है’ स्थापित और अब तक बनी आशा को व्यक्त करता है। ‘मसीह में’ पौलुस के विशिष्ट पदबंध को बनाए रखता है; वाक्य को किसी संप्रदायगत व्याख्या की ओर नहीं मोड़ा गया।
