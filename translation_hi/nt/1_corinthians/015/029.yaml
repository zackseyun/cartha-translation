  to: नहीं तो, जो लोग मृतकों के लिए[a] बपतिस्मा ले रहे हैं, वे क्या करेंगे? यदि मृतक बिलकुल भी नहीं जिलाए जाते, तो वे उनके लिए बपतिस्मा क्यों ले रहे हैं?
