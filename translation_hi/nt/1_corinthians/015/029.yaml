  source_fidelity: The draft accurately reflects the rhetorical inference, the progressive/customary passive sense of βαπτιζόμενοι/βαπτίζονται, the emphatic εἰ ὅλως, and the passive resurrection expression. However, ‘मृतकों की ओर से’ tends in current Hindi to mean ‘from the dead’ or ‘on the dead's side,’ rather than conveying the debated genitive sense of ὑπέρ (‘for/on behalf of’).
  naturalness: The wording is otherwise clear and appropriately formal. ‘मरे हुए’ is natural as a substantival expression, but using ‘मृतक’ consistently is slightly more polished in this compact argument.
  terminology: ‘बपतिस्मा लेना’ is established modern Hindi Christian usage and suitably conveys the passive event without overexplaining it. ‘मृतकों के लिए’ is the least marked natural Hindi rendering of the disputed phrase; the note preserves other viable senses, including representative ‘की ओर से.’
  issues:
  - severity: medium
    issue: ‘मृतकों की ओर से’ is not a natural equivalent for ὑπὲρ τῶν νεκρῶν in Hindi.
    rationale: In modern Hindi, ‘X की ओर से’ commonly marks source, agency, or advocacy (‘from/on behalf of X’) and can be read as baptism administered by the dead. ‘मृतकों के लिए’ better represents the broad, disputed force of ὑπέρ without deciding the historical practice. The same change is needed for ὑπὲρ αὐτῶν.
