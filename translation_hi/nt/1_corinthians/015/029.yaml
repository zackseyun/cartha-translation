id: 1CO.15.29
reference: 1 Corinthians 15:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ ⸀αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/029.yaml
  text: Otherwise[a], what will those do who are being baptized on behalf of the dead? If the dead are not raised at all, why then are they being baptized on their behalf?
translation:
  language: hi
  text: नहीं तो, जो लोग मृतकों के लिए[a] बपतिस्मा ले रहे हैं, वे क्या करेंगे? यदि मृतक बिलकुल भी नहीं जिलाए जाते, तो वे उनके लिए बपतिस्मा क्यों ले रहे हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मृतकों की ओर से,’ ‘मृतकों के कारण,’ या—कम सम्भावना से—‘मृतकों के ऊपर।’ यूनानी पूर्वसर्ग के एक से अधिक अर्थ सम्भव हैं, और पौलुस यहाँ जिस प्रथा का उल्लेख करते हैं उसका ठीक स्वरूप अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεὶ
  choice: नहीं तो
  rationale: यहाँ यह शब्द पिछले तर्क के आधार पर एक वैकल्पिक परिणाम प्रस्तुत करता है; ‘नहीं तो’ पौलुस के आलंकारिक संक्रमण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τί ποιήσουσιν
  choice: वे क्या करेंगे
  rationale: ποιέω के व्यापक अर्थ ‘करना’ को बनाए रखा गया है, ताकि प्रश्न को किसी विशेष परिणाम तक सीमित न किया जाए।
- source_word: οἱ βαπτιζόμενοι
  choice: जो लोग ... बपतिस्मा ले रहे हैं
  rationale: वर्तमानकालिक कर्मवाच्य कृदंत को हिन्दी के प्रचलित धार्मिक मुहावरे में व्यक्त किया गया है; इससे चल रही या प्रचलित रीति का संकेत मिलता है, पर उसकी वैधता पर कोई निर्णय नहीं दिया जाता।
- source_word: ὑπὲρ τῶν νεκρῶν
  choice: मृतकों की ओर से
  rationale: सम्बन्धकारक के साथ ὑπέρ का सामान्य प्रतिनिधिक अर्थ ‘की ओर से’ है। विवादित अन्य सम्भावनाएँ पाद-टिप्पणी में रखी गई हैं।
- source_word: εἰ ὅλως
  choice: यदि ... बिलकुल भी
  rationale: ὅλως की बलात्मकता को ‘बिलकुल भी’ से व्यक्त किया गया है।
- source_word: νεκροὶ οὐκ ἐγείρονται
  choice: मरे हुए ... नहीं जिलाए जाते
  rationale: कर्मवाच्य रूप को बनाए रखा गया है और हिन्दी बाइबलीय प्रयोग में स्वाभाविक ‘जिलाए जाते’ चुना गया है; इससे निहित कर्ता को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: τί καὶ
  choice: तो ... क्यों
  rationale: इस आलंकारिक पुनरुक्ति में τί καί का तर्कात्मक बल स्वाभाविक हिन्दी में ‘तो ... क्यों’ से व्यक्त होता है।
- source_word: βαπτίζονται
  choice: वे ... बपतिस्मा क्यों ले रहे हैं
  rationale: पहले कृदंत के साथ कालगत संगति रखी गई है और प्रचलित हिन्दी अभिव्यक्ति का उपयोग किया गया है।
- source_word: ὑπὲρ αὐτῶν
  choice: उनकी ओर से
  rationale: सर्वनाम को ‘मरे हुओं’ की ओर लौटने दिया गया है और पहले ὑπέρ के साथ शब्दगत समानता बनाए रखी गई है।
theological_decisions:
- issue: मृतकों की ओर से बपतिस्मा लेने का अर्थ
  choice: वाक्यांश को न्यूनतम व्याख्यात्मक रूप में ‘मृतकों की ओर से बपतिस्मा’ रखा गया है।
  alternative: ‘मृतकों के लिए,’ ‘मृतकों के कारण,’ या ‘मृतकों के ऊपर’ बपतिस्मा
  rationale: यह वाक्यांश ऐतिहासिक और धर्मवैज्ञानिक रूप से अत्यन्त विवादित है। अनुवाद किसी विशेष प्रथा या सम्प्रदायगत व्याख्या का समर्थन नहीं करता, बल्कि पौलुस के पुनरुत्थान-सम्बन्धी आलंकारिक तर्क और मूल की अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बपतिस्मा लेना’ हिन्दी मसीही प्रयोग में ‘बपतिस्मा दिया जाना’ की अपेक्षा अधिक स्वाभाविक है, यद्यपि यूनानी रूप व्याकरणतः कर्मवाच्य है। ‘मृतकों’ और ‘मरे हुए’ का नियंत्रित वैविध्य क्रमशः पूर्वसर्गीय वाक्यांश और पुनरुत्थान-वचन में स्वाभाविक हिन्दी के लिए रखा गया है।
