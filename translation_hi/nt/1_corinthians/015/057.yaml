reference: 1 Corinthians 15:57
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τῷ δὲ θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/057.yaml
  text: But thanks be to God[a], who gives us the victory through our Lord Jesus the Messiah.
translation:
  language: hi
  text: परन्तु परमेश्वर का धन्यवाद हो, जो हमारे प्रभु यीशु मसीह के द्वारा हमें विजय देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले कथन में मृत्यु और पाप की शक्ति से उस पर परमेश्वर की विजय की ओर हल्का विरोधात्मक मोड़ दिखाता है।
- source_word: τῷ θεῷ χάρις
  choice: परमेश्वर का धन्यवाद हो
  rationale: यहाँ χάρις का अर्थ 'अनुग्रह' नहीं, बल्कि परमेश्वर के प्रति धन्यवाद की प्रचलित उद्घोषणा है।
- source_word: τῷ διδόντι
  choice: जो ... देता है
  rationale: वर्तमानकालिक substantival participle परमेश्वर को विजय देनेवाले के रूप में वर्णित करता है; यह सामान्य और निरंतर सत्य का भाव रखता है।
- source_word: ἡμῖν τὸ νῖκος
  choice: हमें विजय
  rationale: ἡμῖν प्राप्तकर्ता को और νῖκος संदर्भ में मृत्यु पर उस निश्चित विजय को व्यक्त करता है; हिन्दी में बिना अनावश्यक निश्चयवाचक चिह्न के यह स्वाभाविक है।
- source_word: διὰ τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु ... के द्वारा
  rationale: सम्बन्धकारक के साथ διά माध्यम को दर्शाता है; 'के द्वारा' इसे स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός अभिषिक्त उद्धारकर्ता की उपाधि है। हिन्दी में 'मसीह' अर्थपूर्ण और प्रचलित उपाधि है, इसलिए अलग व्याख्यात्मक पद या पादटिप्पणी आवश्यक नहीं।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστός का रूपान्तरण
  choice: यीशु मसीह
  alternative: यीशु ख्रीष्ट / यीशु, मसीहा
  rationale: '''मसीह'' आधुनिक मानक हिन्दी में स्थापित, अर्थवाही उपाधि है और यूनानी Χριστός के अभिषिक्त जन वाले शीर्षकीय अर्थ को सुरक्षित रखती है।'
- issue: विजय का कर्ता और माध्यम
  choice: परमेश्वर विजय देता है; वह हमारे प्रभु यीशु मसीह के द्वारा मिलती है
  alternative: यीशु मसीह स्वयं व्याकरणिक कर्ता हैं
  rationale: यूनानी वाक्य में τῷ θεῷ और τῷ διδόντι एक ही कर्ता, परमेश्वर, को सूचित करते हैं, जबकि διά माध्यम को व्यक्त करता है; अनुवाद इसी भेद को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। 'परन्तु' मूल के हल्के विरोध को, और 'धन्यवाद हो' स्तुतिपरक उद्घोषणा को बनाए रखता है। कोई पादटिप्पणी आवश्यक नहीं, क्योंकि 'मसीह' हिन्दी में Χριστός की सुव्यवस्थित अर्थवाही उपाधि है।
