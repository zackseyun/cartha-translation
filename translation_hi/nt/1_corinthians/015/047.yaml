  text: ὁ πρῶτος ἄνθρωπος ἐκ γῆς χοϊκός, ὁ δεύτερος ⸀ἄνθρωπος ἐξ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/047.yaml
  text: The first man was from the earth[a], made of dust; the second man is from heaven.
translation:
  language: hi
  text: पहला मनुष्य धरती से था, मिट्टी का बना हुआ[a]; दूसरा मनुष्य स्वर्ग से है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मिट्टी का।” यूनानी विशेषण आदम के मिट्टी से बनाए जाने की प्रतिध्वनि करता है।
    reason: मूल विशेषण के संक्षिप्त शाब्दिक रूप और सृष्टि-वृत्तांत से उसके संबंध को बताना।
lexical_decisions:
- source_word: πρῶτος
  choice: पहला
  rationale: यह क्रमसूचक विशेषण पौलुस के आदम और मसीह के समानांतर विरोध में पहले प्रतिनिधि मनुष्य को दर्शाता है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: दोनों खंडों में यही शब्द आदम और मसीह के लिए प्रतिनिधिक रूप से प्रयुक्त है; ‘मनुष्य’ स्वाभाविक हिन्दी है और मूल की पुनरावृत्ति बनाए रखता है।
- source_word: ἐκ γῆς
  choice: धरती से
  rationale: ἐκ के साथ γῆ उद्गम या स्रोत बताता है और आदम की धरती से रचना की ओर संकेत करता है।
- source_word: χοϊκός
  choice: मिट्टी का बना हुआ
  rationale: विशेषण का अर्थ मिट्टी या धूल से बना हुआ है। यह उत्पत्ति-वृत्तांत की प्रतिध्वनि को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: δεύτερος
  choice: दूसरा
  rationale: यह पहले मनुष्य के विपरीत दूसरे प्रतिनिधि मनुष्य को दर्शाता है और मूल की समानांतर संरचना बचाता है।
- source_word: ἐξ οὐρανοῦ
  choice: स्वर्ग से
  rationale: यह स्वर्गीय उद्गम को व्यक्त करता है; प्रसंग में ‘आकाश से’ कहना अर्थ को अनावश्यक रूप से भौतिक बना देता।
theological_decisions:
- issue: ‘दूसरा मनुष्य’ की मसीह-संबंधी पहचान
  choice: मूल के अनुसार केवल ‘दूसरा मनुष्य’ रखा गया है।
  alternative: ‘दूसरा मनुष्य, मसीह’
  rationale: प्रसंग दूसरे मनुष्य की पहचान मसीह के रूप में कराता है, पर इस पद के यूनानी पाठ में उनका नाम स्पष्ट रूप से नहीं है; इसलिए व्याख्यात्मक जोड़ नहीं किया गया।
- issue: दोनों क्रियारहित यूनानी खंडों का काल
  choice: पहले खंड में ‘था’ और दूसरे में ‘है’
  alternative: दोनों खंडों में एक ही काल रखना
  rationale: यूनानी में क्रिया निहित है। प्रसंगानुकूल हिन्दी में पहला मनुष्य अतीत में आया हुआ बताया जाता है, जबकि दूसरे मनुष्य के स्वर्गीय उद्गम को वर्तमान कथन के रूप में व्यक्त करना मूल की स्वाभाविक समझ और उसके तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘पहला मनुष्य … दूसरा मनुष्य’ की समानांतर रचना और ‘धरती/मिट्टी’ बनाम ‘स्वर्ग’ का विरोध सुरक्षित रखा गया है।
