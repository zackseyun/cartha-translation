  text: καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, ⸀φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/049.yaml
  text: And just as we have borne the image of the man of dust[a], we will also bear the image of the heavenly man.
translation:
  language: hi
  text: और जैसे हमने मिट्टी से बने मनुष्य का स्वरूप धारण किया है, वैसे ही हम स्वर्गीय मनुष्य का स्वरूप भी धारण करेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में है, “हम स्वर्गीय मनुष्य का स्वरूप भी धारण करें।”
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: जैसे … वैसे ही
  rationale: तुलना और दोनों खंडों के स्पष्ट पारस्परिक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐφορέσαμεν
  choice: हमने … धारण किया है
  rationale: φορέω के ‘धारण करना/अपने ऊपर लिए रहना’ भाव को रखता है और आदम-संबंधी स्वरूप में अब तक की सहभागिता को वर्तमान स्थिति से जोड़ता है।
- source_word: εἰκόνα
  choice: स्वरूप
  rationale: यहाँ बाहरी चित्र मात्र नहीं, प्रतिनिधिक समानता का भाव है; ‘स्वरूप’ आदम और मसीह के बीच समानांतरता को सहज हिन्दी में सुरक्षित रखता है।
- source_word: τοῦ χοϊκοῦ
  choice: मिट्टी से बने मनुष्य का
  rationale: χοϊκός की मिट्टी से निर्मित होने की उत्पत्ति-वाचक प्रतिध्वनि और पिछले पद के मनुष्य-संदर्भ को स्पष्ट करता है।
- source_word: φορέσομεν
  choice: हम … धारण करेंगे
  rationale: SBLGNT के भविष्यकालीन निदर्शक पाठ को दर्शाता है और भावी पुनरुत्थान-परिवर्तन की प्रतिज्ञा को बनाए रखता है।
- source_word: τοῦ ἐπουρανίου
  choice: स्वर्गीय मनुष्य का
  rationale: पिछले संदर्भ के ‘स्वर्गीय मनुष्य’ और मिट्टी से बने मनुष्य के समानांतर विरोध को सुरक्षित रखता है।
- source_word: καὶ
  choice: भी
  rationale: दूसरे खंड में इसके योगात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दूसरी क्रिया का भविष्यकालीन निदर्शक बनाम आग्रहसूचक पाठ
  choice: हम … धारण करेंगे
  alternative: हम … धारण करें
  rationale: मुद्रित SBLGNT में φορέσομεν भविष्यकालीन निदर्शक है। प्रमुख आग्रहसूचक पाठांतर को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘जैसे … वैसे ही’ से यूनानी तुलना स्पष्ट की गई है; ‘स्वरूप धारण करना’ दोनों खंडों की रूपकात्मक समानांतरता बनाए रखता है।
