  text: δεῖ γὰρ αὐτὸν βασιλεύειν ἄχρι ⸀οὗ θῇ πάντας τοὺς ἐχθροὺς ὑπὸ τοὺς πόδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/025.yaml
  text: For he must reign until he has put all his enemies under his feet[a][b].
translation:
  language: hi
  text: क्योंकि उसे तब तक राज्य करना आवश्यक है, जब तक वह अपने सभी शत्रुओं को अपने पैरों के नीचे न रख दे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक वह अपने सभी शत्रुओं को अपने पैरों के नीचे रखे।” यूनानी वाक्य-रचना हिन्दी में ‘रख दे’ और ‘रखे’ जैसे पक्षगत भेद को अनिवार्य नहीं ठहराती।
    reason: lexical_alternative
  - marker: b
    text: शत्रुओं को “पैरों के नीचे” रखना उनकी पूर्ण अधीनता का बाइबिलीय चित्र है; भजन 110:1 से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: δεῖ
  choice: आवश्यक है
  rationale: यह दैवी आवश्यकता या निश्चितता का भाव व्यक्त करता है। ‘आवश्यक है’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से बलयुक्त है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में संबंध को स्पष्ट और सहज बनाता है।
- source_word: αὐτὸν βασιλεύειν
  choice: उसका ... राज्य करना
  rationale: यूनानी में कर्मकारक कर्ता के साथ infinitive संरचना है। हिन्दी की ‘उसका राज्य करना आवश्यक है’ संरचना अर्थ और वाक्यगत संबंध दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἄχρι οὗ
  choice: तब तक ... जब तक
  rationale: यह समय की सीमा बताता है। हिन्दी का सहसंबंधी प्रयोग स्वाभाविक है और अपने आप यह नहीं कहता कि उसके बाद राज्य समाप्त हो जाएगा।
- source_word: θῇ
  choice: न कर दे
  rationale: τίθημι का मूल अर्थ ‘रखना’ है, पर ‘पैरों के नीचे कर देना’ हिन्दी में पूर्ण अधीनता की बाइबिलीय छवि को स्वाभाविक रूप से व्यक्त करता है। इस यूनानी रूप को हिन्दी में पूर्णता की ओर लक्षित ‘न कर दे’ से ठीक प्रकार व्यक्त किया गया है।
- source_word: πάντας τοὺς ἐχθροὺς
  choice: अपने सभी शत्रुओं को
  rationale: ‘सभी’ विरोधियों की समग्रता बनाए रखता है और ‘अपने’ αὐτοῦ से व्यक्त संबंध को स्पष्ट करता है।
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: अपने पैरों के नीचे
  rationale: यह पूर्ण अधीनता की पारंपरिक बाइबिलीय उपमा है; इसे सीधे और पहचानने योग्य रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: ἄχρι οὗ (‘जब तक’) का कालगत आशय
  choice: ‘तब तक ... जब तक’ रखा गया है, बिना यह संकेत दिए कि शत्रुओं के अधीन होने के बाद मसीह का राज्य समाप्त हो जाता है।
  alternative: इसे ऐसे समझना कि शत्रुओं के अधीन होते ही उसका राज्य समाप्त हो जाएगा।
  rationale: यूनानी वाक्य यहाँ उस समय-बिंदु तक राज्य करने पर ध्यान देता है, पर उसके बाद राज्य के समाप्त होने की बात स्वयं नहीं कहता। अनुवाद इस धर्मवैज्ञानिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। ‘राज्य करना’ राजकीय शासन का भाव बनाए रखता है; ‘पैरों के नीचे’ की मूल उपमा को अपरिवर्तित रखा गया है।
