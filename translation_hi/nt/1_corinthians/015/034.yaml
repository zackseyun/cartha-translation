source:
  edition: SBLGNT
  text: ἐκνήψατε δικαίως καὶ μὴ ἁμαρτάνετε, ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν· πρὸς ἐντροπὴν ὑμῖν ⸀λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/034.yaml
  text: Come to your senses rightly[a], and do not go on sinning; for some have ignorance of God[b]. I say this to your shame.
translation:
  language: hi
  text: जैसा उचित है, होश में आओ[a] और पाप करते न रहो[b], क्योंकि कुछ लोग परमेश्वर को नहीं जानते। मैं यह तुम्हें लज्जित करने के लिए कहता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उचित रूप से सचेत हो जाओ।” मूल क्रिया का शाब्दिक चित्र नशे से होश में आने का है; यहाँ इसका प्रयोग रूपक के रूप में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या, “पाप न करो” अथवा “पाप करना छोड़ दो।” वर्तमानकालीन आज्ञा निरंतर या आदतन किए जाने वाले पाप का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκνήψατε
  choice: होश में आओ
  rationale: यह आज्ञा मूलतः नशे से उतरकर सचेत होने का चित्र प्रस्तुत करती है, पर यहाँ रूपक रूप में सही समझ-बूझ लौटाने की निर्णायक पुकार है।
- source_word: δικαίως
  choice: ठीक तरह से
  rationale: यह क्रिया-विशेषण होश में आने की आज्ञा को संशोधित करता है और उचित अथवा सही ढंग का भाव देता है; इससे अनावश्यक रूप से भारी धर्मवैज्ञानिक अर्थ नहीं जुड़ता।
- source_word: μὴ ἁμαρτάνετε
  choice: पाप करते न रहो
  rationale: वर्तमानकालीन निषेधाज्ञा निरंतर या बार-बार होने वाली क्रिया को रोकने का भाव दे सकती है; यह अनुवाद उस पहलू को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀγνωσίαν ... θεοῦ
  choice: परमेश्वर को नहीं जानते
  rationale: शाब्दिक 'परमेश्वर का अज्ञान रखते हैं' हिन्दी में अस्वाभाविक है। यह रूप परमेश्वर के विषय में ज्ञान के अभाव को सहज और स्पष्ट ढंग से व्यक्त करता है।
- source_word: τινες
  choice: कुछ लोग
  rationale: यह संबोधित समुदाय से जुड़े एक अनिश्चित उपसमूह को दर्शाता है।
- source_word: πρὸς ἐντροπὴν ὑμῖν
  choice: तुम्हें लज्जित करने के लिए
  rationale: यह वाक्यांश श्रोताओं में लज्जा उत्पन्न करने वाले अभिप्राय या प्रभाव को व्यक्त करता है और पौलुस की फटकार का तीखापन बनाए रखता है।
- source_word: λαλῶ
  choice: मैं यह ... कहता हूँ
  rationale: प्रसंग में यह अभिव्यक्ति अभी कही गई फटकार की ओर संकेत करती है और स्वाभाविक हिन्दी संवाद-शैली देती है।
theological_decisions:
- issue: δικαίως का नैतिक बल
  choice: ठीक तरह से
  alternative: धार्मिकता से / जैसा उचित है
  rationale: पद की आज्ञा नैतिक है, पर यह क्रिया-विशेषण सबसे सीधे रूप में उचित ढंग से होश में आने को बताता है। चुना हुआ रूप नैतिक भाव बनाए रखता है, पर 'धार्मिकता' का कोई तकनीकी पौलुसी अर्थ नहीं जोड़ता।
- issue: ἀγνωσίαν θεοῦ में ज्ञान की प्रकृति
  choice: परमेश्वर को नहीं जानते
  alternative: परमेश्वर के विषय में अज्ञान रखते हैं
  rationale: सम्बन्धकारक परमेश्वर से संबंधित अज्ञान बताता है; हिन्दी में व्यक्ति-वाचक कर्म के साथ 'नहीं जानते' स्वाभाविक है और यह केवल सूचनात्मक ज्ञान या संबंधपरक ज्ञान में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- issue: πρὸς ἐντροπὴν का अभिप्राय अथवा परिणाम
  choice: तुम्हें लज्जित करने के लिए
  alternative: यह तुम्हारे लिए लज्जा की बात है
  rationale: πρός के साथ यह पदबंध लक्ष्य अथवा अभिप्रेत प्रभाव दर्शा सकता है। चुना हुआ रूप फटकार के उद्देश्य को स्पष्ट करता है, जबकि विकल्प परिणाम या मूल्यांकन पर अधिक बल देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सीधी और गरिमापूर्ण फटकार। 'होश में आओ' सामान्य पाठक के लिए स्वाभाविक है और यूनानी क्रिया का सजीव रूपक भी बचाता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न सम्मिलित हैं।
