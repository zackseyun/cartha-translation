  text: Νυνὶ δὲ Χριστὸς ἐγήγερται ἐκ νεκρῶν, ἀπαρχὴ τῶν ⸀κεκοιμημένων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/020.yaml
  text: But now Messiah has been raised from the dead[c][b][a], the firstfruits of those who have fallen asleep.
translation:
  language: hi
  text: परन्तु अब मसीह मरे हुओं में से जिलाया गया है—वह सो गए लोगों में से पहला फल है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पहला फल’ उस फसल के आरम्भिक भाग की छवि है जो परमेश्वर को चढ़ाया जाता था; वह आगे आने वाली पूरी फसल का संकेत और आश्वासन था।
    reason: cultural_note
  - marker: b
    text: ‘सो गए’ यहाँ मर चुके लोगों के लिए रूपक है, विशेषकर पुनरुत्थान के संदर्भ में।
    reason: lexical_alternative
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: परन्तु अब
  rationale: पिछले काल्पनिक निष्कर्ष के विपरीत वास्तविक स्थिति की दृढ़ घोषणा को व्यक्त करता है।
- source_word: Χριστὸς
  choice: मसीह
  rationale: यहाँ Χριστός को उसके पदवीगत अर्थ में रखा गया है; आधुनिक हिन्दी में ‘मसीह’ स्वाभाविक और प्रचलित है।
- source_word: ἐγήγερται
  choice: जिलाया गया है
  rationale: यूनानी पूर्णकालीन कर्मवाच्य रूप पूरे हो चुके कार्य और उसके बने हुए परिणाम, दोनों को व्यक्त करता है; कर्मकर्ता को स्पष्ट रूप से जोड़कर नहीं बताया गया।
- source_word: ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: बहुवचन νεκρῶν और पुनरुत्थान के समूहगत संदर्भ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀπαρχὴ
  choice: उपज का पहला फल
  rationale: ἀπαρχή फसल के उस आरम्भिक अंश को सूचित करता है जो आगे आने वाली पूरी फसल का पूर्वसंकेत और आश्वासन होता है।
- source_word: τῶν κεκοιμημένων
  choice: सो गए लोगों
  rationale: मृत्यु के लिए प्रयुक्त नींद के रूपक को बनाए रखता है, जो पुनरुत्थान के संदर्भ में विशेष अर्थ रखता है।
theological_decisions:
- issue: पुनरुत्थान का वाच्य और कर्तृत्व
  choice: जिलाया गया है
  alternative: जी उठा है
  rationale: कर्मवाच्य यूनानी रूप को बनाए रखने से परमेश्वर के निहित कर्तृत्व को मिटाया नहीं जाता, पर पाठ में कर्ता को आवश्यकता से अधिक स्पष्ट भी नहीं किया जाता।
- issue: Χριστός का पदवीगत अर्थ
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस धर्मवैचारिक और प्रतिनिधिक संदर्भ में पदवी के अर्थ को प्रचलित हिन्दी रूप ‘मसीह’ से व्यक्त किया गया है।
- issue: ἀπαρχή का प्रतिनिधिक आशय
  choice: उपज का पहला फल
  alternative: पहली उपज
  rationale: यह रूप केवल कालक्रम में प्रथम होने की बात नहीं, बल्कि आने वाली पूरी फसल का संकेत होने वाली आरम्भिक उपज की छवि भी सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘मरे हुओं में से’ मूल के बहुवचन भाव को, और ‘सो गए’ मूल रूपक को सुरक्षित रखता है।
