  text: εἶτα τὸ τέλος, ὅταν ⸀παραδιδῷ τὴν βασιλείαν τῷ θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/024.yaml
  text: Then comes the end[a], when he hands over the kingdom to God the Father[c][b], when he abolishes every rule and every authority and power.
translation:
  language: hi
  text: फिर अन्त आएगा[a], जब वह राज्य परमेश्वर पिता को सौंप देगा[b], और जब वह हर शासन, हर अधिकार और हर सामर्थ्य को समाप्त कर देगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परिणति।” यूनानी शब्द τέλος का अर्थ “अन्त,” “लक्ष्य” या “परिणति” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, “परमेश्वर और पिता को।”
    reason: lexical_alternative
  - marker: c
    text: या “निष्प्रभावी कर देगा।” “हर शासन” का अनुवाद “हर शासक सत्ता” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: फिर
  rationale: यह पौलुस द्वारा बताए गए पुनरुत्थान-क्रम में अगले चरण को स्वाभाविक और संक्षिप्त रूप से दर्शाता है।
- source_word: τὸ τέλος
  choice: अन्त
  rationale: τέλος का अर्थ अन्त, लक्ष्य या परिपूर्ण परिणति हो सकता है। इस कालक्रम में ‘अन्त’ सीधा अर्थ देता है, जबकि पादटिप्पणी इसकी व्यापक अर्थ-सम्भावना सुरक्षित रखती है।
- source_word: ὅταν παραδιδῷ
  choice: जब वह … सौंप देगा
  rationale: ὅταν के साथ वर्तमान संभावनार्थक क्रिया भावी समय की घटना दर्शाती है। ‘सौंप देगा’ राज्याधिकार दूसरे को देने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὴν βασιλείαν
  choice: राज्य
  rationale: βασιλεία राज्य अथवा राजकीय शासन दोनों को सूचित कर सकता है। ‘राज्य’ परिचित और सहज है तथा शासन के गतिशील भाव को भी पूर्णतः बाहर नहीं करता।
- source_word: τῷ θεῷ καὶ πατρί
  choice: परमेश्वर पिता को
  rationale: इस पदबंध को समानाधिकरण में, अर्थात् परमेश्वर जो पिता है, समझना स्वाभाविक है। अधिक शाब्दिक समन्वित रूप पादटिप्पणी में दिया गया है।
- source_word: ὅταν καταργήσῃ
  choice: जब वह … समाप्त कर देगा
  rationale: καταργέω किसी सत्ता को निष्क्रिय, निष्प्रभावी या समाप्त करने का अर्थ देता है। ‘समाप्त कर देगा’ निर्णायक अन्त को व्यक्त करता है, पर अनिवार्यतः अस्तित्व-मिट जाने का दावा नहीं करता।
- source_word: πᾶσαν ἀρχὴν
  choice: हर शासन
  rationale: ἀρχή यहाँ शासन, प्रभुता या शासक सत्ता का संकेत दे सकता है। ‘शासन’ सूची के अमूर्त स्वरूप को बनाए रखता है और इसे केवल मानवीय शासकों तक सीमित नहीं करता।
- source_word: πᾶσαν ἐξουσίαν
  choice: हर अधिकार
  rationale: ἐξουσία के लिए ‘अधिकार’ आधुनिक हिन्दी में स्पष्ट और मानक समतुल्य है।
- source_word: δύναμιν
  choice: हर सामर्थ्य
  rationale: δύναμις यहाँ प्रभावी शक्ति या सामर्थ्य को दर्शाता है। ‘सामर्थ्य’ इसे पहले आए ‘अधिकार’ से अलग रखते हुए त्रिक को बनाए रखता है।
theological_decisions:
- issue: τῷ θεῷ καὶ πατρί में ‘परमेश्वर’ और ‘पिता’ का सम्बन्ध
  choice: 'समानाधिकरण: ‘परमेश्वर पिता’'
  alternative: 'समन्वित: ‘परमेश्वर और पिता’'
  rationale: प्रसंग में पिता ही वह है जिसे पुत्र राज्य सौंपता है। मुख्य पाठ स्वाभाविक हिन्दी देता है, जबकि पादटिप्पणी यूनानी संरचना के अधिक शाब्दिक सम्भव पाठ को सुरक्षित रखती है; इससे पुत्र के स्वरूप के विषय में कोई अतिरिक्त निष्कर्ष नहीं जोड़ा गया।
- issue: विरोधी सत्ताओं के सम्बन्ध में καταργήσῃ का बल
  choice: उनके शासन और प्रभाव का निर्णायक अन्त
  alternative: निष्प्रभावी कर देना; पूरी तरह मिटा देना
  rationale: क्रिया उनके सक्रिय शासन और प्रभाव को समाप्त करने पर बल देती है। ‘समाप्त कर देगा’ निर्णायकता बनाए रखता है, किन्तु उनके तत्त्वमीमांसक विनाश का अनावश्यक दावा नहीं करता।
- issue: ἀρχή का व्यक्तिवाचक या अमूर्त अर्थ
  choice: ‘शासन’ के रूप में अमूर्त सत्ता
  alternative: ‘हर शासक’ के रूप में व्यक्तिवाचक सत्ता
  rationale: ἐξουσία और δύναμις के साथ बनी सूची में ‘शासन’ उपयुक्त है, फिर भी यह शासक शक्तियों को बाहर नहीं करता। पादटिप्पणी वैकल्पिक व्यक्तिवाचक समझ को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप अपनाया गया है। वाक्य में दोनों ὅταν खंडों को ‘जब’ से व्यक्त किया गया है। ‘अन्त,’ ‘परमेश्वर पिता,’ और ‘समाप्त कर देगा’ सामान्य पाठक के लिए स्वाभाविक हैं; वास्तविक शाब्दिक और अर्थगत विकल्प पादटिप्पणियों में सुरक्षित रखे गए हैं।
