translation:
  language: hi
  text: इसलिए, चाहे मैं होऊँ या वे, हम इसी प्रकार प्रचार करते हैं, और तुमने इसी प्रकार विश्वास किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: चाहे ... या
  rationale: यह स्वाभाविक हिन्दी में दो विकल्पों का परस्पर संबंध बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले विवरण से निकले निष्कर्ष को स्पष्ट करता है, जहाँ पौलुस ने पुनरुत्थान के गवाहों की चर्चा की है।
- source_word: ἐγὼ ... ἐκεῖνοι
  choice: मैं ... वे
  rationale: यह पौलुस और पहले उल्लिखित दूसरे प्रेरितों के बीच सीधे विरोध को संक्षिप्त और स्वाभाविक ढंग से रखता है।
- source_word: οὕτως κηρύσσομεν
  choice: हम यही प्रचार करते हैं
  rationale: οὕτως यहाँ पिछले पदों में संक्षेपित संदेश की ओर संकेत करता है; ‘यही’ उस संदर्भगत विषयवस्तु को सहज हिन्दी में व्यक्त करता है।
- source_word: οὕτως ἐπιστεύσατε
  choice: तुमने इसी पर विश्वास किया
  rationale: दोहराया गया οὕτως उसी घोषित संदेश और कुरिन्थियों के विश्वास को जोड़ता है। हिन्दी में ‘इसी पर’ इस संबंध को स्वाभाविक बनाता है, यद्यपि अधिक रूपगत विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: प्रेरितों की घोषणा की एकता का दायरा
  choice: पौलुस कहता है कि प्रचारक चाहे वह स्वयं हो या दूसरे प्रेरित, घोषित संदेश वही है जिसे कुरिन्थियों ने स्वीकार किया।
  alternative: 'पद को मुख्यतः घोषणा और विश्वास के ढंग की समानता पर बल देते हुए पढ़ना: ‘हम इसी प्रकार प्रचार करते हैं और तुमने इसी प्रकार विश्वास किया।’'
  rationale: दोहराया गया οὕτως विषयवस्तु और रीति—दोनों अर्थों की संभावना रखता है। मुख्य पाठ संदर्भगत संदेश को सहज हिन्दी में सामने रखता है, जबकि पादटिप्पणी अधिक रूपगत संभावना सुरक्षित रखती है; इससे पाठ से परे कोई व्यापक कलीसियाई दावा नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘प्रचार’ κηρύσσω की सार्वजनिक घोषणा का भाव रखता है। मुख्य वाक्य में समान संदेश पर बल है और पादटिप्पणी मूल यूनानी की अधिक रूपगत समानांतरता दिखाती है।
