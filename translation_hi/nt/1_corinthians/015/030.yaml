lexical_decisions:
- source_word: τί
  choice: क्यों
  rationale: इस आलंकारिक प्रश्न में τί कार्य के कारण या औचित्य को पूछता है; प्रसंग में ‘क्यों’ पौलुस के तर्क को स्वाभाविक रूप से व्यक्त करता है।
- source_word: καὶ
  choice: भी
  rationale: यह पौलुस और उसके साथियों को पिछले उदाहरणों के साथ जोड़ता है; हिन्दी में ‘भी’ इसका योगात्मक भाव स्पष्ट करता है।
- source_word: ἡμεῖς
  choice: हम
  rationale: स्पष्ट यूनानी सर्वनाम को रखा गया है; ‘भी’ के साथ इसका योगात्मक और हल्का बलाघात बना रहता है।
- source_word: κινδυνεύομεν
  choice: खतरे में पड़ते हैं
  rationale: κινδυνεύω का सीधा अर्थ खतरे में होना या खतरे का सामना करना है। ‘खतरे में पड़ते हैं’ स्वाभाविक हिन्दी है और ‘जान जोखिम में डालना’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: πᾶσαν ὥραν
  choice: हर घड़ी
  rationale: यह निरंतर खतरे का भाव देता है। ‘हर घड़ी’ यूनानी ‘हर घंटे’ के निकट रहते हुए आधुनिक हिन्दी में अधिक स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: पुनरुत्थान के विषय में पौलुस के तर्क के भीतर आलंकारिक प्रश्न
  choice: वाक्य को आलंकारिक ‘क्यों’ प्रश्न के रूप में प्रस्तुत किया गया है, जो मृतकों के न जी उठने की स्थिति में प्रेरितों के निरंतर खतरे की निरर्थकता दिखाता है।
  alternative: अधिक शाब्दिक रूप में ‘यह क्या है कि हम भी हर घड़ी खतरे में पड़ते हैं?’
  rationale: यूनानी रचना और निकटवर्ती प्रसंग आलंकारिक प्रश्न का समर्थन करते हैं। यह अनुवाद तर्क की धार को बनाए रखता है, पर कोई अतिरिक्त सिद्धान्तगत निष्कर्ष नहीं जोड़ता।
