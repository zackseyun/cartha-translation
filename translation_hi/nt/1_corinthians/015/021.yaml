translation:
  language: hi
  text: क्योंकि एक मनुष्य के द्वारा मृत्यु आई, और एक मनुष्य के द्वारा मरे हुओं का पुनरुत्थान भी आया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों उपवाक्यों में ‘के द्वारा’ का अनुवाद ‘के माध्यम से’ भी किया जा सकता है; यूनानी पूर्वसर्ग कर्ता या माध्यम—दोनों का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: प्रसंग इन दो मनुष्यों की पहचान आदम और मसीह के रूप में करता है (देखें 15:22, 45)।
    reason: cross_reference
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: क्योंकि जब
  rationale: ἐπειδή और γάρ मिलकर पिछले कथन का कारण बताते हैं। ‘क्योंकि जब’ हिन्दी में इस व्याख्यात्मक और कारणसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δι’ ἀνθρώπου
  choice: एक मनुष्य के द्वारा
  rationale: διά के साथ संबंधकारक यहाँ माध्यम अथवा कर्तृत्व—दोनों का भाव दे सकता है। ‘के द्वारा’ इस अर्थ-सीमा को बनाए रखता है और ἀνθρώπου के एकवचन तथा आदम-मसीह के समानांतर को सुरक्षित रखता है।
- source_word: θάνατος
  choice: मृत्यु आई
  rationale: यूनानी वाक्यांश में क्रिया व्यक्त नहीं है; स्वाभाविक हिन्दी के लिए ‘आई’ जोड़ी गई है। इससे मृत्यु के मनुष्य के द्वारा संसार में आने का प्रसंगगत भाव व्यक्त होता है।
- source_word: ἀνάστασις νεκρῶν
  choice: मरे हुओं का पुनरुत्थान
  rationale: यह पौलुस का मृत लोगों के वास्तविक पुनरुत्थान के लिए प्रयुक्त ठोस पद है। ‘मरे हुओं का’ हिन्दी में νεκρῶν के संबंधकारक को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: καὶ
  choice: भी
  rationale: καί तुलना के दूसरे, अनुरूप पक्ष को चिह्नित करता है; ‘भी’ मृत्यु और पुनरुत्थान के बीच जानबूझकर रखी गई समानांतरता को स्पष्ट करता है।
- source_word: δι’ ἀνθρώπου
  choice: एक मनुष्य के द्वारा
  rationale: दोनों उपवाक्यों में समान अनुवाद पौलुस द्वारा रखे गए आदम और मसीह के प्रतिनिधिक समानांतर को बनाए रखता है।
theological_decisions:
- issue: आदम और मसीह के बीच प्रतिनिधिक विरोध
  choice: दोनों उपवाक्यों में ‘एक मनुष्य’ रखा गया है, पर मुख्य पाठ में उनके नाम नहीं जोड़े गए।
  alternative: ‘मनुष्य के द्वारा’; अथवा ‘आदम के द्वारा ... मसीह के द्वारा’
  rationale: मूल पद में दोनों बार एकवचन ἀνθρώπου है, जबकि नाम इस आयत में नहीं हैं। निकटवर्ती प्रसंग पहचान स्पष्ट करता है; अनुवाद मूल की संक्षिप्त समानांतर रचना बनाए रखता है। हिन्दी में ‘एक’ अनिश्चित एकवचन को स्वाभाविक बनाता है, न कि संख्या पर विशेष बल।
- issue: पुनरुत्थान का स्वरूप
  choice: ‘मरे हुओं का पुनरुत्थान’
  alternative: ‘मृत्यु के बाद जीवन’ अथवा ‘आत्मिक पुनर्जीवन’
  rationale: 1 कुरिन्थियों 15 में पौलुस मरे हुओं के वास्तविक पुनरुत्थान का तर्क प्रस्तुत करता है। इसलिए इसे अस्पष्ट परलोक या केवल आत्मिक अनुभव के रूप में नहीं ढाला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। समानांतर वाक्य-रचना जानबूझकर सुरक्षित रखी गई है। ‘पुनरुत्थान’ परिचित और धर्मवैज्ञानिक रूप से सटीक पद है; ‘मरे हुओं’ सामान्य पाठक के लिए ‘मृतकों’ से अधिक सहज है।
