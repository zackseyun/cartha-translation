  text: καθ’ ἡμέραν ἀποθνῄσκω, νὴ τὴν ὑμετέραν ⸀καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/031.yaml
  text: I die every day—by the boasting in you that I have in Messiah Jesus our Lord[a][b][c].
translation:
  language: hi
  text: मैं हर दिन मरता हूँ—तुम्हारे विषय में उस गर्व की शपथ, जो मुझे हमारे प्रभु मसीह यीशु में है।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक शब्दक्रम: “प्रतिदिन मैं मरता हूँ।”'
    reason: lexical_alternative
  - marker: b
    text: इस यूनानी वाक्यांश का रूप शपथ या दृढ़ पुष्टि जैसा है। इसका अनुवाद “जितना निश्चित है कि मुझे तुम्हारे विषय में गर्व है” भी हो सकता है; व्याकरण की दृष्टि से “तुम्हारे गर्व की शपथ” भी सम्भव है।
    reason: alternative_reading
  - marker: c
    text: 'वैकल्पिक नाम-सदृश रूप: “ख्रीष्ट यीशु।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: हर दिन
  rationale: यह पदबंध ‘प्रतिदिन’ या ‘हर दिन’ का अर्थ देता है। ‘हर दिन’ आधुनिक हिन्दी में स्वाभाविक है और बार-बार होने का भाव बनाए रखता है।
- source_word: ἀποθνῄσκω
  choice: मैं मरता हूँ
  rationale: वर्तमानकाल के इस सजीव कथन को सीधे रखा गया है। ‘मैं मृत्यु का सामना करता हूँ’ सम्भावित आशय है, पर वह अधिक व्याख्यात्मक है।
- source_word: νὴ
  choice: की शपथ
  rationale: यह दृढ़ पुष्टि या शपथ में प्रयुक्त अव्यय है। हिन्दी में ‘की शपथ’ उसके शपथ-सदृश बल को संक्षेप में व्यक्त करता है।
- source_word: τὴν ὑμετέραν καύχησιν
  choice: तुम पर उस गर्व
  rationale: καύχησις का अर्थ ‘गर्व करना’, ‘बड़ाई’ या ‘गर्व का आधार’ हो सकता है। अगले संबंधवाचक उपवाक्य के कारण मुख्य पाठ में पौलुस का कुरिन्थियों पर गर्व समझा गया है, जबकि व्याकरणगत विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: ἣν ἔχω
  choice: जो मुझे … है
  rationale: हिन्दी में स्वाभाविक संबंधवाचक रचना है और गर्व को पौलुस द्वारा धारण की हुई बात के रूप में रखती है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: Χριστός को उपाधि के रूप में ‘मसीह’ अनूदित किया गया है। ‘में’ को पौलुस की महत्त्वपूर्ण संबंधपरक भाषा के कारण बनाए रखा गया है।
- source_word: τῷ κυρίῳ ἡμῶν
  choice: हमारे प्रभु
  rationale: κύριος के लिए स्वाभाविक और प्रतिष्ठित हिन्दी ‘प्रभु’ है; ἡμῶν को ‘हमारे’ से स्पष्ट किया गया है।
theological_decisions:
- issue: Χριστῷ को उपाधि मानना या नाम-सदृश रूप
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु
  rationale: यहाँ Χριστός की अभिषिक्त राजा वाली उपाधिगत शक्ति बनी हुई है; इसलिए अर्थानुवाद ‘मसीह’ चुना गया है।
- issue: ὑμετέραν καύχησιν में गर्व किसका है
  choice: पौलुस का कुरिन्थियों पर गर्व
  alternative: कुरिन्थियों का अपना गर्व
  rationale: ‘जो मुझे … है’ मुख्य अर्थ के रूप में पौलुस के गर्व का समर्थन करता है, फिर भी ὑμετέραν की रचना दूसरे अर्थ की सम्भावना पूरी तरह समाप्त नहीं करती; अतः उसे पादटिप्पणी में रखा गया है।
- issue: ‘मैं मरता हूँ’ का आशय
  choice: सजीव, प्रत्यक्ष कथन को बनाए रखना
  alternative: मैं प्रतिदिन मृत्यु का सामना करता हूँ
  rationale: संदर्भ में लगातार प्राण-संकट का भाव सम्भव है, पर मूल पाठ रूपक और वास्तविक संकट के बीच तनाव को स्पष्ट नहीं करता; इसलिए मुख्य पाठ अधिक शाब्दिक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से समझने योग्य रखी गई है। ‘उस गर्व की शपथ’ सामान्य बोलचाल से कुछ अधिक औपचारिक है, पर मूल की असामान्य शपथ-सदृश रचना को जानबूझकर बनाए रखता है। सभी वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं, ताकि मुख्य पाठ किसी वास्तविक अस्पष्टता को चुपचाप समाप्त न करे।
