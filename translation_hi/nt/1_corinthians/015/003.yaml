reference: 1 Corinthians 15:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/003.yaml
  text: 'For I delivered to you as of first importance what I also received: that Messiah died for our sins according to the Scriptures[b][a],'
translation:
  language: hi
  text: 'क्योंकि सबसे अधिक महत्वपूर्ण बात के रूप में मैंने तुम्हें वही सौंपा जो मुझे भी मिला था: कि मसीह हमारे पापों के लिए पवित्र शास्त्रों के अनुसार मरे,[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सबसे पहले।”
    reason: ग्रीक वाक्यांश ἐν πρώτοις प्रमुख महत्त्व का अर्थ रखता है, लेकिन संदर्भ के अनुसार आरंभिक क्रम का संकेत भी दे सकता है।
  - marker: b
    text: या, “पवित्र शास्त्रों के अनुरूप।”
    reason: κατὰ τὰς γραφάς को अनुरूपता या संगति के रूप में भी व्यक्त किया जा सकता है; यूनानी में ‘शास्त्रों’ बहुवचन है।
lexical_decisions:
- source_word: Παρέδωκα
  choice: मैंने तुम्हें ... सौंपा
  rationale: यहाँ क्रिया मिली हुई शिक्षा या परंपरा को अधिकारपूर्वक आगे पहुँचाने का भाव रखती है; ‘सौंपा’ इस अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसका संबंध स्पष्ट रखता है।
- source_word: ἐν πρώτοις
  choice: सबसे महत्वपूर्ण बात के रूप में
  rationale: संदर्भ में यह केवल समयक्रम नहीं, बल्कि प्रमुखता या सर्वोच्च महत्त्व को व्यक्त करता है।
- source_word: ὃ καὶ παρέλαβον
  choice: वही ... जो मुझे भी मिला था
  rationale: यह पौलुस द्वारा प्राप्त और आगे सौंपी गई शिक्षा के समान विषय-वस्तु को बनाए रखता है।
- source_word: Χριστὸς
  choice: मसीह
  rationale: इस विश्वास-सार में शब्द का उपाधिसूचक अर्थ प्रमुख है; हिन्दी में ‘मसीह’ यहूदी-मसीही पृष्ठभूमि और प्रचलित बाइबलीय भाषा दोनों को सुरक्षित रखता है।
- source_word: ἀπέθανεν
  choice: मरे
  rationale: अओरिस्ट क्रिया एक पूर्ण ऐतिहासिक घटना बताती है; ‘मरे’ हिन्दी में मसीह के लिए स्वाभाविक आदरसूचक भूतकाल है।
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: हमारे पापों के लिए
  rationale: यह मूल के व्यापक उद्धार-संबंधी दावे को व्यक्त करता है, पर प्रायश्चित के किसी एक विशिष्ट सिद्धांत को आरोपित नहीं करता।
- source_word: κατὰ τὰς γραφάς
  choice: पवित्र शास्त्र के अनुसार
  rationale: κατά यहाँ अनुरूपता या संगति का भाव देता है। हिन्दी में सामूहिक अर्थ वाला ‘पवित्र शास्त्र’ स्वाभाविक है; वैकल्पिक अभिव्यक्ति पादटिप्पणी में दी गई है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός विश्वास-सार में उपाधि के रूप में प्रयुक्त है। ‘मसीह’ उसके अभिषिक्त उद्धारकर्ता वाले अर्थ को स्पष्ट रखता है; नाम-सदृश पारंपरिक रूप को मुख्य पाठ में रखने की आवश्यकता नहीं है।
- issue: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν का आशय
  choice: हमारे पापों के लिए
  alternative: हमारे पापों के कारण
  rationale: ‘के लिए’ प्रतिनिधिक, लाभार्थक और पाप-संबंधी कारण के बीच मूल में उपस्थित व्यापकता को बनाए रखता है और किसी संकीर्ण प्रायश्चित-व्याख्या को तय नहीं करता।
- issue: ἐν πρώτοις में प्राथमिकता का प्रकार
  choice: महत्त्व की प्राथमिकता
  alternative: समयक्रम में आरंभिक बातों में
  rationale: संदर्भ सुसमाचार के केंद्रीय विषयों पर बल देता है, इसलिए महत्त्व की प्राथमिकता अधिक संभावित है; संभावित कालक्रमिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्पष्ट और गरिमापूर्ण शैली। ‘तुम्हें’ मूल के बहुवचन ὑμῖν को समुदाय-संबोधन के रूप में व्यक्त करता है। ‘मरे’ आदरसूचक बहुवचन है। पद के आगे जारी रहने का संकेत देने के लिए अंत में अल्पविराम रखा गया है।
