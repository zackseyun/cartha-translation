  text: ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ ⸀πλείονες μένουσιν ἕως ἄρτι, τινὲς ⸀δὲ ἐκοιμήθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/006.yaml
  text: Then he appeared to more than five hundred brothers at one time[a], most of whom remain until now[b], though some have fallen asleep.
translation:
  language: hi
  text: इसके बाद वह एक ही समय में पाँच सौ से अधिक भाइयों को दिखाई दिया[a]। उनमें से अधिकांश अब तक जीवित हैं, पर कुछ सो गए हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाइयों और बहनों को’। यूनानी में ‘भाइयों’ है, पर आरम्भिक मसीही प्रयोग में यह शब्द कभी-कभी विश्वासियों के व्यापक समुदाय के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात उनकी मृत्यु हो गई है। पुनरुत्थान की आशा के प्रकाश में मृत्यु के लिए ‘सो जाना’ आरम्भिक मसीहियों की एक प्रचलित अभिव्यक्ति थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: इसके बाद
  rationale: यह पौलुस द्वारा क्रम से गिनाए गए पुनरुत्थान-दर्शनों में अगले चरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὤφθη
  choice: वह ... दिखाई दिया
  rationale: पुनरुत्थान-दर्शनों के प्रसंग में यह रूप किसी के प्रकट होकर देखे जाने को व्यक्त करता है; पूर्ववर्ती संदर्भ से कर्ता मसीह है।
- source_word: ἐπάνω πεντακοσίοις
  choice: पाँच सौ से अधिक
  rationale: संख्या के साथ ἐπάνω का अर्थ ‘से अधिक’ है।
- source_word: ἀδελφοῖς
  choice: भाइयों
  rationale: यूनानी शब्द पुल्लिंग बहुवचन है। मुख्य पाठ में उसके रूप को रखा गया है, जबकि आरम्भिक मसीही प्रयोग में व्यापक विश्वासी समुदाय की सम्भावना पाद-टिप्पणी में बताई गई है।
- source_word: ἐφάπαξ
  choice: एक ही समय में
  rationale: यहाँ शब्द इस बात पर बल देता है कि उस बड़े समूह को दर्शन एक ही अवसर पर हुआ।
- source_word: οἱ πλείονες
  choice: अधिकांश
  rationale: संज्ञा के रूप में प्रयुक्त तुलनात्मक पद समूह के अधिकतर लोगों को सूचित करता है।
- source_word: μένουσιν ἕως ἄρτι
  choice: अब तक जीवित हैं
  rationale: शाब्दिक भाव ‘अब तक बने हुए हैं’ है, पर संदर्भ में इसका आशय उनके पौलुस के समय तक जीवित रहने से है; हिन्दी में चुना गया रूप स्पष्ट और स्वाभाविक है।
- source_word: τινὲς δὲ
  choice: पर कुछ
  rationale: δέ बहुसंख्यक जीवित गवाहों और मर चुके कुछ गवाहों के बीच हल्का विरोध प्रकट करता है।
- source_word: ἐκοιμήθησαν
  choice: सो गए हैं
  rationale: मृत्यु के लिए प्रयुक्त ‘सोने’ का रूपक पुनरुत्थान के इस प्रसंग में अर्थपूर्ण है, इसलिए इसे मुख्य पाठ में सुरक्षित रखा गया है।
theological_decisions:
- issue: ἀδελφοῖς का सम्भवतः मिश्रित विश्वासी समुदाय के लिए प्रयोग
  choice: भाइयों
  alternative: भाइयों और बहनों
  rationale: मूल यूनानी का पुल्लिंग रूप मुख्य पाठ में सुरक्षित रखा गया है; फिर भी आरम्भिक मसीही प्रयोग में स्त्रियाँ भी अभिप्रेत हो सकती हैं, इसलिए सम्भावना पाद-टिप्पणी में दी गई है।
- issue: पुनरुत्थान के प्रसंग में ἐκοιμήθησαν का अनुवाद
  choice: सो गए हैं
  alternative: मर गए हैं
  rationale: पौलुस के मृत्यु-संबंधी रूपक को बनाए रखने से अध्याय के पुनरुत्थान-विषयक तनाव और आशा को बिना सपाट किए व्यक्त किया जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दिखाई दिया’ प्रत्यक्ष दर्शन का भाव देता है; ‘सो गए हैं’ मूल रूपक को सुरक्षित रखता है।
