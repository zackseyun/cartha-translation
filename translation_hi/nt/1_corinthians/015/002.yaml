  text: δι’ οὗ καὶ σῴζεσθε, τίνι λόγῳ εὐηγγελισάμην ὑμῖν, εἰ κατέχετε, ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/015/002.yaml
  text: through which you also are being saved, if you hold firmly to the message I proclaimed as good news to you—unless you believed in vain.
translation:
  language: hi
  text: उसी के द्वारा तुम भी उद्धार पा रहे हो[a]—यदि तुम उस संदेश को दृढ़ता से थामे रहते हो जिसे मैंने तुम्हें शुभ समाचार के रूप में सुनाया था[b]—जब तक कि तुमने व्यर्थ विश्वास न किया हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसी के द्वारा तुम भी उद्धार पाते हो।” यूनानी वर्तमानकाल को जारी प्रक्रिया (“उद्धार पा रहे हो”) या सामान्य वर्तमान (“उद्धार पाते हो”)—दोनों रूपों में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “यदि तुम उसे थामे रहते हो—किस वचन/संदेश के रूप में मैंने तुम्हें शुभ समाचार सुनाया था।” यूनानी वाक्य-विन्यास संक्षिप्त है; यहाँ “वचन” का अर्थ “संदेश” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: उसी के द्वारा
  rationale: διά के साथ संबंधवाचक सर्वनाम साधन या माध्यम व्यक्त करता है और पिछले पद में बताए गए शुभ समाचार की ओर संकेत करता है।
- source_word: σῴζεσθε
  choice: तुम्हारा उद्धार भी हो रहा है
  rationale: वर्तमानकालीन कर्मवाच्य रूप की जारी प्रक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, पर किसी व्यापक धर्मवैज्ञानिक व्यवस्था को आरोपित नहीं करता।
- source_word: τίνι λόγῳ
  choice: उस संदेश को
  rationale: λόγος का संदर्भ यहाँ पौलुस द्वारा सुनाए गए शुभ समाचार की विषय-वस्तु से है। ‘संदेश’ आधुनिक हिन्दी में स्वाभाविक है; यूनानी वाक्य की शाब्दिक संरचना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: εὐηγγελισάμην
  choice: मैंने तुम्हें शुभ समाचार के रूप में सुनाया था
  rationale: क्रिया का मूल भाव शुभ समाचार सुनाना या घोषित करना है। यह चयन केवल ‘प्रचार किया’ की अपेक्षा उस भाव को अधिक स्पष्ट रखता है।
- source_word: κατέχετε
  choice: दृढ़ता से थामे रहते हो
  rationale: यहाँ क्रिया निरंतर पकड़े रहने, बनाए रखने या निष्ठापूर्वक लगे रहने का अर्थ देती है।
- source_word: ἐκτὸς εἰ μὴ
  choice: अन्यथा
  rationale: यह अपवादात्मक चेतावनी को सहज हिन्दी में व्यक्त करता है। अधिक शाब्दिक ‘जब तक कि…न’ इस वाक्य में अस्वाभाविक और अस्पष्ट होता।
- source_word: εἰκῇ
  choice: व्यर्थ ही
  rationale: यहाँ अर्थ निष्फल, निरुद्देश्य या बिना परिणाम के है; ‘व्यर्थ ही’ चेतावनी की तीव्रता बनाए रखता है।
- source_word: ἐπιστεύσατε
  choice: तुमने विश्वास किया
  rationale: अओरिस्ट रूप शुभ समाचार ग्रहण करते समय किए गए विश्वास के कार्य की ओर संकेत करता है।
theological_decisions:
- issue: σῴζεσθε में उद्धार का पक्ष
  choice: 'जारी प्रक्रिया: ‘उद्धार भी हो रहा है’'
  alternative: 'सामान्य वर्तमान: ‘उद्धार होता है’ या ‘उद्धार पाते हो’'
  rationale: वर्तमानकालीन कर्मवाच्य को प्रक्रियात्मक रूप में रखना सम्पन्न और जारी उद्धार के बीच पौलुस के धर्मवैज्ञानिक तनाव को बिना सुलझाए सुरक्षित रखता है।
- issue: εἰ κατέχετε की शर्त
  choice: 'वास्तविक शर्त: ‘यदि तुम…थामे रहते हो’'
  alternative: इसे सच्चे विश्वास का प्रमाण बताना अथवा शर्त को स्वतः पूर्ण मानना
  rationale: मूल पाठ शर्त रखता है। अनुवाद न तो दृढ़ बने रहने के किसी विशिष्ट साम्प्रदायिक सिद्धान्त को जोड़ता है, न शर्त को हल्का करता है।
- issue: ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε की चेतावनी
  choice: ‘अन्यथा तुमने व्यर्थ ही विश्वास किया’
  alternative: ‘जब तक कि तुमने व्यर्थ ही विश्वास न किया हो’
  rationale: स्वाभाविक हिन्दी में चेतावनी और अपवाद का बल रखा गया है, बिना यह तय किए कि ‘व्यर्थ’ विश्वास की असत्यता, निष्फलता या गलत विषय-वस्तु में विश्वास को दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘उद्धार’, ‘विश्वास’ और ‘शुभ समाचार’ जैसे परिचित धर्मग्रन्थीय शब्द रखे गए हैं; यूनानी वाक्य-विन्यास की अस्वाभाविकता को मुख्य पाठ में स्पष्ट किया गया और पादटिप्पणी में उसके निकटतर रूप को सुरक्षित रखा गया है।
