  yaml_path: translation/nt/1_corinthians/015/036.yaml
  text: Foolish one[b][a], what you sow is not made alive unless it dies.
translation:
  language: hi
  text: नासमझ[a]! तुम जो बोते हो, वह तब तक जीवित नहीं किया जाता[b], जब तक कि वह मर न जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्ख” या “बेसमझ।”
    reason: ἄφρων के सम्भव शब्दार्थ-विकल्पों को दर्शाता है; मुख्य पाठ में संबोधन की सीधी फटकार बनी रहती है।
  - marker: b
    text: या, “जीवन नहीं पाता।”
    reason: ζῳοποιεῖται के लिए अधिक मुहावरेदार हिन्दी विकल्प; मुख्य पाठ कर्मवाच्य रूप को निकटता से रखता है।
lexical_decisions:
- source_word: ἄφρων
  choice: अरे नासमझ!
  rationale: यह संबोधन पौलुस की तीखी फटकार को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। ‘मूर्ख’ संभव है, पर यहाँ अनावश्यक रूप से अधिक कठोर सुनाई दे सकता है।
- source_word: σὺ
  choice: तू
  rationale: यूनानी में स्पष्ट सर्वनाम बल देता है। हिन्दी का ‘तू’ सीधे व्यक्तिगत संबोधन और फटकार का बल बनाए रखता है; यह परमेश्वर के लिए प्रयुक्त आदरसूचक रूप नहीं, बल्कि इस प्रसंग की तीखी संबोधन-शैली है।
- source_word: ὃ σπείρεις
  choice: जो तू बोता है
  rationale: यह बीज बोने के कृषि-रूपक को निकटता और स्वाभाविकता से बनाए रखता है।
- source_word: οὐ ζῳοποιεῖται
  choice: जीवित नहीं किया जाता
  rationale: कर्मवाच्य रूप को सुरक्षित रखकर ‘जीवन दिए जाने’ का अर्थ व्यक्त किया गया है, बिना कर्ता को पाठ से अधिक स्पष्ट किए।
- source_word: ἐὰν μὴ
  choice: जब तक ... न
  rationale: इस प्रसंग में यह हिन्दी की स्वाभाविक शर्तसूचक रचना है और ‘unless’ के अर्थ को ठीक से व्यक्त करती है।
- source_word: ἀποθάνῃ
  choice: मर न जाए
  rationale: शर्त के भीतर घटना को स्वाभाविक हिन्दी में व्यक्त करता है; ‘पहले’ जोड़कर क्रम को अनावश्यक रूप से स्पष्ट नहीं किया गया।
theological_decisions:
- issue: बीज के मरने और पुनरुत्थान के जीवन का रूपकात्मक संबंध
  choice: कृषि-रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: इसे शारीरिक पुनरुत्थान का स्पष्ट सिद्धान्तात्मक सूत्र बनाकर अनूदित करना।
  rationale: पौलुस बीज के उदाहरण से पुनरुत्थान पर उठी आपत्ति का उत्तर देता है; अनुवाद को रूपक सुरक्षित रखना चाहिए और पद में अनुपस्थित धर्मवैज्ञानिक व्याख्या नहीं जोड़नी चाहिए।
- issue: ζῳοποιεῖται में जीवन देने वाला कर्ता
  choice: कर्मवाच्य ‘जीवित नहीं किया जाता’ रखा गया है।
  alternative: ‘परमेश्वर उसे जीवित नहीं करता’ कहना।
  rationale: संदर्भ परमेश्वर की जीवनदायी क्रिया की ओर संकेत कर सकता है, पर इस पद में कर्ता व्यक्त नहीं है; इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सीधे संबोधन वाली और गरिमापूर्ण है। ‘अरे नासमझ!’ मूल की तीखी फटकार रखता है। वाक्य में कृषि-रूपक और कर्मवाच्य दोनों सुरक्षित हैं।
