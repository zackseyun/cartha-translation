    text: या “स्तिफनास के घर को।” यूनानी शब्द केवल भवन के बजाय उससे जुड़े पूरे घरेलू समुदाय को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβάπτισα
  choice: बपतिस्मा दिया
  rationale: यह क्रिया बपतिस्मा देने के कार्य को स्पष्ट रूप से व्यक्त करती है। मानक हिन्दी कलीसियाई प्रयोग होने के साथ यह किसी विशेष रीति को अनावश्यक रूप से निर्धारित नहीं करती।
- source_word: δὲ καὶ
  choice: भी
  rationale: यह संयोजन पिछली सूची में स्तिफनास के घराने को जोड़ता है; हिन्दी में “भी” इसका स्वाभाविक और हल्का संयोजक भाव देता है।
- source_word: τὸν Στεφανᾶ οἶκον
  choice: स्तिफनास के घराने को
  rationale: यहाँ οἶκος केवल भवन नहीं, बल्कि स्तिफनास से संबद्ध पारिवारिक या घरेलू इकाई को सूचित करता है। “घराना” इस व्यापकता को सुरक्षित रखता है।
- source_word: λοιπὸν
  choice: इसके अलावा
  rationale: यह अभी बताए गए अपवाद के बाद शेष संभावनाओं की ओर संकेत करता है।
- source_word: οὐκ οἶδα
  choice: मुझे नहीं मालूम
  rationale: यूनानी पाठ सीधे ज्ञान के अभाव की बात करता है। प्रसंग में स्मरण का भाव संभव है, पर अनुवाद उसे स्पष्ट रूप से जोड़कर मूल से आगे नहीं जाता।
- source_word: εἴ τινα ἄλλον ἐβάπτισα
  choice: कि मैंने किसी और को बपतिस्मा दिया हो
  rationale: अप्रत्यक्ष प्रश्न में εἴ अनिश्चितता व्यक्त करता है; हिन्दी का संभावनार्थक “दिया हो” इसे सहज रूप से बनाए रखता है।
