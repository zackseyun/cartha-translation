translation:
  language: hi
  text: मैंने स्तिफनास के घराने को भी बपतिस्मा दिया था[a]। इसके अलावा, मुझे नहीं मालूम कि मैंने किसी और को बपतिस्मा दिया हो।
  philosophy: optimal-equivalence
  footnotes:
