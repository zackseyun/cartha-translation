  yaml_path: translation/nt/1_corinthians/001/025.yaml
  text: Because the foolishness of God is wiser than people, and the weakness of God is stronger than people.
translation:
  language: hi
  text: क्योंकि परमेश्वर की मूर्खता मनुष्यों से अधिक बुद्धिमान है, और परमेश्वर की निर्बलता मनुष्यों से अधिक शक्तिशाली है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μωρὸν τοῦ θεοῦ
  choice: परमेश्वर की मूर्खता
  rationale: यूनानी की जानबूझकर रखी गई विरोधाभासी अभिव्यक्ति को नरम किए बिना सुरक्षित रखता है; संदर्भ में यह उस बात को दर्शाती है जिसे लोग परमेश्वर की मूर्खता समझते हैं।
- source_word: σοφώτερον τῶν ἀνθρώπων
  choice: मनुष्यों की बुद्धि से अधिक बुद्धिमान
  rationale: तुलनात्मक अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है और ἀνθρώπων को समावेशी रूप से ‘मनुष्यों’ कहता है।
- source_word: τὸ ἀσθενὲς τοῦ θεοῦ
  choice: परमेश्वर की निर्बलता
  rationale: पहले खंड के समानांतर विरोधाभास और अमूर्त संज्ञात्मक रूप को बनाए रखता है।
- source_word: ἰσχυρότερον τῶν ἀνθρώπων
  choice: मनुष्यों के बल से अधिक बलवान
  rationale: यूनानी तुलनात्मक संरचना को सुबोध हिन्दी में व्यक्त करता है और मनुष्य के सामर्थ्य के साथ निहित तुलना स्पष्ट करता है।
theological_decisions:
- issue: क्या पद को ‘जिसे परमेश्वर की मूर्खता/निर्बलता समझा जाता है’ कहकर व्याख्यायित किया जाए
  choice: मूल विरोधाभासी भाषा ‘परमेश्वर की मूर्खता’ और ‘परमेश्वर की निर्बलता’ को मुख्य पाठ में बनाए रखा गया
  alternative: जिसे लोग परमेश्वर की मूर्खता और निर्बलता समझते हैं
  rationale: मूल यूनानी वास्तविक अलंकारिक तनाव को सीधे व्यक्त करता है; व्याख्यात्मक विस्तार उस तनाव को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘आदमियों’ के बजाय ‘मनुष्यों’ का प्रयोग ἀνθρώπων के व्यापक अर्थ के लिए किया गया है। दोनों समानांतर खंडों की लय और विरोधाभास सुरक्षित रखे गए हैं।
