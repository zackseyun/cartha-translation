id: 1CO.1.10
reference: 1 Corinthians 1:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/010.yaml
  text: I urge you[a], brothers, by the name of our Lord Jesus the Messiah, that you all say the same thing, and that there be no divisions among you[e][d][c][b], but that you be joined together in the same mind and in the same judgment.
translation:
  language: hi
  text: भाइयो और बहनो,[a] मैं हमारे प्रभु यीशु मसीह के नाम से तुमसे आग्रह करता हूँ कि तुम सब एक ही बात कहो और तुम्हारे बीच फूट न हो,[b] बल्कि तुम एक ही सोच और एक ही मत में पूरी तरह एकजुट रहो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘भाइयो’; यूनानी पुल्लिंग बहुवचन यहाँ पूरी विश्वास करने वाली मण्डली को संबोधित कर सकता है।
    reason: cultural_note
  - marker: b
    text: या ‘तुम्हारे बीच विभाजन न हों।’
    reason: lexical_alternative
  - marker: c
    text: ‘पूरी तरह एकजुट’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘ठीक किए हुए,’ ‘फिर से जोड़े हुए’ या ‘सुव्यवस्थित किए हुए’ भी हो सकता है; ‘मत’ का अनुवाद ‘निर्णय’ या ‘दृढ़ धारणा’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: मैं ... आग्रह करता हूँ
  rationale: यह क्रिया कठोर आदेश के बजाय गंभीर और आत्मीय प्रेरितिक अपील व्यक्त करती है; आधुनिक हिन्दी में ‘आग्रह करता हूँ’ स्वाभाविक है।
- source_word: δὲ
  choice: अलग शब्द से अनूदित नहीं
  rationale: यह हल्का प्रसंग-संयोजक है; हिन्दी वाक्य के प्रवाह में इसे ‘अब’ या ‘परन्तु’ बनाना अनावश्यक अर्थ जोड़ सकता है।
- source_word: ἀδελφοί
  choice: भाइयो और बहनो
  rationale: यूनानी रूप व्याकरणतः पुल्लिंग बहुवचन है, पर यहाँ पूरी विश्वास करने वाली मण्डली को संबोधित करता है; आधुनिक हिन्दी में समावेशी संबोधन आशय को स्पष्ट करता है, और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: διὰ τοῦ ὀνόματος
  choice: के नाम से
  rationale: διά के साथ संबंधकारक यहाँ आधार या अधिकार बताता है; ‘के नाम से’ यीशु के अधिकार पर आधारित अपील को सहज हिन्दी में व्यक्त करता है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός का पदवीगत अर्थ ‘अभिषिक्त जन/मसीह’ है; हिन्दी में ‘मसीह’ प्रचलित और अर्थपूर्ण पदवी है।
- source_word: τὸ αὐτὸ λέγητε πάντες
  choice: तुम सब एक ही बात कहो
  rationale: यह अपेक्षाकृत निकट अनुवाद पौलुस के साझा कथन और सहमति के बल को बनाए रखता है, केवल अमूर्त ‘सहमत रहो’ नहीं बनाता।
- source_word: σχίσματα
  choice: फूट
  rationale: ‘फूट’ मण्डली के भीतर टूटन और गुटबंदी को स्पष्ट, स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατηρτισμένοι
  choice: पूरी तरह एकजुट रहो
  rationale: निष्क्रिय परिणामसूचक रूप किसी चीज़ के ठीक से जोड़े, सुधारे या व्यवस्थित किए जाने का भाव रखता है; विभाजन के संदर्भ में यह चयन जुड़ी हुई एकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: νοῒ
  choice: सोच
  rationale: νοῦς यहाँ मन या सोचने के ढंग को सूचित करता है; ‘सोच’ γνώμη से भेद रखते हुए सहज है।
- source_word: γνώμῃ
  choice: मत
  rationale: γνώμη राय, निर्णय या दृढ़ अभिमत का भाव दे सकता है; ‘मत’ इस अस्पष्टता को संक्षेप में रखता और ‘सोच’ से भेद बनाए रखता है।
theological_decisions:
- issue: Χριστός की पदवी
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: मूल में पदवीगत अर्थ सक्रिय है; ‘मसीह’ हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और प्रचलित है, बिना किसी संप्रदायगत विस्तार के।
- issue: ἀδελφοί का सामुदायिक संबोधन
  choice: मुख्य पाठ में ‘भाइयो और बहनो’
  alternative: केवल ‘भाइयो’
  rationale: रूप पुल्लिंग बहुवचन है, किंतु संदर्भ में संबोधन पूरी कुरिन्थी मण्डली का है। समावेशी अर्थ मुख्य पाठ में स्वाभाविक रूप से व्यक्त किया गया है और रूपगत शाब्दिकता पादटिप्पणी में सुरक्षित है।
- issue: κατηρτισμένοι का पुनर्स्थापन अथवा एकता का भाव
  choice: पूरी तरह एकजुट रहो
  alternative: सुधारे जाओ / ठीक से जुड़े रहो
  rationale: मूल शब्द में मरम्मत, पुनर्स्थापन और ठीक से जोड़े जाने की अर्थ-छाया है। विभाजन-विरोधी संदर्भ में एकजुटता प्रमुख है, पर वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आत्मीय किन्तु गरिमापूर्ण प्रेरितिक संबोधन। ‘तुम’ बहुवचन मण्डलीगत संबोधन है। वाक्य को सहज रखने के लिए हल्के यूनानी संयोजक δὲ का अलग अनुवाद नहीं किया गया।
