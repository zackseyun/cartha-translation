language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ἀπολῶ τὴν σοφίαν τῶν σοφῶν, καὶ τὴν σύνεσιν τῶν συνετῶν ἀθετήσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/019.yaml
  text: 'For it is written: “I will destroy the wisdom of the wise[a], and I will set aside the understanding of the intelligent.”'
translation:
  language: hi
  text: 'क्योंकि लिखा है:

    “मैं बुद्धिमानों की बुद्धि नष्ट कर दूँगा,

    और समझदारों की समझ को निष्फल कर दूँगा।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समझदारों की समझ को रद्द कर दूँगा / ठुकरा दूँगा।”
    reason: ἀθετήσω के अर्थ-क्षेत्र में निष्फल करने के साथ रद्द करने और ठुकराने के भाव भी संभव हैं।
lexical_decisions:
- source_word: γέγραπται
  choice: लिखा है
  rationale: पवित्रशास्त्र के उद्धरण की प्रचलित भूमिका है और यूनानी पूर्णकाल के वर्तमान परिणाम को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में उस तार्किक संबंध को स्पष्ट रखता है।
- source_word: Ἀπολῶ
  choice: मैं ... नष्ट कर दूँगा
  rationale: ἀπόλλυμι के विनाश या मिटा देने के प्रबल भाव को सीधे और संयत रूप में व्यक्त करता है।
- source_word: τὴν σοφίαν τῶν σοφῶν
  choice: बुद्धिमानों की बुद्धि
  rationale: मूल के समान-मूल वाले शब्दों की आलंकारिक पुनरावृत्ति और संबंधवाचक रचना को सुरक्षित रखता है।
- source_word: τὴν σύνεσιν τῶν συνετῶν
  choice: समझदारों की समझ
  rationale: σύνεσις और συνετός की समान-मूल पुनरावृत्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है और पहली पंक्ति के समानांतर रहता है।
- source_word: ἀθετήσω
  choice: मैं ... निष्फल कर दूँगा
  rationale: यहाँ क्रिया के रद्द करने, अमान्य करने या प्रभावहीन बना देने के भाव को सहज हिन्दी में व्यक्त करता है, बिना अर्थ को किसी एक तकनीकी धारणा तक सीमित किए।
theological_decisions:
- issue: यशायाह के उद्धरण में परमेश्वर की ओर से मानवीय बुद्धि और समझ को उलटने की भाषा
  choice: 'दोनों भविष्यकालीन क्रियाओं को सीधे रखा गया: ‘नष्ट कर दूँगा’ और ‘निष्फल कर दूँगा’'
  alternative: दूसरी क्रिया को ‘रद्द कर दूँगा’ या ‘ठुकरा दूँगा’ कहना
  rationale: यह चयन मूल की प्रबलता और दोनों पंक्तियों की समानांतरता बनाए रखता है, पर यह नहीं बताता कि बुद्धि अपने आप में बुरी है; कथन का तनाव ज्यों का त्यों रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। काव्यात्मक समानांतरता के लिए ‘बुद्धिमानों की बुद्धि’ तथा ‘समझदारों की समझ’ रखा गया है।
