reference: 1 Corinthians 1:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πιστὸς ὁ θεὸς δι’ οὗ ἐκλήθητε εἰς κοινωνίαν τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/009.yaml
  text: God is faithful[a], by whom you were called into fellowship with his Son[c][b], Jesus the Messiah our Lord.
translation:
  language: hi
  text: परमेश्वर विश्वासयोग्य है, जिसके द्वारा तुम्हें उसके पुत्र, हमारे प्रभु यीशु मसीह, की संगति में बुलाया गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “संगति” का अर्थ “सहभागिता” या “साझेदारी” भी हो सकता है; अर्थात उसके पुत्र के साथ संगति।
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: विश्वासयोग्य
  rationale: यह विधेय विशेषण परमेश्वर के भरोसेमंद और निष्ठावान चरित्र को व्यक्त करता है; आधुनिक मानक हिन्दी में “विश्वासयोग्य” संक्षिप्त और गरिमापूर्ण है।
- source_word: δι’ οὗ
  choice: जिसके द्वारा
  rationale: διά के संबंधकारक प्रयोग में माध्यम अथवा कर्तृत्व दोनों की छाया हो सकती है; “जिसके द्वारा” यूनानी संरचना और इस अस्पष्टता को पर्याप्त रूप से सुरक्षित रखता है।
- source_word: ἐκλήθητε
  choice: तुम्हें ... बुलाया गया
  rationale: अओरिस्ट कर्मवाच्य का सीधा अर्थ सुरक्षित रहता है और पौलुस के बुलाहट-संबंधी प्रयोग को केवल निमंत्रण बनाकर हल्का नहीं किया जाता।
- source_word: κοινωνίαν
  choice: संगति
  rationale: यह संबंध, सहभागिता और साझेदारी के अर्थ-क्षेत्र को समेटता है; “संगति” हिन्दी बाइबलीय शैली में परिचित होने के साथ सामान्य पाठक के लिए भी बोधगम्य है।
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: उसके पुत्र ... की
  rationale: यूनानी संबंधकारक को हिन्दी की स्वाभाविक “की संगति” संरचना में रखा गया है; इसका आशय पुत्र के साथ संगति है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός यहाँ यीशु की उपाधि है; हिन्दी में स्थापित और अर्थवाही रूप “मसीह” है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος की मानक, गरिमापूर्ण और मसीह-संबंधी उपाधि को सुरक्षित रखने वाला हिन्दी रूप है।
theological_decisions:
- issue: κοινωνίαν τοῦ υἱοῦ αὐτοῦ में संबंधकारक को कैसे व्यक्त किया जाए
  choice: उसके पुत्र ... की संगति में
  alternative: उसके पुत्र ... के साथ संगति में
  rationale: चुना गया रूप यूनानी संबंधकारक के अधिक निकट है और हिन्दी में स्वाभाविक भी है; पाठक-सहायता के लिए पादटिप्पणी में “सहभागिता/साझेदारी” और “के साथ” का भाव स्पष्ट किया गया है।
- issue: Χριστοῦ को नाम-जैसे “क्राइस्ट” या अनूदित उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: क्राइस्ट
  rationale: यहाँ Ἰησοῦ Χριστοῦ में उपाधि का अर्थ सक्रिय है; “मसीह” हिन्दी में स्वीकृत अनूदित उपाधि है और किसी संप्रदायगत विशिष्टता को नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सरल बाइबलीय गद्य। “तुम्हें” बहुवचन समुदाय को संबोधित करता है। वाक्य-विन्यास मूल यूनानी के निकट रखा गया है, पर हिन्दी में अस्वाभाविकता से बचने के लिए उपाधियों को “उसके पुत्र, हमारे प्रभु यीशु मसीह” के रूप में व्यवस्थित किया गया है।
