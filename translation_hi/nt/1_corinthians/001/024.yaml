source:
  edition: SBLGNT
  text: αὐτοῖς δὲ τοῖς κλητοῖς, Ἰουδαίοις τε καὶ Ἕλλησιν, Χριστὸν θεοῦ δύναμιν καὶ θεοῦ σοφίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/024.yaml
  text: But to those who are called[a], both Jews and Greeks, Messiah is the power of God and the wisdom of God.
translation:
  language: hi
  text: परन्तु जो बुलाए हुए हैं—चाहे वे यहूदी हों या यूनानी—उनके लिए मसीह परमेश्वर की सामर्थ्य और परमेश्वर की बुद्धि हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλητοῖς
  choice: जो बुलाए हुए हैं
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और परमेश्वर के बुलावे से पहचाने जाने वाले लोगों को दर्शाता है। यह रूप बुलाए जाने की क्रियात्मक धारणा को बनाए रखता है।
- source_word: Ἰουδαίοις
  choice: यहूदी
  rationale: ‘यूनानियों’ के साथ इस पौलुसी युग्म में जातीय-धार्मिक अर्थ प्रमुख है।
- source_word: Ἕλλησιν
  choice: यूनानी
  rationale: मूल पाठ के स्पष्ट शब्द को बनाए रखा गया है; ‘गैर-यहूदी’ अधिक व्यापक और व्याख्यात्मक होता।
- source_word: Χριστόν
  choice: मसीह
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उसके अभिषिक्त उद्धारकर्ता संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θεοῦ δύναμιν
  choice: परमेश्वर की सामर्थ्य
  rationale: सम्बन्धकारक संरचना को औपचारिक और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: θεοῦ σοφίαν
  choice: परमेश्वर की बुद्धि
  rationale: पहले पदबंध के समानांतर मूल की पुनरावृत्ति और संरचना को बनाए रखा गया है।
- source_word: implicit copula / verbless predicate relation
  choice: मसीह ... हैं
  rationale: यूनानी वाक्य पिछले पद की वाक्य-रचना पर निर्भर है; हिन्दी में विधेय-संबंध स्पष्ट करने के लिए सहायक क्रिया दी गई है। आदरसूचक एकवचन ‘हैं’ हिन्दी के बाइबलीय प्रयोग में स्वाभाविक है।
theological_decisions:
- issue: Χριστός को मसीही उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त / क्राइस्ट
  rationale: यहाँ उपाधिगत अर्थ सक्रिय है। ‘मसीह’ अर्थवाची और हिन्दी पाठकों के लिए स्थापित रूप है, जबकि लिप्यंतरण मूल उपाधि का अर्थ कम स्पष्ट करता है।
- issue: मसीह का ‘परमेश्वर की सामर्थ्य और बुद्धि’ होना
  choice: सीधा विधेयात्मक कथन
  alternative: ‘हम मसीह का प्रचार करते हैं, जो परमेश्वर की सामर्थ्य और बुद्धि हैं’
  rationale: मूल की संक्षिप्त, बलयुक्त रचना को सुरक्षित रखा गया है और पिछले पद से कोई अतिरिक्त वाक्यांश इस पद में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप। ‘परन्तु’ विरोध को, तथा डैश यहूदियों और यूनानियों को ‘बुलाए हुओं’ के अंतर्गत स्पष्ट करता है। किसी पादटिप्पणी की आवश्यकता नहीं है।
