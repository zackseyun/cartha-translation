  yaml_path: translation/nt/1_corinthians/001/023.yaml
  text: but we preach the Messiah crucified[a], to Jews a stumbling block and to Gentiles foolishness[b],
translation:
  language: hi
  text: पर हम क्रूस पर चढ़ाए गए मसीह का प्रचार करते हैं[a]—यहूदियों के लिए ठोकर और गैर-यहूदियों के लिए मूर्खता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्रूस पर चढ़ाए गए ख्रीस्त।”
    reason: Χριστός के पारंपरिक वैकल्पिक लिप्यंतरण को दर्शाने के लिए।
  - marker: b
    text: यूनानी में “जातियों”; यहाँ यहूदियों के विपरीत गैर-यहूदी लोगों का संकेत है।
    reason: मूल शब्द के व्यापक शाब्दिक अर्थ और संदर्भगत अर्थ को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: κηρύσσομεν
  choice: प्रचार करते हैं
  rationale: यह सार्वजनिक और अधिकारपूर्ण घोषणा का स्वाभाविक हिन्दी रूप है तथा पौलुस की प्रचार-संबंधी भाषा के अनुकूल है।
- source_word: Χριστόν
  choice: मसीह
  rationale: यहाँ शब्द यीशु की पदवी और घोषित पहचान को व्यक्त करता है; हिन्दी में ‘मसीह’ इस शीर्षक को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἐσταυρωμένον
  choice: क्रूस पर चढ़ाए गए
  rationale: यह पूर्ण निष्क्रिय कृदंत की उस अवस्था को व्यक्त करता है जो क्रूस पर चढ़ाए जाने के परिणामस्वरूप मसीह से जुड़ी है, बिना हिन्दी को अस्वाभाविक बनाए।
- source_word: Ἰουδαίοις
  choice: यहूदियों के लिए
  rationale: यहूदी और गैर-यहूदी के जातीय-धार्मिक विरोध को स्पष्ट रूप से व्यक्त करता है।
- source_word: σκάνδαλον
  choice: ठोकर का कारण
  rationale: यह मूल रूपक को बनाए रखता है; केवल ‘अपमान’ या ‘बाधा’ कहने से उसका चित्रात्मक बल घट जाता।
- source_word: ἔθνεσιν
  choice: गैर-यहूदियों के लिए
  rationale: शाब्दिक अर्थ ‘जातियाँ’ है, पर यहाँ यहूदियों के स्पष्ट विरोध में इसका आशय अन्यजातीय लोगों से है; आधुनिक हिन्दी में ‘गैर-यहूदी’ अधिक सहज और स्पष्ट है।
- source_word: μωρίαν
  choice: मूर्खता
  rationale: यह इसी अध्याय में पौलुस के बार-बार प्रयुक्त विचार और संसार की दृष्टि में संदेश के मूल्यांकन को सुरक्षित रखता है।
theological_decisions:
- issue: Χριστός को पदवी के रूप में या नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त
  rationale: संदर्भ प्रेरितों की घोषणा की विषय-वस्तु और यीशु के मसीही पद पर बल देता है; इसलिए अर्थयुक्त पारंपरिक पदवी ‘मसीह’ उपयुक्त है।
- issue: ἐσταυρωμένον के पूर्णकालिक पक्ष को हिन्दी में व्यक्त करना
  choice: क्रूस पर चढ़ाए गए मसीह
  alternative: जिस मसीह को क्रूस पर चढ़ाया गया
  rationale: चुना गया रूप क्रूस की ऐतिहासिक घटना और उसके बने रहने वाले महत्व दोनों के लिए पर्याप्त खुला है तथा वाक्य को संक्षिप्त रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘पर’ δέ के विरोधात्मक बल को स्वाभाविक ढंग से व्यक्त करता है। मुख्य कथन और दोनों श्रोतृ-समूहों की प्रतिक्रियाओं के बीच डैश हिन्दी में वाक्य-संबंध को स्पष्ट करता है।
