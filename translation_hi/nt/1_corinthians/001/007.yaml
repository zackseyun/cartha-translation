  choice: घटी नहीं रखते
  rationale: यह किसी बात में अभाव या कमी न होने का भाव देता है। ‘घटी नहीं रखते’ गरिमापूर्ण और सामान्य बाइबलीय हिन्दी में स्पष्ट है।
- source_word: ἐν μηδενὶ χαρίσματι
  choice: किसी भी वरदान में
  rationale: χάρισμα अनुग्रह से दिए गए वरदान को सूचित करता है। मुख्य पाठ में ‘वरदान’ सहज है और ‘आत्मिक’ जैसा अनकहा विशेषण नहीं जोड़ता।
- source_word: ἀπεκδεχομένους
  choice: बड़ी उत्सुकता से प्रतीक्षा कर रहे हो
  rationale: संयुक्त क्रिया लगातार और उत्कट अपेक्षा के साथ प्रतीक्षा करने का भाव रखती है; यह अनुवाद उस बल को स्पष्ट करता है।
- source_word: ἀποκάλυψιν
  choice: प्रकट होने
  rationale: संदर्भ में यह यीशु मसीह के अंतिम प्राकट्य की ओर संकेत करता है। ‘प्रकट होने’ सामान्य पाठक के लिए स्वाभाविक है, जबकि अधिक शब्दानुरूप विकल्प पादटिप्पणी में रखा गया है।
- source_word: κυρίου
  choice: प्रभु
  rationale: नए नियम के इस प्रयोग में κύριος का मानक, गरिमापूर्ण हिन्दी समतुल्य ‘प्रभु’ है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: हिन्दी में यह स्थापित और स्वाभाविक नाम-सदृश पदबंध है; ‘मसीह’ Χριστός की उपाधिगत पृष्ठभूमि को भी बनाए रखता है।
theological_decisions:
- issue: ἀποκάλυψις को अंतिम समय के संदर्भ में कैसे व्यक्त किया जाए
  choice: प्रकट होना
  alternative: प्रकाशन या अनावरण
  rationale: मुख्य पाठ में व्यक्ति के प्रत्यक्ष प्राकट्य का भाव सहज रूप से व्यक्त होता है, पर स्रोत शब्द के ‘अनावरण/प्रकाशन’ संबंधी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: Ἰησοῦ Χριστοῦ में Χριστός का रूप
  choice: यीशु मसीह
  alternative: यीशु, अभिषिक्त जन
  rationale: इस प्रसंग में पूरा पदबंध नाम-सदृश है। ‘मसीह’ हिन्दी में प्रचलित है और उपाधि को किसी संप्रदायगत व्याख्या के बिना सुरक्षित रखता है।
