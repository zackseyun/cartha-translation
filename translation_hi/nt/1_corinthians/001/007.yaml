  register: आधुनिक मानक हिन्दी में सामुदायिक बहुवचन ‘तुम’ रखा गया है। शैली सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है; मुख्य पाठ में अनावश्यक तकनीकी शब्दों से बचते हुए स्रोत की अर्थगत सूक्ष्मताएँ पादटिप्पणियों में सुरक्षित रखी गई हैं।
