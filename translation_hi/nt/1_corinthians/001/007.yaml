lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले संदर्भ में वर्णित परमेश्वर के अनुग्रह का परिणाम प्रस्तुत करता है; ‘इसलिए’ आधुनिक हिन्दी में इस परिणाम-संबंध को स्वाभाविक रूप से व्यक्त करता है।
