lexical_decisions:
- source_word: λόγος
  choice: संदेश
  rationale: यहाँ शब्द से आशय क्रूस के विषय में घोषित बात से है; ‘संदेश’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: σταυροῦ
  choice: क्रूस
  rationale: मूल के संक्षिप्त रूप को बनाए रखता है और मसीह की क्रूस-मृत्यु की ओर संकेत करता है।
- source_word: ἀπολλυμένοις
  choice: नाश की ओर जा रहे लोगों
  rationale: वर्तमान कृदन्त की जारी अवस्था को व्यक्त करता है; केवल ‘नाश होनेवालों’ की अपेक्षा आधुनिक हिन्दी में अधिक सहज है।
- source_word: μωρία
  choice: मूर्खता
  rationale: पौलुस द्वारा परमेश्वर की सामर्थ्य के साथ किए गए तीखे विरोध को स्पष्ट रूप से बनाए रखता है।
- source_word: σῳζομένοις
  choice: हम उद्धार पा रहे लोगों
  rationale: वर्तमान कृदन्त के जारी पक्ष और स्पष्ट ἡμῖν (‘हमारे लिए’) दोनों को सुरक्षित रखता है।
- source_word: δύναμις θεοῦ
  choice: परमेश्वर की सामर्थ्य
  rationale: मूल की अर्थवत्ता और धार्मिक गरिमा को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: σῳζομένοις में उद्धार का पक्ष
  choice: हम उद्धार पा रहे लोगों
  alternative: हम उद्धार पाए हुए लोगों
  rationale: यूनानी वर्तमान कृदन्त उद्धार को यहाँ जारी वर्तमान वास्तविकता के रूप में प्रस्तुत करता है; अनुवाद इस तनाव को केवल अतीत की घटना में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पाठ में सहज है। ‘क्रूस’ स्थापित बाइबलीय पद है, जबकि ‘संदेश’ λόγος के प्रसंगगत अर्थ को साधारण पाठक के लिए स्पष्ट करता है।
