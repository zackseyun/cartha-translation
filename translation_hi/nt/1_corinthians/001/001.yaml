translation:
  language: hi
  text: पौलुस, परमेश्वर की इच्छा से मसीह यीशु का बुलाया हुआ प्रेरित, और भाई सोस्थिनेस,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: पौलुस
  rationale: यह यूनानी व्यक्तिगत नाम का हिन्दी बाइबल-परंपरा में प्रचलित और सहज रूप है।
- source_word: κλητὸς ἀπόστολος
  choice: प्रेरित होने के लिए बुलाया गया
  rationale: κλητός के बुलाहट-संबंधी अर्थ और ἀπόστολος के अधिकृत पद, दोनों को स्वाभाविक हिन्दी में स्पष्ट करता है; केवल ‘बुलाया हुआ प्रेरित’ हिन्दी में असहज और संदिग्ध हो सकता है।
- source_word: Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु
  rationale: यहाँ Χριστός यीशु की मसीही पदवी बताता है; शब्दक्रम भी यूनानी स्रोत के अनुरूप रखा गया है।
- source_word: διὰ θελήματος θεοῦ
  choice: परमेश्वर की इच्छा से
  rationale: διά के साथ संबंधकारक यहाँ माध्यम अथवा आधार व्यक्त करता है; यह संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: Σωσθένης
  choice: सोस्थिनेस
  rationale: यूनानी व्यक्तिगत नाम का निकट और प्रचलित हिन्दी लिप्यंतरण।
- source_word: ὁ ἀδελφὸς
  choice: भाई
  rationale: संदर्भ में यह सहविश्वासी के लिए पारिवारिक संबोधन है। हिन्दी में नाम से पहले ‘भाई’ निश्चित उपपद की भूमिका स्वाभाविक रूप से निभाता है और स्रोत में अनुपस्थित ‘हमारा’ जोड़ने से बचाता है।
theological_decisions:
- issue: पौलुस की बुलाहट और प्रेरिताई का संबंध
  choice: प्रेरित होने के लिए बुलाया गया
  alternative: बुलाया हुआ प्रेरित
  rationale: यह रूप प्रेरिताई को परमेश्वर की बुलाहट से जुड़ा रखता है, पर यह नहीं बताता कि बुलाहट और नियुक्ति के बीच कोई पृथक कालक्रम था।
- issue: Χριστός को पदवी या नाम-सदृश तत्व मानना
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु
  rationale: इस आत्मपरिचय में Χριστός मसीही पदवी का अर्थ बनाए रखता है; फिर भी प्रचलित पारंपरिक रूप को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। पद का वाक्य आगे आने वाले अभिवादन से जुड़ता है, इसलिए अंत में अल्पविराम रखा गया है।
