id: 1CO.1.8
reference: 1 Corinthians 1:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃς καὶ βεβαιώσει ὑμᾶς ἕως τέλους ἀνεγκλήτους ἐν τῇ ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/008.yaml
  text: who will also establish you to the end[c][b][a], blameless in the day of our Lord Jesus the Messiah.
translation:
  language: hi
  text: वही आपको अन्त तक दृढ़ भी बनाए रखेगा[a], ताकि हमारे प्रभु यीशु मसीह के दिन आप निर्दोष[b] ठहरें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्थिर करेगा’ अथवा ‘पक्का करेगा’।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ऐसे जिन पर कोई आरोप न टिक सके; या ‘दोषरहित’।
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαιώσει
  choice: दृढ़ भी बनाए रखेगा
  rationale: क्रिया किसी को स्थिर और अटल करने का भाव देती है। भविष्यकाल और अन्त तक जारी रहने वाले संरक्षण के संदर्भ में यह स्वाभाविक हिन्दी है; ‘स्थिर करेगा’ भी सम्भव है।
- source_word: ἕως τέλους
  choice: अन्त तक
  rationale: यह समय की उस अवधि को व्यक्त करता है जो अन्तिम बिन्दु तक पहुँचती है; ‘अन्त तक’ संक्षिप्त और स्वाभाविक है।
- source_word: ἀνεγκλήτους
  choice: निर्दोष ठहरें
  rationale: शब्द का अर्थ ऐसा होना है जिस पर कोई आरोप न लगाया जा सके। हिन्दी वाक्य में उद्देश्यसूचक ‘ताकि ... निर्दोष ठहरें’ उस न्यायिक छाया को सहज रूप से व्यक्त करता है।
- source_word: ἐν τῇ ἡμέρᾳ
  choice: के दिन
  rationale: अन्तिम न्याय या प्रकट होने के निर्धारित दिन के लिए यह हिन्दी का स्वाभाविक बाइबलीय प्रयोग है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος के पदवीगत और श्रद्धापूर्ण अर्थ के लिए ‘प्रभु’ मानक तथा स्वाभाविक हिन्दी है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός यहाँ यीशु की पदवी है; ‘मसीह’ उसके अभिषिक्त उद्धारकर्ता के अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: ὃς (‘वही/जो’) का पूर्वपद
  choice: सर्वनाम को पद 7 के निकटतम पूर्वपद, ‘हमारे प्रभु यीशु मसीह’, की ओर संकेत करने वाला माना गया है।
  alternative: इसे पहले के व्यापक संदर्भ में परमेश्वर की ओर संकेत करने वाला माना जा सकता है।
  rationale: निकटतम पुल्लिंग एकवचन पूर्वपद ‘हमारे प्रभु यीशु मसीह’ है। ‘वही’ पिछले पद से सम्बन्ध स्पष्ट रखता है, यद्यपि इस अकेले पद में उसका नाम दोहराया नहीं गया।
- issue: ἀνεγκλήτους का वाक्यगत सम्बन्ध
  choice: इसे अन्तिम दिन विश्वासियों की आरोप-रहित दशा के रूप में उद्देश्य/परिणाम के ढंग से व्यक्त किया गया है।
  alternative: ‘आपको अन्त तक निर्दोष दृढ़ बनाए रखेगा’ कहकर इसे सीधे क्रिया के पूरक के रूप में जोड़ा जा सकता है।
  rationale: यूनानी में विशेषण कर्मकारक बहुवचन है और ὑμᾶς से सम्बन्धित है। ‘ताकि ... ठहरें’ हिन्दी में अर्थ स्पष्ट करता है, बिना दोषहीनता की प्रक्रिया या आधार पर अतिरिक्त धर्मवैज्ञानिक दावा किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक बहुवचन ‘आप’ रखा गया है। शैली सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य है। ‘मसीह’ को पदवी के रूप में रखा गया है; हिन्दी में इसके साथ अलग निश्चित उपपद आवश्यक नहीं है।
