source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/017.yaml
  text: For Messiah did not send me to baptize[a], but to proclaim the good news—not in wisdom of speech[c][b], so that the cross of Messiah might not be emptied.
translation:
  language: hi
  text: क्योंकि मसीह[a] ने मुझे बपतिस्मा देने के लिए नहीं, बल्कि शुभ समाचार सुनाने के लिए भेजा—वाक्-कौशल के साथ नहीं[b], ताकि मसीह का क्रूस निष्प्रभावी न कर दिया जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी: ख्रिस्तोस; पारंपरिक रूप से ‘ख्रीस्त’। ‘मसीह’ का अर्थ ‘अभिषिक्त जन’ है।'
    reason: lexical_alternative
  - marker: b
    text: या, अधिक शाब्दिक रूप से, ‘वाणी की बुद्धि में नहीं’ या ‘शब्द की बुद्धि में नहीं’।
    reason: lexical_alternative
  - marker: c
    text: अधिक शाब्दिक रूप से, ‘खाली न कर दिया जाए’; या ‘व्यर्थ न कर दिया जाए’।
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς / τοῦ Χριστοῦ
  choice: मसीह / मसीह का
  rationale: Χριστός को अर्थपूर्ण उपाधि के रूप में अनूदित किया गया है; दोनों occurrences में एकरूपता रखी गई है।
- source_word: βαπτίζειν
  choice: बपतिस्मा देने के लिए
  rationale: यह प्रचलित और संदर्भानुकूल कलीसियाई पद है तथा क्रिया के अर्थ को किसी अधिक संकीर्ण विधिगत व्याख्या तक सीमित नहीं करता।
- source_word: εὐαγγελίζεσθαι
  choice: शुभ समाचार सुनाने के लिए
  rationale: क्रिया के घोषणा-संबंधी अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σοφίᾳ λόγου
  choice: वाणी की बुद्धि से
  rationale: λόγος को यहाँ वाणी अथवा भाषण के अर्थ में लेते हुए यूनानी पदबंध की जानबूझकर बनी हुई संक्षिप्तता और संभावित अस्पष्टता को सुरक्षित रखा गया है।
- source_word: κενωθῇ
  choice: निष्प्रभावी न कर दिया जाए
  rationale: यूनानी निष्क्रिय क्रिया का भाव बनाए रखते हुए हिन्दी में उसका प्रसंगगत अर्थ स्वाभाविक रूप से व्यक्त किया गया है; अधिक शाब्दिक 'खाली कर दिया जाए' को टिप्पणी में रखा गया है।
- source_word: σταυρὸς
  choice: क्रूस
  rationale: यह पौलुस के प्रयोग के अनुरूप मानक, संक्षिप्त और धर्मवैज्ञानिक रूप से तटस्थ हिन्दी पद है।
theological_decisions:
- issue: Χριστός को उपाधि के अर्थ में अनूदित करना या पारंपरिक रूप 'ख्रीस्त' रखना
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस पद में शब्द का मसीही उपाधि-बल बना हुआ है; अर्थ का अनुवाद केवल ध्वन्यंतरण की अपेक्षा उसे अधिक स्पष्ट रूप से सुरक्षित रखता है।
- issue: κενωθῇ में निहित रूपक को शाब्दिक रखना या उसका प्रसंगगत प्रभाव व्यक्त करना
  choice: निष्प्रभावी न कर दिया जाए
  alternative: खाली न कर दिया जाए; व्यर्थ न कर दिया जाए
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है, पर यह नहीं बताया गया कि क्रूस वास्तव में अपनी सामर्थ्य खो सकता है; वाक्य केवल उस संभावित परिणाम को उद्देश्यवाचक रूप में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वाणी की बुद्धि’ यूनानी पदबंध की संक्षिप्तता को बनाए रखता है, जबकि पादटिप्पणी उसके अलंकारिक अथवा वाक्-कौशल संबंधी अर्थ की संभावना बताती है।
