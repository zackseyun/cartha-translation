id: 1CO.1.30
reference: 1 Corinthians 1:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐξ αὐτοῦ δὲ ὑμεῖς ἐστε ἐν Χριστῷ Ἰησοῦ, ὃς ἐγενήθη ⸂σοφία ἡμῖν⸃ ἀπὸ θεοῦ, δικαιοσύνη τε καὶ ἁγιασμὸς καὶ ἀπολύτρωσις,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/030.yaml
  text: And it is from him that you are in Messiah Jesus[a], who became for us wisdom from God, and righteousness and sanctification and redemption,
translation:
  language: hi
  text: परन्तु उसी से तुम मसीह यीशु में हो, जो हमारे लिए परमेश्वर की ओर से बुद्धि, धार्मिकता[a], पवित्रीकरण और छुटकारा बन गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्याय’।
    reason: δικαιοσύνη का एक वास्तविक वैकल्पिक अर्थ सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ἐξ αὐτοῦ
  choice: उसी से
  rationale: यह पदबंध स्रोत या उद्गम को व्यक्त करता है और इस बात पर बल देता है कि विश्वासियों का मसीह यीशु में होना परमेश्वर से है। निकटवर्ती संदर्भ के कारण सर्वनाम को बनाए रखा गया है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ‘में’ पौलुस की मसीह के साथ संबंध की संक्षिप्त भाषा को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है; Χριστός को उसके उपाधिगत अर्थ में ‘मसीह’ किया गया है।
- source_word: ἐγενήθη
  choice: बन गया
  rationale: यह γίνομαι का स्वाभाविक आधुनिक हिन्दी रूप है और बताता है कि मसीह विश्वासियों के लिए क्या हुआ।
- source_word: σοφία
  choice: ज्ञान
  rationale: यह 1 कुरिन्थियों 1 में संसार के ज्ञान और परमेश्वर के ज्ञान के बीच विरोध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπὸ θεοῦ
  choice: परमेश्वर की ओर से
  rationale: यह परमेश्वर को स्रोत के रूप में बनाए रखता है और वाक्य में ‘ज्ञान’ के साथ इसका निकट संबंध भी सुरक्षित रखता है।
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: यह पौलुस के उद्धार-संबंधी प्रसंग में प्रचलित और उपयुक्त अर्थ है; ‘न्याय’ को पादटिप्पणी में वैकल्पिक अर्थ के रूप में रखा गया है।
- source_word: ἁγιασμός
  choice: पवित्रीकरण
  rationale: यह पवित्र किए जाने या पवित्र ठहराए जाने की धारणा को ‘पवित्रता’ की अपेक्षा अधिक सटीक रूप से सुरक्षित रखता है।
- source_word: ἀπολύτρωσις
  choice: छुटकारा
  rationale: यह बंधन से मुक्त किए जाने के अर्थ को साधारण आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘परमेश्वर की ओर से ज्ञान’ और इसके बाद आने वाली तीन संज्ञाओं का संबंध
  choice: चारों संज्ञाओं को यूनानी क्रम में एक साथ रखा गया है, जिसमें ‘परमेश्वर की ओर से’ का निकटतम संबंध ‘ज्ञान’ से है।
  alternative: ‘धार्मिकता, पवित्रीकरण और छुटकारा’ को ‘ज्ञान’ की स्पष्ट व्याख्या मानना, या ‘परमेश्वर की ओर से’ को चारों संज्ञाओं पर समान रूप से लागू करना।
  rationale: बिना ‘अर्थात्’ या व्याख्यात्मक विराम-चिह्न जोड़े यूनानी वाक्य-विन्यास की संभावित अस्पष्टता और धर्मवैज्ञानिक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘धार्मिकता’ और ‘पवित्रीकरण’ जैसे स्थापित धर्मवैज्ञानिक शब्द मूल की संकल्पनात्मक सटीकता बनाए रखने के लिए प्रयुक्त हुए हैं।
