source:
  edition: SBLGNT
  text: Βλέπετε γὰρ τὴν κλῆσιν ὑμῶν, ἀδελφοί, ὅτι οὐ πολλοὶ σοφοὶ κατὰ σάρκα, οὐ πολλοὶ δυνατοί, οὐ πολλοὶ εὐγενεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/026.yaml
  text: 'For consider your calling, brothers: not many of you were wise by human standards, not many were powerful, not many were of noble birth.'
translation:
  language: hi
  text: 'क्योंकि, भाइयो[a], अपनी बुलाहट पर विचार करो: मानवीय दृष्टि से तुममें बहुत-से बुद्धिमान नहीं थे, बहुत-से शक्तिशाली नहीं थे, और बहुत-से ऊँचे कुल में जन्मे नहीं थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भाइयो” संबोधन पूरी मंडली के लिए है और इसमें विश्वास करने वाली स्त्रियाँ भी सम्मिलित हैं।
    reason: cultural_note
lexical_decisions:
- source_word: Βλέπετε
  choice: विचार करो
  rationale: यूनानी रूप आज्ञार्थक या निर्देशार्थक दोनों समझा जा सकता है; प्रसंग में पौलुस मंडली को अपनी स्थिति पर ध्यान देने के लिए प्रेरित करता है। “विचार करो” इस आलंकारिक आग्रह को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: κλῆσιν ὑμῶν
  choice: अपने बुलाए जाने
  rationale: यह परमेश्वर की ओर से मिले बुलावे की घटना और उससे बनी विश्वासियों की स्थिति की ओर संकेत करता है। कर्मवाच्य अभिव्यक्ति स्रोत में निहित कर्ता को अनावश्यक रूप से स्पष्ट किए बिना अर्थ बताती है।
- source_word: ἀδελφοί
  choice: भाइयो[a]
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है। मुख्य पाठ में उसका रूप रखा गया है, जबकि पूरी मंडली के लिए उसके सामूहिक प्रयोग को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: κατὰ σάρκα
  choice: मानवीय दृष्टि से
  rationale: इस प्रसंग में वाक्यांश शाब्दिक देह के बजाय मनुष्यों के आकलन या सामाजिक मानदंड को दर्शाता है। यह चयन आधुनिक हिंदी में उसी आशय को स्पष्ट रखता है।
- source_word: δυνατοί
  choice: शक्तिशाली
  rationale: यह सामाजिक या सार्वजनिक सामर्थ्य को व्यापक रूप से व्यक्त करता है और शक्ति के किसी एक प्रकार को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: εὐγενεῖς
  choice: ऊँचे कुल में जन्मे
  rationale: शब्द उच्च वंश या प्रतिष्ठित जन्म को सूचित करता है; यह अभिव्यक्ति समकालीन हिंदी में “कुलीन” की अपेक्षा अधिक स्पष्ट है।
theological_decisions:
- issue: κλῆσις में बुलाने वाले की पहचान
  choice: कर्मवाच्य “बुलाए जाने” के द्वारा कर्ता को मुख्य पाठ में निहित रखा गया
  alternative: “परमेश्वर के बुलावे” कहकर कर्ता को स्पष्ट करना
  rationale: पौलुस के प्रयोग में बुलाने वाला परमेश्वर है, पर इस पद के यूनानी पाठ में उसका नाम प्रत्यक्ष नहीं है; चुना गया रूप अर्थ को बनाए रखते हुए पाठ से अधिक स्पष्टता नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “बुलाए जाने” धार्मिक अर्थ को बनाए रखते हुए पेशे या व्यवसाय वाली सामान्य “बुलाहट” की संभावित गलतफहमी से बचाता है; समानांतर तीनों खंडों की पुनरावृत्ति यूनानी वाक्य की आलंकारिक लय को सुरक्षित रखती है।
