  yaml_path: translation/nt/1_corinthians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: hi
  text: हमारे पिता परमेश्वर और प्रभु यीशु मसीहा[a] की ओर से तुम्हें अनुग्रह और शांति मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: ‘प्रभु यीशु मसीह।’'
    reason: Χριστός के लिए प्रचलित पारंपरिक हिन्दी रूप।
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: यह पौलुस के अभिवादन में प्रयुक्त प्रमुख शब्द है। ‘अनुग्रह’ परमेश्वर की कृपा और उदार भलाई, दोनों का धर्मवैचारिक भार बनाए रखता है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: पत्र के प्राप्तकर्ताओं को संबोधित इस दत्तिव रूप का आधुनिक मानक हिन्दी में स्वाभाविक रूप ‘तुम्हें’ है।
- source_word: εἰρήνη
  choice: शांति
  rationale: ‘शांति’ संबंधों की मेल-मिलापपूर्ण अवस्था और समग्र कुशलता—दोनों अर्थ-संकेतों को बनाए रखती है।
- source_word: ἀπὸ
  choice: की ओर से
  rationale: यह अनुग्रह और शांति के स्रोत को स्वाभाविक हिन्दी में स्पष्ट करता है; एक ही पदबंध दोनों समन्वित व्यक्तियों पर लागू है।
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: हमारे पिता परमेश्वर
  rationale: यह यूनानी पदबंध के संबंध को स्वाभाविक हिन्दी में व्यक्त करता है और ‘परमेश्वर’ तथा ‘हमारे पिता’ को एक ही व्यक्ति के लिए प्रयुक्त रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: ‘प्रभु’ κύριος का स्थापित और गरिमापूर्ण हिन्दी प्रतिशब्द है तथा उपाधि का धार्मिक बल बनाए रखता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीहा
  rationale: Χριστός यहाँ उपाधि के रूप में अभी भी अर्थवान है; ‘मसीहा’ उसके ‘अभिषिक्त जन’ वाले अर्थ को पाठक के सामने रखता है। प्रचलित ‘मसीह’ को पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: क्या अनुग्रह और शांति का एक ही स्रोत-संबंध पिता परमेश्वर और प्रभु यीशु दोनों के साथ बनाए रखा जाए?
  choice: एक ही ‘की ओर से’ पदबंध को ‘हमारे पिता परमेश्वर’ और ‘प्रभु यीशु मसीहा’ दोनों पर लागू रखा गया है।
  alternative: ‘प्रभु यीशु मसीहा की ओर से’ से पहले स्रोत-सूचक पदबंध को दोहराना।
  rationale: यूनानी में एक ही ἀπό दोनों समन्वित पदों को नियंत्रित करता है। हिन्दी वाक्य उसी साझा संबंध को बिना अतिरिक्त धर्मवैचारिक व्याख्या के बनाए रखता है।
- issue: Χριστός को अर्थानुवादित उपाधि के रूप में रखा जाए या पारंपरिक रूप में?
  choice: मुख्य पाठ में ‘मसीहा’।
  alternative: ‘मसीह’।
  rationale: यहाँ नाम के साथ प्रयुक्त होने पर भी उपाधिगत अर्थ जीवित है। ‘मसीहा’ उस अर्थ को अधिक प्रत्यक्ष करता है, जबकि पारंपरिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। यूनानी में क्रिया न होने पर भी हिन्दी आशीर्वचन को स्वाभाविक बनाने के लिए ‘मिले’ जोड़ा गया है। ‘तुम्हें’ बहुवचन समुदाय को संबोधित करता है और आधुनिक हिन्दी में सहज है।
