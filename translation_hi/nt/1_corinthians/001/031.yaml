    rationale: In contemporary standard Hindi, ‘घमण्ड’ strongly suggests sinful conceit. The verse instead directs boasting to its proper object; ‘बड़ाई’ retains the verbal repetition and allows that redirected sense.
  - severity: low
    issue: A comma follows ‘ताकि’.
    rationale: In Hindi, ‘ताकि जैसा लिखा है’ reads more smoothly without a comma between the connective and the comparative citation formula.
