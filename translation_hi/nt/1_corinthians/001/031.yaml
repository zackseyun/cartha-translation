  to: ताकि जैसा लिखा है, “जो बड़ाई करता है, वह प्रभु में बड़ाई करे।”[a]
  rationale: Revision replaces the negatively weighted ‘घमण्ड’ with ‘बड़ाई,’ which better conveys καυχάομαι in this scriptural exhortation and preserves the repeated wording. The initial punctuation is adjusted for natural Hindi. The alternative footnote is retained with terminology aligned to the revised text.
