  edition: SBLGNT
  text: ἵνα καθὼς γέγραπται· Ὁ καυχώμενος ἐν κυρίῳ καυχάσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/031.yaml
  text: 'so that[a], just as it is written: “The one who boasts must boast in the Lord.”'
translation:
  language: hi
  text: ताकि जैसा लिखा है, “जो बड़ाई करता है, वह प्रभु में बड़ाई करे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कोई बड़ाई करे, वह प्रभु में बड़ाई करे।”
    reason: Ὁ καυχώμενος को ‘जो बड़ाई करता है’ अथवा सामान्य शर्त-सदृश ‘जो कोई बड़ाई करे’ दोनों प्रकार से स्वाभाविक हिन्दी में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह पिछले कथन से निकलने वाले उद्देश्य या परिणाम को व्यक्त करता है; ‘ताकि’ हिन्दी में इस संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: καθὼς γέγραπται
  choice: जैसा लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण का प्रचलित, स्वाभाविक और गरिमापूर्ण हिन्दी सूत्र है; यूनानी पूर्णकाल के स्थायी प्रभाव को कृत्रिम शब्दावली के बिना व्यक्त करता है।
- source_word: Ὁ καυχώμενος
  choice: जो घमण्ड करता है
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त को सामान्य संबंधवाचक रचना से व्यक्त किया गया है। ‘घमण्ड करना’ यहाँ अपनी बड़ाई करने या गर्व का आधार मानने की धारणा को स्पष्ट रखता है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: ἐν को ‘में’ रखकर घमण्ड के उचित आधार या क्षेत्र की मूल अभिव्यक्ति को सुरक्षित रखा गया है; κύριος का मानक हिन्दी रूप ‘प्रभु’ है।
- source_word: καυχάσθω
  choice: घमण्ड करे
  rationale: तृतीय पुरुष आज्ञार्थक को हिन्दी के स्वाभाविक विधि/आज्ञार्थक ‘करे’ से व्यक्त किया गया है, जो आदेशात्मक बल को अनावश्यक कठोरता के बिना बनाए रखता है।
theological_decisions:
- issue: उद्धरण में आज्ञार्थक बल
  choice: वह प्रभु में घमण्ड करे
  alternative: उसे प्रभु में ही घमण्ड करना चाहिए
  rationale: ‘करे’ यूनानी तृतीय पुरुष आज्ञार्थक के सीधे बल को संक्षिप्त और स्वाभाविक हिन्दी में रखता है; ‘चाहिए’ अपेक्षा तो बताता है, पर आज्ञार्थक को कुछ नरम कर सकता है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस पौलुसी और शास्त्रीय उद्धरण-संदर्भ में ‘प्रभु’ धार्मिक प्रयोग में स्वाभाविक है और पद का धर्मवैचारिक केंद्र बनाए रखता है, बिना संदर्भगत पहचान को अतिरिक्त रूप से स्पष्ट किए।
- issue: καυχάομαι की नैतिक दिशा
  choice: घमण्ड करना
  alternative: गर्व करना / बड़ाई करना
  rationale: मूल क्रिया स्वयं प्रशंसा या आत्मप्रशंसा के सकारात्मक अथवा नकारात्मक मूल्य को संदर्भ से ग्रहण कर सकती है। समान हिन्दी क्रिया दोनों स्थानों पर रखकर पद द्वारा किए गए पुनर्निर्देशन—अपने में नहीं, प्रभु में—को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण शास्त्रीय शैली। ‘घमण्ड’ को दोनों बार समान रखा गया है ताकि मूल की शब्द-पुनरावृत्ति और प्रभु की ओर उसके पुनर्निर्देशन का प्रभाव बना रहे। विरामचिह्न आधुनिक हिन्दी के अनुसार हैं।
