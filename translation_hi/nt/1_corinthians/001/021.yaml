source:
  edition: SBLGNT
  text: ἐπειδὴ γὰρ ἐν τῇ σοφίᾳ τοῦ θεοῦ οὐκ ἔγνω ὁ κόσμος διὰ τῆς σοφίας τὸν θεόν, εὐδόκησεν ὁ θεὸς διὰ τῆς μωρίας τοῦ κηρύγματος σῶσαι τοὺς πιστεύοντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/021.yaml
  text: For since[a], in the wisdom of God, the world did not know God through wisdom[b], God was pleased through the foolishness of the proclamation to save those who believe.
translation:
  language: hi
  text: क्योंकि जब परमेश्वर की बुद्धि में संसार ने बुद्धि के द्वारा परमेश्वर को नहीं जाना, तब परमेश्वर ने उस घोषणा के द्वारा, जिसे मूर्खता समझा जाता है[a], विश्वास करने वालों को बचाना अच्छा समझा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रचार की मूर्खता के द्वारा।”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: क्योंकि जब … तब
  rationale: γάρ के व्याख्यात्मक संबंध और ἐπειδή के कारण/परिस्थिति-सूचक भाव को स्वाभाविक हिन्दी वाक्य-रचना में बनाए रखता है।
- source_word: ἐν τῇ σοφίᾳ τοῦ θεοῦ
  choice: परमेश्वर की बुद्धि में
  rationale: ἐν की क्षेत्र, व्यवस्था या साधन संबंधी संभावित अस्पष्टता को यथासंभव खुला रखता है।
- source_word: οὐκ ἔγνω
  choice: नहीं जाना
  rationale: γινώσκω के ज्ञानात्मक और संबंधपरक दोनों आयामों को संकीर्ण किए बिना व्यक्त करता है।
- source_word: ὁ κόσμος
  choice: संसार
  rationale: पौलुस के प्रयोग में मानव-जगत और उसकी सांसारिक व्यवस्था के प्रतिनिधि अर्थ को मानक हिन्दी में सुरक्षित रखता है।
- source_word: διὰ τῆς σοφίας
  choice: अपनी बुद्धि के द्वारा
  rationale: διά के साधन-सूचक अर्थ को स्पष्ट करता है; 'अपनी' से संसार की बुद्धि और पहले उल्लिखित परमेश्वर की बुद्धि के बीच हिन्दी में आवश्यक भेद स्पष्ट होता है।
- source_word: εὐδόκησεν ὁ θεὸς
  choice: परमेश्वर को यह अच्छा लगा
  rationale: εὐδοκέω के दिव्य सदिच्छा/प्रसन्न इच्छा के भाव को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τῆς μωρίας τοῦ κηρύγματος
  choice: जिस घोषणा को मूर्खता समझा जाता है, उसके द्वारा
  rationale: κήρυγμα को मुख्यतः घोषित संदेश के रूप में प्रस्तुत करता है और यह स्पष्ट करता है कि मूर्खता का मूल्यांकन संसार की दृष्टि से है, परमेश्वर की दृष्टि से नहीं; फुटनोट प्रचार करने की क्रिया की संभावना सुरक्षित रखता है।
- source_word: σῶσαι
  choice: बचाए
  rationale: σῴζω के उद्धार-संबंधी अर्थ का सरल और मानक हिन्दी रूप है।
- source_word: τοὺς πιστεύοντας
  choice: विश्वास करनेवालों
  rationale: वर्तमान कृदंत के संज्ञात्मक अर्थ को स्वाभाविक हिन्दी में रखता है और उससे अधिक कोई सिद्धान्तगत अर्थ नहीं जोड़ता।
theological_decisions:
- issue: διὰ τῆς μωρίας τοῦ κηρύγματος का आशय
  choice: मुख्य पाठ में उस घोषित संदेश को प्राथमिक माना गया है जिसे मूर्खता समझा जाता है।
  alternative: इसे प्रचार करने की मूर्खतापूर्ण समझी जानेवाली क्रिया या संदेश और क्रिया दोनों का संयुक्त संकेत माना जा सकता है।
  rationale: κήρυγμα सामान्यतः घोषित विषय-वस्तु को सूचित करता है, पर प्रसंग में सार्वजनिक प्रचार की क्रिया भी प्रतिध्वनित हो सकती है। मुख्य पाठ संदेश को सामने रखता है और फुटनोट दूसरी संभावना को सुरक्षित रखता है।
- issue: ἐν τῇ σοφίᾳ τοῦ θεοῦ में ἐν का संबंध
  choice: ‘परमेश्वर की बुद्धि में’ कहकर क्षेत्र/व्यवस्था का भाव रखा गया है।
  alternative: ‘परमेश्वर की बुद्धि के द्वारा’ कहकर इसे स्पष्ट साधन माना जा सकता है।
  rationale: यूनानी पदबंध दोनों प्रकार की व्याख्या की गुंजाइश देता है; मुख्य पाठ कारण-साधन को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘क्योंकि जब … तब’ लंबी यूनानी कारण-वाक्य रचना को स्पष्ट बनाता है। ‘घोषणा’ κήρυγμα की विषय-वस्तु को प्रमुख रखती है, जबकि फुटनोट प्रचार की क्रिया वाला अर्थ सुरक्षित करता है।
