  text: ἀλλὰ τὰ μωρὰ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα ⸂καταισχύνῃ τοὺς σοφούς⸃, καὶ τὰ ἀσθενῆ τοῦ κόσμου ἐξελέξατο ὁ θεός, ἵνα καταισχύνῃ τὰ ἰσχυρά,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/027.yaml
  text: But God chose the foolish things of the world so that he might shame the wise[c][b][a], and God chose the weak things of the world so that he might shame the strong.
translation:
  language: hi
  text: परन्तु परमेश्वर ने संसार की मूर्ख बातों[a] को चुन लिया, ताकि वह बुद्धिमानों को लज्जित करे[b]; और परमेश्वर ने संसार की निर्बल बातों[c] को चुन लिया, ताकि वह बलवानों को लज्जित करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संसार में जो मूर्ख है”; यूनानी में नपुंसकलिंग बहुवचन विशेषण का संज्ञा के रूप में प्रयोग हुआ है।
    reason: lexical_alternative
  - marker: b
    text: “लज्जित करे” का अनुवाद “लज्जा में डाले” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “संसार में जो निर्बल है”; यहाँ भी यूनानी में नपुंसकलिंग बहुवचन विशेषण का संज्ञा के रूप में प्रयोग हुआ है।
    reason: lexical_alternative
