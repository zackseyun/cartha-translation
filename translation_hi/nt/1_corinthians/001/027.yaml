  rationale: पुल्लिंग बहुवचन संज्ञात्मक विशेषण व्यक्तियों की ओर संकेत करता है; ‘बुद्धिमान’ इसका सहज हिन्दी प्रतिरूप है।
- source_word: τὰ ἀσθενῆ τοῦ κόσμου
  choice: संसार की निर्बल समझी जानेवाली बातें
  rationale: नपुंसकलिंग बहुवचन संज्ञात्मक विशेषण को अनावश्यक रूप से केवल व्यक्तियों तक सीमित नहीं किया गया; समानांतर संरचना भी बनी रहती है।
- source_word: τὰ ἰσχυρά
  choice: बलवानों
  rationale: संदर्भगत विरोध को सहज हिन्दी में व्यक्त करता है। यूनानी नपुंसकलिंग बहुवचन होने से ‘बलवान वस्तुएँ/बातें’ भी संभव है, पर यहाँ ‘लज्जित करना’ और समानांतरता व्यक्तिपरक हिन्दी को अधिक स्वाभाविक बनाते हैं।
