  choice: चुन लिया
  rationale: मध्यम वाच्य रूप यहाँ परमेश्वर के सोद्देश्य चयन को व्यक्त करता है; ‘चुन लिया’ सरल और स्वाभाविक हिन्दी है।
- source_word: ἵνα καταισχύνῃ
  choice: ताकि वह ... को लज्जित करे
  rationale: ἵνα का प्रयोजनार्थक बल और καταισχύνῃ का लज्जित अथवा लज्जा में डालने का अर्थ सुरक्षित रहता है।
- source_word: τοὺς σοφούς
