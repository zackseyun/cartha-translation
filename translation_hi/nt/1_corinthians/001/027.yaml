  choice: ‘संसार की ... समझी जानेवाली’
  alternative: ‘संसार की मूर्ख/निर्बल बातें’
  rationale: यह अनुवाद पौलुस के विरोधाभास को बनाए रखते हुए परमेश्वर को वास्तविक मूर्खता चुनने वाला बताने की संभावित गलत समझ से बचाता है; τοῦ κόσμου को संसार के क्षेत्र अथवा उसके मूल्यांकन से जोड़ना संदर्भानुकूल है।
- issue: नपुंसकलिंग बहुवचन विशेषणों का संदर्भ
  choice: मुख्य पाठ में ‘बातों’ द्वारा व्यापक और अनिर्दिष्ट रखा गया
  alternative: ‘लोगों’ द्वारा केवल व्यक्तियों तक सीमित करना
