id: 1CO.1.12
reference: 1 Corinthians 1:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγω δὲ τοῦτο ὅτι ἕκαστος ὑμῶν λέγει· Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/012.yaml
  text: 'What I mean is this: each of you says[a], “I belong to Paul,” or “I belong to Apollos,” or “I belong to Cephas,” or “I belong to Messiah.”'
translation:
  language: hi
  text: मेरे कहने का अर्थ यह है कि तुममें से हर एक कहता है, “मैं पौलुस का हूँ,” “मैं अपुल्लोस का हूँ,” “मैं कैफा का हूँ,” या “मैं मसीह[a] का हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं ख्रीस्त का हूँ।”
    reason: Χριστός की पारंपरिक लिप्यंतरित अभिव्यक्ति।
lexical_decisions:
- source_word: λέγω δὲ τοῦτο ὅτι
  choice: मेरे कहने का अर्थ यह है कि
  rationale: यह यूनानी परिचय की व्याख्यात्मक शक्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἕκαστος ὑμῶν λέγει
  choice: तुममें से हर एक कहता है
  rationale: ἕκαστος के प्रत्येक व्यक्ति पर लागू होने वाले अर्थ और λέγει के वर्तमानकाल—दोनों को सीधे बनाए रखता है।
- source_word: εἰμι + संबंधकारक
  choice: मैं ... का हूँ
  rationale: यह हिन्दी में दलगत संबंध या निष्ठा को स्वाभाविक ढंग से प्रकट करता है, बिना इसे औपचारिक शिष्यत्व मान लेने के।
- source_word: Παύλου / Ἀπολλῶ / Κηφᾶ
  choice: पौलुस / अपुल्लोस / कैफा
  rationale: व्यक्तिगत नामों के प्रचलित हिन्दी लिप्यंतरण रखे गए हैं; Κηφᾶ को पतरस में नहीं बदला गया।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός यहाँ उपाधि है; ‘मसीह’ आधुनिक हिन्दी में उसका स्वाभाविक और व्यापक रूप से समझा जाने वाला अनुवाद है।
theological_decisions:
- issue: दलगत कथन में Χριστοῦ का रूप
  choice: मसीह
  alternative: ख्रीस्त
  rationale: मूल शब्द को उपाधि के रूप में व्यक्त किया गया है; परंपरागत लिप्यंतर को पादटिप्पणी में रखा गया है।
- issue: εἰμι + संबंधकारक में निहित संबंध
  choice: मैं ... का हूँ
  alternative: मैं ... का अनुयायी हूँ
  rationale: मूल में संबंध या पक्षधरता निहित है, पर ‘अनुयायी’ कहने से अर्थ आवश्यकता से अधिक निश्चित हो जाता; इसलिए मूल की व्यापकता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में सहज है। पौलुस की शिकायत में उद्धृत दलगत नारों की संक्षिप्तता बनाए रखने के लिए प्रत्येक कथन में ‘मैं ... का हूँ’ रखा गया है।
