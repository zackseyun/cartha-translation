source:
  edition: SBLGNT
  text: καὶ τὰ ἀγενῆ τοῦ κόσμου καὶ τὰ ἐξουθενημένα ἐξελέξατο ὁ θεός, ⸀τὰ μὴ ὄντα, ἵνα τὰ ὄντα καταργήσῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/028.yaml
  text: And God chose the lowborn things of the world and the despised things[a], the things that are not, to nullify the things that are[b],
translation:
  language: hi
  text: और परमेश्वर ने संसार की निम्न कुल की और तुच्छ समझी जानेवाली चीज़ों को, जो नहीं हैं[a], चुन लिया, ताकि जो हैं उन्हें निष्प्रभावी कर दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्हें कुछ नहीं समझा जाता।”
    reason: lexical_alternative
  - marker: b
    text: या, “मिटा दे” या “व्यर्थ कर दे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγενῆ
  choice: नीच कुल की
  rationale: यह शब्द कुलीन जन्म या ऊँची सामाजिक हैसियत के अभाव को व्यक्त करता है। ‘नीच कुल की’ सामाजिक-स्थिति के इस भाव को संक्षेप में बनाए रखता है।
- source_word: ἐξουθενημένα
  choice: तुच्छ समझी जानेवाली
  rationale: पूर्ण कृदन्त उन वस्तुओं या लोगों की स्थिति दिखाता है जिन्हें तिरस्कारपूर्वक मूल्यहीन माना गया है; यह हिंदी प्रयोग उस सामाजिक अवमानना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰ μὴ ὄντα
  choice: जो नहीं हैं
  rationale: यह पौलुस की असाधारण और व्यापक अभिव्यक्ति को निकटता से सुरक्षित रखता है तथा अस्तित्वहीनता और सामाजिक नगण्यता के बीच निहित तनाव को समाप्त नहीं करता।
- source_word: τὰ ὄντα
  choice: जो हैं
  rationale: यह ‘जो नहीं हैं’ के साथ यूनानी पाठ का संतुलित और तीखा विरोध बनाए रखता है।
- source_word: καταργήσῃ
  choice: निष्प्रभावी कर दे
  rationale: क्रिया का अर्थ किसी को प्रभावहीन, निष्क्रिय या व्यर्थ कर देना है; यह अनिवार्यतः विनाश का अर्थ लगाए बिना भाव स्पष्ट करती है।
- source_word: ἐξελέξατο
  choice: चुन लिया
  rationale: यह परमेश्वर के सोद्देश्य चयन को सहज और मानक हिंदी में व्यक्त करता है तथा निकटवर्ती पदों की पुनरावृत्ति के अनुकूल है।
theological_decisions:
- issue: τὰ μὴ ὄντα / τὰ ὄντα को सामाजिक श्रेणियों के रूप में स्पष्ट करना या उसके शाब्दिक विरोध को बनाए रखना
  choice: मुख्य पाठ में ‘जो नहीं हैं’ / ‘जो हैं’ का विरोध सुरक्षित रखा गया।
  alternative: ‘जिन्हें कुछ नहीं समझा जाता’ / ‘जो अपने को कुछ समझते हैं’ जैसे सामाजिक अर्थ को सीधे मुख्य पाठ में देना।
  rationale: संदर्भ सामाजिक प्रतिष्ठा से संबंधित है, फिर भी पौलुस की भाषा जानबूझकर अधिक व्यापक और चौंकानेवाली है। निकट अनुवाद अलंकारिक तीक्ष्णता और धर्मवैचारिक तनाव दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य रूप। ‘वस्तुओं’ के साथ स्त्रीलिंग विशेषण रखे गए हैं, जबकि ‘जो नहीं हैं / जो हैं’ यूनानी के व्यापक और जानबूझकर अस्पष्ट विरोध को सुरक्षित रखते हैं।
