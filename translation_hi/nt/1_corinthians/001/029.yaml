- source_word: ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर के सामने
  rationale: यह परमेश्वर की उपस्थिति में अथवा उसके सम्मुख होने का स्वाभाविक और संक्षिप्त हिन्दी रूप है।
