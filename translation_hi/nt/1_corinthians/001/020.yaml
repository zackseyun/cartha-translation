  text: ποῦ σοφός; ποῦ γραμματεύς; ποῦ συζητητὴς τοῦ αἰῶνος τούτου; οὐχὶ ἐμώρανεν ὁ θεὸς τὴν σοφίαν τοῦ ⸀κόσμου;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/020.yaml
  text: Where is the wise man? Where is the scribe? Where is the debater of this age? Has not God made the wisdom of the world foolish?[a][b][c]
translation:
  language: hi
  text: कहाँ है ज्ञानी? कहाँ है शास्त्री? कहाँ है इस युग का वाद-विवाद करने वाला?[a] क्या परमेश्वर ने संसार की बुद्धि को मूर्ख नहीं बना दिया?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘इस युग’ और आगे आया ‘संसार’ मूल यूनानी में दो अलग शब्दों के अनुवाद हैं।
    reason: cross_reference
  - marker: b
    text: या, “क्या परमेश्वर ने संसार की बुद्धि को मूर्ख सिद्ध नहीं किया?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ
  choice: कहाँ है
  rationale: नामवाचक पदों के साथ यह स्थान पूछने वाला साधारण प्रश्न नहीं, बल्कि आलंकारिक चुनौती है; हिन्दी में ‘कहाँ है...?’ यही प्रभाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: σοφός
  choice: ज्ञानी
  rationale: पुल्लिंग एकवचन रूप को बनाए रखते हुए यह शब्द यहाँ ज्ञानी माने जाने वाले व्यक्ति या वर्ग का प्रतिनिधि है।
- source_word: γραμματεύς
  choice: शास्त्री
  rationale: यह सीधा, ऐतिहासिक रूप से परिचित और प्रसंगानुकूल हिन्दी पर्याय है; ‘विद्वान’ कहने से मूल शब्द की ठोस पहचान धुंधली हो सकती है।
- source_word: συζητητής
  choice: वाद-विवाद करनेवाला
  rationale: यह दुर्लभ यूनानी शब्द तर्क-वितर्क या बहस करने वाले व्यक्ति को बताता है; यह पद सामान्य आधुनिक पाठक के लिए स्पष्ट है।
- source_word: τοῦ αἰῶνος τούτου
  choice: इस युग का
  rationale: αἰών को ‘युग’ कहा गया है ताकि आगे आने वाले κόσμος, ‘संसार’, से मूल की शब्दगत भिन्नता बनी रहे।
- source_word: οὐχὶ
  choice: क्या ... नहीं
  rationale: यह ऐसे आलंकारिक प्रश्न को व्यक्त करता है जिसका अपेक्षित उत्तर ‘हाँ’ है।
- source_word: ἐμώρανεν
  choice: मूर्खता ठहराया
  rationale: क्रिया के कारणात्मक/घोषणात्मक तनाव को सहज हिन्दी में रखता है और इस संभावना को पूरी तरह बंद नहीं करता कि परमेश्वर ने सांसारिक बुद्धि को मूर्ख सिद्ध या प्रकट किया।
- source_word: σοφίαν
  choice: बुद्धि
  rationale: यह σοφία का मानक और प्रसंगानुकूल हिन्दी रूप है।
- source_word: κόσμου
  choice: संसार
  rationale: κόσμος के लिए स्वाभाविक बाइबलीय हिन्दी है और ‘युग’ से स्पष्ट भेद बनाए रखता है।
theological_decisions:
- issue: αἰών और κόσμος के बीच भेद
  choice: αἰών का अनुवाद ‘युग’ और κόσμος का ‘संसार’ किया गया
  alternative: दोनों का अनुवाद ‘संसार’ करना
  rationale: मूल पद में अलग यूनानी शब्द हैं; उनका भेद बनाए रखने से वर्तमान युग और संसार की बुद्धि के बीच पौलुस की अभिव्यक्ति सपाट नहीं होती।
- issue: ἐμώρανεν की अर्थ-छाया
  choice: ‘मूर्खता ठहराया’
  alternative: ‘मूर्ख बना दिया’ या ‘मूर्ख सिद्ध किया’
  rationale: यह अनुवाद परमेश्वर की निर्णायक क्रिया को बनाए रखता है, पर इस बात को अनावश्यक रूप से तय नहीं करता कि बुद्धि को वास्तव में मूर्ख बनाया गया या उसकी मूर्खता प्रकट की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ में सहज रखी गई है। तीन बार ‘कहाँ है’ की पुनरावृत्ति मूल की तीखी आलंकारिक लय को सुरक्षित रखती है। ‘शास्त्री’ ऐतिहासिक पद को बनाए रखता है, जबकि ‘वाद-विवाद करनेवाला’ दुर्लभ संज्ञा को सामान्य पाठक के लिए स्पष्ट करता है।
