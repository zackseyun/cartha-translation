lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μή τις
  choice: कोई ... न
  rationale: निषेधात्मक अनिश्चित कर्ता के लिए यह स्वाभाविक हिन्दी रचना है और यूनानी अर्थ को स्पष्ट रखती है।
- source_word: εἴπῃ
  choice: कहे
  rationale: ἵνα के साथ प्रयुक्त संभावनार्थक रूप को हिन्दी के ‘ताकि ... न कहे’ में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: εἰς
  choice: में
  rationale: हिन्दी में बपतिस्मा और ‘नाम’ के साथ ‘में’ स्वाभाविक है; यह εἰς के संबंध/प्रवेश के भाव को संदर्भ में व्यक्त करता है। अधिक स्पष्ट ‘के नाम में’ विकल्प पादटिप्पणी में रखा गया है।
- source_word: τὸ ἐμὸν ὄνομα
  choice: मेरे नाम
  rationale: यह स्वाभाविक और सीधा संबंधसूचक अनुवाद है।
- source_word: ἐβαπτίσθητε
  choice: तुमने ... बपतिस्मा लिया
  rationale: यूनानी रूप कर्मवाच्य है, किंतु हिन्दी में ‘बपतिस्मा लिया’ इसका प्रचलित और स्वाभाविक समतुल्य है; यह किसी विशिष्ट रीति को आरोपित नहीं करता।
theological_decisions:
- issue: बपतिस्मा-संबंधी वाक्यांश εἰς τὸ ἐμὸν ὄνομα का अनुवाद
  choice: मेरे नाम में
  alternative: मेरे नाम के लिए; मेरे नाम में होकर
  rationale: εἰς का मूल दिशात्मक/संबंधात्मक बल है, पर हिन्दी में शाब्दिक ‘मेरे नाम के भीतर’ अस्वाभाविक और भ्रामक होगा। ‘मेरे नाम में’ पहचान और संबंध की धर्मवैज्ञानिक गुंजाइश को बिना किसी संप्रदायगत व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। ‘बपतिस्मा’ व्यापक रूप से पहचाना जाने वाला पारिभाषिक शब्द है; वाक्य को अनावश्यक रूप से शाब्दिक या संप्रदाय-विशिष्ट नहीं बनाया गया है।
