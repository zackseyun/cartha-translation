  verdict: revise
  source_fidelity: The purpose clause and negated prospective statement are conveyed accurately. The draft's active Hindi idiom “तुमने ... बपतिस्मा लिया” weakens the explicit passive of ἐβαπτίσθητε. “तुम्हें ... बपतिस्मा दिया गया” preserves the Greek passive without implying a particular baptismal mode. “मेरे नाम में” is a natural Hindi rendering of εἰς τὸ ἐμὸν ὄνομα and leaves its relational force open.
  naturalness: The revised wording is idiomatic, clear modern standard Hindi and retains the concise, formal register of the verse.
  terminology: “बपतिस्मा” is appropriate established Christian terminology. The footnote’s former alternative, “मेरे नाम के लिए,” does not adequately represent the stated alternative “in my name” and can imply purpose or benefit rather than baptismal identification.
  issues:
  - severity: medium
    issue: The main clause renders a Greek passive with an active construction.
    rationale: ἐβαπτίσθητε explicitly means “you were baptized.” Although “बपतिस्मा लिया” is common Hindi usage, it changes the voice and is unnecessary here.
  - severity: medium
    issue: The footnote alternative “मेरे नाम के लिए” is semantically unsuitable.
    rationale: It means “for my name,” whereas the audit trail’s alternative is “in my name.” “मेरे नाम पर” is the closest concise Hindi alternative, though it is appropriately retained only as an alternative.
