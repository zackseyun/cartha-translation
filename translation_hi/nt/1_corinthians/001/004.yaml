  text: Εὐχαριστῶ τῷ θεῷ ⸀μου πάντοτε περὶ ὑμῶν ἐπὶ τῇ χάριτι τοῦ θεοῦ τῇ δοθείσῃ ὑμῖν ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/004.yaml
  text: I thank my God always for you because of the grace of God given to you in Messiah Jesus[b][a],
translation:
  language: hi
  text: मैं तुम्हारे लिए अपने परमेश्वर का सदा धन्यवाद करता हूँ, क्योंकि परमेश्वर का अनुग्रह तुम्हें मसीह यीशु में दिया गया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐχαριστῶ τῷ θεῷ μου
  choice: मैं अपने परमेश्वर का धन्यवाद करता हूँ
  rationale: हिन्दी में ‘परमेश्वर का धन्यवाद करना’ स्वाभाविक प्रयोग है। वर्तमानकाल पौलुस के निरन्तर धन्यवाद को व्यक्त करता है, और μου को ‘अपने’ के द्वारा स्पष्ट रखा गया है।
- source_word: πάντοτε
  choice: सदा
  rationale: यह πάντοτε का सीधा, संक्षिप्त और गरिमापूर्ण हिन्दी पर्याय है।
- source_word: περὶ ὑμῶν
  choice: तुम्हारे लिए
  rationale: धन्यवाद की इस अभिव्यक्ति में περί का अर्थ उनके संबंध में अथवा उनके निमित्त धन्यवाद करना है; ‘तुम्हारे लिए’ आधुनिक हिन्दी में सबसे स्वाभाविक है।
- source_word: ἐπὶ τῇ χάριτι
  choice: क्योंकि … अनुग्रह
  rationale: ἐπί यहाँ धन्यवाद के आधार या कारण को बताता है; ‘क्योंकि’ इस संबंध को सहज हिन्दी में स्पष्ट करता है।
- source_word: χάριτι τοῦ θεοῦ
  choice: परमेश्वर का अनुग्रह
  rationale: ‘अनुग्रह’ χάρις के लिए प्रचलित और प्रसंगानुकूल शब्द है। संबंधकारक को ‘परमेश्वर का’ रखकर स्वामित्व और स्रोत—दोनों अर्थों को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: τῇ δοθείσῃ ὑμῖν
  choice: तुम्हें … दिया गया है
  rationale: यह यूनानी के कर्मवाच्य भाव को बनाए रखता है और परमेश्वर को निहित दाता के रूप में रहने देता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ‘मसीह’ Χριστός के अभिषिक्त उद्धारकर्ता वाले पदनाम को व्यक्त करता है, जबकि ‘में’ पौलुस की ἐν Χριστῷ अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ में संबंध का स्वरूप
  choice: मसीह यीशु में
  alternative: मसीह यीशु के द्वारा
  rationale: यूनानी ἐν को ‘में’ अनूदित करने से मसीह के साथ एकता, क्षेत्र अथवा माध्यम के बीच निहित अर्थगत तनाव बना रहता है; ‘के द्वारा’ इसे केवल साधन के अर्थ तक सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए बहुवचन ‘तुम’ रखा गया है। वाक्य को सहज बनाने के लिए कारणसूचक उपवाक्य प्रयोग किया गया है, जबकि मूल का अर्थ और पौलुस की धार्मिक शब्दावली सुरक्षित रखी गई है।
