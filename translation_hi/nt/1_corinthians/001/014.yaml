  yaml_path: translation/nt/1_corinthians/001/014.yaml
  text: I am thankful that I baptized none of you except Crispus and Gaius,
translation:
  language: hi
  text: मैं धन्यवाद देता हूँ कि मैंने तुममें से क्रिस्पुस और गयुस को छोड़ किसी को बपतिस्मा नहीं दिया,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαριστῶ
  choice: मैं धन्यवाद देता हूँ
  rationale: वर्तमानकालीन कृतज्ञता को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; यूनानी पाठ में धन्यवाद पाने वाला स्पष्ट नहीं किया गया है, इसलिए अनावश्यक रूप से ‘परमेश्वर को’ नहीं जोड़ा गया।
- source_word: ὅτι
  choice: कि
  rationale: यहाँ पौलुस के धन्यवाद की विषय-वस्तु प्रस्तुत होती है; ‘कि’ हिन्दी में इसे सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὐδένα ὑμῶν
  choice: तुममें से ... किसी को नहीं
  rationale: निषेध और संबोधित समुदाय के भीतर से किसी व्यक्ति के न होने—दोनों अर्थों को स्पष्ट रूप से बनाए रखता है।
- source_word: ἐβάπτισα
  choice: मैंने ... बपतिस्मा नहीं दिया
  rationale: ‘बपतिस्मा देना’ नए नियम के सन्दर्भ में प्रचलित और तटस्थ हिन्दी समतुल्य है तथा विधि के बारे में कोई सांप्रदायिक निष्कर्ष नहीं जोड़ता।
- source_word: εἰ μὴ
  choice: को छोड़
  rationale: अपवादसूचक यूनानी रचना को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Κρίσπον
  choice: क्रिस्पुस
  rationale: यूनानी नाम Κρίσπος का निकट देवनागरी लिप्यंतरण।
- source_word: Γάϊον
  choice: गयुस
  rationale: यूनानी नाम Γάϊος का प्रचलित और स्रोत-सन्निकट देवनागरी लिप्यंतरण।
