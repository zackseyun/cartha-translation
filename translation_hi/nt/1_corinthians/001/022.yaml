- source_word: αἰτοῦσιν
  choice: माँगते हैं
  rationale: यह वर्तमानकालीन क्रिया का सहज हिन्दी रूप है; यह ‘दावा करके माँगने’ जैसी अतिरिक्त कठोरता नहीं जोड़ता।
- source_word: Ἕλληνες
  choice: यूनानी
  rationale: ‘यूनानी’ पौलुस के विशिष्ट सांस्कृतिक शब्द और बुद्धि से उसके संबंध को सुरक्षित रखता है; व्यापक ‘गैर-यहूदी’ अर्थ को मुख्य पाठ में नहीं थोपा गया।
- source_word: σοφίαν
  choice: बुद्धि
  rationale: यह यूनानी शब्द की व्यापक अर्थ-सीमा को बनाए रखता है और उसे केवल दर्शनशास्त्र तक सीमित नहीं करता।
- source_word: ζητοῦσιν
  choice: खोज करते हैं
  rationale: यह जारी रहने वाली प्रवृत्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
