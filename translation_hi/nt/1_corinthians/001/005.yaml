  text: ὅτι ἐν παντὶ ἐπλουτίσθητε ἐν αὐτῷ, ἐν παντὶ λόγῳ καὶ πάσῃ γνώσει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/005.yaml
  text: because in him you were enriched in every way, in all speech and all knowledge,
translation:
  language: hi
  text: क्योंकि उसमें तुम हर प्रकार से, हर प्रकार की वाणी और सारे ज्ञान में, समृद्ध किए गए,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह उपवाक्य पिछले पद में पौलुस के धन्यवाद का कारण बताता है; इसलिए कारणवाचक अर्थ स्वाभाविक है।
- source_word: ἐν παντὶ
  choice: हर प्रकार से
  rationale: नपुंसकलिंग एकवचन की यह व्यापक अभिव्यक्ति समग्र समृद्धि दर्शाती है; आगे वाणी और ज्ञान उसके विशिष्ट क्षेत्र बताते हैं।
- source_word: ἐπλουτίσθητε
  choice: समृद्ध किए गए
  rationale: यह रूप अओरिस्ट कर्मवाच्य है। अनुवाद प्राप्त हुई समृद्धि और मूल रूपक, दोनों को बनाए रखता है।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: यहाँ ἐν संभवतः मसीह के साथ संबंध या उसमें स्थित होने का क्षेत्र दर्शाता है; 'उसमें' इस पौलुसी अभिव्यक्ति को सुरक्षित रखता है।
- source_word: ἐν παντὶ λόγῳ
  choice: हर तरह की वाणी में
  rationale: γνώσει के साथ युग्म में λόγῳ संभवतः मौखिक अभिव्यक्ति या बोलने की क्षमता को दर्शाता है। 'वाणी' संक्षिप्त, गरिमापूर्ण और पर्याप्त व्यापक है।
- source_word: πάσῃ γνώσει
  choice: हर प्रकार के ज्ञान में
  rationale: γνῶσις का व्यापक अर्थ 'ज्ञान' है। यह चुनाव यूनानी समानांतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἐν αὐτῷ में मसीह-संबंध की प्रकृति
  choice: उसमें
  alternative: उसके द्वारा
  rationale: करणवाचक अर्थ संभव हो सकता है, पर ἐν का अधिक सीधा अर्थ क्षेत्र या संबंध है। 'उसमें' अस्पष्टता और पौलुस की मसीह-केंद्रित भाषा को समय से पहले व्याख्यायित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप। वाक्य पिछले पद पर आश्रित है, इसलिए अंत में अल्पविराम रखा गया है। डैश व्यापक 'हर प्रकार से' और उसके बाद आने वाले दो विशिष्ट क्षेत्रों के संबंध को स्पष्ट करता है।
