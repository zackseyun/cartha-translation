review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the causal ὅτι, the passive aorist ἐπλουτίσθητε ('समृद्ध किए गए'), and the relational/sphere sense of ἐν αὐτῷ ('उसमें'). It also retains the broad-to-specific movement from ἐν παντί to speech and knowledge. No textual or theological issue requires a footnote.
  naturalness: The repeated but nonparallel expressions 'हर प्रकार से—हर तरह की वाणी और हर प्रकार के ज्ञान में' are understandable, but the dash construction is stylistically heavy and makes the relation of the broad phrase to the following prepositional phrases less smooth in modern Hindi. A direct parallel construction is clearer.
  terminology: ‘वाणी’ and ‘ज्ञान’ are appropriate, dignified, and sufficiently broad for λόγος and γνῶσις in this context. ‘उसमें’ rightly avoids replacing Paul's Christ-union language with an exclusively instrumental reading.
  issues:
