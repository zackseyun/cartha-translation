source:
  edition: SBLGNT
  text: μεμέρισται ὁ Χριστός; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/013.yaml
  text: Has Messiah been divided? Was Paul crucified for you? Or were you baptized into the name of Paul?[a][b]
translation:
  language: hi
  text: क्या मसीह बँट गया है? क्या पौलुस तुम्हारे लिए क्रूस पर चढ़ाया गया था? या क्या तुम्हें पौलुस के नाम में बपतिस्मा दिया गया था?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμέρισται
  choice: बाँट दिया गया है
  rationale: पूर्णकालिक कर्मवाच्य का भाव बनाए रखते हुए यह बताता है कि बाँटने की क्रिया के परिणामस्वरूप विभाजन की स्थिति उत्पन्न हुई है।
- source_word: ὁ Χριστός
  choice: मसीह
  rationale: सकार्थक उपपद के साथ यहाँ Χριστός उपाधि के रूप में प्रमुख है; हिन्दी में “मसीह” इसका स्वाभाविक और प्रचलित रूप है।
- source_word: μὴ
  choice: प्रश्न की नकारात्मक अपेक्षा में निहित
  rationale: μή ऐसे आलंकारिक प्रश्न को चिह्नित करता है जिसका अपेक्षित उत्तर ‘नहीं’ है; हिन्दी में प्रश्नरूप स्वयं यह बल पर्याप्त रूप से व्यक्त करता है।
- source_word: ἐσταυρώθη
  choice: क्रूस पर चढ़ाया गया था
  rationale: यह यूनानी अओरिस्ट कर्मवाच्य का स्पष्ट और मानक हिन्दी रूप है।
- source_word: ὑπὲρ ὑμῶν
  choice: तुम्हारे लिए
  rationale: यह सहज हिन्दी है और यहाँ निहित प्रतिनिधिक अथवा हितार्थ भाव को अनावश्यक रूप से सीमित नहीं करती।
- source_word: εἰς τὸ ὄνομα
  choice: नाम में
  rationale: बपतिस्मा के प्रसंग में यह स्वाभाविक हिन्दी अभिव्यक्ति है; εἰς के संबंध अथवा समर्पण की ओर संकेत करने वाले भाव को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐβαπτίσθητε
  choice: तुम्हें … बपतिस्मा दिया गया था
  rationale: यह यूनानी कर्मवाच्य और आलंकारिक प्रश्न—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ὁ Χριστός को उपाधि या नाम-सदृश पद के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस प्रश्न में उपपद उपाधि के भाव को उभारता है। “मसीह” आधुनिक हिन्दी में अर्थपूर्ण और व्यापक रूप से समझा जाने वाला रूप है, जबकि “ख्रीस्त” अधिक नाम-सदृश अथवा परंपरागत लिप्यंतरण है।
- issue: εἰς τὸ ὄνομα का बपतिस्मा-संबंधी भाव
  choice: नाम में
  alternative: नाम से जुड़ने के लिए
  rationale: मुख्य पाठ में यूनानी संरचना के निकट, प्रचलित हिन्दी अभिव्यक्ति रखी गई है; अधिक व्याख्यात्मक विकल्प संबंध, समर्पण या अधिकार के भाव को स्पष्ट करता है, पर उसे मुख्य पाठ में रखने से अर्थ आवश्यकता से अधिक निश्चित हो सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली है। तीनों आलंकारिक प्रश्नों की तीव्रता तथा अपेक्षित नकारात्मक उत्तर को बिना ‘निश्चय ही नहीं’ जैसे व्याख्यात्मक शब्द जोड़े सुरक्षित रखा गया है।
