source:
  edition: SBLGNT
  text: τῇ ἐκκλησίᾳ τοῦ θεοῦ, ⸂ἡγιασμένοις ἐν Χριστῷ Ἰησοῦ, τῇ οὔσῃ ἐν Κορίνθῳ,⸃ κλητοῖς ἁγίοις, σὺν πᾶσιν τοῖς ἐπικαλουμένοις τὸ ὄνομα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐν παντὶ τόπῳ ⸀αὐτῶν καὶ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/002.yaml
  text: 'To the church of God that is in Corinth[a], to those sanctified in Messiah Jesus, called to be saints, together with all those who call on the name of our Lord Jesus the Messiah in every place[d][c][b], theirs and ours:'
translation:
  language: hi
  text: 'कुरिन्थ में स्थित परमेश्वर की कलीसिया को—अर्थात् उन लोगों को जो मसीह यीशु में पवित्र किए गए हैं और बुलाए हुए पवित्र जन हैं—तथा उन सब के साथ जो हर स्थान पर हमारे प्रभु यीशु मसीह का नाम पुकारते हैं, उनके यहाँ भी और हमारे यहाँ भी:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: कलीसिया
  rationale: ‘कलीसिया’ हिन्दी बाइबलीय प्रयोग में परिचित सामुदायिक पद है और यहाँ परमेश्वर के बुलाए हुए विश्वास-समुदाय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἡγιασμένοις
  choice: पवित्र किए गए हैं
  rationale: यह पूर्णकालिक कर्मवाच्य कृदंत परमेश्वर द्वारा किए गए ऐसे कार्य का संकेत देता है जिसका परिणाम वर्तमान में बना हुआ है; इसलिए कर्मवाच्य रूप सुरक्षित रखा गया है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: पौलुस के संघात्मक वाक्यांश ‘में’ को बनाए रखा गया है और Χριστός के पदवीगत अर्थ के लिए ‘मसीह’ चुना गया है।
- source_word: κλητοῖς ἁγίοις
  choice: पवित्र जन होने के लिए बुलाए गए हैं
  rationale: यद्यपि यूनानी में दोनों विशेषण हैं, यह हिन्दी में बुलाहट और पवित्र पहचान के संबंध को स्पष्ट, स्वाभाविक और बिना संप्रदायगत अर्थ जोड़े व्यक्त करता है।
- source_word: ἐπικαλουμένοις τὸ ὄνομα
  choice: नाम पुकारते हैं
  rationale: यह हिन्दी में आराधनात्मक और प्रार्थनापरक भाव को बनाए रखने वाला परिचित बाइबलीय मुहावरा है।
- source_word: κυρίου
  choice: प्रभु
  rationale: ‘प्रभु’ κύριος का स्थापित और संदर्भानुकूल हिन्दी समतुल्य है।
- source_word: ἐν παντὶ τόπῳ αὐτῶν καὶ ἡμῶν
  choice: हर स्थान पर ... जो उनका भी प्रभु है और हमारा भी
  rationale: αὐτῶν καὶ ἡμῶν का संबंध व्याकरणतः संक्षिप्त और विवादित है। मुख्य पाठ में इसे ‘प्रभु’ से जोड़कर सहज हिन्दी दी गई है, जबकि स्थान से जोड़ने की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: दोनों स्थानों पर ‘मसीह’
  alternative: ‘ख्रीस्त’ अथवा ‘क्राइस्ट’
  rationale: दोनों प्रयोगों में पदवीगत, मसीहाई अर्थ अभी भी सजीव है; ‘मसीह’ आधुनिक मानक हिन्दी में स्थापित और अर्थपूर्ण रूप है।
- issue: κλητοῖς ἁγίοις में बुलाहट और पवित्रता का संबंध
  choice: ‘पवित्र जन होने के लिए बुलाए गए’
  alternative: ‘बुलाए हुए पवित्र जन’
  rationale: चुना गया रूप हिन्दी में अभिप्रेत संबंध को स्वाभाविक बनाता है, पर यूनानी की संक्षिप्त विशेषणात्मक रचना का अधिक शाब्दिक विकल्प भी संभव है।
- issue: αὐτῶν καὶ ἡμῶν का संबंध
  choice: '‘प्रभु’ से जोड़ना: ‘जो उनका भी प्रभु है और हमारा भी’'
  alternative: '‘स्थान’ से जोड़ना: ‘हर स्थान पर—उनके यहाँ भी और हमारे यहाँ भी’'
  rationale: यूनानी रचना दोनों संबंधों की अनुमति देती है। मुख्य पाठ पठनीय व्याख्या चुनता है, और वास्तविक वाक्यगत अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘कलीसिया’, ‘मसीह’ और ‘प्रभु’ जैसे परिचित बाइबलीय पद रखे गए हैं; अत्यधिक संस्कृतनिष्ठ वाक्यरचना से बचते हुए मूल की कर्मवाच्यता और अंतिम वाक्यांश की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
