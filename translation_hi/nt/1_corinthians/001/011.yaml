source:
  edition: SBLGNT
  text: ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/001/011.yaml
  text: For it has been reported to me about you[a], my brothers, by Chloe’s people, that there are quarrels among you.
translation:
  language: hi
  text: क्योंकि मेरे भाइयो[a], क्लोए के लोगों से मुझे तुम्हारे विषय में यह पता चला है कि तुम्हारे बीच झगड़े हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे भाइयो और बहनो।” यूनानी में “भाइयो” है, जो यहाँ पूरी विश्वासी मंडली को समावेशी रूप से संबोधित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδηλώθη
  choice: मुझे ... यह पता चला है
  rationale: यूनानी कर्मवाच्य का स्वाभाविक हिन्दी रूप; यह व्यक्त करता है कि सूचना पौलुस को दी गई, बिना अनावश्यक रूप से यह जोड़े कि औपचारिक शिकायत की गई थी।
- source_word: γάρ
  choice: क्योंकि
  rationale: पिछले आग्रह के साथ पौलुस के व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: περὶ ὑμῶν
  choice: तुम्हारे विषय में
  rationale: पूर्वसर्गीय वाक्यांश का सटीक, गरिमापूर्ण और सामान्य आधुनिक हिन्दी रूप।
- source_word: ἀδελφοί μου
  choice: मेरे भाइयो
  rationale: यूनानी संबोधन के पुल्लिंग बहुवचन को मुख्य पाठ में सुरक्षित रखता है; पूरी विश्वासी मंडली को समावेशी रूप से संबोधित किए जाने की संभावना पादटिप्पणी में बताई गई है।
- source_word: ὑπὸ τῶν Χλόης
  choice: क्लोए के लोगों से
  rationale: क्लोए से संबद्ध व्यक्तियों को दर्शाता है और ‘घराने’ कहकर उनके संबंध को आवश्यकता से अधिक निश्चित नहीं करता। हिन्दी में सूचना के स्रोत के लिए ‘से’ स्वाभाविक है।
- source_word: ἔριδες
  choice: झगड़े
  rationale: बहुवचन में आपसी कलह या विवाद का सहज आधुनिक हिन्दी अर्थ देता है और व्यापक ‘फूट’ से अलग रहता है।
- source_word: ἐν ὑμῖν εἰσιν
  choice: तुम्हारे बीच ... हैं
  rationale: अस्तित्वसूचक यूनानी रचना का स्वाभाविक हिन्दी समतुल्य।
theological_decisions:
- issue: मिश्रित-लिंग विश्वासी समुदाय के संदर्भ में ἀδελφοί का अनुवाद
  choice: मेरे भाइयो
  alternative: मेरे भाइयो और बहनो
  rationale: मुख्य पाठ यूनानी के व्याकरणिक रूप को बनाए रखता है, जबकि यह वास्तविक संभावना कि संबोधन पूरी विश्वासी मंडली को समावेशी रूप से इंगित करता है, पादटिप्पणी में सुरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में गरिमापूर्ण ‘मेरे भाइयो’ और समुदाय के लिए बहुवचन ‘तुम्हारे’ रखा गया है। वाक्य-क्रम हिन्दी की सहजता के अनुसार है, पर कारणसूचक संबंध, सूचना का स्रोत और झगड़ों की बहुलता सुरक्षित हैं।
