base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/022.yaml
  text: To the weak I became weak[a], so that I might win the weak. I have become all things to all people[b], so that by all means I might save some.
translation:
  language: hi
  text: मैं निर्बलों के लिए निर्बल बना[a], ताकि निर्बलों को जीत सकूँ। मैं सब लोगों के लिए सब कुछ बन गया हूँ, ताकि हर संभव उपाय से[b] कुछ लोगों का उद्धार कर सकूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विवेक के मामले में निर्बल’; 1 कुरिन्थियों में यह अभिव्यक्ति विशेष रूप से उन लोगों के लिए प्रयुक्त हो सकती है जिनका विवेक आसानी से आहत होता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हर तरह से’; इसका अर्थ लक्ष्य की प्राप्ति के लिए हर संभव उपाय अपनाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: मैं ... बना
  rationale: यह पौलुस द्वारा सेवकाई की परिस्थितियों में जानबूझकर अपनाई गई स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀσθενέσιν / ἀσθενής / ἀσθενεῖς
  choice: निर्बलों / निर्बल
  rationale: एक ही हिन्दी शब्द की पुनरावृत्ति यूनानी की अलंकारिक शक्ति बनाए रखती है और अर्थ को केवल विवेक की दुर्बलता तक सीमित नहीं करती।
- source_word: κερδήσω
  choice: जीत सकूँ
  rationale: इस सुसमाचार-सेवकाई के संदर्भ में इसका आशय लोगों को अपने पक्ष में लाभ की वस्तु बनाना नहीं, बल्कि उन्हें सुसमाचार के लिए जीतना है।
- source_word: τοῖς πᾶσιν
  choice: सब लोगों के लिए
  rationale: यूनानी में संक्षिप्त दत्तिव पद को हिन्दी में स्वाभाविक और स्पष्ट बनाने के लिए ‘लोगों’ जोड़ा गया है।
- source_word: γέγονα
  choice: बन गया हूँ
  rationale: पूर्णकाल वर्तमान तक बनी हुई सेवकाई की रीति या अवस्था का संकेत देता है।
- source_word: πάντα
  choice: सब कुछ
  rationale: यह यूनानी की व्यापक और संक्षिप्त अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: πάντως
  choice: हर संभव उपाय से
  rationale: यह लक्ष्य की प्राप्ति के लिए सभी संभव साधनों के प्रयोग का भाव देता है, बिना अनैतिक समझौते का अर्थ जोड़े।
- source_word: τινὰς
  choice: कुछ लोगों
  rationale: यह सर्वव्यापी सफलता का दावा न करके यूनानी की संयमित अनिश्चितता बनाए रखता है।
- source_word: σώσω
  choice: उद्धार कर सकूँ
  rationale: संदर्भ में क्रिया उद्धार का वास्तविक धार्मिक भार रखती है; सम्भावनार्थक रूप पौलुस के उद्देश्य को व्यक्त करता है।
theological_decisions:
- issue: ‘निर्बलों’ का अर्थ
  choice: मुख्य पाठ में व्यापक ‘निर्बलों’ रखा गया है।
  alternative: ‘विवेक में निर्बलों’ या ‘अशक्तों’
  rationale: 1 कुरिन्थियों 8–10 में यह विशेष रूप से संवेदनशील विवेक वालों की ओर संकेत कर सकता है, पर इस पद की भाषा स्वयं अधिक व्यापक है; इसलिए मुख्य पाठ में उसे संकुचित नहीं किया गया।
- issue: ‘उद्धार कर सकूँ’ में पौलुस की भूमिका
  choice: σῴζω का सीधा उद्धार-संबंधी भाव रखा गया है।
  alternative: ‘उद्धार तक पहुँचा सकूँ’ या ‘उद्धार में सहायक हो सकूँ’
  rationale: कमज़ोर अनुवाद मूल क्रिया का भार घटाता, जबकि विस्तृत व्याख्या पौलुस की भूमिका को पहले ही परिभाषित कर देती। पाठ का कथन और उसका धर्मवैज्ञानिक तनाव यथावत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक पठन के योग्य शैली रखी गई है। ‘निर्बल’ की तीनfold पुनरावृत्ति तथा ‘सब लोगों के लिए सब कुछ’ की संक्षिप्त अलंकारिक संरचना मूल के अनुरूप सुरक्षित है।
