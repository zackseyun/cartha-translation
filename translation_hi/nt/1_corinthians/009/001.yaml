reference: 1 Corinthians 9:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὐκ εἰμὶ ⸂ἐλεύθερος; οὐκ εἰμὶ ἀπόστολος⸃; οὐχὶ ⸀Ἰησοῦν τὸν κύριον ἡμῶν ἑόρακα; οὐ τὸ ἔργον μου ὑμεῖς ἐστε ἐν κυρίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/001.yaml
  text: Am I not free? Am I not an apostle? Have I not seen Jesus our Lord? Are you not my work in the Lord?[a]
translation:
  language: hi
  text: क्या मैं स्वतंत्र नहीं हूँ? क्या मैं प्रेरित नहीं हूँ? क्या मैंने हमारे प्रभु यीशु को नहीं देखा? क्या तुम प्रभु में मेरे कार्य नहीं हो?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύθερος
  choice: स्वतंत्र
  rationale: यहाँ पौलुस अपनी स्वतंत्रता और उससे जुड़े अधिकारों का दावा करता है; “स्वतंत्र” आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: ἀπόστολος
  choice: प्रेरित
  rationale: यह शब्द यहाँ सामान्य दूत नहीं, पौलुस की मान्य प्रेरिताई भूमिका को दर्शाता है; हिन्दी बाइबलीय प्रयोग में “प्रेरित” स्थापित पद है।
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: हमारे प्रभु यीशु
  rationale: यह हिन्दी में स्वाभाविक ढंग से यीशु की पहचान “हमारे प्रभु” के रूप में बनाए रखता है, यद्यपि यूनानी शब्दक्रम अधिक शाब्दिक रूप से “यीशु, हमारे प्रभु” है।
- source_word: ἑόρακα
  choice: मैंने ... देखा
  rationale: यूनानी पूर्णकाल पौलुस के दर्शन की वर्तमान प्रासंगिकता रखता है; हिन्दी में संदर्भ सहित सामान्य पूर्ण भूत “मैंने ... देखा” इसका स्वाभाविक रूप है।
- source_word: ἔργον
  choice: काम का फल
  rationale: कुरिन्थियों को स्वयं पौलुस के काम के रूप में कहना हिन्दी में कुछ कठोर है; “काम का फल” स्पष्ट करता है कि वे उसकी प्रेरिताई सेवा का परिणाम हैं, बिना अर्थ बदले।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह पौलुस की विशिष्ट संबंधपरक और आध्यात्मिक अभिव्यक्ति को उसकी खुली अर्थ-सीमा सहित सुरक्षित रखता है।
- source_word: οὐκ / οὐχὶ / οὐ
  choice: क्या ... नहीं?
  rationale: चारों नकारात्मक प्रश्न सकारात्मक उत्तर की अपेक्षा रखने वाले आलंकारिक प्रश्न हैं; हिन्दी में यह संरचना उसी बल को स्वाभाविक रूप से व्यक्त करती है।
theological_decisions:
- issue: यीशु को देखने के पौलुस के दावे का आशय
  choice: मुख्य पाठ में केवल “क्या मैंने हमारे प्रभु यीशु को नहीं देखा?”
  alternative: इसे स्पष्ट रूप से पुनरुत्थित यीशु के दर्शन के रूप में अनूदित करना
  rationale: संदर्भ में यह पौलुस की प्रेरिताई का प्रमाण है और संभवतः पुनरुत्थित यीशु के दर्शन की ओर संकेत करता है, पर यूनानी पाठ में “पुनरुत्थित” स्पष्टतः नहीं है; इसलिए उसे जोड़कर तनाव का समाधान नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लगातार चार आलंकारिक प्रश्नों की तीव्रता और तर्कात्मक लय सुरक्षित है।
