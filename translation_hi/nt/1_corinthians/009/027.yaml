id: 1CO.9.27
reference: 1 Corinthians 9:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως ἄλλοις κηρύξας αὐτὸς ἀδόκιμος γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/027.yaml
  text: But I discipline my body and make it my servant[a], lest somehow, after preaching to others[c][b], I myself should become disqualified.
translation:
  language: hi
  text: बल्कि मैं अपने शरीर को कठोर अनुशासन में रखता हूँ[a] और उसे अपना दास बनाता हूँ[b], कहीं ऐसा न हो कि दूसरों को प्रचार करने के बाद मैं स्वयं अयोग्य ठहरूँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं अपने शरीर पर प्रहार करता हूँ।” यूनानी क्रिया का शाब्दिक अर्थ आँख के नीचे मारना हो सकता है; यहाँ यह कठोर आत्म-अनुशासन के रूपक के रूप में प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या “उसे दासता में लाता हूँ।”
    reason: lexical_alternative
  - marker: c
    text: या “अस्वीकृत” अथवा “जाँच में खरा न उतरने वाला।” प्रसंग की खेल-कूद संबंधी छवि में “अयोग्य” उपयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπωπιάζω
  choice: कठोर अनुशासन में रखता हूँ
  rationale: इस क्रिया का शाब्दिक अर्थ आँख के नीचे प्रहार करना हो सकता है, पर यहाँ खेल-कूद के रूपक में यह शरीर पर कठोर संयम और अनुशासन रखने को व्यक्त करती है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और प्रहार की तीखी मूल छवि पादटिप्पणी में सुरक्षित है।
- source_word: σῶμα
  choice: शरीर
  rationale: यूनानी पाठ शरीर को ही अनुशासन का प्रत्यक्ष विषय बनाता है; इसलिए इसे सामान्यीकृत करके ‘स्वयं’ नहीं किया गया।
- source_word: δουλαγωγῶ
  choice: अपना दास बनाता हूँ
  rationale: क्रिया का अर्थ दास बनाना या दासता में लाना है। यह रूपक की कठोरता को ‘वश में रखता हूँ’ जैसे नरम अनुवाद से अधिक स्पष्ट रूप में बनाए रखता है।
- source_word: μή πως
  choice: कहीं ऐसा न हो कि
  rationale: यह नकारात्मक आशंका या सावधानी को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἄλλοις
  choice: दूसरों को
  rationale: κηρύξας के साथ प्रयुक्त सम्प्रदान का सहज हिन्दी रूप है।
- source_word: κηρύξας
  choice: प्रचार करने के बाद
  rationale: अओरिस्ट कृदन्त की मुख्य क्रिया से पहले घटित क्रिया स्पष्ट होती है और सार्वजनिक घोषणा का भाव बना रहता है।
- source_word: ἀδόκιμος
  choice: अयोग्य ठहरूँ
  rationale: शब्द में जाँच में अस्वीकृत या अनुपयुक्त पाए जाने का भाव है। निकटवर्ती खेल-कूद की छवि में ‘अयोग्य ठहरूँ’ उपयुक्त है और यह तय नहीं करता कि बात अनन्त उद्धार, प्रतिफल या सेवकाई की योग्यता में से केवल किसकी है।
- source_word: γένωμαι
  choice: ठहरूँ
  rationale: यह आशंकित परिणाम को हिन्दी में सहज रूप से व्यक्त करता है; यहाँ ‘ठहरना’ जाँच के बाद अयोग्य पाए जाने के भाव को भी सँभालता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: पिछले कथन के विपरीत पौलुस अपने सक्रिय कठोर अनुशासन पर बल देता है; ‘बल्कि’ इस तीखे विरोध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: पौलुस के ἀδόκιμος होने की आशंका का अर्थ
  choice: खेल-कूद और जाँच की पृष्ठभूमि में ‘अयोग्य ठहरूँ’, बिना यह निश्चित किए कि यह उद्धार, प्रतिफल या सेवकाई की योग्यता में से किसके विषय में है।
  alternative: परमेश्वर द्वारा अन्ततः अस्वीकार किया जाना; अथवा केवल सेवकाई या प्रतिफल के लिए अयोग्य होना।
  rationale: तात्कालिक प्रसंग दौड़, संयम और पुरस्कार की छवि का है। अनुवाद चेतावनी की गंभीरता बनाए रखता है, पर यूनानी पाठ से आगे जाकर विवादित धर्मवैज्ञानिक निष्कर्ष नहीं बाँधता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज पर गरिमापूर्ण रखी गई है। ‘कठोर अनुशासन’ सामान्य पाठक के लिए अर्थ स्पष्ट करता है, जबकि पादटिप्पणी मूल क्रिया की प्रहार-संबंधी तीखी छवि सुरक्षित रखती है। ‘दास’ जानबूझकर रखा गया है ताकि δουλαγωγῶ की प्रबल सामाजिक रूपक-भाषा नरम न पड़े।
