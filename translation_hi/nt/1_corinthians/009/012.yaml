source:
  edition: SBLGNT
  text: εἰ ἄλλοι τῆς ⸂ὑμῶν ἐξουσίας⸃ μετέχουσιν, οὐ μᾶλλον ἡμεῖς; Ἀλλ’ οὐκ ἐχρησάμεθα τῇ ἐξουσίᾳ ταύτῃ, ἀλλὰ πάντα στέγομεν ἵνα μή ⸂τινα ἐγκοπὴν⸃ δῶμεν τῷ εὐαγγελίῳ τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/012.yaml
  text: If others share in this right over you[a], do not we even more? But we have not made use of this right; instead[b], we endure everything so that we may give no hindrance to the gospel of the Messiah.
translation:
  language: hi
  text: यदि दूसरे लोग तुम पर इस अधिकार का लाभ उठाते हैं, तो क्या हम और भी अधिक नहीं? परन्तु हमने इस अधिकार का उपयोग नहीं किया; बल्कि हम सब कुछ सहते हैं, ताकि मसीह के सुसमाचार के लिए कोई बाधा उत्पन्न न करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσίας / ἐξουσίᾳ
  choice: अधिकार
  rationale: यहाँ यह शब्द प्रेरितों के कुरिन्थियों से भौतिक सहायता पाने के वैध हक को व्यक्त करता है। ‘अधिकार’ आधुनिक हिन्दी में इस वैध दावे को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῆς ὑμῶν ἐξουσίας
  choice: तुम पर इस अधिकार
  rationale: ὑμῶν को अधिकार रखने वाले के रूप में नहीं, बल्कि उन लोगों के रूप में समझा गया है जिनके संबंध में यह अधिकार लागू होता है। ‘तुम पर’ इस संबंधपरक अर्थ को बनाए रखता है, यद्यपि हिन्दी में इसकी सम्भावित कठोरता के कारण पादटिप्पणी में विकल्प दिए गए हैं।
- source_word: μετέχουσιν
  choice: सहभागी हैं
  rationale: यह किसी अधिकार में हिस्सा रखने या उससे लाभ उठाने का भाव व्यक्त करता है।
- source_word: οὐ μᾶλλον ἡμεῖς;
  choice: तो क्या हम और भी अधिक नहीं?
  rationale: यह यूनानी के आलंकारिक प्रश्न और μᾶλλον के तुलनात्मक बल दोनों को सुरक्षित रखता है।
- source_word: ἐχρησάμεθα
  choice: उपयोग नहीं किया
  rationale: χράομαι का यहाँ अर्थ किसी उपलब्ध अधिकार का लाभ उठाना या उसे काम में लाना है।
- source_word: πάντα στέγομεν
  choice: हम सब कुछ सहते हैं
  rationale: संदर्भ में στέγω का अर्थ ढकना नहीं, बल्कि कठिनाइयों और अभाव को सहना है; πάντα कथन की व्यापकता बनाए रखता है।
- source_word: τινα ἐγκοπὴν δῶμεν
  choice: कोई बाधा न डालें
  rationale: शाब्दिक ‘कोई बाधा न दें’ की अपेक्षा ‘बाधा डालना’ स्वाभाविक हिन्दी मुहावरा है और सुसमाचार की प्रगति में रुकावट पैदा करने का आशय स्पष्ट करता है।
- source_word: εὐαγγελίῳ
  choice: सुसमाचार
  rationale: यह पौलुस के संदर्भ में स्थापित, गरिमापूर्ण और व्यापक रूप से समझा जाने वाला हिन्दी धर्मशास्त्रीय पद है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; ‘मसीह’ हिन्दी में ‘अभिषिक्त जन’ की मसीही उपाधि का स्थापित रूप है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ शब्द उपाधि के रूप में है। ‘मसीह’ उसके मसीहाई अर्थ को हिन्दी में स्थापित और सामान्य ढंग से बनाए रखता है; इसे केवल नाम मानकर अर्थ को निर्बल नहीं किया गया।
- issue: प्रेरिताई अधिकार का स्वरूप
  choice: तुम पर इस अधिकार
  alternative: तुमसे सहायता पाने का अधिकार
  rationale: मुख्य पाठ यूनानी वाक्यांश की संबंधपरक अस्पष्टता को कुछ हद तक बनाए रखता है; पादटिप्पणी संदर्भगत रूप से सम्भावित भौतिक सहायता के आशय को स्पष्ट करती है, पर उसे निर्विवाद विस्तार बनाकर मुख्य पाठ में नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘फिर भी… बल्कि’ से यूनानी के तीखे विरोध को व्यक्त किया गया है। ‘सुसमाचार के मार्ग में बाधा डालना’ लक्ष्य भाषा में स्वाभाविक है और मूल के आशय को बिना अनावश्यक व्याख्या जोड़े संप्रेषित करता है।
