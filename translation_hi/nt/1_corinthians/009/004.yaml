- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: संदर्भ में यह शासन करने की सत्ता या मात्र सामर्थ्य नहीं, बल्कि प्रेरित के वैध हक़ अथवा स्वतंत्रता को व्यक्त करता है। “अधिकार” इस अर्थ को संक्षिप्त और स्पष्ट रूप से संप्रेषित करता है।
- source_word: φαγεῖν καὶ πεῖν
  choice: खाने-पीने का
  rationale: दोनों समन्वित क्रियार्थक रूपों को हिंदी के स्वाभाविक संयुक्त पद “खाने-पीने” से व्यक्त किया गया है; इससे दोनों गतिविधियाँ स्पष्ट रहती हैं और वाक्य बोझिल नहीं होता।
theological_decisions:
- issue: प्रेरित के अधिकार का दायरा
  choice: मुख्य पाठ में केवल खाने-पीने के अधिकार को रखा गया है; पादटिप्पणी में प्रसंगानुसार भौतिक सहायता का संभावित आशय बताया गया है।
  alternative: इसे सामान्य मानवीय खाने-पीने की स्वतंत्रता मानना, या मुख्य पाठ में सीधे “भरण-पोषण पाने का अधिकार” कहना।
  rationale: 1 कुरिन्थियों 9 का निकट प्रसंग प्रेरितों और सेवकों के भरण-पोषण से संबंधित है, पर इस पद के यूनानी शब्द स्वयं केवल “खाने और पीने का अधिकार” कहते हैं। इसलिए मुख्य पाठ स्रोत की अभिव्यक्ति और उसकी कुछ खुली हुई अर्थ-सीमा को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “क्या ... नहीं” ने मूल के आलंकारिक प्रश्न और अपेक्षित सकारात्मक उत्तर को सुरक्षित रखा है।
