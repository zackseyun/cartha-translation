lexical_decisions:
- source_word: μὴ οὐκ
  choice: क्या ... नहीं
  rationale: यह संयुक्त नकारात्मक प्रश्न सकारात्मक उत्तर की अपेक्षा रखता है। हिंदी में “क्या ... नहीं” प्रश्न का आलंकारिक बल स्वाभाविक रूप से बनाए रखता है।
- source_word: ἔχομεν
  choice: हमें ... है
