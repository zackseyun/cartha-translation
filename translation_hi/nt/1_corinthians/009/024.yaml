id: 1CO.9.24
reference: 1 Corinthians 9:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὐκ οἴδατε ὅτι οἱ ἐν σταδίῳ τρέχοντες πάντες μὲν τρέχουσιν, εἷς δὲ λαμβάνει τὸ βραβεῖον; οὕτως τρέχετε ἵνα καταλάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/024.yaml
  text: Do you not know that those who run in a stadium all run[a], but one receives the prize? Run in this way[b], so that you may obtain it.
translation:
  language: hi
  text: क्या तुम लोग नहीं जानते कि दौड़ के मैदान[a] में दौड़नेवाले सभी दौड़ते तो हैं, पर पुरस्कार एक ही पाता है? तुम इसी प्रकार दौड़ो, ताकि उसे पा सको[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दौड़-पथ पर।’ यूनानी शब्द στάδιον दौड़ के स्थान—मैदान या पथ—को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘ताकि उसे जीत सको’ अथवा ‘ताकि उसे पकड़ सको।’ यूनानी καταλάβητε का अर्थ ‘प्राप्त करना,’ ‘पकड़ लेना’ या ‘लक्ष्य तक पहुँचना’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: क्या तुम लोग नहीं जानते
  rationale: यह पौलुस का परिचित आलंकारिक प्रश्न है। ‘जानते’ οἴδατε का सीधा अर्थ बनाए रखता है, और ‘तुम लोग’ यूनानी बहुवचन को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἐν σταδίῳ
  choice: दौड़ के मैदान में
  rationale: στάδιον दौड़ के लिए निर्धारित स्थान या पथ को दर्शाता है। ‘दौड़ का मैदान’ ठोस क्रीड़ा-चित्र को बनाए रखते हुए आधुनिक हिन्दी में ‘स्टेडियम’ से अधिक सटीक है।
- source_word: τρέχοντες ... τρέχουσιν
  choice: दौड़नेवाले सभी दौड़ते
  rationale: मूल की पुनरावृत्ति और सजीव दौड़-रूपक को सुरक्षित रखा गया है।
- source_word: πάντες μὲν ... εἷς δὲ
  choice: सभी ... तो हैं, पर ... एक ही
  rationale: ‘तो ... पर’ μέν...δέ के विरोध को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘एक ही’ εἷς के बल को स्पष्ट रखता है।
- source_word: λαμβάνει
  choice: पाता है
  rationale: यह λαμβάνει के सामान्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और ‘जीतता है’ जैसी अधिक व्याख्यात्मक क्रीड़ा-भाषा जोड़ने से बचता है।
- source_word: τὸ βραβεῖον
  choice: पुरस्कार
  rationale: βραβεῖον प्रतियोगिता के विजेता को मिलनेवाले पुरस्कार को सूचित करता है; ‘पुरस्कार’ संक्षिप्त, प्रतिष्ठित और सामान्य हिन्दी है।
- source_word: οὕτως
  choice: इसी प्रकार
  rationale: यह पहले बताए गए दौड़ के ढंग की ओर संकेत को स्पष्ट रखता है।
- source_word: τρέχετε
  choice: दौड़ो
  rationale: वर्तमान आज्ञार्थक की निरंतर प्रयत्न की पुकार को हिन्दी का सरल और प्रभावशाली आज्ञार्थक स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἵνα καταλάβητε
  choice: ताकि उसे पा सको
  rationale: ‘पा सको’ उद्देश्य और καταλαμβάνω के ‘प्राप्त करना’ अर्थ को व्यक्त करता है। ‘उसे’ निकटवर्ती ‘पुरस्कार’ से स्वाभाविक रूप से ग्रहण किया गया है; अन्य संभावित अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: मसीही जीवन और धीरज के लिए दौड़ का रूपक
  choice: प्रतियोगी दौड़ के चित्र और उद्देश्यपूर्ण प्रयत्न की प्रेरणा को बनाए रखा गया है, पर उद्धार, योग्यता या प्रतिफल की कोई विशिष्ट धर्मसैद्धान्तिक व्याख्या नहीं जोड़ी गई।
  alternative: अधिक व्याख्यात्मक रूप से ‘जीतने के लिए दौड़ो’ कहना।
  rationale: पौलुस अनुशासित और लक्ष्यपूर्ण प्रयास के लिए क्रीड़ा-दृष्टान्त देता है। अनुवाद को व्यापक धर्मसैद्धान्तिक प्रश्नों का ऐसा समाधान नहीं करना चाहिए जो इस पद में स्पष्ट रूप से नहीं दिया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सीधी किंतु गरिमापूर्ण रखी गई है। ‘तुम लोग’ संबोधन के बहुवचन को स्पष्ट करता है। ‘दौड़ के मैदान,’ ‘दौड़ो’ और ‘पुरस्कार’ मूल क्रीड़ा-रूपक को सामान्य पाठक के लिए ठोस और सहज बनाए रखते हैं।
