base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/025.yaml
  text: Everyone who competes exercises self-control in all things. They do so in order to receive a perishable crown[a], but we an imperishable one.
translation:
  language: hi
  text: हर प्रतियोगी हर बात में आत्म-संयम रखता है। वे तो नाशवान मुकुट[a] पाने के लिए ऐसा करते हैं, पर हम अविनाशी मुकुट के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विजय-माला”; यूनानी शब्द खेल-प्रतियोगिताओं में विजेता को दी जाने वाली माला के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀγωνιζόμενος
  choice: हर प्रतियोगी
  rationale: सार्वभौमिक एकवचन और खेल-कूद के प्रसंग को स्वाभाविक, संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: πάντα ἐγκρατεύεται
  choice: हर बात में आत्म-संयम रखता है
  rationale: πάντα के व्यापक दायरे और ἐγκρατεύεται के अभ्यासगत संयम—दोनों को बनाए रखता है; इसे केवल भोजन या प्रशिक्षण तक सीमित नहीं करता।
- source_word: ἐκεῖνοι μὲν οὖν
  choice: वे तो ऐसा
  rationale: पहले बताए गए प्रतियोगियों की ओर लौटता है और ἡμεῖς δέ के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: ἵνα ... λάβωσιν
  choice: इसलिए करते हैं कि ... पाएँ
  rationale: उद्देश्य का भाव सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: φθαρτὸν στέφανον
  choice: नाशवान मुकुट
  rationale: φθαρτός और ἄφθαρτος का सीधा विरोध सुरक्षित रखता है; στέφανος की प्रतियोगिता-विजेता माला वाली विशेष पृष्ठभूमि पादटिप्पणी में दी गई है।
- source_word: ἄφθαρτον
  choice: अविनाशी मुकुट
  rationale: ग्रीक में संज्ञा लुप्त है, पर हिन्दी में स्पष्टता और सहजता के लिए 'मुकुट' दोहराया गया है; प्रतिफल का अधिक विशिष्ट धर्मवैज्ञानिक अर्थ नहीं जोड़ा गया।
theological_decisions:
- issue: प्रतिफल के रूपक का स्वरूप
  choice: खेल-प्रतियोगिता के पुरस्कार की छवि को 'मुकुट' के रूप में बनाए रखना
  alternative: इसे स्पष्ट रूप से अनन्त जीवन या स्वर्गीय पुरस्कार कहना
  rationale: पद स्वयं प्रतिफल का अधिक संकीर्ण धर्मवैज्ञानिक अर्थ निर्धारित नहीं करता; इसलिए अस्थायी और अविनाशी प्रतिफल के बीच पौलुस का विरोध बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठकों के लिए सहज किंतु गरिमापूर्ण शैली। 'आत्म-संयम' व्यापक अनुशासन को व्यक्त करता है और 'मुकुट' पारंपरिक रूपक को रखते हुए पादटिप्पणी से उसके खेल-संबंधी अर्थ को स्पष्ट करता है।
