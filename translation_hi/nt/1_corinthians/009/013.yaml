source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι οἱ τὰ ἱερὰ ἐργαζόμενοι ⸀τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν, οἱ τῷ θυσιαστηρίῳ ⸀παρεδρεύοντες τῷ θυσιαστηρίῳ συμμερίζονται;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/013.yaml
  text: Do you not know that those who work in the temple eat from the temple[b][a], and those who serve at the altar share in what is offered on the altar?
translation:
  language: hi
  text: क्या तुम नहीं जानते कि जो लोग मन्दिर की पवित्र सेवा करते हैं, वे मन्दिर से मिलने वाला भोजन खाते हैं,[a] और जो वेदी की सेवा में लगे रहते हैं, वे वेदी पर चढ़ाई गई बलियों में से हिस्सा पाते हैं?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “जो लोग पवित्र वस्तुओं के साथ काम करते हैं, वे मन्दिर से मिलने वाली वस्तुएँ खाते हैं।”'
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक रूप से: “वे वेदी में सहभागी होते हैं,” अर्थात वे वहाँ चढ़ाई गई बलियों में से अपना भाग पाते हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ οἴδατε
  choice: क्या तुम नहीं जानते
  rationale: पौलुस के परिचित आलंकारिक प्रश्न की औपचारिक शक्ति बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οἱ τὰ ἱερὰ ἐργαζόμενοι
  choice: जो लोग पवित्र सेवाएँ करते हैं
  rationale: शाब्दिक रूप से यह ‘पवित्र वस्तुओं/कार्यों में लगे’ लोगों को सूचित करता है; यह चयन मन्दिर-सेवा का आशय स्पष्ट करता है, पर केवल स्थान में काम करने का व्यापक अर्थ नहीं देता।
- source_word: τὰ ἐκ τοῦ ἱεροῦ ἐσθίουσιν
  choice: वे मन्दिर से भोजन पाते हैं
  rationale: मूल के ‘खाते हैं’ का व्यावहारिक आशय—मन्दिर से जीविका अथवा भोजन मिलना—सहज हिन्दी में व्यक्त करता है; अधिक शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: ἱεροῦ
  choice: मन्दिर
  rationale: ἱερόν सामान्यतः समूचे मन्दिर-परिसर को दर्शाता है; ‘मन्दिर’ इसका स्पष्ट और मानक हिन्दी प्रतिशब्द है।
- source_word: παρεδρεύοντες
  choice: वेदी की सेवा में लगे रहते हैं
  rationale: वेदी के पास नियुक्त रहकर सेवा करने की निरन्तर भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θυσιαστηρίῳ
  choice: वेदी
  rationale: बलि की वेदी के लिए मानक और सटीक हिन्दी शब्द।
- source_word: συμμερίζονται
  choice: चढ़ावों में हिस्सा पाते हैं
  rationale: क्रिया का अर्थ किसी हिस्से में सहभागी होना अथवा हिस्सा पाना है। ‘वेदी के साथ हिस्सा बाँटते हैं’ मूल संरचना के निकट है, पर हिन्दी में अस्पष्ट हो सकती है; इसलिए निहित बलि-चढ़ावों को स्पष्ट किया गया है।
theological_decisions:
- issue: पवित्र सेवा करने वालों की जीविका और वेदी की उपमा
  choice: मन्दिर और वेदी की सेवा करने वालों को उसी पवित्र सेवा से भोजन तथा हिस्सा मिलने का सिद्धान्त व्यक्त किया गया है।
  alternative: अन्तिम वाक्यांश को अधिक शाब्दिक रूप से ‘वेदी के साथ हिस्सा बाँटते हैं’ कहा जा सकता है।
  rationale: पौलुस की उपमा का आर्थिक और उपासना-संबंधी तर्क सुरक्षित रहता है, जबकि बाद की कलीसियाई पद-व्यवस्थाओं को पाठ में नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रूप। ‘पवित्र सेवाएँ’ उपासना-संबंधी संदर्भ बनाए रखता है; ‘मन्दिर’, ‘वेदी’ और ‘चढ़ाव’ परिचित धार्मिक शब्दावली हैं। अल्पविराम के बाद पादटिप्पणी-चिह्न रखने के बजाय चिह्न को संबंधित खण्ड के तुरन्त बाद रखा गया है।
