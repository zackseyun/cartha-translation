id: 1CO.9.15
reference: 1 Corinthians 9:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐγὼ δὲ ⸂οὐ κέχρημαι οὐδενὶ⸃ τούτων. οὐκ ἔγραψα δὲ ταῦτα ἵνα οὕτως γένηται ἐν ἐμοί, καλὸν γάρ μοι μᾶλλον ἀποθανεῖν ἤ— τὸ καύχημά μου ⸂οὐδεὶς κενώσει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/015.yaml
  text: But I have made use of none of these things[a]. Yet I did not write these things so that it should be done this way for me[b], for I would rather die than—no one will nullify my boasting.
translation:
  language: hi
  text: पर मैंने इनमें से किसी का भी उपयोग नहीं किया है।[a] फिर भी मैंने ये बातें इसलिए नहीं लिखीं कि मेरे साथ भी ऐसा ही किया जाए। क्योंकि मेरे लिए मर जाना बेहतर है—बजाय इसके कि—मेरी शेखी को कोई निष्फल नहीं करेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, संदर्भ के अनुसार, “इन अधिकारों में से किसी का भी।”
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी वाक्य “बजाय इसके कि—” के बाद टूट जाता है और फिर एक स्वतंत्र कथन के साथ आगे बढ़ता है: “मेरी शेखी को कोई निष्फल नहीं करेगा।” कई अनुवाद अर्थ को सुचारु करके लिखते हैं: “इससे कि कोई मेरी शेखी को निष्फल कर दे।”'
    reason: alternative_reading
lexical_decisions:
- source_word: κέχρημαι
  choice: उपयोग नहीं किया है
  rationale: पूर्णकालिक रूप उस वर्तमान स्थिति को व्यक्त करता है जो पहले से इन अधिकारों का लाभ न उठाने के कारण बनी हुई है; यह स्वाभाविक हिन्दी में अर्थ को स्पष्ट रखता है।
- source_word: οὐδενὶ τούτων
  choice: इनमें से किसी का भी
  rationale: यूनानी अभिव्यक्ति को अपेक्षाकृत निकट रखते हुए संदर्भ में पहले बताए गए अधिकारों की ओर संकेत किया गया है; अधिक स्पष्ट विकल्प पादटिप्पणी में है।
- source_word: ἵνα οὕτως γένηται ἐν ἐμοί
  choice: इसलिए नहीं लिखीं कि मेरे लिए ऐसा किया जाए
  rationale: यह उद्देश्यवाचक वाक्यांश बताता है कि पौलुस अपने लिए ऐसी सहायता की व्यवस्था करवाने के उद्देश्य से नहीं लिख रहा था।
- source_word: καλὸν γάρ μοι μᾶλλον ἀποθανεῖν
  choice: मेरे लिए मर जाना ही बेहतर है
  rationale: यह हिन्दी में पौलुस की तीव्र वरीयता को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: τὸ καύχημά μου
  choice: मेरे इस गर्व
  rationale: καύχημα यहाँ उस आधार या विषय को सूचित कर सकता है जिस पर पौलुस गर्व करता है—अर्थात बिना पारिश्रमिक सुसमाचार सुनाना; संक्षिप्त हिन्दी पद स्रोत की अर्थगत खुलावट बनाए रखता है।
- source_word: κενώσει
  choice: निष्फल कर दे
  rationale: शाब्दिक अर्थ ‘खाली कर देना’ है, पर यहाँ रूपक रूप से गर्व के आधार को प्रभावहीन या निरर्थक कर देने का भाव है; ‘निष्फल’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
theological_decisions:
- issue: ἤ के बाद टूटी हुई वाक्य-रचना
  choice: ‘बजाय इसके कि—’ के बाद डैश रखकर वाक्य के भावपूर्ण टूटाव को सुरक्षित रखा गया है।
  alternative: ‘इससे कि कोई मेरे इस गर्व को निष्फल कर दे’ कहकर वाक्य को सुचारु रूप से पूरा किया जा सकता है।
  rationale: यूनानी पाठ ἤ (‘बजाय/से’) के बाद अचानक टूटता है और फिर नए जोर के साथ आगे बढ़ता है। इसे समतल कर देना पौलुस की तीव्र भावनात्मक अभिव्यक्ति को छिपा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। स्रोत के अचानक वाक्य-विच्छेद को डैश द्वारा बनाए रखा गया है; ‘गर्व’ को नकारात्मक नैतिक अर्थ में अनिवार्यतः न बाँधकर पौलुस के गर्व करने के आधार के अर्थ में खुला रखा गया है।
