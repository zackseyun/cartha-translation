reference: 1 Corinthians 9:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοῖς ἀνόμοις ὡς ἄνομος, μὴ ὢν ἄνομος ⸀θεοῦ ἀλλ’ ἔννομος ⸀Χριστοῦ, ἵνα ⸀κερδάνω ⸀τοὺς ἀνόμους·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/021.yaml
  text: To those outside the law[b][a], as one outside the law—though not being outside God’s law but under Messiah’s law—so that I might win those outside the law.
translation:
  language: hi
  text: जो व्यवस्था से बाहर हैं, उनके लिए मैं व्यवस्था से बाहर के व्यक्ति जैसा बना—यद्यपि मैं परमेश्वर की व्यवस्था से बाहर नहीं, बल्कि मसीह की व्यवस्था के अधीन हूँ[a]—ताकि मैं व्यवस्था से बाहर के लोगों को जीत सकूँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश का अनुवाद “मसीह की व्यवस्था के भीतर” या “मसीह के प्रति व्यवस्था-बद्ध” भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “व्यवस्था से बाहर” का अर्थ यहाँ मुख्यतः मूसा की व्यवस्था के अधीन न होना है; इसका अर्थ अनिवार्य रूप से नैतिक रूप से स्वेच्छाचारी होना नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμοις / ἄνομος / ἀνόμους
  choice: व्यवस्था से बाहर
  rationale: संदर्भ में यह वाक्यांश मूसा की व्यवस्था के अधीन न होने वालों को दर्शाता है, न कि अनिवार्य रूप से दुष्ट या नैतिक रूप से स्वेच्छाचारी लोगों को। इसकी पुनरावृत्ति यूनानी पाठ की संरचना को भी बनाए रखती है।
- source_word: ὡς
  choice: जैसा
  rationale: यह पौलुस की अनुकूलनशील भूमिका को दर्शाता है; वह वैसा बना, पर पूर्ण अर्थ में व्यवस्था-विहीन नहीं हुआ।
- source_word: μὴ ὢν
  choice: यद्यपि मैं ... नहीं
  rationale: सहभागी उपवाक्य का प्रसंगगत रियायती भाव स्वाभाविक हिन्दी में स्पष्ट किया गया है।
- source_word: ἔννομος Χριστοῦ
  choice: मसीह की व्यवस्था के अधीन
  rationale: ἔννομος का अर्थ व्यवस्था के दायरे या अधिकार में होना है। 'के अधीन' स्पष्ट और स्वाभाविक हिन्दी है; Χριστοῦ को यहाँ पदवीगत अर्थ में 'मसीह' किया गया है।
- source_word: ἵνα κερδάνω
  choice: ताकि ... जीत सकूँ
  rationale: ἵνα उद्देश्य प्रकट करता है और κερδάνω का अर्थ इस सुसमाचार-प्रचार के संदर्भ में लोगों को अपने पक्ष में या विश्वास की ओर जीतना है। 'सकूँ' संभाव्यता सहित उद्देश्य को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस संदर्भ में ἄνομος का अर्थ
  choice: मूसा की व्यवस्था के अधीन न रहने वाले, विशेषतः गैर-यहूदी
  alternative: नैतिक अर्थ में अधर्मी या व्यवस्था-विरोधी
  rationale: पद 20–21 में व्यवस्था के अधीन लोगों और व्यवस्था से बाहर लोगों का सामांतर विरोध covenantal/legal स्थिति की ओर संकेत करता है। पौलुस का अगला स्पष्टीकरण नैतिक स्वेच्छाचार को नकारता है।
- issue: ἔννομος Χριστοῦ का आशय
  choice: मसीह की व्यवस्था के अधीन
  alternative: मसीह की व्यवस्था के भीतर / मसीह के प्रति व्यवस्था-बद्ध
  rationale: वाक्य पौलुस को परमेश्वर के प्रति उत्तरदायित्व से मुक्त नहीं ठहराता, बल्कि मसीह से संबंधित व्यवस्था के अधिकार में बताता है। 'अधीन' कानूनी-संबंधपरक भाव को सहजता से रखता है; वैकल्पिक संरचना पादटिप्पणी में दी गई है।
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / क्राइस्ट
  rationale: यहाँ Χριστός पदवी के रूप में सक्रिय है, इसलिए आधुनिक मानक हिन्दी में स्थापित पदवी 'मसीह' उपयुक्त है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। यूनानी पाठ में ἄνομος की तीनfold पुनरावृत्ति को 'व्यवस्था से बाहर' दोहराकर सुरक्षित रखा गया है। डैश पौलुस के स्पष्टीकरण को मुख्य वाक्य से अलग करता है।
