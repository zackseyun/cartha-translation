  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐλεύθερος γὰρ ὢν ἐκ πάντων πᾶσιν ἐμαυτὸν ἐδούλωσα, ἵνα τοὺς πλείονας κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/019.yaml
  text: For though I am free from all[a], I made myself a servant to all, so that I might win more of them.
translation:
  language: hi
  text: क्योंकि सब लोगों से स्वतंत्र होते हुए भी मैंने अपने आपको सब लोगों का दास[a] बना लिया, ताकि मैं अधिक लोगों को जीत सकूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेवक।” यूनानी क्रिया का शाब्दिक भाव अपने आपको दास बनाना है; यहाँ “स्वतंत्र” के साथ विरोध बनाए रखने के लिए मुख्य पाठ में “दास” रखा गया है।
    reason: दासता-संबंधी यूनानी रूपक और अधिक कोमल वैकल्पिक हिंदी अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: Ἐλεύθερος
  choice: स्वतंत्र
  rationale: यह शब्द बंधन या किसी के अधिकार के अधीन न होने का भाव व्यक्त करता है और आगे आने वाले ‘दास’ के साथ मूल विरोधाभास को बनाए रखता है।
- source_word: ἐκ πάντων
  choice: सब लोगों से
  rationale: संदर्भ में πάντων व्यक्तियों की ओर संकेत करता है। ‘सब लोगों से’ यूनानी की संक्षिप्त अभिव्यक्ति और πᾶσιν के साथ उसका अलंकारिक समानांतर बनाए रखता है।
- source_word: πᾶσιν
  choice: सब लोगों का
  rationale: हिंदी में ‘दास बना लिया’ के साथ स्वाभाविक संबंध ‘सब लोगों का’ है; यह उन सभी को दर्शाता है जिनकी सेवा के लिए पौलुस ने स्वेच्छा से अपने आपको अधीन किया।
- source_word: ἐμαυτὸν ἐδούλωσα
  choice: मैंने अपने आपको ... दास बना लिया
  rationale: यह प्रतिवर्ती वाक्यांश स्वेच्छा से अपने आपको दास की स्थिति में रखने का प्रबल रूपक व्यक्त करता है। ‘दास’ स्वतंत्रता के साथ मूल पाठ का तीखा विरोध सुरक्षित रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य सूचित करता है; ‘ताकि’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: τοὺς πλείονας
  choice: अधिक लोगों को
  rationale: तुलनात्मक पद अधिक संख्या में लोगों की ओर संकेत करता है। यह अनावश्यक रूप से ‘जितने संभव हों’ जैसा अधिक प्रबल अर्थ नहीं जोड़ता।
- source_word: κερδήσω
  choice: जीत सकूँ
  rationale: यहाँ क्रिया लोगों को सुसमाचार के लिए प्राप्त करने के रूपक में प्रयुक्त है; ‘जीत सकूँ’ उस रूपक और उद्देश्यभाव दोनों को बनाए रखता है।
theological_decisions:
- issue: δουλόω की दासता-संबंधी भाषा का अनुवाद
  choice: दास बना लिया
  alternative: सेवक बना लिया
  rationale: पौलुस ‘स्वतंत्र’ होने और अपने आपको ‘दास’ बनाने के बीच जानबूझकर तीखा विरोध रखता है। ‘सेवक’ अधिक कोमल है और इस बंधन-संबंधी रूपक की शक्ति घटा सकता है; फिर भी पाठक की सहायता के लिए उसे पादटिप्पणी में वैकल्पिक अनुवाद के रूप में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य रखा गया है। ‘सब लोगों से ... सब लोगों का’ मूल यूनानी की पुनरावृत्ति और समानांतरता को सुरक्षित रखता है।
