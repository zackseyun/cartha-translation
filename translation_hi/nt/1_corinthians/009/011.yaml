  edition: SBLGNT
  text: εἰ ἡμεῖς ὑμῖν τὰ πνευματικὰ ἐσπείραμεν, μέγα εἰ ἡμεῖς ὑμῶν τὰ σαρκικὰ θερίσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/011.yaml
  text: If we have sown spiritual things among you[a], is it too much if we reap material things from you?
translation:
  language: hi
  text: यदि हमने तुम्हारे बीच आत्मिक बातें बोई हैं, तो क्या यह बहुत बड़ी बात है कि हम तुमसे भौतिक वस्तुओं की फसल काटें?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सांसारिक वस्तुओं की।” यूनानी में “आत्मिक बातों” की तुलना साधारण शारीरिक या भौतिक जीवन से संबंधित वस्तुओं से की गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πνευματικὰ
  choice: आत्मिक बातें
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और आत्मिक लाभों या सेवकाई को व्यापक रूप से व्यक्त करता है; यह चयन मूल की व्यापकता बनाए रखता है।
- source_word: ἐσπείραμεν
  choice: हमने ... बोई हैं
  rationale: अओरिस्ट पौलुस की पहले की गई सेवकाई की ओर संकेत करता है; हिन्दी का पूर्ण रूप उसके वर्तमान महत्त्व को स्वाभाविक ढंग से व्यक्त करता है और बुवाई का रूपक बनाए रखता है।
- source_word: μέγα
  choice: कोई बड़ी बात
  rationale: इस आलंकारिक प्रश्न में इसका आशय किसी माँग के अत्यधिक या अनुचित होने से है; हिन्दी में यह मुहावरा उसी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὰ σαρκικὰ
  choice: भौतिक वस्तुओं
  rationale: संदर्भ में यह शरीर और साधारण भौतिक जीवन से संबंधित सहायता को दर्शाता है, न कि पापमय आचरण को।
- source_word: θερίσομεν
  choice: फसल काटें
  rationale: यह भविष्यकालीन क्रिया बुवाई और कटाई के कृषि-रूपक को आगे बढ़ाती है; आलंकारिक प्रश्न में संभावित प्राप्ति को हिन्दी का यह रूप सहजता से व्यक्त करता है।
- source_word: ὑμῶν
  choice: तुमसे
  rationale: θερίζω के साथ संबंधवाचक रूप स्रोत को दर्शाता है—भौतिक सहायता कुरिन्थियों से प्राप्त होगी।
- source_word: ἡμεῖς
  choice: हम
  rationale: मूल में स्पष्ट सर्वनाम प्रेरितों के परिश्रम और उनके उचित समर्थन के बीच बलपूर्ण संबंध बनाता है; हिन्दी में ‘हम’ इसे पर्याप्त रूप से व्यक्त करता है।
theological_decisions:
- issue: πνευματικὰ और σαρκικὰ के बीच विरोध का अर्थ
  choice: आत्मिक सेवकाई के लाभों के विपरीत भौतिक या शारीरिक जीवन की सहायता
  alternative: ‘शारीरिक वस्तुएँ’ को नैतिक रूप से पापमय या देह-संबंधी व्यवहार समझना
  rationale: आस-पास के संदर्भ में पौलुस प्रेरितों के भौतिक निर्वाह पाने के अधिकार का समर्थन कर रहा है। इसलिए विरोध पवित्र और पापमय आचरण के बीच नहीं, बल्कि आत्मिक सेवकाई और सांसारिक निर्वाह के बीच है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली। ‘बोई हैं’ और ‘फसल काटें’ से मूल कृषि-रूपक सुरक्षित रखा गया है; ‘भौतिक’ नैतिक रूप से नकारात्मक अर्थ से बचाता है।
