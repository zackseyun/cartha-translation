source:
  edition: SBLGNT
  text: μὴ οὐκ ἔχομεν ἐξουσίαν ἀδελφὴν γυναῖκα περιάγειν, ὡς καὶ οἱ λοιποὶ ἀπόστολοι καὶ οἱ ἀδελφοὶ τοῦ κυρίου καὶ Κηφᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/005.yaml
  text: Do we not have the right to take along a sister as a wife[a], as also the rest of the apostles and the brothers of the Lord and Cephas?
translation:
  language: hi
  text: क्या हमें यह अधिकार नहीं कि हम एक विश्वासी पत्नी[a] को अपने साथ ले जाएँ, जैसा कि बाकी प्रेरित, प्रभु के भाई और कैफा भी करते हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एक बहन, अर्थात् पत्नी”—यानी ऐसी पत्नी जो विश्वास में बहन भी हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यहाँ पौलुस सामान्य सत्ता नहीं, बल्कि प्रेरित के रूप में प्राप्त वैध अधिकार की बात कर रहा है।
- source_word: ἀδελφὴν γυναῖκα
  choice: एक विश्वासी पत्नी
  rationale: दोनों कर्मकारक संज्ञाएँ स्वाभाविक रूप से ऐसी पत्नी को सूचित करती हैं जो विश्वास में बहन भी है। मुख्य पाठ में सहज हिन्दी रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: περιάγειν
  choice: अपने साथ ले जाएँ
  rationale: संदर्भ सेवकाई की यात्राओं में पत्नी को साथ ले जाने का है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὡς καὶ
  choice: जैसा कि ... भी
  rationale: यह तुलनात्मक और योगात्मक, दोनों भावों को बनाए रखता है।
- source_word: οἱ λοιποὶ ἀπόστολοι
  choice: बाकी प्रेरित
  rationale: λοιποί उसी समूह के शेष सदस्यों की ओर संकेत करता है।
- source_word: οἱ ἀδελφοὶ τοῦ κυρίου
  choice: प्रभु के भाई
  rationale: यूनानी पदबंध को सीधे रखा गया है और उनके सटीक पारिवारिक संबंध पर बाद के धर्मवैज्ञानिक विवाद का निर्णय नहीं किया गया।
- source_word: Κηφᾶς
  choice: कैफा
  rationale: मूल पाठ में प्रयुक्त अरामी नाम के यूनानी लिप्यंतरण को हिन्दी में सुरक्षित रखा गया है, उसे पतरस से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ‘प्रभु के भाई’ का सटीक संबंध
  choice: पदबंध को सीधे ‘प्रभु के भाई’ अनूदित करना
  alternative: यीशु के सगे भाई; सौतेले भाई; निकट संबंधी
  rationale: मूल यूनानी स्वयं बाद के मतभेदों का निर्णायक समाधान नहीं करता, इसलिए अनुवाद उस तनाव को खुला रखता है।
- issue: ἀδελφὴν γυναῖκα का अर्थ
  choice: मुख्य पाठ में ‘एक विश्वासी पत्नी’
  alternative: ‘एक बहन को पत्नी के रूप में’
  rationale: संदर्भ में सबसे स्वाभाविक अर्थ ऐसी पत्नी है जो विश्वास में बहन है। शाब्दिक संरचना को पादटिप्पणी में सुरक्षित रखा गया है ताकि मूल अभिव्यक्ति की विशेषता दिखाई दे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रश्न की अलंकारिक शक्ति तथा पौलुस और बरनबास के निहित बहुवचन ‘हमें’ को सुरक्षित रखा गया है। ‘कैफा’ मूल पाठ के नामरूप का अनुसरण करता है।
