source:
  edition: SBLGNT
  text: ἢ δι’ ἡμᾶς πάντως λέγει; δι’ ἡμᾶς γὰρ ἐγράφη, ὅτι ⸂ὀφείλει ἐπ’ ἐλπίδι⸃ ὁ ἀροτριῶν ἀροτριᾶν, καὶ ὁ ἀλοῶν ⸂ἐπ’ ἐλπίδι τοῦ μετέχειν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/010.yaml
  text: Or is he speaking entirely for our sake? Yes[a], it was written for our sake, because the one who plows ought to plow in hope[b], and the one who threshes ought to thresh in hope of sharing.
translation:
  language: hi
  text: या क्या वह यह बात पूरी तरह हमारे ही लिए कहता है?[a] हाँ, यह हमारे लिए ही लिखा गया, क्योंकि हल चलानेवाले को आशा के साथ हल चलाना चाहिए, और दाँवनेवाले को हिस्सा पाने की आशा के साथ दाँवना चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निश्चय ही,” “अवश्य” या “सचमुच।” यूनानी क्रियाविशेषण आलंकारिक प्रश्न पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντως
  choice: निश्चय ही
  rationale: यह क्रियाविशेषण आलंकारिक प्रश्न को बल देता है। ‘निश्चय ही’ यूनानी के निश्चयात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह आग्रह किए कि अर्थ केवल ‘पूरी तरह’ ही है।
- source_word: δι’ ἡμᾶς
  choice: हमारे लिए
  rationale: διά के साथ कर्मकारक यहाँ हित अथवा प्रयोजन का भाव देता है। ‘हमारे लिए’ सहज हिन्दी में उस लाभार्थक अर्थ को व्यक्त करता है।
- source_word: ἐγράφη
  choice: लिखा गया
  rationale: यूनानी अओरिस्ट कर्मवाच्य को हिन्दी का सामान्य भूतकालीन कर्मवाच्य ठीक रूप से व्यक्त करता है।
- source_word: ὀφείλει
  choice: चाहिए
  rationale: यह दायित्व अथवा उचित अपेक्षा का भाव रखता है। ‘चाहिए’ इस प्रसंग में स्वाभाविक है और ‘अवश्य’ की अपेक्षा अनावश्यक कठोरता से बचता है।
- source_word: ἐπ’ ἐλπίδι
  choice: आशा के साथ
  rationale: यह श्रम करने की रीति और उससे जुड़ी अपेक्षा दोनों बताता है। ‘आशा के साथ’ दोनों कृषि-संबंधी खंडों में स्वाभाविक रूप से बैठता है।
- source_word: ὁ ἀροτριῶν ἀροτριᾶν
  choice: हल चलानेवाले को ... हल चलाना
  rationale: कर्तृवाचक कृदंत और अनंत क्रिया के समान मूल को दोहराते हुए सामान्य श्रमिक का अर्थ सुरक्षित रखा गया है।
- source_word: ὁ ἀλοῶν
  choice: दाँवनेवाले
  rationale: ἀλοάω का कृषि-संदर्भ में अर्थ अनाज को दाँवना है। यह ‘हल चलानेवाले’ के साथ समानांतर सामान्य कर्ता को दर्शाता है।
- source_word: τοῦ μετέχειν
  choice: हिस्सा पाने
  rationale: μετέχω किसी वस्तु में भाग लेने या हिस्सा पाने को दर्शाता है। यूनानी में उसका कर्म व्यक्त नहीं है, इसलिए हिन्दी में भी ‘हिस्सा पाने’ कहकर उस खुलापन को बनाए रखा गया है।
theological_decisions:
- issue: πάντως का बल और आलंकारिक प्रश्न का संबंध
  choice: ‘निश्चय ही’ को प्रश्न के भीतर रखा और उत्तरस्वरूप ‘हाँ’ अलग रखा
  alternative: ‘पूरी तरह हमारे लिए’ अथवा बिना ‘हाँ’ के केवल प्रश्न
  rationale: यूनानी में πάντως प्रश्न को बल देता है, जबकि अगले γὰρ-वाक्य से सकारात्मक निष्कर्ष स्पष्ट होता है। हिन्दी में अलग ‘हाँ’ तर्क की दिशा साफ करता है; फुटनोट मूल की संभावित संरचना बताता है।
- issue: μετέχειν का अव्यक्त कर्म
  choice: किस वस्तु में हिस्सा, इसे स्पष्ट नहीं किया
  alternative: ‘फसल में हिस्सा पाने’
  rationale: कृषि-संदर्भ से फसल या उपज समझी जा सकती है, पर यूनानी पाठ कर्म को अनिर्दिष्ट छोड़ता है। ‘हिस्सा पाने’ मूल की अस्पष्टता और पौलुस के व्यापक तर्क—श्रम के फल में भाग—दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। कृषि-शब्दावली में ‘हल चलाना’ और ‘दाँवना’ मूल चित्र को बनाए रखते हैं। ‘हमारे लिए ही’ में ‘ही’ लाभार्थक बल को व्यक्त करता है।
