revisions:
- from: क्योंकि यदि मैं सुसमाचार सुनाता हूँ, तो मेरे पास घमण्ड करने का कोई आधार नहीं; क्योंकि यह अनिवार्यता मुझ पर रखी गई है। यदि मैं सुसमाचार न सुनाऊँ, तो मुझ पर हाय!
  to: क्योंकि यदि मैं सुसमाचार सुनाता हूँ, तो घमण्ड करने का मेरे पास कोई आधार नहीं है, क्योंकि मुझ पर एक बाध्यता आ पड़ी है। हाय मुझ पर, यदि मैं सुसमाचार न सुनाऊँ!
  rationale: The revision makes only safe linguistic and syntactic corrections. It preserves the repeated rendering of εὐαγγελίζομαι, the distinction between a basis for boasting and boasting itself, the unspecified imposed necessity, and the grave conditional exclamation of οὐαί. No footnote is required because the wording does not depend on a disputed textual or interpretive decision.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:46:08Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the conditional proclamation, the absence of a basis for boasting, and the imposed necessity. Its final clause, however, weakens the Greek exclamatory construction οὐαὶ γάρ μοί ἐστιν: “तो मुझ पर हाय!” is not natural Hindi and does not clearly retain the conditional relation. The revision keeps the solemn ‘woe to me’ force without specifying the source of the necessity.'
  naturalness: “यह अनिवार्यता मुझ पर रखी गई है” is intelligible but somewhat bureaucratic and mechanically passive. “मुझ पर एक बाध्यता आ पड़ी है” is idiomatic modern standard Hindi and preserves the sense of a pressing, imposed necessity. “हाय मुझ पर, यदि…” is a natural solemn, biblical-register exclamation.
  terminology: “सुसमाचार सुनाना” consistently renders εὐαγγελίζομαι and is suitable in the stated register. “घमण्ड करने का … आधार” adequately renders καύχημα as a ground for boasting. “बाध्यता” represents ἀνάγκη without importing a specific theological cause.
  issues:
  - severity: medium
    issue: The final wording “यदि मैं सुसमाचार न सुनाऊँ, तो मुझ पर हाय!” is syntactically awkward and reverses the Greek clause’s emphatic exclamatory order.
    rationale: οὐαὶ γάρ μοί ἐστιν ἐὰν μὴ εὐαγγελίσωμαι is best represented by a direct exclamation, “हाय मुझ पर, यदि मैं…,” retaining both the warning/distress and the condition.
  - severity: low
    issue: “यह अनिवार्यता मुझ पर रखी गई है” is stiff Hindi.
    rationale: The Greek says that necessity presses upon Paul; “मुझ पर एक बाध्यता आ पड़ी है” communicates that burden more naturally while leaving its source unspecified.
  revised_text: क्योंकि यदि मैं सुसमाचार सुनाता हूँ, तो घमण्ड करने का मेरे पास कोई आधार नहीं है, क्योंकि मुझ पर एक बाध्यता आ पड़ी है। हाय मुझ पर, यदि मैं सुसमाचार न सुनाऊँ!
  revised_footnotes: []
  revision_rationale: The revision makes only safe linguistic and syntactic corrections. It preserves the repeated rendering of εὐαγγελίζομαι, the distinction between a basis for boasting and boasting itself, the unspecified imposed necessity, and the grave conditional exclamation of οὐαί. No footnote is required because the wording does not depend on a disputed textual or interpretive decision.
