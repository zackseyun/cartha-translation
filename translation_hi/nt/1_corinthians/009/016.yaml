id: 1CO.9.16
reference: 1 Corinthians 9:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν γὰρ εὐαγγελίζωμαι, οὐκ ἔστιν μοι καύχημα, ἀνάγκη γάρ μοι ἐπίκειται· οὐαὶ ⸀γάρ μοί ἐστιν ἐὰν μὴ ⸀εὐαγγελίσωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/016.yaml
  text: For if I preach the gospel[a], I have no ground for boasting, for necessity is laid upon me[b]. For woe is me if I do not preach the gospel.
translation:
  language: hi
  text: क्योंकि यदि मैं सुसमाचार सुनाता हूँ, तो घमण्ड करने का मेरे पास कोई आधार नहीं है, क्योंकि मुझ पर एक बाध्यता आ पड़ी है। हाय मुझ पर, यदि मैं सुसमाचार न सुनाऊँ!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐαγγελίζωμαι / εὐαγγελίσωμαι
  choice: सुसमाचार सुनाता हूँ / सुसमाचार न सुनाऊँ
  rationale: क्रिया का अर्थ शुभ समाचार घोषित करना है। पौलुस के प्रयोग में निहित संदेश सुसमाचार है; ‘सुसमाचार सुनाना’ आधुनिक हिन्दी में स्वाभाविक है और दोनों प्रयोगों में घोषणात्मक बल बनाए रखता है।
- source_word: καύχημα
  choice: घमण्ड करने का कोई आधार
  rationale: यह शब्द केवल घमण्ड करने की क्रिया नहीं, बल्कि घमण्ड का कारण या आधार दर्शाता है। यह अनुवाद स्पष्ट करता है कि सुसमाचार सुनाना पौलुस के लिए आत्म-प्रशंसा का आधार नहीं है।
- source_word: ἀνάγκη
  choice: अनिवार्यता
  rationale: यह आरोपित आवश्यकता या बाध्यता का भाव रखता है। ‘अनिवार्यता’ स्रोत बताए बिना कर्तव्य की अपरिहार्यता बनाए रखती है।
- source_word: ἐπίκειται
  choice: मुझ पर रखी गई है
  rationale: क्रिया किसी बात के व्यक्ति पर आ पड़ने या आरोपित होने का भाव देती है। यह वाक्यांश भार और बाध्यता दोनों व्यक्त करता है।
- source_word: οὐαί
  choice: हाय
  rationale: ‘हाय’ विनाश, दण्ड या गंभीर संकट की चेतावनी देने वाली गंभीर उद्गारात्मक शैली को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐὰν μὴ
  choice: यदि ... न
  rationale: यह शर्त को सीधे और स्पष्ट रूप से व्यक्त करता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: दोनों स्थानों पर व्याख्यात्मक संबंध को स्पष्ट करता है; हिन्दी में लगातार ‘क्योंकि’ रखने से पौलुस के तर्क की कड़ी बनी रहती है।
theological_decisions:
- issue: सुसमाचार सुनाने की पौलुस की बाध्यता का स्वरूप
  choice: ‘यह अनिवार्यता मुझ पर रखी गई है’ कहकर आरोपित आवश्यकता व्यक्त की गई, पर उसका स्रोत स्पष्ट नहीं किया गया।
  alternative: ‘मैं ऐसा करने को विवश हूँ’ अथवा ‘परमेश्वर ने मुझे यह दायित्व सौंपा है।’
  rationale: यूनानी पाठ बाध्यता को स्पष्ट करता है, पर इसी पद में यह नहीं बताता कि उसका स्रोत दिव्य बुलाहट, आंतरिक विवशता या बाहरी परिस्थिति है। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गंभीर और सार्वजनिक पाठ के योग्य है। ‘सुसमाचार सुनाना’ कलीसियाई परिचय और सामान्य बोध के बीच संतुलन रखता है। मूल पद में कोई आवश्यक पाठगत या अर्थगत पादटिप्पणी नहीं जोड़ी गई।
