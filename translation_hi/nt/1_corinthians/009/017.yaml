id: 1CO.9.17
reference: 1 Corinthians 9:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ γὰρ ἑκὼν τοῦτο πράσσω, μισθὸν ἔχω· εἰ δὲ ἄκων, οἰκονομίαν πεπίστευμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/017.yaml
  text: For if I do this willingly[a], I have a reward; but if unwillingly, I have been entrusted with a stewardship.
translation:
  language: hi
  text: क्योंकि यदि मैं यह स्वेच्छा से करता हूँ, तो मेरे लिए प्रतिफल है; पर यदि अनिच्छा से करता हूँ, तो मुझे भण्डारीपन[a] सौंपा गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे एक कार्यभार सौंपा गया है।”
    reason: οἰκονομία सौंपी गई जिम्मेदारी, प्रबंधन या कार्यभार का अर्थ भी दे सकता है। यह विकल्प ‘भण्डारीपन’ के रूपक को कम स्पष्ट करता है, पर प्रसंगगत अर्थ को सामने लाता है।
lexical_decisions:
- source_word: ἑκὼν
  choice: स्वेच्छा से
  rationale: यह क्रियाविशेषणीय प्रयोग अपनी इच्छा से या स्वेच्छा से कार्य करने को व्यक्त करता है और ἄκων के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: τοῦτο πράσσω
  choice: मैं यह करता हूँ
  rationale: यह निकटवर्ती प्रसंग में सुसमाचार सुनाने के कार्य को व्यापक रूप से संदर्भित करता है; अनुवाद मूल की अनिर्दिष्टता को बनाए रखता है।
- source_word: μισθὸν
  choice: प्रतिफल
  rationale: यहाँ शब्द केवल वेतन नहीं, बल्कि सेवा के बदले मिलने वाले फल या पुरस्कार का व्यापक अर्थ देता है; ‘प्रतिफल’ दोनों संभावनाओं को स्वाभाविक ढंग से समेटता है।
- source_word: ἄκων
  choice: अनिच्छा से
  rationale: यह ἑκὼν का सीधा विलोम है और बिना अतिरिक्त भावनात्मक अर्थ जोड़े इच्छा के अभाव को व्यक्त करता है।
- source_word: οἰκονομίαν
  choice: भण्डारी का दायित्व
  rationale: यह सौंपी गई व्यवस्था या प्रबंधन की जिम्मेदारी को दर्शाता है। ‘भण्डारी का दायित्व’ सौंपे हुए उत्तरदायित्व के रूपक को बनाए रखता है और सामान्य पाठक के लिए अर्थपूर्ण है।
- source_word: πεπίστευμαι
  choice: मुझे ... सौंपा गया है
  rationale: पूर्णकालिक कर्मवाच्य रूप किसी जिम्मेदारी के सौंपे जाने और उसकी वर्तमान स्थायी अवस्था—दोनों को व्यक्त करता है।
theological_decisions:
- issue: दूसरे उपवाक्य में पौलुस की सेवकाई का स्वरूप
  choice: अनिच्छा की स्थिति में भी पौलुस अपने ऊपर सौंपे गए भण्डारी के दायित्व के अधीन है।
  alternative: यदि वह अनिच्छा से सेवा करता है, तो उसे प्रतिफल के स्थान पर केवल एक अनिवार्य कार्यभार मिला है।
  rationale: यूनानी पाठ ‘मेरे लिए प्रतिफल है’ और ‘मुझे भण्डारी का दायित्व सौंपा गया है’ के बीच तनाव रखता है। अनुवाद इस तनाव को बनाए रखता है और सेवकाई या बुलाहट के किसी विशिष्ट साम्प्रदायिक सिद्धान्त को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘स्वेच्छा से/अनिच्छा से’ मूल विरोध को स्पष्ट रखता है। ‘भण्डारी का दायित्व’ बाइबलीय रूपक को बचाते हुए उसके अर्थ को ‘दायित्व’ से स्पष्ट करता है। पादटिप्पणी-चिह्न उस पदबंध के बाद रखा गया है जिससे वैकल्पिक अनुवाद वास्तव में संबंधित है।
