  edition: SBLGNT
  text: οὕτως καὶ ὁ κύριος διέταξεν τοῖς τὸ εὐαγγέλιον καταγγέλλουσιν ἐκ τοῦ εὐαγγελίου ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/014.yaml
  text: In the same way[b][a], the Lord also commanded that those who proclaim the gospel should live from the gospel.
translation:
  language: hi
  text: इसी प्रकार प्रभु ने भी आदेश दिया कि जो सुसमाचार की घोषणा करते हैं, वे सुसमाचार से जीवन-निर्वाह करें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सुसमाचार से जिएँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: इसी प्रकार
  rationale: यह पिछले उदाहरणों के साथ समानता को स्पष्ट करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: καὶ
  choice: भी
  rationale: '‘प्रभु’ के साथ जुड़ी इसकी योगात्मक भूमिका को व्यक्त करता है: पहले दिए गए उदाहरणों के अतिरिक्त प्रभु ने भी ऐसा आदेश दिया।'
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: κύριος का प्रचलित और प्रसंगानुकूल अनुवाद है; पौलुस के इस कथन में संकेत स्वाभाविक रूप से प्रभु यीशु की ओर है, पर मूल पाठ की तरह नाम स्पष्ट रूप से नहीं जोड़ा गया।
- source_word: διέταξεν
  choice: आदेश दिया
  rationale: यह क्रिया यहाँ अधिकारपूर्ण निर्देश को प्रकट करती है, केवल व्यवस्था करने को नहीं।
- source_word: τοῖς ... καταγγέλλουσιν
  choice: जो ... की घोषणा करते हैं
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत को स्वाभाविक हिन्दी वाक्यांश में रखा गया है; ‘घोषणा’ καταγγέλλω के सार्वजनिक रूप से सुनाने के भाव को बनाए रखती है।
- source_word: τὸ εὐαγγέλιον
  choice: सुसमाचार
  rationale: यह पौलुस के प्रसंग में स्थापित, सुबोध और अर्थपूर्ण हिन्दी पद है।
- source_word: ἐκ τοῦ εὐαγγελίου
  choice: सुसमाचार से
  rationale: ἐκ को स्रोत के अर्थ में सीधे व्यक्त करता है और मूल की संक्षिप्त अभिव्यक्ति बनाए रखता है।
- source_word: ζῆν
  choice: जीवन-निर्वाह करें
  rationale: आस-पास का प्रसंग सेवकों की भौतिक सहायता से संबंधित है; यह हिन्दी में उस आशय को स्वाभाविक रूप से व्यक्त करता है। शाब्दिक रूप को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ‘प्रभु’ का संदर्भ
  choice: मूल पाठ के अनुसार केवल ‘प्रभु’; प्रसंग में संभवतः प्रभु यीशु
  alternative: ‘प्रभु यीशु’ को स्पष्ट रूप से जोड़ना, अथवा इसे सामान्य ईश्वरीय संबोधन मानना
  rationale: 1 कुरिन्थियों और इस तर्क के प्रसंग में पौलुस संभवतः यीशु की शिक्षा का उल्लेख करता है, फिर भी अनुवाद मूल में अनुपस्थित ‘यीशु’ शब्द नहीं जोड़ता।
- issue: ‘सुसमाचार से जीने’ का आशय
  choice: सुसमाचार की सेवा से जीवन-निर्वाह के लिए भौतिक सहायता पाना
  alternative: सुसमाचार से आत्मिक जीवन पाना
  rationale: निकटवर्ती प्रसंग प्रचारकों के भरण-पोषण के अधिकार पर केंद्रित है; इसलिए ‘जीवन-निर्वाह’ प्रसंगगत अर्थ स्पष्ट करता है, जबकि पादटिप्पणी स्रोत की अधिक शाब्दिक अभिव्यक्ति सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘घोषणा करते हैं’ प्रचार के सार्वजनिक स्वरूप को बनाए रखता है, और ‘जीवन-निर्वाह’ प्रसंग में निहित भौतिक सहायता को स्वाभाविक हिन्दी में व्यक्त करता है।
