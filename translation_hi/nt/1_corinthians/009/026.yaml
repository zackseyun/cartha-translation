- source_word: ἀδήλως
  choice: बिना लक्ष्य के
  rationale: दौड़ के संदर्भ में अस्पष्ट या अनिश्चित दिशा के बजाय निश्चित लक्ष्य के अभाव का भाव सहजता से व्यक्त करता है।
- source_word: πυκτεύω
  choice: मुक्केबाज़ी करता हूँ
  rationale: यह सामान्य लड़ाई नहीं, विशेष रूप से मुक्केबाज़ी को सूचित करता है।
- source_word: ἀέρα δέρων
  choice: हवा को ... पीट रहा
  rationale: निष्फल प्रहार का मूल चित्र बनाए रखता है और हिन्दी में समझने योग्य है।
