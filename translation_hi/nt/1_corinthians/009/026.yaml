  rationale: यह पिछले पदों के खेल-संबंधी चित्रण से पौलुस के अपने जीवन पर निकाले गए निष्कर्ष की ओर संक्रमण दिखाता है।
- source_word: οὕτως
  choice: इस तरह
  rationale: दोनों बार आए रीति-सूचक शब्द की पुनरावृत्ति बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τρέχω
  choice: मैं ... दौड़ता हूँ
