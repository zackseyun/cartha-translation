source:
  edition: SBLGNT
  text: εἰ ἄλλοις οὐκ εἰμὶ ἀπόστολος, ἀλλά γε ὑμῖν εἰμι, ἡ γὰρ σφραγίς ⸂μου τῆς⸃ ἀποστολῆς ὑμεῖς ἐστε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/002.yaml
  text: If I am not an apostle to others[a], yet I certainly am to you, for you are the seal of my apostleship in the Lord.
translation:
  language: hi
  text: यदि मैं दूसरों के लिए प्रेरित नहीं हूँ, तो भी तुम्हारे लिए अवश्य हूँ, क्योंकि प्रभु में तुम मेरे प्रेरित-पद की मुहर हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστολος
  choice: प्रेरित
  rationale: पौलुस अपने मान्य ईश्वरीय बुलावे और अधिकार की बात कर रहा है; इसलिए तकनीकी अर्थ रखने वाला प्रचलित शब्द ‘प्रेरित’ उपयुक्त है, केवल सामान्य ‘संदेशवाहक’ नहीं।
- source_word: ἀλλά γε
  choice: तो भी ... अवश्य हूँ
  rationale: यह अभिव्यक्ति विरोध के साथ विशेष बल भी देती है; हिंदी में यह विन्यास दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: σφραγίς
  choice: मुहर
  rationale: 'मूल रूपक को बनाए रखता है: मुहर किसी बात की प्रामाणिकता की पुष्टि करती है।'
- source_word: ἀποστολή
  choice: प्रेरिताई
  rationale: यहाँ शब्द पौलुस के प्रेरितीय पद और दायित्व को सूचित करता है; ‘प्रेरिताई’ उसी तकनीकी अर्थ को संक्षेप में बनाए रखता है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: पौलुस की विशिष्ट और अर्थगर्भित अभिव्यक्ति को ज्यों का त्यों रखता है तथा इसे केवल ‘प्रभु के द्वारा’ कहकर साधन के अर्थ तक सीमित नहीं करता।
- source_word: ἄλλοις
  choice: दूसरों के लिए
  rationale: दत्तिव का संबंधपरक भाव हिंदी में ‘दूसरों के लिए’ से स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: पौलुस के प्रेरित होने के दावे का आशय
  choice: पौलुस यह संभावना सामने रखता है कि दूसरे उसके प्रेरित होने को स्वीकार न करें, पर कुरिन्थियों का प्रभु में अस्तित्व उसकी प्रेरिताई की प्रामाणिकता की पुष्टि करता है।
  alternative: पौलुस वास्तव में केवल कुरिन्थियों के लिए सीमित अर्थ में प्रेरित है और दूसरों के लिए बिल्कुल प्रेरित नहीं है।
  rationale: शर्तवाचक और विरोधात्मक वाक्यरचना उसके प्रेरितीय अधिकार का आलंकारिक प्रतिरक्षण करती है; इसका उद्देश्य उसके कार्यक्षेत्र को सचमुच एक कलीसिया तक सीमित करना नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और कलीसियाई संदर्भ में परिचित शब्दावली अपनाई गई है। ‘प्रभु में’ की पौलुसी अर्थगर्भिता और ‘मुहर’ का मूल रूपक सुरक्षित रखा गया है।
