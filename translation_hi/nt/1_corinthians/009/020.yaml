source:
  edition: SBLGNT
  text: καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, ⸂μὴ ὢν αὐτὸς ὑπὸ νόμον⸃, ἵνα τοὺς ὑπὸ νόμον κερδήσω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/020.yaml
  text: And to the Jews I became as a Jew[a], so that I might win Jews; to those under the law[b], as under the law—though I myself am not under the law—so that I might win those under the law.
translation:
  language: hi
  text: और यहूदियों के लिए मैं यहूदी के समान बन गया, ताकि यहूदियों को जीत सकूँ[a]। जो व्यवस्था[b] के अधीन हैं, उनके लिए मैं व्यवस्था के अधीन व्यक्ति के समान बन गया—यद्यपि मैं स्वयं व्यवस्था के अधीन नहीं हूँ—ताकि व्यवस्था के अधीन लोगों को जीत सकूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्राप्त कर सकूँ’; इस क्रिया का अर्थ लाभ पाना, प्राप्त करना या किसी को जीत लेना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘व्यवस्था’ से सम्भवतः मूसा की व्यवस्था अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐγενόμην
  choice: मैं ... बन गया
  rationale: यह रूप अलग-अलग समूहों के प्रति पौलुस द्वारा उनके अनुरूप व्यवहार अपनाने को व्यक्त करता है; ‘बन गया’ मूल की सीधी और स्वाभाविक अभिव्यक्ति है।
- source_word: τοῖς Ἰουδαίοις ... ὡς Ἰουδαῖος
  choice: यहूदियों के लिए ... यहूदी के समान
  rationale: ‘के समान’ ὡς की तुलनात्मक शक्ति बनाए रखता है और यह संकेत नहीं देता कि पौलुस जातीय रूप से यहूदी नहीं था।
- source_word: ἵνα ... κερδήσω
  choice: ताकि ... जीत सकूँ
  rationale: κερδαίνω का मूल अर्थ लाभ या प्राप्ति है, पर यहाँ लोगों को अपने पक्ष में लाने का मिशनरी भाव है; ‘जीत सकूँ’ हिन्दी में स्वाभाविक है, जबकि विकल्प पादटिप्पणी में दिया गया है।
- source_word: τοῖς ὑπὸ νόμον
  choice: जो व्यवस्था के अधीन हैं
  rationale: यह पदबंध व्यक्तियों के एक समूह को दर्शाता है। ‘व्यवस्था’ प्रसंग में पहचानी हुई धार्मिक-कानूनी व्यवस्था को व्यक्त करती है।
- source_word: ὡς ὑπὸ νόμον
  choice: व्यवस्था के अधीन व्यक्ति के समान
  rationale: हिन्दी में मूल यूनानी की संक्षिप्त तुलना को स्पष्ट और स्वाभाविक बनाने के लिए ‘व्यक्ति’ जोड़ा गया है; इससे वास्तविक अधीनता का दावा नहीं होता।
- source_word: μὴ ὢν αὐτὸς ὑπὸ νόμον
  choice: यद्यपि मैं स्वयं व्यवस्था के अधीन नहीं हूँ
  rationale: वर्तमान कृदन्त पौलुस की उसी समय की स्थिति बताता है; ‘यद्यपि’ विरोधाभासी टिप्पणी को स्पष्ट करता है और ‘स्वयं’ αὐτός के बल को सुरक्षित रखता है।
- source_word: νόμος
  choice: व्यवस्था
  rationale: हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ νόμος के लिए प्रतिष्ठित और गरिमापूर्ण शब्द है। मुख्य पाठ व्यापक अभिव्यक्ति बनाए रखता है; मूसा की व्यवस्था होने की संभाव्यता पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: पौलुस के ‘व्यवस्था के अधीन नहीं’ होने का अर्थ
  choice: 'कथन को बिना अतिरिक्त व्याख्यात्मक सीमा के सीधे रखा गया है: ‘यद्यपि मैं स्वयं व्यवस्था के अधीन नहीं हूँ।’'
  alternative: ‘यद्यपि मैं स्वयं मूसा की व्यवस्था के अधीन नहीं हूँ’ अथवा अगले पद से भाषा लेकर इसे ‘मसीह की व्यवस्था के अधीन’ के रूप में समन्वित करना।
  rationale: इस पद का यूनानी पाठ केवल पौलुस के व्यवस्था के अधीन न होने की बात कहता है। मुख्य पाठ में ‘मूसा की’ जोड़ना या अगले पद से स्पष्टीकरण लाना मूल की धार्मिक वैचारिक खिंचाव को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। पुनरावृत्ति मूल की आलंकारिक संरचना को बनाए रखती है।
