id: 1CO.9.18
reference: 1 Corinthians 9:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τίς οὖν ⸀μού ἐστιν ὁ μισθός; ἵνα εὐαγγελιζόμενος ἀδάπανον θήσω τὸ ⸀εὐαγγέλιον, εἰς τὸ μὴ καταχρήσασθαι τῇ ἐξουσίᾳ μου ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/018.yaml
  text: What then is my reward? That in preaching the good news I may present the good news free of charge[b][a], so as not to make full use of my right in the good news.
translation:
  language: hi
  text: तो फिर मेरा प्रतिफल क्या है? यही कि सुसमाचार[a] सुनाते हुए मैं उसे निःशुल्क प्रस्तुत करूँ, ताकि सुसमाचार के काम में अपने अधिकार का पूरा उपयोग न करूँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुभ समाचार”; इस पद में जहाँ-जहाँ “सुसमाचार” आया है।
    reason: lexical_alternative
  - marker: b
    text: या, “ताकि सुसमाचार के संबंध में अपने अधिकार का पूरा उपयोग न करूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθός
  choice: प्रतिफल
  rationale: यहाँ पौलुस सेवाकार्य के बदले मिलने वाले वेतन मात्र की नहीं, बल्कि अपने विडंबनापूर्ण ‘प्रतिफल’ की बात करता है—कि वह बिना मूल्य लिए सुसमाचार सुनाए। ‘प्रतिफल’ इस व्यापक अर्थ और आलंकारिक प्रश्न दोनों को व्यक्त करता है।
- source_word: εὐαγγελιζόμενος
  choice: सुसमाचार सुनाते हुए
  rationale: वर्तमानकालिक कृदंत मुख्य क्रिया के साथ-साथ चल रही गतिविधि बताता है। यह रूप हिन्दी में स्वाभाविक है और यूनानी के क्रियात्मक भाव को बनाए रखता है।
- source_word: ἀδάπανον
  choice: निःशुल्क
  rationale: इसका अर्थ बिना खर्च या मूल्य के है। ‘निःशुल्क’ संक्षेप में स्पष्ट करता है कि पौलुस सुनने वालों से भुगतान नहीं लेता।
- source_word: θήσω τὸ εὐαγγέλιον
  choice: उसे ... प्रस्तुत करूँ
  rationale: शाब्दिक अर्थ ‘सुसमाचार को रखूँ’ है, पर प्रसंग में भाव उसे लोगों के सामने बिना मूल्य प्रस्तुत करने का है। सर्वनाम अनावश्यक पुनरावृत्ति से बचते हुए संदर्भ स्पष्ट रखता है।
- source_word: εὐαγγέλιον
  choice: सुसमाचार
  rationale: ‘सुसमाचार’ आधुनिक हिन्दी में स्थापित और समझ में आने वाला पद है तथा मूल शब्द के ‘शुभ समाचार’ अर्थ को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: καταχρήσασθαι
  choice: पूरा उपयोग करना
  rationale: यह क्रिया किसी वस्तु या अधिकार का पूर्ण उपयोग करने का भाव दे सकती है। यहाँ वैध अधिकार के दुरुपयोग का आरोप नहीं, बल्कि उसे पूरी तरह काम में न लाने की बात है।
- source_word: ἐξουσίᾳ
  choice: अधिकार
  rationale: अध्याय के प्रसंग में यह सुसमाचार की सेवा के लिए भौतिक सहायता पाने के पौलुस के वैध हक को सूचित करता है; ‘अधिकार’ इसे ‘सत्ता’ से अधिक स्पष्ट रूप में व्यक्त करता है।
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: सुसमाचार के काम में
  rationale: यूनानी वाक्यांश का आशय सुसमाचार से संबंधित सेवाकार्य हो सकता है। हिन्दी में यह स्वाभाविक है; अधिक शाब्दिक और व्यापक विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: इस प्रसंग में पौलुस की ἐξουσία का स्वरूप
  choice: सुसमाचार के सेवाकार्य में सहायता पाने का वैध अधिकार, जिसका पौलुस स्वेच्छा से पूरा उपयोग नहीं करता
  alternative: सामान्य प्रेरितीय अधिकार; अथवा अधिकार का अनुचित लाभ उठाना
  rationale: 1 कुरिन्थियों 9 का निकटवर्ती प्रसंग सेवाकार्य के लिए भौतिक सहायता पाने के अधिकार पर केंद्रित है। इसलिए अनुवाद वैध अधिकार और उसके स्वैच्छिक त्याग को दर्शाता है, न कि शोषण या दुरुपयोग को।
- issue: εὐαγγέλιον का हिन्दी रूप
  choice: सुसमाचार
  alternative: शुभ समाचार
  rationale: दोनों मूल अर्थ व्यक्त करते हैं। ‘सुसमाचार’ हिन्दी मसीही प्रयोग में स्थापित, संक्षिप्त और सामान्य पाठकों के लिए बोधगम्य है; वैकल्पिक पारदर्शी रूप पादटिप्पणी में दिया गया है।
- issue: ἐν τῷ εὐαγγελίῳ की अर्थ-सीमा
  choice: सुसमाचार के काम में
  alternative: सुसमाचार के संबंध में; सुसमाचार में
  rationale: प्रसंग सेवाकार्य की ओर संकेत करता है, पर यूनानी पदबंध संक्षिप्त और व्यापक है। मुख्य पाठ में स्वाभाविक प्रसंगगत अर्थ लिया गया है और अधिक शाब्दिक विकल्प पादटिप्पणी में देकर अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। शैली सहज किंतु गरिमापूर्ण रखी गई है। ‘प्रतिफल’, ‘निःशुल्क’ और ‘अधिकार’ जैसे सामान्य औपचारिक शब्द मूल की तर्कपूर्ण और आलंकारिक शैली के अनुकूल हैं; वाक्य को अनावश्यक धार्मिक पारिभाषिकता या सांप्रदायिक व्याख्या से मुक्त रखा गया है।
