id: 1CO.9.8
reference: 1 Corinthians 9:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Μὴ κατὰ ἄνθρωπον ταῦτα λαλῶ ἢ ⸂καὶ ὁ νόμος ταῦτα οὐ⸃ λέγει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/008.yaml
  text: Am I saying these things from a merely human perspective[a], or does not the Law also say these things?
translation:
  language: hi
  text: क्या मैं ये बातें केवल मानवीय दृष्टिकोण से कह रहा हूँ[a]? या क्या व्यवस्था भी ये बातें नहीं कहती?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनुष्य के अनुसार।” इसका अर्थ “मानवीय दृष्टिकोण से” या “मानवीय आधार पर” भी हो सकता है।
    reason: मुहावरे के अधिक शाब्दिक रूप और उसके संभावित अर्थ-परास को सुरक्षित रखना।
lexical_decisions:
- source_word: Μὴ
  choice: क्या ... कह रहा हूँ?
  rationale: नकारात्मक उत्तर की अपेक्षा रखने वाले यूनानी प्रश्न को हिंदी में प्रश्न की पूरी संरचना और अगले वैकल्पिक प्रश्न के विरोध द्वारा स्वाभाविक रूप से व्यक्त किया गया है; ‘केवल’ भी इस दावे का निषेध स्पष्ट करता है।
- source_word: κατὰ ἄνθρωπον
  choice: केवल मानवीय दृष्टिकोण से
  rationale: यह मुहावरा केवल मनुष्य होने की स्थिति नहीं, बल्कि मानवीय आधार या दृष्टिकोण से बोलने का भाव देता है। ‘केवल’ अगले खंड में पवित्रशास्त्रीय प्रमाण के साथ विरोध को स्पष्ट करता है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक को बनाए रखता है और पौलुस के पिछले तर्क की ओर संकेत करता है।
- source_word: λαλῶ
  choice: कह रहा हूँ
  rationale: वर्तमान संदर्भ में पौलुस के चल रहे कथन और तर्क के लिए सहज आधुनिक हिंदी अभिव्यक्ति।
- source_word: ἢ
  choice: या
  rationale: अधिकार के वैकल्पिक आधार को प्रस्तुत करने वाले सरल विकल्पसूचक संबंध को बनाए रखता है।
- source_word: καὶ
  choice: भी
  rationale: मानवीय तर्क के अतिरिक्त व्यवस्था की गवाही को जोड़ने वाला भाव व्यक्त करता है।
- source_word: ὁ νόμος
  choice: व्यवस्था
  rationale: प्रसंग में यह मूसा की व्यवस्था की ओर संकेत करता है, जिसका अगले पद में व्यवस्थाविवरण 25:4 से उद्धरण आता है; मुख्य पाठ में प्रचलित बाइबलीय पद ‘व्यवस्था’ पर्याप्त और अनावश्यक रूप से व्याख्यात्मक नहीं है।
- source_word: οὐ λέγει
  choice: नहीं कहती?
  rationale: यूनानी का नकारात्मक आलंकारिक प्रश्न बनाए रखा गया है, जो सकारात्मक उत्तर की अपेक्षा करता है।
theological_decisions:
- issue: ‘व्यवस्था’ का संदर्भ
  choice: मूसा की व्यवस्था अथवा पवित्रशास्त्र के विधि-संग्रह का संदर्भ
  alternative: सामान्य नैतिक या कानूनी सिद्धांत
  rationale: अगला पद व्यवस्थाविवरण 25:4 उद्धृत करता है, इसलिए यहाँ सामान्य सिद्धांत नहीं बल्कि पवित्रशास्त्र की व्यवस्था अभिप्रेत है; फिर भी मुख्य पाठ में ‘मूसा की’ जोड़कर मूल से अधिक स्पष्टता नहीं थोपी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों आलंकारिक प्रश्नों की संरचना और मानवीय तर्क बनाम व्यवस्था की गवाही का तनाव सुरक्षित है।
