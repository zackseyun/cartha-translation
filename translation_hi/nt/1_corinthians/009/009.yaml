  text: ἐν γὰρ τῷ Μωϋσέως νόμῳ γέγραπται· Οὐ ⸀κημώσεις βοῦν ἀλοῶντα. μὴ τῶν βοῶν μέλει τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/009.yaml
  text: For it is written in the law of Moses[a], “You shall not muzzle an ox while it is threshing.” Is God concerned about oxen?
translation:
  language: hi
  text: क्योंकि मूसा की व्यवस्था में लिखा है, “मड़ाई करते समय बैल का मुँह न बाँधना।”[a] क्या परमेश्वर को बैलों की चिंता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनाज रौंदते हुए बैल का मुँह न बाँधना।”
    reason: ἀλοῶντα के लिए अधिक चित्रात्मक शाब्दिक विकल्प। प्राचीन मड़ाई में बैल अनाज को रौंदकर दानों को अलग करता था।
lexical_decisions:
- source_word: ἐν γὰρ τῷ Μωϋσέως νόμῳ
  choice: क्योंकि मूसा की व्यवस्था में
  rationale: ἐν के स्थानवाचक अर्थ और Μωϋσέως के संबंध को स्वाभाविक बाइबलीय हिन्दी में सुरक्षित रखता है; γάρ को ‘क्योंकि’ से व्यक्त किया गया है।
- source_word: γέγραπται
  choice: लिखा है
  rationale: पवित्रशास्त्र के उद्धरण की पूर्ण निष्क्रिय क्रिया का प्रचलित और स्वाभाविक हिन्दी रूप।
- source_word: Οὐ κημώσεις
  choice: मुँह न बाँधना
  rationale: कानूनी निषेध को संक्षिप्त आज्ञार्थक हिन्दी में व्यक्त करता है। κημόω का आशय पशु को खाने से रोकने के लिए उसका मुँह बाँधना है।
- source_word: βοῦν
  choice: बैल
  rationale: इस कृषि-कार्य के संदर्भ में काम करने वाले गोवंशीय पशु के लिए सटीक और सामान्य हिन्दी शब्द।
- source_word: ἀλοῶντα
  choice: दाँवते हुए
  rationale: वर्तमान कृदन्त की जारी क्रिया को बनाए रखता है। ‘दाँवना’ अनाज से दाना अलग करने की मड़ाई-क्रिया को संक्षेप में व्यक्त करता है; अधिक स्पष्ट रूप फुटनोट में दिया गया है।
- source_word: μὴ τῶν βοῶν μέλει τῷ θεῷ
  choice: क्या परमेश्वर को बैलों की चिंता है?
  rationale: μή से आरम्भ होने वाले आलंकारिक प्रश्न को बिना ‘केवल’ जैसे अनुल्लिखित शब्द जोड़े सीधे प्रश्न के रूप में रखता है और पौलुस के तर्क का तनाव बनाए रखता है।
theological_decisions:
- issue: पशुओं के प्रति परमेश्वर की चिंता पर पौलुस का आलंकारिक प्रश्न
  choice: क्या परमेश्वर को बैलों की चिंता है?
  alternative: क्या परमेश्वर को केवल बैलों की ही चिंता है?
  rationale: मूल यूनानी में प्रश्न μή के साथ है, पर ‘केवल’ स्पष्टतः उपस्थित नहीं है। इसलिए प्रश्न की तर्कात्मक शक्ति को सुरक्षित रखते हुए यह निर्णीत नहीं किया गया कि पौलुस परमेश्वर की पशुओं के प्रति चिंता का पूर्ण निषेध कर रहे हैं या व्यवस्था के व्यापक आशय पर बल दे रहे हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और साधारण पाठकों के लिए सुबोध हिन्दी। ‘मूसा की व्यवस्था’ और ‘परमेश्वर’ परिचित बाइबलीय पदावली हैं। उद्धरण में निषेध का रूप संक्षिप्त रखा गया है और फुटनोट-चिह्न [a] मुख्य पाठ में उपस्थित है।
