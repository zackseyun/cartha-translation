  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मुझे और बरनबास को’ हिन्दी की स्वाभाविक कारक-रचना है; ‘काम न करने’ की सीधी अभिव्यक्ति मूल पाठ की अस्पष्टता को अनावश्यक रूप से सीमित नहीं करती।
