    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: या क्या
  rationale: यह पौलुस के तर्क में अगला आलंकारिक विकल्प प्रस्तुत करता है; ‘या क्या’ हिन्दी में प्रश्न का स्वाभाविक प्रवाह बनाए रखता है।
- source_word: μόνος
  choice: केवल ... ही
  rationale: यह संयुक्त कर्ता ‘मुझे और बरनबास को’ की विशिष्टता पर बल देता है; हिन्दी में ‘केवल ... ही’ इस जोर को स्पष्ट करता है।
- source_word: ἐγὼ καὶ Βαρναβᾶς
  choice: मुझे और बरनबास को
  rationale: ‘अधिकार होना’ की हिन्दी वाक्य-रचना में संप्रदान कारक स्वाभाविक है और यूनानी क्रम भी सुरक्षित रहता है।
- source_word: οὐκ ἔχομεν
  choice: अधिकार नहीं है
  rationale: निषेध को वर्तमानकालीन अधिकार-वाक्यांश के साथ स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: इस संदर्भ में शब्द शासन-सत्ता नहीं, बल्कि प्रेरित की वैध सुविधा या दावे को दर्शाता है।
- source_word: μὴ ἐργάζεσθαι
  choice: काम न करने का
  rationale: यह अधिकार की विषयवस्तु को निकटता से व्यक्त करता है और मूल पाठ की संक्षिप्तता तथा संभावित सामान्य अर्थ को बनाए रखता है।
theological_decisions:
- issue: इस संदर्भ में ἐξουσία का आशय
  choice: काम न करने और सेवकाई के लिए भौतिक सहायता पाने का प्रेरितिक अधिकार
  alternative: किसी विशिष्ट आर्थिक आशय के बिना सामान्य अधिकार या स्वतंत्रता
  rationale: आस-पास का प्रसंग प्रेरितों के भोजन और भौतिक सहायता पाने के अधिकार तथा पौलुस द्वारा उस अधिकार को स्वेच्छा से न अपनाने पर केंद्रित है। मुख्य पाठ को संक्षिप्त रखकर संदर्भगत आशय पादटिप्पणी में स्पष्ट किया गया है।
