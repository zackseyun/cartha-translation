  source_fidelity: ‘जो मेरी जाँच करते हैं’ accurately renders τοῖς ἐμὲ ἀνακρίνουσιν as people who subject Paul to scrutiny, without prematurely narrowing it to a final verdict. ‘मेरा बचाव’ suitably conveys ἀπολογία in this context. The demonstrative construction ‘...मेरा बचाव यह है’ preserves the Greek’s identification of Paul’s defense and naturally introduces the following explanation.
  naturalness: The sentence is fluent, concise, and appropriately formal in modern standard Hindi. ‘उनके सामने’ is idiomatic in a defensive context; while it slightly foregrounds the setting of scrutiny, it remains compatible with the Greek dative audience relationship.
