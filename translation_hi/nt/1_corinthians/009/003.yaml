  text: This is my defense to those who examine me[a].
translation:
  language: hi
  text: जो मेरी जाँच करते हैं, उनके सामने मेरा बचाव यह है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मेरा न्याय करते हैं, उनके सामने मेरा बचाव यह है।”
    reason: ἀνακρίνουσίν में जाँच, परख या न्याय करने का भाव हो सकता है; वैकल्पिक अनुवाद अधिक न्यायिक अर्थ को सामने लाता है।
lexical_decisions:
- source_word: ἀπολογία
  choice: बचाव
  rationale: यहाँ पौलुस अपने प्रेरिताई अधिकार और आचरण पर उठे प्रश्नों का उत्तर दे रहा है। ‘बचाव’ आरोप या आलोचना के प्रत्युत्तर का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνακρίνουσίν
  choice: जाँच करते हैं
  rationale: यह क्रिया आलोचनात्मक परख या छानबीन का संकेत देती है। ‘जाँच करते हैं’ अंतिम न्यायिक निर्णय का अर्थ थोपे बिना उस मूल्यांकन को बनाए रखता है।
- source_word: Ἡ ἐμὴ
  choice: मेरा
  rationale: सरल संबंधसूचक रूप यूनानी का अर्थ पर्याप्त रूप से व्यक्त करता है; ‘मेरा अपना’ अनावश्यक अतिरिक्त बल देता।
- source_word: τοῖς ἐμὲ ἀνακρίνουσίν
  choice: जो मेरी जाँच करते हैं, उनके सामने
  rationale: सम्प्रदान कारक उन लोगों को दर्शाता है जिनके समक्ष पौलुस अपना बचाव रखता है। हिन्दी में ‘उनके सामने’ इस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐστιν αὕτη
  choice: यह है
  rationale: यह वाक्य पौलुस के बचाव की पहचान कराता है। हिन्दी की स्वाभाविक पद-रचना के अनुसार ‘यह है’ उपयुक्त है।
