  text: ⸀πάντα δὲ ποιῶ διὰ τὸ εὐαγγέλιον, ἵνα συγκοινωνὸς αὐτοῦ γένωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/023.yaml
  text: But I do all things for the sake of the good news[b][a], so that I may become a fellow participant in it.
translation:
  language: hi
  text: परन्तु मैं यह सब शुभ समाचार[a] के लिए करता हूँ, ताकि मैं उसमें सहभागी बनूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सुसमाचार।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘ताकि मैं उसमें भागीदार बनूँ’ अथवा ‘ताकि मैं उसमें साझेदार बनूँ।’
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: यह सब
  rationale: नपुंसकलिंग बहुवचन का व्यापक भाव है और प्रसंग में पौलुस द्वारा बताई गई सभी बातों की ओर संकेत करता है; ‘यह सब’ स्वाभाविक हिन्दी है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले कथन से हल्का विरोध या संक्रमण दिखाता है; ‘परन्तु’ उस संबंध को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ποιῶ
  choice: मैं ... करता हूँ
  rationale: वर्तमानकालीन क्रिया पौलुस के नियमित आचरण को व्यक्त करती है; सामान्य वर्तमान काल हिन्दी में स्वाभाविक है।
- source_word: διὰ τὸ εὐαγγέλιον
  choice: शुभ समाचार के लिए
  rationale: διά के साथ कर्मकारक यहाँ कारण, उद्देश्य या हित का भाव दे सकता है। ‘के लिए’ इस व्यापकता को अनावश्यक रूप से सीमित नहीं करता, और εὐαγγέλιον को सहज आधुनिक हिन्दी में ‘शुभ समाचार’ कहा गया है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्यसूचक उपवाक्य आरम्भ करता है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक रूप से उसका प्रयोजनात्मक बल रखता है।
- source_word: συγκοινωνὸς
  choice: सहभागी
  rationale: यह दूसरों के साथ किसी वस्तु में भाग लेने वाले व्यक्ति को दर्शाता है। ‘सहभागी’ συν- के साझा भागीदारी वाले भाव को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτοῦ
  choice: उसमें
  rationale: सर्वनाम का निकटतम पूर्वपद εὐαγγέλιον है; हिन्दी में ‘सहभागी’ के साथ ‘उसमें’ स्वाभाविक है।
- source_word: γένωμαι
  choice: मैं भी ... बनूँ
  rationale: γίνομαι का ‘बनना’ भाव सुरक्षित रखा गया है। ‘भी’ συγκοινωνός में निहित दूसरों के साथ साझा भागीदारी को हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: शुभ समाचार में पौलुस की सहभागिता का आशय
  choice: ‘उसमें सहभागी बनूँ’ कहकर शुभ समाचार, उसके लाभ और उसके प्रसार में साझा भागीदारी की व्यापकता बनाए रखी गई है।
  alternative: इसे केवल उसके आशीषों में भाग लेने, केवल उसके प्रचार में साझेदार होने, या किसी विशिष्ट संस्कारात्मक अथवा रहस्यात्मक सहभागिता के रूप में सीमित करना।
  rationale: συγκοινωνός का अर्थ व्यापक है। अनुवाद किसी एक धर्मवैज्ञानिक व्याख्या को मूल वाक्य पर आरोपित किए बिना वास्तविक अर्थगत तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘शुभ समाचार’ सामान्य पाठक के लिए पारदर्शी है, जबकि पारंपरिक ‘सुसमाचार’ को पादटिप्पणी में सुरक्षित रखा गया है।
