  source_fidelity: The three rhetorical questions, the emphatic ‘ever,’ the military-pay sense, vineyard produce, and the flock-milk image are retained. However, ‘सैनिक की सेवा करता है’ ordinarily means ‘serves a soldier,’ rather than ‘serves as a soldier,’ and therefore does not accurately render στρατεύεται.
  naturalness: ‘अपने ही खर्च पर सैनिक के रूप में सेवा करता है’ is clear modern Hindi. Replacing ‘झुंड की चरवाही करता है’ with ‘झुंड को चराता है’ gives a more idiomatic expression for the pastoral image while retaining the broad rhetorical analogy.
  terminology: ‘सैनिक के रूप में सेवा,’ ‘अंगूर की बारी,’ and ‘झुंड’ are suitable, neutral modern-standard Hindi equivalents. The contextually natural ‘पीता’ for Greek ἐσθίει with milk is appropriately explained in the note.
  issues:
  - severity: medium
    issue: ‘सैनिक की सेवा करता है’ is syntactically and semantically misleading.
    rationale: In Hindi this construction normally means that someone performs service for a soldier. The Greek στρατεύεται denotes serving as a soldier; ‘सैनिक के रूप में सेवा करता है’ expresses this accurately.
  - severity: low
    issue: ‘झुंड की चरवाही करता है’ is less idiomatic than the surrounding modern Hindi.
    rationale: Although understandable, ‘झुंड को चराता है’ is the ordinary concise Hindi expression and preserves the shepherding/tending image without adding interpretation.
