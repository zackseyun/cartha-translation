source:
  edition: SBLGNT
  text: τίς στρατεύεται ἰδίοις ὀψωνίοις ποτέ; τίς φυτεύει ἀμπελῶνα καὶ ⸂τὸν καρπὸν⸃ αὐτοῦ οὐκ ἐσθίει; ⸀τίς ποιμαίνει ποίμνην καὶ ἐκ τοῦ γάλακτος τῆς ποίμνης οὐκ ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/009/007.yaml
  text: Who ever serves as a soldier at his own expense? Who plants a vineyard and does not eat its fruit? Or who shepherds a flock and does not drink from the milk of the flock?[a][b]
translation:
  language: hi
  text: कौन कभी अपने ही खर्च पर सैनिक के रूप में सेवा करता है?[a] कौन अंगूर की बारी लगाता है और उसका फल नहीं खाता? या कौन झुंड को चराता है और उस झुंड के दूध में से नहीं पीता?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने ही वेतन/राशन से।” यूनानी शब्द सैनिक के वेतन या राशन को सूचित करता है; आशय यह है कि सैनिक अपनी सेवा का खर्च स्वयं नहीं उठाता।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उस झुंड के दूध में से नहीं खाता।” हिन्दी में दूध के साथ सामान्यतः “पीता” कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύεται
  choice: सैनिक की सेवा करता है
  rationale: क्रिया का अर्थ सैनिक के रूप में सैन्य सेवा करना है; यह अभिव्यक्ति युद्ध में प्रत्यक्ष लड़ाई को अनावश्यक रूप से निर्दिष्ट किए बिना व्यावसायिक उपमा बनाए रखती है।
- source_word: ἰδίοις ὀψωνίοις
  choice: अपने ही खर्च पर
  rationale: ὀψώνιον मूलतः सैनिक के वेतन या राशन को सूचित कर सकता है, पर इस आलंकारिक प्रश्न में आशय है कि सैनिक अपनी सेवा का खर्च स्वयं नहीं उठाता।
- source_word: ποτέ
  choice: कभी
  rationale: आलंकारिक प्रश्न में यह ‘कभी भी’ का भाव जोड़ता है; हिन्दी में ‘कौन कभी’ स्वाभाविक और संक्षिप्त है।
- source_word: φυτεύει ἀμπελῶνα
  choice: अंगूर की बारी लगाता है
  rationale: यह कृषि-चित्र का सीधा अर्थ है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὸν καρπὸν αὐτοῦ
  choice: उसका फल
  rationale: καρπός यहाँ अंगूर की बारी से मिलने वाली उपज को सूचित करता है; ‘फल’ शाब्दिक और सहज है।
- source_word: ποιμαίνει ποίμνην
  choice: झुंड की चरवाही करता है
  rationale: यह ποιμαίνω की चरवाहे द्वारा देखभाल करने की छवि को बनाए रखता है और केवल चराने तक अर्थ को सीमित नहीं करता।
- source_word: ἐκ τοῦ γάλακτος τῆς ποίμνης
  choice: उस झुंड के दूध में से
  rationale: यह यूनानी पदबंध के स्रोत/अंशसूचक भाव को बनाए रखता है—झुंड से मिलने वाले दूध में से हिस्सा लेना।
- source_word: ἐσθίει
  choice: खाता / पीता
  rationale: यूनानी में दोनों बार वही क्रिया ‘खाना’ है, पर हिन्दी में दूध के साथ ‘पीना’ स्वाभाविक है; इस संदर्भगत समायोजन को पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: बार-बार प्रयुक्त τίς वाले प्रश्नों में प्रतिनिधिक पुल्लिंग एकवचन
  choice: एकवचन प्रतिनिधिक प्रश्नों को ‘कौन’ और निहित पुल्लिंग व्यावसायिक उदाहरणों के साथ रखा गया
  alternative: बहुवचन या स्पष्ट लिंग-निरपेक्ष रूप
  rationale: यूनानी पाठ एकवचन आलंकारिक उदाहरण देता है। हिन्दी में ‘कौन’ स्वयं लिंग-निरपेक्ष है, जबकि ‘सैनिक’ और ‘चरवाही’ स्रोत की प्रतिनिधिक व्यावसायिक उपमाओं को स्वाभाविक रूप से व्यक्त करते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। तीनों आलंकारिक प्रश्नों की समानांतर बनावट और कृषि-पशुपालन की मूल छवियाँ सुरक्षित हैं।
