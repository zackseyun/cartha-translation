  text: κατὰ μίαν ⸀σαββάτου ἕκαστος ὑμῶν παρ’ ἑαυτῷ τιθέτω θησαυρίζων ὅ τι ⸀ἐὰν εὐοδῶται, ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/002.yaml
  text: On the first day of every week[a], each of you is to set something aside, storing up whatever he may prosper in[c][b], so that collections will not be made when I come.
translation:
  language: hi
  text: हर सप्ताह के पहले दिन[a] तुम में से हर एक, जितना उसे लाभ हुआ हो उसके अनुसार, अपने पास कुछ अलग रखे और उसे जमा करता जाए[b][c], ताकि मेरे आने पर धन-संग्रह न करना पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सप्ताह के पहले दिन।” यूनानी अभिव्यक्ति यहाँ नियमित रूप से हर सप्ताह ऐसा करने का संकेत देती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “अपने पास” या “अपने यहाँ” है। सम्भव है कि हर व्यक्ति को यह धन व्यक्तिगत रूप से, शायद घर पर, अलग रखना था।
    reason: lexical_alternative
  - marker: c
    text: या, “जैसी उसे समृद्धि मिली हो, उसके अनुसार।” भाव यह है कि हर व्यक्ति अपने प्राप्त साधनों के अनुपात में अलग रखे।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μίαν σαββάτου
  choice: हर सप्ताह के पहले दिन
  rationale: κατά के साथ यह अभिव्यक्ति यहाँ वितरणात्मक है और नियमित साप्ताहिक अभ्यास बताती है। आधुनिक हिन्दी में यह स्वाभाविक रूप से पुनरावृत्ति स्पष्ट करती है।
- source_word: ἕκαστος ὑμῶν
  choice: तुममें से हर व्यक्ति
  rationale: यह निर्देश समुदाय के प्रत्येक सदस्य पर व्यक्तिगत रूप से लागू होता है।
- source_word: παρ’ ἑαυτῷ
  choice: अपने पास
  rationale: शाब्दिक अर्थ ‘अपने निकट/अपने यहाँ’ है। इससे व्यक्तिगत रूप से, सम्भवतः घर पर, धन अलग रखने का भाव आता है; स्थान को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: τιθέτω θησαυρίζων
  choice: कुछ अलग रखकर जमा करता रहे
  rationale: वर्तमान आज्ञार्थक और सहभागी क्रिया मिलकर नियमित रूप से धन अलग रखने और क्रमशः संचित करने का भाव देते हैं।
- source_word: ὅ τι ἐὰν εὐοδῶται
  choice: जितनी भी उसकी आमदनी हो, उसी के अनुसार
  rationale: अनिश्चित-शर्तात्मक पदबंध व्यक्ति को मिली आर्थिक सफलता या साधनों के अनुपात का संकेत देता है। ‘आमदनी’ सामान्य पाठक के लिए प्रसंगानुकूल है, जबकि पादटिप्पणी व्यापक ‘समृद्धि’ अर्थ सुरक्षित रखती है।
- source_word: ἵνα μὴ ὅταν ἔλθω τότε λογεῖαι γίνωνται
  choice: ताकि मेरे आने पर चंदा इकट्ठा न करना पड़े
  rationale: उद्देश्य यह है कि पौलुस के आने पर अंतिम समय में धन-संग्रह न करना पड़े। ‘चंदा’ इस प्रसंग में सामूहिक आर्थिक योगदान के लिए सहज आधुनिक हिन्दी है।
