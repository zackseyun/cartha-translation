source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί· οἴδατε τὴν οἰκίαν Στεφανᾶ, ὅτι ἐστὶν ἀπαρχὴ τῆς Ἀχαΐας καὶ εἰς διακονίαν τοῖς ἁγίοις ἔταξαν ἑαυτούς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/015.yaml
  text: 'I urge you[a], brothers: you know the household of Stephanas, that they are the firstfruits of Achaia[b], and they devoted themselves to the service of the saints.'
translation:
  language: hi
  text: 'हे भाइयो,[a] मैं तुमसे आग्रह करता हूँ: तुम स्तिफनास के घराने को जानते हो कि वे अखाया के पहले फल[b] हैं और उन्होंने पवित्र लोगों की सेवा के लिए अपने आपको समर्पित कर दिया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे भाइयो और बहनो”; यूनानी में “भाइयो” है, जो ऐसा सामान्य सम्बोधन था जिसमें पूरी मण्डली सम्मिलित हो सकती थी।
    reason: lexical_alternative
  - marker: b
    text: “पहले फल” से सम्भवतः अखाया के सबसे आरम्भिक विश्वासियों का बोध होता है; साथ ही यह परमेश्वर के लिए अलग किए गए आरम्भिक अंश की उपमा को भी बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: मैं तुमसे आग्रह करता हूँ
  rationale: यहाँ क्रिया गंभीर और आत्मीय अपील व्यक्त करती है; ‘आग्रह करता हूँ’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसका बल बनाए रखता है।
- source_word: δὲ
  choice: अब
  rationale: δέ यहाँ हल्का विषयांतर सूचित करता है; हिन्दी में ‘अब’ इस संक्रमण को स्वाभाविक रूप से व्यक्त करता है, बिना प्रबल विरोध का भाव दिए।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: सम्बोधन का पुल्लिंग रूप सुरक्षित रखा गया है; मण्डली में स्त्रियाँ भी सम्मिलित हो सकती हैं, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: οἴδατε
  choice: तुम ... जानते हो
  rationale: पूर्णकालिक यूनानी रूप यहाँ वर्तमान अर्थ में है; यह सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: οἰκίαν Στεφανᾶ
  choice: स्तिफनास के घराने
  rationale: ‘घराना’ केवल भवन या रक्त-सम्बन्धी परिवार के बजाय व्यापक घरेलू इकाई को व्यक्त कर सकता है।
- source_word: ἀπαρχὴ τῆς Ἀχαΐας
  choice: अखाया के पहले फल
  rationale: यह चुनाव आरम्भिक विश्वासियों के कालगत अर्थ के साथ परमेश्वर के लिए अलग किए गए आरम्भिक अंश की उपमा भी सुरक्षित रखता है।
- source_word: εἰς διακονίαν τοῖς ἁγίοις
  choice: पवित्र लोगों की सेवा में
  rationale: यह व्यावहारिक और व्यापक सेवा का भाव देता है तथा किसी बाद की औपचारिक कलीसियाई पदवी को आरोपित नहीं करता।
- source_word: ἔταξαν ἑαυτούς
  choice: उन्होंने ... अपने आपको लगा दिया है
  rationale: प्रतिवाची प्रयोग किसी औपचारिक नियुक्ति से अधिक, स्वेच्छा से और दृढ़ता के साथ किसी कार्य में लगने को व्यक्त करता है।
theological_decisions:
- issue: मण्डली के सम्बोधन में ἀδελφοί
  choice: हे भाइयो
  alternative: हे भाइयो और बहनो
  rationale: मुख्य पाठ यूनानी पुल्लिंग सम्बोधन को बनाए रखता है, जबकि सम्भावित समावेशी आशय पादटिप्पणी में दिया गया है।
- issue: ἀπαρχὴ τῆς Ἀχαΐας का अर्थ
  choice: अखाया के पहले फल
  alternative: अखाया के सबसे पहले विश्वासी
  rationale: मुख्य पाठ पौलुस की उपमा और उसके सम्भावित समर्पण-संबंधी भाव को सुरक्षित रखता है; केवल कालगत अर्थ तक सीमित नहीं करता।
- issue: τοῖς ἁγίοις का अनुवाद
  choice: पवित्र लोगों
  alternative: सन्तों
  rationale: यह पौलुस के विश्वासियों को परमेश्वर के लिए अलग किए गए जन कहने का भाव स्पष्ट करता है और आधुनिक हिन्दी में ‘सन्त’ से जुड़ी बाद की विशिष्ट धारणाओं से बचता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की अपील-प्रधान शैली, घराने का सामूहिक बोध और ‘पहले फल’ की धार्मिक उपमा सुरक्षित हैं।
