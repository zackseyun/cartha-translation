  terminology: “हे भाइयो” with the inclusive footnote appropriately preserves ἀδελφοί. “पवित्र लोगों” is clear modern Hindi for τοῖς ἁγίοις and avoids importing later technical associations of “सन्त.” “पहले फल” and its footnote retain both the temporal and consecratory dimensions.
