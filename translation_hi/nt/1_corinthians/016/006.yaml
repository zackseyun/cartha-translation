  text: πρὸς ὑμᾶς δὲ τυχὸν ⸀παραμενῶ ἢ ⸀καὶ παραχειμάσω, ἵνα ὑμεῖς με προπέμψητε οὗ ἐὰν πορεύωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/006.yaml
  text: and perhaps I will stay with you[a], or even spend the winter, so that you may send me on my way wherever I may go.
translation:
  language: hi
  text: और हो सकता है कि मैं आपके साथ ठहरूँ, या शीतकाल भी आपके साथ बिताऊँ, ताकि जहाँ कहीं मैं जाऊँ, आप मुझे आगे की यात्रा के लिए विदा करें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आगे की यात्रा में मेरी सहायता करें।’ यूनानी क्रिया में किसी यात्री को विदा करते समय उसके साथ आगे जाने या उसे आवश्यक सहायता देने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: आपके साथ
  rationale: ठहरने के क्रियापद के साथ यह पदबंध व्यक्तियों की संगति में रहने का भाव देता है; आधुनिक हिन्दी में ‘आपके साथ’ स्वाभाविक है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ यात्रा-योजना को आगे बढ़ाने वाला हल्का संयोजक है, प्रबल विरोधसूचक नहीं।
- source_word: τυχὸν
  choice: सम्भव है
  rationale: यह अनिश्चित सम्भावना व्यक्त करता है; ‘सम्भव है कि’ हिन्दी में स्वाभाविक रूप से वही भाव रखता है।
- source_word: παραμενῶ
  choice: कुछ समय ... ठहरूँ
  rationale: क्रिया का अर्थ आगे या कुछ समय तक ठहरे रहना है। प्रसंग में ‘ठहरूँ’ स्वाभाविक है; ‘कुछ समय’ पहली सम्भावना और पूरी सर्दियाँ बिताने की बढ़ी हुई सम्भावना के बीच निहित अंतर को स्पष्ट करता है।
- source_word: ἢ καὶ
  choice: या ... भी
  rationale: यह दूसरी सम्भावना को पहली से आगे बढ़ाकर प्रस्तुत करता है—केवल ठहरना ही नहीं, बल्कि सर्दियाँ भी बिताना।
- source_word: παραχειμάσω
  choice: सर्दियाँ ... बिताऊँ
  rationale: यह क्रिया किसी स्थान पर शीतकाल बिताने को सूचित करती है; यह हिन्दी में सहज और सटीक अभिव्यक्ति है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य प्रकट करता है; ‘ताकि’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: προπέμψητε
  choice: यात्रा के लिए ... विदा करें
  rationale: यात्रा-प्रसंग में क्रिया किसी यात्री को आगे भेजने, विदा करने, साथ देने या आवश्यक सहायता उपलब्ध कराने का व्यापक भाव रख सकती है। मुख्य पाठ में सामान्य अर्थ रखा गया है और व्यापक सम्भावना पादटिप्पणी में दी गई है।
- source_word: οὗ ἐὰν πορεύωμαι
  choice: जहाँ कहीं जाऊँ
  rationale: सापेक्ष अव्यय, ἐάν और संभावनार्थक क्रियारूप मिलकर अनिश्चित गन्तव्य व्यक्त करते हैं; ‘जहाँ कहीं जाऊँ’ इस अनिश्चितता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
