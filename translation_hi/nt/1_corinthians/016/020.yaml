source:
  edition: SBLGNT
  text: ἀσπάζονται ὑμᾶς οἱ ἀδελφοὶ πάντες. ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/020.yaml
  text: All the brothers greet you[b][a]. Greet one another with a holy kiss.
translation:
  language: hi
  text: सभी भाई तुम्हें नमस्कार कहते हैं।[a] पवित्र चुम्बन से एक-दूसरे का अभिवादन करो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभी भाई-बहन तुम्हें नमस्कार कहते हैं”; यहाँ “भाई” सामूहिक रूप से सभी साथी विश्वासियों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “पवित्र चुम्बन” विश्वासियों के बीच प्रचलित अभिवादन था, जो उनकी पवित्रता और पारस्परिक संगति को व्यक्त करता था।
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάζονται
  choice: नमस्कार कहते हैं
  rationale: पत्र के समापन में यह क्रिया शुभकामना-सहित अभिवादन भेजने का भाव व्यक्त करती है; हिन्दी में ‘नमस्कार कहते हैं’ स्वाभाविक और स्पष्ट है।
- source_word: οἱ ἀδελφοὶ πάντες
  choice: सभी भाई
  rationale: यूनानी पद व्याकरणतः पुल्लिंग बहुवचन है। मुख्य पाठ में उसके रूप को रखा गया है, जबकि विश्वासियों के मिश्रित समुदाय को समेट सकने वाला अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: ἀσπάσασθε
  choice: अभिवादन करो
  rationale: आज्ञार्थक क्रिया को सीधे आदेश के रूप में व्यक्त किया गया है। पहले खंड के ‘नमस्कार कहते हैं’ की अनावश्यक पुनरावृत्ति से बचते हुए उसी मूल अभिवादन-अर्थ को रखा गया है।
- source_word: ἀλλήλους
  choice: एक-दूसरे का
  rationale: यह पारस्परिक सर्वनाम का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: ἐν φιλήματι ἁγίῳ
  choice: पवित्र चुम्बन से
  rationale: यह साधन अथवा रीति को बताता है। अनुवाद वास्तविक चुम्बन और उसकी पवित्र सामुदायिक प्रकृति—दोनों को बनाए रखता है।
theological_decisions:
- issue: कलीसियाई संदर्भ में ἀδελφοί का अर्थ
  choice: भाई
  alternative: भाई-बहन; सभी विश्वासी
  rationale: मुख्य पाठ यूनानी के व्याकरणिक पुल्लिंग बहुवचन को सुरक्षित रखता है। क्योंकि यह शब्द सामूहिक रूप से स्त्री और पुरुष दोनों विश्वासियों को समेट सकता है, उस वास्तविक अर्थ-संभावना को पाद-टिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘नमस्कार कहते हैं’ पत्रात्मक अभिवादन के लिए स्वाभाविक है; आज्ञा में ‘अभिवादन करो’ मूल क्रिया के अर्थ को स्पष्ट रखता है। सभी पाद-टिप्पणी चिह्न संबंधित कथन के तुरंत बाद रखे गए हैं।
