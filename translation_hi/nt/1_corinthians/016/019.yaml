language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι τῆς Ἀσίας. ⸀ἀσπάζεται ὑμᾶς ἐν κυρίῳ πολλὰ Ἀκύλας καὶ ⸀Πρίσκα σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/019.yaml
  text: The churches of Asia greet you[a]. Aquila and Prisca, together with the church in their house[b], greet you warmly in the Lord.
translation:
  language: hi
  text: आसिया की कलीसियाएँ आपको नमस्कार कहती हैं[a]। अक्विला और प्रिस्का[b] अपने घर में इकट्ठी होने वाली कलीसिया के साथ प्रभु में आपको बहुत-बहुत नमस्कार कहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “आसिया” से पश्चिमी एशिया माइनर का रोमी प्रांत अभिप्रेत है, आधुनिक महाद्वीप एशिया नहीं।
    reason: cultural_note
  - marker: b
    text: यूनानी पाठ में नाम “प्रिस्का” है; अन्य स्थानों पर उसे “प्रिस्किल्ला” भी कहा गया है (जैसे प्रेरितों के काम 18:2, 18, 26; रोमियों 16:3)।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονται / ἀσπάζεται
  choice: नमस्कार कहती हैं / नमस्कार कहते हैं
  rationale: ἀσπάζομαι का अर्थ अभिवादन करना या नमस्कार भेजना है। आधुनिक हिन्दी में “नमस्कार कहना” स्वाभाविक है; दूसरे वाक्य में πολλὰ की तीव्रता “बहुत-बहुत” से व्यक्त की गई है।
- source_word: αἱ ἐκκλησίαι
  choice: कलीसियाएँ
  rationale: पौलुस के प्रयोग में ἐκκλησία सामान्यतः मसीही विश्वासियों की स्थानीय मंडली को दर्शाता है। “कलीसिया” हिन्दी बाइबलीय प्रयोग में परिचित और स्पष्ट है।
- source_word: τῆς Ἀσίας
  choice: आसिया
  rationale: यहाँ Ἀσία रोमी प्रांत का नाम है। “आसिया” ऐतिहासिक स्थान-नाम को आधुनिक महाद्वीप “एशिया” से अलग रखने में सहायक है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह पौलुस की विशिष्ट अभिव्यक्ति है, जो प्रभु से जुड़े विश्वास और सहभागिता के क्षेत्र को बताती है; इसे बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: πολλὰ
  choice: बहुत-बहुत
  rationale: ἀσπάζεται के साथ क्रियाविशेषण रूप में πολλὰ अभिवादन की प्रबलता और हार्दिकता व्यक्त करता है। हिन्दी में “बहुत-बहुत नमस्कार” स्वाभाविक है।
- source_word: Ἀκύλας καὶ Πρίσκα
  choice: अक्विला और प्रिस्का
  rationale: व्यक्तिनामों का मूल यूनानी रूप के निकट लिप्यंतरण किया गया है। Πρίσκα का रूप “प्रिस्का” है, न कि विस्तृत रूप “प्रिस्किल्ला।”
- source_word: σὺν τῇ κατ’ οἶκον αὐτῶν ἐκκλησίᾳ
  choice: और उनके घर में इकट्ठी होने वाली कलीसिया भी
  rationale: κατ’ οἶκον का भाव घर में स्थित या वहाँ एकत्र होने वाली मंडली है। स्पष्ट आधुनिक हिन्दी के लिए निहित सभा-भाव को “इकट्ठी होने वाली” से व्यक्त किया गया है।
theological_decisions:
- issue: घरेलू परिवेश में ἐκκλησία का अर्थ
  choice: अक्विला और प्रिस्का के घर में इकट्ठी होने वाली स्थानीय मसीही मंडली
  alternative: उनका परिवार अथवा केवल एक संस्थागत ‘गृह-कलीसिया’ नाम
  rationale: पौलुस के सामान्य प्रयोग और κατ’ οἶκον की रचना के अनुसार आशय घर में एकत्र होने वाली विश्वासियों की मंडली है, केवल उस घराने के सदस्यों का नहीं।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: “प्रभु” पौलुस की मसीही स्वीकारोक्ति और संबंधपरक अर्थ दोनों को सुरक्षित रखता है तथा मूल से अधिक विशिष्टता नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ऐतिहासिक प्रांत के नाम के लिए “आसिया” चुना गया है, जिससे आधुनिक महाद्वीप “एशिया” के साथ भ्रम कम हो; इसलिए अलग सांस्कृतिक पाद-टिप्पणी आवश्यक नहीं मानी गई। “प्रिस्का” मूल पाठ का नामरूप है; अन्य स्थानों के “प्रिस्किल्ला” रूप की जानकारी इस पद के अर्थ के लिए अनिवार्य नहीं है।
