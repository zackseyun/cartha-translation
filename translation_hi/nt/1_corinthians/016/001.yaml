  edition: SBLGNT
  text: Περὶ δὲ τῆς λογείας τῆς εἰς τοὺς ἁγίους, ὥσπερ διέταξα ταῖς ἐκκλησίαις τῆς Γαλατίας, οὕτως καὶ ὑμεῖς ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/001.yaml
  text: Concerning the collection for the saints[a], as I directed the churches of Galatia, so you also are to do.
translation:
  language: hi
  text: पवित्र जनों के लिए चंदे के विषय में, जैसा निर्देश मैंने गलातिया की कलीसियाओं को दिया था, वैसा ही तुम भी करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ δὲ
  choice: के विषय में
  rationale: यह पत्र में एक नए विषय का परिचय देने वाला स्वाभाविक संक्रमण है; हिंदी में अनावश्यक कालवाचक ‘अब’ जोड़े बिना विषय-परिवर्तन स्पष्ट होता है।
- source_word: λογείας
  choice: चंदा इकट्ठा करना
  rationale: यहाँ शब्द जरूरतमंद विश्वासियों के लिए धन-संग्रह को दर्शाता है। यह आधुनिक हिंदी में सहज है और इसे अनुष्ठानिक ‘भेंट’ के रूप में अधिक विशिष्ट नहीं बनाता।
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: पवित्र लोगों के लिए
  rationale: पूर्वसर्गीय वाक्यांश संग्रह के लाभार्थियों को बताता है। यह ἅγιοι का अर्थ बनाए रखता है और बाद की औपचारिक संत-उपाधि का भ्रम घटाता है।
- source_word: διέταξα
  choice: निर्देश मैंने ... दिया था
  rationale: यह पौलुस के अधिकारपूर्ण निर्देश को व्यक्त करता है, पर ‘आज्ञा दी’ की अपेक्षा प्रसंग में अधिक स्वाभाविक और कम कठोर है।
- source_word: ἐκκλησίαις
  choice: कलीसियाओं
  rationale: पौलुस के प्रयोग में यह स्थानीय मसीही समुदायों को सूचित करता है; ‘कलीसिया’ हिंदी बाइबलीय प्रयोग में स्थापित है।
- source_word: Γαλατίας
  choice: गलातिया
  rationale: भौगोलिक नाम का प्रचलित हिंदी रूप।
- source_word: οὕτως καὶ ὑμεῖς ποιήσατε
  choice: वैसा ही तुम भी करो
  rationale: यह तुलना और आदेशात्मक बल दोनों को संक्षिप्त, स्वाभाविक हिंदी में बनाए रखता है।
theological_decisions:
- issue: आर्थिक सहायता के प्रसंग में ἅγιοι का अनुवाद
  choice: पवित्र लोग
  alternative: संत; परमेश्वर के लोग
  rationale: पौलुस ἅγιοι को सामान्यतः विश्वासियों के सामुदायिक नाम के रूप में प्रयोग करता है। ‘पवित्र लोग’ मूल अर्थ और पौलुस की धर्मवैचारिक शब्दावली को बनाए रखता है, जबकि ‘संत’ से उत्पन्न हो सकने वाली बाद की औपचारिक उपाधि का भ्रम टालता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिंदी। ‘चंदा’ धन-संग्रह का सहज शब्द है; वाक्य की विषय-परिवर्तन संरचना को स्पष्ट करने के लिए द्विबिंदु लगाया गया है।
