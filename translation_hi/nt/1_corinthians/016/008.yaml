  text: ⸀ἐπιμενῶ δὲ ἐν Ἐφέσῳ ἕως τῆς πεντηκοστῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/008.yaml
  text: But I will stay in Ephesus until Pentecost[a].
translation:
  language: hi
  text: पर मैं पिन्तेकुस्त[a] तक इफिसुस में ठहरूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सप्ताहों के पर्व तक’।
    reason: πεντηκοστή यहूदी पंचांग के ‘सप्ताहों के पर्व’ का यूनानी नाम है; वैकल्पिक रूप उसके यहूदी पर्व-संदर्भ को स्पष्ट करता है।
lexical_decisions:
- source_word: ἐπιμενῶ
  choice: ठहरूँगा
  rationale: ἐπιμένω का भविष्यत् सक्रिय रूप यहाँ यात्रा-योजना के संदर्भ में किसी स्थान पर कुछ समय तक बने रहने का अर्थ देता है। ‘ठहरूँगा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: δὲ
  choice: पर
  rationale: δέ पिछले यात्रा-विवरण के साथ हल्का विरोध अथवा विषयांतर दिखाता है। ‘पर’ इस सूक्ष्म संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν Ἐφέσῳ
  choice: इफिसुस में
  rationale: ἐν और संबंधकारक रूप यहाँ सीधे स्थान का बोध कराते हैं; नगर के नाम का प्रचलित हिन्दी लिप्यंतरण लिया गया है।
- source_word: ἕως τῆς πεντηκοστῆς
  choice: पिन्तेकुस्त तक
  rationale: ἕως के साथ संबंधकारक किसी निश्चित समय-बिंदु तक अवधि दर्शाता है। πεντηκοστή के लिए नए नियम में प्रचलित नाम ‘पिन्तेकुस्त’ रखा गया है।
