  yaml_path: translation/nt/1_corinthians/016/024.yaml
  text: My love be with all of you in Messiah Jesus[a].
translation:
  language: hi
  text: मसीह यीशु में मेरा प्रेम तुम सबके साथ रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη
  choice: प्रेम
  rationale: यह आत्मीय और समर्पित प्रेम का सीधा, स्वाभाविक और वर्तमान हिन्दी रूप है।
- source_word: μου
  choice: मेरा
  rationale: पौलुस के व्यक्तिगत प्रेम को व्यक्त करने वाला सरल संबंधसूचक रूप।
- source_word: μετὰ
  choice: के साथ रहे
  rationale: यूनानी वाक्य क्रियारहित है; पत्र के समापन पर शुभकामनात्मक भाव प्रकट करने के लिए हिन्दी में ‘रहे’ स्वाभाविक रूप से जोड़ा गया है।
- source_word: πάντων ὑμῶν
  choice: तुम सबके
  rationale: यह पूरी कलीसिया को समावेशी रूप से संबोधित करने वाले बहुवचन को स्पष्ट रखता है।
- source_word: ἐν
  choice: में
  rationale: पौलुस की ‘मसीह में’ अभिव्यक्ति को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: Χριστῷ Ἰησοῦ
  choice: मसीह यीशु
  rationale: Χριστός को उसके उपाधिगत अर्थ में ‘मसीह’ और Ἰησοῦ को नाम ‘यीशु’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ में Χριστός का अनुवाद
  choice: मसीह यीशु में
  alternative: ख्रीष्ट यीशु में
  rationale: यहाँ उपाधि का अर्थ बनाए रखने के लिए प्रचलित हिन्दी धार्मिक शब्द ‘मसीह’ चुना गया है; वाक्यांश की पौलुसी अस्पष्टता को ‘में’ द्वारा यथावत रखा गया है।
- issue: क्रियारहित समापन-वाक्य का भाव
  choice: मेरा प्रेम तुम सबके साथ रहे
  alternative: मेरा प्रेम तुम सबके साथ है
  rationale: स्रोत में क्रिया नहीं है। पत्र के आशीर्वचनात्मक समापन के अनुरूप ‘रहे’ इच्छा या कामना का भाव स्वाभाविक रूप से व्यक्त करता है, जबकि ‘है’ इसे केवल तथ्य-कथन बना सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आत्मीय, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। ‘तुम सबके’ बहुवचन संबोधन को स्पष्ट रखता है, और ‘मसीह यीशु में’ मूल की संक्षिप्त पौलुसी अभिव्यक्ति को बनाए रखता है।
