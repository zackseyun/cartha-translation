source:
  edition: SBLGNT
  text: μή τις οὖν αὐτὸν ἐξουθενήσῃ. προπέμψατε δὲ αὐτὸν ἐν εἰρήνῃ, ἵνα ἔλθῃ πρός ⸀με, ἐκδέχομαι γὰρ αὐτὸν μετὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/011.yaml
  text: So then[a], let no one despise him. But send him on his way in peace, so that he may come to me, for I am expecting him with the brothers.
translation:
  language: hi
  text: इसलिए कोई उसे तुच्छ न समझे। बल्कि उसे शांति से आगे की यात्रा के लिए विदा करो, ताकि वह मेरे पास आ सके, क्योंकि मैं भाइयों[a] के साथ उसकी प्रतीक्षा कर रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाइयों और बहनों के साथ,” यदि पौलुस का आशय उन साथी विश्वासियों या सहकर्मियों के व्यापक समूह से है जिनके साथ वह तीमुथियुस की प्रतीक्षा कर रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις οὖν
  choice: इसलिए कोई ... न
  rationale: μή के साथ aorist subjunctive निषेध व्यक्त करता है, और οὖν पिछले कथन से निष्कर्षात्मक सम्बन्ध जोड़ता है; ‘इसलिए’ इसे सहज हिन्दी में रखता है।
- source_word: ἐξουθενήσῃ
  choice: तुच्छ न समझे
  rationale: क्रिया किसी को नगण्य या महत्वहीन मानने और उसका तिरस्कार करने का भाव देती है; ‘तुच्छ समझना’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: προπέμψατε
  choice: आगे की यात्रा के लिए विदा करना
  rationale: यह केवल भेजने के बजाय आगे की यात्रा हेतु सम्मानपूर्वक विदा करने और आवश्यक सहायता देने का संकेत दे सकती है; अनुवाद यात्रा-सन्दर्भ को स्पष्ट रखता है।
- source_word: ἐν εἰρήνῃ
  choice: शान्ति से
  rationale: वाक्यांश शान्तिपूर्ण, निर्विघ्न और सद्भावपूर्ण विदाई का भाव देता है; ‘शान्ति से’ संक्षिप्त और स्वाभाविक है।
- source_word: ἵνα ἔλθῃ πρός με
  choice: ताकि वह मेरे पास आ सके
  rationale: ἵνα और subjunctive उद्देश्य बताते हैं; ‘ताकि’ उस प्रयोजन को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐκδέχομαι
  choice: मैं ... प्रतीक्षा कर रहा हूँ
  rationale: वर्तमानकालीन क्रिया जारी प्रतीक्षा अथवा अपेक्षा प्रकट करती है; हिन्दी में ‘प्रतीक्षा कर रहा हूँ’ स्वाभाविक है।
- source_word: μετὰ τῶν ἀδελφῶν
  choice: भाइयों के साथ
  rationale: ἀδελφῶν व्याकरणतः पुल्लिंग बहुवचन है। मुख्य पाठ इसका औपचारिक रूप बनाए रखता है, जबकि सम्भावित व्यापक समावेशी अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: सम्भवतः मिश्रित मसीही समूह के लिए ἀδελφῶν का अनुवाद
  choice: भाइयों
  alternative: भाइयों और बहनों; अथवा साथी विश्वासियों
  rationale: यूनानी रूप पुल्लिंग बहुवचन है, इसलिए मुख्य पाठ में ‘भाइयों’ रखा गया है। फिर भी यह शब्द व्यापक विश्वासी या सहकर्मी समूह को सूचित कर सकता है; उस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘तुच्छ न समझे’ और ‘आगे की यात्रा के लिए विदा करना’ सामान्य पाठक के लिए स्पष्ट हैं। आज्ञार्थक बहुवचन ‘करना’ कुरिन्थ की सामूहिक कलीसिया को सम्बोधित करता है।
