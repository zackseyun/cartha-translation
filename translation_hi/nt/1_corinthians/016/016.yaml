  text: ἵνα καὶ ὑμεῖς ὑποτάσσησθε τοῖς τοιούτοις καὶ παντὶ τῷ συνεργοῦντι καὶ κοπιῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/016.yaml
  text: that you also submit yourselves to such people[b][a], and to everyone who works and labors.
translation:
  language: hi
  text: कि तुम भी ऐसे लोगों के अधीन रहो[a], और हर उस व्यक्ति के भी, जो साथ मिलकर काम करता[b] और परिश्रम करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आपको ऐसे लोगों के अधीन रखो।”
    reason: मूल क्रिया के मध्यवाच्य अथवा कर्मवाच्य रूप के आत्म-संबंधी भाव को अधिक स्पष्ट करने वाला वैकल्पिक अनुवाद।
  - marker: b
    text: या, “सहकर्मी है”; अथवा, “सहयोग करता है।”
    reason: συνεργέω साथ काम करने, सहकर्मी होने या सहयोग करने का भाव दे सकता है।
lexical_decisions:
- source_word: ἵνα
  choice: कि
  rationale: यह पिछले पद में आरम्भ हुई विनती की विषय-वस्तु अथवा उसका उद्देश्य बताता है। हिन्दी में आश्रित वाक्य को स्वाभाविक रूप से जोड़ने के लिए ‘कि’ उपयुक्त है।
- source_word: καὶ ὑμεῖς
  choice: तुम भी
  rationale: यह कुरिन्थियों को भी उसी अपेक्षित प्रतिक्रिया में सम्मिलित करते हुए हल्का बल देता है।
- source_word: ὑποτάσσησθε
  choice: अधीन रहो
  rationale: यह अपने आपको उचित व्यवस्था या नेतृत्व के अधीन रखने का भाव व्यक्त करता है। हिन्दी में ‘अधीन रहो’ संक्षिप्त और स्वाभाविक है; संदर्भ से परे निरंकुश आज्ञाकारिता का अर्थ इसमें नहीं जोड़ा गया।
- source_word: τοῖς τοιούτοις
  choice: ऐसे लोगों के
  rationale: यह स्तिफनास के घराने जैसे सेवा में समर्पित लोगों की श्रेणी की ओर संकेत करता है और अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: παντὶ τῷ συνεργοῦντι
  choice: हर उस व्यक्ति के भी, जो साथ मिलकर काम करता
  rationale: सहभागिता सूचक कृदन्त के क्रियात्मक और सामूहिक भाव को बनाए रखता है। ‘साथ मिलकर काम करता’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: καὶ κοπιῶντι
  choice: और परिश्रम करता है
  rationale: κοπιάω साधारण काम से बढ़कर कठिन या थका देने वाले श्रम का भाव रखता है; ‘परिश्रम करता है’ इसे गरिमापूर्ण और सुबोध ढंग से व्यक्त करता है।
theological_decisions:
- issue: आज्ञा में कही गई अधीनता का स्वरूप
  choice: तत्कालीन संदर्भ में बताए गए सेवाभावी मसीही कार्यकर्ताओं जैसे लोगों के अधीन रहने का आह्वान
  alternative: सभी परिस्थितियों में लागू होने वाली निरपेक्ष पदानुक्रमिक आज्ञाकारिता
  rationale: पद 15–18 का निकट संदर्भ स्तिफनास के घराने और काम में सहभागी परिश्रमी लोगों से संबंधित है। ‘अधीन रहो’ मूल की शक्ति बनाए रखता है, पर पद में न कही गई निरपेक्ष या संस्थागत अधीनता नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामुदायिक पत्र-शैली वाला रूप रखा गया है। वाक्य पिछले पद पर आश्रित होने के कारण ‘कि’ से आरम्भ होता है। ‘व्यक्ति’ और ‘लोगों’ द्वारा मूल के वर्ग-सूचक आशय को बिना अनावश्यक लैंगिक सीमा के व्यक्त किया गया है।
