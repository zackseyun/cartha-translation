base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/017.yaml
  text: And I rejoice at the coming of Stephanas and Fortunatus and Achaicus[a], because these men have made up for your absence.
translation:
  language: hi
  text: स्तिफनास, फूरतूनातुस और अखइकुस के आने पर मुझे आनन्द है, क्योंकि आपकी ओर से जो कमी थी[a], उसे इन लोगों ने पूरा कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन लोगों ने आपकी अनुपस्थिति की भरपाई कर दी।” सम्भवतः पौलुस का आशय यह है कि कुरिन्थ के विश्वासी स्वयं उसके पास उपस्थित नहीं हो सके थे; वह उनकी किसी नैतिक कमी की बात नहीं कर रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: मैं आनन्दित हूँ
  rationale: वर्तमानकालीन प्रथम पुरुष की सीधी व्यक्तिगत अभिव्यक्ति को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है।
- source_word: δὲ
  choice: अव्यक्त संयोजक प्रवाह
  rationale: यहाँ δέ हल्का संक्रमण है; अलग से ‘परन्तु’ या ‘और’ जोड़ने पर हिन्दी वाक्य अस्वाभाविक या अनावश्यक रूप से विरोधसूचक होता।
- source_word: ἐπὶ τῇ παρουσίᾳ
  choice: के आने से
  rationale: सन्दर्भ में παρουσία इन व्यक्तियों के आगमन और उपस्थित होने को बताता है, न कि पारिभाषिक युगान्तकारी अर्थ को।
- source_word: Στεφανᾶ καὶ Φορτουνάτου καὶ Ἀχαϊκοῦ
  choice: स्तिफनास, फूरतूनातुस और अखइकुस
  rationale: यूनानी नामों का देवनागरी में निकट ध्वन्यात्मक लिप्यन्तरण किया गया है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: पौलुस के आनन्दित होने का कारण स्पष्ट रूप से प्रस्तुत करता है।
- source_word: τὸ ὑμέτερον ὑστέρημα
  choice: आपकी ओर से जो कमी रह गई थी
  rationale: ὑστέρημα के ‘कमी/अभाव’ अर्थ को बनाए रखता है और उसे केवल शारीरिक अनुपस्थिति मानकर मुख्य पाठ में अस्पष्टता को समाप्त नहीं करता।
- source_word: οὗτοι
  choice: इन लोगों ने
  rationale: बलयुक्त संकेतवाचक का स्पष्ट और स्वाभाविक हिन्दी रूप, जो पहले बताए गए तीन व्यक्तियों की ओर संकेत करता है।
- source_word: ἀνεπλήρωσαν
  choice: पूरा कर दिया
  rationale: किसी रह गई कमी को भरने या पूरा करने का अर्थ सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: τὸ ὑμέτερον ὑστέρημα का आशय
  choice: मुख्य पाठ में ‘आपकी ओर से जो कमी रह गई थी’
  alternative: ‘आपकी अनुपस्थिति’
  rationale: यूनानी पद सामान्यतः कमी या अभाव कहता है। सन्दर्भ सम्भवतः कुरिन्थियों की व्यक्तिगत अनुपस्थिति की ओर है, पर मुख्य पाठ में उसी एक व्याख्या को अनिवार्य नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘आप’ से समुदाय के प्रति बहुवचन आदरसूचक सम्बोधन व्यक्त किया गया है।
