lexical_decisions:
- source_word: Ἐλεύσομαι
  choice: मैं ... आऊँगा
  rationale: भविष्यकालीन क्रिया पौलुस के कुरिन्थियों के पास आने के इरादे को व्यक्त करती है; πρὸς ὑμᾶς के साथ हिन्दी में ‘तुम्हारे पास ... आऊँगा’ स्वाभाविक है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले विषय से हल्का परिवर्तन या विरोध दर्शाता है; ‘पर’ संबंध को स्पष्ट रखता है, बिना उसे बहुत प्रबल बनाए।
- source_word: πρὸς ὑμᾶς
  choice: तुम्हारे पास
  rationale: गति-सूचक क्रिया के साथ यह व्यक्तियों की ओर आने को दर्शाता है; आधुनिक हिन्दी में ‘तुम्हारे पास’ स्वाभाविक प्रयोग है।
- source_word: ὅταν
  choice: जब
  rationale: यात्रा की भावी परिस्थिति के संदर्भ में ‘जब’ सबसे स्वाभाविक है।
- source_word: Μακεδονίαν
  choice: मकिदुनिया
  rationale: यूनानी प्रान्त के नाम का हिन्दी बाइबलीय लिप्यंतरण।
- source_word: διέλθω
  choice: से होकर निकल जाऊँगा
  rationale: एओरिस्ट सब्जंक्टिव मुख्य क्रिया से पहले मार्ग पूरा कर लेने का भाव दे सकता है; ‘निकल जाऊँगा’ उस पूर्व-पूर्णता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह बताए गए समय का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: διέρχομαι
  choice: से होकर जानेवाला हूँ
  rationale: वर्तमान रूप यहाँ निर्धारित भावी यात्रा या निकट योजना को व्यक्त करता है; ‘जानेवाला हूँ’ हिन्दी में इसे वर्तमान में चल रही यात्रा समझ लेने से बचाते हुए नियोजित मार्ग को स्पष्ट करता है।
