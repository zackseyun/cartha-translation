  source_fidelity: Draft accurately conveys the topic shift, Paul's emphatic urging, Apollos's own lack of present willingness, and his future coming. The final expression, however, is more precisely represented by making Apollos the one who has/finds a suitable opportunity, rather than using the somewhat impersonal ‘अवसर मिलने पर.’
  naturalness: The Hindi is clear, modern, and appropriately dignified. ‘जब उसे अनुकूल अवसर मिलेगा’ is equally natural and better specifies the subject of εὐκαιρήσῃ.
  terminology: ‘भाई अपुल्लोस,’ ‘भाइयों,’ ‘आग्रह,’ and ‘इच्छा’ are suitable. The wording does not introduce a possessive before ‘भाई’ or a divine referent for ‘इच्छा,’ preserving the Greek’s expression and contextual sense.
  issues:
