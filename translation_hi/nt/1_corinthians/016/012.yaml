reference: 1 Corinthians 16:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ, πολλὰ παρεκάλεσα αὐτὸν ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν· καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ, ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/012.yaml
  text: Concerning Apollos our brother[a], I strongly urged him to come to you with the brothers; but it was not at all his will to come now[b]. Yet he will come when he has opportunity.
translation:
  language: hi
  text: भाई अपुल्लोस के विषय में, मैंने उससे बहुत आग्रह किया कि वह भाइयों के साथ तुम्हारे पास आए; पर अभी आने की उसकी इच्छा बिल्कुल नहीं थी। फिर भी, जब उसे अनुकूल अवसर मिलेगा, वह आएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ δὲ Ἀπολλῶ τοῦ ἀδελφοῦ
  choice: भाई अपुल्लोस के विषय में
  rationale: περὶ δὲ नए विषय की ओर संक्रमण करता है। τοῦ ἀδελφοῦ में कोई स्पष्ट संबंधवाचक सर्वनाम नहीं है; हिन्दी में नाम से पहले ‘भाई’ स्वाभाविक रूप से उसके मसीही सहकर्मी होने का भाव व्यक्त करता है, बिना ‘हमारे’ जोड़े।
- source_word: πολλὰ παρεκάλεσα αὐτὸν
  choice: मैंने उससे बहुत आग्रह किया
  rationale: πολλὰ आग्रह की तीव्रता को बढ़ाता है; यह हिन्दी में सहज और स्रोत के निकट है।
- source_word: ἵνα ἔλθῃ πρὸς ὑμᾶς μετὰ τῶν ἀδελφῶν
  choice: कि वह भाइयों के साथ तुम्हारे पास आए
  rationale: ἵνα उपवाक्य आग्रह की विषयवस्तु बताता है। ‘भाइयों’ यहाँ संभवतः यात्रा करने वाले विशिष्ट पुरुष सहकर्मियों को सूचित करता है।
- source_word: καὶ πάντως οὐκ ἦν θέλημα ἵνα νῦν ἔλθῃ
  choice: पर अभी आने की उसकी इच्छा बिल्कुल नहीं थी
  rationale: πάντως निषेध को प्रबल करता है। θέλημα को संज्ञात्मक ‘इच्छा’ से व्यक्त किया गया है और निकटतम स्वाभाविक संदर्भ अपुल्लोस है।
- source_word: ἐλεύσεται δὲ ὅταν εὐκαιρήσῃ
  choice: फिर भी, अवसर मिलने पर वह आएगा
  rationale: δέ हल्का विरोध दर्शाता है और εὐκαιρέω अनुकूल अवसर या उचित समय मिलने का भाव देता है, केवल निजी सुविधा का नहीं।
theological_decisions:
- issue: οὐκ ἦν θέλημα में इच्छा किसकी है
  choice: इसे अपुल्लोस की अपनी इच्छा माना गया है।
  alternative: इसे परमेश्वर की इच्छा या किसी अस्पष्ट निरपेक्ष इच्छा के रूप में समझना।
  rationale: निकटतम और सबसे स्वाभाविक संदर्भ अपुल्लोस है, जिससे पौलुस ने आने का आग्रह किया था। तत्काल संदर्भ परमेश्वर की इच्छा की ओर कोई संकेत नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। पाठकों को संबोधित करने के लिए बहुवचन ‘तुम्हारे’ चुना गया है, जो यूनानी ὑμᾶς की बहुवचनता स्पष्ट रखता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
