language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ θέλω γὰρ ὑμᾶς ἄρτι ἐν παρόδῳ ἰδεῖν, ἐλπίζω ⸀γὰρ χρόνον τινὰ ἐπιμεῖναι πρὸς ὑμᾶς, ἐὰν ὁ κύριος ⸀ἐπιτρέψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/007.yaml
  text: For I do not want to see you now in passing[a], for I hope to remain with you for some time, if the Lord permits.
translation:
  language: hi
  text: क्योंकि मैं इस समय तुमसे केवल आते-जाते नहीं मिलना चाहता; बल्कि मुझे आशा है कि, यदि प्रभु अनुमति दें, तो मैं कुछ समय तुम्हारे साथ रहूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ θέλω
  choice: मैं ... नहीं देखना चाहता
  rationale: यहाँ θέλω पौलुस की इच्छा और मंशा व्यक्त करता है; ‘नहीं ... चाहता’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἄρτι
  choice: अब
  rationale: यह वर्तमान समय और परिस्थिति को संक्षेप में व्यक्त करता है।
- source_word: ἐν παρόδῳ
  choice: केवल रास्ते में थोड़ी देर के लिए
  rationale: वाक्यांश यात्रा के दौरान होने वाली संक्षिप्त भेंट का बोध कराता है; हिन्दी में यह अर्थ ‘चलते-चलते’ की अपेक्षा अधिक स्पष्ट और गरिमापूर्ण है।
- source_word: ἰδεῖν
  choice: देखना
  rationale: मूल क्रिया का सीधा अर्थ ‘देखना’ है, जबकि प्रसंग में मिलने या भेंट करने का भाव भी स्वतः समझ में आता है।
- source_word: ἐλπίζω
  choice: मुझे आशा है
  rationale: यह इच्छा के साथ अनिश्चित अपेक्षा व्यक्त करता है, न कि निश्चित योजना।
- source_word: χρόνον τινὰ
  choice: कुछ समय
  rationale: यह अनिश्चित, पर सार्थक अवधि का स्वाभाविक हिन्दी रूप है।
- source_word: ἐπιμεῖναι
  choice: रहूँगा
  rationale: ἐπιμένω किसी स्थान या लोगों के साथ बने रहने को दर्शाता है; ‘रहना’ आधुनिक हिन्दी में सहज है।
- source_word: πρὸς ὑμᾶς
  choice: तुम्हारे साथ
  rationale: ठहरने की क्रिया के साथ यह उनकी संगति और उपस्थिति में रहने का भाव देता है।
- source_word: ἐὰν ὁ κύριος ἐπιτρέψῃ
  choice: यदि प्रभु अनुमति दें
  rationale: यह योजना को प्रभु की अनुमति पर निर्भर बताने वाली शर्त को यथावत रखता है।
- source_word: κύριος
  choice: प्रभु
  rationale: परंपरागत और स्वाभाविक हिन्दी समतुल्य; मूल पाठ की तरह संदर्भित व्यक्ति को और विशिष्ट नहीं करता।
theological_decisions:
- issue: ‘प्रभु’ का संदर्भ
  choice: केवल ‘प्रभु’ रखा गया है।
  alternative: ‘प्रभु यीशु’ या ‘परमेश्वर’
  rationale: यूनानी पाठ κύριος कहता है और संदर्भ को स्पष्ट रूप से सीमित नहीं करता; अनुवाद इस खुलापन को बनाए रखता है।
translation_notes:
  register: 'आधुनिक मानक हिन्दी, आत्मीय बहुवचन ‘तुम’, और साधारण पाठकों के लिए स्पष्ट किन्तु गरिमापूर्ण शैली। ‘केवल’ और ‘बल्कि’ से प्रसंग में निहित विरोध स्पष्ट किया गया है: पौलुस भेंट से इनकार नहीं करता, बल्कि केवल संक्षिप्त भेंट नहीं चाहता।'
