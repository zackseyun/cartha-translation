lexical_decisions:
- source_word: ἀνέπαυσαν
  choice: ताज़गी दी
  rationale: यहाँ क्रिया शाब्दिक विश्राम नहीं, बल्कि भीतरी राहत और नवबल देने को व्यक्त करती है। ‘ताज़गी दी’ आधुनिक हिन्दी में स्वाभाविक है और रूपक का भाव बनाए रखती है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण बताता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: इस प्रसंग में πνεῦμα व्यक्ति के भीतरी अस्तित्व या भाव-दशा की ओर संकेत करता है, पवित्र आत्मा की ओर नहीं। ‘आत्मा’ पौलुस की अभिव्यक्ति को बनाए रखता है, जबकि संदर्भ उसके अर्थ को स्पष्ट करता है।
- source_word: τὸ ἐμὸν πνεῦμα καὶ τὸ ὑμῶν
  choice: मेरी आत्मा को और आपकी आत्मा को भी
  rationale: यूनानी में दूसरे खंड में ‘आत्मा’ अध्याहृत है। हिन्दी में उसे दोहराने से अर्थ साफ रहता है और ‘मेरी’ तथा ‘आपकी’ दोनों आत्माओं का समानांतर संबंध सुरक्षित रहता है।
- source_word: ἐπιγινώσκετε
  choice: उचित मान्यता दें
  rationale: यहाँ आशय केवल पहचान लेने से बढ़कर ऐसे सेवकों के योगदान को स्वीकार करने का है। ‘उचित मान्यता दें’ इस अर्थ को व्यक्त करता है, पर इसे औपचारिक सम्मान की आज्ञा तक नहीं बढ़ाता।
- source_word: οὖν
  choice: इसलिए
  rationale: οὖν पिछले कथन से निकला निष्कर्ष प्रस्तुत करता है; ‘इसलिए’ आधुनिक हिन्दी में सहज निष्कर्षसूचक है।
- source_word: τοὺς τοιούτους
  choice: ऐसे पुरुषों को
  rationale: निकटवर्ती संदर्भ में यह स्तिफनास, फूरतूनातुस और अखइकुस नामक पुरुषों की ओर संकेत करता है। इसलिए पुल्लिंग और विशिष्ट संदर्भ को बनाए रखा गया है।
theological_decisions:
- issue: τοὺς τοιούτους का लिंग-संबंधी अनुवाद
  choice: ऐसे पुरुषों को
  alternative: ऐसे लोगों को / इनके जैसे लोगों को
  rationale: यद्यपि यह अभिव्यक्ति अन्य प्रसंगों में सामान्य अर्थ रख सकती है, यहाँ यह ठीक पहले उल्लिखित पुरुष सहकर्मियों की ओर लौटती है। अतः अनुवाद संदर्भगत पुल्लिंग को अस्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आत्मा’ मूल रूपक को सुरक्षित रखता है, जबकि ‘ताज़गी दी’ उसके भीतरी राहत और नवबल के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
