translation:
  language: hi
  text: सतर्क रहो, विश्वास में दृढ़ खड़े रहो, साहसी बनो[a], मज़बूत बनो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “पुरुषों जैसा आचरण करो”; यूनानी मुहावरे का आशय साहसी या वीर होना है।'
    reason: lexical_alternative
  - marker: b
    text: 'या: “मज़बूत किए जाओ।” यूनानी क्रिया निष्क्रिय वाच्य में है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γρηγορεῖτε
  choice: जागते रहो
  rationale: वर्तमानकालीन बहुवचन आज्ञा निरन्तर चौकसी का आह्वान करती है। ‘जागते रहो’ शारीरिक जागरण से आगे सतर्कता का स्वाभाविक हिन्दी मुहावरा है।
- source_word: στήκετε
  choice: दृढ़ खड़े रहो
  rationale: यह क्रिया केवल खड़े होने के बजाय अटल और स्थिर बने रहने का भाव रखती है; ‘दृढ़ खड़े रहो’ उस रूपक को बनाए रखता है।
- source_word: ἐν τῇ πίστει
  choice: विश्वास में
  rationale: सवर्ती पदबंध मसीही विश्वास के क्षेत्र अथवा उसकी स्वीकारोक्ति की ओर संकेत कर सकता है। हिन्दी में ‘विश्वास में’ स्वाभाविक है और अनावश्यक रूप से केवल आत्मगत भरोसे या केवल सिद्धान्त-संग्रह में अर्थ को सीमित नहीं करता।
- source_word: ἀνδρίζεσθε
  choice: साहस दिखाओ
  rationale: क्रिया का शाब्दिक चित्र ‘पुरुषों जैसा आचरण करो’ है, पर यूनानी मुहावरे में आशय वीरता और साहस से काम लेना है। आधुनिक हिन्दी में ‘साहस दिखाओ’ अर्थ को स्पष्ट और सभी सम्बोधित विश्वासियों के लिए स्वाभाविक रखता है; शाब्दिक लैंगिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: κραταιοῦσθε
  choice: बलवन्त होते जाओ
  rationale: वर्तमान निष्क्रिय आज्ञार्थक रूप बल प्राप्त करने या बलवन्त किए जाने का भाव दे सकता है। ‘बलवन्त होते जाओ’ निरन्तरता और निष्क्रिय/मध्यवर्ती अस्पष्टता को ‘बलवान रहो’ की अपेक्षा अधिक अच्छी तरह बनाए रखता है।
theological_decisions:
- issue: πίστις का अर्थ
  choice: विश्वास में
  alternative: उस विश्वास में
  rationale: लेख के कारण मसीही विश्वास या स्वीकारोक्ति का सामूहिक अर्थ सम्भव है, किन्तु हिन्दी में निश्चितता दिखाने के लिए ‘उस’ जोड़ना अनावश्यक व्याख्यात्मक संकुचन होगा। ‘विश्वास में’ दोनों—विश्वास की प्रतिबद्धता और मसीही विश्वास के क्षेत्र—की सम्भावना खुली रखता है।
- issue: ἀνδρίζεσθε का लैंगिक मुहावरा
  choice: साहस दिखाओ
  alternative: पुरुषों जैसा आचरण करो
  rationale: यह आज्ञा पूरी कलीसिया को सम्बोधित है और प्राचीन लैंगिक मुहावरे का कार्य साहसी होने का आह्वान करना है। मुख्य पाठ में शाब्दिक चित्र रखने से आधुनिक हिन्दी में आशय विकृत या महिलाओं को अलग करने वाला समझा जा सकता है; इसलिए उसका शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: κραταιοῦσθε की निष्क्रिय वाच्यता
  choice: बलवन्त होते जाओ
  alternative: बलवन्त किए जाओ
  rationale: यूनानी रूप व्याकरणतः निष्क्रिय है, पर कर्ता यहाँ व्यक्त नहीं है। मुख्य पाठ निष्क्रियता और प्रक्रिया का संकेत देता है, जबकि अधिक स्पष्ट निष्क्रिय विकल्प पादटिप्पणी में है ताकि किसी अकथित कर्ता को अनिवार्य न बनाया जाए।
translation_notes:
  register: वाक्य को चार संक्षिप्त, समानान्तर बहुवचन आज्ञाओं के रूप में रखा गया है। भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। ‘बलवन्त’ बाइबलीय गरिमा बनाए रखते हुए सामान्य हिन्दी में समझ में आता है; ‘होते जाओ’ मूल के निरन्तर आज्ञार्थक बल को व्यक्त करता है।
