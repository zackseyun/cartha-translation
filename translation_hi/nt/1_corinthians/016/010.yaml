  text: Ἐὰν δὲ ἔλθῃ Τιμόθεος, βλέπετε ἵνα ἀφόβως γένηται πρὸς ὑμᾶς, τὸ γὰρ ἔργον κυρίου ἐργάζεται ὡς ⸀κἀγώ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/010.yaml
  text: If Timothy comes[a], see that he may be with you without fear, for he is doing the Lord’s work[b], as I also am.
translation:
  language: hi
  text: यदि तीमुथियुस आए, तो इस बात का ध्यान रखना कि वह तुम्हारे बीच निडर होकर रह सके[a], क्योंकि वह प्रभु का काम करता है, जैसा मैं भी करता हूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह तुम्हारे साथ निर्भय होकर रह सके।” यूनानी अभिव्यक्ति तुम्हारे बीच उसकी उपस्थिति और भय से मुक्त दशा, दोनों पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि वह भी मेरी तरह प्रभु का काम कर रहा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν δὲ ἔλθῃ Τιμόθεος
  choice: यदि तीमुथियुस आए
  rationale: ἐάν के साथ aorist subjunctive भविष्य की वास्तविक संभावना व्यक्त करता है। δέ यहाँ हल्का संक्रमण है; हिंदी में अलग संयोजक जोड़ना आवश्यक नहीं।
- source_word: βλέπετε ἵνα
  choice: तो ध्यान रखना कि
  rationale: आज्ञार्थक βλέπετε सक्रिय सावधानी और जिम्मेदारी की मांग करता है; यह हिंदी में स्वाभाविक रूप से आगामी आशय-वाक्य से जुड़ता है।
- source_word: ἀφόβως γένηται πρὸς ὑμᾶς
  choice: वह तुम्हारे बीच निडर होकर रह सके
  rationale: γένηται πρὸς ὑμᾶς उसकी उनके बीच उपस्थिति और दशा दोनों को व्यक्त करता है। ‘रह सके’ ἵνα के आशय को और ‘निडर होकर’ ἀφόβως को स्वाभाविक हिंदी में रखता है।
- source_word: τὸ γὰρ ἔργον κυρίου ἐργάζεται
  choice: क्योंकि वह ... प्रभु का काम कर रहा है
  rationale: संज्ञा और उसी मूल की क्रिया की यूनानी पुनरुक्ति को शब्दशः दोहराने के बजाय वर्तमान, जारी गतिविधि को स्पष्ट और स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: ὡς κἀγώ
  choice: वह भी मेरी तरह
  rationale: κἀγώ में καί का ‘भी’ सुरक्षित रखा गया है और तुलना को हिंदी की स्वाभाविक शब्द-व्यवस्था में क्रिया से पहले रखा गया है।
theological_decisions:
- issue: κυρίου में ‘प्रभु’ का संदर्भ
  choice: ‘प्रभु’ को बिना अतिरिक्त पहचान के रखा गया
  alternative: मुख्य पाठ में ‘प्रभु यीशु’ कहना
  rationale: पौलुस के प्रयोग में संदर्भ संभवतः यीशु है, पर यूनानी पाठ केवल κυρίου कहता है; इसलिए अनुवाद उसकी अभिव्यक्ति को ही सुरक्षित रखता है।
- issue: तीमुथियुस के काम की पौलुस के काम से तुलना
  choice: ‘वह भी मेरी तरह प्रभु का काम कर रहा है’
  alternative: ‘जैसा मैं भी करता हूँ’
  rationale: दोनों सेवकों को एक ही प्रभु के काम में संलग्न दिखाया गया है; तुलना को न तो पदानुक्रम में बदला गया है, न समानता से अधिक अर्थ दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और पास्तरीय लहजा। ‘तीमुथियुस’ पारंपरिक हिंदी बाइबलीय नाम-रूप है; ‘निडर होकर रह सके’ भय से मुक्त उपस्थिति और समुदाय की जिम्मेदारी दोनों को संप्रेषित करता है।
