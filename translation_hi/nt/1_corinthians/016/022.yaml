  text: If anyone does not love the Lord[a], let him be accursed[b]. Marana tha.
translation:
  language: hi
  text: यदि कोई प्रभु से प्रेम नहीं करता, तो वह शापित हो[a]। माराना था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या पारंपरिक शब्द: ‘अनाथेमा’; अर्थात शाप के अधीन।'
    reason: lexical_alternative
  - marker: b
    text: 'अरामी भाषा की अभिव्यक्ति। संभव अर्थ: ‘हे हमारे प्रभु, आ!’ या ‘हमारा प्रभु आ गया है।’'
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: प्रेम नहीं करता
  rationale: φιλέω यहाँ प्रभु के प्रति व्यक्तिगत प्रेम को व्यक्त करता है। ‘प्रेम करना’ स्वाभाविक, स्पष्ट और अर्थ की अनावश्यक संकीर्णता से मुक्त हिन्दी है।
- source_word: κύριον
  choice: प्रभु
  rationale: इस पौलुसी संदर्भ में κύριος यीशु के लिए प्रयुक्त उपाधि है। ‘प्रभु’ इसके मसीह-संबंधी भार और नए नियम के प्रचलित प्रयोग को सुरक्षित रखता है।
- source_word: ἤτω
  choice: हो
  rationale: εἰμί का वर्तमान आज्ञार्थक रूप यहाँ आदेशात्मक अथवा न्याय-घोषणात्मक अर्थ देता है। ‘हो’ हिन्दी में इस गंभीर बल को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀνάθεμα
  choice: शापित
  rationale: ἀνάθεμα किसी को शाप के अधीन अथवा विनाश के लिए ठहराया हुआ बताता है। ‘शापित’ आधुनिक पाठक के लिए स्पष्ट है और कथन की गंभीरता बनाए रखता है; पारंपरिक ‘अनातेमा’ को पादटिप्पणी में रखा गया है।
- source_word: Μαράνα θά
  choice: माराना था
  rationale: यह यूनानी अक्षरों में सुरक्षित अरामी अभिव्यक्ति है। इसके विभाजन और अर्थ पर मतभेद होने के कारण मुख्य पाठ में लिप्यंतरण रखा गया है और प्रमुख अर्थ-संभावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: अरामी अभिव्यक्ति Μαράνα θά का अर्थ
  choice: मुख्य पाठ में लिप्यंतरण ‘माराना था’ बनाए रखा गया है।
  alternative: ‘हे हमारे प्रभु, आ!’ अथवा ‘हमारा प्रभु आ गया है।’
  rationale: अभिव्यक्ति का पाठ स्थिर है, पर अरामी शब्द-विभाजन के कारण उसका सटीक अर्थ विवादित है। लिप्यंतरण उसके आराधनात्मक या उद्घोषणात्मक स्वरूप और वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गंभीर रखी गई है। ‘यदि कोई’ मूल की सर्वसमावेशी अनिश्चितता बनाए रखता है, और ‘वह शापित हो’ न्याय-घोषणा की कठोरता को नरम किए बिना स्वाभाविक हिन्दी देता है।
