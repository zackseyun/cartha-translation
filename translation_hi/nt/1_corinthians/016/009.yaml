  text: θύρα γάρ μοι ἀνέῳγεν μεγάλη καὶ ἐνεργής, καὶ ἀντικείμενοι πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/016/009.yaml
  text: For a great and effective door has opened to me[a], and there are many opponents.
translation:
  language: hi
  text: क्योंकि मेरे लिए एक बड़ा और प्रभावकारी द्वार खुला है[a], और विरोध करने वाले बहुत हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे लिए एक बड़ा और प्रभावकारी अवसर खुला है।” पौलुस सेवाकार्य के खुले अवसर के लिए “द्वार” का रूपक प्रयोग करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: द्वार
  rationale: मूल शब्द का शाब्दिक अर्थ ‘द्वार’ है और यहाँ सेवाकार्य के खुले अवसर के रूपक के तौर पर प्रयुक्त है। ‘द्वार’ रखने से मूल बिंब सुरक्षित रहता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह आसपास के संदर्भ में पौलुस की योजना का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μοι
  choice: मेरे लिए
  rationale: सम्प्रदान कारक पौलुस के व्यक्तिगत संबंध अथवा लाभ को दर्शाता है; ‘मेरे लिए’ हिन्दी में स्वाभाविक है।
- source_word: ἀνέῳγεν
  choice: खुला है
  rationale: पूर्णकालीन रूप पहले हुए खुलने और उसके वर्तमान परिणाम—द्वार का अब भी खुला होना—को दर्शाता है। ‘खुला है’ इस स्थिति को सहज हिन्दी में रखता है और कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: μεγάλη
  choice: बड़ा
  rationale: यह द्वार के महत्व और व्यापकता को व्यक्त करता है। ‘बड़ा’ रूपक को बनाए रखते हुए दोनों अर्थ-संभावनाएँ खुली रखता है।
- source_word: ἐνεργής
  choice: प्रभावकारी
  rationale: यह उस खुले द्वार के सक्रिय, फलदायी या परिणामकारी होने को बताता है। ‘प्रभावकारी’ सेवाकार्य की व्याख्या को पाठ में पूरी तरह समतल किए बिना यह भाव देता है।
- source_word: ἀντικείμενοι
  choice: विरोध करनेवाले
  rationale: कृदन्त यहाँ संज्ञा की तरह उन लोगों के लिए है जो पौलुस और उसके कार्य का विरोध करते हैं। यह अनुवाद सक्रिय विरोध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πολλοί
  choice: बहुत
  rationale: यह विरोध करनेवालों की बड़ी संख्या को सीधे और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सेवाकार्य के अवसर के लिए ‘द्वार’ का रूपक
  choice: व्याख्यात्मक ‘अवसर’ के बजाय मूल रूपक ‘द्वार’ बनाए रखा गया।
  alternative: क्योंकि मेरे लिए एक बड़ा और प्रभावकारी अवसर खुला है।
  rationale: मूल यूनानी पाठ पौलुस का परिचित रूपक रखता है। इसे बनाए रखने से बिंब और उसकी अर्थगत व्यापकता सुरक्षित रहती है तथा पाठक संदर्भ से सेवाकार्य का आशय समझ सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘द्वार’ मूल रूपक को और ‘विरोध करनेवाले’ सक्रिय प्रतिरोध को स्पष्ट रूप से सुरक्षित रखते हैं।
