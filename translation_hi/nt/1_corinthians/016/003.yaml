  yaml_path: translation/nt/1_corinthians/016/003.yaml
  text: And when I arrive[b][a], I will send with letters those whom you approve to carry your gift to Jerusalem.
translation:
  language: hi
  text: और जब मैं आऊँगा, तो जिन्हें आप योग्य ठहराएँगे, उन्हें पत्र देकर यरूशलेम भेजूँगा, ताकि वे आपकी भेंट[a] वहाँ पहुँचा दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आपकी उदार भेंट’। यूनानी शब्द का अर्थ ‘अनुग्रह’ भी हो सकता है, पर यहाँ उसका संकेत यरूशलेम भेजे जाने वाले योगदान की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ παραγένωμαι
  choice: और जब मैं आऊँगा
  rationale: ὅταν के साथ अओरिस्ट सब्जंक्टिव भविष्य की अपेक्षित स्थिति व्यक्त करता है। δέ यहाँ हल्का संयोजक है, इसलिए ‘और’ प्रसंग के प्रवाह को स्वाभाविक रूप से बनाए रखता है।
- source_word: οὓς ἐὰν δοκιμάσητε
  choice: जिन्हें आप योग्य ठहराएँगे
  rationale: δοκιμάζω जाँचकर स्वीकार या अनुमोदित करने का भाव रखता है। प्रतिनिधियों के चयन के प्रसंग में ‘योग्य ठहराना’ मूल्यांकन और स्वीकृति दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δι’ ἐπιστολῶν
  choice: उन्हें पत्र देकर
  rationale: διά के साथ संबंधकारक साधन या साथ दी गई वस्तु का बोध कराता है। ‘पत्र देकर’ स्पष्ट करता है कि चुने हुए प्रतिनिधि पत्रों के साथ भेजे जाएँगे; पत्रों को विशेष रूप से ‘सिफारिशी’ कहना मूल से अधिक व्याख्यात्मक होता।
- source_word: τούτους πέμψω
  choice: उन्हें ... यरूशलेम भेजूँगा
  rationale: τούτους पहले उल्लिखित स्वीकृत व्यक्तियों की ओर बलपूर्वक संकेत करता है। हिन्दी में ‘उन्हें’ इस पुनरुक्त संकेत को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: ἀπενεγκεῖν
  choice: ताकि वे ... वहाँ पहुँचा दें
  rationale: यह infinitive भेजने का उद्देश्य व्यक्त करता है। ‘पहुँचा दें’ दान को कुरिन्थ से यरूशलेम ले जाकर सौंपने का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: τὴν χάριν ὑμῶν
  choice: आपकी भेंट
  rationale: इस संग्रह के प्रसंग में χάρις यरूशलेम के विश्वासियों के लिए दी जा रही ठोस सहायता या दान को दर्शाता है। ‘भेंट’ उदारतापूर्वक दी गई वस्तु का भाव रखता है, जबकि शब्द की व्यापक अर्थ-छाया पादटिप्पणी में सुरक्षित है।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम ... वहाँ
  rationale: εἰς गंतव्य बताता है। हिन्दी वाक्य-विन्यास में ‘यरूशलेम भेजूँगा ... वहाँ पहुँचा दें’ गंतव्य और उद्देश्य दोनों को स्पष्ट करता है।
theological_decisions:
- issue: संग्रह के प्रसंग में χάρις का अर्थ
  choice: यरूशलेम के लिए दी गई भौतिक भेंट या सहायता
  alternative: अनुग्रह अथवा उदारता का कार्य
  rationale: 1 कुरिन्थियों 16 में प्रसंग पवित्र लोगों के लिए धन-संग्रह का है; इसलिए यहाँ χάρις एक वास्तविक योगदान को सूचित करता है। फिर भी शब्द में अनुग्रहपूर्ण उदारता की अर्थ-छाया है, जिसे पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। ‘पत्र देकर’ पत्रों के प्रकार को अनावश्यक रूप से निर्धारित नहीं करता, और ‘भेंट’ तत्काल प्रसंग में ठोस योगदान को स्पष्ट रखते हुए धार्मिक शब्दावली का अतिरेक टालता है।
