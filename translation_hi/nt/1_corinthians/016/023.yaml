  text: प्रभु यीशु का अनुग्रह तुम्हारे साथ रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस की आशीर्वचन-शैली में यह परमेश्वर या प्रभु की कृपापूर्ण भलाई और आशीष को व्यक्त करने वाला प्रमुख शब्द है। ‘अनुग्रह’ आधुनिक हिन्दी बाइबलीय भाषा में स्वाभाविक और अर्थगर्भित समतुल्य है।
- source_word: κύριος
  choice: प्रभु
  rationale: यह यीशु की अधिकारपूर्ण उपाधि है। ‘प्रभु’ नए नियम के मसीही संदर्भ और हिन्दी प्रयोग दोनों में उपयुक्त है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: μεθ’ ὑμῶν
  choice: तुम्हारे साथ रहे
  rationale: यूनानी में शाब्दिक रूप से ‘तुम्हारे साथ’ है और क्रिया निहित है। हिन्दी आशीर्वचन को पूरा और स्वाभाविक बनाने के लिए ‘रहे’ जोड़ा गया है।
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: प्रभु यीशु का
  rationale: सम्बन्धकारक संरचना को निकटता से बनाए रखते हुए इसे स्वाभाविक हिन्दी में अधिकार/सम्बन्ध के रूप में व्यक्त किया गया है; इससे स्रोत का सम्भावित भाव भी बना रहता है।
theological_decisions:
- issue: बिना व्यक्त क्रिया वाला आशीर्वचन
  choice: 'निहित इच्छार्थक भाव को ‘रहे’ से व्यक्त किया गया: ‘प्रभु यीशु का अनुग्रह तुम्हारे साथ रहे।’'
  alternative: ‘प्रभु यीशु का अनुग्रह तुम्हारे साथ।’
  rationale: यूनानी वाक्य क्रियारहित है, पर प्रसंग में इसका आशीर्वचनात्मक इच्छार्थ स्पष्ट है। आधुनिक हिन्दी में ‘रहे’ जोड़ने से वही भाव स्वाभाविक रूप से व्यक्त होता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक दावा जोड़े।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम्हारे’ बहुवचन समुदाय को सम्बोधित करता है। कोई पादटिप्पणी आवश्यक नहीं है।
