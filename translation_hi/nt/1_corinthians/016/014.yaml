lexical_decisions:
- source_word: πάντα
  choice: हर काम
  rationale: नपुंसकलिंग बहुवचन यहाँ व्यापक अर्थ रखता है। ὑμῶν के साथ मिलकर ‘तुमसे संबंधित सब कुछ’ या प्रसंगानुसार ‘तुम्हारा हर काम’ का भाव देता है; यह आधुनिक हिन्दी में स्वाभाविक है और व्यापकता बनाए रखता है।
- source_word: ὑμῶν
  choice: तुम्हारा
  rationale: संबंधकारक सर्वनाम πάντα के साथ संक्षिप्त/अध्याहृत रचना बनाता है—शाब्दिक रूप से ‘तुम्हारी सब बातें/वस्तुएँ’। ‘तुम्हारा हर काम’ हिन्दी में उस निहित कर्मगत अर्थ को सहज रूप से व्यक्त करता है।
- source_word: ἐν ἀγάπῃ
  choice: प्रेम में
  rationale: ἐν यहाँ रीति या क्षेत्र दोनों का संकेत दे सकता है। ‘प्रेम में’ मूल रूपक और संभावित अर्थ-विस्तार को ‘प्रेम से’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: γινέσθω
  choice: किया जाए
  rationale: γίνομαι का वर्तमान मध्य/कर्मवाच्य आज्ञार्थक रूप उपदेशात्मक आग्रह व्यक्त करता है। ‘किया जाए’ हर काम के साथ स्वाभाविक हिन्दी है और ‘होने पाए/हो’ की आज्ञार्थक शक्ति को व्यक्त करता है।
