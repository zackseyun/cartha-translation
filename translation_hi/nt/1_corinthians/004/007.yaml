id: 1CO.4.7
reference: 1 Corinthians 4:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τίς γάρ σε διακρίνει; τί δὲ ἔχεις ὃ οὐκ ἔλαβες; εἰ δὲ καὶ ἔλαβες, τί καυχᾶσαι ὡς μὴ λαβών;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/007.yaml
  text: For who makes you different? And what do you have that you did not receive? And if you did receive it[a], why do you boast as if you had not received it?
translation:
  language: hi
  text: क्योंकि कौन तुम्हें दूसरों से अलग बनाता है?[a] और तुम्हारे पास ऐसा क्या है जो तुम्हें मिला नहीं? और यदि तुम्हें मिला है, तो तुम ऐसा घमंड क्यों करते हो मानो तुम्हें मिला ही न हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कौन तुम्हें विशिष्ट ठहराता है?” यूनानी क्रिया का अर्थ “अलग करना,” “भिन्न ठहराना” या “विशिष्ट बनाना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γάρ σε διακρίνει
  choice: क्योंकि कौन तुम्हें दूसरों से अलग बनाता है?
  rationale: διακρίνει सकर्मक रूप में किसी को अलग, भिन्न या विशिष्ट ठहराने का भाव दे सकता है। प्रसंग में प्रश्न कुरिन्थियों के दूसरों से श्रेष्ठ होने के दावे का आधार चुनौती देता है। γάρ को ‘क्योंकि’ से व्यक्त किया गया है, क्योंकि यह पिछले उलाहने का कारण प्रस्तुत करता है।
- source_word: τί δὲ ἔχεις
  choice: और तुम्हारे पास ऐसा क्या है
  rationale: δὲ यहाँ हल्का संयोजक है; प्रश्नों की स्वाभाविक हिन्दी शृंखला में ‘और’ उपयुक्त है।
- source_word: ὃ οὐκ ἔλαβες
  choice: जो तुम्हें मिला नहीं
  rationale: ἔλαβες प्राप्त करने की पूर्ण घटना की ओर संकेत करता है। ‘तुम्हें मिला’ सहज हिन्दी में इस बात को स्पष्ट करता है कि जो कुछ उनके पास है वह स्वयं उत्पन्न नहीं, बल्कि प्राप्त है।
- source_word: εἰ δὲ καὶ ἔλαβες
  choice: और यदि तुम्हें मिला है
  rationale: εἰ...καὶ यहाँ प्राप्त होने की बात पर बल देता है। हिन्दी में शर्त और प्रसंगगत बल सहज रूप से बने रहते हैं; अलग सर्वनाम जोड़ने की आवश्यकता नहीं है।
- source_word: τί καυχᾶσαι
  choice: तुम ऐसा घमंड क्यों करते हो
  rationale: καυχᾶσαι वर्तमानकालीन रवैये को डाँटता है। ‘घमंड करना’ आधुनिक सामान्य हिन्दी में पौलुस की नकारात्मक आलोचना को स्पष्ट रूप से व्यक्त करता है।
- source_word: ὡς μὴ λαβών
  choice: मानो तुम्हें मिला ही न हो
  rationale: यह कृदन्तीय वाक्यांश तथ्य के विपरीत ढंग को व्यक्त करता है। ‘ही’ इस विडंबना पर स्वाभाविक हिन्दी बल देता है कि वे पानेवाले होकर भी ऐसे घमंड करते हैं जैसे उन्होंने पाया न हो।
theological_decisions:
- issue: मानवीय श्रेष्ठता और प्राप्त वस्तुओं के विषय में पौलुस की डाँट का दायरा
  choice: वचन को इतना व्यापक रखा गया है कि हर भिन्नता, उपलब्धि, योग्यता या स्थिति को प्राप्त माना जा सके, पर किसी एक श्रेणी तक सीमित न किया जाए।
  alternative: इसे केवल आत्मिक वरदानों अथवा सेवकाई के पदों के बारे में समझना; या इसे स्पष्ट रूप से हर मानवीय क्षमता और आशीष पर लागू करना।
  rationale: निकटवर्ती प्रसंग प्रेरिताई सेवा, दलगत घमंड और प्रतिष्ठा से संबंधित है, किंतु पौलुस के प्रश्न सामान्य शब्दों में हैं। अनुवाद न तो अर्थ को केवल आत्मिक वरदानों तक सीमित करता है और न मूल पाठ से अधिक विस्तार स्पष्ट रूप से जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लगातार तीन आलंकारिक प्रश्नों की तीक्ष्णता सुरक्षित है। ‘तुम’ एकवचन के अनुरूप प्रयुक्त हुआ है, जैसा यूनानी σε और क्रियाओं में है, यद्यपि संबोधन समुदाय के प्रतिनिधि व्यक्ति से है।
