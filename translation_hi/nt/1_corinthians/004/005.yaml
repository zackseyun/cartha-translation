source:
  edition: SBLGNT
  text: ὥστε μὴ πρὸ καιροῦ τι κρίνετε, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν, καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/005.yaml
  text: Therefore[a], do not judge anything before the time, until the Lord comes, who will also bring to light the hidden things of darkness and reveal the purposes of the hearts[c][b]. Then each one’s praise will come from God.
translation:
  language: hi
  text: इसलिए समय से पहले[a] किसी भी बात का न्याय न करो, जब तक प्रभु न आए। वह अन्धकार की छिपी हुई बातों को प्रकाश में लाएगा और हृदयों के अभिप्राय[b] प्रकट करेगा। तब[c] हर एक को परमेश्वर की ओर से प्रशंसा मिलेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘उचित समय से पहले’ या ‘जल्दबाज़ी में’ भी हो सकता है; यूनानी पद उचित समय आने से पहले कार्य करने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हृदयों के इरादे’ अथवा ‘हृदयों की मंशाएँ’।
    reason: lexical_alternative
  - marker: c
    text: अर्थात, प्रभु के आने पर उनके अंतिम मूल्यांकन के समय, जब वह छिपी हुई बातों को प्रकट करेगा।
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पहले के तर्क से निकला निष्कर्ष सूचित करता है और हिन्दी में उसका स्वाभाविक तार्किक सम्बन्ध बनाए रखता है।
- source_word: μὴ πρὸ καιροῦ
  choice: समय से पहले ... न करो
  rationale: πρὸ καιροῦ उचित समय आने से पहले कार्य करने का भाव देता है; मूल में ‘ठहराया हुआ’ स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: τι κρίνετε
  choice: किसी बात का न्याय न करो
  rationale: τι निषेध को व्यापक बनाता है। ‘न्याय’ κρίνω के मूल्यांकन अथवा निर्णय देने के भाव को खुला रखता है।
- source_word: ἕως ἂν ἔλθῃ ὁ κύριος
  choice: जब तक प्रभु न आए
  rationale: यह निषेध की समय-सीमा बताता है और प्रभु के भावी आगमन की ओर संकेत करता है।
- source_word: φωτίσει τὰ κρυπτὰ τοῦ σκότους
  choice: अन्धकार की छिपी हुई बातों को प्रकाश में लाएगा
  rationale: प्रकाश और अन्धकार की मूल रूपकात्मक भाषा तथा छिपी बातों के प्रकट किए जाने का अर्थ दोनों सुरक्षित रहते हैं।
- source_word: φανερώσει τὰς βουλὰς τῶν καρδιῶν
  choice: हृदयों के अभिप्राय प्रकट करेगा
  rationale: βουλαί योजनाओं, उद्देश्यों या इरादों को व्यक्त कर सकता है। ‘अभिप्राय’ इस अर्थ-परास को अनावश्यक रूप से केवल मनोवैज्ञानिक ‘मंशा’ तक सीमित नहीं करता।
- source_word: ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ
  choice: हर एक की प्रशंसा परमेश्वर की ओर से होगी
  rationale: यह यूनानी वाक्य के वितरणात्मक ‘हर एक’ और प्रशंसा के स्रोत ‘परमेश्वर की ओर से’ को स्पष्ट तथा निकट रूप में रखता है।
theological_decisions:
- issue: न्याय का दायरा और समय
  choice: यहाँ समय से पहले किए जाने वाले मानवीय न्याय को प्रभु के भावी आगमन और प्रकाशन की प्रतीक्षा में रोका गया है।
  alternative: हर प्रकार के विवेक या न्याय को सर्वथा और हर परिस्थिति में निषिद्ध मानना।
  rationale: मुख्य निषेध व्यापक शब्दों में रखा गया है, पर ‘जब तक प्रभु न आए’ उसे अन्तिम प्रकाशन के समय से जोड़ता है; अन्य प्रकार के विवेक के विषय में पद से बाहर का निष्कर्ष पाठ में नहीं जोड़ा गया।
- issue: ‘प्रभु’ की पहचान
  choice: उपाधि ‘प्रभु’ को बिना विस्तार के रखा गया है; इस पौलुसी और भावी आगमन के सन्दर्भ में यह स्वाभाविक रूप से यीशु की ओर संकेत करती है।
  alternative: मुख्य पाठ में ‘प्रभु यीशु’ जोड़ना, अथवा इसे सामान्य रूप से केवल परमेश्वर का उल्लेख मानना।
  rationale: मूल में ὁ κύριος है, नाम स्पष्ट नहीं किया गया; इसलिए अनुवाद उपाधि को सुरक्षित रखता है और पहचान को पाठ में आवश्यकता से अधिक स्पष्ट नहीं करता।
- issue: हर एक को मिलने वाली प्रशंसा
  choice: मूल के अनुसार कहा गया है कि हर एक की प्रशंसा परमेश्वर की ओर से होगी।
  alternative: इसे पुरस्कार, उद्धार या केवल विश्वासियों की स्वीकृति के रूप में विस्तार देना।
  rationale: ἔπαινος का सीधा अर्थ ‘प्रशंसा’ है। पाठ के संक्षिप्त कथन में किसी विशिष्ट प्रतिफल-व्यवस्था को जोड़ना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘न्याय’, ‘अभिप्राय’ और ‘प्रशंसा’ जैसे पारदर्शी धार्मिक-साहित्यिक शब्द मूल की संक्षिप्तता और वैचारिक तनाव बनाए रखते हैं।
