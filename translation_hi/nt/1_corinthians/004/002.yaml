translation:
  language: hi
  text: इस मामले में अब भण्डारियों से यह अपेक्षा की जाती है कि हर एक विश्वासयोग्य पाया जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “इस मामले में अब/फिर भण्डारियों में यह ढूँढ़ा जाता है कि कोई विश्वासयोग्य पाया जाए।” “इस मामले में” का अर्थ “यहाँ” भी हो सकता है।'
    reason: ὧδε के स्थानसूचक अथवा विषयसूचक अर्थ और ζητεῖται (‘ढूँढ़ा जाता है’) की शाब्दिक अभिव्यक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: ὧδε λοιπὸν
  choice: अब
  rationale: इन दोनों अव्ययों का संयुक्त बल पिछले कथन से वर्तमान निष्कर्ष की ओर संक्रमण कराता है। हिन्दी में केवल स्थानसूचक ‘यहाँ’ की अपेक्षा ‘अब’ अधिक स्वाभाविक है; वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ζητεῖται
  choice: अपेक्षा की जाती है
  rationale: शाब्दिक अर्थ ‘ढूँढ़ा जाता है’ है, पर इस वाक्य-विन्यास में आशय किसी सौंपे गए दायित्व की माँग या अपेक्षा से है।
- source_word: οἰκονόμοις
  choice: भण्डारियों
  rationale: यह शब्द किसी घर या सम्पत्ति के सौंपे हुए प्रबन्धक को दर्शाता है। ‘भण्डारी’ उस भरोसे और उत्तरदायित्व के रूपक को संक्षेप में बनाए रखता है।
- source_word: πιστός
  choice: विश्वासयोग्य
  rationale: सन्दर्भ में मुख्य बल सौंपे गए काम में भरोसेमन्द और निष्ठावान होने पर है।
- source_word: τις εὑρεθῇ
  choice: हर एक ... पाया जाए
  rationale: यूनानी में अनिश्चित एकवचन है। हिन्दी में ‘हर एक’ सामान्य रूप से प्रत्येक भण्डारी पर लागू होने वाली माँग को स्वाभाविक ढंग से व्यक्त करता है और अनावश्यक पुरुष-विशेष अर्थ से बचता है।
theological_decisions:
- issue: अनिश्चित प्रतिनिधिक एकवचन और लिंग-सटीकता
  choice: हर एक विश्वासयोग्य पाया जाए
  alternative: कोई व्यक्ति विश्वासयोग्य पाया जाए
  rationale: मूल यूनानी का कथन सामान्य है, केवल पुरुषों तक सीमित नहीं। ‘हर एक’ व्यक्तिगत उत्तरदायित्व को बनाए रखता है और हिन्दी में अपेक्षा का आशय स्पष्ट करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘भण्डारी’ बाइबलीय गृह-प्रबन्धक के रूपक को बनाए रखता है; ‘अपेक्षा की जाती है’ यूनानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
