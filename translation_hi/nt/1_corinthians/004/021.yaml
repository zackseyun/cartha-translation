- source_word: πνεύματί τε πραΰτητος
  choice: और नम्रता की आत्मा
  rationale: πνεῦμα की शब्दगत उपस्थिति और πραΰτης के संबंधसूचक रूप को सुरक्षित रखते हुए मूल की वास्तविक अर्थगत खुलावट बनाए रखता है।
