  register: आधुनिक, गरिमापूर्ण और सीधी हिन्दी। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। ‘छड़ी’ अनुशासन की तीखी उपमा को बनाए रखती है; पादटिप्पणी πνεῦμα की जानबूझकर सुरक्षित रखी गई अस्पष्टता समझाती है।
