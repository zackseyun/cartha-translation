  choice: ‘नम्रता की आत्मा’, मुख्य पाठ में पौलुस के स्वभाव या मनोभाव की ओर संकेत
  alternative: ‘नम्रता का आत्मा’, अर्थात पवित्र आत्मा के कार्य की ओर अप्रत्यक्ष संकेत
  rationale: तात्कालिक विरोध पौलुस के आने के दो ढंगों—दंडात्मक कठोरता और प्रेमपूर्ण नम्रता—के बीच है। यूनानी में कोई निश्चित उपपद नहीं है, इसलिए पवित्र आत्मा का स्पष्ट उल्लेख कर देना आवश्यकता से अधिक विशिष्ट होगा; पादटिप्पणी दूसरी सम्भावना को सुरक्षित रखती है।
