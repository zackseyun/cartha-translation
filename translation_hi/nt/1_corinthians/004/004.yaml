  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। 'अवगत' और 'निर्दोष ठहरना' सामान्य पाठक के लिए बोधगम्य रहते हुए क्रमशः आत्मचेतना और न्यायिक निर्णय का भाव देते हैं। सभी पाठगत विकल्प पादटिप्पणियों में दिए गए हैं।
