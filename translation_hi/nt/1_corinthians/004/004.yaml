  text: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι, ὁ δὲ ἀνακρίνων με κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/004.yaml
  text: For I am aware of nothing against myself[a], but I am not justified by this[c][b]; the one who examines me is the Lord.
translation:
  language: hi
  text: क्योंकि मुझे अपने विरुद्ध कुछ भी मालूम नहीं[a], फिर भी इससे मैं निर्दोष नहीं ठहरता[b]; मेरा जाँचनेवाला प्रभु है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे अपने भीतर किसी दोष का बोध नहीं है,” अथवा “मैं अपने विरुद्ध कुछ नहीं जानता।”
    reason: lexical_alternative
  - marker: b
    text: या, “इससे मैं धर्मी नहीं ठहरता,” अथवा “इससे मैं दोषमुक्त सिद्ध नहीं होता।” यूनानी में यहाँ न्यायिक शब्द है, जिसका प्रयोग पौलुस अन्य स्थानों पर “धर्मी ठहराए जाने” के लिए भी करता है।
    reason: lexical_alternative
  - marker: c
    text: या, “जो मेरा न्याय करता है।” यूनानी क्रिया का अर्थ जाँच करना, परखना या न्यायिक रूप से मूल्यांकन करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν γὰρ ἐμαυτῷ σύνοιδα
  choice: क्योंकि मैं अपने विरुद्ध किसी बात से अवगत नहीं हूँ
  rationale: σύνοιδα के आत्मसचेतन/अंतरात्मा-संबंधी भाव और ἐμαυτῷ के प्रसंगगत प्रतिकूल अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; γάρ पिछले कथन का कारण बताता है।
- source_word: ἀλλ’ οὐκ ἐν τούτῳ δεδικαίωμαι
  choice: फिर भी इससे मैं निर्दोष नहीं ठहरता
  rationale: δεδικαίωμαι के पूर्ण निष्क्रिय और न्यायिक भाव को हिन्दी के निर्णयसूचक प्रयोग में रखता है। वर्तमान हिन्दी मुहावरे में 'नहीं ठहरता' उस सिद्ध परिणाम को व्यक्त करता है जो आत्ममूल्यांकन से प्राप्त नहीं होता।
- source_word: ὁ δὲ ἀνακρίνων με
  choice: पर जो मेरी जाँच करता है
  rationale: ἀνακρίνω की जाँच, परख और न्यायिक मूल्यांकन की अर्थ-सीमा को बनाए रखता है, बिना इसे केवल अंतिम न्याय तक सीमित किए।
- source_word: κύριός
  choice: प्रभु
  rationale: κύριος का निश्चित और सम्मानपूर्ण हिन्दी समतुल्य; मूल पाठ से आगे बढ़कर 'प्रभु यीशु' नहीं जोड़ा गया।
theological_decisions:
- issue: δεδικαίωμαι का न्यायिक और पौलुसी धार्मिक अर्थ
  choice: निर्दोष नहीं ठहरता
  alternative: धर्मी नहीं ठहरता / दोषमुक्त सिद्ध नहीं होता
  rationale: तात्कालिक प्रसंग सेवक के मूल्यांकन और निर्णय का है। 'निर्दोष नहीं ठहरता' न्यायिक बल को स्पष्ट करता है, जबकि पादटिप्पणी व्यापक पौलुसी शब्दावली से संबंध बनाए रखती है और किसी व्यवस्थित धर्मसिद्धांत को जबरन नहीं थोपती।
- issue: κύριος की पहचान
  choice: प्रभु
  alternative: प्रभु यीशु
  rationale: यूनानी पाठ में केवल κύριος है; इसलिए संभावित संदर्भ को स्पष्ट नाम जोड़कर सीमित नहीं किया गया।
- issue: आत्म-जागरूकता और वास्तविक निर्दोषता का संबंध
  choice: पौलुस की अपने विरुद्ध किसी बात की चेतना न होना उसे स्वतः निर्दोष सिद्ध नहीं करता
  alternative: पौलुस पूर्णतः निष्पाप होने का दावा करता है
  rationale: वाक्य का विरोध स्वयं के आकलन और प्रभु की जाँच के बीच है; अनभिज्ञता को निष्पापता का दावा बनाना पाठ के तनाव को मिटा देगा।
