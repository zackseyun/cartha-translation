base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/013.yaml
  text: When slandered[a], we appeal; we have become like the world's refuse, the scum of all things[b], until now.
translation:
  language: hi
  text: जब हमें बदनाम किया जाता है, हम विनती करते हैं[a]; हम अब तक संसार का कूड़ा और सबका मैल जैसे हो गए हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बदनाम किया जाता है’ का अनुवाद ‘जब हमारी निंदा की जाती है’ भी हो सकता है। ‘विनती करते हैं’ के लिए प्रयुक्त यूनानी क्रिया का अर्थ ‘अनुरोध करना,’ ‘आग्रह करना’ या ‘प्रोत्साहित करना’ हो सकता है; यहाँ सम्भवतः यह दुर्व्यवहार के प्रति बिना प्रतिशोध के दिए गए उत्तर को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: ‘कूड़ा’ और ‘मैल’ के लिए आए दोनों यूनानी शब्द दुर्लभ और बहुत तीखे हैं। वे सफाई करते समय पोंछकर, खुरचकर या झाड़कर हटाई गई निकृष्ट वस्तु का बिम्ब भी दे सकते हैं और इस प्रकार अत्यन्त सामाजिक तिरस्कार को व्यक्त करते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: δυσφημούμενοι
  choice: जब हमें बदनाम किया जाता है
  rationale: यह कर्मवाच्य कृदंत अपमानजनक या दुर्भावनापूर्ण ढंग से किसी के विरुद्ध बोलने को दर्शाता है। हिन्दी में कालसूचक उपवाक्य मूल के क्रियाविशेषणीय बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: παρακαλοῦμεν
  choice: हम विनती करते हैं
  rationale: सन्दर्भ में यह दुर्व्यवहार के बदले प्रतिशोध न लेकर अनुरोध या मनुहार करने का भाव देता है। ‘विनती करते हैं’ मूल क्रिया के आग्रहपूर्ण अर्थ को रखता है और ‘नम्रता से’ जैसा अव्यक्त क्रियाविशेषण नहीं जोड़ता।
- source_word: ὡς
  choice: जैसे
  rationale: यह पूर्ण पहचान के बजाय तुलना प्रस्तुत करता है; ‘जैसे’ हिन्दी में इस उपमा को स्पष्ट रखता है।
- source_word: περικαθάρματα
  choice: कूड़ा
  rationale: यह शब्द सफाई करते समय हटाई गई निकृष्ट वस्तु या अवशेष को सूचित करता है और यहाँ सामाजिक तिरस्कार का तीखा बिम्ब है। ‘कूड़ा’ आधुनिक, सहज और सशक्त है।
- source_word: τοῦ κόσμου
  choice: संसार के
  rationale: सम्बन्धवाचक षष्ठी को हिन्दी में स्वाभाविक सम्बन्धसूचक रूप में रखा गया है।
- source_word: ἐγενήθημεν
  choice: हो गए हैं
  rationale: अओरिस्ट क्रिया और ‘अब तक’ के संयोग में वर्तमान तक बनी हुई परिणामी दशा को हिन्दी का पूर्ण पक्ष स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πάντων
  choice: सबके
  rationale: यूनानी रूप व्यापक है और उसका आशय ‘सब वस्तुओं’ या ‘सब लोगों’ से समझा जा सकता है। ‘सबके’ इस व्यापकता और सम्भावित अस्पष्टता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: περίψημα
  choice: मैल
  rationale: यह दुर्लभ शब्द पोंछकर या खुरचकर हटाए गए घृणित अवशेष का बिम्ब देता है। ‘मैल’ निकृष्टता और सफाई में हटाई जाने वाली वस्तु, दोनों भावों को सहज हिन्दी में रखता है।
- source_word: ἕως ἄρτι
  choice: अब तक
  rationale: यह लेखन के वर्तमान क्षण तक जारी दशा को बताने वाला सामान्य कालसूचक पद है।
theological_decisions:
- issue: περικαθάρματα और περίψημα के युग्म का अर्थ
  choice: मुख्य पाठ में इन्हें सामाजिक तिरस्कार के सजीव बिम्ब ‘कूड़ा’ और ‘मैल’ के रूप में रखा गया है।
  alternative: इन्हें तकनीकी रूप से प्रायश्चित्त के लिए बलि बनाए गए व्यक्तियों या शुद्धिकरण-विधि के विशेष अवशेष के संकेत के रूप में अनूदित करना।
  rationale: तात्कालिक सन्दर्भ प्रेरितों की दृष्टिगत दीनता और संसार द्वारा उनके तिरस्कार पर बल देता है। शब्दों की शुद्धिकरण-संबंधी पृष्ठभूमि सम्भव है, पर मुख्य पाठ में कोई विवादित प्रायश्चित्त-विषयक अर्थ जोड़ना उचित नहीं; उस सम्भावना को टिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किन्तु गरिमापूर्ण रखी गई है। ‘कूड़ा’ और ‘मैल’ जानबूझकर तीखे, सामान्य बोलचाल में समझे जाने वाले शब्द हैं; वे यूनानी बिम्ब की कठोरता को नरम नहीं करते। वाक्य-विन्यास मूल के विरोध और परिणामी अपमान—‘बदनाम… विनती’ तथा ‘हो गए हैं’—को सुरक्षित रखता है।
