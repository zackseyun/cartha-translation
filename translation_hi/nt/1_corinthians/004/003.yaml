  text: ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν, ἵνα ὑφ’ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/003.yaml
  text: But to me it is a very small thing that I should be examined by you or by any human court; in fact[a], I do not even examine myself.
translation:
  language: hi
  text: पर मेरे लिए यह बहुत ही छोटी बात है कि मेरी जाँच तुम करो या कोई मानवीय न्यायालय करे; लेकिन मैं स्वयं अपनी जाँच भी नहीं करता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμοὶ δὲ
  choice: पर मेरे लिए
  rationale: संबंधसूचक दत्तिव को स्वाभाविक हिन्दी में व्यक्त करता है और δέ का हल्का विरोध भी बनाए रखता है।
- source_word: εἰς ἐλάχιστόν ἐστιν
  choice: यह बहुत छोटी बात है
  rationale: अभिव्यक्ति के अर्थ—अत्यल्प महत्त्व—को सहज हिन्दी में रखता है।
- source_word: ἵνα ὑφ’ ὑμῶν ἀνακριθῶ
  choice: कि तुम मेरी जाँच करो
  rationale: ἀνακρίνω सावधानी से परखने या जाँचने का भाव देता है; सक्रिय हिन्दी वाक्य अधिक स्वाभाविक है और अंतिम न्याय का अर्थ नहीं थोपता।
- source_word: ἢ ὑπὸ ἀνθρωπίνης ἡμέρας
  choice: या कोई मानवीय अदालत
  rationale: शाब्दिक ‘मानवीय दिन’ यहाँ मानव द्वारा की जाने वाली औपचारिक जाँच अथवा मूल्यांकन का मुहावरा है; ‘मानवीय अदालत’ प्रसंगगत न्यायिक रंग को स्पष्ट करता है।
- source_word: ἀλλ’ οὐδὲ ἐμαυτὸν ἀνακρίνω
  choice: बल्कि मैं तो स्वयं अपनी भी जाँच नहीं करता
  rationale: ἀλλά का प्रबल विरोध और οὐδέ का ‘भी नहीं’ वाला बल सुरक्षित रहता है; ἀνακρίνω के दोनों प्रयोगों में ‘जाँच’ रखकर शब्दगत एकता बनाए रखी गई है।
theological_decisions:
- issue: ἀνθρωπίνης ἡμέρας का अर्थ
  choice: मानवीय अदालत
  alternative: मानवीय दिन; मानवीय निर्णय
  rationale: वाक्यांश को कैलेंडर के दिन के रूप में नहीं, प्रभु के न्याय-दिवस के विपरीत मानवीय जाँच या न्याय के मुहावरे के रूप में समझा गया है। ‘अदालत’ अर्थ को सुबोध बनाती है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- issue: ἀνακρίνω में जाँच और न्याय का अंतर
  choice: जाँच करना
  alternative: न्याय करना; दोषी ठहराना
  rationale: यह क्रिया सावधानी से परखने का भाव रखती है और निकटवर्ती प्रसंग में अंतिम न्याय की भाषा से अलग रह सकती है; इसलिए कोई अंतिम दंडात्मक निर्णय नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘तुम’ बहुवचन मण्डली को संबोधित करता है। ‘मानवीय अदालत’ के साथ पादटिप्पणी मूल यूनानी की असामान्य अभिव्यक्ति और उसकी अर्थ-सीमा दोनों को सुरक्षित रखती है।
