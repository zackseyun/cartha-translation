base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/009.yaml
  text: For it seems to me that God has displayed us[a], the apostles, last of all, like men sentenced to death, because we have become a spectacle to the world[c][b], both to angels and to men.
translation:
  language: hi
  text: क्योंकि मुझे ऐसा लगता है कि परमेश्वर ने हम प्रेरितों को सबसे अन्त में, मृत्यु के लिए ठहराए गए लोगों के समान, सबके सामने प्रदर्शित किया है; क्योंकि हम संसार, स्वर्गदूतों और मनुष्यों के लिए एक तमाशा बन गए हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तमाशा” का अधिक शाब्दिक अनुवाद “रंगमंच” हो सकता है; यहाँ आशय सबके सामने प्रदर्शित किए जाने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκῶ γάρ
  choice: क्योंकि मुझे ऐसा लगता है
  rationale: γάρ के व्याख्यात्मक सम्बन्ध और δοκῶ के प्रथम-पुरुष आकलन, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἡμᾶς τοὺς ἀποστόλους
  choice: हम प्रेरितों को
  rationale: यूनानी के कर्मकारक पद में प्रेरितों को ‘हम’ की पहचान बताने वाले समानाधिकरण को संक्षिप्त और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἐσχάτους ἀπέδειξεν
  choice: सबसे अन्त में ... सबके सामने प्रदर्शित किया है
  rationale: ἐσχάτους की अन्तिम/सबसे निचली स्थिति तथा ἀπέδειξεν के सार्वजनिक प्रदर्शन के भाव को आगे आने वाले रंगमंचीय बिम्ब के अनुरूप व्यक्त करता है।
- source_word: ὡς ἐπιθανατίους
  choice: मृत्यु के लिए ठहराए गए लोगों के समान
  rationale: ऐसे लोगों का अर्थ देता है जिन्हें मरने के लिए नियत किया गया हो; सम्भावित अखाड़े के बिम्ब को अत्यधिक विशिष्ट बनाए बिना सुरक्षित रखता है।
- source_word: θέατρον ἐγενήθημεν
  choice: एक तमाशा बन गए हैं
  rationale: θέατρον का यहाँ भवन नहीं, सार्वजनिक रूप से देखा जाने वाला दृश्य होने का रूपकात्मक अर्थ है; ‘तमाशा’ आधुनिक हिन्दी में इस अपमानजनक सार्वजनिक प्रदर्शन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῷ κόσμῳ καὶ ἀγγέλοις καὶ ἀνθρώποις
  choice: संसार के लिए—स्वर्गदूतों और मनुष्यों, दोनों के लिए
  rationale: दर्शक अथवा साक्षी के रूप में समूचे संसार को बताता है और फिर स्वर्गदूतों तथा मानव प्राणियों को उसके दो स्पष्ट वर्गों के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ἀγγέλοις का अर्थ
  choice: स्वर्गदूतों
  alternative: दूतों
  rationale: ‘संसार’ और ‘मनुष्यों’ के साथ इसका प्रयोग लौकिक मानवीय दूतों की अपेक्षा अलौकिक प्राणियों की ओर स्वाभाविक रूप से संकेत करता है; कोई अतिरिक्त सैद्धान्तिक विवरण नहीं जोड़ा गया।
- issue: ἐπιθανατίους में नियति और दण्ड का सम्बन्ध
  choice: मृत्यु के लिए ठहराए गए लोग
  alternative: मृत्युदण्ड पाए हुए लोग
  rationale: यूनानी शब्द मृत्यु के लिए नियत व्यक्तियों को दर्शाता है, पर यह स्पष्ट नहीं करता कि यहाँ औपचारिक न्यायिक दण्ड ही अभिप्रेत है; इसलिए अधिक विशिष्ट अर्थ आरोपित नहीं किया गया।
