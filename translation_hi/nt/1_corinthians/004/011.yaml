  yaml_path: translation/nt/1_corinthians/004/011.yaml
  text: Up to this present hour we are hungry and thirsty[a], and poorly clothed, and beaten[c][b], and homeless.
translation:
  language: hi
  text: इस घड़ी तक हम भूखे और प्यासे हैं, हमारे पास पर्याप्त कपड़े नहीं हैं,[a] हमारी पिटाई होती है, और हमारा कोई स्थायी ठिकाना नहीं है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हम नंगे हैं”; यूनानी शब्द का अर्थ पूरी तरह निर्वस्त्र होने के बजाय पर्याप्त कपड़े न होना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “हम भटकते फिरते हैं” अथवा “हमारा कोई स्थिर निवास नहीं है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι τῆς ἄρτι ὥρας
  choice: इस घड़ी तक
  rationale: यह वर्तमान समय तक जारी दशा को व्यक्त करता है और ὥρα की ठोस अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πεινῶμεν καὶ διψῶμεν
  choice: हम भूखे और प्यासे हैं
  rationale: दोनों वर्तमानकालीन क्रियाएँ लगातार अभाव की दशा बताती हैं; संयुक्त हिन्दी वाक्यांश स्पष्ट और स्वाभाविक है।
- source_word: γυμνιτεύομεν
  choice: हमारे पास पर्याप्त कपड़े नहीं हैं
  rationale: यह क्रिया पूर्ण नग्नता के बजाय अपर्याप्त वस्त्र होने का अर्थ भी दे सकती है; चयन अर्थ को बिना बढ़ाए सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: κολαφιζόμεθα
  choice: हम मार खाते हैं
  rationale: वर्तमान कर्मवाच्य बार-बार होने वाले शारीरिक दुर्व्यवहार को दर्शाता है; यह हिन्दी में सहज और ठोस है।
- source_word: ἀστατοῦμεν
  choice: ठिकाना न होने के कारण भटकते फिरते हैं
  rationale: यह स्थिर निवास या स्थायी जगह के अभाव की दशा बताता है; हिन्दी चयन 'बेघर' की तुलना में अस्थिरता और भटकने के पहलू को अधिक सुरक्षित रखता है।
- source_word: καὶ ... καὶ ... καὶ ...
  choice: और ... और ...
  rationale: जहाँ स्वाभाविक हो वहाँ बार-बार 'और' रखकर यूनानी की संचयी, कठिनाइयों को एक के बाद एक जोड़ने वाली लय कायम रखी गई है।
theological_decisions:
- issue: पौलुस के आत्म-वर्णन का स्वरूप
  choice: प्रेरितों के वास्तविक और लगातार अभाव तथा दुर्व्यवहार का सीधा वर्णन
  alternative: मुख्यतः आलंकारिक या अतिशयोक्तिपूर्ण वर्णन
  rationale: वर्तमानकालीन क्रियाएँ ठोस और जारी कठिनाइयों की सूची देती हैं; अनुवाद न तो पीड़ा को बढ़ाता है, न नरम करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक रूप से सहज है। 'पर्याप्त कपड़े नहीं' तथा 'ठिकाना न होने के कारण भटकते फिरते हैं' जैसे वाक्यांश मूल की अर्थ-सीमा और अस्पष्टता को स्पष्ट हिन्दी में बनाए रखते हैं।
