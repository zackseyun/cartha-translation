revisions:
- from: परन्तु यदि प्रभु की इच्छा हुई, तो मैं शीघ्र ही तुम्हारे पास आऊँगा और उन घमंड से फूले हुए लोगों की बातों को नहीं, बल्कि उनकी सामर्थ्य को परखूँगा।
  to: परन्तु मैं शीघ्र ही तुम्हारे पास आऊँगा, यदि प्रभु चाहें, और उन लोगों की बात नहीं जो घमंड से फूले हुए हैं, बल्कि सामर्थ्य जान लूँगा।
  rationale: The revision makes the Lord-willing condition idiomatic and source-close, renders γνώσομαι as personal ascertainment rather than evaluative testing, and retains the Greek’s singular, compact contrast between λόγος and δύναμις. No footnotes are necessary because the Hindi wording does not introduce an unresolved lexical or textual ambiguity requiring annotation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:44:59Z'
review_pass:
  verdict: revise
  source_fidelity: The draft faithfully conveys Paul’s prospective visit, its dependence on the Lord’s will, and the contrast between the utterance of the inflated persons and power. However, ‘यदि प्रभु की इच्छा हुई’ is less direct than the conditional Greek and can sound like a future event rather than the idiomatic conditional ‘if the Lord wills.’ ‘परखूँगा’ adds an evaluative nuance; γνώσομαι here is better rendered ‘जान लूँगा’/‘ज्ञात करूँगा’ for ascertainment. The plural ‘बातों’ and supplied ‘उनकी’ before ‘सामर्थ्य’ are understandable but go beyond the compact singular and unqualified Greek wording.
  naturalness: The revised wording is modern, formal, and natural Hindi. ‘यदि प्रभु चाहें’ is a direct, idiomatic conditional, and ‘बात नहीं ... बल्कि सामर्थ्य’ retains the concise rhetorical contrast.
  terminology: ‘प्रभु’ appropriately leaves κύριος unspecified. ‘घमंड से फूले हुए’ preserves Paul’s recurring inflation metaphor without forcing a particular theological interpretation. ‘सामर्थ्य’ is a suitable broad rendering of δύναμις.
  issues:
  - severity: medium
    issue: Conditional expression ‘यदि प्रभु की इच्छा हुई’
    rationale: Although intelligible, it can be read as ‘if the Lord’s will happened/occurred.’ The Greek ἐὰν ... θελήσῃ is more directly and naturally represented by ‘यदि प्रभु चाहें।’
  - severity: medium
    issue: ‘परखूँगा’ for γνώσομαι
    rationale: ‘परखना’ emphasizes testing or evaluating. In context Paul says he will come to know/ascertain the reality, so ‘जान लूँगा’ better preserves the verb’s sense.
  - severity: low
    issue: Plural ‘बातों’ and explicit ‘उनकी सामर्थ्य’
    rationale: The Greek has singular λόγον and simply τὴν δύναμιν. Singular ‘बात’ and unqualified ‘सामर्थ्य’ preserve the concise parallel without unnecessary expansion.
  revised_text: परन्तु मैं शीघ्र ही तुम्हारे पास आऊँगा, यदि प्रभु चाहें, और उन लोगों की बात नहीं जो घमंड से फूले हुए हैं, बल्कि सामर्थ्य जान लूँगा।
  revised_footnotes: []
  revision_rationale: The revision makes the Lord-willing condition idiomatic and source-close, renders γνώσομαι as personal ascertainment rather than evaluative testing, and retains the Greek’s singular, compact contrast between λόγος and δύναμις. No footnotes are necessary because the Hindi wording does not introduce an unresolved lexical or textual ambiguity requiring annotation.
