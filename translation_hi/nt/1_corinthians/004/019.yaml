reference: 1 Corinthians 4:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς, ἐὰν ὁ κύριος θελήσῃ, καὶ γνώσομαι οὐ τὸν λόγον τῶν πεφυσιωμένων ἀλλὰ τὴν δύναμιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/019.yaml
  text: But I will come to you soon[a], if the Lord wills, and I will find out not the speech of those who are puffed up[b], but the power.
translation:
  language: hi
  text: परन्तु मैं शीघ्र ही तुम्हारे पास आऊँगा, यदि प्रभु चाहें, और उन लोगों की बात नहीं जो घमंड से फूले हुए हैं, बल्कि सामर्थ्य जान लूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσομαι δὲ ταχέως πρὸς ὑμᾶς
  choice: परन्तु मैं शीघ्र ही तुम्हारे पास आऊँगा
  rationale: भविष्यकाल और कुरिन्थियों की ओर पौलुस की गति को स्वाभाविक हिन्दी में व्यक्त करता है; δέ का हल्का विरोध ‘परन्तु’ से सुरक्षित है।
- source_word: ἐὰν ὁ κύριος θελήσῃ
  choice: यदि प्रभु की इच्छा हुई
  rationale: प्रभु की इच्छा पर निर्भरता व्यक्त करता है और κύριος को बिना अतिरिक्त पहचान जोड़े ‘प्रभु’ रखता है।
- source_word: γνώσομαι
  choice: परखूँगा
  rationale: यहाँ पौलुस व्यक्तिगत रूप से आकर वास्तविकता जानने की बात करता है; ‘परखूँगा’ उस जाँचपरक आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: τὸν λόγον
  choice: बातों को
  rationale: λόγος यहाँ δύναμις के विपरीत कथन या वाणी का बोध कराता है। बहुवचन ‘बातों’ हिन्दी में स्वाभाविक है, यद्यपि यूनानी में संज्ञा एकवचन है।
- source_word: τῶν πεφυσιωμένων
  choice: उन घमंड से फूले हुए लोगों की
  rationale: पूर्ण निष्क्रिय कृदन्त की स्थायी दशा और पौलुस के ‘फूलने’ के रूपक, दोनों को सुरक्षित रखता है।
- source_word: τὴν δύναμιν
  choice: उनकी सामर्थ्य को
  rationale: ‘सामर्थ्य’ δύναμις का गरिमापूर्ण और व्यापक हिन्दी समतुल्य है; ‘उनकी’ हिन्दी में संबंध स्पष्ट करती है, पर सामर्थ्य के स्वरूप को संकीर्ण नहीं करती।
theological_decisions:
- issue: ‘प्रभु’ की पहचान
  choice: केवल ‘प्रभु’
  alternative: ‘प्रभु यीशु’ अथवा ‘परमेश्वर’
  rationale: यूनानी पाठ ὁ κύριος ही कहता है; किसी एक विशिष्ट संदर्भ को अनुवाद में जोड़ना मूल की संभावित व्यापकता को अनावश्यक रूप से सीमित करेगा।
- issue: λόγος और δύναμις का विरोध
  choice: ‘बातों’ और ‘सामर्थ्य’ का व्यापक विरोध
  alternative: वाक्पटुता बनाम चमत्कारी शक्ति, अथवा शिक्षा बनाम प्रेरितिक अधिकार
  rationale: संदर्भ केवल शब्दों और वास्तविक सामर्थ्य का विरोध स्पष्ट करता है; सामर्थ्य की खास अभिव्यक्ति निर्धारित करना व्याख्यात्मक अतिक्रमण होगा।
- issue: δύναμις के संबंध का स्पष्टिकरण
  choice: ‘उनकी सामर्थ्य’
  alternative: केवल ‘सामर्थ्य’
  rationale: यूनानी में समानांतर रचना से संबंध उन घमंडी लोगों से बनता है। हिन्दी में सर्वनाम इसे स्पष्ट करता है, जबकि यह निर्णय नहीं करता कि सामर्थ्य वास्तविक, कथित, आत्मिक या अन्य प्रकार की है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और प्रत्यक्ष रूप। ‘घमंड से फूले हुए’ पौलुस के रूपक को बनाए रखता है; ‘सामर्थ्य’ धार्मिक संदर्भ में परिचित है, फिर भी किसी खास धर्मवैज्ञानिक अर्थ तक सीमित नहीं।
