id: 1CO.4.10
reference: 1 Corinthians 4:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡμεῖς μωροὶ διὰ Χριστόν, ὑμεῖς δὲ φρόνιμοι ἐν Χριστῷ· ἡμεῖς ἀσθενεῖς, ὑμεῖς δὲ ἰσχυροί· ὑμεῖς ἔνδοξοι, ἡμεῖς δὲ ἄτιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/010.yaml
  text: We are fools for Messiah[a], but you are wise in Messiah; we are weak, but you are strong; you are honored[c][b], but we are dishonored.
translation:
  language: hi
  text: हम मसीह के कारण मूर्ख हैं,[a] पर तुम मसीह में बुद्धिमान हो; हम निर्बल हैं, पर तुम बलवान हो; तुम सम्मानित हो, पर हम अपमानित हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसीह के लिए” अथवा “मसीह की खातिर।” यूनानी वाक्यांश कारण या उद्देश्य/खातिर का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “सम्मानित” और “अपमानित” संभवतः केवल मन की अनुभूति नहीं, बल्कि लोगों की दृष्टि में सार्वजनिक प्रतिष्ठा और लज्जा की स्थिति बताते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: मूर्ख
  rationale: यह विधेयात्मक विशेषण कुरिन्थियों की अपने विषय में धारणा के विपरीत व्यंग्यपूर्ण ढंग से प्रयुक्त है; ‘मूर्ख’ इसकी तीखी अलंकारिक शक्ति बनाए रखता है।
- source_word: διὰ Χριστόν
  choice: मसीह के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण अथवा निमित्त का भाव दे सकता है। यह चयन स्वाभाविक हिन्दी में मुख्यतः कारण का अर्थ व्यक्त करता है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: φρόνιμοι
  choice: बुद्धिमान
  rationale: ‘मूर्ख’ के व्यंग्यपूर्ण विलोम के रूप में यह सीधा और संतुलित अनुवाद है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: पौलुस की विशिष्ट अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: ἀσθενεῖς
  choice: निर्बल
  rationale: यह शारीरिक, सामाजिक या सामर्थ्य-संबंधी दुर्बलता की व्यापकता को बिना सीमित किए व्यक्त करता है।
- source_word: ἰσχυροί
  choice: बलवान
  rationale: ‘निर्बल’ का स्पष्ट विलोम है और पद की समानांतर संरचना बनाए रखता है।
- source_word: ἔνδοξοι
  choice: सम्मानित
  rationale: इस सामाजिक विरोध में यह लोगों की दृष्टि में प्रतिष्ठा और आदर का भाव ‘महिमामय’ से अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: ἄτιμοι
  choice: अपमानित
  rationale: ‘सम्मानित’ के विपरीत सार्वजनिक अनादर और नीची सामाजिक स्थिति का भाव व्यक्त करता है।
- source_word: ἡμεῖς / ὑμεῖς
  choice: हम / तुम
  rationale: यूनानी में स्पष्ट और बलयुक्त सर्वनाम पौलुस तथा कुरिन्थियों के बीच तीखे विरोध के केंद्र में हैं, इसलिए इन्हें बनाए रखा गया है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: दोनों स्थानों पर ‘मसीह’
  alternative: ‘ख्रीस्त’ अथवा प्रचलित रूप ‘क्राइस्ट’
  rationale: यहाँ उपाधिगत अर्थ सक्रिय है; ‘मसीह’ आधुनिक मानक हिन्दी में अर्थपूर्ण, प्रतिष्ठित और स्वाभाविक धार्मिक पद है।
- issue: διὰ Χριστόν में संबंध का प्रकार
  choice: ‘मसीह के कारण’ को मुख्य पाठ में रखा
  alternative: ‘मसीह के लिए’ अथवा ‘मसीह की खातिर’
  rationale: διά + कर्मकारक कारण, निमित्त या उद्देश्य-सदृश ‘खातिर’ का भाव दे सकता है। मुख्य पाठ कारण को अपनाता है, पर वास्तविक भाषिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और तीखा अलंकारिक रूप अपनाया गया है। ‘पर’ की पुनरावृत्ति यूनानी δὲ के लगातार विरोध को स्वाभाविक हिन्दी में बनाए रखती है। संबोधन बहुवचन है, इसलिए ‘तुम’ प्रयोग हुआ है; ‘आप’ मूल के पारस्परिक तीखेपन को नरम कर देता।
