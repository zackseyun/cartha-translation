  text: καὶ κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν· λοιδορούμενοι εὐλογοῦμεν, διωκόμενοι ἀνεχόμεθα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/012.yaml
  text: and we labor[a], working with our own hands. When insulted, we bless; when persecuted, we endure;
translation:
  language: hi
  text: और हम अपने ही हाथों से काम करते हुए कड़ी मेहनत करते हैं। जब हमें बुरा-भला कहा जाता है[a], तो हम आशीष देते हैं; जब हमें सताया जाता है, तो हम सहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब हमारा अपमान किया जाता है।”
    reason: λοιδορούμενοι के लिए निकटवर्ती शाब्दिक विकल्प; मुख्य पाठ मौखिक दुर्व्यवहार का भाव अधिक स्पष्ट करता है।
lexical_decisions:
- source_word: κοπιῶμεν
  choice: कठिन परिश्रम करते हैं
  rationale: यह क्रिया थका देने वाले कठोर परिश्रम का भाव रखती है; यह केवल सामान्य काम करने की बात नहीं है।
- source_word: ἐργαζόμενοι
  choice: काम करके
  rationale: कृदंत बताता है कि कठिन परिश्रम किस प्रकार किया जा रहा है; हिंदी में यह रचना स्वाभाविक और स्पष्ट है।
- source_word: ταῖς ἰδίαις χερσίν
  choice: अपने हाथों से
  rationale: ‘अपने’ मूल पाठ के ἰδίαις के बल को बनाए रखता है और स्वयं किए जाने वाले शारीरिक काम को स्पष्ट करता है।
- source_word: λοιδορούμενοι
  choice: जब हमें बुरा-भला कहा जाता है
  rationale: यह निष्क्रिय कृदंत मौखिक दुर्व्यवहार और निंदा का भाव देता है; चुना हुआ वाक्यांश आधुनिक हिंदी में सहज है।
- source_word: εὐλογοῦμεν
  choice: हम आशीष देते हैं
  rationale: ‘आशीष देना’ इस प्रमुख बाइबिलीय शब्द को बनाए रखता है और दुर्व्यवहार के बदले भलाई की कामना करने का भाव व्यक्त करता है।
- source_word: διωκόμενοι
  choice: जब हमें सताया जाता है
  rationale: संदर्भ में यह विरोधियों द्वारा उत्पीड़न का अर्थ देता है, मात्र पीछा किए जाने का नहीं।
- source_word: ἀνεχόμεθα
  choice: हम सहते हैं
  rationale: यह बिना कोई स्पष्ट कर्म जोड़े शत्रुतापूर्ण व्यवहार को सहने का अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: दुर्व्यवहार के प्रति प्रेरितों की प्रतिक्रिया
  choice: पद को प्रेरितों के आचरण के वर्णन के रूप में रखा गया है—बुरा-भला कहे जाने पर आशीष देना और सताए जाने पर सहना।
  alternative: इसे सीधे सभी विश्वासियों के लिए औपचारिक आज्ञा के रूप में व्यक्त करना।
  rationale: यूनानी पाठ यहाँ प्रथम पुरुष बहुवचन में प्रेरितों के व्यवहार का वर्णन करता है; अनुवाद उसके नैतिक प्रभाव को बनाए रखता है, पर वर्णन को अतिरिक्त आज्ञा में नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। समानांतर उपवाक्यों में ‘जब हमें… तो हम…’ की रचना मूल की संक्षिप्त प्रतिक्रिया-श्रृंखला को स्पष्ट करती है।
