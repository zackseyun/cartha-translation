  text: οὐ γὰρ ἐν λόγῳ ἡ βασιλεία τοῦ θεοῦ ἀλλ’ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/020.yaml
  text: For the kingdom of God is not in word[a], but in power.
translation:
  language: hi
  text: क्योंकि परमेश्वर का राज्य बातों[a] में नहीं, बल्कि सामर्थ्य में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वचन में’, ‘भाषण में’ अथवा ‘केवल बातों में’; यहाँ खोखली बयानबाज़ी का विरोध प्रभावकारी सामर्थ्य से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: क्योंकि ... नहीं
  rationale: γάρ पिछले कथन का कारण बताता है; हिंदी में ‘क्योंकि’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है। οὐ निषेध को स्पष्ट करता है।
- source_word: ἐν λόγῳ
  choice: बातों में
  rationale: λόγος यहाँ ‘वचन’, ‘बात’ या ‘भाषण’ का अर्थ दे सकता है। बहुवचन ‘बातों’ हिंदी में केवल मौखिक दावों या बयानबाज़ी का स्वाभाविक बोध कराता है, जबकि पादटिप्पणी वास्तविक शाब्दिक विकल्पों को सुरक्षित रखती है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह आधुनिक हिंदी में स्थापित और सटीक पदबंध है तथा βασιλεία के राज्य और शासन—दोनों संभावित आयामों को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἀλλ’ ἐν δυνάμει
  choice: बल्कि सामर्थ्य में
  rationale: ἀλλά तीखा विरोध प्रकट करता है, जिसके लिए ‘बल्कि’ उपयुक्त है। ‘सामर्थ्य’ δύναμις की प्रभावकारी शक्ति को गरिमापूर्ण और प्रचलित बाइबलीय हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ‘बातों’ और ‘सामर्थ्य’ के बीच विरोध का स्वरूप
  choice: पद को केवल कथन या बयानबाज़ी और प्रभावकारी सामर्थ्य के व्यापक विरोध के रूप में रखा गया है।
  alternative: सामर्थ्य को विशेष रूप से चमत्कारों, परिवर्तित जीवन, कलीसियाई अनुशासन, प्रेरितीय अधिकार या पवित्र आत्मा के किसी संकीर्ण कार्य के रूप में निर्धारित करना।
  rationale: यूनानी पाठ δύναμις के आशय को यहाँ और सीमित नहीं करता; इसलिए अनुवाद उसकी वास्तविक धर्मवैज्ञानिक व्यापकता और तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बातों में नहीं, बल्कि सामर्थ्य में’ मूल यूनानी की संक्षिप्त और तीखी समानांतर संरचना को हिंदी में स्वाभाविक रूप से सुरक्षित रखता है।
