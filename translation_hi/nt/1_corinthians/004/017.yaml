id: 1CO.4.17
reference: 1 Corinthians 4:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν ⸂μου τέκνον⸃ ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ ⸀Ἰησοῦ, καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/017.yaml
  text: For this reason I sent Timothy to you[a], who is my beloved and faithful child in the Lord. He will remind you of my ways in Messiah Jesus[b], just as I teach everywhere in every church.
translation:
  language: hi
  text: इसी कारण मैंने तीमुथियुस को तुम्हारे पास भेजा। वह प्रभु में मेरी प्रिय और विश्वासयोग्य संतान है[a]। वह तुम्हें मसीह यीशु में मेरे मार्गों की याद दिलाएगा[b], ठीक वैसे ही जैसे मैं हर जगह, हर कलीसिया में शिक्षा देता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा प्रिय और विश्वासयोग्य पुत्र।” यूनानी शब्द τέκνον का शाब्दिक अर्थ “संतान” है, पर इस संदर्भ में इसका अनुवाद “पुत्र” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “ख्रीस्त यीशु में।” यूनानी पदवी Χριστός का अर्थ सुरक्षित रखने के लिए यहाँ “मसीह” किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह स्वाभाविक कारणसूचक वाक्यांश है और पिछले तर्क की ओर संकेत बनाए रखता है।
- source_word: ἔπεμψα
  choice: मैंने ... भेजा
  rationale: यूनानी एओरिस्ट को यहाँ सामान्य भूतकाल के रूप में व्यक्त किया गया है।
- source_word: Τιμόθεον
  choice: तीमुथियुस
  rationale: इस व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: τέκνον
  choice: संतान
  rationale: यह लिंग-निरपेक्ष पारिवारिक रूपक को सुरक्षित रखता है; संदर्भ में तीमुथियुस पुरुष है, इसलिए ‘पुत्र’ भी सम्भव है।
- source_word: ἀγαπητὸν καὶ πιστὸν
  choice: प्रिय और विश्वासयोग्य
  rationale: यह पौलुस के स्नेह और तीमुथियुस की भरोसेमंद निष्ठा—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह पौलुस की विशिष्ट संबंधात्मक और सेवकाई-संबंधी अभिव्यक्ति को निकटता से बनाए रखता है।
- source_word: ἀναμνήσει
  choice: याद दिलाएगा
  rationale: भविष्यकालीन क्रिया का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: τὰς ὁδούς μου
  choice: मेरे मार्गों
  rationale: ‘मार्ग’ के रूपक को सुरक्षित रखते हुए पौलुस के जीवन, आचरण और सेवकाई के स्थापित ढंगों की व्यापकता बनाए रखी गई है।
- source_word: τὰς ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: Χριστός को यहाँ पदवी के अर्थ में ‘मसीह’ किया गया है; यह वाक्यांश पौलुस के मार्गों को मसीह यीशु के साथ उसके संबंध के क्षेत्र में रखता है।
- source_word: καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω
  choice: ठीक वैसे ही जैसे मैं हर जगह, हर कलीसिया में शिक्षा देता हूँ
  rationale: तुलना और शिक्षा की सार्वत्रिक व्यापकता दोनों को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु / क्राइस्ट यीशु
  rationale: यहाँ Χριστός में पदवी का बल बना हुआ है, इसलिए अर्थ का अनुवाद ‘मसीह’ किया गया है, केवल लिप्यंतरण नहीं।
- issue: ‘मेरे मार्गों’ का आशय
  choice: पौलुस के जीवन, आचरण, शिक्षा और सेवकाई के प्रतिमान को खुला रखने वाला रूपक
  alternative: मेरी जीवन-शैली / मेरा आचरण
  rationale: ὁδοί रूपकात्मक और अर्थ की दृष्टि से व्यापक है; अनुवाद इसे केवल निजी व्यवहार या यात्रा-मार्गों तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘संतान’ वयस्क तीमुथियुस के लिए ‘बच्चा’ की अपेक्षा अधिक स्वाभाविक है और यूनानी की लिंग-निरपेक्षता भी बनाए रखता है। ‘मार्गों’ से मूल रूपक और उसका व्यापक आशय सुरक्षित रहता है।
