source:
  edition: SBLGNT
  text: Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ ⸀Ἀπολλῶν δι’ ὑμᾶς, ἵνα ἐν ἡμῖν μάθητε τό· Μὴ ὑπὲρ ⸀ἃ ⸀γέγραπται, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/006.yaml
  text: 'These things, brothers, I have applied to myself and Apollos for your sake, so that in us you may learn this: “Do not go beyond what is written,” so that none of you may be puffed up in favor of one against another.'
translation:
  language: hi
  text: 'भाइयो और बहनो,[a] इन बातों को मैंने तुम्हारे लिए अपने और अपुल्लोस के संबंध में लागू किया है, ताकि तुम हमारे उदाहरण से यह सीखो: “जो लिखा है, उससे आगे न बढ़ो।”[b] जिससे तुममें से कोई भी किसी एक के पक्ष में होकर दूसरे के विरुद्ध घमंड से न फूले।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में ‘भाइयो’ है; यह शब्द स्त्री-पुरुषों के मिले-जुले समूह को भी संबोधित कर सकता है।
    reason: cultural_note
  - marker: b
    text: यूनानी वाक्यांश संक्षिप्त है; शाब्दिक रूप लगभग ‘जो लिखा है, उससे आगे नहीं’ है। संभव है कि यह कोई प्रचलित सूत्र-वाक्य रहा हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: इन बातों को
  rationale: बहुवचन संकेतवाचक पद पिछले पूरे विचार-विमर्श की ओर लौटता है; हिन्दी में ‘इन बातों को’ स्वाभाविक और व्यापक है।
- source_word: ἀδελφοί
  choice: भाइयो और बहनो
  rationale: यूनानी पुल्लिंग बहुवचन संबोधन यहाँ मिश्रित विश्वासी समुदाय को संबोधित कर सकता है; आधुनिक हिन्दी में समावेशी आशय स्पष्ट किया गया है, जबकि पादटिप्पणी मूल रूप बताती है।
- source_word: μετεσχημάτισα εἰς ἐμαυτὸν καὶ Ἀπολλῶν
  choice: अपने और अपुल्लोस पर लागू किया है
  rationale: क्रिया पिछले विवेचन को पौलुस और अपुल्लोस के संदर्भ में आलंकारिक रूप से लागू करने का भाव देती है; यह हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: δι’ ὑμᾶς
  choice: तुम्हारे कारण
  rationale: διά तथा कर्मकारक का भाव उनके हित/कारण से है। ‘तुम्हारे कारण’ स्रोत की संभावित व्यापकता को बचाता है, यद्यपि संदर्भ में हित का भाव भी उपस्थित है।
- source_word: ἵνα ἐν ἡμῖν μάθητε
  choice: ताकि तुम हमारे उदाहरण से यह सीखो
  rationale: शाब्दिक ‘हममें’ हिन्दी में अस्पष्ट होता; संदर्भ में पौलुस और अपुल्लोस वह उदाहरण हैं जिनसे पाठक शिक्षा लें।
- source_word: τό· Μὴ ὑπὲρ ἃ γέγραπται
  choice: “जो लिखा है, उससे आगे न बढ़ो”
  rationale: यूनानी वाक्यांश संक्षिप्त और क्रियारहित है, पर निषेधात्मक शिक्षा का भाव देता है। हिन्दी में आवश्यक क्रिया जोड़कर अर्थ स्पष्ट किया गया और मूल की दीर्घवृत्तता पादटिप्पणी में रखी गई है।
- source_word: φυσιοῦσθε
  choice: घमंड से न फूले
  rationale: यह पौलुस के ‘फूलने’ वाले रूपक को बनाए रखते हुए हिन्दी में अहंकार का आशय स्पष्ट करता है।
- source_word: ὑπὲρ τοῦ ἑνὸς ... κατὰ τοῦ ἑτέρου
  choice: एक का पक्ष लेकर दूसरे के विरुद्ध
  rationale: मंडलीय गुटबंदी के संदर्भ में एक व्यक्ति के पक्ष और दूसरे के विरोध का संबंध स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: τό· Μὴ ὑπὲρ ἃ γέγραπται का आशय
  choice: 'इसे चेतावनी के रूप में प्रस्तुत करना: “जो लिखा है, उससे आगे न बढ़ो।”'
  alternative: 'अधिक शाब्दिक और अधूरा रूप: “जो लिखा है, उससे आगे नहीं”; अथवा इसे किसी प्रचलित सूत्र-वाक्य के रूप में लेना।'
  rationale: मूल यूनानी संक्षिप्त और कुछ हद तक विवादित है। प्रसंग में यह वह शिक्षा है जो कुरिन्थियों को पौलुस और अपुल्लोस से सीखनी है। हिन्दी में निषेधात्मक क्रिया अर्थ को पठनीय बनाती है, जबकि पादटिप्पणी वास्तविक दीर्घवृत्तता और सूत्र-वाक्य की संभावना सुरक्षित रखती है।
- issue: ἀδελφοί में संबोधित समुदाय का लिंग-व्यापी आशय
  choice: मुख्य पाठ में ‘भाइयो और बहनो’
  alternative: मूल के व्याकरणिक रूप के निकट ‘भाइयो’
  rationale: पत्र पूरी कलीसिया को संबोधित है और यूनानी पुल्लिंग बहुवचन मिश्रित समूह के लिए प्रयुक्त हो सकता है। समावेशी हिन्दी आशय स्पष्ट करती है; पादटिप्पणी मूल शब्द का रूप बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सहज शैली। ‘घमंड से न फूले’ पौलुस के मूल रूपक को बनाए रखता है। अपुल्लोस नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है; वाक्य की जटिलता को बिना धर्मवैचारिक निष्कर्ष थोपे पठनीय बनाया गया है।
