source:
  edition: SBLGNT
  text: ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ’ οὐ πολλοὺς πατέρας, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου ἐγὼ ὑμᾶς ἐγέννησα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/015.yaml
  text: For even if you have countless guardians in Messiah[a], yet not many fathers; for in Messiah Jesus, through the gospel[d][c][b], I became your father.
translation:
  language: hi
  text: क्योंकि यदि मसीह[c] में तुम्हारे दस हज़ार[a] संरक्षक[b] भी हों, तो भी तुम्हारे बहुत-से पिता नहीं हैं; क्योंकि मसीह यीशु में सुसमाचार के द्वारा मैं तुम्हारा पिता बना[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “असंख्य”; यूनानी शब्द का शाब्दिक अर्थ “दस हज़ार” है, पर यह बहुत बड़ी संख्या के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “देखरेख करनेवाले” अथवा “मार्गदर्शक”; यूनानी शब्द उस व्यक्ति के लिए था जो बच्चे की निगरानी और अनुशासन करता था, न कि मुख्यतः कक्षा में पढ़ाने वाले शिक्षक के लिए।
    reason: cultural_note
  - marker: c
    text: “मसीह” का अर्थ “अभिषिक्त जन” है; परंपरागत रूप से इसे “ख्रीस्त” भी कहा जाता है।
    reason: lexical_alternative
  - marker: d
    text: यूनानी में शाब्दिक रूप से “मैंने तुम्हें उत्पन्न किया” अथवा “मैं तुम्हारा पिता हुआ” है। यह रूपक सुसमाचार के द्वारा उन्हें विश्वास तक पहुँचाने में पौलुस की भूमिका को दर्शाता है।
    reason: metaphor_note
lexical_decisions:
- source_word: μυρίους
  choice: दस हज़ार
  rationale: यह शब्द शाब्दिक रूप से ‘दस हज़ार’ है और अलंकारिक रूप से बहुत बड़ी संख्या भी व्यक्त कर सकता है। मुख्य पाठ में ठोस संख्या रखी गई है और मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- source_word: παιδαγωγοὺς
  choice: संरक्षक
  rationale: यूनानी-रोमी समाज में παιδαγωγός मुख्यतः बच्चे की देखरेख और अनुशासन करने वाला संरक्षक था, आधुनिक अर्थ में केवल कक्षा का शिक्षक नहीं।
- source_word: ἐν Χριστῷ / ἐν Χριστῷ Ἰησοῦ
  choice: मसीह में / मसीह यीशु में
  rationale: ἐν का संबंधसूचक रूप ज्यों का त्यों रखा गया है और Χριστός को उसके पदवीगत अर्थ में ‘मसीह’ अनूदित किया गया है।
- source_word: πατέρας
  choice: पिता
  rationale: पौलुस के स्पष्ट पारिवारिक रूपक को बिना ‘आत्मिक’ जैसे व्याख्यात्मक विशेषण जोड़े सुरक्षित रखा गया है।
- source_word: διὰ τοῦ εὐαγγελίου
  choice: सुसमाचार के द्वारा
  rationale: संबंधकारक के साथ διά साधन या माध्यम व्यक्त करता है; यह वाक्यांश बताता है कि सुसमाचार उनके जन्म का माध्यम था।
- source_word: ἐγέννησα
  choice: मैंने तुम्हें जन्म दिया
  rationale: γεννάω के प्रत्यक्ष ‘जन्म देना/उत्पन्न करना’ रूपक को सुरक्षित रखा गया है। संदर्भ इसे जैविक नहीं, बल्कि पौलुस की सुसमाचार-सेवा से संबंधित पितृत्व के रूप में स्पष्ट करता है।
theological_decisions:
- issue: पौलुस के पितृत्व और जन्म देने के रूपक को कैसे व्यक्त किया जाए
  choice: ‘पिता’ और ‘मैंने तुम्हें जन्म दिया’—दोनों रूपकों को मुख्य पाठ में बनाए रखना
  alternative: ‘मैं तुम्हारा आत्मिक पिता बना’
  rationale: व्याख्यात्मक ‘आत्मिक’ जोड़ने से बचते हुए यूनानी पाठ के सशक्त रूपक और पौलुस की विशिष्ट सुसमाचार-जनित भूमिका को सुरक्षित रखा गया है; इससे कोई संस्कारवादी या पादरी-पद संबंधी निष्कर्ष आरोपित नहीं होता।
- issue: ἐν Χριστῷ में संबंध की प्रकृति
  choice: ‘मसीह में’
  alternative: ‘मसीह के कारण’ या ‘मसीह से जुड़े हुए’
  rationale: पौलुस के बहुअर्थी ‘में’ संबंध को व्याख्यात्मक रूप से सीमित नहीं किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘संरक्षक’ प्राचीन सामाजिक भूमिका को स्पष्ट करता है। ‘दस हज़ार’ स्रोत की ठोस अभिव्यक्ति रखता है, जबकि पादटिप्पणी उसके मुहावरेदार बल को बताती है। वाक्य में पौलुस की पुनरुक्ति और पिता-जन्म का तनाव जानबूझकर सुरक्षित रखा गया है।
