  yaml_path: translation/nt/1_corinthians/004/014.yaml
  text: I am not writing these things to shame you[b][a], but admonishing you as my beloved children.
translation:
  language: hi
  text: मैं ये बातें तुम्हें लज्जित करने के लिए[a] नहीं लिख रहा हूँ, बल्कि तुम्हें अपने प्रिय बच्चों की तरह समझा रहा हूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शर्मिंदा करने के लिए।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘तुम्हें अपने प्रिय बच्चों की तरह चेतावनी दे रहा हूँ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντρέπων
  choice: लज्जित करने के लिए
  rationale: नकार के साथ यह लिखने के उद्देश्य या आशय को व्यक्त करता है। ‘लज्जित करना’ यूनानी शब्द के मान-सम्मान और लज्जा से जुड़े बल को बनाए रखता है; ‘संकोच में डालना’ अपेक्षाकृत कमजोर होता।
- source_word: γράφω ταῦτα
  choice: मैं ये बातें ... लिख रहा हूँ
  rationale: वर्तमानकालीन γράφω को पत्र लिखने की वर्तमान क्रिया के रूप में स्वाभाविक ढंग से रखा गया है और बहुवचन ταῦτα के लिए ‘ये बातें’ प्रयुक्त है।
- source_word: ἀλλ’
  choice: बल्कि
  rationale: नकारात्मक आशय और वास्तविक सकारात्मक आशय के बीच स्पष्ट विरोध दिखाता है।
- source_word: ὡς
  choice: के समान
  rationale: यह पौलुस और पाठकों के बीच बच्चों जैसा संबंध व्यक्त करता है, पर उसकी प्रकृति को आवश्यकता से अधिक परिभाषित नहीं करता।
- source_word: τέκνα μου ἀγαπητὰ
  choice: अपने प्रिय बच्चों
  rationale: τέκνα स्त्री-पुरुष दोनों को समेटने वाला संबंधसूचक शब्द है। ‘प्रिय बच्चों’ में आत्मीयता और स्नेह सुरक्षित रहते हैं।
- source_word: νουθετῶν
  choice: तुम्हें समझा रहा हूँ
  rationale: यह ऐसा सुधारात्मक समझाना है जिसमें चेतावनी और नैतिक मार्गदर्शन दोनों निहित हैं। मुख्य पाठ में ‘समझाना’ आधुनिक हिंदी में स्वाभाविक और आत्मीय है; चेतावनी का अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: पौलुस की सुधारात्मक भाषा का चरवाही और पारिवारिक स्वर
  choice: अपने प्रिय बच्चों के समान तुम्हें समझा रहा हूँ
  alternative: अपने प्रिय बच्चों के समान तुम्हें चेतावनी दे रहा हूँ
  rationale: ἐντρέπων के निषेध और νουθετῶν के सकारात्मक कथन का मेल कठोर निंदा नहीं, बल्कि स्नेहपूर्ण सुधार दिखाता है। ‘समझा रहा हूँ’ कोमलता बनाए रखता है, जबकि पादटिप्पणी νουθετέω में उपस्थित चेतावनी के बल को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में आत्मीय, गरिमापूर्ण और सहज शैली अपनाई गई है। ‘तुम्हें’ बहुवचन समुदाय को संबोधित करता है और संदर्भ की निकटता को बनाए रखता है।
