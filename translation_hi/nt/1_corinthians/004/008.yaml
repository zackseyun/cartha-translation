id: 1CO.4.8
reference: 1 Corinthians 4:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἤδη κεκορεσμένοι ἐστέ, ἤδη ἐπλουτήσατε, χωρὶς ἡμῶν ἐβασιλεύσατε· καὶ ὄφελόν γε ἐβασιλεύσατε, ἵνα καὶ ἡμεῖς ὑμῖν συμβασιλεύσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/008.yaml
  text: Already you have had your fill[a]; already you have become rich; apart from us you have become kings. And I wish indeed that you had become kings[c][b], so that we also might reign with you.
translation:
  language: hi
  text: तुम तो पहले ही तृप्त हो चुके हो! तुम तो पहले ही धनी हो गए हो! हमारे बिना ही तुम राज कर रहे हो! काश, तुम सचमुच राज कर रहे होते,[a] ताकि हम भी तुम्हारे साथ राज करते![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “काश, तुमने सचमुच राज किया होता।”
    reason: βασιλεύω का अधिक क्रियात्मक और औपचारिक विकल्प प्रस्तुत करता है।
  - marker: b
    text: 'पौलुस यहाँ व्यंग्य कर रहा है: कुरिन्थ के विश्वासी ऐसा व्यवहार कर रहे थे मानो वे पहले ही पूरी तरह तृप्त और धनी होकर राज कर रहे हों।'
    reason: निकट प्रसंग से स्पष्ट व्यंग्यपूर्ण स्वर को पाठक के लिए संक्षेप में बताता है।
lexical_decisions:
- source_word: ἤδη
  choice: पहले ही
  rationale: दोनों आरंभिक उपवाक्यों में पौलुस के व्यंग्यपूर्ण कालगत बल और पुनरुक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κεκορεσμένοι ἐστέ
  choice: तृप्त हो चुके हो
  rationale: परिणामी वर्तमान दशा व्यक्त करने वाली परिपूर्ण क्रिया-रचना और पेट भर जाने/पूर्ण संतुष्टि के रूपक, दोनों को व्यक्त करता है।
- source_word: ἐπλουτήσατε
  choice: धनी हो गए हो
  rationale: क्रियात्मक भाव—धनवान बन जाना—को सुरक्षित रखता है और प्रसंग में वर्तमान परिणाम भी स्पष्ट करता है।
- source_word: χωρὶς ἡμῶν
  choice: हमारे बिना ही
  rationale: प्रेरितों से स्वतंत्र होकर ऊँचा पद पा लेने के कुरिन्थियों के दावे पर व्यंग्य को सहज हिन्दी में व्यक्त करता है; ‘ही’ विरोधात्मक बल देता है।
- source_word: ἐβασιλεύσατε
  choice: राजा बन गए हो / राजा बन गए होते
  rationale: राजकीय बिंब को बनाए रखते हुए पहले प्रयोग में व्यंग्यपूर्ण दावा और इच्छा-वाक्य में अवास्तविक स्थिति व्यक्त करता है; ‘राज करना शुरू किया’ जैसा स्रोत में अनिवार्य न होने वाला आरंभिक भाव नहीं जोड़ता।
- source_word: ὄφελόν γε
  choice: काश, ... सचमुच
  rationale: तीव्र इच्छा और γε के बल को स्वाभाविक आधुनिक हिन्दी में प्रकट करता है, जबकि व्यंग्य और वास्तविक लालसा का तनाव बना रहता है।
- source_word: ἵνα
  choice: ताकि
  rationale: इच्छित राजत्व के उद्देश्य अथवा परिणाम को स्पष्ट और स्वाभाविक ढंग से जोड़ता है।
- source_word: συμβασιλεύσωμεν
  choice: हम भी तुम्हारे साथ राज करते
  rationale: συν- के सह-राज करने के अर्थ और βασιλεύω के राजकीय बिंब दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: पहले तीन कथनों का स्वर
  choice: विस्मयादिबोधक वाक्यों के द्वारा व्यंग्यपूर्ण दावे के रूप में प्रस्तुत किया
  alternative: उन्हें बिना किसी व्यंग्य-संकेत के सीधी प्रशंसा मानना
  rationale: 4:7–13 का निकट प्रसंग कुरिन्थियों की आत्मधारणा और प्रेरितों की दुर्दशा के बीच तीखा व्यंग्यपूर्ण विरोध दिखाता है। मुख्य पाठ में अर्थ समझ में आता है, और पादटिप्पणी स्वर को स्पष्ट करती है।
- issue: राजत्व की भाषा
  choice: ‘राजा बन गए’ और ‘राज करते’ के रूप में राजकीय बिंब बनाए रखा
  alternative: इसे सामान्य सफलता, अधिकार या ऊँचे दर्जे की भाषा में ढीला कर देना
  rationale: βασιλεύω और συμβασιλεύω स्पष्ट रूप से राज करने की भाषा हैं; यही बिंब इस कथन के संभव भावी/अंतकालीन संकेत और प्रेरितों के साथ विरोध को वहन करता है।
- issue: ὄφελόν γε में व्यंग्य और वास्तविक इच्छा
  choice: ‘काश ... सचमुच’ से दोनों आयाम खुले रखे
  alternative: इसे केवल कटाक्ष या केवल साधारण हार्दिक इच्छा के रूप में निश्चित कर देना
  rationale: वाक्य व्यंग्यपूर्ण संदर्भ में है, फिर भी पौलुस का उनके वास्तविक राजत्व में पहुँचने और उनके साथ राज करने का अभिलाषी भाव बना रह सकता है; अनुवाद इस तनाव को नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु मौखिक रूप से सहज शैली अपनाई गई है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है और यूनानी द्वितीय पुरुष बहुवचन की सीधाई तथा पौलुस की तीखी वाणी को बनाए रखता है। विस्मयादिबोधक चिह्न व्यंग्यात्मक उत्कर्ष को संकेत करते हैं; पादटिप्पणी उसे अति-व्याख्यायित किए बिना स्पष्ट करती है।
