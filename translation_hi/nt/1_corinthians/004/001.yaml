id: 1CO.4.1
reference: 1 Corinthians 4:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὕτως ἡμᾶς λογιζέσθω ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ οἰκονόμους μυστηρίων θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/004/001.yaml
  text: 'This is how a person should regard us: as servants of Messiah and stewards of the mysteries of God[a][b].'
translation:
  language: hi
  text: 'मनुष्य हमें इस प्रकार समझे: मसीह के सेवक और परमेश्वर के भेदों के भंडारी।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''भेदों'' अर्थात परमेश्वर के वे सत्य जो पहले छिपे थे और जिन्हें उसने प्रकट किया।'
    reason: lexical_clarification
lexical_decisions:
- source_word: Οὕτως
  choice: इस प्रकार
  rationale: यह उस ढंग का परिचय देता है जिससे पौलुस और उसके सहकर्मियों को समझा जाना चाहिए; हिन्दी में यह स्वाभाविक और स्रोत के निकट है।
- source_word: ἡμᾶς
  choice: हमें
  rationale: यह λογιζέσθω का कर्म है और प्रसंग में पौलुस तथा उसके सहकर्मियों की ओर संकेत करता है।
- source_word: λογιζέσθω
  choice: समझे
  rationale: वर्तमान आज्ञार्थक का मानक निर्देश हिन्दी में संक्षिप्त और स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: एकवचन ἄνθρωπος यहाँ सामान्य अर्थ रखता है—कोई भी व्यक्ति; 'मनुष्य' स्रोत-रूप और व्यापक अर्थ दोनों को सहजता से व्यक्त करता है।
- source_word: ὑπηρέτας
  choice: सेवक
  rationale: यह अधीन रहकर सेवा करने वालों को दर्शाता है, पर δοῦλος जैसी दासता का विशिष्ट भाव नहीं रखता।
- source_word: Χριστοῦ
  choice: मसीह के
  rationale: Χριστός यहाँ उस पदवी के रूप में प्रयुक्त है जिसकी सेवा ये लोग करते हैं; हिन्दी का प्रचलित पदवीगत रूप 'मसीह' उपयुक्त है।
- source_word: οἰκονόμους
  choice: भंडारी
  rationale: यह सौंपे हुए घराने या संपत्ति का उत्तरदायी प्रबंध करने वाले व्यक्ति का पारंपरिक और सटीक हिन्दी रूप है।
- source_word: μυστηρίων
  choice: भेदों
  rationale: यह परमेश्वर की उन वास्तविकताओं को दर्शाता है जो पहले गुप्त थीं और जिन्हें उसने प्रकट किया; 'भेद' पौलुस के पद की अर्थगत गहराई को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: θεοῦ
  choice: परमेश्वर के
  rationale: सम्बन्धकारक स्वामित्व अथवा स्रोत दोनों का संकेत दे सकता है; हिन्दी संरचना वही उपयोगी अस्पष्टता बनाए रखती है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह के
  alternative: ख्रीष्ट के / क्राइस्ट के
  rationale: यहाँ Χριστός पदवीगत अर्थ में स्वाभाविक है; 'मसीह' हिन्दी में परमेश्वर के अभिषिक्त जन की स्थापित पदवी है।
- issue: μυστηρίων का अर्थ
  choice: भेदों
  alternative: रहस्यों
  rationale: '''भेद'' दिव्य सत्य के पहले छिपे और फिर प्रकट किए जाने के पौलुसी भाव को रखता है; ''रहस्य'' आधुनिक हिन्दी में कभी-कभी ऐसी पहेली का आभास देता है जो अब भी अज्ञात हो।'
- issue: ἄνθρωπος का सामान्य एकवचन
  choice: मनुष्य
  alternative: कोई भी व्यक्ति
  rationale: स्रोत का एकवचन रूप सुरक्षित रहता है, जबकि हिन्दी में 'मनुष्य' इस संदर्भ में स्त्री-पुरुष सभी के लिए सामान्य अर्थ रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी। वाक्य की संक्षिप्त आज्ञार्थक संरचना तथा सेवक/भंडारी के रूपक सुरक्षित रखे गए हैं।
