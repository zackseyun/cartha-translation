  terminology: “सेवक” appropriately avoids importing the stronger slave-status sense associated with δοῦλος. “भंडारी” accurately conveys οἰκονόμους, and “भेद” suitably conveys the Pauline sense of μυστήρια without making the main text overly explanatory. The footnote helpfully clarifies this term.
