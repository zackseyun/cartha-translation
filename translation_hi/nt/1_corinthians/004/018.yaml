  text: Some have become puffed up[b][a], as though I were not coming to you.
translation:
  language: hi
  text: कुछ लोग अभिमान से फूल गए हैं[a][b], मानो मैं तुम्हारे पास आने वाला ही नहीं हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुछ लोग घमण्डी हो गए हैं, मानो मैं तुम्हारे पास आने वाला ही नहीं हूँ।”
    reason: lexical_alternative
  - marker: b
    text: पौलुस 1 कुरिन्थियों में अपने को बहुत महत्त्व देने वाले घमण्ड के लिए बार-बार ‘फूलने’ की छवि का प्रयोग करता है; देखें 1 कुरिन्थियों 4:6; 4:19; 5:2; 8:1; 13:4।
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: यह मानकर ... कि
  rationale: यह प्रयोग उस गलत धारणा को व्यक्त करता है जिसके आधार पर कुछ लोगों का रवैया बना; आधुनिक हिन्दी में यह स्वाभाविक रहते हुए ὡς की अनुमानात्मक शक्ति को बनाए रखता है।
- source_word: μὴ ἐρχομένου ... μου πρὸς ὑμᾶς
  choice: मैं तुम्हारे पास नहीं आ रहा हूँ
  rationale: ὡς पर निर्भर संबंधवाचक कृदन्त-रचना को हिन्दी में आश्रित कथन बनाया गया है। 'यह मानकर' स्पष्ट करता है कि यह पौलुस का सीधा कथन नहीं, बल्कि उन लोगों की धारणा है।
- source_word: δέ
  choice: —
  rationale: δέ यहाँ हल्का प्रसंग-संयोजक है; अलग शब्द जोड़ने के बजाय वाक्य का प्रवाह उसके कार्य को स्वाभाविक रूप से वहन करता है।
- source_word: ἐφυσιώθησάν
  choice: फूल गए हैं
  rationale: यह φυσιόω के 'फुलाने/फूल जाने' वाले रूपक को सुरक्षित रखता है और 1 कुरिन्थियों में पौलुस की बार-बार प्रयुक्त छवि से संगति बनाए रखता है। 'गए हैं' उत्पन्न हुई वर्तमान दशा को व्यक्त करता है।
- source_word: τινες
  choice: कुछ लोग
  rationale: यह मण्डली के भीतर के एक अनिश्चित समूह को सहज और स्पष्ट आधुनिक हिन्दी में दर्शाता है।
theological_decisions:
- issue: कुरिन्थियों के घमण्ड पर पौलुस की आलोचना का अनुवाद
  choice: '''फूल गए हैं'' रूपक को बनाए रखना'
  alternative: '''घमण्डी हो गए हैं'''
  rationale: मूल पाठ में गर्व के लिए केवल व्याख्यात्मक शब्द नहीं, बल्कि फूलने का सजीव रूपक है। इसे बनाए रखने से पत्र के भीतर पौलुस की अलंकारिक निरन्तरता दिखाई देती है, जबकि पाद-टिप्पणी अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। 'तुम्हारे' पौलुस के बहुवचन ὑμᾶς को सामान्य हिन्दी में व्यक्त करता है। 'यह मानकर' कल्पित/गलत धारणा को स्पष्ट करता है, और 'फूल गए हैं' मूल रूपक को बचाता है।
