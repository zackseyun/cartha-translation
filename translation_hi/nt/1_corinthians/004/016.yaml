  text: 'Therefore I urge you: become imitators of me[a][b].'
translation:
  language: hi
  text: 'इसलिए मैं तुमसे आग्रह करता हूँ: मेरे अनुकरण करने वाले बनो[a][b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा अनुकरण करने वाले बनो।”
    reason: lexical_alternative
  - marker: b
    text: पौलुस एक अन्य स्थान पर स्पष्ट करता है, “तुम मेरा अनुकरण करो, जैसे मैं भी मसीह का अनुकरण करता हूँ” (1 कुरिन्थियों 11:1)।
    reason: cross_reference
lexical_decisions:
- source_word: παρακαλῶ
  choice: मैं तुमसे आग्रह करता हूँ
  rationale: यह पौलुस की गंभीर और आत्मीय विनती के साथ उपदेशात्मक बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्पष्ट रूप से जोड़ता है।
- source_word: ὑμᾶς
  choice: तुमसे
  rationale: यह बहुवचन सम्बोधन है; कलीसिया को सम्बोधित करते हुए ‘तुम’ सहज और स्पष्ट है।
- source_word: μιμηταί
  choice: अनुकरण करनेवाले
  rationale: यह किसी के आचरण और नमूने को अपनाने का अर्थ सीधे बनाए रखता है; केवल ‘अनुयायी’ कहना अर्थ को व्यापक और कुछ कमजोर कर देता।
- source_word: μου
  choice: मेरे
  rationale: यह μιμηταί के साथ पौलुस को अनुकरण का तत्काल आदर्श बतानेवाले सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γίνεσθε
  choice: बनो
  rationale: आज्ञार्थक रूप किसी अवस्था या भूमिका को अपनाने का भाव देता है; ‘बनो’ इसे ‘हो’ से अधिक ठीक व्यक्त करता है।
theological_decisions:
- issue: पौलुस स्वयं को अनुकरण का आदर्श बनने के लिए कहता है, जिसे व्यापक मसीह-केंद्रित सन्दर्भ से अलग करके अत्युक्त किया जा सकता है।
  choice: मुख्य पाठ में कथन को सीधे ‘मेरे अनुकरण करनेवाले बनो’ रखा गया है।
  alternative: मेरे उदाहरण पर चलो
  rationale: यूनानी पाठ पौलुस को तत्काल आदर्श के रूप में स्पष्ट रूप से प्रस्तुत करता है। मुख्य पाठ में इसे नरम करना मूल कथन की धर्मवैचारिक तीक्ष्णता को घटा देता; व्यापक मसीह-केंद्रित सन्दर्भ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज शैली रखी गई है। ‘अनुकरण करनेवाले’ मूल के निकट है, जबकि ‘आग्रह करता हूँ’ παρακαλῶ की आत्मीय परन्तु दृढ़ अपील को व्यक्त करता है।
