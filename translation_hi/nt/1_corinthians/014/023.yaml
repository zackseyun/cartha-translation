id: 1CO.14.23
reference: 1 Corinthians 14:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν οὖν συνέλθῃ ἡ ἐκκλησία ὅλη ἐπὶ τὸ αὐτὸ καὶ πάντες ⸂λαλῶσιν γλώσσαις⸃, εἰσέλθωσιν δὲ ἰδιῶται ἢ ἄπιστοι, οὐκ ἐροῦσιν ὅτι μαίνεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/023.yaml
  text: Therefore[a], if the whole church comes together in one place and all speak in tongues, and uninstructed people or unbelievers enter[b], will they not say that you are out of your minds?
translation:
  language: hi
  text: इसलिए, यदि पूरी कलीसिया एक ही स्थान पर इकट्ठी हो और सभी भाषाओं में बोलें[a], और अनभिज्ञ लोग[b] या अविश्वासी भीतर आएँ, तो क्या वे यह नहीं कहेंगे कि तुम पागल हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द γλῶσσαι का सामान्य अर्थ ‘भाषाएँ’ है। 1 कुरिन्थियों 12–14 में यह आत्मिक वाणी के इस विशेष प्रसंग के लिए प्रयुक्त है; यह पद अपने आप यह तय नहीं करता कि वह मानव भाषाएँ थीं, किसी अन्य प्रकार की आत्मिक वाणी थी, या दोनों।
    reason: alternative_reading
  - marker: b
    text: या, “बाहरी लोग”; अर्थात ऐसे लोग जो सभा की रीति या इस विषय से परिचित नहीं हैं। यहाँ उन्हें ‘अविश्वासियों’ से अलग बताया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकलने वाले निष्कर्ष को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἡ ἐκκλησία ὅλη
  choice: पूरी कलीसिया
  rationale: पौलुस के प्रयोग में यह एकत्रित मसीही समुदाय है; ‘पूरी’ से ὅλη का समग्र बल बना रहता है।
- source_word: συνέλθῃ ... ἐπὶ τὸ αὐτό
  choice: एक ही स्थान पर इकट्ठी हो
  rationale: यह अनुवाद एकत्र होने और समान स्थान पर होने—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λαλῶσιν γλώσσαις
  choice: भिन्न भाषाएँ बोलें
  rationale: γλῶσσαι का मूल भाषिक अर्थ रखते हुए वाक्य को सहज हिन्दी में प्रस्तुत किया गया है; पादटिप्पणी बताती है कि प्रसंग में यह विशेष आत्मिक वरदान के लिए प्रयुक्त पद है और उसकी प्रकृति पर निर्णय नहीं करती।
- source_word: ἰδιῶται
  choice: अनभिज्ञ लोग
  rationale: यह उन लोगों का संकेत करता है जो सभा की प्रथाओं या इस विषय से परिचित अथवा दीक्षित नहीं हैं; इससे अगले पद ‘अविश्वासी’ के साथ भेद बना रहता है।
- source_word: ἄπιστοι
  choice: अविश्वासी
  rationale: यह उन लोगों के लिए मानक और स्पष्ट हिन्दी पद है जो विश्वास नहीं करते।
- source_word: εἰσέλθωσιν
  choice: वहाँ ... आ जाएँ
  rationale: प्रवेश करने का स्थानिक भाव सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: οὐκ ἐροῦσιν ὅτι
  choice: तो क्या वे यह नहीं कहेंगे कि
  rationale: यह अपेक्षित सकारात्मक उत्तर वाले आलंकारिक प्रश्न और भविष्यकालीन भाव दोनों को बनाए रखता है।
- source_word: μαίνεσθε
  choice: तुम पागल हो
  rationale: यह क्रिया के ‘विक्षिप्त समझे जाने’ के तीखे आरोप को संक्षिप्त, स्पष्ट और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: 1 कुरिन्थियों 14 में γλῶσσαι की प्रकृति
  choice: मुख्य पाठ में ‘भिन्न भाषाएँ’ और पादटिप्पणी में प्रसंगगत ‘अन्य भाषाएँ बोलने’ के आत्मिक वरदान का संकेत
  alternative: ‘अन्य भाषाएँ बोलें’ या ‘अनजानी भाषाएँ बोलें’
  rationale: ‘अनजानी’ जोड़ने से स्रोत से अधिक अर्थ आ सकता है, जबकि केवल किसी आधुनिक तकनीकी पद का उपयोग पाठकों को घटना की किसी एक व्याख्या की ओर ले जा सकता है। चुना गया रूप मूल शब्द का भाषिक अर्थ रखता है और पादटिप्पणी मानव भाषाओं, आत्मिक वाणी या अन्य प्रस्तावित समझों के बीच विवाद को खुला छोड़ती है।
- issue: ἰδιῶται और ἄπιστοι के बीच भेद
  choice: ‘अनभिज्ञ लोग’ और ‘अविश्वासी’ को अलग समूहों के रूप में रखा
  alternative: ἰδιῶται के लिए ‘बाहरी लोग’
  rationale: ‘बाहरी लोग’ का अर्थ ‘अविश्वासी’ से बहुत अधिक मिल सकता है। ‘अनभिज्ञ’ सभा की रीति या संबंधित वरदान से अपरिचित होने का भाव रखता है और पौलुस के शब्दगत भेद को नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘कलीसिया’ हिन्दी मसीही पाठकों में स्थापित पद है। वाक्य की आलंकारिक प्रश्न-रचना और मूल का तीखा निष्कर्ष सुरक्षित रखा गया है।
