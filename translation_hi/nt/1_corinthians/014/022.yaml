source:
  edition: SBLGNT
  text: ὥστε αἱ γλῶσσαι εἰς σημεῖόν εἰσιν οὐ τοῖς πιστεύουσιν ἀλλὰ τοῖς ἀπίστοις, ἡ δὲ προφητεία οὐ τοῖς ἀπίστοις ἀλλὰ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/022.yaml
  text: So then[a], tongues are for a sign not to those who believe but to unbelievers[b], while prophecy is not to unbelievers but to those who believe.
translation:
  language: hi
  text: इसलिए भाषाएँ[a] विश्वास करने वालों के लिए नहीं, बल्कि अविश्वासियों के लिए एक चिन्ह हैं[b]; पर भविष्यवाणी अविश्वासियों के लिए नहीं, बल्कि विश्वास करने वालों के लिए है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ “भाषाएँ” है। 1 कुरिन्थियों 12–14 में यह उस स्थापित पारिभाषिक प्रयोग को सूचित करता है जिसे “अन्य भाषाएँ बोलना” भी कहा जाता है; यह शब्द स्वयं वाणी की ठीक प्रकृति का निर्णय नहीं करता।
    reason: lexical_alternative
  - marker: b
    text: पिछली आयतों में यशायाह 28:11–12 के उद्धरण को देखते हुए, कुछ व्याख्याकार “चिन्ह” को न्याय के चिन्ह के रूप में समझते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले तर्क से निकलने वाले निष्कर्ष को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: γλῶσσαι
  choice: अन्य भाषाएँ
  rationale: γλῶσσαι का मूल अर्थ ‘भाषाएँ/जीभें’ है। आधुनिक हिन्दी में ‘अन्य भाषाएँ’ प्रसंग को सहज बनाता है, जबकि पादटिप्पणी प्रचलित पारिभाषिक विकल्प और व्याख्यात्मक अनिश्चितता सुरक्षित रखती है।
- source_word: εἰς σημεῖόν
  choice: एक चिन्ह हैं
  rationale: εἰς के उद्देश्य/परिणाम संबंधी बल को हिन्दी में स्वाभाविक विधेय रचना द्वारा व्यक्त किया गया है; ‘चिन्ह’ को सकारात्मक या न्यायसूचक कहकर अर्थ सीमित नहीं किया गया।
- source_word: τοῖς πιστεύουσιν
  choice: विश्वास करनेवालों के लिए
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत की क्रियात्मक धारणा को स्पष्ट रखता है।
- source_word: τοῖς ἀπίστοις
  choice: अविश्वासियों के लिए
  rationale: यह πιστεύουσιν के साथ स्पष्ट और संक्षिप्त विरोध बनाता है तथा धार्मिक-सामुदायिक संदर्भ में स्वाभाविक है।
- source_word: προφητεία
  choice: भविष्यवाणी
  rationale: यह इस अध्याय में भविष्यद्वाणी के वरदान या क्रिया के लिए प्रचलित, सीधा हिन्दी शब्द है।
- source_word: δὲ
  choice: पर
  rationale: यह अन्य भाषाओं और भविष्यवाणी के बीच यूनानी पाठ में उपस्थित विरोध को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: करिश्माई संदर्भ में γλῶσσαι का अर्थ
  choice: मुख्य पाठ में ‘अन्य भाषाएँ’, साथ में ‘अन्य भाषा बोलना’ का पारिभाषिक विकल्प पादटिप्पणी में
  alternative: विदेशी भाषाएँ; अलौकिक या भावावेशपूर्ण वाणी
  rationale: यूनानी शब्द की भाषासंबंधी व्यापकता रखी गई है और इस वाणी की ठीक प्रकृति के विषय में किसी संप्रदायगत निष्कर्ष को मुख्य पाठ में नहीं थोपा गया।
- issue: अविश्वासियों के संबंध में σημεῖον का आशय
  choice: तटस्थ रूप से ‘एक चिन्ह’
  alternative: पुष्टि का चिन्ह; न्याय का चिन्ह
  rationale: निकटवर्ती यशायाह उद्धरण के कारण न्यायसूचक अर्थ संभव है, पर यूनानी पाठ केवल ‘चिन्ह’ कहता है; इसलिए मुख्य पाठ विवाद का निर्णय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और सामान्य पाठक के लिए गरिमापूर्ण किंतु सहज शैली। समानांतर विरोध को ‘नहीं, बल्कि’ द्वारा स्पष्ट रखा गया है; ‘विश्वास करनेवाले’ मूल कृदंत की क्रियात्मकता बनाए रखता है।
