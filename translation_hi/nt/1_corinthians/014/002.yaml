source:
  edition: SBLGNT
  text: ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ⸀ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/002.yaml
  text: For the one speaking in a tongue does not speak to people but to God, for no one understands; rather, he speaks mysteries in the Spirit.
translation:
  language: hi
  text: क्योंकि जो एक भाषा में बोलता है, वह लोगों से नहीं, बल्कि परमेश्वर से बोलता है; क्योंकि कोई उसे समझता नहीं[a]। बल्कि वह आत्मा में रहस्य की बातें बोलता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “कोई सुनता नहीं।” यूनानी क्रिया का अर्थ “सुनना” हो सकता है और प्रसंगानुसार “समझना” भी।'
    reason: lexical_alternative
  - marker: b
    text: “आत्मा में” से पवित्र आत्मा या बोलने वाले की अपनी आत्मा का बोध हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: जो ... बोलता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत का सामान्य और स्वाभाविक हिन्दी रूप; यह किसी विशेष व्यक्ति तक कथन को सीमित नहीं करता।
- source_word: γλώσσῃ
  choice: अन्य भाषा में
  rationale: एकवचन और बोलने के माध्यम को बनाए रखता है। ‘अनजानी भाषा’ समझ न आने का अर्थ पहले ही जोड़ देती, जबकि ‘अन्य भाषा’ मूल की अभिव्यक्ति को अपेक्षाकृत खुला रखती है।
- source_word: ἀνθρώποις
  choice: मनुष्यों से
  rationale: बहुवचन का सामान्य, लिंग-समावेशी अर्थ व्यक्त करता है और λαλεῖ के साथ हिन्दी में स्वाभाविक है।
- source_word: θεῷ
  choice: परमेश्वर से
  rationale: दत्तिव कारक को हिन्दी में बोलने के संबोधित पक्ष के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀκούει
  choice: समझता
  rationale: मूल क्रिया का प्राथमिक अर्थ ‘सुनना’ है, पर इस प्रसंग में बोध न होने का आशय प्रमुख है। शाब्दिक विकल्प फुटनोट में रखा गया है।
- source_word: πνεύματι
  choice: आत्मा में
  rationale: दत्तिव पदबंध को ऐसा रखा गया है कि वह पवित्र आत्मा अथवा बोलने वाले की आत्मा—दोनों संभावित संकेतों को समय से पहले निर्णीत न करे।
- source_word: μυστήρια
  choice: रहस्य की बातें
  rationale: ‘रहस्य’ पौलुस की धर्मवैचारिक गूँज को बनाए रखता है; ‘की बातें’ जोड़ने से हिन्दी वाक्य स्वाभाविक बनता है।
- source_word: δὲ
  choice: इसके विपरीत
  rationale: पिछले कथन से विरोध और स्पष्टीकरण के संबंध को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: πνεύματι का संकेत
  choice: मुख्य पाठ में ‘आत्मा में’
  alternative: ‘पवित्र आत्मा में’ अथवा ‘अपनी आत्मा में’
  rationale: यूनानी पदबंध व्याकरण की दृष्टि से पवित्र आत्मा या बोलने वाले की आत्मा, दोनों की ओर संकेत कर सकता है। मुख्य पाठ अस्पष्टता बनाए रखता है और फुटनोट दोनों संभावनाएँ बताता है।
- issue: γλώσσῃ की प्रकृति
  choice: ‘अन्य भाषा में’
  alternative: ‘एक जीभ में’, ‘अनजानी भाषा में’ अथवा ‘अन्य भाषाएँ बोलते हुए’
  rationale: यहाँ वाणी की ठीक प्रकृति को किसी विशिष्ट सांप्रदायिक समझ के अनुसार परिभाषित नहीं किया गया; एकवचन को रखते हुए हिन्दी में अर्थपूर्ण अभिव्यक्ति चुनी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वाक्य-संरचना मूल के कारणसूचक क्रम को बनाए रखती है। ‘आत्मा’ में देवनागरी की प्रकृति के कारण बड़े-छोटे अक्षर से भेद संभव नहीं, इसलिए वास्तविक संदर्भगत अस्पष्टता फुटनोट में स्पष्ट की गई है।
