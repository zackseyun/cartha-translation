  text: ἐπεὶ ἐὰν ⸀εὐλογῇς ⸀πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ; ἐπειδὴ τί λέγεις οὐκ οἶδεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/016.yaml
  text: Otherwise[a], if you bless in the spirit, how will the one filling the place of the uninstructed say the Amen at your thanksgiving[c][b], since he does not know what you are saying?
translation:
  language: hi
  text: नहीं तो, यदि तुम आत्मा में आशीष देते हो,[a] तो जो अनभिज्ञ व्यक्ति के स्थान पर बैठा है, वह तुम्हारे धन्यवाद देने पर[c] “आमीन” कैसे कहेगा? क्योंकि वह नहीं जानता कि तुम क्या कह रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आत्मा में” का अनुवाद “आत्मा से” भी हो सकता है; यूनानी यहाँ इससे अधिक निश्चित अर्थ आवश्यक नहीं करता।
    reason: alternative_reading
  - marker: c
    text: यहाँ “धन्यवाद” से आशय धन्यवाद देना है, न कि अनिवार्य रूप से बाद के तकनीकी शब्द “यूखरिस्त” से।
    reason: cultural_note
lexical_decisions:
- source_word: ἐπεὶ ἐὰν
  choice: नहीं तो, यदि
  rationale: यह पद पिछले तर्क से निकलने वाली व्यावहारिक कठिनाई बताता है; यह रूप शर्त और सुधारात्मक निष्कर्ष दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εὐλογῇς
  choice: आशीष देते हो
  rationale: यह सामूहिक आराधना में बोली गई आशीष को दर्शाता है और मूल क्रिया के सामान्य अर्थ को सुरक्षित रखता है।
- source_word: πνεύματι
  choice: आत्मा में
  rationale: यूनानी चतुर्थी साधन या क्षेत्र दोनों का बोध करा सकती है। यह अनुवाद जानबूझकर यह तय नहीं करता कि यहाँ मनुष्य की आत्मा है या पवित्र आत्मा से प्रेरित वाणी।
- source_word: ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου
  choice: जो अनजान व्यक्ति का स्थान लेता है
  rationale: वाक्यांश की स्थान-संबंधी छवि बनाए रखी गई है। ἰδιώτης यहाँ उस व्यक्ति को दर्शाता है जिसे कही जा रही बात का विशेष ज्ञान या समझ नहीं है।
- source_word: πῶς ἐρεῖ τὸ Ἀμήν
  choice: “आमीन” कैसे कहेगा
  rationale: ‘आमीन’ को सभा में सहमति व्यक्त करने वाली प्रचलित प्रतिक्रिया के रूप में सुरक्षित रखा गया है।
- source_word: ἐπὶ τῇ σῇ εὐχαριστίᾳ
  choice: तुम्हारे धन्यवाद पर
  rationale: यह किसी के द्वारा धन्यवाद देने की वाणी को दर्शाता है; बाद के तकनीकी संस्कार-संबंधी अर्थ को पाठ में नहीं जोड़ा गया।
- source_word: τί λέγεις οὐκ οἶδεν
  choice: वह नहीं जानता कि तुम क्या कह रहे हो
  rationale: यह मूल के निकट रहते हुए स्पष्ट करता है कि समस्या कही गई बात की अबोधगम्यता है।
theological_decisions:
- issue: πνεύματι का संदर्भ
  choice: आत्मा में
  alternative: अपनी आत्मा से; पवित्र आत्मा के द्वारा
  rationale: मूल पाठ निश्चित रूप से नहीं बताता कि आशय वक्ता की मानवीय आत्मा है या आत्मा से समर्थ की गई वाणी; अतः अस्पष्टता बनाए रखी गई है।
- issue: εὐχαριστίᾳ का अर्थ
  choice: धन्यवाद
  alternative: यूखरिस्त/प्रभुभोज
  rationale: तात्कालिक संदर्भ सभा में बोले गए धन्यवाद का है। बाद का संस्कार-संबंधी तकनीकी अर्थ यहाँ अनिवार्य नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। ‘अनजान व्यक्ति’ सामान्य पाठक के लिए बोधगम्य है और ἰδιώτης को बाहरी व्यक्ति या अशिक्षित व्यक्ति के रूप में अत्यधिक सीमित नहीं करता। मुख्य पाठ में एकमात्र पाद-टिप्पणी-चिह्न [a] उपस्थित है।
