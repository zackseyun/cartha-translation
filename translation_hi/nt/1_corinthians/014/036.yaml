base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/036.yaml
  text: Or did the word of God go out from you[b][a], or has it reached only you?
translation:
  language: hi
  text: या क्या परमेश्वर का वचन तुम्हीं से निकला था,[a] या वह केवल तुम्हीं तक पहुँचा है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या परमेश्वर के वचन का आरंभ तुम्हीं से हुआ था?”
    reason: lexical_alternative
  - marker: b
    text: या, “या क्या वह केवल तुम्हीं के पास आया था?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: या क्या
  rationale: आरंभिक विकल्पसूचक कण ἤ को प्रश्न के साथ स्वाभाविक हिन्दी में रखा गया है; प्रश्न की संरचना ही पौलुस की तीखी फटकार प्रकट करती है।
- source_word: ἀφ’ ὑμῶν
  choice: तुम्हीं से
  rationale: ἀπό के स्रोत या उद्गम के भाव को सुरक्षित रखता है; ‘ही’ कुरिन्थियों के स्वयं को स्रोत मानने के दावे पर बल देता है।
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: यह प्रचलित, गरिमापूर्ण और व्यापक पदबंध है, जो इसे केवल सुसमाचार या सभा की किसी भविष्यवाणी तक सीमित नहीं करता।
- source_word: ἐξῆλθεν
  choice: निकला था
  rationale: ἐξέρχομαι के बाहर निकलने या किसी स्रोत से आने के मूल बिंब को बनाए रखता है; हिन्दी में भूतकाल उस आलंकारिक प्रश्न के अनुकूल है।
- source_word: εἰς ὑμᾶς μόνους
  choice: केवल तुम्हीं तक
  rationale: εἰς की गंतव्य-दिशा और μόνους की अनन्यता—दोनों को स्पष्ट एवं स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατήντησεν
  choice: पहुँचा है
  rationale: καταντάω के ‘किसी गंतव्य तक पहुँचना’ अर्थ को सीधे व्यक्त करता है और वर्तमान तक प्रासंगिक परिणाम का भाव बनाए रखता है।
theological_decisions:
- issue: ‘परमेश्वर का वचन’ का संदर्भ
  choice: इसे व्यापक रूप में ‘परमेश्वर का वचन’ रखा गया है।
  alternative: इसे विशेष रूप से ‘सुसमाचार का संदेश’ या ‘सभा में भविष्यवाणी का वचन’ कहना।
  rationale: संदर्भ में यह परमेश्वर के प्रामाणिक संदेश, सुसमाचार और प्रेरितीय शिक्षा की ओर व्यापक संकेत कर सकता है। अनुवाद किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘तुम्हीं’ और ‘केवल तुम्हीं’ मूल के जोर तथा आलंकारिक फटकार को व्यक्त करते हैं। दोनों पादटिप्पणी-चिह्न संबंधित वाक्यांशों के तुरंत बाद रखे गए हैं।
