  rationale: यह पद शब्द के भाषिक अर्थ को सामने रखता है, पर यह निर्णय नहीं करता कि यहाँ ज्ञात मानवीय भाषाएँ, अलौकिक वाणी, या कोई व्यापक आत्मिक घटना अभिप्रेत है। परंपरागत ‘अन्य-अन्य भाषा’ को पादटिप्पणी में रखा गया है।
