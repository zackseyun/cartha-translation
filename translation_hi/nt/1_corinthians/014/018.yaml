- source_word: πάντων ὑμῶν μᾶλλον
  choice: तुम सब से अधिक
  rationale: तुलनात्मक μᾶλλον और संबंधकारक πάντων ὑμῶν का स्पष्ट, सहज हिन्दी तुलनात्मक रूप।
- source_word: γλώσσαις
  choice: अन्य भाषाओं में
  rationale: γλῶσσα का मूल अर्थ ‘भाषा’ भी है और 1 कुरिन्थियों 12–14 में यह विशेष आत्मिक घटना का संकेतक पद है। ‘अन्य भाषाओं’ से हिन्दी में अर्थ स्पष्ट रहता है, जबकि घटना की सटीक प्रकृति तय नहीं की जाती।
- source_word: λαλῶ
  choice: मैं ... बोलता हूँ
  rationale: वर्तमानकालीन कथन के लिए सामान्य वर्तमान का स्वाभाविक हिन्दी रूप।
