  edition: SBLGNT
  text: ἐὰν γὰρ προσεύχωμαι γλώσσῃ, τὸ πνεῦμά μου προσεύχεται, ὁ δὲ νοῦς μου ἄκαρπός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/014.yaml
  text: For if I pray in a tongue[a], my spirit prays[b], but my mind is unfruitful.
translation:
  language: hi
  text: क्योंकि यदि मैं किसी भाषा में प्रार्थना करता हूँ[a], तो मेरी आत्मा प्रार्थना करती है, पर मेरी बुद्धि निष्फल रहती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जीभ से।” यूनानी शब्द किसी मानवीय भाषा के लिए भी प्रयुक्त हो सकता है, या इस अध्याय में प्रयुक्त विशेष प्रकार की वाणी के अर्थ में।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरी समझ निष्फल रहती है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: क्योंकि यदि
  rationale: γάρ पिछले तर्क का कारण या स्पष्टीकरण देता है और ἐάν शर्त प्रस्तुत करता है; ‘क्योंकि यदि’ दोनों संबंधों को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: προσεύχωμαι
  choice: मैं ... प्रार्थना करता हूँ
  rationale: ἐάν के साथ वर्तमान संभावनार्थक क्रिया को हिंदी की सामान्य शर्तवाचक वर्तमान रचना से व्यक्त किया गया है।
- source_word: γλώσσῃ
  choice: किसी अन्य भाषा में
  rationale: γλῶσσα का अर्थ ‘जीभ’ या ‘भाषा’ हो सकता है। इस अध्याय में वाणी के प्रकार को दिखाने के लिए ‘अन्य भाषा’ आधुनिक हिंदी में अधिक बोधगम्य है, जबकि पदटिप्पणी पारंपरिक ‘अन्य भाषा बोलने’ के विशेष अर्थ की संभावना सुरक्षित रखती है।
- source_word: τὸ πνεῦμά μου
  choice: मेरी आत्मा
  rationale: यह वक्ता के अपने πνεῦμα को सीधे व्यक्त करता है और इसे स्पष्ट रूप से पवित्र आत्मा ठहराने से बचता है।
- source_word: ὁ δὲ νοῦς μου
  choice: पर मेरी बुद्धि
  rationale: νοῦς यहाँ सोचने-समझने की क्षमता के अर्थ में πνεῦμα के विपरीत रखा गया है; ‘बुद्धि’ संक्षिप्त और स्वाभाविक हिंदी समतुल्य है।
- source_word: ἄκαρπός ἐστιν
  choice: निष्फल रहती है
  rationale: यह ἄκαρπος के फल-संबंधी रूपक को बनाए रखता है और हिंदी में मानसिक क्षमता के संदर्भ में स्वाभाविक लगता है।
theological_decisions:
- issue: ‘मेरी आत्मा’ (τὸ πνεῦμά μου) का संदर्भ
  choice: वक्ता की अपनी आत्मा
  alternative: वक्ता में कार्यरत पवित्र आत्मा
  rationale: ‘मेरी’ और ‘मेरी बुद्धि’ के साथ विरोध वक्ता के भीतर के पक्षों की ओर संकेत करता है। फिर भी अनुवाद केवल ‘मेरी आत्मा’ कहता है और पवित्र आत्मा की भूमिका के व्यापक प्रश्न को निर्णायक रूप से नहीं सुलझाता।
- issue: γλώσσῃ की प्रकृति
  choice: ‘किसी अन्य भाषा में’, जिसकी सटीक प्रकृति खुली रखी गई है
  alternative: विशेष रूप से कोई मानवीय विदेशी भाषा, अथवा केवल अलौकिक/आत्मिक वाणी
  rationale: ग्रीक शब्द दोनों प्रकार के भाषा-संबंधी प्रयोग की गुंजाइश रखता है और अध्याय का संदर्भ आत्मा-सक्षम वाणी से जुड़ा है; पदटिप्पणी किसी एक व्याख्या को अनिवार्य नहीं बनाती।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘आत्मा’ और ‘बुद्धि’ का विरोध सुरक्षित रखा गया है तथा ‘निष्फल’ से मूल फल-रूपक बनाए रखा गया है।
