id: 1CO.14.35
reference: 1 Corinthians 14:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δέ τι ⸀μαθεῖν θέλουσιν, ἐν οἴκῳ τοὺς ἰδίους ἄνδρας ἐπερωτάτωσαν, αἰσχρὸν γάρ ἐστιν γυναικὶ ⸂λαλεῖν ἐν ἐκκλησίᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/035.yaml
  text: But if they want to learn anything[a], let them ask their own husbands at home[b], for it is shameful for a woman to speak in the assembly.
translation:
  language: hi
  text: पर यदि वे कुछ सीखना चाहती हैं, तो घर पर अपने-अपने पतियों से पूछें, क्योंकि सभा[b] में किसी स्त्री[a] का बोलना लज्जाजनक है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसी पत्नी का।” यूनानी शब्द का अर्थ संदर्भ के अनुसार “स्त्री” या “पत्नी” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “कलीसिया में” अथवा “मण्डली में”; यूनानी शब्द यहाँ एकत्र हुए समुदाय को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθεῖν
  choice: सीखना
  rationale: यह μανθάνω के अर्थ को सीधे और स्वाभाविक रूप से व्यक्त करता है तथा जानने या शिक्षा पाने के भाव को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἐν οἴκῳ
  choice: घर पर
  rationale: यह हिन्दी में स्वाभाविक घरेलू मुहावरा है और एकत्र सभा के साथ निहित विरोध को बनाए रखता है।
- source_word: τοὺς ἰδίους ἄνδρας
  choice: अपने-अपने पतियों
  rationale: ἄνδρας का अर्थ पुरुष या पति हो सकता है, पर ἰδίους और घरेलू संदर्भ यहाँ वैवाहिक अर्थ का प्रबल समर्थन करते हैं। 'अपने-अपने' यूनानी के वितरणात्मक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐπερωτάτωσαν
  choice: पूछें
  rationale: यह वर्तमान आज्ञार्थक के पूछने या जानकारी लेने के अर्थ और निर्देशात्मक बल को संक्षेप में सुरक्षित रखता है।
- source_word: αἰσχρὸν
  choice: लज्जाजनक
  rationale: यह सामाजिक-नैतिक लज्जा या अपमान के भाव को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: γυναικὶ
  choice: किसी स्त्री का
  rationale: γυνή का अर्थ स्त्री या पत्नी दोनों हो सकता है। मुख्य पाठ में सामान्य अर्थ 'स्त्री' रखा गया है और वैवाहिक अर्थ को पादटिप्पणी में सुरक्षित किया गया है। हिन्दी में 'किसी' सामान्य कथन को स्वाभाविक बनाता है।
- source_word: λαλεῖν
  choice: बोलना
  rationale: यह क्रिया के व्यापक अर्थ को बनाए रखता है और भाषण के प्रकार को प्रश्न, भविष्यवाणी या विघ्नकारी बातचीत तक सीमित नहीं करता।
- source_word: ἐν ἐκκλησίᾳ
  choice: सभा में
  rationale: यहाँ ἐκκλησία एकत्र समुदाय को दर्शाता है। 'सभा' उस सामूहिक एकत्रीकरण को व्यक्त करती है और संस्था या भवन का अनावश्यक अर्थ नहीं जोड़ती।
theological_decisions:
- issue: सभा में स्त्रियों के बोलने संबंधी कथन का दायरा
  choice: मुख्य पाठ में कथन को व्यापक रूप में रखा गया है और बोलने के किसी खास प्रकार तक सीमित नहीं किया गया।
  alternative: इसे केवल विघ्नकारी प्रश्नों, भविष्यवाणियों को परखने, या कुरिन्थियों के उद्धृत मत के रूप में सीमित करना।
  rationale: यूनानी वाक्य स्वयं केवल स्त्री के सभा में बोलने को लज्जाजनक कहता है; भाषिक प्रमाण उसके सटीक दायरे को स्पष्ट नहीं करता। इसलिए अनुवाद व्याख्यात्मक तनाव को बनाए रखता है।
- issue: γυνή और ἀνήρ के स्त्री/पत्नी तथा पुरुष/पति अर्थ
  choice: ἄνδρας के लिए 'पतियों' और γυναικὶ के लिए मुख्य पाठ में 'स्त्री' रखा गया है; 'पत्नी' का विकल्प पादटिप्पणी में दिया गया है।
  alternative: दोनों को लगातार 'पत्नी/पति' या 'स्त्री/पुरुष' के रूप में अनूदित करना।
  rationale: '''अपने-अपने'' और घर का संदर्भ ἄνδρας के लिए ''पति'' का समर्थन करता है, जबकि एकवचन γυναικὶ सामान्य ''स्त्री'' अथवा संदर्भानुसार ''पत्नी'' दोनों हो सकता है।'
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली रखी गई है। 'अपने-अपने पतियों' वितरणात्मक बहुवचन को स्वाभाविक रूप देता है। पादटिप्पणी चिह्न सम्बद्ध शब्दों—'स्त्री' और 'सभा'—के साथ लगाए गए हैं।
