source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ἐπεὶ ζηλωταί ἐστε πνευμάτων, πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας ζητεῖτε ἵνα περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/012.yaml
  text: So also you[a], since you are eager for spiritual gifts, seek to abound for the building up of the church.
translation:
  language: hi
  text: इसी प्रकार तुम भी, क्योंकि तुम आत्मिक वरदानों[a] के लिए उत्सुक हो, कलीसिया की उन्नति के लिए बहुतायत में बढ़ने का प्रयत्न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक अर्थ “आत्माओं” है; प्रसंग में इसका अर्थ “आत्मिक बातें,” आत्मिक वरदान, या आत्मा की अभिव्यक्तियाँ हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: इसी प्रकार तुम भी
  rationale: पिछले पदों के तर्क और तुलना को स्वाभाविक हिन्दी में आगे बढ़ाता है।
- source_word: ἐπεὶ ζηλωταί ἐστε
  choice: क्योंकि तुम ... के लिए उत्सुक हो
  rationale: कारणसूचक ἐπεὶ और उत्साह दिखाने वाले ζηλωταί—दोनों का स्पष्ट, आधुनिक हिन्दी रूप।
- source_word: πνευμάτων
  choice: आत्मिक वरदानों
  rationale: अध्याय 12–14 के संदर्भ में यह आत्मा से जुड़ी सामर्थ्यपूर्ण अभिव्यक्तियों या वरदानों की ओर संकेत करता है; यूनानी की संक्षिप्त अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: πρὸς τὴν οἰκοδομὴν τῆς ἐκκλησίας
  choice: कलीसिया की उन्नति के लिए
  rationale: οἰκοδομή के समुदाय को मजबूत बनाने वाले आशय को सहज हिन्दी में व्यक्त करता है; 'उन्नति' धार्मिक हिन्दी में परिचित किंतु सामान्य पाठक के लिए भी बोधगम्य है।
- source_word: ζητεῖτε ἵνα περισσεύητε
  choice: उनमें बढ़ते जाने का प्रयत्न करो
  rationale: ζητεῖτε की सक्रिय खोज और περισσεύητε की प्रचुरता/वृद्धि को मुहावरेदार हिन्दी में रखता है। 'उनमें' संदर्भ से निहित वरदानों को स्पष्ट करता है, यद्यपि यूनानी में इसका पृथक सर्वनाम नहीं है।
theological_decisions:
- issue: πνευμάτων का अर्थ
  choice: मुख्य पाठ में 'आत्मिक वरदानों'
  alternative: '''आत्मिक बातों'' या ''आत्माओं'''
  rationale: तात्कालिक प्रसंग वरदानों और आत्मा की अभिव्यक्तियों पर केंद्रित है। फिर भी यूनानी बहुवचन अधिक संक्षिप्त और व्यापक है, इसलिए वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἵνα περισσεύητε का निहित संबंध
  choice: '''उनमें बढ़ते जाने'' को आत्मिक वरदानों से संबद्ध किया'
  alternative: बिना निहित कर्म के 'बहुतायत से बढ़ो'
  rationale: हिन्दी में वाक्य को स्वाभाविक बनाने और प्रसंगगत संबंध स्पष्ट करने के लिए 'उनमें' जोड़ा गया है; उद्देश्य फिर भी कलीसिया की उन्नति ही बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन 'तुम' है। 'कलीसिया' और 'आत्मिक वरदान' भारतीय हिन्दी बाइबिल परंपरा में परिचित हैं, जबकि पूरा वाक्य सामान्य पाठक के लिए सरल और गरिमापूर्ण रखा गया है।
