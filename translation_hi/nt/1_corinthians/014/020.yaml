  text: Ἀδελφοί, μὴ παιδία γίνεσθε ταῖς φρεσίν, ἀλλὰ τῇ κακίᾳ νηπιάζετε, ταῖς δὲ φρεσὶν τέλειοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/020.yaml
  text: Brothers[a], do not become children in your thinking, but be infants in evil[b]; yet in your thinking become mature.
translation:
  language: hi
  text: भाइयो[a], अपनी समझ में बच्चे न बनो, बल्कि बुराई में शिशु बनो[b]; पर अपनी समझ में परिपक्व बनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भाइयो और बहनो”; यूनानी में पुल्लिंग बहुवचन “भाइयो” पूरी कलीसिया को सम्बोधित करने के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या, “दुर्भावना में”; यूनानी शब्द का अर्थ बुराई, दुष्टता या दुर्भावना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: भाइयो
  rationale: सम्बोधन के रूप में प्रयुक्त यूनानी पुल्लिंग बहुवचन को मुख्य पाठ में बनाए रखा गया है; यहाँ यह पूरी कलीसिया को सम्बोधित करता है।
- source_word: παιδία
  choice: बच्चे
  rationale: यह सामान्य रूप से बच्चों को दर्शाता है और आगे आए ‘शिशु’ तथा ‘परिपक्व’ के विरोध को स्पष्ट रखता है।
- source_word: γίνεσθε
  choice: न बनो / बनो
  rationale: γίνομαι के ‘होने लगना/बनना’ भाव और दोनों प्रयोगों की समानांतर रचना को सुरक्षित रखता है।
- source_word: ταῖς φρεσίν / ταῖς δὲ φρεσὶν
  choice: अपनी समझ में
  rationale: φρήν यहाँ विचार और समझ की क्षमता को दर्शाता है; यह हिन्दी में स्वाभाविक ढंग से सम्बन्ध अथवा क्षेत्र का भाव व्यक्त करता है।
- source_word: τῇ κακίᾳ
  choice: बुराई में
  rationale: κακία के व्यापक नैतिक अर्थ को बनाए रखता है और इसे केवल व्यक्तिगत दुर्भावना तक सीमित नहीं करता।
- source_word: νηπιάζετε
  choice: शिशु बनो
  rationale: क्रिया का अर्थ शिशु होना या शिशु के समान होना है; ‘शिशु’ पहले खंड के ‘बच्चे’ से जानबूझकर किया गया भेद बनाए रखता है।
- source_word: τέλειοι
  choice: परिपक्व
  rationale: इस प्रसंग में τέλειος पूर्ण विकसित समझ को दर्शाता है, निष्पाप सिद्धता को नहीं।
- source_word: ἀλλὰ ... δὲ
  choice: बल्कि ... पर
  rationale: ये संयोजक बुराई और समझ के क्षेत्रों के बीच विरोध तथा तर्क की अगली करवट को स्वाभाविक हिन्दी में व्यक्त करते हैं।
theological_decisions:
- issue: कलीसिया के लिए लिंगसूचक सम्बोधन
  choice: मुख्य पाठ में ‘भाइयो’ रखा गया और उसके समावेशी सन्दर्भ को पादटिप्पणी में बताया गया।
  alternative: ‘भाइयो और बहनो’
  rationale: Ἀδελφοί व्याकरण की दृष्टि से पुल्लिंग बहुवचन है, यद्यपि इस सामूहिक सम्बोधन में कलीसिया की स्त्रियाँ भी सम्मिलित हैं; मुख्य पाठ और पादटिप्पणी मिलकर दोनों बातों को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक स्वर रखा गया है। ‘अपनी समझ में’ की पुनरावृत्ति मूल यूनानी की समानांतर रचना को बनाए रखती है; ‘बच्चे—शिशु—परिपक्व’ का क्रम पद के वाक्पटु विरोध को स्पष्ट करता है।
