id: 1CO.14.28
reference: 1 Corinthians 14:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ᾖ ⸀διερμηνευτής, σιγάτω ἐν ἐκκλησίᾳ, ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/028.yaml
  text: But if there is no interpreter[a], he must keep silent in the church and speak to himself and to God.
translation:
  language: hi
  text: परन्तु यदि अर्थ बताने वाला कोई न हो, तो वह कलीसिया[a] में चुप रहे और अपने आप से तथा परमेश्वर से बोले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सभा’ अथवा ‘मण्डली’।
    reason: ἐκκλησία के यहाँ एकत्रित समुदाय के अर्थ के लिए सम्भव हिन्दी विकल्प।
lexical_decisions:
- source_word: διερμηνευτής
  choice: अर्थ बताने वाला
  rationale: यह उस व्यक्ति को दर्शाता है जो अन्य भाषा में कही गई बात को सुनने वालों के लिए समझने योग्य बनाता है। ‘अर्थ बताने वाला’ आधुनिक हिन्दी में सहज है और केवल लिखित ‘अनुवादक’ का आभास नहीं देता।
- source_word: σιγάτω
  choice: चुप रहे
  rationale: तीसरे पुरुष का वर्तमान आज्ञार्थक रूप है। ‘चुप रहे’ निर्देश की शक्ति को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: ἐν ἐκκλησίᾳ
  choice: कलीसिया में
  rationale: सन्दर्भ एकत्रित मसीही समुदाय का है। ‘कलीसिया’ प्रचलित और सन्दर्भानुकूल है; मूल शब्द के सभा-संबंधी अर्थ को पादटिप्पणी में रखा गया है।
- source_word: ἑαυτῷ
  choice: अपने आप से
  rationale: निजवाचक सर्वनाम का सीधा अनुवाद है; इसमें ‘अकेले’ या ‘मन ही मन’ जोड़कर बोलने के ढंग को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: λαλείτω
  choice: बोले
  rationale: आज्ञार्थक निर्देश को तटस्थ और गरिमापूर्ण ढंग से व्यक्त करता है तथा सार्वजनिक कथन और स्वयं तथा परमेश्वर से बोलने के बीच मूल विरोध बनाए रखता है।
- source_word: τῷ θεῷ
  choice: परमेश्वर से
  rationale: ‘बोलना’ क्रिया के साथ दत्तिव का स्वाभाविक हिन्दी रूप है और वाणी के परमेश्वर की ओर निर्देशित होने को व्यक्त करता है।
- source_word: ἐὰν δὲ μὴ ᾖ
  choice: परन्तु यदि … कोई न हो
  rationale: शर्तसूचक उपवाक्य को स्वाभाविक हिन्दी में प्रस्तुत करता है और अर्थ बताने वाले की अनुपस्थिति को स्पष्ट रखता है।
theological_decisions:
- issue: एकत्रित कलीसिया में चुप रहने की आज्ञा का दायरा
  choice: जब अर्थ बताने वाला उपस्थित न हो, तब वक्ता सार्वजनिक रूप से न बोले, पर अपने आप से और परमेश्वर से बोल सकता है।
  alternative: वक्ता हर प्रकार से बोलना पूरी तरह बन्द कर दे; अथवा वह सभा को सुनाते हुए बोलता रह सकता है।
  rationale: ‘कलीसिया में चुप रहे’ के बाद ‘अपने आप से तथा परमेश्वर से बोले’ का विरोध सार्वजनिक संबोधन पर रोक दर्शाता है, न कि हर सम्भव वाणी पर पूर्ण निषेध। ‘अपने आप से’ को ‘मन ही मन’ नहीं बनाया गया, ताकि मूल में अनिर्दिष्ट श्रव्यता को जबरन निश्चित न किया जाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘परन्तु’ तर्कगत विरोध को बनाए रखता है; ‘अपने आप से’ मूल की अस्पष्टता को ‘मन ही मन’ जैसे विस्तार से सीमित नहीं करता।
