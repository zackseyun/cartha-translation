  yaml_path: translation/nt/1_corinthians/014/027.yaml
  text: If anyone speaks in a tongue[a], let there be two, or at most three, and each in turn, and let one interpret.
translation:
  language: hi
  text: यदि कोई किसी भाषा[a] में बोले, तो दो, या अधिक-से-अधिक तीन, एक-एक करके बोलें, और कोई एक उसका अर्थ बताए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘जीभ’ या ‘भाषा’ हो सकता है। इस अध्याय में यह उस वाणी के लिए प्रयुक्त स्थापित शब्द है जिसकी चर्चा पौलुस कर रहा है; पद स्वयं यह निश्चित नहीं करता कि वह मानवीय भाषा थी या किसी अन्य प्रकार की वाणी।
    reason: lexical_alternative
lexical_decisions:
- source_word: γλώσσῃ
  choice: अन्य भाषा में
  rationale: γλῶσσα का अर्थ ‘जीभ’ या ‘भाषा’ हो सकता है और 1 कुरिन्थियों 12–14 में यह आत्मिक वरदान से जुड़ी वाणी के लिए प्रयुक्त है। हिन्दी में केवल ‘जीभ में’ अस्वाभाविक और भ्रामक होगा; ‘अन्य भाषा में’ घटना को समझने योग्य ढंग से व्यक्त करता है, जबकि पादटिप्पणी उसकी प्रकृति के प्रश्न को खुला रखती है।
- source_word: τις
  choice: कोई
  rationale: अनिश्चित सर्वनाम का सामान्य, गैर-विशिष्ट भाव स्वाभाविक आधुनिक हिन्दी में सुरक्षित रहता है।
- source_word: λαλεῖ
  choice: बोले
  rationale: सामान्य शर्त वाले वाक्य में वर्तमान क्रिया को हिन्दी में संभाव्य/निर्देशात्मक ‘बोले’ से स्वाभाविक रूप मिलता है।
- source_word: κατὰ δύο ἢ τὸ πλεῖστον τρεῖς
  choice: दो या अधिक-से-अधिक तीन लोग बोलें
  rationale: यह पदबंध बोलने वालों की संख्या दो अथवा अधिकतम तीन तक सीमित करता है; ‘लोग’ जोड़ने से हिन्दी में आशय स्पष्ट होता है।
- source_word: ἀνὰ μέρος
  choice: वे बारी-बारी से बोलें
  rationale: पदबंध अलग-अलग, एक समय में एक व्यक्ति के बोलने का भाव देता है, न कि एक साथ बोलने का।
- source_word: εἷς
  choice: एक व्यक्ति
  rationale: संख्या यहाँ संज्ञा के रूप में प्रयुक्त है और अर्थ बताने वाले एक व्यक्ति को सूचित करती है।
- source_word: διερμηνευέτω
  choice: उसका अर्थ बताए
  rationale: क्रिया सभा के लिए वाणी को बोधगम्य बनाने का निर्देश देती है। ‘अर्थ बताए’ आधुनिक हिन्दी में स्वाभाविक है और ‘अनुवाद करे’ की अपेक्षा कम संकीर्ण है।
theological_decisions:
- issue: आत्मिक वरदानों के संदर्भ में γλώσσῃ का अर्थ
  choice: मुख्य पाठ में ‘अन्य भाषा’ रखा गया है, पर पादटिप्पणी में स्पष्ट किया गया है कि पद स्वयं यह तय नहीं करता कि यह कोई मानवीय भाषा है या किसी अन्य प्रकार की आत्मिक वाणी।
  alternative: ‘अनजानी भाषा’, ‘जीभ’, ‘भाषा’, या विशेष रूप से भावावेशपूर्ण अथवा विदेशी मानवीय भाषा कहना।
  rationale: तात्कालिक संदर्भ भाषा बोलने के वरदान से संबंधित है, लेकिन यह पद उस वाणी की सटीक प्रकृति पर व्यापक विवाद का समाधान नहीं करता। अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: διερμηνευέτω में व्याख्या अथवा अनुवाद का प्रश्न
  choice: ‘उसका अर्थ बताए’
  alternative: ‘अनुवाद करे’ या ‘व्याख्या करे’
  rationale: मूल क्रिया का केंद्रीय आशय सभा के लिए कथन को समझने योग्य बनाना है। हिन्दी चयन यह नहीं ठहराता कि प्रक्रिया केवल शब्दशः अनुवाद थी या व्यापक व्याख्या।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण निर्देशात्मक रूप अपनाया गया है। ‘बारी-बारी से’ सामूहिक आराधना में क्रम को स्पष्ट करता है और ‘अर्थ बताए’ साधारण पाठक के लिए तुरंत बोधगम्य है।
