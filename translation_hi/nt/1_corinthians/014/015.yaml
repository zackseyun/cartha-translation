source:
  edition: SBLGNT
  text: τί οὖν ἐστιν; προσεύξομαι τῷ πνεύματι, προσεύξομαι δὲ καὶ τῷ νοΐ· ψαλῶ τῷ πνεύματι, ψαλῶ δὲ καὶ τῷ νοΐ·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/015.yaml
  text: What then is to be done? I will pray with the spirit[a], but I will also pray with the mind; I will sing praise with the spirit[c][b], but I will also sing praise with the mind.
translation:
  language: hi
  text: तो फिर क्या किया जाए? मैं आत्मा से प्रार्थना करूँगा[a], पर बुद्धि से भी प्रार्थना करूँगा[b]; मैं आत्मा से स्तुति गाऊँगा[c], पर बुद्धि से भी स्तुति गाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आत्मा में’ अथवा ‘आत्मा के द्वारा।’ यूनानी पाठ स्पष्ट नहीं करता कि यहाँ ‘आत्मा’ से विशेष रूप से पवित्र आत्मा, बोलने वाले की मानवीय आत्मा या आत्मिक वाणी अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या ‘समझ के साथ।’
    reason: lexical_alternative
  - marker: c
    text: या ‘गाऊँगा’ अथवा ‘सुर लगाऊँगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: तो फिर क्या किया जाए?
  rationale: यह यूनानी प्रश्न पिछले विचार से निकलने वाले व्यावहारिक निष्कर्ष की ओर ले जाता है। शाब्दिक ‘तो फिर क्या है?’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: προσεύξομαι
  choice: मैं ... प्रार्थना करूँगा
  rationale: भविष्यकालीन क्रिया का सीधा और स्वाभाविक हिन्दी रूप; यूनानी मध्यम वाच्य के लिए अलग आत्मवाचक अभिव्यक्ति आवश्यक नहीं है।
- source_word: τῷ πνεύματι
  choice: आत्मा से
  rationale: करण/सहभागिता का भाव बनाए रखता है और ‘बुद्धि से’ के साथ समानांतर संरचना देता है, पर यह तय नहीं करता कि अभिप्राय पवित्र आत्मा, मनुष्य की आत्मा या आत्मिक वाणी से है।
- source_word: τῷ νοΐ
  choice: बुद्धि से
  rationale: νοῦς यहाँ समझने और सचेत विचार करने की क्षमता को सूचित करता है। ‘बुद्धि से’ इस अर्थ को स्पष्ट रखते हुए ‘आत्मा से’ के व्याकरणिक समानांतर को सुरक्षित रखता है।
- source_word: ψαλῶ
  choice: मैं ... स्तुति गाऊँगा
  rationale: इस आराधना-संदर्भ में क्रिया गाकर स्तुति करने को दर्शाती है। यह केवल ‘गाऊँगा’ से अधिक स्पष्ट है और ‘धुन बजाऊँगा’ जैसे अत्यधिक शाब्दिक रूप से बचती है।
- source_word: δὲ καὶ
  choice: पर ... भी
  rationale: यह जोड़ के साथ हल्का विरोध दर्शाता है—केवल एक रीति से नहीं, दूसरी रीति से भी। हिन्दी में ‘पर ... भी’ इस संतुलन को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: आत्मा और बुद्धि के विरोध में πνεῦμα का आशय
  choice: मुख्य पाठ में सामान्य रूप ‘आत्मा’ रखा गया है।
  alternative: ‘पवित्र आत्मा’ अथवा ‘मेरी आत्मा’
  rationale: यूनानी पाठ स्पष्ट रूप से यह निर्धारित नहीं करता कि पौलुस पवित्र आत्मा, वक्ता की मानवीय आत्मा या पवित्र आत्मा से प्रेरित मानवीय आत्मा की बात कर रहा है। इसलिए अनुवाद इस धर्मवैचारिक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य हिन्दी। दो समानांतर वाक्यांशों में ‘आत्मा से’ और ‘बुद्धि से’ की संरचना जानबूझकर दोहराई गई है, ताकि मूल का तर्क और लय बने रहें।
