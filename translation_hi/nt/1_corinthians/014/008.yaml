base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/008.yaml
  text: For if the trumpet gives an unclear sound[b][a], who will prepare for battle?
translation:
  language: hi
  text: क्योंकि यदि तुरही से अस्पष्ट ध्वनि निकले, तो युद्ध के लिए कौन तैयार होगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि
  rationale: यह संयोजन पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ उसका स्वाभाविक रूप है।
- source_word: ἐὰν
  choice: यदि
  rationale: यह संभाव्य शर्त प्रस्तुत करता है; ‘यदि’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: ἄδηλον
  choice: अस्पष्ट
  rationale: इसका अर्थ है जो साफ़ या पहचानने योग्य न हो; तुरही के संकेत के संदर्भ में ‘अस्पष्ट’ सटीक है।
- source_word: φωνὴν
  choice: ध्वनि
  rationale: यद्यपि φωνή का अर्थ ‘आवाज़’ भी हो सकता है, वाद्य के संदर्भ में ‘ध्वनि’ अधिक स्वाभाविक है।
- source_word: σάλπιγξ
  choice: तुरही
  rationale: यह युद्ध-संकेत देने वाले तुरही जैसे वाद्य को दर्शाता है; ‘तुरही’ सामान्य और पारंपरिक हिन्दी शब्द है।
- source_word: δῷ
  choice: से … निकले
  rationale: शाब्दिक अर्थ ‘दे’ है, पर हिन्दी में वाद्य और ध्वनि के साथ ‘तुरही से ध्वनि निकले’ स्वाभाविक है और मूल बिंब बनाए रखता है।
- source_word: τίς
  choice: कौन
  rationale: यह अलंकारिक प्रश्न आरम्भ करने वाला सीधा प्रश्नवाचक सर्वनाम है।
- source_word: παρασκευάσεται
  choice: तैयार होगा
  rationale: भविष्यत् मध्यम रूप स्वयं को तैयार करने का भाव रखता है; हिन्दी में ‘तैयार होगा’ यह अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰς πόλεμον
  choice: युद्ध के लिए
  rationale: यह यूनानी पदबंध का निकट और स्वाभाविक अनुवाद है तथा युद्ध-संकेत के व्यापक संदर्भ को बनाए रखता है।
