id: 1CO.14.38
reference: 1 Corinthians 14:38
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δέ τις ἀγνοεῖ, ⸀ἀγνοεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/038.yaml
  text: But if anyone does not recognize this[b][a], he is not recognized.
translation:
  language: hi
  text: लेकिन यदि कोई इसे नहीं पहचानता[b][a], तो उसे भी नहीं पहचाना जाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में पाठ है, “यदि कोई अनजान है, तो अनजान रहे।” अपनाए गए पाठ में है, “यदि कोई इसे नहीं पहचानता, तो उसे भी नहीं पहचाना जाता।”
    reason: textual_variant
  - marker: b
    text: या “नहीं मानता … नहीं माना जाता।” यूनानी में अलंकारिक प्रभाव के लिए एक ही क्रिया को पहले कर्तृवाच्य और फिर कर्मवाच्य रूप में प्रयोग किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: यदि
  rationale: यह सामान्य शर्त प्रस्तुत करने वाला अव्यय है; ‘यदि’ यूनानी वाक्य की शर्तात्मक प्रकृति को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: δέ
  choice: लेकिन
  rationale: यह पिछले कथन के विपरीत स्थिति की ओर मोड़ता है; आधुनिक हिन्दी में ‘लेकिन’ इस विरोध को सहज रूप से व्यक्त करता है।
- source_word: τις
  choice: कोई
  rationale: यह अनिश्चित एकवचन सर्वनाम है और सामान्य रूप से किसी भी व्यक्ति को सूचित करता है।
- source_word: ἀγνοεῖ
  choice: नहीं पहचानता
  rationale: पद 37 के संदर्भ में इसका अर्थ पौलुस की बात को प्रभु की आज्ञा के रूप में न पहचानना या स्वीकार न करना हो सकता है। ‘नहीं पहचानता’ इस अर्थ को रखता है और अनावश्यक रूप से जानबूझकर उपेक्षा का भाव निश्चित नहीं करता।
- source_word: ἀγνοεῖται
  choice: नहीं पहचाना जाता
  rationale: यह उसी क्रिया का कर्मवाच्य रूप है। यह अनुवाद मूल के सक्रिय-कर्मवाच्य शब्द-साम्य और इस अनिश्चितता को बनाए रखता है कि पहचान न देने वाला कौन है।
theological_decisions:
- issue: कर्मवाच्य ἀγνοεῖται का आशय और उसका निहित कर्ता
  choice: ‘उसे भी नहीं पहचाना जाता’—कर्मवाच्य कथन, जिसमें कर्ता अनिर्दिष्ट रहता है
  alternative: ‘परमेश्वर उसे स्वीकार नहीं करता’ अथवा ‘समुदाय उसकी बात नहीं मानता’
  rationale: मूल पाठ यह नहीं बताता कि न पहचानने वाला परमेश्वर है, कलीसिया है या दोनों के संदर्भ में बात कही गई है। इसलिए किसी एक कर्ता को जोड़ना मूल की वास्तविक अस्पष्टता और चेतावनी के तनाव को अनावश्यक रूप से सीमित कर देगा।
- issue: ἀγνοεῖ में अज्ञान बनाम अस्वीकार का भाव
  choice: ‘नहीं पहचानता’
  alternative: ‘अनजान है,’ ‘अनदेखा करता है,’ अथवा ‘नहीं मानता’
  rationale: निकटवर्ती संदर्भ में पहचानने/स्वीकार करने का भाव प्रमुख है, पर क्रिया में अज्ञान का अर्थ भी संभव है। चुना हुआ रूप संदर्भ से मेल खाता है और जानबूझकर विद्रोह का भाव आवश्यकता से अधिक नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘नहीं पहचानता … नहीं पहचाना जाता’ की पुनरावृत्ति जानबूझकर रखी गई है ताकि यूनानी मूल का शब्द-साम्य सुनाई दे। ‘इसे’ निकटवर्ती संदर्भ में पौलुस के निर्देश/कथन की ओर संकेत करता है।
