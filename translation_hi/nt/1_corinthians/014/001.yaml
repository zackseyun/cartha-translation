base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/001.yaml
  text: Pursue love[a], and earnestly desire the spiritual things[c][b], but especially that you may prophesy.
translation:
  language: hi
  text: प्रेम का अनुसरण करो और आत्मिक बातों की उत्कट अभिलाषा रखो[a], पर सबसे बढ़कर यह चाहो कि तुम भविष्यवाणी करो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आत्मिक वरदानों की उत्कट अभिलाषा रखो।” यूनानी अभिव्यक्ति का अर्थ अधिक व्यापक रूप से “आत्मिक बातें” या “आत्मा से संबंधित बातें” भी हो सकता है; इस संदर्भ में आत्मा द्वारा कलीसिया में दी गई अभिव्यक्तियाँ प्रमुख हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “बल्कि यह कि तुम भविष्यवाणी करो।”
    reason: alternative_reading
lexical_decisions:
- source_word: Διώκετε
  choice: पीछा करो
  rationale: यह चुनाव निरंतर और सक्रिय रूप से किसी लक्ष्य के पीछे लगे रहने की शक्ति को बनाए रखता है; यहाँ नैतिक संदर्भ में प्रेम को दृढ़ता से साधने का भाव है।
- source_word: τὴν ἀγάπην
  choice: प्रेम
  rationale: मानक, स्वाभाविक हिन्दी शब्द है और अध्याय 13 के साथ स्पष्ट संबंध बनाए रखता है।
- source_word: ζηλοῦτε
  choice: उत्कट अभिलाषा रखो
  rationale: क्रिया के उत्साहपूर्ण और तीव्र इच्छा वाले सकारात्मक आज्ञार्थक भाव को व्यक्त करता है।
- source_word: τὰ πνευματικά
  choice: आत्मिक बातें
  rationale: यूनानी नपुंसकलिंग बहुवचन विशेषण की व्यापकता को सुरक्षित रखता है; केवल ‘वरदान’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता, यद्यपि संदर्भ में आत्मा द्वारा दी गई अभिव्यक्तियाँ प्रमुख हैं।
- source_word: μᾶλλον δὲ
  choice: पर सबसे बढ़कर
  rationale: δὲ के हल्के विरोध/संक्रमण और μᾶλλον की तुलनात्मक प्राथमिकता—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἵνα προφητεύητε
  choice: यह कि तुम भविष्यवाणी करो
  rationale: ἵνα-वाक्यांश को इच्छा की विशेष विषयवस्तु के रूप में रखता है और मूल की अधीनस्थ रचना को पर्याप्त रूप से सुरक्षित करता है।
- source_word: προφητεύητε
  choice: भविष्यवाणी करो
  rationale: स्थापित बाइबलीय पद है; इसे व्याख्यात्मक विस्तार देकर किसी एक धार्मिक समझ तक सीमित नहीं किया गया।
theological_decisions:
- issue: τὰ πνευματικά का दायरा
  choice: आत्मिक बातें
  alternative: आत्मिक वरदान
  rationale: यूनानी अभिव्यक्ति ‘वरदानों’ से व्यापक है। अध्याय 12–14 का संदर्भ आत्मा-प्रदत्त वरदानों और सामुदायिक अभिव्यक्तियों की ओर संकेत करता है, पर मुख्य पाठ में व्यापकता बनाए रखना वास्तविक शाब्दिक अस्पष्टता को सुरक्षित रखता है।
- issue: भविष्यवाणी को दी गई प्राथमिकता
  choice: पर सबसे बढ़कर यह कि तुम भविष्यवाणी करो
  alternative: बल्कि यह कि तुम भविष्यवाणी करो
  rationale: यह अनुवाद अन्य आत्मिक बातों को नकारे बिना भविष्यवाणी को दी गई तुलनात्मक प्राथमिकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण आज्ञार्थक शैली। ‘आत्मिक बातें’ मूल की व्यापकता रखता है, जबकि पादटिप्पणी संदर्भगत ‘आत्मिक वरदान’ स्पष्ट करती है।
