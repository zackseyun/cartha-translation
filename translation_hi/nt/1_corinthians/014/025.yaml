reference: 1 Corinthians 14:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀τὰ κρυπτὰ τῆς καρδίας αὐτοῦ φανερὰ γίνεται, καὶ οὕτως πεσὼν ἐπὶ πρόσωπον προσκυνήσει τῷ θεῷ, ἀπαγγέλλων ὅτι ⸂Ὄντως ὁ θεὸς⸃ ἐν ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/025.yaml
  text: the secrets of his heart become evident[a], and so, falling on his face, he will worship God, declaring that God truly is among you.
translation:
  language: hi
  text: उसके हृदय की छिपी बातें प्रकट हो जाती हैं, और इस प्रकार वह मुँह के बल गिरकर परमेश्वर की आराधना करेगा और घोषणा करेगा, “निश्चय ही परमेश्वर तुम्हारे बीच[a] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “तुम्हारे भीतर।”'
    reason: ἐν ὑμῖν के संभव वैकल्पिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: τὰ κρυπτὰ
  choice: छिपी बातें
  rationale: संज्ञा के रूप में प्रयुक्त नपुंसकलिंग बहुवचन विशेषण व्यक्ति के भीतर छिपी बातों को दर्शाता है। ‘छिपी बातें’ स्वाभाविक है और ‘रहस्य’ की अपेक्षा संदर्भ में अधिक स्पष्ट है।
- source_word: τῆς καρδίας αὐτοῦ
  choice: उसके हृदय की
  rationale: ‘हृदय’ बाइबलीय मानव-विज्ञान की भाषा को बनाए रखता है और यहाँ भीतरी विचारों तथा अभिप्रायों के केंद्र को सूचित करता है।
- source_word: φανερὰ γίνεται
  choice: प्रकट हो जाती हैं
  rationale: यह वाक्यांश छिपी बातों के सामने आ जाने को व्यक्त करता है; ‘हो जाती हैं’ γίνεται के परिणामी/आरंभिक भाव को बनाए रखता है।
- source_word: καὶ οὕτως
  choice: और इस प्रकार
  rationale: यह हृदय की बातें प्रकट होने और उसके बाद की प्रतिक्रिया के बीच परिणामसूचक संबंध रखता है।
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: मुँह के बल गिरकर
  rationale: यह दंडवत होने की सजीव शारीरिक मुद्रा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: προσκυνήσει τῷ θεῷ
  choice: परमेश्वर की आराधना करेगा
  rationale: संदर्भ में क्रिया परमेश्वर के प्रति धार्मिक आराधना दर्शाती है; दंडवत होने का शारीरिक पक्ष पिछले वाक्यांश में पहले ही स्पष्ट है।
- source_word: ἀπαγγέλλων
  choice: घोषणा करेगा
  rationale: यह सहभागी क्रिया उसकी प्रतिक्रिया के साथ कही गई दृढ़ सार्वजनिक स्वीकारोक्ति को व्यक्त करती है।
- source_word: Ὄντως
  choice: निश्चय ही
  rationale: यह निष्कर्ष की सत्यता पर दिए गए जोर को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: सभा के तात्कालिक संदर्भ में यह एकत्रित विश्वासियों के मध्य परमेश्वर की उपस्थिति को दर्शाता है; ‘तुम्हारे भीतर’ भी व्याकरणतः संभव है और पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अंतिम स्वीकारोक्ति में ἐν ὑμῖν का अर्थ
  choice: तुम्हारे बीच
  alternative: तुम्हारे भीतर
  rationale: तात्कालिक संदर्भ एकत्रित कलीसिया और उसके बीच प्रकट परमेश्वर की उपस्थिति का है। फिर भी यूनानी पदबंध अंतर्वास का भाव भी दे सकता है, इसलिए वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। ‘हृदय’, ‘आराधना’ और ‘परमेश्वर’ जैसे परिचित बाइबलीय पद बनाए गए हैं; वाक्य की परिणामसूचक गति और मूल की संभावित अर्थगत अस्पष्टता सुरक्षित है।
