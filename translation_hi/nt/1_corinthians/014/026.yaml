  edition: SBLGNT
  text: Τί οὖν ἐστιν, ἀδελφοί; ὅταν συνέρχησθε, ⸀ἕκαστος ψαλμὸν ἔχει, διδαχὴν ἔχει, ⸂ἀποκάλυψιν ἔχει, γλῶσσαν⸃ ἔχει, ἑρμηνείαν ἔχει· πάντα πρὸς οἰκοδομὴν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/026.yaml
  text: What then is it[a], brothers? When you come together, each one has a psalm, has a teaching, has a revelation, has a tongue, has an interpretation[b]. Let all things be done for building up.
translation:
  language: hi
  text: तो फिर, भाइयो[a], क्या बात है? जब तुम इकट्ठे होते हो, तो हर एक के पास भजन होता है, शिक्षा होती है, प्रकाशन होता है, भाषा होती है, व्याख्या होती है। सब कुछ उन्नति के लिए हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भाइयो” पूरी मंडली को प्रतिनिधिक रूप से संबोधित करता है; इसमें स्त्रियाँ भी शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐστιν
  choice: तो फिर क्या बात है
  rationale: यूनानी के आलंकारिक प्रश्न को स्वाभाविक आधुनिक हिन्दी में रखते हुए यह आगे आने वाले व्यावहारिक निष्कर्ष का परिचय देता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: मूल के व्याकरणिक रूप को रखा गया है; प्रसंग में यह पूरी मिली-जुली मंडली को प्रतिनिधिक रूप से संबोधित करता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: ὅταν συνέρχησθε
  choice: जब तुम इकट्ठे होते हो
  rationale: सभा के बार-बार होने वाले अवसर का सहज हिन्दी रूप।
- source_word: ἕκαστος
  choice: हर एक
  rationale: मंडली के अलग-अलग सदस्यों के योगदान का वितरणात्मक भाव स्पष्ट करता है।
- source_word: ψαλμὸν
  choice: कोई भजन
  rationale: ‘गीत’ से अधिक विशिष्ट है और यूनानी संज्ञा के स्तुतिगान-संबंधी अर्थ को बनाए रखता है।
- source_word: διδαχὴν
  choice: कोई शिक्षा
  rationale: मंडली में दिए जाने वाले शिक्षाप्रद योगदान के लिए सहज और असांप्रदायिक शब्द।
- source_word: ἀποκάλυψιν
  choice: कोई प्रकाशन
  rationale: किसी बात के प्रकट किए जाने का मानक बाइबलीय रूप, बिना उसके स्वरूप को आवश्यकता से अधिक परिभाषित किए।
- source_word: γλῶσσαν
  choice: कोई अन्यभाषा
  rationale: इस अध्याय में चर्चित भाषिक आत्मिक अभिव्यक्ति को सूचित करता है, पर उसकी सटीक प्रकृति को निर्णायक रूप से तय नहीं करता; पादटिप्पणी मूल शब्द की व्यापकता बताती है।
- source_word: ἑρμηνείαν
  choice: उसका अर्थ बताने की क्षमता
  rationale: प्रसंग में अन्यभाषा को मंडली के लिए बोधगम्य बनाने का भाव स्पष्ट करता है। यूनानी सूची में संज्ञा है, पर हिन्दी में यह वाक्यांश अधिक सहज है।
- source_word: πάντα πρὸς οἰκοδομὴν γινέσθω
  choice: सब कुछ कलीसिया की उन्नति के लिए हो
  rationale: οἰκοδομή के निर्माण/दृढ़ीकरण रूपक को सुलभ ‘उन्नति’ से व्यक्त करता है और निर्देशात्मक γινέσθω को संक्षिप्त आज्ञार्थक रूप में रखता है।
theological_decisions:
- issue: मंडली को प्रतिनिधिक पुल्लिंग संबोधन
  choice: मुख्य पाठ में ‘भाइयो’ और समावेशी आशय की पादटिप्पणी
  alternative: ‘भाइयो और बहनो’
  rationale: यह मूल यूनानी के पुल्लिंग बहुवचन रूप को सुरक्षित रखता है और साथ ही स्पष्ट करता है कि संदर्भ में स्त्रियाँ भी संबोधित मंडली में शामिल हैं।
- issue: γλῶσσα का अर्थ
  choice: अन्यभाषा
  alternative: भाषा; जीभ
  rationale: ‘अन्यभाषा’ इस खंड के प्रचलित पारिभाषिक संदर्भ को हिन्दी में समझने योग्य बनाती है, जबकि पादटिप्पणी यह तनाव सुरक्षित रखती है कि यूनानी शब्द का सामान्य अर्थ ‘जीभ’ या ‘भाषा’ भी हो सकता है और घटना की सटीक प्रकृति यहाँ तय नहीं की गई है।
- issue: οἰκοδομή का लक्ष्य
  choice: कलीसिया की उन्नति
  alternative: निर्माण; आत्मिक दृढ़ता
  rationale: संदर्भ सामुदायिक सभा का है; स्पष्ट संज्ञा जोड़ना हिन्दी में लक्ष्य को सहज बनाता है, बिना उन्नति को केवल व्यक्तिगत लाभ मानने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधना के संदर्भ में सहज रखी गई है। सूची की पुनरावृत्ति को पठनीय हिन्दी में ‘कोई’ के साथ बनाए रखा गया है; अंतिम वाक्य में ‘कलीसिया’ जोड़कर निहित सामुदायिक संदर्भ स्पष्ट किया गया है।
