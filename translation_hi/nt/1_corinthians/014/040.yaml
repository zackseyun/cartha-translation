  text: πάντα ⸀δὲ εὐσχημόνως καὶ κατὰ τάξιν γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/040.yaml
  text: But let everything be done decently and in order[a].
translation:
  language: hi
  text: पर सब कुछ उचित ढंग से और क्रम के अनुसार किया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का व्यापक अर्थ है; ‘सब कुछ’ स्वाभाविक हिन्दी में निर्देश की समग्रता बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले विवेचन से हल्का विरोध या सार-संक्षेप की ओर संक्रमण दिखाता है; ‘पर’ इस प्रवचनात्मक मोड़ को संक्षेप में व्यक्त करता है।
- source_word: εὐσχημόνως
  choice: उचित ढंग से
  rationale: यह उस आचरण को दर्शाता है जो अवसर के अनुरूप, शोभनीय और मर्यादित हो; ‘उचित ढंग से’ आधुनिक हिन्दी में स्पष्ट है और किसी संकीर्ण रीति को नहीं थोपता।
- source_word: κατὰ τάξιν
  choice: क्रम के अनुसार
  rationale: यह उचित व्यवस्था या अनुक्रम के अनुरूप होने का भाव देता है; ‘क्रम के अनुसार’ मूल पूर्वसर्गीय रचना और व्यवस्थित प्रक्रिया दोनों को सुरक्षित रखता है।
- source_word: γινέσθω
  choice: किया जाए
  rationale: तीसरे पुरुष का आज्ञार्थक रूप यहाँ सामान्य निर्देश देता है; ‘किया जाए’ हिन्दी में उस निर्देशात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: आराधना-सभा के संदर्भ में पौलुस की आज्ञा का दायरा
  choice: सभा में सब कुछ उचित और व्यवस्थित रूप से करने का सामान्य निर्देश, किसी विशिष्ट सांप्रदायिक उपासना-पद्धति को निर्धारित किए बिना।
  alternative: इसे सेवा की एक निश्चित औपचारिक विधि का संकीर्ण नियम मानना, या तत्काल संदर्भ से परे कलीसिया के हर व्यवहार पर लागू व्यापक सिद्धांत मानना।
  rationale: यह पद सभा में बोलने और व्यवस्था संबंधी निकटवर्ती चर्चा का सार प्रस्तुत करता है। अनुवाद यूनानी की व्यापकता बनाए रखता है, पर पाठ में न कही गई किसी विशेष कलीसियाई संरचना को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘उचित ढंग से’ εὐσχημόνως के शोभनीय/अनुरूप होने के भाव को स्पष्ट करता है, जबकि ‘क्रम के अनुसार’ τάξις की व्यवस्था और अनुक्रम दोनों को बनाए रखता है।
