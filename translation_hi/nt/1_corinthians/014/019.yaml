  text: ἀλλὰ ἐν ἐκκλησίᾳ θέλω πέντε λόγους ⸂τῷ νοΐ⸃ μου λαλῆσαι, ἵνα καὶ ἄλλους κατηχήσω, ἢ μυρίους λόγους ἐν γλώσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/019.yaml
  text: But in the church I would rather speak five words with my mind[a], so that I may also instruct others, than ten thousand words in a tongue.
translation:
  language: hi
  text: परन्तु कलीसिया की सभा में मैं अपनी समझ-बूझ के साथ पाँच शब्द बोलना अधिक चाहूँगा, ताकि दूसरों को भी शिक्षा दूँ, बजाय भाषा[a] में दस हज़ार शब्द बोलने के।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ “जीभ” या “भाषा” हो सकता है। यहाँ यह 1 कुरिन्थियों 12–14 में चर्चित उस प्रकार की वाणी को दर्शाता है; उसका ठीक स्वरूप इस अनुवाद में निर्धारित नहीं किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἐκκλησίᾳ
  choice: कलीसिया की सभा में
  rationale: यहाँ शब्द का आशय आराधना के लिए एकत्र मसीही समुदाय से है। यह प्रयोग संस्था या भवन के बजाय सभा के प्रसंग को स्पष्ट करता है।
- source_word: θέλω ... ἢ
  choice: अधिक चाहूँगा ... बजाय इसके कि
  rationale: क्रिया मूलतः इच्छा व्यक्त करती है, पर ‘दस हज़ार’ के साथ तुलना में स्पष्ट वरीयता का भाव है।
- source_word: πέντε λόγους
  choice: पाँच शब्द
  rationale: संख्यात्मक विरोध और पौलुस की प्रभावशाली तुलना को सीधे बनाए रखता है।
- source_word: τῷ νοΐ μου
  choice: अपनी समझ से
  rationale: νοῦς के मानसिक बोध और समझ में आने वाले भाषण के भाव को सहज हिन्दी में व्यक्त करता है; ‘अपने मन से’ इच्छा या भावनात्मक मन का भ्रम दे सकता है।
- source_word: κατηχήσω
  choice: शिक्षा दूँ
  rationale: मौखिक रूप से समझाने-सिखाने का आशय देता है और बाद के तकनीकी ‘धर्मशिक्षा’ संबंधी अर्थ को आरोपित नहीं करता।
- source_word: μυρίους λόγους
  choice: दस हज़ार शब्द
  rationale: मूल की निश्चित, किंतु अतिशयोक्तिपूर्ण संख्या को बनाए रखकर ‘पाँच’ के साथ तीखा विरोध सुरक्षित रखता है।
- source_word: ἐν γλώσσῃ
  choice: अन्य भाषा में
  rationale: γλῶσσα का अर्थ जीभ या भाषा हो सकता है। हिन्दी में केवल ‘जीभ में’ अस्वाभाविक है; ‘अन्य भाषा’ इस अध्याय में समझ से परे भाषण का सहज संकेत देती है, जबकि पादटिप्पणी विवादित स्वरूप को खुला रखती है।
theological_decisions:
- issue: 1 कुरिन्थियों 12–14 में γλῶσσα का स्वरूप
  choice: मुख्य पाठ में ‘अन्य भाषा’ और पादटिप्पणी में ‘अन्यभाषा/जीभ से बोली जाने वाली वाणी’ की संभावना का उल्लेख
  alternative: ‘एक जीभ में’ या केवल ‘अन्यभाषा में’
  rationale: हिन्दी में स्वाभाविकता रखते हुए यह नहीं तय किया गया कि घटना सामान्य विदेशी भाषा थी या किसी प्रकार की करिश्माई वाणी। इस प्रकार मूल पाठ की शब्दार्थगत और धर्मवैचारिक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य हिन्दी। ‘कलीसिया की सभा’ से एकत्र समुदाय स्पष्ट होता है; ‘अपनी समझ से’ सामान्य पाठक के लिए बोधगम्य है।
