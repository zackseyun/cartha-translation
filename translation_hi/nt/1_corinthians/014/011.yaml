  text: ἐὰν οὖν μὴ εἰδῶ τὴν δύναμιν τῆς φωνῆς, ἔσομαι τῷ λαλοῦντι βάρβαρος καὶ ὁ λαλῶν ἐν ἐμοὶ βάρβαρος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/011.yaml
  text: Therefore[a], if I do not know the meaning of the voice, I will be a foreigner to the one speaking[b], and the one speaking will be a foreigner to me.
translation:
  language: hi
  text: इसलिए, यदि मैं आवाज़ का अर्थ[a] न जानूँ, तो बोलनेवाले के लिए मैं परदेशी[b] ठहरूँगा, और बोलनेवाला मेरे लिए परदेशी ठहरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आवाज़ का सामर्थ्य”; अर्थात् आवाज़ से व्यक्त होनेवाला आशय या भाव।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का अर्थ यहाँ ऐसा व्यक्ति है जिसकी बोली परायी या समझ से बाहर हो; इसका अर्थ आवश्यक रूप से “असभ्य” नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: इसलिए, यदि
  rationale: οὖν के निष्कर्षसूचक संबंध और ἐὰν की शर्त—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: μὴ εἰδῶ
  choice: मैं ... न जानूँ
  rationale: οἶδα के मूल अर्थ ‘जानना’ को सुरक्षित रखता है; इस प्रसंग में अर्थ न समझ पाने का भाव स्वतः स्पष्ट है।
- source_word: τὴν δύναμιν τῆς φωνῆς
  choice: आवाज़ का अर्थ
  rationale: δύναμις का मूल भाव ‘सामर्थ्य/प्रभाव’ है, पर इस प्रयोग में वह आवाज़ द्वारा व्यक्त आशय या अर्थ को सूचित करता है; φωνή के लिए ‘आवाज़’ निकट और स्वाभाविक है।
- source_word: τῷ λαλοῦντι
  choice: बोलनेवाले के लिए
  rationale: समकालीन कृदंत और संबंधसूचक सम्प्रदान—दोनों को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βάρβαρος
  choice: परदेशी
  rationale: यहाँ शब्द मुख्यतः भाषायी अपरिचय और पारस्परिक अबोधगम्यता दर्शाता है, असभ्यता नहीं।
- source_word: ἐν ἐμοὶ
  choice: मेरे लिए
  rationale: इस पारस्परिक वाक्य-विन्यास में ἐν ἐμοί का संबंधपरक आशय स्वाभाविक हिन्दी में व्यक्त करता है।
