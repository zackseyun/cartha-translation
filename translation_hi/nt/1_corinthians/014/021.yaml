reference: 1 Corinthians 14:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐν τῷ νόμῳ γέγραπται ὅτι Ἐν ἑτερογλώσσοις καὶ ἐν χείλεσιν ⸀ἑτέρων λαλήσω τῷ λαῷ τούτῳ, καὶ οὐδ’ οὕτως εἰσακούσονταί μου, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/021.yaml
  text: 'In the Law it is written: “By people of other tongues and by the lips of foreigners I will speak to this people[d][c][b][a], and not even in this way will they listen to me,” says the Lord.'
translation:
  language: hi
  text: 'व्यवस्था में लिखा है: “अन्य भाषाएँ बोलनेवालों के द्वारा और परदेशियों के होंठों से मैं इस प्रजा से बोलूँगा,[a] और इस प्रकार भी वे मेरी बात नहीं सुनेंगे,[b]” प्रभु कहता है।[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “अन्य भाषाओं से और दूसरों के होंठों से।”
    reason: lexical_alternative
  - marker: b
    text: अथवा, “वे मेरी बात नहीं मानेंगे।”
    reason: lexical_alternative
  - marker: c
    text: यह उद्धरण यशायाह 28:11–12 की प्रतिध्वनि है।
    reason: cross_reference
  - marker: d
    text: यहाँ इस्राएल का परमेश्वर बोल रहा है; उद्धरण की इब्रानी पृष्ठभूमि को दर्शाने के लिए कुछ अनुवाद “यहोवा कहता है” लिखते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ νόμῳ
  choice: व्यवस्था में
  rationale: यहाँ νόμος व्यापक रूप से यहूदी पवित्रशास्त्र को सूचित करता है, यद्यपि उद्धरण यशायाह से है। “व्यवस्था” पौलुस की पारंपरिक अभिव्यक्ति को बनाए रखता है।
- source_word: γέγραπται
  choice: लिखा है
  rationale: पवित्रशास्त्र का उद्धरण प्रस्तुत करनेवाले यूनानी पूर्णकालीन कर्मवाच्य सूत्र का स्वाभाविक हिन्दी रूप।
- source_word: ἑτερογλώσσοις
  choice: अन्य भाषाएँ बोलनेवालों के द्वारा
  rationale: शब्द का अर्थ दूसरी या भिन्न भाषा से संबंधित है। व्यक्तियों का उल्लेख स्पष्ट करने से हिन्दी वाक्य स्वाभाविक बनता है और अध्याय में भाषाओं के विषय से संबंध बना रहता है।
- source_word: χείλεσιν ἑτέρων
  choice: परदेशियों के होंठों से
  rationale: “होंठों” का मूल रूपक सुरक्षित रखा गया है; प्रसंग में ἑτέρων दूसरी भाषा या जाति के लोगों की ओर संकेत करता है, इसलिए “परदेशियों” से आशय स्पष्ट होता है।
- source_word: λαλήσω
  choice: मैं ... बोलूँगा
  rationale: सरल भविष्यकाल और ईश्वरीय वाणी के लिए स्वाभाविक, निकट औपचारिक समतुल्य।
- source_word: τῷ λαῷ τούτῳ
  choice: इस प्रजा से
  rationale: λαός के वाचा-सम्बन्धी सामूहिक अर्थ के लिए “प्रजा” उपयुक्त है; सम्बन्धकारक क्रिया के साथ हिन्दी में “से” स्वाभाविक है।
- source_word: οὐδ’ οὕτως
  choice: और इस प्रकार भी ... नहीं
  rationale: 'οὐδέ और οὕτως के बल को सुरक्षित रखता है: इस असाधारण उपाय से भी लोग नहीं सुनेंगे।'
- source_word: εἰσακούσονταί μου
  choice: वे मेरी बात नहीं सुनेंगे
  rationale: εἰσακούω में ध्यान से सुनने और मानने दोनों की छाया हो सकती है। मुख्य पाठ में सहज “बात नहीं सुनेंगे” रखा गया और आज्ञापालन की छाया पादटिप्पणी में दी गई है।
- source_word: λέγει κύριος
  choice: प्रभु कहता है
  rationale: यूनानी κύριος का सीधा और सामान्य हिन्दी रूप “प्रभु” है; वर्तमानकालीन उद्धरण-सूत्र भी सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय वाणी वाले पवित्रशास्त्रीय उद्धरण में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी पाठ में κύριος है, इसलिए मुख्य पाठ में “प्रभु” रखा गया है। उद्धरण की इब्रानी पृष्ठभूमि में परमेश्वर का विशिष्ट नाम है; यह विकल्प पादटिप्पणी में बताया गया है, मुख्य पाठ में थोपा नहीं गया।
- issue: εἰσακούω में सुनने और मानने का संबंध
  choice: मेरी बात नहीं सुनेंगे
  alternative: मेरी बात नहीं मानेंगे
  rationale: मुख्य पाठ श्रवण-सम्बन्धी मूल अर्थ और प्रसंग की भाषायी शब्दावली को बनाए रखता है; “मानना” निहित आज्ञाकारिता को अधिक स्पष्ट करता है और इसलिए विकल्प के रूप में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। “अन्य भाषाएँ बोलनेवालों” से सामान्य पाठक के लिए अर्थ स्पष्ट होता है, जबकि “होंठों” का शास्त्रीय रूपक और “व्यवस्था में लिखा है” का उद्धरण-सूत्र सुरक्षित रखा गया है।
