  yaml_path: translation/nt/1_corinthians/014/003.yaml
  text: But the one who prophesies speaks to people for edification and encouragement and consolation[a][b][c].
translation:
  language: hi
  text: परन्तु जो भविष्यवाणी करता है, वह लोगों से उन्नति, प्रोत्साहन और सांत्वना की बातें करता है।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्माण की बातें”; यहाँ οἰκοδομή का भाव लोगों को सुदृढ़ करने का है।
    reason: lexical_alternative
  - marker: b
    text: “प्रोत्साहन” παράκλησις का अनुवाद है; इसका अर्थ “आग्रह” या कुछ संदर्भों में “सांत्वना” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “सांत्वना” παραμυθία का अनुवाद है; इसका वैकल्पिक अनुवाद “दिलासा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ προφητεύων
  choice: परन्तु जो भविष्यवाणी करता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त किसी ऐसे व्यक्ति को दर्शाता है जो यह कार्य करता है। δέ पिछले पद से हल्का विरोध दिखाता है, इसलिए ‘परन्तु’ रखा गया है।
- source_word: ἀνθρώποις
  choice: लोगों से
  rationale: बहुवचन सम्प्रदान कारक वाणी के श्रोताओं को बताता है। यहाँ अर्थ सभी मनुष्यों के लिए सामान्य है, पुरुषों तक सीमित नहीं। हिंदी में ‘लोगों से बोलता है’ स्वाभाविक है।
- source_word: λαλεῖ
  choice: बोलता है
  rationale: यह λαλέω के वर्तमान काल का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: οἰκοδομὴν
  choice: उनकी उन्नति के लिए
  rationale: यहाँ भवन-निर्माण का रूपक आत्मिक या सामुदायिक उन्नति के अर्थ में है। ‘उन्नति’ आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है; ‘उनकी’ जोड़ने से लोगों पर होने वाला प्रभाव स्पष्ट होता है।
- source_word: παράκλησιν
  choice: प्रोत्साहन
  rationale: παράκλησις में प्रोत्साहन, आग्रह या सांत्वना के अर्थ हो सकते हैं। अगले पद παραμυθία से भेद बनाए रखने के लिए ‘प्रोत्साहन’ उपयुक्त है।
- source_word: παραμυθίαν
  choice: सांत्वना
  rationale: यह शब्द ढाढ़स, दिलासा या सांत्वना देने वाली वाणी को दर्शाता है। ‘सांत्वना’ παράκλησις से इसका सूक्ष्म भेद बनाए रखता है।
theological_decisions:
- issue: सभा के संदर्भ में ‘भविष्यवाणी करता है’ का अर्थ
  choice: ‘भविष्यवाणी करता है’ को बिना संकुचित परिभाषा के बनाए रखा गया है।
  alternative: ‘प्रचार करता है’ या ‘प्रकाशना सुनाता है’
  rationale: मूल पद भविष्यवाणी को उसके प्रभावों द्वारा वर्णित करता है, पर यहाँ उसे केवल उपदेश या भविष्य बताने तक सीमित नहीं करता। व्यापकता और धर्मवैज्ञानिक तनाव को बनाए रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण और सर्वसाधारण के लिए बोधगम्य शैली। ‘भविष्यवाणी’ पारंपरिक बाइबलीय शब्दावली को बनाए रखती है, जबकि ‘उन्नति, प्रोत्साहन और सांत्वना’ तीनों यूनानी संज्ञाओं का भेद स्पष्ट करती है।
