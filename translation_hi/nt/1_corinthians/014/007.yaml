  yaml_path: translation/nt/1_corinthians/014/007.yaml
  text: Even lifeless things that produce sound—whether flute or harp—if they do not give a distinction in the notes[a], how will what is played on the flute or on the harp be recognized?
translation:
  language: hi
  text: निर्जीव वस्तुएँ भी—चाहे बाँसुरी हो या वीणा[a]—ध्वनि निकालती हैं। यदि उनके स्वरों में स्पष्ट भेद न हो, तो कैसे पहचाना जाएगा कि बाँसुरी या वीणा पर क्या बजाया जा रहा है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में αὐλός प्रायः नलीनुमा फूँक-वाद्य और κιθάρα ‘लायर’ जैसा प्राचीन तार-वाद्य था। यहाँ सहजता के लिए ‘बाँसुरी’ और ‘वीणा’ कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως
  choice: भी
  rationale: यहाँ यह शब्द पिछले कथन से वाद्य-यंत्रों के उदाहरण की ओर बलपूर्वक बढ़ता है। ‘भी’ निर्जीव वस्तुओं को उदाहरण में सम्मिलित करने का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τὰ ἄψυχα
  choice: निर्जीव वस्तुएँ
  rationale: यह बहुवचन उन वस्तुओं को दर्शाता है जिनमें जीवन नहीं है; संदर्भ में ये वाद्य-यंत्र हैं।
- source_word: φωνὴν διδόντα
  choice: ध्वनि निकालती हैं
  rationale: शाब्दिक अर्थ ‘ध्वनि देती हैं’ है; ‘ध्वनि निकालती हैं’ आधुनिक हिंदी में वाद्य-यंत्रों के लिए अधिक स्वाभाविक है।
- source_word: εἴτε αὐλὸς εἴτε κιθάρα
  choice: चाहे बाँसुरी हो या वीणा
  rationale: αὐλός एक प्राचीन फूँककर बजाया जाने वाला वाद्य था और κιθάρα एक प्राचीन तार-वाद्य। ‘बाँसुरी’ और ‘वीणा’ सामान्य पाठक के लिए इनके विपरीत वाद्य-वर्गों को स्पष्ट रखते हैं; ऐतिहासिक विशिष्टता पाद-टिप्पणी में दी गई है।
- source_word: ἐὰν διαστολὴν τοῖς φθόγγοις μὴ δῷ
  choice: यदि उनके स्वरों में स्पष्ट भेद न हो
  rationale: διαστολή अलगाव या भेद को और φθόγγοι संगीतिक ध्वनियों अथवा स्वरों को दर्शाता है। यह अनुवाद अलग-अलग पहचाने जा सकने वाले स्वरों की आवश्यकता को सहज हिंदी में व्यक्त करता है।
- source_word: πῶς γνωσθήσεται
  choice: तो कैसे पहचाना जाएगा
  rationale: भविष्यत् कर्मवाच्य यहाँ बजाई गई धुन या रचना के पहचाने जाने का भाव देता है।
- source_word: τὸ αὐλούμενον ἢ τὸ κιθαριζόμενον
  choice: कि बाँसुरी या वीणा पर क्या बजाया जा रहा है
  rationale: दोनों संज्ञीकृत कर्मवाच्य कृदंत उन चीज़ों को दर्शाते हैं जो संबंधित वाद्यों पर बजाई जा रही हैं। हिंदी में यह अभिव्यक्ति अर्थ को स्पष्ट रखते हुए कर्मवाच्य भाव सुरक्षित रखती है।
