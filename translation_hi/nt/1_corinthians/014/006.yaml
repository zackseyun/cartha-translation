source:
  edition: SBLGNT
  text: ⸀Νῦν δέ, ἀδελφοί, ἐὰν ἔλθω πρὸς ὑμᾶς γλώσσαις λαλῶν, τί ὑμᾶς ὠφελήσω, ἐὰν μὴ ὑμῖν λαλήσω ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/006.yaml
  text: Now[a], brothers, if I come to you speaking in tongues[b], what will I benefit you unless I speak to you either by revelation or by knowledge or by prophecy or by teaching?
translation:
  language: hi
  text: अब हे भाइयो[a], यदि मैं तुम्हारे पास भाषाएँ[b] बोलता हुआ आऊँ, तो मैं तुम्हें क्या लाभ पहुँचाऊँगा, जब तक कि मैं तुमसे प्रकाशन, ज्ञान, भविष्यवाणी या शिक्षा के द्वारा न बोलूँ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हे भाई-बहनो’; यूनानी में ‘भाई’ शब्द मिली-जुली कलीसिया को भी संबोधित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भाषाओं में बोलता हुआ’; यहाँ यूनानी शब्द 1 कुरिन्थियों 12–14 में चर्चित आत्मिक वाणी की घटना को दर्शाता है। इसे ‘अन्यभाषाएँ’ भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν δέ
  choice: अब
  rationale: यह पौलुस के तर्क में वर्तमान बिंदु की ओर संक्रमण दिखाता है; हिंदी में ‘अब’ स्वाभाविक है और अनावश्यक रूप से प्रबल विरोध नहीं जोड़ता।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन है और संबोधन में है; पौलुस के प्रयोग में यह प्रायः पूरी मिली-जुली कलीसिया को संबोधित करता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: γλώσσαις λαλῶν
  choice: अन्य भाषाएँ बोलता हुआ
  rationale: γλῶσσα का अर्थ ‘भाषा’ या ‘जीभ’ हो सकता है। यहाँ यह 1 कुरिन्थियों 12–14 में चर्चित आत्मिक वाणी की घटना को सूचित करता है; ‘अन्य भाषाएँ’ हिंदी में अर्थपूर्ण रहते हुए उसकी प्रकृति पर विवाद का निर्णय नहीं करता।
- source_word: τί ὑμᾶς ὠφελήσω
  choice: मैं तुम्हें क्या लाभ पहुँचाऊँगा
  rationale: ὠφελέω का अर्थ लाभ पहुँचाना या सहायता करना है। यह हिंदी प्रयोग स्वाभाविक है और श्रोताओं के व्यावहारिक लाभ पर बल बनाए रखता है।
- source_word: ἐὰν μὴ
  choice: जब तक कि … न
  rationale: इस प्रश्नात्मक वाक्य में यह हिंदी की स्वाभाविक अपवादात्मक शर्त है और ‘unless’ का आशय ठीक व्यक्त करती है।
- source_word: λαλήσω
  choice: मैं तुमसे … बोलूँ
  rationale: यह पहले आए λαλῶν के साथ शाब्दिक निरंतरता रखता है और संप्रेषण के संदर्भ के अनुकूल है।
- source_word: ἐν ἀποκαλύψει
  choice: प्रकाशन … के द्वारा
  rationale: यहाँ ἐν साधन या रीति को व्यक्त करता है; ‘के द्वारा’ लाभदायक वाणी के माध्यम को स्पष्ट करता है।
- source_word: ἐν γνώσει
  choice: ज्ञान … के द्वारा
  rationale: सूची के समानांतर साधनात्मक भाव को बनाए रखता है।
- source_word: ἐν προφητείᾳ
  choice: भविष्यवाणी … के द्वारा
  rationale: προφητεία के अर्थ और चारों श्रेणियों की समानांतर संरचना को सुरक्षित रखता है।
- source_word: ἐν διδαχῇ
  choice: शिक्षा के द्वारा
  rationale: διδαχή यहाँ शिक्षा या उपदेश को दर्शाता है; ‘शिक्षा’ आधुनिक हिंदी में सहज और व्यापक है।
theological_decisions:
- issue: कलीसियाई संबोधन में ἀδελφοί का अनुवाद
  choice: हे भाइयो
  alternative: हे भाई-बहनो
  rationale: मुख्य पाठ यूनानी के व्याकरणिक पुल्लिंग रूप को रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि संबोधन में मिली-जुली कलीसिया सम्मिलित हो सकती है।
- issue: इस अध्याय में γλώσσαις का अर्थ
  choice: अन्य भाषाएँ
  alternative: अन्यभाषाएँ / जीभें
  rationale: यह चयन यूनानी शब्द के भाषागत अर्थ को व्यक्त करता है और संदर्भ में चर्चित आत्मिक वाणी की घटना को पहचानता है, पर उसकी ठीक प्रकृति के विषय में किसी संप्रदायगत निष्कर्ष को आरोपित नहीं करता।
- issue: चार ἐν-वाक्यांशों का संबंध
  choice: ‘के द्वारा’ से साधनात्मक रूप
  alternative: ‘में’ से अधिक शाब्दिक रूप
  rationale: संदर्भ पूछता है कि पौलुस किस प्रकार बोलकर श्रोताओं को लाभ पहुँचाएगा; इसलिए साधनात्मक/रीतिवाचक अर्थ हिंदी में अधिक स्पष्ट है, यद्यपि यूनानी ἐν कुछ औपचारिक अस्पष्टता रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज संबोधन रखा गया है। ‘तुम्हारे/तुम्हें/तुमसे’ बहुवचन सामुदायिक संबोधन है, असम्मानसूचक एकवचन नहीं। सूची में एक ही ‘के द्वारा’ को अंत में रखकर स्वाभाविक हिंदी और यूनानी की समानांतरता दोनों बनाए गए हैं।
