lexical_decisions:
- source_word: Διὸ
  choice: इसलिए
  rationale: यह संयोजक पिछले विचार से निष्कर्ष निकालता है; ‘इसलिए’ आधुनिक हिन्दी में उसके तार्किक बल को स्वाभाविक रूप से रखता है।
- source_word: ὁ λαλῶν
  choice: जो व्यक्ति ... बोलता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत किसी भी ऐसे व्यक्ति को सूचित करता है; यह अनावश्यक रूप से पुरुष तक सीमित किए बिना एकवचन और क्रिया का भाव बनाए रखता है।
- source_word: γλώσσῃ
  choice: अन्य भाषा में
  rationale: यहाँ एकवचन दत्तिव रूप है और अध्याय में ऐसी वाणी को सूचित करता है जिसे सभा में समझने के लिए अर्थ बताने की आवश्यकता है। ‘अन्य भाषा’ स्वाभाविक हिन्दी है, जबकि पादटिप्पणी शाब्दिक ‘जीभ’ और संदर्भगत अस्पष्टता सुरक्षित रखती है।
- source_word: προσευχέσθω
  choice: वह प्रार्थना करे
  rationale: तीसरे पुरुष का वर्तमान आज्ञार्थक रूप है; ‘प्रार्थना करे’ हिन्दी में स्पष्ट और गरिमापूर्ण उपदेशात्मक बल देता है।
- source_word: ἵνα
  choice: कि
  rationale: यह प्रार्थना के उद्देश्य अथवा विषय को प्रस्तुत करता है; ‘कि’ दोनों संभावनाओं को स्वाभाविक रूप से खुला रखता है।
- source_word: διερμηνεύῃ
  choice: उसका अर्थ भी बता सके
  rationale: क्रिया का आशय वाणी को दूसरों के लिए बोधगम्य बनाना है। ‘अर्थ बता सके’ आधुनिक हिन्दी में ‘व्याख्या’ की अपेक्षा अधिक सहज है और ‘अनुवाद’ की अपेक्षा कम संकीर्ण।
theological_decisions:
- issue: ὁ λαλῶν और διερμηνεύῃ के व्याकरणिक पुल्लिंग एकवचन का प्रतिनिधिक प्रयोग
  choice: जो व्यक्ति ... वह ... सके
  alternative: जो पुरुष ... वह ... सके
  rationale: यूनानी पुल्लिंग एकवचन यहाँ किसी भी बोलने वाले व्यक्ति का प्रतिनिधित्व करता है, केवल पुरुषों को सीमित नहीं करता। हिन्दी में ‘व्यक्ति’ एकवचन संरचना और सामान्य अर्थ दोनों सुरक्षित रखता है।
- issue: γλώσσῃ का संदर्भगत अर्थ
  choice: अन्य भाषा
  alternative: जीभ; अन्य भाषा में वाणी; अज्ञात भाषा
  rationale: अध्याय 12–14 में यह ऐसी आत्मिक वाणी है जिसे सभा में अर्थ बताए बिना नहीं समझा जाता। ‘अन्य भाषा’ साहित्यिक संबंध बनाए रखती है, पर यह तय नहीं करती कि वह साधारण मानवीय भाषा है या किसी अन्य प्रकार की वाणी।
- issue: διερμηνεύῃ का कर्ता
  choice: बोलने वाला स्वयं उसका अर्थ बता सके
  alternative: कोई अन्य व्यक्ति उसका अर्थ बताए
  rationale: यूनानी अधीन क्रिया का अप्रकट कर्ता स्वाभाविक रूप से मुख्य वाक्य के एकवचन बोलने वाले व्यक्ति से जुड़ता है; फिर भी ‘सके’ प्रार्थना के उद्देश्य को क्षमता अथवा सामर्थ्य के रूप में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। ‘अन्य भाषा’ सामान्य पाठक के लिए स्वाभाविक है; ‘उसका अर्थ भी बता सके’ सभा में वाणी को बोधगम्य बनाने के संदर्भ को स्पष्ट करता है, बिना उस वाणी की प्रकृति पर संप्रदायगत निष्कर्ष थोपे।
