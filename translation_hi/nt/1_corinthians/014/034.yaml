id: 1CO.14.34
reference: 1 Corinthians 14:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Αἱ ⸀γυναῖκες ἐν ταῖς ἐκκλησίαις σιγάτωσαν, οὐ γὰρ ⸀ἐπιτρέπεται αὐταῖς λαλεῖν· ἀλλὰ ⸀ὑποτασσέσθωσαν, καθὼς καὶ ὁ νόμος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/034.yaml
  text: The women should keep silent in the churches[a], for they are not permitted to speak, but should be in submission[c][b], just as the law also says.
translation:
  language: hi
  text: स्त्रियाँ कलीसियाओं में चुप रहें[a], क्योंकि उन्हें बोलने की अनुमति नहीं है[b]; बल्कि वे अधीनता में रहें, जैसा कि व्यवस्था भी कहती है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पत्नियाँ कलीसियाओं में चुप रहें”; γυνή का अर्थ संदर्भ के अनुसार “स्त्री” या “पत्नी” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: यह पद स्वयं नहीं बताता कि यहाँ किस प्रकार का बोलना अभिप्रेत है; कुछ लोग आसपास के संदर्भ के आधार पर इसका अर्थ अधिक सीमित समझते हैं।
    reason: lexical_alternative
  - marker: c
    text: यहाँ “व्यवस्था” से विशेष रूप से मूसा की व्यवस्था या अधिक व्यापक रूप में पवित्रशास्त्र अभिप्रेत हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: स्त्रियाँ
  rationale: γυνή का अर्थ संदर्भ के अनुसार ‘स्त्री’ या ‘पत्नी’ हो सकता है। इस पद में पतियों का स्पष्ट उल्लेख नहीं है, इसलिए मुख्य पाठ में व्यापक और स्वाभाविक अर्थ ‘स्त्रियाँ’ रखा गया है; ‘पत्नियाँ’ को पादटिप्पणी में दिया गया है।
- source_word: ἐκκλησίαις
  choice: कलीसियाओं में
  rationale: पौलुस के प्रयोग में ἐκκλησία प्रायः मसीही विश्वासियों की स्थानीय सभा या समुदाय को दर्शाता है। ‘कलीसिया’ हिंदी बाइबलीय प्रयोग में परिचित है और यहाँ एकत्र समुदायों के अर्थ को व्यक्त करता है।
- source_word: σιγάτωσαν
  choice: चुप रहें
  rationale: वर्तमान काल की आज्ञार्थक क्रिया इस प्रसंग में बोलने से रुकने या मौन रहने का निर्देश देती है। ‘चुप रहें’ आधुनिक हिंदी में स्वाभाविक है और इसी अध्याय में व्यवस्थित मौन के भाव को बनाए रखता है।
- source_word: ἐπιτρέπεται
  choice: अनुमति नहीं है
  rationale: कर्मवाच्य रूप अनुमति न दिए जाने को व्यक्त करता है। यह हिंदी अभिव्यक्ति मूल के निर्वैयक्तिक भाव को स्पष्ट और सहज रूप में रखती है।
- source_word: λαλεῖν
  choice: बोलने
  rationale: λαλέω बोलने की सामान्य और व्यापक क्रिया है। ‘बोलना’ इसका तटस्थ अनुवाद है और अपने आप यह निर्धारित नहीं करता कि यहाँ किस प्रकार का बोलना अभिप्रेत है।
- source_word: ὑποτασσέσθωσαν
  choice: अधीनता में रहें
  rationale: यह वर्तमान मध्य/कर्मवाच्य आज्ञार्थक रूप अधीन रहने की स्थिति या आचरण व्यक्त करता है। ‘अधीनता में रहें’ आज्ञा का बल बनाए रखते हुए अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: νόμος
  choice: व्यवस्था
  rationale: हिंदी बाइबलीय भाषा में νόμος के लिए ‘व्यवस्था’ स्वाभाविक है। मूल यूनानी यह स्पष्ट नहीं करता कि संदर्भ विशेष रूप से मूसा की व्यवस्था का है या पवित्रशास्त्र के अधिक व्यापक प्रमाण का; इस प्रश्न को पादटिप्पणी में खुला रखा गया है।
- source_word: καθὼς καὶ ὁ νόμος λέγει
  choice: जैसा कि व्यवस्था भी कहती है
  rationale: यह अनुवाद καθὼς के तुलनात्मक भाव और καί के ‘भी’ दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: γυναῖκες का संदर्भ
  choice: सभा में उपस्थित स्त्रियाँ
  alternative: सभा में उपस्थित पत्नियाँ
  rationale: यूनानी शब्द दोनों अर्थ दे सकता है, पर इसी पद में पतियों का उल्लेख नहीं है। इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया और संकीर्ण संभावना पादटिप्पणी में सुरक्षित की गई।
- issue: बोलने के निषेध का दायरा
  choice: मुख्य पाठ में बिना किसी प्रकार के बोलने तक सीमित किए सीधा अनुवाद
  alternative: व्यवधान डालने वाला बोलना, या भविष्यवाणियों को परखने से संबंधित बोलना
  rationale: इस पद में यूनानी क्रिया केवल ‘बोलना’ कहती है। आसपास के संदर्भ से इसे अधिक संकीर्ण अर्थ देने के प्रस्ताव विवादित हैं, इसलिए अनुवाद में ऐसा अर्थ आरोपित नहीं किया गया।
- issue: ὁ νόμος का आशय
  choice: व्यवस्था
  alternative: विशेष रूप से मूसा की व्यवस्था, अथवा अधिक व्यापक रूप में पवित्रशास्त्र
  rationale: पौलुस किस विशिष्ट पाठ या शास्त्रीय सिद्धांत की ओर संकेत करते हैं, यह पद स्वयं नहीं बताता। पादटिप्पणी इस वास्तविक अस्पष्टता को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और कलीसियाई पाठ के लिए उपयुक्त शैली रखी गई है। ‘चुप रहें’, ‘अनुमति नहीं है’ और ‘अधीनता में रहें’ सामान्य पाठक के लिए स्पष्ट हैं। मुख्य पाठ मूल की संक्षिप्तता और विवादित प्रश्नों की अस्पष्टता बनाए रखता है; आवश्यक विकल्प पादटिप्पणियों में दिए गए हैं।
