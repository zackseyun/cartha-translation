  yaml_path: translation/nt/1_corinthians/014/039.yaml
  text: So then[a], my brothers, be eager to prophesy, and do not forbid speaking in tongues.
translation:
  language: hi
  text: इसलिए, मेरे भाइयो[a], भविष्यवाणी करने के लिए उत्सुक रहो, और भाषाओं में बोलने से मना न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे भाइयो और बहनो’; यूनानी में ‘भाइयो’ है, जो यहाँ पूरी मण्डली के लिए समावेशी सम्बोधन हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह निष्कर्षसूचक संयोजक पिछले विचार-विमर्श से व्यावहारिक निष्कर्ष निकालता है; ‘इसलिए’ आधुनिक हिन्दी में इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: ἀδελφοί μου
  choice: मेरे भाइयो
  rationale: सम्बोधन बहुवचन के साथ ‘मेरे’ को बनाए रखा गया है। यूनानी रूप पुल्लिंग है, पर प्रसंग में यह पूरी मण्डली को समावेशी रूप से सम्बोधित कर सकता है; इस सम्भावना को पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: ζηλοῦτε
  choice: उत्सुक रहो
  rationale: वर्तमानकालिक आज्ञार्थ निरन्तर उत्साहपूर्वक चाहने और प्रयास करने का भाव देता है; ‘उत्सुक रहो’ सहज आधुनिक हिन्दी में सकारात्मक आग्रह व्यक्त करता है।
- source_word: τὸ προφητεύειν
  choice: भविष्यवाणी करने के लिए
  rationale: लेखयुक्त क्रियार्थक संज्ञा यहाँ आग्रह का विषय है। हिन्दी में यह रूप स्वाभाविक है और भविष्यवाणी करने की क्रिया को स्पष्ट रखता है।
- source_word: μὴ κωλύετε
  choice: मना न करो
  rationale: μή के साथ वर्तमान आज्ञार्थ निषेध व्यक्त करता है। ‘मना न करो’ कलीसियाई व्यवहार के विषय में दी गई सीधी मनाही को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ λαλεῖν γλώσσαις
  choice: अन्य भाषाओं में बोलने
  rationale: लेखयुक्त क्रियार्थक संज्ञा और γλώσσαις का प्रयोग अध्याय में चर्चित भाषा-प्रयोग को सूचित करता है। ‘अन्य भाषाओं में बोलना’ अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है और ‘जीभों’ जैसे अस्वाभाविक शब्दशः रूप से बचता है।
theological_decisions:
- issue: मिश्रित स्त्री-पुरुष मण्डली के प्रसंग में ἀδελφοί का अनुवाद
  choice: मेरे भाइयो
  alternative: मेरे भाइयो और बहनो
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है, यद्यपि वह प्रसंग में पूरी मण्डली को प्रतिनिधिक और समावेशी रूप से सम्बोधित कर सकता है। मुख्य पाठ स्रोत-रूप को बनाए रखता है और पाद-टिप्पणी सम्भावित समावेशी आशय स्पष्ट करती है।
- issue: γλώσσαις का अर्थ
  choice: अन्य भाषाओं में
  alternative: अन्यभाषा में / भाषाएँ बोलने
  rationale: यह पद अध्याय 14 में चर्चित उसी घटना को निर्दिष्ट करता है। अनुवाद घटना की प्रकृति पर अतिरिक्त सिद्धान्तगत निष्कर्ष थोपे बिना इसे बहुवचन ‘भाषाओं’ के रूप में प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भविष्यवाणी’ और ‘अन्य भाषाओं में बोलना’ अध्याय के प्रमुख धार्मिक पदों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखते हैं।
