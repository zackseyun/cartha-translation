translation:
  language: hi
  text: पर यदि वहाँ बैठे किसी दूसरे को कुछ प्रकट हो, तो पहले बोलने वाला चुप हो जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: पर यदि
  rationale: ἐὰν शर्त व्यक्त करता है और δὲ हल्का विरोध या विचार में अगला मोड़; यहाँ “पर यदि” निर्देश के प्रवाह में स्वाभाविक है।
- source_word: ἄλλῳ
  choice: किसी दूसरे पर
  rationale: दत्तिव एक अन्य सहभागी को सूचित करता है। ἀποκαλύπτω के निष्क्रिय प्रयोग के साथ हिन्दी में “किसी पर कुछ प्रकट किया जाए” स्रोत की संरचना और ग्रहणकर्ता—दोनों को सहज रूप से रखता है।
- source_word: ἀποκαλυφθῇ
  choice: कुछ प्रकट किया जाए
  rationale: यह ἀποκαλύπτω का एओरिस्ट निष्क्रिय संभावनार्थक रूप है। “कुछ प्रकट किया जाए” निष्क्रियता बनाए रखता है, कर्ता को अनकहा छोड़ता है, और किसी संज्ञा को अनावश्यक रूप से नहीं जोड़ता।
- source_word: καθημένῳ
  choice: वहाँ बैठे
  rationale: वर्तमान कृदन्त ἄλλῳ का विशेषण है। “वहाँ बैठे” सभा में बैठे दूसरे सहभागी की स्थिति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ πρῶτος
  choice: पहला व्यक्ति
  rationale: मूल में शाब्दिक अर्थ “पहला” है; हिन्दी में “व्यक्ति” जोड़ने से वाक्य स्पष्ट और स्वाभाविक बनता है, जबकि संदर्भ बताता है कि वह पहले बोलने वाला है।
- source_word: σιγάτω
  choice: चुप हो जाए
  rationale: तीसरे पुरुष की आज्ञा को “चुप हो जाए” स्वाभाविक ढंग से व्यक्त करता है और प्रसंगानुसार बोलना रोककर दूसरे को अवसर देने का भाव रखता है।
theological_decisions:
- issue: सभा में प्रकाशन की प्रकृति और उसका कर्ता
  choice: निष्क्रिय रूप “कुछ प्रकट किया जाए” रखा गया और प्रकट करने वाले को स्पष्ट रूप से नहीं बताया गया।
  alternative: “किसी दूसरे को प्रकाशन मिले” अथवा “परमेश्वर किसी दूसरे पर कुछ प्रकट करे।”
  rationale: प्रसंग में प्रकाशन का स्रोत परमेश्वर समझा जा सकता है, पर इस वाक्य में यूनानी पाठ कर्ता का नाम नहीं लेता। अनुवाद उसी संयम और वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सभा-संबंधी निर्देश के अनुरूप भाषा। “प्रकाशन” जैसे अपेक्षाकृत तकनीकी धार्मिक पद के बजाय क्रियात्मक “कुछ प्रकट किया जाए” मूल यूनानी के अधिक निकट और सामान्य पाठक के लिए स्पष्ट है।
