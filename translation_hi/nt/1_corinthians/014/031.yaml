base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/031.yaml
  text: For you can all prophesy one by one[b][a], so that all may learn and all may be encouraged.
translation:
  language: hi
  text: क्योंकि तुम सब एक-एक करके भविष्यवाणी कर सकते हो[a], ताकि सब सीखें और सब प्रोत्साहित हों[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक समय में एक।”
    reason: lexical_alternative
  - marker: b
    text: या, “सबको समझाया जाए” अथवा “सबको सांत्वना मिले”; यूनानी क्रिया प्रसंग के अनुसार प्रोत्साहन, आग्रहपूर्ण समझाइश या सांत्वना का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δύνασθε
  choice: कर सकते हो
  rationale: यह सामर्थ्य या संभावना व्यक्त करता है; आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछली बात का आधार या स्पष्टीकरण प्रस्तुत करता है।
- source_word: καθ’ ἕνα
  choice: एक-एक करके
  rationale: सभा में क्रम से, एक समय में एक व्यक्ति के बोलने का स्वाभाविक हिन्दी रूप।
- source_word: πάντες
  choice: सब
  rationale: यूनानी पाठ में तीन बार आए शब्द की व्यापकता और पुनरावृत्ति को बनाए रखता है।
- source_word: προφητεύειν
  choice: भविष्यवाणी कर सकते हो
  rationale: पौलुस द्वारा प्रयुक्त स्थापित श्रेणी को बिना संकुचित व्याख्या के सुरक्षित रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा परिणाम का स्वाभाविक हिन्दी संकेत देता है।
- source_word: μανθάνωσιν
  choice: सीखें
  rationale: उद्देश्यवाचक उपवाक्य में सामान्य शिक्षण-संबंधी अर्थ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: παρακαλῶνται
  choice: प्रोत्साहित हों
  rationale: सभा की उन्नति के प्रसंग में παρακαλέω के प्रोत्साहन, आग्रह और सांत्वना से जुड़े व्यापक अर्थ को यथासंभव समेटता है।
theological_decisions:
- issue: सभा-संबंधी निर्देश में πάντες (‘सब’) का दायरा
  choice: तीनों स्थानों पर ‘सब’ रखा गया है और पहले प्रयोग को अधिक स्पष्ट करके ‘तुम सब’ किया गया है, पर समूह को ‘सभी भविष्यवक्ता’ कहकर सीमित नहीं किया गया।
  alternative: ‘सभी भविष्यवक्ता’ या पहले स्थान पर केवल ‘सब’
  rationale: पहला πάντες दूसरे पुरुष बहुवचन δύνασθε के साथ है, इसलिए ‘तुम सब’ हिन्दी में व्याकरणिक संबंध स्पष्ट करता है; फिर भी यूनानी की व्यापकता को किसी अधिक संकीर्ण समूह तक सीमित नहीं करता। बाद के दोनों प्रयोग श्रोताओं या सभा के सहभागियों पर लागू हो सकते हैं, इसलिए वहाँ केवल ‘सब’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘भविष्यवाणी’ पौलुस की स्थापित संज्ञा को बनाए रखती है। वाक्य में ‘सब’ की पुनरावृत्ति मूल पाठ के बलाघात को सुरक्षित रखती है।
