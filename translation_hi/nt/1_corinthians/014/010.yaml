translation:
  language: hi
  text: संसार में शायद अनेक प्रकार की भाषाएँ हैं[a], और उनमें से कोई भी अर्थहीन नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संसार में शायद इतने प्रकार की ध्वनियाँ हैं, और कोई भी ध्वनिरहित नहीं है।”
    reason: φωνῶν का अर्थ ‘ध्वनियाँ’ और ἄφωνον का अधिक शाब्दिक अर्थ ‘ध्वनिरहित’ भी हो सकता है।
lexical_decisions:
- source_word: τοσαῦτα εἰ τύχοι
  choice: न जाने कितने
  rationale: यह स्वाभाविक हिन्दी मुहावरा बड़ी, अनिश्चित संख्या का भाव व्यक्त करता है और εἰ τύχοι की अनिश्चितता को बनाए रखता है।
- source_word: γένη
  choice: प्रकार
  rationale: यह अलग-अलग श्रेणियों या किस्मों के लिए सहज और व्यापक हिन्दी शब्द है।
- source_word: φωνῶν
  choice: भाषाएँ
  rationale: φωνή का अर्थ ध्वनि, वाणी या भाषा हो सकता है; अध्याय 14 में समझ में आने वाली वाणी की चर्चा के कारण मुख्य पाठ में ‘भाषाएँ’ प्रसंगानुकूल है, जबकि व्यापक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἐν κόσμῳ
  choice: संसार में
  rationale: κόσμος के सामान्य स्थानवाचक अर्थ का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: οὐδὲν ἄφωνον
  choice: उनमें से कोई भी अर्थहीन नहीं है
  rationale: भाषाओं के संदर्भ में यह वाक्यांश उनके अर्थ या अभिप्राय से रहित न होने का भाव देता है; ἄφωνον की अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
