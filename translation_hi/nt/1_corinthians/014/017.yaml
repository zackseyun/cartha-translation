base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/017.yaml
  text: For you are indeed giving thanks well[a], but the other person is not built up.
translation:
  language: hi
  text: क्योंकि तुम तो भली-भाँति धन्यवाद देते हो, लेकिन दूसरा व्यक्ति सुदृढ़ नहीं होता।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “दूसरे व्यक्ति की उन्नति नहीं होती।”
    reason: οἰκοδομεῖται के लिए अधिक अर्थपरक हिन्दी विकल्प; मुख्य पाठ में सुदृढ़ होने का भाव मूल के निर्माण-रूपक के निकट है।
lexical_decisions:
- source_word: σὺ
  choice: तुम
  rationale: द्वितीय पुरुष एकवचन को सीधे संबोधन के रूप में रखा गया है; हिन्दी में ‘तुम’ स्वाभाविक और स्पष्ट है।
- source_word: μὲν γὰρ
  choice: क्योंकि ... तो
  rationale: ‘क्योंकि’ व्याख्यात्मक संबंध और ‘तो’ μέν से बने स्वीकारोक्तिपूर्ण-विरोधी विन्यास को व्यक्त करता है, जिसकी अगली धुरी ‘लेकिन’ है।
- source_word: καλῶς
  choice: भली-भाँति
  rationale: यह क्रिया-विशेषण धन्यवाद देने को ‘अच्छी तरह/उचित रीति से’ किए जाने के रूप में स्वीकार करता है; ‘भली-भाँति’ वर्तमान, गरिमापूर्ण हिन्दी में दोनों भाव समेटता है।
- source_word: εὐχαριστεῖς
  choice: धन्यवाद देते हो
  rationale: वर्तमानकालीन निर्देशार्थक क्रिया को संभावना के बजाय वास्तविक क्रिया के रूप में रखा गया है; प्रसंग में इसका आशय परमेश्वर को धन्यवाद देना है।
- source_word: ἀλλ’
  choice: लेकिन
  rationale: यह पहले कथन की स्वीकृति के बाद मुख्य विरोध प्रस्तुत करता है।
- source_word: ὁ ἕτερος
  choice: दूसरे व्यक्ति
  rationale: ‘दूसरा’ सभा में वक्ता के अतिरिक्त सहभागी या सुनने वाले को सूचित करता है; ‘व्यक्ति’ जोड़ने से हिन्दी में संदर्भ स्वाभाविक और अनिर्धारित रहता है।
- source_word: οὐκ οἰκοδομεῖται
  choice: की उन्नति नहीं होती
  rationale: निष्क्रिय रूप और पौलुस के निर्माण-रूपक का आशय आत्मिक लाभ तथा दृढ़ता है। हिन्दी में शाब्दिक ‘निर्माण नहीं होता’ अस्वाभाविक है; ‘उन्नति नहीं होती’ अर्थ को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: सभा के संदर्भ में οἰκοδομέω का पौलुसी निर्माण-रूपक
  choice: की उन्नति नहीं होती
  alternative: वह उन्नत नहीं किया जाता / उसका निर्माण नहीं होता
  rationale: चयन सामुदायिक आत्मिक लाभ के व्यापक आशय को बनाए रखता है और किसी संकीर्ण सांप्रदायिक व्याख्या को नहीं जोड़ता। हिन्दी की स्वाभाविकता के लिए रूपक को अर्थपरक ढंग से व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सभा में पढ़े जाने योग्य शैली। ‘तुम तो’ एकवचन संबोधन और μέν…ἀλλά के स्वीकारोक्ति-विरोध को स्वाभाविक रूप से दर्शाता है।
