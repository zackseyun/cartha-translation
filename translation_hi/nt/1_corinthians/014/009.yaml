base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/009.yaml
  text: 'So also with you: if through the tongue you do not give intelligible speech[a], how will what is spoken be understood? For you will be speaking into the air.'
translation:
  language: hi
  text: इसी तरह तुम भी, यदि जीभ से समझ में आने वाली बात[a] न कहो, तो जो कहा जा रहा है वह कैसे समझा जाएगा? क्योंकि तुम हवा में बोलते रहोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्पष्ट बात” अथवा “पहचानी जा सकने वाली वाणी।” यूनानी शब्द ऐसी वाणी पर बल देता है जिसे सुनने वाले स्पष्ट रूप से पहचान और समझ सकें।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: इसी तरह तुम भी
  rationale: पिछले उदाहरण से तुलना को बनाए रखते हुए कुरिन्थियों को सीधे संबोधित करता है।
- source_word: διὰ τῆς γλώσσης
  choice: जीभ से
  rationale: ‘जीभ’ की ठोस छवि को सुरक्षित रखता है और साधन के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εὔσημον λόγον
  choice: समझ में आने वाली बात
  rationale: ऐसी वाणी का भाव व्यक्त करता है जिसे सुनने वाले पहचान और समझ सकें; ‘बात’ यहाँ λόγον के सामूहिक संप्रेषणात्मक अर्थ के लिए स्वाभाविक है।
- source_word: δῶτε
  choice: कहो
  rationale: यूनानी में शाब्दिक अर्थ ‘दो’ है, पर हिन्दी में ‘बात देना’ अस्वाभाविक होगा; इस प्रसंग में ‘कहो’ उसी वाचिक क्रिया को स्पष्ट रूप से व्यक्त करता है।
- source_word: πῶς γνωσθήσεται
  choice: कैसे समझा जाएगा
  rationale: निष्क्रिय क्रिया यहाँ सुनने वालों द्वारा कथन के बोध की ओर संकेत करती है।
- source_word: τὸ λαλούμενον
  choice: जो कहा जा रहा है
  rationale: संज्ञीकृत वर्तमान निष्क्रिय कृदन्त के जारी वाचिक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔσεσθε γὰρ εἰς ἀέρα λαλοῦντες
  choice: क्योंकि तुम हवा में बोलने वाले ठहरोगे
  rationale: व्यर्थ और अबोध वाणी की मूल रूपकात्मक छवि तथा भविष्यकालीन संरचना दोनों को सुरक्षित रखता है।
