source:
  edition: SBLGNT
  text: θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, μᾶλλον δὲ ἵνα προφητεύητε· μείζων ⸀δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις, ἐκτὸς εἰ μὴ ⸀διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/005.yaml
  text: I want all of you to speak in tongues[a], but even more that you would prophesy. The one who prophesies is greater than the one who speaks in tongues, unless he interprets[b], so that the church may receive edification.
translation:
  language: hi
  text: मैं चाहता हूँ कि तुम सब भाषाओं में बोलो, पर उससे भी अधिक कि तुम भविष्यवाणी करो। जो भविष्यवाणी करता है, वह भाषाओं में बोलने वाले से बड़ा है, सिवाय इसके कि वह अर्थ बताए[a], ताकि कलीसिया को उन्नति मिले[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिवाय इसके कि कोई अर्थ बताए।” यूनानी में क्रिया एकवचन है; वह स्वयं भाषाओं में बोलने वाले की ओर संकेत कर सकती है, पर प्रसंग में किसी दूसरे व्यक्ति द्वारा अर्थ बताए जाने की संभावना भी है।
    reason: alternative_reading
  - marker: b
    text: “उन्नति” का अर्थ यहाँ एकत्रित कलीसिया का निर्माण और दृढ़ीकरण है।
    reason: lexical_clarification
lexical_decisions:
- source_word: θέλω
  choice: मैं चाहता हूँ
  rationale: वर्तमान काल में पौलुस की सीधी इच्छा व्यक्त होती है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: πάντας ὑμᾶς
  choice: तुम सब
  rationale: बहुवचन संबोधन की समावेशी व्यापकता स्पष्ट करता है।
- source_word: λαλεῖν γλώσσαις
  choice: अन्य भाषाओं में बोलो
  rationale: γλῶσσαι के मूल अर्थ ‘भाषाएँ’ को स्पष्ट, सामान्य हिन्दी में रखता है और अध्याय में वर्णित आत्मिक वाणी के स्वरूप को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: μᾶλλον δὲ
  choice: पर उससे भी अधिक
  rationale: एक वरदान को अस्वीकार किए बिना दूसरे के लिए अधिक प्रबल इच्छा व्यक्त करता है।
- source_word: ἵνα προφητεύητε
  choice: यह कि तुम भविष्यवाणी करो
  rationale: θέλω के बाद ἵνα-वाक्य इच्छा की विषयवस्तु बताता है; ‘भविष्यवाणी करो’ प्रचलित और स्रोत-संगत है।
- source_word: μείζων
  choice: बड़ा
  rationale: तुलनात्मक शब्द को सीधे बनाए रखता है; प्रसंग इसका अर्थ कलीसिया के लाभ की दृष्टि से निर्धारित करता है, व्यक्तिगत मूल्य या पवित्रता की दृष्टि से नहीं।
- source_word: διερμηνεύῃ
  choice: वह उसका अर्थ बताए
  rationale: एकवचन क्रिया का निकटतम व्याकरणिक कर्ता अन्य भाषा में बोलने वाला व्यक्ति है; हिन्दी में ‘अर्थ बताए’ व्याख्या/अनुवाद दोनों की प्रसंगगत धारणा सहज रूप से देता है।
- source_word: ἡ ἐκκλησία
  choice: कलीसिया
  rationale: पौलुस के प्रसंग में एकत्रित मसीही समुदाय के लिए हिन्दी बाइबलीय प्रयोग में परिचित शब्द है।
- source_word: οἰκοδομὴν λάβῃ
  choice: कलीसिया की उन्नति हो
  rationale: शाब्दिक ‘निर्माण पाए’ के रूपक को स्वाभाविक हिन्दी में समुदाय के आत्मिक निर्माण और लाभ के अर्थ में व्यक्त करता है।
theological_decisions:
- issue: भविष्यवाणी करने वाले का ‘बड़ा’ होना
  choice: मुख्य पाठ में ‘बड़ा’ रखा गया है और उद्देश्य-वाक्य इसे कलीसिया की उन्नति से जोड़ता है।
  alternative: पद, पवित्रता या अंतर्निहित आत्मिक महत्ता में श्रेष्ठ
  rationale: यूनानी μείζων वास्तविक तुलना करता है, पर अंतिम उद्देश्य-वाक्य उसका प्रसंगगत मानदंड सामुदायिक उन्नति बताता है; अनुवाद इससे आगे कोई आध्यात्मिक पदानुक्रम नहीं गढ़ता।
- issue: διερμηνεύῃ का कर्ता
  choice: ‘वह’—अन्य भाषा में बोलने वाला स्वयं
  alternative: कोई दूसरा व्यक्ति अर्थ बताए अथवा अर्थ बताया जाए
  rationale: बिना नए स्पष्ट कर्ता की एकवचन क्रिया निकटवर्ती एकवचन बोलने वाले की ओर स्वाभाविक रूप से लौटती है, फिर भी अध्याय के व्यापक प्रसंग में दूसरे व्यक्ति द्वारा अर्थ बताने की संभावना है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: γλώσσαις का स्वरूप
  choice: अन्य भाषाएँ
  alternative: अनजानी भाषाएँ; अन्यभाषा; ज़बानें
  rationale: ‘भाषाएँ’ मूल शब्द का सामान्य अर्थ सुरक्षित रखता है और यह अनिर्णीत छोड़ता है कि यहाँ की वाणी को किस प्रकार वर्गीकृत किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘तुम सब’ मूल बहुवचन को स्पष्ट करता है। ‘कलीसिया’ लक्षित बाइबलीय पाठक-वर्ग में परिचित है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न [a], [b] सम्मिलित हैं।
