lexical_decisions:
- source_word: προφῆται
  choice: भविष्यद्वक्ता
  rationale: यह संज्ञा भविष्यद्वक्ताओं या भविष्यद्वाणी करने वाले वक्ताओं को दर्शाती है। ‘भविष्यद्वक्ता’ इसका सीधा और प्रसंगानुकूल हिन्दी रूप है।
- source_word: δὲ
  choice: अप्रत्यक्ष संक्रमण
  rationale: यहाँ δέ निर्देशों की शृंखला में हल्का संक्रमण दिखाता है; हिन्दी में अलग संयोजक न देना स्वाभाविक है और अनावश्यक विरोधाभास से बचाता है।
- source_word: δύο ἢ τρεῖς
  choice: दो या तीन
  rationale: मूल की संख्यात्मक अभिव्यक्ति को सीधे बनाए रखता है।
- source_word: λαλείτωσαν
  choice: बोलें
  rationale: तृतीय पुरुष बहुवचन आज्ञार्थक रूप को आधुनिक और स्वाभाविक हिन्दी में ‘बोलें’ व्यक्त करता है।
- source_word: οἱ ἄλλοι
  choice: दूसरे लोग
  rationale: मूल पाठ इस समूह की पहचान स्पष्ट नहीं करता। यह रूप अन्य भविष्यद्वक्ताओं, अगुवों या शेष सभा में से किसी एक को निश्चित किए बिना अस्पष्टता बनाए रखता है।
- source_word: διακρινέτωσαν
  choice: कही गई बात को परखें
  rationale: इस प्रसंग में क्रिया का अर्थ भविष्यद्वाणी के कथन का विवेकपूर्ण मूल्यांकन करना है, न कि केवल दोषी ठहराना। ‘परखें’ संक्षिप्त, स्वाभाविक और अर्थपूर्ण है।
theological_decisions:
- issue: ‘दूसरे लोग’ की पहचान
  choice: इसे सामान्य रूप से ‘दूसरे लोग’ रखा गया है।
  alternative: ‘दूसरे भविष्यद्वक्ता’ या ‘सभा के शेष लोग’
  rationale: यूनानी पाठ केवल ‘दूसरे’ कहता है और यह निश्चित नहीं करता कि वे अन्य भविष्यद्वक्ता, अगुवे या पूरी सभा के अन्य सदस्य हैं। अनुवाद इस कलीसियाई प्रश्न को अनावश्यक रूप से हल नहीं करता।
- issue: किस बात को परखा जाए
  choice: ‘कही गई बात को परखें’
  alternative: केवल ‘परखें’ या ‘वक्ताओं को परखें’
  rationale: क्रिया का कर्म मूल में व्यक्त नहीं है, पर प्रसंग भविष्यद्वाणी के कथनों के मूल्यांकन की ओर संकेत करता है। यह रूप वक्ताओं पर न्याय करने के बजाय उनके कथन की जाँच को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सभा में दिए जा रहे निर्देश के अनुरूप भाषा। ‘दूसरे लोग’ मूल के अनिर्दिष्ट संदर्भ को सुरक्षित रखता है; ‘परखें’ न्यायिक कठोरता के बजाय विवेकपूर्ण मूल्यांकन व्यक्त करता है।
