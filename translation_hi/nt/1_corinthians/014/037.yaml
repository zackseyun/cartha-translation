id: 1CO.14.37
reference: 1 Corinthians 14:37
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ προφήτης εἶναι ἢ πνευματικός, ἐπιγινωσκέτω ἃ γράφω ὑμῖν ὅτι κυρίου ⸀ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/037.yaml
  text: If anyone thinks he is a prophet or spiritual[a], let him recognize that what I am writing to you is a command of the Lord.
translation:
  language: hi
  text: यदि कोई अपने आपको भविष्यद्वक्ता या आत्मिक व्यक्ति समझता है, तो वह यह पहचाने कि जो कुछ मैं तुम्हें लिख रहा हूँ, वह प्रभु की आज्ञा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ मैं तुम्हें लिख रहा हूँ, वह प्रभु का है।” यूनानी में शाब्दिक रूप से “प्रभु का है” लिखा है; ‘आज्ञा’ संज्ञा स्पष्ट रूप से नहीं दी गई है। मुख्य पाठ में अर्थ स्पष्ट करने के लिए “आज्ञा” जोड़ा गया है।
    reason: ग्रीक κυρίου ἐστίν की दीर्घवृत्तीय अभिव्यक्ति और अधिक शाब्दिक विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: δοκεῖ
  choice: अपने आपको ... समझता है
  rationale: यहाँ शब्द किसी व्यक्ति के अपने विषय में किए गए आकलन या दावे को व्यक्त करता है; यह अनुवाद सम्भावित सुधारात्मक स्वर को भी बनाए रखता है।
- source_word: προφήτης
  choice: भविष्यद्वक्ता
  rationale: आत्मिक वरदानों और भविष्यवाणी के प्रसंग में यह प्रचलित और स्पष्ट हिन्दी समतुल्य है।
- source_word: πνευματικός
  choice: आत्मिक व्यक्ति
  rationale: ग्रीक विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और ऐसे व्यक्ति की ओर संकेत करता है जो स्वयं को आत्मिक या आत्मा से संपन्न मानता है; 'आत्मिक व्यक्ति' इसकी व्यापकता बनाए रखता है।
- source_word: ἐπιγινωσκέτω
  choice: वह यह मान ले
  rationale: वर्तमान आज्ञार्थक रूप स्वीकार करने या पहचान लेने की माँग करता है। प्रसंग में पौलुस के लिखित निर्देशों के अधिकार को स्वीकार करना प्रमुख है।
- source_word: ἃ γράφω ὑμῖν
  choice: जो बातें मैं तुम्हें लिख रहा हूँ
  rationale: बहुवचन-सापेक्ष रूप और पत्र लिखते समय के वर्तमान काल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κυρίου ἐστίν
  choice: वे प्रभु की आज्ञा हैं
  rationale: ग्रीक वाक्यांश शाब्दिक रूप से 'प्रभु का/की है' जैसा संक्षिप्त और अनिर्दिष्ट है। प्रसंग में 'आज्ञा' पूरित करने से बाध्यकारी दैवी अधिकार स्पष्ट होता है, जबकि पादटिप्पणी मूल की अस्पष्टता सुरक्षित रखती है।
theological_decisions:
- issue: κυρίου ἐστίν का संक्षिप्त और दीर्घवृत्तीय अर्थ
  choice: मुख्य पाठ में 'वे प्रभु की आज्ञा हैं'
  alternative: '''वे प्रभु की हैं'' अथवा ''यह प्रभु का है'''
  rationale: अध्याय के प्रसंग में पौलुस अपने लिखित निर्देशों के प्रभु-प्रदत्त अधिकार पर बल देता है। फिर भी ग्रीक में 'आज्ञा' संज्ञा प्रत्यक्ष नहीं है, इसलिए वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- issue: τις ... προφήτης ... πνευματικός में व्याकरणिक पुल्लिंग और सामान्य संदर्भ
  choice: लिंग-विशिष्ट सर्वनाम जोड़े बिना 'कोई अपने आपको ... समझता है'
  alternative: '''यदि कोई पुरुष अपने आपको...'''
  rationale: ग्रीक रूप व्याकरणिक रूप से पुल्लिंग एकवचन हैं, पर τις सामान्यतः 'कोई' है। स्वाभाविक हिन्दी में सर्वनाम छोड़ा जा सकता है; इससे स्रोत में निहित सामान्य व्यक्तिगत दायरा बना रहता है और अनावश्यक रूप से जैविक लिंग नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। 'भविष्यद्वक्ता' और 'आत्मिक व्यक्ति' धार्मिक प्रसंग के परिचित पद हैं। वाक्य में आज्ञार्थक बल को 'मान ले' से स्पष्ट किया गया है।
