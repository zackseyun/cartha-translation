source:
  edition: SBLGNT
  text: ἐὰν δὲ πάντες προφητεύωσιν, εἰσέλθῃ δέ τις ἄπιστος ἢ ἰδιώτης, ἐλέγχεται ὑπὸ πάντων, ἀνακρίνεται ὑπὸ πάντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/024.yaml
  text: But if all prophesy[a], and some unbeliever or uninstructed person enters, he is convicted by all; he is examined by all.
translation:
  language: hi
  text: परन्तु यदि सब भविष्यवाणी करें और कोई अविश्वासी या अनभिज्ञ व्यक्ति[a] आए, तो वह सबके द्वारा कायल किया जाता है और सबके द्वारा जाँचा-परखा जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाहरी व्यक्ति।” यूनानी शब्द ऐसे व्यक्ति के लिए हो सकता है जो अनभिज्ञ हो, दीक्षित न हो, या बोलने वाले समूह का हिस्सा न हो।
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: सब
  rationale: समुदाय में भविष्यवाणी करने वालों के लिए प्रयुक्त समावेशी परिमाणवाचक शब्द को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: προφητεύωσιν
  choice: भविष्यवाणी करें
  rationale: यह इस अध्याय की स्थापित पौलुसी श्रेणी को बनाए रखता है और इसे केवल भविष्य बताने या सामान्य प्रेरित वाणी तक सीमित नहीं करता।
- source_word: ἄπιστος
  choice: अविश्वासी
  rationale: इस संदर्भ में यह विश्वास न करने वाले व्यक्ति को दर्शाता है; ‘अविश्वासी’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: ἰδιώτης
  choice: अनभिज्ञ व्यक्ति
  rationale: यहाँ आशय ऐसे व्यक्ति से है जो सभा की बातों या रीति से परिचित अथवा उनमें दीक्षित नहीं है। ‘अनभिज्ञ’ सामान्य अशिक्षा या किसी आधुनिक कलीसियाई पद का अर्थ आरोपित नहीं करता।
- source_word: ἐλέγχεται
  choice: उसे उसके दोष का बोध कराते हैं
  rationale: क्रिया में दोष उजागर होने, समझाए जाने और अंतःकरण में कायल होने का भाव है। स्वाभाविक हिन्दी के लिए कर्मवाच्य को कर्तृवाच्य बनाया गया है, जबकि πάντων की सामूहिक भूमिका सुरक्षित है।
- source_word: ἀνακρίνεται
  choice: उसे परखते हैं
  rationale: यह जाँचने या छानबीन करने का भाव व्यक्त करता है, पर अंतिम दण्डादेश या दोषसिद्धि का अर्थ नहीं थोपता।
- source_word: ὑπὸ πάντων
  choice: सब ... सब
  rationale: यूनानी पाठ की पुनरावृत्ति और इस बात पर बल कि सामूहिक भविष्यवाणी उसके ऊपर प्रभाव डालती है, दोनों सुरक्षित रखे गए हैं।
- source_word: δέ
  choice: परन्तु / और
  rationale: पहला δέ पिछले परिदृश्य से विरोध दिखाता है; दूसरा शर्त के भीतर अगले कार्य को स्वाभाविक रूप से जोड़ता है।
- source_word: τις
  choice: कोई
  rationale: अनिश्चित व्यक्ति का संकेत आधुनिक हिन्दी में सहज ढंग से व्यक्त होता है।
theological_decisions:
- issue: सभा के संदर्भ में ἰδιώτης का अर्थ
  choice: अनभिज्ञ व्यक्ति
  alternative: बाहरी व्यक्ति
  rationale: निकटवर्ती संदर्भ समझ और बोधगम्यता पर केंद्रित है। ‘अनभिज्ञ व्यक्ति’ यह खुला रखता है कि वह पूरी तरह समुदाय के बाहर का व्यक्ति हो भी सकता है और नहीं भी; सम्भव वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- issue: ἐλέγχεται में दोष-बोध और दोषसिद्धि का संबंध
  choice: उसे उसके दोष का बोध कराते हैं
  alternative: वह दोषी ठहराया जाता है
  rationale: यह अंतःकरण के उजागर होने और कायल किए जाने के भाव को व्यक्त करता है, पर इसे न्यायिक या अंतिम दोषसिद्धि नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘भविष्यवाणी’ अध्याय की प्रमुख पारिभाषिक कड़ी बनाए रखती है। यूनानी कर्मवाच्य का शाब्दिक हिन्दी रूप असहज होने के कारण अंतिम दोनों उपवाक्यों में स्वाभाविक कर्तृवाच्य अपनाया गया है, साथ ही ‘सब’ की पुनरावृत्ति सुरक्षित रखी गई है।
