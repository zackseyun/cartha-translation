  text: οὐ γάρ ἐστιν ἀκαταστασίας ὁ θεὸς ἀλλὰ εἰρήνης), ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/014/033.yaml
  text: For God is not a God of disorder but of peace[b][a], as in all the churches of the saints.
translation:
  language: hi
  text: क्योंकि परमेश्वर अव्यवस्था के नहीं, बल्कि शांति के परमेश्वर हैं,[a] जैसा कि पवित्र जनों की सभी कलीसियाओं में होता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि परमेश्वर उलझन के नहीं, बल्कि शांति के परमेश्वर हैं।”
    reason: ἀκαταστασίας के लिए ‘उलझन’ एक सम्भव शाब्दिक विकल्प है, यद्यपि संदर्भ में ‘अव्यवस्था’ अधिक व्यापक है।
  - marker: b
    text: या, “परमेश्वर के पवित्र लोगों की सभी कलीसियाओं में।” कुछ लोग इस वाक्यांश को इस पद के बजाय अगले पद के साथ जोड़ते हैं।
    reason: ‘पवित्र जनों’ के लिए अधिक व्याख्यात्मक विकल्प और यूनानी वाक्यांश के विवादित वाक्यगत संबंध को बनाए रखने के लिए।
lexical_decisions:
- source_word: ἀκαταστασίας
  choice: अव्यवस्था
  rationale: यह शब्द सामूहिक आराधना के तात्कालिक संदर्भ में अनुशासनहीनता और अव्यवस्थित स्थिति को दर्शाता है; ‘अव्यवस्था’ मानसिक उलझन तक अर्थ को सीमित नहीं करता।
- source_word: εἰρήνης
  choice: शान्ति
  rationale: यह εἰρήνη का स्वाभाविक और प्रचलित हिन्दी रूप है तथा यहाँ सामुदायिक अव्यवस्था के विपरीत सुव्यवस्थित शान्ति का भाव देता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: निश्चित और व्यक्तिगत ईश्वर के लिए आधुनिक हिन्दी बाइबलीय प्रयोग में यह स्वाभाविक एवं गरिमापूर्ण पद है।
- source_word: ὡς
  choice: जैसा कि
  rationale: यह तुलना अथवा सर्वत्र प्रचलित स्थिति की ओर संकेत करने वाले यूनानी संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐκκλησίαις
  choice: कलीसियाओं
  rationale: स्थानीय मसीही समुदायों के लिए यह स्थापित हिन्दी बाइबलीय शब्द है।
- source_word: τῶν ἁγίων
  choice: पवित्र जनों की
  rationale: यह विश्वासियों के लिए पौलुस के सामान्य संबोधन का अर्थ स्पष्ट रखते हुए ‘सन्तों’ से अधिक सहज आधुनिक हिन्दी देता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले निर्देशों के आधार या कारण को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων वाक्यांश का संबंध
  choice: इसे पद 33 के साथ जोड़कर सभी कलीसियाओं में पाई जाने वाली स्थिति की तुलना माना गया है।
  alternative: इसे अगले पद के आरम्भ से जोड़कर कलीसियाओं में आचरण संबंधी कथन माना जा सकता है।
  rationale: दिए गए SBLGNT पाठ और विराम-चिह्न के अनुसार इसे पद 33 से जोड़ना संगत है, पर यूनानी वाक्य-विन्यास में अगले पद से इसका संबंध भी सम्भव है; इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘शान्ति’ और ‘कलीसिया’ जैसे परिचित बाइबलीय पद रखे गए हैं, जबकि ‘पवित्र जन’ सामान्य पाठक के लिए अपेक्षाकृत स्पष्ट है।
