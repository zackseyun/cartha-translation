  text: जो एक भाषा[a] में बोलता है, वह अपनी उन्नति करता है[b]; पर जो भविष्यवाणी करता है, वह कलीसिया[c] की उन्नति करता है।
  philosophy: optimal-equivalence
  footnotes:
