    text: या, “भाषा में।” इस अध्याय में यह शब्द संभवतः भाषा-वाणी के आत्मिक वरदान को दर्शाता है; उस वाणी की ठीक प्रकृति पर मतभेद है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने आप को बनाता है” या “निर्माण करता है”; यहाँ आशय आत्मिक उन्नति से है।
    reason: metaphor_clarification
  - marker: c
    text: या, “सभा” अथवा “मण्डली।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν
  choice: जो ... बोलता है
  rationale: लेखयुक्त वर्तमान कृदंत यहाँ संज्ञा की तरह एक प्रतिनिधि व्यक्ति को सूचित करता है। हिन्दी में ‘जो ... बोलता है’ स्वाभाविक है और अगले समानांतर खंड से मेल रखता है।
- source_word: γλώσσῃ
  choice: अन्य भाषा में
  rationale: एकवचन करण/अधिकरण रूप को रखा गया है। ‘अन्य भाषा’ हिन्दी में बोधगम्य है, जबकि पादटिप्पणी स्पष्ट करती है कि प्रसंग में यह आत्मा-प्रदत्त भाषा-वाणी के वरदान का संकेत हो सकता है और उसकी ठीक प्रकृति विवादित है।
- source_word: ἑαυτὸν
  choice: स्वयं को
  rationale: यह एकवचन आत्मवाचक सर्वनाम का सीधा और स्वाभाविक हिन्दी रूप है; हिन्दी में यह अनावश्यक लैंगिकता जोड़े बिना यूनानी के आत्म-संदर्भ को बनाए रखता है।
- source_word: οἰκοδομεῖ
  choice: दृढ़ करता है
  rationale: यहाँ क्रिया रूपक रूप में आत्मिक उन्नति या सामर्थ्य देने के अर्थ में है। ‘दृढ़ करता है’ आधुनिक हिन्दी में स्पष्ट है; निर्माण-रूपक का वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- source_word: ὁ δὲ προφητεύων
  choice: पर जो भविष्यवाणी करता है
  rationale: ‘जो ... करता है’ संज्ञात्मक कृदंत का स्वाभाविक हिन्दी रूप है और δέ के हल्के विरोध को ‘पर’ व्यक्त करता है।
- source_word: ἐκκλησίαν
  choice: कलीसिया को
  rationale: पौलुस के इस प्रसंग में शब्द एकत्रित मसीही समुदाय को दर्शाता है। ‘कलीसिया’ प्रचलित और संक्षिप्त हिन्दी पद है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: 1 कुरिन्थियों 12–14 में γλώσσῃ का आशय
  choice: मुख्य पाठ में ‘अन्य भाषा’ रखते हुए आत्मा-प्रदत्त भाषा-वाणी की ओर प्रसंगगत संकेत
  alternative: साधारण विदेशी भाषा; अथवा उन्मत्त/परमानंद की अस्पष्ट वाणी
  rationale: निकटवर्ती प्रसंग आत्मिक वरदान और सामुदायिक आराधना में उसके उपयोग से संबंधित है। अनुवाद घटना की सटीक प्रकृति को किसी एक साम्प्रदायिक व्याख्या से निर्धारित नहीं करता।
- issue: οἰκοδομεῖ के रूपक का स्वरूप
  choice: ‘दृढ़ करता है’ द्वारा आत्मिक लाभ या उन्नति व्यक्त करना
  alternative: ‘निर्माण करता है’ अथवा ‘उन्नति करता है’
  rationale: शाब्दिक निर्माण-भाषा हिन्दी में व्यक्ति के साथ अस्वाभाविक लग सकती है। ‘दृढ़ करता है’ आशय स्पष्ट करता है, जबकि पादटिप्पणी मूल रूपक को सामने रखती है।
- issue: एकवचन पुल्लिंग प्रतिनिधिक रूप
  choice: ‘जो ... वह स्वयं को’
  alternative: स्पष्टतः पुल्लिंग ‘पुरुष ... अपने आपको’
  rationale: यूनानी रूप व्याकरणतः पुल्लिंग एकवचन है, पर सामान्य सिद्धांत व्यक्त करता है। हिन्दी का ‘जो ... स्वयं’ स्रोत की एकवचनता और आत्मवाचकता बचाता है, बिना ऐसा जैविक लिंग आरोपित किए जो आशय में प्रमुख नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। समानांतर वाक्य-संरचना सुरक्षित रखी गई है। ‘अन्य भाषा’ सामान्य पाठक के लिए ‘जीभ’ से अधिक स्वाभाविक है, और पादटिप्पणी मूल शब्द की व्याख्यात्मक अनिश्चितता बनाए रखती है।
