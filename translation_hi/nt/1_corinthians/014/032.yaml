  footnotes:
  - marker: a
    text: या, “भविष्यवक्ताओं से संबंधित आत्माएँ भविष्यवक्ताओं के अधीन रहती हैं।” यह वाक्यांश भविष्यवाणी की प्रेरणाओं या भविष्यवक्ताओं से जुड़ी आत्मिक गतिविधि की ओर संकेत कर सकता है और भविष्यवाणी करते समय आत्म-संयम पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह पिछले कथन से एक और सहायक बात जोड़ने वाला सामान्य संयोजक है।
- source_word: πνεύματα
  choice: आत्माएँ
  rationale: बहुवचन संज्ञा का सीधा अर्थ यहाँ ‘आत्माएँ’ है। संदर्भ में यह भविष्यवाणी से जुड़ी आत्मिक प्रेरणा या गतिविधि की ओर संकेत कर सकती है, पर मुख्य पाठ में इसे ‘वचन’ या ‘वरदान’ कहना अर्थ को आवश्यकता से अधिक निश्चित कर देगा।
- source_word: προφητῶν
  choice: भविष्यवक्ताओं की
  rationale: संबंधकारक बहुवचन को स्वाभाविक हिन्दी में अधिकार अथवा संबद्धता व्यक्त करने वाले ‘की’ से प्रस्तुत किया गया है।
- source_word: προφήταις
  choice: भविष्यवक्ताओं के अधीन
  rationale: ὑποτάσσεται के साथ प्रयुक्त संप्रदान कारक अधीनता का संबंध व्यक्त करता है; यह अनुवाद उसी संबंध को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: ὑποτάσσεται
  choice: अधीन रहती हैं
  rationale: नपुंसकलिंग बहुवचन कर्ता के साथ यूनानी क्रिया एकवचन है, जबकि हिन्दी में बहुवचन के अनुसार ‘रहती हैं’ स्वाभाविक है। यह नियंत्रण और व्यवस्था का भाव रखता है, बिना अर्थ को अनावश्यक रूप से विस्तृत किए।
theological_decisions:
- issue: ‘भविष्यवक्ताओं की आत्माएँ’ और भविष्यवाणी पर नियंत्रण का अर्थ
  choice: मुख्य पाठ अस्पष्ट अभिव्यक्ति ‘भविष्यवक्ताओं की आत्माएँ’ को बनाए रखता है और बताता है कि वे भविष्यवक्ताओं के अधीन रहती हैं।
  alternative: इसे सीधे ‘भविष्यवाणी की प्रेरणाएँ भविष्यवक्ताओं के नियंत्रण में रहती हैं’ कहना; अथवा इसे भविष्यवक्ताओं की मानवीय आत्माओं का दूसरे भविष्यवक्ताओं के अधीन होना समझना।
  rationale: सभा में व्यवस्थित भविष्यवाणी के निकट संदर्भ में यह कथन आत्म-संयम और उत्तरदायित्व पर बल देता है। फिर भी यूनानी वाक्यांश यह पूरी तरह स्पष्ट नहीं करता कि ‘आत्माएँ’ मानवीय आत्माएँ हैं, भविष्यवाणी की प्रेरणाएँ हैं, या भविष्यवक्ताओं से जुड़ी आत्मिक गतिविधि; इसलिए मुख्य पाठ उस तनाव को सुरक्षित रखता है और पादटिप्पणी संभावित आशय बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मूल वाक्य की संरचना के निकट अनुवाद। ‘अधीन रहती हैं’ सामान्य पाठक के लिए स्वाभाविक है और आदेश, नियंत्रण तथा व्यवस्था के भाव को व्यक्त करता है।
