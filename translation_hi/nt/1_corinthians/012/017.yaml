  yaml_path: translation/nt/1_corinthians/012/017.yaml
  text: If the whole body were an eye[a], where would the hearing be? If the whole were hearing, where would the sense of smell be?
translation:
  language: hi
  text: यदि सारा शरीर केवल आँख होता, तो सुनने की शक्ति कहाँ होती? यदि सारा शरीर सुनने की शक्ति ही होता, तो सूँघने की शक्ति कहाँ होती?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅλον τὸ σῶμα
  choice: पूरा शरीर
  rationale: यह पदबंध स्वाभाविक हिन्दी में समूचे शरीर को व्यक्त करता है और पौलुस की काल्पनिक देह-उपमा को बनाए रखता है।
- source_word: ὀφθαλμός
  choice: आँख
  rationale: एकवचन संज्ञा शरीर के एक अंग की पौलुस की उपमा को सीधे और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ποῦ
  choice: कहाँ होती?
  rationale: काल्पनिक शर्त के संदर्भ में हिन्दी का संभावनार्थक रूप यूनानी प्रश्न के आशय को स्वाभाविक रूप से प्रकट करता है।
- source_word: ἀκοή
  choice: सुनने की शक्ति
  rationale: यह शब्द शारीरिक अंग ‘कान’ के बजाय सुनने की क्षमता को दर्शाता है। ‘शक्ति’ सामान्य पाठक के लिए स्पष्ट है और दोनों प्रयोगों में स्रोत का कार्यात्मक अर्थ बनाए रखती है।
- source_word: ὅλον
  choice: पूरा शरीर
  rationale: दूसरी शर्त में यूनानी पाठ ‘शरीर’ को लुप्त रखता है, पर हिन्दी में केवल ‘पूरा’ कहना अस्वाभाविक और अस्पष्ट होता; इसलिए संदर्भित संज्ञा दोहराई गई है।
- source_word: ὄσφρησις
  choice: सूँघने की शक्ति
  rationale: यह शारीरिक अंग ‘नाक’ नहीं, बल्कि सूँघने की क्षमता को व्यक्त करता है और ‘सुनने की शक्ति’ के समानांतर रहता है।
theological_decisions:
- issue: देह के अंगों की उपमा में इंद्रिय-क्षमताएँ या शारीरिक अंग
  choice: ἀκοή और ὄσφρησις को ‘सुनने की शक्ति’ और ‘सूँघने की शक्ति’ के रूप में अनूदित किया गया है।
  alternative: 'अधिक मूर्त और बोलचाल की समानांतर अभिव्यक्ति: ‘कान कहाँ होता?... नाक कहाँ होती?’'
  rationale: यूनानी शब्द कान और नाक के शारीरिक अंगों के बजाय सुनने और सूँघने की क्षमताओं को नाम देते हैं। कार्यात्मक भाषा बनाए रखने से स्रोत-पाठ का रूप और उसकी उपमा का तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सहज शैली अपनाई गई है। ‘ही’ से पूरे शरीर के केवल एक अंग या एक ही क्षमता बन जाने की काल्पनिक अतिशयोक्ति स्पष्ट होती है।
