translation:
  language: hi
  text: तुम सब मसीह की देह हो और अलग-अलग उसके अंग हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी पदबंध का अधिक शाब्दिक रूप ‘और भाग के अनुसार अंग’ हो सकता है; यहाँ भाव यह है कि तुममें से प्रत्येक उस एक देह का अंग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: तुम सब
  rationale: स्पष्ट बहुवचन सर्वनाम को ‘तुम सब’ से व्यक्त किया गया है; इससे कलीसिया को सामूहिक रूप से संबोधित करने का बल भी बना रहता है।
- source_word: δέ
  choice: अलग शब्द के रूप में व्यक्त नहीं
  rationale: यहाँ δέ मुख्यतः पिछले देह-रूपक से सीधे पाठकों पर उसके अनुप्रयोग की ओर संक्रमण कराता है। हिंदी में वाक्य की स्थिति और ‘तुम सब’ पर बल इस संक्रमण को स्वाभाविक रूप से व्यक्त करते हैं; ‘परन्तु’ अनावश्यक विरोध और ‘अब’ कालगत अर्थ का आभास दे सकता है।
- source_word: σῶμα Χριστοῦ
  choice: मसीह की देह
  rationale: यह स्वाभाविक हिंदी में संबंधवाचक पदबंध है और कलीसिया की मसीह से देह-संबंधी पहचान को स्पष्ट रखते हुए मूल रूपक को बनाए रखता है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός यहाँ मसीही उपाधि के रूप में प्रयुक्त है। हिंदी का प्रचलित ‘मसीह’ उसके उपाधिगत अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: μέλη
  choice: अंग
  rationale: देह के रूपक में ‘अंग’ शारीरिक अवयवों को सीधे व्यक्त करता है और हिंदी में सामूहिक देह के भीतर प्रत्येक व्यक्ति की भूमिका के लिए भी स्वाभाविक है।
- source_word: ἐκ μέρους
  choice: अलग-अलग
  rationale: 'इस संदर्भ में पदबंध का भाव वितरणात्मक है: वे सामूहिक रूप से एक देह हैं और प्रत्येक व्यक्ति उसका अंग है। ‘अलग-अलग’ इस अर्थ को सामान्य हिंदी में व्यक्त करता है, बिना ‘कुछ अंश तक’ का भ्रामक भाव दिए।'
theological_decisions:
- issue: पौलुस के कलीसिया-संबंधी कथन में Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यहाँ शब्द उपाधि का अर्थ रखता है; ‘मसीह’ हिंदी में स्थापित रूप है और मूल के अभिषिक्त जन संबंधी आशय को सुरक्षित रखता है।
- issue: ἐκ μέρους का अर्थ
  choice: 'वितरणात्मक अर्थ: ‘अलग-अलग उसके अंग’'
  alternative: ‘अपने-अपने भाग के अनुसार अंग’ अथवा अधिक शाब्दिक ‘भाग की ओर से अंग’
  rationale: निकटवर्ती संदर्भ एक देह और अनेक अंगों के बीच सामूहिक एकता तथा व्यक्तिगत सहभागिता दोनों पर बल देता है। चुना हुआ रूप इसी तनाव को स्पष्ट रखता है और अपूर्ण सदस्यता का अर्थ नहीं देता।
- issue: ‘उसके’ का स्पष्ट किया जाना
  choice: संदर्भगत संबंध स्पष्ट करने के लिए ‘उसके’
  alternative: ‘और अलग-अलग अंग हो’
  rationale: यूनानी में संबंधसूचक सर्वनाम स्पष्ट रूप से नहीं है, पर हिंदी में ‘उसके’ यह बताता है कि अंग उसी देह के हैं। यह नया धर्मवैज्ञानिक दावा नहीं जोड़ता, बल्कि देह-रूपक में निहित संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी; ‘तुम सब’ सामुदायिक बहुवचन को स्पष्ट करता है। ‘देह’ और ‘अंग’ बाइबिलीय रूपक की गरिमा बनाए रखते हुए सामान्य पाठक के लिए सहज हैं। वाक्य संक्षिप्त रखा गया है और मूल की सामूहिक पहचान तथा व्यक्तिगत सहभागिता दोनों सुरक्षित हैं।
