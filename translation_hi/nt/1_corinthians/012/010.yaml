source:
  edition: SBLGNT
  text: ⸀ἄλλῳ ἐνεργήματα δυνάμεων, ⸁ἄλλῳ προφητεία, ⸀1ἄλλῳ διακρίσεις πνευμάτων, ⸀ἑτέρῳ γένη γλωσσῶν, ⸀2ἄλλῳ ἑρμηνεία γλωσσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/010.yaml
  text: to another[a], workings of miracles; to another, prophecy; to another, discernments of spirits; to another, kinds of tongues; to another[b], interpretation of tongues.
translation:
  language: hi
  text: किसी और को सामर्थ्य के कार्य[a], किसी और को भविष्यवाणी, किसी और को आत्माओं की परख, किसी दूसरे को भाषाओं के विभिन्न प्रकार[b], और किसी और को भाषाओं की व्याख्या।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चमत्कारी कार्य,” अथवा “शक्तियों के कार्य” या “सामर्थ्यशाली कार्य।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का अर्थ “जीभें” या “भाषाएँ” हो सकता है। “भाषाओं” अनुवाद से इस आत्मिक वरदान के ठीक स्वरूप को निश्चित नहीं किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνεργήματα δυνάμεων
  choice: सामर्थ्य के कार्य
  rationale: यह पदबंध परमेश्वर की सामर्थ्य से होने वाले प्रभावशाली या चमत्कारी कार्यों को सूचित करता है। यह अनुवाद यूनानी की बनावट और उसके अर्थ-विस्तार को बनाए रखता है; स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: προφητεία
  choice: भविष्यवाणी
  rationale: यह इस आत्मिक वरदान के लिए प्रचलित, संक्षिप्त और स्वाभाविक हिन्दी शब्द है; इसे केवल भविष्य बताने तक सीमित नहीं किया गया है।
- source_word: διακρίσεις πνευμάτων
  choice: आत्माओं को परखने की क्षमताएँ
  rationale: बहुवचन διακρίσεις को हिन्दी में स्वाभाविक रूप से व्यक्त करने के लिए ‘क्षमताएँ’ रखा गया है। ‘आत्माओं’ को व्यापक रखा गया है और उनके स्वरूप या स्रोत को अनुवाद में निश्चित नहीं किया गया।
- source_word: γένη γλωσσῶν
  choice: तरह-तरह की भाषाएँ बोलना
  rationale: γένη का अर्थ विभिन्न प्रकार है। हिन्दी में केवल ‘जीभें’ कहना शारीरिक अंग का भ्रामक अर्थ देगा, इसलिए सन्दर्भानुकूल ‘भाषाएँ बोलना’ रखा गया है और यूनानी शब्द की व्यापकता पादटिप्पणी में स्पष्ट की गई है।
- source_word: ἑρμηνεία γλωσσῶν
  choice: उन भाषाओं का अर्थ बताना
  rationale: ἑρμηνεία का आशय कही गई बात को समझने योग्य बनाना है। ‘अर्थ बताना’ आधुनिक हिन्दी में सहज है और केवल शब्दशः अनुवाद का अर्थ आरोपित नहीं करता।
- source_word: ἄλλῳ / ἑτέρῳ
  choice: किसी और को / किसी दूसरे को
  rationale: दोनों शब्द वरदानों के अलग-अलग व्यक्तियों में बाँटे जाने को दिखाते हैं। हल्का शैलीगत परिवर्तन यूनानी के परिवर्तन को दर्शाता है, पर कोई कठोर अर्थभेद नहीं बनाता।
theological_decisions:
- issue: δυνάμεων का स्वरूप
  choice: सामर्थ्य के कार्य
  alternative: चमत्कार / सामर्थ्यशाली कार्य
  rationale: सन्दर्भ में चमत्कारी कार्य सम्भावित हैं, फिर भी अधिक मूलानुरूप पदबंध अर्थ को केवल ‘चमत्कार’ तक सीमित नहीं करता।
- issue: γλωσσῶν का अर्थ
  choice: भाषाएँ
  alternative: अन्य भाषाएँ / जीभें / विशेष प्रकार की वाणी
  rationale: यूनानी शब्द जीभ और भाषा दोनों के लिए आ सकता है। स्वाभाविक हिन्दी के लिए ‘भाषाएँ’ चुना गया है, जबकि इस आत्मिक वरदान के ठीक स्वरूप को पादटिप्पणी में खुला रखा गया है।
- issue: πνευμάτων का सन्दर्भ
  choice: आत्माओं
  alternative: आत्मिक कथन / कथनों के पीछे की आत्माएँ / मानवीय या दुष्ट आत्माएँ
  rationale: यूनानी पाठ आत्माओं की पहचान या प्रकार निश्चित नहीं करता, इसलिए अनुवाद भी इसे व्यापक रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सूची की दोहरावपूर्ण संरचना बनाए रखी गई है। ‘जीभें’ से हिन्दी में उत्पन्न होने वाले शारीरिक-अंग के भ्रम से बचते हुए γλῶσσα की व्याख्यात्मक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
