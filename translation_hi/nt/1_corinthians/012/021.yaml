id: 1CO.12.21
reference: 1 Corinthians 12:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί· Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν· Χρείαν ὑμῶν οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/021.yaml
  text: But the eye cannot say to the hand[a], ‘I have no need of you,’ or again the head to the feet, ‘I have no need of you.’
translation:
  language: hi
  text: पर आँख हाथ से यह नहीं कह सकती, “मुझे तुम्हारी ज़रूरत नहीं है,” या फिर सिर पैरों से, “मुझे तुम सबकी[a] ज़रूरत नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ ‘तुम’ बहुवचन है और ‘पैरों’ को संबोधित करता है।
    reason: मूल भाषा में पहले कथन के एकवचन और दूसरे कथन के बहुवचन का अंतर स्पष्ट करने के लिए।
lexical_decisions:
- source_word: οὐ δύναται
  choice: नहीं कह सकती
  rationale: δύναται और उसके पूरक εἰπεῖν को स्वाभाविक हिन्दी में साथ रखकर असमर्थता का भाव सुरक्षित किया गया है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले प्रसंग के साथ विरोधात्मक संबंध दिखाता है और आधुनिक हिन्दी में सहज है।
- source_word: ὁ ὀφθαλμός
  choice: आँख
  rationale: पौलुस के शरीर-संबंधी रूपक को ज्यों का त्यों रखा गया है।
- source_word: τῇ χειρί
  choice: हाथ से
  rationale: हिन्दी में ‘किसी से कहना’ दत्तिव अप्रत्यक्ष कर्म का स्वाभाविक रूप है और शरीर का रूपक सुरक्षित रहता है।
- source_word: Χρείαν σου οὐκ ἔχω
  choice: मुझे तुम्हारी ज़रूरत नहीं है
  rationale: χρεία के ‘ज़रूरत’ अर्थ को साधारण, स्पष्ट और वर्तमान हिन्दी में व्यक्त करता है; यह ‘तुम मेरे किसी काम के नहीं’ जैसी अधिक तिरस्कारपूर्ण अभिव्यक्ति से बचता है।
- source_word: ἢ πάλιν
  choice: या फिर
  rationale: दूसरे समानांतर उदाहरण को संक्षेप और स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: ἡ κεφαλή
  choice: सिर
  rationale: मूल शरीर-रूपक का सीधा और सामान्य हिन्दी रूप।
- source_word: τοῖς ποσίν
  choice: पैरों से
  rationale: बहुवचन और अप्रत्यक्ष संबोधन दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ὑμῶν
  choice: तुम सबकी
  rationale: यूनानी बहुवचन को हिन्दी में स्पष्ट करता है और पहले कथन के एकवचन σου से उसका अंतर बनाए रखता है।
theological_decisions:
- issue: कलीसिया की परस्पर निर्भरता के लिए शरीर का रूपक
  choice: शरीर के अंगों की शाब्दिक छवि को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
  alternative: मुख्य पाठ में स्पष्ट कर देना कि अंग कलीसिया के सदस्यों को दर्शाते हैं।
  rationale: पौलुस अपना धर्मवैचारिक बिंदु इसी रूपक के माध्यम से रखता है; मुख्य पाठ में उसकी व्याख्या जोड़ना अनुवाद की सीमा से आगे जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ज़रूरत’ सामान्य पाठक के लिए ‘आवश्यकता’ से अधिक स्वाभाविक है। ‘तुम सबकी’ बहुवचन को स्पष्ट करता है, जबकि संबोधन को अनावश्यक रूप से औपचारिक नहीं बनाता।
