  yaml_path: translation/nt/1_corinthians/012/011.yaml
  text: But one and the same Spirit works all these things[d][c][b][a], distributing to each one individually just as he wills.
translation:
  language: hi
  text: परन्तु इन सब बातों को वही एक आत्मा करता है[a], और अपनी इच्छा के अनुसार हर एक को अलग-अलग देता है[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उत्पन्न करता है” या “फलित करता है।”
    reason: lexical_alternative
  - marker: b
    text: या, “हर एक को उसका भाग देता है।”
    reason: lexical_alternative
  - marker: c
    text: या, “जैसा वह चुनता है।” यूनानी क्रिया इच्छा करने, चुनने या चाहने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: परन्तु इन सब बातों को
  rationale: πάντα ταῦτα पहले गिनाए गए सभी आत्मिक वरदानों/प्रकटीकरणों की समग्रता पर बल देता है; δέ को हल्के विरोध या संक्रमण के रूप में “परन्तु” से व्यक्त किया गया है।
- source_word: ἐνεργεῖ
  choice: कार्य में लाता है
  rationale: यह क्रिया सक्रिय संचालन और फलित करने, दोनों का भाव रखती है। “कार्य में लाता है” साधारण हिन्दी में स्वाभाविक है और कारण की रीति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τὸ ἓν καὶ τὸ αὐτὸ πνεῦμα
  choice: वही एक आत्मा
  rationale: यूनानी पदबंध विविध वरदानों के एक ही स्रोत होने पर बल देता है। “वही एक आत्मा” हिन्दी में पहचान और एकता दोनों को संक्षेप में व्यक्त करता है।
- source_word: διαιροῦν
  choice: बाँटता है
  rationale: सहभागी कृदन्त आत्मा के कार्य करने की रीति बताता है—वह अलग-अलग व्यक्तियों को अंश देता है। “बाँटता है” सहज हिन्दी है और सन्दर्भ में नकारात्मक विभाजन का अर्थ नहीं देता।
- source_word: ἰδίᾳ ἑκάστῳ
  choice: हर एक को अलग-अलग
  rationale: यह पद प्रत्येक व्यक्ति को व्यक्तिगत रूप से दिए जाने का वितरणात्मक भाव सुरक्षित रखता है।
- source_word: καθὼς βούλεται
  choice: अपनी इच्छा के अनुसार
  rationale: βούλεται इच्छा, चुनाव या अभिप्राय का बोध करा सकता है। “अपनी इच्छा के अनुसार” आत्मा की सचेत, व्यक्तिगत क्रियाशीलता व्यक्त करता है और हिन्दी में सर्वनाम दोहराने की आवश्यकता नहीं पड़ती।
theological_decisions:
- issue: πνεῦμα और βούλεται का कर्ता तथा आत्मा की व्यक्तिगत क्रियाशीलता
  choice: “वही एक आत्मा ... अपनी इच्छा के अनुसार”
  alternative: “वही एक आत्मा ... जैसा वह चुनता है” अथवा व्याकरणिक नपुंसकलिंग के अनुरूप निर्जीव ढंग से कहना
  rationale: यद्यपि πνεῦμα यूनानी में व्याकरणतः नपुंसकलिंग है, βούλεται आत्मा को इच्छा/चयन करने वाला कर्ता बताता है। हिन्दी में “अपनी इच्छा” इस व्यक्तिगत क्रियाशीलता को स्पष्ट रखता है, पर स्रोत से आगे कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। “वही एक आत्मा” विविध वरदानों के एक स्रोत पर मूल पाठ के बल को सुरक्षित रखता है; “अलग-अलग” व्यक्तिगत वितरण को स्पष्ट करता है।
