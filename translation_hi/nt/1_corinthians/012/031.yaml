base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/031.yaml
  text: But earnestly desire the greater gifts[b][a]. And I will show you a still more surpassing way.
translation:
  language: hi
  text: पर बड़े वरदानों की उत्कट अभिलाषा रखो।[a] और मैं तुम्हें इससे भी कहीं बढ़कर एक मार्ग दिखाता हूँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर तुम बड़े वरदानों की उत्कट अभिलाषा रखते हो।” यूनानी रूप ζηλοῦτε को इस प्रसंग में आज्ञार्थक या विधानार्थक, दोनों तरह से समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: 'परंपरागत अनुवाद: “एक और भी उत्तम मार्ग।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῦτε
  choice: उत्कट अभिलाषा रखो
  rationale: यह क्रिया प्रबल इच्छा और उत्सुकता व्यक्त करती है। मुख्य पाठ में आज्ञार्थक भाव लिया गया है; रूप की संभावित विधानार्थक व्याख्या पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: χαρίσματα
  choice: वरदानों
  rationale: यहाँ χάρισμα अनुग्रह से मिले वरदान को दर्शाता है। अध्याय का प्रसंग आत्मिक वरदानों का अर्थ स्पष्ट करता है, इसलिए मूल में न आए विशेषण को जोड़ना आवश्यक नहीं है।
- source_word: μείζονα
  choice: बड़े
  rationale: तुलनात्मक अर्थ ‘बड़े’ या ‘अधिक महत्त्वपूर्ण’ है। ‘बड़े’ संक्षिप्त है और महत्त्व की ठीक प्रकृति को प्रसंग से समझने देता है।
- source_word: καὶ ἔτι
  choice: और ... इससे भी
  rationale: यह संयोजन पिछली चर्चा से निरंतरता रखते हुए आगे कही जाने वाली बात की श्रेष्ठता को उभारता है।
- source_word: καθ’ ὑπερβολὴν
  choice: कहीं बढ़कर
  rationale: यह पदबंध असाधारण रूप से आगे निकल जाने या अत्यधिक श्रेष्ठ होने का भाव देता है। ‘कहीं बढ़कर’ आधुनिक हिन्दी में स्वाभाविक ढंग से वही तीव्रता व्यक्त करता है।
- source_word: ὁδὸν
  choice: मार्ग
  rationale: ὁδός यहाँ जीवन या आचरण के रूपकात्मक मार्ग को दर्शाता है और अगले अध्याय में प्रेम की चर्चा की भूमिका बाँधता है।
- source_word: δείκνυμι
  choice: दिखाता हूँ
  rationale: यूनानी वर्तमान काल को सीधे रखते हुए यह वाक्य उस मार्ग के तत्काल प्रस्तुत किए जाने का संकेत देता है।
theological_decisions:
- issue: ζηλοῦτε का वाक्य-भाव
  choice: 'आज्ञार्थक: ‘उत्कट अभिलाषा रखो’'
  alternative: 'विधानार्थक: ‘तुम उत्कट अभिलाषा रखते हो’'
  rationale: यह यूनानी रूप इस प्रसंग में आज्ञार्थक या विधानार्थक, दोनों समझा जा सकता है। अध्याय के उपदेशात्मक प्रवाह के कारण मुख्य पाठ में आज्ञार्थक अर्थ लिया गया है, पर वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
- issue: καθ’ ὑπερβολὴν द्वारा मार्ग की श्रेष्ठता
  choice: ‘इससे भी कहीं बढ़कर’
  alternative: ‘एक और भी उत्तम मार्ग’
  rationale: मुख्य पाठ असाधारण श्रेष्ठता की तीव्रता को उभारता है, जबकि पारंपरिक और वैध ‘उत्तम’ रूप पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वरदान’ तथा ‘मार्ग’ जैसे परिचित बाइबलीय शब्द मूल के अर्थ और रूपक को बनाए रखते हैं; वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए स्वाभाविक है।
