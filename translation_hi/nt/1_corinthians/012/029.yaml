  yaml_path: translation/nt/1_corinthians/012/029.yaml
  text: Not all are apostles[a], are they? Not all are prophets, are they? Not all are teachers, are they? Not all work miracles, do they?
translation:
  language: hi
  text: क्या सभी प्रेरित हैं? क्या सभी भविष्यद्वक्ता हैं? क्या सभी शिक्षक हैं? क्या सभी चमत्कार करते हैं?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “क्या सभी सामर्थ्य/शक्तियाँ हैं?” यहाँ “सामर्थ्य/शक्तियाँ” चमत्कारी कामों या ऐसे काम करनेवालों के लिए संक्षिप्त रूप में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: क्या सभी ... हैं?
  rationale: यह प्रश्नवाचक रचना प्रसंग में नकारात्मक उत्तर की अपेक्षा रखती है। हिन्दी में बार-बार आने वाला ‘क्या सभी...?’ स्वाभाविक अलंकारिक प्रश्न है और पाठक को अपेक्षित ‘नहीं’ की ओर ले जाता है।
- source_word: πάντες
  choice: सभी
  rationale: यह पूरे समुदाय की ओर संकेत करता है और चारों प्रश्नों में यूनानी की पुनरावृत्ति को बनाए रखता है।
- source_word: ἀπόστολοι
  choice: प्रेरित
  rationale: पौलुस की सेवकाई-सूची में यह मान्य भूमिका का प्रचलित और स्पष्ट हिन्दी पद है, केवल सामान्य ‘दूत’ नहीं।
- source_word: προφῆται
  choice: भविष्यद्वक्ता
  rationale: भविष्यद्वाणी करनेवालों के लिए यह मानक और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: διδάσκαλοι
  choice: शिक्षक
  rationale: कलीसियाई सेवकाई के प्रसंग में यह सरल और स्वाभाविक आधुनिक हिन्दी पर्याय है।
- source_word: δυνάμεις
  choice: सामर्थ्य के काम करनेवाले
  rationale: यूनानी बहुवचन संज्ञा का मूल अर्थ ‘सामर्थ्य’ या ‘सामर्थ्य के काम’ है। सूची में यह लाक्षणिक रूप से ऐसे काम करनेवालों को सूचित करती है; चुना हुआ रूप संज्ञात्मक समानांतरता और आशय दोनों को बचाता है।
theological_decisions:
- issue: भूमिकाओं की सूची में अंतिम पद δυνάμεις का अर्थ
  choice: क्या सभी सामर्थ्य के काम करनेवाले हैं?
  alternative: क्या सभी चमत्कार करते हैं?
  rationale: चुना हुआ पाठ यूनानी की संज्ञात्मक और बहुवचन अभिव्यक्ति के अधिक निकट रहते हुए स्पष्ट करता है कि बात सामर्थ्यपूर्ण कार्य करनेवालों की है। ‘चमत्कार करते हैं’ अधिक मुहावरेदार है, पर स्रोत के ‘सामर्थ्य’ वाले शब्द को कुछ हद तक संकुचित कर देता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। चार समान अलंकारिक प्रश्न यूनानी की लय और इस बल को बनाए रखते हैं कि शरीर के सभी सदस्यों की भूमिका या वरदान एक जैसा नहीं है।
