id: 1CO.12.8
reference: 1 Corinthians 12:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ᾧ μὲν γὰρ διὰ τοῦ πνεύματος δίδοται λόγος σοφίας, ἄλλῳ δὲ λόγος γνώσεως κατὰ τὸ αὐτὸ πνεῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/008.yaml
  text: For to one is given through the Spirit a message of wisdom[a], and to another a message of knowledge according to the same Spirit[c][b],
translation:
  language: hi
  text: क्योंकि एक को आत्मा के द्वारा बुद्धि का संदेश[a] दिया जाता है, और दूसरे को उसी आत्मा के अनुसार ज्ञान का संदेश[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बुद्धि का वचन’ अथवा ‘बुद्धि का कथन’।
    reason: lexical_alternative
  - marker: b
    text: या ‘ज्ञान का वचन’ अथवा ‘ज्ञान का कथन’।
    reason: lexical_alternative
  - marker: c
    text: या ‘उसी आत्मा के द्वारा’। यूनानी में यहाँ ‘आत्मा के द्वारा’ वाले पहले वाक्यांश से अलग पूर्वसर्ग है, जो सम्भवतः उसी एक आत्मा के अनुरूप होने पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ μὲν
  choice: एक को
  rationale: यह वितरणसूचक रचना समुदाय के एक व्यक्ति को दर्शाती है; आधुनिक हिन्दी में ‘एक को’ स्वाभाविक और संक्षिप्त है।
- source_word: διὰ τοῦ πνεύματος
  choice: आत्मा के द्वारा
  rationale: सम्बन्धकारक के साथ διά माध्यम अथवा कर्तृत्व व्यक्त करता है; यह अनुवाद उस अर्थ को बनाए रखता है।
- source_word: πνεύματος / πνεῦμα
  choice: आत्मा
  rationale: प्रसंग में वरदान बाँटने वाला पवित्र आत्मा अभिप्रेत है; हिन्दी में ‘आत्मा’ इसी सन्दर्भ में स्वाभाविक है।
- source_word: δίδοται
  choice: दिया जाता है
  rationale: वर्तमानकालीन कर्मवाच्य रूप को सहज हिन्दी में व्यक्त करता है और बताता है कि यह वरदान प्राप्त होता है, स्वयं उत्पन्न नहीं किया जाता।
- source_word: λόγος σοφίας
  choice: बुद्धि का संदेश
  rationale: λόγος यहाँ केवल एक शब्द नहीं, बल्कि कही गई बात, कथन अथवा संदेश हो सकता है; ‘संदेश’ आधुनिक पाठक के लिए स्पष्ट है, जबकि अन्य सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: ἄλλῳ
  choice: दूसरे को
  rationale: यह ᾧ μὲν के समानान्तर वितरणसूचक पद है और अलग व्यक्ति को दर्शाता है।
- source_word: λόγος γνώσεως
  choice: ज्ञान का संदेश
  rationale: λόγος σοφίας के समानान्तर होने के कारण λόγος का अनुवाद एकसमान रखा गया है; γνώσεως को ‘ज्ञान’ कहा गया है।
- source_word: κατὰ τὸ αὐτὸ πνεῦμα
  choice: उसी आत्मा के अनुसार
  rationale: κατά के अनुरूपता अथवा मानक-सूचक भाव को सुरक्षित रखता है और पहले प्रयुक्त διά से यूनानी पूर्वसर्ग का अन्तर भी दिखाता है।
theological_decisions:
- issue: ‘आत्मा’ का अभिप्राय
  choice: पवित्र आत्मा
  alternative: मनुष्य की आत्मा
  rationale: 1 कुरिन्थियों 12 का निकटवर्ती प्रसंग एक ही दिव्य आत्मा द्वारा विभिन्न वरदान दिए जाने की बात करता है। पद में ‘पवित्र’ शब्द जोड़े बिना संदर्भगत अभिप्राय बनाए रखा गया है।
- issue: वरदानों के सन्दर्भ में λόγος का अनुवाद
  choice: संदेश
  alternative: वचन / कथन
  rationale: ‘संदेश’ बोली या संप्रेषित की गई अर्थपूर्ण बात का सहज आधुनिक हिन्दी रूप है। ‘वचन’ और ‘कथन’ सम्भव विकल्प हैं, इसलिए उन्हें पादटिप्पणी में सुरक्षित रखा गया है।
- issue: κατά और διά के बीच भेद
  choice: उसी आत्मा के अनुसार
  alternative: उसी आत्मा के द्वारा
  rationale: मुख्य पाठ यूनानी के अलग-अलग पूर्वसर्गों के भेद को बनाए रखता है। फिर भी यहाँ साधन या स्रोत का अर्थ समझना सम्भव है, जिसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘बुद्धि’ और ‘ज्ञान’ का पारम्परिक किन्तु आज भी समझ में आने वाला भेद सुरक्षित है। ‘संदेश’ सहजता देता है, जबकि λόγος की व्यापकता पादटिप्पणियों में दर्शाई गई है।
