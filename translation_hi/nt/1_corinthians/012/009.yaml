  text: ⸀ἑτέρῳ πίστις ἐν τῷ αὐτῷ πνεύματι, ⸀ἄλλῳ χαρίσματα ἰαμάτων ἐν τῷ ⸀ἑνὶ πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/009.yaml
  text: to another[a], faith by the same Spirit; to another, gifts of healings by the one Spirit[b],
translation:
  language: hi
  text: किसी दूसरे को उसी आत्मा के द्वारा विश्वास[a], और किसी अन्य को एक ही आत्मा के द्वारा चंगाइयों के वरदान[b] दिए जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विश्वासयोग्यता’ अथवा ‘भरोसा’; यूनानी शब्द πίστις के ये अर्थ भी हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से ‘चंगाइयों के वरदान’; दोनों संज्ञाएँ बहुवचन में हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέρῳ
  choice: किसी दूसरे को
  rationale: दत्तिव एकवचन पिछले पद से चली आ रही वितरणात्मक रचना को आगे बढ़ाता है। ‘किसी दूसरे को’ स्वाभाविक हिन्दी है और ἑτέρῳ तथा ἄλλῳ के बीच आवश्यकता से अधिक अर्थभेद नहीं थोपता।
- source_word: πίστις
  choice: विश्वास
  rationale: यह πίστις का सामान्य और प्रसंगानुकूल हिन्दी रूप है। वरदानों के इस प्रसंग में यह आत्मा द्वारा दिया गया विशेष विश्वास सूचित कर सकता है, पर मूल पाठ उसका स्वरूप और संकीर्ण रूप से परिभाषित नहीं करता।
- source_word: ἐν τῷ αὐτῷ πνεύματι
  choice: उसी आत्मा के द्वारा
  rationale: ἐν के करणवाचक भाव को स्वाभाविक हिन्दी में ‘के द्वारा’ व्यक्त किया गया है; ‘उसी’ विविध वरदानों के एक ही स्रोत पर बल देता है।
- source_word: ἄλλῳ
  choice: किसी अन्य को
  rationale: यह भी वितरणात्मक दत्तिव है। ‘किसी अन्य को’ हिन्दी में स्वाभाविक रहते हुए अगले प्राप्तकर्ता को सूचित करता है।
- source_word: χαρίσματα
  choice: वरदान
  rationale: बहुवचन χαρίσματα अनुग्रह से दी गई क्षमताओं या दानों को बताता है। हिन्दी में ‘वरदान’ का रूप एकवचन और बहुवचन में समान होता है, किंतु ‘चंगाइयों के’ और बहुवचन क्रिया से यहाँ बहुवचन स्पष्ट है।
- source_word: ἰαμάτων
  choice: चंगाइयों
  rationale: यूनानी में यह बहुवचन है। ‘चंगाइयों’ उस संख्या को बनाए रखता है और केवल एक सामान्यीकृत ‘चंगा करने का वरदान’ कहकर पाठ की विशिष्टता को नहीं मिटाता।
- source_word: ἐν τῷ ἑνὶ πνεύματι
  choice: उसी एक आत्मा के द्वारा
  rationale: करणवाचक अर्थ के लिए ‘के द्वारा’ रखा गया है। ‘एक’ यूनानी ἑνί को सुरक्षित रखता है, जबकि ‘उसी’ हिन्दी में पूर्वोक्त आत्मा से संबंध स्पष्ट करता है।
theological_decisions:
- issue: वरदानों के प्रसंग में πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता; भरोसा
  rationale: मूल शब्द इन अर्थों की क्षमता रखता है। मुख्य पाठ में व्यापक और प्रचलित ‘विश्वास’ रखा गया है; इसे किसी विशेष सम्प्रदाय की करिश्माई शिक्षा के अनुसार अधिक संकीर्ण नहीं किया गया।
- issue: πνεύματι का संदर्भ
  choice: पवित्र आत्मा के संदर्भ में ‘आत्मा’
  alternative: मानवीय ‘आत्मा’ या ‘भाव’
  rationale: 1 कुरिन्थियों 12 के निकटवर्ती प्रसंग में वरदान देने वाला आत्मा पवित्र आत्मा है। इसलिए ‘आत्मा’ को सम्मानसूचक/व्यक्तिवाचक ढंग से रखा गया है, बिना मुख्य पाठ में ‘पवित्र’ शब्द जोड़ने के।
- issue: अलग-अलग वरदानों और एक ही आत्मा के बीच तनाव
  choice: ‘उसी आत्मा’ और ‘उसी एक आत्मा’ की भिन्न अभिव्यक्तियाँ बनाए रखना
  alternative: दोनों स्थानों पर केवल ‘उसी आत्मा’
  rationale: αὐτῷ और ἑνί की शब्दगत भिन्नता को समतल नहीं किया गया; इससे विविधता के बीच एकता पर पौलुस का बल बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद पिछले वाक्य की वितरणात्मक सूची को आगे बढ़ाता है; हिन्दी में स्पष्टता और पूर्णता के लिए अंत में निहित क्रिया ‘दिए जाते हैं’ व्यक्त की गई है। ‘चंगाइयों’ कुछ हद तक बाइबलीय प्रयोग है, पर ‘आरोग्य’ की अपेक्षा अधिक व्यापक रूप से समझा जाता है और यूनानी बहुवचन को सीधे सुरक्षित रखता है।
