source:
  edition: SBLGNT
  text: μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων; μὴ πάντες γλώσσαις λαλοῦσιν; μὴ πάντες διερμηνεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/030.yaml
  text: Not all have gifts of healings[a], do they? Not all speak in tongues, do they? Not all interpret[b], do they?
translation:
  language: hi
  text: सबके पास चंगाइयों के वरदान तो नहीं होते, है न?[a] सभी भाषाओं में तो नहीं बोलते, है न?[b] सभी उनकी व्याख्या तो नहीं करते, है न?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘चंगाइयों के वरदान’; यूनानी में ‘वरदान’ और ‘चंगाइयाँ’ दोनों बहुवचन हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘भाषाएँ बोलते हैं।’ इस प्रसंग में यह उस आत्मिक वरदान की ओर संकेत करता है जिसे प्रायः ‘अन्य भाषाओं में बोलना’ कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάντες
  choice: क्या सब... होते हैं? / क्या सभी...?
  rationale: μή से आरम्भ ये आलंकारिक प्रश्न नकारात्मक उत्तर की अपेक्षा रखते हैं। स्वाभाविक हिन्दी प्रश्न-रूप प्रसंग में स्पष्ट करता है कि सभी को एक ही वरदान नहीं मिला है।
- source_word: χαρίσματα
  choice: वरदान
  rationale: χάρισμα अनुग्रह से मिले सामर्थ्य या दान को सूचित करता है; कलीसियाई प्रसंग में ‘वरदान’ स्वाभाविक और परिचित हिन्दी है।
- source_word: ἰαμάτων
  choice: चंगाइयों
  rationale: यूनानी संज्ञा बहुवचन है। ‘चंगाइयों के वरदान’ मूल के असामान्य बहुवचन को बनाए रखता है और उसे केवल अमूर्त ‘चंगाई’ में नहीं बदलता।
- source_word: γλώσσαις λαλοῦσιν
  choice: अन्य भाषाओं में बोलते हैं
  rationale: γλῶσσα का मूल अर्थ ‘भाषा’ भी है और यहाँ आत्मिक वरदान से जुड़ी उस वाणी को सूचित करता है जिसे प्रायः ‘अन्य भाषा’ कहा जाता है। यह चयन घटना का स्वरूप अनावश्यक रूप से निर्धारित किए बिना आधुनिक हिन्दी में अर्थपूर्ण है।
- source_word: διερμηνεύουσιν
  choice: उनका अर्थ बताते हैं
  rationale: प्रसंग में क्रिया का आशय ऐसी वाणी को दूसरों के लिए बोधगम्य बनाना है। ‘अर्थ बताते हैं’ आधुनिक हिन्दी में ‘व्याख्या करते हैं’ की अपेक्षा अधिक सीधा है और ‘अनुवाद’ की संकीर्ण धारणा थोपने से बचता है।
theological_decisions:
- issue: μή वाले आलंकारिक प्रश्नों का स्वरूप
  choice: ऐसे प्रश्न जिनका अपेक्षित उत्तर ‘नहीं’ है
  alternative: तटस्थ प्रश्न जिनमें अपेक्षित उत्तर का कोई संकेत न हो
  rationale: यूनानी वाक्य-विन्यास नकारात्मक उत्तर की अपेक्षा करता है और एक देह में वरदानों की विविधता पर पौलुस के बल को सुरक्षित रखता है।
- issue: γλώσσαις की प्रकृति
  choice: ‘अन्य भाषाओं’ कहकर अभिव्यक्ति को प्रसंगगत आत्मिक वरदान से जोड़ना, पर उसकी सटीक भाषिक प्रकृति तय न करना
  alternative: ‘अनजानी भाषाओं’ या केवल ‘जबानों’ कहना
  rationale: मूल शब्द भाषा अथवा जिह्वा दोनों अर्थ रख सकता है। ‘अन्य भाषाएँ’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘अनजानी’ जैसा विशेषण मूल में नहीं है और अतिरिक्त निष्कर्ष जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण प्रश्नात्मक रूप अपनाया गया है। तीन समानांतर प्रश्नों की लय रखी गई है। ‘चंगाई’ उत्तर भारतीय मसीही प्रयोग में परिचित है; ‘उनका अर्थ बताते हैं’ सामान्य पाठक के लिए सहज है।
