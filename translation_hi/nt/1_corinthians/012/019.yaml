  text: यदि सब एक ही अंग होते, तो शरीर कहाँ होता?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ
  choice: यदि
  rationale: यह काल्पनिक शर्त प्रस्तुत करता है; आधुनिक मानक हिन्दी में ‘यदि’ गरिमापूर्ण और स्वाभाविक है।
- source_word: δὲ
  choice: —
  rationale: यहाँ यह हल्का संयोजक या विरोधसूचक अव्यय है। हिन्दी में शर्त और ‘तो’ से तर्क-संबंध स्पष्ट हो जाता है, इसलिए अलग शब्द जोड़ना आवश्यक नहीं है।
- source_word: ἦν
  choice: होते
  rationale: यह काल्पनिक स्थिति व्यक्त करता है। बहुवचन ‘वे सब’ के साथ ‘होते’ स्वाभाविक हिन्दी है।
- source_word: τὰ πάντα
  choice: वे सब
  rationale: संदर्भ में इसका संकेत शरीर के सभी अंगों की ओर है। ‘वे सब’ इस सामूहिक संदर्भ को स्पष्ट करता है, बिना ‘सब वस्तुएँ’ जैसा भ्रामक अर्थ दिए।
- source_word: ἓν μέλος
  choice: एक ही अंग
  rationale: ‘अंग’ शरीर के हिस्से का स्वाभाविक हिन्दी शब्द है और पौलुस के रूपक को बनाए रखता है; ‘ही’ सभी के एकमात्र प्रकार का अंग होने पर बल देता है।
- source_word: ποῦ τὸ σῶμα
  choice: शरीर कहाँ होता?
  rationale: शाब्दिक प्रश्नवाचक रूप को बनाए रखते हुए यह काल्पनिक परिस्थिति में शरीर के अस्तित्व पर उठे आलंकारिक प्रश्न को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: शरीर के रूपक की सीमा
  choice: केवल ‘शरीर’ कहना
  alternative: ‘मसीह का शरीर’ या ‘कलीसिया’ स्पष्ट रूप से जोड़ना
  rationale: इस पद के यूनानी पाठ में केवल ‘शरीर’ है। व्यापक संदर्भ कलीसिया की ओर संकेत करता है, पर अनुवाद में वह धार्मिक स्पष्टीकरण नहीं जोड़ा गया जो इस पद में प्रत्यक्षतः उपस्थित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक। ‘अंग’ और ‘शरीर’ मूल रूपक को स्पष्ट रखते हैं।
