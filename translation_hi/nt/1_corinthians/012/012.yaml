source:
  edition: SBLGNT
  text: Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη ⸂πολλὰ ἔχει⸃, πάντα δὲ τὰ μέλη τοῦ ⸀σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα, οὕτως καὶ ὁ Χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/012.yaml
  text: For just as the body is one and has many members[a], and all the members of the body, though they are many, are one body[b], so also is Messiah.
translation:
  language: hi
  text: क्योंकि जैसे शरीर एक है और उसके अंग अनेक हैं, और शरीर के सभी अंग अनेक होते हुए भी एक शरीर हैं, वैसे ही मसीह भी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में शाब्दिक रूप से, “वैसे ही मसीह भी”; आगे के पद स्पष्ट करते हैं कि अनेक अंग मिलकर एक शरीर हैं।
    reason: मूल की संक्षिप्त धार्मिक अभिव्यक्ति को बिना विस्तार दिए समझने में सहायता।
lexical_decisions:
- source_word: Καθάπερ γὰρ
  choice: क्योंकि जैसे
  rationale: καθάπερ की तुलना और γάρ के व्याख्यात्मक संबंध—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὸ σῶμα ἕν ἐστιν
  choice: शरीर एक है
  rationale: शरीर के रूपक और उसकी एकता को सीधे तथा स्पष्ट रूप में सुरक्षित रखता है।
- source_word: μέλη πολλὰ ἔχει
  choice: उसके अंग अनेक हैं
  rationale: μέλη के लिए ‘अंग’ आधुनिक हिन्दी में शारीरिक रूपक के भीतर ‘सदस्य’ से अधिक स्वाभाविक है और आगे सामुदायिक अर्थ ग्रहण कर सकता है।
- source_word: πάντα δὲ τὰ μέλη τοῦ σώματος
  choice: और शरीर के सभी अंग
  rationale: δέ यहाँ प्रबल विरोध के बजाय विचार की अगली कड़ी जोड़ता है; इसलिए ‘और’ उपयुक्त है।
- source_word: πολλὰ ὄντα
  choice: अनेक होते हुए भी
  rationale: कृदन्त पदबंध के रियायती भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἕν ἐστιν σῶμα
  choice: एक शरीर हैं
  rationale: बहुवचन कर्ता ‘सभी अंग’ के साथ हिन्दी की स्वाभाविक संगति रखते हुए एक देह होने का आशय सुरक्षित है।
- source_word: οὕτως καὶ ὁ Χριστός
  choice: वैसे ही मसीह भी है
  rationale: तुलनात्मक निष्कर्ष को संक्षिप्त रखता है और Χριστός को उपाधि-सूचक ‘मसीह’ के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ὁ Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / मसीह की देह / कलीसिया
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; हिन्दी में ‘मसीह’ उसके अभिषिक्त जन वाले अर्थ और प्रचलित बाइबलीय गरिमा को सुरक्षित रखता है।
- issue: ‘वैसे ही मसीह भी है’ का संक्षिप्त कथन
  choice: मूल की संक्षिप्त और चौंकाने वाली अभिव्यक्ति को यथावत रखना
  alternative: वैसे ही मसीह की देह भी है / वैसे ही कलीसिया भी है
  rationale: मूल पाठ ‘मसीह की देह’ या ‘कलीसिया’ जोड़कर बात स्पष्ट नहीं करता। विस्तार करने से वह व्याख्या पाठ में आ जाती जिसे आगे के पद स्वयं खोलते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण शैली। शरीर के रूपक में ‘अंग’ का लगातार प्रयोग किया गया है। ‘मसीह’ को किसी जोड़ी गई व्याख्या के बिना रखा गया है।
