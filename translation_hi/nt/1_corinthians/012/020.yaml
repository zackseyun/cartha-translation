  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: νῦν δὲ πολλὰ ⸀μὲν μέλη, ἓν δὲ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/020.yaml
  text: But as it is[a], there are many parts, yet one body.
translation:
  language: hi
  text: पर वास्तव में, अंग तो अनेक हैं, फिर भी शरीर एक ही है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν
  choice: वास्तव में
  rationale: यहाँ νῦν केवल समयसूचक ‘अब’ नहीं, बल्कि पिछले पद की काल्पनिक स्थिति के विपरीत वास्तविक स्थिति को सामने लाता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन से हल्का विरोध और तर्क की पुनः शुरुआत व्यक्त करता है।
- source_word: πολλὰ ... μέλη
  choice: अंग तो अनेक हैं
  rationale: शरीर के रूपक में μέλη के लिए ‘अंग’ स्वाभाविक, स्पष्ट और शारीरिक अर्थ को सुरक्षित रखने वाला हिन्दी शब्द है।
- source_word: μὲν ... δὲ
  choice: तो ... फिर भी
  rationale: यह युग्म अनेकता और एकता के बीच संतुलित विरोध को सहज हिन्दी में व्यक्त करता है।
- source_word: ἓν
  choice: एक ही
  rationale: ‘ही’ अनेक अंगों के विपरीत शरीर की एकता पर दिए गए बल को स्वाभाविक हिन्दी में उभारता है।
- source_word: σῶμα
  choice: शरीर
  rationale: यह पौलुस के विस्तृत शारीरिक रूपक और अनेकता में एकता—दोनों को बनाए रखता है।
theological_decisions:
- issue: शरीर के रूपक में μέλη का अनुवाद
  choice: अंग
  alternative: सदस्य
  rationale: ‘अंग’ मूल शारीरिक रूपक को आधुनिक हिन्दी में सीधे और स्वाभाविक रूप से व्यक्त करता है; ‘सदस्य’ कलीसियाई अर्थ को पहले से आरोपित कर सकता है, जबकि वह अर्थ प्रसंग के रूपक से स्वयं उभरता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘अंग’ शारीरिक रूपक को स्पष्ट रखता है, और ‘वास्तव में’ νῦν के प्रसंगगत, गैर-कालिक बल को व्यक्त करता है।
