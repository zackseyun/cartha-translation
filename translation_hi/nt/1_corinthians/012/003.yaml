source:
  edition: SBLGNT
  text: διὸ γνωρίζω ὑμῖν ὅτι οὐδεὶς ἐν πνεύματι θεοῦ λαλῶν λέγει· Ἀνάθεμα ⸀Ἰησοῦς, καὶ οὐδεὶς δύναται εἰπεῖν· ⸂Κύριος Ἰησοῦς⸃ εἰ μὴ ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/003.yaml
  text: Therefore I make known to you that no one speaking by the Spirit of God says[a], “Jesus is accursed,” and no one is able to say[b], “Jesus is Lord,” except by the Holy Spirit.
translation:
  language: hi
  text: इसलिए मैं तुम्हें बताता हूँ कि परमेश्वर की आत्मा से बोलने वाला कोई भी व्यक्ति नहीं कहता, “यीशु शापित है,”[a] और कोई भी व्यक्ति पवित्र आत्मा के द्वारा ही “यीशु प्रभु है”[b] कह सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु शापित हो”; यूनानी उद्घोष Ἀνάθεμα Ἰησοῦς का यह भी सम्भव अर्थ है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से, “प्रभु यीशु”; सन्दर्भ में इसका स्वीकारोक्तिपरक अर्थ है: “यीशु प्रभु है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले विचार से निकले निष्कर्ष को स्वाभाविक और स्पष्ट रूप से जोड़ता है।
- source_word: γνωρίζω ὑμῖν
  choice: मैं तुम्हें यह जानने देता हूँ
  rationale: क्रिया के ‘ज्ञात कराना’ अर्थ को निकटता से रखता है, बिना यूनानी में निहित न होने वाली इच्छा जोड़ने के।
- source_word: ἐν πνεύματι θεοῦ
  choice: परमेश्वर के आत्मा से
  rationale: ἐν को यहाँ आत्मा की प्रेरक agency के अर्थ में लिया गया है; ‘से’ सामान्य हिन्दी में इसे सहजता से व्यक्त करता है।
- source_word: Ἀνάθεμα Ἰησοῦς
  choice: यीशु शापित है
  rationale: क्रियारहित यूनानी उद्घोष में निहित योजक क्रिया को हिन्दी में स्पष्ट करता है और इसे आज्ञार्थक बनाए बिना ἀνάθεμα की कठोरता बनाए रखता है।
- source_word: δύναται εἰπεῖν
  choice: कह सकता है
  rationale: क्षमता या सम्भवता का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: Κύριος Ἰησοῦς
  choice: यीशु प्रभु है
  rationale: यहाँ पदबंध कथन की विषय-वस्तु है; हिन्दी में निहित योजक क्रिया जोड़कर उसके स्वीकारोक्तिपरक अर्थ को स्पष्ट किया गया है।
- source_word: εἰ μὴ ἐν πνεύματι ἁγίῳ
  choice: पवित्र आत्मा के द्वारा ही
  rationale: नकारात्मक वाक्य में एकमात्र अपवाद और पवित्र आत्मा की agency दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: Κύριος का मसीही स्वीकारोक्ति में अर्थ
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ सामान्य अधिकार और इस पौलुसी स्वीकारोक्ति के गहरे मसीह-विषयक भार दोनों को बनाए रखता है, पर पाठ से आगे कोई विशिष्ट सिद्धान्त नहीं जोड़ता।
- issue: “यीशु प्रभु है” कहने में आत्मा की भूमिका
  choice: वचन के अनुसार इस स्वीकारोक्ति की क्षमता को पवित्र आत्मा की agency से जोड़ा गया है
  alternative: इसे केवल शब्दों के उच्चारण या उद्धार के किसी विस्तृत सिद्धान्त तक सीमित करना
  rationale: अनुवाद पाठ के दावे को जस का तस रखता है और न तो इसे केवल बाहरी उच्चारण बनाता है, न पुनर्जन्म के किसी पूर्ण सिद्धान्त के रूप में विस्तार देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। ‘तुम्हें’ कलीसियाई समुदाय के लिए बहुवचन सम्बोधन है। मुख्य वाक्य में दूसरे खंड को स्वाभाविक हिन्दी के लिए सकारात्मक ‘के द्वारा ही ... कह सकता है’ रूप दिया गया है, जो यूनानी ‘कोई नहीं ... सिवाय’ के अर्थ को सुरक्षित रखता है।
