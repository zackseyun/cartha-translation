translation:
  language: hi
  text: क्योंकि शरीर एक अंग नहीं है, बल्कि अनेक अंगों वाला है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: क्योंकि
  rationale: यह पद पिछले तर्क का कारण और स्पष्टीकरण देता है। आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है; Καί को अलग से ‘और’ कहना यहाँ आवश्यक नहीं है।
- source_word: τὸ σῶμα
  choice: शरीर
  rationale: यह कर्ता का सीधा अनुवाद है और पौलुस के शरीर-रूपक को बिना उसकी व्याख्या मुख्य पाठ में जोड़े बनाए रखता है। हिन्दी में सामान्य कथन के साथ निश्चित अर्थ संदर्भ से स्पष्ट है, इसलिए अलग निश्चित उपपद की आवश्यकता नहीं।
- source_word: οὐκ ἔστιν
  choice: नहीं
  rationale: यूनानी निषेधयुक्त संयोजक क्रिया का हिन्दी में स्वाभाविक रूप ‘नहीं’ है; ‘से मिलकर नहीं बना’ कहना अर्थ को स्पष्ट तो करता, पर स्रोत से अतिरिक्त शब्द जोड़ता।
- source_word: ἓν μέλος
  choice: एक अंग
  rationale: ‘अंग’ μέλος का स्वाभाविक हिन्दी समतुल्य है और शरीर के रूपक को बनाए रखता है।
- source_word: ἀλλὰ πολλά
  choice: बल्कि बहुत-से अंग हैं
  rationale: πολλά में ‘अंग’ निहित है। हिन्दी में केवल ‘बल्कि बहुत-से’ कुछ अधूरा और अस्पष्ट लगता, इसलिए संज्ञा और क्रिया दोहराकर अर्थ स्वाभाविक तथा स्पष्ट किया गया है।
theological_decisions:
- issue: ‘शरीर’ का रूपकात्मक संदर्भ
  choice: मुख्य पाठ में केवल ‘शरीर’ रखा गया है।
  alternative: ‘मसीह का शरीर’ या ‘कलीसिया’
  rationale: आसपास का प्रसंग कलीसिया और मसीह के शरीर से संबंधित है, पर इस पद में केवल τὸ σῶμα है। विस्तारित पदबंध जोड़ना अनुवाद में प्रसंगगत व्याख्या मिला देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में सहज। ‘एक अंग नहीं, बल्कि बहुत-से अंग हैं’ यूनानी विरोध को स्पष्ट रखता है और शरीर-रूपक को सुरक्षित रखता है।
