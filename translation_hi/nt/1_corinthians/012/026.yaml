  source_fidelity: The draft accurately preserves the two conditional scenarios, the repeated body-member metaphor, shared suffering/rejoicing, and the contextual sense of δοξάζεται as receiving honor. The footnote appropriately retains “महिमा” as a lexical alternative without imposing it on the main text.
  naturalness: “दुःख पाते हैं” is understandable but is less idiomatic in modern Hindi for shared suffering. “दुःख उठाते हैं” is a natural and suitably broad expression. “किसी अंग का आदर किया जाता है” is also more natural and explicit than “एक अंग का आदर होता है.”
  terminology: “अंग” consistently and effectively conveys μέλος in the ongoing body metaphor. “आदर” is appropriate for δοξάζεται in context, and “आनन्दित होते हैं” adequately conveys shared rejoicing.
  issues:
  - severity: low
    issue: The wording “सभी अंग उसके साथ दुःख पाते हैं” is somewhat stiff in modern standard Hindi.
    rationale: Hindi normally expresses this shared response more naturally as “उसके साथ दुःख उठाते हैं,” while retaining the broad, non-specific sense of πάσχει and συμπάσχει.
  - severity: low
    issue: “एक अंग का आदर होता है” is less idiomatic than an explicit passive expression.
    rationale: “किसी अंग का आदर किया जाता है” more naturally expresses that a member receives honor, while respecting the Greek’s indefinite μέλος in the second clause.
