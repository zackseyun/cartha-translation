source:
  edition: SBLGNT
  text: καὶ ⸀εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη· εἴτε δοξάζεται ⸀μέλος, συγχαίρει πάντα τὰ μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/026.yaml
  text: And if one member suffers[a], all the members suffer with it; if a member is honored, all the members rejoice with it.
translation:
  language: hi
  text: और यदि एक अंग दुःख उठाता है, तो सभी अंग उसके साथ दुःख उठाते हैं; और यदि किसी अंग का आदर किया जाता है[a], तो सभी अंग उसके साथ आनन्दित होते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “महिमा मिलती है।” इस सन्दर्भ में सम्भवतः आशय यह है कि किसी अंग को आदर मिलता है और पूरा शरीर उसके आनन्द में सहभागी होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: यदि ... और यदि
  rationale: यह सहसंबंधी रचना दो समानांतर स्थितियाँ सामने रखती है। आधुनिक हिन्दी में “यदि ... और यदि” स्वाभाविक है और दोनों परिस्थितियों का बल बनाए रखता है।
- source_word: πάσχει
  choice: दुःख पाता है
  rationale: यह व्यापक पीड़ा या कष्ट को व्यक्त करता है और किसी एक प्रकार की शारीरिक पीड़ा तक अर्थ को सीमित नहीं करता।
- source_word: ἓν μέλος / μέλος
  choice: एक अंग
  rationale: अध्याय में शरीर का रूपक चल रहा है; “अंग” शारीरिक अर्थ को स्पष्ट रखते हुए मण्डली के व्यक्तियों की पारस्परिकता भी स्वाभाविक रूप से व्यक्त करता है। दूसरी उपवाक्य में यूनानी पाठ में संख्या-वाचक शब्द नहीं है, फिर भी हिन्दी में अनिश्चित एकवचन के लिए “एक अंग” स्वाभाविक है।
- source_word: συμπάσχει
  choice: उसके साथ दुःख पाते हैं
  rationale: संयुक्त क्रिया में किसी दूसरे के दुःख में सहभागी होने का भाव है; “उसके साथ” इस पारस्परिक एकजुटता को स्पष्ट करता है।
- source_word: πάντα τὰ μέλη
  choice: सभी अंग
  rationale: मूल पाठ में दोहराव है; दोनों उपवाक्यों में समान अनुवाद उस आलंकारिक समानता और सम्पूर्ण शरीर की सहभागिता को बनाए रखता है।
- source_word: δοξάζεται
  choice: आदर होता है
  rationale: इस पारस्परिक शारीरिक-सामुदायिक सन्दर्भ में क्रिया किसी अंग को सम्मान मिलने का भाव रखती है। यह चुनाव अनावश्यक रूप से पारलौकिक या तकनीकी धर्मवैज्ञानिक अर्थ आरोपित नहीं करता।
- source_word: συγχαίρει
  choice: उसके साथ आनन्दित होते हैं
  rationale: संयुक्त क्रिया साथ मिलकर आनन्द करने या किसी के आनन्द में सहभागी होने को व्यक्त करती है; यह अनुवाद उस साझा प्रतिक्रिया को सुरक्षित रखता है।
theological_decisions:
- issue: शरीर के रूपक में δοξάζεται का अर्थ
  choice: सामुदायिक आदर या सम्मान—“आदर होता है”
  alternative: “महिमा मिलती है” या “महिमान्वित होता है”
  rationale: तात्कालिक सन्दर्भ एक शरीर के अंगों की पारस्परिक देखभाल और सहभागिता का है। “आदर होता है” सम्भावित सामाजिक अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी मूल शब्द की अधिक शाब्दिक वैकल्पिक छाया को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “अंग” शरीर के रूपक को स्पष्ट रखता है, और दोनों उपवाक्यों की समानान्तर रचना तथा मूल पाठ का दोहराव सुरक्षित रखा गया है।
