reference: 1 Corinthians 12:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐὰν εἴπῃ τὸ οὖς· Ὅτι οὐκ εἰμὶ ὀφθαλμός, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος·
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/016.yaml
  text: And if the ear says[a], ‘Because I am not an eye, I am not of the body,’ it is not for this reason not of the body.
translation:
  language: hi
  text: और यदि कान कहे, “क्योंकि मैं आँख नहीं हूँ, इसलिए मैं शरीर का अंग नहीं हूँ,” तो इस कारण वह शरीर का अंग नहीं है—ऐसा नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह पिछले उदाहरण से इस समानांतर उदाहरण को जोड़ता है; सरल समुच्चयबोधक स्वाभाविक है।
- source_word: ἐὰν εἴπῃ
  choice: यदि ... कहे
  rationale: ἐὰν के साथ aorist subjunctive काल्पनिक स्थिति व्यक्त करता है; हिन्दी में ‘यदि ... कहे’ इसका सहज और सटीक रूप है।
- source_word: τὸ οὖς
  choice: कान
  rationale: साधारण शारीरिक अंग का नाम है और रूपक में इसे बोलते हुए मानवीकृत किया गया है।
- source_word: Ὅτι
  choice: क्योंकि
  rationale: यह कथन की विषयवस्तु आरम्भ करते हुए शिकायत का कारण बताता है।
- source_word: ὀφθαλμός
  choice: आँख
  rationale: मूल शारीरिक अर्थ को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἐκ τοῦ σώματος
  choice: शरीर का अंग
  rationale: इस प्रसंग में यूनानी पदबंध का अर्थ शरीर से संबंधित या उसका हिस्सा होना है; शाब्दिक ‘शरीर से’ हिन्दी में उत्पत्ति या अलगाव का भ्रामक अर्थ दे सकता है। दोनों occurrences में समान अभिव्यक्ति रखकर पुनरावृत्ति सुरक्षित की गई है।
- source_word: οὐ παρὰ τοῦτο
  choice: तो इस कारण ... ऐसा नहीं है
  rationale: यह पहले बताए कारण के आधार पर निकाले गए निष्कर्ष का खंडन करता है; हिन्दी वाक्य-विन्यास में उत्तरवर्ती ‘ऐसा नहीं है’ के साथ इसका तर्क स्पष्ट रहता है।
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: वह शरीर का अंग नहीं रह जाता—ऐसा नहीं है
  rationale: मूल के नकारात्मक प्रतिवाद को सुरक्षित रखते हुए हिन्दी में समझने योग्य बनाया गया है; ‘रह जाता’ यह बताता है कि कान के ऐसा कहने से उसकी वास्तविक सदस्यता बदल नहीं जाती।
theological_decisions:
- issue: शरीर-रूपक की अलंकारिक पुनरावृत्ति और नकारात्मक तर्क
  choice: ‘शरीर का अंग’ दोनों स्थानों पर दोहराकर मूल विचार रखा गया और निष्कर्ष को ‘ऐसा नहीं है’ से नकारा गया।
  alternative: 'अधिक मुहावरेदार रूप: ‘इससे वह शरीर का अंग होना बंद नहीं हो जाता।’'
  rationale: चुना गया पाठ सामान्य हिन्दी में स्पष्ट है, पर पौलुस के नकारात्मक तर्क और पुनरावृत्ति को पूरी तरह सकारात्मक व्याख्या में नहीं बदलता; साथ ही कलीसिया-संबंधी कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। उद्धरण में कान का मानवीकरण बनाए रखा गया है। ‘शरीर से’ की अस्वाभाविक तथा संभावित रूप से भ्रामक शाब्दिकता के बजाय प्रसंगानुकूल ‘शरीर का अंग’ अपनाया गया है।
