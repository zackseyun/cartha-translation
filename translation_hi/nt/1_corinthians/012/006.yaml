  text: καὶ διαιρέσεις ἐνεργημάτων εἰσίν, ⸂ὁ δὲ⸃ ⸀αὐτὸς θεός, ὁ ἐνεργῶν τὰ πάντα ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/006.yaml
  text: And there are varieties of workings[b][a], but it is the same God who works all things in all people.
translation:
  language: hi
  text: और कार्यों के अलग-अलग प्रकार हैं, पर वही परमेश्वर है, जो सब में सब कुछ करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαιρέσεις
  choice: रूप अलग-अलग
  rationale: यहाँ विभिन्न प्रकार या अभिव्यक्तियाँ अभिप्रेत हैं, न कि फूट या संघर्ष। यह सहज हिन्दी में विविधता को स्पष्ट करता है।
- source_word: ἐνεργημάτων
  choice: कार्यों
  rationale: यह दैवी सक्रियता और उसके प्रकट परिणामों को व्यक्त करता है तथा आगे ἐνεργῶν के साथ शब्दगत संबंध बनाए रखता है।
- source_word: ὁ δὲ αὐτὸς θεός
  choice: पर परमेश्वर वही है
  rationale: δέ का हल्का विरोध और αὐτός द्वारा एक ही परमेश्वर पर दिया गया बल दोनों सुरक्षित रहते हैं।
- source_word: ὁ ἐνεργῶν
  choice: जो ... करता है
  rationale: वर्तमान कृदन्त को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में रखा गया है और ἐνεργημάτων से उसका संबंध बना रहता है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: यूनानी वाक्यांश की व्यापकता को किसी अनावश्यक संकुचन के बिना स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν πᾶσιν
  choice: सब में
  rationale: यूनानी में संज्ञा स्पष्ट नहीं है; इसलिए हिन्दी में भी जानबूझकर व्यापक और संदर्भाधीन अभिव्यक्ति रखी गई है। निकट संदर्भ में इसका संकेत समुदाय के सभी सदस्यों की ओर है।
theological_decisions:
- issue: τὰ πάντα ἐν πᾶσιν में परमेश्वर के कार्य का दायरा
  choice: “सब में सब कुछ करता है”
  alternative: “सब लोगों में सब कुछ करता है”
  rationale: यह पाठ की व्यापकता और उसके वास्तविक व्याकरणिक खुलेपन को बनाए रखता है। संदर्भ लोगों, विशेषतः समुदाय के सदस्यों, की ओर संकेत करता है; फिर भी मूल में “लोग” संज्ञा स्पष्ट रूप से नहीं दी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज। “कार्यों” और “करता है” के द्वारा यूनानी ἐνεργημάτων/ἐνεργῶν की जानबूझकर की गई शब्द-पुनरावृत्ति यथासंभव सुरक्षित रखी गई है।
