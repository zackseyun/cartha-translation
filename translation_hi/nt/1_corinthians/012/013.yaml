source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ ⸀πάντες ἓν πνεῦμα ἐποτίσθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/013.yaml
  text: For indeed[a], in one Spirit we all were baptized into one body—whether Jews or Greeks[c][b], whether servants or free—and we all were given to drink one Spirit.
translation:
  language: hi
  text: क्योंकि वास्तव में, हम सबने एक ही आत्मा में[a] एक देह में सम्मिलित होने के लिए बपतिस्मा पाया—चाहे यहूदी हों या यूनानी, चाहे दास हों या स्वतंत्र—और हम सबको एक ही आत्मा पीने को दी गई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक ही आत्मा के द्वारा”; यूनानी पूर्वसर्ग क्षेत्र (“में”) अथवा साधन/कर्ता (“के द्वारा”)—दोनों का बोध करा सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “हम सबको एक ही आत्मा पिलाई गई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार प्रस्तुत करता है। हिन्दी में केवल ‘क्योंकि’ explanatory force को स्वाभाविक रूप से व्यक्त करता है; अलग से ‘निश्चय ही’ जोड़ना यहाँ बोझिल होता।
- source_word: ἐν ἑνὶ πνεύματι
  choice: एक ही आत्मा में
  rationale: ‘में’ यूनानी ἐν की निकट औपचारिक समानता रखते हुए क्षेत्र और साधन/माध्यम—दोनों संभावित अर्थों के बीच का तनाव बचाता है। ‘ही’ एकता पर बल देता है।
- source_word: ἡμεῖς πάντες
  choice: हम सब
  rationale: सर्वसमावेशी और बलयुक्त यूनानी पद का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: εἰς ἓν σῶμα ἐβαπτίσθημεν
  choice: एक देह में सम्मिलित होने के लिए बपतिस्मा पाया
  rationale: ‘बपतिस्मा पाया’ पौलुस के कलीसियाई प्रयोग का प्रचलित हिन्दी रूप है। विस्तृत पदबंध εἰς के लक्ष्य/परिणाम और एक देह में समावेश को स्पष्ट करता है, बिना बपतिस्मे की विधि निर्धारित किए।
- source_word: Ἰουδαῖοι ... Ἕλληνες
  choice: यहूदी ... यूनानी
  rationale: यह जातीय-धार्मिक विरोध सीधे मूल शब्दों को दर्शाता है; ‘गैर-यहूदी’ यूनानी पद की विशिष्टता को सामान्य बना देता।
- source_word: δοῦλοι ... ἐλεύθεροι
  choice: दास ... स्वतंत्र
  rationale: यह कानूनी और सामाजिक बंधन बनाम स्वतंत्र स्थिति का स्पष्ट विरोध है; ‘सेवक’ δοῦλοι की बंधुआ स्थिति को कमज़ोर कर देता।
- source_word: ἐποτίσθημεν
  choice: पिलाया गया
  rationale: ποτίζω के कर्मवाच्य ‘पीने को देना/पिलाना’ और सहभागी रूपक को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἓν πνεῦμα
  choice: एक ही आत्मा
  rationale: निकटवर्ती संदर्भ पवित्र आत्मा की ओर प्रबल संकेत करता है। देवनागरी में अंग्रेज़ी जैसी capitalization नहीं होती, इसलिए संदर्भ से पहचान होती है; ‘ही’ साझा एकता पर बल देता है।
theological_decisions:
- issue: ἐν ἑνὶ πνεύματι में क्षेत्र (‘में’) या साधन/कर्ता (‘के द्वारा’) का भाव
  choice: एक ही आत्मा में
  alternative: एक ही आत्मा के द्वारा
  rationale: यूनानी ἐν दोनों अर्थ-संभावनाएँ रख सकता है। मुख्य पाठ में निकटतर ‘में’ रखा गया और दूसरी संभावना पादटिप्पणी में दी गई, ताकि विवादित धार्मिक निष्कर्ष आरोपित न हो।
- issue: εἰς ἓν σῶμα का लक्ष्य या समावेशात्मक परिणाम
  choice: एक देह में सम्मिलित होने के लिए
  alternative: एक देह में
  rationale: εἰς एक देह में प्रवेश/समावेश के लक्ष्य अथवा परिणाम को दर्शाता है। हिन्दी का विस्तृत रूप इस संबंध को स्पष्ट करता है, पर यह नहीं ठहराता कि समावेश की प्रक्रिया को किस व्यवस्थित धार्मिक श्रेणी में रखा जाए।
- issue: दूसरे ἓν πνεῦμα का संकेत पवित्र आत्मा या साझा आत्मिक वास्तविकता की ओर
  choice: एक ही आत्मा
  alternative: एक ही आत्मिक पेय
  rationale: पहले खंड की समानांतरता और अध्याय का संदर्भ पवित्र आत्मा को सबसे संभावित संकेत बनाते हैं। फिर भी पीने का रूपक बनाए रखा गया है और उसे किसी संस्कार-विशेष से नहीं बाँधा गया।
- issue: δοῦλοι का सामाजिक अर्थ
  choice: दास
  alternative: सेवक
  rationale: ‘स्वतंत्र’ के साथ विरोध में बंधुआ सामाजिक स्थिति स्पष्ट है; इसलिए ‘दास’ अधिक सटीक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रूप। ‘बपतिस्मा’, ‘आत्मा’, ‘देह’ और ‘दास’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं। वाक्य की समानांतर संरचना और ‘हम सब/एक ही’ की पुनरावृत्ति पौलुस के एकता-संबंधी बल को बनाए रखती है।
