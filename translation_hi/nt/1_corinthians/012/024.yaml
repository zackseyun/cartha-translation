lexical_decisions:
- source_word: εὐσχήμονα
  choice: जो अंग देखने में शालीन हैं
  rationale: यह पदबंध बाहरी शालीनता और लोगों के सामने सहज रूप से प्रस्तुत किए जा सकने का भाव व्यक्त करता है तथा पिछले पद के कम शालीन अंगों के साथ विरोध बनाए रखता है। संदर्भ के आधार पर ‘अंग’ जोड़ा गया है।
- source_word: χρείαν ἔχει
  choice: उन्हें इसकी आवश्यकता नहीं
  rationale: यूनानी मुहावरे ‘आवश्यकता होना’ का सीधा और स्वाभाविक हिन्दी रूप है। ‘इसकी’ पिछले संदर्भ में बताए गए विशेष ध्यान या सज्जा की ओर संकेत करता है, उसे अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: συνεκέρασεν
  choice: एक साथ इस प्रकार जोड़ा
  rationale: क्रिया में अलग-अलग अंगों को मिलाकर एक समग्र शरीर बनाने का भाव है। यह चुनाव एकता और परमेश्वर की उद्देश्यपूर्ण रचना, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘मिला दिया’ को पाद-टिप्पणी में वैकल्पिक अर्थ के रूप में रखा गया है।
- source_word: σῶμα
  choice: शरीर
  rationale: पौलुस के केंद्रीय रूपक को बिना व्याख्यात्मक विस्तार के यथावत रखता है।
- source_word: τῷ ὑστεροῦντι
  choice: जिस अंग में आदर की कमी थी
  rationale: कृदन्त का अर्थ यहाँ किसी अंग के स्वभावतः हीन होने के बजाय आदर में कमी होना है। आगामी ‘आदर’ से निहित आशय को हिन्दी में स्पष्ट किया गया है।
- source_word: περισσοτέραν τιμήν
  choice: अधिक आदर
  rationale: तुलनात्मक बल को संक्षिप्त, सहज और आधुनिक हिन्दी में बनाए रखता है।
- source_word: δοὺς
  choice: आदर दिया
  rationale: मुख्य क्रिया के साथ परमेश्वर की रीति या साथ घटित कार्य को व्यक्त करता है। ‘कि ... दिया’ वाली रचना हिन्दी में परिणाम और उद्देश्यपूर्ण व्यवस्था को स्वाभाविक ढंग से जोड़ती है।
theological_decisions:
- issue: शरीर को व्यवस्थित करने में परमेश्वर के कार्य की व्याख्या
  choice: परमेश्वर ने शरीर के अंगों को उद्देश्यपूर्वक एक साथ जोड़ा और जिस अंग को आदर की कमी थी उसे अधिक आदर दिया।
  alternative: यह केवल प्राकृतिक मानव-शरीर के अंगों के भौतिक मिश्रण का वर्णन है, या यह केवल कलीसिया की प्रत्यक्ष व्याख्या है।
  rationale: निकट संदर्भ में मानव शरीर और मसीह की देह के रूप में समुदाय का विस्तृत रूपक साथ-साथ चलता है। अनुवाद परमेश्वर के उद्देश्यपूर्ण कार्य और आदर देने को व्यक्त करता है, पर रूपक को केवल शरीर-विज्ञान या केवल कलीसियाई अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल शैली अपनाई गई है। ‘देखने में शालीन’ बाहरी औचित्य का भाव रखता है और ‘हीन’ जैसे अंतर्निहित मूल्यांकन से बचता है। पद के अंत की अल्पविराम-रचना अगले पद से जारी वाक्य-संबंध को बनाए रखती है।
