base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/002.yaml
  text: You know that when you were Gentiles[a], you were led away to the mute idols[b], however you were led.
translation:
  language: hi
  text: तुम जानते हो कि जब तुम गैर-यहूदी[a] थे, तब जैसे भी तुम्हारी अगुवाई की जाती थी, तुम उन मूक मूर्तियों की ओर ले जाए जाते थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अन्यजाति’। यहाँ आशय उनकी पूर्व गैर-यहूदी, मूर्तिपूजक पृष्ठभूमि से है।
    reason: lexical_alternative
  - marker: b
    text: मूल यूनानी में ‘अगुवाई की जाती थी’ और ‘ले जाए जाते थे’ दोनों निष्क्रिय रूप हैं; चलाने वाले की पहचान नहीं बताई गई है।
    reason: source_form
lexical_decisions:
- source_word: οἴδατε
  choice: तुम जानते हो
  rationale: वर्तमान काल में साझा जानकारी की ओर पौलुस के सीधे संकेत को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔθνη
  choice: गैर-यहूदी
  rationale: यहाँ शब्द कुरिन्थियों की मसीह में आने से पहले की गैर-यहूदी, मूर्तिपूजक पृष्ठभूमि बताता है। ‘गैर-यहूदी’ आधुनिक पाठक के लिए ‘अन्यजाति’ से अधिक स्पष्ट है और ‘मूर्तिपूजक’ की अपेक्षा मूल शब्द की जातीय-धार्मिक व्यापकता को बेहतर बनाए रखता है।
- source_word: πρὸς τὰ εἴδωλα
  choice: मूर्तियों की ओर
  rationale: πρός के दिशासूचक भाव को स्पष्ट और स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: τὰ ἄφωνα
  choice: मूक
  rationale: मूर्तियों के बोल न सकने पर बल देता है और आसपास के प्रसंग में आत्मा से प्रेरित वाणी के साथ निहित विरोध को बिना विस्तार जोड़े बनाए रखता है।
- source_word: ὡς ἂν
  choice: जिस तरह भी
  rationale: इस पदबंध के अनिश्चित रीति-सूचक भाव—‘किसी भी तरह’ या ‘जैसे भी’—को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἤγεσθε
  choice: तुम्हें चलाया जाता
  rationale: अपूर्ण भूतकाल और कर्मवाच्य दोनों को बनाए रखता है; यह पूर्व प्रभाव के अधीन लगातार संचालित किए जाने का भाव देता है।
- source_word: ἀπαγόμενοι
  choice: बहकाकर ले जाए जाते थे
  rationale: दूर या गलत दिशा में ले जाए जाने के कर्मवाच्य भाव को स्पष्ट करता है और ἤγεσθε के साथ मूल की दोहरी गतिशील अभिव्यक्ति को यथासंभव बनाए रखता है।
theological_decisions:
- issue: ἔθνη से अभिप्रेत कुरिन्थियों की पूर्व पहचान
  choice: गैर-यहूदी
  alternative: अन्यजाति; मूर्तिपूजक
  rationale: ‘गैर-यहूदी’ जातीय और धार्मिक दोनों पृष्ठभूमियों को संकेतित करता है, पर मूल से अधिक तीखा नैतिक निर्णय नहीं जोड़ता।
- issue: मूक मूर्तियों और आत्मा-प्रेरित वाणी के बीच प्रसंगगत विरोध
  choice: मूक मूर्तियाँ
  alternative: बोल न सकने वाली मूर्तियाँ
  rationale: संक्षिप्त मूल अभिव्यक्ति और उसके अलंकारिक बल को बनाए रखता है, बिना विरोध की व्याख्या पद में जोड़ने के।
- issue: पूर्व प्रभाव के अधीन निष्क्रिय रूप से ले जाए जाने का भाव
  choice: जिस तरह भी तुम्हें चलाया जाता, तुम…बहकाकर ले जाए जाते थे
  alternative: जैसे भी अगुवाई होती, तुम…खींचे चले जाते थे
  rationale: दोनों यूनानी कर्मवाच्य क्रियारूपों और उनकी कुछ असामान्य पुनरुक्ति को सुरक्षित रखता है; यह तय नहीं करता कि चलाने वाला विशेष रूप से कौन था।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए सहज बहुवचन ‘तुम’ रखा गया है। भाषा dignified किंतु सामान्य पाठक के लिए स्पष्ट है। ‘मूक’ संक्षिप्त और प्रसंगानुकूल है, जबकि कर्मवाच्य संरचना मूल की धार्मिक अस्पष्टता को सुरक्षित रखती है।
