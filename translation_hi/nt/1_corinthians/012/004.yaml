lexical_decisions:
- source_word: Διαιρέσεις
  choice: तरह-तरह के
  rationale: यह शब्द एक ही व्यापक समूह के भीतर भिन्न प्रकारों या विविधता को दर्शाता है। इस संदर्भ में यह कलीसिया के भीतर फूट नहीं, बल्कि वरदानों की वैध विविधता बताता है।
- source_word: δὲ ... δὲ
  choice: तो ... पर
  rationale: पहला δέ विषय को आगे बढ़ाते हुए विविधता प्रस्तुत करता है, जबकि दूसरा δέ उस विविधता और आत्मा की एकता के बीच स्पष्ट विरोध दिखाता है। हिंदी की ‘तो ... पर’ संरचना इस संतुलन को स्वाभाविक रूप से व्यक्त करती है।
- source_word: χαρισμάτων
  choice: वरदान
  rationale: χάρισμα अनुग्रह से दिए गए उपहार, विशेषतः इस प्रसंग में आत्मिक सामर्थ्य या सेवाकार्य के वरदान, को सूचित करता है। ‘वरदान’ आधुनिक हिंदी में संक्षिप्त, प्रतिष्ठित और परिचित है।
- source_word: τὸ ... αὐτὸ
  choice: वही
  rationale: यह पदबंध विविध वरदानों के बावजूद आत्मा की समान पहचान और एकता पर बल देता है। ‘वही’ हिंदी में इस बल को सहजता से बनाए रखता है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: आस-पास का प्रसंग पवित्र आत्मा को वरदानों का स्रोत बताता है। ‘आत्मा’ उस संदर्भ को बिना अनावश्यक विस्तार के व्यक्त करता है।
theological_decisions:
- issue: πνεῦμα का संदर्भ
  choice: पवित्र आत्मा; मुख्य पाठ में ‘आत्मा’
  alternative: मानवीय आत्मा अथवा कोई निराकार आत्मिक शक्ति
  rationale: 1 कुरिन्थियों 12:3–11 में आत्मा को व्यक्तिगत और दिव्य कर्ता के रूप में दिखाया गया है, जो वरदान बाँटता है। इसलिए ‘आत्मा’ संदर्भतः पवित्र आत्मा को दर्शाता है, यद्यपि पद में ‘पवित्र’ शब्द जोड़कर विस्तार नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त और गरिमापूर्ण वाक्य। ‘तरह-तरह के’ सामान्य पाठक के लिए सहज है; ‘वरदान’ धार्मिक संदर्भ में परिचित है। ‘तो ... पर’ मूल के द्विगुण δέ द्वारा व्यक्त विविधता और एकता के संतुलन को स्वाभाविक हिंदी में रखता है।
