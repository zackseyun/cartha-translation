reference: 1 Corinthians 12:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν εἴπῃ ὁ πούς· Ὅτι οὐκ εἰμὶ χείρ, οὐκ εἰμὶ ἐκ τοῦ σώματος, οὐ παρὰ τοῦτο οὐκ ἔστιν ἐκ τοῦ σώματος;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/015.yaml
  text: If the foot says[a], “Because I am not a hand, I am not of the body,” it is not for this reason not of the body, is it?
translation:
  language: hi
  text: यदि पैर कहे, “क्योंकि मैं हाथ नहीं हूँ, इसलिए मैं शरीर का अंग[a] नहीं हूँ,” तो क्या इस कारण वह शरीर का अंग नहीं है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “मैं शरीर में से नहीं हूँ ... क्या इस कारण वह शरीर में से नहीं है?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπῃ
  choice: यदि ... कहे
  rationale: ἐάν के साथ aorist subjunctive एक सामान्य काल्पनिक स्थिति प्रस्तुत करता है। ‘यदि ... कहे’ आधुनिक हिन्दी में स्वाभाविक है और उसकी काल्पनिक शक्ति बनाए रखता है।
- source_word: ὁ πούς
  choice: पैर
  rationale: पौलुस के शरीर-रूपक के लिए शरीर के ठोस अंग का चित्र बनाए रखना आवश्यक है।
- source_word: Ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι पैर के कथन को कारणात्मक रूप में प्रस्तुत करता है; ‘क्योंकि’ उसकी शिकायत का तर्क स्पष्ट करता है।
- source_word: χείρ
  choice: हाथ
  rationale: ‘पैर’ के साथ मूल रूपक और विरोध को सीधे बनाए रखता है।
- source_word: ἐκ τοῦ σώματος
  choice: शरीर का अंग
  rationale: यूनानी मुहावरे का आशय शरीर से संबंध या उसमें सदस्यता है। हिन्दी में ‘शरीर में से’ अस्वाभाविक है, जबकि ‘शरीर का अंग’ अर्थ और रूपक दोनों को स्पष्ट तथा सहज रूप में व्यक्त करता है।
- source_word: οὐ παρὰ τοῦτο
  choice: तो क्या इस कारण
  rationale: यह उस बताए हुए कारण के आधार पर निकाले गए निष्कर्ष को नकारता है; हिन्दी का प्रश्नात्मक विन्यास पौलुस की तर्कपूर्ण चुनौती बनाए रखता है।
- source_word: οὐκ ἔστιν ἐκ τοῦ σώματος
  choice: वह शरीर का अंग नहीं है?
  rationale: यूनानी के दोहरे निषेध को शब्दशः दोहराने के बजाय हिन्दी का अलंकारिक प्रश्न वही अपेक्षित नकारात्मक उत्तर और तर्कगत बल स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: शरीर-रूपक में सदस्यता की अभिव्यक्ति और दोहरे निषेध का रूप
  choice: ἐκ τοῦ σώματος को ‘शरीर का अंग’ कहना और अंतिम खंड को अलंकारिक प्रश्न के रूप में रखना
  alternative: 'अधिक शब्दशः: ‘शरीर में से नहीं ... क्या इस कारण शरीर में से नहीं है?’'
  rationale: इस पद में कोई विशिष्ट सांप्रदायिक प्रश्न नहीं है। चुना हुआ रूप शरीर की सदस्यता का अर्थ स्पष्ट रखता है, पैर और हाथ के ठोस रूपक को बचाता है, और यूनानी अलंकारिक प्रश्न के अपेक्षित ‘नहीं’ उत्तर को बिना व्याख्यात्मक धर्मवैज्ञानिक विस्तार के व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘अंग’ सामान्य पाठक के लिए सदस्यता का भाव स्पष्ट करता है। उद्धरण में ‘इसलिए’ हिन्दी के ‘क्योंकि ... इसलिए’ संबंध को स्वाभाविक बनाता है, जबकि मुख्य वाक्य का अलंकारिक प्रश्न मूल तर्क को बनाए रखता है।
