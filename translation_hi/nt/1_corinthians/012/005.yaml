  text: And there are varieties of ministries[a], and the same Lord.
translation:
  language: hi
  text: और सेवाओं[a] के भिन्न-भिन्न प्रकार हैं, और प्रभु वही हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवाकार्यों’ अथवा ‘सेवा के रूपों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: διαιρέσεις
  choice: भिन्न-भिन्न प्रकार
  rationale: यहाँ विभिन्नता के बीच एकता पर बल है; यह चुनाव प्रकारों की विविधता बताता है, गुटबाज़ी या फूट नहीं।
- source_word: διακονιῶν
  choice: सेवाओं
  rationale: यह शब्द सेवा, सेवाकार्य या सेवा की भूमिका को व्यक्त कर सकता है। सामान्य हिंदी में ‘सेवाओं’ स्वाभाविक और व्यापक है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ὁ αὐτὸς
  choice: वही
  rationale: यह अलग-अलग सेवाओं के बीच प्रभु की निरंतर समानता और एकता पर बल देता है तथा पद 4–6 की समानांतर रचना के अनुकूल है।
- source_word: κύριος
  choice: प्रभु
  rationale: यह κύριος का स्वाभाविक, गरिमापूर्ण और धर्मवैज्ञानिक भार सुरक्षित रखने वाला हिंदी रूप है।
- source_word: καὶ
  choice: और
  rationale: यह पिछले पद से सरल योगात्मक संबंध तथा आसपास के वाक्यों की समानांतर संरचना बनाए रखता है।
- source_word: εἰσιν
  choice: हैं
  rationale: हिंदी वाक्य-विन्यास में अस्तित्वसूचक क्रिया को स्वाभाविक रूप से ‘हैं’ द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: 1 कुरिन्थियों 12:4–6 की त्रिक संरचना में ‘प्रभु’ का अभिप्राय
  choice: मूल पाठ की तरह केवल ‘प्रभु’ शीर्षक रखा गया है; संदर्भ में इसका संकेत संभवतः प्रभु यीशु की ओर है।
  alternative: इसे सामान्य रूप से प्रभु/परमेश्वर का उल्लेख मानना।
  rationale: निकटवर्ती संदर्भ में ‘वही आत्मा’, ‘वही प्रभु’ और ‘वही परमेश्वर’ की त्रिक संरचना है। अनुवाद व्याख्यात्मक विस्तार किए बिना मूल की धर्मवैज्ञानिक गुंजाइश सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और कलीसियाई संदर्भ में सहज। ‘पर’ से सेवाओं की विविधता और एक ही प्रभु के बीच निहित विरोधात्मक-संतुलन स्पष्ट होता है, जबकि मूल की समानांतरता बनी रहती है।
