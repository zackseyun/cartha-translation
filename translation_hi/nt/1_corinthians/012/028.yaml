  text: καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ⸀ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/028.yaml
  text: And God has appointed in the church first apostles[a], second prophets, third teachers, then miracles, then gifts of healings, helps, administrations[c][b], kinds of tongues.
translation:
  language: hi
  text: और परमेश्वर ने कलीसिया में कुछ को ठहराए हैं—पहले प्रेरित, दूसरे भविष्यद्वक्ता, तीसरे शिक्षक; फिर सामर्थ्य के काम[a], फिर चंगाइयों के वरदान, सहायताएँ, प्रशासन[b], और जिह्वाओं के भेद[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चमत्कार।” यूनानी शब्द का शाब्दिक भाव “सामर्थ्य के काम” है।
    reason: lexical_alternative
  - marker: b
    text: या, “मार्गदर्शन” अथवा “नेतृत्व के विभिन्न रूप।”
    reason: lexical_alternative
  - marker: c
    text: या, “भाषाओं के विभिन्न प्रकार।” यूनानी शब्द का अर्थ “जिह्वाएँ” या “भाषाएँ” हो सकता है; यहाँ उसकी सटीक प्रकृति को खुला रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔθετο
  choice: नियुक्त किया है
  rationale: यहाँ τίθημι का अर्थ कलीसिया में भूमिका या कार्य के लिए ठहराना है। पूर्ण वर्तमान-सदृश हिंदी प्रयोग परमेश्वर के किए कार्य और उसकी वर्तमान प्रासंगिकता दोनों को व्यक्त करता है।
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: कलीसिया में
  rationale: पौलुस के संदर्भ में ἐκκλησία परमेश्वर के एकत्रित समुदाय को सूचित करता है; आधुनिक हिंदी मसीही प्रयोग में ‘कलीसिया’ स्पष्ट और स्वाभाविक है।
- source_word: πρῶτον … δεύτερον … τρίτον
  choice: पहले … दूसरे … तीसरे
  rationale: यह यूनानी क्रम को बिना यह तय किए सीधे व्यक्त करता है कि वह अधिकार, समय या महत्त्व का क्रम है।
- source_word: ἀποστόλους
  choice: प्रेरितों
  rationale: यह सामान्य दूतों के बजाय कलीसिया में पहचानी गई प्रेरितीय भूमिका का मानक हिंदी पद है।
- source_word: προφήτας
  choice: भविष्यद्वक्ताओं
  rationale: भविष्यद्वाणी का संदेश बोलने वालों के लिए प्रचलित और संदर्भानुकूल हिंदी पद।
- source_word: διδασκάλους
  choice: शिक्षकों
  rationale: कलीसिया में शिक्षा देने की भूमिका का सीधा और सहज अनुवाद।
- source_word: δυνάμεις
  choice: सामर्थ्य के कामों
  rationale: बहुवचन शब्द का मूल भाव ‘सामर्थ्य के कार्य’ है और संदर्भ में यह चमत्कारी कार्यों को सूचित करता है। मुख्य पाठ स्रोत की अभिव्यक्ति रखता है; पादटिप्पणी सहज वैकल्पिक अर्थ देती है।
- source_word: χαρίσματα ἰαμάτων
  choice: चंगा करने के वरदानों
  rationale: यह दोनों यूनानी बहुवचनों का भाव बनाए रखता है और हिंदी में ‘चंगाइयों के वरदान’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: ἀντιλήμψεις
  choice: सहायता के कार्यों
  rationale: यह सहायता और सहारा देने वाले कार्यों या क्षमताओं को सूचित करता है; अमूर्त बहुवचन को सहज हिंदी में व्यक्त किया गया है।
- source_word: κυβερνήσεις
  choice: संचालन के कार्यों
  rationale: शब्द में दिशा देने, व्यवस्था चलाने और नेतृत्व करने का भाव है। ‘संचालन’ अनावश्यक रूप से किसी निश्चित पदानुक्रम को आरोपित नहीं करता।
- source_word: γένη γλωσσῶν
  choice: विभिन्न प्रकार की भाषाओं
  rationale: γένη के प्रकार/भेद और γλῶσσαι के भाषा/जिह्वा संबंधी भाव को पठनीय हिंदी में व्यक्त करता है। यूनानी शब्द की व्यापकता पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: क्या ‘पहले … दूसरे … तीसरे’ स्थायी पदानुक्रम, कालक्रम या कार्यगत प्रमुखता बताता है
  choice: क्रम को ज्यों का त्यों रखा गया है, बिना उसकी प्रकृति समझाने वाला कोई विशेषण जोड़े।
  alternative: इसे अधिकार का पदानुक्रम, प्रकट होने का कालक्रम, या महत्त्व का क्रम मानना।
  rationale: पद क्रम देता है, पर उस क्रम का आधार स्पष्ट नहीं करता; अनुवाद इस तनाव को खुला रखता है।
- issue: γλῶσσαι का सटीक आशय
  choice: मुख्य पाठ में ‘भाषाओं’ और पादटिप्पणी में यूनानी ‘जिह्वाओं/भाषाओं’ की अर्थ-सीमा का उल्लेख।
  alternative: इसे केवल ज्ञात मानवीय भाषाएँ या केवल विशिष्ट आत्मिक वाणी मानना।
  rationale: संदर्भ इस घटना की सटीक प्रकृति पर बहस की गुंजाइश छोड़ता है; अनुवाद किसी एक धर्मवैज्ञानिक निष्कर्ष को आरोपित नहीं करता।
- issue: सूची में व्यक्तियों से कार्यों/वरदानों की ओर व्याकरणिक बदलाव
  choice: प्रेरितों, भविष्यद्वक्ताओं और शिक्षकों के बाद सामर्थ्य के काम, वरदान और कार्य रखे गए हैं।
  alternative: पूरी सूची को केवल व्यक्तियों या केवल पदों के रूप में समान कर देना।
  rationale: यूनानी पाठ स्वयं व्यक्तियों से कार्यों और वरदानों की ओर बदलता है; इस असमानता को समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘कलीसिया’, ‘प्रेरित’ और ‘भविष्यद्वक्ता’ जैसे स्थापित बाइबलीय पद बनाए गए हैं। यूनानी सूची में व्यक्तियों से वरदानों और कार्यों की ओर होने वाले बदलाव को हिंदी में यथासंभव सुरक्षित रखा गया है।
