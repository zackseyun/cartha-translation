id: 1CO.12.22
reference: 1 Corinthians 12:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλὰ πολλῷ μᾶλλον τὰ δοκοῦντα μέλη τοῦ σώματος ἀσθενέστερα ὑπάρχειν ἀναγκαῖά ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/022.yaml
  text: On the contrary[a], the parts of the body that seem to be weaker are necessary[c][b],
translation:
  language: hi
  text: इसके विपरीत[a], शरीर के जो अंग[b] अधिक निर्बल जान पड़ते हैं, वे और भी अधिक आवश्यक[c] हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बल्कि, इससे भी बढ़कर।”
    reason: यूनानी में विरोध के साथ एक स्पष्ट तीव्रक है, जिसे वाक्य के आरम्भ में भी व्यक्त किया जा सकता है।
  - marker: b
    text: या, “सदस्य।”
    reason: यूनानी शब्द का अर्थ शरीर के ‘अंग’ और किसी समूह के ‘सदस्य’ दोनों हो सकता है; यहाँ शरीर का रूपक ‘अंग’ को अधिक स्वाभाविक बनाता है।
  - marker: c
    text: या, “अपरिहार्य,” अर्थात् जिनके बिना काम नहीं चल सकता।
    reason: यूनानी विशेषण आवश्यकता के साथ अपरिहार्यता का भाव भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: ἀλλὰ
  choice: इसके विपरीत
  rationale: यह पिछले कथन का प्रबल खंडन करके उलटी बात पर बल देता है; आधुनिक हिन्दी में ‘इसके विपरीत’ इसका सुधारात्मक विरोध स्वाभाविक रूप से व्यक्त करता है।
- source_word: πολλῷ μᾶλλον
  choice: और भी अधिक
  rationale: यूनानी पदबंध स्पष्ट रूप से तुलना को तीव्र करता है। इसे मुख्य पाठ में रखकर मूल का ‘बहुत अधिक/कहीं अधिक’ वाला बल सुरक्षित किया गया है।
- source_word: τὰ δοκοῦντα ... ἀσθενέστερα ὑπάρχειν
  choice: जो ... अधिक निर्बल जान पड़ते हैं
  rationale: δοκέω और ὑπάρχειν मिलकर वास्तविक स्थिति नहीं, बल्कि दिखाई देने या समझे जाने की स्थिति व्यक्त करते हैं; ἀσθενέστερα तुलनात्मक रूप है, इसलिए ‘अधिक निर्बल’ रखा गया है।
- source_word: μέλη τοῦ σώματος
  choice: शरीर के ... अंग
  rationale: शरीर के रूपक को ठोस और स्वाभाविक हिन्दी में बनाए रखता है; यहाँ ‘अंग’ आधुनिक हिन्दी में ‘सदस्यों’ से अधिक शारीरिक अर्थ देता है।
- source_word: ἀναγκαῖά ἐστιν
  choice: आवश्यक हैं
  rationale: यह आवश्यकता को सीधे व्यक्त करता है और ‘अपरिहार्य’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति की अपेक्षा मूल के निकट है।
theological_decisions:
- issue: शरीर के रूपक का कलीसियाई आशय
  choice: पद में शरीर और उसके अंगों का ठोस रूपक बनाए रखा गया है।
  alternative: ‘अंगों’ को सीधे ‘कलीसिया के सदस्यों’ के रूप में अनूदित करना।
  rationale: संदर्भ में पौलुस इस रूपक को कलीसिया पर लागू करता है, पर इस पद का अपना शब्दांकन शरीर के अंगों की बात करता है; इसलिए निहित कलीसियाई अर्थ को व्याख्यात्मक रूप से मुख्य पाठ में नहीं जोड़ा गया।
- issue: πολλῷ μᾶλλον के बल का संबंध
  choice: ‘और भी अधिक आवश्यक’ द्वारा विरोध और आवश्यकता—दोनों पर पड़ने वाला तीव्र बल स्वाभाविक हिन्दी में व्यक्त किया गया है।
  alternative: इसे वाक्य के आरम्भ में ‘बल्कि, इससे भी बढ़कर’ रखना।
  rationale: यूनानी संरचना में तीव्रक का सटीक व्याकरणिक प्रभाव हिन्दी में एक ही ढंग से पुनरुत्पादित नहीं होता। चुना हुआ रूप मूल के प्रबल दावे को स्पष्ट रखता है, जबकि वैकल्पिक संरचना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘निर्बल’ बाइबलीय संदर्भ में परिचित होते हुए भी वर्तमान हिन्दी में स्पष्ट है। ‘और भी अधिक’ मूल के स्पष्ट तीव्रक को मुख्य पाठ में बनाए रखता है।
