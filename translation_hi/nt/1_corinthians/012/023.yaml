source:
  edition: SBLGNT
  text: καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/023.yaml
  text: and those parts of the body that we think to be less honorable[a], on these we bestow greater honor, and our unpresentable parts have greater decorum[b],
translation:
  language: hi
  text: और शरीर के जिन अंगों को हम कम आदर के योग्य समझते हैं, उन्हीं को हम अधिक आदर देते हैं; और हमारे जो अंग दिखाने योग्य नहीं हैं[a], उनमें अधिक शालीनता होती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हमारे अशोभनीय अंग।’ यूनानी शब्द ऐसी वस्तु का संकेत दे सकता है जिसे सार्वजनिक रूप से दिखाना उचित नहीं समझा जाता।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उनमें अधिक शोभनीयता होती है’ या ‘वे अधिक प्रस्तुत करने योग्य होते हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δοκοῦμεν
  choice: जिन अंगों को हम ... समझते हैं
  rationale: यह मनुष्य के आकलन को व्यक्त करता है, वस्तुगत वास्तविकता को नहीं; ‘समझते हैं’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀτιμότερα
  choice: कम आदर के योग्य
  rationale: तुलनात्मक अर्थ को बनाए रखता है और τιμή के साथ आदर-विरोध को स्पष्ट करता है।
- source_word: τιμὴν περισσοτέραν περιτίθεμεν
  choice: उन्हीं को हम अधिक आदर देते हैं
  rationale: शाब्दिक रूप से ‘अधिक आदर उन पर रखते हैं’; हिन्दी में ‘अधिक आदर देते हैं’ अर्थ को सहज और ठीक ढंग से व्यक्त करता है।
- source_word: τὰ ἀσχήμονα ἡμῶν
  choice: हमारे जो अंग दिखाने योग्य नहीं हैं
  rationale: यह सामाजिक रूप से सार्वजनिक प्रदर्शन के लिए अनुपयुक्त अंगों का संकेत देता है; नैतिक अशुद्धता का अनावश्यक भाव नहीं जोड़ता।
- source_word: εὐσχημοσύνην περισσοτέραν ἔχει
  choice: उन्हें अधिक शालीन ढंग से रखा जाता है
  rationale: मुहावरेदार हिन्दी में उचित, मर्यादित प्रस्तुति का भाव देता है। व्याकरणिक रूप बदला गया है, पर अंगों को अधिक शालीनता मिलने का आशय सुरक्षित है।
theological_decisions:
- issue: शरीर के अंगों का रूपक और सामाजिक आदर
  choice: शरीर के ठोस अंगों की भाषा को बनाए रखा गया है।
  alternative: इसे सीधे कलीसिया के कमज़ोर या कम प्रतिष्ठित सदस्यों के विषय में भावानुवाद करना।
  rationale: पौलुस का तर्क वास्तविक शरीर के व्यवहार और मसीह की देह के बीच उपमा पर निर्भर है; अनुप्रयोग को अनुवाद में पहले से आरोपित नहीं किया गया।
- issue: ἀσχήμονα और εὐσχημοσύνην के बीच विरोध
  choice: ‘दिखाने योग्य नहीं’ और ‘शालीन ढंग’ के द्वारा सामाजिक मर्यादा और उचित प्रस्तुति का विरोध व्यक्त किया गया है।
  alternative: ‘अशोभनीय’ और ‘अधिक शोभा’ जैसा अधिक शब्दानुरूप अनुवाद।
  rationale: चुना हुआ रूप साधारण आधुनिक पाठक के लिए अधिक स्पष्ट है और यौन या नैतिक अभद्रता का अनावश्यक अर्थ थोपे बिना संदर्भगत तनाव बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अंग’ जोड़कर यूनानी के नपुंसकलिंग विशेषणों में निहित संज्ञा को हिन्दी में स्पष्ट किया गया है। समानांतर वाक्यरचना और ‘आदर’ की पुनरावृत्ति मूल तर्क को बनाए रखती है।
