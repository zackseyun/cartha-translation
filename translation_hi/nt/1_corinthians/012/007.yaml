base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/007.yaml
  text: But to each one the manifestation of the Spirit is given for the common good[a].
translation:
  language: hi
  text: पर हर एक को आत्मा का प्रकटीकरण सबके हित के लिए दिया जाता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जो लाभदायक है उसके लिए’ अथवा ‘सबके लाभ के लिए’।
    reason: यूनानी πρὸς τὸ συμφέρον लाभ या हित को सामान्य अर्थ में भी व्यक्त कर सकता है; मुख्य पाठ अध्याय के सामुदायिक संदर्भ को सामने रखता है।
lexical_decisions:
- source_word: ἑκάστῳ
  choice: हर एक को
  rationale: यह एकवचन दत्तिव रूप समुदाय के प्रत्येक व्यक्ति में वितरण का भाव रखता है; ‘हर एक को’ इसे स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: यहाँ δέ पिछले कथन से हल्का विरोध अथवा विचार में आगे बढ़ने का संकेत देता है। ‘पर’ उसके संयोजक बल को बिना बढ़ाए सहज हिन्दी में रखता है।
- source_word: δίδοται
  choice: दिया जाता है
  rationale: वर्तमानकालीन कर्मवाच्य को बनाए रखते हुए यह सीधा अनुवाद है और किसी अतिरिक्त कर्ता को पाठ में नहीं जोड़ता।
- source_word: ἡ φανέρωσις
  choice: प्रकटीकरण
  rationale: φανέρωσις किसी बात के दिखाई देने या स्पष्ट रूप में प्रकट होने को सूचित करता है। ‘प्रकटीकरण’ आत्मा की सक्रियता के प्रत्यक्ष रूप को व्यक्त करता है और स्रोत की संज्ञात्मक संरचना बनाए रखता है।
- source_word: τοῦ πνεύματος
  choice: आत्मा का
  rationale: अध्याय के निकट संदर्भ में πνεῦμα परमेश्वर के पवित्र आत्मा को सूचित करता है। मूल पाठ की तरह यहाँ केवल ‘आत्मा’ रखा गया है; ‘पवित्र’ जोड़कर अर्थ को मूल से अधिक स्पष्ट नहीं किया गया।
- source_word: πρὸς τὸ συμφέρον
  choice: सबके हित के लिए
  rationale: यह पदबंध लाभदायक या हितकर उद्देश्य बताता है। देह और परस्पर सेवा के अध्यायगत संदर्भ में ‘सबके हित के लिए’ उसके सामुदायिक आशय को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि व्यापक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ‘आत्मा’ का अभिप्रेत संदर्भ
  choice: यह पवित्र आत्मा को सूचित करता है, पर अनुवाद में मूल के अनुरूप ‘आत्मा’ ही रखा गया है।
  alternative: इसे सामान्य मानवीय ‘आत्मा’ समझना, अथवा पाठ में स्पष्ट रूप से ‘पवित्र आत्मा’ जोड़ना।
  rationale: 1 कुरिन्थियों 12:4, 8–11 में वही एक आत्मा वरदानों का स्रोत है, इसलिए संदर्भ पवित्र आत्मा की ओर स्पष्ट संकेत करता है; फिर भी अनुवाद यूनानी पाठ से अधिक शब्द नहीं जोड़ता।
- issue: συμφέρον के लाभ का दायरा
  choice: सामुदायिक लाभ—‘सबके हित के लिए।’
  alternative: सामान्य रूप से ‘जो लाभदायक है उसके लिए,’ जिसमें व्यक्तिगत लाभ भी खुला रह सकता है।
  rationale: शब्द अपने आप में व्यापक लाभ बता सकता है, पर इस अध्याय में देह के अंगों और परस्पर उपयोगिता पर बल उसके सामुदायिक अभिमुखीकरण को प्रमुख बनाता है। पादटिप्पणी मूल की व्यापकता को दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘पर’ हल्के संक्रमण के लिए सहज है; ‘प्रकटीकरण’ अपेक्षाकृत औपचारिक होते हुए भी मूल संज्ञा और उसके धार्मिक संदर्भ को सटीक रखता है।
