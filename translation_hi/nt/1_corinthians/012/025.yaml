lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम को व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: σχίσμα
  choice: फूट
  rationale: यह देह या समुदाय के भीतर दरार, टूट या विभाजन का बोध कराता है। ‘फूट’ देह के रूपक और कलीसियाई संदर्भ दोनों में स्पष्ट है तथा बाद की तकनीकी धार्मिक शब्दावली नहीं थोपता।
- source_word: σῶμα
  choice: देह
  rationale: यह पौलुस के देह-विषयक रूपक को सीधे बनाए रखता है; हिन्दी बाइबलीय गद्य में ‘देह’ स्वाभाविक और गरिमापूर्ण है।
- source_word: τὸ αὐτό
  choice: समान रूप से
  rationale: μεριμνῶσι के साथ यह अंगों की परस्पर चिंता में समानता का भाव देता है। हिन्दी में क्रियाविशेषणीय रूप वाक्य को स्वाभाविक रखता है।
- source_word: ὑπὲρ ἀλλήλων
  choice: एक-दूसरे की
  rationale: यह चिंता के पारस्परिक लक्ष्य को सहज हिन्दी में व्यक्त करता है; यहाँ ὑπέρ प्रतिस्थापन का नहीं, किसी के हित और विषय में चिंता का बोध देता है।
- source_word: μεριμνῶσι
  choice: चिंता करें
  rationale: संदर्भ में क्रिया सकारात्मक देखभाल और सरोकार बताती है, न कि दोषपूर्ण व्याकुलता। ‘चिंता करें’ सामान्य हिन्दी में किसी के हित की परवाह करने का भाव रखता है।
- source_word: μέλη
  choice: अंग
  rationale: देह के वास्तविक अंगों और रूपकतः समुदाय के सदस्यों—दोनों अर्थों को बनाए रखता है।
theological_decisions:
- issue: कलीसिया के देह-रूपक में σχίσμα का अनुवाद
  choice: फूट
  alternative: विभाजन; दरार
  rationale: ‘फूट’ समुदाय के भीतर टूटे संबंध और देह में दरार—दोनों को व्यक्त करती है, जबकि इसे बाद के तकनीकी अर्थ वाले ‘मतभेद’ या किसी सम्प्रदायगत पद तक सीमित नहीं करती।
- issue: τὸ αὐτό से व्यक्त समानता
  choice: एक-दूसरे की समान रूप से चिंता करें
  alternative: एक-दूसरे के लिए एक ही चिंता रखें
  rationale: यूनानी वाक्यांश की संरचना इस बात में कुछ अस्पष्टता रखती है कि जोर समान चिंता पर है या समान ढंग से देखभाल करने पर। मुख्य पाठ स्वाभाविक हिन्दी में समान पारस्परिक सरोकार देता है और पादटिप्पणी वैकल्पिक रूप सुरक्षित रखती है।
