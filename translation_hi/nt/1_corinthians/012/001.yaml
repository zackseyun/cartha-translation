  text: Περὶ δὲ τῶν πνευματικῶν, ἀδελφοί, οὐ θέλω ὑμᾶς ἀγνοεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/001.yaml
  text: Concerning spiritual gifts, brothers, I do not want you to be uninformed.
translation:
  language: hi
  text: आत्मिक वरदानों[a] के विषय में, भाइयो[b], मैं नहीं चाहता कि तुम अनजान रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आत्मिक बातों’। यूनानी अभिव्यक्ति ‘वरदानों’ से अधिक व्यापक है, यद्यपि इस अध्याय का प्रसंग आत्मा द्वारा दिए गए वरदानों पर केंद्रित है।
    reason: alternative_reading
  - marker: b
    text: यहाँ ‘भाइयो’ मंडली को संबोधित करने का पौलुस का ढंग है और इसमें संभवतः स्त्रियाँ भी सम्मिलित हैं।
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: के विषय में
  rationale: यह पद एक नए विषय की ओर संक्रमण करता है। हिंदी में ‘के विषय में’ περί का स्वाभाविक अर्थ देता है; δέ की हल्की संक्रमणकारी भूमिका को अनावश्यक ‘अब’ जोड़कर कालसूचक नहीं बनाया गया।
- source_word: τῶν πνευματικῶν
  choice: आत्मिक वरदानों
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त हुआ है और मूल यूनानी में ‘वरदान’ शब्द स्पष्ट रूप से नहीं है। फिर भी अध्याय 12–14 का निकट संदर्भ आत्मा द्वारा दिए गए वरदानों और प्रकट कार्यों पर केंद्रित है, इसलिए मुख्य पाठ में ‘आत्मिक वरदानों’ स्वाभाविक है; व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: पुल्लिंग बहुवचन संबोधन का सीधा और स्वाभाविक हिंदी रूप। पौलुस के ऐसे संबोधन में संभवतः पूरी मंडली, स्त्रियों सहित, सम्मिलित है; इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: οὐ θέλω ὑμᾶς ἀγνοεῖν
  choice: मैं नहीं चाहता कि तुम अनजान रहो
  rationale: यह पौलुस की एक सामान्य शिक्षात्मक अभिव्यक्ति है। ‘अनजान रहो’ आधुनिक हिंदी में स्वाभाविक है और जानकारी के अभाव का अर्थ देता है, बिना अपमानजनक भाव के।
theological_decisions:
- issue: τῶν πνευματικῶν का अर्थ
  choice: मुख्य पाठ में ‘आत्मिक वरदानों’
  alternative: ‘आत्मिक बातों’ या संभवतः ‘आत्मिक लोगों’
  rationale: यूनानी पदबंध व्यापक और व्याकरणतः संदिग्ध है, पर आगे का प्रसंग आत्मा से मिलने वाले विभिन्न वरदानों और प्रकट कार्यों पर केंद्रित है। इसलिए संदर्भानुसार ‘वरदानों’ चुना गया, जबकि मूल की व्यापकता पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आत्मिक वरदान’ प्रचलित धार्मिक पद है, जबकि मूल की वास्तविक व्यापकता और संबोधन की समावेशी व्यावहारिक सीमा पादटिप्पणियों में स्पष्ट की गई है।
