source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ ὁ θεὸς ἔθετο τὰ μέλη, ἓν ἕκαστον αὐτῶν, ἐν τῷ σώματι καθὼς ἠθέλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/012/018.yaml
  text: But as it is[a], God arranged the members, each one of them[b], in the body just as he desired.
translation:
  language: hi
  text: परन्तु वास्तविकता यह है कि परमेश्वर ने अंगों को—उनमें से हर एक को—शरीर में अपनी इच्छा के अनुसार रखा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: परन्तु वास्तविकता यह है कि
  rationale: यह पद पिछले काल्पनिक कथनों के विपरीत वास्तविक स्थिति पर लौटता है। यह हिंदी प्रयोग केवल समयसूचक ‘अब’ की अपेक्षा विरोध और वास्तविकता, दोनों को स्पष्ट करता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: θεός का स्वाभाविक और गरिमापूर्ण मानक हिंदी रूप।
- source_word: ἔθετο
  choice: रखा है
  rationale: τίθημι का मूल अर्थ ‘रखना/स्थापित करना’ है। ‘रखा है’ स्रोत के निकट और सहज है, जबकि संदर्भ तथा आगे का इच्छासूचक वाक्यांश उद्देश्यपूर्ण व्यवस्था को पर्याप्त रूप से व्यक्त करते हैं।
- source_word: τὰ μέλη
  choice: अंगों को
  rationale: शरीर के रूपक में μέλη के लिए ‘अंग’ सटीक और सामान्य हिंदी शब्द है; ‘हिस्से’ कम विशिष्ट और ‘अवयव’ अधिक तकनीकी है।
- source_word: ἓν ἕκαστον αὐτῶν
  choice: उनमें से हर एक को
  rationale: यह रूप प्रत्येक अंग की अलग-अलग पहचान और समावेश पर बल देता है; हिंदी में यह वितरणात्मक अर्थ स्वाभाविक ढंग से सुरक्षित रहता है।
- source_word: ἐν τῷ σώματι
  choice: शरीर में
  rationale: पूर्वसर्गीय पदबंध का सीधा और स्वाभाविक अनुवाद; निकट संदर्भ में शारीरिक रूपक प्रमुख है।
- source_word: καθὼς ἠθέλησεν
  choice: अपनी इच्छा के अनुसार
  rationale: यह परमेश्वर की इच्छा और उसी के अनुरूप अंगों की स्थापना को व्यक्त करता है। हिंदी में यह ‘जैसा उसने चाहा’ से अधिक गरिमापूर्ण है, फिर भी अर्थ को अनावश्यक रूप से तकनीकी नहीं बनाता।
theological_decisions:
- issue: शरीर में प्रत्येक अंग की स्थापना में परमेश्वर की मंशा
  choice: परमेश्वर ने हर अंग को शरीर में अपनी इच्छा के अनुसार रखा है।
  alternative: इसे केवल उद्देश्यहीन भौतिक स्थान-निर्धारण के रूप में पढ़ना।
  rationale: ἓν ἕκαστον और καθὼς ἠθέλησεν मिलकर प्रत्येक अंग के जानबूझकर रखे जाने को व्यक्त करते हैं। अनुवाद इसी बल को सुरक्षित रखता है, पर पद से परे कोई व्यापक सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘वास्तविकता यह है कि’ पिछले काल्पनिक कथनों से विरोध को व्यक्त करता है। डैशों से ‘उनमें से हर एक को’ का विशेष बल सुरक्षित रखा गया है।
