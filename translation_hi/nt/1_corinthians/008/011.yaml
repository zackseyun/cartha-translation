id: 1CO.8.11
reference: 1 Corinthians 8:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂ἀπόλλυται γὰρ⸃ ὁ ἀσθενῶν ⸀ἐν τῇ σῇ γνώσει, ⸂ὁ ἀδελφὸς⸃ δι’ ὃν Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/011.yaml
  text: For the weak one is destroyed by your knowledge—the brother for whom Messiah died[a][b][c].
translation:
  language: hi
  text: क्योंकि तुम्हारे ज्ञान के कारण वह निर्बल व्यक्ति नष्ट हो रहा है—वह भाई, जिसके लिए मसीह मरा[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नष्ट हो रहा है” का अनुवाद “नाश हो जाता है” या “बरबाद हो रहा है” भी हो सकता है। यूनानी शब्द गंभीर विनाश या बरबादी व्यक्त कर सकता है; यहाँ यह वर्तमान आत्मिक क्षति, अंतिम विनाश, या दोनों को सूचित करता है—यह बात स्पष्ट रूप से तय नहीं है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “भाई” का अर्थ संगी विश्वासी है; प्रसंग का सिद्धांत विश्वास की बहन पर भी लागू हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλλυται
  choice: नष्ट हो रहा है
  rationale: वर्तमानकालीन रूप गंभीर विनाश या बरबादी को व्यक्त करता है। यह अनुवाद क्रिया की तीव्रता और जारी परिणाम को बनाए रखता है, पर यह तय नहीं करता कि यहाँ वर्तमान आत्मिक बरबादी अभिप्रेत है, अंतिम विनाश, या दोनों।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ स्वाभाविक संबंधसूचक है।
- source_word: ὁ ἀσθενῶν
  choice: वह निर्बल व्यक्ति
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत का अर्थ ‘वह जो निर्बल है’ है। ‘भाई’ को यहाँ पहले से जोड़ने के बजाय पद में उसके अलग स्थान पर रखा गया है।
- source_word: ἐν τῇ σῇ γνώσει
  choice: तुम्हारे ज्ञान के कारण
  rationale: ἐν यहाँ उस साधन अथवा प्रभावकारी परिस्थिति को सूचित करता है जिसमें दूसरे का तथाकथित ज्ञान निर्बल व्यक्ति के विनाश का कारण बनता है।
- source_word: γνῶσις
  choice: ज्ञान
  rationale: यह निकटवर्ती प्रसंग की पारिभाषिक पुनरावृत्ति को सुरक्षित रखता है और उस विडंबना को भी कि ज्ञान का प्रेमहीन प्रयोग हानि पहुँचाता है।
- source_word: ὁ ἀδελφός
  choice: वह भाई
  rationale: मूल यूनानी पुल्लिंग एकवचन को मुख्य पाठ में बनाए रखा गया है; प्रसंग में इसका अर्थ विश्वास में सहभागी भाई है।
- source_word: δι’ ὃν
  choice: जिसके लिए
  rationale: 'διά के साथ कर्मकारक सर्वनाम यहाँ हित अथवा पक्ष को व्यक्त करता है: मसीह उस भाई के लिए मरा।'
- source_word: Χριστός
  choice: मसीह
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; हिन्दी में ‘मसीह’ उसका स्वाभाविक और स्थापित रूप है।
- source_word: ἀπέθανεν
  choice: मरा
  rationale: अओरिस्ट सूचक को हिन्दी के सामान्य पूर्ण भूतकाल से सीधा और स्वाभाविक रूप मिला है।
theological_decisions:
- issue: क्या ἀπόλλυται को ऐसा अनूदित किया जाए कि वह सच्चे विश्वासी के अंतिम अनन्त विनाश को निश्चित रूप से बताए
  choice: नष्ट हो रहा है
  alternative: नाश हो जाता है; नष्ट होता है; बरबाद हो रहा है
  rationale: मूल क्रिया कठोर विनाश या बरबादी व्यक्त करती है, लेकिन प्रसंग अकेले यह निश्चित नहीं करता कि पौलुस वर्तमान आत्मिक क्षति, अंतिम विनाश, या दोनों की बात कर रहा है। अतः अनुवाद गंभीरता और कालगत पहलू को रखता है, बिना विवादित धर्मवैज्ञानिक निष्कर्ष थोपे।
- issue: क्या ἀδελφός को मुख्य पाठ में लिंग-निरपेक्ष बनाया जाए
  choice: वह भाई
  alternative: संगी विश्वासी; भाई या बहन
  rationale: मुख्य पाठ यूनानी के पुल्लिंग एकवचन को दर्शाता है, जबकि पादटिप्पणी स्पष्ट करती है कि प्रसंग में यह संगी विश्वासी के अर्थ में है और सिद्धांततः विश्वास की बहन पर भी लागू हो सकता है।
translation_notes:
  register: 'आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और स्पष्ट रूप अपनाया गया है। वाक्य में डैश यूनानी के पुनरुक्त apposition को उभारता है: निर्बल व्यक्ति ही वह भाई है जिसके लिए मसीह मरा। ‘मसीह’ हिन्दी में Χριστός की स्थापित उपाधिगत अभिव्यक्ति है, इसलिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।'
