  text: Περὶ δὲ τῶν εἰδωλοθύτων, οἴδαμεν ὅτι πάντες γνῶσιν ἔχομεν. ἡ γνῶσις φυσιοῖ, ἡ δὲ ἀγάπη οἰκοδομεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/001.yaml
  text: 'Concerning food sacrificed to idols: we know that we all have knowledge[a]. Knowledge puffs up[b], but love builds up.'
translation:
  language: hi
  text: मूर्तियों के लिए बलि चढ़ाए गए भोजन[a] के विषय में—हम जानते हैं कि हम सबके पास ज्ञान है[b]। ज्ञान अहंकार से फुला देता है, पर प्रेम निर्माण करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मूर्तियों के लिए बलि चढ़ाया गया मांस’ अथवा ‘मूर्तियों के लिए बलि चढ़ाई गई वस्तुएँ।’
    reason: lexical_alternative
  - marker: b
    text: ‘हम सबके पास ज्ञान है’ में पौलुस संभवतः कुरिन्थियों के प्रचलित कथन की प्रतिध्वनि कर रहा है।
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ δὲ
  choice: के विषय में
  rationale: यह नए विषय की ओर ले जाने वाला पत्रात्मक संक्रमण है। हिंदी में ‘के विषय में’ स्वाभाविक है; स्रोत में कोई स्पष्ट कालवाचक ‘अब’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: τῶν εἰδωλοθύτων
  choice: मूर्तियों को बलि में चढ़ाए गए भोजन
  rationale: यह मूर्तिपूजा में अर्पित वस्तुओं, और इस प्रसंग में विशेषतः भोजन, को दर्शाता है। ‘भोजन’ केवल मांस तक अर्थ को सीमित नहीं करता।
- source_word: οἴδαμεν
  choice: हम जानते हैं
  rationale: क्रिया के वर्तमान अर्थ में प्रयुक्त पूर्ण-रूप का सीधा और स्वाभाविक हिंदी अनुवाद।
- source_word: ὅτι πάντες γνῶσιν ἔχομεν
  choice: कि हम सबके पास ज्ञान है
  rationale: यह यूनानी कथन को बिना किसी अतिरिक्त योग्यता के रखता है और संभव कुरिन्थी दावे की प्रतिध्वनि होने की संभावना को मुख्य पाठ में निर्णीत नहीं करता।
- source_word: ἡ γνῶσις
  choice: ज्ञान
  rationale: पहले आए ‘ज्ञान’ से शब्दगत संबंध बनाए रखता है और सामान्य भाववाचक संज्ञा के रूप में स्वाभाविक है।
- source_word: φυσιοῖ
  choice: घमंड से फुलाता है
  rationale: पौलुस के फूलने के सजीव रूपक को बनाए रखते हुए हिंदी पाठक के लिए उसके अहंकार-संबंधी आशय को स्पष्ट करता है।
- source_word: ἡ δὲ ἀγάπη
  choice: पर प्रेम
  rationale: δέ के विरोध और ἀγάπη के सामान्य भाववाचक अर्थ को संक्षिप्त, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: οἰκοδομεῖ
  choice: निर्माण करता है
  rationale: ‘उन्नति करता है’ की अपेक्षा पौलुस के भवन-निर्माण वाले रूपक को अधिक प्रत्यक्ष रूप से सुरक्षित रखता है।
theological_decisions:
- issue: क्या πάντες (‘सब’) को निर्विवाद सार्वभौमिक कथन माना जाए या कुरिन्थियों के दावे की पौलुस द्वारा की गई प्रतिध्वनि
  choice: मुख्य पाठ में ‘हम सबके पास ज्ञान है’ बिना उद्धरण-चिह्न या अतिरिक्त योग्यता के रखा गया
  alternative: इसे उद्धरण-चिह्नों में कुरिन्थियों का नारा दिखाना, अथवा ‘हर किसी के पास ज्ञान है’ कहना
  rationale: यूनानी पाठ में स्पष्ट उद्धरण-चिह्न या दूरी दर्शाने वाला पद नहीं है। इसलिए मुख्य पाठ कथन को यथावत रखता है और संभावित आलंकारिक बल को टिप्पणी में बताता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल किंतु गरिमापूर्ण रूप अपनाया गया है। ‘घमंड से फुलाता है’ और ‘निर्माण करता है’ द्वारा मूल के परस्पर-विरोधी रूपकों को सुरक्षित रखा गया है; संभावित कुरिन्थी नारे को मुख्य पाठ में निश्चित उद्धरण बनाकर व्याख्यात्मक तनाव समाप्त नहीं किया गया।
