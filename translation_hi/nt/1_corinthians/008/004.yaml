source:
  edition: SBLGNT
  text: Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι οὐδεὶς ⸀θεὸς εἰ μὴ εἷς.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/004.yaml
  text: Therefore[a], concerning the eating of food sacrificed to idols, we know that an idol is nothing in the world[b], and that there is no God except one.
translation:
  language: hi
  text: इसलिए, मूर्तियों को बलि में चढ़ाए गए भोजन को खाने के विषय में हम जानते हैं कि संसार में मूर्ति कुछ भी नहीं है[a], और यह कि एक को छोड़कर कोई परमेश्वर नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संसार में मूर्ति का कोई वास्तविक अस्तित्व नहीं है।”
    reason: lexical_alternative
  - marker: b
    text: या, “एक को छोड़कर कोई देवता नहीं है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρώσεως
  choice: खाने
  rationale: यह संज्ञा भोजन की वस्तु के बजाय खाने की क्रिया बताती है; ‘भोजन के खाने’ से मूल का क्रियात्मक भाव बना रहता है।
- source_word: εἰδωλοθύτων
  choice: मूर्तियों को बलि चढ़ाए गए भोजन
  rationale: यह बलि से जुड़े भोजन को व्यापक रूप से दर्शाता है और अर्थ को केवल मांस तक सीमित नहीं करता।
- source_word: οἴδαμεν
  choice: हम जानते हैं
  rationale: क्रिया के वर्तमान अर्थ और पौलुस की साझा ज्ञान की अपील, दोनों को सीधे बनाए रखता है।
- source_word: οὐδὲν εἴδωλον
  choice: मूर्ति कुछ भी नहीं है
  rationale: यूनानी कथन की संक्षिप्तता और मूर्ति की वास्तविक सत्ता अथवा मूल्य के निषेध को बनाए रखता है; संभावित अधिक स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐν κόσμῳ
  choice: संसार में
  rationale: κόσμος के यहाँ वास्तविक/सृजित जगत के अर्थ के लिए यह स्वाभाविक मानक हिन्दी है।
- source_word: οὐδεὶς θεὸς εἰ μὴ εἷς
  choice: एक को छोड़ कोई परमेश्वर नहीं है
  rationale: एकेश्वरवादी दावे की शक्ति बनाए रखता है, साथ ही यूनानी के संक्षिप्त ‘एक’ को अनावश्यक विस्तार नहीं देता।
- source_word: οὖν
  choice: इसलिए
  rationale: पिछली चर्चा से निकलने वाले तार्किक निष्कर्ष या संक्रमण को स्पष्ट करता है।
theological_decisions:
- issue: मूर्तियों की वास्तविकता और एक परमेश्वर का दावा
  choice: मुख्य पाठ में ‘मूर्ति कुछ भी नहीं है’ और ‘एक को छोड़ कोई परमेश्वर नहीं है’ रखा गया है।
  alternative: ‘संसार में मूर्ति का कोई वास्तविक अस्तित्व नहीं’ तथा ‘एक को छोड़ कोई देवता नहीं।’
  rationale: यह पाठ मूर्ति की शून्यता और परमेश्वर की अद्वितीयता—दोनों को दृढ़ता से कहता है, पर ‘कुछ भी नहीं’ की वास्तविक-अस्तित्व अथवा निष्प्रभाविता संबंधी संभावित अर्थ-छाया और θεός के ‘परमेश्वर/देवता’ विकल्प को पादटिप्पणियों में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण धार्मिक गद्य। ‘मूर्तियों को बलि चढ़ाए गए भोजन’ सामान्य पाठक के लिए स्पष्ट है और केवल मांस का अर्थ नहीं देता। मुख्य पाठ की संक्षिप्तता मूल यूनानी के निकट रखी गई है; वास्तविक-अस्तित्व तथा ‘परमेश्वर/देवता’ की अस्पष्टता पादटिप्पणियों में संरक्षित है।
