  edition: SBLGNT
  text: Ἀλλ’ οὐκ ἐν πᾶσιν ἡ γνῶσις· τινὲς δὲ τῇ ⸀συνηθείᾳ ⸂ἕως ἄρτι τοῦ εἰδώλου⸃ ὡς εἰδωλόθυτον ἐσθίουσιν, καὶ ἡ συνείδησις αὐτῶν ἀσθενὴς οὖσα μολύνεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/007.yaml
  text: But not everyone has this knowledge[a]. Some, through familiarity with the idol until now, eat it as food sacrificed to an idol, and their conscience, being weak[b], is defiled.
translation:
  language: hi
  text: परन्तु यह ज्ञान सबमें नहीं है। कुछ लोग अब तक मूर्ति-पूजा के अभ्यस्त होने के कारण मूर्ति को चढ़ाया हुआ भोजन समझकर खाते हैं[a], और उनका विवेक निर्बल होने से अशुद्ध हो जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पदबंध कठिन है। अधिक शाब्दिक रूप हो सकता है, “अब तक मूर्ति के साथ परिचय/अभ्यास के कारण।” आशय यह है कि कुछ लोग मूर्ति-पूजा से अपने पुराने जुड़ाव के प्रभाव में अब भी हैं।
    reason: lexical_alternative
  - marker: b
    text: कुछ पांडुलिपियों में इस खंड का पाठ “मूर्ति का विवेक” है या इससे संबंधित अन्य पाठांतर मिलते हैं; मुख्य पाठ SBLGNT के पाठ का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: γνῶσις
  choice: ज्ञान
  rationale: यह निकटवर्ती प्रसंग में उस समझ को दर्शाता है कि मूर्ति वास्तव में कुछ नहीं है; ‘ज्ञान’ पौलुस की शब्दावली और संदर्भगत संबंध बनाए रखता है।
- source_word: συνήθεια
  choice: अभ्यस्त होना
  rationale: यह केवल सामान्य आदत नहीं, बल्कि मूर्ति-पूजा से पूर्व और अब तक प्रभावी परिचय या जुड़ाव को व्यक्त करता है।
- source_word: ἕως ἄρτι τοῦ εἰδώλου
  choice: अब तक मूर्ति-पूजा के
  rationale: दुर्बोध यूनानी पदबंध के कालगत तत्व ‘अब तक’ और मूर्ति से उपासना-संबंध दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक संभावना पादटिप्पणी में दी गई है।
- source_word: εἰδωλόθυτον
  choice: मूर्ति को चढ़ाया हुआ
  rationale: यह भोजन के मूर्ति-बलि से जुड़े होने का अर्थ स्पष्ट करता है, बिना मूर्ति को वास्तविक देवता मानने का संकेत दिए।
- source_word: συνείδησις
  choice: विवेक
  rationale: नैतिक चेतना के लिए प्रचलित और स्वाभाविक हिन्दी शब्द।
- source_word: ἀσθενής
  choice: निर्बल
  rationale: इस विषय में विवेक की दृढ़ता के अभाव को व्यक्त करता है और अध्याय की पौलुसी शब्दावली बनाए रखता है।
- source_word: μολύνεται
  choice: अशुद्ध हो जाता है
  rationale: विवेक पर पड़ने वाली नैतिक दूषितता को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मूर्ति को चढ़ाए भोजन की स्थिति को इस प्रकार व्यक्त करना कि मूर्तियाँ वास्तविक देवता न मानी जाएँ
  choice: उस भोजन को मूर्ति को चढ़ाया हुआ मानकर खाते हैं
  alternative: मूर्ति को चढ़ाया हुआ भोजन खाते हैं
  rationale: '‘मानकर’ खाने वालों की चेतना में भोजन के धार्मिक अर्थ को सामने लाता है। इससे अध्याय का तनाव बना रहता है: मूर्ति कुछ नहीं, फिर भी उस भोजन को मूर्ति-संबंधी मानकर खाना निर्बल विवेक को अशुद्ध कर सकता है।'
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘मूर्ति-पूजा के अभ्यस्त’ कठिन यूनानी वाक्यांश का संदर्भगत अर्थ देता है, जबकि पादटिप्पणी उसकी वास्तविक अस्पष्टता सुरक्षित रखती है।
