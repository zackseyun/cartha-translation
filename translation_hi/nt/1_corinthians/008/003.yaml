  text: But if anyone loves God[a], this one is known by him.
translation:
  language: hi
  text: पर यदि कोई परमेश्वर से प्रेम करता है, तो परमेश्वर उसे जानता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह परमेश्वर द्वारा पहचाना गया है” अथवा “परमेश्वर ने उसे जान रखा है।” यूनानी पूर्ण निष्क्रिय क्रिया परमेश्वर द्वारा जाने जाने की बनी रहने वाली अवस्था का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: पर यदि
  rationale: εἰ की शर्त और δέ के पिछले कथन से हल्के विरोध—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τις
  choice: कोई
  rationale: अनिश्चित और सर्वसमावेशी अर्थ को बिना पुरुष-विशेष संकेत के व्यक्त करता है।
- source_word: ἀγαπᾷ
  choice: प्रेम करता है
  rationale: वर्तमानकालीन सक्रिय क्रिया का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: τὸν θεόν
  choice: परमेश्वर से
  rationale: हिन्दी में ‘प्रेम करना’ के साथ लक्ष्य के लिए ‘से’ स्वाभाविक है; θεός का निश्चित संदर्भ ‘परमेश्वर’ से स्पष्ट है।
- source_word: οὗτος
  choice: तो वह
  rationale: शर्त के उत्तरवाक्य में उसी व्यक्ति को संकेत करते हुए यूनानी demonstrative का हल्का बल स्वाभाविक हिन्दी में रखता है।
- source_word: ἔγνωσται
  choice: जाना गया है
  rationale: पूर्ण निष्क्रिय रूप को इस प्रकार व्यक्त किया गया है कि पूर्व क्रिया से बनी वर्तमान अवस्था भी बनी रहे; ‘पहचाना गया’ भी संभव है।
- source_word: ὑπ’ αὐτοῦ
  choice: परमेश्वर के द्वारा
  rationale: सर्वनाम का कर्ता परमेश्वर है। हिन्दी में अस्पष्ट ‘उसके द्वारा’ से बचते हुए संदर्भ स्पष्ट किया गया है।
theological_decisions:
- issue: परमेश्वर द्वारा ‘जानने’ का अर्थ
  choice: ‘परमेश्वर के द्वारा जाना गया है’—सम्बन्धपरक पहचान, स्वीकृति या वाचागत जानने की सम्भावना को व्यापक रखा गया है।
  alternative: ‘परमेश्वर ने उसे पहचान लिया है’ अथवा ‘वह परमेश्वर द्वारा स्वीकृत है।’
  rationale: γινώσκω यहाँ केवल तथ्यात्मक जानकारी से अधिक संकेत कर सकता है, पर यूनानी पाठ किसी एक संकीर्ण धर्मवैज्ञानिक अर्थ को अनिवार्य नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। मुख्य वाक्य में ‘परमेश्वर’ दोहराकर सर्वनाम-संबंधी अस्पष्टता दूर की गई है।
