  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठक के लिए स्पष्ट। प्राचीन भोज-मुद्रा को “भोजन के लिए लेटे हुए” से स्पष्ट किया गया है। “विवेक,” “ज्ञान,” और “मूर्तियों को चढ़ाया हुआ भोजन” जैसे प्रसंगगत प्रमुख शब्द सुरक्षित रखे गए हैं।
