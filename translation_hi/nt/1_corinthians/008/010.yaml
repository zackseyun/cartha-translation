source:
  edition: SBLGNT
  text: ἐὰν γάρ τις ἴδῃ σὲ τὸν ἔχοντα γνῶσιν ἐν εἰδωλείῳ κατακείμενον, οὐχὶ ἡ συνείδησις αὐτοῦ ἀσθενοῦς ὄντος οἰκοδομηθήσεται εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν;
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/010.yaml
  text: For if someone sees you[a], who have knowledge, reclining in an idol’s temple, will not his conscience, being weak, be built up to eat food sacrificed to idols?
translation:
  language: hi
  text: क्योंकि यदि कोई तुम्हें, जिसे ज्ञान है, किसी मूर्ति के मंदिर में भोजन के लिए लेटे हुए देखे, तो क्या उस दुर्बल व्यक्ति का विवेक मूर्तियों को चढ़ाया गया भोजन खाने के लिए उकसाया नहीं जाएगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ “निर्मित किया जाएगा” या “उन्नत किया जाएगा” है। पौलुस की सामान्य “निर्माण” वाली भाषा यहाँ संभवतः विडंबना के साथ प्रयुक्त हुई है; संदर्भ में अर्थ है कि वह ऐसा करने के लिए प्रेरित या साहसी हो जाएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है और तर्क का प्रवाह बनाए रखता है।
- source_word: τις
  choice: कोई
  rationale: अनिश्चित एकवचन और काल्पनिक परिस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἴδῃ
  choice: देखे
  rationale: ἐὰν के साथ संभाव्य शर्त को हिन्दी की यदि...देखे रचना स्वाभाविक रूप से व्यक्त करती है।
- source_word: σὲ τὸν ἔχοντα γνῶσιν
  choice: तुम्हें, जिसे ज्ञान है
  rationale: ज्ञान रखने वाले संबोधित व्यक्ति पर यूनानी पाठ का बल और प्रसंग का संकेत सुरक्षित रहता है।
- source_word: γνῶσιν
  choice: ज्ञान
  rationale: अध्याय में बार-बार आने वाले प्रमुख शब्द और उसके वैचारिक संबंध को बनाए रखता है।
- source_word: ἐν εἰδωλείῳ
  choice: किसी मूर्ति के मंदिर में
  rationale: मूर्ति से संबद्ध पूजा-स्थल का अर्थ स्पष्ट और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: κατακείμενον
  choice: भोजन के लिए लेटे हुए
  rationale: प्राचीन भोज में लेटकर खाने की ठोस छवि सुरक्षित रखते हुए भोजन का प्रसंग स्पष्ट करता है।
- source_word: οὐχὶ
  choice: तो क्या ... नहीं किया जाएगा?
  rationale: सकारात्मक उत्तर की अपेक्षा रखने वाले आलंकारिक प्रश्न को सुरक्षित रखता है।
- source_word: ἡ συνείδησις αὐτοῦ
  choice: उसका विवेक
  rationale: देखने वाले व्यक्ति की नैतिक चेतना को सीधे व्यक्त करता है।
- source_word: ἀσθενοῦς ὄντος
  choice: जो दुर्बल है
  rationale: दुर्बलता व्यक्ति के विवेक की दशा है; हिन्दी में संबंधवाचक उपवाक्य स्पष्ट और स्वाभाविक है।
- source_word: οἰκοδομηθήσεται
  choice: दृढ़ नहीं किया जाएगा
  rationale: शाब्दिक निर्माण/उन्नति की छवि का कुछ अंश रखते हुए प्रसंग में किसी काम को करने का साहस मिलने का अर्थ संप्रेषित करता है; विडंबनापूर्ण शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: εἰς τὸ τὰ εἰδωλόθυτα ἐσθίειν
  choice: मूर्तियों को चढ़ाया हुआ भोजन खाने के लिए
  rationale: परिणाम अथवा प्रवृत्ति को स्पष्ट करता है और बलि-भोजन का धार्मिक संदर्भ बनाए रखता है।
theological_decisions:
- issue: हानिकारक अनुकरण के संदर्भ में οἰκοδομηθήσεται का अनुवाद
  choice: दृढ़ नहीं किया जाएगा
  alternative: उन्नत नहीं किया जाएगा / साहस नहीं पाएगा
  rationale: मूल क्रिया सामान्यतः निर्माण या उन्नति के लिए प्रयुक्त होती है, पर यहाँ परिणाम हानिकारक होने के कारण प्रयोग विडंबनापूर्ण है। मुख्य पाठ में अर्थबोध और पादटिप्पणी में शाब्दिक छवि दोनों रखे गए हैं, ताकि तनाव मिटे नहीं।
