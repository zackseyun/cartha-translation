base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/002.yaml
  text: If anyone thinks he knows something[a], he does not yet know as he ought to know.
translation:
  language: hi
  text: यदि कोई सोचता है कि वह कुछ जानता है[a], तो उसने अभी तक उस तरह नहीं जाना है, जिस तरह जानना चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि कोई सोचता है कि उसने किसी बात को जान लिया है, तो उसने अभी तक उस तरह नहीं जाना है, जिस तरह जानना चाहिए।”
    reason: यह ἐγνωκέναι के पूर्णकालिक पक्ष—‘जान लिया है’ अथवा ज्ञान प्राप्त कर चुका है—को स्पष्ट करने वाला वैकल्पिक अनुवाद है।
lexical_decisions:
- source_word: εἴ τις
  choice: यदि कोई
  rationale: यह सामान्य और अनिश्चित शर्त को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δοκεῖ
  choice: समझता है
  rationale: यहाँ क्रिया किसी व्यक्ति की अपनी धारणा या आत्म-मूल्यांकन को दिखाती है, केवल बाहरी प्रतीति को नहीं।
- source_word: ἐγνωκέναι τι
  choice: कि वह कुछ जानता है
  rationale: यूनानी पूर्णकालिक infinitive प्राप्त ज्ञान की वर्तमान अवस्था का दावा व्यक्त करता है; हिन्दी में यह सरल वर्तमान से स्वाभाविक रूप से प्रकट होता है।
- source_word: οὔπω ἔγνω
  choice: उसने अब तक ... नहीं जाना
  rationale: यह οὔπω की 'अभी तक नहीं' वाली कालगत बारीकी और ἔγνω के क्रियात्मक रूप, दोनों को बनाए रखता है।
- source_word: καθὼς δεῖ γνῶναι
  choice: उस रीति से ... जिस रीति से जानना चाहिए
  rationale: यह जानने के अपेक्षित ढंग या मानक को स्पष्ट करता है और δεῖ की नैतिक/उचित आवश्यकता को 'चाहिए' से व्यक्त करता है।
theological_decisions:
- issue: पौलुस की आलोचना का स्वरूप
  choice: घमंड-भरे ज्ञान-दावे की आलोचना, न कि हर प्रकार के ज्ञान का निषेध
  alternative: मानवीय ज्ञान का पूर्ण निषेध
  rationale: वाक्य यह नहीं कहता कि व्यक्ति बिल्कुल कुछ नहीं जानता; वह कहता है कि उसने अभी उस रीति से नहीं जाना जिस रीति से जानना चाहिए।
- issue: τι का दायरा
  choice: कुछ
  alternative: कुछ भी
  rationale: '''कुछ'' ज्ञान के किसी विषय पर किए गए आत्मविश्वासी दावे को सीधा व्यक्त करता है और मूल की अनिश्चितता बनाए रखता है।'
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘उस रीति से ... जिस रीति से’ मूल के ढंग/मानक संबंधी बल को बनाए रखता है।
