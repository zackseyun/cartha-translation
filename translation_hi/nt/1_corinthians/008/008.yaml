  text: βρῶμα δὲ ἡμᾶς οὐ ⸀παραστήσει τῷ θεῷ· οὔτε ⸂γὰρ ἐὰν φάγωμεν, περισσεύομεν, οὔτε ἐὰν μὴ φάγωμεν, ὑστερούμεθα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/008.yaml
  text: But food will not commend us to God[a]; for neither if we eat do we abound[b], nor if we do not eat do we lack.
translation:
  language: hi
  text: परन्तु भोजन हमें परमेश्वर के निकट नहीं लाएगा[a]; क्योंकि न तो यदि हम खाएँ, तो हमें कुछ अधिक मिलता है[b], और न यदि हम न खाएँ, तो हमारी कोई कमी होती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भोजन हमें परमेश्वर के सामने स्वीकार्य नहीं ठहराएगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “न तो खाने से हम बेहतर स्थिति में होते हैं, और न न खाने से बदतर स्थिति में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα
  choice: भोजन
  rationale: यह सामान्य रूप से खाने की वस्तु को दर्शाता है, किसी विशेष भोजन या केवल मांस को नहीं।
- source_word: παραστήσει
  choice: सामने स्वीकार्य ठहराएगा
  rationale: परमेश्वर के सम्मुख व्यक्ति की स्थिति या स्वीकृति का भाव व्यक्त करता है, जबकि केवल शारीरिक रूप से प्रस्तुत करने का अर्थ नहीं देता।
- source_word: τῷ θεῷ
  choice: परमेश्वर के सामने
  rationale: παραστήσει के साथ दत्तिव को स्वाभाविक हिन्दी में परमेश्वर के सम्मुख स्थिति के रूप में व्यक्त करता है।
- source_word: περισσεύομεν
  choice: हमें कोई बढ़त होती है
  rationale: यहाँ आशय अधिकता या लाभ से है; यह शब्द खाने से आध्यात्मिक या नैतिक श्रेष्ठता होने की बात अनावश्यक रूप से नहीं जोड़ता।
- source_word: ὑστερούμεθα
  choice: हमें कोई कमी होती है
  rationale: कमी या वंचित होने का भाव रखता है और पिछले खंड की ‘बढ़त’ के साथ स्पष्ट समानांतर बनाता है।
- source_word: δὲ
  choice: परन्तु
  rationale: पिछली चर्चा के साथ हल्का विरोध दर्शाता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पहले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है।
theological_decisions:
- issue: क्या पौलुस अनुष्ठानिक स्वीकार्यता की बात करता है या सामान्य आत्मिक लाभ की
  choice: भोजन अपने आप किसी व्यक्ति को परमेश्वर के सामने स्वीकार्य नहीं बनाता और खाने या न खाने से अपने आप कोई बढ़त या कमी नहीं होती।
  alternative: भोजन केवल अपने भीतर कोई धार्मिक मूल्य नहीं रखता, विशेषकर विवेक और प्रेम से अलग होकर।
  rationale: निकटवर्ती प्रसंग मूर्तियों को चढ़ाए गए भोजन और विश्वासियों के विवेक से जुड़ा है, पर पद की भाषा स्वयं खाने और न खाने से होने वाली बढ़त या कमी को नकारती है। अनुवाद इस व्यापक कथन को बनाए रखता है, बिना किसी विशिष्ट पंथगत व्याख्या को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्वाभाविक शैली रखी गई है। ‘बढ़त’ और ‘कमी’ मूल के समानांतर विरोध को स्पष्ट रखते हैं; मुख्य पाठ का [a] और [b] प्रत्येक पादटिप्पणी से मेल खाता है।
