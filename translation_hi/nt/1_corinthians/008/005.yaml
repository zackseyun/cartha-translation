source:
  edition: SBLGNT
  text: καὶ γὰρ εἴπερ εἰσὶν λεγόμενοι θεοὶ εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς, ὥσπερ εἰσὶν θεοὶ πολλοὶ καὶ κύριοι πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/005.yaml
  text: For even if there are so-called gods[b][a], whether in heaven or on earth—as indeed there are many gods and many lords—
translation:
  language: hi
  text: क्योंकि यदि ‘ईश्वर’ कहलाने वाले हों भी—चाहे आकाश में, चाहे पृथ्वी पर—जैसा कि बहुत-से ‘ईश्वर’ और बहुत-से ‘प्रभु’ हैं—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि
  rationale: यह पद पिछले कथन का स्पष्टीकरण देता है। हिन्दी में ‘क्योंकि’ γάρ की व्याख्यात्मक कड़ी को स्वाभाविक रूप से व्यक्त करता है; καί का हल्का बल पूरे सशर्त वाक्य से प्रकट होता है।
- source_word: εἴπερ
  choice: यदि
  rationale: यह तर्क के लिए स्वीकार की गई शर्त प्रस्तुत करता है। ‘यदि’ आधुनिक हिन्दी में स्वाभाविक है और कथन को तथ्य के रूप में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: λεγόμενοι θεοὶ
  choice: ऐसे हैं जिन्हें ‘ईश्वर’ कहा जाता है
  rationale: यह यूनानी कृदन्त के मूल अर्थ ‘कहे/पुकारे जाने वाले’ को सुरक्षित रखता है। उद्धरण-चिह्न पौलुस की दूरी का संकेत देते हैं, पर व्याकरण में निहित संभावित तटस्थ अर्थ को समाप्त नहीं करते।
- source_word: εἴτε ἐν οὐρανῷ εἴτε ἐπὶ γῆς
  choice: आकाश में या पृथ्वी पर
  rationale: यह दोनों क्षेत्रों के व्यापक विरोध को स्पष्ट और सहज हिन्दी में बनाए रखता है। यहाँ ‘आकाश’ कथित दिव्य प्राणियों के ऊपरी क्षेत्र को सूचित कर सकता है।
- source_word: ὥσπερ
  choice: और वास्तव में
  rationale: यह कथित देवताओं और प्रभुओं की बहुलता के सामाजिक-धार्मिक तथ्य की पुष्टिपरक स्वीकृति व्यक्त करता है, बिना उन्हें सच्चे ईश्वर के समान ठहराए।
- source_word: θεοὶ πολλοὶ
  choice: बहुत-से ईश्वर
  rationale: बहुवचन को सीधे रखा गया है। संदर्भ और उद्धरण-चिह्न स्पष्ट करते हैं कि ये लोगों द्वारा ईश्वर माने या कहे जाने वाले हैं।
- source_word: κύριοι πολλοί
  choice: बहुत-से प्रभु
  rationale: κύριος के धार्मिक और अधिकारसूचक अर्थ को ‘प्रभु’ सुरक्षित रखता है तथा अगले पद के ‘एक प्रभु’ से शब्दगत संबंध बनाए रखता है।
theological_decisions:
- issue: मूर्तिपूजक देवताओं से पौलुस की अलंकारिक दूरी
  choice: ‘ईश्वर’ को उद्धरण-चिह्नों में रखकर ‘जिन्हें ... कहा जाता है’
  alternative: ‘तथाकथित देवता’
  rationale: मूल λεγόμενοι का अर्थ ‘कहे जाने वाले’ या प्रसंगानुसार ‘तथाकथित’ हो सकता है। मुख्य पाठ शाब्दिक अस्पष्टता बनाए रखता है, जबकि उद्धरण-चिह्न और पादटिप्पणी पौलुस की दूरी दिखाते हैं।
- issue: बहुत-से κύριοι और पद 6 के एक प्रभु के बीच अंतर
  choice: बहुत-से प्रभु
  alternative: बहुत-से स्वामी
  rationale: ‘प्रभु’ एक ही यूनानी पद के साथ शब्दगत निरंतरता रखता है। पादटिप्पणी स्पष्ट करती है कि यहाँ लोगों द्वारा यह उपाधि दिए गए प्राणी या शक्तियाँ अभिप्रेत हैं, न कि पद 6 का एक सच्चा प्रभु।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद मूल वाक्य की अपूर्ण, अगले पद की ओर बढ़ती संरचना को दीर्घ विराम से बनाए रखता है। ‘ईश्वर’ के बहुवचन का प्रयोग जानबूझकर मूल θεοί से शब्दगत साम्य और पद 6 के विरोध को सुरक्षित रखता है।
