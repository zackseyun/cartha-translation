id: 1CO.8.13
reference: 1 Corinthians 8:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διόπερ εἰ βρῶμα σκανδαλίζει τὸν ἀδελφόν μου, οὐ μὴ φάγω κρέα εἰς τὸν αἰῶνα, ἵνα μὴ τὸν ἀδελφόν μου σκανδαλίσω.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/013.yaml
  text: Therefore, if food causes my brother to stumble, I will certainly never eat meat forever, so that I may not cause my brother to stumble.
translation:
  language: hi
  text: इसलिए, यदि भोजन मेरे भाई के ठोकर खाने का कारण बनता है, तो मैं फिर कभी मांस नहीं खाऊँगा, ताकि मैं अपने भाई के ठोकर खाने का कारण न बनूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρῶμα
  choice: भोजन
  rationale: यह सामान्य रूप से खाने की वस्तु या भोजन को दर्शाता है; इसे पहले ही उल्लेख में केवल ‘मांस’ तक सीमित नहीं किया गया।
- source_word: σκανδαλίζει / σκανδαλίσω
  choice: ठोकर खाने का कारण बनता है / ठोकर खाने का कारण बनूँ
  rationale: मूल की ठोकर वाली रूपक-भाषा और किसी दूसरे को विश्वास या आचरण में गिराने की आशंका—दोनों को बनाए रखता है; केवल भावनाएँ आहत करने का अर्थ नहीं देता।
- source_word: κρέα
  choice: मांस
  rationale: यह βρῶμα से अधिक विशिष्ट है और यहाँ मांस के लिए प्रयुक्त हुआ है।
- source_word: οὐ μὴ ... εἰς τὸν αἰῶνα
  choice: फिर कभी ... नहीं खाऊँगा
  rationale: οὐ μὴ की प्रबल नकारात्मकता और εἰς τὸν αἰῶνα की स्थायी अवधि को स्वाभाविक आधुनिक हिन्दी में दृढ़ प्रतिज्ञा के रूप में व्यक्त करता है।
- source_word: ἀδελφόν
  choice: भाई
  rationale: मूल का संबंधपरक और एकवचन रूप सुरक्षित रहता है; प्रसंग में यह मसीही समुदाय के एक साथी सदस्य को सूचित करता है।
theological_decisions:
- issue: σκανδαλίζω में ‘ठेस पहुँचाना’ और आत्मिक/नैतिक रूप से गिराना
  choice: ठोकर खाने का कारण बनना
  alternative: पाप में गिराना / ठेस पहुँचाना
  rationale: चुना गया रूप मूल रूपक को बनाए रखता है और अर्थ को न तो केवल भावनात्मक अपमान तक सीमित करता है, न ही हर स्थिति में निश्चित पाप तक बढ़ाता है।
- issue: मांस न खाने की अवधि
  choice: फिर कभी मांस नहीं खाऊँगा
  alternative: सदा तक मांस नहीं खाऊँगा
  rationale: यह पौलुस की अत्यंत दृढ़, आजीवन त्याग की प्रतिज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है; ‘सदा तक’ हिन्दी में अनावश्यक रूप से ब्रह्मांडीय या परलोकगत अर्थ दे सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भोजन’ और ‘मांस’ के बीच मूल का अंतर सुरक्षित है, तथा दोनों बार σκανδαλίζω का समान अनुवाद रखकर पद की पुनरुक्ति और बल बनाए गए हैं।
