source:
  edition: SBLGNT
  text: ἀλλ’ ἡμῖν εἷς θεὸς ὁ πατήρ, ἐξ οὗ τὰ πάντα καὶ ἡμεῖς εἰς αὐτόν, καὶ εἷς κύριος Ἰησοῦς Χριστός, δι’ οὗ τὰ πάντα καὶ ἡμεῖς δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/006.yaml
  text: yet for us there is one God[a], the Father, from whom are all things and we for him, and one Lord, Jesus the Messiah[c][b], through whom are all things and we through him.
translation:
  language: hi
  text: फिर भी हमारे लिए एक ही परमेश्वर है—पिता, जिससे सब कुछ है और हम उसी के लिए हैं[a]; और एक ही प्रभु है—यीशु मसीह[b], जिसके द्वारा सब कुछ है और हम भी उसी के द्वारा हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और हम उसी की ओर हैं।” यूनानी पदबंध दिशा, लक्ष्य या उद्देश्य व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी Χριστός एक पदवी (“मसीह”) है, पर कुछ संदर्भों में यह नाम के समान “क्राइस्ट” के रूप में भी प्रयुक्त होता है।
    reason: alternative_reading
  - marker: c
    text: “जिससे सब कुछ है” और “जिसके द्वारा सब कुछ है” वाक्यांश पिता को स्रोत और यीशु मसीह को मध्यस्थ के रूप में अलग-अलग संबंधों में प्रस्तुत करते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: फिर भी
  rationale: यह पिछले कथन के विपरीत विश्वासियों की स्वीकारोक्ति प्रस्तुत करता है; ‘फिर भी’ विरोध के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡμῖν
  choice: हमारे लिए
  rationale: यह संबंध अथवा दृष्टिकोण बताने वाला सम्प्रदान है और पौलुस के समुदाय की स्वीकारोक्ति को दर्शाता है।
- source_word: εἷς θεὸς ὁ πατήρ
  choice: एक ही परमेश्वर है—पिता
  rationale: ‘एक ही’ संख्या और विशिष्टता दोनों पर बल देता है; ‘पिता’ परमेश्वर की निश्चित पहचान के रूप में रखा गया है।
- source_word: ἐξ οὗ τὰ πάντα
  choice: जिससे सब कुछ है
  rationale: ἐξ स्रोत या उद्गम दर्शाता है। हिन्दी में यह वाक्यांश पिता को सबका स्रोत बताते हुए यूनानी की संक्षिप्तता बनाए रखता है।
- source_word: καὶ ἡμεῖς εἰς αὐτόν
  choice: और हम उसी के लिए हैं
  rationale: εἰς दिशा, लक्ष्य या उद्देश्य व्यक्त कर सकता है। ‘उसी के लिए’ मनुष्यों के परमेश्वर की ओर लक्ष्यित अस्तित्व को सहज हिन्दी में व्यक्त करता है, जबकि मूल की कुछ व्यापकता बनी रहती है।
- source_word: καὶ εἷς κύριος
  choice: और एक ही प्रभु है
  rationale: यह ‘एक ही परमेश्वर’ के समानांतर संरचना और κύριος के धर्मवैचारिक भार को सुरक्षित रखता है।
- source_word: Ἰησοῦς Χριστός
  choice: यीशु मसीह
  rationale: हिन्दी बाइबलीय प्रयोग में ‘मसीह’ Χριστός के पदवीगत अर्थ को स्वाभाविक रूप से व्यक्त करता है और नाम-सदृश प्रचलित प्रयोग में भी समझा जाता है।
- source_word: δι’ οὗ τὰ πάντα
  choice: जिसके द्वारा सब कुछ है
  rationale: διά + संबंधकारक माध्यम अथवा मध्यस्थ कर्तृत्व दर्शाता है; ‘के द्वारा’ यीशु मसीह की मध्यस्थ भूमिका को बनाए रखता है।
- source_word: καὶ ἡμεῖς δι’ αὐτοῦ
  choice: और हम भी उसी के द्वारा हैं
  rationale: मूल में क्रिया लुप्त है। ‘हैं’ जोड़ना हिन्दी वाक्य के लिए आवश्यक है, पर अस्तित्व, जीवन या उद्धार में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: ‘एक ही परमेश्वर’ और ‘एक ही प्रभु’ का संबंध
  choice: दोनों समानांतर स्वीकारोक्तियों को पूर्ण भार के साथ रखा गया है और पिता तथा यीशु मसीह के बीच भेद भी बनाए रखा गया है।
  alternative: ‘प्रभु’ को हल्का करना, या बाद की त्रिएक शब्दावली को पद में स्पष्ट रूप से जोड़ देना।
  rationale: मूल पाठ एकेश्वरवादी स्वीकारोक्ति में पिता और यीशु मसीह दोनों को रखता है, साथ ही ‘जिससे’ और ‘जिसके द्वारा’ से संबंधगत भेद करता है। अनुवाद इस धर्मवैचारिक तनाव को समझाकर समाप्त नहीं करता।
- issue: पिता और पुत्र से संबंधित पूर्वसर्ग
  choice: ἐξ को ‘जिससे’, εἰς को ‘के लिए’, और διά को ‘के द्वारा’ अनूदित किया गया है।
  alternative: εἰς को ‘की ओर’ अथवा διά को केवल ‘से’ कहना।
  rationale: अलग-अलग पूर्वसर्ग पिता को स्रोत और लक्ष्य तथा यीशु मसीह को मध्यस्थ के रूप में प्रस्तुत करते हैं; उनका भेद बनाए रखना पाठ की संरचना के लिए महत्त्वपूर्ण है।
- issue: अंतिम खंड में निहित क्रिया का अर्थ
  choice: ‘हम भी उसी के द्वारा हैं’ कहकर अस्पष्टता बनाए रखी गई है।
  alternative: ‘हमारा सृजन हुआ’, ‘हम जीवित हैं’, या ‘हमारा उद्धार हुआ’ जैसा विशिष्ट अर्थ जोड़ना।
  rationale: यूनानी में केवल ‘और हम उसके द्वारा’ है; संदर्भ कई संबंधित अर्थों की अनुमति देता है। किसी एक को चुनना मूल से अधिक निश्चित होना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप अपनाया गया है। समानांतर संरचना को डैश और दोहराए गए ‘एक ही’ से स्पष्ट किया गया है। ‘परमेश्वर’, ‘पिता’, ‘प्रभु’ और ‘मसीह’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; अत्यधिक संस्कृतनिष्ठ या किसी सम्प्रदाय-विशेष की व्याख्यात्मक भाषा से बचा गया है।
