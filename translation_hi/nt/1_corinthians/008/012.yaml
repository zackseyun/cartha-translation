source:
  edition: SBLGNT
  text: οὕτως δὲ ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς καὶ τύπτοντες αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν εἰς Χριστὸν ἁμαρτάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/012.yaml
  text: And so[a], by sinning against the brothers in this way and wounding their weak conscience[c][b], you are sinning against Messiah.
translation:
  language: hi
  text: इस प्रकार भाइयों[a] के विरुद्ध पाप करके और उनके निर्बल विवेक को चोट पहुँचाकर, तुम मसीह[b] के विरुद्ध पाप करते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘भाइयों’ से आशय संगी विश्वासियों से है; संदर्भ में पुरुष और स्त्री दोनों सम्मिलित हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘ख्रीष्ट’। यूनानी पदवी Χριστός है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως δὲ
  choice: इस प्रकार
  rationale: यह पद पिछले प्रसंग में बताए गए आचरण की ओर लौटकर उसके परिणाम को सामने रखता है। ‘इस प्रकार’ उस संबंध को स्वाभाविक और संक्षिप्त हिंदी में व्यक्त करता है।
- source_word: ἁμαρτάνοντες εἰς τοὺς ἀδελφοὺς
  choice: भाइयों के विरुद्ध पाप करके
  rationale: कृदंत ἁμαρτάνοντες मुख्य क्रिया की परिस्थिति या रीति बताता है, और εἰς यहाँ विरोध की दिशा प्रकट करता है; इसलिए ‘के विरुद्ध पाप करके’ उपयुक्त है।
- source_word: ἀδελφοὺς
  choice: भाइयों
  rationale: यूनानी शब्द पुल्लिंग बहुवचन है। पत्र के कलीसियाई संदर्भ में यह संगी विश्वासियों के लिए प्रयुक्त है और स्त्रियों को भी सम्मिलित कर सकता है; इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: τύπτοντες
  choice: चोट पहुँचाकर
  rationale: τύπτω का मूल बिंब प्रहार करने का है, पर यहाँ विवेक के संबंध में रूपकात्मक प्रयोग हुआ है। ‘चोट पहुँचाकर’ उसकी तीव्रता और स्वाभाविक हिंदी दोनों बनाए रखता है।
- source_word: αὐτῶν τὴν συνείδησιν ἀσθενοῦσαν
  choice: उनके निर्बल विवेक
  rationale: यूनानी में ‘विवेक’ एकवचन है और ἀσθενοῦσαν उसकी निर्बल अवस्था बताता है। हिंदी में ‘उनके निर्बल विवेक’ स्रोत की संख्या और अर्थ को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: εἰς Χριστὸν ἁμαρτάνετε
  choice: मसीह के विरुद्ध पाप करते हो
  rationale: εἰς यहाँ फिर विरोध की दिशा बताता है। Χριστός को उसके पदवीगत अर्थ के अनुरूप ‘मसीह’ रखा गया है, और वर्तमानकालीन क्रिया को ‘पाप करते हो’ से व्यक्त किया गया है।
theological_decisions:
- issue: कलीसियाई संदर्भ में ἀδελφοὺς का दायरा
  choice: भाइयों
  alternative: भाई-बहनों / संगी विश्वासियों
  rationale: मुख्य पाठ यूनानी के व्याकरणिक पुल्लिंग बहुवचन को सुरक्षित रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि संदर्भ में यह सभी संगी विश्वासियों को समाहित कर सकता है।
- issue: Χριστόν का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट / क्राइस्ट
  rationale: यह यूनानी पदवी Χριστός के अभिषिक्त जन संबंधी अर्थ को हिंदी की स्थापित बाइबलीय संज्ञा ‘मसीह’ से व्यक्त करता है; इसे केवल निजी नाम मानकर अर्थ को दबाया नहीं गया है।
- issue: निर्बल विवेक को चोट पहुँचाना और मसीह के विरुद्ध पाप करना
  choice: दोनों कथनों का सीधा कारणात्मक-नैतिक संबंध बनाए रखा गया
  alternative: इसे केवल समुदाय या मसीह की देह के विरुद्ध अपराध कहकर व्याख्यायित करना
  rationale: पाठ स्वयं संगी विश्वासी के विरुद्ध पाप को मसीह के विरुद्ध पाप घोषित करता है, पर उस संबंध की व्याख्या नहीं करता। अनुवाद इस धर्मवैज्ञानिक तनाव को बिना अतिरिक्त सिद्धांत जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और प्रत्यक्ष वाक्य-विन्यास रखा गया है। ‘चोट पहुँचाकर’ रूपक की तीव्रता को बनाए रखते हुए ‘विवेक पर प्रहार करके’ की अपेक्षा अधिक स्वाभाविक है।
