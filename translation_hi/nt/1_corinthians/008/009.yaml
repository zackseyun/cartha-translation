id: 1CO.8.9
reference: 1 Corinthians 8:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: βλέπετε δὲ μή πως ἡ ἐξουσία ὑμῶν αὕτη πρόσκομμα γένηται τοῖς ⸀ἀσθενέσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_corinthians/008/009.yaml
  text: But take care that this right of yours does not somehow become a stumbling block to the weak[a][b].
translation:
  language: hi
  text: पर सावधान रहो कि तुम्हारा यह अधिकार[a] कहीं निर्बलों के लिए ठोकर का कारण न बन जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी यह स्वतंत्रता।” यूनानी शब्द का अर्थ “अधिकार,” “हक,” या “स्वतंत्रता” हो सकता है; यहाँ इसका संबंध उस छूट से है जिसका दावा कुछ विश्वासी मूर्तियों से संबंधित भोजन खाने के विषय में करते थे।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “निर्बल” वे लोग हैं जिनका विवेक इस विषय में कमजोर है।
    reason: cultural_note
lexical_decisions:
- source_word: βλέπετε
  choice: सावधान रहो
  rationale: यह आज्ञार्थक क्रिया सतर्क रहने की चेतावनी देती है; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले विचार से हल्का विरोध और चेतावनी की ओर मोड़ दर्शाता है।
- source_word: μή πως
  choice: कहीं ... न
  rationale: यह संभावित नकारात्मक परिणाम से बचने की सावधानी को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἡ ἐξουσία ὑμῶν αὕτη
  choice: तुम्हारा यह अधिकार
  rationale: प्रसंग में यह मूर्तियों से संबंधित भोजन खाने की मानी हुई छूट या अधिकार को दर्शाता है; 'अधिकार' ठोस दावे को व्यक्त करता है, जबकि अन्य अर्थ फुटनोट में सुरक्षित हैं।
- source_word: πρόσκομμα
  choice: ठोकर का कारण
  rationale: यह मूल रूपक बनाए रखता है और ऐसी बात का अर्थ देता है जो किसी को आत्मिक या नैतिक रूप से गिरा सकती है।
- source_word: γένηται
  choice: बन जाए
  rationale: संभावित परिणाम को सरल और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τοῖς ἀσθενέσιν
  choice: निर्बलों के लिए
  rationale: मूल की संक्षिप्तता बनाए रखी गई है; अध्याय के प्रसंग में ये इस विषय में कमजोर विवेक वाले विश्वासी हैं।
theological_decisions:
- issue: प्रसंग में ἐξουσία का अर्थ
  choice: मूर्तियों को चढ़ाए गए भोजन के संबंध में कुरिन्थियों का माना हुआ अधिकार या छूट
  alternative: सामान्य अधिकार, सामर्थ्य या स्वतंत्रता
  rationale: पहला कुरिन्थियों 8 का निकट प्रसंग भोजन और मूर्तियों से संबंधित आचरण पर केंद्रित है। 'अधिकार' व्यावहारिक नैतिक प्रश्न को स्पष्ट रखता है, और 'स्वतंत्रता' को वैकल्पिक अर्थ के रूप में फुटनोट में देता है।
- issue: τοῖς ἀσθενέσιν का आशय
  choice: इस विषय में कमजोर विवेक वाले विश्वासी
  alternative: सामान्य अर्थ में निर्बल या शारीरिक रूप से कमजोर लोग
  rationale: अध्याय में 'निर्बल' उन लोगों के लिए प्रयुक्त है जिनका विवेक इस मामले में संवेदनशील और आसानी से आहत होने वाला है। मुख्य पाठ मूल की संक्षिप्त अभिव्यक्ति रखता है और फुटनोट प्रसंग स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सम्मानपूर्ण किंतु सहज शैली अपनाई गई है। 'कहीं ... न' चेतावनी की स्वाभाविक हिंदी संरचना है। 'ठोकर का कारण' पौलुस के रूपक को बनाए रखता है। सभी फुटनोट-चिह्न मुख्य पाठ में दिए गए हैं।
