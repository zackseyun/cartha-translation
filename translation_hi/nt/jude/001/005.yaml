source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: I want to remind you[a], though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: hi
  text: हालाँकि आप यह सब एक बार जान चुके हैं, फिर भी मैं आपको याद दिलाना चाहता हूँ कि यीशु[a] ने मिस्र देश से एक प्रजा को बचाया था और बाद में उन लोगों को नष्ट कर दिया जिन्होंने विश्वास नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “यीशु” के स्थान पर “प्रभु” या “परमेश्वर” है।
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι
  choice: याद दिलाना
  rationale: यह βούλομαι के साथ प्रयुक्त अओरिस्ट infinitive का स्वाभाविक आधुनिक हिन्दी रूप है और पहले से ज्ञात बात को फिर स्मरण कराने का भाव रखता है।
- source_word: βούλομαι
  choice: मैं ... चाहता हूँ
  rationale: वक्ता की इच्छा को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  choice: हालाँकि आप ये सब बातें सदा के लिए जान चुके हैं
  rationale: Participial construction को प्रसंगानुसार concessive माना गया है। πάντα को प्रसंगगत ‘ये सब बातें’ और ἅπαξ को निर्णायक अथवा स्थायी ज्ञान के भाव में ‘सदा के लिए’ कहा गया है; ‘एक बार’ भी व्याकरणतः संभव है।
- source_word: Ἰησοῦς
  choice: यीशु
  rationale: दिए गए SBLGNT पाठ में Ἰησοῦς है, इसलिए मजबूत मसीही पहचान को बिना नरम किए सीधे अनूदित किया गया है।
- source_word: λαὸν
  choice: एक प्रजा
  rationale: अनिश्चित, सामूहिक संज्ञा का रूप बनाए रखता है और निर्गमन में इस्राएल की ओर संकेत करता है।
- source_word: ἐκ γῆς Αἰγύπτου
  choice: मिस्र देश से
  rationale: निर्गमन की बाइबलीय भाषा की प्रतिध्वनि रखते हुए वर्तमान हिन्दी में सहज है।
- source_word: σώσας
  choice: बचाने के बाद
  rationale: अओरिस्ट participle की मुख्य क्रिया से पूर्व घटित कार्रवाई को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ δεύτερον
  choice: बाद
  rationale: यहाँ इसके क्रमसूचक-कालगत अर्थ को ‘बचाने के बाद’ में समाहित किया गया है, जिससे पहले उद्धार और फिर विनाश का क्रम स्पष्ट होता है।
- source_word: τοὺς μὴ πιστεύσαντας
  choice: उन लोगों ... जिन्होंने विश्वास नहीं किया
  rationale: अविश्वास करने वाले समूह की पहचान को स्पष्ट रखता है और πιστεύω का स्थापित धार्मिक अर्थ बनाए रखता है।
- source_word: ἀπώλεσεν
  choice: नष्ट कर दिया
  rationale: दिव्य न्याय की कठोरता और अओरिस्ट क्रिया की पूर्ण घटना को सीधे व्यक्त करता है।
theological_decisions:
- issue: निर्गमन-वाक्य का मसीही कर्ता
  choice: मुख्य पाठ में ‘यीशु’
  alternative: ‘प्रभु’ या ‘परमेश्वर’
  rationale: प्रदत्त यूनानी पाठ Ἰησοῦς पढ़ता है। इसलिए निर्गमन में यीशु की सक्रियता के गहन धर्मवैज्ञानिक दावे को सुरक्षित रखा गया है; महत्त्वपूर्ण पाठांतर पादटिप्पणी में दिए गए हैं।
- issue: ἅπαξ का संबंध और अर्थ
  choice: जानने के साथ जोड़कर ‘सदा के लिए जान चुके हैं’
  alternative: ‘एक बार जान लिया था’
  rationale: शब्द-क्रम और प्रसंग इसे ज्ञान से जोड़ने की अनुमति देते हैं, पर ‘एक बार’ वाला कालगत अर्थ भी संभव है। मुख्य पाठ अंग्रेज़ी परामर्श-पाठ के निर्णायक भाव का अनुसरण करता है, बिना इसे सार्वज्ञान के दावे में बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘प्रजा’ निर्गमन-संबंधी सामूहिक अर्थ को बनाए रखता है। पादटिप्पणी-चिह्न मुख्य पाठ में ‘यीशु[a]’ के साथ उपस्थित है।
