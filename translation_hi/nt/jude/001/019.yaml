  yaml_path: translation/nt/jude/001/019.yaml
  text: These are the ones who cause divisions[a], worldly people[c][b], not having the Spirit.
translation:
  language: hi
  text: ये वे लोग हैं जो फूट डालते हैं[a], सांसारिक हैं और जिनके पास पवित्र आत्मा नहीं है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो अपने को अलग कर लेते हैं” अथवा “जो विभाजन पैदा करते हैं।”
    reason: lexical_alternative
  - marker: c
    text: या सामान्य अर्थ में “आत्मा”; प्रसंग में सम्भवतः पवित्र आत्मा अभिप्रेत है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοί
  choice: ये वे लोग हैं
  rationale: यह संकेतवाचक सर्वनाम पिछले प्रसंग में बताए गए घुस आए लोगों की ओर संकेत करता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: οἱ ἀποδιορίζοντες
  choice: जो फूट डालते हैं
  rationale: कृदन्त इन लोगों को उनके विभाजनकारी काम से पहचानता है। प्रसंग में सक्रिय रूप से फूट उत्पन्न करने का अर्थ अधिक सम्भावित है, जबकि स्वयं अलग हो जाने का अर्थ भी सम्भव है।
- source_word: ψυχικοί
  choice: सांसारिक
  rationale: यह शब्द अगले वाक्यांश में आत्मा के न होने के विपरीत रखा गया है और ऐसे लोगों को दर्शाता है जो केवल स्वाभाविक मानवीय जीवन से संचालित हैं। सरल आधुनिक हिन्दी में 'सांसारिक' इस भाव को संक्षेप में व्यक्त करता है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: यहाँ प्रसंग सम्भवतः पवित्र आत्मा की ओर संकेत करता है; देवनागरी में अक्षर-भेद से इसे चिह्नित करना स्वाभाविक नहीं, इसलिए व्याख्यात्मक स्पष्टता पादटिप्पणी में दी गई है।
- source_word: μὴ ἔχοντες
  choice: इनके पास ... नहीं है
  rationale: यह नकारात्मक कृदन्त का सीधा, स्वाभाविक हिन्दी रूप है और पिछले वर्णन से निकटता बनाए रखता है।
theological_decisions:
- issue: πνεῦμα का अभिप्राय
  choice: पवित्र आत्मा
  alternative: मानवीय आत्मा अथवा सामान्य अर्थ में आत्मा
  rationale: ψυχικοί के साथ तत्काल विरोध और यहूदा के व्यापक धार्मिक प्रसंग में पवित्र आत्मा का अर्थ अधिक सम्भावित है। फिर भी मूल में निश्चित उपपद नहीं है और 'आत्मा' का व्यापक अर्थ सम्भव है, इसलिए विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। मुख्य पाठ में विभाजनकारी क्रिया और पवित्र आत्मा का सम्भावित संदर्भ रखा गया है, जबकि वास्तविक शाब्दिक एवं व्याख्यात्मक विकल्प पादटिप्पणियों में सुरक्षित हैं।
