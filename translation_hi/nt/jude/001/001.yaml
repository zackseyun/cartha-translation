  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude[a], a servant of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah[c][b], called:'
translation:
  language: hi
  text: यीशु मसीह का दास और याकूब का भाई यहूदा की ओर से—उन लोगों के नाम जो परमेश्वर पिता में प्रिय हैं[b], यीशु मसीह के लिए सुरक्षित रखे गए हैं[a], और बुलाए गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु मसीह के द्वारा सुरक्षित रखे गए हैं।” यूनानी सम्प्रदान कारक का अर्थ यहाँ “के द्वारा” या “के लिए” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: कुछ पांडुलिपियों में “परमेश्वर पिता में पवित्र किए गए हैं” है।
    reason: textual_variant
lexical_decisions:
- source_word: δοῦλος
  choice: दास
  rationale: यह शब्द स्वामित्व और बँधी हुई सेवा का भाव रखता है। हिन्दी में ‘दास’ पत्र के आत्म-परिचय में निष्ठा और अधीनता दोनों को गरिमापूर्ण तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Χριστοῦ / Χριστῷ
  choice: मसीह
  rationale: Χριστός एक उपाधि है; हिन्दी का प्रचलित ‘मसीह’ उसके अभिषिक्त जन के अर्थ और बाइबलीय पहचान को बनाए रखता है।
- source_word: ἀδελφὸς δὲ Ἰακώβου
  choice: और याकूब के भाई
  rationale: δέ यहाँ प्रबल विरोध नहीं, बल्कि आत्म-परिचय का हल्का संयोजक है; ‘और’ हिन्दी में सहज है। Ἰάκωβος का स्रोत-समीप और हिन्दी में मान्य रूप ‘याकूब’ है।
- source_word: ἐν θεῷ πατρὶ
  choice: परमेश्वर पिता में
  rationale: ἐν के क्षेत्र अथवा संबंधसूचक भाव को ‘में’ सीधे सुरक्षित रखता है और इसे अनावश्यक रूप से ‘के द्वारा’ या ‘के लिए’ नहीं बनाता।
- source_word: ἠγαπημένοις
  choice: प्रेम किए गए हैं
  rationale: पूर्णकालिक कर्मवाच्य कृदन्त पहले किए गए प्रेम से बनी वर्तमान और स्थायी दशा बताता है; यह पद उस भाव को स्पष्ट रखता है।
- source_word: τετηρημένοις
  choice: सुरक्षित रखे गए हैं
  rationale: पूर्णकालिक कर्मवाच्य रूप संरक्षण की बनी हुई दशा दर्शाता है। ‘सुरक्षित रखे गए’ आधुनिक हिन्दी में स्पष्ट है और केवल भौतिक पहरे का संकेत नहीं देता।
- source_word: Ἰησοῦ Χριστῷ
  choice: यीशु मसीह के लिए
  rationale: सम्प्रदान कारक को उद्देश्य अथवा हित के अर्थ में लिया गया है; ‘के लिए’ इस सम्भावित संबंध को व्यक्त करता है, जबकि कर्तृत्ववाचक विकल्प पादटिप्पणी में रखा गया है।
- source_word: κλητοῖς
  choice: बुलाए हुओं
  rationale: विशेषण यहाँ संज्ञा की तरह पत्र पाने वालों को पहचान देता है। आरम्भ में ‘उन बुलाए हुओं के नाम’ रखने से यह संबोधन के केंद्र के रूप में स्पष्ट होता है और शेष दोनों वर्णन स्वाभाविक रूप से उससे जुड़ते हैं।
- source_word: Ἰούδας
  choice: यहूदा
  rationale: यह यूनानी नाम Ἰούδας का हिन्दी बाइबल परम्परा में प्रचलित रूप है और लेखक की पहचान को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: τετηρημένοις के साथ Ἰησοῦ Χριστῷ का संबंध
  choice: यीशु मसीह के लिए सुरक्षित रखे गए
  alternative: यीशु मसीह के द्वारा सुरक्षित रखे गए
  rationale: यूनानी सम्प्रदान कारक यहाँ लक्ष्य/हित (‘के लिए’) अथवा कर्ता (‘के द्वारा’) सूचित कर सकता है। मुख्य पाठ में सम्भावित लक्ष्यसूचक अर्थ अपनाया गया है और वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: ἠγαπημένοις का पाठ
  choice: प्रेम किए गए
  alternative: पवित्र किए गए
  rationale: प्रदत्त SBLGNT पाठ ἠγαπημένοις पढ़ता है, इसलिए मुख्य पाठ उसी का अनुवाद करता है। कुछ पांडुलिपियों का ἡγιασμένοις पाठ महत्वपूर्ण होने के कारण पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। यूनानी पत्रारम्भ को हिन्दी के स्वाभाविक ‘की ओर से—…के नाम’ ढाँचे में रखा गया है। ‘बुलाए हुओं’ को संबोधन का प्रधान पद बनाया गया है; ‘प्रेम किए गए’ और ‘सुरक्षित रखे गए’ उसके समानांतर वर्णन हैं।
