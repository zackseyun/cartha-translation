id: JUD.1.4
reference: Jude 1:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed[a], who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord[d][c][b], Jesus the Messiah.
translation:
  language: hi
  text: क्योंकि कुछ लोग चुपके से भीतर आ घुसे हैं[a]—ऐसे लोग, जिनके विषय में इस दण्ड के लिए बहुत पहले से लिख दिया गया था[b]। वे अधार्मिक हैं; वे हमारे परमेश्वर के अनुग्रह को लम्पटता में बदल देते हैं[c] और हमारे एकमात्र स्वामी और प्रभु, यीशु मसीह, का इनकार करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चोरी-छिपे घुस आए हैं।”
    reason: lexical_alternative
  - marker: b
    text: या, “जो बहुत पहले से इस दण्ड के लिए ठहराए गए थे।” यूनानी का अर्थ यह भी हो सकता है कि उनके विषय में इस दण्ड के संदर्भ में पहले ही लिख दिया गया था।
    reason: alternative_reading
  - marker: c
    text: या, “निर्लज्ज भोग-विलास” या “स्वच्छंदता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισέδυσαν
  choice: चुपके से भीतर आ घुसे हैं
  rationale: क्रिया चोरी-छिपे घुस आने और समुदाय में पैठ बना लेने का भाव देती है; वर्तमान पूर्ण रूप अतीत में हुए प्रवेश के वर्तमान प्रभाव को व्यक्त करता है।
- source_word: πάλαι προγεγραμμένοι
  choice: जिनके विषय में बहुत पहले से लिखा गया था
  rationale: προγράφω के मूल ‘पहले लिखना’ भाव को बनाए रखता है और पूर्वनियुक्ति का अधिक प्रबल अर्थ आरोपित नहीं करता।
- source_word: κρίμα
  choice: दण्ड
  rationale: यहाँ न्यायिक निर्णय के प्रतिकूल परिणाम का भाव प्रमुख है; ‘दण्ड’ सहज हिन्दी है, जबकि पादटिप्पणी में ‘न्याय-दण्ड’ का विकल्प दिया गया है।
- source_word: ἀσεβεῖς
  choice: भक्तिहीन
  rationale: परमेश्वर के प्रति श्रद्धा और भक्ति के अभाव को संक्षिप्त, dignified और प्रचलित बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: χάριτα
  choice: अनुग्रह
  rationale: परमेश्वर की कृपापूर्ण भलाई के लिए स्थापित और अर्थ-सटीक धर्मशास्त्रीय पद।
- source_word: μετατιθέντες εἰς
  choice: का ... बहाना बना देते हैं
  rationale: संदर्भ में अनुग्रह को अनैतिक आचरण की छूट में बदलने का आशय स्वाभाविक हिन्दी में व्यक्त होता है; शाब्दिक ‘में बदल देते हैं’ पादटिप्पणी में सुरक्षित है।
- source_word: ἀσέλγειαν
  choice: लम्पटता
  rationale: निर्लज्ज और विशेषतः कामुक स्वच्छंदता का बल बनाए रखता है, पर इसे किसी एक विशिष्ट कृत्य तक सीमित नहीं करता।
- source_word: μόνον δεσπότην καὶ κύριον
  choice: एकमात्र स्वामी और प्रभु
  rationale: 'दोनों अलग उपाधियों को बनाए रखता है: δεσπότης के लिए ‘स्वामी’ और κύριος के लिए ‘प्रभु’।'
- source_word: Ἰησοῦν Χριστόν
  choice: यीशु मसीह
  rationale: Χριστός की उपाधिगत पहचान को हिन्दी के स्वाभाविक और स्थापित ‘मसीह’ से व्यक्त करता है।
- source_word: ἀρνούμενοι
  choice: इनकार करते हैं
  rationale: विश्वास और आचरण में अधिकार को न मानने अथवा अस्वीकार करने का सीधा अर्थ देता है।
theological_decisions:
- issue: προγεγραμμένοι εἰς τοῦτο τὸ κρίμα का बल
  choice: बहुत पहले से इनके इस दण्ड के विषय में लिखा गया था
  alternative: इस दण्ड के लिए पहले से ठहराए गए थे
  rationale: मुख्य पाठ पूर्व-लिखित उल्लेख का स्वाभाविक अर्थ रखता है और व्यक्तिगत पूर्वनियति का अधिक प्रबल निष्कर्ष अनिवार्य नहीं बनाता; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: ‘एकमात्र स्वामी और प्रभु’ का संदर्भ
  choice: दोनों उपाधियाँ यीशु मसीह के लिए
  alternative: ‘स्वामी’ परमेश्वर पिता के लिए और ‘प्रभु’ यीशु मसीह के लिए
  rationale: यूनानी वाक्य-विन्यास में दोनों उपाधियों का एक साथ Ἰησοῦν Χριστόν से संबंध सबसे स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। लंबे यूनानी वाक्य को पठनीयता के लिए डैश और अर्धविराम से व्यवस्थित किया गया है। ‘अनुग्रह’, ‘प्रभु’ और ‘मसीह’ जैसे स्थापित पद बनाए रखे गए हैं; अस्पष्ट धर्मशास्त्रीय बिंदुओं को पादटिप्पणियों में सुरक्षित रखा गया है।
