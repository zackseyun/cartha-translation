source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ φυλάξαι ⸀ὑμᾶς ἀπταίστους καὶ στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/024.yaml
  text: To the one who is able to keep you from stumbling and to present you blameless before his glory with rejoicing[c][b][a],
translation:
  language: hi
  text: और जो तुम्हें ठोकर खाने से बचा सकता है[a] और अपनी महिमा के सामने तुम्हें निर्दोष[b] रूप में उल्लास के साथ खड़ा कर सकता है—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गिरने से बचा सकता है।’ यूनानी शब्द में ठोकर न खाने या न गिरने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बेदाग।’ यूनानी शब्द दोषरहित होने के साथ बलिदान के बेदाग होने का भाव भी जगा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ δὲ δυναμένῳ
  choice: और जो ... सकता है
  rationale: यह पद अगले पद में पूरी होने वाली स्तुतिवाणी का आरंभ है। ‘और जो ... सकता है’ यूनानी संबंधवाचक कृदंत की शक्ति को स्वाभाविक हिन्दी में रखता है; δέ को यहाँ हल्के संक्रमण के रूप में ‘और’ से व्यक्त किया गया है।
- source_word: φυλάξαι ὑμᾶς ἀπταίστους
  choice: तुम्हें ठोकर खाने से बचा सकता है
  rationale: ἀπταίστους का मूल बिंब ठोकर न खाने का है। हिन्दी में ‘ठोकर खाने से बचाना’ स्वाभाविक है और इसे केवल नैतिक निष्कलंकता या अंतिम पतन तक सीमित नहीं करता।
- source_word: καὶ στῆσαι
  choice: और ... खड़ा कर सकता है
  rationale: ἵστημι का मूल अर्थ खड़ा करना है। न्यायिक अथवा उपासना-संबंधी प्रस्तुति का भाव प्रसंग से स्पष्ट होता है, इसलिए मूल बिंब को हिन्दी में बनाए रखा गया है।
- source_word: κατενώπιον τῆς δόξης αὐτοῦ
  choice: अपनी महिमा के सामने
  rationale: यह यूनानी के ‘उसकी महिमा के सामने’ का निकट और स्वाभाविक हिन्दी रूप है। ‘महिमामय उपस्थिति’ जैसी व्याख्यात्मक वृद्धि नहीं की गई।
- source_word: ἀμώμους
  choice: निर्दोष
  rationale: यह शब्द दोषरहित अथवा बेदाग होने का भाव रखता है। ‘निर्दोष’ साधारण आधुनिक हिन्दी में बोधगम्य है; बलिदानी ‘बेदाग’ प्रतिध्वनि को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐν ἀγαλλιάσει
  choice: बड़े आनंद के साथ
  rationale: ἀγαλλίασις सामान्य प्रसन्नता से अधिक उल्लासपूर्ण आनंद सूचित करता है। हिन्दी में ‘बड़े आनंद के साथ’ इसका स्वाभाविक और गरिमापूर्ण रूप है।
theological_decisions:
- issue: ἀπταίστους को सामान्य ठोकर, पाप, या अंतिम पतन के रूप में सीमित करना
  choice: ठोकर खाने से
  alternative: गिरने से
  rationale: ‘ठोकर’ मूल रूपक और उसकी व्यापक धार्मिक अर्थ-संभावना को बनाए रखता है; अनुवाद यह तय नहीं करता कि यहाँ केवल दैनिक पाप या अंतिम धर्मत्याग अभिप्रेत है।
- issue: τῆς δόξης αὐτοῦ को शाब्दिक ‘उसकी महिमा’ या व्याख्यात्मक ‘उसकी महिमामय उपस्थिति’ कहना
  choice: अपनी महिमा के सामने
  alternative: अपनी महिमामय उपस्थिति में
  rationale: मूल पाठ में संज्ञा δόξα, ‘महिमा’, स्पष्ट है। चुना गया रूप परमेश्वर की उपस्थिति को नकारे बिना अनावश्यक व्याख्यात्मक विस्तार से बचता है।
- issue: ἀμώμους के नैतिक और बलिदानी अर्थ-संकेत
  choice: निर्दोष
  alternative: बेदाग
  rationale: ‘निर्दोष’ आधुनिक पाठक के लिए सहज है, जबकि ‘बेदाग’ की बलिदानी प्रतिध्वनि को पादटिप्पणी में दिया गया है ताकि किसी एक अर्थ को अंतिम न बनाया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। पद 24 वाक्य का आरंभ है और पद 25 में स्तुतिवाणी पूरी होती है, इसलिए अंत में दीर्घ विराम-चिह्न रखा गया है। सर्वनाम ‘तुम्हें’ बहुवचन समुदाय को संबोधित करता है।
