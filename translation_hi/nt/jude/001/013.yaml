source:
  edition: SBLGNT
  text: κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας, ἀστέρες πλανῆται οἷς ὁ ζόφος τοῦ σκότους εἰς αἰῶνα τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/013.yaml
  text: wild waves of the sea[a], foaming up their own shames; wandering stars[b], for whom the gloom of darkness has been reserved forever.
translation:
  language: hi
  text: समुद्र की उग्र लहरें, जो अपनी ही लज्जाओं को झाग की तरह उछालती हैं[a]; भटकते हुए तारे, जिनके लिए घोर अंधकार[b] सदा के लिए आरक्षित रखा गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी ही बदनामी उछालती हैं” या “अपने ही लज्जाजनक कामों को झाग की तरह उछालती हैं।” यूनानी में “लज्जाओं” का बहुवचन अपमान को भी और उन्हें उजागर करने वाले लज्जाजनक कामों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अंधकार की कालिमा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης
  choice: समुद्र की उग्र लहरें
  rationale: यह पदबंध समुद्र की प्रचंड और अनियंत्रित लहरों का सजीव रूपक बनाए रखता है; ‘उग्र’ आधुनिक हिन्दी में ‘wild/savage’ का स्वाभाविक और गरिमापूर्ण समतुल्य है।
- source_word: ἐπαφρίζοντα
  choice: झाग उछालती हैं
  rationale: वर्तमान कृदंत लहरों द्वारा लगातार झाग उत्पन्न करने या बाहर फेंकने की क्रिया दर्शाता है; ‘झाग उछालती हैं’ इस सक्रिय दृश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰς ἑαυτῶν αἰσχύνας
  choice: अपनी ही लज्जाओं का
  rationale: ‘अपनी ही’ आत्मवाचक बल को रखता है और असामान्य बहुवचन ‘लज्जाओं’ को बनाए रखता है, जिससे ‘अपमान’ और ‘लज्जाजनक कर्म’ दोनों अर्थों की संभावना खुली रहती है।
- source_word: ἀστέρες πλανῆται
  choice: भटकते हुए तारे
  rationale: यह प्राचीन आकाशीय रूपक को स्पष्ट रखता है और आधुनिक खगोलीय अर्थ में ‘ग्रह’ कहकर अनावश्यक सटीकता नहीं जोड़ता।
- source_word: οἷς
  choice: जिनके लिए
  rationale: संबंधवाचक सर्वनाम उन लोगों की ओर लौटता है जिन्हें रूपक में तारे कहा गया है; इसलिए व्यक्तिवाचक हिन्दी प्रयोग उपयुक्त है।
- source_word: ὁ ζόφος τοῦ σκότους
  choice: घोर अंधकार
  rationale: यह गहरे, भयावह अंधकार की संयुक्त छवि को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है; वैकल्पिक अधिक शाब्दिक छवि पादटिप्पणी में दी गई है।
- source_word: εἰς αἰῶνα
  choice: सदा के लिए
  rationale: न्याय के इस प्रसंग में यह वाक्यांश स्थायी, अनंत अवधि का स्वाभाविक संकेत देता है।
- source_word: τετήρηται
  choice: सुरक्षित रखा गया है
  rationale: पूर्ण निष्क्रिय रूप किसी पूर्व क्रिया से बनी वर्तमान स्थिति—पहले से अलग रखे और अब भी रखे होने—को दर्शाता है; ‘सुरक्षित रखा गया है’ हिन्दी में इस आरक्षित अवस्था को स्पष्ट करता है।
theological_decisions:
- issue: εἰς αἰῶνα में अंतिम न्याय की अवधि
  choice: सदा के लिए
  alternative: युग तक
  rationale: इस न्याय-संदर्भ में वाक्यांश का स्वाभाविक बल अनंत अवधि है। अनुवाद चेतावनी की गंभीरता रखता है, पर उसके आगे कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
- issue: αἰσχύνας के बहुवचन का आशय
  choice: लज्जाओं
  alternative: लज्जाजनक करतूतों / अपमान
  rationale: बहुवचन को मुख्य पाठ में बनाए रखने से यह अस्पष्टता सुरक्षित रहती है कि लेखक अपमान की अवस्थाओं की बात कर रहा है या उन्हें प्रकट करने वाले लज्जाजनक कर्मों की।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और चित्रात्मक रखी गई है। पद पिछले वाक्य की रूपक-श्रृंखला का अंश है, इसलिए आरंभ में पूर्ण वाक्य बनाने के लिए कोई अतिरिक्त कर्ता नहीं जोड़ा गया। असामान्य ‘लज्जाओं’ को जानबूझकर रखा गया है और पादटिप्पणी उसकी संभावित व्याख्याएँ बताती है।
