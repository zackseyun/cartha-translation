source:
  edition: SBLGNT
  text: οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ⸃, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/023.yaml
  text: save others by snatching them out of the fire[a]; and have mercy on others with fear[d][c][b], hating even the tunic stained by the flesh.
translation:
  language: hi
  text: दूसरों को आग में से खींच निकालकर बचाओ[a]; और दूसरों पर भय के साथ दया करो[b], यहाँ तक कि देह से दागदार हुए वस्त्र से भी घृणा करते हुए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूसरों को आग में से झपटकर छुड़ाओ।” आग की छवि आने वाले न्याय या घोर आत्मिक संकट की ओर संकेत कर सकती है।
    reason: alternative_reading
  - marker: b
    text: “भय के साथ” का अर्थ परमेश्वर के प्रति श्रद्धामय भय या इस सावधानी से हो सकता है कि दया करने वाला स्वयं भी दूषित न हो जाए।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “देह से दागदार वस्त्र से भी।” यहाँ “देह” नैतिक दूषण की ओर संकेत कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σῴζετε
  choice: बचाओ
  rationale: आज्ञार्थक भाव को सीधे व्यक्त करता है और उद्धार तथा तत्काल बचाव—दोनों अर्थ-छायाओं के लिए उपयुक्त है।
- source_word: ἐκ πυρὸς ἁρπάζοντες
  choice: आग में से झपटकर
  rationale: कृदंत बचाने के ढंग को बताता है; ‘झपटकर’ मूल की तात्कालिकता और बलपूर्वक खींच लेने की सजीव छवि बनाए रखता है।
- source_word: ἐλεᾶτε
  choice: दया करो
  rationale: आज्ञार्थक क्रिया का स्वाभाविक, सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: ἐν φόβῳ
  choice: भय के साथ
  rationale: परमेश्वर के प्रति श्रद्धामय भय और स्वयं दूषित हो जाने की सावधानी—दोनों संभावित अर्थों को खुला रखता है।
- source_word: μισοῦντες
  choice: घृणा करो
  rationale: मूल की तीव्र नैतिक अस्वीकृति को स्पष्ट रखता है, जबकि वाक्य में दया और दूषण से घृणा का तनाव बना रहता है।
- source_word: χιτῶνα
  choice: कुरते
  rationale: χίτων शरीर पर पहना जाने वाला भीतरी वस्त्र था; ‘कुरता’ सामान्य हिन्दी पाठक के लिए विशिष्ट वस्त्र-छवि देता है, यद्यपि पूर्ण ऐतिहासिक समानता का दावा नहीं करता।
- source_word: ἐσπιλωμένον
  choice: कलंकित हो गया है
  rationale: वस्त्र पर दाग और नैतिक दूषण—दोनों अर्थ-छायाओं को व्यक्त करता है तथा पूर्ण निष्क्रिय कृदंत की परिणामी अवस्था को रखता है।
- source_word: σάρξ
  choice: देह
  rationale: ‘पापी स्वभाव’ जैसी व्याख्यात्मक संज्ञा थोपे बिना σάρξ की मूल रूपकात्मक भाषा को बनाए रखता है; आधुनिक हिन्दी में ‘देह’ इस वाक्य में ‘मांस’ से अधिक स्वाभाविक है।
theological_decisions:
- issue: बचाव की छवि में ‘आग’ का आशय
  choice: मुख्य पाठ में केवल ‘आग’ की छवि रखी गई है।
  alternative: अंतिम न्याय की आग; वर्तमान घोर आत्मिक संकट
  rationale: यूनानी पाठ आग का आशय स्पष्ट नहीं करता; इसलिए अनुवाद भावी न्याय और वर्तमान विनाशकारी संकट के बीच निर्णय नहीं करता।
- issue: ἐν φόβῳ में भय का स्वरूप
  choice: ‘भय के साथ’ कहकर अर्थगत खुलापन रखा गया है।
  alternative: परमेश्वर का श्रद्धामय भय; दूषण से सतर्क भय
  rationale: दोनों अर्थ प्रसंग में संभव हैं और मुख्य पाठ किसी एक को निर्णायक रूप से स्थापित नहीं करता।
- issue: σάρξ का अर्थ
  choice: मुख्य पाठ में ‘देह’ रखा गया है।
  alternative: पापी स्वभाव
  rationale: यहाँ नैतिक दूषण निहित है, फिर भी ‘पापी स्वभाव’ अधिक व्याख्यात्मक है; ‘देह’ स्रोत की रूपकात्मक तनावपूर्ण भाषा सुरक्षित रखता है।
- issue: दया और दूषण से घृणा का संबंध
  choice: व्यक्ति पर दया और दूषण से घृणा—दोनों को साथ रखा गया है।
  alternative: घृणा को व्यक्ति की ओर निर्देशित समझना
  rationale: व्याकरण में घृणा का प्रत्यक्ष लक्ष्य कलंकित वस्त्र है, इसलिए पाठ दया पाने वाले व्यक्ति को घृणा का लक्ष्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और आज्ञार्थक रूप अपनाया गया है। ‘झपटकर’ तत्काल बचाव की सजीवता रखता है; ‘भय के साथ’ और ‘देह’ जानबूझकर व्याख्यात्मक रूप से खुले रखे गए हैं।
