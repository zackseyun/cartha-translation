source:
  edition: SBLGNT
  text: Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/017.yaml
  text: But you[a], beloved, remember the words spoken beforehand by the apostles of our Lord Jesus the Messiah.
translation:
  language: hi
  text: परन्तु, हे प्रिय जनो, तुम उन बातों को याद करो जो हमारे प्रभु यीशु मसीह[a] के प्रेरितों ने पहले कही थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु ख्रीस्त।”
    reason: ‘मसीह’ के लिए पारंपरिक वैकल्पिक हिन्दी रूप; यह अंग्रेज़ी audit trail में दिए गए ‘Jesus Christ’ विकल्प के अनुरूप है।
lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: पर ... तुम
  rationale: δέ के विरोधसूचक बल और Ὑμεῖς के स्पष्ट, बलाघाती संबोधन को स्वाभाविक हिन्दी में बनाए रखता है; इससे पिछले वर्णन के लोगों से पाठकों की ओर ध्यान मुड़ता है।
- source_word: ἀγαπητοί
  choice: हे प्रियो
  rationale: बहुवचन संबोधन की आत्मीयता और पत्रात्मक गरिमा दोनों व्यक्त होती हैं।
- source_word: μνήσθητε
  choice: याद रखो
  rationale: आज्ञार्थक भाव को सीधी और सहज आधुनिक हिन्दी में व्यक्त करता है; प्रसंग में पहले मिली शिक्षा को स्मरण रखने का आशय है।
- source_word: τῶν ῥημάτων
  choice: उन बातों को
  rationale: यहाँ ῥήματα बोले गए कथनों को सूचित करता है; हिन्दी में ‘बातों’ का प्रयोग ‘शब्दों’ की अपेक्षा अधिक स्वाभाविक है और अर्थ को सुरक्षित रखता है।
- source_word: τῶν προειρημένων
  choice: पहले ही कही थीं
  rationale: पूर्ण निष्क्रिय कृदंत का पूर्वकालिक भाव रखता है और इसे अनावश्यक रूप से भविष्यवाणी के अर्थ तक सीमित नहीं करता।
- source_word: ὑπὸ τῶν ἀποστόλων
  choice: प्रेरितों ने
  rationale: हिन्दी की स्वाभाविक कर्तृवाच्य रचना में साधनवाचक यूनानी पद को व्यक्त करता है; ‘प्रेरित’ ἀπόστολος का स्थापित बाइबलीय समतुल्य है।
- source_word: τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु के
  rationale: सम्बन्धकारक पद को सुरक्षित रखते हुए κύριος का प्रचलित और गरिमापूर्ण हिन्दी रूप देता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: यीशु का प्रचलित हिन्दी नाम और Χριστός का अर्थसूचक, स्थापित हिन्दी पद ‘मसीह’ रखा गया है।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστοῦ का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीस्त
  rationale: ‘मसीह’ Χριστός की पदवी का अर्थ हिन्दी पाठक के लिए स्पष्ट रखता है और आधुनिक हिन्दी बाइबल-प्रयोग में व्यापक रूप से परिचित है; किसी विशिष्ट सम्प्रदाय की शब्दावली आरोपित नहीं की गई।
- issue: προειρημένων का अर्थ
  choice: पहले ही कही थीं
  alternative: पहले से भविष्यवाणी की गई थीं
  rationale: मूल क्रिया पूर्व में कहे जाने या पहले से कहे जाने दोनों का बोध करा सकती है। इस प्रसंग में प्रेरितों की पूर्व चेतावनी प्रमुख है; ‘भविष्यवाणी’ जोड़ने से मूल की अपेक्षा अधिक निश्चित व्याख्या हो जाती।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘हे प्रियो’ पत्रात्मक आत्मीयता को बनाए रखता है, जबकि वाक्य-विन्यास साधारण हिन्दी पाठक के लिए सहज है।
