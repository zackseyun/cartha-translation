  terminology: ‘प्रेरित,’ ‘प्रभु,’ and ‘यीशु मसीह’ are established and suitable Hindi biblical terms. A footnote is needed to preserve the English audit trail’s lexical alternative for Χριστός; the alternative is presented only as a wording alternative, not as a theological distinction.
