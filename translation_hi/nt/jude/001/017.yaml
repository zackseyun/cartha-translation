    issue: The vocative ‘हे प्रियो’ is less natural than a fuller modern Hindi plural address.
    rationale: ‘हे प्रिय जनो’ retains the affectionate epistolary register of ἀγαπητοί without adding an interpretive category such as ‘brothers and sisters.’
