  to: एकमात्र परमेश्वर, हमारे उद्धारकर्ता को—हमारे प्रभु यीशु मसीह के द्वारा—महिमा, प्रताप, सामर्थ्य और अधिकार, समस्त काल से पहले, अब और युगानुयुग हो। आमीन।
