    text: शाब्दिक रूप से, “हर युग से पहले … सभी युगों तक।”
    reason: lexical_alternative
  revision_rationale: The revision makes the dative addressee explicit (“परमेश्वर … को”) and replaces the less fitting “बना रहे” with the conventional doxological ascription “हो.” It retains every element of the supplied Greek text and preserves the elevated register. The footnote records the more literal temporal wording reflected in the English audit trail.
