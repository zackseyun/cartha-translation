id: JUD.1.25
reference: Jude 1:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior[a], through Jesus the Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever[b]. Amen.
translation:
  language: hi
  text: एकमात्र परमेश्वर, हमारे उद्धारकर्ता को—हमारे प्रभु यीशु मसीह के द्वारा—महिमा, प्रताप, सामर्थ्य और अधिकार, समस्त काल से पहले, अब और युगानुयुग हो। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνῳ θεῷ
  choice: एकमात्र परमेश्वर
  rationale: यह पदबंध परमेश्वर की अद्वितीयता पर बल देता है; हिंदी में ‘एकमात्र परमेश्वर’ स्वाभाविक और स्पष्ट है।
- source_word: σωτῆρι ἡμῶν
  choice: हमारे उद्धारकर्ता
  rationale: σωτήρ का प्रचलित धर्मवैज्ञानिक अर्थ ‘उद्धारकर्ता’ है, जो छुटकारा और उद्धार दोनों का भाव रखता है।
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु यीशु मसीह के द्वारा
  rationale: διά के साथ संबंधकारक साधन अथवा मध्यस्थता व्यक्त करता है। ‘के द्वारा’ इस संबंध को स्पष्ट रखता है; Χριστός के शीर्षकीय अर्थ के लिए ‘मसीह’ स्वाभाविक हिंदी रूप है।
- source_word: δόξα
  choice: महिमा
  rationale: स्तुतिगान के संदर्भ में मानक और स्वाभाविक हिंदी समतुल्य।
- source_word: μεγαλωσύνη
  choice: प्रताप
  rationale: यह महानता और राजसी वैभव का भाव देता है; ‘प्रताप’ ऊँचे स्तुतिपरक स्तर को बनाए रखता है।
- source_word: κράτος
  choice: सामर्थ्य
  rationale: κράτος प्रकट शक्ति या प्रभुत्वकारी बल को दर्शाता है; ‘सामर्थ्य’ इसे ἐξουσία से अलग रखते हुए सहज हिंदी देता है।
- source_word: ἐξουσία
  choice: अधिकार
  rationale: यह वैध सत्ता अथवा अधिकार का संकेत देता है और κράτος के ‘सामर्थ्य’ से अर्थगत भेद बनाए रखता है।
- source_word: πρὸ παντὸς τοῦ αἰῶνος
  choice: समस्त काल से पहले
  rationale: यूनानी का शाब्दिक भाव ‘हर युग से पहले’ है; ‘समस्त काल से पहले’ आधुनिक हिंदी में कालपूर्व व्यापकता को स्पष्ट करता है।
- source_word: εἰς πάντας τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: शाब्दिक ‘सभी युगों तक’ का स्वाभाविक, प्रतिष्ठित और व्यापक हिंदी रूप।
theological_decisions:
- issue: स्तुतिगान में मध्यस्थतापरक पदबंध
  choice: स्तुति एकमात्र परमेश्वर, हमारे उद्धारकर्ता को संबोधित है और हमारे प्रभु यीशु मसीह के द्वारा अर्पित होती है।
  alternative: ‘के द्वारा’ को पद के अन्य भाग से कुछ ढीले रूप में जोड़ा जा सकता है, फिर भी वह यीशु की मध्यस्थता दर्शाता है।
  rationale: वाक्यरचना διὰ Ἰησοῦ Χριστοῦ को परमेश्वर को दी जाने वाली स्तुति से जोड़ती है; अनुवाद परमेश्वर पर केंद्रित संबोधन और यीशु की मध्यस्थ भूमिका दोनों को बिना मिलाए सुरक्षित रखता है।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट / क्राइस्ट
  rationale: ‘मसीह’ आधुनिक हिंदी में शीर्षक का स्थापित अर्थपूर्ण रूप है और इसे केवल निजी नाम बनाकर प्रस्तुत नहीं करता।
- issue: कालगत त्रिस्तरीय विस्तार
  choice: समस्त काल से पहले, अब और युगानुयुग
  alternative: हर युग से पहले, अब और सभी युगों तक
  rationale: यह अतीत-पूर्व, वर्तमान और अनंत भविष्य के मूल तनाव और विस्तार को स्वाभाविक हिंदी में बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण स्तुतिपरक शैली की है। डैश मध्यस्थतापरक पदबंध को स्पष्ट करता है, जबकि मूल वाक्य का प्रवाह बना रहता है। ‘बना रहे’ हिंदी में निहित स्तुतिपरक कामनार्थक क्रिया को व्यक्त करता है।
