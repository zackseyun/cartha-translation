  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain[a], but abandoned their proper dwelling[c][b], he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: hi
  text: और जिन स्वर्गदूतों ने अपने अधिकार-क्षेत्र को बनाए नहीं रखा,[a] बल्कि अपने निवास-स्थान को छोड़ दिया, उन्हें उसने उस महान दिन के न्याय के लिए घोर अंधकार के अधीन अनन्त बन्धनों में रखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने पद’ अथवा ‘अपने शासन-अधिकार को’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλους
  choice: स्वर्गदूतों
  rationale: न्याय के इस प्रसंग और यहूदी पृष्ठभूमि में यह शब्द अलौकिक प्राणियों को सूचित करता है; इसलिए सामान्य ‘दूतों’ की अपेक्षा ‘स्वर्गदूतों’ अधिक स्पष्ट है।
- source_word: τηρήσαντας / τετήρηκεν
  choice: बनाए नहीं रखा / रख छोड़ा है
  rationale: 'दोनों रूपों में एक ही यूनानी क्रिया की पुनरावृत्ति और विरोध को यथासंभव बनाए रखा गया है: उन्होंने अपना अधिकार-क्षेत्र बनाए नहीं रखा, इसलिए परमेश्वर ने उन्हें न्याय के लिए रख छोड़ा है।'
- source_word: τὴν ἑαυτῶν ἀρχὴν
  choice: अपने अधिकार-क्षेत्र
  rationale: ἀρχή यहाँ आरम्भ, पद, अधिकार या नियत क्षेत्र का बोध करा सकता है। ‘अधिकार-क्षेत्र’ किसी नियत क्षेत्र या स्थान की धारणा को व्यक्त करता है, पर ‘शासन’ या ‘आरम्भ’ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀπολιπόντας
  choice: छोड़ दिया
  rationale: यह स्वेच्छा से अलग होने का स्पष्ट और स्वाभाविक हिन्दी रूप है; दोषपूर्ण परित्याग का भाव प्रसंग से प्रकट होता है।
- source_word: τὸ ἴδιον οἰκητήριον
  choice: अपने निवास-स्थान
  rationale: οἰκητήριον रहने के स्थान को और ἴδιον उनके अपने अथवा उनसे सम्बद्ध स्थान को सूचित करता है। ‘अपने निवास-स्थान’ मूल अर्थ को बिना अतिरिक्त व्याख्या के रखता है।
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  choice: उस महान दिन के न्याय के लिए
  rationale: यह उद्देश्य अथवा परिणाम की दिशा और अन्तकालीन न्याय दोनों को व्यक्त करता है; ‘तक’ जोड़ने से बचा गया है क्योंकि वह εἰς की अपेक्षा अधिक व्याख्यात्मक होगा।
- source_word: δεσμοῖς ἀϊδίοις
  choice: अनन्त बन्धनों में
  rationale: ‘बन्धन’ δεσμός के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और ἀΐδιος की स्थायी अवधि के लिए ‘अनन्त’ मानक तथा स्पष्ट है।
- source_word: ὑπὸ ζόφον
  choice: घोर अंधकार में
  rationale: ζόφος साधारण अंधकार नहीं, बल्कि गहन और भयावह धुँधलके का बोध कराता है। ‘घोर अंधकार’ आधुनिक हिन्दी में इस तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τε
  choice: और
  rationale: यह पिछले न्याय-उदाहरण से इस उदाहरण को जोड़ता है; हिन्दी में ‘और’ सबसे स्वाभाविक संयोजक है।
theological_decisions:
- issue: स्वर्गदूतों के अपराध का आशय
  choice: पद को इतना ही कहने दिया गया है कि उन्होंने अपना अधिकार-क्षेत्र बनाए नहीं रखा और अपना निवास-स्थान छोड़ दिया।
  alternative: इसे उत्पत्ति 6 की परम्परा अथवा आदिकालीन स्वर्गदूतीय पतन के स्पष्ट उल्लेख के रूप में अनूदित करना।
  rationale: यहूदा संभवतः अपने पाठकों की परिचित यहूदी परम्परा की ओर संकेत करता है, पर यूनानी पद स्वयं उसकी पूरी पृष्ठभूमि स्पष्ट नहीं करता। इसलिए अनुवाद किसी एक व्याख्यात्मक रूपरेखा को मुख्य पाठ में नहीं जोड़ता।
- issue: ἀΐδιος की अवधि
  choice: अनन्त
  alternative: सदा रहनेवाले; चिरस्थायी
  rationale: यह शब्द निरन्तर और स्थायी अवधि का बोध कराता है। ‘अनन्त’ प्रचलित, गरिमापूर्ण और स्पष्ट है, जबकि बन्धनों के स्वरूप के विषय में पाठ से आगे कोई दार्शनिक दावा नहीं करता।
- issue: τετήρηκεν का अव्यक्त कर्ता
  choice: उन्हें उसने ... रख छोड़ा है
  alternative: परमेश्वर ने उन्हें ... रख छोड़ा है
  rationale: यूनानी में कर्ता क्रिया में निहित है और प्रसंग से परमेश्वर समझा जाता है। ‘उसने’ मूल की अन्तर्निहितता को बनाए रखता है और अनावश्यक रूप से नाम नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘अधिकार-क्षेत्र’, ‘निवास-स्थान’, ‘महान दिन’ और ‘घोर अंधकार’ न्यायपूर्ण तथा गम्भीर स्वर बनाए रखते हैं। मुख्य पाठ में केवल एक आवश्यक शब्दार्थ-संबंधी पाद-टिप्पणी रखी गई है; उसका चिह्न [a] पाठ में उपस्थित है।
