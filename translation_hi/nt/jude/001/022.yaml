lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सरल संयोजक इस उपदेश को आस-पास के उपदेशों से जोड़ता है।
- source_word: οὓς μὲν
  choice: जो … उन
  rationale: सम्बन्धवाचक सर्वनाम और μέν आगे आने वाले अलग समूहों में से पहले समूह का परिचय देते हैं। स्वाभाविक हिन्दी में ‘जो … उन’ इस सम्बन्ध को स्पष्ट करता है; μέν का अलग शाब्दिक अनुवाद आवश्यक नहीं है।
- source_word: ἐλεᾶτε
  choice: दया करो
  rationale: ἐλεάω का अर्थ दया या करुणा दिखाना है। ‘दया करो’ स्पष्ट, स्वाभाविक और आज्ञार्थक बल को बनाए रखता है।
- source_word: διακρινομένους
  choice: सन्देह में हैं
  rationale: इस कृदन्त का अर्थ सन्देह करना, डगमगाना अथवा विवाद करना हो सकता है। इस पासबानी सन्दर्भ में ‘सन्देह में हैं’ उपयुक्त है, पर वास्तविक बहुअर्थकता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: διακρινομένους का अर्थ और संकट में पड़े लोगों के प्रति पासबानी प्रतिक्रिया
  choice: जो सन्देह में हैं
  alternative: जो डगमगा रहे हैं; जो विवाद कर रहे हैं
  rationale: दया की आज्ञा के साथ ‘सन्देह में हैं’ उन लोगों को आत्मिक अनिश्चितता में दिखाता है, न कि अनिवार्य रूप से विरोधी। फिर भी यूनानी शब्द निर्णायक रूप से केवल यही अर्थ नहीं देता, इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रूप। ‘सन्देह’ मूल शब्द की प्रमुख व्याख्या व्यक्त करता है, जबकि पादटिप्पणी उसकी वास्तविक अर्थगत अस्पष्टता सुरक्षित रखती है।
