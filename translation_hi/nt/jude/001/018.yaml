base_translation:
  language: en
  yaml_path: translation/nt/jude/001/018.yaml
  text: that they were saying to you[a], “In the last time there will be mockers[b], going according to their own ungodly desires.”
translation:
  language: hi
  text: कि वे तुमसे कहते थे, “अंतिम समय में उपहास करने वाले[a] होंगे, जो अपनी ही अभक्तिपूर्ण इच्छाओं के अनुसार चलेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ठट्ठा उड़ाने वाले।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: कहा करते थे
  rationale: अपूर्ण भूतकाल बार-बार या लगातार कही गई बात का संकेत देता है; ‘कहा करते थे’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἐπ’ ἐσχάτου χρόνου
  choice: अन्तिम समय में
  rationale: मूल यूनानी में ‘समय’ एकवचन है। यह अनुवाद परिचित ‘अन्तिम दिनों’ से सामंजस्य बैठाए बिना उसी रूप और युगान्तीय आशय को बनाए रखता है।
- source_word: ἐμπαῖκται
  choice: उपहास करनेवाले
  rationale: यह आधुनिक पाठकों के लिए स्पष्ट और गरिमापूर्ण ढंग से तिरस्कारपूर्वक मज़ाक उड़ानेवालों का अर्थ देता है। ‘ठट्ठा करनेवाले’ को वैकल्पिक रूप में पादटिप्पणी में रखा गया है।
- source_word: κατὰ τὰς ἑαυτῶν ἐπιθυμίας
  choice: अपनी ... अभिलाषाओं के अनुसार
  rationale: κατά के अनुरूपता-सूचक अर्थ को ‘के अनुसार’ व्यक्त करता है। ‘अभिलाषाएँ’ शब्द को केवल यौन वासना तक सीमित नहीं करता।
- source_word: πορευόμενοι
  choice: चलेंगे
  rationale: शाब्दिक चलने की छवि और जीवन-आचरण के रूपक—दोनों को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τῶν ἀσεβειῶν
  choice: अभक्ति से भरी
  rationale: सम्बन्धकारक बहुवचन इच्छाओं के अभक्तिपूर्ण चरित्र को बताता है। यह रूप मूल के नैतिक-धार्मिक मूल्यांकन को स्पष्ट रखता है, बिना अभिलाषाओं को किसी एक प्रकार तक सीमित किए।
theological_decisions:
- issue: युगान्तीय अभिव्यक्ति
  choice: अन्तिम समय में
  alternative: अन्तिम दिनों में; समय के अन्त में
  rationale: एकवचन χρόνος को सुरक्षित रखा गया है और इसे अन्य परिचित बाइबलीय वाक्यांशों से अनावश्यक रूप से नहीं मिलाया गया।
- issue: अभिलाषाओं का नैतिक चरित्र
  choice: अभक्ति से भरी अभिलाषाएँ
  alternative: अभक्ति की अभिलाषाएँ; अभक्तिपूर्ण अभिलाषाएँ
  rationale: यह मूल पाठ के नैतिक निर्णय को बनाए रखता है, पर ἐπιθυμίαι को केवल यौन वासनाओं के अर्थ में संकुचित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। ‘कहा करते थे’ पुनरावृत्त भूतकाल को, ‘अन्तिम समय’ यूनानी एकवचन को, और ‘चलेंगे’ जीवन-आचरण की रूपकात्मक गति को व्यक्त करता है।
