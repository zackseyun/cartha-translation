source:
  edition: SBLGNT
  text: οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας ⸀αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers[a], malcontents, walking according to their own desires, and their mouth speaks arrogant things[c][b], showing favoritism for the sake of gain.
translation:
  language: hi
  text: ये लोग कुड़कुड़ानेवाले, अपने भाग्य से असंतुष्ट रहनेवाले हैं। ये अपनी अभिलाषाओं के अनुसार चलते हैं,[a] इनका मुँह घमंड भरी बड़ी-बड़ी बातें बोलता है,[b] और ये अपने लाभ के लिए लोगों के प्रति पक्षपात दिखाते हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी लालसाओं के अनुसार जीवन बिताते हैं।”
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “इनका मुँह फूली हुई बातें बोलता है।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “चेहरों की प्रशंसा करते हैं”—यह लोगों के प्रति पक्षपात दिखाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσταί
  choice: कुड़कुड़ानेवाले
  rationale: यह ऐसे लोगों को दर्शाता है जो असंतोष में बार-बार दबे स्वर में शिकायत करते हैं; आधुनिक हिन्दी में यह भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: μεμψίμοιροι
  choice: अपने भाग्य से असंतुष्ट रहनेवाले
  rationale: दुर्लभ यूनानी शब्द अपने हिस्से या परिस्थिति को लेकर शिकायत और स्थायी असंतोष का भाव रखता है; यह वाक्यांश उस विशिष्ट अर्थ को सामान्य 'शिकायत करनेवाले' से अधिक स्पष्ट करता है।
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  choice: अपनी अभिलाषाओं के अनुसार चलते हैं
  rationale: πορεύομαι यहाँ जीवन-आचरण का रूपक है और ἐπιθυμίαι व्यापक रूप से प्रबल इच्छाओं को सूचित करता है; प्रसंग उनका नकारात्मक नैतिक स्वर स्पष्ट करता है।
- source_word: τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: इनका मुँह बड़ी-बड़ी घमंड की बातें बोलता है
  rationale: एकवचन 'मुँह' यूनानी की सामूहिक वाणी-संबंधी अभिव्यक्ति को रखता है; ὑπέρογκα फूली हुई, अतिशयोक्तिपूर्ण और अहंकारी बातों का बोध कराता है।
- source_word: θαυμάζοντες πρόσωπα
  choice: लोगों का पक्ष लेते हैं
  rationale: शाब्दिक रूप से 'चेहरों की प्रशंसा करना' एक मुहावरा है जिसका अर्थ स्वार्थवश व्यक्तियों के प्रति पक्षपात दिखाना है।
- source_word: ὠφελείας χάριν
  choice: अपने लाभ के लिए
  rationale: यह वाक्यांश उस स्वार्थी उद्देश्य को बताता है जिसके कारण वे लोगों का पक्ष लेते हैं; 'लाभ' आर्थिक मुनाफे तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: ἐπιθυμίαι का नैतिक बल
  choice: मुख्य पाठ में 'अभिलाषाओं', जिसका नकारात्मक नैतिक अर्थ प्रसंग से स्पष्ट है
  alternative: '''वासनाओं'' या ''लालसाओं'''
  rationale: मूल शब्द केवल यौन वासना तक सीमित नहीं है; व्यापक शब्द रखना यहूदा के आरोप की पूरी सीमा और मूल की अर्थगत व्यापकता को सुरक्षित रखता है।
- issue: θαυμάζοντες πρόσωπα का मुहावरेदार अर्थ
  choice: लोगों का पक्ष लेते हैं
  alternative: '''लोगों की चापलूसी करते हैं'' या शाब्दिक ''चेहरों की प्रशंसा करते हैं'''
  rationale: मुहावरा पक्षपातपूर्ण अनुग्रह को दर्शाता है; लाभ का उद्देश्य साथ होने से चापलूसी निहित हो सकती है, पर मूल अभिव्यक्ति को केवल चापलूसी तक सीमित करना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए स्पष्ट रखी गई है। 'कुड़कुड़ानेवाले' शिकायत के दबे और लगातार स्वर को, तथा 'अपने भाग्य से असंतुष्ट रहनेवाले' μεμψίμοιροι की विशिष्टता को अलग-अलग बनाए रखते हैं। हिन्दी में सहजता और आरोपों की स्पष्ट सूची के लिए पहले दो विशेषणों के बाद वाक्य-विभाजन किया गया है।
