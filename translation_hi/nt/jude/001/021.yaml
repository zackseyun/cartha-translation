source:
  edition: SBLGNT
  text: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God[c][b][a], waiting for the mercy of our Lord Jesus the Messiah unto eternal life.
translation:
  language: hi
  text: अपने आप को परमेश्वर के प्रेम में बनाए रखो[a], और अनन्त जीवन के लिए हमारे प्रभु यीशु मसीह की दया की प्रतीक्षा करते रहो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परमेश्वर के प्रेम में’ का अर्थ ‘परमेश्वर के प्रेम में’ या ‘परमेश्वर के प्रति प्रेम में’ भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या ‘अनन्त जीवन तक’; यूनानी वाक्यांश लक्ष्य या परिणति दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρήσατε
  choice: बनाए रखो
  rationale: यह बहुवचन आज्ञार्थक क्रिया है। ‘अपने आप को ... बनाए रखो’ यूनानी के आत्मवाचक कर्म और सीधे आग्रह, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ἀγάπῃ θεοῦ
  choice: परमेश्वर के प्रेम में
  rationale: यह अभिव्यक्ति θεοῦ संबंधी षष्ठी की वास्तविक अस्पष्टता बनाए रखती है—अर्थ परमेश्वर का प्रेम अथवा परमेश्वर के प्रति प्रेम हो सकता है।
- source_word: προσδεχόμενοι
  choice: बाट जोहते रहो
  rationale: वर्तमान कृदन्त मुख्य आज्ञा के साथ चलने वाली निरन्तर, आशापूर्ण प्रतीक्षा दर्शाता है। यह मुहावरा साधारण किन्तु गरिमापूर्ण हिन्दी है।
- source_word: ἔλεος
  choice: दया
  rationale: यह करुणामय अनुग्रह के अर्थ को व्यक्त करने वाला प्रचलित और सहज हिन्दी शब्द है।
- source_word: κυρίου
  choice: प्रभु
  rationale: नए नियम के इस संदर्भ में κύριος का मानक और धर्मवैचारिक रूप से उपयुक्त अनुवाद है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός अभिषिक्त जन की उपाधि है; हिन्दी में ‘मसीह’ इसी उपाधि का स्वाभाविक और स्थापित रूप है।
- source_word: εἰς ζωὴν αἰώνιον
  choice: अनन्त जीवन के लिए
  rationale: εἰς लक्ष्य या परिणति की दिशा बताता है। ‘के लिए’ इस संबंध को संक्षेप और स्वाभाविक ढंग से रखता है, बिना यह तय किए कि वाक्यांश केवल दया, प्रतीक्षा, या व्यापक exhortation से जुड़ता है।
theological_decisions:
- issue: ἀγάπῃ θεοῦ में संबंधी षष्ठी का अर्थ
  choice: ‘परमेश्वर के प्रेम में’ द्वारा अस्पष्टता सुरक्षित रखी गई
  alternative: ‘परमेश्वर द्वारा किए जाने वाले प्रेम में’ अथवा ‘परमेश्वर के प्रति अपने प्रेम में’
  rationale: मूल यूनानी दोनों अर्थों की सम्भावना रखता है और प्रसंग किसी एक को अनिवार्य नहीं करता।
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यहाँ शब्द उपाधि का अर्थ रखता है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और परिचित रूप है।
- issue: εἰς ζωὴν αἰώνιον का संबंध
  choice: ‘अनन्त जीवन के लिए’
  alternative: ‘अनन्त जीवन तक’ अथवा ‘जो अनन्त जीवन की ओर ले जाती है’
  rationale: ‘के लिए’ लक्ष्यगत अर्थ को रखता है और व्याकरणिक संबंध को अनावश्यक रूप से संकीर्ण नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘बनाए रखो’ सीधा और सहज आग्रह है; ‘बाट जोहते रहो’ निरन्तर आशापूर्ण प्रतीक्षा को गरिमापूर्ण, परिचित मुहावरे में व्यक्त करता है।
