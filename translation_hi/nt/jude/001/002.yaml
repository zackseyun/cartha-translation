  text: May mercy and peace and love be multiplied to you[a].
translation:
  language: hi
  text: तुम्हें दया और शान्ति और प्रेम बहुतायत से मिलें[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुम्हें दया और शान्ति और प्रेम बढ़ें’ अथवा ‘तुम्हें दया और शान्ति और प्रेम बहुतायत से प्राप्त हों।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: दया
  rationale: पत्रीय आशीर्वचन में यह ἔλεος का स्वाभाविक और मानक हिन्दी रूप है; इसमें कृपालु व्यवहार और करुणामय भाव दोनों समाहित हैं।
- source_word: ὑμῖν
  choice: तुम पर
  rationale: आशीर्वचन की दिशा बताने वाले सम्प्रदान कारक को हिन्दी में ‘तुम पर’ सहजता से व्यक्त करता है।
- source_word: εἰρήνη
  choice: शान्ति
  rationale: यह εἰρήνη का स्थापित रूप है और व्यक्तिगत कुशलता तथा परमेश्वर से सम्बन्धित शान्ति—दोनों की व्यापकता बनाए रखता है।
- source_word: ἀγάπη
  choice: प्रेम
  rationale: आधुनिक हिन्दी में ἀγάπη का स्पष्ट, स्वाभाविक और धार्मिक रूप से अनावश्यक रूप से संकीर्ण न होने वाला अनुवाद है।
- source_word: πληθυνθείη
  choice: बहुतायत से होता रहे
  rationale: अओरिस्ट पैसिव ऑप्टेटिव की आशीर्वचनात्मक कामना और वृद्धि की छवि को स्वाभाविक हिन्दी में व्यक्त करता है; ‘बढ़ाया जाए’ अधिक यांत्रिक और कम सहज लगता है।
- source_word: καὶ ... καὶ ... καὶ
  choice: और ... और ... और
  rationale: दोहराए गए καί को बनाए रखने से मूल का लयात्मक और गम्भीर संचय सुरक्षित रहता है।
theological_decisions:
- issue: आशीर्वचनात्मक ऑप्टेटिव का अनुवाद
  choice: तुम पर दया और शान्ति और प्रेम बहुतायत से होता रहे।
  alternative: तुम्हारे लिए दया, शान्ति और प्रेम बढ़ता जाए।
  rationale: ‘होता रहे’ हिन्दी में कामना को स्पष्ट करता है, जबकि ‘बहुतायत से’ πληθυνθείη में निहित प्रचुर वृद्धि को बनाए रखता है। कर्मवाच्य को कठोरता से दोहराने के बजाय अर्थ और आशीर्वचनात्मक स्वर दोनों सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और आशीर्वचन के अनुरूप। मूल के तीन बार आए ‘और’ को जानबूझकर बनाए रखा गया है।
