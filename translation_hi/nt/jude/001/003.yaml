id: JUD.1.3
reference: Jude 1:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ⸀ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/003.yaml
  text: Beloved[a], although I was making every effort to write to you about our common salvation, I found it necessary to write[d][c][b], urging you to contend earnestly for the faith once for all delivered to the saints.
translation:
  language: hi
  text: प्रिय जनो, यद्यपि मैं हमारे साझा उद्धार के विषय में तुम्हें लिखने का हर संभव प्रयास कर रहा था, फिर भी मैंने तुम्हें लिखना आवश्यक समझा और तुमसे आग्रह किया कि तुम उस विश्वास[a] के लिए पूरी लगन से संघर्ष करो, जो एक बार सदा के लिए पवित्र जनों[c] को सौंप दिया गया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “विश्वास” से केवल विश्वास करने की व्यक्तिगत क्रिया नहीं, बल्कि विश्वासियों को सौंपी गई मसीही शिक्षा और अंगीकार अभिप्रेत हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “सौंप दिया गया था” का अनुवाद “परंपरा के रूप में दिया गया था” भी हो सकता है; मूल शब्द शिक्षा के हस्तांतरण पर बल दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: “पवित्र जन” से आशय परमेश्वर के पवित्र लोग, अर्थात विश्वासी हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: प्रिय जनो
  rationale: बहुवचन संबोधन का स्नेहपूर्ण और गरिमापूर्ण भाव रखता है, बिना मूल में निहित न होने वाले पारिवारिक संबोधन को जोड़ने के।
- source_word: πᾶσαν σπουδὴν ποιούμενος
  choice: हर संभव प्रयास कर रहा था
  rationale: यह यूनानी मुहावरे की तत्परता और परिश्रम दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; प्रसंग के कारण इसे रियायती उपवाक्य में रखा गया है।
- source_word: περὶ τῆς κοινῆς ἡμῶν σωτηρίας
  choice: उस उद्धार के विषय में ... जिसमें हम सब सहभागी हैं
  rationale: κοινῆς के ‘साझा/सामान्य’ अर्थ को अस्पष्ट ‘सामान्य उद्धार’ के बजाय सहभागिता के रूप में स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνάγκην ἔσχον
  choice: आवश्यक समझा
  rationale: परिस्थितियों से उत्पन्न आवश्यकता को व्यक्त करता है, पर ‘विवश हुआ’ जैसी अधिक प्रबल बाध्यता नहीं जोड़ता।
- source_word: παρακαλῶν
  choice: यह आग्रह करना
  rationale: यहाँ गंभीर और आत्मीय प्रोत्साहन/अनुरोध का भाव है; ‘आग्रह’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: ἐπαγωνίζεσθαι
  choice: पूरी लगन से संघर्ष करो
  rationale: यौगिक क्रिया की तीव्रता बनाए रखता है, पर अनावश्यक रूप से हिंसक भाषा नहीं अपनाता।
- source_word: τῇ ... πίστει
  choice: उस विश्वास
  rationale: निश्चित पद और सौंपे जाने के प्रसंग में यह विश्वास की विषय-वस्तु—मसीही शिक्षा और अंगीकार—की ओर संकेत करता है; ‘विश्वास’ मूल की अर्थगत गुंजाइश भी बनाए रखता है।
- source_word: ἅπαξ
  choice: एक ही बार सदा के लिए
  rationale: यह सौंपे जाने की निर्णायक और न दोहराई जाने वाली प्रकृति को स्पष्ट करता है।
- source_word: παραδοθείσῃ
  choice: सौंपा गया था
  rationale: παραδίδωμι के हस्तांतरण और सुपुर्द किए जाने के अर्थ को स्वाभाविक हिन्दी में रखता है; ‘परंपरा से दिया गया’ सम्भव वैकल्पिक बल है।
- source_word: τοῖς ἁγίοις
  choice: पवित्र जनों
  rationale: मूल विशेषण का धार्मिक अर्थ बनाए रखता है और बाद में संत घोषित किए गए विशिष्ट व्यक्तियों का अर्थ अनिवार्य नहीं बनाता।
theological_decisions:
- issue: πίστις का अर्थ
  choice: विश्वास की वस्तुगत विषय-वस्तु, अर्थात विश्वासियों को सौंपी गई शिक्षा/अंगीकार
  alternative: व्यक्ति द्वारा किया जाने वाला भरोसा या विश्वास
  rationale: ‘सौंपा गया’ और ‘उसके लिए संघर्ष करो’ इस प्रसंग में किसी साझा, प्राप्त शिक्षा या अंगीकार की ओर अधिक स्वाभाविक रूप से संकेत करते हैं; फिर भी मुख्य पाठ में ‘विश्वास’ रखकर शब्द की मूल व्यापकता सुरक्षित है।
- issue: ἅπαξ παραδοθείσῃ का बल
  choice: एक निर्णायक, एक ही बार सदा के लिए किया गया सौंपना
  alternative: केवल अतीत में ‘एक बार’ सौंपा गया
  rationale: ἅπαξ इस संदर्भ में कार्य की निर्णायकता और न दोहराए जाने का बल धारण कर सकता है; अनुवाद इसी बल को व्यक्त करता है, बिना बाद की किसी सम्प्रदायगत परिभाषा को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्नेहपूर्ण, गंभीर और उपदेशात्मक शैली रखी गई है। ‘प्रिय जनो’ समावेशी संबोधन है; ‘जिसमें हम सब सहभागी हैं’ κοινῆς को स्वाभाविक हिन्दी देता है। यूनानी में ‘लिखना’ दो बार आने की प्रतिध्वनि हिन्दी में ‘लिखने ... लिखकर’ से सुरक्षित रखी गई है।
