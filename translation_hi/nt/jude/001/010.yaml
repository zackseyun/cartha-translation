id: JUD.1.10
reference: Jude 1:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand[a], and whatever they understand naturally, like irrational animals[c][b], by these things they are corrupted.
translation:
  language: hi
  text: पर ये लोग जिन बातों को नहीं समझते, उनकी निन्दा करते हैं[a]; और जिन बातों को वे विवेकहीन पशुओं की तरह स्वाभाविक रूप से जानते हैं[b], उन्हीं के द्वारा वे भ्रष्ट होते जाते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जिन बातों को वे नहीं जानते, उनके विषय में बुरा-भला कहते हैं।’
    reason: οἴδασιν ‘जानते’ और βλασφημοῦσιν ‘बुरा-भला कहते/निन्दा करते’ के अर्थ-विकल्प सुरक्षित करता है।
  - marker: b
    text: या ‘जिन बातों को वे विवेकहीन पशुओं की तरह सहज प्रवृत्ति से जानते हैं।’
    reason: φυσικῶς के ‘स्वाभाविक रूप से’ और ‘सहज प्रवृत्ति से’ दोनों संभव भावों को दर्शाता है।
  - marker: c
    text: या ‘इन्हीं बातों में वे भ्रष्ट होते जाते हैं’; φθείρονται का अर्थ ‘नष्ट होते जाते हैं’ भी हो सकता है।
    reason: ἐν τούτοις की स्थानीय/साधनात्मक अस्पष्टता और φθείρονται में भ्रष्टता/विनाश के अर्थ-विस्तार को सुरक्षित करता है।
lexical_decisions:
- source_word: οὗτοι
  choice: ये लोग
  rationale: संदर्भ में निन्दित घुसपैठियों की ओर संकेत है; ‘ये लोग’ आधुनिक हिन्दी में स्पष्ट है और अनावश्यक रूप से पुरुष-विशेष अर्थ नहीं जोड़ता।
- source_word: βλασφημοῦσιν
  choice: निन्दा करते हैं
  rationale: क्रिया का अर्थ अपमानजनक या बुरा बोलना हो सकता है; यहाँ कर्म वे बातें हैं जिन्हें वे नहीं समझते, इसलिए ‘निन्दा’ ईशनिन्दा तक अर्थ को सीमित किए बिना गंभीरता बनाए रखती है।
- source_word: ὅσα μὲν οὐκ οἴδασιν
  choice: जिन बातों को नहीं समझते
  rationale: οἴδασιν का मूल भाव ‘जानना’ है, पर आगे सहज ज्ञान से किए गए विरोध के कारण यहाँ बौद्धिक समझ का भाव प्रमुख है।
- source_word: φυσικῶς
  choice: स्वाभाविक रूप से
  rationale: यह मूल क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी प्रतिरूप है तथा पशुओं से की गई तुलना के कारण सहज-प्रवृत्तिगत ज्ञान का संकेत भी देता है।
- source_word: ἄλογα ζῷα
  choice: विवेकहीन पशु
  rationale: ἄλογα तर्क या विवेक के अभाव पर बल देता है; ‘विवेकहीन पशु’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: ἐπίστανται
  choice: जानते हैं
  rationale: यहाँ सीमित, स्वाभाविक परिचय या ज्ञान का भाव है; ‘जानते हैं’ पहले खंड के ‘समझते’ से सार्थक भेद बनाए रखता है।
- source_word: ἐν τούτοις
  choice: उन्हीं के द्वारा
  rationale: ἐν τούτοις स्थानीय (‘इन्हीं बातों में’) अथवा साधनात्मक (‘इन्हीं के द्वारा’) हो सकता है; मुख्य पाठ में साधनात्मक अर्थ संदर्भानुकूल और सहज है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: φθείρονται
  choice: भ्रष्ट होते जाते हैं
  rationale: रूप नैतिक भ्रष्टता और परिणामी विनाश, दोनों की दिशा सुझा सकता है; ‘भ्रष्ट होते जाते हैं’ वर्तमान में चल रही आत्म-विनाशकारी प्रक्रिया को व्यक्त करता है, बिना अंतिम विनाश को ही एकमात्र अर्थ बनाने के।
theological_decisions:
- issue: βλασφημέω का अर्थ जब कर्म स्पष्ट रूप से परमेश्वर नहीं है
  choice: ‘निन्दा करते हैं’
  alternative: ‘ईशनिन्दा करते हैं’ या ‘बुरा-भला कहते हैं’
  rationale: पद समझ से परे बातों के विरुद्ध अपमानजनक वाणी की निन्दा करता है; ‘निन्दा’ अपराध की गंभीरता रखती है, पर उसे केवल परमेश्वर के विरुद्ध वाणी तक सीमित नहीं करती।
- issue: φθείρονται में भ्रष्टता और विनाश का संबंध
  choice: ‘भ्रष्ट होते जाते हैं’
  alternative: ‘नष्ट होते जाते हैं’
  rationale: यह क्रिया नैतिक बिगाड़ और उसके विनाशकारी परिणाम दोनों धारण कर सकती है। मुख्य पाठ भ्रष्टता को रखता है और पादटिप्पणी विनाश के वैकल्पिक भाव को सुरक्षित करती है।
- issue: ἐν τούτοις का स्थानीय या साधनात्मक अर्थ
  choice: ‘उन्हीं के द्वारा’
  alternative: ‘इन्हीं बातों में’
  rationale: यह अस्पष्टता व्याकरण में वास्तविक है। संदर्भ में उनकी सहज प्रवृत्तियाँ उनके भ्रष्ट होने का माध्यम समझी जा सकती हैं, किंतु स्थानीय अर्थ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। वाक्य की तीखी विवादात्मक ध्वनि बनी रहती है, पर ‘जानना’ और ‘समझना’, स्वाभाविक ज्ञान और विवेकहीन पशुओं की तुलना, तथा भ्रष्टता और विनाश के बीच मूल यूनानी तनाव को अतिव्याख्या से नहीं सुलझाया गया।
