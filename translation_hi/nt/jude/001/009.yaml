source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel[a], when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said[b], “May the Lord rebuke you.”
translation:
  language: hi
  text: परन्तु प्रधान स्वर्गदूत मीकाएल, जब शैतान से विवाद करते हुए मूसा के शरीर के विषय में बहस कर रहा था, तब उसने शैतान के विरुद्ध निन्दापूर्ण दोषारोपण करने का साहस नहीं किया[a], बल्कि उसने कहा, “प्रभु तुझे डाँटे।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक पारम्परिक रूप में, “उसके विरुद्ध अपमानजनक दोषारोपण करने का साहस नहीं किया।”
    reason: lexical_alternative
  - marker: b
    text: ये शब्द जकर्याह 3:2 की प्रतिध्वनि हैं, जहाँ प्रभु शैतान को डाँटते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: ἀρχάγγελος
  choice: प्रधान स्वर्गदूत
  rationale: यह पदवी के अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट करती है और स्वर्गदूतों के किसी विस्तृत पदानुक्रम को पाठ में नहीं जोड़ती।
- source_word: διαβόλῳ
  choice: शैतान
  rationale: यहाँ शब्द व्यक्तिगत अलौकिक विरोधी के लिए प्रयुक्त है; हिन्दी बाइबलीय प्रयोग में ‘शैतान’ स्वाभाविक और व्यापक रूप से समझा जाने वाला नाम है।
- source_word: διακρινόμενος ... διελέγετο
  choice: विवाद करते हुए ... बहस कर रहा था
  rationale: दोनों यूनानी क्रियाओं को अलग रखते हुए पहली में संघर्ष/विवाद और दूसरी में चल रही मौखिक बहस का भाव व्यक्त किया गया है।
- source_word: περὶ τοῦ Μωϋσέως σώματος
  choice: मूसा के शरीर के विषय में
  rationale: यह मूल संबंधवाचक रचना और ठोस ‘शरीर’ को सुरक्षित रखते हुए गरिमापूर्ण हिन्दी देता है।
- source_word: οὐκ ἐτόλμησεν
  choice: साहस नहीं किया
  rationale: τολμάω के प्रत्यक्ष अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘धृष्टता नहीं की’ सम्भव है, पर उसमें अतिरिक्त नैतिक मूल्यांकन अधिक उभरता है।
- source_word: κρίσιν ἐπενεγκεῖν βλασφημίας
  choice: निन्दापूर्ण दोषारोपण करने
  rationale: कठिन यूनानी पदबंध में न्यायिक आरोप/निर्णय और अपमानजनक निन्दा—दोनों भावों को समेटता है, बिना यह निश्चित किए कि निन्दा तकनीकी अर्थ में परमेश्वर के विरुद्ध ईशनिन्दा थी।
- source_word: Ἐπιτιμήσαι σοι κύριος
  choice: प्रभु तुझे डाँटे
  rationale: यूनानी विधिलिंग इच्छा/आह्वान व्यक्त करता है। हिन्दी में यह स्थापित, संक्षिप्त प्रार्थनात्मक रूप उसी बल को रखता है; ‘प्रभु तुझे डाँटे’ को केवल भविष्यवाणी की तरह पढ़े जाने से बचाने हेतु सन्दर्भ-पादटिप्पणी दी गई है।
- source_word: κύριος
  choice: प्रभु
  rationale: κύριος के लिए परियोजना का स्वाभाविक और प्रतिष्ठित हिन्दी प्रतिरूप।
theological_decisions:
- issue: शैतान को सम्बोधित करते समय मीकाएल के संयम का स्वरूप
  choice: मीकाएल स्वयं निन्दापूर्ण दोषारोपण नहीं करता, बल्कि प्रभु की डाँट का आह्वान करता है।
  alternative: वह ईशनिन्दात्मक निर्णय अथवा किसी भी प्रकार की अपमानजनक निन्दा करने से बचता है।
  rationale: κρίσιν ... βλασφημίας का सटीक संबंध विवादित है। अनुवाद स्पष्ट विरोध को सुरक्षित रखता है—मीकाएल अपना दोषारोपण नहीं करता, बल्कि प्रभु की ओर देखता है—पर स्वर्गदूतों के अधिकार या ईशनिन्दा की तकनीकी प्रकृति को आवश्यकता से अधिक निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘परन्तु’, ‘के विषय में’ और ‘प्रभु’ औपचारिक बाइबलीय स्वर देते हैं, जबकि वाक्यरचना अनावश्यक रूप से संस्कृतनिष्ठ नहीं है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न [a] और [b] उपस्थित हैं।
