id: JUD.1.15
reference: Jude 1:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness[c][b][a], and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: hi
  text: सबके विरुद्ध न्याय करने और सभी भक्तिहीनों को दोषी ठहराने[a] के लिए—उनकी भक्तिहीनता के उन सब कामों के विषय में, जो उन्होंने भक्तिहीन होकर किए, और उन सब कठोर बातों[c] के विषय में, जो भक्तिहीन पापियों ने उसके[b] विरुद्ध कही हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनका दोष प्रकट करने’ अथवा ‘उन्हें दोषी सिद्ध करने।’ यूनानी क्रिया गलत काम को उजागर करने का अर्थ दे सकती है, पर यहाँ यह ‘न्याय करने’ के साथ न्यायिक संदर्भ में प्रयुक्त हुई है।
    reason: lexical_alternative
  - marker: b
    text: प्रसंग के अनुसार ‘उसके’ का संकेत पिछले पद में उल्लिखित प्रभु की ओर है।
    reason: cross_reference
  - marker: c
    text: या ‘उद्दंड बातें।’ यूनानी शब्द का मूल अर्थ ‘कठोर’ है और यहाँ संभवतः उसके विरुद्ध बोले गए कठोर, धृष्ट या अपमानजनक शब्दों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῆσαι κρίσιν κατὰ πάντων
  choice: सबके विरुद्ध न्याय करने
  rationale: यह पदबंध न्यायिक कार्रवाई को पूरा करने का भाव रखता है। κατά के विरोधात्मक अर्थ को बनाए रखने के लिए केवल ‘सबका न्याय करने’ के बजाय ‘सबके विरुद्ध न्याय करने’ चुना गया है।
- source_word: ἐλέγξαι
  choice: दोषी ठहराने
  rationale: न्यायिक प्रसंग में क्रिया का अर्थ केवल डाँटना नहीं, बल्कि दोष को प्रकट या सिद्ध करके दोषी ठहराना है।
- source_word: πάντας τοὺς ἀσεβεῖς
  choice: सभी भक्तिहीनों
  rationale: यह बहुवचन संज्ञार्थक प्रयोग है। ‘भक्तिहीन’ आगे आने वाले ἀσέβεια और ἀσεβέω के साथ शब्दगत संबंध को यथासंभव बनाए रखता है।
- source_word: περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν
  choice: उनकी भक्तिहीनता के उन सब कामों के विषय में
  rationale: यह अनुवाद मूल के ‘भक्तिहीनता के कामों’ वाले संबंध को बनाए रखते हुए स्वाभाविक और स्पष्ट हिन्दी देता है।
- source_word: ὧν ἠσέβησαν
  choice: जो उन्होंने भक्तिहीन होकर किए
  rationale: मूल में ἀσέβεια और उसके सजातीय क्रिया-रूप ἀσεβέω की जानबूझकर पुनरावृत्ति है; ‘भक्तिहीनता’ और ‘भक्तिहीन होकर’ इस बल को हिन्दी में बनाए रखते हैं।
- source_word: σκληρῶν
  choice: कठोर बातों
  rationale: वाणी के संदर्भ में σκληρός कठोर, उद्दंड या अपमानजनक कथनों को सूचित कर सकता है। ‘कठोर बातें’ व्यापक अर्थ और मूल रूपक दोनों को बनाए रखता है।
- source_word: ἐλάλησαν κατ’ αὐτοῦ
  choice: उसके विरुद्ध कही हैं
  rationale: ‘विरुद्ध’ κατά के विरोधात्मक अर्थ को व्यक्त करता है। हिन्दी में ‘बातें कही हैं’ स्वाभाविक है और आरोप की वर्तमान प्रासंगिकता भी प्रकट करता है।
- source_word: ἁμαρτωλοὶ ἀσεβεῖς
  choice: भक्तिहीन पापियों
  rationale: दोनों विशेषणात्मक तत्वों को संक्षिप्त रूप में रखा गया है और बार-बार आने वाले ‘भक्तिहीन’ शब्द पर मूल का बल भी सुरक्षित है।
theological_decisions:
- issue: αὐτοῦ (‘उसके’) का संदर्भ
  choice: मुख्य पाठ में सर्वनाम ‘उसके’ बनाए रखना
  alternative: ‘प्रभु के विरुद्ध’ या ‘परमेश्वर के विरुद्ध’
  rationale: पिछले पद के प्रसंग में संकेत प्रभु की ओर है, पर यूनानी पाठ यहाँ संज्ञा नहीं बल्कि सर्वनाम प्रयोग करता है। सर्वनाम बनाए रखने से प्रसंगगत अर्थ सुरक्षित रहता है और अनावश्यक व्याख्यात्मक विस्तार नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। पद पिछले वाक्य से जुड़ा हुआ उद्देश्यसूचक खंड है, इसलिए ‘के लिए’ वाली संरचना रखी गई है। मूल में ἀσεβ- शब्दसमूह की सघन पुनरावृत्ति को ‘भक्तिहीन’, ‘भक्तिहीनता’ और ‘भक्तिहीन होकर’ के द्वारा यथासंभव सुरक्षित रखा गया है।
