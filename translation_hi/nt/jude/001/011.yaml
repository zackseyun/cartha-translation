  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them[a], because they have walked in the way of Cain, and have poured themselves out for pay into Balaam’s error, and have perished in Korah’s rebellion.
translation:
  language: hi
  text: उन पर हाय! क्योंकि वे कैन के मार्ग पर चले हैं, और लाभ के लिए बिलाम की भटकन में अपने आपको झोंक दिया है,[a] और कोरह के विद्रोह में नष्ट हो गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और लाभ के लिए वे बिलाम की भटकन में बेकाबू होकर जा पड़े हैं।”
    reason: ἐξεχύθησαν के कठिन रूपक का अधिक मुहावरेदार अर्थ।
lexical_decisions:
- source_word: οὐαὶ
  choice: हाय
  rationale: यह न्याय और धिक्कार की भविष्यद्वक्ताई पुकार है; ‘हाय’ इसकी गंभीरता बनाए रखता है।
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  choice: कैन के मार्ग पर चले हैं
  rationale: ‘मार्ग’ आचरण की दिशा का रूपक बनाए रखता है और ‘चले हैं’ ἐπορεύθησαν को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ
  choice: बिलाम की भटकन में
  rationale: πλάνη में भूल, भ्रम और पथभ्रष्टता के अर्थ समाए हैं; ‘भटकन’ मार्ग-संबंधी रूपक और नैतिक विचलन दोनों को खुला रखता है।
- source_word: μισθοῦ
  choice: मजदूरी के लिए
  rationale: μισθός प्रतिफल या वेतन को दर्शाता है; यह बिलाम से जुड़ी लाभ-लालसा को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: ἐξεχύθησαν
  choice: अपने आप को उँडेल दिया है
  rationale: यह कठिन रूपक क्रिया के ‘उँडेल दिए जाने’ के चित्र को सुरक्षित रखता है; अधिक मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε
  choice: कोरह के विद्रोह में
  rationale: गिनती 16 के संकेत के संदर्भ में ἀντιλογία का विरोधात्मक अर्थ ठोस रूप से ‘विद्रोह’ द्वारा व्यक्त होता है।
- source_word: ἀπώλοντο
  choice: नष्ट हो गए हैं
  rationale: यह क्रिया के विनाशकारी परिणाम को गंभीर और सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: Κάϊν / Βαλαὰμ / Κόρε
  choice: कैन / बिलाम / कोरह
  rationale: ये हिंदी बाइबल परंपरा में पहचाने जाने वाले नाम-रूप हैं।
theological_decisions:
- issue: καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν के संक्षिप्त और रूपकात्मक वाक्यांश का अनुवाद
  choice: और मजदूरी के लिए बिलाम की भटकन में अपने आप को उँडेल दिया है
  alternative: और लाभ के लिए बिलाम की भटकन में बेकाबू होकर जा पड़े हैं
  rationale: मुख्य पाठ ἐξεχύθησαν के सजीव किंतु कठिन ‘उँडेलने’ के रूपक और μισθοῦ के लाभकारी उद्देश्य को बनाए रखता है। अधिक सहज अर्थ को पादटिप्पणी में रखने से वास्तविक भाषिक अस्पष्टता दबती नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिंदी। तीनों पुराने नियम-संबंधी उदाहरणों की समानांतर संरचना सुरक्षित रखी गई है; बिलाम वाले खंड की असामान्य रूपकात्मकता जानबूझकर पूरी तरह समतल नहीं की गई।
