  text: Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/014.yaml
  text: And Enoch[a], the seventh from Adam, also prophesied to these, saying, “Behold[c][b], the Lord came with his holy myriads,”
translation:
  language: hi
  text: आदम से सातवें हनोक ने भी इनके विषय में भविष्यवाणी की और कहा, “देखो,[a] प्रभु अपने पवित्र असंख्य जनों के साथ आया है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह उद्धरण 1 हनोक 1:9 से मेल खाता है।
    reason: cross_reference
  - marker: b
    text: या, “अपने पवित्र जनों की दस हज़ारों के साथ।” यूनानी शब्द μυριάσιν का अर्थ ‘दस हज़ारों’ या ‘असंख्य जनसमूह’ हो सकता है; यह एक विशाल पवित्र दल का बोध कराता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Προεφήτευσεν
  choice: भविष्यवाणी की
  rationale: यह προφητεύω के भविष्यद्वाणी-संबंधी वचन बोलने के अर्थ को बनाए रखता है और इसे केवल भविष्य बताने तक सीमित नहीं करता।
- source_word: δὲ καὶ
  choice: भी
  rationale: यहाँ δέ हल्का संयोजक है और καί हनोक को एक अतिरिक्त साक्षी के रूप में जोड़ता है; स्वाभाविक हिन्दी में ‘भी’ पर्याप्त है।
- source_word: τούτοις
  choice: इन्हीं लोगों के विषय में
  rationale: προφητεύω के साथ संप्रदान कारक भविष्यवाणी के विषय या लक्ष्य को सूचित कर सकता है। प्रसंग में संकेत पहले वर्णित भक्तिहीन घुसपैठियों की ओर है; ‘लोगों’ का प्रयोग हिन्दी में संकेत को स्वाभाविक बनाता है।
- source_word: ἕβδομος ἀπὸ Ἀδὰμ
  choice: आदम से सातवीं पीढ़ी के
  rationale: वंशावली-संबंधी अभिव्यक्ति का आशय स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है; हनोक को आदम को गिनकर सातवाँ बताया गया है।
- source_word: Ἑνὼχ
  choice: हनोक
  rationale: यह हिन्दी बाइबल परंपरा में प्रचलित नाम-रूप है।
- source_word: λέγων
  choice: कहते हुए कहा
  rationale: ग्रीक कृदंत उद्धरण का परिचय देता है; हिन्दी वाक्य-विन्यास में इसे ‘भविष्यवाणी करते हुए कहा’ के रूप में सहजता से जोड़ा गया है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाली गंभीर भविष्यद्वाणी शैली को वर्तमान, समझने योग्य हिन्दी में बनाए रखता है।
- source_word: ἦλθεν
  choice: आया
  rationale: ग्रीक में यह एओरिस्ट भूतकाल है। यद्यपि इसे भविष्यद्वाणी का सुनिश्चित भूतकाल समझा जा सकता है, अनुवाद भविष्यकाल थोपे बिना रूप को सुरक्षित रखता है।
- source_word: κύριος
  choice: प्रभु
  rationale: κύριος का मानक धार्मिक हिन्दी रूप है और मूल पाठ की तरह संदर्भित व्यक्ति की पहचान को अनिर्धारित छोड़ता है।
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  choice: अपने पवित्र जनों की असंख्य सेना के साथ
  rationale: ἐν यहाँ साहचर्य के अर्थ में ‘के साथ’ है। μυριάσιν एक अत्यंत विशाल दल को व्यक्त करता है; ‘पवित्र जन’ स्वर्गदूतों को स्पष्ट रूप से जोड़ने के बजाय मूल की व्यापकता बनाए रखता है।
theological_decisions:
- issue: हनोक के उद्धरण में ‘प्रभु’ की पहचान
  choice: केवल ‘प्रभु’ रखा गया है।
  alternative: इसे स्पष्ट रूप से परमेश्वर या प्रभु यीशु कहना।
  rationale: ग्रीक केवल κύριος कहता है। यह रूप हनोक-साहित्य के मूल संदर्भ और यहूदा में संभावित मसीही अनुप्रयोग के बीच की धर्मवैचारिक संभाव्यता को बिना सुलझाए बनाए रखता है।
- issue: 1 हनोक से उद्धरण का स्वरूप
  choice: मुख्य पाठ में इसे हनोक की भविष्यवाणी के रूप में प्रस्तुत किया गया है।
  alternative: मुख्य पाठ में इसकी कैननिक स्थिति या साहित्यिक स्रोत पर टिप्पणी जोड़ना।
  rationale: यहूदा स्वयं इसे भविष्यवाणी के रूप में प्रस्तुत करता है; स्रोत-संबंधी सूचना पादटिप्पणी में देना उचित है, मुख्य पाठ में कैननिक निर्णय जोड़ना नहीं।
- issue: ἦλθεν का काल
  choice: ‘आया’ के रूप में भूतकाल बनाए रखा गया है।
  alternative: ‘आएगा’ या ‘आ रहा है।’
  rationale: यह संभावित ‘भविष्यद्वाणी के भूतकाल’ को स्वीकार करते हुए भी ग्रीक के व्याकरणिक रूप को सीधे व्यक्त करता है और व्याख्यात्मक भविष्यकाल नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भविष्यवाणी,’ ‘प्रभु’ और ‘पवित्र जन’ जैसे परिचित धार्मिक शब्द मूल की गंभीर शैली बनाए रखते हैं। उद्धरण में अल्पप्रचलित ‘निहारो’ के बजाय स्वाभाविक ‘देखो’ चुना गया है।
