id: JUD.1.8
reference: Jude 1:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: hi
  text: फिर भी, उसी तरह ये लोग भी अपने सपनों पर भरोसा करके[a] देह को दूषित करते हैं, प्रभुता को ठुकराते हैं और महिमामय जनों की निन्दा करते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “सपने देखते हुए।” यूनानी कृदन्त का यह अधिक शब्दशः अनुवाद है; यहाँ सम्भवतः आशय यह है कि वे अपने व्यवहार को सही ठहराने के लिए सपनों का सहारा लेते हैं।'
    reason: lexical_alternative
  - marker: b
    text: '“महिमामय जन” सम्भवतः उच्च स्वर्गीय प्राणियों, शायद स्वर्गदूतों, को दर्शाता है; यूनानी में शब्दशः: “महिमाओं।”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁμοίως μέντοι
  choice: फिर भी, उसी तरह
  rationale: ‘उसी तरह’ पिछले उदाहरणों से तुलना को और ‘फिर भी’ μέντοι के हल्के विरोधसूचक बल को बनाए रखता है।
- source_word: οὗτοι
  choice: ये लोग
  rationale: सन्दर्भ में यह घुस आए लोगों की ओर संकेत करता है; ‘ये लोग’ स्वाभाविक है और यूनानी में निहित न होने वाला पुरुष-विशेष संकेत नहीं जोड़ता।
- source_word: ἐνυπνιαζόμενοι
  choice: अपने सपनों पर भरोसा करके
  rationale: कृदन्त सम्भवतः उनके आचरण के आधार या ढंग को बताता है—वे अपने स्वप्न-अनुभवों को अपने व्यवहार का आधार बनाते हैं। अधिक शब्दशः विकल्प पादटिप्पणी में रखा गया है।
- source_word: σάρκα
  choice: देह
  rationale: ‘देह’ यूनानी शब्द की ठोस और नैतिक दोनों सम्भावनाओं को बनाए रखता है तथा इसे केवल शरीर या किसी व्यवस्थित धर्मवैज्ञानिक अर्थ तक सीमित नहीं करता।
- source_word: μιαίνουσιν
  choice: दूषित करते हैं
  rationale: यह नैतिक अथवा धार्मिक अशुद्धि के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κυριότητα
  choice: प्रभुता
  rationale: ‘प्रभुता’ यूनानी के lordship/dominion भाव को और उसके सम्भावित दैवी, स्वर्गीय या व्यापक अधिकार-सन्दर्भ को ‘अधिकार’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: ἀθετοῦσιν
  choice: ठुकराते हैं
  rationale: यह उस प्रभुता को मानने से दृढ़तापूर्वक इनकार करने का भाव स्पष्ट करता है।
- source_word: δόξας
  choice: महिमामय जनों
  rationale: बहुवचन संज्ञा सम्भवतः महिमायुक्त स्वर्गीय प्राणियों की ओर संकेत करती है; यह रूप ‘स्वर्गदूत’ कहकर पहचान को समय से पहले निश्चित नहीं करता।
- source_word: βλασφημοῦσιν
  choice: निन्दा करते हैं
  rationale: यह अपमानजनक और बदनाम करने वाली वाणी का गम्भीर भाव व्यक्त करता है, बिना इसे केवल परमेश्वर के विरुद्ध कही गई ईशनिन्दा तक सीमित किए।
theological_decisions:
- issue: δόξας का आशय
  choice: महिमायुक्त या उच्च स्वर्गीय प्राणियों के लिए जानबूझकर व्यापक अभिव्यक्ति
  alternative: स्वर्गदूत; स्वर्गीय महिमाएँ; अमूर्त महिमाएँ
  rationale: अगला पद स्वर्गदूतीय सन्दर्भ की ओर संकेत करता है, किन्तु यह संज्ञा स्वयं उतनी स्पष्ट नहीं है। मुख्य पाठ यूनानी की व्यापकता बनाए रखता है और पादटिप्पणी सम्भावित पहचान बताती है।
- issue: ἐνυπνιαζόμενοι का बल
  choice: उनका आचरण अपने सपनों पर भरोसा करने से जुड़ा है
  alternative: सपने देखते हुए; स्वप्न देखने वाले
  rationale: कृदन्त सम्भवतः उनके व्यवहार का आधार बताता है, पर अधिक शब्दशः अर्थ भी सम्भव है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: κυριότητα का सन्दर्भ
  choice: अस्पष्ट ‘प्रभुता’
  alternative: दैवी प्रभुता; स्वर्गीय अधिकार; सामान्य अधिकार
  rationale: मूल पाठ यह निश्चित नहीं करता कि किस प्रभुता को ठुकराया जा रहा है; अतः अनुवाद इस धर्मवैज्ञानिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘देह’, ‘प्रभुता’ और ‘महिमामय जन’ जैसे पद मूल की संक्षिप्तता तथा अर्थगत अस्पष्टता को सुरक्षित रखते हैं; वाक्य की तीन समानान्तर क्रियाएँ भी बनाए रखी गई हैं।
