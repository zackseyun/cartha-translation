id: JUD.1.7
reference: Jude 1:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them[a], having in like manner committed sexual immorality and gone after other flesh, are set forth as an example[b], undergoing the punishment of eternal fire.
translation:
  language: hi
  text: जिस प्रकार सदोम, गमोरा और उनके आसपास के नगर, उसी रीति से यौन अनैतिकता में लिप्त होकर और अन्य देह[b] के पीछे जाकर, अनन्त आग की सज़ा भुगतते हुए एक उदाहरण के रूप में प्रस्तुत हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: और अधिक शाब्दिक रूप में, “इन्हीं के समान उसी रीति से।” “इन्हीं” का संकेत पिछले पद में बताए गए स्वर्गदूतों की ओर, या अधिक सामान्य रूप से विद्रोह और न्याय के पिछले उदाहरणों की ओर हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या “भिन्न देह”; परम्परागत रूप से “पराई देह।” इस वाक्यांश को किसी एक विशिष्ट व्याख्या तक सीमित नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: जिस प्रकार
  rationale: यह पिछले उदाहरणों के साथ तुलना आरम्भ करता है; ‘जिस प्रकार’ आधुनिक हिन्दी में तुलनात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Σόδομα καὶ Γόμορρα
  choice: सदोम और गमोरा
  rationale: ये हिन्दी बाइबल परम्परा में प्रचलित स्थान-नाम हैं।
- source_word: αἱ περὶ αὐτὰς πόλεις
  choice: उनके आस-पास के नगर
  rationale: περὶ का स्थान-सूचक अर्थ स्पष्ट और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: τὸν ὅμοιον τρόπον τούτοις
  choice: उसी प्रकार
  rationale: यह समान रीति से किए गए काम को व्यक्त करता है, पर τούτοις का विवादित संकेत किसकी ओर है, इसे मुख्य पाठ में निश्चित नहीं करता।
- source_word: ἐκπορνεύσασαι
  choice: यौन अनैतिकता की
  rationale: क्रिया यौन दुराचार को स्पष्ट रूप से दर्शाती है; यह अभिव्यक्ति आधुनिक पाठकों के लिए सीधी और गरिमापूर्ण है।
- source_word: ἀπελθοῦσαι ὀπίσω
  choice: के पीछे गए
  rationale: मूल मुहावरे में किसी वस्तु की खोज या लालसा में उसके पीछे जाने का रूपक है, जिसे हिन्दी में निकटता से रखा गया है।
- source_word: σαρκὸς ἑτέρας
  choice: दूसरे शरीर
  rationale: ἑτέρας का अर्थ ‘दूसरा/भिन्न’ और σάρξ का यहाँ ठोस अर्थ ‘शरीर’ है; अनुवाद वाक्यांश को किसी एक विवादित व्याख्या तक सीमित नहीं करता।
- source_word: πρόκεινται δεῖγμα
  choice: एक उदाहरण के रूप में सामने रखे गए हैं
  rationale: πρόκεινται में सार्वजनिक रूप से सामने रखे होने और δεῖγμα में दिखाए गए उदाहरण का भाव है।
- source_word: πυρὸς αἰωνίου
  choice: अनन्त आग
  rationale: यह मूल विशेषण और संज्ञा का सीधा अनुवाद है तथा न्याय-विषयक कथन को न नरम करता है, न उसका विस्तार करता है।
- source_word: δίκην ὑπέχουσαι
  choice: दण्ड भोगते हुए
  rationale: यह न्यायिक दण्ड सहने के अर्थ और वर्तमान कृदन्त की साथ-साथ चल रही क्रिया को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: τούτοις का संकेत
  choice: मुख्य पाठ में ‘उसी प्रकार’ रखकर संकेत को अनिर्धारित छोड़ा गया है।
  alternative: ‘इन्हीं के समान’, जहाँ ‘इन्हीं’ को पद 6 के स्वर्गदूतों या पहले के सभी विद्रोह और न्याय के उदाहरणों से जोड़ा जा सकता है।
  rationale: यूनानी पाठ तुलना को स्पष्ट करता है, पर सर्वनाम का ठीक पूर्वपद विवादित है; इसलिए अनुवाद किसी एक व्याख्या को बाध्यकारी नहीं बनाता।
- issue: σαρκὸς ἑτέρας का आशय
  choice: ‘दूसरे शरीर’ के रूप में अपेक्षाकृत शाब्दिक अनुवाद।
  alternative: ‘भिन्न शरीर’, ‘पराया शरीर’, या किसी विशेष यौन अथवा स्वर्गदूतीय-मानवीय सीमा-उल्लंघन की व्याख्या।
  rationale: मूल वाक्यांश का निश्चित संदर्भ विवादित है। पाठ से अधिक विशिष्ट धर्मवैज्ञानिक निष्कर्ष मुख्य अनुवाद में जोड़ना उचित नहीं है।
- issue: πυρὸς αἰωνίου का बल
  choice: ‘अनन्त आग’ को मूल अभिव्यक्ति के रूप में बनाए रखा गया है।
  alternative: ‘सदा की आग’।
  rationale: यह पद की न्याय-संबंधी भाषा को सीधे प्रस्तुत करता है, पर उससे आगे कोई व्यवस्थित धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, स्पष्ट और गरिमापूर्ण रखी गई है। ‘यौन अनैतिकता’ सामान्य पाठक के लिए स्पष्ट है; ‘दूसरे शरीर’ मूल की जानबूझकर खुली अभिव्यक्ति को बनाए रखता है।
