source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you[a], beloved, building yourselves up in your most holy faith and praying in the Holy Spirit[c][b],
translation:
  language: hi
  text: परन्तु, हे प्रियो, तुम अपने अति पवित्र विश्वास पर[a] अपने आप को दृढ़ बनाते हुए और पवित्र आत्मा में[b] प्रार्थना करते हुए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने अति पवित्र विश्वास में।” यूनानी रचना का अर्थ किसी नींव पर निर्माण करना या विश्वास के संबंध में स्वयं को दृढ़ बनाना—दोनों हो सकता है। यहाँ “विश्वास” का अर्थ “भरोसा” या “विश्वासयोग्यता” भी हो सकता है, यद्यपि इस संदर्भ में समुदाय का साझा मसीही विश्वास अधिक संभावित है।
    reason: lexical_alternative
  - marker: b
    text: या, “पवित्र आत्मा के द्वारा।” यह पदबंध प्रार्थना के क्षेत्र (“में”) अथवा आत्मा की सामर्थ्य देने वाली भूमिका (“के द्वारा”) पर बल दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: पर हे प्रियो
  rationale: δέ पिछले संदर्भ के भक्तिहीन लोगों से विरोध दिखाता है, जबकि स्पष्ट ὑμεῖς संबोधित समुदाय पर बल देता है। हिंदी में आगे का संबोधन ‘हे प्रियो’ इस प्रत्यक्ष और बलयुक्त विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀγαπητοί
  choice: हे प्रियो
  rationale: यह बहुवचन संबोधन स्नेह और गरिमा दोनों रखता है। ‘हे प्रियो’ आधुनिक, बोधगम्य और धर्मग्रंथीय गरिमा के अनुकूल है।
- source_word: ἐποικοδομοῦντες ἑαυτοὺς
  choice: स्वयं को दृढ़ बनाते हुए
  rationale: क्रिया में निर्माण करने और पहले से उपस्थित नींव पर आगे बनाने का रूपक है। ‘दृढ़ बनाते हुए’ हिंदी में आत्मिक उन्नति का अर्थ स्वाभाविक रूप से देता है, जबकि ‘पर’ नींव के रूपक को बनाए रखता है। बहुवचन आत्मवाचक ἑαυτούς का सामुदायिक भाव ‘स्वयं को’ में सुरक्षित है।
- source_word: τῇ ἁγιωτάτῃ ὑμῶν πίστει
  choice: अपने अति पवित्र विश्वास पर
  rationale: दत्तिव को निर्माण की नींव या आधार के रूप में समझा जा सकता है। ‘पर’ निर्माण-रूपक के साथ स्वाभाविक है; ‘अति पवित्र’ ἁγιωτάτῃ की सर्वोत्तमावस्था को और ‘विश्वास’ πίστις के संभावित सामुदायिक, स्वीकृत विश्वास को व्यक्त करता है।
- source_word: ἐν πνεύματι ἁγίῳ
  choice: पवित्र आत्मा में
  rationale: यह पदबंध सबसे स्वाभाविक रूप से दिव्य पवित्र आत्मा की ओर संकेत करता है। ‘में’ ἐν को निकटता से रखता है और प्रार्थना के क्षेत्र या आत्मा की सामर्थ्य—दोनों संभावित पहलुओं को पूरी तरह बंद नहीं करता।
- source_word: προσευχόμενοι
  choice: प्रार्थना करते हुए
  rationale: वर्तमान कृदंत को कृदंतीय रूप में रखा गया है, जिससे अगले पद तक चलने वाली यूनानी वाक्य-धारा बनी रहती है।
theological_decisions:
- issue: ἐν πνεύματι ἁγίῳ में ‘पवित्र आत्मा’ का संदर्भ
  choice: दिव्य पवित्र आत्मा
  alternative: पवित्र मनोभाव या मानवीय आत्मा
  rationale: आरंभिक मसीही प्रयोग और यहूदा के उपदेशात्मक संदर्भ में यह दिव्य पवित्र आत्मा का अधिक स्वाभाविक संदर्भ है। फिर भी ‘में’ यह तय नहीं करता कि मुख्य बल क्षेत्र पर है या सामर्थ्य देने वाले माध्यम पर।
- issue: πίστις का अर्थ
  choice: समुदाय का साझा मसीही विश्वास
  alternative: व्यक्तिगत भरोसा या विश्वासयोग्यता
  rationale: यहूदा में ‘विश्वास’ की भाषा सौंपे गए प्रेरितिक विश्वास की ओर संकेत करती है। मुख्य पाठ का ‘विश्वास’ अन्य संभावित अर्थों को शब्द-स्तर पर समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। पद यूनानी मूल की अपूर्ण, अगले पद में जारी रहने वाली कृदंतीय संरचना को बनाए रखने के लिए अल्पविराम पर समाप्त होता है।
