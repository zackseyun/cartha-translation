source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts[a], feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead[c][b], uprooted.
translation:
  language: hi
  text: ये लोग तुम्हारे प्रेम-भोजों में छिपी हुई चट्टानें हैं[a]; वे बिना भय के एक साथ भोज करते हुए अपनी ही चरवाही करते हैं[b]। वे बिना पानी के बादल हैं, जिन्हें हवाएँ उड़ा ले जाती हैं; वे पतझड़ के फलहीन पेड़ हैं—दो बार मरे हुए, जड़ से उखड़े हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे प्रेम-भोजों में कलंक” अथवा “दाग।” यूनानी शब्द नैतिक दोष का बोध करा सकता है, पर वह समुद्र में छिपी खतरनाक चट्टानों को भी सूचित कर सकता है।
    reason: alternative_reading
  - marker: b
    text: '“अपनी ही चरवाही करते हैं” का अनुवाद “अपना ही पेट भरते हैं” भी हो सकता है। तुलना करें: यहेजकेल 34:2–3।'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: σπιλάδες
  choice: छिपी हुई चट्टानें
  rationale: यह शब्द समुद्र में छिपी उन चट्टानों को सूचित कर सकता है जो जहाज़ों के लिए खतरा होती हैं। यहूदा की सजीव प्राकृतिक उपमाओं की शृंखला में यही अर्थ उपयुक्त है; नैतिक ‘कलंक’ का विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἀγάπαις
  choice: प्रेम-भोजों
  rationale: बहुवचन यहाँ मसीही समुदाय के उन सामूहिक भोजों के लिए है जिनकी विशेषता पारस्परिक प्रेम थी। ‘प्रेम-भोज’ संक्षिप्त और स्थापित पद है।
- source_word: συνευωχούμενοι
  choice: तुम्हारे साथ भोज करते
  rationale: कृदंत का अर्थ साथ मिलकर भोज करना है। प्रसंग के कारण ‘तुम्हारे साथ’ हिन्दी में सहभागी भाव स्पष्ट करता है।
- source_word: ἀφόβως
  choice: निर्भय होकर
  rationale: यह मूल के ‘बिना भय’ को स्वाभाविक हिन्दी में रखता है और लापरवाही, निर्लज्जता अथवा श्रद्धाहीनता में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἑαυτοὺς ποιμαίνοντες
  choice: केवल अपनी ही चरवाही करते
  rationale: ‘चरवाही करना’ मूल के चरवाहा-रूपक और यहेजकेल 34 की अनुगूँज को बनाए रखता है। ‘केवल’ आत्मकेंद्रित विरोध को हिन्दी में स्पष्ट करता है, जो कर्मवाचक सर्वनाम के बल में निहित है।
- source_word: νεφέλαι ἄνυδροι
  choice: बिना पानी के बादल
  rationale: यह वर्षा का वादा करके भी कुछ न देने की ठोस छवि को सहज हिन्दी में बनाए रखता है।
- source_word: ὑπὸ ἀνέμων παραφερόμεναι
  choice: जिन्हें हवाएँ उड़ा ले जाती हैं
  rationale: यह निष्क्रिय भाव और बाहरी शक्तियों द्वारा इधर-उधर ले जाए जाने की तस्वीर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δένδρα φθινοπωρινὰ ἄκαρπα
  choice: पतझड़ के निष्फल पेड़
  rationale: φθινοπωρινός ऋतु के अंतिम चरण को सूचित करता है, जब फल अपेक्षित होता है। ‘पतझड़’ आधुनिक हिन्दी में उस ऋतु और उजाड़पन की छवि को स्पष्ट करता है; ‘निष्फल’ फलहीनता को संक्षेप में रखता है।
- source_word: δὶς ἀποθανόντα
  choice: दो बार मरे हुए
  rationale: मूल की तीखी और जानबूझकर रहस्यमय अभिव्यक्ति को बिना व्याख्यात्मक रूप से हल किए सीधे रखा गया है।
- source_word: ἐκριζωθέντα
  choice: जड़ से उखड़े हुए
  rationale: यह पूरी तरह जीवनहीन और फिर से फलने की संभावना से रहित पेड़ों की प्रबल छवि बनाए रखता है।
theological_decisions:
- issue: σπιλάδες द्वारा झूठे शिक्षकों का चित्रण
  choice: समुदाय के प्रेम-भोजों में उपस्थित खतरनाक छिपी चट्टानें
  alternative: प्रेम-भोजों में कलंक या दाग
  rationale: निकटवर्ती संदर्भ प्राकृतिक उपमाओं की शृंखला है, इसलिए छिपे समुद्री खतरे का अर्थ अधिक संगत है। फिर भी शब्द के नैतिक अर्थ और प्राचीन अनुवाद-परंपरा को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἑαυτοὺς ποιμαίνοντες का बल
  choice: चरवाहे के रूपक को बनाए रखते हुए आत्मकेंद्रित चरवाही
  alternative: अपना ही पेट भरते हैं / स्वयं को खिलाते हैं
  rationale: ποιμαίνω का सामान्य अर्थ चरवाही करना है। इसे बनाए रखने से स्वार्थी अगुवों के विरुद्ध यहेजकेल 34 की अनुगूँज बनी रहती है; ‘खिलाना’ संभव है, पर रूपक को समय से पहले संकुचित कर देता है।
- issue: δὶς ἀποθανόντα का अर्थ
  choice: दो बार मरे हुए
  alternative: पूरी तरह मरे हुए
  rationale: पद का धर्मवैज्ञानिक आशय पूरी तरह स्पष्ट नहीं है। प्रत्यक्ष अनुवाद मूल की वाग्मिता और वास्तविक अस्पष्टता दोनों बचाता है, जबकि ‘पूरी तरह’ उसकी संख्या-संबंधी अभिव्यक्ति को समझाकर समाप्त कर देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। अर्धविराम और दीर्घ विराम उपमाओं की तीव्र शृंखला को स्पष्ट करते हैं। ‘प्रेम-भोज’, ‘चरवाही’ और ‘दो बार मरे हुए’ जैसे पद मूल की धार्मिक-सामुदायिक पृष्ठभूमि, रूपक और तनाव को सुरक्षित रखते हैं।
