  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: hi
  text: पर यीशु ने उत्तर में कहा, “तुम नहीं जानते कि तुम क्या माँग रहे हो। क्या तुम उस प्याले[a] को पी सकते हो जिसे मैं पीने वाला हूँ?” उन्होंने उससे कहा, “हम पी सकते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् वह ‘प्याला’ जिसे यीशु पीने वाले हैं। यूनानी में ‘प्याला’ रूपक बना रहता है; बाइबलीय प्रयोग में यह किसी के नियत भाग, विशेषकर दुःख, का संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: पर यीशु ने उत्तर दिया
  rationale: δέ के हल्के विरोध को ‘पर’ से व्यक्त किया गया है। हिन्दी में ‘उत्तर देकर कहा’ अनावश्यक रूप से भारी होता; ‘उत्तर दिया’ यूनानी कथन-सूत्र का स्वाभाविक और पर्याप्त रूप है।
- source_word: Οὐκ οἴδατε
  choice: तुम नहीं जानते
  rationale: οἶδα के मूल अर्थ ‘जानना’ को सीधे रखा गया है; ‘समझते’ कहना अधिक व्याख्यात्मक होता।
- source_word: τί αἰτεῖσθε
  choice: कि तुम क्या माँग रहे हो
  rationale: वर्तमान काल की जारी याचना को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δύνασθε πιεῖν
  choice: क्या तुम उसे पी सकते हो?
  rationale: क्षमता का प्रश्न स्पष्ट रहता है और हिन्दी में ‘क्या तुम पीने में समर्थ हो?’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: τὸ ποτήριον
  choice: प्याला
  rationale: यूनानी रूपक को सुरक्षित रखा गया है; मुख्य पाठ में इसे ‘दुःख’ कह देना अर्थ को समय से पहले सीमित कर देता।
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: जो प्याला मैं पीने पर हूँ
  rationale: μέλλω की निकट अथवा निश्चित आगामी क्रिया को व्यक्त करता है और प्याले का रूपक बनाए रखता है।
- source_word: λέγουσιν αὐτῷ
  choice: उन्होंने उससे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को पठनीय हिन्दी कथा-शैली में भूतकाल से व्यक्त किया गया है।
- source_word: Δυνάμεθα
  choice: हम पी सकते हैं
  rationale: उत्तर में निहित क्रिया ‘पीना’ को हिन्दी में दोहराने से आशय स्पष्ट और स्वाभाविक रहता है, साथ ही δύνασθε/Δυνάμεθα की क्षमता-संबंधी संगति बनी रहती है।
theological_decisions:
- issue: ‘प्याले’ का रूपक
  choice: मुख्य पाठ में ‘प्याला’ बनाए रखा गया है।
  alternative: ‘जिस दुःख को मैं सहने पर हूँ’ अथवा ‘दुःख का प्याला’
  rationale: यह बाइबलीय रूपक नियत भाग और विशेषतः आने वाले दुःख की ओर संकेत करता है, पर मूल पाठ इसे यहाँ स्पष्ट नहीं करता। इसलिए रूपक और उसकी धर्मवैचारिक व्यापकता को अनसुलझा रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। सर्वनाम ‘तुम’ बहुवचन शिष्यों को संबोधित करता है। कोई पाद-टिप्पणी नहीं जोड़ी गई, क्योंकि मुख्य पाठ में ‘प्याला’ रूपक स्वयं सुरक्षित है और इस पद की आवश्यक अस्पष्टता बनाए रखता है।
