id: MAT.20.25
reference: Matthew 20:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: hi
  text: पर यीशु ने उन्हें अपने पास बुलाकर कहा, “तुम जानते हो कि गैर-यहूदियों[a] के शासक उन पर प्रभुता जमाते हैं, और उनके बड़े लोग[b] उन पर अधिकार चलाते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जातियों”।
    reason: alternative_reading
  - marker: b
    text: या “उनके महान लोग” अथवा “उनके उच्च अधिकारी”।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: उन्हें अपने पास बुलाकर
  rationale: मध्यवाच्य कृदंत में यीशु द्वारा चेलों को अपने पास बुलाने का भाव है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: Οἴδατε
  choice: तुम जानते हो
  rationale: रूप की दृष्टि से पूर्णकाल होते हुए भी οἶδα का यहाँ वर्तमान अर्थ है।
- source_word: ἄρχοντες
  choice: शासक
  rationale: यह शासन करनेवालों के लिए व्यापक और आधुनिक हिन्दी शब्द है।
- source_word: τῶν ἐθνῶν
  choice: गैर-यहूदियों
  rationale: यहूदी संदर्भ में ἔθνη का आशय गैर-यहूदी लोगों से है; ‘जातियों’ की वैध व्यापक संभावना पादटिप्पणी में रखी गई है।
- source_word: κατακυριεύουσιν
  choice: प्रभुता जमाते हैं
  rationale: क्रिया केवल शासन नहीं, बल्कि दबदबे के साथ प्रभुता करने का नकारात्मक भाव व्यक्त करती है।
- source_word: οἱ μεγάλοι
  choice: उनके बड़े लोग
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण सामाजिक या राजनीतिक रूप से प्रमुख व्यक्तियों को दर्शाता है; ‘बड़े लोग’ हिन्दी में इस अर्थ को संक्षेप में बनाए रखता है।
- source_word: κατεξουσιάζουσιν
  choice: अधिकार चलाते हैं
  rationale: यह दूसरों पर अधिकार का प्रयोग करने को व्यक्त करता है और समानांतर क्रिया के साथ दमनकारी संदर्भ भी बनाए रखता है।
- source_word: αὐτῶν
  choice: उन पर
  rationale: सर्वनाम का संबंध गैर-यहूदी लोगों से है; हिन्दी में पुनरुक्ति के बजाय सर्वनाम स्वाभाविक है।
theological_decisions:
- issue: यहूदी संदर्भ में ἐθνῶν का अनुवाद
  choice: गैर-यहूदियों
  alternative: जातियों
  rationale: यीशु गैर-यहूदी संसार में प्रचलित शासन-पद्धति की तुलना आगे बताई जानेवाली शिष्य-नीति से करते हैं। मुख्य पाठ संदर्भगत अर्थ रखता है, जबकि अधिक व्यापक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: οἱ μεγάλοι में प्रमुख व्यक्तियों का उल्लेख
  choice: उनके बड़े लोग
  alternative: उनके उच्च अधिकारी
  rationale: यूनानी पद शाब्दिक रूप से ‘बड़े/महान लोग’ कहता है और अनिवार्य रूप से कोई निश्चित सरकारी पद नहीं बताता; इसलिए मुख्य पाठ में व्यापकता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘प्रभुता जमाते हैं’ और ‘अधिकार चलाते हैं’ समानांतर यूनानी क्रियाओं का अंतर रखते हुए सत्ता के दबावपूर्ण प्रयोग का भाव देते हैं।
