  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: hi
  text: तब ज़बदी के बेटों की माँ अपने बेटों के साथ यीशु के पास आई और उनके सामने झुककर[a] उनसे कुछ माँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें दंडवत करते हुए” अथवा “उनकी उपासना करते हुए”; यूनानी क्रिया प्रसंग के अनुसार श्रद्धा से झुकने, सम्मान देने या उपासना करने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह अगले घटनाक्रम को क्रम से जोड़ने वाला स्वाभाविक कालसूचक शब्द है।
- source_word: προσῆλθεν αὐτῷ
  choice: यीशु के पास आई
  rationale: προσέρχομαι किसी के निकट आने या उसके पास जाने को व्यक्त करता है। संदर्भ से सर्वनाम का संकेत यीशु की ओर है; हिन्दी में नाम स्पष्ट करना स्वाभाविक है।
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: ज़बदी के बेटों की माँ
  rationale: यूनानी संबंधकारक रचना को स्पष्ट और सहज आधुनिक हिन्दी में रखा गया है।
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: अपने बेटों के साथ
  rationale: μετά संबंधकारक के साथ संगति या साथ होने का अर्थ देता है; कर्ता की ओर लौटते संबंध को 'अपने' स्वाभाविक रूप से व्यक्त करता है।
- source_word: προσκυνοῦσα
  choice: उनके सामने झुककर
  rationale: क्रिया शारीरिक रूप से झुकने, श्रद्धा प्रकट करने अथवा उपासना करने तक के अर्थ रख सकती है। मुख्य पाठ का चयन दृश्य में दिखाई देने वाली आदरपूर्ण मुद्रा को व्यक्त करता है और अधिक प्रबल धार्मिक अर्थ को पादटिप्पणी में सुरक्षित रखता है।
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: और उनसे कुछ माँगने लगी
  rationale: αἰτέω माँगने या निवेदन करने को और τι अनिश्चित वस्तु 'कुछ' को व्यक्त करता है; παρά यहाँ माँग के स्रोत को बताता है। हिन्दी में 'माँगने लगी' साथ-साथ चल रही क्रिया को सहज ढंग से प्रस्तुत करता है।
theological_decisions:
- issue: यीशु के संबंध में προσκυνοῦσα का अर्थ
  choice: उनके सामने झुककर
  alternative: उनकी उपासना करके; उन्हें दंडवत करके
  rationale: προσκυνέω श्रद्धापूर्वक झुकने, सम्मान देने या उपासना करने का अर्थ दे सकता है। तत्काल प्रसंग में निवेदन से पहले की शारीरिक और आदरपूर्ण मुद्रा स्पष्ट है, पर धार्मिक अर्थ की संभावना समाप्त नहीं की गई; उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। 'ज़बदी' प्रचलित बाइबलीय नाम-रूप है। आदरसूचक बहुवचन 'उनके/उनसे' हिन्दी में यीशु के प्रति स्वाभाविक सम्मान बनाए रखता है।
