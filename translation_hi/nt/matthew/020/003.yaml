lexical_decisions:
- source_word: ἐξελθὼν
  choice: बाहर जाकर
  rationale: एओरिस्ट कृदंत क्रमिक क्रिया बताता है; ‘बाहर जाकर’ हिन्दी कथा-शैली में स्वाभाविक है और मुख्य क्रिया से पहले की क्रिया को स्पष्ट रखता है।
- source_word: περὶ τρίτην ὥραν
  choice: लगभग तीसरे पहर
  rationale: मूल के यहूदी समय-सूचक प्रयोग को मुख्य पाठ में बनाए रखता है; आधुनिक समयानुसार अर्थ पादटिप्पणी में दिया गया है।
- source_word: εἶδεν
  choice: उसने ... देखा
  rationale: ὁράω के साधारण भूतकाल का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἄλλους
  choice: औरों को
  rationale: मूल में विशेषण संज्ञा की तरह प्रयुक्त है; ‘औरों’ से ‘पुरुष’ जैसा अनकहा विवरण नहीं जोड़ा जाता।
- source_word: ἑστῶτας
  choice: खड़े
  rationale: पूर्णकालिक कृदंत यहाँ स्थिति व्यक्त करता है; ‘खड़े’ उनकी अवस्था को संक्षेप और स्वाभाविक ढंग से प्रकट करता है।
- source_word: ἀγορᾷ
  choice: बाज़ार में
  rationale: ἀγορά सार्वजनिक बाज़ार या चौक को सूचित करता है जहाँ मज़दूर इकट्ठे होते थे; ‘बाज़ार’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἀργούς
  choice: बेकार
  rationale: यहाँ अर्थ काम में न लगे होने का है। ‘बेकार’ मूल की ‘निष्क्रिय/काम से खाली’ स्थिति को बनाए रखता है, जबकि ‘बेरोज़गार’ आधुनिक आर्थिक श्रेणी का अधिक स्पष्ट आयात कर सकता है।
