language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: hi
  text: और यीशु रुक गए[a], उन्हें बुलाया और कहा, “तुम क्या चाहते हो कि मैं तुम्हारे लिए करूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ठहर गए।”
    reason: यूनानी στὰς का मूल अर्थ खड़े होने से जुड़ा है, पर इस गतिशील प्रसंग में इसका आशय रुक जाना या ठहर जाना है।
lexical_decisions:
- source_word: στὰς
  choice: रुक गए
  rationale: ἵστημι का यह कृदन्त कथानक में यीशु के चलते-चलते ठहर जाने को बताता है। ‘रुक गए’ आधुनिक हिन्दी में स्वाभाविक है और ‘खड़े हो गए’ की अपेक्षा प्रसंगगत अर्थ अधिक स्पष्ट करता है।
- source_word: ἐφώνησεν
  choice: उन्हें बुलाया
  rationale: φωνέω यहाँ उन दोनों अंधे पुरुषों को अपने पास या अपने ध्यान की ओर बुलाने का अर्थ देता है। ‘बुलाया’ संक्षिप्त और स्वाभाविक है।
- source_word: αὐτοὺς
  choice: उन्हें
  rationale: यह कर्मकारक बहुवचन सर्वनाम निकटवर्ती प्रसंग के दोनों अंधे पुरुषों की ओर संकेत करता है।
- source_word: Τί θέλετε
  choice: तुम क्या चाहते हो
  rationale: प्रश्नवाचक Τί और θέλω की सीधी इच्छा-वाचक शक्ति को सरल, वर्तमान हिन्दी में सुरक्षित रखता है।
- source_word: ποιήσω ὑμῖν
  choice: कि मैं तुम्हारे लिए करूँ
  rationale: θέλετε के बाद विधिलिंग ποιήσω इच्छित कार्य की विषयवस्तु व्यक्त करता है, और ὑμῖν यहाँ हितार्थक है; इसलिए ‘तुम्हारे लिए’ उपयुक्त है।
- source_word: ὁ Ἰησοῦς
  choice: यीशु
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी रूप लिया गया है; यूनानी निर्धारक का अलग अनुवाद आवश्यक नहीं है।
theological_decisions:
- issue: यीशु के प्रश्न का भाव और प्रत्यक्षता
  choice: “तुम क्या चाहते हो कि मैं तुम्हारे लिए करूँ?”
  alternative: “तुम्हारी क्या इच्छा है कि मैं तुम्हारे लिए करूँ?”
  rationale: चुना हुआ रूप यीशु के व्यक्तिगत और सीधे प्रश्न को बिना अतिरिक्त व्याख्या या कृत्रिम औपचारिकता के व्यक्त करता है। यूनानी पाठ यह नहीं बताता कि प्रश्न परीक्षा, निमंत्रण या किसी अन्य विशिष्ट धार्मिक उद्देश्य से पूछा गया था, इसलिए अनुवाद उस उद्देश्य को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, सम्मानपूर्ण और कथात्मक शैली। ‘तुम’ बहुवचन संबोधन है और मूल यूनानी के दूसरे पुरुष बहुवचन को स्वाभाविक रूप से दर्शाता है।
