  terminology: ‘यीशु,’ ‘रुक गए,’ ‘बुलाया,’ and ‘तुम्हारे लिए’ are appropriate, clear, and register-consistent. The footnote’s description of ‘खड़े हो गए’ as a more literal option is potentially misleading in this context, since it can suggest rising to one’s feet rather than halting.
