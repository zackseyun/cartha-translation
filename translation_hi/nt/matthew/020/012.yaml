  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: hi
  text: वे कह रहे थे, “इन बाद में आने वालों ने एक घंटा काम किया, और तुमने इन्हें दिन भर का बोझ उठाने और झुलसा देने वाली गर्मी सहने वाले हम लोगों के बराबर कर दिया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: वे कह रहे थे
  rationale: वर्तमान कृदन्त पिछले कथन से जुड़ा है; हिन्दी में यह रूप कथात्मक प्रवाह और बोलने की क्रिया दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: इन बाद में आनेवालों
  rationale: सन्दर्भ में ἔσχατοι उन मजदूरों को सूचित करता है जिन्हें सबसे बाद में काम पर लगाया गया था; यह अनुवाद उस आशय को स्पष्ट रखता है।
- source_word: μίαν ὥραν ἐποίησαν
  choice: केवल एक घंटा काम किया
  rationale: समय-सूचक पद के साथ ποιέω का अर्थ यहाँ उतनी अवधि तक काम करना है। शिकायत का बल दिखाने के लिए हिन्दी में स्वाभाविक ‘केवल’ निहित विरोध को उभारता है।
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: तुमने इन्हें हमारे बराबर कर दिया
  rationale: यह यूनानी रचना सीधे तौर पर किसी को दूसरे के बराबर करने को व्यक्त करती है और मजदूरों की शिकायत की तीव्रता बनाए रखती है।
- source_word: τοῖς βαστάσασι
  choice: जिन्होंने ... सही
  rationale: βαστάζω में बोझ उठाने और कठिनाई सहने दोनों की छाया है; गर्मी के साथ ‘सही’ आधुनिक हिन्दी में दोनों अनुभवों को स्वाभाविक रूप से समेटता है।
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: दिन भर का बोझ
  rationale: यह पूरे कार्य-दिवस के भारी परिश्रम की छवि को बनाए रखते हुए सहज हिन्दी देता है।
- source_word: τὸν καύσωνα
  choice: झुलसा देनेवाली गर्मी
  rationale: καύσων साधारण गर्मी नहीं, बल्कि प्रचण्ड और झुलसानेवाली गर्मी को दर्शाता है।
theological_decisions:
- issue: दृष्टान्त में समानता और न्याय को लेकर मजदूरों की शिकायत
  choice: मजदूरों के विरोध को सीधे रूप में रखा गया है, बिना यह जोड़े कि मालिक का व्यवहार उचित या अनुचित था।
  alternative: ‘तुमने हमारे साथ अन्याय किया’ जैसे व्याख्यात्मक शब्द जोड़ना।
  rationale: पद मजदूरों की शिकायत सुनाता है, पर व्यापक धर्मवैचारिक प्रश्न का निर्णय इसी वाक्य में नहीं देता; इसलिए मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, बोलचाल में सुबोध और गरिमापूर्ण रखी गई है। ‘हमारे—हमारे, जिन्होंने’ से यूनानी के संबंधवाचक पद का बल और शिकायत का भाव हिन्दी में स्पष्ट होता है।
