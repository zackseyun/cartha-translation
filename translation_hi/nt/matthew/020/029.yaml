  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: hi
  text: जब वे यरीहो[a] से बाहर जा रहे थे, तो एक बड़ी भीड़ उसके पीछे हो ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वे यरीहो से रवाना हो रहे थे।”
    reason: यूनानी ἐκπορευομένων के लिए ‘बाहर जा रहे थे’ के स्थान पर प्रस्थान/रवाना होने का निकट lexical विकल्प सुरक्षित रखता है।
lexical_decisions:
- source_word: ἐκπορευομένων αὐτῶν
  choice: जब वे ... बाहर जा रहे थे
  rationale: वर्तमान कृदन्त का कालसूचक प्रयोग जारी गति को दर्शाता है; यह हिन्दी में स्वाभाविक रूप से ‘जब वे ... बाहर जा रहे थे’ से व्यक्त होता है।
- source_word: ἀπὸ Ἰεριχὼ
  choice: यरीहो से
  rationale: ἀπό किसी स्थान से दूर होने या निकलने की दिशा बताता है; ‘यरीहो से’ आधुनिक हिन्दी में सहज और पर्याप्त है।
- source_word: ἠκολούθησεν αὐτῷ
  choice: उसके पीछे हो ली
  rationale: ἀκολουθέω यहाँ किसी के पीछे चलने का अर्थ देता है। एकवचन ‘उसके’ यूनानी αὐτῷ को बनाए रखकर यीशु को केंद्रित करता है, जबकि ‘हो ली’ भीड़ के साथ स्वाभाविक हिन्दी संगति रखता है।
- source_word: ὄχλος πολύς
  choice: एक बड़ी भीड़
  rationale: यह पद संख्या में बहुत लोगों की भीड़ बताता है; ‘एक बड़ी भीड़’ स्पष्ट और प्रचलित आधुनिक हिन्दी है।
theological_decisions:
- issue: बहुवचन कालसूचक उपवाक्य के बाद एकवचन αὐτῷ का संदर्भ
  choice: भीड़ यीशु के पीछे हो ली (‘उसके’)।
  alternative: भीड़ पूरे समूह के पीछे हो ली (‘उनके’)।
  rationale: यूनानी पाठ ‘वे बाहर जा रहे थे’ के बहुवचन से ‘उसके पीछे’ के एकवचन पर आता है। संदर्भ में यह स्वाभाविक रूप से यीशु को अलग करके केंद्र में रखता है; अनुवाद इस बदलाव को समतल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पीछे हो ली’ शारीरिक रूप से पीछे चलने का भाव स्वाभाविक हिन्दी में देता है; किसी पंथ-विशेष का अर्थ नहीं जोड़ा गया।
