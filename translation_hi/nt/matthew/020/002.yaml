source:
  edition: SBLGNT
  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: hi
  text: मज़दूरों से दिन भर के लिए एक दीनार[a] तय करने के बाद उसने उन्हें अपने अंगूर के बाग में भेज दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक दीनार उस समय एक मज़दूर की एक दिन की सामान्य मज़दूरी थी।
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: तय करने के बाद
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुए समझौते को दिखाता है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है और परस्पर सहमति का भाव बनाए रखता है।
- source_word: δὲ
  choice: —
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है; हिन्दी में कृदंत-वाक्यांश स्वयं पर्याप्त प्रवाह देता है, इसलिए अलग शब्द जोड़ना अनावश्यक है।
- source_word: ἐργατῶν
  choice: मज़दूरों
  rationale: दिहाड़ी पर अंगूर के बाग में काम करने वालों के लिए यह स्पष्ट, आधुनिक और प्रसंगानुकूल शब्द है।
- source_word: ἐκ δηναρίου
  choice: एक दीनार
  rationale: यह सहमत मज़दूरी की राशि बताता है। प्राचीन सिक्के का नाम बनाए रखा गया है, आधुनिक मुद्रा से प्रतिस्थापित नहीं किया गया।
- source_word: τὴν ἡμέραν
  choice: दिन भर के लिए
  rationale: कालावधि-सूचक कर्मकारक पूरे कार्य-दिवस के लिए तय मज़दूरी व्यक्त करता है; यह अनुवाद प्रसंग को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἀπέστειλεν
  choice: भेज दिया
  rationale: यह सामान्य कथात्मक क्रिया का स्वाभाविक हिन्दी रूप है और काम पर भेजे जाने का भाव स्पष्ट करता है।
- source_word: ἀμπελῶνα
  choice: अंगूर के बाग
  rationale: आधुनिक सामान्य हिन्दी में ‘दाख की बारी’ की तुलना में अधिक सहज और व्यापक रूप से समझा जाने वाला रूप।
- source_word: αὐτοῦ
  choice: अपने
  rationale: हिन्दी में कर्ता के अपने बाग का उल्लेख करने के लिए निजवाचक ‘अपने’ स्वाभाविक है और मूल के स्वामित्व-संबंध को ठीक व्यक्त करता है।
