  text: ⸂Καὶ ἀναβαίνων ὁ⸃ Ἰησοῦς εἰς Ἱεροσόλυμα παρέλαβεν τοὺς δώδεκα ⸀μαθητὰς κατ’ ἰδίαν, ⸂καὶ ἐν τῇ ὁδῷ⸃ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: hi
  text: जब यीशु यरूशलेम जा रहे थे, तो उन्होंने बारह शिष्यों को अलग ले जाकर मार्ग में उनसे कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: जा रहे थे
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ चल रही यात्रा को दिखाता है। हिन्दी में ‘जा रहे थे’ स्वाभाविक है; यरूशलेम की ओर ‘ऊपर’ जाने का भाव संदर्भ में निहित है, जबकि ‘ऊपर चढ़ रहे थे’ यहाँ अस्वाभाविक लग सकता है।
- source_word: εἰς Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: गंतव्य को ‘यरूशलेम जा रहे थे’ में स्वाभाविक हिन्दी वाक्य-विन्यास से व्यक्त किया गया है।
- source_word: παρέλαβεν
  choice: ले जाकर
  rationale: क्रिया का मूल अर्थ साथ लेना है; κατ’ ἰδίαν के साथ मिलकर यह शिष्यों को दूसरों से अलग ले जाने का भाव देता है।
- source_word: τοὺς δώδεκα μαθητὰς
  choice: बारह शिष्यों
  rationale: मूल पाठ में संख्या और μαθητάς दोनों उपस्थित हैं; ‘शिष्य’ सुसमाचारों के संदर्भ में स्थापित और सहज हिन्दी शब्द है।
- source_word: κατ’ ἰδίαν
  choice: अलग
  rationale: यह दूसरों से पृथक होकर निजी रूप से बात करने का भाव व्यक्त करता है। ‘अलग’ संक्षिप्त और स्वाभाविक है तथा παρέλαβεν के साथ मिलकर पूरा अर्थ देता है।
- source_word: ἐν τῇ ὁδῷ
  choice: मार्ग में
  rationale: यह यात्रा के दौरान होने वाली घटना को गरिमापूर्ण और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἶπεν αὐτοῖς
  choice: उनसे कहा
  rationale: λέγω की सामान्य कथन-क्रिया को औपचारिक निकटता और स्वाभाविक हिन्दी दोनों के साथ प्रस्तुत करता है; आगे कही जाने वाली बात अगले पद में आती है।
