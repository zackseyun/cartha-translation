base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: hi
  text: वे चले गए। वह फिर छठे और नौवें घंटे के आसपास बाहर निकला और उसने वैसा ही किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: तब वे चले गए
  rationale: οἱ पहले बताए गए मज़दूरों की ओर संकेत करता है; δέ यहाँ हल्का कथात्मक संयोजक है, जिसे प्रसंग में स्वाभाविक रूप से ‘तब’ कहा गया है; ἀπῆλθον का अर्थ ‘चले गए’ है।
- source_word: πάλιν
  choice: फिर
  rationale: πάλιν किसी कार्य के दोहराए जाने को दर्शाता है; आधुनिक हिन्दी में ‘फिर’ सहज और सीधा है।
- source_word: ἐξελθὼν
  choice: बाहर निकला
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले या उसके साथ जुड़ी कथात्मक क्रिया बताता है। हिन्दी में इसे समन्वित क्रिया के रूप में रखना अधिक स्वाभाविक है।
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: लगभग छठे और नौवें घंटे
  rationale: περί का अर्थ ‘लगभग’ है। क्रमसूचक घंटों को बनाए रखने से मूल यहूदी समय-गणना और स्रोत-सांस्कृतिक अभिव्यक्ति सुरक्षित रहती है; आधुनिक समय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐποίησεν ὡσαύτως
  choice: उसने वैसा ही किया
  rationale: ἐποίησεν की सामान्य क्रिया ‘किया’ है और ὡσαύτως पिछले कार्य से समानता व्यक्त करता है; ‘वैसा ही किया’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
theological_decisions: []
