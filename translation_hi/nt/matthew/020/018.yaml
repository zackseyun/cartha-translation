  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: hi
  text: “देखो[a], हम यरूशलेम जा रहे हैं। मनुष्य का पुत्र[c] प्रधान याजकों और शास्त्रियों के हवाले कर दिया जाएगा[b], और वे उसे मृत्यु-दंड सुनाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ध्यान दो।”
    reason: lexical_alternative
  - marker: b
    text: या, “सौंप दिया जाएगा”; कुछ संदर्भों में इसी क्रिया का अर्थ “विश्वासघात करके पकड़वाना” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “मनुष्य का पुत्र” यीशु का अपने लिए प्रयुक्त विशिष्ट पदनाम है और इसमें दानिय्येल 7:13–14 की प्रतिध्वनि हो सकती है।
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह स्वाभाविक आधुनिक हिन्दी में ध्यान आकर्षित करने वाले यूनानी संकेतक का बल बनाए रखता है; ‘निहारो’ या ‘देखो तो’ यहाँ अधिक अस्वाभाविक होते।
- source_word: ἀναβαίνομεν
  choice: हम ... जा रहे हैं
  rationale: वर्तमान काल में चल रही यात्रा को स्वाभाविक हिन्दी में व्यक्त करता है। यूनानी में यरूशलेम की ओर ‘ऊपर जाने’ का भाव है, पर हिन्दी में ‘यरूशलेम ऊपर जा रहे हैं’ अस्वाभाविक और भ्रामक लग सकता है।
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित मानक रूप।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: सुसमाचारों में यीशु के विशिष्ट आत्म-संबोधन का स्थापित और रूपगत रूप से निकट हिन्दी अनुवाद; यह दानिय्येल 7 की संभावित प्रतिध्वनि को भी सुरक्षित रखता है।
- source_word: παραδοθήσεται
  choice: हवाले कर दिया जाएगा
  rationale: भविष्यत् कर्मवाच्य और किसी दूसरे के अधिकार में सौंपे जाने का व्यापक भाव व्यक्त करता है, बिना इसे केवल ‘विश्वासघात किया जाएगा’ तक सीमित किए।
- source_word: τοῖς ἀρχιερεῦσιν
  choice: प्रधान याजकों
  rationale: बहुवचन में प्रमुख याजकीय अधिकारियों के लिए हिन्दी बाइबलीय प्रयोग का स्पष्ट और मानक रूप।
- source_word: γραμματεῦσιν
  choice: शास्त्रियों
  rationale: यूनानी पद का सीधा और प्रचलित हिन्दी समतुल्य; ‘व्यवस्था के शिक्षक’ अधिक व्याख्यात्मक होता।
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: वे उसे मृत्युदंड की सज़ा सुनाएँगे
  rationale: न्यायिक दोषनिर्णय और मृत्यु को दंड के रूप में निर्धारित करने का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου का मसीही पदनाम
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र / वह मनुष्य
  rationale: परंपरागत और मूल-पाठ के निकट पदनाम को सुरक्षित रखता है तथा इसे केवल सामान्य मानव-संज्ञा बनाकर इसकी संभावित दानिय्येली प्रतिध्वनि को समाप्त नहीं करता।
- issue: παραδοθήσεται का अर्थ-क्षेत्र
  choice: हवाले कर दिया जाएगा
  alternative: विश्वासघात करके पकड़वा दिया जाएगा
  rationale: यूनानी क्रिया इस पद में hostile custody में सौंपे जाने पर बल देती है; संकुचित विकल्प उस विश्वासघाती कर्ता को स्पष्ट कर देता जिसे यह पद स्वयं नहीं बताता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रधान याजक’, ‘शास्त्री’ और ‘मनुष्य का पुत्र’ जैसे स्थापित बाइबलीय पद मूल शब्दावली और अंतर्पाठीय संबंधों को सुरक्षित रखने के लिए बनाए गए हैं; वाक्य-विन्यास को स्वाभाविक हिन्दी के अनुरूप दो वाक्यों में रखा गया है।
