  text: And when the ten heard it, they became indignant about the two brothers.
translation:
  language: hi
  text: जब बाकी दस चेलों ने यह सुना, तो वे उन दोनों भाइयों को लेकर नाराज़ हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δέκα
  choice: बाकी दस चेले
  rationale: शाब्दिक रूप से ‘वे दस’; संदर्भ में ये यीशु के शेष दस चेले हैं। ‘बाकी’ संबंध को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: ἀκούσαντες
  choice: जब ... ने यह सुना
  rationale: कालवाचक कृदंत को स्वाभाविक हिंदी उपवाक्य में व्यक्त किया गया है; ‘यह’ पिछले कथन की ओर संकेत करता है।
- source_word: ἠγανάκτησαν
  choice: नाराज़ हुए
  rationale: क्रिया तीव्र अप्रसन्नता या रोष व्यक्त करती है; ‘नाराज़ हुए’ आधुनिक, सहज और संदर्भानुकूल है।
- source_word: περὶ τῶν δύο ἀδελφῶν
  choice: उन दोनों भाइयों को लेकर
  rationale: περί यहाँ विवाद या अप्रसन्नता के विषय को बताता है। ‘को लेकर’ अंग्रेज़ी ‘about’ की तरह इस संबंध को सुरक्षित रखता है और ‘पर/से’ द्वारा प्रत्यक्ष लक्ष्य का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
