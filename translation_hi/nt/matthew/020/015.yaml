  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: hi
  text: क्या मुझे अपनी चीज़ों के साथ जो चाहूँ करने का अधिकार नहीं है? या तेरी आँख इसलिए बुरी है कि मैं भला हूँ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “क्या तू इसलिए ईर्ष्या करता है कि मैं भला हूँ?” “आँख बुरी होना” ईर्ष्या करने या किसी की उदारता से कुढ़ने का मुहावरा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: क्या मुझे यह अधिकार नहीं
  rationale: यह पदबंध अनुमति और वैध अधिकार, दोनों का भाव व्यक्त करता है। हिंदी में ‘अधिकार’ स्वामी के अपने धन पर उचित अधिकार को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὃ θέλω ποιῆσαι
  choice: मैं जो चाहूँ करूँ
  rationale: यह अनुवाद θέλω की इच्छा को सहज, आधुनिक हिंदी में व्यक्त करता है और आलंकारिक प्रश्न की संक्षिप्तता बनाए रखता है।
- source_word: ἐν τοῖς ἐμοῖς
  choice: जो मेरा है, उसके साथ
  rationale: यह यूनानी पद स्वामी की अपनी संपत्ति की ओर संकेत करता है। हिंदी रूप स्वामित्व और उसके उपयोग, दोनों को स्पष्ट करता है।
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: तेरी आँख बुरी है
  rationale: मुख्य पाठ में मूल रूपक को सुरक्षित रखा गया है। यह मुहावरा ईर्ष्या या दूसरे की भलाई से कुढ़ने का भाव रख सकता है, जिसे पाद-टिप्पणी स्पष्ट करती है।
- source_word: ἀγαθός
  choice: भला
  rationale: ‘भला’ मूल विशेषण के व्यापक नैतिक अर्थ को बनाए रखता है और ‘बुरी आँख’ के साथ मूल विरोध को सुनाई देता है; प्रसंग में उदारता का संकेत भी बना रहता है।
theological_decisions:
- issue: ὀφθαλμός σου πονηρός मुहावरे को मुख्य पाठ में अर्थ खोलकर कहना या मूल चित्र बनाए रखना
  choice: मुख्य पाठ में ‘तेरी आँख बुरी है’ रूपक को बनाए रखना
  alternative: ‘क्या तू इसलिए ईर्ष्या करता है कि मैं उदार हूँ?’
  rationale: मूल कथन स्वामी की भलाई और मजदूर की ‘बुरी आँख’ को आमने-सामने रखता है। रूपक बनाए रखने से स्रोत की अर्थ-बहुलता और नैतिक तनाव सुरक्षित रहते हैं; संभावित मुहावरेदार अर्थ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दृष्टांत के स्वामी और मजदूर के सीधे संवाद के अनुरूप एकवचन ‘तेरी’ का प्रयोग किया गया है; मूल ‘बुरी आँख’ रूपक को पाद-टिप्पणी सहित सुरक्षित रखा गया है।
