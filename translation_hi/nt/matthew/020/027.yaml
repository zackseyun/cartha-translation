  verdict: revise
  source_fidelity: The draft accurately represents the indefinite conditional force of ὃς ἂν θέλῃ, the community-relative sense of ἐν ὑμῖν, the rank term πρῶτος, and the future-form normative force of ἔσται. ‘दास’ appropriately preserves the stronger force of δοῦλος relative to the preceding verse’s διάκονος. However, ‘तुम्हारा’ is singular in ordinary modern Hindi, while ὑμῶν is plural and refers to the whole group.
  naturalness: The sentence is clear, idiomatic, and suitably dignified in modern standard Hindi. Replacing the singular possessive with ‘तुम सबका’ makes the intended plural relationship explicit without making the phrasing unnatural.
  terminology: ‘प्रथम’ is appropriate for πρῶτος in this register, and ‘दास’ is a defensible, appropriately strong rendering of δοῦλος. No doctrinally loaded expansion has been introduced.
  issues:
  - severity: medium
    issue: The possessive ‘तुम्हारा’ does not explicitly reflect the plural genitive ὑμῶν.
    rationale: 'In modern Hindi, ‘तुम्हारा’ normally addresses one person. The Greek addresses the group: the aspiring first person is to be slave of all the others. ‘तुम सबका’ preserves this plural referent clearly.'
