  text: καὶ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν εἶναι πρῶτος ⸀ἔσται ὑμῶν δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your servant[a].
translation:
  language: hi
  text: और तुममें जो कोई प्रथम होना चाहता है, वह तुम सबका दास होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: जो कोई ... चाहता है
  rationale: सापेक्ष सर्वनाम, ἄν और संभावनार्थक क्रिया का मेल एक अनिश्चित सामान्य शर्त व्यक्त करता है; ‘जो कोई’ इसे स्वाभाविक हिन्दी में रखता है, और ‘चाहता है’ θέλω की इच्छात्मकता बनाए रखता है।
- source_word: ἐν ὑμῖν
  choice: तुममें
  rationale: यह समुदाय के भीतर स्थान या पद को दर्शाता है; सामाजिक श्रेणी के इस प्रसंग में ‘तुममें’ संक्षिप्त और स्वाभाविक है।
- source_word: εἶναι πρῶτος
  choice: प्रथम होना
  rationale: πρῶτος यहाँ सर्वोच्च पद या प्रतिष्ठा की आकांक्षा बताता है। ‘प्रथम होना’ मूल अभिव्यक्ति को सीधे और गरिमापूर्ण ढंग से प्रस्तुत करता है।
- source_word: ἔσται
  choice: होगा
  rationale: भविष्यकाल को सीधे भविष्यकाल में रखा गया है। प्रसंग में इसका मानक अथवा आदेशात्मक बल है, पर उसे ‘बनना होगा’ कहकर स्पष्ट रूप से अनिवार्यता में नहीं बदला गया।
- source_word: ὑμῶν
  choice: तुम्हारा
  rationale: सम्बन्धसूचक रूप बताता है कि प्रथम होना चाहने वाला अन्य शिष्यों की सेवा में उनका दास होगा।
- source_word: δοῦλος
  choice: दास
  rationale: δοῦλος बंधुआ अधीनता का प्रबल शब्द है और पिछले पद के διάκονος से तीव्रतर है। आधुनिक हिन्दी में ‘दास’ इस भेद को ‘सेवक’ की अपेक्षा बेहतर बनाए रखता है, जबकि ‘गुलाम’ की तुलना में बाइबिलीय उपदेश के गरिमापूर्ण रजिस्टर में अधिक स्वाभाविक है।
theological_decisions:
- issue: शिष्यत्व के कथन में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक; गुलाम; बंधुआ सेवक
  rationale: यीशु सामाजिक प्रतिष्ठा की आकांक्षा के विपरीत अत्यन्त दीन और अधीन सेवा रखते हैं। पिछले पद में प्रयुक्त अलग सेवा-सूचक शब्द की तुलना में δοῦλος की तीव्रता बचाने के लिए ‘दास’ चुना गया है; इससे कथन की धार ‘सेवक’ में समतल नहीं होती और ‘गुलाम’ से उत्पन्न अनावश्यक आधुनिक राजनीतिक-सामाजिक स्वर भी मुख्य पाठ पर हावी नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। वाक्य की यूनानी संरचना और भविष्यकाल बनाए रखे गए हैं। इस पद में किसी पाठालोचनात्मक या आवश्यक व्याख्यात्मक पाद-टिप्पणी की जरूरत नहीं समझी गई।
