id: MAT.20.8
reference: Matthew 20:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: hi
  text: जब शाम हुई, तो दाख की बारी का मालिक अपने प्रबंधक से कहता है, ‘मज़दूरों को बुलाओ और अंतिम मज़दूरों से शुरू करके पहले मज़दूरों तक सबको उनकी मज़दूरी दे दो।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: दाख की बारी का मालिक
  rationale: संदर्भ में κύριος स्वामी या मालिक को दर्शाता है; ‘मालिक’ आधुनिक हिन्दी में सहज है और ‘प्रभु’ से उत्पन्न अनावश्यक धार्मिक संकेत से बचता है।
- source_word: τῷ ἐπιτρόπῳ
  choice: अपने प्रबंधक से
  rationale: ἐπίτροπος उस व्यक्ति को दर्शाता है जिसे संपत्ति या कामकाज की देखरेख सौंपी गई हो; ‘प्रबंधक’ यहाँ स्वाभाविक और स्पष्ट है।
- source_word: τὸν μισθὸν
  choice: उनकी मज़दूरी
  rationale: μισθός का अर्थ काम के बदले मिलने वाला वेतन है; खेत-मज़दूरों के संदर्भ में ‘मज़दूरी’ सर्वाधिक उपयुक्त है।
- source_word: ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: अंतिम मज़दूरों से शुरू करके पहले मज़दूरों तक
  rationale: मूल पाठ के क्रम और सीमा को स्पष्ट रखते हुए ‘अंतिम’ तथा ‘पहले’ के बीच का जानबूझकर रखा गया विरोध सुरक्षित किया गया है।
theological_decisions:
- issue: λέγει का ऐतिहासिक वर्तमानकाल
  choice: कहता है
  alternative: कहा
  rationale: यूनानी पाठ वर्तमानकाल ‘कहता है’ का प्रयोग करता है। इसे बनाए रखने से कथन की जीवंतता और स्रोत की कालगत बनावट सुरक्षित रहती है।
- issue: ‘अंतिम’ और ‘पहले’ की व्याख्या
  choice: शब्दों को कथा के मज़दूरों से सीधे जोड़ा गया, पर उनका धार्मिक अर्थ नहीं खोला गया
  alternative: बाद में आए और पहले आए मज़दूर
  rationale: मूल का ἔσχατοι/πρῶτοι विरोध व्यापक दृष्टान्तगत तनाव रखता है; समय-संबंधी अर्थ को अनुवाद में ही अंतिम व्याख्या बना देना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक कथा के अनुकूल शैली। प्रत्यक्ष कथन में स्वाभाविक आदेशात्मक रूप रखा गया है; कोई सांप्रदायिक शब्दावली नहीं जोड़ी गई।
