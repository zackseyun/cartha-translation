    text: यूनानी में “उन्होंने कहा” और “उसने कहा”—दोनों जगह ऐतिहासिक वर्तमान काल है; अधिक शाब्दिक रूप में इन्हें “वे उससे कहते हैं … वह उनसे कहता है” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: उन्होंने उससे कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है; स्वाभाविक हिन्दी कथाशैली में भूतकाल प्रत्यक्ष संवाद को स्पष्ट और सहज बनाता है। सर्वनाम और αὐτῷ को ‘उससे’ के रूप में व्यक्त किया गया है।
- source_word: Ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι उनके वहाँ खड़े रहने का कारण बताने वाला उत्तर प्रस्तुत करता है; ‘क्योंकि’ इसकी व्याख्यात्मक शक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: οὐδεὶς ἡμᾶς ἐμισθώσατο
  choice: हमें किसी ने मज़दूरी पर नहीं लगाया
  rationale: ἐμισθώσατο का अर्थ काम के लिए किराए या मज़दूरी पर लगाना है। यह वाक्यांश केवल सामान्य नियुक्ति के बजाय दिहाड़ी श्रम के प्रसंग को स्पष्ट रखता है।
- source_word: λέγει αὐτοῖς
  choice: उसने उनसे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथन-क्रम के लिए भूतकाल में दिया गया है; दोनों कथन-क्रियाओं की समान शैली हिन्दी में प्रवाह बनाए रखती है।
- source_word: Ὑπάγετε
  choice: जाओ
  rationale: इस प्रसंग में यह कार्यस्थल की ओर जाने की सीधी आज्ञा है; ‘जाओ’ संक्षिप्त और स्वाभाविक है।
- source_word: καὶ ὑμεῖς
  choice: तुम भी
  rationale: καί इस समूह को पहले भेजे गए मज़दूरों के साथ सम्मिलित करता है; ‘भी’ उस समावेशी बल को बनाए रखता है।
- source_word: ἀμπελῶνα
  choice: दाख की बारी
  rationale: आधुनिक हिन्दी बाइबलीय प्रयोग में यह ‘अंगूर की खेती की जगह’ के लिए परिचित, स्पष्ट और गरिमापूर्ण पद है।
