  text: उन्होंने उससे कहा[a], “क्योंकि किसी ने हमें काम पर नहीं रखा।” उसने उनसे कहा, “तुम भी दाख की बारी में जाओ।”
  philosophy: optimal-equivalence
  footnotes:
