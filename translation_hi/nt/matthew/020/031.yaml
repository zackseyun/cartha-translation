reference: Matthew 20:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: hi
  text: लेकिन भीड़ ने उन्हें डाँटा कि वे चुप रहें। फिर भी वे और भी अधिक पुकार उठे, “हे प्रभु, हम पर दया कर, दाऊद के पुत्र!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄχλος
  choice: भीड़
  rationale: यह शब्द यहाँ लोगों के एकत्र समूह को दर्शाता है; ‘भीड़’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ἐπετίμησεν
  choice: डाँटा
  rationale: क्रिया कड़ी फटकार या रोक को व्यक्त करती है। ‘डाँटा’ प्रसंग में भीड़ द्वारा उन्हें चुप कराने के तीखे प्रयास को सहज हिन्दी में रखता है।
- source_word: ἵνα σιωπήσωσιν
  choice: कि वे चुप रहें
  rationale: ἵνα उपवाक्य भीड़ के उद्देश्य को व्यक्त करता है; यह हिन्दी रूप उस उद्देश्य को संक्षिप्त और स्वाभाविक ढंग से देता है।
- source_word: μεῖζον
  choice: और भी अधिक
  rationale: तुलनात्मक क्रियाविशेषण पुकार की बढ़ी हुई तीव्रता को बताता है, पर केवल ध्वनि की ऊँचाई तक अर्थ को सीमित नहीं करता।
- source_word: ἔκραξαν
  choice: पुकारकर कहने लगे
  rationale: κράζω ऊँची और तीव्र पुकार को दर्शाता है। ‘पुकारकर कहने लगे’ इसके बाद आने वाले λέγοντες को भी स्वाभाविक हिन्दी में समाहित करता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन रूप को ‘हे’ स्पष्ट करता है और ‘प्रभु’ सम्मान तथा सम्भावित मसीही अर्थ—दोनों को खुला रखता है।
- source_word: ἐλέησον ἡμᾶς
  choice: हम पर दया कर
  rationale: यह एकवचन आज्ञार्थक विनती का सीधा और प्रचलित हिन्दी रूप है; इसकी तात्कालिकता बनी रहती है।
- source_word: υἱὸς Δαυίδ
  choice: दाऊद के पुत्र
  rationale: शाब्दिक उपाधि को सुरक्षित रखा गया है, क्योंकि मत्ती में इसका राजकीय और मसीही महत्व है; इसे केवल ‘दाऊद के वंशज’ कहना इस अर्थ को सपाट कर देता।
theological_decisions:
- issue: यीशु के लिए मसीही उपाधि υἱὸς Δαυίδ
  choice: मुख्य पाठ में ‘दाऊद के पुत्र’
  alternative: ‘दाऊद के वंशज’
  rationale: यह पद केवल वंशावली का कथन नहीं, बल्कि मत्ती के वृत्तांत में मसीही और राजकीय अर्थ वाली उपाधि भी है। शाब्दिक रूप उस अर्थ-भार को सुरक्षित रखता है।
- issue: यीशु को सम्बोधित करते हुए Κύριε
  choice: ‘हे प्रभु’
  alternative: ‘हे स्वामी’
  rationale: ‘प्रभु’ सम्मानसूचक सम्बोधन और सम्भावित मसीही/ईशवैज्ञानिक प्रतिध्वनि दोनों को बनाए रखता है; ‘स्वामी’ अर्थ को अपेक्षाकृत सांसारिक सम्बन्ध की ओर सीमित कर सकता है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी अपनाई गई है। ‘दया कर’ विनती की सीधाई और एकवचन यूनानी आज्ञार्थक को बनाए रखता है। ‘और भी अधिक’ मूल की अर्थगत व्यापकता सुरक्षित रखता है, जबकि पादटिप्पणी अधिक विशिष्ट ध्वनि-सम्बन्धी विकल्प बताती है।
