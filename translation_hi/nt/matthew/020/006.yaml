  register: सरल, आधुनिक और गरिमापूर्ण मानक हिन्दी अपनाई गई है। समय की मूल बाइबलीय अभिव्यक्ति मुख्य पाठ में रखकर उसका सांस्कृतिक अर्थ पादटिप्पणी में दिया गया है। ऐतिहासिक वर्तमान को जानबूझकर सुरक्षित रखा गया है।
