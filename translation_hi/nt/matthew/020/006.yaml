source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ⸀ἑνδεκάτην ἐξελθὼν εὗρεν ἄλλους ⸀ἑστῶτας, καὶ λέγει αὐτοῖς· Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: hi
  text: फिर लगभग ग्यारहवें घंटे[a] वह बाहर गया और उसने दूसरों को खड़े पाया। वह उनसे कहता है[b], “तुम दिन भर यहाँ बिना काम के क्यों खड़े रहे हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लगभग पाँच बजे।” दिन के घंटे सूर्योदय से गिने जाते थे; इसलिए यह सामान्यतः सूर्यास्त से लगभग एक घंटा पहले का समय था। शाब्दिक रूप से, “लगभग ग्यारहवें घंटे।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसने उनसे कहा।” यूनानी में यहाँ कथात्मक सजीवता के लिए वर्तमान काल, “कहता है,” प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: फिर लगभग ग्यारहवें घंटे
  rationale: περί के साथ कर्मकारक निकट समय दर्शाता है। ‘ग्यारहवें घंटे’ को मुख्य पाठ में रखने से दृष्टान्त की समय-संबंधी शब्दावली बनी रहती है; इसका उस युग के दिन-गणना के अनुसार अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐξελθὼν
  choice: वह बाहर गया
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई क्रिया बताता है। हिन्दी में समापिका क्रिया के रूप में अनुवाद स्वाभाविक ढंग से घटनाक्रम व्यक्त करता है।
- source_word: εὗρεν ἄλλους ἑστῶτας
  choice: उसने कुछ और लोगों को वहाँ खड़े पाया
  rationale: ἄλλους संज्ञा के रूप में प्रयुक्त है और लिंग को अनावश्यक रूप से निर्दिष्ट नहीं करता। ἑστῶτας खड़े होने की जारी अवस्था व्यक्त करता है। ‘वहाँ’ आगे आने वाले ὧδε और प्रसंगानुकूल स्थान को सहज हिन्दी में दर्शाता है।
- source_word: καὶ λέγει αὐτοῖς
  choice: वह उनसे कहता है
  rationale: λέγει यूनानी कथन में ऐतिहासिक वर्तमान है। वर्तमान काल रखने से मूल की कथात्मक सजीवता सुरक्षित रहती है।
- source_word: Τί ὧδε ἑστήκατε
  choice: तुम यहाँ क्यों खड़े रहे हो
  rationale: इस प्रश्न में τί का स्वाभाविक अर्थ ‘क्यों’ है। ἑστήκατε का पूर्णकाल उस अवस्था की निरंतरता को दर्शाता है, जिसे ‘खड़े रहे हो’ व्यक्त करता है।
- source_word: ὅλην τὴν ἡμέραν ἀργοί
  choice: दिन भर बिना काम के
  rationale: ὅλην τὴν ἡμέραν समयावधि को ‘दिन भर’ के रूप में व्यक्त करता है। ἀργοί का अर्थ निष्क्रिय या काम न करते हुए है; ‘बिना काम के’ स्पष्ट है और ‘बेकार’ के संभावित अपमानजनक अर्थ से बचता है।
