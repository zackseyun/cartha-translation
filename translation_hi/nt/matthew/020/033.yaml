  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: hi
  text: उन्होंने उससे कहा, “प्रभु[a], हमारी आँखें खुल जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महोदय”।
    reason: κύριε यहाँ ‘प्रभु’ अथवा सम्मानसूचक ‘महोदय’ के अर्थ में समझा जा सकता है।
lexical_decisions:
- source_word: λέγουσιν
  choice: उन्होंने कहा
  rationale: ऐतिहासिक वर्तमान को हिन्दी कथात्मक शैली में स्वाभाविक भूतकाल से व्यक्त किया गया है।
- source_word: αὐτῷ
  choice: उससे
  rationale: सम्बोधन के प्राप्तकर्ता को दर्शाने वाला सम्प्रदान कारक हिन्दी में ‘उससे’ द्वारा स्वाभाविक रूप से व्यक्त होता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: κύριος का सम्बोधन रूप आदर और अधिकार—दोनों की सम्भावना रखता है; ‘प्रभु’ इसे बनाए रखता है, जबकि ‘महोदय’ भी प्रसंगतः सम्भव है।
- source_word: ἵνα ἀνοιγῶσιν
  choice: खुल जाएँ
  rationale: ἵνα के साथ कर्मवाच्य सम्भावनार्थक क्रिया यहाँ माँगी गई बात को व्यक्त करती है। ‘खुल जाएँ’ हिन्दी में स्वाभाविक है और आँखों पर होने वाले परिणाम को सुरक्षित रखता है।
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: हमारी आँखें
  rationale: संज्ञा और सम्बन्धवाचक सर्वनाम का सीधा तथा स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: यीशु के लिए सम्बोधन κύριε का अनुवाद
  choice: प्रभु
  alternative: महोदय
  rationale: ‘प्रभु’ आदर के साथ यीशु के अधिकार की सम्भावित पहचान को भी बनाए रखता है, पर पाठ स्वयं वक्ताओं की पूर्ण मसीही समझ को स्पष्ट नहीं करता; इसलिए अधिक सामान्य अर्थ को पादटिप्पणी में रखा गया है।
