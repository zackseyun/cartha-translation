  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: hi
  text: यीशु को उन पर करुणा आई, और उसने उनकी आँखों को छुआ। तुरंत उन्हें दृष्टि मिली[a], और वे उसके पीछे चले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने फिर से देखा।” यूनानी क्रिया का अर्थ “दृष्टि पाना” या “दृष्टि फिर पाना” हो सकता है; अधिक शाब्दिक रूप में इसका अर्थ “ऊपर देखना” भी हो सकता है। यहाँ प्रसंग में यह दृष्टि मिलने को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: करुणा से भरकर
  rationale: यह कृदन्त गहरी दया और करुणा को व्यक्त करता है। यह हिन्दी प्रयोग भाव की तीव्रता को स्वाभाविक और गरिमापूर्ण ढंग से सामने लाता है।
- source_word: δὲ
  choice: अलग शब्द के रूप में अनूदित नहीं
  rationale: यहाँ δέ कथा को हल्के संयोजक के रूप में आगे बढ़ाता है। हिन्दी में नया वाक्य आरम्भ करना वही प्रवाह स्वाभाविक रूप से व्यक्त करता है; ‘परन्तु’ अनावश्यक विरोध उत्पन्न करता।
- source_word: ἥψατο τῶν ὀμμάτων αὐτῶν
  choice: उनकी आँखों को छुआ
  rationale: चंगाई के इस प्रसंग में ἅπτομαι शारीरिक रूप से छूने को दर्शाता है। यूनानी संबंधकारक का स्वाभाविक हिन्दी रूप ‘उनकी आँखों को’ है।
- source_word: εὐθέως
  choice: तुरन्त
  rationale: यह यीशु के स्पर्श के तत्काल परिणाम पर बल देता है और हिन्दी में संक्षिप्त तथा स्पष्ट है।
- source_word: ἀνέβλεψαν
  choice: उनकी दृष्टि लौट आई
  rationale: अंधों की चंगाई के प्रसंग में क्रिया का आशय फिर से देखने लगना अथवा दृष्टि पाना है। यह रूप वास्तविक पुनःस्थापना को स्पष्ट करता है, जबकि मूल क्रिया की वैकल्पिक अभिव्यक्ति पादटिप्पणी में रखी गई है।
- source_word: ἠκολούθησαν αὐτῷ
  choice: वे यीशु के पीछे चल पड़े
  rationale: यह वास्तविक रूप से यीशु के पीछे जाने का अर्थ सुरक्षित रखता है और शिष्यत्व की सम्भावित अनुगूँज को किसी अधिक निश्चित दावे में नहीं बदलता। नाम दोहराने से हिन्दी में बहुवचन सर्वनाम के कारण होने वाली अस्पष्टता भी दूर होती है।
theological_decisions:
- issue: ἀνέβλεψαν में चंगाई के परिणाम का स्वरूप
  choice: दृष्टि का तत्काल लौट आना
  alternative: केवल देखने लगना या ऊपर देखना
  rationale: चमत्कार के प्रसंग और εὐθέως के साथ प्रयुक्त क्रिया वास्तविक तथा तत्काल दृष्टि-बहाली को सूचित करती है; फिर भी क्रिया की शाब्दिक और वैकल्पिक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
- issue: ἠκολούθησαν αὐτῷ का आशय
  choice: वे यीशु के पीछे चल पड़े
  alternative: वे उनके शिष्य बन गए
  rationale: मूल पाठ उनके यीशु के पीछे जाने की बात कहता है। इसमें शिष्यत्व की अनुगूँज हो सकती है, पर उनकी स्थायी या औपचारिक शिष्यता स्पष्ट रूप से नहीं कही गई है।
