id: MAT.20.21
reference: Matthew 20:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: hi
  text: उसने उस स्त्री से कहा, “तुम क्या चाहती हो?” उसने उससे कहा, “कह दीजिए[a] कि मेरे ये दोनों बेटे आपके राज्य[b] में बैठें—एक आपके दाहिने और एक आपके बाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कह दीजिए” का अनुवाद प्रसंग के अनुसार “आज्ञा दीजिए” या अधिक व्याख्यात्मक रूप में “यह वर दीजिए” भी किया जा सकता है; यूनानी क्रिया का मूल अर्थ “कहना” है।
    reason: lexical_alternative
  - marker: b
    text: “राज्य” का अर्थ “राजत्व” या “राजकीय शासन” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: तुम क्या चाहती हो?
  rationale: θέλεις अनुरोध के विषय में सीधा प्रश्न है। αὐτῇ के स्त्रीलिंग संदर्भ के कारण हिन्दी में ‘चाहती’ स्वाभाविक और स्पष्ट है।
- source_word: Εἰπὲ
  choice: कह दीजिए
  rationale: यह λέγω का आज्ञार्थक रूप है और मूलतः ‘कहिए’ का अर्थ देता है। आदरसूचक ‘कह दीजिए’ अनुरोध के प्रसंग में स्वाभाविक है और ‘आज्ञा दीजिए’ या ‘वर दीजिए’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: ἵνα καθίσωσιν
  choice: कि ... बैठें
  rationale: ἵνα-वाक्यांश यहाँ अनुरोध की विषय-वस्तु बताता है। हिन्दी में ‘कि ... बैठें’ नियुक्ति या अनुमति के आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: मेरे ये दोनों बेटे
  rationale: ‘ये’ से οὗτοι का संकेत और ‘मेरे’ से μου का व्यक्तिगत संबंध दोनों बने रहते हैं; शब्दक्रम आधुनिक हिन्दी में स्वाभाविक है।
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: एक आपके दाहिने और एक आपके बाएँ
  rationale: दोनों यूनानी पद स्थान बताते हैं। समानांतर हिन्दी अभिव्यक्ति राजकीय सम्मान के स्थानों का संकेत बनाए रखती है, बिना ‘हाथ’ शब्द जोड़े।
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: आपके राज्य में
  rationale: βασιλεία राज्य, राजत्व या शासन को सूचित कर सकता है। इस प्रसंग में ‘राज्य’ सहज और पारंपरिक है तथा राजकीय अधिकार के अर्थ को बाहर नहीं करता।
theological_decisions:
- issue: यीशु के राज्य में दाहिने और बाएँ बैठने के अनुरोध का स्वरूप
  choice: इसे ‘आपके राज्य में’ सम्मान के स्थानों के लिए राजकीय अनुरोध के रूप में रखा गया है।
  alternative: इसे विशेष रूप से पृथ्वी पर स्थापित मसीही राज्य या अंतिम स्वर्गीय राज्य से जोड़ना।
  rationale: यूनानी पाठ राज्य के चरण या स्थान को निर्दिष्ट नहीं करता। इसलिए अनुवाद राजकीय और सम्मानसूचक अर्थ रखता है, पर किसी विशेष युगांतशास्त्रीय व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, आदरसूचक और सहज मानक हिन्दी अपनाई गई है। स्त्रीलिंग αὐτῇ को स्पष्ट करने के लिए आरंभ में ‘उस स्त्री से’ कहा गया है। संवाद में यीशु के लिए ‘आप’ का प्रयोग सम्मानसूचक है; मूल पाठ की अस्पष्टता बनाए रखते हुए राज्य को पृथ्वी या स्वर्ग के किसी विशिष्ट चरण तक सीमित नहीं किया गया।
