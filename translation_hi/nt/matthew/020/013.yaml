  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: hi
  text: लेकिन उसने उनमें से एक को उत्तर दिया, “मित्र, मैं तुम्हारे साथ अन्याय नहीं कर रहा हूँ। क्या तुमने मुझसे एक दीनार[a] की मजदूरी तय नहीं की थी?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दीनार एक प्रचलित रोमी चाँदी का सिक्का था, जिसे आम तौर पर एक मजदूर की एक दिन की सामान्य मजदूरी के बराबर समझा जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: उत्तर दिया
  rationale: यूनानी कृदन्त स्वामी की प्रत्युत्तरात्मक बात का परिचय देता है। हिन्दी में ‘उत्तर दिया’ स्वाभाविक ढंग से वही अर्थ व्यक्त करता है; ‘उत्तर देते हुए उसने कहा’ अनावश्यक रूप से भारी होता।
- source_word: ἑνὶ αὐτῶν
  choice: उनमें से एक को
  rationale: एकवचन सम्प्रदान और अंशवाचक सम्बन्ध को सीधे तथा स्पष्ट रूप में व्यक्त करता है।
- source_word: Ἑταῖρε
  choice: मित्र
  rationale: सम्बोधन का सामान्य और गरिमापूर्ण हिन्दी समतुल्य है। प्रसंग में यह आत्मीय निकटता के बजाय संयत या कुछ दूरी बनाए रखने वाला सम्बोधन भी हो सकता है; अनुवाद उस स्वर को खुला रखता है।
- source_word: οὐκ ἀδικῶ σε
  choice: मैं तुम्हारे साथ अन्याय नहीं कर रहा हूँ
  rationale: ἀδικέω के किसी व्यक्ति के प्रति अन्याय करने के अर्थ और यूनानी वर्तमान काल—दोनों को स्पष्ट रखता है।
- source_word: οὐχὶ
  choice: क्या ... नहीं
  rationale: यह ऐसे प्रश्न का संकेत है जिसका अपेक्षित उत्तर ‘हाँ’ है; हिन्दी की नकारात्मक प्रश्न-रचना उसी आलंकारिक बल को बनाए रखती है।
- source_word: δηναρίου
  choice: एक दीनार की मजदूरी पर
  rationale: यहाँ सम्बन्धकारक मूल्य को सूचित करता है। ‘दीनार’ ऐतिहासिक मुद्रा को बनाए रखता है, जबकि ‘मजदूरी पर’ नियुक्ति के प्रसंग में सहमति की प्रकृति को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: συνεφώνησάς μοι
  choice: मुझसे सहमति नहीं की थी
  rationale: पहले तय हुई व्यवस्था का अर्थ व्यक्त करता है और अतीत में सम्पन्न सहमति को हिन्दी के पूर्ण भूतकाल से दर्शाता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण संवाद रखा गया है। एकवचन ‘तुम’ यूनानी एकवचन को दर्शाता है और आधुनिक पाठक के लिए ‘तू’ की सम्भावित अपमानजनक ध्वनि से बचता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न और पादटिप्पणियों के विषय परस्पर असंगत थे; इसलिए केवल वास्तविक सांस्कृतिक टिप्पणी को ‘दीनार’ के ठीक बाद रखा गया है।
