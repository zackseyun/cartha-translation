    issue: “पहले बुलाए गए मजदूर” adds “called/hired.”
    rationale: The Greek says only “the first [ones]”; while the parable’s context identifies them as laborers hired first, “बुलाए गए” is not lexically present and can suggest a distinct calling motif. “पहले मजदूर” is both clear in context and closer to the source.
