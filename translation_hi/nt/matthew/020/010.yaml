  naturalness: The proposed revision is natural modern Hindi. “पहले मजदूर” identifies the first group in the parable without the added nuance of being summoned, and “एक-एक दीनार ही मिला” idiomatically conveys the distributive ποσession/payment and contrast.
  terminology: “दीनार” appropriately retains the ancient monetary term. The cultural footnote is accurate and suitably concise. No theological terminology is at issue.
  issues:
