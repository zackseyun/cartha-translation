source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: hi
  text: जब पहले मजदूर आए[a], तो उन्होंने सोचा कि उन्हें अधिक मिलेगा; पर उन्हें भी एक-एक दीनार ही मिला।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पहले वाले”; इससे दृष्टान्त में सबसे पहले काम पर लगाए गए मजदूर अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: एक दीनार मजदूर की एक दिन की सामान्य मजदूरी थी।
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: जब ... आए
  rationale: कालवाचक कृदंत को स्वाभाविक हिन्दी उपवाक्य के रूप में प्रस्तुत किया गया है, जिससे घटनाक्रम स्पष्ट रहता है।
- source_word: οἱ πρῶτοι
  choice: पहले बुलाए गए मजदूर
  rationale: संदर्भ में यह दाख की बारी के लिए सबसे पहले लगाए गए मजदूरों का समूह है; ‘बुलाए गए’ संदर्भ को स्पष्ट करता है, जबकि [a] में अधिक शाब्दिक विकल्प दिया गया है।
- source_word: ἐνόμισαν
  choice: उन्होंने सोचा
  rationale: यहाँ क्रिया अनुमान या अपेक्षा व्यक्त करती है; ‘सोचा’ आधुनिक हिन्दी में सहज है और अनावश्यक निश्चितता नहीं जोड़ता।
- source_word: πλεῖον
  choice: अधिक
  rationale: तुलनात्मक शब्द यहाँ मजदूरी की अधिक मात्रा को सूचित करता है; ‘अधिक’ संक्षिप्त और स्वाभाविक है।
- source_word: λήμψονται
  choice: उन्हें ... मिलेगा
  rationale: भूतकालीन ‘सोचा’ के बाद यह उनकी भावी अपेक्षा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ ἀνὰ δηνάριον
  choice: एक-एक दीनार
  rationale: ἀνά का वितरणार्थक भाव ‘एक-एक’ से स्पष्ट होता है; दीनार मूल सांस्कृतिक मुद्रा को सुरक्षित रखता है।
- source_word: καὶ αὐτοί
  choice: उन्हें भी ... ही
  rationale: ‘भी’ समान भुगतान के आश्चर्य को और ‘ही’ अपेक्षित अधिक रकम के विपरीत वास्तविक राशि को स्वाभाविक हिन्दी में उभारता है।
