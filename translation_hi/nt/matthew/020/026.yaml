  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: hi
  text: तुम्हारे बीच ऐसा नहीं होगा।[a] बल्कि तुममें जो कोई बड़ा बनना चाहे, वह तुम्हारा सेवक होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे बीच ऐसा नहीं है।” यूनानी में क्रिया भविष्यकाल में है (“नहीं होगा”), जो यह व्यक्त कर सकती है कि यीशु के अनुयायियों के बीच व्यवस्था कैसी नहीं होनी चाहिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: तुम्हारे बीच ऐसा नहीं होगा
  rationale: भविष्यकालीन ἔσται को ‘होगा’ से सुरक्षित रखा गया है, जिससे यीशु के अनुयायियों के समुदाय के लिए आगे की मानक व्यवस्था का भाव बना रहता है। ἐν ὑμῖν का स्वाभाविक सामाजिक अर्थ ‘तुम्हारे बीच’ है।
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: बल्कि ... जो कोई ... चाहे
  rationale: ὃς ἂν और संभावनार्थक क्रिया एक अनिश्चित, सामान्य शर्त व्यक्त करते हैं; ‘जो कोई’ इसे स्वाभाविक हिन्दी में दर्शाता है। θέλῃ की इच्छासूचकता ‘चाहे’ से स्पष्ट होती है।
- source_word: μέγας γενέσθαι
  choice: बड़ा बनना
  rationale: γενέσθαι केवल स्थिति में होने के बजाय उस स्थिति में आने का भाव देता है; इसलिए ‘बड़ा बनना’ आकांक्षा और परिवर्तन दोनों को सुरक्षित रखता है।
- source_word: διάκονος
  choice: सेवक
  rationale: यहाँ διάκονος सेवा करने वाले व्यक्ति को दर्शाता है। ‘सेवक’ प्रसंगानुकूल और सामान्य हिन्दी है; ‘डीकन’ बाद के कलीसियाई पद का अनुचित संकेत देगा, जबकि ‘मंत्री’ आधुनिक संस्थागत या राजनीतिक अर्थ ला सकता है।
- source_word: ὑμῶν
  choice: तुम्हारा
  rationale: सम्बन्धकारक बहुवचन का हिन्दी में स्वाभाविक सम्बन्धसूचक रूप ‘तुम्हारा सेवक’ है, अर्थात समुदाय की सेवा करने वाला।
theological_decisions:
- issue: यीशु के अनुयायियों के समुदाय में महानता का स्वरूप
  choice: कथन को सांसारिक पदानुक्रम के मानक को उलटने वाली व्यवस्था के रूप में रखा गया है और ठोस ‘सेवक’ भाषा सुरक्षित है।
  alternative: διάκονος को कलीसियाई पद ‘डीकन’ समझना, या इसे केवल सामान्य विनम्रता के रूप में भावानुवाद करना।
  rationale: आसपास का प्रसंग गैर-यहूदी शासकों की प्रभुता के विपरीत यीशु के शिष्यों के लिए सेवा का मानक रखता है। अनुवाद न तो बाद की संस्थागत संरचना आरोपित करता है, न सेवा की ठोस मांग को अमूर्त बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली अपनाई गई है। ‘बल्कि’ विरोध और मानक-परिवर्तन को स्पष्ट करता है; ‘सेवक’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल पद के गैर-संस्थागत अर्थ को बनाए रखता है।
