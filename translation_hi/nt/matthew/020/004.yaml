  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: hi
  text: और उसने उनसे कहा, ‘तुम भी अंगूर के बाग में जाओ, और जो कुछ उचित होगा, मैं तुम्हें दूँगा।’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो कुछ न्यायसंगत होगा” या “जो कुछ वाजिब होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις
  choice: उनसे
  rationale: यह बहुवचन संकेतवाचक सर्वनाम पिछले संदर्भ में बताए गए मज़दूरों की ओर संकेत करता है; हिन्दी में ‘उनसे’ स्वाभाविक और पर्याप्त है।
- source_word: Ὑπάγετε
  choice: जाओ
  rationale: यह बहुवचन आज्ञार्थक रूप है और यहाँ अंगूर के बाग में जाने की सीधी आज्ञा देता है।
- source_word: καὶ ὑμεῖς
  choice: तुम भी
  rationale: यह उन मज़दूरों को पहले भेजे गए मज़दूरों के साथ सम्मिलित करने पर दिए गए बल को बनाए रखता है।
- source_word: ἀμπελῶνα
  choice: अंगूर के बाग
  rationale: आधुनिक सामान्य हिन्दी में यह ‘दाख की बारी’ की अपेक्षा अधिक सहजता से समझा जाता है और यूनानी शब्द के अर्थ को ठीक व्यक्त करता है।
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: जो कुछ उचित होगा
  rationale: यह अनिश्चित सापेक्ष उपवाक्य तथा δίκαιον के नैतिक अर्थ को बनाए रखता है, बिना उसे केवल कानूनी न्याय या व्यक्तिपरक निष्पक्षता तक सीमित किए।
- source_word: δώσω ὑμῖν
  choice: मैं तुम्हें दूँगा
  rationale: मूल क्रिया का सीधा अर्थ ‘देना’ है। संदर्भ मज़दूरी का है, फिर भी मूल में भुगतान की विशिष्ट क्रिया नहीं है।
theological_decisions:
- issue: मज़दूरी तय करने के संदर्भ में δίκαιον का अनुवाद
  choice: उचित
  alternative: न्यायसंगत / वाजिब
  rationale: ‘उचित’ नैतिक रूप से सही होने का व्यापक भाव रखता है और कथन को केवल कानूनी न्याय या आधुनिक व्यक्तिपरक निष्पक्षता के अर्थ में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अंगूर का बाग’ वर्तमान हिन्दी में स्पष्ट है। प्रत्यक्ष कथन में ‘तुम’ बहुवचन संदर्भ के अनुकूल स्वाभाविक है।
