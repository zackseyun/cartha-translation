source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: hi
  text: क्योंकि स्वर्ग का राज्य एक गृहस्वामी के समान है, जो सुबह-सवेरे अपने अंगूर के बाग में काम करने के लिए मज़दूर रखने निकला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: मत्ती की विशिष्ट अभिव्यक्ति का परिचित और अर्थ-सटीक हिन्दी रूप।
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: उस गृहस्वामी
  rationale: यूनानी में ‘एक मनुष्य, जो गृहस्वामी था’ का आशय है; हिन्दी में ‘गृहस्वामी’ मनुष्य-संदर्भ को स्वाभाविक रूप से समेटता है और अनावश्यक दोहराव से बचाता है।
- source_word: ἅμα πρωῒ
  choice: सुबह-सवेरे
  rationale: बहुत सुबह अथवा दिन निकलते ही का सहज आधुनिक हिन्दी बोध देता है।
- source_word: μισθώσασθαι ἐργάτας
  choice: मज़दूर रखने
  rationale: मज़दूरी पर काम के लिए नियुक्त करने का स्वाभाविक हिन्दी रूप।
- source_word: ἀμπελῶνα
  choice: अंगूर के बाग
  rationale: दाख की बारी की अपेक्षा सामान्य आधुनिक पाठक के लिए अधिक स्पष्ट और स्वाभाविक।
theological_decisions:
- issue: राज्य की उपमा में गृहस्वामी की पहचान
  choice: पाठ में केवल ‘गृहस्वामी’ रखा गया
  alternative: गृहस्वामी को स्पष्ट रूप से परमेश्वर कहना
  rationale: यूनानी पद स्वयं पात्र को परमेश्वर नहीं कहता; व्याख्यात्मक पहचान जोड़ने के बजाय दृष्टांत की मूल खुली संरचना सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। आरंभिक ‘क्योंकि’ (γάρ) से पिछले कथन के साथ तर्क-संबंध बनाए रखा गया है।
