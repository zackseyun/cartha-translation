  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: hi
  text: ‘जो तेरा है, उसे ले और चला जा। पर मैं इस आख़िरी मज़दूर को भी उतना ही देना चाहता हूँ जितना तुझे।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἆρον
  choice: ले
  rationale: यहाँ αἴρω का आज्ञार्थक रूप किसी व्यक्ति को उसके हिस्से की वस्तु लेकर जाने के लिए कहता है। ‘ले’ सीधा और स्वाभाविक है।
- source_word: τὸ σὸν
  choice: जो तेरा है
  rationale: यूनानी पद का शाब्दिक अर्थ ‘जो तुम्हारा है’ है। संदर्भ मज़दूरी का है, फिर भी मूल वाक्यांश में ‘मज़दूरी’ स्पष्ट रूप से नहीं है, इसलिए व्यापक अभिव्यक्ति रखी गई है।
- source_word: ὕπαγε
  choice: चला जा
  rationale: यहाँ यह विदा करने की आज्ञा है। ‘चला जा’ बोलचाल में स्वाभाविक है और कथन की सीधाई बनाए रखता है।
- source_word: θέλω δὲ
  choice: पर मैं ... चाहता हूँ
  rationale: θέλω इच्छा या संकल्प व्यक्त करता है और δέ हल्का विरोध दर्शाता है; आधुनिक हिन्दी में यह संयोजन स्वाभाविक है।
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: इस आख़िरी मज़दूर को
  rationale: ἐσχάτῳ का अर्थ ‘आख़िरी’ है। दृष्टांत के संदर्भ में संकेतित व्यक्ति मज़दूर है; ‘मज़दूर’ जोड़ने से हिन्दी में संदर्भ स्पष्ट रहता है, यद्यपि यूनानी में संज्ञा निहित है।
- source_word: δοῦναι
  choice: देना
  rationale: δίδωμι का सामान्य अर्थ ‘देना’ है। संदर्भ भुगतान का होने पर भी ‘देना’ मालिक की इच्छा और उदारता की व्यापकता को बनाए रखता है।
- source_word: ὡς καὶ σοί
  choice: उतना ही ... जितना तुझे
  rationale: यह तुलना समान मात्रा या व्यवहार को सूचित करती है। यह हिन्दी रूप निहित समानता को सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: एकवचन पुल्लिंग व्यक्तिगत संकेत का अनुवाद
  choice: इस आख़िरी मज़दूर को
  alternative: इस आख़िरी व्यक्ति को
  rationale: दृष्टांत में संकेत एक पुरुष मज़दूर की ओर है। ‘मज़दूर’ प्रसंगानुकूल है और अनावश्यक रूप से लिंग-निरपेक्ष नहीं बनाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। मालिक के कथन की सीधाई बनाए रखने के लिए ‘तेरा/तुझे’ का प्रयोग किया गया है। उपलब्ध अंग्रेज़ी परत में फुटनोट का चिह्न और उसका पाठ परस्पर असंगत दिखते हैं; यूनानी पाठ में यहाँ कोई ऐसी स्पष्ट पाठगत या अर्थगत वैकल्पिकता नहीं है, इसलिए हिन्दी मुख्य पाठ में फुटनोट नहीं जोड़ा गया।
