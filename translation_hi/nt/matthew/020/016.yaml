    issue: ‘हो जाएँगे’ adds a possible becoming/process nuance.
    rationale: The Greek future of εἰμί states that the last ‘will be’ first; it does not explicitly express becoming. Replacing it with ‘होंगे’ preserves the simple predication.
  - severity: low
    issue: The second Hindi clause omits an explicit future copula.
    rationale: Greek permits the ellipsis, but Hindi is clearer and more balanced with ‘वे आखिरी होंगे,’ without altering the concise aphoristic form.
