  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: hi
  text: इस प्रकार जो आखिरी हैं, वे पहले होंगे, और जो पहले हैं, वे आखिरी होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: इसी प्रकार
  rationale: यह दृष्टान्त के निष्कर्ष और उसके अनुप्रयोग को जोड़ता है तथा यूनानी के परिणामसूचक/निष्कर्षात्मक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔσονται
  choice: हो जाएँगे
  rationale: εἰμί के भविष्यकाल को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है; प्रसंग में क्रम-उलटाव का भाव स्पष्ट होता है।
- source_word: οἱ ἔσχατοι
  choice: जो आखिरी हैं
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण को स्पष्ट और सहज हिन्दी में व्यक्त करता है; ‘सबसे छोटे’ कहना सामाजिक मूल्य का अनावश्यक अर्थ जोड़ देता।
- source_word: πρῶτοι
  choice: पहले
  rationale: संक्षिप्त विधेय रूप मूल के विरोधात्मक समानांतर को बनाए रखता है।
- source_word: καὶ
  choice: और
  rationale: मूल में सामान्य संयोजन है; ‘लेकिन’ अनावश्यक विरोधसूचक बल जोड़ता।
- source_word: οἱ πρῶτοι
  choice: जो पहले हैं
  rationale: पहले खंड के समानांतर संज्ञात्मक संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔσχατοι
  choice: आखिरी
  rationale: उलटाव के सूत्र को पूरा करता और पहले खंड के ‘आखिरी’ के साथ शाब्दिक तथा अलंकारिक समानता रखता है।
theological_decisions:
- issue: कथन में उलटाव का स्वरूप
  choice: इसे संक्षिप्त उलटाव-सूक्ति के रूप में रखा गया है, बिना यह निश्चित किए कि ‘आखिरी/पहले’ कालक्रम, सामाजिक स्थिति, प्रतिफल या उद्धार के क्रम को दर्शाते हैं।
  alternative: इसे विशेष रूप से सामाजिक उलटाव, शिष्यत्व के प्रतिफल के उलटाव, अथवा उद्धार के क्रम का कथन मानना।
  rationale: यूनानी पाठ स्वयं इस सूक्ति का क्षेत्र सीमित नहीं करता; अनुवाद उसी धर्मवैचारिक तनाव और व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘जो…हैं, वे…’ संरचना मूल के संज्ञात्मक विशेषणों को स्पष्ट करती है और दोनों खंडों का संतुलन बनाए रखती है।
