  source_fidelity: The draft accurately preserves the balanced reversal and leaves its referent unspecified. However, ‘हो जाएँगे’ can imply a process of becoming, whereas ἔσονται is the simple future copula (‘will be’). ‘होंगे’ is closer to the Greek and to the English audit trail.
  naturalness: The relative-clause phrasing ‘जो ... हैं, वे ...’ is clear, idiomatic modern standard Hindi. Supplying ‘होंगे’ in the second clause makes the elliptical Greek predicate explicit in natural Hindi and strengthens the parallelism.
  terminology: ‘आखिरी’ and ‘पहले’ are natural, concise equivalents of ἔσχατοι and πρῶτοι. They do not over-specify the saying as concerning worth, salvation, social rank, or chronological order.
  issues:
