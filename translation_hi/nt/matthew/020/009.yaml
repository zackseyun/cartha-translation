  verdict: revise
  source_fidelity: The draft accurately represents the connective καί, the participial identification of the group, the distributive ἀνά, and δηνάριον. However, ‘लगभग ग्यारहवें घंटे’ can idiomatically suggest ‘nearly the eleventh hour’ rather than the intended temporal sense ‘at/about the eleventh hour’ (περὶ τὴν ἑνδεκάτην ὥραν).
  naturalness: The sentence is otherwise clear and natural modern Hindi. Recasting the time phrase as ‘ग्यारहवें घंटे के लगभग’ more clearly conveys the intended sense without adding ‘hired’ or other contextual material.
  terminology: ‘दीनार’ appropriately retains the historical Roman coin name. The cultural footnote is suitable and accurately conveys its customary wage association.
  issues:
  - severity: low
    issue: Potential ambiguity in the placement of ‘लगभग’
    rationale: In Hindi, ‘लगभग ग्यारहवें घंटे’ may be read as ‘close to eleven o’clock/the eleventh hour,’ whereas Greek περὶ with the temporal expression denotes ‘about/around the eleventh hour.’ ‘ग्यारहवें घंटे के लगभग’ better preserves that relation.
