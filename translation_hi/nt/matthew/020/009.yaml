  text: ⸂καὶ ἐλθόντες⸃ οἱ περὶ τὴν ἑνδεκάτην ὥραν ἔλαβον ἀνὰ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: hi
  text: और जो लोग ग्यारहवें घंटे के लगभग आए, उन्हें एक-एक दीनार[a] मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दीनार चाँदी का एक प्रचलित रोमी सिक्का था, जिसे आम तौर पर एक मजदूर की एक दिन की सामान्य मजदूरी माना जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक पिछले कथन से घटना को जोड़ता है और यूनानी के सरल कथात्मक प्रवाह को बनाए रखता है।
- source_word: ἐλθόντες
  choice: आए थे
  rationale: यह भूतकालिक कृदन्त उन लोगों का वर्णन करता है; हिन्दी में ‘आए थे’ स्वाभाविक है और मुख्य क्रिया से पहले उनके आने को स्पष्ट करता है।
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: जो लोग लगभग ग्यारहवें घंटे आए थे
  rationale: περὶ समय के साथ ‘लगभग’ का अर्थ देता है। ‘काम पर लगाए गए’ संदर्भ से समझा जा सकता है, पर इस वाक्यांश में प्रत्यक्ष रूप से नहीं कहा गया, इसलिए उसे नहीं जोड़ा गया।
- source_word: ἔλαβον
  choice: मिला
  rationale: मजदूरी दिए जाने के संदर्भ में हिन्दी का ‘उन्हें ... मिला’ स्वाभाविक रूप से प्राप्ति व्यक्त करता है।
- source_word: ἀνὰ
  choice: एक-एक
  rationale: यह वितरणात्मक अर्थ व्यक्त करता है—हर व्यक्ति को एक दीनार।
- source_word: δηνάριον
  choice: दीनार
  rationale: ऐतिहासिक रोमी सिक्के का नाम सुरक्षित रखा गया है; उसके सामान्य मूल्य की जानकारी पाद-टिप्पणी में दी गई है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, स्वाभाविक और गरिमापूर्ण कथात्मक शैली। ‘ग्यारहवाँ घंटा’ प्राचीन समय-गणना को मूल रूप में रखता है, जबकि ‘लगभग’ περὶ की समय-संबंधी अनिश्चितता को सुरक्षित रखता है।
