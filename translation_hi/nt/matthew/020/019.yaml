  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: hi
  text: और वे उसे गैर-यहूदियों को सौंप देंगे, ताकि वे उसका उपहास करें, उसे कोड़े मारें और क्रूस पर चढ़ाएँ; और तीसरे दिन वह जिलाया जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जी उठेगा।” यूनानी क्रिया कर्मवाच्य है (“वह जिलाया जाएगा”); पुनरुत्थान के लिए प्रयुक्त यह सामान्य अभिव्यक्ति परमेश्वर की क्रिया की ओर संकेत कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: सौंप देंगे
  rationale: यह दूसरे के अधिकार में सौंपे जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है और अनावश्यक रूप से ‘विश्वासघात’ का अधिक विशिष्ट अर्थ नहीं जोड़ता।
- source_word: τοῖς ἔθνεσιν
  choice: गैर-यहूदियों के हाथ
  rationale: इस यहूदी प्रसंग में शब्द का संकेत सामान्यतः सभी राष्ट्रों की बजाय गैर-यहूदी अधिकारियों की ओर है; ‘के हाथ’ hostile custody का भाव स्पष्ट करता है।
- source_word: ἐμπαῖξαι
  choice: उपहास करें
  rationale: यह क्रिया हँसी उड़ाने और अपमानित करने का अर्थ देती है; ‘उपहास करना’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: μαστιγῶσαι
  choice: कोड़े लगाएँ
  rationale: यह न्यायिक दंड के रूप में कोड़े मारने का विशिष्ट और आम हिन्दी प्रयोग है।
- source_word: σταυρῶσαι
  choice: क्रूस पर चढ़ाएँ
  rationale: यह क्रूस पर मृत्यु-दंड देने वाली क्रिया का सीधा और स्थापित हिन्दी रूप है। साझा कर्म ‘उसे/उसका’ समन्वित क्रियाओं में स्पष्ट बना रहता है।
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: तीसरे दिन
  rationale: यह कालवाचक पदबंध का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: ἐγερθήσεται
  choice: जिलाया जाएगा
  rationale: भविष्यत् कर्मवाच्य को सुरक्षित रखता है और पुनरुत्थान के संदर्भ में परमेश्वर की निहित क्रिया की संभावना व्यक्त करता है, बिना उसे पाठ में स्पष्ट रूप से जोड़ने के।
theological_decisions:
- issue: पुनरुत्थान की क्रिया का वाच्य
  choice: वह जिलाया जाएगा
  alternative: वह जी उठेगा
  rationale: यूनानी रूप भविष्यत् कर्मवाच्य है। कर्मवाच्य हिन्दी मूल की रचना और परमेश्वर की निहित क्रिया की धर्मवैचारिक सूक्ष्मता सुरक्षित रखती है, जबकि अन्य स्थानों पर मसीह की अपनी सक्रियता को नकारती नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘गैर-यहूदी’ संदर्भगत अर्थ को स्पष्ट करता है, और पुनरुत्थान-वाक्य में मूल यूनानी का कर्मवाच्य सुरक्षित है।
