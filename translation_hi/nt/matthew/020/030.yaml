source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: hi
  text: और देखो, सड़क के किनारे दो अंधे आदमी बैठे थे। जब उन्होंने सुना कि यीशु उधर से गुजर रहे हैं, तो वे पुकार उठे, “हे प्रभु, हम पर दया कीजिए, हे दाऊद के पुत्र!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाले कथात्मक संकेत को बनाए रखता है और आधुनिक हिन्दी में सहज भी है।
- source_word: δύο τυφλοὶ
  choice: दो अंधे पुरुष
  rationale: मूल पाठ दो विशिष्ट पुरुषों की बात करता है; यह अनुवाद संख्या और लिंग दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: सड़क के किनारे ... बैठे थे
  rationale: यह स्थान और शारीरिक स्थिति को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त करता है।
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: जब उन्होंने सुना कि यीशु वहाँ से जा रहे हैं
  rationale: कालवाचक कृदंत को हिन्दी में उपवाक्य के रूप में देना सहज है; ‘वहाँ से जा रहे हैं’ παράγει के निकट से गुजरने के भाव को संदर्भानुकूल व्यक्त करता है।
- source_word: ἔκραξαν λέγοντες
  choice: वे पुकार उठे
  rationale: यह ऊँची और आकुल आवाज़ का भाव संक्षेप में रखता है; हिन्दी में ‘कहते हुए’ जोड़ना अनावश्यक पुनरुक्ति होता।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: प्रत्यक्ष संबोधन और आदरपूर्ण, संभावित मसीही अर्थ दोनों को सुरक्षित रखता है।
- source_word: ἐλέησον ἡμᾶς
  choice: हम पर दया कीजिए
  rationale: करुणापूर्ण सहायता की विनती को स्वाभाविक और सम्मानसूचक हिन्दी में व्यक्त करता है।
- source_word: υἱὸς Δαυίδ
  choice: हे दाऊद के पुत्र
  rationale: मत्ती में प्रयुक्त दाऊदी मसीही उपाधि को वंशज मात्र के वर्णन में सपाट किए बिना बनाए रखता है।
theological_decisions:
- issue: यीशु के लिए प्रत्यक्ष संबोधन Κύριε
  choice: हे प्रभु
  alternative: हे स्वामी / महोदय
  rationale: ‘प्रभु’ संबोधन की श्रद्धा और ‘दाऊद के पुत्र’ के साथ उसके मसीही भार को बनाए रखता है, पर उससे आगे कोई अतिरिक्त सिद्धान्त पाठ में नहीं जोड़ता।
- issue: υἱὸς Δαυίδ का मसीही आशय
  choice: हे दाऊद के पुत्र
  alternative: दाऊद के वंशज
  rationale: शाब्दिक उपाधि मत्ती की दाऊदी और राजकीय-मसीही प्रतिध्वनि को सुरक्षित रखती है; ‘वंशज’ इसे केवल वंशावली-सूचना बना सकता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। यीशु के लिए सम्मानसूचक बहुवचन क्रिया ‘जा रहे हैं’ और विनती में ‘कीजिए’ प्रयुक्त है। ‘हे’ प्रत्यक्ष संबोधन को स्पष्ट करता है, जबकि कथानक में ‘देखो’ मूल के ध्यानाकर्षक संकेत को बनाए रखता है।
