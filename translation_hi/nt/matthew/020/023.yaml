source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: hi
  text: उसने उनसे कहा, “मेरा कटोरा तो तुम अवश्य पीओगे[a], पर मेरे दाहिने और बाएँ बैठने का स्थान देना मेरा नहीं है; वे स्थान उन्हीं के लिए हैं जिनके लिए मेरे पिता ने उन्हें तैयार किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “कटोरा” यीशु के लिए ठहराए गए दुःख या भाग्य का रूपक है, जिसमें उसके शिष्य भी सहभागी होंगे।
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: उसने उनसे कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी की स्वाभाविक कथाशैली में भूतकाल प्रसंग को स्पष्ट और सहज रखता है।
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: मेरा कटोरा तो तुम अवश्य पीओगे
  rationale: ‘कटोरा’ मूल रूपक को बिना मुख्य पाठ में उसकी व्याख्या किए सुरक्षित रखता है। ‘तो’ और ‘अवश्य’ आगामी विरोध के साथ μὲν की पुष्टिकारी शक्ति व्यक्त करते हैं।
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: मेरे दाहिने और बाएँ बैठने की जगह
  rationale: यह हिन्दी में स्वाभाविक ढंग से यीशु के दोनों ओर के सम्मानित स्थानों को व्यक्त करता है और मूल स्थान-संबंधी अर्थ बनाए रखता है।
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: देना मेरा नहीं है
  rationale: यह मूल कथन की सीधी सीमा और उसके धर्मवैज्ञानिक तनाव को सुरक्षित रखता है; ‘मेरे अधिकार में नहीं’ जैसे व्याख्यात्मक विस्तार से बचा गया है।
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: ये जगहें उन्हीं के लिए हैं जिनके लिए ... इन्हें तैयार किया है
  rationale: यूनानी में निहित पद को हिन्दी में स्पष्ट किया गया है। पूर्ण निष्क्रिय क्रिया के परिणामकारी भाव को ‘तैयार किया है’ से व्यक्त किया गया है।
- source_word: ὑπὸ τοῦ πατρός μου
  choice: मेरे पिता ने
  rationale: हिन्दी में स्वाभाविक कर्तृवाच्य मूल निष्क्रिय वाक्य में बताए गए कर्ता को ठीक प्रकार व्यक्त करता है; ‘अकेले’ जैसा कोई अतिरिक्त भाव नहीं जोड़ा गया।
theological_decisions:
- issue: यीशु का कहना कि स्थान देना ‘मेरा नहीं है’
  choice: कथन को बिना व्याख्यात्मक योग्यता जोड़े सीधे रखा गया है।
  alternative: ‘पिता से अलग होकर देना मेरा नहीं है’ या ऐसा कोई सामंजस्यकारी विस्तार जोड़ना।
  rationale: मूल पाठ पिता की तैयारी और पुत्र के कथन के बीच जो धर्मवैज्ञानिक तनाव रखता है, अनुवाद उसे किसी मतगत व्याख्या से हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दाहिने और बाएँ’ बाइबलीय सम्मान-स्थान की छवि को बनाए रखता है। अंग्रेज़ी परामर्श-पाठ में फुटनोट-चिह्नों और उनके विषयों के बीच असंगति थी; इसलिए केवल अर्थपूर्ण ‘कटोरा’ संबंधी टिप्पणी को सही स्थान पर रखा गया है।
