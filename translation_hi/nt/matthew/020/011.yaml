  text: λαβόντες δὲ ἐγόγγυζον κατὰ τοῦ οἰκοδεσπότου
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/011.yaml
  text: And after receiving it[a], they began grumbling against the master of the house,
translation:
  language: hi
  text: और वे उसे पाकर[a] घर के स्वामी के विरुद्ध कुड़कुड़ाने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मजदूरी पाकर वे घर के स्वामी के विरुद्ध कुड़कुड़ा रहे थे।”
    reason: यूनानी participle और imperfect क्रिया के कालगत संबंध तथा निहित कर्म को हिंदी में एक से अधिक स्वाभाविक ढंग से व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: λαβόντες
  choice: उसे पाकर
  rationale: यह aorist participle मुख्य क्रिया से पहले घटित कार्य बताता है। यूनानी में कर्म निहित है; संदर्भ में यह मजदूरी, अर्थात दीनार, है। हिंदी में स्वाभाविकता के लिए ‘उसे’ जोड़ा गया है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है, प्रबल विरोध नहीं; इसलिए ‘और’ प्रवाह के अनुकूल है।
- source_word: ἐγόγγυζον
  choice: कुड़कुड़ाने लगे
  rationale: Imperfect रूप जारी या आरंभ होती क्रिया व्यक्त कर सकता है। ‘कुड़कुड़ाने लगे’ भुगतान मिलने के बाद असंतोष की शुरुआत और धीमे-धीमे शिकायत करने का भाव दोनों रखता है।
- source_word: κατὰ
  choice: के विरुद्ध
  rationale: Genitive के साथ κατά यहाँ किसी व्यक्ति को लक्ष्य बनाकर विरोध या शिकायत का भाव देता है।
- source_word: τοῦ οἰκοδεσπότου
  choice: घर के स्वामी
  rationale: οἰκοδεσπότης घराने या संपदा के मुखिया/स्वामी को दर्शाता है। ‘घर का स्वामी’ यौगिक अर्थ को बनाए रखते हुए आधुनिक हिंदी में समझने योग्य है; दृष्टांत के संदर्भ में ‘ज़मींदार’ भी संभव है, पर वह अर्थ को अधिक विशिष्ट बना देता है।
