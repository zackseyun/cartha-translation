  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: hi
  text: ठीक वैसे ही, मनुष्य का पुत्र सेवा पाने के लिए नहीं, बल्कि सेवा करने और बहुतों के लिए[a] छुड़ौती के रूप में अपना जीवन देने आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्पष्ट रूप से, “बहुतों के बदले छुड़ौती के रूप में।”
    reason: ἀντί के प्रतिस्थापनात्मक अर्थ को स्पष्ट करने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: ὥσπερ
  choice: ठीक वैसे ही
  rationale: यह पिछले उपदेश के साथ तुलना जोड़ता है और यूनानी पद की तुलनात्मक शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु की स्थापित आत्म-पदवी है और दानिय्येल-संबंधी प्रतिध्वनि को सुरक्षित रखती है।
- source_word: οὐκ ἦλθεν
  choice: नहीं ... आया
  rationale: यूनानी अओरिस्ट को प्रसंगानुकूल सामान्य भूतकाल में व्यक्त किया गया है; कोई अनावश्यक स्थानगत अर्थ नहीं जोड़ा गया।
- source_word: διακονηθῆναι
  choice: सेवा पाने
  rationale: कर्मवाच्य क्रिया का यह स्पष्ट और सहज आधुनिक हिन्दी रूप है; ‘सेवा करवाने’ की तुलना में यह कम कठोर और मूल अर्थ के अधिक निकट है।
- source_word: ἀλλὰ διακονῆσαι
  choice: बल्कि सेवा करने
  rationale: यह उसी क्रिया के कर्मवाच्य और कर्तृवाच्य रूपों के बीच मूल विरोध को बनाए रखता है।
- source_word: καὶ δοῦναι
  choice: और ... देने
  rationale: यह पहले उद्देश्यसूचक क्रियारूप के साथ समानांतरता बनाए रखता है और मूल के साधारण अर्थ को व्यक्त करता है।
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: अपना जीवन
  rationale: यहाँ ψυχή का आशय मृत्यु तक अर्पित किया जाने वाला जीवन है, केवल अमूर्त ‘आत्मा’ नहीं।
- source_word: λύτρον
  choice: छुड़ौती
  rationale: यह मुक्ति के लिए दिए जाने वाले मूल्य का अर्थ व्यक्त करने वाला स्थापित और संक्षिप्त हिन्दी शब्द है।
- source_word: ἀντὶ πολλῶν
  choice: बहुतों के लिए
  rationale: मुख्य पाठ में यह स्वाभाविक हिन्दी है; ἀντί के अधिक स्पष्ट प्रतिस्थापनात्मक भाव को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ἀντὶ πολλῶν में ἀντί का बल
  choice: मुख्य पाठ में ‘बहुतों के लिए’
  alternative: ‘बहुतों के बदले’
  rationale: कथन यीशु के जीवन-दान को बहुतों के हित में और उनके स्थान पर दिए गए छुड़ौती-मूल्य के रूप में प्रस्तुत करता है। स्वाभाविक हिन्दी के लिए मुख्य पाठ में ‘के लिए’ रखा गया है, जबकि ἀντί का अधिक स्पष्ट विनिमय अथवा प्रतिस्थापन का भाव पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सेवा पाने—सेवा करने’ से मूल का मौखिक विरोध सुरक्षित है। ‘मनुष्य का पुत्र’ स्थापित बाइबलीय पदवी के रूप में रखा गया है। पादटिप्पणी-चिह्न उसी वाक्यांश के बाद लगाया गया है जिससे वह संबंधित है।
