source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: hi
  text: संध्या होने पर अरिमथिया से यूसुफ नाम का एक धनी व्यक्ति आया, जो स्वयं भी यीशु का चेला बन गया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे स्वयं भी यीशु का चेला बनाया गया था”; अथवा, “जो स्वयं भी यीशु का चेला था।”
    reason: ἐμαθητεύθη के निष्क्रिय रूप और परिणामी स्थिति की वास्तविक अर्थगत संभावनाएँ सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: संध्या होने पर
  rationale: यह संबंधवाचक स्वतंत्र रचना समय में परिवर्तन बताती है। यह अनुवाद पूर्ण हुई परिस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है; δέ के हल्के कथात्मक संक्रमण के लिए अलग शब्द जोड़ना आवश्यक नहीं है।
- source_word: ἦλθεν
  choice: आया
  rationale: ἔρχομαι के सरल कथात्मक भूतकाल का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: ἄνθρωπος πλούσιος
  choice: एक धनी व्यक्ति
  rationale: मूल संज्ञा और विशेषण का स्पष्ट, आधुनिक और गरिमापूर्ण हिन्दी रूप।
- source_word: ἀπὸ Ἁριμαθαίας
  choice: अरिमथिया से
  rationale: ἀπό यहाँ स्थान अथवा उद्गम को सूचित करता है; ‘से’ इसे सीधे व्यक्त करता है।
- source_word: τοὔνομα Ἰωσήφ
  choice: यूसुफ नाम का
  rationale: पहचान बताने वाली यूनानी अभिव्यक्ति का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: ὃς καὶ αὐτὸς
  choice: जो स्वयं भी
  rationale: 'καί और αὐτός का संयुक्त बल सुरक्षित रहता है: यूसुफ भी, दूसरों के साथ, यीशु का चेला था।'
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: यीशु का चेला बन गया था
  rationale: निष्क्रिय रूप यहाँ चेले की स्थिति में आने या बनाए जाने का भाव दे सकता है। मुख्य पाठ का रूप परिणामस्वरूप स्थिति को स्पष्ट और स्वाभाविक हिन्दी में रखता है, जबकि अधिक शाब्दिक निष्क्रिय अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: यीशु के संबंध में ἐμαθητεύθη का अर्थ
  choice: यीशु का चेला बन गया था
  alternative: यीशु का चेला बनाया गया था; यीशु का चेला था
  rationale: क्रिया का निष्क्रिय रूप चेला बनने, चेला बनाए जाने, अथवा परिणामी रूप से चेला होने की स्थिति पर बल दे सकता है। मुख्य पाठ यह नहीं ठहराता कि उसके चेले बनने की प्रक्रिया ठीक किस प्रकार हुई; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्यरचना सरल, कथात्मक और गरिमापूर्ण है। ‘चेला’ सामान्य पाठक के लिए सहज है और μαθητής शब्द-समूह के पारंपरिक बाइबलीय अर्थ को बनाए रखता है।
