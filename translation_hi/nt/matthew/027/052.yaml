lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक कथा के समन्वय और क्रम को बिना अतिरिक्त कालगत अर्थ जोड़े व्यक्त करता है।
- source_word: τὰ μνημεῖα
  choice: कब्रें
  rationale: μνημεῖον यहाँ दफनाने के स्थान को दर्शाता है; आधुनिक हिन्दी में “कब्रें” स्वाभाविक और स्पष्ट है।
- source_word: ἀνεῴχθησαν
  choice: खुल गईं
  rationale: अओरिस्ट कर्मवाच्य का स्वाभाविक हिन्दी रूप; यह कब्रों के खुलने की क्रिया बताता है, पर उसके ढंग को नहीं जोड़ता।
- source_word: πολλὰ σώματα
  choice: बहुत-से शरीर
  rationale: σῶμα का तटस्थ अर्थ “शरीर” सुरक्षित रहता है; “लाशें” अनावश्यक रूप से कठोर और अधिक व्याख्यात्मक होता।
- source_word: τῶν κεκοιμημένων
  choice: सो चुके
  rationale: पूर्णकालिक कृदंत की पूर्ववर्ती अवस्था और मृत्यु के लिए प्रयुक्त मूल रूपक दोनों को संक्षेप में सुरक्षित रखता है।
- source_word: ἁγίων
  choice: पवित्र जनों
  rationale: संज्ञा के रूप में ἅγιοι परमेश्वर के पवित्र लोगों को दर्शाता है; “पवित्र जन” आधुनिक हिन्दी में स्पष्ट है और उनकी पहचान को पाठ से आगे निर्धारित नहीं करता।
- source_word: ἠγέρθησαν
  choice: जिलाए गए
  rationale: ἐγείρω का कर्मवाच्य यहाँ मृतकों को उठाए/जीवित किए जाने का संकेत देता है; “जिलाए गए” स्वाभाविक हिन्दी है और पुनरुत्थान के प्रकार को तंत्रबद्ध ढंग से निर्धारित नहीं करता।
theological_decisions:
- issue: ἠγέρθησαν द्वारा वर्णित घटना का स्वरूप
  choice: “जिलाए गए” कहकर मृत अवस्था से उठाए जाने को व्यक्त करना, पर घटना को किसी विशिष्ट धर्मवैज्ञानिक श्रेणी में न बाँधना।
  alternative: “पुनर्जीवित किए गए” या “जी उठे”
  rationale: यूनानी कर्मवाच्य परमेश्वर-संबंधी अप्रकट कर्ता की संभावना रखता है। “जिलाए गए” कर्मवाच्य को बनाए रखता है और यह तय नहीं करता कि यह अंतिम पुनरुत्थान था या अस्थायी रूप से जीवन में लौटना।
- issue: κεκοιμημένων में मृत्यु के लिए निद्रा का रूपक
  choice: “सो चुके” रूपक को मुख्य पाठ में बनाए रखना।
  alternative: “मर चुके”
  rationale: मूल पाठ मृत्यु को निद्रा के रूपक में व्यक्त करता है। इसे बनाए रखने से उसकी साहित्यिक और धर्मवैज्ञानिक अनुगूँज सुरक्षित रहती है; पादटिप्पणी अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। “पवित्र जन” सामान्य पाठक के लिए “संतों” की अपेक्षा कम संस्थागत अर्थ लिए हुए है। पादटिप्पणी-चिह्न वाक्य के अंत में रखा गया है क्योंकि वह “सो चुके” पदबंध की व्याख्या करता है।
