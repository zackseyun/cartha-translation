base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: hi
  text: और जब प्रधान याजक और पुरनिये उस पर आरोप लगा रहे थे, तो उसने कुछ भी उत्तर नहीं दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: जब ... आरोप लगा रहे थे
  rationale: ἐν के साथ वर्तमानकालिक articular infinitive यहाँ उसी समय चल रही क्रिया व्यक्त करता है। हिंदी में ‘जब ... लगा रहे थे’ समकालिकता और क्रिया की जारी प्रकृति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κατηγορεῖσθαι
  choice: उस पर आरोप लगा रहे थे
  rationale: यूनानी निष्क्रिय रूप का आशय है कि उसके विरुद्ध आरोप लगाए जा रहे थे। हिंदी में कर्तृवाच्य संरचना अधिक सहज है और ὑπό-वाक्यांश के कर्ताओं को स्पष्ट रखती है।
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: प्रधान याजक और पुरनिये
  rationale: ἀρχιερεῖς सुसमाचारों में प्रधान याजकीय नेतृत्व को सूचित करता है, इसलिए ‘प्रधान याजक’ उपयुक्त है। πρεσβύτεροι के लिए ‘पुरनिये’ बाइबलीय-सामुदायिक नेतृत्व का परिचित और संक्षिप्त हिंदी पद है।
- source_word: οὐδὲν
  choice: कुछ भी ... नहीं
  rationale: οὐδέν को सीधे और पूर्ण निषेध के रूप में रखा गया है; ‘कुछ भी उत्तर नहीं दिया’ यूनानी की स्पष्टता बनाए रखता है।
- source_word: ἀπεκρίνατο
  choice: उत्तर नहीं दिया
  rationale: ἀποκρίνομαι का सामान्य अर्थ ‘उत्तर देना’ है। οὐδέν के साथ यह स्वाभाविक आधुनिक हिंदी में ‘कुछ भी उत्तर नहीं दिया’ बनता है, बिना अतिरिक्त व्याख्या जोड़े।
- source_word: καὶ
  choice: और
  rationale: आरंभिक καί कथा की निरंतरता दिखाता है; ‘और’ बिना अनावश्यक विरोध जोड़े वही संबंध बनाए रखता है।
theological_decisions:
- issue: आरोप लगाने वालों के सामने यीशु का मौन
  choice: घटना को सीधे कथात्मक रूप में कहना कि उसने कुछ भी उत्तर नहीं दिया
  alternative: यशायाह 53 की पूर्ति का संकेत अनुवाद में स्पष्ट रूप से जोड़ना
  rationale: यह पद यीशु के मौन का वर्णन करता है, पर स्वयं भविष्यवाणी की पूर्ति का उल्लेख नहीं करता। इसलिए धार्मिक संबंध को अनुवाद में आरोपित किए बिना कथन को यथावत रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुरनिये’ बाइबल-संदर्भ में समुदाय के वरिष्ठ अगुवों के लिए प्रयुक्त परिचित पद है। किसी पाद-टिप्पणी की आवश्यकता नहीं पड़ी, क्योंकि ‘कुछ भी उत्तर नहीं दिया’ οὐδὲν ἀπεκρίνατο के अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
