- source_word: συμβούλιον ... λαβόντες
  choice: आपस में विचार-विमर्श करके
  rationale: यह यूनानी मुहावरे के सामूहिक सलाह और निर्णय लेने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ तीव्र विरोध नहीं, बल्कि कथा को आगे बढ़ाता है; ‘तब’ प्रसंगानुकूल संक्रमण है।
- source_word: ἠγόρασαν
  choice: खरीद लिया
  rationale: ἀγοράζω के सामान्य अर्थ ‘खरीदना’ को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है; ‘लिया’ पूर्ण हुई क्रिया के भाव को सहज बनाता है।
- source_word: ἐξ αὐτῶν
  choice: उन चाँदी के सिक्कों से[a]
  rationale: यूनानी में शाब्दिक रूप से ‘उनसे’ है। निकटवर्ती प्रसंग में संकेत चाँदी के सिक्कों की ओर है; हिन्दी में संदर्भ स्पष्ट करने के लिए संज्ञा जोड़ी गई है, और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: कुम्हार का खेत
  rationale: सम्बन्धकारक पदबंध का सीधा, स्वाभाविक और प्रचलित हिन्दी रूप।
- source_word: εἰς ταφὴν
  choice: ताकि वह ... को दफनाने की जगह हो
  rationale: εἰς यहाँ उद्देश्य व्यक्त करता है। यह रूप खेत के नियत उपयोग को सहज हिन्दी में स्पष्ट करता है।
- source_word: τοῖς ξένοις
  choice: परदेशियों[b]
  rationale: ξένοις इस प्रसंग में बाहर से आए या गैर-स्थानीय लोगों को सूचित कर सकता है। ‘परदेशी’ इस भाव को ‘अजनबी’ की अपेक्षा अधिक सटीक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ἐξ αὐτῶν का संदर्भ
  choice: इसे पिछले प्रसंग के चाँदी के सिक्कों के संदर्भ में ‘उन चाँदी के सिक्कों से’ अनूदित किया गया है।
  alternative: अधिक शाब्दिक रूप ‘उनसे’ या अर्थ-स्पष्ट रूप ‘उस धन से’ हो सकता है।
  rationale: नपुंसकलिंग बहुवचन सर्वनाम का निकटतम प्रसंगगत संदर्भ चाँदी के सिक्के हैं। अनुवाद अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी मूल की सर्वनामात्मक अभिव्यक्ति सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विचार-विमर्श’, ‘कुम्हार का खेत’ और ‘दफनाने की जगह’ सामान्य पाठक के लिए स्पष्ट हैं; ‘परदेशियों’ में गैर-स्थानीय लोगों का प्रसंगगत भाव बना रहता है।
