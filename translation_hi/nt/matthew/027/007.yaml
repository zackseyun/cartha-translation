  text: फिर उन्होंने विचार-विमर्श करने के बाद उन चाँदी के सिक्कों से[a] कुम्हार का खेत परदेशियों के दफ़न के लिए खरीद लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘उनसे’; इसका संकेत पिछले प्रसंग में बताए गए चाँदी के सिक्कों की ओर है।
    reason: lexical_alternative
