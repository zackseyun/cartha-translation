  text: ὁ δὲ Ἰησοῦς πάλιν κράξας φωνῇ μεγάλῃ ἀφῆκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/050.yaml
  text: But Jesus cried out again with a loud voice and gave up his spirit[a].
translation:
  language: hi
  text: पर यीशु ने फिर ऊँचे स्वर से पुकारकर अपना प्राण त्याग दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अंतिम साँस ली।” यूनानी में शाब्दिक रूप से “प्राण/आत्मा छोड़ दी” है—यह मरने के लिए प्रयुक्त एक मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: δέ कथा को आगे बढ़ाते हुए हल्का विरोध या मोड़ दिखाता है; यहाँ ‘पर’ स्वाभाविक रूप से उस मोड़ को व्यक्त करता है।
- source_word: πάλιν
  choice: फिर
  rationale: πάλιν किसी क्रिया की पुनरावृत्ति बताता है; आधुनिक हिन्दी में ‘फिर’ संक्षिप्त और सहज है।
- source_word: κράξας
  choice: पुकारकर
  rationale: κράζω ऊँची और प्रबल पुकार को सूचित करता है। साथ का ‘ऊँचे स्वर से’ उसकी तीव्रता स्पष्ट करता है, और ‘-कर’ यूनानी कृदन्त का मुख्य क्रिया से संबंध बनाए रखता है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से
  rationale: यह दत्तिव पदबंध पुकारने की रीति बताता है; ‘ऊँचे स्वर से’ स्वाभाविक हिन्दी में उसकी प्रबल ध्वनि को व्यक्त करता है।
- source_word: ἀφῆκεν
  choice: त्याग दिया
  rationale: ἀφίημι का मूल भाव छोड़ने या जाने देने का है। πνεῦμα के साथ मृत्यु के मुहावरे में ‘त्याग दिया’ स्रोत की छवि और प्रसंगगत अर्थ दोनों बनाए रखता है।
- source_word: τὸ πνεῦμα
  choice: अपना प्राण
  rationale: πνεῦμα का अर्थ ‘आत्मा,’ ‘श्वास’ या जीवन-प्राण हो सकता है। मृत्यु के इस हिन्दी मुहावरे में ‘प्राण त्याग दिया’ स्वाभाविक है और केवल श्वास रुकने तक अर्थ को सीमित नहीं करता; ‘अपना’ यूनानी निश्चित पद को हिन्दी के स्वाभाविक संबंधसूचक रूप में व्यक्त करता है।
theological_decisions:
- issue: मृत्यु-सूचक मुहावरा ἀφῆκεν τὸ πνεῦμα
  choice: अपना प्राण त्याग दिया
  alternative: अंतिम साँस ली; अपनी आत्मा छोड़ दी
  rationale: ‘अंतिम साँस ली’ मृत्यु का अर्थ स्पष्ट करता है, पर πνεῦμα को केवल साँस की दिशा में संकुचित कर देता है। ‘अपनी आत्मा छोड़ दी’ अधिक शब्दानुगामी है, पर आधुनिक हिन्दी में कम स्वाभाविक और संभावित रूप से अनचाहा दार्शनिक अर्थ लिए हुए है। ‘अपना प्राण त्याग दिया’ स्रोत के छोड़ने के भाव, मृत्यु के मुहावरे और कथन की गंभीरता को संतुलित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाक्य की संक्षिप्तता तथा मूल यूनानी के क्रम—फिर पुकारना, उसके बाद प्राण त्यागना—को बनाए रखा गया है।
