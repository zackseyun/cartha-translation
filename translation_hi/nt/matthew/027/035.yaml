  yaml_path: translation/nt/matthew/027/035.yaml
  text: And after they crucified him[a], they divided his garments by casting lots.
translation:
  language: hi
  text: और उन्होंने उसे क्रूस पर चढ़ाने के बाद उसके वस्त्र चिट्ठी डालकर आपस में बाँट लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταυρώσαντες
  choice: क्रूस पर चढ़ाने के बाद
  rationale: कालवाचक एओरिस्ट कृदंत मुख्य क्रिया से पहले पूरी हुई घटना को दर्शाता है। यह रूप स्वाभाविक आधुनिक हिन्दी में उस क्रम को स्पष्ट रखता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘और’ प्रवाह को सहज रूप से बनाए रखता है।
- source_word: διεμερίσαντο
  choice: आपस में बाँट लिए
  rationale: मध्यवाच्य रूप इस ठोस प्रसंग में वस्त्रों को अपने बीच बाँट लेने का भाव देता है। ‘आपस में बाँट लिए’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: उसके वस्त्र
  rationale: ἱμάτια सामान्यतः पहनावे या वस्त्रों को सूचित करता है। ‘वस्त्र’ गरिमापूर्ण और व्यापक है तथा इसे अनावश्यक रूप से केवल बाहरी कपड़ों तक सीमित नहीं करता।
- source_word: βάλλοντες κλῆρον
  choice: चिट्ठी डालकर
  rationale: यह कृदंतीय वाक्यांश वस्त्र बाँटने का साधन बताता है। एकवचन κλῆρον के अनुरूप ‘चिट्ठी डालकर’ उस प्राचीन निर्णय-पद्धति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: βάλλοντες κλῆρον और διεμερίσαντο का संबंध
  choice: ‘चिट्ठी डालकर’ को वस्त्र बाँटने के साधन के रूप में रखा गया है।
  alternative: ‘उसके वस्त्र आपस में बाँट लिए और चिट्ठी डाली’
  rationale: यूनानी कृदंत स्वाभाविक रूप से मुख्य क्रिया के ढंग या साधन को बताता है। ‘चिट्ठी डालकर’ इस संबंध को स्पष्ट करता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण है। ‘क्रूस पर चढ़ाना’ और ‘वस्त्र’ प्रचलित बाइबलीय शब्दावली हैं, पर वाक्य-विन्यास वर्तमान पाठकों के लिए स्वाभाविक रखा गया है।
