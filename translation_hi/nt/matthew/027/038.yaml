base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/038.yaml
  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: hi
  text: तब उसके साथ दो लुटेरे[a] क्रूस पर चढ़ाए गए—एक उसकी दाहिनी ओर और एक उसकी बाईं ओर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “डाकू”; यूनानी शब्द हिंसक लुटेरों के लिए प्रयुक्त हो सकता है और कुछ संदर्भों में विद्रोही गतिविधि से भी जुड़ सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह कथा में अगली घटना को सूचित करने वाला कालवाचक क्रियाविशेषण है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: σταυροῦνται
  choice: क्रूस पर चढ़ाए गए
  rationale: यूनानी रूप वर्तमानकालीन कर्मवाच्य है और कथात्मक वर्तमान के रूप में प्रयुक्त हुआ है। हिन्दी कथा-शैली में भूतकाल अधिक स्वाभाविक है, जबकि कर्मवाच्य अर्थ सुरक्षित रहता है।
- source_word: σὺν αὐτῷ
  choice: उसके साथ
  rationale: σύν के साथ सम्प्रदान कारक संगति या साथ होने का अर्थ देता है।
- source_word: δύο λῃσταί
  choice: दो लुटेरे
  rationale: λῃστής हिंसक ढंग से लूटने वाले व्यक्ति या डाकू के लिए प्रयुक्त हो सकता है। ‘लुटेरे’ स्पष्ट आधुनिक हिन्दी है और किसी विशिष्ट राजनीतिक पहचान को आरोपित नहीं करता।
- source_word: εἷς ἐκ δεξιῶν
  choice: एक उसके दाहिने
  rationale: यह स्थानवाचक मुहावरा दाहिनी ओर होने को दर्शाता है; स्पष्टता के लिए ‘उसके’ जोड़ा गया है, जो संदर्भ में यीशु की ओर संकेत करता है।
- source_word: καὶ εἷς ἐξ εὐωνύμων
  choice: और एक बाएँ
  rationale: यह δεξιῶν के विपरीत बाईं ओर की स्थिति दर्शाता है; हिन्दी में ‘बाएँ’ स्वाभाविक है।
theological_decisions:
- issue: λῃσταί की पहचान
  choice: लुटेरे
  alternative: डाकू; विद्रोही
  rationale: शब्द हिंसक लुटेरों या डाकुओं को सूचित कर सकता है और कुछ संदर्भों में विद्रोही गतिविधि से जुड़ सकता है, पर यह पद स्वयं विशिष्ट राजनीतिक पहचान निश्चित नहीं करता। इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया है और अस्पष्टता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथा-शैली। ‘क्रूस पर चढ़ाए गए’ प्रचलित और सटीक बाइबिलीय अभिव्यक्ति है। मूल के कथात्मक वर्तमान को हिन्दी में स्वाभाविक पूर्ण भूतकाल से व्यक्त किया गया है।
