base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: hi
  text: 'और उन्होंने उसके सिर के ऊपर उसके विरुद्ध लिखा हुआ आरोप लगाया: “यह यीशु, यहूदियों का राजा है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: लगाया
  rationale: यहाँ क्रिया लिखित आरोप-पट्ट को यीशु के सिर के ऊपर लगाने की ठोस क्रिया बताती है; हिंदी में ‘लगाया’ स्वाभाविक और स्पष्ट है।
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: उसके सिर के ऊपर
  rationale: ἐπάνω के साथ संबंधकारक स्थान को सिर से ऊपर दर्शाता है; ‘सिर के ऊपर’ ठीक स्थानिक अर्थ देता है।
- source_word: τὴν αἰτίαν αὐτοῦ
  choice: उसके विरुद्ध दोषारोपण
  rationale: न्यायिक प्रसंग में αἰτία अभियोग या आरोप को सूचित करता है। ‘दोषारोपण’ कानूनी आशय बनाए रखता है, जबकि पादटिप्पणी में सरल विकल्प दिया गया है।
- source_word: γεγραμμένην
  choice: लिखकर
  rationale: पूर्ण निष्क्रिय कृदंत बताता है कि आरोप लिखित रूप में था; संयुक्त हिंदी वाक्य में ‘लिखकर लगाया’ संक्षिप्त और स्वाभाविक है।
- source_word: Οὗτός ἐστιν Ἰησοῦς
  choice: यह यीशु है
  rationale: संकेतवाचक और संयोजक क्रिया की सीधी संरचना को सहज हिंदी में सुरक्षित रखा गया है।
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: यहूदियों का राजा
  rationale: यह राजकीय-राजनीतिक उपाधि का सीधा और प्रचलित हिंदी रूप है।
- source_word: Ἰουδαίων
  choice: यहूदियों
  rationale: इस दुःखभोग-वर्णन के आरोप-पट्ट में यह पूरे यहूदी समुदाय से संबद्ध राजकीय पदवी का पारंपरिक और प्रसंगानुकूल अर्थ है; ‘यहूदिया-निवासियों’ की संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: क्रूस के आरोप-पट्ट की न्यायिक शब्दावली
  choice: उसके विरुद्ध दोषारोपण
  alternative: उस पर लगाया गया आरोप
  rationale: यह चुनाव αἰτία के औपचारिक न्यायिक बल को बनाए रखता है और दंड के घोषित आधार को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के व्यक्त करता है।
- issue: Ἰουδαίων का अर्थ
  choice: यहूदियों
  alternative: यहूदिया-निवासियों
  rationale: आरोप-पट्ट के राजकीय सूत्र में ‘यहूदियों’ अधिक स्थापित और प्रसंगानुकूल है, पर यूनानी शब्द की भौगोलिक संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। वाक्य में शिलालेख की सीधी शैली रखी गई है और न्यायिक तथा जातीय-भौगोलिक अर्थ-भेद पादटिप्पणियों में सुरक्षित हैं।
