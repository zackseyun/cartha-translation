  verdict: revise
  source_fidelity: Draft accurately conveys binding, leading away, and handing Jesus over to Pilate. However, “वहाँ से” (‘from there’) adds a locative element absent from ἀπήγαγον and should be removed.
  naturalness: The revised wording is fluent, modern standard Hindi and preserves the compact narrative sequence. Repeating “उसे” before “ले गए” makes the object of the finite verb fully clear and natural.
  terminology: “राज्यपाल” is an appropriate broad rendering of ἡγεμών; “पिलातुस” is the established Hindi form of the name; and “के हवाले कर दिया” suitably conveys judicial transfer of custody in παρέδωκαν without over-interpreting it.
  issues:
