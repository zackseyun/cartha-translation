  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: hi
  text: और उसे बाँधकर वे उसे ले गए और राज्यपाल पिलातुस के हवाले कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δήσαντες
  choice: बाँधकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रियाओं से पहले हुई क्रिया को दिखाता है। हिंदी में ‘बाँधकर’ इस पूर्ववर्ती क्रिया और बाँधने के ठोस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπήγαγον
  choice: वहाँ से ले गए
  rationale: क्रिया का अर्थ किसी को उस स्थान से ले जाना है। ‘वहाँ से ले गए’ हिंदी में प्रस्थान और हिरासत में ले जाए जाने के प्रसंग को स्पष्ट रखता है।
- source_word: παρέδωκαν
  choice: के हवाले कर दिया
  rationale: यह अभिव्यक्ति किसी व्यक्ति को दूसरे अधिकारी की हिरासत या अधिकार में सौंपने का न्यायिक भाव सहज आधुनिक हिंदी में व्यक्त करती है।
- source_word: Πιλάτῳ
  choice: पिलातुस
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण रखा गया है।
- source_word: τῷ ἡγεμόνι
  choice: राज्यपाल
  rationale: ἡγεμών किसी शासकीय अधिकारी को दर्शाता है। ‘राज्यपाल’ सुलभ और व्यापक पदनाम है तथा यूनानी से अधिक विशिष्ट ऐतिहासिक पद आरोपित नहीं करता।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: दोनों समुच्चयबोधकों को रखकर घटनाओं की कथात्मक कड़ी और क्रम सुरक्षित रखा गया है।
theological_decisions:
- issue: दुःखभोग-वृत्तांत में παραδίδωμι का अनुवाद
  choice: के हवाले कर दिया
  alternative: को सौंप दिया
  rationale: ‘के हवाले कर दिया’ तत्काल प्रसंग में यीशु को पिलातुस की हिरासत और अधिकार में दिए जाने का अर्थ प्रमुख रखता है, पर क्रिया की व्यापक धर्मवैज्ञानिक प्रतिध्वनि को किसी अतिरिक्त व्याख्या से सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बाँधकर’ कृदन्त की संक्षिप्तता बनाए रखता है; ‘वहाँ से ले गए’ ἀπάγω के दूर ले जाने वाले भाव को व्यक्त करता है। किसी पादटिप्पणी की आवश्यकता नहीं है, क्योंकि स्वाभाविक हिंदी में उपलब्ध विकल्प अर्थ में उल्लेखनीय भिन्नता उत्पन्न नहीं करते।
