- source_word: Ἰησοῦν Βαραββᾶν
  choice: यीशु बरअब्बा
  rationale: प्रदत्त SBLGNT पाठ में दोनों नाम हैं, इसलिए मुख्य पाठ में दोनों को रखा गया है।
