  text: Ἐξερχόμενοι δὲ εὗρον ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα· τοῦτον ἠγγάρευσαν ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: hi
  text: जब वे बाहर जा रहे थे, तो उन्हें कुरेने का शमौन नामक एक व्यक्ति मिला। उन्होंने उसे यीशु का क्रूस उठाकर ले जाने के लिए जबरन सेवा में लगाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξερχόμενοι δὲ
  choice: जब वे बाहर जा रहे थे, तो
  rationale: वर्तमान कृदन्त की समकालिक कालगत भावना और δέ के हल्के कथात्मक संक्रमण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εὗρον
  choice: उन्हें ... मिला
  rationale: हिन्दी में किसी व्यक्ति को पाने/मिलने की इस कथात्मक स्थिति के लिए स्वाभाविक समतुल्य; अर्थतः 'उन्होंने पाया' के अनुरूप।
- source_word: ἄνθρωπον Κυρηναῖον
  choice: कुरेने का ... एक व्यक्ति
  rationale: Κυρηναῖον भौगोलिक मूल बताता है; 'कुरेने का' इसे स्पष्ट और सहज रूप में रखता है।
- source_word: ὀνόματι Σίμωνα
  choice: शमौन नामक
  rationale: यूनानी नाम-सूचक मुहावरे का संक्षिप्त और प्रतिष्ठित हिन्दी रूप।
- source_word: τοῦτον ἠγγάρευσαν
  choice: उन्होंने उसे बेगार में पकड़ लिया
  rationale: ἀγγαρεύω अधिकार द्वारा अनिवार्य सेवा में लगाए जाने को दर्शाता है। 'बेगार में पकड़ लिया' बाध्यता और सेवा—दोनों को स्पष्ट करता है।
- source_word: ἵνα ἄρῃ
  choice: कि वह ... उठाकर ले चले
  rationale: ἵνα के प्रयोजन तथा αἴρω के उठाने/ढोने के प्रसंगगत अर्थ को सुरक्षित रखता है।
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: यीशु का क्रूस
  rationale: संदर्भ में αὐτοῦ का आशय यीशु है। हिन्दी में 'उसका क्रूस' निकटतम पुरुष शमौन की ओर भ्रामक संकेत कर सकता है, इसलिए अभिप्रेत संदर्भ को स्पष्ट किया गया है।
theological_decisions:
- issue: αὐτοῦ का संदर्भ
  choice: '''यीशु का क्रूस'''
  alternative: '''उसका क्रूस'''
  rationale: यूनानी सर्वनाम का संदर्भ कथा में यीशु है, जबकि हिन्दी सर्वनाम शमौन से जुड़ा समझा जा सकता है। नाम स्पष्ट करना अर्थ को बदलता नहीं, केवल अनचाही व्याकरणिक अस्पष्टता हटाता है।
- issue: σταυρός का स्वरूप
  choice: क्रूस
  alternative: क्रूस की आड़ी बल्ली
  rationale: यूनानी शब्द यहाँ अधिक संकीर्ण ऐतिहासिक विवरण अनिवार्य नहीं करता; इसलिए पारंपरिक और अर्थसंगत व्यापक पद रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। 'बेगार में पकड़ लिया' सामान्य पाठक के लिए अधिकारपूर्वक जबरन सेवा में लगाने का भाव देता है; अनावश्यक सांप्रदायिक या ऐतिहासिक विशिष्टता नहीं जोड़ी गई।
