source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: hi
  text: यीशु राज्यपाल के सामने खड़ा हुआ। राज्यपाल ने उससे पूछा, “क्या तुम यहूदियों के राजा हो?” यीशु ने कहा, “तुम ऐसा कहते हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम ही ऐसा कहते हो,” अथवा “जैसा तुम कहते हो।” यूनानी में यीशु का उत्तर संक्षिप्त और कुछ हद तक संकेतात्मक है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστάθη
  choice: खड़ा था
  rationale: यहाँ क्रिया न्यायिक दृश्य में यीशु के राज्यपाल के सामने खड़े होने को व्यक्त करती है। हिंदी में “खड़ा था” स्वाभाविक है और न तो स्पष्ट न की गई कारकता जोड़ता है, न अनावश्यक रूप से क्षणिकता पर बल देता है।
- source_word: ἔμπροσθεν
  choice: के सामने
  rationale: यह स्थान और औपचारिक उपस्थिति दोनों को संक्षेप में तथा स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἡγεμών
  choice: राज्यपाल
  rationale: रोमी अधिकारी के लिए यह स्पष्ट और प्रचलित हिंदी पद है; “शासक” बहुत व्यापक और “प्रीफेक्ट” सामान्य पाठक के लिए अत्यधिक तकनीकी होगा।
- source_word: ἐπηρώτησεν
  choice: पूछा
  rationale: औपचारिक प्रसंग संदर्भ से स्पष्ट है। “पूछताछ की” यूनानी क्रिया की अपेक्षा अधिक कठोर भाव ला सकती है, जबकि “प्रश्न किया” आधुनिक साधारण हिंदी में कम स्वाभाविक है।
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: यहूदियों के राजा
  rationale: यह रोमी आरोप की राजनीतिक-जातीय भाषा को स्वाभाविक हिंदी में व्यक्त करता है। Ἰουδαῖοι का “यहूदिया के लोग” अर्थ कुछ संदर्भों में संभव है, पर यहाँ “यहूदी” अधिक उपयुक्त और व्यापक रूप से समझा जाता है।
- source_word: Σὺ λέγεις
  choice: यह तुम कहते हो
  rationale: यह संक्षिप्त और कुछ हद तक अपूर्ण यूनानी उत्तर की मापी हुई अप्रत्यक्षता को बनाए रखता है। “हाँ, ऐसा ही है” उत्तर को आवश्यकता से अधिक स्पष्ट कर देगा।
theological_decisions:
- issue: यीशु के उत्तर Σὺ λέγεις का आशय
  choice: “यह तुम कहते हो” के रूप में संयत और अप्रत्यक्ष उत्तर
  alternative: “हाँ, ऐसा ही है” या “जैसा तुम कहते हो” के रूप में स्पष्ट स्वीकृति
  rationale: यूनानी वाक्य न तो दावे का सीधा खंडन करता है, न राज्यपाल की राजनीतिक शब्दावली में उसे बिना किसी योग्यता के स्पष्ट रूप से स्वीकार करता है। अनुवाद इसी तनाव और संक्षिप्तता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण न्यायिक कथन। यूनानी के δέ को अलग से “अब” या “परंतु” नहीं जोड़ा गया, क्योंकि इस वाक्य में ऐसा करना हिंदी में अनावश्यक होगा। मुख्य पाठ में एकमात्र पादटिप्पणी-चिह्न [a] उसी स्थान पर रखा गया है जहाँ अस्पष्ट उत्तर आता है।
