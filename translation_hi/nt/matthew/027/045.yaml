  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और पाठयोग्य शैली। मूल की प्राचीन समय-गणना मुख्य पाठ में रखी गई है और उसका आधुनिक अनुमान पादटिप्पणी में दिया गया है।
