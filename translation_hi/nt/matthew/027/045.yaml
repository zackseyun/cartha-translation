  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: hi
  text: छठे घंटे से नौवें घंटे तक सारे देश में अंधकार छाया रहा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: छठा घंटा लगभग दोपहर बारह बजे और नौवाँ घंटा लगभग दोपहर तीन बजे था।
    reason: cultural_note
  - marker: b
    text: या, “सारी पृथ्वी पर।” यूनानी शब्द का अर्थ “देश” या “पृथ्वी,” दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: से
  rationale: ἀπό आरम्भ-बिन्दु बताता है। हिन्दी वाक्य में हल्के संयोजक δέ का अलग अनुवाद आवश्यक नहीं; प्रसंग-संबंध स्वाभाविक रूप से बना रहता है।
- source_word: ἕκτης ὥρας
  choice: छठे पहर
  rationale: मूल की समय-गणना को बनाए रखने वाला स्वाभाविक और गरिमापूर्ण हिन्दी पद; आधुनिक समय का अनुमान पादटिप्पणी में दिया गया है।
- source_word: σκότος
  choice: अन्धकार
  rationale: यह मूल शब्द के सामान्य, प्रत्यक्ष अर्थ को व्यक्त करता और घटना की गंभीरता बनाए रखता है।
- source_word: ἐγένετο
  choice: छाया रहा
  rationale: यहाँ γίνομαι अन्धकार की स्थिति के आरम्भ और निर्दिष्ट अवधि तक बने रहने को व्यक्त करता है; हिन्दी में ‘अन्धकार छाया रहा’ स्वाभाविक है।
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: सारे देश पर
  rationale: γῆ का अर्थ ‘देश/भूमि’ अथवा ‘पृथ्वी’ हो सकता है। प्रसंग में ‘देश’ संयत अर्थ है, जबकि व्यापक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: ἕως ὥρας ἐνάτης
  choice: नौवें पहर तक
  rationale: मूल समय-अभिव्यक्ति को मुख्य पाठ में रखा गया है; आधुनिक समय का अनुमान पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: अन्धकार के कथन में γῆ का भौगोलिक विस्तार
  choice: देश
  alternative: पृथ्वी
  rationale: यूनानी γῆ दोनों अर्थ दे सकता है। ‘देश’ तात्कालिक कथानक-परिवेश के अनुकूल संयत अनुवाद है; ‘पृथ्वी’ की सम्भावना को पादटिप्पणी में रखकर ब्रह्माण्डीय विस्तार की सम्भावित व्याख्या को दबाया नहीं गया है।
