  text: καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/060.yaml
  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: hi
  text: और उसे अपनी नई कब्र में रखा, जिसे उसने चट्टान में काटा था। फिर कब्र के द्वार पर एक बड़ा पत्थर लुढ़काकर वह चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθηκεν αὐτό
  choice: उसे … रखा
  rationale: τίθημι यहाँ यीशु के शरीर को कब्र में रखने की साधारण क्रिया बताता है। हिन्दी में ‘रखा’ स्वाभाविक है; संदर्भ से ‘उसे’ का आशय शरीर से स्पष्ट है।
- source_word: ἐν τῷ καινῷ αὐτοῦ μνημείῳ
  choice: अपनी नई कब्र में
  rationale: μνημεῖον इस प्रसंग में चट्टान काटकर बनाई गई दफन-कब्र है। καινός का सीधा अर्थ ‘नई’ है; ‘कभी इस्तेमाल न की गई’ जैसी निहित बात पाठ में जोड़ना उचित नहीं। αὐτοῦ को स्वाभाविक हिन्दी में ‘अपनी’ से व्यक्त किया गया है।
- source_word: ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ
  choice: जिसे उसने चट्टान में खुदवाया था
  rationale: λατομέω चट्टान काटकर स्थान बनाने को दर्शाता है। ‘खुदवाया था’ हिन्दी में ऐसी कब्र तैयार कराने के भाव को स्वाभाविक रूप से व्यक्त करता है और मुख्य घटना से पहले की तैयारी भी स्पष्ट करता है; यूनानी कर्तृवाच्य प्रत्यक्षतः उसके उत्तरदायित्व को बताता है, अनिवार्यतः उसके अपने हाथों से काटने को नहीं।
- source_word: προσκυλίσας λίθον μέγαν
  choice: एक बड़ा पत्थर लुढ़काकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई कार्रवाई बताता है। ‘लुढ़काकर’ पत्थर को घुमाते हुए स्थान पर लगाने का अर्थ स्पष्ट रखता है।
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: कब्र के द्वार पर
  rationale: θύρα का अर्थ द्वार या प्रवेश-स्थान हो सकता है। ‘द्वार’ हिन्दी में चट्टानी कब्र के मुख/प्रवेश को भी स्वाभाविक रूप से व्यक्त करता है और मूल की रूपकात्मक/स्थानवाचक भाषा बनाए रखता है।
- source_word: ἀπῆλθεν
  choice: वह चला गया
  rationale: ἀπέρχομαι यहाँ साधारण प्रस्थान बताता है। ‘चला गया’ सहज आधुनिक हिन्दी कथन है।
