translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘कब्र’ सामान्य पाठक के लिए स्वाभाविक है और चट्टान में काटी हुई दफन-स्थली के संदर्भ से उसका स्वरूप स्पष्ट होता है। वाक्य-विन्यास यूनानी घटनाक्रम को बनाए रखते हुए हिन्दी में प्रवाहपूर्ण किया गया है।
