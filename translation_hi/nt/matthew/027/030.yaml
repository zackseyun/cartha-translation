    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: उस पर थूकने के बाद
  rationale: अओरिस्ट कृदंत मुख्य क्रियाओं से पहले हुई कार्रवाई बताता है; यह वाक्यांश उस क्रम को स्वाभाविक आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: ἔλαβον
  choice: उन्होंने ... लिया
  rationale: λαμβάνω के सामान्य अर्थ को प्रसंगानुकूल सीधे ढंग से व्यक्त करता है।
- source_word: τὸν κάλαμον
  choice: वह सरकंडा
  rationale: κάλαμος का मूल अर्थ ‘सरकंडा’ है। निश्चित उपपद उस वस्तु की ओर संकेत करता है जिसका उल्लेख पिछले पद में हुआ है; यह चयन कथात्मक संबंध और राजकीय उपहास की विडंबना बनाए रखता है।
- source_word: ἔτυπτον
  choice: लगातार मारते रहे
  rationale: इम्परफेक्ट क्रिया भूतकाल में जारी या बार-बार की गई कार्रवाई व्यक्त कर सकती है; ‘लगातार ... रहे’ इस पहलू को सहज हिन्दी में दर्शाता है।
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: उसके सिर पर
  rationale: τύπτω के साथ यह पदबंध प्रहार का लक्ष्य बताता है; हिन्दी में ‘सिर पर’ इसका स्वाभाविक और ठोस रूप है।
theological_decisions:
- issue: यीशु के साथ सैनिकों के अपमानजनक और हिंसक व्यवहार का चित्रण
  choice: कार्रवाइयों को बिना नरम किए सीधे और ठोस रूप में प्रस्तुत करना
  alternative: 'अधिक औपचारिक रूप: ‘और उस पर थूककर उन्होंने वह सरकंडा लिया और उसके सिर पर मार रहे थे’'
  rationale: यह कथात्मक विवरण है। अनुवाद अतिरिक्त व्याख्या जोड़े बिना अपमान और जारी अथवा बार-बार किए गए प्रहार को स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘सरकंडा’ पिछले पद की वस्तु से संबंध बनाए रखता है, और ‘लगातार मारते रहे’ यूनानी क्रिया के अपूर्ण पक्ष को स्वाभाविक रूप से व्यक्त करता है।
