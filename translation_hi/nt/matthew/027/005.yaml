translation:
  language: hi
  text: वह चाँदी के सिक्के मंदिर[a] में फेंककर चला गया, और जाकर उसने फाँसी लगा ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मंदिर के पवित्रस्थान में’; यहाँ प्रयुक्त यूनानी शब्द प्रायः पूरे मंदिर-परिसर के बजाय उसके पवित्रस्थान को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίψας
  choice: फेंककर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई क्रिया बताता है। ‘फेंककर’ हिन्दी में क्रियाक्रम को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: τὰ ἀργύρια
  choice: चाँदी के सिक्के
  rationale: शाब्दिक अर्थ ‘चाँदी’ है, पर सन्दर्भ में यह लौटाई गई रकम के चाँदी के सिक्कों को दर्शाता है। हिन्दी में केवल ‘चाँदी’ कहने की अपेक्षा यह अधिक स्पष्ट और स्वाभाविक है।
- source_word: εἰς τὸν ναόν
  choice: मन्दिर में
  rationale: मुख्य पाठ में प्रचलित और सरल पद रखा गया है; ναός के अधिक विशिष्ट अर्थ, अर्थात मन्दिर के पवित्रस्थान, को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: ἀνεχώρησεν
  choice: वहाँ से चला गया
  rationale: क्रिया का अर्थ चले जाना या हट जाना है। ‘वहाँ से चला गया’ हिन्दी कथन में स्थान से प्रस्थान को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: ἀπελθὼν
  choice: जाकर
  rationale: यह ἀνεχώρησεν से अलग गति-सूचक कृदन्त है। ‘और जाकर’ हिन्दी में उसकी अलग भूमिका बनाए रखता है, पर अनावश्यक पुनरुक्ति नहीं पैदा करता।
- source_word: ἀπήγξατο
  choice: उसने फाँसी लगा ली
  rationale: मध्यवाच्य रूप स्वयं पर की गई क्रिया को दर्शाता है; इस सन्दर्भ में आत्महत्या के लिए ‘फाँसी लगा ली’ स्पष्ट और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ναός का विशिष्ट अर्थ बनाम व्यापक मन्दिर-परिसर
  choice: मुख्य पाठ में ‘मन्दिर’, और पाद-टिप्पणी में ‘पवित्रस्थान’ का विशिष्ट भाव
  alternative: मुख्य पाठ में ‘मन्दिर का पवित्रस्थान’
  rationale: ναός प्रायः समूचे मन्दिर-परिसर के बजाय भीतर के पवित्रस्थान को दर्शाता है। मुख्य पाठ सामान्य पाठक के लिए सहज रखा गया है, जबकि स्थापत्यगत सटीकता पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गम्भीर कथात्मक स्तर रखा गया है। ‘मन्दिर’ और ‘फाँसी लगा ली’ सामान्य पाठक के लिए स्पष्ट हैं; दो अलग प्रस्थान-सूचक यूनानी रूपों को ‘चला गया, और जाकर’ द्वारा बिना भद्दी पुनरुक्ति के व्यक्त किया गया है।
