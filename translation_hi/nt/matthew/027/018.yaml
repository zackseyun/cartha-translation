lexical_decisions:
- source_word: ᾔδει
  choice: वह जानता था
  rationale: οἶδα का सामान्य अर्थ जानना या अवगत होना है; यहाँ यह पिलातुस की समझ को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ὅτι
  choice: कि
  rationale: यहाँ ὅτι उस बात की विषय-वस्तु प्रस्तुत करता है जिसे पिलातुस जानता था।
- source_word: διὰ φθόνον
  choice: ईर्ष्या के कारण
  rationale: διά के साथ कर्मकारक कारण व्यक्त करता है, और φθόνος किसी दूसरे की प्रतिष्ठा या सफलता के प्रति ईर्ष्यापूर्ण दुर्भाव को दर्शाता है।
- source_word: παρέδωκαν
  choice: उसके हवाले किया था
  rationale: παραδίδωμι यहाँ किसी व्यक्ति को अधिकारी के अधिकार में सौंपने का अर्थ रखता है। ‘हवाले किया था’ हिन्दी में पूर्ववर्ती घटना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτόν
  choice: यीशु को
  rationale: सर्वनाम का संकेत यीशु की ओर है; हिन्दी में अस्पष्टता से बचने के लिए नाम दोहराना स्वाभाविक है।
theological_decisions:
- issue: यीशु को सौंपने वालों की प्रेरणा
  choice: पिलातुस जानता था कि उनकी प्रेरणा ईर्ष्या थी।
  alternative: ‘ईर्ष्या’ के स्थान पर ‘जलन’ कहना।
  rationale: φθόνος नैतिक और मनोवैज्ञानिक प्रेरणा के रूप में ईर्ष्या को व्यक्त करता है; पाठ इससे आगे कोई विस्तृत धार्मिक व्याख्या नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘उसके हवाले’ से प्रसंगानुसार पिलातुस को सौंपना व्यक्त होता है।
