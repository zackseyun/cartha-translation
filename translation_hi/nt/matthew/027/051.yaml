  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ⸂ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο⸃, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: hi
  text: और देखो, मंदिर का परदा[a] ऊपर से नीचे तक फटकर दो टुकड़े हो गया; धरती काँप उठी और चट्टानें फट गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्रस्थान का परदा।” यूनानी शब्द मंदिर के भीतरी परदे को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह स्वाभाविक आधुनिक हिन्दी में अचानक ध्यान खींचने और घटना की नाटकीयता उभारने वाले संकेत को बनाए रखता है।
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: मंदिर का परदा
  rationale: καταπέτασμα लटके हुए परदे को और ναός यहाँ मंदिर के पवित्रस्थान को सूचित करता है; मुख्य पाठ में सहज और प्रचलित अभिव्यक्ति रखी गई है, जबकि अधिक विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐσχίσθη ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο
  choice: ऊपर से नीचे तक फटकर दो टुकड़े हो गया
  rationale: यह निष्क्रिय घटना का भाव बिना किसी कर्ता का नाम जोड़े व्यक्त करता है और फटने की दिशा तथा उसके दो भाग होने—दोनों को स्पष्ट रखता है।
- source_word: ἡ γῆ ἐσείσθη
  choice: धरती काँप उठी
  rationale: γῆ का व्यापक अर्थ 'धरती' यहाँ उपयुक्त है; 'काँप उठी' भूकंपीय घटना को स्वाभाविक और सजीव हिन्दी में व्यक्त करता है।
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: चट्टानें फट गईं
  rationale: πέτραι के लिए 'चट्टानें' बड़े शैलखंडों का उपयुक्त बोध देता है, और σχίζω को पदार्थ के अनुरूप 'फट गईं' कहा गया है।
theological_decisions:
- issue: मंदिर के परदे के फटने का धार्मिक अर्थ
  choice: घटना को सीधे वर्णित किया गया है, पर उसका धार्मिक अर्थ मुख्य पाठ में नहीं जोड़ा गया।
  alternative: इसे परमेश्वर तक पहुँच खुलने या मंदिर-व्यवस्था पर न्याय के स्पष्ट प्रतीक के रूप में समझाना।
  rationale: पद घटना और उसके साथ के चिन्ह बताता है, किंतु स्वयं उनका अर्थ नहीं समझाता; इसलिए अंतर्निहित धार्मिक तनाव और व्याख्यात्मक खुलापन सुरक्षित रखा गया है।
- issue: परदा फाड़ने वाले कर्ता की पहचान
  choice: कर्ता को अनकहा रखा गया है।
  alternative: स्पष्ट रूप से कहना कि परमेश्वर ने परदा फाड़ा।
  rationale: यूनानी पाठ में क्रिया कर्मवाच्य है और कर्ता का नाम नहीं है; अनुवाद में उसे जोड़ना मूल पाठ से आगे जाना होता।
translation_notes:
  register: आधुनिक, सुबोध और गरिमापूर्ण हिन्दी अपनाई गई है। आरम्भिक 'और देखो' ने यूनानी καὶ ἰδοὺ का ध्यानाकर्षक तथा नाटकीय बल बनाए रखा है; वाक्य की घटनात्मक गति को अर्धविराम और समन्वित उपवाक्यों से व्यक्त किया गया है।
