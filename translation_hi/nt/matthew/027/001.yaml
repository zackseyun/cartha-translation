source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: hi
  text: जब भोर हुई[a], तब सभी प्रधान याजकों और जनता के बुज़ुर्गों ने यीशु के विरुद्ध परामर्श किया[b], ताकि उसे मार डालें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सवेरा होते ही’।
    reason: lexical_alternative
  - marker: b
    text: या ‘विचार-विमर्श किया’।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: जब भोर हुई
  rationale: यह संबंधवाचक कृदन्तीय रचना समय के परिवर्तन को दिखाती है। ‘जब भोर हुई’ आधुनिक हिन्दी में स्वाभाविक है और δέ को अलग शब्द से अनावश्यक रूप से व्यक्त किए बिना प्रसंग का संक्रमण बनाए रखती है।
- source_word: συμβούλιον ἔλαβον
  choice: परामर्श किया
  rationale: यूनानी मुहावरा सामूहिक विचार-विमर्श या सलाह करने का बोध देता है। ‘परामर्श किया’ औपचारिक न्यायिक परिवेश के अनुकूल है और ‘षड्यंत्र रचा’ जैसी अधिक व्याख्यात्मक तीव्रता नहीं जोड़ता।
- source_word: πάντες
  choice: सभी
  rationale: यह नेतृत्व-समूह की व्यापक सहभागिता पर दिए गए मूल बल को स्पष्ट रूप से बनाए रखता है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: सुसमाचारों में यरूशलेम के उच्च याजकीय नेतृत्व-वर्ग के लिए यह प्रचलित और स्पष्ट हिन्दी पद है; ‘महायाजक’ का बहुवचन एक ही पद के अनेक समकालीन धारकों का भ्रामक संकेत दे सकता है।
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: लोगों के पुरनिये
  rationale: यह समुदाय के मान्य वरिष्ठ अगुओं का औपचारिक पदनाम है। ‘लोगों के पुरनिये’ मूल संबंधसूचक रचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: यीशु के विरुद्ध
  rationale: इस शत्रुतापूर्ण प्रसंग में κατά संबंध मात्र नहीं, विरोध व्यक्त करता है; इसलिए ‘के विषय में’ की अपेक्षा ‘के विरुद्ध’ उपयुक्त है।
- source_word: ὥστε
  choice: ताकि
  rationale: अनन्त क्रिया के साथ यह इच्छित परिणाम या उद्देश्य प्रकट करता है। ‘ताकि’ हिन्दी में इस उद्देश्यपरक अर्थ को सहजता से व्यक्त करता है, जबकि परिणाम और उद्देश्य के बीच मूल की निकटता को पूरी तरह कठोर नहीं बनाता।
- source_word: θανατῶσαι αὐτόν
  choice: उसे मार डालें
  rationale: यह मूल के ‘मृत्यु के घाट उतारना/मृत्यु देना’ अर्थ को सीधा और स्पष्ट रखता है। ‘मृत्युदंड दिलाएँ’ उस कानूनी प्रक्रिया को अधिक स्पष्ट कर देता जिसे इस वाक्यांश ने स्वयं निर्दिष्ट नहीं किया है।
theological_decisions:
- issue: यीशु के प्रति अगुओं की कार्रवाई का स्वरूप
  choice: वाक्य को यीशु के विरुद्ध सामूहिक परामर्श और उसे मार डालने के उद्देश्य के रूप में व्यक्त किया गया है।
  alternative: इसे हल्के रूप में ‘यीशु के विषय में विचार किया’ या अधिक तीखे रूप में ‘यीशु के विरुद्ध षड्यंत्र रचा’ कहा जा सकता था।
  rationale: κατά स्पष्ट विरोध और θανατῶσαι स्पष्ट घातक उद्देश्य बताता है, पर συμβούλιον ἔλαβον अपने आप में ‘षड्यंत्र’ शब्द की पूरी अतिरिक्त छाया अनिवार्य नहीं करता। अनुवाद विरोध और मृत्यु के उद्देश्य को बनाए रखते हुए अनावश्यक व्याख्यात्मक विस्तार से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘परामर्श किया’ औपचारिक प्रसंग के अनुकूल है; ‘मार डालें’ मूल के स्पष्ट घातक आशय को बिना कानूनी प्रक्रिया बढ़ाए व्यक्त करता है।
