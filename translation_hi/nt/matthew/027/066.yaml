  text: οἱ δὲ πορευθέντες ἠσφαλίσαντο τὸν τάφον σφραγίσαντες τὸν λίθον μετὰ τῆς κουστωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/066.yaml
  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: hi
  text: तब वे गए और पहरेदार दल के साथ पत्थर पर मुहर लगाकर कब्र को सुरक्षित किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पहरेदारों की मौजूदगी में पत्थर पर मुहर लगाकर’; संभवतः, ‘पत्थर पर मुहर लगाकर और पहरा बैठाकर।’ यूनानी वाक्यांश संक्षिप्त है और पहरेदार दल के साथ होने को बता सकता है, बिना इसे स्पष्ट रूप से एक अलग कार्य बताए।
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: तब उन्होंने जाकर
  rationale: δέ यहाँ कथा को आगे बढ़ाता है, और πορευθέντες मुख्य क्रिया के साथ जुड़ी हुई पूर्ववर्ती क्रिया है। यह हिन्दी में स्वाभाविक कथात्मक क्रम व्यक्त करता है, बिना किसी प्रबल विरोध का भाव जोड़े।
- source_word: ἠσφαλίσαντο
  choice: सुरक्षित कर दिया
  rationale: ἀσφαλίζω का अर्थ किसी वस्तु को सुरक्षित या अभेद्य बनाना है। यहाँ आशय कब्र से छेड़छाड़ रोकने के उपाय करने से है।
- source_word: τὸν τάφον
  choice: कब्र
  rationale: τάφος यीशु के दफनाए जाने के स्थान को दर्शाता है। आधुनिक सामान्य हिन्दी में ‘कब्र’ स्पष्ट और सहज है।
- source_word: σφραγίσαντες
  choice: मुहर लगाकर
  rationale: यह कृदन्त मुख्य क्रिया से जुड़े साधन या सहगामी कार्य को व्यक्त करता है। ‘मुहर लगाकर’ हिन्दी में दोनों संबंधों को स्वाभाविक रूप से सामने रखता है।
- source_word: τὸν λίθον
  choice: पत्थर
  rationale: मूल पाठ केवल उस पत्थर का उल्लेख करता है; ‘द्वार का पत्थर’ जैसी व्याख्यात्मक जानकारी जोड़ना आवश्यक नहीं है।
- source_word: μετὰ τῆς κουστωδίας
  choice: पहरेदार दल के साथ
  rationale: κουστωδία एक पहरेदार दल या चौकसी-दल को दर्शाने वाला लैटिन से लिया गया शब्द है। μετά के साथ संबंध सहभागिता या साथ होने का है; यह अनुवाद जानबूझकर यह तय नहीं करता कि दल केवल उपस्थित था या उसी समय नियुक्त किया गया।
theological_decisions:
- issue: कब्र सुरक्षित करने में μετὰ τῆς κουστωδίας का संबंध
  choice: पत्थर पर मुहर लगाने के साथ पहरेदार दल की सहभागिता या उपस्थिति को संक्षिप्त और कुछ हद तक अस्पष्ट रखना
  alternative: ‘पत्थर पर मुहर लगाई और पहरा बैठा दिया’ या ‘पहरेदारों की उपस्थिति में पत्थर पर मुहर लगाई’
  rationale: यूनानी वाक्यांश संक्षिप्त है और किसी अलग क्रिया द्वारा पहरा नियुक्त करने को स्पष्ट रूप से नहीं कहता। चुना गया रूप मूल की अस्पष्टता को बनाए रखता है और प्रक्रिया का अनावश्यक विस्तार नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सामान्य और गरिमापूर्ण हिन्दी की है। ‘पहरेदार दल’ सामूहिक κουστωδία को व्यक्त करता है और दल की रोमी या मन्दिर-संबंधी पहचान निर्धारित नहीं करता। डैश मुख्य कार्य और उसे पूरा करने के उपाय के बीच संबंध को स्पष्ट करता है, जबकि मूल की संक्षिप्तता बनाए रखता है।
