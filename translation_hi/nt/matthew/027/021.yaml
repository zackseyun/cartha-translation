  text: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς· Τίνα θέλετε ἀπὸ τῶν δύο ἀπολύσω ὑμῖν; οἱ δὲ εἶπαν· ⸀Τὸν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: hi
  text: पर राज्यपाल ने उन्हें उत्तर दिया, “इन दोनों में से तुम किसे चाहते हो कि मैं तुम्हारे लिए रिहा करूँ?” उन्होंने कहा, “बरअब्बा को।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτοῖς
  choice: पर ... ने उन्हें उत्तर दिया
  rationale: यूनानी कृदन्त और मुख्य क्रिया का संयुक्त प्रयोग उत्तर देने का भाव व्यक्त करता है। हिन्दी में ‘उत्तर दिया’ स्वाभाविक है और अनावश्यक ‘उत्तर देकर कहा’ से बचाता है; δέ को हल्के कथात्मक मोड़ के लिए ‘पर’ किया गया है।
- source_word: ὁ ἡγεμὼν
  choice: राज्यपाल
  rationale: इस प्रसंग में यह शब्द रोमी प्रांतीय गवर्नर पिलातुस के पद को सूचित करता है; आधुनिक मानक हिन्दी में ‘राज्यपाल’ स्पष्ट और प्रतिष्ठित पदनाम है।
- source_word: Τίνα ... ἀπὸ τῶν δύο
  choice: इन दोनों में से ... किसे
  rationale: प्रश्न दो निश्चित व्यक्तियों में से चुनाव के विषय में है; यह हिन्दी में स्वाभाविक रूप से चयन और व्यक्तिवाचक कर्म दोनों को व्यक्त करता है।
- source_word: θέλετε
  choice: तुम ... चाहते हो
  rationale: यहाँ क्रिया इच्छा या पसंद व्यक्त करती है। भीड़ को संबोधित बहुवचन के लिए ‘तुम’ आधुनिक, सीधा और प्रसंगानुकूल है।
- source_word: ἀπολύσω ὑμῖν
  choice: मैं तुम्हारे लिए रिहा करूँ
  rationale: कानूनी प्रसंग में ἀπολύω का अर्थ बंदी को छोड़ना है, इसलिए ‘रिहा करूँ’ चुना गया। ‘तुम्हारे लिए’ हितसूचक ὑμῖν को सुरक्षित रखता है।
- source_word: οἱ δὲ εἶπαν
  choice: उन्होंने कहा
  rationale: उत्तर देनेवाली भीड़ का कथन सरल कथात्मक हिन्दी में दिया गया है; यहाँ δέ को अलग संयोजक से व्यक्त करना आवश्यक नहीं, क्योंकि वाक्यक्रम ही प्रत्युत्तर स्पष्ट करता है।
- source_word: Τὸν Βαραββᾶν
  choice: बरअब्बा को
  rationale: नाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण में रखा गया है और यूनानी कर्मकारक को हिन्दी के ‘को’ से व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सहज भाषा। प्रश्न की संरचना मूल यूनानी के चयनात्मक भाव को बनाए रखती है।
