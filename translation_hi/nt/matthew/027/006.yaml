source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: hi
  text: पर मुख्य याजकों ने चाँदी के वे सिक्के लेकर कहा, “इन्हें मन्दिर के कोष[a] में डालना अनुमत नहीं है, क्योंकि यह खून की कीमत[b] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में κορβανᾶν (कोरबान), अर्थात मन्दिर का पवित्र कोष या निधि।
    reason: lexical_alternative
  - marker: b
    text: या “खून का पैसा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: बहुवचन में यह वरिष्ठ याजकीय अधिकारियों को सूचित करता है; ‘प्रधान याजक’ सुसमाचारों के सन्दर्भ में स्वाभाविक और प्रचलित हिन्दी पद है।
- source_word: λαβόντες
  choice: लेकर
  rationale: पूर्वकालिक कृदन्त को सहज हिन्दी में सहायक क्रिया से जोड़कर व्यक्त किया गया है; इससे सिक्के लेने और फिर कहने का क्रम बना रहता है।
- source_word: τὰ ἀργύρια
  choice: चाँदी के वे सिक्के
  rationale: सन्दर्भ में पहले उल्लिखित चाँदी की भुगतान-राशि की ओर संकेत है। ‘सिक्के’ ठोस मौद्रिक अर्थ देता है, पर किसी विशेष सिक्का-प्रकार का दावा नहीं करता।
- source_word: Οὐκ ἔξεστιν
  choice: उचित नहीं है
  rationale: यह याजकों की धार्मिक-विधिक दृष्टि में अनुमेय न होने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; केवल व्यक्तिगत अरुचि का भाव नहीं देता।
- source_word: βαλεῖν
  choice: डालना
  rationale: कोष में धन रखने के सन्दर्भ में βάλλω का सहज हिन्दी अर्थ ‘डालना’ है; ‘फेंकना’ यहाँ अनावश्यक रूप से चित्रात्मक होगा।
- source_word: κορβανᾶν
  choice: मन्दिर के कोष
  rationale: यह मन्दिर से सम्बद्ध पवित्र कोष अथवा निधि को दर्शाता है। अर्थानुवाद सामान्य पाठक के लिए स्पष्ट है और मूल पद को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐπεὶ
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τιμὴ αἵματός
  choice: खून की कीमत
  rationale: यह यूनानी पदबंध की मूर्त और तीखी अभिव्यक्ति को बनाए रखता है। अधिक मुहावरेदार ‘खून का पैसा’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: κορβανᾶν का ऐसा अनुवाद जो उसके मन्दिर-संबंधी अर्थ को स्पष्ट करे और मूल सांस्कृतिक पद को भी सुरक्षित रखे
  choice: मन्दिर के कोष
  alternative: कुरबान / पवित्र भण्डार
  rationale: यहाँ बात मन्दिर की निधि और उसमें रक्त से जुड़ी राशि रखने की धार्मिक-विधिक उपयुक्तता की है। अर्थानुवाद आशय स्पष्ट करता है, जबकि पादटिप्पणी मूल अरामी-यूनानी पद की जानकारी देती है।
- issue: τιμὴ αἵματός की संक्षिप्त किन्तु अर्थगर्भित अभिव्यक्ति
  choice: खून की कीमत
  alternative: खून का पैसा
  rationale: ‘खून की कीमत’ मूल की संरचना और उस नैतिक तनाव को बनाए रखती है कि यह धन रक्त से जुड़ी कीमत है; अधिक मुहावरेदार विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘मन्दिर के कोष’ धार्मिक परिवेश स्पष्ट करता है; ‘खून की कीमत’ मूल की संक्षिप्तता और नैतिक तीव्रता बनाए रखता है।
