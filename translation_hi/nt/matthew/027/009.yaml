theological_decisions:
- issue: वचन का श्रेय यिर्मयाह को है, जबकि शब्दावली जकर्याह 11:12–13 से अधिक मिलती है
  choice: मुख्य पाठ में 'यिर्मयाह भविष्यद्वक्ता' यथावत रखा गया
  alternative: नाम को जकर्याह करना, या किसी संयुक्त भविष्यसूचक उद्धरण के रूप में स्पष्ट करना
  rationale: प्रदत्त यूनानी पाठ स्पष्ट रूप से यिर्मयाह कहता है; अनुवाद में इस ऐतिहासिक-पाठालोचनात्मक तनाव का सामंजस्य नहीं किया गया।
- issue: ἀπὸ υἱῶν Ἰσραήλ का कर्तृवाचक अथवा अंशवाचक संबंध
  choice: इस्राएल के पुत्रों में से कुछ ने
  alternative: इस्राएल के पुत्रों से
  rationale: अंशवाचक अर्थ वाक्य को हिन्दी में बोधगम्य बनाता है, पर यूनानी की कठिनता और अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। उद्धरण की अपूर्ण, अगले पद में जारी रहने वाली संरचना को अंत के दीर्घ विराम से बनाए रखा गया है।
