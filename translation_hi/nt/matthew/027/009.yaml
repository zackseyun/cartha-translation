  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: hi
  text: 'तब जो वचन यिर्मयाह भविष्यद्वक्ता के द्वारा कहा गया था, वह पूरा हुआ[a]: “और उन्होंने चाँदी के वे तीस सिक्के लिए—उस व्यक्ति का मूल्य, जिसका मूल्य इस्राएल के पुत्रों में से कुछ ने ठहराया था[b]—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मत्ती इस भविष्यसूचक वचन का श्रेय यिर्मयाह को देते हैं। इसकी शब्दावली जकर्याह 11:12–13 से सबसे अधिक मिलती है। इसकी अलग-अलग व्याख्याएँ की गई हैं: यह संयुक्त उद्धरण हो सकता है, यिर्मयाह के नाम से आरम्भ होने वाले भविष्यवक्ताओं के किसी संग्रह का उल्लेख हो सकता है, या पाठ के संचरण में कोई समस्या हो सकती है।'
    reason: textual_variant
  - marker: b
    text: या, “जिसका मूल्य उन्होंने इस्राएल के पुत्रों से ठहराया था।” यूनानी पदबंध कठिन है; “इस्राएल के पुत्रों में से कुछ” उसका संभावित अंशवाचक अर्थ दर्शाता है।
    reason: lexical_alternative
