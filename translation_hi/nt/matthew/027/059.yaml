- source_word: ἐνετύλιξεν
  choice: लपेटा
  rationale: ἐντυλίσσω का अर्थ लपेटना या आवृत करना है; यहाँ ‘लपेटा’ स्पष्ट और सहज है।
- source_word: αὐτὸ
  choice: उसे
  rationale: यूनानी सर्वनाम नपुंसकलिंग है और व्याकरणतः σῶμα की ओर संकेत करता है। हिन्दी में ‘शव’ के लिए ‘उसे’ स्वाभाविक है और व्यक्ति/वस्तु का कृत्रिम भेद नहीं थोपता।
- source_word: σινδόνι
  choice: मलमल के कपड़े
  rationale: σινδών सन से बने महीन कपड़े को, और दफ़न के प्रसंग में कफ़न जैसे कपड़े को, सूचित कर सकता है। ‘मलमल का कपड़ा’ सामान्य पाठक के लिए सहज है; अधिक विशिष्ट ‘कफ़न’ को मुख्य पाठ में नहीं थोपा गया।
- source_word: καθαρᾷ
  choice: साफ़
  rationale: इस प्रसंग में καθαρός का स्वाभाविक अर्थ ‘साफ़’ है; ‘शुद्ध’ अनावश्यक रूप से धार्मिक या अनुष्ठानिक भाव दे सकता है।
- source_word: καὶ ... ὁ Ἰωσὴφ
  choice: और यूसुफ़
  rationale: καί के सामान्य कथात्मक संयोजन को ‘और’ से व्यक्त किया गया है।
