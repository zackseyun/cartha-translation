  choice: लेकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले की क्रिया बताता है; हिन्दी कथन में ‘शव लेकर ... लपेटा’ स्वाभाविक और स्रोत के क्रम के निकट है।
- source_word: σῶμα
