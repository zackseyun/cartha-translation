source:
  edition: SBLGNT
  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: hi
  text: पर प्रधान याजकों और बुज़ुर्गों ने जनसमूहों को राज़ी किया कि वे बरअब्बा को माँगें, पर यीशु को मार डालें[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु को नष्ट कर दें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले घटनाक्रम से विरोध प्रकट करता है; आधुनिक हिन्दी में ‘पर’ स्वाभाविक और स्पष्ट है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: यह यरूशलेम के पुरोहित नेतृत्व के सदस्यों के लिए प्रचलित और ऐतिहासिक रूप से उपयुक्त पद है।
- source_word: πρεσβύτεροι
  choice: पुरनिये
  rationale: यह उम्र मात्र नहीं, बल्कि यहूदी समाज के मान्य नेतृत्व-पद को व्यक्त करता है।
- source_word: ἔπεισαν
  choice: समझा-बुझाकर राज़ी कर लिया
  rationale: यह भीड़ों पर सफल प्रभाव डालने के पूर्ण कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὄχλους
  choice: भीड़ें
  rationale: यूनानी बहुवचन को बनाए रखते हुए एकत्र जनसमूहों का बोध कराता है।
- source_word: ἵνα
  choice: कि
  rationale: मनाने के बाद आने वाली इच्छित कार्रवाई अथवा कथ्य को हिन्दी में सहज अधीन उपवाक्य द्वारा व्यक्त करता है।
- source_word: αἰτήσωνται
  choice: माँगें
  rationale: संदर्भ में इसका अर्थ अपने लिए बरअब्बा को सौंपे जाने की माँग करना है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: Βαραββᾶν
  choice: बरअब्बा
  rationale: व्यक्तिनाम का मानक हिन्दी लिप्यंतरण।
- source_word: ἀπολέσωσιν
  choice: नाश कर दें
  rationale: यह ‘नष्ट करना’ या ‘मरवा देना’ की व्यापक यूनानी अर्थ-शक्ति को बनाए रखता है, जबकि न्यायिक मृत्यु का स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: τὸν δὲ Ἰησοῦν
  choice: पर यीशु
  rationale: दोहराया गया δέ बरअब्बा को माँगने और यीशु का नाश करने के बीच तीखा विरोध स्थापित करता है।
theological_decisions:
- issue: न्यायिक मृत्युदंड के संदर्भ में ἀπολέσωσιν का अनुवाद
  choice: यीशु का नाश कर दें
  alternative: यीशु को मरवा दें
  rationale: यूनानी क्रिया किसी तकनीकी न्यायिक पद तक सीमित नहीं, बल्कि ‘नष्ट करना’ या ‘नाश करना’ का व्यापक अर्थ रखती है। मुख्य पाठ इस अर्थ-व्याप्ति को बनाए रखता है और संदर्भगत मृत्युदंड का अर्थ पादटिप्पणी में स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रधान याजक’ और ‘पुरनिये’ ऐतिहासिक-संस्थागत अर्थ बनाए रखते हैं; ‘समझा-बुझाकर राज़ी कर लिया’ प्रभाव डालने की सफल कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
