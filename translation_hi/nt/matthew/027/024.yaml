source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: hi
  text: जब पिलातुस ने देखा कि उसकी कोशिश का कोई लाभ नहीं हो रहा था, बल्कि हंगामा बढ़ रहा था, तो उसने पानी लेकर भीड़ के सामने अपने हाथ धोए और कहा, “मैं इस खून का दोषी नहीं हूँ।[a] तुम ही देख लेना।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं इस खून से निर्दोष हूँ।” इसका अर्थ है कि पिलातुस उस व्यक्ति की मृत्यु की जिम्मेदारी से अपने को अलग बता रहा था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तुम देखोगे।” अथवा, “तुम ही इसकी जिम्मेदारी लो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πιλᾶτος
  choice: जब पिलातुस ने देखा
  rationale: δέ यहाँ कथा को अगले चरण में ले जाता है; हिन्दी में ‘जब’ स्वाभाविक रूप से परिस्थितिजन्य संबंध व्यक्त करता है, जबकि अलग से ‘परन्तु’ जोड़ना आवश्यक नहीं है।
- source_word: οὐδὲν ὠφελεῖ
  choice: उसकी कोशिश का कोई लाभ नहीं हो रहा
  rationale: यूनानी अभिव्यक्ति शाब्दिक रूप से ‘कुछ भी लाभ नहीं होता’ है। प्रसंग में पिलातुस की स्थिति सँभालने की कोशिश निहित है; यह हिन्दी रूप उसी आशय को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: बल्कि उपद्रव बढ़ता जा रहा है
  rationale: θόρυβος सार्वजनिक हलचल, हंगामे या दंगे की ओर बढ़ते उपद्रव को सूचित कर सकता है। γίνεται की प्रक्रियात्मकता को ‘बढ़ता जा रहा है’ से व्यक्त किया गया है।
- source_word: λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας
  choice: उसने पानी लेकर ... अपने हाथ धोए
  rationale: पूर्ववर्ती सहभागी क्रिया और मुख्य क्रिया को स्वाभाविक हिन्दी क्रम में रखा गया है; ‘अपने’ मध्यम वाच्य के भाव के अनुरूप है।
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: भीड़ के सामने
  rationale: यह कार्य भीड़ की उपस्थिति में सार्वजनिक रूप से किया गया; ‘सामने’ स्थान और दृश्यता दोनों को सहज रूप से व्यक्त करता है।
- source_word: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου
  choice: मैं इस खून का दोषी नहीं हूँ
  rationale: ‘इस खून से निर्दोष’ का शाब्दिक ढाँचा हिन्दी में अस्वाभाविक है। ‘खून का दोषी नहीं’ मृत्यु के उत्तरदायित्व से इनकार करने वाला मुहावरेदार अर्थ सुरक्षित रखता है, बिना पिलातुस के दावे को सत्य ठहराए।
- source_word: ὑμεῖς ὄψεσθε
  choice: तुम स्वयं जानो
  rationale: शाब्दिक अर्थ ‘तुम देखोगे’ है, पर यहाँ भाव ‘तुम ही इसका दायित्व सँभालो’ है। ‘तुम स्वयं जानो’ हिन्दी में संक्षिप्त, प्रचलित और जानबूझकर कुछ हद तक खुला हुआ रूप है।
theological_decisions:
- issue: पिलातुस का निर्दोष होने का दावा
  choice: प्रत्यक्ष कथन में ‘मैं इस खून का दोषी नहीं हूँ’
  alternative: ‘मैं इस खून से निर्दोष हूँ’ अथवा कथाकार की ओर से उसे निर्दोष बताना
  rationale: पाठ पिलातुस का अपना दावा प्रस्तुत करता है; अनुवाद उसे न तो समर्थन देता है, न खारिज करता है। इससे उसकी वास्तविक नैतिक जिम्मेदारी संबंधी कथात्मक तनाव बना रहता है।
- issue: ὑμεῖς ὄψεσθε में उत्तरदायित्व का भाव
  choice: ‘तुम स्वयं जानो’
  alternative: ‘तुम ही इसकी जिम्मेदारी लो’
  rationale: स्पष्ट ‘जिम्मेदारी लो’ प्रसंगगत अर्थ है, पर मूल के ‘देखना’ वाले मुहावरे को पूरी तरह व्याख्यायित कर देता। चुना हुआ रूप दायित्व का संकेत देता है और मूल की संक्षिप्तता तथा अस्पष्टता भी बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘पिलातुस’, ‘उपद्रव’ और ‘दोषी’ सामान्य बाइबलीय तथा सार्वजनिक-न्यायिक प्रसंग में बोधगम्य हैं। मुख्य पाठ में अत्यधिक व्याख्या से बचते हुए आवश्यक शाब्दिक विकल्प पादटिप्पणियों में दिए गए हैं।
