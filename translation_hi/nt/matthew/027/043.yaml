source:
  edition: SBLGNT
  text: πέποιθεν ἐπὶ τὸν θεόν, ῥυσάσθω ⸀νῦν εἰ θέλει αὐτόν· εἶπεν γὰρ ὅτι Θεοῦ εἰμι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: hi
  text: उसने परमेश्वर पर भरोसा रखा है; अब परमेश्वर उसे छुड़ा ले, यदि परमेश्वर उसे चाहता है[a], क्योंकि उसने कहा था[b], ‘मैं परमेश्वर का पुत्र हूँ।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि वह उससे प्रसन्न है।” यह शब्दावली भजन 22:8 की प्रतिध्वनि है, जहाँ परमेश्वर की प्रसन्नता का भाव प्रमुख है।
    reason: alternative_reading
  - marker: b
    text: यह ठट्ठा भजन 22:8 की निकट प्रतिध्वनि है और यीशु के उपहास को उस भजन के धर्मी पीड़ित से जोड़ता है।
    reason: cross_reference
lexical_decisions:
- source_word: πέποιθεν ἐπὶ τὸν θεόν
  choice: उसने परमेश्वर पर भरोसा रखा है
  rationale: पूर्णकाल एक पूर्व भरोसे से बनी हुई वर्तमान और स्थिर अवस्था व्यक्त करता है। ‘भरोसा रखा है’ इस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ῥυσάσθω νῦν
  choice: तो अब उसे छुड़ा ले
  rationale: ῥύομαι संकट से बचाने या छुड़ाने का अर्थ देता है; ‘छुड़ा ले’ उपहासपूर्ण चुनौती और तत्कालता दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰ θέλει αὐτόν
  choice: यदि परमेश्वर उसे चाहता है
  rationale: θέλω का सीधा अर्थ ‘चाहना’ है। भजन 22:8 की प्रतिध्वनि के कारण ‘उससे प्रसन्न है’ सम्भव है, पर उसे मुख्य पाठ में आरोपित करने के बजाय पाद-टिप्पणी में रखा गया है। परमेश्वर को दोबारा व्यक्त करने से हिन्दी में कर्ता स्पष्ट रहता है।
- source_word: εἶπεν γὰρ
  choice: क्योंकि उसने कहा था
  rationale: साधारण भूतकाल उस पहले किए गए दावे की ओर संकेत करता है जिस पर ठट्ठा आधारित है; हिन्दी में ‘कहा था’ काल-संबंध को स्पष्ट करता है।
- source_word: Θεοῦ εἰμι υἱός
  choice: मैं परमेश्वर का पुत्र हूँ
  rationale: मत्ती के प्रसंग में यह एक पहचाना हुआ मसीही पदनाम है। हिन्दी में ‘परमेश्वर का पुत्र’ निश्चित पदवी का भाव स्वाभाविक रूप से देता है; ‘परमेश्वर का एक पुत्र’ प्रसंग में अनुचित रूप से अनिश्चित होगा।
theological_decisions:
- issue: Θεοῦ εἰμι υἱός में मसीही पदवी
  choice: मैं परमेश्वर का पुत्र हूँ
  alternative: मैं परमेश्वर का एक पुत्र हूँ
  rationale: यद्यपि यूनानी में υἱός के साथ उपपद नहीं है, विधेय संरचना और मत्ती का कथानक इसे गुणात्मक तथा पदवीगत बनाते हैं, अनिश्चित नहीं।
- issue: θέλει αὐτόν में चाहने अथवा प्रसन्न होने का भाव
  choice: यदि परमेश्वर उसे चाहता है
  alternative: यदि परमेश्वर उससे प्रसन्न है
  rationale: मुख्य पाठ θέλω का सामान्य अर्थ सुरक्षित रखता है, जबकि भजन 22:8 से आने वाला कृपा या प्रसन्नता का भाव पाद-टिप्पणी में दिया गया है; इस प्रकार वास्तविक अर्थगत तनाव बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली। ‘छुड़ा ले’ संकट से उद्धार की ठोस छवि रखता है; ‘परमेश्वर का पुत्र’ स्थापित बाइबलीय पदवी है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
