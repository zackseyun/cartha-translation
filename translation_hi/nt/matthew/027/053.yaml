source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: hi
  text: और वे उसके जी उठने के बाद कब्रों से निकलकर[a] पवित्र नगर में प्रवेश किया और बहुतों को दिखाई दिए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्य में “उसके जी उठने के बाद” शब्द “कब्रों से” और “वे पवित्र नगर में प्रवेश किया” के बीच आते हैं। इसे अधिक शाब्दिक क्रम में यों भी कहा जा सकता है: “और कब्रों से निकलकर, उसके जी उठने के बाद, वे पवित्र नगर में प्रवेश किया…”'
    reason: alternative_reading
  - marker: b
    text: “पवित्र नगर” से यरूशलेम अभिप्रेत है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθόντες
  choice: निकलकर
  rationale: अओरिस्ट कृदन्त को स्वाभाविक हिन्दी में पूर्वकालिक सहायक क्रिया के रूप में व्यक्त करता है और मुख्य क्रिया से उसका अधीन सम्बन्ध बनाए रखता है।
- source_word: μνημείων
  choice: कब्रों
  rationale: यहाँ शब्द उन दफ़न-स्थानों को सूचित करता है जो पिछले पद में खुल गए थे; ‘कब्रों’ सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: उसके जी उठने के बाद
  rationale: μετά के कालवाचक अर्थ ‘बाद’ और ἔγερσις के उठाए जाने/जी उठने के भाव को सहज हिन्दी में व्यक्त करता है। ‘उसके’ का संदर्भ प्रसंग में यीशु है, पर मूल की सर्वनामात्मक अभिव्यक्ति बनाए रखी गई है।
- source_word: εἰσῆλθον
  choice: में गए
  rationale: नगर में प्रवेश करने का अर्थ साधारण, वर्तमान हिन्दी में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: τὴν ἁγίαν πόλιν
  choice: पवित्र नगर
  rationale: मूल बाइबलीय उपाधि को सुरक्षित रखता है; संदर्भित नगर यरूशलेम है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐνεφανίσθησαν
  choice: दिखाई दिए
  rationale: मध्य/कर्मवाच्य रूप के ‘दृश्य हुए, प्रकट हुए’ भाव को सामान्य हिन्दी में स्पष्टता से व्यक्त करता है।
- source_word: πολλοῖς
  choice: बहुतों को
  rationale: अनिश्चित बहुवचन को बिना अनावश्यक रूप से ‘लोग’ जोड़कर संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: कब्रों से निकलने और ‘उसके जी उठने के बाद’ के बीच कालगत सम्बन्ध
  choice: ‘उसके जी उठने के बाद’ को ‘कब्रों से निकलकर’ के साथ रखा गया है, जिससे निकलना और फिर नगर में जाना यीशु के जी उठने के बाद घटित समझे जाते हैं।
  alternative: इसे अधिक ढीले रूप में पिछले पद से जोड़कर यह समझा जा सकता है कि कब्रें यीशु की मृत्यु पर खुलीं, जबकि पवित्र जन उसके जी उठने के बाद बाहर निकले; वाक्य को ‘वे कब्रों से निकले और उसके जी उठने के बाद नगर में गए’ कहना भी सम्भव माना गया है।
  rationale: यूनानी में μετὰ τὴν ἔγερσιν αὐτοῦ कृदन्तीय खण्ड ἐξελθόντες ἐκ τῶν μνημείων के तुरन्त बाद और मुख्य क्रिया से पहले आता है। हिन्दी क्रम इस निकट सम्बन्ध को बनाए रखता है और घटना-क्रम का अतिरिक्त सामंजस्य स्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जी उठना’, ‘कब्र’ और ‘पवित्र नगर’ व्यापक रूप से समझे जाने वाले बाइबलीय पद हैं। मुख्य पाठ में यूनानी वाक्य के कालगत सम्बन्ध को यथासम्भव स्पष्ट रखा गया है, जबकि उसकी सम्भावित संरचनात्मक अस्पष्टता पादटिप्पणी में दी गई है।
