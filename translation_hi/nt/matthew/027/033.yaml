lexical_decisions:
- source_word: ἐλθόντες
  choice: जब वे ... पहुँचे
  rationale: एओरिस्ट कृदंत को स्वाभाविक हिन्दी कालवाचक उपवाक्य के रूप में प्रस्तुत किया गया है; इससे कथा का प्रवाह बना रहता है।
- source_word: τόπον
  choice: स्थान
  rationale: τόπος का सामान्य अर्थ ‘स्थान’ है। ‘नामक स्थान’ हिन्दी में अनिश्चित अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λεγόμενον
  choice: नामक
  rationale: इस नामसूचक प्रयोग में ‘नामक’ संक्षिप्त, स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: Γολγοθᾶ
  choice: गुलगुता
  rationale: स्थान-नाम को उसके प्रचलित हिन्दी बाइबलीय लिप्यंतरण में रखा गया है, अनुवाद नहीं किया गया।
- source_word: ὅ ἐστιν
  choice: जिसका अर्थ है
  rationale: यह सूत्र गैर-यूनानी स्थान-नाम की व्याख्या करता है; ‘जिसका अर्थ है’ उसके व्याख्यात्मक बल को स्पष्ट करता है।
- source_word: Κρανίου Τόπος
  choice: खोपड़ी का स्थान
  rationale: κρανίον के लिए ‘खोपड़ी’ और τόπος के लिए ‘स्थान’ मूल पदबंध को निकटता से तथा सहज हिन्दी में व्यक्त करते हैं; यूनानी में लेख न होने के कारण किसी विशिष्ट खोपड़ी का संकेत नहीं जोड़ा गया।
- source_word: λεγόμενος
  choice: अर्थ है
  rationale: यूनानी में ‘कहलाता है’ की पुनरावृत्ति व्याख्यात्मक नामकरण का भाग है; हिन्दी में उसे शब्दशः दोहराने के बजाय अर्थ-सूचक वाक्यांश में स्वाभाविक रूप से समाहित किया गया है।
