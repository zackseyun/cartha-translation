id: MAT.27.19
reference: Matthew 27:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: hi
  text: 'जब वह न्यायासन पर बैठा हुआ था, तब उसकी पत्नी ने उसके पास यह संदेश भेजा: “उस धर्मी मनुष्य[a] से तुम्हारा कुछ लेना-देना न हो, क्योंकि आज मैंने सपने में उसके कारण बहुत दुःख सहा है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस निर्दोष मनुष्य।” न्यायिक प्रसंग में यूनानी विशेषण का अर्थ “निर्दोष” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: जब वह ... बैठा हुआ था
  rationale: संबंधवाचक स्वतंत्र कृदंत उस समय चल रही परिस्थिति बताता है; यह रूप समकालिकता और जारी अवस्था दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τοῦ βήματος
  choice: न्यायासन पर
  rationale: न्यायिक प्रसंग में βῆμα अधिकारी के उस आसन को दर्शाता है जहाँ से न्यायिक निर्णय दिया जाता था; ‘न्यायासन’ संक्षिप्त और स्पष्ट है।
- source_word: ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα
  choice: उसकी पत्नी ने उसके पास यह संदेश भेजा
  rationale: मूल में पत्नी द्वारा किसी माध्यम से कथन भेजने का भाव है। ‘संदेश भेजा’ माध्यम को अनावश्यक रूप से निश्चित किए बिना हिन्दी में स्वाभाविक है।
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: उस धर्मी मनुष्य से तुम्हारा कुछ लेना-देना न हो
  rationale: यूनानी की संक्षिप्त मुहावरेदार अभिव्यक्ति किसी व्यक्ति के मामले में शामिल न होने की चेतावनी देती है। हिन्दी मुहावरा उसी व्यापक अर्थ को बनाए रखता है और ‘उसके विरुद्ध’ जैसा अनकहा तत्व नहीं जोड़ता।
- source_word: τῷ δικαίῳ ἐκείνῳ
  choice: उस धर्मी मनुष्य
  rationale: δίκαιος का मूल नैतिक अर्थ ‘धर्मी/न्यायी’ है, जबकि मुकदमे के प्रसंग में ‘निर्दोष’ भी संभव है। मुख्य पाठ में ‘धर्मी’ मत्ती की नैतिक शब्दावली को सुरक्षित रखता है।
- source_word: πολλὰ ... ἔπαθον
  choice: बहुत दुःख सहा है
  rationale: πολλὰ πάσχω का अर्थ बहुत अधिक कष्ट उठाना है। हिन्दी का पूर्ण रूप वर्तमान चेतावनी के लिए उस अनुभव की बनी हुई प्रासंगिकता व्यक्त करता है।
- source_word: σήμερον κατ’ ὄναρ δι’ αὐτόν
  choice: आज मैंने सपने में उसके कारण
  rationale: ‘आज’, ‘सपने में’ और ‘उसके कारण’ क्रमशः समय, स्वप्न-अनुभव और कारण को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करते हैं।
theological_decisions:
- issue: यीशु के लिए δίκαιος का अनुवाद
  choice: धर्मी मनुष्य
  alternative: निर्दोष मनुष्य
  rationale: ‘धर्मी’ शब्द के नैतिक और धार्मिक आयाम को बनाए रखता है; फिर भी न्यायिक प्रसंग में ‘निर्दोष’ वास्तविक अर्थ-संभावना है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। ‘न्यायासन’ न्यायिक संदर्भ को स्पष्ट करता है, और ‘कुछ लेना-देना न हो’ मूल यूनानी मुहावरे की खुली व्यापकता को बनाए रखता है।
