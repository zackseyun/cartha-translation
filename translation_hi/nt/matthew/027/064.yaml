id: MAT.27.64
reference: Matthew 27:64
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: hi
  text: इसलिए कब्र को तीसरे दिन तक सुरक्षित रखने की आज्ञा दीजिए, कहीं ऐसा न हो कि उसके चेले आकर[a] उसे चुरा लें और लोगों से कहें, ‘उसे मरे हुओं में से जिलाया गया है।’[b] तब अंतिम धोखा पहले धोखे से भी बुरा होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ पांडुलिपियों में “आकर” के बाद “रात को” जोड़ा गया है: “कहीं ऐसा न हो कि उसके चेले रात को आकर उसे चुरा लें।” यहाँ संक्षिप्त पाठ अपनाया गया है।'
    reason: textual_variant
  - marker: b
    text: या, “उसे मरे हुओं में से जिलाया गया।” यूनानी क्रिया निष्क्रिय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κέλευσον
  choice: आज्ञा दीजिए
  rationale: यह अओरिस्ट आज्ञार्थक पिलातुस से निर्णायक आधिकारिक आदेश देने का अनुरोध करता है; आदरसूचक रूप प्रसंगानुकूल है।
- source_word: οὖν
  choice: इसलिए
  rationale: पिछले कथन से निकले निष्कर्ष और तर्क-संबंध को स्पष्ट रखता है।
- source_word: ἀσφαλισθῆναι τὸν τάφον
  choice: कब्र को ... सुरक्षित रखने
  rationale: निष्क्रिय भाव और सुरक्षा के व्यापक अर्थ को बनाए रखता है; केवल पहरा लगाने जैसा साधन अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: तीसरे दिन तक
  rationale: मूल समय-सूचक अभिव्यक्ति का स्वाभाविक हिन्दी रूप है और पुनरुत्थान की पूर्वकथन-भाषा से संबंध बनाए रखता है।
- source_word: μήποτε
  choice: कहीं ऐसा न हो कि
  rationale: आशंकित संभावना और उसे रोकने के उद्देश्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κλέψωσιν αὐτόν
  choice: उसे चुरा लें
  rationale: मूल में कर्मवाचक सर्वनाम ‘उसे’ है; ‘शरीर’ जोड़कर निहित अर्थ को स्पष्ट कथन में नहीं बदला गया।
- source_word: εἴπωσιν τῷ λαῷ
  choice: लोगों से कहें
  rationale: λαός को किसी तत्काल उपस्थित भीड़ तक सीमित किए बिना सामान्य लोगों के अर्थ में रखता है।
- source_word: Ἠγέρθη ἀπὸ τῶν νεκρῶν
  choice: उसे मरे हुओं में से जिलाया गया है
  rationale: यूनानी के निष्क्रिय रूप को बनाए रखता है और जिलाने वाले कर्ता को मूल की तरह अनकहा छोड़ता है।
- source_word: ἡ ἐσχάτη πλάνη
  choice: यह आखिरी छल
  rationale: πλάνη यहाँ विरोधियों की दृष्टि में धोखे या भटकावे को सूचित करता है; ‘छल’ इस प्रसंग में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: पुनरुत्थान के दावे में निष्क्रिय वाच्य
  choice: उसे मरे हुओं में से जिलाया गया है
  alternative: वह मरे हुओं में से जी उठा है
  rationale: Ἠγέρθη निष्क्रिय है। चुना हुआ रूप परमेश्वर को स्पष्ट कर्ता के रूप में जोड़े बिना मूल की धार्मिक तनावपूर्ण अभिव्यक्ति को सुरक्षित रखता है।
- issue: πλάνη का मूल्यांकनात्मक अर्थ
  choice: छल
  alternative: भ्रम
  rationale: वक्ता चेलों द्वारा कथित चोरी और झूठे दावे की आशंका जता रहे हैं, इसलिए ‘छल’ प्रसंगानुकूल है; इसे वर्णनकर्ता का अपना निर्णय न मानकर वक्ताओं के कथन के भीतर रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का आदरसूचक, औपचारिक किंतु सहज गद्य। ‘कब्र’ सामान्य पाठक के लिए स्वाभाविक है; निष्क्रिय पुनरुत्थान-भाषा जानबूझकर सुरक्षित रखी गई है। पाठ में पद के अंत पर [a] लगाया गया है क्योंकि पांडुलिपीय भेद ‘आकर’ से संबंधित है और मुख्य पाठ को बाधित किए बिना वहीं से टिप्पणी स्पष्ट रूप से जुड़ती है।
