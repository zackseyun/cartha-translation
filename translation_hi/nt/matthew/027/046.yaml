language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: hi
  text: नौवें घंटे के लगभग यीशु ने ऊँचे स्वर से पुकारकर कहा, “एली, एली, लमा सबख़्तानी?” अर्थात, “हे मेरे परमेश्वर, हे मेरे परमेश्वर, आपने मुझे क्यों छोड़ दिया है?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन शब्दों में भजन 22:1 की प्रतिध्वनि है।
    reason: cross_reference
  - marker: b
    text: या, “आपने मुझे क्यों छोड़ दिया?” यूनानी क्रिया एओरिस्ट रूप में है; इस पुकार के स्वाभाविक भाव और भजन से जुड़ी परिचित प्रतिध्वनि को बनाए रखने के लिए यहाँ हिंदी पूर्ण-पक्ष ‘छोड़ दिया है’ प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: नौवें घंटे के लगभग
  rationale: περί समय के लगभग होने को व्यक्त करता है। δέ हल्का संयोजक है; हिंदी में अलग संयोजक जोड़े बिना वाक्य स्वाभाविक रहता है।
- source_word: ἀνεβόησεν … φωνῇ μεγάλῃ λέγων
  choice: ऊँचे स्वर से पुकारकर कहा
  rationale: यह अभिव्यक्ति ऊँची पुकार, स्वर की तीव्रता और कथन की भूमिका—तीनों को स्वाभाविक हिंदी में बनाए रखती है।
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: एली, एली, लमा सबख़्तानी?
  rationale: मत्ती पहले सामी भाषा के शब्दों को सुरक्षित रखता है और फिर उनका अर्थ देता है; हिंदी पाठ भी इसी प्रस्तुति को बनाए रखता है।
- source_word: τοῦτ’ ἔστιν
  choice: अर्थात
  rationale: यह सूत्र पहले दिए गए सामी वाक्य का अनुवाद अथवा स्पष्टीकरण प्रस्तुत करता है।
- source_word: Θεέ μου θεέ μου
  choice: हे मेरे परमेश्वर, हे मेरे परमेश्वर
  rationale: संबोधन और उसकी पुनरावृत्ति को स्पष्ट रूप से सुरक्षित रखा गया है; यही भजन 22:1 की प्रतिध्वनि भी बनाए रखता है।
- source_word: ἱνατί με ἐγκατέλιπες
  choice: आपने मुझे क्यों छोड़ दिया है?
  rationale: ἱνατί का सीधा अर्थ ‘क्यों’ है। यूनानी एओरिस्ट को हिंदी पूर्ण पक्ष में देना इस वर्तमान पुकार के स्वाभाविक भाव और भजन-संबंधी परिचित अनुगूँज को बनाए रखता है। ‘छोड़ दिया’ गंभीर होने के साथ सामान्य पाठकों के लिए सहज है।
theological_decisions:
- issue: यीशु की पुकार और भजन 22:1 का संबंध
  choice: पुकार को उसके सीधे, वास्तविक बल के साथ रखा गया है और भजन की प्रतिध्वनि पादटिप्पणी में बताई गई है, पर धर्मवैज्ञानिक तनाव का समाधान अनुवाद में नहीं थोपा गया।
  alternative: इसे केवल भजन के संकेत के रूप में हल्का करना, या परित्याग के भाव को व्याख्यात्मक पुनर्लेखन से नरम करना।
  rationale: यूनानी पाठ पुकार और उसका अर्थ बिना किसी व्याख्यात्मक योग्यता के देता है। सीधी भाषा पाठ की गंभीरता और धर्मवैज्ञानिक तनाव दोनों को सुरक्षित रखती है।
- issue: सामी भाषा की पुकार को मुख्य पाठ में रखना
  choice: लिप्यंतरित सामी शब्दों को मुख्य पाठ में रखा गया है और उनके बाद अर्थ दिया गया है।
  alternative: मुख्य पाठ में केवल हिंदी अर्थ देना।
  rationale: मत्ती की अपनी रचना दोनों रूप देती है; उन्हें बनाए रखने से मूल प्रस्तुति और आगे एलिय्याह से संबंधित संभावित गलतफ़हमी की कथात्मक पृष्ठभूमि सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिंदी का गंभीर किंतु सहज स्तर अपनाया गया है। ‘नौवाँ घंटा’ प्राचीन समय-गणना को सुरक्षित रखता है; ‘हे मेरे परमेश्वर’ स्पष्ट संबोधन है। पादटिप्पणी-चिह्न उस पूरी उद्धृत पुकार के बाद रखा गया है जिससे भजन-संबंध स्पष्ट हो।
