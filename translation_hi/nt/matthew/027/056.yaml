  text: ἐν αἷς ἦν Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ἡ τοῦ Ἰακώβου καὶ ⸀Ἰωσὴφ μήτηρ καὶ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/056.yaml
  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: hi
  text: उनमें मरियम मगदलीनी, याकूब और यूसुफ[a] की माता मरियम, और ज़ब्दी के पुत्रों की माता थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों अथवा पाठों में ‘यूसुफ’ के स्थान पर ‘योसेस’ है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐν αἷς
  choice: उनमें
  rationale: यह पिछले पद में बताई गई स्त्रियों के समूह की ओर संकेत करता है। आधुनिक हिन्दी में ‘उनमें’ स्वाभाविक और स्पष्ट है।
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: मरियम मगदलीनी
  rationale: यह नाम और मगदला से संबंधित पहचान-सूचक उपाधि को प्रचलित हिन्दी बाइबलीय रूप में रखता है।
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: याकूब और यूसुफ की माता मरियम
  rationale: सम्बन्धकारक पदों को स्पष्ट रूप से दोनों पुत्रों से जोड़ता है और हिन्दी में पहचान बताने का स्वाभाविक क्रम अपनाता है।
- source_word: Ἰακώβου
  choice: याकूब
  rationale: यूनानी Ἰάκωβος के लिए हिन्दी में प्रचलित और स्रोत-नाम के निकट रूप।
- source_word: Ἰωσὴφ
  choice: यूसुफ
  rationale: SBLGNT के Ἰωσήφ का प्रचलित हिन्दी रूप; वैकल्पिक पाठ को पाद-टिप्पणी में रखा गया है।
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: ज़ब्दी के पुत्रों की माता
  rationale: यूनानी सम्बन्धकारक संरचना का स्पष्ट और सहज हिन्दी रूप, जिसमें माता का नाम न दिए जाने की स्रोतगत विशेषता बनी रहती है।
