id: MAT.27.22
reference: Matthew 27:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: hi
  text: पिलातुस ने उनसे कहा, “तो मैं यीशु के साथ क्या करूँ, जो मसीह कहलाता है?” उन सब ने कहा, “उसे क्रूस पर चढ़ाया जाए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: तो मैं ... क्या करूँ
  rationale: ποιήσω यहाँ विचार-विमर्श सूचक प्रश्न में प्रयुक्त एओरिस्ट सब्जंक्टिव है; हिंदी में “क्या करूँ” इसका स्वाभाविक समतुल्य है। “तो” οὖν के निष्कर्षसूचक/संवाद-संबंधी भाव को व्यक्त करता है।
- source_word: Ἰησοῦν
  choice: यीशु
  rationale: व्यक्तिगत नाम का प्रचलित मानक हिंदी रूप रखा गया है।
- source_word: τὸν λεγόμενον χριστόν
  choice: जो मसीह कहलाता है
  rationale: λεγόμενον वर्तमानकालिक कर्मवाच्य कृदंत है और χριστόν यहाँ उपाधि के रूप में आता है। “मसीह” अभिषिक्त उद्धारकर्ता की यहूदी प्रत्याशा से जुड़ा अर्थ बनाए रखता है।
- source_word: λέγουσιν πάντες
  choice: उन सब ने कहा
  rationale: ऐतिहासिक वर्तमान λέγουσιν को सहज हिंदी कथा-शैली में भूतकाल से व्यक्त किया गया है; πάντες की सामूहिक व्यापकता “सब” से सुरक्षित रहती है।
- source_word: Σταυρωθήτω
  choice: उसे क्रूस पर चढ़ाया जाए
  rationale: यह तीसरे पुरुष एकवचन का एओरिस्ट कर्मवाच्य आज्ञार्थक है। यह अनुवाद आज्ञा और कर्मवाच्य, दोनों को बनाए रखता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यहाँ Χριστός नाम का अंश नहीं, बल्कि यीशु के लिए प्रयुक्त उपाधि है। “मसीह” आधुनिक हिंदी बाइबलीय भाषा में अर्थपूर्ण और व्यापक रूप से समझा जाने वाला रूप है; यह पद किसी विशिष्ट सांप्रदायिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथा-शैली। यूनानी वाक्य की प्रश्नात्मकता, सामूहिक उत्तर और कर्मवाच्य आज्ञा सुरक्षित रखी गई है। उपलब्ध अंग्रेज़ी परामर्श-पाठ का [a] चिह्न मूलतः असंगत स्थान पर दिखता है और उसकी टिप्पणी “Messiah/Christ” के विकल्प से संबंधित है; हिंदी में “मसीह” स्वयं स्थापित अर्थपरक रूप होने के कारण अनावश्यक टिप्पणी नहीं जोड़ी गई।
