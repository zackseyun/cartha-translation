  to: पर्व के समय राज्यपाल की प्रथा थी कि वह भीड़ की इच्छा के अनुसार एक कैदी को छोड़ देता था—जिसे वे चाहते थे।
  rationale: The revision preserves the temporal setting, customary past action, singular prisoner, and the crowd’s plural desire. It replaces an awkward Hindi dative equivalent with an idiomatic contextual expression and makes the habitual past explicit. No footnote is required, since the English lexical alternative ‘festival’ does not require a separate Hindi note.
