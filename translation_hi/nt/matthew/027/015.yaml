source:
  edition: SBLGNT
  text: Κατὰ δὲ ἑορτὴν εἰώθει ὁ ἡγεμὼν ἀπολύειν ἕνα τῷ ὄχλῳ δέσμιον ὃν ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: hi
  text: पर्व के समय राज्यपाल की प्रथा थी कि वह भीड़ की इच्छा के अनुसार एक कैदी को छोड़ देता था—जिसे वे चाहते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: पर्व के समय
  rationale: κατά के साथ कर्मकारक यहाँ समय का बोध कराता है—पर्व के समय या उसके दौरान। δέ हल्का कथात्मक संयोजक है, जिसे हिंदी में अलग शब्द से व्यक्त करना आवश्यक नहीं।
- source_word: ἑορτὴν
  choice: पर्व
  rationale: ἑορτή धार्मिक पर्व या उत्सव को दर्शाता है। प्रसंग में यह फसह का पर्व है; ‘पर्व’ आधुनिक हिंदी में स्वाभाविक और गरिमापूर्ण है।
- source_word: εἰώθει
  choice: की यह प्रथा थी
  rationale: क्रिया का अपूर्णकालीन रूप बीते समय की नियमित प्रथा व्यक्त करता है। यह हिंदी में ‘अभ्यस्त था’ से अधिक सहज है।
- source_word: ὁ ἡγεμὼν
  choice: राज्यपाल
  rationale: इस प्रसंग में ἡγεμών रोमी प्रांतीय शासक को दर्शाता है; ‘राज्यपाल’ स्पष्ट और प्रचलित पद है।
- source_word: ἀπολύειν
  choice: छोड़ दे
  rationale: न्यायिक हिरासत से मुक्त करने के अर्थ में ‘छोड़ देना’ सामान्य हिंदी में स्वाभाविक है।
- source_word: ἕνα ... δέσμιον
  choice: किसी एक कैदी को
  rationale: ἕνα संख्या एक को स्पष्ट करता है और δέσμιος हिरासत में रखे व्यक्ति को; ‘किसी एक कैदी’ चयन की संरचना को सहज हिंदी में व्यक्त करता है।
- source_word: τῷ ὄχλῳ
  choice: भीड़ के लिए
  rationale: सम्प्रदान कारक भीड़ के हित या अनुरोध पर कैदी छोड़े जाने को व्यक्त कर सकता है। हिंदी में ‘भीड़ के लिए’ इस संबंध को स्वाभाविक रूप से दर्शाता है।
- source_word: ὃν ἤθελον
  choice: जिसे वे चाहते थे
  rationale: संबंधवाचक उपवाक्य उस एक कैदी की पहचान करता है जिसे भीड़ चुनना चाहती थी; मूल का बहुवचन कर्ता ‘वे’ सुरक्षित रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण कथात्मक शैली। मूल की अभ्यस्त प्रथा और भीड़ द्वारा चयन—दोनों को स्पष्ट रखा गया है। किसी अनावश्यक आरंभिक कथोपकथन-सूचक शब्द को नहीं जोड़ा गया।
