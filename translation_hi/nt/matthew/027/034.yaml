  text: ἔδωκαν αὐτῷ πιεῖν ⸀οἶνον μετὰ χολῆς μεμιγμένον· καὶ γευσάμενος οὐκ ⸀ἠθέλησεν πιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: hi
  text: उन्होंने उसे पित्त मिला हुआ दाखरस पीने को दिया[a]; पर उसने उसे चखकर पीना नहीं चाहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द χολή का अर्थ ‘पित्त’ या अधिक सामान्य रूप से कोई कड़वा पदार्थ हो सकता है। यहाँ ‘पित्त’ मत्ती की शब्दावली को बनाए रखता है; मरकुस 15:23 के संबंधित दुःखभोग-वृत्तांत में गन्धरस का उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: उन्होंने उसे ... पीने को दिया
  rationale: यह δίδωμι के सामान्य अर्थ ‘देना’ और उद्देश्य/पूरक infinitive πιεῖν को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἶνον
  choice: दाखरस
  rationale: οἶνος का स्पष्ट अर्थ मदिरा/वाइन है; ‘दाखरस’ हिन्दी बाइबलीय शैली में परिचित और गरिमापूर्ण है तथा इसे केवल अस्पष्ट ‘पेय’ नहीं बनाता।
- source_word: μετὰ χολῆς μεμιγμένον
  choice: पित्त मिला हुआ
  rationale: χολή का मूल अर्थ ‘पित्त’ है, पर यह किसी कड़वे पदार्थ को भी सूचित कर सकता है। ‘पित्त’ मत्ती की शब्दावली और संभावित शास्त्रीय अनुगूँज को बनाए रखता है; μεμιγμένον मिश्रण को स्पष्ट करता है।
- source_word: καὶ γευσάμενος
  choice: पर उसने उसे चखकर
  rationale: γευσάμενος का अर्थ ‘चखने के बाद/चखकर’ है। καί को प्रसंगगत विरोध के कारण ‘पर’ कहना अगले निषेध को स्वाभाविक रूप से जोड़ता है।
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: पीना नहीं चाहा
  rationale: θέλω की इच्छा/तत्परता संबंधी बारीकी को सुरक्षित रखता है और अधिक प्रबल व्याख्यात्मक ‘पीने से इनकार कर दिया’ से बचता है।
theological_decisions:
- issue: दुःखभोग-वृत्तांत और शास्त्रीय अनुगूँज के संबंध में χολή का अनुवाद
  choice: पित्त
  alternative: कड़वा पदार्थ
  rationale: यूनानी शब्द वास्तविक पित्त अथवा व्यापक अर्थ में कड़वे पदार्थ को सूचित कर सकता है। मुख्य पाठ में ‘पित्त’ मत्ती की विशिष्ट शब्दावली को बनाए रखता है, जबकि पादटिप्पणी वास्तविक अर्थ-परास और मरकुस 15:23 के संबंधित विवरण को बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण बाइबलीय शैली। ‘पीना नहीं चाहा’ मूल के इच्छासूचक भाव को बनाए रखता है; ‘दाखरस’ οἶνος को विशिष्ट रूप से व्यक्त करता है।
