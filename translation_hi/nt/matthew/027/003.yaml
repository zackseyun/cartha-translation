reference: Matthew 27:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: hi
  text: तब यीशु को पकड़वाने वाले यहूदा ने जब देखा कि उन्हें दोषी ठहराया गया था, तो उसे पछतावा हुआ और उसने चाँदी के वे तीस सिक्के प्रधान याजकों और पुरनियों को लौटा दिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह अगले घटनाक्रम को आरम्भ करने वाला स्वाभाविक और संक्षिप्त काल-सूचक शब्द है।
- source_word: ἰδὼν
  choice: जब देखा
  rationale: अओरिस्ट कृदन्त का कालगत सम्बन्ध सहज आधुनिक हिन्दी में उपवाक्य के रूप में व्यक्त किया गया है।
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: यीशु को पकड़वाने वाले
  rationale: यह यहूदा की पहचान उसके किए हुए कार्य से कराता है। ‘पकड़वाने’ से इस प्रसंग में किसी को अधिकारियों के हाथ सौंपने और विश्वासघात करने का भाव स्वाभाविक रूप से आता है।
- source_word: ὅτι κατεκρίθη
  choice: कि उन्हें दोषी ठहराया गया है
  rationale: निष्क्रिय क्रिया को बनाए रखता है और निर्णय हो चुकने का भाव व्यक्त करता है; ‘उन्हें’ का संदर्भ यीशु से है।
- source_word: μεταμεληθεὶς
  choice: उसे पछतावा हुआ
  rationale: μεταμέλομαι यहाँ पछतावे या खेद को दर्शाता है; ‘मन फिराया’ अथवा ‘पश्चात्ताप किया’ कहने से अधिक प्रबल धर्मवैचारिक निष्कर्ष निकल सकता है।
- source_word: ἔστρεψεν
  choice: लौटा दिए
  rationale: धन को उसके पूर्व धारकों के पास वापस करने का प्रसंगगत अर्थ स्पष्ट और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: τὰ τριάκοντα ἀργύρια
  choice: चाँदी के वे तीस सिक्के
  rationale: ἀργύρια चाँदी के धन-खंडों या सिक्कों को दर्शाता है; ‘वे’ पहले उल्लिखित निश्चित राशि की ओर संकेत करता है।
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: प्रधान याजकों और पुरनियों को
  rationale: ये मत्ती में यहूदी नेतृत्व के दो विशिष्ट समूह हैं; ‘पुरनिये’ केवल अधिक आयु वाले पुरुष नहीं, बल्कि समुदाय के अगुए हैं।
theological_decisions:
- issue: यहूदा की प्रतिक्रिया में μεταμεληθεὶς का अर्थ
  choice: उसे पछतावा हुआ
  alternative: उसने पश्चात्ताप किया / उसने अपना मन बदला
  rationale: मूल क्रिया खेद या पछतावे को व्यक्त करती है और अपने आप में यहूदा की आत्मिक दशा या पूर्ण पश्चात्ताप के प्रश्न को निर्णीत नहीं करती।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। कृदन्तों की लंबी शृंखला को स्वाभाविक हिन्दी वाक्य-विन्यास में बदला गया है, पर घटनाओं का क्रम और कारणगत सम्बन्ध सुरक्षित है। यीशु के लिए आदरसूचक ‘उन्हें’ और यहूदा के लिए ‘उसे’ प्रयोग किया गया है।
