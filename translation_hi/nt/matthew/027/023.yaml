  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: hi
  text: 'पर उसने कहा[a], “आखिर उसने क्या बुरा किया है?” लेकिन वे और भी अधिक चिल्लाते रहे: “उसे क्रूस पर चढ़ाया जाए!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक बोलचाल की हिन्दी में, “क्यों, उसने क्या गलत किया है?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: उसने कहा
  rationale: यहाँ अओरिस्ट कथावाचन में सामान्य वचन-परिचय है; आधुनिक हिन्दी में ‘उसने कहा’ स्वाभाविक और पर्याप्त है।
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: आखिर उसने क्या बुरा किया है?
  rationale: प्रश्न में γάρ चुनौती या प्रतिवाद का भाव देता है, जिसे ‘आखिर’ स्वाभाविक हिन्दी में व्यक्त करता है; ‘क्या बुरा’ κακόν का नैतिक बल बनाए रखता है।
- source_word: περισσῶς
  choice: और भी ज़ोर से
  rationale: यह भीड़ की प्रतिक्रिया की तीव्रता और बढ़ने को व्यक्त करता है। प्रसंग में चिल्लाने के साथ ‘ज़ोर से’ स्वाभाविक है, यद्यपि यूनानी शब्द केवल ध्वनि की ऊँचाई तक सीमित नहीं है।
- source_word: ἔκραζον
  choice: चिल्लाकर कहने लगे
  rationale: अपूर्ण भूतकाल जारी या बार-बार होने वाली पुकार को दर्शाता है; ‘कहने लगे’ उस निरंतर प्रतिक्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: λέγοντες
  choice: कहने लगे
  rationale: समकालिक कृदंत को मुख्य क्रिया के साथ जोड़कर हिन्दी की स्वाभाविक संयुक्त अभिव्यक्ति बनाई गई है।
- source_word: Σταυρωθήτω
  choice: उसे क्रूस पर चढ़ाया जाए
  rationale: तीसरे पुरुष का अओरिस्ट कर्मवाच्य आज्ञार्थक रूप है; यह अनुवाद आज्ञा की शक्ति और कर्मवाच्य दोनों को सुरक्षित रखता है।
- source_word: ὁ δὲ ... οἱ δὲ
  choice: पर उसने ... लेकिन वे ...
  rationale: दोनों δέ कथानक की प्रगति और पिलातुस तथा भीड़ के बीच विरोध दर्शाते हैं; हिन्दी में थोड़े भिन्न संयोजक अनावश्यक पुनरुक्ति से बचते हुए विरोध बनाए रखते हैं।
theological_decisions:
- issue: भीड़ की क्रूस पर चढ़ाने की माँग का रूप
  choice: उसे क्रूस पर चढ़ाया जाए
  alternative: इसे क्रूस पर चढ़ाओ
  rationale: यूनानी में कर्मवाच्य आज्ञार्थक σταυρωθήτω है। कर्मवाच्य हिन्दी मूल की व्याकरणिक बनावट को बनाए रखती है और कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘क्रूस’ बाइबलीय संदर्भ में व्यापक रूप से पहचाना जाता है। मुख्य पाठ में कर्मवाच्य माँग रखी गई है, जबकि पादटिप्पणी अधिक प्रचलित सक्रिय आज्ञा बताती है।
