  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: hi
  text: तब उसने बरअब्बा को उनके लिए रिहा कर दिया, पर यीशु को कोड़े लगवाने के बाद[a] उसे क्रूस पर चढ़ाए जाने के लिए सौंप दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यीशु को कोड़े दिलवाने के बाद।’ यूनानी क्रिया रोमी दंड के रूप में कोड़े मारने या कोड़े लगवाने को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह स्वाभाविक रूप से घटनाक्रम की अगली कड़ी बताता है।
- source_word: ἀπέλυσεν αὐτοῖς
  choice: उसने ... को उनके लिए छोड़ दिया
  rationale: न्यायिक प्रसंग में ἀπολύω बंदी को रिहा करने का अर्थ देता है; दत्तिव αὐτοῖς लोगों को इस रिहाई के लाभार्थी बताता है।
- source_word: τὸν Βαραββᾶν
  choice: बरअब्बा
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: τὸν δὲ Ἰησοῦν
  choice: पर यीशु को
  rationale: δέ बरअब्बा की रिहाई और यीशु के साथ किए गए व्यवहार के बीच स्पष्ट विरोध दिखाता है।
- source_word: φραγελλώσας
  choice: कोड़े लगवाने के बाद
  rationale: अरिस्ट कृदंत मुख्य क्रिया से पहले हुई कार्रवाई बताता है। हिन्दी में प्रेरणार्थक रूप प्रसंगानुसार पिलातुस द्वारा रोमी सैनिकों से दंड दिलवाने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: παρέδωκεν
  choice: सौंप दिया
  rationale: यह किसी व्यक्ति को अधिकारियों के हवाले कर निर्धारित दंड के लिए सौंपने का न्यायिक भाव बनाए रखता है।
- source_word: ἵνα σταυρωθῇ
  choice: क्रूस पर चढ़ाए जाने के लिए
  rationale: निष्क्रिय क्रिया तथा उद्देश्य/परिणाम का भाव दोनों स्पष्ट रहते हैं।
theological_decisions:
- issue: यीशु को दंड दिए जाने में घटनाक्रम और कर्तृत्व
  choice: पिलातुस ने बरअब्बा को छोड़ा और यीशु को कोड़े लगवाने के बाद क्रूस पर चढ़ाए जाने के लिए सौंप दिया।
  alternative: यीशु को पहले सौंपा गया और फिर कोड़े लगाए गए।
  rationale: φραγελλώσας अरिस्ट कृदंत है और स्वाभाविक रूप से मुख्य क्रिया παρέδωκεν से पहले की कार्रवाई दर्शाता है। अनुवाद रोमी प्रक्रिया के बारे में अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: ἵνα उपवाक्य में उद्देश्य और परिणाम का संबंध
  choice: क्रूस पर चढ़ाए जाने के लिए
  alternative: ताकि उसे क्रूस पर चढ़ाया जाए
  rationale: यूनानी में उद्देश्य और अपेक्षित परिणाम के बीच संभावित अर्थ-तनाव को हिन्दी का यह संक्षिप्त रूप अनावश्यक रूप से कठोर किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘कोड़े लगवाने’ रोमी दंड को सहज भाषा में व्यक्त करता है; ‘क्रूस पर चढ़ाए जाने’ मूल के निष्क्रिय रूप को बनाए रखता है।
