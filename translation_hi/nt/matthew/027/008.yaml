  text: Therefore that field has been called Field of Blood to this day.
translation:
  language: hi
  text: इसलिए उस खेत का नाम “लहू का खेत” पड़ा, और वह आज तक इसी नाम से जाना जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले प्रसंग में बताए गए खेत की खरीद और उसके नामकरण के परिणाम को स्पष्ट रूप से जोड़ता है।
- source_word: ἐκλήθη
  choice: नाम ... पड़ा हुआ है
  rationale: अओरिस्ट कर्मवाच्य यहाँ नाम दिए जाने को व्यक्त करता है; ‘आज तक’ के साथ यह स्वाभाविक हिन्दी प्रयोग अतीत में पड़े और अब तक प्रचलित नाम का भाव देता है।
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: उस खेत
  rationale: ἀγρός का सीधा अर्थ ‘खेत’ है और ἐκεῖνος को प्रसंगानुसार ‘उस’ से व्यक्त किया गया है; इससे आगे के स्थान-नाम में ‘खेत’ की पुनरावृत्ति भी बनी रहती है।
- source_word: Ἀγρὸς Αἵματος
  choice: लहू का खेत
  rationale: यह स्थान-नाम संज्ञा ἀγρός और सम्बन्धकारक αἵματος से बना है। ‘लहू का खेत’ उसका पारदर्शी, स्वाभाविक और स्मरणीय हिन्दी रूप है।
- source_word: αἵματος
  choice: लहू
  rationale: αἷμα का सम्बन्धकारक एकवचन रूप यहाँ स्थान-नाम का भाग है। ‘लहू’ आधुनिक पाठकों के लिए बोधगम्य रहते हुए कथन की गंभीरता बनाए रखता है।
- source_word: ἕως τῆς σήμερον
  choice: आज तक
  rationale: यह लेखक के समय तक उस नाम के प्रचलित बने रहने को बताने वाला संक्षिप्त और स्वाभाविक हिन्दी मुहावरा है।
