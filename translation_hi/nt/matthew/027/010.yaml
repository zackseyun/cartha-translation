  text: καὶ ἔδωκαν αὐτὰ εἰς τὸν ἀγρὸν τοῦ κεραμέως, καθὰ συνέταξέν μοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/010.yaml
  text: and they gave them for the potter's field[b][a], just as the Lord directed me.
translation:
  language: hi
  text: और उन्होंने वे सिक्के कुम्हार के खेत के लिए दे दिए, ठीक वैसे ही जैसे प्रभु ने मुझे निर्देश दिया था।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निर्देश दिया था’ का अनुवाद ‘आज्ञा दी थी’ या ‘हिदायत दी थी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस भविष्यवाणी-संबंधी उद्धरण या संकेत में मत्ती ने प्रथम पुरुष ‘मुझे’ को बनाए रखा है; उसे आसपास के कथानक के अनुरूप नहीं बदला है।
    reason: cross_reference
lexical_decisions:
- source_word: ἔδωκαν
  choice: दे दिए
  rationale: δίδωμι के सामान्य अर्थ ‘देना’ को बनाए रखता है; ‘दाम चुकाए’ संदर्भतः संभव है, पर यूनानी क्रिया से अधिक व्याख्यात्मक होता।
- source_word: αὐτὰ
  choice: वे सिक्के
  rationale: नपुंसकलिंग बहुवचन सर्वनाम का संकेत पिछले संदर्भ के चाँदी के सिक्कों की ओर है। हिन्दी में केवल ‘उन्हें’ की अपेक्षा ‘वे सिक्के’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: εἰς τὸν ἀγρὸν
  choice: खेत के लिए
  rationale: यद्यपि εἰς का मूल स्थानवाचक अर्थ ‘में/की ओर’ हो सकता है, यहाँ धन के उपयोग अथवा खेत के अधिग्रहण के संदर्भ में प्रयोजनवाचक ‘के लिए’ उपयुक्त है।
- source_word: τοῦ κεραμέως
  choice: कुम्हार के
  rationale: सम्बन्धकारक रूप को स्वाभाविक हिन्दी सम्बन्धसूचक पदबंध के रूप में प्रस्तुत किया गया है।
- source_word: καθὰ
  choice: ठीक वैसे ही जैसे
  rationale: कथन और प्रभु के निर्देश के बीच अनुरूपता का बल सुरक्षित रहता है।
- source_word: συνέταξέν
  choice: निर्देश दिया था
  rationale: συντάσσω में अधिकारपूर्वक आदेश या निर्देश देने का भाव है। ‘निर्देश दिया’ आधुनिक हिन्दी में स्वाभाविक है और ‘आज्ञा दी’ की तुलना में अनावश्यक कठोरता नहीं जोड़ता।
- source_word: μοι
  choice: मुझे
  rationale: यूनानी पाठ के प्रथम पुरुष एकवचन को बिना कथानक के अनुरूप ढालने या सामंजस्य बैठाने के ज्यों का त्यों रखा गया है।
- source_word: κύριος
  choice: प्रभु
  rationale: κύριος के धार्मिक-संदर्भगत मानक हिन्दी प्रतिशब्द के रूप में ‘प्रभु’ चुना गया है।
theological_decisions:
- issue: भविष्यवाणी-संबंधी उद्धरण/संकेत में वक्ता का प्रथम पुरुष ‘मुझे’
  choice: यूनानी μοι के अनुसार ‘मुझे’ बनाए रखा गया।
  alternative: आसपास के कथानक के अनुसार इसे बहुवचन या तृतीय पुरुष में सहज बनाना।
  rationale: मत्ती के यूनानी पाठ में प्रथम पुरुष स्पष्ट है। अनुवाद में इसे बदलना उद्धरण की वास्तविक पाठगत और धर्मवैचारिक जटिलता को चुपचाप सुलझा देना होता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘वे सिक्के’ संदर्भ को स्पष्ट करता है, जबकि ‘कुम्हार का खेत’ स्थापित और स्वाभाविक पदबंध है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न सम्मिलित हैं।
