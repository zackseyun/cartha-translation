source:
  edition: SBLGNT
  text: οἱ δὲ λοιποὶ ⸀ἔλεγον· Ἄφες ἴδωμεν εἰ ἔρχεται Ἠλίας σώσων ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: hi
  text: पर बाकी लोग कह रहे थे[a], “रहने दो[b]। देखें, क्या एलिय्याह उसे बचाने आ रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर दूसरे लोग कह रहे थे।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसे छोड़ दो; देखें, क्या एलिय्याह उसे बचाने आता है।” यूनानी में “रहने दो” के साथ कर्म स्पष्ट नहीं किया गया है, और “आ रहा है” के लिए वर्तमान काल प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: पर बाकी लोग
  rationale: λοιποί पहले बताए गए व्यक्ति या व्यक्तियों के विपरीत शेष लोगों को दर्शाता है। ‘बाकी लोग’ आधुनिक हिन्दी में स्वाभाविक है और δέ का विरोधात्मक भाव ‘पर’ से बना रहता है।
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल चल रही या दोहराई जा रही वाणी का संकेत दे सकता है; ‘कह रहे थे’ हिन्दी में इस पक्ष को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἄφες
  choice: रहने दो
  rationale: यह एकवचन आज्ञार्थक है जिसका मूल भाव छोड़ देना या अनुमति देना है। प्रसंग में वक्ता खट्टा दाखरस देने वाले व्यक्ति से हस्तक्षेप रोकने को कहते हैं। यूनानी में कर्म व्यक्त नहीं है, इसलिए ‘रहने दो’ उस निहित अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἴδωμεν
  choice: देखें
  rationale: यह प्रथम पुरुष बहुवचन का प्रोत्साहनसूचक प्रयोग है। ‘देखें’ संक्षिप्त, स्वाभाविक और ‘आओ, हम देखें’ के समान अर्थ वाला है।
- source_word: εἰ ἔρχεται
  choice: क्या ... आ रहा है
  rationale: εἰ यहाँ परोक्ष प्रश्न आरम्भ करता है और वर्तमान काल ἔρχεται दृश्य की तात्कालिकता रखता है। हिन्दी में ‘देखें, क्या ... आ रहा है’ दोनों बातों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἠλίας
  choice: एलिय्याह
  rationale: यह हिन्दी बाइबलीय परंपरा में इस भविष्यद्वक्ता के नाम का प्रचलित रूप है।
- source_word: σώσων αὐτόν
  choice: उसे बचाने
  rationale: भविष्यकालिक कृदन्त आने के उद्देश्य को व्यक्त करता है। ‘उसे बचाने’ σῴζω का सामान्य अर्थ और क्रूस से प्रत्यक्ष छुटकारे का प्रसंग, दोनों बनाए रखता है।
theological_decisions:
- issue: क्रूस पर चढ़ाए जाने के प्रसंग में σῴζω के संभावित धर्मवैज्ञानिक अर्थ
  choice: ‘उसे बचाने’—यहाँ दृश्य और शारीरिक छुटकारे के तात्कालिक कथात्मक अर्थ में
  alternative: ‘उसे छुड़ाने’
  rationale: वक्ता क्रूस से दिखाई देने वाले छुटकारे की बात कर रहे हैं, अनन्त उद्धार के विषय में कोई सिद्धान्त नहीं दे रहे। फिर भी ‘बचाने’ मूल क्रिया का सामान्य अर्थ और दुःखभोग-वृत्तांत की विडंबना दोनों सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘बाकी लोग,’ ‘रहने दो,’ और ‘देखें’ सामान्य पाठक के लिए सहज हैं। अनकहे कर्म तथा ἔρχεται के वर्तमानकालीन भाव को मुख्य पाठ और पादटिप्पणी में खुला रखा गया है।
