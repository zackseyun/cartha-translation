lexical_decisions:
- source_word: τινὲς δὲ
  choice: परन्तु…कुछ
  rationale: τινὲς अनिश्चित समूह में से कुछ लोगों को सूचित करता है; δὲ यहाँ पिछले कथन के बाद हल्का विरोध या कथानक में नया मोड़ दिखाता है।
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: वहाँ खड़े लोगों में से
  rationale: संज्ञा के रूप में प्रयुक्त पूर्णकालिक कृदन्त वहाँ उपस्थित और खड़े लोगों को दर्शाता है; हिन्दी में यह स्वाभाविक रहते हुए दृश्य की भंगिमा बचाता है।
- source_word: ἀκούσαντες
  choice: यह सुनकर
  rationale: पूर्वकालिक कृदन्त मुख्य क्रिया से पहले हुई क्रिया बताता है। ‘यह’ पिछले पद में यीशु की पुकार की ओर संकेत करता है, जिसका कर्म यूनानी में निहित है।
- source_word: ἔλεγον
  choice: कहा
  rationale: यूनानी अपूर्णकाल चल रही या बार-बार कही जा रही बात का संकेत दे सकता है, पर इस संक्षिप्त कथात्मक प्रसंग में हिन्दी का ‘कहा’ स्वाभाविक है और अनावश्यक रूप से पुनरावृत्ति नहीं जोड़ता।
- source_word: Ἠλίαν
  choice: एलिय्याह को
  rationale: यह भविष्यद्वक्ता के नाम का प्रचलित हिन्दी बाइबलीय रूप है; कर्मकारक को ‘को’ से व्यक्त किया गया है।
- source_word: φωνεῖ
  choice: पुकार रहा है
  rationale: वर्तमानकालीन क्रिया को प्रगतिशील हिन्दी रूप में रखा गया है। ‘पुकारना’ किसी व्यक्ति को संबोधित करने या बुलाने—दोनों की सम्भावना खुली रखता है और ‘सहायता के लिए’ जैसी व्याख्या नहीं जोड़ता।
- source_word: οὗτος
  choice: यह
  rationale: संकेतवाचक सर्वनाम का सीधा और स्वाभाविक हिन्दी समतुल्य; यह वक्ताओं की दृष्टि से यीशु की ओर संकेत बनाए रखता है, बिना ‘यह आदमी’ जैसी सम्भावित अवमानना को बढ़ाए।
theological_decisions:
- issue: क्या दर्शकों के कथन को तथ्य के रूप में या उनकी समझ के रूप में प्रस्तुत किया जाए
  choice: 'प्रत्यक्ष कथन के रूप में: “यह एलिय्याह को पुकार रहा है।”'
  alternative: “उन्हें लगा कि वह एलिय्याह को पुकार रहा है।”
  rationale: यूनानी पाठ केवल दर्शकों के बोले हुए शब्द दर्ज करता है। मुख्य पाठ में ‘उन्हें लगा’ जोड़ना उनकी धारणा की मध्यस्थ व्याख्या करता; प्रत्यक्ष उद्धरण कथानक की विडम्बना और तनाव को सुरक्षित रखता है।
- issue: φωνεῖ Ἠλίαν में पुकारने का आशय
  choice: “एलिय्याह को पुकार रहा है”
  alternative: “एलिय्याह से सहायता माँग रहा है” या “एलिय्याह को बुला रहा है”
  rationale: मूल अभिव्यक्ति संबोधन, पुकार या बुलावे का अर्थ दे सकती है। ‘पुकार रहा है’ किसी विशेष उद्देश्य को आरोपित किए बिना वास्तविक अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। ‘परन्तु’ हल्के विरोध को, ‘वहाँ खड़े लोगों’ दृश्यात्मकता को, और ‘यह’ मूल संकेतवाचक बल को सुरक्षित रखता है। पादटिप्पणी का चिह्न मुख्य पाठ में उपस्थित है।
