reference: Matthew 27:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: hi
  text: इसलिए, जब वे इकट्ठे हुए, पिलातुस ने उनसे कहा, “तुम किसे चाहते हो कि मैं तुम्हारे लिए रिहा कर दूँ—यीशु बरअब्बा[a] को या यीशु को, जो मसीह[b] कहलाता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में ‘यीशु बरअब्बा’ के स्थान पर केवल ‘बरअब्बा’ है।
    reason: textual_variant
  - marker: b
    text: या ‘ख्रीस्त।’ यूनानी उपाधि ख्रिस्तोस का यहाँ ‘मसीह’ अनुवाद किया गया है, क्योंकि यह एक उपाधि के रूप में प्रयुक्त हुई है।
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων
  choice: जब वे इकट्ठे हो गए
  rationale: यह संबंधवाचक कृदंत-वाक्यांश मुख्य क्रिया से पहले पूरी हुई सामूहिक क्रिया को समयसूचक रूप में व्यक्त करता है। हिंदी में यह रूप स्वाभाविक रहते हुए उस पूर्वता को बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से संबंध और कथा की आगे की गति दोनों दर्शाता है; ‘इसलिए’ आधुनिक हिंदी में इसका स्पष्ट और स्वाभाविक संयोजक है।
- source_word: Τίνα θέλετε
  choice: तुम किसे चाहते हो
  rationale: प्रश्न दो व्यक्तियों में से चुनाव के विषय में है। आगे का ‘कि मैं…’ वाक्यांश θέλω और ἀπολύσω के संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἀπολύσω ὑμῖν
  choice: मैं तुम्हारे लिए रिहा कर दूँ
  rationale: न्यायिक और बंदी-संबंधी प्रसंग में ἀπολύω का अर्थ किसी बंदी को छोड़ना या रिहा करना है; ‘रिहा’ कानूनी अर्थ को स्पष्ट रखता है और ὑμῖν को ‘तुम्हारे लिए’ से व्यक्त किया गया है।
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: यीशु बरअब्बा
  rationale: दिए गए SBLGNT पाठ में बरअब्बा से पहले Ἰησοῦν मौजूद है। दोनों नाम रखने से एक ही नाम ‘यीशु’ वाले दो व्यक्तियों के बीच मूल पाठ का प्रभाव बना रहता है।
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: यीशु को, जो मसीह कहलाता है
  rationale: λεγόμενον को निष्पक्ष रूप से ‘जो…कहलाता है’ कहा गया है; इसमें ‘तथाकथित’ जैसा उपेक्षापूर्ण भाव नहीं जोड़ा गया। χριστός यहाँ स्पष्टतः उपाधि है, इसलिए उसका अर्थ ‘मसीह’ दिया गया है।
theological_decisions:
- issue: χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ χριστός नाम-सदृश पद नहीं, बल्कि ‘जो…कहलाता है’ के साथ प्रयुक्त उपाधि है। ‘मसीह’ उस उपाधि का अर्थ संप्रेषित करता है और मूल की अभिव्यक्ति को किसी मतगत व्याख्या से नहीं बढ़ाता।
- issue: बरअब्बा से पहले ‘यीशु’ का समावेश
  choice: मुख्य पाठ में ‘यीशु बरअब्बा’
  alternative: केवल ‘बरअब्बा’
  rationale: प्रदान किए गए SBLGNT मूल पाठ में Ἰησοῦν है, इसलिए उसे मुख्य पाठ में रखा गया है। जिन हस्तलिपियों में यह नाम नहीं है, उनके पाठ को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘रिहा’ न्यायिक प्रसंग को स्पष्ट करता है। दोनों पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद लगाए गए हैं जिनसे उनकी टिप्पणियाँ संबंधित हैं।
