source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: hi
  text: और यह कहते थे, “मन्दिर को ढाने और तीन दिन में उसे बनानेवाले[a], अपने आप को बचा! यदि तू परमेश्वर का पुत्र है, तो क्रूस पर से नीचे उतर आ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे फिर से बनानेवाले।” यूनानी क्रिया का सीधा अर्थ “बनाना” है, हालाँकि इस ताने के प्रसंग में फिर से बनाना अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: और यह कहते थे
  rationale: वर्तमान कृदन्त को पिछले वर्णन से जुड़ी हुई क्रिया के रूप में रखा गया है। हिन्दी में यह रूप उपहासपूर्ण कथन का स्वाभाविक परिचय देता है और कर्ता को अनावश्यक रूप से नहीं दोहराता।
- source_word: Ὁ καταλύων
  choice: मन्दिर को ढानेवाले
  rationale: सव्यंजक लेख के साथ आया कृदन्त यहाँ सीधे सम्बोधन का काम करता है। ‘ढानेवाले’ आरोप की ओर संकेत करते हुए यूनानी रूप की संक्षिप्तता बनाए रखता है।
- source_word: ναός
  choice: मन्दिर
  rationale: यद्यपि यह शब्द विशेष रूप से मन्दिर के पवित्र भवन को सूचित कर सकता है, इस ताने में सामान्य हिन्दी ‘मन्दिर’ सर्वाधिक स्वाभाविक और पर्याप्त है।
- source_word: ἐν τρισὶν ἡμέραις
  choice: तीन दिन में
  rationale: यह समय-सूचक वाक्यांश का सीधा, सहज हिन्दी रूप है और उपहास में दोहराए गए दावे की भाषा को बनाए रखता है।
- source_word: οἰκοδομῶν
  choice: उसे बनानेवाले
  rationale: यूनानी क्रिया का मूल अर्थ ‘बनाना’ है। हिन्दी में ‘उसे’ स्पष्टता के लिए मन्दिर के संदर्भ से जोड़ा गया है; ‘फिर से बनाना’ सम्भव संदर्भगत अर्थ है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: σῶσον σεαυτόν
  choice: अपने आप को बचा
  rationale: आज्ञार्थक क्रिया और निजवाचक सर्वनाम दोनों को सीधे तथा ताने की तीक्ष्णता के अनुरूप व्यक्त करता है।
- source_word: υἱὸς τοῦ θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: यह स्थापित और पारदर्शी हिन्दी रूप मसीही उपाधि की पूरी शक्ति को बिना विस्तार या दुर्बलता के बनाए रखता है।
- source_word: κατάβηθι ἀπὸ τοῦ σταυροῦ
  choice: क्रूस पर से नीचे उतर आ
  rationale: ऊँचे क्रूस पर स्थित व्यक्ति को नीचे आने की चुनौती के लिए यह स्वाभाविक हिन्दी आज्ञा है; ‘क्रूस’ σταυρός का प्रसंगानुकूल मानक अनुवाद है।
theological_decisions:
- issue: उपहास के प्रसंग में υἱὸς τοῦ θεοῦ का अनुवाद
  choice: परमेश्वर का पुत्र
  alternative: परमेश्वर का बेटा
  rationale: पाठ यीशु की पहचान को चुनौती देनेवालों के शब्द दर्ज करता है। ‘परमेश्वर का पुत्र’ उपाधि को यथावत रखता है, पर शर्तयुक्त ताने को न तो विश्वास-घोषणा बनाता है और न उसकी मसीही महत्ता घटाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है, पर सीधे सम्बोधन तथा एकवचन ‘तू’ से उपहास और चुनौती की तीक्ष्णता बनी रहती है। ‘मन्दिर’, ‘परमेश्वर का पुत्र’ और ‘क्रूस’ सामान्य आधुनिक हिन्दी में परिचित धार्मिक पद हैं।
