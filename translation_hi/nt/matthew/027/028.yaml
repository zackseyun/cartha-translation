lexical_decisions:
- source_word: ἐκδύσαντες
  choice: उसके कपड़े उतारकर
  rationale: अोरिस्ट कृदन्त पूर्ववर्ती क्रिया को दर्शाता है। यह अनुवाद क्रम को स्वाभाविक हिन्दी में व्यक्त करता है और यूनानी क्रिया के ‘कपड़े उतारने’ के अर्थ को बनाए रखता है।
- source_word: χλαμύδα
  choice: चोगा
  rationale: χλαμύς एक बाहरी वस्त्र, प्रायः छोटा सैनिक या अधिकारी-वर्ग का चोगा, दर्शाता है। ‘चोगा’ सामान्य पाठक के लिए स्वाभाविक है और संदर्भ से अधिक राजसी अर्थ आरोपित नहीं करता।
- source_word: κοκκίνην
  choice: सुर्ख लाल
  rationale: κόκκινος चमकीले गहरे लाल अथवा स्कारलेट रंग को दर्शाता है। ‘सुर्ख लाल’ आधुनिक हिन्दी में रंग की तीव्रता को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: περιέθηκαν αὐτῷ
  choice: उसे … पहनाया
  rationale: संदर्भ में περιτίθημι किसी व्यक्ति पर वस्त्र डालने या उसके चारों ओर रखने को दर्शाता है। ‘पहनाया’ हिन्दी में स्वाभाविक है और क्रिया का आशय ठीक से व्यक्त करता है।
- source_word: καὶ
  choice: और
  rationale: καί का सीधा संयोजक अर्थ ‘और’ है; इससे यूनानी कथन का प्रवाह सुरक्षित रहता है।
theological_decisions:
- issue: उपहास के दृश्य में वस्त्र का स्वरूप
  choice: सुर्ख लाल चोगा
  alternative: सुर्ख लाल बाहरी वस्त्र
  rationale: ‘चोगा’ यूनानी वस्त्र-शब्द का ठोस और स्वाभाविक प्रतिरूप है। यह सैनिकों द्वारा यीशु को उपहासपूर्वक सजाने के दृश्य को व्यक्त करता है, पर वस्त्र को अनावश्यक रूप से औपचारिक राजकीय पोशाक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘सुर्ख लाल’ रंग की जीवंतता रखता है, जबकि ‘चोगा’ सामान्य पाठक के लिए समझने योग्य बाहरी वस्त्र का नाम है।
