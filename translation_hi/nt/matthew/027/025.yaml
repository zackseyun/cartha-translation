  naturalness: The revised Hindi is natural, concise, and suitably dignified. ‘उसका खून हम पर और हमारे बच्चों पर हो’ is an idiomatic, forceful rendering of the verbless imprecatory statement without replacing its concrete imagery with an interpretation.
  terminology: ‘खून’ appropriately retains αἷμα’s concrete wording and its implicit judicial resonance. ‘बच्चों’ accurately renders τέκνα without broadening it to descendants. The cultural footnote responsibly limits a transhistorical anti-Jewish misuse while leaving the verse’s immediate collective statement intact.
