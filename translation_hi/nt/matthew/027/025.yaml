  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: hi
  text: और सभी लोगों ने उत्तर दिया[a], “उसका खून हम पर और हमारे बच्चों पर हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, इस दृश्य में एकत्रित होकर बोलने वाले लोग; इन शब्दों को हर पीढ़ी के सभी यहूदियों पर स्थायी दोष लगाने वाला कथन नहीं समझना चाहिए।
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: उत्तर दिया
  rationale: ἀποκρίνομαι का कृदंत εἶπεν के साथ मिलकर मुहावरेदार ढंग से प्रतिक्रिया सूचित करता है; आधुनिक हिन्दी में इसे सहज रूप से ‘उत्तर दिया’ कहना उचित है।
- source_word: πᾶς ὁ λαὸς
  choice: वहाँ उपस्थित सभी लोगों
  rationale: वाक्यांश का सामूहिक बल ‘सभी लोगों’ से बना रहता है। ‘वहाँ उपस्थित’ प्रसंग में एकत्र लोगों की ओर संकेत स्पष्ट करता है और इसे समस्त यहूदी समुदाय या भावी पीढ़ियों पर लागू करने वाली जातीय घोषणा बनने से रोकता है, बिना मूल कथन के सामूहिक स्वर को मिटाए।
- source_word: Τὸ αἷμα αὐτοῦ
  choice: उसका खून
  rationale: न्यायिक प्रसंग में ‘खून’ उसकी मृत्यु के उत्तरदायित्व का संकेत देता है, पर मुख्य पाठ में इस निहितार्थ को व्याख्यात्मक रूप से नहीं खोला गया है। ‘रक्त’ की तुलना में ‘खून’ सामान्य आधुनिक हिन्दी में अधिक स्वाभाविक और प्रत्यक्ष है।
- source_word: ἐφ’ ἡμᾶς
  choice: हम पर ... हो
  rationale: यूनानी वाक्य में क्रिया व्यक्त नहीं है; हिन्दी में जोड़ा गया ‘हो’ उसके स्वीकारात्मक अथवा आत्म-आह्वानात्मक बल को सुरक्षित रखता है।
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: और हमारे बच्चों पर
  rationale: τέκνα का सीधा अर्थ ‘बच्चे’ है; ‘वंशज’ अर्थ को अनावश्यक रूप से अधिक पीढ़ियों तक विस्तृत कर देता। समानांतरता बनाए रखने के लिए ‘पर’ दोहराया गया है।
theological_decisions:
- issue: πᾶς ὁ λαὸς को यहूदी-विरोधी या सर्वकालिक सामूहिक दोष के रूप में पढ़े जाने की संभावना
  choice: इसे दृश्य में एकत्र उपस्थित लोगों का सामूहिक उत्तर माना गया है।
  alternative: ‘सारी भीड़’ अथवा बिना प्रसंग-स्पष्टीकरण के ‘सभी लोग’
  rationale: मूल पाठ तत्काल कथात्मक समूह का उत्तर बताता है; वह सभी स्थानों और पीढ़ियों के यहूदियों पर स्थायी दोष घोषित नहीं करता। मुख्य पाठ सामूहिक कथन को बनाए रखता है और पादटिप्पणी उसके अनुचित विस्तार को रोकती है।
- issue: ‘उसका खून हम पर हो’ का न्यायिक अर्थ
  choice: मुहावरे को ज्यों का त्यों रखा गया है, ताकि मृत्यु के उत्तरदायित्व का निहितार्थ पाठक तक पहुँचे पर उसे मुख्य पाठ में खुली व्याख्या में न बदला जाए।
  alternative: ‘उसकी मृत्यु का दोष हम पर हो’
  rationale: व्याख्यात्मक विकल्प अर्थ स्पष्ट करता, लेकिन αἷμα की ठोस और धर्मवैचारिक रूप से तनावपूर्ण भाषा को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, स्वाभाविक और गरिमापूर्ण रखी गई है। ‘उत्तर दिया’ कथात्मक हिन्दी में सहज है। ‘वहाँ उपस्थित’ प्रसंगगत सीमा स्पष्ट करता है; पादटिप्पणी मूल कथन को बदले बिना संभावित यहूदी-विरोधी दुरुपयोग को रोकती है।
