base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: hi
  text: उसी प्रकार[a] प्रधान याजक भी शास्त्रियों और बुज़ुर्गों के साथ मिलकर उसका उपहास करते हुए कह रहे थे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसी तरह प्रधान याजक भी शास्त्रियों और बुज़ुर्गों के साथ मिलकर उसका उपहास कर रहे थे और कह रहे थे,”
    reason: ὁμοίως तथा कृदंत ἐμπαίζοντες को अधिक स्पष्ट, वैकल्पिक वाक्य-संरचना में दिखाने के लिए।
lexical_decisions:
- source_word: ὁμοίως
  choice: उसी प्रकार
  rationale: यह पिछले पदों में हुए उपहास से समानता दर्शाता है और यूनानी क्रियाविशेषण की तुलनात्मक शक्ति बनाए रखता है।
- source_word: καὶ
  choice: भी
  rationale: यह प्रधान याजकों को पहले बताए गए उपहास करने वालों में जोड़ता है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: बहुवचन में यह अगुवे याजकीय अधिकारियों के लिए प्रचलित और सटीक पद है।
- source_word: ἐμπαίζοντες
  choice: उसका उपहास करते हुए
  rationale: कृदंत तिरस्कारपूर्ण उपहास की साथ-साथ चल रही क्रिया बताता है; संदर्भ से कर्म यीशु है।
- source_word: μετὰ
  choice: के साथ मिलकर
  rationale: सम्बन्ध और साझा सहभागिता स्पष्ट करता है, केवल उपस्थिति नहीं।
- source_word: γραμματέων
  choice: शास्त्रियों
  rationale: सुसमाचारों के यहूदी सामाजिक-धार्मिक संदर्भ में γραμματεῖς का स्थापित हिन्दी समतुल्य है।
- source_word: πρεσβυτέρων
  choice: पुरनियों
  rationale: यह मान्यताप्राप्त यहूदी अगुवों के संस्थागत समूह को दर्शाता है, केवल अधिक आयु के पुरुषों को नहीं।
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल जारी या पुनरावृत्त वाणी का संकेत देता है; यह हिन्दी रूप उस पक्ष को स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: उपहास में सहभागी समूहों की पहचान
  choice: प्रधान याजक, शास्त्री और पुरनिये मिलकर यीशु का उपहास कर रहे थे।
  alternative: प्रधान याजक शास्त्रियों और पुरनियों की उपस्थिति में उपहास कर रहे थे।
  rationale: μετὰ के साथ सम्बन्धकारक कारक यहाँ केवल निकट उपस्थिति के बजाय साझा सहभागिता को अधिक स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। “प्रधान याजक,” “शास्त्री” और “पुरनिये” बाइबलीय-सामाजिक पदों की पहचान बनाए रखते हैं; वाक्य का अंतिम अल्पविराम अगले पद में आने वाले कथन से इसके सीधे जुड़ाव को दर्शाता है।
