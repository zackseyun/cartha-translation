  choice: मुख्य पाठ में ‘निन्दा कर रहे थे’
  alternative: ‘ईशनिन्दा कर रहे थे’ या ‘बुरा-भला कह रहे थे’
  rationale: यूनानी क्रिया साधारण उपहास से अधिक प्रबल है और किसी व्यक्ति के विरुद्ध अपमानजनक या बदनाम करनेवाली वाणी भी बता सकती है। ‘निन्दा’ इस प्रबलता को बचाती है, पर अनुवाद स्वयं यह धर्मवैज्ञानिक निष्कर्ष नहीं थोपता कि यहाँ शब्द केवल परमेश्वर के विरुद्ध ईशनिन्दा के संकीर्ण अर्थ में है। पाद-टिप्पणी वास्तविक अर्थ-विकल्प को सुरक्षित रखती है।
