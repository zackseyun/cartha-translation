- source_word: παραπορευόμενοι
  choice: पास से गुज़र रहे थे
  rationale: वर्तमान कृदन्त क्रूस पर चढ़ाए जाने के स्थान के पास से गुज़रते लोगों और जारी क्रिया को व्यक्त करता है।
- source_word: ἐβλασφήμουν
  choice: निन्दा कर रहे थे
  rationale: अपूर्ण भूतकाल जारी और बार-बार होनेवाली क्रिया को दर्शाता है। ‘निन्दा’ अपमानजनक और बदनाम करनेवाली वाणी का प्रबल भाव रखता है, जबकि ‘ईशनिन्दा’ हिन्दी में अर्थ को केवल परमेश्वर के विरुद्ध कथन तक अनावश्यक रूप से सीमित कर सकती है।
- source_word: αὐτὸν
  choice: उसकी
  rationale: सर्वनाम यीशु की ओर संकेत करता है; ‘निन्दा करना’ के साथ स्वाभाविक हिन्दी कारक-रचना में ‘उसकी’ आया है।
- source_word: κινοῦντες
  choice: हिला-हिलाकर
  rationale: यह मुख्य क्रिया के साथ-साथ होनेवाले उपहासपूर्ण संकेत को व्यक्त करता है। द्विरुक्ति उस जारी/दोहराए जाते हावभाव को सहज हिन्दी में दिखाती है।
- source_word: τὰς κεφαλὰς αὐτῶν
  choice: अपने सिर
  rationale: हिन्दी में प्रत्येक व्यक्ति के अपने सिर को हिलाने के लिए एकवचन ‘अपने सिर’ स्वाभाविक सामूहिक प्रयोग है; अर्थ में यूनानी बहुवचन का आशय बना रहता है।
