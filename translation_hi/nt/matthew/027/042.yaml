  edition: SBLGNT
  text: Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· ⸀βασιλεὺς Ἰσραήλ ἐστιν, καταβάτω νῦν ἀπὸ τοῦ σταυροῦ καὶ πιστεύσομεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: hi
  text: “इसने दूसरों को बचाया, पर अपने आप को नहीं बचा सकता। यह इस्राएल का राजा है; अब क्रूस पर से उतर आए, और हम इस पर विश्वास करेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄλλους ἔσωσεν
  choice: इसने दूसरों को बचाया
  rationale: Ἄλλους संज्ञा के रूप में प्रयुक्त बहुवचन है और ἔσωσεν सामान्य भूतकाल का कथन है। ‘बचाया’ छुटकारे और चंगाई सहित σῴζω की व्यापक अर्थ-सीमा बनाए रखता है।
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: पर अपने आप को नहीं बचा सकता
  rationale: ‘अपने आप को’ प्रतिवर्ती बल और ‘दूसरों’ के साथ व्यंग्यपूर्ण विरोध स्पष्ट रखता है; ‘नहीं बचा सकता’ δύναμαι और infinitive का स्वाभाविक हिन्दी रूप है। ‘पर’ यूनानी में निहित तीखे विरोध को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: βασιλεὺς Ἰσραήλ
  choice: इस्राएल का राजा
  rationale: यह सीधे कहा गया राजकीय पदनाम है। हिन्दी में ‘इस्राएल का राजा’ स्वाभाविक है और बिना स्पष्ट यूनानी आधार के ‘यदि’ नहीं जोड़ता।
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: अब क्रूस पर से उतर आए
  rationale: καταβάτω तीसरे पुरुष की आज्ञार्थक चुनौती है; ‘उतर आए’ आधुनिक हिन्दी में चुनौती का स्वाभाविक रूप है। νῦν के लिए ‘अब’ और ἀπὸ τοῦ σταυροῦ के लिए ‘क्रूस पर से’ स्थान-विच्छेद को स्पष्ट करते हैं।
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: तब हम इस पर विश्वास करेंगे
  rationale: πιστεύω ἐπί के साथ व्यक्ति की ओर निर्देशित विश्वास बताता है। ‘इस पर विश्वास करेंगे’ निकट उपस्थित यीशु के विषय में उपहासपूर्ण कथन की शैली बनाए रखता है; ‘तब’ चुनौती और कथित परिणाम के संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यीशु के राजकीय दावे का उपहासपूर्ण कथन
  choice: यह इस्राएल का राजा है
  alternative: यदि यह इस्राएल का राजा है
  rationale: यूनानी पाठ में वाक्य सीधे पदनाम कहता है और कोई स्पष्ट शर्तसूचक शब्द नहीं है। मुख्य पाठ में ‘यदि’ जोड़ने से मूल में निहित न होने वाली शर्त स्पष्ट हो जाएगी; वैकल्पिक शर्तसूचक समझ को पादटिप्पणी में रखा गया है।
- issue: πιστεύσομεν के साथ चुनौती का परिणाम
  choice: तब हम इस पर विश्वास करेंगे
  alternative: और हम इस पर विश्वास करेंगे
  rationale: यूनानी καί का मूल संयोजक बल ‘और’ है, पर आज्ञार्थक चुनौती के बाद भविष्यकालीन कथन हिन्दी में स्वाभाविक रूप से परिणामसूचक ‘तब’ बनता है। इससे वक्ताओं की उपहासपूर्ण प्रतिज्ञा बनी रहती है और कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। संवाद में ‘इसने/यह/इस पर’ का प्रयोग सामने उपस्थित व्यक्ति के विषय में उपहासपूर्ण बोलने की स्थिति को दर्शाता है। ‘क्रूस’ स्थापित बाइबलीय शब्दावली के रूप में रखा गया है।
