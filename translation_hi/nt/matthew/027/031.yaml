translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। पहले वाक्य में क्रियाओं का क्रम बनाए रखा गया है और दूसरे वाक्य से अंतिम कार्रवाई को स्पष्ट कथात्मक गति मिली है। पादटिप्पणी का चिह्न उसी शब्द ‘लबादा’ पर रखा गया है जिससे वह संबंधित है।
