source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν χλαμύδα καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ καὶ ἀπήγαγον αὐτὸν εἰς τὸ σταυρῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: hi
  text: और जब वे उसका उपहास कर चुके थे, तो उन्होंने वह लबादा[a] उसके ऊपर से उतार दिया और उसके अपने कपड़े उसे पहना दिए। फिर वे उसे क्रूस पर चढ़ाने के लिए ले चले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चोगा।’ यूनानी शब्द χλαμύς प्रायः किसी बाहरी ओढ़ने वाले वस्त्र, विशेषकर सैनिक या अधिकारी के लबादे, को दर्शाता है। यहाँ यह यीशु को उपहास के लिए पहनाया गया राजसी वेश का वस्त्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: उपहास कर चुके
  rationale: यह क्रिया तिरस्कारपूर्ण और क्रूर मज़ाक को व्यक्त करती है। ‘उपहास’ उस गंभीरता को बनाए रखता है, और ‘कर चुके’ ὅτε वाले काल-संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: χλαμύδα
  choice: लबादा
  rationale: χλαμύς एक बाहरी ओढ़ने वाले वस्त्र को दर्शाता है, जो प्रायः सैनिक या अधिकारी पहनते थे। ‘लबादा’ वस्तु के प्रकार को ‘राजसी वस्त्र’ जैसे अर्थ से अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: उन्होंने वह लबादा उसके ऊपर से उतार दिया
  rationale: ἐκδύω कपड़ा उतारने या किसी को उससे वंचित करने का अर्थ देता है। यह हिन्दी प्रयोग क्रिया की शक्ति और इस सकर्मक रचना, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: उसके अपने कपड़े उसे पहना दिए
  rationale: यह अनुवाद ἐνδύω के ‘पहनाना’ अर्थ, ἱμάτια के सामान्य ‘कपड़े’ अर्थ और αὐτοῦ के स्वामित्व को स्पष्ट रखता है; साथ ही अभी उतारे गए बनावटी राजसी लबादे से विरोध भी दिखाता है।
- source_word: ἀπήγαγον
  choice: ले गए
  rationale: ἀπάγω हिरासत में किसी को वहाँ से ले जाने या आगे ले चलने का भाव देता है। प्रसंग में ‘ले गए’ सहज और पर्याप्त रूप से स्पष्ट है।
- source_word: εἰς τὸ σταυρῶσαι
  choice: क्रूस पर चढ़ाने के लिए
  rationale: εἰς के साथ प्रयुक्त संज्ञार्थक infinitive उद्देश्य बताता है। यह हिन्दी वाक्यांश उस उद्देश्य को सीधे और स्वाभाविक रूप से व्यक्त करता है।
