    rationale: δέ is a mild connective and does not itself require an additive ‘also’ meaning. Hindi can represent the verse naturally without adding this implication.
  - severity: low
    issue: The prior draft’s split sentence and “सेवा करती हुई ... आई थीं” can make service sound only like a manner of their arrival.
    rationale: διακονοῦσαι describes the women’s service to Jesus broadly. Coordinating it as “और उसकी सेवा करती थीं” retains the ongoing descriptive force without unnecessarily restricting its temporal scope to the journey.
