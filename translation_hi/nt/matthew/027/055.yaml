source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ ἀπὸ μακρόθεν θεωροῦσαι, αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας διακονοῦσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: hi
  text: वहाँ बहुत-सी स्त्रियाँ दूर से देख रही थीं,[a] जो गलील से यीशु के पीछे आई थीं और उसकी सेवा करती थीं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूर से यह दृश्य देख रही थीं।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसकी सहायता करती थीं” या “उसकी सेवा-सुश्रूषा करती थीं।” यूनानी क्रिया व्यावहारिक सेवा, देखभाल या सहायता का बोध करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ
  choice: वहाँ ... भी थीं
  rationale: Ἦσαν और ἐκεῖ का स्वाभाविक हिन्दी रूप ‘वहाँ ... थीं’ है। हल्के संयोजक δέ को प्रसंगानुकूल ‘भी’ से व्यक्त किया गया है; इससे अनावश्यक प्रबल विरोध नहीं बनता।
- source_word: γυναῖκες πολλαὶ
  choice: बहुत-सी स्त्रियाँ
  rationale: यह संख्या और लिंग दोनों को सीधे, स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: दूर से देख रही थीं
  rationale: θεωροῦσαι निरंतर और ध्यानपूर्वक देखने का भाव रखता है; ‘देख रही थीं’ चालू क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और ἀπὸ μακρόθεν की स्थानगत दूरी बनाए रखता है।
- source_word: αἵτινες ἠκολούθησαν τῷ Ἰησοῦ
  choice: वे ... यीशु के पीछे आई थीं
  rationale: सम्बन्धवाचक खंड को दूसरे हिन्दी वाक्य में ‘वे’ से जोड़ा गया है। ‘पीछे आई थीं’ यीशु का अनुसरण करने और वर्तमान दृश्य से पहले आरम्भ हुई यात्रा, दोनों को स्पष्ट करता है।
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: गलील से
  rationale: यह उनके यीशु के साथ आने के भौगोलिक आरम्भ-बिंदु को यथावत रखता है।
- source_word: διακονοῦσαι αὐτῷ
  choice: यीशु की सेवा करती हुई
  rationale: ‘सेवा करती हुई’ व्यावहारिक देखभाल और सहायता सहित यूनानी क्रिया की व्यापकता बनाए रखता है, पर किसी औपचारिक कलीसियाई पद का अर्थ नहीं जोड़ता। स्पष्टता के लिए सर्वनाम के स्थान पर ‘यीशु’ दोहराया गया है।
theological_decisions:
- issue: स्त्रियों की भूमिका के लिए διακονοῦσαι का अनुवाद
  choice: यीशु की सेवा करती हुई
  alternative: उसकी देखभाल करती हुई / उसकी सहायता करती हुई
  rationale: ‘सेवा’ यूनानी शब्द के व्यापक अर्थ को बनाए रखती है और उसे न केवल घरेलू काम तक सीमित करती है, न किसी बाद के औपचारिक धार्मिक पद से जोड़ती है।
- issue: गलील से अनुसरण करने का कालगत सम्बन्ध
  choice: गलील से उसके पीछे आई थीं
  alternative: गलील से उसके पीछे आईं
  rationale: हिन्दी का पूर्ण भूतकाल यह स्पष्ट करता है कि उनका गलील से अनुसरण करना क्रूस के पास देखने के इस दृश्य से पहले आरम्भ हुआ था, जबकि यूनानी अओरिस्ट का मूल घटनात्मक अर्थ सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। लम्बे यूनानी सम्बन्धवाचक वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, पर सभी अर्थगत सम्बन्ध बनाए रखे गए हैं।
