  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शरीर’ मूल शब्द के निकट है, जबकि मृत्यु का संदर्भ पाठ से स्वयं स्पष्ट होता है। निष्क्रिय यूनानी रचना का आशय स्वाभाविक हिन्दी में व्यक्त किया गया है और शरीर किसे सौंपा जाना था, यह अनावश्यक रूप से मुख्य पाठ में नहीं जोड़ा गया।
