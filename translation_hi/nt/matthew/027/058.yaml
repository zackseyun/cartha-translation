lexical_decisions:
- source_word: οὗτος
  choice: वह
  rationale: यह संकेतवाचक सर्वनाम पिछले पद में बताए गए अरिमतिया के यूसुफ की ओर संकेत करता है; हिन्दी कथा-वर्णन में स्पष्ट संदर्भ होने पर ‘वह’ स्वाभाविक है।
- source_word: προσελθὼν
  choice: के पास गया
  rationale: कृदंत पिलातुस की ओर जाकर उसके सामने उपस्थित होने की पूर्ववर्ती क्रिया बताता है; ‘के पास गया’ सहज आधुनिक हिन्दी है।
- source_word: ᾐτήσατο
  choice: माँगा
  rationale: मध्यवाच्य रूप यहाँ किसी वस्तु को पाने का अनुरोध करने के अर्थ में है; ‘शरीर माँगा’ हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: यीशु का शरीर
  rationale: σῶμα का सीधा अर्थ ‘शरीर’ है। प्रसंग से उसकी मृत्यु स्पष्ट है, इसलिए अधिक नैदानिक ‘लाश’ या अर्थ को संकुचित करने वाले ‘शव’ की आवश्यकता नहीं है।
- source_word: τότε
  choice: तब
  rationale: यह घटनाक्रम में अगली क्रिया को चिह्नित करता है; ‘तब’ इसका संक्षिप्त और स्वाभाविक हिन्दी समकक्ष है।
- source_word: ἐκέλευσεν
  choice: आदेश दिया
  rationale: क्रिया किसी अधिकारयुक्त आदेश को व्यक्त करती है; पिलातुस के प्रशासनिक निर्णय के संदर्भ में ‘आदेश दिया’ उपयुक्त है।
- source_word: ἀποδοθῆναι
  choice: सौंप देने
  rationale: निष्क्रिय अनंत क्रिया शरीर को दे दिए जाने या हस्तांतरित किए जाने को व्यक्त करती है। हिन्दी की ‘शरीर सौंप देने का आदेश दिया’ रचना स्वाभाविक है, प्राप्तकर्ता को अनावश्यक रूप से स्पष्ट नहीं करती और हस्तांतरण का भाव बनाए रखती है।
