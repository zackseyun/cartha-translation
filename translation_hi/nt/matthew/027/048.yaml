language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: hi
  text: और तुरन्त उनमें से एक दौड़ा, एक स्पंज लिया, उसे खट्टे दाखरस में भिगोया, सरकंडे पर लगाया और उसे पिलाता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: तुरन्त
  rationale: यह तत्काल और शीघ्र हुई क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δραμὼν
  choice: दौड़ा
  rationale: यूनानी कृदन्त को हिन्दी कथन-प्रवाह में समापिका क्रिया के रूप में रखना स्वाभाविक है और क्रिया की तत्परता बनाए रखता है।
- source_word: εἷς ἐξ αὐτῶν
  choice: उनमें से एक
  rationale: यह अंशवाचक यूनानी अभिव्यक्ति का सहज और सटीक हिन्दी रूप है।
- source_word: λαβὼν σπόγγον
  choice: उसने एक स्पंज लिया
  rationale: यह क्रियाओं के क्रम को स्पष्ट और आधुनिक हिन्दी में सहज रखता है।
- source_word: πλήσας τε ὄξους
  choice: उसे खट्टी दाखमधु से भरा
  rationale: ὄξος खट्टी हो चुकी दाखमधु अथवा दाखमधु के सिरके को सूचित कर सकता है; मुख्य पाठ में 'खट्टी दाखमधु' पेय के स्वरूप को आधुनिक पाठक के लिए अधिक स्पष्ट करता है।
- source_word: περιθεὶς καλάμῳ
  choice: सरकंडे पर लगाया
  rationale: κάλαμος का सीधा अर्थ सरकंडा है; यहाँ स्पंज को उस पर लगाने का भाव है।
- source_word: ἐπότιζεν αὐτόν
  choice: उसे पिलाने लगा
  rationale: अपूर्ण भूतकाल क्रिया की जारी अथवा आरम्भ होकर चल रही प्रकृति को दर्शा सकता है; 'पिलाने लगा' हिन्दी में इसे सहजता से व्यक्त करता है, बिना यह निश्चित किए कि उसने कितना पिया।
theological_decisions:
- issue: यीशु को दिए गए पेय का स्वरूप
  choice: खट्टी दाखमधु
  alternative: सिरका / दाखमधु का सिरका
  rationale: ὄξος का अर्थ खट्टी दाखमधु या दाखमधु का सिरका हो सकता है। 'खट्टी दाखमधु' इसे पीने योग्य अम्लीय पेय के रूप में स्पष्ट करती है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: ἐπότιζεν की पक्षगत बारीकी
  choice: पिलाने लगा
  alternative: पिलाया / पिलाता रहा
  rationale: अपूर्ण भूतकाल को केवल पूर्ण हुई एकबारगी क्रिया मानने के बजाय उसके प्रगतिशील अथवा आरम्भिक भाव को रखा गया है; साथ ही 'पिलाता रहा' से उत्पन्न होने वाले अनावश्यक पुनरावृत्ति-बोध से बचा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। यूनानी के कृदन्तों की शृंखला को स्वाभाविक हिन्दी क्रियाओं में बदला गया है, जबकि अंतिम अपूर्ण भूतकाल के पक्षगत भाव को 'पिलाने लगा' से व्यक्त किया गया है।
