  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ऐतिहासिक शब्द ‘प्रेटोरियम’ और ‘कोहोर्ट’ उनकी रोमी सांस्कृतिक विशिष्टता के कारण मुख्य पाठ में रखे गए हैं तथा पादटिप्पणियों में समझाए गए हैं। यीशु के लिए आदरसूचक बहुवचन सर्वनाम का प्रयोग किया गया है।
