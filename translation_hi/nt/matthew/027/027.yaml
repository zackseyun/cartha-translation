id: MAT.27.27
reference: Matthew 27:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: hi
  text: तब राज्यपाल के सैनिक यीशु को प्रेटोरियम[a] में ले गए और पूरी कोहोर्ट को उनके चारों ओर इकट्ठा किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राज्यपाल के मुख्यालय में।” यूनानी शब्द रोमी राज्यपाल के सरकारी निवास या सैन्य मुख्यालय के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: “कोहोर्ट” रोमी सेना की एक इकाई का नाम है; यहाँ इसका आशय सैनिकों की उस इकाई से हो सकता है, न कि अनिवार्य रूप से यह कि पूरी निर्धारित संख्या में हर सैनिक वहाँ उपस्थित था।
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह घटनाक्रम में अगले प्रसंग को स्वाभाविक और संक्षिप्त ढंग से जोड़ता है।
- source_word: στρατιῶται τοῦ ἡγεμόνος
  choice: राज्यपाल के सैनिक
  rationale: यह संबंधसूचक पदबंध को सहज आधुनिक हिन्दी में व्यक्त करता है और रोमी शासकीय संदर्भ बनाए रखता है।
- source_word: ἡγεμόνος
  choice: राज्यपाल
  rationale: इस प्रसंग में शब्द रोमी प्रांतीय शासक को सूचित करता है; ‘राज्यपाल’ सामान्य पाठक के लिए स्पष्ट है और मूल शब्द से अधिक विशिष्ट पदनाम नहीं थोपता।
- source_word: παραλαβόντες
  choice: ले गए
  rationale: कृदन्त को हिन्दी के स्वाभाविक क्रमबद्ध क्रियारूप में बदला गया है; इससे यीशु को अपने साथ भीतर ले जाने का भाव व्यक्त होता है।
- source_word: εἰς τὸ πραιτώριον
  choice: प्रेटोरियम में
  rationale: ऐतिहासिक रोमी शब्द की विशिष्टता बनाए रखने के लिए लिप्यंतरण रखा गया है और अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: συνήγαγον ἐπ’ αὐτὸν
  choice: उनके चारों ओर इकट्ठा किया
  rationale: संदर्भ में सैनिकों के यीशु के पास आकर उन्हें घेरने का भाव सबसे स्वाभाविक है; हिन्दी में सकर्मक रचना मूल क्रिया और उसके कर्म को बनाए रखती है।
- source_word: ὅλην τὴν σπεῖραν
  choice: पूरी कोहोर्ट
  rationale: ‘कोहोर्ट’ रोमी सैन्य इकाई के तकनीकी अर्थ को सुरक्षित रखता है और ‘पूरी’ ὅλην को व्यक्त करता है; संभावित सांस्कृतिक गलतफहमी पादटिप्पणी में स्पष्ट है।
