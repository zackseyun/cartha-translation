  text: ⸀ἔφη αὐτοῖς ὁ Πιλᾶτος· Ἔχετε κουστωδίαν· ὑπάγετε ἀσφαλίσασθε ὡς οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: hi
  text: पिलातुस ने उनसे कहा, “तुम्हारे पास पहरेदारों की टुकड़ी है।[a] जाओ, अपनी समझ के अनुसार उसे सुरक्षित कर दो।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहरेदारों की टुकड़ी ले जाओ,” अथवा संभवतः “तुम्हारे अपने पहरेदार हैं।” यूनानी वाक्य का अर्थ यह हो सकता है कि पिलातुस उन्हें पहरेदार दे रहा था, या यह कि उनके पास पहरेदार पहले से उपलब्ध थे।
    reason: alternative_reading
  - marker: b
    text: या “जाओ और उसे जितना सुरक्षित कर सकते हो, कर दो।”
    reason: previous_rendering
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: ने उनसे कहा
  rationale: सामान्य कथात्मक अभिव्यक्ति; αὐτοῖς को अप्रत्यक्ष कर्म के रूप में स्पष्ट रखता है।
- source_word: Ἔχετε
  choice: तुम्हारे पास … है
  rationale: वर्तमान निर्देशार्थक रूप का सीधा अर्थ रखता है, जबकि प्रसंग में अनुमति देने या पहले से उपलब्ध पहरे का संकेत—दोनों संभावनाएँ बनी रहती हैं।
- source_word: κουστωδίαν
  choice: पहरेदारों की टुकड़ी
  rationale: लातीनी मूल का यह शब्द किसी एक पहरेदार के बजाय पहरा देने वाले दल को सूचित करता है; आधुनिक हिन्दी में यह अर्थ स्पष्ट है।
- source_word: ὑπάγετε
  choice: जाओ
  rationale: प्रस्थान की आज्ञा का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: ἀσφαλίσασθε
  choice: सुरक्षित कर दो
  rationale: मध्यवाच्य आज्ञार्थक का प्रसंगानुकूल अर्थ है किसी वस्तु को सुरक्षित करना; हिन्दी में स्वाभाविक आज्ञा।
- source_word: ὡς οἴδατε
  choice: अपनी समझ के अनुसार
  rationale: उनके अपने ज्ञान या तरीके के अनुसार कार्य करने का भाव रखता है, बिना इसे ‘जितना संभव हो’ कहकर क्षमता तक सीमित किए।
theological_decisions:
- issue: क्या पिलातुस रोमी पहरेदार दे रहा है या पहले से उपलब्ध पहरेदारों की ओर संकेत कर रहा है
  choice: मुख्य पाठ में “तुम्हारे पास पहरेदारों की टुकड़ी है”
  alternative: “पहरेदारों की टुकड़ी ले जाओ” अथवा “तुम्हारे अपने पहरेदार हैं”
  rationale: Ἔχετε को कथन या अनुमति/आदेश—दोनों रूपों में समझा जा सकता है। मुख्य पाठ निकटतम शाब्दिक अर्थ रखता है और टिप्पणी ऐतिहासिक पहचान को अनावश्यक रूप से तय किए बिना विकल्प बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। मुख्य पाठ में अस्पष्ट सर्वनाम के स्थान पर प्रसंगगत ‘कब्र’ रखा गया है; टिप्पणी में अधिक निकटवर्ती सर्वनाम वाला रूप दिया गया है। ‘पहरेदारों की टुकड़ी’ κουστωδίαν के सामूहिक अर्थ को स्पष्ट करती है।
