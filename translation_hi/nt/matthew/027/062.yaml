  yaml_path: translation/nt/matthew/027/062.yaml
  text: On the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
translation:
  language: hi
  text: अगले दिन[a], जो तैयारी के दिन के बाद था, प्रधान याजक और फरीसी पिलातुस के पास इकट्ठे हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तैयारी के बाद था।” यूनानी शब्द सब्त से पहले के तैयारी-दिन को सूचित कर सकता है; मुख्य पाठ में इसका अनुवाद “शुक्रवार” करना मूल पाठ की अपेक्षा अधिक व्याख्यात्मक होता।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: अगले दिन
  rationale: यह यूनानी मुहावरा समय की अगली अवस्था बताता है। δέ का हल्का संयोजक भाव हिन्दी वाक्य-प्रवाह में अलग शब्द जोड़े बिना स्वाभाविक रूप से व्यक्त हो जाता है।
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: अर्थात तैयारी के दिन के बाद
  rationale: ἥτις यहाँ व्याख्यात्मक संबंधवाचक खंड आरम्भ करता है। ‘अर्थात’ इस स्पष्टीकरण को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παρασκευήν
  choice: तैयारी का दिन
  rationale: यह शब्द सामान्यतः ‘तैयारी’ कह सकता है, पर इस यहूदी काल-संदर्भ में प्रायः सब्त से पहले के तैयारी-दिन को सूचित करता है। ‘शुक्रवार’ कहना मूल से अधिक व्याख्यात्मक होता।
- source_word: συνήχθησαν
  choice: इकट्ठे हुए
  rationale: रूप निष्क्रिय होते हुए भी यहाँ अकर्मक अर्थ में है—लोग एक साथ जमा हुए। यह हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: बहुवचन पद प्रमुख याजकीय अधिकारियों को दर्शाता है, न कि अनेक महायाजकों को; ‘प्रधान याजक’ स्थापित और स्पष्ट हिन्दी अभिव्यक्ति है।
- source_word: οἱ Φαρισαῖοι
  choice: फरीसी
  rationale: यह यहूदी समूह के नाम का हिन्दी में प्रचलित लिप्यंतरण है।
- source_word: πρὸς Πιλᾶτον
  choice: पिलातुस के पास
  rationale: πρός व्यक्ति के साथ यहाँ उसकी ओर जाने या उसके समक्ष उपस्थित होने का भाव रखता है। ‘के पास’ दोनों को सहज रूप से समेटता है और अनावश्यक न्यायिक अर्थ नहीं जोड़ता।
- source_word: Πιλᾶτον
  choice: पिलातुस
  rationale: Πιλᾶτος नाम का हिन्दी बाइबलीय परंपरा में प्रचलित रूप।
