id: MAT.27.29
reference: Matthew 27:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ καὶ κάλαμον ⸂ἐν τῇ δεξιᾷ⸃ αὐτοῦ, καὶ γονυπετήσαντες ἔμπροσθεν αὐτοῦ ⸀ἐνέπαιξαν αὐτῷ λέγοντες· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/029.yaml
  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: hi
  text: और काँटों का मुकुट गूँथकर उन्होंने उसके सिर पर रखा और उसके दाहिने हाथ में एक सरकंडा रखा। फिर उसके सामने घुटने टेककर उन्होंने उसका उपहास किया और कहा, “यहूदियों के राजा[a], जय हो!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया-वासियों के राजा।” यूनानी शब्द Ἰουδαίων यहूदियों अथवा यहूदिया-वासियों, दोनों को सूचित कर सकता है; यहाँ यह यीशु के विरुद्ध प्रयुक्त उपहासपूर्ण राजकीय उपाधि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πλέξαντες
  choice: गूँथकर
  rationale: यह क्रिया काँटों को आपस में मोड़कर मुकुट बनाने की क्रिया और मुख्य घटना से पहले उसका पूरा होना, दोनों स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: काँटों का मुकुट
  rationale: στέφανος का मूल अर्थ माला या मुकुट हो सकता है; यहाँ राजत्व के उपहास के संदर्भ में “मुकुट” उपयुक्त है और ἐξ ἀκανθῶν उसकी सामग्री बताता है।
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: उन्होंने उसके सिर पर रखा
  rationale: मूल के सरल और प्रत्यक्ष कार्य-वर्णन को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: κάλαμον
  choice: एक सरकंडा
  rationale: κάλαμος का ठोस अर्थ सरकंडा है। इसे “राजदंड” कहना प्रसंग का निहित संकेत स्पष्ट तो करता, पर मूल से अधिक व्याख्यात्मक होता।
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: उसके दाहिने हाथ में
  rationale: दत्तिव पदबंध वस्तु को यीशु के दाहिने हाथ में रखे जाने का स्थान बताता है; हिन्दी में यही स्वाभाविक अभिव्यक्ति है।
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: उसके सामने घुटने टेककर
  rationale: सैनिकों द्वारा किए गए नकली राजकीय सम्मान की मुद्रा को संक्षिप्त और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐνέπαιξαν αὐτῷ
  choice: उन्होंने उसका उपहास किया
  rationale: ἐμπαίζω यहाँ तिरस्कारपूर्ण मज़ाक को दर्शाता है; “उपहास किया” कथा के गरिमापूर्ण किंतु सुबोध स्तर के अनुकूल है।
- source_word: Χαῖρε
  choice: जय हो
  rationale: यहाँ सामान्य अभिवादन नहीं, राजा को संबोधित व्यंग्यपूर्ण अभिनंदन है। “जय हो” राजकीय उद्घोष और उसकी विडंबना दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: यहूदियों के राजा
  rationale: संबोधन कारक को हिन्दी में सीधे संबोधन से व्यक्त किया गया है। Ἰουδαίων यहाँ प्रचलित जातीय-धार्मिक अर्थ “यहूदियों” में स्वाभाविक है, जबकि क्षेत्रीय अर्थ की संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: व्यंग्यपूर्ण राजकीय अभिनंदन में निहित विडंबना
  choice: “यहूदियों के राजा, जय हो!”
  alternative: “यहूदियों के राजा, प्रणाम!”
  rationale: “जय हो” Χαῖρε के औपचारिक राजकीय अभिनंदन को दर्शाता है और सैनिकों के उपहास तथा यीशु की राजकीय उपाधि के बीच के तनाव को बिना समझाए सुरक्षित रखता है।
- issue: Ἰουδαίων का अर्थ-क्षेत्र
  choice: “यहूदियों”
  alternative: “यहूदिया-वासियों”
  rationale: दुःखभोग-वृत्तांत की इस राजकीय उपाधि में व्यापक जातीय-धार्मिक अर्थ अधिक स्वाभाविक है; फिर भी यूनानी शब्द की क्षेत्रीय संभावना को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सुबोध, गरिमापूर्ण कथात्मक स्तर रखा गया है। “सरकंडा” मूल चित्र को बनाए रखता है और “जय हो” सैनिकों के नकली राजकीय अभिनंदन को स्वाभाविक हिन्दी में व्यक्त करता है। पादटिप्पणी-चिह्न उसी पद “यहूदियों” के साथ लगाया गया है जिससे वह वास्तव में संबंधित है।
