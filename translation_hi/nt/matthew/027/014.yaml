  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पर’ पिछले पद से विरोधात्मक संबंध बनाए रखता है; ‘एक शब्द का भी’ यूनानी के बलपूर्ण निषेध को सुरक्षित रखता है।
