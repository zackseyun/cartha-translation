source:
  edition: SBLGNT
  text: καὶ οὐκ ἀπεκρίθη αὐτῷ πρὸς οὐδὲ ἓν ῥῆμα, ὥστε θαυμάζειν τὸν ἡγεμόνα λίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: hi
  text: पर उसने उसे एक शब्द का भी उत्तर नहीं दिया[a], जिससे राज्यपाल को बहुत आश्चर्य हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने एक भी शब्द कहकर उसे उत्तर नहीं दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: उसने उसे ... उत्तर नहीं दिया
  rationale: ἀποκρίνομαι यहाँ ‘उत्तर देना’ के अर्थ में है, और αὐτῷ उत्तर पाने वाले व्यक्ति, अर्थात् संदर्भ में पिलातुस, को दर्शाता है। हिंदी में यह रचना सीधी और स्वाभाविक है।
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: एक शब्द का भी
  rationale: οὐδὲ ἕν का बलपूर्ण निषेध ‘एक ... भी नहीं’ से सुरक्षित रहता है। ῥῆμα का सामान्य अर्थ यहाँ ‘शब्द/कथन’ है; ‘एक शब्द का भी उत्तर नहीं’ स्वाभाविक हिंदी में पूर्ण मौन को व्यक्त करता है।
- source_word: ὥστε
  choice: जिससे
  rationale: ὥστε परिणाम बताता है। ‘जिससे’ यीशु के उत्तर न देने और राज्यपाल की प्रतिक्रिया के बीच परिणाम-संबंध को सहज हिंदी में व्यक्त करता है।
- source_word: θαυμάζειν
  choice: आश्चर्य हुआ
  rationale: परिणामवाचक रचना में infinitive को हिंदी की सीमित क्रिया के रूप में देना आवश्यक है। ‘आश्चर्य हुआ’ यहाँ स्वाभाविक है और विस्मय की प्रतिक्रिया व्यक्त करता है।
- source_word: τὸν ἡγεμόνα
  choice: राज्यपाल को
  rationale: रोमी प्रांतीय संदर्भ में ἡγεμών पिलातुस के सरकारी पद को सूचित करता है; ‘राज्यपाल’ सटीक और प्रचलित हिंदी पद है।
- source_word: λίαν
  choice: बहुत
  rationale: λίαν तीव्र मात्रा दर्शाता है। ‘बहुत’ साधारण आधुनिक हिंदी में इसका स्वाभाविक और स्पष्ट रूप है।
theological_decisions: []
