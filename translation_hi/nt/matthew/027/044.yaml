  text: τὸ δ’ αὐτὸ καὶ οἱ λῃσταὶ οἱ συσταυρωθέντες ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/044.yaml
  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: hi
  text: इसी तरह वे लुटेरे भी, जिन्हें उसके साथ क्रूस पर चढ़ाया गया था, उसका अपमान कर रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसे बुरा-भला कह रहे थे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: इसी तरह
  rationale: यह यूनानी मुहावरा यहाँ क्रियाविशेषण के रूप में पिछले पदों में बताए गए उपहास की ओर संकेत करता है; ‘इसी तरह’ आधुनिक हिन्दी में स्वाभाविक रूप से वही भाव व्यक्त करता है।
- source_word: καὶ
  choice: भी
  rationale: यहाँ καί उन लुटेरों को पहले बताए गए उपहास करने वालों में सम्मिलित करता है। हिन्दी में ‘भी’ इस अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है; शब्दक्रम में यह हल्का बल भी बनाए रखता है।
- source_word: λῃσταὶ
  choice: लुटेरे
  rationale: λῃστής का सामान्य अर्थ लूटपाट करने वाला या डाकू है। ‘लुटेरे’ स्पष्ट है और किसी विशेष राजनीतिक पहचान को अनावश्यक रूप से नहीं जोड़ता।
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: जिन्हें उसके साथ क्रूस पर चढ़ाया गया था
  rationale: यह विशेषणात्मक कृदंत उन लुटेरों की पहचान करता है जिन्हें यीशु के साथ क्रूस पर चढ़ाया गया था। अनुवाद मूल के कर्मवाच्य और मुख्य क्रिया से पहले हुई घटना को स्वाभाविक हिन्दी में रखता है।
- source_word: ὠνείδιζον
  choice: अपमान कर रहे थे
  rationale: अपूर्ण भूतकाल उस समय जारी या दोहराई जा रही क्रिया दिखाता है। ‘अपमान कर रहे थे’ साधारण आधुनिक हिन्दी में इस निरंतरता को बनाए रखता है।
- source_word: αὐτόν
  choice: उसका
  rationale: सर्वनाम यीशु की ओर संकेत करता है और ‘अपमान करना’ के साथ स्वाभाविक हिन्दी में संबंधकारक रूप लेता है।
theological_decisions:
- issue: लूका के वृत्तांत में एक अपराधी के भिन्न व्यवहार के साथ सामंजस्य बैठाना
  choice: 'मत्ती के बहुवचन कथन को बिना नरम किए रखा गया है: लुटेरे उसका अपमान कर रहे थे।'
  alternative: बहुवचन को अस्पष्ट या एकवचन-सदृश बनाकर सुसमाचार-वृत्तांतों के बीच दिखाई देने वाले तनाव को कम करना।
  rationale: मूल यूनानी में ‘लुटेरे’ बहुवचन है और क्रिया भी बहुवचन में है। अनुवाद मत्ती के अपने कथन को सुरक्षित रखता है और दूसरे वृत्तांत के आधार पर उसे चुपचाप नहीं बदलता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘क्रूस पर चढ़ाया गया’ परिचित बाइबलीय अभिव्यक्ति है; शेष वाक्य सामान्य पाठक के लिए सीधा रखा गया है।
