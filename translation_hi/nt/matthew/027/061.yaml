  text: ἦν δὲ ἐκεῖ ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία καθήμεναι ἀπέναντι τοῦ τάφου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/061.yaml
  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: hi
  text: मरियम मगदलीनी और दूसरी मरियम वहाँ कब्र के सामने बैठी थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν ... ἐκεῖ
  choice: वहाँ ... थीं
  rationale: यूनानी क्रिया एकवचन है, पर उसके बाद दो समन्वित स्त्रीवाचक कर्ता आते हैं; स्वाभाविक हिन्दी में बहुवचन स्त्रीलिंग ‘थीं’ अर्थ को ठीक व्यक्त करता है।
- source_word: δὲ
  choice: (अलग शब्द के रूप में अनूदित नहीं)
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है। हिन्दी में प्रसंग-परिवर्तन बिना किसी आरंभिक संयोजक के स्वाभाविक है; ‘परन्तु’ अनावश्यक विरोध उत्पन्न करता।
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: मरियम मगदलीनी
  rationale: व्यक्ति के लिए हिन्दी बाइबिलीय परंपरा में परिचित और आधुनिक पाठकों के लिए स्पष्ट रूप।
- source_word: ἡ ἄλλη Μαρία
  choice: दूसरी मरियम
  rationale: ἄλλη पहले उल्लिखित मरियम से इस मरियम को अलग पहचान देता है; ‘दूसरी मरियम’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: καθήμεναι
  choice: बैठी थीं
  rationale: वर्तमान कृदंत दोनों स्त्रियों की उस समय जारी मुद्रा को बताता है; संयुक्त क्रियात्मक रूप हिन्दी में स्वाभाविक है।
- source_word: ἀπέναντι
  choice: के सामने
  rationale: यह स्थानगत अर्थ ‘सामने/आमने-सामने की ओर’ व्यक्त करता है। ‘के सामने’ सामान्य आधुनिक हिन्दी में स्पष्ट है और अनावश्यक रूप से यह नहीं बताता कि बीच में कोई मार्ग या दूरी थी।
- source_word: τοῦ τάφου
  choice: कब्र
  rationale: यहाँ τάφος यीशु के दफनाए जाने के स्थान को दर्शाता है। ‘कब्र’ आधुनिक हिन्दी में सहज और संदर्भानुकूल है; ‘समाधि’ भारतीय धार्मिक अर्थछाया ला सकती है।
theological_decisions: []
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण मानक हिन्दी। यूनानी वाक्यक्रम की कठोर नकल के बजाय दो स्त्रियों की उपस्थिति और उनकी मुद्रा को स्वाभाविक हिन्दी वाक्य में रखा गया है।
