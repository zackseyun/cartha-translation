  yaml_path: translation/nt/matthew/027/004.yaml
  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: hi
  text: उसने कहा, “मैंने एक निर्दोष व्यक्ति को पकड़वाकर पाप किया है[a]।” पर उन्होंने कहा, “इससे हमें क्या? तुम ही देखो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “निर्दोष रक्त को सौंपकर।”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम ही इससे निपटो”; यह दायित्व झटकने वाली रूखी बात है, अर्थात, “यह तुम्हारी ज़िम्मेदारी है।”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: मैंने … पाप किया है
  rationale: यूनानी एओरिस्ट यहाँ यहूदा की स्वीकारोक्ति व्यक्त करता है। हिन्दी में पूर्ण वर्तमान उसके किए हुए पाप और वर्तमान दोषबोध—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: παραδοὺς
  choice: पकड़वाकर
  rationale: παραδίδωμι का मूल भाव किसी को अधिकारियों के हाथ सौंपना है; प्रसंग में यह विश्वासघातपूर्ण ढंग से पकड़वाने को दर्शाता है। ‘पकड़वाकर’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: αἷμα ἀθῷον
  choice: एक निर्दोष को
  rationale: ‘निर्दोष रक्त’ यूनानी और बाइबलीय प्रयोग में निर्दोष व्यक्ति अथवा उसके जीवन का संकेत है। हिन्दी में ‘एक निर्दोष को’ उस आशय को सहज बनाता है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है; ‘यीशु’ नहीं जोड़ा गया, क्योंकि मूल में नाम निहित है।
- source_word: Τί πρὸς ἡμᾶς;
  choice: इससे हमें क्या?
  rationale: यह उत्तर दायित्व और सरोकार को झटकने वाला संक्षिप्त मुहावरा है। चुना हुआ हिन्दी रूप यूनानी की तीक्ष्णता और संरचना दोनों को बनाए रखता है।
- source_word: σὺ ὄψῃ
  choice: तुम ही जानो
  rationale: 'शाब्दिक भविष्यकालीन रूप प्रसंग में आदेश-सदृश, रूखा उत्तर है: मामला तुम्हारा है, तुम उससे निपटो। ‘तुम ही जानो’ हिन्दी में उसी उपेक्षापूर्ण भाव को स्वाभाविक रूप से व्यक्त करता है।'
theological_decisions:
- issue: क्या ‘निर्दोष रक्त’ के व्यक्ति को स्पष्ट रूप से यीशु कहा जाए
  choice: नाम जोड़े बिना ‘एक निर्दोष’ रखना
  alternative: ‘यीशु को’ अथवा ‘एक निर्दोष मनुष्य को’
  rationale: मूल पाठ संदर्भित व्यक्ति का नाम नहीं देता। ‘यीशु’ जोड़ना प्रसंगानुसार सही होते हुए भी मूल की निहितता को समाप्त कर देता; ‘एक निर्दोष’ व्यक्ति और उसकी निर्दोषता स्पष्ट करता है, पर नाम नहीं जोड़ता।
- issue: σὺ ὄψῃ को भविष्यवाणी या दायित्व-सूचक झिड़की समझना
  choice: 'दायित्व झटकने वाली झिड़की: ‘तुम ही जानो’'
  alternative: 'शाब्दिक भविष्यकाल: ‘तुम देखोगे’'
  rationale: पूर्ववर्ती प्रश्न ‘इससे हमें क्या?’ के साथ यह वाक्यांश भविष्य की घटना बताने के बजाय यहूदा पर जिम्मेदारी डालता है। पादटिप्पणी में अधिक शाब्दिक तथा व्याख्यात्मक विकल्प दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘पकड़वाकर’ सामान्य पाठक के लिए बोधगम्य है और कथा में विश्वासघातपूर्वक अधिकारियों के हाथ सौंपने का भाव देता है। ‘तुम ही जानो’ याजकों के रूखे, उत्तरदायित्व-विमुख उत्तर को स्वाभाविक हिन्दी में व्यक्त करता है।
