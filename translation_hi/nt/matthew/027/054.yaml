id: MAT.27.54
reference: Matthew 27:54
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: hi
  text: जब सूबेदार और उसके साथ यीशु की रखवाली कर रहे लोगों ने भूकंप और जो कुछ हुआ था उसे देखा, तो वे बहुत डर गए और बोले, “सचमुच यह परमेश्वर का पुत्र था।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह परमेश्वर का एक पुत्र था।” यूनानी पदबंध θεοῦ υἱός में निश्चित उपपद नहीं है; मुख्य पाठ में मत्ती द्वारा यीशु के चित्रण के अनुरूप इसे एक पदवी माना गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: सूबेदार
  rationale: रोमी सैन्य अधिकारी के लिए हिन्दी बाइबल परंपरा में परिचित और सामान्य पाठक के लिए सुबोध पद; यहाँ आधुनिक भारतीय सेना के ठीक समान पद का दावा नहीं करता।
- source_word: τηροῦντες
  choice: रखवाली कर रहे
  rationale: वध-स्थल पर सैनिकों द्वारा निगरानी और पहरे के संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἰδόντες
  choice: जब … देखा
  rationale: यूनानी कृदंत का प्रसंगानुकूल कालवाचक संबंध सहज हिन्दी उपवाक्य में रखा गया है।
- source_word: σεισμόν
  choice: भूकंप
  rationale: σεισμός का इस प्रसंग में सीधा और सामान्य अर्थ।
- source_word: τὰ γενόμενα
  choice: जो कुछ हुआ था
  rationale: भूकंप के अतिरिक्त घटित घटनाओं को भी समेटने वाली व्यापक अभिव्यक्ति; बहुवचन के सामूहिक आशय को स्वाभाविक हिन्दी में रखती है।
- source_word: ἐφοβήθησαν σφόδρα
  choice: बहुत डर गए
  rationale: σφόδρα की तीव्रता को सरल, वर्तमान और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Ἀληθῶς
  choice: सचमुच
  rationale: कथन की दृढ़ और गंभीर पुष्टि को बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े व्यक्त करता है।
- source_word: θεοῦ υἱὸς
  choice: परमेश्वर का पुत्र
  rationale: मत्ती के कथानक में पदवी-सदृश और निश्चित आशय को व्यक्त करता है; यूनानी में उपपद न होने से संभव अनिश्चित अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: οὗτος
  choice: यह
  rationale: संकेतवाचक सर्वनाम की तात्कालिकता और सीधा संदर्भ बनाए रखता है।
theological_decisions:
- issue: θεοῦ υἱὸς का अर्थ
  choice: परमेश्वर का पुत्र
  alternative: परमेश्वर का एक पुत्र
  rationale: यद्यपि यूनानी पदबंध में निश्चित उपपद नहीं है, विधेयवाचक रचना और मत्ती में इस पदवी का प्रयोग निश्चित अथवा गुणसूचक अर्थ का समर्थन करते हैं। फिर भी संभावित अनिश्चित अर्थ को दबाने के बजाय पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘सूबेदार’ परिचित बाइबलीय सैन्य पद के रूप में चुना गया है। वाक्य-विन्यास समूह के सभी संबंधित लोगों द्वारा यीशु की रखवाली किए जाने का स्वाभाविक अर्थ देता है; अनावश्यक आरंभिक संयोजक नहीं जोड़ा गया।
