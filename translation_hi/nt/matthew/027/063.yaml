  text: λέγοντες· Κύριε, ἐμνήσθημεν ὅτι ἐκεῖνος ὁ πλάνος εἶπεν ἔτι ζῶν· Μετὰ τρεῖς ἡμέρας ἐγείρομαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/063.yaml
  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: hi
  text: यह कहते हुए, “प्रभु, हमें याद आया कि उस धोखेबाज़ ने, जब वह अभी जीवित था, कहा था, ‘तीन दिन के बाद मैं जी उठता हूँ।’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तीन दिन के बाद मैं जी उठूँगा,” अथवा “तीन दिन के बाद मुझे जिलाया जाएगा।” यूनानी में वर्तमान-रूप की क्रिया है, जिसका शाब्दिक अर्थ “मैं उठाया जाता हूँ” भी हो सकता है।
    reason: मूल यूनानी क्रिया के वर्तमान रूप तथा मध्य/कर्मवाच्य अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: λέγοντες
  choice: यह कहते हुए
  rationale: वर्तमान कृदंत पिछले पद की क्रिया से वक्ताओं के कथन को जोड़ता है; यह हिन्दी में उस संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: पिलातुस के लिए प्रयुक्त आदरसूचक संबोधन है; यहाँ यह उसके ईश्वर होने का संकेत नहीं देता।
- source_word: ἐμνήσθημεν
  choice: हमें याद आया
  rationale: अओरिस्ट रूप को हिन्दी में स्वाभाविक भूतकालीन स्मरण के रूप में व्यक्त करता है और वर्तमान प्रसंग में उसकी प्रासंगिकता भी स्पष्ट रहती है।
- source_word: ἐκεῖνος ὁ πλάνος
  choice: उस भरमाने वाले
  rationale: ἐκεῖνος की दूरी और πλάνος के ‘भटका देने/धोखा देने वाले’ अर्थ को विरोधी वक्ताओं की भाषा में सुरक्षित रखता है।
- source_word: ἔτι ζῶν
  choice: जीवित रहते हुए
  rationale: उस कथन के यीशु की मृत्यु से पहले कहे जाने का समय संक्षेप और स्वाभाविक ढंग से बताता है।
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: तीन दिन के बाद
  rationale: μετά और कर्मकारक का सामान्य अर्थ ‘के बाद’ है; इसे ‘तीसरे दिन’ करके अन्य कथनों से समरूप नहीं किया गया।
- source_word: ἐγείρομαι
  choice: मैं जी उठता हूँ
  rationale: वर्तमान-रूप क्रिया को हिन्दी के वर्तमान रूप में रखता है; पुनरुत्थान के प्रसंग में ‘जी उठना’ स्वाभाविक है और रूप को अनावश्यक भविष्यकाल में नहीं बदलता।
theological_decisions:
- issue: यीशु के उद्धृत पुनरुत्थान-वचन का क्रियारूप
  choice: तीन दिन के बाद मैं जी उठता हूँ
  alternative: तीन दिन के बाद मैं जी उठूँगा / मुझे जिलाया जाएगा
  rationale: यूनानी ἐγείρομαι वर्तमान रूप में है और मध्य अथवा कर्मवाच्य अर्थ की गुंजाइश रखता है। मुख्य पाठ वर्तमान रूप की असामान्यता सुरक्षित रखता है; पादटिप्पणी स्वाभाविक भविष्यकाल और कर्मवाच्य संभावनाएँ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उस भरमाने वाले’ वक्ताओं की विरोधपूर्ण दूरी को दर्शाता है; ‘तीन दिन के बाद’ मूल वाक्यांश को बिना सामंजस्य बैठाए प्रस्तुत करता है।
