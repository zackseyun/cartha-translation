lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह अगले घटनाक्रम को आरंभ करने वाला काल-सूचक शब्द है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: λέγει
  choice: ने कहा
  rationale: यूनानी में यह ऐतिहासिक वर्तमान है। हिन्दी कथा-शैली में भूतकाल ‘ने कहा’ अधिक स्वाभाविक है और घटना का अर्थ यथावत रखता है।
- source_word: αὐτῷ
  choice: उससे
  rationale: मूल में सर्वनाम है और प्रसंग से उसका संकेत यीशु की ओर स्पष्ट है; इसलिए नाम जोड़ने की आवश्यकता नहीं।
- source_word: ὁ Πιλᾶτος
  choice: पिलातुस
  rationale: व्यक्तिवाचक नाम के साथ यूनानी लेख का हिन्दी में अलग अनुवाद आवश्यक नहीं है।
- source_word: Οὐκ ἀκούεις
  choice: क्या तुम नहीं सुनते
  rationale: नकारात्मक प्रश्न की संरचना और ἀκούω का मूल अर्थ ‘सुनना’ दोनों सुरक्षित रहते हैं।
- source_word: πόσα
  choice: कितनी बातों
  rationale: नपुंसकलिंग बहुवचन का आशय अनेक कथनों या मामलों से है। ‘बातों’ स्वाभाविक हिन्दी है और ‘आरोपों’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: σου
  choice: तुम्हारे विरुद्ध
  rationale: καταμαρτυρέω के साथ संबंध विरोधात्मक है; हिन्दी में इसे ‘विरुद्ध’ से स्पष्ट करना आवश्यक है।
- source_word: καταμαρτυροῦσιν
  choice: गवाही दे रहे हैं
  rationale: यह क्रिया न्यायिक संदर्भ में किसी के विरुद्ध गवाही देने का अर्थ रखती है। अपूर्ण वर्तमान क्रिया चल रही कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करती है।
