  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς πάλιν εἶπεν ⸂ἐν παραβολαῖς αὐτοῖς⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/001.yaml
  text: 'And Jesus answered and again spoke to them in parables[a], saying:'
translation:
  language: hi
  text: 'और यीशु ने उत्तर में फिर उनसे दृष्टान्तों में कहा[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रत्युत्तर में यीशु ने फिर उनसे दृष्टान्तों में कहा।” यूनानी में “उत्तर देना” कथात्मक भाषा का एक सामान्य प्रयोग है, भले ही ठीक पहले कोई प्रत्यक्ष प्रश्न न दिया गया हो।
    reason: शब्दार्थ का वैकल्पिक अनुवाद और यूनानी कथात्मक मुहावरे का स्पष्टीकरण।
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: यह सामान्य संयोजक कथा के प्रवाह को बनाए रखता है और यूनानी में निहित न होने वाला कोई अतिरिक्त कालगत अर्थ नहीं जोड़ता।
- source_word: ἀποκριθεὶς
  choice: उत्तर देते हुए
  rationale: ἀποκρίνομαι का यह कृदन्त कथात्मक यूनानी में प्रायः रूढ़िगत रूप से प्रयुक्त होता है; इसे बनाए रखने से मूल अभिव्यक्ति और पूर्ववर्ती प्रसंग से संबंध सुरक्षित रहता है।
- source_word: ὁ Ἰησοῦς
  choice: यीशु
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी रूप। यूनानी का निश्चित उपपद हिन्दी में अलग से व्यक्त नहीं किया जाता।
- source_word: πάλιν
  choice: फिर
  rationale: यह संवाद में दोबारा बोलने का संकेत स्वाभाविक और सीधे ढंग से देता है।
- source_word: εἶπεν
  choice: कहा
  rationale: हिन्दी में वचन प्रस्तुत करने के लिए यह स्वाभाविक क्रिया है; λέγων का अलग शाब्दिक अनुवाद करने से होने वाली असहज पुनरुक्ति से बचा गया है।
- source_word: ἐν παραβολαῖς
  choice: दृष्टान्तों में
  rationale: ἐν यहाँ रीति अथवा माध्यम व्यक्त करता है। बहुवचन को सुरक्षित रखते हुए यह बाइबिलीय हिन्दी में सुबोध और गरिमापूर्ण है।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: यह यीशु के संबोधित श्रोताओं को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त करता है।
- source_word: λέγων
  choice: कहा के द्वारा अंतर्निहित
  rationale: यह कृदन्त आगे आने वाले कथन का परिचय देता है। हिन्दी में ‘कहा’ यही कार्य करता है; ‘कहा, यह कहते हुए’ जैसी पुनरुक्ति अस्वाभाविक होती।
theological_decisions:
- issue: जब ठीक पहले कोई प्रत्यक्ष प्रश्न नहीं है, तब ‘उत्तर देते हुए’ का रूढ़िगत प्रयोग
  choice: ‘उत्तर देते हुए’ को बनाए रखा गया
  alternative: ‘प्रत्युत्तर में’ अथवा केवल ‘फिर ... कहा’
  rationale: यह कथात्मक यूनानी की सामान्य अभिव्यक्ति है, आवश्यक नहीं कि किसी स्पष्ट प्रश्न का उत्तर हो। इसे बनाए रखना मूल शब्दावली और प्रसंगगत निरंतरता को सुरक्षित रखता है, बिना किसी धर्मवैज्ञानिक निष्कर्ष को थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी का सुबोध, गरिमापूर्ण कथात्मक स्तर अपनाया गया है। ‘दृष्टान्त’ स्थापित बाइबिलीय शब्द है और सामान्य पाठक के लिए भी परिचित है।
