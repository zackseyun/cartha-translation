  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: hi
  text: और कोई भी उसे एक शब्द भी उत्तर न दे सका[a], और उस दिन से फिर किसी ने उससे कोई प्रश्न करने का साहस नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे एक भी शब्द का जवाब न दे सका।” यूनानी मुहावरे में शाब्दिक रूप से, “उसे एक शब्द उत्तर देना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: कोई भी…न
  rationale: यह पूर्ण निषेध व्यक्त करता है कि वहाँ एक भी व्यक्ति उत्तर देने में समर्थ नहीं था; आधुनिक हिन्दी में यह स्वाभाविक नकारात्मक रचना है।
- source_word: ἐδύνατο
  choice: न दे सका
  rationale: अपूर्ण भूतकालीन रूप उस अवसर पर असमर्थता बताता है; ‘न दे सका’ हिन्दी में इस भाव को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: उसे एक शब्द का उत्तर
  rationale: यह यूनानी मुहावरे में आए λόγον (‘शब्द’) को बनाए रखता है और इस बात पर बल देता है कि कोई तनिक भी उत्तर न दे सका।
- source_word: οὐδὲ
  choice: और…नहीं
  rationale: यह पहले निषेध के साथ दूसरे निषेध को निकटता से जोड़ता है; हिन्दी में ‘और…नहीं’ स्वाभाविक है।
- source_word: ἐτόλμησέν τις
  choice: किसी ने…साहस नहीं किया
  rationale: τολμάω का भाव किसी काम का साहस करने या उसे करने की हिम्मत जुटाने का है; यह चयन उस अर्थ को सीधे व्यक्त करता है।
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: उस दिन से
  rationale: यह उस दिन को आगे जारी रहने वाली स्थिति का आरंभ-बिंदु बताता है।
- source_word: ἐπερωτῆσαι
  choice: कोई प्रश्न करने
  rationale: संदर्भ में यह केवल जानकारी माँगना नहीं, बल्कि यीशु के सामने प्रश्न रखकर उन्हें परखना या वाद-विवाद करना है; ‘प्रश्न करने’ से मूल अर्थ बिना अनावश्यक तीव्रता के बना रहता है।
- source_word: οὐκέτι
  choice: फिर…नहीं
  rationale: यह उस समय के बाद प्रश्न पूछने की समाप्ति व्यक्त करता है; हिन्दी में ‘उस दिन से फिर…नहीं’ इसका स्वाभाविक रूप है।
theological_decisions:
- issue: यीशु के उत्तर के बाद विरोधियों के मौन का कथात्मक अर्थ
  choice: पद को उनकी उत्तर देने की असमर्थता और आगे प्रश्न करने का साहस न होने के ऐतिहासिक कथन के रूप में रखा गया है।
  alternative: अनुवाद में ही यीशु की सर्वोच्च बुद्धि या अधिकार की स्पष्ट व्याख्या जोड़ना।
  rationale: संदर्भ यीशु की वाद-विवाद में विजय का संकेत देता है, पर पद स्वयं केवल यह कहता है कि कोई उत्तर न दे सका और आगे प्रश्न करने का साहस नहीं हुआ; अनुवाद इसी संयम को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट कथात्मक रूप। ‘एक शब्द का उत्तर’ मूल यूनानी मुहावरे के स्पष्ट संज्ञात्मक तत्व को बनाए रखता है; पादटिप्पणी अधिक स्वाभाविक वैकल्पिक अभिव्यक्ति देती है।
