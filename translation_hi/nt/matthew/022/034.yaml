id: MAT.22.34
reference: Matthew 22:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οἱ δὲ Φαρισαῖοι ἀκούσαντες ὅτι ἐφίμωσεν τοὺς Σαδδουκαίους συνήχθησαν ἐπὶ τὸ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/034.yaml
  text: But when the Pharisees heard that he had silenced the Sadducees[a], they gathered together.
translation:
  language: hi
  text: पर जब फ़रीसियों ने सुना कि उसने सदूकियों को निरुत्तर कर दिया था[a], तो वे एक साथ इकट्ठे हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “सदूकियों का मुँह बाँध दिया था।” यूनानी क्रिया का अर्थ किसी के मुँह पर थूथन लगाना भी हो सकता है; यहाँ इसका लाक्षणिक अर्थ वाद-विवाद में उन्हें चुप कर देना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले प्रसंग से हल्का विरोध और कथा का संक्रमण दिखाता है; आधुनिक हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: Φαρισαῖοι
  choice: फ़रीसी
  rationale: इस यहूदी धार्मिक समूह के नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: ἀκούσαντες
  choice: जब ... सुना
  rationale: एओरिस्ट कृदंत का समयसूचक संबंध स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐφίμωσεν
  choice: निरुत्तर कर दिया था
  rationale: संदर्भ में क्रिया का आशय वाद-विवाद में सदूकियों को आगे उत्तर देने में असमर्थ कर देना है; मूल ‘मुँह बाँधने’ की सजीव छवि पादटिप्पणी में सुरक्षित है।
- source_word: Σαδδουκαίους
  choice: सदूकियों
  rationale: इस यहूदी धार्मिक समूह के नाम का हिन्दी में प्रचलित लिप्यंतरण, विभक्ति के अनुसार रूपांतरित।
- source_word: συνήχθησαν
  choice: इकट्ठे हुए
  rationale: यहाँ निष्क्रिय रूप का अर्थ समूह के स्वयं एकत्र होने से है; यह हिन्दी में सहज और स्पष्ट है।
- source_word: ἐπὶ τὸ αὐτό
  choice: एक साथ
  rationale: मुहावरे का अर्थ ‘साथ/एक ही स्थान पर’ है; ‘एक साथ’ स्थान या उद्देश्य को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘निरुत्तर कर दिया’ वाद-विवाद के प्रसंग को स्वाभाविक रूप से व्यक्त करता है, जबकि मूल रूपक पादटिप्पणी में दिया गया है।
