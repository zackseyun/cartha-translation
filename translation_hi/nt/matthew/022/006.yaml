  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his servants, mistreated them and killed them.
translation:
  language: hi
  text: परन्तु बाकी लोगों ने उसके दासों[a] को पकड़कर उनके साथ दुर्व्यवहार किया और उन्हें मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेवकों को।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: परन्तु बाकी लोगों ने
  rationale: λοιποί पहले बताए गए आमंत्रित लोगों में से शेष लोगों को दर्शाता है; δέ का हल्का विरोधसूचक भाव ‘परन्तु’ से व्यक्त होता है।
- source_word: κρατήσαντες
  choice: पकड़कर
  rationale: अओरिस्ट कृदन्त मुख्य क्रियाओं से पहले की क्रिया बताता है। हिन्दी का ‘पकड़कर’ इस क्रम और कृदन्तीय सम्बन्ध को स्वाभाविक रूप से बनाए रखता है।
- source_word: τοὺς δούλους αὐτοῦ
  choice: उसके दासों
  rationale: δοῦλος में दासत्व का सामाजिक भाव मौजूद है। राजा के अधीन और उसकी ओर से भेजे गए व्यक्तियों के लिए ‘दास’ स्रोत के अर्थ को पारदर्शी ढंग से व्यक्त करता है; ‘सेवक’ सम्भव वैकल्पिक अनुवाद है।
- source_word: ὕβρισαν
  choice: उनके साथ दुर्व्यवहार किया
  rationale: ὑβρίζω केवल मौखिक अपमान नहीं, बल्कि अपमानजनक और हिंसक बर्ताव भी व्यक्त कर सकता है। ‘दुर्व्यवहार किया’ हिन्दी में इस व्यापक अर्थ को सुरक्षित रखता है।
- source_word: ἀπέκτειναν
  choice: उन्हें मार डाला
  rationale: यह ἀποκτείνω का सीधा और स्वाभाविक हिन्दी अनुवाद है; ‘हत्या की’ कहने से अनावश्यक कानूनी या नैतिक सूक्ष्मता जुड़ सकती है।
theological_decisions:
- issue: दृष्टान्त के सन्दर्भ में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: ‘दास’ मूल शब्द में निहित अधीन और स्वामित्वगत स्थिति को बनाए रखता है, जबकि ‘सेवक’ अधिक सामान्य और नरम अर्थ दे सकता है। किसी अतिरिक्त धार्मिक निष्कर्ष को जोड़े बिना वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘पकड़कर’ वाक्य को स्वाभाविक रखते हुए यूनानी कृदन्त का क्रम व्यक्त करता है।
