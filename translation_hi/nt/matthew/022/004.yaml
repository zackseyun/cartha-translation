source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other servants[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: hi
  text: फिर उसने दूसरे दासों[a] को यह कहकर भेजा, ‘जिन्हें निमंत्रण दिया गया है, उनसे कहो, “देखो, मैंने अपना भोज[b] तैयार कर लिया है। मेरे बैल और खिलाकर मोटे किए हुए पशु वध किए जा चुके हैं, और सब कुछ तैयार है। विवाह-उत्सव में आओ।”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवकों”; यूनानी शब्द δοῦλος संदर्भ के अनुसार “दास” या “सेवक” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “भोजन”; यूनानी शब्द तैयार किए गए भोजन को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: फिर
  rationale: कथा में उसी कार्य की पुनरावृत्ति को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἄλλους δούλους
  choice: और दासों
  rationale: राजकीय गृहस्थी के संदर्भ में δοῦλος की अधीन और बंधी सामाजिक स्थिति को ‘दास’ स्पष्ट रूप से व्यक्त करता है; ‘और’ यहाँ पहले भेजे गए लोगों से भिन्न, अन्य दासों का भाव देता है।
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: जिन्हें निमंत्रण दिया गया है, उनसे कहो
  rationale: Perfect passive participle पहले दिए जा चुके निमंत्रण और उसकी वर्तमान प्रासंगिकता—दोनों को बनाए रखता है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाला स्वाभाविक आधुनिक हिन्दी प्रयोग है।
- source_word: τὸ ἄριστόν μου
  choice: अपना भोज
  rationale: यह तैयार किए गए भोजन को दर्शाता है; विवाह के संदर्भ में ‘भोज’ गरिमापूर्ण और सहज है, जबकि फुटनोट में अधिक सामान्य ‘भोजन’ विकल्प दिया गया है।
- source_word: ἡτοίμακα
  choice: तैयार कर लिया है
  rationale: यूनानी पूर्णकाल तैयारी के पूरे हो जाने और उसके वर्तमान परिणाम को व्यक्त करता है।
- source_word: οἱ ταῦροί μου
  choice: मेरे बैल
  rationale: ταῦροι का सीधा और संदर्भानुकूल हिन्दी रूप।
- source_word: τὰ σιτιστὰ
  choice: पाले-पोसे पशु
  rationale: विशेष रूप से खिलाकर वध के लिए तैयार किए गए पशुओं का भाव रखता है, पर यूनानी से आगे जाकर उन्हें बछड़े या केवल मवेशी नहीं ठहराता।
- source_word: τεθυμένα
  choice: काटे जा चुके हैं
  rationale: भोज के लिए पशुओं के वध का स्वाभाविक हिन्दी वर्णन है और अनावश्यक बलिदानी अर्थ से बचता है।
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: विवाह-उत्सव में आओ
  rationale: γάμοι का बहुवचन विवाह के पूरे उत्सव या समारोहों को सूचित कर सकता है; यह अनुवाद उस व्यापक अर्थ को सहजता से व्यक्त करता है।
theological_decisions:
- issue: राजकीय दृष्टांत में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: राजा की गृहस्थी में ये केवल नियुक्त कर्मचारी नहीं, उसके अधिकाराधीन गृहस्थ दास हैं। ‘दास’ उस ऐतिहासिक-सामाजिक वास्तविकता को बनाए रखता है, जबकि फुटनोट पाठक को संदर्भानुसार संभव नरम विकल्प बताता है।
- issue: γάμοι के बहुवचन का अर्थ
  choice: विवाह-उत्सव
  alternative: विवाह
  rationale: बहुवचन विवाह से जुड़े समारोहों या उत्सव को समष्टि रूप में सूचित कर सकता है; किसी विशिष्ट धार्मिक वैवाहिक धारणा को आरोपित किए बिना यह व्यापकता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज कथात्मक शैली। उद्धरणों की अंतर्निहित परतें स्पष्ट रखी गई हैं। ‘विवाह-उत्सव’ से यूनानी बहुवचन का सामूहिक उत्सवी भाव व्यक्त होता है।
