  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: hi
  text: ‘मैं अब्राहम का परमेश्वर, इसहाक का परमेश्वर और याकूब का परमेश्वर हूँ।’ परमेश्वर मरे हुओं का नहीं, बल्कि जीवितों का परमेश्वर है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: मैं ... हूँ
  rationale: वर्तमानकालीन आत्म-परिचय को सीधे रखा गया है; इससे उद्धृत वचन की भाषा और यीशु के तर्क का बल बना रहता है।
- source_word: ὁ θεὸς Ἀβραὰμ ... ὁ θεὸς Ἰσαὰκ ... ὁ θεὸς Ἰακώβ
  choice: अब्राहम का परमेश्वर, इसहाक का परमेश्वर और याकूब का परमेश्वर
  rationale: यूनानी में θεός की पुनरावृत्ति को बनाए रखा गया है, क्योंकि वह कथन को आलंकारिक बल देती है।
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: वह ... का परमेश्वर नहीं ... है
  rationale: हिन्दी में पहले उल्लिखित परमेश्वर के लिए ‘वह’ स्वाभाविक है; साथ ही विधेय ‘परमेश्वर’ को स्पष्ट रखा गया है।
- source_word: νεκρῶν
  choice: मरे हुओं
  rationale: बहुवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त है। ‘मरे हुओं’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और ‘जीवितों’ के साथ स्पष्ट विरोध बनाता है।
- source_word: ζώντων
  choice: जीवितों
  rationale: वर्तमान कृदन्त यहाँ संज्ञात्मक है। ‘जीवितों’ संक्षिप्त विरोधात्मक रचना को सुरक्षित रखता है।
theological_decisions:
- issue: पुनरुत्थान के तर्क में कुलपिताओं के परमेश्वर के सामने जीवित रहने का निहितार्थ
  choice: वह मरे हुओं का नहीं, बल्कि जीवितों का परमेश्वर है।
  alternative: वह उन लोगों का परमेश्वर नहीं जो मर चुके हैं, बल्कि उनका है जो उसके लिए जीवित हैं।
  rationale: मूल कथन को बिना किसी व्याख्यात्मक विस्तार के रखा गया है। इससे पुनरुत्थान के संदर्भ में यीशु के तर्क का बल बना रहता है, पर मध्यावस्था या किसी अन्य सिद्धान्त को अनुवाद में जोड़ा नहीं जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। ‘परमेश्वर’ बाइबलीय प्रसंग के अनुकूल प्रचलित शब्द है। यूनानी उद्धरण का आरम्भ इस पद में बीच से होने के कारण प्रारम्भिक उद्धरण-चिह्न रखा गया है; प्रश्नचिह्न मूल पाठ के उद्धरणात्मक प्रश्न-संदर्भ को दर्शाता है।
