  text: यह सुनकर वे चकित हुए और उसे छोड़कर चले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: यह सुनकर
  rationale: कालवाचक एओरिस्ट कृदन्त मुख्य क्रिया से पहले की क्रिया बताता है। प्रसंग से निहित कर्म को हिन्दी में स्वाभाविक रूप से ‘यह’ द्वारा व्यक्त किया गया है।
- source_word: ἐθαύμασαν
  choice: वे चकित हुए
  rationale: θαυμάζω यहाँ आश्चर्य और विस्मय की प्रतिक्रिया व्यक्त करता है; ‘चकित हुए’ आधुनिक, सहज और गरिमापूर्ण हिन्दी है।
- source_word: ἀφέντες αὐτὸν
  choice: उसे छोड़कर
  rationale: यह कृदन्त किसी व्यक्ति को छोड़कर वहाँ से जाने का भाव देता है। ‘अकेला’ जोड़ना यूनानी पाठ से अधिक स्पष्टता आरोपित करता।
- source_word: ἀπῆλθαν
  choice: चले गए
  rationale: ἀπέρχομαι के दूर चले जाने के सामान्य कथात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ ... καὶ
  choice: और
  rationale: दोहराया गया καί घटनाओं को क्रम से जोड़ता है। हिन्दी में एक ‘और’ तथा कृदन्तीय रचना वही प्रवाह स्वाभाविक ढंग से बनाए रखती है।
