id: MAT.22.11
reference: Matthew 22:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: hi
  text: पर जब राजा भोज में टेक लगाकर बैठे मेहमानों[b] को देखने भीतर आया, तो उसने वहाँ एक ऐसे आदमी को देखा, जिसने विवाह के वस्त्र नहीं पहने थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जिसने विवाह का वस्त्र नहीं पहना था।’
    reason: यूनानी में ‘वस्त्र’ एकवचन है; हिन्दी में इसे सामूहिक बहुवचन के बजाय एक वस्त्र के रूप में भी अनूदित किया जा सकता है।
  - marker: b
    text: यूनानी में शाब्दिक अर्थ ‘टेक लगाकर लेटे हुए’ है। प्राचीन औपचारिक भोज में मेहमान प्रायः इसी मुद्रा में भोजन करते थे।
    reason: यह सांस्कृतिक टिप्पणी प्राचीन भोज-मुद्रा स्पष्ट करती है और आधुनिक पाठक को ‘लेटे हुए’ का अर्थ सोना समझने से बचाती है।
lexical_decisions:
- source_word: εἰσελθὼν
  choice: भीतर आया
  rationale: यह भूतकालिक कृदंत राजा के मुख्य कार्य से पहले उसके भीतर आने को बताता है। ‘भीतर आया’ आधुनिक हिन्दी में स्वाभाविक है और भोज-स्थान में प्रवेश का भाव रखता है।
- source_word: δὲ
  choice: पर
  rationale: δέ कथा को आगे बढ़ाते हुए हल्का विरोध और तनाव प्रकट करता है; यहाँ राजा के निरीक्षण से कथा में नया मोड़ आता है।
- source_word: ὁ βασιλεὺς
  choice: राजा
  rationale: राजकीय दृष्टान्त में βασιλεύς का सीधा और प्रचलित हिन्दी रूप।
- source_word: θεάσασθαι
  choice: देखने
  rationale: यह उद्देश्यसूचक अनन्त क्रिया है। ‘देखने’ मूल अर्थ को स्वाभाविक ढंग से व्यक्त करता है और ‘जाँच करने’ जैसा अत्यधिक औपचारिक भाव नहीं जोड़ता।
- source_word: τοὺς ἀνακειμένους
  choice: भोज में टेक लगाकर बैठे मेहमानों
  rationale: ἀνάκειμαι प्राचीन औपचारिक भोज में टेक लगाकर भोजन करने की मुद्रा को बताता है। ‘मेहमानों’ से प्रसंग स्पष्ट होता है, जबकि ‘टेक लगाकर बैठे’ सांस्कृतिक मुद्रा को बनाए रखता है।
- source_word: εἶδεν
  choice: उसने ... देखा
  rationale: ὁράω के सामान्य भूतकालिक कथात्मक अर्थ का सीधा हिन्दी रूप।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: स्थानवाचक क्रियाविशेषण का स्वाभाविक हिन्दी अनुवाद।
- source_word: ἄνθρωπον
  choice: एक ऐसे आदमी
  rationale: यह कथा में एक विशिष्ट पुरुष व्यक्ति के लिए एकवचन पुल्लिंग संज्ञा है; इसलिए लिंग को बनाए रखा गया है। ‘ऐसे’ अगले विशेषण-वाक्य से हिन्दी में स्वाभाविक संबंध बनाता है।
- source_word: οὐκ ἐνδεδυμένον
  choice: नहीं पहने थे
  rationale: पूर्ण कृदंत उस व्यक्ति की उस समय की वस्त्रहीन अवस्था को दर्शाता है। हिन्दी में ‘नहीं पहने थे’ सहज रूप से उस वर्तमान-परिणामी अवस्था को व्यक्त करता है।
- source_word: ἔνδυμα γάμου
  choice: विवाह के वस्त्र
  rationale: यह आधुनिक हिन्दी में समझने योग्य सामूहिक अभिव्यक्ति है और विवाह से संबंधित पहनावे का अर्थ देती है। यूनानी में संज्ञा एकवचन है; उस अधिक शाब्दिक रूप को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: भोज में बैठने की प्राचीन मुद्रा
  choice: मेहमानों को स्पष्ट करते हुए ‘टेक लगाकर बैठे’ सांस्कृतिक विवरण बनाए रखा गया।
  alternative: केवल ‘मेहमानों’ या अधिक शाब्दिक ‘लेटे हुओं’ का प्रयोग।
  rationale: मूल पाठ भोज में टेक लगाकर खाने की प्राचीन प्रथा दिखाता है। ‘लेटे हुए’ आधुनिक हिन्दी में सोने का भ्रामक अर्थ दे सकता है, जबकि चुना हुआ रूप ऐतिहासिक दृश्य को स्पष्ट रखता है।
- issue: ἄνθρωπον का लिंग
  choice: एक ऐसे आदमी
  alternative: एक व्यक्ति; किसी को
  rationale: यह मानवजाति के लिए सामान्य कथन नहीं, बल्कि दृष्टान्त में एक पुरुष पात्र का उल्लेख है; इसलिए स्रोत का एकवचन पुल्लिंग रूप रखा गया।
- issue: ἔνδυμα γάμου का वचन और आशय
  choice: मुख्य पाठ में स्वाभाविक सामूहिक बहुवचन ‘विवाह के वस्त्र’; पादटिप्पणी में शाब्दिक एकवचन।
  alternative: विवाह का एक वस्त्र; विवाह-भोज के योग्य पोशाक
  rationale: यूनानी पद का आशय विवाह से संबंधित पहनावा है, पर पाठ स्वयं ‘योग्य’ शब्द नहीं कहता। चुना हुआ रूप अतिरिक्त धार्मिक अर्थ जोड़े बिना स्वाभाविक हिन्दी देता है और एकवचन की वास्तविक भाषिक संभावना पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भोज’, ‘टेक लगाकर बैठे’ और ‘विवाह के वस्त्र’ सामान्य पाठक के लिए स्पष्ट हैं; अनावश्यक रूप से संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
