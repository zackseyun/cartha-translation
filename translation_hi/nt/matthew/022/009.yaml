base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: hi
  text: इसलिए सड़कों के चौराहों[a] पर जाओ, और जितने भी लोग तुम्हें मिलें, उन सबको विवाह-भोज[b] में निमंत्रित करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जहाँ सड़कें बँटती या मिलती हैं’ अथवा ‘सड़कों के निकासों पर’; यूनानी पद ऐसे स्थानों को सूचित करता है जहाँ रास्ते निकलते, बँटते या मिलते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘विवाहों में’; यहाँ यह यूनानी मुहावरा विवाह-समारोह या विवाह-भोज के लिए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: जाओ
  rationale: वर्तमान काल के आज्ञार्थक रूप का यहाँ सीधा निर्देशात्मक अर्थ है; ‘जाओ’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले परिणाम या निष्कर्ष को जोड़ता है; ‘इसलिए’ उस तार्किक संबंध को स्पष्ट रखता है।
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: सड़कों के चौराहों पर
  rationale: διέξοδοι उन स्थानों को सूचित कर सकता है जहाँ सड़कें निकलती, बँटती या मिलती हैं। ‘सड़कों के चौराहों’ से सार्वजनिक मार्गों के ऐसे स्थान का अर्थ सहज रूप में व्यक्त होता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ὅσους ἐὰν εὕρητε
  choice: जितने लोग तुम्हें मिलें, उन सबको
  rationale: यह रचना अनिश्चितता के साथ व्यापक संख्या व्यक्त करती है। ‘जितने…उन सबको’ मूल के परिमाणात्मक खुलेपन और समावेशी बल को स्वाभाविक हिन्दी में रखता है।
- source_word: καλέσατε
  choice: बुला लाओ
  rationale: विवाह-भोज के प्रसंग में καλέω का अर्थ निमंत्रित करना है। सेवकों को बाहर भेजे जाने के कारण ‘बुला लाओ’ आमंत्रण के साथ लोगों को भोज तक लाने की व्यावहारिक दिशा भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰς τοὺς γάμους
  choice: विवाह-भोज में
  rationale: बहुवचन γάμους यहाँ अनेक विवाहों के बजाय विवाह-समारोह या उसके भोज के लिए प्रयुक्त है; ‘विवाह-भोज’ दृष्टांत के भोज-संदर्भ को स्पष्ट करता है।
