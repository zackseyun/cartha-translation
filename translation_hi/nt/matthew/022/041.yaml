lexical_decisions:
- source_word: Συνηγμένων
  choice: इकट्ठे थे
  rationale: 'γενitive absolute की पृष्ठभूमिकालीन परिस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है: प्रश्न पूछे जाने के समय फ़रीसी एकत्र थे।'
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ हल्के कथात्मक संक्रमण का संकेत देता है, प्रबल विरोध का नहीं। हिन्दी वाक्य में ‘जब... तब...’ संरचना उस संक्रमण और समय-संबंध को स्वाभाविक रूप से व्यक्त करती है।
- source_word: τῶν Φαρισαίων
  choice: फ़रीसी
  rationale: Φαρισαῖοι समुदाय के नाम का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: ἐπηρώτησεν
  choice: पूछा
  rationale: इस प्रसंग में ἐπερωτάω का सहज आधुनिक हिन्दी समतुल्य; ‘पूछताछ की’ अनावश्यक रूप से कठोर या विरोधी भाव दे सकता है।
- source_word: αὐτοὺς
  choice: उनसे
  rationale: सर्वनाम का संदर्भ अभी उल्लिखित फ़रीसियों से है; हिन्दी में ‘पूछना’ के साथ व्यक्ति के लिए ‘से’ स्वाभाविक है।
- source_word: ὁ Ἰησοῦς
  choice: यीशु
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी रूप; यूनानी निश्चित लेख का अलग अनुवाद आवश्यक नहीं।
