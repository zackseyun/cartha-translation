  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: hi
  text: इसलिए हमें बताइए, आपको क्या लगता है? क्या कैसर को जनगणना-कर देना उचित है या नहीं?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: आपको क्या लगता है?
  rationale: यूनानी मुहावरे का स्वाभाविक और सीधा आधुनिक हिन्दी रूप।
- source_word: ἔξεστιν
  choice: उचित है
  rationale: यहाँ प्रश्न केवल सरकारी वैधता का नहीं, बल्कि व्यवस्था और धार्मिक दृष्टि से अनुमेय होने का है; ‘उचित’ इस व्यापक आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: δοῦναι
  choice: देना
  rationale: मूल क्रिया का निकट रूप रखा गया है; इसे ‘चुकाना’ बनाकर निहित दायित्व को अधिक स्पष्ट नहीं किया गया।
- source_word: κῆνσον
  choice: कर
  rationale: रोमी जनगणना-आधारित कर के लिए सामान्य पाठक को समझ आने वाला संक्षिप्त शब्द; विशिष्टता संदर्भ से स्पष्ट होती है।
- source_word: Καίσαρι
  choice: कैसर को
  rationale: रोमी सम्राट की पदवी/नाम का प्रचलित बाइबलीय हिन्दी लिप्यंतरण।
theological_decisions:
- issue: ἔξεστιν में कानूनी और धार्मिक अनुमेयता का संबंध
  choice: उचित है
  alternative: व्यवस्था के अनुसार है / जायज़ है
  rationale: प्रश्न की जानबूझकर व्यापक नैतिक-धार्मिक धार को बनाए रखते हुए आधुनिक, dignified हिन्दी दी गई है; इसे केवल रोमी नागरिक कानून तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; विनम्र बहुवचन ‘बताइए/आपको’ से संबोधन का भाव रखा गया है। वाक्य सरल, मौखिक और गरिमापूर्ण है।
