  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: hi
  text: 'उसने उनसे कहा, “तो फिर दाऊद आत्मा में[a] उसे ‘प्रभु’[b] कैसे कहता है, यह कहते हुए:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आत्मा के द्वारा।” यूनानी पदबंध माध्यम या क्षेत्र—दोनों का भाव व्यक्त कर सकता है; “आत्मा में” उसके शब्दों के अधिक निकट है।
    reason: lexical_alternative
  - marker: b
    text: या “स्वामी।” यहाँ प्रयुक्त यूनानी उपाधि κύριος का सामान्य अनुवाद “प्रभु” है।
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: उसने उनसे कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान काल है; हिन्दी कथा-शैली में सामान्य भूतकाल स्वाभाविक है और संवाद का कार्य सुरक्षित रखता है।
- source_word: Πῶς οὖν
  choice: तो फिर … कैसे
  rationale: ‘कैसे’ प्रश्नवाचक बल को और ‘तो फिर’ οὖν के निष्कर्षात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Δαυὶδ
  choice: दाऊद
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और पहचाना जाने वाला नाम-रूप।
- source_word: ἐν πνεύματι
  choice: आत्मा में
  rationale: यूनानी ἐν की निकट अभिव्यक्ति है और पवित्र आत्मा के प्रभाव, माध्यम या क्षेत्र से संबंधित मूल वाक्यांश की कुछ अर्थगत व्यापकता बनाए रखती है।
- source_word: καλεῖ αὐτὸν κύριον
  choice: उसे ‘प्रभु’ कहता है
  rationale: ‘प्रभु’ κύριος का मानक हिन्दी प्रतिशब्द है और भजन 110 से जुड़े उपाधिगत तथा मसीही महत्व को बनाए रखता है।
- source_word: λέγων
  choice: 'वह कहता है:'
  rationale: अगले पद में आने वाले उद्धरण का स्वाभाविक हिन्दी परिचय देता है; द्विबिंदु उद्धरण के जारी रहने का संकेत करता है।
theological_decisions:
- issue: ἐν πνεύματι में ‘आत्मा’ का अभिप्राय
  choice: मुख्य पाठ में ‘आत्मा’ को पवित्र आत्मा के संभावित संदर्भ के रूप में रखा गया है
  alternative: दाऊद की अपनी आत्मा या आत्मिक अवस्था
  rationale: शास्त्रीय उद्धरण के संदर्भ में पवित्र आत्मा का आशय अधिक संभावित है, पर ‘आत्मा में’ मूल पदबंध की संक्षिप्तता और उसकी माध्यम/क्षेत्र संबंधी अर्थगत गुंजाइश को सुरक्षित रखता है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस भजन-संबंधी मसीही तर्क में ‘प्रभु’ उपाधि के धार्मिक और अंतरपाठीय महत्व को ‘स्वामी’ की अपेक्षा बेहतर सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। ‘तो फिर’ तर्क की निरंतरता दिखाता है। उद्धरण अगले पद में आरंभ होने के कारण अंत में द्विबिंदु रखा गया है।
