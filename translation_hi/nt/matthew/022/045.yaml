  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: hi
  text: यदि दाऊद उसे ‘प्रभु’ कहता है[a], तो वह उसका पुत्र कैसे है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अथवा, संदर्भ को अधिक स्पष्ट करते हुए: “यदि दाऊद मसीह को ‘प्रभु’ कहता है, तो मसीह उसका पुत्र कैसे है?”'
    reason: वैकल्पिक, संदर्भ-स्पष्टकारी अनुवाद; यूनानी αὐτόν में निहित मसीह-संदर्भ को प्रकट करता है।
lexical_decisions:
- source_word: εἰ οὖν
  choice: इसलिए यदि
  rationale: εἰ की शर्त और οὖν के निष्कर्षसूचक बल—दोनों को स्वाभाविक हिन्दी में बनाए रखता है। ‘यदि’ आधार को बिना निश्चित तथ्य के रूप में आरोपित किए प्रस्तुत करता है।
- source_word: Δαυὶδ
  choice: दाऊद
  rationale: इस बाइबलीय व्यक्तिगत नाम का हिन्दी में प्रचलित रूप।
- source_word: καλεῖ
  choice: कहता है
  rationale: यहाँ καλέω किसी को एक उपाधि से पुकारने या कहने के अर्थ में है। ‘प्रभु कहता है’ आधुनिक हिन्दी में स्वाभाविक है और नामकरण/सम्बोधन का भाव बनाए रखता है।
- source_word: αὐτὸν
  choice: उसे
  rationale: पिछले संदर्भ में बताए गए मसीह की ओर संकेत करने वाले कर्मकारक सर्वनाम का सीधा अनुवाद।
- source_word: κύριον
  choice: प्रभु
  rationale: κύριος का मानक हिन्दी बाइबलीय रूप; भजन 110:1 की प्रतिध्वनि और सम्मानसूचक तथा मसीह-संबंधी महत्व को बनाए रखता है।
- source_word: πῶς
  choice: कैसे
  rationale: तार्किक संबंध पर उठाए गए प्रश्न का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: υἱὸς αὐτοῦ
  choice: उसका पुत्र
  rationale: मूल के पारिवारिक और राजवंशीय शब्द-विन्यास को बनाए रखता है। ‘वंशज’ अर्थ स्पष्ट कर सकता है, पर मूल में जानबूझकर रखे गए ‘पुत्र’ और ‘प्रभु’ के तनाव को कमजोर करेगा।
- source_word: ἐστιν
  choice: है
  rationale: वर्तमानकालीन संयोजक क्रिया का सीधा हिन्दी रूप।
theological_decisions:
- issue: दाऊद द्वारा मसीह को ‘प्रभु’ कहने का मसीह-संबंधी बल
  choice: मुख्य पाठ में ‘प्रभु’ और ‘उसका पुत्र’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘यदि दाऊद मसीह को “प्रभु” कहता है, तो मसीह दाऊद का पुत्र कैसे है?’
  rationale: मूल यूनानी में इस पद पर ‘मसीह’ स्पष्ट संज्ञा के रूप में नहीं, बल्कि αὐτόν (‘उसे’) के संदर्भ में निहित है। मुख्य पाठ में सर्वनाम रखने से दाऊदी पुत्रत्व और श्रेष्ठ प्रभुता के बीच यीशु द्वारा प्रस्तुत तनाव सुरक्षित रहता है; पादटिप्पणी संदर्भ को स्पष्ट करती है, पर उसका समाधान नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘इसलिए यदि’ से तर्क की निष्कर्षसूचक और शर्तसूचक दोनों गतियाँ बनी रहती हैं। उद्धरण-चिह्न ‘प्रभु’ को कथन की उपाधि के रूप में स्पष्ट करते हैं।
