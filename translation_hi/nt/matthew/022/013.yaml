id: MAT.22.13
reference: Matthew 22:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: hi
  text: तब राजा ने सेवकों[a] से कहा, “इसके पैर और हाथ बाँधकर इसे बाहर के अंधकार में फेंक दो। वहाँ रोना और दाँत पीसना होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परिचारकों’।
    reason: διάκονος भोज के इस प्रसंग में सेवक या परिचारक, दोनों अर्थ दे सकता है।
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कथा में अगली घटना को स्वाभाविक और स्पष्ट ढंग से प्रस्तुत करता है।
- source_word: ὁ βασιλεὺς
  choice: राजा
  rationale: दृष्टांत के राजकीय परिवेश और मूल शब्द के सीधे अर्थ को बनाए रखता है।
- source_word: τοῖς διακόνοις
  choice: सेवकों
  rationale: भोज के प्रसंग में यह राजा की आज्ञा पूरी करने वाले सेवकों को दर्शाता है; इससे कलीसियाई पद का अनावश्यक अर्थ नहीं जुड़ता।
- source_word: Δήσαντες
  choice: बाँधकर
  rationale: अओरिस्ट कृदंत की मुख्य आज्ञा से पूर्व की क्रिया को हिंदी में स्वाभाविक रूप से व्यक्त करता है और बंधन की गंभीरता बनाए रखता है।
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: इसके पैर और हाथ
  rationale: यूनानी पाठ का क्रम ‘पैर और हाथ’ सुरक्षित रखा गया है; निकट उपस्थित व्यक्ति के लिए ‘इसके’ हिंदी में स्वाभाविक है।
- source_word: ἐκβάλετε αὐτὸν
  choice: इसे ... फेंक दो
  rationale: बलपूर्वक बाहर निकालने की तीव्रता और आज्ञार्थक रूप को स्पष्ट आधुनिक हिंदी में व्यक्त करता है।
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: बाहर के अंधकार में
  rationale: यह स्थानगत विरोध—भोज के भीतर के विपरीत बाहर का अंधकार—सुरक्षित रखता है और अभिव्यक्ति को किसी विशिष्ट धर्मसैद्धांतिक व्याख्या तक सीमित नहीं करता।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: मूल के स्थानवाचक बल का संक्षिप्त और स्वाभाविक हिंदी रूप है।
- source_word: ὁ κλαυθμὸς
  choice: रोना
  rationale: शोकपूर्ण विलाप के अर्थ को बिना बढ़ाए सामान्य और गरिमापूर्ण हिंदी में व्यक्त करता है।
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: दाँत पीसना
  rationale: पीड़ा और संभवतः क्रोध दोनों की गुंजाइश रखने वाली इस यूनानी अभिव्यक्ति का प्रचलित हिंदी रूप है।
theological_decisions:
- issue: दृष्टांत में बाहर निकाले जाने की छवि का स्वरूप
  choice: ‘बाहर के अंधकार’ की ठोस रूपकात्मक भाषा को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: इसे सीधे ‘नरक’ कहना, या इसे केवल भोज से सामाजिक बहिष्कार के रूप में नरम कर देना।
  rationale: मूल पाठ न्याय की तीव्र छवि प्रस्तुत करता है, पर इस पद में उसकी संपूर्ण धर्मसैद्धांतिक पहचान स्पष्ट नहीं करता; इसलिए अनुवाद उस तनाव को खुला रखता है।
- issue: ‘दाँत पीसने’ में निहित भाव
  choice: स्थापित मुहावरे को यथावत रखा गया है।
  alternative: इसे केवल पीड़ा या केवल क्रोध के रूप में स्पष्ट करना।
  rationale: यूनानी अभिव्यक्ति संदर्भ में संताप और क्रोध में से किसी एक तक अर्थ को अनिवार्यतः सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। आज्ञा की कठोरता तथा मत्ती की न्याय-संबंधी छवि को बनाए रखा गया है; साथ ही अनावश्यक कलीसियाई या संप्रदायगत शब्दावली से बचा गया है।
