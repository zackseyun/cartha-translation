source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: hi
  text: पर यीशु ने उनकी दुष्ट मंशा[a] जानकर कहा, “हे कपटियो, तुम मेरी परीक्षा क्यों ले रहे हो[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी दुष्टता” अथवा “उनका दुर्भाव।”
    reason: lexical_alternative
  - marker: b
    text: या “तुम मुझे क्यों परख रहे हो?” यूनानी क्रिया का अर्थ प्रसंग के अनुसार “परखना,” “परीक्षा लेना” या “प्रलोभन में डालना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: जानकर
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले यीशु द्वारा उनकी मंशा जान लेने को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: यहाँ δέ पिछले कथन के साथ हल्का विरोध दिखाता है; उनके छलपूर्ण प्रश्न के प्रत्युत्तर में ‘पर’ स्वाभाविक है।
- source_word: πονηρίαν
  choice: दुष्ट मंशा
  rationale: संदर्भ में शब्द केवल सामान्य दुष्टता नहीं, बल्कि प्रश्न के पीछे छिपे दुर्भावनापूर्ण उद्देश्य को सूचित करता है।
- source_word: εἶπεν
  choice: कहा
  rationale: कथात्मक प्रसंग में λέγω के एओरिस्ट का सहज और मानक हिन्दी अनुवाद।
- source_word: Τί
  choice: क्यों
  rationale: क्रिया के साथ τί यहाँ कारण पूछने वाला मुहावरा है, इसलिए हिन्दी में ‘क्यों’ स्वाभाविक है।
- source_word: πειράζετε
  choice: परख रहे हो
  rationale: πειράζω में परखने, जाँचने या प्रलोभन में डालने की अर्थ-सीमा है; इस प्रसंग में विरोधी यीशु को फँसाने के लिए उनकी परीक्षा ले रहे हैं, अतः ‘परख’ मूल अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
- source_word: ὑποκριταί
  choice: कपटियो
  rationale: यह संबोधन उन लोगों को दर्शाता है जो ऊपर से निष्कपट बनते हैं, पर भीतर शत्रुतापूर्ण उद्देश्य छिपाए हैं; ‘कपटियो’ आधुनिक हिन्दी में सीधा और बोधगम्य है।
theological_decisions:
- issue: यीशु द्वारा विरोधियों की भीतरी मंशा जानना
  choice: यीशु ने उनकी दुष्ट मंशा जान ली थी।
  alternative: यीशु ने उनकी दुष्टता पहचान ली थी।
  rationale: पद यीशु को उनके व्यवहार के पीछे का नैतिक रूप से बुरा उद्देश्य ठीक-ठीक जानते हुए प्रस्तुत करता है, पर अनुवाद इससे आगे कोई व्यापक धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ता।
- issue: πειράζετε का आशय
  choice: परख रहे हो
  alternative: परीक्षा ले रहे हो; प्रलोभन में डाल रहे हो
  rationale: प्रसंग में लक्ष्य यीशु को प्रश्न द्वारा फँसाना है। ‘परख रहे हो’ परीक्षण का भाव रखता है और क्रिया को केवल नैतिक प्रलोभन तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘हे कपटियो’ प्रत्यक्ष संबोधन की तीक्ष्णता को बनाए रखता है।
