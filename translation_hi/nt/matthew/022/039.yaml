  text: Δευτέρα ⸀δὲ ὁμοία ⸀αὐτῇ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: hi
  text: 'और दूसरी आज्ञा उसके समान है: “तुम अपने पड़ोसी से अपने समान प्रेम करो।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δευτέρα
  choice: दूसरी आज्ञा
  rationale: स्त्रीलिंग क्रमवाचक विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और प्रसंग में दूसरी आज्ञा को सूचित करता है। हिन्दी में आशय स्पष्ट रखने के लिए ‘आज्ञा’ जोड़ा गया है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्का संयोजक है, प्रबल विरोध नहीं; ‘और’ पिछले कथन से स्वाभाविक संबंध बनाता है।
- source_word: ὁμοία αὐτῇ
  choice: उसके समान है
  rationale: यह पदबंध पहली आज्ञा की ओर संकेत करते हुए समानता व्यक्त करता है; ‘उसके समान’ संक्षिप्त और स्वाभाविक है।
- source_word: Ἀγαπήσεις
  choice: प्रेम करना
  rationale: भविष्यत्कालीन रूप उद्धृत व्यवस्था में आज्ञार्थक बल रखता है। हिन्दी में उद्धृत आज्ञा के लिए ‘तुम ... प्रेम करना’ प्रत्यक्ष, प्रचलित और गरिमापूर्ण है।
- source_word: τὸν πλησίον σου
  choice: अपने पड़ोसी से
  rationale: यह रूढ़ पदबंध निकट रहने वाले मात्र व्यक्ति नहीं, बल्कि ‘अपने पड़ोसी’ का अर्थ देता है। हिन्दी में ‘प्रेम करना’ के साथ ‘से’ स्वाभाविक कारक है।
- source_word: ὡς σεαυτόν
  choice: अपने समान
  rationale: ὡς तुलना का मानक प्रस्तुत करता है और आत्मवाचक सर्वनाम कर्ता की ओर लौटता है; ‘अपने समान’ हिन्दी का स्वाभाविक समतुल्य है।
theological_decisions:
- issue: दूसरी आज्ञा का पहली आज्ञा से संबंध
  choice: दूसरी आज्ञा उसके समान है
  alternative: एक दूसरी आज्ञा उसके समान है
  rationale: यूनानी Δευτέρα के साथ उपपद नहीं है, इसलिए ‘दूसरी’ और ‘एक दूसरी’ दोनों व्याकरणतः संभव हैं। मुख्य पाठ प्रसंग में क्रमबद्ध दूसरी आज्ञा को स्पष्ट करता है, जबकि पादटिप्पणी अनिश्चित रूप को सुरक्षित रखती है। ‘समान’ तुलना को बनाए रखता है, दोनों आज्ञाओं को एक में नहीं मिलाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और शास्त्रीय उद्धरण के अनुकूल। ‘पड़ोसी’ स्थापित बाइबलीय और सामान्य हिन्दी शब्द है।
