id: MAT.22.15
reference: Matthew 22:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: hi
  text: तब फ़रीसियों ने जाकर आपस में सलाह की कि उसे उसकी बातों में कैसे फँसाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “योजना बनाई कि उसकी कही बात के द्वारा उसे कैसे फँसाएँ।”
    reason: ἐν λόγῳ के ‘बात के द्वारा/कही हुई बात के आधार पर’ वाले साधनार्थक भाव और συμβούλιον ἔλαβον के ‘योजना बनाई’ विकल्प को दर्शाता है।
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह क्रियाविशेषण कथा में घटनाओं का क्रम बताता है; ‘तब’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: πορευθέντες
  choice: जाकर
  rationale: मुख्य क्रिया से पहले आए अओरिस्ट कृदंत को हिन्दी में पूर्वकालिक ‘जाकर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἱ Φαρισαῖοι
  choice: फ़रीसियों ने
  rationale: समुदाय के प्रचलित नाम को आधुनिक मानक हिन्दी में रखा गया है; परसर्ग ‘ने’ वाक्य में उनके कर्ता होने को स्पष्ट करता है।
- source_word: συμβούλιον ἔλαβον
  choice: आपस में सलाह की
  rationale: यूनानी मुहावरे का अर्थ विचार-विमर्श करके योजना बनाना है। ‘आपस में सलाह की’ उसके विचार-विमर्श वाले भाव को रखता है, जबकि दुर्भावना आगे के उद्देश्य-वाक्य से स्पष्ट होती है।
- source_word: ὅπως
  choice: कि ... कैसे
  rationale: यह उनकी सलाह की विषयवस्तु और उद्देश्य दोनों का परिचय देता है; ‘सलाह की कि ... कैसे’ हिन्दी में स्वाभाविक है और दोनों पहलुओं को बनाए रखता है।
- source_word: αὐτὸν
  choice: उसे
  rationale: यह यीशु की ओर संकेत करने वाला सीधा कर्मवाचक सर्वनाम है; मूल पाठ की तरह नाम दोहराने के बजाय सर्वनाम रखा गया है।
- source_word: παγιδεύσωσιν
  choice: फँसाएँ
  rationale: क्रिया में जाल में पकड़ने का रूपक है। ‘फँसाएँ’ आधुनिक हिन्दी में स्पष्ट है और विरोधी मंशा व्यक्त करता है।
- source_word: ἐν λόγῳ
  choice: उसकी बातों में
  rationale: λόγος यहाँ वचन या कही हुई बात को सूचित करता है। ‘उसकी बातों में’ इस आशय को स्वाभाविक हिन्दी में व्यक्त करता है कि वे यीशु की कही किसी बात को उसके विरुद्ध पकड़ना चाहते थे।
theological_decisions:
- issue: συμβούλιον ἔλαβον में शत्रुता की अभिव्यक्ति का स्तर
  choice: वाक्यांश को अपेक्षाकृत तटस्थ ‘आपस में सलाह की’ के रूप में रखना और दुर्भावना को ‘फँसाएँ’ से प्रकट होने देना
  alternative: ‘षड्यंत्र रचा’ कहना
  rationale: पद में शत्रुतापूर्ण उद्देश्य स्पष्ट है, पर वह विशेष रूप से उद्देश्य-वाक्य παγιδεύσωσιν से आता है। इसलिए पहले मुहावरे में अतिरिक्त शत्रुतापूर्ण अर्थ भरने के बजाय मूल की अर्थ-संरचना रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फ़रीसी’ का प्रचलित रूप और ‘फँसाना’ जैसा सर्वसुलभ शब्द चुना गया है। वाक्य में यीशु का नाम जोड़ने के बजाय मूल यूनानी के सर्वनाम को बनाए रखा गया है।
