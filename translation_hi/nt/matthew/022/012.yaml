  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: hi
  text: और उसने उससे कहा, “मित्र, तुम विवाह का वस्त्र पहने बिना यहाँ कैसे आ गए?” पर वह निरुत्तर रह गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “उसे चुप करा दिया गया।” यूनानी क्रिया का अर्थ “मुँह बंद कर देना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: मित्र
  rationale: संबोधन औपचारिक और कुछ दूरी बनाए रखने वाला है। ‘मित्र’ स्वाभाविक हिन्दी है और प्रसंग की विडंबना तथा छिपी हुई फटकार को बिना बढ़ाए बनाए रखता है।
- source_word: πῶς
  choice: कैसे
  rationale: यह क्रियाविशेषण कारण या उद्देश्य से अधिक ढंग अथवा प्रवेश की परिस्थिति पूछता है; इसलिए ‘कैसे’ यूनानी के सबसे निकट है।
- source_word: εἰσῆλθες ὧδε
  choice: यहाँ ... आ गए
  rationale: अओरिस्ट रूप प्रवेश की पूरी हो चुकी क्रिया बताता है। ‘यहाँ आ गए’ आधुनिक हिन्दी में स्वाभाविक है और भीतर आने का भाव प्रसंग से स्पष्ट रहता है।
- source_word: μὴ ἔχων
  choice: पहने बिना
  rationale: वस्त्र के संदर्भ में ‘न रखते हुए’ की अपेक्षा ‘पहने बिना’ स्वाभाविक हिन्दी है और आवश्यक वस्त्र न होने की सहवर्ती परिस्थिति व्यक्त करता है।
- source_word: ἔνδυμα γάμου
  choice: विवाह का वस्त्र
  rationale: एकवचन पद विवाह-भोज से संबंधित किसी वस्त्र को सूचित करता है। यह अनुवाद वस्त्र का प्रकार अनावश्यक रूप से निश्चित किए बिना मूल संरचना को बनाए रखता है।
- source_word: ἐφιμώθη
  choice: निरुत्तर रह गया
  rationale: φιμόω का मूल अर्थ ‘मुँह बाँधना’ और प्रसंगगत अर्थ ‘चुप करा देना’ है। यहाँ व्यक्ति उत्तर नहीं दे पाता; ‘निरुत्तर रह गया’ उस परिणाम को सहज हिन्दी में व्यक्त करता है, जबकि अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: अनुचित वस्त्र पहने अतिथि के लिए मेज़बान के संबोधन का स्वर
  choice: विनम्र किंतु अप्रत्यक्ष रूप से फटकारता हुआ ‘मित्र’
  alternative: ‘साथी’ या अधिक कठोर संबोधन
  rationale: यूनानी संबोधन न तो स्पष्ट आत्मीयता जताता है, न खुला अपमान। ‘मित्र’ कथा के तनाव और विडंबना को किसी अतिरिक्त धर्मवैचारिक अर्थ के बिना सुरक्षित रखता है।
- issue: ἐφιμώθη का अनुवाद
  choice: परिणाम-केंद्रित ‘निरुत्तर रह गया’
  alternative: अधिक शाब्दिक ‘चुप करा दिया गया’ अथवा ‘उसका मुँह बाँध दिया गया’
  rationale: प्रसंग में उसका उत्तर न दे पाना प्रमुख है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है, जबकि यूनानी निष्क्रिय रूप और उसकी सजीव शाब्दिक छवि पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विवाह का वस्त्र’ मूल के एकवचन और अनिश्चित वस्त्र-प्रकार को बनाए रखता है; ‘निरुत्तर रह गया’ सामान्य पाठक के लिए तत्काल स्पष्ट है।
