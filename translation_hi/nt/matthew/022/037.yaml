source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: hi
  text: उसने उससे कहा, “तुम अपने प्रभु परमेश्वर से अपने पूरे हृदय से[a], अपने पूरे प्राण से[b] और अपनी पूरी बुद्धि से[c] प्रेम करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ ‘में’ (ἐν) है; इस रचना में हिन्दी का ‘से’ सम्पूर्ण हृदय से किए गए प्रेम को स्वाभाविक रूप से व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘प्राण’ के लिए प्रयुक्त यूनानी शब्द ψυχή का अर्थ प्रसंग के अनुसार ‘जीवन’ या ‘स्वयं’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘बुद्धि’ का अनुवाद ‘समझ’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: उसने
  rationale: यहाँ δέ संवाद को हल्के ढंग से आगे बढ़ाता है; हिन्दी में अलग से ‘और’ जोड़ना आवश्यक नहीं और ‘लेकिन’ अनावश्यक विरोध दर्शाता।
- source_word: ἔφη αὐτῷ
  choice: उसने उससे कहा
  rationale: φημί का सीधा अर्थ ‘कहा’ है; ‘उत्तर दिया’ मूल क्रिया में निहित नहीं है। αὐτῷ को ‘उससे’ से व्यक्त किया गया है।
- source_word: Ἀγαπήσεις
  choice: प्रेम रखना
  rationale: भविष्यत् सूचक रूप यहाँ व्यवस्थाविवरण के आदेश को उद्धृत करते हुए आज्ञार्थक बल रखता है। हिन्दी का ‘प्रेम रखना’ स्वाभाविक आज्ञा है और इसे केवल भविष्यवाणी जैसा सुनाई देने से बचाता है।
- source_word: κύριον τὸν θεόν σου
  choice: प्रभु अपने परमेश्वर से
  rationale: κύριος के लिए ‘प्रभु’ और θεός के लिए ‘परमेश्वर’ मानक तथा प्रसंगानुकूल हैं; σου को ‘अपने’ से व्यक्त किया गया है। प्रेम के लक्ष्य के साथ हिन्दी में ‘से’ स्वाभाविक है।
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: अपने सारे हृदय से
  rationale: ἐν का मूल अर्थ ‘में’ है, पर इस समर्पण-सूचक रचना में हिन्दी ‘से’ स्वाभाविक है। ὅλῃ की सम्पूर्णता ‘सारे’ से बनी रहती है।
- source_word: ψυχῇ
  choice: प्राण
  rationale: ψυχή का अर्थ प्रसंगानुसार जीवन, स्वयं या प्राण हो सकता है। यहाँ ‘प्राण’ पूरे जीवित व्यक्तित्व के समर्पण को व्यक्त करता है और त्रिक पदावली का भेद बनाए रखता है।
- source_word: διανοίᾳ
  choice: बुद्धि
  rationale: διάνοια विचार और समझ की क्षमता को दर्शाता है। ‘बुद्धि’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है तथा बौद्धिक आयाम को सुरक्षित रखता है।
theological_decisions:
- issue: व्यवस्थाविवरण के उद्धरण में आज्ञा का रूप
  choice: भविष्यत् यूनानी रूप को हिन्दी आज्ञा ‘प्रेम रखना’ से व्यक्त करना
  alternative: ‘प्रेम करेगा’
  rationale: Ἀγαπήσεις रूपतः भविष्यत् है, पर उद्धरण में आज्ञार्थक है। ‘प्रेम रखना’ उसके बाध्यकारी बल को स्पष्ट करता है, जबकि ‘प्रेम करेगा’ आधुनिक हिन्दी में केवल भविष्य-कथन समझा जा सकता है।
- issue: हृदय, प्राण और बुद्धि की त्रिक पदावली
  choice: तीनों पदों को अलग-अलग बनाए रखना
  alternative: उन्हें ‘अपने पूरे अस्तित्व से’ जैसे एक व्यापक पद में समेटना
  rationale: मूल यूनानी καρδία, ψυχή और διάνοια में भेद करता है। अनुवाद उस भेद और व्यापक समर्पण, दोनों को बनाए रखता है, बिना उनके बीच कोई कठोर दार्शनिक विभाजन स्थापित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। एकवचन सम्बोधन ‘तू’ मूल के एकवचन σου और शास्त्रीय उद्धरण की शैली को सुरक्षित रखता है; इसे अनादर के अर्थ में नहीं लिया जाना चाहिए। समानांतरता दिखाने के लिए ‘अपने सारे ... से’ की पुनरावृत्ति रखी गई है।
