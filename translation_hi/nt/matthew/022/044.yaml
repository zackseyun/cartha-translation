  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: hi
  text: ‘प्रभु ने मेरे प्रभु से कहा, “मेरे दाहिने बैठ, जब तक कि मैं तेरे शत्रुओं को तेरे पैरों के नीचे रख दूँ”?’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, भजन 110:1 के इब्रानी मुहावरे के अनुसार, “तेरे शत्रुओं को तेरे पैरों की चौकी बना दूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: प्रभु
  rationale: यूनानी पाठ दोनों व्यक्तियों के लिए एक ही उपाधि κύριος का प्रयोग करता है। ‘प्रभु’ दोनों स्थानों पर उसी समानता को बनाए रखता है, जबकि ‘मेरे प्रभु’ संबंधगत भेद स्पष्ट करता है।
- source_word: Εἶπεν
  choice: कहा
  rationale: λέγω के अओरिस्ट का यहाँ स्वाभाविक और सीधा हिन्दी रूप ‘कहा’ है।
- source_word: τῷ κυρίῳ μου
  choice: मेरे प्रभु से
  rationale: सम्प्रदान कारक कथन के संबोधित व्यक्ति को बताता है। हिन्दी में ‘से कहा’ स्वाभाविक है और ‘मेरे प्रभु’ मूल उपाधि तथा उसके महत्व को बनाए रखता है।
- source_word: Κάθου
  choice: बैठ
  rationale: यह वर्तमान आज्ञार्थक रूप है। एकवचन संबोधन के अनुरूप ‘बैठ’ संक्षिप्त और स्वाभाविक है।
- source_word: ἐκ δεξιῶν μου
  choice: मेरे दाहिने
  rationale: यह सम्मान और शासन के स्थान को सूचित करने वाला मुहावरा है। ‘मेरे दाहिने’ आधुनिक हिन्दी में स्पष्ट और पारंपरिक दोनों है।
- source_word: ἕως ἂν θῶ
  choice: जब तक कि मैं ... न कर दूँ
  rationale: ἕως ἂν तथा अओरिस्ट संभावनार्थक भविष्य में होने वाली सीमा व्यक्त करते हैं। हिन्दी की ‘जब तक कि ... न कर दूँ’ रचना इसे स्वाभाविक ढंग से दर्शाती है।
- source_word: τοὺς ἐχθρούς σου
  choice: तेरे शत्रुओं को
  rationale: ‘शत्रु’ ἐχθρός का स्पष्ट, dignified और सामान्य हिन्दी समतुल्य है; एकवचन संबोधन के अनुरूप ‘तेरे’ रखा गया है।
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: तेरे पैरों के नीचे
  rationale: यह यूनानी पदबंध का सीधा अर्थ है और शत्रुओं के अधीन किए जाने की छवि सुरक्षित रखता है।
theological_decisions:
- issue: भजन 110:1 के उद्धरण में κύριος के दो प्रयोग
  choice: प्रभु ने मेरे प्रभु से कहा
  alternative: यहोवा ने मेरे प्रभु से कहा; प्रभु ने मेरे स्वामी से कहा
  rationale: यूनानी उद्धरण दोनों व्यक्तियों के लिए κύριος ही रखता है। दोनों बार ‘प्रभु’ कहना उस पाठगत समानता और यीशु के तर्क में निहित तनाव को बनाए रखता है। पहले स्थान पर ‘यहोवा’ कहना इब्रानी पृष्ठभूमि स्पष्ट करता, पर यूनानी पाठ में मौजूद रूपात्मक समानता को मिटा देता; दूसरे स्थान पर ‘स्वामी’ कहना संभव है, पर मूल की समान उपाधि को कमजोर करता है।
- issue: ὑποκάτω τῶν ποδῶν σου की छवि
  choice: तेरे पैरों के नीचे न कर दूँ
  alternative: तेरे शत्रुओं को तेरे पैरों की चौकी न बना दूँ
  rationale: मत्ती का यूनानी पाठ सीधे ‘पैरों के नीचे’ कहता है। ‘पैरों की चौकी’ इब्रानी भजन की प्रचलित छवि को व्यक्त करती है, इसलिए उसे वैकल्पिक पाठ के रूप में पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी। पद प्रश्नवाचक उद्धरण के रूप में है, इसलिए अंतिम प्रश्नचिह्न बनाए रखा गया है। ‘तू/तेरा’ रूप एकवचन मूल संबोधन को स्पष्ट और संक्षिप्त रखता है; इसका उद्देश्य अनादर व्यक्त करना नहीं है।
