lexical_decisions:
- source_word: αὕτη
  choice: यही
  rationale: यह संकेतवाचक सर्वनाम पद 37 में अभी उद्धृत आज्ञा की ओर लौटकर संकेत करता है। ‘यही’ उस अन्वय और बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐστὶν
  choice: है
  rationale: वर्तमानकालीन साधारण संयोजक क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: μεγάλη
  choice: महान
  rationale: यहाँ आकार नहीं, महत्त्व या पद की श्रेष्ठता अभिप्रेत है। ‘महान’ मूल के सकारात्मक विशेषण को बनाए रखता है; ‘सबसे बड़ी’ अनावश्यक रूप से उसे उत्कृष्टतम बना देता।
- source_word: πρώτη
  choice: पहली
  rationale: आज्ञाओं के क्रम या पद में प्रथम होने का सीधा अर्थ सुरक्षित रखता है। ‘प्रधान’ सम्भव है, पर अधिक व्याख्यात्मक है।
- source_word: ἐντολή
  choice: आज्ञा
  rationale: व्यवस्था और शास्त्रीय आदेश के प्रसंग में प्रचलित, स्पष्ट और गरिमापूर्ण हिन्दी शब्द।
theological_decisions:
- issue: μεγάλη और πρώτη का आज्ञा के लिए परस्पर सम्बन्ध
  choice: 'दोनों विशेषणों को समान रूप से स्पष्ट रखा गया: ‘महान और पहली आज्ञा।’'
  alternative: ‘सबसे प्रधान आज्ञा’ या ‘सबसे बड़ी और पहली आज्ञा।’
  rationale: यूनानी पाठ में दो समन्वित सकारात्मक विशेषण हैं। दोनों को अलग-अलग व्यक्त करने से महानता और प्राथमिकता के बीच का मूल तनाव बना रहता है तथा सकारात्मक रूप को चुपचाप उत्कृष्टतम में नहीं बदला जाता।
