  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: hi
  text: हमारे यहाँ सात भाई थे। पहले भाई ने विवाह किया और मर गया; उसकी कोई संतान[a] नहीं थी, और वह अपनी पत्नी को अपने भाई के लिए छोड़ गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘बीज’। यहाँ इसका अर्थ संतान या वंशज है।
    reason: lexical_alternative
  - marker: b
    text: यह लेवी-विवाह की प्रथा की ओर संकेत करता है। इस प्रथा में मृत पुरुष के भाई से अपेक्षा की जाती थी कि वह विधवा से विवाह करके मृत भाई के लिए संतान उत्पन्न करे; देखें व्यवस्थाविवरण 25:5।
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: हमारे यहाँ
  rationale: यहाँ παρά के साथ दत्तिव समुदाय या समूह के बीच उपस्थिति दर्शाता है। ‘हमारे यहाँ’ सहज आधुनिक हिन्दी है और सदूकियों द्वारा अपने समुदाय से जुड़ा उदाहरण रखने के ढंग को व्यक्त करता है।
- source_word: ἑπτὰ ἀδελφοί
  choice: सात भाई
  rationale: लेवी-विवाह के प्रसंग में ἀδελφοί स्पष्ट रूप से पुरुष सहोदरों को दर्शाता है।
- source_word: ὁ πρῶτος
  choice: पहले ने
  rationale: πρῶτος भाइयों के क्रम में पहले व्यक्ति को बताता है; यह आवश्यक रूप से सबसे बड़े भाई का संकेत नहीं है।
- source_word: γήμας
  choice: विवाह किया
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले घटित विवाह को दर्शाता है। अगले वाक्यांश में ‘फिर’ घटनाओं का क्रम स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἐτελεύτησεν
  choice: मर गया
  rationale: τελευτάω मृत्यु को सीधे व्यक्त करता है; ‘मर गया’ स्पष्ट और अनलंकृत हिन्दी है।
- source_word: μὴ ἔχων σπέρμα
  choice: उसकी कोई संतान नहीं थी
  rationale: σπέρμα का शाब्दिक अर्थ ‘बीज’ है, पर इस पारिवारिक और कानूनी प्रसंग में इसका अर्थ वंश या संतान है। ‘संतान’ उस अर्थ को सहज रूप से व्यक्त करता है।
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: वह अपनी पत्नी को ... छोड़ गया
  rationale: यहाँ ἀφίημι मृत्यु के समय पीछे छोड़ जाने का अर्थ देता है, न कि तलाक देने या त्यागने का। ‘मर गया’ का निकट प्रसंग इस आशय को स्पष्ट रखता है।
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: अपने भाई के लिए
  rationale: दत्तिव रूप जीवित भाई को उस व्यक्ति के रूप में चिह्नित करता है जिसके लिए विधवा छोड़ी गई। यह हिन्दी में स्वाभाविक है और मूल पाठ में न आए ‘विवाह करने के लिए’ को मुख्य पाठ में नहीं जोड़ता।
theological_decisions:
- issue: क्या लेवी-विवाह की पृष्ठभूमि को मुख्य पाठ में स्पष्ट किया जाए
  choice: मुख्य पाठ में केवल यूनानी पाठ का निहित कथन रखा गया और प्रथा को पादटिप्पणी में समझाया गया।
  alternative: ‘अपने भाई से विवाह करने के लिए पत्नी को छोड़ गया’ कहना।
  rationale: व्यवस्थाविवरण 25:5 की पृष्ठभूमि यहाँ निहित है, लेकिन यूनानी वाक्य में ‘विवाह करने के लिए’ स्पष्ट रूप से नहीं है। इसे मुख्य पाठ में जोड़ने से अनुवाद व्याख्यात्मक विस्तार बन जाता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘हमारे यहाँ’ बोलचाल में सहज है, जबकि ‘संतान’ पारिवारिक-कानूनी प्रसंग के लिए उपयुक्त औपचारिकता बनाए रखता है। वाक्य को हिन्दी की स्वाभाविक पठनीयता के लिए तीन छोटे वाक्यों में बाँटा गया है।
