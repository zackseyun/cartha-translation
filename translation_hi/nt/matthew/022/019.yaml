lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: दिखाओ
  rationale: यह बहुवचन आज्ञार्थक क्रिया किसी वस्तु को निरीक्षण के लिए दिखाने का आदेश देती है; आधुनिक हिन्दी में “दिखाओ” इसके दृश्य भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: νόμισμα
  choice: सिक्का
  rationale: यह प्रचलन में रहे सिक्के या मुद्रा को दर्शाता है; अगले वाक्यांश में उसे दीनार कहा गया है, इसलिए “सिक्का” स्पष्ट और स्वाभाविक है।
- source_word: τοῦ κήνσου
  choice: कर चुकाने का
  rationale: κῆνσος रोमी शासन के अधीन लगाए गए कर के लिए प्रयुक्त लैटिन मूल का शब्द है। “कर चुकाने का सिक्का” सम्बन्ध को सहज हिन्दी में व्यक्त करता है, बिना मुख्य पाठ में कर के सटीक प्रकार को आवश्यकता से अधिक निश्चित किए।
- source_word: προσήνεγκαν
  choice: लाए
  rationale: कथात्मक प्रसंग में यह सरल और स्वाभाविक रूप से बताता है कि वे सिक्का यीशु के पास ले आए।
- source_word: δηνάριον
  choice: एक दीनार
  rationale: यह एक विशिष्ट रोमी सिक्के का नाम है; ऐतिहासिक विशिष्टता बनाए रखने के लिए हिन्दी में प्रचलित लिप्यंतरण “दीनार” रखा गया है।
