lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत
  rationale: यह विशेषण संज्ञा की तरह प्रयुक्त हुआ है और ὀλίγοι के साथ स्पष्ट विरोध बनाता है। हिंदी में “बहुत” इस संक्षिप्त, सूक्तिपरक कथन के लिए स्वाभाविक है।
- source_word: γάρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है। “क्योंकि” हिंदी में उसके व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰσιν
  choice: हैं
  rationale: यह εἰμί का सामान्य वर्तमानकालीन बहुवचन रूप है; “हैं” इसका सीधा हिंदी समतुल्य है।
- source_word: κλητοὶ
  choice: बुलाए हुए
  rationale: κλητοί का अर्थ “बुलाए हुए” या प्रसंगानुसार “निमंत्रित” हो सकता है। विवाह-भोज का संदर्भ निमंत्रण का भाव देता है, पर “बुलाए हुए” शब्द की व्यापक अर्थ-छाया और ἐκλεκτοί के साथ उसका पारंपरिक विरोध दोनों बनाए रखता है।
- source_word: ὀλίγοι
  choice: थोड़े
  rationale: यह πολλοί का प्रत्यक्ष विलोम है। “थोड़े” संक्षिप्त विरोध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: यहाँ δέ दोनों खंडों के बीच विरोध दिखाता है; “पर” उस प्रतिकूल संबंध को संक्षेप में व्यक्त करता है।
- source_word: ἐκλεκτοί
  choice: चुने हुए
  rationale: ἐκλεκτοί का मूल अर्थ “चुने हुए” है। यह आधुनिक हिंदी में स्पष्ट है और किसी बाद की विशिष्ट धर्मवैज्ञानिक प्रणाली को मुख्य पाठ में आरोपित नहीं करता।
theological_decisions:
- issue: ἐκλεκτοί का अनुवाद, विशेषकर बुलाहट और चुनाव संबंधी धर्मवैज्ञानिक बहसों के संदर्भ में
  choice: चुने हुए
  alternative: निर्वाचित
  rationale: “चुने हुए” यूनानी शब्द का पारदर्शी अर्थ देता है और पाठ में निहित धर्मवैज्ञानिक तनाव को किसी संप्रदायगत शब्दावली से पहले ही तय नहीं करता। “निर्वाचित” को वैध वैकल्पिक रूप के रूप में पादटिप्पणी में रखा गया है।
- issue: विवाह-भोज के संदर्भ में κλητοί का अनुवाद
  choice: बुलाए हुए
  alternative: निमंत्रित
  rationale: तात्कालिक भोज-संदर्भ में “निमंत्रित” उपयुक्त है, किंतु “बुलाए हुए” मूल शब्द की व्यापक पुकार-संबंधी अर्थ-छाया और ἐκλεκτοί के साथ विरोध दोनों को सुरक्षित रखता है। प्रसंगगत विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। “बुलाए हुए” और “चुने हुए” की समानांतर रचना मूल यूनानी के सूक्तिपरक विरोध को बनाए रखती है।
