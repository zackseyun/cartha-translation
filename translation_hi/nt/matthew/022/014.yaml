  text: For many are called[b][a], but few are chosen.
translation:
  language: hi
  text: क्योंकि बुलाए हुए[a] बहुत हैं, पर चुने हुए[b] थोड़े हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निमंत्रित”; इस विवाह-भोज के संदर्भ में मूल शब्द निमंत्रण का भाव भी रख सकता है।
