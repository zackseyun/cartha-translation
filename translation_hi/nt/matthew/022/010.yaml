source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those servants went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: hi
  text: और वे दास सड़कों पर निकल गए और जिन्हें भी उन्होंने पाया, उन सबको—बुरे और भले दोनों को—इकट्ठा कर लाए; और विवाह-भोज भोजन के लिए लेटे हुए अतिथियों से भर गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में, “विवाह।” संदर्भ में इसका अर्थ विवाह-भोज या उसका आयोजन-स्थल हो सकता है। ‘भोजन के लिए लेटे हुए’ प्राचीन औपचारिक भोज में मेज़ के पास लेटकर भोजन करने की प्रथा को दर्शाता है।
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: दास
  rationale: यह शब्द राजा के अधिकार के अधीन बँधे घरेलू सेवकों को दर्शाता है; ‘दास’ मूल सामाजिक स्थिति को ‘सेवक’ की अपेक्षा अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: ὁδοὺς
  choice: सड़कें
  rationale: बहुवचन सार्वजनिक मार्गों को दर्शाता है जहाँ लोग मिल सकते थे; आधुनिक हिन्दी में ‘सड़कें’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: συνήγαγον
  choice: इकट्ठा कर लाए
  rationale: सिर्फ एकत्र करने के साथ उन्हें भोज में लाने का कथात्मक आशय भी स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: πάντας οὓς εὗρον
  choice: जिन्हें भी उन्होंने पाया, उन सबको
  rationale: यह यूनानी वाक्यांश की व्यापकता और व्यक्तिवाचक भाव दोनों को बनाए रखता है।
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: बुरे और भले दोनों को
  rationale: यह नैतिक विरोध को स्पष्ट रखते हुए सहज हिन्दी देता है; ‘भले’ व्यक्तियों के नैतिक चरित्र के लिए ‘अच्छे’ से अधिक स्वाभाविक है।
- source_word: γάμος
  choice: विवाह-भोज
  rationale: γάμος विवाह या उसके उत्सव/भोज को सूचित कर सकता है। यहाँ उसके अतिथियों से ‘भरने’ के कारण विवाह-भोज का दृश्य अभिप्रेत है, पर ‘भवन’ जोड़कर स्थान को मूल से अधिक निश्चित नहीं किया गया।
- source_word: ἐπλήσθη
  choice: भर गया
  rationale: यूनानी निष्क्रिय क्रिया का स्वाभाविक हिन्दी प्रतिरूप है और दृश्य के पूर्ण हो जाने को व्यक्त करता है।
- source_word: ἀνακειμένων
  choice: मेज़ पर लेटे हुए अतिथि
  rationale: यह प्राचीन औपचारिक भोजन में मेज़ के पास लेटकर खाने की मुद्रा को स्पष्ट करता है; ‘अतिथि’ भोज के संदर्भ से निहित है।
theological_decisions:
- issue: इकट्ठा किए गए लोगों का नैतिक वर्णन
  choice: बुरे और भले दोनों
  alternative: दुष्ट और अच्छे दोनों
  rationale: यह निमंत्रण की भेदरहित व्यापकता को बनाए रखता है, पर आगे की दृष्टान्त-कथा के आधार पर यहाँ कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: γάμος का संदर्भगत अर्थ
  choice: विवाह-भोज
  alternative: विवाह / विवाह-भवन
  rationale: ‘भर गया’ और भोजन के लिए लेटे लोगों का उल्लेख भोज के दृश्य की ओर संकेत करता है। फिर भी ‘विवाह-भवन’ न चुनने से मूल शब्द की स्थान और आयोजन के बीच की अर्थगत लचक सुरक्षित रहती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। ‘दास’ सामाजिक वास्तविकता को नरम किए बिना व्यक्त करता है। ‘विवाह-भोज’ संदर्भ स्पष्ट करता है, जबकि पादटिप्पणी γάμος की शाब्दिक अभिव्यक्ति और प्राचीन भोजन-मुद्रा बताती है।
