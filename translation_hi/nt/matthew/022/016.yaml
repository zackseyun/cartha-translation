source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: hi
  text: और वे अपने चेलों को हेरोदियों[a] के साथ उसके पास भेजते हैं। वे कहते हैं, “गुरु, हम जानते हैं कि आप सच्चे हैं और परमेश्वर का मार्ग सच्चाई से सिखाते हैं। आपको किसी की परवाह नहीं[b], क्योंकि आप लोगों का मुँह देखकर भेदभाव नहीं करते।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हेरोदी संभवतः हेरोदेस के राजवंश और उसकी राजनीतिक व्यवस्था के समर्थक थे।
    reason: historical_context
  - marker: b
    text: अर्थात आप किसी व्यक्ति की हैसियत के कारण उससे प्रभावित नहीं होते या पक्षपात नहीं करते।
    reason: idiom_clarification
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: भेजते हैं
  rationale: यूनानी ऐतिहासिक वर्तमान को बनाए रखता है और हिन्दी कथन में भी स्वाभाविक है।
- source_word: μαθητὰς
  choice: चेलों
  rationale: सुसमाचार के संदर्भ में सीखने और अनुसरण करने वालों के लिए प्रचलित, सहज हिन्दी शब्द।
- source_word: Ἡρῳδιανῶν
  choice: हेरोदियों
  rationale: हेरोद से संबद्ध दल के पारंपरिक नाम को संक्षिप्त रूप में सुरक्षित रखता है।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: सम्बोधन के रूप में आधुनिक हिन्दी में स्वाभाविक है और शिक्षक की भूमिका व्यक्त करता है।
- source_word: ἀληθὴς
  choice: सच्चे
  rationale: यीशु के सत्यनिष्ठ और प्रामाणिक होने का व्यापक अर्थ बनाए रखता है।
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: परमेश्वर का मार्ग
  rationale: मूल रूपक को सुरक्षित रखता है और केवल किसी शिक्षा-पद्धति तक अर्थ को सीमित नहीं करता।
- source_word: ἐν ἀληθείᾳ
  choice: सच्चाई से
  rationale: रीति और सत्य के अनुरूप होने—दोनों संभावित बलों को सहज हिन्दी में व्यक्त करता है।
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: आपको किसी की परवाह नहीं
  rationale: मूल वाक्य के निकट रहता है; संदर्भ बताता है कि आशय किसी के पद या प्रतिक्रिया से प्रभावित न होना है, न कि करुणाहीनता।
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: क्योंकि आप लोगों का मुँह देखकर निर्णय नहीं करते
  rationale: यूनानी मुख-संबंधी मुहावरे की छवि को आंशिक रूप से रखते हुए निष्पक्षता का अभिप्राय स्पष्ट करता है।
- source_word: ἀνθρώπων
  choice: लोगों
  rationale: यहाँ शब्द सामान्य रूप से मनुष्यों को सूचित करता है; हिन्दी में 'लोगों' सटीक और स्वाभाविक है।
theological_decisions:
- issue: निष्पक्षता बताने वाला यूनानी मुहावरा
  choice: लोगों का मुँह देखकर निर्णय नहीं करते
  alternative: लोगों के बाहरी रूप या पद के आधार पर पक्षपात नहीं करते
  rationale: मुख्य पाठ स्रोत की मुख-संबंधी छवि और उसके मुहावरेदार अर्थ दोनों को व्यक्त करता है, बिना यह निर्धारित किए कि केवल रूप, पद या प्रतिष्ठा में से कौन-सा पहलू प्रमुख है।
- issue: οὐ μέλει σοι περὶ οὐδενός का संभावित कठोर शाब्दिक अर्थ
  choice: आपको किसी की परवाह नहीं
  alternative: आप किसी से प्रभावित नहीं होते
  rationale: शाब्दिक तनाव को मुख्य पाठ में बनाए रखा गया है; पादटिप्पणी स्पष्ट करती है कि प्रसंग में इसका आशय लोगों की हैसियत या प्रतिक्रिया से प्रभावित न होना है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सम्मानसूचक ‘आप’ वक्ताओं की चापलूसीपूर्ण औपचारिकता के अनुकूल है। यूनानी ऐतिहासिक वर्तमान के लिए ‘भेजते हैं’ रखा गया है।
