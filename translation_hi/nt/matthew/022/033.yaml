lexical_decisions:
- source_word: ἀκούσαντες
  choice: यह सुनकर
  rationale: कालवाचक एओरिस्ट कृदन्त को स्वाभाविक हिन्दी में ‘यह सुनकर’ कहा गया है; ‘यह’ पिछले प्रसंग में यीशु के उत्तर की ओर संकेत करता है।
- source_word: οἱ ὄχλοι
  choice: भीड़ें
  rationale: यूनानी में संज्ञा बहुवचन है; ‘भीड़ें’ उस बहुवचन को बनाए रखता है, यद्यपि हिन्दी में एकवचन ‘भीड़’ भी स्वाभाविक हो सकता है।
- source_word: ἐξεπλήσσοντο
  choice: चकित होती रहीं
  rationale: अपूर्ण भूतकाल की चलती या सजीव प्रतिक्रिया को व्यक्त करने के लिए ‘चकित होती रहीं’ चुना गया है।
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: उसके उपदेश से
  rationale: ἐπί के साथ सम्प्रदान यहाँ चकित होने के आधार या अवसर को बताता है। ‘उपदेश’ आधुनिक हिन्दी में διδαχή को सहज और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: καὶ
  choice: और
  rationale: सरल संयोजक पिछले संवाद के साथ कथात्मक क्रम बनाए रखता है।
