    issue: ‘चकित होती रहीं’ is awkward and semantically imprecise.
    rationale: It sounds iterative/progressive in Hindi (‘kept becoming astonished’) rather than expressing the crowds’ astonished response. ‘चकित रह गई’ naturally represents the reaction as a resultant, vivid state.
  - severity: low
    issue: ‘भीड़ें’ is less natural than a collective singular in Hindi narrative.
    rationale: Although ὄχλοι is plural, ‘भीड़’ is normally treated as a collective singular in modern Hindi. The footnote can preserve the Greek plural information without forcing an unnatural plural.
