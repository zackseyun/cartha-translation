  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: hi
  text: “गुरु, व्यवस्था में कौन-सी आज्ञा सबसे बड़ी है?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “व्यवस्था में कौन-सी आज्ञा बड़ी है?”'
    reason: मूल यूनानी में ‘बड़ी’ सकारात्मक विशेषण है, यद्यपि संदर्भ में उसका अर्थ ‘सबसे बड़ी’ हो सकता है।
lexical_decisions:
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: यह संबोधन के रूप में प्रयुक्त शब्द है। आधुनिक हिन्दी के बाइबलीय संदर्भ में ‘गुरु’ स्वाभाविक और सम्मानपूर्ण है तथा यहाँ यीशु की शिक्षक की भूमिका व्यक्त करता है।
- source_word: ποία
  choice: कौन-सी
  rationale: यह व्यवस्था की आज्ञाओं में से एक की पहचान पूछने वाला प्रश्नवाचक विशेषण है; ‘कौन-सी’ इसका सहज हिन्दी रूप है।
- source_word: ἐντολὴ
  choice: आज्ञा
  rationale: यह मूसा की व्यवस्था की किसी विधिक आज्ञा को दर्शाता है। ‘आज्ञा’ सामान्य पाठक के लिए स्पष्ट है और धार्मिक-साहित्यिक संदर्भ भी बनाए रखता है।
- source_word: μεγάλη
  choice: सबसे बड़ी
  rationale: यूनानी में विशेषण सकारात्मक रूप ‘बड़ी’ में है, पर इस प्रश्न में उसका स्वाभाविक अर्थ आज्ञाओं के बीच प्रधानता पूछना है। हिन्दी में ‘सबसे बड़ी’ उस संदर्भगत तुलनात्मक भाव को स्पष्ट और सहज रूप से व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐν τῷ νόμῳ
  choice: व्यवस्था में
  rationale: यहाँ νόμος विशेष रूप से यहूदी धर्मग्रंथ की व्यवस्था, अर्थात मूसा की व्यवस्था, को सूचित करता है। हिन्दी बाइबल परंपरा में ‘व्यवस्था’ सुलभ और मान्य पद है।
theological_decisions:
- issue: μεγάλη को सकारात्मक विशेषण मानकर ‘बड़ी’ कहना या संदर्भगत प्रधानता के अर्थ में ‘सबसे बड़ी’ कहना
  choice: सबसे बड़ी
  alternative: बड़ी
  rationale: मूल यूनानी में स्पष्ट सर्वोत्तमावस्था का रूप नहीं है, इसलिए उसका व्याकरणिक तनाव वास्तविक है। फिर भी अनेक आज्ञाओं में से प्रधान आज्ञा पूछने के संदर्भ में आधुनिक हिन्दी का स्वाभाविक प्रश्न ‘सबसे बड़ी’ है। शाब्दिक सकारात्मक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और सम्मानपूर्ण रखी गई है। ‘गुरु’ संबोधन को ‘हे गुरु’ की अपेक्षा अधिक स्वाभाविक संवादात्मक हिन्दी में रखा गया है। ‘व्यवस्था’ को विशिष्ट धर्मग्रंथीय अर्थ में प्रयोग किया गया है।
