  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: hi
  text: स्वर्ग के राज्य की तुलना एक राजा से की गई, जिसने अपने पुत्र के लिए विवाह-भोज आयोजित किया[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्ग के राज्य की तुलना एक राजा से की जा सकती है।” यूनानी क्रिया का रूप शाब्दिक रूप से “तुलना की गई” या “समान किया गया” है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “विवाहों” (बहुवचन) है; यह विवाह के उत्सवों या विवाह-भोज के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: के समान ठहराया गया
  rationale: यह ὁμοιόω का एओरिस्ट कर्मवाच्य रूप है। यह अनुवाद कर्मवाच्य को बनाए रखता है और परिचित दृष्टान्तीय तुलना को स्वाभाविक हिन्दी में व्यक्त करता है; ‘के समान है’ अधिक सहज है, पर मूल के भूतकालीन कर्मवाच्य रूप को समतल कर देता है।
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: यह मत्ती की विशिष्ट अभिव्यक्ति को बनाए रखने वाला स्थापित और सहज हिन्दी रूप है; इसे ‘परमेश्वर का राज्य’ कहकर अन्य सुसमाचारों की भाषा से नहीं मिलाया गया।
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: एक ऐसे राजा
  rationale: यूनानी में ἄνθρωπος और βασιλεύς साथ हैं, पर यहाँ उनका स्वाभाविक अर्थ ‘एक राजा’ है। ‘एक मनुष्य, अर्थात् एक राजा’ हिन्दी में अनावश्यक रूप से बोझिल होता; ‘ऐसे’ अगले सम्बन्धवाचक उपवाक्य को सहजता से जोड़ता है।
- source_word: ὅστις
  choice: जिसने
  rationale: सम्बन्धवाचक सर्वनाम का साधारण और स्वाभाविक हिन्दी रूप; यहाँ अतिरिक्त बल देना आवश्यक नहीं है।
- source_word: ἐποίησεν γάμους
  choice: विवाह-भोज आयोजित किया
  rationale: ποιέω के साथ बहुवचन γάμους विवाह के उत्सव अथवा भोज का मुहावरेदार अर्थ देता है। ‘आयोजित किया’ राजा द्वारा समारोह कराने की क्रिया को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: τῷ υἱῷ αὐτοῦ
  choice: अपने पुत्र के लिए
  rationale: सम्बन्धसूचक सर्वनाम कर्ता की ओर लौटता है, इसलिए ‘अपने’; सम्प्रदान कारक पुत्र के हित अथवा अवसर के लिए किए गए आयोजन को दर्शाता है।
theological_decisions:
- issue: ‘स्वर्ग का राज्य’ की प्रकृति
  choice: मत्ती की अभिव्यक्ति ‘स्वर्ग का राज्य’ को यथावत रखना
  alternative: ‘परमेश्वर का राज्य’ या ‘स्वर्ग का शासन’
  rationale: मूल की साहित्यिक और धर्मवैचारिक विशिष्टता बनी रहती है तथा ‘राज्य’ में शासन और क्षेत्र—दोनों सम्भावित पहलुओं को समय से पहले सीमित नहीं किया जाता।
- issue: दृष्टान्तीय तुलना का काल और वाच्य
  choice: ‘के समान ठहराया गया’
  alternative: ‘के समान है’ या ‘की तुलना की जा सकती है’
  rationale: मूल का एओरिस्ट कर्मवाच्य सुरक्षित रहता है; वैकल्पिक वर्तमान या संभावनार्थक रूप अर्थ को अधिक व्याख्यायित करते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘विवाह-भोज’ मूल के उत्सवी आशय को संक्षेप में व्यक्त करता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
