  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: hi
  text: 'उस दिन सदूकी, जो कहते हैं कि पुनरुत्थान नहीं है, यीशु के पास आए और उन्होंने उससे प्रश्न किया:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: उसी दिन
  rationale: यह स्वाभाविक हिन्दी काल-सूचक अभिव्यक्ति है और कथा के उसी दिन की ओर संकेत को स्पष्ट रखती है।
- source_word: προσῆλθον αὐτῷ
  choice: यीशु के पास आए
  rationale: προσέρχομαι का अर्थ यहाँ किसी के पास आना है। संदर्भ की स्पष्टता के लिए सर्वनाम के स्थान पर ‘यीशु’ रखा गया है।
- source_word: Σαδδουκαῖοι
  choice: सदूकी
  rationale: इस यहूदी धार्मिक समूह के नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: λέγοντες μὴ εἶναι ἀνάστασιν
  choice: उनका कहना था कि मरे हुओं का पुनरुत्थान नहीं होता
  rationale: वर्तमान कृदंत उनके पहचाने जाने वाले मत को व्यक्त करता है। ‘उनका कहना था’ कथाकार की सूचना और सदूकियों के दावे के बीच अंतर बनाए रखता है। संदर्भ के अनुरूप ‘मरे हुओं का’ जोड़ने से पुनरुत्थान का आशय सामान्य पाठक के लिए स्पष्ट होता है।
- source_word: ἀνάστασιν
  choice: पुनरुत्थान
  rationale: यह इस प्रसंग में प्रयुक्त मानक धर्मवैचारिक शब्द है और मृतकों के फिर जीवित होने का भाव रखता है।
- source_word: ἐπηρώτησαν αὐτόν
  choice: उन्होंने यीशु से यह प्रश्न किया
  rationale: ἐπερωτάω यहाँ पूछने या प्रश्न करने को दर्शाता है। अगले पद में आने वाले प्रश्न की भूमिका के रूप में यह हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: सदूकियों द्वारा पुनरुत्थान के इनकार का निरूपण
  choice: उनका कहना था कि मरे हुओं का पुनरुत्थान नहीं होता
  alternative: सदूकी, जो कहते हैं कि मरे हुओं का पुनरुत्थान नहीं होता
  rationale: मुख्य पाठ इसे सदूकियों का मत बताता है, कथाकार की स्वीकृति नहीं। वैकल्पिक संबंधवाचक रचना समूह की स्थायी पहचान को अधिक प्रत्यक्ष बनाती है; दोनों अर्थों को पाद-टिप्पणी द्वारा सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुनरुत्थान’ मानक बाइबलीय शब्द है; ‘मरे हुओं का’ उसके आशय को सामान्य पाठक के लिए स्पष्ट करता है। अंतिम अर्धविराम के स्थान पर द्विबिंदु अगले पद में सीधे कथन की भूमिका बनाता है।
