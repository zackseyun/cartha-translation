source:
  edition: SBLGNT
  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: hi
  text: 'और मरे हुओं के जी उठने के विषय में, क्या तुमने वह नहीं पढ़ा जो परमेश्वर ने तुमसे कहा था[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो परमेश्वर की ओर से तुमसे कहा गया था:”
    reason: मूल यूनानी में यह वाक्यांश कर्मवाच्य है; मुख्य पाठ स्वाभाविक हिन्दी के लिए उसका अर्थ कर्तृवाच्य में देता है।
lexical_decisions:
- source_word: περὶ δὲ
  choice: और … के विषय में
  rationale: περί संबंध या विषय प्रस्तुत करता है, जबकि δέ प्रसंग में अगले बिंदु की ओर संक्रमण दिखाता है। ‘और … के विषय में’ इस बदलाव को स्वाभाविक ढंग से व्यक्त करता है, बिना अनावश्यक विरोध या कालसूचक ‘अब’ जोड़े।
- source_word: τῆς ἀναστάσεως τῶν νεκρῶν
  choice: मरे हुओं के जी उठने
  rationale: यह पदबंध उन लोगों के पुनः जीवित होने की बात करता है जो मर चुके हैं। ‘मरे हुओं का जी उठना’ आधुनिक हिन्दी में स्पष्ट और सामान्य पाठक के लिए सहज है।
- source_word: οὐκ ἀνέγνωτε
  choice: क्या तुमने … नहीं पढ़ा
  rationale: नकारात्मक प्रश्न यीशु की आलंकारिक चुनौती को बनाए रखता है और शास्त्र से श्रोताओं की अपेक्षित परिचितता व्यक्त करता है।
- source_word: τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ
  choice: जो परमेश्वर ने तुमसे कहा था
  rationale: यूनानी का कर्मवाच्य रूप परमेश्वर को कथन का कर्ता और श्रोताओं को उसका संबोधित समुदाय बताता है। हिन्दी में कर्तृवाच्य अधिक स्वाभाविक है और दोनों अर्थगत तत्व सुरक्षित रखता है।
- source_word: λέγοντος
  choice: 'कहा था … :'
  rationale: वर्तमान कृदन्त आगे आने वाले सीधे उद्धरण का परिचय देता है। हिन्दी में ‘कहा था:’ के बाद द्विबिंदु इस संबंध को स्वाभाविक और स्पष्ट बनाता है।
theological_decisions:
- issue: परमेश्वर का कथन और शास्त्र द्वारा वर्तमान संबोधन
  choice: जो परमेश्वर ने तुमसे कहा था
  alternative: जो परमेश्वर की ओर से तुमसे कहा गया था
  rationale: मूल पाठ शास्त्र में लिखी बात को परमेश्वर का कथन और यीशु के श्रोताओं को उसका प्राप्तकर्ता प्रस्तुत करता है। कर्तृवाच्य हिन्दी में सहज है, जबकि पादटिप्पणी मूल के कर्मवाच्य रूप को दिखाती है; कोई अतिरिक्त प्रेरणा-सिद्धान्त नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘मरे हुओं के जी उठने’ से पारंपरिक धार्मिक आशय स्पष्ट रहता है, फिर भी अभिव्यक्ति सामान्य पाठक के लिए सहज है।
