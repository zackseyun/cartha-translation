lexical_decisions:
- source_word: ὁμοίως
  choice: इसी प्रकार
  rationale: यह क्रिया-विशेषण पिछले पद में बताई गई घटना को आगे के भाइयों पर भी लागू करता है; ‘इसी प्रकार’ उस संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: καὶ ὁ δεύτερος καὶ ὁ τρίτος
  choice: दूसरे और तीसरे के साथ भी
  rationale: लेख सहित क्रमवाचक विशेषण यहाँ संज्ञा के रूप में प्रयुक्त हैं। संदर्भ से ‘भाई’ समझ में आता है, इसलिए उसे जोड़े बिना हिन्दी में स्वाभाविक वाक्य-विन्यास रखा गया है; ‘भी’ पहले καὶ का भाव व्यक्त करता है।
- source_word: ἕως τῶν ἑπτά
  choice: सातों तक
  rationale: यह पदबंध क्रम के सातों भाइयों तक पहुँचने को दर्शाता है। ‘सातों तक’ यूनानी के सामूहिक आशय को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
