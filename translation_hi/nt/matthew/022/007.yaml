source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: hi
  text: पर राजा क्रोधित हो गया। उसने अपनी सेनाएँ भेजकर उन हत्यारों का नाश कर दिया और उनके नगर को जला दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: क्रोधित हो गया
  rationale: क्रोध की अवस्था में आने को स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: अपनी सेनाएँ
  rationale: बहुवचन στρατεύματα को बनाए रखता है; यहाँ राजा की सैन्य टुकड़ियाँ अभिप्रेत हैं।
- source_word: ἀπώλεσεν
  choice: नाश कर दिया
  rationale: संदर्भ में हिंसक विनाश/वध का अर्थ व्यक्त करता है और अगले समानांतर कर्म से सहज जुड़ता है।
- source_word: τοὺς φονεῖς ἐκείνους
  choice: उन हत्यारों
  rationale: ἐκείνους की संकेतात्मक शक्ति और φονεῖς का स्पष्ट अर्थ सुरक्षित रखता है।
- source_word: τὴν πόλιν αὐτῶν ἐνέπρησεν
  choice: उनके नगर को जला दिया
  rationale: नगर में आग लगाने और उसे जलाने का आशय संक्षिप्त, स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: दृष्टान्त में राजा के क्रोध और दंड का वर्णन
  choice: कथन को प्रत्यक्ष ऐतिहासिक-वर्णनात्मक शैली में रखा गया है
  alternative: व्याख्यात्मक भाषा जोड़कर इसे परमेश्वर के न्याय से स्पष्टतः जोड़ना
  rationale: पद स्वयं राजा के कार्यों का वर्णन करता है; अन्तर्निहित धार्मिक अर्थ को अनावश्यक रूप से स्पष्ट करके दृष्टान्त की तनावपूर्ण प्रतीकात्मकता को सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ग्रीक participle πέμψας को हिन्दी के संयुक्त क्रियात्मक रूप ‘भेजकर’ से व्यक्त किया गया है, जिससे मूल वाक्य का कार्य-क्रम और संक्षिप्तता बनी रहती है।
