translation:
  language: hi
  text: और उनमें से एक, जो व्यवस्था का विशेषज्ञ[a] था, ने उसे परखने के इरादे से यीशु से पूछा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘व्यवस्था का जानकार।’ यूनानी शब्द यहूदी व्यवस्था के एक विशेषज्ञ को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक पिछले प्रसंग से कथा का सीधा संबंध बनाए रखता है और यूनानी से अधिक कालगत अर्थ नहीं जोड़ता।
- source_word: ἐπηρώτησεν
  choice: उससे पूछा
  rationale: क्रिया का अर्थ पूछना या प्रश्न करना है। हिंदी में ‘उससे पूछा’ स्वाभाविक है और मूल में अलग से ‘प्रश्न’ संज्ञा न होने का सम्मान करता है।
- source_word: εἷς ἐξ αὐτῶν
  choice: उनमें से एक
  rationale: यह अंशवाची अभिव्यक्ति स्वाभाविक हिंदी में बताती है कि वह व्यक्ति पहले उल्लिखित समूह में से था।
- source_word: νομικὸς
  choice: व्यवस्था का विशेषज्ञ
  rationale: यहाँ शब्द यहूदी अर्थात मूसा की व्यवस्था के जानकार को दर्शाता है। ‘वकील’ आधुनिक पाठक को अदालत या नागरिक कानून का पेशेवर समझा सकता है।
- source_word: πειράζων
  choice: उसे परखने के लिए
  rationale: कृदंत यहाँ पूछने के उद्देश्य को व्यक्त करता है। ‘परखने’ में प्रतिकूल जाँच की छाया बनी रहती है, जबकि ‘प्रलोभन देने’ से पाप के लिए उकसाने का अनावश्यक संकीर्ण अर्थ आ सकता है।
- source_word: αὐτόν
  choice: उसे
  rationale: यह सीधा कर्म यीशु की ओर संकेत करता है।
theological_decisions:
- issue: यीशु के संबंध में πειράζων का अर्थ
  choice: उसे परखने के लिए
  alternative: उसे परीक्षा में डालते हुए / उसे लुभाते हुए
  rationale: यूनानी शब्द परखने, आज़माने या परीक्षा में डालने का अर्थ दे सकता है। इस प्रसंग में विरोधपूर्ण जाँच अभिप्रेत है; चुना हुआ अनुवाद यही भाव रखता है, पर पाप के लिए लुभाने का अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘व्यवस्था’ मसीही बाइबिलीय प्रयोग में मूसा की व्यवस्था को सूचित करती है; पादटिप्पणी νομικός का ऐतिहासिक आशय स्पष्ट करती है।
