id: MAT.22.29
reference: Matthew 22:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: hi
  text: परन्तु यीशु ने उन्हें उत्तर दिया, “तुम भूल में हो[a], क्योंकि तुम न तो पवित्र शास्त्रों को जानते हो, न परमेश्वर की सामर्थ्य को।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम धोखे में हो” अथवा “तुम गलत हो।”
    reason: Πλανᾶσθε के अर्थ-क्षेत्र में भूल करना, धोखे में होना और भटकना सम्मिलित हैं; मुख्य पाठ ऐसा रूप चुनता है जो बाहरी छल को अनिवार्य नहीं बनाता।
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: परन्तु यीशु ने उन्हें उत्तर दिया
  rationale: यूनानी उत्तर-सूत्र ‘उत्तर देते हुए ... कहा’ को स्वाभाविक हिन्दी में अनावश्यक दोहराव के बिना व्यक्त किया गया है। δέ यहाँ हल्का विरोध अथवा प्रसंग-परिवर्तन दिखाता है, इसलिए ‘परन्तु’ उपयुक्त है।
- source_word: Πλανᾶσθε
  choice: तुम भूल में हो
  rationale: यह रूप उनके गलत निष्कर्ष अथवा भटके हुए विचार को दर्शाता है। ‘भूल में हो’ सहज आधुनिक हिन्दी है और केवल बाहरी छल का अर्थ आरोपित नहीं करता।
- source_word: μὴ εἰδότες
  choice: क्योंकि तुम ... नहीं जानते
  rationale: नकारात्मक कृदन्त उनके भूल में होने का कारण बताता है; ‘क्योंकि’ उस कारणात्मक संबंध को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: τὰς γραφὰς
  choice: पवित्र शास्त्रों
  rationale: यह बहुवचन यहूदी धर्मग्रन्थों के मान्य पवित्र लेखों की ओर संकेत करता है; ‘पवित्र शास्त्रों’ इसका प्रचलित और स्पष्ट हिन्दी रूप है।
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: न परमेश्वर की सामर्थ्य को
  rationale: μηδέ को पहले नकार के साथ ‘न तो ... न ...’ की युग्मित रचना में रखा गया है। δύναμις के लिए ‘सामर्थ्य’ परमेश्वर की प्रभावकारी शक्ति को गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: सदूकियों की भूल का कारण
  choice: यीशु उनकी भूल का कारण पवित्र शास्त्रों और परमेश्वर की सामर्थ्य—दोनों का ज्ञान न होना बताते हैं।
  alternative: वाक्य को केवल सामान्य आरोप मानना कि वे धोखे में हैं, बिना स्पष्ट कारणात्मक बल के।
  rationale: μὴ εἰδότες और उसके साथ जुड़े दोनों कर्म स्वाभाविक रूप से Πλανᾶσθε का कारण बताते हैं; अनुवाद इस संबंध को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पवित्र शास्त्रों’ और ‘परमेश्वर की सामर्थ्य’ जैसे परिचित धार्मिक पदों का प्रयोग किया गया है, जबकि वाक्य-रचना सामान्य पाठक के लिए सीधी रखी गई है।
