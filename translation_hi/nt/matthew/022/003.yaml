id: MAT.22.3
reference: Matthew 22:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: hi
  text: और उसने अपने सेवकों[a] को भेजा कि वे विवाह-भोज[c] में पहले से बुलाए गए लोगों[b] को बुलाएँ, पर वे आना नहीं चाहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दासों।’ यूनानी शब्द का अर्थ ‘सेवक’ या ‘दास’ दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘जिन्हें पहले निमंत्रण दिया गया था।’ यूनानी में यहाँ और ‘बुलाएँ’ के लिए एक ही क्रिया-परिवार प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘विवाह-उत्सव में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: यह ἀποστέλλω के भूतकालीन कथात्मक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: δούλους
  choice: सेवकों
  rationale: δοῦλος का अर्थ ‘दास’ या ‘सेवक’ हो सकता है। इस दृष्टान्त में राजा के प्रतिनिधियों के रूप में उनकी भूमिका प्रमुख है, इसलिए मुख्य पाठ में ‘सेवकों’ स्वाभाविक है; ‘दासों’ को पादटिप्पणी में रखा गया है।
- source_word: καλέσαι
  choice: बुलाएँ
  rationale: उद्देश्यसूचक infinitive को ‘कि वे ... बुलाएँ’ से व्यक्त किया गया है। इससे κεκλημένους के साथ मूल यूनानी की शब्दगत पुनरावृत्ति भी बनी रहती है।
- source_word: κεκλημένους
  choice: पहले से बुलाए गए लोगों
  rationale: Perfect passive participle पहले हो चुके और वर्तमान संदर्भ में प्रभावी बुलावे को दर्शाता है। ‘पहले से’ उस पूर्व निमंत्रण को स्पष्ट करता है, जबकि ‘बुलाए’ καλέω की पुनरावृत्ति बचाए रखता है।
- source_word: εἰς τοὺς γάμους
  choice: विवाह-भोज में
  rationale: बहुवचन γάμοι यहाँ विवाह के उत्सव अथवा भोज को सूचित करता है। ‘विवाह-भोज’ प्रसंग को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: वे आना नहीं चाहते थे
  rationale: यह अनुवाद इच्छा या अनिच्छा पर यूनानी बल को बनाए रखता है। ‘उन्होंने आने से इनकार किया’ सम्भव है, पर मूल से कुछ अधिक प्रबल होगा।
theological_decisions:
- issue: दृष्टान्त में δοῦλος का अनुवाद
  choice: सेवक
  alternative: दास
  rationale: यहाँ कथानक का जोर उनकी बंधुआ सामाजिक स्थिति पर नहीं, बल्कि राजा द्वारा भेजे गए प्रतिनिधियों की भूमिका पर है। फिर भी यूनानी शब्द की दूसरी वास्तविक सम्भावना पादटिप्पणी में सुरक्षित है।
- issue: καλέω शब्द-परिवार की पुनरावृत्ति
  choice: ‘बुलाए गए’ और ‘बुलाएँ’
  alternative: ‘निमंत्रित लोगों को बुलाएँ’
  rationale: एक ही हिन्दी क्रिया का प्रयोग मूल पाठ की जानबूझकर की गई पुनरावृत्ति और पहले दिए गए बुलावे—दोनों को बनाए रखता है; ‘पहले से’ समय-संबंध स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पहले से बुलाए गए’ साधारण हिन्दी में पूर्व निमंत्रण को स्पष्ट करता है, और ‘आना नहीं चाहते थे’ मूल के इच्छासूचक भाव को बिना अधिक कठोर बनाए व्यक्त करता है।
