lexical_decisions:
- source_word: λέγων
  choice: यह कहते हुए
  rationale: वर्तमान कृदंत यीशु के आगे आने वाले प्रश्न को प्रस्तुत करता है; यह रूप यूनानी संरचना को बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: Τί ὑμῖν δοκεῖ
  choice: तुम क्या सोचते हो
  rationale: यह पदबंध श्रोताओं की राय या निर्णय पूछता है; चुना हुआ रूप सहज आधुनिक हिन्दी है।
- source_word: περὶ τοῦ χριστοῦ
  choice: मसीह के विषय में
  rationale: यहाँ Χριστός एक उपाधि के रूप में यहूदी मसीहाई चर्चा में प्रयुक्त है, इसलिए ‘मसीह’ उपयुक्त है।
- source_word: τίνος υἱός ἐστιν
  choice: वह किसका पुत्र है
  rationale: प्रश्न वंशगत संबंध पूछता है; ‘वह’ का संकेत मसीह की ओर है और υἱός का पुत्र-संबंध स्पष्ट रखता है।
- source_word: λέγουσιν αὐτῷ
  choice: उन्होंने उससे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को पठनीय हिन्दी कथन में सामान्य भूतकाल से व्यक्त किया गया है; αὐτῷ को ‘उससे’ रखा गया है।
- source_word: Τοῦ Δαυίδ
  choice: दाऊद का
  rationale: यूनानी उत्तर में संज्ञा लुप्त है और प्रश्न से समझी जाती है; हिन्दी का संक्षिप्त उत्तर भी वही अपूर्णता स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ शब्द व्यक्तिगत नाम की तरह नहीं, प्रत्याशित अभिषिक्त जन की उपाधि के रूप में आया है। ‘मसीह’ आधुनिक हिन्दी के पाठकों के लिए इसी अर्थ को अधिक सीधे व्यक्त करता है; वैकल्पिक पारंपरिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और संवादात्मक रखी गई है। ‘के विषय में’ प्रश्न की औपचारिकता को बनाए रखता है, जबकि ‘तुम क्या सोचते हो?’ सामान्य पाठक के लिए सहज है।
