  text: Last of all[a], the woman died.
translation:
  language: hi
  text: अन्त में वह स्त्री भी मर गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον δὲ πάντων
  choice: अन्त में
  rationale: ὕστερον के साथ πάντων पूरे क्रम के सबसे अन्तिम चरण को दर्शाता है। आधुनिक हिन्दी में “अन्त में” इस सारांशात्मक क्रम को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है; δέ का हल्का संयोजक बल वाक्य-प्रवाह में समाहित है।
- source_word: ἀπέθανεν
  choice: मर गई
  rationale: क्रिया साधारण रूप से मृत्यु की घटना बताती है। “मर गई” सीधा और स्वाभाविक हिन्दी रूप है तथा अनावश्यक शिष्टोक्ति से बचता है।
- source_word: ἡ γυνή
  choice: वह स्त्री
  rationale: γυνή का अर्थ “स्त्री” या “पत्नी” हो सकता है। यहाँ कई भाइयों से विवाह करने वाली पहले उल्लिखित स्त्री अभिप्रेत है, इसलिए “वह स्त्री” यूनानी संदर्भ को स्पष्ट रखता है और किसी एक पुरुष की पत्नी होने का दृष्टिकोण नहीं थोपता।
- source_word: καί (implicit in Hindi भी)
  choice: भी
  rationale: 'यूनानी में अलग καί नहीं है, पर πάντων के साथ अन्तिम घटना के रूप में स्त्री की मृत्यु बताने का समावेशी भाव हिन्दी में “भी” से स्वाभाविक रूप से प्रकट होता है: भाइयों के बाद वह स्त्री भी मरी।'
