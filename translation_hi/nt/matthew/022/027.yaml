  source_fidelity: 'The Hindi accurately conveys ὕστερον δὲ πάντων ἀπέθανεν ἡ γυνή: “अन्त में” expresses the concluding sequence of ὕστερον ... πάντων, and “वह स्त्री ... मर गई” faithfully renders the referential γυναί and the plain statement of death. “भी” is a contextually natural Hindi way to mark that, after the previously mentioned men, the woman also died; it does not alter the sense.'
