  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: hi
  text: तो पुनरुत्थान में वह उन सातों में से किसकी पत्नी होगी? क्योंकि उन सातों ने उससे विवाह किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में शाब्दिक रूप से: “क्योंकि उन सभी ने उसे रखा था” अथवा “वह उन सभी की थी”; इस वैवाहिक संदर्भ में अर्थ है कि सातों ने उससे विवाह किया था।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάσει
  choice: पुनरुत्थान में
  rationale: ἐν के साथ यह पद समय अथवा परिस्थिति बताता है। संदर्भ में ἀνάστασις मृतकों के भावी पुनरुत्थान को सूचित करता है, इसलिए प्रचलित और स्पष्ट शब्द ‘पुनरुत्थान’ उपयुक्त है।
- source_word: οὖν
  choice: तो
  rationale: यह पिछले कथन से निकलने वाले निष्कर्षात्मक प्रश्न को जोड़ता है। आधुनिक हिन्दी में ‘तो’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τίνος τῶν ἑπτὰ
  choice: उन सातों में से किसकी
  rationale: सम्बन्धवाचक प्रश्न और सात व्यक्तियों के समूह में से चुनाव—दोनों को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: γυνή
  choice: पत्नी
  rationale: γυνή का अर्थ ‘स्त्री’ भी हो सकता है, पर वैवाहिक संदर्भ में यहाँ ‘पत्नी’ निश्चित रूप से अपेक्षित है।
- source_word: ἔσται
  choice: होगी
  rationale: भविष्यकाल को सरल और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πάντες γὰρ
  choice: क्योंकि वे सभी
  rationale: γάρ प्रश्न का आधार बताता है और πάντες सातों भाइयों को सामूहिक रूप से संदर्भित करता है।
- source_word: ἔσχον αὐτήν
  choice: उसे पत्नी बना चुके थे
  rationale: यूनानी में शब्दशः ‘उसे रखा/पाया था’ है, पर वैवाहिक संदर्भ में आशय है कि हर भाई ने उससे विवाह किया था। चुना हुआ रूप हिन्दी में स्वाभाविक है और पूर्ण हो चुके क्रमिक विवाहों का भाव देता है; अधिक शब्दशः रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: सदूकियों के प्रश्न में ἀνάστασις का आशय
  choice: मृतकों का भावी पुनरुत्थान
  alternative: मृत्यु के बाद का कोई अस्पष्ट अस्तित्व
  rationale: आसपास का प्रसंग विशेष रूप से पुनरुत्थान पर सदूकियों की आपत्ति और यीशु के उत्तर से संबंधित है। ‘पुनरुत्थान’ उसी ठोस आशय को बिना अनावश्यक विस्तार के बनाए रखता है।
- issue: पुनरुत्थान में वैवाहिक संबंध की प्रश्नगत निरंतरता
  choice: प्रश्न को सदूकियों के अपने अनुमान के रूप में ज्यों का त्यों रखना
  alternative: आगे दिए जाने वाले यीशु के उत्तर के अनुसार प्रश्न को पहले से स्पष्ट या संशोधित करना
  rationale: यह पद विरोधियों का प्रश्न प्रस्तुत करता है। अनुवाद को उनकी मान्यता को न तो अनुमोदित करना चाहिए, न अगले उत्तर के आधार पर समय से पहले उसका समाधान करना चाहिए।
