  text: तब वह अपने सेवकों से कहता है, “विवाह-भोज तैयार है, पर जिन्हें निमंत्रित किया गया था[a], वे योग्य नहीं थे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्हें बुलाया गया था।” यूनानी कृदन्त का अधिक शाब्दिक अनुवाद इस प्रकार किया जा सकता है, पर इस भोज के प्रसंग में इसका अर्थ विवाह-भोज के लिए निमंत्रित लोग हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कथा में अगले घटनाक्रम का स्वाभाविक कालसूचक है और क्रम को स्पष्ट रखता है।
- source_word: λέγει
  choice: कहता है
  rationale: यूनानी ऐतिहासिक वर्तमान को वर्तमान काल में रखकर मूल की कथात्मक सजीवता सुरक्षित की गई है।
- source_word: δούλοις
  choice: सेवकों
  rationale: राजकीय दृष्टान्त के इस प्रसंग में यह स्वाभाविक हिन्दी है; बंधुआ स्थिति इस पद का मुख्य बिंदु नहीं है।
- source_word: Ὁ μὲν γάμος
  choice: विवाह-भोज
  rationale: यहाँ γάμος तैयार किए गए विवाह-समारोह के भोज को सूचित करता है; μὲν का विरोध आगे ‘पर’ द्वारा व्यक्त है।
- source_word: ἕτοιμός ἐστιν
  choice: तैयार है
  rationale: विशेषण और सहायक क्रिया का सीधा, स्वाभाविक अनुवाद।
- source_word: οἱ δὲ κεκλημένοι
  choice: जिन्हें बुलाया गया था
  rationale: भोज के प्रसंग में καλέω का अर्थ निमंत्रण देना है; हिन्दी में ‘बुलाया गया’ निमंत्रण के अर्थ को रखते हुए ‘बुलाए हुए’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: οὐκ ἦσαν ἄξιοι
  choice: वे योग्य नहीं थे
  rationale: यह ἄξιος के मूल्यांकनात्मक बल को बनाए रखता है और उनकी अयोग्यता का कारण अपनी ओर से निर्धारित नहीं करता।
theological_decisions:
- issue: κεκλημένοι में ‘बुलाए गए’ और ‘निमंत्रित’ के बीच संभावित धार्मिक संकेत
  choice: मुख्य पाठ में ‘जिन्हें बुलाया गया था’
  alternative: जिन्हें निमंत्रित किया गया था
  rationale: तात्कालिक प्रसंग विवाह-भोज के निमंत्रण का है, फिर भी ‘बुलाया गया’ मूल क्रिया की व्यापकता और संभावित धर्मवैचारिक प्रतिध्वनि को दबाता नहीं। पादटिप्पणी प्रसंगगत अर्थ स्पष्ट करती है।
