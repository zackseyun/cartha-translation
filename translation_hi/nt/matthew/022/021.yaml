base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: hi
  text: उन्होंने उससे कहा, “कैसर का।” तब उसने उनसे कहा, “इसलिए जो कैसर का है, वह कैसर को दे दो[a], और जो परमेश्वर का है, वह परमेश्वर को दे दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लौटा दो,” “चुका दो,” अथवा “जिसका जो हक है उसे दे दो।” यूनानी क्रिया का अर्थ “वापस देना,” “चुकाना,” या “जिसका जो हक है उसे देना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: उन्होंने कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथन-शैली में सामान्य भूतकाल से व्यक्त किया गया है।
- source_word: αὐτῷ
  choice: उससे
  rationale: λέγουσιν के साथ दत्तिवाचक अप्रत्यक्ष कर्म को स्वाभाविक हिन्दी में ‘उससे’ कहा गया है।
- source_word: Καίσαρος
  choice: कैसर का
  rationale: सम्बन्धकारक रूप सिक्के पर अंकित छवि और लेख के स्वामी के विषय में निहित प्रश्न का संक्षिप्त उत्तर है; हिन्दी में यही स्वाभाविक और समान रूप से संक्षिप्त है।
- source_word: τότε
  choice: तब
  rationale: संवाद में अगले क्रमिक चरण को संक्षेप और स्वाभाविक रूप से दर्शाता है।
- source_word: λέγει
  choice: उसने कहा
  rationale: दूसरे यूनानी ऐतिहासिक वर्तमान को भी हिन्दी कथा-प्रवाह के अनुरूप भूतकाल में रखा गया है।
- source_word: Ἀπόδοτε
  choice: लौटा दो
  rationale: ἀποδίδωμι में किसी का हक या उसकी वस्तु उसे देने, वापस करने अथवा देय चुकाने का भाव हो सकता है। ‘लौटा दो’ सम्बन्धित स्वामित्व का भाव स्पष्ट रखता है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: οὖν
  choice: इसलिए
  rationale: यह उनके पिछले उत्तर से निकलने वाले निष्कर्ष को स्पष्ट करता है।
- source_word: τὰ Καίσαρος Καίσαρι
  choice: जो कुछ कैसर का है, वह कैसर को
  rationale: यूनानी नपुंसकलिंग बहुवचन और सम्बन्धकारक की व्यापकता को सहज हिन्दी में ‘जो कुछ ... का है’ से व्यक्त किया गया है और प्राप्तकर्ता का दत्तिवाचक अर्थ सुरक्षित है।
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: जो कुछ परमेश्वर का है, वह परमेश्वर को
  rationale: पहले खंड के साथ मूल का अलंकारिक समानांतर ढाँचा बनाए रखता है और θεός को यहूदी एकेश्वरवादी सन्दर्भ में मानक हिन्दी ‘परमेश्वर’ से व्यक्त करता है।
theological_decisions:
- issue: नागरिक और परमेश्वर के प्रति दायित्व के विषय में यीशु की आज्ञा का आशय
  choice: कैसर और परमेश्वर—दोनों को जो उनका है देने की समानांतर आज्ञा को बिना विस्तार के सुरक्षित रखा गया है।
  alternative: इसे केवल कर चुकाने की संकीर्ण आज्ञा मानना, अथवा राज्य के निरपेक्ष अधिकार का व्यापक समर्थन मानना।
  rationale: यूनानी पाठ नागरिक दायित्व और परमेश्वर के सर्वोच्च दावे के बीच भेद और तनाव रखता है, पर कोई पूर्ण राजनीतिक सिद्धान्त नहीं समझाता। अनुवाद उसी खुलेपन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जो कुछ ... का है’ से मूल के दोनों समानांतर खंड स्वाभाविक हिन्दी में सुरक्षित रहते हैं; ‘कैसर’ बाइबलीय-ऐतिहासिक पदवी का प्रचलित हिन्दी रूप है।
