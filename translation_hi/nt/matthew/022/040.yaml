  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: hi
  text: इन दो आज्ञाओं पर पूरी व्यवस्था और भविष्यद्वक्ता टिके हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “इन दो आज्ञाओं में पूरी व्यवस्था और भविष्यद्वक्ता लटके हैं।” “व्यवस्था और भविष्यद्वक्ता” शास्त्र के लिए एक स्थापित अभिव्यक्ति है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: इन्हीं दो आज्ञाओं पर
  rationale: यूनानी ἐν का मूल भाव ‘में’ है, पर κρέμαται के रूपक के साथ हिन्दी में ‘पर ... टिकी हैं’ निर्भरता को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है। ‘इन्हीं’ इन दो आज्ञाओं पर बल बनाए रखता है।
- source_word: ὅλος ὁ νόμος
  choice: पूरी व्यवस्था
  rationale: ὅλος एकवचन νόμος की समग्रता पर बल देता है। मत्ती के यहूदी-शास्त्रीय संदर्भ में ‘व्यवस्था’ तोराह अथवा उसके प्रामाणिक शिक्षण का संकेत करती है।
- source_word: κρέμαται
  choice: टिकी हैं
  rationale: κρέμαται का शाब्दिक अर्थ ‘लटकी है’ है और यहाँ आश्रित होने का रूपक है। हिन्दी में ‘पर टिकी हैं’ उसी रूपक और निर्भरता को अधिक स्वाभाविक ढंग से रखता है। संयुक्त कर्ता के अनुसार बहुवचन प्रयोग किया गया है।
- source_word: καὶ οἱ προφῆται
  choice: और भविष्यद्वक्ताओं की शिक्षाएँ
  rationale: ‘व्यवस्था और भविष्यद्वक्ता’ शास्त्र के लिए रूढ़ संक्षिप्त अभिव्यक्ति है। हिन्दी में केवल व्यक्तियों के इन दो आज्ञाओं पर टिकने की अनपेक्षित छवि से बचते हुए ‘शिक्षाएँ’ निहित साहित्यिक अर्थ स्पष्ट करती है।
theological_decisions:
- issue: ‘व्यवस्था और भविष्यद्वक्ता’ का आशय
  choice: व्यवस्था और भविष्यद्वक्ताओं में व्यक्त संपूर्ण शास्त्रीय साक्ष्य इन दो प्रेम-आज्ञाओं पर टिका है
  alternative: केवल नैतिक नियमों और भविष्यद्वक्ताओं की नैतिक शिक्षा का संकीर्ण संदर्भ
  rationale: मत्ती में यह एक स्थापित सूत्र है, जो प्रामाणिक शास्त्रीय साक्ष्य को समग्र रूप से सूचित करता है। मुख्य पाठ उस सूत्र को बनाए रखता है और ‘शिक्षाएँ’ उसके साहित्यिक आशय को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘टिकी हैं’ मूल के लटकने/निर्भर रहने के रूपक को स्वाभाविक हिन्दी में व्यक्त करता है; पादटिप्पणी अधिक शाब्दिक रूप और रूढ़ शास्त्रीय अभिव्यक्ति का आशय सुरक्षित रखती है।
