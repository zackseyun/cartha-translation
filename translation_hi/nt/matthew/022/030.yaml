id: MAT.22.30
reference: Matthew 22:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: hi
  text: क्योंकि पुनरुत्थान में वे न तो विवाह करते हैं और न विवाह के लिए दिए जाते हैं, बल्कि स्वर्ग में परमेश्वर के स्वर्गदूतों के समान होते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: पुनरुत्थान में
  rationale: यह यूनानी पूर्वसर्ग ἐν को स्वाभाविक रूप से दर्शाता है और पुनरुत्थित जीवन की अवस्था अथवा समय—दोनों की संभावित छाया को बनाए रखता है।
- source_word: γαμοῦσιν
  choice: विवाह करते हैं
  rationale: यह आधुनिक मानक हिन्दी में विवाह करने का सामान्य और स्वाभाविक प्रयोग है।
- source_word: γαμίζονται
  choice: विवाह में दिए जाते हैं
  rationale: निष्क्रिय क्रिया-रूप को अलग ढंग से व्यक्त करके γαμοῦσιν और γαμίζονται के बीच स्रोत-पाठ का भेद सुरक्षित रखा गया है।
- source_word: ὡς
  choice: के समान
  rationale: यह समानता बताता है, पहचान नहीं; मनुष्यों के स्वर्गदूत बन जाने का अर्थ आरोपित नहीं करता।
- source_word: ἄγγελοι θεοῦ
  choice: परमेश्वर के स्वर्गदूतों
  rationale: θεοῦ संबंधकारक को स्पष्ट रूप से व्यक्त करते हुए हिन्दी में स्वाभाविक पदबंध देता है।
- source_word: ἐν τῷ οὐρανῷ
  choice: स्वर्ग में
  rationale: इस प्रसंग में οὐρανός का आशय स्वर्गदूतों का स्वर्गीय निवास है, भौतिक आकाश नहीं।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के लिए दिए जा रहे कारण या स्पष्टीकरण के संबंध को साफ और सहज हिन्दी में प्रकट करता है।
theological_decisions:
- issue: स्वर्गदूतों के साथ तुलना का स्वरूप
  choice: पुनरुत्थित लोग विवाह न करने के संबंध में स्वर्गदूतों के समान हैं; पाठ उन्हें स्वर्गदूत बन जाने वाला नहीं कहता।
  alternative: तुलना को व्यापक स्वर्गदूतीय अस्तित्व का संकेत माना जा सकता है।
  rationale: ὡς तुलना सूचित करता है, और निकटवर्ती प्रसंग विवाह के अभाव को तुलना का स्पष्ट आधार बनाता है। ‘के समान’ समानता को सुरक्षित रखता है, पर अस्तित्वगत पहचान आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘विवाह में दिए जाते हैं’ रोज़मर्रा की हिन्दी से कुछ अधिक औपचारिक है, पर यूनानी की सक्रिय और निष्क्रिय विवाह-क्रियाओं का महत्वपूर्ण भेद सुरक्षित रखता है।
