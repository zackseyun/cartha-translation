review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the explanatory γάρ, the resurrection setting, the contrast between γαμοῦσιν and passive γαμίζονται, the comparative force of ὡς, and both ‘of God’ and ‘in heaven.’ However, ‘विवाह में दिए जाते हैं’ is not idiomatic Hindi for the passive marriage expression and can misleadingly suggest being placed within an already-existing marriage rather than being given for marriage.
  naturalness: ‘विवाह के लिए दिए जाते हैं’ is the established, clear Hindi expression and retains the passive distinction without unnecessary archaism. The remainder is modern, dignified, and readily understandable.
  terminology: ‘पुनरुत्थान,’ ‘परमेश्वर,’ ‘स्वर्गदूत,’ and ‘स्वर्ग’ are suitable standard biblical Hindi terms. ‘के समान’ appropriately preserves comparison rather than identity.
  issues:
  - severity: medium
    issue: The phrase ‘विवाह में दिए जाते हैं’ is unnatural and semantically imprecise in modern Hindi.
    rationale: The Greek γαμίζονται is passive and means ‘are given in marriage.’ In Hindi, ‘विवाह के लिए दिए जाते हैं’ naturally conveys this sense and preserves its distinction from ‘विवाह करते हैं.’
  revised_text: क्योंकि पुनरुत्थान में वे न तो विवाह करते हैं और न विवाह के लिए दिए जाते हैं, बल्कि स्वर्ग में परमेश्वर के स्वर्गदूतों के समान होते हैं।
