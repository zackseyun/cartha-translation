base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: hi
  text: परन्तु उन्होंने उस पर ध्यान नहीं दिया और चले गए[a]—एक अपने खेत की ओर और दूसरा अपने व्यापार के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसकी उपेक्षा की’ अथवा ‘उसकी परवाह नहीं की’; प्रसंग में संकेत राजा के निमंत्रण की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: उस पर ध्यान नहीं दिया
  rationale: यह कृदन्त उपेक्षा या परवाह न करने का भाव व्यक्त करता है। प्रसंग से इसका निहित विषय राजा का निमंत्रण है; ‘उस पर ध्यान नहीं दिया’ स्वाभाविक हिन्दी में वही अर्थ रखता है, बिना मुख्य पाठ में निमंत्रण को स्पष्ट रूप से जोड़ने के।
- source_word: ἀπῆλθον
  choice: चले गए
  rationale: यह बुलावे से हटकर अपने-अपने काम की ओर जाने की कथात्मक गति को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὃς μὲν ... ὃς δὲ
  choice: एक ... और दूसरा
  rationale: यह यूनानी वितरणात्मक-विरोधी रचना समूह के अलग-अलग व्यक्तियों और उनकी भिन्न दिशाओं को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: अपने खेत को
  rationale: ‘खेत’ ἀγρός का सीधा अर्थ है और ‘अपने’ ἴδιον को सुरक्षित रखता है, जिससे निजी सरोकार पर बल बना रहता है। गंतव्यसूचक ‘को’ संक्षिप्त, वर्तमान और प्रतिष्ठित हिन्दी प्रयोग है।
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: अपने व्यापार को
  rationale: ἐμπορία व्यापारिक गतिविधि या कारोबार को सूचित करता है। ‘व्यापार’ कृषि-कार्य के साथ मूल विरोध को स्पष्ट रखता है और ‘अपने’ αὐτοῦ को दर्शाता है।
theological_decisions:
- issue: ἀμελήσαντες का निहित कर्म
  choice: मुख्य पाठ में ‘उस पर ध्यान नहीं दिया’, जहाँ ‘उस’ का संकेत प्रसंग में राजा के निमंत्रण की ओर है।
  alternative: ‘निमंत्रण की उपेक्षा की’ या केवल ‘उपेक्षा करके’
  rationale: यूनानी में कर्म व्यक्त नहीं है, पर निकट प्रसंग उसे स्पष्ट करता है। सर्वनामयुक्त हिन्दी अर्थ को स्वाभाविक बनाती है, जबकि मूल की निहितता और व्याख्यात्मक खुलापन भी पर्याप्त रूप से बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर अपनाया गया है। ‘परन्तु’ से δέ का विरोध और दीर्घ विराम से आगे आने वाला वितरणात्मक विवरण स्पष्ट किया गया है।
