  text: λέγοντες· Διδάσκαλε, Μωϋσῆς εἶπεν· Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα, ἐπιγαμβρεύσει ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα αὐτοῦ καὶ ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: hi
  text: और कहने लगे, “गुरु, मूसा ने कहा था, ‘यदि कोई पुरुष निःसंतान मर जाए, तो उसका भाई मरे हुए पुरुष की पत्नी से विवाह करे[a] और अपने भाई के लिए संतान उत्पन्न करे।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक औपचारिक रूप में: “विधवा के प्रति पति के भाई का कर्तव्य निभाए।” यूनानी क्रिया विशेष रूप से मृत भाई की विधवा से विवाह करने के कर्तव्य को सूचित करती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: यह यीशु को शिक्षक के रूप में किया गया सीधा संबोधन है। ‘गुरु’ आधुनिक हिन्दी में स्वाभाविक, संक्षिप्त और गरिमापूर्ण है।
- source_word: Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα
  choice: यदि कोई पुरुष निःसंतान मर जाए
  rationale: कानूनी उदाहरण पुरुष के विषय में है और आगे उसके भाई की भूमिका आती है। ‘निःसंतान’ τέκνα के व्यापक अर्थ को रखता है और इसे केवल पुत्रों तक सीमित नहीं करता।
- source_word: ἐπιγαμβρεύσει
  choice: उसकी पत्नी से विवाह करे
  rationale: क्रिया विशेष रूप से मृत भाई की विधवा के साथ देवर-विवाह का कर्तव्य निभाने को सूचित करती है। मुख्य पाठ में सहज हिन्दी रखी गई है और विशिष्ट कानूनी अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: उसकी पत्नी
  rationale: यूनानी वाक्य-विन्यास मृत पुरुष की पत्नी को सीधे संदर्भित करता है; प्रसंग से स्पष्ट है कि वह अब विधवा है।
- source_word: ἀναστήσει σπέρμα
  choice: संतान उत्पन्न करे
  rationale: इस मुहावरे का आशय मृत भाई के नाम पर वंशज उत्पन्न करना है। यह चयन ‘बीज खड़ा करे’ जैसे अस्वाभाविक शाब्दिक अनुवाद से बचते हुए प्रजनन और वंश की धारणा बनाए रखता है।
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: अपने भाई के लिए
  rationale: 'सम्प्रदान कारक लाभ अथवा संबंध बताता है: संतान मृत भाई की ओर से और उसके वंश के लिए मानी जाएगी।'
theological_decisions:
- issue: मूसा की व्यवस्था के उदाहरण में लिंग-सूचक भाषा
  choice: ‘कोई पुरुष’ और ‘उसका भाई’ रखा गया
  alternative: ‘कोई व्यक्ति’ और लिंग-निरपेक्ष संबंधसूचक भाषा
  rationale: यहाँ उद्धृत देवर-विवाह की व्यवस्था विशेष रूप से मृत पुरुष, उसके भाई और उसकी विधवा की पारिवारिक भूमिकाओं में व्यक्त है; इसलिए स्रोत की पुरुषवाची संरचना को बनाए रखा गया है।
- issue: ἀναστήσει σπέρμα में संतान किसके लिए मानी जाती है
  choice: ‘अपने भाई के लिए संतान उत्पन्न करे’
  alternative: ‘अपने भाई का वंश चलाए’
  rationale: चुना हुआ पाठ संतान को मृत भाई के लिए माने जाने की कानूनी और पारिवारिक धारणा सुरक्षित रखता है, पर यह निर्धारित नहीं करता कि इसे जैविक, वंशावली या संपत्ति-अधिकार की किस एक श्रेणी में पूरी तरह समझा जाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरम्भ का ‘कहने लगे’ यूनानी बहुवचन λέγοντες को पिछले प्रसंग से जोड़ता है। ‘निःसंतान’ संक्षिप्त और सामान्यतः बोधगम्य है; ‘संतान उत्पन्न करे’ कानूनी कथन का आशय स्पष्ट करता है।
