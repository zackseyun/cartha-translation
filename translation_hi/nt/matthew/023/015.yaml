id: MAT.23.15
reference: Matthew 23:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: hi
  text: “हे शास्त्रियो और फरीसियो, कपटियो, तुम पर धिक्कार है! क्योंकि तुम एक मतानुयायी बनाने के लिए समुद्र और स्थल पर घूमते-फिरते हो; और जब वह मतानुयायी बन जाता है, तो तुम उसे तुम्हारी अपेक्षा दुगुना अधिक गेहन्ना का पुत्र बना देते हो।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नरक का पुत्र।” यूनानी में, “गेहन्ना का पुत्र।”
    reason: गेहन्ना पद के परिचित वैकल्पिक अनुवाद को देता है, जबकि मुख्य पाठ में मूल यूनानी पद और ‘पुत्र’ का मुहावरा सुरक्षित रखता है।
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: तुम पर धिक्कार है
  rationale: यह भविष्यद्वक्ताओं जैसी कड़ी निंदा और न्याय की चेतावनी व्यक्त करता है; केवल ‘हाय’ की अपेक्षा आधुनिक हिन्दी में अधिक स्पष्ट है।
- source_word: γραμματεῖς
  choice: शास्त्रियो
  rationale: यह यहूदी धर्मग्रंथ और व्यवस्था के मान्य विद्वानों के लिए प्रचलित तथा संक्षिप्त हिन्दी पद है।
- source_word: Φαρισαῖοι
  choice: फरीसियो
  rationale: यह यहूदी धार्मिक समूह के नाम का मानक हिन्दी लिप्यंतरण है।
- source_word: ὑποκριταί
  choice: कपटियो
  rationale: संबोधन में धार्मिक-मौलिक दिखावे और वास्तविक चरित्र के विरोध को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηράν
  choice: समुद्र और धरती छान मारते हो
  rationale: मूल में व्यापक भ्रमण और अत्यधिक प्रयास का भाव है; हिन्दी मुहावरा उस बल को सहज रूप से प्रकट करता है।
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: एक व्यक्ति को अपने मत में लाने के लिए
  rationale: προσήλυτος यहाँ किसी को धार्मिक समुदाय/मत में सम्मिलित कराने का संकेत देता है। यह सामान्य पाठक के लिए ‘धर्मांतरित’ या तकनीकी ‘प्रोसेलाइट’ से अधिक स्वाभाविक है, पर लक्ष्य को संकीर्ण रूप से किसी आधुनिक धर्मांतरण-पद्धति से नहीं बाँधता।
- source_word: ὅταν γένηται
  choice: जब वह बन जाता है
  rationale: मूल की संक्षिप्तता और पूर्ववर्ती ‘एक व्यक्ति’ से संबंध बनाए रखता है, बिना अनावश्यक पूर्ति के।
- source_word: υἱὸν γεέννης
  choice: गेहन्ना का पुत्र
  rationale: γεέννα को ऐतिहासिक-युगांतकारी पद ‘गेहन्ना’ के रूप में और सेमिटिक संबंधसूचक मुहावरे ‘पुत्र’ को यथावत रखा गया है।
- source_word: διπλότερον ὑμῶν
  choice: अपने से दुगुना
  rationale: तुलनात्मक अर्थ को स्पष्ट और संक्षिप्त हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: γεέννα का अनुवाद
  choice: गेहन्ना
  alternative: नरक
  rationale: मूल यूनानी का विशिष्ट यहूदी ऐतिहासिक और युगांतकारी पद बनाए रखा गया है; परिचित अर्थ फुटनोट में दिया गया है।
- issue: υἱὸν γεέννης का सेमिटिक मुहावरा
  choice: गेहन्ना का पुत्र
  alternative: गेहन्ना के योग्य व्यक्ति / नरक का भागी
  rationale: ‘पुत्र’ मूल के संबंध और चरित्र सूचक मुहावरे को खुला रखता है; व्याख्यात्मक विकल्प यह तय कर देते कि संबंध केवल नियति या योग्यता का है।
- issue: προσήλυτος की पहचान
  choice: अपने मत में लाया गया व्यक्ति
  alternative: यहूदी मत में आया हुआ व्यक्ति / धर्मांतरित / प्रोसेलाइट
  rationale: संदर्भ में शास्त्रियों और फरीसियों के प्रयास का लक्ष्य स्पष्ट किया गया है, किंतु मूल से आगे बढ़कर उसके औपचारिक दर्जे या प्रक्रिया को निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रत्यक्ष संबोधन में गरिमापूर्ण किंतु तीखी भविष्यद्वक्तीय निंदा। ‘समुद्र और धरती छान मारते हो’ व्यापक और कठिन प्रयास को स्वाभाविक हिन्दी में व्यक्त करता है। एकमात्र फुटनोट-चिह्न [a] मुख्य पाठ में उपस्थित है।
