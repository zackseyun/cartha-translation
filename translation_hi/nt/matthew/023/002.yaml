  source_fidelity: ‘शास्त्री और फ़रीसी मूसा के आसन पर बैठे हैं’ accurately represents οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι ἐπὶ τῆς Μωϋσέως καθέδρας ἐκάθισαν. ‘बैठे हैं’ idiomatically conveys their occupied/continuing position without importing the reflexive or polemical force that ‘अपने आपको बैठा लिया है’ would make explicit. The opening ‘उन्होंने कहा’ is a natural finite-clause rendering of λέγων in a verse segment whose antecedent is supplied by the preceding context.
  naturalness: The Hindi is clear, modern, and appropriately dignified. ‘मूसा के आसन पर’ preserves the authority metaphor naturally without unnecessarily suggesting a royal throne. ‘शास्त्री’ and ‘फ़रीसी’ are established biblical Hindi terms.
  terminology: 'Key names and group designations are handled consistently: Μωϋσῆς = ‘मूसा’, γραμματεῖς = ‘शास्त्री’, and Φαρισαῖοι = ‘फ़रीसी’. ‘आसन’ is a suitable rendering of καθέδρα in this teaching-authority context.'
