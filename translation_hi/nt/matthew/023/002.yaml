base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/002.yaml
  text: saying[a], “The scribes and the Pharisees sit in Moses’ seat.”
translation:
  language: hi
  text: उन्होंने कहा, “शास्त्री और फ़रीसी मूसा के आसन पर बैठे हैं।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मूसा के आसन पर बैठ गए हैं”; संभवतः “मूसा के आसन पर अपने आपको बैठा लिया है।” यूनानी क्रिया किसी अधिकारपूर्ण स्थान पर बैठने या उसे ग्रहण करने—दोनों अर्थों में समझी जा सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: उन्होंने कहा
  rationale: वर्तमान कृदंत पिछले पद में आए यीशु के बोलने से जुड़ा है। स्वतंत्र हिन्दी पद में ‘उन्होंने कहा’ उसी संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: मूसा के आसन पर
  rationale: यह पदबंध मूसा से संबद्ध शिक्षा और अधिकार के मान्य स्थान का रूपक है। ‘आसन’ आधुनिक हिन्दी में गरिमापूर्ण है और ‘पर’ यूनानी स्थान-संबंध को सहज रूप से व्यक्त करता है।
- source_word: ἐκάθισαν
  choice: बैठे हैं
  rationale: यूनानी अओरिस्ट यहाँ किसी आसन पर स्थान ग्रहण करने से उत्पन्न वर्तमान स्थिति को सूचित कर सकता है। ‘बैठे हैं’ हिन्दी में स्वाभाविक है और यह तय नहीं करता कि उन्होंने अधिकार स्वयं ग्रहण किया था या केवल उस स्थान पर विद्यमान हैं।
- source_word: οἱ γραμματεῖς
  choice: शास्त्री
  rationale: सुसमाचारों के संदर्भ में यह मूसा की व्यवस्था के लेखन और व्याख्या के विशेषज्ञ वर्ग के लिए प्रचलित, संक्षिप्त हिन्दी पद है।
- source_word: οἱ Φαρισαῖοι
  choice: फ़रीसी
  rationale: इस यहूदी समूह के नाम का मानक हिन्दी लिप्यंतरण।
theological_decisions:
- issue: क्या ἐκάθισαν को तटस्थ रूप से ‘बैठे हैं’ कहा जाए या स्वयं अधिकार ग्रहण करने के अर्थ में ‘अपने आपको बैठा लिया है’
  choice: बैठे हैं
  alternative: अपने आपको बैठा लिया है / बैठ गए हैं
  rationale: यूनानी क्रिया स्वयं-ग्रहण का भाव संभव बनाती है, पर उसे स्पष्ट रूप से व्यक्त नहीं करती। मुख्य पाठ में तटस्थ रूप और पादटिप्पणी में वैकल्पिक अर्थ रखने से यीशु द्वारा उनके अधिकार को मान्यता देने और उनके द्वारा अधिकार ग्रहण करने के बीच की व्याख्यात्मक कसौटी बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गद्दी’ के बजाय ‘आसन’ चुना गया है, क्योंकि इससे शिक्षकीय अधिकार का रूपक बना रहता है और राजसिंहासन का अनावश्यक संकेत नहीं आता।
