source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: hi
  text: “धिक्कार है तुम पर, शास्त्रियो और फरीसियो, कपटियो! क्योंकि तुम पुती हुई कब्रों के समान हो[a], जो बाहर से तो सुंदर दिखाई देती हैं, पर भीतर मरे हुओं की हड्डियों और हर प्रकार की अशुद्धता[b] से भरी होती हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् चूने से पुती हुई कब्रें।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “अशुद्धता” में धार्मिक अपवित्रता और नैतिक भ्रष्टता—दोनों का भाव हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ
  choice: धिक्कार है
  rationale: यह भविष्यद्वक्ताओं जैसी न्यायसूचक भर्त्सना की तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: γραμματεῖς
  choice: शास्त्रियो
  rationale: यह उस यहूदी विद्वान वर्ग का प्रचलित और संक्षिप्त हिन्दी पद है; संबोधन के कारण बहुवचन संबोधन रूप रखा गया है।
- source_word: Φαρισαῖοι
  choice: फरीसियो
  rationale: समूह-नाम का मानक हिन्दी रूप संबोधन बहुवचन में दिया गया है।
- source_word: ὑποκριταί
  choice: कपटियो
  rationale: यह धार्मिक और नैतिक दिखावे की निंदा को स्पष्ट तथा गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: παρομοιάζετε
  choice: के समान हो
  rationale: सीधे संबोधन में तुलना को सहज हिन्दी में रखता है और अनावश्यक कर्मवाच्य से बचता है।
- source_word: τάφοις κεκονιαμένοις
  choice: पुती हुई कब्रों
  rationale: κεκονιαμένοις चूने अथवा सफेदी से पोते जाने को दर्शाता है; ‘पुती हुई’ मुख्य पाठ में सहज है और पदार्थ की विशिष्टता पाद-टिप्पणी में सुरक्षित है।
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: बाहर से तो ... पर भीतर
  rationale: मूल के बाहरी रूप और भीतरी वास्तविकता के तीखे विरोध को स्वाभाविक हिन्दी संरचना में बनाए रखता है।
- source_word: φαίνονται ὡραῖοι
  choice: सुंदर दिखाई देती हैं
  rationale: दृश्य सुंदरता के साथ वास्तविकता के विपरीत केवल बाहरी आभास पर बल देता है।
- source_word: γέμουσιν
  choice: भरी होती हैं
  rationale: स्थिति-सूचक वर्तमान भाव को मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: ὀστέων νεκρῶν
  choice: मरे हुओं की हड्डियों
  rationale: यूनानी संबंधवाचक रचना का स्पष्ट, स्वाभाविक हिन्दी रूप है।
- source_word: πάσης ἀκαθαρσίας
  choice: हर प्रकार की अशुद्धता
  rationale: πάσης की व्यापकता तथा ἀκαθαρσία के धार्मिक और नैतिक दोनों संभावित आयामों को खुला रखता है।
theological_decisions:
- issue: ἀκαθαρσία का आशय
  choice: ‘अशुद्धता’ जैसा व्यापक पद
  alternative: केवल ‘धार्मिक अशुद्धता’ या केवल ‘नैतिक भ्रष्टता’
  rationale: कब्रों का चित्र यहूदी संदर्भ में धार्मिक अशुद्धता जगाता है, जबकि प्रसंग भीतरी नैतिक भ्रष्टता की भी निंदा करता है; व्यापक पद दोनों अर्थ-छायाओं का तनाव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधा, गंभीर और न्यायसूचक लहजा। ‘धिक्कार है’, ‘शास्त्रियो’, ‘फरीसियो’ और ‘कपटियो’ मूल संबोधन की तीव्रता बनाए रखते हैं। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में स्पष्ट रूप से दिए गए हैं।
