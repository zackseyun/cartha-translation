  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: hi
  text: ताकि पृथ्वी पर बहाया जा रहा धर्मियों का सारा खून तुम पर आ पड़े[a]—धर्मी हाबिल के खून से लेकर बरकयाह के पुत्र जकरयाह के खून तक—उस जकरयाह की तुमने पवित्रस्थान और वेदी के बीच हत्या की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भूमि पर।’ यूनानी शब्द का अर्थ ‘पृथ्वी’ या ‘भूमि’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: ताकि
  rationale: यह पिछले कथन से निकलने वाले उद्देश्य या परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: तुम पर आ पड़े
  rationale: ‘आना’ मूल क्रिया को रखता है, जबकि ‘आ पड़े’ हिन्दी में न्याय और उत्तरदायित्व के भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πᾶν αἷμα δίκαιον
  choice: सब धर्मियों का खून
  rationale: यूनानी में विशेषण ‘धर्मी’ लाक्षणिक रूप से ‘खून’ को विशेषित करता है; हिन्दी में आशय स्पष्ट और सहज रखने के लिए इसे धर्मी लोगों के खून के रूप में व्यक्त किया गया है।
- source_word: ἐκχυννόμενον
  choice: बहाया जा रहा
  rationale: वर्तमानकालिक कर्मवाच्य कृदन्त की जारी प्रक्रिया और खून बहाए जाने की सजीव छवि दोनों सुरक्षित रहती हैं।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: γῆ के व्यापक अर्थ ‘पृथ्वी’ को मुख्य पाठ में लिया गया है; ‘देश/भूमि’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: धर्मी हाबिल के खून से
  rationale: उपाधि ‘धर्मी’ और आरम्भ-बिन्दु बताने वाली संबंध-रचना दोनों स्वाभाविक हिन्दी में सुरक्षित हैं।
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: बरकयाह के पुत्र जकरयाह के खून तक
  rationale: ἀπό…ἕως की ‘से…तक’ सीमा-रचना को बनाए रखते हुए नामों का प्रचलित हिन्दी बाइबलीय रूप लिया गया है।
- source_word: ὃν ἐφονεύσατε
  choice: जिसकी तुमने हत्या की
  rationale: φονεύω सामान्यतः नैतिक रूप से दोषपूर्ण हत्या को सूचित करता है; ‘हत्या की’ इस आरोप को स्पष्ट रखता है।
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: पवित्रस्थान और वेदी के बीच
  rationale: ναός पूरे मन्दिर-परिसर के बजाय उसके पवित्र भवन/स्थान को सूचित करता है; ‘पवित्रस्थान’ इस संकुचित अर्थ को दर्शाता है।
theological_decisions:
- issue: बरकयाह के पुत्र जकरयाह की पहचान
  choice: यूनानी पाठ में दिए नाम को बिना सामंजस्य या संशोधन के बनाए रखा गया है।
  alternative: उसे नबी जकरयाह मानना, या 2 इतिहास 24:20–22 के यहोयादा के पुत्र जकरयाह से जोड़ना।
  rationale: ऐतिहासिक पहचान विवादित है। अनुवाद यूनानी पाठ को ज्यों का त्यों दर्शाता है और तनाव को चुपचाप हल करने के बजाय पादटिप्पणी में बताता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘खून’ सामान्य आधुनिक हिन्दी में प्रत्यक्ष और प्रभावी है; ‘पवित्रस्थान’ ναός को पूरे मन्दिर-परिसर से अलग करता है।
