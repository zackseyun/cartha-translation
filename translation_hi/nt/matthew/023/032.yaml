  verdict: revise
  source_fidelity: The draft correctly retains the aorist-imperative force of πληρώσατε and appropriately renders πατέρων contextually as “पूर्वजों.” However, “तुम भी” introduces an additive “also” not expressed by καὶ; the explicit ὑμεῖς is emphatic rather than additive. Further, “पैमाना भर दो” is not natural Hindi for completing an accumulated measure and can suggest filling a measuring instrument.
  naturalness: “अपने पूर्वजों का पैमाना भर दो” is understandable but awkward in modern standard Hindi. “अपने पूर्वजों का माप पूरा कर दो” more naturally conveys the idiomatic metaphor while retaining its deliberately unspecified object.
  terminology: “पूर्वजों” is a sound contextual rendering of πατέρων. “माप” is preferable here to “पैमाना,” since the Greek μέτρον denotes the measure/amount being brought to completion, not primarily the instrument used for measuring. The footnote may explain that the implied accumulation is guilt or wrongdoing without placing “पाप” in the main text.
  issues:
  - severity: medium
    issue: “भी” adds an unsupported additive sense.
    rationale: καὶ continues the discourse (“and”), while the explicit ὑμεῖς supplies emphasis. It does not require the Hindi additive particle “भी.”
  - severity: medium
    issue: “पैमाना भर दो” is an unnatural and potentially misleading Hindi metaphor.
    rationale: In Hindi, पैमाना commonly denotes a measuring standard or instrument. The object in Greek is the accumulated measure/amount, which “माप पूरा कर दो” conveys more idiomatically.
