translation:
  language: hi
  text: और तुम, अपने पूर्वजों का माप पूरा कर दो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पूर्वजों के पापों का माप पूरा कर दो।” यूनानी में शाब्दिक रूप से, “अपने पूर्वजों का माप पूरा कर दो” है। यह संचित दोष के अपनी सीमा तक पहुँचने का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और…भी
  rationale: यह पिछले कथन से संबंध बनाए रखता है; explicit ὑμεῖς के साथ ‘भी’ संबोधित लोगों पर बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑμεῖς
  choice: तुम
  rationale: स्पष्ट यूनानी सर्वनाम बलयुक्त है; ‘तुम भी’ उस बल को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: πληρώσατε
  choice: भर दो
  rationale: यह द्वितीय पुरुष बहुवचन अओरिस्ट आज्ञार्थक है। ‘भर दो’ आज्ञा और किसी मात्रा को उसकी सीमा तक पहुँचाने—दोनों भावों को सुरक्षित रखता है।
- source_word: τὸ μέτρον
  choice: पैमाना
  rationale: ‘पैमाना’ संचित मात्रा और उसकी सीमा के रूपक को बनाए रखता है; मुख्य पाठ में ‘पापों का पूरा पैमाना’ कहने से बचा गया है क्योंकि वह व्याख्यात्मक विस्तार होगा।
- source_word: τῶν πατέρων ὑμῶν
  choice: अपने पूर्वजों का
  rationale: संदर्भ में πατέρων जैविक पिता नहीं, पहले के पुरखों को दर्शाता है। ‘पूर्वजों’ से आधुनिक हिन्दी में आशय स्पष्ट रहता है, और ‘अपने’ सम्बन्ध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: 'यीशु के कथन का बल: आज्ञा या भविष्यवाणी'
  choice: 'विडंबनापूर्ण/न्यायिक बल वाली आज्ञा: ‘भर दो’'
  alternative: ‘तुम भर रहे हो’ या ‘भरोगे’ जैसी भविष्यवाणी
  rationale: πληρώσατε रूपतः द्वितीय पुरुष बहुवचन अओरिस्ट आज्ञार्थक है। इसलिए अनुवाद आज्ञा को बनाए रखता है, पर उसे साधारण नैतिक अनुमति में बदलकर नहीं समझाता; प्रसंग में उसकी निंदात्मक विडंबना और न्यायिक तनाव कायम रहते हैं।
- issue: ‘पैमाने’ में किस वस्तु का संचय है
  choice: 'मुख्य पाठ में केवल रूपक: ‘पूर्वजों का पैमाना’'
  alternative: ‘पूर्वजों के पापों/अपराध का पूरा पैमाना’
  rationale: प्रसंग संचित दोष या अपराध की ओर संकेत करता है, किंतु यूनानी में ‘पाप’ या ‘अपराध’ स्पष्ट रूप से नहीं है। इसलिए अर्थ को पादटिप्पणी में बताया गया है, मुख्य पाठ में जोड़ा नहीं गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘पूर्वज’ संदर्भगत अर्थ को स्पष्ट करता है; ‘पैमाना भर दो’ मूल रूपक और आज्ञार्थक तीखेपन को बनाए रखता है।
