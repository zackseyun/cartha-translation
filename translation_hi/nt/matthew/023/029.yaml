base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: hi
  text: “हे शास्त्रियो और फरीसियो, कपटियो, तुम पर हाय! क्योंकि तुम भविष्यद्वक्ताओं की कब्रें बनाते और धर्मियों के समाधि-स्मारकों[a] को सजाते हो,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्मारकों”; यूनानी शब्द कब्र, समाधि अथवा स्मरण के लिए बनाए गए स्मारक को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: तुम पर हाय!
  rationale: न्यायसूचक भविष्यद्वाणी की कठोर ध्वनि को बनाए रखता है; केवल ‘हाय’ कहने की अपेक्षा हिन्दी में संबोधन का लक्ष्य स्पष्ट करता है।
- source_word: γραμματεῖς
  choice: शास्त्रियो
  rationale: यहूदी धर्मग्रंथ और व्यवस्था के विशेषज्ञों के लिए हिन्दी बाइबलीय परंपरा में परिचित तथा संक्षिप्त पद है।
- source_word: Φαρισαῖοι
  choice: फरीसियो
  rationale: समूह-नाम का प्रचलित हिन्दी लिप्यंतरण, संबोधन बहुवचन में।
- source_word: ὑποκριταί
  choice: कपटियो
  rationale: धार्मिक और नैतिक दिखावे का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह निंदा का कारण प्रस्तुत करने वाले यूनानी causal संबंध को स्पष्ट रखता है।
- source_word: οἰκοδομεῖτε
  choice: बनाते हो
  rationale: वर्तमान काल की सामान्य या प्रचलित क्रिया को सहज हिन्दी में रखता है; ‘फिर से बनाते’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: τάφους
  choice: कब्रें
  rationale: निर्मित दफन-स्थलों के लिए सामान्य और स्पष्ट आधुनिक हिन्दी शब्द।
- source_word: κοσμεῖτε
  choice: सजाते हो
  rationale: किसी स्थल को अलंकृत या आकर्षक बनाने का सीधा, स्वाभाविक अर्थ देता है।
- source_word: μνημεῖα
  choice: समाधि-स्मारकों
  rationale: यहाँ τάφους ‘कब्रें’ से शब्दगत अंतर बनाए रखते हुए दफन-स्थल और स्मरण-चिह्न, दोनों संभावित भावों को जोड़ता है।
- source_word: δικαίων
  choice: धर्मियों
  rationale: पदार्थवाचक विशेषण को नैतिक रूप से धर्मी लोगों के अर्थ में संक्षिप्त और स्थापित हिन्दी धर्मशास्त्रीय शब्दावली द्वारा व्यक्त करता है।
theological_decisions:
- issue: δικαίων का अर्थ
  choice: धर्मियों
  alternative: न्यायियों / धर्मी लोगों
  rationale: संदर्भ में इस्राएल के अतीत के धर्मनिष्ठ जन अभिप्रेत हैं। ‘धर्मियों’ मूल की नैतिक-धार्मिक श्रेणी को सुरक्षित रखता है, पर किसी विशिष्ट उत्तरकालीन धर्मसिद्धांत को नहीं थोपता।
- issue: μνημεῖα और τάφους के बीच संबंध
  choice: कब्रें … समाधि-स्मारक
  alternative: कब्रें … स्मारक / कब्रें … कब्रें
  rationale: दो अलग यूनानी पदों का भेद दिखाई देता है, जबकि μνημεῖα में कब्र अथवा स्मारकीय समाधि—दोनों की अर्थ-संभावना बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गंभीर, भविष्यद्वाणी-सदृश और प्रत्यक्ष है। संबोधन के बहुवचन रूप ‘शास्त्रियो’, ‘फरीसियो’, ‘कपटियो’ रखे गए हैं। विराम-चिह्न ऐसा है कि ‘क्योंकि’ निंदा के कारण को उसी वाक्य में जोड़ता है।
