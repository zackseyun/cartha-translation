source:
  edition: SBLGNT
  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: hi
  text: वे भारी बोझ बाँधते हैं और उन्हें लोगों के कंधों पर रखते हैं, पर वे स्वयं उन्हें अपनी उँगली से भी हिलाना नहीं चाहते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: बाँधकर
  rationale: यह क्रिया बोझ को बाँधने या कसकर तैयार करने का ठोस चित्र देती है; ‘बाँधकर’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: φορτία βαρέα
  choice: भारी बोझ
  rationale: यह पदभार के वास्तविक चित्र और दमनकारी माँगों के रूपक—दोनों को बनाए रखता है।
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: कंधों पर रख देते हैं
  rationale: यह यूनानी में किसी वस्तु को किसी के ऊपर रखने की क्रिया और कंधों के ठोस चित्र को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τῶν ἀνθρώπων
  choice: लोगों के
  rationale: यहाँ ἀνθρώπων सामान्य रूप से मनुष्यों को सूचित करता है; ‘लोगों’ हिन्दी में प्रतिनिधिक और लिंग-समावेशी अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αὐτοὶ δὲ
  choice: पर वे स्वयं
  rationale: ‘स्वयं’ यूनानी सर्वनाम के बलाघात और दूसरों पर बोझ रखने वालों के साथ तीखे विरोध को बनाए रखता है।
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: अपनी उँगली से भी
  rationale: एकवचन ‘उँगली’ मूल रूप को बनाए रखता है, और ‘भी’ हिन्दी में न्यूनतम प्रयास तक न करने का निहित बल स्वाभाविक रूप से प्रकट करता है।
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: उन्हें ... हिलाना नहीं चाहते
  rationale: यह असमर्थता के बजाय जानबूझकर अनिच्छा को व्यक्त करता है और κινῆσαι के सामान्य अर्थ ‘हिलाना’ को सुरक्षित रखता है।
theological_decisions:
- issue: बोझों का शाब्दिक या रूपकात्मक अर्थ
  choice: ‘भारी बोझ’ के ठोस चित्र को बिना उसका आशय स्पष्ट करके बनाए रखा गया।
  alternative: इसे धार्मिक नियमों, कानूनी माँगों या दायित्वों के रूप में खुलकर समझाना।
  rationale: संदर्भ शास्त्रियों और फरीसियों द्वारा दूसरों पर दमनकारी दायित्व डालने की आलोचना करता है, पर पद स्वयं उनके स्वरूप को निर्दिष्ट नहीं करता; रूपक को खुला रखना अनावश्यक सिद्धान्तगत संकीर्णता से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ में सहज। ‘लोगों’ से यूनानी ἀνθρώπων का सामान्य मानवीय संदर्भ बिना आवश्यक फुटनोट के स्पष्ट होता है।
