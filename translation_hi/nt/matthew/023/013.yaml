source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: hi
  text: परन्तु हे कपटी शास्त्रियो और फरीसियो, तुम पर हाय! क्योंकि तुम लोगों के सामने स्वर्ग के राज्य का द्वार बंद कर देते हो; तुम स्वयं तो उसमें प्रवेश नहीं करते, और जो प्रवेश कर रहे हैं[a], उन्हें भी प्रवेश नहीं करने देते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो प्रवेश करने का प्रयत्न कर रहे हैं।” यूनानी कृदन्त प्रवेश की प्रक्रिया में लगे या प्रवेश चाहने वाले लोगों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ δὲ ὑμῖν
  choice: परन्तु ... तुम पर हाय!
  rationale: οὐαί की भविष्यद्वक्ताओं जैसी कठोर भर्त्सना को बनाए रखता है; δέ को इस शृंखला में संक्रमण/हल्के विरोध के रूप में ‘परन्तु’ से व्यक्त किया गया है।
- source_word: γραμματεῖς
  choice: शास्त्रियो
  rationale: सुसमाचारों के यहूदी संदर्भ में यह स्थापित, संक्षिप्त और सुबोध पद है; सम्बोधन के कारण बहुवचन सम्बोधन-रूप रखा गया है।
- source_word: Φαρισαῖοι
  choice: फरीसियो
  rationale: समूह के नाम का हिन्दी में प्रचलित लिप्यन्तरण, यहाँ सम्बोधन-रूप में।
- source_word: ὑποκριταί
  choice: कपटियो
  rationale: धार्मिक-मौलिक दिखावे और असल चरित्र के विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κλείετε
  choice: बन्द कर देते हो
  rationale: राज्य तक पहुँच रोकने के रूपक को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: मत्ती की विशिष्ट अभिव्यक्ति का हिन्दी में परिचित और स्वाभाविक रूप है; इससे ‘परमेश्वर का राज्य’ से कोई कृत्रिम धर्मवैज्ञानिक भेद नहीं बनाया गया।
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: लोगों के सामने
  rationale: स्थानिक रूपक—मानो प्रवेश-द्वार लोगों के सामने बन्द किया जा रहा हो—को बनाए रखता है; ἀνθρώπων को लिंग-निरपेक्ष ‘लोगों’ से व्यक्त किया है।
- source_word: εἰσέρχεσθε
  choice: प्रवेश नहीं करते
  rationale: राज्य में प्रवेश के रूपक को संक्षिप्त रूप से रखता है; हिन्दी में स्पष्टता के लिए ‘उसमें’ जोड़ा गया है।
- source_word: τοὺς εἰσερχομένους
  choice: जो प्रवेश कर रहे हैं
  rationale: वर्तमान कृदन्त की प्रक्रियात्मक अस्पष्टता को बनाए रखता है; यह प्रवेश की प्रक्रिया में लगे या प्रवेश का प्रयत्न कर रहे लोगों की ओर संकेत कर सकता है।
- source_word: ἀφίετε εἰσελθεῖν
  choice: प्रवेश नहीं करने देते
  rationale: अनुमति/अवरोध का अर्थ और εἰσελθεῖν का स्पष्ट ‘प्रवेश करना’ दोनों स्वाभाविक हिन्दी में सुरक्षित हैं।
theological_decisions:
- issue: βασιλεία τῶν οὐρανῶν का अनुवाद
  choice: स्वर्ग का राज्य
  alternative: स्वर्गों का राज्य
  rationale: परिचित हिन्दी अभिव्यक्ति मत्ती के अर्थ को सहजता से पहुँचाती है। यूनानी में ‘स्वर्गों’ बहुवचन है, पर यहाँ उससे अलग प्रकार के राज्य या किसी विशेष सम्प्रदायगत भेद का निष्कर्ष नहीं जोड़ा गया।
- issue: τοὺς εἰσερχομένους की प्रक्रियात्मक अस्पष्टता
  choice: जो प्रवेश कर रहे हैं
  alternative: जो प्रवेश करने का प्रयत्न कर रहे हैं
  rationale: मुख्य पाठ वर्तमान कृदन्त को निकटता से दर्शाता है और यह निर्णय नहीं करता कि प्रवेश वस्तुतः आरम्भ हो चुका है या उसका प्रयत्न चल रहा है; वैकल्पिक सम्भावना पाद-टिप्पणी में दी गई है।
- issue: अधिकार और अवरोध का सम्बन्ध
  choice: उन्हें भी प्रवेश नहीं करने देते
  alternative: उन्हें भीतर नहीं जाने देते
  rationale: ἀφίετε εἰσελθεῖν का सीधा अर्थ सुरक्षित रखा गया है, बिना यह मान लेने के कि नेताओं के पास राज्य में प्रवेश देने का अन्तिम धर्मवैज्ञानिक अधिकार है; कथन उनके द्वारा डाले गए अवरोध पर केन्द्रित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष और सार्वजनिक भर्त्सना के अनुकूल स्वर। ‘हे’ केवल सम्बोधन को स्पष्ट करने के लिए है। ‘शास्त्रियो’, ‘फरीसियो’ और ‘कपटियो’ में आधुनिक हिन्दी के सम्बोधन-बहुवचन रूप प्रयुक्त हैं।
