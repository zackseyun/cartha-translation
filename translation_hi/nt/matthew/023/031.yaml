  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: hi
  text: इस प्रकार तुम अपने ही विरुद्ध गवाही देते हो कि तुम उन लोगों के पुत्र हो जिन्होंने भविष्यद्वक्ताओं की हत्या की थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम अपने ही विषय में गवाही देते हो।” यूनानी पदबंध का अधिक शाब्दिक अनुवाद ऐसा हो सकता है, यद्यपि इस प्रसंग में उनकी गवाही स्वयं उन्हें दोषी ठहराती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: इस प्रकार
  rationale: यह पिछले कथन से निकलने वाले परिणाम या निष्कर्ष को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: μαρτυρεῖτε
  choice: गवाही देते हो
  rationale: यह क्रिया के साक्ष्य देने वाले अर्थ को बनाए रखता है और प्रसंग की न्यायिक ध्वनि से मेल खाता है।
- source_word: ἑαυτοῖς
  choice: अपने ही विरुद्ध
  rationale: रूपतः इसका अर्थ ‘अपने लिए/अपने आप को’ हो सकता है, पर इस निंदात्मक प्रसंग में उनकी गवाही स्वयं उन्हें दोषी ठहराती है; मुख्य पाठ में यही प्रासंगिक भाव रखा गया है और अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: ὅτι
  choice: कि
  rationale: यह गवाही की विषय-वस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: υἱοί
  choice: पुत्र
  rationale: यूनानी शब्द स्पष्टतः पुल्लिंग बहुवचन है और वंशगत संबंध के साथ वैसी ही नैतिक प्रवृत्ति की ओर भी संकेत करता है।
- source_word: τῶν φονευσάντων
  choice: उन लोगों के ... जिन्होंने ... हत्या की थी
  rationale: यह पूर्ण हो चुके अतीत के कृत्य द्वारा उन लोगों की पहचान करता है; ‘हत्या’ अन्यायपूर्ण मार डालने की तीव्रता बनाए रखती है।
- source_word: τοὺς προφήτας
  choice: भविष्यद्वक्ताओं
  rationale: यह इस्राएल के इतिहास में परमेश्वर के संदेशवाहकों के परिचित वर्ग का सीधा और स्थापित हिन्दी रूप है।
theological_decisions:
- issue: υἱοί को शाब्दिक ‘पुत्र’ कहा जाए या अर्थ-विस्तार करके ‘संतान/वंशज’।
  choice: पुत्र
  alternative: संतान; वंशज
  rationale: ‘पुत्र’ मूल की पुरुषवाची पारिवारिक भाषा और आरोप की तीक्ष्णता को सुरक्षित रखता है। प्रसंग में यह जैविक वंश और पूर्वजों जैसी नैतिक एकजुटता—दोनों की ध्वनि रख सकता है; अनुवाद इनमें से किसी एक को ही अंतिम नहीं ठहराता।
- issue: ἑαυτοῖς को केवल ‘अपने आप को’ रखा जाए या प्रसंगानुसार ‘अपने ही विरुद्ध’।
  choice: अपने ही विरुद्ध
  alternative: अपने आप को
  rationale: मुख्य पाठ में आत्म-दोषारोपण का प्रासंगिक बल स्पष्ट किया गया है, जबकि दत्तिव का अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है ताकि मूल की वास्तविक भाषिक गुंजाइश बनी रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘गवाही’ न्यायिक ध्वनि बनाए रखता है; ‘हत्या’ प्रसंग में निहित अन्यायपूर्ण वध को व्यक्त करता है।
