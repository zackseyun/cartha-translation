id: MAT.23.3
reference: Matthew 23:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: hi
  text: इसलिए वे तुमसे जो कुछ कहें, वह सब करो और उसका पालन करो; पर उनके कामों के अनुसार मत करो[a], क्योंकि वे कहते तो हैं, पर करते नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर जैसा वे करते हैं, वैसा मत करो।”
    reason: κατὰ τὰ ἔργα αὐτῶν का अधिक मुहावरेदार हिन्दी रूप।
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: इसलिए ... जो कुछ ... वह सब
  rationale: οὖν के निष्कर्षसूचक भाव को ‘इसलिए’ से और πάντα ὅσα ἐὰν की व्यापकता को स्वाभाविक हिन्दी संरचना ‘जो कुछ ... वह सब’ से व्यक्त किया गया है।
- source_word: εἴπωσιν ὑμῖν
  choice: वे तुमसे ... कहें
  rationale: λέγω का सीधा अर्थ ‘कहना’ रखा गया है; ‘सिखाएँ’ कहने से मूल में निहित न होने वाला औपचारिक शिक्षण-भाव जुड़ सकता था।
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: करो और उसका पालन करो
  rationale: ποιέω और τηρέω के भेद को क्रमशः ‘करो’ और ‘पालन करो’ से रखा गया है। ‘उसका’ जोड़ना हिन्दी में कथन को स्पष्ट और स्वाभाविक बनाता है।
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε
  choice: पर उनके कामों के अनुसार मत करो
  rationale: κατά के अनुरूपता/मानक वाले भाव को ‘के अनुसार’ और ἔργα को सामान्य, व्यापक ‘कामों’ से व्यक्त किया गया है। अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: क्योंकि वे कहते तो हैं, पर करते नहीं
  rationale: ‘तो ... पर’ हिन्दी में कथन और आचरण के तीखे विरोध को स्वाभाविक रूप से दिखाता है, जबकि ποιέω की ‘करो/करते’ पुनरावृत्ति भी बनी रहती है।
theological_decisions:
- issue: क्या पिछले पद के आधार पर शास्त्रियों और फरीसियों के शिक्षकीय अधिकार को इस पद में स्पष्ट किया जाए
  choice: इस पद में निहित कर्ता ‘वे’ और सामान्य क्रिया ‘कहें’ को ही रखा गया है।
  alternative: ‘वे जो कुछ तुम्हें सिखाएँ’ या ‘मूसा की गद्दी से जो कुछ कहें’
  rationale: निकटवर्ती प्रसंग ‘वे’ की पहचान बताता है, पर पद 3 स्वयं उन विवरणों को नहीं दोहराता। विस्तार करने से अनुवाद में व्याख्या जुड़ जाती।
- issue: ποιέω की पुनरावृत्ति को शैलीगत विविधता देकर सहज बनाना
  choice: ‘करो ... मत करो ... करते नहीं’ की पुनरावृत्ति सुरक्षित रखी गई है।
  alternative: ‘आचरण करो ... उनकी नकल मत करो ... अमल नहीं करते’
  rationale: मूल यूनानी में एक ही क्रिया की पुनरावृत्ति कथनी और करनी के विरोध को उभारती है; इसे बनाए रखना पद के नैतिक और आलंकारिक तनाव के लिए महत्वपूर्ण है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण संबोधन रखा गया है। ‘अतः’ के स्थान पर सामान्य ‘इसलिए’, और ‘कार्यों’ के स्थान पर सहज ‘कामों’ का प्रयोग किया गया है।
