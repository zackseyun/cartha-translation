id: MAT.23.25
reference: Matthew 23:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: hi
  text: “धिक्कार है तुम पर, शास्त्रियो और फ़रीसियो, कपटियो! क्योंकि तुम प्याले और थाली को बाहर से तो साफ़ करते हो, पर भीतर वे लालच और असंयम से भरे हैं।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर भीतर वे लूट-खसोट और आत्म-संयम की कमी से भरे हैं।” यूनानी शब्दों में दूसरों का माल हड़पने या जबरन वसूली करने और इच्छाओं पर नियंत्रण न रखने के अधिक तीखे भाव भी हो सकते हैं।
    reason: ἁρπαγή और ἀκρασία के वैकल्पिक, अधिक तीखे शब्दार्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: Οὐαὶ
  choice: धिक्कार है तुम पर
  rationale: यह अभिव्यक्ति भविष्यद्वक्ताओं जैसी कड़ी निंदा और चेतावनी को स्वाभाविक आधुनिक हिन्दी में बनाए रखती है।
- source_word: γραμματεῖς
  choice: शास्त्रियो
  rationale: सुसमाचारों के धार्मिक-सामाजिक संदर्भ में यह γραμματεῖς के लिए प्रचलित और संक्षिप्त हिन्दी पद है।
- source_word: Φαρισαῖοι
  choice: फ़रीसियो
  rationale: धार्मिक समूह के नाम का मानक हिन्दी लिप्यंतरण।
- source_word: ὑποκριταί
  choice: कपटियो
  rationale: यह धार्मिक और नैतिक दिखावे का भाव स्पष्ट करता है तथा सम्बोधन में स्वाभाविक है।
- source_word: καθαρίζετε
  choice: साफ़ करते हो
  rationale: वर्तमान काल की क्रिया को सहज, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸ ἔξωθεν
  choice: बाहर से
  rationale: ἔσωθεν के साथ बाहर-भीतर का सीधा विरोध सुरक्षित रखता है।
- source_word: ποτηρίου
  choice: कटोरे
  rationale: यह पीने के पात्र के लिए सहज हिन्दी शब्द है और थाली के साथ घरेलू पात्रों की छवि बनाए रखता है।
- source_word: παροψίδος
  choice: थाली
  rationale: मेज़ पर प्रयुक्त चौड़े पात्र के लिए सामान्य और सुबोध हिन्दी पर्याय।
- source_word: ἔσωθεν
  choice: भीतर
  rationale: बाहरी सफ़ाई और भीतरी अशुद्धता के रूपक को संक्षिप्त रूप से बनाए रखता है।
- source_word: γέμουσιν
  choice: वे ... से भरे हैं
  rationale: यूनानी बहुवचन को सुरक्षित रखते हुए इसका संदर्भ कटोरे और थाली—दोनों—से जोड़ा गया है।
- source_word: ἁρπαγῆς
  choice: लालच
  rationale: इस नैतिक रूपक में हड़पने की प्रवृत्ति को सहज हिन्दी में व्यक्त करता है; लूट-खसोट या जबरन वसूली का अधिक तीखा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἀκρασίας
  choice: असंयम
  rationale: इच्छाओं पर नियंत्रण न रखने और अनुशासनहीन भोग की धारणा को संक्षेप और गरिमा के साथ व्यक्त करता है।
theological_decisions:
- issue: भीतरी अशुद्धता के रूपक का संदर्भ
  choice: ‘वे ... से भरे हैं’ कहकर कटोरे और थाली को व्याकरणिक संदर्भ बनाए रखना
  alternative: ‘तुम भीतर से लालच और असंयम से भरे हो’
  rationale: यूनानी पाठ में बहुवचन क्रिया पात्रों से जुड़ी रहती है, यद्यपि रूपक स्पष्टतः धार्मिक अगुओं पर लागू होता है। इसे सीधे उनके हृदयों के रूप में खोल देना पाठ में व्याख्यात्मक विस्तार जोड़ता।
- issue: ἁρπαγή और ἀκρασία की नैतिक तीव्रता
  choice: मुख्य पाठ में ‘लालच और असंयम’
  alternative: ‘लूट-खसोट और आत्म-संयम की कमी’
  rationale: मुख्य पाठ सामान्य पाठक के लिए सहज रहता है, जबकि मूल शब्दों में निहित शोषण और अनुशासनहीन अति की अधिक तीखी संभावनाएँ पादटिप्पणी में स्पष्ट की गई हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। सम्बोधन के बहुवचन रूप ‘शास्त्रियो’, ‘फ़रीसियो’ और ‘कपटियो’ निंदा की सीधी शक्ति बनाए रखते हैं। बाहर-भीतर के रूपक और यूनानी बहुवचन दोनों को यथासंभव स्पष्ट रखा गया है।
