id: MAT.23.39
reference: Matthew 23:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: hi
  text: क्योंकि मैं तुमसे कहता हूँ[a], अब से तुम मुझे निश्चय ही तब तक नहीं देखोगे, जब तक तुम यह न कहो[b], ‘धन्य है वह, जो प्रभु के नाम से आता है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुमसे कहता हूँ कि अब से तुम मुझे किसी भी रीति से तब तक नहीं देखोगे, जब तक तुम यह न कहो।” यूनानी में प्रबल निषेध (οὐ μή) है।
    reason: lexical_alternative
  - marker: b
    text: यह भजन 118:26 का उद्धरण अथवा संकेत है।
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: क्योंकि मैं तुमसे कहता हूँ
  rationale: ‘क्योंकि’ γάρ के व्याख्यात्मक संबंध को पिछले विलाप और न्याय-वचन से जोड़ता है; ‘मैं तुमसे कहता हूँ’ आधुनिक हिन्दी में स्वाभाविक प्रत्यक्ष-संबोधन है।
- source_word: οὐ μή
  choice: निश्चय ही ... नहीं
  rationale: οὐ μή की प्रबल नकारात्मकता को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है, बिना इसे निरपेक्ष ‘कभी नहीं’ बनाकर आगामी ‘जब तक’ की सीमा को धुंधला किए।
- source_word: ἴδητε
  choice: देखोगे
  rationale: ὁράω का यहाँ सीधा और स्वाभाविक अर्थ ‘देखना’ है।
- source_word: ἀπ’ ἄρτι
  choice: अब से
  rationale: वर्तमान क्षण से आरम्भ होने वाली समयावधि को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἕως ἂν εἴπητε
  choice: जब तक तुम यह न कहो
  rationale: ἕως ἄν और विधिलिंग की भावी सीमा/संभाव्यता को हिन्दी की स्वाभाविक ‘जब तक ... न’ रचना में व्यक्त करता है; ‘यह’ आगामी उद्धरण को स्पष्ट रूप से प्रस्तुत करता है।
- source_word: Εὐλογημένος
  choice: धन्य
  rationale: भजन-साहित्य की अनुगूँज और आशीष की अर्थछाया को सुरक्षित रखने वाला प्रचलित, गरिमापूर्ण शब्द है।
- source_word: ὁ ἐρχόμενος
  choice: वह, जो ... आता है
  rationale: संज्ञीकृत कृदन्त को स्वाभाविक हिन्दी में व्यक्त करता है और इसे अनावश्यक रूप से किसी विशिष्ट उपाधि में नहीं बदलता।
- source_word: ἐν ὀνόματι κυρίου
  choice: प्रभु के नाम से
  rationale: वाक्यांश के अधिकार, प्रतिनिधित्व और शास्त्रीय लय को सहज हिन्दी में बनाए रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος के लिए स्थापित और व्यापक हिन्दी बाइबलीय पद है।
theological_decisions:
- issue: भविष्य में देखने और स्वीकार करने के विषय में यीशु के कथन का आशय
  choice: न्यायस्वरूप अनुपस्थिति का गंभीर कथन, जिसकी सीमा उद्धृत आशीर्वचन कहे जाने तक है; घटना या काल को अधिक विशिष्ट नहीं किया गया।
  alternative: इसे केवल विजयी प्रवेश, केवल दूसरे आगमन, या केवल इस्राएल के भावी मन-फिराव का स्पष्ट उल्लेख मानना।
  rationale: यूनानी पाठ भावी देखने को उस स्वीकारोक्ति तक स्थगित करता है, पर ठीक ऐतिहासिक या अंतकालीन अवसर निर्धारित नहीं करता; अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण बाइबलीय शैली। ‘तुम’ बहुवचन संबोधन को दर्शाता है। उद्धरण की शास्त्रीय अनुगूँज के लिए ‘धन्य’ और ‘प्रभु’ रखे गए हैं।
