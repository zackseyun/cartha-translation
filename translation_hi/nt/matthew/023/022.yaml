id: MAT.23.22
reference: Matthew 23:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: hi
  text: और जो कोई स्वर्ग की शपथ खाता है, वह परमेश्वर के सिंहासन की और उस पर विराजमान की शपथ खाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर बैठे हुए की।”
    reason: ‘विराजमान’ सिंहासन के प्रसंग में स्वाभाविक है; ‘बैठे हुए’ यूनानी कृदंत का अधिक शाब्दिक विकल्प है।
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: जो कोई ... शपथ खाता है
  rationale: आर्टिक्युलर एओरिस्ट कृदंत यहाँ सामान्य सिद्धांत व्यक्त करता है; हिन्दी में ‘जो कोई ... शपथ खाता है’ स्वाभाविक रूप से सार्वत्रिक अर्थ देता है।
- source_word: ἐν
  choice: की शपथ
  rationale: शपथ-सूत्र में ἐν का अर्थ स्थानवाचक ‘में’ नहीं, बल्कि उस सत्ता या वस्तु को साक्षी मानकर शपथ खाना है; हिन्दी मुहावरे में इसे ‘की शपथ खाना’ कहा जाता है।
- source_word: οὐρανῷ
  choice: स्वर्ग
  rationale: परमेश्वर के सिंहासन से तत्काल संबंध के कारण यहाँ भौतिक आकाश की अपेक्षा धार्मिक अर्थ वाला ‘स्वर्ग’ उपयुक्त है।
- source_word: θρόνῳ τοῦ θεοῦ
  choice: परमेश्वर के सिंहासन
  rationale: यह मूल यूनानी के संबंधवाचक ढाँचे और गंभीर शैली को सुरक्षित रखता है।
- source_word: τῷ καθημένῳ
  choice: विराजमान
  rationale: κάθημαι का मूल अर्थ बैठना है, पर सिंहासन के प्रसंग में ‘विराजमान’ स्वाभाविक और गरिमापूर्ण हिन्दी है तथा राज्यासन का संकेत बनाए रखता है।
- source_word: ἐπάνω αὐτοῦ
  choice: उस पर
  rationale: सर्वनाम का संदर्भ सिंहासन है; ‘उस पर’ सिंहासन पर विराजने का अर्थ देता है, न कि उससे अलग ऊपर होने का।
theological_decisions:
- issue: ‘उस पर विराजमान’ का संदर्भ
  choice: स्वर्ग में सिंहासनारूढ़ परमेश्वर के लिए आदरसूचक परोक्ष उल्लेख
  alternative: स्पष्ट रूप से ‘उस पर विराजमान परमेश्वर’ कहना
  rationale: ‘परमेश्वर के सिंहासन’ से संदर्भ स्पष्ट है, पर मूल पाठ परमेश्वर नाम को दोहराने के बजाय ‘उस पर विराजमान’ कहता है। अनुवाद उसी परोक्षता को बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘शपथ खाता है’ प्रचलित हिन्दी मुहावरा है; ‘विराजमान’ सिंहासन-संदर्भ की गरिमा को बिना संदर्भ को स्पष्ट नाम में बदल दिए बनाए रखता है।
