- issue: छोटी धार्मिक आज्ञाओं और अधिक महत्त्वपूर्ण कर्तव्यों का संबंध
  choice: “उन बातों को भी नहीं छोड़ना चाहिए था” के द्वारा दोनों दायित्व बनाए गए हैं
  alternative: केवल न्याय, दया और विश्वास को आवश्यक बताना
  rationale: मूल वाक्य जड़ी-बूटियों का दसवाँ भाग देने को रद्द नहीं करता, बल्कि अधिक महत्त्वपूर्ण कर्तव्यों की उपेक्षा की निंदा करते हुए दोनों को करना आवश्यक बताता है।
