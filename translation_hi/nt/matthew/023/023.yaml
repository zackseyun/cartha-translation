- source_word: γραμματεῖς
  choice: शास्त्रियो
  rationale: सुसमाचार के यहूदी संदर्भ में यह धर्मशास्त्र और व्यवस्था के जानकार लेखकों-शिक्षकों के लिए प्रचलित, संक्षिप्त पद है।
- source_word: ὑποκριταί
  choice: कपटियो
  rationale: यहाँ शब्द का नैतिक अर्थ है—ऐसे लोग जिनका बाहरी धार्मिक आचरण उनके वास्तविक चरित्र से मेल नहीं खाता।
- source_word: ἀποδεκατοῦτε
  choice: दसवाँ भाग देते हो
  rationale: मूल क्रिया का ठीक अर्थ उपज या संपत्ति का दसवाँ भाग देना है; यह सामान्य पाठक के लिए ‘दशमांश देते हो’ से अधिक तत्काल स्पष्ट है।
- source_word: ἡδύοσμον
  choice: पुदीने
  rationale: यह उल्लिखित सुगंधित वनस्पति का प्रचलित हिन्दी नाम है।
- source_word: ἄνηθον
  choice: सोआ
  rationale: यह dill नामक वनस्पति का मानक हिन्दी नाम है और ‘सोया’ जैसे संभावित भ्रम से बचता है।
- source_word: κύμινον
  choice: जीरे
  rationale: यह cumin का स्वाभाविक और सर्वपरिचित हिन्दी नाम है।
- source_word: ἀφήκατε
  choice: उपेक्षा कर देते हो
  rationale: संदर्भ में क्रिया का आशय आवश्यक कर्तव्य को छोड़ देना या उसकी उपेक्षा करना है; वाक्य का वर्तमानकालीन रूप लगातार चल रहे आचरण पर आरोप को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: व्यवस्था की अधिक महत्त्वपूर्ण बातें
  rationale: βαρύτερα का शाब्दिक अर्थ ‘अधिक भारी’ है, पर यहाँ वह तुलनात्मक महत्त्व का रूपक है; चुना हुआ रूप अर्थ को साफ़ रखता है।
- source_word: κρίσιν
  choice: न्याय
  rationale: इस नैतिक त्रयी में यह न्यायपूर्ण आचरण को दर्शाता है, केवल निर्णय सुनाने की क्रिया को नहीं।
- source_word: ἔλεος
  choice: दया
  rationale: यह ἔλεος का स्थापित और सहज हिन्दी समतुल्य है तथा जरूरतमंद के प्रति दयापूर्ण व्यवहार को व्यक्त करता है।
- source_word: πίστιν
  choice: विश्वास
  rationale: πίστις का सीधा और पारंपरिक हिन्दी समतुल्य है; नैतिक संदर्भ में ‘विश्वासयोग्यता’ की वास्तविक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ταῦτα … κἀκεῖνα
  choice: ये बातें … उन बातों
