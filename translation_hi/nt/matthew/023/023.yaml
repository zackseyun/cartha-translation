  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: hi
  text: “हे कपटी शास्त्रियों और फरीसियों, तुम पर हाय! क्योंकि तुम पुदीने, सोआ और जीरे का दसवाँ भाग देते हो, लेकिन व्यवस्था की अधिक महत्त्वपूर्ण बातों—न्याय, दया और विश्वास[a]—की उपेक्षा कर दी है। तुम्हें ये बातें करनी चाहिए थीं और दसवाँ भाग देने की उन बातों की उपेक्षा भी नहीं करनी चाहिए थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वासयोग्यता।” यूनानी शब्द का अर्थ विश्वास, भरोसा या निष्ठा हो सकता है; इस नैतिक संदर्भ में बहुत-से लोग इसे विश्वासयोग्यता के अर्थ में समझते हैं।
    reason: πίστις की वास्तविक और संदर्भतः महत्वपूर्ण वैकल्पिक व्याख्या को सुरक्षित रखना।
