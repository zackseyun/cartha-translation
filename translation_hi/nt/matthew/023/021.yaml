  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: hi
  text: और जो कोई मन्दिर की शपथ खाता है, वह उसकी भी और उसमें निवास करनेवाले की भी शपथ खाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, शाब्दिक रूप से, “जो मन्दिर में शपथ खाता है, वह उसी में और उसमें निवास करनेवाले में शपथ खाता है।” यूनानी पूर्वसर्ग का शाब्दिक अर्थ “में” है, पर इस शपथ-सूत्र में उसका अर्थ “की शपथ” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: जो कोई ... शपथ खाता है
  rationale: संज्ञात्मक एओरिस्ट कृदन्त का अर्थ सामान्य रूप से किसी भी ऐसे व्यक्ति से है जो शपथ खाता है; यह हिन्दी में स्वाभाविक और सर्वसमावेशी अभिव्यक्ति है।
- source_word: ἐν τῷ ναῷ
  choice: मन्दिर की शपथ
  rationale: ἐν का मूल अर्थ ‘में’ है, पर इस प्रसंग के शपथ-सूत्र में यह उस वस्तु को सूचित करता है जिसकी शपथ खाई जाती है; हिन्दी में ‘मन्दिर की शपथ खाना’ स्वाभाविक है।
- source_word: ναῷ
  choice: मन्दिर
  rationale: ναός विशेष रूप से पवित्रस्थान या मन्दिर-भवन को सूचित कर सकता है; यहाँ ‘मन्दिर’ सामान्य पाठक के लिए स्पष्ट है और प्रसंग के अनुकूल है।
- source_word: ὀμνύει
  choice: शपथ खाता है
  rationale: वर्तमानकालीन क्रिया एक सामान्य सिद्धान्त व्यक्त करती है; हिन्दी का प्रचलित मुहावरा ‘शपथ खाना’ उसी अर्थ को स्वाभाविक रूप से देता है।
- source_word: ἐν αὐτῷ
  choice: उसकी ... शपथ
  rationale: यहाँ भी शपथ-सूत्र में ἐν का अर्थ ‘की शपथ’ है और ‘उसकी’ का संकेत मन्दिर की ओर है।
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: उसमें निवास करनेवाले
  rationale: वर्तमान कृदन्त निरन्तर निवास की छवि बनाए रखता है। प्रसंग में संकेत परमेश्वर की ओर स्पष्ट है, पर हिन्दी में संज्ञात्मक पद स्वयं पर्याप्त है।
- source_word: αὐτόν
  choice: उसमें
  rationale: सर्वनाम का पूर्वपद ναός अर्थात मन्दिर है; हिन्दी में स्थानवाचक रूप ‘उसमें’ उचित है।
theological_decisions:
- issue: मन्दिर में निवास करनेवाले की पहचान
  choice: ‘उसमें निवास करनेवाले’ के द्वारा परमेश्वर का संदर्भ निहित रखा गया है
  alternative: ‘उसमें निवास करनेवाले परमेश्वर’ कहकर संदर्भ को स्पष्ट करना
  rationale: प्रसंग परमेश्वर की ओर संकेत करता है, किन्तु यूनानी पाठ में ‘परमेश्वर’ शब्द प्रत्यक्ष रूप से नहीं है। इसलिए अनावश्यक स्पष्टता जोड़े बिना मूल की निहितता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी। ‘मन्दिर की शपथ खाना’ हिन्दी के स्वाभाविक शपथ-मुहावरे के अनुसार है। ‘निवास करनेवाले’ मूल कृदन्त की छवि को बनाए रखता है और परमेश्वर का नाम पाठ में जोड़े बिना संदर्भ को निहित रहने देता है।
