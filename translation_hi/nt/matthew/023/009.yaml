source:
  edition: SBLGNT
  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: hi
  text: और पृथ्वी पर किसी को अपना पिता न कहना[a], क्योंकि तुम्हारा पिता एक ही है—स्वर्गीय पिता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और पृथ्वी पर किसी को अपना पिता मत कहो।”
    reason: आज्ञा के वैकल्पिक, समानार्थी हिन्दी रूप को दिखाने के लिए।
  - marker: b
    text: या, “क्योंकि तुम्हारा पिता एक ही है—वह जो स्वर्गीय है”; अथवा, “क्योंकि तुम्हारा पिता एक ही है, जो स्वर्ग में है।”
    reason: ὁ οὐράνιος के विशेषणात्मक, संज्ञावत प्रयोग की सम्भव व्याख्याएँ प्रस्तुत करने के लिए।
lexical_decisions:
- source_word: πατέρα
  choice: पिता
  rationale: यह καλέσητε का कर्म है और यहाँ संबोधन या मानद उपाधि को सूचित करता है। ‘पिता’ पहले और दूसरे उपवाक्य के बीच स्पष्ट समानता बनाए रखता है।
- source_word: μὴ καλέσητε
  choice: न कहना
  rationale: μή के साथ अओरिस्ट सब्जंक्टिव निषेधात्मक आज्ञा व्यक्त करता है। ‘न कहना’ यूनानी के सीधे आदेश को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὑμῶν
  choice: अपना / तुम्हारा
  rationale: पहले उपवाक्य में कर्ता के संदर्भ से ‘अपना’ स्वाभाविक है; दूसरे में संबंधसूचक प्रयोग के लिए ‘तुम्हारा’ उचित है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: यह सांसारिक क्षेत्र या स्थान को व्यक्त करता है और स्वर्गीय पिता से निहित विरोध बनाए रखता है।
- source_word: εἷς
  choice: एक ही
  rationale: ‘एक ही’ हिन्दी में εἷς की प्रसंगगत अनन्यता को स्वाभाविक ढंग से व्यक्त करता है, बिना अर्थ को ‘केवल’ जैसे अतिरिक्त शब्द से अधिक व्याख्यायित किए।
- source_word: ὁ πατήρ
  choice: तुम्हारा पिता
  rationale: प्रदत्त पाठ में ὑμῶν सहित यह व्यक्तिगत संबंध को व्यक्त करता है; इसलिए ‘तुम्हारा पिता’ उपयुक्त है।
- source_word: ὁ οὐράνιος
  choice: वह जो स्वर्गीय है
  rationale: οὐράνιος यहाँ संज्ञावत प्रयुक्त विशेषण है। यह रूप उसके चिह्नित विशेषणात्मक स्वरूप को बचाता है और उसे सीधे ‘जो स्वर्ग में है’ में नहीं बदलता।
theological_decisions:
- issue: यीशु के निषेध का दायरा
  choice: आज्ञा को पृथ्वी पर किसी को ‘अपना पिता’ कहने के सीधे निषेध के रूप में रखा गया है, बिना इसके व्यावहारिक दायरे को अनुवाद में समझाए।
  alternative: इसे हर जैविक या सामाजिक प्रयोग पर पूर्ण प्रतिबंध मानना, अथवा अतिशयोक्ति मानकर आदेश को नरम कर देना।
  rationale: यूनानी कथन जानबूझकर तीखा है। अनुवाद को न तो इसकी धार घटानी चाहिए, न यह तय करना चाहिए कि यह सामान्य पारिवारिक संबोधन से कैसे संबंधित है; इस तनाव को प्रसंग के लिए खुला रखा गया है।
- issue: ὁ οὐράνιος का अर्थ और संबंध
  choice: ‘वह जो स्वर्गीय है’
  alternative: ‘स्वर्गीय पिता’ अथवा ‘जो स्वर्ग में है’
  rationale: प्रदत्त पाठ में विशेषण संज्ञावत है। मुख्य पाठ विशेषणात्मक अर्थ बनाए रखता है, जबकि संभावित सहज व्याख्याएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘पृथ्वी’ और ‘स्वर्गीय’ बाइबलीय औपचारिकता बनाए रखते हैं; मुख्य वाक्य का सीधा निषेध और मूल का धार्मिक तनाव सुरक्षित रखा गया है।
