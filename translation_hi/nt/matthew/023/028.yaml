id: MAT.23.28
reference: Matthew 23:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: hi
  text: इसी प्रकार तुम भी बाहर से लोगों को धर्मी दिखाई देते हो, पर भीतर से तुम पाखंड और अधर्म से भरे हुए हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: इसी प्रकार
  rationale: पिछले पद में चूना पुती कब्रों से की गई तुलना को सीधे आगे बढ़ाता है और तुलनात्मक अर्थ स्पष्ट रखता है।
- source_word: ἔξωθεν … ἔσωθεν
  choice: बाहर से … भीतर से
  rationale: मूल के बाहरी रूप और भीतरी वास्तविकता के सुस्पष्ट विरोध को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: φαίνεσθε τοῖς ἀνθρώποις
  choice: लोगों को … दिखाई देते हो
  rationale: दर्शकों की दृष्टि में बनने वाली छवि व्यक्त करता है; यह वास्तविक धार्मिकता का दावा नहीं करता। ἀνθρώποις यहाँ मनुष्यों के लिए सामान्य, समावेशी शब्द है, इसलिए ‘लोगों’ स्वाभाविक है।
- source_word: δίκαιοι
  choice: धर्मी
  rationale: नैतिक और धार्मिक शुद्धता के भाव को सुरक्षित रखता है और मत्ती के सन्दर्भ में परिचित तथा उपयुक्त है।
- source_word: μεστοὶ
  choice: भरे हुए
  rationale: विशेषण के ‘पूर्ण होना’ अर्थ को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὑποκρίσεως
  choice: पाखंड
  rationale: दिखावे और भीतरी वास्तविकता के बीच नैतिक-धार्मिक दोहरेपन को स्पष्ट करता है।
- source_word: ἀνομίας
  choice: अधर्म
  rationale: परमेश्वर की व्यवस्था के प्रतिकूल आचरण का भाव रखता है; ‘अराजकता’ आधुनिक हिन्दी में प्रायः सामाजिक अव्यवस्था का अर्थ देती और यहाँ भ्रमित कर सकती है।
theological_decisions:
- issue: δίκαιοι वास्तविक धार्मिकता बताता है या मनुष्यों को दिखाई देने वाली धार्मिकता
  choice: मनुष्यों की दृष्टि में केवल दिखाई देने वाली धार्मिकता
  alternative: वास्तविक धार्मिकता
  rationale: φαίνεσθε (‘दिखाई देते हो’) और उसके विपरीत ‘भीतर से’ पाखंड तथा अधर्म से भरे होने का कथन स्पष्ट करता है कि यह वास्तविक स्थिति नहीं, बाहरी छवि है।
- issue: ἀνομία को सामान्य दुष्टता या व्यवस्था-विरोध के रूप में व्यक्त करना
  choice: अधर्म
  alternative: व्यवस्थाहीनता / दुष्टता
  rationale: ‘अधर्म’ नैतिक बुराई के साथ परमेश्वर की व्यवस्था के उल्लंघन की दिशा भी बनाए रखता है, जबकि किसी विशिष्ट सम्प्रदायगत व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बाहर से … भीतर से’ का संतुलन मूल की अलंकारिक संरचना को सुरक्षित रखता है। इस पद में कोई पादटिप्पणी आवश्यक नहीं; अंग्रेज़ी की ‘people/men’ वाली टिप्पणी हिन्दी के समावेशी ‘लोगों’ में स्वतः स्पष्ट हो जाती है।
