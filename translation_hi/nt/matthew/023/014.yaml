- source_word: περισσότερον κρίμα
  choice: और भी कठोर दण्ड
  rationale: περισσότερον की तुलनात्मक तीव्रता और κρίμα के प्रसंगगत दण्डात्मक परिणाम दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: περισσότερον κρίμα में न्याय और दण्ड का संबंध
  choice: और भी कठोर दण्ड मिलेगा
  alternative: अधिक दोषी ठहराए जाओगे / अधिक कठोर न्याय पाओगे
  rationale: प्रसंग नकारात्मक न्यायिक निर्णय के परिणाम पर बल देता है। अनुवाद दण्ड की गंभीरता स्पष्ट करता है, पर उसके स्वरूप या अवधि के विषय में कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
