base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: hi
  text: तुम पर हाय,[a] धर्मशास्त्र के शिक्षको और फरीसियो, कपटियो! क्योंकि तुम विधवाओं के घरों को हड़प लेते हो और दिखावे के लिए लंबी-लंबी प्रार्थनाएँ करते हो। इसलिए तुम्हें अधिक कठोर दण्ड मिलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद सबसे प्राचीन यूनानी पांडुलिपियों (जिनमें चौथी शताब्दी की सीनैटिकस और वैटिकनस पांडुलिपियाँ शामिल हैं) तथा आरंभिक कॉप्टिक अनुवादों में नहीं है; पर यह अधिकांश बाइज़ेन्टाइन पांडुलिपियों, पुराने लैटिन अनुवादों, वुल्गाता और सीरियाई अनुवादों में मिलता है। संभवतः बाद के नकलनवीसों ने मरकुस 12:40 और लूका 20:47 के मिलते-जुलते कथनों के अनुरूप इसे यहाँ जोड़ा। जिन पांडुलिपियों में यह पद है, उनमें भी यह कभी पद 13 से पहले और कभी उसके बाद मिलता है।
    reason: textual_critical
