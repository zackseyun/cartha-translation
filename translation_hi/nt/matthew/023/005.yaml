id: MAT.23.5
reference: Matthew 23:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: hi
  text: पर वे अपने सभी काम इसलिए करते हैं कि लोग उन्हें देखें; क्योंकि वे अपनी शास्त्र-पेटियाँ[a] चौड़ी बनाते और अपने वस्त्रों के झब्बे[b] बड़े करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ये चमड़े की छोटी पेटियाँ थीं जिनमें पवित्रशास्त्र के अंश रखे जाते थे। कुछ यहूदी व्यवस्थाविवरण 6:8 जैसे पदों का पालन करते हुए इन्हें पहनते थे। इन्हें ‘तेफिलीन’ भी कहा जाता है।
    reason: cultural_note
  - marker: b
    text: अर्थात वस्त्रों पर लगाए जाने वाले झब्बे या लटकन। तुलना करें गिनती 15:38–39।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔργα
  choice: अपने सभी काम
  rationale: यह पद उनके कामों की समग्रता पर बल देता है। ‘सभी काम’ आधुनिक हिन्दी में स्वाभाविक है और ἔργα के व्यापक अर्थ को बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन से विरोध या अंतर दिखाता है; ‘पर’ उस संबंध को सहज रूप से व्यक्त करता है।
- source_word: πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: इसलिए करते हैं कि लोग उन्हें देखें
  rationale: यह उद्देश्यसूचक रचना है। हिन्दी में यह वाक्यांश स्वाभाविक रहते हुए लोगों द्वारा देखे जाने के आशय को स्पष्ट करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह अगले उदाहरणों को पिछले आरोप के स्पष्टीकरण के रूप में प्रस्तुत करता है।
- source_word: φυλακτήρια
  choice: शास्त्र-पेटियाँ
  rationale: यह उन छोटी पेटियों का अर्थ स्पष्ट करता है जिनमें पवित्रशास्त्र के अंश रखकर पहने जाते थे। केवल लिप्यंतर या ‘तावीज़’ की तुलना में यह अधिक बोधगम्य है और अनावश्यक नकारात्मक अर्थ से बचता है।
- source_word: πλατύνουσι
  choice: चौड़ी बनाते
  rationale: क्रिया का मूल भौतिक अर्थ चौड़ा करना है; यह प्रदर्शन के लिए पेटियों का आकार बढ़ाने की छवि बनाए रखता है।
- source_word: κράσπεδα
  choice: अपने वस्त्रों के झब्बे
  rationale: इस यहूदी संदर्भ में शब्द वस्त्रों पर लगाए जाने वाले आज्ञापित झब्बों या लटकनों को दर्शाता है। ‘झब्बे’ ठोस और सामान्य हिन्दी शब्द है।
- source_word: μεγαλύνουσι
  choice: बड़े करते हैं
  rationale: यह क्रिया आकार बढ़ाने को व्यक्त करती है। यूनानी पाठ केवल लंबाई निर्दिष्ट नहीं करता, इसलिए ‘बड़े’ उसकी व्यापकता को सुरक्षित रखता है।
theological_decisions:
- issue: यहूदी धार्मिक वस्तुओं का वर्णन बिना उन्हें अपने-आप में निंदनीय ठहराए
  choice: φυλακτήρια को ‘शास्त्र-पेटियाँ’ और κράσπεδα को ‘वस्त्रों के झब्बे’ कहना, तथा दोनों को पादटिप्पणियों में समझाना
  alternative: ‘तावीज़’ और ‘झालरें’ कहना
  rationale: यीशु की आलोचना इन वस्तुओं या तोराह की आज्ञा की नहीं, बल्कि लोगों को प्रभावित करने के लिए उनके दिखावटी विस्तार की है। तटस्थ और ऐतिहासिक रूप से स्पष्ट शब्द इस भेद को बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘शास्त्र-पेटियाँ’ अपरिचित सांस्कृतिक वस्तु को संक्षेप में समझने योग्य बनाता है, और पादटिप्पणी अधिक ऐतिहासिक जानकारी देती है। वाक्य में उद्देश्य (‘कि लोग उन्हें देखें’) और कारणसूचक संबंध (‘क्योंकि’) दोनों स्पष्ट रखे गए हैं।
