  text: καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ καλεῖσθαι ὑπὸ τῶν ἀνθρώπων· ⸀Ῥαββί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: hi
  text: और बाज़ारों में अभिवादन पाना और लोगों द्वारा ‘रब्बी’ कहलाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμούς
  choice: आदर से अभिवादन
  rationale: यहाँ अभिवादन केवल सामान्य नमस्कार नहीं, बल्कि सार्वजनिक प्रतिष्ठा देने वाला सम्मानपूर्ण अभिवादन है; संदर्भ में धर्म-गुरुओं की मान-सम्मान की लालसा का वर्णन है।
- source_word: ἀγοραῖς
  choice: बाज़ारों में
  rationale: ἀγορά सार्वजनिक बाज़ार अथवा सभा-स्थल को दर्शाता है; आधुनिक हिंदी में ‘बाज़ारों’ से सार्वजनिक स्थान का भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: καλεῖσθαι
  choice: कहलाना
  rationale: यूनानी कर्मवाच्य क्रिया का संक्षिप्त और स्वाभाविक हिंदी रूप है।
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: लोगों से
  rationale: ἄνθρωποι यहाँ सामान्य रूप से मनुष्यों/लोगों को दर्शाता है, केवल पुरुषों को नहीं; ‘लोगों से’ आधुनिक हिंदी में स्वाभाविक है और मूल का व्यापक अर्थ बनाए रखता है।
- source_word: Ῥαββί
  choice: ‘रब्बी’
  rationale: यह यहूदी गुरु की प्रचलित उपाधि का लिप्यंतरण है; उपाधि और ऐतिहासिक-सांस्कृतिक रंग सुरक्षित रहता है।
theological_decisions:
- issue: सम्मानपूर्ण अभिवादन का निहित भाव
  choice: ‘आदर से अभिवादन पाना’ द्वारा सार्वजनिक सम्मान का भाव स्पष्ट किया गया
  alternative: ‘अभिवादन’ या ‘नमस्कार पाना’
  rationale: पद के विवादात्मक संदर्भ में समस्या अभिवादन मात्र नहीं, प्रतिष्ठापूर्ण सार्वजनिक मान्यता की चाह है; फिर भी अनुवाद इसे किसी विशेष धार्मिक सिद्धांत से नहीं जोड़ता।
- issue: ἀνθρώπων का लिंग-संबंधी विस्तार
  choice: ‘लोगों से’
  alternative: ‘मनुष्यों से’ या ‘पुरुषों से’
  rationale: मूल शब्द इस संदर्भ में मानव समुदाय को सामान्य रूप से दर्शाता है। ‘पुरुषों से’ अनावश्यक रूप से अर्थ को केवल पुरुषों तक सीमित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यह पद पिछले वाक्य की व्याकरणिक श्रृंखला का अंश है, इसलिए आरंभ में ‘और’ तथा अंत में वाक्यांशात्मक संरचना बनाए रखी गई है।
