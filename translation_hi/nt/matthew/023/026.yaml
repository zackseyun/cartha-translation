source:
  edition: SBLGNT
  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: hi
  text: हे अंधे फरीसी, पहले प्याले और थाली[a] को भीतर से साफ़ कर, ताकि उसका बाहर का भाग भी साफ़ हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘थाली’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘प्लेट,’ ‘कटोरा’ या ‘परात’ भी हो सकता है; यह भोजन परोसने का पात्र था।
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: हे अंधे फरीसी
  rationale: दोनों एकवचन संबोधन हैं। ‘हे’ प्रत्यक्ष संबोधन को स्पष्ट करता है, और ‘अंधे’ आत्मिक अंधेपन के तीखे रूपक को बिना व्याख्या जोड़े बनाए रखता है।
- source_word: καθάρισον
  choice: साफ़ कर
  rationale: एकवचन आज्ञार्थक निर्णायक क्रिया की माँग करता है। बर्तन के ठोस चित्र में ‘साफ़ कर’ स्वाभाविक है और नैतिक रूपक को भी खुला रखता है।
- source_word: πρῶτον
  choice: पहले
  rationale: क्रम और तार्किक प्राथमिकता दोनों को संक्षेप में व्यक्त करता है।
- source_word: τὸ ἐντὸς τοῦ ποτηρίου καὶ τῆς παροψίδος
  choice: कटोरे और थाली को भीतर से
  rationale: ἐντός बर्तनों के भीतरी भाग को दर्शाता है। हिन्दी में ‘को भीतर से साफ़ कर’ अधिक स्वाभाविक है। ποτήριον के लिए ‘कटोरा’ सामान्य पात्र-संज्ञा है; παροψίς के लिए ‘थाली’ भोजन परोसने के पात्र का सहज व्यापक शब्द है।
- source_word: ἵνα γένηται
  choice: ताकि ... हो जाए
  rationale: उद्देश्य/परिणाम और γίνομαι के ‘बनने/हो जाने’ वाले परिवर्तनात्मक भाव को सुरक्षित रखता है।
- source_word: καὶ τὸ ἐκτὸς αὐτοῦ καθαρόν
  choice: उसका बाहर का भाग भी साफ़ हो जाए
  rationale: καί को ‘भी’, ἐκτός को ‘बाहर का भाग’, और αὐτοῦ के एकवचन रूप को ‘उसका’ से व्यक्त किया गया है; बाहरी सफ़ाई को भीतरी सफ़ाई के परिणाम के रूप में रखा गया है।
theological_decisions:
- issue: ठोस बर्तन-चित्र और नैतिक अर्थ
  choice: भीतर और बाहर से बर्तन साफ़ करने का ठोस चित्र मुख्य पाठ में बनाए रखा गया।
  alternative: ‘पहले अपना मन/भीतरी जीवन शुद्ध कर’ जैसे स्पष्ट नैतिक अर्थ वाला अनुवाद।
  rationale: यूनानी पाठ नैतिक शिक्षा को रूपक के माध्यम से कहता है; उसके आशय को मुख्य पाठ में स्पष्ट कर देना मूल की अर्थपूर्ण तनाव और अलंकारिक शक्ति को घटाता।
- issue: αὐτοῦ का एकवचन संदर्भ
  choice: ‘उसका’ रखा गया, जैसा यूनानी सर्वनाम का एकवचन रूप है।
  alternative: दोनों बर्तनों को अलग-अलग स्पष्ट करने के लिए ‘उनका’।
  rationale: यूनानी में αὐτοῦ एकवचन है, यद्यपि उससे पहले कटोरा और थाली दोनों आते हैं। अनुवाद इस व्याकरणिक असमानता को सहज हिन्दी में यथासंभव सुरक्षित रखता है, न कि चुपचाप बहुवचन में बदलता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सीधा, गरिमापूर्ण और तीखा संबोधन रखा गया है। ‘तू’ का सर्वनाम प्रकट किए बिना एकवचन आज्ञार्थक ‘कर’ मूल संबोधन की सीधाई और कठोरता व्यक्त करता है। मुख्य पाठ में [a] का चिह्न संबंधित शब्द के तुरंत बाद दिया गया है।
