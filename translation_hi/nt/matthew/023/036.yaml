  text: ἀμὴν λέγω ὑμῖν, ⸀ἥξει ⸂ταῦτα πάντα⸃ ἐπὶ τὴν γενεὰν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: hi
  text: मैं तुमसे सच कहता हूँ, ये सब बातें[a] इस पीढ़ी[b] पर आ पड़ेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “यह सब।” यूनानी में यह पद बहुवचन है: “ये सब बातें।”'
    reason: lexical_alternative
  - marker: b
    text: कुछ लोग “इस पीढ़ी” का अर्थ “ये लोग” या अविश्वास से पहचानी जाने वाली कोई व्यापक पीढ़ी भी समझते हैं; पर यूनानी का सबसे सीधा अर्थ “इस पीढ़ी” है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: सच
  rationale: सभोपदेशों में प्रयुक्त इस गंभीर उद्घोषणा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; यहाँ यूनानी में यह शब्द एक बार ही आया है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: वर्तमानकालीन क्रिया और बहुवचन संबोधन का सीधा, गरिमापूर्ण अनुवाद।
- source_word: ἥξει
  choice: आ पड़ेंगी
  rationale: यहाँ क्रिया पहले बताए गए न्यायकारी परिणामों के इस पीढ़ी पर आने को व्यक्त करती है। ‘आ पड़ेंगी’ हिन्दी में ἐπὶ के साथ आने वाले बोझ अथवा न्याय के भाव को स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: ταῦτα πάντα
  choice: ये सब बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक और πᾶς को स्पष्ट रूप से बहुवचन में रखता है तथा पिछले प्रसंग में कही गई बातों की ओर संकेत करता है।
- source_word: ἐπὶ
  choice: पर
  rationale: किसी व्यक्ति-समूह पर परिणाम या न्याय के आ पड़ने का स्वाभाविक हिन्दी संबंधसूचक; ‘विरुद्ध’ कहना मूल से अधिक व्याख्यात्मक होता।
- source_word: γενεὰν ταύτην
  choice: इस पीढ़ी
  rationale: यूनानी पद का सबसे सीधा अर्थ रखता है और इसके संदर्भ की विवादित व्यापकता का निर्णय अनुवाद में नहीं करता।
theological_decisions:
- issue: γενεὰν ταύτην (‘इस पीढ़ी’) का संदर्भ
  choice: इस पीढ़ी
  alternative: ये लोग; अविश्वास से पहचानी जाने वाली व्यापक पीढ़ी; यह युग
  rationale: सीधा कालगत और शाब्दिक भाव बनाए रखा गया है। पद का दायरा संदर्भ से समझने के लिए खुला छोड़ा गया है, ताकि कोई विशिष्ट युगांत-विषयक व्याख्या अनुवाद में न थोपी जाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मैं तुमसे सच कहता हूँ’ यीशु की गंभीर उद्घोषणा का औपचारिक बल बनाए रखता है, जबकि ‘आ पड़ेंगी’ आगामी न्याय के संदर्भ में स्वाभाविक हिन्दी है।
