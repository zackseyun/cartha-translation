id: MAT.23.30
reference: Matthew 23:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ λέγετε· Εἰ ⸀ἤμεθα ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν, οὐκ ἂν ⸁ἤμεθα ⸂αὐτῶν κοινωνοὶ⸃ ἐν τῷ αἵματι τῶν προφητῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: hi
  text: और तुम कहते हो, ‘यदि हम अपने पुरखों के दिनों में होते, तो नबियों का खून बहाने में उनके सहभागी[a] न होते।’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके साथ भागीदार”; यूनानी शब्द साझा भागीदारी या दोष में सहभागिता, दोनों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “नबियों के खून में उनके सहभागी।” आशय है नबियों का खून बहाने और उससे जुड़े रक्तदोष में अपने पुरखों का साथ देना।
    reason: literal_rendering
lexical_decisions:
- source_word: λέγετε
  choice: तुम कहते हो
  rationale: वर्तमानकाल और बहुवचन में सीधे संबोधन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Εἰ ἤμεθα ἐν ταῖς ἡμέραις
  choice: यदि हम ... के दिनों में होते
  rationale: भूतकाल की तथ्य-विरुद्ध कल्पना को स्पष्ट रखता है और यूनानी काल-सूचक मुहावरे का स्वाभाविक हिन्दी रूप देता है।
- source_word: τῶν πατέρων ἡμῶν
  choice: अपने पुरखों
  rationale: πατέρων के पुरुषवाची और वंशगत आशय को रखते हुए ‘पुरखे’ आधुनिक पाठक के लिए सहज है।
- source_word: οὐκ ἂν ἤμεθα
  choice: न होते
  rationale: शर्त के परिणाम में भूतकालीन तथ्य-विरुद्ध संभावना को हिन्दी में संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αὐτῶν κοινωνοὶ
  choice: उनके सहभागी
  rationale: κοινωνοί में निहित साझा भागीदारी और दोष-सहभागिता को व्यक्त करता है, पर ‘सह-अपराधी’ जैसे अधिक तीखे अर्थ को मुख्य पाठ में आरोपित नहीं करता।
- source_word: ἐν τῷ αἵματι τῶν προφητῶν
  choice: नबियों का खून बहाने में
  rationale: शाब्दिक ‘नबियों के खून में’ हिन्दी में अस्पष्ट और अस्वाभाविक होगा; प्रसंगानुसार यह उनके रक्तपात में भागीदारी का बोध कराता है। ‘खून’ सामान्य आधुनिक हिन्दी में ठोस और प्रभावी है।
theological_decisions:
- issue: κοινωνοὶ ἐν τῷ αἵματι में दोष-सहभागिता की मात्रा
  choice: नबियों का खून बहाने में उनके सहभागी
  alternative: नबियों के खून में उनके सहभागी; नबियों की हत्या में उनके सह-अपराधी
  rationale: मुख्य पाठ पूर्वजों की हिंसा में नैतिक भागीदारी के दावे को स्पष्ट करता है, लेकिन ‘सह-अपराधी’ कहकर यूनानी से अधिक कठोर कानूनी अर्थ नहीं जोड़ता। फुटनोट अधिक शाब्दिक रूप को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुरखे’ वंशगत और पुरुषवाची संदर्भ को बनाए रखता है; ‘खून बहाने में’ हिन्दी में शाब्दिक यूनानी बिंब का अर्थ स्पष्ट करता है।
