  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: hi
  text: परन्तु जो कोई अपने आपको ऊँचा करेगा, वह नीचा किया जाएगा[a]; और जो कोई अपने आपको नीचा करेगा, वह ऊँचा किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह नीचे लाया जाएगा” ... “वह ऊँचा उठाया जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: जो कोई
  rationale: अनिश्चित सम्बन्धवाचक सर्वनाम यहाँ एक सार्वभौमिक, कहावत-सदृश सिद्धान्त प्रस्तुत करता है; ‘जो कोई’ आधुनिक हिन्दी में इस सामान्य अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले प्रसंग से हल्का विरोध दर्शाता है; ‘परन्तु’ उस विरोधात्मक सम्बन्ध को बनाए रखता है।
- source_word: ὑψώσει ἑαυτὸν
  choice: अपने आपको ऊँचा करेगा
  rationale: शाब्दिक ‘ऊँचा करना’ यहाँ स्वयं को प्रतिष्ठित या महान बनाने के भाव में है; यह चयन दूसरे खंड के ‘ऊँचा किया जाएगा’ के साथ मूल की शब्दगत समानता भी बनाए रखता है।
- source_word: ταπεινωθήσεται
  choice: नीचा किया जाएगा
  rationale: भविष्यत् कर्मवाच्य को बनाए रखते हुए यह सम्मान और दीनता के उलटाव को स्पष्ट करता है तथा कर्ता को अनिर्दिष्ट छोड़ता है।
- source_word: ταπεινώσει ἑαυτὸν
  choice: अपने आपको नीचा करेगा
  rationale: प्रत्यक्ष कर्मवाचक और आत्मवाचक रचना को सुरक्षित रखता है; यहाँ स्वेच्छा से स्वयं को दीन या निम्न करना अभिप्रेत है।
- source_word: ὑψωθήσεται
  choice: ऊँचा किया जाएगा
  rationale: भविष्यत् कर्मवाच्य और पहले खंड के ὑψόω के साथ शब्दगत समानता दोनों को बनाए रखता है, बिना कर्ता का नाम जोड़े।
theological_decisions:
- issue: कर्मवाच्य क्रियाओं का कर्ता
  choice: कर्मवाच्य रूप बनाए रखा और कर्ता का नाम नहीं जोड़ा
  alternative: ‘परमेश्वर उसे नीचा/ऊँचा करेगा’
  rationale: यूनानी पाठ कर्ता को स्पष्ट नहीं करता। अनिर्दिष्ट कर्मवाच्य सम्भावित दैवी कर्तृत्व को नकारे बिना मूल पाठ की खुली हुई अर्थ-सम्भावना सुरक्षित रखता है।
- issue: पुल्लिंग एकवचन आत्मवाचक रूप का सामान्य अर्थ
  choice: लिंग-चिह्नित ‘अपने आप को’ के बजाय स्वाभाविक सामान्य हिन्दी ‘अपने आपको’
  alternative: ‘वह अपने आप को’ अथवा स्पष्ट पुल्लिंग ‘अपने-आपको’ की व्याख्यात्मक टिप्पणी
  rationale: यूनानी का पुल्लिंग एकवचन व्याकरणिक रूप प्रतिनिधिक रूप से किसी भी व्यक्ति पर लागू होता है। हिन्दी में ‘जो कोई अपने आपको’ स्वाभाविक रूप से सार्वभौमिक है और अनावश्यक रूप से पुरुष-विशेष का अर्थ नहीं देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। समानान्तर वाक्य-संरचना और ‘ऊँचा/नीचा’ का विरोध मूल पद की कहावत-सदृश लय को सुरक्षित रखता है।
