source:
  edition: SBLGNT
  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: hi
  text: पर तुम ‘रब्बी’ न कहलाना,[a] क्योंकि तुम्हारा शिक्षक एक ही है, और तुम सब भाई हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रब्बी’ का अर्थ ‘गुरु’ या ‘शिक्षक’ है। यूनानी पाठ में यह यहूदी उपाधि लिप्यंतरित रूप में आई है; इसे बनाए रखने से उस समय का यहूदी परिवेश और आगे आए ‘शिक्षक’ से शब्दगत भेद सुरक्षित रहता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘भाई’ यूनानी के पुल्लिंग बहुवचन ἀδελφοί का अनुवाद है। इस सन्दर्भ में यह सामूहिक रूप से साथी शिष्यों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: न कहलाना
  rationale: μή के साथ निषेधात्मक निष्क्रिय रूप को स्वाभाविक हिन्दी में सीधे निषेध के रूप में व्यक्त करता है और ‘कहलाए जाना’ का भाव बनाए रखता है।
- source_word: Ῥαββί
  choice: रब्बी
  rationale: यूनानी पाठ में यह यहूदी उपाधि लिप्यंतरित है; हिन्दी में भी इसे बनाए रखने से ऐतिहासिक और यहूदी परिवेश सुरक्षित रहता है।
- source_word: εἷς
  choice: एक ही
  rationale: ‘एक ही’ हिन्दी में एकत्व पर निहित बल को स्वाभाविक ढंग से व्यक्त करता है, बिना यह तय किए कि इस कथन के सभी बाद के व्यावहारिक अनुप्रयोग क्या हैं।
- source_word: ὑμῶν ὁ διδάσκαλος
  choice: तुम्हारा शिक्षक
  rationale: सम्बन्धवाचक ὑμῶν को स्वाभाविक हिन्दी में ‘तुम्हारा’ और διδάσκαλος को ‘शिक्षक’ से व्यक्त किया गया है।
- source_word: πάντες δὲ ὑμεῖς ἀδελφοί ἐστε
  choice: और तुम सब भाई हो
  rationale: यह सामूहिक बल और पारिवारिक रूपक दोनों को बनाए रखता है; पुल्लिंग बहुवचन का व्यापक शिष्य-समुदाय के लिए सम्भावित प्रयोग पाद-टिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: क्या यीशु सभी मानवीय सम्मानसूचक उपाधियों के प्रयोग का पूर्ण निषेध करते हैं, या शिष्य-समुदाय में प्रतिष्ठा-लालसा को सम्बोधित करते हैं?
  choice: सीधे निषेध को उसी रूप में रखा गया है, पर उसके बाद के सभी doctrinal अनुप्रयोगों को अनुवाद में नहीं जोड़ा गया।
  alternative: इसे हर समान उपाधि पर पूर्ण प्रतिबंध मानना, अथवा केवल कपटी महत्त्वाकांक्षा की संकीर्ण आलोचना मानना।
  rationale: यूनानी पाठ स्पष्ट निषेध और उसका कारण देता है, लेकिन उसके सभी भावी अनुप्रयोगों को निर्दिष्ट नहीं करता; इसलिए अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज पाठ। ‘रब्बी’ ऐतिहासिक उपाधि के रूप में रखा गया है; ‘शिक्षक’ सामान्य पाठक के लिए स्पष्ट है। निषेध में ‘न कहलाना’ स्वाभाविक है और मूल की निष्क्रिय अभिव्यक्ति को बनाए रखता है।
