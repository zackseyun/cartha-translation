id: MAT.23.17
reference: Matthew 23:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: hi
  text: हे मूर्खो और अंधो! भला कौन बड़ा है—सोना, या वह मन्दिर[b] जिसने सोने को पवित्र किया[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो सोने को पवित्र बनाता है।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द ναός विशेष रूप से मन्दिर के पवित्र भवन या पवित्रस्थान को भी सूचित कर सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: मूर्खो
  rationale: सम्बोधन बहुवचन को सीधे और स्वाभाविक रूप में रखता है तथा मूल की कठोर फटकार को बिना अनावश्यक गाली-भाव के व्यक्त करता है।
- source_word: τυφλοί
  choice: अंधो
  rationale: यह भी सम्बोधन बहुवचन है। संक्षिप्त समानान्तर रूप ‘मूर्खो और अंधो’ हिन्दी में स्वाभाविक है और मूल की अलंकारिक तीव्रता बनाए रखता है।
- source_word: τίς γὰρ μείζων ἐστίν
  choice: भला कौन बड़ा है
  rationale: τίς दो उल्लिखित विकल्पों के बीच प्रश्न करता है, इसलिए ‘कौन’ उपयुक्त है। γάρ का व्याख्यात्मक/तार्किक बल हिन्दी में स्वाभाविक ‘भला’ और प्रश्न की संरचना से व्यक्त होता है।
- source_word: ὁ χρυσὸς
  choice: सोना
  rationale: सन्दर्भ में वही विशिष्ट सोना अभिप्रेत है जिसकी शपथ की चर्चा है; हिन्दी में ‘सोना’ बिना निश्चयवाचक उपपद के भी स्वाभाविक रूप से वही अर्थ देता है।
- source_word: ὁ ναὸς
  choice: मन्दिर
  rationale: ναός अधिक विशेष रूप से मन्दिर के पवित्र भवन/गर्भस्थान को सूचित कर सकता है, पर मुख्य पाठ में ‘मन्दिर’ साधारण पाठक के लिए स्पष्ट और स्वाभाविक है; अधिक विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: ὁ ἁγιάσας
  choice: जिसने ... पवित्र किया
  rationale: अओरिस्ट सक्रिय कृदन्त के रूप और धार्मिक अर्थ को निकटता से रखता है। हिन्दी में यह मन्दिर द्वारा सोने को पवित्र ठहराए जाने की बात स्पष्ट करता है, जबकि सामान्य सिद्धान्त का निहितार्थ सन्दर्भ से बना रहता है।
- source_word: τὸν χρυσόν
  choice: सोने को
  rationale: सर्वनाम के स्थान पर ‘सोने’ की पुनरावृत्ति मूल की स्पष्टता और तर्कपूर्ण समानान्तरता बनाए रखती है।
theological_decisions:
- issue: मन्दिर-सन्दर्भ में ἁγιάζω का अनुवाद
  choice: पवित्र किया
  alternative: पवित्र बनाता है / पवित्र ठहराया
  rationale: ‘पवित्र किया’ धार्मिक-सांस्कृतिक अर्थ और यूनानी अओरिस्ट कृदन्त दोनों को निकटता से व्यक्त करता है। ‘पवित्र बनाता है’ इसे सामान्य वर्तमान सत्य के रूप में स्पष्ट कर सकता है, पर मूल के कालगत रूप को समतल कर देता है; इसलिए उस अर्थ को पादटिप्पणी में रखा गया है।
- issue: ναός की विशिष्टता
  choice: मन्दिर
  alternative: मन्दिर का पवित्रस्थान
  rationale: मुख्य पाठ में सहज बोध के लिए ‘मन्दिर’ चुना गया है; फिर भी ναός के सम्भावित अधिक विशिष्ट अर्थ को पादटिप्पणी द्वारा सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु तीखा सम्बोधन रखा गया है। ‘हे’ प्रत्यक्ष फटकार को स्पष्ट करता है; प्रश्न में डैश मौखिक तर्क की गति को सहज बनाता है। ‘मन्दिर’ की वर्तनी अपनाई गई है और सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
