base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: hi
  text: इसलिए, जो कोई वेदी की शपथ खाता है, वह वेदी की और उस पर की हर वस्तु की भी शपथ खाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके ऊपर की सभी वस्तुओं की।” यूनानी अभिव्यक्ति किसी एक “भेंट” से अधिक व्यापक है और उसमें वेदी पर रखी हुई हर वस्तु शामिल हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: इसलिए, जो कोई ... शपथ खाता है
  rationale: οὖν पिछले तर्क से निकला निष्कर्ष सूचित करता है, इसलिए ‘इसलिए’ उपयुक्त है। संज्ञा के रूप में प्रयुक्त कृदंत सामान्य नियम व्यक्त करता है; ‘जो कोई’ इस व्यापक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: वेदी की शपथ खाता है
  rationale: शपथ के सूत्र में ἐν का अर्थ साधन अथवा आधार बताने वाला है; हिन्दी मुहावरे में ‘की शपथ खाना’ स्वाभाविक है। θυσιαστήριον के लिए स्थापित और स्पष्ट शब्द ‘वेदी’ है।
- source_word: ὀμνύει
  choice: शपथ खाता है
  rationale: वर्तमान काल यहाँ सामान्य सिद्धान्त व्यक्त करता है। ‘शपथ खाता है’ आधुनिक हिन्दी का स्वाभाविक और संक्षिप्त प्रयोग है।
- source_word: ἐν αὐτῷ
  choice: वेदी की
  rationale: αὐτῷ का संकेत वेदी की ओर है। अस्पष्ट सर्वनाम ‘उसकी’ से बचने और हिन्दी में अर्थ स्पष्ट रखने के लिए संज्ञा दोहराई गई है।
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: और उस पर की हर वस्तु की भी
  rationale: πᾶσι τοῖς ἐπάνω αὐτοῦ व्यापक रूप से वेदी पर मौजूद सभी वस्तुओं को दर्शाता है। ‘हर वस्तु’ इस व्यापकता को बनाए रखता है और इसे केवल एक भेंट तक सीमित नहीं करता। ‘भी’ καί के समावेशी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘उस पर की हर वस्तु’ का संदर्भ
  choice: वेदी पर मौजूद सभी वस्तुओं का सामान्य उल्लेख, बिना उन्हें केवल बलिदान या भेंट कहे
  alternative: उसके ऊपर की सभी वस्तुएँ; उस पर की सभी भेंटें
  rationale: पद 18–19 में वेदी और उस पर की भेंट का उल्लेख है, पर यहाँ यूनानी अभिव्यक्ति अधिक व्यापक है। सामान्य शब्दावली मूल की व्यापकता और यीशु के तर्क को बिना अनावश्यक संकीर्णता के सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘जो कोई’ सामान्य सिद्धान्त को व्यक्त करता है, जबकि ‘वेदी की शपथ खाना’ हिन्दी में शपथ-सूत्र का स्वाभाविक रूप है।
