source:
  edition: SBLGNT
  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: hi
  text: और, ‘जो कोई वेदी की शपथ खाए, उसकी शपथ कुछ नहीं है[b]; लेकिन जो कोई वेदी पर की भेंट[a] की शपथ खाए, वह बाध्य है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चढ़ावा।’ यूनानी शब्द मन्दिर में परमेश्वर को अर्पित की गई वस्तु के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात यीशु जिस शिक्षा की निंदा कर रहे हैं, उसके अनुसार वेदी की शपथ ‘कुछ नहीं मानी जाती,’ लेकिन वेदी पर की भेंट की शपथ बाध्यकारी मानी जाती है।
    reason: cultural_note
lexical_decisions:
- source_word: καί
  choice: और
  rationale: यह निंदा की जा रही शिक्षाओं की शृंखला को आगे बढ़ाने वाला सामान्य संयोजक है।
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: जो कोई ... शपथ खाए / लेकिन जो कोई ... शपथ खाए
  rationale: ὅς के साथ ἄν और एओरिस्ट सब्जंक्टिव अनिश्चित सामान्य शर्त व्यक्त करता है; यह हिन्दी प्रयोग उसके सार्वत्रिक भाव को स्वाभाविक रूप से रखता है।
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: वेदी की शपथ
  rationale: शपथ खाने के प्रसंग में ἐν उस वस्तु को बताता है जिसके नाम पर शपथ खाई जाती है; हिन्दी में ‘की शपथ खाना’ स्वाभाविक मुहावरा है।
- source_word: θυσιαστήριον
  choice: वेदी
  rationale: मन्दिर में बलि चढ़ाने की वेदी के लिए यह मानक और सटीक हिन्दी शब्द है।
- source_word: οὐδέν ἐστιν
  choice: उसकी शपथ कुछ नहीं है
  rationale: यूनानी का शाब्दिक बल ‘कुछ नहीं है’ सुरक्षित रखा गया है। हिन्दी में कर्ता स्पष्ट करने के लिए ‘उसकी शपथ’ कहा गया है, ताकि कथन शपथ खाने वाले व्यक्ति को तुच्छ ठहराता हुआ न लगे।
- source_word: ἐν τῷ δώρῳ
  choice: भेंट की शपथ
  rationale: मन्दिर के प्रसंग में δῶρον परमेश्वर को वेदी पर अर्पित वस्तु है; ‘भेंट’ इसका सीधा और प्रचलित समतुल्य है।
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: वेदी पर रखी
  rationale: यह भेंट की वेदी के ऊपर अथवा उस पर स्थित होने की बात कहता है। सर्वनाम का संकेत स्पष्ट करने के लिए हिन्दी में ‘वेदी’ दोहराया गया है।
- source_word: ὀφείλει
  choice: बाध्य है
  rationale: शपथ के प्रसंग में यह नैतिक-कानूनी दायित्व व्यक्त करता है; हिन्दी अनुवाद मूल की तरह यह नहीं जोड़ता कि व्यक्ति ठीक किस बात के लिए बाध्य है।
theological_decisions:
- issue: शपथ से उत्पन्न दायित्व का अप्रकट कर्म
  choice: ‘बाध्य है’ कहकर कर्म को अप्रकट रखना
  alternative: ‘अपनी शपथ पूरी करने के लिए बाध्य है’
  rationale: यूनानी ὀφείλει का कर्म नहीं बताता। प्रसंग से शपथ पूरी करने का दायित्व समझ आता है, पर उसे मुख्य पाठ में जोड़ना मूल की संक्षिप्तता और उसके अप्रकटपन को समाप्त कर देता।
- issue: οὐδέν ἐστιν का आशय
  choice: ‘उसकी शपथ कुछ नहीं है’
  alternative: ‘उसकी शपथ मान्य नहीं है’
  rationale: ‘मान्य नहीं’ कथन के व्यावहारिक आशय को स्पष्ट करता, पर मूल के तीखे और संक्षिप्त ‘कुछ नहीं’ को व्याख्यात्मक रूप से सीमित कर देता। मुख्य पाठ मूल अभिव्यक्ति रखता है और टिप्पणी सांस्कृतिक आशय स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वेदी,’ ‘भेंट’ और ‘शपथ खाना’ सामान्य बाइबलीय हिन्दी में परिचित हैं। मूल की समानांतर संरचना और संक्षिप्त ‘बाध्य है’ को सुरक्षित रखा गया है।
