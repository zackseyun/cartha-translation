source:
  edition: SBLGNT
  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: hi
  text: हे अंधो! भला कौन बड़ा है—भेंट, या वेदी जो भेंट को पवित्र करती है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τυφλοί
  choice: हे अंधो
  rationale: सम्बोधन में प्रयुक्त बहुवचन विशेषण है। ‘हे अंधो’ सीधे उलाहने और रूपकात्मक अंधेपन को स्वाभाविक हिन्दी में रखता है, पर पद 17 का अधिक कठोर ‘मूर्खो’ यहाँ नहीं जोड़ता।
- source_word: τί γὰρ μεῖζον
  choice: भला कौन बड़ा है
  rationale: τί के तुलनात्मक प्रश्न और μεῖζον के ‘बड़ा’ अर्थ को बनाए रखता है। γάρ यहाँ पूर्व कथन को चुनौतीपूर्ण प्रश्न द्वारा स्पष्ट करता है; हिन्दी में ‘भला’ इस व्याख्यात्मक और अलंकारिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ δῶρον
  choice: भेंट
  rationale: मन्दिर के प्रसंग में δῶρον परमेश्वर को चढ़ाई हुई भेंट है। ‘भेंट’ आधुनिक हिन्दी में ‘उपहार’ से अधिक उपयुक्त धार्मिक शब्द है और अनावश्यक रूप से केवल बलि का अर्थ नहीं लगाता।
- source_word: θυσιαστήριον
  choice: वेदी
  rationale: बलि अथवा धार्मिक अर्पण की वेदी के लिए मानक और स्पष्ट हिन्दी शब्द।
- source_word: τὸ ἁγιάζον
  choice: जो ... पवित्र करती है
  rationale: वर्तमान कृदन्त वेदी की वह भूमिका बताता है जिससे भेंट पवित्र होती है। ‘पवित्र करती है’ सामान्य पाठक के लिए ‘पवित्र ठहराती है’ या संस्कृतनिष्ठ ‘पवित्रीकरण करती है’ से अधिक सहज है और ἁγιάζω का धार्मिक भार बनाए रखता है।
theological_decisions:
- issue: वेदी और भेंट के सम्बन्ध में ἁγιάζω की धार्मिक-पवित्रता सम्बन्धी भाषा
  choice: वेदी जो भेंट को पवित्र करती है
  alternative: वेदी जो भेंट को पवित्र ठहराती है
  rationale: यूनानी वाक्य वेदी को भेंट की पवित्रता का आधार बताता है। ‘पवित्र करती है’ इस दावे को न तो केवल औपचारिक मान्यता तक सीमित करता है, न उसकी धार्मिक शक्ति को किसी विशिष्ट सम्प्रदायगत सिद्धान्त से समझाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज है। ‘हे अंधो!’ प्रत्यक्ष फटकार को सुरक्षित रखता है; दीर्घ विराम-चिह्न तुलनात्मक प्रश्न को स्पष्ट करता है। किसी पादटिप्पणी की आवश्यकता नहीं, क्योंकि ‘भेंट’ और ‘पवित्र करती है’ मूल अर्थ को स्वाभाविक हिन्दी में पर्याप्त रूप से व्यक्त करते हैं।
