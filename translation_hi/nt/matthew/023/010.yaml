  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: hi
  text: और न तुम ‘मार्गदर्शक’ कहलाओ, क्योंकि तुम्हारा मार्गदर्शक एक ही है—मसीह[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘अभिषिक्त जन’; इसे ‘ख्रीस्त’ भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: और न
  rationale: यह निषेध पिछले निषेधों की कड़ी को आगे बढ़ाता है; हिन्दी में ‘और न’ उस संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: κληθῆτε
  choice: कहलाओ
  rationale: यहाँ कर्मवाच्य रूप किसी उपाधि से पुकारे या संबोधित किए जाने का संकेत देता है।
- source_word: καθηγηταί / καθηγητὴς
  choice: मार्गदर्शक / मार्गदर्शक
  rationale: καθηγητής नेतृत्व और शिक्षा देने वाले व्यक्ति को सूचित कर सकता है। ‘मार्गदर्शक’ इस अर्थ-विस्तार को रखता है और निकटवर्ती διδάσκαλος के सामान्य अनुवाद ‘गुरु/शिक्षक’ से अनावश्यक विलय नहीं करता।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है और आधुनिक हिन्दी में स्पष्ट तथा स्वाभाविक है।
- source_word: ὑμῶν ἐστιν εἷς
  choice: तुम्हारा मार्गदर्शक एक ही है
  rationale: यूनानी विधेय रचना और εἷς के एकमात्रता-बल को सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: सप्रत्यय पद यहाँ अभिषिक्त जन की उपाधि के रूप में प्रयुक्त है; हिन्दी का प्रचलित शीर्षकीय रूप ‘मसीह’ अर्थ और बाइबलीय परिचितता दोनों बनाए रखता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: यहाँ शब्द उपाधि के रूप में है। ‘मसीह’ आधुनिक हिन्दी बाइबल-प्रयोग में स्थापित है; पाद-टिप्पणी इसके मूल अर्थ को स्पष्ट करती है, बिना पद में किसी सांप्रदायिक व्याख्या को जोड़ने के।
- issue: καθηγητής की भूमिका-संज्ञा
  choice: मार्गदर्शक
  alternative: शिक्षक / अगुवा / गुरु
  rationale: शब्द में मार्ग दिखाने और निर्देश देने दोनों का भाव हो सकता है। ‘मार्गदर्शक’ इस व्यापकता को रखता है और आसपास के ‘शिक्षक’ संबंधी पद से शब्दगत भेद को कुछ हद तक सुरक्षित करता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुम’ बहुवचन शिष्यों को संबोधित करता है। विराम-चिह्न एकमात्र मार्गदर्शक की पहचान पर स्वाभाविक बल देता है।
