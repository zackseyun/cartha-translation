id: MAT.23.34
reference: Matthew 23:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: hi
  text: इसलिए देखो, मैं तुम्हारे पास भविष्यद्वक्ताओं, बुद्धिमानों और शास्त्रियों को भेज रहा हूँ। उनमें से कुछ को तुम मार डालोगे और क्रूस पर चढ़ाओगे; और कुछ को अपने आराधनालयों में कोड़े लगाओगे और एक नगर से दूसरे नगर तक सताओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; आधुनिक हिन्दी में ‘देखो’ स्वाभाविक और स्पष्ट है।
- source_word: γραμματεῖς
  choice: शास्त्रियों
  rationale: मत्ती के संदर्भ में यह धर्मशास्त्र और व्यवस्था के प्रशिक्षित जानकारों के लिए प्रचलित, सटीक पद है।
- source_word: μαστιγώσετε
  choice: कोड़े लगाओगे
  rationale: क्रिया के शारीरिक दंड वाले ठोस अर्थ को सीधे व्यक्त करता है।
- source_word: συναγωγαῖς
  choice: आराधनालयों
  rationale: यहूदी सामुदायिक उपासना-स्थलों के अर्थ को साधारण हिन्दी पाठक के लिए स्पष्ट रखता है।
- source_word: διώξετε
  choice: सताओगे
  rationale: यहाँ विरोध और पीछा करते हुए उत्पीड़न का व्यापक भाव है, जिसे अगले पदबंध ‘एक नगर से दूसरे नगर तक’ से बल मिलता है।
theological_decisions:
- issue: ἐγὼ ἀποστέλλω में यीशु का प्रथम-पुरुष दावा
  choice: मैं ... भेज रहा हूँ
  alternative: भेजूँगा
  rationale: यूनानी वर्तमान काल और जोरदार ἐγώ को बनाए रखते हुए यीशु के अपने अधिकार से भेजने के कथन को बिना व्याख्यात्मक विस्तार के प्रस्तुत किया गया है।
- issue: प्रेषित समूहों की पहचान
  choice: भविष्यद्वक्ताओं, बुद्धिमानों और शास्त्रियों
  alternative: नबियों, ज्ञानियों और धर्मशिक्षकों
  rationale: तीनों अलग संज्ञाओं को बनाए रखा गया है और उन्हें किसी बाद की कलीसियाई पद-संरचना से नहीं जोड़ा गया।
- issue: ἀποκτενεῖτε καὶ σταυρώσετε का संबंध
  choice: मार डालोगे और क्रूस पर चढ़ाओगे
  alternative: कुछ को मार डालोगे और कुछ को क्रूस पर चढ़ाओगे
  rationale: मूल वाक्य में दोनों क्रियाएँ एक ही ἐξ αὐτῶν के अधीन हैं; हिन्दी भी यह वास्तविक व्याकरणिक खुलापन बनाए रखती है कि ये कार्य समूह के भीतर कैसे विभाजित होंगे।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर लेकिन सहज बाइबलीय शैली। ‘देखो’ से मूल का ध्यानाकर्षक बल रखा गया है। ‘तुम्हारे पास’ स्वाभाविक हिन्दी में πρὸς ὑμᾶς का लक्ष्य व्यक्त करता है।
