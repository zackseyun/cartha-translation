  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: hi
  text: हे साँपो, विषधर साँपों की संतानों! तुम गेहन्ना[a] के न्याय से कैसे बचोगे?
  philosophy: optimal-equivalence
  footnotes:
