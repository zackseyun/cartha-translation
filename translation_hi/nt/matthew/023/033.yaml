lexical_decisions:
- source_word: ὄφεις
  choice: साँपो
  rationale: प्रत्यक्ष संबोधन और अपमानजनक रूपक को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: γεννήματα
  choice: संतानों
  rationale: जो जन्मे या उत्पन्न हुए हैं, उस अर्थ को स्पष्ट रखता है और संबंधवाचक रचना को सुरक्षित रखता है।
- source_word: ἐχιδνῶν
  choice: नागों
  rationale: विषैले सर्पों की तीखी छवि को संक्षिप्त और सामान्य हिन्दी में व्यक्त करता है; यहाँ यह सामान्य 'साँप' की अपेक्षा अधिक प्रखर है।
- source_word: πῶς
  choice: कैसे
  rationale: रूपकात्मक प्रश्न की शक्ति को बनाए रखता है और न केवल सामर्थ्य, न केवल भविष्यकाल, किसी एक पर अनावश्यक बल नहीं देता।
- source_word: φύγητε
  choice: बचोगे
  rationale: न्याय से निकल भागने या बच निकलने के आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κρίσεως
  choice: न्याय
  rationale: शब्द के व्यापक न्यायिक अर्थ को रखता है; 'दण्डादेश' या 'दोषदण्ड' की तुलना में कम व्याख्यात्मक है।
- source_word: γεέννης
  choice: गेहन्ना
  rationale: यूनानी पद की विशिष्ट यहूदी और युगान्त-संबंधी पृष्ठभूमि को बनाए रखता है; परिचित अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: γέεννα का अनुवाद
  choice: गेहन्ना
  alternative: नरक
  rationale: मूल पद की ऐतिहासिक और धर्मवैचारिक विशिष्टता सुरक्षित रहती है, जबकि 'नरक' से जुड़ी बाद की व्यापक धारणाएँ सीधे पाठ में आरोपित नहीं होतीं।
