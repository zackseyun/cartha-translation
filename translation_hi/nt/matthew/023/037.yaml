  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: hi
  text: हे यरूशलेम, हे यरूशलेम! तू जो भविष्यद्वक्ताओं को मार डालता है और तेरे पास भेजे गए लोगों को पत्थर मारता है—कितनी बार मैंने चाहा कि तेरे बच्चों को इकट्ठा करूँ, जैसे मुर्गी अपने चूज़ों को अपने पंखों के नीचे इकट्ठा करती है[a], और तुमने नहीं चाहा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मुर्गी’ के लिए प्रयुक्त यूनानी शब्द का अर्थ अधिक सामान्य रूप से ‘पक्षी’ भी हो सकता है; पर अपने बच्चों को पंखों के नीचे इकट्ठा करने का संदर्भ यहाँ मुर्गी की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: हे यरूशलेम, हे यरूशलेम
  rationale: संबोधन और करुण विलाप के भाव को स्वाभाविक हिन्दी में व्यक्त करते हुए नाम की बलात्मक पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα
  choice: तू जो भविष्यद्वक्ताओं को मार डालता है और ... पत्थरवाह करता है
  rationale: दोनों वर्तमान कृदंत यरूशलेम की लाक्षणिक और लगातार पहचानी जाने वाली प्रवृत्ति बताते हैं। हिन्दी में संबंधवाचक उपवाक्य इसका स्वाभाविक रूप है। व्याकरणिक पुल्लिंग नगर-नाम ‘यरूशलेम’ से मेल खाता है।
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: अपने पास भेजे गए लोगों को
  rationale: पूर्ण निष्क्रिय कृदंत और यरूशलेम की ओर भेजे जाने की दिशा दोनों सुरक्षित हैं; ‘लोगों’ से मनुष्य-संदर्भ स्पष्ट और हिन्दी स्वाभाविक रहती है।
- source_word: ποσάκις ἠθέλησα
  choice: कितनी ही बार मैंने चाहा
  rationale: विलापपूर्ण ‘कितनी बार’ और θέλω के वास्तविक इच्छा-संकल्प को बिना अधिक प्रबल धर्मवैज्ञानिक अर्थ जोड़े व्यक्त करता है।
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: तेरी संतानों को इकट्ठा करूँ
  rationale: ‘संतानों’ से नगर और उसके लोगों के बीच का पारिवारिक रूपक तथा लिंग-समावेशी अर्थ बना रहता है।
- source_word: ὃν τρόπον ὄρνις ἐπισυνάγει τὰ νοσσία αὐτῆς ὑπὸ τὰς πτέρυγας
  choice: जैसे मुर्गी अपने चूज़ों को अपने पंखों के नीचे इकट्ठा करती है
  rationale: तुलना और पहले प्रयुक्त ‘इकट्ठा’ की शाब्दिक समानता सुरक्षित हैं। ὄρνις सामान्यतः पक्षी भी हो सकता है, पर बच्चों को पंखों के नीचे समेटने का मातृ-संदर्भ ‘मुर्गी’ को सर्वाधिक स्वाभाविक बनाता है।
- source_word: καὶ οὐκ ἠθελήσατε
  choice: पर तुमने नहीं चाहा
  rationale: बहुवचन क्रिया को ‘तुमने’ द्वारा सुरक्षित रखा गया है, जिससे एकवचन में संबोधित नगर और उसके लोगों के बीच अर्थपूर्ण बदलाव दिखाई देता है। ‘पर’ तीखे इच्छात्मक विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यीशु की इच्छा और यरूशलेम के लोगों की अनिच्छा का विरोध
  choice: दोनों θέλω रूपों को ‘चाहा’ से व्यक्त किया गया है।
  alternative: पहले को ‘दृढ़ निश्चय किया’ या पूरे वाक्य को केवल भावुक लालसा के रूप में व्याख्यायित करना।
  rationale: मूल पाठ वास्तविक इच्छा और वास्तविक अनिच्छा को आमने-सामने रखता है; अनुवाद व्यापक ईश्वरीय इच्छा, मानवीय उत्तरदायित्व या मसीह-विज्ञान संबंधी विवाद को स्वयं हल नहीं करता।
- issue: ‘तेरी संतानों’ की पहचान
  choice: रूपक को ‘तेरी संतानों’ के रूप में यथावत रखा गया है।
  alternative: ‘तेरे निवासी’ या ‘तेरे लोग’।
  rationale: मूल पाठ नगर को व्यक्तिरूप देकर उससे जुड़े लोगों को उसकी संतान कहता है; अधिक विशिष्ट समूह तय करना अनावश्यक व्याख्या होगी।
- issue: एकवचन संबोधन से बहुवचन अनिच्छा की ओर बदलाव
  choice: ‘तू/तेरी’ के बाद ‘तुमने नहीं चाहा’ रखा गया है।
  alternative: पूरे वाक्य में केवल एकवचन ‘तूने नहीं चाहा’।
  rationale: यूनानी में यरूशलेम का संबोधन एकवचन है, जबकि अंतिम ἠθελήσατε बहुवचन है और संभवतः उसके लोगों की ओर संकेत करता है। हिन्दी में यह बदलाव सुरक्षित रखना पाठ की अर्थपूर्ण तनावशीलता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के लिए सहज रखी गई है। ‘हे’ दोहरे संबोधन के विलापपूर्ण बल को व्यक्त करता है। ‘पत्थरवाह’ बाइबिलीय प्रसंग में समझ में आने वाला संक्षिप्त शब्द है। नगर के लिए एकवचन ‘तू’ और अंत में लोगों के लिए बहुवचन ‘तुम’ मूल की व्याकरणिक तथा अर्थगत भिन्नता को जानबूझकर सुरक्षित रखते हैं।
