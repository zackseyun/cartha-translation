- source_word: ἐν τοῖς δείπνοις
  choice: भोजों में
  rationale: δεῖπνον मुख्य भोजन को दर्शाता है; इस प्रतिष्ठा-केंद्रित प्रसंग में ‘भोज’ औपचारिक और सार्वजनिक भोजन का भाव स्वाभाविक रूप से देता है।
- source_word: τὰς πρωτοκαθεδρίας
