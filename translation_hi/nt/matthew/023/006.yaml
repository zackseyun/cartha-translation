  rationale: πρωτοκαθεδρία सर्वोच्च दर्जे या अग्रता वाले आसनों को दर्शाता है। ‘सबसे प्रमुख आसन’ आराम की अपेक्षा प्रतिष्ठा और पद-प्राधान्य पर बल बनाए रखता है।
- source_word: ἐν ταῖς συναγωγαῖς
  choice: सभागृहों में
