source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: hi
  text: “अंधे मार्गदर्शको, तुम पर हाय! तुम कहते हो, ‘यदि कोई मंदिर की शपथ खाए,[a] तो उसकी शपथ कुछ नहीं है;[b] लेकिन यदि कोई मंदिर के सोने की शपथ खाए, तो वह बाध्य है।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “मंदिर में शपथ खाए।” यहाँ प्रसंग के अनुसार आशय मंदिर को साक्षी बनाकर शपथ लेने का है।'
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “वह कुछ नहीं है”; अर्थात ऐसी शपथ को बाध्यकारी नहीं माना जाता।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: तुम पर हाय
  rationale: यह भविष्यद्वक्ताओं जैसी न्याय-घोषणा की तीव्रता बनाए रखता है और हिन्दी बाइबलीय भाषा में स्वाभाविक तथा परिचित है।
- source_word: ὁδηγοὶ τυφλοὶ
  choice: अंधे मार्गदर्शको
  rationale: यह सम्बोधन और दूसरों को राह दिखाने के रूपक—जबकि वे स्वयं अंधे हैं—दोनों को निकटता से सुरक्षित रखता है।
- source_word: οἱ λέγοντες
  choice: तुम कहते हो
  rationale: सम्बोधन के साथ सम्बन्धवाचक कृदन्त का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: Ὃς ἂν ὀμόσῃ
  choice: यदि कोई … शपथ खाए
  rationale: ἄν के साथ अओरिस्ट सब्जंक्टिव सामान्य अनिश्चित शर्त व्यक्त करता है; हिन्दी में यह रूप सहज और सटीक है।
- source_word: ἐν τῷ ναῷ
  choice: मन्दिर की शपथ खाए
  rationale: मूल पूर्वसर्ग ἐν है, पर प्रसंग में यह शपथ के सूत्र का अंग है। हिन्दी मुहावरे में किसी वस्तु की शपथ खाना उसी को साक्षी बनाकर शपथ लेने का भाव देता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: οὐδέν ἐστιν
  choice: वह कुछ नहीं है
  rationale: मूल की संक्षिप्त और अण्डाकार अभिव्यक्ति को बचाता है; निहित अर्थ कि ऐसी शपथ बाध्यकारी नहीं मानी जाती, पादटिप्पणी में स्पष्ट किया गया है।
- source_word: χρυσῷ τοῦ ναοῦ
  choice: मन्दिर के सोने की
  rationale: सम्बन्धवाचक पदबंध का सीधा अनुवाद, जो मन्दिर और उसके सोने के बीच जानबूझकर किए गए विरोध को बनाए रखता है।
- source_word: ὀφείλει
  choice: वह बाध्य है
  rationale: क्रिया का अर्थ ऋणी अथवा बाध्य होना है। यहाँ शपथ का प्रसंग बाध्यता का स्वरूप बताता है, पर मूल में कर्म व्यक्त नहीं है; इसलिए हिन्दी में भी उसे अनावश्यक रूप से नहीं जोड़ा गया।
theological_decisions:
- issue: शपथ की बाध्यता से जुड़ी अण्डाकार भाषा
  choice: पहली बात को मूल के समान संक्षिप्त रखा गया है—“वह कुछ नहीं है”—और दूसरी में “वह बाध्य है” कहा गया है।
  alternative: 'दोनों को व्याख्यात्मक बनाना: “वह शपथ बाध्यकारी नहीं है … वह अपनी शपथ पूरी करने को बाध्य है।”'
  rationale: यीशु बाध्यकारी और अबाध्य शपथों के बीच की कपटपूर्ण सूक्ष्म भिन्नता की आलोचना कर रहे हैं। मूल यूनानी दोनों जगह संक्षिप्त है; व्याख्यात्मक विस्तार भाव स्पष्ट करता, पर मूल की वास्तविक अण्डाकारता को मिटा देता। पादटिप्पणी आवश्यक आशय बताती है, बिना किसी अतिरिक्त धर्मसिद्धान्त को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, तीखा निन्दात्मक सम्बोधन रखा गया है। “मार्गदर्शक” ὁδηγός के दिशा दिखाने वाले रूपक को “अगुवा” की अपेक्षा अधिक स्पष्ट रखता है। “मन्दिर” और “शपथ खाए” सामान्य पाठक के लिए परिचित और स्वाभाविक शब्द हैं।
