  text: ὁδηγοὶ τυφλοί, ⸀οἱ διϋλίζοντες τὸν κώνωπα τὴν δὲ κάμηλον καταπίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: hi
  text: हे अंधे मार्गदर्शको! तुम मच्छर को तो छानकर निकालते हो, लेकिन ऊँट को निगल जाते हो!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδηγοὶ
  choice: मार्गदर्शको
  rationale: यह संज्ञा दूसरों को राह दिखाने वालों के लिए है। संबोधन के कारण हिंदी में ‘मार्गदर्शको’ स्वाभाविक है और रूपक को बनाए रखता है।
- source_word: τυφλοί
  choice: अंधे
  rationale: यहाँ आध्यात्मिक और नैतिक दृष्टिहीनता का रूपक है। ‘अंधे’ मूल की तीखी फटकार को सीधे सुरक्षित रखता है।
- source_word: διϋλίζοντες
  choice: छानकर निकालते हो
  rationale: क्रिया का अर्थ तरल को छानकर उसमें से कोई वस्तु निकालना है। यह हिंदी प्रयोग क्रिया और उसके निष्कासन-भाव, दोनों को स्पष्ट करता है।
- source_word: τὸν κώνωπα
  choice: मच्छर को
  rationale: κώνωψ एक बहुत छोटे मच्छर-जैसे कीट को दर्शाता है। आधुनिक सामान्य हिंदी में ‘मच्छर’ तुरंत समझ में आता है और ऊँट के साथ अतिशयोक्तिपूर्ण विरोध को बनाए रखता है।
- source_word: τὴν δὲ κάμηλον
  choice: लेकिन ऊँट को
  rationale: δέ का विरोध ‘लेकिन’ से स्पष्ट होता है; ‘ऊँट’ मूल ठोस और असंगत चित्र को ज्यों का त्यों रखता है।
- source_word: καταπίνοντες
  choice: निगल जाते हो
  rationale: यह क्रिया नीचे निगल जाने का अर्थ देती है। ‘निगल जाते हो’ हिंदी में सजीव और स्वाभाविक है तथा अतिशयोक्ति को बिना अतिरिक्त रंग दिए व्यक्त करता है।
theological_decisions:
- issue: अनुष्ठानिक अशुद्धता और नैतिक अनुपात का रूपक
  choice: छोटे अशुद्ध कीट को पेय से सावधानी से निकालने और विशाल ऊँट को निगल जाने का ठोस चित्र बनाए रखा गया है।
  alternative: चित्र को खोलकर केवल ‘छोटी बातों पर ध्यान देना और बड़ी बातों की उपेक्षा करना’ कहना।
  rationale: मूल कथन की शक्ति दो अत्यंत असमान, अशुद्ध माने जाने वाले जीवों के हास्यास्पद विरोध में है। व्याख्यात्मक अमूर्तीकरण उस तीखेपन को घटाता और पाठ से अधिक अर्थ जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है। प्रत्यक्ष संबोधन के लिए ‘हे’ और बहुवचन संबोधन-रूप प्रयुक्त हैं। कोई पादटिप्पणी आवश्यक नहीं, क्योंकि ‘छानकर निकालते हो’ यूनानी क्रिया का निष्कासन-भाव मुख्य पाठ में स्पष्ट कर देता है।
