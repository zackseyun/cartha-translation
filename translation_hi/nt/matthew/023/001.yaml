lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण कथा के क्रम को आगे बढ़ाता है; ‘तब’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: ὁ Ἰησοῦς
  choice: यीशु
  rationale: यूनानी में व्यक्तिवाचक नाम के साथ आया उपपद सामान्य कथात्मक प्रयोग है; हिन्दी में नाम के आगे इसकी अलग अभिव्यक्ति आवश्यक नहीं है।
- source_word: ἐλάλησεν
  choice: कहा
  rationale: λαλέω का अर्थ ‘बोलना’ है, पर आगे आने वाले प्रत्यक्ष कथन की भूमिका में हिन्दी का ‘से कहा’ अधिक स्वाभाविक है और संबोधित श्रोताओं को स्पष्ट रखता है।
- source_word: τοῖς ὄχλοις
  choice: भीड़
  rationale: यूनानी रूप बहुवचन है, पर इस प्रसंग में हिन्दी का समूहवाचक एकवचन ‘भीड़’ सामान्य और सहज है; ‘भीड़ों’ अप्राकृतिक लगेगा।
- source_word: καὶ
  choice: और
  rationale: यह दोनों श्रोता-समूहों को जोड़ने वाला सामान्य समुच्चयबोधक है।
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: अपने शिष्यों
  rationale: μαθηταί के लिए स्थापित हिन्दी पद ‘शिष्य’ है। कर्ता यीशु होने के कारण सम्बन्धवाचक αὐτοῦ को हिन्दी में स्वाभाविक रूप से ‘अपने’ कहा गया है।
