lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह आधुनिक हिन्दी में स्वाभाविक ध्यानाकर्षक है और गंभीर घोषणा का बल बनाए रखता है।
- source_word: ἀφίεται
  choice: छोड़ दिया जाता है
  rationale: वर्तमानकालिक कर्मवाच्य को बनाए रखता है और कर्ता को अनावश्यक रूप से स्पष्ट नहीं करता; प्रसंग में परित्याग का भाव निहित है।
- source_word: ὑμῖν
  choice: तुम्हारे लिए
  rationale: सम्प्रदान कारक का स्वाभाविक हिन्दी रूप है और यह भाव सुरक्षित रखता है कि घर अब उन्हीं के लिए या उन्हीं के अधिकार में छोड़ा जाता है।
- source_word: ὁ οἶκος ὑμῶν
  choice: तुम्हारा घर
  rationale: यूनानी की व्यापक और रूपकात्मक अभिव्यक्ति को ज्यों का त्यों रखता है; मुख्य पाठ में इसे केवल मंदिर या यरूशलेम तक सीमित नहीं करता।
- source_word: ἔρημος
  choice: उजाड़
  rationale: भविष्यद्वाणी और न्याय के प्रसंग में परित्यक्त, निर्जन और विध्वस्त दशा का सशक्त तथा स्वाभाविक हिन्दी बोध देता है।
theological_decisions:
- issue: ‘तुम्हारा घर’ का अभिप्राय
  choice: मुख्य पाठ में ‘तुम्हारा घर’ रखा गया है।
  alternative: ‘तुम्हारा मंदिर’, ‘यरूशलेम’, या ‘इस्राएल का घर/राष्ट्र’।
  rationale: निकटवर्ती प्रसंग मंदिर और यरूशलेम की ओर संकेत करता है, पर यूनानी पद अधिक व्यापक है। ‘घर’ रखने से भविष्यद्वाणी का रूपक और वास्तविक व्याख्यात्मक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गंभीर और भविष्यद्वाणी-सुलभ शैली। ‘देखो’ बोलचाल में समझने योग्य है, जबकि ‘उजाड़’ न्याय और परित्याग के भाव को गरिमा के साथ व्यक्त करता है।
