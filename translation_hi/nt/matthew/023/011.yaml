translation:
  language: hi
  text: पर तुममें जो सबसे बड़ा है, वह तुम्हारा सेवक होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “तुममें जो बड़ा है, वह तुम्हारा सेवक होगा।” यूनानी में प्रयुक्त तुलनात्मक शब्द समूह के भीतर सबसे बड़े व्यक्ति के लिए भी मुहावरेदार ढंग से इस्तेमाल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले पदों में प्रतिष्ठा और ऊँचे संबोधनों की चाह के विपरीत बात प्रस्तुत करता है; आधुनिक हिन्दी में ‘पर’ स्वाभाविक और स्पष्ट है।
- source_word: μείζων
  choice: सबसे बड़ा
  rationale: यद्यपि यूनानी रूप तुलनात्मक है, समूह के भीतर सर्वोच्च स्थान वाले व्यक्ति के लिए इसका प्रयोग श्रेष्ठतम अर्थ में हो सकता है। ‘सबसे बड़ा’ इस सन्दर्भ में स्वाभाविक है।
- source_word: ὑμῶν (पहला प्रयोग)
  choice: तुममें
  rationale: यह अंशवाचक सम्बन्ध व्यक्त करता है—सम्बोधित समूह के भीतर जो सबसे बड़ा है।
- source_word: ἔσται
  choice: होगा
  rationale: भविष्यकाल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὑμῶν (दूसरा प्रयोग)
  choice: तुम्हारा
  rationale: διάκονος के साथ सम्बन्धसूचक अर्थ है, जिसे हिन्दी में ‘तुम्हारा सेवक’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: διάκονος
  choice: सेवक
  rationale: यहाँ आशय दूसरों की सेवा करने वाले से है, किसी तकनीकी कलीसियाई पद से नहीं। ‘सेवक’ सामाजिक दर्जे के उलटाव को स्पष्ट रखता है।
theological_decisions:
- issue: महानता और सेवा के बीच दर्जे का उलटाव
  choice: ‘तुममें जो सबसे बड़ा है, वह तुम्हारा सेवक होगा’
  alternative: ‘तुममें जो बड़ा है, वह तुम्हारा सेवक होगा’
  rationale: यह अनुवाद सच्ची महानता को सेवा में प्रकट होने देता है और किसी बाद के कलीसियाई पद का अर्थ आरोपित नहीं करता। साथ ही, यूनानी तुलनात्मक रूप की वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘सेवक’ को ‘मंत्री’ या ‘डीकन’ पर प्राथमिकता दी गई है, ताकि यहाँ अनपेक्षित संस्थागत या कलीसियाई अर्थ न आए।
