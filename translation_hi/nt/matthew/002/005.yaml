reference: Matthew 2:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: hi
  text: उन्होंने उससे कहा, “यहूदिया के बैतलहम में, क्योंकि भविष्यद्वक्ता के द्वारा ऐसा लिखा गया है[a]:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लिखा है।” यूनानी में पूर्णकालिक कर्मवाच्य है, जो पवित्रशास्त्र का उद्धरण देने की एक प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: उन्होंने
  rationale: मूल में संबंधसूचक लेख पिछले पद के प्रधान याजकों और शास्त्रियों की ओर संकेत करता है। हिन्दी में ‘उन्होंने’ इस संदर्भ को स्वाभाविक रूप से आगे बढ़ाता है; δέ के हल्के संयोजक भाव को अलग शब्द से व्यक्त करना आवश्यक नहीं है।
- source_word: εἶπαν αὐτῷ
  choice: उससे कहा
  rationale: सरल कथन-क्रिया और अप्रत्यक्ष कर्म का सीधा तथा स्वाभाविक हिन्दी रूप।
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: यहूदिया के बैतलहम में
  rationale: संबंधकारक τῆς Ἰουδαίας बताता है कि किस बैतलहम की बात है। यह रूप यूनानी संरचना का पहचान कराने वाला भाव सुरक्षित रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: οὕτως γὰρ
  choice: क्योंकि … ऐसा
  rationale: γάρ उत्तर का आधार प्रस्तुत करता है और οὕτως आगे आने वाले उद्धरण की ओर संकेत करता है। हिन्दी में ‘क्योंकि … ऐसा’ दोनों कार्य स्पष्ट और स्वाभाविक ढंग से करता है।
- source_word: γέγραπται
  choice: लिखा गया है
  rationale: पूर्णकालिक कर्मवाच्य को पारदर्शी रूप से व्यक्त करता है और पवित्रशास्त्र उद्धृत करने की प्रचलित यूनानी अभिव्यक्ति को बनाए रखता है।
- source_word: διὰ τοῦ προφήτου
  choice: भविष्यद्वक्ता के द्वारा
  rationale: διά के साथ संबंधकारक मध्यस्थ साधन या कर्तृत्व को दर्शाता है। ‘के द्वारा’ भविष्यद्वक्ता की मध्यस्थ भूमिका को मूल के अनुरूप सुरक्षित रखता है।
theological_decisions:
- issue: भविष्यद्वक्ता की मध्यस्थ भूमिका
  choice: भविष्यद्वक्ता के द्वारा
  alternative: भविष्यद्वक्ता ने
  rationale: चुना हुआ रूप भविष्यद्वक्ता को संदेश का मानवीय माध्यम बताता है और मूल पाठ में निहित इस संभावना को खुला रखता है कि अंतिम स्रोत परमेश्वर है; ‘भविष्यद्वक्ता ने’ इस मध्यस्थता को कुछ हद तक समतल कर देता।
- issue: पवित्रशास्त्र-उद्धरण का पूर्णकालिक कर्मवाच्य
  choice: लिखा गया है
  alternative: लिखा है
  rationale: यह रूप γέγραπται के कर्मवाच्य और वर्तमान तक बने हुए परिणाम—लिखित वचन के स्थायी रूप से विद्यमान होने—दोनों को अधिक स्पष्ट रूप से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। ‘यहूदिया के बैतलहम’ स्थान की पहचान स्पष्ट करता है; अल्पविराम और अंत का द्विबिंदु अगले पद में जारी भविष्यद्वाणी के उद्धरण से वाक्य को जोड़ते हैं।
