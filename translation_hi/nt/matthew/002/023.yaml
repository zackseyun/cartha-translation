base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: hi
  text: 'और वह आकर नासरत नामक एक नगर में रहने लगा,[a] ताकि जो बात भविष्यद्वक्ताओं के द्वारा कही गई थी, वह पूरी हो: “वह नासरी कहलाएगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नाज़ोरी।” “वह नासरी कहलाएगा” की सटीक भविष्यसूचक पृष्ठभूमि विवादित है; संभव है कि मत्ती किसी एक विशेष वचन को उद्धृत करने के बजाय भविष्यद्वक्ताओं के विषयों का सार दे रहा हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: आकर
  rationale: पूर्वकालिक एओरिस्ट कृदन्त को स्वाभाविक हिन्दी में ‘आकर’ कहना मुख्य क्रिया से पहले की क्रिया और वाक्य का प्रवाह दोनों बनाए रखता है।
- source_word: κατῴκησεν
  choice: रहने लगा
  rationale: यहाँ क्रिया निवास ग्रहण करने का भाव देती है; ‘रहने लगा’ आधुनिक हिन्दी में स्पष्ट है और केवल अस्थायी ठहरने का अर्थ नहीं देता।
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: नासरत नामक एक नगर में
  rationale: κατοικέω के साथ εἰς को हिन्दी मुहावरे के अनुसार ‘में’ कहना स्वाभाविक है। πόλις के लिए ‘नगर’ मूल शब्द के अनुरूप और गरिमापूर्ण है।
- source_word: ὅπως πληρωθῇ
  choice: ताकि ... पूरी हो
  rationale: ὅπως के उद्देश्य/परिणाम के भाव और निष्क्रिय संभावनार्थक क्रिया को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: τὸ ῥηθὲν διὰ τῶν προφητῶν
  choice: जो बात भविष्यद्वक्ताओं के द्वारा कही गई थी
  rationale: ‘के द्वारा’ διά के माध्यम/अभिकरण के भाव को और बहुवचन ‘भविष्यद्वक्ताओं’ को स्पष्ट रूप से बनाए रखता है।
- source_word: Ναζωραῖος
  choice: नासरी
  rationale: संदर्भ में यह नासरत से जुड़ी पहचान का सहज हिन्दी पद है; इसे नाज़ीर की मन्नत से संबंधित अलग संज्ञा नहीं बनाया गया है।
- source_word: κληθήσεται
  choice: कहलाएगा
  rationale: भविष्यत् निष्क्रिय रूप का संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: ऐसी पूर्ति-वाणी की प्रकृति जिसका पुराने नियम में कोई एक हूबहू स्रोत नहीं मिलता
  choice: मुख्य पाठ में बहुवचन ‘भविष्यद्वक्ताओं’ को यथावत रखते हुए इसे सामूहिक या विषयगत भविष्यसूचक साक्ष्य के रूप में खुला रखा गया है।
  alternative: इसे यशायाह 11:1 के ‘अंकुर’ से विशेष रूप से जोड़ना, मसीहा के तिरस्कृत होने की भविष्यसूचक विषयवस्तु का सार मानना, या ‘नाज़ीर’ के रूप में पढ़ना।
  rationale: यूनानी पाठ किसी एक भविष्यद्वक्ता का नाम न लेकर बहुवचन प्रयोग करता है। इसलिए अनुवाद किसी अनुमानित एकल स्रोत को मुख्य पाठ में आरोपित नहीं करता; ‘नाज़ीर’ भी भिन्न यूनानी संज्ञा और भिन्न धारणा है।
- issue: Ναζωραῖος का अनुवाद
  choice: नासरी
  alternative: नाज़ोरी
  rationale: इस प्रसंग में यह नासरत से संबद्ध पदनाम है। रूपगत निकटता और भविष्यसूचक पृष्ठभूमि की अनिश्चितता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण बाइबलीय शैली। ‘भविष्यद्वक्ता’, ‘नगर’ और ‘पूरी हो’ सामान्य पाठक के लिए बोधगम्य हैं। पादटिप्पणी-चिह्न [a] मुख्य पाठ में संबंधित पद के बाद दिया गया है।
