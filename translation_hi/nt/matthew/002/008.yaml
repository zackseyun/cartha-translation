source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: hi
  text: उसने उन्हें बैतलहम भेजकर कहा, “जाओ और उस बालक के विषय में ठीक-ठीक पता लगाओ। जब वह तुम्हें मिल जाए, तो मुझे खबर देना, ताकि मैं भी जाकर उसकी आराधना करूँ[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे दण्डवत करूँ” अथवा “उसके सामने श्रद्धा से झुकूँ।” यूनानी क्रिया का अर्थ आराधना करना या किसी राजा के सामने सम्मान से झुकना—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: भेजकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया εἶπεν से पहले की क्रिया बताता है। ‘भेजकर ... कहा’ हिन्दी में स्वाभाविक रूप से वही क्रम व्यक्त करता है।
- source_word: Πορευθέντες
  choice: जाओ
  rationale: यह कृदंत ἐξετάσατε के साथ आज्ञार्थक भाव में है; हिन्दी में ‘जाओ और ... पता लगाओ’ स्वाभाविक है।
- source_word: ἐξετάσατε ἀκριβῶς
  choice: ठीक-ठीक पता लगाओ
  rationale: क्रिया और क्रिया-विशेषण का मेल सावधानी तथा सटीकता से जाँच-पड़ताल करने का भाव देता है। यह अभिव्यक्ति सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: περὶ τοῦ παιδίου
  choice: उस बालक के विषय में
  rationale: περί यहाँ जाँच-पड़ताल के विषय को दर्शाता है। ‘के विषय में’ मूल संरचना और अर्थ को बनाए रखता है, जबकि अगले वाक्य से स्पष्ट होता है कि उद्देश्य बालक को खोजना है।
- source_word: παιδίου
  choice: बालक
  rationale: παιδίον छोटे बच्चे या बालक को दर्शाता है; ‘बालक’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: ἐπὰν δὲ εὕρητε
  choice: जब वह तुम्हें मिल जाए
  rationale: ἐπάν के साथ संभावित अथवा अपेक्षित भविष्य की परिस्थिति व्यक्त होती है। ‘जब ... मिल जाए’ निर्देश के प्रसंग में स्वाभाविक है और पूर्ण निश्चितता का अनावश्यक दावा नहीं करता।
- source_word: ἀπαγγείλατέ μοι
  choice: मुझे खबर देना
  rationale: ἀπαγγέλλω वापस सूचना पहुँचाने का भाव रखता है। ‘मुझे खबर देना’ आधुनिक हिन्दी में स्वाभाविक रूप से यह अर्थ देता है।
- source_word: ὅπως
  choice: ताकि
  rationale: ὅπως उद्देश्य बताता है; ‘ताकि’ हिन्दी में उसके प्रयोजनार्थक बल को स्पष्ट रखता है।
- source_word: κἀγὼ
  choice: मैं भी
  rationale: κἀγώ हेरोदेस के कथित साझा उद्देश्य पर बल देता है; ‘मैं भी’ इसे सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: जाकर उसकी आराधना करूँ
  rationale: कृदंत और संभावनार्थक क्रिया को हिन्दी में ‘जाकर ... करूँ’ स्वाभाविक रूप से व्यक्त करता है। προσκυνέω आराधना या किसी राजकीय व्यक्ति के सामने श्रद्धापूर्वक झुकने, दोनों का अर्थ दे सकता है; मुख्य पाठ में ‘आराधना’ मत्ती के व्यापक कथात्मक प्रयोग को ग्रहण करती है और विकल्प पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: बालक यीशु के संबंध में προσκυνήσω αὐτῷ का अनुवाद
  choice: उसकी आराधना करूँ
  alternative: उसे दण्डवत करूँ; उसके सामने श्रद्धा से झुकूँ
  rationale: προσκυνέω ईश्वर की आराधना और राजा अथवा उच्च पदस्थ व्यक्ति के सामने श्रद्धापूर्वक झुकने, दोनों को व्यक्त कर सकता है। मत्ती में यीशु के लिए इसका प्रयोग गहरा धार्मिक संकेत रख सकता है, इसलिए मुख्य पाठ में ‘आराधना’ रखा गया है; फिर भी इस पद में हेरोदेस के कथन की राजकीय-सम्मान वाली सम्भावना को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘ठीक-ठीक पता लगाओ’ सावधानी और सटीक जाँच का भाव सामान्य पाठक तक पहुँचाता है। सर्वनाम और क्रियारूप बहुवचन संबोधन के अनुसार रखे गए हैं।
