language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: hi
  text: 'और वह हेरोदेस की मृत्यु तक वहीं रहा, ताकि वह बात पूरी हो जो प्रभु ने भविष्यद्वक्ता के द्वारा कही थी: “मिस्र से मैंने अपने पुत्र को बुलाया।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह होशे 11:1 का उद्धरण है। वहाँ ‘पुत्र’ मूलतः इस्राएल के लिए कहा गया है; यहाँ मत्ती इसे यीशु में पूरा हुआ बताते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: वहीं रहा
  rationale: यूनानी पद का मूल अर्थ ‘वहाँ था’ है, पर इस प्रसंग में हिन्दी में ‘वहीं रहा’ ठहरने की निरंतरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: हेरोदेस की मृत्यु तक
  rationale: τελευτή यहाँ जीवन के अंत, अर्थात मृत्यु, को दर्शाता है; संज्ञात्मक रचना भी सुरक्षित रहती है।
- source_word: ἵνα πληρωθῇ
  choice: ताकि ... पूरी हो
  rationale: यह अनुवाद मत्ती के परिपूर्ति-सूत्र में निहित प्रयोजन/परिणाम के भाव को बनाए रखता है और उसे केवल ‘पूरा करने के लिए’ में सीमित नहीं करता।
- source_word: τὸ ῥηθὲν
  choice: वह बात ... जो ... कही थी
  rationale: कर्मवाच्य अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। पूर्वकालिक ‘कही थी’ वर्तमान प्रसंग से पहले हुए भविष्यद्वाणी के कथन को स्पष्ट करता है।
- source_word: ὑπὸ κυρίου
  choice: प्रभु ने
  rationale: हिन्दी की कर्तृवाच्य रचना में प्रभु को वचन का मूल वक्ता रखा गया है; यूनानी κύριος में ‘परमेश्वर’ जोड़ना आवश्यक नहीं है।
- source_word: διὰ τοῦ προφήτου
  choice: भविष्यद्वक्ता के द्वारा
  rationale: यह प्रभु को वचन का मूल स्रोत और भविष्यद्वक्ता को उसका माध्यम बनाए रखते हुए διά की माध्यमिक अभिकरण-भावना को सुरक्षित रखता है।
- source_word: λέγοντος
  choice: ':'
  rationale: उद्धरण आरम्भ कराने वाले यूनानी कृदंत को हिन्दी में द्विबिंदु द्वारा स्वाभाविक रूप से व्यक्त किया गया है; ‘यह कहते हुए’ यहाँ अनावश्यक रूप से बोझिल होता।
- source_word: Ἐξ Αἰγύπτου
  choice: मिस्र से
  rationale: ἐξ के निर्गमन-स्रोत को सहज और स्पष्ट हिन्दी में व्यक्त करता है। ‘मिस्र में से’ अधिक शब्दशः है, पर आधुनिक हिन्दी में कम स्वाभाविक है।
- source_word: ἐκάλεσα
  choice: मैंने ... बुलाया
  rationale: καλέω यहाँ बाहर बुलाने के अर्थ में है; ‘बुलाया’ होशे 11:1 के संबंध को बनाए रखते हुए सामान्य पाठक के लिए सहज है।
- source_word: τὸν υἱόν μου
  choice: अपने पुत्र को
  rationale: υἱός का विशिष्ट पुत्र-संबंध सुरक्षित रहता है; ‘बच्चे’ से इसका शाब्दिक और धर्मवैचारिक संबंध कमजोर पड़ता।
theological_decisions:
- issue: होशे 11:1 के उद्धरण में ‘पूरी होने’ का स्वरूप
  choice: मत्ती के इस दावे को सीधे रखा गया है कि यीशु का मिस्र से लौटना भविष्यद्वक्ता के द्वारा कही गई बात को पूरा करता है।
  alternative: इसे केवल सीधी भविष्यवाणी अथवा केवल इस्राएल के इतिहास की प्रतिरूपात्मक पुनरावृत्ति के रूप में स्पष्ट करना।
  rationale: पद स्वयं परिपूर्ति का दावा करता है, पर उसकी विधि की व्याख्या नहीं करता। इसलिए अनुवाद किसी एक व्याख्यात्मक सिद्धांत को मुख्य पाठ में नहीं थोपता।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / प्रभु परमेश्वर
  rationale: यूनानी पाठ में κύριος है। ‘प्रभु’ उसका सीधा अनुवाद है; ‘परमेश्वर’ जोड़ना या इब्रानी दिव्य नाम को मुख्य पाठ में पुनर्स्थापित करना यूनानी रूप से आगे जाना होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वहीं रहा’ प्रसंगानुकूल है, जबकि ‘ताकि ... पूरी हो’ मूल के प्रयोजन/परिणाम संबंध और उसकी धर्मवैचारिक अनिर्णीतता को बनाए रखता है।
