source:
  edition: SBLGNT
  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: hi
  text: “रामा में एक आवाज़ सुनाई दी—रोना और बहुत विलाप; राहेल अपने बच्चों के लिए रो रही थी और सांत्वना पाना नहीं चाहती थी, क्योंकि वे अब नहीं रहे।”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विलाप और बड़ा शोक।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसने सांत्वना पाने से इनकार कर दिया।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “क्योंकि वे नहीं हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Φωνὴ ἐν Ῥαμὰ ἠκούσθη
  choice: रामा में एक आवाज़ सुनाई दी
  rationale: यह स्थानवाचक ἐν, कर्मवाच्य ἠκούσθη और भविष्यद्वाणी के गंभीर, व्यक्तिमूलक स्वर को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: रोने और बड़े विलाप की आवाज़
  rationale: κλαυθμός सुनाई देने वाले रोने को और ὀδυρμός शोकपूर्ण विलाप को व्यक्त करता है; πολύς की तीव्रता को ‘बड़े’ से रखा गया है। ‘की आवाज़’ आरम्भिक Φωνή के साथ इस पदबंध का संबंध हिन्दी में स्पष्ट करता है।
- source_word: Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς
  choice: राहेल अपने बच्चों के लिए रो रही थी
  rationale: वर्तमान कृदंत κλαίουσα की जारी क्रिया को ‘रो रही थी’ से और व्यापक τέκνα को लिंग-समावेशी ‘बच्चों’ से व्यक्त किया गया है।
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: सांत्वना पाना नहीं चाहती थी
  rationale: यह θέλω की इच्छा/तत्परता और παρακαλέω के कर्मवाच्य भाव, दोनों को ‘इनकार किया’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: ὅτι οὐκ εἰσίν
  choice: क्योंकि वे अब नहीं रहे
  rationale: यह हिन्दी मुहावरा बच्चों के खो जाने की कठोर वास्तविकता व्यक्त करता है, पर यूनानी से आगे बढ़कर सीधे ‘मर गए’ नहीं कहता। शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: उद्धरण में राहेल का स्वरूप
  choice: राहेल को यिर्मयाह के उद्धरण की मातृ-सदृश भविष्यद्वाणी की आकृति के रूप में बिना व्याख्या जोड़े यथावत रखा गया है।
  alternative: मुख्य पाठ में राहेल को इस्राएल की माताओं का प्रतीक बताना, या उसे केवल एक ऐतिहासिक माता मानना।
  rationale: यूनानी पाठ केवल राहेल को रोती हुई प्रस्तुत करता है। अनुवाद को मत्ती के प्रतीकात्मक/प्रतिरूपात्मक प्रयोग की संभावनाओं को खुला रखना चाहिए, न कि मुख्य पाठ में उनका निर्णय करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। ‘रामा’, ‘राहेल’ और ‘सांत्वना’ मानक हिन्दी बाइबलीय नामावली और गरिमापूर्ण सामान्य प्रयोग के अनुरूप हैं; वाक्य की काव्यात्मक समान्तरता को दीर्घ विराम और द्विबिंदु से स्पष्ट किया गया है।
