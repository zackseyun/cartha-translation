  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: hi
  text: जब उन्होंने उस तारे को देखा, तो उन्हें बहुत ही बड़ा आनन्द हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: जब उन्होंने…देखा
  rationale: अओरिस्ट कृदन्त यहाँ मुख्य क्रिया से जुड़ी समय-संबंधी परिस्थिति बताता है; यह हिन्दी में स्वाभाविक रूप से ‘जब उन्होंने…देखा’ से व्यक्त होता है।
- source_word: δὲ
  choice: तो
  rationale: यह हल्का कथात्मक संयोजक है, प्रबल विरोधसूचक नहीं। ‘जब…तो’ की हिन्दी संरचना प्रसंग को स्वाभाविक ढंग से आगे बढ़ाती है।
- source_word: τὸν ἀστέρα
  choice: उस तारे को
  rationale: संज्ञा का अर्थ ‘तारा’ है और निश्चित उपपद पहले से उल्लिखित विशिष्ट तारे की ओर संकेत करता है; हिन्दी में ‘उस तारे’ से यह संदर्भ स्पष्ट रहता है।
- source_word: ἐχάρησαν
  choice: वे…आनन्द से भर गए
  rationale: χαίρω का यह रूप अर्थ की दृष्टि से सक्रिय है और तीव्र प्रसन्नता व्यक्त करता है। ‘आनन्द से भर गए’ आधुनिक हिन्दी में स्वाभाविक रहते हुए प्रबल भाव बनाए रखता है।
- source_word: χαρὰν μεγάλην σφόδρα
  choice: अत्यन्त आनन्द से
  rationale: मूल में सजातीय कर्म ‘महान आनन्द’ और क्रियाविशेषण σφόδρα मिलकर बहुत प्रबल बलाघात उत्पन्न करते हैं। हिन्दी में ‘अत्यन्त आनन्द से भर गए’ उस तीव्रता को सहज रूप में व्यक्त करता है।
