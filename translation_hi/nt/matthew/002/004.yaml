id: MAT.2.4
reference: Matthew 2:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: hi
  text: और उसने जनता के सभी प्रधान याजकों और शास्त्रियों को इकट्ठा करके उनसे पूछ रहा था कि मसीह[a] का जन्म कहाँ होना था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘अभिषिक्त जन।’ यूनानी उपाधि Χριστός का अर्थ वही है जो इब्रानी मूल की उपाधि ‘मसीह’ का है।
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγὼν
  choice: इकट्ठा करके
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई कार्रवाई दिखाता है; यह हिन्दी में स्वाभाविक रूप से क्रम भी बनाए रखता है।
- source_word: πάντας
  choice: सभी
  rationale: यूनानी शब्द की समग्रता को सीधे व्यक्त करता है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: बहुवचन यहाँ वरिष्ठ याजकीय नेतृत्व के लिए है, न कि कई महायाजकों के लिए।
- source_word: γραμματεῖς
  choice: शास्त्रियों
  rationale: यह यूनानी पद का सीधा और हिन्दी बाइबलीय संदर्भ में समझ में आने वाला अनुवाद है।
- source_word: τοῦ λαοῦ
  choice: लोगों के
  rationale: सम्बन्धकारक को बिना किसी अतिरिक्त जातीय व्याख्या के सुरक्षित रखता है।
- source_word: ἐπυνθάνετο
  choice: पूछताछ की
  rationale: क्रिया साधारण प्रश्न से अधिक जानकारी हासिल करने के उद्देश्य से पूछने का भाव रखती है; हिन्दी कथा में यह स्वाभाविक है।
- source_word: παρ’ αὐτῶν
  choice: उनसे
  rationale: पूर्वसर्गीय वाक्यांश का हिन्दी में स्वाभाविक और सीधा रूप।
- source_word: ποῦ
  choice: कहाँ
  rationale: प्रत्यक्ष प्रश्नवाचक क्रियाविशेषण का सटीक अनुवाद।
- source_word: ὁ χριστὸς
  choice: मसीह
  rationale: इस यहूदी भविष्यवाणी-संबंधी प्रसंग में Χριστός अपेक्षित अभिषिक्त शासक की उपाधि है; ‘मसीह’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: γεννᾶται
  choice: का जन्म ... होना था
  rationale: वर्तमान कर्मवाच्य रूप परोक्ष प्रश्न में अपेक्षित मसीह के भविष्यवाणी किए हुए जन्मस्थान की ओर संकेत करता है; हिन्दी में यह रूप उस अपेक्षा और भूतकालीन कथात्मक संदर्भ दोनों को व्यक्त करता है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: यहाँ हेरोदेस यहूदी भविष्यवाणी में अपेक्षित अभिषिक्त शासक के विषय में पूछ रहा है। ‘मसीह’ उपाधि के उस ऐतिहासिक और धार्मिक संदर्भ को बनाए रखता है, जबकि पादटिप्पणी मूल यूनानी पद का अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘प्रधान याजक’ और ‘शास्त्री’ जैसे स्थापित पद संदर्भगत सटीकता के लिए रखे गए हैं।
