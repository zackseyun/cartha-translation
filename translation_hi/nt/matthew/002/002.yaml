id: MAT.2.2
reference: Matthew 2:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: hi
  text: वे कह रहे थे, “यहूदियों का राजा जो जन्मा है, वह कहाँ है? क्योंकि हमने पूर्व दिशा में[a] उसका तारा देखा और हम उसे दंडवत करने[b] आए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके उदय के समय।” यूनानी वाक्यांश का अर्थ “पूर्व दिशा में” अथवा तारे के “उदय के समय” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “उसकी आराधना करने।” यूनानी क्रिया सन्दर्भ के अनुसार किसी राजा को दंडवत होकर सम्मान देने या आराधना करने—दोनों अर्थ रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: वे कह रहे थे
  rationale: वर्तमान कृदन्त उनके कथन का परिचय देता है; यह हिन्दी में स्वाभाविक कथात्मक रूप है।
- source_word: ὁ τεχθεὶς
  choice: जो जन्मा है
  rationale: संज्ञा की तरह प्रयुक्त कर्मवाच्य कृदन्त को सुरक्षित रखता है और मूल में निहित न होने वाली ‘नवजात’ की धारणा नहीं जोड़ता।
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: यहूदियों का राजा
  rationale: राजकीय उपाधि का सीधा और स्वाभाविक हिन्दी रूप, जो उसके राजनीतिक और मसीही संकेतों को बनाए रखता है।
- source_word: εἴδομεν γὰρ
  choice: क्योंकि हमने … देखा
  rationale: γάρ प्रश्न का कारण बताता है और εἴδομεν यहाँ पूर्ण हुई घटना को व्यक्त करता है।
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: उसका तारा
  rationale: सम्बन्धवाचक सर्वनाम का स्वाभाविक अधिकारसूचक अनुवाद है और तारे की प्रकृति अनिर्धारित रहने देता है।
- source_word: ἐν τῇ ἀνατολῇ
  choice: पूर्व दिशा में
  rationale: ἀνατολή का भौगोलिक अर्थ सन्दर्भ में सम्भव और स्वाभाविक है; ‘उदय के समय’ वाला खगोलीय अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἤλθομεν
  choice: हम … आए हैं
  rationale: प्रत्यक्ष कथन में उनके आ पहुँचने के वर्तमान परिणाम को स्वाभाविक हिन्दी पूर्णकाल व्यक्त करता है।
- source_word: προσκυνῆσαι αὐτῷ
  choice: उसे दंडवत करने
  rationale: ‘दंडवत करना’ झुककर राजकीय सम्मान देने और आराधना करने—दोनों सम्भव अर्थों के लिए पर्याप्त खुला है और क्रिया की शारीरिक मुद्रा को भी व्यक्त करता है।
theological_decisions:
- issue: बालक यीशु के सम्बन्ध में προσκυνῆσαι का अर्थ
  choice: उसे दंडवत करने
  alternative: उसकी आराधना करने; उसे सम्मान देने
  rationale: तात्कालिक सन्दर्भ में वे ‘यहूदियों के राजा’ को खोज रहे हैं, इसलिए राजकीय अभिवादन प्रमुख हो सकता है; फिर भी यूनानी क्रिया आराधना का अर्थ भी रख सकती है। ‘दंडवत’ दोनों सम्भावनाओं को समय से पहले किसी एक में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘दंडवत’ सामान्य धार्मिक-राजकीय अभिवादन की मुद्रा को व्यक्त करते हुए मूल की धर्मवैज्ञानिक अस्पष्टता बनाए रखता है।
