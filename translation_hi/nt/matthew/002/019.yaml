id: MAT.2.19
reference: Matthew 2:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: hi
  text: परन्तु हेरोदेस की मृत्यु के बाद, देखो, प्रभु का एक दूत[a] मिस्र में यूसुफ को स्वप्न में दिखाई देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु का दूत।” यूनानी में यहाँ “दूत” के पहले निश्चित उपपद नहीं है।
    reason: वैकल्पिक अनुवाद और यूनानी की व्याकरणिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: Τελευτήσαντος ... τοῦ Ἡρῴδου
  choice: हेरोदेस की मृत्यु के बाद
  rationale: सम्बन्धकारक निरपेक्ष रचना में आए अओरिस्ट कृदन्त का स्वाभाविक कालवाचक अनुवाद; यह मुख्य घटना से पहले हेरोदेस की मृत्यु होना स्पष्ट करता है।
- source_word: δὲ
  choice: परन्तु
  rationale: कथा में परिवर्तन और पिछले प्रसंग से हल्का विरोध प्रकट करता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: मत्ती की सजीव कथात्मक ध्यान-सूचक अभिव्यक्ति को सहज और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ἄγγελος κυρίου
  choice: प्रभु का एक दूत
  rationale: ἄγγελος के पहले निश्चित उपपद नहीं है; ‘एक दूत’ इसका सीधा हिन्दी प्रतिरूप है, जबकि ‘प्रभु’ κύριος के धार्मिक शीर्षक को सुरक्षित रखता है।
- source_word: φαίνεται
  choice: दिखाई देता है
  rationale: यूनानी ऐतिहासिक वर्तमान की सजीवता को वर्तमान काल में बनाए रखता है और प्रकट होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατ’ ὄναρ
  choice: स्वप्न में
  rationale: मत्ती में स्वप्न के द्वारा प्राप्त दर्शन या प्रकाशन के लिए प्रयुक्त मुहावरे का स्वाभाविक हिन्दी रूप।
- source_word: τῷ Ἰωσὴφ
  choice: यूसुफ को
  rationale: सम्प्रदान कारक को हिन्दी के ‘को’ से व्यक्त किया गया है; नाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: ἐν Αἰγύπτῳ
  choice: मिस्र में
  rationale: यूसुफ के स्थान को बताने वाला सरल स्थानवाचक पदबंध।
theological_decisions:
- issue: ἄγγελος κυρίου में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ κύριος परमेश्वर के लिए धार्मिक उपाधि है; ‘प्रभु’ आधुनिक हिन्दी बाइबलीय भाषा में स्वाभाविक और अर्थानुकूल है।
- issue: ἄγγελος के साथ निश्चितता
  choice: प्रभु का एक दूत
  alternative: प्रभु का दूत
  rationale: यूनानी में ἄγγελος के पहले निश्चित उपपद नहीं है, इसलिए मुख्य पाठ में ‘एक’ रखा गया है। फिर भी उपपद का अभाव अपने आप अनिश्चितता को निर्णायक रूप से सिद्ध नहीं करता, और पारम्परिक ‘प्रभु का दूत’ सम्भव है; इस तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। ‘देखो’ से मूल का ध्यान-सूचक बल और ‘दिखाई देता है’ से ऐतिहासिक वर्तमान सुरक्षित रखा गया है।
