  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: hi
  text: यह कहते हुए, “उठो, बालक और उसकी माता को साथ लो और इस्राएल देश में जाओ, क्योंकि जो बालक के प्राण लेना चाहते थे[a], वे मर चुके हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “क्योंकि बालक के जीवन की खोज करने वाले मर चुके हैं।”
    reason: यूनानी वाक्यांश οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου τεθνήκασιν का पूर्ण, अधिक शब्दानुरूप विकल्प देता है; ‘जीवन की खोज’ यहाँ मुहावरे के कारण होने वाले हत्या के आशय को मुख्य पाठ में रखे बिना संरक्षित करता है।
lexical_decisions:
- source_word: λέγων
  choice: यह कहते हुए
  rationale: वर्तमान कृदंत को बनाए रखते हुए यह पद को पिछले वाक्य में स्वर्गदूत के बोलने से जोड़ता है।
