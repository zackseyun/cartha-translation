  choice: उठो
  rationale: आज्ञार्थक क्रिया से पहले आया यह कृदंत मुहावरे के रूप में उठकर अगला काम करने की आज्ञा देता है; हिन्दी में ‘उठो’ स्वाभाविक और सटीक है।
- source_word: παράλαβε
  choice: साथ लो
  rationale: यहाँ παραλαμβάνω का अर्थ किसी को अपने साथ ले जाना है; ‘साथ लो’ इस भाव को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: τὸ παιδίον
  choice: बालक
  rationale: παιδίον के सामान्य अर्थ ‘बालक’ को रखा गया है; इससे यूनानी पाठ से अधिक आयु-विशेष नहीं जोड़ा जाता।
- source_word: τὴν μητέρα αὐτοῦ
  choice: उसकी माता
  rationale: मूल पाठ के संबंधसूचक सर्वनाम और गरिमापूर्ण बाइबलीय अभिव्यक्ति दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πορεύου
  choice: चले जाओ
  rationale: मध्यवाच्य आज्ञार्थक यहाँ जाने की सीधी आज्ञा है; बहुवचन आदरसूचक नहीं, बल्कि संयुक्त क्रिया ‘चले जाओ’ हिन्दी में एक व्यक्ति को दी गई स्वाभाविक आज्ञा है।
- source_word: εἰς γῆν Ἰσραήλ
  choice: इस्राएल देश में
  rationale: γῆ Ἰσραήλ क्षेत्र या भूमि को दर्शाता है; ‘इस्राएल देश’ भौगोलिक अर्थ को सुरक्षित रखता है।
- source_word: τεθνήκασιν
  choice: मर चुके हैं
  rationale: पूर्णकाल मृत्यु से उत्पन्न वर्तमान दशा पर बल देता है; ‘मर चुके हैं’ घटना और उसके बने हुए परिणाम दोनों को व्यक्त करता है।
- source_word: οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου
  choice: जो बालक के प्राण लेना चाहते थे
  rationale: इस प्रसंग में किसी के ψυχή को खोजना उसके प्राण लेने का प्रयत्न करना है। यह मुहावरे का आशय स्पष्ट करता है, जबकि पाद-टिप्पणी अधिक शाब्दिक रूप देती है।
theological_decisions:
- issue: मृत्यु के खतरे के प्रसंग में ψυχή का अनुवाद
  choice: प्राण
  alternative: आत्मा
  rationale: यहाँ वाक्यांश बालक को मार डालने की कोशिश को दर्शाता है, उसकी अभौतिक आत्मा की खोज को नहीं। ‘प्राण’ हिन्दी में जीवन के खतरे का अर्थ स्वाभाविक रूप से व्यक्त करता है।
