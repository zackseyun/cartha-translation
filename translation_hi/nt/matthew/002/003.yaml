  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: hi
  text: जब राजा हेरोदेस ने यह सुना, तो वह व्याकुल हो उठा, और उसके साथ सारा यरूशलेम भी व्याकुल हो उठा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सारा यरूशलेम’ में नगर-नाम उसके निवासियों के लिए प्रयुक्त है; यह पूरे नगर में फैली व्याकुलता का सामान्य या अतिशयोक्तिपूर्ण वर्णन भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: जब ... ने यह सुना
  rationale: क्रिया का एओरिस्ट कृदन्त यहाँ काल-सूचक है। ‘यह’ निकटवर्ती प्रसंग में ज्योतिषियों द्वारा दी गई सूचना की ओर संकेत करता है और स्वाभाविक हिन्दी बनाता है।
- source_word: δὲ
  choice: अलग शब्द के रूप में व्यक्त नहीं; ‘जब’ वाले वाक्य-विन्यास में समाहित
  rationale: δέ हल्का संक्रमणसूचक संयोजक है; हिन्दी में इसे अलग से ‘परन्तु’ या ‘और’ कहना अनावश्यक विरोध या बोझ पैदा करता।
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: राजा हेरोदेस
  rationale: यह आधुनिक हिन्दी में स्वाभाविक पद-नाम क्रम है और βασιλεύς की उपाधि को सुरक्षित रखता है।
- source_word: ἐταράχθη
  choice: घबरा गया
  rationale: ταράσσω यहाँ भीतर की व्याकुलता, अशान्ति या भयजनित उद्वेग बताता है। ‘घबरा गया’ सामान्य आधुनिक हिन्दी में इस भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है, बिना कारण या तीव्रता को आवश्यकता से अधिक निश्चित किए।
- source_word: πᾶσα Ἱεροσόλυμα
  choice: सारा यरूशलेम
  rationale: यूनानी में नगर का नाम उसके निवासियों के लिए लाक्षणिक रूप से प्रयुक्त है। यह अनुवाद उसी रूपक को बनाए रखता है और मुख्य पाठ में ‘लोग’ जोड़कर अर्थ को अधिक स्पष्ट नहीं करता।
- source_word: μετ’ αὐτοῦ
  choice: उसके साथ ... भी
  rationale: यह μετά के सहचर्य-भाव को स्वाभाविक हिन्दी में व्यक्त करता है और हेरोदेस तथा यरूशलेम की साझा घबराहट को जोड़ता है।
theological_decisions:
- issue: πᾶσα Ἱεροσόλυμα का दायरा
  choice: नगर और उसके निवासियों का सामूहिक/लाक्षणिक उल्लेख
  alternative: यह अतिशयोक्ति से बहुत-से निवासियों को, या विशेष रूप से यरूशलेम के नेतृत्व-वर्ग को सूचित कर सकता है
  rationale: यूनानी पाठ पूरे नगर का नाम लेता है और किसी विशेष समूह को नहीं चुनता। इसलिए मुख्य पाठ उस व्यापक कथन और उसकी तनावपूर्ण अस्पष्टता को बनाए रखता है; पादटिप्पणी लाक्षणिक तथा सम्भावित अतिशयोक्तिपूर्ण प्रयोग स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘घबरा गया’ सामान्य पाठक के लिए स्वाभाविक है; ‘सारा यरूशलेम’ मूल की लाक्षणिक अभिव्यक्ति को सुरक्षित रखता है। पादटिप्पणी चिह्न मुख्य पाठ में सम्मिलित है।
