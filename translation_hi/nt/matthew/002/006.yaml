id: MAT.2.6
reference: Matthew 2:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: hi
  text: और हे बैतलहम, यहूदा की भूमि, तू यहूदा के शासकों में किसी भी तरह सबसे छोटा नहीं है; क्योंकि तुझमें से एक शासक निकलेगा[a], जो मेरी प्रजा इस्राएल की चरवाही करेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निकलेगा’ का अर्थ ‘बाहर आएगा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘चरवाही करेगा’ में चरवाहे की तरह देखभाल करने के साथ शासन करने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: भूमि
  rationale: यहाँ γῆ बैतलहम को यहूदा से जोड़ने वाला भौगोलिक पद है; ‘भूमि’ उसके क्षेत्रीय अर्थ को सीधे बनाए रखता है।
- source_word: οὐδαμῶς
  choice: किसी भी तरह ... नहीं
  rationale: यह अभिव्यक्ति साधारण निषेध से अधिक प्रबल है और यूनानी क्रियाविशेषण के जोर को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: ἐλαχίστη
  choice: सबसे छोटा
  rationale: यह सर्वोत्तमावस्था का पद है। ‘सबसे छोटा’ आकार और महत्त्व—दोनों की संभावित छाया को खुला रखता है; प्रसंग में मुख्य बल पद या महत्त्व पर है।
- source_word: ἡγεμόσιν
  choice: शासकों
  rationale: यह पद शासन या नेतृत्व करने वालों को सूचित करता है। ‘शासकों’ राजनीतिक-राजकीय भाव बनाए रखता है, यद्यपि नगर का शासकों में गिना जाना रूपकात्मक या प्रतिनिधिक भाषा है।
- source_word: ἐξελεύσεται
  choice: निकलेगा
  rationale: ἐξέρχομαι का मूल भाव किसी स्थान में से बाहर आने या निकलने का है। ‘तुझमें से ... निकलेगा’ हिन्दी में स्वाभाविक रहते हुए इस दिशा-बोध को बचाता है।
- source_word: ἡγούμενος
  choice: एक शासक
  rationale: संज्ञा के रूप में प्रयुक्त यह कृदन्त नेतृत्व और शासन करने वाले व्यक्ति को दर्शाता है; ‘एक शासक’ आने वाले व्यक्ति की राजकीय भूमिका स्पष्ट करता है।
- source_word: ποιμανεῖ
  choice: चरवाही करेगा
  rationale: ποιμαίνω का प्रत्यक्ष अर्थ भेड़ों की चरवाही करना है और रूपकतः शासन करना भी हो सकता है। ‘चरवाही करेगा’ चरवाहे की महत्त्वपूर्ण बिंबावली को सुरक्षित रखता है।
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: मेरी प्रजा इस्राएल
  rationale: यह अनुवाद वाचा-संबंधी ‘मेरी प्रजा’ और उसके समानाधिकरण ‘इस्राएल’ को बिना अतिरिक्त व्याख्या के बनाए रखता है।
theological_decisions:
- issue: आने वाले व्यक्ति के राजकीय और चरवाहे-संबंधी दोनों रूप
  choice: ἡγούμενος का ‘एक शासक’ और ποιμανεῖ का ‘चरवाही करेगा’ अनुवाद किया गया है।
  alternative: दोनों पदों को केवल राजनीतिक भाषा में ‘अगुवा’ और ‘शासन करेगा’, अथवा केवल चरवाहे की भाषा में व्यक्त करना।
  rationale: मूल पाठ शासन और चरवाही की बिंबावलियों को साथ रखता है। दोनों को अलग-अलग सुरक्षित रखने से राजकीय अधिकार और अपनी प्रजा की देखभाल का संयुक्त भाव बना रहता है।
- issue: बैतलहम का ‘शासकों में’ गिना जाना
  choice: असामान्य अभिव्यक्ति को ‘यहूदा के शासकों में’ के रूप में बनाए रखा गया है।
  alternative: इसे स्पष्ट करके ‘यहूदा के प्रमुख नगरों में’ या ‘यहूदा के कुलों में’ कहना।
  rationale: यूनानी पाठ में ἡγεμόσιν व्यक्तियों या नेतृत्वकारी इकाइयों की ओर संकेत करता है। ‘नगरों’ या ‘कुलों’ का स्पष्ट जोड़ वास्तविक अस्पष्टता और उद्धरण की विशिष्ट भाषा को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सीधे संबोधन के कारण ‘हे बैतलहम’ तथा एकवचन ‘तू/तुझमें’ रखा गया है। ‘प्रजा’ राजकीय और वाचा-संबंधी प्रसंग में ‘लोगों’ से अधिक उपयुक्त है।
