reference: Matthew 2:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: hi
  text: राजा की बात सुनकर वे चल पड़े। और देखो, जिस तारे को उन्होंने पूरब में[a] देखा था, वह उनके आगे-आगे चलता गया, जब तक कि वह उस जगह के ऊपर पहुँचकर ठहर न गया जहाँ बालक था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके उदय के समय”; यूनानी अभिव्यक्ति का अर्थ पूरब दिशा या क्षेत्र भी हो सकता है और किसी तारे के उदय का समय भी।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: राजा की बात सुनकर
  rationale: ἀκούω के साथ संबंधकारक व्यक्ति उस व्यक्ति को सूचित कर सकता है जिसकी बात सुनी गई। यह हिंदी में स्वाभाविक है और पद में न दिए गए ‘हेरोदेस’ नाम को नहीं जोड़ता।
- source_word: ἐπορεύθησαν
  choice: वे चल पड़े
  rationale: यह यात्रा आरंभ करने या आगे बढ़ने की स्वाभाविक हिंदी अभिव्यक्ति है और यूनानी कथानक की गति को बनाए रखती है।
- source_word: ἰδοὺ
  choice: और देखो
  rationale: यह ध्यान आकर्षित करने वाले कथात्मक संकेत को स्पष्ट और वर्तमान हिंदी में बनाए रखता है।
- source_word: ὃν εἶδον
  choice: जिस तारे को उन्होंने ... देखा था
  rationale: ‘देखा था’ पहले घट चुकी घटना और वर्तमान दृश्य के बीच समय-संबंध को हिंदी में स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ἐν τῇ ἀνατολῇ
  choice: पूरब में
  rationale: यह अभिव्यक्ति दिशा या क्षेत्र के अर्थ में स्वाभाविक है; ‘उसके उदय के समय’ वाला संभव खगोलीय अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: προῆγεν αὐτούς
  choice: वह उनके आगे-आगे चलता गया
  rationale: यह तारे के उनके आगे जाने की चित्रात्मकता को बनाए रखता है, बिना उसके मार्गदर्शन की रीति को अनावश्यक रूप से समझाए।
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: जब तक कि वह ... पहुँचकर ठहर न गया
  rationale: यह पहुँचने और फिर रुकने के यूनानी क्रम को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐπάνω οὗ ἦν τὸ παιδίον
  choice: उस जगह के ऊपर ... जहाँ बालक था
  rationale: यह स्थान के ऊपर तारे के ठहरने का संबंध स्पष्ट रखता है और παιδίον का सीधा अनुवाद ‘बालक’ करता है।
theological_decisions:
- issue: तारे के वर्णन में ἐν τῇ ἀνατολῇ का अर्थ
  choice: पूरब में
  alternative: उसके उदय के समय
  rationale: यूनानी पदबंध भौगोलिक अर्थ में ‘पूरब में’ अथवा खगोलीय अर्थ में ‘उसके उदय के समय’ हो सकता है। मुख्य पाठ में परिचित और सहज अर्थ रखा गया है, जबकि वास्तविक lexical ambiguity को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘और देखो’ मूल के कथात्मक ध्यान-संकेत को बनाए रखता है; ‘आगे-आगे चलता गया’ दृश्य की सजीवता को व्यक्त करता है, पर तारे की प्रकृति या गति की व्याख्या नहीं करता।
