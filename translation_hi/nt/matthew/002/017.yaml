  yaml_path: translation/nt/matthew/002/017.yaml
  text: 'Then what was spoken through Jeremiah the prophet was fulfilled[a], saying:'
translation:
  language: hi
  text: 'तब वह वचन पूरा हुआ जो यिर्मयाह भविष्यवक्ता के द्वारा कहा गया था:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कथा में घटनाक्रम को आगे बढ़ाने वाला कालवाचक क्रियाविशेषण है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: ἐπληρώθη
  choice: पूरा हुआ
  rationale: मत्ती के पूर्ति-सूत्र में प्रयुक्त अओरिस्ट कर्मवाच्य का सीधा और प्रचलित हिन्दी रूप, जो भविष्यवाणी की पूर्ति का दावा सुरक्षित रखता है।
- source_word: τὸ ῥηθὲν
  choice: वह वचन ... जो ... कहा गया था
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त को स्वाभाविक हिन्दी सापेक्ष उपवाक्य में व्यक्त किया गया है; ‘वचन’ आगे आने वाले भविष्यसूचक कथन को सूचित करता है।
- source_word: διὰ Ἰερεμίου
  choice: यिर्मयाह ... के द्वारा
  rationale: διά के साथ संबंधकारक माध्यम अथवा मध्यस्थ कर्तृत्व दर्शाता है; यह रूप यिर्मयाह को भविष्यसूचक वाणी के माध्यम के रूप में बनाए रखता है।
- source_word: τοῦ προφήτου
  choice: भविष्यवक्ता
  rationale: यिर्मयाह की भूमिका बताने वाला समानाधिकरण; आधुनिक हिन्दी में स्वाभाविक रूप से नाम के बाद रखा गया है।
- source_word: λέγοντος
  choice: 'कहा गया था:'
  rationale: यह आगे आने वाले उद्धरण का परिचय देता है। हिन्दी वाक्य-विन्यास में इसे मुख्य ‘कहा गया था’ के साथ समाहित करने से अर्थ स्पष्ट रहता है, यद्यपि यूनानी में यह वर्तमान कृदन्त है।
theological_decisions:
- issue: मत्ती का पूर्ति-सूत्र
  choice: ‘पूरा हुआ’ के स्पष्ट पूर्ति-संबंधी शब्द बनाए रखना
  alternative: ‘ऐसा हुआ कि वह वचन पूरा हो’
  rationale: यूनानी पाठ घटना को भविष्यसूचक वचन की पूर्ति के रूप में प्रस्तुत करता है; अनुवाद इस साहित्यिक-धर्मवैचारिक दावे को न तो नरम करता है, न कारण अथवा उद्देश्य का अतिरिक्त भाव जोड़ता है।
- issue: λέγοντος का व्याकरणिक संबंध
  choice: उद्धरण-परिचय को ‘कहा गया था:’ में स्वाभाविक रूप से समाहित करना
  alternative: ‘यह कहते हुए:’
  rationale: यूनानी कृदन्त संबंधकारक में है और निकटतम रूप से यिर्मयाह से जुड़ सकता है, पर पूरा सूत्र भविष्यसूचक कथन का परिचय देता है। हिन्दी में शाब्दिक ‘यह कहते हुए’ अस्पष्ट या अस्वाभाविक होगा; पादटिप्पणी अधिक औपचारिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘यिर्मयाह’ और ‘भविष्यवक्ता’ प्रचलित बाइबलीय नामावली के अनुरूप हैं; वाक्य को अनावश्यक संस्कृतनिष्ठता से बचाया गया है।
