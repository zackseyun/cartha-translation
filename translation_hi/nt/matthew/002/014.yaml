  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: hi
  text: तब वह उठा और रात में बालक और उसकी माता को साथ लेकर मिस्र चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: तब
  rationale: यह हल्का कथात्मक संयोजक है, जो पिछली आज्ञा के बाद की घटना को आगे बढ़ाता है। ‘तब’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से प्रबल कारण-संबंध नहीं जोड़ता।
- source_word: ἐγερθεὶς
  choice: वह उठा
  rationale: अओरिस्ट कृदन्त यूसुफ के तत्काल उठकर कार्य करने को दर्शाता है। हिन्दी में इसे मुख्य क्रिया के रूप में रखना सहज और स्पष्ट है।
- source_word: παρέλαβε
  choice: साथ लेकर
  rationale: यहाँ παραλαμβάνω का अर्थ किसी को अपने साथ ले जाना है। ‘साथ लेकर’ केवल ‘लेने’ की अपेक्षा इस भाव को अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: τὸ παιδίον
  choice: बालक
  rationale: παιδίον छोटे बच्चे को सूचित करता है। ‘बालक’ गरिमापूर्ण, सुबोध और प्रसंगानुकूल है, जबकि आयु के बारे में अतिरिक्त निश्चितता नहीं जोड़ता।
- source_word: τὴν μητέρα αὐτοῦ
  choice: उसकी माता
  rationale: सर्वनाम स्वाभाविक रूप से बालक की ओर संकेत करता है। ‘उसकी माता’ यूनानी रचना का संबंध बनाए रखता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: νυκτὸς
  choice: रात ही में
  rationale: समय-सूचक संबंधकारक बताता है कि कार्य रात में हुआ। ‘ही’ प्रसंग के तत्काल रात्रिकालीन प्रस्थान को स्वाभाविक हिन्दी में उभारता है, बिना नया तथ्य जोड़े।
- source_word: ἀνεχώρησεν
  choice: चला गया
  rationale: ἀναχωρέω यहाँ किसी स्थान से निकलकर दूसरे गंतव्य की ओर जाने को दर्शाता है। ‘चला गया’ वर्तमान हिन्दी में स्वाभाविक है और ‘पीछे हट गया’ जैसे भ्रामक सैन्य भाव से बचता है।
- source_word: εἰς Αἴγυπτον
  choice: मिस्र
  rationale: εἰς गंतव्य की दिशा बताता है। हिन्दी में ‘मिस्र चला गया’ स्वाभाविक रूप से ‘मिस्र को/की ओर’ का अर्थ देता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। वाक्य यूनानी घटनाक्रम—उठना, बालक और उसकी माता को साथ लेना, और रात में मिस्र जाना—को स्पष्ट और स्वाभाविक रूप में रखता है। अंग्रेज़ी परामर्श-पाठ का फुटनोट चिह्न और उसका पाठ आपस में असंगत हैं तथा यहाँ किसी वास्तविक पाठगत या अर्थगत अस्पष्टता की आवश्यकता नहीं है, इसलिए कोई फुटनोट नहीं रखा गया।
