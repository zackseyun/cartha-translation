id: MAT.2.13
reference: Matthew 2:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: hi
  text: उनके चले जाने के बाद, देखो, प्रभु का एक दूत[a] यूसुफ को स्वप्न में दिखाई दिया और उसने कहा, “उठो, बालक और उसकी माता को साथ लेकर मिस्र भाग जाओ। जब तक मैं तुम्हें न बताऊँ, तब तक वहीं रहना; क्योंकि हेरोदेस उस बालक को ढूँढ़ने ही वाला है[b], ताकि उसे नष्ट कर दे[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु का दूत।” यूनानी में ‘दूत’ के साथ निश्चित उपपद नहीं है, फिर भी इस पदबंध को परिचित बाइबलीय अभिव्यक्ति के रूप में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में भाव है कि हेरोदेस शीघ्र ही बालक को ढूँढ़ने का इरादा रखता है।
    reason: lexical_alternative
  - marker: c
    text: या, “उसे मार डाले।” यूनानी में शाब्दिक भाव ‘उसे नष्ट कर दे’ है, जिसका यहाँ अर्थ उसकी जान लेना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: उनके चले जाने के बाद
  rationale: यह संबंधवाचक स्वतंत्र रचना पहले पूरी हुई क्रिया को दिखाती है। ‘उनके’ का संकेत पिछले प्रसंग के ज्योतिषियों की ओर है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: मत्ती के अकस्मात और ध्यान आकर्षित करने वाले कथात्मक संकेत को बनाए रखता है।
- source_word: ἄγγελος κυρίου
  choice: प्रभु का एक दूत
  rationale: ἄγγελος के साथ निश्चित उपपद नहीं है, इसलिए ‘एक दूत’ मूल रचना को स्वाभाविक हिन्दी में व्यक्त करता है; κύριος के लिए प्रतिष्ठित बाइबलीय संबोधन ‘प्रभु’ रखा गया है।
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: यूसुफ को स्वप्न में दिखाई दिया
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर हिन्दी कथा में भूतकाल स्वाभाविक है। κατ’ ὄναρ मुहावरे का अर्थ ‘स्वप्न में’ है।
- source_word: Ἐγερθεὶς παράλαβε
  choice: उठो, ... को साथ लेकर
  rationale: आदेशों की शृंखला में कृदन्त Ἐγερθεὶς आदेशात्मक बल रखता है, और παράλαβε यहाँ अपने साथ ले जाने को कहता है।
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: बालक और उसकी माता
  rationale: पुत्र के लिए παιδίον का सामान्य अर्थ ‘बालक’ है और αὐτοῦ स्वाभाविक रूप से उसी बालक की ओर संकेत करता है।
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: मिस्र भाग जाओ
  rationale: φεῦγε संकट से बच निकलने की तात्कालिकता व्यक्त करता है; ‘भाग जाओ’ आधुनिक हिन्दी में इस बल को स्पष्ट रखता है।
- source_word: ἴσθι ἐκεῖ
  choice: वहीं रहना
  rationale: शाब्दिक अर्थ ‘वहाँ होना’ है, पर प्रसंग में लगातार वहीं बने रहने का आदेश है।
- source_word: ἕως ἂν εἴπω σοι
  choice: जब तक मैं तुम्हें न बताऊँ
  rationale: यह रचना भविष्य की अनिश्चित सीमा व्यक्त करती है; हिन्दी में यह रूप संक्षिप्त और स्वाभाविक है।
- source_word: μέλλει ... ζητεῖν
  choice: ढूँढ़ने ही वाला है
  rationale: μέλλει निकट भविष्य के इरादे या आसन्न कार्य को व्यक्त करता है; ‘ही वाला है’ उस तात्कालिकता को बनाए रखता है।
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: ताकि उसे नष्ट कर दे
  rationale: यह उद्देश्यसूचक रचना है। ἀπόλλυμι का मूल अर्थ ‘नष्ट करना’ है और इस प्रसंग में उसका आशय बालक की हत्या करना है।
theological_decisions:
- issue: ἄγγελος κυρίου में दूत की निश्चितता
  choice: प्रभु का एक दूत
  alternative: प्रभु का दूत
  rationale: यूनानी में ἄγγελος के साथ निश्चित उपपद नहीं है। अनिश्चित रूप को मुख्य पाठ में रखना व्याकरण के अधिक निकट है, जबकि परिचित बाइबलीय पदबंध के रूप में निश्चित समझ भी संभव है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस ईश्वरीय संदर्भ में ‘प्रभु’ आधुनिक हिन्दी बाइबल की स्वाभाविक और सम्मानपूर्ण उपाधि है तथा पाठ से आगे कोई अधिक संकीर्ण पहचान आरोपित नहीं करती।
- issue: ἀπολέσαι का मृत्यु-संदर्भ
  choice: नष्ट कर दे
  alternative: मार डाले
  rationale: मुख्य पाठ व्यापक यूनानी शब्द को सुरक्षित रखता है, जबकि प्रसंग में उसके स्पष्ट प्राणघातक अर्थ को पादटिप्पणी बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देखो’ से मूल का जीवंत कथात्मक संकेत, ‘भाग जाओ’ से संकट की तात्कालिकता और ‘स्वप्न’ से बाइबलीय गरिमा बनी रहती है। सभी पादटिप्पणी-चिह्न संबंधित पदों के ठीक बाद रखे गए हैं।
