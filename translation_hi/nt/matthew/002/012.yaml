  terminology: “स्वप्न,” “चेतावनी,” “हेरोदेस,” “मार्ग,” and “अपने देश” are clear and suitable for modern standard Hindi. “दूसरे मार्ग से” faithfully renders δι’ ἄλλης ὁδοῦ.
