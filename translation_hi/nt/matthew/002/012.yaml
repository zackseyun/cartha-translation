id: MAT.2.12
reference: Matthew 2:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: hi
  text: और स्वप्न में यह चेतावनी पाकर कि वे हेरोदेस के पास न लौटें, दूसरे मार्ग से अपने देश लौट गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρηματισθέντες
  choice: चेतावनी पाकर
  rationale: निष्क्रिय कृदन्त यहाँ किसी दिव्य स्रोत से चेतावनी या निर्देश मिलने का भाव देता है। ‘चेतावनी पाकर’ स्वाभाविक हिन्दी है और परमेश्वर को स्पष्ट कर्ता के रूप में जोड़े बिना निहित दिव्य स्रोत को बनाए रखता है।
- source_word: κατ’ ὄναρ
  choice: स्वप्न में
  rationale: मत्ती में यह अभिव्यक्ति स्वप्न के माध्यम से प्राप्त संदेश को दर्शाती है; ‘स्वप्न में’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: μὴ ἀνακάμψαι
  choice: न लौटें
  rationale: μή सहित अनंत क्रिया चेतावनी की विषयवस्तु बताती है। यात्रा के प्रसंग में ‘न लौटें’ संक्षिप्त और स्वाभाविक है।
- source_word: πρὸς Ἡρῴδην
  choice: हेरोदेस के पास
  rationale: πρός और कर्मकारक किसी व्यक्ति की ओर जाने को व्यक्त करते हैं। हिन्दी में ‘हेरोदेस के पास’ इस संबंध को स्वाभाविक ढंग से बताता है।
- source_word: δι’ ἄλλης ὁδοῦ
  choice: दूसरे मार्ग से
  rationale: ὁδός यहाँ यात्रा का ठोस मार्ग है। ‘दूसरे मार्ग से’ मूल के ‘अन्य मार्ग’ भाव को स्पष्टतः बनाए रखता है।
- source_word: ἀνεχώρησαν
  choice: लौट गए
  rationale: ἀναχωρέω का अर्थ चले जाना या प्रस्थान करना है। अपने देश की दिशा में गति के साथ हिन्दी में ‘लौट गए’ प्रसंगानुकूल है; लौटने का गंतव्य अगले पदबंध से स्पष्ट है।
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: अपने देश
  rationale: χώρα देश, भूभाग या प्रदेश हो सकता है। ज्योतिषियों के घर वापस जाने के प्रसंग में ‘अपने देश’ सबसे स्वाभाविक और सटीक है।
theological_decisions:
- issue: चेतावनी का निहित दिव्य स्रोत
  choice: मुख्य पाठ में निष्क्रिय अभिव्यक्ति ‘चेतावनी पाकर’ रखी गई है।
  alternative: ‘परमेश्वर से चेतावनी पाकर’ या ‘दिव्य चेतावनी पाकर’
  rationale: प्रसंग और χρηματισθέντες का निष्क्रिय प्रयोग दिव्य कर्ता का संकेत देते हैं, पर इस पद में परमेश्वर का नाम स्पष्ट रूप से नहीं है। इसलिए अनुवाद संकेत को सुरक्षित रखता है, पर कर्ता को जोड़कर अस्पष्टता समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। वाक्य में अनावश्यक संस्कृतनिष्ठता से बचते हुए मूल की क्रमबद्धता और निहित दिव्य कर्तृत्व सुरक्षित रखा गया है।
