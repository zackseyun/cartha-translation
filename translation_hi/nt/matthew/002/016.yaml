reference: Matthew 2:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: hi
  text: तब हेरोदेस ने जब देखा कि मागियों[b] ने उसे धोखा दिया था[a], तो वह बहुत क्रोधित हुआ। उसने लोगों को भेजकर बैतलहम और उसके आस-पास के सभी क्षेत्रों में दो वर्ष और उससे कम आयु के सभी लड़कों को मरवा डाला। यह उसने उस समय के अनुसार किया, जिसका उसने मागियों से ठीक-ठीक पता लगाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “उसका उपहास किया था” या “उसे मूर्ख बनाया था।”
    reason: lexical_alternative
  - marker: b
    text: परंपरागत अनुवाद, “बुद्धिमान पुरुष।” यूनानी शब्द मागी है, जो पूर्वी ज्योतिषी-विद्वानों के लिए प्रयुक्त होता था।
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह घटनाक्रम में अगली घटना को स्वाभाविक और संक्षिप्त ढंग से जोड़ता है।
- source_word: ἰδὼν ὅτι ἐνεπαίχθη
  choice: जब देखा कि ... उसे धोखा दिया है
  rationale: संदर्भ में हेरोदेस को यह बोध होता है कि वे लौटकर न आकर उसे विफल कर गए। ‘धोखा दिया’ आधुनिक हिन्दी में प्रसंगगत अर्थ स्पष्ट करता है; अधिक शाब्दिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: τῶν μάγων
  choice: ज्योतिषी विद्वानों
  rationale: μάγοι पूर्वी संसार के ज्योतिष-विद्या से जुड़े विद्वानों का संकेत करता है। यह हिन्दी पाठक के लिए केवल लिप्यंतरण ‘मागी’ से अधिक स्पष्ट है और पारंपरिक पद से इसका संबंध पाद-टिप्पणी में बताया गया है।
- source_word: ἐθυμώθη λίαν
  choice: बहुत क्रोधित हुआ
  rationale: क्रोध उत्पन्न होने और λίαν की तीव्रता, दोनों को सीधे और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἀποστείλας ἀνεῖλεν
  choice: लोगों को भेजकर ... मरवा डाला
  rationale: यूनानी कृदंत एजेंट भेजने को सूचित करता है और मुख्य क्रिया हत्या कराने को। हिन्दी का प्रेरणार्थक रूप यह स्पष्ट करता है कि हेरोदेस ने भेजे गए लोगों के माध्यम से यह हत्या कराई।
- source_word: πάντας τοὺς παῖδας
  choice: सभी लड़कों
  rationale: इस प्रसंग में παῖδας उन नर बच्चों को सूचित करता है जिन्हें बालक राजा की खोज में निशाना बनाया गया था।
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: बैतलहम और उसके आस-पास के सारे क्षेत्र में
  rationale: ὅρια यहाँ नगर से जुड़े आसपास के क्षेत्र को सूचित करता है, न कि केवल सीमा-रेखा को।
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: दो वर्ष और उससे कम आयु के
  rationale: यह दो वर्ष को सम्मिलित करते हुए उससे छोटी आयु तक की ऊपरी सीमा स्पष्ट करता है।
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: उस समय के अनुसार ... जिसका उसने ... ठीक-ठीक पता लगाया था
  rationale: ἠκρίβωσεν की सावधानीपूर्वक या सटीक जानकारी लेने की धारणा को बनाए रखता है और बताता है कि आयु-सीमा उसी काल-सूचना पर आधारित थी।
theological_decisions:
- issue: μάγοι की पहचान
  choice: ज्योतिषी विद्वान
  alternative: बुद्धिमान पुरुष; मागी
  rationale: यह सांस्कृतिक पहचान को स्पष्ट करता है, बाद की परंपराओं से ‘राजा’ जैसी धारणा नहीं जोड़ता, और पारंपरिक विकल्प पाद-टिप्पणी में सुरक्षित रखता है।
- issue: ἐνεπαίχθη का अर्थ
  choice: धोखा दिया
  alternative: उपहास किया; मूर्ख बनाया
  rationale: प्रसंग में उनके वापस न लौटने से हेरोदेस के विफल और मूर्ख बनाए जाने का भाव है। पठनीय मुख्य पाठ में ‘धोखा दिया’ चुना गया है, जबकि शाब्दिक तनाव पाद-टिप्पणी में रखा गया है।
- issue: हेरोदेस द्वारा हत्या और भेजे गए एजेंट
  choice: लोगों को भेजकर ... मरवा डाला
  alternative: भेजकर ... मार डाला
  rationale: यह न तो हेरोदेस के व्यक्तिगत रूप से हत्या करने का दावा करता है, न उसकी उत्तरदायित्व को कम करता है; यूनानी में भेजने और मार डालने की संयुक्त क्रियाओं को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर अपनाया गया है। छोटे वाक्यों से हिंसक घटना को बिना अलंकरण के सीधे व्यक्त किया गया है। ‘मरवा डाला’ हेरोदेस की एजेंसी और भेजे गए लोगों की भूमिका दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
