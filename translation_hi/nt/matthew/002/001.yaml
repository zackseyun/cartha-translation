  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘देखो’ मूल के ध्यानाकर्षक संकेत को बनाए रखता है। स्थान और व्यक्ति के प्रचलित हिन्दी बाइबलीय नाम-रूप प्रयुक्त हुए हैं।
