    text: या “मागी।” यूनानी शब्द पूर्व से आए ऐसे विद्वान लोगों के लिए प्रयुक्त होता था जो ज्योतिष या राजदरबारी ज्ञान से संबद्ध हो सकते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: यीशु का जन्म होने के बाद
  rationale: संबंधकारक निरपेक्ष रचना मुख्य घटना से पहले की पृष्ठभूमि बताती है। यह रूप उसके कालगत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है; δέ के हल्के कथात्मक संक्रमण के लिए कोई अनावश्यक अलग शब्द नहीं जोड़ा गया।
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: यहूदिया के बैतलहम में
  rationale: स्थान-नामों के प्रचलित हिन्दी रूप रखे गए हैं। संबंधकारक पद बैतलहम को यहूदिया में स्थित नगर के रूप में पहचानता है।
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: राजा हेरोदेस के दिनों में
  rationale: यह ऐतिहासिक समय बताने वाला मुहावरा है। यह अनुवाद मूल की संरचना और बाइबलीय कथात्मक गरिमा को बनाए रखते हुए समझने योग्य है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान खींचने वाला कथात्मक संकेत है। ‘देखो’ उसकी चिह्नित और जीवंत भूमिका को आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: μάγοι
  choice: ज्योतिषी
  rationale: यह शब्द पूर्वी जगत के ऐसे विद्वान व्यक्तियों के लिए प्रयुक्त होता था जो ज्योतिष अथवा राजदरबारी ज्ञान से जुड़े हो सकते थे। ‘ज्योतिषी’ बाद की परंपरा के अनुसार उन्हें राजा या संख्या में तीन बताए बिना स्रोत का महत्त्वपूर्ण आशय व्यक्त करता है। तकनीकी विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἀπὸ ἀνατολῶν
  choice: पूर्व से
  rationale: यूनानी बहुवचन पूर्वी दिशाओं या प्रदेशों का संकेत कर सकता है; हिन्दी में ‘पूर्व से’ इसका स्वाभाविक सामूहिक रूप है।
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: यरूशलेम पहुँचे
  rationale: क्रिया किसी स्थान पर आने या पहुँचने को व्यक्त करती है और εἰς गंतव्य बताता है। ‘यरूशलेम पहुँचे’ हिन्दी में गति और आगमन दोनों को स्पष्ट रूप से रखता है।
theological_decisions:
- issue: μάγοι का ऐसा अनुवाद जिसमें बाद की परंपरा न जोड़ी जाए
  choice: ज्योतिषी
  alternative: मागी; ज्ञानी जन
  rationale: मूल शब्द पूर्व से आए ज्योतिष अथवा दरबारी विद्या से जुड़े विद्वानों की ओर संकेत करता है, पर उनकी संख्या या राजकीय पद नहीं बताता। ‘ज्योतिषी’ इस ऐतिहासिक-सांस्कृतिक संकेत को रखता है और उन्हें ‘राजा’ नहीं बनाता; ‘मागी’ को पारदर्शिता के लिए पादटिप्पणी में रखा गया है।
