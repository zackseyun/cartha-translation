  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: hi
  text: यीशु का जन्म यहूदिया के बैतलहम में होने के बाद, राजा हेरोदेस के दिनों में, देखो, पूर्व से ज्योतिषी[a] यरूशलेम पहुँचे।
  philosophy: optimal-equivalence
  footnotes:
