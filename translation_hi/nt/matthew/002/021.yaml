  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। कृदन्त-प्रधान यूनानी रचना को स्वाभाविक हिन्दी की क्रमिक क्रियाओं में व्यक्त किया गया है।
