id: MAT.2.21
reference: Matthew 2:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: hi
  text: तब वह उठा, बालक और उसकी माता को साथ लिया, और इस्राएल देश में प्रवेश किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ विरोध नहीं, बल्कि कथा की अगली घटना की ओर बढ़ने का संकेत देता है; ‘तब’ स्वाभाविक हिन्दी में उस क्रम को बनाए रखता है।
- source_word: ἐγερθεὶς
  choice: उठा
  rationale: इस प्रसंग में अओरिस्ट कर्मवाच्य कृदन्त अकर्मक अर्थ में है—‘उठकर/उठा’; मुख्य क्रियाओं की सहज हिन्दी शृंखला के लिए ‘उठा’ चुना गया है।
- source_word: παρέλαβε
  choice: साथ लिया
  rationale: παραλαμβάνω यहाँ किसी को अपने साथ ले जाने के अर्थ में है; ‘साथ लिया’ साधारण ‘लिया’ की अपेक्षा यह अर्थ अधिक स्पष्टता से व्यक्त करता है।
- source_word: τὸ παιδίον
  choice: बालक
  rationale: παιδίον छोटे बच्चे को सूचित करता है; ‘बालक’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है, बिना आयु को अनावश्यक रूप से निश्चित किए।
- source_word: τὴν μητέρα αὐτοῦ
  choice: उसकी माता
  rationale: αὐτοῦ का स्वाभाविक संबंध बालक से है; ‘उसकी माता’ यूनानी वाक्य-विन्यास और संबंध दोनों को स्पष्ट रखता है।
- source_word: εἰσῆλθεν
  choice: प्रवेश किया
  rationale: εἰσέρχομαι का अर्थ ‘भीतर जाना/प्रवेश करना’ है; ‘प्रवेश किया’ दिशात्मक वाक्यांश के साथ स्वाभाविक और गरिमापूर्ण है।
- source_word: εἰς γῆν Ἰσραήλ
  choice: इस्राएल देश में
  rationale: यह वाक्यांश भौगोलिक-राष्ट्रीय क्षेत्र को सूचित करता है; ‘इस्राएल देश में’ आधुनिक हिन्दी में स्पष्ट और मूल के निकट है।
theological_decisions: []
