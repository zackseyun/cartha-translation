  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: hi
  text: लेकिन जब उसने सुना कि अरखिलाउस अपने पिता हेरोदेस के स्थान पर यहूदिया पर राज्य कर रहा है, तो वह वहाँ जाने से डर गया। फिर स्वप्न में चेतावनी पाकर[a] वह गलील के क्षेत्रों की ओर निकल गया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्देश पाकर”; यह क्रिया प्रायः परमेश्वर की ओर से दी गई चेतावनी या निर्देश का संकेत करती है।
    reason: χρηματισθεὶς में चेतावनी और ईश्वरीय निर्देश—दोनों अर्थ-छायाएँ संभव हैं, जबकि देने वाला यूनानी पाठ में अप्रकट है।
lexical_decisions:
- source_word: ἀκούσας
  choice: जब उसने सुना
  rationale: कालवाचक कृदंत मुख्य क्रिया से पहले की परिस्थिति बताता है; यह हिंदी में स्वाभाविक रूप से उसका समय-संबंध व्यक्त करता है।
- source_word: δὲ
  choice: लेकिन
  rationale: कथा में पिछले इरादे के सामने आई नई बाधा और उससे उत्पन्न मोड़ को स्पष्ट करता है।
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: यहूदिया पर राज्य कर रहा है
  rationale: वर्तमान काल और राजकीय शासन का भाव सुरक्षित रहता है; संबंधकारक भूभाग पर शासन को सूचित करता है।
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: अपने पिता हेरोदेस के स्थान पर
  rationale: ἀντί यहाँ प्रतिस्थापन अथवा उत्तराधिकार का अर्थ देता है, बिना औपचारिक उत्तराधिकार की अतिरिक्त धारणा जोड़े।
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: वह वहाँ जाने से डर गया
  rationale: भय और उसके कारण टाले गए गंतव्य को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: χρηματισθεὶς
  choice: चेतावनी पाकर
  rationale: निष्क्रिय रूप तथा चेतावनी मिलने का अर्थ बना रहता है, जबकि चेतावनी देने वाले को मुख्य पाठ में स्पष्ट नहीं किया गया है।
- source_word: κατ’ ὄναρ
  choice: स्वप्न में
  rationale: मत्ती में स्वप्न के माध्यम से प्राप्त संदेश के लिए प्रयुक्त अभिव्यक्ति का संक्षिप्त और स्वाभाविक हिंदी रूप है।
- source_word: ἀνεχώρησεν
  choice: चला गया
  rationale: संदर्भ में खतरे के कारण दूसरे क्षेत्र की ओर उद्देश्यपूर्ण प्रस्थान का अर्थ देता है; अधिक शाब्दिक ‘पीछे हट गया’ इस गंतव्य-संरचना में हिंदी में असहज होता।
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: गलील के क्षेत्रों में
  rationale: μέρη के बहुवचन को ‘क्षेत्रों’ द्वारा सुरक्षित रखा गया है और εἰς की गंतव्य-दिशा भी व्यक्त होती है।
theological_decisions:
- issue: χρηματισθεὶς में चेतावनी देने वाले के रूप में परमेश्वर को स्पष्ट करना
  choice: मुख्य पाठ में कर्ता को अप्रकट रखते हुए ‘चेतावनी पाकर’
  alternative: ‘परमेश्वर से चेतावनी पाकर’ अथवा ‘ईश्वरीय निर्देश पाकर’
  rationale: मत्ती के प्रयोग में क्रिया प्रायः ईश्वरीय संचार का संकेत देती है, पर इस पद के यूनानी पाठ में कर्ता स्पष्ट नहीं है। अप्रकट कर्ता बनाए रखने से वास्तविक निहितार्थ भी रहता है और पाठ से अधिक नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। नामों के लिए प्रचलित बाइबलीय रूप ‘अरखिलाउस’ और ‘हेरोदेस’ रखे गए हैं। अंतिम अल्पविराम मूल पद के अगले वाक्यांश से निरंतर संबंध को दर्शाता है।
