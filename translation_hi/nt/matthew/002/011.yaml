id: MAT.2.11
reference: Matthew 2:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: hi
  text: और घर में आकर उन्होंने बालक को उसकी माता मरियम के साथ देखा। तब उन्होंने भूमि पर गिरकर उसे दण्डवत किया[a]। फिर अपने खजाने खोलकर उसे भेंटें अर्पित कीं—सोना, लोबान और गन्धरस।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी आराधना की।” यूनानी क्रिया प्रसंग के अनुसार आराधना या गहरी श्रद्धा से किए गए दण्डवत, दोनों को व्यक्त कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίαν
  choice: घर
  rationale: यह सामान्य आवास को दर्शाने वाला सीधा और स्वाभाविक हिन्दी शब्द है; इससे किसी विशेष प्रकार के भवन का अनावश्यक संकेत नहीं मिलता।
- source_word: παιδίον
  choice: बालक
  rationale: यह बच्चे के लिए उपयुक्त, गरिमापूर्ण और स्वाभाविक शब्द है; यूनानी शब्द से अधिक निश्चित आयु नहीं बताता।
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: उसकी माता मरियम के साथ
  rationale: यह μετά के ‘साथ’ अर्थ और मरियम की पहचान—बालक की माता—दोनों को स्पष्ट तथा स्वाभाविक ढंग से रखता है।
- source_word: πεσόντες
  choice: भूमि पर गिरकर
  rationale: यह मुख्य क्रिया से पहले हुई शारीरिक मुद्रा को जीवंत रूप में व्यक्त करता है और केवल ‘झुकने’ से अधिक निकटता से मूल का अनुसरण करता है।
- source_word: προσεκύνησαν
  choice: दण्डवत किया
  rationale: यह गहरी श्रद्धा के साथ स्वयं को झुकाने की क्रिया बताता है और राजकीय सम्मान तथा आराधना—दोनों संभावित अर्थों के बीच मूल की अर्थगत व्यापकता बनाए रखता है।
- source_word: θησαυροὺς
  choice: खजाने
  rationale: यूनानी बहुवचन का सीधा समतुल्य है और इसे विशेष रूप से ‘सन्दूक’ बताकर मूल से अधिक निश्चित नहीं करता।
- source_word: προσήνεγκαν ... δῶρα
  choice: भेंटें अर्पित कीं
  rationale: यह औपचारिक रूप से उपहार प्रस्तुत करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λίβανον
  choice: लोबान
  rationale: यह सुगन्धित राल frankincense का प्रचलित और विशिष्ट हिन्दी नाम है।
- source_word: σμύρναν
  choice: गन्धरस
  rationale: यह myrrh के लिए प्रचलित बाइबलीय हिन्दी नाम है और निर्दिष्ट सुगन्धित राल को दर्शाता है।
theological_decisions:
- issue: बालक यीशु के प्रति προσκυνέω का अर्थ
  choice: दण्डवत किया
  alternative: उसकी आराधना की
  rationale: तात्कालिक कथा में यह क्रिया राजकीय श्रद्धांजलि या धार्मिक आराधना, दोनों का भाव ग्रहण कर सकती है। मुख्य पाठ में ‘दण्डवत किया’ दृश्य क्रिया और गहरी श्रद्धा को व्यक्त करता है, जबकि अधिक स्पष्ट धार्मिक अर्थ को पादटिप्पणी में रखा गया है ताकि theological tension बनी रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘दण्डवत किया’ सामान्य पाठक के लिए बोधगम्य है और मूल क्रिया की जानबूझकर बनी अर्थगत व्यापकता को सुरक्षित रखता है। पादटिप्पणी-चिह्न उसी क्रिया के तुरंत बाद रखा गया है जिससे वह संबंधित है।
