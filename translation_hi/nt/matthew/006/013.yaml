id: MAT.6.13
reference: Matthew 6:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: hi
  text: और हमें परीक्षा में न ला[a], बल्कि उस दुष्ट से हमें बचा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रलोभन’ अथवा ‘कठिन परीक्षा’। यूनानी शब्द पाप की ओर खींचने वाले प्रलोभन या किसी परखने वाली कठिन परिस्थिति—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बुराई से’। यूनानी वाक्यांश का अर्थ व्यक्तिगत रूप से ‘उस दुष्ट से’ या अव्यक्तिगत रूप से ‘बुराई से’ हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: हमें … में न ला
  rationale: यूनानी क्रिया का मूल अर्थ ‘भीतर न लाना/न ले जाना’ है। प्रार्थना-विनती के सीधे रूप को बनाए रखने के लिए इसे ‘न ला’ कहा गया है; ‘हमें पड़ने न दे’ अधिक व्याख्यात्मक होता।
- source_word: πειρασμόν
  choice: परीक्षा
  rationale: πειρασμός प्रलोभन के साथ-साथ जाँच या कठिन परीक्षा को भी व्यक्त कर सकता है। ‘परीक्षा’ मुख्य पाठ में इस व्यापकता को कुछ हद तक बनाए रखती है, और ‘प्रलोभन’ तथा ‘कठिन परीक्षा’ की संभावनाएँ पादटिप्पणी में स्पष्ट की गई हैं।
- source_word: ῥῦσαι
  choice: बचा
  rationale: यह क्रिया सक्रिय रूप से छुड़ाने या बचाने की विनती व्यक्त करती है। ‘बचा’ आधुनिक हिन्दी में स्वाभाविक, सीधा और प्रार्थना के अनुकूल है।
- source_word: τοῦ πονηροῦ
  choice: उस दुष्ट से
  rationale: संज्ञीकृत विशेषण के पुल्लिंग अर्थ में यह किसी व्यक्तिगत दुष्ट, अर्थात ‘उस दुष्ट’ को सूचित कर सकता है। यूनानी रूप का नपुंसकलिंग अर्थ ‘बुराई’ भी संभव है, इसलिए वह पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: τοῦ πονηροῦ का व्यक्तिगत या अव्यक्तिगत अर्थ
  choice: उस दुष्ट से
  alternative: बुराई से
  rationale: यूनानी रूप व्याकरणतः पुल्लिंग (‘उस दुष्ट से’) या नपुंसकलिंग (‘बुराई से’) दोनों समझा जा सकता है। मुख्य पाठ व्यक्तिगत अर्थ अपनाता है, पर वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखता है।
- issue: πειρασμός में प्रलोभन और परीक्षा का संबंध
  choice: परीक्षा
  alternative: प्रलोभन; कठिन परीक्षा
  rationale: यह शब्द पाप की ओर खींचने वाले प्रलोभन और परखने वाली कठिन परिस्थिति—दोनों के लिए प्रयुक्त हो सकता है। अनुवाद किसी एक अर्थ को पूर्णतः बंद नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। ‘न ला’ मूल यूनानी विनती की प्रत्यक्षता और धर्मवैचारिक तनाव को बनाए रखता है; इसे व्याख्यात्मक ढंग से ‘पड़ने न दे’ नहीं किया गया।
