  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: hi
  text: अपने लिए पृथ्वी पर धन-संपत्ति जमा न करो, जहाँ पतंगा और सड़न[a] उन्हें नष्ट करते हैं, और जहाँ चोर सेंध लगाते[b] और चुरा ले जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जंग”; यूनानी शब्द का अर्थ अधिक व्यापक रूप से किसी वस्तु का खाया जाना, गलना या क्षय होना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “खोदकर आर-पार जाते हैं”; सम्भवतः मिट्टी की दीवार में सेंध लगाकर घुसने वाले चोरों का संकेत है।
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς
  choice: अपने लिए ... धन-संपत्ति जमा न करो
  rationale: निषेधात्मक वर्तमान आज्ञा, आत्मार्थक ὑμῖν और धातु-संज्ञा के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। ‘धन-संपत्ति’ मूल्यवान सांसारिक संचय को केवल नकदी तक सीमित नहीं करती।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: अगले पद के स्वर्गीय स्थान से भौगोलिक और वैचारिक विरोध बनाए रखता है।
- source_word: σὴς
  choice: कीड़ा
  rationale: यह वस्त्र आदि को खाने वाले पतंगे के लार्वा से होने वाली हानि की ओर संकेत कर सकता है; साधारण हिन्दी में ‘कीड़ा’ इस विनाशकारी जीव को सहज रूप से बताता है।
- source_word: βρῶσις
  choice: सड़न
  rationale: यूनानी शब्द खाने, गलने अथवा व्यापक क्षय का बोध करा सकता है; ‘सड़न’ इसे केवल धातु की जंग तक सीमित नहीं करती।
- source_word: ἀφανίζει
  choice: नष्ट करते हैं
  rationale: वस्तु को मिटा देने या बरबाद कर देने का परिणाम स्पष्ट करता है; संयुक्त कर्ताओं के कारण हिन्दी में बहुवचन रखा गया है।
- source_word: διορύσσουσιν
  choice: सेंध लगाते
  rationale: शाब्दिक अर्थ ‘खोदकर आर-पार जाना’ है और सम्भवतः मिट्टी की दीवार तोड़कर प्रवेश करने का संकेत है; ‘सेंध लगाना’ हिन्दी में अर्थ और सांस्कृतिक दृश्य दोनों बचाता है।
- source_word: κλέπτουσιν
  choice: चुरा ले जाते हैं
  rationale: चोरी की क्रिया को स्वाभाविक हिन्दी मुहावरे में व्यक्त करता है।
theological_decisions:
- issue: γῆ का स्थानगत अर्थ और स्वर्ग से विरोध
  choice: पृथ्वी पर
  alternative: धरती पर
  rationale: ‘पृथ्वी पर’ तत्काल संदर्भ में स्वर्ग के विपरीत सांसारिक क्षेत्र को स्पष्ट रखता है, बिना पाठ से आगे कोई सिद्धान्त आरोपित किए।
- issue: βρῶσις का व्यापक अर्थ
  choice: सड़न
  alternative: जंग
  rationale: ‘जंग’ सम्भव है, पर यूनानी शब्द केवल धातु के क्षरण तक सीमित नहीं है। मुख्य पाठ में व्यापक अर्थ रखा गया और पारंपरिक विकल्प पादटिप्पणी में सुरक्षित किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘संचय’ की अपेक्षा ‘जमा’ अधिक बोलचाल-सुलभ है, जबकि ‘धन-संपत्ति’ θησαυρούς की व्यापकता बनाए रखती है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
