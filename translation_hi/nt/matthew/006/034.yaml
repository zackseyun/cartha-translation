  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: hi
  text: इसलिए कल की चिंता मत करो, क्योंकि कल अपनी चिंता स्वयं कर लेगा। हर दिन के लिए उसकी अपनी परेशानी काफ़ी है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर दिन के लिए उसकी अपनी बुराई काफ़ी है।” यूनानी शब्द का अर्थ “बुराई” हो सकता है, लेकिन यहाँ सम्भवतः उस दिन की परेशानी या कठिनाई अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: चिंता मत करो
  rationale: यह क्रिया इस पूरे प्रसंग में व्याकुल करने वाली चिंता को व्यक्त करती है। आधुनिक हिन्दी में यह स्वाभाविक है और पद 25–34 के दोहराए गए विषय को बनाए रखती है।
- source_word: εἰς τὴν αὔριον
  choice: कल की
  rationale: μεριμνάω के साथ यह आने वाले दिन की ओर निर्देशित चिंता बताता है; ‘कल की चिंता’ हिन्दी में सहज और स्पष्ट है।
- source_word: ἡ αὔριον
  choice: कल
  rationale: यूनानी में ‘कल’ को कर्ता बनाकर मानवीकरण किया गया है; हिन्दी में भी ‘कल’ को कर्ता रखने से यह अलंकार बना रहता है।
- source_word: μεριμνήσει αὑτῆς
  choice: अपनी चिंता स्वयं कर लेगा
  rationale: यह पिछले ‘चिंता’ वाले क्रियापद की पुनरावृत्ति और कल के मानवीकरण को सुरक्षित रखता है। ‘स्वयं’ αὑτῆς के आत्मवाचक बल को स्पष्ट करता है।
- source_word: ἀρκετὸν
  choice: काफ़ी है
  rationale: यह विधेय विशेषण ‘पर्याप्त’ या ‘काफ़ी’ का अर्थ देता है। ‘काफ़ी है’ साधारण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τῇ ἡμέρᾳ
  choice: हर दिन के लिए
  rationale: सम्प्रदान कारक यहाँ प्रत्येक दिन के संदर्भ में वितरणात्मक भाव देता है; ‘हर दिन के लिए’ उस संबंध को स्पष्ट रूप से व्यक्त करता है।
- source_word: κακία
  choice: परेशानी
  rationale: शब्द का मूल अर्थ ‘बुराई’ भी हो सकता है, पर चिंता के इस प्रसंग में यह दिन के कष्ट, विपत्ति या परेशानी की ओर संकेत करता है।
- source_word: αὐτῆς
  choice: उसकी अपनी
  rationale: सर्वनाम ‘दिन’ की ओर लौटता है और उसके अपने हिस्से की परेशानी पर बल देता है।
theological_decisions:
- issue: चिंता के विषय में ज्ञानोक्तिपरक कथन में κακία का अर्थ
  choice: परेशानी
  alternative: बुराई
  rationale: तात्कालिक प्रसंग भविष्य की चिंता और प्रत्येक दिन के अपने बोझ का है। ‘परेशानी’ व्यावहारिक आशय को स्वाभाविक हिन्दी में व्यक्त करती है, जबकि ‘बुराई’ सम्भव शाब्दिक अर्थ है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘कल’ के मानवीकरण तथा ‘चिंता’ की क्रियात्मक पुनरावृत्ति को बनाए रखा गया है। पादटिप्पणी चिह्न उसी वाक्य के अंत में रखा गया है जहाँ κακία का अनुवाद ‘परेशानी’ किया गया है।
