source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: hi
  text: पर यदि तुम्हारी आँख बुरी[a] हो, तो तुम्हारा पूरा शरीर अँधेरा होगा। इसलिए यदि तुम्हारे भीतर का प्रकाश ही अँधकार है, तो अँधकार कितना अधिक है!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दुष्ट” अथवा “अस्वस्थ”; ‘आँख’ से जुड़े मुहावरे और आसपास के प्रसंग को देखते हुए संभवतः “कृपण” या “उदार न होने वाली।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  choice: बुरी
  rationale: यह व्यापक शब्द नैतिक बुराई, दोषपूर्ण दृष्टि और प्रसंगानुसार कृपणता के संभावित भावों को खुला रखता है; किसी एक अर्थ को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: σκοτεινὸν
  choice: अँधेरा
  rationale: विशेषण के विधेयात्मक अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φῶς
  choice: प्रकाश
  rationale: मूल रूपक को बनाए रखने वाला मानक और गरिमापूर्ण हिन्दी शब्द।
- source_word: σκότος
  choice: अँधकार
  rationale: प्रकाश के साथ मूल विरोध और अंतिम कथन की तीव्रता को बनाए रखता है।
- source_word: πόσον
  choice: कितना घना
  rationale: अपूर्ण विस्मयवाचक यूनानी वाक्य की मात्रा और तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है; 'घना' अँधकार के साथ प्रचलित है, यद्यपि मूल में अलग से 'घना' शब्द नहीं है।
- source_word: ὀφθαλμός
  choice: आँख
  rationale: शारीरिक बिंब को अक्षुण्ण रखता है, जिसके द्वारा दृष्टि, अभिप्राय और नैतिक दिशा के भाव उभरते हैं।
- source_word: ὅλον τὸ σῶμά σου
  choice: तुम्हारा पूरा शरीर
  rationale: ὅλον के समग्र बल को स्पष्ट और सहज हिन्दी में सुरक्षित रखता है।
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: तुम्हारे भीतर का प्रकाश
  rationale: यूनानी पदबंध का निकट और स्वाभाविक अनुवाद है; इसे 'आंतरिक ज्योति' जैसा अधिक व्याख्यात्मक रूप नहीं दिया गया।
theological_decisions:
- issue: ‘बुरी आँख’ के रूपक का अर्थ
  choice: मुख्य पाठ में व्यापक ‘बुरी’ रखा गया।
  alternative: ‘दुष्ट आँख’, ‘अस्वस्थ आँख’ या प्रसंगानुसार ‘कृपण/उदार न होने वाली आँख’।
  rationale: मत्ती 6:19–24 का प्रसंग नैतिक बुराई, विकृत दृष्टि और संभवतः कृपणता के सामी मुहावरे—इन परस्पर जुड़े अर्थों की अनुमति देता है। मुख्य पाठ किसी एक को अंतिम रूप से तय नहीं करता और पादटिप्पणी विकल्पों को सुरक्षित रखती है।
- issue: अंतिम वाक्य की विस्मयवाचक तीव्रता
  choice: ‘तो वह अँधकार कितना घना होगा!’
  alternative: ‘तो अँधकार कितना अधिक होगा!’ या अधिक शाब्दिक ‘तो अँधकार कितना!’
  rationale: यूनानी का अंतिम खंड संक्षिप्त और विस्मयवाचक है। चुना गया रूप चेतावनी की तीव्रता को स्वाभाविक हिन्दी में संप्रेषित करता है, बिना अँधकार के रूपक को सिद्धान्तगत व्याख्या में बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में सहज ‘तुम’ और गरिमापूर्ण, स्पष्ट वाक्य-विन्यास। ‘प्रकाश’ और ‘अँधकार’ रूपक की साहित्यिक तथा धर्मवैचारिक शक्ति बनाए रखते हैं, जबकि ‘आँख’ और ‘शरीर’ सामान्य बोलचाल में समझ आने वाले शब्द हैं।
