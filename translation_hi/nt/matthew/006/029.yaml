id: MAT.6.29
reference: Matthew 6:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: hi
  text: पर मैं तुमसे कहता हूँ कि सुलैमान भी अपने पूरे वैभव में इन फूलों में से एक के समान वस्त्र पहने हुए न था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: पर मैं तुमसे कहता हूँ
  rationale: δέ यहाँ पिछले कथन के साथ हल्का विरोध दिखाता है; इसलिए आधुनिक हिन्दी में ‘पर’ स्वाभाविक है। λέγω और ὑμῖν को सीधे ‘मैं तुमसे कहता हूँ’ के रूप में रखा गया है।
- source_word: οὐδὲ Σολομὼν
  choice: सुलैमान भी ... न था
  rationale: οὐδέ का बल यह है कि सुलैमान जैसा वैभवशाली राजा भी इस तुलना तक नहीं पहुँचता; हिन्दी की ‘भी ... न’ रचना इस बल को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: अपने पूरे वैभव में
  rationale: इस प्रसंग में δόξα राजकीय शोभा और ऐश्वर्य का बोध कराता है। ‘वैभव’ उस अर्थ को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: περιεβάλετο
  choice: वस्त्र पहने हुए न था
  rationale: περιβάλλω का मध्य/निष्क्रिय रूप यहाँ वस्त्र धारण किए होने का अर्थ देता है। यह अनुवाद फूलों के वस्त्र-सदृश सजाए जाने की प्रसंगगत छवि बनाए रखता है।
- source_word: ὡς ἓν τούτων
  choice: इन फूलों में से एक के समान
  rationale: ἓν एकवचन तुलना को सुरक्षित रखता है। ‘फूलों’ को प्रसंग से स्पष्ट किया गया है ताकि हिन्दी में ‘इनमें से’ का संकेत अस्पष्ट न रहे।
theological_decisions:
- issue: सुलैमान के संबंध में δόξα का अर्थ
  choice: राजकीय वैभव
  alternative: महिमा
  rationale: यहाँ तुलना परमेश्वर की दिव्य महिमा की नहीं, सुलैमान की बाहरी राजकीय शोभा की है। ‘वैभव’ बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े प्रसंग का आशय देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सुलैमान’ प्रचलित हिन्दी बाइबलीय नाम-रूप है। वाक्य में मूल यूनानी का विरोध, निषेध का बल और एक फूल से की गई एकवचन तुलना सुरक्षित है।
