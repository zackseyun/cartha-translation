  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: hi
  text: तेरा राज्य आए; तेरी इच्छा पूरी हो[a], जैसे स्वर्ग में, वैसे ही पृथ्वी पर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या संभवतः: “तेरा राज्य आए; तेरी इच्छा पूरी हो, जैसे स्वर्ग में, वैसे ही पृथ्वी पर,” जहाँ “जैसे स्वर्ग में, वैसे ही पृथ्वी पर” दोनों विनतियों पर लागू समझा जाए।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθέτω
  choice: आए
  rationale: ἔρχομαι का तृतीय पुरुष एकवचन आज्ञार्थक रूप यहाँ परमेश्वर से की गई विनती व्यक्त करता है। हिंदी प्रार्थना-भाषा में “तेरा राज्य आए” स्वाभाविक रूप से इस भाव को प्रकट करता है।
- source_word: βασιλεία
  choice: राज्य
  rationale: βασιλεία का अर्थ राजकीय शासन या राज्य दोनों हो सकता है। “राज्य” मत्ती के संदर्भ और प्रचलित हिंदी बाइबलीय भाषा में स्वाभाविक है तथा परमेश्वर के राजकीय शासन का भाव भी समेटता है।
- source_word: γενηθήτω
  choice: पूरी हो
  rationale: γίνομαι का अओरिस्ट निष्क्रिय आज्ञार्थक रूप θέλημα के साथ किसी इच्छा के घटित या पूरा होने का भाव देता है। “इच्छा पूरी हो” आधुनिक हिंदी में सहज और अर्थनिष्ठ है।
- source_word: θέλημα
  choice: इच्छा
  rationale: θέλημα किसी की इच्छा, अभिलाषा या अभिप्राय को दर्शाता है। “इच्छा” अर्थ को बिना अनावश्यक रूप से “योजना” या “उद्देश्य” तक सीमित किए सुरक्षित रखता है।
- source_word: ὡς
  choice: जैसे
  rationale: ὡς तुलना आरंभ करता है। “जैसे” यूनानी की संक्षिप्त और खुली तुलनात्मक रचना को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐν οὐρανῷ
  choice: स्वर्ग में
  rationale: ἐν के साथ एकवचन οὐρανῷ यहाँ परमेश्वर के स्वर्गीय क्षेत्र को सूचित करता है; “स्वर्ग में” इसका प्रसंगानुकूल और सहज हिंदी रूप है।
- source_word: ἐπὶ γῆς
  choice: पृथ्वी पर
  rationale: ἐπί के साथ γῆς का अर्थ “पृथ्वी पर” है और यह स्वर्ग तथा पृथ्वी के विरोध को स्पष्ट रूप से बनाए रखता है।
- source_word: καὶ
  choice: वैसे ही
  rationale: ὡς ... καὶ ... की तुलनात्मक रचना हिंदी में स्वाभाविक रूप से “जैसे ... वैसे ही ...” होती है। इससे साधारण καί से अधिक अर्थ नहीं जोड़ा जाता, बल्कि यूनानी तुलना स्पष्ट हिंदी में व्यक्त होती है।
theological_decisions:
- issue: तुलनात्मक वाक्यांश ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς का विस्तार
  choice: मुख्य पाठ में इसे निकटतम विनती, “तेरी इच्छा पूरी हो,” के साथ जोड़ा गया है।
  alternative: इसे “तेरा राज्य आए” और “तेरी इच्छा पूरी हो”—दोनों विनतियों पर लागू समझना।
  rationale: यूनानी पांडुलिपियों का मूल विराम-चिह्न इस प्रश्न को निर्णायक रूप से हल नहीं करता। व्याकरण की दृष्टि से निकटतम उपवाक्य से संबंध सबसे सहज है, पर दोनों विनतियों पर लागू होने की संभावना वास्तविक है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। निकट संबोधन के अनुरूप “तेरा/तेरी” रखा गया है। “पूरा किया जाए” की अपेक्षा “पूरी हो” अधिक सहज है और यूनानी विनती की संक्षिप्तता बनाए रखता है।
