source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: hi
  text: 'आकाश के पक्षियों को ध्यान से देखो[a]: वे न बोते हैं, न काटते हैं और न कोठारों में इकट्ठा करते हैं, फिर भी तुम्हारा स्वर्गीय पिता उन्हें खिलाता है। क्या तुम उनसे कहीं अधिक मूल्यवान नहीं हो[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वर्ग के पक्षियों’; परंपरागत रूप से ‘हवा के पक्षियों’।
    reason: lexical_alternative
  - marker: b
    text: या ‘क्या तुम उनसे अधिक मूल्यवान नहीं हो?’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: ध्यान से देखो
  rationale: यह क्रिया निर्देशित और सचेत दृष्टि की आज्ञा देती है। ‘ध्यान से देखो’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया के बल को बिना अतिव्याख्या के व्यक्त करता है।
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: आकाश के पक्षियों
  rationale: πετεινά उड़नेवाले जीवों अथवा पक्षियों को और οὐρανός यहाँ दिखाई देनेवाले आकाश को सूचित करता है। ‘आकाश के पक्षी’ प्रसंग में सीधा और स्वाभाविक अनुवाद है।
- source_word: ὅτι
  choice: ':'
  rationale: यहाँ ὅτι पक्षियों को देखने की आज्ञा के बाद उस बात का परिचय देता है जिस पर ध्यान देना है। हिन्दी में द्विबिंदु इस संबंध को सहजता से व्यक्त करता है और ‘क्योंकि’ या ‘कि’ के बीच की सम्भव व्याख्यात्मक अस्पष्टता को अनावश्यक रूप से नहीं बाँधता।
- source_word: οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν
  choice: वे न बोते हैं, न काटते हैं और न ... इकट्ठा करते हैं
  rationale: ‘बोना’, ‘काटना’ और ‘इकट्ठा करना’ मूल कृषि-चित्र तथा तीन समानांतर क्रियाओं को बनाए रखते हैं।
- source_word: εἰς ἀποθήκας
  choice: खत्तों में
  rationale: ἀποθήκαι उपज रखने के भंडार-स्थल हैं। ‘खत्ते’ अनाज के कृषि-भंडार का संक्षिप्त और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: तुम्हारा स्वर्गीय पिता
  rationale: यह संबंधसूचक ‘पिता’ और οὐράνιος दोनों को संक्षिप्त, प्रचलित और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: τρέφει
  choice: खिलाता है
  rationale: प्रसंग में τρέφω भोजन उपलब्ध कराने को सूचित करता है; ‘खिलाता है’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: क्या तुम उनसे कहीं अधिक मूल्यवान नहीं हो?
  rationale: प्रश्न सकारात्मक उत्तर की अपेक्षा रखता है। ‘कहीं अधिक मूल्यवान’ μᾶλλον की प्रबल तुलना और διαφέρω के यहाँ मूल्य में श्रेष्ठ होने के भाव को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यीशु के तर्क में मनुष्यों और पक्षियों का तुलनात्मक मूल्य
  choice: पद परमेश्वर की देखभाल के संदर्भ में श्रोताओं को पक्षियों से अधिक मूल्यवान बताता है, पर इसका धर्मवैज्ञानिक आधार निर्दिष्ट नहीं करता।
  alternative: इस अधिक मूल्य को विशेष रूप से परमेश्वर के स्वरूप में मनुष्य की सृष्टि या केवल वाचा-संबंध के आधार पर समझना।
  rationale: मूल पाठ तुलना को स्पष्ट रूप से कहता है, किन्तु उसके कारण की कोई विशिष्ट धर्मवैज्ञानिक व्याख्या नहीं देता; अतः अनुवाद तुलना को बनाए रखता है और कोई अतिरिक्त आधार नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, संबोधन के लिए मूल बहुवचन के अनुरूप ‘तुम’, और सरल किन्तु गरिमापूर्ण शैली अपनाई गई है। कृषि-चित्र और अलंकारिक प्रश्न सुरक्षित रखे गए हैं।
