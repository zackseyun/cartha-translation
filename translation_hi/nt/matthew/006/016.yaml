review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the iterative temporal clause, the warning against the hypocrites’ deliberately gloomy presentation, their purpose of being seen by people as fasting, and the idiom that their reward has already been received in full. A small revision better represents μὴ γίνεσθε (‘do not become/be’) without adding the narrower idiom of ‘making a face.’
  naturalness: ‘उदास चेहरा मत बनाओ’ is understandable but less natural and somewhat more specific than the Greek. ‘उदास मत बनो’ is idiomatic modern Hindi and fits the following reference to their faces. ‘अपने चेहरे का रूप बिगाड़ते हैं’ is smoother than ‘अपने चेहरे बिगाड़ते हैं.’
  terminology: ‘उपवास,’ ‘कपटी,’ ‘लोग,’ and ‘प्रतिफल’ are suitable modern-standard Hindi terms. ‘अपना पूरा प्रतिफल पा चुके हैं’ expresses the commercial idiom ἀπέχουσιν and its completed force clearly.
  issues:
  - severity: low
    issue: ‘उदास चेहरा मत बनाओ’ narrows μὴ γίνεσθε σκυθρωποί.
    rationale: The Greek prohibits adopting a gloomy demeanor, not specifically the act of making a sad facial expression. ‘उदास मत बनो’ preserves the broader wording while remaining natural.
  - severity: low
    issue: ‘वे अपने चेहरे बिगाड़ते हैं’ is slightly awkward Hindi.
    rationale: ‘वे अपने चेहरे का रूप बिगाड़ते हैं’ retains the concrete facial imagery of τὰ πρόσωπα while expressing ἀφανίζουσιν more idiomatically.
  revised_text: 'और जब भी तुम उपवास करो, तो कपटियों की तरह उदास मत बनो, क्योंकि वे अपने चेहरे का रूप बिगाड़ते हैं, ताकि वे लोगों को उपवास करते हुए दिखाई दें। मैं तुमसे सच कहता हूँ: वे अपना पूरा प्रतिफल पा चुके हैं।'
