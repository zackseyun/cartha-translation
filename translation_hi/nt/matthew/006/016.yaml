id: MAT.6.16
reference: Matthew 6:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: hi
  text: 'और जब भी तुम उपवास करो, तो कपटियों की तरह उदास मत बनो, क्योंकि वे अपने चेहरे का रूप बिगाड़ते हैं, ताकि वे लोगों को उपवास करते हुए दिखाई दें। मैं तुमसे सच कहता हूँ: वे अपना पूरा प्रतिफल पा चुके हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: और जब भी तुम उपवास करो
  rationale: ὅταν सामान्यतः बार-बार आने वाली परिस्थिति को व्यक्त करता है; ‘जब भी’ इस पुनरावृत्त भाव को स्वाभाविक हिन्दी में रखता है। δέ को समानांतर शिक्षाओं से जोड़ने वाले ‘और’ के रूप में लिया गया है।
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: उदास चेहरा मत बनाओ
  rationale: γίνεσθε में किसी दशा या ढंग को अपनाने का भाव है और σκυθρωποί चेहरे की उदास मुद्रा बताता है; संयुक्त हिन्दी अभिव्यक्ति अर्थ और प्रसंग दोनों को स्पष्ट रखती है।
- source_word: ὡς οἱ ὑποκριταί
  choice: कपटियों की तरह
  rationale: ὑποκριταί यहाँ दिखावटी धर्मपरायणता करने वालों के लिए है; ‘कपटी’ प्रचलित, गरिमापूर्ण और प्रसंगानुकूल शब्द है।
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: वे अपने चेहरे बिगाड़ते हैं
  rationale: क्रिया का प्रसंगगत अर्थ अपने चेहरे या रूप को जानबूझकर ऐसा बनाना अथवा उपेक्षित रखना है कि उपवास स्पष्ट लगे। ‘चेहरे बिगाड़ते हैं’ मूल बिंब और संभावित व्यापकता को बनाए रखता है।
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: ताकि लोगों को उपवास करते हुए दिखाई दें
  rationale: ὅπως उद्देश्य, φανῶσιν दिखाई देने या प्रतीत होने, और ἄνθρωποι यहाँ सामान्यतः मनुष्यों/लोगों को दर्शाता है। यह हिन्दी अनावश्यक लैंगिक संकीर्णता के बिना मूल अर्थ देती है।
- source_word: ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यह यीशु का गंभीर और अधिकारपूर्ण कथन-सूत्र है; यह रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके बल को सुरक्षित रखता है।
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: वे अपना प्रतिफल पूरा पा चुके हैं
  rationale: ἀπέχω का यहाँ व्यापारिक मुहावरे वाला अर्थ पूर्ण भुगतान प्राप्त कर लेना है। ‘पूरा पा चुके हैं’ बताता है कि उनका प्रतिफल मिल चुका है और आगे कोई दावा शेष नहीं।
theological_decisions:
- issue: τοῖς ἀνθρώποις का प्रतिनिधिक या सामान्य अर्थ
  choice: लोगों को
  alternative: मनुष्यों को / आदमियों को
  rationale: बहुवचन ἄνθρωποι इस प्रसंग में मानव दर्शकों को सामान्य रूप से सूचित करता है। ‘लोगों’ आधुनिक हिन्दी में इसी व्यापक अर्थ को सबसे स्वाभाविक रूप से व्यक्त करता है।
- issue: ἀπέχουσιν τὸν μισθὸν αὐτῶν में पूर्ण प्राप्ति का भाव
  choice: अपना प्रतिफल पूरा पा चुके हैं
  alternative: उनका प्रतिफल उन्हें मिल गया है / वे अपना प्रतिफल पाते हैं
  rationale: मूल मुहावरा केवल प्रतिफल रखने की बात नहीं करता, बल्कि उसके पूर्ण रूप से मिल चुकने का संकेत देता है; अनुवाद उस चेतावनी को स्पष्ट करता है, बिना प्रतिफल के स्वरूप पर अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में निकट बहुवचन ‘तुम’ रखा गया है, जो पहाड़ी उपदेश के प्रत्यक्ष शिष्य-संबोधन के लिए स्वाभाविक है। भाषा सरल, गरिमापूर्ण और मौखिक पाठ के योग्य रखी गई है।
