  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: hi
  text: क्योंकि जहाँ तुम्हारा धन है, वहीं तुम्हारा हृदय भी होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: जहाँ
  rationale: यह स्थान-सूचक संबंधवाचक उपवाक्य आरम्भ करता है; ‘जहाँ’ स्वाभाविक है और ἐκεῖ (‘वहीं’) के साथ यूनानी समानांतरता बनाए रखता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण या स्पष्टीकरण प्रस्तुत करता है। आधुनिक हिन्दी में ‘क्योंकि’ इस तार्किक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: θησαυρός
  choice: धन
  rationale: संदर्भ में यह संचित मूल्यवान संपत्ति को दर्शाता है। ‘धन’ सामान्य हिन्दी में स्वाभाविक है और सांसारिक तथा स्वर्गीय धन—दोनों के संदर्भ में उपयुक्त रहता है; ‘खज़ाना’ यहाँ अपेक्षाकृत भौतिक भंडार जैसा सुन सकता है।
- source_word: σου
  choice: तुम्हारा
  rationale: एकवचन संबंधकारक सर्वनाम का स्वाभाविक हिन्दी रूप; यह ‘धन’ और ‘हृदय’ दोनों के साथ व्यक्तिगत संबंध बनाए रखता है।
- source_word: ἐκεῖ
  choice: वहीं
  rationale: ‘जहाँ ... वहीं’ हिन्दी में यूनानी ὅπου ... ἐκεῖ की संक्षिप्त स्थान-सूचक समानांतर रचना को ठीक प्रकार व्यक्त करता है।
- source_word: ἔσται
  choice: होगा
  rationale: यह εἰμί का भविष्यकालीन रूप है। ‘होगा’ मूल पाठ की कालगत शक्ति को बनाए रखता है, उसे सामान्य वर्तमान कथन में नहीं बदलता।
- source_word: καρδία
  choice: हृदय
  rationale: ‘हृदय’ इच्छा, निष्ठा, लगाव और भीतरी अभिमुखता की व्यापक अर्थ-सीमा को सुरक्षित रखता है; अधिक व्याख्यात्मक विकल्प अर्थ को संकीर्ण कर देते।
- source_word: καὶ
  choice: भी
  rationale: यह धन के स्थान के साथ हृदय के स्थान को जोड़ने वाला योगात्मक बल व्यक्त करता है और हिन्दी में ‘वहीं ... भी’ स्वाभाविक है।
theological_decisions:
- issue: सूक्तिपरक कथन में ἔσται का कालगत बल
  choice: स्पष्ट भविष्यकाल ‘होगा’ रखा गया है।
  alternative: सार्वकालिक सिद्धांत व्यक्त करने के लिए वर्तमानकाल ‘है’।
  rationale: यूनानी क्रिया स्पष्टतः भविष्यकाल में है। इसे बनाए रखने से कथन केवल धन और हृदय की स्थिर समानता नहीं बताता, बल्कि यह संभावना भी खुली रखता है कि हृदय उस ओर होगा जहाँ व्यक्ति अपना धन रखता है। अनुवाद इस निहितार्थ को सिद्धांत के रूप में और अधिक नहीं खोलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और सहज वाक्य। ‘जहाँ ... वहीं’ मूल की समांतर संरचना को बनाए रखता है। किसी पादटिप्पणी की आवश्यकता नहीं, क्योंकि भविष्यकाल हिन्दी में स्पष्ट और स्वाभाविक है।
