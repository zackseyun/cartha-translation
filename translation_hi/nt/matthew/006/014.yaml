  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: hi
  text: क्योंकि यदि तुम लोगों के अपराधों को क्षमा करोगे[a], तो तुम्हारा स्वर्गीय पिता भी तुम्हें क्षमा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चूकें,’ ‘उल्लंघन’ अथवा ‘गलत काम।’ यूनानी शब्द नैतिक चूक, अपराध या गलत कदम को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: क्योंकि यदि
  rationale: γάρ पिछले कथन का कारण स्पष्ट करता है, इसलिए ‘क्योंकि’ रखा गया है; ἐάν के साथ संभाव्य क्रिया वास्तविक शर्त व्यक्त करती है, जिसे स्वाभाविक हिन्दी में ‘यदि’ कहा गया है।
- source_word: ἀφῆτε … ἀφήσει
  choice: क्षमा करोगे … क्षमा करेगा
  rationale: ἀφίημι यहाँ नैतिक अपराधों को क्षमा करने के अर्थ में है। दोनों रूपों के लिए एक ही हिन्दी क्रिया रखने से मूल की शब्दगत कड़ी बनी रहती है।
- source_word: τοῖς ἀνθρώποις
  choice: लोगों के
  rationale: ἄνθρωποι सामान्य रूप से मनुष्यों को दर्शाता है, केवल पुरुषों को नहीं। हिन्दी में संबंधवाचक रचना ‘लोगों के अपराध क्षमा करना’ अधिक स्वाभाविक है।
- source_word: τὰ παραπτώματα αὐτῶν
  choice: उनके अपराध
  rationale: παράπτωμα नैतिक चूक, उल्लंघन या अपराध को दर्शाता है। ‘अपराध’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है; ‘उनके’ का भाव हिन्दी की ‘लोगों के अपराध’ रचना में समाहित है।
- source_word: καὶ ὑμῖν
  choice: भी तुम्हें
  rationale: καί पारस्परिक अनुरूपता व्यक्त करता है, इसलिए ‘भी’; ὑμῖν को ‘तुम्हें’ से सीधे व्यक्त किया गया है।
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: तुम्हारा स्वर्गीय पिता
  rationale: यह यूनानी विशेषणात्मक रचना का स्वाभाविक हिन्दी रूप है और परमेश्वर के लिए प्रयुक्त पितृ-संबोधन को बनाए रखता है।
theological_decisions:
- issue: मानवीय क्षमा और परमेश्वर की क्षमा के बीच शर्त-संबंध
  choice: वचन को वास्तविक शर्त के रूप में सीधे प्रस्तुत किया गया है।
  alternative: इसे या तो इस अर्थ में समझाना कि मनुष्य क्षमा करके परमेश्वर की क्षमा अर्जित करता है, या केवल पूर्व में मिली क्षमा का प्रमाण देता है।
  rationale: यूनानी पाठ स्पष्ट शर्त रखता है, लेकिन उस संबंध की विस्तृत धर्मवैज्ञानिक व्याख्या नहीं करता। अनुवाद उस तनाव को किसी सांप्रदायिक निष्कर्ष द्वारा हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘तुम’ बहुवचन श्रोताओं को संबोधित करता है।
