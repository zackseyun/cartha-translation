  to: क्योंकि यदि तुम लोगों के अपराधों को क्षमा करोगे[a], तो तुम्हारा स्वर्गीय पिता भी तुम्हें क्षमा करेगा।
  rationale: The revision only removes a Hindi grammatical ambiguity that could reverse whose offenses are in view. It preserves the Greek conditional relationship, the reciprocal ‘भी,’ and the repeated vocabulary of forgiveness, without adding theological interpretation.
