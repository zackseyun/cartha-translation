id: MAT.6.20
reference: Matthew 6:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: hi
  text: पर अपने लिए स्वर्ग में खजाने जमा करो, जहाँ न तो कपड़ों का कीड़ा और न ही क्षय[a] उन्हें नष्ट करते हैं, और जहाँ चोर न तो सेंध लगाते हैं और न चोरी करते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जंग’। यूनानी शब्द अधिक व्यापक रूप से ऐसी चीज़ या प्रक्रिया को भी दर्शा सकता है जो खाकर, गलाकर या धीरे-धीरे नष्ट करती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘खोदकर आर-पार जाना’ है; सम्भवतः इसका संकेत घर की दीवार में सेंध लगाकर भीतर घुसने वाले चोरों की ओर है।
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: जमा करो
  rationale: वर्तमान काल की आज्ञा निरंतर आचरण का भाव देती है। ‘जमा करो’ आधुनिक हिन्दी में स्वाभाविक है और खजाना संचित करने के रूपक को बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: 'यह पिछले पद के निषेध के साथ स्पष्ट विरोध दिखाता है: पृथ्वी पर जमा न करो, पर स्वर्ग में जमा करो।'
- source_word: ὑμῖν
  choice: अपने लिए
  rationale: यह लाभार्थक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और मूल के आत्म-संबंधी बल को बनाए रखता है।
- source_word: θησαυροὺς
  choice: खजाने
  rationale: मूल यूनानी का बहुवचन सुरक्षित रखा गया है और प्रसंग के धन-संचय रूपक के लिए यह सामान्य, स्पष्ट शब्द है।
- source_word: ἐν οὐρανῷ
  choice: स्वर्ग में
  rationale: स्थानवाचक अर्थ का स्वाभाविक और प्रचलित हिन्दी रूप।
- source_word: σὴς
  choice: कपड़ों का कीड़ा
  rationale: यह ऐसा कीड़ा है जो रखे हुए वस्त्रों को खाता है। केवल ‘कीड़ा’ की अपेक्षा यह सांस्कृतिक चित्र अधिक स्पष्ट करता है, जबकि अर्थ को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: βρῶσις
  choice: क्षय
  rationale: शब्द का अर्थ खाने, गलाने या धीरे-धीरे नष्ट करने वाली प्रक्रिया तक व्यापक हो सकता है। ‘क्षय’ केवल धातु की जंग तक अर्थ को सीमित नहीं करता।
- source_word: ἀφανίζει
  choice: नष्ट करते हैं
  rationale: यह वस्तुओं के मिट जाने या बरबाद हो जाने का स्पष्ट परिणाम बताता है। हिन्दी व्याकरण में संयुक्त कर्ताओं के कारण बहुवचन क्रिया स्वाभाविक है।
- source_word: κλέπται
  choice: चोर
  rationale: बहुवचन संज्ञा का सीधा और सामान्य हिन्दी समतुल्य।
- source_word: διορύσσουσιν
  choice: सेंध लगाकर
  rationale: मूल क्रिया का शाब्दिक चित्र दीवार खोदकर या तोड़कर भीतर घुसने का है। ‘सेंध लगाना’ हिन्दी में उसी प्रकार की चोरी का सटीक और स्वाभाविक मुहावरा है।
- source_word: κλέπτουσιν
  choice: चोरी नहीं करते
  rationale: ‘सेंध लगाकर चोरी नहीं करते’ हिन्दी में दोनों यूनानी क्रियाओं को स्पष्ट और सहज ढंग से जोड़ता है।
theological_decisions:
- issue: ‘स्वर्ग में खजाने’ का स्वरूप
  choice: रूपक को ‘स्वर्ग में खजाने’ के रूप में ज्यों का त्यों रखा गया।
  alternative: स्वर्गीय प्रतिफल; आत्मिक धन
  rationale: मूल पाठ यह नहीं बताता कि इन खजानों की ठीक प्रकृति क्या है। व्याख्यात्मक विस्तार किसी विशेष प्रतिफल-सिद्धांत को पाठ में जोड़ देता।
- issue: βρῶσις का अर्थ-क्षेत्र
  choice: क्षय
  alternative: जंग; गलन
  rationale: ‘क्षय’ नाश करने वाली व्यापक प्रक्रिया को व्यक्त करता है और अर्थ को केवल धातु पर लगने वाली जंग तक सीमित नहीं करता। वैकल्पिक पारंपरिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘खजाने जमा करो’ मूल रूपक को सुरक्षित रखता है। ‘कपड़ों का कीड़ा’ प्राचीन संसार में संचित वस्त्रों के नष्ट होने का चित्र स्पष्ट करता है, और ‘सेंध लगाकर’ यूनानी क्रिया की सांस्कृतिक छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
