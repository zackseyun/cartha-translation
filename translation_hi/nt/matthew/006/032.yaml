source:
  edition: SBLGNT
  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: hi
  text: क्योंकि अन्यजातियाँ[a] इन सब चीज़ों की तलाश में लगी रहती हैं[b]; क्योंकि तुम्हारा स्वर्गीय पिता जानता है कि तुम्हें इन सब चीज़ों की आवश्यकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राष्ट्र’ अथवा ‘गैर-यहूदी।’ यूनानी शब्द सामान्य रूप से राष्ट्रों को सूचित कर सकता है, पर यहाँ संभवतः वाचा-समुदाय से बाहर के लोग अभिप्रेत हैं।
    reason: alternative_reading
  - marker: b
    text: या ‘इन सब चीज़ों को खोजती हैं’ अथवा ‘इनके पीछे लगी रहती हैं।’ यूनानी क्रिया लगन या लगातार खोजने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: अन्यजाति के लोग
  rationale: यहाँ यह पद यीशु के चेलों से भिन्न, इस्राएल की वाचा-समुदाय से बाहर के लोगों को सूचित करता है। ‘अन्यजाति के लोग’ इस ऐतिहासिक-सामाजिक भेद को बनाए रखता है और ‘मूर्तिपूजक’ जैसी अतिरिक्त नकारात्मक व्याख्या नहीं जोड़ता।
- source_word: ἐπιζητοῦσιν
  choice: तलाश में लगे रहते हैं
  rationale: यह अभिव्यक्ति क्रिया के गंभीर या लगातार खोजते रहने के भाव को सहज आधुनिक हिन्दी में व्यक्त करती है; केवल ‘ढूँढ़ते हैं’ की अपेक्षा इसकी निरंतरता अधिक स्पष्ट है।
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: तुम्हारा स्वर्गीय पिता
  rationale: यह स्वाभाविक हिन्दी में संबंधसूचक ‘तुम्हारा’ और पिता के स्वर्गीय स्वरूप—दोनों को सुरक्षित रखता है।
- source_word: οἶδεν
  choice: जानता है
  rationale: οἶδα रूप की दृष्टि से पूर्णकालिक होते हुए भी यहाँ वर्तमान अर्थ रखता है; इसलिए ‘जानता है’ सटीक और स्वाभाविक है।
- source_word: χρῄζετε
  choice: तुम्हें ... आवश्यकता है
  rationale: यह आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी में आवश्यकता का अर्थ ठीक प्रकार व्यक्त करता है।
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: इन सब चीज़ों ... इन सब चीज़ों
  rationale: यूनानी पाठ की पुनरुक्ति बल प्रदान करती है, इसलिए उसे हिन्दी में भी बनाए रखा गया है। संदर्भ में भोजन, पेय और वस्त्र होने के कारण ‘चीज़ों’ स्वाभाविक है।
- source_word: γὰρ ... γὰρ
  choice: क्योंकि ... क्योंकि
  rationale: दोनों γάρ का व्याख्यात्मक/कारणसूचक प्रवाह सुरक्षित रखने के लिए दोनों बार ‘क्योंकि’ रखा गया है, यद्यपि हिन्दी में इसे कुछ हद तक दोहराव माना जा सकता है।
theological_decisions:
- issue: यीशु की शिक्षा में τὰ ἔθνη का संदर्भ
  choice: अन्यजाति के लोग
  alternative: राष्ट्र; गैर-यहूदी लोग; मूर्तिपूजक
  rationale: संदर्भ यीशु के चेलों और वाचा-समुदाय के बाहर के लोगों के दृष्टिकोण में भेद करता है। यह चयन उस भेद को बनाए रखता है, पर सभी गैर-यहूदियों पर कोई निरपेक्ष नैतिक निर्णय आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘अन्यजाति’ बाइबलीय संदर्भ का परिचित शब्द है, और उसे ‘के लोग’ के साथ अधिक स्पष्ट बनाया गया है। मूल की पुनरुक्ति और दोनों कारणसूचक संयोजकों को जानबूझकर सुरक्षित रखा गया है।
