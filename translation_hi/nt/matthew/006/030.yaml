id: MAT.6.30
reference: Matthew 6:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: hi
  text: पर यदि परमेश्वर खेत की घास[a] को, जो आज है और कल रोटी पकाने के तंदूर में झोंक दी जाती है,[b] इस प्रकार पहनाता है, तो हे कम विश्वास रखनेवालो, क्या वह तुम्हें उससे कहीं अधिक न पहनाएगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘घास’ से खेत में उगने वाली छोटी वनस्पति भी अभिप्रेत हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: यह रोटी पकाने का तंदूर था; सूखी घास और खेत के पौधे ईंधन के रूप में इस्तेमाल किए जा सकते थे।
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον τοῦ ἀγροῦ
  choice: मैदान की घास
  rationale: χόρτος घास के साथ मैदान में उगने वाली छोटी वनस्पति को भी सूचित कर सकता है। ‘मैदान की घास’ मूल बिंब को बनाए रखता है और इसे केवल फूलों तक सीमित नहीं करता।
- source_word: σήμερον ὄντα
  choice: जो आज है
  rationale: ὄντα का शाब्दिक अर्थ ‘होना’ है। ‘जो आज है’ क्षणभंगुर अस्तित्व को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: कल रोटी पकाने के तंदूर में झोंक दी जाती है
  rationale: κλίβανος रोटी पकाने का ओवन था, धातु गलाने की भट्ठी नहीं। ‘झोंक दी जाती है’ βαλλόμενον के निष्क्रिय भाव और ईंधन के रूप में सूखी वनस्पति डालने के दृश्य को स्पष्ट करता है।
- source_word: οὕτως ἀμφιέννυσιν
  choice: इस प्रकार पहनाता है
  rationale: ἀμφιέννυμι का मूल अर्थ पहनाना या वस्त्र देना है। यह अनुवाद वस्त्रों के विषय में चल रहे रूपक और परमेश्वर द्वारा दी गई शोभा, दोनों को बनाए रखता है।
- source_word: οὐ πολλῷ μᾶλλον
  choice: क्या वह तुम्हें उससे कहीं अधिक न पहनाएगा?
  rationale: यह अल्प से अधिक की ओर जाने वाला बलपूर्ण आलंकारिक प्रश्न है। ‘कहीं अधिक’ πολλῷ μᾶλλον की तुलनात्मक तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὀλιγόπιστοι
  choice: हे कम विश्वास रखनेवालो
  rationale: यह संबोधन-कारक बहुवचन में सीधी फटकार है। यह रूप अपर्याप्त भरोसे का भाव व्यक्त करता है, पर यह दावा नहीं करता कि विश्वास सर्वथा अनुपस्थित है।
- source_word: εἰ δὲ
  choice: पर यदि
  rationale: δέ पिछले उदाहरण से हल्का तर्कात्मक मोड़ दिखाता है; ‘पर यदि’ इस संबंध को स्पष्ट और स्वाभाविक रखता है।
theological_decisions:
- issue: परमेश्वर की देखभाल के विषय में अल्प से अधिक की ओर तर्क
  choice: वाक्य को आलंकारिक प्रश्न के रूप में रखा गया है, जिसमें क्षणभंगुर घास की तुलना में शिष्यों के लिए परमेश्वर की कहीं अधिक देखभाल व्यक्त होती है।
  alternative: इसे सीधे कथन के रूप में प्रस्तुत करना।
  rationale: यूनानी वाक्य-विन्यास, οὐ से अपेक्षित सकारात्मक उत्तर, और अंतिम संबोधन प्रश्न की फटकारपूर्ण शक्ति का समर्थन करते हैं। इससे चिंता के विरुद्ध यीशु का तर्क बना रहता है, बिना कोई अतिरिक्त धर्मसैद्धांतिक दावा जोड़े।
- issue: ὀλιγόπιστοι में विश्वास की मात्रा या गुण
  choice: ‘कम विश्वास रखनेवालो’ द्वारा अपर्याप्त भरोसे की फटकार को बनाए रखा गया है।
  alternative: ‘अविश्वासियो’ कहना, जिससे विश्वास का पूर्ण अभाव सूचित हो सकता है।
  rationale: ὀλιγόπιστοι का आशय ‘थोड़े/कम विश्वास वाले’ है; इसे पूर्ण अविश्वास कहना मूल से अधिक कठोर और धर्मवैचारिक रूप से अधिक निश्चित होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। ‘हे’ सीधे संबोधन और हल्की फटकार को स्पष्ट करता है; ‘कम विश्वास रखनेवालो’ अपेक्षाकृत साहित्यिक ‘अल्पविश्वासियो’ की तुलना में सामान्य पाठकों के लिए अधिक पारदर्शी है। ‘तंदूर’ के साथ ‘रोटी पकाने का’ जोड़कर आधुनिक अर्थ-भ्रम घटाया गया है।
