- source_word: ἐλεημοσύνην
  choice: ज़रूरतमंदों को दान
  rationale: यह शब्द गरीबों या अभावग्रस्त लोगों की सहायता के लिए दिए जाने वाले दान को सूचित करता है। यह रूप आधुनिक हिन्दी में स्पष्ट है, जबकि ‘भिक्षादान’ अपेक्षाकृत संकीर्ण या पुरातन अर्थ दे सकता है।
- source_word: μὴ γνώτω
  choice: न जाने
  rationale: μή के साथ तृतीय पुरुष एकवचन आज्ञार्थक का संक्षिप्त और स्वाभाविक निषेध है; इससे हाथों का मानवीकरण बना रहता है।
- source_word: ἡ ἀριστερά σου
  choice: तुम्हारा बायाँ हाथ
  rationale: सीधा अनुवाद मूल रूपक और उसकी स्मरणीय छवि को सुरक्षित रखता है।
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: तुम्हारा दायाँ हाथ क्या कर रहा है
  rationale: वर्तमानकालीन ποιεῖ की जारी क्रिया को ‘कर रहा है’ स्वाभाविक रूप से व्यक्त करता है और मूल समानांतरता बनाए रखता है।
