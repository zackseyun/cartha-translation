  choice: रूपक और अतिशयोक्ति को ज्यों का त्यों रखते हुए दान में अत्यंत गोपनीयता तथा आत्म-प्रदर्शन से दूरी पर बल
  alternative: इसे सामान्य विनम्रता का व्याख्यात्मक कथन बनाना, या हर प्रकार के सार्वजनिक दान का पूर्ण निषेध मानना
  rationale: मूल पाठ हाथों का सजीव मानवीकरण करता है। रूपक को अनूदित करने के बजाय समझाकर सपाट कर देना या उससे व्यापक doctrinal निषेध निकालना पाठ की वास्तविक तनावपूर्ण शक्ति को घटाएगा।
