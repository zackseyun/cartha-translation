  terminology: ‘चिंता’ suitably renders μεριμνάω here without importing an interpretation. ‘सोसन’ is an established Hindi biblical designation for lilies; the footnote appropriately preserves the possible broader reference to wildflowers. ‘मेहनत’ and ‘सूत कातना’ are clear modern-standard Hindi renderings of κοπιάω and νήθω.
