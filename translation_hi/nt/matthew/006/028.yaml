reference: Matthew 6:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: hi
  text: 'और कपड़ों की चिंता क्यों करते हो? मैदान के सोसनों को ध्यान से देखो कि वे कैसे बढ़ते हैं: वे न मेहनत करते हैं, न सूत कातते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: कपड़ों के लिए
  rationale: ἔνδυμα यहाँ किसी एक वस्त्र के बजाय पहनावे की सामान्य आवश्यकता को दर्शाता है; आधुनिक हिन्दी में बहुवचन ‘कपड़ों’ स्वाभाविक है।
- source_word: τί μεριμνᾶτε
  choice: क्यों चिंता करते हो
  rationale: इस प्रसंग में μεριμνάω सामान्य विचार नहीं, बल्कि आवश्यकताओं को लेकर चिंतित होने का भाव रखता है। ‘क्यों चिंता करते हो’ प्रश्न की शक्ति और सरल आधुनिक भाषा दोनों बनाए रखता है।
- source_word: καταμάθετε
  choice: ध्यान दो
  rationale: क्रिया ध्यानपूर्वक देखने और उससे समझने का आग्रह करती है। ‘ध्यान दो’ हिन्दी में स्वाभाविक है और अनावश्यक व्याख्यात्मक विस्तार के बिना आज्ञार्थक बल रखता है।
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: मैदान के सोसन के फूल
  rationale: κρίνα का सीधा अर्थ लिली/सोसन के फूल है। ‘सोसन के फूल’ हिन्दी बाइबलीय प्रयोग में पहचाना जाता है, जबकि ‘मैदान के’ τοῦ ἀγροῦ को स्पष्ट रखता है। व्यापक अर्थ ‘जंगली फूल’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: πῶς αὐξάνουσιν
  choice: कि वे कैसे बढ़ते हैं
  rationale: αὐξάνω यहाँ पौधों की स्वाभाविक वृद्धि बताता है; ‘बढ़ते हैं’ इसका स्पष्ट और सहज समतुल्य है।
- source_word: οὐ κοπιῶσιν
  choice: वे न मेहनत करते हैं
  rationale: κοπιάω कठिन परिश्रम करने को दर्शाता है। ‘मेहनत करते हैं’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और अगले खंड के साथ समानांतरता रखता है।
- source_word: οὐδὲ νήθουσιν
  choice: न सूत कातते हैं
  rationale: νήθω धागा या सूत कातने को कहता है। हिन्दी में केवल ‘कातते’ की अपेक्षा ‘सूत कातते’ अधिक स्पष्ट और मुहावरेदार है।
theological_decisions:
- issue: यीशु की शिक्षा में μεριμνάω का अर्थ
  choice: चिंता करते हो
  alternative: फ़िक्र करते हो / व्याकुल होते हो
  rationale: ‘चिंता’ भीतर की आशंकित चिंता को व्यक्त करती है और आधुनिक मानक हिन्दी में dignified तथा व्यापक रूप से समझी जाती है; यह उचित योजना बनाने को निषिद्ध बताने जैसी अतिरिक्त व्याख्या नहीं जोड़ती।
- issue: κρίνα की वनस्पति पहचान
  choice: सोसन के फूल
  alternative: जंगली फूल
  rationale: मूल शब्द का प्रमुख कोशगत अर्थ लिली/सोसन है, पर सटीक वनस्पति पहचान अनिश्चित हो सकती है। मुख्य पाठ में सीधा अर्थ और पादटिप्पणी में व्यापक सम्भावना रखकर अस्पष्टता सुरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल पर गरिमापूर्ण शैली। संबोधन बहुवचन/सम्मानसूचक ‘करते हो’ में रखा गया है। ‘सूत कातते हैं’ सांस्कृतिक क्रिया को स्पष्ट करता है; वाक्य की संक्षिप्त समानांतर संरचना मूल के निकट रखी गई है।
