id: MAT.6.6
reference: Matthew 6:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: hi
  text: परन्तु तुम, जब प्रार्थना करो, तो अपने भीतरी कमरे[a] में जाओ, और दरवाज़ा बंद करके अपने पिता से प्रार्थना करो, जो गुप्त में हैं; और तुम्हारे पिता, जो गुप्त में देखते हैं, तुम्हें प्रतिफल देंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एकांत कमरा’ अथवा ‘भंडार का कमरा’। यूनानी शब्द घर के भीतर के ऐसे कमरे को सूचित करता है जो एकांत या भंडारण के काम आता था।
    reason: lexical_alternative
  - marker: b
    text: या ‘तुम्हें प्रतिदान देंगे’ अथवा ‘तुम्हें लौटा देंगे’। यूनानी क्रिया का अर्थ संदर्भ के अनुसार लौटाना, चुकाना या प्रतिफल देना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: पर जब तुम
  rationale: δέ पिछले पद में वर्णित कपटियों से विरोध दिखाता है, और बलयुक्त σὺ को हिन्दी में स्वाभाविक रूप से ‘तुम’ द्वारा बनाए रखा गया है।
- source_word: ὅταν προσεύχῃ
  choice: जब तुम प्रार्थना करो
  rationale: ὅταν के साथ विधिलिंग सामान्य या बार-बार आने वाली परिस्थिति बताता है; यह हिन्दी प्रयोग उस भाव को सहजता से व्यक्त करता है।
- source_word: ταμεῖόν
  choice: भीतरी कमरे
  rationale: ταμεῖον घर के भीतर के ऐसे कमरे को सूचित कर सकता है जो भंडारण या एकांत के लिए प्रयुक्त हो; ‘भीतरी कमरा’ उसके एकांत और आंतरिक स्थान दोनों को बनाए रखता है।
- source_word: κλείσας τὴν θύραν σου
  choice: दरवाज़ा बंद करके
  rationale: अओरिस्ट कृदंत मुख्य आज्ञा से पहले की क्रिया बताता है; ‘बंद करके’ हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῷ πατρί σου
  choice: अपने पिता से
  rationale: मूल पाठ केवल ‘तुम्हारे पिता’ कहता है; ‘स्वर्गीय’ जैसा कोई विस्तार नहीं जोड़ा गया। हिन्दी में ‘प्रार्थना करना’ के साथ ‘से’ स्वाभाविक है।
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: जो गुप्त में हैं
  rationale: यह वाक्यांश पिता की छिपी उपस्थिति या गुप्त क्षेत्र से संबंध को व्यक्त करता है; जानबूझकर इसे केवल भौतिक स्थान या अदृश्यता तक सीमित नहीं किया गया।
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: जो गुप्त में देखते हैं
  rationale: दोहराए गए ἐν τῷ κρυπτῷ को समान रूप में रखकर मूल की अलंकारिक पुनरावृत्ति और अर्थगत खुलापन सुरक्षित रखा गया है।
- source_word: ἀποδώσει σοι
  choice: तुम्हें प्रतिफल देंगे
  rationale: ἀποδίδωμι का अर्थ लौटाना, चुकाना या प्रतिफल देना हो सकता है। इस संदर्भ में ‘प्रतिफल देंगे’ सकारात्मक दिव्य प्रत्युत्तर को व्यक्त करता है, जबकि विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ἐν τῷ κρυπτῷ की पुनरावृत्ति
  choice: दोनों स्थानों पर ‘गुप्त में’
  alternative: ‘गुप्त स्थान में’ अथवा दूसरे स्थान पर ‘गुप्त कामों को’
  rationale: एक ही अभिव्यक्ति मूल की पुनरावृत्ति बनाए रखती है और इसे पूरी तरह स्थानवाचक या कर्मवाचक मानकर अस्पष्टता समाप्त नहीं करती।
- issue: परमेश्वर के लिए πατήρ
  choice: पिता
  alternative: स्वर्गीय पिता
  rationale: मूल पाठ में केवल ‘पिता’ है; निकटवर्ती संदर्भ से ‘स्वर्गीय’ जोड़ना अनावश्यक विस्तार होता।
- issue: ἀποδώσει का दिव्य प्रत्युत्तर
  choice: प्रतिफल देंगे
  alternative: बदला देंगे / लौटा देंगे
  rationale: संदर्भ में यह सच्ची, गुप्त प्रार्थना के प्रति पिता के अनुकूल प्रत्युत्तर को सूचित करता है, पर प्रतिफल का स्वरूप निर्धारित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। पिता के लिए आदरसूचक बहुवचन क्रिया ‘हैं/देखते हैं/देंगे’ प्रयुक्त हुई है। ‘गुप्त में’ की कुछ असामान्य किन्तु बोधगम्य रचना मूल की जानबूझकर की गई पुनरावृत्ति और अर्थगत तनाव को सुरक्षित रखती है।
