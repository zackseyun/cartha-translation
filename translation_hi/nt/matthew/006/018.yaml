  to: ताकि लोगों को यह न दिखाई दे कि तुम उपवास कर रहे हो, बल्कि तुम्हारे पिता को, जो गुप्त में हैं, दिखाई दे। और तुम्हारे पिता, जो गुप्त में देखते हैं, तुम्हें प्रतिफल देंगे।
