review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the purpose clause, the generic human observers (τοῖς ἀνθρώποις), fasting, the contrast with the Father, the repeated ‘in secret’ (ἐν τῷ κρυφαίῳ), and the promised recompense. However, the first contrast is left syntactically incomplete in Hindi: ‘बल्कि तुम्हारे पिता को’ has no governing verb corresponding to ‘appear.’'
  naturalness: The register is modern, dignified Hindi, and the honorific plural forms for ‘पिता’ are appropriate. Supplying ‘दिखाई दे’ after the contrasted phrase makes the first sentence complete and natural without adding interpretive content.
  terminology: ‘उपवास,’ ‘पिता,’ ‘गुप्त में,’ and ‘प्रतिफल’ are suitable and consistent. Retaining ‘गुप्त में’ in both occurrences preserves the Greek repetition and its connection between hidden devotion and the Father’s seeing.
  issues:
  - severity: medium
    issue: The clause after ‘बल्कि’ lacks a finite predicate.
    rationale: In ‘ताकि लोगों को यह न दिखाई दे कि तुम उपवास कर रहे हो, बल्कि तुम्हारे पिता को,’ the phrase ‘तुम्हारे पिता को’ is left dangling. Greek contrasts the persons before whom the fasting is apparent; Hindi needs the repeated predicate ‘दिखाई दे’ to express this contrast clearly.
  revised_text: ताकि लोगों को यह न दिखाई दे कि तुम उपवास कर रहे हो, बल्कि तुम्हारे पिता को, जो गुप्त में हैं, दिखाई दे। और तुम्हारे पिता, जो गुप्त में देखते हैं, तुम्हें प्रतिफल देंगे।
  revised_footnotes: []
