id: MAT.6.18
reference: Matthew 6:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: hi
  text: ताकि लोगों को यह न दिखाई दे कि तुम उपवास कर रहे हो, बल्कि तुम्हारे पिता को, जो गुप्त में हैं, दिखाई दे। और तुम्हारे पिता, जो गुप्त में देखते हैं, तुम्हें प्रतिफल देंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως
  choice: ताकि
  rationale: यह प्रयोजन प्रकट करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: μὴ φανῇς τοῖς ἀνθρώποις νηστεύων
  choice: लोगों को यह न दिखाई दे कि तुम उपवास कर रहे हो
  rationale: यह यूनानी निषेध और दिखने के भाव को स्पष्ट, स्वाभाविक हिन्दी में रखता है; ἀνθρώποις यहाँ सामान्यतः मानव दर्शकों को सूचित करता है।
- source_word: ἀλλὰ τῷ πατρί σου
  choice: बल्कि तुम्हारे पिता को
  rationale: ἀλλά द्वारा व्यक्त विरोध को बनाए रखते हुए दातृकारक की समानांतर रचना सुरक्षित रखी गई है।
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: जो गुप्त में हैं
  rationale: κρυφαίῳ को अनावश्यक रूप से किसी निश्चित स्थान तक सीमित किए बिना पिता की अदृश्य उपस्थिति का भाव रखा गया है।
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: जो गुप्त में देखते हैं
  rationale: दोनों बार κρυφαίῳ का समान अनुवाद पुनरुक्ति और वाक्य की आंतरिक कड़ी को बनाए रखता है; 'जो किया जाता है' जैसे अनुल्लिखित कर्म को नहीं जोड़ा गया।
- source_word: ἀποδώσει σοι
  choice: तुम्हें प्रतिफल देंगे
  rationale: संदर्भ में ἀποδίδωμι का अर्थ प्रत्युत्तर में फल या पुरस्कार देना है; 'प्रतिफल' गरिमापूर्ण और व्यापक हिन्दी विकल्प है।
theological_decisions:
- issue: ἀνθρώποις का सामान्य मानवीय संदर्भ
  choice: लोगों
  alternative: मनुष्यों
  rationale: संदर्भ केवल पुरुषों का नहीं, सभी मानव दर्शकों का है। 'लोगों' आधुनिक हिन्दी में इस सामान्य अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- issue: κρυφαίῳ के दोनों प्रयोग
  choice: दोनों स्थानों पर 'गुप्त में'
  alternative: '''एकान्त में'' या ''गुप्त स्थान में'''
  rationale: यह मूल की पुनरावृत्ति और गुप्त भक्ति तथा पिता के देखने के बीच संबंध को बनाए रखता है, बिना किसी ठोस स्थान को अनिवार्य किए।
- issue: निषेध और विरोध की रचना
  choice: लोगों को यह न दिखाई दे..., बल्कि तुम्हारे पिता को
  alternative: तुम उपवास करते हुए लोगों को नहीं, बल्कि पिता को दिखाई दो
  rationale: मूल की μὴ...ἀλλά संरचना और उसका तनाव सुरक्षित रखते हुए हिन्दी में अर्थ स्पष्ट किया गया है; पिता के सामने दिखावटी प्रदर्शन का आशय नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और स्रोत-समीप शैली। 'पिता' के लिए आदरसूचक बहुवचन क्रिया ('हैं', 'देखते हैं', 'देंगे') हिन्दी के धार्मिक और सामान्य सम्मानसूचक प्रयोग के अनुरूप है।
