source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: hi
  text: और तुममें से कौन चिंता करके अपनी आयु[a] में एक हाथ भी बढ़ा सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने कद में एक हाथ भी बढ़ा सकता है?” यूनानी शब्द का अर्थ “आयु/जीवनकाल” या “कद” दोनों हो सकता है।
    reason: मूल यूनानी ἡλικία की वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: और तुममें से कौन
  rationale: δέ यहाँ हल्का संयोजक है, इसलिए ‘और’ प्रसंग के प्रवाह को बनाए रखता है; τίς ἐξ ὑμῶν का स्वाभाविक हिन्दी रूप ‘तुममें से कौन’ है।
- source_word: μεριμνῶν
  choice: चिन्ता करके
  rationale: कृदन्त चिन्ता करने को उस साधन या दशा के रूप में प्रस्तुत करता है जिसके द्वारा कथित वृद्धि असम्भव है; ‘चिन्ता करके’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: δύναται προσθεῖναι
  choice: बढ़ा सकता है
  rationale: δύναται सामर्थ्य और προσθεῖναι जोड़ने या बढ़ाने का भाव व्यक्त करते हैं। आयु के साथ ‘बढ़ा सकता है’ स्वाभाविक हिन्दी है और मूल प्रश्न की असमर्थता को स्पष्ट रखता है।
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: अपनी आयु में
  rationale: ἡλικία का अर्थ आयु/जीवनकाल या कद हो सकता है। चिन्ता और जीवन के प्रसंग में ‘आयु’ उपयुक्त है, जबकि वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है। αὐτοῦ का सम्बन्ध हिन्दी में स्वाभाविक रूप से ‘अपनी’ से व्यक्त होता है।
- source_word: πῆχυν ἕνα
  choice: एक हाथ भी
  rationale: πῆχυς को पारम्परिक भारतीय लंबाई-संज्ञा ‘हाथ’ से व्यक्त किया गया है। ‘भी’ प्रश्न के बल को स्वाभाविक हिन्दी में सामने लाता है, अर्थात चिन्ता इतनी-सी वृद्धि भी नहीं कर सकती।
theological_decisions:
- issue: ἡλικία का अर्थ
  choice: आयु
  alternative: कद
  rationale: आस-पास का उपदेश जीवन के लिए चिन्ता और परमेश्वर की देखभाल से सम्बन्धित है, इसलिए ‘आयु’ कथन के आशय के अनुकूल है। फिर भी लंबाई की इकाई के साथ ‘कद’ एक वास्तविक और प्राचीन वैकल्पिक समझ है; अतः उसे पादटिप्पणी में रखा गया है, मिटाया नहीं गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘चिन्ता करके’ सामान्य पाठक के लिए स्पष्ट है; ‘एक हाथ’ मूल की प्राचीन लंबाई-इकाई और ठोस रूपक को बनाए रखता है।
