id: MAT.6.24
reference: Matthew 6:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: hi
  text: कोई भी व्यक्ति दो मालिकों की गुलामी नहीं कर सकता, क्योंकि वह या तो एक से घृणा करेगा और दूसरे से प्रेम करेगा, या एक के प्रति निष्ठावान रहेगा और दूसरे को तुच्छ समझेगा। तुम परमेश्वर और मामोन[a]—दोनों की गुलामी नहीं कर सकते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘धन’ या ‘पैसा।’ यूनानी पाठ में अरामी मूल का आगंतुक शब्द ‘मामोन’ है, जो यहाँ धन को एक प्रतिद्वंद्वी मालिक के रूप में प्रस्तुत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: कोई भी व्यक्ति नहीं
  rationale: यह सार्वभौमिक निषेध को स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δυσὶ κυρίοις
  choice: दो मालिकों
  rationale: यहाँ κύριος दास और मालिक के सामाजिक संबंध में प्रयुक्त है; इसलिए ‘मालिक’ प्रसंगानुकूल है और दैवी उपाधि ‘प्रभु’ से भ्रम नहीं पैदा करता।
- source_word: δουλεύειν
  choice: गुलामी करना
  rationale: क्रिया दास के रूप में सेवा करने का अर्थ रखती है। ‘गुलामी करना’ मालिकों की छवि और अनन्य अधीनता की तीव्रता को ‘सेवा करना’ से अधिक स्पष्ट रखता है।
- source_word: μισήσει / ἀγαπήσει
  choice: घृणा करेगा / प्रेम करेगा
  rationale: मूल पाठ के तीखे विरोध को बिना नरम किए सीधे बनाए रखा गया है।
- source_word: ἑνὸς ἀνθέξεται
  choice: एक से लगा रहेगा
  rationale: यह किसी एक को दृढ़ता से थामे रहने और उसके प्रति निष्ठावान बने रहने का संबंधपरक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καταφρονήσει
  choice: तुच्छ समझेगा
  rationale: यह दूसरे को नीचा या महत्वहीन मानने के अर्थ को वर्तमान, सहज हिन्दी में व्यक्त करता है।
- source_word: θεῷ
  choice: परमेश्वर
  rationale: θεός के लिए मानक, गरिमापूर्ण हिन्दी पद।
- source_word: μαμωνᾷ
  choice: मामोन
  rationale: अरामी मूल के इस यूनानी आगंतुक शब्द को बनाए रखने से धन के प्रतिद्वंद्वी मालिक के रूप में व्यक्तित्व ग्रहण करने वाला प्रभाव सुरक्षित रहता है; अर्थ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: κύριος का गैर-दैवी सामाजिक प्रसंग में अनुवाद
  choice: मालिक
  alternative: प्रभु
  rationale: बहुवचन और गुलामी की छवि स्पष्ट करती है कि यहाँ स्वामी-दास संबंध अभिप्रेत है; ‘मालिक’ सादा अर्थ सुरक्षित रखता है और दैवी उपाधि से अनचाहा भ्रम टालता है।
- issue: μαμωνᾶς का अनुवाद
  choice: मामोन
  alternative: धन या पैसा
  rationale: परमेश्वर और मामोन को सेवा के दो प्रतिद्वंद्वी पात्रों के रूप में रखा गया है। आगंतुक शब्द बनाए रखने से यह अलंकारिक और व्यक्तिकृत बल सुरक्षित रहता है, जबकि उसका सामान्य अर्थ पादटिप्पणी में दिया गया है।
- issue: δουλεύειν में दासत्व की तीव्रता
  choice: गुलामी करना
  alternative: सेवा करना
  rationale: कथन केवल सामान्य सेवा नहीं, बल्कि मालिक के प्रति दास की अधीनता की बात करता है। इसलिए अधिक स्पष्ट दासत्व-संबंधी भाषा चुनी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण रूप अपनाया गया है। समानांतर विरोधों को स्पष्ट रखा गया है और अंतिम वाक्य में ‘दोनों’ के साथ विरामचिह्न लगाकर परमेश्वर तथा मामोन की प्रतिद्वंद्वी स्थिति उभारी गई है।
