  - severity: low
    issue: ‘एक से लगा रहेगा’ is slightly ambiguous in modern Hindi.
    rationale: It may suggest personal affection rather than the source sense of holding fast to or being devoted to one master. ‘एक के प्रति निष्ठावान रहेगा’ conveys the intended allegiance naturally.
