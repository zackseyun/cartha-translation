  terminology: ‘परमेश्वर,’ ‘मालिक,’ and ‘मामोन’ are suitable. Retaining ‘मामोन’ appropriately preserves the loanword and its rival-master force; the footnote supplies ‘धन’ and ‘पैसा’ as lexical alternatives. ‘गुलामी करना’ retains the force of δουλεύειν without imposing an interpretive theological gloss.
