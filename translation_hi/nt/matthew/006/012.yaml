id: MAT.6.12
reference: Matthew 6:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ⸀ἀφήκαμεν τοῖς ὀφειλέταις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: hi
  text: और हमारे ऋण[a] क्षमा कर, जैसे हमने भी अपने ऋणियों को क्षमा किया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपराध’। अधिक शाब्दिक अर्थ ‘ऋण’ है। यूनानी में बकाया होने का रूपक बना रहता है, जो यहाँ संभवतः पापों या अपराधों की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘क्षमा किया’। यूनानी क्रिया को साधारण भूतकाल में भी अनूदित किया जा सकता है; ‘क्षमा किया है’ पूरी हुई क्रिया का वर्तमान विनती से संबंध स्वाभाविक हिन्दी में व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: क्षमा कर
  rationale: ἀφίημι का यह एकवचन आज्ञार्थक रूप प्रार्थना के संदर्भ में क्षमा की विनती व्यक्त करता है। ‘छोड़ दे’ ऋण के रूपक को उभार सकता था, पर नैतिक संदर्भ में ‘क्षमा कर’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: τὰ ὀφειλήματα ἡμῶν
  choice: हमारे ऋण
  rationale: ὀφειλήματα का मूल अर्थ ‘जो बकाया है’ या ‘ऋण’ है। ‘ऋण’ मूल के रूपक को बनाए रखता है और आगे आने वाले सजातीय शब्द ‘ऋणियों’ से संबंध भी स्पष्ट करता है।
- source_word: ὡς
  choice: जैसे
  rationale: ὡς परमेश्वर से माँगी गई क्षमा और मनुष्यों द्वारा दी गई क्षमा के बीच तुलना प्रस्तुत करता है; ‘जैसे’ इस संबंध को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καὶ ἡμεῖς
  choice: हमने भी
  rationale: दूसरा καὶ और स्पष्ट सर्वनाम ἡμεῖς मिलकर मानवीय पक्ष पर बल देते हैं; ‘हमने भी’ उस बल को बनाए रखता है।
- source_word: ἀφήκαμεν
  choice: क्षमा किया है
  rationale: यूनानी अनिश्चित भूतकाल को हिन्दी का पूर्ण पक्ष स्वाभाविक रूप से ऐसी पूरी हुई क्रिया के रूप में व्यक्त करता है जिसका वर्तमान प्रार्थना से संबंध बना हुआ है; फिर भी साधारण भूतकाल की संभावना टिप्पणी में सुरक्षित है।
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: अपने ऋणियों को
  rationale: ὀφειλέταις, ὀφειλήματα का सजातीय शब्द है। ‘ऋणियों’ दोनों पदों की शब्दगत कड़ी और ऋण के रूपक को बनाए रखता है; ‘अपने’ हिन्दी में ‘हमारे’ का स्वाभाविक प्रत्यावर्ती रूप है।
- source_word: καὶ
  choice: और
  rationale: आरंभिक καὶ इस विनती को प्रभु की प्रार्थना की पिछली विनतियों से जोड़ता है।
theological_decisions:
- issue: ὀφειλήματα का नैतिक ऋण-रूपक
  choice: मुख्य पाठ में ‘ऋण’ और ‘ऋणियों’ को बनाए रखा गया है।
  alternative: ‘अपराध’ और ‘हमारे विरुद्ध अपराध करने वाले’
  rationale: मूल यूनानी पाप या अपराध के लिए सामान्य शब्द न लेकर बकाया ऋण का रूपक इस्तेमाल करता है। मुख्य पाठ में उसी रूपक को रखने से अर्थ को किसी एक व्याख्या तक सीमित नहीं किया जाता; नैतिक आशय पादटिप्पणी में स्पष्ट किया गया है।
- issue: ἀφήκαμεν का कालगत पक्ष
  choice: ‘क्षमा किया है’
  alternative: ‘क्षमा किया’
  rationale: यूनानी अनिश्चित भूतकाल पूरी हुई क्रिया बताता है, जबकि उसका सटीक हिन्दी काल संदर्भ के अनुसार व्यक्त होता है। ‘किया है’ वर्तमान विनती से उसका संबंध स्वाभाविक रूप से दिखाता है, पर साधारण भूतकाल भी व्याकरणतः संभव है।
- issue: ईश्वरीय और मानवीय क्षमा के बीच ὡς का संबंध
  choice: तुलनात्मक ‘जैसे’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘इसलिए कि’ अथवा ‘इस शर्त पर कि’
  rationale: ὡς तुलना को स्पष्ट करता है, लेकिन यह पद अपने आप उस संबंध का पूरा धर्मवैज्ञानिक स्वरूप निर्धारित नहीं करता। कारण या कठोर शर्त जोड़ना मूल की वास्तविक तनावपूर्ण संक्षिप्तता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक है। ‘क्षमा कर’ परमेश्वर से सीधे एकवचन संबोधन की मूल व्याकरणिक संरचना को रखता है। ‘ऋण’ और ‘ऋणी’ सामान्य ‘कर्ज़’ और ‘कर्ज़दार’ से कुछ अधिक औपचारिक हैं, पर मूल की सजातीय शब्दावली और नैतिक रूपक को संक्षेप में सुरक्षित रखते हैं।
