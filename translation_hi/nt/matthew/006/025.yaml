source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: hi
  text: 'इसलिए मैं तुमसे कहता हूँ: अपने जीवन की चिंता मत करो कि तुम क्या खाओगे, और न अपने शरीर की कि तुम क्या पहनोगे। क्या जीवन भोजन से और शरीर कपड़ों से बढ़कर नहीं है?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“जीवन” के लिए “प्राण” भी अनुवाद किया जा सकता है (यूनानी: ψυχή); यहाँ खाने और जीवन-निर्वाह का संदर्भ “जीवन” का समर्थन करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: इसलिए
  rationale: यह पिछले उपदेश से निकले निष्कर्ष को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: μεριμνᾶτε
  choice: चिंता मत करो
  rationale: यह निषेध व्याकुल कर देने वाली चिंता या फिक्र से संबंधित है; आधुनिक हिन्दी में यह सहज और सटीक है।
- source_word: ψυχῇ / ψυχὴ
  choice: जीवन
  rationale: खाने और जीवन-निर्वाह के संदर्भ में ψυχή यहाँ मुख्यतः जीवन/जीवित अस्तित्व को दर्शाता है, न कि विशेष रूप से अभौतिक आत्मा को।
- source_word: τί φάγητε
  choice: कि तुम क्या खाओगे
  rationale: अप्रत्यक्ष प्रश्न में भविष्य की आवश्यकता को लेकर चिंता का स्वाभाविक हिन्दी रूप।
- source_word: σώματι / σῶμα
  choice: शरीर
  rationale: कपड़ों के संबंध में भौतिक देह का सीधा उल्लेख है।
- source_word: τί ἐνδύσησθε
  choice: कि तुम क्या पहनोगे
  rationale: वस्त्र धारण करने के लिए आधुनिक हिन्दी की सहज अभिव्यक्ति।
- source_word: οὐχὶ
  choice: क्या ... नहीं है?
  rationale: ऐसा आलंकारिक प्रश्न व्यक्त करता है जिसका अपेक्षित उत्तर सकारात्मक है।
- source_word: πλεῖόν
  choice: से बढ़कर
  rationale: जीवन और शरीर की भोजन और कपड़ों से अधिक महत्ता व्यक्त करता है, बिना इसे केवल आर्थिक मूल्य तक सीमित किए।
- source_word: τροφῆς
  choice: भोजन
  rationale: जीवन को बनाए रखने वाले खाने के लिए स्पष्ट और सामान्य शब्द।
- source_word: ἐνδύματος
  choice: कपड़ों
  rationale: सामान्य परिधान के लिए सहज आधुनिक हिन्दी; 'भोजन' के साथ स्वाभाविक समानांतर बनाता है।
theological_decisions:
- issue: ψυχή का अर्थ
  choice: जीवन
  alternative: प्राण; आत्मा
  rationale: तात्कालिक संदर्भ खाने, शरीर और कपड़ों जैसी जीवन की आवश्यकताओं का है। 'जीवन' मूल अर्थ-क्षेत्र को यहाँ सबसे स्पष्ट रूप से व्यक्त करता है और पद में अभौतिक आत्मा संबंधी दावा आरोपित नहीं करता।
- issue: πλεῖόν की तुलना
  choice: से बढ़कर
  alternative: से अधिक मूल्यवान
  rationale: मूल यूनानी तुलना को व्यापक रखता है—इसमें महत्ता और श्रेष्ठता दोनों समा सकती हैं—और केवल मूल्य का अर्थ थोपता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए बहुवचन/सामान्य ‘तुम’ रखा गया है। भाषा सरल और गरिमापूर्ण है। मूल वाक्य की दो समानांतर चिंताओं और अंत के आलंकारिक प्रश्न को सुरक्षित रखा गया है।
