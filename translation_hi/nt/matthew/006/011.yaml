lexical_decisions:
- source_word: τὸν ἄρτον ἡμῶν
  choice: हमारी ... रोटी
  rationale: ἄρτος का सीधा अर्थ ‘रोटी’ है; यद्यपि यह व्यापक रूप से भोजन या जीविका का संकेत दे सकता है, मुख्य पाठ में ठोस बिंब बनाए रखा गया है। ἡμῶν के संबंधवाचक अर्थ को ‘हमारी’ से व्यक्त किया गया है।
- source_word: τὸν ἐπιούσιον
  choice: प्रतिदिन की
  rationale: दुर्लभ विशेषण ἐπιούσιος का सटीक अर्थ विवादित है। ‘प्रतिदिन की’ प्रभु की प्रार्थना में प्रचलित, स्वाभाविक और दिन-प्रतिदिन परमेश्वर पर निर्भरता व्यक्त करने वाला अनुवाद है; अन्य प्रमुख अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
- source_word: δὸς ἡμῖν
  choice: हमें ... दे
  rationale: δὸς, δίδωμι का आज्ञार्थक रूप, सीधे ‘दे’ से व्यक्त होता है; ἡμῖν अप्रत्यक्ष कर्म ‘हमें’ है। प्रार्थना में परमेश्वर के लिए एकवचन निकट संबोधन के अनुरूप ‘दे’ स्वाभाविक है।
- source_word: σήμερον
  choice: आज
  rationale: σήμερον का सामान्य आधुनिक हिन्दी अर्थ ‘आज’ है; यह समय-संबंधी बल को स्पष्ट और संक्षिप्त रूप से बनाए रखता है।
theological_decisions:
- issue: प्रभु की प्रार्थना में ἐπιούσιον का अर्थ
  choice: प्रतिदिन की
  alternative: आज के लिए; आने वाले दिन की; हमारी आवश्यकता की
  rationale: ἐπιούσιος वर्तमान दिन, आने वाले दिन, या जीवन-निर्वाह के लिए आवश्यक रोटी की ओर संकेत कर सकता है। मुख्य पाठ में परिचित और अर्थ-संचारक ‘प्रतिदिन की’ रखा गया है, पर किसी एक विवादित व्युत्पत्ति को अंतिम मानने के बजाय वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
