source:
  edition: SBLGNT
  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: hi
  text: “आँख शरीर का दीपक है। इसलिए, यदि तुम्हारी आँख स्वस्थ[a] हो, तो तुम्हारा सारा शरीर प्रकाश से भर जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एकाग्र,” “निर्मल,” अथवा “ठीक”; यूनानी शब्द में अविभाजित होने का भाव भी हो सकता है और कुछ प्रसंगों में इसका अर्थ “उदार” होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: दीपक
  rationale: यह शब्द सामान्यतः प्रकाश की अमूर्त धारणा नहीं, बल्कि दीपक को दर्शाता है; ‘दीपक’ आँख को शरीर के प्रकाश-स्रोत के रूप में प्रस्तुत करने वाले ठोस रूपक को बनाए रखता है।
- source_word: σῶμα
  choice: शरीर
  rationale: यह मानक और स्वाभाविक हिन्दी पर्याय है तथा पद की शारीरिक छवि को सुरक्षित रखता है।
- source_word: ὀφθαλμός
  choice: आँख
  rationale: शाब्दिक और सहज अनुवाद, जो शारीरिक चित्र और नैतिक रूपक दोनों के अनुकूल है।
- source_word: ἐὰν οὖν
  choice: इसलिए यदि
  rationale: οὖν पिछले कथन से निकले निष्कर्ष या संबंध को सूचित करता है; ‘इसलिए यदि’ उस तार्किक कड़ी को स्पष्ट रखता है।
- source_word: ἁπλοῦς
  choice: स्वस्थ
  rationale: आँख और शरीर के प्रकाशित होने के निकटवर्ती रूपक में यह ऐसी आँख को सूचित करता है जो ठीक ढंग से काम करती है। मूल शब्द के ‘एकनिष्ठ/निर्मल/उदार’ जैसे संभावित अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: ὅλον
  choice: सारा
  rationale: समग्रता व्यक्त करने वाला स्वाभाविक हिन्दी रूप, जो ‘शरीर’ के साथ सहज बैठता है।
- source_word: φωτεινὸν
  choice: प्रकाश से भर जाएगा
  rationale: विशेषण का मूल भाव ‘प्रकाशमय’ है; यह मुहावरेदार अभिव्यक्ति पूरे शरीर पर प्रकाश के प्रभाव की छवि को स्पष्ट रूप से व्यक्त करती है।
- source_word: ἔσται
  choice: हो जाएगा
  rationale: यूनानी के स्पष्ट भविष्यकाल को हिन्दी में बनाए रखता है।
theological_decisions:
- issue: आँख के रूपक में ἁπλοῦς का अर्थ
  choice: मुख्य पाठ में ‘स्वस्थ’
  alternative: ‘एकनिष्ठ,’ ‘निर्मल,’ ‘ठीक,’ या प्रसंगानुसार ‘उदार’
  rationale: तत्काल प्रसंग में आँख शरीर का दीपक है और अगले पद में बुरी आँख से उसका विरोध है; इसलिए ठीक दृश्य-कार्य से जुड़ा अनुवाद आधुनिक हिन्दी में रूपक को सबसे स्वाभाविक रूप से व्यक्त करता है। फिर भी शब्द की एकाग्रता, निष्कपटता अथवा उदारता से जुड़ी अर्थ-छायाओं को पादटिप्पणी में रखा गया है, ताकि वास्तविक अर्थ-विस्तार दब न जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। ‘दीपक’ ठोस रूपक बनाए रखता है; ‘प्रकाश से भर जाएगा’ स्वाभाविक हिन्दी में φωτεινόν की प्रकाशमयता व्यक्त करता है।
