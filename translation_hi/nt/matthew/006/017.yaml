lexical_decisions:
- source_word: σὺ δὲ
  choice: पर तुम
  rationale: ज़ोरदार सर्वनाम और δέ पिछले प्रसंग के कपटियों से सीधा विरोध दिखाते हैं। ‘पर तुम’ इस बल को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: νηστεύων
  choice: जब उपवास करो
  rationale: वर्तमान कृदन्त यहाँ समयसूचक है; हिन्दी में ‘जब उपवास करो’ स्वाभाविक रूप से इसका अर्थ व्यक्त करता है।
- source_word: ἄλειψαί σου τὴν κεφαλήν
  choice: अपने सिर पर तेल लगाओ
  rationale: ἀλείφω का आशय यहाँ शरीर-सज्जा के सामान्य व्यवहार के रूप में तेल लगाने से है। ‘तेल लगाओ’ आधुनिक पाठक के लिए ‘अभिषेक करो’ से अधिक स्पष्ट है और अनुष्ठान का अनावश्यक संकेत नहीं देता।
- source_word: καὶ
  choice: और
  rationale: दोनों आज्ञाओं के साधारण समन्वय को बनाए रखता है।
- source_word: τὸ πρόσωπόν σου νίψαι
  choice: अपना मुँह धोओ
  rationale: νίπτω शरीर के किसी अंग को धोने के लिए प्रयुक्त होता है, और πρόσωπον यहाँ दिखाई देने वाले चेहरे को दर्शाता है। रोज़मर्रा की हिन्दी में ‘मुँह धोओ’ स्वाभाविक है।
theological_decisions:
- issue: उपवास करते समय बाहरी रूप के विषय में निर्देश
  choice: निर्देश सामान्य रूप से सजने-सँवरने और मुँह धोने का है, ताकि उपवास का प्रदर्शन न हो।
  alternative: इसे अनुष्ठानिक अभिषेक की आज्ञा या सार्वजनिक उपवास के पूर्ण निषेध के रूप में समझना।
  rationale: निकटवर्ती प्रसंग कपटियों द्वारा अपना चेहरा बिगाड़ने के विपरीत सामान्य बाहरी रूप बनाए रखने पर बल देता है। पद न तो उपवास को रोकता है, न स्पष्ट रूप से कोई अनुष्ठान निर्धारित करता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘मुँह धोओ’ सामान्य बोलचाल में स्वाभाविक है, जबकि ‘तेल लगाओ’ अनुष्ठानिक अर्थ थोपे बिना प्राचीन साज-सज्जा की प्रथा को स्पष्ट करता है।
