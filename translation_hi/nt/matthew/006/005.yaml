reference: Matthew 6:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: hi
  text: “और जब-जब तुम प्रार्थना करो, तब कपटियों के समान मत बनो; क्योंकि वे यहूदी सभागृहों में और चौड़ी सड़कों के मोड़ों पर[a] खड़े होकर प्रार्थना करना पसंद करते हैं, ताकि लोग[b] उन्हें देखें। मैं तुमसे सच कहता हूँ, वे अपना प्रतिफल पा चुके हैं[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “सड़कों के कोनों पर।” यूनानी में अधिक शाब्दिक रूप से “चौड़ी सड़कों के मोड़ों/कोनों पर” है।'
    reason: lexical_alternative
  - marker: b
    text: 'या: “मनुष्य उन्हें देखें।” यहाँ यूनानी शब्द सामान्य रूप से लोगों को सूचित करता है।'
    reason: lexical_alternative
  - marker: c
    text: 'या: “वे अपना पूरा प्रतिफल पा चुके हैं।” यूनानी क्रिया में भुगतान पूरा मिल जाने का व्यापारिक भाव हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: जब-जब तुम प्रार्थना करो
  rationale: ‘जब-जब’ अनिश्चित और बार-बार आने वाली परिस्थिति का बोध कराता है; यह केवल एक अवसर की बात नहीं है।
- source_word: οὐκ ἔσεσθε ὡς
  choice: कपटियों जैसे न होना
  rationale: यूनानी भविष्यत् रूप यहाँ निषेधात्मक निर्देश देता है। हिंदी में यह रूप स्वाभाविक होने के साथ उसके गंभीर निर्देशात्मक बल को बनाए रखता है।
- source_word: ὑποκριταί
  choice: कपटी
  rationale: दिखावे के लिए धार्मिकता का अभिनय करने वालों के लिए यह प्रचलित और प्रसंगानुकूल हिंदी शब्द है।
- source_word: φιλοῦσιν
  choice: पसंद करते हैं
  rationale: यह उनके झुकाव और प्रसन्नतापूर्वक ऐसा करने को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है; ‘प्रेम करते हैं’ यहाँ असहज होता।
- source_word: ἐν ταῖς συναγωγαῖς
  choice: यहूदी सभागृहों में
  rationale: यह ऐतिहासिक यहूदी संस्था की पहचान स्पष्ट करता है और इसे किसी भी सामान्य सभा-स्थान या आराधनालय से अलग रखता है।
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: चौड़ी सड़कों के मोड़ों पर
  rationale: यह πλατεῖα की चौड़ी सार्वजनिक सड़क और γωνία के मोड़/कोने—दोनों को निकटता से व्यक्त करता है।
- source_word: ἑστῶτες προσεύχεσθαι
  choice: खड़े होकर प्रार्थना करना
  rationale: यह खड़े रहने को प्रार्थना करने की रीति से जोड़ता है और हिंदी में सहज है।
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: ताकि लोग उन्हें देखें
  rationale: उद्देश्य स्पष्ट रहता है और ἀνθρώποις को प्रसंगानुसार सभी लोगों के लिए सामान्य अर्थ में लिया गया है।
- source_word: ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यीशु के गंभीर आश्वासनसूचक सूत्र को स्पष्ट, वर्तमान और गरिमापूर्ण हिंदी में प्रस्तुत करता है।
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: वे अपना प्रतिफल पा चुके हैं
  rationale: यह प्राप्ति के पूर्ण हो चुकने का भाव रखता है, पर मुख्य पाठ में ‘पूरा’ जोड़कर व्यापारिक मुहावरे की एक व्याख्या को अनिवार्य नहीं बनाता।
theological_decisions:
- issue: ἀνθρώποις का सामान्य मानवीय अर्थ
  choice: लोग
  alternative: मनुष्य / पुरुष
  rationale: यहाँ शब्द दर्शकों को सामान्य रूप से सूचित करता है, केवल पुरुषों को नहीं; ‘लोग’ हिंदी में स्रोत का आशय ठीक व्यक्त करता है।
- issue: ἀπέχουσι में प्रतिफल की प्राप्ति का बल
  choice: वे अपना प्रतिफल पा चुके हैं
  alternative: वे अपना पूरा प्रतिफल पा चुके हैं
  rationale: पूर्ण भुगतान का व्यापारिक भाव संभव है, किंतु क्रिया को केवल उसी अर्थ तक सीमित करना आवश्यक नहीं। मुख्य पाठ प्राप्त हो चुके प्रतिफल पर बल देता है और वैकल्पिक सूक्ष्मता पादटिप्पणी में रखता है।
- issue: सार्वजनिक प्रार्थना और दिखावे के बीच संबंध
  choice: स्थान या खड़े होकर प्रार्थना करने को अपने-आप दोषी न ठहराकर ‘ताकि लोग उन्हें देखें’ को लक्ष्य के रूप में बनाए रखा
  alternative: सभी सार्वजनिक या खड़े होकर की गई प्रार्थना को निषिद्ध बताना
  rationale: यूनानी वाक्य आलोचना का केंद्र लोगों द्वारा देखे जाने का उद्देश्य रखता है; इससे अधिक धार्मिक निषेध जोड़ना स्रोत से आगे जाना होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। ‘तुम’ बहुवचन शिष्यों/श्रोताओं को संबोधित करता है। ‘यहूदी सभागृह’ ऐतिहासिक संदर्भ स्पष्ट करता है; ‘प्रतिफल’ धार्मिक और नैतिक प्रसंग की गंभीरता बनाए रखता है। पादटिप्पणी-चिह्न संबंधित शब्दसमूह के तुरंत बाद रखे गए हैं।
