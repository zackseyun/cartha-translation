id: MAT.6.4
reference: Matthew 6:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: hi
  text: ताकि गरीबों को दिया हुआ तुम्हारा दान[a] गुप्त रहे; और तुम्हारा पिता, जो गुप्त में देखता है, तुम्हें प्रतिफल देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द विशेष रूप से गरीबों को दिए जाने वाले दान के लिए है; इसे “भिक्षादान” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हें उसका प्रतिदान देगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: ताकि
  rationale: यह पिछले निर्देश का उद्देश्य बताता है और यूनानी के प्रयोजनसूचक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ᾖ
  choice: रहे
  rationale: ὅπως के साथ प्रयुक्त संभावनार्थक क्रिया को हिन्दी में उद्देश्यसूचक ‘ताकि ... रहे’ से सहज रूप में व्यक्त किया गया है।
- source_word: ἐλεημοσύνη
  choice: गरीबों को दिया हुआ तुम्हारा दान
  rationale: यह शब्द सामान्य परोपकार नहीं, विशेष रूप से गरीबों को दान देने को दर्शाता है। यह रूप आधुनिक पाठक के लिए स्पष्ट है।
- source_word: ἐν τῷ κρυπτῷ
  choice: गुप्त रहे / गुप्त में
  rationale: यह पद सार्वजनिक दृष्टि से छिपे होने का भाव देता है। दोनों उपवाक्यों में ‘गुप्त’ दोहराकर मूल की पुनरावृत्ति बनाए रखी गई है, जबकि हिन्दी वाक्य-रचना के अनुसार रूप में हल्का परिवर्तन किया गया है।
- source_word: ὁ πατήρ σου
  choice: तुम्हारा पिता
  rationale: मूल में केवल ‘तुम्हारा पिता’ है; ‘स्वर्गीय’ जोड़ना निकटवर्ती प्रसंग से शब्द आयात करना होता।
- source_word: ὁ βλέπων
  choice: जो ... देखता है
  rationale: संज्ञात्मक कृदंत को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है और उसके निरंतर देखने का सीधा अर्थ सुरक्षित है।
- source_word: ἀποδώσει
  choice: प्रतिफल देगा
  rationale: इस संदर्भ में यह परमेश्वर की अनुकूल प्रत्युत्तरात्मक क्रिया को व्यक्त करता है। ‘प्रतिफल’ उसके स्वरूप—सांसारिक, अनन्त, भौतिक या आत्मिक—को निर्धारित नहीं करता।
- source_word: σοι
  choice: तुम्हें
  rationale: सम्प्रदान कारक सर्वनाम को हिन्दी में क्रिया के स्वाभाविक पूरक ‘तुम्हें’ के रूप में रखा गया है।
theological_decisions:
- issue: ἀποδώσει में ईश्वरीय प्रतिदान का स्वरूप
  choice: तुम्हें प्रतिफल देगा
  alternative: तुम्हें उसका प्रतिदान देगा
  rationale: मुख्य पाठ सकारात्मक ईश्वरीय प्रत्युत्तर को व्यक्त करता है, पर प्रतिफल के समय, प्रकार या स्वरूप को परिभाषित नहीं करता। विकल्प मूल क्रिया के लौटाने अथवा प्रतिदान करने के अधिक औपचारिक अर्थ को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट हिन्दी। ‘गरीबों को दिया हुआ दान’ पारंपरिक लेकिन कम प्रचलित ‘भिक्षादान’ का अर्थ खोलता है। ‘गुप्त’ की पुनरावृत्ति मूल पाठ की शब्दगत कड़ी बनाए रखती है।
