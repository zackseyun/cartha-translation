id: MAT.6.15
reference: Matthew 6:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: hi
  text: पर यदि तुम लोगों को क्षमा नहीं करोगे, तो तुम्हारा पिता भी तुम्हारे अपराधों[a] को क्षमा नहीं करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उल्लंघनों’ अथवा ‘चूकों’।
    reason: παραπτώματα के अर्थ-क्षेत्र में अपराध, उल्लंघन और नैतिक चूक शामिल हैं; मुख्य पाठ में सहज ‘अपराधों’ रखा गया है और अन्य सम्भव अर्थ यहाँ दिए गए हैं।
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: पर यदि ... नहीं
  rationale: ἐὰν शर्त प्रस्तुत करता है, δέ पिछले वचन के विपरीत पक्ष की ओर मोड़ता है, और μή निषेध व्यक्त करता है। आधुनिक हिन्दी में ‘पर यदि ... नहीं’ इस संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: ἀφῆτε / ἀφήσει
  choice: क्षमा नहीं करोगे / क्षमा नहीं करेगा
  rationale: इस प्रसंग में ἀφίημι का अर्थ अपराध को क्षमा करना है। दोनों प्रयोगों में ‘क्षमा’ रखकर यूनानी पाठ की शब्दगत पुनरावृत्ति और दोनों खंडों की समानांतर रचना सुरक्षित रखी गई है।
- source_word: τοῖς ἀνθρώποις
  choice: लोगों को
  rationale: ἄνθρωποι यहाँ सामान्य रूप से मनुष्यों को दर्शाता है, केवल पुरुषों को नहीं। ‘लोगों’ आधुनिक हिन्दी में सहज और लिंग-समावेशी है।
- source_word: οὐδὲ
  choice: तो ... भी ... नहीं
  rationale: οὐδέ पहले नकारात्मक खंड के अनुरूप दूसरे खंड को भी नकारता है। हिन्दी की ‘तो ... भी ... नहीं’ रचना शर्त का परिणाम और समानांतर निषेध दोनों स्पष्ट करती है।
- source_word: ὁ πατὴρ ὑμῶν
  choice: तुम्हारा पिता
  rationale: यूनानी पाठ में केवल ‘तुम्हारा पिता’ है; इस वचन में ‘स्वर्गीय’ विशेषण नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: τὰ παραπτώματα ὑμῶν
  choice: तुम्हारे अपराधों
  rationale: παραπτώματα नैतिक चूक, अपराध या उल्लंघन को सूचित करता है। ‘अपराध’ सामान्य आधुनिक हिन्दी में स्पष्ट है और शब्द का नैतिक भार बनाए रखता है।
theological_decisions:
- issue: मनुष्यों द्वारा क्षमा करने और पिता द्वारा क्षमा किए जाने के बीच शर्त-संबंध
  choice: 'प्रत्यक्ष शर्त को बिना नरम किए रखा गया: यदि तुम क्षमा नहीं करोगे, तो तुम्हारा पिता भी क्षमा नहीं करेगा।'
  alternative: इसे केवल सच्चे विश्वास के प्रमाण, संगति की हानि, या किसी व्यवस्थित धर्मवैज्ञानिक व्याख्या के रूप में स्पष्ट कर देना।
  rationale: यूनानी पाठ सीधा शर्तात्मक कथन करता है। अनुवाद को इस धर्मवैज्ञानिक तनाव को बनाए रखना चाहिए, न कि किसी विशिष्ट सिद्धान्त के अनुसार उसका समाधान पाठ में जोड़ना चाहिए।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तुम’ बहुवचन श्रोताओं के लिए है और पूरे वचन में उसी के अनुरूप ‘तुम्हारा’ रखा गया है। भविष्यकालीन हिन्दी रचना यूनानी शर्त और उसके परिणाम को स्वाभाविक ढंग से व्यक्त करती है।
