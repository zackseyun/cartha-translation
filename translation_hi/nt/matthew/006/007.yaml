source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: hi
  text: और जब तुम प्रार्थना करो[a], तो गैर-यहूदियों[b] के समान खोखले शब्दों का ढेर मत लगाओ, क्योंकि वे समझते हैं कि बहुत बोलने के कारण उनकी सुनी जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बकबक न करो” अथवा “निरर्थक बातें बार-बार न कहो।” यूनानी क्रिया दुर्लभ है और संभवतः सच्ची दोहराई हुई प्रार्थना के बजाय खोखले, यांत्रिक या शब्दबहुल बोलने को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: या “अन्यजातियों” अथवा “मूर्तिपूजकों।” यूनानी शब्द का शाब्दिक संकेत गैर-यहूदी जातियों, अर्थात वाचा-समुदाय से बाहर के लोगों, की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι δὲ
  choice: और जब तुम प्रार्थना करो
  rationale: क्रियाविशेषणात्मक कृदन्त प्रार्थना करने की परिस्थिति बताता है, और δέ पिछले उपदेश से सहज रूप से अगली बात जोड़ता है।
- source_word: μὴ βατταλογήσητε
  choice: खोखली बातें दोहराते न रहो
  rationale: दुर्लभ क्रिया संभवतः निरर्थक, यांत्रिक या शब्दाडंबरपूर्ण बोलने की ओर संकेत करती है। यह अनुवाद केवल पुनरावृत्ति को अपने-आप निषिद्ध ठहराए बिना खोखलेपन और लगातार बोलते रहने—दोनों भावों को व्यक्त करता है।
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: गैर-यहूदियों के समान
  rationale: इस यहूदी संदर्भ में ἐθνικοί वाचा-समुदाय से बाहर की जातियों, अर्थात गैर-यहूदियों, को सूचित करता है। आधुनिक हिन्दी में यह 'अन्यजातियों' से अधिक तुरंत समझ में आता है और 'मूर्तिपूजकों' जितना व्याख्यात्मक नहीं है।
- source_word: δοκοῦσιν
  choice: वे समझते हैं
  rationale: यह उनकी धारणा या मान्यता व्यक्त करता है; 'समझते हैं' स्वाभाविक और स्पष्ट है।
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: बहुत बोलने के कारण
  rationale: πολυλογία अधिक बोलने या शब्दबहुलता को दर्शाता है; कारणसूचक अनुवाद उस गलत आधार को स्पष्ट करता है जिस पर वे सुने जाने की आशा रखते हैं।
- source_word: εἰσακουσθήσονται
  choice: उनकी सुनी जाएगी
  rationale: यह अनुकूलतापूर्वक सुने जाने का निष्क्रिय भाव बनाए रखता है और 'उत्तर मिलेगा' जैसा अधिक प्रबल अर्थ नहीं जोड़ता।
theological_decisions:
- issue: क्या यीशु प्रार्थना में हर प्रकार की पुनरावृत्ति को मना करते हैं या खोखले, यांत्रिक और शब्दबहुल बोलने को
  choice: खोखली बातें दोहराते न रहो
  alternative: बकबक न करो; निरर्थक पुनरावृत्ति न करो
  rationale: दुर्लभ यूनानी क्रिया की अनिश्चित अर्थ-सीमा को ध्यान में रखते हुए यह रूप खाली शब्दाडंबर पर बल देता है, पर हर सच्ची दोहराई हुई प्रार्थना को निषिद्ध घोषित नहीं करता।
- issue: ἐθνικοί की पहचान
  choice: गैर-यहूदी
  alternative: अन्यजाति; मूर्तिपूजक
  rationale: मूल शब्द का प्राथमिक संदर्भ यहूदी वाचा-समुदाय से बाहर के लोग हैं। 'मूर्तिपूजक' धार्मिक अर्थ को अधिक स्पष्ट करता, पर मूल की जातीय-वाचागत व्यापकता को संकुचित कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'गैर-यहूदी' सामान्य पाठक के लिए स्पष्ट है; 'खोखली बातें दोहराते न रहो' दुर्लभ यूनानी क्रिया के खोखलेपन तथा शब्दबहुलता के संयुक्त भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
