id: MAT.6.9
reference: Matthew 6:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: hi
  text: 'इसलिए तुम इस प्रकार प्रार्थना करो: “हे हमारे पिता, जो स्वर्गों में हैं[a], आपका नाम पवित्र माना जाए[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक प्रचलित रूप: “जो स्वर्ग में हैं।” यूनानी में “स्वर्गों” बहुवचन है।'
    reason: lexical_alternative
  - marker: b
    text: 'या, “आपका नाम पवित्र किया जाए।” पारंपरिक भाव: “आपका नाम पवित्र ठहरे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: इस प्रकार
  rationale: यह प्रार्थना के ढंग या नमूने का परिचय देता है; ‘इस प्रकार’ आधुनिक, स्वाभाविक और निर्देशात्मक है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले उपदेश से निष्कर्ष या परिणाम का संबंध दिखाता है और यूनानी संयोजक का बल बनाए रखता है।
- source_word: προσεύχεσθε ὑμεῖς
  choice: तुम ... प्रार्थना करो
  rationale: बहुवचन आज्ञार्थक रूप और स्पष्ट ὑμεῖς को सहज हिन्दी में ‘तुम’ तथा ‘करो’ से व्यक्त किया गया है; इससे यीशु के शिष्यों को दिया गया निर्देश स्पष्ट रहता है।
- source_word: Πάτερ ἡμῶν
  choice: हे हमारे पिता
  rationale: सम्बोधन और सामुदायिक बहुवचन दोनों सुरक्षित हैं। ‘हे’ हिन्दी में प्रत्यक्ष और गरिमापूर्ण सम्बोधन को स्पष्ट करता है।
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: जो स्वर्गों में हैं
  rationale: सापेक्ष भाव को स्पष्ट हिन्दी में व्यक्त करते हुए यूनानी के बहुवचन ‘स्वर्गों’ को बनाए रखा गया है। आदरसूचक ‘हैं’ परमेश्वर के लिए स्वाभाविक मानक हिन्दी है।
- source_word: ἁγιασθήτω
  choice: पवित्र माना जाए
  rationale: यह निष्क्रिय आज्ञार्थक प्रार्थना है। ‘पवित्र माना जाए’ इस निवेदन को सहज आधुनिक हिन्दी में व्यक्त करता है कि परमेश्वर के नाम को पवित्र समझकर उसका वैसा ही आदर किया जाए, और कर्ता को अनिर्दिष्ट रहने देता है।
- source_word: τὸ ὄνομά σου
  choice: आपका नाम
  rationale: मूल शब्द ‘नाम’ को यथावत रखते हुए परमेश्वर के प्रत्यक्ष सम्बोधन के लिए आदरसूचक ‘आपका’ प्रयोग किया गया है।
theological_decisions:
- issue: पिता के सम्बोधन के साथ परमेश्वर की स्वर्गीय महिमा का वर्णन
  choice: हे हमारे पिता, जो स्वर्गों में हैं
  alternative: हे हमारे पिता, जो स्वर्ग में हैं; हे हमारे स्वर्गीय पिता
  rationale: चुना गया पाठ निकटता (‘पिता’) और महिमा/पारलौकिकता (‘स्वर्गों में’) दोनों रखता है तथा यूनानी बहुवचन को एकवचन या विशेषण में नहीं बदलता।
- issue: ἁγιασθήτω के निष्क्रिय निवेदन का अर्थ
  choice: आपका नाम पवित्र माना जाए
  alternative: आपका नाम पवित्र किया जाए; आपका नाम पवित्र ठहरे
  rationale: यह अनुवाद परमेश्वर के नाम की पवित्रता का सम्मान किए जाने की याचना को स्पष्ट करता है। निष्क्रिय रूप बनाए रखने से यह अनावश्यक रूप से तय नहीं किया जाता कि निहित कर्ता मनुष्य हैं, परमेश्वर हैं, या व्यापक रूप से सारी सृष्टि।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज पर गरिमापूर्ण शैली अपनाई गई है। शिष्यों के लिए बहुवचन ‘तुम’ और परमेश्वर के सम्बोधन में आदरसूचक ‘आपका/हैं’ रखा गया है। यूनानी के ‘स्वर्गों’ बहुवचन को मुख्य पाठ में सुरक्षित रखते हुए अधिक प्रचलित हिन्दी रूप को पादटिप्पणी में दिया गया है।
