id: MAT.6.8
reference: Matthew 6:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: hi
  text: इसलिए उनके समान न बनो,[a] क्योंकि तुम्हारा पिता तुम्हारे उससे माँगने से पहले ही जानता है कि तुम्हें किन चीज़ों की ज़रूरत है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “उनके जैसा न बनाया जाओ”; अथवा, “उनके जैसे न हो।”
    reason: ὁμοιωθῆτε के पैसिव रूप और निषेध के संभावित अनुवादों को दर्शाने वाला शब्दार्थ-विकल्प।
lexical_decisions:
- source_word: μὴ οὖν
  choice: इसलिए ... न
  rationale: οὖν पिछले पद में अन्यजातियों की तरह प्रार्थना करने के विरुद्ध चेतावनी से निष्कर्ष जोड़ता है; निषेध को स्वाभाविक हिन्दी वाक्य-रचना में रखा गया है।
- source_word: ὁμοιωθῆτε
  choice: समान न बनो
  rationale: अओरिस्ट पैसिव सब्जंक्टिव निषेध में समानता या उनके ढंग के अनुरूप हो जाने का भाव देता है। ‘समान न बनो’ अर्थ को स्वाभाविक और स्पष्ट रखता है।
- source_word: αὐτοῖς
  choice: उनके
  rationale: सर्वनाम निकटवर्ती संदर्भ में उल्लिखित अन्यजातियों की ओर संकेत करता है; पाठ में संदर्भ को अनावश्यक रूप से दोहराया नहीं गया।
- source_word: οἶδεν
  choice: जानता है
  rationale: οἶδα रूपतः परफेक्ट है, पर यहाँ वर्तमान अर्थ ‘जानता है’ में प्रयुक्त है।
- source_word: ὁ πατὴρ ὑμῶν
  choice: तुम्हारा पिता
  rationale: यूनानी पाठ में केवल ‘तुम्हारा पिता’ है; ‘स्वर्गीय’ जोड़ना स्रोत से अधिक कहना होता।
- source_word: ὧν χρείαν ἔχετε
  choice: तुम्हें किन चीज़ों की ज़रूरत है
  rationale: सम्बन्धवाचक संरचना आवश्यकता की वस्तुओं को व्यक्त करती है। यह हिन्दी में स्पष्ट है और बहुवचन संकेत को बनाए रखती है।
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: उससे माँगने से पहले ही
  rationale: πρὸ τοῦ के साथ infinitive पूर्वकालिकता व्यक्त करता है। ‘पहले ही’ पिता के पहले से जानने पर स्वाभाविक बल देता है, और αὐτόν को हिन्दी के अनुकूल ‘उससे’ कहा गया है।
theological_decisions:
- issue: प्रार्थना के संबंध में पिता का पूर्वज्ञान
  choice: यह सीधा कथन रखा गया है कि पिता शिष्यों की आवश्यकताएँ उनके माँगने से पहले जानता है।
  alternative: यह समझाते हुए भावानुवाद करना कि प्रार्थना सूचना देने के लिए नहीं, बल्कि संबंध के लिए है; अथवा पूर्ण पूर्वज्ञान पर कोई अतिरिक्त सैद्धांतिक बल जोड़ना।
  rationale: पद पिता के पूर्वज्ञान और फिर भी की जाने वाली प्रार्थना के बीच तनाव को स्वयं नहीं समझाता। अनुवाद को किसी अतिरिक्त धर्मसैद्धांतिक निष्कर्ष द्वारा इसे हल नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध। ‘तुम्हारा पिता’ मूल के एकवचन πατήρ और सामूहिक ὑμῶν के अनुरूप रखा गया है।
