id: MAT.6.1
reference: Matthew 6:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: hi
  text: पर सावधान रहो कि अपनी धार्मिकता[a] का आचरण लोगों के सामने इस उद्देश्य से न करो कि वे तुम्हें देखें; नहीं तो तुम्हें अपने पिता से, जो स्वर्गों में है, कोई प्रतिफल नहीं मिलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी धार्मिकता के काम।” कुछ प्राचीन हस्तलिपियों में “अपना दान” पाठ मिलता है।
    reason: मूल पाठ में δικαιοσύνην (‘धार्मिकता’) है, जिसका अर्थ व्यापक हो सकता है; ज्ञात पाठांतर में ἐλεημοσύνην (‘दान’) मिलता है।
lexical_decisions:
- source_word: Προσέχετε
  choice: सावधान रहो
  rationale: वर्तमानकालीन बहुवचन आज्ञा निरंतर सतर्कता का आह्वान करती है; यह स्वाभाविक हिन्दी में चेतावनी का बल बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले उपदेश से संक्रमण के साथ विरोधात्मक चेतावनी प्रस्तुत करता है।
- source_word: δικαιοσύνην
  choice: धार्मिकता के काम
  rationale: मूल पाठ का शब्द व्यापक ‘धार्मिकता’ है, पर ποιεῖν के साथ यहाँ उसका आशय व्यवहार में किए जाने वाले धार्मिक कार्यों से है। यह हिन्दी में स्वाभाविक है और इसे केवल दान देने तक सीमित नहीं करता।
- source_word: μὴ ποιεῖν
  choice: न करो
  rationale: μή सहित infinitive उस आचरण को बताता है जिससे बचना है; हिन्दी में आज्ञा के साथ सरल निषेध स्वाभाविक है।
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: लोगों के सामने
  rationale: ἀνθρώπων सामान्य रूप से मानव दर्शकों को सूचित करता है, केवल पुरुषों को नहीं।
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: लोगों को दिखाने के उद्देश्य से
  rationale: यह उद्देश्यसूचक रचना जानबूझकर सार्वजनिक प्रदर्शन किए जाने का भाव व्यक्त करती है।
- source_word: εἰ δὲ μή γε
  choice: नहीं तो
  rationale: शर्त और उसके परिणाम को आधुनिक हिन्दी में संक्षेप तथा स्वाभाविक रूप से व्यक्त करता है।
- source_word: μισθὸν
  choice: प्रतिफल
  rationale: इस प्रसंग में परमेश्वर की ओर से मिलने वाले परिणाम या पुरस्कार के लिए ‘प्रतिफल’ गरिमापूर्ण और उपयुक्त है।
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: अपने पिता से
  rationale: प्रतिफल के प्रसंग में παρά का स्रोतभाव स्पष्ट करता है कि प्रतिफल पिता से मिलता है।
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: जो स्वर्गों में है
  rationale: बहुवचन τοῖς οὐρανοῖς को बनाए रखता है और मत्ती की अभिव्यक्ति को अनावश्यक रूप से एकवचन नहीं बनाता।
theological_decisions:
- issue: δικαιοσύνην का दायरा
  choice: मुख्य पाठ में व्यापक ‘धार्मिकता के काम,’ केवल दान नहीं
  alternative: धार्मिकता; दान देना
  rationale: SBLGNT में δικαιοσύνην है, जिसका स्वाभाविक दायरा व्यापक है। प्रसंग क्रियात्मक आचरण का है, इसलिए हिन्दी में ‘धार्मिकता के काम’ रखा गया; पाठांतर ‘दान’ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἀνθρώπων का लिंग-संबंधी अर्थ
  choice: लोगों
  alternative: मनुष्यों; पुरुषों
  rationale: यहाँ आशय सामान्य मानव दर्शकों से है, न कि केवल पुरुषों से।
- issue: τοῖς οὐρανοῖς का बहुवचन
  choice: स्वर्गों में
  alternative: स्वर्ग में
  rationale: यूनानी मूल का बहुवचन और मत्ती की विशिष्ट अभिव्यक्ति सुरक्षित रहती है, बिना कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष जोड़े।
- issue: मानवीय प्रदर्शन और पिता से प्रतिफल का संबंध
  choice: चेतावनी को उद्देश्य पर केंद्रित रखा गया
  alternative: हर सार्वजनिक धार्मिक कार्य का निषेध
  rationale: πρὸς τὸ θεαθῆναι उद्देश्य बताता है; पद सार्वजनिक दृश्यता को अपने आप निषिद्ध नहीं करता, बल्कि लोगों को दिखाने के लिए किए गए आचरण को निषिद्ध करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन है। भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘धार्मिकता के काम’ व्यापक अर्थ को व्यवहारिक प्रसंग से जोड़ता है; ‘स्वर्गों’ मूल के बहुवचन को बनाए रखता है।
