id: MAT.6.2
reference: Matthew 6:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: hi
  text: इसलिए, जब भी तुम दान दो[a], तो अपने आगे[e] तुरही मत बजाओ[b], जैसे कपटी लोग यहूदी सभागृहों और गलियों में करते हैं, ताकि लोग उनकी महिमा करें[c]। मैं तुमसे सच कहता हूँ, वे अपना पूरा प्रतिफल पा चुके हैं[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ज़रूरतमंदों को दो’ अथवा ‘दया के काम करो।’ यूनानी अभिव्यक्ति विशेष रूप से ज़रूरतमंदों के लिए किए जाने वाले दान को सूचित करती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तुरही बजाकर इसकी घोषणा मत करो।’ मूल यूनानी में शाब्दिक रूप से ‘तुरही मत बजाओ’ है; यह कथन अतिशयोक्तिपूर्ण या रूपकात्मक हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘ताकि लोग उनकी प्रशंसा करें’ अथवा ‘उनका आदर करें।’ यूनानी क्रिया का शाब्दिक अर्थ ‘महिमा करना’ है।
    reason: lexical_alternative
  - marker: d
    text: '‘पूरा प्रतिफल पा चुके हैं’ एक व्यावसायिक मुहावरे का भाव व्यक्त करता है: उन्हें वह सारा प्रतिफल मिल चुका है जो उन्हें मिलने वाला है।'
    reason: cultural_note
  - marker: e
    text: शाब्दिक रूप से ‘अपने सामने’ या ‘अपने आगे’।
    reason: previous_rendering
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: इसलिए, जब भी
  rationale: Ὅταν के अनिश्चित और सामान्य समय-बोध को ‘जब भी’ व्यक्त करता है; ‘इसलिए’ οὖν द्वारा पिछले कथन से जुड़े निष्कर्ष या क्रम को बनाए रखता है।
- source_word: ποιῇς ἐλεημοσύνην
  choice: दान दो
  rationale: यह यूनानी मुहावरा ज़रूरतमंदों की सहायता के लिए किए जाने वाले दान को दर्शाता है। ‘दान दो’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है; पादटिप्पणी इसका विशेष आशय स्पष्ट करती है।
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: अपने आगे तुरही मत बजाओ
  rationale: मूल पाठ की सजीव और संभवतः अतिशयोक्तिपूर्ण छवि को व्याख्यात्मक भावार्थ में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: ὑποκριταὶ
  choice: कपटी लोग
  rationale: यह उन लोगों को सूचित करता है जो धार्मिकता का दिखावा करते हैं। ‘कपटी लोग’ प्रचलित, स्पष्ट और प्रसंगानुकूल है।
- source_word: συναγωγαῖς
  choice: यहूदी सभागृहों
  rationale: सिर्फ ‘सभागृह’ आधुनिक पाठक को अस्पष्ट लग सकता है; ‘यहूदी सभागृह’ ऐतिहासिक स्थान को स्पष्ट रूप से पहचानता है।
- source_word: ῥύμαις
  choice: गलियों
  rationale: शब्द गलियों या सड़कों को सूचित कर सकता है; इस सार्वजनिक प्रदर्शन के प्रसंग में ‘गलियों’ स्वाभाविक है।
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: ताकि लोग उनकी महिमा करें
  rationale: ‘ताकि’ उद्देश्य को व्यक्त करता है और ‘महिमा करें’ δοξάζω की प्रबल शब्दावली को बनाए रखता है। ἀνθρώπων यहाँ सभी मनुष्यों के लिए सामान्य अर्थ में है, इसलिए ‘लोग’ चुना गया है।
- source_word: ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यह हिन्दी में स्वाभाविक रहते हुए यीशु की गंभीर और अधिकारपूर्ण घोषणा का बल बनाए रखता है।
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: वे अपना पूरा प्रतिफल पा चुके हैं
  rationale: ἀπέχουσιν में व्यावसायिक मुहावरे का भाव है कि पूरा भुगतान मिल चुका है; ‘पूरा ... पा चुके हैं’ उसी पूर्णता को स्पष्ट करता है।
theological_decisions:
- issue: δοξασθῶσιν की प्रबलता
  choice: लोग उनकी महिमा करें
  alternative: लोग उनकी प्रशंसा करें
  rationale: ‘प्रशंसा’ प्रसंग का सहज भाव है, पर ‘महिमा करें’ मूल क्रिया की अधिक प्रबल भाषा और मनुष्यों से मिलने वाली प्रतिष्ठा तथा परमेश्वर के प्रतिफल के बीच निहित तनाव को बनाए रखता है।
- issue: ἀνθρώπων का सामान्य मानवीय अर्थ
  choice: लोग
  alternative: मनुष्य
  rationale: यहाँ शब्द केवल पुरुषों को नहीं, सामान्य रूप से देखने वाले लोगों को सूचित करता है; ‘लोग’ वर्तमान हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- issue: प्रतिफल की पूर्ण प्राप्ति
  choice: अपना पूरा प्रतिफल पा चुके हैं
  alternative: अपना प्रतिफल पाते हैं
  rationale: मूल क्रिया के व्यावसायिक मुहावरे में पूरा हिसाब चुक जाने का अर्थ है। यह अनुवाद आगे किसी अतिरिक्त प्रतिफल के न मिलने का संकेत देता है, पर उसे व्याख्यात्मक रूप से नहीं बढ़ाता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और साधारण पाठक के लिए स्पष्ट रखी गई है। ‘यहूदी सभागृह’ ऐतिहासिक संदर्भ स्पष्ट करता है; ‘प्रतिफल’ नैतिक और धार्मिक प्रसंग में ‘मज़दूरी’ या ‘भुगतान’ से अधिक उपयुक्त है। मूल की तुरही वाली सजीव छवि और ‘महिमा’ की प्रबल भाषा को जानबूझकर बनाए रखा गया है।
