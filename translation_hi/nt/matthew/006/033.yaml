id: MAT.6.33
reference: Matthew 6:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: hi
  text: पर पहले उसके राज्य और उसकी धार्मिकता[a] की खोज में लगे रहो, और ये सब वस्तुएँ भी तुम्हें दे दी जाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय।” यूनानी शब्द का अर्थ धार्मिकता या न्याय हो सकता है। यहाँ “धार्मिकता” रखा गया है, क्योंकि प्रसंग में केवल न्यायिक या सामाजिक न्याय नहीं, बल्कि परमेश्वर के सामने सही संबंध और उसके अनुरूप आचरण भी सम्मिलित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: खोज में लगे रहो
  rationale: वर्तमानकालीन बहुवचन आज्ञार्थक सक्रिय और निरंतर प्रयत्न का संकेत देता है। ‘खोज में लगे रहो’ आधुनिक हिन्दी में इस जारी रहने वाले निर्देश को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले प्रसंग में भौतिक आवश्यकताओं की चिंता के विपरीत दिशा की ओर मोड़ दिखाता है; इसलिए विरोधसूचक ‘पर’ उपयुक्त है।
- source_word: πρῶτον
  choice: पहले
  rationale: यह प्राथमिकता का सीधा और संक्षिप्त अर्थ बनाए रखता है।
- source_word: βασιλείαν
  choice: राज्य
  rationale: मत्ती में यह स्थापित बाइबलीय पद है और परमेश्वर के राजकीय शासन तथा उसके अधीन क्षेत्र—दोनों अर्थों को समेट सकता है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यह परमेश्वर की इच्छा के अनुरूप सही स्थिति और आचरण की व्यापकता बनाए रखता है; केवल सामाजिक या न्यायिक अर्थ तक सीमित नहीं करता।
- source_word: αὐτοῦ
  choice: उसके / उसकी
  rationale: यूनानी सर्वनाम को सर्वनाम ही रखा गया है। प्रसंग में इसका संदर्भ परमेश्वर से है, पर मुख्य पाठ में अनावश्यक स्पष्टीकरण नहीं जोड़ा गया।
- source_word: ταῦτα πάντα
  choice: ये सब वस्तुएँ
  rationale: यह निकटवर्ती प्रसंग में भोजन, पेय और वस्त्र जैसी आवश्यक वस्तुओं की ओर संकेत करता है तथा संकेतवाचक बल को बनाए रखता है।
- source_word: προστεθήσεται
  choice: भी ... दे दी जाएँगी
  rationale: यूनानी भविष्यत् कर्मवाच्य का भाव है कि प्राथमिक खोज के अतिरिक्त ये वस्तुएँ प्राप्त होंगी। शाब्दिक ‘जोड़ दी जाएँगी’ की अपेक्षा यह हिन्दी में अधिक स्वाभाविक है, जबकि ‘भी’ अतिरिक्त प्राप्ति का अर्थ बनाए रखता है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: बहुवचन संबोधन के चतुर्थी अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: δικαιοσύνην का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: इस प्रसंग में शब्द परमेश्वर की इच्छा के अनुरूप सही संबंध और आचरण को व्यापक रूप से समेटता है। ‘न्याय’ एक वास्तविक अर्थ-विकल्प है, पर अकेले उससे आशय सामाजिक या न्यायिक न्याय तक संकुचित हो सकता है; इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: αὐτοῦ का संदर्भ
  choice: उसके / उसकी
  alternative: परमेश्वर के / परमेश्वर की
  rationale: मूल पाठ के सर्वनाम और उसकी संक्षिप्तता को बनाए रखा गया है। प्रसंग इसका संदर्भ परमेश्वर या पिता के रूप में स्पष्ट करता है।
- issue: प्राप्त होने वाली वस्तुओं का दाता
  choice: दे दी जाएँगी
  alternative: परमेश्वर तुम्हें देगा
  rationale: यूनानी में कर्ता व्यक्त किए बिना कर्मवाच्य है। हिन्दी कर्मवाच्य उसी संयम को बनाए रखता है और परमेश्वर को स्पष्ट कर्ता बनाकर मूल से अधिक नहीं कहता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘खोज में लगे रहो’ निरंतर आज्ञा का भाव देता है; ‘दे दी जाएँगी’ शाब्दिक ‘जोड़ दी जाएँगी’ से अधिक स्वाभाविक है और कर्मवाच्य को सुरक्षित रखता है।
