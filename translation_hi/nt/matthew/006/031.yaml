  verdict: revise
  source_fidelity: The three deliberative questions and the inferential ‘इसलिए’ are accurately represented. However, ‘और यह न कहो’ turns the Greek participle λέγοντες (‘saying’) into a separate prohibition against speaking, whereas it qualifies the command not to worry. The participial relation should be retained.
  naturalness: The draft is clear modern Hindi. Recasting the participle as ‘यह कहते हुए’ is both natural enough in a formal biblical register and more faithful to the source syntax.
  terminology: ‘चिंता’ is an appropriate modern Hindi rendering of μεριμνάω in this context. The footnote’s ‘व्याकुल न हो’ is a valid lexical alternative, though plural address is preferable because the Greek verb is plural.
  issues:
  - severity: medium
    issue: λέγοντες is rendered as an independent command (‘और यह न कहो’).
    rationale: The source says not to worry while/saying these things; it does not separately prohibit saying the questions. The Hindi should preserve this dependent participial relationship.
