id: MAT.6.31
reference: Matthew 6:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: hi
  text: 'इसलिए यह कहते हुए चिंता मत करो[a]: ‘हम क्या खाएँगे?’ या ‘हम क्या पिएँगे?’ या ‘हम क्या पहनेंगे?’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “व्याकुल न हो।”
    reason: μεριμνάω चिंता या व्याकुलता दोनों का भाव दे सकता है; यह विकल्प उस भावात्मक तीव्रता को स्पष्ट करता है।
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: इसलिए चिंता न करो
  rationale: οὖν पिछले तर्क से निकले निष्कर्ष को दिखाता है, इसलिए इसे ‘इसलिए’ से व्यक्त किया गया है। μεριμνάω यहाँ भौतिक आवश्यकताओं को लेकर व्याकुल चिंता के अर्थ में है; ‘चिंता न करो’ आधुनिक हिन्दी में स्वाभाविक है और निषेध का बल बनाए रखता है।
- source_word: λέγοντες
  choice: और यह न कहो
  rationale: यूनानी कृदन्त चिंता के साथ जुड़े कथन या उसकी अभिव्यक्ति को बताता है। हिन्दी में ‘और यह न कहो’ तीन सीधे प्रश्नों से स्वाभाविक संबंध बनाता है, बिना अर्थ को अनावश्यक रूप से विस्तार दिए।
- source_word: Τί
  choice: क्या
  rationale: तीनों प्रत्यक्ष प्रश्नों में τί का सरल और स्वाभाविक हिन्दी समतुल्य ‘क्या’ है।
- source_word: φάγωμεν
  choice: हम क्या खाएँगे
  rationale: यह भावी आवश्यकताओं के विषय में विचारात्मक प्रश्न है। ‘खाएँगे’ आधुनिक हिन्दी में भविष्य की व्यवस्था को लेकर चिंता स्वाभाविक रूप से व्यक्त करता है।
- source_word: πίωμεν
  choice: हम क्या पिएँगे
  rationale: φάγωμεν के समानांतर यह भविष्य में पीने की वस्तु की व्यवस्था के विषय में प्रश्न है; ‘पिएँगे’ स्वाभाविक हिन्दी रूप है।
- source_word: περιβαλώμεθα
  choice: हम क्या पहनेंगे
  rationale: περιβάλλω यहाँ अपने ऊपर वस्त्र डालने अर्थात पहनने के अर्थ में है। ‘क्या पहनेंगे?’ शाब्दिक आत्मवाचक अभिव्यक्ति की अपेक्षा अधिक स्वाभाविक है।
- source_word: ἤ ... ἤ ... ἤ
  choice: या ... या ... या
  rationale: बार-बार आए विकल्पसूचक संयोजक को सुरक्षित रखा गया है, जिससे भोजन, पेय और वस्त्र के तीन प्रश्नों की समानांतर संरचना बनी रहती है।
theological_decisions:
- issue: भौतिक आवश्यकताओं के विषय में यीशु के निषेध का स्वरूप
  choice: μεριμνήσητε को व्याकुल चिंता के निषेध के रूप में प्रस्तुत किया गया है, न कि विवेकपूर्ण योजना बनाने के पूर्ण निषेध के रूप में।
  alternative: ‘किसी प्रकार की परवाह न करो’
  rationale: निकटवर्ती प्रसंग जीवन की आवश्यकताओं की व्यवस्था को लेकर चिंता की बात करता है। ‘चिंता न करो’ पाठ के निषेध को बनाए रखता है, पर उससे आगे बढ़कर जिम्मेदार दूरदर्शिता को निषिद्ध नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सीधी और गरिमापूर्ण शैली। ‘हम क्या ...?’ की पुनरावृत्ति मूल की त्रिस्तरीय प्रश्न-संरचना को सुरक्षित रखती है।
