id: MAT.24.20
reference: Matthew 24:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: hi
  text: पर प्रार्थना करते रहो कि तुम्हें सर्दियों में या किसी सब्त के दिन[a] भागना न पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब्त के दिन।”
    reason: यूनानी के बिना उपपद वाले σαββάτῳ का निश्चित अर्थ भी सम्भव है।
lexical_decisions:
- source_word: προσεύχεσθε
  choice: प्रार्थना करते रहो
  rationale: वर्तमानकालीन बहुवचन आज्ञार्थक रूप निरंतर प्रार्थना का भाव दे सकता है; आधुनिक हिन्दी में ‘करते रहो’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन से हल्का विरोध या नया मोड़ दिखाता है; ‘पर’ संक्षिप्त और स्वाभाविक है।
- source_word: ἵνα μὴ γένηται
  choice: कि ... न पड़े
  rationale: प्रार्थना की विषय-वस्तु बताने वाले ἵνα और निषेध को हिन्दी में ‘कि ... न पड़े’ स्वाभाविक रूप से व्यक्त करता है, और घटना के घटित होने का भाव बनाए रखता है।
- source_word: ἡ φυγὴ ὑμῶν
  choice: तुम्हें ... भागना
  rationale: φυγή संकट के समय भागने की क्रिया को दर्शाता है। हिन्दी में क्रियात्मक रचना अधिक स्वाभाविक है और इसे सफल ‘बच निकलना’ मानकर अर्थ नहीं बढ़ाती।
- source_word: χειμῶνος
  choice: सर्दियों में
  rationale: ऋतु-सूचक संबंधकारक को सामान्य आधुनिक हिन्दी में ‘सर्दियों में’ कहा जाता है।
- source_word: μηδὲ σαββάτῳ
  choice: या किसी सब्त के दिन
  rationale: μηδέ दूसरी निषिद्ध परिस्थिति जोड़ता है। अनिर्दिष्ट σαββάτῳ का रूप ‘किसी सब्त के दिन’ से स्पष्ट होता है, जबकि निश्चित अर्थ की सम्भावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: σαββάτῳ को निश्चित या अनिश्चित रूप में प्रस्तुत करना
  choice: किसी सब्त के दिन
  alternative: सब्त के दिन
  rationale: यूनानी में यहाँ निश्चित उपपद नहीं है। मुख्य पाठ में अनिश्चित रूप रखना स्रोत की बनावट को दर्शाता है; फिर भी यूनानी में उपपद का अभाव हमेशा अनिश्चितता सिद्ध नहीं करता, इसलिए पारंपरिक निश्चित अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्रार्थना करते रहो’ वर्तमान आज्ञार्थक की सम्भावित निरंतरता व्यक्त करता है; ‘भागना न पड़े’ हिन्दी में संकटवश पलायन की अनचाही आवश्यकता को स्वाभाविक ढंग से सामने लाता है।
