id: MAT.24.48
reference: Matthew 24:48
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: hi
  text: पर यदि वह दुष्ट सेवक[a] अपने मन में कहे, ‘मेरे स्वामी[b] देर कर रहे हैं,’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दास।’ यूनानी शब्द δοῦλος सन्दर्भ के अनुसार ‘सेवक’ या ‘दास’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘प्रभु।’ यहाँ ‘स्वामी’ घराने के दृष्टान्त की स्थिति को दर्शाता है; यूनानी शब्द κύριος है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: पर यदि
  rationale: ἐὰν के साथ विधिलिंग एक संभावित शर्त प्रस्तुत करता है और δέ हल्का विरोध या आगे बढ़ने का भाव देता है; ‘पर यदि’ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἴπῃ
  choice: कहे
  rationale: ἐὰν के बाद आया अओरिस्ट सब्जंक्टिव हिन्दी में संभाव्य शर्त के अनुरूप ‘यदि ... कहे’ से सहज और सटीक रूप में व्यक्त होता है।
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: वह दुष्ट सेवक
  rationale: κακός नैतिक बुराई को दर्शाता है, इसलिए ‘दुष्ट’ उपयुक्त है; δοῦλος के लिए घरेलू दृष्टान्त में सौंपी गई सेवा की भूमिका प्रमुख होने से ‘सेवक’ चुना गया है, जबकि ‘दास’ की सम्भावना पादटिप्पणी में रखी गई है; ἐκεῖνος का संकेत ‘वह’ से सुरक्षित है।
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: अपने मन में
  rationale: यूनानी मुहावरा भीतरी विचार या स्वयं से कही बात को दर्शाता है। हिन्दी में ‘अपने मन में’ प्राकृतिक है और आन्तरिक विचार का आशय बनाए रखता है।
- source_word: Χρονίζει
  choice: देर कर रहे हैं
  rationale: वर्तमान काल चल रही या अनुभव की जा रही देरी बताता है; ‘देर कर रहे हैं’ उस निरन्तरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μου ὁ κύριος
  choice: मेरे स्वामी
  rationale: घराने के दृष्टान्त में κύριος सेवक के अधिकारी को दर्शाता है। ‘स्वामी’ इस सम्बन्ध को स्पष्ट करता है और हिन्दी में आदरसूचक बहुवचन क्रिया के साथ स्वाभाविक है।
theological_decisions:
- issue: घराने के दृष्टान्त में κύριος का अनुवाद
  choice: स्वामी
  alternative: प्रभु
  rationale: तात्कालिक कथा-स्तर पर यह घर के सेवक के अधिकारी के लिए प्रयुक्त है, इसलिए ‘स्वामी’ उपयुक्त है। व्यापक सन्दर्भ में मसीही संकेत सम्भव है, पर अनुवाद उसे स्पष्ट करके पाठ की परतों को नहीं मिलाता; ‘प्रभु’ पादटिप्पणी में सुरक्षित है।
- issue: इस पद में δοῦλος का अनुवाद
  choice: सेवक
  alternative: दास
  rationale: दृष्टान्त में सौंपी गई घरेलू जिम्मेदारी और आचरण पर बल है, इसलिए ‘सेवक’ सहज है। फिर भी δοῦλος की दासत्व-सूचक lexical सीमा वास्तविक है और पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘अपने मन में’ हिन्दी का स्वाभाविक आन्तरिक-विचार मुहावरा है। ‘स्वामी ... कर रहे हैं’ आदरसूचक व्याकरण को बनाए रखता है।
