  text: ἀμὴν λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: hi
  text: मैं तुमसे सच कहता हूँ कि वह उसे अपनी सारी संपत्ति पर नियुक्त करेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी हर एक वस्तु पर।’
    reason: τοῖς ὑπάρχουσιν αὐτοῦ का अधिक शब्दशः वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ἀμὴν
  choice: सच
  rationale: यह यीशु की गंभीर और अधिकारपूर्ण घोषणा का सूत्र है। हिंदी में ‘सच कहता हूँ’ स्वाभाविक है और एकल ἀμὴν का भाव ठीक व्यक्त करता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: यह यूनानी वाक्यांश का सीधा और हिंदी में स्वाभाविक रूप है; ‘तुमसे’ बहुवचन श्रोताओं को संबोधित करता है।
- source_word: ὅτι
  choice: कि
  rationale: यह आगे आने वाली कथन-वस्तु को स्पष्ट रूप से प्रस्तुत करता है।
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: अपनी सारी संपत्ति पर
  rationale: ἐπί के साथ यह अधिकार और देखरेख का क्षेत्र बताता है, जबकि τοῖς ὑπάρχουσιν αὐτοῦ स्वामी की सभी वस्तुओं या संपत्ति को सूचित करता है।
- source_word: καταστήσει
  choice: नियुक्त करेगा
  rationale: संदर्भ में क्रिया किसी पद और व्यापक जिम्मेदारी पर ठहराने या नियुक्त करने का अर्थ देती है, न कि केवल भौतिक रूप से रखने का।
- source_word: αὐτόν
  choice: उसे
  rationale: यह पिछले संदर्भ के विश्वासयोग्य और बुद्धिमान दास को दर्शाने वाला पुल्लिंग एकवचन सर्वनाम है।
theological_decisions:
- issue: स्वामी द्वारा दिए जाने वाले प्रतिफल या दायित्व का स्वरूप
  choice: दृष्टांत के सीधे अर्थ के अनुसार दास को स्वामी की सारी संपत्ति पर नियुक्त किया जाना
  alternative: इसे कलीसियाई अधिकार या अंत-समय के स्वर्गीय प्रतिफल के रूप में स्पष्ट करना
  rationale: पद व्यापक प्रबंधकीय दायित्व दिए जाने की बात कहता है। अनुवाद में इससे आगे कोई विशिष्ट कलीसियाई या युगांत-संबंधी व्याख्या आरोपित नहीं की गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘मैं तुमसे सच कहता हूँ’ यीशु की सूत्रबद्ध गंभीर घोषणा को बनाए रखता है; ‘नियुक्त करेगा’ प्रशासनिक जिम्मेदारी के भाव को स्पष्ट करता है।
