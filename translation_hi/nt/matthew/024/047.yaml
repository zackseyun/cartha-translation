  source_fidelity: Greek ἀμὴν λέγω ὑμῖν is accurately conveyed by “मैं तुमसे सच कहता हूँ,” retaining the solemn first-person declaration and plural addressees. The future καταστήσει is correctly rendered “नियुक्त करेगा,” and “उसे” faithfully represents the masculine singular object αὐτόν without adding interpretation. “अपनी सारी संपत्ति पर” accurately conveys appointment over all the master's possessions (ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ).
  naturalness: The sentence is fluent, clear, and idiomatic in modern standard Hindi. “संपत्ति पर नियुक्त करेगा” naturally communicates appointment to oversight/responsibility over possessions.
  terminology: “सच कहता हूँ” suitably renders the Synoptic solemn formula; “नियुक्त करेगा” preserves the administrative sense of καθίστημι. The wording does not introduce ecclesial or eschatological interpretation.
