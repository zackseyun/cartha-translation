revisions:
- from: और जब तक जलप्रलय आकर उन सबको बहा न ले गया, तब तक उन्हें पता ही न चला। मनुष्य के पुत्र का आगमन भी ऐसा ही होगा।
  to: और उन्हें पता नहीं चला, जब तक जलप्रलय आया और उन सबको बहा ले गया। मनुष्य के पुत्र का आगमन भी इसी प्रकार होगा।
  rationale: 'The revision resolves the potentially misleading negative syntax in the first clause while preserving the source sequence: they did not know; the flood came; it carried all away. It keeps the comparison and the future reference to the Son of Man’s coming without interpretive additions.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:43:13Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the flood, its coming, and its carrying everyone away, as well as the comparison with the Son of Man's coming. However, the construction “जब तक ... बहा न ले गया” is potentially read as negative (‘until it did not sweep them away’) rather than as the completed event expressed by ἦλθεν ... καὶ ἦρεν. The revision states the two aorist events affirmatively.
  naturalness: “उन्हें पता ही न चला” is understandable, but “उन्हें पता नहीं चला” is more neutral and directly reflects οὐκ ἔγνωσαν. “इसी प्रकार” is a natural, formal Hindi rendering of οὕτως.
  terminology: “जलप्रलय,” “मनुष्य का पुत्र,” and “आगमन” are appropriate modern standard Hindi renderings. No doctrinal expansion, such as ‘second coming,’ is introduced.
  issues:
  - severity: medium
    issue: Negative form in the temporal clause
    rationale: “जलप्रलय आकर उन सबको बहा न ले गया” can grammatically suggest that the flood did not sweep them away. The Greek affirmatively says that the flood came and took/carried them all away; Hindi should make this event unambiguously affirmative.
  - severity: low
    issue: Added emphatic particle “ही”
    rationale: “ही” adds emphasis not explicitly present in οὐκ ἔγνωσαν. Omitting it retains the source’s neutral statement without loss.
  revised_text: और उन्हें पता नहीं चला, जब तक जलप्रलय आया और उन सबको बहा ले गया। मनुष्य के पुत्र का आगमन भी इसी प्रकार होगा।
  revised_footnotes: []
  revision_rationale: 'The revision resolves the potentially misleading negative syntax in the first clause while preserving the source sequence: they did not know; the flood came; it carried all away. It keeps the comparison and the future reference to the Son of Man’s coming without interpretive additions.'
