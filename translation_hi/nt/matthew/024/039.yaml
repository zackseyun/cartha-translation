id: MAT.24.39
reference: Matthew 24:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: hi
  text: और उन्हें पता नहीं चला, जब तक जलप्रलय आया और उन सबको बहा ले गया। मनुष्य के पुत्र का आगमन भी इसी प्रकार होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: उन्हें पता ही न चला
  rationale: संदर्भ में यह सामान्य बोध या चेतना की कमी व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक है और यूनानी वाक्य के आशय को बिना अतिरिक्त व्याख्या के रखता है।
- source_word: κατακλυσμός
  choice: जलप्रलय
  rationale: नोह के समय की विनाशकारी बाढ़ के लिए प्रचलित, संक्षिप्त और गरिमापूर्ण हिन्दी शब्द।
- source_word: ἦρεν ἅπαντας
  choice: उन सबको बहा न ले गया
  rationale: ἦρεν का मूल अर्थ ‘ले गया’ है; जलप्रलय के कर्ता होने के कारण ‘बहा ले गया’ प्रसंगानुकूल है और विनाश के परिणाम को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: παρουσία
  choice: आगमन
  rationale: यहाँ मनुष्य के पुत्र के भविष्य के आने/उपस्थित होने को सूचित करता है; ‘आगमन’ आधुनिक धार्मिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की इस विशिष्ट उपाधि का स्थापित और औपचारिक रूप, जो स्रोत की संरचना सुरक्षित रखता है।
- source_word: οὕτως ... καί
  choice: भी ऐसा ही
  rationale: तुलना और καί के ‘भी’ दोनों को स्वाभाविक हिन्दी क्रम में व्यक्त करता है।
theological_decisions:
- issue: जलप्रलय द्वारा ‘ले जाए जाने’ का अर्थ
  choice: ‘बहा ले गया’ रखा गया, बिना यह बताए कि उनका अंतिम न्याय या गंतव्य क्या था
  alternative: ‘नष्ट कर दिया’
  rationale: स्रोत क्रिया ἦρεν ‘ले गया’ कहती है; ‘नष्ट कर दिया’ संभावित आशय को स्पष्ट तो करता, पर मूल से अधिक निर्णायक होता।
- issue: παρουσία की व्याख्या
  choice: ‘आगमन’
  alternative: ‘दूसरा आगमन’
  rationale: पद में ‘दूसरा’ नहीं है; उसे जोड़ना धर्मवैज्ञानिक व्याख्या को अनुवाद में आयात करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। पहले खंड को हिन्दी की स्वाभाविक ‘जब तक…तब तक’ रचना में बदला गया है; कोई पादटिप्पणी आवश्यक नहीं मानी गई।
