id: MAT.24.22
reference: Matthew 24:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: hi
  text: और यदि वे दिन घटा न दिए गए होते[a], तो कोई भी मनुष्य बचाया न जाता[b]; पर चुने हुओं की खातिर वे दिन घटा दिए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कम न कर दिए गए होते … कम कर दिए जाएँगे।” यूनानी क्रिया दिनों की अवधि घटाने या उन्हें छोटा कर देने, दोनों ढंग से व्यक्त की जा सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “कोई भी देह।” यह बाइबलीय मुहावरा यहाँ किसी भी मनुष्य, अर्थात जीवित किसी भी व्यक्ति, के लिए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: घटा न दिए गए होते / घटा दिए जाएँगे
  rationale: κολοβόω दिनों की अवधि कम या सीमित कर दिए जाने का भाव देता है। “घटा देना” आधुनिक हिन्दी में स्वाभाविक है और केवल सामान्य रूप से “छोटा करना” कहने की अपेक्षा समयावधि कम किए जाने को अधिक स्पष्ट करता है।
- source_word: οὐκ ἂν ἐσώθη
  choice: बचाया न जाता
  rationale: यह रचना एक अवास्तविक परिणाम व्यक्त करती है। “बचाया न जाता” यूनानी के कर्मवाच्य रूप और σῴζω के ‘बचाना/उद्धार करना’ अर्थ-संबंध को बनाए रखता है, जबकि संदर्भ में जीवन की रक्षा का तात्कालिक भाव भी खुला रहता है।
- source_word: πᾶσα σάρξ
  choice: कोई भी मनुष्य
  rationale: नकारात्मक वाक्य में πᾶσα σάρξ का आशय ‘एक भी मनुष्य नहीं’ है। शाब्दिक “कोई भी देह” आधुनिक हिन्दी में भ्रामक और अस्वाभाविक होगा; “कोई भी मनुष्य” बाइबलीय मुहावरे का आशय स्पष्ट करता है।
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: पर चुने हुओं की खातिर
  rationale: διά और कर्मकारक यहाँ कारण अथवा हित का भाव देता है। “की खातिर” लाभार्थक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, और “चुने हुए” ἐκλεκτοί को बिना किसी विशिष्ट साम्प्रदायिक पहचान जोड़े सुरक्षित रखता है।
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: वे दिन
  rationale: यह सरल संकेतवाचक पदबंध है; “वे दिन” उसके संदर्भ-सूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: καὶ εἰ μὴ
  choice: और यदि ... न
  rationale: यह अनुवाद यूनानी के समन्वित सशर्त वाक्य-विन्यास को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: अन्त-समय संबंधी उपदेश में “चुने हुओं” की पहचान
  choice: “चुने हुओं” पद को बिना व्याख्यात्मक विस्तार के रखा गया।
  alternative: परमेश्वर के चुने हुए लोग; विश्वासी; विश्वासयोग्य बचे हुए लोग
  rationale: यह पद समूह की सम्पूर्ण धर्मवैज्ञानिक पहचान निर्धारित नहीं करता। इसलिए अनुवाद इस्राएल, कलीसिया या किसी शेष समुदाय के पक्ष में विवाद को चुपचाप तय नहीं करता।
- issue: इस संदर्भ में σῴζω का अर्थ
  choice: “बचाया न जाता” रखा गया, जिससे संदर्भगत शारीरिक रक्षा और क्रिया का व्यापक अर्थ दोनों बने रहें।
  alternative: जीवित न बचता; जीवित न रखा जाता; उद्धार न पाता
  rationale: विपत्ति का संदर्भ जीवन बचने की ओर संकेत करता है, पर केवल “जीवित न बचता” अर्थ को कुछ अधिक संकीर्ण कर देता और “उद्धार न पाता” हिन्दी में केवल आत्मिक उद्धार का आभास दे सकता था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “चुने हुओं” पारंपरिक धर्मवैज्ञानिक पद की पहचान बनाए रखता है, पर उसकी व्याख्या नहीं थोपता। अर्धविराम मूल वाक्य के विपरीत भागों को स्पष्ट करता है।
