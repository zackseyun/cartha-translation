  text: the master of that servant will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: hi
  text: उस दास[b] का मालिक[a] ऐसे दिन आएगा जिस दिन वह उसके आने की आशा नहीं करता, और ऐसी घड़ी में जिसे वह नहीं जानता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस दास का स्वामी।’ यूनानी κύριος का अर्थ ‘प्रभु,’ ‘स्वामी’ या ‘मालिक’ हो सकता है; यहाँ यह दृष्टांत में मानवीय अधिकारी के लिए प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सेवक।’ यूनानी δοῦλος ऐसे व्यक्ति को दर्शाता है जो बंधी हुई अधीन सेवा में हो; यहाँ मालिक-दास का संबंध स्पष्ट होने के कारण ‘दास’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: आएगा
  rationale: भविष्यकालीन क्रिया आगमन को व्यक्त करती है; ‘आएगा’ सहज है और मालिक की अनपेक्षित वापसी के प्रसंग के अनुकूल है।
- source_word: κύριος
  choice: मालिक
  rationale: यहाँ शब्द दृष्टांत के भीतर दास पर अधिकार रखनेवाले मानवीय स्वामी को सूचित करता है। ‘मालिक’ उस सामाजिक संबंध को स्पष्ट करता है और इसे सीधे ईश्वरीय उपाधि मान लेने से बचाता है।
- source_word: δοῦλος
  choice: दास
  rationale: यह शब्द बंधी हुई अधीन सेवा की स्थिति दर्शाता है। ‘दास’ आधुनिक हिन्दी में उस संबंध को ‘सेवक’ से अधिक स्पष्ट रूप से बनाए रखता है।
- source_word: ἐκείνου
  choice: उस
  rationale: निर्देशक सर्वनाम पहले से उल्लिखित विशेष दास की ओर संकेत करता है; हिन्दी में ‘उस’ स्वाभाविक और पर्याप्त है।
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: ऐसे दिन, जिस दिन वह उसके आने की आशा नहीं कर रहा होगा
  rationale: यह अनिश्चित समय और दास की अपेक्षा न होने, दोनों को सहज हिन्दी में व्यक्त करता है। ‘उसके आने की’ क्रिया के प्रसंगगत, निहित कर्म को स्पष्ट करती है।
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: ऐसी घड़ी में, जिसका उसे पता नहीं होगा
  rationale: ‘दिन/घड़ी’ का समानांतर बना रहता है और γινώσκω का साधारण ज्ञान या जानकारी वाला अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: दृष्टांत के घरेलू-सामाजिक प्रसंग में κύριος का अनुवाद
  choice: मालिक
  alternative: प्रभु / स्वामी
  rationale: निकटवर्ती अर्थ दृष्टांत के मानवीय अधिकारी का है। व्यापक मसीह-संबंधी संकेत को नकारे बिना, ‘मालिक’ तत्काल कथात्मक भूमिका को स्पष्ट रखता है और मूल की दोनों अर्थ-परतों को जबरन एक नहीं बनाता।
- issue: δοῦλος में निहित सामाजिक स्थिति
  choice: दास
  alternative: सेवक
  rationale: मालिक-दास की स्पष्ट अधिकार-संरचना में बंधी अधीनता प्रासंगिक है। ‘सेवक’ इस बल को नरम कर सकता है, इसलिए मुख्य पाठ में ‘दास’ चुना गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ऐसे दिन/ऐसी घड़ी’ मूल के अनिश्चित काल-सूचकों और उनके अलंकारिक समानांतर को बनाए रखते हैं। सर्वनाम ‘वह’ का संदर्भ दास है, जबकि ‘उसके आने’ का संदर्भ मालिक के आगमन से है।
