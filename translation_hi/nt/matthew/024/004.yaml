  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: hi
  text: यीशु ने उन्हें उत्तर दिया, “सावधान रहो कि कोई तुम्हें भटका न दे।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “धोखा न दे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: ने उन्हें उत्तर दिया
  rationale: यूनानी की सहभागी क्रिया और मुख्य क्रिया मिलकर उत्तर देने की एक स्वाभाविक कथात्मक अभिव्यक्ति बनाती हैं। हिन्दी में ‘उत्तर देते हुए कहा’ सम्भव है, पर ‘उत्तर दिया’ अर्थ को बिना अनावश्यक दोहराव के सहज रूप में व्यक्त करता है।
- source_word: Βλέπετε
  choice: सावधान रहो
  rationale: यहाँ वर्तमान आज्ञार्थक क्रिया का अर्थ केवल ‘देखना’ नहीं, बल्कि चौकन्ने रहना और ध्यान रखना है। ‘सावधान रहो’ आधुनिक हिन्दी में इस चेतावनी को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: μή τις
  choice: कि कोई ... न
  rationale: आज्ञा के बाद μή और संभावनार्थक क्रिया रोकथाम की चेतावनी व्यक्त करते हैं। हिन्दी की ‘कि कोई ... न’ रचना इसी भाव को स्वाभाविक ढंग से रखती है।
- source_word: πλανήσῃ
  choice: भटका न दे
  rationale: πλανάω में बहकाने, धोखा देने और सही मार्ग से हटा देने के अर्थ समाहित हैं। ‘भटका न दे’ मार्ग से विचलित किए जाने की छवि और व्यापक चेतावनी दोनों को बनाए रखता है।
theological_decisions:
- issue: πλανήσῃ में चेतावनी का स्वरूप
  choice: ‘भटका न दे’—गलत मार्गदर्शन, बहकावे और उससे होने वाले विचलन की व्यापक चेतावनी
  alternative: ‘धोखा न दे’—मुख्यतः छल या भ्रम में डालने पर बल
  rationale: आगामी संदर्भ झूठे दावों द्वारा शिष्यों को भ्रमित और सही मार्ग से दूर किए जाने की चेतावनी देता है। ‘भटका न दे’ इसे केवल बौद्धिक धोखे तक सीमित किए बिना मूल की व्यापक अर्थ-छाया सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक चेतावनी के अनुरूप। ‘सावधान रहो’ बहुवचन श्रोताओं को संबोधित करता है, और ‘भटका न दे’ मूल के रूपक तथा अर्थगत व्यापकता को सुरक्षित रखता है।
