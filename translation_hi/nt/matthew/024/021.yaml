id: MAT.24.21
reference: Matthew 24:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: hi
  text: क्योंकि उस समय ऐसा भारी क्लेश[a] होगा, जैसा संसार के आरम्भ से अब तक न कभी हुआ है और न फिर कभी होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भारी संकट’ अथवा ‘घोर दुःख।’ यूनानी शब्द तीव्र परेशानी, दबाव या उत्पीड़न को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: क्योंकि उस समय
  rationale: γάρ पिछले कथन का कारण स्पष्ट करता है और τότε उस समय की ओर संकेत करता है; यह हिन्दी में दोनों अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: θλῖψις μεγάλη
  choice: भारी क्लेश
  rationale: θλῖψις तीव्र कष्ट, दबाव या उत्पीड़न को सूचित कर सकता है। ‘क्लेश’ इसकी व्यापकता और अन्त-समय संबंधी गंभीरता बनाए रखता है, जबकि ‘भारी’ μεγάλη की तीव्रता को सहज हिन्दी में व्यक्त करता है।
- source_word: οἵα
  choice: जैसा
  rationale: यह गुणात्मक तुलना आरम्भ करता है और आने वाले क्लेश की अभूतपूर्व तीव्रता बताता है।
- source_word: οὐ γέγονεν
  choice: न कभी हुआ है
  rationale: γίνομαι का पूर्णकाल यहाँ अब तक किसी घटना के घटित होने को व्यक्त करता है; ‘हुआ है’ हिन्दी में स्वाभाविक है और ‘कभी’ निषेध की व्यापकता स्पष्ट करता है।
- source_word: ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν
  choice: संसार के आरम्भ से अब तक
  rationale: यह मूल पाठ की समय-सीमा को बिना ‘सृष्टि’ जैसी व्याख्यात्मक वृद्धि के सीधे और स्पष्ट रूप में रखता है।
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: और न फिर कभी होगा
  rationale: οὐ μή भविष्य के विषय में प्रबल निषेध है। ‘न फिर कभी होगा’ उस जोरदार निषेध और पहले वर्णित घटना की पुनरावृत्ति—दोनों को व्यक्त करता है।
theological_decisions:
- issue: अन्त-समय संबंधी अर्थवत्ता वाले θλῖψις का अनुवाद
  choice: क्लेश
  alternative: संकट; दुःख; उत्पीड़न
  rationale: ‘क्लेश’ यूनानी शब्द की गंभीरता और व्यापक धर्मवैचारिक प्रतिध्वनि को बनाए रखता है, पर किसी विशिष्ट सम्प्रदायगत अन्त-समय योजना को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य सहज, गंभीर और सार्वजनिक पाठ के योग्य है। ‘आरम्भ’ और ‘क्लेश’ गरिमापूर्ण किंतु सामान्यतः समझे जाने वाले शब्द हैं।
