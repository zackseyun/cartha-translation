  rationale: मूल पाठ पिछली उथल-पुथल को अंत स्वयं नहीं, बल्कि आगे आने वाली व्यथा की आरम्भिक अवस्था के रूप में प्रस्तुत करता है। प्रसव का रूपक बनाए रखने से युगान्त-संबंधी तनाव सुरक्षित रहता है, बिना किसी विशिष्ट doctrinal क्रम को आरोपित किए।
