- source_word: ὠδίνων
  choice: प्रसव-पीड़ाओं
  rationale: यह शब्द प्रसव के समय होने वाली पीड़ाओं को दर्शाता है। यह चयन मूल रूपक को बनाए रखता है और केवल सामान्य ‘दुःखों’ में उसे समतल नहीं करता।
