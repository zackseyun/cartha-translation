id: MAT.24.12
reference: Matthew 24:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: hi
  text: और अधर्म के बढ़ जाने के कारण[a], बहुतों का प्रेम[b] ठंडा पड़ जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि अधर्म बढ़ जाएगा।”
    reason: कारणसूचक संज्ञार्थक क्रियारूप का एक अधिक क्रियात्मक अनुवाद।
  - marker: b
    text: या, “उन बहुतों का प्रेम।”
    reason: τῶν πολλῶν में निश्चित उपपद के बल को अधिक प्रत्यक्ष रूप से दिखाने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: के बढ़ जाने के कारण
  rationale: διά के साथ संज्ञार्थक क्रियारूप कारण व्यक्त करता है। यह अनुवाद कारण और πληθυνθῆναι की वृद्धि-संबंधी क्रियात्मकता दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀνομίαν
  choice: अधर्म
  rationale: यह शब्द व्यवस्था, विशेषकर परमेश्वर की व्यवस्था, की अवहेलना या उल्लंघन को दर्शाता है। ‘अधर्म’ आधुनिक हिन्दी में संक्षिप्त, परिचित और धर्मवैज्ञानिक रूप से पर्याप्त सटीक है; ‘बुराई’ अधिक व्यापक होती।
- source_word: ψυγήσεται
  choice: ठंडा पड़ जाएगा
  rationale: यह भावनात्मक शीतलता का रूपक है। ‘ठंडा पड़ जाएगा’ वर्तमान हिन्दी में स्वाभाविक है और मूल रूपक को सुरक्षित रखता है।
- source_word: ἀγάπη
  choice: प्रेम
  rationale: ἀγάπη का मानक और सटीक हिन्दी प्रतिशब्द ‘प्रेम’ है; प्रसंग इसके संबंधपरक अर्थ को खुला रखता है।
- source_word: τῶν πολλῶν
  choice: बहुतों का
  rationale: यह अनिश्चित रूप से एक बड़े समूह की ओर संकेत करता है। ‘बहुतों का’ स्वाभाविक हिन्दी है और इसे ‘अधिकांश लोगों’ जैसा सांख्यिक दावा नहीं बनाता।
theological_decisions:
- issue: ‘बहुतों के प्रेम’ का दायरा
  choice: समूह की पहचान बताए बिना ‘बहुतों का प्रेम’ रखा गया है।
  alternative: इसे केवल विश्वासियों के प्रेम या सामान्य समाज में मानवीय प्रेम तक सीमित करना।
  rationale: τῶν πολλῶν यह स्पष्ट नहीं करता कि ये सामान्य मानवता, शिष्य होने का दावा करने वाले लोग, या कोई मिश्रित समूह हैं। इसलिए अनुवाद इस धर्मवैज्ञानिक तनाव को खुला रखता है।
- issue: अधर्म की वृद्धि में कर्तृत्व
  choice: ‘अधर्म के बढ़ जाने’ से वृद्धि व्यक्त की गई है, पर उसे बढ़ाने वाला कोई कर्ता नहीं जोड़ा गया।
  alternative: ‘अधर्म को बढ़ाया जाएगा’ या किसी मानवीय/अलौकिक कर्ता को स्पष्ट करना।
  rationale: मूल में πληθυνθῆναι निष्क्रिय रूप है, पर कर्ता व्यक्त नहीं है। स्वाभाविक हिन्दी में अकर्मक वृद्धि-रचना अनिर्दिष्ट कर्तृत्व को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ठंडा पड़ जाएगा’ प्रेम के क्षीण होने के मूल रूपक को स्वाभाविक हिन्दी में बनाए रखता है; समूह और कर्तृत्व के बारे में मूल की अनिश्चितता नहीं मिटाई गई है।
