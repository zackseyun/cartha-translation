source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: hi
  text: क्योंकि झूठे मसीहा[a] और झूठे भविष्यद्वक्ता उठ खड़े होंगे और बड़े चिन्ह और अद्भुत काम दिखाएँगे, इस हद तक कि, यदि संभव हो[c], वे चुने हुओं को भी भटका दें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झूठे ख्रीस्त।” यूनानी में “ख्रीस्तोस” एक उपाधि है; यहाँ नाम की अपेक्षा उसका अर्थ “मसीहा” है।
    reason: alternative_reading
  - marker: b
    text: या, “धोखा दे दें।” यूनानी क्रिया का अर्थ किसी को सही मार्ग से भटकाना भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “यदि संभव होता।” यूनानी में केवल “यदि संभव हो” है; वह इसके धर्मवैज्ञानिक निहितार्थ को स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: उठ खड़े होंगे
  rationale: यहाँ क्रिया का भाव लोगों के सामने आने या सक्रिय होकर प्रकट होने का है; यह अनुवाद पुनरुत्थान का अनपेक्षित संकेत दिए बिना उस मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ψευδόχριστοι
  choice: झूठे मसीहा
  rationale: Χριστός यहाँ नाम के बजाय उपाधि के रूप में प्रयुक्त है; इसलिए ‘मसीहा’ यहूदी मसीही संदर्भ और बहुवचन, दोनों को स्पष्ट रखता है।
- source_word: ψευδοπροφῆται
  choice: झूठे भविष्यद्वक्ता
  rationale: यह यौगिक संज्ञा का सीधा और प्रचलित हिन्दी रूप है।
- source_word: δώσουσιν
  choice: दिखाएँगे
  rationale: चिन्हों और अद्भुत कामों के साथ δίδωμι का शाब्दिक ‘देंगे’ हिन्दी में अस्वाभाविक है; ‘दिखाएँगे’ सार्वजनिक प्रदर्शन का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: σημεῖα μεγάλα
  choice: बड़े-बड़े चिन्ह
  rationale: ‘चिन्ह’ शब्द प्रमाणसूचक या संकेतात्मक अर्थ को बनाए रखता है; ‘बड़े-बड़े’ आधुनिक हिन्दी में उनकी असाधारण महत्ता को सहजता से व्यक्त करता है।
- source_word: τέρατα
  choice: अद्भुत काम
  rationale: यह τέρατα के विस्मय उत्पन्न करने वाले कृत्यों के भाव को साधारण पाठक के लिए स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὥστε πλανῆσαι
  choice: ताकि ... भटका दें
  rationale: यह रचना उद्देश्य या संभावित परिणाम—दोनों की निकटता बनाए रखती है और यूनानी वाक्य को किसी एक दार्शनिक श्रेणी में अत्यधिक सीमित नहीं करती।
- source_word: πλανῆσαι
  choice: भटका दें
  rationale: πλανάω केवल झूठ बोलकर धोखा देने से अधिक, किसी को सही मार्ग से हटा देने का भाव रखता है।
- source_word: εἰ δυνατὸν
  choice: यदि संभव हो
  rationale: यह यूनानी की संक्षिप्त शर्त को सीधे सुरक्षित रखता है और उसे प्रतितथ्यात्मक बनाकर किसी धर्मवैज्ञानिक निष्कर्ष को आरोपित नहीं करता।
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: चुने हुओं को भी
  rationale: ‘भी’ καί के आरोही बल को व्यक्त करता है; ‘चुने हुए’ ἐκλεκτοί का स्पष्ट, स्वाभाविक और कम तकनीकी हिन्दी रूप है।
theological_decisions:
- issue: ψευδόχριστοι में Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: झूठे मसीहा
  alternative: झूठे ख्रीस्त
  rationale: संदर्भ में दावा मसीही पद और पहचान का है, किसी व्यक्तिनाम का नहीं; ‘मसीहा’ इस उपाधिगत और यहूदी संदर्भ को सुरक्षित रखता है।
- issue: εἰ δυνατὸν का चुने हुओं के संबंध में धर्मवैज्ञानिक बल
  choice: यदि संभव हो
  alternative: यदि संभव होता
  rationale: मूल यूनानी केवल शर्त रखता है। चुने हुओं का भटकना वास्तव में संभव है या असंभव, इस प्रश्न को अनुवाद स्वयं निर्णीत नहीं करता।
- issue: ὥστε πλανῆσαι में उद्देश्य और परिणाम का संबंध
  choice: ताकि ... भटका दें
  alternative: जिसके फलस्वरूप वे ... भटका दें
  rationale: मूल रचना उद्देश्य अथवा अपेक्षित परिणाम के बीच कुछ खुलापन रख सकती है; चुना गया हिन्दी रूप आशय को सुबोध रखते हुए उसे कठोर परिणाम-वचन नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। ‘मसीहा’, ‘भविष्यद्वक्ता’ और ‘चुने हुए’ जैसे परिचित बाइबलीय पद रखे गए हैं। वाक्य में मूल की चेतावनी, शर्त और धर्मवैज्ञानिक तनाव सुरक्षित हैं।
