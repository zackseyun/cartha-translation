reference: Matthew 24:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: hi
  text: क्योंकि जैसे बिजली पूर्व से निकलती है और पश्चिम तक दिखाई देती है, वैसे ही मनुष्य के पुत्र का आगमन[a] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपस्थिति।” यूनानी शब्द παρουσία का अर्थ “उपस्थिति” या “आगमन” हो सकता है; पर यहाँ प्रसंग में यह मनुष्य के पुत्र के भावी आगमन की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: क्योंकि जैसे
  rationale: γάρ के व्याख्यात्मक संबंध और ὥσπερ की तुलना—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀστραπή
  choice: बिजली
  rationale: यहाँ आकाश में चमकने वाली बिजली अभिप्रेत है; हिन्दी में यही सबसे स्वाभाविक और स्पष्ट शब्द है।
- source_word: ἐξέρχεται
  choice: निकलती है
  rationale: मूल क्रिया के ‘बाहर आने/निकलने’ के भाव को बिजली के संदर्भ में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀπὸ ἀνατολῶν
  choice: पूर्व से
  rationale: पश्चिम के साथ दिशात्मक विरोध में ἀνατολῶν का अर्थ स्पष्ट रूप से ‘पूर्व’ है।
- source_word: φαίνεται
  choice: दिखाई देती है
  rationale: क्रिया के दृश्य और सार्वजनिक रूप से प्रत्यक्ष होने के भाव को बिना ‘चमकती है’ जैसा अतिरिक्त अर्थ जोड़े व्यक्त करता है।
- source_word: ἕως δυσμῶν
  choice: पश्चिम तक
  rationale: ἕως द्वारा व्यक्त विस्तार तथा पूर्व से पश्चिम तक की व्यापकता को संक्षिप्त, स्वाभाविक हिन्दी में रखता है।
- source_word: οὕτως ἔσται
  choice: वैसे ही ... होगा
  rationale: तुलनात्मक रचना और भविष्यकाल—दोनों को सुरक्षित रखता है।
- source_word: παρουσία
  choice: आगमन
  rationale: इस भविष्यसूचक संदर्भ में घटना के रूप में आने या पहुँचने का भाव प्रमुख है। ‘आगमन’ dignified और प्रचलित हिन्दी है; ‘उपस्थिति’ की वास्तविक शाब्दिक संभावना पाद-टिप्पणी में रखी गई है।
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: यीशु द्वारा प्रयुक्त पदवी का पारंपरिक और स्रोत-संवेदनशील रूप है, जो दानिय्येल 7 से इसके अंतर्पाठीय संबंध को भी सुरक्षित रखता है।
theological_decisions:
- issue: अंत-काल संबंधी कथन में παρουσία का अनुवाद
  choice: आगमन
  alternative: उपस्थिति; आना
  rationale: बिजली के खुले और अचूक रूप से दिखाई देने की तुलना यहाँ मनुष्य के पुत्र की भावी παρουσία से है। ‘आगमन’ इस प्रसंग के घटनात्मक भाव को स्पष्ट करता है, पर किसी विशिष्ट अंत-कालीन प्रणाली को आरोपित नहीं करता। शब्द की ‘उपस्थिति’ वाली वास्तविक अर्थ-संभावना पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य है। ‘मनुष्य के पुत्र’ को स्थापित बाइबलीय पदवी के रूप में रखा गया है। पाद-टिप्पणी चिह्न [a] मुख्य पाठ में संबंधित शब्द के तुरंत बाद दिया गया है।
