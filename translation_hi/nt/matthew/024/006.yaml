reference: Matthew 24:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: hi
  text: और तुम युद्धों और युद्धों की खबरें[a] सुनोगे। ध्यान रखना कि घबरा न जाओ, क्योंकि इन बातों का होना अवश्य है; लेकिन अभी अंत नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्धों की अफवाहें।” यूनानी शब्द का अर्थ खबर, समाचार या अफवाह हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε ἀκούειν
  choice: सुनोगे
  rationale: μέλλω के भावी और अपेक्षित अर्थ को हिंदी में स्वाभाविक भविष्यकाल व्यक्त करता है; ‘सुनने वाले हो’ यहाँ अपेक्षाकृत असहज होता।
- source_word: πολέμους
  choice: युद्धों
  rationale: πόλεμος सामान्यतः युद्ध को दर्शाता है, किसी एक लड़ाई या केवल व्यापक संघर्ष को नहीं।
- source_word: ἀκοὰς πολέμων
  choice: युद्धों की खबरें
  rationale: ἀκοή यहाँ सुनी हुई सूचना, समाचार या खबर का अर्थ दे सकता है। ‘खबरें’ इस अर्थ-क्षेत्र को स्वाभाविक हिंदी में व्यक्त करता है और अपुष्टता या झूठ का भाव अनावश्यक रूप से नहीं जोड़ता।
- source_word: ὁρᾶτε, μὴ θροεῖσθε
  choice: ध्यान रखना कि घबरा न जाओ
  rationale: ὁρᾶτε यहाँ सावधानी की आज्ञा देता है, जबकि θροεῖσθε व्याकुल या भयभीत हो उठने का भाव रखता है। यह रूप चेतावनी को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: δεῖ γὰρ γενέσθαι
  choice: क्योंकि इन बातों का होना अवश्य है
  rationale: δεῖ आवश्यकता को और γενέσθαι घटित होने को व्यक्त करता है। यूनानी में infinitive का स्पष्ट कर्ता नहीं है; प्रसंग से युद्ध और उनकी खबरें अभिप्रेत हैं, इसलिए ‘इन बातों’ से निहित संदर्भ स्पष्ट किया गया है।
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: लेकिन अंत अभी नहीं है
  rationale: यह यूनानी वाक्य की संक्षिप्तता और कालांत-संबंधी ‘अंत’ की व्यापकता को बनाए रखता है।
theological_decisions:
- issue: τὸ τέλος का कालांत-संबंधी अर्थ
  choice: अंत
  alternative: परिपूर्णता / अंतिम अंत
  rationale: यूनानी अभिव्यक्ति व्यापक है। ‘अंत’ उसे किसी विशेष सहस्राब्दी, क्लेशकाल या अन्य कालांत-व्यवस्था से नहीं बाँधता।
- issue: δεῖ द्वारा व्यक्त आवश्यकता
  choice: होना अवश्य है
  alternative: होना ही चाहिए
  rationale: ‘अवश्य है’ दैवी या घटनात्मक आवश्यकता को व्यक्त करता है, पर यह नहीं बताता कि युद्ध नैतिक रूप से वांछनीय या आज्ञापित हैं।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और मौखिक पाठ में स्वाभाविक। ‘युद्धों की खबरें’ को ‘युद्धों की अफवाहें’ पर प्राथमिकता दी गई है, क्योंकि यूनानी ἀκοή में अपुष्ट या झूठी सूचना का भाव अनिवार्य नहीं है।
