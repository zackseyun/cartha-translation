id: MAT.24.45
reference: Matthew 24:45
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise servant[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: hi
  text: “तो वह विश्वासयोग्य और समझदार दास[a] कौन है, जिसे उसके स्वामी[b] ने अपने घर के लोगों पर नियुक्त किया है कि वह उन्हें ठीक समय पर भोजन दे?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवक’। यूनानी शब्द स्वामी के अधिकार के अधीन दास या सेवक, दोनों अर्थों में प्रयुक्त हो सकता है; यहाँ ‘दास’ उस अधीनता को अधिक स्पष्ट रखता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘प्रभु’। यहाँ घरेलू दृष्टान्त के प्रसंग में यूनानी शब्द का अनुवाद ‘स्वामी’ किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: Τίς ἄρα
  choice: तो ... कौन है
  rationale: ἄρα पिछले उपदेश से निष्कर्ष निकालती हुई आलंकारिक पूछताछ आरम्भ करता है। हिन्दी में ‘तो ... कौन है’ इसका स्वाभाविक प्रवाह बनाए रखता है।
- source_word: πιστὸς
  choice: विश्वासयोग्य
  rationale: यहाँ शब्द सौंपे गए दायित्व को भरोसेमंद ढंग से निभाने वाले व्यक्ति का गुण बताता है; ‘विश्वासयोग्य’ नैतिक निष्ठा और भरोसेमंदी दोनों को व्यक्त करता है।
- source_word: δοῦλος
  choice: दास
  rationale: δοῦλος ऐसे व्यक्ति को दर्शाता है जो स्वामी के अधिकार के अधीन है। ‘दास’ इस सामाजिक संबंध को ‘सेवक’ की अपेक्षा अधिक स्पष्टता से बनाए रखता है; अधिक सामान्य विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: φρόνιμος
  choice: समझदार
  rationale: φρόνιμος व्यावहारिक बुद्धि और सूझ-बूझ को व्यक्त करता है। आधुनिक हिन्दी में ‘समझदार’ इस प्रसंग में केवल बौद्धिक योग्यता नहीं, बल्कि उचित रीति से जिम्मेदारी निभाने का भाव भी देता है।
- source_word: κατέστησεν
  choice: नियुक्त किया है
  rationale: यह क्रिया किसी व्यक्ति को उत्तरदायित्व के पद पर रखने का अर्थ देती है। ‘नियुक्त किया है’ सौंपे गए अधिकार और वर्तमान दायित्व को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κύριος
  choice: स्वामी
  rationale: घरेलू दृष्टान्त में κύριος दास पर अधिकार रखने वाले घर के स्वामी को दर्शाता है। ‘स्वामी’ सामाजिक रूपक को बनाए रखता है, जबकि ‘प्रभु’ सम्भव वैकल्पिक धार्मिक प्रतिध्वनि के रूप में पाद-टिप्पणी में सुरक्षित है।
- source_word: οἰκετείας
  choice: घर के लोगों
  rationale: οἰκετεία घराने के अंतर्गत आने वाले लोगों, विशेषकर घरेलू सेवक-वर्ग, को सूचित करता है। ‘घर के लोगों’ बहुवचन αὐτοῖς के अनुरूप है और ‘घर-परिवार’ से उत्पन्न केवल रिश्तेदारों का अर्थ थोपने से बचता है।
- source_word: τοῦ δοῦναι
  choice: कि वह ... दे
  rationale: सव्यय अनन्त क्रिया नियुक्ति का उद्देश्य बताती है। हिन्दी का ‘कि वह ... दे’ इस प्रयोजन को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: τροφὴν
  choice: भोजन
  rationale: τροφή भोजन या पोषण को दर्शाता है। ‘भोजन’ स्पष्ट है और प्रसंग से अधिक विशिष्ट ‘राशन’ का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἐν καιρῷ
  choice: ठीक समय पर
  rationale: καιρός यहाँ उपयुक्त या निर्धारित अवसर का भाव रखता है। ‘ठीक समय पर’ समयोचित प्रबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: घरेलू दृष्टान्त में κύριος का अनुवाद
  choice: स्वामी
  alternative: प्रभु
  rationale: पद की सतही कथा घर और दास के सामाजिक संबंध पर आधारित है, इसलिए ‘स्वामी’ तत्काल प्रसंग के अनुकूल है। साथ ही दृष्टान्त के व्यापक संदर्भ में ‘प्रभु’ की धार्मिक प्रतिध्वनि सम्भव है; उसे पाद-टिप्पणी में रखा गया है ताकि अर्थ को समय से पहले निर्णीत न किया जाए।
- issue: δοῦλος में अधीनता की तीव्रता
  choice: दास
  alternative: सेवक
  rationale: मूल शब्द स्वामी के अधिकार के अधीन स्थिति को प्रबलता से व्यक्त कर सकता है। ‘दास’ इस बल को सुरक्षित रखता है, जबकि हिन्दी बाइबलीय प्रयोग में प्रचलित नरम विकल्प ‘सेवक’ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘समझदार’ व्यावहारिक बुद्धि को, ‘अपने घर के लोगों’ घरेलू समूह को, और ‘ठीक समय पर’ समयोचित जिम्मेदारी को सामान्य पाठक के लिए स्पष्ट करते हैं।
