  verdict: revise
  source_fidelity: 'The draft accurately conveys the sequence and principal imagery of the Greek: the immediacy after the tribulation, darkening of sun and moon, falling stars, and the shaking of the powers of the heavens. The cosmic language and its interpretive openness are appropriately retained.'
  naturalness: 'Most of the Hindi is clear and suitably solemn. However, “सूर्य अँधेरा कर दिया जाएगा” is not idiomatic modern Hindi: it normally implies an unstated agent who actively makes the sun dark. “सूर्य अंधकारमय हो जाएगा” communicates the Greek passive sense naturally in Hindi without introducing such an agent.'
  terminology: “क्लेश,” “चन्द्रमा,” and “प्रकाश” are appropriate. “आकाशों की शक्तियाँ” usefully reflects the Greek plural and preserves ambiguity, though it is elevated in register; the explanatory footnote makes this acceptable. The footnote anchors are correctly placed after the relevant expressions.
  issues:
  - severity: medium
    issue: “सूर्य अँधेरा कर दिया जाएगा” is an unnatural Hindi passive.
    rationale: The Greek σκοτισθήσεται is a future passive, but a literal Hindi passive with “कर दिया जाएगा” sounds agentive and awkward. “अंधकारमय हो जाएगा” is idiomatic and preserves the intended result without over-specifying an agent.
