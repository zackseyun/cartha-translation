id: MAT.24.29
reference: Matthew 24:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: hi
  text: परन्तु उन दिनों के क्लेश के तुरन्त बाद सूर्य अंधकारमय हो जाएगा, चन्द्रमा अपना प्रकाश नहीं देगा, तारे आकाश से गिरेंगे[a], और आकाशों की शक्तियाँ हिला दी जाएँगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आकाश’ के स्थान पर ‘स्वर्ग’ भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: ‘आकाशों की शक्तियाँ’ का अर्थ ब्रह्माण्डीय बल, आकाशीय पिण्ड या स्वर्गीय शक्तियाँ हो सकता है; यूनानी अभिव्यक्ति इन सम्भावनाओं में से किसी एक को निश्चित नहीं करती।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: परन्तु…तुरन्त
  rationale: Εὐθέως की प्रबल तात्कालिकता को ‘तुरन्त’ व्यक्त करता है; δὲ को प्रसंग में हल्का विरोध और अगले दृश्य की ओर संक्रमण दिखाने के लिए ‘परन्तु’ किया गया है।
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: उन दिनों के क्लेश के…बाद
  rationale: यह यूनानी संबंधवाचक संरचना को स्वाभाविक हिन्दी में बनाए रखता है। ‘क्लेश’ θλῖψις के दुःख, दबाव और विपत्ति के गंभीर भाव को समेटता है।
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: सूर्य अँधेरा कर दिया जाएगा
  rationale: भविष्यत् कर्मवाच्य को बनाए रखते हुए सामान्य हिन्दी में अन्धकार छा जाने का अर्थ स्पष्ट करता है।
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: चन्द्रमा अपना प्रकाश नहीं देगा
  rationale: मूल के ‘अपना प्रकाश देना’ बिम्ब को सीधे और स्वाभाविक रूप में सुरक्षित रखता है।
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: तारे आकाश से गिरेंगे
  rationale: सरल भविष्यकाल मूल का सीधा अर्थ देता है; इस प्रसंग में οὐρανός के दृश्य आकाश वाले अर्थ को मुख्य पाठ में चुना गया है।
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: आकाशों की शक्तियाँ
  rationale: ‘शक्तियाँ’ δύναμεις की व्यापकता और ‘आकाशों’ यूनानी बहुवचन को बनाए रखते हैं; इससे वाक्यांश को केवल खगोलीय पिण्डों, ब्रह्माण्डीय बलों या स्वर्गीय सत्ताओं तक सीमित नहीं किया जाता।
- source_word: σαλευθήσονται
  choice: हिला दी जाएँगी
  rationale: यह भविष्यत् कर्मवाच्य और प्रबल कम्पन अथवा विचलन के भाव को सुरक्षित रखता है।
theological_decisions:
- issue: प्रलय-वर्णन में ब्रह्माण्डीय चिह्नों का स्वरूप
  choice: सूर्य, चन्द्रमा, तारों और आकाशीय शक्तियों के बिम्बों को बिना व्याख्यात्मक विस्तार के सीधे बनाए रखना
  alternative: इन्हें केवल शाब्दिक खगोलीय घटनाएँ या केवल राजनीतिक और न्याय-संबंधी प्रतीक मानकर अनुवाद करना
  rationale: मूल भविष्यद्वाणी और प्रलय-साहित्य की भाषा में बोलता है और यह तय नहीं करता कि चित्रण केवल शाब्दिक है, केवल प्रतीकात्मक है, या दोनों स्तरों पर कार्य करता है। अनुवाद उस तनाव को खुला रखता है।
- issue: αἱ δυνάμεις τῶν οὐρανῶν का संदर्भ
  choice: ‘आकाशों की शक्तियाँ’ जैसी व्यापक अभिव्यक्ति रखना
  alternative: ‘स्वर्गदूत’, ‘खगोलीय पिण्ड’ या ‘ब्रह्माण्डीय बल’ जैसे किसी एक निश्चित अर्थ को मुख्य पाठ में रखना
  rationale: यूनानी पद जानबूझकर व्यापक है; किसी एक अस्तित्व-संबंधी या धार्मिक पहचान को चुनना मूल से अधिक निश्चितता जोड़ देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘चन्द्रमा’ और ‘क्लेश’ सामान्य पाठक के लिए बोधगम्य रहते हुए भविष्यद्वाणी के गंभीर स्वर को बनाए रखते हैं। कर्मवाच्य रूप मूल के व्याकरणिक बल को सुरक्षित रखते हैं; अस्पष्ट ब्रह्माण्डीय पद को व्याख्या द्वारा संकीर्ण नहीं किया गया।
