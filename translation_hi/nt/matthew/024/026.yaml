id: MAT.24.26
reference: Matthew 24:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: hi
  text: इसलिए यदि वे तुमसे कहें, ‘देखो, वह निर्जन प्रदेश में है,’ तो बाहर मत जाना; ‘देखो, वह भीतरी कमरों[a] में है,’ तो उस बात पर विश्वास मत करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भीतरी कमरों’ का अनुवाद ‘भंडार-कक्षों’ या ‘निजी कोठरियों’ भी हो सकता है। यूनानी शब्द घर के अंदर के निजी कमरे या भंडार रखने के कक्ष को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: इसलिए यदि
  rationale: οὖν पिछले कथन से निष्कर्षात्मक संबंध जोड़ता है और ἐὰν शर्त प्रस्तुत करता है; ‘इसलिए यदि’ दोनों भावों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἴπωσιν ὑμῖν
  choice: वे तुमसे कहें
  rationale: तीसरे पुरुष बहुवचन का प्रयोग अनिश्चित कर्ता के लिए है; किसी विशेष समूह को निर्दिष्ट किए बिना ‘वे तुमसे कहें’ इसे सीधे व्यक्त करता है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: ἰδού ध्यान आकर्षित करने वाला उद्गार है; ‘देखो’ आधुनिक, सहज और तात्कालिक है।
- source_word: ἐν τῇ ἐρήμῳ
  choice: निर्जन प्रदेश में
  rationale: ἔρημος निर्जन, उजाड़ या मरुस्थलीय स्थान को सूचित कर सकता है। ‘निर्जन प्रदेश’ रेतीले मरुस्थल का अनावश्यक बिंब थोपे बिना अर्थ-परास सुरक्षित रखता है।
- source_word: ἐστίν
  choice: वह ... है
  rationale: यूनानी में कर्ता संदर्भ से समझा जाता है। हिन्दी में ‘वह’ जोड़ना स्वाभाविक है, पर ‘मसीह’ या ‘यीशु’ जोड़कर निहित संदर्भ को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: μὴ ἐξέλθητε
  choice: बाहर मत जाना
  rationale: μή के साथ एओरिस्ट सब्जंक्टिव निषेध व्यक्त करता है; ‘बाहर मत जाना’ गति के मूल भाव को सीधे बनाए रखता है।
- source_word: ἐν τοῖς ταμείοις
  choice: भीतरी कमरों में
  rationale: ταμεῖον भीतरी, निजी कमरे या भंडार-कक्ष को सूचित कर सकता है। संदर्भ में ‘भीतरी कमरे’ स्थान के बंद और अंदरूनी स्वरूप को बिना ‘गुप्त’ होने का अर्थ थोपे व्यक्त करता है।
- source_word: μὴ πιστεύσητε
  choice: विश्वास मत करना
  rationale: यह निषेध बताए गए दावे पर विश्वास न करने को कहता है। हिन्दी में कर्म संदर्भ से स्पष्ट है, इसलिए अलग से ‘उस बात पर’ जोड़ना आवश्यक नहीं।
theological_decisions:
- issue: ἐστίν का निहित कर्ता
  choice: ‘वह’ के रूप में रखा गया, किसी उपाधि को नहीं जोड़ा गया।
  alternative: ‘मसीह वहाँ है’ या ‘यीशु वहाँ है।’
  rationale: निकटवर्ती संदर्भ झूठे मसीहों और मनुष्य के पुत्र के आगमन से संबंधित है, पर इस उपवाक्य में यूनानी पाठ कोई नाम या उपाधि स्पष्टतः नहीं देता। ‘वह’ आवश्यक व्याकरणिक पूर्ति करता है और मूल की निहितता बनाए रखता है।
- issue: दो स्थान-संबंधी दावों का संबंध
  choice: दो समानांतर उद्धरण अर्धविराम से रखे गए, बिना ‘या’ जोड़े।
  alternative: दूसरे उद्धरण से पहले ‘या’ जोड़ना।
  rationale: यूनानी पाठ दोनों दावों को समानांतर रखता है, पर स्पष्ट विकल्पसूचक संयोजक नहीं देता। अर्धविराम प्रवाह स्पष्ट करता है और मूल की असंयोजित संरचना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘तुम’ निकटवर्ती शिष्यों को संबोधित बहुवचन के अनुरूप है। आदेशों में ‘मत जाना’ और ‘मत करना’ सामान्य बोलचाल की स्पष्टता रखते हैं। फुटनोट-चिह्न मुख्य पाठ में संबंधित कथन के अंत में दिया गया है।
