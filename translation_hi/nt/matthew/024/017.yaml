  text: ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω ἆραι τὰ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/017.yaml
  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: hi
  text: जो छत[a] पर हो, वह अपने घर में से सामान लेने के लिए नीचे न उतरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात घर की सपाट, उपयोग में आने वाली छत।
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: जो छत पर हो
  rationale: संज्ञा के रूप में प्रयुक्त यूनानी पदबंध का प्रतिनिधिक एकवचन अर्थ स्वाभाविक और लिंग-समावेशी हिन्दी में व्यक्त होता है।
- source_word: δώματος
  choice: छत
  rationale: यह घर की सपाट, उपयोग में आने वाली छत को सूचित करता है; आधुनिक हिन्दी में ‘छत’ सर्वाधिक सहज है, जबकि सांस्कृतिक विशेषता पादटिप्पणी में स्पष्ट की गई है।
- source_word: μὴ καταβάτω
  choice: नीचे न उतरे
  rationale: निषेधात्मक आज्ञा और छत से नीचे जाने की वास्तविक गति—दोनों को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἆραι
  choice: लेने के लिए
  rationale: यहाँ क्रिया का infinitive प्रयोजन बताता है—नीचे उतरने का उद्देश्य वस्तुएँ लेना है।
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: अपने घर में से सामान
  rationale: यूनानी में नपुंसकलिंग बहुवचन पद वस्तुओं अथवा निजी सामान के लिए संक्षिप्त प्रयोग है। ‘सामान’ हिन्दी में स्पष्ट है, और ‘अपने’ समान कर्ता से संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οἰκίας
  choice: घर
  rationale: संदर्भ में भवन का ठोस भौतिक अर्थ है, इसलिए ‘घर’ उपयुक्त है।
- source_word: αὐτοῦ
  choice: अपने
  rationale: हिन्दी में कर्ता के अपने ही घर का संबंध बताने के लिए निजवाचक ‘अपने’ व्याकरणतः स्वाभाविक है; इससे यूनानी के प्रतिनिधिक पुल्लिंग एकवचन को अनावश्यक रूप से जैविक लिंग तक सीमित नहीं किया जाता।
theological_decisions:
- issue: प्रतिनिधिक पुल्लिंग एकवचन
  choice: ‘जो … हो, वह अपने …’ द्वारा प्रतिनिधिक एकवचन बनाए रखना
  alternative: ‘जो आदमी … वह उसके …’ अथवा बहुवचन ‘वे अपने …’
  rationale: यूनानी रचना एक प्रतिनिधिक एकवचन है, कोई धर्मसैद्धांतिक लिंग-विशेष कथन नहीं। हिन्दी का ‘जो … वह अपने’ संख्या और अर्थ बनाए रखते हुए स्वाभाविक रूप से सभी पर लागू होता है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। ‘सामान’ सामान्य पाठक के लिए ‘वस्तुएँ’ से अधिक स्वाभाविक है; वाक्य की तात्कालिक आज्ञात्मक शक्ति ‘नीचे न उतरे’ में बनी रहती है।
