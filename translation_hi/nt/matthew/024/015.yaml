id: MAT.24.15
reference: Matthew 24:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: hi
  text: इसलिए, जब तुम ‘उजाड़ने वाली घृणित वस्तु’[b] को, जिसके विषय में दानिय्येल भविष्यद्वक्ता के द्वारा कहा गया था, किसी पवित्र स्थान[a] में खड़ी देखो—पढ़ने वाला समझ ले—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक पारंपरिक रूप में, “उस पवित्र स्थान में।”
    reason: alternative_reading
  - marker: b
    text: या “उजाड़ की घृणित वस्तु” अथवा “उजाड़ लाने वाली घृणित वस्तु”; यह पदबंध दानिय्येल की पुस्तक की प्रतिध्वनि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: इसलिए जब
  rationale: Ὅταν भविष्य की परिस्थिति को सूचित करता है और οὖν पिछले कथन से निष्कर्ष अथवा संक्रमण जोड़ता है; ‘इसलिए जब’ दोनों कार्यों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἴδητε
  choice: तुम ... देखो
  rationale: बहुवचन संबोधन और temporal clause में aorist subjunctive का सीधा, सहज हिन्दी रूप।
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: ‘उजाड़ की घृणित वस्तु’
  rationale: यूनानी संबंधकारक रचना और दानिय्येल की प्रतिध्वनि को जानबूझकर औपचारिक तथा कुछ हद तक रहस्यपूर्ण रखा गया है; कारणसूचक अर्थ को मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου
  choice: जिसके विषय में दानिय्येल भविष्यद्वक्ता के द्वारा कहा गया था
  rationale: ῥηθὲν के भविष्यद्वाणी में कहे जाने के भाव और διά के माध्यम/प्रतिनिधि-सूचक अर्थ को सुरक्षित रखता है।
- source_word: ἑστὸς
  choice: खड़ी
  rationale: ἵστημι के पूर्ण कृदंत का सीधा अर्थ ‘खड़ा होना’ है; हिन्दी में ‘वस्तु’ के स्त्रीलिंग के अनुसार ‘खड़ी’ किया गया है, बिना यह तय किए कि संकेत किसी व्यक्ति, मूर्ति या अन्य वस्तु की ओर है।
- source_word: ἐν τόπῳ ἁγίῳ
  choice: किसी पवित्र स्थान में
  rationale: यूनानी में τόπῳ के साथ निश्चित उपपद नहीं है; ‘किसी’ अनिश्चितता को स्पष्ट करता है, जबकि मंदिर-विशिष्ट संभावना पादटिप्पणी में रखी गई है।
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: पढ़ने वाला समझ ले
  rationale: मूल के कोष्ठकीय आग्रह और तृतीय पुरुष आज्ञार्थक बल को संक्षिप्त, प्रचलित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: τόπῳ ἁγίῳ की निश्चितता और मंदिर-विशिष्ट अर्थ
  choice: किसी पवित्र स्थान में
  alternative: उस पवित्र स्थान में
  rationale: संदर्भ मंदिर या किसी पवित्रीकृत स्थान की ओर संकेत कर सकता है, पर यूनानी वाक्यांश अपने रूप में निश्चितता को अनिवार्य नहीं करता। मुख्य पाठ इस खुलापन को बनाए रखता है और विशिष्ट पारंपरिक पाठ पादटिप्पणी में देता है।
- issue: दानिय्येल-संबंधी पदबंध βδέλυγμα τῆς ἐρημώσεως का अर्थ
  choice: उजाड़ की घृणित वस्तु
  alternative: उजाड़ने वाली घृणित वस्तु / उजाड़ लाने वाली घृणित वस्तु
  rationale: मुख्य पाठ यूनानी संबंधकारक और दानिय्येल के साथ अंतर्पाठीय संबंध को सुरक्षित रखता है; वैकल्पिक रूप कारणकारी या सक्रिय अर्थ को अधिक स्पष्ट करते हैं, इसलिए उन्हें पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। दानिय्येल-संबंधी तकनीकी पदबंध की वास्तविक अस्पष्टता को मुख्य पाठ में बनाए रखा गया है। दीर्घ विशेषणात्मक खंड को अल्पविरामों से अलग किया गया है और लेखक का कोष्ठकीय निर्देश दीर्घ विराम-चिह्नों के बीच रखा गया है।
