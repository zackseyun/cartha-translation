  naturalness: The sentence structure and register are generally natural modern Hindi. Replacing the opaque possessive construction with “उजाड़ने वाली घृणित वस्तु” makes the key expression intelligible while retaining its referential ambiguity.
  terminology: “दानिय्येल भविष्यद्वक्ता,” “पवित्र स्थान,” and “पढ़ने वाला समझ ले” are suitable. “उजाड़ने वाली घृणित वस्तु” is a well-formed Hindi rendering of βδέλυγμα τῆς ἐρημώσεως; the footnote preserves other viable renderings without deciding the precise historical referent.
