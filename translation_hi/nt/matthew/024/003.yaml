id: MAT.24.3
reference: Matthew 24:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: hi
  text: जब वह जैतून के पहाड़ पर बैठा था, तब चेले उसके पास अलग से आए और कहने लगे, “हमें बताइए, ये बातें कब होंगी, और आपके आगमन[a] तथा युग के अंत[b] का चिन्ह क्या होगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपस्थिति” अथवा “आना”।
    reason: lexical_alternative
  - marker: b
    text: या “युग की पूर्णता”; परंपरागत अनुवाद में “संसार का अंत”।
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: जब वह ... बैठा था
  rationale: संबंधकारक निरपेक्ष रचना को स्वाभाविक कालवाचक उपवाक्य के रूप में रखा गया है; अपूर्णकालिक भाव बैठने की जारी अवस्था व्यक्त करता है।
- source_word: ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: जैतून पहाड़ पर
  rationale: यह स्थान-नाम हिन्दी में सहज और पहचानने योग्य है तथा यूनानी के शाब्दिक अर्थ को भी बनाए रखता है।
- source_word: προσῆλθον αὐτῷ
  choice: उसके पास आए
  rationale: प्रसंग में क्रिया यीशु की ओर आकर निकट पहुँचने को व्यक्त करती है; यह आधुनिक हिन्दी में स्वाभाविक कथात्मक प्रयोग है।
- source_word: οἱ μαθηταὶ
  choice: चेले
  rationale: ‘चेला’ सामान्य आधुनिक हिन्दी में गुरु के शिष्य के लिए स्पष्ट और बाइबिलीय संदर्भ में परिचित शब्द है।
- source_word: κατ’ ἰδίαν
  choice: एकांत में
  rationale: यह दूसरों से अलग होकर निजी रूप से बात करने का अर्थ सहज ढंग से व्यक्त करता है।
- source_word: Εἰπὸν ἡμῖν
  choice: हमें बताइए
  rationale: आज्ञार्थक अनुरोध को हिन्दी में आदरसूचक और स्वाभाविक प्रत्यक्ष कथन के रूप में व्यक्त किया गया है।
- source_word: πότε ταῦτα ἔσται
  choice: ये बातें कब होंगी
  rationale: ‘होंगी’ यूनानी εἰμί की व्यापक भविष्यवाचक अभिव्यक्ति को बनाए रखता है और निकट संदर्भ की बातों की ओर संकेत करता है।
- source_word: σημεῖον
  choice: चिन्ह
  rationale: भविष्यसूचक संदर्भ में σημεῖον का प्रचलित और अर्थ-सटीक हिन्दी रूप है।
- source_word: παρουσίας
  choice: आगमन
  rationale: यहाँ शब्द भविष्य में आने या उपस्थित होने की घटना की ओर संकेत करता है; ‘आगमन’ उस भाव को स्पष्ट रखते हुए मूल शब्द की गरिमा बनाए रखता है।
- source_word: συντελείας τοῦ αἰῶνος
  choice: युग के अंत
  rationale: यह किसी युग की पूर्णता या समाप्ति को व्यक्त करता है, न कि अनिवार्य रूप से भौतिक संसार के विनाश को।
theological_decisions:
- issue: अंतकालीन प्रसंग में παρουσία का अनुवाद
  choice: आगमन
  alternative: उपस्थिति; आना
  rationale: मूल शब्द उपस्थिति, पहुँचने या आगमन का भाव रख सकता है। प्रश्न का भविष्याभिमुख संदर्भ ‘आगमन’ का समर्थन करता है, जबकि पादटिप्पणी वास्तविक शब्दार्थगत विस्तार को सुरक्षित रखती है और आगमन के समय या ढंग का निर्णय नहीं करती।
- issue: συντελείας τοῦ αἰῶνος का अर्थ
  choice: युग के अंत
  alternative: युग की पूर्णता; संसार का अंत
  rationale: यूनानी पद मुख्यतः वर्तमान युग की समाप्ति या चरम पूर्णता बताता है। ‘युग के अंत’ से भौतिक संसार के विनाश का अतिरिक्त दावा पाठ में नहीं जोड़ा जाता।
- issue: एकवचन σημεῖον और दो संबंधकारक पद
  choice: आपके आगमन तथा युग के अंत का चिन्ह
  alternative: आपके आगमन का और युग के अंत का चिन्ह
  rationale: एकवचन ‘चिन्ह’ दोनों संबद्ध पदों के साथ रखा गया है, लेकिन इससे यह अतिरिक्त निष्कर्ष नहीं निकाला गया कि दोनों घटनाएँ हर दृष्टि से एक ही हैं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। यीशु को सीधे संबोधित करते समय आदरसूचक ‘आप’ और ‘बताइए’ का प्रयोग किया गया है; वर्णन में अनावश्यक रूप से अत्यधिक संस्कृतनिष्ठ भाषा से बचा गया है।
