id: MAT.24.31
reference: Matthew 24:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: hi
  text: और वह तुरही की ऊँची ध्वनि के साथ[a] अपने स्वर्गदूतों को भेजेगा, और वे उसके चुने हुओं[b] को चारों पवनों से[c]—आकाश के एक छोर से दूसरे छोर तक[d]—इकट्ठा करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक बड़ी तुरही के साथ” अथवा “तुरही-नाद के साथ।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसके निर्वाचितों को।”
    reason: lexical_alternative
  - marker: c
    text: “चारों पवन” हर दिशा के सबसे दूर के स्थानों को सूचित करने वाला मुहावरा है।
    reason: cultural_note
  - marker: d
    text: यूनानी में शाब्दिक रूप से, “आकाशों के छोरों से उनके छोरों तक”; अर्थात एक चरम सीमा से दूसरी चरम सीमा तक।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: भेजेगा
  rationale: भविष्यकालीन क्रिया का सीधा और स्वाभाविक हिन्दी रूप; प्रसंग में भेजे जाने के साथ अधिकार और कार्यभार निहित हैं, इसलिए अलग से ‘नियुक्त करके’ जोड़ना आवश्यक नहीं।
- source_word: ἀγγέλους
  choice: स्वर्गदूतों
  rationale: इस युगांत-संबंधी प्रसंग में अलौकिक दूत अभिप्रेत हैं; ‘स्वर्गदूत’ आधुनिक हिन्दी में स्पष्ट और प्रचलित है।
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: तुरही की ऊँची ध्वनि के साथ
  rationale: μετά संबंध/साथ को व्यक्त करता है; σάλπιγξ तुरही है और μεγάλη यहाँ ध्वनि की प्रबलता का संकेत दे सकता है। यह रूप हिन्दी में स्वाभाविक है, जबकि ‘बड़ी तुरही’ वाद्य के आकार का भ्रम दे सकता है। अन्य संभव अर्थ पाद-टिप्पणी में रखे गए हैं।
- source_word: ἐπισυνάξουσιν
  choice: इकट्ठा करेंगे
  rationale: क्रिया का अर्थ अलग-अलग स्थानों से एक साथ जमा करना है; ‘इकट्ठा करेंगे’ सरल, वर्तमान और अर्थ-संगत हिन्दी है।
- source_word: ἐκλεκτούς
  choice: चुने हुओं
  rationale: मूल शब्द का चुनाव-संबंधी अर्थ स्पष्ट रहता है, पर ऐसा पारिभाषिक शब्द नहीं अपनाया जाता जो पद में न बताई गई किसी विशिष्ट धर्मवैज्ञानिक व्यवस्था को पहले से मान ले।
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: चारों पवनों से
  rationale: शाब्दिक बिंब को सुरक्षित रखा गया है। यह चारों ओर की सबसे दूर की दिशाओं से समेटे जाने का मुहावरा है, जिसकी व्याख्या पाद-टिप्पणी में दी गई है।
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: आकाश के एक छोर से दूसरे छोर तक
  rationale: यह सम्पूर्ण विस्तार बताने वाला मुहावरा है। हिन्दी में एकवचन ‘आकाश’ स्वाभाविक है; यूनानी के बहुवचन और अधिक शाब्दिक संरचना को पाद-टिप्पणी में बताया गया है।
theological_decisions:
- issue: युगांत-संबंधी प्रसंग में ἐκλεκτούς का अनुवाद
  choice: चुने हुओं
  alternative: निर्वाचितों
  rationale: ‘चुने हुए’ मूल अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है और पद द्वारा न समझाई गई किसी विशेष मत-व्यवस्था को आरोपित नहीं करता।
- issue: समेटे जाने के क्षेत्र की व्यापकता
  choice: चारों पवनों से—आकाश के एक छोर से दूसरे छोर तक
  alternative: चारों दिशाओं से, पृथ्वी के एक सिरे से दूसरे सिरे तक
  rationale: मूल के आकाशीय और दिशात्मक बिंब को संकुचित करके केवल पृथ्वी के भूगोल तक सीमित नहीं किया गया; उसकी व्यापकता और काव्यात्मक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चारों पवनों’ से मूल का बाइबलीय बिंब बचता है, जबकि पाद-टिप्पणी उसका अर्थ स्पष्ट करती है। वाक्य में दीर्घ विराम-चिह्न समेटे जाने की भौगोलिक/ब्रह्मांडीय व्यापकता को मुख्य क्रिया से स्पष्ट रूप से जोड़ते हैं।
