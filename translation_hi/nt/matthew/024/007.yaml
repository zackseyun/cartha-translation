source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: hi
  text: क्योंकि राष्ट्र राष्ट्र के विरुद्ध उठ खड़ा होगा[a], और राज्य राज्य के विरुद्ध, और जगह-जगह[b] अकाल पड़ेंगे और भूकंप आएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राष्ट्र के विरुद्ध उठेगा।’ यूनानी मुहावरा लोगों या राष्ट्रों के बीच शत्रुता भड़कने का भाव व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अलग-अलग स्थानों में’ अथवा ‘एक स्थान से दूसरे स्थान तक।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: उठ खड़ा होगा
  rationale: इस प्रसंग में ἐγείρω का भाव किसी के विरुद्ध शत्रुता या संघर्ष के लिए उठने का है। ‘उठ खड़ा होगा’ स्वाभाविक हिन्दी में इस सक्रिय संघर्ष-भाव को व्यक्त करता है और किसी अनकहे कर्ता द्वारा उठाए जाने का अर्थ नहीं जोड़ता।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: ἔθνος
  choice: राष्ट्र
  rationale: ἔθνος यहाँ सामूहिक जातीय-राजनीतिक समुदाय को दर्शाता है और समानांतर ‘राज्य’ के साथ बड़े स्तर के संघर्ष का संकेत देता है।
- source_word: ἐπὶ ἔθνος
  choice: राष्ट्र के विरुद्ध
  rationale: इस शत्रुतापूर्ण मुहावरे में ἐπί के साथ कर्मकारक का अर्थ ‘के विरुद्ध’ है, न कि स्थानवाचक ‘पर’।
- source_word: βασιλεία
  choice: राज्य
  rationale: यहाँ βασιλεία राजकीय सत्ता के अधीन राजनीतिक क्षेत्र को दर्शाता है; ‘राज्य’ आधुनिक हिन्दी में स्वाभाविक है और राष्ट्रों के समानांतर राजनीतिक अर्थ बनाए रखता है।
- source_word: ἔσονται
  choice: पड़ेंगे … आएँगे
  rationale: यूनानी अस्तित्ववाचक अभिव्यक्ति को हिन्दी में दोनों घटनाओं के स्वाभाविक क्रिया-संयोग—‘अकाल पड़ना’ और ‘भूकंप आना’—से व्यक्त किया गया है।
- source_word: λιμοὶ
  choice: अकाल
  rationale: बहुवचन λιμοί भोजन की गंभीर कमी की घटनाओं को दर्शाता है। हिन्दी में ‘अकाल पड़ेंगे’ संख्या और घटना-दोनों का भाव स्वाभाविक रूप से देता है।
- source_word: σεισμοὶ
  choice: भूकंप
  rationale: इस संदर्भ में σεισμοί का सीधा और मानक अर्थ ‘भूकंप’ है; बहुवचन क्रिया ‘आएँगे’ से स्पष्ट है।
- source_word: κατὰ τόπους
  choice: जगह-जगह
  rationale: यह वितरणवाचक पद अलग-अलग अनेक स्थानों में घटनाएँ होने का भाव देता है। ‘जगह-जगह’ संक्षिप्त, वर्तमान और सहज हिन्दी है।
theological_decisions:
- issue: अंत-समय के संघर्ष के कथन में ἔθνος का दायरा
  choice: राष्ट्र
  alternative: लोग; जाति
  rationale: ‘राज्य के विरुद्ध राज्य’ के समानांतर ‘राष्ट्र’ बड़े सामाजिक-राजनीतिक समुदायों के संघर्ष को सबसे उपयुक्त रूप से व्यक्त करता है और इसे केवल गैर-यहूदियों या केवल जातीय समूहों तक सीमित नहीं करता।
- issue: ἐγερθήσεται के भविष्यत् रूप का अभिप्राय
  choice: उठ खड़ा होगा
  alternative: उठाया जाएगा; उठेगा
  rationale: मुहावरा संघर्ष आरम्भ होने का वर्णन करता है। अनुवाद किसी निहित दैवी कर्ता को नहीं जोड़ता, पर यूनानी रूप में संभावित निष्क्रियता को सिद्धान्तगत निष्कर्ष बनाकर भी प्रस्तुत नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अकाल पड़ना’ और ‘भूकंप आना’ जैसे स्वाभाविक हिन्दी क्रिया-संयोग अपनाए गए हैं। यूनानी समानांतरता बनाए रखने के लिए ‘राष्ट्र राष्ट्र के विरुद्ध’ और ‘राज्य राज्य के विरुद्ध’ रखा गया है; दूसरे खंड के बाद पूर्ण विराम हिन्दी में लंबी सूची को स्पष्ट करता है।
