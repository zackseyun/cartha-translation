  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: hi
  text: और वह उसे दो टुकड़ों में काट डालेगा[a] और पाखंडियों के साथ उसका भाग नियत करेगा[b]। वहाँ रोना और दाँत पीसना होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक मुहावरेदार रूप में, “उसे कठोर दंड देगा।” यूनानी क्रिया का शाब्दिक अर्थ “दो भागों में काटना” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, “पाखंडियों के साथ उसका हिस्सा नियत करेगा।” यहाँ “भाग” से किसी को मिलने वाला हिस्सा, दशा या नियति सूचित हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: उसे दो टुकड़ों में काट डालेगा
  rationale: यूनानी क्रिया का सीधा अर्थ किसी को दो भागों में काटना है। मुख्य पाठ में इसकी कठोर और सजीव भाषा सुरक्षित रखी गई है; संभावित भावार्थ पादटिप्पणी में दिया गया है।
- source_word: μέρος
  choice: भाग
  rationale: μέρος का मूल अर्थ ‘भाग’ या ‘हिस्सा’ है। ‘भाग ठहराएगा’ आवंटित दशा या नियति का भाव रखता है और उसे केवल भौतिक स्थान तक सीमित नहीं करता।
- source_word: ὑποκριτῶν
  choice: पाखंडियों
  rationale: मत्ती में यह शब्द झूठी बाहरी धार्मिकता दिखाने वालों के लिए बार-बार आता है। ‘पाखंडी’ आधुनिक हिन्दी में परिचित और विषयगत रूप से संगत है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: यह अभी बताई गई न्याय की दशा या जगह की ओर संकेत करता है। ‘वहाँ’ यूनानी क्रियाविशेषण का संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: κλαυθμὸς
  choice: रोना
  rationale: ‘रोना’ मत्ती में बार-बार आने वाले न्याय-सूत्र की सहज, स्पष्ट और संगत अभिव्यक्ति है।
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: दाँत पीसना
  rationale: यह यूनानी पदबंध की सजीवता बनाए रखने वाला और हिन्दी में सुबोध पारंपरिक समतुल्य है।
theological_decisions:
- issue: क्या διχοτομήσει की ठोस भाषा को सामान्य दंड-सूत्र में नरम किया जाए
  choice: मुख्य पाठ में ‘उसे दो टुकड़ों में काट डालेगा’ रखा गया
  alternative: ‘उसे कठोर दंड देगा’
  rationale: मूल क्रिया की ठोस छवि चेतावनी की तीव्रता बनाए रखती है। इसे केवल रूपक या दंड की किसी विशिष्ट धार्मिक व्याख्या के रूप में तय नहीं किया गया; अधिक मुहावरेदार संभावना पादटिप्पणी में है।
- issue: τὸ μέρος αὐτοῦ ... θήσει से सूचित परिणाम को कैसे व्यक्त किया जाए
  choice: ‘पाखंडियों के साथ उसका भाग ठहराएगा’
  alternative: ‘उसे पाखंडियों के बीच जगह देगा’
  rationale: ‘भाग’ मूल शब्द के हिस्से, आवंटन या नियति संबंधी खुलेपन को बनाए रखता है और पाठ को केवल स्थान के अर्थ तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पाखंडी’, ‘रोना’ और ‘दाँत पीसना’ मत्ती की परिचित शब्दावली से संगति रखते हैं। कठोर मूल बिंब और ‘भाग’ की अर्थगत खुली प्रकृति को बिना संप्रदायगत व्याख्या के सुरक्षित रखा गया है।
