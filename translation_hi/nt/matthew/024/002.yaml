  naturalness: “उत्तर में उनसे कहा” is understandable but less natural than “उत्तर देकर उनसे कहा.” The revised wording is fluent modern standard Hindi while retaining the source’s two-part expression.
  terminology: “सच कहता हूँ,” “पत्थर,” and “ढा दिए जाएँगे” are appropriate, clear, and suitably dignified. The footnote correctly presents “नष्ट कर दिया जाएगा” as a lexical alternative without overinterpreting the prediction.
