  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Οὐ βλέπετε ⸂ταῦτα πάντα⸃; ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: hi
  text: पर उसने उत्तर देकर उनसे कहा, “क्या तुम यह सब नहीं देखते? मैं तुमसे सच कहता हूँ, यहाँ एक भी पत्थर दूसरे पत्थर पर नहीं छोड़ा जाएगा; सब ढा दिए जाएँगे[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नष्ट कर दिया जाएगा।” यूनानी क्रिया किसी संरचना को खोलकर गिराने या ध्वस्त करने का अर्थ दे सकती है; “ढा दिए जाएँगे” पत्थरों के अपने स्थान से गिराए जाने का चित्र बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: उत्तर में ... कहा
  rationale: यह सहभागी क्रिया और मुख्य क्रिया का सामी-प्रभावित यूनानी प्रयोग है। ‘उत्तर में ... कहा’ दोनों तत्वों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Οὐ βλέπετε
  choice: क्या तुम ... नहीं देखते?
  rationale: οὐ के साथ यह अलंकारिक प्रश्न सहमति की अपेक्षा करता है। ‘देखते’ यहाँ प्रत्यक्ष दृष्टि और ध्यानपूर्वक पहचान—दोनों अर्थों के लिए उपयुक्त है।
- source_word: ταῦτα πάντα
  choice: यह सब
  rationale: यूनानी में नपुंसकलिंग बहुवचन है, जो पिछले पद में उल्लिखित मन्दिर की इमारतों की ओर संकेत करता है। हिन्दी में सामूहिक ‘यह सब’ अधिक स्वाभाविक है और उसी पूरे दृश्य को समेटता है।
- source_word: ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यह यीशु के गंभीर और अधिकारपूर्ण कथन-सूत्र को स्पष्ट, प्रतिष्ठित आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὐ μὴ ἀφεθῇ
  choice: नहीं छोड़ा जाएगा
  rationale: οὐ μή और एओरिस्ट सब्जंक्टिव प्रबल निषेध व्यक्त करते हैं। ‘एक ... भी नहीं’ के साथ यह हिन्दी में भविष्यवाणी की निश्चितता और पूर्णता स्पष्ट करता है।
- source_word: ὧδε
  choice: यहाँ
  rationale: यह सीधा स्थानवाचक क्रियाविशेषण है और तत्कालीन मन्दिर-परिसर की ओर संकेत करता है।
- source_word: λίθος ἐπὶ λίθον
  choice: एक पत्थर पर दूसरा पत्थर
  rationale: यह निर्माण के पत्थरों के एक-दूसरे पर टिके रहने का चित्र स्वाभाविक हिन्दी में सुरक्षित रखता है। ‘भी नहीं’ सम्पूर्ण विध्वंस के बल को व्यक्त करता है।
- source_word: καταλυθήσεται
  choice: ढा दिया जाएगा
  rationale: इस प्रसंग में क्रिया किसी संरचना को गिराने या ध्वस्त करने का बोध देती है। ‘ढा दिया जाएगा’ पत्थरों को उनके स्थान से गिराए जाने का ठोस चित्र बनाए रखता है।
theological_decisions:
- issue: मन्दिर के विषय में यीशु की भविष्यवाणी का दायरा और बल
  choice: पद को मन्दिर के पूर्ण भौतिक विध्वंस की ठोस भविष्यवाणी के रूप में प्रस्तुत किया गया है।
  alternative: इसे मुख्यतः न्याय का प्रतीक मानना या किसी विशेष बाद की युगान्त-विषयक व्यवस्था से स्पष्ट रूप से बाँधना।
  rationale: पत्थरों के एक-दूसरे पर न छोड़े जाने और ढा दिए जाने की भाषा ठोस तथा स्थापत्य-संबंधी है। अनुवाद इसी बल को सुरक्षित रखता है, पर पद में स्पष्ट न किए गए किसी विशिष्ट धर्मसैद्धान्तिक ढाँचे को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण रखी गई है। ‘उत्तर में ... कहा’ स्रोत की अभिव्यक्ति को बिना कृत्रिम दोहराव के दर्शाता है। ‘यह सब’ हिन्दी की स्वाभाविक सामूहिक अभिव्यक्ति है। अर्धविराम मूल वाक्य के निषेध और उसके सर्वसमावेशी परिणाम के संबंध को स्पष्ट करता है।
