  choice: साथी दास
  alternative: साथी सेवक
  rationale: दृष्टांत में एक स्वामी के अधीन बंधी हुई साझी सामाजिक स्थिति महत्त्वपूर्ण है; ‘दास’ इस बल को ‘सेवक’ से अधिक स्पष्ट रखता है।
- issue: μεθυόντων का चरित्रसूचक या तत्कालिक अर्थ
  choice: मतवाले
  alternative: जो नशे में रहते हैं
  rationale: ग्रीक कृदंत दोनों प्रकार से समझा जा सकता है; मुख्य पाठ में स्वाभाविक संज्ञात्मक रूप रखा गया है और पादटिप्पणी में व्यापक पक्ष बताया गया है।
