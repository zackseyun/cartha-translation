source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: hi
  text: और राज्य का यह शुभ समाचार[a] सारे संसार[b] में सब जातियों[c] के लिए गवाही के रूप में घोषित किया जाएगा, और तब अंत आएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राज्य का सुसमाचार।’
    reason: lexical_alternative
  - marker: b
    text: या ‘सारे बसे हुए संसार में।’
    reason: lexical_alternative
  - marker: c
    text: या ‘सब राष्ट्रों के लिए’ अथवा ‘सब जनसमूहों के लिए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: घोषित किया जाएगा
  rationale: भविष्यत् कर्मवाच्य सार्वजनिक और अधिकारपूर्ण घोषणा पर बल देता है। ‘घोषित किया जाएगा’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल कलीसियाई ‘प्रचार’ तक सीमित नहीं करता।
- source_word: εὐαγγέλιον
  choice: शुभ समाचार
  rationale: मूल अर्थ ‘अच्छी/शुभ खबर’ है। ‘शुभ समाचार’ सामान्य पाठक के लिए स्पष्ट रहते हुए प्रसंग का धार्मिक भार बनाए रखता है।
- source_word: τῆς βασιλείας
  choice: राज्य का
  rationale: सम्बन्धकारक रचना को सीधे बनाए रखता है और परमेश्वर के राज्य/शासन से सम्बन्धित शुभ समाचार का अर्थ देता है, बिना ‘राज्य के विषय में’ जैसी व्याख्यात्मक विस्तार के।
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: सारे संसार में
  rationale: οἰκουμένη का आशय बसे हुए मानव-संसार से है। ‘सारे संसार में’ आधुनिक हिन्दी में सहज है और व्यापक दायरा स्पष्ट करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: εἰς μαρτύριον
  choice: गवाही के रूप में
  rationale: 'यह उद्देश्य या परिणाम की शक्ति को बनाए रखता है: घोषणा गवाही का काम करेगी। यह अनावश्यक रूप से तय नहीं करता कि गवाही सुननेवालों के पक्ष में होगी या विरुद्ध।'
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: सब जातियों के लिए
  rationale: ἔθνη यहाँ संसार की जातियों/राष्ट्रों के लिए व्यापक शब्द है। हिन्दी बाइबलीय प्रयोग में ‘जातियाँ’ विभिन्न जनसमूहों को स्वाभाविक रूप से व्यक्त करता है और इसे केवल गैर-यहूदियों तक सीमित नहीं करता।
- source_word: ἥξει
  choice: आएगा
  rationale: ἥκω के सामान्य अर्थ ‘आना/पहुँचना’ को इस अन्तकालीन प्रसंग में सरल और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸ τέλος
  choice: अन्त
  rationale: मूल का सीधा और पर्याप्त रूप से गंभीर अर्थ देता है। ‘समापन’ या ‘अन्त-समय’ अधिक व्याख्यात्मक होते।
theological_decisions:
- issue: अन्तकालीन कथन में οἰκουμένη और ἔθνη का दायरा
  choice: ‘सारे संसार में’ और ‘सब जातियों के लिए’ द्वारा विश्वव्यापी विस्तार बनाए रखना
  alternative: οἰκουμένη को केवल पहली सदी के रोमी संसार तक सीमित करना, या ἔθνη को किसी विशिष्ट आधुनिक मिशन-श्रेणी के रूप में परिभाषित करना
  rationale: वचन ‘अन्त’ से पहले घोषणा का व्यापक दायरा प्रस्तुत करता है। अनुवाद ऐतिहासिक पूर्ति या अन्तकालीन समय-सारणी पर किसी विशेष मत का निर्णय किए बिना इस व्यापकता और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘शुभ समाचार’ पारदर्शी है, जबकि पारंपरिक ‘सुसमाचार’ पादटिप्पणी में सुरक्षित है। विरामचिह्न से मुख्य कथन की स्वाभाविक गति बनी रहती है।
