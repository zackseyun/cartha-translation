  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: hi
  text: जहाँ कहीं लाश होगी, वहीं गिद्ध[a] इकट्ठे होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उकाब’। यूनानी शब्द का अर्थ उकाब भी हो सकता है, पर लाश के पास इकट्ठे होने वाले पक्षियों के इस चित्र में ‘गिद्ध’ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: जहाँ कहीं ... होगी
  rationale: ὅπου के साथ ἐάν और संभावनार्थक ᾖ अनिश्चित स्थानवाचक अर्थ देता है। ‘जहाँ कहीं’ इसे स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: πτῶμα
  choice: लाश
  rationale: πτῶμα गिरे हुए मृत शरीर को सूचित करता है। आधुनिक सामान्य हिन्दी में ‘लाश’ संक्षिप्त, स्पष्ट और स्वाभाविक है; ‘शव’ अधिक औपचारिक और ‘मृत देह’ अपेक्षाकृत वर्णनात्मक होता।
- source_word: συναχθήσονται
  choice: इकट्ठे होंगे
  rationale: यद्यपि रूप भविष्यत् कर्मवाच्य है, पक्षियों के विषय में इसका स्वाभाविक हिन्दी अर्थ ‘इकट्ठे होंगे’ है। ‘इकट्ठे किए जाएँगे’ अनावश्यक रूप से किसी बाहरी कर्ता का आभास देता।
- source_word: ἀετοί
  choice: गिद्ध
  rationale: ἀετός का सामान्य अर्थ ‘उकाब’ हो सकता है, पर लाश के चारों ओर एकत्र होने वाले पक्षियों के इस चित्र में ‘गिद्ध’ संदर्भानुकूल है। मूल शब्द की वास्तविक वैकल्पिक संभावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: कहावत के चित्र का युगांत-संबंधी अभिप्राय
  choice: लाश और पक्षियों के चित्र को सीधे अनूदित किया गया है, उसके प्रतीकों की पहचान नहीं की गई।
  alternative: इसे अनिवार्य न्याय, मनुष्य के पुत्र के आगमन की दृश्यता, यरूशलेम के विनाश, या रोमी चिह्नों का स्पष्ट संकेत बनाना।
  rationale: यूनानी वाक्य स्वयं लाश या पक्षियों का प्रतीकात्मक अभिप्राय निश्चित नहीं करता। इसलिए अनुवाद व्यापक संदर्भ की व्याख्यात्मक संभावनाओं को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जहाँ कहीं’ मूल की अनिश्चितता व्यक्त करता है, जबकि ‘लाश’ और ‘इकट्ठे होंगे’ सामान्य पाठक के लिए सीधे और स्वाभाविक हैं।
