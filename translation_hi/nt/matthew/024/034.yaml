id: MAT.24.34
reference: Matthew 24:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: hi
  text: मैं तुमसे सच कहता हूँ कि यह पीढ़ी[a] तब तक निश्चय ही नहीं बीतेगी, जब तक ये सब बातें घटित न हो जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ये लोग’ अथवा ‘यह वंश।’ यूनानी शब्द का अर्थ अधिक व्यापक भी हो सकता है, पर यहाँ ‘पीढ़ी’ उसका सबसे सीधा अनुवाद है।
    reason: वैकल्पिक अर्थ
lexical_decisions:
- source_word: ἀμὴν
  choice: सच
  rationale: आरंभिक कथन-सूत्र में यह यीशु की गंभीर और विश्वसनीय पुष्टि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; लिप्यंतरण ‘आमीन’ की अपेक्षा सामान्य पाठक के लिए अधिक स्पष्ट है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यह प्रत्यक्ष संबोधन और कथन-सूत्र दोनों को सहज, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ὅτι
  choice: कि
  rationale: यह गंभीर कथन के बाद आने वाले विषयवाचक उपवाक्य को स्पष्ट रूप से जोड़ता है।
- source_word: οὐ μὴ παρέλθῃ
  choice: निश्चय ही नहीं बीतेगी
  rationale: οὐ μή के प्रबल निषेध को ‘निश्चय ही नहीं’ व्यक्त करता है, और παρέρχομαι के लिए ‘बीतना’ पीढ़ी के संबंध में स्वाभाविक रहते हुए मूल रूपक को बनाए रखता है।
- source_word: ἡ γενεὰ αὕτη
  choice: यह पीढ़ी
  rationale: γενεά का यहाँ सबसे सीधा और सामान्य अर्थ ‘पीढ़ी’ है। इससे विवादित कालांत-संबंधी व्याख्या को अनुवाद में पहले से तय नहीं किया जाता।
- source_word: ἕως ἂν
  choice: जब तक
  rationale: यह भविष्य की सीमा या प्रत्याशित घटना तक की अवधि को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: πάντα ταῦτα
  choice: ये सब बातें
  rationale: यह नपुंसकलिंग बहुवचन का स्वाभाविक हिन्दी रूप है और पूर्ववर्ती घटनाओं के पूरे समूह की ओर संकेत करता है।
- source_word: γένηται
  choice: घटित न हो जाएँ
  rationale: इस प्रसंग में γίνομαι घटनाओं के होने को सूचित करता है; यह रूप ‘जब तक’ वाले वाक्य में स्वाभाविक हिन्दी और अपेक्षित भविष्यगत पूर्णता दोनों देता है।
theological_decisions:
- issue: कालांत-संबंधी उपदेश में ‘ἡ γενεὰ αὕτη’ का अर्थ
  choice: मुख्य पाठ में ‘यह पीढ़ी’
  alternative: ‘ये लोग’ या ‘यह वंश’
  rationale: ‘यह पीढ़ी’ यूनानी का सबसे सीधा अर्थ है और यीशु के कथन में विद्यमान व्याख्यात्मक तनाव को सुरक्षित रखता है। अधिक व्यापक अर्थों को मुख्य पाठ में रखने से कोई विशिष्ट कालांत-संबंधी व्याख्या अनावश्यक रूप से निश्चित हो सकती है।
translation_notes:
  register: भाषा आधुनिक, सामान्य और गरिमापूर्ण रखी गई है। ‘मैं तुमसे सच कहता हूँ’ परिचित बाइबलीय गंभीरता बनाए रखता है, जबकि ‘निश्चय ही नहीं’ मूल के प्रबल निषेध को बिना पुरातन या अस्वाभाविक पदावली के व्यक्त करता है।
