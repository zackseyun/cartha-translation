lexical_decisions:
- source_word: οὐαί
  choice: हाय
  rationale: यह आसन्न विपत्ति पर भविष्यवाणी-सदृश शोक और गंभीर चेतावनी—दोनों का भाव बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: पिछली चेतावनी से हल्का संक्रमण और प्रसंगानुकूल विरोध दर्शाता है, बिना संबंध को अत्यधिक प्रबल बनाए।
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: जो गर्भवती होंगी
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी अर्थ देता है और स्त्रीलिंग रूप को क्रिया के स्त्रीलिंग बहुवचन द्वारा सुरक्षित रखता है।
- source_word: ταῖς θηλαζούσαις
  choice: जो शिशुओं को दूध पिलाती होंगी
  rationale: θηλάζω का आशय स्तनपान कराने से है; हिन्दी में निहित कर्म 'शिशुओं' को स्पष्ट करना अर्थ को सहज और परिस्थिति की कठिनाई को साफ करता है।
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: उन दिनों
  rationale: मूल समय-सूचक पदबंध का संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
theological_decisions:
- issue: स्त्रीलिंग संप्रदान कारक कृदंतों का संदर्भ
  choice: '''जो गर्भवती होंगी'' और ''जो शिशुओं को दूध पिलाती होंगी''—स्त्रीलिंग क्रियारूपों से संदर्भ व्यक्त करना'
  alternative: '''गर्भवती स्त्रियाँ'' और ''शिशुओं को दूध पिलाने वाली स्त्रियाँ'''
  rationale: यूनानी रूप स्पष्टतः स्त्रियों को सूचित करते हैं। हिन्दी में स्त्रीलिंग क्रियारूप यह बात स्वाभाविक ढंग से बनाए रखते हैं, जबकि मूल में न आए संज्ञा 'स्त्रियाँ' को मुख्य पाठ में जोड़ना आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गंभीर और भविष्यवाणी-सदृश शोक-वचन के अनुरूप। 'स्तनपान' की अपेक्षा 'दूध पिलाती' सामान्य पाठक के लिए अधिक सहज है।
