id: MAT.24.9
reference: Matthew 24:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: hi
  text: तब वे तुम्हें क्लेश[a] के हवाले कर देंगे और तुम्हें मार डालेंगे, और मेरे नाम के कारण[b] सभी राष्ट्र तुमसे घृणा करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “क्लेश” का अर्थ संकट, उत्पीड़न या भारी दुःख भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “मेरे नाम के कारण”; अर्थात यीशु के प्रति निष्ठा और उसके नाम से जुड़ी पहचान के कारण।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह समय और घटनाक्रम में अगले चरण को दिखाता है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: παραδώσουσιν ὑμᾶς εἰς θλῖψιν
  choice: वे तुम्हें क्लेश सहने के लिए सौंप देंगे
  rationale: παραδίδωμι किसी को दूसरे के अधिकार में सौंपने का भाव रखता है। θλῖψις के संकट, उत्पीड़न और क्लेश के व्यापक अर्थ को ‘क्लेश’ बनाए रखता है; ‘सहने के लिए’ हिन्दी में संबंध को स्पष्ट और स्वाभाविक करता है।
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: तुम्हें मार डालेंगे
  rationale: यह क्रिया हत्या या मृत्यु-दंड की रीति निर्धारित किए बिना किसी की जान लेने का सीधा अर्थ देती है।
- source_word: ἔσεσθε μισούμενοι
  choice: तुमसे घृणा करेंगी
  rationale: ग्रीक का भविष्यकालीन कर्मवाच्य हिन्दी में स्वाभाविक सक्रिय रचना में व्यक्त हुआ है; अर्थ वही है कि शिष्य घृणा के पात्र होंगे।
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: सब जातियाँ
  rationale: ἔθνη यहाँ व्यापक रूप से संसार की जातियों या राष्ट्रों को सूचित करता है। ‘सब जातियाँ’ हिन्दी बाइबलीय प्रयोग में परिचित है और केवल गैर-यहूदियों तक अर्थ को सीमित नहीं करता।
- source_word: διὰ τὸ ὄνομά μου
  choice: मेरे नाम के कारण
  rationale: διά और कर्मकारक कारण बताते हैं। यह अनुवाद ‘नाम’ की मूल अभिव्यक्ति को बनाए रखता है, जो यीशु के व्यक्तित्व और उसके प्रति निष्ठा का प्रतिनिधित्व करती है।
theological_decisions:
- issue: अंत-समय के प्रसंग में θλῖψις का अर्थ
  choice: क्लेश
  alternative: संकट; उत्पीड़न; दुःख
  rationale: ‘क्लेश’ व्यक्तिगत उत्पीड़न और व्यापक अंत-समय संबंधी संकट—दोनों की संभावित प्रतिध्वनि बनाए रखता है, बिना किसी विशिष्ट अंत-समय प्रणाली को आरोपित किए।
- issue: ἔθνη का दायरा
  choice: सब जातियाँ
  alternative: सब राष्ट्र; सब गैर-यहूदी
  rationale: प्रसंग विश्वव्यापी विरोध की ओर संकेत करता है। ‘गैर-यहूदी’ कहना अनावश्यक रूप से अर्थ को जातीय विरोध तक सीमित कर सकता है।
- issue: ‘मेरे नाम के कारण’ का आशय
  choice: मूल रूपक को मुख्य पाठ में बनाए रखना
  alternative: मेरे प्रति निष्ठा के कारण
  rationale: मूल पाठ ‘नाम’ कहता है; उसका प्रतिनिधिक आशय टिप्पणी में स्पष्ट करना बेहतर है, ताकि बाइबलीय अभिव्यक्ति और उसका धार्मिक तनाव सुरक्षित रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से स्पष्ट शैली। बहुवचन ‘तुम्हें/तुमसे’ शिष्यों को सामूहिक संबोधन व्यक्त करता है। मुख्य पाठ में ‘क्लेश’ और ‘नाम’ जैसे बाइबलीय शब्द रखे गए हैं, जबकि उनकी अर्थ-सीमा पादटिप्पणियों में स्पष्ट की गई है।
