source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: hi
  text: परन्तु उस दिन और घड़ी के विषय में कोई नहीं जानता—न स्वर्ग के दूत, न पुत्र—केवल पिता ही जानते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में ‘न पुत्र’ शब्द नहीं हैं। मुख्य पाठ SBLGNT के पाठ का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: परन्तु ... के विषय में
  rationale: περί के साथ संबंधकारक विषय का परिचय देता है, और δέ पिछले कथन से हल्का संक्रमण या विरोध दिखाता है। यह रूप दोनों बातों को स्वाभाविक हिन्दी में रखता है।
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: उस दिन और घड़ी
  rationale: एकवचन संकेतवाचक ἐκείνης समन्वित पदबंध को एक इकाई के रूप में निर्दिष्ट करता है। हिन्दी में यह रूप सहज है और निश्चित भावी समय की ओर संकेत बनाए रखता है।
- source_word: οὐδεὶς οἶδεν
  choice: कोई नहीं जानता
  rationale: οὐδείς सार्वभौमिक निषेध व्यक्त करता है और οἶδα यहाँ वर्तमान अर्थ में ‘जानना’ है।
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: न स्वर्ग के दूत
  rationale: οὐδέ निषेध की सूची में एक और पद जोड़ता है। ‘स्वर्ग के दूत’ τῶν οὐρανῶν का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: οὐδὲ ὁ υἱός
  choice: न पुत्र
  rationale: यह पिछले नकारात्मक पद के समन्वय में है। निश्चित उपाधि के रूप में υἱός को ‘पुत्र’ रखा गया है और कथन को न नरम किया गया है, न समझाकर विस्तृत।
- source_word: εἰ μὴ
  choice: केवल
  rationale: निषेधात्मक कथन के बाद εἰ μή अपवाद और विशिष्टता बताता है। ‘केवल ... ही’ हिन्दी में ‘सिवाय’ की तुलना में अधिक सहज वाक्य बनाता है।
- source_word: ὁ πατὴρ μόνος
  choice: केवल पिता ही जानते हैं
  rationale: μόνος ज्ञान को पिता तक सीमित करता है। आदरसूचक एकवचन क्रिया ‘जानते हैं’ आधुनिक हिन्दी में परमेश्वर के लिए स्वाभाविक है; ‘केवल ... ही’ विशिष्टता को स्पष्ट रखता है।
theological_decisions:
- issue: ‘न पुत्र’ का मसीह-विज्ञान संबंधी निहितार्थ
  choice: मुख्य पाठ में ‘न पुत्र’ को बिना नरम किए या व्याख्यात्मक विस्तार जोड़े बनाए रखना।
  alternative: पांडुलिपीय भिन्नता के कारण इस पदबंध को छोड़ना, अथवा पुत्र की अज्ञानता से उत्पन्न तनाव को घटाने के लिए व्याख्यात्मक पुनर्कथन करना।
  rationale: SBLGNT में οὐδὲ ὁ υἱός उपस्थित है। अनुवाद पद के वास्तविक धर्मवैज्ञानिक तनाव को सुरक्षित रखता है; व्यापक सिद्धान्तगत समन्वय अनुवाद में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘परन्तु’ हल्के विरोध/संक्रमण को रखता है; डैश नकारात्मक सूची को स्पष्ट करता है। फुटनोट चिह्न को पूरे वचन के अंत में रखा गया है क्योंकि टिप्पणी पाठगत भिन्नता से संबंधित है।
