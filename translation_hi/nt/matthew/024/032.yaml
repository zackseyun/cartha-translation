source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: hi
  text: 'अंजीर के पेड़ से यह दृष्टान्त[a] सीखो: जब उसकी डाली कोमल हो जाती है और पत्ते फूट निकलते हैं,[b] तब तुम जानते हो कि गरमी का मौसम निकट है।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शिक्षा” या “उदाहरण।”
    reason: lexical_alternative
  - marker: b
    text: या, “पत्ते निकलते हैं।”
    reason: lexical_alternative
  - marker: c
    text: “गरमी का मौसम” के लिए प्रयुक्त यूनानी शब्द कुछ संदर्भों में कटनी के मौसम को भी सूचित कर सकता है; यहाँ अंजीर के पेड़ की छवि के कारण मौसमी अर्थ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς μάθετε
  choice: अंजीर के पेड़ से ... सीखो
  rationale: ἀπό सहित संबंधकारक सीखने के स्रोत को बताता है; बहुवचन आज्ञार्थक μάθετε को स्वाभाविक हिन्दी में सीधे आदेश ‘सीखो’ से व्यक्त किया गया है। δέ का हल्का संक्रमणकारी बल हिन्दी में अलग शब्द जोड़े बिना प्रवाह से व्यक्त होता है।
- source_word: τὴν παραβολήν
  choice: यह दृष्टान्त
  rationale: παραβολή के लिए ‘दृष्टान्त’ सुसमाचारों की परिचित और गरिमापूर्ण हिन्दी है तथा आगामी प्राकृतिक तुलना को बनाए रखता है। ‘यह’ हिन्दी में निश्चितता और आगे आने वाली व्याख्या को सहज बनाता है।
- source_word: ὅταν ἤδη
  choice: जब ... लगते हैं
  rationale: ὅταν सामान्य कालगत परिस्थिति और ἤδη आरम्भ हो चुकने का भाव देता है; ‘जब’ तथा ‘निकलने लगते हैं’ मिलकर इस आरम्भिक मौसमी संकेत को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: उसकी डाली कोमल हो जाती है
  rationale: γένηται अवस्था-परिवर्तन और ἁπαλός नई बढ़त की कोमलता बताता है; ‘कोमल हो जाती है’ वनस्पति-संदर्भ में स्पष्ट और सहज है।
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: और पत्ते निकलने लगते हैं
  rationale: ἐκφύῃ का अर्थ अंकुरित होना या बाहर निकलना है। हिन्दी में पेड़ के लिए ‘पत्ते निकलने लगते हैं’ स्वाभाविक है और ἤδη के आरम्भिक भाव को भी वहन करता है।
- source_word: γινώσκετε
  choice: तुम जान लेते हो
  rationale: वर्तमानकालिक द्वितीय पुरुष बहुवचन को सामान्य अनुभव के कथन के रूप में रखा गया है, आज्ञा के रूप में नहीं। ‘जान लेते हो’ संकेत से निष्कर्ष पहचानने का भाव देता है।
- source_word: ἐγγὺς τὸ θέρος
  choice: गरमी का मौसम निकट है
  rationale: θέρος यहाँ अंजीर के पत्तों से पहचाने जाने वाले मौसमी ‘summer’ को दर्शाता है। ‘गरमी का मौसम’ आधुनिक मानक हिन्दी में ‘ग्रीष्म’ से अधिक सर्वसुलभ है और ‘कटनी’ की अनावश्यक व्याख्या से बचता है।
theological_decisions:
- issue: अंजीर के पेड़ की छवि का अर्थ
  choice: इसे निकट आते मौसम को संकेतों से पहचानने वाले प्राकृतिक दृष्टान्त के रूप में अनूदित किया गया है।
  alternative: अंजीर के पेड़ को अनुवाद में ही इस्राएल का प्रतीक ठहराना, या उसे मात्र एक असंबद्ध वनस्पति-उदाहरण कहना।
  rationale: इस पद का यूनानी पाठ अंजीर के पेड़ की प्रतीकात्मक पहचान स्पष्ट नहीं करता; इसलिए अनुवाद छवि को सुरक्षित रखता है और व्यापक युगान्त-विषयक व्याख्या को तय नहीं करता।
- issue: θέρος का आशय
  choice: गरमी का मौसम
  alternative: कटनी का समय
  rationale: शब्द कुछ संदर्भों में कटनी के समय से जुड़ सकता है, पर यहाँ कोमल डाली और निकलते पत्तों की मौसमी छवि ‘गरमी के मौसम’ को प्राथमिक बनाती है। पादटिप्पणी अन्य सम्भावना दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज पर गरिमापूर्ण बाइबलीय शैली। ‘अंजीर का पेड़’, ‘दृष्टान्त’, ‘कोमल’ और ‘निकट’ व्यापक रूप से समझे जाने वाले शब्द हैं। पद में निहित सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
