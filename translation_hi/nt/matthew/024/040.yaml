  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: hi
  text: उस समय दो पुरुष खेत में होंगे; एक को साथ ले लिया जाएगा[a] और दूसरे को छोड़ दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक को ले लिया जाएगा।’ इस क्रिया से अपने आप यह निश्चित नहीं होता कि उसे बचाने के लिए लिया जाता है या न्याय के लिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: उस समय
  rationale: यह कालवाचक क्रियाविशेषण इस कथन को पिछले अंत-समय संबंधी प्रसंग से जोड़ता है। ‘उस समय’ स्वाभाविक है और संदर्भित समय को स्पष्ट रखता है।
- source_word: δύο ἔσονται
  choice: दो पुरुष ... होंगे
  rationale: यूनानी में ‘दो होंगे’ है, और आगे के दोनों εἷς पुल्लिंग हैं। अगले पद में स्त्रियों का समानांतर उदाहरण होने के कारण यहाँ पुरुष संदर्भ को स्पष्ट करना उचित है।
- source_word: ἐν τῷ ἀγρῷ
  choice: खेत में
  rationale: यह स्थानवाचक पदबंध का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: εἷς ... εἷς
  choice: एक ... दूसरे
  rationale: यूनानी की संक्षिप्त विपरीतता को हिन्दी में स्पष्ट और स्वाभाविक बनाने के लिए ‘एक ... दूसरे’ चुना गया है।
- source_word: παραλαμβάνεται
  choice: साथ ले लिया जाएगा
  rationale: वर्तमानकालीन कर्मवाच्य रूप भविष्य के दृश्य में प्रयुक्त है। ‘साथ ले लिया जाएगा’ παραλαμβάνω के साथ ग्रहण किए जाने के भाव को व्यक्त करता है, पर अपने आप यह तय नहीं करता कि उद्देश्य उद्धार है या न्याय।
- source_word: ἀφίεται
  choice: छोड़ दिया जाएगा
  rationale: इस प्रसंग में कर्मवाच्य ἀφίημι का सीधा अर्थ ‘छोड़ दिया जाएगा’ है। इससे ‘पीछे छोड़ दिया जाएगा’ जैसी आधुनिक मत-संबंधी अतिरिक्त ध्वनि से बचा जाता है।
theological_decisions:
- issue: क्या παραλαμβάνεται उद्धार के लिए ले जाए जाने या न्याय के लिए ले जाए जाने को सूचित करता है
  choice: मुख्य पाठ में तटस्थ ‘साथ ले लिया जाएगा’ रखा गया है।
  alternative: ‘न्याय के लिए ले जाया जाएगा’ अथवा ‘सुरक्षा/उद्धार के लिए साथ लिया जाएगा’।
  rationale: निकटवर्ती नूह-संबंधी प्रसंग के कारण दोनों व्याख्याओं पर विवाद संभव है। क्रिया स्वयं उद्देश्य निश्चित नहीं करती, इसलिए अनुवाद इस धर्मवैज्ञानिक तनाव को अनिर्णीत रखता है।
- issue: क्या पुरुष संदर्भ को स्पष्ट किया जाए
  choice: ‘दो पुरुष’
  alternative: ‘दो जन’ अथवा केवल ‘दो’
  rationale: यद्यपि δύο में स्वयं लिंग व्यक्त नहीं होता, आगे के εἷς ... εἷς पुल्लिंग हैं और अगले पद का स्त्री-समानांतर इस पद में पुरुषों का दृश्य समर्थित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। भविष्यकालीन कर्मवाच्य दोनों क्रियाओं में समानांतर रखा गया है और मूल की व्याख्यात्मक अनिश्चितता पादटिप्पणी में सुरक्षित है।
