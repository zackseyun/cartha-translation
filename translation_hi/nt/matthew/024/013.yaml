  source_fidelity: ‘परन्तु’ δέ के हल्के विरोध को उचित रूप से दर्शाता है। ‘जो अन्त तक धीरज धरता रहेगा’ ὁ ... ὑπομείνας εἰς τέλος के परीक्षा में स्थिर रहने और अन्त-बिन्दु तक बने रहने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है। ‘वही’ οὗτος के पुनरुक्त, बलाघातपूर्ण संकेत को बनाए रखता है। ‘उद्धार पाएगा’ σωθήσεται के भविष्यकालीन निष्कर्ष को संप्रेषित करता है और पद के भीतर उद्धार के दायरे को अनावश्यक रूप से निश्चित नहीं करता।
