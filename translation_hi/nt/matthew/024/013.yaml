  text: ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/013.yaml
  text: But the one who endures to the end will be saved[a][b].
translation:
  language: hi
  text: परन्तु जो अन्त तक धीरज धरता रहेगा, वही उद्धार पाएगा[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अन्त आने तक।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘बचा लिया जाएगा।’ यूनानी क्रिया उद्धार या छुटकारा—दोनों का अर्थ दे सकती है; प्रसंग किसी एक अर्थ तक सीमित करने की माँग नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले पदों में ठोकर खाने, विश्वासघात और बैर की चेतावनियों के विपरीत एक हल्का विरोध दर्शाता है।
- source_word: ὁ ... ὑπομείνας
  choice: जो ... धीरज धरता रहेगा
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त किसी ऐसे व्यक्ति को दर्शाता है जो कठिनाई में स्थिर बना रहता है। यह रूप प्रतिनिधिक एकवचन और भविष्य तक जारी रहने का भाव स्वाभाविक हिन्दी में रखता है।
- source_word: εἰς τέλος
  choice: अन्त तक
  rationale: यह निरन्तरता को अन्तिम बिन्दु तक व्यक्त करता है; ‘अन्त तक’ संक्षिप्त और स्वाभाविक है।
- source_word: οὗτος
  choice: वही
  rationale: ‘वही’ यूनानी संकेतवाचक के बलाघात और पिछले कथन की पुनः पुष्टि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: σωθήσεται
  choice: उद्धार पाएगा
  rationale: भविष्यत् कर्मवाच्य का यह हिन्दी रूप बचाए जाने अथवा उद्धार पाने का व्यापक अर्थ रखता है और प्रसंग को केवल सांसारिक छुटकारे तक सीमित नहीं करता।
theological_decisions:
- issue: अन्त तक धीरज धरने के प्रसंग में σωθήσεται का आशय
  choice: ‘उद्धार पाएगा’ रखकर अन्तिम युगान्तकारी उद्धार और संकट से छुटकारे के बीच अर्थ को खुला रखा गया है।
  alternative: ‘बचा लिया जाएगा’ या ‘छुटकारा पाएगा’
  rationale: पद स्वयं यह निश्चित नहीं करता कि यहाँ केवल संकट से रक्षा, अन्तिम उद्धार, या दोनों अभिप्रेत हैं; इसलिए व्यापक धार्मिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘धीरज धरता रहेगा’ परीक्षा में स्थिर बने रहने का अर्थ व्यक्त करता है; ‘वही’ मूल के बलाघात को बनाए रखता है।
