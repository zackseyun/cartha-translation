  terminology: ‘उद्धार’ बाइबिलीय हिन्दी का स्थापित शब्द है। फुटनोट b ‘बचा लिया जाएगा’ को वैकल्पिक रूप में देकर σῴζω के बचाव/छुटकारे वाले अर्थ को भी उचित रूप से दर्शाता है, बिना उसके दायरे पर किसी सम्प्रदायगत निष्कर्ष को थोपे।
