  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: hi
  text: क्योंकि जैसे जलप्रलय से पहले के दिनों में लोग खाते-पीते और विवाह करते तथा विवाह कराते[a] रहे, उस दिन तक, जिस दिन नूह जहाज़ में प्रवेश किया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विवाह करते और विवाह में दिए जाते।” यूनानी में दो अलग क्रियाएँ हैं; दूसरी का अर्थ किसी का विवाह कराना या किसी को विवाह में देना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: क्योंकि जैसे
  rationale: γάρ के व्याख्यात्मक बल और ὡς के तुलनात्मक अर्थ, दोनों को बनाए रखता है और पिछले पद से तुलना जोड़ता है।
- source_word: ἦσαν ... τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ γαμίζοντες
  choice: लोग खाते-पीते और विवाह करते तथा विवाह कराते रहे
  rationale: अपूर्णकालीन सहायक क्रिया और कृदंतों का संयुक्त रूप निरंतर चल रही गतिविधियों को व्यक्त करता है। हिन्दी में स्पष्टता के लिए निहित बहुवचन कर्ता को ‘लोग’ कहा गया है।
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: जलप्रलय से पहले के दिनों में
  rationale: कालगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; नूह के प्रसंग में κατακλυσμός के लिए ‘जलप्रलय’ परिचित और सटीक शब्द है।
- source_word: τρώγοντες καὶ πίνοντες
  choice: खाते-पीते
  rationale: सामान्य, निरंतर दैनिक गतिविधियों को बिना किसी अतिरिक्त नैतिक निंदा के व्यक्त करता है।
- source_word: γαμοῦντες
  choice: विवाह करते
  rationale: γαμέω का सामान्य अर्थ स्वयं विवाह करना है; यह अगले भिन्न क्रियापद के साथ समानांतरता बनाए रखता है।
- source_word: γαμίζοντες
  choice: विवाह कराते
  rationale: किसी अन्य व्यक्ति का विवाह कराने या उसे विवाह में देने का भाव रखता है और γαμοῦντες से यूनानी शब्दगत भेद को बचाता है।
- source_word: ἄχρι ἧς ἡμέρας
  choice: उस दिन तक जब
  rationale: चलती गतिविधियों की समय-सीमा को सहज आधुनिक हिन्दी में बताता है।
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: नूह जहाज़ में प्रवेश कर गया
  rationale: अपूर्ण दिनचर्या के विपरीत निर्णायक प्रवेश-घटना को व्यक्त करता है। नूह के विशाल जलयान के लिए ‘जहाज़’ आधुनिक हिन्दी में स्वाभाविक और पहचाना हुआ शब्द है।
theological_decisions:
- issue: क्या सूचीबद्ध गतिविधियों को पापपूर्ण भोग-विलास मानकर प्रस्तुत किया जाए या न्याय से पहले चल रहे सामान्य जीवन के रूप में
  choice: गतिविधियों को तटस्थ, सामान्य मानवीय कामों के रूप में प्रस्तुत किया गया है।
  alternative: शब्दावली में अतिभोग, लापरवाही या नैतिक दोष का संकेत जोड़ना।
  rationale: यूनानी कृदंत स्वयं खाने, पीने और विवाह करने को नैतिक विशेषणों से नहीं आँकते। संदर्भ का बल अचानक आने वाले न्याय से पहले सामान्य जीवन के चलते रहने पर है; इसलिए अनकही निंदा नहीं जोड़ी गई।
- issue: γαμίζοντες में विवाह कराने और विवाह में दिए जाने की संभावित दिशा
  choice: मुख्य पाठ में ‘विवाह कराते’ रखा गया है।
  alternative: ‘विवाह के लिए दिए जाते’ या ‘विवाह में दिए जाते’।
  rationale: क्रियापद सामान्यतः किसी का विवाह कराने या उसे विवाह में देने का सकर्मक भाव रख सकता है, जबकि कुछ व्याख्याएँ निष्क्रिय अर्थ ग्रहण करती हैं। मुख्य पाठ स्रोत के γαμοῦντες से भेद बनाए रखता है और पादटिप्पणी वास्तविक वैकल्पिक समझ दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक मुहावरा अपनाया गया है। ‘खाते-पीते’ सामान्य जीवन की निरंतरता को सहज ढंग से व्यक्त करता है। पद अगले वाक्य में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
