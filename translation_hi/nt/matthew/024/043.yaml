id: MAT.24.43
reference: Matthew 24:43
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: hi
  text: 'पर यह जान लो: यदि घर के स्वामी को मालूम होता कि चोर रात के किस पहर[a] आएगा, तो वह जागता रहता और अपने घर में सेंध न लगने देता।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पहर’ रात के एक समय-विभाग को दर्शाता है।
    reason: cultural_note
  - marker: b
    text: मूल शब्द का शाब्दिक भाव ‘खोदकर आर-पार करना’ है; प्राचीन घरों की दीवार में सेंध लगाकर भीतर घुसा जा सकता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: पर यह जान लो
  rationale: δέ से आए विचार-मोड़ को ‘पर’ व्यक्त करता है और γινώσκετε को प्रसंगानुसार सीधे निर्देश के रूप में सहज आधुनिक हिन्दी में रखा गया है।
- source_word: ὁ οἰκοδεσπότης
  choice: घर का स्वामी
  rationale: यह घराने के मुखिया या स्वामी का बोध कराता है। यह रूप आधुनिक ‘मकान-मालिक’ से जुड़ी किराये की धारणा से बचते हुए सामाजिक भूमिका को बनाए रखता है।
- source_word: ποίᾳ φυλακῇ
  choice: रात के किस पहर
  rationale: φυλακή यहाँ रात के समय-विभाग को सूचित करता है। हिन्दी में ‘पहर’ सांस्कृतिक और कालगत विशेषता को स्वाभाविक रूप से व्यक्त करता है; स्पष्टता के लिए ‘रात के’ जोड़ा गया है।
- source_word: ὁ κλέπτης ἔρχεται
  choice: चोर ... आएगा
  rationale: यूनानी वर्तमान ἔρχεται को काल्पनिक शर्त के भीतर हिन्दी के स्वाभाविक परिप्रेक्ष्य में भावी आगमन के रूप में व्यक्त किया गया है; निश्चित समय पहले से जानने का आशय बना रहता है।
- source_word: ἐγρηγόρησεν ἂν
  choice: वह जागता रहता
  rationale: γρηγορέω का रात में जागे रहने और चौकसी करने का अर्थ इस चोर-वाले चित्र में ‘जागता रहता’ से स्पष्ट और स्वाभाविक रूप में आता है।
- source_word: οὐκ ἂν εἴασεν
  choice: न ... होने देता
  rationale: यह प्रतिकल्पित परिणाम में अनुमति न देने या रोकने का अर्थ संक्षिप्त, सहज हिन्दी में व्यक्त करता है।
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: अपने घर में सेंध न लगने देता
  rationale: διορύσσω का मूल चित्र दीवार आदि खोदकर भीतर घुसने का है। ‘सेंध लगना’ हिन्दी में उस भौतिक चित्र और चोरी के प्रसंग दोनों को स्वाभाविक ढंग से संप्रेषित करता है।
theological_decisions:
- issue: घर के मुखिया के चित्र का अनुवाद
  choice: घर का स्वामी
  alternative: मकान-मालिक; गृहस्वामी
  rationale: यह एक दृष्टांतात्मक चित्र है, कोई सिद्धान्तगत उपाधि नहीं। ‘घर का स्वामी’ मूल सामाजिक भूमिका बनाए रखता है और आधुनिक किरायेदारी या केवल कानूनी संपत्ति-स्वामित्व का अनावश्यक भाव नहीं जोड़ता।
- issue: प्राचीन घर में चोरी के प्रवेश-चित्र को व्यक्त करना
  choice: घर में सेंध लगना
  alternative: घर को खोदकर आर-पार करना; घर में घुसना
  rationale: ‘सेंध लगना’ हिन्दी में मुहावरेदार होने के साथ मूल के भौतिक उल्लंघन को भी बनाए रखता है। शाब्दिक निर्माण-संबंधी चित्र पादटिप्पणी में स्पष्ट किया गया है।
- issue: शर्तवाचक कथन में चोर के आने का काल
  choice: आएगा
  alternative: आ रहा है; आने वाला है
  rationale: मूल का ἔρχεται रूप वर्तमान है, पर पूरी प्रतिकल्पित शर्त में हिन्दी ‘आएगा’ से घर के स्वामी द्वारा पहले से समय जानने का संबंध स्वाभाविक रूप में व्यक्त होता है; इससे चोर के आगमन की धार्मिक पहचान या समय के विषय में कोई अतिरिक्त निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पहर’ सामान्य हिन्दी में समझ में आने वाला सांस्कृतिक शब्द है, और ‘सेंध लगना’ चोरी के प्रसंग में स्वाभाविक मुहावरा होने के साथ मूल चित्र को भी काफी हद तक सुरक्षित रखता है।
