    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह समय और घटनाक्रम में अगले चरण को दिखाता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: σκανδαλισθήσονται
  choice: विश्वास से डगमगा जाएँगे
  rationale: इस संदर्भ में क्रिया दबाव के कारण ठोकर खाने या विश्वास से विमुख होने की गंभीर स्थिति बताती है। यह अनुवाद धार्मिक विचलन का संकेत देता है, पर पूर्ण धर्मत्याग को अनिवार्य नहीं ठहराता।
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; हिन्दी में ‘लोग’ जोड़ने से अर्थ स्वाभाविक और स्पष्ट होता है।
- source_word: ἀλλήλους
  choice: एक-दूसरे
  rationale: यह पारस्परिक क्रिया को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: παραδώσουσιν
  choice: पकड़वा देंगे
  rationale: मूल क्रिया का आधारभूत अर्थ किसी को अधिकारियों या शत्रुओं के हाथ सौंपना है। उत्पीड़न के संदर्भ में ‘पकड़वा देंगे’ विश्वासघात का भाव रखते हुए ठोस क्रिया को भी सुरक्षित रखता है।
- source_word: μισήσουσιν
  choice: नफ़रत करेंगे
  rationale: यह सक्रिय शत्रुता का सीधा और आधुनिक हिन्दी रूप है।
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: और तब ... और ... और ...
  rationale: बार-बार आए καί की संचयी लय और पिछले कथन से जुड़ाव को बनाए रखा गया है।
theological_decisions:
- issue: अंत-समय के उत्पीड़न के संदर्भ में σκανδαλισθήσονται का अर्थ
  choice: विश्वास से डगमगा जाएँगे
  alternative: ठोकर खाएँगे; विश्वास से फिर जाएँगे; आहत होकर विमुख हो जाएँगे
  rationale: संदर्भ विश्वास के दबाव में गंभीर विचलन की ओर संकेत करता है। ‘विश्वास से डगमगा जाएँगे’ इसकी धार्मिक गंभीरता को प्रकट करता है, लेकिन यह तय नहीं करता कि हर व्यक्ति स्थायी और पूर्ण धर्मत्याग करेगा।
- issue: παραδώσουσιν में सौंपने और विश्वासघात का संबंध
  choice: पकड़वा देंगे
  alternative: धोखा देंगे; सौंप देंगे
  rationale: यहाँ लोगों को उत्पीड़कों के हाथ देने की ठोस कार्रवाई और आपसी विश्वासघात दोनों निहित हैं। मुख्य पाठ ठोस कार्रवाई रखता है और पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
