  text: और तब बहुत-से लोग ठोकर खाएँगे[a], और एक-दूसरे को पकड़वा देंगे[b] और एक-दूसरे से नफ़रत करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘विश्वास से फिर जाएँगे’ या ‘आहत होकर विमुख हो जाएँगे।’
