  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: hi
  text: उसी प्रकार तुम भी, जब ये सब बातें देखो, तो जान लो कि वह[a] निकट है—द्वारों पर ही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ कर्ता स्पष्ट रूप से नहीं दिया गया है। ‘वह’ किसी व्यक्ति या किसी बात/घटना की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: उसी प्रकार तुम भी
  rationale: यह पिछले पद में अंजीर के पेड़ के उदाहरण से तुलना को व्यक्त करता है और शिष्यों पर दिए गए बल को बनाए रखता है।
- source_word: ὅταν ἴδητε
  choice: जब ... देखो
  rationale: ὅταν के साथ aorist subjunctive यहाँ भावी अवसर को दर्शाता है; आधुनिक हिन्दी में ‘जब ... देखो’ स्वाभाविक और सीधा है।
- source_word: πάντα ταῦτα
  choice: ये सब बातें
  rationale: यह यूनानी के नपुंसकलिंग बहुवचन को बिना ‘घटनाएँ’ जैसा अतिरिक्त अर्थ जोड़े स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γινώσκετε
  choice: जान लो
  rationale: यह बहुवचन आज्ञार्थक रूप की निर्देशात्मक शक्ति को बनाए रखता है।
- source_word: ἐγγύς
  choice: निकट
  rationale: यह स्थानिक अथवा समय-संबंधी निकटता—दोनों की संभावना को खुला रखते हुए मूल शब्द का सीधा समतुल्य है।
- source_word: ἐπὶ θύραις
  choice: द्वारों पर ही
  rationale: यह यूनानी के बहुवचन ‘द्वारों’ को बनाए रखता है; ‘ही’ मुहावरे में अत्यंत निकट होने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐγγύς ἐστιν
  choice: वह निकट है
  rationale: यूनानी में कर्ता व्यक्त नहीं है। हिन्दी का ‘वह’ किसी व्यक्ति अथवा किसी बात/घटना, दोनों की ओर संकेत कर सकता है, इसलिए मूल अस्पष्टता पर्याप्त रूप से बनी रहती है।
theological_decisions:
- issue: ἐγγύς ἐστιν का अव्यक्त कर्ता
  choice: ‘वह निकट है’ रखा गया और टिप्पणी में अस्पष्टता बताई गई
  alternative: ‘यह निकट है’ अथवा ‘वह [मनुष्य का पुत्र] निकट है’
  rationale: मूल यूनानी यह स्पष्ट नहीं करता कि निकट कौन या क्या है। इसलिए अनुवाद किसी व्यक्ति, घटना, राज्य या पूर्णता के समय में से किसी एक अर्थ को निर्णायक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘द्वारों पर’ मूल के बहुवचन को सुरक्षित रखता है, जबकि ‘ही’ अत्यंत निकटता के मुहावरेदार बल को व्यक्त करता है।
