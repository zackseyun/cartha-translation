source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: hi
  text: इसलिए तुम भी तैयार रहो, क्योंकि मनुष्य का पुत्र उस घड़ी आएगा जब तुम उसकी अपेक्षा नहीं करते[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस घड़ी जब तुम ऐसा नहीं सोचते या मानते।” यूनानी क्रिया का अर्थ “सोचना,” “मानना,” या प्रसंग के अनुसार “अपेक्षा करना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह पद को पिछले दृष्टांत और चेतावनी के निष्कर्ष से स्पष्ट रूप से जोड़ता है तथा कारणात्मक-निष्कर्षात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ ὑμεῖς
  choice: तुम भी
  rationale: καί और स्पष्ट सर्वनाम दोनों श्रोताओं के समावेश और बल को व्यक्त करते हैं; ‘तुम भी’ सहज और पर्याप्त रूप से बलयुक्त है।
- source_word: γίνεσθε ἕτοιμοι
  choice: तैयार रहो
  rationale: वर्तमान आज्ञार्थक रूप निरंतर तत्पर रहने की मुद्रा का आह्वान करता है। हिन्दी में ‘तैयार रहो’ ‘तैयार हो जाओ’ से अधिक स्वाभाविक रूप से इस स्थायी तत्परता को व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι आज्ञा का कारण बताता है, इसलिए कारणसूचक ‘क्योंकि’ उपयुक्त है।
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: जिस घड़ी तुम उसकी अपेक्षा नहीं करते
  rationale: दत्तिवयुक्त वाक्यांश कालसूचक है। δοκεῖτε का मूल अर्थ ‘सोचना/मानना’ हो सकता है, जबकि प्रसंग में ‘अपेक्षा करना’ अभिप्रेत भाव को स्वाभाविक हिन्दी में स्पष्ट करता है; मूल शब्द की व्यापकता पादटिप्पणी में रखी गई है। ‘उसकी’ से स्पष्ट होता है कि अपेक्षा मनुष्य के पुत्र के आने की है, न कि घड़ी की।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह स्थापित शाब्दिक पदवी है, जो इसकी सामी पृष्ठभूमि, दानिय्येली प्रतिध्वनि और मसीह-संबंधी गहराई को बिना व्याख्यात्मक रूप से समतल किए सुरक्षित रखती है।
- source_word: ἔρχεται
  choice: आएगा
  rationale: यूनानी वर्तमान रूप यहाँ भविष्यसूचक वर्तमान है। हिन्दी में ‘आएगा’ अनिर्धारित भावी घड़ी के प्रसंग में सबसे स्वाभाविक है; ‘आ रहा है’ निकटता का ऐसा अतिरिक्त संकेत दे सकता है जो इस वाक्य का मुख्य बल नहीं है।
theological_decisions:
- issue: मसीह-संबंधी पदवी ὁ υἱὸς τοῦ ἀνθρώπου का अनुवाद
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र
  rationale: ‘मनुष्य का पुत्र’ सुसमाचारों में प्रचलित, शाब्दिक और पहचानी जाने वाली पदवी है। यह उसके संभावित दानिय्येली संकेत और धर्मवैचारिक तनाव को सुरक्षित रखती है; ‘मानव-पुत्र’ अधिक कृत्रिम और कम प्रचलित है।
- issue: ἔρχεται के वर्तमान रूप का कालगत अर्थ
  choice: आएगा
  alternative: आ रहा है
  rationale: प्रसंग भावी और अज्ञात घड़ी की बात करता है, इसलिए हिन्दी भविष्यकाल अर्थ को स्पष्ट और स्वाभाविक बनाता है। इससे आगमन की निश्चितता बनी रहती है, जबकि ‘आ रहा है’ अनावश्यक रूप से तत्काल निकटता का आभास दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन रखा गया है। ‘घड़ी’ बाइबलीय काल-सूचक अर्थ में सामान्य पाठक के लिए परिचित है। वाक्य-क्रम में ‘उसी घड़ी’ मूल सम्बन्धवाचक रचना को स्वाभाविक हिन्दी में पूर्ण करता है।
