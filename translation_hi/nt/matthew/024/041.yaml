  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: hi
  text: दो स्त्रियाँ चक्की पर पीस रही होंगी[a][b]; एक ले ली जाएगी और एक छोड़ दी जाएगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘पीस रही’ वाला शब्द स्त्रीलिंग बहुवचन है; इसलिए यहाँ विशेष रूप से दो स्त्रियाँ अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘चक्की’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘हाथ की चक्की’ या अधिक विशेष रूप से ‘चक्की का पाट’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में केवल इतना कहा गया है कि ‘एक ले ली जाती है और एक छोड़ दी जाती है’; यहाँ यह स्पष्ट नहीं किया गया कि ले लिया जाना उद्धार के लिए है या न्याय के लिए।
    reason: alternative_reading
lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: दो स्त्रियाँ ... पीस रही होंगी
  rationale: स्त्रीलिंग बहुवचन कृदंत ἀλήθουσαι के कारण कर्ता विशेष रूप से स्त्रियाँ हैं। प्रसंग में चल रही क्रिया दिखाने के लिए हिंदी का भविष्यत् प्रगतिशील रूप स्वाभाविक है।
- source_word: ἐν τῷ μύλῳ
  choice: चक्की
  rationale: μύλος चक्की, मिल या चक्की के पाट को सूचित कर सकता है। घरेलू अनाज-पीसने के प्रसंग में ‘चक्की पीसना’ सहज आधुनिक हिंदी है और उपकरण को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: μία παραλαμβάνεται
  choice: एक ले ली जाएगी
  rationale: μία दोनों स्त्रियों में से एक को अलग करती है, और παραλαμβάνεται का निष्क्रिय अर्थ सीधे रूप में ‘ले ली जाएगी’ है। इससे यह अनिर्णीत रहता है कि लिया जाना उद्धार के लिए है या न्याय के लिए।
- source_word: καὶ μία ἀφίεται
  choice: और एक छोड़ दी जाएगी
  rationale: καὶ को सामान्य संयोजक ‘और’ तथा ἀφίεται को सीधे ‘छोड़ दी जाएगी’ किया गया है। ‘पीछे छोड़ दी जाएगी’ जैसी व्याख्यात्मक वृद्धि से बचा गया है।
theological_decisions:
- issue: स्त्रीलिंग कर्ताओं को स्पष्ट करना
  choice: ‘दो स्त्रियाँ’
  alternative: ‘दो जन’ या केवल ‘दो’
  rationale: यूनानी कृदंत स्त्रीलिंग बहुवचन है; इसलिए लिंग-सटीक अनुवाद में स्त्रियों को स्पष्ट करना आवश्यक है।
- issue: ‘ले लिए जाने’ और ‘छोड़ दिए जाने’ का उद्धार अथवा न्याय से संबंध
  choice: तटस्थ शब्दावली ‘ले ली जाएगी’ / ‘छोड़ दी जाएगी’
  alternative: एक को उद्धार के लिए लिया जाएगा और दूसरी को न्याय के लिए छोड़ा जाएगा; अथवा इसका उलटा
  rationale: इस पद में दोनों क्रियाओं का अंतिम धार्मिक आशय स्पष्ट नहीं किया गया है। इसलिए अनुवाद उस वास्तविक व्याख्यात्मक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। घरेलू क्रिया के लिए प्रचलित मुहावरा ‘चक्की पीसना’ रखा गया है। निष्क्रिय भविष्यकाल निकटवर्ती भविष्यसूचक प्रसंग से मेल खाता है और यूनानी वर्तमान-रूप की दृश्यात्मकता को स्वाभाविक हिंदी में व्यक्त करता है।
