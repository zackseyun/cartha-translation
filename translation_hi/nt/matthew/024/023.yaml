base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: hi
  text: तब यदि कोई तुमसे कहे, ‘देखो, मसीह यहाँ है!’ या ‘वह यहाँ है!’ तो विश्वास मत करना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण इस चेतावनी को पिछले कथन से जोड़ता है और घटनाक्रम का संकेत देता है।
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: यदि कोई तुमसे कहे
  rationale: यह अनिश्चित कर्ता वाली शर्त है; ‘कोई’ और ‘यदि’ आधुनिक हिंदी में इसके अर्थ को स्वाभाविक रूप से व्यक्त करते हैं। बहुवचन ὑμῖν के लिए सामूहिक ‘तुमसे’ रखा गया है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; ‘देखो’ वर्तमान हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: ὧδε
  choice: यहाँ
  rationale: स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिंदी समतुल्य है।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ शब्द अपेक्षित अभिषिक्त जन की उपाधि के रूप में प्रयुक्त है। हिंदी में ‘मसीह’ इस उपाधि का स्थापित और सहज रूप है।
- source_word: ἤ· Ὧδε
  choice: या, ‘वह वहाँ है!’
  rationale: यूनानी वाक्यांश संक्षिप्त और अध्याहृत है। हिंदी में कर्ता और क्रिया जोड़ने से दावा स्पष्ट होता है; दूसरे संकेत को ‘वहाँ’ कहना दो वैकल्पिक स्थान-दावों का स्वाभाविक संवादात्मक रूप देता है, यद्यपि मूल शब्द स्वयं ‘यहाँ’ है।
- source_word: μὴ πιστεύσητε
  choice: विश्वास मत करना
  rationale: μή के साथ यह निषेध है। हिंदी में प्रसंग से दावे का कर्म स्पष्ट होने के कारण अलग से ‘उस पर’ या ‘उस बात का’ जोड़ना आवश्यक नहीं है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: अभिषिक्त जन / ख्रीस्त
  rationale: इस प्रसंग में Χριστός किसी नाम-जैसे प्रयोग के बजाय विशिष्ट मसीही उपाधि है। ‘मसीह’ हिंदी पाठकों के लिए स्थापित है और झूठे पहचान-दावों के संदर्भ को बनाए रखता है।
- issue: दूसरे स्थान-सूचक दावे की अध्याहार-पूर्ति
  choice: वह वहाँ है!
  alternative: यहाँ! / वह यहाँ है!
  rationale: मूल Ὧδε का शाब्दिक अर्थ ‘यहाँ’ है और वाक्य अध्याहृत है। मुख्य पाठ में स्वाभाविक हिंदी के लिए ‘वह वहाँ है’ रखा गया है, लेकिन इससे मूल स्थानवाचक शब्द में एक संवादात्मक दृष्टिकोण-परिवर्तन आता है; अतः ‘वह यहाँ है’ अधिक स्रोत-सन्निकट विकल्प है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘तुमसे’ मूल के बहुवचन संबोधन को सामूहिक रूप में व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
