    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: निकलकर
  rationale: 'अोरिस्ट कृदन्त मुख्य क्रिया से पहले हुई सहायक क्रिया बताता है: यीशु पहले मन्दिर से निकले, फिर वहाँ से जा रहे थे।'
- source_word: ἱεροῦ
  choice: मन्दिर
  rationale: ἱερόν पूरे मन्दिर-परिसर को दर्शाता है, केवल भीतरी पवित्रस्थान को नहीं। मुख्य पाठ में प्रचलित और सहज शब्द ‘मन्दिर’ रखा गया है तथा व्यापक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐπορεύετο
  choice: वहाँ से जा रहे थे
  rationale: अपूर्ण भूतकाल चल रही गति को व्यक्त करता है। ‘जा रहे थे’ उस अपूर्ण पक्ष को स्वाभाविक हिन्दी में बनाए रखता है; ‘वहाँ से’ प्रस्थान का आशय स्पष्ट करता है।
- source_word: προσῆλθον
  choice: उनके पास आए
  rationale: προσέρχομαι का अर्थ यहाँ निकट आना है। ‘उनके पास आए’ आधुनिक हिन्दी में संबंध और दिशा दोनों स्पष्ट करता है।
- source_word: ἐπιδεῖξαι
  choice: दिखाने लगे
  rationale: अनन्त क्रिया चेलों के आने का उद्देश्य बताती है। हिन्दी वाक्य-प्रवाह में ‘आए और ... दिखाने लगे’ उद्देश्य तथा आरम्भ हुई क्रिया को सहज रूप से व्यक्त करता है।
- source_word: οἰκοδομὰς
  choice: भवन
  rationale: यह बहुवचन संज्ञा मन्दिर-परिसर की निर्मित इमारतों या संरचनाओं को दर्शाती है। हिन्दी में ‘भवन’ सामूहिक प्रसंग में स्वाभाविक है और अनेक इमारतों का अर्थ रखता है।
theological_decisions:
- issue: ἱερόν और ναός का भेद
  choice: मुख्य पाठ में ‘मन्दिर’, पादटिप्पणी में ‘पूरा मन्दिर-परिसर’
  alternative: मुख्य पाठ में ‘मन्दिर-परिसर’
  rationale: ἱερόν व्यापक मन्दिर-क्षेत्र का सूचक है, न कि केवल भीतरी पवित्रस्थान का। ‘मन्दिर’ सामान्य पाठक के लिए अधिक स्वाभाविक है, जबकि पादटिप्पणी मूल शब्द का सटीक विस्तार सुरक्षित रखती है।
