  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। ‘चेले’ साधारण पाठकों के लिए परिचित है। अपूर्ण क्रिया ἐπορεύετο को ‘जा रहे थे’ से व्यक्त किया गया है। पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित ‘मन्दिर’ के प्रथम उल्लेख के बाद रखा गया है।
