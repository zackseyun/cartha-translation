lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण घटनाक्रम में अगले चरण को दर्शाता है; ‘तब’ संक्षिप्त, स्वाभाविक और सटीक है।
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: जो लोग यहूदिया में हों
  rationale: लेख सहित पूर्वसर्गीय वाक्यांश यहाँ संज्ञा के रूप में प्रयुक्त होकर यहूदिया में उपस्थित लोगों को बताता है। ‘जो लोग ... में हों’ आधुनिक हिन्दी में स्वाभाविक है और संदर्भ की परिस्थितिजन्य छाया बनाए रखता है।
- source_word: Ἰουδαίᾳ
  choice: यहूदिया
  rationale: इस भौगोलिक नाम का हिन्दी बाइबलीय परंपरा में प्रचलित और स्पष्ट रूप ‘यहूदिया’ है।
- source_word: φευγέτωσαν
  choice: वे ... भाग जाएँ
  rationale: यह तृतीय पुरुष बहुवचन वर्तमान आज्ञार्थक रूप है। हिन्दी में ‘वे ... भाग जाएँ’ प्रत्यक्ष निर्देश और तात्कालिकता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπὶ τὰ ὄρη
  choice: पहाड़ों की ओर
  rationale: गति-सूचक क्रिया के साथ ἐπί और कर्मकारक लक्ष्य की दिशा दर्शाते हैं। ‘पहाड़ों की ओर’ गन्तव्य की ओर गति को स्पष्ट करता है, बिना अनावश्यक रूप से ‘अंदर’ का भाव जोड़ने के।
theological_decisions:
- issue: अंत-समय संबंधी चेतावनी में आज्ञार्थक क्रिया का बल
  choice: सीधे और तात्कालिक निर्देश के रूप में ‘वे ... भाग जाएँ’
  alternative: 'अधिक विधिसूचक रूप: ‘उन्हें ... भागना चाहिए’'
  rationale: मूल पाठ व्यावहारिक और तात्कालिक आदेश देता है। चुना हुआ रूप आज्ञार्थक बल को बनाए रखता है और किसी अतिरिक्त अंत-समय संबंधी व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘भाग जाएँ’ बोलचाल में स्पष्ट है और संकट की तात्कालिकता व्यक्त करता है; ‘पहाड़ों’ को ‘पहाड़ियों’ नहीं किया गया, ताकि ὄρη का बल कम न हो।
