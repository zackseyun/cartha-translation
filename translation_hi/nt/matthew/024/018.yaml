lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: जो खेत में हो
  rationale: यूनानी पदबंध किसी भी ऐसे व्यक्ति को दर्शाता है जो खेत में हो। यह अनुवाद एकवचन प्रतिनिधिक अर्थ को बनाए रखता है और अनावश्यक रूप से पुरुष तक सीमित नहीं करता।
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: पीछे न लौटे
  rationale: μή के साथ अओरिस्ट आज्ञार्थक तत्काल निषेध व्यक्त करता है। ἐπιστρέφω और ὀπίσω का संयुक्त भाव स्वाभाविक हिन्दी में ‘पीछे लौटना’ है।
- source_word: ἆραι
  choice: लेने के लिए
  rationale: यह क्रिया यहाँ लौटने का उद्देश्य बताती है; ‘लेने के लिए’ सरल और प्रसंगानुकूल है।
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: अपना चोगा
  rationale: ἱμάτιον प्रायः शरीर के ऊपर पहने जाने वाले बाहरी वस्त्र को दर्शाता है। कर्ता की ओर लौटता सम्बन्ध हिन्दी में ‘अपना’ से स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: व्यक्ति-सूचक पुल्लिंग लेख का प्रतिनिधिक अर्थ
  choice: जो खेत में हो
  alternative: जो पुरुष खेत में हो
  rationale: यूनानी व्याकरणिक रूप पुल्लिंग है, पर चेतावनी का आशय सामान्य और प्रतिनिधिक है। इसलिए हिन्दी में लिंग-निरपेक्ष पदबंध रखा गया है, बिना उसके व्यक्तिगत एकवचन भाव को खोए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पीछे न लौटे’ चेतावनी की तात्कालिकता को बनाए रखता है, और ‘चोगा’ के साथ पादटिप्पणी मूल शब्द की व्यापक अर्थ-सीमा दिखाती है।
