  text: ὥσπερ ⸀γὰρ αἱ ἡμέραι τοῦ Νῶε, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: hi
  text: क्योंकि जैसे नूह के दिन थे, वैसे ही मनुष्य के पुत्र का आगमन[a] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उपस्थिति’। यूनानी शब्द का अर्थ ‘उपस्थिति’ या ‘आगमन’ हो सकता है; यहाँ यह मनुष्य के पुत्र के भावी आगमन की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ … οὕτως
  choice: जैसे … वैसे ही
  rationale: यह स्वाभाविक हिन्दी सहसंबंधी रचना यूनानी तुलना के दोनों पक्षों और उसके बल को सुरक्षित रखती है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण या स्पष्टीकरण देता है; वाक्य के आरम्भ में ‘क्योंकि’ आधुनिक हिन्दी में इस संबंध को स्पष्ट रखता है।
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: नूह के दिन थे
  rationale: यूनानी के पहले तुलना-खंड में क्रिया निहित है। हिन्दी में तुलना पूर्ण और स्वाभाविक बनाने के लिए ‘थे’ की न्यूनतम पूर्ति की गई है।
- source_word: Νῶε
  choice: नूह
  rationale: यह नाम हिन्दी बाइबलीय परंपरा में प्रचलित और सामान्य पाठकों के लिए परिचित रूप में दिया गया है।
- source_word: ἔσται
  choice: होगा
  rationale: εἰμί के भविष्यत् रूप का सीधा और स्वाभाविक हिन्दी अनुवाद है; इससे घटना के स्वरूप में अनावश्यक अर्थ नहीं जोड़ा जाता।
- source_word: παρουσία
  choice: आगमन
  rationale: इस भविष्य-संबंधी प्रसंग में शब्द मनुष्य के पुत्र के आने या पहुँचने को सूचित करता है। ‘आगमन’ गरिमापूर्ण और स्पष्ट है, जबकि ‘उपस्थिति’ की वैकल्पिक शब्दार्थ-संभावना पादटिप्पणी में रखी गई है।
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: यह यीशु की स्थापित उपाधि और उसके शास्त्रीय अंतर्संबंधों को सुरक्षित रखती है, बिना उसे अधिक व्याख्यात्मक पद में बदलने के।
theological_decisions:
- issue: भविष्य-संबंधी कथन में παρουσία का अनुवाद
  choice: आगमन
  alternative: उपस्थिति
  rationale: प्रसंग मनुष्य के पुत्र की भावी घटना की ओर संकेत करता है, इसलिए ‘आगमन’ यहाँ क्रियात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है। फिर भी यूनानी शब्द ‘उपस्थिति’ भी दर्शा सकता है; इस अर्थ-परास को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘जैसे … वैसे ही’ से मूल तुलना स्पष्ट रहती है और ‘आगमन’ के साथ पादटिप्पणी मूल शब्द की अर्थगत व्यापकता बनाए रखती है।
