id: MAT.24.30
reference: Matthew 24:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: hi
  text: और तब मनुष्य के पुत्र का चिन्ह स्वर्ग में[a] दिखाई देगा। तब पृथ्वी के सभी कुल विलाप करेंगे[b], और वे मनुष्य के पुत्र को सामर्थ्य और बड़ी महिमा के साथ आकाश के बादलों पर आते देखेंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकाश में।’ यूनानी शब्द οὐρανός का अर्थ संदर्भ के अनुसार ‘स्वर्ग’ या ‘आकाश’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘देश के सभी कुल।’ यूनानी शब्द γῆ का अर्थ ‘पृथ्वी’ या ‘देश’ हो सकता है।
    reason: alternative_reading
  - marker: c
    text: ‘आकाश के बादलों पर आते’ वाक्यांश दानिय्येल 7:13 की प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: दिखाई देगा
  rationale: यहाँ क्रिया का अकर्मक भाव दृश्य रूप से प्रकट होने को व्यक्त करता है; ‘दिखाई देगा’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: σημεῖον
  choice: चिन्ह
  rationale: ‘चिन्ह’ इस शब्द का सीधा और प्रचलित हिन्दी प्रतिरूप है तथा अपोकैलिप्टिक संदर्भ में अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र का
  rationale: सम्बन्धकारक रचना को निकटता से रखा गया है, ताकि यह अस्पष्टता बनी रहे कि चिन्ह उससे सम्बद्ध है या किसी अन्य ढंग से उसकी पहचान कराता है।
- source_word: ἐν τῷ οὐρανῷ
  choice: स्वर्ग में
  rationale: οὐρανός का अर्थ ‘स्वर्ग’ या ‘आकाश’ हो सकता है। मुख्य पाठ में ‘स्वर्ग’ ऊँचे अपोकैलिप्टिक भाव को बनाए रखता है; ‘आकाश’ को पादटिप्पणी में रखा गया है।
- source_word: κόψονται
  choice: विलाप करेंगे
  rationale: इस मध्यवाची प्रयोग में शोक मनाने का अर्थ है। ‘विलाप करेंगे’ भाव की तीव्रता व्यक्त करता है, पर किसी विशेष शारीरिक हावभाव को पाठ में नहीं जोड़ता।
- source_word: φυλαὶ
  choice: कुल
  rationale: φυλή वंश-आधारित समूह या गोत्र को दर्शाता है। ‘कुल’ वर्तमान हिन्दी में बोधगम्य है और पुराने नियम की प्रतिध्वनि के लिए उपयुक्त रहते हुए ‘जनजाति’ के आधुनिक प्रशासनिक अर्थ से बचता है।
- source_word: τῆς γῆς
  choice: पृथ्वी के
  rationale: विश्वव्यापी, ब्रह्मांडीय संदर्भ में ‘पृथ्वी’ उपयुक्त मुख्य अर्थ है; सीमित भौगोलिक अर्थ ‘देश’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ὄψονται
  choice: देखेंगे
  rationale: सरल भविष्यकाल को सहज आधुनिक हिन्दी में सीधे व्यक्त किया गया है।
- source_word: ἐρχόμενον
  choice: आते
  rationale: कृदन्त की जारी क्रिया को ‘आते देखेंगे’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: आकाश के बादलों पर
  rationale: यह स्थानिक चित्र को सीधे बनाए रखता है और दानिय्येल 7:13 की प्रतिध्वनि सुरक्षित रखता है। यहाँ οὐρανός के लिए ‘आकाश’ बादलों के साथ हिन्दी में अधिक स्वाभाविक है।
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: सामर्थ्य और बड़ी महिमा के साथ
  rationale: यह यूनानी संरचना को स्पष्ट हिन्दी में रखता है और πολλῆς को सीधे ‘महिमा’ से जोड़ता है।
theological_decisions:
- issue: ‘मनुष्य के पुत्र का चिन्ह’ का अर्थ
  choice: सम्बन्धकारक अस्पष्टता को ‘मनुष्य के पुत्र का चिन्ह’ में बनाए रखा गया।
  alternative: ‘मनुष्य के पुत्र से सम्बन्धित चिन्ह’ अथवा ‘वह चिन्ह जो स्वयं मनुष्य का पुत्र है’
  rationale: यूनानी वाक्यांश निश्चित नहीं करता कि चिन्ह उसका है, उसके आगमन का संकेत है, या स्वयं उसी को चिन्ह माना गया है; इसलिए विवादित युगांत-विषयक अर्थ को अनुवाद में तय नहीं किया गया।
- issue: ‘पृथ्वी के सभी कुल’ में γῆ का विस्तार
  choice: मुख्य पाठ में ‘पृथ्वी’ रखा गया।
  alternative: ‘देश के सभी कुल’
  rationale: निकट संदर्भ का ब्रह्मांडीय और अपोकैलिप्टिक स्वर विश्वव्यापी अर्थ के अनुकूल है, किंतु ‘देश’ का स्थानीय अर्थ भी सम्भव है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मनुष्य का पुत्र’, ‘चिन्ह’, ‘विलाप’, ‘सामर्थ्य’ और ‘महिमा’ जैसे परिचित बाइबिलीय पद अपोकैलिप्टिक स्वर बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए सहज है।
