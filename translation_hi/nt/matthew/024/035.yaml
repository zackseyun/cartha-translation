  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: hi
  text: आकाश और पृथ्वी मिट जाएँगे, पर मेरे वचन कभी नहीं मिटेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: आकाश
  rationale: γῆ के साथ इस ब्रह्मांडीय युग्म में οὐρανός समूचे सृजित आकाश को सूचित करता है; आधुनिक हिन्दी में ‘आकाश और पृथ्वी’ स्वाभाविक और व्यापक अभिव्यक्ति है।
- source_word: ἡ γῆ
  choice: पृथ्वी
  rationale: ‘आकाश और पृथ्वी’ के युग्म में γῆ किसी विशेष भूभाग के बजाय पृथ्वी या वर्तमान सृष्टि को दर्शाता है।
- source_word: παρελεύσεται
  choice: मिट जाएँगे
  rationale: यहाँ παρέρχομαι वर्तमान सृजित व्यवस्था के समाप्त हो जाने को व्यक्त करता है। हिन्दी में ‘मिट जाना’ गंभीरता और नश्वरता का भाव स्वाभाविक रूप से देता है, बिना समाप्ति की प्रक्रिया को अनावश्यक रूप से निर्धारित किए।
- source_word: δὲ
  choice: पर
  rationale: δέ आकाश-पृथ्वी की नश्वरता और यीशु के वचनों की स्थिरता के बीच स्पष्ट विरोध दर्शाता है।
- source_word: οἱ λόγοι μου
  choice: मेरे वचन
  rationale: λόγοι यीशु की कही हुई बातों और घोषणाओं को सूचित करता है। ‘वचन’ आधुनिक धार्मिक हिन्दी में गरिमापूर्ण और व्यापक है तथा केवल एक कथन तक अर्थ को सीमित नहीं करता।
- source_word: οὐ μὴ παρέλθωσιν
  choice: कभी नहीं मिटेंगे
  rationale: οὐ μή के साथ aorist subjunctive प्रबल निषेध है। ‘कभी नहीं’ उसकी सुनिश्चित और emphatic शक्ति को स्वाभाविक आधुनिक हिन्दी में प्रकट करता है।
theological_decisions:
- issue: यीशु के वचनों के स्थायित्व के दावे की शक्ति
  choice: सृष्टि की नश्वरता के विपरीत यीशु के वचनों के निश्चित स्थायित्व को प्रबल निषेध के साथ सीधे व्यक्त किया गया है।
  alternative: इस कथन को यीशु के दिव्य अधिकार के विषय में स्पष्ट व्याख्यात्मक दावे के रूप में विस्तारित करना।
  rationale: मूल पाठ यीशु के वचनों के न मिटने का अत्यंत दृढ़ दावा करता है, पर उसके सिद्धान्तगत निहितार्थों को स्वयं नहीं खोलता। अनुवाद उस भार को बनाए रखता है, अतिरिक्त सम्प्रदायगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। समान यूनानी क्रिया παρέρχομαι को दोनों खंडों में ‘मिट जाना’ से प्रस्तुत करके मूल की शब्दगत समानता और तीखा विरोध सुरक्षित रखा गया है।
