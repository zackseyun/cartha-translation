id: MAT.24.46
reference: Matthew 24:46
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: hi
  text: धन्य है वह दास, जिसे उसका स्वामी आकर ऐसा ही करते पाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: धन्य
  rationale: यह यीशु के आशीर्वचन की पारंपरिक और अर्थ-सटीक अभिव्यक्ति है; इसका आशय केवल प्रसन्न होना नहीं, बल्कि परमेश्वर की दृष्टि में आशीषित होना है।
- source_word: δοῦλος
  choice: दास
  rationale: यूनानी शब्द अधीनता और स्वामित्व का बोध देता है; ‘सेवक’ की अपेक्षा ‘दास’ मूल अर्थ को अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: κύριος
  choice: स्वामी
  rationale: इस दास-दृष्टांत के मानवीय संबंध में κύριος का स्वाभाविक हिन्दी समतुल्य ‘स्वामी’ है; यह अधिकार-संबंध को स्पष्ट करता है और प्रसंग से आगे कोई विशेष उपाधि आरोपित नहीं करता।
- source_word: οὕτως ποιοῦντα
  choice: ऐसा ही करते
  rationale: यह पूर्ववर्ती पद में बताए गए दायित्व का संकेत करता है और मूल की संक्षिप्त संदर्भात्मक अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: κύριος को ‘प्रभु’ या ‘स्वामी’ कहना
  choice: स्वामी
  alternative: प्रभु
  rationale: दृष्टांत के भीतर दास के अधिकारी के अर्थ में ‘स्वामी’ आधुनिक हिन्दी में अधिक सहज है। साथ ही, यीशु की ओर संकेत करने वाली व्यापक दृष्टान्तगत संभावना को नकारे बिना मूल कथात्मक स्तर सुरक्षित रहता है।
- issue: μακάριος का अर्थ
  choice: धन्य
  alternative: सुखी
  rationale: ‘धन्य’ दैवी अनुमोदन और आशीष की धार्मिक गहराई बनाए रखता है, जबकि ‘सुखी’ इसे मनोभाव तक सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मौखिक रूप से सहज वाक्य। ‘आकर ... पाएगा’ यूनानी कालिक कृदंत और भविष्यत् मुख्य क्रिया को स्वाभाविक हिन्दी क्रम में व्यक्त करता है।
