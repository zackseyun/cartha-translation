id: MAT.24.5
reference: Matthew 24:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: hi
  text: क्योंकि बहुत-से लोग मेरे नाम से आकर कहेंगे, ‘मैं ही मसीह हूँ,’[a] और वे बहुतों को भटका देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मसीह’ का अर्थ ‘अभिषिक्त जन’ है; यूनानी उपाधि ὁ χριστός है।
    reason: मूल यूनानी उपाधि और उसके अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: कर्ता के रूप में बहुवचन विशेषण का स्वाभाविक और स्पष्ट हिन्दी रूप; ‘लोग’ जोड़ने से वाक्य सहज बनता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले पद की चेतावनी का कारण बताता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्पष्ट रखता है।
- source_word: ἐλεύσονται
  choice: आकर
  rationale: 'भविष्यकाल का भाव मुख्य क्रिया ‘कहेंगे’ के साथ संयुक्त क्रिया-रचना में स्वाभाविक हिन्दी से व्यक्त होता है: ‘आकर कहेंगे’।'
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: मेरे नाम से
  rationale: यह यीशु के नाम या पहचान का दावा करके आने का भाव देता है और हिन्दी में सहज है; ‘मेरे नाम में’ अधिक शब्दशः पर अस्वाभाविक होता।
- source_word: λέγοντες
  choice: कहेंगे
  rationale: कृदन्त को भविष्यकालीन मुख्य कथन के साथ स्वाभाविक हिन्दी क्रिया के रूप में व्यक्त किया गया है, बिना ‘दावा करेंगे’ जैसा व्याख्यात्मक अर्थ जोड़ने के।
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: मैं ही मसीह हूँ
  rationale: ὁ χριστός यहाँ उपाधि है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अभिषिक्त उद्धारकर्ता की उपाधि को स्वाभाविक रूप से व्यक्त करता है। ‘ही’ स्पष्ट सर्वनाम Ἐγώ के बलाघात को दर्शाता है।
- source_word: πλανήσουσιν
  choice: भटका देंगे
  rationale: πλανάω में धोखा देकर सही मार्ग से हटाने का भाव है; ‘भटका देंगे’ उस मार्ग-विमुखता की छवि और कारक अर्थ दोनों बनाए रखता है।
- source_word: πολλοὺς
  choice: बहुतों को
  rationale: कर्म के रूप में संक्षिप्त, स्पष्ट और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: झूठे मसीहाई दावे में Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: सप्रत्यय ὁ χριστός यहाँ नाम नहीं, प्रत्याशित पदवी है। ‘मसीह’ उस पदवी को हिन्दी में परिचित और धर्मशास्त्रीय रूप से तटस्थ ढंग से व्यक्त करता है; पादटिप्पणी अर्थ को स्पष्ट करती है।
- issue: Ἐγώ में निहित बलाघात
  choice: मैं ही
  alternative: मैं
  rationale: यूनानी में व्यक्त कर्ता-सर्वनाम Ἐγώ क्रिया में पहले से निहित कर्ता को बल देता है। ‘ही’ झूठे दावेदार के अनन्य पहचान-दावे को व्यक्त करता है, कोई अतिरिक्त धर्मसिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ में सहज। ‘मेरे नाम से’ तथा ‘भटका देंगे’ जैसे प्रचलित पद मूल के अर्थ और बिंब को स्वाभाविक हिन्दी में रखते हैं।
