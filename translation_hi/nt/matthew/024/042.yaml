  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε ποίᾳ ⸀ἡμέρᾳ ὁ κύριος ὑμῶν ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: hi
  text: इसलिए जागते रहो[a], क्योंकि तुम नहीं जानते कि तुम्हारा प्रभु किस दिन आ रहा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चौकसी करते रहो’ अथवा ‘सतर्क रहो।’
    reason: lexical_alternative
  - marker: b
    text: या ‘आता है’ अथवा ‘आएगा।’ यूनानी में वर्तमान काल का रूप प्रयुक्त हुआ है।
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: जागते रहो
  rationale: वर्तमान काल का बहुवचन आज्ञार्थक रूप निरंतर सजग रहने का आदेश देता है। ‘जागते रहो’ जागते रहने के मूल रूपक को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले उपदेश से निकलने वाले निष्कर्ष को स्पष्ट रूप से व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह आदेश का कारण बताता है और समकालीन हिन्दी में सहज है।
- source_word: οὐκ οἴδατε
  choice: तुम नहीं जानते
  rationale: जानने की क्रिया के सीधे निषेध को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: ποίᾳ ἡμέρᾳ
  choice: किस दिन
  rationale: समय बताने वाले यूनानी संप्रदान कारक को स्वाभाविक हिन्दी में व्यक्त करता और अज्ञात दिन की विशिष्टता बनाए रखता है।
- source_word: ὁ κύριος ὑμῶν
  choice: तुम्हारा प्रभु
  rationale: κύριος को स्थापित नए नियम संबंधी उपाधि ‘प्रभु’ से व्यक्त करता है और संबंधवाचक सर्वनाम को सहज हिन्दी रूप देता है।
- source_word: ἔρχεται
  choice: आ रहा है
  rationale: यूनानी वर्तमान काल के सजीव और प्रत्याशापूर्ण स्वर को सुरक्षित रखता है, जबकि सन्दर्भगत भावी संकेत को कृत्रिम रूप से निश्चित नहीं करता।
theological_decisions:
- issue: ἔρχεται के वर्तमान काल का अंतकाल-संबंधी बल
  choice: ‘आ रहा है’ द्वारा वर्तमान रूप और आसन्नता के सजीव भाव को बनाए रखना
  alternative: ‘आता है’ या ‘आएगा’
  rationale: यूनानी पाठ अंतकाल-संबंधी सन्दर्भ में वर्तमान काल का प्रयोग करता है। ‘आ रहा है’ तात्कालिकता और प्रतीक्षा का तनाव सुरक्षित रखता है, पर आगमन के समय के विषय में पाठ से अधिक निश्चित दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। बहुवचन ‘तुम’ मूल पाठ के ὑμῶν और आज्ञार्थक बहुवचन के अनुरूप है। जागने का रूपक मुख्य पाठ में सुरक्षित रखा गया है; उसके व्यावहारिक अर्थ को पादटिप्पणी में दिया गया है।
