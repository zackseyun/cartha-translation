id: MAT.24.11
reference: Matthew 24:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: hi
  text: और बहुत-से झूठे भविष्यद्वक्ता उठ खड़े होंगे[b] और बहुतों को भटका देंगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहुतों को धोखा देंगे।’
    reason: lexical_alternative
  - marker: b
    text: या ‘उठाए जाएँगे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से
  rationale: यह सामान्य परिमाणवाचक विशेषण है; ‘बहुत-से’ स्वाभाविक हिन्दी है और अनेक व्यक्तियों का अर्थ स्पष्ट करता है।
- source_word: ψευδοπροφῆται
  choice: झूठे भविष्यद्वक्ता
  rationale: यह ऐसे भविष्यद्वक्ताओं को दर्शाता है जो असत्य या भ्रामक हैं; ‘झूठे भविष्यद्वक्ता’ हिन्दी बाइबलीय भाषा में परिचित और अर्थ की दृष्टि से सटीक है।
- source_word: ἐγερθήσονται
  choice: उठ खड़े होंगे
  rationale: भविष्यत् कर्मवाच्य रूप यहाँ व्यक्तियों के उभरने या सामने आने का भाव देता है। ‘उठ खड़े होंगे’ प्रसंग में स्वाभाविक है और पुनरुत्थान का अनावश्यक संकेत नहीं देता।
- source_word: πλανήσουσιν
  choice: भटका देंगे
  rationale: क्रिया में किसी को सही मार्ग से भटकाने, बहकाने या धोखा देने का व्यापक भाव है। ‘भटका देंगे’ मूल के मार्ग-विचलन रूपक को संक्षेप और स्वाभाविक ढंग से बनाए रखता है।
- source_word: πολλούς
  choice: बहुतों को
  rationale: यह क्रिया का सीधा कर्म है; ‘बहुतों को’ मूल के अनिर्दिष्ट बहुवचन को बिना ‘लोगों’ को अनावश्यक रूप से जोड़ने के सुरक्षित रखता है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: दोनों καί क्रमशः कथन और भविष्य की दोनों घटनाओं को जोड़ते हैं; दोहरा ‘और’ यूनानी संरचना तथा चेतावनी के संचयी प्रभाव को बनाए रखता है।
theological_decisions:
- issue: πλανήσουσιν द्वारा बताई गई भटकाहट का स्वरूप
  choice: पद केवल यह कहता है कि झूठे भविष्यद्वक्ता बहुतों को भटका देंगे; भटकाने की ठीक विधि या सीमा निर्दिष्ट नहीं करता।
  alternative: इसे केवल सैद्धांतिक, नैतिक या अंत-काल संबंधी धोखे तक सीमित समझना।
  rationale: πλανάω का अर्थ-क्षेत्र व्यापक है और सैद्धांतिक, नैतिक तथा आत्मिक भटकाव को समेट सकता है; इसलिए अनुवाद किसी एक प्रकार को आरोपित नहीं करता।
- issue: ἐγερθήσονται के कर्मवाच्य रूप का अर्थ
  choice: मुख्य पाठ में प्रसंगानुकूल ‘उठ खड़े होंगे’ रखा गया है।
  alternative: ‘उठाए जाएँगे’ के रूप में कर्मवाच्य को स्पष्ट करना।
  rationale: यूनानी कर्मवाच्य रूप दोनों संभावनाओं को स्थान देता है, पर इस प्रसंग में उभरने का मुहावरेदार अर्थ अधिक स्वाभाविक है। वैकल्पिक रूप को पादटिप्पणी में सुरक्षित रखा गया है, बिना यह निर्धारित किए कि उन्हें कौन उठाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। ‘भविष्यद्वक्ता’ बाइबलीय संदर्भ में स्थापित शब्द है। मुख्य पाठ में मूल यूनानी का दोहरा संयोजन, अनिर्दिष्ट ‘बहुतों’ और भटकने के रूपक को बनाए रखा गया है; वास्तविक वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
