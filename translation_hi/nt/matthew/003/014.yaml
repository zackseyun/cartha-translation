  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: hi
  text: परन्तु यूहन्ना उसे रोकने की लगातार कोशिश कर रहा था[a] और कह रहा था, “मुझे तो आपसे बपतिस्मा पाने की आवश्यकता है, और आप मेरे पास आते हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यूहन्ना ने उसे रोकने की कोशिश की।” यूनानी की अपूर्ण भूतकाल क्रिया बार-बार या लगातार किए गए कार्य का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: रोकने की लगातार कोशिश कर रहा था
  rationale: अपूर्ण भूतकाल क्रिया जारी या बार-बार किए जा रहे प्रयास का संकेत दे सकती है। यह अभिव्यक्ति उस अपूर्णतापरक बल को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: λέγων
  choice: और कह रहा था
  rationale: वर्तमान कृदन्त यूहन्ना के रोकने के प्रयास और उसके कथन को एक साथ जोड़ता है। हिन्दी में यह रूप उस संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: χρείαν ἔχω
  choice: मुझे ... आवश्यकता है
  rationale: यह यूनानी मुहावरा आवश्यकता होने का अर्थ देता है। चुना हुआ रूप आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: ὑπὸ σοῦ
  choice: आपसे
  rationale: निष्क्रिय क्रिया के साथ यह पदबंध व्यक्तिगत कर्ता को दर्शाता है। हिन्दी में ‘आपसे बपतिस्मा पाना’ स्वाभाविक ढंग से बताता है कि बपतिस्मा देने वाला यीशु है।
- source_word: βαπτισθῆναι
  choice: बपतिस्मा पाने
  rationale: निष्क्रिय अनन्त क्रिया को ‘बपतिस्मा पाने’ से स्पष्ट रूप में व्यक्त किया गया है; इससे बपतिस्मे की विधि को पाठ से अधिक विशिष्ट नहीं बनाया जाता।
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: और आप मेरे पास आ रहे हैं?
  rationale: वर्तमान काल और आलंकारिक प्रश्न दोनों को बनाए रखा गया है। ‘तो भी’ जैसा अतिरिक्त विरोधसूचक शब्द नहीं जोड़ा गया, ताकि मूल की अभिव्यक्ति से आगे न बढ़ा जाए।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले प्रसंग से हल्का विरोध दर्शाता है; ‘परन्तु’ उसे स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना का यीशु को बपतिस्मा देने पर विरोध
  choice: यूहन्ना की अपनी आवश्यकता और यीशु की श्रेष्ठता को कथन के रूप में सीधे रखा गया है।
  alternative: इसे विशेष रूप से यीशु की निष्पापता या केवल पद और अधिकार के भेद की व्याख्या के रूप में प्रस्तुत करना।
  rationale: पद यूहन्ना की आवश्यकता और यीशु की श्रेष्ठता व्यक्त करता है, पर उसका पूरा धर्मवैज्ञानिक आधार स्पष्ट नहीं करता। अनुवाद इस तनाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। यीशु के लिए सम्मानसूचक ‘आप’ रखा गया है। ‘बपतिस्मा पाने’ से यूनानी निष्क्रिय रूप सुरक्षित रहता है और बपतिस्मे की किसी विशेष विधि को अनावश्यक रूप से निश्चित नहीं किया जाता।
