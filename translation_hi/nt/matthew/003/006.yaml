  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: hi
  text: और वे अपने पापों को स्वीकार करते हुए, यरदन नदी में उसके द्वारा बपतिस्मा ले रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, ‘बपतिस्मा लिया’; यूनानी अपूर्ण भूतकाल जारी या बार-बार होने वाली क्रिया पर बल दे सकता है: ‘बपतिस्मा ले रहे थे।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: बपतिस्मा ले रहे थे
  rationale: यूनानी अपूर्ण भूतकाल जारी या बार-बार होने वाली क्रिया दिखा सकता है। हिन्दी में ‘ले रहे थे’ यह पक्ष स्वाभाविक ढंग से व्यक्त करता है। ‘बपतिस्मा’ स्थापित धार्मिक शब्द है और विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: यरदन नदी में
  rationale: ἐν सहित चतुर्थी यहाँ स्थान बताती है, और ποταμῷ स्पष्ट रूप से ‘नदी’ कहता है।
- source_word: ὑπ’ αὐτοῦ
  choice: उससे
  rationale: ὑπό सहित संबंधकारक व्यक्तिगत कर्ता को दर्शाता है। ‘उससे’ यूनानी सर्वनाम को बनाए रखता है; निकटवर्ती संदर्भ में इसका संकेत यूहन्ना की ओर है।
- source_word: ἐξομολογούμενοι
  choice: मानते हुए
  rationale: कृदंत मुख्य क्रिया के साथ-साथ अपने अपराधों को स्वीकार करने की क्रिया बताता है। ‘अपने पापों को मानते हुए’ सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: अपने पापों को
  rationale: यह बहुवचन संज्ञा और संबंधकारक सर्वनाम का सीधा, स्वाभाविक हिन्दी रूप है तथा विशिष्ट पापों की बहुलता बनाए रखता है।
- source_word: καὶ
  choice: और
  rationale: यह पिछले कथन से सरल कथात्मक संबंध बनाए रखता है।
theological_decisions:
- issue: बपतिस्मा की शब्दावली और विधि
  choice: ‘बपतिस्मा’ रखा गया है; किसी खास विधि को स्पष्ट नहीं किया गया।
  alternative: ‘डुबकी’ या ‘स्नान’
  rationale: इस पद में यरदन में यूहन्ना द्वारा किए गए संस्कार का उल्लेख है, पर इसकी विधि को अलग से परिभाषित नहीं किया गया। इसलिए स्थापित शब्द पाठ की धार्मिक अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘अपने पापों को मानते हुए’ बोलचाल की स्पष्टता और धार्मिक संदर्भ की गंभीरता के बीच संतुलन रखता है।
