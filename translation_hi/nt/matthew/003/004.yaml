source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: hi
  text: स्वयं यूहन्ना ऊँट के बालों का वस्त्र और कमर में चमड़े का पट्टा पहने हुए था[c][b][a]। उसका भोजन टिड्डियाँ और जंगली शहद था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूहन्ना का पहनावा 2 राजा 1:8 में नबी एलिय्याह के रूप की याद दिलाता है। मत्ती द्वारा यूहन्ना के चित्रण को समझने के लिए यह एक महत्त्वपूर्ण पृष्ठभूमि है।
    reason: cross_reference
  - marker: b
    text: या, “उसका वस्त्र ऊँट के बालों का था।”
    reason: lexical_alternative
  - marker: c
    text: या, “उसके पास ऊँट के बालों का वस्त्र था।”
    reason: previous_rendering
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: स्वयं यूहन्ना
  rationale: αὐτός के बल को ‘स्वयं’ से व्यक्त किया गया है। δέ हल्का संक्रमणसूचक है; हिंदी में अलग संयोजक जोड़े बिना वाक्य स्वाभाविक रहता है।
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: वस्त्र पहनता था
  rationale: εἶχεν का मूल अर्थ ‘रखता/उसके पास था’ है, पर वस्त्र के संदर्भ में अपूर्ण काल की निरंतर या सामान्य अवस्था को आधुनिक हिंदी में ‘पहनता था’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπὸ τριχῶν καμήλου
  choice: ऊँट के बालों से बना
  rationale: सामग्री बताने वाले ἀπό को ‘से बना’ द्वारा स्पष्ट किया गया है। बहुवचन τριχῶν का आशय ऊँट के बालों से बनी सामग्री है।
- source_word: ζώνην δερματίνην
  choice: चमड़े का पट्टा
  rationale: ζώνη कमर में बाँधा जाने वाला पट्टा या कमरबंद है; ‘चमड़े का पट्टा’ साधारण आधुनिक हिंदी में स्पष्ट है।
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: कमर पर
  rationale: ὀσφύς के लिए ‘कमर’ समकालीन और सहज शब्द है; ‘कटि’ अनावश्यक रूप से साहित्यिक होता।
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: उसका भोजन ... था
  rationale: τροφή का सीधा अर्थ ‘भोजन’ है। δέ को नए वाक्य के स्वाभाविक संक्रमण से व्यक्त किया गया है।
- source_word: ἀκρίδες
  choice: टिड्डियाँ
  rationale: ἀκρίδες का सामान्य और संदर्भानुकूल अर्थ खाने योग्य टिड्डियाँ है; किसी वनस्पति-आधारित वैकल्पिक व्याख्या का पाठ में आधार नहीं है।
- source_word: μέλι ἄγριον
  choice: जंगली शहद
  rationale: ἄγριον ऐसे शहद को दर्शाता है जो वन्य दशा में मिलता है; ‘जंगली शहद’ आधुनिक हिंदी में सरल और परिचित अभिव्यक्ति है।
theological_decisions:
- issue: यूहन्ना के वर्णन में एलिय्याह की प्रतिध्वनि
  choice: मुख्य पाठ में पहनावे और भोजन का सीधा वर्णन रखा गया है।
  alternative: मुख्य पाठ में ऐसे शब्द जोड़ना जो यूहन्ना की तुलना एलिय्याह से स्पष्ट कर दें।
  rationale: मत्ती का वर्णन 2 राजा 1:8 में एलिय्याह के रूप की याद दिलाता है, पर इस पद में तुलना प्रत्यक्ष रूप से नहीं कही गई। इसलिए संबंध को टिप्पणी में रखा गया है, मुख्य पाठ में नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वस्त्र’ सामान्य धार्मिक-पाठ शैली के अनुकूल है, जबकि ‘कटि’, ‘मेखला’ या ‘वन्य मधु’ जैसे अधिक संस्कृतनिष्ठ विकल्पों से बचा गया है। दो छोटे वाक्य हिंदी में विवरण को साफ रखते हैं।
