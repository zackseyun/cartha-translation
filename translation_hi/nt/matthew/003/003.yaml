id: MAT.3.3
reference: Matthew 3:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: hi
  text: 'क्योंकि यह वही है जिसके विषय में भविष्यद्वक्ता यशायाह के द्वारा कहा गया था: “जंगल में पुकारनेवाले की आवाज़: ‘प्रभु[a] का मार्ग तैयार करो; उसके रास्ते सीधे करो।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा का मार्ग”; यह उद्धरण यशायाह 40:3 की प्रतिध्वनि है, जहाँ इब्रानी पाठ में परमेश्वर का नाम YHWH है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: यह वही है
  rationale: यह संकेतवाचक शब्द निकट संदर्भ में यूहन्ना बपतिस्मा देनेवाले की ओर इशारा करता है। ‘यह वही है’ यूनानी बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट करता है।
- source_word: ὁ ῥηθεὶς
  choice: जिसके विषय में ... कहा गया था
  rationale: संज्ञा की तरह प्रयुक्त कर्मवाच्य कृदन्त का अर्थ है वह व्यक्ति जिसके विषय में पहले कहा गया था। यह हिन्दी रूप उस कर्मवाच्य और संदर्भ दोनों को सुरक्षित रखता है।
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: यशायाह भविष्यद्वक्ता के द्वारा
  rationale: διά के साथ संबंधकारक यहाँ भविष्यद्वक्ता को कथन का माध्यम दिखाता है। ‘के द्वारा’ इस मध्यस्थ भूमिका को बनाए रखता है।
- source_word: Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ
  choice: जंगल में पुकारनेवाले की आवाज़
  rationale: यह रूप βοῶντος के संबंधकारक भाव को बनाए रखता है और ἐν τῇ ἐρήμῳ को पुकारनेवाले के साथ स्वाभाविक रूप से जोड़ता है। ‘जंगल’ निर्जन वनप्रदेश के अर्थ में सामान्य और सुबोध हिन्दी है।
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: प्रभु का मार्ग तैयार करो
  rationale: आज्ञार्थक क्रिया की निर्णायक पुकार और यशायाह के उद्धरण में प्रयुक्त मार्ग-रूपक दोनों सुरक्षित रहते हैं। κύριος का सीधा हिन्दी रूप ‘प्रभु’ है।
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: उसके रास्ते सीधे करो
  rationale: बहुवचन τρίβους को ‘रास्ते’ और αὐτοῦ को ‘उसके’ के रूप में स्पष्ट रखा गया है; ‘सीधे करो’ मूल मार्ग-रूपक को बनाए रखता है।
theological_decisions:
- issue: यशायाह 40:3 के उद्धरण में κυρίου का अनुवाद, जबकि इब्रानी मूल में YHWH है
  choice: प्रभु
  alternative: यहोवा
  rationale: मत्ती का उपलब्ध यूनानी पाठ κυρίου कहता है, इसलिए मुख्य पाठ में उसका सामान्य हिन्दी समकक्ष ‘प्रभु’ रखा गया है। इब्रानी अंतर्पाठ में पाए जानेवाले परमेश्वर के विशिष्ट नाम YHWH की पृष्ठभूमि को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भविष्यद्वाणी के काव्यात्मक मार्ग-रूपक को बनाए रखते हुए वाक्य-विन्यास को स्वाभाविक हिन्दी में ढाला गया है।
