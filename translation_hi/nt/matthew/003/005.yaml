  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: hi
  text: तब यरूशलेम से, सारे यहूदिया से और यरदन के आसपास के पूरे क्षेत्र से लोग उसके पास जा रहे थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सारे यहूदिया’ और ‘यरदन के आसपास का पूरा क्षेत्र’ व्यापक भौगोलिक अभिव्यक्तियाँ हैं। वे यूहन्ना के प्रति बड़े पैमाने पर हुई प्रतिक्रिया बताती हैं; इनका अर्थ यह आवश्यक नहीं कि हर एक व्यक्ति गया था। यूनानी अपूर्ण भूतकाल जारी या बार-बार होने वाली गतिविधि का संकेत दे सकता है; या, ‘जा रहे थे’ के स्थान पर ‘बार-बार जाते थे’।
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह समय-सूचक शब्द पिछले प्रसंग में वर्णित यूहन्ना की सेवा से लोगों की प्रतिक्रिया को जोड़ता है।
- source_word: ἐξεπορεύετο
  choice: निकलकर आ रहे थे
  rationale: अपूर्ण भूतकाल का रूप बीते समय में जारी या बार-बार होने वाली गतिविधि दर्शाता है। ‘निकलकर’ लोगों के अपने स्थानों से बाहर जाने और ‘आ रहे थे’ यूहन्ना की ओर बढ़ने—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρὸς αὐτόν
  choice: उसके पास
  rationale: गति-सूचक क्रिया के साथ यह पदबंध किसी व्यक्ति की ओर जाने को बताता है; यहाँ संकेत यूहन्ना की ओर है।
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित बाइबलीय रूप। मूल में नगर का नाम उसके निवासियों के लिए लाक्षणिक रूप से प्रयुक्त हुआ है।
- source_word: πᾶσα ἡ Ἰουδαία
  choice: सारे यहूदिया
  rationale: पूरे भौगोलिक क्षेत्र से व्यापक प्रतिक्रिया का भाव बनाए रखता है; ‘लोग’ जोड़ने से हिन्दी में स्थानों के स्वयं चलने का अस्वाभाविक अर्थ नहीं निकलता।
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: यरदन के आसपास के सारे इलाके
  rationale: περίχωρος यरदन के चारों ओर के क्षेत्र को दर्शाता है। यह रूप मूल भौगोलिक संबंध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καὶ ... καὶ
  choice: … और …
  rationale: तीनों भौगोलिक उल्लेखों को संचयी ढंग से जोड़ने वाली मूल संरचना को बनाए रखता है।
theological_decisions:
- issue: भौगोलिक समग्रता वाले पदों का विस्तार
  choice: ‘सारे’ को मुख्य पाठ में बनाए रखते हुए टिप्पणी में इसे व्यापक जन-प्रतिक्रिया बताना
  alternative: ‘यहूदिया और यरदन के आसपास के क्षेत्र से बहुत-से लोग’ कहना
  rationale: मूल पाठ का πᾶσα दोनों क्षेत्रों को समग्र रूप में प्रस्तुत करता है। इसे ‘बहुत-से’ कर देना मूल की अलंकारिक व्यापकता को पहले ही व्याख्यायित कर देता; टिप्पणी यह स्पष्ट करती है कि इसका आशय अनिवार्यतः प्रत्येक व्यक्ति नहीं है।
- issue: स्थान-नामों का लोगों के लिए लाक्षणिक प्रयोग
  choice: भौगोलिक नामों के साथ ‘से लोग’ जोड़ना
  alternative: ‘यरूशलेम, सारा यहूदिया और… उसके पास निकलकर आ रहा था’ जैसा अधिक शब्दशः रूप
  rationale: मूल में क्षेत्रों और नगर का उल्लेख वहाँ के निवासियों के लिए है। ‘से लोग’ वही आशय स्पष्ट, स्वाभाविक हिन्दी में देता है और कथन के दायरे को संप्रदायगत या धर्मवैज्ञानिक रूप से नहीं बदलता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘यहूदिया’ और ‘यरदन’ के प्रचलित बाइबलीय नाम रखे गए हैं। स्थानों के स्वयं चलने जैसी अस्वाभाविक हिन्दी से बचने के लिए ‘से लोग’ स्पष्ट किया गया है, जबकि मूल की व्यापक भौगोलिक भाषा और अपूर्ण क्रिया-पक्ष सुरक्षित रखे गए हैं।
