source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: hi
  text: और अपने मन में यह कहने का गुमान मत करना[a], ‘अब्राहम हमारे पिता हैं।’ क्योंकि मैं तुमसे कहता हूँ कि परमेश्वर इन पत्थरों से अब्राहम के लिए वंशज खड़े कर सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपस में यह कहने का गुमान मत करना।” यूनानी वाक्यांश का अर्थ मन के भीतर कहना या समूह में एक-दूसरे से कहना—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: भरोसा मत करना
  rationale: μή के साथ aorist subjunctive किसी गलत धारणा को अपनाने से रोकता है। यहाँ केवल ‘मत सोचना’ नहीं, बल्कि वंश पर अनुचित आत्मविश्वास न रखने की चेतावनी है।
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: अपने मन में यह कहना
  rationale: बहुवचन ἐν ἑαυτοῖς भीतर की आत्म-वार्ता या समूह के आपसी कथन—दोनों का संकेत दे सकता है। मुख्य पाठ में स्वाभाविक हिन्दी ‘अपने मन में’ रखा गया है और दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: हमारे पिता अब्राहम हैं
  rationale: यह आधुनिक हिन्दी में स्वाभाविक ढंग से पैतृक वंश के दावे को व्यक्त करता है और उसके ऐतिहासिक अथवा वाचागत निहितार्थों को अनावश्यक रूप से नहीं खोलता।
- source_word: λέγω γὰρ ὑμῖν
  choice: क्योंकि मैं तुमसे कहता हूँ
  rationale: ‘क्योंकि’ γάρ के व्याख्यात्मक संबंध को बनाए रखता है; ‘मैं तुमसे कहता हूँ’ गंभीर किंतु स्वाभाविक हिन्दी है।
- source_word: δύναται
  choice: समर्थ है
  rationale: यह परमेश्वर की सामर्थ्य को स्पष्ट और गरिमापूर्ण रूप में व्यक्त करता है।
- source_word: ἐκ τῶν λίθων τούτων
  choice: इन पत्थरों से
  rationale: ἐκ के स्रोत-बोध और संकेतवाचक ‘इन’ दोनों को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐγεῖραι
  choice: उत्पन्न करना
  rationale: इस संदर्भ में क्रिया का अर्थ संतान को अस्तित्व में लाना या खड़ा करना है, न कि आवश्यक रूप से मृतकों में से जिलाना। ‘उत्पन्न करना’ हिन्दी में आशय को स्पष्ट रखता है।
- source_word: τέκνα
  choice: संतान
  rationale: यह लिंग-समावेशी है और यहाँ अब्राहम के वंशजों के सामूहिक अर्थ को ‘बच्चों’ की अपेक्षा अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῷ Ἀβραάμ
  choice: अब्राहम के लिए
  rationale: 'सम्बन्ध अथवा हितसूचक dative को बनाए रखता है: ऐसी संतान जो अब्राहम से सम्बद्ध हो।'
theological_decisions:
- issue: अब्राहम के वंश पर निर्भरता
  choice: पद शारीरिक वंश को परमेश्वर के सामने पर्याप्त सुरक्षा मान लेने का खंडन करता है, पर अब्राहम की ऐतिहासिक पितृता का निषेध नहीं करता।
  alternative: इसे केवल अतिशयोक्ति मानना, या इससे जातीय इस्राएल के प्रतिस्थापन का पूरा सिद्धान्त निकालना।
  rationale: यूहन्ना की चेतावनी वंशगत विशेषाधिकार पर आत्मविश्वास को सीधे चुनौती देती है, लेकिन यह पद अपने आप में न अब्राहम की ऐतिहासिक पितृता नकारता है, न किसी व्यापक प्रतिस्थापन-सिद्धान्त को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘तुमसे’ बहुवचन श्रोताओं को सामूहिक रूप से संबोधित करता है। पादटिप्पणी का चिह्न [a] मुख्य पाठ में उपस्थित है।
