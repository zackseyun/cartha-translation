  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: hi
  text: और बपतिस्मा पाने के बाद यीशु तुरन्त जल से ऊपर आए। और देखो, आकाश खुल गया, और उन्होंने परमेश्वर की आत्मा को कबूतर के समान उतरते और उन पर आते देखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: और बपतिस्मा लेने के बाद यीशु
  rationale: अओरिस्ट कर्मवाच्य कृदन्त मुख्य क्रिया से पहले पूरी हुई घटना बताता है। हिन्दी में ‘बपतिस्मा लेने के बाद’ स्वाभाविक है और अर्थ की दृष्टि से कर्मवाच्य घटना को व्यक्त करता है; δέ को हल्के कथात्मक संयोजक ‘और’ से रखा गया है।
- source_word: εὐθὺς ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: तुरन्त जल से ऊपर आए
  rationale: εὐθύς की तात्कालिकता ‘तुरन्त’ से और ἀπό की मूल दिशा ‘से’ से सुरक्षित रहती है। ‘जल में से बाहर आए’ कहना ἀπό से अधिक स्पष्ट व्याख्या जोड़ सकता था।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला कथात्मक संकेत है; ‘देखो’ आधुनिक हिन्दी में सजीव और सुबोध है।
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: आकाश खुल गए
  rationale: यूनानी में οὐρανοί बहुवचन है, इसलिए हिन्दी में भी ‘आकाश’ के साथ बहुवचन क्रिया रखी गई है। कर्मवाच्य रूप ‘खुल गए’ मूल रूप को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πνεῦμα θεοῦ
  choice: परमेश्वर के आत्मा
  rationale: यह चयन यूनानी संबंधकारक वाक्यांश को निकटता से रखता है और मूल में न आए अधिक व्याख्यात्मक पद ‘पवित्र आत्मा’ को नहीं जोड़ता।
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: कबूतर के समान उतरते
  rationale: ὡσεὶ समानता बताता है, शाब्दिक पहचान नहीं; ‘के समान’ इस तुलना और उसकी वास्तविक अस्पष्टता को बनाए रखता है।
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: अपने ऊपर आते
  rationale: ἐρχόμενον का सामान्य अर्थ ‘आते’ रखा गया है; ‘आकर ठहरते’ या ‘उतरकर बैठते’ जैसी अधिक विशिष्ट व्याख्या नहीं जोड़ी गई। ‘अपने’ का पूर्ववर्ती कर्ता यीशु है।
theological_decisions:
- issue: πνεῦμα θεοῦ को सामान्य आत्मा या पवित्र आत्मा के रूप में स्पष्ट करना
  choice: परमेश्वर के आत्मा
  alternative: पवित्र आत्मा; परमेश्वर की ओर से एक आत्मा
  rationale: संदर्भ पवित्र आत्मा की ओर संकेत करता है, पर अनुवाद मूल पदबंध ‘परमेश्वर का आत्मा’ को रखता है और न तो उपाधि जोड़ता है, न इसे अनिश्चित बनाता है।
- issue: ὡσεὶ περιστερὰν में आत्मा और कबूतर का संबंध
  choice: कबूतर के समान
  alternative: कबूतर के रूप में
  rationale: तुलनात्मक अव्यय समानता व्यक्त करता है। इसलिए आत्मा को अक्षरशः कबूतर घोषित करने या समानता को केवल रूप अथवा केवल गति तक सीमित करने से बचा गया है।
- issue: εἶδεν का कर्ता
  choice: उन्होंने ... देखा
  alternative: उसने ... देखा; यूहन्ना ने ... देखा
  rationale: निकटतम व्याकरणिक कर्ता यीशु हैं, इसलिए सम्मानसूचक हिन्दी सर्वनाम उन्हीं की ओर संकेत करता है। यूहन्ना को कर्ता बनाना पाठ में नामित न की गई व्याख्या जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। ‘जल’, ‘परमेश्वर’ और ‘आत्मा’ बाइबलीय प्रसंग के अनुकूल परिचित शब्द हैं। सम्मानसूचक बहुवचन ‘आए/उन्होंने’ यीशु के लिए स्वाभाविक मानक हिन्दी प्रयोग है।
