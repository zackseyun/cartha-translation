id: MAT.3.7
reference: Matthew 3:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: hi
  text: पर जब उसने फरीसियों और सदूकियों में से बहुत-से लोगों को उसके बपतिस्मे के लिए आते देखा, तो उनसे कहा, “विषैले साँपों की संतानों![a] किसने तुम्हें चेतावनी दी कि तुम आनेवाले क्रोध[b] से भागो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विषैले साँपों के बच्चो!”
    reason: γεννήματα ἐχιδνῶν के लिए अधिक बोलचाल का शाब्दिक विकल्प।
  - marker: b
    text: या, “उस क्रोध से, जो आनेवाला है।”
    reason: यूनानी कृदंत की वैकल्पिक, अधिक स्पष्ट वाक्य-रचना।
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: पर जब उसने…देखा
  rationale: कालवाचक कृदंत को स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है; ‘पर’ δέ के हल्के विरोध और कथा-प्रवाह को बनाए रखता है।
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: बहुत-से फरीसियों और सदूकियों को
  rationale: यह प्रयोग उन समुदायों के बहुत-से सदस्यों की ओर संकेत करता है, सभी की ओर नहीं; ‘बहुत-से’ हिन्दी में इस अंशात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: अपने बपतिस्मे के लिए आते
  rationale: यह यूहन्ना के बपतिस्मे की ओर उनके आने को व्यक्त करता है, पर यह स्पष्ट रूप से नहीं कहता कि इस पद में उन्होंने वास्तव में बपतिस्मा लिया। ‘अपने’ का संबंध वाक्य के कर्ता, अर्थात यूहन्ना, से है।
- source_word: Γεννήματα ἐχιδνῶν
  choice: विषधर साँपों की संतानों
  rationale: γεννήματα जन्मी हुई संतान को और ἐχιδνῶν विषैले साँपों को सूचित करता है। यह रूपक की कठोरता और पैदाइश/वंश का भाव दोनों बनाए रखता है।
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: किसने तुम्हें चेतावनी दी
  rationale: भागने और आसन्न क्रोध के प्रसंग में ὑποδείκνυμι का चेताने वाला अर्थ सबसे उपयुक्त है।
- source_word: φυγεῖν ἀπὸ
  choice: से भागो
  rationale: यह φυγεῖν के तत्काल और सजीव ‘भागने’ के भाव को बनाए रखता है।
- source_word: τῆς μελλούσης ὀργῆς
  choice: आनेवाले क्रोध
  rationale: μέλλω आसन्न या भविष्य में आने वाली बात को और ὀργή क्रोध को व्यक्त करता है; अनुवाद न्याय या दंड कहकर इस धर्मवैचारिक तीव्रता को नरम नहीं करता।
theological_decisions:
- issue: संबोधित फरीसियों और सदूकियों का दायरा
  choice: वहाँ आने वाले बहुत-से फरीसियों और सदूकियों को संबोधन
  alternative: सभी फरीसियों और सदूकियों के बारे में सर्वव्यापी कथन
  rationale: यूनानी अंशात्मक रचना समुदायों के अनेक सदस्यों को दर्शाती है, आवश्यक रूप से हर सदस्य को नहीं।
- issue: ὀργή का भावी और धर्मवैचारिक बल
  choice: आनेवाला क्रोध
  alternative: आनेवाला न्याय या दंड
  rationale: ‘क्रोध’ मूल शब्द की तीव्रता और संभावित अंतकालीन संकेत को बनाए रखता है, पर उसके स्वरूप को अनावश्यक रूप से अधिक परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। भविष्यसूचक फटकार की तीक्ष्णता बनाए रखी गई है। ‘बपतिस्मा’ व्यापक रूप से पहचाना जाने वाला बाइबलीय शब्द है; वाक्य यह नहीं जोड़ता कि आने वालों ने वास्तव में बपतिस्मा लिया।
