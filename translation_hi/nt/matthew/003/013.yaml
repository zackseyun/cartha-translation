source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: hi
  text: तब यीशु गलील से यरदन नदी पर यूहन्ना के पास आते हैं[a], ताकि वे उससे बपतिस्मा लें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहुँचते हैं।” यूनानी क्रिया ऐतिहासिक वर्तमान में है, जिसका प्रयोग कथा को सजीव बनाने के लिए किया गया है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, “ताकि यूहन्ना के द्वारा उनका बपतिस्मा हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह अगले घटनाक्रम को आरंभ करने वाला संक्षिप्त और स्वाभाविक काल-सूचक शब्द है।
- source_word: παραγίνεται
  choice: आते हैं
  rationale: यूनानी ऐतिहासिक वर्तमान की सजीव कथन-शैली को हिन्दी में वर्तमान काल द्वारा बनाए रखा गया है; संदर्भ में इसका अर्थ पहुँचने के लिए आना है।
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: गलील से
  rationale: ἀπό उद्गम या प्रस्थान-स्थान बताता है; हिन्दी में यह सीधा और स्वाभाविक रूप है।
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: यरदन के पास
  rationale: गति-सूचक संदर्भ में वाक्यांश यरदन की ओर जाकर उसके पास पहुँचने को दर्शाता है; ‘के पास’ नदी को गंतव्य मानते हुए हिन्दी में स्वाभाविक है।
- source_word: πρὸς τὸν Ἰωάννην
  choice: यूहन्ना के पास
  rationale: πρός यहाँ किसी व्यक्ति की ओर गति और उसके पास पहुँचने को व्यक्त करता है। पद में दी हुई संज्ञा के अनुसार केवल ‘यूहन्ना’ रखा गया है।
- source_word: τοῦ βαπτισθῆναι
  choice: ताकि ... बपतिस्मा लें
  rationale: सव्यय infinitive उद्देश्य व्यक्त करता है। ‘ताकि’ इस प्रयोजन को स्पष्ट, सहज हिन्दी में व्यक्त करता है; कर्तृवाच्य हिन्दी-रचना यूनानी कर्मवाच्य का अर्थ सुरक्षित रखती है।
- source_word: ὑπ’ αὐτοῦ
  choice: उससे
  rationale: ὑπό + संबंध कारक व्यक्तिगत कर्ता/माध्यम को सूचित करता है। हिन्दी में ‘उससे बपतिस्मा लें’ स्वाभाविक है और सर्वनाम को अनावश्यक रूप से ‘यूहन्ना’ में नहीं बदलता।
theological_decisions:
- issue: ऐतिहासिक वर्तमान παραγίνεται का अनुवाद
  choice: वर्तमान काल ‘आते हैं’
  alternative: भूतकाल ‘आए’
  rationale: मत्ती की सजीव कथन-शैली को बनाए रखने के लिए यूनानी ऐतिहासिक वर्तमान को हिन्दी वर्तमान में रखा गया है; इससे घटनाक्रम का समय या कोई सिद्धान्त नहीं बदलता।
- issue: यूहन्ना की उपाधि
  choice: केवल ‘यूहन्ना’
  alternative: ‘यूहन्ना बपतिस्मा देनेवाला’
  rationale: इस पद में मूल पाठ केवल नाम देता है। संदर्भगत उपाधि जोड़ने के बजाय पद की अभिव्यक्ति सुरक्षित रखी गई है।
- issue: βαπτισθῆναι की कर्मवाच्यता
  choice: ‘उससे बपतिस्मा लें’
  alternative: ‘उसके द्वारा बपतिस्मा दिया जाए’
  rationale: चुना हुआ हिन्दी मुहावरा यीशु को बपतिस्मा ग्रहण करनेवाले और यूहन्ना को उसे देनेवाले के रूप में स्पष्ट रखता है, जबकि भारी कर्मवाच्य से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘बपतिस्मा’ प्रचलित बाइबलीय शब्द है। ‘यरदन के पास, यूहन्ना के पास’ मूल के दो क्रमिक स्थान-संबंधों को सुरक्षित रखता है, यद्यपि हिन्दी में दोहराव को वाक्य-विराम से सहज बनाया गया है।
