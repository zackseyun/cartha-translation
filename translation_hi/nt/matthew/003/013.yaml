- from: तब यीशु गलील से यरदन के पास, यूहन्ना के पास आते हैं[a], ताकि उससे बपतिस्मा लें[b]।
  to: तब यीशु गलील से यरदन नदी पर यूहन्ना के पास आते हैं[a], ताकि वे उससे बपतिस्मा लें[b]।
  rationale: Revision strengthens the rendering of the Jordan as the actual destination, improves the flow of the two location phrases in Hindi, and clarifies the subject of the purpose clause. It retains the Greek historical present, does not add John's title, and preserves the purpose and passive/agentive sense of the baptism expression.
  reviewer_model: gpt-5.6-terra
