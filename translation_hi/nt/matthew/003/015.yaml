  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: hi
  text: पर यीशु ने उसे उत्तर दिया, “अभी ऐसा ही होने दो, क्योंकि इसी प्रकार हमारे लिए सारी धार्मिकता[a] पूरी करना उचित है।” तब उसने उसे अनुमति दे दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारा न्याय।” यूनानी शब्द का अर्थ धार्मिकता या न्याय हो सकता है; यहाँ ‘धार्मिकता’ परमेश्वर की इच्छा के अनुरूप चलने पर मत्ती के बल के अधिक अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: पर यीशु ने उसे उत्तर दिया
  rationale: ἀποκριθεὶς ... εἶπεν का स्वाभाविक हिन्दी रूप केवल ‘उत्तर दिया’ है; δέ पिछले पद में यूहन्ना की आपत्ति के साथ विरोध दिखाता है, इसलिए ‘पर’ उपयुक्त है।
- source_word: Ἄφες ἄρτι
  choice: अभी ऐसा ही होने दो
  rationale: यहाँ ἀφίημι का अर्थ क्षमा करना नहीं, बल्कि अनुमति देना है। ‘अभी’ तात्कालिक स्थिति को और ‘ऐसा ही होने दो’ यूहन्ना द्वारा यीशु को बपतिस्मा देने की प्रासंगिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὕτως γὰρ
  choice: क्योंकि इसी प्रकार
  rationale: οὕτως उस अभी बताई गई रीति—यूहन्ना द्वारा यीशु को बपतिस्मा दिए जाने—की ओर संकेत करता है; γάρ कारण प्रस्तुत करता है।
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: हमारे लिए ... उचित है
  rationale: πρέπον नैतिक और परिस्थितिजन्य उपयुक्तता व्यक्त करता है। ‘उचित’ आधुनिक हिन्दी में साफ और गरिमापूर्ण है।
- source_word: πληρῶσαι πᾶσαν δικαιοσύνην
  choice: सारी धार्मिकता पूरी करना
  rationale: ‘पूरी करना’ πληρόω की मत्ती-संबंधी ‘पूर्ण करने’ की प्रतिध्वनि बनाए रखता है। ‘धार्मिकता’ δικαιοσύνη की व्यापकता को किसी एक कानूनी या सांप्रदायिक अर्थ तक सीमित नहीं करती।
- source_word: τότε ἀφίησιν αὐτόν
  choice: तब उसने उनकी बात मान ली
  rationale: ऐतिहासिक वर्तमान को हिन्दी कथा के भूतकाल में रखा गया है। शाब्दिक ‘उसने उन्हें अनुमति दी’ हिन्दी में असहज और संदर्भ में अस्पष्ट होता; ‘बात मान ली’ स्पष्ट करता है कि यूहन्ना ने विरोध छोड़कर यीशु के अनुरोध के अनुसार कार्य किया, बिना बपतिस्मे की क्रिया को मूल से अधिक स्पष्ट रूप से जोड़ने के।
theological_decisions:
- issue: ‘सारी धार्मिकता’ का अर्थ
  choice: इस अवसर पर परमेश्वर की धार्मिक इच्छा के अनुरूप जो उचित है, उसे पूरा करने का व्यापक संकेत
  alternative: हर वैधानिक माँग को पूरा करना; अथवा ‘सारा न्याय’
  rationale: वाक्यांश को केवल व्यवस्था-पालन तक सीमित करना या उसमें कोई पूर्ण विकसित सिद्धान्त जोड़ना मूल से अधिक निर्णायक होगा। मत्ती का प्रयोग और निकट संदर्भ परमेश्वर की इच्छा के अनुरूप आचरण के व्यापक अर्थ का समर्थन करते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘धार्मिकता’ बाइबिलीय पदावली को बनाए रखती है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्वाभाविक है। अंग्रेज़ी परामर्श-पाठ में दिया गया [a] चिह्न स्पष्टतः असंगत था, क्योंकि उसकी टिप्पणी δικαιοσύνη पर थी, जबकि चिह्न ‘him’ के बाद रखा गया था; इसलिए त्रुटिपूर्ण चिह्न को हिन्दी मुख्य पाठ में नहीं दुहराया गया।
