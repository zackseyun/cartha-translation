reference: Matthew 3:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀καὶ λέγων· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/002.yaml
  text: and saying[a], “Repent[b], for the kingdom of heaven has drawn near.”
translation:
  language: hi
  text: और वह कहता था, “मन फिराओ[a], क्योंकि स्वर्ग का राज्य[b] निकट आ गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पश्चाताप करो।” यूनानी क्रिया का आशय मन, दृष्टिकोण और दिशा में बुनियादी परिवर्तन से है; यह केवल दुःख या अपराध-बोध अनुभव करने तक सीमित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “स्वर्गों का राज्य।” मत्ती में यह परमेश्वर के राजकीय शासन के लिए प्रयुक्त विशिष्ट अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: और वह कहता था
  rationale: यह पद पिछले वाक्य से जुड़ा हुआ कृदन्तीय खंड है। हिन्दी में स्वतंत्र और स्वाभाविक वाक्य के रूप में ‘और वह कहता था’ उस जारी घोषणा का भाव व्यक्त करता है, बिना ‘प्रचार करता’ या ‘घोषणा करता’ जैसी अधिक विशिष्ट धारणा जोड़े।
- source_word: Μετανοεῖτε
  choice: मन फिराओ
  rationale: वर्तमानकालीन बहुवचन आज्ञार्थक μετανοεῖτε सोच, दृष्टिकोण और दिशा के बुनियादी परिवर्तन की पुकार है। ‘मन फिराओ’ हिन्दी की बाइबलीय परंपरा से परिचित होते हुए भी केवल अपराध-बोध की भावना तक सीमित नहीं है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह आज्ञा का आधार बताता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: ἤγγικεν
  choice: निकट आ गया है
  rationale: यूनानी पूर्णकाल बताता है कि राज्य निकट आया है और अब निकट है। ‘निकट आ गया है’ इस पूर्णकालिक पहलू को बनाए रखता है।
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: ‘स्वर्ग का राज्य’ मत्ती की विशिष्ट अभिव्यक्ति का स्वाभाविक और स्थापित हिन्दी रूप है। ‘राज्य’ βασιλεία में निहित राजकीय शासन और उसके क्षेत्र—दोनों की व्यापकता को खुला रखता है।
theological_decisions:
- issue: ‘स्वर्ग का राज्य’ का अर्थ
  choice: मुख्य पाठ में मत्ती की अभिव्यक्ति ‘स्वर्ग का राज्य’ को बनाए रखा गया है।
  alternative: परमेश्वर का शासन
  rationale: व्याख्यात्मक रूप ‘परमेश्वर का शासन’ अर्थ के एक महत्वपूर्ण पहलू को स्पष्ट करता, पर वह मत्ती की विशिष्ट शब्दावली को बदल देता। सीधा रूप पाठ की धार्मिक और साहित्यिक बनावट को सुरक्षित रखता है।
- issue: μετανοεῖτε में अपेक्षित परिवर्तन
  choice: मन फिराओ
  alternative: पश्चाताप करो
  rationale: ‘मन फिराओ’ आंतरिक दृष्टि और जीवन-दिशा के परिवर्तन की व्यापक पुकार को खुला रखता है; इसे केवल दुःख या अपराध-बोध तक सीमित नहीं करता। ‘पश्चाताप करो’ पारंपरिक और वैध विकल्प है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और घोषणात्मक रखी गई है। ‘मन फिराओ’ सामान्य पाठक के लिए संक्षिप्त है और पारंपरिक धार्मिक शब्दावली से जुड़ते हुए भी यूनानी की व्यापक पुकार को सुरक्षित रखता है।
