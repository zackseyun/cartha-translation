reference: Matthew 3:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: hi
  text: और कुल्हाड़ी पहले ही पेड़ों की जड़ पर रखी हुई है।[a] इसलिए हर वह पेड़ जो अच्छा फल नहीं देता, काट डाला जाता है और आग में फेंक दिया जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पेड़ों की जड़ के पास पड़ी है।”
    reason: κέῖται का अर्थ ‘पड़ी है’ भी हो सकता है, और πρὸς यहाँ निकटता को ‘के पास’ के रूप में व्यक्त कर सकता है।
lexical_decisions:
- source_word: ἤδη δὲ
  choice: और ... अभी से
  rationale: ἤδη की तात्कालिकता को ‘अभी से’ स्वाभाविक हिन्दी में व्यक्त करता है; δέ यहाँ हल्का संयोजक है, इसलिए ‘और’ उपयुक्त है।
- source_word: ἡ ἀξίνη
  choice: कुल्हाड़ी
  rationale: पेड़ काटने के औज़ार और न्याय के रूपक—दोनों को सीधे बनाए रखता है।
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: पेड़ों की जड़ पर रखी हुई है
  rationale: κεῖται में पड़े/रखे होने की अवस्था है; यह अनुवाद कुल्हाड़ी के पहले से वार के लिए तैयार रखे होने का चित्र बनाए रखता है।
- source_word: πᾶν οὖν δένδρον
  choice: इसलिए हर वह पेड़
  rationale: οὖν का निष्कर्षसूचक बल ‘इसलिए’ से स्पष्ट होता है और ‘हर वह पेड़’ अगले विशेषणात्मक वाक्यांश से सहजता से जुड़ता है।
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: जो अच्छा फल नहीं देता
  rationale: पेड़ के संदर्भ में हिन्दी का स्वाभाविक प्रयोग ‘फल देना’ है; यह जारी या चारित्रिक निष्फलता का भाव भी व्यक्त करता है।
- source_word: ἐκκόπτεται
  choice: काट डाला जाता
  rationale: पेड़ के संदर्भ में काट गिराने का प्रबल और स्वाभाविक हिन्दी रूप है।
- source_word: εἰς πῦρ βάλλεται
  choice: आग में फेंक दिया जाता है
  rationale: βάλλεται की क्रिया और न्याय के स्पष्ट किंतु अनिर्दिष्ट अग्नि-चित्र को अक्षुण्ण रखता है।
theological_decisions:
- issue: आग के चित्र का स्वरूप
  choice: केवल ‘आग’ कहकर मूल रूपक बनाए रखा गया है।
  alternative: इसे स्पष्ट रूप से अंतिम न्याय, सांसारिक न्याय या नरक की आग कहना।
  rationale: मूल पद न्याय का चित्र प्रस्तुत करता है, पर आग की प्रकृति को इससे अधिक परिभाषित नहीं करता; इसलिए किसी संकीर्ण धर्मवैज्ञानिक व्याख्या को पाठ में नहीं जोड़ा गया।
- issue: वर्तमान काल के कर्मवाच्य का बल
  choice: ‘काट डाला जाता और आग में फेंक दिया जाता है’
  alternative: ‘काटा जाएगा और आग में फेंका जाएगा’
  rationale: मूल में दोनों क्रियाएँ वर्तमान काल में हैं। हिन्दी वर्तमान कर्मवाच्य चेतावनी की सजीव निश्चितता को बनाए रखता है, जबकि भविष्यकाल मूल की व्याकरणिक काल-अस्पष्टता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘अच्छा फल देना’ तथा ‘काट डाला जाना’ सामान्य पाठक के लिए स्वाभाविक हैं। मुख्य पाठ में [a] चिह्न संबद्ध वाक्य के तुरंत बाद रखा गया है।
