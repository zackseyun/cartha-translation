source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: hi
  text: “मैं तो तुम्हें पश्चाताप के लिए[a] पानी से[b] बपतिस्मा देता हूँ, पर जो मेरे बाद आ रहा है, वह मुझसे अधिक सामर्थी है। मैं उसकी जूतियाँ उठाने के योग्य भी नहीं हूँ। वही तुम्हें पवित्र आत्मा और आग से[c] बपतिस्मा देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पश्चाताप के लिए’ का अनुवाद ‘पश्चाताप की ओर’ भी किया जा सकता है। यूनानी εἰς में दिशा या उद्देश्य का भाव है, पर यह वाक्य अपने आप यह निश्चित नहीं करता कि पश्चाताप बपतिस्मे से पहले होता है या बपतिस्मा उसे चिह्नित करता है।
    reason: lexical_alternative
  - marker: b
    text: या “पानी में”; यहाँ और आगे यूनानी पूर्वसर्ग ἐν का अनुवाद सन्दर्भ के अनुसार “में” या “से” किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: “आग” यहाँ शुद्धिकरण या न्याय की ओर संकेत कर सकती है; यूनानी पद स्वयं इस छवि को खुला रखता है, इसलिए अर्थ समझने में आस-पास के सन्दर्भ पर ध्यान देना चाहिए।
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω
  choice: बपतिस्मा देता हूँ
  rationale: स्थापित और व्यापक हिन्दी धार्मिक शब्दावली को बनाए रखता है तथा क्रिया का अर्थ किसी एक विधि, जैसे केवल डुबोना, तक सीमित नहीं करता।
- source_word: ἐν ὕδατι
  choice: पानी से
  rationale: हिन्दी में बपतिस्मा के माध्यम को स्वाभाविक ढंग से व्यक्त करता है। ἐν का अर्थ यहाँ ‘में’ या ‘से’ हो सकता है; विकल्प को पादटिप्पणी में रखा गया है।
- source_word: εἰς μετάνοιαν
  choice: पश्चाताप के लिए
  rationale: εἰς की उद्देश्यात्मक अथवा दिशात्मक शक्ति को संक्षेप में व्यक्त करता है, बिना यह निश्चित किए कि पश्चाताप बपतिस्मे से पहले होता है या उसके द्वारा चिह्नित होता है।
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: पर जो मेरे बाद आ रहा है
  rationale: कृदन्त की वर्तमान/आगामी गतिशीलता और यूहन्ना के बाद आने वाले व्यक्ति का क्रम दोनों स्वाभाविक हिन्दी में सुरक्षित रहते हैं।
- source_word: ἰσχυρότερός μού
  choice: वह मुझसे अधिक सामर्थी है
  rationale: तुलनात्मक अर्थ को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: मैं उसकी ... के योग्य भी नहीं हूँ
  rationale: ἱκανός का शाब्दिक अर्थ ‘समर्थ/पर्याप्त’ हो सकता है, पर इस विनम्रता-सूचक कथन में ‘योग्य’ उसके मुहावरेदार आशय को ठीक व्यक्त करता है।
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: उसकी जूतियाँ उठाने
  rationale: βαστάσαι का अर्थ ‘उठाना/ढोना’ है, ‘उतारना’ नहीं। ‘जूतियाँ’ प्राचीन पादत्राणों के लिए समझने योग्य हिन्दी है।
- source_word: αὐτὸς
  choice: वही
  rationale: बलाघाती सर्वनाम को सुरक्षित रखते हुए यूहन्ना और आने वाले व्यक्ति के कार्यों के बीच स्पष्ट विरोध दिखाता है।
- source_word: ἐν πνεύματι ἁγίῳ
  choice: पवित्र आत्मा ... से
  rationale: सन्दर्भ में πνεῦμα ἅγιον को पवित्र आत्मा का व्यक्तिगत उल्लेख माना गया है; ‘से’ हिन्दी में माध्यम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: καὶ πυρί
  choice: और आग से
  rationale: आग की छवि को बिना व्याख्यात्मक विस्तार के बनाए रखता है, ताकि शुद्धिकरण और न्याय से जुड़ी सम्भावनाएँ खुली रहें।
theological_decisions:
- issue: ‘पवित्र आत्मा और आग’ का अर्थ
  choice: मुख्य पाठ में ‘पवित्र आत्मा और आग से’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘पवित्र आत्मा और शुद्ध करने वाली आग से’ अथवा ‘पवित्र आत्मा और न्याय की आग से’
  rationale: निकटवर्ती सन्दर्भ में आग शुद्धिकरण अथवा न्याय की ओर संकेत कर सकती है। अनुवाद इस तनाव को किसी एक व्याख्या के पक्ष में समाप्त नहीं करता।
- issue: πνεύματι ἁγίῳ का अभिप्राय
  choice: पवित्र आत्मा
  alternative: पवित्र आत्मिक प्रभाव अथवा पवित्र आत्मा की शक्ति
  rationale: मत्ती के इस सन्दर्भ और नए नियम के सामान्य प्रयोग में यह पद पवित्र आत्मा की ओर संकेत करता है; पाठ में ‘शक्ति’ जैसी अतिरिक्त व्याख्या नहीं जोड़ी गई।
