id: MAT.3.12
reference: Matthew 3:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: hi
  text: उसका अनाज ओसाने का सूप[a] उसके हाथ में है। वह अपने खलिहान को पूरी तरह साफ करेगा और अपने गेहूँ को भंडारघर[b] में इकट्ठा करेगा, पर भूसी को ऐसी आग में पूरी तरह जला देगा जो बुझाई नहीं जा सकती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अनाज ओसाने का फावड़ा।’ यूनानी शब्द उस उपकरण को दर्शाता है जिससे अनाज उछालकर दाने और भूसी अलग किए जाते थे।
    reason: lexical_alternative
  - marker: b
    text: या ‘कोठार’ अथवा ‘अनाज-भंडार।’
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: अनाज ओसाने का सूप
  rationale: यह अनाज को उछालकर दाने और भूसी अलग करने के कृषि-उपकरण को दर्शाता है। आधुनिक हिन्दी में ‘सूप’ इस कार्य के लिए सहज और व्यापक रूप से समझा जाने वाला शब्द है; उपकरण के सटीक आकार की अनिश्चितता फुटनोट में रखी गई है।
- source_word: διακαθαριεῖ
  choice: पूरी तरह साफ करेगा
  rationale: संयुक्त क्रिया खलिहान को पूर्ण रूप से साफ कर देने पर बल देती है; यह अनुवाद उस तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἅλωνα
  choice: खलिहान
  rationale: अनाज की मड़ाई और ओसाई के स्थान के लिए यह प्रचलित और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: σῖτον
  choice: गेहूँ
  rationale: शब्द अनाज को सामान्य रूप से भी दर्शा सकता है, पर भूसी के साथ इस ओसाई-चित्र में ‘गेहूँ’ स्वाभाविक और ठोस अर्थ देता है।
- source_word: ἀποθήκην
  choice: भंडारघर
  rationale: यह संग्रह के स्थान का सामान्य अर्थ बनाए रखता है और किसी विशेष प्रकार की इमारत अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: ἄχυρον
  choice: भूसी
  rationale: ओसाई के प्रसंग में यह दाने से अलग किए जाने वाले हल्के, अनुपयोगी भाग के लिए सहज हिन्दी शब्द है।
- source_word: κατακαύσει
  choice: पूरी तरह जला देगा
  rationale: संयुक्त क्रिया जलाकर नष्ट कर देने की पूर्णता पर बल देती है, जिसे ‘पूरी तरह’ स्पष्ट करता है।
- source_word: πυρὶ ἀσβέστῳ
  choice: ऐसी आग में ... जो बुझाई नहीं जा सकती
  rationale: यह ἄσβεστος का सीधा अर्थ सहज हिन्दी में व्यक्त करता है और आग की अनिवार्य, न बुझ सकने वाली प्रकृति बनाए रखता है।
- source_word: οὗ
  choice: उसका
  rationale: सम्बन्धवाचक सर्वनाम पिछले पद के आने वाले व्यक्ति की ओर संकेत करता है। हिन्दी में ‘उसका’ से आरम्भ करना उस सम्बन्ध को स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: गेहूँ और भूसी को अलग करने के द्वारा न्याय का चित्रण
  choice: कृषि-रूपक और भावी निर्णायक कार्रवाई को बिना नरम किए ज्यों का त्यों रखा गया है।
  alternative: मुख्य पाठ में गेहूँ को धर्मियों और भूसी को दुष्टों के रूप में स्पष्ट कर देने वाला व्याख्यात्मक रूपान्तर।
  rationale: पद स्वयं ठोस रूपक और उसके कठोर परिणाम प्रस्तुत करता है, पर पात्रों का अर्थ सीधे नहीं खोलता। अनुवाद को धार्मिक तनाव और चित्रात्मकता बनाए रखनी चाहिए, न कि व्याख्या को मुख्य पाठ में जोड़ना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कृषि-चित्र को परिचित हिन्दी शब्दावली—‘सूप’, ‘खलिहान’, ‘गेहूँ’, ‘भूसी’—में व्यक्त किया गया है। वाक्य में मूल के बलाघात को ‘पूरी तरह साफ करेगा’ और ‘पूरी तरह जला देगा’ से सुरक्षित रखा गया है।
