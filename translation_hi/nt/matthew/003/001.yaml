lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: उन दिनों
  rationale: कालसूचक वाक्यांश का स्वाभाविक हिन्दी रूप; δέ का हल्का संक्रमण अलग शब्द से व्यक्त करना आवश्यक नहीं।
- source_word: παραγίνεται
  choice: आया
  rationale: ऐतिहासिक वर्तमान को हिन्दी कथात्मक शैली में भूतकाल से व्यक्त किया गया है; इससे किसी चमत्कारी प्रकट होने का अनावश्यक संकेत नहीं मिलता।
- source_word: Ἰωάννης
  choice: यूहन्ना
  rationale: बाइबलीय हिन्दी में प्रचलित नामरूप।
- source_word: ὁ βαπτιστὴς
  choice: बपतिस्मा देनेवाला
  rationale: उपाधि के क्रियात्मक अर्थ को स्पष्ट और स्वाभाविक हिन्दी में रखता है तथा किसी आधुनिक सम्प्रदाय-नाम का भ्रम नहीं पैदा करता।
- source_word: κηρύσσων
  choice: प्रचार करने लगा
  rationale: मुख्य क्रिया के साथ चलने वाली उद्घोषणा की गतिविधि को सहज हिन्दी कथन में व्यक्त करता है।
- source_word: ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
  choice: यहूदिया के निर्जन प्रदेश में
  rationale: ἔρημος को रेतीले मरुस्थल तक सीमित किए बिना उजाड़ या कम आबाद भूभाग का अर्थ देता है; Ἰουδαία क्षेत्र यहूदिया है।
theological_decisions:
- issue: यूहन्ना की उपाधि βαπτιστής
  choice: बपतिस्मा देनेवाला
  alternative: बपतिस्मा देनेवाला यूहन्ना / बैपटिस्ट
  rationale: यह lexical उपाधि है। क्रियात्मक हिन्दी मूल अर्थ को स्पष्ट रखती है और इसे किसी वर्तमान सम्प्रदाय की पहचान नहीं बनाती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। 'निर्जन प्रदेश' यूनानी ἔρημος की व्यापक भौगोलिक धारणा को सुरक्षित रखता है।
