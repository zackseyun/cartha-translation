id: MAT.3.17
reference: Matthew 3:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: hi
  text: और देखो, स्वर्गों[a] से एक आवाज़ ने कहा, “यह मेरा प्रिय पुत्र है, जिससे मैं अत्यन्त प्रसन्न हूँ।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्ग से।” यूनानी में “स्वर्गों से” बहुवचन है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, “जिसमें मैंने प्रसन्नता पाई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: और देखो
  rationale: ἰδού एक ध्यान आकर्षित करने वाला कथन-सूचक है। ‘देखो’ उसकी आकस्मिक और गंभीर शक्ति बनाए रखता है तथा आधुनिक हिन्दी में सहज है।
- source_word: φωνὴ
  choice: एक आवाज़
  rationale: यहाँ φωνή स्पष्ट वाणी को सूचित करता है, केवल ध्वनि को नहीं, क्योंकि इसके बाद प्रत्यक्ष कथन आता है।
- source_word: ἐκ τῶν οὐρανῶν
  choice: स्वर्गों से
  rationale: यूनानी पाठ में οὐρανῶν बहुवचन है। ‘स्वर्गों से’ मूल रूप को बनाए रखता है; अधिक प्रचलित एकवचन विकल्प पादटिप्पणी में दिया गया है।
- source_word: λέγουσα
  choice: ने कहा
  rationale: वर्तमान कृदन्त आवाज़ से संबद्ध होकर उद्धरण का परिचय देता है। हिन्दी में ‘एक आवाज़ ने कहा’ स्वाभाविक है और अर्थ को स्पष्ट रखता है।
- source_word: Οὗτός ἐστιν
  choice: यह ... है
  rationale: यह संकेतवाचक सर्वनाम और क्रिया का सीधा, स्वाभाविक हिन्दी समतुल्य है और पहचान कराने की शक्ति बनाए रखता है।
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: मेरा प्रिय पुत्र
  rationale: ‘प्रिय’ ἀγαπητός के प्रेमपूर्ण अर्थ को संक्षेप और गरिमा के साथ व्यक्त करता है। हिन्दी में विशेषण को ‘पुत्र’ से पहले रखना स्वाभाविक है।
- source_word: ἐν ᾧ
  choice: जिससे
  rationale: εὐδοκέω के साथ यह सम्बन्धगत भाव व्यक्त करता है; ‘जिससे’ आधुनिक हिन्दी में स्वाभाविक है। अधिक शाब्दिक ‘जिसमें’ पादटिप्पणी में सुरक्षित है।
- source_word: εὐδόκησα
  choice: मैं अत्यन्त प्रसन्न हूँ
  rationale: सूत्रात्मक दिव्य घोषणा में यूनानी एओरिस्ट को वर्तमान दशा के रूप में व्यक्त करना हिन्दी में स्वाभाविक है। ‘अत्यन्त प्रसन्न’ प्रबल अनुमोदन को व्यक्त करता है, बिना क्रिया-पक्ष पर अनावश्यक जोर दिए।
theological_decisions:
- issue: यीशु के पुत्रत्व की दिव्य घोषणा
  choice: मेरा प्रिय पुत्र
  alternative: मेरा अत्यन्त प्यारा पुत्र
  rationale: यह अनुवाद मूल पाठ के स्पष्ट पुत्रत्व और प्रेम के कथन को सुरक्षित रखता है, पर पाठ से परे कोई अतिरिक्त धर्मसैद्धान्तिक व्याख्या नहीं जोड़ता।
- issue: οὐρανῶν का बहुवचन
  choice: स्वर्गों से
  alternative: स्वर्ग से
  rationale: मूल यूनानी बहुवचन को मुख्य पाठ में बनाए रखा गया है, जबकि हिन्दी में अधिक परिचित एकवचन को पादटिप्पणी में दिया गया है।
- issue: ἐν ᾧ εὐδόκησα का सम्बन्ध और क्रिया-पक्ष
  choice: जिससे मैं अत्यन्त प्रसन्न हूँ
  alternative: जिसमें मैंने प्रसन्नता पाई
  rationale: मुख्य पाठ स्वाभाविक हिन्दी में दिव्य प्रसन्नता की वर्तमान घोषणा व्यक्त करता है; पादटिप्पणी अधिक शाब्दिक रचना और भूतकालीन रूप को दिखाती है, ताकि मूल की अभिव्यक्ति छिपे नहीं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘देखो’ मूल के ध्यानाकर्षक कथन-सूचक को बनाए रखता है; ‘स्वर्गों’ मूल के असामान्य बहुवचन को जानबूझकर सुरक्षित रखता है।
