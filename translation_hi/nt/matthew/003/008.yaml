  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: hi
  text: इसलिए मन फिराव के योग्य फल लाओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मन फिराव के अनुरूप फल लाओ।”
