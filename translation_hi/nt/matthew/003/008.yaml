lexical_decisions:
- source_word: ποιήσατε
  choice: लाओ
  rationale: यह द्वितीय पुरुष बहुवचन का आदेश है। फल के रूपक के साथ हिंदी में ‘फल लाओ’ स्वाभाविक है और निर्णायक आह्वान का बल बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले संदर्भ से निष्कर्ष और परिणाम का संबंध स्पष्ट करता है।
- source_word: καρπὸν
  choice: फल
  rationale: मूल का एकवचन सामूहिक अर्थ में है और दिखाई देने वाले आचरण या परिणाम का रूपक है; हिंदी में ‘फल’ यही अर्थ सहजता से देता है।
- source_word: ἄξιον
  choice: के योग्य
  rationale: यह संबंध उपयुक्तता या अनुरूपता व्यक्त करता है, न कि फल द्वारा मन फिराव अर्जित किए जाने का विचार। अधिक स्पष्ट अर्थ ‘के अनुरूप’ है, जिसे पादटिप्पणी में रखा गया है।
- source_word: μετανοίας
  choice: मन फिराव
  rationale: यह केवल विचार बदलने तक सीमित नहीं, बल्कि व्यक्ति के भीतर और दिशा में वास्तविक परिवर्तन को सूचित करता है। ‘मन फिराव’ हिंदी बाइबलीय संदर्भ में संक्षिप्त और अर्थपूर्ण है।
theological_decisions:
- issue: καρπὸν ἄξιον τῆς μετανοίας का संबंध
  choice: ऐसा फल जो मन फिराव के योग्य अथवा उसके अनुरूप हो
  alternative: ऐसा फल जो मन फिराव को अर्जित करे या उसके मूल्य के बराबर हो
  rationale: ἄξιον के साथ संबंधवाचक रूप यहाँ अनुरूपता और उपयुक्तता दर्शाता है। आदेश बाहरी जीवन में मन फिराव के अनुरूप परिणाम की माँग करता है; यह नहीं कहता कि कर्म मन फिराव को खरीदते या उत्पन्न करते हैं।
translation_notes:
  register: आधुनिक, संक्षिप्त और गरिमापूर्ण हिंदी। वाक्य की आज्ञार्थक शक्ति और फल का रूपक सुरक्षित रखा गया है। पादटिप्पणी मुख्य वाक्य के ‘के योग्य’ का संबंधपरक अर्थ स्पष्ट करती है।
