translation:
  language: hi
  text: 'ताकि वह वचन पूरा हो जो यशायाह भविष्यद्वक्ता के द्वारा कहा गया था, अर्थात्:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह प्रयोजन अथवा परिणाम बताने वाला उपवाक्य आरम्भ करता है; ‘ताकि’ दोनों के बीच की मूल अस्पष्टता को अनावश्यक रूप से नहीं मिटाता।
- source_word: πληρωθῇ
  choice: पूरा हो
  rationale: यह मत्ती के प्रचलित पूर्ति-सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और निष्क्रिय भाव को बनाए रखता है।
- source_word: τὸ ῥηθὲν
  choice: वह वचन ... जो ... कहा गया था
  rationale: संज्ञा की तरह प्रयुक्त कृदन्त का अर्थ ‘जो कहा गया था’ है; ‘वचन’ जोड़ने से हिन्दी वाक्य स्वाभाविक और स्पष्ट बनता है।
- source_word: διὰ
  choice: के द्वारा
  rationale: सम्बन्धकारक के साथ διά मध्यस्थ माध्यम को दर्शाता है; यह यशायाह को संदेश का मानवीय माध्यम बताता है, अनिवार्यतः उसका परम स्रोत नहीं।
- source_word: Ἠσαΐου
  choice: यशायाह
  rationale: भविष्यद्वक्ता के नाम का हिन्दी बाइबल-परम्परा में प्रचलित रूप।
- source_word: τοῦ προφήτου
  choice: भविष्यद्वक्ता
  rationale: यशायाह की अपपदात्मक पहचान को स्पष्ट रूप से बनाए रखता है।
- source_word: λέγοντος
  choice: इसके अनुसार
  rationale: यह अगले पद में आने वाले उद्धरण की ओर स्वाभाविक हिन्दी में संकेत करता है; यूनानी कृदन्त का शाब्दिक रूप ‘कहते हुए’ हिन्दी में असहज और कर्ता की दृष्टि से संदिग्ध हो सकता है।
theological_decisions:
- issue: भविष्यवाणी के कथन में माध्यम
  choice: यशायाह भविष्यद्वक्ता के द्वारा
  alternative: यशायाह भविष्यद्वक्ता ने कहा था
  rationale: ‘के द्वारा’ यूनानी διά के मध्यस्थता-सूचक बल को सुरक्षित रखता है और यह खुला रखता है कि परम वक्ता कोई और है, जबकि यशायाह मानवीय माध्यम हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘वह वचन’ मत्ती के पूर्ति-सूत्र के अनुरूप है; पद के अंत का द्विबिंदु अगले पद के उद्धरण से इसका सम्बन्ध दिखाता है।
