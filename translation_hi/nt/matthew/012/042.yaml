id: MAT.12.42
reference: Matthew 12:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: hi
  text: दक्षिण की रानी[a] न्याय के समय इस पीढ़ी के साथ उठेगी और इसे दोषी ठहराएगी, क्योंकि वह पृथ्वी के छोरों से सुलैमान की बुद्धि सुनने आई थी; और देखो, यहाँ सुलैमान से भी बढ़कर कुछ है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दक्षिण की रानी’ से शीबा की रानी की ओर संकेत है (1 राजा 10:1–13; 2 इतिहास 9:1–12), हालाँकि यूनानी पाठ में ‘शीबा’ नाम स्पष्ट रूप से नहीं आया है।
    reason: cross_reference
  - marker: b
    text: या, ‘यहाँ सुलैमान से भी महान कोई है।’ यूनानी में ‘सुलैमान से बढ़कर’ के लिए तुलनात्मक शब्द नपुंसकलिंग रूप में है; इसलिए मुख्य पाठ का ‘कुछ’ यीशु और उसके कार्य में उपस्थित उस श्रेष्ठ वास्तविकता पर जोर दे सकता है जो सुलैमान से बढ़कर है।
    reason: alternative_reading
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: दक्षिण की रानी
  rationale: यूनानी संबंधकारक पदबंध का सीधा अर्थ रखा गया है। मुख्य पाठ में ‘शीबा की रानी’ कहना पुराने नियम की पृष्ठभूमि को पाठ में जोड़ देता, जबकि यूनानी में शीबा का नाम नहीं है।
- source_word: ἐγερθήσεται
  choice: उठेगी
  rationale: यह रूप ‘उठेगी’ या ‘जिलाई जाएगी’ का भाव दे सकता है। ‘उठेगी’ न्याय के लिए खड़े होने और पुनरुत्थान—दोनों संभावित संकेतों को खुला रखता है।
- source_word: ἐν τῇ κρίσει
  choice: न्याय के समय
  rationale: यह निश्चित अंतिम न्याय की ओर संकेत करता है। ‘न्याय के समय’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ को अनावश्यक रूप से विस्तृत नहीं करता।
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: इस पीढ़ी के साथ
  rationale: μετά संबंधकारक के साथ सामान्यतः ‘के साथ’ है। विरोध या दोषारोपण का भाव अगले क्रियापद ‘दोषी ठहराएगी’ से आता है, इसलिए इसे ‘के विरुद्ध’ नहीं किया गया।
- source_word: κατακρινεῖ αὐτήν
  choice: इसे दोषी ठहराएगी
  rationale: κατακρίνω का न्यायिक अर्थ ‘दोषी ठहराना’ है। ‘इसे’ का संबंध निकटवर्ती ‘इस पीढ़ी’ से स्पष्ट है।
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: पृथ्वी के छोरों से
  rationale: मूल का प्रचलित अतिशयोक्तिपूर्ण मुहावरा अत्यन्त दूर स्थान को व्यक्त करता है; चित्रात्मक भाषा को बनाए रखा गया है।
- source_word: τὴν σοφίαν Σολομῶνος
  choice: सुलैमान की बुद्धि
  rationale: यह संबंधकारक रचना का स्वाभाविक हिन्दी रूप है और σοφία के लिए प्रचलित बाइबिलीय शब्द ‘बुद्धि’ रखता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान खींचने वाला उद्गार है। ‘देखो’ आधुनिक, स्पष्ट और प्रसंग के अनुरूप गंभीर है।
- source_word: πλεῖον Σολομῶνος
  choice: सुलैमान से भी बढ़कर कुछ
  rationale: πλεῖον नपुंसकलिंग रूप है। ‘कुछ’ उस व्याकरणिक विशेषता और कथन की व्यापकता को बचाता है; इसे सीधे ‘कोई’ करके केवल पुरुषवाचक अर्थ में सीमित नहीं किया गया।
- source_word: ὧδε
  choice: यहाँ ... है
  rationale: ὧδε का सीधा अर्थ ‘यहाँ’ है; हिन्दी वाक्य के लिए ‘है’ स्वाभाविक रूप से जोड़ा गया है।
theological_decisions:
- issue: न्याय के प्रसंग में ἐγερθήσεται का पुनरुत्थान और साक्षी के रूप में खड़े होने का संबंध
  choice: उठेगी
  alternative: जी उठेगी / उठ खड़ी होगी
  rationale: ‘जी उठेगी’ पुनरुत्थान को अधिक स्पष्ट कर देता है और ‘उठ खड़ी होगी’ न्यायिक मुद्रा पर अधिक जोर देता है। ‘उठेगी’ मूल की दोनों संभावित छटाओं को बनाए रखता है।
- issue: यीशु के संबंध में नपुंसकलिंग πλεῖον का अनुवाद
  choice: सुलैमान से भी बढ़कर कुछ
  alternative: सुलैमान से भी महान कोई
  rationale: नपुंसकलिंग रूप केवल एक पुरुष व्यक्ति की तुलना से अधिक व्यापक वास्तविकता—यीशु और उसके कार्य में उपस्थित श्रेष्ठता—की ओर संकेत कर सकता है। ‘कुछ’ इस तनाव को बनाए रखता है, जबकि प्रसंग में यीशु का स्वयं की ओर संकेत करना भी बना रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘दोषी ठहराएगी’ न्यायिक भाव को स्पष्ट करता है; ‘देखो’ मूल के ध्यानाकर्षक उद्गार को स्वाभाविक ढंग से रखता है।
