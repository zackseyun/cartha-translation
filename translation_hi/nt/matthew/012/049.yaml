id: MAT.12.49
reference: Matthew 12:49
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: hi
  text: और अपने चेलों की ओर हाथ बढ़ाकर उसने कहा, “देखो, ये हैं मेरी माता और मेरे भाई[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शब्द ‘भाई’ पुल्लिंग बहुवचन में है; इसलिए यहाँ इसका विस्तार ‘भाई-बहन’ के रूप में नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτείνας
  choice: हाथ बढ़ाकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से जुड़ी पहले की शारीरिक क्रिया बताता है; ‘हाथ बढ़ाकर’ स्वाभाविक हिन्दी में उस संकेत को स्पष्ट रखता है।
- source_word: τὴν χεῖρα αὐτοῦ
  choice: अपना हाथ
  rationale: χεῖρα का सामान्य और प्रसंगानुकूल अर्थ ‘हाथ’ है; सम्बन्धवाचक αὐτοῦ को हिन्दी में स्वाभाविक रूप से ‘अपना’ कहा गया है।
- source_word: ἐπὶ τοὺς μαθητὰς αὐτοῦ
  choice: अपने चेलों की ओर
  rationale: कर्मकारक के साथ ἐπί यहाँ संकेत की दिशा व्यक्त करता है। μαθηταί के लिए ‘चेले’ यीशु और उनके शिक्षार्थी-अनुयायियों के सम्बन्ध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ἰδοὺ
  choice: देखो, ये हैं
  rationale: ἰδού ध्यान खींचने और सामने उपस्थित व्यक्तियों की ओर संकेत करने वाला शब्द है। हिन्दी में ‘देखो, ये हैं’ उसके बल और संकेतात्मक कार्य दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μήτηρ
  choice: माता
  rationale: यह सामान्य पारिवारिक पद है; ‘माता’ वर्तमान, गरिमापूर्ण और स्पष्ट हिन्दी है।
- source_word: ἀδελφοί
  choice: भाई
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है और यहाँ शाब्दिक पारिवारिक भाषा के समानांतर आता है; इसलिए इसे समावेशी विस्तार किए बिना ‘भाई’ रखा गया है।
theological_decisions:
- issue: यीशु द्वारा पारिवारिक सम्बन्ध की नई पहचान में नातेदारी की भाषा
  choice: ‘माता’ और ‘भाई’ जैसे ठोस पारिवारिक शब्दों को बनाए रखना
  alternative: ‘परिवार’ अथवा ‘भाई-बहन’ जैसा व्यापक अर्थानुवाद
  rationale: पद की प्रभावशीलता इसी में है कि यीशु अपने चेलों को ठोस पारिवारिक शब्दों से पहचानते हैं। व्यापक अर्थानुवाद यूनानी पाठ से अधिक व्याख्या जोड़कर इस बल को कम कर देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चेलों’ सामान्य पाठक के लिए परिचित बाइबलीय पद है; ‘देखो, ये हैं’ ἰδού और साथ के शारीरिक संकेत को स्वाभाविक हिन्दी में जोड़ता है।
