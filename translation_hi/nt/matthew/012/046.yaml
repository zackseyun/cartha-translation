base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: hi
  text: जब वह अभी भी भीड़ को संबोधित कर रहा था, तब देखो, उसकी माँ और उसके भाई[a] बाहर खड़े थे और उससे बात करने का प्रयत्न कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके निकट संबंधी,” यदि यहाँ यूनानी शब्द को व्यापक रिश्तेदारी के अर्थ में लिया जाए; यूनानी शब्द पुल्लिंग बहुवचन है, इसलिए मुख्य पाठ में “भाई” अनुवाद किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: जब वह ... अभी बोल ही रहा था
  rationale: जननात्मक स्वतंत्र रचना समकालीन और जारी क्रिया दिखाती है। ‘अभी ... ही रहा था’ उस निरंतरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; δέ का हल्का कथात्मक संक्रमण अगले ‘तभी’ में उभरता है।
- source_word: τοῖς ὄχλοις
  choice: भीड़ से
  rationale: यूनानी में बहुवचन है, पर हिन्दी में ‘भीड़’ सामूहिक संज्ञा के रूप में अधिक स्वाभाविक है। ‘से बोलना’ यहाँ श्रोताओं को संबोधित करने का सहज हिन्दी प्रयोग है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह नया घटनाक्रम सामने लाने वाला ध्यानाकर्षक कथन-सूचक है। ‘देखो’ इसकी जीवंतता बनाए रखता है और आधुनिक पाठक के लिए सहज है।
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: उसकी माँ और उसके भाई
  rationale: संदर्भ के आधार पर माँ के साथ भी स्वत्वसूचक सर्वनाम स्वाभाविक रूप से लगाया गया है। ἀδελφοί पुल्लिंग बहुवचन है, इसलिए मुख्य पाठ में ‘भाई’ रखा गया है।
- source_word: εἱστήκεισαν ἔξω
  choice: बाहर खड़े थे
  rationale: क्रिया का पूर्णकालिक रूप परिणामी और जारी स्थिति व्यक्त करता है; हिन्दी में ‘खड़े थे’ इसका स्वाभाविक रूप है। ‘बाहर’ में किसी भवन का उल्लेख नहीं जोड़ा गया।
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: उससे बात करना चाहते थे
  rationale: ζητέω यहाँ उद्देश्यपूर्ण इच्छा या प्रयास को व्यक्त करता है। ‘बात करना चाहते थे’ आधुनिक हिन्दी में सहज है और प्रसंग में आशय को बिना अनावश्यक विस्तार के व्यक्त करता है।
theological_decisions:
- issue: यीशु के परिवार के संदर्भ में ἀδελφοί का अनुवाद
  choice: उसके भाई
  alternative: उसके भाई-बहन; उसके निकट संबंधी
  rationale: यूनानी रूप पुल्लिंग बहुवचन है और पाठ की सतह पर ‘भाई’ सबसे सीधा अनुवाद है। पादटिप्पणी यह मानती है कि कुछ संदर्भों में यह शब्द व्यापक रिश्तेदारी के लिए समझा जा सकता है, पर अनुवाद यीशु से उनके सटीक जैविक या पारिवारिक संबंध के बारे में बाद के धर्मवैज्ञानिक विवाद का निर्णय नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘देखो’ से ἰδού का कथात्मक ध्यानाकर्षण सुरक्षित रखा गया है। यूनानी बहुवचन ὄχλοις को हिन्दी के स्वाभाविक सामूहिक एकवचन ‘भीड़’ से व्यक्त किया गया है।
