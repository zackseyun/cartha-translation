id: MAT.12.47
reference: Matthew 12:47
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: hi
  text: तब किसी ने उससे कहा[a], “देखिए, आपकी माता और आपके भाई बाहर खड़े हैं और आपसे बात करना चाहते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में यह पद नहीं है।
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: तब किसी ने उससे कहा
  rationale: δέ हल्का कथात्मक संबंध दिखाता है, जिसे स्वाभाविक हिन्दी में ‘तब’ व्यक्त करता है; τις की अनिश्चितता ‘किसी ने’ से बनी रहती है।
- source_word: Ἰδοὺ
  choice: देखिए
  rationale: यह सामने की स्थिति की ओर ध्यान खींचने वाला उद्गार है। ‘देखिए’ आधुनिक, स्वाभाविक और आदरसूचक हिन्दी है।
- source_word: ἡ μήτηρ σου
  choice: आपकी माता
  rationale: संबंध और अधिकारवाचक रचना को सीधे व्यक्त करता है; ‘माता’ गरिमापूर्ण और सामान्यतः समझ में आने वाला शब्द है।
- source_word: οἱ ἀδελφοί σου
  choice: आपके भाई
  rationale: ἀδελφοί यहाँ पुरुष पारिवारिक सदस्यों को सूचित करता है, इसलिए ‘भाई’ स्रोत के लिंग-संकेत को सुरक्षित रखता है।
- source_word: ἔξω ἑστήκασιν
  choice: बाहर खड़े हैं
  rationale: ἵστημι का पूर्णकाल वर्तमान परिणामी अवस्था बताता है; ‘खड़े हैं’ उस अवस्था को और ‘बाहर’ ἔξω को स्पष्ट रखता है।
- source_word: ζητοῦντές σοι λαλῆσαι
  choice: आपसे बात करना चाहते हैं
  rationale: शाब्दिक ‘आपसे बात करने की खोज में हैं’ हिन्दी में अस्वाभाविक होगा। प्रसंग में ζητέω प्रयत्न या इच्छा बताता है; ‘बात करना चाहते हैं’ आशय को सहज हिन्दी में व्यक्त करता है, यद्यपि ‘आपसे बात करने का प्रयास कर रहे हैं’ भी संभव है।
theological_decisions:
- issue: मत्ती 12:47 की पाठालोचनात्मक स्थिति
  choice: दिए गए SBLGNT स्रोत के अनुसार पद को मुख्य पाठ में रखा गया और पांडुलिपीय लोप को पादटिप्पणी में बताया गया।
  alternative: कुछ प्राचीन पांडुलिपियों के आधार पर पूरे पद को छोड़ देना।
  rationale: स्रोत पाठ इस पद को चिह्नित रूप में प्रस्तुत करता है, जबकि कुछ साक्षी इसे छोड़ते हैं। मुख्य पाठ में अनुवाद और पादटिप्पणी में विकल्प देने से प्रमाण पारदर्शी रहता है और किसी पाठ-परंपरा को चुपचाप निर्णायक नहीं बनाया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद में यीशु के लिए आदरसूचक ‘आप’ और तदनुसार ‘देखिए’ प्रयुक्त है। भाषा गरिमापूर्ण किंतु सहज रखी गई है।
