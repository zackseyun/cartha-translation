reference: Matthew 12:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: hi
  text: “देखो[a], मेरा सेवक, जिसे मैंने चुना है; मेरा प्रिय, जिसमें मेरा मन प्रसन्न हुआ है। मैं अपना आत्मा उस पर रखूँगा, और वह राष्ट्रों[b] को न्याय[c] की घोषणा करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ध्यान दो।
    reason: शैलीगत विकल्प; Ἰδοὺ ध्यान आकर्षित करने वाली पुकार है।
  - marker: b
    text: या “गैर-यहूदियों।”
    reason: ἔθνη का अर्थ ‘राष्ट्र’ अथवा प्रसंगानुसार ‘गैर-यहूदी लोग’ हो सकता है।
  - marker: c
    text: या “न्याय-निर्णय।”
    reason: κρίσις न्यायपूर्ण व्यवस्था और न्यायिक निर्णय—दोनों अर्थ-छायाएँ रख सकता है।
lexical_decisions:
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह भविष्यवाणी में श्रोताओं का ध्यान खींचने वाली पुकार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παῖς
  choice: सेवक
  rationale: यशायाह के सेवक-विषयक उद्धरण में इसका आशय ‘बालक’ या ‘पुत्र’ के बजाय ‘सेवक’ है।
- source_word: ᾑρέτισα
  choice: जिसे मैंने चुना है
  rationale: यह परमेश्वर द्वारा किए गए निश्चित चुनाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ὁ ἀγαπητός μου
  choice: मेरा प्रिय
  rationale: यह प्रेम और गरिमा दोनों को संक्षिप्त तथा स्वाभाविक रूप से बनाए रखता है।
- source_word: εἰς ὃν εὐδόκησεν ἡ ψυχή μου
  choice: जिससे मेरा मन प्रसन्न हुआ है
  rationale: ‘मन’ यहाँ ψυχή के भावात्मक आशय को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है और परमेश्वर की प्रसन्नता को स्पष्ट रखता है।
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: मैं अपना आत्मा उस पर रखूँगा
  rationale: यह यूनानी वाक्य की भविष्यसूचक नियुक्ति की छवि को निकटता से बनाए रखता है।
- source_word: τοῖς ἔθνεσιν
  choice: राष्ट्रों को
  rationale: यह भविष्यवाणी के व्यापक अंतरराष्ट्रीय दायरे को व्यक्त करता है; प्रसंगानुसार ‘गैर-यहूदियों’ का अर्थ भी संभव है।
- source_word: κρίσιν
  choice: न्याय
  rationale: इस सेवक-विषयक भविष्यवाणी में यह परमेश्वर की न्यायपूर्ण व्यवस्था को प्रमुखता देता है, जबकि ‘न्याय-निर्णय’ का अर्थ भी शब्द में विद्यमान है।
- source_word: ἀπαγγελεῖ
  choice: घोषणा करेगा
  rationale: यह सार्वजनिक रूप से बताने या घोषित करने के भाव को गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: παῖς में मसीही सेवक की पहचान
  choice: ‘सेवक’ रखा गया है।
  alternative: ‘बालक’ या ‘पुत्र’
  rationale: यह यशायाह के सेवक-विषयक मूल संदर्भ को सुरक्षित रखता है और इस विशिष्ट शब्द में ऐसी पुत्र-संबंधी भाषा नहीं जोड़ता जो यहाँ प्रत्यक्ष नहीं है।
- issue: κρίσις का भविष्यसूचक अर्थ
  choice: मुख्य पाठ में ‘न्याय’ रखा गया है।
  alternative: ‘न्याय-निर्णय’
  rationale: प्रसंग राष्ट्रों के बीच परमेश्वर की न्यायपूर्ण व्यवस्था की घोषणा पर बल देता है; फिर भी यूनानी शब्द में निर्णय का पहलू संभव होने के कारण उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: ἔθνη का दायरा
  choice: मुख्य पाठ में ‘राष्ट्रों’ रखा गया है।
  alternative: ‘गैर-यहूदियों’
  rationale: यशायाह के उद्धरण का सार्वभौमिक दायरा ‘राष्ट्रों’ से अच्छी तरह प्रकट होता है, जबकि यहूदी दृष्टिकोण से ‘गैर-यहूदी लोगों’ का अर्थ भी संभव है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। भविष्यवाणी की औपचारिक ध्वनि बनाए रखने के लिए ‘देखो’ और ‘घोषणा करेगा’ चुने गए हैं; अनावश्यक रूप से पुरातन शब्दावली से बचा गया है।
