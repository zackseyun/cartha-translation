  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: hi
  text: पर मैं तुमसे कहता हूँ कि लोग हर एक लापरवाह बात[a] जो कहेंगे, उसके लिए उन्हें न्याय के दिन लेखा देना होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बेकार बात,” “व्यर्थ बात,” या “निष्फल बात।” यूनानी विशेषण का अर्थ ‘बेकार,’ ‘निष्फल,’ या ‘लापरवाह’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: पर मैं तुमसे कहता हूँ
  rationale: δέ यहाँ पिछले कथन के संदर्भ में हल्का विरोध या आगे बढ़ने का भाव देता है; ‘पर’ चेतावनी के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πᾶν ῥῆμα ἀργόν
  choice: जो भी लापरवाही की बात
  rationale: πᾶν का वितरणात्मक अर्थ ‘जो भी/हर’ है; ῥῆμα बोली गई बात को सूचित करता है। ἀργόν का मूल अर्थ निष्क्रिय, निष्फल या बेकार है, और इस न्याय-संदर्भ में ‘लापरवाही की’ गैर-जिम्मेदार वाणी का नैतिक भार स्पष्ट करता है।
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: लोग ... कहेंगे
  rationale: οἱ ἄνθρωποι समस्त मनुष्यों के लिए सामान्य पद है, इसलिए ‘लोग’ लिंग-समावेशी और स्वाभाविक है। λαλήσουσιν भविष्यकाल में है, जिसे ‘कहेंगे’ से बनाए रखा गया है।
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: उन्हें उसका लेखा देना होगा
  rationale: ἀποδίδωμι और λόγος का संयुक्त प्रयोग उत्तरदायित्व का लेखा देने की प्रचलित अभिव्यक्ति है; περὶ αὐτοῦ का विशिष्ट संदर्भ ‘उसका’ से सुरक्षित है। यूनानी भविष्य का न्यायिक और अनिवार्य बल हिन्दी में ‘देना होगा’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: न्याय के दिन
  rationale: ἐν के साथ काल-सूचक पद का स्वाभाविक हिन्दी रूप ‘के दिन’ है; κρίσις यहाँ न्यायिक निर्णय को दर्शाता है।
theological_decisions:
- issue: ἀργόν का नैतिक बल
  choice: लापरवाही की बात
  alternative: बेकार बात / निष्फल बात
  rationale: न्याय के संदर्भ में यह केवल हल्की-फुल्की बातचीत नहीं, बल्कि ऐसी वाणी है जिसके लिए मनुष्य उत्तरदायी है। ‘लापरवाही की’ इस गंभीरता को व्यक्त करता है, पर इसे स्पष्ट रूप से दुर्भावनापूर्ण वाणी तक सीमित नहीं करता।
- issue: οἱ ἄνθρωποι का सामान्य मानवीय अर्थ
  choice: लोग
  alternative: मनुष्य
  rationale: यह पद केवल पुरुषों को नहीं, सामान्यतः सभी मनुष्यों को सूचित करता है; ‘लोग’ आधुनिक हिन्दी में सहज और समावेशी है।
- issue: अंतिम न्याय में वाणी का उत्तरदायित्व
  choice: न्याय के दिन उन्हें उसका लेखा देना होगा
  alternative: न्याय के दिन वे उसके विषय में उत्तर देंगे
  rationale: अनुवाद न्याय की वास्तविकता और प्रत्येक ऐसी बात के लिए व्यक्तिगत उत्तरदायित्व को बनाए रखता है, बिना न्याय की प्रक्रिया या परिणाम के बारे में अतिरिक्त धर्मसैद्धांतिक विवरण जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘लेखा देना’ न्यायिक उत्तरदायित्व की परिचित हिन्दी अभिव्यक्ति है। पदक्रम को स्वाभाविक हिन्दी के अनुरूप रखा गया है, जबकि ‘उसका’ द्वारा यूनानी περὶ αὐτοῦ का स्पष्ट संदर्भ सुरक्षित है।
