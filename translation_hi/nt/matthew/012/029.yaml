id: MAT.12.29
reference: Matthew 12:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: hi
  text: या कोई बलवान आदमी के घर में घुसकर उसका सामान[a] कैसे छीन सकता है, जब तक कि वह पहले उस बलवान आदमी को बाँध न दे[b]? तब वह उसका घर लूट लेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी वस्तुएँ’ अथवा ‘उसकी संपत्ति’; यूनानी शब्द का अर्थ शाब्दिक रूप से पात्र या उपकरण भी हो सकता है और व्यापक रूप से घर का सामान भी।
    reason: lexical_alternative
  - marker: b
    text: या ‘कसकर बाँध न दे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: या
  rationale: यह पिछले तर्क से जुड़ा एक वैकल्पिक व्याख्यात्मक उदाहरण प्रस्तुत करता है; ‘या’ संक्षिप्त और स्वाभाविक है।
- source_word: πῶς δύναταί τις
  choice: कोई ... कैसे ... सकता है
  rationale: यूनानी के आलंकारिक प्रश्न और अनिश्चित कर्ता, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἰσελθεῖν εἰς τὴν οἰκίαν
  choice: घर में घुसकर
  rationale: चोरी और लूट के प्रसंग में ‘घुसना’ केवल ‘प्रवेश करना’ की अपेक्षा अधिक स्वाभाविक है और अनधिकृत प्रवेश का भाव व्यक्त करता है।
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: बलवान आदमी
  rationale: विशेषण के संज्ञात्मक प्रयोग को ठोस पुरुषवाचक रूपक के रूप में रखता है; ‘बलवान’ गरिमापूर्ण और सामान्यतः समझ में आने वाला शब्द है।
- source_word: τὰ σκεύη αὐτοῦ
  choice: उसका सामान
  rationale: σκεύη का शाब्दिक अर्थ पात्र या उपकरण हो सकता है, पर यहाँ यह घर में रखी वस्तुओं के व्यापक अर्थ में है; ‘सामान’ इस दायरे को सहज हिन्दी में व्यक्त करता है।
- source_word: ἁρπάσαι
  choice: छीन सकता है
  rationale: बलपूर्वक लेने का अर्थ व्यक्त करता है और बाद के अधिक व्यापक διαρπάσει, ‘लूट लेगा,’ से क्रियात्मक भेद बनाए रखता है।
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: जब तक कि वह पहले ... को बाँध न दे
  rationale: शर्त, ‘पहले’ की क्रमसूचकता, और बाँधने की ठोस छवि—तीनों को सुरक्षित रखता है।
- source_word: καὶ τότε
  choice: तब
  rationale: बाँधने के बाद होने वाली अगली क्रिया का क्रम स्पष्ट करता है; हिन्दी में अलग वाक्य के आरम्भ में अतिरिक्त ‘और’ आवश्यक नहीं है।
- source_word: διαρπάσει
  choice: लूट लेगा
  rationale: पूरे घर को लूटने या उसमें से वस्तुएँ उठा ले जाने का प्रबल अर्थ देता है और पहले प्रयुक्त ‘छीन’ से तीव्रता का अंतर बनाए रखता है।
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: उसका घर
  rationale: रूपक की ठोस गृह-लूट की छवि बनाए रखता है और ‘घराने’ या ‘अधिकार-क्षेत्र’ जैसी व्याख्या पाठ में नहीं जोड़ता।
theological_decisions:
- issue: रूपक में पुरुषवाचक भाषा
  choice: बलवान आदमी
  alternative: बलवान व्यक्ति / शक्तिशाली जन
  rationale: यूनानी पाठ एक ठोस पुरुषवाचक पात्र की छवि देता है। ‘बलवान आदमी’ उस रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है, बिना उसे किसी विशिष्ट पात्र की स्पष्ट पहचान में बदलने के।
- issue: ‘घर’ और ‘सामान’ के रूपक का धर्मवैज्ञानिक विस्तार
  choice: ठोस घर-लूट का रूपक यथावत रखना
  alternative: घर को ‘राज्य/अधिकार-क्षेत्र’ और सामान को उसके अधीन लोगों या संपत्ति के रूप में व्याख्यात्मक ढंग से अनूदित करना
  rationale: संदर्भ दुष्टात्मिक शक्तियों पर यीशु के अधिकार की ओर संकेत करता है, पर पद स्वयं रूपक में बोलता है। अनुवाद को निहित धर्मवैज्ञानिक अर्थ का निर्णय पाठक के लिए पहले से नहीं कर देना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘घुसकर,’ ‘सामान,’ ‘छीन,’ और ‘लूट’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि ‘बलवान आदमी’ मूल रूपक की ठोस और पुरुषवाचक छवि बनाए रखता है।
