reference: Matthew 12:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: hi
  text: पर फ़रीसियों ने यह सुनकर कहा, “यह आदमी दुष्टात्माओं को केवल बीलज़ेबूल, जो दुष्टात्माओं का सरदार है, के द्वारा निकालता है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले पद में लोगों की सकारात्मक प्रतिक्रिया के विपरीत फ़रीसियों की प्रतिक्रिया को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἀκούσαντες
  choice: यह सुनकर
  rationale: अओरिस्ट कृदंत का स्वाभाविक कालवाचक अनुवाद है; ‘यह’ का संकेत पिछले प्रसंग की घटना और प्रतिक्रिया की ओर है।
- source_word: Οὗτος
  choice: यह आदमी
  rationale: संदर्भ में संकेतवाचक शब्द के तिरस्कारपूर्ण भाव को बनाए रखता है; केवल ‘वह’ से यह भाव कम हो जाता।
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: दुष्टात्माओं को निकालता है
  rationale: भूत-बाधा से मुक्ति के संदर्भ में स्पष्ट, प्रचलित और स्रोत के निकट आधुनिक हिंदी अभिव्यक्ति है।
- source_word: εἰ μὴ
  choice: ही
  rationale: 'निषेध के साथ यह उस आरोपित एकमात्र माध्यम को व्यक्त करता है: वह केवल इसी शक्ति से ऐसा करता है।'
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: बालज़बूल की शक्ति से
  rationale: यहाँ ἐν साधन या सामर्थ्य का बोध कराता है। हिंदी में केवल ‘बालज़बूल से’ अस्पष्ट हो सकता है, इसलिए निहित साधनार्थ को स्पष्ट किया गया है।
- source_word: Βεελζεβοὺλ
  choice: बालज़बूल
  rationale: SBLGNT के यूनानी नामरूप Βεελζεβούλ का देवनागरी लिप्यंतरण है; पारंपरिक वैकल्पिक रूप पादटिप्पणी में रखा गया है।
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: दुष्टात्माओं के सरदार
  rationale: ἄρχων के अधिकार और प्रधानता के अर्थ को सहज आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: Οὗτος में निहित विरोधी या तिरस्कारपूर्ण स्वर
  choice: यह आदमी
  alternative: यह व्यक्ति; वह
  rationale: फ़रीसियों के विरोधी स्वर को बिना अतिरिक्त धर्मवैचारिक अर्थ जोड़े बनाए रखता है।
- issue: Βεελζεβούλ का नामरूप
  choice: बालज़बूल
  alternative: बालज़बूब
  rationale: मुख्य पाठ यूनानी स्रोत के -बूल नामरूप का अनुसरण करता है; परिचित पारंपरिक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἐν का साधनार्थ
  choice: की शक्ति से
  alternative: के द्वारा; में
  rationale: आरोप यह है कि यीशु दुष्टात्माओं के शासक की सामर्थ्य के माध्यम से उन्हें निकालते हैं। ‘शक्ति’ निहित साधनार्थ स्पष्ट करती है, पर उस आरोप को सत्य के रूप में अनुमोदित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फ़रीसी’, ‘दुष्टात्मा’ और ‘सरदार’ सामान्य पाठक के लिए परिचित हैं; वाक्य में फ़रीसियों के विरोधी स्वर और यूनानी की साधनात्मक संरचना दोनों सुरक्षित हैं।
