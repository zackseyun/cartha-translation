id: MAT.12.5
reference: Matthew 12:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: hi
  text: या क्या तुमने व्यवस्था में नहीं पढ़ा कि सब्त के दिनों में याजक मन्दिर में सब्त को अपवित्र करते हैं[a][b] और फिर भी निर्दोष हैं?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपवित्र करते हैं’ का अनुवाद ‘उल्लंघन करते हैं’ या ‘तोड़ते हैं’ भी हो सकता है। यूनानी क्रिया में किसी पवित्र वस्तु को सामान्य या अपवित्र मानने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से ‘सब्तों में’ है; सम्भवतः इसका आशय बार-बार आने वाले सब्त के दिनों से है, न कि केवल एक अवसर से।
    reason: lexical_alternative
  - marker: c
    text: यहाँ ‘व्यवस्था’ से मूसा की व्यवस्था अथवा उससे संबंधित शास्त्र का आशय है, जिसमें सब्त के दिन याजकीय सेवा के नियम भी आते हैं (देखें गिनती 28:9–10)।
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: या
  rationale: यह यीशु के उत्तर में एक वैकल्पिक शास्त्रीय तर्क प्रस्तुत करता है; सरल ‘या’ यूनानी के आलंकारिक प्रवाह को बनाए रखता है।
- source_word: οὐκ ἀνέγνωτε
  choice: क्या तुमने नहीं पढ़ा
  rationale: यह मत्ती में प्रयुक्त शास्त्र-संबंधी आलंकारिक प्रश्न का स्वाभाविक हिन्दी रूप है।
- source_word: ἐν τῷ νόμῳ
  choice: व्यवस्था में
  rationale: यह सामान्य नियम नहीं, बल्कि मूसा की व्यवस्था के रूप में माने जाने वाले शास्त्रीय संग्रह की ओर संकेत करता है।
- source_word: τοῖς σάββασιν
  choice: सब्त के दिनों में
  rationale: यह यूनानी बहुवचन को स्वाभाविक हिन्दी में व्यक्त करता है और बार-बार आने वाले सब्त के अवसरों का भाव सुरक्षित रखता है।
- source_word: οἱ ἱερεῖς
  choice: याजक
  rationale: मन्दिर में सेवाकार्य करने वाले पुरोहितों के लिए प्रचलित और सटीक बाइबलीय हिन्दी शब्द है।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर में
  rationale: ἱερόν मन्दिर-परिसर को सूचित कर सकता है; मुख्य पाठ में ‘मन्दिर’ इसका सहज और पर्याप्त रूप है।
- source_word: τὸ σάββατον
  choice: सब्त को
  rationale: एकवचन यहाँ सब्त के दिन अथवा उसकी पवित्र व्यवस्था को कर्म के रूप में प्रस्तुत करता है।
- source_word: βεβηλοῦσιν
  choice: अपवित्र करते हैं
  rationale: क्रिया का मूल भाव किसी पवित्र वस्तु को सामान्य अथवा अपवित्र ठहराने का है। यह ‘तोड़ते हैं’ की अपेक्षा कथन की तीक्ष्णता और धार्मिक तनाव को बेहतर बनाए रखता है।
- source_word: καὶ ἀναίτιοί εἰσιν
  choice: और फिर भी निर्दोष हैं
  rationale: ‘निर्दोष’ दोषारोपण से मुक्त होने का वैधानिक भाव देता है। ‘फिर भी’ हिन्दी में क्रिया और निर्दोषता के बीच निहित विरोध को स्पष्ट करता है, बिना उस तनाव को मिटाए।
theological_decisions:
- issue: क्या याजकों के द्वारा सब्त को अपवित्र करने वाले कथन को नरम किया जाए
  choice: ‘सब्त को अपवित्र करते हैं’ और ‘फिर भी निर्दोष हैं’—दोनों मजबूत कथनों को बनाए रखना
  alternative: ‘सब्त का उल्लंघन करते हैं और उन पर दोष नहीं लगता’ अथवा ‘सब्त को तोड़ते हैं और निर्दोष हैं’
  rationale: 'यूनानी पाठ जानबूझकर तनाव बनाए रखता है: मन्दिर की सेवा में याजक ऐसा काम करते हैं जिसे सब्त को अपवित्र करना कहा जा सकता है, फिर भी वे दोषी नहीं हैं। अनुवाद इस तनाव को किसी व्याख्यात्मक नरमी से समाप्त नहीं करता।'
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘सब्त’, ‘याजक’ और ‘व्यवस्था’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं। वाक्य का आलंकारिक प्रश्न और ‘अपवित्र’ होने पर भी ‘निर्दोष’ रहने का जानबूझकर रखा गया तनाव सुरक्षित है।
