source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: hi
  text: तब एक दुष्टात्मा से ग्रस्त मनुष्य, जो अंधा था और बोल नहीं सकता था, यीशु के पास लाया गया; और यीशु ने उसे चंगा किया, इस प्रकार कि जो बोल नहीं सकता था वह बोलने और देखने लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह अगले घटनाक्रम को क्रम से जोड़ने वाला स्वाभाविक और सटीक समय-सूचक शब्द है।
- source_word: προσηνέχθη αὐτῷ
  choice: यीशु के पास लाया गया
  rationale: यूनानी का कर्मवाच्य रूप और कर्ता का अनिर्दिष्ट होना सुरक्षित रखा गया है। संदर्भ में αὐτῷ का संकेत यीशु की ओर है; नाम का प्रयोग हिन्दी में संदर्भ को स्पष्ट और सहज बनाता है।
- source_word: δαιμονιζόμενος
  choice: दुष्टात्मा से ग्रस्त
  rationale: यह स्पष्ट रूप से दुष्टात्मिक प्रभाव को व्यक्त करता है और किसी आधुनिक चिकित्सकीय श्रेणी से उसका स्थानापन्न नहीं करता।
- source_word: τυφλὸς
  choice: अंधा
  rationale: यह यूनानी शब्द का सीधा और प्रचलित हिन्दी समतुल्य है।
- source_word: κωφός
  choice: गूँगा
  rationale: κωφός का अर्थ बहरा या बोलने में असमर्थ हो सकता है, पर परिणाम-वाक्य में उसके बोलने का उल्लेख होने से यहाँ ‘गूँगा’ संदर्भानुकूल है। अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐθεράπευσεν αὐτόν
  choice: उसे चंगा कर दिया
  rationale: सुसमाचारों के चंगाई-वृत्तांत में θεραπεύω के लिए ‘चंगा करना’ स्वाभाविक और पारदर्शी धार्मिक हिन्दी है। ‘कर दिया’ उपचार के पूर्ण परिणाम को सहज हिन्दी में व्यक्त करता है।
- source_word: ὥστε
  choice: और
  rationale: यहाँ संयोजन अगले खंड को चंगाई के परिणाम के रूप में सहज हिन्दी में जोड़ता है; ‘बोलने और देखने लगा’ परिणाम को स्पष्ट करता है।
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: वह गूँगा मनुष्य बोलने और देखने लगा
  rationale: विशेषण के संज्ञात्मक प्रयोग को ‘गूँगा मनुष्य’ से व्यक्त किया गया है। ‘लगा’ बहाल हुई क्षमता के प्रकट परिणाम को स्वाभाविक हिन्दी में बताता है, बिना अतिरिक्त घटना जोड़े।
theological_decisions:
- issue: दुष्टात्मिक पीड़ा की प्रकृति
  choice: दुष्टात्मा से ग्रस्त
  alternative: मानसिक रूप से बीमार; पीड़ित
  rationale: यूनानी पाठ स्पष्टतः दुष्टात्मिक कारण बताता है; उसे किसी आधुनिक चिकित्सकीय निदान या अस्पष्ट पीड़ा में बदलना पाठ के दावे को मिटा देता।
- issue: κωφός का संदर्भगत अर्थ
  choice: गूँगा
  alternative: बहरा; बहरा और गूँगा
  rationale: अंतिम खंड में सुनने के बजाय बोलने की बहाली कही गई है। इसलिए मुख्य पाठ में बोलने की असमर्थता व्यक्त की गई है, जबकि वास्तविक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चंगा’ बाइबलीय हिन्दी में व्यापक रूप से समझा जाने वाला शब्द है। ‘दुष्टात्मा से ग्रस्त’ स्पष्ट दुष्टात्मिक भाषा को बनाए रखता है, और κωφός की वास्तविक अर्थगत अस्पष्टता पादटिप्पणी में दी गई है।
