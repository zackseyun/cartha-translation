source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: hi
  text: और यदि शैतान शैतान को बाहर निकालता है[a], तो वह अपने ही विरुद्ध बँट गया है[b]। फिर उसका राज्य कैसे टिका रहेगा[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘निकालता है।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘अपने ही विरुद्ध विभाजित हो गया है।’
    reason: lexical_alternative
  - marker: c
    text: या, ‘फिर उसका राज्य कैसे टिक सकता है?’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: और यदि
  rationale: καὶ के संयोजक बल और εἰ की शर्त—दोनों को रखते हुए पिछले तर्क से संबंध बनाए रखता है।
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: शैतान
  rationale: व्यक्तिगत नाम/उपाधि का हिन्दी में प्रचलित लिप्यंतरण है; इसे अर्थानुवाद करके ‘विरोधी’ नहीं बनाया गया।
- source_word: ἐκβάλλει
  choice: निकालता है
  rationale: दुष्टात्मा निकालने के प्रसंग में स्वाभाविक आधुनिक हिन्दी है और बाहर करने के अर्थ को स्पष्ट रखता है।
- source_word: ἐφ’ ἑαυτὸν
  choice: अपने ही विरुद्ध
  rationale: आत्म-विरोध और आंतरिक संघर्ष का यूनानी भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐμερίσθη
  choice: बँट गया है
  rationale: अओरिस्ट पैसिव के घटित विभाजन और उसकी वर्तमान परिणामी दशा—दोनों का संकेत देता है।
- source_word: πῶς οὖν
  choice: फिर ... कैसे
  rationale: οὖν के निष्कर्षसूचक बल को हिन्दी तर्क-प्रवाह में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: σταθήσεται
  choice: टिका रहेगा
  rationale: ἵστημι के रूपक को केवल भौतिक ‘खड़े रहने’ तक सीमित न करके राज्य के बने रहने या स्थिर रहने का भाव देता है।
- source_word: ἡ βασιλεία αὐτοῦ
  choice: उसका राज्य
  rationale: βασιλεία के राज्य/अधिराज्य संबंधी अर्थ को प्रसंग के विभाजित प्रभुत्व के चित्र के अनुरूप रखता है।
theological_decisions:
- issue: शैतान के आत्म-विभाजन का संकेत और तर्कात्मक बल
  choice: 'वचन को असंगति दिखाने वाले तर्क के रूप में रखा गया है: यदि शैतान शैतान को निकालता है, तो वह स्वयं अपने विरुद्ध बँट चुका है और उसका राज्य टिक नहीं सकता।'
  alternative: व्यापक प्रसंग के आधार पर ‘अपने ही घर के विरुद्ध बँटा’ जैसी व्याख्यात्मक भाषा जोड़ी जा सकती थी।
  rationale: यूनानी पाठ स्वयं आत्म-विभाजन और राज्य की अस्थिरता का तर्क देता है; अतिरिक्त ‘घर’ की कल्पना इस पद में जोड़ना आवश्यक नहीं है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। ‘शैतान ही शैतान को’ में ‘ही’ यूनानी के कर्ता-कर्म की समानता को हिन्दी में तुरंत स्पष्ट करता है। ‘टिका रहेगा’ राज्य के स्थायित्व का स्वाभाविक मुहावरा है।
