id: MAT.12.50
reference: Matthew 12:50
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: hi
  text: क्योंकि जो कोई स्वर्ग में रहने वाले मेरे पिता की इच्छा पूरी करता है, वही मेरा भाई, बहन और माता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: जो कोई
  rationale: 'अनिश्चित संबंधवाचक रचना का सामान्य और खुला भाव व्यक्त करता है: ‘जो कोई’ अर्थात कोई भी व्यक्ति जो।'
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करने वाला संबंध स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ποιήσῃ
  choice: पूरी करता है
  rationale: θέλημα के साथ ποιέω का स्वाभाविक हिन्दी रूप ‘इच्छा पूरी करना’ है; ‘आज्ञा मानना’ अर्थ को अनावश्यक रूप से संकुचित करता।
- source_word: τὸ θέλημα
  choice: इच्छा
  rationale: पिता की इच्छा के धार्मिक और संबंधपरक भाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: स्वर्ग में रहने वाले मेरे पिता की
  rationale: अधिक शाब्दिक ‘जो स्वर्गों में हैं’ के बजाय वर्तमान हिन्दी का स्वाभाविक और गरिमापूर्ण रूप है; स्थान-सूचक भाव स्पष्ट रहता है।
- source_word: αὐτός
  choice: वही
  rationale: यूनानी बलाघाती सर्वनाम का जोर बनाए रखता है और हिन्दी में अनावश्यक लिंग-निर्धारण किए बिना उसी व्यक्ति की पहचान स्पष्ट करता है।
- source_word: ἀδελφὸς
  choice: भाई
  rationale: मूल के एकवचन पारिवारिक पद का सीधा समतुल्य।
- source_word: ἀδελφὴ
  choice: बहन
  rationale: मूल में अलग से उल्लिखित स्त्रीलिंग पारिवारिक पद को बनाए रखता है।
- source_word: μήτηρ
  choice: माता
  rationale: मूल के एकवचन पारिवारिक पद का गरिमापूर्ण और सहज हिन्दी समतुल्य।
- source_word: ἐστίν
  choice: है
  rationale: वर्तमानकालीन सामान्य विधान और सरल योजक क्रिया को सुरक्षित रखता है।
theological_decisions:
- issue: सामान्य अर्थ में प्रयुक्त व्याकरणिक पुल्लिंग एकवचन
  choice: जो कोई ... वही
  alternative: जो कोई ... वह मेरा भाई, बहन और माता है
  rationale: यूनानी ὅστις और αὐτός व्याकरणिक रूप से पुल्लिंग एकवचन हैं, पर कथन का दायरा सामान्य है। हिन्दी ‘जो कोई ... वही’ इस सार्वभौमिकता और αὐτός के बल दोनों को स्वाभाविक ढंग से रखता है; ‘भाई, बहन और माता’ की सूची मूल के लिंग-विभेद को स्पष्ट रूप से सुरक्षित रखती है।
- issue: यीशु के परिवार की पहचान
  choice: मेरा भाई, बहन और माता है
  alternative: मेरे परिवार का सदस्य है
  rationale: मूल पाठ तीनों पारिवारिक भूमिकाओं को अलग-अलग कहता है; उन्हें सामान्यीकृत करके ‘परिवार का सदस्य’ कहना मूल की चित्रात्मक तीव्रता को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। ‘स्वर्ग में रहने वाले मेरे पिता’ सामान्य पाठक के लिए सहज है; ‘माता’ पारिवारिक सूची में गरिमा बनाए रखता है। किसी पंथ-विशेष की व्याख्या नहीं जोड़ी गई।
