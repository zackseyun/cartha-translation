id: MAT.12.11
reference: Matthew 12:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: hi
  text: पर उसने उनसे कहा, “तुममें ऐसा कौन आदमी होगा, जिसके पास एक भेड़ हो, और यदि वह सब्त के दिन[a] किसी गड्ढे में गिर जाए, तो वह उसे पकड़कर बाहर नहीं निकालेगा[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘सब्तों में’ है; यह ‘सब्त के दिन’ के अर्थ में प्रयुक्त मुहावरेदार बहुवचन है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसे पकड़ेगा और ऊपर उठाएगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: तुममें ऐसा कौन आदमी होगा
  rationale: यूनानी आलंकारिक प्रश्न की रचना और सकारात्मक उत्तर की अपेक्षा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘आदमी’ प्रतिनिधिक पुल्लिंग एकवचन को बनाए रखता है।
- source_word: ἕξει πρόβατον ἕν
  choice: जिसके पास एक भेड़ हो
  rationale: ἕξει भविष्यत् रूप में है, पर इस काल्पनिक शर्त में हिन्दी का ‘हो’ स्वाभाविक है; ‘एक भेड़’ संख्या पर दिए गए बल को सुरक्षित रखता है।
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: यदि वह ... गिर जाए
  rationale: शर्तसूचक ἐάν और संभावनार्थक क्रिया को ‘यदि ... गिर जाए’ से स्वाभाविक रूप में व्यक्त किया गया है; ‘वह’ का संदर्भ भेड़ से है।
- source_word: τοῖς σάββασιν
  choice: सब्त के दिन
  rationale: यूनानी बहुवचन यहाँ किसी सब्त-दिन के लिए प्रचलित मुहावरेदार प्रयोग है; हिन्दी में एकवचन अर्थ अधिक स्पष्ट और स्वाभाविक है।
- source_word: εἰς βόθυνον
  choice: किसी गड्ढे में
  rationale: βόθυνος सामान्यतः गड्ढे या खोदे हुए गहरे स्थान को सूचित करता है; ‘गड्ढा’ अनावश्यक विशिष्टता के बिना अर्थ देता है।
- source_word: οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ
  choice: तो वह उसे पकड़कर बाहर नहीं निकालेगा
  rationale: οὐχί सकारात्मक उत्तर की अपेक्षा वाला प्रश्न बनाता है। ‘पकड़कर बाहर निकालेगा’ κρατέω और ἐγείρω की क्रमिक क्रियाओं को गड्ढे के प्रसंग में सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रतिनिधिक पुल्लिंग भाषा
  choice: आदमी
  alternative: व्यक्ति
  rationale: ἄνθρωπος यहाँ पुल्लिंग एकवचन में काल्पनिक उदाहरण के व्यक्ति को दर्शाता है। ‘आदमी’ मूल की आलंकारिक शैली को बनाए रखते हुए सामान्य हिन्दी में स्वाभाविक है।
- issue: σάββασιν का बहुवचन रूप
  choice: सब्त के दिन
  alternative: सब्तों में
  rationale: यह बहुवचन मुहावरेदार है और प्रसंग सब्त के नियम से जुड़ा है; शाब्दिक बहुवचन हिन्दी पाठक को अनेक अलग-अलग सब्तों का अनुचित संकेत दे सकता है।
- issue: ἐγερεῖ में निहित उठाने की क्रिया
  choice: बाहर निकालेगा
  alternative: ऊपर उठाएगा
  rationale: मूल क्रिया ‘उठाना’ है, पर गड्ढे में गिरी भेड़ के प्रसंग में ‘बाहर निकालना’ निहित दिशा को स्वाभाविक रूप से स्पष्ट करता है; वैकल्पिक अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आलंकारिक प्रश्न की अपेक्षित सकारात्मक प्रतिक्रिया हिन्दी के ‘नहीं निकालेगा?’ से स्पष्ट होती है। ‘सब्त’ बाइबिलीय-सांस्कृतिक पद के रूप में रखा गया है और उसका मुहावरेदार यूनानी बहुवचन पादटिप्पणी में बताया गया है।
