id: MAT.12.32
reference: Matthew 12:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: hi
  text: और जो कोई मनुष्य के पुत्र के विरुद्ध कोई बात कहेगा, उसे क्षमा कर दिया जाएगा; पर जो कोई पवित्र आत्मा के विरुद्ध बोलेगा, उसे क्षमा नहीं किया जाएगा—न इस युग में, न आने वाले युग में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: जो कोई ... पर जो कोई
  rationale: सापेक्ष सर्वनाम के साथ ἐάν/ἄν अनिश्चित और सामान्य शर्त व्यक्त करता है; ‘जो कोई’ आधुनिक हिन्दी में उसका स्वाभाविक खुला अर्थ बनाए रखता है।
- source_word: εἴπῃ λόγον
  choice: कोई बात कहेगा
  rationale: λέγω और λόγον का संयुक्त अर्थ हिन्दी में ‘कोई बात कहना’ से स्वाभाविक रूप से व्यक्त होता है; यह λόγον की उपस्थिति भी बनाए रखता है और अनावश्यक शब्दशः कठोरता से बचता है।
- source_word: κατὰ
  choice: के विरुद्ध
  rationale: सम्बन्धकारक के साथ κατά यहाँ विरोधपूर्ण वाणी का लक्ष्य बताता है; दोनों उपवाक्यों में ‘के विरुद्ध’ स्पष्ट और समानांतर है।
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: यह पदवी का स्थापित और मूल के निकट हिन्दी रूप है, जो इसके मसीही और प्रलय-संबंधी संकेतों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ἀφεθήσεται αὐτῷ / οὐκ ἀφεθήσεται αὐτῷ
  choice: उसे क्षमा कर दिया जाएगा / उसे क्षमा नहीं किया जाएगा
  rationale: भविष्यत् कर्मवाच्य को सुरक्षित रखते हुए यह हिन्दी में स्वाभाविक है। αὐτῷ को ‘उसे’ से व्यक्त किया गया है; प्रसंग से स्पष्ट है कि क्षमा कही गई बात के अपराध की है।
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: पवित्र आत्मा
  rationale: यह आधुनिक मानक हिन्दी में इस उपाधि का प्रचलित और सटीक रूप है।
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι οὔτε ἐν τῷ μέλλοντι
  choice: न इस युग में, न आने वाले युग में
  rationale: αἰών का यहाँ कालगत अर्थ ‘युग’ है, क्योंकि उसका विरोध आने वाले युग से है। दूसरी पदावली में निहित ‘युग’ को हिन्दी की स्पष्टता के लिए दोहराया गया है।
theological_decisions:
- issue: αἰών और μέλλων का कालगत विरोध
  choice: न इस युग में, न आने वाले युग में
  alternative: न इस संसार में, न आने वाले संसार में; अथवा न इस युग में, न आने वाले में
  rationale: मूल पाठ वर्तमान और भावी युग का विरोध करता है, स्थानगत दो संसारों का नहीं। हिन्दी में ‘आने वाले युग’ मूल की दीर्घवृत्तता को स्पष्ट करता है, पर किसी विशेष अन्तकालीन सिद्धान्त को नहीं जोड़ता।
- issue: पवित्र आत्मा के विरुद्ध बोलने वाले अपराध का स्वरूप
  choice: पाठ की चेतावनी को बिना अतिरिक्त परिभाषा के बनाए रखना
  alternative: इसे केवल यीशु के चमत्कारों पर एक विशेष ऐतिहासिक आरोप मानना; अथवा इसे अंतिम अपश्चात्ताप के रूप में परिभाषित करना
  rationale: यह पद परिणाम बताता है, पर अपराध को बाद की धर्मवैज्ञानिक सटीकता से परिभाषित नहीं करता। इसलिए अनुवाद व्याख्या जोड़ने के बजाय मूल तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों चेतावनी-वाक्यों का समानांतर ढाँचा सुरक्षित है। ‘पर’ δέ के विरोध को स्वाभाविक ढंग से व्यक्त करता है, और अंतिम कालगत विरोध को दीर्घ डैश तथा दोहराए गए ‘न’ से स्पष्ट किया गया है।
