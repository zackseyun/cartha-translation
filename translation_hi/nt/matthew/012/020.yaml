id: MAT.12.20
reference: Matthew 12:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: hi
  text: 'वह कुचले हुए सरकंडे को नहीं तोड़ेगा,

    और धुआँ देती हुई बत्ती[a] को नहीं बुझाएगा,

    जब तक कि वह न्याय[b] को विजय तक न पहुँचा दे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से सन का उल्लेख है, जिसका उपयोग दीपक की बत्ती के रूप में होता था।
    reason: lexical_alternative
  - marker: b
    text: या ‘न्याय-निर्णय’।
    reason: lexical_alternative
lexical_decisions:
- source_word: κάλαμον
  choice: सरकंडा
  rationale: यह शब्द सामान्यतः सरकंडे या नरकट की डंडी को दर्शाता है। ‘सरकंडा’ आधुनिक हिन्दी में इस नबी-संबंधी रूपक को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: συντετριμμένον
  choice: कुचला हुआ
  rationale: यह कृदन्त दबकर क्षतिग्रस्त या टूटने की दशा में पहुँची वस्तु को दर्शाता है। ‘कुचला हुआ’ उसकी दुर्बल अवस्था बताता है, पर उसे पहले ही पूरी तरह टूटा हुआ नहीं मानता।
- source_word: κατεάξει
  choice: नहीं तोड़ेगा
  rationale: मूल क्रिया का अर्थ तोड़ना या चटका देना है। यह चयन सरल है और रूपक में प्रकट कोमलता बनाए रखता है।
- source_word: λίνον
  choice: बत्ती
  rationale: शाब्दिक अर्थ सन या सन का रेशा है, पर यहाँ उससे बनी दीपक की बत्ती अभिप्रेत है। ‘बत्ती’ आधुनिक पाठक को वास्तविक वस्तु तुरंत समझा देती है।
- source_word: τυφόμενον
  choice: धुआँ देती हुई
  rationale: यह शब्द ऐसी बत्ती का चित्र प्रस्तुत करता है जो धुआँ दे रही है और बुझने के निकट है। यह अनुवाद ‘सुलगती’ की अपेक्षा धुएँ के मूल भाव को अधिक प्रत्यक्ष रखता है।
- source_word: σβέσει
  choice: नहीं बुझाएगा
  rationale: दीपक या आग के संदर्भ में ‘बुझाना’ σβέννυμι का सहज और ठीक हिन्दी समतुल्य है।
- source_word: ἕως ἂν
  choice: जब तक कि
  rationale: यह रचना भविष्य के उस बिंदु को दर्शाती है जहाँ लक्ष्य पूरा होगा; ‘जब तक कि’ हिन्दी में उसका स्वाभाविक रूप है।
- source_word: ἐκβάλῃ
  choice: पहुँचा दे
  rationale: ἐκβάλλω मूलतः बाहर निकालने या आगे लाने का भाव रखता है। εἰς νῖκος के साथ ‘विजय तक पहुँचा दे’ न्याय को निर्णायक सफल परिणाम तक लाने का अर्थ स्पष्ट करता है।
- source_word: εἰς νῖκος
  choice: विजय तक
  rationale: यह पद लक्ष्य और सफल परिणाम को व्यक्त करता है। ‘विजय तक’ उसके दिशात्मक और परिणामसूचक दोनों भावों को बनाए रखता है।
- source_word: τὴν κρίσιν
  choice: न्याय
  rationale: κρίσις का अर्थ न्याय या न्याय-निर्णय हो सकता है। यशायाह के सेवक-संदर्भ में ‘न्याय’ परमेश्वर की उचित व्यवस्था स्थापित करने के व्यापक भाव को व्यक्त करता है।
theological_decisions:
- issue: यशायाह के सेवक-वचन में κρίσις का अनुवाद
  choice: न्याय
  alternative: न्याय-निर्णय
  rationale: संदर्भ केवल दंडादेश सुनाने का नहीं, बल्कि सेवक द्वारा परमेश्वर की न्यायपूर्ण व्यवस्था को सफलतापूर्वक स्थापित करने का है। फिर भी मूल शब्द में निर्णय का न्यायिक पहलू संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: दीपक के रूपक में शाब्दिकता की मात्रा
  choice: धुआँ देती हुई बत्ती … नहीं बुझाएगा
  alternative: धुआँ देता हुआ सन … शांत नहीं करेगा
  rationale: मूल में सन का उल्लेख है, पर प्रसंग में उससे बनी दीपक की बत्ती अभिप्रेत है। मुख्य पाठ में ‘बत्ती’ चित्र को आधुनिक पाठक के लिए स्पष्ट करता है, जबकि पादटिप्पणी स्रोत की शाब्दिक बनावट सुरक्षित रखती है।
- issue: न्याय की विजय का वाक्य-विन्यास
  choice: न्याय को विजय तक न पहुँचा दे
  alternative: न्याय को विजयी न कर दे
  rationale: चुना हुआ रूप ἐκβάλῃ εἰς νῖκος की गति और लक्ष्य—न्याय को विजय के परिणाम तक लाना—दोनों को बनाए रखता है, बिना इस प्रक्रिया की प्रकृति को आवश्यकता से अधिक निश्चित किए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद की काव्यात्मक समानांतरता के लिए तीन पंक्तियाँ दी गई हैं। ‘कुचला हुआ सरकंडा’ और ‘धुआँ देती हुई बत्ती’ दुर्बलता के चित्र को स्पष्ट रखते हैं; ‘विजय तक पहुँचा दे’ मूल के लक्ष्यसूचक तनाव को सुरक्षित रखता है।
