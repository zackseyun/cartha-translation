  text: And he warned them not to make him known,[a]
translation:
  language: hi
  text: और उसने उन्हें कड़ी चेतावनी दी कि वे उसे प्रकट न करें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें सख्त आदेश दिया।”
    reason: ἐπετίμησεν प्रसंग के अनुसार कड़ी चेतावनी देने या सख्त आदेश देने का भाव रख सकता है।
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह साधारण संयोजक कथा को पिछले प्रसंग से जोड़ता है; ‘और’ बिना अतिरिक्त अर्थ जोड़े यूनानी समन्वय को बनाए रखता है।
- source_word: ἐπετίμησεν
  choice: कड़ी चेतावनी दी
  rationale: ἐπιτιμάω यहाँ निषेधात्मक आशय के साथ कठोर चेतावनी या सख्त निर्देश दर्शाता है। ‘कड़ी चेतावनी दी’ इसकी प्रबलता व्यक्त करता है, पर संबोधित लोगों को दोषी ठहराने वाला ‘डाँटा’ अनावश्यक रूप से नहीं जोड़ता।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: यह दत्तिव बहुवचन सर्वनाम है, जो प्रसंग में यीशु के पीछे आए और चंगे किए गए लोगों की ओर संकेत करता है।
- source_word: ἵνα μὴ
  choice: कि वे ... न करें
  rationale: चेतावनी या निर्देश के बाद ἵνα μή और संभावनार्थक क्रिया उस निर्देश की निषेधात्मक विषयवस्तु व्यक्त करते हैं; हिंदी में ‘कि वे ... न करें’ स्वाभाविक है।
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: वे उसे प्रकट न करें
  rationale: φανερὸν ποιέω का अर्थ किसी को प्रकट, प्रसिद्ध या सार्वजनिक रूप से ज्ञात करना है। ‘उसे प्रकट न करें’ व्यक्तिगत कर्म αὐτόν को बनाए रखता है और यह अस्पष्टता भी रहने देता है कि निषेध उसकी पहचान बताने पर है या उसके विषय में प्रचार करने पर।
theological_decisions:
- issue: यीशु के निर्देश का स्वरूप और प्रचार से उसका संबंध
  choice: एक कड़ी चेतावनी कि वे उसे प्रकट न करें
  alternative: उन्हें डाँटना, या औपचारिक रूप से आज्ञा देना कि वे उसके विषय में किसी को न बताएँ
  rationale: यूनानी क्रिया एक प्रबल चेतावनी या आदेश का समर्थन करती है, किंतु संबोधित लोगों की नैतिक गलती अथवा इस निषेध का धर्मवैज्ञानिक कारण स्पष्ट नहीं करती। इसलिए अनुवाद कठोरता को व्यक्त करता है, पर कारण या प्रचार के सटीक दायरे को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, सहज और गरिमापूर्ण वाक्य। ‘कड़ी चेतावनी’ मूल क्रिया की तीव्रता रखती है, जबकि ‘प्रकट’ उस व्यापक अर्थ को सुरक्षित रखता है जिसमें पहचान उजागर करना या सार्वजनिक रूप से प्रसिद्ध करना दोनों सम्मिलित हो सकते हैं।
