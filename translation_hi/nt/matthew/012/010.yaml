id: MAT.12.10
reference: Matthew 12:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: hi
  text: और देखो, वहाँ एक आदमी था जिसका एक हाथ सूख गया था। उन्होंने उससे पूछा, “क्या सब्त के दिनों में[a] चंगा करना व्यवस्था के अनुसार उचित है?” ताकि वे उस पर आरोप लगा सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, हिन्दी में अधिक मुहावरेदार ढंग से, “सब्त के दिन।” यूनानी में “सब्तों” बहुवचन है, जो सब्त-दिनों के लिए प्रचलित प्रयोग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह दृश्य की ओर ध्यान खींचने वाले यूनानी कथन-सूचक का स्वाभाविक और वर्तमान हिन्दी रूप है।
- source_word: ἄνθρωπος
  choice: एक मनुष्य
  rationale: यहाँ शब्द किसी सामान्य मानवता के बजाय एक पुरुष व्यक्ति को सूचित करता है; ‘मनुष्य’ गरिमापूर्ण और स्पष्ट है।
- source_word: χεῖρα ἔχων ξηράν
  choice: जिसका एक हाथ सूखा हुआ था
  rationale: यह यूनानी कृदन्तीय पदबंध का स्वाभाविक हिन्दी रूप है और हाथ की क्षीण अथवा निष्क्रिय दशा को अनावश्यक चिकित्सीय विशिष्टता दिए बिना व्यक्त करता है।
- source_word: ἐπηρώτησαν
  choice: उन्होंने ... पूछा
  rationale: मूल क्रिया अपने आप में केवल पूछने को बताती है; विरोधी मंशा अंतिम उद्देश्य-वाक्य में स्पष्ट होती है।
- source_word: λέγοντες
  choice: पूछा
  rationale: हिन्दी में मुख्य क्रिया के साथ कथन को सीधे जोड़ना ‘यह कहते हुए पूछा’ की तुलना में अधिक स्वाभाविक है और अर्थ सुरक्षित रखता है।
- source_word: ἔξεστι
  choice: व्यवस्था के अनुसार उचित है
  rationale: सब्त-विवाद में बात केवल सामान्य अनुमति की नहीं, धार्मिक व्यवस्था के अंतर्गत वैधता की है; यह पदबंध उस कानूनी-धार्मिक बल को स्पष्ट करता है।
- source_word: τοῖς σάββασιν
  choice: सब्त के दिनों में
  rationale: यह यूनानी बहुवचन को हिन्दी में स्वाभाविक ढंग से सुरक्षित रखता है और बार-बार आने वाले सब्त-दिनों के अर्थ को व्यक्त करता है।
- source_word: θεραπεύειν
  choice: चंगा करना
  rationale: सुसमाचारों के आरोग्य-संदर्भ में यह सामान्य, स्पष्ट और स्थापित हिन्दी अभिव्यक्ति है।
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: वे ऐसा इसलिए पूछ रहे थे कि उन पर दोष लगा सकें
  rationale: यह उद्देश्य को स्पष्ट रखता है और κατηγορέω के आरोप लगाने वाले, न्यायिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सब्त-संबंधी बहुवचन को कानूनी विवाद में प्रस्तुत करना
  choice: सब्त के दिनों में
  alternative: सब्त के दिन
  rationale: यूनानी में दत्तिव बहुवचन है, जिसे ‘सब्त के दिनों में’ स्वाभाविक हिन्दी में बनाए रखता है; एकवचन विकल्प हिन्दी में अधिक मुहावरेदार हो सकता है, पर मूल संख्या को छिपा देता है।
- issue: ἔξεστι का कानूनी-धार्मिक बल
  choice: व्यवस्था के अनुसार उचित है
  alternative: अनुमति है
  rationale: प्रश्न सब्त की व्यवस्था के अंतर्गत वैध आचरण का है। ‘अनुमति है’ संभव है, पर धार्मिक-कानूनी संदर्भ को कम स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘सब्त’ बाइबलीय सांस्कृतिक पद के रूप में रखा गया है। ‘उन पर’ का संकेत निकटतम एकवचन पुरुष, अर्थात यीशु, की ओर है।
