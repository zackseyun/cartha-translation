  naturalness: The Hindi is generally clear and suitably dignified. “उस पर आरोप लगा सकें” is more natural and legally specific than “उन पर दोष लगा सकें.” “उससे पूछा” avoids adding an explicit name not present in this verse.
  terminology: “सब्त,” “चंगा करना,” and “व्यवस्था के अनुसार उचित” appropriately retain the religious-legal register. The plural “सब्त के दिनों में” preserves τοῖς σάββασιν; a footnote supplies the natural Hindi singular alternative.
  issues:
  - severity: medium
    issue: “यीशु” is supplied in the main text although the Greek reads only αὐτόν (“him”).
    rationale: The referent is clear from the wider context, but this verse itself does not name Jesus. “उससे” preserves the source wording without losing comprehensibility.
  - severity: medium
    issue: “उन पर” uses a plural honorific form for Greek singular αὐτοῦ and may reduce referential precision.
    rationale: The purpose clause means that they might accuse him. “उस पर आरोप लगा सकें” is singular and represents κατηγορήσωσιν more directly.
  - severity: low
    issue: No Hindi footnote preserves the English audit trail’s note on the Greek plural for Sabbath days.
    rationale: The main rendering keeps the plural, but an anchored note should document that “सब्त के दिन” is the idiomatic singular alternative.
