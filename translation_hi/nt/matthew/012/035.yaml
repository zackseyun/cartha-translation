  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: hi
  text: भला मनुष्य भले भंडार से भली चीज़ें निकालता है,[a] और बुरा मनुष्य बुरे भंडार से बुरी चीज़ें निकालता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: निकटवर्ती संदर्भ वाणी के विषय में है; इसलिए “भली चीज़ें” और “बुरी चीज़ें” विशेष रूप से अच्छे और बुरे शब्दों का संकेत कर सकती हैं। यूनानी में यहाँ कोई स्पष्ट संज्ञा नहीं है।
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθός / ἀγαθά
  choice: भला / भली बातें
  rationale: ‘भला’ नैतिक अच्छाई को स्वाभाविक हिन्दी में व्यक्त करता है और मूल की पुनरावृत्ति बनाए रखता है। नपुंसकलिंग बहुवचन विशेषण ἀγαθά को ‘भली बातें’ कहा गया है; यहाँ ‘बातें’ व्यापक अर्थ में चीज़ों या अभिव्यक्तियों को सूचित कर सकती है, जबकि निकटवर्ती संदर्भ वाणी पर केंद्रित है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: ‘मनुष्य’ प्रतिनिधिक एकवचन के रूप में यूनानी ἄνθρωπος का स्वाभाविक और समावेशी हिन्दी समतुल्य है; इससे कथन केवल पुरुषों तक सीमित नहीं होता।
- source_word: θησαυρός
  choice: भंडार
  rationale: इस रूपक में θησαυρός संचित निधि या भीतर जमा सामग्री का बोध देता है। ‘भंडार’ आधुनिक हिन्दी में ‘खज़ाना’ की अपेक्षा इस स्रोत-भाव को अधिक सहजता से व्यक्त करता है।
- source_word: ἐκβάλλει
  choice: निकालता है
  rationale: यह चयन भीतर के भंडार से बाहर लाने की गति को बनाए रखता है और हिन्दी में स्वाभाविक है; ‘उत्पन्न करता है’ रूपक को कमजोर कर देता।
- source_word: πονηρός / πονηρά
  choice: बुरा / बुरी बातें
  rationale: यह ἀγαθός के साथ संतुलित और सहज नैतिक विरोध प्रस्तुत करता है। ‘दुष्ट’ अधिक तीखा विकल्प है, पर इस सूक्तिपरक समानांतर वाक्य में ‘बुरा’ अधिक स्वाभाविक है।
- source_word: ἐκ
  choice: से
  rationale: स्रोत को व्यक्त करने के लिए हिन्दी में ‘से’ संक्षिप्त और स्वाभाविक है; ‘निकालता है’ बाहर आने का भाव पहले ही देता है।
theological_decisions:
- issue: बाहरी फल का वाणी तक सीमित होना या व्यापक रहना
  choice: मुख्य पाठ में ‘भली बातें/बुरी बातें’ रखा गया और टिप्पणी में वाणी-संदर्भ स्पष्ट किया गया।
  alternative: इसे स्पष्ट रूप से ‘भले शब्द/बुरे शब्द’ कहना, या अधिक व्यापक ‘भली चीज़ें/बुरी चीज़ें’ कहना।
  rationale: मत्ती 12:34 और 12:36–37 का निकटवर्ती संदर्भ वाणी है, पर यूनानी पाठ में कोई स्पष्ट संज्ञा नहीं है; ἀγαθά और πονηρά नपुंसकलिंग बहुवचन विशेषण संज्ञा की तरह प्रयुक्त हैं। इसलिए अनुवाद संदर्भ का संकेत देता है, पर अर्थ को केवल शब्दों तक कठोरता से सीमित नहीं करता।
- issue: मनुष्य के भीतर के नैतिक भंडार का रूपक
  choice: इसे व्यक्ति के भीतर संचित नैतिक स्रोत से निकलने वाली बाहरी अभिव्यक्ति के रूप में रखा गया।
  alternative: इसे किसी विशिष्ट परवर्ती मानवशास्त्रीय या उद्धार-सिद्धांत की तकनीकी व्याख्या बनाना।
  rationale: पद स्वयं सूक्तिपरक नैतिक विरोध प्रस्तुत करता है और उससे आगे किसी विशिष्ट सैद्धांतिक प्रणाली को स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। समानांतर रचना तथा ‘भला/भली’ और ‘बुरा/बुरी’ की पुनरावृत्ति द्वारा यूनानी का नैतिक विरोध सुरक्षित रखा गया है। मुख्य पाठ का [a] टिप्पणी-चिह्न संबंधित वाक्यांश के बाद रखा गया है।
