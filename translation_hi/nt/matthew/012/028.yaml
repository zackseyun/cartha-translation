id: MAT.12.28
reference: Matthew 12:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: hi
  text: पर यदि मैं परमेश्वर की आत्मा के द्वारा[a] दुष्टात्माओं को निकालता हूँ, तो परमेश्वर का राज्य तुम पर आ पहुँचा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की आत्मा में।” यूनानी पद का अनुवाद दोनों प्रकार से हो सकता है; मुख्य पाठ में इसे साधन या कर्तृत्व बताने वाला माना गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हें आ पकड़ा है” अथवा “तुम पर आ गया है।” यूनानी क्रिया इस बात पर बल देती है कि यीशु के कार्यों में परमेश्वर का राज्य उन तक पहुँच चुका है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: पर यदि
  rationale: शर्त के साथ δέ के हल्के विरोध या तर्कगत मोड़ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν πνεύματι θεοῦ
  choice: परमेश्वर के आत्मा के द्वारा
  rationale: ἐν और संबंधकारक पद यहाँ साधन या कर्तृत्व का भाव दे सकता है। ‘के द्वारा’ यीशु के कार्य में परमेश्वर के आत्मा की सक्रिय भूमिका स्पष्ट करता है; ‘में’ की वास्तविक संभावना पादटिप्पणी में रखी गई है।
- source_word: ἐγὼ
  choice: मैं
  rationale: यूनानी में स्पष्ट रूप से आए और बलसूचक सर्वनाम को रखा गया है।
- source_word: ἐκβάλλω
  choice: निकालता हूँ
  rationale: दुष्टात्माओं को किसी व्यक्ति से बाहर करने के अर्थ में यह सहज, स्पष्ट और वर्तमान हिन्दी प्रयोग है।
- source_word: τὰ δαιμόνια
  choice: दुष्टात्माओं
  rationale: δαιμόνια के लिए सामान्य पाठक को समझ आने वाला प्रचलित हिन्दी बाइबलीय शब्द है और व्यक्तिगत दुष्ट आत्मिक प्राणियों का संकेत बनाए रखता है।
- source_word: ἄρα
  choice: तो
  rationale: शर्त से निकले निष्कर्ष को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔφθασεν
  choice: आ पहुँचा है
  rationale: क्रिया के पहुँचने या आ जाने के बल तथा उसके वर्तमान परिणाम—राज्य अब उन तक पहुँच चुका है—दोनों को व्यक्त करता है।
- source_word: ἐφ’ ὑμᾶς
  choice: तुम पर
  rationale: ἐπί के ‘पर/ऊपर पहुँचने’ वाले सजीव और संभवतः सामना कराने वाले भाव को बनाए रखता है; केवल ‘तुम्हारे पास’ से यह अधिक निकट है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह स्थापित और व्यापक हिन्दी अभिव्यक्ति है, जो परमेश्वर के राजकीय शासन और उसके राज्य—दोनों अर्थ-संबंधों को खुला रखती है।
theological_decisions:
- issue: यीशु द्वारा दुष्टात्माएँ निकाले जाने और परमेश्वर के राज्य के आगमन का संबंध
  choice: यीशु का परमेश्वर के आत्मा के द्वारा दुष्टात्माएँ निकालना इस बात का प्रमाण है कि परमेश्वर का राज्य वास्तविक रूप से उनके सुनने वालों पर आ पहुँचा है।
  alternative: राज्य केवल निकट आया है, अभी पहुँचा नहीं; अथवा यह केवल भविष्य की पूर्णता का उल्लेख है।
  rationale: ἔφθασεν पहुँच जाने को व्यक्त करता है, केवल निकटता को नहीं। अनुवाद वर्तमान आगमन को रखता है, पर राज्य की भावी पूर्णता के विषय में इस पद से कोई अतिरिक्त निष्कर्ष नहीं जोड़ता।
- issue: πνεύματι θεοῦ का संदर्भ
  choice: परमेश्वर का आत्मा, जो यीशु के कार्य का दिव्य कर्ता है।
  alternative: केवल निराकार ईश्वरीय शक्ति।
  rationale: वाक्यांश को व्यक्तिगत संदर्भ के लिए स्वाभाविक ‘परमेश्वर के आत्मा’ से अनूदित किया गया है, किंतु मूल से परे कोई व्याख्यात्मक पद नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली रखी गई है। ‘परमेश्वर का राज्य’ और ‘दुष्टात्माएँ’ जैसे परिचित बाइबलीय पद सामान्य पाठक की समझ बनाए रखते हैं। ‘तुम पर आ पहुँचा है’ मूल की सजीवता और गंभीरता को जानबूझकर सुरक्षित रखता है।
