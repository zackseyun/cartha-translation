id: MAT.12.25
reference: Matthew 12:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: hi
  text: पर उनके विचारों[a] को जानकर यीशु ने उनसे कहा, “हर राज्य जो अपने ही विरुद्ध बँटा हुआ है, उजड़ जाता है[b]; और हर नगर या घर[c] जो अपने ही विरुद्ध बँटा हुआ है, टिका नहीं रहेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तर्क-वितर्कों” अथवा “इरादों”।
    reason: lexical_alternative
  - marker: b
    text: या “वीरान हो जाता है” अथवा “बरबाद हो जाता है”।
    reason: lexical_alternative
  - marker: c
    text: “घर” का अर्थ “घराना” या “गृहस्थी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: जानकर
  rationale: यह कृदन्त मानसिक ज्ञान या बोध को व्यक्त करता है। ‘जानकर’ मुख्य क्रिया से इसका स्वाभाविक संबंध बनाए रखता है और यह नहीं बताता कि यीशु ने किस प्रकार जाना।
- source_word: δὲ
  choice: पर
  rationale: δέ यहाँ हल्का संक्रमण अथवा विरोध दिखाता है; प्रसंग में ‘पर’ स्वाभाविक है।
- source_word: ἐνθυμήσεις
  choice: मन के विचारों
  rationale: शब्द भीतर के विचार, तर्क-वितर्क या इरादों का अर्थ दे सकता है। ‘मन के विचार’ सामान्य पाठक के लिए स्पष्ट है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: Πᾶσα βασιλεία
  choice: हर वह राज्य
  rationale: एकवचन संज्ञा के साथ πᾶσα सार्वभौमिक लोकोक्तिपरक कथन बनाता है। हिंदी में ‘हर वह राज्य’ आगे आने वाली शर्त से सहज जुड़ता है।
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: जिसमें अपने ही विरुद्ध फूट पड़ जाए
  rationale: यह राज्य, नगर या घराने के भीतर ऐसी फूट को दर्शाता है जिसमें उसके अंग एक-दूसरे के विरोध में हों। यह हिंदी में स्वाभाविक रहते हुए κατά की विरोधात्मक शक्ति रखता है।
- source_word: ἐρημοῦται
  choice: उजड़ जाता है
  rationale: क्रिया वीरान या बरबाद हो जाने का परिणाम व्यक्त करती है। ‘उजड़ जाता है’ गंभीरता और परिणामात्मक भाव दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: πόλις ἢ οἰκία
  choice: नगर या घराना
  rationale: πόλις के लिए ‘नगर’ सीधा है। οἰκία यहाँ केवल भवन नहीं, घर-परिवार या गृहस्थ इकाई भी हो सकता है; ‘घराना’ आंतरिक विभाजन के प्रसंग में इस सामूहिक अर्थ को स्पष्ट करता है, जबकि ‘घर’ विकल्प पादटिप्पणी में दिया गया है।
- source_word: οὐ σταθήσεται
  choice: टिका नहीं रहेगा
  rationale: यह मुहावरा स्थापित या कायम रहने का भाव देता है। ‘टिका नहीं रहेगा’ आधुनिक हिंदी में स्वाभाविक है और भविष्यकाल बनाए रखता है।
theological_decisions:
- issue: यीशु द्वारा उनके भीतरी विचार जानने का स्वरूप
  choice: केवल यह कहना कि यीशु ने उनके मन के विचार जान लिए, पर ज्ञान की विधि न बताना
  alternative: इसे स्पष्टतः अलौकिक सर्वज्ञता, भविष्यदर्शी अंतर्दृष्टि या परिस्थितिजन्य अनुमान कहना
  rationale: यूनानी पाठ उनके जानने की बात कहता है, पर यह नहीं बताता कि उन्होंने किस माध्यम से जाना। अनुवाद इस धार्मिक-वैचारिक तनाव को खुला रखता है।
- issue: οἰκία का सामाजिक या भौतिक अर्थ
  choice: मुख्य पाठ में ‘घराना’, और पादटिप्पणी में ‘घर’
  alternative: केवल भौतिक भवन के अर्थ में ‘घर’
  rationale: राज्य और नगर के समानांतर आंतरिक फूट की बात किसी सामूहिक गृहस्थ इकाई के अर्थ को बल देती है, पर मूल शब्द भौतिक घर का अर्थ भी रख सकता है; पादटिप्पणी इस अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण शैली। वाक्य की लोकोक्तिपरक शक्ति बनाए रखने के लिए दोनों खंडों में समान संरचना रखी गई है। ‘अपने ही विरुद्ध फूट पड़ना’ आंतरिक विभाजन को सामान्य पाठक के लिए स्पष्ट करता है।
