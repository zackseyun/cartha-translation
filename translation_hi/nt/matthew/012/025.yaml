review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ knowledge of their inner thoughts without specifying its means, and it preserves the proverbial contrast between ruin and failure to endure. However, rendering οἰκία as “घराना” in the main text narrows a word that can denote a house or household; “घर” is the closer unmarked rendering and retains the broader sense naturally in Hindi. “मन के विचार” is also redundant for ἐνθυμήσεις.
  naturalness: The draft is generally clear and idiomatic. The revision uses a more compact, parallel proverbial structure and avoids the slightly cumbersome relative clauses with “फूट पड़ जाए.”
  terminology: “अपने ही विरुद्ध बँटा हुआ” directly expresses internal division (μερισθεῖσα καθ’ ἑαυτῆς) without adding the more specific imagery of a factional outbreak. “घर” represents οἰκία faithfully; its possible collective sense is noted in the footnote.
  issues:
  - severity: medium
    issue: The main-text rendering “घराना” narrows οἰκία.
    rationale: οἰκία may mean a house or a household. “घराना” foregrounds a lineage/family-group sense, while the Greek and the English audit trail retain “house” as the primary wording. “घर” is both closer and sufficiently broad.
  - severity: low
    issue: “मन के विचारों” is pleonastic.
    rationale: ἐνθυμήσεις already means inward thoughts/reflections. “उनके विचारों” is natural Hindi and fully conveys the sense.
  - severity: low
    issue: “फूट पड़ जाए” is more specific than the participial description of being divided.
    rationale: The Greek states the condition of being divided against itself, rather than explicitly depicting the outbreak of discord. “अपने ही विरुद्ध बँटा हुआ” is more direct and preserves the general maxim.
  revised_text: पर उनके विचारों[a] को जानकर यीशु ने उनसे कहा, “हर राज्य जो अपने ही विरुद्ध बँटा हुआ है, उजड़ जाता है[b]; और हर नगर या घर[c] जो अपने ही विरुद्ध बँटा हुआ है, टिका नहीं रहेगा।”
