  terminology: ‘अशुद्ध आत्मा’ appropriately preserves τὸ ἀκάθαρτον πνεῦμα and avoids replacing the source term with the more interpretive ‘दुष्टात्मा’. ‘जलरहित’ is a faithful rendering of ἀνύδρων. The footnote’s quoted alternative should use the uninflected citation form ‘सूखे स्थान’, not the postpositional plural form ‘सूखे स्थानों’.
  issues:
