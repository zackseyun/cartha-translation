  - severity: low
    issue: Footnote quotation form
    rationale: The alternative is quoted as a standalone noun phrase, so ‘सूखे स्थान’ is grammatically preferable to ‘सूखे स्थानों’, which is appropriate only before a postposition such as ‘से’.
