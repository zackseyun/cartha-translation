base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: hi
  text: “जब अशुद्ध आत्मा मनुष्य में से निकलती है, तब वह विश्राम की खोज में जलरहित स्थानों[a] से होकर गुजरती है, और उसे विश्राम नहीं मिलता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सूखे स्थान।” यूनानी का शाब्दिक अर्थ “जलरहित स्थान” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: जब … तब
  rationale: ὅταν एक सामान्य कालगत परिस्थिति प्रस्तुत करता है। हिन्दी में ‘जब … तब’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है; δέ का हल्का संक्रमण अलग भारी संयोजक जोड़े बिना संरचना में समाहित है।
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: अशुद्ध आत्मा
  rationale: यह सुसमाचारों के दुष्ट आत्मा-संबंधी प्रसंगों में पारदर्शी और स्रोत के निकट है। ‘दुष्टात्मा’ कहने से ἀκάθαρτον की शुद्धता-अशुद्धता संबंधी छवि दब सकती थी।
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: मनुष्य में से निकल जाती है
  rationale: ‘में से निकलना’ भीतर से बाहर आने की गति स्पष्ट करता है। सामान्य दृष्टांतात्मक कथन होने के कारण हिन्दी में ‘मनुष्य’ स्वाभाविक है और अनावश्यक रूप से किसी खास व्यक्ति की ओर संकेत नहीं करता।
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: जलरहित स्थानों से होकर गुजरती है
  rationale: ‘से होकर गुजरती है’ διέρχεται और διά की मार्गगत धारणा को व्यक्त करता है। ‘जलरहित’ ἀνύδρων का ठोस, लगभग शाब्दिक अर्थ सुरक्षित रखता है।
- source_word: ζητοῦν ἀνάπαυσιν
  choice: विश्राम की खोज में
  rationale: समकालिक कृदन्त ζητοῦν को सहज हिन्दी में प्रयोजनात्मक अभिव्यक्ति से दिया गया है; ‘विश्राम’ ἀνάπαυσιν की व्यापकता बनाए रखता है, उसे ‘विश्राम-स्थान’ तक सीमित नहीं करता।
- source_word: καὶ οὐχ εὑρίσκει
  choice: पर उसे विश्राम नहीं मिलता
  rationale: यूनानी में वस्तु प्रसंग से समझी जाती है। हिन्दी में ‘विश्राम’ दोहराने से संदर्भ स्पष्ट और स्वाभाविक रहता है; ‘पर’ खोज और न मिलने के परिणाम का हल्का विरोध व्यक्त करता है।
theological_decisions:
- issue: भूत-प्रेत संबंधी प्रसंग में πνεῦμα का अनुवाद
  choice: आत्मा
  alternative: दुष्टात्मा / दुष्ट आत्मिक प्राणी
  rationale: मूल पाठ δαιμόνιον नहीं, बल्कि ‘अशुद्ध आत्मा’ कहता है। इसलिए स्रोत की शब्दावली और उसकी शुद्धता-संबंधी धार्मिक पृष्ठभूमि को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘आत्मा’ के स्त्रीलिंग व्याकरण के अनुसार क्रियाएँ ‘जाती’, ‘गुजरती’ हैं।
