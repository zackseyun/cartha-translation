source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: hi
  text: क्योंकि जैसे योना उस विशाल समुद्री जीव[a] के पेट में तीन दिन और तीन रात तक[c] रहा था, वैसे ही मनुष्य का पुत्र पृथ्वी के हृदय[b] में तीन दिन और तीन रात रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विशाल समुद्री जीव’ के स्थान पर ‘बड़ी मछली’ भी अनुवाद किया जा सकता है। यूनानी शब्द किसी बड़े समुद्री जीव को दर्शाता है और किसी एक प्राणी-जाति तक सीमित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: ‘पृथ्वी के हृदय में’ दफ़नाए जाने, कब्र, अथवा पृथ्वी की गहराइयों या मृतकों के लोक की ओर संकेत कर सकता है; मुख्य पाठ में यूनानी रूपक को यथावत रखा गया है।
    reason: alternative_reading
  - marker: c
    text: ‘तीन दिन और तीन रात’ को कभी-कभी तीन दिनों के अंशों को सम्मिलित करने वाला मुहावरा समझा जाता है; अन्य लोग इसे अधिक शाब्दिक समयावधि मानते हैं।
    reason: alternative_reading
