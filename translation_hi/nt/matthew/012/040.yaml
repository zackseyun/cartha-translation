- source_word: Ἰωνᾶς
  choice: योना
  rationale: इस बाइबलीय नाम का प्रचलित हिन्दी रूप।
- source_word: ἐν τῇ κοιλίᾳ
  choice: के पेट में
  rationale: κοιλία का यहाँ सहज अर्थ ‘पेट’ है; यह कथा-संदर्भ में स्वाभाविक और स्पष्ट है।
- source_word: τοῦ κήτους
  choice: उस विशाल समुद्री जीव
  rationale: κῆτος किसी बड़े समुद्री जीव को दर्शाता है; यह अनुवाद उसे किसी विशेष प्राणी-जाति तक सीमित नहीं करता।
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: तीन दिन और तीन रात
  rationale: मूल की दोहराई गई काल-अभिव्यक्ति को बिना कालक्रम संबंधी व्याख्या जोड़े सीधे सुरक्षित रखता है।
- source_word: οὕτως
  choice: वैसे ही
  rationale: तुलना के दूसरे भाग को स्वाभाविक हिन्दी में स्पष्ट रूप से जोड़ता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की इस उपाधि का स्थापित हिन्दी अनुवाद है और उसके बाइबलीय अर्थ-संबंधों को बनाए रखता है।
- source_word: ἔσται
  choice: रहेगा
  rationale: भविष्यकालीन εἰμί को इस स्थानवाचक और कालवाचक संदर्भ में स्वाभाविक हिन्दी में व्यक्त करता है; इससे मूल से परे कोई अलग क्रिया नहीं जोड़ी जाती।
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: पृथ्वी के हृदय में
  rationale: καρδία के रूपक को बनाए रखता है और उसे कब्र, गहराइयों या मृतकों के लोक जैसी किसी एक व्याख्या तक सीमित नहीं करता।
theological_decisions:
- issue: ‘पृथ्वी के हृदय में’ का अर्थ
  choice: मुख्य पाठ में रूपक को यथावत रखा गया है।
  alternative: कब्र में; पृथ्वी की गहराइयों में; मृतकों के लोक में
  rationale: यूनानी वाक्यांश रूपकात्मक है और इनमें से किसी एक व्याख्या को अनिवार्य नहीं करता।
- issue: ‘तीन दिन और तीन रात’ का कालगत बल
  choice: मुख्य पाठ में ठीक यही काल-अभिव्यक्ति रखी गई है।
  alternative: तीन दिनों के अंशों को समेटने वाला सामी मुहावरा; पूरे बहत्तर घंटे
  rationale: मूल पाठ अभिव्यक्ति को स्पष्ट रूप से दोहराता है, पर उसके कालक्रम संबंधी अर्थ पर होने वाले मतभेद को स्वयं नहीं सुलझाता।
