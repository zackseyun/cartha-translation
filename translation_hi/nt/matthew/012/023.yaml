reference: Matthew 12:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: hi
  text: और सारी भीड़ चकित होकर कहने लगी,[a] “कहीं यही तो दाऊद का पुत्र नहीं है?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल भाषा में क्रियाएँ जारी या बार-बार हो रही प्रतिक्रिया का संकेत दे सकती हैं: “चकित हो रहे थे और कह रहे थे।”'
    reason: lexical_alternative
  - marker: b
    text: “दाऊद का पुत्र” दाऊद के वंश से आने वाले प्रतिज्ञात राजकीय उद्धारकर्ता के लिए प्रयुक्त एक मसीही पदवी है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐξίσταντο
  choice: चकित होकर
  rationale: यह क्रिया भीड़ की प्रबल और जारी विस्मयभरी प्रतिक्रिया व्यक्त करती है। ‘चकित होकर’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में इसकी तीव्रता बनाए रखती है।
- source_word: πάντες οἱ ὄχλοι
  choice: सारी भीड़
  rationale: यूनानी बहुवचन का शब्दशः रूप ‘सारी भीड़ें’ हिन्दी में अस्वाभाविक होगा। सामूहिक अर्थ वाला ‘सारी भीड़’ πάντες की व्यापकता और ὄχλοι के जनसमूह-संबंधी अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔλεγον
  choice: कहने लगी
  rationale: अपूर्ण भूतकाल जारी या सामूहिक रूप से हो रही वाणी का संकेत देता है। ‘कहने लगी’ प्रतिक्रिया के आरम्भ और उसके सामूहिक स्वर को सहज हिन्दी में प्रकट करता है।
- source_word: Μήτι
  choice: कहीं यही तो ... नहीं है?
  rationale: Μήτι सामान्यतः नकारात्मक उत्तर की अपेक्षा या संकोचभरी आशंका का संकेत देता है। यह हिन्दी प्रश्न-रचना उस झिझक को बचाती है, पर भीड़ की उभरती मसीही संभावना को कठोर निषेध में नहीं बदलती।
- source_word: ὁ υἱὸς Δαυίδ
  choice: दाऊद का पुत्र
  rationale: यह मूल पदबंध का सीधा और हिन्दी बाइबलीय परंपरा में पहचाना जाने वाला रूप है; इसे ‘मसीह’ कहकर व्याख्यात्मक रूप से हल नहीं किया गया है।
theological_decisions:
- issue: ‘दाऊद का पुत्र’ पदवी का मसीही आशय
  choice: मुख्य पाठ में ‘दाऊद का पुत्र’ पदवी को ज्यों का त्यों रखना
  alternative: मसीह; दाऊद का प्रतिज्ञात राजवंशी उत्तराधिकारी
  rationale: यूनानी पाठ स्वयं ऐतिहासिक और धर्मवैचारिक रूप से अर्थपूर्ण पदवी का उपयोग करता है। उसे व्याख्यात्मक पर्याय से बदलने के बजाय पादटिप्पणी में उसका मसीही आशय स्पष्ट किया गया है।
- issue: Μήτι वाले प्रश्न की अपेक्षित दिशा
  choice: ‘कहीं यही तो ... नहीं है?’ के द्वारा संकोच और नकारात्मक अपेक्षा दोनों बनाए रखना
  alternative: ‘क्या यही ... है?’; ‘यह ... नहीं हो सकता, है न?’
  rationale: पहला विकल्प यूनानी कण की नकारात्मक प्रवृत्ति को कम कर देता है, जबकि दूसरा भीड़ की उभरती संभावना को अत्यधिक कठोर निषेध बना सकता है। चुना गया रूप दोनों के बीच का तनाव सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। ‘कहीं यही तो ... नहीं है?’ प्रश्न की आश्चर्यभरी झिझक को स्वाभाविक हिन्दी में व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
