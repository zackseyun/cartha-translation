  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: hi
  text: इसलिए मैं तुमसे कहता हूँ, लोगों को हर पाप और हर ईशनिंदा क्षमा कर दी जाएगी, लेकिन आत्मा के विरुद्ध की गई ईशनिंदा को क्षमा नहीं किया जाएगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र आत्मा के विरुद्ध ईशनिंदा।” इस पद के यूनानी पाठ में केवल “आत्मा” है; निकटवर्ती प्रसंग से पवित्र आत्मा अभिप्रेत है।
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निकले निष्कर्ष को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: प्रत्यक्ष संबोधन और कथन की गंभीरता को बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: πᾶσα ἁμαρτία
  choice: हर पाप
  rationale: πᾶσα के वितरणात्मक भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: βλασφημία
  choice: ईशनिन्दा
  rationale: इस प्रसंग में यह शब्द परमेश्वर के प्रति अपमानजनक और विरोधपूर्ण वाणी को सूचित करता है; केवल सामान्य 'निन्दा' की अपेक्षा 'ईशनिन्दा' अधिक सटीक है।
- source_word: ἀφεθήσεται
  choice: क्षमा कर दिया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य का क्षमा-संबंधी अर्थ स्पष्ट रखता है और कर्ता को अनकहा छोड़ता है, जैसा यूनानी पाठ में है।
- source_word: τοῖς ἀνθρώποις
  choice: लोगों के
  rationale: यह सभी मनुष्यों के सामान्य संदर्भ को लिंग-समावेशी और सहज हिन्दी में व्यक्त करता है; वाक्य-विन्यास में इन्हें वे लोग बताया गया है जिनके पाप क्षमा किए जाते हैं।
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: लेकिन आत्मा के विरुद्ध की गई ईशनिन्दा
  rationale: संबंधकारक τοῦ πνεύματος को प्रसंगानुसार ईशनिन्दा के लक्ष्य के रूप में व्यक्त किया गया है। पद में ἁγίου न होने के कारण मुख्य पाठ में केवल 'आत्मा' रखा गया है।
theological_decisions:
- issue: πνεύματος का अनुवाद 'आत्मा' किया जाए या 'पवित्र आत्मा'
  choice: आत्मा
  alternative: पवित्र आत्मा
  rationale: इस पद के यूनानी पाठ में केवल τοῦ πνεύματος है, ἁγίου नहीं। निकटवर्ती प्रसंग में पवित्र आत्मा अभिप्रेत है, पर मुख्य पाठ स्रोत की संक्षिप्त अभिव्यक्ति को बनाए रखता है और स्पष्टता के लिए विकल्प को पादटिप्पणी में देता है।
- issue: ईशनिन्दा को आत्मा की कही हुई निन्दा समझा जाए या आत्मा के विरुद्ध निन्दा
  choice: आत्मा के विरुद्ध की गई ईशनिन्दा
  alternative: आत्मा की ईशनिन्दा
  rationale: 'प्रसंग में संबंधकारक वस्तुगत है: आत्मा ईशनिन्दा करने वाला नहीं, बल्कि उसका लक्ष्य है।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। 'परन्तु' के स्थान पर सहज 'लेकिन' और सामान्य मानव-संदर्भ के लिए 'मनुष्यों' के स्थान पर 'लोगों' का प्रयोग किया गया है। कर्मवाच्य से यूनानी पाठ का अनकहा दैवी कर्ता सुरक्षित रखा गया है।
