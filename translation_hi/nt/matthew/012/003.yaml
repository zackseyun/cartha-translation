  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐκ ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε ⸀ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: hi
  text: पर उसने उनसे कहा, “क्या तुमने नहीं पढ़ा कि दाऊद ने क्या किया, जब वह और उसके साथ के लोग भूखे थे?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुमने नहीं पढ़ा कि दाऊद ने क्या किया, जब वह भूखा था और उसके साथ के लोग भी भूखे थे?” यूनानी में एकवचन क्रिया स्पष्ट रूप से दाऊद को सूचित करती है, पर भूख को दाऊद और उसके साथ के लोगों—दोनों पर लागू समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτοῖς
  choice: पर उसने उनसे कहा
  rationale: δέ यहाँ पिछले आरोप के उत्तर में हल्का विरोधसूचक संबंध दिखाता है; ‘पर’ स्वाभाविक है। εἶπεν αὐτοῖς का सीधा अर्थ ‘उसने उनसे कहा’ है।
- source_word: Οὐκ ἀνέγνωτε
  choice: क्या तुमने नहीं पढ़ा
  rationale: यह नकारात्मक आलंकारिक प्रश्न शास्त्र से उनकी परिचितता की ओर संकेत करता है; आधुनिक हिन्दी में यह रूप स्वाभाविक और अर्थसंगत है।
- source_word: τί ἐποίησεν Δαυὶδ
  choice: दाऊद ने क्या किया
  rationale: ποιέω का यहाँ सामान्य ऐतिहासिक अर्थ ‘करना’ है; दाऊद नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: ὅτε ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ
  choice: जब वह और उसके साथ के लोग भूखे थे
  rationale: ἐπείνασεν एकवचन में स्पष्टतः दाऊद को विषय बनाता है, जबकि καὶ οἱ μετ’ αὐτοῦ को उसी भूख की स्थिति में सहभागी समझा जा सकता है। हिन्दी में संयुक्त कर्ता के साथ यह वाक्य स्वाभाविक है; पादटिप्पणी व्याकरणिक सूक्ष्मता सुरक्षित रखती है।
theological_decisions:
- issue: भूख का संबंध केवल दाऊद से है या उसके साथ के लोगों से भी
  choice: मुख्य पाठ में भूख को दाऊद और उसके साथियों दोनों से जोड़ा गया है।
  alternative: “जब वह भूखा था, और उसके साथ के लोग भी” या भूख को व्याकरणतः केवल दाऊद से जोड़ना।
  rationale: यूनानी क्रिया एकवचन है और दाऊद को स्पष्ट विषय बनाती है, पर उसके बाद आया ‘और उसके साथ के लोग’ उसी निहित विधेय में सम्मिलित समझा जा सकता है। मुख्य पाठ सहज हिन्दी देता है और पादटिप्पणी वास्तविक अस्पष्टता बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘तुमने’ प्रसंग के प्रत्यक्ष बहुवचन संबोधन को स्वाभाविक ढंग से व्यक्त करता है; ‘उसके साथ के लोग’ मूल वाक्यांश के निकट रहते हुए सामान्य पाठक के लिए स्पष्ट है।
