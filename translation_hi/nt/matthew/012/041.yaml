id: MAT.12.41
reference: Matthew 12:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: hi
  text: नीनवे के पुरुष न्याय के समय इस पीढ़ी के साथ उठ खड़े होंगे और इसे दोषी ठहराएँगे, क्योंकि उन्होंने योना के प्रचार के प्रत्युत्तर में मन फिराया था; और देखो, यहाँ योना से भी बढ़कर कुछ है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहाँ योना से भी महान व्यक्ति है।” यूनानी में प्रयुक्त अभिव्यक्ति नपुंसकलिंग है, जिसका शाब्दिक अर्थ “योना से बढ़कर कुछ” है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: नीनवे के पुरुष
  rationale: ἄνδρες स्पष्ट रूप से पुल्लिंग बहुवचन ‘पुरुष’ है और Νινευῖται नीनवे के निवासियों को सूचित करता है; यह अनुवाद मूल की लैंगिक विशिष्टता बनाए रखता है।
- source_word: ἀναστήσονται
  choice: उठ खड़े होंगे
  rationale: न्याय के प्रसंग में यह क्रिया उठने या खड़े होने को व्यक्त करती है और पुनरुत्थान की संभावित ध्वनि को बिना आवश्यकता से अधिक स्पष्ट किए बनाए रखती है।
- source_word: ἐν τῇ κρίσει
  choice: न्याय के समय
  rationale: κρίσις यहाँ अंतिम न्याय की घटना को सूचित करता है; आधुनिक हिन्दी में ‘न्याय के समय’ सहज और स्पष्ट है।
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: इस पीढ़ी के साथ
  rationale: सम्बन्धबोधक μετά का मूल अर्थ ‘साथ’ रखा गया है; विरोधी न्यायिक भाव अगली क्रिया ‘दोषी ठहराएँगे’ से प्रकट होता है।
- source_word: κατακρινοῦσιν αὐτήν
  choice: इसे दोषी ठहराएँगे
  rationale: κατακρίνω का अर्थ दोषी ठहराना या दण्डादेश देना है; ‘इसे’ का पूर्वपद ‘इस पीढ़ी’ स्पष्ट है।
- source_word: μετενόησαν
  choice: मन फिराया था
  rationale: μετανοέω यहाँ योना की घोषणा के प्रत्युत्तर में पश्चात्तापपूर्ण परिवर्तन को दर्शाता है; ‘मन फिराना’ सामान्य पाठक के लिए स्वाभाविक बाइबलीय हिन्दी है।
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: योना के प्रचार के प्रत्युत्तर में
  rationale: εἰς यहाँ योना की उद्घोषणा के प्रति प्रतिक्रिया का भाव देता है; यह हिन्दी प्रयोग उस सम्बन्ध को स्पष्टतः व्यक्त करता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: ἰδού ध्यान आकर्षित करने वाला गम्भीर कथन-सूचक है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसका बल बनाए रखता है।
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: यहाँ योना से भी बढ़कर कुछ है
  rationale: πλεῖον नपुंसकलिंग एकवचन है; ‘कुछ’ मूल की व्याकरणिक अस्पष्टता और यीशु में उपस्थित अधिक महान वास्तविकता पर सम्भावित बल को सुरक्षित रखता है।
theological_decisions:
- issue: πλεῖον Ἰωνᾶ को यीशु के आत्म-सन्दर्भ के रूप में कैसे व्यक्त किया जाए
  choice: यहाँ योना से भी बढ़कर कुछ है
  alternative: यहाँ योना से भी महान व्यक्ति है
  rationale: यूनानी में तुलनात्मक पद नपुंसकलिंग है, इसलिए उसे केवल किसी अधिक महान पुरुष की स्पष्ट पहचान में बदलना उचित नहीं। ‘कुछ’ व्यक्ति, उपस्थिति और सेवकाई से जुड़ी व्यापक महान वास्तविकता की सम्भावना खुली रखता है।
- issue: ἄνδρες की लैंगिक विशिष्टता
  choice: पुरुष
  alternative: लोग
  rationale: मूल में सामान्य निवासियों के लिए कोई निरपेक्ष पद नहीं, बल्कि स्पष्ट पुल्लिंग संज्ञा ἄνδρες है; इसलिए ‘पुरुष’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘न्याय के समय,’ ‘मन फिराया’ और ‘प्रत्युत्तर में’ स्वाभाविक हिन्दी देते हैं, जबकि ‘योना से भी बढ़कर कुछ’ मूल यूनानी की वास्तविक अस्पष्टता सुरक्षित रखता है।
