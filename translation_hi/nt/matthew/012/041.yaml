  terminology: 'Key terms are sound and consistent: “न्याय,” “पीढ़ी,” “दोषी ठहराना,” “प्रचार,” and “मन फिराना” are appropriate. The footnote correctly identifies the neuter form and offers “महान व्यक्ति” as an alternative without presenting it as required by the Greek.'
