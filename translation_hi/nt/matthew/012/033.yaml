source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: hi
  text: या तो पेड़ को अच्छा बनाओ और उसके फल को भी अच्छा बनाओ, या पेड़ को सड़ा हुआ बनाओ और उसके फल को भी सड़ा हुआ बनाओ[a]; क्योंकि पेड़ अपने फल से पहचाना जाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सड़ा हुआ’ के स्थान पर ‘खराब’ या ‘निकम्मा’ भी संभव है; यूनानी शब्द का अर्थ बिगड़ा हुआ, भ्रष्ट या अनुपयोगी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: दोनों बार आया ‘बनाओ’ यूनानी में आज्ञार्थक है; यहाँ इसका आलंकारिक भाव ‘मानो’ या ‘ठहराओ’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: बनाओ
  rationale: यूनानी में यह बहुवचन आज्ञार्थक रूप है। ‘बनाओ’ उसकी प्रत्यक्षता और दोनों खंडों की समानांतर रचना बनाए रखता है, यद्यपि प्रसंग में इसका आलंकारिक अर्थ ‘मानो’ या ‘ठहराओ’ भी हो सकता है।
- source_word: δένδρον
  choice: पेड़
  rationale: रूपक के लिए आधुनिक मानक हिन्दी का सहज और सीधा शब्द।
- source_word: καλός
  choice: अच्छा
  rationale: यह गुणात्मक और नैतिक—दोनों संकेतों को खुला रखता है; ‘स्वस्थ’ अर्थ को केवल भौतिक दशा तक सीमित कर देता।
- source_word: καρπός
  choice: फल
  rationale: स्रोत के चित्र और प्रचलित बाइबिलीय रूपक को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: σαπρός
  choice: सड़ा हुआ
  rationale: यह बिगड़ी, भ्रष्ट या निकम्मी दशा का सजीव बोध देता है और पेड़ तथा फल दोनों के साथ स्वाभाविक है।
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: क्योंकि ... अपने फल से
  rationale: γάρ का व्याख्यात्मक संबंध ‘क्योंकि’ से और ἐκ का पहचान के आधार का भाव ‘से’ द्वारा स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: γινώσκεται
  choice: पहचाना जाता है
  rationale: वर्तमान कर्मवाच्य को स्पष्ट हिन्दी में रखता है और फल के आधार पर वृक्ष की पहचान का भाव व्यक्त करता है।
- source_word: αὐτοῦ
  choice: उसके / अपने
  rationale: पहले दो खंडों में ‘उसके’ मूल संबंध को स्पष्ट करता है; अंतिम वाक्य में हिन्दी की स्वाभाविक सहसंबंधी रचना के अनुसार ‘अपने’ प्रयुक्त है।
theological_decisions:
- issue: यीशु के रूपक में आज्ञार्थक क्रियाओं का बल
  choice: दोनों आज्ञार्थक रूपों को ‘बनाओ’ के रूप में बनाए रखा गया।
  alternative: ‘पेड़ को अच्छा मानो’ या ‘पेड़ को अच्छा ठहराओ’।
  rationale: मूल यूनानी में दोनों बार स्पष्ट आज्ञार्थक रूप है। उसका बल बनाए रखने से कथन की तीक्ष्णता और जानबूझकर उपस्थित आलंकारिक तनाव सुरक्षित रहता है; ‘मानो’ अर्थ को समय से पहले तय कर देता।
- issue: σαπρός का नैतिक और चित्रात्मक विस्तार
  choice: ‘सड़ा हुआ’
  alternative: ‘बुरा’, ‘खराब’ या ‘निकम्मा’।
  rationale: ‘सड़ा हुआ’ वृक्ष-फल के चित्र को सजीव रखता है और भ्रष्टता अथवा अनुपयोगिता की ओर संकेत कर सकता है, बिना उसे किसी एक धर्मवैज्ञानिक अर्थ तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। समानांतर वाक्य-विन्यास और प्रत्यक्ष आज्ञार्थक बल सुरक्षित रखा गया है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
