base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: hi
  text: तब वह उस आदमी से कहता है, “अपना हाथ आगे बढ़ाओ।” उसने हाथ आगे बढ़ाया, और उसका हाथ फिर से ठीक हो गया[a] और दूसरे हाथ के समान स्वस्थ हो गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहले जैसी दशा में आ गया”; यूनानी क्रिया किसी वस्तु या अंग के अपनी उचित दशा में फिर से आ जाने पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “दूसरे के समान स्वस्थ”; यहाँ “दूसरे” का अर्थ उस आदमी का दूसरा हाथ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कथा में घटनाओं का क्रम बताने वाला स्वाभाविक और संक्षिप्त कालवाचक शब्द है।
- source_word: λέγει
  choice: कहता है
  rationale: यूनानी ऐतिहासिक वर्तमान को वर्तमान काल में रखकर मत्ती की सजीव कथाशैली सुरक्षित रखी गई है।
- source_word: τῷ ἀνθρώπῳ
  choice: उस आदमी से
  rationale: संदर्भ में एक विशिष्ट पुरुष है; आधुनिक हिन्दी में ‘आदमी’ स्पष्ट और सहज है।
- source_word: Ἔκτεινόν σου τὴν χεῖρα
  choice: अपना हाथ आगे बढ़ाओ
  rationale: आज्ञा की प्रत्यक्षता तथा हाथ को फैलाने या सामने करने की शारीरिक क्रिया दोनों स्वाभाविक हिन्दी में व्यक्त होती हैं।
- source_word: ἐξέτεινεν
  choice: उसने हाथ आगे बढ़ाया
  rationale: आज्ञा और उसके पालन में मूल पाठ की क्रियात्मक पुनरावृत्ति बनाए रखी गई है।
- source_word: ἀπεκατεστάθη
  choice: फिर से ठीक हो गया
  rationale: यह क्रिया किसी अंग के उचित या पूर्ववत स्वस्थ दशा में लौट आने पर बल देती है; ‘फिर से ठीक’ आधुनिक हिन्दी में इस पुनर्स्थापन को सहज रूप से व्यक्त करता है।
- source_word: ὑγιὴς
  choice: स्वस्थ
  rationale: यह शब्द अंग की ठीक और निरोग दशा को सीधे व्यक्त करता है।
- source_word: ὡς ἡ ἄλλη
  choice: दूसरे हाथ के समान
  rationale: यूनानी में स्त्रीलिंग ‘दूसरी’ से ‘दूसरा हाथ’ अभिप्रेत है; हिन्दी में अर्थ स्पष्ट करने के लिए संज्ञा दोहराई गई है।
theological_decisions:
- issue: चंगाई के वर्णन का स्वरूप
  choice: हाथ के उचित स्वस्थ दशा में फिर लौट आने का सीधा वर्णन
  alternative: हाथ चंगा हो गया / हाथ पूर्ण कर दिया गया
  rationale: पद चमत्कार का वर्णन करता है, पर उससे आगे कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता। ‘फिर से ठीक हो गया’ ἀπεκατεστάθη के पुनर्स्थापन-वाले भाव को रखता है, जबकि ‘स्वस्थ’ ὑγιής को अलग से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कहता है’ द्वारा यूनानी ऐतिहासिक वर्तमान सुरक्षित है। आदेश और उसके पालन में ‘हाथ आगे बढ़ाना’ दोहराकर मूल की शैली बनाए रखी गई है।
