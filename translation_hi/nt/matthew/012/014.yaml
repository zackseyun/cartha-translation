source:
  edition: SBLGNT
  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: hi
  text: पर फ़रीसी बाहर गए और उन्होंने उसके विरुद्ध षड्यंत्र रचा कि उसे कैसे नष्ट करें[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मार डालें” अथवा “उसका वध करें।” यूनानी में “नष्ट करें” है, जिसमें इस संदर्भ में प्राण लेने की मंशा शामिल हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: बाहर गए
  rationale: अओरिस्ट कृदन्त क्रमिक/कालगत क्रिया बताता है; यह रूप प्रस्थान की क्रिया को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: यहाँ δέ कथा में हल्का विरोध और नया मोड़ दिखाता है—यीशु के कार्य के बाद फ़रीसियों की शत्रुतापूर्ण प्रतिक्रिया।
- source_word: οἱ Φαρισαῖοι
  choice: फ़रीसी
  rationale: यह यहूदी धार्मिक समूह के नाम का आधुनिक हिन्दी में प्रचलित लिप्यंतरण है।
- source_word: συμβούλιον ἔλαβον
  choice: षड्यंत्र रचा
  rationale: शाब्दिक अर्थ ‘सलाह की’ है, पर κατ’ αὐτοῦ और आगामी उद्देश्य-वाक्य के शत्रुतापूर्ण संदर्भ में यह किसी के विरुद्ध सोच-समझकर योजना बनाने का भाव देता है।
- source_word: κατ’ αὐτοῦ
  choice: उसके विरुद्ध
  rationale: संदर्भ में κατά के साथ सम्बन्धकारक का प्रयोग विरोधात्मक अर्थ रखता है।
- source_word: ὅπως
  choice: कि ... कैसे
  rationale: यह उनकी योजना की विषय-वस्तु अथवा उद्देश्य प्रस्तुत करता है और विचार-विमर्श का भाव भी बनाए रखता है।
- source_word: ἀπολέσωσιν
  choice: उसे ... नष्ट करें
  rationale: ἀπόλλυμι का अर्थ ‘नष्ट करना’ या संदर्भानुसार ‘मार डालना’ हो सकता है। मुख्य पाठ में व्यापक यूनानी शब्दावली सुरक्षित रखी गई है।
theological_decisions:
- issue: ἀπολέσωσιν को कितनी विशिष्टता से व्यक्त किया जाए
  choice: नष्ट करें
  alternative: मार डालें / उसका वध करें
  rationale: संदर्भ में प्राणघातक मंशा प्रबल है, फिर भी यूनानी क्रिया स्वयं सीधे ‘मार डालने’ वाली अधिक विशिष्ट क्रिया से व्यापक है। इसलिए मुख्य पाठ मूल की व्यापकता बनाए रखता है और स्पष्टतर अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘षड्यंत्र रचा’ hostile deliberation को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘नष्ट करें’ मूल क्रिया की अर्थगत व्यापकता बनाए रखता है।
