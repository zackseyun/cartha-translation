  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: hi
  text: पर उसने उस व्यक्ति को, जो उससे बोल रहा था,[a] उत्तर दिया, “मेरी माँ कौन है, और मेरे भाई कौन हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “पर उसने उससे बोलने वाले को उत्तर देकर कहा।”'
    reason: यूनानी ἀποκριθεὶς εἶπεν की अधिक औपचारिक संरचना और वर्तमान कृदन्त λέγοντι का विकल्प दिखाने के लिए।
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: पर उसने ... उत्तर दिया
  rationale: ἀποκριθεὶς εἶπεν उत्तर देने और कहने का यूनानी मुहावरा है। स्वाभाविक हिन्दी में ‘उत्तर दिया’ पूरा भाव व्यक्त करता है; δέ को ‘पर’ से व्यक्त किया गया है, जो संवाद में आए मोड़ को बनाए रखता है।
- source_word: τῷ λέγοντι αὐτῷ
  choice: उस व्यक्ति को, जो उससे बोल रहा था
  rationale: वर्तमान कृदन्त λέγοντι को व्यक्तिवाचक रूप में लिया गया है। यह अनुवाद उस समय यीशु को संबोधित कर रहे व्यक्ति और जारी क्रिया—दोनों को स्पष्ट रखता है।
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: मेरी माँ कौन है
  rationale: पहचान पूछने वाले प्रश्न का सीधा और स्वाभाविक हिन्दी रूप; सम्बन्धवाचक शब्द और प्रश्न की अलंकारिक तीक्ष्णता सुरक्षित हैं।
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: और मेरे भाई कौन हैं
  rationale: बहुवचन τίνες और पुरुषवाचक बहुवचन ἀδελφοί को स्वाभाविक हिन्दी में ‘भाई कौन हैं’ से व्यक्त किया गया है; इसे ‘भाई-बहन’ या ‘सगे-संबंधी’ कहकर व्यापक नहीं बनाया गया।
theological_decisions:
- issue: परिवार की पहचान के विषय में यीशु के अलंकारिक प्रश्न को व्याख्यात्मक रूप से नरम करने की संभावना
  choice: प्रश्नों को बिना व्याख्यात्मक विस्तार के सीधे बनाए रखा गया
  alternative: मेरी माँ किसे माना जाए, और मेरे भाई किन्हें माना जाए?
  rationale: अगले संदर्भ में आत्मिक रिश्तेदारी का आशय सामने आता है, पर इस पद में उसे पहले से जोड़ना कथात्मक और धर्मवैचारिक तनाव को समय से पहले सुलझा देता।
- issue: ἀδελφοί का लिंग-सटीक अनुवाद
  choice: भाई
  alternative: भाई-बहन; सहोदर
  rationale: तात्कालिक प्रसंग में शब्द यीशु के परिवार के पुरुष सदस्यों के लिए प्रयुक्त है और स्रोत में पुरुषवाचक बहुवचन है; इसलिए अर्थ का विस्तार नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘पर’ संवाद में विरोधात्मक मोड़ को दर्शाता है। मुख्य पाठ में यूनानी मुहावरे की पुनरुक्ति को स्वाभाविक हिन्दी के अनुसार संक्षिप्त किया गया है और उसका अधिक शब्दशः रूप पादटिप्पणी में रखा गया है।
