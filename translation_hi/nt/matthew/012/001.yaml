source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: hi
  text: उस समय यीशु सब्त के दिन[a] अनाज के खेतों में से होकर गए। उनके शिष्यों को भूख लगी, और वे अनाज की बालियाँ तोड़ने और उन्हें खाने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘सब्तों पर’ है; यह एक मुहावरेदार बहुवचन है, जिसका अर्थ यहाँ ‘सब्त के दिन’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: उस समय
  rationale: यह पदबंध कथा में समय या अवसर का संकेत देता है; ‘उस समय’ स्वाभाविक और सटीक आधुनिक हिन्दी है।
- source_word: ἐπορεύθη
  choice: होकर गए
  rationale: क्रिया सामान्यतः जाने या यात्रा करने को व्यक्त करती है; खेतों के बीच से मार्ग लेने के अर्थ में ‘में से होकर गए’ स्वाभाविक है।
- source_word: τοῖς σάββασιν
  choice: सब्त के दिन
  rationale: यूनानी में रूप बहुवचन है, पर यहाँ प्रचलित मुहावरे के अनुसार एक सब्त-दिन का बोध कराता है।
- source_word: διὰ τῶν σπορίμων
  choice: अनाज के खेतों में से
  rationale: σπόριμα बोए हुए खेतों, विशेषकर अनाज के खेतों, को दर्शाता है; यह हिन्दी में स्पष्ट और सहज है।
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: उनके शिष्य
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है; पूर्ण विराम के बाद ‘उनके शिष्य’ हिन्दी में सहज प्रवाह देता है और अनावश्यक विरोध नहीं जोड़ता।
- source_word: ἐπείνασαν
  choice: भूख लगी
  rationale: यूनानी अओरिस्ट भूख आरम्भ होने का भाव दे सकता है; हिन्दी का ‘भूख लगी’ उसी आरम्भिक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν
  choice: अनाज की बालियाँ तोड़कर खाने लगे
  rationale: ‘लगे’ आरम्भ का भाव रखता है, जबकि ‘तोड़कर खाने’ से दोनों क्रियाओं का स्वाभाविक सम्बन्ध और क्रम स्पष्ट होता है।
- source_word: στάχυας
  choice: अनाज की बालियाँ
  rationale: στάχυς अनाज की बाली या शीर्ष को दर्शाता है; ‘अनाज की बालियाँ’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: σάββασιν का बहुवचन रूप
  choice: सब्त के दिन
  alternative: सब्तों के दिनों में
  rationale: इस कोइन यूनानी मुहावरे में बहुवचन रूप एक सब्त-दिन के लिए प्रयुक्त हो सकता है। एकवचन अर्थ का अनुवाद प्रसंग को स्पष्ट रखता है, जबकि पादटिप्पणी मूल रूप की जानकारी सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘सब्त’ बाइबलीय शब्दावली को बनाए रखता है, और उसके साथ ‘के दिन’ सामान्य पाठक के लिए समय-सूचक अर्थ स्पष्ट करता है।
