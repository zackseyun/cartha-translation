source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: hi
  text: और यदि मैं बालज़बूल[a] के द्वारा दुष्टात्माओं को निकालता हूँ, तो तुम्हारे पुत्र किसके द्वारा उन्हें निकालते हैं? इसलिए वे ही तुम्हारे न्यायाधीश होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी: ‘बालज़बूल’; अनेक अनुवादों में ‘बालज़बूब’।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: बालज़बूल की शक्ति से
  rationale: यहाँ ἐν साधन अथवा कर्तृत्व का भाव व्यक्त करता है। हिंदी में केवल ‘बालज़बूल से’ संदिग्ध लग सकता है, इसलिए ‘की शक्ति से’ आरोप का आशय स्वाभाविक ढंग से स्पष्ट करता है। नाम को स्रोत-पाठ के Βεελζεβούλ के अनुसार लिप्यंतरित किया गया है।
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: दुष्टात्माओं को निकालता हूँ
  rationale: ἐκβάλλω निष्कासन का भाव देता है और दुष्टात्मा निकालने के संदर्भ में ‘निकालना’ वर्तमान हिंदी में सहज है। δαιμόνια के लिए ‘दुष्टात्माएँ’ प्रचलित और अर्थ-स्पष्ट शब्द है।
- source_word: οἱ υἱοὶ ὑμῶν
  choice: तुम्हारे पुत्र
  rationale: यूनानी में स्पष्ट रूप से ‘तुम्हारे पुत्र’ है। संभवतः आशय श्रोताओं के अपने समुदाय के लोगों या शिष्यों से है, पर उस व्याख्या को मुख्य पाठ में आरोपित किए बिना मूल किनशिप-रूपक सुरक्षित रखा गया है।
- source_word: ἐν τίνι
  choice: किसकी शक्ति से
  rationale: यह भी साधन अथवा कर्तृत्व संबंधी प्रश्न है। ‘किसकी शक्ति से’ हिंदी में व्यक्तिगत सत्ता या अधिकार के माध्यम को स्वाभाविक रूप से व्यक्त करता है और पहले वाक्यांश के समानांतर रहता है।
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह पद पिछले आलंकारिक प्रश्न से निकला निष्कर्ष प्रस्तुत करता है; ‘इसलिए’ संक्षिप्त और सहज है।
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: वे ही तुम्हारे न्यायी होंगे
  rationale: यह अनुवाद विधेय संज्ञा ‘न्यायी’ और भविष्यकाल दोनों को बनाए रखता है। ‘ही’ αὐτοί के बलाघात को व्यक्त करता है।
theological_decisions:
- issue: Βεελζεβούλ की पहचान और वर्तनी
  choice: बालज़बूल
  alternative: बालज़बूब
  rationale: मुख्य पाठ प्रदत्त यूनानी रूप Βεελζεβούλ का अनुसरण करता है और नाम का लिप्यंतरण करता है; अधिक परिचित वैकल्पिक रूप पादटिप्पणी में रखा गया है। इससे किसी परंपरागत रूप के अनुसार स्रोत-पाठ का सामंजस्य नहीं किया गया।
- issue: ‘तुम्हारे पुत्र’ का संदर्भ
  choice: शाब्दिक संबंध-सूचक पद को बनाए रखना
  alternative: ‘तुम्हारे लोग’ या ‘तुम्हारे शिष्य’
  rationale: संदर्भ में ये लोग श्रोताओं के समुदाय या अनुयायी हो सकते हैं, लेकिन यूनानी की जानबूझकर प्रयुक्त भाषा को किसी एक व्याख्या तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘की शक्ति से’ साधनात्मक ἐν को स्वाभाविक हिंदी में व्यक्त करता है, जबकि ‘तुम्हारे पुत्र’ और ‘न्यायी होंगे’ स्रोत की औपचारिक तथा आलंकारिक संरचना को बनाए रखते हैं।
