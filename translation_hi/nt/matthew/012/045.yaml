id: MAT.12.45
reference: Matthew 12:45
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: hi
  text: तब वह जाती है और अपने साथ सात अन्य आत्माओं को ले लेती है, जो उससे भी अधिक दुष्ट हैं[a]। वे प्रवेश करके वहीं रहने लगती हैं; और उस मनुष्य की अंतिम दशा उसकी पहली दशा से भी बुरी हो जाती है[b]। इस दुष्ट पीढ़ी के साथ भी ऐसा ही होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सात भिन्न आत्माओं को, जो उससे भी अधिक दुष्ट हैं।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से, “उस मनुष्य की अंतिम बातें पहली बातों से भी बुरी हो जाती हैं”; यह मुहावरा उसकी अंतिम दशा की तुलना उसकी पहली दशा से करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह क्रियाविशेषण घटनाक्रम के अगले चरण को सूचित करता है; ‘तब’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: वह जाती है और अपने साथ … ले आती है
  rationale: यह अभिव्यक्ति आत्मा के जाने और दूसरी आत्माओं को साथ लेने का क्रम स्पष्ट करती है। प्रसंग में उसका लौटना निहित है, इसलिए ‘ले आती है’ स्वाभाविक हिन्दी है।
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: सात और आत्माओं
  rationale: ἕτερα यहाँ पहली आत्मा के अतिरिक्त अन्य आत्माओं को दर्शाता है; यह आवश्यक रूप से अलग प्रकार पर बल नहीं देता। πνεύματα का सीधा अनुवाद ‘आत्माएँ’ रखा गया है।
- source_word: πονηρότερα ἑαυτοῦ
  choice: उससे भी अधिक दुष्ट
  rationale: तुलनात्मक रूप उन आत्माओं की अधिक नैतिक दुष्टता व्यक्त करता है; ‘दुष्ट’ सामान्य, स्पष्ट और प्रसंगानुकूल है।
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: वे भीतर जाकर वहीं बस जाती हैं
  rationale: बहुवचन कृदन्त आत्माओं के भीतर जाने को बताता है। κατοικεῖ मुद्रित यूनानी पाठ में एकवचन है, पर प्रसंग पूरे समूह के वहाँ निवास करने का है; हिन्दी में ‘बस जाती हैं’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: उस मनुष्य की अन्तिम दशा
  rationale: शाब्दिक ‘अन्तिम बातें’ यहाँ अन्तिम अवस्था या दशा के लिए मुहावरा है। ‘अन्तिम दशा’ तुलना को स्पष्ट रखते हुए अर्थ संप्रेषित करती है।
- source_word: χείρονα τῶν πρώτων
  choice: उसकी पहली दशा से भी बुरी
  rationale: यह अन्तिम और आरम्भिक दशाओं की तुलना है। हिन्दी में ‘दशा’ दोहराने से अर्थ अस्पष्ट नहीं रहता।
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: इसी प्रकार इस दुष्ट पीढ़ी के साथ भी होगा
  rationale: यह उदाहरण को उस समय की पीढ़ी पर लागू करता है; ‘इसी प्रकार … भी’ समानता और καί के बल दोनों को बनाए रखता है।
theological_decisions:
- issue: दुष्ट अलौकिक प्राणियों के लिए πνεύματα का अनुवाद
  choice: आत्माएँ
  alternative: दुष्टात्माएँ / दुष्ट शक्तियाँ
  rationale: यूनानी में यहाँ πνεύματα अर्थात ‘आत्माएँ’ है, और निकटवर्ती प्रसंग इन्हें अशुद्ध आत्माओं के रूप में पहचानता है। मूल शब्द को बनाए रखना अनावश्यक विशिष्टीकरण से बचाता है।
- issue: ἀνθρώπου का लिंग-संगत अनुवाद
  choice: उस मनुष्य
  alternative: उस व्यक्ति
  rationale: दृष्टान्त का उदाहरण एकवचन में है और यूनानी संज्ञा व्याकरणतः पुल्लिंग है। ‘मनुष्य’ हिन्दी में मूल रूप के निकट, गरिमापूर्ण और सामान्यतः बोधगम्य है।
- issue: अन्तिम अवस्था और पहली अवस्था के बीच तुलना
  choice: अन्तिम दशा उसकी पहली दशा से भी बुरी
  alternative: उसका अन्त पहले से भी बुरा
  rationale: ‘दशा’ मूल मुहावरे का अर्थ स्पष्ट करती है, जबकि ‘अन्त’ मृत्यु या विनाश का अर्थ दे सकता है, जो यूनानी पाठ में आवश्यक नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किन्तु गरिमापूर्ण रखी गई है। ‘आत्मा’ के व्याकरणिक स्त्रीलिंग के अनुसार क्रियाएँ स्त्रीलिंग में हैं। ‘पीढ़ी’ γενεά का प्रचलित और प्रसंगानुकूल रूप है।
