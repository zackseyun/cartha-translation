base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: hi
  text: तो फिर मनुष्य भेड़ से कितना अधिक मूल्यवान है! इसलिए सब्त के दिन[a] भलाई करना जायज़ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘सब्तों में।’ यूनानी में बहुवचन यहाँ सब्त के पालन के लिए प्रचलित मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ οὖν
  choice: तो फिर…कितना अधिक
  rationale: πόσῳ तुलनात्मक तर्क में ‘कितना अधिक’ का भाव देता है, और οὖν पिछले उदाहरण से निकले निष्कर्ष को ‘तो फिर’ द्वारा स्वाभाविक रूप से जोड़ता है।
- source_word: διαφέρει
  choice: अधिक मूल्यवान है
  rationale: यहाँ क्रिया केवल भिन्नता नहीं, बल्कि भेड़ की तुलना में मनुष्य के अधिक मूल्यवान होने को व्यक्त करती है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: ἄνθρωπος यहाँ समस्त मानव जाति के एक प्रतिनिधि सदस्य को दर्शाता है; ‘मनुष्य’ स्वाभाविक हिंदी में उसका सामान्य मानवीय अर्थ सुरक्षित रखता है।
- source_word: προβάτου
  choice: भेड़ से
  rationale: संबंधकारक रूप तुलना का मानक बताता है, जिसे हिंदी में ‘से’ द्वारा स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पहले कथन से निकलने वाले निष्कर्ष का परिचय देता है।
- source_word: ἔξεστιν
  choice: उचित है
  rationale: सब्त की व्यवस्था पर विवाद के संदर्भ में यह केवल क्षमता नहीं, बल्कि जिसकी अनुमति है और जो व्यवस्था के अनुरूप है, उस अर्थ को व्यक्त करता है; ‘उचित है’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: τοῖς σάββασιν
  choice: सब्त के दिनों में
  rationale: यूनानी बहुवचन को पारदर्शी रूप से रखा गया है; हिंदी में अधिक मुहावरेदार एकवचन विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: καλῶς ποιεῖν
  choice: भलाई करना
  rationale: यह लाभकारी और नैतिक रूप से अच्छा कार्य करने का सामान्य मुहावरा है; ‘भलाई करना’ निकट और स्वाभाविक हिंदी है।
theological_decisions:
- issue: ἄνθρωπος का प्रतिनिधिक मानवीय अर्थ
  choice: मनुष्य
  alternative: व्यक्ति; आदमी
  rationale: यहाँ कथन किसी खास पुरुष तक सीमित नहीं है, बल्कि मनुष्य की तुलना भेड़ से करता है। ‘मनुष्य’ स्रोत के प्रतिनिधिक एकवचन को रखते हुए अनावश्यक लैंगिक सीमा नहीं जोड़ता।
- issue: सब्त के बहुवचन मुहावरे का अनुवाद
  choice: सब्त के दिनों में
  alternative: सब्त के दिन
  rationale: मुख्य पाठ में यूनानी बहुवचन की पारदर्शिता रखी गई है, जबकि पाद-टिप्पणी हिंदी के अधिक मुहावरेदार एकवचन को बताती है।
- issue: ἔξεστιν की विधिक-नैतिक छाया
  choice: उचित है
  alternative: जायज़ है; अनुमति है; व्यवस्था-सम्मत है
  rationale: ‘उचित है’ सामान्य पाठक के लिए सहज रहते हुए सब्त-संबंधी वैधता और नैतिक औचित्य दोनों को व्यक्त करता है; ‘अनुमति है’ अपेक्षाकृत कमजोर और ‘व्यवस्था-सम्मत’ अधिक व्याख्यात्मक है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिंदी। ‘तो फिर’ तर्क की निरंतरता, विस्मयादिबोधक चिह्न कथन की अलंकारिक शक्ति, और ‘भलाई करना उचित है’ निष्कर्ष की विधिक-नैतिक प्रकृति को स्वाभाविक रूप से व्यक्त करते हैं।
