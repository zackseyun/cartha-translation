source:
  edition: SBLGNT
  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: hi
  text: कैसे वह परमेश्वर के भवन में गया और उन्होंने परमेश्वर की उपस्थिति की रोटियाँ[b] खाईं[a], जिन्हें खाना न तो उसके लिए, न उसके साथ के लोगों के लिए वैध था, बल्कि केवल याजकों के लिए था?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों या पाठों में बहुवचन “उन्होंने खाया” के स्थान पर एकवचन “उसने खाया” है।
    reason: textual_variant
  - marker: b
    text: अर्थात परमेश्वर के सामने रखी जाने वाली पवित्र रोटियाँ; इन्हें परंपरागत रूप से “भेंट की रोटियाँ” भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: कैसे
  rationale: यह दाऊद के वृत्तांत की उस घटना का परिचय देता है जिसका यीशु उल्लेख कर रहे हैं; ‘कैसे’ हिन्दी में स्वाभाविक और निकट समतुल्य है।
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: वह परमेश्वर के भवन में गया
  rationale: ‘परमेश्वर का भवन’ यूनानी अभिव्यक्ति को बनाए रखता है; प्रसंग के आधार पर इसे चुपचाप ‘तम्बू’ या ‘पवित्रस्थान’ नहीं बनाया गया।
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: परमेश्वर की उपस्थिति की रोटियाँ
  rationale: यह परमेश्वर के सामने रखी जाने वाली पवित्र रोटियों का संकेत देता है। ‘उपस्थिति’ धार्मिक-सांस्कृतिक अर्थ को सुरक्षित रखता है, और ‘रोटियाँ’ बहुवचन ἄρτους को व्यक्त करता है।
- source_word: ἔφαγον
  choice: उसने अपने साथियों के साथ ... खाईं
  rationale: SBLGNT के बहुवचन पाठ ‘उन्होंने खाया’ का अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है। इससे दाऊद और उसके साथ के लोगों, दोनों का खाना स्पष्ट होता है; एकवचन पाठ पादटिप्पणी में दिया गया है।
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: जिन्हें न तो उसे खाना व्यवस्था के अनुसार उचित था
  rationale: ἐξὸν का विधिक-सांस्कृतिक बल ‘व्यवस्था के अनुसार उचित’ से व्यक्त होता है; यह केवल सामान्य अनुमति का मामला नहीं था।
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: न उसके साथ के लोगों को
  rationale: यह दाऊद के साथ उपस्थित लोगों को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: केवल याजकों को ही
  rationale: εἰ μὴ के अपवाद और μόνοις की अनन्यता, दोनों को संक्षेप और स्पष्टता से सुरक्षित रखता है।
theological_decisions:
- issue: ἐξὸν का धार्मिक-विधिक बल
  choice: व्यवस्था के अनुसार उचित था
  alternative: अनुमति थी
  rationale: प्रसंग में प्रतिबंध पवित्र रोटियों से संबंधित व्यवस्था पर आधारित है। यह अनुवाद उस विधिक बल को बनाए रखता है, पर उससे आगे कोई सम्प्रदायगत निष्कर्ष नहीं जोड़ता।
- issue: ἔφαγον का कर्ता और पाठांतर
  choice: 'मुख्य पाठ में बहुवचन अर्थ: दाऊद ने अपने साथियों के साथ खाया'
  alternative: 'एकवचन पाठ: केवल ‘उसने खाया’'
  rationale: प्रदत्त SBLGNT पाठ ἔφαγον बहुवचन है। हिन्दी में अस्पष्ट या आदरसूचक ‘उन्होंने’ से बचते हुए इसका सामूहिक अर्थ स्वाभाविक रूप में दिया गया है; एकवचन पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: οἶκον τοῦ θεοῦ का संदर्भ
  choice: परमेश्वर का भवन
  alternative: मिलापवाला तम्बू / पवित्रस्थान
  rationale: ऐतिहासिक संदर्भ अधिक विशिष्ट हो सकता है, पर यूनानी पाठ स्वयं ‘परमेश्वर का भवन’ कहता है; अतः अनुवाद उस व्यापक अभिव्यक्ति को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। वाक्य पिछले पद से जुड़े प्रश्न का अंश है, इसलिए आरम्भिक ‘कैसे’ और अंतिम प्रश्नचिह्न बनाए गए हैं। दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
