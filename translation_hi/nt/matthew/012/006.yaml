id: MAT.12.6
reference: Matthew 12:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: hi
  text: पर मैं तुमसे कहता हूँ कि यहाँ मंदिर से भी कुछ बड़ा है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहाँ मंदिर से भी बड़ा कोई है” अथवा “यहाँ मंदिर से भी बड़ा एक जन है।” यूनानी में “बड़ा” नपुंसकलिंग रूप में है, इसलिए उसका संदर्भ स्पष्ट रूप से नहीं बताया गया है।
    reason: alternative_reading
  - marker: b
    text: या, “इस स्थान में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: पर मैं तुमसे कहता हूँ
  rationale: δέ पिछले तर्क के साथ हल्का विरोध दर्शाता है; ‘पर’ स्वाभाविक है। λέγω ὑμῖν को सीधे संबोधन के प्रचलित हिन्दी रूप में रखा गया है।
- source_word: τοῦ ἱεροῦ
  choice: मंदिर से
  rationale: ἱερόν यहाँ पूरे मंदिर-परिसर को सूचित करता है; सामान्य हिन्दी में ‘मंदिर’ सबसे स्वाभाविक और संदर्भानुकूल है।
- source_word: μεῖζόν
  choice: कुछ बड़ा
  rationale: नपुंसकलिंग एकवचन तुलनात्मक रूप का संदर्भ औपचारिक रूप से अनकहा है। ‘कुछ बड़ा’ उस व्याकरणिक अस्पष्टता को बनाए रखता है और मुख्य पाठ में किसी व्यक्ति को स्पष्ट रूप से नहीं जोड़ता।
- source_word: ἐστιν
  choice: है
  rationale: साधारण वर्तमानकालीन संयोजक क्रिया का सीधा अनुवाद।
- source_word: ὧδε
  choice: यहाँ
  rationale: स्थानवाचक क्रियाविशेषण का संक्षिप्त और स्वाभाविक हिन्दी रूप; ‘इस स्थान में’ वैकल्पिक अर्थ के रूप में टिप्पणी में रखा गया है।
theological_decisions:
- issue: नपुंसकलिंग तुलनात्मक μεῖζόν का अनकहा संदर्भ
  choice: मुख्य पाठ में ‘कुछ बड़ा’
  alternative: ‘कोई बड़ा’ अथवा ‘एक ऐसा व्यक्ति जो मंदिर से बड़ा है’
  rationale: यूनानी पाठ नपुंसकलिंग रूप प्रयोग करता है और संदर्भ को स्पष्ट नाम नहीं देता। प्रसंग यीशु और उनके अधिकार की ओर संकेत करता है, पर अनुवाद में उसे व्याकरण से अधिक स्पष्ट करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक शैली। ‘तुमसे’ बहुवचन श्रोताओं के लिए सामान्य बाइबलीय संबोधन है।
