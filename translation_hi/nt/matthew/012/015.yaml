source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: hi
  text: परन्तु यीशु यह[a] जानकर वहाँ से चले गए। बहुत-से लोग उनके पीछे हो लिए, और उन्होंने उन सबको चंगा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘जानकर’ का कर्म स्पष्ट नहीं है; संदर्भ पिछले पद में वर्णित बात की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: यह जानकर
  rationale: एओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई जानकारी को सूचित करता है। यूनानी में कर्म निहित है; ‘यह’ पिछले पद में वर्णित फरीसियों की योजना की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: ἀνεχώρησεν
  choice: हट गए
  rationale: मत्ती में यह क्रिया विरोध या खतरे के सामने उस स्थान से उद्देश्यपूर्ण ढंग से चले जाने का भाव रखती है। ‘हट गए’ इस अर्थ को सहज हिन्दी में व्यक्त करता है, बिना भय का भाव जोड़े।
- source_word: ἐκεῖθεν
  choice: वहाँ से
  rationale: किसी स्थान से दूर जाने का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: बहुत-से लोग उनके पीछे हो लिए
  rationale: πολλοί का अर्थ केवल ‘बहुत-से’ है, अनिवार्यतः ‘भीड़’ नहीं। ‘पीछे हो लिए’ कथा-संदर्भ में अनुसरण का स्वाभाविक हिन्दी प्रयोग है।
- source_word: ἐθεράπευσεν
  choice: चंगा किया
  rationale: सुसमाचारों में θεραπεύω रोगों को ठीक करने के लिए प्रयुक्त है; ‘चंगा किया’ हिन्दी बाइबलीय भाषा में स्पष्ट, परिचित और गरिमापूर्ण है।
- source_word: αὐτοὺς πάντας
  choice: उन सबको
  rationale: यह πάντας की समावेशी शक्ति को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: γνοὺς का निहित कर्म
  choice: ‘यह जानकर’, जो पिछले पद में बताई गई विरोधी योजना की ओर संकेत करता है
  alternative: ‘जानकर’ अथवा ‘इस बात का पता चलने पर’
  rationale: मूल यूनानी इस पद में जानने का कर्म स्पष्ट नहीं करता। ‘यह’ निकटवर्ती संदर्भ से संबंध दिखाता है, पर योजना का विवरण पद में जोड़कर अस्पष्टता को आवश्यकता से अधिक नहीं खोलता।
- issue: यीशु के चले जाने का भाव
  choice: हट गए
  alternative: चले गए; वहाँ से निकल गए
  rationale: अनुवाद को न तो भय या कायरता का संकेत देना चाहिए, न क्रिया को पूरी तरह तटस्थ बनाना चाहिए। ‘हट गए’ विरोध के प्रत्युत्तर में उद्देश्यपूर्ण प्रस्थान का भाव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, संक्षिप्त और गरिमापूर्ण कथात्मक शैली। ‘परन्तु’ विरोधसूचक δέ को व्यक्त करता है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘यह’ का संदर्भ पिछले पद से स्पष्ट है और पाठ में निहित कर्म को न्यूनतम रूप से ही प्रकट करता है।
