  verdict: revise
  source_fidelity: The rebuke, rhetorical question, moral force of πονηροί, and the heart–speech connection are conveyed accurately. However, “हृदय में जो भरा है” weakens περισσεύματος (“abundance/overflow”), which specifically denotes what is in excess or fills to overflowing.
  naturalness: The Hindi is modern and readable. “हृदय की भरपूरी से मुँह बोलता है” is both idiomatic enough in a biblical register and closer to the Greek image than the draft’s paraphrase.
  terminology: “विषधर साँपों की संतान,” “भली बातें,” “बुरे,” and “हृदय” are suitable equivalents. The revised footnote preserves a genuine lexical alternative for γεννήματα ἐχιδνῶν, while the second preserves “बहुतायत” as an alternative for περισσεύματος.
  issues:
