    issue: The main rendering of περισσεύματος lacks the abundance/overflow component.
    rationale: “हृदय में जो भरा है” can refer simply to any content within the heart. The Greek genitive τοῦ περισσεύματος denotes abundance, surplus, or overflow; this image should be retained in the main text rather than only in a note.
  - severity: low
