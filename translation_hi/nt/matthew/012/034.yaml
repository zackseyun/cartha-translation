source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: hi
  text: हे विषधर साँपों की संतान[a], तुम बुरे होकर भली बातें कैसे कह सकते हो? क्योंकि हृदय की भरपूरी से मुँह बोलता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे साँपों के बच्चो।”
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि हृदय की बहुतायत में से मुँह बोलता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: विषधर साँपों की संतान
  rationale: γέννημα उत्पन्न संतान को और ἔχιδνα विषैले साँप को दर्शाता है। यह चयन वंश और चरित्र की तीखी रूपकात्मक छवि बनाए रखता है तथा आधुनिक हिन्दी में समझने योग्य है।
- source_word: πῶς δύνασθε
  choice: कैसे कह सकते हो
  rationale: यह प्रश्न वास्तविक जानकारी नहीं माँगता, बल्कि नैतिक असंगति और असमर्थता को तीखे आलंकारिक प्रश्न के रूप में व्यक्त करता है।
- source_word: ἀγαθὰ λαλεῖν
  choice: भली बातें कह
  rationale: ἀγαθά यहाँ संज्ञा के रूप में प्रयुक्त बहुवचन है। “भली बातें” उसके नैतिक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πονηροὶ ὄντες
  choice: बुरे होकर
  rationale: कृदन्तीय रचना बोलने वालों की वर्तमान नैतिक दशा को प्रश्न की परिस्थिति के रूप में प्रस्तुत करती है। “बुरे होकर” इसे संक्षिप्त और स्पष्ट रखता है।
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: क्योंकि हृदय में जो भरा है
  rationale: περίσσευμα भरपूरी, बहुतायत या उमड़ने वाली अधिकता का बोध देता है। हिन्दी में यह वाक्यांश भीतर की भरपूरी से बाहर आने वाली वाणी की छवि को सहज ढंग से व्यक्त करता है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: τὸ στόμα λαλεῖ
  choice: वही मुँह से निकलता है
  rationale: यूनानी में शाब्दिक रूप से “मुँह बोलता है” है। हिन्दी मुहावरे में बात का “मुँह से निकलना” स्वाभाविक है और हृदय की भीतरी भरपूरी से वाणी के बाहर आने का संबंध स्पष्ट करता है।
theological_decisions:
- issue: καρδία का रूपकात्मक अर्थ
  choice: हृदय
  alternative: मन; अंतरात्मा; भीतरी व्यक्तित्व
  rationale: “हृदय” बाइबलीय प्रयोग में विचार, इच्छा और नैतिक प्रवृत्ति सहित मनुष्य के भीतरी केंद्र को व्यक्त कर सकता है। इसे बनाए रखने से अर्थ केवल भावना या बुद्धि तक सीमित नहीं होता।
- issue: πονηροί का नैतिक भार
  choice: बुरे
  alternative: दुष्ट
  rationale: यहाँ स्पष्ट नैतिक निंदा है। “बुरे” आधुनिक सामान्य हिन्दी में मूल अर्थ को सीधे व्यक्त करता है, जबकि “दुष्ट” प्रसंग से अधिक तीव्र या चरित्र-विशेषक सुनाई दे सकता है।
- issue: भीतर और वाणी का संबंध
  choice: हृदय की भरपूरी से वाणी निकलने की कारणात्मक छवि बनाए रखी गई
  alternative: वचन को केवल भावनाओं की अभिव्यक्ति के रूप में समझाना
  rationale: मूल पाठ बाहरी वाणी को भीतर की नैतिक भरपूरी से जोड़ता है, पर यह अलग से कोई विस्तृत मनोवैज्ञानिक या सिद्धान्तगत व्याख्या नहीं देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। संबोधन में “हे” मूल के प्रत्यक्ष और तीखे सम्बोधन को दर्शाता है। “भली बातें” और “मुँह से निकलता है” सामान्य पाठक के लिए सहज हैं, जबकि पादटिप्पणियाँ रूपक के वैकल्पिक तथा अधिक शाब्दिक रूप सुरक्षित रखती हैं।
