id: MAT.12.7
reference: Matthew 12:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: hi
  text: पर यदि तुमने इसका अर्थ समझा होता, ‘मैं दया चाहता हूँ, बलिदान नहीं,’[a] तो तुम निर्दोषों[b] को दोषी न ठहराते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यीशु यहाँ होशे 6:6 उद्धृत करते हैं।
    reason: cross_reference
  - marker: b
    text: या ‘निरपराधों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: तुमने ... समझा होता
  rationale: अपूर्ण भूतकालीन अवास्तविक शर्त को स्वाभाविक हिन्दी में व्यक्त करता है और केवल जानकारी नहीं, उद्धृत वचन का अर्थ समझने पर बल देता है।
- source_word: τί ἐστιν
  choice: इसका अर्थ
  rationale: उद्धरण की भूमिका में इसका आशय ‘इसका क्या अर्थ है’ है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: Ἔλεος
  choice: दया
  rationale: ἔλεος का सामान्य, गरिमापूर्ण और संदर्भानुकूल हिन्दी प्रतिशब्द है, जो करुणामय व्यवहार को व्यक्त करता है।
- source_word: θέλω
  choice: मैं ... चाहता हूँ
  rationale: θέλω के सीधे अर्थ को सहज आधुनिक हिन्दी में रखता है; भविष्यवाणी के कथन की गंभीरता भी बनी रहती है।
- source_word: θυσίαν
  choice: बलिदान
  rationale: धार्मिक अर्पण के अर्थ में θυσία का प्रचलित और सटीक प्रतिशब्द है।
- source_word: κατεδικάσατε
  choice: दोषी न ठहराते
  rationale: न्यायिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और ἀναιτίους के साथ मूल का दोष/निर्दोष शब्द-संबंध बनाए रखता है।
- source_word: ἀναιτίους
  choice: निर्दोषों
  rationale: कानूनी आशय सहित ‘जिन पर दोष नहीं’ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: होशे 6:6 के उद्धरण में दया और बलिदान का तीखा विरोध
  choice: ‘मैं दया चाहता हूँ, बलिदान नहीं’
  alternative: ‘मैं दया को बलिदान से अधिक चाहता हूँ’
  rationale: यूनानी पाठ के स्पष्ट विरोध को ज्यों का त्यों रखा गया है। ‘से अधिक’ जोड़कर कथन की धार को व्याख्यात्मक रूप से नरम नहीं किया गया, न ही इससे बलिदान के विषय में कोई व्यापक धर्मवैधानिक निष्कर्ष आरोपित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। अवास्तविक शर्त के लिए ‘समझा होता ... न ठहराते’ रखा गया है। उद्धरण की तीक्ष्णता और न्यायिक शब्दावली दोनों सुरक्षित हैं।
