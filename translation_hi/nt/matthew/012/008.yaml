  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: hi
  text: क्योंकि मनुष्य का पुत्र सब्त का प्रभु है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य का पुत्र सब्त पर स्वामी है।”
    reason: lexical_alternative
  - marker: b
    text: “मनुष्य का पुत्र” सुसमाचारों में यीशु का विशिष्ट आत्म-संबोधन है। इसे अधिक सामान्य अर्थ में “वह मनुष्य” भी समझा जा सकता है, पर ऐसा करने से इसके संभावित उपाधिसूचक अर्थ की गूँज कमजोर पड़ती है।
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन के आधार या स्पष्टीकरण को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: κύριος
  choice: प्रभु
  rationale: यह अधिकार के प्रबल भाव और इस मसीही कथन के धर्मवैचारिक वजन—दोनों को बनाए रखता है।
- source_word: τοῦ σαββάτου
  choice: सब्त का
  rationale: κύριος के साथ यूनानी संबंधकारक को सीधे और स्वाभाविक ढंग से व्यक्त करता है; यह यहूदी पवित्र विश्राम-दिन और उससे जुड़ी व्यवस्था को सूचित करता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: सुसमाचारों में यीशु के विशिष्ट आत्म-संबोधन को सुरक्षित रखता है और इसके संभावित दानिय्येली प्रतिध्वनि को किसी सामान्य मानव-सूचक अभिव्यक्ति में समतल नहीं करता।
- source_word: ἐστιν
  choice: है
  rationale: साधारण वर्तमानकालीन संयोजक क्रिया का सीधा हिन्दी रूप।
theological_decisions:
- issue: κύριος ... τοῦ σαββάτου में मसीही अधिकार का भाव
  choice: मनुष्य का पुत्र सब्त का प्रभु है
  alternative: मनुष्य का पुत्र सब्त पर स्वामी है
  rationale: ‘प्रभु’ अधिकार और धर्मवैचारिक वजन को बनाए रखता है, जबकि पद में कही गई बात से आगे कोई अतिरिक्त दावा नहीं जोड़ता।
- issue: ὁ υἱὸς τοῦ ἀνθρώπου का स्वरूप
  choice: इसे उपाधिसदृश आत्म-संबोधन ‘मनुष्य का पुत्र’ के रूप में रखना
  alternative: मानव जन / वह मनुष्य
  rationale: पारंपरिक अभिव्यक्ति सुसमाचारों के अंतर्पाठीय और संभावित प्रकाशनात्मक अर्थ-संकेतों को सुरक्षित रखती है; सामान्यीकृत अनुवाद इन संकेतों को कमजोर कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘सब्त’ बाइबलीय-यहूदी संस्था के प्रचलित नाम के रूप में रखा गया है।
