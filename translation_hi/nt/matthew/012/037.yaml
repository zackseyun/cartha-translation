  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: hi
  text: क्योंकि तुम्हारे शब्दों के आधार पर तुम निर्दोष ठहराए जाओगे[a], और तुम्हारे शब्दों के आधार पर तुम दोषी ठहराए जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुम सही ठहराए जाओगे’ अथवा ‘तुम निर्दोष घोषित किए जाओगे।’ यूनानी क्रिया का न्यायिक अर्थ किसी को सही पक्ष में या निर्दोष घोषित करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: के आधार पर
  rationale: संबंधकारक के साथ ἐκ यहाँ निर्णय के आधार या प्रमाण को दर्शाता है। ‘के आधार पर’ आधुनिक हिन्दी में स्वाभाविक है और यह स्पष्ट करता है कि व्यक्ति के शब्द न्याय में प्रमाण बनते हैं।
- source_word: γάρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संयोजक संबंध को सहज रूप से व्यक्त करता है।
- source_word: λόγων
  choice: शब्दों
  rationale: बहुवचन λόγων यहाँ बोले गए कथनों को सूचित करता है। ‘शब्दों’ सीधा और स्वाभाविक अनुवाद है तथा दोनों खंडों की समानांतर पुनरावृत्ति बनाए रखता है।
- source_word: σου
  choice: अपने
  rationale: यूनानी में द्वितीय पुरुष एकवचन संबंधकारक सर्वनाम दोनों बार ‘तुम्हारे’ का अर्थ देता है। हिन्दी में वाक्य के कर्ता से संबंध स्पष्ट होने के कारण ‘अपने’ अधिक स्वाभाविक है।
- source_word: δικαιωθήσῃ
  choice: तुम निर्दोष ठहराए जाओगे
  rationale: δικαιόω का भविष्यत् कर्मवाच्य रूप इस न्यायिक संदर्भ में किसी को सही पक्ष में या निर्दोष घोषित किए जाने का भाव देता है। ‘निर्दोष ठहराए जाओगे’ न्यायालयीन विरोध को स्पष्ट रखते हुए सहज हिन्दी प्रदान करता है।
- source_word: καταδικασθήσῃ
  choice: तुम दोषी ठहराए जाओगे
  rationale: καταδικάζω का भविष्यत् कर्मवाच्य रूप न्यायिक दोषनिर्णय को व्यक्त करता है। ‘दोषी ठहराए जाओगे’ पहले खंड के साथ स्पष्ट और संतुलित विरोध बनाता है।
theological_decisions:
- issue: वाणी और न्याय के संदर्भ में δικαιόω का न्यायिक अर्थ
  choice: ‘निर्दोष ठहराए जाओगे’—अर्थात व्यक्ति के शब्दों के आधार पर न्याय में उसके पक्ष में निर्णय होगा।
  alternative: ‘धर्मी ठहराए जाओगे’ या ‘सही ठहराए जाओगे’
  rationale: καταδικασθήσῃ (‘दोषी ठहराए जाओगे’) के साथ सीधा विरोध न्यायिक संदर्भ को प्रमुख बनाता है। ‘निर्दोष’ उस अर्थ को सामान्य पाठक के लिए स्पष्ट करता है, जबकि पादटिप्पणी मूल क्रिया की ‘धर्मी/सही ठहराए जाने’ की व्यापक सम्भावना सुरक्षित रखती है और पद में कोई विस्तृत धार्मिक सिद्धान्त नहीं जोड़ती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। दोनों खंडों की यूनानी समानांतर संरचना को ‘अपने शब्दों के आधार पर’ की पुनरावृत्ति से बनाए रखा गया है; दूसरे खंड में ‘ही’ विरोध और बल को स्वाभाविक हिन्दी में उभारता है।
