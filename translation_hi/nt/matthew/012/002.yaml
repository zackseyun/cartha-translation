id: MAT.12.2
reference: Matthew 12:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: hi
  text: लेकिन फ़रीसियों ने यह देखकर उससे कहा, “देखिए, आपके शिष्य वह काम कर रहे हैं जिसे सब्त के दिन करने की अनुमति नहीं है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो सब्त के दिन करना अनुमत नहीं है।”
    reason: ἔξεστιν के अनुमति अथवा वैधता-संबंधी अर्थ का वैकल्पिक हिन्दी रूप।
lexical_decisions:
- source_word: δὲ
  choice: लेकिन
  rationale: यह पिछले वर्णन के साथ विरोध का संकेत देता है; आधुनिक हिन्दी में “लेकिन” इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἰδόντες
  choice: यह देखकर
  rationale: अओरिस्ट कृदन्त को समयसूचक रूप में प्रस्तुत किया गया है। “यह” पिछले पद में वर्णित शिष्यों के काम की ओर संकेत करता है, जो यूनानी में प्रसंग से निहित है।
- source_word: εἶπαν αὐτῷ
  choice: उससे कहा
  rationale: यह यूनानी के सामान्य और तटस्थ कथन-सूत्र का सीधा हिन्दी रूप है।
- source_word: Ἰδοὺ
  choice: देखिए
  rationale: यह ध्यान खींचने वाला उद्गार है। “देखिए” आधुनिक हिन्दी में उसका बल बनाए रखता है और अनावश्यक रूप से पुरातन नहीं लगता।
- source_word: μαθηταί
  choice: शिष्य
  rationale: सुसमाचारों में यह शब्द गुरु-शिष्य संबंध को सटीक और प्रचलित ढंग से व्यक्त करता है।
- source_word: ποιοῦσιν ... ποιεῖν
  choice: काम कर रहे हैं ... करने
  rationale: अनुवाद में ποιέω की पुनरावृत्ति यथासंभव बनाए रखी गई है, पर हिन्दी की स्वाभाविकता के लिए पहले प्रयोग के साथ “काम” जोड़ा गया है।
- source_word: ὃ οὐκ ἔξεστιν
  choice: जिसे ... करने की अनुमति नहीं है
  rationale: ἔξεστιν मूलतः अनुमति या वैधता व्यक्त करता है। यह रूप आपत्ति को स्पष्ट रखता है, पर यह तय नहीं करता कि निषेध का आधार मूसा की व्यवस्था है या फ़रीसी व्याख्या।
- source_word: ἐν σαββάτῳ
  choice: सब्त के दिन
  rationale: समयवाचक ἐν को हिन्दी में स्वाभाविक रूप से “के दिन” कहा गया है; “सब्त” उस धार्मिक दिन के लिए स्थापित पद है।
theological_decisions:
- issue: फ़रीसियों की आपत्ति का स्वरूप
  choice: 'ἔξεστιν को अनुमति-संबंधी भाषा में प्रस्तुत किया गया है: “करने की अनुमति नहीं है।”'
  alternative: “करना उचित नहीं है” या “करना व्यवस्था के विरुद्ध है।”
  rationale: पद आरोप को दर्ज करता है, लेकिन न तो उसकी सत्यता का निर्णय करता है और न निषेध के सटीक कानूनी स्रोत को बताता है। इसलिए अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और सम्मानपूर्ण रखी गई है। “देखिए, आपके शिष्य” हिन्दी में स्वाभाविक संबोधन है और यूनानी पाठ में निहित किसी अतिरिक्त अपमानजनक भाव को नहीं जोड़ता।
