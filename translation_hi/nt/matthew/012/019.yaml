  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: hi
  text: वह न झगड़ा करेगा, न चिल्लाएगा,[a] और न कोई सड़कों पर उसकी आवाज़ सुनेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह न विवाद करेगा, न ऊँची पुकार लगाएगा, और न कोई उसकी आवाज़ सार्वजनिक चौकों में सुनेगा।”
    reason: ἐρίζω, κραυγάζω और πλατεῖαι के मान्य वैकल्पिक अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐρίσει
  choice: झगड़ा करेगा
  rationale: ἐρίζω का अर्थ विवाद या झगड़े में पड़ना है। ‘झगड़ा करेगा’ आधुनिक हिन्दी में स्वाभाविक है और सेवक के अविवादी स्वभाव को व्यक्त करता है।
- source_word: κραυγάσει
  choice: चिल्लाएगा
  rationale: κραυγάζω ऊँची आवाज़ में पुकारने या चिल्लाने को दर्शाता है। यहाँ ‘चिल्लाएगा’ सार्वजनिक शोर और आत्म-प्रदर्शन के अभाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀκούσει τις
  choice: न कोई … सुनेगा
  rationale: नकारात्मक οὐδέ के साथ अनिश्चित τις का स्वाभाविक हिन्दी रूप ‘न कोई … सुनेगा’ है।
- source_word: ἐν ταῖς πλατείαις
  choice: गलियों में
  rationale: πλατεῖαι सार्वजनिक चौड़े मार्गों या सड़कों को सूचित करता है। ‘गलियों में’ परिचित बाइबलीय हिन्दी है; ‘सार्वजनिक चौकों में’ संभावित अधिक विशिष्ट विकल्प के रूप में पाद-टिप्पणी में रखा गया है।
- source_word: φωνὴν αὐτοῦ
  choice: उसकी आवाज़
  rationale: φωνή का इस प्रसंग में सीधा और स्पष्ट अर्थ ‘आवाज़’ है।
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: न…न…और न
  rationale: यह रचना यूनानी के क्रमिक त्रिविध निषेध को स्वाभाविक आधुनिक हिन्दी में बनाए रखती है।
theological_decisions:
- issue: यशायाह के सेवक-वचन में मसीह के आचरण का चित्रण
  choice: पद मसीह को झगड़े से दूर और सार्वजनिक शोर द्वारा अपना प्रदर्शन न करने वाले के रूप में चित्रित करता है।
  alternative: इसे अधिक शाब्दिक रूप से ‘न संघर्ष करेगा, न ऊँची पुकार लगाएगा’ कहा जा सकता है।
  rationale: अनुवाद को सेवक के नम्र, गैर-टकरावपूर्ण आचरण को व्यक्त करना चाहिए, पर इससे यह निष्कर्ष नहीं निकालना चाहिए कि वह कभी सार्वजनिक रूप से बोलेगा ही नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘झगड़ा करेगा’ सामान्य पाठक के लिए स्पष्ट है; ‘ऊँची पुकार’ और ‘सार्वजनिक चौक’ जैसे अधिक औपचारिक विकल्प पाद-टिप्पणी में दिए गए हैं।
