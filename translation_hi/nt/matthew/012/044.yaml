id: MAT.12.44
reference: Matthew 12:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: hi
  text: तब वह कहती है, ‘मैं अपने उस घर में लौट जाऊँगी, जहाँ से मैं निकली थी।’ और वहाँ पहुँचकर वह उसे खाली[a], बुहारा हुआ और सुव्यवस्थित[b] पाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘रिक्त’।
    reason: lexical_alternative
  - marker: b
    text: या ‘सजा हुआ’।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε λέγει
  choice: तब वह कहती है
  rationale: τότε क्रम में अगली घटना बताता है; λέγει का वर्तमान काल सजीव कथन को बनाए रखता है। संदर्भ में कर्ता ‘अशुद्ध आत्मा’ है, जो हिन्दी में स्त्रीलिंग है।
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: मैं अपने उस घर में लौट जाऊँगी
  rationale: ἐπιστρέψω भविष्यकाल में लौटने का निश्चय व्यक्त करता है। ‘अपने ... घर’ आत्मा के स्वामित्व-दावे को बनाए रखता है; ‘उस’ आगे आने वाले संबंधवाचक उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: ὅθεν ἐξῆλθον
  choice: जहाँ से मैं निकली थी
  rationale: ὅθεν स्रोत-स्थान और ἐξῆλθον बाहर निकलने को व्यक्त करता है। पूर्व घटना के लिए हिन्दी का पूर्ण भूतकाल स्वाभाविक है।
- source_word: ἐλθὸν εὑρίσκει
  choice: वहाँ पहुँचकर वह ... पाती है
  rationale: अग्रवर्ती एओरिस्ट कृदंत के बाद मुख्य क्रिया की घटना-श्रृंखला को स्वाभाविक हिन्दी में रखा गया है, जबकि εὑρίσκει का सजीव वर्तमान ‘पाती है’ में सुरक्षित है।
- source_word: σχολάζοντα
  choice: खाली
  rationale: शब्द का अर्थ खाली, अव्यस्त या अनधिकृत/निर्वासी हो सकता है। घर के संदर्भ में ‘खाली’ सहज है, पर ‘निर्वासी’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: σεσαρωμένον
  choice: बुहारा हुआ
  rationale: पूर्ण निष्क्रिय कृदंत घर की पूरी की जा चुकी और बनी हुई अवस्था दिखाता है। ‘बुहारा हुआ’ मूल झाड़ने की ठोस छवि को रखता है।
- source_word: κεκοσμημένον
  choice: सुव्यवस्थित
  rationale: κοσμέω यहाँ व्यवस्थित करने या सजाने—दोनों अर्थ दे सकता है। ‘सुव्यवस्थित’ प्रसंग में संयत मुख्य पाठ है; सजावट वाला अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ‘घर’ का रूपकात्मक आशय
  choice: मुख्य पाठ में ‘घर’ को ज्यों का त्यों रखा गया है।
  alternative: जिस व्यक्ति को मैंने छोड़ा था
  rationale: पद स्वयं οἶκος, ‘घर’, कहता है। इसे सीधे ‘व्यक्ति’ या ‘जीवन’ कहना रूपक की व्याख्या को अनुवाद में मिला देगा।
- issue: σχολάζοντα में आध्यात्मिक रिक्तता का निहितार्थ
  choice: ‘खाली’ रखा गया है, बिना यह बताए कि घर किससे खाली है।
  alternative: परमेश्वर से खाली / आत्मिक रूप से खाली
  rationale: मूल शब्द रिक्त या अनधिकृत अवस्था बताता है, पर यह स्पष्ट नहीं करता कि किसकी अनुपस्थिति अभिप्रेत है; इसलिए धर्मवैज्ञानिक पूर्ति नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सजीव, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘अशुद्ध आत्मा’ के निहित कर्ता के कारण स्त्रीलिंग क्रियाएँ रखी गई हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
