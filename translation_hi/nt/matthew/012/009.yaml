  text: And departing from there, he went into their synagogue.
translation:
  language: hi
  text: और वहाँ से निकलकर वह उनके आराधनालय में गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: यह सामान्य संयोजक पिछले प्रसंग से कथा को जोड़ता है; ‘और’ बिना अतिरिक्त कालगत अर्थ जोड़े इसकी सरल संयोजक शक्ति बनाए रखता है।
- source_word: μεταβὰς
  choice: आगे बढ़कर
  rationale: μεταβαίνω का यह कृदन्त पिछले स्थान से दूसरे स्थान की ओर जाने को व्यक्त करता है। ‘आगे बढ़कर’ हिन्दी में स्वाभाविक है और मुख्य क्रिया से पहले की गति को बनाए रखता है।
- source_word: ἐκεῖθεν
  choice: वहाँ से
  rationale: यह स्थानवाचक क्रियाविशेषण पहले उल्लिखित स्थान से प्रस्थान को सीधे व्यक्त करता है।
- source_word: ἦλθεν
  choice: वह ... गया
  rationale: ἔρχομαι गति को व्यक्त करता है; इस कथात्मक संदर्भ में पिछले स्थान से नए स्थान की ओर बढ़ने के लिए हिन्दी में ‘गया’ अधिक स्वाभाविक है।
- source_word: εἰς τὴν συναγωγὴν
  choice: आराधनालय में
  rationale: εἰς के दिशात्मक भाव को हिन्दी का ‘में गया’ स्वाभाविक रूप से व्यक्त करता है; ‘आराधनालय’ इस यहूदी सभा और उपासना-स्थल के लिए प्रचलित हिन्दी बाइबलीय पद है।
- source_word: αὐτῶν
  choice: उनके
  rationale: बहुवचन सम्बन्धवाचक सर्वनाम को सीधे रखा गया है और उसके संकेतित समुदाय को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाया गया।
theological_decisions:
- issue: ‘उनके आराधनालय’ में ‘उनके’ का संदर्भ
  choice: ‘उनके आराधनालय’ के रूप में तटस्थ रखा गया।
  alternative: ‘उन यहूदियों के आराधनालय’ या ‘उनके सभा-स्थान’ के रूप में संदर्भ को स्पष्ट करना।
  rationale: यूनानी पाठ केवल αὐτῶν कहता है और किसी विरोधी या सम्प्रदायगत समूह को स्पष्ट रूप से निर्दिष्ट नहीं करता; इसलिए अनुवाद मूल की संदर्भगत अस्पष्टता और संभावित तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आगे बढ़कर’ कृदन्तीय संरचना को स्वाभाविक हिन्दी में बनाए रखता है, जबकि ‘आराधनालय’ यहूदी synagogue के लिए परिचित और प्रसंगानुकूल शब्द है।
