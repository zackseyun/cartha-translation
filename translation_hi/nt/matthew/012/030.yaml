  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: hi
  text: जो मेरे साथ नहीं है, वह मेरे विरुद्ध है; और जो मेरे साथ इकट्ठा नहीं करता, वह तितर-बितर करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: जो ... नहीं है
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत किसी भी ऐसे व्यक्ति को सूचित करता है जिसकी पहचान यीशु के साथ न होने से होती है। हिन्दी का ‘जो ... नहीं है’ सामान्य और स्वाभाविक है तथा अनावश्यक रूप से लिंग निर्दिष्ट नहीं करता।
- source_word: μετ’ ἐμοῦ
  choice: मेरे साथ
  rationale: सम्बन्ध और पक्षधरता—दोनों की सम्भावना बनाए रखते हुए यह μετά के सामान्य अर्थ का सीधा और स्वाभाविक अनुवाद है।
- source_word: κατ’ ἐμοῦ
  choice: मेरे विरुद्ध
  rationale: κατά यहाँ विरोध व्यक्त करता है। ‘मेरे विरुद्ध’ स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: συνάγων
  choice: इकट्ठा करता
  rationale: यह क्रिया साथ लाने या एकत्र करने की क्रिया बताती है। ‘इकट्ठा करता’ आधुनिक सामान्य हिन्दी में सहज है और सम्भावित चरवाही या कटनी के बिम्ब को किसी एक अर्थ तक सीमित नहीं करता।
- source_word: σκορπίζει
  choice: तितर-बितर करता है
  rationale: यह ‘इकट्ठा करने’ के विपरीत बिखेरने या छितराने को व्यक्त करता है। ‘तितर-बितर करता है’ हिन्दी में इस विरोध को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: καὶ
  choice: और
  rationale: यह संयोजक दो समानान्तर कथनों को जोड़ता है; ‘और’ मूल के योगात्मक सम्बन्ध को बनाए रखता है।
theological_decisions:
- issue: यीशु के साथ होने या उनके विरुद्ध होने का निरपेक्ष विरोध
  choice: कथन को बिना नरम किए स्पष्ट द्विभाजन के रूप में रखा गया है।
  alternative: ऐसा भावानुवाद जो विरोध की तीव्रता को कम कर दे।
  rationale: यूनानी पाठ में कोई शमनकारी भाषा नहीं है। अनुवाद इस धर्मवैचारिक तनाव को बनाए रखता है और उससे आगे कोई साम्प्रदायिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। समानान्तर वाक्य-रचना तथा ‘इकट्ठा’/‘तितर-बितर’ का विरोध सुरक्षित रखा गया है।
