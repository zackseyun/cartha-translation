  source_fidelity: The draft accurately conveys the moral characterization, the request for a sign, the future passive denial, and the exclusive exception of Jonah's sign. However, Greek καί joins the clauses ('and'), whereas Hindi 'पर' introduces a contrast not expressed in the source.
  naturalness: The Hindi is generally clear and suitably dignified. 'भविष्यद्वक्ता योना' is the more natural modern Hindi order, and omission of the unnecessary 'एक' makes the collective indictment read more idiomatically.
  terminology: '''दुष्ट,'' ''व्यभिचारी,'' ''पीढ़ी,'' and ''चिन्ह'' are appropriate, preserving both the force and the unresolved prophetic resonance of μοιχαλὶς and the breadth of σημεῖον. The footnotes appropriately retain the metaphorical dimension and the alternative word order without interpreting Jonah''s sign.'
  issues:
  - severity: medium
    issue: ‘पर’ renders Greek καί as contrastive.
    rationale: The source says that the generation seeks a sign and that no sign will be given except Jonah's; it does not use an adversative conjunction. ‘और’ preserves the source connection without adding contrast.
  - severity: low
    issue: Word order in ‘योना भविष्यद्वक्ता’ is less natural in modern standard Hindi.
    rationale: ‘भविष्यद्वक्ता योना’ is idiomatic Hindi and corresponds equally to Ἰωνᾶ τοῦ προφήτου. The alternative order can be retained in the lexical footnote.
