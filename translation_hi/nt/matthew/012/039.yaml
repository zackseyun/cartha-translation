id: MAT.12.39
reference: Matthew 12:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: hi
  text: पर उसने उन्हें उत्तर दिया, “दुष्ट और व्यभिचारी[a] पीढ़ी चिन्ह खोजती है, और उसे भविष्यद्वक्ता योना के चिन्ह[b] के सिवा कोई चिन्ह नहीं दिया जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “व्यभिचारी” शब्द संभवतः वास्तविक यौन अनैतिकता के साथ-साथ वाचा के प्रति बेवफाई का भाव भी जगाता है; भविष्यद्वक्ताओं के लेखों में आध्यात्मिक विश्वासघात के लिए व्यभिचार की उपमा मिलती है।
    reason: cross_reference
  - marker: b
    text: या “योना भविष्यद्वक्ता के चिन्ह।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: उत्तर दिया
  rationale: यह कृदंत और मुख्य क्रिया से बनी प्रचलित कथात्मक अभिव्यक्ति है। हिन्दी में “उत्तर दिया” दोनों तत्वों का स्वाभाविक अर्थ व्यक्त करता है; “उत्तर देकर कहा” यहाँ अनावश्यक रूप से भारी लगता।
- source_word: Γενεὰ
  choice: पीढ़ी
  rationale: यह एक ही समय के लोगों के उस सामूहिक वर्ग को दर्शाता है जिसकी नैतिक दशा पर टिप्पणी की गई है। “पीढ़ी” मूल के एकवचन और सामूहिक भाव को बनाए रखती है।
- source_word: πονηρὰ
  choice: दुष्ट
  rationale: यह नैतिक बुराई की स्पष्ट और गंभीर निंदा व्यक्त करने वाला स्वाभाविक हिन्दी शब्द है।
- source_word: μοιχαλὶς
  choice: व्यभिचारी
  rationale: शब्द का सीधा संबंध व्यभिचार से है और भविष्यद्वक्ताओं की भाषा में यह परमेश्वर के प्रति वाचा-विहीनता को भी जगा सकता है। “व्यभिचारी” रूपक की धार को बनाए रखता है, जबकि केवल “विश्वासघाती” कहना अर्थ को पहले ही व्याख्यायित कर देता।
- source_word: σημεῖον
  choice: चिन्ह
  rationale: यह शब्द प्रमाण देने वाली घटना और आगे आने वाले योना-संबंधी संकेत—दोनों के लिए पर्याप्त व्यापक है। मूल में निहित न होने के कारण “चमत्कारी चिन्ह” नहीं जोड़ा गया।
- source_word: ἐπιζητεῖ
  choice: खोजती है
  rationale: यह क्रिया की सीधी अभिव्यक्ति है। प्रसंग आग्रहपूर्ण माँग का भाव दे सकता है, पर “माँगती है” कहने से मूल की संभावित व्यापकता घट जाती।
- source_word: δοθήσεται
  choice: दिया जाएगा
  rationale: यूनानी भविष्यत् कर्मवाच्य का स्वाभाविक हिन्दी रूप।
- source_word: αὐτῇ
  choice: उसे
  rationale: स्त्रीलिंग एकवचन सर्वनाम का पूर्वपद “पीढ़ी” है। हिन्दी में “उसे” इस संबंध को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰ μὴ
  choice: के सिवा
  rationale: नकारात्मक वाक्य में यह अपवाद को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: योना भविष्यद्वक्ता का चिन्ह
  rationale: यह मूल पदबंध के संबंध को बनाए रखते हुए हिन्दी में स्वाभाविक है और चिन्ह का स्वरूप समय से पहले नहीं समझाता।
theological_decisions:
- issue: यीशु द्वारा “व्यभिचारी” कहे जाने का आशय
  choice: मुख्य पाठ में रूपकात्मक और भविष्यद्वक्ताओं की परंपरा से जुड़ा “व्यभिचारी” रखा गया।
  alternative: विश्वासघाती
  rationale: यूनानी शब्द वास्तविक यौन अनैतिकता की निंदा और वाचा के प्रति आध्यात्मिक बेवफाई—दोनों की प्रतिध्वनि जगा सकता है। अनुवाद को इनमें से केवल एक अर्थ तक सीमित नहीं करना चाहिए।
- issue: “योना भविष्यद्वक्ता का चिन्ह” किस प्रकार का चिन्ह है
  choice: पदबंध को उसके शाब्दिक संबंध तक सीमित रखा गया और मुख्य पाठ में उसका स्वरूप नहीं समझाया गया।
  alternative: योना के अनुभव जैसा चिन्ह; स्वयं योना के रूप में चिन्ह
  rationale: इस कथन का विस्तृत आशय अगले प्रसंग में खुलता है। इस पद में किसी एक व्याख्या को जोड़ना मूल से अधिक निश्चित हो जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “उत्तर देकर कहा” जैसे शाब्दिक किंतु भारी ढाँचे के स्थान पर स्वाभाविक “उत्तर दिया” चुना गया है। “चिन्ह,” “पीढ़ी,” और “व्यभिचारी” जैसे प्रमुख बाइबलीय शब्द मूल की व्यापकता और अंतर्पाठीय प्रतिध्वनि बनाए रखते हैं।
