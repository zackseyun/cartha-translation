  to: पर उसने उन्हें उत्तर दिया, “दुष्ट और व्यभिचारी[a] पीढ़ी चिन्ह खोजती है, और उसे भविष्यद्वक्ता योना के चिन्ह[b] के सिवा कोई चिन्ह नहीं दिया जाएगा।”
