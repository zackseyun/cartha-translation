reference: Matthew 12:38
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: hi
  text: तब कुछ शास्त्रियों और फरीसियों ने उसे उत्तर दिया, “गुरु, हम आपसे एक चिन्ह[a] देखना चाहते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “चमत्कारी चिन्ह।” यूनानी शब्द किसी चमत्कारी महत्त्व वाले चिन्ह को भी दर्शा सकता है, पर मुख्य पाठ में उसका व्यापक अर्थ “चिन्ह” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह कथा में अगले प्रसंग को प्रस्तुत करने वाला स्वाभाविक कालवाचक शब्द है।
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: उसे उत्तर दिया
  rationale: यद्यपि ठीक पहले कोई प्रत्यक्ष प्रश्न नहीं है, यूनानी क्रिया कथा-वर्णन में ‘उत्तर देना’ या ‘प्रतिक्रिया देना’ अर्थ रख सकती है; यह अनुवाद मूल मुहावरे को बनाए रखता है।
- source_word: τινες τῶν γραμματέων καὶ Φαρισαίων
  choice: कुछ शास्त्रियों और फरीसियों
  rationale: τινες बताता है कि बात इन समूहों के कुछ लोगों की है, सभी की नहीं। ‘शास्त्री’ और ‘फरीसी’ सुसमाचारों के संदर्भ में प्रचलित और संक्षिप्त पद हैं।
- source_word: λέγοντες
  choice: '[प्रत्यक्ष कथन द्वारा व्यक्त]'
  rationale: हिन्दी में ‘उत्तर दिया’ के बाद सीधे उद्धरण देना स्वाभाविक है; अलग से ‘कहते हुए’ जोड़ना अनावश्यक पुनरुक्ति पैदा करता।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: सम्बोधन के रूप में यह διδάσκαλος के ‘शिक्षक’ अर्थ को स्वाभाविक, संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: θέλομεν
  choice: हम ... चाहते हैं
  rationale: यह इच्छा या अभिलाषा को सीधी और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ σοῦ
  choice: आपसे
  rationale: ἀπό यहाँ चिन्ह के स्रोत को दर्शाता है। ‘आपसे’ स्वाभाविक हिन्दी में उसी स्रोत-संबंध को व्यक्त करता है।
- source_word: σημεῖον
  choice: एक चिन्ह
  rationale: मूल शब्द का व्यापक अर्थ ‘चिन्ह’ है। संदर्भ में चमत्कारी आशय संभव है, पर उसे मुख्य पाठ में स्पष्ट जोड़ देने से अर्थ अनावश्यक रूप से संकरा हो जाएगा।
- source_word: ἰδεῖν
  choice: देखना
  rationale: यह ὁράω के साधारण अर्थ को सीधे व्यक्त करता है और ‘साक्षी होना’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
theological_decisions:
- issue: σημεῖον की प्रकृति
  choice: मुख्य पाठ में ‘चिन्ह’
  alternative: ‘चमत्कारी चिन्ह’
  rationale: संदर्भ में यीशु से प्रमाणस्वरूप किसी अलौकिक कार्य की माँग निहित हो सकती है, पर यूनानी शब्द स्वयं केवल σημεῖον है। इसलिए व्यापक अर्थ मुख्य पाठ में रखा गया और संभावित चमत्कारी आशय पादटिप्पणी में बताया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। समूह-संज्ञाओं के लिए प्रचलित बाइबलीय पद ‘शास्त्री’ और ‘फरीसी’ रखे गए हैं। प्रत्यक्ष सम्बोधन में आदरसूचक ‘आपसे’ स्वाभाविक हिन्दी प्रयोग के अनुरूप है।
