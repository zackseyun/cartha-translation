id: MAT.17.12
reference: Matthew 17:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: hi
  text: पर मैं तुमसे कहता हूँ कि एलियाह पहले ही आ चुका है, और उन्होंने उसे पहचाना नहीं[a], बल्कि उसके साथ जो चाहा वही किया[b]। इसी प्रकार मनुष्य का पुत्र भी उनके हाथों दुःख उठाने वाला है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वे उसे जान न सके’ अथवा ‘उन्होंने उसे स्वीकार नहीं किया।’ यूनानी क्रिया का अर्थ किसी को ठीक से पहचानने या उसकी पहचान समझने में असफल होना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उन्होंने उसके विरुद्ध जो चाहा किया’ अथवा ‘उसके साथ जैसा चाहा वैसा व्यवहार किया।’ यूनानी अभिव्यक्ति मुहावरेदार है और उसके प्रति अपनी इच्छा के अनुसार बिना रोक-टोक किए गए व्यवहार को बताती है।
    reason: lexical_alternative
  - marker: c
    text: या ‘दुःख उठाने ही वाला है।’ यूनानी में आगामी या आसन्न दुःख पर बल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: पर मैं तुमसे कहता हूँ
  rationale: δέ पिछले कथन से विरोध या सुधार का संबंध जोड़ता है; ‘पर’ इसे स्वाभाविक हिंदी में व्यक्त करता है। λέγω ὑμῖν का सीधा और वर्तमान हिंदी रूप ‘मैं तुमसे कहता हूँ’ है।
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: एलियाह पहले ही आ चुका है
  rationale: ἤδη पूर्ण हो चुके आगमन पर बल देता है, और ἦλθεν का यहाँ वर्तमान संदर्भ से संबंध है; ‘पहले ही आ चुका है’ दोनों भावों को स्वाभाविक रूप से रखता है। नाम ‘एलियाह’ मूल रूप के निकट प्रचलित लिप्यंतरण है।
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: उन्होंने उसे पहचाना नहीं
  rationale: ἐπιγινώσκω यहाँ उसकी भूमिका या पहचान को ठीक से न पहचानने का अर्थ देता है, केवल व्यक्तिगत परिचय न होने का नहीं।
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: उसके साथ जो चाहा वही किया
  rationale: ποιέω ἐν किसी व्यक्ति के प्रति किए गए व्यवहार की मुहावरेदार अभिव्यक्ति है। हिंदी में ‘उसके साथ ... किया’ स्वाभाविक है और ὅσα ἠθέλησαν की निरंकुश इच्छा का भाव बनाए रखता है।
- source_word: οὕτως καὶ
  choice: इसी प्रकार ... भी
  rationale: यह एलियाह के साथ हुए व्यवहार और मनुष्य के पुत्र के आगामी दुःख के बीच समानता को स्पष्ट रूप से जोड़ता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह पदवी का स्थापित हिंदी रूप है और मूल अभिव्यक्ति के बाइबिलीय तथा दानिय्येली संकेतों को सुरक्षित रखता है।
- source_word: μέλλει πάσχειν
  choice: दुःख उठाने वाला है
  rationale: μέλλω + infinitive आगामी या आसन्न घटना व्यक्त करता है। ‘दुःख उठाने वाला है’ स्वाभाविक हिंदी में निकट भविष्य बताता है, पर मूल से अधिक प्रबल नियति का विचार नहीं जोड़ता।
- source_word: ὑπ’ αὐτῶν
  choice: उनके हाथों
  rationale: ὑπό संबंधकर्ता को दर्शाता है; दुःख के प्रसंग में ‘उनके हाथों’ विरोधी मानवीय कर्तृत्व को स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
theological_decisions:
- issue: एलियाह के आगमन की पहचान
  choice: मुख्य पाठ में केवल ‘एलियाह’ रखा गया है और उसे यूहन्ना बपतिस्मा देनेवाला कहकर स्पष्ट नहीं किया गया।
  alternative: संदर्भ के आधार पर यहाँ सीधे यूहन्ना बपतिस्मा देनेवाले का नाम जोड़ा जा सकता था।
  rationale: आस-पास का संदर्भ इस पहचान को स्पष्ट करता है, पर इस पद का यूनानी पाठ स्वयं ‘एलियाह’ कहता है। इसलिए पहचान को संदर्भ पर छोड़ा गया है, पाठ में व्याख्या नहीं जोड़ी गई।
- issue: μέλλει और मनुष्य के पुत्र का दुःख
  choice: ‘दुःख उठाने वाला है’ द्वारा आगामी दुःख व्यक्त किया गया है।
  alternative: ‘दुःख उठाना ही पड़ेगा’ या ‘दुःख उठाने के लिए नियत है।’
  rationale: इस वाक्यांश में दुःख का आगे होना या आसन्न होना व्यक्त है, पर यहाँ अपने आप में ईश्वरीय अनिवार्यता का स्पष्ट सूत्र नहीं दिया गया। इसलिए अनावश्यक रूप से नियति या बाध्यता नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पर’, ‘पहले ही आ चुका है’, और ‘उनके हाथों’ जैसे प्रयोग बोलचाल की स्वाभाविकता तथा बाइबिलीय गंभीरता के बीच संतुलन रखते हैं। सभी पाद-टिप्पणी चिह्न संबंधित शब्द-समूह के तुरंत बाद लगाए गए हैं।
