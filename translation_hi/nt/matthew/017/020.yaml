source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: hi
  text: वह उनसे कहता है, “तुम्हारे विश्वास की कमी के कारण। क्योंकि मैं तुमसे सच कहता हूँ, यदि तुम्हारा विश्वास राई के दाने जितना हो,[a] तो तुम इस पहाड़ से कहोगे, ‘यहाँ से वहाँ हट जा,’ और वह हट जाएगा; और तुम्हारे लिए कुछ भी असंभव न होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यदि तुम्हारा विश्वास राई के दाने के समान हो।” तुलना किसी बहुत छोटी वस्तु से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: कहता है
  rationale: यूनानी ऐतिहासिक वर्तमान को बनाए रखकर मत्ती की सजीव कथन-शैली सुरक्षित रखी गई है।
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: तुम्हारे थोड़े विश्वास के कारण
  rationale: ὀλιγοπιστία पूर्ण अविश्वास के बजाय कम या अपर्याप्त विश्वास को व्यक्त करता है; इसलिए शब्द की विशिष्टता बनाए रखी गई है।
- source_word: ἀμὴν
  choice: सच
  rationale: यह गंभीर और निश्चयात्मक कथन का परिचायक है; ‘मैं तुमसे सच कहता हूँ’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: πίστιν
  choice: विश्वास
  rationale: इस प्रसंग में यह परमेश्वर की सामर्थ्य पर भरोसे को सूचित करता है; ‘विश्वास’ इसका मानक और व्यापक हिन्दी प्रतिरूप है।
- source_word: ὡς κόκκον σινάπεως
  choice: राई के दाने जितना भी
  rationale: तुलना अत्यन्त छोटी मात्रा से है। ‘जितना भी’ प्रसंग में न्यूनता का भाव स्पष्ट करता है, बिना यह अर्थ जोड़े कि बीज के किसी अन्य गुण की तुलना की जा रही है।
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: यहाँ से वहाँ हट जा
  rationale: पहाड़ को संबोधित आज्ञा में ‘हट जा’ स्वाभाविक हिन्दी है और स्थान-परिवर्तन की क्रिया को स्पष्ट रखता है।
- source_word: μεταβήσεται
  choice: वह हट जाएगा
  rationale: यूनानी रूप यहाँ अकर्मक भाव रखता है; पहाड़ स्वयं स्थान बदलेगा, न कि उसे किसी अनिर्दिष्ट कर्ता द्वारा हटाया जाएगा।
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: तुम्हारे लिए कुछ भी असम्भव न होगा
  rationale: यह यूनानी मुहावरे का स्पष्ट और स्वाभाविक हिन्दी रूप है तथा शिष्यों के संदर्भ में बहुवचन ‘तुम्हारे’ को बनाए रखता है।
theological_decisions:
- issue: चमत्कार के प्रसंग में πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: संदर्भ शिष्यों के परमेश्वर की सामर्थ्य पर अपर्याप्त भरोसे से संबंधित है, न कि उद्धारकारी विश्वास की व्यवस्थित परिभाषा या किसी की विश्वासयोग्यता से। ‘विश्वास’ मूल की व्यापकता बनाए रखता है।
- issue: पहाड़ हटाने वाले कथन का स्वरूप
  choice: मूल रूपकात्मक/अतिशयोक्तिपूर्ण कथन को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: इसे केवल कठिन कार्यों के रूपक के रूप में स्पष्ट कर देना, अथवा असीम मानवीय चमत्कार-सामर्थ्य का दावा बनाना
  rationale: पाठ स्वयं कोई सीमांकन या विस्तृत व्याख्या नहीं देता। अनुवाद को कथन की शक्ति और धर्मवैज्ञानिक तनाव दोनों सुरक्षित रखने चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज शैली। ऐतिहासिक वर्तमान ‘कहता है’ और आरम्भिक δέ के लिए हल्का संयोजक ‘पर’ रखा गया है। ‘असम्भव’ की मानक वर्तनी अपनाई गई है।
