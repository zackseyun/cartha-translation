  text: καὶ ἰδοὺ ⸀ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας ⸂συλλαλοῦντες μετ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: hi
  text: और देखो, मूसा और एलिय्याह उन्हें दिखाई दिए[a] और उसके साथ बातचीत कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके सामने प्रकट हुए।’ यूनानी क्रिया रूपतः कर्मवाच्य है और उसका अधिक शाब्दिक अर्थ ‘उन्हें दिखाई दिए’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला संकेत है, जो दृश्य के अचानक और जीवंत रूप से सामने आने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὤφθη
  choice: दिखाई दिए
  rationale: यूनानी क्रिया रूपतः कर्मवाच्य है और दृश्य रूप में प्रकट होने का बोध देता है। ‘दिखाई दिए’ हिन्दी में स्वाभाविक है तथा मूल रूप की कर्मवाच्यता को भी बनाए रखता है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: सम्प्रदान कारक उन लोगों को सूचित करता है जिन्होंने यह दृश्य देखा; ‘उन्हें’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: Μωϋσῆς
  choice: मूसा
  rationale: इस व्यक्ति-नाम का मानक और व्यापक रूप से प्रचलित हिन्दी बाइबलीय रूप।
- source_word: Ἠλίας
  choice: एलिय्याह
  rationale: इस व्यक्ति-नाम का मानक और व्यापक रूप से प्रचलित हिन्दी बाइबलीय रूप।
- source_word: συλλαλοῦντες
  choice: बातचीत कर रहे थे
  rationale: कृदन्त परस्पर बोलने या वार्तालाप करने को व्यक्त करता है; यह चयन उसकी पारस्परिकता और जारी क्रिया दोनों को सहज हिन्दी में प्रकट करता है।
- source_word: μετ’ αὐτοῦ
  choice: उसके साथ
  rationale: μετά सम्बन्ध या संगति बताता है। ‘उसके साथ’ मूल सर्वनाम को बनाए रखता है; प्रसंग में इसका संकेत यीशु की ओर है।
theological_decisions:
- issue: αὐτοῦ के संकेतित व्यक्ति की पहचान
  choice: ‘उसके’ का संकेत यीशु की ओर है
  alternative: सर्वनाम के स्थान पर स्पष्ट रूप से ‘यीशु के’ कहना
  rationale: रूपान्तरण के निकटवर्ती प्रसंग में संकेत स्पष्ट है। फिर भी मूल यूनानी के सर्वनाम को बनाए रखने और अनावश्यक स्पष्टता न जोड़ने के लिए ‘उसके’ रखा गया है।
- issue: मूसा और एलिय्याह के दिखाई देने की घटना
  choice: वे शिष्यों को दृश्य रूप में दिखाई दिए
  alternative: वे उनके सामने प्रकट हुए
  rationale: पद दृश्य उपस्थिति का कथन करता है, पर उस उपस्थिति के स्वरूप या माध्यम की धर्मवैज्ञानिक व्याख्या नहीं करता। अनुवाद भी इससे आगे नहीं जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर। ‘देखो’ ἰδού की ध्यानाकर्षक शक्ति बनाए रखता है; ‘बातचीत कर रहे थे’ συλλαλοῦντες की पारस्परिक और प्रगतिशील क्रिया को स्वाभाविक रूप देता है।
