lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: उसने उत्तर दिया
  rationale: कृदंत और मुख्य क्रिया का यह संयोजन सामी प्रभाव वाला सामान्य यूनानी प्रयोग है। स्वाभाविक हिन्दी में ‘उसने उत्तर दिया’ प्रत्युत्तर का भाव बनाए रखता है और अनावश्यक दोहराव से बचता है।
- source_word: Ἠλίας
  choice: एलिय्याह
  rationale: व्यक्तिनाम को हिन्दी बाइबलीय परंपरा के प्रचलित लिप्यंतरण के अनुसार रखा गया है।
- source_word: μέν
  choice: निश्चय ही
  rationale: μέν कथन पर बल देता है और अगले पद में आने वाले विरोध अथवा संतुलन की भूमिका बनाता है। ‘निश्चय ही’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔρχεται
  choice: आ रहा है
  rationale: क्रिया रूप वर्तमानकालीन है, पर प्रसंग में उसका आशय भविष्य की ओर है। ‘आ रहा है’ वर्तमान रूप की सजीवता और भावी अपेक्षा दोनों को बनाए रखता है।
- source_word: ἀποκαταστήσει
  choice: पुनःस्थापित करेगा
  rationale: भविष्यकालीन सक्रिय क्रिया बहाली या पूर्व दशा में लाने का अर्थ देती है। ‘पुनःस्थापित करेगा’ इस अर्थ को बिना उसका स्वरूप निर्धारित किए व्यक्त करता है।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन व्यापक और समावेशी है। ‘सब कुछ’ हिन्दी में स्वाभाविक रहते हुए अनिर्दिष्ट व्यापकता को सुरक्षित रखता है।
theological_decisions:
- issue: एलिय्याह के पुनःस्थापना-कार्य का स्वरूप और विस्तार
  choice: ‘सब कुछ पुनःस्थापित करेगा’ के रूप में व्यापक कथन रखा गया है।
  alternative: ‘सब कुछ ठीक कर देगा’ या पुनःस्थापना को केवल आत्मिक, सामाजिक अथवा युगांत संबंधी अर्थ तक सीमित करना।
  rationale: इस पद में यूनानी पाठ पुनःस्थापना का सटीक स्वरूप या दायरा परिभाषित नहीं करता। व्यापक अभिव्यक्ति मूल की धार्मिक तनावपूर्ण अस्पष्टता को बनाए रखती है और किसी विशिष्ट व्याख्यात्मक योजना को पाठ में नहीं जोड़ती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुनःस्थापित’ सामान्य बातचीत की तुलना में कुछ औपचारिक है, पर ἀποκαθίστημι की बहाली संबंधी व्यापकता को ‘ठीक करना’ से अधिक सटीकता से सुरक्षित रखता है।
