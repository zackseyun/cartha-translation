lexical_decisions:
- source_word: προσῆλθεν
  choice: उनके पास आए
  rationale: प्रसंग में यह क्रिया शिष्यों की ओर आकर उनके निकट पहुँचने को व्यक्त करती है। ‘उनके पास आए’ स्वाभाविक हिन्दी है और गति का भाव बनाए रखती है।
- source_word: ἁψάμενος αὐτῶν
  choice: उन्हें छुआ
  rationale: ἅπτω का यहाँ सीधा अर्थ ‘छूना’ है। यूनानी कृदन्त को हिन्दी में समन्वित क्रिया के रूप में रखना अधिक स्वाभाविक है; ‘हाथ रखा’ मूल से अधिक विशिष्ट होता।
- source_word: εἶπεν
  choice: कहा
  rationale: यह λέγω का सीधा और सामान्य हिन्दी रूप है।
- source_word: Ἐγέρθητε
  choice: उठो
  rationale: आज्ञा उन शिष्यों से है जो भूमि पर गिरे पड़े थे। ‘उठो’ स्वाभाविक है और अंतिम शारीरिक मुद्रा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: μὴ φοβεῖσθε
  choice: मत डरो
  rationale: यह निषेधात्मक आज्ञा φοβέομαι के ‘डरना’ अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करती है, बिना इसे अनिवार्यतः ‘डरना बंद करो’ मानने के।
- source_word: καὶ
  choice: तब / और
  rationale: आरम्भिक καί को प्रसंगानुकूल कथात्मक ‘तब’ और अगले संयोजनों को ‘और’ से व्यक्त किया गया है; इससे घटनाक्रम स्पष्ट रहता है और कोई अतिरिक्त अर्थ नहीं जुड़ता।
theological_decisions:
- issue: यीशु की आश्वस्त करने वाली आज्ञा में अतिरिक्त अर्थ न जोड़ना
  choice: उठो और मत डरो
  alternative: खड़े हो जाओ और डरना बंद करो
  rationale: चुना हुआ पाठ शारीरिक रूप से उठने और भय न करने की दोनों आज्ञाओं को सीधे रखता है। विकल्प अंतिम मुद्रा और चल रहे भय की समाप्ति को मूल पाठ की अपेक्षा अधिक निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक। ‘आए’ और ‘कहा’ में यीशु के लिए आदरसूचक बहुवचन रखा गया है।
