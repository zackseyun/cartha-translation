  text: τότε συνῆκαν οἱ μαθηταὶ ὅτι περὶ Ἰωάννου τοῦ βαπτιστοῦ εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/013.yaml
  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: hi
  text: तब शिष्यों ने समझा कि उन्होंने उनसे बपतिस्मा देनेवाले यूहन्ना[a] के विषय में कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यूहन्ना बपतिस्मा देनेवाला।”
    reason: βαπτιστής को हिन्दी में वर्णनात्मक उपाधि के दो स्वाभाविक शब्दक्रमों में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह समय और उसी क्षण हुई समझ को दर्शाने वाला स्वाभाविक, संक्षिप्त कथात्मक संयोजक है।
- source_word: συνῆκαν
  choice: समझा
  rationale: क्रिया यहाँ कही गई बात का अर्थ ग्रहण कर लेने को व्यक्त करती है; ‘समझा’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: οἱ μαθηταὶ
  choice: शिष्यों
  rationale: सुसमाचारों में यीशु के अनुयायियों के लिए μαθηταί का मानक और परिचित हिन्दी रूप ‘शिष्य’ है।
- source_word: ὅτι
  choice: कि
  rationale: यह उस बात की विषयवस्तु प्रस्तुत करता है जिसे शिष्यों ने समझा, कारण नहीं।
- source_word: περὶ
  choice: के विषय में
  rationale: सम्बन्धवाचक περί यहाँ कथन के विषय को दर्शाता है; यह गरिमापूर्ण और सहज आधुनिक हिन्दी है।
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: बपतिस्मा देनेवाले यूहन्ना
  rationale: βαπτιστής यूहन्ना की पहचान उसके बपतिस्मा देने के कार्य से कराता है। यह रूप शीर्षक को केवल पारंपरिक संज्ञा के रूप में रखने के बजाय उसका अर्थ स्पष्ट करता है।
- source_word: εἶπεν αὐτοῖς
  choice: उन्होंने उनसे ... कहा था
  rationale: यूनानी क्रिया साधारण भूतकाल में है, पर शिष्यों के बाद में समझने की तुलना में कथन पहले हुआ था; हिन्दी में ‘कहा था’ उस कालक्रम को स्वाभाविक ढंग से व्यक्त करता है। आदरसूचक ‘उन्होंने’ यीशु के अप्रकट कर्ता को सूचित करता है।
theological_decisions:
- issue: निकटवर्ती प्रसंग में एलिय्याह-सदृश व्यक्ति की पहचान
  choice: पद के अनुसार शिष्यों ने समझा कि यीशु बपतिस्मा देनेवाले यूहन्ना के विषय में कह रहे थे।
  alternative: पहचान को अस्पष्ट रखना या व्याख्यात्मक रूप से यूहन्ना को स्वयं एलिय्याह कहना।
  rationale: वाक्य स्पष्ट रूप से यूहन्ना को यीशु के कथन का विषय बताता है, पर यह उससे आगे जाकर यूहन्ना और एलिय्याह की पहचान का स्वरूप परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘बपतिस्मा’ भारतीय हिन्दी मसीही प्रयोग में व्यापक रूप से पहचाना जाता है, जबकि ‘बपतिस्मा देनेवाला’ यूनानी उपाधि के कार्यात्मक अर्थ को स्पष्ट रखता है।
