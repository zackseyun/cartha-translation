- source_word: ἔπεσαν ἐπὶ πρόσωπον αὐτῶν
  choice: मुँह के बल गिर पड़े
  rationale: यह हिन्दी का स्वाभाविक मुहावरा है, जो उनके भूमि पर औंधे पड़ने की शारीरिक मुद्रा व्यक्त करता है; ‘गिर पड़े’ सरल अओरिस्ट घटना-क्रम को बनाए रखता है।
- source_word: ἐφοβήθησαν σφόδρα
  choice: बहुत डर गए
  rationale: ‘डर गए’ अओरिस्ट में उत्पन्न प्रतिक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और ‘बहुत’ σφόδρα की तीव्रता को स्पष्ट रूप से बनाए रखता है।
