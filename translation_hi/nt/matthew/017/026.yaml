source:
  edition: SBLGNT
  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: hi
  text: जब उसने कहा, “परायों से,” यीशु ने उससे कहा, “तो पुत्र स्वतंत्र हैं।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तो पुत्र कर देने से मुक्त हैं।” यूनानी में शाब्दिक रूप से “पुत्र स्वतंत्र हैं” है; इस प्रसंग में इसका अर्थ है कि उन पर यह कर देने का दायित्व नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: उसके यह कहने पर
  rationale: सम्बन्धवाचक कृदन्तीय रचना का कालगत भाव स्वाभाविक हिन्दी में व्यक्त होता है; δέ के हल्के संक्रमण को अलग संयोजक से भारी नहीं बनाया गया।
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: परायों से
  rationale: यह शब्द राजा के अपने पुत्रों के विपरीत, उसके घराने से बाहर के लोगों को दर्शाता है। ‘परायों’ से सम्बन्धगत विरोध बना रहता है और राष्ट्रीयता का अनावश्यक अर्थ नहीं जुड़ता।
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: यीशु ने उससे कहा
  rationale: φημί के सामान्य कथात्मक प्रयोग का सीधा और स्वाभाविक अनुवाद।
- source_word: Ἄρα γε
  choice: तो
  rationale: पतरस के उत्तर से निकाले गए निष्कर्ष को संक्षिप्त और बोलचाल-संगत ढंग से चिह्नित करता है।
- source_word: ἐλεύθεροί
  choice: स्वतंत्र
  rationale: मूल विशेषण का व्यापक अर्थ बनाए रखता है; प्रसंग में इसका आशय कर देने के दायित्व से मुक्त होना है, पर अनुवाद उसे केवल ‘कर-मुक्त’ तक सीमित नहीं करता।
- source_word: οἱ υἱοί
  choice: पुत्र
  rationale: यूनानी में स्पष्ट रूप से पुल्लिंग बहुवचन है और तुलना राजा के पुत्रों तथा बाहर के लोगों के बीच है; इससे घराने और पुत्रत्व का भाव सुरक्षित रहता है।
theological_decisions:
- issue: οἱ υἱοί का अनुवाद, जहाँ कथन राजा के घराने से सम्बन्ध रखने वालों का प्रतिनिधित्व कर सकता है
  choice: पुत्र
  alternative: सन्तान
  rationale: मूल पाठ विशेष रूप से ‘पुत्रों’ कहता है और तत्काल प्रसंग राजाओं द्वारा अपने पुत्रों से कर न लेने की उपमा है। ‘पुत्र’ मूल का लिंग, कानूनी-घरेलू संकेत और पुत्रत्व की सम्भावित धर्मवैज्ञानिक प्रतिध्वनि बनाए रखता है, बिना कथन का दायरा बढ़ाए।
- issue: ἐλεύθεροί में सामान्य स्वतंत्रता और कर से छूट के बीच सम्बन्ध
  choice: स्वतंत्र
  alternative: कर से मुक्त
  rationale: मूल शब्द का शाब्दिक और व्यापक बल रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि इस प्रसंग में कर से छूट निहित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और संवाद-संगत शैली। ‘परायों’ को ‘विदेशियों’ पर प्राथमिकता दी गई है, ताकि जातीय या राष्ट्रीय अर्थ के बजाय राजा के अपने घराने और उससे बाहर के लोगों का विरोध स्पष्ट रहे।
