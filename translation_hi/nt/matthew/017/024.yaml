id: MAT.17.24
reference: Matthew 17:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: hi
  text: जब वे कफरनहूम पहुँचे, तो दो-द्राख्मा कर[a] वसूल करने वाले[b] पतरस के पास आए और बोले, “क्या तुम्हारे गुरु दो-द्राख्मा कर नहीं देते?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘दो द्राख्मा’; अर्थात मंदिर के लिए लिया जाने वाला दो-द्राख्मा कर।
    reason: cultural_note
  - marker: b
    text: या ‘दो-द्राख्मा कर लेने वाले’।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: जब वे … पहुँचे, तो
  rationale: संबंधवाचक कृदंत-रचना समय की परिस्थिति बताती है। ‘जब … तो’ आधुनिक हिन्दी में स्वाभाविक है; δέ का हल्का संक्रमण इसी वाक्य-रचना में व्यक्त हो जाता है।
- source_word: Καφαρναοὺμ
  choice: कफरनहूम
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: दो-द्राख्मा कर वसूल करने वाले
  rationale: कृदंत पदबंध लोगों को उनके कार्य से पहचानता है। λαμβάνοντες का शाब्दिक अर्थ ‘लेने वाले’ है, पर संदर्भ में वे निर्धारित कर वसूल कर रहे हैं; इसलिए ‘वसूल करने वाले’ स्पष्ट और स्वाभाविक है।
- source_word: δίδραχμα
  choice: दो-द्राख्मा कर
  rationale: δίδραχμον दो द्राख्मा मूल्य की राशि थी। संदर्भ में यह मंदिर के लिए देय कर है; ‘कर’ संदर्भगत अर्थ स्पष्ट करता है, जबकि ‘दो-द्राख्मा’ मूल राशि को बनाए रखता है।
- source_word: προσῆλθον … τῷ Πέτρῳ
  choice: पतरस के पास आए
  rationale: क्रिया का अर्थ निकट आना या किसी के पास आना है; हिन्दी में यह सहज अभिव्यक्ति है।
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: तुम्हारे गुरु
  rationale: διδάσκαλος का अर्थ शिक्षक है। यीशु के लिए संबोधन के रूप में ‘गुरु’ वर्तमान हिन्दी में स्वाभाविक, सम्मानजनक और व्यापक रूप से समझा जाने वाला है।
- source_word: οὐ τελεῖ
  choice: क्या … नहीं देते?
  rationale: कर के संदर्भ में τελέω का अर्थ देय राशि चुकाना है। ‘कर देना’ सहज हिन्दी है। मूल का नकारात्मक प्रश्न ज्यों का त्यों रखा गया है, ताकि अपेक्षित सकारात्मक उत्तर की व्यावहारिक छाया को अनावश्यक रूप से निर्णायक न बनाया जाए।
theological_decisions:
- issue: δίδραχμα की पहचान केवल सिक्कों के रूप में या कर के रूप में
  choice: मुख्य पाठ में ‘दो-द्राख्मा कर’
  alternative: ‘दो द्राख्मा’ अथवा ‘दो-द्राख्मा सिक्के’
  rationale: तात्कालिक संदर्भ इस बात का है कि यीशु निर्धारित राशि देते हैं या नहीं। ‘कर’ प्रसंगगत अर्थ को स्पष्ट करता है; पादटिप्पणी बताती है कि यह मंदिर का कर था, ताकि मुख्य पाठ में अतिरिक्त धर्मवैधानिक विवरण न जोड़ा जाए।
- issue: नकारात्मक प्रश्न का आशय
  choice: ‘क्या … नहीं देते?’ के रूप में मूल प्रश्न-संरचना सुरक्षित रखना
  alternative: ‘तुम्हारे गुरु यह कर देते हैं न?’
  rationale: यूनानी प्रश्न संभवतः सकारात्मक उत्तर की अपेक्षा करता है, पर अधिक स्पष्ट हिन्दी टैग-प्रश्न उस अपेक्षा को मूल से अधिक निर्णायक बना सकता है। इसलिए अस्पष्टता और संवाद का तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और बोलचाल से निकट है। ‘द्राख्मा’ प्राचीन मुद्रा का लिप्यंतरण है और सांस्कृतिक जानकारी पादटिप्पणी में दी गई है। सभी पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
