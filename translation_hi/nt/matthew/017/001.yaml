source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: hi
  text: छह दिन के बाद[a] यीशु पतरस, याकूब और उसके भाई यूहन्ना को अपने साथ लेते हैं[b] और उन्हें अलग से एक ऊँचे पहाड़ पर ले जाते हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छह दिन बाद।”
    reason: lexical_alternative
  - marker: b
    text: या, “उन्हें अपने साथ ले चलते हैं।”
    reason: lexical_alternative
  - marker: c
    text: या, “निजी रूप से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: छह दिन के बाद
  rationale: μετά के साथ कर्मकारक यहाँ समय बीतने के बाद की बात बताता है। ‘छह दिन के बाद’ यूनानी अभिव्यक्ति के निकट रहते हुए स्वाभाविक हिन्दी है।
- source_word: παραλαμβάνει
  choice: अपने साथ लेते हैं
  rationale: παραλαμβάνω का भाव किसी को अपने साथ ले चलना है। ‘अपने साथ लेते हैं’ केवल ‘लेते हैं’ की अपेक्षा इस अर्थ को हिन्दी में अधिक स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: पतरस, याकूब और यूहन्ना
  rationale: ये हिन्दी बाइबल-परम्परा में प्रचलित और सामान्य पाठकों के लिए पहचाने जाने योग्य नाम-रूप हैं।
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: उसके भाई यूहन्ना
  rationale: यह पदबंध यूहन्ना की पहचान भाई के रूप में कराता है और निकटतम स्वाभाविक पूर्वपद याकूब है। ‘उसके’ यूनानी सर्वनाम की संरचना को बनाए रखता है, बिना नाम को दोहराकर उससे अधिक स्पष्टता जोड़ने के।
- source_word: ἀναφέρει
  choice: ले जाते हैं
  rationale: यहाँ ἀναφέρω ऊँचाई की ओर ले जाने का अर्थ देता है। पहाड़ गन्तव्य होने के कारण ‘एक ऊँचे पहाड़ पर ले जाते हैं’ हिन्दी में चढ़ाई और गन्तव्य दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰς ὄρος ὑψηλὸν
  choice: एक ऊँचे पहाड़ पर
  rationale: गति के प्रसंग में εἰς गन्तव्य बताता है; हिन्दी में ‘पहाड़ पर’ इस दिशा और गन्तव्य का स्वाभाविक रूप है।
- source_word: κατ’ ἰδίαν
  choice: एकान्त में
  rationale: इस पदबंध का अर्थ दूसरों से अलग, निजी रूप से है। ‘एकान्त में’ संक्षेप में बताता है कि यीशु और ये तीनों अन्य लोगों से अलग थे।
theological_decisions:
- issue: सुसमाचार-वृत्तान्त में ऐतिहासिक वर्तमानकाल
  choice: 'वर्तमानकाल रखा गया है: ‘लेते हैं ... ले जाते हैं।’'
  alternative: 'भूतकाल: ‘लिया ... ले गए।’'
  rationale: यूनानी पाठ के παραλαμβάνει और ἀναφέρει वर्तमानकाल में हैं और वर्णन को सजीव बनाते हैं। हिन्दी में भी यह कथात्मक वर्तमान स्वाभाविक है, इसलिए कालगत प्रभाव को सुरक्षित रखा गया है।
- issue: ‘उसके भाई’ का सम्बन्ध
  choice: ‘याकूब और उसके भाई यूहन्ना’
  alternative: ‘याकूब और यूहन्ना, जो याकूब का भाई था’
  rationale: प्रसंग में यूहन्ना को याकूब का भाई समझना सबसे स्वाभाविक है, पर नाम दोहराकर सर्वनाम को पूरी तरह खोल देने के बजाय ‘उसके’ रखा गया है, जिससे मूल की सर्वनामिक रचना सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘पतरस, याकूब, यूहन्ना’ जैसे परिचित नाम-रूप रखे गए हैं। ‘अपने साथ’ और ‘एकान्त में’ साधारण पाठक के लिए सम्बन्ध और परिस्थिति स्पष्ट करते हैं, जबकि वर्तमानकाल यूनानी वृत्तान्त की सजीवता बनाए रखता है।
