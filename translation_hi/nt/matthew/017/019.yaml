reference: Matthew 17:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: hi
  text: तब चेलों ने यीशु के पास एकांत में आकर कहा, “हम उसे[a] क्यों नहीं निकाल सके?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी सर्वनाम का संकेत दुष्टात्मा की ओर हो सकता है, या लड़के की ओर।
    reason: मूल पाठ में सर्वनाम के संदर्भ की वास्तविक अस्पष्टता को दर्ज करना।
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह अगले घटनाक्रम को जोड़ने वाला स्वाभाविक कालसूचक शब्द है।
- source_word: προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: चेलों ने यीशु के पास ... आकर
  rationale: यूनानी कृदंत को मुख्य क्रिया के साथ स्वाभाविक हिन्दी वाक्य-विन्यास में रखा गया है; ‘चेले’ सुसमाचार के संदर्भ में μαθηταί का प्रचलित और सहज रूप है।
- source_word: κατ’ ἰδίαν
  choice: एकांत में
  rationale: निजी रूप से, दूसरों से अलग होकर बात करने का भाव स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: εἶπον
  choice: कहा
  rationale: यूनानी क्रिया का सीधा अर्थ ‘कहा’ है; उसके बाद आने वाला प्रश्न स्वयं कथन की प्रश्नवाचक प्रकृति स्पष्ट करता है।
- source_word: Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν
  choice: हम ... क्यों नहीं ... सके
  rationale: कारण पूछने और शिष्यों की असमर्थता—दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है; स्पष्ट ἡμεῖς का ‘हम’ बनाए रखा गया है।
- source_word: ἐκβαλεῖν
  choice: निकाल
  rationale: इस प्रसंग में किसी दुष्टात्मा को बाहर निकालने का अर्थ रखता है और हिन्दी में अनावश्यक धार्मिक पारिभाषिकता के बिना स्वाभाविक है।
- source_word: αὐτό
  choice: उसे
  rationale: हिन्दी का ‘उसे’ यूनानी नपुंसकलिंग सर्वनाम के संभावित संदर्भ—दुष्टात्मा या लड़का—को संदर्भानुसार खुला रखता है।
theological_decisions:
- issue: ἐκβαλεῖν αὐτό में αὐτό का संदर्भ
  choice: ‘उसे’ द्वारा संदर्भ को अस्पष्ट रहने दिया गया है।
  alternative: इसे स्पष्ट रूप से ‘दुष्टात्मा को’ या ‘लड़के को’ कहा जा सकता था।
  rationale: निकटवर्ती प्रसंग में दुष्टात्मा संभावित मुख्य संदर्भ है, पर सर्वनाम को लड़के से जोड़ना भी संभव है। हिन्दी ‘उसे’ मूल की इस वास्तविक अस्पष्टता को स्वाभाविक रूप से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘एकांत में’ तथा ‘निकाल सके’ सामान्य पाठक के लिए सहज हैं, और ‘उसे’ मूल की संदर्भगत अस्पष्टता बनाए रखता है।
