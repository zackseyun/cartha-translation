  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: hi
  text: परन्तु[a] इस प्रकार की दुष्टात्मा प्रार्थना और उपवास के बिना नहीं निकलती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद सबसे प्राचीन यूनानी हस्तलिपियों में नहीं मिलता—इनमें चौथी शताब्दी की सीनैटिकस और वैटिकनस हस्तलिपियाँ भी शामिल हैं—और न ही आरम्भिक सीरियाई तथा कॉप्टिक अनुवादों में। पर यह बाइज़ेन्टाइन बहुसंख्यक पाठ-परम्परा, लैटिन परम्परा और अधिकांश सीरियाई साक्ष्यों में मिलता है। सम्भवतः बाद के नकलनवीसों ने इसे मरकुस 9:29 के अनुरूप बनाने के लिए जोड़ा।
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: इस प्रकार का दुष्टात्मा
  rationale: γένος का मूल अर्थ ‘प्रकार/वर्ग’ है। प्रसंग में संकेत दुष्टात्माओं के एक प्रकार की ओर है; हिन्दी में केवल ‘यह प्रकार’ अस्वाभाविक और अस्पष्ट होता, इसलिए निहित संज्ञा ‘दुष्टात्मा’ स्पष्ट की गई है।
- source_word: ἐκπορεύεται
  choice: नहीं निकलता
  rationale: यह क्रिया किसी व्यक्ति में से दुष्टात्मा के बाहर निकलने को व्यक्त करती है; ‘निकलता’ स्वाभाविक हिन्दी है और निष्कासन के प्रसंग के अनुकूल है।
- source_word: εἰ μὴ
  choice: के बिना नहीं
  rationale: यहाँ वाक्यांश साधन को छोड़कर अन्य सभी संभावनाओं का निषेध करता है। ‘के बिना नहीं’ हिन्दी में ‘except by’ का स्वाभाविक और अर्थ-सटीक रूप है।
- source_word: προσευχῇ καὶ νηστείᾳ
  choice: प्रार्थना और उपवास
  rationale: दोनों संज्ञाएँ साधनसूचक ἐν के साथ हैं; हिन्दी में ‘प्रार्थना और उपवास के बिना’ उनके संयुक्त साधनात्मक अर्थ को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘इस प्रकार’ का संदर्भ
  choice: ‘दुष्टात्मा’ को निहित संज्ञा के रूप में स्पष्ट किया गया
  alternative: केवल ‘यह प्रकार’
  rationale: निकटवर्ती प्रसंग दुष्टात्मा के निकाले जाने का है। यह स्पष्टता व्याकरण और संदर्भ से आती है, किसी विशेष दुष्टात्मा-विज्ञान को पाठ में नहीं जोड़ती।
- issue: पद की पाठालोचनात्मक स्थिति
  choice: बाइज़ेन्टाइन स्रोत-पाठ के अनुसार पद मुख्य पाठ में रखा और पादटिप्पणी में प्राचीन साक्ष्यों में उसके अभाव की सूचना दी
  alternative: पद को मुख्य पाठ से हटाना या कोष्ठकों में रखना
  rationale: दिया गया आधार-पाठ इस पद को सम्मिलित करता है, पर अत्यन्त प्राचीन यूनानी और कुछ प्राचीन अनुवाद-साक्ष्य इसे नहीं रखते। पाठक को दोनों वास्तविकताओं से अवगत कराना आवश्यक है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘परन्तु’ δέ के विरोध अथवा प्रसंग-परिवर्तन को बनाए रखता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में अनिवार्य रूप से रखा गया है।
