id: MAT.17.4
reference: Matthew 17:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: hi
  text: इस पर पतरस ने यीशु से कहा, “प्रभु, हमारा यहाँ होना अच्छा है। यदि आप चाहें, तो मैं यहाँ तीन डेरे[a] बनाऊँगा—एक आपके लिए, एक मूसा के लिए और एक एलिय्याह के लिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तंबू,” “मंडप” अथवा “झोंपड़ियाँ”; यूनानी शब्द अस्थायी आश्रयों को दर्शा सकता है।
    reason: σκηνάς के अर्थ-क्षेत्र और संभावित पर्व-संबंधी संकेत को बिना मुख्य पाठ में निश्चित किए सुरक्षित रखना।
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: इस पर ... ने ... से कहा
  rationale: यह यूनानी कथन-सूत्र शाब्दिक रूप से ‘उत्तर देकर कहा’ है। यहाँ पहले कोई सीधा प्रश्न नहीं है, इसलिए ‘इस पर ... कहा’ प्रतिक्रिया और कथा की प्रगति—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: सीधे संबोधन में यह आदरपूर्ण उपाधि है और κύριος के संभावित धर्मवैज्ञानिक भार को भी बनाए रखती है।
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: हमारा यहाँ होना अच्छा है
  rationale: यह यूनानी के ‘हमारा यहाँ होना’ वाले भाव को निकटता से और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰ θέλεις
  choice: यदि आप चाहें
  rationale: θέλω इच्छा या तत्परता व्यक्त कर सकता है। आदरपूर्ण एकवचन संबोधन के लिए ‘आप चाहें’ स्वाभाविक है।
- source_word: ποιήσω
  choice: मैं ... बनाऊँगा
  rationale: पाठ में प्रथम पुरुष एकवचन भविष्यकाल है; अनुवाद पतरस के व्यक्तिगत प्रस्ताव को स्पष्ट रूप से बनाए रखता है।
- source_word: σκηνάς
  choice: डेरे
  rationale: σκηνή किसी तंबू या अस्थायी आश्रय को दर्शाता है। ‘डेरे’ आधुनिक हिन्दी में समझने योग्य है और किसी विशेष पर्व-संबंध को मुख्य पाठ में निश्चित नहीं करता।
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: एक आपके लिए, एक मूसा के लिए और एक एलिय्याह के लिए
  rationale: हर व्यक्ति के साथ μίαν (‘एक’) की पुनरावृत्ति को हिन्दी में बनाए रखा गया है।
- source_word: ὧδε
  choice: यहाँ
  rationale: यूनानी में ὧδε दोनों बार आया है; हिन्दी में भी दोनों बार ‘यहाँ’ रखकर स्थानगत बल और पुनरावृत्ति सुरक्षित रखी गई है।
theological_decisions:
- issue: यीशु के लिए κύριος का संबोधन
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ सम्मानसूचक संबोधन और उपाधि के व्यापक धर्मवैज्ञानिक संकेत—दोनों को खुला रखता है; इसे केवल सामान्य सामाजिक आदर तक सीमित नहीं करता।
- issue: रूपांतरण के प्रसंग में σκηνάς
  choice: डेरे
  alternative: तंबू; मंडप; झोंपड़ियाँ
  rationale: पद स्वयं इन संरचनाओं को झोंपड़ियों के पर्व से स्पष्ट रूप से नहीं जोड़ता। इसलिए मुख्य पाठ में अपेक्षाकृत तटस्थ शब्द चुना गया है और संभावित वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यीशु के संबोधन में आदरसूचक ‘आप’ है। वाक्य की पुनरावृत्ति और पतरस के सीधे प्रस्ताव को यथासंभव सुरक्षित रखा गया है।
