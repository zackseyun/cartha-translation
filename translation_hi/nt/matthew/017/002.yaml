  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: hi
  text: और उनके सामने उसका रूप बदल गया[a]। उसका चेहरा सूर्य के समान चमक उठा, और उसके वस्त्र प्रकाश के समान सफेद हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका रूपान्तरण हो गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεμορφώθη
  choice: उसका रूप बदल गया
  rationale: निष्क्रिय एओरिस्ट क्रिया यहाँ दृश्य रूप-परिवर्तन बताती है। यह आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में प्रकट हुई महिमा को बिना अतिरिक्त व्याख्या जोड़े व्यक्त करती है।
- source_word: ἔμπροσθεν αὐτῶν
  choice: उनके सामने
  rationale: स्थान और उपस्थित साक्षियों—दोनों का सीधा तथा स्वाभाविक बोध कराता है।
- source_word: ἔλαμψεν
  choice: चमक उठा
  rationale: λάμπω के प्रकाश देने या चमकने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; एओरिस्ट की घटना-सदृशता भी बनी रहती है।
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: उसका चेहरा
  rationale: यहाँ πρόσωπον शारीरिक चेहरे को सूचित करता है; ‘मुखमंडल’ की अपेक्षा ‘चेहरा’ अधिक सहज आधुनिक हिन्दी है।
- source_word: ὡς ὁ ἥλιος
  choice: सूर्य के समान
  rationale: ὡς से व्यक्त स्पष्ट उपमा को गरिमापूर्ण और सहज हिन्दी में सुरक्षित रखता है।
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: उसके वस्त्र
  rationale: ἱμάτια सामान्य पहनावे को दर्शाता है। ‘वस्त्र’ वर्तमान बाइबलीय गद्य में समझने योग्य और गरिमापूर्ण है।
- source_word: ἐγένετο λευκὰ
  choice: सफेद हो गए
  rationale: अवस्था में परिवर्तन को सीधे व्यक्त करता है और यूनानी पाठ में निहित न होने वाली अतिरिक्त तीव्रता नहीं जोड़ता।
- source_word: ὡς τὸ φῶς
  choice: प्रकाश के समान
  rationale: मूल उपमा और φῶς के संज्ञात्मक अर्थ को बनाए रखता है; इसे केवल ‘चमकीले’ विशेषण में नहीं बदलता।
theological_decisions:
- issue: रूपान्तरण की घटना का अनुवाद
  choice: उसका रूप बदल गया
  alternative: उसका रूपान्तरण हो गया
  rationale: ‘रूप बदल गया’ μεταμορφόομαι के दृश्य परिवर्तन वाले अर्थ को साफ आधुनिक हिन्दी में व्यक्त करता है। ‘रूपान्तरण’ पारंपरिक और संभव है, पर अधिक तकनीकी-संज्ञात्मक लगता है। पाठ इससे आगे परिवर्तन की प्रकृति पर कोई अलग सैद्धांतिक दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल। सर्वनाम मूल यूनानी के अनुसार रखा गया है, जबकि इस पृथक पद में उसका संदर्भ पिछले पद से स्पष्ट होता है।
