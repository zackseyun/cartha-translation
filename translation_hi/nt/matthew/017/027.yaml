id: MAT.17.27
reference: Matthew 17:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: hi
  text: परन्तु ताकि हम उन्हें ठेस न पहुँचाएँ[a], समुद्र के पास जाओ, काँटा डालो, और जो मछली सबसे पहले ऊपर आए उसे निकाल लो। उसका मुँह खोलने पर तुम्हें एक स्तातेर[b] मिलेगा। उसे लेकर, मेरे और अपने लिए, उन्हें दे देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्हें ठोकर न खिलाएँ”; या, “उनके लिए आपत्ति का कारण न बनें।”
    reason: lexical_alternative
  - marker: b
    text: स्तातेर लगभग चार द्राख्मा के बराबर मूल्य का सिक्का था, जो दो व्यक्तियों का मन्दिर-कर चुकाने के लिए पर्याप्त था।
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: उनके लिए ठोकर का कारण न बनें
  rationale: यह स्रोत की ठोकर संबंधी रूपक-भाषा और प्रसंग में अनावश्यक आपत्ति या अपराध उत्पन्न करने का व्यावहारिक भाव—दोनों बनाए रखता है।
- source_word: θάλασσαν
  choice: झील
  rationale: यूनानी θάλασσα का सामान्य अर्थ ‘समुद्र’ है, पर यहाँ ज्ञात भौगोलिक संदर्भ गलील की झील है; आधुनिक हिन्दी में ‘झील’ पाठक को भ्रामक भौगोलिक धारणा से बचाता है।
- source_word: ἄγκιστρον
  choice: काँटा
  rationale: मछली पकड़ने के संदर्भ में ‘काँटा’ स्वाभाविक और स्पष्ट आधुनिक हिन्दी है।
- source_word: ἀναβάντα πρῶτον ἰχθὺν
  choice: जो मछली सबसे पहले ऊपर आए
  rationale: यह पहली ऊपर आने वाली मछली का क्रम और यूनानी कृदंत का क्रियात्मक भाव सहज हिन्दी में रखता है।
- source_word: ἆρον
  choice: निकाल लो
  rationale: पकड़ी गई मछली को पानी से ऊपर निकालने के प्रसंग में यह αἴρω का स्वाभाविक हिन्दी रूप है।
- source_word: στατῆρα
  choice: एक स्तातेर
  rationale: विशिष्ट यूनानी सिक्के का नाम सुरक्षित रखा गया है; उसका मूल्य पादटिप्पणी में समझाया गया है।
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: मेरे और अपने लिए
  rationale: यह दोनों व्यक्तियों की ओर से कर चुकाने का अर्थ सहज हिन्दी में व्यक्त करता है, बिना ἀντί को अनावश्यक रूप से ‘बदले में’ कहकर अस्पष्ट बनाए।
- source_word: πορευθεὶς
  choice: जाओ
  rationale: आज्ञार्थक क्रियाओं के साथ जुड़ी पूर्ववर्ती सहगामी क्रिया को हिन्दी में सीधे आदेश के रूप में देना स्वाभाविक है।
- source_word: δὸς αὐτοῖς
  choice: उन्हें दे देना
  rationale: सिक्का प्रत्यक्ष कर्म के रूप में संदर्भ से स्पष्ट है; यह सरल और स्वाभाविक अभिव्यक्ति है।
theological_decisions:
- issue: मन्दिर-कर देने के प्रसंग में σκανδαλίζω का अर्थ
  choice: यीशु पहले कही गई पुत्रों की स्वतंत्रता को वापस लिए बिना, कर लेने वालों के लिए ठोकर का कारण बनने से बचने हेतु भुगतान करने को कहते हैं।
  alternative: यीशु पूर्ण बाध्यता स्वीकार करके कर देते हैं; अथवा भुगतान का केवल चमत्कार दिखाने वाला अर्थ है।
  rationale: तत्काल प्रसंग पुत्रों की स्वतंत्रता और फिर व्यावहारिक रियायत—दोनों को साथ रखता है। अनुवाद इस तनाव को हल किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। स्रोत की रूपक-भाषा को मुख्य पाठ में रखा गया है और व्यावहारिक अर्थ पादटिप्पणी में दिया गया है। दिए गए अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों और उनके विषयों का क्रम परस्पर उलटा था; हिन्दी मसौदे में चिह्न सही संबंधित पदों पर लगाए गए हैं।
