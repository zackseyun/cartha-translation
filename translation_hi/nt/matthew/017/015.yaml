source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: hi
  text: और कहने लगा, “प्रभु, मेरे बेटे पर दया कीजिए, क्योंकि उसे दौरे पड़ते हैं[a] और वह बहुत कष्ट सहता है; क्योंकि वह बार-बार आग में और बार-बार पानी में गिर पड़ता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे मिरगी है”; शाब्दिक अर्थ, “वह चंद्रमा से ग्रस्त है।” यूनानी शब्द दौरे जैसी अवस्था के लिए प्रयुक्त एक प्राचीन मुहावरा है।
    reason: σεληνιάζεται के शाब्दिक रूप, पारंपरिक चिकित्सीय विकल्प और प्राचीन मुहावरे की पृष्ठभूमि स्पष्ट करना।
lexical_decisions:
- source_word: Κύριε
  choice: प्रभु
  rationale: यीशु को संबोधित करने वाला सम्मानसूचक संबोधन; ‘प्रभु’ κύριος की गंभीरता और प्रचलित बाइबलीय अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐλέησόν μου τὸν υἱόν
  choice: मेरे बेटे पर दया कीजिए
  rationale: ἐλέησόν करुणापूर्ण सहायता की आग्रहपूर्ण विनती है और υἱόν विशेष रूप से ‘बेटे’ को दर्शाता है।
- source_word: σεληνιάζεται
  choice: उसे दौरे पड़ते हैं[a]
  rationale: यह प्राचीन, चंद्रमा से संबंधित मुहावरा दौरे जैसी अवस्था के लिए प्रयुक्त होता था। यह अनुवाद दिखाई देने वाली दशा बताता है, पर आधुनिक चिकित्सीय निदान या चंद्रमा को कारण नहीं ठहराता।
- source_word: κακῶς πάσχει
  choice: वह बहुत कष्ट सहता है
  rationale: κακῶς पीड़ा की तीव्रता बढ़ाता है; यह चयन स्पष्ट, स्वाभाविक और गंभीर आधुनिक हिन्दी है।
- source_word: πολλάκις
  choice: बार-बार
  rationale: दोनों बार प्रयुक्त यूनानी क्रियाविशेषण घटना की पुनरावृत्ति पर बल देता है; हिन्दी में इसकी पुनरुक्ति समानांतर संरचना को बनाए रखती है।
- source_word: πίπτει εἰς τὸ πῦρ ... εἰς τὸ ὕδωρ
  choice: आग में ... पानी में गिर पड़ता है
  rationale: गति और संकट को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है; ‘गिर पड़ता है’ बार-बार होने वाली अनैच्छिक घटना के अनुकूल है।
- source_word: καὶ λέγων
  choice: और उसने कहा
  rationale: यूनानी वर्तमान कृदंत पिछले कथन की क्रिया से जुड़ा है; स्वतंत्र हिन्दी पद में पूर्ण क्रिया अधिक स्वाभाविक है और कथात्मक संबंध बनाए रखती है।
theological_decisions:
- issue: चंगाई और दुष्टात्मा-निष्कासन के प्रसंग में σεληνιάζεται का अर्थ
  choice: दिखाई देने वाले लक्षण के रूप में ‘उसे दौरे पड़ते हैं’
  alternative: ‘उसे मिरगी है’ अथवा शाब्दिक ‘वह चंद्रमा से ग्रस्त है’
  rationale: यह पद पिता द्वारा बेटे की दशा का वर्णन करता है, कोई सटीक आधुनिक चिकित्सीय निदान नहीं देता। चुना हुआ पाठ न तो प्राचीन चंद्र-संबंधी कारण को सत्य घोषित करता है, न इस पद में बीमारी और आत्मिक कारण के संबंध को आवश्यकता से अधिक तय करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, आदरपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पिता की व्याकुल विनती के लिए ‘दया कीजिए’ और गंभीर पीड़ा के लिए ‘बहुत कष्ट सहता है’ चुना गया है।
