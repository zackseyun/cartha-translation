reference: Matthew 17:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: hi
  text: जब वे पहाड़ से नीचे उतर रहे थे, तब यीशु ने उन्हें आज्ञा दी, “इस दर्शन[b] के बारे में किसी को मत बताना, जब तक मनुष्य का पुत्र मृतकों में से[a] जिलाया न जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “मरे हुओं के बीच में से।”
    reason: lexical_alternative
  - marker: b
    text: या “जो तुमने देखा।” यूनानी शब्द का शाब्दिक अर्थ “दर्शन” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: जब वे पहाड़ से नीचे उतर रहे थे
  rationale: संबंधवाचक कृदंत की समकालिक और जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है तथा निश्चित, पहले उल्लिखित पहाड़ को बनाए रखता है।
- source_word: ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: तब यीशु ने उन्हें आज्ञा दी
  rationale: ἐνετείλατο की आदेशात्मक शक्ति स्पष्ट रहती है। हिन्दी में उद्धरण स्वयं λέγων का कार्य कर देता है, इसलिए अलग से ‘कहते हुए’ जोड़ना अनावश्यक और बोझिल होता।
- source_word: Μηδενὶ εἴπητε
  choice: किसी को मत बताना
  rationale: निषेधात्मक आदेश को सहज आधुनिक हिन्दी में व्यक्त करता है और इसके बाद आने वाली बात को बताने की क्रिया से स्वाभाविक रूप से जोड़ता है।
- source_word: τὸ ὅραμα
  choice: इस दर्शन
  rationale: ‘दर्शन’ अलौकिक या प्रकाशनात्मक दृश्य की संभावना को सुरक्षित रखता है; ‘इस’ प्रसंग में अभी-अभी देखी घटना की निश्चितता व्यक्त करता है।
- source_word: ἕως οὗ
  choice: जब तक ... न जाए
  rationale: यूनानी में दिए समय-सीमा वाले निषेध को हिन्दी की स्वाभाविक ‘जब तक ... न’ रचना में व्यक्त करता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की इस आत्म-पदवी को व्याख्यात्मक रूप से बदले बिना अनूदित करता और इसके धर्मवैचारिक संकेतों को सुरक्षित रखता है।
- source_word: ἐκ νεκρῶν
  choice: मृतकों में से
  rationale: ἐκ के ‘में से बाहर’ भाव और νεκρῶν के बहुवचन को स्पष्ट तथा संक्षिप्त हिन्दी में बनाए रखता है।
- source_word: ἐγερθῇ
  choice: जिलाया न जाए
  rationale: पुनरुत्थान के प्रसंग में क्रिया के कर्मवाच्य रूप को बनाए रखता है और कर्ता को उससे अधिक स्पष्ट नहीं करता जितना यूनानी पाठ करता है।
theological_decisions:
- issue: पुनरुत्थान की क्रिया का वाच्य और निहित कर्ता
  choice: जिलाया न जाए
  alternative: जी न उठे
  rationale: यूनानी ἐγερθῇ कर्मवाच्य है। ‘जिलाया जाए’ उस वाच्य को सुरक्षित रखता है और परमेश्वर की क्रिया के संभावित संकेत को स्पष्ट नाम देकर धर्मवैचारिक तनाव का समाधान नहीं करता।
- issue: ὅραμα का स्वरूप
  choice: दर्शन
  alternative: जो तुमने देखा
  rationale: ‘दर्शन’ घटना के प्रकाशनात्मक या अलौकिक आयाम को बनाए रखता है, जबकि वैकल्पिक अर्थ को पादटिप्पणी में दिया गया है ताकि शब्द को केवल साधारण देखने तक सीमित न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथन। ‘आज्ञा दी’ आदेश की शक्ति बनाए रखता है; ‘दर्शन’ और कर्मवाच्य ‘जिलाया जाए’ मूल पाठ की अर्थगत तथा धर्मवैचारिक खुली जगह को सुरक्षित रखते हैं। सभी पादटिप्पणी चिह्न संबंधित शब्दों के ठीक बाद रखे गए हैं।
