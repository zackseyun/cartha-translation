lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: सामान्य कथात्मक संयोजक है, जो इस घटना को पिछले प्रसंग से जोड़ता है।
- source_word: ἐλθόντων
  choice: जब वे ... आए
  rationale: संबंधकारक निरपेक्ष रचना के कालगत अर्थ और संदर्भ से मिले बहुवचन कर्ता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρὸς τὸν ὄχλον
  choice: भीड़ के पास
  rationale: ὄχλος के सामान्य अर्थ ‘भीड़’ को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है; πρὸς की ओर/निकट आने की दिशा भी बनी रहती है।
- source_word: προσῆλθεν αὐτῷ
  choice: उसके पास आया
  rationale: προσέρχομαι का किसी व्यक्ति के निकट आने का अर्थ स्पष्ट और सहज हिन्दी में देता है।
- source_word: ἄνθρωπος
  choice: एक मनुष्य
  rationale: यहाँ एक विशिष्ट पुरुष व्यक्ति का उल्लेख है; ‘मनुष्य’ स्रोत के सामान्य संज्ञात्मक रूप को बनाए रखता है और प्रसंग में स्वाभाविक है।
- source_word: γονυπετῶν αὐτὸν
  choice: उसके सामने घुटने टेक दिए
  rationale: यीशु के सामने घुटने टेकने की शारीरिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी वर्तमान कृदंत की साथ-साथ चल रही क्रिया हिन्दी में मुख्य क्रिया के रूप में सहज बनाई गई है।
theological_decisions:
- issue: γονυπετῶν में भाव या आशय
  choice: उसके सामने घुटने टेक दिए
  alternative: उसे दण्डवत किया
  rationale: मूल शब्द शारीरिक मुद्रा/क्रिया को स्पष्ट करता है, पर अपने-आप में आराधना का तकनीकी दावा आवश्यक नहीं बनाता। इसलिए अधिक धार्मिक अर्थ वाला ‘दण्डवत’ मुख्य पाठ में नहीं रखा गया।
- issue: ἄνθρωπος द्वारा व्यक्ति की पहचान
  choice: एक मनुष्य
  alternative: एक आदमी
  rationale: स्रोत एक विशिष्ट पुरुष व्यक्ति को दर्शाता है। ‘मनुष्य’ गरिमापूर्ण और स्रोत-सन्निकट है, जबकि इससे मानवजाति के विषय में कोई व्यापक धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। वाक्य में दो बार ‘पास आया/आए’ मूल यूनानी की अलग-अलग आगमन क्रियाओं को स्पष्ट रखता है।
