base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/014.yaml
  text: And when they came to the crowd[a], a man came up to him, kneeling before him[b],
translation:
  language: hi
  text: और जब वे भीड़ के पास आए, तो एक आदमी उसके पास आया और उसके सामने घुटने टेक दिए,[a]
  philosophy: optimal-equivalence
