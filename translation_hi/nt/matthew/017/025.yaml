source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: hi
  text: उसने कहा, “हाँ।” जब वह घर में आया, तो उसके कुछ कहने से पहले ही यीशु ने उससे कहा, “शमौन, तुम क्या सोचते हो? पृथ्वी के राजा शुल्क या व्यक्ति-कर[a] किनसे लेते हैं—अपने पुत्रों से या दूसरों से[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चुंगी अथवा राज-कर।” यूनानी में τέλη (शुल्क/चुंगी जैसे अप्रत्यक्ष कर) और κῆνσον (व्यक्तियों पर लगाया जाने वाला कर या राज-कर) अलग-अलग हैं।
    reason: lexical_alternative
  - marker: b
    text: या “बाहरी लोगों से।” यूनानी शब्द उन लोगों को दर्शाता है जो अपने परिवार के नहीं हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: हाँ
  rationale: यह पतरस का सीधा सकारात्मक उत्तर है; आधुनिक हिन्दी में “हाँ” सबसे स्वाभाविक है।
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: जब वह घर में आया
  rationale: कर्मकारक कृदन्त का कर्ता प्रसंगानुसार पतरस है; कालवाचक उपवाक्य हिन्दी में अर्थ स्पष्ट और स्वाभाविक बनाता है।
- source_word: προέφθασεν αὐτὸν
  choice: उसके कुछ कहने से पहले ही यीशु ने उससे कहा
  rationale: यहाँ क्रिया बताती है कि पतरस के बोलने से पहले यीशु ने पहल करके बात की; यह रूप मुहावरे का आशय स्पष्ट करता है।
- source_word: Τί σοι δοκεῖ
  choice: तुम क्या सोचते हो?
  rationale: शमौन की राय या निर्णय पूछने वाले यूनानी वाक्यांश का सहज हिन्दी रूप।
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: पृथ्वी के राजा
  rationale: γῆ के व्यापक अर्थ को बनाए रखता है और इसे किसी एक देश तक सीमित नहीं करता।
- source_word: τέλη
  choice: शुल्क
  rationale: यह अप्रत्यक्ष करों, चुंगी या सीमा-शुल्क जैसे देयों को सूचित करता है और अगले κῆνσον से भेद बनाए रखता है।
- source_word: κῆνσον
  choice: व्यक्ति-कर
  rationale: यह व्यक्तियों पर लगाया जाने वाला कर अथवा राजकीय कर था; “व्यक्ति-कर” इसका प्रकार स्पष्ट करता है और τέλη से अलग रखता है।
- source_word: υἱῶν αὐτῶν
  choice: अपने पुत्रों
  rationale: मूल में विशेष रूप से “पुत्र” हैं; यही पारिवारिक उपमा और अगले पद की धार्मिक-अर्थपूर्ण तनावपूर्णता को सुरक्षित रखता है।
- source_word: ἀλλοτρίων
  choice: परायों
  rationale: शब्द अपने परिवार के न होने वालों, अर्थात बाहरी लोगों, को दर्शाता है; “अपने पुत्रों” के विपरीत “परायों” से पारिवारिक विरोध स्पष्ट रहता है।
theological_decisions:
- issue: यीशु की उपमा में “पुत्रों” से निकलने वाला सम्भावित मसीह-संबंधी संकेत
  choice: मुख्य पाठ में शाब्दिक पारिवारिक भाषा “अपने पुत्रों” को बनाए रखा गया है।
  alternative: “अपनी संतान” या “अपनी प्रजा”
  rationale: तात्कालिक चित्र राजा के अपने परिवार को कर से छूट मिलने का है और अगला पद पुत्र-संबंधी धार्मिक संकेत को आगे बढ़ाता है। “पुत्रों” को बनाए रखना संकेत सुरक्षित रखता है, पर इस पद में उसकी व्याख्या आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “शमौन” संबोधन, दो प्रकार के करों का भेद, और “अपने पुत्रों/परायों” का पारिवारिक विरोध मूल के अनुसार सुरक्षित हैं।
