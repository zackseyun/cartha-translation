id: MAT.17.10
reference: Matthew 17:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: hi
  text: और चेलों ने उनसे पूछा, “तो शास्त्री क्यों कहते हैं कि एलिय्याह को पहले आना आवश्यक है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: पूछा
  rationale: यहाँ क्रिया सीधे प्रश्न का परिचय देती है; ‘पूछा’ स्वाभाविक आधुनिक हिन्दी है और मूल क्रिया का पर्याप्त प्रतिनिधित्व करती है।
- source_word: μαθηταὶ
  choice: चेले
  rationale: संदर्भ में पहले से ज्ञात निश्चित समूह अभिप्रेत है। मूल में ‘उसके’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: λέγοντες
  choice: पूछा
  rationale: यूनानी कृदंत प्रश्न के कथन का परिचय देता है। हिन्दी में ‘यह कहते हुए पूछा’ अनावश्यक रूप से भारी होता; एक ही ‘पूछा’ में इसका कार्य स्वाभाविक रूप से समाहित है।
- source_word: Τί οὖν
  choice: तो ... क्यों
  rationale: λέγουσιν ὅτι के साथ τί यहाँ कारण पूछता है। ‘तो ... क्यों’ निष्कर्षसूचक οὖν और प्रश्नसूचक बल दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: सुसमाचारों के यहूदी संदर्भ में γραμματεῖς के लिए यह प्रचलित, संक्षिप्त और सीधा हिन्दी पद है।
- source_word: λέγουσιν ὅτι
  choice: कहते हैं कि
  rationale: वर्तमानकालीन कथन और उसके विषयवाक्य को सीधे तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Ἠλίαν
  choice: एलिय्याह
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय वर्तनी में लिप्यंतरित किया गया है।
- source_word: δεῖ ἐλθεῖν
  choice: आना अवश्य है
  rationale: δεῖ की आवश्यकता या अनिवार्यता का बल बनाए रखते हुए यह रचना हिन्दी में स्वाभाविक है।
- source_word: πρῶτον
  choice: पहले
  rationale: यह घटनाक्रम में पूर्वता बताता है; ‘पहले’ इसका सीधा और स्पष्ट हिन्दी समतुल्य है।
theological_decisions:
- issue: एलिय्याह के आने के विषय में चेलों के प्रश्न का अर्थगत बल
  choice: प्रश्न को इस तरह रखा गया है कि शास्त्रियों की शिक्षा की पुष्टि, चुनौती या आंशिक सुधार का निर्णय अगले पदों पर छोड़ा जाए।
  alternative: अनुवाद में शास्त्रियों के प्रति संदेह दिखाना या मलाकी की पृष्ठभूमि को इसी पद में स्पष्ट रूप से जोड़ देना।
  rationale: यह पद केवल चेलों का प्रश्न प्रस्तुत करता है। उत्तर मत्ती 17:11–13 में खुलता है; अतः इस पद में उस उत्तर को पहले से नहीं समाहित किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक। ‘चेलों’ और ‘शास्त्री’ जैसे परिचित बाइबलीय पद रखे गए हैं। मूल के ‘कहते हुए’ कृदंत को हिन्दी की सहज प्रश्न-रचना में समाहित किया गया है।
