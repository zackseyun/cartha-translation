  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: hi
  text: जब वे गलील में एकत्र हो रहे थे[a], तब यीशु ने उनसे कहा, “मनुष्य का पुत्र मनुष्यों के हाथों में[c] सौंपा जाने वाला है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इकट्ठे हो रहे थे।”
    reason: lexical_alternative
  - marker: b
    text: या, “हवाले किया जाने वाला है।”
    reason: lexical_alternative
  - marker: c
    text: या, “लोगों के हाथों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: इकट्ठे हो रहे थे
  rationale: यह समूह के एक साथ आने या एकत्र होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है, बिना उनकी गतिविधि को अनावश्यक रूप से अधिक स्पष्ट किए।
- source_word: δὲ
  choice: जब … तब
  rationale: सम्बन्धसूचक δέ और सम्बन्धकारक निरपेक्ष रचना को मिलाकर हिन्दी की स्वाभाविक कालवाचक रचना ‘जब … तब’ में व्यक्त किया गया है।
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: गलील में
  rationale: यह स्थानवाचक पद का सीधा और स्वाभाविक अनुवाद है।
- source_word: εἶπεν αὐτοῖς
  choice: यीशु ने उनसे कहा
  rationale: λέγω के साथ परोक्ष कर्म का पारदर्शी और प्रचलित हिन्दी रूप है।
- source_word: Μέλλει
  choice: शीघ्र ही … जाएगा
  rationale: μέλλω से सूचित आसन्न भावी घटना को व्यक्त करता है, पर नियति का अधिक प्रबल भाव नहीं जोड़ता।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की इस विशिष्ट आत्म-पदवी का स्थापित शाब्दिक रूप है और इसके शास्त्रीय तथा धर्मवैचारिक संकेतों को बनाए रखता है।
- source_word: παραδίδοσθαι
  choice: सौंप दिया जाएगा
  rationale: मूल के कर्मवाच्य और किसी के अधिकार में दिए जाने के व्यापक भाव को सुरक्षित रखता है; इसे केवल विश्वासघात तक सीमित नहीं करता।
- source_word: εἰς χεῖρας
  choice: हाथों में
  rationale: मूल रूपक को बनाए रखते हुए हिन्दी में किसी के वश या अधिकार में दिए जाने का अर्थ स्पष्ट करता है।
- source_word: ἀνθρώπων
  choice: मनुष्यों
  rationale: यहाँ मानवीय कर्ताओं को सूचित करता है और ‘मनुष्य का पुत्र’ के साथ मूल का शब्दगत तथा अलंकारिक सम्बन्ध बनाए रखता है।
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου का अनुवाद
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र
  rationale: स्थापित शाब्दिक पद मूल यूनानी अभिव्यक्ति और उसके अन्तर्पाठीय तथा धर्मवैचारिक अर्थ-संकेतों को अधिक अच्छी तरह सुरक्षित रखता है।
- issue: दुःखभोग की भविष्यवाणी में παραδίδοσθαι का आशय
  choice: सौंप दिया जाएगा
  alternative: हवाले कर दिया जाएगा; पकड़वा दिया जाएगा
  rationale: यह कर्मवाच्य को बनाए रखकर कर्ता और कारण को अनिर्धारित छोड़ता है। ‘पकड़वा दिया जाएगा’ इसे समय से पहले केवल विश्वासघात के अर्थ तक सीमित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जब … तब’ हिन्दी में परिस्थिति और मुख्य कथन का सम्बन्ध स्पष्ट करता है। ‘शीघ्र ही’ μέλλω की आसन्नता व्यक्त करता है, जबकि ‘सौंप दिया जाएगा’ मूल के कर्मवाच्य और अनिर्दिष्ट कर्तृत्व को सुरक्षित रखता है।
