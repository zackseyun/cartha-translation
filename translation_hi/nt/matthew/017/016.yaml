id: MAT.17.16
reference: Matthew 17:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: hi
  text: और मैं उसे आपके शिष्यों के पास लाया, और वे उसे चंगा नहीं कर सके।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उसे चंगा करने में समर्थ नहीं हुए।”
    reason: ग्रीक क्रिया सामर्थ्य या क्षमता को स्पष्ट रूप से व्यक्त करती है; मुख्य पाठ में इसका स्वाभाविक हिन्दी रूप ‘नहीं कर सके’ दिया गया है।
lexical_decisions:
- source_word: προσήνεγκα
  choice: लाया
  rationale: यहाँ προσφέρω का अर्थ किसी व्यक्ति को दूसरे के पास लाना है। ‘लाया’ सहज और संदर्भानुकूल है।
- source_word: μαθηταῖς σου
  choice: आपके शिष्यों
  rationale: सुसमाचारों में μαθητής किसी शिक्षक के प्रतिबद्ध विद्यार्थी और अनुयायी को दर्शाता है; ‘शिष्य’ इसका प्रचलित और स्पष्ट हिन्दी रूप है।
- source_word: οὐκ ἠδυνήθησαν
  choice: नहीं कर सके
  rationale: δύναμαι सामर्थ्य या क्षमता व्यक्त करता है। ‘नहीं कर सके’ आधुनिक हिन्दी में स्वाभाविक रूप से उनकी असमर्थता बताता है।
- source_word: θεραπεῦσαι
  choice: चंगा
  rationale: इस प्रसंग में θεραπεύω पीड़ित लड़के को चंगा करने के अर्थ में है। ‘चंगा करना’ सुसमाचारों के उपचार-वर्णनों में स्पष्ट और स्थापित अभिव्यक्ति है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: दोनों καί को समन्वयकारी ‘और’ से रखा गया है, ताकि मूल कथन का सीधा प्रवाह बना रहे और दूसरे संयोजक में अनावश्यक विरोधात्मक अर्थ न जोड़ा जाए।
- source_word: αὐτόν
  choice: उसे
  rationale: सर्वनाम निकटवर्ती संदर्भ के पीड़ित पुत्र को इंगित करता है; ‘उसे’ सीधा और स्पष्ट रूप है।
theological_decisions:
- issue: शिष्यों की विफलता का स्वरूप
  choice: कथन को केवल लड़के को चंगा न कर सकने के रूप में रखा गया है।
  alternative: इसे स्पष्ट रूप से दुष्टात्मा न निकाल सकने या अविश्वास के कारण हुई विफलता के रूप में समझाना।
  rationale: इस पद में केवल इतना कहा गया है कि शिष्य उसे चंगा नहीं कर सके। कारण या क्रिया की अधिक विशिष्ट व्याख्या आसपास के प्रसंग से इस पद में नहीं जोड़ी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, आदरपूर्ण और गरिमामय शैली रखी गई है। यीशु के लिए ‘आपके’ और μαθητής के लिए प्रचलित ‘शिष्य’ का प्रयोग किया गया है।
