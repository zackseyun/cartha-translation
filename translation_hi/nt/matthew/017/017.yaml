source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: hi
  text: तब यीशु ने उत्तर दिया, “हे अविश्वासी और विकृत पीढ़ी![a] मैं कब तक तुम्हारे साथ रहूँगा? कब तक तुम्हें सहता रहूँगा? उसे यहाँ मेरे पास लाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अविश्वासी और विकृत पीढ़ी” का अनुवाद “विश्वासहीन और टेढ़ी पीढ़ी” या “विश्वासहीन और भ्रष्ट पीढ़ी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: तब यीशु ने उत्तर दिया
  rationale: ἀποκριθείς के साथ εἶπεν उत्तर देने का प्रचलित यूनानी-सामी मुहावरा है; हिन्दी में केवल ‘उत्तर दिया’ स्वाभाविक है। δέ यहाँ कथा के अगले, कुछ विरोधात्मक मोड़ को ‘तब’ से सहज रूप में व्यक्त करता है।
- source_word: Ὦ
  choice: हे
  rationale: सम्बोधन और गंभीर खेद या फटकार के भाव के लिए ‘हे’ प्रतिष्ठित तथा सुबोध हिन्दी रूप है।
- source_word: γενεὰ
  choice: पीढ़ी
  rationale: यह γενεά के मूल पीढ़ीगत अर्थ और कथन की भविष्यद्वक्ताई गूँज को बनाए रखता है।
- source_word: ἄπιστος
  choice: अविश्वासी
  rationale: यहाँ प्रसंग विश्वास की कमी पर केंद्रित है। ‘अविश्वासी’ उस अर्थ को सीधे व्यक्त करता है, जबकि यूनानी शब्द में ‘विश्वासहीन’ का अर्थ भी संभव है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: διεστραμμένη
  choice: विकृत
  rationale: पूर्ण निष्क्रिय कृदन्त ऐसी दशा का संकेत देता है जो टेढ़ी, बिगड़ी या भ्रष्ट हो चुकी है। ‘विकृत’ नैतिक विरूपण को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: मैं कब तक तुम्हारे साथ रहूँगा?
  rationale: भविष्यकाल और आलंकारिक प्रश्न को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: कब तक तुम्हें सहता रहूँगा?
  rationale: ἀνέχομαι का अर्थ सहना या बर्दाश्त करना है। ‘सहता रहूँगा’ गंभीर फटकार और निरंतरता दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: उसे यहाँ मेरे पास लाओ
  rationale: आज्ञार्थक क्रिया, पुल्लिंग सर्वनाम और स्थानवाचक क्रियाविशेषण का सीधा तथा स्पष्ट अनुवाद है।
theological_decisions:
- issue: ἄπιστος में अविश्वास और विश्वासहीनता के बीच अर्थगत तनाव
  choice: अविश्वासी
  alternative: विश्वासहीन
  rationale: तात्कालिक प्रसंग चेलों के अपर्याप्त विश्वास से संबंधित है, इसलिए ‘अविश्वासी’ मुख्य पाठ में उपयुक्त है। फिर भी शब्द का विश्वासहीनता वाला अर्थ वास्तविक है और पादटिप्पणी में दिया गया है।
- issue: διεστραμμένη द्वारा पीढ़ी के नैतिक चित्रण की तीव्रता
  choice: विकृत
  alternative: टेढ़ी या भ्रष्ट
  rationale: ‘विकृत’ मूल के मुड़े-बिगड़े होने के बिंब और नैतिक गंभीरता को बनाए रखता है, बिना किसी विशिष्ट सांप्रदायिक व्याख्या को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, स्पष्ट और मौखिक रूप से स्वाभाविक स्तर अपनाया गया है। ‘हे’ गंभीर सम्बोधन को, ‘पीढ़ी’ मूल की सामूहिक और भविष्यद्वक्ताई भाषा को, तथा ‘सहता रहूँगा’ फटकार की तीव्रता के साथ निरंतरता को बनाए रखते हैं।
