lexical_decisions:
- source_word: ἐπάραντες
  choice: उठाकर
  rationale: एओरिस्ट कृदन्त मुख्य क्रिया से पहले की क्रिया बताता है। ‘अपनी आँखें उठाकर’ यूनानी क्रम और स्वाभाविक हिन्दी मुहावरे—दोनों को बनाए रखता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है; प्रसंग में प्रबल विरोध का भाव आवश्यक नहीं है।
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: अपनी आँखें
  rationale: यूनानी का ठोस शारीरिक बिंब बनाए रखते हुए हिन्दी में कर्ता-सापेक्ष ‘अपनी’ स्वाभाविक है।
- source_word: οὐδένα εἶδον
  choice: किसी को नहीं देखा
  rationale: नकारात्मक सर्वनाम और सरल एओरिस्ट क्रिया का स्पष्ट तथा स्वाभाविक हिन्दी रूप।
- source_word: εἰ μὴ
  choice: के सिवा
  rationale: नकारात्मक कथन के बाद यह पदबंध अपवाद को व्यक्त करता है; हिन्दी में ‘के सिवा’ इसका सीधा और सहज समतुल्य है।
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: अकेले यीशु
  rationale: नाम के साथ सर्वनाम और μόνον मिलकर यीशु के ही दिखाई देने पर प्रबल बल देते हैं। ‘अकेले यीशु’ उस विशिष्टता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दर्शन के बाद केवल यीशु का दिखाई देना
  choice: अकेले यीशु के सिवा किसी को नहीं देखा
  alternative: यीशु के सिवा किसी को नहीं देखा
  rationale: εἰ μὴ के साथ αὐτὸν Ἰησοῦν μόνον विशिष्टता को दोहराकर बल देता है। ‘अकेले’ को बनाए रखने से मूसा और एलिय्याह के अब दिखाई न देने और केवल यीशु के शेष दिखने का कथात्मक जोर सुरक्षित रहता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक। ‘अपनी आँखें उठाकर’ पारंपरिक बाइबलीय बिंब को बनाए रखता है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज है।
