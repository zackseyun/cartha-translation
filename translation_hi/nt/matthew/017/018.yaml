id: MAT.17.18
reference: Matthew 17:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: hi
  text: और यीशु ने उसे डाँटा, और दुष्टात्मा उसमें से निकल गई; और लड़का उसी घड़ी से चंगा हो गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसी क्षण से।”
    reason: “उसी घड़ी से” यूनानी का अधिक शाब्दिक रूप है; “उसी क्षण से” उसी भाव का अधिक मुहावरेदार हिन्दी विकल्प है।
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: डाँटा
  rationale: यह क्रिया कड़ी फटकार और अधिकारपूर्ण रोक को व्यक्त करती है। “डाँटा” आधुनिक हिन्दी में स्वाभाविक है और केवल “आज्ञा दी” कहकर अर्थ को संकुचित नहीं करता।
- source_word: αὐτῷ
  choice: उसे
  rationale: यूनानी सर्वनाम का संदर्भ व्याकरणतः लड़के या दुष्टात्मा, दोनों की ओर समझा जा सकता है; प्रसंग दुष्टात्मा की ओर संकेत करता है। हिन्दी “उसे” इस वास्तविक संदर्भगत अस्पष्टता को स्वाभाविक रूप से बनाए रखता है।
- source_word: τὸ δαιμόνιον
  choice: दुष्टात्मा
  rationale: “दुष्टात्मा” आधुनिक हिन्दी में ऐसे अलौकिक दुष्ट प्राणी के लिए प्रचलित और स्पष्ट शब्द है; “अशुद्ध आत्मा” इस पद में उपस्थित न होने वाली अलग यूनानी अभिव्यक्ति को आयात करता।
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: उसमें से निकल गई
  rationale: यह यूनानी के निष्कासन-संबंधी प्रत्यक्ष बिंब को बनाए रखता है और हिन्दी में सहज है।
- source_word: ἐθεραπεύθη
  choice: चंगा हो गया
  rationale: निष्क्रिय यूनानी रूप यहाँ प्राप्त हुई चंगाई को बताता है। “चंगा हो गया” सामान्य, स्पष्ट और परिणामपरक हिन्दी अभिव्यक्ति है।
- source_word: ὁ παῖς
  choice: लड़का
  rationale: παῖς के अर्थों में बच्चा, लड़का और सेवक सम्मिलित हैं; निकटवर्ती प्रसंग में पिता के पुत्र का उल्लेख होने के कारण “लड़का” सर्वाधिक उपयुक्त है।
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: उसी घड़ी से
  rationale: यह यूनानी समय-सूचक वाक्यांश का निकट अनुवाद है और तत्काल आरम्भ होकर आगे बने रहने वाले परिणाम को व्यक्त करता है।
theological_decisions:
- issue: यीशु की डाँट में αὐτῷ का संदर्भ
  choice: “उसे” द्वारा संदर्भगत अस्पष्टता बनाए रखी गई; प्रसंगतः दुष्टात्मा प्रमुख संदर्भ है
  alternative: स्पष्ट रूप से “दुष्टात्मा को” या “लड़के को” कहना
  rationale: अगला वाक्यांश—दुष्टात्मा का उसमें से निकलना—दृढ़ता से बताता है कि डाँट दुष्टात्मा को दी गई थी। फिर भी यूनानी केवल सर्वनाम रखता है; हिन्दी “उसे” मूल की अस्पष्टता को बिना अस्वाभाविकता के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की क्रमिक संरचना मूल यूनानी के घटनाक्रम को बनाए रखती है; अर्धविराम निष्कासन और चंगाई के निकट संबंध को स्पष्ट करता है।
