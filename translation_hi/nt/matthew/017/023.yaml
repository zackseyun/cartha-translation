    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν
  choice: मार डालेंगे
  rationale: यह भविष्यकालीन सक्रिय बहुवचन क्रिया का सीधा और स्वाभाविक हिन्दी रूप है। ‘हत्या करेंगे’ मूल क्रिया में स्पष्ट न किए गए नैतिक-कानूनी भाव को जोड़ सकता है।
- source_word: αὐτόν
  choice: उसे
  rationale: यह कर्मकारक सर्वनाम पिछले पद के ‘मनुष्य के पुत्र’ की ओर संकेत करता है।
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: तीसरे दिन
  rationale: यह समय बताने वाला दत्तिव प्रयोग है; ‘तीसरे दिन’ मूल अभिव्यक्ति को बिना अनावश्यक विस्तार के ठीक प्रकार व्यक्त करता है।
- source_word: ἐγερθήσεται
  choice: जिलाया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य रूप को सुरक्षित रखते हुए यह मृत्यु के बाद जीवित किए जाने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है और कर्ता को मूल पाठ की तरह अनकहा रखता है।
- source_word: ἐλυπήθησαν σφόδρα
  choice: बहुत दुःखी हुए
  rationale: यह क्रिया और उसके तीव्रतासूचक क्रियाविशेषण को सरल, आधुनिक और भावपूर्ण हिन्दी में व्यक्त करता है।
- source_word: καὶ ... καὶ ... καὶ
  choice: और ... और ... यह सुनकर
  rationale: पहले दो संयोजकों में मूल की समन्वयी रचना रखी गई है; अंतिम καί को ‘यह सुनकर’ से प्रसंगानुकूल बनाया गया है ताकि हिन्दी में शिष्यों की प्रतिक्रिया स्वाभाविक और स्पष्ट लगे, बिना कारण में कोई नया अर्थ जोड़े।
theological_decisions:
- issue: पुनरुत्थान की भविष्यवाणी को कर्मवाच्य या कर्तृवाच्य रूप में प्रस्तुत करना
  choice: वह जिलाया जाएगा
  alternative: वह जी उठेगा
  rationale: यूनानी क्रिया भविष्यकालीन कर्मवाच्य है। कर्मवाच्य हिन्दी मूल की व्याकरणिक बनावट और परमेश्वर के निहित कार्य की सम्भावना को सुरक्षित रखती है, पर कर्ता का नाम जोड़कर अस्पष्टता को समाप्त नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘मार डालेंगे’ और ‘बहुत दुःखी हुए’ बोलचाल में स्वाभाविक हैं, जबकि ‘जिलाया जाएगा’ मूल के अर्थपूर्ण कर्मवाच्य को बनाए रखता है।
