id: MAT.17.5
reference: Matthew 17:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: hi
  text: वह अभी बोल ही रहा था कि देखो,[a] एक प्रकाशमान बादल ने उन्हें अपनी छाया में ढक लिया।[b] और देखो, बादल में से एक वाणी ने कहा, “यह मेरा प्रिय पुत्र है, जिससे मैं प्रसन्न हूँ। उसकी सुनो।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में ‘देखो’ इस पद में दो बार आया है। यह ध्यान आकर्षित करता और दृश्य की नाटकीयता बढ़ाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपनी छाया में ढक लिया’ बाइबल में परमेश्वर की प्रकट उपस्थिति से जुड़ी भाषा की प्रतिध्वनि हो सकती है।
    reason: cross_reference
  - marker: c
    text: या ‘उसे सुनो।’ यूनानी आज्ञा सुनने के साथ उसकी बात पर ध्यान देने और उसे मानने का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: वह अभी बोल ही रहा था कि
  rationale: यह संबंधवाचक कृदन्तीय रचना समकालीन क्रिया और बीच में घटित व्यवधान दिखाती है। ‘अभी बोल ही रहा था कि’ आधुनिक हिन्दी में दोनों भाव स्वाभाविक रूप से रखता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: पद में दो बार आए ध्यान आकर्षित करने वाले कथात्मक संकेत को दोनों स्थानों पर रखा गया है; इससे दृश्य की आकस्मिकता और नाटकीयता बनी रहती है।
- source_word: νεφέλη φωτεινὴ
  choice: एक प्रकाशमान बादल
  rationale: φωτεινή का अर्थ उजला, चमकीला या प्रकाशमान है। ‘प्रकाशमान’ असामान्य किंतु जानबूझकर दिए गए वर्णन को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ἐπεσκίασεν αὐτούς
  choice: उन्हें अपनी छाया में ढक लिया
  rationale: यह ἐπισκιάζω की छाया डालने और आवृत करने—दोनों छवियों को रखता है तथा सम्भावित ईश-प्रकटन संबंधी प्रतिध्वनि को मुख्य पाठ में स्पष्ट सिद्धान्त में नहीं बदलता।
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: बादल में से एक वाणी ने कहा
  rationale: ἐκ के स्रोत-बोध को ‘में से’ और λέγουσα की कथन-क्रिया को स्वाभाविक हिन्दी के सीमित क्रियापद ‘ने कहा’ से व्यक्त किया गया है।
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: मेरा प्रिय पुत्र
  rationale: यह पुत्र की पहचान और ἀγαπητός के प्रेम/प्रियता के भाव, दोनों को संक्षिप्त और प्रतिष्ठित आधुनिक हिन्दी में रखता है।
- source_word: ἐν ᾧ εὐδόκησα
  choice: जिससे मैं प्रसन्न हूँ
  rationale: यह सम्बन्धसूचक अभिव्यक्ति और परमेश्वर की प्रसन्नता को स्वाभाविक हिन्दी में व्यक्त करता है। यूनानी कालरूप को हिन्दी में वर्तमान घोषणा के रूप में देना इस सूत्र का प्रसंगगत बल बनाए रखता है।
- source_word: ἀκούετε αὐτοῦ
  choice: उसकी सुनो
  rationale: ‘किसी की सुनना’ हिन्दी में केवल ध्वनि सुनने से आगे बढ़कर उसकी बात पर ध्यान देने और मानने का भाव दे सकता है; इस प्रकार आज्ञार्थक पद की सम्भावित व्यापकता बनी रहती है।
theological_decisions:
- issue: यीशु के विषय में दिव्य घोषणा
  choice: यह मेरा प्रिय पुत्र है, जिससे मैं प्रसन्न हूँ
  alternative: यह मेरा पुत्र, मेरा प्रिय है, जिसमें मैंने प्रसन्नता पाई है
  rationale: चुना हुआ पाठ पिता द्वारा पुत्र की सीधी पहचान, प्रेम और प्रसन्नता को रखता है, पर मूल पाठ में न दिए गए बाद के पारिभाषिक धर्मशास्त्रीय शब्द नहीं जोड़ता।
- issue: ἀκούετε αὐτοῦ का आज्ञार्थक बल
  choice: उसकी सुनो
  alternative: उसे सुनो / उसकी बात मानो
  rationale: ‘उसकी सुनो’ श्रवण और ध्यानपूर्वक मानने—दोनों अर्थों के लिए खुला है। ‘उसकी बात मानो’ आज्ञापालन को अधिक स्पष्ट कर देता, जबकि यूनानी की वास्तविक अर्थ-व्यापकता बनाए रखना उचित है।
- issue: बादल द्वारा ढकने की ईश-प्रकटनात्मक प्रतिध्वनि
  choice: उन्हें अपनी छाया में ढक लिया
  alternative: उन पर छा गया
  rationale: चुना हुआ रूप मूल क्रिया की छाया और आवरण की छवि को सुरक्षित रखता है, लेकिन बादल को स्पष्ट रूप से किसी सिद्धान्तगत श्रेणी में परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘देखो’ की दोनों आवृत्तियाँ मूल की कथात्मक तीव्रता के लिए रखी गई हैं। दिव्य वाणी में सरल, प्रत्यक्ष और स्मरणीय वाक्य-विन्यास रखा गया है; ‘उसकी सुनो’ सामान्य पाठक के लिए स्वाभाविक रहते हुए मूल की अर्थगत खुलावट बनाए रखता है।
