source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: hi
  text: तब यीशु ने उसे उत्तर दिया, “हे स्त्री, तुम्हारा विश्वास[a] महान है! जैसा तुम चाहती हो, वैसा ही तुम्हारे लिए हो।” और उसी घड़ी[b] से उसकी बेटी चंगी हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारा भरोसा महान है।” यूनानी πίστις का अर्थ “भरोसा” या “विश्वासयोग्यता” भी हो सकता है, यद्यपि यहाँ “विश्वास” मुख्य अनुवाद है।
    reason: lexical_alternative
  - marker: b
    text: या “उसी क्षण से।” यूनानी में शाब्दिक रूप से “उसी घड़ी से” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कालसूचक कथात्मक शब्द पिछले संवाद के बाद यीशु की प्रतिक्रिया को स्वाभाविक ढंग से जोड़ता है।
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: यीशु ने उसे उत्तर दिया
  rationale: यूनानी में कृदंत और मुख्य क्रिया मिलकर बोलने का परिचय देते हैं; हिन्दी में यह संयुक्त अभिव्यक्ति स्वाभाविक है और αὐτῇ का अर्थ भी सुरक्षित रखती है।
- source_word: Ὦ γύναι
  choice: हे स्त्री
  rationale: ‘हे’ सीधे और बलयुक्त संबोधन को बनाए रखता है; ‘स्त्री’ γύναι का निकटतम अर्थ है और प्रसंग में अपमानसूचक नहीं है।
- source_word: μεγάλη σου ἡ πίστις
  choice: तेरा विश्वास महान है
  rationale: ‘विश्वास’ इस प्रसंग में यीशु पर भरोसा रखते हुए की गई विनती को व्यक्त करता है; ‘महान’ मूल के बलयुक्त मूल्यांकन को बनाए रखता है।
- source_word: γενηθήτω σοι ὡς θέλεις
  choice: जैसा तू चाहती है, वैसा ही तेरे लिए हो
  rationale: यह अज्ञार्थक आज्ञा के प्रभावकारी कथन और σοι के हितार्थक भाव, दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἰάθη
  choice: चंगी हो गई
  rationale: यह ἰάομαι के कर्मवाच्य चंगाई-संबंधी अर्थ को सहज, प्रचलित हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: उसी घड़ी से
  rationale: यह यूनानी की शाब्दिक काल-अभिव्यक्ति को बनाए रखता है, जिसका आशय तत्काल प्रभाव से है।
theological_decisions:
- issue: πίστις का अनुवाद
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: प्रसंग में स्त्री की यीशु पर भरोसा रखते हुए की गई विनती प्रमुख है। ‘विश्वास’ मूल शब्द की धार्मिक और संबंधपरक व्यापकता को बनाए रखता है, जबकि पादटिप्पणी ‘भरोसा’ की संभावित छाया स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। संबोधन और सर्वनाम में ‘हे स्त्री’ तथा ‘तू/तेरा’ मूल के एकवचन और प्रत्यक्ष संबोधन को रखते हैं; यहाँ ‘तू’ निकट और प्राचीन कथात्मक प्रयोग है, तिरस्कारसूचक नहीं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध शब्दों पर रखे गए हैं।
