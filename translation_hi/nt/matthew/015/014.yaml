id: MAT.15.14
reference: Matthew 15:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: hi
  text: उन्हें छोड़ दो। वे अंधे हैं—अंधों के मार्गदर्शक। पर यदि एक अंधा दूसरे अंधे को राह दिखाए,[a] तो दोनों गड्ढे[b] में गिरेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ एकवचन पुल्लिंग कहावत का प्रतिनिधिक रूप है; बात सामान्य रूप से किसी भी ऐसे व्यक्ति पर लागू होती है।
    reason: cultural_note
  - marker: b
    text: या, “खाई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: उन्हें छोड़ दो
  rationale: यहाँ ἀφίημι का अर्थ क्षमा करना नहीं, बल्कि उन्हें उनके हाल पर छोड़ देना है। संक्षिप्त हिन्दी आज्ञा मूल के उपेक्षापूर्ण बल को बनाए रखती है।
- source_word: τυφλοί
  choice: अंधे
  rationale: मूल के दृष्टिहीनता-वाले रूपक को बिना आध्यात्मिक अर्थ समझाकर विस्तार दिए ज्यों का त्यों रखा गया है।
- source_word: ὁδηγοὶ τυφλῶν
  choice: अंधों के मार्गदर्शक
  rationale: ὁδηγός का मूल चित्र ‘मार्गदर्शक’ है। ‘अगुआ’ कहने से चित्र कुछ धुँधला पड़ता; यह रूप आगे की कहावत से भी मेल खाता है।
- source_word: τυφλὸς ... τυφλὸν
  choice: एक अंधा दूसरे अंधे को
  rationale: यूनानी में दोनों पद पुल्लिंग एकवचन में हैं और कहावत में प्रतिनिधिक अर्थ रखते हैं। हिन्दी में ‘एक ... दूसरे ...’ स्वाभाविक है तथा मूल का एकवचन रूप बचाता है।
- source_word: ἐὰν ὁδηγῇ
  choice: यदि ... राह दिखाए
  rationale: ἐάν के साथ वर्तमान संभावनार्थक क्रिया सामान्य शर्त व्यक्त करती है। ‘राह दिखाए’ आधुनिक हिन्दी में स्वाभाविक है और मार्गदर्शन का चित्र बनाए रखता है।
- source_word: ἀμφότεροι
  choice: दोनों
  rationale: यह मूल के दोनों व्यक्तियों को सम्मिलित करने वाले अर्थ का सीधा और संक्षिप्त अनुवाद है।
- source_word: εἰς βόθυνον
  choice: गड्ढे में
  rationale: βόθυνος गड्ढे, खाई या खोदे हुए गहरे स्थान को सूचित कर सकता है। ‘गड्ढा’ व्यापक, सहज और चित्रात्मक हिन्दी विकल्प है।
- source_word: πεσοῦνται
  choice: गिरेंगे
  rationale: भविष्यकालीन परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘अंधे’ का रूपक
  choice: ‘अंधे’ शब्द को बिना व्याख्यात्मक विस्तार के रखा गया।
  alternative: ‘आत्मिक रूप से अंधे’ या ‘विवेकहीन’
  rationale: मूल पाठ रूपक को स्वयं बोलने देता है। अर्थ खोलकर लिखना अनुवाद में ऐसी व्याख्या जोड़ देता जिसे यूनानी स्पष्ट रूप से नहीं कहता।
- issue: कहावत में पुल्लिंग एकवचन
  choice: ‘एक अंधा दूसरे अंधे को’
  alternative: ‘एक दृष्टिहीन व्यक्ति दूसरे दृष्टिहीन व्यक्ति को’
  rationale: मूल का व्याकरणिक पुल्लिंग एकवचन सुरक्षित रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि कहावत का प्रयोग सामान्य है।
- issue: मार्गदर्शकों और अंधों का संबंध
  choice: ‘वे अंधे हैं—अंधों के मार्गदर्शक’
  alternative: ‘वे अंधे मार्गदर्शक हैं’
  rationale: यह रचना τυφλοί εἰσιν ὁδηγοὶ τυφλῶν के विधेयात्मक बल और ‘अंधों के मार्गदर्शक’ दोनों को स्पष्ट रखती है, बिना यह अस्पष्ट किए कि मार्गदर्शक स्वयं भी अंधे हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उन्हें छोड़ दो’ बोलचाल में स्पष्ट है; ‘मार्गदर्शक’ और ‘राह दिखाए’ मूल चित्र को बनाए रखते हैं। विराम-चिह्न वाला वाक्य ‘वे अंधे हैं—अंधों के मार्गदर्शक’ यूनानी की संक्षिप्त, तीखी शैली को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
