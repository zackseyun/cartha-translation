  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: hi
  text: उसे अपने पिता का आदर करने की बिल्कुल आवश्यकता नहीं है।[a] और तुमने अपनी परंपरा के कारण परमेश्वर के वचन को निष्फल कर दिया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘आदर’ में संभवतः माता-पिता की आवश्यकताओं को पूरा करना भी शामिल है, केवल सम्मान दिखाना नहीं।
    reason: lexical_alternative
  - marker: b
    text: कुछ पांडुलिपियों में ‘परमेश्वर के वचन’ के स्थान पर ‘परमेश्वर की आज्ञा’ है।
    reason: textual_variant
lexical_decisions:
- source_word: οὐ μὴ τιμήσει
  choice: आदर करने की कोई आवश्यकता नहीं
  rationale: οὐ μή का प्रबल निषेध यहाँ उस पारंपरिक निर्णय के कारण पुत्र को दायित्व से मुक्त बताता है। यह हिंदी अभिव्यक्ति उस अनुमतिमूलक भाव को स्वाभाविक रूप से व्यक्त करती है; ‘आदर’ τιμάω और माता-पिता के सम्मान की आज्ञा से शब्द-संबंध बनाए रखता है।
- source_word: τὸν πατέρα αὐτοῦ
  choice: अपने पिता का
  rationale: मूल यूनानी पाठ में केवल एकवचन ‘उसका पिता’ है; इसलिए निकटवर्ती संदर्भ से ‘माता’ को जोड़कर पाठ का विस्तार नहीं किया गया। हिंदी में कर्ता के संदर्भ में ‘अपने’ स्वाभाविक है।
- source_word: ἠκυρώσατε
  choice: निष्फल कर दिया है
  rationale: ἀκυρόω का अर्थ किसी बात को अमान्य, प्रभावहीन या निष्फल कर देना है। यह चयन आरोप की तीव्रता को रखते हुए सामान्य आधुनिक हिंदी में स्पष्ट है।
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर के वचन
  rationale: SBLGNT के λόγον का सीधा अनुवाद ‘वचन’ है। ‘आज्ञा’ वाला पाठांतर मुख्य पाठ में न लेकर पादटिप्पणी में दिया गया है।
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: अपनी परंपरा के कारण
  rationale: यहाँ διά के साथ कर्मकारक कारण को व्यक्त करता है। ‘के कारण’ बताता है कि उनकी परंपरा परमेश्वर के वचन को निष्फल करने का आधार बनी; ‘अपनी’ का संदर्भ वाक्य के ‘तुम’ से है।
- source_word: καί
  choice: इस प्रकार
  rationale: καί सामान्यतः ‘और’ है, पर यहाँ पूर्ववर्ती कथन से परिणामात्मक संबंध है। ‘इस प्रकार’ हिंदी में तर्क का संबंध स्पष्ट करता है, बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के।
theological_decisions:
- issue: क्या ‘आदर’ में माता-पिता की आर्थिक देखभाल स्पष्ट की जाए
  choice: मुख्य पाठ में ‘आदर’ रखा गया और व्यावहारिक सहायता का आशय पादटिप्पणी में बताया गया।
  alternative: ‘भरण-पोषण करना’ या ‘देखभाल करना’
  rationale: विवाद का संदर्भ माता-पिता के लिए संसाधन लगाने के दायित्व से जुड़ा है, फिर भी यूनानी क्रिया τιμάω व्यापक ‘आदर करना’ है। मुख्य पाठ में इसे संकुचित करना उचित नहीं।
- issue: क्या पाठ को संदर्भ या पाठांतर के अनुसार ‘पिता और माता’ तथा ‘परमेश्वर की आज्ञा’ किया जाए
  choice: SBLGNT के अनुसार ‘पिता’ और ‘परमेश्वर का वचन’ रखा गया।
  alternative: ‘पिता या माता’ और ‘परमेश्वर की आज्ञा’
  rationale: दिए गए मूल पाठ की विशिष्ट शब्दावली को सुरक्षित रखा गया; महत्वपूर्ण पाठांतर पादटिप्पणी में दर्ज है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। उद्धरण के समापन को दिखाने के लिए पहले वाक्य के अंत में उद्धरण-चिह्न रखा गया है। पादटिप्पणी-चिह्न संबंधित शब्द या वाक्य के तुरंत बाद हैं।
