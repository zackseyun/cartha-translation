id: MAT.15.18
reference: Matthew 15:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: hi
  text: पर जो बातें मुँह से निकलती हैं, वे हृदय से आती हैं, और वही मनुष्य को अशुद्ध करती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: जो बातें ... निकलती हैं
  rationale: नपुंसकलिंग बहुवचन कृदन्त यहाँ संज्ञा की तरह प्रयुक्त है। संदर्भ में आगे बुरे विचार और वाणी से जुड़े पाप आते हैं, इसलिए ‘बातें’ बहुवचन और मुख से निकलने की ठोस छवि दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐκ τοῦ στόματος
  choice: मुँह से
  rationale: यह सीधा और स्वाभाविक अनुवाद है तथा वाणी से जुड़ी शारीरिक छवि बनाए रखता है।
- source_word: ἐκ τῆς καρδίας
  choice: हृदय से
  rationale: ‘हृदय’ बाइबलीय प्रयोग में मनुष्य के भीतरी विचारों, इच्छाओं और नैतिक अभिप्रायों का केंद्र है; मूल रूपक को बनाए रखना उचित है।
- source_word: ἐξέρχεται
  choice: आती हैं
  rationale: यूनानी में नपुंसकलिंग बहुवचन कर्ता के साथ क्रिया एकवचन है, पर हिन्दी में बहुवचन सामंजस्य स्वाभाविक है। ‘आती हैं’ स्रोत या उद्गम को स्पष्ट करता है।
- source_word: κἀκεῖνα
  choice: और वही
  rationale: यह पहले कही गई बातों की ओर बलपूर्वक लौटता है और हिन्दी में संक्षिप्त तथा स्वाभाविक है।
- source_word: κοινοῖ
  choice: अशुद्ध करती हैं
  rationale: शुद्ध-अशुद्ध के तत्काल संदर्भ में κοινόω का अर्थ किसी को अशुद्ध ठहराना या बनाना है। ‘अशुद्ध करती हैं’ इस सांस्कृतिक-धार्मिक अर्थ को ‘भ्रष्ट’ की अपेक्षा अधिक स्पष्टता से रखता है।
- source_word: τὸν ἄνθρωπον
  choice: मनुष्य को
  rationale: यहाँ निश्चित एकवचन प्रतिनिधिक और सामान्य अर्थ में है। हिन्दी का ‘मनुष्य’ स्त्री-पुरुष दोनों को समेटते हुए मूल के सामान्य मानवीय संदर्भ और एकवचन को स्वाभाविक रूप से सुरक्षित रखता है।
theological_decisions:
- issue: नैतिक अशुद्धता का भीतरी स्रोत
  choice: वचन को इस रूप में रखा गया है कि मुख से निकलने वाली बातें हृदय से उत्पन्न होकर मनुष्य को अशुद्ध करती हैं।
  alternative: इसे केवल वाणी से उत्पन्न अनुष्ठानिक अशुद्धता तक सीमित समझना।
  rationale: निकटवर्ती संदर्भ बाहरी भोजन और भीतर से निकलने वाली बुराइयों का विरोध करता है। ‘हृदय’ और ‘अशुद्ध’ मूल की नैतिक तथा शुद्धता-संबंधी परतों को बिना अनावश्यक विस्तार के बनाए रखते हैं।
- issue: ἄνθρωπος का प्रतिनिधिक एकवचन
  choice: मनुष्य
  alternative: आदमी
  rationale: यूनानी रूप व्याकरणतः पुल्लिंग एकवचन है, किंतु यहाँ किसी पुरुष विशेष की नहीं बल्कि सामान्य मनुष्य की बात है। आधुनिक मानक हिन्दी में ‘मनुष्य’ प्रतिनिधिक एकवचन को ठीक और गरिमापूर्ण ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और बोलचाल में समझ आने वाला वाक्य-विन्यास। ‘पर’ δέ के विरोधसूचक प्रवाह को रखता है। कोई पाद-टिप्पणी आवश्यक नहीं, क्योंकि ‘मनुष्य’ सामान्य प्रतिनिधिक अर्थ और ‘अशुद्ध करती हैं’ संदर्भगत अर्थ दोनों को स्पष्ट रूप से व्यक्त करते हैं।
