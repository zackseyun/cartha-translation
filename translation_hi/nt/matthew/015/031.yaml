id: MAT.15.31
reference: Matthew 15:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: hi
  text: फलस्वरूप भीड़ यह देखकर चकित हो गई कि जो बोल नहीं सकते थे वे बोल रहे थे,[a] जिनके अंग अपंग थे वे स्वस्थ थे,[b] लँगड़े चल रहे थे और अंधे देख रहे थे; और उन्होंने इस्राएल के परमेश्वर की महिमा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बधिर बोल रहे थे।” यूनानी शब्द बधिर या मूक, दोनों के लिए प्रयुक्त हो सकता है; यहाँ “बोल रहे थे” के कारण बोलने में असमर्थ लोग अभिप्रेत होना अधिक स्वाभाविक है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिनके अंग क्षत-विक्षत थे वे ठीक हो गए थे।” यूनानी शब्द विकृत, अशक्त या क्षतिग्रस्त अंगों वाले लोगों का वर्णन कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले चंगाई-वृत्तांतों का परिणाम व्यक्त करता है और हिन्दी में स्वाभाविक रूप से वाक्य को आगे बढ़ाता है।
- source_word: ὄχλον
  choice: भीड़
  rationale: ὄχλος के लिए सामान्य, स्पष्ट और कथात्मक प्रसंग के अनुकूल आधुनिक हिन्दी शब्द।
- source_word: θαυμάσαι
  choice: चकित हो गई
  rationale: भीड़ की विस्मयपूर्ण प्रतिक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βλέποντας
  choice: यह देखकर
  rationale: पहला βλέποντας भीड़ के अवलोकन को और उसके चकित होने का कारण बताता है।
- source_word: κωφοὺς λαλοῦντας
  choice: जो बोल नहीं सकते थे वे बोल रहे हैं
  rationale: κωφός बधिर या मूक का अर्थ दे सकता है, पर λαλοῦντας के साथ यहाँ वाणी की बहाली प्रमुख है; व्यक्ति-केंद्रित हिन्दी कठोर संज्ञात्मक लेबल से भी बचती है।
- source_word: κυλλοὺς ὑγιεῖς
  choice: जिनके अंग अपंग थे वे स्वस्थ हो गए हैं
  rationale: κυλλός विकृत, अशक्त या क्षतिग्रस्त अंगों वाले लोगों की ओर संकेत करता है और ὑγιεῖς उनकी स्वस्थ दशा बताता है; यह अनुवाद दोनों तत्व स्पष्ट करता है।
- source_word: χωλοὺς περιπατοῦντας
  choice: लँगड़े चल रहे हैं
  rationale: चंगाई के इस प्रसंग में χωλός और περιπατέω का सीधा अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: τυφλοὺς βλέποντας
  choice: अंधे देख रहे हैं
  rationale: दृष्टि की बहाली को यूनानी की संक्षिप्त समानांतर रचना के अनुरूप रखता है।
- source_word: ἐδόξασαν
  choice: महिमा की
  rationale: δοξάζω का परमेश्वर के प्रति आदर और महिमा अर्पित करने वाला धार्मिक अर्थ सुरक्षित रहता है।
- source_word: τὸν θεὸν Ἰσραήλ
  choice: इस्राएल के परमेश्वर
  rationale: यूनानी संबंध-रचना का प्रचलित और स्पष्ट हिन्दी रूप।
theological_decisions:
- issue: κωφοὺς का अर्थ
  choice: जो बोल नहीं सकते थे
  alternative: बधिर
  rationale: κωφός में दोनों अर्थ संभव हैं, लेकिन साथ आया λαλοῦντας (‘बोल रहे’) यहाँ बोलने की अक्षमता और उसकी बहाली की ओर अधिक सीधे संकेत करता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- issue: κυλλοὺς ὑγιεῖς का स्वरूप
  choice: जिनके अंग अपंग थे वे स्वस्थ हो गए हैं
  alternative: कटे-फटे अंगों वाले पूर्णांग हो गए
  rationale: पाठ अंगों की गंभीर अशक्तता या विकृति और स्वस्थ दशा बताता है, पर अंगों के पुनर्सृजन को अनिवार्य रूप से स्पष्ट नहीं करता; अतः व्यापक अर्थ सुरक्षित रखा गया है।
- issue: δοξάζω का धार्मिक भाव
  choice: इस्राएल के परमेश्वर की महिमा की
  alternative: इस्राएल के परमेश्वर की स्तुति की
  rationale: ‘महिमा की’ मूल क्रिया के महिमा-अर्पण के बल को अधिक सीधे बनाए रखता है, जबकि ‘स्तुति’ अर्थ का संभव निकट रूप है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। समानांतर चंगाई-सूची की लय बनाए रखते हुए κωφός और κυλλός की वास्तविक अर्थगत व्यापकता पादटिप्पणियों में सुरक्षित की गई है।
