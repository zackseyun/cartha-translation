  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: hi
  text: जिन लोगों ने भोजन किया था, वे चार हज़ार पुरुष थे, स्त्रियों और बच्चों को छोड़कर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्त्रियों और बच्चों को गिने बिना।”
    reason: χωρίς के बहिष्करणात्मक अर्थ को अधिक स्पष्ट रूप से व्यक्त करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: भोजन करनेवाले
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त उस समूह को सूचित करता है जिसने भोजन किया था। हिन्दी में यह रूप स्वाभाविक है और प्रसंग से भोजन पूरा हो चुका होना स्पष्ट है; δέ का हल्का संयोजक बल अलग शब्द से व्यक्त करना आवश्यक नहीं।
- source_word: ἦσαν τετρακισχίλιοι
  choice: चार हज़ार थे
  rationale: साधारण क्रिया और निश्चित संख्या का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: ἄνδρες
  choice: पुरुष
  rationale: यहाँ यूनानी शब्द विशेष रूप से पुरुषों को दर्शाता है, सभी लोगों को नहीं, क्योंकि स्त्रियों और बच्चों का अलग उल्लेख है।
- source_word: χωρὶς γυναικῶν καὶ παιδίων
  choice: स्त्रियों और बच्चों के अलावा
  rationale: χωρίς बताता है कि चार हज़ार की संख्या में स्त्रियाँ और बच्चे सम्मिलित नहीं थे; ‘के अलावा’ आधुनिक हिन्दी में इस संबंध को सहज रूप से व्यक्त करता है।
- source_word: γυναικῶν
  choice: स्त्रियों
  rationale: इस गणना-सूत्र में सामान्य अर्थ ‘स्त्रियाँ’ उपयुक्त है; इसे केवल ‘पत्नियाँ’ तक सीमित करने का आधार नहीं है।
- source_word: παιδίων
  choice: बच्चों
  rationale: यह सामान्य और स्पष्ट हिन्दी शब्द है; प्रसंग किसी अधिक संकीर्ण आयु-सीमा की माँग नहीं करता।
theological_decisions:
- issue: गणना में लिंग-विशिष्ट भेद
  choice: मुख्य पाठ में ‘पुरुष’ रखा गया और स्त्रियों तथा बच्चों को अलग समूहों के रूप में बताया गया।
  alternative: ‘लोग’ कहकर कुल संख्या को समावेशी बनाना।
  rationale: ἄνδρες पुरुषों को निर्दिष्ट करता है और यूनानी पाठ स्त्रियों तथा बच्चों का अलग उल्लेख करता है। ‘लोग’ इस स्रोतगत भेद को मिटा देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य की संक्षिप्त गणना-शैली बनाए रखी गई है; डैश अंतिम अपवर्जन-वाक्यांश को स्पष्ट रूप से जोड़ता है।
