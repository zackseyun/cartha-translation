  choice: खाया
  rationale: ἐσθίω के अओरिस्ट रूप का सीधा और स्वाभाविक हिन्दी अनुवाद; यूनानी में कोई कर्म व्यक्त नहीं है।
- source_word: πάντες
  choice: सबने
  rationale: भीड़ के सभी लोगों को समाविष्ट करने वाला संक्षिप्त और स्वाभाविक प्रयोग।
- source_word: ἐχορτάσθησαν
  choice: तृप्त हो गए
  rationale: यहाँ χορτάζω का अर्थ भरपेट खाकर संतुष्ट होना है; ‘तृप्त हो गए’ अर्थ और गरिमा दोनों बनाए रखता है।
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: बचे हुए टुकड़ों को
  rationale: विशेष्यवत् कृदंत τὸ περισσεῦον और संबंधकारक κλασμάτων को स्वाभाविक हिन्दी में संयुक्त रूप से व्यक्त करता है।
- source_word: ἦραν
  choice: उठाया
  rationale: इस प्रसंग में αἴρω बचे हुए टुकड़ों को उठाकर इकट्ठा करने का बोध देता है; ‘उठाया’ मूल क्रिया के निकट है।
- source_word: ἑπτὰ σπυρίδας πλήρεις
  choice: सात बड़े टोकरे भरकर
  rationale: σπυρίς सामान्यतः अपेक्षाकृत बड़े टोकरे का संकेत दे सकता है, और πλήρεις उनके पूरे भरे होने को बताता है। हिन्दी में ‘सात बड़े टोकरे भरकर’ परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
