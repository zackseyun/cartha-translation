  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: hi
  text: पर वे व्यर्थ ही मेरी आराधना करते हैं और मनुष्यों की आज्ञाओं को सिद्धांतों के रूप में सिखाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάτην
  choice: व्यर्थ ही
  rationale: यह क्रियाविशेषण निष्फल या निरर्थक होने का भाव देता है; ‘व्यर्थ ही’ हिन्दी में स्वाभाविक है और भविष्यद्वाणी के धिक्कारपूर्ण स्वर को बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: δέ यहाँ हल्का विरोध प्रकट करता है; प्रसंग के फटकारपूर्ण कथन में ‘पर’ उपयुक्त है।
- source_word: σέβονταί με
  choice: मेरी आराधना करते हैं
  rationale: σέβομαι परमेश्वर के प्रति श्रद्धा या उपासना को सूचित करता है; ‘मेरी आराधना करते हैं’ स्वाभाविक और धार्मिक संदर्भ के अनुकूल है।
- source_word: διδάσκοντες
  choice: क्योंकि ... सिखाते हैं
  rationale: वर्तमान कृदंत उनकी आराधना के व्यर्थ होने की व्याख्यात्मक परिस्थिति बताता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि यूनानी कृदंत स्वयं कारण को पूर्णतः स्पष्ट नहीं करता।
- source_word: διδασκαλίας
  choice: सिद्धांत बनाकर
  rationale: यहाँ διδασκαλίας और ἐντάλματα के संक्षिप्त संबंध का अर्थ है कि मानवीय आज्ञाएँ प्रामाणिक शिक्षाओं के रूप में सिखाई जाती हैं; ‘सिद्धांत बनाकर’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: ἐντάλματα
  choice: आज्ञाओं
  rationale: शब्द निर्धारित आदेशों के लिए है; ‘आज्ञाएँ’ औपचारिक धार्मिक अर्थ बनाए रखता है।
- source_word: ἀνθρώπων
  choice: मनुष्यों की
  rationale: ἄνθρωπος यहाँ लिंग-विशिष्ट नहीं, बल्कि मनुष्य-मात्र का सूचक है और मानवीय स्रोत को ईश्वरीय स्रोत के विपरीत रखता है; ‘मनुष्यों की’ आधुनिक हिन्दी में सटीक है।
theological_decisions:
- issue: διδασκαλίας ἐντάλματα ἀνθρώπων का संबंध
  choice: मनुष्यों की आज्ञाओं को सिद्धांत बनाकर सिखाते हैं
  alternative: सिद्धांतों के रूप में मनुष्यों की आज्ञाएँ सिखाते हैं
  rationale: यूनानी वाक्यांश संक्षिप्त और कुछ हद तक अस्पष्ट है। मुख्य पाठ यह अर्थ स्पष्ट करता है कि मानवीय आज्ञाओं को सिद्धांत का दर्जा देकर सिखाया जाता है; पाद-टिप्पणी निकटतर वैकल्पिक संरचना सुरक्षित रखती है।
- issue: ἀνθρώπων का सामान्य मानवीय अर्थ
  choice: मनुष्यों की
  alternative: लोगों की / मानवीय
  rationale: यह शब्द पुरुषों तक सीमित नहीं है। ‘मनुष्यों की’ मानवीय और ईश्वरीय स्रोत के बीच निहित विरोध को स्पष्ट रखते हुए स्रोत के सामान्य अर्थ को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण धार्मिक शैली। ‘आराधना’, ‘आज्ञाएँ’ और ‘सिद्धांत’ सामान्य पाठकों के लिए बोधगम्य रहते हुए उद्धरण के औपचारिक स्वर को बनाए रखते हैं।
