id: MAT.15.22
reference: Matthew 15:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: hi
  text: और देखो, उन इलाकों से निकलकर एक कनानी स्त्री लगातार पुकार रही थी, “हे प्रभु, दाऊद के पुत्र, मुझ पर दया कीजिए! मेरी बेटी दुष्टात्मा से बुरी तरह ग्रस्त है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्टात्मा उसे बुरी तरह सताती है”; या, “वह बुरी तरह दुष्टात्मा के वश में है।”
    reason: यूनानी क्रिया δαιμονίζεται दुष्टात्मिक प्रभाव को बताती है, पर उसकी सटीक प्रकृति को एक ही तरह से निर्धारित नहीं करती।
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाले कथात्मक संकेत की जीवंतता बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Χαναναία
  choice: कनानी
  rationale: मत्ती के ऐतिहासिक और धर्मग्रंथीय रूप से अर्थपूर्ण जातीय पद को ज्यों का त्यों रखता है; मरकुस के समानांतर वर्णन से ‘सूरूफिनीकी’ नहीं लिया गया।
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: उन इलाकों से
  rationale: ὅρια के क्षेत्रीय अर्थ और यूनानी के बहुवचन को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐξελθοῦσα
  choice: निकलकर
  rationale: अओरिस्ट कृदंत को मुख्य क्रिया से पहले की संबद्ध क्रिया के रूप में संक्षिप्त और स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: ἔκραζεν
  choice: लगातार पुकार रही थी
  rationale: अपूर्ण भूतकाल की जारी या बार-बार होने वाली क्रिया को स्पष्ट करता है।
- source_word: Ἐλέησόν με
  choice: मुझ पर दया कीजिए
  rationale: विनती की तात्कालिकता तथा दया की धर्मग्रंथीय शब्दावली, दोनों को स्वाभाविक आदरसूचक हिन्दी में रखता है।
- source_word: κύριε
  choice: हे प्रभु
  rationale: ‘दाऊद के पुत्र’ के साथ यह संबोधन केवल सामान्य शिष्टाचार से अधिक श्रद्धापूर्ण और संभवतः मसीही अर्थ रखता है।
- source_word: υἱὸς Δαυίδ
  choice: दाऊद के पुत्र
  rationale: दाऊदी राजवंश और मसीही आशा से जुड़े पद को सीधे और पहचानने योग्य रूप में सुरक्षित रखता है।
- source_word: κακῶς
  choice: बुरी तरह
  rationale: बेटी की दशा की गंभीरता को सीधे, सामान्य और गैर-चिकित्सकीय हिन्दी में व्यक्त करता है।
- source_word: δαιμονίζεται
  choice: दुष्टात्मा से ग्रस्त है
  rationale: दुष्टात्मिक प्रभाव को स्पष्ट करने वाला प्रचलित और संक्षिप्त हिन्दी प्रयोग है, जबकि क्रिया की सटीक प्रकृति को फुटनोट में खुला रखा गया है।
theological_decisions:
- issue: मसीही संबोधन के प्रसंग में κύριε का अनुवाद
  choice: हे प्रभु
  alternative: हे स्वामी / महोदय
  rationale: ‘दाऊद के पुत्र’ के साथ प्रयुक्त होने के कारण यह श्रद्धा और संभावित मसीही पहचान को व्यक्त करता है, पर स्त्री के विश्वास की पूर्ण धर्मवैज्ञानिक परिभाषा नहीं करता।
- issue: δαιμονίζεται में दुष्टात्मिक दशा की प्रकृति
  choice: दुष्टात्मा से ग्रस्त है
  alternative: दुष्टात्मा उसे बुरी तरह सताती है / वह दुष्टात्मा के वश में है
  rationale: मूल पाठ दुष्टात्मिक कारक को स्पष्ट करता है, लेकिन प्रभाव, उत्पीड़न और अधिकार की सटीक दशा नहीं समझाता। मुख्य पाठ में प्रचलित अभिव्यक्ति रखी गई है और विकल्प फुटनोट में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लगातार पुकार रही थी’ अपूर्ण भूतकाल की निरंतरता व्यक्त करता है। फुटनोट चिह्न [a] उसी वाक्यांश के बाद रखा गया है जिससे उसका संबंध है।
