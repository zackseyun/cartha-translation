  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: hi
  text: पर तुम कहते हो, ‘जो कोई अपने पिता या माता से कहे, “मुझसे तुम्हें जो कुछ लाभ मिल सकता था, वह भेंट है,”’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपहार है।” आशय यह है कि माता-पिता की सहायता के लिए इस्तेमाल हो सकने वाली वस्तु को परमेश्वर के लिए समर्पित घोषित किया जाता था; मरकुस 7:11 में इसके लिए “कुरबान” शब्द आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: पर तुम कहते हो
  rationale: δὲ पिछले पद की आज्ञा के साथ विरोध दर्शाता है; वर्तमानकालीन λέγετε को सामान्य कथन के रूप में रखा गया है।
- source_word: Ὃς ἂν εἴπῃ
  choice: जो कोई ... कहे
  rationale: सापेक्ष सर्वनाम, ἄν और एओरिस्ट सब्जंक्टिव मिलकर अनिश्चित सामान्य शर्त व्यक्त करते हैं; हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: अपने पिता या माता से
  rationale: डेटिव यहाँ संबोधित अप्रत्यक्ष कर्म है; हिन्दी में ‘से कहे’ स्वाभाविक है और ‘अपने’ सम्बन्ध स्पष्ट करता है।
- source_word: Δῶρον
  choice: परमेश्वर को भेंट
  rationale: δῶρον का अर्थ ‘भेंट’ या ‘उपहार’ है। प्रसंग में वस्तु परमेश्वर के लिए अर्पित घोषित की गई है; ‘परमेश्वर को’ निहित धार्मिक आशय स्पष्ट करता है, जबकि तकनीकी शब्द ‘कुरबान’ को मुख्य पाठ में नहीं लाता।
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: मुझसे तुम्हें जो लाभ मिल सकता था
  rationale: ἐξ ἐμοῦ को ‘मुझसे’ और निष्क्रिय ὠφεληθῇς को ‘लाभ मिल सकता था’ से व्यक्त किया गया है; इससे माता-पिता को मिलने वाली पर अब रोक दी गई सहायता का भाव बना रहता है।
theological_decisions:
- issue: क्या मरकुस 7:11 का तकनीकी शब्द ‘कुरबान’ मत्ती के पाठ में लाया जाए
  choice: मत्ती के δῶρον को ‘भेंट’ के रूप में रखा गया
  alternative: ‘कुरबान’ अथवा ‘परमेश्वर को समर्पित भेंट’
  rationale: मत्ती में δῶρον है, κορβᾶν नहीं। इसलिए मूल-पाठ की शब्दावली रखी गई और समानांतर पद की जानकारी पाद-टिप्पणी में दी गई।
- issue: भेंट किसे दी या समर्पित मानी गई है
  choice: ‘परमेश्वर को’ स्पष्ट किया गया
  alternative: केवल ‘भेंट है’
  rationale: धार्मिक समर्पण इस कथन के विवाद का आवश्यक प्रासंगिक आशय है। यह ‘कुरबान’ जैसी मरकुस की विशिष्ट शब्दावली आयात किए बिना हिन्दी पाठ को समझने योग्य बनाता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘लाभ मिल सकता था’ मूल के निष्क्रिय रूप तथा सम्भावित, किन्तु न मिली सहायता को व्यक्त करता है। पाद-टिप्पणी चिह्न उद्धृत कथन के बाद रखा गया है, क्योंकि वह δῶρον और पूरे समर्पण-वाक्य की व्याख्या करता है।
