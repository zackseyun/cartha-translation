  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: hi
  text: “ये लोग अपने होंठों से मेरा आदर करते हैं, पर उनका हृदय[a] मुझसे दूर है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके हृदय।” यूनानी में “हृदय” एकवचन है, जिसका प्रयोग संभवतः पूरी प्रजा के लिए सामूहिक अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: ये लोग
  rationale: λαός यहाँ सामूहिक रूप से लोगों को दर्शाता है और οὗτος संकेतवाचक है। ‘ये लोग’ आधुनिक हिन्दी में स्वाभाविक है तथा मूल के संकेत और सामूहिक संदर्भ दोनों को बनाए रखता है।
- source_word: τοῖς χείλεσίν
  choice: अपने होंठों से
  rationale: करण कारक के भाव को ‘से’ व्यक्त करता है। ‘होंठों’ की ठोस शारीरिक छवि को बनाए रखा गया है; ‘अपने’ हिन्दी में कर्ता से संबंध स्वाभाविक रूप से स्पष्ट करता है।
- source_word: με τιμᾷ
  choice: मेरा आदर करते हैं
  rationale: τιμάω का अर्थ यहाँ आदर देना है। सामूहिक ‘लोग’ के साथ हिन्दी में बहुवचन क्रिया स्वाभाविक है, जबकि με को ‘मेरा’ के द्वारा हिन्दी की सामान्य संरचना में व्यक्त किया गया है।
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: पर उनका हृदय
  rationale: δέ का विरोधसूचक भाव ‘पर’ से व्यक्त हुआ है। καρδία के यूनानी एकवचन को ‘हृदय’ के रूप में रखा गया है, जिससे पूरे समुदाय की सामूहिक आंतरिक दशा का भाव बना रहता है।
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: मुझसे दूर है
  rationale: यह सहज आधुनिक हिन्दी में दूरी और संबंधगत अलगाव दोनों को व्यक्त करता है, बिना मूल से अधिक अर्थ जोड़े।
theological_decisions:
- issue: सामूहिक एकवचन ‘हृदय’ या व्यक्तिवाचक बहुवचन
  choice: उनका हृदय
  alternative: उनके हृदय
  rationale: यूनानी पाठ में καρδία एकवचन है और संभवतः पूरी प्रजा की एक सामूहिक आंतरिक प्रवृत्ति प्रस्तुत करता है। एकवचन बनाए रखने से भविष्यद्वाणी के उद्धरण की अलंकारिक शक्ति और वास्तविक व्याकरणिक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘होंठों’ और ‘हृदय’ की मूल ठोस छवियाँ सुरक्षित हैं। उद्धरण का बाहरी आदर और भीतरी दूरी के बीच का विरोध स्पष्ट रखा गया है।
