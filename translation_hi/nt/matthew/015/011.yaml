id: MAT.15.11
reference: Matthew 15:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: hi
  text: जो मुँह में जाता है, वह मनुष्य[a] को अपवित्र[b] नहीं करता; बल्कि जो मुँह से निकलता है, वही मनुष्य को अपवित्र करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मनुष्य’ किसी भी मानव को सामान्य रूप से दर्शाता है; बात केवल पुरुषों के विषय में नहीं है।
    reason: cultural_note
  - marker: b
    text: या, ‘अशुद्ध’। यूनानी क्रिया शुद्धता के संदर्भ में किसी को अशुद्ध या अपवित्र करने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: अपवित्र करता है
  rationale: शुद्धता के इस प्रसंग में κοινόω किसी को अपवित्र या अशुद्ध ठहराने/बनाने का भाव रखता है। ‘अपवित्र करता है’ हिन्दी में सहज है और केवल शारीरिक गंदगी का अर्थ दिए बिना धार्मिक तथा नैतिक अशुद्धता—दोनों की अर्थ-छाया बनाए रखता है।
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: जो मुँह में जाता है
  rationale: लेखयुक्त कृदंत का संज्ञात्मक प्रयोग हिन्दी में ‘जो ... जाता है’ से स्वाभाविक रूप में व्यक्त होता है; ‘मुँह में’ εἰς की दिशात्मकता और ठोस चित्र को बनाए रखता है।
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: जो मुँह से निकलता है
  rationale: यह संज्ञात्मक कृदंत आधुनिक हिन्दी में इस रूप में स्पष्ट और सहज है; ‘मुँह से’ ἐκ के स्रोत-बोध को ठीक प्रकार व्यक्त करता है।
- source_word: ἄνθρωπον
  choice: मनुष्य
  rationale: ἄνθρωπος यहाँ एक प्रतिनिधिक एकवचन के रूप में सामान्यतः किसी भी मानव को दर्शाता है। ‘मनुष्य’ हिन्दी में गरिमापूर्ण, सहज और व्याकरणतः एकवचन है तथा प्रसंग के सार्वभौमिक आशय को स्पष्ट रखता है।
- source_word: τοῦτο
  choice: वही
  rationale: 'यूनानी संकेतवाचक दूसरे खंड पर विशेष बल देता है। ‘वही’ विरोध को स्पष्ट करता है: मुँह से निकलने वाली बात ही मनुष्य को अपवित्र करती है।'
- source_word: οὐ ... ἀλλὰ
  choice: नहीं ... बल्कि
  rationale: यह हिन्दी में निषेध और प्रबल विरोध की स्वाभाविक रचना है तथा यूनानी वाक्य की प्रतिपक्षी संरचना को स्पष्ट बनाए रखती है।
theological_decisions:
- issue: κοινόω में शुद्धता-संबंधी भाषा
  choice: ‘अपवित्र करता है’ रखा गया है, ताकि धार्मिक और नैतिक अशुद्धता की संयुक्त अर्थ-छाया बनी रहे।
  alternative: ‘अशुद्ध करता है’
  rationale: कथन शुद्धता के विवाद के बीच है, पर इसका आशय केवल अनुष्ठानिक स्थिति तक सीमित नहीं किया जाना चाहिए। ‘अपवित्र’ इस व्यापक तनाव को बनाए रखता है।
- issue: ἄνθρωπον का प्रतिनिधिक एकवचन
  choice: मुख्य पाठ में ‘मनुष्य’ रखा गया है और पादटिप्पणी में उसके सामान्य मानवीय आशय को स्पष्ट किया गया है।
  alternative: ‘व्यक्ति’ या ‘आदमी’
  rationale: यूनानी शब्द व्याकरणतः एकवचन है और यहाँ किसी एक पुरुष तक सीमित न होकर मानव-जाति के किसी भी सदस्य के लिए प्रतिनिधिक रूप में प्रयुक्त है। ‘मनुष्य’ हिन्दी में इस दोनों पक्षों को स्वाभाविक रूप से संभालता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, मौखिक शिक्षा के अनुरूप और गरिमापूर्ण शैली। ‘मुँह’ सामान्य पाठक के लिए ‘मुख’ से अधिक स्वाभाविक है, जबकि ‘मनुष्य’ और ‘अपवित्र’ प्रसंग की गंभीरता तथा शुद्धता-संबंधी अर्थ को बनाए रखते हैं।
