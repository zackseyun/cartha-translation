- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: पहाड़ पर चढ़कर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले चढ़ने की क्रिया दर्शाता है; हिंदी का ‘चढ़कर’ क्रम को संक्षेप और स्वाभाविक ढंग से रखता है। निश्चित उपपद किसी नामित पहाड़ को अनिवार्यतः सूचित नहीं करता।
- source_word: ἐκάθητο ἐκεῖ
  choice: वे वहाँ बैठ गए
  rationale: हिंदी कथावाचन में यह चढ़ने के बाद बैठने की क्रिया को सहजता से व्यक्त करता है। यूनानी अपूर्ण काल की संभावित स्थितिमूलक या जारी रहने वाली छाया को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ὁ Ἰησοῦς
  choice: यीशु
  rationale: नाम का मानक हिंदी लिप्यंतरण।
