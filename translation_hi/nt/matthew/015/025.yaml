    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह शब्द पिछले संवाद के बाद स्त्री की दृढ़ता को दिखाने वाला हल्का विरोध प्रकट करता है।
- source_word: ἐλθοῦσα
  choice: पास आकर
  rationale: अओरिस्ट कृदंत को स्वाभाविक हिन्दी में पूर्वकालिक क्रिया के रूप में व्यक्त किया गया है; संदर्भ में यीशु के निकट आने का भाव निहित है।
- source_word: προσεκύνει αὐτῷ
  choice: उसके सामने घुटनों के बल झुकी
  rationale: प्रσκυνέω शारीरिक रूप से झुककर आदर देने से लेकर आराधना करने तक का अर्थ रख सकता है। मुख्य पाठ शारीरिक आदर की मुद्रा को व्यक्त करता है, जबकि आराधना का संभावित अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: λέγουσα
  choice: और कहने लगी
  rationale: कृदंत को आधुनिक हिन्दी में मुख्य क्रिया से जोड़कर स्वाभाविक ढंग से व्यक्त किया गया है। अपूर्णकालिक मुख्य क्रिया के साथ यह विनती की जीवंतता भी बनाए रखता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यीशु के लिए प्रयुक्त इस गंभीर और आदरपूर्ण संबोधन का मानक हिन्दी रूप 'प्रभु' है; 'महोदय' संदर्भ में अत्यधिक हल्का होता।
- source_word: βοήθει μοι
  choice: मेरी सहायता कीजिए
  rationale: वर्तमान आज्ञार्थक की तत्काल और संक्षिप्त विनती को सम्मानसूचक, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यीशु के प्रति προσκυνέω का अर्थ
  choice: उसके सामने घुटनों के बल झुकी
  alternative: उसकी आराधना की
  rationale: क्रिया आदर में झुकने, दंडवत करने अथवा आराधना करने को सूचित कर सकती है। मुख्य पाठ दृश्य शारीरिक क्रिया को सामने रखता है और स्त्री की धार्मिक समझ को आवश्यकता से अधिक निश्चित नहीं करता; वैध आराधना-संबंधी अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सम्मानसूचक प्रयोग। 'घुटनों के बल झुकी' दृश्य मुद्रा तथा आदर दोनों व्यक्त करता है; पादटिप्पणी मूल यूनानी की अर्थगत व्यापकता बनाए रखती है।
