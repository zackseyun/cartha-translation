source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: hi
  text: पर उसने उत्तर दिया[a], “मैं केवल इस्राएल के घराने की खोई हुई भेड़ों के पास ही भेजा गया था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “मैं इस्राएल के घराने की खोई हुई भेड़ों के सिवा किसी और के पास नहीं भेजा गया था।”
    reason: εἰ μὴ वाली मूल अपवादात्मक और नकारात्मक रचना का अधिक शाब्दिक विकल्प।
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: उसने उत्तर दिया
  rationale: यूनानी कृदन्त और मुख्य क्रिया के इस संयोजन को स्वाभाविक हिन्दी में एक ही वाक्यांश से व्यक्त किया गया है; इससे उत्तर देने का भाव पूर्णतः बना रहता है।
- source_word: Οὐκ ἀπεστάλην
  choice: मैं ... भेजा गया हूँ
  rationale: ἀποστέλλω का कर्मवाच्य रूप किसी उद्देश्यपूर्ण भेजे जाने या नियुक्त मिशन को व्यक्त करता है। हिन्दी में ‘भेजा गया हूँ’ उस पूर्व घटना और वर्तमान मिशन—दोनों का स्वाभाविक बोध कराता है।
- source_word: εἰ μὴ
  choice: केवल
  rationale: यह रचना अपवाद द्वारा सीमा निर्धारित करती है। मुख्य पाठ में ‘केवल’ स्पष्ट और स्वाभाविक हिन्दी है; अधिक शाब्दिक नकारात्मक रचना पादटिप्पणी में दी गई है।
- source_word: πρόβατα
  choice: भेड़ों
  rationale: मूल रूपक को बनाए रखने के लिए सामान्य और सीधा समतुल्य चुना गया है; लोगों के अर्थ में इसकी व्याख्या पाठ में जोड़ना उचित नहीं होगा।
- source_word: ἀπολωλότα
  choice: खोई हुई
  rationale: भटकी या गुम हुई भेड़ों के रूपक में ‘खोई हुई’ उपयुक्त है। ‘नष्ट हुई’ यहाँ अन्तिम विनाश का अनावश्यक रूप से अधिक प्रबल अर्थ दे सकता है।
- source_word: οἴκου Ἰσραήλ
  choice: इस्राएल के घराने
  rationale: ‘घराना’ इस बाइबलीय राष्ट्रीय और वाचा-संबंधी मुहावरे को सुरक्षित रखते हुए आधुनिक हिन्दी में समझने योग्य है।
- source_word: δὲ
  choice: पर
  rationale: δέ यहाँ पिछले प्रसंग के साथ हल्का विरोध या कथात्मक मोड़ दिखाता है; ‘पर’ इसे संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
theological_decisions:
- issue: इस कथन में यीशु के बताए हुए मिशन की सीमा
  choice: कथन को इस प्रसंग में इस्राएल तक सीमित मिशन के रूप में स्पष्टतः रखा गया है।
  alternative: इसे केवल इस्राएल की प्राथमिकता बताने के रूप में नरम करना, अथवा बाद में अन्यजातियों तक पहुँचे मिशन को इसी पद में जोड़ देना।
  rationale: Οὐκ ... εἰ μὴ स्पष्ट रूप से प्रतिबंधात्मक है। अनुवाद कथात्मक और धर्मवैज्ञानिक तनाव को बनाए रखता है तथा व्यापक कैनोनिक घटनाक्रम के आधार पर इस कथन को चुपचाप विस्तृत नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इस्राएल का घराना’ बाइबलीय मुहावरे को सुरक्षित रखता है, जबकि ‘केवल’ मुख्य कथन को सामान्य पाठक के लिए स्वाभाविक बनाता है।
