source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: hi
  text: पर उन्होंने उसे एक शब्द भी उत्तर नहीं दिया। तब उनके शिष्य पास आकर उनसे बार-बार अनुरोध करने लगे, “उसे विदा कर दीजिए[a], क्योंकि वह हमारे पीछे[b] ज़ोर से पुकार रही है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसे भेज दीजिए।’ शिष्यों के शब्दों से यह स्पष्ट नहीं होता कि उनका अर्थ था, ‘उसकी माँग पूरी करके उसे विदा कर दीजिए,’ या केवल, ‘उसे हमारे पास से भेज दीजिए।’
    reason: alternative_reading
  - marker: b
    text: या ‘हमारा पीछा करते हुए।’ यूनानी पद का अर्थ स्थान की दृष्टि से ‘हमारे पीछे’ अथवा किसी के पीछे आने की दृष्टि से ‘हमारा पीछा करते हुए’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῇ λόγον
  choice: उसे एक शब्द भी उत्तर नहीं दिया
  rationale: 'यह यूनानी मुहावरे के जोर को स्वाभाविक हिन्दी में बनाए रखता है: उन्होंने उस स्त्री को कोई उत्तर नहीं दिया।'
- source_word: προσελθόντες
  choice: पास आकर
  rationale: यह यीशु की ओर शिष्यों के बढ़कर आने को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἠρώτουν
  choice: बार-बार आग्रह करने लगे
  rationale: अपूर्ण भूतकाल निरंतर या दोहराए गए अनुरोध का संकेत देता है। ‘आग्रह’ यहाँ ἐρωτάω की अनुरोधात्मक शक्ति दिखाता है, पर इसे अत्यधिक तीव्र ‘गिड़गिड़ाना’ नहीं बनाता।
- source_word: Ἀπόλυσον αὐτήν
  choice: उसे विदा कर दीजिए
  rationale: ἀπολύω का प्रसंगानुकूल अर्थ किसी को विदा करना या भेज देना है। यह वाक्य इस बात को अनिर्णीत रखता है कि शिष्य उसकी माँग पूरी करवाकर उसे विदा कराना चाहते थे या केवल उसे वहाँ से हटाना।
- source_word: κράζει
  choice: पुकार रही है
  rationale: κράζω ऊँची आवाज़ में पुकारने को दर्शाता है; वर्तमान काल की जारी क्रिया को ‘रही है’ व्यक्त करता है।
- source_word: ὄπισθεν ἡμῶν
  choice: हमारे पीछे
  rationale: यह स्थानवाचक अर्थ को सीधे रखता है, जबकि पीछा करते आने का सम्भव भाव पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: Ἀπόλυσον αὐτήν में शिष्यों का आशय
  choice: ‘उसे विदा कर दीजिए’ के रूप में तटस्थ अनुवाद
  alternative: ‘उसकी विनती मानकर उसे विदा कर दीजिए’ या ‘उसे यहाँ से भगा दीजिए’
  rationale: यूनानी आज्ञा यह स्पष्ट नहीं करती कि शिष्य यीशु से स्त्री की माँग पूरी करने को कह रहे थे या केवल उसे दूर भेजने को। तटस्थ भाषा कथा की वास्तविक अस्पष्टता और तनाव को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यीशु के लिए आदरसूचक बहुवचन (‘उन्होंने’, ‘उनसे’, ‘दीजिए’) और शिष्यों के लिए प्रचलित ‘शिष्य’ का प्रयोग किया गया है। मुख्य पाठ में अस्पष्टताओं को अनावश्यक रूप से नहीं सुलझाया गया।
