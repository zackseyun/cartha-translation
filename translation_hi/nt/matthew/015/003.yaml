id: MAT.15.3
reference: Matthew 15:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: hi
  text: पर उसने उन्हें उत्तर दिया, “तुम भी अपनी परंपरा के कारण[a] परमेश्वर की आज्ञा क्यों तोड़ते हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपनी परंपरा की खातिर।’
    reason: διά के साथ कर्मकारक को यहाँ ‘के कारण’ अथवा ‘की खातिर’ समझा जा सकता है।
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: उत्तर दिया
  rationale: यह यूनानी में प्रचलित सामी-प्रभावित संयुक्त अभिव्यक्ति है। हिन्दी में ‘उत्तर दिया’ स्वाभाविक रूप से दोनों क्रियात्मक तत्वों का आशय व्यक्त करता है; ‘उत्तर देकर कहा’ अनावश्यक रूप से बोझिल लगता है।
- source_word: Διὰ τί
  choice: क्यों
  rationale: कारण पूछने वाली इस अभिव्यक्ति का आधुनिक हिन्दी में स्वाभाविक और सटीक रूप ‘क्यों’ है।
- source_word: καὶ ὑμεῖς
  choice: तुम भी
  rationale: '‘भी’ पिछले आरोप की ओर प्रत्युत्तरात्मक संकेत बनाए रखता है: आरोप केवल चेलों पर नहीं, आरोप लगाने वालों पर भी लागू होता है।'
- source_word: παραβαίνετε
  choice: तोड़ते हो
  rationale: क्रिया का अर्थ किसी आज्ञा का उल्लंघन करना है। ‘आज्ञा तोड़ना’ सामान्य आधुनिक हिन्दी में स्पष्ट है और ‘उल्लंघन करते हो’ की अपेक्षा अधिक सहज है।
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: परमेश्वर की आज्ञा
  rationale: यह सम्बन्धकारक रचना को स्वाभाविक हिन्दी में व्यक्त करती और दिव्य आदेश का बाइबलीय महत्व बनाए रखती है।
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: अपनी परंपरा के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण अथवा आधार सूचित कर सकता है। ‘के कारण’ सहज हिन्दी है; ‘की खातिर’ वाला संभावित हितार्थक भाव पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर की आज्ञा और मानवीय परंपरा के बीच विरोध
  choice: ‘परमेश्वर की आज्ञा’ और ‘अपनी परंपरा’
  alternative: ‘परमेश्वर का आदेश’ और ‘तुम्हारी रीति’
  rationale: ‘आज्ञा’ और ‘परंपरा’ मूल पाठ के सीधे विरोध को बनाए रखते हैं। ‘अपनी’ से आरोप विशेष रूप से इन्हीं श्रोताओं की परंपरा पर रहता है और इसे हर प्रकार की परंपरा की सार्वभौमिक निन्दा नहीं बनाया जाता।
- issue: διά के कारणात्मक अथवा हितार्थक भाव की गुंजाइश
  choice: मुख्य पाठ में ‘के कारण’
  alternative: ‘की खातिर’
  rationale: संदर्भ में उनकी परंपरा परमेश्वर की आज्ञा तोड़ने का कारण या आधार है। फिर भी ‘की खातिर’ से परंपरा को बचाने अथवा उसका पक्ष लेने का भाव सम्भव है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘परमेश्वर’ बाइबलीय हिन्दी का परिचित पद है; ‘आज्ञा तोड़ते हो’ सामान्य पाठक के लिए सहज रहते हुए मूल आरोप की गंभीरता बनाए रखता है।
