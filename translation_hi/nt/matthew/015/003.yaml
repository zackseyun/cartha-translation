  source_fidelity: 'The Hindi accurately represents the Greek: ‘पर’ appropriately carries δέ in context; ‘उत्तर दिया’ is idiomatic for ἀποκριθεὶς εἶπεν; ‘तुम भी’ retains καὶ ὑμεῖς; ‘परमेश्वर की आज्ञा’ conveys τὴν ἐντολὴν τοῦ θεοῦ; and ‘अपनी परंपरा के कारण’ naturally expresses διὰ τὴν παράδοσιν ὑμῶν. The interrogative word order preserves the rebuking force without adding interpretation.'
  naturalness: The wording is fluent, modern standard Hindi and maintains an appropriately dignified biblical register. ‘आज्ञा क्यों तोड़ते हो?’ is clear and idiomatic. The reflexive ‘अपनी’ is natural with the second-person subject and accurately identifies the tradition as theirs.
  terminology: ‘परमेश्वर,’ ‘आज्ञा,’ and ‘परंपरा’ are suitable established Hindi biblical terms. They preserve the text’s specific contrast between God’s command and the interlocutors’ tradition, without implying a condemnation of all tradition. The footnote’s ‘की खातिर’ is a legitimate contextual alternative for the force of διά with the accusative.
