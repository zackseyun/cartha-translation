base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: hi
  text: और यीशु वहाँ से निकलकर सूर और सैदा के क्षेत्र में चले गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वहाँ से हटकर सूर और सैदा के इलाके की ओर चले गए।” यूनानी क्रिया का अर्थ सामान्य रूप से “चले गए” भी हो सकता है, पर मत्ती में इसके प्रयोग में कभी-कभी अलग हट जाने की छाया होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: सरल कथात्मक संयोजक के रूप में यह पिछले प्रसंग से स्वाभाविक संबंध बनाए रखता है।
- source_word: ἐξελθὼν ἐκεῖθεν
  choice: वहाँ से निकलकर
  rationale: पूर्वकालिक कृदंत और स्थानवाचक क्रियाविशेषण—पहले वहाँ से निकलना, फिर मुख्य क्रिया—को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἀνεχώρησεν
  choice: चले गए
  rationale: आधुनिक हिन्दी में स्वाभाविक है और बिना कोई असिद्ध उद्देश्य जोड़े वहाँ से हटकर दूसरे क्षेत्र में जाने का अर्थ देता है। मत्ती में प्रयुक्त क्रिया में कभी-कभी पीछे हटने की छाया हो सकती है, जिसे पादटिप्पणी में दर्शाया गया है।
- source_word: εἰς τὰ μέρη
  choice: के क्षेत्र में
  rationale: सामान्य भूभाग की ओर या उसमें जाने को व्यक्त करता है; इससे यह अनिवार्य निष्कर्ष नहीं निकलता कि यीशु दोनों नगरों में स्वयं गए।
- source_word: Τύρου καὶ Σιδῶνος
  choice: सूर और सैदा
  rationale: इन फिनीकी नगरों के प्रचलित हिन्दी बाइबलीय नाम अपनाए गए हैं; संबंधवाचक रूप ‘के क्षेत्र’ के साथ स्पष्ट है।
theological_decisions:
- issue: गैर-यहूदी क्षेत्र से जुड़े भूभाग की ओर यीशु की गति का कथात्मक आशय
  choice: मुख्य पाठ में तटस्थ और स्वाभाविक ‘चले गए’ रखा गया है, तथा संभावित ‘अलग हट गए’ की छाया पादटिप्पणी में दी गई है।
  alternative: ‘पीछे हट गए’ या ‘वहाँ से अलग हट गए’ को मुख्य पाठ में रखना।
  rationale: यूनानी क्रिया मत्ती में रणनीतिक रूप से हटने का संकेत दे सकती है, पर यह पद उद्देश्य नहीं बताता। इसलिए अनुवाद उस उद्देश्य को निश्चित नहीं करता और वास्तविक अर्थ-छाया को पादटिप्पणी द्वारा सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘सूर और सैदा’ प्रचलित हिन्दी बाइबलीय स्थान-नाम हैं। मुख्य वाक्य में अनावश्यक मनोवैज्ञानिक या धर्मवैज्ञानिक उद्देश्य नहीं जोड़ा गया।
