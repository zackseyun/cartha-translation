source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: hi
  text: पर उसने उत्तर दिया, “हर पौधा जिसे मेरे स्वर्गीय पिता ने नहीं लगाया, जड़ से उखाड़ दिया जाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: उत्तर दिया
  rationale: यूनानी में दोनों क्रियाओं वाला सामी-प्रभावित कथात्मक सूत्र है। आधुनिक हिन्दी में केवल ‘उत्तर दिया’ स्वाभाविक है और दोनों क्रियाओं का संयुक्त आशय स्पष्ट रूप से व्यक्त करता है; ‘उत्तर देकर कहा’ अनावश्यक रूप से बोझिल लगेगा।
- source_word: Πᾶσα
  choice: हर
  rationale: एकवचन संज्ञा के साथ इसका वितरणात्मक अर्थ है; ‘हर’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: φυτεία
  choice: पौधा
  rationale: यह शब्द किसी लगाई हुई वस्तु अथवा रोपण को सूचित कर सकता है। ‘पौधा’ उखाड़े जाने की आगे की छवि के साथ स्वाभाविक रूप से मेल खाता और रूपक को खुला रखता है।
- source_word: ἐφύτευσεν
  choice: लगाया
  rationale: यह कृषि-संबंधी रूपक को सीधे बनाए रखता है और ‘पौधा’ के साथ स्वाभाविक हिन्दी प्रयोग है।
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: मेरे स्वर्गीय पिता
  rationale: यह अधिकार-संबंध और οὐράνιος विशेषण दोनों को संक्षिप्त, प्रतिष्ठित और प्रचलित हिन्दी में सुरक्षित रखता है।
- source_word: ἐκριζωθήσεται
  choice: जड़ से उखाड़ दिया जाएगा
  rationale: भविष्यत् कर्मवाच्य और जड़ों समेत निकालने का कृषि-बिंब दोनों स्पष्ट करता है। यह केवल ‘उखाड़ा जाएगा’ की अपेक्षा मूल क्रिया की शक्ति को अधिक साफ व्यक्त करता है।
theological_decisions:
- issue: ‘हर पौधा’ के रूपक का आशय
  choice: रूपक को ‘हर पौधा’ के रूप में ही रखा गया है।
  alternative: इसे ‘हर शिक्षा’, ‘हर परंपरा’ अथवा ‘हर व्यक्ति’ के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ रूपक का निश्चित संदर्भ नहीं बताता। उसे किसी शिक्षा, परंपरा या व्यक्ति तक सीमित करना व्याख्यात्मक निर्णय होता; इसलिए मूल अस्पष्टता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में स्वाभाविक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पर’ प्रसंगगत विरोध को सहजता से व्यक्त करता है। अंग्रेज़ी परामर्श-पाठ की पादटिप्पणी हिन्दी में आवश्यक नहीं मानी गई, क्योंकि φυτεία के लिए मुख्य पाठ में ‘पौधा’ सटीक है और ‘रोपण’ यहाँ कम स्वाभाविक होगा।
