id: MAT.15.12
reference: Matthew 15:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: hi
  text: तब चेलों ने पास आकर उनसे कहा, “क्या आप जानते हैं कि फरीसी आपकी यह बात[b] सुनकर बुरा मान गए[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आहत हो गए”; अधिक शाब्दिक रूप में, “ठोकर खा गए।”
    reason: lexical_alternative
  - marker: b
    text: “यह बात” यीशु के ठीक पहले के कथन की ओर संकेत करती है।
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह अगले घटनाक्रम को पिछले कथन से जोड़ने वाला स्वाभाविक कालवाचक शब्द है।
- source_word: προσελθόντες
  choice: पास आकर
  rationale: कृदन्त का अर्थ सुरक्षित रखते हुए हिन्दी में मुख्य क्रिया के साथ स्वाभाविक रूप से जोड़ा गया है।
- source_word: οἱ μαθηταὶ
  choice: चेलों ने
  rationale: यह यीशु के ज्ञात शिष्यों को सूचित करता है; ‘चेले’ साधारण आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: λέγουσιν αὐτῷ
  choice: उनसे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथात्मक शैली में सामान्य भूतकाल से व्यक्त किया गया है; आदरसूचक सर्वनाम प्रसंग के अनुरूप है।
- source_word: Οἶδας
  choice: क्या आप जानते हैं
  rationale: सीधे प्रश्न का अर्थ बिना ‘समझते’ जैसे अधिक व्याख्यात्मक शब्द के सुरक्षित रहता है।
- source_word: οἱ Φαρισαῖοι
  choice: फरीसी
  rationale: इस धार्मिक समूह के नाम का हिन्दी में प्रचलित रूप।
- source_word: ἀκούσαντες τὸν λόγον
  choice: आपकी यह बात सुनकर
  rationale: λόγος यहाँ पिछले कथन को सूचित करता है। ‘आपकी यह बात’ हिन्दी में संदर्भ स्पष्ट करता है, जबकि पादटिप्पणी इसके संकेत को बताती है।
- source_word: ἐσκανδαλίσθησαν
  choice: बुरा मान गए
  rationale: इस प्रसंग में यह यीशु की बात पर फरीसियों की प्रतिकूल, आहत प्रतिक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: σκανδαλίζω को गैर-उद्धारशास्त्रीय पारस्परिक प्रसंग में व्यक्त करना
  choice: बुरा मान गए
  alternative: ठोकर खा गए; आहत हो गए
  rationale: प्रसंग फरीसियों की यीशु के कथन पर नकारात्मक प्रतिक्रिया का है। मुख्य पाठ में स्वाभाविक अर्थ रखा गया है और ‘ठोकर’ की मूल रूपक-छवि पादटिप्पणी में दी गई है, ताकि अनावश्यक धर्मवैज्ञानिक निष्कर्ष न जोड़ा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज कथात्मक प्रवाह और आदरसूचक संबोधन का प्रयोग किया गया है। ‘बुरा मान गए’ सामान्य पाठक के लिए स्वाभाविक है, जबकि यूनानी क्रिया की रूपक-छवि पादटिप्पणी में संरक्षित है।
