  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: hi
  text: 'हे कपटियो, यशायाह ने तुम्हारे विषय में ठीक ही भविष्यवाणी की थी। उसने कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριταί
  choice: हे कपटियो
  rationale: यह संबोधन के रूप में प्रयुक्त बहुवचन संज्ञा है। ‘हे कपटियो’ यूनानी संबोधन की सीधी और तीखी भर्त्सना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: καλῶς
  choice: ठीक ही
  rationale: यह क्रिया ἐπροφήτευσεν को विशेषित करता है और बताता है कि यशायाह की भविष्यवाणी इन श्रोताओं पर उचित और सत्य रूप से लागू होती है। ‘ठीक ही’ आधुनिक हिन्दी में इस बल को सहजता से व्यक्त करता है।
- source_word: ἐπροφήτευσεν
  choice: भविष्यवाणी की थी
  rationale: यह προφητεύω का एओरिस्ट सक्रिय रूप है। हिन्दी का पूर्ण भूतकाल अतीत में यशायाह द्वारा कही गई भविष्यवाणी को वर्तमान प्रसंग से स्पष्ट रूप से जोड़ता है।
- source_word: περὶ ὑμῶν
  choice: तुम्हारे विषय में
  rationale: περί के साथ संबंधकारक का अर्थ ‘के विषय में/के बारे में’ है। ‘तुम्हारे विषय में’ गरिमापूर्ण और स्पष्ट है।
- source_word: Ἠσαΐας
  choice: यशायाह
  rationale: भविष्यद्वक्ता के नाम का हिन्दी बाइबलीय परंपरा में प्रचलित मानक रूप।
- source_word: λέγων
  choice: 'उसने कहा:'
  rationale: वर्तमान कृदंत आगे आने वाले उद्धरण का परिचय देता है। हिन्दी में स्वतंत्र वाक्य ‘उसने कहा:’ अधिक स्वाभाविक है और उद्धरण-परिचायक कार्य को स्पष्ट रखता है।
theological_decisions:
- issue: यीशु के प्रत्यक्ष संबोधन की तीव्रता
  choice: हे कपटियो
  alternative: हे ढोंगियो
  rationale: ὑποκριταί प्रसंग में नैतिक-धार्मिक कपट का कठोर आरोप है। ‘कपटियो’ इस गंभीरता को सुरक्षित रखता है; ‘ढोंगियो’ अधिक बोलचाल का और कुछ संदर्भों में अपेक्षाकृत हल्का सुनाई दे सकता है।
- issue: καλῶς का आशय
  choice: ठीक ही भविष्यवाणी की थी
  alternative: अच्छी तरह भविष्यवाणी की थी
  rationale: यहाँ आशय भविष्यवाणी करने की शैली या कुशलता से अधिक उसकी उपयुक्तता और सत्यता है। ‘ठीक ही’ इस बात को व्यक्त करता है कि यशायाह के शब्द इन श्रोताओं पर सटीक बैठते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली रखी गई है। पद की तीखी भर्त्सना को नरम नहीं किया गया। यूनानी कृदंत λέγων को स्वाभाविक हिन्दी के लिए स्वतंत्र वाक्य में बदला गया है।
