  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: hi
  text: और उसने भीड़ को अपने पास बुलाकर उनसे कहा, “सुनो और समझो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: फिर
  rationale: यह संयोजक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘फिर’ यहाँ स्वाभाविक है और कोई अनावश्यक कारणात्मक अर्थ नहीं जोड़ता।
- source_word: προσκαλεσάμενος
  choice: अपने पास बुलाकर
  rationale: एओरिस्ट मिडिल कृदन्त मुख्य क्रिया से जुड़ी पूर्ववर्ती क्रिया व्यक्त करता है। ‘अपने पास बुलाकर’ προσκαλέομαι की निकट बुलाने की दिशात्मकता और वाक्य का स्वाभाविक हिन्दी क्रम दोनों बनाए रखता है।
- source_word: τὸν ὄχλον
  choice: भीड़ को
  rationale: ὄχλος के लिए ‘भीड़’ सामान्य, स्पष्ट और प्रसंगानुकूल आधुनिक हिन्दी शब्द है।
- source_word: εἶπεν αὐτοῖς
  choice: उनसे कहा
  rationale: यह λέγω और αὐτοῖς का सीधा तथा स्वाभाविक हिन्दी रूप है।
- source_word: Ἀκούετε
  choice: सुनो
  rationale: वर्तमान बहुवचन आज्ञार्थक यहाँ ध्यान देकर सुनने का आदेश देता है; ‘सुनो’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: συνίετε
  choice: समझो
  rationale: यह सुनी हुई बात का अर्थ ग्रहण करने का आदेश है। ‘समझो’ Ἀκούετε से भेद बनाए रखते हुए συνίημι का सामान्य अर्थ व्यक्त करता है।
