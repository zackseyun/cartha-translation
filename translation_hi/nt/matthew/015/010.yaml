translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बुलाकर’ यूनानी कृदन्त को हिन्दी की स्वाभाविक पूर्वकालिक संयुक्त क्रिया में व्यक्त करता है; आदेश बहुवचन अनौपचारिक/सामूहिक रूप ‘सुनो और समझो’ में है। अंग्रेज़ी परामर्श-पाठ की पादटिप्पणी मूलतः अंग्रेज़ी ‘Listen/Hear’ विकल्प से संबंधित है; हिन्दी में दोनों का स्वाभाविक समतुल्य ‘सुनो’ ही होने के कारण अलग पादटिप्पणी आवश्यक नहीं है।
