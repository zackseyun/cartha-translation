source:
  edition: SBLGNT
  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: hi
  text: क्योंकि हृदय से बुरे विचार, हत्याएँ, व्यभिचार, यौन अनैतिकताएँ, चोरियाँ, झूठी गवाहियाँ और निंदाएँ[a] निकलती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बदनाम करने वाली बातें।” यूनानी शब्द संदर्भ के अनुसार लोगों के विरुद्ध बदनामी या परमेश्वर के विरुद्ध निंदात्मक वाणी—दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας
  choice: क्योंकि मन से
  rationale: γάρ का व्याख्यात्मक अर्थ ‘क्योंकि’ से और ἐκ का स्रोत-बोध ‘से’ से व्यक्त होता है। καρδία यहाँ केवल भावनाओं नहीं, भीतरी मनुष्य का द्योतक है; आधुनिक हिन्दी में ‘मन’ इस आशय को सहज रूप से व्यक्त करता है।
- source_word: ἐξέρχονται
  choice: निकलती हैं
  rationale: यह क्रिया भीतर के स्रोत से बाहर आने का बिंब रखती है; हिन्दी वाक्य में अंत में ‘निकलती हैं’ स्वाभाविक और सटीक है।
- source_word: διαλογισμοὶ πονηροί
  choice: बुरे विचार
  rationale: διαλογισμοί विचारों, तर्कों या मन की योजनाओं को सूचित कर सकता है। ‘बुरे विचार’ अर्थ को अनावश्यक रूप से षड्यंत्र तक सीमित किए बिना व्यापकता बनाए रखता है।
- source_word: φόνοι
  choice: हत्याएँ
  rationale: यह बहुवचन संज्ञा जानबूझकर की गई हत्याओं को सूचित करती है; ‘हत्याएँ’ हिन्दी में सीधा और नैतिक रूप से स्पष्ट समतुल्य है।
- source_word: μοιχεῖαι
  choice: व्यभिचार
  rationale: यह वैवाहिक बेवफाई के कृत्यों को दर्शाता है। हिन्दी में ‘व्यभिचार’ स्वाभाविक रूप से जातिवाचक/सामूहिक रूप में प्रयुक्त होता है; कृत्रिम बहुवचन से बचा गया है।
- source_word: πορνεῖαι
  choice: यौन अनैतिकताएँ
  rationale: πορνεῖαι अवैध यौन आचरण की व्यापक श्रेणी को सूचित करता है। बहुवचन ‘यौन अनैतिकताएँ’ उसकी व्यापकता और ग्रीक संख्या दोनों बनाए रखता है।
- source_word: κλοπαί
  choice: चोरियाँ
  rationale: यह चोरी के कृत्यों का बहुवचन है; ‘चोरियाँ’ संक्षिप्त, वर्तमान और सूची के अनुरूप है।
- source_word: ψευδομαρτυρίαι
  choice: झूठी गवाहियाँ
  rationale: यह झूठी साक्षी देने या झूठी गवाही के कृत्यों को सूचित करता है। ‘झूठी गवाहियाँ’ कानूनी/साक्ष्य-संबंधी भाव और बहुवचन दोनों रखता है।
- source_word: βλασφημίαι
  choice: निंदाएँ
  rationale: βλασφημίαι मनुष्यों के विरुद्ध बदनामी या परमेश्वर के विरुद्ध निंदात्मक वाणी—दोनों अर्थ ले सकता है। ‘निंदाएँ’ हिन्दी में इस व्यापक वाचिक अपराध को व्यक्त करता है और अधिक संकीर्ण अर्थ थोपने से बचता है।
theological_decisions:
- issue: βλασφημίαι का लक्ष्य और अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘निंदाएँ’
  alternative: ‘परमेश्वर की निंदाएँ’ या ‘बदनामियाँ’
  rationale: संदर्भ सामान्य बुराइयों की सूची है और वाणी का लक्ष्य निर्दिष्ट नहीं है। ‘निंदाएँ’ अस्पष्टता को बनाए रखता है; पादटिप्पणी स्पष्ट करती है कि यह मनुष्यों की बदनामी या परमेश्वर की निंदा दोनों हो सकती है।
- issue: καρδία का रूपक
  choice: ‘मन’
  alternative: ‘हृदय’
  rationale: यहाँ καρδία नैतिक विचार और कर्म के भीतरी स्रोत को दर्शाता है, केवल भावना को नहीं। आधुनिक हिन्दी में ‘मन’ यही बात अधिक स्वाभाविक रूप से संप्रेषित करता है, यद्यपि ‘हृदय’ अधिक रूपात्मक विकल्प है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ग्रीक की दोष-सूची का संक्षिप्त लयात्मक रूप बनाए रखा गया है; जहाँ हिन्दी में अमूर्त संज्ञा स्वाभाविक रूप से सामूहिक अर्थ देती है, वहाँ यांत्रिक बहुवचन से बचा गया है।
