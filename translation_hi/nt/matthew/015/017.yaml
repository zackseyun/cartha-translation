id: MAT.15.17
reference: Matthew 15:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: hi
  text: क्या तुम नहीं समझते कि जो कुछ मुँह में जाता है, वह पेट में पहुँचता है और फिर शौचालय में निकाल दिया जाता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ मुँह में जाता है ... वह पाखाने में बाहर निकाल दिया जाता है।”
    reason: ἀφεδρών के लिए ‘शौचालय’ के साथ अधिक ऐतिहासिक और प्रत्यक्ष हिन्दी विकल्प देना।
lexical_decisions:
- source_word: νοεῖτε
  choice: समझते
  rationale: यहाँ क्रिया यीशु की बात को मानसिक रूप से समझने के अर्थ में है; प्रश्न का झिड़की-भरा स्वर भी बना रहता है।
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: जो कुछ ... जाता है
  rationale: नपुंसकलिंग एकवचन कृदंत-रचना का सामान्य और व्यापक आशय है; यह आधुनिक हिन्दी में स्वाभाविक रूप से किसी भी खाई जाने वाली वस्तु को समेटता है।
- source_word: εἰς τὸ στόμα
  choice: मुँह में
  rationale: εἰς भीतर की ओर गति बताता है; ‘मुँह में जाता है’ मूल शारीरिक चित्र को स्पष्ट रखता है।
- source_word: κοιλίαν
  choice: पेट
  rationale: इस पाचन-संदर्भ में κοιλία का अर्थ पेट है; ‘पेट’ सामान्य आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: χωρεῖ
  choice: पहुँचता है
  rationale: यहाँ क्रिया भोजन के पेट तक जाने को व्यक्त करती है; ‘पहुँचता है’ स्वाभाविक हिन्दी है और गति का भाव बनाए रखता है।
- source_word: ἀφεδρῶνα
  choice: शौचालय
  rationale: यह शब्द मलत्याग के स्थान को दर्शाता है। ‘शौचालय’ आधुनिक, स्पष्ट और मर्यादित हिन्दी है; प्राचीन संदर्भ में ‘पाखाना’ भी संभव है।
- source_word: ἐκβάλλεται
  choice: निकाल दिया जाता है
  rationale: कर्मवाच्य रूप शरीर से बाहर निष्कासन की प्रक्रिया को व्यक्त करता है; यह हिन्दी में स्पष्ट है और अनावश्यक रूप से भद्दा नहीं लगता।
theological_decisions:
- issue: यीशु के कथन का अनुष्ठानिक शुद्धता के नियमों से संबंध
  choice: पाचन-प्रक्रिया से संबंधित कथन को सीधे अनूदित किया गया है और इस पद में सभी भोजनों को शुद्ध घोषित करने वाला कोई व्याख्यात्मक वाक्य नहीं जोड़ा गया।
  alternative: ऐसा विस्तार जोड़ना कि इसके द्वारा सभी भोजन शुद्ध घोषित किए गए।
  rationale: इस पद का यूनानी पाठ शारीरिक पाचन और निष्कासन की बात करता है। मरकुस 7:19 की व्याख्यात्मक अभिव्यक्ति यहाँ नहीं है, इसलिए उसे जोड़ने से मत्ती के पाठ से आगे बढ़ना और उसकी theological tension को समय से पहले सुलझाना होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘क्या तुम नहीं समझते’ मूल प्रश्न की झिड़की को बनाए रखता है। ‘शौचालय’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी में ‘पाखाना’ अधिक प्रत्यक्ष विकल्प के रूप में दिया गया है।
