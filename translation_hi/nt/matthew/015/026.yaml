source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: hi
  text: पर उसने उत्तर दिया, “बच्चों की रोटी लेकर छोटे कुत्तों के आगे फेंकना उचित नहीं है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पालतू कुत्तों” अथवा “पिल्लों”; यूनानी में लघुतासूचक रूप है, जो सड़क पर घूमने वाले कुत्तों के बजाय छोटे या घर में पाले जाने वाले कुत्तों का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: उसने उत्तर दिया
  rationale: कृदंत और मुख्य क्रिया के इस यूनानी प्रयोग को स्वाभाविक हिन्दी में संक्षेपित करते हुए उत्तर देने का भाव सुरक्षित रखा गया है।
- source_word: καλὸν
  choice: उचित
  rationale: यहाँ शब्द नैतिक भलाई मात्र नहीं, बल्कि औचित्य या उपयुक्तता व्यक्त करता है; इसलिए ‘उचित’ प्रसंगानुकूल है।
- source_word: λαβεῖν
  choice: लेकर
  rationale: यह रोटी को लेने का सीधा भाव व्यक्त करता है और अगली क्रिया ‘फेंकना’ से स्वाभाविक रूप से जुड़ता है।
- source_word: ἄρτον
  choice: रोटी
  rationale: यह मूल रूपक को सीधे और सामान्य हिन्दी में सुरक्षित रखता है।
- source_word: τέκνων
  choice: बच्चों की
  rationale: τέκνα लिंग-समावेशी बहुवचन है; ‘बच्चों की’ संबंधकारक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: βαλεῖν
  choice: फेंकना
  rationale: यह क्रिया के सजीव और अपेक्षाकृत कठोर चित्र को ‘देना’ की अपेक्षा अधिक ठीक ढंग से बनाए रखता है।
- source_word: κυναρίοις
  choice: छोटे कुत्तों के आगे
  rationale: लघुतासूचक रूप का संकेत ‘छोटे कुत्तों’ से रखा गया है; हिन्दी में भोजन फेंकने के साथ ‘के आगे’ स्वाभाविक है और घरेलू कुत्तों की सम्भावना को बाध्यकारी नहीं बनाता।
theological_decisions:
- issue: बच्चों और कुत्तों के रूपक को जातीय पहचान या वक्ता के स्वर की व्याख्या जोड़कर हल करने का प्रश्न
  choice: रूपक को सीधे ‘बच्चों की रोटी’ और ‘छोटे कुत्तों’ के रूप में बनाए रखा गया है।
  alternative: मुख्य पाठ में बच्चों और कुत्तों के अभिप्रेत समूहों को स्पष्ट कर देना, अथवा ‘पालतू कुत्ते’ लिखकर घरेलू परिवेश को निश्चित कर देना।
  rationale: पद स्वयं रूपक के अभिप्रेत पात्रों या कथन के स्वर को स्पष्ट नहीं करता। सीधा अनुवाद प्रसंग की वास्तविक तीक्ष्णता और धार्मिक तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘उचित नहीं है’ औचित्य का भाव देता है; ‘छोटे कुत्ते’ मूल के लघुतासूचक रूप को रखते हुए रूपक की तीक्ष्णता को कम या अधिक नहीं करता।
