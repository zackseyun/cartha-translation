source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πόσους ἄρτους ἔχετε; οἱ δὲ εἶπαν· Ἑπτά, καὶ ὀλίγα ἰχθύδια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: hi
  text: यीशु ने उनसे कहा, “तुम्हारे पास कितनी रोटियाँ हैं?” उन्होंने कहा, “सात, और कुछ छोटी मछलियाँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथा-शैली में भूतकाल ‘कहा’ अधिक स्वाभाविक है और वही कथात्मक कार्य बनाए रखता है।
- source_word: Πόσους ἄρτους
  choice: कितनी रोटियाँ
  rationale: ἄρτους यहाँ गिनी जा सकने वाली रोटियों को दर्शाता है; हिन्दी में ‘रोटियाँ’ स्वाभाविक और सामान्य पाठक के लिए स्पष्ट है।
- source_word: ἔχετε
  choice: तुम्हारे पास ... हैं
  rationale: यह आधुनिक हिन्दी में किसी के पास वस्तु होने की सहज प्रश्नात्मक अभिव्यक्ति है।
- source_word: οἱ δὲ εἶπαν
  choice: उन्होंने कहा
  rationale: δέ यहाँ हल्की कथात्मक प्रगति दिखाता है; अलग विरोधसूचक शब्द जोड़ना आवश्यक नहीं है।
- source_word: Ἑπτά
  choice: सात
  rationale: मूल अंक का सीधा अनुवाद।
- source_word: ὀλίγα
  choice: कुछ
  rationale: यह थोड़ी, अनिश्चित संख्या को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἰχθύδια
  choice: छोटी मछलियाँ
  rationale: यूनानी लघुतासूचक रूप छोटी मछलियों का संकेत देता है, इसलिए उस अर्थ-छाया को मुख्य पाठ में रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में ‘तुम्हारे’ शिष्यों के लिए स्वाभाविक बहुवचन/परिचित संबोधन है। मूल यूनानी के लघुतासूचक ἰχθύδια को ‘छोटी मछलियाँ’ के रूप में सीधे मुख्य पाठ में व्यक्त किया गया है, इसलिए पादटिप्पणी आवश्यक नहीं मानी गई।
