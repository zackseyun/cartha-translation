source:
  edition: SBLGNT
  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: hi
  text: उसने कहा, “हाँ, प्रभु[a], क्योंकि छोटे कुत्ते[b] भी अपने मालिकों की मेज़ से गिरने वाले टुकड़े खाते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रभु’ को यहाँ आदरसूचक ‘महोदय’ के अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: ‘कुत्ता’ के लिए प्रयुक्त यूनानी शब्द लघुरूप में है; इसका आशय छोटे या घर में पाले जाने वाले कुत्तों से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: हाँ
  rationale: यह स्त्री की स्पष्ट स्वीकृति व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: κύριε
  choice: प्रभु
  rationale: यीशु को किए गए संबोधन में यह κύριος के सम्मानसूचक अर्थ और संभावित गहरे धार्मिक आशय—दोनों को खुला रखता है।
- source_word: καὶ γὰρ
  choice: क्योंकि … भी
  rationale: 'यह संयोजन कारणसूचक बल और समावेशी/बलवर्धक अर्थ दोनों देता है: स्त्री उपमा को स्वीकार करके उसी से अपना तर्क आगे बढ़ाती है।'
- source_word: κυνάρια
  choice: छोटे कुत्ते
  rationale: दिमिन्यूटिव रूप का संकेत बनाए रखता है; यह घर में रहने वाले छोटे कुत्तों का बोध करा सकता है, पर अर्थ को केवल ‘पिल्ले’ तक सीमित नहीं करता।
- source_word: ἐσθίει
  choice: खाते हैं
  rationale: यूनानी में नपुंसकलिंग बहुवचन कर्ता के साथ क्रिया एकवचन है, पर हिन्दी में स्वाभाविक बहुवचन अन्वय आवश्यक है।
- source_word: ψιχίων
  choice: टुकड़े
  rationale: यह भोजन के उन छोटे अंशों को स्वाभाविक हिन्दी में व्यक्त करता है जो मेज़ से गिरते हैं; ‘चूरा’ यहाँ अनावश्यक रूप से संकीर्ण होता।
- source_word: τῶν πιπτόντων
  choice: गिरने वाले
  rationale: वर्तमान कृदंत के सामान्य अथवा बार-बार घटित होने वाले भाव को सहज हिन्दी विशेषण-खंड में व्यक्त करता है।
- source_word: τραπέζης
  choice: मेज़
  rationale: घरेलू भोजन की उपमा के लिए स्रोत का सामान्य और सीधा अर्थ।
- source_word: τῶν κυρίων αὐτῶν
  choice: अपने मालिकों
  rationale: पशु और घर के स्वामियों के संबंध में κύριος का अर्थ यहाँ ‘मालिक’ है; ‘प्रभुओं’ से उत्पन्न अनुचित धार्मिक संकेत से बचता है।
theological_decisions:
- issue: यीशु के लिए सीधे संबोधन κύριε का अनुवाद
  choice: प्रभु
  alternative: श्रीमान
  rationale: इस प्रसंग में यह सम्मानसूचक संबोधन हो सकता है, फिर भी मत्ती में यीशु के लिए प्रयुक्त ‘प्रभु’ संभावित धार्मिक गहराई भी रखता है। मुख्य पाठ उस अर्थ-सीमा को बनाए रखता है और पादटिप्पणी लौकिक सम्मानसूचक अर्थ बताती है।
- issue: κυνάρια के दिमिन्यूटिव रूप का निर्वाह
  choice: छोटे कुत्ते
  alternative: कुत्ते; घर के कुत्ते; पिल्ले
  rationale: यह कठोर उपमा को मिटाता नहीं, पर यूनानी रूप में उपस्थित लघुता अथवा घरेलू संदर्भ की छाया को भी नहीं खोता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य-रचना स्त्री की स्वीकृति और उसी उपमा के आधार पर दिए गए प्रत्युत्तर को स्पष्ट करती है। ‘छोटे कुत्ते’ तथा ‘प्रभु’ के संभावित अर्थों को पादटिप्पणियों में सुरक्षित रखा गया है।
