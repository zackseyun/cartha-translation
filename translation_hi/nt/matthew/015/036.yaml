id: MAT.15.36
reference: Matthew 15:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: hi
  text: उसने वे सात रोटियाँ और मछलियाँ लीं और धन्यवाद देने के बाद रोटियाँ तोड़ीं। फिर वह उन्हें शिष्यों को देता गया, और शिष्य उन्हें भीड़ को देते गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: उसने ... लीं
  rationale: यहाँ क्रिया भोजन को वितरण से पहले हाथ में लेने की कथा-क्रिया बताती है; ‘लीं’ स्वाभाविक हिन्दी है।
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: वे सात रोटियाँ
  rationale: इस प्रसंग में ἄρτος गिनी जा सकने वाली रोटियों को सूचित करता है; हिन्दी में ‘सात रोटियाँ’ ठोस और सहज है।
- source_word: τοὺς ἰχθύας
  choice: मछलियाँ
  rationale: ग्रीक रूप बहुवचन है, इसलिए हिन्दी में स्पष्ट बहुवचन रखा गया है।
- source_word: εὐχαριστήσας
  choice: धन्यवाद देने के बाद
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले की क्रिया व्यक्त करता है। यह अनुवाद समय-संबंध स्पष्ट रखता है और ग्रीक में अनुपस्थित कर्म ‘परमेश्वर’ नहीं जोड़ता।
- source_word: ἔκλασεν
  choice: उन्हें तोड़ा
  rationale: संदर्भ में तोड़ी जाने वाली वस्तु मुख्यतः रोटियाँ हैं; ‘उन्हें’ हिन्दी वाक्य को स्वाभाविक बनाता है, यद्यपि ग्रीक में कर्म निहित है।
- source_word: ἐδίδου
  choice: देता गया
  rationale: अपूर्ण भूतकाल वितरण की जारी या बार-बार होने वाली क्रिया दर्शाता है; ‘देता गया’ इस पक्ष को सहज हिन्दी में व्यक्त करता है।
- source_word: τοῖς μαθηταῖς
  choice: शिष्यों को
  rationale: सम्प्रदान कारक प्राप्तकर्ताओं को दर्शाता है; ग्रीक में स्वामित्वसूचक सर्वनाम न होने के कारण ‘अपने’ नहीं जोड़ा गया।
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: और शिष्य भीड़ को
  rationale: ग्रीक में दूसरी उपवाक्यांश क्रियाविहीन है और पहले की वितरण-क्रिया वहाँ समझी जाती है। हिन्दी में संक्षिप्त समानांतर रचना इसे बनाए रखती है। ὄχλοι व्याकरणतः बहुवचन है, पर हिन्दी में ‘भीड़’ सामूहिक अर्थ में अधिक स्वाभाविक है।
theological_decisions:
- issue: εὐχαριστήσας में सम्भावित प्रभु-भोज संबंधी प्रतिध्वनि
  choice: साधारण कथा-क्रिया के रूप में ‘धन्यवाद देने के बाद’
  alternative: ऐसी धार्मिक-विधिक शब्दावली जो प्रभु-भोज की प्रतिध्वनि को प्रमुख बनाए
  rationale: शब्दावली बाद के प्रभु-भोज के वर्णनों की याद दिला सकती है, पर यहाँ पाठ भोजन पर धन्यवाद देने की घटना कहता है। अनुवाद ग्रीक से आगे कोई संस्कार-संबंधी अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में सहज। निरन्तर वितरण को ‘देता गया’ से व्यक्त किया गया है और मूल की दूसरी, क्रियाविहीन उपवाक्यांश को हिन्दी में सम्भव सीमा तक बनाए रखा गया है।
