source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: hi
  text: “आपके चेले बुज़ुर्गों की परंपरा का उल्लंघन क्यों करते हैं? क्योंकि जब वे रोटी खाते हैं, तो अपने हाथ नहीं धोते[a][b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ आशय बुज़ुर्गों की परंपरा के अनुसार हाथ धोने की प्रथा से है, न कि केवल सामान्य साफ़-सफाई के प्रश्न से।
    reason: cultural_note
  - marker: b
    text: या, “जब वे भोजन करते हैं”; यूनानी में “रोटी” कभी-कभी भोजन के लिए व्यापक रूप से प्रयुक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: क्यों
  rationale: कारण पूछने वाले यूनानी प्रश्न का स्वाभाविक और सीधा आधुनिक हिन्दी रूप।
- source_word: οἱ μαθηταί σου
  choice: आपके चेले
  rationale: μαθηταί के लिए ‘चेले’ सामान्य पाठक को सहज समझ आता है और गुरु-शिष्य संबंध को स्पष्ट रखता है।
- source_word: παραβαίνουσιν
  choice: उल्लंघन करते हैं
  rationale: क्रिया किसी मान्य सीमा, आदेश या परंपरा के विरुद्ध जाने को व्यक्त करती है; ‘उल्लंघन’ यहाँ उसके आधिकारिक बल को बनाए रखता है।
- source_word: τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: पुरखों से चली आई परंपरा
  rationale: παράδοσις सौंपी गई परंपरा है और इस प्रसंग में πρεσβύτεροι केवल वृद्ध पुरुष नहीं, पूर्वकाल के मान्य अगुए/अधिकारी हैं। यह रूप अर्थ स्पष्ट करता है, पर उन्हें जैविक पूर्वजों तक सीमित नहीं करता।
- source_word: νίπτονται τὰς χεῖρας αὐτῶν
  choice: अपने हाथ नहीं धोते
  rationale: νίπτω शरीर के किसी अंग, यहाँ हाथों, को धोने के लिए प्रयुक्त है; हिन्दी में आत्मवाचक ‘अपने’ स्वाभाविक है।
- source_word: ὅταν
  choice: जब
  rationale: वर्तमान संभावनार्थक के साथ यह बार-बार होने वाली सामान्य परिस्थिति बताता है; हिन्दी में ‘जब’ प्रसंगानुकूल और सहज है।
- source_word: ἄρτον
  choice: रोटी
  rationale: ἄρτος का प्रत्यक्ष अर्थ रोटी है। यद्यपि यह भोजन के लिए व्यापक अर्थ में भी आ सकता है, मुख्य पाठ में ठोस स्रोत-शब्द को रखा गया है।
- source_word: ἐσθίωσιν
  choice: खाते हैं
  rationale: ὅταν के साथ वर्तमान रूप सामान्यतः होने वाली क्रिया को व्यक्त करता है; हिन्दी का सामान्य वर्तमान यही भाव देता है।
theological_decisions:
- issue: हाथ धोने के उल्लेख का स्वरूप
  choice: मुख्य पाठ इसे पुरखों से चली आई परंपरा के पालन से जुड़ा विवाद ही रहने देता है।
  alternative: इसे मुख्य पाठ में स्पष्ट रूप से ‘धार्मिक विधि के अनुसार हाथ शुद्ध करना’ या केवल ‘साफ-सफाई के लिए हाथ धोना’ कहना।
  rationale: पद स्वयं विवाद को ‘पुरखों से चली आई परंपरा’ से जोड़ता है, पर हाथ धोने के उद्देश्य की विस्तृत व्याख्या नहीं करता। इसलिए मुख्य पाठ धार्मिक अनुष्ठान और सामान्य स्वच्छता के बीच प्रश्न को अनावश्यक रूप से निर्णीत नहीं करता; सांस्कृतिक संकेत पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रश्न में ‘आपके’ से संबोधन का सम्मान बना है। ‘पुरखों से चली आई परंपरा’ प्राचीन अधिकारियों से प्राप्त परंपरा का भाव स्पष्ट करती है, जबकि पादटिप्पणियाँ सांस्कृतिक और शाब्दिक विकल्प देती हैं।
