  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: hi
  text: तब यरूशलेम से फ़रीसी और शास्त्री यीशु के पास आए और कहने लगे,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह अगले प्रसंग को आरम्भ करने वाला कालसूचक कथात्मक संकेत है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: προσέρχονται
  choice: पास आकर
  rationale: यह यीशु की ओर आकर उनके निकट पहुँचने का भाव व्यक्त करता है। हिन्दी कथन-शैली में इसके बाद ‘कहने लगे’ के साथ यह रूप स्वाभाविक है।
- source_word: τῷ Ἰησοῦ
  choice: यीशु के पास
  rationale: प्रसέρχομαι के साथ सम्प्रदान कारक उस व्यक्ति को सूचित करता है जिसके निकट आया जाता है।
- source_word: ἀπὸ Ἱεροσολύμων
  choice: यरूशलेम से
  rationale: ἀπό उद्गम अथवा आने के स्थान को दर्शाता है; इससे किसी आधिकारिक प्रतिनिधित्व का अतिरिक्त दावा नहीं किया गया।
- source_word: Φαρισαῖοι
  choice: फ़रीसी
  rationale: यह ऐतिहासिक यहूदी समूह का हिन्दी में प्रचलित नाम है।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: सुसमाचारों के सन्दर्भ में यह लिखित व्यवस्था के जानकारों के लिए प्रचलित और संक्षिप्त हिन्दी पद है; ‘व्यवस्था के विशेषज्ञ’ अर्थ को अधिक स्पष्ट करता, पर मूल पद की पारम्परिक पहचान घटाता।
- source_word: καὶ
  choice: और
  rationale: दो समूहों का साधारण समन्वय।
- source_word: λέγοντες
  choice: कहने लगे
  rationale: यह अगले पद के प्रत्यक्ष कथन का परिचय देता है। हिन्दी में अपूर्ण वाक्यांश ‘कहते हुए’ की अपेक्षा पदांत पर ‘कहने लगे’ अधिक स्वाभाविक है।
theological_decisions:
- issue: कथात्मक वर्तमान काल
  choice: स्वाभाविक हिन्दी कथा-शैली में ‘आकर … कहने लगे’
  alternative: वर्तमान काल रखते हुए ‘आते हैं … कहते हुए’
  rationale: यूनानी में ऐतिहासिक वर्तमान प्रसंग को सजीव बनाता है, पर हिन्दी में इसे अक्षरशः रखने से वाक्य अस्वाभाविक और अगले पद से जुड़ाव अधूरा लगता है। भूतकालीन कथा-रूप घटना का अर्थ बदले बिना आधुनिक हिन्दी में स्वाभाविक प्रवाह देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘फ़रीसी’ और ‘शास्त्री’ परिचित बाइबलीय पद हैं। वाक्य अगले पद में आने वाले प्रश्न से जुड़ता है, इसलिए अंत में अल्पविराम रखा गया है।
