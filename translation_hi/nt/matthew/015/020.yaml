source:
  edition: SBLGNT
  text: ταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπον, τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: hi
  text: यही बातें मनुष्य को अशुद्ध करती हैं[a], पर बिना हाथ धोए खाना मनुष्य को अशुद्ध नहीं करता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपवित्र करती हैं।’ यूनानी क्रिया धार्मिक रीति से अशुद्ध करने का अर्थ दे सकती है; यहाँ ‘अशुद्ध’ शुद्धता के प्रसंग और भीतर से दूषित होने के व्यापक भाव—दोनों को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῦντα / κοινοῖ
  choice: अशुद्ध करती हैं / अशुद्ध नहीं करता
  rationale: शुद्धता-विवाद के इस प्रसंग में κοινόω किसी को अशुद्ध ठहराने या करने का भाव रखता है। ‘अशुद्ध करना’ धार्मिक शुद्धता की पृष्ठभूमि को स्पष्ट रखता है और भीतर से दूषित होने के व्यापक नैतिक अर्थ के लिए भी पर्याप्त खुला है।
- source_word: ἄνθρωπον
  choice: मनुष्य
  rationale: यूनानी में निश्चित पद के साथ एकवचन सामान्य प्रतिनिधि अर्थ में है। हिन्दी ‘मनुष्य’ एकवचन रूप और समस्त मानव के सामान्य आशय—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀνίπτοις χερσὶν
  choice: बिना हाथ धोए
  rationale: यह दत्तिव पदबंध का स्वाभाविक आधुनिक हिन्दी रूप है और प्रसंग में हाथ धोने की प्रथा को साफ व्यक्त करता है।
- source_word: φαγεῖν
  choice: खाना
  rationale: यूनानी अनन्त क्रिया को हिन्दी में क्रियार्थक संज्ञा ‘खाना’ द्वारा सहज और संक्षिप्त ढंग से व्यक्त किया गया है।
- source_word: ταῦτά ἐστιν τὰ
  choice: यही बातें
  rationale: ‘यही’ यूनानी संकेतवाचक के बल को बनाए रखता है, जबकि ‘बातें’ पहले गिनाई गई बातों की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: δέ
  choice: पर
  rationale: δέ सच्ची अशुद्धता और बिना हाथ धोए खाने के बीच स्पष्ट विरोध दिखाता है; ‘पर’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: शुद्धता-विवाद में κοινόω का स्वरूप
  choice: ‘अशुद्ध करना’ रखा गया, जिससे धार्मिक अशुद्धता की पृष्ठभूमि और नैतिक दूषण का व्यापक आशय दोनों बने रहें।
  alternative: अपवित्र करना / दूषित करना
  rationale: ‘अपवित्र’ धार्मिक आयाम को अधिक उभार सकता है और ‘दूषित’ नैतिक या भौतिक भ्रष्टता को; ‘अशुद्ध’ इस प्रसंग में दोनों क्षेत्रों के बीच की वास्तविक अर्थगत व्यापकता को अधिक संतुलित रूप से रखता है।
- issue: सामान्य प्रतिनिधि एकवचन ἄνθρωπον
  choice: ‘मनुष्य’ के एकवचन को दोनों स्थानों पर बनाए रखा गया।
  alternative: व्यक्ति / लोगों को
  rationale: ‘मनुष्य’ स्रोत के प्रतिनिधि एकवचन को सुरक्षित रखते हुए कथन को हर मानव पर लागू होने वाला सामान्य सत्य बताता है; बहुवचन करने की आवश्यकता नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बिना हाथ धोए खाना’ सामान्य पाठक के लिए स्वाभाविक है। ‘मनुष्य’ प्रतिनिधि एकवचन को बनाए रखता है।
