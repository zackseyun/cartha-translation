  text: बड़ी भीड़ें उसके पास आईं। वे अपने साथ बोल न सकने वालों[a], अंधों, लँगड़ों, अंग-विकल लोगों[b] और बहुत-से अन्य लोगों को लाईं। उन्होंने उन्हें उसके चरणों के पास रख दिया[c], और उसने उन्हें चंगा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बधिरों’; यूनानी शब्द उन लोगों के लिए प्रयुक्त हो सकता है जो सुन नहीं सकते, बोल नहीं सकते, या दोनों।
    reason: lexical_alternative
  - marker: b
    text: या ‘जिनके अंग विकृत, क्षतिग्रस्त या निष्क्रिय थे।’
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘फेंक दिया’; यहाँ आशय उन्हें उसके चरणों के पास रख देने से है।
    reason: lexical_nuance
