lexical_decisions:
- source_word: ἀπολύσας
  choice: विदा करने के बाद
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले पूरी हुई क्रिया बताता है; यह वाक्यांश उसी क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τοὺς ὄχλους
  choice: भीड़
  rationale: यूनानी में बहुवचन है, पर हिन्दी में सामूहिक अर्थ वाला ‘भीड़’ इस प्रसंग में स्वाभाविक है और एकत्र लोगों के समूह को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: नाव पर चढ़ गया
  rationale: यह नाव में सवार होने की ठोस क्रिया को स्वाभाविक हिन्दी मुहावरे में व्यक्त करता है।
- source_word: ἦλθεν
  choice: आया
  rationale: ἔρχομαι के सामान्य अर्थ ‘आना’ को बनाए रखा गया है; यात्रा-वर्णन में यह हिन्दी में भी सहज है।
- source_word: τὰ ὅρια
  choice: क्षेत्र
  rationale: बहुवचन शब्द का शाब्दिक अर्थ सीमाएँ हो सकता है, पर यहाँ यह किसी स्थान के आसपास के भूभाग या इलाके के लिए प्रयुक्त है।
- source_word: Μαγαδάν
  choice: मगदन
  rationale: SBLGNT के पाठ में दिए स्थान-नाम का देवनागरी लिप्यंतरण किया गया है; वैकल्पिक पाठ ‘मगदला’ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: पद के अंत में स्थान-नाम का पाठभेद
  choice: मगदन
  alternative: मगदला
  rationale: यह मुख्यतः पाठालोचन और स्थान-नाम का प्रश्न है। उपलब्ध मूल-पाठ Μαγαδάν पढ़ता है, इसलिए मुख्य पाठ में ‘मगदन’ रखा गया है और पारदर्शिता के लिए प्रसिद्ध वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘विदा करने के बाद’ क्रियाओं का क्रम स्पष्ट करता है, जबकि ‘नाव पर चढ़ गया’ और ‘क्षेत्र’ सामान्य हिन्दी पाठक के लिए सहज हैं।
