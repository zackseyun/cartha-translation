  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: hi
  text: चेलों ने उससे कहा, “इस सुनसान जगह[a] में हम इतनी रोटियाँ[b] कहाँ से लाएँ कि इतनी बड़ी भीड़ को भरपेट खिला सकें[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस निर्जन स्थान में” अथवा “इस वीराने में”।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से बहुवचन “इतनी रोटियाँ”; प्रसंग में इसका आशय इतनी मात्रा में रोटी से है।
    reason: lexical_alternative
  - marker: c
    text: या “तृप्त कर सकें”; यूनानी क्रिया का अर्थ भरपेट खिलाना या भोजन से तृप्त करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: कहा
  rationale: यूनानी में यह ऐतिहासिक वर्तमान है; आधुनिक हिन्दी कथा में साधारण भूतकाल अधिक स्वाभाविक है और संवाद के कथात्मक कार्य को बनाए रखता है।
- source_word: οἱ μαθηταί
  choice: चेलों ने
  rationale: निश्चित उपपद पहले से परिचित समूह की ओर संकेत करता है। ‘उसके’ जोड़ना आवश्यक नहीं, क्योंकि वह मूल में स्पष्ट रूप से नहीं है और प्रसंग से समझ में आता है।
- source_word: Πόθεν ἡμῖν
  choice: हमारे पास … कहाँ से आएँगी
  rationale: Πόθεν स्रोत के विषय में पूछता है और ἡμῖν शिष्यों के पास उपलब्धता का भाव देता है। यह हिन्दी में प्रश्न को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν ἐρημίᾳ
  choice: इस सुनसान जगह में
  rationale: ἐρημία निर्जन या आबादी से दूर स्थान को दर्शाता है। ‘सुनसान जगह’ भू-दृश्य को अनावश्यक रूप से रेगिस्तान तक सीमित किए बिना अर्थ स्पष्ट करती है; ‘इस’ तत्काल परिस्थिति से स्वाभाविक रूप से ग्रहण किया गया है।
- source_word: ἄρτοι τοσοῦτοι
  choice: इतनी रोटियाँ
  rationale: बहुवचन ἄρτοι का ठोस अर्थ ‘रोटियाँ/रोटी के पाव’ है और τοσοῦτοι बड़ी आवश्यक मात्रा पर बल देता है। ‘इतनी रोटियाँ’ मूल की संख्या-रचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὥστε χορτάσαι
  choice: कि हम … पेट भर खिला सकें
  rationale: ὥστε के साथ infinitive अपेक्षित परिणाम या उद्देश्य व्यक्त कर सकता है। हिन्दी की यह रचना उस संबंध को कठोरता से केवल उद्देश्य या केवल परिणाम नहीं ठहराती।
- source_word: ὄχλον τοσοῦτον
  choice: इतनी बड़ी भीड़
  rationale: यह ὄχλον और परिमाण पर बल देने वाले τοσοῦτον, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
