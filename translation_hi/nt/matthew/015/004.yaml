source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: hi
  text: क्योंकि परमेश्वर ने कहा, “अपने पिता और अपनी माता का आदर करो,” और “जो कोई पिता या माता को बुरा-भला कहे[a], वह अवश्य मरे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शाप दे।”
    reason: κακολογέω का अर्थ किसी के विरुद्ध बुरा बोलना, अपमान करना, या शाप देना हो सकता है; ‘शाप दे’ एक संभव अधिक तीखा विकल्प है।
lexical_decisions:
- source_word: ὁ γὰρ θεὸς εἶπεν
  choice: क्योंकि परमेश्वर ने कहा
  rationale: γάρ पिछले कथन का कारण या आधार प्रस्तुत करता है, इसलिए ‘क्योंकि’ उसके संबंध को स्पष्ट रखता है। εἶπεν का साधारण अर्थ ‘कहा’ है; ‘आज्ञा दी’ कहना मूल क्रिया से अधिक विशिष्ट होता।
- source_word: Τίμα
  choice: आदर करो
  rationale: τιμάω माता-पिता को उनका उचित सम्मान देने की आज्ञा व्यक्त करता है। ‘आदर करो’ आधुनिक हिन्दी में स्वाभाविक है और ‘सम्मान करो’ की तुलना में इस स्थापित नैतिक आज्ञा का भार अच्छी तरह बनाए रखता है।
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: अपने पिता और अपनी माता का
  rationale: यूनानी में निश्चित पदबंध है, जबकि उद्धृत आज्ञा के आशय और स्वाभाविक हिन्दी के अनुसार संबंधसूचक ‘अपने’ आवश्यक है। दोनों संज्ञाओं के साथ इसे दोहराने से आज्ञा की संतुलित संरचना बनी रहती है।
- source_word: Ὁ κακολογῶν
  choice: जो कोई … को बुरा कहे
  rationale: κακολογέω का अर्थ किसी के विरुद्ध बुरा बोलना, अपमान करना या शाप देना हो सकता है। ‘बुरा कहे’ व्यापक अर्थ को बनाए रखता है; ‘शाप दे’ को पाद-टिप्पणी में वैकल्पिक अर्थ के रूप में रखा गया है।
- source_word: πατέρα ἢ μητέρα
  choice: पिता या माता को
  rationale: यह पदबंध सामान्य श्रेणी के रूप में पिता अथवा माता में से किसी एक के प्रति किए गए अपराध को बताता है। हिन्दी में संबंधसूचक सर्वनाम जोड़े बिना यह संक्षिप्त और स्वाभाविक है।
- source_word: θανάτῳ τελευτάτω
  choice: उसे निश्चय ही मृत्यु-दंड मिले
  rationale: यह गंभीर कानूनी दंड-सूत्र है। ‘मृत्यु-दंड मिले’ उसकी न्यायिक प्रकृति और अनिवार्यता स्पष्ट करता है, पर दंड देने वाले मानवीय कर्ता को अनावश्यक रूप से सामने नहीं लाता।
theological_decisions:
- issue: उद्धृत व्यवस्था में मृत्यु-दंड के सूत्र का अनुवाद
  choice: उसे निश्चय ही मृत्यु-दंड मिले
  alternative: उसे अवश्य मार डाला जाए
  rationale: मूल θανάτῳ τελευτάτω दंड की निश्चितता और गंभीरता बताता है, लेकिन हिन्दी का ‘मार डाला जाए’ मानवीय कर्तृत्व को यूनानी अभिव्यक्ति की अपेक्षा अधिक प्रत्यक्ष कर देता है। चुना हुआ पाठ कानूनी आशय को स्पष्ट रखते हुए उस अंतर को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। आज्ञाओं के लिए सहज हिन्दी क्रियारूप हैं, जबकि ‘मृत्यु-दंड’ उद्धृत व्यवस्था की कानूनी गंभीरता बनाए रखता है।
