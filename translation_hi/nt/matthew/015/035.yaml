  rationale: यह कथानक में अगली क्रिया को पिछली बात से जोड़ने वाला सामान्य संयोजक है।
- source_word: παραγγείλας
  choice: निर्देश दिया
  rationale: अओरिस्ट कृदंत यीशु की उस निर्देशात्मक क्रिया को व्यक्त करता है जो अगले पद की मुख्य क्रिया से पहले हुई; हिन्दी में सहज वाक्य-रचना के लिए इसे समापिका क्रिया के रूप में रखा गया है।
- source_word: τῷ ὄχλῳ
  choice: भीड़ को
  rationale: दत्तिव रूप निर्देश पाने वाले समूह को दर्शाता है; ‘भीड़’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀναπεσεῖν
  choice: भोजन के लिए बैठ जाने
  rationale: क्रिया का अर्थ भोजन करने के लिए अपना स्थान लेना है, जिसमें उस समय की संस्कृति के अनुसार टिककर या लेटकर बैठने का भाव हो सकता है। केवल ‘लेट जाने’ से हिन्दी पाठक के लिए प्रसंग भ्रामक हो सकता है, इसलिए भोजन-संदर्भ स्पष्ट किया गया है और विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: ἐπὶ τὴν γῆν
  choice: भूमि पर
  rationale: यहाँ γῆ का अर्थ धरती की सतह है जहाँ लोग भोजन के लिए स्थान लेते हैं; ‘भूमि पर’ गरिमापूर्ण और स्पष्ट है।
