  rationale: The revision avoids adding an explicit meal-purpose phrase to the main text, represents the Greek participle with ‘आज्ञा देकर,’ and keeps the culturally specific reclining nuance in a clear lexical footnote. The comma is retained because the Greek clause is completed by the following verse.
