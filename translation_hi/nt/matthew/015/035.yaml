review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the crowd, the ground, and the directive. However, it unnecessarily makes “for food” explicit in the main text, whereas the Greek infinitive denotes reclining/taking one’s place and the meal setting is contextual rather than stated here. The participial form is more faithfully represented by “...आज्ञा देकर,” which also preserves that the sentence continues into the next verse.
  naturalness: ‘भूमि पर भोजन के लिए बैठ जाने का निर्देश दिया’ is understandable but somewhat formal and syntactically less connected to the following verse. ‘भीड़ को ज़मीन पर बैठ जाने की आज्ञा देकर,’ is natural modern Hindi while retaining a dignified biblical register.
  terminology: ‘भीड़’ is appropriate for ὄχλος. ‘आज्ञा’ adequately reflects the directive force of παραγγείλας. The main text uses ‘बैठ जाने’ as an idiomatic Hindi rendering; the footnote preserves the dining/reclining nuance of ἀναπεσεῖν without over-specifying it in the verse.
  issues:
  - severity: low
    issue: The phrase ‘भोजन के लिए’ is explicit in the main translation.
    rationale: The immediate narrative context concerns a meal, but the Greek of this verse does not expressly include ‘for food.’ It is better retained as explanatory nuance in the footnote.
  - severity: low
    issue: The aorist participle παραγγείλας is rendered as an independent finite verb.
    rationale: ‘निर्देश दिया’ is possible in Hindi, but ‘आज्ञा देकर’ better preserves the antecedent participial action and the fact that the sentence continues in verse 36.
  - severity: low
    issue: The footnote wording ‘टिककर या लेटकर बैठने’ is awkward and imprecise.
    rationale: A clearer note should identify the sense as taking one’s place for a meal, often reclining, while retaining ‘sit down’ as the idiomatic main-text alternative.
  revised_text: और भीड़ को ज़मीन पर बैठ जाने की आज्ञा देकर,[a]
  revised_footnotes:
  - marker: a
    text: या, “ज़मीन पर भोजन के लिए लेटने को।” यूनानी क्रिया भोजन के लिए अपना स्थान लेने का अर्थ दे सकती है और अक्सर टिककर बैठने या लेटने का भाव रखती है।
    reason: lexical_alternative
  revision_rationale: The revision avoids adding an explicit meal-purpose phrase to the main text, represents the Greek participle with ‘आज्ञा देकर,’ and keeps the culturally specific reclining nuance in a clear lexical footnote. The comma is retained because the Greek clause is completed by the following verse.
