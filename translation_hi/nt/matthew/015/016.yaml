  text: ὁ ⸀δὲ εἶπεν· Ἀκμὴν καὶ ὑμεῖς ἀσύνετοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/016.yaml
  text: But he said[a], “Are you also still without understanding?”
translation:
  language: hi
  text: पर उसने कहा, “क्या तुम भी अब तक नासमझ हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यहाँ δέ शिष्यों की बात से यीशु के उत्तर की ओर हल्का विरोधात्मक मोड़ दिखाता है; ‘पर’ स्वाभाविक हिन्दी में इसे स्पष्ट करता है।
- source_word: ὁ … εἶπεν
  choice: उसने कहा
  rationale: ὁ यहाँ सर्वनाम की तरह यीशु की ओर संकेत करता है और εἶπεν सामान्य कथात्मक क्रिया है; हिन्दी में ‘उसने कहा’ स्वाभाविक है।
- source_word: Ἀκμὴν
  choice: अब तक
  rationale: यह क्रियाविशेषण इस बात पर बल देता है कि इतने समय और शिक्षा के बाद भी उनकी दशा बनी हुई है; प्रश्न में ‘अब तक’ इसका सहज हिन्दी रूप है।
- source_word: καὶ ὑμεῖς
  choice: तुम भी
  rationale: καί और व्यक्तिवाचक सर्वनाम ὑμεῖς मिलकर शिष्यों को भी समझ की कमी वालों में सम्मिलित करते हुए बल देते हैं।
- source_word: ἀσύνετοί ἐστε
  choice: नासमझ हो
  rationale: ἀσύνετος यहाँ समझ या अंतर्दृष्टि की कमी बताता है। ‘नासमझ’ संक्षिप्त, प्रचलित और प्रसंगानुकूल है तथा अनावश्यक रूप से कठोर नैतिक निंदा नहीं जोड़ता।
theological_decisions:
- issue: शिष्यों के प्रति यीशु की फटकार का स्वर
  choice: इसे उनकी अब तक बनी हुई नासमझी पर एक सीधे और चुभते प्रश्न के रूप में रखा गया है।
  alternative: “क्या तुम भी अब तक समझ नहीं पाए?”
  rationale: मूल यूनानी उनकी वर्तमान दशा को विशेषण से व्यक्त करता है। ‘नासमझ हो’ उस स्वरूप को बनाए रखता है, जबकि प्रश्नवाचक रूप फटकार की तीक्ष्णता को बिना बढ़ाए व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नासमझ’ जानबूझकर चुना गया है ताकि बौद्धिक और आत्मिक समझ की कमी व्यक्त हो, पर ‘मूर्ख’ जैसी अधिक कठोर निंदा न जुड़े।
