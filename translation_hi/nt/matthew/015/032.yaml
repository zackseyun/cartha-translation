source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: hi
  text: तब यीशु ने अपने चेलों को पास बुलाकर कहा, “मुझे इस भीड़ पर दया आती है,[a] क्योंकि ये लोग तीन दिन से मेरे साथ हैं और इनके पास खाने को कुछ नहीं है। मैं इन्हें भूखा[b] विदा नहीं करना चाहता, कहीं ऐसा न हो कि वे रास्ते में निढाल हो जाएँ।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे इस भीड़ पर गहरी करुणा आती है।”
    reason: lexical_alternative
  - marker: b
    text: मूल शब्द का शाब्दिक अर्थ “बिना खाए” या “उपवास की दशा में” है; यहाँ स्वेच्छा से किए गए धार्मिक उपवास का नहीं, भोजन न मिलने का भाव है।
    reason: lexical_alternative
  - marker: c
    text: या “वे रास्ते में बेदम होकर गिर पड़ें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: पास बुलाकर
  rationale: मध्यवाच्य कृदंत का दिशात्मक भाव है कि यीशु ने चेलों को अपने पास बुलाया; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: Σπλαγχνίζομαι
  choice: मुझे ... दया आती है
  rationale: यह क्रिया गहरी करुणा व्यक्त करती है। यह चयन आधुनिक, सहज हिन्दी में भाव की तीव्रता को पर्याप्त रूप से व्यक्त करता है; वैकल्पिक अभिव्यक्ति पादटिप्पणी में दी गई है।
- source_word: ὄχλον
  choice: इस भीड़
  rationale: कथा के प्रसंग में ὄχλος के लिए ‘भीड़’ सबसे स्वाभाविक आधुनिक हिन्दी शब्द है; ‘इस’ वक्ता के सामने उपस्थित समूह को इंगित करता है।
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: ये लोग तीन दिन से मेरे साथ हैं
  rationale: प्रसμένω का आशय किसी के साथ बने रहने से है। ‘तीन दिन से मेरे साथ हैं’ हिन्दी में निरंतर अवधि और यीशु के साथ उनकी उपस्थिति दोनों को सहज रूप से व्यक्त करता है।
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: इनके पास खाने को कुछ नहीं है
  rationale: यूनानी मुहावरे का सीधा आशय भोजन का अभाव है; यह उसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: ἀπολῦσαι
  choice: विदा ... करना
  rationale: यहाँ एकत्र भीड़ को जाने देने का भाव है। ‘विदा करना’ प्रसंग के अनुकूल और गरिमापूर्ण हिन्दी है।
- source_word: νήστεις
  choice: भूखा
  rationale: शब्द का शाब्दिक भाव ‘बिना खाए’ या ‘उपवास की दशा में’ है, पर यहाँ धार्मिक उपवास नहीं बल्कि भोजन न मिलने की स्थिति अभिप्रेत है।
- source_word: μήποτε ἐκλυθῶσιν
  choice: कहीं ऐसा न हो कि वे ... निढाल हो जाएँ
  rationale: μήποτε आशंकित परिणाम को व्यक्त करता है, और ἐκλύομαι यहाँ कमजोरी से चूर या शिथिल हो जाने का भाव देता है। यह हिन्दी अभिव्यक्ति दोनों को स्वाभाविक ढंग से रखती है।
- source_word: ἐν τῇ ὁδῷ
  choice: रास्ते में
  rationale: यह लौटते समय की यात्रा को सूचित करने वाला सहज हिन्दी प्रयोग है।
