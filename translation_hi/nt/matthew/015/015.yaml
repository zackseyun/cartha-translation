source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Φράσον ἡμῖν τὴν παραβολὴν ⸀ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/015.yaml
  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: hi
  text: पर पतरस ने उसे उत्तर दिया, “हमें इस दृष्टान्त को समझा दीजिए।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह दृष्टान्त हमें बता दीजिए,” अथवा “यह दृष्टान्त हमारे लिए स्पष्ट कर दीजिए।”
    reason: φράζω के अर्थ-क्षेत्र में बताना, समझाना और स्पष्ट करना शामिल हैं; मुख्य पाठ संदर्भानुकूल अर्थ देता है, जबकि टिप्पणी अन्य सम्भव रूप सुरक्षित रखती है।
lexical_decisions:
- source_word: Ἀποκριθεὶς
  choice: कहा
  rationale: यह कृदन्त यहाँ उत्तर में बोलने का भाव देता है। हिन्दी में εἶπεν के साथ अलग से ‘उत्तर देकर कहा’ कहना भारी और अनावश्यक लगता है; संदर्भ में ‘कहा’ स्वाभाविक रूप से प्रतिक्रिया का भाव व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: δέ यहाँ कथानक को आगे बढ़ाते हुए हल्का विरोध या मोड़ दिखाता है; ‘पर’ आधुनिक हिन्दी में इसे सहजता से व्यक्त करता है।
- source_word: ὁ Πέτρος
  choice: पतरस
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: εἶπεν αὐτῷ
  choice: उससे कहा
  rationale: αὐτῷ वचन के अप्रत्यक्ष कर्म को दर्शाता है। ‘उससे कहा’ स्वाभाविक हिन्दी है और निकट संदर्भ में उसका संकेत यीशु की ओर है।
- source_word: Φράσον
  choice: अर्थ ... समझा दीजिए
  rationale: φράζω का आशय किसी बात को स्पष्ट करना या उसका अर्थ बताना है। आदरसूचक आज्ञार्थ ‘समझा दीजिए’ शिष्य द्वारा यीशु को संबोधन के लिए स्वाभाविक और गरिमापूर्ण है।
- source_word: ἡμῖν
  choice: हमें
  rationale: समझाने की क्रिया के साथ सम्प्रदान का स्वाभाविक हिन्दी रूप ‘हमें’ है।
- source_word: τὴν παραβολὴν ταύτην
  choice: इस दृष्टान्त का
  rationale: παραβολή के लिए प्रचलित ‘दृष्टान्त’ रखा गया है और ταύτην तत्काल पूर्ववर्ती कथन की ओर संकेत करने वाला ‘इस’ है। हिन्दी वाक्य-विन्यास में ‘इस दृष्टान्त का अर्थ’ अधिक स्वाभाविक है।
theological_decisions:
- issue: क्या παραβολή को तकनीकी अर्थ में ‘दृष्टान्त’ माना जाए या व्यापक अर्थ में ‘रूपक/कहावत’
  choice: दृष्टान्त
  alternative: रूपक अथवा कथन
  rationale: मत्ती में παραβολή के लिए ‘दृष्टान्त’ संगति बनाए रखता है, जबकि पद के अनुवाद में ‘अर्थ समझा दीजिए’ यह स्पष्ट करता है कि पतरस व्याख्या माँग रहा है। इससे कथन के साहित्यिक स्वरूप को आवश्यकता से अधिक निश्चित नहीं किया जाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। यीशु से संबोधन में आदरसूचक ‘दीजिए’ रखा गया है। यूनानी की दोहरी अभिव्यक्ति ‘उत्तर देकर कहा’ को हिन्दी में स्वाभाविक ‘कहा’ बनाया गया है; अर्थ की कोई आवश्यक सूचना नहीं खोती।
