  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: hi
  text: जो अपना जीवन[a] बचाए रखता है, वह उसे खो देगा; और जो मेरे लिए अपना जीवन खो देता है, वह उसे पा लेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्राण” या “आत्मा” दोनों जगह; यूनानी ψυχή का अर्थ “जीवन,” “प्राण,” “आत्मा,” या व्यापक अर्थ में स्वयं व्यक्ति हो सकता है। यहाँ यीशु के प्रति निष्ठा के कारण जीवन खोने और पाने का संदर्भ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: जो ... पा लेता है
  rationale: संज्ञा की तरह प्रयुक्त कृदंत एक सामान्य प्रतिनिधि व्यक्ति को दर्शाता है। ‘जो’ आधुनिक हिन्दी में स्वाभाविक है और कहावत-जैसी सामान्यता बनाए रखता है।
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: अपने प्राण को
  rationale: यहाँ ψυχή का संकेत व्यक्ति के जीवन की ओर है, विशेषकर उसे बचाने या खोने के संदर्भ में। ‘प्राण’ हिन्दी में जीवन और स्वयं व्यक्ति—दोनों की अर्थछाया रखता है और शिष्यत्व के इस विरोधाभास को संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἀπολέσει
  choice: खो देगा
  rationale: यहाँ ἀπόλλυμι विनाश की अपेक्षा खो देने को व्यक्त करता है। ‘खो देगा’ आगे के ‘पा लेगा’ के साथ जानबूझकर रखे गए विरोध को सुरक्षित रखता है।
- source_word: ὁ ἀπολέσας
  choice: जो ... खो देता है
  rationale: यद्यपि यूनानी कृदंत भूतकालिक रूप में है, इस सूक्तिपरक वाक्य में यह सामान्य परिस्थिति को बताता है; हिन्दी का सामान्य वर्तमान ‘खो देता है’ स्वाभाविक है।
- source_word: ἕνεκεν ἐμοῦ
  choice: मेरे कारण
  rationale: ἕνεκεν कारण या हेतु को दर्शाता है। ‘मेरे कारण’ यीशु से संबंध के कारण जीवन खोने का अर्थ सीधे व्यक्त करता है, बिना बलिदान के लाभार्थी होने का अतिरिक्त भाव जोड़े।
- source_word: εὑρήσει
  choice: पा लेगा
  rationale: ‘पा लेगा’ आरंभ के εὑρὼν के साथ समान क्रिया बनाए रखता है और कथन की विरोधाभासी समरूपता सुरक्षित रखता है।
- source_word: αὐτοῦ / αὐτήν
  choice: अपने / उसे
  rationale: हिन्दी में कर्ता की अपनी वस्तु के लिए ‘अपने’ स्वाभाविक है; ‘उसे’ ψυχή/प्राण की पुनरावृत्ति से बचते हुए एकवचन संदर्भ बनाए रखता है।
theological_decisions:
- issue: शिष्यत्व के विरोधाभास में ψυχή का अनुवाद
  choice: प्राण
  alternative: जीवन; प्राण/आत्मा
  rationale: संदर्भ मुख्यतः यीशु के प्रति निष्ठा के कारण अपने जीवन को बचाने या गंवाने का है, न कि शरीर और अमूर्त आत्मा के भेद का। ‘प्राण’ जीवन और स्वयं व्यक्ति की व्यापक अर्थछाया को बनाए रखता है; पादटिप्पणी ‘जीवन’ को स्पष्ट विकल्प के रूप में देती है।
- issue: ἕνεκεν ἐμοῦ में कारण और निष्ठा
  choice: मेरे कारण
  alternative: मेरे लिए; मेरी खातिर
  rationale: यूनानी पदबंध कारण/हेतु को खुला रखता है। ‘मेरे कारण’ इस बात को स्पष्ट करता है कि हानि यीशु से संबंध के कारण होती है, जबकि ‘मेरे लिए’ लाभार्थी या उद्देश्य का अपेक्षाकृत अधिक व्याख्यात्मक भाव ला सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सूक्तिपरक हिन्दी। ‘पा लेता है/खो देगा’ तथा ‘खो देता है/पा लेगा’ की समरूपता मूल कथन के विरोधाभास को बनाए रखती है। पादटिप्पणी चिह्न [a] मुख्य पाठ में सम्मिलित है।
