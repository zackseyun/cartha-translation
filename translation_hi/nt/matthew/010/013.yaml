source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: hi
  text: और यदि वह घर योग्य हो[a], तो तुम्हारी शान्ति उस पर आए; पर यदि वह योग्य न हो[b], तो तुम्हारी शान्ति तुम्हारे पास लौट आए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परिवार’ अथवा ‘गृहस्थी’; यूनानी शब्द घर और, विस्तार से, उसमें रहनेवालों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘योग्य’ का अर्थ दूतों और उनकी शान्ति को ग्रहण करने के उपयुक्त होना है, नैतिक रूप से निष्पाप होना नहीं।
    reason: cultural_note
  - marker: c
    text: या ‘तुम्हारी ओर फिर आए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: घर
  rationale: यह सबसे सीधा हिन्दी समतुल्य है; प्रसंग में इससे घर में रहनेवाला परिवार भी अभिप्रेत हो सकता है, इसलिए पादटिप्पणी दी गई है।
- source_word: ἀξία
  choice: योग्य
  rationale: यह मूल्यांकन का व्यापक अर्थ बनाए रखता है और इसे केवल ‘स्वागत करनेवाला’ कहकर अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: ἐλθάτω
  choice: आए
  rationale: 'आज्ञार्थक भाव को स्वाभाविक हिन्दी में व्यक्त करता है: ‘तुम्हारी शान्ति ... आए।’'
- source_word: εἰρήνη
  choice: शान्ति
  rationale: यह सामान्य और पारदर्शी समतुल्य है तथा आशीष और कुशल-मंगल की व्यापक सामी पृष्ठभूमि को नकारता नहीं।
- source_word: ἐπ’ αὐτήν
  choice: उस पर
  rationale: शान्ति के घर पर आने की दिशात्मक और चित्रात्मक भाषा को सुरक्षित रखता है।
- source_word: πρὸς ὑμᾶς
  choice: तुम्हारे पास
  rationale: ἐπιστραφήτω के साथ मिलकर शान्ति के शिष्यों की ओर लौटने का स्वाभाविक हिन्दी अर्थ देता है।
- source_word: ἐπιστραφήτω
  choice: लौट आए
  rationale: यूनानी आज्ञार्थक अभिव्यक्ति का सहज हिन्दी रूप है और यह बताता है कि शान्ति उस घर पर ठहरने के बजाय शिष्यों के पास लौटती है।
- source_word: μὲν ... δὲ
  choice: यदि ...; पर यदि ...
  rationale: यूनानी विरोधात्मक संरचना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘तुम्हारी शान्ति’ का स्वरूप
  choice: इसे शिष्यों की ‘शान्ति’ ही रखा गया है, जो घर पर आ सकती है या उनके पास लौट सकती है।
  alternative: ‘तुम्हारी शान्ति की शुभकामना’ अथवा ‘तुम्हारे द्वारा दी गई शान्ति की आशीष’
  rationale: मूल पाठ शान्ति को ठोस, लगभग स्थानांतरित होनेवाली वास्तविकता की तरह प्रस्तुत करता है, पर उसकी प्रकृति का व्यवस्थित स्पष्टीकरण नहीं देता। अनुवाद उसे केवल अभिवादन या किसी यांत्रिक शक्ति में सीमित किए बिना यह तनाव बनाए रखता है।
- issue: ‘योग्य’ होने का आशय
  choice: मुख्य पाठ में ‘योग्य’ रखा गया है और पादटिप्पणी में प्रसंगगत आशय स्पष्ट किया गया है।
  alternative: ‘स्वागत के योग्य’, ‘ग्रहणशील’ या ‘पात्र’
  rationale: ἀξία का मूल्यांकनात्मक अर्थ व्यापक है। यहाँ नैतिक निष्पापता का दावा नहीं, बल्कि दूतों और उनकी शान्ति को ग्रहण करने की उपयुक्तता अभिप्रेत है; इसे मुख्य पाठ में अत्यधिक व्याख्यायित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘शान्ति’ की बाइबिलीय छवि तथा ‘योग्य’ की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
