source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: hi
  text: क्या दो गौरैयाँ एक अस्सारियन[b] में नहीं बिकतीं? फिर भी, उनमें से एक भी तुम्हारे पिता से अलग[a] ज़मीन पर नहीं गिरेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुम्हारे पिता के बिना’; इस वाक्यांश में उनके ज्ञान, देखरेख या इच्छा का भाव हो सकता है, पर यूनानी पाठ यह निर्दिष्ट नहीं करता कि इनमें से कौन-सा भाव अभिप्रेत है।
    reason: alternative_reading
  - marker: b
    text: अस्सारियन बहुत कम मूल्य वाला रोमी ताँबे का एक छोटा सिक्का था।
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: गौरैयाँ
  rationale: इस प्रसंग में यह शब्द सामान्यतः गौरैयों को दर्शाता है; ‘छोटे पक्षी’ संभव है, पर यहाँ ‘गौरैयाँ’ अधिक स्वाभाविक और विशिष्ट है।
- source_word: ἀσσαρίου
  choice: एक अस्सारियन
  rationale: यह बहुत कम मूल्य वाला एक विशिष्ट रोमी ताँबे का सिक्का था। ऐतिहासिक विशिष्टता बनाए रखने के लिए नाम का लिप्यंतरण किया गया है और उसका अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: πωλεῖται
  choice: बिकतीं
  rationale: वर्तमानकालीन कर्मवाच्य का स्वाभाविक हिन्दी रूप है और प्रश्न के बहुवचन कर्ता ‘दो गौरैयाँ’ से मेल खाता है।
- source_word: ἓν ἐξ αὐτῶν
  choice: उनमें से एक भी
  rationale: यह अंशात्मक अभिव्यक्ति का सहज हिन्दी रूप है; ‘भी’ प्रसंग में ‘एक तक’ के बल को व्यक्त करता है।
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: भूमि पर नहीं गिरेगी
  rationale: भविष्यकाल और जमीन पर गिरने की गति को स्पष्ट एवं स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: तुम्हारे पिता के बिना
  rationale: यह ἄνευ का निकट और सहज रूप है तथा यह तय नहीं करता कि आशय पिता के ज्ञान, देखरेख, अनुमति या इच्छा में से विशेष रूप से किससे है।
- source_word: οὐχὶ ... ;
  choice: क्या ... नहीं ...?
  rationale: यह ऐसे आलंकारिक प्रश्न को व्यक्त करता है जिसका अपेक्षित उत्तर ‘हाँ’ है।
- source_word: καὶ
  choice: फिर भी
  rationale: यहाँ संयोजक कम मूल्य वाली गौरैयों और पिता की उनसे संबंधित देखरेख के बीच निहित विरोधात्मक बल को स्वाभाविक ढंग से प्रकट करता है।
theological_decisions:
- issue: ‘तुम्हारे पिता के बिना’ और परमेश्वर के विधान का संबंध
  choice: मुख्य पाठ में व्यापक और अस्पष्ट अभिव्यक्ति ‘तुम्हारे पिता के बिना’ रखी गई है।
  alternative: ‘तुम्हारे पिता के ज्ञान के बिना’ या ‘तुम्हारे पिता की इच्छा के बिना’।
  rationale: यूनानी पाठ पिता की विधानकारी संलग्नता दर्शाता है, पर यह स्पष्ट नहीं करता कि यहाँ विशेष रूप से ज्ञान, देखरेख, अनुमति या इच्छा अभिप्रेत है। अनुवाद किसी एक धर्मवैज्ञानिक व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘अस्सारियन’ की ऐतिहासिक विशिष्टता रखी गई है; अपरिचित मुद्रा को पाद-टिप्पणी में समझाया गया है। ‘तुम्हारे पिता के बिना’ मूल की धर्मवैज्ञानिक अस्पष्टता को बनाए रखता है।
