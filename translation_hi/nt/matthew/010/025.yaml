id: MAT.10.25
reference: Matthew 10:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: hi
  text: शिष्य के लिए इतना ही काफ़ी है कि वह अपने गुरु के समान हो जाए, और दास के लिए कि वह अपने स्वामी के समान हो जाए। यदि उन्होंने घर के स्वामी को बालज़बूल[a] कहा, तो उसके घराने के लोगों को कितना अधिक कहेंगे!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक पारंपरिक वैकल्पिक रूप ‘बालज़बूब’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρκετὸν
  choice: इतना ही काफ़ी है
  rationale: यह विधेय विशेषण पर्याप्तता व्यक्त करता है; यह हिंदी प्रयोग स्वाभाविक है और मूल के बल को बनाए रखता है।
- source_word: μαθητῇ
  choice: शिष्य
  rationale: यह गुरु से सीखने और उसका अनुसरण करने वाले व्यक्ति के संबंधपरक अर्थ को व्यक्त करता है, केवल अकादमिक विद्यार्थी का अर्थ नहीं।
- source_word: ἵνα γένηται
  choice: कि वह ... हो जाए
  rationale: ἵνα और संभावनार्थक क्रिया के परिणाम/लक्ष्य-सूचक भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: διδάσκαλος
  choice: गुरु
  rationale: शिष्य के साथ यह स्वाभाविक हिंदी युग्म है और आगे आने वाले κύριος से भेद बनाए रखता है।
- source_word: δοῦλος
  choice: दास
  rationale: स्वामी के साथ सामाजिक अधीनता के स्पष्ट विरोध को बनाए रखता है; ‘सेवक’ इस संबंध को अनावश्यक रूप से नरम कर सकता था।
- source_word: κύριος
  choice: स्वामी
  rationale: यहाँ शब्द दास-स्वामी की घरेलू-सामाजिक उपमा में है, प्रत्यक्ष ईश्वरीय उपाधि के रूप में नहीं।
- source_word: οἰκοδεσπότην
  choice: घर के स्वामी
  rationale: घराने पर अधिकार रखने वाले व्यक्ति का अर्थ स्पष्ट करता है और घरेलू रूपक को बनाए रखता है।
- source_word: Βεελζεβοὺλ
  choice: बालज़बूल
  rationale: यूनानी पाठ के Βεελζεβούλ रूप का प्रचलित हिंदी लिप्यंतरण है; पारंपरिक वैकल्पिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: ἐπεκάλεσαν
  choice: कहा
  rationale: इस प्रसंग में इसका अर्थ किसी को एक नाम से पुकारना या संबोधित करना है।
- source_word: πόσῳ μᾶλλον
  choice: और क्या-क्या न कहेंगे
  rationale: हिंदी का यह स्वाभाविक प्रश्नवाचक मुहावरा मूल के ‘कितना अधिक’ वाले प्रबलतर-से-प्रबल निष्कर्ष को व्यक्त करता है।
- source_word: οἰκιακοὺς
  choice: उसके घराने के लोगों
  rationale: यह केवल दासों तक सीमित न रहकर घराने के सभी सदस्यों को समेटता है और οἰκοδεσπότης से शब्दार्थ-संबंध बनाए रखता है।
theological_decisions:
- issue: घरेलू उपमा में κύριος का अनुवाद
  choice: स्वामी
  alternative: प्रभु
  rationale: तात्कालिक समानांतर δοῦλος के साथ सामाजिक स्वामी का अर्थ प्रमुख है; ‘प्रभु’ यहाँ ऐसी प्रत्यक्ष मसीही उपाधि का संकेत दे सकता था जिसे वाक्य स्वयं अग्रभूमि में नहीं रखता।
- issue: δοῦλος की सामाजिक स्थिति
  choice: दास
  alternative: सेवक
  rationale: इस पद में स्वामी के साथ दर्जागत अधीनता मुख्य है, इसलिए ‘दास’ मूल संबंध को अधिक स्पष्ट रूप से सुरक्षित रखता है।
- issue: अंतिम खंड की यूनानी दीर्घवृत्तता
  choice: ‘कहेंगे’ को हिंदी में स्पष्ट किया गया
  alternative: ‘तो उसके घराने के लोग कितने अधिक’ जैसी शाब्दिक दीर्घवृत्तता
  rationale: यूनानी में पहले खंड की क्रिया अंतिम खंड में समझी जाती है। हिंदी में उसे दोहराना अर्थ नहीं जोड़ता, बल्कि निहित तुलना को स्वाभाविक और स्पष्ट बनाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शिष्य–गुरु’ तथा ‘दास–स्वामी’ के समानांतर संबंध स्पष्ट हैं। अंतिम प्रश्न को हिंदी के स्वाभाविक ‘क्या-क्या न’ मुहावरे में रखा गया है, जिससे मूल का प्रबलतर निष्कर्ष सुरक्षित रहता है।
