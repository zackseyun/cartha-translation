id: MAT.10.1
reference: Matthew 10:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: hi
  text: और उसने अपने बारह शिष्यों को अपने पास बुलाकर[a] उन्हें अशुद्ध आत्माओं पर अधिकार दिया[b], ताकि वे उन्हें निकालें और हर प्रकार के रोग और हर प्रकार की दुर्बलता को चंगा करें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने बारह शिष्यों को अपने पास बुलाने के बाद।”
    reason: lexical_alternative
  - marker: b
    text: या, “सामर्थ्य”; यूनानी शब्द ἐξουσία प्रायः प्रदान किए गए अधिकार या कार्य करने के हक का भाव रखता है।
    reason: lexical_alternative
  - marker: c
    text: “हर प्रकार के रोग और हर प्रकार की दुर्बलता” के पीछे दो निकटार्थी यूनानी शब्द (νόσος और μαλακία) हैं; दूसरा पद “हर प्रकार की बीमारी” भी अनूदित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: अपने पास बुलाकर
  rationale: मध्यवाच्य क्रिया का भाव किसी को अपने पास बुलाने का है; कृदन्त को स्वाभाविक हिन्दी में पूर्वकालिक क्रिया के रूप में रखा गया है।
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: अपने बारह शिष्यों को
  rationale: सुसमाचारों में μαθητής के लिए प्रचलित और सटीक शब्द ‘शिष्य’ है; αὐτοῦ को हिन्दी के स्वाभाविक निजवाचक ‘अपने’ से व्यक्त किया गया है।
- source_word: ἔδωκεν
  choice: दिया
  rationale: δίδωμι का सरल और सीधा अर्थ सुरक्षित रहता है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यह केवल सामर्थ्य नहीं, बल्कि कार्य करने के प्रदान किए गए अधिकार को व्यक्त करता है।
- source_word: πνευμάτων ἀκαθάρτων
  choice: अशुद्ध आत्माओं पर
  rationale: जनन कारक को प्रसंगानुसार ‘पर’ से व्यक्त किया गया है; ‘अशुद्ध आत्माएँ’ सुसमाचारों की मानक और अर्थ-सटीक अभिव्यक्ति है।
- source_word: ὥστε
  choice: ताकि
  rationale: अनन्त क्रियाओं के साथ यह उद्देश्य अथवा अपेक्षित परिणाम की गुंजाइश रखता है; ‘ताकि’ हिन्दी में इस संबंध को सहज ढंग से व्यक्त करता है।
- source_word: ἐκβάλλειν αὐτά
  choice: वे उन्हें निकालें
  rationale: सर्वनाम अशुद्ध आत्माओं की ओर लौटता है; ‘निकालना’ भूतात्मा-निष्कासन के प्रसंग में स्पष्ट और स्वाभाविक है।
- source_word: θεραπεύειν
  choice: चंगा करें
  rationale: यहाँ क्रिया रोगियों को स्वस्थ करने के अर्थ में है; ‘चंगा करना’ प्रतिष्ठित और सामान्य बाइबलीय हिन्दी है।
- source_word: πᾶσαν νόσον
  choice: हर प्रकार के रोग
  rationale: एकवचन πᾶσαν के व्यापक अर्थ को हिन्दी में ‘हर प्रकार के’ से स्वाभाविक बनाया गया और νόσος को ‘रोग’ कहा गया है।
- source_word: πᾶσαν μαλακίαν
  choice: हर प्रकार की दुर्बलता
  rationale: μαλακία रोगजन्य कमजोरी, अस्वस्थता या दुर्बलता को सूचित कर सकता है; ‘दुर्बलता’ νόσος से शब्दगत भेद भी बनाए रखती है।
theological_decisions:
- issue: शिष्यों को दिए गए अधिकार का स्वरूप
  choice: यीशु ने बारहों को अशुद्ध आत्माओं पर अधिकार दिया
  alternative: यीशु ने उन्हें अशुद्ध आत्माओं पर सामर्थ्य दिया
  rationale: ἐξουσία कार्य करने के प्रदत्त अधिकार पर बल देता है, मात्र निरपेक्ष शक्ति पर नहीं; अनुवाद इससे आगे कोई सिद्धान्तगत निष्कर्ष नहीं जोड़ता।
- issue: ὥστε का उद्देश्य अथवा परिणाम
  choice: ‘ताकि’ द्वारा उद्देश्य/अपेक्षित परिणाम को खुला रखा गया
  alternative: ‘जिसके परिणामस्वरूप’ द्वारा केवल परिणाम पर बल देना
  rationale: ὥστε और अनन्त क्रियाएँ उद्देश्य तथा परिणाम के बीच कुछ अर्थगत लचीलापन रखती हैं; हिन्दी में ‘ताकि’ प्रसंगानुकूल है और संबंध को अनावश्यक रूप से कठोर नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण शैली। वाक्य की यूनानी संरचना और क्रम को यथासंभव रखा गया है, पर हिन्दी प्रवाह के लिए कृदन्त को ‘बुलाकर’ और व्यापक एकवचन पदों को ‘हर प्रकार के/की’ से व्यक्त किया गया है।
