id: MAT.10.10
reference: Matthew 10:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: hi
  text: रास्ते के लिए न तो यात्रा की थैली लो, न दो कुरते, न जूतियाँ, और न लाठी[a]; क्योंकि मज़दूर अपने भोजन का अधिकारी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ लोग ‘और न लाठी’ का अर्थ एक अतिरिक्त लाठी न लेना समझते हैं, विशेषकर इसलिए कि मरकुस 6:8 में लाठी ले जाने की अनुमति दी गई है।
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: यात्रा की थैली
  rationale: यह शब्द यात्रा में, विशेषकर खाने-पीने की सामग्री रखने के लिए, साथ ले जाई जाने वाली थैली को दर्शाता है। ‘यात्रा की थैली’ प्रसंग को स्पष्ट रखते हुए स्वाभाविक हिन्दी है।
- source_word: εἰς ὁδὸν
  choice: रास्ते के लिए
  rationale: यह मुहावरा यात्रा में साथ ले जाने की बात कहता है। ‘रास्ते के लिए’ संक्षिप्त और सहज है।
- source_word: δύο χιτῶνας
  choice: दो कुरते
  rationale: χιτών शरीर पर पहना जाने वाला मूल वस्त्र था। ‘कुरते’ सामान्य पाठक के लिए समझने योग्य निकट सांस्कृतिक समतुल्य है, जबकि केवल ‘वस्त्र’ बहुत अस्पष्ट होता।
- source_word: ὑποδήματα
  choice: जूतियाँ
  rationale: शब्द पैरों के नीचे बाँधे जाने वाले पादत्राण को दर्शाता है। ‘जूतियाँ’ प्राचीन प्रकार के साधारण पादत्राण का स्वाभाविक हिन्दी बोध कराती है।
- source_word: ῥάβδον
  choice: लाठी
  rationale: यहाँ यात्री की सहारे वाली लाठी अभिप्रेत है। अनुवाद मत्ती के स्पष्ट निषेध को बनाए रखता है और मरकुस 6:8 से उसका तनाव समाप्त नहीं करता।
- source_word: ἄξιος
  choice: अधिकारी है
  rationale: ἄξιος योग्य होने या उचित रूप से पाने का भाव रखता है। इस हिन्दी वाक्य में ‘अपने भोजन का अधिकारी है’ उसी अधिकारपूर्ण नैतिक दावे को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁ ἐργάτης
  choice: मज़दूर
  rationale: शब्द काम करने वाले व्यक्ति को दर्शाता है। ‘मज़दूर’ वर्तमान हिन्दी में स्पष्ट है और इसमें कोई अनावश्यक कलीसियाई पदवी नहीं जोड़ी गई।
- source_word: τῆς τροφῆς αὐτοῦ
  choice: अपने भोजन का
  rationale: τροφή का प्रत्यक्ष अर्थ भोजन या पोषण है। ‘भोजन’ मूल के ठोस अर्थ को रखता है; ‘सहायता’ जैसे व्यापक शब्द अधिक व्याख्यात्मक होते।
theological_decisions:
- issue: यात्रा-सामग्री, विशेषकर लाठी, के विषय में समानांतर वृत्तांतों का संभावित सामंजस्य
  choice: मुख्य पाठ में मत्ती का निषेध ‘और न लाठी’ यथावत रखा गया है।
  alternative: इसे केवल अतिरिक्त लाठी के निषेध के रूप में समझना, विशेषकर मरकुस 6:8 के प्रकाश में।
  rationale: यूनानी पाठ ῥάβδον को निषिद्ध वस्तुओं की सूची में स्पष्ट रूप से रखता है। इसलिए समानांतर वृत्तांत के साथ सामंजस्य बैठाने के बजाय मूल तनाव सुरक्षित रखा गया है और वैकल्पिक समझ पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रूप अपनाया गया है। ऐतिहासिक वस्तुओं के लिए अत्यधिक तकनीकी शब्दों से बचते हुए अर्थ की ठोसता रखी गई है; मत्ती और मरकुस के बीच दिखाई देने वाले तनाव का सामंजस्य नहीं किया गया।
