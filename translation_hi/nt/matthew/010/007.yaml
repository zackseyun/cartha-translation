  edition: SBLGNT
  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: hi
  text: 'और जाते हुए यह घोषणा करो: “स्वर्ग का राज्य[b] निकट आ गया है[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पास आ गया है” या “निकट है।” यूनानी पूर्णकाल ऐसी निकटता पर बल देता है जो आ चुकी है और अब भी प्रभावी है।
    reason: lexical_alternative
  - marker: b
    text: मत्ती प्रायः “स्वर्ग का राज्य” कहते हैं, जहाँ अन्य सुसमाचारों में अक्सर “परमेश्वर का राज्य” मिलता है।
    reason: cross_reference
lexical_decisions:
- source_word: πορευόμενοι
  choice: जाते हुए
  rationale: वर्तमानकालिक कृदंत मुख्य आज्ञा के साथ चल रही क्रिया बताता है; ‘जाते हुए’ यूनानी संरचना के निकट और स्वाभाविक हिन्दी है।
- source_word: δὲ
  choice: और
  rationale: यह हल्का संयोजक है, जो इस निर्देश को पिछले निर्देशों से जोड़ता है; ‘और’ अनावश्यक विरोध व्यक्त किए बिना प्रवाह बनाए रखता है।
- source_word: κηρύσσετε
  choice: घोषणा करो
  rationale: यह सार्वजनिक और अधिकारपूर्ण ढंग से संदेश सुनाने की आज्ञा है; ‘घोषणा करो’ आधुनिक हिन्दी में स्पष्ट है और केवल धार्मिक उपदेश देने का अर्थ नहीं थोपता।
- source_word: λέγοντες
  choice: 'यह … :'
  rationale: कृदंत घोषणा की विषयवस्तु प्रस्तुत करता है। हिन्दी में ‘यह घोषणा करो:’ यूनानी का आशय स्वाभाविक रूप से व्यक्त करता है, बिना ‘कहते हुए’ की अनावश्यक पुनरुक्ति के।
- source_word: ὅτι
  choice: प्रत्यक्ष उद्धरण
  rationale: यह कही जाने वाली विषयवस्तु का परिचय देता है; हिन्दी में उद्धरण-चिह्न और द्विबिंदु से इसे स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: Ἤγγικεν
  choice: निकट आ गया है
  rationale: पूर्णकाल ऐसी निकटता बताता है जो आ चुकी है और जिसका परिणाम बना हुआ है; यह रूप केवल ‘निकट है’ की तुलना में उस पक्ष को बेहतर सुरक्षित रखता है।
- source_word: ἡ βασιλεία
  choice: राज्य
  rationale: ‘राज्य’ राजकीय शासन और उसके क्षेत्र—दोनों अर्थों की गुंजाइश रखता है और स्थापित, सुबोध हिन्दी पद है।
- source_word: τῶν οὐρανῶν
  choice: स्वर्ग का
  rationale: यह मत्ती की विशिष्ट अभिव्यक्ति को बनाए रखता है और उसे ‘परमेश्वर का’ कहकर अन्य सुसमाचारों के अनुरूप नहीं बनाता।
theological_decisions:
- issue: ‘स्वर्ग का राज्य’ का अर्थ
  choice: मत्ती की विशिष्ट अभिव्यक्ति ‘स्वर्ग का राज्य’ को यथावत रखा गया।
  alternative: परमेश्वर का राज्य; स्वर्ग का शासन
  rationale: मूल पाठ की शब्दावली को सुरक्षित रखना चाहिए। ‘राज्य’ शासन और राज्य-क्षेत्र दोनों की अर्थ-व्याप्ति खुली रखता है और समानांतर अंशों के साथ कृत्रिम सामंजस्य नहीं करता।
- issue: Ἤγγικεν का पक्ष
  choice: निकट आ गया है
  alternative: निकट है; पास आ गया है
  rationale: 'यह पूर्णकाल की वर्तमान-परिणाम वाली शक्ति को व्यक्त करता है: निकटता आ चुकी है और प्रभावी बनी हुई है, जबकि व्यापक राज्य-विज्ञान को अनावश्यक रूप से तय नहीं करता।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यह घोषणा करो:’ λέγοντες की विषयवस्तु को स्वाभाविक हिन्दी में प्रस्तुत करता है; अलग से ‘कहते हुए’ जोड़ने से होने वाली पुनरुक्ति से बचा गया है।
