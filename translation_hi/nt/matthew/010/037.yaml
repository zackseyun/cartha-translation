  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: hi
  text: जो पिता या माता से मुझसे अधिक[a] प्रेम करता है, वह मेरे योग्य नहीं है; और जो बेटे या बेटी से मुझसे अधिक प्रेम करता है, वह मेरे योग्य नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझसे बढ़कर।” यूनानी वाक्यांश ὑπὲρ ἐμέ का अर्थ है यीशु की अपेक्षा किसी को प्राथमिकता से प्रेम करना।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: जो … प्रेम करता है
  rationale: लेख सहित वर्तमान कृदन्त यहाँ किसी ऐसे व्यक्ति को सामान्य रूप से दर्शाता है जिसकी पहचान इस क्रिया से होती है। यह प्रयोग आधुनिक हिन्दी में स्वाभाविक और समावेशी है।
- source_word: πατέρα ἢ μητέρα
  choice: पिता या माता
  rationale: यूनानी पाठ में संबंधवाचक संज्ञाओं के साथ अधिकारवाचक सर्वनाम नहीं है; हिन्दी में भी उन्हें सीधे रखना अर्थ को स्पष्ट रखता है और अनावश्यक रूप से ‘अपने’ नहीं जोड़ता।
- source_word: ὑπὲρ ἐμέ
  choice: मुझसे अधिक
  rationale: इस तुलनात्मक प्रसंग में ὑπέρ यीशु की अपेक्षा किसी दूसरे को अधिक प्रेम या प्राथमिकता देने का भाव व्यक्त करता है। ‘मुझसे अधिक’ हिन्दी में इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: वह मेरे योग्य नहीं है
  rationale: यह μου के साथ ἄξιος को संक्षिप्त और सीधे ढंग से प्रस्तुत करता है तथा ‘मेरा होने योग्य’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: καὶ
  choice: और
  rationale: साधारण संयोजक पद दोनों समानान्तर कथनों की संरचना को सुरक्षित रखता है।
- source_word: υἱὸν ἢ θυγατέρα
  choice: बेटे या बेटी
  rationale: आधुनिक सामान्य हिन्दी में ‘बेटा/बेटी’ पारिवारिक संबंध के लिए अधिक सहज हैं; यूनानी की तरह कोई अधिकारवाचक सर्वनाम नहीं जोड़ा गया।
theological_decisions:
- issue: परिवार के प्रति प्रेम और यीशु के प्रति सर्वोच्च निष्ठा का संबंध
  choice: पद को इस रूप में रखा गया है कि यीशु के प्रति प्रेम को निकटतम पारिवारिक संबंधों से भी अधिक प्राथमिकता मिले।
  alternative: इसे नरम करके ‘मुझसे इतना प्रेम नहीं करता’ कहना, या परिवार से घृणा करने की माँग के रूप में विस्तार देना।
  rationale: यूनानी पाठ तुलनात्मक प्राथमिकता (‘मुझसे अधिक’) और अयोग्यता के स्पष्ट निर्णय को व्यक्त करता है। अनुवाद परिवार के प्रेम को बुरा ठहराए बिना शिष्यत्व की कठोर माँग बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों खंडों की समानान्तर रचना और दो बार आने वाला ‘वह मेरे योग्य नहीं है’ मूल के बलाघात को सुरक्षित रखते हैं।
