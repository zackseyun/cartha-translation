source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: hi
  text: तुम जिस किसी नगर या गाँव में प्रवेश करो, वहाँ अच्छी तरह पता लगाओ[a] कि उसमें कौन योग्य है[b], और वहीं ठहरे रहो, जब तक तुम वहाँ से निकल न जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पूछताछ करो’ अथवा ‘जाँच-पड़ताल करो’।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘योग्य’ से संभवतः ऐसा व्यक्ति अभिप्रेत है जो संदेशवाहकों को ठहराने के लिए उपयुक्त हो या उनका स्वागत करने को तैयार हो, न कि कोई ऐसा व्यक्ति जिसने परमेश्वर की कृपा अर्जित की हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε
  choice: तुम जिस किसी नगर या गाँव में प्रवेश करो
  rationale: यह अनिश्चित संबंधवाचक रचना किसी भी नगर या गाँव में प्रवेश की संभावना व्यक्त करती है। ‘जिस किसी’ अनिश्चितता को और ‘में प्रवेश करो’ εἰς तथा εἰσέλθητε की दिशात्मकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐξετάσατε
  choice: अच्छी तरह पता लगाओ
  rationale: क्रिया केवल सामान्य पूछने के बजाय सावधानी से पूछताछ करके जानकारी प्राप्त करने का भाव रखती है। यह अभिव्यक्ति आधुनिक हिन्दी में सहज है और खोजबीन की गंभीरता भी व्यक्त करती है।
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: कि कौन योग्य है
  rationale: ‘कौन’ उस नगर या गाँव के किसी व्यक्ति की पहचान पूछता है। ‘योग्य’ ἄξιος के मूल्यांकनात्मक अर्थ को बनाए रखता है और उसकी प्रासंगिक व्याख्या को मुख्य पाठ में अनावश्यक रूप से सीमित नहीं करता।
- source_word: κἀκεῖ μείνατε
  choice: वहीं ठहरे रहो
  rationale: ‘वहीं’ ἐκεῖ के स्थान-संदर्भ को बनाए रखता है, जबकि ‘ठहरे रहो’ μείνατε के किसी स्थान पर लगातार बने रहने के निर्देश को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἕως ἂν ἐξέλθητε
  choice: जब तक वहाँ से न निकलो
  rationale: यह भविष्य में प्रस्थान के समय तक ठहरे रहने की सीमा बताता है। नकारात्मक ‘जब तक ... न’ रचना हिन्दी में इस प्रकार की कालगत सीमा का स्वाभाविक रूप है।
theological_decisions:
- issue: मिशन-संबंधी निर्देश में ‘योग्य’ का अर्थ
  choice: मुख्य पाठ में ‘योग्य’ रखा गया है; पादटिप्पणी में प्रसंगानुसार उपयुक्त या संदेशवाहकों का स्वागत करने को तैयार व्यक्ति का भाव स्पष्ट किया गया है।
  alternative: इसे मुख्य पाठ में केवल ‘स्वागत करने को तैयार’ या ‘उपयुक्त’ कहना।
  rationale: ἄξιος में मूल्यांकनात्मक अर्थ है, पर प्रसंग किसी व्यक्ति द्वारा परमेश्वर की कृपा अर्जित करने की बात स्पष्ट रूप से नहीं करता। ‘योग्य’ मूल तनाव को सुरक्षित रखता है, और पादटिप्पणी संभावित गलत धार्मिक निष्कर्ष से बचाते हुए प्रसंग बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, आदरपूर्ण और निर्देशात्मक रूप अपनाया गया है। ‘नगर या गाँव’, ‘अच्छी तरह पता लगाओ’ और ‘ठहरे रहो’ सामान्य पाठकों के लिए स्पष्ट हैं। दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
