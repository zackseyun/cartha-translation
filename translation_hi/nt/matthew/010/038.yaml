source:
  edition: SBLGNT
  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: hi
  text: और जो अपना क्रूस नहीं उठाता और मेरे पीछे नहीं चलता, वह मेरे योग्य नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: जो
  rationale: अनिश्चित और सामान्य संबंधवाचक अर्थ को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λαμβάνει
  choice: उठाता
  rationale: क्रूस के साथ यह प्रयोग उसे अपने ऊपर लेने और उसके परिणाम स्वीकार करने का भाव देता है; हिन्दी में ‘क्रूस उठाना’ स्वाभाविक और सटीक है।
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: अपना क्रूस
  rationale: ‘अपना’ एकवचन कर्ता के साथ प्रत्येक व्यक्ति के अपने क्रूस का भाव सुरक्षित रखता है और हिन्दी में यूनानी αὐτοῦ के आत्मसंबंधी आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: मेरे पीछे नहीं चलता
  rationale: ἀκολουθεῖ और ὀπίσω μου दोनों को व्यक्त करते हुए शिष्य के यीशु के पीछे चलने का ठोस चित्र बनाए रखता है।
- source_word: μου ἄξιος
  choice: मेरे योग्य
  rationale: यूनानी संबंधवाचक रचना का सीधा, संक्षिप्त और गंभीर हिन्दी रूप है; इसमें ‘मेरा होने योग्य’ जैसी व्याख्यात्मक वृद्धि नहीं की गई।
theological_decisions:
- issue: क्रूस उठाने का शिष्यत्व-संबंधी कथन
  choice: ‘अपना क्रूस उठाता’ के ठोस चित्र को बनाए रखा गया।
  alternative: ‘दुःख स्वीकार करता’ या ‘आत्मत्याग करता’
  rationale: अमूर्त व्याख्या रोमी क्रूस से जुड़े कष्ट, अपमान और मृत्यु के प्रभावशाली चित्र को सीमित कर देती; मूल रूपक को बनाए रखना बेहतर है।
- issue: αὐτοῦ का सामान्य एकवचन प्रयोग
  choice: ‘अपना’
  alternative: ‘उसका’
  rationale: हिन्दी में जब कर्ता स्वयं अपनी वस्तु उठाता है, तब ‘अपना’ ही स्वाभाविक आत्मवाचक रूप है। यह प्रत्येक शिष्य पर लागू सामान्य एकवचन अर्थ को सुरक्षित रखता है और लिंग को अनावश्यक रूप से प्रमुख नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सहज रखी गई है। ‘क्रूस’ हिन्दी बाइबलीय परंपरा में परिचित शब्द है, जबकि वाक्यरचना मूल यूनानी की दो समन्वित नकारात्मक शर्तों और अंतिम मूल्यांकन को स्पष्ट रूप से बनाए रखती है।
