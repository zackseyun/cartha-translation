source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: hi
  text: इसलिए उनसे मत डरो, क्योंकि कोई भी बात ऐसी ढकी हुई नहीं है जो प्रकट न की जाएगी, और कोई भी छिपी हुई बात ऐसी नहीं है जो जानी न जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: इसलिए उनसे मत डरो
  rationale: οὖν के निष्कर्षसूचक भाव को ‘इसलिए’ और αὐτούς को स्वाभाविक हिंदी ‘उनसे’ से व्यक्त किया गया है। निषेधात्मक aorist subjunctive का प्रसंगानुकूल सीधा आदेश ‘मत डरो’ है।
- source_word: κεκαλυμμένον
  choice: ढका हुआ
  rationale: यह καλύπτω के पूर्ण कर्मवाच्य कृदंत का निकट और सहज रूप है; इससे अगले कर्मवाच्य ‘प्रकट किया जाएगा’ के साथ आवरण हटने का चित्र बना रहता है।
- source_word: ἀποκαλυφθήσεται
  choice: प्रकट न किया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य को बनाए रखा गया है और कर्ता को अनिर्दिष्ट छोड़ा गया है, जैसा यूनानी पाठ में है।
- source_word: κρυπτὸν
  choice: छिपा हुआ
  rationale: κρυπτός का सामान्य और अर्थ-सटीक हिंदी रूप, जो पहले खंड के ‘ढका हुआ’ से संबंधित रहते हुए भी अलग शब्दावली बनाए रखता है।
- source_word: γνωσθήσεται
  choice: जाना न जाएगा
  rationale: γινώσκω के भविष्य कर्मवाच्य का सीधा अनुवाद; ‘ज्ञात कराया जाएगा’ कहकर बाहरी कारक को अनावश्यक रूप से स्पष्ट नहीं किया गया।
theological_decisions:
- issue: प्रकाशन और ज्ञान के कर्मवाच्य रूपों का कर्ता
  choice: ‘प्रकट किया जाएगा’ और ‘जाना जाएगा’ में कर्ता अनिर्दिष्ट रखा गया
  alternative: ‘परमेश्वर प्रकट करेगा’ या ‘लोग जान लेंगे’
  rationale: मूल पाठ दिव्य कर्मवाच्य की संभावना रखता है, पर कर्ता का स्पष्ट नाम नहीं देता; अनुवाद इस अर्थगत खुलापन को सुरक्षित रखता है।
- issue: कथन का सार्वभौमिक रूप
  choice: ‘ऐसा कुछ भी ... नहीं’
  alternative: किसी विशेष रहस्य या शिक्षा तक कथन को सीमित करना
  rationale: οὐδὲν की व्यापकता को बनाए रखा गया है और प्रसंग से परे कोई संप्रदायगत व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और मौखिक रूप से सहज वाक्य। समानांतर संरचना तथा ‘ढका हुआ/छिपा हुआ’ और ‘प्रकट/जाना’ के भेद को सुरक्षित रखा गया है।
