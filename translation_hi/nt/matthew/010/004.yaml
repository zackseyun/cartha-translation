id: MAT.10.4
reference: Matthew 10:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Σίμων ὁ ⸀Καναναῖος καὶ Ἰούδας ⸀ὁ Ἰσκαριώτης ὁ καὶ παραδοὺς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: hi
  text: शमौन कनानी[a], और यहूदा इस्करियोती, जिसने उसे पकड़वा भी दिया था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शमौन उत्साही।” यहाँ यूनानी में “कनानी” है, जो संभवतः एक अरामी/इब्रानी पद को दर्शाता है और परंपरागत रूप से जिसका अर्थ “उत्साही” समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: या “जिसने उसे सौंप भी दिया था।” यूनानी क्रिया का अर्थ सामान्य रूप से “सौंप देना” हो सकता है, यद्यपि यहूदा के प्रसंग में यहाँ विश्वासघात करके पकड़वाने का भाव है।
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: कनानी
  rationale: यूनानी पद का लिप्यंतरण रखा गया है, क्योंकि यहाँ सामान्य यूनानी शब्द ζηλωτής नहीं, बल्कि अरामी/इब्रानी मूल से आया पद है। इसका परंपरागत अर्थ ‘उत्साही’ पादटिप्पणी में दिया गया है।
- source_word: Ἰσκαριώτης
  choice: इस्करियोती
  rationale: व्यक्तिनाम के साथ जुड़ी उपाधि का प्रचलित हिन्दी लिप्यंतरण।
- source_word: παραδοὺς
  choice: पकड़वा दिया था
  rationale: क्रिया का मूल अर्थ ‘सौंप देना’ है, पर यहूदा और यीशु के प्रसंग में शत्रुओं के हाथ पकड़वाने का भाव है। यह हिन्दी में प्रसंगगत विश्वासघात को स्वाभाविक रूप से व्यक्त करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: जिसने उसे पकड़वा भी दिया था
  rationale: संज्ञीकृत कृदंत को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य के रूप में दिया गया है; καί के लिए ‘भी’ बनाए रखा गया है।
theological_decisions:
- issue: παραδοὺς को तटस्थ ‘सौंप दिया’ कहा जाए या विश्वासघात-सूचक ‘पकड़वा दिया’
  choice: पकड़वा दिया
  alternative: सौंप दिया
  rationale: मत्ती के कथानक में यहूदा की यह क्रिया यीशु को उसके विरोधियों के हाथ लगवाने की है। ‘पकड़वा दिया’ उस प्रसंगगत नैतिक और संबंधपरक बल को व्यक्त करता है, पर यूनानी क्रिया की व्यापकता बनाए रखने के लिए ‘सौंप दिया’ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप। नामों का प्रचलित बाइबिलीय लिप्यंतरण रखा गया है। ‘कनानी’ को जातिसूचक ‘कनानी व्यक्ति’ समझे जाने की संभावना के कारण पादटिप्पणी में मूल और पारंपरिक अर्थ स्पष्ट किया गया है।
