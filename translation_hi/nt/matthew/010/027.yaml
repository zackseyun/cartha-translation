id: MAT.10.27
reference: Matthew 10:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: hi
  text: जो मैं तुमसे अँधेरे में कहता हूँ, उसे उजाले में कहो; और जो तुम कान में सुनते हो,[a] उसे छतों पर से घोषित करो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात जो बात निजी रूप से सुनाई जाती है।
    reason: idiom_clarification
  - marker: b
    text: प्राचीन घरों की छतें प्रायः सपाट होती थीं और वहाँ से सार्वजनिक घोषणा की जा सकती थी।
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: जो मैं तुमसे ... कहता हूँ
  rationale: सम्बन्धवाचक रचना और प्रत्यक्ष शिक्षा का भाव स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: ἐν τῇ σκοτίᾳ ... ἐν τῷ φωτί
  choice: अँधेरे में ... उजाले में
  rationale: मूल का स्पष्ट विरोधी बिंब सुरक्षित है; ‘गुप्त रूप से ... खुलेआम’ अर्थ तो बताता, पर बिंब को समतल कर देता।
- source_word: εἰς τὸ οὖς ἀκούετε
  choice: जो तुम कान में सुनते हो
  rationale: यूनानी के एकवचन ‘कान’ और निजी रूप से सुनाए जाने के सजीव बिंब को बनाए रखता है।
- source_word: κηρύξατε
  choice: घोषित करो
  rationale: सार्वजनिक और अधिकारपूर्ण घोषणा का भाव देता है, बिना इसे औपचारिक धर्मोपदेश तक सीमित किए।
- source_word: ἐπὶ τῶν δωμάτων
  choice: छतों पर से
  rationale: प्राचीन घरों की सपाट छतों से सार्वजनिक घोषणा किए जाने का आशय स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: अँधेरा/उजाला और कान/छतों की भाषा को बिंब के रूप में रखना या गुप्त/सार्वजनिक के अर्थ में व्याख्यायित करना
  choice: मुख्य पाठ में मूल बिंब सुरक्षित रखा गया है।
  alternative: ‘जो मैं तुमसे गुप्त रूप से कहता हूँ, उसे खुलेआम कहो; और जो तुम्हें निजी रूप से बताया जाता है, उसकी सार्वजनिक घोषणा करो।’
  rationale: यीशु की उक्ति में निजी रूप से दिए गए संदेश और सार्वजनिक उद्घोषणा के बीच तनाव सजीव बिंबों से व्यक्त होता है; व्याख्यात्मक रूप इसे अनावश्यक रूप से सपाट कर देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘अँधेरे/उजाले’, ‘कान’ और ‘छतों’ के मूल बिंब रखे गए हैं; ‘छतों पर से’ हिन्दी में घोषणा के स्थान और दिशा को स्वाभाविक रूप से व्यक्त करता है।
