  text: πορεύεσθε δὲ μᾶλλον πρὸς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/006.yaml
  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: hi
  text: बल्कि इस्राएल के घराने की खोई हुई भेड़ों के पास जाओ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बल्कि उन भेड़ों के पास जाओ जो इस्राएल के घराने से खो गई हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: जाओ
  rationale: वर्तमान काल का बहुवचन आज्ञार्थक रूप है। मिशन पर भेजे जाने के संदर्भ में ‘जाओ’ स्वाभाविक और सीधी आज्ञा है।
- source_word: δὲ μᾶλλον
  choice: बल्कि
  rationale: यह संयुक्त अभिव्यक्ति पिछली मनाही के विपरीत दिशा और प्राथमिक गंतव्य बताती है; हिन्दी में ‘बल्कि’ इस विरोध और पुनर्निर्देशन को संक्षेप में व्यक्त करता है।
- source_word: πρὸς
  choice: के पास
  rationale: गति-सूचक क्रिया के साथ πρός गंतव्य की ओर जाने का बोध देता है। व्यक्तियों के रूपक के साथ ‘के पास’ सहज हिन्दी है।
- source_word: τὰ πρόβατα τὰ ἀπολωλότα
  choice: खोई हुई भेड़ों
  rationale: ἀπολωλότα पूर्ण कृदन्त है और यहाँ चरवाही के रूपक में ‘खोई हुई’ उपयुक्त है। ‘भेड़ों’ मूल बिंब को बनाए रखता है।
- source_word: οἴκου Ἰσραήλ
  choice: इस्राएल के घराने की
  rationale: ‘घराना’ οἶκος के सामुदायिक और वाचा-संबंधी अर्थ को बनाए रखते हुए आधुनिक हिन्दी में ‘इस्राएल का घर’ से अधिक स्वाभाविक है।
theological_decisions:
- issue: इस्राएल का रूपकात्मक वर्णन
  choice: ‘इस्राएल के घराने की खोई हुई भेड़ें’ रूपक को ज्यों का त्यों रखना
  alternative: ‘भटके हुए इस्राएली लोग’
  rationale: यूनानी पाठ में भेड़ों का रूपक स्पष्ट है और उसका धर्मशास्त्रीय तथा शास्त्रीय अंतरपाठीय महत्व है; व्याख्यात्मक परिभाषा उस बिंब को मिटा देगी।
- issue: सम्बन्धवाचक पदबंध की सम्भावित व्याप्ति
  choice: मुख्य पाठ में ‘इस्राएल के घराने की खोई हुई भेड़ें’
  alternative: ‘वे भेड़ें जो इस्राएल के घराने से खो गई हैं’
  rationale: 'यूनानी पदक्रम दोनों निकट अर्थों की अनुमति देता है: भेड़ें इस्राएल के घराने की हैं, अथवा उससे खो गई हैं। मुख्य पाठ पारंपरिक और स्वाभाविक सम्बन्ध को रखता है, जबकि पादटिप्पणी दूसरी सम्भावना सुरक्षित करती है।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘इस्राएल के घराने’ में बाइबलीय सामुदायिक भाषा और ‘खोई हुई भेड़ों’ में मूल रूपक सुरक्षित रखा गया है।
