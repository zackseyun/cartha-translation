  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: hi
  text: और भाई अपने भाई को मृत्यु के लिए हवाले कर देगा[a], और पिता अपनी संतान को; और बच्चे अपने माता-पिता के विरुद्ध उठ खड़े होंगे और उन्हें मौत के घाट उतार देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सौंप देगा’; इस क्रिया में विश्वासघात करके किसी को हवाले कर देने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: सौंप देगा
  rationale: यह क्रिया किसी व्यक्ति को शत्रुतापूर्ण अधिकारियों के हवाले करने का भाव देती है। ‘सौंप देगा’ उसके ठोस अर्थ को बनाए रखता है, जबकि मुख्य पाठ में विश्वासघात का भाव अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: भाई अपने भाई को
  rationale: प्रतिनिधिक एकवचन और पुरुष-सूचक पारिवारिक संबंध दोनों सुरक्षित रहते हैं; ‘अपने’ स्वाभाविक हिन्दी संबंध स्पष्ट करता है।
- source_word: εἰς θάνατον
  choice: मरवा डालने के लिए
  rationale: यह पदबंध सौंपे जाने के लक्ष्य अथवा परिणाम—मृत्यु—को व्यक्त करता है। इस संदर्भ में ‘मरवा डालने के लिए’ स्वाभाविक हिन्दी में कारणात्मक और प्राणदंड-सदृश भाव रखता है।
- source_word: πατὴρ τέκνον
  choice: पिता अपनी संतान को
  rationale: τέκνον पुत्र तक सीमित नहीं है। ‘संतान’ स्रोत की व्यापकता और प्रतिनिधिक एकवचन बनाए रखता है।
- source_word: ἐπαναστήσονται
  choice: विरुद्ध उठ खड़ी होंगी
  rationale: यह विरोध में उठने का सजीव भाव बनाए रखता है और इसे केवल राजनीतिक विद्रोह तक सीमित नहीं करता।
- source_word: τέκνα
  choice: संतानें
  rationale: यह शब्द पुत्र और पुत्रियों दोनों को समेटता है तथा ‘माता-पिता’ के साथ पारिवारिक संबंध स्पष्ट रखता है।
- source_word: ἐπὶ γονεῖς
  choice: अपने माता-पिता के विरुद्ध
  rationale: शत्रुतापूर्ण प्रसंग में ἐπί का अर्थ ‘के विरुद्ध’ है। ‘अपने’ हिन्दी में निहित पारिवारिक संबंध स्वाभाविक रूप से स्पष्ट करता है।
- source_word: θανατώσουσιν
  choice: मरवा डालेंगी
  rationale: θανατόω जान से मारने, प्रायः किसी औपचारिक या सोची-समझी कार्रवाई से मृत्यु कराने, का अर्थ देता है। कारणात्मक हिन्दी रूप बच्चों द्वारा माता-पिता को अधिकारियों के हाथों मरवाने की संभावित प्रक्रिया को खुला रखता है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: सर्वनाम का निकटतम पूर्वपद ‘माता-पिता’ है; हिन्दी सर्वनाम यूनानी प्रवाह और स्पष्ट संदर्भ दोनों बनाए रखता है।
theological_decisions:
- issue: लिंग-सूचक और प्रतिनिधिक पारिवारिक शब्द
  choice: ἀδελφός के लिए ‘भाई’ और व्यापक τέκνον/τέκνα तथा γονεῖς के लिए ‘संतान/संतानें’ और ‘माता-पिता’
  alternative: ἀδελφός को सामान्यीकृत करके ‘भाई-बहन’ या ‘सहोदर’ कहना
  rationale: ἀδελφός यहाँ पुरुष-सूचक एकवचन है, इसलिए ‘भाई’ स्रोत के अधिक निकट है; अन्य पारिवारिक शब्दों की व्यापकता समावेशी हिन्दी शब्दों से सुरक्षित रहती है।
- issue: परिवार द्वारा मृत्यु कराने की रीति
  choice: ‘मरवा डालने’ द्वारा कारणात्मक अर्थ को खुला रखना
  alternative: ‘मार डालना’, जिससे प्रत्यक्ष हत्या का अर्थ अधिक प्रबल हो सकता है
  rationale: संदर्भ में παραδίδωμι किसी को अधिकारियों के हवाले करने और θανατόω मृत्यु कराने की ओर संकेत कर सकते हैं। अनुवाद प्रत्यक्ष व्यक्तिगत हत्या को अनिवार्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। ‘संतान’ स्रोत की लिंग-व्यापकता बचाता है, जबकि ‘भाई’ मूल के पुरुष-सूचक रूप को बनाए रखता है। ‘मरवा डालना’ परिवार द्वारा सीधे हत्या करने और अधिकारियों के हाथों मृत्यु कराने के बीच स्रोत में विद्यमान संभावित खुलापन सुरक्षित रखता है।
