  rationale: यह साधारण संयोजक पिछले कथन से इस वाक्य को जोड़ता है; ‘और’ बिना अतिरिक्त व्याख्या जोड़े उसके बल को सुरक्षित रखता है।
- source_word: ἐχθροὶ
  choice: शत्रु
  rationale: यह संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण है और विरोध रखनेवालों को दर्शाता है; ‘शत्रु’ स्वाभाविक तथा पर्याप्त रूप से प्रबल समतुल्य है।
- source_word: τοῦ ἀνθρώπου
  choice: मनुष्य के
  rationale: सम्बन्धकारक पदबंध को हिन्दी में अधिकारसूचक रूप में स्वाभाविक ढंग से व्यक्त किया गया है। ‘मनुष्य’ यूनानी के प्रतिनिधिक पुल्लिंग एकवचन को बनाए रखते हुए सामान्य मानव का अर्थ भी दे सकता है।
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: उसके अपने घराने के लोग ही
  rationale: οἰκιακοί भौतिक घर नहीं, बल्कि घराने अथवा गृहस्थी से जुड़े लोगों को दर्शाता है। ‘अपने’ αὐτοῦ के सम्बन्धात्मक बल को और ‘ही’ विधेय की केन्द्रित पहचान को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἀνθρώπου में प्रतिनिधिक पुल्लिंग भाषा
  choice: मनुष्य के
  alternative: किसी व्यक्ति के
  rationale: यूनानी में पुल्लिंग एकवचन ἄνθρωπος इस लोकोक्तिपरक कथन में प्रतिनिधिक रूप से प्रयुक्त है। ‘मनुष्य’ स्रोत का रूप और उसका सामान्य मानवीय आशय दोनों सुरक्षित रखता है; पादटिप्पणी अधिक स्पष्ट समावेशी विकल्प देती है।
- issue: οἰκιακοί का दायरा
  choice: घराने के लोग
  alternative: परिवार के सदस्य
  rationale: शब्द का आशय एक ही गृहस्थी से जुड़े सदस्यों से है और यह केवल निकट जैविक परिवार तक सीमित होना आवश्यक नहीं। इसलिए ‘घराने के लोग’ व्यापक घरेलू सम्बन्ध को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथनात्मक रूप। ‘घराना’ घरेलू सदस्यों के व्यापक समूह को व्यक्त करता है; ‘लोग’ अर्थ को सामान्य पाठक के लिए स्पष्ट करता है।
