  rationale: प्रत्येक बाल को समेटने वाली पूर्णता को सरल और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἠριθμημέναι εἰσίν
  choice: गिने हुए हैं
  rationale: परिप्रयुक्त पूर्ण निष्क्रिय रूप किसी पूरी की गई क्रिया के वर्तमान परिणाम अथवा बनी हुई अवस्था को दर्शाता है; ‘गिने हुए हैं’ इस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
