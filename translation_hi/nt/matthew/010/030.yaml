  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘यहाँ तक कि’ की अपेक्षा ‘बाल तक’ ने मूल के बल को कम शब्दों में स्वाभाविक रूप दिया है।
