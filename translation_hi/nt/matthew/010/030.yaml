  choice: बालों के गिने हुए होने के ठोस कथन को ज्यों का त्यों रखा गया है।
  alternative: इसे परमेश्वर की सर्वज्ञता, देखभाल या नियंत्रण की स्पष्ट धर्मवैज्ञानिक व्याख्या के रूप में विस्तृत करना।
  rationale: मूल पद ठोस बिंब प्रस्तुत करता है, पर कर्ता का नाम या विस्तृत धर्मसिद्धान्त नहीं जोड़ता; निहितार्थ को संदर्भ से उभरने देना उचित है।
