source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: hi
  text: 'बारह प्रेरितों के नाम ये हैं: सबसे पहले[a] शमौन, जो पतरस कहलाता है, और उसका भाई अन्द्रियास; जब्दी का पुत्र याकूब और उसका भाई यूहन्ना,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सबसे पहले’ केवल सूची-क्रम को नहीं, बल्कि बारहों में शमौन की प्रमुखता को भी सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: अलग से शब्द देकर अनुवाद नहीं किया
  rationale: यहाँ δέ नामों की सूची की ओर हल्का संक्रमण कराता है। हिन्दी वाक्य-विन्यास और प्रसंग यह संक्रमण स्वाभाविक रूप से व्यक्त करते हैं; ‘अब’ जोड़ने से अनावश्यक कालगत अर्थ आ सकता है।
- source_word: δώδεκα ἀποστόλων
  choice: बारह प्रेरितों
  rationale: ‘प्रेरित’ ἀπόστολος के लिए प्रचलित और प्रसंगानुकूल हिन्दी पद है तथा यीशु द्वारा नियुक्त इस पहचाने हुए समूह को स्पष्ट करता है।
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: के नाम ये हैं
  rationale: यह यूनानी की संकेतवाचक रचना को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: πρῶτος
  choice: पहला
  rationale: सूची के आरम्भ में इसका सीधा अर्थ ‘पहला’ है; मुख्य पाठ अधिकार या पद की प्रधानता को निश्चित नहीं करता।
- source_word: ὁ λεγόμενος
  choice: जो ... कहलाता है
  rationale: यह कृदन्तीय अभिव्यक्ति शमौन की पहचान पतरस नाम से कराती है और यूनानी के वर्तमान भाव को स्पष्ट रखती है।
- source_word: Πέτρος
  choice: पतरस
  rationale: यह हिन्दी बाइबलीय परंपरा में इस नाम का मानक रूप है।
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: उसका भाई
  rationale: दोनों स्थानों पर ἀδελφός सगा भाई बताता है; पहले सर्वनाम का संदर्भ शमौन और दूसरे का याकूब है।
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: जब्दी का पुत्र
  rationale: यूनानी संबंधकारक पहचान में पुत्रत्व निहित है; हिन्दी में उसे ‘जब्दी का पुत्र’ कहना स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: शमौन/पतरस के साथ πρῶτος का आशय
  choice: मुख्य पाठ में ‘पहला’ रखकर सूचीगत क्रम को सामने रखा गया है।
  alternative: यह शब्द बारहों में प्रमुखता या विशेष स्थान का संकेत भी दे सकता है।
  rationale: πρῶτος क्रम में प्रथम को दर्शा सकता है और संभवतः प्रमुखता की छाया भी रख सकता है। पद स्वयं अधिकार की किसी विशिष्ट धर्मसैद्धांतिक धारणा को निर्णायक नहीं बनाता, इसलिए संभावित अर्थछाया पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। व्यक्तिनामों के लिए हिन्दी बाइबलीय परंपरा के परिचित रूप—शमौन, पतरस, अन्द्रियास, जब्दी, याकूब और यूहन्ना—प्रयुक्त हैं।
