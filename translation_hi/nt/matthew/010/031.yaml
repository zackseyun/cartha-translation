  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: hi
  text: इसलिए मत डरो; तुम बहुत-सी गौरैयों से अधिक मूल्यवान हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν φοβεῖσθε
  choice: इसलिए मत डरो
  rationale: οὖν पिछले तर्क से निकले निष्कर्ष को दिखाता है, और μὴ के साथ वर्तमान आज्ञार्थक φοβεῖσθε भयभीत न होने की मनाही व्यक्त करता है। ‘इसलिए मत डरो’ आधुनिक हिन्दी में इस संबंध और आज्ञा दोनों को स्वाभाविक रूप से रखता है।
- source_word: πολλῶν στρουθίων
  choice: बहुत-सी गौरैयों से
  rationale: निकटवर्ती संदर्भ (मत्ती 10:29) में στρουθία छोटी, सामान्य गौरैयों को सूचित करता है। संबंधकारक रूप διαφέρετε के साथ तुलना व्यक्त करता है।
- source_word: διαφέρετε
  choice: अधिक मूल्यवान हो
  rationale: यहाँ διαφέρω का अर्थ केवल ‘भिन्न होना’ नहीं, बल्कि मूल्य या महत्त्व में बढ़कर होना है। ‘अधिक मूल्यवान’ संदर्भ में परमेश्वर की देखभाल से जुड़ी तुलना को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὑμεῖς
  choice: तुम
  rationale: मूल पाठ का स्पष्ट सर्वनाम शिष्यों पर बल देता है। हिन्दी में ‘तुम’ को प्रत्यक्ष रखना इस बल को पर्याप्त रूप से व्यक्त करता है।
theological_decisions:
- issue: मनुष्यों और गौरैयों के तुलनात्मक मूल्य का कथन
  choice: तुम बहुत-सी गौरैयों से अधिक मूल्यवान हो
  alternative: तुम बहुत-सी गौरैयों से बढ़कर हो
  rationale: ‘अधिक मूल्यवान’ διαφέρετε के प्रसंगगत तुलनात्मक अर्थ को स्पष्ट करता है। यह शिष्यों के प्रति परमेश्वर की अधिक देखभाल बताता है, पर गौरैयों के प्रति उसकी देखभाल का निषेध नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भयभीत मत हो’ की अपेक्षा ‘मत डरो’ सामान्य पाठक के लिए अधिक स्वाभाविक है, जबकि मूल आज्ञा का पूरा बल बनाए रखता है।
