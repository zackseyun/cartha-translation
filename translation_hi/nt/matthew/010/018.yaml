source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: hi
  text: और मेरे कारण तुम्हें राज्यपालों और राजाओं के सामने ले जाया जाएगा, ताकि तुम उनके[a] और गैर-यहूदियों[b] के लिए गवाही बनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके विरुद्ध।” यूनानी दत्तिव यहाँ अपने आप में यह स्पष्ट नहीं करता कि गवाही उनके लिए है या उनके विरुद्ध।
    reason: alternative_reading
  - marker: b
    text: या, “राष्ट्रों के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: राज्यपालों और राजाओं के सामने
  rationale: ἐπί के साथ कर्मकारक और ‘ले जाए जाने’ की क्रिया यहाँ अधिकारियों के न्यायिक या राजकीय सम्मुख उपस्थित किए जाने का भाव देती है। ‘राज्यपाल’ ἡγεμών और ‘राजा’ βασιλεύς के स्वाभाविक आधुनिक हिन्दी समतुल्य हैं।
- source_word: ἀχθήσεσθε
  choice: तुम्हें ... ले जाया जाएगा
  rationale: यह ἄγω का भविष्यत् कर्मवाच्य रूप है। हिन्दी में यह प्रयोग स्वाभाविक है और बलपूर्वक घसीटे जाने का ऐसा भाव नहीं जोड़ता जो यूनानी में स्पष्ट नहीं है।
- source_word: ἕνεκεν ἐμοῦ
  choice: मेरे कारण
  rationale: ἕνεκεν के साथ संबंधकारक कारण या आधार व्यक्त करता है। ‘मेरे कारण’ स्पष्ट, सहज और यीशु के व्यक्तिगत संदर्भ को बनाए रखता है।
- source_word: εἰς μαρτύριον
  choice: गवाही बने
  rationale: εἰς यहाँ उद्देश्य या परिणाम का भाव दे सकता है। ‘गवाही बने’ संज्ञात्मक विचार को स्वाभाविक हिन्दी में व्यक्त करता है और शिष्यों की इस पेशी को ही गवाही के रूप में प्रस्तुत करता है।
- source_word: αὐτοῖς
  choice: उनके लिए
  rationale: दत्तिव सर्वनाम का सबसे निकट संदर्भ राज्यपाल और राजा हैं। हिन्दी में ‘उनके लिए’ मूल की तटस्थता रखता है; संदर्भ में प्रतिकूल गवाही की संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τοῖς ἔθνεσιν
  choice: गैर-यहूदियों
  rationale: मत्ती में ἔθνη प्रायः इस्राएल से भिन्न जातियों, अर्थात गैर-यहूदियों, के लिए आता है। ‘गैर-यहूदी’ आधुनिक पाठक के लिए स्पष्ट है, जबकि ‘राष्ट्र’ की शाब्दिक संभावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: μαρτύριον αὐτοῖς में गवाही का संबंध
  choice: तटस्थ ‘उनके लिए’
  alternative: ‘उनके विरुद्ध’
  rationale: यूनानी दत्तिव αὐτοῖς अपने आप में विरोध या दोषारोपण को स्पष्ट नहीं करता। तटस्थ अनुवाद इस तनाव को खुला रखता है कि गवाही सुनने वालों के लिए साक्ष्य है और उनकी प्रतिक्रिया के अनुसार उनके विरुद्ध भी ठहर सकती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। न्यायिक संदर्भ को ‘सामने ले जाया जाएगा’ से व्यक्त किया गया है। ‘गैर-यहूदी’ सामान्य आधुनिक पाठक के लिए ‘अन्यजाति’ की अपेक्षा अधिक पारदर्शी है।
