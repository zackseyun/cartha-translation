id: MAT.10.23
reference: Matthew 10:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: hi
  text: पर जब कभी वे इस नगर में तुम्हें सताएँ, तो दूसरे नगर में भाग जाओ।[a] क्योंकि मैं तुमसे सच कहता हूँ, मनुष्य के पुत्र के आने तक[c] तुम इस्राएल के नगरों का दौरा हरगिज़ पूरा नहीं कर पाओगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘किसी दूसरे नगर में भाग जाओ।’ यूनानी में शब्दशः ‘दूसरे में’ है; ‘नगर’ पिछले वाक्यांश से समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तुम इस्राएल के नगरों को हरगिज़ पूरा नहीं कर पाओगे।’ ‘नगरों का दौरा’ मिशन के प्रसंग में निहित नगर-नगर जाने की गतिविधि को स्पष्ट करता है।
    reason: lexical_alternative
  - marker: c
    text: ‘मनुष्य के पुत्र के आने तक’ को जानबूझकर खुला रखा गया है। इसके अर्थ के विषय में अलग-अलग मत हैं—यह यीशु की महिमा या प्रतिष्ठा प्रकट होने, न्याय के लिए आने, या उसके अंतिम पुनरागमन की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: जब कभी
  rationale: यह अनिश्चित समय और संभावित या बार-बार होने वाली परिस्थिति को व्यक्त करता है; ‘जब कभी’ इस खुले अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: διώκωσιν
  choice: सताएँ
  rationale: इस मिशन-संबंधी प्रसंग में क्रिया का अर्थ केवल पीछा करना नहीं, बल्कि विरोध के कारण उत्पीड़ित करना है।
- source_word: πόλει ταύτῃ
  choice: इस नगर में
  rationale: निकटवाची संकेतवाचक का सीधा अर्थ सुरक्षित रखा गया है।
- source_word: φεύγετε
  choice: भाग जाओ
  rationale: आज्ञार्थक क्रिया उत्पीड़न से बचने के लिए तत्काल स्थान छोड़ने की बात करती है; यह सामान्य आधुनिक हिन्दी में स्पष्ट और प्रभावशाली है।
- source_word: εἰς τὴν ἑτέραν
  choice: दूसरे नगर में
  rationale: यूनानी में ‘नगर’ पिछली उपवाक्य से समझा जाता है। ‘दूसरे नगर में’ मूल की संक्षिप्तता और अर्थ दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀμὴν
  choice: सच
  rationale: यह यीशु के गंभीर और अधिकारपूर्ण कथन की भूमिका है; ‘मैं तुमसे सच कहता हूँ’ आधुनिक हिन्दी में सहज और प्रतिष्ठित रूप है।
- source_word: οὐ μὴ τελέσητε
  choice: हरगिज़ पूरा नहीं कर पाओगे
  rationale: οὐ μή का प्रबल निषेध ‘हरगिज़ ... नहीं’ से व्यक्त किया गया है, जबकि τελέω के पूर्ण करने के अर्थ को ‘पूरा’ बनाए रखता है।
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: इस्राएल के नगरों में
  rationale: यह इस्राएल के नगरों को दर्शाता है। हिन्दी में ‘घूमना’ के साथ परसर्ग ‘में’ मिशन के दौरान नगर-नगर जाने का निहित अर्थ स्पष्ट करता है।
- source_word: ἕως ἂν ἔλθῃ
  choice: के आने तक
  rationale: यह भविष्य के उस बिंदु को बताता है जिस तक नगरों का भ्रमण पूरा नहीं होगा; मूल की कालगत संरचना सुरक्षित है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह स्थापित पदवी मूल के शाब्दिक रूप और उसके दानिय्येल-संबंधी तथा धर्मवैज्ञानिक संकेतों को सुरक्षित रखती है; वाक्य में इसका संबंधकारक रूप ‘मनुष्य के पुत्र’ है।
theological_decisions:
- issue: ‘मनुष्य के पुत्र के आने’ का आशय
  choice: ‘मनुष्य के पुत्र के आने तक’ को बिना किसी विशिष्ट घटना से जोड़े रखा गया है।
  alternative: इसे यीशु के पुनरुत्थान और प्रतिष्ठापन, यरूशलेम पर न्याय, या अंतिम पुनरागमन के रूप में स्पष्ट करना।
  rationale: यूनानी वाक्य स्वयं यह निश्चित नहीं करता कि यहाँ किस आगमन की बात है। इसलिए अनुवाद किसी एक युगांत-विषयक व्याख्या को मुख्य पाठ में नहीं जोड़ता और मूल की धर्मवैज्ञानिक खुली स्थिति बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘भाग जाओ’ साधारण पाठक के लिए सहज है, ‘हरगिज़’ प्रबल यूनानी निषेध को व्यक्त करता है, और ‘मनुष्य का पुत्र’ पारंपरिक तथा स्रोत-संगत पदवी के रूप में सुरक्षित है।
