id: MAT.10.42
reference: Matthew 10:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: hi
  text: और जो कोई इन छोटों[a] में से किसी एक को उसे चेला समझकर[b] ठंडे पानी का केवल एक प्याला भी पिलाए, मैं तुमसे सच कहता हूँ, वह निश्चय ही अपना प्रतिफल नहीं खोएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘इन छोटों’ से यहाँ संभवतः यीशु के अनुयायियों में वे लोग अभिप्रेत हैं जिन्हें छोटा, दीन या कम महत्त्वपूर्ण समझा जाता है; यह अभिव्यक्ति केवल बच्चों तक सीमित नहीं है।
    reason: संभावित संदर्भ को स्पष्ट करना, बिना मुख्य पाठ का अर्थ संकीर्ण किए।
  - marker: b
    text: 'अधिक शब्दानुसार: ‘चेले के नाम पर।’ आशय यह है कि पानी पाने वाले की चेले के रूप में पहचान के कारण यह सेवा की गई।'
    reason: यूनानी वाक्यांश का अधिक रूपगत विकल्प और उसका प्रसंगगत अर्थ सुरक्षित रखना।
lexical_decisions:
- source_word: ὃς ἂν
  choice: जो कोई
  rationale: संबंधवाचक सर्वनाम के साथ ἄν वाक्य को अनिश्चित और सार्वभौमिक बनाता है; ‘जो कोई’ इस खुले सामान्य भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: ποτίσῃ
  choice: पिलाए
  rationale: क्रिया का मूल अर्थ किसी को पीने के लिए देना है। ‘एक प्याला ठंडा पानी पिलाए’ हिन्दी में सहज और स्रोत के निकट है।
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: इन छोटों में से किसी एक को
  rationale: ‘छोटों’ से मूल का रूपकात्मक खुलापन बना रहता है; प्रसंग में यह केवल आयु में छोटे बच्चों तक सीमित नहीं, बल्कि दीन या कम महत्त्वपूर्ण समझे जाने वाले चेलों की ओर भी संकेत कर सकता है।
- source_word: ποτήριον ψυχροῦ
  choice: एक प्याला ठंडा पानी
  rationale: ψυχροῦ के साथ ‘पानी’ निहित है। ‘प्याला ठंडा पानी’ साधारण और छोटे आतिथ्य-कर्म को स्पष्ट करता है।
- source_word: μόνον
  choice: केवल ... भी
  rationale: यह भेंट की अत्यल्पता पर बल देता है। हिन्दी में ‘केवल एक प्याला ... भी’ ‘सिर्फ इतना ही’ और ‘यहाँ तक कि इतना छोटा काम’—दोनों भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς ὄνομα μαθητοῦ
  choice: चेला जानकर
  rationale: वाक्यांश बताता है कि सेवा पाने वाले की चेले के रूप में पहचान के कारण यह काम किया गया। मुख्य पाठ में अर्थ स्पष्ट है, जबकि अधिक रूपगत अनुवाद पादटिप्पणी में रखा गया है।
- source_word: ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यह यीशु की गंभीर और अधिकारपूर्ण घोषणा का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: οὐ μὴ ἀπολέσῃ
  choice: निश्चय ही ... नहीं खोएगा
  rationale: οὐ μή का प्रबल निषेध साधारण ‘नहीं’ से अधिक दृढ़ है; ‘निश्चय ही ... नहीं’ उस आश्वासन को स्पष्ट रखता है।
- source_word: τὸν μισθὸν αὐτοῦ
  choice: अपना प्रतिफल
  rationale: μισθός यहाँ मजदूरी से व्यापक अर्थ में किए गए काम के फल या पुरस्कार को दर्शाता है; ‘प्रतिफल’ गरिमापूर्ण और प्रसंगानुकूल है।
theological_decisions:
- issue: ‘इन छोटों’ का आशय
  choice: अभिव्यक्ति को ‘इन छोटों’ के रूप में खुला रखा गया है, और पादटिप्पणी में प्रसंगगत अर्थ बताया गया है।
  alternative: इसे केवल बच्चों, केवल नए विश्वासियों, या केवल दुर्बल विश्वासियों तक सीमित करना।
  rationale: निकटवर्ती प्रसंग चेलों को ग्रहण करने और यीशु से उनके संबंध के कारण उनकी सेवा करने की बात करता है। मूल अभिव्यक्ति को किसी एक संकीर्ण वर्ग तक सीमित करना उचित नहीं।
- issue: εἰς ὄνομα μαθητοῦ का संबंध
  choice: ‘चेला जानकर’—अर्थात पाने वाले की चेले के रूप में पहचान के कारण।
  alternative: ‘चेले के नाम पर’ अथवा किसी विधिवत सूत्र या प्रतिनिधिक अधिकार के अर्थ में लेना।
  rationale: यूनानी वाक्यांश पहचान या हैसियत के आधार पर किए गए कार्य को व्यक्त कर सकता है। मुख्य पाठ इसका प्रसंगगत अर्थ देता है, पर रूपगत विकल्प पादटिप्पणी में सुरक्षित है।
- issue: प्रतिफल का स्वरूप
  choice: ‘प्रतिफल’ को बिना अतिरिक्त व्याख्या के रखा गया है।
  alternative: इसे स्पष्टतः सांसारिक, स्वर्गीय, उद्धार-संबंधी, या योग्यता से अर्जित प्रतिफल घोषित करना।
  rationale: इस पद में प्रतिफल का स्वरूप या उसका धर्मवैज्ञानिक तंत्र स्पष्ट नहीं किया गया; अनुवाद को भी यह तनाव खुला रखना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चेला’, ‘प्याला’ और ‘प्रतिफल’ हिन्दी बाइबिलीय प्रयोग में परिचित हैं, फिर भी सामान्य पाठक के लिए बोधगम्य हैं। वाक्य में दृढ़ आश्वासन को ‘निश्चय ही ... नहीं’ से व्यक्त किया गया है; किसी सांप्रदायिक प्रतिफल-सिद्धांत को नहीं जोड़ा गया।
