reference: Matthew 10:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: hi
  text: पर लोगों से सावधान रहो, क्योंकि वे तुम्हें परिषदों के हवाले कर देंगे और अपने आराधनालयों में तुम्हें कोड़े लगाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε
  choice: सावधान रहना
  rationale: बहुवचन आज्ञार्थक रूप खतरे के प्रति लगातार सतर्क रहने की चेतावनी देता है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन से हल्का विरोध अथवा चेतावनी की ओर नया मोड़ दिखाता है।
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: लोगों से
  rationale: प्रस्तावना ἀπό यहाँ खतरे के स्रोत को दर्शाती है। ἄνθρωποι का आशय सामान्य रूप से मनुष्य हैं, केवल पुरुष नहीं।
- source_word: παραδώσουσιν
  choice: हवाले कर देंगे
  rationale: यह अधिकारियों अथवा न्यायिक निकायों के अधिकार में सौंपे जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है; 'विश्वासघात करेंगे' मूल से अधिक विशिष्ट होता।
- source_word: συνέδρια
  choice: परिषदों
  rationale: बहुवचन शब्द स्थानीय शासकीय या न्यायिक परिषदों को दर्शाता है, आवश्यक रूप से यरूशलेम की महासभा को नहीं।
- source_word: συναγωγαῖς
  choice: आराधनालयों
  rationale: यह यहूदी सभास्थल के ठोस संदर्भ को दर्शाने वाला हिन्दी बाइबलीय और बोधगम्य पद है।
- source_word: αὐτῶν
  choice: अपने
  rationale: हिन्दी में कर्ता-संबद्ध स्वामित्व के लिए 'अपने आराधनालयों' स्वाभाविक है और यूनानी 'उनके' का संबंध सुरक्षित रखता है।
- source_word: μαστιγώσουσιν
  choice: कोड़े लगाएँगे
  rationale: यह न्यायिक शारीरिक दंड के रूप में कोड़े मारने का गंभीर अर्थ स्पष्ट, वर्तमान हिन्दी में देता है।
theological_decisions:
- issue: ἀνθρώπων का लिंग-संबंधी अनुवाद
  choice: लोगों
  alternative: मनुष्यों / पुरुषों
  rationale: यूनानी रूप व्याकरण की दृष्टि से पुल्लिंग बहुवचन है, पर यहाँ अर्थ सामान्य मानव विरोधियों से है; 'पुरुषों' कहने से अनावश्यक रूप से केवल पुरुषों का संकेत मिलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन 'तुम' के अनुरूप है। भाषा सहज, गरिमापूर्ण और न्यायिक उत्पीड़न के संदर्भ में स्पष्ट रखी गई है। किसी पादटिप्पणी की आवश्यकता नहीं, क्योंकि 'लोगों' मूल के सामान्य अर्थ को सीधे और बिना भ्रम के व्यक्त करता है।
