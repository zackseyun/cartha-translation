source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: hi
  text: यह मत समझो कि मैं पृथ्वी पर शांति लाने आया हूँ[a]। मैं शांति लाने नहीं, बल्कि तलवार लाने आया हूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं आया।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में शाब्दिक रूप से “तलवार” है। इस प्रसंग में यह बिंब हिंसा की प्रशंसा नहीं, बल्कि यीशु के कारण उत्पन्न होने वाले विभाजन की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: यह मत समझो
  rationale: μή के साथ अओरिस्ट सब्जंक्टिव यहाँ निषेध व्यक्त करता है। ‘यह मत समझो’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: ἦλθον
  choice: आया हूँ
  rationale: अओरिस्ट रूप यीशु के आने और उसके उद्देश्य की ओर संकेत करता है। हिन्दी में ‘आया हूँ’ वर्तमान प्रसंग से जुड़े हुए आगमन को स्वाभाविक ढंग से व्यक्त करता है; ‘आया’ भी सम्भव है।
- source_word: βαλεῖν
  choice: लाने
  rationale: βάλλω का मूल अर्थ ‘फेंकना/डालना’ है, पर इस उद्देश्यसूचक वाक्य में शांति और तलवार के साथ ‘लाना’ अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰρήνην
  choice: शांति
  rationale: εἰρήνη का मानक और संदर्भानुकूल हिन्दी रूप ‘शांति’ है।
- source_word: ἐπὶ τὴν γῆν
  choice: पृथ्वी पर
  rationale: यहाँ γῆ का व्यापक अर्थ ‘पृथ्वी’ उपयुक्त है; ‘पृथ्वी पर’ मूल पूर्वसर्गीय अभिव्यक्ति को संक्षिप्त और स्पष्ट रूप में रखता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: नकार के बाद आने वाले तीखे विरोध को हिन्दी में ‘नहीं, बल्कि’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: μάχαιραν
  choice: तलवार
  rationale: μάχαιρα तलवार या छोटी तलवार को दर्शाता है। ठोस बिंब को व्याख्यात्मक ‘फूट’ से बदलने के बजाय ‘तलवार’ के रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: क्या ‘तलवार’ को मुख्य पाठ में व्याख्यात्मक रूप से ‘फूट’ कर देना चाहिए
  choice: मुख्य पाठ में ‘तलवार’ का ठोस बिंब बनाए रखा गया
  alternative: फूट या विभाजन
  rationale: यूनानी पाठ स्पष्टतः μάχαιραν (‘तलवार’) कहता है। निकटवर्ती संदर्भ इसका प्रभाव विभाजन के रूप में खोलता है, पर अनुवाद में मूल रूपक और उसकी धार्मिक तीव्रता को समय से पहले हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पहले वाक्य के ‘आया हूँ’ को दूसरे वाक्य में दोहराने से यूनानी की समानांतर संरचना और कथन का जोर हिन्दी में स्पष्ट रहता है।
