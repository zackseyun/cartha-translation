id: MAT.10.24
reference: Matthew 10:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: hi
  text: शिष्य अपने गुरु से बढ़कर नहीं होता, और न दास[a] अपने स्वामी[b] से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवक’; यूनानी शब्द δοῦλος संदर्भ के अनुसार ‘दास’ या ‘सेवक’ को दर्शा सकता है।
    reason: alternative_reading
  - marker: b
    text: या ‘प्रभु’; पर यहाँ यूनानी शब्द κύριος इस उपमा में एक मानवीय स्वामी को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητὴς
  choice: शिष्य
  rationale: ‘शिष्य’ सीखने वाले और गुरु का अनुसरण करने वाले व्यक्ति—दोनों भावों को व्यक्त करता है और सुसमाचार के संबंधपरक संदर्भ के अनुकूल है।
- source_word: ὑπὲρ
  choice: से बढ़कर
  rationale: यहाँ कर्मकारक के साथ ὑπέρ पद या श्रेष्ठता की तुलना व्यक्त करता है; ‘से बढ़कर’ स्वाभाविक हिन्दी में वही अर्थ सुरक्षित रखता है।
- source_word: διδάσκαλον
  choice: गुरु
  rationale: शिष्य के साथ ‘गुरु’ स्वाभाविक संबंधपरक जोड़ी बनाता है और यहाँ διδάσκαλος के शिक्षक-अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: δοῦλος
  choice: दास
  rationale: κύριος के साथ तुलना में अधीनता और स्वामित्व का सामाजिक संबंध प्रमुख है; ‘दास’ इस बल को ‘सेवक’ की अपेक्षा अधिक ठीक रखता है।
- source_word: κύριον
  choice: स्वामी
  rationale: इस मानवीय सामाजिक उपमा में κύριος दास के ऊपर अधिकार रखने वाले व्यक्ति को दर्शाता है, इसलिए ‘स्वामी’ उपयुक्त है; यहाँ यह परमेश्वर के लिए प्रयुक्त उपाधि नहीं है।
- source_word: αὐτοῦ
  choice: अपने
  rationale: हिन्दी में ‘अपने स्वामी’ स्वाभाविक रूप से उसी दास के स्वामी को सूचित करता है और यूनानी संबंधकारक सर्वनाम का आशय सुरक्षित रखता है।
- source_word: οὐδὲ
  choice: और न
  rationale: ‘और न’ दूसरी नकारात्मक तुलना को पहली से सहज ढंग से जोड़ता है।
theological_decisions:
- issue: गैर-उद्धारशास्त्रीय सामाजिक उपमा में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: दास और स्वामी की जोड़ी में बंधन, अधीनता और सामाजिक पद का अंतर उभरता है। ‘दास’ इस तनाव को बनाए रखता है, जबकि प्रचलित वैकल्पिक अर्थ को पादटिप्पणी में दिया गया है।
- issue: मानवीय घरेलू संदर्भ में κύριος का अनुवाद
  choice: स्वामी
  alternative: प्रभु
  rationale: यहाँ κύριος किसी दैवी उपाधि के रूप में नहीं, बल्कि दास के मानवीय स्वामी के लिए आया है। ‘स्वामी’ संदर्भ को स्पष्ट करता है, और शाब्दिक वैकल्पिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मौखिक रूप से सहज वाक्य। ‘शिष्य–गुरु’ तथा ‘दास–स्वामी’ की समानांतर जोड़ियाँ मूल कथन की संरचना और सामाजिक तुलना को बनाए रखती हैं।
