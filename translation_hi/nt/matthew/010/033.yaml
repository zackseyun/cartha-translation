  verdict: approve
  source_fidelity: The draft accurately renders the adversative general condition (ὅστις δ᾽ ἄν), the public setting of denial (ἔμπροσθεν τῶν ἀνθρώπων), and the future reciprocal denial. The repeated Hindi expression “इनकार करेगा/करूँगा” properly preserves the verbal parallel of ἀρνέομαι. “मनुष्यों” appropriately conveys the generic human reference without restricting it to males. “जो स्वर्ग में हैं” idiomatically renders the Father’s heavenly designation; singular “स्वर्ग” is standard Hindi despite Greek οὐρανοῖς being plural.
  naturalness: The sentence is fluent, dignified modern standard Hindi and fits biblical discourse. “परन्तु,” “मनुष्यों के सामने,” and the honorific “हैं” are all natural in this register. The placement of the relative clause after “पिता” is clear.
  terminology: “इनकार” is a direct, established Hindi equivalent for denial and its repetition maintains the source’s rhetorical reciprocity. “पिता” and “स्वर्ग” are conventional and theologically noninterpretive. No footnote is necessary in Hindi for the idiomatic singular rendering of the Greek plural “heavens.”
