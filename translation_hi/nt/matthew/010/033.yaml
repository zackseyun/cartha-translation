reference: Matthew 10:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: hi
  text: परन्तु जो कोई मनुष्यों के सामने मेरा इनकार करेगा, मैं भी अपने पिता के सामने, जो स्वर्ग में हैं, उसका इनकार करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: परन्तु जो कोई
  rationale: ὅστις के सामान्य और अनिश्चित दायरे को ‘जो कोई’ स्वाभाविक रूप से व्यक्त करता है; δέ पिछले वचन के विपरीत पक्ष को दिखाता है, इसलिए ‘परन्तु’ रखा गया है। ἄν के सामान्यीकरण का भाव ‘जो कोई’ में समाहित है।
- source_word: ἀρνήσηταί με
  choice: मेरा इनकार करेगा
  rationale: ἀρνέομαι यहाँ लोगों के सामने यीशु को नकारने या उनसे संबंध अस्वीकार करने का अर्थ देता है। ‘इनकार करना’ सीधा और प्रचलित है तथा आगे उसी क्रिया की पुनरावृत्ति बनाए रखता है।
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: मनुष्यों के सामने
  rationale: ἔμπροσθεν उपस्थिति में सार्वजनिक रूप से किए जाने का भाव देता है। ἀνθρώπων सामान्य अर्थ में सभी मनुष्यों को सूचित करता है; हिन्दी में ‘मनुष्यों’ स्रोत की संज्ञा और समावेशी दायरा दोनों स्वाभाविक रूप से रखता है।
- source_word: ἀρνήσομαι κἀγὼ αὐτόν
  choice: मैं भी ... उसका इनकार करूँगा
  rationale: κἀγώ का पारस्परिक बल ‘मैं भी’ से सुरक्षित रहता है। उसी हिन्दी क्रिया का दोहराव मूल की गंभीर समरूपता—वह मेरा इनकार करेगा, मैं उसका—बनाए रखता है। αὐτόν का सन्दर्भ ‘उसका’ से स्वाभाविक रूप में व्यक्त है।
- source_word: ἔμπροσθεν τοῦ πατρός μου
  choice: अपने पिता के सामने
  rationale: यीशु के प्रथम-पुरुष कथन में हिन्दी का संबंधवाचक ‘अपने’ स्वाभाविक रूप से ‘मेरे’ का अर्थ देता है और पिता से यीशु का संबंध स्पष्ट रखता है।
- source_word: τοῦ ἐν οὐρανοῖς
  choice: जो स्वर्ग में हैं
  rationale: यूनानी में οὐρανοῖς बहुवचन है, पर आधुनिक हिन्दी में परमेश्वर के निवास-सन्दर्भ में ‘स्वर्ग में’ स्वाभाविक है। पिता के लिए आदरसूचक बहुवचन ‘हैं’ dignified और सामान्य हिन्दी प्रयोग है।
theological_decisions:
- issue: ἀνθρώπων और αὐτόν का सामान्य तथा पुल्लिंग रूप
  choice: मनुष्यों के सामने ... उसका इनकार
  alternative: लोगों के सामने ... उस व्यक्ति का इनकार
  rationale: ‘मनुष्यों’ यूनानी ἀνθρώπων की मानव-सामान्य शक्ति को बिना केवल वयस्क पुरुषों तक सीमित किए व्यक्त करता है। αὐτόν के लिए ‘उसका’ हिन्दी में प्रसंगानुसार सामान्य संदर्भ दे सकता है और वाक्य को बोझिल नहीं बनाता।
- issue: पारस्परिक इनकार की भाषा
  choice: मेरा इनकार करेगा ... मैं भी ... उसका इनकार करूँगा
  alternative: मुझे नकार देगा ... मैं भी उसे नकार दूँगा
  rationale: दोनों स्थानों पर एक ही अभिव्यक्ति रखने से मूल में ἀρνέομαι की पुनरावृत्ति और कर्मानुरूप गंभीर चेतावनी सुरक्षित रहती है; अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
- issue: ‘स्वर्गों’ का बहुवचन
  choice: स्वर्ग में
  alternative: स्वर्गों में
  rationale: बहुवचन οὐρανοῖς को अक्षरशः ‘स्वर्गों’ कहना आधुनिक हिन्दी में अस्वाभाविक और संभावित रूप से भ्रामक हो सकता है। एकवचन ‘स्वर्ग’ इसी पारंपरिक आकाशीय/ईश्वरीय निवासार्थ को सहजता से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर पर सहज धार्मिक गद्य। ‘परन्तु’ पिछले वचन से विरोध को स्पष्ट करता है। ‘इनकार’ को दोनों खंडों में दोहराकर मूल की अलंकारिक और धर्मवैज्ञानिक समरूपता रखी गई है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
