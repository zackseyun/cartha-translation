id: MAT.10.8
reference: Matthew 10:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: hi
  text: बीमारों को चंगा करो, मरे हुओं को जिलाओ, कोढ़ियों[a] को शुद्ध करो और दुष्टात्माओं को निकालो। तुमने बिना दाम पाया है; बिना दाम दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गंभीर त्वचा-रोगों से पीड़ित लोग।” बाइबल में जिस शब्द का अनुवाद परंपरागत रूप से “कोढ़ी” किया जाता है, वह केवल आधुनिक कुष्ठ रोग (हैन्सन रोग) तक सीमित नहीं हो सकता, बल्कि गंभीर त्वचा-रोगों के व्यापक वर्ग को सूचित कर सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενοῦντας
  choice: बीमारों
  rationale: इस चंगाई-संदर्भ में कृदंत का अर्थ बीमार लोगों से है; ‘बीमारों’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: θεραπεύετε
  choice: चंगा करो
  rationale: अलौकिक सेवकाई के संदर्भ में यह ‘स्वस्थ/चंगा करना’ दर्शाता है; ‘चंगा करो’ वर्तमान हिन्दी मसीही पाठकों में स्पष्ट है और चिकित्सकीय ‘इलाज करो’ से अधिक उपयुक्त है।
- source_word: νεκροὺς ἐγείρετε
  choice: मरे हुओं को जिलाओ
  rationale: यह मृत्यु से जीवित उठाने का अर्थ देता है। ‘जिलाओ’ हिन्दी में संक्षिप्त और स्पष्ट है; केवल ‘उठाओ’ जागने या खड़ा करने का भ्रम पैदा कर सकता है।
- source_word: λεπροὺς
  choice: कोढ़ियों
  rationale: पारंपरिक बाइबलीय पद संक्षिप्त और परिचित है, जबकि पादटिप्पणी स्पष्ट करती है कि मूल शब्द आधुनिक हैन्सन रोग से व्यापक त्वचा-रोगों को समेट सकता है।
- source_word: καθαρίζετε
  choice: शुद्ध करो
  rationale: यह केवल शारीरिक चंगाई नहीं, शुद्धता के धार्मिक-सामाजिक आयाम को भी बनाए रखता है।
- source_word: δαιμόνια ἐκβάλλετε
  choice: दुष्टात्माओं को निकालो
  rationale: ‘दुष्टात्माएँ’ साधारण हिन्दी में δαιμόνια का स्पष्ट समतुल्य है और ‘निकालो’ बलपूर्वक निष्कासन का भाव देता है।
- source_word: δωρεὰν ἐλάβετε, δωρεὰν δότε
  choice: तुमने बिना दाम पाया है; बिना दाम दो
  rationale: ‘बिना दाम’ δωρεάν के ‘निःशुल्क/मुफ़्त में’ अर्थ को गरिमापूर्ण ढंग से व्यक्त करता और दोनों खंडों की समानांतरता बनाए रखता है। पूर्ण भूत ‘पाया है’ प्राप्त वरदानों की वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में दर्शाता है।
theological_decisions:
- issue: अलौकिक आदेशों का दायरा
  choice: इस मिशन-वचन में बारह शिष्यों को दिए गए प्रत्यक्ष आदेशों के रूप में क्रियाओं का सीधा अनुवाद
  alternative: इन कार्यों को रूपक बनाना या केवल बाद की कलीसियाई प्रथाओं तक सीमित करना
  rationale: यूनानी पाठ ठोस सेवकाई-कार्यों की सूची में बहुवचन आज्ञार्थक क्रियाएँ देता है। अनुवाद न तो इनका बल कम करता है, न इनके अनुप्रयोग को पाठ से आगे बढ़ाकर निर्धारित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली। समानांतर आज्ञाओं को संक्षिप्त रखा गया है। ‘कोढ़ियों’ के साथ व्यक्ति-सम्मान और ऐतिहासिक अर्थ-व्याप्ति की सावधानी पादटिप्पणी में दी गई है।
