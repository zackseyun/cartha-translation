lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: मत जुटाओ
  rationale: κτάομαι का अर्थ यहाँ केवल साथ ले जाना नहीं, बल्कि अपने लिए प्राप्त या जुटाना है। ‘मत जुटाओ’ मिशन के संदर्भ में स्वाभाविक हिंदी है और मूल निषेध की शक्ति बनाए रखता है।
- source_word: χρυσὸν
  choice: सोना
  rationale: यह पदार्थ-सूचक सीधा शब्द है और संदर्भ में सोने के धन या सिक्कों को दर्शाता है।
- source_word: ἄργυρον
  choice: चाँदी
  rationale: यह पदार्थ-सूचक सीधा शब्द है और संदर्भ में चाँदी के धन या सिक्कों को दर्शाता है।
- source_word: χαλκὸν
  choice: ताँबा
  rationale: χαλκός का अर्थ ताँबा या काँसा हो सकता है। सोना और चाँदी के साथ धन की सूची में ‘ताँबा’ कम मूल्य के सिक्कों के लिए आधुनिक हिंदी में अधिक स्वाभाविक है; ‘काँसा’ को पादटिप्पणी में रखा गया है।
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: अपनी कमर-पट्टियों में रखने के लिए
  rationale: ζώνη कमर-पट्टी है, जिसमें उस समय धन रखा जा सकता था। यह अनुवाद εἰς के प्रयोजन/गंतव्य भाव को स्पष्ट करते हुए सांस्कृतिक अर्थ का अत्यधिक विस्तार नहीं करता।
