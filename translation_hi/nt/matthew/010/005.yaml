source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: hi
  text: 'यीशु ने इन बारहों को भेजा और उन्हें यह निर्देश दिया: “गैर-यहूदियों की ओर जानेवाले मार्ग पर मत जाना[a], और सामरियों के किसी नगर में प्रवेश मत करना[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के अधिक निकट: “गैर-यहूदियों के मार्ग में मत जाना।” यूनानी अभिव्यक्ति मार्ग या रास्ते की भाषा का प्रयोग करती है और संभवतः गैर-यहूदी क्षेत्र की ओर जाने का संकेत देती है।'
    reason: lexical_alternative
  - marker: b
    text: या “किसी सामरी नगर में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: इन बारहों
  rationale: मूल में केवल संकेतवाचक और संख्या है; संदर्भ से ‘शिष्य’ स्पष्ट है, पर वह शब्द मूल में नहीं है, इसलिए जोड़ा नहीं गया।
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: यह किसी उद्देश्य से भेजे जाने को व्यक्त करता है; हिंदी में ‘भेजा’ स्वाभाविक है और प्रसंग मिशन का भाव स्पष्ट करता है।
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: उन्हें यह निर्देश दिया
  rationale: दोनों कृदंतों के आशय को स्वाभाविक हिंदी में समेटते हुए निर्देश की बाध्यकारी शक्ति बनाए रखी गई है।
- source_word: Εἰς ὁδὸν ἐθνῶν
  choice: गैर-यहूदियों की ओर जानेवाले मार्ग पर
  rationale: ὁδός का मार्ग-संबंधी बिंब सुरक्षित है और संदर्भ में ἐθνῶν का अर्थ गैर-यहूदी लोग है; ‘की ओर जानेवाले’ संभावित भू-दिशात्मक अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐθνῶν
  choice: गैर-यहूदियों
  rationale: इस यहूदी मिशन-संदर्भ में यह शब्द अन्यजातीय, अर्थात यहूदी न होनेवाले लोगों को सूचित करता है; यह रूप सामान्य पाठक के लिए अधिक स्पष्ट है।
- source_word: μὴ ἀπέλθητε
  choice: मत जाना
  rationale: μή के साथ aorist subjunctive निषेधात्मक आदेश है; ‘मत जाना’ सीधा और स्वाभाविक है।
- source_word: εἰς πόλιν Σαμαριτῶν
  choice: सामरियों के किसी नगर में
  rationale: संबंधकारक रचना ‘सामरियों के’ के रूप में रखी गई है; अनिश्चित πόλιν के लिए ‘किसी नगर’ स्वाभाविक है।
- source_word: μὴ εἰσέλθητε
  choice: प्रवेश मत करना
  rationale: प्रवेश करने पर स्पष्ट निषेध को प्रत्यक्ष और गरिमापूर्ण हिंदी में व्यक्त करता है।
theological_decisions:
- issue: गैर-यहूदियों और सामरियों के विषय में निषेध का दायरा और समय
  choice: इसे इन बारहों को इस विशेष भेजे जाने के अवसर पर दिया गया स्पष्ट निर्देश मानकर अनूदित किया गया है।
  alternative: ऐसी शब्दावली जो इसे हर समय के लिए पूर्ण और स्थायी निषेध समझाए।
  rationale: पद निषेध को दृढ़ता से कहता है, पर स्वयं उसकी अवधि पर कोई सार्वकालिक धर्मवैज्ञानिक निष्कर्ष नहीं देता; इसलिए व्यापक मत्ती-वृत्तांत से तनाव को मिटाए बिना कथन को यथावत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। ‘गैर-यहूदी’ सामान्य पाठक के लिए स्पष्ट है; ‘सामरी’ प्रचलित बाइबलीय जाति-धार्मिक नाम है। प्रत्यक्ष वचन में ‘मत जाना/मत करना’ से निर्देश की शक्ति बनी रहती है।
