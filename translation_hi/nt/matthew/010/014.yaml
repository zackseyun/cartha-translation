id: MAT.10.14
reference: Matthew 10:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: hi
  text: और जो कोई न तो तुम्हें स्वीकार करे, न तुम्हारी बातें सुने[a], उस घर या नगर से बाहर निकलते समय[b] अपने पैरों की धूल झाड़ दो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न तुम्हारी बातों पर ध्यान दे।”
    reason: ἀκούω प्रसंग में केवल ध्वनि सुनने के बजाय ध्यानपूर्वक सुनने का भाव भी रख सकता है।
  - marker: b
    text: या, “उस घर या शहर से निकलते समय।”
    reason: πόλις का अनुवाद प्रसंग के अनुसार ‘नगर’ या ‘शहर’ किया जा सकता है।
  - marker: c
    text: पैरों की धूल झाड़ना उन लोगों से संबंध-विच्छेद और उनके संदेश ठुकराने पर आने वाले न्याय को दर्शाने वाली एक प्रतीकात्मक क्रिया थी।
    reason: प्राचीन सांस्कृतिक और प्रतीकात्मक क्रिया का आशय आधुनिक पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: जो कोई ... न
  rationale: यह अनिश्चित और सामान्य संबंधवाचक रचना है, जिसका स्वाभाविक हिन्दी रूप ‘जो कोई ... न’ है।
- source_word: δέξηται ὑμᾶς
  choice: तुम्हें स्वीकार करे
  rationale: δέχομαι यहाँ अतिथि के रूप में स्वागत करने और संदेशवाहकों को अनुकूल भाव से ग्रहण करने—दोनों का संकेत देता है; ‘स्वीकार करे’ इस व्यापकता को बनाए रखता है।
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: न तुम्हारी बातें सुने
  rationale: ἀκούω का मूल अर्थ सुनना है और प्रसंग में ध्यान देकर सुनना निहित है। ‘सुने’ आज की हिन्दी में सहज है और ‘माने’ की अपेक्षा आज्ञापालन का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἐξερχόμενοι ἔξω
  choice: बाहर निकलते समय
  rationale: कृदंत और ἔξω मिलकर उस स्थान से बाहर जाने की परिस्थिति बताते हैं; यह रूप मुख्य आज्ञा से उसका समयगत संबंध स्पष्ट करता है।
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: उस घर या नगर से
  rationale: ‘उस’ निर्दिष्ट स्थान का बोध कराता है। πόλις छोटी या बड़ी बस्ती हो सकती है; ‘नगर’ आकार को अनावश्यक रूप से निश्चित किए बिना स्वाभाविक है।
- source_word: ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: अपने पैरों की धूल झाड़ दो
  rationale: यह ठोस और प्रतीकात्मक क्रिया को सीधे रखता है। ‘झाड़ दो’ बहुवचन श्रोताओं को दी गई स्पष्ट आज्ञा है।
theological_decisions:
- issue: संदेश अस्वीकार करने वालों के प्रति प्रतीकात्मक न्याय-सूचक क्रिया
  choice: मुख्य पाठ में केवल ठोस आज्ञा ‘अपने पैरों की धूल झाड़ दो’ रखना
  alternative: समानांतर अंशों से ‘उनके विरुद्ध गवाही के लिए’ जोड़ना या इसका अर्थ ‘उन्हें न्याय के अधीन छोड़ दो’ कहना
  rationale: इस पद में क्रिया दी गई है, पर उसका अर्थ स्पष्ट करने वाला अतिरिक्त वाक्यांश नहीं है। इसलिए मुख्य पाठ मूल की संक्षिप्तता और धर्मवैचारिक तनाव बनाए रखता है; सांस्कृतिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘स्वीकार करे’ आतिथ्य और संदेशवाहकों की स्वीकृति दोनों को समेटता है; ‘झाड़ दो’ आज्ञा की सीधाई बनाए रखता है।
