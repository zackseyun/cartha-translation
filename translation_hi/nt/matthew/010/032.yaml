  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: hi
  text: इसलिए जो कोई मनुष्यों के सामने मुझे स्वीकार करेगा, उसे मैं भी अपने स्वर्गीय पिता के सामने स्वीकार करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: इसलिए जो कोई
  rationale: यह समावेशी सामान्य कथन को स्वाभाविक हिन्दी में व्यक्त करता है और οὖν का पिछले संदर्भ से निष्कर्षात्मक संबंध बनाए रखता है।
- source_word: ὁμολογήσει ἐν ἐμοὶ
  choice: मुझे स्वीकार करेगा
  rationale: ὁμολογέω के सार्वजनिक रूप से मानने या स्वीकार करने के भाव को व्यक्त करता है; ἐν वाला यूनानी प्रयोग हिन्दी में कर्म के साथ स्वाभाविक रूप से अनूदित है।
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: मनुष्यों के सामने
  rationale: ἔμπροσθεν की उपस्थिति-सूचक शक्ति और ἀνθρώπων के सामान्य मानवीय संदर्भ, दोनों को ठीक प्रकार रखता है।
- source_word: ὁμολογήσω κἀγὼ ἐν αὐτῷ
  choice: उसे मैं भी ... स्वीकार करूँगा
  rationale: पहले ὁμολογέω के साथ शब्दगत समानता बनाए रखता है; κἀγώ का बल ‘मैं भी’ से और ἐν αὐτῷ का संबंध स्वाभाविक हिन्दी सर्वनाम ‘उसे’ से व्यक्त होता है।
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: अपने स्वर्गीय पिता
  rationale: मत्ती के इस परिचित पदबंध का संक्षिप्त, स्वाभाविक हिन्दी रूप है और पिता के स्वर्ग में होने का अर्थ बनाए रखता है।
theological_decisions:
- issue: यीशु को सार्वजनिक रूप से स्वीकार करना और यीशु द्वारा उस व्यक्ति को स्वीकार किया जाना
  choice: वचन को पारस्परिक स्वीकार की प्रतिज्ञा के रूप में सीधे प्रस्तुत किया गया है।
  alternative: इसे केवल अंतिम न्याय का न्यायिक कथन या केवल वर्तमान शिष्यत्व का कथन बनाना।
  rationale: पद स्वयं पिता के सामने यीशु द्वारा उस व्यक्ति को स्वीकार किए जाने की बात कहता है, पर उसका समय या व्यवस्थित उद्धार-विज्ञान स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘स्वीकार’ की पुनरावृत्ति मूल यूनानी में ὁμολογέω की पारस्परिक पुनरावृत्ति को सुरक्षित रखती है।
