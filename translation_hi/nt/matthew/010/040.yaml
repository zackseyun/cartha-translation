id: MAT.10.40
reference: Matthew 10:40
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: hi
  text: जो तुम्हें ग्रहण करता है, वह मुझे ग्रहण करता है[a]; और जो मुझे ग्रहण करता है, वह उसे ग्रहण करता है जिसने मुझे भेजा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वागत करता है’ अथवा ‘स्वीकार करता है’; यूनानी क्रिया का अर्थ किसी व्यक्ति—विशेषकर किसी दूत—को ग्रहण करना, स्वीकार करना या उसका स्वागत करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: जो ... ग्रहण करता है
  rationale: संज्ञा के रूप में प्रयुक्त निश्चित वर्तमान कृदंत का सामान्य एकवचन अर्थ इस स्वाभाविक हिन्दी रचना में बना रहता है।
- source_word: δέχομαι / δέχεται
  choice: ग्रहण करता है
  rationale: एक ही यूनानी क्रिया की पुनरावृत्ति दूतों, यीशु और भेजने वाले के बीच जानबूझकर बनाई गई संबंध-श्रृंखला को व्यक्त करती है। ‘ग्रहण करना’ यहाँ स्वागत करने, स्वीकार करने और दूत के रूप में मान्यता देने के व्यापक भाव को समेटता है।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: यह द्वितीय पुरुष बहुवचन सर्वनाम यीशु के शिष्यों को संबोधित करता है; हिन्दी में ‘तुम्हें’ प्रसंगानुसार बहुवचन अर्थ स्पष्ट रखता है।
- source_word: ἐμέ
  choice: मुझे
  rationale: यीशु के लिए प्रयुक्त प्रथम पुरुष एकवचन कर्म सर्वनाम का सीधा और स्वाभाविक अनुवाद।
- source_word: τὸν ἀποστείλαντά με
  choice: उसे ... जिसने मुझे भेजा है
  rationale: संज्ञा के रूप में प्रयुक्त यूनानी कृदंत को स्वाभाविक सम्बन्धवाचक हिन्दी वाक्यांश से व्यक्त किया गया है। पूर्ण क्रिया ‘भेजा है’ पूर्व में हुए भेजने के कार्य और उसके वर्तमान संबंध को सहज हिन्दी में बताती है।
theological_decisions:
- issue: यीशु को भेजने वाले की पहचान
  choice: ‘जिसने मुझे भेजा है’—मुख्य पाठ में पहचान को सामान्य रूप में रखा गया है।
  alternative: ‘पिता को, जिसने मुझे भेजा है’
  rationale: मत्ती के व्यापक संदर्भ में भेजने वाला परमेश्वर पिता समझा जाता है, पर यूनानी पाठ यहाँ केवल ‘मुझे भेजने वाले’ कहता है। इसलिए निहित पहचान को स्पष्ट रूप से जोड़कर मूल से अधिक नहीं कहा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल की तीन बार दोहराई गई δέχεται को हर बार ‘ग्रहण करता है’ कहकर उसकी अलंकारिक और वैचारिक श्रृंखला सुरक्षित रखी गई है।
