  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: hi
  text: और मेरे नाम के कारण[a] सब लोग तुमसे घृणा करेंगे। पर जो अंत तक धीरज धरे रहेगा[b], वही उद्धार पाएगा[c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे नाम की खातिर।’
    reason: lexical_alternative
  - marker: b
    text: या ‘जो अंत तक दृढ़ बना रहेगा।’
    reason: lexical_alternative
  - marker: c
    text: ‘उद्धार पाएगा’ का अर्थ संदर्भ के अनुसार ‘बचाया जाएगा’ या ‘छुड़ाया जाएगा’ भी समझा जा सकता है।
    reason: alternative_reading
  - marker: d
    text: 'यूनानी में बल के साथ: ‘जो अंत तक धीरज धरेगा, वही उद्धार पाएगा।’'
    reason: source_emphasis
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: सब लोग तुमसे घृणा करेंगे
  rationale: यूनानी का भावी कर्मवाच्य भाव हिन्दी में इस स्वाभाविक कर्तृवाच्य रचना से स्पष्ट व्यक्त होता है; ‘सब लोग’ πάντων की व्यापकता बनाए रखता है।
- source_word: διὰ τὸ ὄνομά μου
  choice: मेरे नाम के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण बताता है। ‘नाम’ को बनाए रखने से यीशु के व्यक्तित्व, अधिकार और उनसे जुड़ी निष्ठा का बाइबलीय संकेत सुरक्षित रहता है।
- source_word: ὁ δὲ ὑπομείνας εἰς τέλος
  choice: पर जो अन्त तक धीरज धरे रहेगा
  rationale: ὑπομένω सताव के बीच टिके रहने और सहते रहने का भाव देता है। ‘धीरज धरे रहेगा’ आधुनिक हिन्दी में स्वाभाविक है और किसी बाद की विशिष्ट धर्मसैद्धान्तिक शब्दावली को आरोपित नहीं करता।
- source_word: οὗτος
  choice: वही
  rationale: ‘वही’ यूनानी संकेतवाचक सर्वनाम के बल को स्वाभाविक हिन्दी में व्यक्त करता है और वाक्य को बोझिल होने से बचाता है।
- source_word: σωθήσεται
  choice: उद्धार पाएगा
  rationale: यह प्रयोग अन्तिम उद्धार तथा बचाए या छुड़ाए जाने की व्यापक सम्भावना को खुला रखता है; सन्दर्भ को केवल शारीरिक सुरक्षा तक सीमित नहीं करता।
theological_decisions:
- issue: अन्त तक धीरज धरने और उद्धार के बीच सम्बन्ध
  choice: ‘उद्धार पाएगा’ की व्यापक अभिव्यक्ति रखी गई है
  alternative: ‘शारीरिक रूप से बचाया जाएगा’ या किसी विशिष्ट धीरज-सम्बन्धी धर्मसैद्धान्तिक मत को स्पष्ट करना
  rationale: पद सताव में अन्त तक टिके रहने को उद्धार से जोड़ता है, पर यह वाक्य अपने आप में उद्धार के सभी आयामों या किसी बाद के धर्मसैद्धान्तिक मॉडल को परिभाषित नहीं करता। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सब लोग तुमसे घृणा करेंगे’ शाब्दिक कर्मवाच्य की अपेक्षा स्वाभाविक हिन्दी है। ‘वही’ οὗτος के बल को संक्षेप में सुरक्षित रखता है।
