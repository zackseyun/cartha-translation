base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/012.yaml
  text: As you enter the house[a], greet it.
translation:
  language: hi
  text: जब तुम घर में प्रवेश करो, तो उसे[a] नमस्कार करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घराने को नमस्कार करो।” यूनानी में शाब्दिक रूप से “उसे नमस्कार करो” है, जहाँ “उसे” घर की ओर संकेत करता है; संभवतः घर से आशय उसमें रहने वाले लोग हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: जब तुम ... प्रवेश करो
  rationale: वर्तमान कृदंत यहाँ मुख्य आज्ञा के साथ कालवाचक रूप में प्रयुक्त है। हिंदी में ‘जब तुम ... प्रवेश करो’ स्वाभाविक ढंग से प्रवेश और अभिवादन के निकट संबंध को व्यक्त करता है।
- source_word: δὲ
  choice: तो
  rationale: δέ एक हल्का संयोजक है। हिंदी की ‘जब...तो’ रचना में उसका प्रवाह स्वाभाविक रूप से समाहित हो जाता है; इसे प्रबल विरोधसूचक शब्द से अनूदित करना उचित नहीं होगा।
- source_word: οἰκίαν
  choice: घर
  rationale: οἰκία भौतिक घर अथवा उसमें रहने वाले घराने को सूचित कर सकता है। प्रवेश करने के संदर्भ में ‘घर’ प्रत्यक्ष अर्थ को बनाए रखता है और लाक्षणिक आशय की संभावना भी खुली छोड़ता है।
- source_word: ἀσπάσασθε
  choice: नमस्कार करो
  rationale: यह द्वितीय पुरुष बहुवचन की सीधी आज्ञा है। ‘नमस्कार करो’ आधुनिक, सम्मानपूर्ण और सामान्य हिंदी में अभिवादन करने का स्पष्ट रूप है।
- source_word: αὐτήν
  choice: उसे
  rationale: स्त्रीलिंग एकवचन सर्वनाम οἰκίαν की ओर संकेत करता है। हिंदी में ‘उसे’ मूल की एकवचन लाक्षणिक अभिव्यक्ति को बनाए रखता है, जबकि वास्तविक सामाजिक संदर्भ संभवतः घर के निवासी हैं।
theological_decisions:
- issue: घर को संबोधित लाक्षणिक अभिव्यक्ति बनाम उसके निवासियों का स्पष्ट उल्लेख
  choice: मुख्य पाठ में ‘उसे नमस्कार करो’ रखकर घर की ओर संकेत बनाए रखना
  alternative: ‘घराने को नमस्कार करो’ या ‘उसमें रहने वालों को नमस्कार करो’
  rationale: यूनानी पाठ में αὐτήν एकवचन में οἰκίαν की ओर संकेत करता है। मुख्य पाठ में इस रूप को रखना मूल की अभिव्यक्ति और उसकी वास्तविक अस्पष्टता का सम्मान करता है; संभावित आशय कि अभिवादन निवासियों का है, पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और मौखिक पठन में स्वाभाविक। बहुवचन ‘तुम’ शिष्यों को संबोधित यूनानी बहुवचन को स्पष्ट रखता है।
