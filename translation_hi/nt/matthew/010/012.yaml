  source_fidelity: The translation accurately reflects εἰσερχόμενοι as a temporal instruction, retains the plural address, renders the mild connective naturally through the जब…तो construction, and preserves the feminine singular reference of αὐτήν back to घर. “उसे नमस्कार करो” appropriately retains the source’s metonymic wording rather than prematurely substituting the residents.
  naturalness: “जब तुम घर में प्रवेश करो, तो उसे नमस्कार करो” is clear, grammatical modern standard Hindi with an appropriately dignified biblical register. Although greeting a house is intentionally somewhat marked in Hindi, the same marked metonymy is present in Greek and is helpfully explained in the note.
  terminology: “प्रवेश करो” and “नमस्कार करो” are suitable, accessible formal-register choices. “घर” correctly allows both the concrete dwelling and the contextual household sense. The footnote’s alternative “घराने को नमस्कार करो” accurately identifies the likely intended referent without putting that interpretive expansion into the main text.
