  text: Φίλιππος καὶ Βαρθολομαῖος, Θωμᾶς καὶ Μαθθαῖος ὁ τελώνης, Ἰάκωβος ὁ τοῦ Ἁλφαίου καὶ ⸀Θαδδαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/003.yaml
  text: Philip and Bartholomew[a], Thomas and Matthew the tax collector, James the son of Alphaeus and Thaddaeus,
translation:
  language: hi
  text: फिलिप्पुस और बरतुलमै[a], थोमा और कर-वसूलने वाला मत्ती, हलफई का पुत्र याकूब और तद्दय,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “लब्बय” (या “तद्दय कहलाने वाला लब्बय”) है; और लूका की प्रेरितों की सूचियों में इसी स्थान पर “याकूब का पुत्र यहूदा” नाम आता है।
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππος
  choice: फिलिप्पुस
  rationale: यूनानी व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: Βαρθολομαῖος
  choice: बरतुलमै
  rationale: नाम का पहचान योग्य और प्रचलित हिन्दी बाइबलीय रूप।
- source_word: Θωμᾶς
  choice: थोमा
  rationale: यूनानी नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: Μαθθαῖος
  choice: मत्ती
  rationale: नए नियम में इस नाम का स्थापित हिन्दी रूप।
- source_word: ὁ τελώνης
  choice: कर-वसूलने वाला
  rationale: τελώνης कर या चुंगी वसूलने वाले व्यक्ति को दर्शाता है; यह रूप आधुनिक पाठक के लिए स्पष्ट है और पुराने या अत्यधिक संकीर्ण विकल्पों से बचता है।
- source_word: Ἰάκωβος
  choice: याकूब
  rationale: यूनानी Ἰάκωβος का ऐतिहासिक और हिन्दी बाइबलीय रूप, जो अंग्रेज़ी परंपरा के ‘James’ पर निर्भर नहीं है।
- source_word: ὁ τοῦ Ἁλφαίου
  choice: हलफई का पुत्र
  rationale: यूनानी संबंधवाचक पदबंध यहाँ पितृत्व से पहचान कराता है; हिन्दी में संबंध को स्पष्ट करना स्वाभाविक है।
- source_word: Ἁλφαίου
  choice: हलफई
  rationale: इस व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: Θαδδαῖος
  choice: तद्दय
  rationale: प्रदत्त SBLGNT पाठ Θαδδαῖος का प्रचलित हिन्दी रूप; अन्य पाठ-परंपराएँ पादटिप्पणी में रखी गई हैं।
- source_word: καὶ
  choice: और
  rationale: सूची की सरल समन्वयी संरचना बनाए रखने के लिए सामान्य हिन्दी संयोजक।
theological_decisions:
- issue: सूची में अंतिम प्रेरित की पहचान
  choice: तद्दय
  alternative: लब्बय; याकूब का पुत्र यहूदा
  rationale: प्रदत्त यूनानी मूलपाठ में Θαδδαῖος है, इसलिए मुख्य पाठ उसी का अनुवाद करता है। पांडुलिपीय और समानांतर सूचियों के भेद को सामंजस्य बैठाकर मिटाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नामों के लिए पहचान योग्य हिन्दी बाइबलीय रूप अपनाए गए हैं; सूची की युग्मात्मक बनावट और मूल पाठ का विराम-अपूर्ण स्वरूप बनाए रखा गया है।
