id: MAT.10.28
reference: Matthew 10:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: hi
  text: और उनसे मत डरो जो शरीर को मार डालते हैं, पर आत्मा को मार नहीं सकते। बल्कि उससे डरो जो आत्मा और शरीर दोनों को गेहन्ना[a] में नष्ट कर सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “नरक में।” यूनानी शब्द “गेहन्ना” हिन्नोम की घाटी के नाम से निकला है और अंतिम न्याय के स्थान के लिए प्रयुक्त होता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: मत डरो / डरो
  rationale: दोनों आदेशों में एक ही यूनानी क्रिया दोहराई गई है। ‘डरना’ इस विरोध को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: उनसे ... जो ... मार डालते हैं
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत लोगों के एक सामान्य वर्ग को दर्शाता है; यह हिन्दी में उसका स्वाभाविक रूप है।
- source_word: σῶμα
  choice: शरीर
  rationale: यह भौतिक देह के लिए सीधा और मानक हिन्दी शब्द है।
- source_word: ψυχήν
  choice: आत्मा
  rationale: शरीर के साथ स्पष्ट विरोध में यहाँ ψυχή व्यक्ति के अभौतिक पक्ष को सूचित करता है। ‘जीवन’ इस विरोध को धुंधला कर सकता है।
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: मार नहीं सकते
  rationale: यह मूल पाठ में व्यक्त असमर्थता को स्पष्ट, संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: μᾶλλον
  choice: बल्कि
  rationale: यह पहले निषेध और उसके विपरीत दिए गए अगले आदेश के बीच सुधारात्मक विरोध को व्यक्त करता है।
- source_word: τὸν δυνάμενον
  choice: उससे ... जो ... कर सकता है
  rationale: यह संज्ञात्मक कृदंत का स्वाभाविक हिन्दी रूप है और मुख्य पाठ में उस व्यक्ति की पहचान स्पष्ट रूप से जोड़े बिना यूनानी की अनिर्दिष्टता बनाए रखता है।
- source_word: ἀπολέσαι
  choice: नष्ट करना
  rationale: यह निर्णायक विनाश या न्याय की गंभीरता को व्यक्त करता है, पर उसकी तात्त्विक प्रक्रिया को आवश्यकता से अधिक परिभाषित नहीं करता।
- source_word: ἐν γεέννῃ
  choice: गेहन्ना में
  rationale: लिप्यंतरण इस विशिष्ट यहूदी पृष्ठभूमि वाले शब्द को सुरक्षित रखता है; परिचित व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘आत्मा और शरीर दोनों को गेहन्ना में नष्ट कर सकने वाले’ की पहचान
  choice: मुख्य पाठ में ‘उससे ... जो’ कहकर पहचान को स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: परमेश्वर; शैतान
  rationale: संदर्भ में यह अंतिम न्याय का अधिकार रखने वाले परमेश्वर की ओर सबसे स्वाभाविक रूप से संकेत करता है, लेकिन यूनानी पाठ यहाँ नाम नहीं बताता। इसलिए अनुवाद मूल की अभिव्यक्ति और उसके व्याख्यात्मक तनाव को बनाए रखता है।
- issue: γέεννα का अनुवाद
  choice: गेहन्ना
  alternative: नरक
  rationale: ‘गेहन्ना’ मूल शब्द और हिन्नोम की घाटी से जुड़ी उसकी यहूदी पृष्ठभूमि को सुरक्षित रखता है। ‘नरक’ को सुलभ व्याख्यात्मक विकल्प के रूप में पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गंभीर और गरिमापूर्ण शैली रखी गई है। ‘मार डालते हैं’ मानवीय हिंसा को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘नष्ट कर सकता है’ ἀπολέσαι की अलग और अधिक व्यापक न्याय-संबंधी शक्ति को सुरक्षित रखता है।
