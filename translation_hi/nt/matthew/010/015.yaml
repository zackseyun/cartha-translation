revisions:
- from: मैं तुमसे सच कहता हूँ, न्याय के दिन उस नगर की अपेक्षा सदोम और अमोरा की भूमि के लिए सहना अधिक आसान होगा।
  to: मैं तुमसे सच कहता हूँ, न्याय के दिन उस नगर की अपेक्षा सदोम और अमोरा की भूमि की स्थिति अधिक सहनीय होगी।
  rationale: ‘स्थिति’ is supplied to produce idiomatic Hindi for the Greek impersonal comparative construction. It preserves the contrast between the land of Sodom and Gomorrah and the particular town, while ‘अधिक सहनीय’ faithfully represents ἀνεκτότερον and does not specify the nature of the judgment beyond the text.
  reviewer_model: gpt-5.6-terra
