reference: Matthew 10:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: hi
  text: मैं तुमसे सच कहता हूँ, न्याय के दिन उस नगर की अपेक्षा सदोम और अमोरा की भूमि की स्थिति अधिक सहनीय होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν
  choice: सच
  rationale: आरम्भिक दृढ़ कथन की पुष्टि करने वाले भाव को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है; ‘आमीन’ का लिप्यंतरण यहाँ सामान्य पाठक के लिए कम स्पष्ट होता।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: यूनानी प्रत्यक्ष कथन-सूत्र के निकट रहते हुए स्वाभाविक हिन्दी शब्दक्रम अपनाया गया है।
- source_word: ἀνεκτότερον
  choice: सहना अधिक आसान होगा
  rationale: तुलनात्मक अर्थ ‘अधिक सहनीय’ को साधारण आधुनिक हिन्दी में स्पष्ट करता है और न्याय की तीव्रता की तुलना बनाए रखता है।
- source_word: γῇ
  choice: भूमि के लिए
  rationale: यहाँ शब्द सदोम और अमोरा से जुड़ी भूमि अथवा प्रदेश को दर्शाता है; मूल का भौगोलिक उल्लेख सुरक्षित रखा गया है।
- source_word: Σοδόμων καὶ Γομόρρων
  choice: सदोम और अमोरा
  rationale: इन बाइबलीय स्थान-नामों के हिन्दी में प्रचलित रूप रखे गए हैं।
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: न्याय के दिन
  rationale: भावी दिव्य न्याय के दिन का स्वाभाविक और निकट हिन्दी अनुवाद है, बिना अतिरिक्त धर्मवैज्ञानिक विवरण जोड़े।
- source_word: πόλει
  choice: नगर
  rationale: πόλις नगर या शहर दोनों हो सकता है; प्रसंग में किसी आबादी वाले स्थान के लिए गरिमापूर्ण और व्यापक हिन्दी शब्द ‘नगर’ उपयुक्त है।
- source_word: ἐκείνῃ
  choice: उस
  rationale: यह उस विशिष्ट नगर की ओर संकेत करता है जिसने भेजे गए शिष्यों को स्वीकार नहीं किया।
theological_decisions:
- issue: ‘न्याय के दिन’ का स्वरूप
  choice: इसे भावी दिव्य न्याय के दिन के रूप में अनूदित किया गया है, पर उससे आगे कोई सिद्धान्तगत विवरण नहीं जोड़ा गया।
  alternative: न्याय के किसी सामान्य समय के रूप में समझना।
  rationale: वाक्यांश स्वाभाविक रूप से अंतिम न्याय की दिशा में संकेत करता है, फिर भी अनुवाद मूल कथन से अधिक निश्चित धर्मवैज्ञानिक रूपरेखा नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण है। तुलना को साफ रखने के लिए ‘की अपेक्षा’ और सामान्य बोध के लिए ‘सहना अधिक आसान’ चुना गया है। मूल में ‘भूमि’ स्पष्ट रूप से उपस्थित होने के कारण उसे हटाया नहीं गया।
