source:
  edition: SBLGNT
  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: hi
  text: क्योंकि मैं एक पुरुष को उसके पिता के विरुद्ध[a] खड़ा करने, एक बेटी को उसकी माँ के विरुद्ध, और एक बहू को उसकी सास के विरुद्ध[b] खड़ा करने आया हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विभाजित करने।” यूनानी क्रिया का अधिक शाब्दिक अनुवाद ऐसा हो सकता है, पर आगे बार-बार आया “के विरुद्ध” संबंधों में विरोध का भाव स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द νύμφη कुछ संदर्भों में “दुल्हन” हो सकता है; यहाँ “सास” के साथ आने के कारण इसका अर्थ “बहू” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: मैं ... करने आया हूँ
  rationale: यूनानी एओरिस्ट यहाँ यीशु के आगमन और उद्देश्य की ओर संकेत करता है; हिन्दी में ‘आया हूँ’ वर्तमान संवाद में स्वाभाविक रूप से उसके आगमन का वर्तमान-संबद्ध अर्थ व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका संबंध स्पष्ट रखता है।
- source_word: διχάσαι
  choice: के विरुद्ध ... करने
  rationale: मूल क्रिया का अर्थ बाँटना या फूट उत्पन्न करना है, पर उसके बाद तीन बार κατά के साथ आए संबंध-सूचक पद पारिवारिक विरोध को स्पष्ट करते हैं। हिन्दी में यह रचना उस तीखे संबंध-विरोध को बनाए रखती है।
- source_word: ἄνθρωπον
  choice: एक पुरुष
  rationale: यद्यपि ἄνθρωπος सामान्यतः ‘मनुष्य’ भी हो सकता है, यहाँ पिता के सामने पुत्रवत पुरुष, फिर बेटी और बहू—ऐसा पारिवारिक त्रिक है; इसलिए लिंग-सटीक ‘पुरुष’ उपयुक्त है।
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: उसके पिता के विरुद्ध
  rationale: κατά + संबंधकारक यहाँ विरोध व्यक्त करता है; ‘के विरुद्ध’ सीधा और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: θυγατέρα
  choice: एक बेटी
  rationale: स्त्रीलिंग एकवचन संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: उसकी माँ के विरुद्ध
  rationale: यह वही विरोधसूचक κατά रचना है; सर्वनाम का स्त्री-संदर्भ हिन्दी में स्पष्ट है।
- source_word: νύμφην
  choice: एक बहू
  rationale: νύμφη कभी ‘दुल्हन’ हो सकता है, किंतु यहाँ πενθερά ‘सास’ के साथ जोड़ा गया है, इसलिए संबंधसूचक अर्थ ‘बहू’ अपेक्षित है।
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: उसकी सास के विरुद्ध
  rationale: πενθερά का इस संदर्भ में स्वाभाविक हिन्दी संबंधवाचक शब्द ‘सास’ है; ‘के विरुद्ध’ आवर्ती विरोध को बनाए रखता है।
theological_decisions:
- issue: यीशु के आगमन के उद्देश्य और उससे उत्पन्न पारिवारिक विभाजन का संबंध
  choice: कथन की तीक्ष्णता बनाए रखते हुए इसे परिवार के सदस्यों को परस्पर विरोध में करने के रूप में अनूदित किया गया है।
  alternative: इसे केवल ‘बाँटने’ के रूप में अनूदित करना, अथवा मुख्य पाठ में यह समझाना कि यह यीशु के प्रति निष्ठा के कारण होने वाला उत्पीड़न है।
  rationale: यूनानी पाठ यीशु के आने और परिवारों में उत्पन्न विरोध के बीच स्पष्ट उद्देश्यात्मक संबंध रखता है। अनुवाद इस तनाव को न तो नरम करता है, न यह जोड़ता है कि पारिवारिक शत्रुता अपने आप में अंतिम लक्ष्य या वांछित भलाई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘माँ’, ‘बहू’ और ‘सास’ सामान्य पाठक के लिए स्वाभाविक हैं। वाक्य की आवर्ती संरचना मूल के तीन समानांतर पारिवारिक विरोधों को सुरक्षित रखती है।
