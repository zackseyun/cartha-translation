language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: hi
  text: पर जब वे तुम्हें सौंप दें[a], तो इस बात की चिंता न करना कि कैसे या क्या बोलना है; क्योंकि उस घड़ी तुम्हें वह दिया जाएगा जो तुम्हें बोलना है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सौंप दें’ का अर्थ यहाँ किसी अधिकारी या न्यायिक सत्ता के हाथ में कर देना है; ‘पकड़वा दें’ भी भावानुसार संभव है।
    reason: lexical_alternative
  - marker: b
    text: मूल पाठ में ‘दिया जाएगा’ कर्मवाच्य है और देने वाला इस पद में अनकहा है; अगले पद में आत्मा को तुम्हारे द्वारा बोलने वाला बताया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: पर जब
  rationale: ὅταν भविष्य की अनिश्चित परिस्थिति को ‘जब’ के रूप में रखता है, और δέ पिछले कथन से हल्का विरोध अथवा संक्रमण दिखाता है, जिसे यहाँ ‘पर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: παραδῶσιν
  choice: सौंप दें
  rationale: παραδίδωμι का मूल भाव किसी को दूसरे के अधिकार में सौंप देना है। ‘सौंप दें’ न्यायिक और शत्रुतापूर्ण संदर्भ को बनाए रखता है, पर ‘विश्वासघात’ या ‘गिरफ्तार’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: μὴ μεριμνήσητε
  choice: इसकी चिंता न करना
  rationale: μεριμνάω यहाँ आने वाली गवाही के विषय में व्याकुल चिंता करने को मना करता है। आधुनिक हिन्दी में ‘चिंता न करना’ स्पष्ट और स्वाभाविक है।
- source_word: πῶς ἢ τί
  choice: कैसे या क्या
  rationale: दोनों प्रश्नवाचक शब्द बोलने के ढंग और विषयवस्तु के बीच भेद बनाए रखते हैं; ἤ का अर्थ ‘या’ रखा गया है।
- source_word: λαλήσητε
  choice: बोलना है
  rationale: अप्रत्यक्ष प्रश्न में प्रयुक्त aorist subjunctive को हिन्दी का ‘बोलना है’ स्वाभाविक रूप से व्यक्त करता है और भावी परिस्थिति में अपेक्षित वचन की ओर संकेत करता है।
- source_word: δοθήσεται
  choice: दिया जाएगा
  rationale: भविष्यत् कर्मवाच्य को कर्मवाच्य ही रखा गया है, जिससे देने वाला इस पद में मूल पाठ की तरह अनकहा रहता है।
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: उसी घड़ी
  rationale: यह वाक्यांश ठीक आवश्यकता के समय मिलने वाली सहायता की तात्कालिकता व्यक्त करता है। ‘उसी घड़ी’ वर्तमान हिन्दी में समझने योग्य है और मूल की समय-संबंधी छवि बनाए रखता है।
- source_word: τί λαλήσητε
  choice: जो तुम्हें बोलना है
  rationale: यह अभिव्यक्ति पहले आए λαλήσητε से शब्द-संबंध बनाए रखती है और हिन्दी में कथन की विषयवस्तु को स्वाभाविक रूप से व्यक्त करती है।
theological_decisions:
- issue: δοθήσεται में निहित दिव्य कर्मवाच्य
  choice: ‘दिया जाएगा’ कहकर देने वाले को स्पष्ट रूप से न बताना
  alternative: ‘परमेश्वर तुम्हें देगा’ अथवा ‘पवित्र आत्मा तुम्हें देगा’
  rationale: इस पद में यूनानी पाठ कर्मवाच्य है और देने वाले का नाम नहीं लेता। अगला पद आत्मा की भूमिका स्पष्ट करता है; इसलिए यहाँ परमेश्वर या आत्मा का नाम जोड़ने के बजाय मूल पाठ का संयम और क्रम बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘उसी घड़ी’ मूल की छवि को बचाता है, जबकि वाक्य-विन्यास साधारण हिन्दी पाठक के लिए सहज रखा गया है।
