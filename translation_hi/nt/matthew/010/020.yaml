  to: क्योंकि बोलने वाले आप नहीं हैं, बल्कि आपके पिता की आत्मा आप में बोल रही है।[a]
  rationale: The revision corrects obligatory Hindi gender agreement (“पिता की आत्मा”; “बोल रही है”) and presents the Greek contrast in idiomatic Hindi. It retains “आप में” in the main text, preserving the source wording and its contextual openness, while the footnote supplies the possible instrumental sense “आपके द्वारा.”
