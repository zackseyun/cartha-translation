review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the explanatory γάρ, the emphatic contrast between the disciples and the divine speaker, and retains the direct spatial wording of ἐν ὑμῖν as “आप में.” However, “आपके पिता का आत्मा” has an incorrect gender agreement in standard Hindi: “आत्मा” is feminine, so the genitive must be “आपके पिता की आत्मा.”'
  naturalness: The proposed revision uses natural modern standard Hindi. “बल्कि आपके पिता की आत्मा आप में बोल रही है” clearly attaches the ongoing speaking to the Spirit and avoids the slightly cumbersome “है, जो … बोलता है.”
  terminology: “आपके पिता की आत्मा” faithfully represents τὸ πνεῦμα τοῦ πατρὸς ὑμῶν without adding “स्वर्गीय” or resolving the debated force of ἐν as instrumental. The footnote preserves “आपके द्वारा” only as an alternative contextual rendering.
  issues:
  - severity: medium
    issue: Gender disagreement in “आपके पिता का आत्मा”
    rationale: In modern standard Hindi, “आत्मा” is grammatically feminine. The possessive/genitive form must therefore be “आपके पिता की आत्मा.” The same agreement issue affects the footnote’s “बोलता है.”
  - severity: low
    issue: Finite relative-clause phrasing is less direct than the Greek contrast
    rationale: “बल्कि आपके पिता की आत्मा है, जो आप में बोलता है” is understandable, but the revised wording more naturally expresses that the Spirit—not the disciples—is the one presently speaking.
  revised_text: क्योंकि बोलने वाले आप नहीं हैं, बल्कि आपके पिता की आत्मा आप में बोल रही है।[a]
