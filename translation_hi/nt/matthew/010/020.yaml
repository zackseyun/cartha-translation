id: MAT.10.20
reference: Matthew 10:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: hi
  text: क्योंकि बोलने वाले आप नहीं हैं, बल्कि आपके पिता की आत्मा आप में बोल रही है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपके द्वारा बोल रही है।” यूनानी में शाब्दिक रूप से “आप में” है, जिसका आशय शिष्यों के द्वारा प्रकट होने वाली वाणी भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: क्योंकि ... नहीं
  rationale: γάρ पिछले आश्वासन का कारण स्पष्ट करता है; ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: बोलनेवाले आप नहीं हैं
  rationale: स्पष्ट ὑμεῖς और आर्टिकलयुक्त वर्तमान कृदंत वक्ताओं की पहचान पर बल देते हैं; हिन्दी में यह रचना उसी विरोध और जारी क्रिया को व्यक्त करती है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: नकारात्मक कथन के बाद तीखा सुधारात्मक विरोध दिखाने के लिए ‘बल्कि’ स्वाभाविक और सटीक है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: संदर्भ में यह परमेश्वर के आत्मा का उल्लेख है, न कि मानवीय मनोभाव या श्वास का।
- source_word: τοῦ πατρὸς ὑμῶν
  choice: आपके पिता का
  rationale: यह शिष्यों के पिता के साथ आत्मा का संबंध सीधे व्यक्त करता है; मूल में अनुपस्थित ‘स्वर्गीय’ नहीं जोड़ा गया।
- source_word: τὸ λαλοῦν
  choice: जो ... बोलता है
  rationale: आर्टिकलयुक्त वर्तमान कृदंत आत्मा को बोलनेवाले के रूप में फिर पहचानता है; संबंधवाचक उपवाक्य हिन्दी में अर्थ स्पष्ट और स्वाभाविक रखता है।
- source_word: ἐν ὑμῖν
  choice: आप में
  rationale: ἐν का सीधा अर्थ ‘में’ है। संदर्भ में शिष्यों के माध्यम से वाणी प्रकट होना निहित हो सकता है, पर मुख्य पाठ मूल की अभिव्यक्ति और अस्पष्टता को सुरक्षित रखता है।
theological_decisions:
- issue: ἐν ὑμῖν को अंतर्निवास (‘आप में’) या साधनात्मक अभिकरण (‘आपके द्वारा’) के रूप में प्रस्तुत करना
  choice: आप में
  alternative: आपके द्वारा
  rationale: यूनानी में ἐν है, जिसका प्रत्यक्ष अर्थ ‘में’ है। प्रसंग ‘द्वारा’ का भाव सुझा सकता है, किंतु उसे मुख्य पाठ में रखने से मूल की वास्तविक अर्थगत गुंजाइश समय से पहले निश्चित हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप अपनाया गया है। ‘आप’ बहुवचन शिष्यों के प्रति संबोधन को स्वाभाविक ढंग से व्यक्त करता है। ‘बोलनेवाले आप नहीं हैं’ स्पष्ट सर्वनाम के बल को बनाए रखता है; ‘जो आप में बोलता है’ कृदंत के कर्ता को पिता नहीं, आत्मा स्पष्ट करता है।
