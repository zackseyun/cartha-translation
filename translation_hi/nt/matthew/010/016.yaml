  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: hi
  text: देखो, मैं तुम्हें भेड़ों की तरह भेड़ियों के बीच भेज रहा हूँ। इसलिए साँपों की तरह चतुर और कबूतरों की तरह निष्कपट बनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह श्रोताओं का ध्यान आगे कही जाने वाली गंभीर बात पर खींचता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀποστέλλω
  choice: भेज रहा हूँ
  rationale: वर्तमान काल और भेजे जाने के भाव को सरल, प्रत्यक्ष हिन्दी में व्यक्त करता है।
- source_word: ἐν μέσῳ
  choice: के बीच
  rationale: शाब्दिक स्थानगत अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: φρόνιμοι
  choice: बुद्धिमान
  rationale: संदर्भ में व्यावहारिक समझ, सावधानी और विवेक का समावेश करता है; केवल चतुराई का नकारात्मक भाव नहीं देता।
- source_word: ἀκέραιοι
  choice: निष्कपट
  rationale: हानिरहित, शुद्ध उद्देश्य वाले और छलरहित होने का प्रसंगानुकूल भाव देता है।
theological_decisions:
- issue: साँपों से तुलना का आशय
  choice: साँपों के समान बुद्धिमान
  alternative: साँपों के समान चतुर
  rationale: तुलना को नैतिक छल की स्वीकृति बनाए बिना व्यावहारिक विवेक के रूप में खुला रखता है, जबकि अगले पदांश का ‘निष्कपट’ संतुलन भी बना रहता है।
- issue: ἀκέραιοι का नैतिक बल
  choice: निष्कपट
  alternative: भोले / निर्दोष
  rationale: ‘भोले’ से अविवेक का अर्थ निकल सकता है, जो ‘बुद्धिमान’ के साथ अनुचित तनाव पैदा करता; ‘निष्कपट’ छलरहित चरित्र को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गरिमापूर्ण और सामान्य पाठकों के लिए सहज भाषा। मूल की दोनों उपमाएँ और ‘इसलिए’ से व्यक्त निष्कर्ष-संबंध सुरक्षित रखे गए हैं।
