id: MAT.10.41
reference: Matthew 10:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: hi
  text: जो किसी भविष्यद्वक्ता को भविष्यद्वक्ता के नाम से[a] ग्रहण करता है, वह भविष्यद्वक्ता का प्रतिफल पाएगा; और जो किसी धर्मी जन को धर्मी के नाम से[b] ग्रहण करता है, वह धर्मी का प्रतिफल पाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके भविष्यद्वक्ता होने के कारण’ अथवा ‘उसे भविष्यद्वक्ता मानकर।’ यूनानी में शाब्दिक रूप से ‘भविष्यद्वक्ता के नाम से’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके धर्मी होने के कारण’ अथवा ‘उसे धर्मी मानकर।’ यूनानी में शाब्दिक रूप से ‘धर्मी के नाम से’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: जो ... ग्रहण करता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त किसी भी ऐसे व्यक्ति के लिए सामान्य कथन करता है जो ग्रहण करता है। यह हिन्दी में स्वाभाविक रहते हुए यूनानी संरचना और सामान्य वर्तमान भाव को बनाए रखता है।
- source_word: προφήτην
  choice: किसी भविष्यद्वक्ता को
  rationale: यह कर्मकारक एकवचन का सीधा अनुवाद है। ‘भविष्यद्वक्ता’ हिन्दी बाइबलीय प्रयोग में इस मान्य भूमिका का स्थापित और गरिमापूर्ण पद है।
- source_word: εἰς ὄνομα προφήτου
  choice: भविष्यद्वक्ता के नाम से
  rationale: मुख्य पाठ में यूनानी मुहावरे की शब्दावली और उसकी पुनरावृत्ति सुरक्षित रखी गई है। प्रसंग में इसका अर्थ उसकी पहचानी गई हैसियत के कारण या उसे भविष्यद्वक्ता मानकर ग्रहण करना हो सकता है; इसे पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: μισθὸν προφήτου
  choice: भविष्यद्वक्ता का प्रतिफल
  rationale: यह संबंधकारक की वास्तविक अस्पष्टता बनाए रखता है—अर्थात भविष्यद्वक्ता को मिलने वाला प्रतिफल अथवा भविष्यद्वक्ता से संबद्ध प्रतिफल—और हिन्दी में स्वाभाविक है।
- source_word: λήμψεται
  choice: पाएगा
  rationale: भविष्यकाल को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है। ‘प्राप्त करेगा’ सम्भव है, पर यहाँ अपेक्षाकृत अधिक औपचारिक और भारी लगता है।
- source_word: δίκαιον
  choice: किसी धर्मी जन को
  rationale: विशेषण यहाँ पुरुषवाचक संज्ञा की तरह प्रयुक्त है। ‘धर्मी जन’ स्रोत के व्यक्तिवाचक प्रयोग को रखते हुए आधुनिक हिन्दी में ‘धर्मी मनुष्य’ की अपेक्षा अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: εἰς ὄνομα δικαίου
  choice: धर्मी के नाम से
  rationale: पहले उपवाक्य के समानांतर यूनानी मुहावरा सुरक्षित रखा गया है। इसका आशय उसे धर्मी जानकर या उसके धर्मी होने के कारण ग्रहण करना हो सकता है, जिसे पाद-टिप्पणी में दिया गया है।
- source_word: μισθὸν δικαίου
  choice: धर्मी का प्रतिफल
  rationale: पहले उपवाक्य का समानांतर रूप बनाए रखता है और संबंधकारक को आवश्यकता से अधिक व्याख्यायित नहीं करता।
theological_decisions:
- issue: εἰς ὄνομα + संबंधकारक का अर्थ
  choice: मुख्य पाठ में ‘के नाम से’ रखा गया है और सम्भावित अर्थ पाद-टिप्पणियों में दिए गए हैं।
  alternative: ‘उसके ... होने के कारण’ अथवा ‘उसे ... मानकर’
  rationale: यह मुहावरा व्यक्ति को उसकी मान्य पहचान या भूमिका के आधार पर ग्रहण करने की ओर संकेत करता है। केवल भावानुवाद करने से पुनरावृत्त ‘नाम’ की शब्दावली और उसका धर्मवैचारिक स्वर खो सकता था।
- issue: δίκαιον / δικαίου का व्यक्तिवाचक अनुवाद
  choice: ‘धर्मी जन’ और फिर समानांतर संक्षिप्त रूप ‘धर्मी’
  alternative: ‘धर्मी व्यक्ति’ या ‘धर्मी मनुष्य’
  rationale: यूनानी रूप व्याकरणतः पुल्लिंग एकवचन है। ‘धर्मी जन’ उसका व्यक्तिवाचक और प्रतिनिधिक भाव बनाए रखता है, बिना यह दावा किए कि कथन का सिद्धान्त केवल पुरुषों तक सीमित है।
- issue: μισθὸν προφήτου / δικαίου में संबंधकारक की व्याख्या
  choice: ‘भविष्यद्वक्ता का प्रतिफल’ और ‘धर्मी का प्रतिफल’
  alternative: ‘वह प्रतिफल जो भविष्यद्वक्ता/धर्मी को मिलता है’
  rationale: स्रोत यह स्पष्ट नहीं करता कि संबंधकारक को केवल उस व्यक्ति को मिलने वाले प्रतिफल के रूप में समझना चाहिए या उससे संबद्ध प्रतिफल के रूप में। संक्षिप्त हिन्दी रूप इस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट बाइबलीय शैली अपनाई गई है। ‘ग्रहण करता है’ आतिथ्यपूर्ण स्वागत और स्वीकार—दोनों की सम्भावना रखता है; ‘प्रतिफल’ μισθός के धार्मिक-साहित्यिक संदर्भ के अनुकूल है। दोनों यूनानी उपवाक्यों की सममिति जानबूझकर सुरक्षित रखी गई है।
