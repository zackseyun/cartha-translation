reference: Matthew 28:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: hi
  text: तब यीशु ने उनसे कहा, “मत डरो। जाओ, मेरे भाइयों[a] से कहो कि वे गलील जाएँ; वहाँ वे मुझे देखेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरे भाइयों” से यहाँ यीशु के चेलों का आशय है; यूनानी शब्द पुल्लिंग बहुवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε λέγει αὐταῖς
  choice: तब यीशु ने उनसे कहा
  rationale: τότε कथा के क्रम को आगे बढ़ाता है। यूनानी ऐतिहासिक वर्तमान λέγει को स्वाभाविक हिन्दी कथाशैली में भूतकाल से व्यक्त किया गया है; αὐταῖς स्त्रीलिंग बहुवचन है और संदर्भ में स्त्रियों की ओर संकेत करता है।
- source_word: Μὴ φοβεῖσθε
  choice: मत डरो
  rationale: यह निषेधात्मक आज्ञा का संक्षिप्त, स्वाभाविक और वर्तमान हिन्दी रूप है।
- source_word: ὑπάγετε ἀπαγγείλατε
  choice: जाओ, ... से कहो
  rationale: दोनों बहुवचन आज्ञार्थक क्रियाओं को स्पष्ट और सहज हिन्दी में रखा गया है। ἀπαγγέλλω संदेश पहुँचाने का भाव रखता है, जिसे यहाँ 'कहो' स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῖς ἀδελφοῖς μου
  choice: मेरे भाइयों से
  rationale: मूल यूनानी के पुल्लिंग बहुवचन और पारिवारिक संबोधन दोनों को सुरक्षित रखा गया है; इसे मुख्य पाठ में व्याख्यात्मक रूप से 'चेलों' में नहीं बदला गया।
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: कि वे गलील जाएँ
  rationale: ἵνα सहित संभावनार्थक क्रिया यहाँ पहुँचाए जाने वाले निर्देश की विषय-वस्तु बताती है; 'कि वे ... जाएँ' हिन्दी में अप्रत्यक्ष आज्ञा को ठीक प्रकार व्यक्त करता है।
- source_word: κἀκεῖ με ὄψονται
  choice: वहाँ वे मुझे देखेंगे
  rationale: κἀκεῖ का स्थानसूचक बल 'वहाँ' से और ὄψονται का सामान्य अर्थ 'देखेंगे' से व्यक्त किया गया है; 'मिलेंगे' जैसी अधिक व्याख्यात्मक भाषा से बचा गया है।
theological_decisions:
- issue: '''मेरे भाइयों'' का संदर्भ'
  choice: यीशु का मूल पारिवारिक संबोधन 'मेरे भाइयों' रखा गया है।
  alternative: मुख्य पाठ में 'मेरे चेले' लिखना।
  rationale: निकट संदर्भ इस संबोधन को यीशु के चेलों से जोड़ता है, पर मूल शब्द 'भाइयों' में निहित पारिवारिक और धर्मवैचारिक अर्थ को व्याख्यात्मक प्रतिस्थापन द्वारा मिटाना उचित नहीं है।
- issue: गलील में देखने का आशय
  choice: '''वे मुझे देखेंगे'''
  alternative: '''वे मुझसे मिलेंगे'''
  rationale: ὄψονται सीधे तौर पर देखने को व्यक्त करता है। पुनरुत्थित यीशु से भेंट संदर्भगत आशय हो सकता है, पर मुख्य पाठ में अधिक संकीर्ण व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। 'मत डरो' तथा 'जाओ ... कहो' सामान्य पाठक के लिए सहज हैं, जबकि 'मेरे भाइयों' मूल पाठ की आत्मीयता और अर्थगत तनाव को बनाए रखता है।
