reference: Matthew 28:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὀψὲ δὲ σαββάτων, τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων, ἦλθεν ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία θεωρῆσαι τὸν τάφον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: hi
  text: सब्त के बाद[a], जब सप्ताह के पहले दिन की भोर होने लगी, तब मरियम मगदलीनी और दूसरी मरियम कब्र को देखने आईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “सब्त के दिन देर से, जब सप्ताह के पहले दिन की भोर होने लगी।” आरम्भिक यूनानी वाक्यांश के दोनों अर्थ संभव हैं: “सब्त के बाद” या “सब्त के दिन देर से।”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: सब्त के बाद
  rationale: संबंधकारक के साथ ὀψέ किसी घटना के बाद का समय बता सकता है। पुनरुत्थान-वृत्तांत के इस संदर्भ में यह सब्त समाप्त होने के बाद का समय सूचित करता है। σαββάτων रूप में बहुवचन है, पर यह यहूदी-यूनानी प्रयोग में एकवचन ‘सब्त’ के अर्थ में प्रचलित है। δέ के हल्के संयोजक बल को हिन्दी वाक्य-प्रवाह में अलग शब्द से व्यक्त करना आवश्यक नहीं है।
- source_word: τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων
  choice: जब सप्ताह के पहले दिन की भोर होने लगी
  rationale: ἐπιφώσκω यहाँ प्रकाश होने अथवा भोर आरम्भ होने को सूचित करता है। μίαν σαββάτων सप्ताह के पहले दिन के लिए सामी मुहावरा है; हिन्दी में संयुक्त अभिव्यक्ति समय-संबंध को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἦλθεν
  choice: आईं
  rationale: ἔρχομαι का सामान्य कथात्मक अर्थ ‘आना’ है। संयुक्त स्त्रीलिंग कर्ताओं के अनुसार हिन्दी में बहुवचन आदरसूचक/मानक रूप ‘आईं’ रखा गया है।
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: मरियम मगदलीनी
  rationale: नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं; विशेषण मगदलीनी मरियम की पहचान मगदला से संबंधित स्त्री के रूप में करता है।
- source_word: ἡ ἄλλη Μαρία
  choice: दूसरी मरियम
  rationale: ἄλλη का अर्थ ‘दूसरी/अन्य’ है। ‘दूसरी मरियम’ आधुनिक हिन्दी में सहज है और दोनों स्त्रियों के बीच कथात्मक भेद बनाए रखता है।
- source_word: θεωρῆσαι
  choice: देखने
  rationale: θεωρέω ध्यानपूर्वक देखने या निहारने का भाव दे सकता है। ‘देखने’ उद्देश्य को स्पष्ट रखता है और इसे औपचारिक निरीक्षण के रूप में अधिक विशिष्ट नहीं बनाता।
- source_word: τὸν τάφον
  choice: कब्र
  rationale: τάφος यीशु के दफनाने के स्थान को दर्शाता है। ‘कब्र’ साधारण आधुनिक हिन्दी में स्पष्ट और स्वाभाविक शब्द है।
theological_decisions:
- issue: पुनरुत्थान-वृत्तांत के आरम्भ की समय-सूचक अभिव्यक्ति
  choice: मुख्य पाठ में घटना को सब्त समाप्त होने के बाद, सप्ताह के पहले दिन की भोर के समय रखा गया है।
  alternative: आरम्भिक वाक्यांश का अर्थ ‘सब्त के दिन देर से’ भी लिया जा सकता है।
  rationale: ὀψὲ σαββάτων की व्याख्या विवादित है। निकटवर्ती समय-सूचक अभिव्यक्ति के साथ ‘सब्त के बाद’ संदर्भ में अधिक उपयुक्त है, पर यूनानी की वास्तविक अस्पष्टता को पाद-टिप्पणी में सुरक्षित रखा गया है और किसी अतिरिक्त सामंजस्य को पाठ में नहीं थोपा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सब्त’, ‘मरियम मगदलीनी’ और ‘कब्र’ जैसे परिचित हिन्दी बाइबलीय रूप अपनाए गए हैं। मुख्य पाठ में स्वाभाविक हिन्दी वाक्य-क्रम है, जबकि समय-संबंधी यूनानी अस्पष्टता पाद-टिप्पणी में स्पष्ट रूप से संरक्षित है।
