- from: इसलिए उन्होंने चाँदी के सिक्के ले लिए और जैसा उन्हें निर्देश दिया गया था, वैसा ही किया। और यह बात[a] यहूदियों के बीच आज तक फैली हुई है।
  to: उन्होंने चाँदी ली और जैसा उन्हें निर्देश दिया गया था, वैसा ही किया। और यह बात[a] यहूदियों के बीच आज तक प्रचलित है।
  rationale: The revision removes the unwarranted specification ‘सिक्के’ and the added causal connective ‘इसलिए.’ It retains the draft’s accurate rendering of instruction, the contextual ambiguity of λόγος, and the direct communal sense of παρὰ Ἰουδαίοις. “प्रचलित है” gives natural modern Hindi for the report’s continued circulation up to the author’s present.
