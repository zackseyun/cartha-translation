    text: या ‘यह खबर’ अथवा ‘यह वृत्तांत।’ यूनानी शब्द λόγος का अर्थ संदर्भ के अनुसार ‘बात,’ ‘खबर,’ ‘वृत्तांत’ या ‘कहानी’ हो सकता है।
    reason: lexical_alternative
  revision_rationale: The revision removes the unwarranted specification ‘सिक्के’ and the added causal connective ‘इसलिए.’ It retains the draft’s accurate rendering of instruction, the contextual ambiguity of λόγος, and the direct communal sense of παρὰ Ἰουδαίοις. “प्रचलित है” gives natural modern Hindi for the report’s continued circulation up to the author’s present.
