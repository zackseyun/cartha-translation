  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: hi
  text: उन्होंने चाँदी ली और जैसा उन्हें निर्देश दिया गया था, वैसा ही किया। और यह बात[a] यहूदियों के बीच आज तक प्रचलित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यह खबर’ अथवा ‘यह वृत्तांत।’ यूनानी शब्द λόγος का अर्थ संदर्भ के अनुसार ‘बात,’ ‘खबर,’ ‘वृत्तांत’ या ‘कहानी’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: ले लिए
  rationale: पूर्ववर्ती पद में दिए गए धन को ग्रहण करने की क्रमिक कथा व्यक्त होती है; ‘ले लिए’ स्वाभाविक और संदर्भानुकूल है।
- source_word: τὰ ἀργύρια
  choice: चाँदी के सिक्के
  rationale: ἀργύρια चाँदी के धन या सिक्कों को दर्शाता है। हिन्दी में केवल ‘चाँदी’ अस्पष्ट लग सकती है, इसलिए संदर्भ में ‘चाँदी के सिक्के’ अर्थ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ἐποίησαν
  choice: वैसा ही किया
  rationale: ποιέω का सामान्य अर्थ ‘करना’ है; ‘वैसा ही’ ὡς के साथ निर्देश के अनुरूप कार्य करने पर बल देता है।
- source_word: ὡς ἐδιδάχθησαν
  choice: जैसा उन्हें निर्देश दिया गया था
  rationale: διδάσκω का कर्मवाच्य यहाँ बताई गई योजना के अनुसार कार्य करने का निर्देश दर्शाता है; ‘निर्देश दिया गया था’ वर्तमान हिन्दी में अधिक स्वाभाविक है।
- source_word: διεφημίσθη
  choice: फैली हुई है
  rationale: क्रिया किसी बात के व्यापक रूप से प्रचारित होने को व्यक्त करती है। ‘आज तक’ के साथ ‘फैली हुई है’ अतीत से लेखक के वर्तमान तक बने प्रभाव को सहज रूप में बताता है।
- source_word: ὁ λόγος οὗτος
  choice: यह बात
  rationale: λόγος यहाँ पहरेदारों द्वारा फैलाई गई कथा या खबर को सूचित करता है। ‘बात’ हिन्दी में स्वाभाविक है और मूल शब्द की ‘खबर/वृत्तांत’ वाली अस्पष्टता को बनाए रखती है।
- source_word: παρὰ Ἰουδαίοις
  choice: यहूदियों के बीच
  rationale: παρά के साथ दत्तिव यहाँ किसी समुदाय के भीतर प्रसार का अर्थ देता है; यह अनुवाद कथानक की सीमा से बाहर कोई व्यापक आरोप नहीं जोड़ता।
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: आज तक
  rationale: यह मानक मुहावरा लेखक के समय तक निरंतरता व्यक्त करता है और हिन्दी में संक्षिप्त तथा स्वाभाविक है।
theological_decisions:
- issue: Ἰουδαίοις का ऐसे कथानक में अनुवाद जहाँ व्यापक यहूदी-विरोधी अर्थ ग्रहण किया जा सकता है
  choice: यहूदियों के बीच
  alternative: यहूदी लोगों के बीच; यहूदिया के निवासियों के बीच
  rationale: मूल पद समुदाय के भीतर इस बात के प्रसार को बताता है। ‘यहूदियों के बीच’ सीधा भाषिक अर्थ देता है, जबकि इसे समस्त यहूदी लोगों पर स्थायी धार्मिक निर्णय के रूप में विस्तृत नहीं करता।
- issue: ὁ λόγος οὗτος की प्रकृति
  choice: यह बात
  alternative: यह खबर; यह वृत्तांत; यह कहानी
  rationale: संदर्भ में यह पहरेदारों द्वारा प्रचारित स्पष्टीकरण है। ‘यह बात’ मूल λόγος की अर्थ-व्याप्ति और कथन की प्रकृति में मौजूद लचीलेपन को बचाती है; पादटिप्पणी वैकल्पिक अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘चाँदी के सिक्के’ सामान्य पाठक के लिए ठोस अर्थ स्पष्ट करता है, जबकि λόγος की वास्तविक अर्थगत व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
