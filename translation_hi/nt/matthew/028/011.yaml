id: MAT.28.11
reference: Matthew 28:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Πορευομένων δὲ αὐτῶν ἰδού τινες τῆς κουστωδίας ἐλθόντες εἰς τὴν πόλιν ἀπήγγειλαν τοῖς ἀρχιερεῦσιν ἅπαντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/011.yaml
  text: While they were going[a], behold[b], some of the guard came into the city and reported to the chief priests everything that had happened.
translation:
  language: hi
  text: जब वे जा रही थीं[a], तभी देखो[b], पहरेदारों में से कुछ ने नगर में आकर प्रधान याजकों को वह सब बताया जो हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वे रास्ते में थीं।” यूनानी में यह रचना अगली घटना के लिए समय की पृष्ठभूमि देती है।
    reason: lexical_alternative
  - marker: b
    text: “देखो” यूनानी ध्यान-सूचक शब्द ἰδού का अनुवाद है, जो कथानक में अचानक या उल्लेखनीय घटनाक्रम की ओर ध्यान खींचता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: जब वे जा रही थीं
  rationale: यह संबंधकारक निरपेक्ष रचना अगले घटनाक्रम की समय-पृष्ठभूमि देती है। निकटवर्ती संदर्भ में αὐτῶν उन स्त्रियों की ओर संकेत करता है, इसलिए हिन्दी में स्त्रीलिंग बहुवचन स्वाभाविक है; गंतव्य को अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: ἰδού
  choice: तभी देखो
  rationale: ἰδού कथानक में ध्यान खींचकर अचानक या उल्लेखनीय घटनाक्रम प्रस्तुत करता है। ‘तभी’ संक्रमण की आकस्मिकता और ‘देखो’ मूल ध्यान-सूचकता को बनाए रखते हैं।
- source_word: τινες τῆς κουστωδίας
  choice: पहरेदारों में से कुछ
  rationale: κουστωδία कब्र पर तैनात पहरेदार-दल को सूचित करता है। यह हिन्दी अभिव्यक्ति दल में से कुछ व्यक्तियों का अर्थ स्पष्ट और स्वाभाविक रूप से देती है।
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: नगर में आकर
  rationale: मुख्य क्रिया से पहले का भूतकालिक कृदन्त हिन्दी में क्रमवर्ती सहायक क्रिया ‘आकर’ से स्वाभाविक रूप में व्यक्त होता है और εἰς की भीतर की ओर गति भी बनी रहती है।
- source_word: ἀπήγγειλαν
  choice: बताया
  rationale: क्रिया अधिकारियों तक समाचार या विवरण पहुँचाने का बोध देती है। ‘बताया’ आधुनिक हिन्दी में सहज है और यहाँ औपचारिक ‘सूचित किया’ की अपेक्षा कथात्मक प्रवाह बेहतर रखता है।
- source_word: τοῖς ἀρχιερεῦσιν
  choice: प्रधान याजकों को
  rationale: द्वितीय मंदिरकालीन यहूदी नेतृत्व के संदर्भ में ἀρχιερεῖς के लिए ‘प्रधान याजक’ मानक और स्पष्ट पद है।
- source_word: ἅπαντα τὰ γενόμενα
  choice: वह सब ... जो हुआ था
  rationale: ἅπαντα की समग्रता और τὰ γενόμενα की पूर्वघटित घटनाओं का अर्थ स्वाभाविक हिन्दी में सुरक्षित रहता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। ‘वे’ का स्त्रीलिंग रूप निकटवर्ती संदर्भ की स्त्रियों के कारण लिया गया है। मूल के ध्यान-सूचक ἰδού को छोड़ा नहीं गया, पर हिन्दी प्रवाह के लिए ‘तभी देखो’ रखा गया है।
