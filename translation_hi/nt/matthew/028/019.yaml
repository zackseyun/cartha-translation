id: MAT.28.19
reference: Matthew 28:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πορευθέντες ⸀οὖν μαθητεύσατε πάντα τὰ ἔθνη, ⸀βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: hi
  text: इसलिए जाओ और सब राष्ट्रों के लोगों को शिष्य बनाओ, उन्हें पिता, पुत्र और पवित्र आत्मा के नाम में सम्मिलित करते हुए बपतिस्मा दो,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पिता, पुत्र और पवित्र आत्मा के नाम पर।’ यूनानी में ‘नाम में’ प्रवेश या सम्बन्ध में आने का संकेत देने वाला पूर्वसर्ग है।
    reason: वैकल्पिक मुहावरेदार अनुवाद तथा यूनानी εἰς के सम्भावित प्रवेशात्मक/सम्बन्धपरक भाव को स्पष्ट करना।
lexical_decisions:
- source_word: πορευθέντες
  choice: जाओ
  rationale: यह अओरिस्ट कृदन्त मुख्य आज्ञा μαθητεύσατε से पहले आता है और यहाँ आज्ञात्मक/सहगामी भाव रखता है। ‘जाकर’ सम्भव है, पर ‘जाओ’ महान आदेश की स्पष्टता और बल को अधिक स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पद 18 में यीशु के समस्त अधिकार की घोषणा से निकलने वाला निष्कर्ष दिखाता है।
- source_word: μαθητεύσατε
  choice: शिष्य बनाओ
  rationale: क्रिया का अर्थ किसी को शिष्य बनाना है। यह causative बल को स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: πάντα τὰ ἔθνη
  choice: सभी राष्ट्रों के लोगों को
  rationale: ἔθνη का व्यापक अर्थ राष्ट्रों/जनसमूहों से है। ‘लोगों’ जोड़ने से αὐτούς के मानवीय सन्दर्भ को हिन्दी में स्वाभाविक बनाया गया है और ‘जातियों’ से पैदा हो सकने वाली आधुनिक जाति-व्यवस्था की गलतफहमी से बचा गया है।
- source_word: βαπτίζοντες
  choice: बपतिस्मा दो
  rationale: कृदन्त शिष्य बनाने से जुड़ी क्रिया या माध्यम बताता है। ‘बपतिस्मा’ स्थापित और तटस्थ धार्मिक शब्द है; अनुवाद किसी विशेष विधि, जैसे केवल डुबोने, को निर्धारित नहीं करता।
- source_word: εἰς τὸ ὄνομα
  choice: नाम में
  rationale: εἰς के ‘में/के भीतर’ वाले दिशात्मक भाव को रखा गया है, जो सम्बन्ध या पहचान में प्रवेश का संकेत दे सकता है। हिन्दी की परम्परागत अभिव्यक्ति ‘नाम पर’ को पादटिप्पणी में सम्भव विकल्प के रूप में दिया गया है।
- source_word: τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος
  choice: पिता और पुत्र और पवित्र आत्मा के
  rationale: एकवचन ‘नाम’ के साथ ये तीन समन्वित ईश्वरीय उपाधियाँ हैं। प्रत्येक ‘और’ को बनाए रखने से यूनानी संरचना और त्रिक सूत्र स्पष्ट रहता है।
theological_decisions:
- issue: बपतिस्मा-सूत्र में εἰς का अनुवाद
  choice: नाम में
  alternative: नाम पर
  rationale: ‘नाम में’ यूनानी εἰς के दिशात्मक और सम्बन्धपरक स्वर को अधिक निकटता से सुरक्षित रखता है, पर उससे किसी विस्तृत संस्कारवादी सिद्धान्त को निष्कर्ष के रूप में नहीं जोड़ा गया। ‘नाम पर’ हिन्दी का परिचित और सम्भव मुहावरेदार अनुवाद है।
- issue: एकवचन ‘नाम’ और पिता, पुत्र तथा पवित्र आत्मा
  choice: पिता और पुत्र और पवित्र आत्मा के नाम
  alternative: तीनों के अलग-अलग ‘नामों’ के रूप में विस्तार
  rationale: मूल पाठ में ‘नाम’ एकवचन है और उसके बाद तीन समन्वित सम्बन्धकारक पद आते हैं। अनुवाद इसी तनाव और एकता को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘सभी राष्ट्रों के लोगों’ से सार्वभौमिक दायरा स्पष्ट होता है; ‘शिष्य’ और ‘बपतिस्मा’ सामान्य हिन्दी मसीही प्रयोग के परिचित शब्द हैं। पद अगले पद में जारी वाक्य का भाग है, इसलिए अन्त में अल्पविराम रखा गया है।
