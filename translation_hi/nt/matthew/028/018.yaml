review_pass:
  verdict: revise
  source_fidelity: Draft correctly preserves Jesus’ approach, his address to the disciples, the passive force of Ἐδόθη (‘मुझे दिया गया है’), and the totality and juridical sense of πᾶσα ἐξουσία. However, ‘तब’ gives καί an unnecessarily temporal sense, and ‘स्वर्ग और पृथ्वी पर’ makes ‘पर’ govern both nouns, whereas the Greek distinguishes ‘in heaven’ (ἐν οὐρανῷ) from ‘on earth’ (ἐπὶ τῆς γῆς).
  naturalness: The phrasing is clear and suitably dignified modern Hindi. ‘यीशु ने उनके पास आकर उनसे कहा’ naturally renders the participial approach followed by speech. ‘स्वर्ग में और पृथ्वी पर’ is both idiomatic and more precise.
  terminology: ‘सारा अधिकार’ is an accurate and natural rendering of πᾶσα ἐξουσία. It communicates comprehensive rightful authority rather than mere ability or force. ‘मुझे दिया गया है’ appropriately retains the passive without specifying the giver.
  issues:
  - severity: low
    issue: ‘तब’ is used for καί.
    rationale: καί here most directly coordinates the action (‘and’). ‘तब’ can suggest a temporal or consequential sequence not explicitly expressed.
  - severity: medium
    issue: The distinct spatial prepositions are conflated in ‘स्वर्ग और पृथ्वी पर’.
    rationale: The source says authority is ‘in heaven’ and ‘on earth.’ In Hindi, placing ‘में’ with स्वर्ग and ‘पर’ with पृथ्वी preserves this deliberate distinction.
  revised_text: और यीशु ने उनके पास आकर उनसे कहा, “स्वर्ग में और पृथ्वी पर सारा अधिकार मुझे दिया गया है।”
