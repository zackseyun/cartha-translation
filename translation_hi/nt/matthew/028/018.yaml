  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ Ἰησοῦς ἐλάλησεν αὐτοῖς λέγων· Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ ⸀τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: hi
  text: और यीशु ने उनके पास आकर उनसे कहा, “स्वर्ग में और पृथ्वी पर सारा अधिकार मुझे दिया गया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθὼν
  choice: पास आकर
  rationale: यह προσέρχομαι का भूतकालिक कृदंत है और बोलने से पहले शिष्यों की ओर निकट आने की क्रिया व्यक्त करता है। ‘पास आकर’ स्थानगत भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: उनसे कहा
  rationale: शाब्दिक रूप ‘उनसे बोलते हुए कहा’ हिन्दी में अनावश्यक पुनरुक्ति होगा। ‘उनसे कहा’ दोनों यूनानी क्रियात्मक रूपों का स्वाभाविक और पूरा संवादात्मक अर्थ देता है।
- source_word: Ἐδόθη μοι
  choice: मुझे दिया गया है
  rationale: यूनानी में साधारण भूतकाल का कर्मवाच्य रूप है। हिन्दी का पूर्ण वर्तमान उस सम्पन्न प्रदान को व्यक्त करता है जिसका परिणाम वर्तमान में कायम है, और कर्मवाच्य को भी सुरक्षित रखता है।
- source_word: πᾶσα ἐξουσία
  choice: सारा अधिकार
  rationale: एकवचन भाववाचक संज्ञा के साथ πᾶσα सम्पूर्णता बताता है। ἐξουσία यहाँ केवल सामर्थ्य नहीं, बल्कि वैध अधिकार और शासनाधिकार का बोध कराता है।
- source_word: ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς
  choice: स्वर्ग और पृथ्वी पर
  rationale: यह दोनों क्षेत्रों को समेटने वाला स्वाभाविक हिन्दी युग्म है। साझा ‘पर’ हिन्दी में स्वर्ग और पृथ्वी दोनों के संबंध में अधिकार का क्षेत्र स्पष्ट करता है।
theological_decisions:
- issue: यीशु को सार्वभौमिक अधिकार दिए जाने का स्वरूप
  choice: सारा अधिकार मुझे दिया गया है
  alternative: सारा अधिकार मुझे दिया गया था
  rationale: कर्मवाच्य को बनाए रखने से पाठ का यह कथन सुरक्षित रहता है कि अधिकार यीशु को प्रदान किया गया। पूर्ण वर्तमान सम्पन्न घटना के वर्तमान परिणाम को सामने रखता है; अनुवाद यह स्पष्ट करने का प्रयास नहीं करता कि देने वाला कौन है।
- issue: ἐξουσία का अर्थ
  choice: अधिकार
  alternative: शक्ति
  rationale: ‘अधिकार’ वैध शासन और अधिकारिता का अर्थ अधिक ठीक व्यक्त करता है, जबकि ‘शक्ति’ को केवल सामर्थ्य समझा जा सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तब’ प्रसंगगत संक्रमण को स्वाभाविक बनाता है; ‘पास आकर’ निकट आने की क्रिया बनाए रखता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ स्रोत की अर्थगत सूक्ष्मताओं को पर्याप्त रूप से व्यक्त करता है।
