revisions:
- from: तब यीशु ने उनके पास आकर उनसे कहा, “स्वर्ग और पृथ्वी पर सारा अधिकार मुझे दिया गया है।”
  to: और यीशु ने उनके पास आकर उनसे कहा, “स्वर्ग में और पृथ्वी पर सारा अधिकार मुझे दिया गया है।”
  rationale: The revision removes the added temporal nuance of ‘तब’ and restores the source’s distinct expressions for the heavenly and earthly realms. It retains the draft’s accurate passive construction and its precise rendering of ἐξουσία as ‘अधिकार’. No footnote is needed because the revised Hindi text conveys the relevant meaning directly.
