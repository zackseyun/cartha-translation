source:
  edition: SBLGNT
  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: hi
  text: उन्हें यह सिखाते हुए कि जो कुछ मैंने तुम्हें आज्ञा दी, उसका पालन करें। और देखो, मैं युग के अंत तक[a] हर दिन तुम्हारे साथ हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, ‘युग के समापन तक’; पारंपरिक अनुवादों में, ‘संसार के अंत तक।’ यूनानी में भौतिक संसार का नहीं, बल्कि युग (αἰών) के पूर्ण निष्कर्ष का उल्लेख है।
    reason: मूल यूनानी पदबंध का अर्थ स्पष्ट करना और पारंपरिक वैकल्पिक अनुवाद बताना।
lexical_decisions:
- source_word: διδάσκοντες
  choice: सिखाते हुए
  rationale: वर्तमानकालिक कृदंत पिछले पद में शिष्य बनाने की आज्ञा से जुड़ा है और उस कार्य की निरंतर रीति बताता है; ‘सिखाते हुए’ इस व्याकरणिक संबंध को बनाए रखता है।
- source_word: τηρεῖν
  choice: पालन करें
  rationale: यहाँ τηρέω आज्ञाओं को मानने और सावधानी से निभाने का भाव रखता है। आधुनिक हिन्दी में ‘पालन करना’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: πάντα ὅσα
  choice: जो कुछ … उस सबका
  rationale: यह रचना मूल के सर्वसमावेशी बल को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: ἐνετειλάμην
  choice: मैंने … आज्ञा दी है
  rationale: ἐντέλλομαι यीशु के अधिकारपूर्ण निर्देश को व्यक्त करता है; ‘आज्ञा दी है’ उसके वर्तमान प्रासंगिक प्रभाव को भी सहज हिन्दी में बनाए रखता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: ‘देखो’ ध्यान आकर्षित करने वाले ἰδού के जोर और गंभीरता को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: μεθ’ ὑμῶν εἰμι
  choice: मैं … तुम्हारे साथ हूँ
  rationale: यह शिष्यों के साथ यीशु की निरंतर उपस्थिति का सीधा और स्पष्ट अनुवाद है।
- source_word: πάσας τὰς ἡμέρας
  choice: हर दिन
  rationale: शाब्दिक अर्थ ‘सभी दिन’ है; ‘हर दिन’ उसके दिन-प्रतिदिन निरंतर रहने के भाव को अधिक स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: συντελείας
  choice: अंत
  rationale: συντέλεια किसी अवधि के पूर्ण निष्कर्ष या समापन को दर्शाता है। ‘अंत’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी उसके ‘समापन/पूर्णता’ के सूक्ष्म भाव को स्पष्ट करती है।
- source_word: αἰῶνος
  choice: युग
  rationale: αἰών यहाँ किसी युग या कालखंड को दर्शाता है, भौतिक संसार को नहीं; इसलिए ‘युग’ ‘संसार’ से अधिक सटीक है।
theological_decisions:
- issue: ἕως τῆς συντελείας τοῦ αἰῶνος का काल-संबंधी और युगांत-विषयक अर्थ
  choice: युग के अंत तक
  alternative: युग के समापन तक; पारंपरिक रूप से, संसार के अंत तक
  rationale: यह वाक्यांश युग के पूर्ण निष्कर्ष की ओर संकेत करता है, न कि अनिवार्य रूप से भौतिक जगत के विनाश की ओर। ‘युग के अंत तक’ सटीकता और सहजता का संतुलन रखता है।
- issue: यीशु की उपस्थिति की अवधि
  choice: हर दिन … युग के अंत तक
  alternative: सदा … युग के अंत तक
  rationale: ‘हर दिन’ मूल के πάσας τὰς ἡμέρας को स्पष्ट रूप से व्यक्त करता है और उपस्थिति के दिन-प्रतिदिन निरंतर भाव को सुरक्षित रखता है, बिना इसके आगे की स्थिति के विषय में अनावश्यक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। पद का आरंभ कृदंत ‘सिखाते हुए’ से किया गया है ताकि पिछले पद की ‘शिष्य बनाओ’ आज्ञा से उसका व्याकरणिक संबंध बना रहे। ‘तुम्हारे’ बहुवचन शिष्यों को संबोधित करता है।
