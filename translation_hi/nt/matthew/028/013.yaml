source:
  edition: SBLGNT
  text: λέγοντες· Εἴπατε ὅτι Οἱ μαθηταὶ αὐτοῦ νυκτὸς ἐλθόντες ἔκλεψαν αὐτὸν ἡμῶν κοιμωμένων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/013.yaml
  text: saying[a], “Say[b], ‘His disciples came by night and stole him while we were sleeping.’”
translation:
  language: hi
  text: और कहा, “तुम यह कहना, ‘उसके चेले रात में आए और जब हम सो रहे थे, तब उसे[a] चुरा ले गए।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में “उसे” है, “उसका शव” नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: और उनसे कहा
  rationale: वर्तमान कृदन्त निर्देश की विषयवस्तु का परिचय देता है। हिन्दी में पूर्ववर्ती प्रसंग से जुड़ा finite रूप स्वाभाविक है; बहुवचन कर्ता के कारण ‘कहा’ सामूहिक कथन को व्यक्त करता है।
- source_word: Εἴπατε
  choice: तुम कहना
  rationale: द्वितीय पुरुष बहुवचन आदेश है। ‘तुम कहना’ प्रत्यक्ष आदेश बनाए रखता है और हिन्दी में उद्धृत निर्देश के लिए स्वाभाविक है।
- source_word: ὅτι
  choice: प्रत्यक्ष उद्धरण द्वारा व्यक्त
  rationale: ὅτι कथन की विषयवस्तु आरम्भ करता है; हिन्दी में इसे अलग ‘कि’ जोड़ने के बजाय भीतर के प्रत्यक्ष उद्धरण से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: उसके चेले
  rationale: साधारण संबंधसूचक रचना है। ‘उसके’ यीशु की ओर संकेत करता है, और ‘चेले’ आधुनिक सामान्य हिन्दी में μαθηταί का सहज धार्मिक-संदर्भ वाला रूप है।
- source_word: νυκτὸς
  choice: रात में
  rationale: कालवाचक adverbial genitive है, जो उनके आने का समय बताता है। ‘रात में’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐλθόντες
  choice: आए
  rationale: यह मुख्य क्रिया से पहले की क्रिया बताने वाला aorist participle है; हिन्दी में ‘आए और ... चुरा ले गए’ क्रम स्वाभाविक रूप से वही संबंध व्यक्त करता है।
- source_word: ἔκλεψαν
  choice: चुरा ले गए
  rationale: चोरी करके वहाँ से ले जाने की क्रिया को प्रसंगानुकूल, मुहावरेदार हिन्दी में व्यक्त करता है, बिना किसी अतिरिक्त वस्तु को स्पष्ट किए।
- source_word: αὐτὸν
  choice: उसे
  rationale: यूनानी पाठ में व्यक्तिगत सर्वनाम है, ‘उसका शव’ नहीं। इसलिए यीशु के लिए ‘उसे’ रखा गया है।
- source_word: ἡμῶν κοιμωμένων
  choice: जब हम सो रहे थे
  rationale: Genitive absolute समकालिक परिस्थिति बताता है। यह रूप स्पष्ट आधुनिक हिन्दी में ‘while we were sleeping’ का अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: गढ़ी हुई सूचना में αὐτόν का अभिप्राय
  choice: व्यक्तिगत सर्वनाम ‘उसे’ बनाए रखना
  alternative: ‘उसका शव’
  rationale: मूल पाठ αὐτόν अर्थात ‘उसे’ कहता है। ‘उसका शव’ कथानक की व्याख्या तो करता, पर मूल में निहित शब्द जोड़ देता और व्यक्तिगत सर्वनाम को वस्तुवाचक बना देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘चेले’ सामान्य पाठक के लिए सहज है। वाक्य में दो स्तर के उद्धरण हैं ताकि प्रधान याजकों और पुरनियों द्वारा सैनिकों को सिखाए गए गढ़े हुए कथन की संरचना स्पष्ट रहे।
