  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τοῦ φόβου αὐτοῦ ἐσείσθησαν οἱ τηροῦντες καὶ ἐγενήθησαν ⸀ὡς νεκροί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: hi
  text: और उसके भय से पहरेदार काँप उठे और मरे हुओं के समान हो गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके डर के मारे पहरेदार थरथरा उठे और मरे हुओं के समान हो गए।’
    reason: ἀπό कारण भी व्यक्त कर सकता है, और ἐσείσθησαν का अधिक अभिव्यंजक अनुवाद ‘थरथरा उठे’ हो सकता है।
lexical_decisions:
- source_word: ἀπὸ … τοῦ φόβου
  choice: उसके भय से
  rationale: ἀπό के साथ संबंधकारक यहाँ भय को प्रतिक्रिया के स्रोत अथवा कारण के रूप में प्रस्तुत करता है। ‘भय से’ यूनानी संरचना और कारण—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δὲ
  choice: और
  rationale: δέ यहाँ कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘और’ अनावश्यक विरोध प्रकट किए बिना प्रवाह बनाए रखता है।
- source_word: αὐτοῦ
  choice: उसके
  rationale: सर्वनाम का सबसे निकट और स्वाभाविक संदर्भ पिछले पद में वर्णित स्वर्गदूत है। हिन्दी का ‘उसके’ मूल के संबंधकारक रूप को सुरक्षित रखता है।
- source_word: ἐσείσθησαν
  choice: काँप उठे
  rationale: σείω का यह रूप शारीरिक रूप से हिल जाने या काँपने को दर्शाता है। ‘काँप उठे’ तीव्र, अचानक प्रतिक्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἱ τηροῦντες
  choice: पहरेदार
  rationale: शाब्दिक अर्थ ‘पहरा देने वाले’ है; प्रसंग में कब्र की रखवाली कर रहे सैनिक अभिप्रेत हैं, इसलिए ‘पहरेदार’ संक्षिप्त और स्पष्ट है।
- source_word: ἐγενήθησαν
  choice: हो गए
  rationale: γίνομαι अवस्था में परिवर्तन बताता है; ‘हो गए’ इस परिवर्तन को केवल ‘थे’ की अपेक्षा अधिक ठीक रूप से व्यक्त करता है।
- source_word: ὡς νεκροί
  choice: मरे हुओं के समान
  rationale: ὡς तुलना सूचित करता है, वास्तविक मृत्यु नहीं। ‘के समान’ इस उपमा को स्पष्ट रखता है और यह नहीं कहता कि पहरेदार सचमुच मर गए थे।
theological_decisions:
- issue: αὐτοῦ (‘उसके’) का संदर्भ
  choice: यह सर्वनाम पिछले पद में वर्णित स्वर्गदूत की ओर संकेत करता है।
  alternative: इसे समूची स्वर्गीय घटना की ओर अधिक सामान्य संकेत माना जा सकता है।
  rationale: निकटतम संदर्भ स्वर्गदूत और उसका बिजली-जैसा रूप है; फिर भी हिन्दी में केवल ‘उसके’ रखकर मूल पाठ की सर्वनामगत संक्षिप्तता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘भय’ मूल संज्ञा का सीधा प्रतिनिधित्व करता है, जबकि ‘काँप उठे’ साधारण पाठक के लिए स्वाभाविक और सजीव है।
