id: MAT.28.2
reference: Matthew 28:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: hi
  text: और देखो, एक बड़ा भूकंप हुआ; क्योंकि प्रभु का एक स्वर्गदूत स्वर्ग से उतरकर पास आया, पत्थर को लुढ़काकर हटा दिया और उस पर बैठा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: और देखो
  rationale: वर्णन में अचानक घटित दृश्य की ओर ध्यान खींचने वाले मूल अभिव्यक्ति-बल को बनाए रखता है।
- source_word: σεισμὸς ... μέγας
  choice: एक बड़ा भूकंप
  rationale: σεισμός का संदर्भानुकूल सामान्य अर्थ ‘भूकंप’ है और μέγας उसकी तीव्रता बताता है।
- source_word: ἄγγελος ... κυρίου
  choice: प्रभु का एक स्वर्गदूत
  rationale: ἄγγελος के स्वर्गीय दूत वाले अर्थ और अनिर्दिष्टता को स्वाभाविक हिन्दी में व्यक्त करता है; κυρίου को ‘प्रभु’ रखा गया है।
- source_word: καταβὰς ἐξ οὐρανοῦ
  choice: स्वर्ग से उतरकर
  rationale: क्रियाविशेषणीय कृदंत और उसके स्रोत को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: προσελθὼν
  choice: पास आया
  rationale: मूल का सामान्य अर्थ निकट आने का है; अंग्रेज़ी consultation layer के ‘came up’ को यांत्रिक रूप से नहीं अपनाया गया।
- source_word: ἀπεκύλισε τὸν λίθον
  choice: पत्थर को लुढ़का दिया
  rationale: ἀποκυλίω में पत्थर को लुढ़काकर हटाने की ठोस क्रिया निहित है।
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: उस पर बैठ गया
  rationale: अपूर्ण भूतकालीन रूप परिणामी बैठी हुई अवस्था को चित्रित करता है; हिन्दी में घटनाक्रम के भीतर ‘बैठ गया’ स्वाभाविक है।
theological_decisions:
- issue: κυρίου में प्रभु की पहचान
  choice: प्रभु
  alternative: याहवे / परमेश्वर
  rationale: मूल यूनानी में सामान्य κυρίου है; अनुवाद किसी अधिक विशिष्ट पहचान को पाठ में नहीं जोड़ता।
- issue: भूकंप और स्वर्गदूत के उतरने का कारण-संबंध
  choice: ‘क्योंकि’ के द्वारा स्पष्ट संबंध
  alternative: दो स्वतंत्र घटनाओं की तरह प्रस्तुत करना
  rationale: γάρ भूकंप के वर्णन को स्वर्गदूत के उतरने और कार्य से व्याख्यात्मक रूप से जोड़ता है; पाठ जितना कहता है उससे आगे कोई भौतिक विवरण नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। मूल के दृश्यात्मक ‘और देखो’ तथा क्रमिक क्रियाओं को बनाए रखते हुए हिन्दी वाक्य को स्वाभाविक बनाया गया है।
