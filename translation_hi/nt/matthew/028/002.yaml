  naturalness: The Hindi is clear and modern. ‘भूकंप हुआ’ is slightly more idiomatic in formal narrative than ‘भूकंप आया,’ and a semicolon better accommodates the explanatory γάρ clause.
  terminology: ‘प्रभु का एक स्वर्गदूत’ is natural and appropriately preserves the Greek’s indefinite ‘an angel’ and non-expanded κυρίου (‘of the Lord’). No doctrinal specification has been added.
