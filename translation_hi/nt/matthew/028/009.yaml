  to: और देखो, यीशु उनसे आ मिला और बोला, “नमस्कार![a]” और वे पास आकर उसके पाँव पकड़ लिए और उसकी आराधना की।[b]
  rationale: The revision makes the greeting idiomatic in modern standard Hindi, represents the encounter verb naturally with “आ मिला,” and adjusts both footnotes to preserve the Greek alternatives without adding an unwarranted durative force or a specific bodily posture. “आराधना की” is retained as a contextually defensible main-text rendering, while the note keeps the lexical ambiguity open.
