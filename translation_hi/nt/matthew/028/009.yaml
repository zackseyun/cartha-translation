id: MAT.28.9
reference: Matthew 28:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ἰδοὺ Ἰησοῦς ⸀ὑπήντησεν αὐταῖς λέγων· Χαίρετε· αἱ δὲ προσελθοῦσαι ἐκράτησαν αὐτοῦ τοὺς πόδας καὶ προσεκύνησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: hi
  text: और देखो, यीशु उनसे आ मिला और बोला, “नमस्कार![a]” और वे पास आकर उसके पाँव पकड़ लिए और उसकी आराधना की।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आनन्दित हो!” यूनानी शब्द χαίρετε शाब्दिक रूप से बहुवचन आज्ञार्थक है, पर यहाँ वह अभिवादन के रूप में प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या “उसके सामने झुके” या “उसे सम्मान दिया।” यूनानी क्रिया προσεκύνησαν झुककर सम्मान देने अथवा आराधना करने—दोनों अर्थों में प्रयुक्त हो सकती है; यहाँ पुनरुत्थान का प्रसंग अधिक प्रबल धार्मिक अर्थ का संकेत देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह कथावृत्त में ध्यान खींचने और दृश्य को सजीव बनाने वाला संकेत है; इसे छोड़ने के बजाय स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: ὑπήντησεν
  choice: मिला
  rationale: क्रिया यहाँ मार्ग में आमने-सामने मिलने का सामान्य अर्थ देती है; ‘मिला’ संक्षिप्त और स्वाभाविक है तथा अनावश्यक दिशात्मक अर्थ नहीं जोड़ता।
- source_word: Χαίρετε
  choice: तुम्हें नमस्कार!
  rationale: χαίρω का यह बहुवचन आज्ञार्थक रूप इस प्रसंग में अभिवादन के रूप में प्रयुक्त है। ‘तुम्हें नमस्कार’ उसके सामाजिक कार्य को सहज आधुनिक हिन्दी में व्यक्त करता है, जबकि शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: προσελθοῦσαι
  choice: पास आकर
  rationale: स्त्रीलिंग बहुवचन कृदन्त यीशु की ओर बढ़ने और उसके बाद की क्रियाओं का क्रम बताता है; ‘पास आकर’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: उसके पाँव पकड़ लिए
  rationale: κρατέω यहाँ दृढ़ता से थामने का अर्थ देता है। यह चयन वास्तविक शारीरिक स्पर्श को स्पष्ट रखता है, पर ‘जकड़ लिया’ जैसी अनावश्यक कठोरता से बचता है।
- source_word: προσεκύνησαν αὐτῷ
  choice: उसकी आराधना की
  rationale: पुनरुत्थान के इस प्रसंग में προσκυνέω केवल सम्मान प्रकट करने से अधिक धार्मिक अर्थ रख सकता है। ‘आराधना की’ उस प्रबल अर्थ को व्यक्त करता है, जबकि ‘दण्डवत किया’ की वास्तविक शाब्दिक सम्भावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: पुनर्जीवित यीशु के प्रति προσκυνέω का अर्थ
  choice: उसकी आराधना की
  alternative: उसके सामने दण्डवत किया / उसे सम्मान दिया
  rationale: मत्ती के पुनरुत्थान-वर्णन में यह क्रिया यीशु के प्रति गहरी धार्मिक भक्ति का संकेत देती है, इसलिए ‘आराधना’ प्रसंग के भार के अनुकूल है। फिर भी यूनानी क्रिया शारीरिक रूप से झुकने या दण्डवत करने को भी व्यक्त कर सकती है; उस वास्तविक अर्थ-सीमा को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देखो’ ने मूल का ध्यानाकर्षक कथात्मक संकेत सुरक्षित रखा है। स्त्रीलिंग बहुवचन का हिन्दी में अलग रूप आवश्यक नहीं, पर ‘उनसे’ पूर्ववर्ती स्त्रियों की ओर संकेत बनाए रखता है। ‘पाँव’ सामान्य आधुनिक शब्द है और ‘आराधना’ प्रसंग की धार्मिक गंभीरता व्यक्त करता है।
