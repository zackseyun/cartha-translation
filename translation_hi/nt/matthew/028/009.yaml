review_pass:
  verdict: revise
  source_fidelity: The draft preserves the narrative sequence, the attention marker ἰδού, Jesus’ encounter with the women, their physical grasp of his feet, and their act of προσκύνησις. However, “तुम्हें नमस्कार” is not an idiomatic Hindi greeting, and the footnote’s “आनन्दित रहो” is not the closest Hindi representation of the plural imperative.
  naturalness: “तुम्हें नमस्कार” sounds marked and somewhat calqued; “नमस्कार!” is the natural modern Hindi greeting. “उनसे आ मिला” makes the encounter sense of ὑπήντησεν clearer and more idiomatic in this narrative setting.
  terminology: “आराधना की” is a defensible contextual rendering of προσεκύνησαν, provided that the footnote preserves the less interpretive senses of bowing down or paying homage. “दण्डवत” alone can suggest a more specific bodily posture than the Greek necessarily requires; “उसके सामने झुके” is broader and more accurate.
  issues:
  - severity: medium
    issue: The greeting “तुम्हें नमस्कार!” is unnatural Hindi.
    rationale: Χαίρετε functions as a direct plural greeting. Modern Hindi normally says “नमस्कार!” rather than using “तुम्हें” in this formula.
  - severity: low
    issue: The lexical footnote renders the literal imperative as “आनन्दित रहो!”
    rationale: The Greek plural imperative is more directly represented by “आनन्दित हो!”; “रहो” adds a durative nuance not expressed by the aorist imperative.
  - severity: low
    issue: The alternative “दण्डवत किया” can be overly specific for προσκυνέω.
    rationale: The verb may refer broadly to bowing/prostration or homage. “उसके सामने झुके” retains this semantic range without specifying a particular posture.
