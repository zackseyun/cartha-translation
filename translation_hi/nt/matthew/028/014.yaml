source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀκουσθῇ τοῦτο ⸀ἐπὶ τοῦ ἡγεμόνος, ἡμεῖς πείσομεν ⸀αὐτὸν καὶ ὑμᾶς ἀμερίμνους ποιήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: hi
  text: और यदि यह बात राज्यपाल के कानों तक पहुँचे,[a] तो हम उसे मना लेंगे और तुम्हें चिंता से मुक्त कर देंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि यह बात राज्यपाल के ध्यान में आए।”
    reason: lexical_alternative
  - marker: b
    text: 'प्रसंग में इसका भाव यह भी हो सकता है: “तुम्हें मुसीबत से बचा लेंगे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ
  choice: कानों तक पहुँचे
  rationale: यह निष्क्रिय क्रिया यहाँ किसी बात के सुनाई देने या ज्ञात हो जाने का भाव रखती है। हिंदी मुहावरे में ‘कानों तक पहुँचे’ स्वाभाविक है और सूचना राज्यपाल तक पहुँचने का आशय देता है।
- source_word: ἐπὶ τοῦ ἡγεμόνος
  choice: राज्यपाल के कानों तक
  rationale: ἐπί और संबंधकारक के इस प्रयोग में बात के राज्यपाल की सुनवाई या ध्यान में आने का अर्थ है। मुख्य पाठ में स्वाभाविक हिंदी रखी गई है; अधिक स्पष्ट विकल्प पादटिप्पणी में है।
- source_word: ἡγεμόνος
  choice: राज्यपाल
  rationale: इस रोमी प्रशासनिक संदर्भ में ἡγεμών प्रांतीय राज्यपाल, अर्थात पिलातुस, को सूचित करता है।
- source_word: πείσομεν αὐτόν
  choice: हम उसे मना लेंगे
  rationale: πείθω का मूल भाव किसी को राजी या आश्वस्त करना है। ‘मना लेंगे’ आधुनिक हिंदी में स्वाभाविक है और यह अस्पष्टता बनाए रखता है कि वे किस तर्क या उपाय से ऐसा करेंगे।
- source_word: ἀμερίμνους
  choice: चिंता से मुक्त
  rationale: शब्द का सीधा अर्थ चिंता, फिक्र या परवाह से मुक्त होना है। प्रसंग में संभावित दंड से बचाने का संकेत है, पर मुख्य पाठ स्रोत की अपेक्षाकृत शाब्दिक अभिव्यक्ति को बनाए रखता है।
- source_word: ποιήσομεν
  choice: कर देंगे
  rationale: ποιέω यहाँ विधेय विशेषण के साथ परिणामसूचक है—‘तुम्हें चिंतामुक्त बना देंगे।’ हिंदी में ‘चिंता से मुक्त कर देंगे’ स्वाभाविक समतुल्य है।
theological_decisions: []
