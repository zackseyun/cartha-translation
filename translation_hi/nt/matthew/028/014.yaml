  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘राज्यपाल’ प्रशासनिक पद को स्पष्ट करता है; ‘मना लेंगे’ बोलचाल में समझने योग्य रहते हुए मूल के ‘राजी करने’ के भाव को सुरक्षित रखता है। अंतिम पद में मूल के ‘चिंता से मुक्त’ अर्थ को मुख्य पाठ में रखा गया है और प्रसंगगत ‘मुसीबत से बचाने’ का भाव पादटिप्पणी में दिया गया है।
