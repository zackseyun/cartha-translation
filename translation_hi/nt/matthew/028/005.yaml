base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: hi
  text: पर स्वर्गदूत ने स्त्रियों से कहा, “तुम मत डरो[a], क्योंकि मैं जानता हूँ कि तुम क्रूस पर चढ़ाए गए यीशु को ढूँढ़ रही हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में ‘तुम’ स्पष्ट रूप से आया है और उस पर जोर है; आश्वासन विशेष रूप से इन स्त्रियों को दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: पर ... ने ... कहा
  rationale: यूनानी ‘उत्तर देकर कहा’ एक प्रचलित कथात्मक सूत्र है। हिन्दी में केवल ‘कहा’ स्वाभाविक है, जबकि ‘पर’ δέ के हल्के संक्रमण और विरोध को व्यक्त करता है।
- source_word: ὁ ἄγγελος
  choice: स्वर्गदूत
  rationale: पुनरुत्थान के इस प्रसंग में यह मानवीय संदेशवाहक नहीं, बल्कि स्वर्गीय दूत है; ‘स्वर्गदूत’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ταῖς γυναιξίν
  choice: स्त्रियों से
  rationale: यहाँ γυναιξίν वयस्क स्त्री व्यक्तियों को सूचित करता है; ‘स्त्रियों’ सटीक और गरिमापूर्ण है।
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: तुम मत डरो
  rationale: हिन्दी में कर्ता ‘तुम’ को स्पष्ट रखने से ὑμεῖς का जोर स्वाभाविक ढंग से उभरता है; निषेधात्मक आश्वासन के रूप में ‘मत डरो’ सहज है।
- source_word: οἶδα γὰρ ὅτι
  choice: क्योंकि मैं जानता हूँ कि
  rationale: γάρ आश्वासन का कारण देता है और ὅτι ज्ञात बात की विषय-वस्तु आरम्भ करता है।
- source_word: Ἰησοῦν τὸν ἐσταυρωμένον
  choice: क्रूस पर चढ़ाए गए यीशु
  rationale: पूर्ण निष्क्रिय कृदन्त यीशु को उस व्यक्ति के रूप में पहचानता है जिसे क्रूस पर चढ़ाया गया है; यह रूप पूर्ण हुई क्रिया और उसकी बनी हुई प्रासंगिकता दोनों को संक्षेप में रखता है।
- source_word: ζητεῖτε
  choice: ढूँढ़ रही हो
  rationale: वर्तमान काल इस प्रसंग में जारी खोज को सूचित करता है। स्त्रियों को संबोधन होने के कारण स्त्रीलिंग बहुवचन क्रिया स्वाभाविक है।
theological_decisions:
- issue: आश्वासन में ὑμεῖς का स्पष्ट जोर
  choice: ‘तुम मत डरो’ में ‘तुम’ को स्पष्ट रखा और पाद-टिप्पणी में जोर बताया।
  alternative: ‘मत डरो’ अथवा ‘तुम स्त्रियाँ मत डरो’
  rationale: मूल पाठ विशेष रूप से स्त्रियों को आश्वस्त करता है, पर यह स्पष्ट नहीं करता कि इसके विपरीत किसे डरना चाहिए। इसलिए जोर सुरक्षित रखा गया, संभावित विरोध को सिद्धान्ततः नहीं खोला गया।
- issue: τὸν ἐσταυρωμένον का पक्ष
  choice: ‘क्रूस पर चढ़ाए गए यीशु’
  alternative: ‘वह यीशु जिन्हें क्रूस पर चढ़ाया गया था’ अथवा ‘क्रूसित यीशु’
  rationale: चुना हुआ रूप पूर्ण हुई निष्क्रिय क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और यीशु की पहचान को उसी क्रूसारोपण से जोड़ता है, बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण पर सामान्य पाठक के लिए सहज। ‘उत्तर देकर कहा’ जैसे अस्वाभाविक शाब्दिक सूत्र से बचते हुए यूनानी कथात्मक अर्थ रखा गया है। प्रत्येक पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित है।
