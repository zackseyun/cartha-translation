  text: And when they saw him[a], they worshiped him, but some doubted.
translation:
  language: hi
  text: जब उन्होंने उसे देखा, तो उन्होंने उसकी आराधना की; पर कुछ ने संदेह किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हिचकिचाए” अथवा “डगमगाए।” यूनानी शब्द दृढ़ अविश्वास के बजाय अनिश्चितता या झिझक का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: जब उन्होंने उसे देखा
  rationale: अओरिस्ट कृदन्त को स्वाभाविक हिन्दी में कालसूचक उपवाक्य के रूप में व्यक्त किया गया है; इससे मुख्य क्रियाओं के साथ उसका सम्बन्ध बना रहता है।
- source_word: προσεκύνησαν
  choice: उन्होंने उसकी आराधना की
  rationale: προσκυνέω का अर्थ दण्डवत करना, सम्मान प्रकट करना या आराधना करना हो सकता है। पुनरुत्थित यीशु के प्रति इस क्रिया के मत्ती-संदर्भ में ‘आराधना की’ उसके श्रद्धापूर्ण और धार्मिक आशय को सबसे उपयुक्त रूप से व्यक्त करता है।
- source_word: οἱ δὲ
  choice: पर कुछ ने
  rationale: यह पदबंध पहले बताए गए समूह के भीतर एक अनिर्दिष्ट हिस्से को विरोधसूचक ढंग से अलग करता है। ‘पर कुछ ने’ हिन्दी में इस अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: ἐδίστασαν
  choice: संदेह किया
  rationale: διστάζω संदेह करने, हिचकिचाने या डगमगाने का भाव दे सकता है। मुख्य पाठ में ‘संदेह किया’ सीधा और परिचित है, जबकि अनिश्चितता या हिचकिचाहट की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: पुनरुत्थित यीशु के प्रति προσκυνέω का आशय
  choice: ‘उसकी आराधना की’
  alternative: ‘उसे दण्डवत किया’ या ‘उसे सम्मान दिया’
  rationale: पुनरुत्थान के बाद के मत्ती-संदर्भ में यीशु इस क्रिया के प्रत्यक्ष लक्ष्य हैं। ‘आराधना’ इस कार्य के धार्मिक भार को दर्शाती है, फिर भी यूनानी शब्द के सन्दर्भगत अर्थ की सीमा में रहती है।
- issue: διστάζω की अर्थ-छाया
  choice: मुख्य पाठ में ‘संदेह किया’
  alternative: ‘हिचकिचाए’ या ‘डगमगाए’
  rationale: यूनानी शब्द दृढ़ अविश्वास के बजाय झिझक या डगमगाती अनिश्चितता भी व्यक्त कर सकता है। इस तनाव को बिना एक ही अर्थ में बाँधे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आराधना’ धार्मिक सन्दर्भ में सामान्य पाठक के लिए स्पष्ट है। पादटिप्पणी-चिह्न को ‘संदेह किया’ के बाद रखा गया है, क्योंकि टिप्पणी उसी यूनानी क्रिया से सम्बन्धित है।
