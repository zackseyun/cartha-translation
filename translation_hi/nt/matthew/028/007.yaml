source:
  edition: SBLGNT
  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: hi
  text: और शीघ्र जाकर उसके शिष्यों से कहो, ‘वह मृतकों में से उठाया गया है, और देखो, वह तुमसे आगे गलील जा रहा है। वहाँ तुम उसे देखोगे।’ देखो, मैंने तुमसे कह दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ πορευθεῖσαι
  choice: शीघ्र जाकर
  rationale: स्त्रीलिंग बहुवचन कृदंत स्त्रियों को संबोधित आदेश की परिस्थिति बताता है; हिन्दी में स्वाभाविक रूप से मुख्य आज्ञा के साथ ‘शीघ्र जाकर’ रखा गया है।
- source_word: Ἠγέρθη
  choice: जिलाया गया है
  rationale: यूनानी कर्मवाच्य को सुरक्षित रखता है और यह संकेत देता है कि यीशु ने स्वयं को नहीं उठाया; कर्ता मूल पाठ में स्पष्ट नहीं किया गया है।
- source_word: ἀπὸ τῶν νεκρῶν
  choice: मरे हुओं में से
  rationale: मुहावरे का निकट और सहज हिन्दी रूप, जो मृतकों के बीच से जी उठने का भाव रखता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: दोनों स्थानों पर ध्यान आकर्षित करने वाले उद्गार का वर्तमान, सहज हिन्दी रूप; दूसरे प्रयोग की बलाघातपूर्ण पुनरावृत्ति भी सुरक्षित है।
- source_word: προάγει ὑμᾶς
  choice: तुमसे पहले ... जा रहा है
  rationale: क्रिया का अर्थ यहाँ आगे चलना या पहले पहुँचना है; ‘तुमसे पहले’ गलील जाने की दिशा और प्राथमिकता स्पष्ट करता है।
- source_word: ὄψεσθε
  choice: देखोगे
  rationale: साधारण भविष्यकाल को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पुनरुत्थान में कर्मवाच्य और अप्रकट कर्ता
  choice: ‘जिलाया गया है’
  alternative: ‘जी उठा है’
  rationale: मूल Ἠγέρθη कर्मवाच्य है। अनुवाद उसी रूप को बचाता है, पर ‘परमेश्वर ने’ जोड़कर मूल की अप्रकट कर्ता-संरचना को नहीं भरता।
- issue: προάγει का अर्थ
  choice: ‘तुमसे पहले गलील जा रहा है’
  alternative: ‘तुम्हें गलील ले जा रहा है’
  rationale: संदर्भ में यीशु का शिष्यों से आगे/पहले गलील जाना अभिप्रेत है; नेतृत्व का संभव व्यापक भाव अनुवाद में सिद्धांतगत रूप से नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सरल। ‘शीघ्र’ कथन की तात्कालिकता रखता है; ‘देखो’ ἰδοὺ की दोनों पुनरावृत्तियों को स्पष्ट और समान रूप में प्रस्तुत करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
