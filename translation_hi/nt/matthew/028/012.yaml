    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθέντες
  choice: इकट्ठे होकर
  rationale: अओरिस्ट कृदंत की पूर्ववर्ती क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ रूप का भाव साथ आने या इकट्ठा होने का है।
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: पुरनियों के साथ
  rationale: μετά संबंध और सहभागिता दर्शाता है। मत्ती के यहूदी नेतृत्व-संदर्भ में ‘पुरनिये’ प्रचलित और समझने योग्य पद है।
- source_word: συμβούλιόν τε λαβόντες
  choice: सलाह की
  rationale: यह यूनानी मुहावरा मिलकर विचार-विमर्श या योजना बनाने को दर्शाता है; ‘सलाह की’ संक्षिप्त और स्वाभाविक है तथा किसी विशेष योजना को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: ἀργύρια ἱκανὰ
  choice: चाँदी के बहुत-से सिक्के
  rationale: ἀργύρια चाँदी की मुद्रा को और ἱκανὰ पर्याप्त/बड़ी मात्रा को सूचित करता है। प्रसंग में ‘बहुत-से’ मात्रा की प्रमुख भावना देता है।
- source_word: ἔδωκαν
  choice: दिए
  rationale: δίδωμι के साधारण अओरिस्ट मुख्य क्रिया-रूप का सीधा हिन्दी अनुवाद।
- source_word: τοῖς στρατιώταις
  choice: सैनिकों को
  rationale: शब्द का सीधा अर्थ ‘सैनिक’ है; प्रसंगगत भूमिका ‘पहरेदार’ होने पर भी मूल शब्द को सुरक्षित रखा गया है।
theological_decisions:
- issue: अंतर्निहित कर्ता की पहचान
  choice: ‘उन्होंने’—पिछले पद के प्रधान याजकों की ओर संकेत
  alternative: किसी अनिर्दिष्ट समूह को स्पष्ट कर्ता मानना
  rationale: यूनानी में कर्ता दोहराया नहीं गया, पर बहुवचन कृदंत और मुख्य क्रिया मत्ती 28:11 के प्रधान याजकों को आगे बढ़ाते हैं। इसलिए नाम फिर जोड़े बिना ‘उन्होंने’ रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘पुरनिये’ बाइबलीय नेतृत्व-पद के रूप में रखा गया है; वाक्य में यूनानी कृदंत-क्रम को स्वाभाविक हिन्दी क्रिया-क्रम में ढाला गया है।
