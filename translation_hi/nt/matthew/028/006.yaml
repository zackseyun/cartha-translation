base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: hi
  text: वह यहाँ नहीं है, क्योंकि वह जिलाया गया है[a], जैसा उसने कहा था। आओ, वह स्थान देखो जहाँ वह पड़ा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जी उठा है।” यूनानी क्रिया रूपतः कर्मवाच्य है—“जिलाया गया है”—यद्यपि हिन्दी में इसे प्रायः सक्रिय रूप में कहा जाता है।
    reason: alternative_reading
  - marker: b
    text: या, “जहाँ वह लेटा था” अथवा “जहाँ उसे रखा गया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: वह यहाँ नहीं है
  rationale: यह स्थान बताने वाली स्वाभाविक यूनानी अभिव्यक्ति है। संदर्भ से कर्ता स्पष्ट है, इसलिए हिन्दी में ‘वह’ रखा गया है।
- source_word: ἠγέρθη
  choice: वह जिलाया गया है
  rationale: यूनानी क्रिया रूपतः कर्मवाच्य है। ‘जिलाया गया है’ उस वाच्य और पुनरुत्थान में निहित बाहरी कर्तृत्व को सुरक्षित रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पहले कथन का कारण देता है; आधुनिक हिन्दी में ‘क्योंकि’ संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: καθὼς εἶπεν
  choice: ठीक जैसा उसने कहा था
  rationale: ‘ठीक जैसा’ पूर्वकथन और उसकी पूर्ति के अनुरूप होने पर बल देता है; ‘कहा था’ हिन्दी में पूर्ववर्ती कथन को स्वाभाविक ढंग से दर्शाता है।
- source_word: δεῦτε
  choice: आओ
  rationale: यह निकट आने का आमंत्रण या आदेश है; ‘आओ’ संक्षिप्त और सहज हिन्दी है।
- source_word: ἴδετε
  choice: देखो
  rationale: आज्ञार्थक रूप तत्काल प्रत्यक्ष निरीक्षण के लिए कहता है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὸν τόπον
  choice: वह स्थान
  rationale: यह कब्र के भीतर उस निश्चित भौतिक स्थान को सूचित करता है जहाँ यीशु का शरीर पड़ा था।
- source_word: ὅπου ἔκειτο
  choice: जहाँ वह पड़ा था
  rationale: केῖμαι की स्थितिवाचक भावना ‘पड़ा था’ से स्वाभाविक रूप में आती है और यह स्पष्ट किए बिना कि किसने रखा, मूल की संभावित अर्थ-सीमा बची रहती है।
theological_decisions:
- issue: पुनरुत्थान के कथन में वाच्य और कर्तृत्व
  choice: वह जिलाया गया है
  alternative: वह जी उठा है
  rationale: ἠγέρθη रूपतः कर्मवाच्य है। ‘जिलाया गया है’ मूल वाच्य को बनाए रखता है और अनकहे कर्ता को पाठ में जोड़ता नहीं; सक्रिय विकल्प हिन्दी में प्रचलित है, पर वह व्याकरणिक वाच्य बदल देता है।
- issue: ὅπου ἔκειτο में अवस्था और रखे जाने का भाव
  choice: जहाँ वह पड़ा था
  alternative: जहाँ उसे रखा गया था
  rationale: मूल क्रिया मुख्यतः पड़े होने की अवस्था व्यक्त करती है। चुना हुआ रूप किसी पूर्व कर्ता या घटना को अनावश्यक रूप से स्पष्ट किए बिना उस अवस्था को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और बोलचाल में बोधगम्य रूप अपनाया गया है। ‘जिलाया गया है’ कुछ कम प्रचलित होते हुए भी मूल यूनानी के कर्मवाच्य को स्पष्ट रखता है; उसकी स्वाभाविक सक्रिय अभिव्यक्ति पादटिप्पणी में दी गई है।
