id: MAT.28.3
reference: Matthew 28:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἦν δὲ ἡ εἰδέα αὐτοῦ ⸀ὡς ἀστραπὴ καὶ τὸ ἔνδυμα αὐτοῦ λευκὸν ὡς χιών.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: hi
  text: उसका रूप[a] बिजली के समान था, और उसका वस्त्र बर्फ के समान सफेद था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकृति’ अथवा ‘दिखावट’।
    reason: εἰδέα के निकटवर्ती शाब्दिक विकल्पों को दर्शाने के लिए।
lexical_decisions:
- source_word: δὲ
  choice: अलग से अनूदित नहीं
  rationale: यहाँ δέ कथा को हल्के ढंग से आगे बढ़ाता है; हिन्दी में इसे व्यक्त किए बिना वाक्य स्वाभाविक रहता है और किसी अनावश्यक विरोध का भाव नहीं आता।
- source_word: εἰδέα
  choice: रूप
  rationale: यह शब्द दिखाई देने वाले बाहरी स्वरूप को बताता है। ‘रूप’ आधुनिक हिन्दी में स्वाभाविक, संक्षिप्त और प्रसंगानुकूल है।
- source_word: ὡς ἀστραπή
  choice: बिजली के समान
  rationale: ὡς की उपमा को स्पष्ट रूप से बनाए रखता है और ἀστραπή का सामान्य अर्थ ‘बिजली’ देता है।
- source_word: ἔνδυμα
  choice: वस्त्र
  rationale: मूल शब्द एक सामान्य पहनावे या वस्त्र को दर्शाता है; ‘वस्त्र’ किसी विशेष प्रकार के परिधान का संकेत जोड़े बिना गरिमापूर्ण और स्पष्ट है।
- source_word: λευκόν
  choice: सफेद
  rationale: मूल विशेषण साधारणतः सफेदी बताता है; ‘सफेद’ अनावश्यक तीव्रता जोड़े बिना उसका सीधा अर्थ देता है।
- source_word: ὡς χιών
  choice: बर्फ के समान
  rationale: वस्त्र की सफेदी की तुलना बर्फ से करने वाली दूसरी उपमा को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: αὐτοῦ का संदर्भ
  choice: ‘उसका’ सर्वनाम बनाए रखा गया है; निकटवर्ती प्रसंग में यह प्रभु के दूत की ओर संकेत करता है।
  alternative: स्पष्टता के लिए ‘दूत का’ कहना, या व्यापक पुनरुत्थान-प्रसंग के कारण इसे यीशु की ओर संकेत मान लेना।
  rationale: पद 2 में सबसे निकट पूर्वपद ‘प्रभु का दूत’ है। फिर भी मूल यूनानी इस पद में संज्ञा को दोहराने के बजाय सर्वनाम रखता है, इसलिए अनुवाद भी ‘उसका’ रखकर मूल की अभिव्यक्ति और प्रसंगगत संदर्भ दोनों सुरक्षित करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वस्त्र’ सामान्य आधुनिक पाठक के लिए बोधगम्य है और मूल के एकवचन को भी बनाए रखता है। दोनों उपमाओं में ‘के समान’ का प्रयोग समानांतर संरचना और काव्यात्मक स्पष्टता देता है।
