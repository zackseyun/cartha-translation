source:
  edition: SBLGNT
  text: καὶ ⸀ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου μετὰ φόβου καὶ χαρᾶς μεγάλης ἔδραμον ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: hi
  text: और वे कब्र से जल्दी निकलकर भय[a] और बड़े आनन्द के साथ उसके चेलों को समाचार देने दौड़ीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “श्रद्धामिश्रित विस्मय।” यहाँ “भय” के लिए आया यूनानी शब्द इस प्रसंग में श्रद्धा से भरे विस्मय का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου
  choice: कब्र से जल्दी निकलकर
  rationale: स्त्रीलिंग बहुवचन कृदन्त ἀπελθοῦσαι को प्रसंग में निहित स्त्रियों के अनुसार रखा गया है; ταχύ की शीघ्रता और ἀπὸ τοῦ μνημείου के प्रस्थान-बिंदु, दोनों स्वाभाविक हिन्दी में सुरक्षित हैं।
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: भय और बड़े आनन्द के साथ
  rationale: μετά के साथ आने वाली दोनों भावनाओं को साथ-साथ रखा गया है। φόβος को केवल आतंक या केवल श्रद्धामिश्रित विस्मय मानकर सीमित नहीं किया गया, और χαρᾶς μεγάλης की तीव्रता को ‘बड़े आनन्द’ से व्यक्त किया गया है।
- source_word: ἔδραμον
  choice: दौड़ीं
  rationale: τρέχω के स्पष्ट शारीरिक अर्थ और स्त्रियों के बहुवचन कर्ता को सुरक्षित रखता है; ‘जल्दी गईं’ जैसे कमजोर रूप से बचा गया है।
- source_word: ἀπαγγεῖλαι
  choice: समाचार देने
  rationale: यह उद्देश्यसूचक अनन्त क्रिया है। यूनानी में प्रत्यक्ष कर्म व्यक्त नहीं है, इसलिए घटना की विषय-वस्तु को अनावश्यक रूप से जोड़े बिना खबर पहुँचाने का भाव दिया गया है।
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: उसके चेलों को
  rationale: μαθηταί के लिए सुस्पष्ट और प्रचलित बाइबलीय हिन्दी ‘चेले’ है; αὐτοῦ का सम्बन्ध प्रसंगानुसार यीशु से है, पर नाम को मूल से अधिक स्पष्ट करके नहीं जोड़ा गया।
theological_decisions:
- issue: स्त्रियों की प्रतिक्रिया में भय और आनन्द का तनाव
  choice: भय और बड़े आनन्द के साथ
  alternative: श्रद्धामिश्रित विस्मय और बड़े आनन्द के साथ
  rationale: मत्ती दोनों भावों को एक साथ प्रस्तुत करता है। मुख्य पाठ में ‘भय’ रखकर इस तनाव को सुरक्षित रखा गया है, जबकि पादटिप्पणी φόβος की प्रसंगानुकूल वैकल्पिक छाया बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। स्त्रीलिंग बहुवचन ‘दौड़ीं’ से प्रसंगगत कर्ता स्पष्ट होता है। ‘कब्र’ और ‘चेले’ साधारण पाठक के लिए परिचित शब्द हैं; वाक्य की गति मूल वर्णन की तत्परता बनाए रखती है।
