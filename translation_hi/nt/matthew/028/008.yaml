  source_fidelity: The translation accurately represents the participial departure from the tomb, the haste, the paired emotions of φόβος and great joy, the women's running, the purpose of reporting, and the reference to his disciples. The implicit object of ἀπαγγεῖλαι is appropriately not supplied.
  naturalness: The Hindi is fluent, clear, and suitably dignified in modern standard usage. “कब्र से जल्दी निकलकर” and “समाचार देने दौड़ीं” convey the narrative movement naturally. The feminine plural verb correctly reflects the women supplied by the preceding context.
  terminology: “कब्र” is an accessible rendering of μνημεῖον in this resurrection context, and “चेले” is a standard, recognizable rendering of μαθηταί. “भय” preserves the source's deliberate tension with “बड़े आनन्द,” without prematurely narrowing φόβος to reverent awe alone.
