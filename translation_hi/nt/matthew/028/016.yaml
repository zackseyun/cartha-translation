lexical_decisions:
- source_word: δὲ
  choice: अलग शब्द के रूप में व्यक्त नहीं किया
  rationale: यह हल्का कथात्मक संयोजक है। हिंदी में प्रसंग का प्रवाह बिना ‘तब’ या ‘परन्तु’ जोड़े स्वाभाविक रहता है; ऐसा जोड़ अनावश्यक कालगत या विरोधात्मक बल दे सकता था।
- source_word: ἕνδεκα μαθηταὶ
  choice: ग्यारह शिष्य
  rationale: ‘शिष्य’ यीशु से सीखने और उनका अनुसरण करने वालों के लिए स्थापित, स्वाभाविक शब्द है; ‘ग्यारह’ यहूदा के बाद बचे हुए समूह की स्पष्ट संख्या बनाए रखता है।
- source_word: ἐπορεύθησαν
  choice: गए
  rationale: इस कथात्मक प्रसंग में सामान्य गति के लिए सरल और स्वाभाविक हिंदी अभिव्यक्ति।
- source_word: εἰς τὴν Γαλιλαίαν
  choice: गलील में
  rationale: अगले गंतव्य ‘पहाड़’ के साथ मिलकर हिंदी में ‘गलील में उस पहाड़ पर गए’ अधिक स्वाभाविक है और गलील की ओर/उसके भीतर जाने का भाव व्यक्त करता है।
- source_word: εἰς τὸ ὄρος
  choice: उस पहाड़ पर
  rationale: संज्ञा के साथ निश्चित उपपद और आगे का संबंधवाचक वाक्य किसी विशिष्ट पहाड़ की ओर संकेत करते हैं। ‘पहाड़’ मूल शब्द का सामान्य अर्थ सुरक्षित रखता है।
- source_word: οὗ
  choice: जहाँ
  rationale: यह स्थानसूचक संबंधवाचक क्रियाविशेषण है; हिंदी में ‘जहाँ’ इसका स्वाभाविक समतुल्य है।
- source_word: ἐτάξατο
  choice: निर्देश दिया था
  rationale: क्रिया पूर्व में की गई व्यवस्था, निर्धारण या निर्देश को सूचित कर सकती है। प्रसंग में यीशु ने मिलने का स्थान पहले से बताया था; पूर्ण भूतकाल उस पूर्वता को स्पष्ट करता है। वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: मूल के दत्तिव कर्म को हिंदी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ Ἰησοῦς
  choice: यीशु
  rationale: व्यक्तिवाचक नाम का मानक हिंदी रूप।
theological_decisions:
- issue: यीशु द्वारा मिलने के स्थान के पूर्व-निर्धारण का स्वरूप
  choice: ‘निर्देश दिया था’
  alternative: ‘उनके लिए ठहराया था’ या ‘नियुक्त किया था’
  rationale: पद का केंद्र पहले से बताए या निर्धारित किए गए स्थान पर है। चुना हुआ रूप अनावश्यक रूप से औपचारिक पद-नियुक्ति या संस्थागत अधिकार-संरचना का भाव नहीं जोड़ता, जबकि यूनानी क्रिया की व्यापकता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण कथात्मक शैली। ‘चेले’ की अपेक्षा ‘शिष्य’ चुना गया है क्योंकि यह सामान्य बाइबिलीय प्रयोग में व्यापक रूप से समझा जाता है और अत्यधिक बोलचाल का नहीं है।
