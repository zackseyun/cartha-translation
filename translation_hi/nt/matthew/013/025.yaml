  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: hi
  text: पर जब लोग सो रहे थे, तब उसका शत्रु आया और गेहूँ के बीच खरपतवार बोकर चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: लोग
  rationale: यह बहुवचन सामान्य रूप से खेत से जुड़े मनुष्यों को सूचित करता है; हिन्दी में ‘लोग’ स्वाभाविक और समावेशी है, जबकि ‘पुरुष’ अनावश्यक रूप से लिंग पर बल देगा।
- source_word: ζιζάνια
  choice: जंगली पौधों के बीज
  rationale: ζιζάνια गेहूँ के बीच उगने वाले हानिकारक खरपतवार, संभवतः डार्नेल, को दर्शाता है। हिन्दी पाठक के लिए सहज अर्थ देते हुए किसी अनिश्चित वनस्पति-प्रजाति को निश्चित नहीं किया गया।
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: गेहूँ के बीच
  rationale: मूल वाक्यांश का स्थान-संबंधी अर्थ संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: ἐπέσπειρεν
  choice: बीज बोकर
  rationale: क्रिया शत्रु द्वारा जानबूझकर ऊपर/बीच में बोने की क्रिया बताती है; ζιζάνια को पौधों के रूप में व्यक्त करने पर ‘बीज’ जोड़ना हिन्दी में बोने की क्रिया को स्वाभाविक बनाता है।
