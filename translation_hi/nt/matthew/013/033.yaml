  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: hi
  text: 'उसने उन्हें एक और दृष्टान्त सुनाया: “स्वर्ग का राज्य खमीर[a] के समान है, जिसे एक स्त्री ने लिया और तीन माप आटे[c] में छिपा दिया[b], जब तक कि सारा आटा खमीरयुक्त न हो गया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यीस्ट।” यूनानी शब्द आटे को खमीर उठाने वाले पदार्थ को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “मिला दिया” अथवा “गूँथकर मिला दिया”; यूनानी में शाब्दिक अर्थ “भीतर छिपा दिया” है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में “तीन सआ आटा”; यह बहुत बड़ी मात्रा थी।
    reason: cultural_note
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: उसने उन्हें एक और दृष्टान्त सुनाया
  rationale: यह अतिरिक्त दृष्टान्त का स्वाभाविक कथात्मक परिचय है; ‘सुनाया’ λαλέω के प्रसंगगत भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: मत्ती के इस विशिष्ट सामी-प्रभावित प्रयोग का प्रचलित और अर्थपूर्ण हिन्दी रूप; यूनानी बहुवचन को कृत्रिम रूप से नहीं रखा गया।
- source_word: ζύμῃ
  choice: खमीर
  rationale: यह आटे को खमीर उठाने वाले पदार्थ को दर्शाता है और दृष्टान्त में इसके सकारात्मक या नकारात्मक धार्मिक मूल्य का निर्णय नहीं करता।
- source_word: ἐνέκρυψεν εἰς
  choice: में छिपा दिया
  rationale: यूनानी क्रिया के शाब्दिक ‘भीतर छिपाने’ के भाव को सुरक्षित रखता है; ‘मिला दिया’ सम्भव प्रसंगगत अर्थ है, जिसे पादटिप्पणी में दिया गया है।
- source_word: ἀλεύρου σάτα τρία
  choice: तीन माप आटे
  rationale: ‘माप’ सामान्य पाठक के लिए सुबोध है, जबकि मूल की विशिष्ट इकाई ‘सआ’ और मात्रा की विशालता पादटिप्पणी में सुरक्षित हैं।
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: जब तक कि सारा आटा खमीरयुक्त न हो गया
  rationale: निष्क्रिय क्रिया और ὅλον की समग्रता को स्पष्ट रखता है, बिना ‘लोई’ या किसी अन्य ऐसी वस्तु को जोड़ने के जिसका मूल में स्पष्ट उल्लेख नहीं है।
theological_decisions:
- issue: राज्य के दृष्टान्त में ζύμη का धार्मिक आशय
  choice: ‘खमीर’ को मूल्य-निरपेक्ष रूप में रखा गया
  alternative: अन्य बाइबलीय प्रसंगों के आधार पर खमीर को स्वतः बुराई का प्रतीक मानकर अनुवाद को नकारात्मक बनाना
  rationale: इस पद में तुलना छिपे हुए और व्यापक प्रभाव की छवि प्रस्तुत करती है; अनुवाद को खमीर के व्यापक धार्मिक प्रतीकवाद पर विवाद का निर्णय नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दृष्टान्त’ और ‘स्वर्ग का राज्य’ जैसे व्यापक रूप से समझे जाने वाले बाइबलीय पद बनाए गए हैं। मूल के असामान्य ‘छिपा दिया’ को मुख्य पाठ में रखकर उसके स्वाभाविक पाक-सन्दर्भ वाले विकल्प पादटिप्पणी में दिए गए हैं।
