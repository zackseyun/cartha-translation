id: MAT.13.19
reference: Matthew 13:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: hi
  text: जब कोई राज्य का वचन सुनता है और उसे नहीं समझता, तो वह दुष्ट[a] आकर उसके हृदय में बोए गए वचन को छीन लेता है। यही वह है जो मार्ग के किनारे बोया गया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह दुष्ट व्यक्ति।”
    reason: ὁ πονηρός के लिए निकटवर्ती शाब्दिक विकल्प; प्रसंग में अभिव्यक्ति व्यक्तिगत कर्ता को सूचित करती है।
  - marker: b
    text: या, “रास्ते के पास बोया गया है।”
    reason: ὁδός का अर्थ ‘मार्ग’ या ‘रास्ता’ और παρά का अर्थ ‘किनारे/पास’ हो सकता है।
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: जब कोई ... सुनता है
  rationale: सम्बन्धकारक कृदन्तीय रचना यहाँ सामान्य परिस्थिति व्यक्त करती है। ‘जब कोई’ आधुनिक हिन्दी में स्वाभाविक है और παντός की व्यापकता बनाए रखता है।
- source_word: λόγον τῆς βασιλείας
  choice: राज्य का वचन
  rationale: ‘वचन’ λόγος के अर्थ को बनाए रखता है और दृष्टान्त में वचन तथा बीज के बीच की छवि को सुरक्षित रखता है; ‘राज्य’ परमेश्वर के राज्य के लिए प्रसंगानुकूल संक्षिप्त रूप है।
- source_word: μὴ συνιέντος
  choice: उसे नहीं समझता
  rationale: συνίημι यहाँ अर्थ समझने या ग्रहण करने को दर्शाता है। ‘उसे’ का संकेत पहले आए ‘वचन’ की ओर है और हिन्दी में वाक्य को स्वाभाविक बनाता है।
- source_word: ὁ πονηρὸς
  choice: वह दुष्ट
  rationale: संज्ञा-सूचक विशेषण और निश्चित उपपद मिलकर यहाँ एक व्यक्तिगत दुष्ट कर्ता की ओर संकेत करते हैं। ‘वह दुष्ट’ यूनानी की निश्चितता रखता है, पर उसे पाठ में स्पष्ट नाम नहीं देता।
- source_word: ἁρπάζει
  choice: छीन लेता है
  rationale: यह क्रिया अचानक और बलपूर्वक ले जाने का भाव रखती है; ‘छीन लेता है’ उस सजीवता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ
  choice: उसके हृदय में बोए गए वचन
  rationale: मूल में संज्ञा के रूप में प्रयुक्त कर्मवाच्य कृदन्त है—‘जो बोया गया’। हिन्दी में ‘वचन’ को दोहराने से आशय स्पष्ट होता है, जबकि बोने की दृष्टान्तात्मक छवि और ‘हृदय’ का बाइबलीय शब्द सुरक्षित रहते हैं।
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: वह ... जो मार्ग के किनारे बोया गया था
  rationale: यह व्यक्ति को बोए गए बीज के साथ दृष्टान्तात्मक रूप से पहचानने वाली मूल अभिव्यक्ति को बनाए रखता है। ‘मार्ग के किनारे’ παρά और ὁδός का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ὁ πονηρὸς की पहचान
  choice: एक व्यक्तिगत दुष्ट कर्ता—‘वह दुष्ट’
  alternative: अमूर्त ‘बुराई’ अथवा अधिक स्पष्ट नाम ‘शैतान’
  rationale: क्रिया ‘आकर ... छीन लेता है’ एक व्यक्तिगत कर्ता का समर्थन करती है। फिर भी पद स्वयं उसका नाम नहीं बताता, इसलिए ‘शैतान’ जोड़कर व्याख्या को पाठ में नहीं मिलाया गया।
- issue: सुनने वाले और बोए गए बीज/भूमि की पहचान
  choice: ‘यही वह है जो ... बोया गया था’
  alternative: ‘यह मार्ग के किनारे बोए गए बीज के समान व्यक्ति है’
  rationale: मूल पाठ व्यक्ति और बोए गए तत्व को रूपकात्मक ढंग से सीधे जोड़ता है। अधिक व्याख्यात्मक उपमा जोड़ने के बजाय इस अर्थगत तनाव को सुरक्षित रखा गया है।
- issue: αὐτοῦ का लिंग और वचन
  choice: ‘उसके हृदय’
  alternative: ‘उस व्यक्ति के हृदय’ या बहुवचन/लिंग-निरपेक्ष रूप
  rationale: यूनानी में एकवचन पुल्लिंग सर्वनाम है, जिसका प्रयोग प्रतिनिधिक रूप में हुआ है। ‘कोई’ व्यापक अर्थ व्यक्त करता है और ‘उसके’ स्रोत की एकवचन रचना बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वचन’, ‘हृदय’ और ‘मार्ग’ जैसे परिचित बाइबलीय शब्द दृष्टान्त की छवि बचाते हैं। अंतिम वाक्य की कुछ असामान्यता जानबूझकर रखी गई है, क्योंकि मूल पाठ सुनने वाले व्यक्ति को बोए गए बीज के साथ सीधे पहचानता है।
