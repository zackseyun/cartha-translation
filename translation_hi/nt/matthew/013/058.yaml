    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: और ... उसने ... नहीं किए
  rationale: καί कथा को आगे बढ़ाता है, और οὐκ ἐποίησεν किसी कार्य को न किए जाने की बात कहता है। यह अनुवाद असमर्थता का भाव जोड़े बिना यूनानी कथन को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण अपने नगर के उस स्थान की ओर संकेत करता है।
- source_word: δυνάμεις πολλὰς
  choice: बहुत-से सामर्थ्य के काम
  rationale: सुसमाचारों के इस प्रसंग में δύναμις सामर्थ्य प्रकट करने वाले कार्यों, अर्थात चमत्कारी कामों, को दर्शाता है। ‘सामर्थ्य के काम’ मूल शब्द के ‘शक्ति/सामर्थ्य’ वाले अर्थ को बनाए रखता है, और πολλὰς का अर्थ ‘बहुत-से’ है।
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: उनके अविश्वास के कारण
  rationale: यहाँ διά कर्मकारक के साथ कारण बताता है। ἀπιστία का सीधा अर्थ ‘अविश्वास’ या ‘विश्वास की कमी’ है; प्रसंग में ‘अविश्वास’ अस्वीकार के नकारात्मक भाव को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: क्या यह पद यीशु की असमर्थता बताता है या अविश्वास के कारण उसके बहुत-से सामर्थ्य के काम न करने की बात कहता है
  choice: ‘उसने ... बहुत-से सामर्थ्य के काम नहीं किए’
  alternative: ‘वह ... बहुत-से चमत्कार नहीं कर सका’
  rationale: मत्ती के यूनानी पाठ में οὐκ ἐποίησεν, अर्थात ‘उसने नहीं किए’, है; असमर्थता व्यक्त करने वाली क्रिया नहीं है। इसलिए अनुवाद कार्य न किए जाने तक सीमित रहता है और उससे अधिक प्रबल धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण शैली। ‘सामर्थ्य के काम’ मूल यूनानी की शक्ति-संबंधी अर्थछाया को सुरक्षित रखता है; पादटिप्पणी अधिक प्रचलित विकल्प ‘चमत्कार’ स्पष्ट करती है।
