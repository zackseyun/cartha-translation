  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: hi
  text: फिर, स्वर्ग का राज्य एक बड़े जाल[a] के समान है, जिसे समुद्र में डाला जाता है और जो हर प्रकार की मछलियों को इकट्ठा करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द विशेष रूप से ऐसे बड़े जाल को दर्शाता है जिसे पानी में फैलाकर या खींचकर मछलियाँ पकड़ी जाती थीं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हर प्रकार में से”; मछली पकड़ने के बिंब में “मछलियाँ” निहित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: फिर
  rationale: यह क्रियाविशेषण क्रम में एक और दृष्टान्त प्रस्तुत करता है; ‘फिर’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: ὁμοία ἐστὶν
  choice: के समान है
  rationale: यह मत्ती के राज्य-सम्बन्धी दृष्टान्तों की तुलना-सूचक अभिव्यक्ति को सहज हिन्दी में बनाए रखता है।
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: मत्ती की विशिष्ट अभिव्यक्ति को ‘परमेश्वर का राज्य’ बनाकर नहीं समझाया गया; परिचित और अर्थ-संगत हिन्दी रूप रखा गया है।
- source_word: σαγήνῃ
  choice: एक बड़े जाल
  rationale: यह शब्द सामान्य जाल से अधिक विशेष रूप से बड़े, खींचकर मछलियाँ पकड़ने वाले जाल को दर्शाता है। मुख्य पाठ में सहजता के लिए ‘बड़ा जाल’ और पादटिप्पणी में उसकी विशेषता दी गई है।
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: जो समुद्र में डाला गया
  rationale: निष्क्रिय कृदन्त और ‘समुद्र में’ के स्रोत-पाठीय रूप को स्वाभाविक हिन्दी सम्बन्धवाचक उपवाक्य में व्यक्त किया गया है।
- source_word: ἐκ παντὸς γένους συναγαγούσῃ
  choice: हर प्रकार की मछलियाँ समेट लाया
  rationale: ‘समेट लाया’ जाल के द्वारा विविध प्रकार को एकत्र करने की क्रिया और परिणाम दोनों को स्वाभाविक हिन्दी में व्यक्त करता है। ‘मछलियाँ’ यूनानी में अनुक्त है, पर मछली पकड़ने के बिंब से स्पष्टतः निहित है; इसे पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: ‘स्वर्ग का राज्य’ का अर्थ
  choice: मत्ती की अभिव्यक्ति ‘स्वर्ग का राज्य’ को यथावत रखना
  alternative: ‘परमेश्वर का राज्य’ या ‘स्वर्ग का शासन’
  rationale: स्रोत में प्रयुक्त विशिष्ट मत्तीय पदावली को किसी धर्मवैज्ञानिक व्याख्या से प्रतिस्थापित नहीं किया गया है।
- issue: जाल में समेटे गए विविध प्रकार
  choice: सन्दर्भ से निहित ‘मछलियाँ’ को मुख्य पाठ में स्पष्ट करना
  alternative: अनुक्त कर्म को बनाए रखते हुए ‘हर प्रकार में से समेटता है’ कहना
  rationale: मछली पकड़ने का बिंब निहित कर्म को स्पष्ट करता है। इसे ‘लोगों’ या किसी विशिष्ट समूह के रूप में नहीं समझाया गया, इसलिए दृष्टान्त की धर्मवैज्ञानिक व्याख्या खुली रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की दृष्टान्तात्मक तुलना और स्रोत की ‘समुद्र’ शब्दावली सुरक्षित है; तकनीकी ‘महाजाल’ के बजाय स्पष्ट ‘बड़ा जाल’ चुना गया है।
