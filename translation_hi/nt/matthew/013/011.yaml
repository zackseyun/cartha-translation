id: MAT.13.11
reference: Matthew 13:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: hi
  text: उसने उन्हें उत्तर दिया, “तुम्हें यह दिया गया है[b] कि तुम स्वर्ग के राज्य के रहस्यों[a] को जानो, पर उन्हें यह नहीं दिया गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भेदों।”
    reason: lexical_alternative
  - marker: b
    text: “दिया गया है” में देने वाले का नाम नहीं बताया गया है; आशय है कि यह ज्ञान परमेश्वर की ओर से प्रदान किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: उत्तर दिया
  rationale: यह कृदंत और मुख्य क्रिया का सामान्य यूनानी प्रयोग है, जिसका स्वाभाविक हिन्दी अर्थ केवल ‘उत्तर दिया’ है; ‘उत्तर देकर कहा’ अनावश्यक रूप से शब्दशः होता।
- source_word: Ὅτι
  choice: प्रत्यक्ष कथन में अलग से अनूदित नहीं
  rationale: यहाँ ὅτι उत्तर की विषय-वस्तु आरम्भ करता है। हिन्दी में उद्धरण के बाद कथन सीधे आरम्भ करना स्वाभाविक है; ‘कि’ जोड़ने पर वाक्य असहज होता और ‘क्योंकि’ संदर्भ की व्याख्या को अधिक निश्चित कर देता।
- source_word: ὑμῖν … ἐκείνοις
  choice: तुम्हें … उन्हें
  rationale: दोनों सम्प्रदान रूप प्राप्तकर्ताओं के बीच स्पष्ट विरोध दिखाते हैं। ‘उन्हें’ आधुनिक हिन्दी में स्वाभाविक है और ἐκείνοις के विरोधात्मक संकेत को संदर्भ से बनाए रखता है।
- source_word: δέδοται … οὐ δέδοται
  choice: दिया गया है … नहीं दिया गया है
  rationale: पूर्ण निष्क्रिय रूप के वर्तमान परिणाम और दोनों खंडों की समानांतर रचना को सुरक्षित रखा गया है; देने वाले का नाम मूल पाठ की तरह अप्रकट है।
- source_word: γνῶναι
  choice: जानो
  rationale: γινώσκω का मूल अर्थ ‘जानना’ है। ‘समझो’ सम्भव है, पर वह अर्थ को व्याख्यात्मक रूप से संकरा कर सकता है।
- source_word: τὰ μυστήρια
  choice: रहस्यों
  rationale: यह उन ईश्वरीय वास्तविकताओं को सूचित करता है जो छिपी थीं और अब प्रकट की जाती हैं। ‘रहस्य’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है; ‘भेद’ एक मान्य विकल्प है।
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: स्वर्ग के राज्य के
  rationale: मत्ती के इस विशिष्ट पदबंध का स्वाभाविक और प्रचलित हिन्दी रूप है; यूनानी बहुवचन ‘आकाशों’ को शब्दशः रखने से हिन्दी में आशय धुँधला हो सकता है।
theological_decisions:
- issue: ‘दिया गया है’ में देने वाला अप्रकट है
  choice: निष्क्रिय वाक्य रखा और परमेश्वर का नाम नहीं जोड़ा
  alternative: परमेश्वर ने तुम्हें दिया है
  rationale: यूनानी मूल में कर्ता अप्रकट है। सम्भावित ईश्वरीय कर्ता को स्पष्ट रूप से जोड़ना मूल की धार्मिक सूक्ष्मता और तनाव को हल कर देता।
- issue: μυστήρια का राज्य-संबंधी अर्थ
  choice: रहस्य
  alternative: भेद; छिपी हुई सच्चाइयाँ
  rationale: ‘रहस्य’ प्रकाशित की जाने वाली छिपी ईश्वरीय वास्तविकताओं की व्यापक धारणा बनाए रखता है; व्याख्यात्मक विस्तार को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘तुम्हें यह दिया गया है कि तुम… जानो’ हिन्दी में कुछ औपचारिक है, पर यह मूल के निष्क्रिय रूप, ‘जानना’ क्रिया और अप्रकट कर्ता—तीनों को बिना अतिरिक्त अर्थ जोड़े सुरक्षित रखता है।
