  text: इसलिए तुम बोनेवाले का दृष्टान्त सुनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: तुम
  rationale: यूनानी में सर्वनाम स्पष्ट और बलयुक्त है। हिंदी में व्यक्त कर्ता ‘तुम’ इस बल को स्वाभाविक ढंग से बनाए रखता है और बहुवचन संबोधन के रूप में भी उपयुक्त है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह कण पिछले कथन से निष्कर्ष अथवा संवाद-संबंध दिखाता है। यहाँ ‘इसलिए’ उस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀκούσατε
  choice: सुनो
  rationale: यह द्वितीय पुरुष बहुवचन का आज्ञार्थक रूप है। ‘सुनो’ क्रिया के मूल अर्थ और आज्ञा, दोनों को रखता है; ‘समझो’ कहना अर्थ की अनावश्यक व्याख्या होगी।
- source_word: παραβολὴν
  choice: दृष्टान्त
  rationale: सुसमाचारों के शिक्षण-संदर्भ में παραβολή के लिए ‘दृष्टान्त’ प्रचलित, गरिमापूर्ण और अर्थतः सटीक हिंदी शब्द है।
- source_word: τοῦ σπείραντος
  choice: बोनेवाले का
  rationale: संज्ञा के रूप में प्रयुक्त यूनानी एओरिस्ट कृदन्त का शाब्दिक भाव ‘उस व्यक्ति का जिसने बोया’ है। ‘बोनेवाले का’ हिंदी में संक्षिप्त और स्वाभाविक है तथा इसे अनावश्यक रूप से स्थायी उपाधि नहीं बनाता।
