id: MAT.13.48
reference: Matthew 13:48
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: hi
  text: जब वह भर गया, तो वे उसे खींचकर किनारे पर ले आए। फिर बैठकर उन्होंने अच्छी मछलियाँ बरतनों में इकट्ठी कीं[a], लेकिन सड़ी हुई मछलियाँ बाहर फेंक दीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पात्रों में।’ यूनानी शब्द सामान्य रूप से किसी बरतन या पात्र को दर्शाता है, आवश्यक नहीं कि वह टोकरी हो।
    reason: lexical_alternative
  - marker: b
    text: या ‘खराब मछलियाँ।’ यूनानी शब्द का अर्थ ‘सड़ी हुई,’ ‘खराब’ या अधिक सामान्य रूप से ‘बेकार’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ὅτε ἐπληρώθη
  choice: जब वह भर गया
  rationale: ἣν का संबंध पिछले पद के जाल से है; हिन्दी में पुल्लिंग सर्वनाम से उसी संदर्भ को स्वाभाविक रूप से बनाए रखा गया है। ἐπληρώθη के कर्मवाच्य भाव को ‘भर गया’ सहज हिन्दी में व्यक्त करता है।
- source_word: ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλόν
  choice: उसे खींचकर किनारे पर ले आए
  rationale: यह जाल को पानी से ऊपर खींचकर तट तक लाने की क्रिया बताता है। ‘किनारा’ αἰγιαλός को बिना रेतीले समुद्र-तट का अनावश्यक संकेत दिए व्यक्त करता है।
- source_word: καθίσαντες
  choice: फिर बैठकर
  rationale: कृदन्त को क्रमिक कथात्मक क्रिया के रूप में रखा गया है; ‘फिर’ यूनानी क्रियाओं के स्वाभाविक घटनाक्रम को हिन्दी में स्पष्ट करता है।
- source_word: συνέλεξαν τὰ καλὰ
  choice: अच्छी मछलियाँ ... इकट्ठी कीं
  rationale: τὰ καλὰ में संज्ञा निहित है; पिछले पद के मछली पकड़ने के प्रसंग के आधार पर ‘मछलियाँ’ जोड़ना संदर्भ स्पष्ट करता है, नई सूचना नहीं।
- source_word: εἰς ἄγγη
  choice: बरतनों में
  rationale: ἄγγη सामान्य पात्रों या बरतनों का शब्द है। ‘बरतन’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से व्यापक है; ‘टोकरियाँ’ अनावश्यक रूप से विशिष्ट होता।
- source_word: τὰ δὲ σαπρά
  choice: लेकिन सड़ी हुई मछलियाँ
  rationale: σαπρός का ठोस अर्थ ‘सड़ा हुआ’ है, पर इसका व्यापक अर्थ ‘खराब’ या ‘बेकार’ भी हो सकता है। मुख्य पाठ ठोस मछली-चित्र बनाए रखता है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἔξω ἔβαλον
  choice: बाहर फेंक दीं
  rationale: यह पदबंध अस्वीकार करके बाहर फेंकने की प्रबल, स्वाभाविक क्रिया व्यक्त करता है।
theological_decisions:
- issue: दृष्टान्त में छँटाई के चित्र की व्याख्या
  choice: पद को मछली पकड़ने और छाँटने के ठोस दृश्य के रूप में अनूदित किया गया है।
  alternative: ऐसी व्याख्यात्मक शब्दावली प्रयोग करना जो आगे आने वाले अन्तिम न्याय के अर्थ को इसी पद में स्पष्ट कर दे।
  rationale: इस पद में दृष्टान्त का दृश्य है; उसकी व्याख्या अगले पदों में आती है। इसलिए अनुवाद आगे की धर्मवैज्ञानिक व्याख्या को समय से पहले मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। छोटी वाक्य-इकाइयों से क्रम स्पष्ट होता है। ‘बरतन’ व्यापक और बोलचाल में समझ आने वाला है; पादटिप्पणियाँ वास्तविक शब्दार्थ-विकल्प सुरक्षित रखती हैं।
