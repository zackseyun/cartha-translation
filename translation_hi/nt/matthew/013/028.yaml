source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: hi
  text: उसने उनसे कहा, “एक शत्रु ने यह किया है।” तब दासों[a] ने उससे कहा, “तो क्या आप चाहते हैं कि हम जाकर उन्हें बटोर लें?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवकों”। यूनानी शब्द का अर्थ सन्दर्भ के अनुसार “दास” या “सेवक” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: कहा
  rationale: सामान्य कथात्मक संवाद में यह सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: किसी शत्रु
  rationale: यूनानी पदबंध शत्रु व्यक्ति को इंगित करता है; हिन्दी में ‘किसी शत्रु’ स्वाभाविक रूप से उसके अनिश्चित और व्यक्तिगत संदर्भ को बनाए रखता है।
- source_word: τοῦτο ἐποίησεν
  choice: यह ... का काम है
  rationale: शाब्दिक ‘यह किया’ की अपेक्षा यह मुहावरेदार हिन्दी है और उसी पिछले कृत्य को शत्रु के लिए उत्तरदायी ठहराती है।
- source_word: δοῦλοι
  choice: दासों
  rationale: कृषि-गृहस्थी की इस दृष्टान्त-कथा में यह स्वामी के अधीन बँधे आश्रितों की सामाजिक स्थिति को ‘सेवकों’ से अधिक स्पष्ट रखता है।
- source_word: Θέλεις
  choice: क्या आप चाहते हैं
  rationale: इच्छा अथवा सम्मति पूछने का स्पष्ट, आधुनिक और सम्मानसूचक हिन्दी रूप।
- source_word: οὖν
  choice: तो
  rationale: यह स्वामी के कथन से निकलने वाले अगले प्रस्ताव को स्वाभाविक संवादात्मक ढंग से जोड़ता है।
- source_word: ἀπελθόντες
  choice: जाकर
  rationale: पूर्वकालिक कृदन्त की क्रमिक क्रिया को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συλλέξωμεν
  choice: बटोर लें
  rationale: खेत में उगी अवांछित वनस्पतियों को इकट्ठा करने के संदर्भ में यह स्वाभाविक है; ‘लें’ प्रस्ताव/अनुमति का भाव बनाए रखता है।
- source_word: αὐτά
  choice: उन्हें
  rationale: नपुंसक बहुवचन सर्वनाम पूर्वसंदर्भ में आए जंगली पौधों को सूचित करता है; हिन्दी में बहुवचन ‘उन्हें’ स्वाभाविक है।
theological_decisions:
- issue: दृष्टान्त में δοῦλοι का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: ‘दास’ स्वामी के अधीन उनकी सामाजिक स्थिति को स्पष्ट रखता है। फिर भी इस संदर्भ में ‘सेवक’ सम्भव और हिन्दी बाइबल परम्परा में परिचित है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद में स्वामी के लिए सम्मानसूचक ‘आप’, और सहज कृषि-संदर्भ के लिए ‘बटोर लें’। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सरल रखी गई है।
