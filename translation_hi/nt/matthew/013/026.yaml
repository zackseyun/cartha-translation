source:
  edition: SBLGNT
  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: hi
  text: पर जब फसल उग आई और उसमें बालियाँ निकल आईं, तब खरपतवार भी दिखाई दिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तारेस’; संभवतः डार्नेल नामक एक खरपतवार।
    reason: ζιζάνια का सामान्य अर्थ ‘खरपतवार’ है; ‘तारेस’ पारंपरिक विकल्प है और डार्नेल एक संभावित, पर अनिश्चित, विशिष्ट पहचान है।
lexical_decisions:
- source_word: ὅτε δὲ
  choice: पर जब
  rationale: ὅτε समयसूचक उपवाक्य आरम्भ करता है और δέ पिछले प्रसंग से हल्का विरोध तथा कथा की प्रगति दिखाता है; इसलिए ‘पर जब’ स्वाभाविक है।
- source_word: ἐβλάστησεν ὁ χόρτος
  choice: पौधे उग आए
  rationale: βλαστάνω का अर्थ अंकुरित होकर निकलना है, और χόρτος यहाँ खेत में उग रही फसल को सामान्य रूप से दर्शाता है; ‘पौधे उग आए’ आधुनिक हिन्दी में सहज है।
- source_word: καρπὸν ἐποίησεν
  choice: उनमें बालियाँ लगने लगीं
  rationale: शाब्दिक अर्थ ‘फल उत्पन्न किया’ है, पर गेहूँ के खेत के संदर्भ में इसका आशय उपज/दाना बनने से है। ‘बालियाँ लगने लगीं’ उस अवस्था को स्वाभाविक कृषि-हिन्दी में व्यक्त करता है, जब गेहूँ और समान दिखने वाले जंगली पौधों का भेद स्पष्ट होने लगता है।
- source_word: τότε ἐφάνη
  choice: तब ... दिखाई दिए
  rationale: τότε घटनाक्रम का अगला समय बताता है और ἐφάνη का अर्थ प्रकट या दृष्टिगोचर होना है।
- source_word: καὶ τὰ ζιζάνια
  choice: जंगली पौधे भी
  rationale: καί का यहाँ अर्थ ‘भी’ है। ζιζάνια खेत में उगने वाले हानिकारक पौधों के लिए प्रयुक्त है और संभवतः गेहूँ जैसा दिखने वाला डार्नेल है; मुख्य पाठ में सरल सामान्य अभिव्यक्ति रखी गई है।
theological_decisions:
- issue: ζιζάνια की विशिष्ट वनस्पति-पहचान
  choice: मुख्य पाठ में ‘जंगली पौधे’
  alternative: ‘जंगली घास’ अथवा विशेष रूप से ‘डार्नेल’
  rationale: यूनानी शब्द किसी हानिकारक खरपतवार, संभवतः डार्नेल, को सूचित करता है; पर पद उसकी निश्चित वनस्पति-पहचान स्थापित नहीं करता। सामान्य अनुवाद मूल की अनिश्चितता बनाए रखता है और विशिष्ट संभावना टिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बालियाँ लगने लगीं’ कृषि-संदर्भ को स्पष्ट करता है; ‘जंगली पौधे’ बोलचाल के अत्यधिक अनौपचारिकपन से बचते हुए ζιζάνια की अनिश्चितता बनाए रखता है।
