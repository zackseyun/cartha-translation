source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: hi
  text: और वे उन्हें आग की भट्ठी में फेंक देंगे। वहाँ रोना और दाँत पीसना होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαλοῦσιν
  choice: फेंक देंगे
  rationale: भविष्यत् काल के सक्रिय क्रिया-रूप का बल बनाए रखता है और जबरन डालने की क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κάμινον τοῦ πυρός
  choice: आग की भट्ठी
  rationale: यूनानी संबंधकारक संरचना को स्पष्ट और स्वाभाविक हिन्दी में रखते हुए न्याय की ठोस अग्निमय उपमा को सुरक्षित रखता है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: अभी बताई गई भट्ठी की ओर संकेत करने वाले स्थानवाचक अर्थ का सीधा और स्वाभाविक अनुवाद है।
- source_word: κλαυθμός
  choice: रोना
  rationale: शोक और पीड़ा की अभिव्यक्ति को बिना अनावश्यक तीव्रता जोड़े सामान्य, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: दाँत पीसना
  rationale: यूनानी मुहावरे का प्रचलित हिन्दी रूप है और उसकी पीड़ा, व्याकुलता या रोष की संभावित व्यापकता को संकुचित नहीं करता।
- source_word: καὶ
  choice: और
  rationale: पिछले वाक्य से पद की निरंतरता दिखाने वाला सरल संयोजक सुरक्षित रखा गया है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: पूर्ववर्ती समूह की ओर संकेत करने वाले कर्मकारक बहुवचन सर्वनाम का सीधा अनुवाद है।
theological_decisions:
- issue: ‘आग की भट्ठी’ में न्याय का स्वरूप
  choice: अंतिम न्याय की ठोस उपमा को ज्यों का त्यों बनाए रखना
  alternative: इसे व्याख्यात्मक रूप से ‘नरक की आग’ कहना या उपमा को नरम करना
  rationale: मूल पाठ भट्ठी और आग की सजीव छवि देता है; अनुवाद बाद की धर्मवैज्ञानिक शब्दावली जोड़ने या उसकी कठोरता घटाने के बजाय उसी छवि को सुरक्षित रखता है।
- issue: ‘रोना और दाँत पीसना’ का भाव
  choice: मत्ती के विशिष्ट पीड़ा और न्याय-सूचक वाक्यांश को व्यापक अर्थ सहित बनाए रखना
  alternative: दाँत पीसने को केवल क्रोध या पूरे वाक्यांश को केवल शोक के अर्थ में स्पष्ट करना
  rationale: यह अभिव्यक्ति गहरी यातना और संकट बताती है, जिसमें शोक और रोष दोनों की छाया हो सकती है; अनुवाद अर्थ को किसी एक भाव तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पठन में स्वाभाविक है। ‘आग की भट्ठी’ मूल यूनानी संरचना के निकट रहते हुए सामान्य पाठक के लिए स्पष्ट है।
