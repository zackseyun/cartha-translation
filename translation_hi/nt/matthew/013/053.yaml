translation:
  language: hi
  text: जब यीशु ये दृष्टान्त सुना चुके, तो वे वहाँ से चले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: जब
  rationale: यह यूनानी कथात्मक मुहावरा अगले घटनाक्रम की ओर ले जाते हुए समय-संबंध व्यक्त करता है। आधुनिक हिन्दी में केवल ‘जब’ स्वाभाविक है; ‘और ऐसा हुआ कि जब’ अनावश्यक रूप से बोझिल होगा।
- source_word: ἐτέλεσεν
  choice: सुना चुके
  rationale: τελέω यहाँ इन दृष्टान्तों के कहने या सुनाने को पूरा करने का अर्थ देता है। ‘सुना चुके’ हिन्दी में पूर्वसमाप्त क्रिया और शिक्षण-संदर्भ दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: παραβολὰς ταύτας
  choice: ये दृष्टान्त
  rationale: ‘दृष्टान्त’ παραβολή का प्रचलित और विधागत हिन्दी समतुल्य है, और ‘ये’ तत्काल पूर्ववर्ती दृष्टान्तों की ओर संकेत करता है।
- source_word: μετῆρεν
  choice: चले गए
  rationale: क्रिया का अर्थ उस स्थान से प्रस्थान करना है। ‘चले गए’ आधुनिक हिन्दी में सहज है और यात्रा की रीति या गंतव्य को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐκεῖθεν
  choice: वहाँ से
  rationale: यह स्थानवाचक क्रियाविशेषण स्रोत-स्थान को स्पष्ट रूप से बताता है।
