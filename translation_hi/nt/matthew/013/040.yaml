  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: hi
  text: इसलिए, जैसे खरपतवार[a] इकट्ठे किए जाते हैं और आग में जलाए जाते हैं, वैसे ही युग के अंत[b] में होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द हानिकारक जंगली पौधों के लिए है, संभवतः डार्नेल नामक पौधा। परंपरागत अनुवादों में इसके लिए अन्य नाम भी मिलते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “संसार के अंत में”; यूनानी में शाब्दिक अर्थ “युग के अंत में” है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: इसलिए जैसे
  rationale: ὥσπερ तुलना को व्यक्त करता है और οὖν पिछले कथन से निष्कर्ष अथवा आगे की तार्किक कड़ी जोड़ता है; यह अनुवाद दोनों भावों को बनाए रखता है।
- source_word: συλλέγεται
  choice: इकट्ठे किए जाते
  rationale: यह वर्तमानकालिक कर्मवाच्य रूप है। यूनानी में नपुंसकलिंग बहुवचन कर्ता के साथ क्रिया एकवचन है, पर स्वाभाविक हिन्दी में बहुवचन प्रयोग उचित है।
- source_word: τὰ ζιζάνια
  choice: खरपतवार
  rationale: ζιζάνια हानिकारक जंगली पौधों, संभवतः डार्नेल, को सूचित करता है। ‘खरपतवार’ आधुनिक, स्पष्ट और कृषि-संदर्भ के अनुकूल है।
- source_word: πυρὶ καίεται
  choice: आग में जला दिए जाते हैं
  rationale: यह स्पष्ट रूप से आग द्वारा जलाए जाने का चित्र प्रस्तुत करता है। हिन्दी में ‘आग में जला दिए जाते हैं’ स्वाभाविक है और मूल क्रिया καίω से अधिक अर्थ नहीं जोड़ता।
- source_word: οὕτως ἔσται
  choice: वैसे ही … होगा
  rationale: यह पहले बताए दृश्य और भविष्य में होने वाली घटना के बीच सीधी समानता स्थापित करता है तथा ἔσται के भविष्यकाल को सुरक्षित रखता है।
- source_word: ἐν τῇ συντελείᾳ
  choice: अंत में
  rationale: συντέλεια किसी अवधि की पूर्णता या परिणति को दर्शाता है। ‘अंत में’ सहज हिन्दी है और इस युगान्तकारी संदर्भ को स्पष्ट रखता है।
- source_word: τοῦ αἰῶνος
  choice: युग के
  rationale: αἰών का मूल भाव कालखंड या युग है, न कि अनिवार्य रूप से भौतिक संसार। ‘युग’ उस कालगत अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: ἐν τῇ συντελείᾳ τοῦ αἰῶνος का युगान्तकारी अर्थ
  choice: युग के अंत में
  alternative: संसार के अंत में
  rationale: मूल शब्द αἰών कालगत ‘युग’ को दर्शाता है। ‘संसार’ कहने से अर्थ भौतिक जगत के विनाश की ओर अनावश्यक रूप से सीमित हो सकता है; ‘युग’ मूल की व्यापकता और धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। वाक्य में दृष्टान्त की तुलना, कर्मवाच्य संरचना और भविष्यकाल सुरक्षित हैं। पादटिप्पणी चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
