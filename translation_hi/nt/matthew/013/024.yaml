  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: hi
  text: उसने उनके सामने एक और दृष्टान्त रखा और कहा, “स्वर्ग का राज्य एक ऐसे मनुष्य के समान है[a] जिसने अपने खेत में अच्छा बीज बोया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “स्वर्ग के राज्य की तुलना एक ऐसे मनुष्य से की गई जिसने अपने खेत में अच्छा बीज बोया।” यहाँ यूनानी क्रिया दृष्टान्त की तुलना आरम्भ करने का सूत्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: एक और दृष्टान्त
  rationale: यह पदबंध क्रम में एक अतिरिक्त दृष्टान्त का परिचय देता है; ‘एक और दृष्टान्त’ स्वाभाविक हिन्दी है।
- source_word: παρέθηκεν αὐτοῖς
  choice: उनके सामने रखा
  rationale: παρατίθημι में किसी बात को सामने रखने या प्रस्तुत करने का भाव है; यह अनुवाद मूल रूपक को सहज हिन्दी में बनाए रखता है।
- source_word: λέγων
  choice: और कहा
  rationale: यूनानी कृदन्त को हिन्दी कथात्मक शैली में संयुक्त क्रिया के रूप में व्यक्त करना अधिक स्वाभाविक है।
- source_word: Ὡμοιώθη
  choice: के समान है
  rationale: मत्ती के दृष्टान्त-सूत्र में यह तुलना आरम्भ करता है। ‘के समान है’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है, जबकि यूनानी निष्क्रिय क्रिया का अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: यह मत्ती का विशिष्ट पदबंध है; हिन्दी में ‘स्वर्ग का राज्य’ प्रचलित और अर्थ-संगत रूप है।
- source_word: ἀνθρώπῳ
  choice: उस मनुष्य
  rationale: दृष्टान्त में एक पुरुष पात्र का संकेत है; ‘उस मनुष्य’ तुलना की संरचना को स्पष्ट करता है।
- source_word: σπείραντι καλὸν σπέρμα
  choice: जिसने ... अच्छा बीज बोया
  rationale: कृदन्त को सम्बन्धवाचक उपवाक्य में व्यक्त करने से पूर्ण हुई बुवाई की क्रिया और बीज की अच्छी गुणवत्ता दोनों स्पष्ट रहती हैं।
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: अपने खेत में
  rationale: αὐτοῦ खेत का सम्बन्ध उसी मनुष्य से बताता है; हिन्दी में कर्ता की अपनी वस्तु के लिए ‘अपने’ स्वाभाविक है।
theological_decisions:
- issue: मत्ती के राज्य-सूत्र का अनुवाद
  choice: स्वर्ग का राज्य
  alternative: स्वर्गों का राज्य
  rationale: यूनानी में ‘स्वर्गों’ बहुवचन है, पर हिन्दी में ‘स्वर्ग का राज्य’ उस पदबंध का स्वाभाविक रूप है और परमेश्वर के शासन की मत्तीगत धारणा को बिना अतिरिक्त व्याख्या के रखता है।
- issue: Ὡμοιώθη की तुलना-सूचक शक्ति
  choice: के समान है
  alternative: के समान किया गया
  rationale: निष्क्रिय अओरिस्ट का शाब्दिक रूप हिन्दी में कृत्रिम और सम्भवतः भ्रामक लगेगा। मुख्य पाठ में दृष्टान्त-सूत्र का स्वाभाविक अर्थ रखा गया है और रूपगत विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘दृष्टान्त’, ‘स्वर्ग का राज्य’ और ‘अच्छा बीज’ जैसे परिचित बाइबलीय पदों को बनाए रखते हुए वाक्य-विन्यास को स्वाभाविक रखा गया है।
