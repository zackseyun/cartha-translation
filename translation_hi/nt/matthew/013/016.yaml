base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: hi
  text: परन्तु तुम्हारी आँखें धन्य हैं, क्योंकि वे देखती हैं, और तुम्हारे कान धन्य हैं, क्योंकि वे सुनते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: परन्तु
  rationale: पिछले कथन के विपरीत शिष्यों की स्थिति दिखाता है; ‘परन्तु’ इस विरोध को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: μακάριοι
  choice: धन्य हैं
  rationale: यह केवल मन की प्रसन्नता नहीं, बल्कि परमेश्वर की कृपा और अनुकूल स्थिति का भाव रखता है; धन्य-वचनों के संदर्भ में यह स्वाभाविक हिन्दी शब्द है।
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: तुम्हारी आँखें
  rationale: यूनानी संबंधवाचक रचना का स्वाभाविक हिन्दी रूप, जो शिष्यों की अपनी आँखों पर बल बनाए रखता है।
- source_word: ὅτι βλέπουσιν
  choice: क्योंकि वे देखती हैं
  rationale: ὅτι को यहाँ कारणसूचक समझना संदर्भानुकूल है; ‘देखती हैं’ मूल के सीधे इंद्रिय-बोध वाले क्रिया-रूप को सुरक्षित रखता है।
- source_word: τὰ ὦτα ὑμῶν
  choice: तुम्हारे कान भी
  rationale: ‘भी’ पहले खंड के समानांतर निहित ‘धन्य हैं’ को स्वाभाविक हिन्दी में जोड़ता है, बिना नया अर्थ जोड़े।
- source_word: ὅτι ἀκούουσιν
  choice: क्योंकि वे सुनते हैं
  rationale: कारणसूचक संबंध और ‘देखती हैं/सुनते हैं’ का मूल समानांतरपन बनाए रखता है।
- source_word: βλέπουσιν / ἀκούουσιν
  choice: देखती हैं / सुनते हैं
  rationale: शाब्दिक इंद्रिय-बोध की भाषा को बनाए रखा गया है; ‘समझती’ या ‘ग्रहण करते’ जोड़कर आध्यात्मिक अर्थ को अनावश्यक रूप से स्पष्ट नहीं किया गया।
theological_decisions:
- issue: देखने और सुनने को अनुवाद में स्पष्ट रूप से आध्यात्मिक समझ बनाना या न बनाना
  choice: सीधे इंद्रिय-बोध वाले शब्द ‘देखती हैं’ और ‘सुनते हैं’ बनाए रखना
  alternative: ‘पहचानती हैं’ और ‘समझते हैं’ जैसे व्याख्यात्मक शब्द रखना
  rationale: आस-पास का संदर्भ गहरी आत्मिक ग्रहणशीलता का संकेत देता है, पर इस पद में मूल पाठ केवल देखने और सुनने की बात करता है। सीधी भाषा रखने से मूल की धर्मवैचारिक तनाव और संदर्भगत गहराई दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और बोलचाल में बोधगम्य रूप अपनाया गया है। दूसरे खंड में ‘धन्य हैं’ की पुनरावृत्ति के बजाय ‘भी’ से यूनानी में निहित समानांतरता स्वाभाविक ढंग से व्यक्त की गई है।
