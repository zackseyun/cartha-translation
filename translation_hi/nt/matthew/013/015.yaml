id: MAT.13.15
reference: Matthew 13:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: hi
  text: क्योंकि इस प्रजा का हृदय कुंठित हो गया है, वे कानों से कठिनाई से सुनते हैं[a], और उन्होंने अपनी आँखें मूँद ली हैं, कहीं ऐसा न हो कि वे आँखों से देखें, कानों से सुनें, हृदय से समझें और लौट आएँ[b][c], और मैं उन्हें चंगा करूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्होंने भारी ढंग से सुना।”
    reason: lexical_alternative
  - marker: b
    text: या “मुड़ें” अथवा “लौटें।”
    reason: lexical_alternative
  - marker: c
    text: यह यशायाह 6:9–10 से उद्धृत है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: सुन्न हो गया है
  rationale: मूल अर्थ ‘मोटा/भारी हो जाना’ है, पर हृदय के साथ यह संवेदनहीनता और समझ की मंदता का मुहावरा है। ‘सुन्न’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: καρδία
  choice: हृदय
  rationale: यहाँ भीतरी मनुष्य, विशेषकर समझ और प्रवृत्ति के केंद्र का बोध है; आगे ‘हृदय से समझें’ इसी प्रयोग को स्पष्ट करता है।
- source_word: λαοῦ τούτου
  choice: इस प्रजा का
  rationale: सम्बन्धवाचक रचना और संकेतवाचक बल, दोनों सुरक्षित रहते हैं। ‘प्रजा’ भविष्यद्वाणी के उद्धरण के अनुरूप dignified तथा सामान्यतः बोधगम्य है।
- source_word: βαρέως ἤκουσαν
  choice: कानों से कठिनाई से सुनते हैं
  rationale: शाब्दिक रूप से ‘भारी ढंग से सुना’; हिन्दी में ‘कठिनाई से सुनते हैं’ श्रवण की जड़ता को स्पष्ट करता है, बिना उसे केवल शारीरिक बहरापन बनाए।
- source_word: ἐκάμμυσαν
  choice: अपनी आँखें मूँद ली हैं
  rationale: सक्रिय क्रिया लोगों की अपनी कार्रवाई को बनाए रखती है; ‘मूँद ली हैं’ पूर्ण कार्रवाई और उसके वर्तमान परिणाम दोनों व्यक्त करता है।
- source_word: μήποτε
  choice: कहीं ऐसा न हो कि
  rationale: नकारात्मक प्रयोजन/परिणाम की सतही शक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है और न्याय तथा मानवीय उत्तरदायित्व के तनाव को हल नहीं करता।
- source_word: ἐπιστρέψωσιν
  choice: लौट आएँ
  rationale: दिशात्मक अर्थ ‘मुड़ना/लौटना’ बना रहता है और ‘धर्म-परिवर्तन’ जैसी बाद की संस्थागत शब्दावली नहीं आती।
- source_word: ἰάσομαι
  choice: मैं उन्हें चंगा करूँ
  rationale: μήποτε से आरम्भ आशंकात्मक वाक्य-क्रम के भीतर हिन्दी में संभावित परिणति को स्वाभाविक रूप से व्यक्त करता है; यूनानी रूप भविष्यकालीन है, जिसका अधिक रूपनिष्ठ विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: न्यायात्मक प्रयोजन और मानवीय उत्तरदायित्व के बीच तनाव
  choice: कहीं ऐसा न हो कि वे ... लौट आएँ, और मैं उन्हें चंगा करूँ
  alternative: नहीं तो वे ... लौट आएँगे, और मैं उन्हें चंगा करूँगा
  rationale: μήποτε को प्रयोजन/आशंका की रचना के रूप में रखा गया है और लोगों द्वारा अपनी आँखें मूँदने की सक्रिय भूमिका भी सुरक्षित है। इससे ईश्वरीय न्याय और मानवीय उत्तरदायित्व में से किसी एक को व्याख्यात्मक रूप से प्रधान नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘हृदय’, ‘प्रजा’ और ‘चंगा’ बाइबिलीय संदर्भ में परिचित हैं; वाक्य की पुनरावृत्तिमूलक लय मूल उद्धरण के अनुरूप सुरक्षित रखी गई है।
