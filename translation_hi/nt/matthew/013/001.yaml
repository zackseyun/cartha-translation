source:
  edition: SBLGNT
  text: ⸀Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐξελθὼν ὁ Ἰησοῦς ⸀τῆς οἰκίας ἐκάθητο παρὰ τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: hi
  text: उस दिन[a] यीशु घर से बाहर निकलकर समुद्र के पास[b] बैठा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसी दिन,” यदि इस पदबंध को केवल समय बताने के बजाय पिछले प्रसंग की निरंतरता पर बल देने वाला समझा जाए।
    reason: alternative_reading
  - marker: b
    text: या, “समुद्र के किनारे।” यूनानी पदबंध समुद्र के निकट स्थान बताता है, पर तटरेखा से ठीक कितनी दूरी थी, यह निश्चित नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: उस दिन
  rationale: यह यूनानी कालवाचक पदबंध का स्वाभाविक और सटीक आधुनिक हिन्दी रूप है। इससे पूर्ववर्ती प्रसंग के साथ संबंध बना रहता है, पर यूनानी में स्पष्ट रूप से न पाए जाने वाले ‘उसी’ के बल को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἐξελθὼν ... τῆς οἰκίας
  choice: घर से बाहर निकलकर
  rationale: क्रियाविशेषणीय एओरिस्ट कृदंत और निर्गमन-स्थान बताने वाले संबंधकारक को हिन्दी में संयुक्त रूप से व्यक्त किया गया है। ‘निकलकर’ मुख्य क्रिया से पहले की क्रिया को स्वाभाविक ढंग से दर्शाता है।
- source_word: ἐκάθητο
  choice: बैठा था
  rationale: अपूर्णकालिक रूप की जारी, दृश्य-स्थापक अवस्था को ‘बैठा था’ सुरक्षित रखता है; ‘बैठ गया’ आरंभिकता का ऐसा अर्थ जोड़ सकता है जो रूप में अनिवार्य नहीं है।
- source_word: παρὰ τὴν θάλασσαν
  choice: समुद्र के पास
  rationale: παρά के साथ कर्मकारक यहाँ समुद्र के निकट स्थिति बताता है। ‘के पास’ दूरी को अनावश्यक रूप से निश्चित किए बिना यह अर्थ देता है; ‘किनारे’ तटरेखा पर होने को कुछ अधिक विशिष्ट बना सकता है।
- source_word: ὁ Ἰησοῦς
  choice: यीशु
  rationale: व्यक्तिनाम को प्रचलित मानक हिन्दी बाइबलीय वर्तनी में लिप्यंतरित किया गया है।
