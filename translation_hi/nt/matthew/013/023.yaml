- from: पर जो अच्छी मिट्टी[a] पर बोया गया, वह वह व्यक्ति है जो वचन को सुनता और समझता है। वह सचमुच फल लाता और उपज देता है—कोई सौ गुना, कोई साठ गुना और कोई तीस गुना।[b]
  to: और जो अच्छी मिट्टी[a] पर बोया गया, वह उस व्यक्ति को दर्शाता है जो वचन को सुनता और समझता है, और सचमुच फल देता और उपज देता है—कोई सौ, कोई साठ और कोई तीस।[b]
