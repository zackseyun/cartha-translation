review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the good-soil hearer, hearing and understanding the word, and the varying yields. However, adding “गुना” in the main text supplies “fold,” which is not expressed in the Greek distributive construction (ὃ μὲν ... ὃ δὲ ...). The contextual sense is yield, but the numerical expression should remain unexpanded in the main text, as reflected by the audit trail.
  naturalness: The register is generally clear and modern. “वह वह व्यक्ति है” is unnecessarily repetitive and less natural than “वह उस व्यक्ति को दर्शाता है.” “फल लाता” is understandable but less idiomatic in this context than “फल देता.”
  terminology: “अच्छी मिट्टी,” “वचन,” and “उपज” suit the agricultural metaphor and preserve the established Gospel idiom. The alternative “अच्छी भूमि” is appropriately retained in the footnote. No doctrinal interpretation has been introduced.
  issues:
  - severity: medium
    issue: The main text adds “गुना” to each yield number.
    rationale: The Greek reads literally “one a hundred, one sixty, one thirty”; while crop yield is clearly in view, “fold” is not explicit. The main text should preserve this, with the contextual explanation in the footnote.
  - severity: low
    issue: “वह वह व्यक्ति है” is stylistically repetitive.
    rationale: The Greek’s demonstrative identification can be rendered naturally in Hindi without duplication, while retaining the parable’s movement from the sown seed to the person represented.
  - severity: low
    issue: “फल लाता” is somewhat less idiomatic than “फल देता.”
    rationale: “फल देता” is a natural modern Hindi rendering of καρποφορεῖ and retains the metaphor.
  revised_text: और जो अच्छी मिट्टी[a] पर बोया गया, वह उस व्यक्ति को दर्शाता है जो वचन को सुनता और समझता है, और सचमुच फल देता और उपज देता है—कोई सौ, कोई साठ और कोई तीस।[b]
