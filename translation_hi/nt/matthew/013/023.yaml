id: MAT.13.23
reference: Matthew 13:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: hi
  text: और जो अच्छी मिट्टी[a] पर बोया गया, वह उस व्यक्ति को दर्शाता है जो वचन को सुनता और समझता है, और सचमुच फल देता और उपज देता है—कोई सौ, कोई साठ और कोई तीस।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अच्छी भूमि पर।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “कोई सौ, कोई साठ और कोई तीस”; अर्थात फसल की उपज अलग-अलग मात्रा में होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: अच्छी मिट्टी पर
  rationale: खेती के इस दृष्टांत में γῆ के लिए ‘मिट्टी’ बीज को ग्रहण करने वाली भूमि को स्वाभाविक रूप से व्यक्त करता है। ‘अच्छी’ मूल विशेषण καλὴν को बनाए रखता है; ‘उपजाऊ’ अर्थ को अधिक स्पष्ट करता, पर मूल से अधिक व्याख्यात्मक होता।
- source_word: σπαρείς
  choice: बोया गया
  rationale: भूतकालिक कर्मवाच्य कृदंत का अर्थ सुरक्षित रहता है और दृष्टांत में बीज तथा उससे निरूपित व्यक्ति के बीच का रूपक बना रहता है।
- source_word: ὁ τὸν λόγον ἀκούων
  choice: जो वचन को सुनता
  rationale: वर्तमान कृदंत यहाँ व्यक्ति की विशेषतापूर्ण क्रिया बताता है। ‘वचन’ सुसमाचार-संबंधी अभिव्यक्ति और पाठ के अंतर्पाठीय संबंध को सुरक्षित रखता है।
- source_word: συνιείς
  choice: समझता है
  rationale: συνίημι सुने हुए वचन का अर्थ समझने या ग्रहण करने को दर्शाता है। हिंदी में कर्म पिछले पद ‘वचन’ से स्पष्ट है, इसलिए अलग से ‘उसे’ आवश्यक नहीं।
- source_word: δὴ
  choice: सचमुच
  rationale: δή के बलाघात को सहज और गरिमापूर्ण हिंदी में हल्के रूप से व्यक्त करता है।
- source_word: καρποφορεῖ
  choice: फल लाता
  rationale: मूल कृषि-रूपक और शिष्यत्व-संबंधी अर्थ दोनों को बनाए रखने वाली स्वाभाविक हिंदी अभिव्यक्ति है।
- source_word: ποιεῖ
  choice: उपज देता है
  rationale: यहाँ ποιέω फसल या पैदावार उत्पन्न करने के अर्थ में है। इसे καρποφορεῖ से अलग क्रिया के रूप में रखकर यूनानी पाठ की दोहरी अभिव्यक्ति सुरक्षित की गई है।
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: कोई सौ गुना, कोई साठ गुना और कोई तीस गुना
  rationale: वितरणसूचक रचना अलग-अलग मात्रा की उपज दिखाती है। ‘गुना’ यूनानी में स्पष्ट शब्द के रूप में नहीं है, पर हिंदी में अपेक्षित फसल-अनुपात को स्वाभाविक और स्पष्ट बनाता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: वचन के प्रति प्रतिक्रिया का स्वरूप
  choice: अच्छी मिट्टी से निरूपित व्यक्ति वचन सुनता, समझता और अलग-अलग मात्रा में फल लाता है।
  alternative: अनुवाद में धीरज, सच्चा परिवर्तन या उद्धार की निश्चितता को स्पष्ट रूप से जोड़ा जा सकता था।
  rationale: यूनानी पाठ सुनने, समझने और फल लाने पर बल देता है, पर बाद की धर्मसैद्धांतिक श्रेणियों को स्पष्ट रूप से नहीं बताता। इसलिए अनुवाद पाठ की अपनी श्रेणियों तक सीमित रहता है।
- issue: बीज और व्यक्ति के बीच रूपक की व्याकरणिक पहचान
  choice: ‘जो ... बोया गया’ के बाद ‘वह वह व्यक्ति है’ कहकर रूपक का आशय स्पष्ट किया गया है।
  alternative: पूरी पंक्ति को केवल बीज या केवल व्यक्ति के विषय में पुनर्गठित किया जा सकता था।
  rationale: मूल में बोए गए तत्व और उससे निरूपित सुनने वाले व्यक्ति का निकट रूपकीय संबंध है। हिंदी रूप अर्थ स्पष्ट करती है, पर दोनों को धर्मसैद्धांतिक रूप से एकरूप नहीं ठहराती।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘मिट्टी’, ‘वचन’, ‘फल लाता’ और ‘उपज देता’ कृषि-रूपक को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध स्थानों पर दिए गए हैं।
