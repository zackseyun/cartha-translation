source:
  edition: SBLGNT
  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: hi
  text: यीशु ने ये सारी बातें भीड़ से दृष्टान्तों में कहीं[a], और दृष्टान्त के बिना वह उनसे कुछ नहीं कहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दृष्टान्त के बिना उन्होंने उनसे कुछ नहीं कहा।” यूनानी अपूर्ण भूतकाल का अनुवाद अभ्यस्त भूतकाल या साधारण भूतकाल के रूप में किया जा सकता है।
    reason: The note preserves the legitimate aspectual alternative for ἐλάλει without displacing the main text’s natural habitual rendering.
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: ये सारी बातें
  rationale: प्रदर्शक सर्वनाम और समग्रता—दोनों को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ἐλάλησεν
  choice: कहीं
  rationale: एकवचन एओरिस्ट क्रिया पूरे कथन-क्रम का सार प्रस्तुत करती है; हिन्दी में ‘बातें ... कहीं’ स्वाभाविक है।
- source_word: ἐν παραβολαῖς
  choice: दृष्टान्तों में
  rationale: ἐν यहाँ रीति अथवा माध्यम व्यक्त करता है; बहुवचन को बनाए रखते हुए यह परिचित और गरिमापूर्ण हिन्दी है।
- source_word: τοῖς ὄχλοις
  choice: भीड़ों से
  rationale: यूनानी बहुवचन को सुरक्षित रखता है; हिन्दी में बोलने के श्रोताओं के लिए ‘से’ स्वाभाविक है।
- source_word: χωρὶς παραβολῆς
  choice: दृष्टान्त के बिना
  rationale: χωρίς के अभाव-सूचक अर्थ और παραβολῆς के एकवचन, दोनों को सीधे बनाए रखता है।
- source_word: οὐδὲν ἐλάλει
  choice: कुछ नहीं कहते थे
  rationale: अपूर्ण भूतकाल की प्रसंगगत अभ्यस्त अथवा निरंतर क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: सर्वनाम को सीधे रखता है और पहले उल्लिखित भीड़ों की ओर संकेत करता है।
theological_decisions:
- issue: दूसरे उपवाक्य में अपूर्ण भूतकाल ἐλάλει का बल
  choice: ‘कुछ नहीं कहते थे’ द्वारा इस प्रसंग में यीशु की अभ्यस्त सार्वजनिक शिक्षा-पद्धति व्यक्त की गई है।
  alternative: ‘उन्होंने उनसे कुछ नहीं कहा’ इसे साधारण पूर्ण भूतकाल की एक घटना के रूप में प्रस्तुत कर सकता है।
  rationale: यूनानी अपूर्ण भूतकाल में अभ्यस्त अथवा जारी क्रिया की संभावना है। हिन्दी का ‘कहते थे’ इस पहलू को स्वाभाविक रूप से बचाता है, बिना यह तय किए कि कथन का दायरा इस प्रसंग से आगे भी है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘दृष्टान्त’ बाइबलीय संदर्भ में परिचित है, जबकि वाक्यरचना सामान्य पाठकों के लिए सहज रखी गई है।
