source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: hi
  text: दोनों को कटनी तक साथ-साथ बढ़ने दो। कटनी के समय मैं कटनी करनेवालों से कहूँगा, ‘पहले खरपतवारों[a] को इकट्ठा करो और उन्हें जलाने के लिए गट्ठरों में बाँधो, पर गेहूँ को मेरे भंडार में इकट्ठा करो।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “डार्नेल नामक खरपतवार”; परंपरागत रूप से “जंगली जई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε συναυξάνεσθαι ἀμφότερα
  choice: दोनों को ... एक साथ बढ़ने दो
  rationale: अनुमति-सूचक आज्ञा और συν- में निहित साथ-साथ बढ़ने का भाव स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: μέχρι τοῦ θερισμοῦ
  choice: कटनी तक
  rationale: θερισμός यहाँ फसल काटने की निश्चित घटना को सूचित करता है; ‘कटनी’ संक्षिप्त और सामान्य कृषि-शब्द है।
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: कटनी के समय
  rationale: καιρός के समय-संबंधी अर्थ और निश्चित कटनी के प्रसंग को सहज हिन्दी में व्यक्त करता है।
- source_word: θερισταῖς
  choice: काटनेवालों
  rationale: फसल काटने वाले मजदूरों के लिए स्पष्ट, आधुनिक और प्रसंगानुकूल अभिव्यक्ति।
- source_word: τὰ ζιζάνια
  choice: जंगली पौधों
  rationale: ζιζάνια हानिकारक खरपतवार, संभवतः डार्नेल, को दर्शाता है। मुख्य पाठ में सुलभ व्यापक पद रखा गया है और विशिष्ट पहचान पादटिप्पणी में दी गई है।
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: उनके गट्ठर बाँधो
  rationale: बाँधने की क्रिया और δέσμας के बंडलों का ठोस कृषि-बिंब दोनों सुरक्षित हैं।
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: जलाने के लिए
  rationale: यह उद्देश्यसूचक रचना को व्यक्त करता है, बिना दृष्टांत में व्याख्यात्मक ‘नाश’ जोड़ने के।
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: पर गेहूँ को मेरे भंडार में इकट्ठा करो
  rationale: δέ का विरोध, गेहूँ की पहचान और स्वामी के भंडार में एकत्र करने की आज्ञा सीधे रूप में सुरक्षित हैं।
theological_decisions:
- issue: अंतिम अलगाव का दृष्टान्तात्मक चित्र
  choice: कृषि-बिंब को उसी रूप में रखा गया है और अंतिम न्याय की व्याख्या पद के भीतर नहीं जोड़ी गई।
  alternative: ‘पूर्णतः भस्म करने’ या ‘नाश के लिए’ जैसे शब्दों से न्याय का अर्थ स्पष्ट कर देना।
  rationale: दृष्टान्त की व्याख्या अध्याय में आगे आती है; यहाँ यीशु के कथित चित्र और उसकी अंतर्निहित तनावपूर्ण अर्थवत्ता को सुरक्षित रखना उचित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कटनी’, ‘काटनेवालों’, ‘गट्ठर’ और ‘भंडार’ से ग्रामीण कृषि-बिंब स्पष्ट रहता है; वाक्य में दृष्टान्त की प्रत्यक्ष वाणी और क्रम भी सुरक्षित है।
