id: MAT.13.39
reference: Matthew 13:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: hi
  text: और जिस शत्रु ने उन्हें बोया, वह शैतान है; कटनी युग का अंत[a] है, और काटनेवाले स्वर्गदूत हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “युग की पूर्णता”; परंपरागत अनुवाद: “संसार का अंत।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: शत्रु
  rationale: यह व्यक्तिगत विरोधी को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है तथा दृष्टांत की व्याख्या के अनुकूल है।
- source_word: ὁ σπείρας
  choice: जिसने ... बोया
  rationale: भूतकालिक कृदंत शत्रु की पहचान उसके पूरे किए गए कार्य से कराता है; ‘बोया’ कृषि-रूपक को बनाए रखता है।
- source_word: αὐτά
  choice: उन्हें
  rationale: यह पहले उल्लिखित जंगली पौधों की ओर संकेत करता है और हिन्दी में स्वाभाविक सर्वनाम है।
- source_word: διάβολος
  choice: शैतान
  rationale: इस प्रसंग में यह एक व्यक्तिगत दुष्ट सत्ता की प्रचलित पदवी है; ‘शैतान’ सामान्य आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट है।
- source_word: θερισμὸς
  choice: कटनी
  rationale: यह कृषि-रूपक को संक्षिप्त और सहज हिन्दी में बनाए रखता है।
- source_word: συντέλεια αἰῶνός
  choice: युग का अंत
  rationale: αἰών का काल-संबंधी अर्थ ‘युग’ से सुरक्षित रहता है, जबकि συντέλεια के समापन या परिणति के भाव को ‘अंत’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: θερισταὶ
  choice: काटनेवाले
  rationale: यह फसल काटने वाले व्यक्तियों को स्पष्ट करता है और ‘कटनी’ के कृषि-बिंब से सीधा संबंध बनाए रखता है।
- source_word: ἄγγελοί
  choice: स्वर्गदूत
  rationale: युगांत-संबंधी प्रसंग में आशय मानवीय संदेशवाहकों का नहीं, बल्कि स्वर्गीय प्राणियों का है।
- source_word: δὲ
  choice: और / विराम-चिह्न द्वारा क्रम
  rationale: बार-बार आया δέ व्याख्या को आगे बढ़ाता है; हिन्दी में संयोजन और अर्धविराम से यह क्रम स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: συντέλεια αἰῶνός में αἰών का अनुवाद
  choice: युग का अंत
  alternative: संसार का अंत; युग की पूर्णता
  rationale: ‘युग’ यूनानी पद के काल-संबंधी अर्थ को बनाए रखता है और सृष्टि के भौतिक विनाश का अनावश्यक अर्थ नहीं जोड़ता। ‘पूर्णता’ परिणति का भाव अधिक प्रत्यक्ष करती है, पर सामान्य हिन्दी में ‘युग का अंत’ अधिक सहज है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘कटनी’ और ‘काटनेवाले’ से मूल कृषि-रूपक की संगति रखी गई है; ‘युग’ कालगत अर्थ को सुरक्षित रखता है।
