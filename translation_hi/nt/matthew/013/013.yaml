  to: इसी कारण मैं उनसे दृष्टान्तों में बोलता हूँ, क्योंकि देखते हुए वे नहीं देखते, और सुनते हुए वे नहीं सुनते, और न ही समझते हैं।
  rationale: The revision removes the explicit concessive particle ‘भी’ to preserve the participles’ ambiguity, changes ‘बात करता हूँ’ to ‘बोलता हूँ’ to avoid suggesting reciprocal conversation, and retains the source’s parallelism and causal relation. No footnote is needed because the Hindi wording itself remains close to the Greek without requiring a lexical alternative.
