  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: hi
  text: इसी कारण मैं उनसे दृष्टान्तों में बोलता हूँ, क्योंकि देखते हुए वे नहीं देखते, और सुनते हुए वे नहीं सुनते, और न ही समझते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पदबंध यीशु के दृष्टान्तों में बोलने का कारण प्रस्तुत करता है। ‘इसी कारण’ कारणात्मक बल को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἐν παραβολαῖς
  choice: दृष्टान्तों में
  rationale: ἐν के साथ दत्तिव यहाँ बोलने की रीति दर्शाता है। ‘दृष्टान्तों में’ प्रचलित, संक्षिप्त और स्रोत के निकट है।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: दत्तिव सर्वनाम को हिन्दी में ‘उनसे’ कहना बोलने के श्रोताओं को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λαλῶ
  choice: मैं ... बात करता हूँ
  rationale: वर्तमानकालीन क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है; अर्थ ‘बोलना’ ही रहता है, पर वाक्य अधिक स्वाभाविक बनता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι कथ्य नहीं, बल्कि कारण प्रस्तुत करता है।
- source_word: βλέποντες οὐ βλέπουσιν
  choice: देखते हुए भी वे नहीं देखते
  rationale: कृदन्त और मुख्य क्रिया की विरोधाभासी पुनरावृत्ति को बनाए रखते हुए ‘भी’ प्रसंग में निहित रियायती भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: सुनते हुए भी वे नहीं सुनते
  rationale: पहले खंड के समानान्तर संरचना और बाहरी श्रवण तथा वास्तविक ग्रहण के बीच तनाव सुरक्षित रहता है।
- source_word: οὐδὲ
  choice: और न
  rationale: यह नकारात्मक क्रम की अंतिम कड़ी को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: συνίουσιν
  choice: समझते हैं
  rationale: यह अर्थ या महत्त्व को ग्रहण करने का सामान्य और स्पष्ट हिन्दी शब्द है; इससे पाठ से परे कोई विशिष्ट धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा जाता।
theological_decisions:
- issue: βλέποντες और ἀκούοντες कृदन्तों का बल
  choice: ‘देखते हुए भी’ और ‘सुनते हुए भी’
  alternative: ‘देखते हुए वे नहीं देखते, और सुनते हुए वे नहीं सुनते’
  rationale: यूनानी कृदन्त स्वयं बिना किसी स्पष्ट रियायती अव्यय के हैं, फिर भी संदर्भ में विरोधाभास है। हिन्दी का ‘भी’ उस निहित तनाव को स्पष्ट करता है, पर इसे शारीरिक और आत्मिक अनुभूति की पूर्ण व्याख्या में नहीं बदलता।
- issue: συνίουσιν का प्रसंगगत अर्थ
  choice: ‘समझते हैं’
  alternative: ‘बूझते हैं’ या ‘ग्रहण करते हैं’
  rationale: ‘समझते हैं’ सामान्य पाठक के लिए स्पष्ट है और बाहरी देखने-सुनने तथा अर्थ को समझने के बीच के तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा dignified किंतु सामान्य पाठक के लिए सहज है। समानान्तरता और यूनानी वाक्य का विरोधाभासी प्रभाव बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
