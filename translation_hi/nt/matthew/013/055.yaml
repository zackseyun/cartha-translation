  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: hi
  text: क्या यह बढ़ई का बेटा नहीं है? क्या उसकी माँ मरियम नहीं कहलाती, और उसके भाई[a] याकूब, यूसुफ़[b], शमौन और यहूदा नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाई’ के लिए ‘रिश्तेदार’ या ‘कुटुम्बी’ भी सम्भव है; यूनानी शब्द का सामान्य अर्थ ‘भाई’ है, पर कुछ लोग इस प्रसंग में इसे व्यापक अर्थ में समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: कुछ हस्तलिपियों में ‘यूसुफ़’ के स्थान पर ‘योसेस’ है।
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: बढ़ई
  rationale: τέκτων लकड़ी या निर्माण का काम करने वाले कारीगर को सूचित कर सकता है; इस प्रसंग में ‘बढ़ई’ स्वाभाविक और प्रचलित हिन्दी रूप है।
- source_word: υἱός
  choice: बेटा
  rationale: निकट पारिवारिक प्रसंग में इसका सीधा अर्थ पुत्र है; सामान्य बोलचाल के प्रश्न में ‘बेटा’ स्वाभाविक है।
- source_word: λέγεται
  choice: नाम ... है
  rationale: यहाँ यूनानी निष्क्रिय मुहावरे का आशय ‘कहलाती है/नाम है’ है; हिन्दी में ‘माँ का नाम मरियम ... है’ अधिक स्वाभाविक है।
- source_word: Μαριὰμ
  choice: मरियम
  rationale: नए नियम में इस नाम का मानक हिन्दी रूप ‘मरियम’ है।
- source_word: ἀδελφοὶ
  choice: भाई
  rationale: शब्द का सामान्य और सतही अर्थ ‘भाई’ है; व्यापक रिश्तेदारी की सम्भावना को मुख्य पाठ में थोपने के बजाय पादटिप्पणी में रखा गया है।
- source_word: Ἰάκωβος
  choice: याकूब
  rationale: यूनानी नाम Ἰάκωβος का मानक हिन्दी बाइबलीय रूप ‘याकूब’ है।
- source_word: Ἰωσὴφ
  choice: यूसुफ़
  rationale: SBLGNT के पाठ Ἰωσήφ का मानक हिन्दी रूप ‘यूसुफ़’ है; वैकल्पिक पाठ ‘योसेस’ पादटिप्पणी में है।
- source_word: Σίμων
  choice: शमौन
  rationale: नए नियम की हिन्दी परम्परा में Σίμων का स्वाभाविक मानक रूप ‘शमौन’ है।
- source_word: Ἰούδας
  choice: यहूदा
  rationale: Ἰούδας का मानक हिन्दी बाइबलीय रूप ‘यहूदा’ है; इससे नाम को किसी विशिष्ट व्यक्ति की बाद की पहचान के अनुसार नहीं बदला जाता।
- source_word: οὐχ ... ;
  choice: क्या ... नहीं है?
  rationale: नकारात्मक प्रश्न ऐसे उत्तर की अपेक्षा करते हैं जो कथन की पुष्टि करे; हिन्दी की ‘क्या ... नहीं’ रचना इस अलंकारिक बल को बनाए रखती है।
theological_decisions:
- issue: ἀδελφοὶ αὐτοῦ से यीशु के पारिवारिक सम्बन्ध का आशय
  choice: मुख्य पाठ में ‘इसके भाई’
  alternative: इसके रिश्तेदार या निकट कुटुम्बी
  rationale: ἀδελφοί का सामान्य अर्थ ‘भाई’ है। अनुवाद को इनके ठीक जैविक या व्यापक पारिवारिक सम्बन्ध अथवा मरियम के विषय में बाद के मतभेद का निर्णय नहीं करना चाहिए; व्यापक अर्थ की सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दो समानान्तर अलंकारिक प्रश्नों को स्पष्ट हिन्दी रूप दिया गया है। सभी नाम प्रचलित हिन्दी बाइबलीय रूपों में हैं; नुक्ते सहित ‘यूसुफ़’ आधुनिक मानक उच्चारण को दर्शाता है।
