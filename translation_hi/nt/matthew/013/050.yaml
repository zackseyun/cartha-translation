id: MAT.13.50
reference: Matthew 13:50
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: hi
  text: और वे उन्हें आग की भट्ठी[a] में डाल देंगे। वहाँ रोना और दाँत पीसना होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार अनुवाद: “धधकती भट्ठी।” यूनानी में शाब्दिक रूप से “आग की भट्ठी” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσιν
  choice: डाल देंगे
  rationale: भविष्यत् सक्रिय क्रिया का अर्थ यहाँ बलपूर्वक किसी स्थान में डालना है। ‘डाल देंगे’ आधुनिक हिन्दी में स्वाभाविक है और न्याय के संदर्भ की कठोरता बनाए रखता है।
- source_word: αὐτοὺς
  choice: उन्हें
  rationale: यह कर्मकारक बहुवचन सर्वनाम पिछले संदर्भ के दुष्ट लोगों की ओर संकेत करता है।
- source_word: κάμινον τοῦ πυρός
  choice: आग की भट्ठी
  rationale: यह यूनानी संबंध-वाचक रचना को निकटता से दर्शाता है और ठोस अग्निमय न्याय-चित्र को सुरक्षित रखता है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: स्थानसूचक क्रियाविशेषण का सीधा, स्वाभाविक और पर्याप्त हिन्दी रूप।
- source_word: ἔσται
  choice: होगा
  rationale: आगे आए संयुक्त भाववाचक पदों के साथ भविष्यकालीन अस्तित्व को सहज हिन्दी में व्यक्त करता है।
- source_word: ὁ κλαυθμὸς
  choice: रोना
  rationale: κλαυθμός शोकपूर्ण रोने को दर्शाता है; ‘रोना’ साधारण पाठकों के लिए स्पष्ट है और ‘विलाप’ जैसी अधिक व्याख्यात्मक तीव्रता नहीं जोड़ता।
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: दाँत पीसना
  rationale: यह मत्ती में बार-बार आने वाली अभिव्यक्ति का स्वाभाविक हिन्दी रूप है और पीड़ा तथा न्याय के संकेतों को बिना विस्तार के बनाए रखता है।
theological_decisions:
- issue: अंतकालीन न्याय के चित्रण का अनुवाद
  choice: ‘आग की भट्ठी’ तथा ‘रोना और दाँत पीसना’ जैसे ठोस चित्रों को बनाए रखा गया है।
  alternative: चित्रों को समझाकर ‘पीड़ा में रोना’ या अपेक्षाकृत मुहावरेदार ‘धधकती भट्ठी’ कहना।
  rationale: मूल पाठ न्याय की कठोर छवियाँ देता है, पर उनके धर्मवैज्ञानिक आशय की अलग से व्याख्या नहीं करता। इसलिए उन्हें न नरम किया गया है, न अतिरिक्त अर्थ जोड़कर किसी विशेष मत के अनुसार सीमित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पठन में स्वाभाविक रखी गई है। ‘वहाँ’ मूल के स्थानसूचक बल को संक्षेप में व्यक्त करता है।
