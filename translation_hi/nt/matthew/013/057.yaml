base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: hi
  text: और उन्हें उससे ठोकर लगी[a]। पर यीशु ने उनसे कहा, “भविष्यद्वक्ता का अनादर केवल अपने ही नगर[b] और अपने ही घराने[c] में होता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उससे नाराज़ हुए”; शाब्दिक रूप से, “वे उसमें ठोकर खाए।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपने मूल स्थान” अथवा “अपनी मातृभूमि।”
    reason: lexical_alternative
  - marker: c
    text: या, “अपने ही घर में।” यूनानी शब्द घर की इमारत या घराने/परिवार—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: उन्होंने उसके कारण ठोकर खाई
  rationale: यह यूनानी रूपक यीशु के कारण आहत होकर उसे अस्वीकार करने का भाव रखता है। ‘ठोकर खाई’ मूल बिंब और उसकी नकारात्मक प्रतिक्रिया—दोनों को बनाए रखता है; पादटिप्पणी स्वाभाविक वैकल्पिक अर्थ स्पष्ट करती है।
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: पर यीशु ने उनसे कहा
  rationale: δέ उनकी प्रतिक्रिया और यीशु के उत्तर के बीच हल्का विरोध दर्शाता है; इसलिए ‘पर’ उपयुक्त है।
- source_word: προφήτης
  choice: भविष्यद्वक्ता
  rationale: यह मानक, परिचित और सीधे यूनानी पद के अनुरूप धार्मिक शब्द है।
- source_word: ἄτιμος
  choice: अनादर ... होता है
  rationale: हिंदी में ‘अनादर होता है’ सम्मान न मिलने का भाव स्वाभाविक रूप से व्यक्त करता है और कथन की मान-सम्मान संबंधी धार बनाए रखता है।
- source_word: εἰ μὴ
  choice: केवल ... में
  rationale: 'नकारात्मक कथन के साथ यह अपवाद को स्वाभाविक हिंदी में व्यक्त करता है: अन्यत्र सम्मान, पर इन क्षेत्रों में अनादर।'
- source_word: πατρίδι
  choice: अपने ही नगर
  rationale: इस प्रसंग में πατρίς व्यापक देश के बजाय यीशु के मूल स्थानीय स्थान, नासरत, की ओर संकेत करता है।
- source_word: οἰκίᾳ αὐτοῦ
  choice: अपने ही घराने
  rationale: οἰκία घर, परिवार या घरेलू मंडली का अर्थ दे सकता है। ‘घराना’ इमारत से अधिक अपने घरेलू और पारिवारिक दायरे को सामने रखता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
theological_decisions:
- issue: यीशु के इस कथन में अस्वीकृति का दायरा
  choice: इसे एक सामान्य कहावत के रूप में रखा गया है, जिसमें भविष्यद्वक्ता को अपने स्थानीय और घरेलू दायरे में अनादर मिलने की बात है।
  alternative: इसे विशेष रूप से यीशु के परिवार के अविश्वास या यीशु की हर प्रकार की अस्वीकृति पर व्यापक धर्मवैज्ञानिक कथन के रूप में खोलना।
  rationale: यूनानी पाठ एक संक्षिप्त लोकोक्तिपरक कथन देता है। अनुवाद उसके स्थानीय अस्वीकार और मान-सम्मान के तनाव को रखता है, पर पाठ से आगे कोई सांप्रदायिक या विस्तृत धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लोकोक्ति को हिंदी में स्वाभाविक बनाने के लिए यूनानी के दोहरे निषेध को ‘अनादर केवल ... में होता है’ के रूप में व्यक्त किया गया है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद दिए गए हैं।
