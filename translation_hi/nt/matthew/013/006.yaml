  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यूनानी क्रियाओं के एकवचन के अनुरूप ‘वह’ और एकवचन क्रियारूप प्रयुक्त हुए हैं; पूर्ववर्ती संदर्भ में यह उगे हुए बीज अथवा पौधे की ओर संकेत करता है।
