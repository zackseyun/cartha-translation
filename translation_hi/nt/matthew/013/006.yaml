  text: ἡλίου δὲ ἀνατείλαντος ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: hi
  text: पर जब सूरज निकला, तो वह झुलस गया; और जड़ न होने के कारण सूख गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मुरझा गया।’
    reason: ξηραίνω पौधे के संदर्भ में ‘सूख जाना’ और ‘मुरझा जाना’ दोनों अर्थ दे सकता है; वैकल्पिक अनुवाद इस अर्थ-छाया को सुरक्षित रखता है।
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: पर जब सूरज निकला
  rationale: सम्बन्धकारक निरपेक्ष रचना समय की परिस्थिति बताती है। ‘जब सूरज निकला’ स्वाभाविक हिन्दी है, और ‘पर’ δέ के हल्के विरोध अथवा कथात्मक मोड़ को बनाए रखता है।
- source_word: ἐκαυματίσθη
  choice: वह झुलस गया
  rationale: यह καυματίζω का कर्मवाच्य रूप है और धूप की गर्मी से पौधे के झुलसने को दर्शाता है। ‘झुलस गया’ कृषि-संदर्भ में स्वाभाविक है और पूर्णतः जल जाने का अर्थ नहीं देता।
- source_word: διὰ τὸ μὴ ἔχειν
  choice: न होने के कारण
  rationale: διά के साथ संज्ञीकृत infinitive स्पष्ट कारण व्यक्त करता है; हिन्दी में कारणवाचक पदबंध उसका सहज और सटीक रूप है।
- source_word: ῥίζαν
  choice: जड़
  rationale: यूनानी पाठ में शब्द एकवचन है; पौधे के संदर्भ में हिन्दी का एकवचन ‘जड़’ स्वाभाविक है।
- source_word: ἐξηράνθη
  choice: सूख गया
  rationale: ξηραίνω यहाँ पौधे के सूख जाने या मुरझा जाने को बताता है। ‘सूख गया’ परिणाम को स्पष्ट और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
