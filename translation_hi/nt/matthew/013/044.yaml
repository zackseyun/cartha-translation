id: MAT.13.44
reference: Matthew 13:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: hi
  text: स्वर्ग का राज्य खेत में छिपे हुए खजाने के समान है[a], जिसे एक मनुष्य ने पाया और फिर छिपा दिया। अपने आनन्द के कारण वह जाकर अपना सब कुछ बेच देता है और उस खेत को मोल लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्ग का राज्य खेत में छिपे खजाने के समान है।”
    reason: शब्दक्रम के इस वैकल्पिक रूप में भी खजाने के साथ तुलना स्पष्ट रहती है।
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: के समान है
  rationale: दृष्टान्त की तुलना को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: मत्ती की विशिष्ट अभिव्यक्ति को हिन्दी की स्थापित और सहज शब्दावली में सुरक्षित रखता है; βασιλεία के राज्य और शासन, दोनों अर्थ-संकेत खुले रहते हैं।
- source_word: θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: खेत में छिपे हुए खजाने
  rationale: पूर्णकालिक कर्मवाच्य कृदन्त खजाने की छिपी हुई अवस्था बताता है। अनिश्चित तुलना हिन्दी में बिना अनिवार्य अनिश्चित उपपद के स्वाभाविक है।
- source_word: ὃν εὑρὼν ἄνθρωπος ἔκρυψεν
  choice: जिसे एक मनुष्य ने पाया और फिर छिपा दिया
  rationale: सापेक्ष संबंध और क्रियाओं का क्रम स्पष्ट रहता है; 'फिर' मूल में निहित अनुक्रम को स्वाभाविक हिन्दी में प्रकट करता है। 'मनुष्य' प्रतिनिधि पुरुष पात्र को अनावश्यक रूप से सामान्यीकृत नहीं करता।
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: अपने आनन्द के कारण
  rationale: ἀπό-वाक्यांश के कारणसूचक बल को स्पष्ट रूप से व्यक्त करता है और उसके आनन्द को आगामी कार्यों की प्रेरणा बताता है।
- source_word: ὑπάγει καὶ πωλεῖ πάντα ὅσα ἔχει
  choice: वह जाकर अपना सब कुछ बेच देता है
  rationale: वर्तमानकालीन सजीव वर्णन को हिन्दी के स्वाभाविक क्रम में रखता है और संपत्ति की समग्रता को सुरक्षित करता है।
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: उस खेत को मोल लेता है
  rationale: '''उस खेत'' संकेतवाचक ἐκεῖνον को दर्शाता है; ''मोल लेता है'' स्पष्ट, वर्तमान और सामान्य हिन्दी है।'
theological_decisions:
- issue: βασιλεία का अर्थ-क्षेत्र
  choice: स्वर्ग का राज्य
  alternative: स्वर्ग का शासन
  rationale: '''राज्य'' मत्ती की अभिव्यक्ति का स्थापित रूप है और किसी एक स्थानगत या केवल गतिशील अर्थ को बाध्य किए बिना परमेश्वर के राजकीय शासन का संकेत बनाए रखता है।'
- issue: ἄνθρωπος का लिंग और प्रतिनिधि पात्र
  choice: एक मनुष्य
  alternative: एक व्यक्ति
  rationale: यूनानी पद व्याकरणतः पुल्लिंग एकवचन है और कथा में एक पुरुष पात्र है। 'मनुष्य' स्रोत की रूपरेखा बनाए रखते हुए हिन्दी में स्वाभाविक है।
- issue: खजाना फिर छिपाने की नैतिक व्याख्या
  choice: घटना को बिना नैतिक टिप्पणी के सीधे प्रस्तुत किया गया
  alternative: उसके कार्य को उचित या अनुचित ठहराने वाली व्याख्या जोड़ना
  rationale: दृष्टान्त इस कार्य का वर्णन करता है, स्पष्ट नैतिक निर्णय नहीं देता। अनुवाद को इस तनाव को स्वयं हल नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। 'आनन्द', 'खजाना' और 'मोल लेता है' सामान्य पाठकों के लिए बोधगम्य हैं। मुख्य पाठ में कारणसूचक अर्थ स्पष्ट होने के कारण अंग्रेज़ी परामर्श-पाठ के दूसरे पादलेख की आवश्यकता नहीं रखी गई।
