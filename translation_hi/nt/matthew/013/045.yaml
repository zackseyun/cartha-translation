  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: hi
  text: फिर, स्वर्ग का राज्य एक व्यापारी के समान है, जो उत्तम मोतियों की खोज करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλιν
  choice: फिर
  rationale: यह राज्य के विषय में एक और दृष्टांत प्रस्तुत करता है और पिछले दृष्टांतों से स्वाभाविक संबंध बनाए रखता है।
- source_word: ὁμοία ἐστὶν
  choice: के समान है
  rationale: दृष्टांत की तुलना को स्पष्ट, स्वाभाविक और स्रोत के निकट रूप में व्यक्त करता है।
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: मत्ती की विशेष अभिव्यक्ति का हिन्दी में प्रचलित, सहज और अर्थ-संगत रूप है।
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: एक व्यापारी
  rationale: ἔμπορος व्यक्ति को व्यापारी के रूप में पर्याप्त रूप से पहचानता है; अलग से ‘मनुष्य’ जोड़ना हिन्दी में अनावश्यक और बोझिल होगा।
- source_word: ζητοῦντι
  choice: खोज में था
  rationale: वर्तमान कृदंत व्यापारी की जारी गतिविधि बताता है; यह हिन्दी में उस निरंतर खोज को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καλοὺς μαργαρίτας
  choice: उत्तम मोतियों
  rationale: καλός यहाँ केवल बाहरी सुंदरता नहीं, बल्कि बढ़िया गुणवत्ता को सूचित करता है; ‘उत्तम’ वाणिज्यिक संदर्भ में उपयुक्त है।
theological_decisions:
- issue: दृष्टांत के तुलना-सूत्र का दायरा
  choice: राज्य की सीधी तुलना व्यापारी से रखी गई है।
  alternative: राज्य की तुलना उत्तम मोती खोजने वाले व्यापारी से जुड़ी पूरी परिस्थिति से समझी जा सकती है।
  rationale: यूनानी रचना ὁμοία ἐστὶν ... ἀνθρώπῳ ἐμπόρῳ में व्यापारी तुलना का निकटतम व्याकरणिक बिंदु है। अनुवाद रूपक को मोतियों या केवल खोज की प्रक्रिया तक सीमित करके व्याख्यायित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘व्यापारी’ वर्तमान प्रयोग में स्पष्ट है और ‘उत्तम मोती’ गुणवत्ता का भाव स्वाभाविक ढंग से देता है।
