base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: hi
  text: कुछ और बीज पथरीली जगहों पर गिरे[a], जहाँ मिट्टी अधिक नहीं थी; और मिट्टी गहरी न होने के कारण वे तुरंत उग आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘पथरीली जगहों पर’; इसका संकेत चट्टान के ऊपर मिट्टी की उथली परत वाली जगहों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: कुछ बीज
  rationale: नपुंसकलिंग बहुवचन विशेषण पिछले पद के बीजों की ओर संकेत करता है; हिन्दी में स्पष्टता और स्वाभाविकता के लिए ‘बीज’ जोड़ा गया है।
- source_word: ἔπεσεν
  choice: गिरे
  rationale: मूल क्रिया का सीधा अर्थ ‘गिरे’ है; ‘बोए गए’ कहना कथन में मूल से अधिक अर्थ जोड़ता।
- source_word: ἐπὶ τὰ πετρώδη
  choice: पथरीली जगहों पर
  rationale: बहुवचन τὰ πετρώδη का निकट और स्वाभाविक रूप है; यह ऐसी जगहों का संकेत देता है जहाँ चट्टान के ऊपर मिट्टी की उथली परत है।
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: जहाँ मिट्टी अधिक नहीं थी
  rationale: कृषि-संदर्भ में γῆ के लिए ‘मिट्टी’ सहज है और वाक्य की अस्पष्ट विषय-संरचना को हिन्दी में स्वाभाविक अस्तित्वसूचक कथन से व्यक्त करता है।
- source_word: καὶ εὐθέως ἐξανέτειλεν
  choice: और ... वे तुरंत उग आए
  rationale: εὐθέως की तात्कालिकता ‘तुरंत’ से और पौधे के निकलने की कृषि-छवि ἐξανέτειλεν के लिए ‘उग आए’ से स्पष्ट होती है।
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: मिट्टी गहरी न होने के कारण
  rationale: διά के साथ क्रियार्थक संज्ञा कारण बताती है; यह हिन्दी रूप मिट्टी की अपर्याप्त गहराई की मूल छवि को स्वाभाविक ढंग से रखता है।
