source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: hi
  text: उसने उनके सामने एक और दृष्टान्त रखा। उसने कहा, “स्वर्ग का राज्य राई के एक दाने के समान है, जिसे एक मनुष्य ने लेकर अपने खेत में बोया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: सामने ... रखा
  rationale: यह παρατίθημι के ‘श्रोताओं के सामने प्रस्तुत करना’ वाले अर्थ और उसके ठोस बिंब—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: παραβολὴν
  choice: दृष्टान्त
  rationale: सुसमाचारों में παραβολή के लिए यह प्रचलित और सटीक हिन्दी विधा-संज्ञा है।
- source_word: Ὁμοία ἐστὶν
  choice: के समान है
  rationale: तुलना आरम्भ करने वाले यूनानी सूत्र का स्वाभाविक और औपचारिक हिन्दी समतुल्य है।
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: यह मत्ती की विशिष्ट अभिव्यक्ति को बनाए रखता है और ‘राज्य’ में शासन तथा अधिकार-क्षेत्र, दोनों की अर्थ-संभावना खुली छोड़ता है।
- source_word: κόκκῳ σινάπεως
  choice: राई के एक दाने
  rationale: κόκκος बीज या दाने को सूचित कर सकता है; भारतीय हिन्दी में इस परिचित कृषि-बिंब के लिए ‘राई का दाना’ स्पष्ट और स्वाभाविक है।
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: जिसे एक मनुष्य ने लेकर
  rationale: यह सम्बन्धवाचक रचना, एकल कर्ता और λαβών की पूर्ववर्ती क्रिया को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: ἔσπειρεν
  choice: बोया
  rationale: σπείρω का विशिष्ट अर्थ बीज बोना है; इसलिए ‘लगाया’ की अपेक्षा ‘बोया’ अधिक सटीक है।
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: अपने खेत में
  rationale: हिन्दी में समान कर्ता की निजवाचक सम्पत्ति के लिए ‘अपने’ स्वाभाविक रूप से αὐτοῦ का अर्थ व्यक्त करता है।
theological_decisions:
- issue: मत्ती की अभिव्यक्ति βασιλεία τῶν οὐρανῶν का अनुवाद
  choice: स्वर्ग का राज्य
  alternative: स्वर्ग का शासन; स्वर्गों का राज्य
  rationale: ‘स्वर्ग का राज्य’ मत्ती की स्थापित पदावली को सुरक्षित रखता है और अर्थ को केवल अमूर्त शासन तक सीमित नहीं करता; यूनानी बहुवचन को यांत्रिक रूप से ‘स्वर्गों’ कहना हिन्दी में अस्वाभाविक होगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज मानक हिन्दी। ‘दृष्टान्त’, ‘स्वर्ग का राज्य’ और ‘राई का दाना’ जैसी परिचित बाइबलीय पदावली रखी गई है, जबकि वाक्य-विन्यास को आज की हिन्दी के अनुरूप बनाया गया है।
