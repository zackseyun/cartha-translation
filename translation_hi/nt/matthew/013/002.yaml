  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί, ὥστε αὐτὸν ⸀εἰς πλοῖον ἐμβάντα καθῆσθαι, καὶ πᾶς ὁ ὄχλος ἐπὶ τὸν αἰγιαλὸν εἱστήκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: hi
  text: और उसके पास बहुत-सी भीड़ें इकट्ठी हो गईं, यहाँ तक कि वह नाव में चढ़कर बैठ गया; और सारी भीड़ किनारे पर खड़ी रही।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτὸν
  choice: उसके पास ... इकट्ठी हो गईं
  rationale: πρός के साथ कर्मकारक दिशा या निकट आने का भाव देता है; हिन्दी में ‘उसके पास इकट्ठी हो गईं’ स्वाभाविक है और निष्क्रिय रूप का अनावश्यक बोझ नहीं डालता।
- source_word: ὄχλοι πολλοί
  choice: बड़ी भीड़ें
  rationale: मूल पाठ के बहुवचन ὄχλοι को बनाए रखते हुए πολλοί को हिन्दी मुहावरे में आकार/बहुलता के रूप में व्यक्त किया गया है। ‘बहुत-सी भीड़ें’ संभव है, पर कम स्वाभाविक है।
- source_word: ὥστε
  choice: इसलिए
  rationale: यहाँ ὥστε परिणाम बताता है। ‘इसलिए’ भीड़ों के एकत्र होने और यीशु के नाव में बैठने के बीच परिणाम-संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς πλοῖον ἐμβάντα
  choice: नाव में चढ़कर
  rationale: ἐμβαίνω का आशय नाव में प्रवेश करना या उस पर सवार होना है; ‘नाव में चढ़कर’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: καθῆσθαι
  choice: बैठ गया
  rationale: बैठने की क्रिया और परिणामी अवस्था को सामान्य कथात्मक हिन्दी में स्पष्ट करता है।
- source_word: πᾶς ὁ ὄχλος
  choice: सारी भीड़
  rationale: पहले के बहुवचन समूहों को अब एक सामूहिक इकाई के रूप में बताने वाले यूनानी एकवचन को सुरक्षित रखता है।
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: किनारे पर
  rationale: αἰγιαλός के तट/रेतीले किनारे के अर्थ को बिना अनावश्यक विशिष्टता के व्यक्त करता है। संदर्भ से जलाशय का किनारा स्पष्ट है।
- source_word: εἱστήκει
  choice: खड़ी रही
  rationale: प्लूपरफेक्ट रूप यहाँ खड़े होने की बनी हुई अवस्था का चित्र देता है; ‘खड़ी रही’ उस स्थायी दृश्यात्मक पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के लिए सहज रखी गई है। मूल पाठ के ‘भीड़ें’ से ‘सारी भीड़’ के बहुवचन से सामूहिक एकवचन में परिवर्तन को जानबूझकर सुरक्षित रखा गया है।
