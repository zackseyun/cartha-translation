- from: और उसके पास बड़ी भीड़ें इकट्ठी हो गईं। इसलिए वह नाव में चढ़कर बैठ गया, और सारी भीड़ किनारे पर खड़ी रही।
  to: और उसके पास बहुत-सी भीड़ें इकट्ठी हो गईं, यहाँ तक कि वह नाव में चढ़कर बैठ गया; और सारी भीड़ किनारे पर खड़ी रही।
