review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the gathering, Jesus entering a boat and sitting, and the collective crowd standing at the shore. However, ‘इसलिए’ can sound like a straightforward causal inference rather than the result force of ὥστε; ‘यहाँ तक कि’ represents that result relation more closely.
  naturalness: 'Most of the Hindi is clear and suitable for public reading. ‘बहुत-सी भीड़ें’ is preferable to ‘बड़ी भीड़ें’: it more directly reflects πολλοί (‘many’) and is idiomatic enough in this narrative context.'
  terminology: ‘नाव,’ ‘किनारे,’ and ‘खड़ी रही’ are natural, accurate choices. The singular collective ‘सारी भीड़’ appropriately reflects πᾶς ὁ ὄχλος after the preceding plural ὄχλοι.
  issues:
  - severity: medium
    issue: Result connector ‘इसलिए’
    rationale: ὥστε introduces the resulting circumstance. ‘यहाँ तक कि’ more clearly retains the Greek result/consequence relationship without making it merely an inferred cause-and-effect statement.
  - severity: low
    issue: ‘बड़ी भीड़ें’ for ὄχλοι πολλοί
    rationale: ‘बड़ी’ emphasizes size, whereas πολλοί primarily denotes multiplicity. ‘बहुत-सी भीड़ें’ better preserves the source sense.
  revised_text: और उसके पास बहुत-सी भीड़ें इकट्ठी हो गईं, यहाँ तक कि वह नाव में चढ़कर बैठ गया; और सारी भीड़ किनारे पर खड़ी रही।
  revised_footnotes: []
