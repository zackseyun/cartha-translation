  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। कृदन्त-श्रृंखला को स्वाभाविक हिन्दी घटनाक्रम में बदला गया है, जबकि ‘एक’, सम्पूर्ण त्याग और पूर्ण हुई खरीद सुरक्षित हैं।
