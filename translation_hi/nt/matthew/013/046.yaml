  text: ⸂εὑρὼν δὲ⸃ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: hi
  text: और जब उसे एक बहुत मूल्यवान मोती मिला,[a] तो उसने जाकर अपना सब कुछ बेच दिया और उसे खरीद लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक बहुमूल्य मोती’।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: और जब उसे ... मिला
  rationale: अओरिस्ट कृदन्त मुख्य क्रियाओं से पहले हुई घटना बताता है; δέ यहाँ हल्का संयोजक है। स्वाभाविक हिन्दी में कालवाचक उपवाक्य घटनाक्रम को स्पष्ट रखता है।
- source_word: ἕνα
  choice: एक
  rationale: यूनानी पाठ में संख्या स्पष्ट है और असाधारण मूल्य वाले एक ही मोती पर बल देती है।
- source_word: πολύτιμον
  choice: बहुत मूल्यवान
  rationale: यह आधुनिक हिन्दी में असाधारण कीमत या महत्त्व को स्पष्ट रूप से व्यक्त करता है; ‘बहुमूल्य’ भी सम्भव है।
- source_word: μαργαρίτην
  choice: मोती
  rationale: यह इसका सामान्य और प्रसंगानुकूल हिन्दी अर्थ है।
- source_word: ἀπελθὼν
  choice: जाकर
  rationale: यह पूर्ववर्ती कृदन्त की क्रिया और उसके बाद बेचने की क्रिया का स्वाभाविक क्रम व्यक्त करता है।
- source_word: πέπρακεν
  choice: बेच दिया
  rationale: परफेक्ट रूप की पूर्ण हुई क्रिया को हिन्दी में संयुक्त क्रिया स्वाभाविक ढंग से व्यक्त करती है।
- source_word: πάντα ὅσα εἶχεν
  choice: अपना सब कुछ
  rationale: यह मूल की सम्पूर्णता को संक्षिप्त और सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἠγόρασεν
  choice: खरीद लिया
  rationale: यह पूर्ण हुई खरीद को सामान्य और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αὐτόν
  choice: उसे
  rationale: पुल्लिंग सर्वनाम अपने व्याकरणिक रूप में पुल्लिंग ‘मोती’ की ओर लौटता है; हिन्दी में ‘उसे’ स्वाभाविक है।
