  source_fidelity: The translation preserves the explicit singular ‘one,’ the exceptional value of the pearl, the sequence of finding, going, selling all possessions, and buying the pearl. ‘और जब’ naturally renders the prior aorist participle with lightly connective δέ, while ‘जाकर’ adequately conveys ἀπελθών in idiomatic Hindi.
  naturalness: The wording is fluent modern standard Hindi. ‘अपना सब कुछ बेच दिया’ is natural and fully conveys πάντα ὅσα εἶχεν. The pronoun ‘उसे’ clearly and naturally refers to the masculine noun ‘मोती.’
  terminology: ‘मोती’ is the standard equivalent of μαργαρίτης. ‘बहुत मूल्यवान’ accurately communicates πολύτιμος; the footnote’s ‘बहुमूल्य’ is a valid lexical alternative. No theological terminology is at issue.
