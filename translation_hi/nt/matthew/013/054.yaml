  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: hi
  text: और वह अपने नगर में आकर उनके आराधनालय में उन्हें शिक्षा दे रहा था। वे इतने चकित हुए कि कहने लगे, “इस आदमी को यह बुद्धि और ये सामर्थ्य के काम[a] कहाँ से मिले?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चमत्कार”; अर्थात ऐसे असाधारण काम जिनमें सामर्थ्य प्रकट होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: अपने नगर
  rationale: इस प्रसंग में यह यीशु के अपने स्थानीय नगर, जहाँ लोग उसे जानते थे, को सूचित करता है; ‘अपने नगर’ स्वाभाविक हिन्दी है और राष्ट्र या व्यापक देश का अर्थ नहीं देता।
- source_word: ἐδίδασκεν
  choice: शिक्षा देने लगा
  rationale: अपूर्ण भूतकाल चल रही क्रिया को दर्शाता है; यह प्रयोग हिन्दी में उस जारी शिक्षण को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: συναγωγῇ
  choice: आराधनालय
  rationale: यह यहूदी सभा और उसके उपासना-स्थान के संस्थागत अर्थ को स्पष्ट तथा प्रचलित हिन्दी में व्यक्त करता है।
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: इससे वे चकित होकर कहने लगे
  rationale: ὥστε शिक्षण के परिणाम को प्रस्तुत करता है; हिन्दी की स्वाभाविक वाक्य-रचना में यह आश्चर्य और उसके बाद के कथन दोनों को व्यक्त करता है।
- source_word: Πόθεν
  choice: कहाँ से मिले
  rationale: यह बुद्धि और सामर्थ्यपूर्ण कामों के स्रोत या उद्गम पर प्रश्न करता है; ‘कहाँ से मिले’ आधुनिक हिन्दी में सहज है।
- source_word: τούτῳ
  choice: इस आदमी को
  rationale: संकेतवाचक सर्वनाम में उपस्थित कुछ दूरी के भाव को ‘इस आदमी’ स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: σοφία
  choice: बुद्धि
  rationale: यह असाधारण समझ और शिक्षण-सामर्थ्य के लिए सीधा तथा प्रचलित हिन्दी पर्याय है।
- source_word: δυνάμεις
  choice: सामर्थ्य के काम
  rationale: बहुवचन शब्द का मूल संबंध सामर्थ्य से है और प्रसंग में वह सामर्थ्य प्रकट करने वाले असाधारण कार्यों को सूचित करता है; यह अनुवाद सीधे ‘चमत्कार’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: यीशु के असाधारण कार्यों के लिए δυνάμεις का अनुवाद
  choice: सामर्थ्य के काम
  alternative: चमत्कार
  rationale: यह चयन यूनानी शब्द में निहित ‘सामर्थ्य’ और उसके कार्यरूप प्रकट होने, दोनों को बनाए रखता है। ‘चमत्कार’ प्रसंगानुकूल है, पर कुछ अधिक व्याख्यात्मक है; उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपने नगर’ स्थानीय परिचित स्थान का भाव देता है, और भीड़ के कुछ दूरी भरे स्वर के लिए ‘इस आदमी’ चुना गया है।
