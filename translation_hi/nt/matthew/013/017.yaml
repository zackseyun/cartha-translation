id: MAT.13.17
reference: Matthew 13:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: hi
  text: क्योंकि मैं तुमसे सच कहता हूँ कि बहुत-से भविष्यद्वक्ता और धर्मी लोग उन बातों को देखने के लिए तरसते थे जिन्हें तुम देखते हो, पर उन्होंने उन्हें नहीं देखा; और उन बातों को सुनने के लिए तरसते थे जिन्हें तुम सुनते हो, पर उन्होंने उन्हें नहीं सुना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν
  choice: सच
  rationale: यह यीशु के कथन की गंभीर और विश्वसनीय पुष्टि व्यक्त करता है तथा आधुनिक हिन्दी में स्वाभाविक है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन में दी गई व्याख्या का संबंध स्पष्ट करता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: मूल की सीधी संबोधन-शैली और सूत्रात्मक कथन सुरक्षित रहता है।
- source_word: πολλοὶ προφῆται καὶ δίκαιοι
  choice: बहुत-से भविष्यद्वक्ता और धर्मी लोग
  rationale: πολλοί की मात्रा, προφῆται का स्थापित अर्थ और संज्ञा के रूप में प्रयुक्त δίκαιοι—तीनों को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπεθύμησαν
  choice: तरसते थे
  rationale: यह क्रिया की प्रबल अभिलाषा को सहज हिन्दी में प्रकट करता है; अपूर्ण भूतकाल उस पूर्वकालीन लालसा का स्वाभाविक वर्णन करता है।
- source_word: ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν
  choice: उन बातों को देखने के लिए ... जिन्हें तुम देखते हो, पर उन्होंने उन्हें नहीं देखा
  rationale: देखने की इच्छा और उसके पूरा न होने का विरोध स्पष्ट रखते हुए सापेक्ष उपवाक्य तथा कालगत अंतर को बनाए रखता है।
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: उन बातों को सुनने के लिए ... जिन्हें तुम सुनते हो, पर उन्होंने उन्हें नहीं सुना
  rationale: ग्रीक की समानांतर रचना को हिन्दी में स्पष्ट और संतुलित ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: δίκαιοι का दायरा
  choice: धर्मी लोग
  alternative: धर्मी जन / धर्मी
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘धर्मी लोग’ भविष्यद्वक्ताओं के अतिरिक्त एक व्यापक वर्ग को स्पष्ट करता है, बिना उसकी पहचान को और सीमित किए।
- issue: देखी और सुनी गई बातों की पहचान
  choice: उन बातों को ... जिन्हें तुम देखते/सुनते हो
  alternative: मसीह को / राज्य के भेदों को
  rationale: प्रसंग यीशु की सेवकाई और राज्य के प्रकाशन की ओर संकेत करता है, किंतु पद स्वयं विषय को स्पष्ट नाम नहीं देता; इसलिए मूल की अंतर्निहितता और धर्मवैचारिक तनाव बनाए रखा गया है।
- issue: ἐπεθύμησαν का कालगत रूप
  choice: तरसते थे
  alternative: तरसे / उन्होंने अभिलाषा की
  rationale: ग्रीक एओरिस्ट इच्छा को समग्र ऐतिहासिक तथ्य के रूप में प्रस्तुत करता है। हिन्दी में ‘तरसते थे’ दीर्घ लालसा को स्वाभाविक रूप से व्यक्त करता है, बिना यह कहे कि वह इच्छा निरंतर किस अवधि तक रही।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भविष्यद्वक्ता’ और ‘धर्मी’ जैसे परिचित बाइबिलीय शब्द बनाए गए हैं। मूल की दृश्य-श्रव्य समानांतरता को हिन्दी में दोहराव सहित सुरक्षित रखा गया है।
