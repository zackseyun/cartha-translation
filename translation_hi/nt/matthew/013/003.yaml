- source_word: παραβολαῖς
  choice: दृष्टान्तों
  rationale: यह प्रचलित और गरिमापूर्ण हिन्दी शब्द यीशु की तुलना-आधारित शिक्षाप्रद कथाओं के अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह श्रोताओं का ध्यान खींचने वाले यूनानी उद्गार का आधुनिक और सहज हिन्दी रूप है।
- source_word: ὁ σπείρων
  choice: बोनेवाला
  rationale: कर्तृवाचक कृदन्त को संज्ञा के रूप में रखते हुए व्यक्ति की भूमिका स्पष्ट करता है।
- source_word: τοῦ σπείρειν
  choice: बीज बोने
  rationale: यूनानी में कर्म निहित है; हिन्दी में केवल ‘बोने’ की अपेक्षा ‘बीज बोने’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: ἐξῆλθεν
  choice: निकला
  rationale: सरल भूतकाल मूल कथन की सीधी, आरम्भिक कथा-शैली को बनाए रखता है।
