  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: hi
  text: तब धर्मी अपने पिता के राज्य में सूर्य के समान चमकेंगे[a]। जिसके कान हों, वह सुने[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चमक उठेंगे।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से, “जिसके कान हैं, वह सुने”—यह एकवचन में कही गई प्रतिनिधिक पुकार है कि हर सुनने वाला ध्यान दे।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह समय-सूचक क्रियाविशेषण पिछले पदों में बताए गए घटनाक्रम के परिणाम की ओर संकेत करता है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: οἱ δίκαιοι
  choice: धर्मी
  rationale: यह विशेषण संज्ञा के रूप में उन लोगों के लिए प्रयुक्त है जो धर्मी माने जाते हैं; ‘धर्मी’ नैतिक और वाचा-संबंधी अर्थों को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἐκλάμψουσιν
  choice: चमकेंगे
  rationale: भविष्यकालीन क्रिया का अर्थ ‘चमकना’ या ‘चमक उठना’ है। सूर्य की उपमा स्वयं तेज का भाव स्पष्ट करती है, इसलिए मुख्य पाठ में सहज ‘चमकेंगे’ रखा गया है।
- source_word: ὡς ὁ ἥλιος
  choice: सूर्य के समान
  rationale: ὡς यहाँ तुलना प्रकट करता है; यह चयन उपमा को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐν τῇ βασιλείᾳ
  choice: राज्य में
  rationale: βασιλεία का अर्थ राज या राज्य हो सकता है; यहाँ स्थानवाचक वाक्यांश में ‘राज्य में’ सबसे स्वाभाविक है और शाही शासन के भाव को नकारता भी नहीं।
- source_word: τοῦ πατρὸς αὐτῶν
  choice: अपने पिता के
  rationale: αὐτῶν का संबंध ‘धर्मी’ से है। हिन्दी में कर्ता की ओर लौटता ‘अपने’ इस संबंध को स्वाभाविक और स्पष्ट बनाता है; मूल में न होने के कारण ‘स्वर्गीय’ नहीं जोड़ा गया।
- source_word: ὁ ἔχων ὦτα
  choice: जिसके कान हों
  rationale: यह एकवचन में प्रतिनिधिक अभिव्यक्ति है। ‘जिसके कान हों’ आधुनिक हिन्दी में स्वाभाविक है और किसी भी सुनने वाले व्यक्ति को संबोधित करती है।
- source_word: ἀκουέτω
  choice: वह सुन ले
  rationale: यह तीसरे पुरुष का आज्ञार्थक रूप है। ‘सुन ले’ केवल ध्वनि सुनने के बजाय ध्यान देकर ग्रहण करने की गंभीर पुकार को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अंतिम आह्वान का प्रतिनिधिक एकवचन
  choice: ‘जिसके कान हों, वह सुन ले’ के रूप में एकवचन बनाए रखा गया
  alternative: ‘जिनके कान हों, वे सुन लें’
  rationale: यूनानी पाठ एकवचन रचना का प्रयोग करता है, जो प्रतिनिधिक रूप से प्रत्येक सुनने वाले को संबोधित करती है। हिन्दी चयन इस एकवचन पुकार को बिना केवल पुरुषों तक सीमित किए सुरक्षित रखता है।
- issue: इस प्रसंग में βασιλεία का अर्थ
  choice: ‘राज्य’
  alternative: ‘शासन’ या ‘राज’
  rationale: ‘अपने पिता के राज्य में’ स्थानवाचक रचना और युगांत-संबंधी चित्र के अनुकूल है; साथ ही यह परमेश्वर के शासन के भाव को समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धर्मी’, ‘राज्य’ और ‘सूर्य के समान’ बाइबलीय अर्थ एवं चित्र को स्पष्ट रखते हैं, जबकि अंतिम वाक्य हिन्दी में स्वाभाविक आज्ञार्थक पुकार के रूप में प्रस्तुत है।
