    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: उसने उत्तर दिया
  rationale: यूनानी कृदंत और मुख्य क्रिया मिलकर उत्तर की भूमिका बनाते हैं। हिन्दी में ‘उसने उत्तर दिया’ स्वाभाविक है और अनावश्यक पुनरुक्ति से बचता है।
- source_word: Ὁ σπείρων
  choice: जो … बोता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत व्यक्ति की पहचान उसके कार्य से कराता है; यह रूप उसके सामान्य/विशिष्ट कार्य को सहज हिन्दी में बनाए रखता है।
- source_word: τὸ καλὸν σπέρμα
  choice: अच्छा बीज
  rationale: καλός यहाँ उत्तम या उचित होने का भाव देता है। ‘बीज’ यूनानी की तरह सामूहिक एकवचन में रखा गया है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह सुसमाचारों में यीशु की स्थापित उपाधि है और दानिय्येल 7 की प्रतिध्वनि रखती है; पारंपरिक हिन्दी रूप उस अंतर्पाठीय और धर्मवैज्ञानिक भार को सुरक्षित रखता है।
theological_decisions:
- issue: मसीही उपाधि υἱὸς τοῦ ἀνθρώπου का अनुवाद
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र / वह मानव जन
  rationale: यह केवल किसी मनुष्य का सामान्य उल्लेख नहीं, बल्कि सुसमाचारों में विशिष्ट उपाधि है, जिसमें दानिय्येल 7 से जुड़ी अंतर्पाठीय गूँज है। स्थापित रूप अर्थ को व्याख्यात्मक ढंग से सीमित किए बिना इस संबंध को बनाए रखता है।
