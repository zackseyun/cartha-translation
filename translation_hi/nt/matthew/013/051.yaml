  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: hi
  text: “क्या तुम ये सब बातें समझ गए[a]?” उन्होंने उससे कहा, “हाँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम ये सब बातें समझते हो?”
    reason: यूनानी अओरिस्ट Συνήκατε का एक सम्भव, अधिक सहज वर्तमानकालीन अनुवाद।
lexical_decisions:
- source_word: Συνήκατε
  choice: समझ गए
  rationale: प्रश्न में प्रयुक्त अओरिस्ट रूप अब तक दी गई शिक्षा को समझ लेने की ओर संकेत करता है। ‘समझते हो’ सम्भव है, पर पूर्ण हुई समझ के पहलू को कम स्पष्ट करता है।
- source_word: ταῦτα πάντα
  choice: ये सब बातें
  rationale: नपुंसकलिंग बहुवचन पदबंध यहाँ अभी कही गई शिक्षाओं और दृष्टान्तों को समग्र रूप से दर्शाता है; आधुनिक हिन्दी में ‘ये सब बातें’ स्वाभाविक और स्पष्ट है।
- source_word: λέγουσιν αὐτῷ
  choice: उन्होंने उससे कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर हिन्दी कथा-शैली में सामान्य भूतकाल अधिक स्वाभाविक है। αὐτῷ को ‘उससे’ के रूप में बनाए रखा गया है।
- source_word: Ναί
  choice: हाँ
  rationale: मूल पाठ में केवल स्वीकृतिसूचक शब्द है; ‘प्रभु’ जैसी कोई उपाधि जोड़ना स्रोत से परे होगा।
theological_decisions:
- issue: शिष्यों के उत्तर में आदरसूचक उपाधि जोड़ना
  choice: केवल ‘हाँ’ रखा गया।
  alternative: ‘हाँ, प्रभु।’
  rationale: SBLGNT पाठ में केवल Ναί है। स्रोत में अनुपस्थित भक्तिपरक या धर्मवैचारिक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ये सब बातें’ सामान्य पाठक के लिए स्वाभाविक है, और ‘समझ गए’ यूनानी अओरिस्ट के अब तक समझ लेने वाले भाव को व्यक्त करता है।
