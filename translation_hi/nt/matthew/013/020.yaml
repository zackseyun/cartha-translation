source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: hi
  text: और जो पथरीली भूमि पर बोया गया है, वह वह व्यक्ति है जो वचन सुनता है और तुरन्त आनन्द से उसे ग्रहण करता है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: और जो पथरीली भूमि पर बोया गया
  rationale: δέ को प्रसंग में हल्के संक्रमण के रूप में ‘और’ से व्यक्त किया गया है। संज्ञा के समान प्रयुक्त कृदन्तीय वाक्यांश बीज और भूमि के रूपक को बनाए रखते हुए उस व्यक्ति की ओर संकेत करता है जिसका आगे वर्णन है।
- source_word: πετρώδη
  choice: पथरीली भूमि
  rationale: यह शब्द पत्थरों वाली या चट्टानी जमीन का बोध कराता है। ‘पथरीली भूमि’ आधुनिक हिन्दी में स्वाभाविक है और कृषि-संबंधी चित्र को स्पष्ट रखता है।
- source_word: σπαρείς
  choice: बोया गया
  rationale: यह σπείρω का अओरिस्ट कर्मवाच्य कृदन्त है। ‘बोया गया’ कर्मवाच्य और बुवाई के रूपक दोनों को सुरक्षित रखता है।
- source_word: οὗτός ἐστιν
  choice: वह यह है
  rationale: मूल की पहचानसूचक संरचना को निकटता से रखा गया है और इसे व्याख्यात्मक रूप से ‘दर्शाता है’ नहीं बनाया गया। हिन्दी में आगे के विवरण से जोड़ने के लिए विसर्ग लगाया गया है।
- source_word: ὁ τὸν λόγον ἀκούων
  choice: जो वचन सुनता है
  rationale: वर्तमान कृदन्त को स्वाभाविक हिन्दी सम्बन्धवाचक उपवाक्य में व्यक्त किया गया है। λόγος के लिए ‘वचन’ इस प्रसंग की पारिभाषिक और विषयगत प्रतिध्वनि को बनाए रखता है।
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह तात्कालिकता के बल को स्पष्ट और मानक हिन्दी में व्यक्त करता है।
- source_word: μετὰ χαρᾶς
  choice: आनन्द के साथ
  rationale: संज्ञा χαρά को संज्ञा के रूप में सुरक्षित रखते हुए यूनानी पूर्वसर्गीय वाक्यांश का स्वाभाविक प्रतिरूप दिया गया है।
- source_word: λαμβάνων αὐτόν
  choice: उसे ग्रहण करता है
  rationale: यहाँ λαμβάνω का अर्थ प्राप्त करना या स्वीकार करना है। ‘ग्रहण करता है’ दोनों अर्थ-छायाओं को समेटता है; ‘उसे’ का संकेत ‘वचन’ की ओर है।
theological_decisions:
- issue: दृष्टान्त की व्याख्या में बोए गए का संकेत
  choice: रूपक को ‘जो पथरीली भूमि पर बोया गया’ के रूप में रखा गया है और अगले वाक्यांश को उस व्यक्ति की पहचान करने दिया गया है।
  alternative: ‘पथरीली भूमि पर बोया गया बीज उस व्यक्ति को दर्शाता है जो…’ जैसी अधिक व्याख्यात्मक रचना।
  rationale: यूनानी पाठ ‘बोए गए’ और सुनने वाले व्यक्ति को एक संक्षिप्त, तनावपूर्ण रूपकीय पहचान में रखता है। अनुवाद इसे बीज और व्यक्ति के बीच स्पष्ट व्याख्यात्मक समानता जोड़कर हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण बाइबलीय गद्य। ‘वचन’, ‘आनन्द’ और ‘ग्रहण’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की संक्षिप्तता और रूपकीय संरचना को बनाए रखते हैं।
