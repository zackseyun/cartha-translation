id: MAT.13.12
reference: Matthew 13:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: hi
  text: क्योंकि जिसके पास है[a], उसे और दिया जाएगा और उसके पास बहुत हो जाएगा; पर जिसके पास नहीं है, उससे वह भी ले लिया जाएगा जो उसके पास है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘है’ का कर्म अनकहा है।
    reason: अर्थगत अस्पष्टता
lexical_decisions:
- source_word: ὅστις
  choice: जिसके
  rationale: यह अनिश्चित सम्बन्धवाचक सर्वनाम एक सामान्य सिद्धान्त प्रकट करता है। ‘जिसके’ हिन्दी में स्वाभाविक है और प्रत्येक ऐसे व्यक्ति का बोध कराता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ उस संयोजक बल को स्पष्ट रखता है।
- source_word: ἔχει
  choice: पास है
  rationale: यूनानी में कर्म अनकहा है। ‘पास है’ उसी अपूर्णता और व्यापक अर्थ को बनाए रखता है।
- source_word: δοθήσεται αὐτῷ
  choice: उसे और दिया जाएगा
  rationale: क्रिया भविष्यत् कर्मवाच्य है। यूनानी में ‘और’ अलग से नहीं है, पर अगले पद ‘बहुतायत होगी’ और विरोधी समानान्तरता से वृद्धि का भाव निहित है; हिन्दी में ‘और’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: περισσευθήσεται
  choice: उसके पास बहुतायत होगी
  rationale: यह बढ़ जाने अथवा प्रचुर होने की परिणति बताता है। यह हिन्दी अभिव्यक्ति अर्थ को स्पष्ट और गरिमापूर्ण रखती है।
- source_word: δὲ
  choice: पर
  rationale: दो प्रकार के व्यक्तियों और परिणामों के बीच स्पष्ट विरोध दिखाता है।
- source_word: καὶ ὃ ἔχει
  choice: वह भी ... जो उसके पास है
  rationale: यहाँ καί उत्कर्षसूचक है; ‘भी’ इस विरोधाभासी जोर को व्यक्त करता है कि उसके पास जो है, वही ले लिया जाएगा।
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: उससे ... ले लिया जाएगा
  rationale: भविष्यत् कर्मवाच्य और ἀπό मिलकर किसी व्यक्ति से वस्तु हटा लिए जाने का अर्थ देते हैं।
theological_decisions:
- issue: ‘पास है’ और ‘दिया जाएगा’ का अनकहा कर्म
  choice: मुख्य पाठ में कर्म को अनकहा रखा गया है।
  alternative: इसे विशेष रूप से ‘समझ’, ‘ग्रहणशीलता’ या ‘राज्य का ज्ञान’ कहना।
  rationale: निकटवर्ती प्रसंग इन अवधारणाओं की ओर संकेत करता है, पर यूनानी वाक्य कर्म को स्पष्ट नहीं करता। अनुवाद जानबूझकर इस व्यापकता और अर्थगत तनाव को बनाए रखता है।
- issue: पुल्लिंग एकवचन का सामान्य प्रतिनिधिक प्रयोग
  choice: ‘जिसके/उसे/उससे’ वाली एकवचन संरचना रखी गई है, जो हिन्दी में सामान्य व्यक्ति के लिए स्वाभाविक रूप से प्रयुक्त होती है।
  alternative: बहुवचन ‘जिनके/उन्हें’ अपनाना।
  rationale: मूल में एकवचन प्रतिनिधिक संरचना है। हिन्दी के सम्बन्धवाचक-सहसम्बन्धवाचक रूप बिना अनावश्यक लिंग-निर्धारण के उसका एकवचन और सामान्य बल सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सूक्तिपरक और गरिमापूर्ण शैली रखी गई है। ‘बहुतायत’ बाइबिलीय गंभीरता बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य है; वाक्य की समानान्तर संरचना मूल कथन का जोर सुरक्षित रखती है।
