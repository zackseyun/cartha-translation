source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: hi
  text: यह सभी बीजों से छोटा है; पर जब यह बढ़ जाता है, तो बगीचे के पौधों से बड़ा है और पेड़ बन जाता है, यहाँ तक कि आकाश के पक्षी आकर उसकी डालियों में बसेरा करते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: डालियों में पक्षियों के बसेरे का यह चित्र पुराने नियम में किसी विशाल राज्यरूपी पेड़ के चित्रों की प्रतिध्वनि हो सकता है (जैसे यहेजकेल 17:23; दानिय्येल 4:12), पर यह पद उस प्रतीकात्मक अर्थ को स्पष्ट रूप से नहीं बताता।
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: सभी बीजों से छोटा
  rationale: यूनानी में तुलनात्मक रूप है; यह वाक्यांश उसी तुलना को स्पष्ट रखता है, बिना उसे व्याकरणिक रूप से परमोत्कृष्ट में बदलने के।
- source_word: μέν ... δέ
  choice: वास्तव में ... पर
  rationale: बीज की छोटी शुरुआत और उसके बड़े परिणाम के बीच यूनानी विरोध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὅταν ... αὐξηθῇ
  choice: जब बढ़ जाता है
  rationale: वृद्धि को पूर्ण अवस्था तक पहुँची हुई घटना के रूप में व्यक्त करता है और सामान्य कथन के लिए सहज हिन्दी है।
- source_word: μεῖζον τῶν λαχάνων
  choice: बगीचे के पौधों से बड़ा
  rationale: λάχανα का व्यापक अर्थ बगीचे में उगाए जाने वाले पौधे हैं; यह 'सब्ज़ियों' या 'जड़ी-बूटियों' से अनावश्यक रूप से अर्थ को संकीर्ण नहीं करता।
- source_word: γίνεται δένδρον
  choice: एक पेड़ बन जाता है
  rationale: यूनानी के सजीव और सीधे कथन को बिना 'पेड़ जैसा' कहकर नरम किए सुरक्षित रखता है।
- source_word: ὥστε ἐλθεῖν
  choice: यहाँ तक कि ... आकर
  rationale: ὥστε के परिणामसूचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: आकाश के पक्षी
  rationale: οὐρανός के प्रसंगानुकूल अर्थ 'आकाश' को रखते हुए हिन्दी की स्वाभाविक बाइबलीय अभिव्यक्ति देता है।
- source_word: κατασκηνοῦν
  choice: बसेरा करते हैं
  rationale: क्रिया का अर्थ डालियों में ठहरना या निवास करना है; 'बसेरा' पक्षियों के प्रसंग में स्वाभाविक है और केवल घोंसला बनाने तक अर्थ को सीमित नहीं करता।
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: उसकी डालियों में
  rationale: स्थानसूचक अर्थ और पेड़ की ओर संकेत, दोनों को सीधे रूप में रखता है।
theological_decisions:
- issue: विशाल पेड़ की डालियों में पक्षियों के बसेरे का सम्भावित पुराने नियम से संकेत
  choice: मुख्य पाठ में चित्र को बिना व्याख्या जोड़े ज्यों का त्यों रखा गया है।
  alternative: पक्षियों को परमेश्वर के राज्य में आश्रय पाने वाले राष्ट्रों या लोगों का स्पष्ट प्रतीक बताना।
  rationale: यहेजकेल 17:23 और दानिय्येल 4:12 जैसे वृक्ष-राज्य चित्रों की प्रतिध्वनि सम्भव है, पर यह पद स्वयं उसका प्रतीकात्मक अर्थ स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। तुलनात्मक संरचना, छोटे आरम्भ और बड़े परिणाम का विरोध, तथा सम्भावित धर्मवैज्ञानिक संकेत की अस्पष्टता सुरक्षित रखी गई है।
