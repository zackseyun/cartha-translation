  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: hi
  text: और जब वह बीज बो रहा था, तो कुछ बीज[a] रास्ते के किनारे गिरे; और पक्षियों ने आकर उन्हें खा लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “कुछ चीज़ें रास्ते के किनारे गिरीं”; “बीज” बोने वाले के संदर्भ से जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: जब वह बीज बो रहा था
  rationale: ἐν के साथ articular infinitive समकालिक क्रिया बताता है। हिंदी में यह प्रयोग स्वाभाविक रूप से ‘जब वह ... रहा था’ से व्यक्त होता है; संदर्भ से ‘बीज’ जोड़ना आवश्यक और स्पष्ट है।
- source_word: ἃ μὲν
  choice: कुछ बीज
  rationale: नपुंसकलिंग बहुवचन संबंधवाचक सर्वनाम का संकेत संदर्भ में बोए जा रहे बीजों की ओर है। हिंदी में आशय स्पष्ट करने के लिए ‘बीज’ की पूर्ति की गई है, और इसे पादटिप्पणी में बताया गया है।
- source_word: ἔπεσεν
  choice: गिरे
  rationale: वर्णनात्मक aorist को हिंदी में सामान्य पूर्ण भूतकाल से स्वाभाविक रूप में व्यक्त किया गया है। ‘बीज’ के बहुवचन के अनुसार क्रिया बहुवचन है।
- source_word: παρὰ τὴν ὁδόν
  choice: रास्ते के किनारे
  rationale: παρά के साथ कर्मकारक यहाँ रास्ते के पास या किनारे की स्थिति दर्शाता है। ‘रास्ते के किनारे’ आधुनिक हिंदी में स्वाभाविक है और कृषि-परिवेश के अनुकूल है।
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: पक्षियों ने आकर
  rationale: aorist participle को हिंदी की पूर्वकालिक संयुक्त क्रिया ‘आकर’ से व्यक्त किया गया है। πετεινά का सीधा और पर्याप्त अर्थ ‘पक्षी’ है; समानांतर अंशों से ‘आकाश के’ नहीं जोड़ा गया।
- source_word: κατέφαγεν
  choice: खा लिया
  rationale: κατεσθίω पूर्णतः खा जाने का भाव देता है। ‘खा लिया’ साधारण आधुनिक हिंदी में परिणामी और पूर्ण क्रिया को स्वाभाविक ढंग से व्यक्त करता है; ‘निगल गए’ बीजों के संदर्भ में अनावश्यक रूप से चित्रात्मक होता।
- source_word: αὐτά
  choice: उन्हें
  rationale: सर्वनाम गिरे हुए बीजों की ओर संकेत करता है। हिंदी में ‘उन्हें’ संदर्भ को स्पष्ट रखते हुए अनावश्यक पुनरावृत्ति से बचाता है।
