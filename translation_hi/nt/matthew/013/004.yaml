translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘बो रहा था’ जारी क्रिया और ‘गिरे/खा लिया’ घटनाक्रम को स्पष्ट रखते हैं। मुख्य पाठ में पादटिप्पणी चिह्न [a] उपस्थित है।
