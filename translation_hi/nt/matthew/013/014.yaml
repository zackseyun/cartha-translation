  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: hi
  text: 'और उनमें यशायाह की वह भविष्यवाणी पूरी होती है[a], जो कहती है:


    “तुम सुनोगे तो अवश्य, पर कभी समझोगे नहीं;

    और देखते हुए देखोगे, पर कभी बूझोगे नहीं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सुनने से तुम सुनोगे ... और देखते हुए तुम देखोगे।” यूनानी उद्धरण में संरक्षित यह इब्रानी शैली की बलसूचक अभिव्यक्ति है।
    reason: मूल की पुनरुक्त बलसूचक संरचना का अधिक शाब्दिक रूप बताना।
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: पूरी होती है
  rationale: वर्तमानकालीन कर्मवाच्य को स्वाभाविक हिन्दी में रखता है और यह बताता है कि भविष्यवाणी इन लोगों में चरितार्थ होती है; ‘पूरी तरह पूरी हो जाती है’ जैसी अधिक प्रबल व्याख्या नहीं जोड़ता।
- source_word: αὐτοῖς
  choice: उनमें
  rationale: सम्प्रदान कारक का आशय है कि भविष्यवाणी इन्हीं लोगों के मामले में चरितार्थ होती है। ‘उनमें’ मूल संरचना और अर्थ, दोनों के निकट है।
- source_word: προφητεία Ἠσαΐου
  choice: यशायाह की वह भविष्यवाणी
  rationale: यूनानी सम्बन्धवाचक रचना का सहज और स्पष्ट हिन्दी रूप। ‘वह’ आगे आने वाले उद्धरण की ओर संकेत करता है।
- source_word: ἡ λέγουσα
  choice: जो कहती है
  rationale: विशेषणात्मक कृदन्त को स्वाभाविक हिन्दी सम्बन्धवाचक उपवाक्य के रूप में व्यक्त करता है।
- source_word: Ἀκοῇ ἀκούσετε
  choice: तुम सुनते तो रहोगे
  rationale: मूल की इब्रानी-शैली वाली पुनरुक्त बलसूचक रचना को पठनीय हिन्दी में व्यक्त करता है। ‘तो’ अगले विरोधी खंड के साथ तनाव को उभारता है।
- source_word: οὐ μὴ συνῆτε
  choice: पर कभी समझोगे नहीं
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को ‘कभी ... नहीं’ से व्यक्त किया गया है; ‘पर’ निहित विरोध को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: βλέποντες βλέψετε
  choice: और देखते तो रहोगे
  rationale: पहले खंड के समानांतर पुनरुक्त बल को सहज हिन्दी में बनाए रखता है।
- source_word: οὐ μὴ ἴδητε
  choice: पर कभी बूझ पाओगे नहीं
  rationale: पहले प्रयुक्त ‘देखना’ से भेद रखते हुए ἴδητε में निहित वास्तविक ग्रहण या अंतर्दृष्टि को ‘बूझ पाना’ व्यक्त करता है; प्रबल निषेध भी सुरक्षित रहता है।
theological_decisions:
- issue: भविष्यवाणी के पूरा होने का स्वरूप
  choice: भविष्यवाणी इन लोगों में पूरी होती है
  alternative: यह उनमें केवल उदाहरण रूप में दिखाई देती है; अथवा उनमें अंतिम और संपूर्ण अर्थ में समाप्त हो जाती है
  rationale: अनुवाद मूल के पूर्ति-विधान को बनाए रखता है, पर कठोरता, पूर्वनियति या भविष्यवाणी की पूर्ण समाप्ति के विषय में पाठ से आगे कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—गरिमापूर्ण, पर सामान्य पाठक के लिए सहज। काव्यात्मक उद्धरण में समानांतरता बनाए रखी गई है। ‘बूझ पाओगे’ बाहरी दृष्टि और आंतरिक ग्रहण के बीच मूल भेद को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
