  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: hi
  text: मनुष्य का पुत्र अपने स्वर्गदूतों को भेजेगा, और वे उसके राज्य में से ठोकर के सभी कारणों[a] और अधर्म करने वालों[b] को इकट्ठा करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभी ठोकरों को” या “सभी ठोकर के कारणों को।” यूनानी शब्द उन व्यक्तियों, वस्तुओं या प्रभावों के लिए प्रयुक्त हो सकता है जो लोगों को पाप में गिराते या विश्वास से भटका देते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “जो अधर्म करते हैं।” वर्तमान कृदंत लगातार या चारित्रिक आचरण का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: भेजेगा
  rationale: भविष्यकालीन क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है। प्रसंग से यह स्पष्ट है कि स्वर्गदूतों को एक कार्य के लिए भेजा जा रहा है; इसलिए ‘भेज निकालेगा’ जैसे अस्वाभाविक विस्तार की आवश्यकता नहीं है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु की स्थापित उपाधि और दानिय्येल 7 से उसके संभावित अंतर्पाठीय संबंध को सुरक्षित रखता है।
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: अपने स्वर्गदूतों को
  rationale: न्याय और अंत-काल के इस प्रसंग में ἄγγελοι मनुष्य-दूतों के बजाय स्वर्गीय दूतों को सूचित करता है। ‘अपने’ हिन्दी में कर्ता की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: συλλέξουσιν
  choice: इकट्ठा करेंगे
  rationale: कटनी और न्याय के आसपास के चित्र को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐκ τῆς βασιλείας αὐτοῦ
  choice: उसके राज्य में से
  rationale: ἐκ का भीतर से बाहर निकाले जाने का भाव सुरक्षित रखता है, न कि केवल राज्य से सामान्य संबंध।
- source_word: πάντα τὰ σκάνδαλα
  choice: ठोकर खिलाने वाली सभी चीज़ों
  rationale: σκάνδαλα के सक्रिय अर्थ—ऐसी चीज़ें, प्रभाव या कारण जो लोगों को पाप में गिराते अथवा विश्वास से हटाते हैं—को स्पष्ट करता है और केवल मन को बुरा लगने के अर्थ से बचाता है।
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: अधर्म करनेवालों
  rationale: ἀνομία के परमेश्वर की व्यवस्था की अवहेलना वाले नैतिक-धार्मिक अर्थ को बनाए रखता है। वर्तमान कृदंत को हिन्दी का कर्तृवाचक रूप स्वाभाविक रूप से आदतन आचरण के रूप में व्यक्त कर सकता है।
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου उपाधि का अनुवाद
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र / वह मनुष्य
  rationale: परंपरागत और व्यापक रूप से पहचाना जाने वाला रूप मत्ती में इस उपाधि के अर्थ तथा दानिय्येल 7 की प्रतिध्वनि को बिना व्याख्यात्मक रूप से सीमित किए बनाए रखता है।
- issue: σκάνδαλα का दायरा
  choice: ठोकर खिलाने वाली सभी चीज़ों
  alternative: ठोकर के सभी कारणों / सभी ठोकरों
  rationale: मूल बहुवचन में व्यक्ति, वस्तु या प्रभाव सम्मिलित हो सकते हैं। चुना गया रूप इस व्यापकता को बनाए रखता है और इसे केवल भावनात्मक ‘अपमान’ तक सीमित नहीं करता।
- issue: ἀνομία का नैतिक-धार्मिक अर्थ
  choice: अधर्म
  alternative: बुराई / व्यवस्था-विहीनता
  rationale: ‘अधर्म’ परमेश्वर की व्यवस्था के विरुद्ध विद्रोही आचरण की धारणा को रखता है, पर पद में किसी विशिष्ट धार्मिक संप्रदाय की व्यवस्था-संबंधी व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘मनुष्य का पुत्र,’ ‘स्वर्गदूत,’ ‘राज्य’ और ‘अधर्म’ जैसे परिचित बाइबलीय शब्द अंतर्पाठीय तथा धर्मवैचारिक संबंध बनाए रखते हैं। मुख्य पाठ में कठिन यूनानी रूपक को समझने योग्य बनाया गया है, जबकि पादटिप्पणी उसके वैकल्पिक अधिक शाब्दिक रूप और व्यापक दायरे को सुरक्षित रखती है।
