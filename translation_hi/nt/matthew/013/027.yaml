id: MAT.13.27
reference: Matthew 13:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: hi
  text: तब घर के स्वामी के दासों ने उसके पास आकर कहा, “प्रभु, क्या आपने अपने खेत में अच्छा बीज नहीं बोया था? फिर उसमें खरपतवार[a] कहाँ से आ गए?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जंगली पौधे”; यूनानी शब्द संभवतः डार्नेल नामक ऐसे खरपतवार को दर्शाता है जो आरम्भिक अवस्था में गेहूँ जैसा दिखाई देता है।
    reason: ζιζάνια के सामान्य अर्थ ‘खरपतवार’ तथा उसके संभावित विशिष्ट वनस्पति-संबंधी अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: προσελθόντες
  choice: उसके पास आकर
  rationale: पूर्वकालिक कृदंत मुख्य क्रिया ‘कहा’ से पहले स्वामी की ओर आने की सहायक क्रिया बताता है; यह हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: δοῦλοι
  choice: दासों
  rationale: यह शब्द स्वामी के अधिकार के अधीन बँधे घरेलू कामगारों को सूचित करता है; ‘दास’ इस सामाजिक संबंध को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रूप से बनाए रखता है।
- source_word: οἰκοδεσπότου
  choice: घर के स्वामी
  rationale: यह संयुक्त शब्द घर-परिवार के मुखिया और स्वामी का भाव रखता है तथा δοῦλοι के साथ संबंध भी स्पष्ट करता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: सम्मानपूर्वक संबोधन के रूप में κύριε का मानक हिन्दी प्रतिरूप; इस दृष्टांत में यह घर के स्वामी को संबोधित करता है, बिना अतिरिक्त मसीही अर्थ थोपे।
- source_word: οὐχὶ
  choice: क्या ... नहीं
  rationale: यह ऐसी प्रश्न-रचना है जिसमें सकारात्मक उत्तर की अपेक्षा है; हिन्दी संरचना वही बल स्वाभाविक रूप से व्यक्त करती है।
- source_word: καλὸν σπέρμα
  choice: अच्छा बीज
  rationale: कृषि-संदर्भ में सीधा, स्पष्ट और स्वाभाविक अनुवाद।
- source_word: ἔσπειρας
  choice: बोया था
  rationale: σπείρω का विशिष्ट अर्थ बीज बोना है; ‘था’ पहले किए गए कार्य और वर्तमान परिणाम के संबंध को हिन्दी में सहज बनाता है।
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: अपने खेत में
  rationale: σῷ का स्वामित्व हिन्दी के आत्मवाचक ‘अपने’ से स्पष्ट और स्वाभाविक रूप से व्यक्त होता है।
- source_word: πόθεν οὖν
  choice: फिर ... कहाँ से
  rationale: πόθεν उद्गम पूछता है और οὖν पूर्व कथन से निष्कर्षात्मक संबंध जोड़ता है; ‘फिर ... कहाँ से’ दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἔχει ζιζάνια
  choice: उसमें जंगली पौधे कहाँ से आ गए
  rationale: यूनानी अभिव्यक्ति शाब्दिक रूप से खेत के पास ζιζάνια होने की बात करती है; हिन्दी में उद्गम पूछने वाला यह रूप अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ζιζάνια
  choice: जंगली पौधे
  rationale: संदर्भ में यह गेहूँ जैसे दिखने वाले हानिकारक खरपतवार, संभवतः डार्नेल, को दर्शाता है। ‘जंगली पौधे’ सामान्य पाठक के लिए स्पष्ट है और विशिष्ट पहचान पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: दृष्टांत के घरेलू संदर्भ में δοῦλοι का अनुवाद
  choice: दासों
  alternative: सेवकों
  rationale: ‘दास’ मूल सामाजिक स्थिति और स्वामी के अधीनता-संबंध को बिना नरम किए सुरक्षित रखता है; पद स्वयं दासता पर कोई धर्मसैद्धांतिक निर्णय नहीं देता।
- issue: κύριε का संबोधन
  choice: प्रभु
  alternative: स्वामी / महोदय
  rationale: ‘प्रभु’ κύριος का मानक प्रतिरूप बनाए रखता है। यहाँ यह दृष्टांत के घर-स्वामी के लिए आदरसूचक संबोधन है; पाठ में इससे कोई अतिरिक्त मसीही दावा स्पष्ट नहीं किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘दास’ मूल सामाजिक संबंध को स्पष्ट रखता है, जबकि अंतिम प्रश्न को शाब्दिक रूप से असहज बनाने के बजाय हिन्दी में स्वाभाविक उद्गम-प्रश्न के रूप में रखा गया है।
