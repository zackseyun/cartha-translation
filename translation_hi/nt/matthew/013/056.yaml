base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: hi
  text: और क्या उसकी सभी बहनें हमारे साथ नहीं हैं? फिर इस आदमी को ये सब बातें कहाँ से मिलीं?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्त्री रिश्तेदार।” यहाँ यूनानी शब्द का सामान्य अर्थ “बहनें” है, पर बाद की धर्मशास्त्रीय चर्चाओं के कारण कुछ लोग इसे अधिक व्यापक अर्थ में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: बहनें
  rationale: यहाँ सामान्य पारिवारिक अर्थ प्रसंग के अनुकूल है, क्योंकि गाँव के लोग यीशु के परिवार का उल्लेख कर रहे हैं।
- source_word: οὐχὶ πᾶσαι
  choice: क्या ... सभी ... नहीं
  rationale: यह संरचना ऐसे अलंकारिक प्रश्न को व्यक्त करती है जिसमें हाँ उत्तर अपेक्षित है और सभी बहनों पर बल बना रहता है।
- source_word: πρὸς ἡμᾶς
  choice: हमारे बीच ... रहतीं
  rationale: व्यक्तिवाचक सर्वनाम के साथ πρός यहाँ समुदाय में साथ होने या उपस्थित रहने का भाव देता है; हिन्दी में यह स्वाभाविक रूप से निवास और स्थानीय परिचय को व्यक्त करता है।
- source_word: πόθεν
  choice: कहाँ से
  rationale: यह शब्द स्रोत या उद्गम पूछता है; ‘कहाँ से’ उसी प्रश्न को सीधे बनाए रखता है।
- source_word: οὖν
  choice: फिर
  rationale: यह भीड़ के तर्क में निष्कर्षात्मक अगला कदम दिखाता है और हिन्दी प्रश्न में स्वाभाविक है।
- source_word: τούτῳ
  choice: इस आदमी को
  rationale: संकेतवाचक रूप यीशु की ओर कुछ दूरी और हल्की उपेक्षा के साथ इशारा करता है; ‘इस आदमी’ उस लहजे को ‘उसे’ से बेहतर बनाए रखता है।
- source_word: ταῦτα πάντα
  choice: ये सब बातें
  rationale: बहुवचन अभिव्यक्ति प्रसंग में पहले बताई गई बुद्धि और सामर्थ्य के कामों की ओर व्यापक रूप से संकेत करती है; ‘बातें’ हिन्दी में इस समूचे संदर्भ को समेट सकती है।
theological_decisions:
- issue: यीशु की बहनों के उल्लेख का स्वरूप
  choice: ἀδελφαὶ का अनुवाद उसके सामान्य शाब्दिक अर्थ ‘बहनें’ से किया गया है।
  alternative: स्त्री रिश्तेदार या चचेरी-ममेरी बहनें
  rationale: यूनानी शब्द और निकटवर्ती पारिवारिक प्रसंग ‘बहनें’ का समर्थन करते हैं। बाद की धर्मवैचारिक चर्चाओं के आधार पर अधिक व्यापक रिश्तेदारी का अर्थ मुख्य पाठ में रखना पाठ से आगे जाकर तनाव को सुलझाना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘हमारे बीच रहतीं’ स्थानीय समुदाय में उनकी ज्ञात उपस्थिति को स्वाभाविक ढंग से व्यक्त करता है; ‘इस आदमी’ मूल के संकेतात्मक और कुछ उपेक्षापूर्ण स्वर को सुरक्षित रखता है।
