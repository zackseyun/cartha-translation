source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: hi
  text: तब उसने उनसे कहा, “इसलिए हर शास्त्री, जो स्वर्ग के राज्य के लिए प्रशिक्षित हुआ है,[a] एक गृहस्वामी[b] के समान है, जो अपने भंडार[c] में से नई और पुरानी चीज़ें निकालता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो स्वर्ग के राज्य का शिष्य बनाया गया है।” यूनानी कृदंत में शिष्य बनाए जाने के साथ-साथ शिक्षा या प्रशिक्षण पाने का भाव भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या “घराने का मुखिया।”
    reason: lexical_alternative
  - marker: c
    text: या “खजाने।” यूनानी शब्द मूल्यवान वस्तुओं के संचय या उन्हें रखने वाले भंडार—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: इसलिए
  rationale: यह पद को पिछले संवाद से जोड़ने वाला स्वाभाविक निष्कर्षसूचक शब्द है और यूनानी वाक्यांश का तार्किक बल बनाए रखता है।
- source_word: πᾶς γραμματεὺς
  choice: हर शास्त्री
  rationale: ‘शास्त्री’ γραμματεύς का प्रचलित और संक्षिप्त बाइबलीय प्रतिशब्द है; यहाँ इसे केवल नकलनवीस या संकीर्ण अर्थ में व्यवस्था-विशेषज्ञ कहना उचित नहीं।
- source_word: μαθητευθεὶς
  choice: जो … प्रशिक्षित हुआ है
  rationale: यह अओरिस्ट कर्मवाच्य कृदंत किसी को शिष्य बनाए जाने अथवा शिक्षा-प्रशिक्षण पाने का भाव रख सकता है। मुख्य पाठ का वाक्यांश आधुनिक हिन्दी में सहज है, जबकि वैकल्पिक शिष्यत्व-संबंधी अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: स्वर्ग के राज्य के लिए
  rationale: μαθητευθείς के बाद आया संप्रदान कारक असामान्य है और राज्य की ओर उन्मुखता या उससे संबंध सूचित कर सकता है। ‘के लिए’ इस संबंध को अनावश्यक रूप से सीमित किए बिना स्वाभाविक हिन्दी देता है।
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: उस घर के स्वामी
  rationale: οἰκοδεσπότης घर या गृहस्थी पर अधिकार और उत्तरदायित्व रखने वाले व्यक्ति को दर्शाता है। यह रूप आधुनिक हिन्दी में स्पष्ट है और केवल मकान-मालिक होने का अर्थ नहीं देता।
- source_word: ἐκβάλλει
  choice: निकालता है
  rationale: यद्यपि क्रिया का सामान्य अर्थ बलपूर्वक बाहर निकालना भी हो सकता है, भंडार के प्रसंग में इसका स्वाभाविक अर्थ भीतर रखी वस्तुओं को बाहर लाना है।
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: अपने भंडार में से
  rationale: θησαυρός मूल्यवान संचय के साथ उस संचय को रखने के स्थान का अर्थ भी दे सकता है। यहाँ वस्तुएँ निकालने की क्रिया के कारण ‘भंडार’ चित्र को स्पष्ट रखता है; पादटिप्पणी ‘खजाना’ की मूल्य-सूचना सुरक्षित करती है।
- source_word: καινὰ καὶ παλαιά
  choice: नई और पुरानी चीज़ें
  rationale: नपुंसकलिंग बहुवचन विशेषणों में वस्तुएँ निहित हैं। हिन्दी में ‘चीज़ें’ जोड़ने से अर्थ स्पष्ट होता है और मूल का क्रम तथा विरोध बना रहता है।
theological_decisions:
- issue: μαθητευθεὶς का शास्त्री और स्वर्ग के राज्य से संबंध
  choice: स्वर्ग के राज्य के लिए प्रशिक्षित हुआ शास्त्री
  alternative: स्वर्ग के राज्य का शिष्य बनाया गया शास्त्री
  rationale: मूल शब्द शिक्षा-प्रशिक्षण और शिष्य बनाए जाने, दोनों भावों की गुंजाइश रखता है। मुख्य पाठ पठनीय प्रशिक्षण-भाव देता है और पादटिप्पणी अधिक प्रत्यक्ष शिष्यत्व-विकल्प सुरक्षित रखती है; इसे केवल धर्म-परिवर्तन या औपचारिक कानूनी शिक्षा तक सीमित नहीं किया गया।
- issue: οἰκοδεσπότης की घरेलू भूमिका
  choice: घर का स्वामी
  alternative: घराने का मुखिया
  rationale: यह घरेलू अधिकार और प्रबंध की उपमा बनाए रखता है, पर उससे किसी बाद की सामाजिक या धार्मिक व्यवस्था का निष्कर्ष नहीं जोड़ता।
- issue: θησαυρός का रूपक
  choice: भंडार
  alternative: खजाना
  rationale: प्रसंग में वहाँ से वस्तुएँ निकाली जाती हैं, इसलिए स्थान या संचित सामग्री का भाव प्रमुख है। फिर भी मूल्यवान निधि का संभावित अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘शास्त्री’ और ‘स्वर्ग का राज्य’ जैसे परिचित बाइबलीय पद बनाए गए हैं। वाक्य-क्रम हिन्दी के अनुरूप किया गया है, जबकि मूल की उपमा, नए-पुराने का क्रम और प्रमुख अर्थगत अस्पष्टताएँ सुरक्षित हैं।
