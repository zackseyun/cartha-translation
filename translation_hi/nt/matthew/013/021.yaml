  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: hi
  text: पर उसके भीतर जड़ नहीं होती, बल्कि वह केवल थोड़े समय तक टिकता है। जब वचन के कारण कष्ट या सताव आता है, तो वह तुरंत ठोकर खाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विमुख हो जाता है” अथवा “बुरा मानता है”; यूनानी क्रिया का अर्थ ठोकर खाना, विमुख होना, या बुरा मानना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτῷ
  choice: अपने भीतर उसकी जड़
  rationale: खेती का मूल रूपक सुरक्षित रहता है और ἐν ἑαυτῷ का आंतरिक अर्थ स्वाभाविक हिन्दी में व्यक्त होता है। सर्वनाम 'उसकी' पिछले पद में वर्णित व्यक्ति की ओर संकेत करता है।
- source_word: πρόσκαιρός
  choice: थोड़े ही समय तक टिकता है
  rationale: शाब्दिक 'अस्थायी' की अपेक्षा यह व्यक्ति के सीमित धैर्य या स्थायित्व को अधिक स्वाभाविक हिन्दी में बताता है, बिना उससे अधिक अर्थ जोड़े।
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: जब ... कष्ट या सताव आता है
  rationale: समय-सूचक संबंध स्पष्ट करता है। 'कष्ट' θλῖψις की दबाव और संकट की व्यापकता रखता है; 'सताव' धार्मिक विरोध के संदर्भ में διωγμός का प्रचलित और सहज रूप है।
- source_word: διὰ τὸν λόγον
  choice: वचन के कारण
  rationale: λόγος का पारिभाषिक संबंध दृष्टान्त के संदेश से बनाए रखता है और कारणसूचक διά को स्पष्ट करता है।
- source_word: εὐθὺς
  choice: तुरंत
  rationale: प्रतिक्रिया की तात्कालिकता को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: σκανδαλίζεται
  choice: विश्वास से डगमगा जाता है
  rationale: संदर्भ में दबाव के कारण शिष्यत्व में ठोकर खाने या पीछे हटने का भाव देता है। 'विश्वास से' निहित संदर्भ को सहज बनाता है, जबकि पदत्याग जैसे अधिक निश्चित धर्मवैज्ञानिक निष्कर्ष से बचता है; व्यापक शाब्दिक विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: σκανδαλίζεται का शिष्यत्व-संदर्भ में अर्थ
  choice: विश्वास से डगमगा जाता है
  alternative: ठोकर खाता है; पीछे हट जाता है; बुरा मानता है
  rationale: यूनानी क्रिया ठोकर खाने, फँसने, विमुख होने या बुरा मानने तक की अर्थ-सीमा रखती है। मुख्य पाठ संदर्भगत विफलता व्यक्त करता है, पर अंतिम धर्मत्याग का सिद्धान्त आरोपित नहीं करता; पादटिप्पणी वास्तविक अर्थगत विस्तार सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल। कृषि-रूपक 'जड़' तथा सुसमाचार-संदर्भ का 'वचन' सुरक्षित रखे गए हैं। अंग्रेज़ी परामर्श-पाठ की पादटिप्पणी a गलत स्थान पर प्रतीत होती है, इसलिए उसे σκανδαλίζεται के हिन्दी अनुवाद के बाद रखा गया है; अंग्रेज़ी पादटिप्पणी b केवल पूर्व विराम-चिह्न विन्यास बताती है और स्रोत-पाठ की वास्तविक पाठगत अस्पष्टता नहीं है, इसलिए हिन्दी प्रकाशन-पाठ में शामिल नहीं की गई।
