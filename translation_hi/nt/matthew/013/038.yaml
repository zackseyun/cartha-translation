  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: hi
  text: खेत संसार है; अच्छा बीज—ये राज्य के पुत्र[a] हैं; और जंगली पौधे[b] दुष्ट के पुत्र हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘पुत्र’ एक संबंधसूचक, प्रतिनिधिक अभिव्यक्ति है—अर्थात वे लोग जो राज्य से संबंधित हैं।
    reason: cultural_note
  - marker: b
    text: और अधिक विशिष्ट रूप से, ‘डार्नेल’—गेहूँ से मिलता-जुलता एक हानिकारक जंगली पौधा; परम्परागत रूप से, ‘टेयर्स’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρός
  choice: खेत
  rationale: कृषि-दृष्टान्त में यह सामान्य और स्वाभाविक शब्द है तथा मूल बिंब को बनाए रखता है।
- source_word: κόσμος
  choice: संसार
  rationale: यहाँ बोआई के व्यापक क्षेत्र के रूप में समूचे संसार का संकेत है; ‘संसार’ प्रचलित और स्पष्ट अनुवाद है।
- source_word: καλὸν σπέρμα
  choice: अच्छा बीज
  rationale: यह जंगली पौधों के विपरीत उपयोग हुआ है और कृषि-बिंब को सीधे बनाए रखता है।
- source_word: οὗτοί εἰσιν
  choice: … पुत्र हैं
  rationale: पुल्लिंग बहुवचन सर्वनाम सामूहिक एकवचन ‘बीज’ से उन लोगों की ओर संकेत बदलता है जिनका वह बीज प्रतिनिधित्व करता है; हिन्दी में विधेय को सीधे बहुवचन में रखना स्वाभाविक है।
- source_word: υἱοὶ τῆς βασιλείας
  choice: राज्य के पुत्र
  rationale: यह मूल के संबंधसूचक सामी मुहावरे और पुल्लिंग बहुवचन को सुरक्षित रखता है; प्रतिनिधिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ζιζάνια
  choice: जंगली पौधे
  rationale: यह साधारण पाठक के लिए स्पष्ट है और बोई गई अच्छी फसल के बीच उगे हानिकारक, उससे मिलते-जुलते पौधों का बिंब देता है; अधिक वनस्पति-विशिष्ट पहचान पादटिप्पणी में है।
- source_word: τοῦ πονηροῦ
  choice: दुष्ट
  rationale: सव्यक्तिक, निश्चित पुल्लिंग एकवचन रूप को ‘दुष्ट’ सुरक्षित रखता है और यूनानी से आगे बढ़कर उसका नाम नहीं बताता।
theological_decisions:
- issue: τοῦ πονηροῦ का अर्थ निराकार ‘बुराई’ है या सव्यक्तिक ‘दुष्ट’
  choice: दुष्ट
  alternative: बुराई
  rationale: निश्चित उपपद सहित पुल्लिंग एकवचन संबंधकारक और ‘पुत्र’ के साथ संबंधसूचक प्रयोग यहाँ किसी व्यक्तिगत दुष्ट सत्ता की ओर स्वाभाविक रूप से संकेत करता है। अनुवाद उसे ‘शैतान’ कहकर मूल से अधिक स्पष्ट नहीं करता।
- issue: υἱοὶ को ‘पुत्र’ या समावेशी ‘सन्तान/लोग’ कहना
  choice: पुत्र
  alternative: राज्य के लोग / राज्य की सन्तान
  rationale: यूनानी में स्पष्ट रूप से पुल्लिंग बहुवचन ‘पुत्र’ है। मुख्य पाठ उसका संबंधसूचक रूप बनाए रखता है, जबकि पादटिप्पणी बताती है कि अभिव्यक्ति प्रतिनिधिक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कृषि-शब्दावली रखी गई है। तीन व्याख्यात्मक खंडों की समानांतर लय बनाए रखने के लिए अर्धविराम और संयोजन का प्रयोग किया गया है। ‘राज्य के पुत्र’ और ‘दुष्ट के पुत्र’ की जानबूझकर समान संरचना मूल पाठ के धार्मिक तथा संबंधसूचक तनाव को सुरक्षित रखती है।
