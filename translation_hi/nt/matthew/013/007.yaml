  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: hi
  text: कुछ और बीज काँटेदार झाड़ियों के बीच गिरे[a]। फिर वे झाड़ियाँ उग आईं और उन्होंने बीजों को दबा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘काँटों पर गिरे’। कृषि-संदर्भ में आशय काँटेदार झाड़ियों के बीच गिरने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: कुछ और बीज
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त है और पिछले संदर्भ के बीजों की ओर संकेत करता है। हिन्दी में ‘बीज’ जोड़ने से आशय स्वाभाविक रूप से स्पष्ट होता है।
- source_word: δὲ
  choice: फिर
  rationale: यहाँ δέ प्रबल विरोध नहीं, बल्कि दृष्टान्त की अगली घटना प्रस्तुत करने वाला हल्का संयोजक है। ‘फिर’ हिन्दी में क्रम को सहज रूप से व्यक्त करता है।
- source_word: ἔπεσεν
  choice: गिरे
  rationale: πίπτω का सीधा अर्थ ‘गिरना’ है। व्यापक प्रसंग बोने का है, फिर भी मूल क्रिया को ‘बोए गए’ बनाकर नहीं खोला गया। हिन्दी में ‘बीज’ के रूप की दृष्टि से ‘गिरे’ स्वाभाविक है।
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: काँटेदार झाड़ियों के बीच
  rationale: ἐπί के साथ कर्मकारक का शाब्दिक अर्थ ‘पर’ हो सकता है, पर कृषि-संदर्भ में आशय उस स्थान से है जहाँ काँटेदार वनस्पतियाँ थीं। ‘के बीच’ आधुनिक हिन्दी में इस चित्र को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: ἀκάνθας / ἄκανθαι
  choice: काँटेदार झाड़ियाँ
  rationale: ἄκανθα काँटे अथवा काँटेदार पौधे को सूचित कर सकता है। यहाँ इनके उगने और बीजों को दबाने के कारण ‘काँटेदार झाड़ियाँ’ दृश्य को स्पष्ट और स्वाभाविक रखता है।
- source_word: ἀνέβησαν
  choice: बढ़ीं
  rationale: ἀναβαίνω का चित्र ऊपर आने या उगने का है। पौधों के लिए ‘बढ़ीं’ सहज हिन्दी है और ऊपर की ओर वृद्धि का भाव प्रसंग से स्पष्ट रहता है।
- source_word: ἔπνιξαν
  choice: दबा दिया
  rationale: πνίγω का मूल चित्र गला घोंटने या दम रोकने का है। वनस्पतियों के संदर्भ में ‘दबा दिया’ इस रूपक को स्वाभाविक हिन्दी में व्यक्त करता है, बिना परिणाम को अनावश्यक रूप से विस्तार दिए।
- source_word: αὐτά
  choice: बीजों को
  rationale: नपुंसकलिंग बहुवचन सर्वनाम पहले से निहित बीजों की ओर लौटता है। हिन्दी में कर्ता और कर्म दोनों के लिए बहुवचन सर्वनाम आने से अस्पष्टता होती, इसलिए संदर्भगत संज्ञा दोहराई गई है।
