id: MAT.13.35
reference: Matthew 13:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: hi
  text: 'ताकि भविष्यद्वक्ता के द्वारा कही गई यह बात पूरी हो:


    “मैं दृष्टान्तों में अपना मुँह खोलूँगा;

    नींव रखे जाने के समय से[a] छिपी हुई बातें कहूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “जगत की नींव रखे जाने के समय से” है।
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: ताकि … पूरी हो
  rationale: उद्देश्य/परिणाम का संबंध बनाए रखता है और मत्ती के पूर्ति-सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: भविष्यद्वक्ता के द्वारा कही गई यह बात
  rationale: διά के माध्यम/मध्यस्थता के भाव को सुरक्षित रखते हुए यूनानी कृदन्तीय रचना को स्पष्ट हिन्दी में प्रस्तुत करता है।
- source_word: ἐν παραβολαῖς
  choice: दृष्टान्तों में
  rationale: मत्ती में प्रयुक्त शिक्षण-विधा के प्रमुख शब्द और ἐν की अभिव्यक्ति को बनाए रखता है।
- source_word: Ἀνοίξω … τὸ στόμα μου
  choice: मैं … अपना मुँह खोलूँगा
  rationale: उद्धरण की काव्यात्मक देह-छवि को बिना सपाट परिभाषा में बदले सुरक्षित रखता है।
- source_word: ἐρεύξομαι
  choice: कहूँगा
  rationale: मूल क्रिया में बाहर निकालने/उच्चारित करने का भाव है; शाब्दिक ‘उगलूँगा’ आधुनिक हिन्दी में अनुपयुक्त अर्थ दे सकता है, इसलिए प्रसंगानुकूल और गरिमापूर्ण ‘कहूँगा’ चुना गया।
- source_word: κεκρυμμένα
  choice: छिपी हुई बातें
  rationale: संज्ञा के रूप में प्रयुक्त पूर्ण निष्क्रिय कृदन्त का परिणामगत भाव बनाए रखता है और इसे व्याख्यात्मक ‘रहस्य’ नहीं बनाता।
- source_word: ἀπὸ καταβολῆς
  choice: नींव डाले जाने के समय से
  rationale: καταβολή के नींव डालने/स्थापना के मूल रूपक और आरम्भ-बिंदु के कालगत अर्थ को सुरक्षित रखता है, पर मुख्य पाठ में अनुपस्थित κόσμου (‘जगत की’) नहीं जोड़ता।
theological_decisions:
- issue: भविष्यद्वक्ता की पहचान
  choice: केवल ‘भविष्यद्वक्ता’
  alternative: आसाप भविष्यद्वक्ता अथवा किसी अन्य नाम का स्पष्ट उल्लेख
  rationale: दिए गए यूनानी पाठ में किसी व्यक्ति का नाम नहीं है। इसलिए भजन 78:2 की ऐतिहासिक पहचान को मुख्य पाठ में जोड़कर उद्धरण-सूत्र का विस्तार नहीं किया गया।
- issue: ἀπὸ καταβολῆς में निहित स्थापना का क्षेत्र
  choice: नींव डाले जाने के समय से
  alternative: जगत की नींव डाले जाने के समय से
  rationale: मूल पाठ में κόσμου (‘जगत की’) नहीं है। सम्भावित निहित अर्थ को मुख्य पाठ में स्पष्ट करके वास्तविक पाठगत संक्षिप्तता और अस्पष्टता को समाप्त नहीं किया गया; विस्तृत पाठांतर पादटिप्पणी में दिया गया है।
- issue: ἐρεύξομαι की रूपकात्मक तीव्रता
  choice: कहूँगा
  alternative: उंडेलूँगा / उगलूँगा / प्रकट करूँगा
  rationale: ‘उंडेलूँगा’ और ‘उगलूँगा’ अधिक शाब्दिक पर आधुनिक हिन्दी में असहज हैं, जबकि ‘प्रकट करूँगा’ बोलने की क्रिया को व्याख्यात्मक प्रकाशन में बदल देता है। ‘कहूँगा’ मूल आशय को स्पष्ट और तटस्थ रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। उद्धरण की काव्यात्मक समानांतरता और ‘अपना मुँह खोलूँगा’ की बिंबात्मक अभिव्यक्ति सुरक्षित है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में संबंधित वाक्यांश के बाद उपस्थित है।
