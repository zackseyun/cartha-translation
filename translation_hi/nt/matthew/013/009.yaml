  text: The one who has ears[a], let him hear.
translation:
  language: hi
  text: जिसके कान हों, वह सुने।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: जिसके ... हों
  rationale: लेख के साथ वर्तमान कृदंत यहाँ संज्ञात्मक और सामान्य अर्थ में किसी भी ऐसे व्यक्ति को दर्शाता है जिसके पास कान हैं। हिन्दी का ‘जिसके ... हों’ इस सामान्य, एकवचन-सदृश प्रतिनिधि भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὦτα
  choice: कान
  rationale: यूनानी शब्द बहुवचन में है; ‘कान’ हिन्दी में उसी संख्या और इस प्रचलित मुहावरे को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἀκουέτω
  choice: वह सुन ले
  rationale: यह वर्तमान सक्रिय आज्ञार्थक, तीसरे पुरुष एकवचन का रूप है। ‘वह सुन ले’ हिन्दी में exhortatory आज्ञा को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है तथा ἀκούω के ‘सुनना’ अर्थ और ध्यानपूर्वक ग्रहण करने के निहित भाव दोनों को बनाए रखता है।
theological_decisions:
- issue: व्याकरणिक पुल्लिंग एकवचन का सामान्य मानवीय संदर्भ
  choice: जिसके कान हों, वह सुन ले।
  alternative: जिस किसी के कान हों, वह सुने।
  rationale: यूनानी में रूप व्याकरणिक रूप से पुल्लिंग एकवचन है, पर उसका संदर्भ सामान्य है। हिन्दी में ‘जिसके ... वह’ किसी भी व्यक्ति पर लागू होता है और अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता, साथ ही मूल का प्रतिनिधि एकवचन भाव बनाए रखता है।
translation_notes:
  register: आधुनिक, संक्षिप्त और गरिमापूर्ण मानक हिन्दी। वाक्य का लोकोक्तिपरक और आह्वानात्मक स्वर सुरक्षित रखा गया है; कोई पादटिप्पणी आवश्यक नहीं।
