lexical_decisions:
- source_word: Καὶ
  choice: तब
  rationale: यहाँ καί कथा को अगले प्रसंग की ओर बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी प्रवाह देता है, बिना कोई नई बात जोड़े।
- source_word: προσελθόντες
  choice: पास आकर
  rationale: यह अओरिस्ट कृदन्त यीशु की ओर आने और बोलने से पहले उसके निकट पहुँचने को व्यक्त करता है।
- source_word: οἱ μαθηταὶ
  choice: चेलों ने
  rationale: निश्चित उपपद पहले से परिचित चेलों के समूह की ओर संकेत करता है; यूनानी में ‘उसके’ स्पष्ट नहीं है।
- source_word: εἶπαν αὐτῷ
  choice: उससे कहा
  rationale: मूल क्रिया ‘कहा’ है और आगे सीधा प्रश्न आता है; यह हिन्दी में स्वाभाविक रहते हुए स्रोत के निकट है।
- source_word: Διὰ τί
  choice: क्यों
  rationale: यह कारण पूछने वाला सामान्य प्रश्नवाचक पद है।
- source_word: ἐν παραβολαῖς
  choice: दृष्टान्तों में
  rationale: ἐν के साथ बहुवचन यहाँ बोलने की रीति या माध्यम बताता है; ‘दृष्टान्तों में’ रूपक-कथाओं के द्वारा शिक्षा देने को व्यक्त करता है।
- source_word: λαλεῖς
  choice: बात करते हो
  rationale: वर्तमानकालीन क्रिया को सामान्य और सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: सम्प्रदान कारक यहाँ सम्बोधित श्रोताओं को दर्शाता है; हिन्दी में ‘बात करना’ के साथ ‘उनसे’ स्वाभाविक है।
