  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: hi
  text: 'युग के समापन पर ऐसा ही होगा: स्वर्गदूत निकलेंगे और दुष्टों को धर्मियों के बीच से अलग करेंगे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युग की पूर्णता पर।” परम्परागत अनुवादों में कभी-कभी “संसार के अन्त पर” मिलता है, लेकिन यूनानी शब्द αἰών का अर्थ यहाँ “युग” है, “संसार” नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ऐसा ही
  rationale: यह दृष्टान्त के परिणाम की ओर संकेत करता है और हिन्दी में स्वाभाविक ढंग से ‘इसी प्रकार’ का भाव व्यक्त करता है।
- source_word: ἔσται
  choice: होगा
  rationale: भविष्यकालीन कथन को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: युग के समापन पर
  rationale: συντέλεια की पूर्णता/समापन और αἰών के ‘युग’ अर्थ को सुरक्षित रखता है; इसे भौतिक संसार के विनाश के रूप में नहीं ठहराता।
- source_word: ἐξελεύσονται
  choice: निकलेंगे
  rationale: ἐξέρχομαι का सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: οἱ ἄγγελοι
  choice: स्वर्गदूत
  rationale: अन्तिम न्याय के इस प्रसंग में ἄγγελοι मानवीय संदेशवाहकों के बजाय स्वर्गीय दूतों को सूचित करता है।
- source_word: ἀφοριοῦσιν
  choice: अलग करेंगे
  rationale: मिश्रित समूह में से एक वर्ग को पृथक करने का अर्थ स्पष्ट और सहज रूप से देता है।
- source_word: τοὺς πονηροὺς
  choice: दुष्टों
  rationale: विशेषण के संज्ञात्मक प्रयोग को नैतिक रूप से बुरे व्यक्तियों के वर्ग के रूप में व्यक्त करता है।
- source_word: ἐκ μέσου τῶν δικαίων
  choice: धर्मियों के बीच से
  rationale: यह बताता है कि दुष्ट एक मिश्रित समूह के भीतर से अलग किए जाएंगे; ‘के बीच से’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: युगान्त-संबंधी वाक्यांश में αἰών का अर्थ
  choice: युग
  alternative: संसार
  rationale: यूनानी αἰών यहाँ वर्तमान युग/व्यवस्था को सूचित करता है, भौतिक जगत को नहीं; इसलिए ‘युग’ मूल की अर्थ-सीमा और सम्भावित धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
- issue: ἄγγελοι की पहचान
  choice: स्वर्गदूत
  alternative: दूत
  rationale: दृष्टान्त की अन्तिम न्याय-संबंधी व्याख्या में प्रसंग स्वर्गीय दूतों की ओर संकेत करता है; ‘स्वर्गदूत’ हिन्दी पाठक के लिए इस आशय को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में सहज। ‘समापन’ मूल के पूर्णता तक पहुँचने के भाव को बनाए रखता है, जबकि पादटिप्पणी ‘पूर्णता’ को वैकल्पिक रूप में देती है।
