base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: hi
  text: तब वह भीड़ को छोड़कर घर में गया। उसके चेले उसके पास आए और कहने लगे, “खेत के खरपतवारों[a] का दृष्टान्त हमें समझाइए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खेत के जंगली गेहूँ का दृष्टान्त”; यूनानी शब्द सम्भवतः डार्नेल नामक खरपतवार को दर्शाता है, जो गेहूँ जैसा दिखाई देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह अगले घटनाक्रम को आरम्भ करने वाला स्वाभाविक कालसूचक शब्द है।
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: भीड़ को छोड़कर
  rationale: पूर्वकालिक कृदन्त के क्रम को सहज हिन्दी में व्यक्त करता है; यूनानी बहुवचन हिन्दी के सामूहिक एकवचन ‘भीड़’ में स्वाभाविक है।
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: घर में गया
  rationale: बाहरी स्थान से घर के भीतर जाने की गति को प्रसंगानुकूल और स्वाभाविक रूप में व्यक्त करता है।
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: उसके चेले उसके पास आए
  rationale: προσέρχομαι का निकट आने का भाव और αὐτοῦ का सम्बन्ध दोनों स्पष्ट रहते हैं। ‘चेले’ सामान्य पाठकों के लिए प्रचलित बाइबलीय शब्द है।
- source_word: λέγοντες
  choice: कहने लगे
  rationale: मुख्य क्रिया के बाद आने वाले कृदन्त को हिन्दी की स्वाभाविक कथात्मक शैली में व्यक्त करता है।
- source_word: Διασάφησον ἡμῖν
  choice: अर्थ हमें समझाइए
  rationale: क्रिया का आशय किसी बात को स्पष्ट करके समझाना है; ‘अर्थ’ हिन्दी में अपेक्षित कर्म को सहज बनाता है, यद्यपि वह यूनानी में अलग संज्ञा के रूप में नहीं है। आदरसूचक आज्ञार्थक रूप यीशु को सम्बोधन के अनुरूप है।
- source_word: τὴν παραβολὴν
  choice: दृष्टान्त
  rationale: सुसमाचारों में παραβολή के लिए स्थापित, अर्थपूर्ण और व्यापक रूप से समझा जाने वाला हिन्दी पद है।
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: खेत के जंगली पौधों
  rationale: ζιζάνια हानिकारक खरपतवार, सम्भवतः गेहूँ जैसा दिखने वाला डार्नेल, दर्शाता है। मुख्य पाठ में सहज व्यापक पद रखा गया है और विशिष्टता पादटिप्पणी में सुरक्षित है।
