id: MAT.13.22
reference: Matthew 13:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: hi
  text: और जो काँटों के बीच बोया गया है, वह उस व्यक्ति को दर्शाता है जो वचन सुनता है; पर इस युग की चिंता[a] और धन का छल[b] वचन को दबा देते हैं, और वह निष्फल हो जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस संसार की चिंताएँ।” यूनानी में अधिक शाब्दिक अर्थ “इस युग की चिंता” है।
    reason: alternative_reading
  - marker: b
    text: या, “धन-संपत्ति का धोखा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: जो काँटों के बीच बोया गया
  rationale: यह रूपक की कृषि-संबंधी छवि को बनाए रखता है। पुल्लिंग एकवचन कृदंत आगे बताए गए सुनने वाले व्यक्ति की ओर संकेत करता है।
- source_word: ὁ τὸν λόγον ἀκούων
  choice: वह व्यक्ति है जो वचन सुनता है
  rationale: वर्तमान कृदंत को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है। λόγος के लिए ‘वचन’ प्रचारित संदेश और दृष्टांत की पारंपरिक शब्दावली—दोनों को बनाए रखता है।
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: इस युग की चिंता
  rationale: μέριμνα की चिंताग्रस्त परवाह का नकारात्मक भाव ‘चिंता’ से स्पष्ट होता है; αἰών के समयगत अर्थ को ‘युग’ सुरक्षित रखता है।
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: धन का छल
  rationale: यह संक्षिप्त और स्वाभाविक पद धन के भ्रामक तथा धोखा देने वाले स्वभाव को व्यक्त करता है।
- source_word: συμπνίγει
  choice: दबा देते हैं
  rationale: काँटों द्वारा पौधे को घेरकर बढ़ने और फलने से रोकने की छवि हिन्दी में स्वाभाविक ढंग से व्यक्त होती है; संयुक्त कर्ता के कारण बहुवचन क्रिया प्रयुक्त हुई है।
- source_word: ἄκαρπος γίνεται
  choice: वह निष्फल हो जाता है
  rationale: व्यक्तिगत सर्वनाम व्याख्या में बताए गए सुनने वाले व्यक्ति को संदर्भित करता है और यह संकेत नहीं देता कि वचन स्वयं अपने स्वभाव में निष्फल है। ‘निष्फल’ फल की रूपकात्मक छवि को बनाए रखता है।
theological_decisions:
- issue: αἰών का अनुवाद
  choice: इस युग
  alternative: इस संसार
  rationale: αἰών मुख्यतः काल या युग को दर्शाता है। ‘इस युग’ नए नियम में निहित समयगत और नैतिक तनाव को बनाए रखता है, जबकि प्रचलित वैकल्पिक अनुवाद पादटिप्पणी में दिया गया है।
- issue: अंतिम उपवाक्य का व्यक्तिगत अथवा अवैयक्तिक संदर्भ
  choice: वह निष्फल हो जाता है
  alternative: वह बोया हुआ बीज निष्फल हो जाता है / वचन निष्फल हो जाता है
  rationale: यीशु की व्याख्या बोए गए बीज की छवि को ‘वचन सुनने वाले’ व्यक्ति से जोड़ती है। व्यक्तिगत रूप इस व्याख्यात्मक परिवर्तन को सुरक्षित रखता और वचन में अंतर्निहित विफलता का अनावश्यक अर्थ टालता है।
- issue: समन्वित एकवचन कर्ताओं के साथ συμπνίγει का वचन
  choice: दबा देते हैं
  alternative: दबा देता है
  rationale: यूनानी में क्रिया एकवचन है, पर हिन्दी में ‘चिंता और छल’ संयुक्त कर्ता हैं, इसलिए बहुवचन क्रिया स्वाभाविक है। इससे दोनों के मिलकर वचन को दबाने का अर्थ स्पष्ट रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। ‘वचन,’ ‘युग’ और ‘निष्फल’ मूल की प्रमुख रूपकात्मक तथा धर्मवैचारिक शब्दावली को सुरक्षित रखते हैं। पादटिप्पणी [a] को अंग्रेज़ी परामर्श-पाठ में उसके भटके हुए स्थान के बजाय उसी पदबंध पर लगाया गया है जिससे वह संबंधित है।
