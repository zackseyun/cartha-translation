  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὴν γῆν τὴν καλὴν καὶ ἐδίδου καρπόν, ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: hi
  text: पर अन्य बीज अच्छी मिट्टी पर गिरे और फल दे रहे थे—किसी ने सौ गुना, किसी ने साठ गुना और किसी ने तीस गुना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλα
  choice: कुछ और बीज
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में पिछले संदर्भ के बीजों की ओर संकेत करता है; हिन्दी में ‘बीज’ स्पष्टता के लिए जोड़ा गया है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले निष्फल परिणामों के विपरीत अच्छे परिणाम को सामने लाता है।
- source_word: ἔπεσεν
  choice: गिरे
  rationale: यूनानी क्रिया का सीधा अर्थ ‘गिरना’ है; बोए जाने का अर्थ संदर्भ से स्पष्ट है, इसलिए मूल बिंब रखा गया है।
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: अच्छी मिट्टी पर
  rationale: खेती के संदर्भ में γῆ के लिए ‘मिट्टी’ स्वाभाविक है और καλὴν उपजाऊ अथवा उपयुक्त होने का भाव देता है।
- source_word: ἐδίδου καρπόν
  choice: फल देने लगे
  rationale: अपूर्ण भूतकाल ἐδίδου जारी प्रक्रिया को दर्शाता है; ‘देने लगे’ हिन्दी में उस प्रगतिशील परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: किसी ने सौ गुना, किसी ने साठ गुना और किसी ने तीस गुना
  rationale: वितरणात्मक यूनानी रचना अलग-अलग उपज बताती है। ‘किसी ने...किसी ने...किसी ने’ इसे सहज हिन्दी में व्यक्त करता है और ‘गुना’ उपज के अनुपात को स्पष्ट करता है।
