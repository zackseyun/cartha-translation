  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण कथा-शैली। “कहीं ऐसा न हो कि” चेतावनी की संभाव्यता बनाए रखता है और उसे निश्चित परिणाम नहीं बनाता।
