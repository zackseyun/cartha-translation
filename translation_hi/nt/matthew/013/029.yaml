base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: hi
  text: पर उसने कहा, “नहीं, कहीं ऐसा न हो कि खरपतवार[a] बटोरते समय तुम उनके साथ गेहूँ को भी जड़ से उखाड़ दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जंगली गेहूँ”; संभवतः “डार्नेल,” एक ऐसा खरपतवार जो आरम्भिक अवस्था में गेहूँ जैसा दिखाई दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: उसने कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथा-शैली में भूतकाल अधिक स्वाभाविक है।
- source_word: Οὔ
  choice: नहीं
  rationale: यह स्वामी का सीधा नकारात्मक उत्तर है।
- source_word: μήποτε
  choice: कहीं ऐसा न हो कि
  rationale: यह अनचाहे संभावित परिणाम की चेतावनी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συλλέγοντες
  choice: बटोरते समय
  rationale: कृदन्त मुख्य क्रिया के साथ-साथ होने वाली क्रिया बताता है; यह रूप उस समय-संबंध को स्पष्ट रखता है।
- source_word: ζιζάνια
  choice: जंगली पौधों
  rationale: यह सामान्य पाठक के लिए सहज है और गेहूँ जैसे दिखने वाले हानिकारक खरपतवार का संदर्भ देता है, जबकि अधिक विशिष्ट पहचान पादटिप्पणी में सुरक्षित है।
- source_word: ἐκριζώσητε
  choice: जड़ से उखाड़ दो
  rationale: क्रिया पौधे को जड़ों समेत निकालने का स्पष्ट अर्थ देती है।
- source_word: ἅμα αὐτοῖς
  choice: उनके साथ ... भी
  rationale: यह जंगली पौधों के साथ गेहूँ के भी अनजाने में उखड़ जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σῖτον
  choice: गेहूँ
  rationale: कृषि-संदर्भ और ζιζάνια के विरोध में यहाँ सामान्य अनाज की अपेक्षा गेहूँ अभिप्रेत है।
theological_decisions:
- issue: ζιζάνια की पहचान और प्रसिद्ध दृष्टान्त की पारंपरिक शब्दावली
  choice: मुख्य पाठ में “जंगली पौधे”
  alternative: “खरपतवार”, “जंगली गेहूँ” अथवा अधिक विशिष्ट रूप से “डार्नेल”
  rationale: मूल शब्द गेहूँ के बीच उगने वाले हानिकारक पौधों को सूचित करता है, संभवतः डार्नेल को; किन्तु वनस्पति-विशेष की पहचान पूर्णतः निश्चित नहीं है। इसलिए पठनीय सामान्य अभिव्यक्ति मुख्य पाठ में और विशिष्ट संभावना पादटिप्पणी में रखी गई है।
