base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: hi
  text: पर यीशु ने उन्हें उत्तर दिया, “मैं भी तुमसे एक प्रश्न[क] पूछूँगा। यदि तुम मुझे उसका उत्तर दोगे, तो मैं भी तुम्हें बताऊँगा कि मैं ये काम किस अधिकार से करता हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “एक बात” अथवा “एक विषय।” यूनानी λόγον ἕνα का अर्थ किसी प्रश्न या चर्चा के विषय से भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: पर यीशु ने उन्हें उत्तर दिया
  rationale: ἀποκριθεὶς और εἶπεν की संयुक्त कथात्मक अभिव्यक्ति को हिन्दी में स्वाभाविक रूप से एक ही वाक्यांश में रखा गया है; δέ का हल्का विरोध यहाँ ‘पर’ से व्यक्त होता है।
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: मैं भी तुमसे ... पूछूँगा
  rationale: भविष्यकाल और κἀγώ के पारस्परिक बल को ‘मैं भी’ से सुरक्षित रखा गया है।
- source_word: λόγον ἕνα
  choice: एक प्रश्न
  rationale: λόγος का मूल अर्थ ‘बात/वचन’ हो सकता है, पर इस प्रश्नोत्तर प्रसंग में ‘एक प्रश्न’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: यदि तुम मुझे उसका उत्तर दोगे
  rationale: शाब्दिक ‘यदि तुम मुझसे कहोगे’ की अपेक्षा यह हिन्दी में प्रत्युत्तर देने का आशय स्पष्ट करता है और शर्त को बनाए रखता है।
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: तो मैं भी तुम्हें बताऊँगा
  rationale: दूसरे κἀγώ की पारस्परिकता को ‘मैं भी’ से दोहराया गया है; ἐρῶ के लिए ‘बताऊँगा’ स्वाभाविक है।
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: किस अधिकार से
  rationale: ἐν यहाँ कार्य के अधिकारगत आधार को दर्शाता है; हिन्दी में ‘किस अधिकार से’ प्रचलित और सटीक अभिव्यक्ति है।
- source_word: ταῦτα ποιῶ
  choice: मैं ये काम ... करता हूँ
  rationale: ταῦτα का बहुवचन ‘ये काम’ से और ποιῶ का सामान्य वर्तमान ‘करता हूँ’ से व्यक्त किया गया है।
