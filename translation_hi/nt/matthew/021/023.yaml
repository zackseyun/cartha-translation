revisions:
- from: जब वह मंदिर[a] में आया और शिक्षा दे रहा था, तब प्रधान याजक और लोगों के बुज़ुर्ग अगुवे उसके पास आए और बोले, “तुम ये काम किस अधिकार से करते हो? और यह अधिकार तुम्हें किसने दिया?”
  to: वह मंदिर[a] में आया। जब वह शिक्षा दे रहा था, तब प्रधान याजक और लोगों के बुज़ुर्ग अगुवे उसके पास आकर बोले, “तुम ये काम किस अधिकार से करते हो? और यह अधिकार तुम्हें किसने दिया?”
  rationale: Opening the verse with a separate sentence for Jesus’ arrival and attaching ‘जब वह शिक्षा दे रहा था’ directly to the leaders’ approach preserves the Greek participle’s contemporaneous force clearly. No change in meaning, terminology, register, or footnote content is otherwise needed.
