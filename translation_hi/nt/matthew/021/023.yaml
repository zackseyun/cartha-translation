id: MAT.21.23
reference: Matthew 21:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: hi
  text: वह मंदिर[a] में आया। जब वह शिक्षा दे रहा था, तब प्रधान याजक और लोगों के बुज़ुर्ग अगुवे उसके पास आकर बोले, “तुम ये काम किस अधिकार से करते हो? और यह अधिकार तुम्हें किसने दिया?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द ἱερόν से आशय पूरे मंदिर-परिसर से है, केवल भीतरी पवित्र भवन से नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: जब वह … आया
  rationale: यह संबंधवाचक कर्तृवाच्य प्रयोग समय का बोध कराता है। ‘जब वह आया’ क्रम को स्वाभाविक हिंदी में रखता है, बिना तात्कालिकता को आवश्यकता से अधिक स्पष्ट किए।
- source_word: ἱερὸν
  choice: मंदिर[a]
  rationale: ἱερόν पूरे मंदिर-परिसर को सूचित करता है, केवल भीतरी पवित्र भवन को नहीं। मुख्य पाठ में सहज ‘मंदिर’ रखा गया है और अर्थ-सीमा पादटिप्पणी में स्पष्ट की गई है।
- source_word: προσῆλθον αὐτῷ
  choice: उसके पास आए
  rationale: यह भौतिक रूप से निकट आने को व्यक्त करता है और आधुनिक हिंदी में स्वाभाविक है।
- source_word: διδάσκοντι
  choice: शिक्षा दे रहा था
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ-साथ चल रही गतिविधि बताता है; हिंदी का अपूर्ण प्रगतिशील रूप इस समकालिकता को स्पष्ट रखता है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: बहुवचन पद तत्कालीन प्रमुख याजकीय अधिकारियों को सूचित करता है, न कि एक ही समय में अनेक महायाजकों को।
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: लोगों के बुज़ुर्ग अगुवे
  rationale: πρεσβύτεροι यहाँ केवल अधिक आयु वालों के बजाय समुदाय के मान्य वरिष्ठ नेताओं के लिए है। ‘बुज़ुर्ग अगुवे’ उम्र/वरिष्ठता और नेतृत्व, दोनों भावों को आधुनिक पाठक के लिए स्पष्ट करता है।
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: किस अधिकार से
  rationale: यह प्रश्न यीशु के कार्यों की वैध अनुमति और अधिकार के आधार को चुनौती देता है; ‘किस अधिकार से’ हिंदी में सटीक और मुहावरेदार है।
- source_word: ταῦτα ποιεῖς
  choice: तुम ये काम … करते हो
  rationale: वर्तमान काल को प्रत्यक्ष चुनौती के स्वाभाविक हिंदी रूप में रखा गया है; ‘ये काम’ निकट संदर्भ के अनेक कार्यों की ओर संकेत बनाए रखता है।
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: यह अधिकार तुम्हें किसने दिया
  rationale: अओरिस्ट ἔδωκεν अधिकार प्रदान किए जाने की घटना को बताता है; हिंदी का सामान्य भूतकाल इसे सहज रूप में व्यक्त करता है।
theological_decisions:
- issue: अगुवों की चुनौती में ἐξουσία का अर्थ
  choice: अधिकार
  alternative: हक़; सामर्थ्य
  rationale: संदर्भ में प्रश्न केवल शक्ति का नहीं, बल्कि यीशु के कार्य और शिक्षा की वैध प्राधिकृति का है। ‘अधिकार’ संस्थागत और धर्मवैचारिक दोनों संभावनाएँ खुली रखता है तथा यह तय नहीं करता कि वह अधिकार किस स्रोत से है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्रधान याजक’ स्थापित धार्मिक पदनाम है; ‘लोगों के बुज़ुर्ग अगुवे’ अपेक्षाकृत पुराने ‘पुरनिए’ से बचते हुए समुदाय में उनकी वरिष्ठ नेतृत्वकारी भूमिका बताता है। प्रत्यक्ष कथन में ‘तुम’ टकरावपूर्ण प्रसंग के अनुकूल स्वाभाविक हिंदी है।
