  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: hi
  text: जब उसने यरूशलेम में प्रवेश किया, तो सारे नगर में हलचल मच गई[a] और लोग कहने लगे, “यह कौन है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हिल उठा।” यूनानी क्रिया का अर्थ भौतिक रूप से हिलना भी हो सकता है, पर यहाँ वह लोगों में मची हलचल और व्याकुलता को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: जब वह … आया
  rationale: संबंधकारक निरपेक्ष रचना को स्वाभाविक हिन्दी की कालवाचक उपवाक्य-रचना में व्यक्त किया गया है; इससे प्रवेश और नगर की प्रतिक्रिया का समय-संबंध बना रहता है।
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: ἐσείσθη
  choice: हलचल से भर गया
  rationale: क्रिया का मूल अर्थ ‘हिलाना/हिलना’ है, पर यहाँ पूरे नगर की सार्वजनिक व्याकुलता और उत्तेजना का रूपकात्मक भाव है। यह हिन्दी प्रयोग उसी भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πᾶσα ἡ πόλις
  choice: सारा नगर
  rationale: समूचे नगर, अर्थात नगरवासियों की सामूहिक प्रतिक्रिया, को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: λέγουσα
  choice: और कहने लगा
  rationale: कृदंत ‘नगर’ से संबद्ध है। एकवचन सामूहिक संज्ञा के साथ ‘कहने लगा’ स्वाभाविक है और आगे के प्रश्न को बिना अनावश्यक व्याख्या के प्रस्तुत करता है।
- source_word: Τίς ἐστιν οὗτος;
  choice: यह कौन है?
  rationale: यूनानी प्रश्न का सीधा और स्वाभाविक अनुवाद; मूल में निहित न होने के कारण ‘मनुष्य’ या ‘व्यक्ति’ नहीं जोड़ा गया।
theological_decisions:
- issue: नगर की प्रतिक्रिया में शाब्दिक या रूपकात्मक अर्थ
  choice: ἐσείσθη को रूपकात्मक रूप से ‘हलचल से भर गया’ अनूदित किया गया।
  alternative: ‘हिल उठा’
  rationale: संदर्भ यीशु के प्रवेश पर नगर की सामूहिक व्याकुलता का है, भौतिक भूकंप का नहीं। मुख्य पाठ अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी मूल रूपक की जानकारी सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। ‘सारा नगर’ सामूहिक अर्थ में प्रयुक्त है, इसलिए ‘कहने लगा’ रखा गया है।
