  edition: SBLGNT
  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: hi
  text: वे गधी और बछेड़े को ले आए। उन्होंने उन पर अपने कपड़े रखे, और यीशु उन पर बैठ गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: ले आए
  rationale: ἄγω यहाँ पशुओं को यीशु के पास लाने का बोध देता है; ‘ले आए’ आधुनिक हिन्दी में स्वाभाविक है और अगुवाई करके लाने की क्रिया को समेटता है।
- source_word: τὴν ὄνον
  choice: गधी
  rationale: स्त्रीलिंग लेख और निकट संदर्भ पशु को मादा गधा बताते हैं; ‘गधी’ संक्षिप्त, स्पष्ट और सहज हिन्दी है।
- source_word: τὸν πῶλον
  choice: उसके बच्चे
  rationale: πῶλος युवा पशु को दर्शाता है और यहाँ गधी का बच्चा अभिप्रेत है। संबंधसूचक ‘उसके’ हिन्दी में दोनों पशुओं का संबंध स्पष्ट करता है।
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: उन्होंने उन पर अपने कपड़े रखे
  rationale: ἱμάτια बाहरी वस्त्रों के लिए प्रयुक्त है। ‘कपड़े’ साधारण पाठक के लिए स्वाभाविक है; ‘अपने’ शिष्यों के स्वामित्व को संदर्भ से स्पष्ट करता है। बहुवचन ‘उन पर’ दोनों पशुओं की ओर संकेत बनाए रखता है।
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: यीशु उन पर बैठ गए
  rationale: मूल पाठ का अंतिम αὐτῶν बहुवचन है और उसका निकट पूर्वपद पशु अथवा उन पर रखे कपड़े हो सकते हैं। ‘उन पर’ इस वास्तविक अस्पष्टता को बिना सुलझाए सुरक्षित रखता है; हिन्दी में स्पष्टता के लिए कर्ता का नाम दिया गया है।
theological_decisions:
- issue: ἐπεκάθισεν ἐπάνω αὐτῶν में अंतिम बहुवचन αὐτῶν का संदर्भ
  choice: मुख्य पाठ में ‘उन पर’ रखकर बहुवचन और संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
  alternative: ‘यीशु उन कपड़ों पर बैठ गए’ अथवा भावार्थतः किसी एक पशु पर बैठना।
  rationale: यह मुख्यतः वाक्यरचनात्मक और कथात्मक अस्पष्टता है, कोई आवश्यक सिद्धान्तगत निष्कर्ष नहीं। मुख्य पाठ मूल के बहुवचन को बनाए रखता है, जबकि पादटिप्पणी कपड़ों को पूर्वपद मानने की विशिष्ट सम्भावना बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘गधी’ लिंग को स्पष्ट रखता है; ‘कपड़े’ अत्यधिक साहित्यिक ‘वस्त्र’ की अपेक्षा अधिक जनसुलभ है। मूल यूनानी की असामान्य बहुवचन अभिव्यक्ति को जानबूझकर मुख्य पाठ में सुरक्षित रखा गया है।
