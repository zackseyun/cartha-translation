  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: hi
  text: और जो इस पत्थर पर गिरेगा, वह चकनाचूर हो जाएगा; पर जिस किसी पर यह गिरेगा, उसे यह पीसकर चूर कर देगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक सजीव रूप में, “उसे पीसकर चूर्ण कर देगा” या “भूसी की तरह बिखेर देगा।”
    reason: lexical_alternative
  - marker: b
    text: मत्ती की कुछ प्राचीन पांडुलिपियों में यह पूरा वचन नहीं मिलता; इसकी समानांतर उक्ति लूका 20:18 में है।
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: जो ... गिरेगा
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत किसी भी ऐसे व्यक्ति को सामान्य रीति से दर्शाता है; हिन्दी का संबंधवाचक-वाक्य स्वाभाविक रूप से यह अर्थ व्यक्त करता है।
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: इस पत्थर पर
  rationale: स्थान-संबंधी अर्थ को सीधे रखता है और निकटवर्ती संदर्भ में λίθος की ठोस पत्थर-छवि बनाए रखता है।
- source_word: συνθλασθήσεται
  choice: चकनाचूर हो जाएगा
  rationale: भविष्यत् कर्मवाच्य में गंभीर रूप से टूट जाने का अर्थ है; यह हिन्दी में प्रबल और स्वाभाविक है, जबकि अगले क्रियापद की सक्रिय कुचलने वाली छवि भी अलग बनी रहती है।
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: पर जिस किसी पर यह गिरेगा
  rationale: अनिश्चित संबंधवाचक रचना का खुला, सामान्य अर्थ बनाए रखता है और प्रहार की दिशा उलटने को स्पष्ट करता है—अब पत्थर गिरने वाला कर्ता है।
- source_word: λικμήσει
  choice: कुचलकर चूर कर देगा
  rationale: क्रियापद में कुचलने, चूर्ण करने अथवा भूसी की तरह बिखेरने की तीव्र छवि हो सकती है; यह चयन उस तीव्रता को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: αὐτόν
  choice: उसे
  rationale: एकवचन व्यक्ति की ओर लौटने वाला स्वाभाविक हिन्दी सर्वनाम है; हिन्दी में यह लिंग को अनावश्यक रूप से स्पष्ट किए बिना स्रोत का एकवचन बनाए रखता है।
theological_decisions:
- issue: पत्थर की छवि और न्याय का रूपक
  choice: पत्थर की ठोस भाषा और दोनों भिन्न क्रियाओं सहित न्याय की छवि को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: मुख्य पाठ में पत्थर को स्पष्ट रूप से मसीह/यीशु कहना, अथवा दोनों क्रियाओं को विनाश के एक ही सामान्य शब्द में मिला देना।
  rationale: आस-पास का संदर्भ पत्थर की पहचान की ओर संकेत करता है, पर इस वचन की कहावत-सदृश भाषा को स्वयं बोलने देना चाहिए; अनुवाद व्याख्या को मुख्य पाठ में नहीं जोड़ता।
- issue: पाठांतर
  choice: वचन को मुख्य पाठ में रखा गया है और उसकी पांडुलिपीय अनुपस्थिति को पादटिप्पणी में बताया गया है।
  alternative: कुछ प्राचीन साक्ष्यों के आधार पर वचन को मुख्य पाठ से निकाल देना।
  rationale: SBLGNT इसे संदेहसूचक चिह्नों के भीतर देता है; इसलिए पाठ को प्रस्तुत करते हुए वास्तविक पाठालोचनात्मक अनिश्चितता स्पष्ट करना उचित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। “चकनाचूर” और “कुचलकर चूर” दोनों क्रियाओं की तीव्रता तथा उनके बीच का अंतर बनाए रखते हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ के अंत में दिए गए हैं; [a] पहले क्रियापद के वैकल्पिक निर्वचन और [b] पूरे वचन के पाठांतर से संबंधित है।
