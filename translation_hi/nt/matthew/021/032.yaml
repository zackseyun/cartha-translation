source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: hi
  text: क्योंकि यूहन्ना धार्मिकता के मार्ग में[a] तुम्हारे पास आया, और तुमने उसकी बात पर विश्वास नहीं किया; पर चुंगी लेने वालों और वेश्याओं ने उसकी बात पर विश्वास किया। और तुमने यह देखकर भी बाद में अपना मन नहीं बदला कि उसकी बात पर विश्वास करते।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धार्मिक रीति से” अथवा “धार्मिकता के मार्ग पर।” यूनानी वाक्यांश यूहन्ना के जीवन और सेवा के ढंग या उसके द्वारा बताए गए धार्मिकता के मार्ग—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “तुमने बाद में भी पछताकर उसकी बात पर विश्वास नहीं किया।” यहाँ प्रयुक्त यूनानी क्रिया सामान्यतः ‘मन फिराने’ के लिए प्रयुक्त क्रिया से भिन्न है और विशेष रूप से मन बदलने या पछताने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ
  choice: क्योंकि ... आया
  rationale: यह पिछले कथन का कारण स्पष्ट करता है; γάρ के तर्कात्मक संबंध को ‘क्योंकि’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἰωάννης πρὸς ὑμᾶς
  choice: यूहन्ना तुम्हारे पास
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया और πρός का दिशात्मक भाव ‘तुम्हारे पास’ से व्यक्त किया गया।
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: धार्मिकता के मार्ग पर चलते हुए
  rationale: ‘मार्ग’ का रूपक बनाए रखते हुए वाक्य को सहज हिन्दी बनाया गया है; यह यूहन्ना के आचरण/सेवा और उसके घोषित मार्ग—दोनों की संभावना खुली रखता है।
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: उसकी बात पर विश्वास नहीं किया / उसकी बात पर विश्वास किया
  rationale: πιστεύω के साथ संप्रदान कारक यहाँ यूहन्ना और उसके संदेश पर विश्वास/भरोसा करने का भाव देता है। ‘उसकी बात पर’ हिन्दी में स्वाभाविक है और ‘उस पर विश्वास’ से उत्पन्न संभावित अधिक विकसित धर्मवैज्ञानिक अर्थ को नहीं थोपता।
- source_word: οἱ τελῶναι
  choice: चुंगी लेने वाले
  rationale: रोमी संदर्भ के कर-संग्रहकर्ताओं के लिए स्पष्ट और हिन्दी बाइबल-पाठकों में परिचित पद।
- source_word: αἱ πόρναι
  choice: वेश्याएँ
  rationale: मूल शब्द का सीधा, वर्तमान और सामाजिक-नैतिक बल बनाए रखने वाला समतुल्य।
- source_word: ἰδόντες
  choice: यह देखकर भी
  rationale: कृदंत का कालिक और concessive भाव व्यक्त करता है; ‘यह’ निकटवर्ती तथ्य—चुंगी लेने वालों और वेश्याओं के विश्वास—की ओर संकेत करता है।
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: बाद में न बदले
  rationale: μεταμέλομαι के मन बदलने/पछताने के भाव को सामान्य μετανοέω के पारिभाषिक ‘मन फिराना’ में मिलाए बिना संक्षेप में व्यक्त करता है।
- source_word: τοῦ πιστεῦσαι αὐτῷ
  choice: कि उसकी बात पर विश्वास करते
  rationale: 'फल अथवा उद्देश्य की ओर संकेत करने वाली रचना को स्वाभाविक हिन्दी में रखा गया है: अपेक्षित बदलाव ऐसा होता जो विश्वास तक ले जाता।'
theological_decisions:
- issue: δικαιοσύνη का अर्थ
  choice: धार्मिकता
  alternative: न्याय; सही आचरण
  rationale: मत्ती के इस संदर्भ में यह परमेश्वर की इच्छा के अनुरूप सही मार्ग/आचरण का व्यापक भाव देता है; केवल सामाजिक ‘न्याय’ तक सीमित नहीं है।
- issue: πιστεύω αὐτῷ का अनुवाद
  choice: उसकी बात पर विश्वास करना
  alternative: उस पर भरोसा करना; उस पर विश्वास करना
  rationale: संदर्भ यूहन्ना की गवाही और बुलाहट के प्रति प्रतिक्रिया का है। चुना हुआ रूप व्यक्ति और संदेश के संबंध को व्यक्त करता है, पर ‘उस पर विश्वास’ की अधिक विशिष्ट धर्मवैज्ञानिक शब्दावली नहीं जोड़ता।
- issue: μεταμέλομαι का अनुवाद
  choice: बदलना
  alternative: पछताना; मन फिराना
  rationale: यहाँ प्रयुक्त क्रिया μετανοέω नहीं है। इसलिए ‘बदले’ मनोवृत्ति में परिवर्तन का भाव रखता है, जबकि टिप्पणी में पछताने की वैकल्पिक छाया सुरक्षित की गई है।
- issue: ἐν ὁδῷ δικαιοσύνης की व्याख्यात्मक सीमा
  choice: धार्मिकता के मार्ग पर चलते हुए
  alternative: धार्मिक रीति से; धार्मिकता का मार्ग दिखाते हुए
  rationale: मूल वाक्यांश यूहन्ना की जीवन-पद्धति/सेवा अथवा उसके घोषित धर्ममय मार्ग की ओर संकेत कर सकता है। मुख्य पाठ और पादटिप्पणी इस अस्पष्टता को खुला रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘यूहन्ना’, ‘धार्मिकता’, ‘चुंगी लेने वाले’ और ‘वेश्याएँ’ जैसे परिचित किंतु वर्तमान हिन्दी रूप अपनाए गए हैं। वाक्य की तीखी तुलना और संबोधित लोगों पर बल ‘तुम यह देखकर भी’ से बनाए रखा गया है।
