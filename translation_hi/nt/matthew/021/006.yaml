base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/006.yaml
  text: So the disciples went and did just as Jesus had instructed them[a].
translation:
  language: hi
  text: तब चेलों ने जाकर ठीक वैसा ही किया, जैसा यीशु ने उन्हें निर्देश दिया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आज्ञा दी थी।” यूनानी क्रिया आदेश या निर्देश देने का अर्थ रख सकती है; यहाँ प्रसंग में “निर्देश दिया था” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: जाकर
  rationale: यह अओरिस्ट कृदंत मुख्य कार्य से पहले हुई गति को व्यक्त करता है; हिंदी में ‘जाकर’ स्वाभाविक रूप से क्रम और संबंध दोनों बनाए रखता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को आगे बढ़ाता और पिछले निर्देश के बाद की प्रतिक्रिया दिखाता है; ‘तब’ आधुनिक हिंदी में इस क्रम को सहजता से व्यक्त करता है।
- source_word: οἱ μαθηταὶ
  choice: चेलों ने
  rationale: सुसमाचारों में μαθηταί के लिए ‘चेले’ प्रचलित, सहज और प्रसंगानुकूल शब्द है; कर्ता परसर्ग ‘ने’ के साथ बहुवचन रूप प्रयुक्त हुआ है।
- source_word: ποιήσαντες
  choice: किया
  rationale: दूसरा अओरिस्ट कृदंत पहले कृदंत के साथ मिलकर यीशु के निर्देश के अनुरूप किए गए कार्य को बताता है; हिंदी में ‘जाकर ... किया’ स्वाभाविक कथात्मक संरचना है।
- source_word: καθὼς
  choice: ठीक वैसा ही ... जैसा
  rationale: καθώς निर्देश और कार्य के बीच अनुरूपता पर बल देता है; यह हिंदी संरचना उस पूर्ण अनुरूपता को स्पष्ट और सहज रखती है।
- source_word: συνέταξεν
  choice: निर्देश दिया था
  rationale: συντάσσω आदेश देने या निर्देश देने दोनों अर्थ रख सकता है। तत्काल प्रसंग में यीशु द्वारा दिए गए विस्तृत निर्देशों के कारण ‘निर्देश दिया था’ उपयुक्त है, जबकि पादटिप्पणी ‘आज्ञा दी थी’ की वास्तविक संभावना सुरक्षित रखती है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: यह अप्रत्यक्ष कर्म है और हिंदी में ‘निर्देश दिया’ के साथ स्वाभाविक रूप से ‘उन्हें’ आता है।
- source_word: ὁ Ἰησοῦς
  choice: यीशु
  rationale: लेख सहित यूनानी व्यक्तिवाचक नाम का हिंदी में सामान्य और प्रचलित रूप ‘यीशु’ है।
