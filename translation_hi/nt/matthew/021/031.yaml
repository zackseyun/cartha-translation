id: MAT.21.31
reference: Matthew 21:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: hi
  text: “उन दोनों में से किसने पिता की इच्छा पूरी की?” उन्होंने कहा, “पहले वाले ने।” यीशु ने उनसे कहा, “मैं तुमसे सच कहता हूँ, कर-वसूलने वाले और वेश्याएँ तुमसे आगे परमेश्वर के राज्य में जा रहे हैं[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुमसे पहले परमेश्वर के राज्य में प्रवेश कर रहे हैं।” यूनानी में शाब्दिक भाव “तुमसे आगे जा रहे हैं” है; इससे उनकी अग्रता पर ज़ोर पड़ता है, पर यह आवश्यक रूप से नहीं कहता कि दूसरे अंततः प्रवेश नहीं करेंगे।
    reason: प्रोάγουσιν की गति-छवि, प्रवेश की वैकल्पिक अभिव्यक्ति और उससे जुड़ी धर्मवैचारिक अस्पष्टता को स्पष्ट करना।
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: उन दोनों में से किसने
  rationale: ἐκ के अंशवाचक भाव को स्वाभाविक आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  choice: पिता की इच्छा पूरी की
  rationale: ποιέω और θέλημα के मेल का स्वाभाविक हिन्दी रूप; प्रसंग के पिता को बनाए रखता है और सीधे परमेश्वर के रूप में नहीं पहचानता।
- source_word: Ὁ πρῶτος
  choice: पहले वाले ने
  rationale: यूनानी के संक्षिप्त, अध्याहृत उत्तर को हिन्दी में स्पष्ट और सहज बनाता है।
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यीशु की गंभीर उद्घोषणात्मक उक्ति का अर्थ आधुनिक, सुबोध हिन्दी में व्यक्त करता है।
- source_word: τελῶναι
  choice: कर-वसूलने वाले
  rationale: रोमी व्यवस्था के अधीन राजस्व वसूलने वालों के लिए स्पष्ट आधुनिक पद है और उनकी सामाजिक भूमिका बताता है।
- source_word: πόρναι
  choice: वेश्याएँ
  rationale: यह πόρναι का विशिष्ट, वर्तमान और गैर-पुरातन हिन्दी समतुल्य है; व्यापक ‘अनैतिक स्त्रियाँ’ की अपेक्षा अधिक सटीक है।
- source_word: προάγουσιν ὑμᾶς
  choice: तुमसे आगे ... जा रहे हैं
  rationale: वर्तमान काल और आगे जाने की मूल गति-छवि बनाए रखता है, बिना यह निश्चित किए कि संबोधित लोग अंततः बाहर ही रहेंगे।
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर के राज्य में
  rationale: εἰς की दिशात्मकता और βασιλεία τοῦ θεοῦ की मानक धर्मवैचारिक अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: प्रोआगूसिन (προάγουσιν) का बल और राज्य में प्रवेश
  choice: तुमसे आगे परमेश्वर के राज्य में जा रहे हैं
  alternative: तुमसे पहले परमेश्वर के राज्य में प्रवेश कर रहे हैं
  rationale: मुख्य पाठ ‘आगे जाने’ की यूनानी छवि और प्राथमिकता को बनाए रखता है; यह चेतावनी की तीव्रता को रखता है, पर संबोधित लोगों के अंतिम बहिष्कार को पाठ से अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ‘कर-वसूलने वाले’ सामान्य पाठक के लिए स्पष्ट है, और ‘पहले वाले ने’ यूनानी के संक्षिप्त उत्तर को स्वाभाविक हिन्दी देता है।
