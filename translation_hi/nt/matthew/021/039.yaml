  text: καὶ λαβόντες αὐτὸν ἐξέβαλον ἔξω τοῦ ἀμπελῶνος καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: hi
  text: उन्होंने उसे पकड़कर दाख की बारी से बाहर फेंक दिया[a] और मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, बाहर निकाल दिया।
    reason: ἐκβάλλω के लिए एक कम चित्रात्मक, पर वैध शाब्दिक विकल्प।
lexical_decisions:
- source_word: λαβόντες (λαμβάνω)
  choice: पकड़कर
  rationale: यह एओरिस्ट कृदंत अगले कार्यों से जुड़ा है। इस हिंसक प्रसंग में ‘पकड़कर’ स्वाभाविक है और कार्यों का क्रम बनाए रखता है; ‘झपटकर पकड़ लिया’ जैसी अभिव्यक्ति मूल से अधिक बल जोड़ती।
- source_word: ἐξέβαλον (ἐκβάλλω)
  choice: बाहर फेंक दिया
  rationale: यहाँ क्रिया दाख की बारी से शारीरिक रूप से बाहर किए जाने को व्यक्त करती है। ‘बाहर फेंक दिया’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: दाख की बारी से बाहर
  rationale: यह पदबंध दाख की बारी के भीतर से बाहर की ओर गति दर्शाता है; ‘से बाहर’ हिन्दी में इस गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀμπελῶνος (ἀμπελών)
  choice: दाख की बारी
  rationale: ἀμπελών का सामान्य और सटीक हिन्दी अर्थ ‘दाख की बारी’ है।
- source_word: ἀπέκτειναν (ἀποκτείνω)
  choice: मार डाला
  rationale: यह मूल क्रिया के ‘जान से मार देना’ अर्थ को सीधी, स्वाभाविक हिन्दी में व्यक्त करता है; ‘हत्या कर दी’ नैतिक-कानूनी अर्थ को अधिक स्पष्ट करके मूल से आगे जा सकता है।
theological_decisions:
- issue: समानांतर वृत्तांतों की तुलना में बाहर फेंकने और मार डालने का क्रम
  choice: पहले उसे दाख की बारी से बाहर फेंका गया, फिर मार डाला गया।
  alternative: मरकुस और लूका के समानांतर वृत्तांतों के अनुरूप क्रम बदलना या अस्पष्ट करना।
  rationale: 'मत्ती के यूनानी पाठ में क्रियाओं का क्रम स्पष्ट है: उसे पकड़कर बाहर फेंका और मार डाला। अनुवाद समानांतर वृत्तांतों से सामंजस्य बैठाने के लिए मत्ती के अपने क्रम को नहीं बदलता।'
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दाख की बारी’ बाइबिलीय संदर्भ में प्रचलित होने के साथ सामान्य पाठक के लिए भी बोधगम्य है।
