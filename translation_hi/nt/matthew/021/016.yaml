source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: hi
  text: उन्होंने उससे कहा, “क्या तुम सुन रहे हो कि ये क्या कह रहे हैं?” पर यीशु उनसे कहते हैं, “हाँ। क्या तुमने कभी नहीं पढ़ा, ‘तूने नन्हे बच्चों और दूध पीते शिशुओं के मुँह से स्तुति तैयार की है’?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यीशु भजन 8:2 को यूनानी पवित्रशास्त्रीय परंपरा के अनुसार उद्धृत कर रहे हैं। इब्रानी पाठ का सामान्य अनुवाद है, “तूने नन्हे बच्चों और दूध पीते शिशुओं के मुँह से सामर्थ्य स्थापित किया है।”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: क्या तुम सुन रहे हो
  rationale: वर्तमानकालीन सीधे प्रश्न और यीशु को दी गई चुनौती, दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: τί οὗτοι λέγουσιν
  choice: ये क्या कह रहे हैं
  rationale: वर्तमानकाल की जारी क्रिया को व्यक्त करता है और οὗτοι के कुछ तिरस्कारपूर्ण संकेत को बिना कोई संज्ञा जोड़े सुरक्षित रखता है।
- source_word: λέγει
  choice: कहते हैं
  rationale: मत्ती के ऐतिहासिक वर्तमान को जीवंत वर्णन के रूप में बनाए रखता है।
- source_word: Ναί
  choice: हाँ
  rationale: सरल और सीधा स्वीकारात्मक उत्तर।
- source_word: οὐδέποτε ἀνέγνωτε
  choice: क्या तुमने कभी नहीं पढ़ा
  rationale: पवित्रशास्त्र से परिचित होने पर प्रश्न उठाने वाला ताड़नापूर्ण अलंकारिक प्रश्न स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: Ἐκ στόματος
  choice: मुँह से
  rationale: यूनानी पूर्वसर्गीय वाक्यांश का स्वाभाविक हिन्दी समतुल्य।
- source_word: νηπίων
  choice: नन्हे बच्चों
  rationale: बहुत छोटे बच्चों का अर्थ देता है और साथ आने वाले θηλαζόντων से पर्याप्त भेद रखता है।
- source_word: θηλαζόντων
  choice: दूध पीते शिशुओं
  rationale: दूध पीने की क्रिया और शिशु-अवस्था की छवि को स्पष्ट आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: κατηρτίσω
  choice: तैयार की है
  rationale: मत्ती में उद्धृत यूनानी पाठ के ‘तैयार/सिद्ध करने’ के भाव को स्पष्ट रूप से व्यक्त करता है; इसे इब्रानी भजन के ‘स्थापित किया’ से नहीं मिलाता।
- source_word: αἶνον
  choice: स्तुति
  rationale: धार्मिक संदर्भ में स्वाभाविक और सटीक हिन्दी संज्ञा।
theological_decisions:
- issue: यीशु के तर्क में भजन 8:2 के उद्धरण का रूप
  choice: मुख्य पाठ में मत्ती के यूनानी रूप के अनुसार ‘तूने ... स्तुति तैयार की है’
  alternative: इब्रानी पाठ पर आधारित ‘तूने ... सामर्थ्य स्थापित किया है’
  rationale: अनुवाद मत्ती द्वारा प्रस्तुत यूनानी उद्धरण को बिना इब्रानी पाठ से सामंजस्य कराए दर्शाता है; ज्ञात पाठांतर को टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद स्वाभाविक किंतु गरिमापूर्ण है। यीशु के उत्तर में यूनानी ऐतिहासिक वर्तमान को ‘कहते हैं’ से रखा गया है। उद्धरण में एकवचन संबोधन ‘तूने’ भजन की परमेश्वर से सीधी वाणी को सुरक्षित रखता है।
