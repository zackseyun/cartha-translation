  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: hi
  text: इसलिए मैं तुमसे कहता हूँ कि परमेश्वर का राज्य तुमसे ले लिया जाएगा और एक ऐसे जनसमुदाय[a] को दिया जाएगा जो परमेश्वर के राज्य के फल उत्पन्न करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक राष्ट्र।” यूनानी शब्द ἔθνος किसी राष्ट्र या जनसमुदाय को दर्शा सकता है। यहाँ यह फलों से पहचाने जाने वाले एक सामूहिक समुदाय की बात करता है; पद यह अधिक स्पष्ट नहीं करता कि वह समुदाय कौन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह पिछले दृष्टान्त और उद्धरण से निकले निष्कर्ष को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: प्रत्यक्ष संबोधन और कथन की व्यक्तिगत दृढ़ता को बनाए रखता है।
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: तुमसे ले लिया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य और वर्तमान धारकों से अलग किए जाने—दोनों भावों को सुरक्षित रखता है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह βασιλεία के शासन और राज्य-क्षेत्र, दोनों संभावित आयामों को किसी एक तक सीमित नहीं करता।
- source_word: δοθήσεται
  choice: दे दिया जाएगा
  rationale: यूनानी के भविष्यकालीन कर्मवाच्य को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔθνει
  choice: एक ऐसी जाति
  rationale: यह किसी सामूहिक निकाय को दर्शाता है और यूनानी शब्द के ‘जाति/राष्ट्र/जनसमुदाय’ वाले अर्थ-क्षेत्र को यथासंभव खुला रखता है; ‘ऐसी’ अगले कृदन्तीय वर्णन से इसे स्वाभाविक रूप से जोड़ता है।
- source_word: ποιοῦντι τοὺς καρποὺς αὐτῆς
  choice: जो उसके फल उत्पन्न करती है
  rationale: वर्तमान कृदन्त की निरंतर/विशेषतामूलक क्रिया को वर्तमान काल में रखता है और बहुवचन ‘फलों’ तथा राज्य की ओर संकेत करने वाले सर्वनाम को बनाए रखता है।
theological_decisions:
- issue: ἔθνει का अभिप्रेत समुदाय
  choice: मुख्य पाठ में ‘एक ऐसी जाति’ रखा गया है और उसकी पहचान कलीसिया, गैर-यहूदियों या इस्राएल के किसी शेष/नवीकृत समुदाय के रूप में निश्चित नहीं की गई।
  alternative: ‘एक जनसमुदाय’ या किसी विशिष्ट धर्मवैज्ञानिक समुदाय का नाम
  rationale: यूनानी पाठ फल उत्पन्न करने वाले एक सामूहिक प्राप्तकर्ता की बात करता है, पर उसकी बाद की धर्मवैज्ञानिक पहचान स्पष्ट रूप से निर्धारित नहीं करता।
- issue: ‘परमेश्वर का राज्य’ का आशय
  choice: मूल पदावली ‘परमेश्वर का राज्य’ बनाए रखी गई।
  alternative: ‘परमेश्वर का शासन’ या ‘परमेश्वर की प्रजा होने का विशेषाधिकार’
  rationale: भावार्थपरक विकल्प इस न्याय-वचन के अर्थ को यूनानी पाठ की अपेक्षा अधिक संकीर्ण कर देते।
- issue: αὐτῆς का संदर्भ
  choice: ‘उसके फल’ रखा गया, जिसका निकटतम व्याकरणिक संदर्भ परमेश्वर का राज्य है।
  alternative: ‘राज्य के फल’ या ‘उस जाति के फल’
  rationale: सर्वनाम को बनाए रखने से मूल की संरचना सुरक्षित रहती है और इसे नई प्राप्तकर्ता जाति के फल मानकर अनावश्यक रूप से पुनर्व्याख्यायित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष शैली रखी गई है। ‘जाति’ के आधुनिक सामाजिक अर्थ से संभावित भ्रम को पादटिप्पणी में स्पष्ट किया गया है; मुख्य पाठ ने मूल यूनानी की सामूहिकता और अभिप्रायगत अस्पष्टता को बनाए रखा है।
