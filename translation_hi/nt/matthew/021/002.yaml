  text: λέγων αὐτοῖς· ⸀Πορεύεσθε εἰς τὴν κώμην τὴν ⸀κατέναντι ὑμῶν, καὶ ⸀εὐθέως εὑρήσετε ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς· λύσαντες ⸀ἀγάγετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: hi
  text: उनसे कहा, “जो गाँव तुम्हारे सामने है, उसमें जाओ। वहाँ तुम्हें तुरंत एक बँधी हुई गधी और उसके साथ एक गधे का बच्चा मिलेगा। उन्हें खोलकर मेरे पास ले आओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: उनसे यह कहते हुए
  rationale: यह वर्तमान कृदंत यीशु के कथन का परिचय देता है; हिंदी में यह रूप यूनानी वाक्य-संरचना से निकटता रखते हुए स्वाभाविक है।
- source_word: Πορεύεσθε
  choice: जाओ
  rationale: आज्ञार्थक प्रसंग में यह सरल, स्वाभाविक और सटीक आधुनिक हिंदी है।
- source_word: κώμην
  choice: गाँव
  rationale: κώμη नगर से छोटी बसाहट को सूचित करता है; ‘गाँव’ इसका सामान्य और स्पष्ट हिंदी पर्याय है।
- source_word: κατέναντι ὑμῶν
  choice: अपने सामने वाले
  rationale: यह शिष्यों के सामने या उनकी विपरीत दिशा में स्थित गाँव का स्थान बताता है; ‘सामने वाला’ अर्थ को स्वाभाविक हिंदी में रखता है।
- source_word: εὐθέως
  choice: तुरंत
  rationale: यह बिना विलंब के मिलने को सूचित करता है और आधुनिक हिंदी में सहज है।
- source_word: ὄνον δεδεμένην
  choice: एक गधी बँधी हुई
  rationale: ὄνον का स्त्रीलिंग विशेषण और सर्वनाम से मादा गधे का संदर्भ स्पष्ट है; ‘गधी’ इस लिंग-सूचना को संक्षेप में सुरक्षित रखता है। पूर्ण निष्क्रिय कृदंत δεδεμένην उसके बँधी हुई अवस्था में होने को दर्शाता है।
- source_word: πῶλον μετ’ αὐτῆς
  choice: उसके साथ उसका बच्चा
  rationale: πῶλος किसी कम आयु के पशु को दर्शाता है और यहाँ साथ खड़ी गधी से उसका गधी का बच्चा होना स्पष्ट होता है। ‘उसका’ मातृ-संबंध को प्रसंगानुसार व्यक्त करता है, यद्यपि यूनानी में केवल ‘उसके साथ’ है।
- source_word: λύσαντες
  choice: उन्हें खोलकर
  rationale: अओरिस्ट कृदंत मुख्य आज्ञा से पहले होने वाली क्रिया बताता है। हिंदी में ‘खोलकर ... ले आओ’ उसी क्रम और कृदंतीय बनावट को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἀγάγετέ μοι
  choice: मेरे पास ले आओ
  rationale: दोनों पशुओं को यीशु तक लाने की बहुवचन आज्ञा को हिंदी में स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
