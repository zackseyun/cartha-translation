base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: hi
  text: पर उसने उत्तर दिया, “मैं नहीं जाना चाहता।” लेकिन बाद में उसका मन बदल गया[a], और वह चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे पछतावा हुआ” अथवा “वह मान गया।” यूनानी शब्द में ऐसा पछतावा शामिल हो सकता है जिसके कारण व्यक्ति अपना रास्ता बदल ले।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: उसने उत्तर दिया
  rationale: यह यूनानी कथा-साहित्य का सामान्य कृदन्तीय वाक्यांश है; हिन्दी में इसे मुख्य क्रिया के रूप में रखना स्वाभाविक और अर्थनिष्ठ है।
- source_word: Οὐ θέλω
  choice: मैं नहीं जाना चाहता
  rationale: θέλω इच्छा या तत्परता व्यक्त करता है। प्रसंग से जाने का आशय स्पष्ट है; इसलिए हिन्दी में आवश्यक पूरक ‘जाना’ जोड़कर पुत्र की सीधी अनिच्छा व्यक्त की गई है, बिना इसे अधिक कठोर ‘मैं नहीं जाऊँगा’ बनाने के।
- source_word: ὕστερον
  choice: बाद में
  rationale: यह बाद की घटना बताने वाला सहज और सटीक आधुनिक हिन्दी प्रयोग है।
- source_word: μεταμεληθεὶς
  choice: उसका मन बदल गया
  rationale: क्रिया में पछतावे के साथ अपना इरादा बदलने का भाव हो सकता है। यहाँ कथा का मुख्य बल इनकार से आज्ञापालन की ओर हुए बदलाव पर है; यह अनुवाद उसी अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: ἀπῆλθεν
  choice: वह चला गया
  rationale: प्रसंग में इसका अर्थ केवल वहाँ से निकलना नहीं, बल्कि पिता के कहे काम के लिए जाना है। ‘चला गया’ हिन्दी कथा-शैली में स्वाभाविक है और प्रसंग इस उद्देश्य को स्पष्ट करता है।
theological_decisions:
- issue: दृष्टान्त के प्रसंग में μεταμεληθεὶς का अनुवाद
  choice: उसका मन बदल गया
  alternative: उसे पछतावा हुआ; वह मान गया; उसने पश्चात्ताप किया
  rationale: यह पद इनकार से आज्ञापालन की ओर हुए परिवर्तन को बताता है। ‘पश्चात्ताप किया’ कहने से शब्द को आवश्यकता से अधिक विशिष्ट धार्मिक अर्थ मिल सकता है और μεταμέλομαι तथा μετανοέω के बीच का भेद धुँधला हो सकता है। मुख्य पाठ व्यवहारिक परिवर्तन को स्पष्ट रखता है, जबकि पादटिप्पणी में पछतावे की सम्भव छाया सुरक्षित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। संवाद को सीधा रखा गया है और यूनानी कृदन्तीय रचना को हिन्दी की स्वाभाविक संयुक्त क्रिया-रचना में बदला गया है।
