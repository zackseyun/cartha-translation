source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: hi
  text: और वे उसे पकड़ने का प्रयास कर रहे थे, पर भीड़ से डरते थे, क्योंकि भीड़ उसे एक नबी मानती थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भीड़ उसे एक नबी समझती थी।”
    reason: εἰς προφήτην αὐτὸν εἶχον का निकट हिन्दी वैकल्पिक रूप; दोनों रूप भीड़ की धारणा को व्यक्त करते हैं।
lexical_decisions:
- source_word: ζητοῦντες
  choice: चाहते थे
  rationale: वर्तमान कृदंत उनकी जारी इच्छा या मंशा व्यक्त करता है। ‘पकड़ना चाहते थे’ सहज हिन्दी में यही भाव देता है; ‘पर’ मुख्य क्रिया के साथ प्रसंगगत विरोध को स्पष्ट करता है।
- source_word: κρατῆσαι
  choice: पकड़ना
  rationale: इस विरोधी प्रसंग में क्रिया का अर्थ किसी व्यक्ति को बलपूर्वक अपने अधिकार में लेना है। ‘पकड़ना’ सहज हिन्दी है और औपचारिक कानूनी गिरफ्तारी से अधिक अर्थ नहीं जोड़ता।
- source_word: ἐφοβήθησαν
  choice: डरते थे
  rationale: यह भीड़ के भय को सीधे व्यक्त करता है। हिन्दी में अपूर्ण भूतकाल उनकी मंशा और उसे रोकने वाले भय के एक साथ विद्यमान होने को स्वाभाविक ढंग से रखता है, बिना ‘अचानक डर गए’ का अतिरिक्त आरंभिक भाव जोड़े।
- source_word: τοὺς ὄχλους
  choice: भीड़
  rationale: यूनानी में बहुवचन है, पर आधुनिक हिन्दी में ‘भीड़’ एक सामूहिक संज्ञा के रूप में इस एकत्र जनसमूह को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἐπεὶ εἰς
  choice: क्योंकि
  rationale: यह उनके भय का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक कारणसूचक संयोजक है।
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: भीड़ उसे नबी मानती थी
  rationale: εἰς ... ἔχω यहाँ ‘किसी को किसी रूप में मानना’ मुहावरा है। हिन्दी में कर्ता ‘भीड़’ दोहराने से यह अस्पष्टता दूर होती है कि यीशु को नबी मानने वाले धार्मिक अगुए नहीं, बल्कि वही लोग थे जिनसे वे डरते थे।
- source_word: προφήτην
  choice: नबी
  rationale: ‘नबी’ आधुनिक हिन्दी के बाइबलीय प्रयोग में प्रचलित, संक्षिप्त और सामान्य पाठक के लिए परिचित शब्द है। बिना ‘एक’ के भी हिन्दी में वर्गगत अर्थ स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: भीड़ द्वारा यीशु को προφήτην मानने के कथन को उनकी दृष्टि के रूप में रखना
  choice: भीड़ उसे नबी मानती थी
  alternative: भीड़ उसे एक नबी समझती थी
  rationale: वचन भीड़ की धारणा बताता है, यीशु की संपूर्ण पहचान की धर्मवैज्ञानिक परिभाषा नहीं देता। ‘मानती थी’ इस कथात्मक दृष्टिकोण को बनाए रखता है और न तो इसे पूर्ण मसीही पहचान का निषेध बनाता है, न कथन से अधिक दावा करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘पकड़ना’ कथानक के बलपूर्वक नियंत्रण के भाव को रखता है; ‘भीड़’ सामूहिक संज्ञा के रूप में स्वाभाविक है। वाक्य में ‘भीड़’ की पुनरावृत्ति अर्थगत कर्ता को स्पष्ट करती है।
