source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Κακοὺς κακῶς ἀπολέσει αὐτούς, καὶ τὸν ἀμπελῶνα ἐκδώσεται ἄλλοις γεωργοῖς, οἵτινες ἀποδώσουσιν αὐτῷ τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: hi
  text: उन्होंने उससे कहा, “वह उन दुष्टों का बुरी तरह नाश कर देगा[a], और दाख की बारी दूसरे किसानों को पट्टे पर दे देगा[b], जो नियत समयों पर उसकी उपज उसे देंगे[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “वह उन बुरे लोगों का बुरी तरह नाश करेगा।” यूनानी में विशेषण और क्रियाविशेषण एक ही मूल से बने हैं; यह शब्द-क्रीड़ा न्याय की तीव्रता को बढ़ाती है।
    reason: lexical_alternative
  - marker: b
    text: या, “दाख की बारी दूसरे बटाईदारों को दे देगा।”
    reason: lexical_alternative
  - marker: c
    text: या, “जो उचित समयों पर उसे उपज देंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: उन्होंने उससे कहा
  rationale: यूनानी वर्तमान काल यहाँ कथात्मक ऐतिहासिक वर्तमान है; हिन्दी में भूतकाल कथा-प्रवाह के लिए अधिक स्वाभाविक है।
- source_word: Κακοὺς κακῶς ἀπολέσει αὐτούς
  choice: वह उन दुष्टों का बुरी तरह नाश कर देगा
  rationale: ‘दुष्टों’ और ‘बुरी तरह’ के द्वारा एक ही मूल से बने यूनानी विशेषण-क्रियाविशेषण की तीव्र शब्द-क्रीड़ा को यथासंभव सुरक्षित रखा गया है; ‘नाश’ न्याय की कठोरता बताता है, पर उसकी रीति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τὸν ἀμπελῶνα
  choice: दाख की बारी
  rationale: यह ἀμπελών का प्रचलित और स्पष्ट हिन्दी रूप है तथा दाख की बारी की बाइबलीय छवि बनाए रखता है।
- source_word: ἐκδώσεται
  choice: पट्टे पर दे देगा
  rationale: कृषि-संदर्भ में क्रिया का अर्थ किसी संपत्ति को किराए या पट्टे पर देना है; यह शब्द उस व्यवस्था को स्पष्ट करता है।
- source_word: ἄλλοις γεωργοῖς
  choice: दूसरे किसानों को
  rationale: γεωργοί खेती करने वालों को दर्शाता है; पट्टेदारी का भाव पूर्ववर्ती पद ‘पट्टे पर’ से स्पष्ट हो जाता है।
- source_word: ἀποδώσουσιν αὐτῷ
  choice: उसे ... देंगे
  rationale: ἀποδίδωμι यहाँ देय वस्तु लौटाने या चुकाने का भाव रखता है; ‘देंगे’ हिन्दी में स्वाभाविक है और संदर्भ उस देयता को स्पष्ट करता है।
- source_word: τοὺς καρποὺς
  choice: उसके फल
  rationale: ‘फल’ कृषि-चित्र और उसके व्यापक रूपकात्मक अनुनाद दोनों को बनाए रखता है; ‘उसके’ से स्वामी को मिलने वाली देय उपज स्पष्ट होती है।
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: उपज के नियत समयों पर
  rationale: καιροί उचित या निर्धारित अवसरों को सूचित करता है; बहुवचन ‘समयों’ मूल की संख्या और अलग-अलग उपज-कालों की संभावना को सुरक्षित रखता है।
theological_decisions:
- issue: किसानों पर आने वाले न्याय की कठोरता और स्वरूप
  choice: वह उन दुष्टों का बुरी तरह नाश कर देगा
  alternative: वह उन दुष्ट मनुष्यों का अत्यन्त बुरा अंत करेगा
  rationale: मूल यूनानी किसी तकनीकी धर्मवैज्ञानिक दंड-संज्ञा के बजाय तीव्र शब्द-क्रीड़ा का प्रयोग करता है। चुना हुआ रूप न्याय की कठोरता बनाए रखता है, किंतु दंड की ठीक रीति या अंतिम धर्मवैज्ञानिक स्वरूप को पाठ से आगे जाकर निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दाख की बारी’, ‘पट्टे पर’ और ‘नियत समयों’ से कृषि तथा किरायेदारी का संदर्भ स्पष्ट होता है। मूल की तीखी शब्द-क्रीड़ा को कुछ असामान्य किंतु समझने योग्य ‘दुष्टों का बुरी तरह नाश’ में रखा गया है और पादटिप्पणी में खोला गया है।
