source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: hi
  text: और यदि कोई तुमसे कुछ कहे, तो कहना, “प्रभु[a] को इनकी आवश्यकता है,” और वह इन्हें तुरन्त भेज देगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वामी”; यहाँ यूनानी शब्द अधिकार रखने वाले व्यक्ति अथवा “प्रभु” की उपाधि, दोनों अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “वह” से सम्भवतः वह व्यक्ति अभिप्रेत है जो शिष्यों से कुछ कहता है; वही पशुओं को तुरन्त भेज देगा। यूनानी में कर्ता स्पष्ट रूप से दोहराया नहीं गया है।
    reason: referential_ambiguity
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ τι
  choice: यदि कोई तुमसे कुछ कहे
  rationale: यह अनिश्चित शर्त किसी भी व्यक्ति की सम्भावित आपत्ति या बात को खुला रखती है। ‘तुमसे’ प्रसंग में शिष्यों के लिए बहुवचन है, जैसा हिन्दी में स्वाभाविक है।
- source_word: ἐρεῖτε
  choice: तो कहना
  rationale: भविष्यकालीन रूप यहाँ निर्देशात्मक बल रखता है; हिन्दी का ‘कहना’ स्वाभाविक आदेश के रूप में उसी बल को व्यक्त करता है।
- source_word: Ὁ κύριος
  choice: प्रभु
  rationale: ‘प्रभु’ κύριος के सम्मानसूचक और सम्भावित मसीही शीर्षक—दोनों आयामों को बनाए रखता है; केवल ‘मालिक’ कहने से अर्थ पशुओं के सांसारिक स्वामी तक सीमित हो सकता है।
- source_word: αὐτῶν χρείαν ἔχει
  choice: को इनकी आवश्यकता है
  rationale: यह हिन्दी में स्वाभाविक रूप से ‘उन्हें चाहिए’ से कुछ अधिक औपचारिक है और यूनानी मुहावरे ‘इनकी आवश्यकता रखता है’ का स्पष्ट अर्थ देता है। ‘इनकी’ पिछले पद में बताए गए दोनों पशुओं की ओर संकेत करता है।
- source_word: εὐθὺς δὲ ἀποστελεῖ αὐτούς
  choice: और वह इन्हें तुरन्त भेज देगा
  rationale: ‘तुरन्त’ εὐθύς की तात्कालिकता को व्यक्त करता है। ἀποστέλλω का सामान्य अर्थ ‘भेजना’ है; ‘वापस’ या ‘छोड़ देना’ मूल पाठ में स्पष्ट न होने के कारण मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: Ὁ κύριος का आशय और उपाधिगत बल
  choice: प्रभु
  alternative: मालिक / स्वामी
  rationale: प्रसंग में यीशु सम्भवतः अपने लिए अधिकारसूचक रूप में बोलते हैं। ‘प्रभु’ व्यावहारिक अधिकार और मसीही उपाधि की सम्भावना दोनों को सुरक्षित रखता है, जबकि पादटिप्पणी सामान्य अर्थ की सम्भावना बताती है।
- issue: ἀποστελεῖ का कर्ता
  choice: ‘वह’ को अनिर्दिष्ट रखा गया है
  alternative: आपत्ति करने वाला व्यक्ति पशुओं को भेज देगा; अथवा प्रभु उन्हें भेज देंगे/वापस भेज देंगे
  rationale: यूनानी क्रिया में कर्ता व्यक्त नहीं है। प्रसंग में सबसे स्वाभाविक कर्ता वह व्यक्ति है जो शिष्यों से कुछ कहता है, पर व्याकरण अकेले इस प्रश्न को पूर्णतः बन्द नहीं करता; इसलिए मुख्य पाठ मूल की सर्वनामिक अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। ‘तुम’ शिष्यों के लिए बहुवचन सम्बोधन है। वाक्य की निर्देशात्मक शैली स्वाभाविक रखने के लिए ‘तो कहना’ चुना गया है; अनावश्यक व्याख्यात्मक शब्द मुख्य पाठ में नहीं जोड़े गए।
