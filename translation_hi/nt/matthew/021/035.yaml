review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the sequence of seizure, beating, killing, and stoning, and ‘दासों’ appropriately retains the subordinate status of δούλους. However, ‘पत्थरों से मार डाला’ explicitly states a fatal outcome, whereas ἐλιθοβόλησαν directly specifies stoning without independently stating the result; the translation should preserve that lexical scope.
  naturalness: The sentence is generally clear and dignified. ‘पट्टेदार किसानों’ is a more broadly transparent modern-Hindi equivalent for tenant farmers than ‘बटाईदारों,’ which can more specifically suggest a sharecropping arrangement.
  terminology: ‘दास’ is appropriate for δοῦλοι in this parabolic context. ‘पट्टेदार किसान’ conveys both tenancy and farming. ‘पत्थरों से मारा’ renders the action of stoning without adding an explicit death claim.
  issues:
  - severity: medium
    issue: ‘पत्थरों से मार डाला’ adds an explicit fatal result.
    rationale: The Greek verb ἐλιθοβόλησαν denotes stoning. While stoning may be lethal in context, the verse itself does not explicitly add ‘to death’; the Hindi should not make the result more explicit than the source.
  - severity: low
    issue: ‘बटाईदारों’ is narrower than the source’s tenancy designation.
    rationale: It can imply the particular arrangement of payment by a share of produce. ‘पट्टेदार किसानों’ more directly and broadly conveys γεωργοί as tenant farmers.
  revised_text: और पट्टेदार किसानों ने उसके दासों को पकड़ लिया; एक को पीटा, दूसरे को मार डाला, और एक अन्य को पत्थरों से मारा।
  revised_footnotes: []
  revision_rationale: The revision preserves the Greek distributive sequence and violent actions while avoiding the added assertion that the stoning necessarily killed its victim. It also uses a clearer general equivalent for tenant farmers without imposing a specific sharecropping arrangement.
