id: MAT.21.35
reference: Matthew 21:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his servants; one they beat[a], another they killed, and another they stoned.
translation:
  language: hi
  text: और पट्टेदार किसानों ने उसके दासों को पकड़ लिया; एक को पीटा, दूसरे को मार डाला, और एक अन्य को पत्थरों से मारा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γεωργοὶ
  choice: बटाईदारों
  rationale: दृष्टान्त के संदर्भ में ये केवल खेतिहर नहीं, बल्कि मालिक की भूमि पर उपज के हिस्से के बदले काम करने वाले काश्तकार हैं; ‘बटाईदार’ खेती और मालिक के अधीन पट्टेदारी—दोनों संबंधों को सहज हिंदी में व्यक्त करता है।
- source_word: λαβόντες
  choice: पकड़ लिया
  rationale: अओरिस्ट कृदन्त मुख्य क्रियाओं से पहले हुई कार्रवाई बताता है। हिंसक संदर्भ में ‘पकड़ लिया’ सामान्य ‘ले लिया’ से अधिक स्वाभाविक है, पर ‘धर दबोचा’ जितना व्याख्यात्मक नहीं।
- source_word: δούλους
  choice: दासों
  rationale: δοῦλος स्वामी के अधिकार के अधीन व्यक्ति को दर्शाता है। यहाँ वे भूस्वामी के प्रतिनिधि हैं; ‘दास’ मूल शब्द की अधीनता को ‘सेवक’ की अपेक्षा अधिक स्पष्टता से बनाए रखता है।
- source_word: ἔδειραν
  choice: पीटा
  rationale: क्रिया मारने-पीटने या कोड़े लगाने का अर्थ दे सकती है; ‘पीटा’ साधन या विधि को अनावश्यक रूप से निश्चित किए बिना स्वाभाविक हिंदी देता है।
- source_word: ἀπέκτειναν
  choice: मार डाला
  rationale: यह सीधे हत्या किए जाने को व्यक्त करता है। ‘मार डाला’ आधुनिक हिंदी में स्पष्ट है और ‘वध किया’ की अतिरिक्त औपचारिक या अनुष्ठानिक छाया से बचता है।
- source_word: ἐλιθοβόλησαν
  choice: पत्थरों से मार डाला
  rationale: क्रिया पत्थर मारने, प्रायः पत्थरवाह करके जान लेने, को सूचित करती है। इस क्रम में ‘पत्थरों से मार डाला’ हमला और घातक परिणाम दोनों स्पष्ट करता है; केवल ‘पत्थर मारे’ परिणाम को अस्पष्ट छोड़ सकता है।
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: एक को ... दूसरे को ... तीसरे को
  rationale: वितरणात्मक यूनानी रचना अलग-अलग दासों के साथ हुए अलग व्यवहार को दर्शाती है; हिंदी में यह क्रम स्पष्ट और सहज है।
theological_decisions:
- issue: दृष्टान्त में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: ‘सेवक’ संदर्भ में संभव है, लेकिन वह स्वामी के अधिकार के अधीन स्थिति को नरम कर सकता है। ‘दास’ मूल पद की सामाजिक-अधीनता को सुरक्षित रखता है, बिना दृष्टान्त की पहचान को किसी विशिष्ट धर्मवैज्ञानिक व्याख्या से बाँधे।
- issue: ἐλιθοβόλησαν में मृत्यु का परिणाम
  choice: पत्थरों से मार डाला
  alternative: पत्थर मारे
  rationale: क्रिया और हिंसक त्रिक्रम घातक पत्थरवाह की ओर संकेत करते हैं। फिर भी इसे औपचारिक न्यायिक दंड के रूप में निर्दिष्ट नहीं किया गया, इसलिए ‘पत्थरवाह किया’ के बजाय सामान्य अभिव्यक्ति चुनी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ में सहज रखी गई है। ‘बटाईदार’ ग्रामीण एवं सामान्य हिंदी में समझ आने वाला पद है। वाक्य की तीन-खंडीय लय मूल यूनानी के वितरणात्मक क्रम को बनाए रखती है।
