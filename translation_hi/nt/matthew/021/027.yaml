revisions:
- from: तब उन्होंने यीशु को उत्तर दिया, “हम नहीं जानते।” उसने भी उनसे कहा, “तो मैं भी तुम्हें नहीं बताता कि मैं ये काम किस अधिकार से करता हूँ।”
  to: उन्होंने यीशु को उत्तर दिया, “हम नहीं जानते।” यीशु ने भी उनसे कहा, “मैं भी तुम्हें नहीं बताऊँगा कि मैं ये काम किस अधिकार से करता हूँ।”
  rationale: The revision removes added temporal and logical particles, clarifies the narrative subject, and uses idiomatic Hindi future refusal while retaining the reciprocal force of καὶ αὐτός / οὐδὲ ἐγώ. It preserves ‘अधिकार’ and the plural reference to Jesus’ actions.
  reviewer_model: gpt-5.6-terra
