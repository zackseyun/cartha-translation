id: MAT.21.27
reference: Matthew 21:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: hi
  text: उन्होंने यीशु को उत्तर दिया, “हम नहीं जानते।” यीशु ने भी उनसे कहा, “मैं भी तुम्हें नहीं बताऊँगा कि मैं ये काम किस अधिकार से करता हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: उत्तर दिया
  rationale: ग्रीक कृदंत उनके प्रत्युत्तर का परिचय देता है; हिन्दी में मुख्य क्रिया के रूप में ‘उत्तर दिया’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: Οὐκ οἴδαμεν
  choice: हम नहीं जानते
  rationale: ज्ञान के सीधे निषेध को सरल, गरिमापूर्ण आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ἔφη
  choice: कहा
  rationale: यह सामान्य कथन-क्रिया है; ‘कहा’ सबसे सहज और व्याख्या से मुक्त विकल्प है।
- source_word: καὶ αὐτός / Οὐδὲ ἐγώ
  choice: उसने भी … तो मैं भी
  rationale: 'इन पदों में निहित पारस्परिक प्रत्युत्तर को हिन्दी में स्पष्ट करता है: उनके न बताने के उत्तर में यीशु भी नहीं बताता।'
- source_word: λέγω ὑμῖν
  choice: तुम्हें नहीं बताता
  rationale: इस प्रसंग में λέγω सूचना प्रकट करने के अर्थ में है; ‘बताना’ हिन्दी में ‘कहना’ से अधिक स्वाभाविक है। वर्तमानकालिक रूप को भविष्यकाल में बदले बिना रखा गया है।
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: किस अधिकार से
  rationale: यह यीशु के कार्यों के वैध आधार अथवा प्राधिकार को व्यक्त करता है; हिन्दी का प्रचलित मुहावरा ‘किस अधिकार से’ इसी अर्थ को ठीक रखता है।
- source_word: ταῦτα ποιῶ
  choice: मैं ये काम … करता हूँ
  rationale: बहुवचन ταῦτα को ‘ये काम’ से सुरक्षित रखा गया है और वर्तमान ποιῶ को सामान्य वर्तमान ‘करता हूँ’ में व्यक्त किया गया है।
theological_decisions:
- issue: ἐξουσία का आशय
  choice: अधिकार
  alternative: सामर्थ्य; हक
  rationale: विवाद में प्रश्न यीशु की क्षमता का नहीं, उसके कार्य करने के वैध प्राधिकार और उसके स्रोत का है। ‘अधिकार’ इस न्यायिक-धर्मवैचारिक तनाव को बिना अधिक संकीर्ण किए बनाए रखता है।
- issue: यीशु के उत्तर का काल और स्वर
  choice: मैं भी तुम्हें नहीं बताता
  alternative: मैं भी तुम्हें नहीं बताऊँगा
  rationale: ग्रीक λέγω वर्तमानकाल में है। हिन्दी में वर्तमान रूप कथन के तत्काल इनकार को स्वाभाविक ढंग से व्यक्त करता है और मूल के काल को अनावश्यक रूप से भविष्य में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद स्वाभाविक, स्पष्ट और गरिमापूर्ण रखा गया है। ‘उसने’ का निकटतम स्पष्ट पूर्वपद यीशु है, जबकि उद्धरण में ‘मैं’ मूल की प्रत्यक्ष वाणी को बनाए रखता है।
