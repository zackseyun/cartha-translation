  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: hi
  text: 'यह इसलिए हुआ कि भविष्यद्वक्ता के माध्यम से कही गई बात पूरी हो, जिसमें कहा गया है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῦτο δὲ γέγονεν
  choice: यह इसलिए हुआ
  rationale: Τοῦτο पिछले प्रसंग की पूरी घटना की ओर संकेत करता है; δέ यहाँ हल्का संयोजक है और हिन्दी में अलग शब्द के बिना स्वाभाविक रूप से व्यक्त हो जाता है; γέγονεν को आधुनिक कथात्मक हिन्दी में ‘हुआ’ कहना सहज है।
- source_word: ἵνα πληρωθῇ
  choice: कि … पूरी हो
  rationale: ἵνα के प्रयोजन/परिणाम संबंध को ‘इसलिए हुआ कि’ संरचना व्यक्त करती है, और πληρωθῇ के निष्क्रिय भाव को ‘पूरी हो’ बनाए रखता है।
- source_word: τὸ ῥηθὲν
  choice: कही गई बात
  rationale: संज्ञा के रूप में प्रयुक्त निष्क्रिय कृदंत का स्वाभाविक हिन्दी रूप है और पूर्व में कहे जाने का भाव सुरक्षित रखता है।
- source_word: διὰ τοῦ προφήτου
  choice: भविष्यद्वक्ता के माध्यम से
  rationale: διά के संबंधसूचक रूप में निहित माध्यम/मध्यस्थता को स्पष्ट करता है, बिना यह जोड़े कि भविष्यद्वक्ता वचन का अंतिम स्रोत था।
- source_word: λέγοντος
  choice: 'उसने कहा था:'
  rationale: यह कृदंत आने वाले उद्धरण का परिचय देता है और व्याकरणतः ‘भविष्यद्वक्ता’ से जुड़ा है; अलग छोटे वाक्य में इसका हिन्दी रूप स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: भविष्यद्वाणी की पूर्ति और भविष्यद्वक्ता की मध्यस्थ भूमिका
  choice: ‘भविष्यद्वक्ता के माध्यम से कही गई बात पूरी हो’
  alternative: ‘भविष्यद्वक्ता द्वारा कही गई बात पूरी हो’
  rationale: मूल यूनानी पूर्वकथित वचन की पूर्ति तथा भविष्यद्वक्ता के माध्यम से उसके संप्रेषण—दोनों पर बल देता है। ‘के माध्यम से’ इस सूक्ष्मता को सबसे स्पष्ट रूप से सुरक्षित रखता है।
- issue: ἵνα में प्रयोजन और परिणाम का संबंध
  choice: ‘यह इसलिए हुआ कि … पूरी हो’
  alternative: ‘यह हुआ, जिससे … पूरी हुई’
  rationale: चुनी हुई रचना मूल के प्रयोजनात्मक स्वर को बनाए रखती है, पर उसे केवल साधारण परिणाम में सीमित नहीं करती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘पूरी हो’ प्रचलित बाइबलीय पूर्ति-भाषा को बनाए रखता है। उद्धरण आरम्भ कराने वाले λέγοντος को अस्पष्ट ‘कहते हुए’ के बजाय स्पष्ट ‘उसने कहा था:’ से व्यक्त किया गया है।
