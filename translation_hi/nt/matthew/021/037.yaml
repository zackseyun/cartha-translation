source:
  edition: SBLGNT
  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: hi
  text: परन्तु बाद में उसने अपना बेटा उनके पास भेजा और कहा, “वे मेरे बेटे का आदर करेंगे[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे मेरे बेटे का लिहाज़ करेंगे।” यूनानी क्रिया का अर्थ किसी के प्रति आदर या लिहाज़ दिखाना हो सकता है; दूसरे प्रसंगों में इसका अर्थ “लज्जित होना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: बाद में
  rationale: यह समयक्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और ‘अन्त में’ जैसा अधिक प्रबल अन्तिमता का भाव नहीं जोड़ता।
- source_word: δὲ
  choice: परन्तु
  rationale: यह सेवकों के बाद बेटे को भेजने के कथात्मक मोड़ और हल्के विरोध को दर्शाता है।
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: उसने ... उनके पास भेजा
  rationale: भेजने की क्रिया के साथ πρός व्यक्तियों की ओर दिशा बताता है; ‘उनके पास’ सहज हिन्दी है।
- source_word: τὸν υἱὸν αὐτοῦ
  choice: अपना बेटा
  rationale: यह सम्बन्ध को सहज हिन्दी में व्यक्त करता है। ‘अपना’ कर्ता के साथ सम्बन्ध स्पष्ट करता है, पर यूनानी पाठ से परे ‘प्रिय’ जैसा विशेषण नहीं जोड़ता।
- source_word: λέγων
  choice: और कहा
  rationale: शाब्दिक ‘कहते हुए’ की अपेक्षा समन्वित क्रिया हिन्दी कथा-शैली में अधिक स्वाभाविक है और वही अर्थ रखती है।
- source_word: Ἐντραπήσονται
  choice: आदर करेंगे
  rationale: प्रत्यक्ष कर्म ‘मेरे बेटे’ के साथ क्रिया यहाँ सम्मान या लिहाज़ दिखाने का अर्थ देती है। ‘आदर करेंगे’ स्पष्ट और वर्तमान हिन्दी है।
- source_word: τὸν υἱόν μου
  choice: मेरे बेटे का
  rationale: हिन्दी में ‘आदर करना’ सामान्यतः सम्बन्धकारक ‘का’ के साथ आता है; यह यूनानी के प्रत्यक्ष कर्म का स्वाभाविक अर्थगत रूपान्तरण है।
theological_decisions:
- issue: दृष्टान्त के बेटे को मसीही संकेत से अधिक स्पष्ट न करना
  choice: अपना बेटा / मेरे बेटे
  alternative: अपना प्रिय पुत्र / पुत्र
  rationale: पद में सामान्य υἱός है; ἀγαπητός या स्पष्ट उपाधि नहीं है। इसलिए कथात्मक अर्थ को बनाए रखते हुए मसीही संकेत को प्रसंग से उभरने दिया गया है।
- issue: ἐντρέπομαι में सम्मान और लज्जा के अर्थों का तनाव
  choice: मुख्य पाठ में ‘आदर करेंगे’
  alternative: ‘मेरे बेटे के सामने लज्जित होंगे’ अथवा ‘उसका लिहाज़ करेंगे’
  rationale: व्यक्ति को कर्म बनाकर प्रयुक्त यह क्रिया इस प्रसंग में सम्मान या संकोचपूर्ण लिहाज़ दिखाने की ओर संकेत करती है। फिर भी इसके ‘लज्जित होना’ वाले अर्थ-संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘बेटा’ दृष्टान्त की पारिवारिक भाषा में स्वाभाविक है; अनावश्यक धार्मिक पदावली और व्याख्यात्मक विस्तार से बचा गया है।
