source:
  edition: SBLGNT
  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: hi
  text: फिर वह दूसरे के पास गया और उससे भी वही बात कही। उसने उत्तर दिया, “जी[a], मैं जाऊँगा[b],” पर वह नहीं गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी κύριε का शाब्दिक अनुवाद ‘प्रभु’ या ‘स्वामी’ भी हो सकता है; यहाँ यह पिता के प्रति आदरसूचक संबोधन है।
    reason: alternative_reading
  - marker: b
    text: अधिक शाब्दिक रूप में केवल ‘मैं’; यह संक्षिप्त उत्तर प्रसंग में ‘मैं जाऊँगा’ का अर्थ देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν δὲ
  choice: फिर वह ... के पास गया
  rationale: कृदन्त और हल्के संयोजक δέ को स्वाभाविक हिन्दी कथाक्रम में व्यक्त करता है; यहाँ प्रबल विरोध नहीं, अगली घटना की ओर बढ़ना है।
- source_word: τῷ δευτέρῳ
  choice: दूसरे
  rationale: यूनानी पाठ में ‘पुत्र’ दोहराया नहीं गया है और निकटवर्ती प्रसंग से आशय स्पष्ट है।
- source_word: εἶπεν ὡσαύτως
  choice: उससे भी वही बात कही
  rationale: ὡσαύτως का संकेत पहले पुत्र को दिए गए उसी निर्देश की ओर है; यह हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: ἀποκριθεὶς εἶπεν
  choice: उसने उत्तर दिया
  rationale: शाब्दिक ‘उत्तर देकर कहा’ के बजाय इस प्रचलित यूनानी अभिव्यक्ति को स्वाभाविक हिन्दी में रखा गया है।
- source_word: Ἐγώ
  choice: मैं जाऊँगा
  rationale: यूनानी में केवल बलयुक्त सर्वनाम ‘मैं’ है, पर वह पिछले आदेश के उत्तर में दी गई संक्षिप्त सहमति है; हिन्दी में निहित क्रिया जोड़ने से अर्थ स्वाभाविक रूप से स्पष्ट होता है।
- source_word: κύριε
  choice: जी
  rationale: यहाँ पिता को आदरपूर्वक संबोधित किया गया है। हिन्दी का ‘जी’ मानवीय और पारिवारिक संबोधन में सम्मान व्यक्त करता है, बिना अनावश्यक ईश्वरीय उपाधि का भाव जोड़े।
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: पर वह नहीं गया
  rationale: καί के बाद निषेध कथन और काम के बीच स्पष्ट विरोध दिखाता है; हिन्दी में ‘पर’ इस आशय को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: पिता के लिए κύριε का अनुवाद
  choice: जी
  alternative: प्रभु; स्वामी; मालिक
  rationale: κύριε कई प्रसंगों में ‘प्रभु’ हो सकता है, पर यहाँ यह मानवीय पिता के प्रति आदरसूचक संबोधन है। ‘जी’ सम्मान बनाए रखता है और प्रसंग में ऐसा ईश्वरीय या मसीही अर्थ नहीं जोड़ता जिसकी यहाँ आवश्यकता नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जी’ घरेलू प्रसंग में सम्मानजनक संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है; ‘मैं जाऊँगा’ यूनानी के संक्षिप्त उत्तर का निहित अर्थ खोलता है।
