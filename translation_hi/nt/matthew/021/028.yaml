base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: hi
  text: “पर तुम क्या सोचते हो? एक आदमी के दो बच्चे[a] थे। वह पहले बच्चे के पास जाकर बोला, ‘बच्चे, आज जाकर अंगूर के बाग में काम कर।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दो बेटे”। यहाँ यूनानी पाठ में τέκνα है, जिसका शाब्दिक अर्थ “बच्चे” है, न कि विशेष रूप से “बेटे”।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: पर तुम क्या सोचते हो?
  rationale: यह सुनने वालों से उनका मत पूछने वाले यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है; ‘पर’ δὲ की हल्की विरोधात्मक/संयोजक शक्ति बनाए रखता है।
- source_word: ἄνθρωπος
  choice: एक आदमी
  rationale: इस दृष्टान्त में यह शब्द एक पुरुष गृहस्वामी या पिता को सूचित करता है; ‘एक आदमी’ आधुनिक हिन्दी में स्वाभाविक और अर्थानुकूल है।
- source_word: τέκνα δύο
  choice: दो बच्चे
  rationale: τέκνα व्यापक शब्द है, जिसका अर्थ ‘बच्चे’ है, केवल ‘बेटे’ नहीं; इसलिए पारम्परिक संकुचित अर्थ को मुख्य पाठ में नहीं अपनाया गया।
- source_word: προσελθὼν τῷ πρώτῳ
  choice: पहले के पास जाकर
  rationale: यह क्रमिक क्रिया को सहज हिन्दी में व्यक्त करता है और पहले बच्चे के निकट जाने का भाव बनाए रखता है।
- source_word: Τέκνον
  choice: बच्चे
  rationale: सम्बोधन में प्रयुक्त τέκνον का व्यापक अर्थ सुरक्षित रखा गया है; ‘बेटे’ कहने से मूल से अधिक लिंग-विशिष्टता जुड़ जाती।
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: आज जाकर ... काम कर
  rationale: दोनों आज्ञार्थक क्रियाओं और समयसूचक σήμερον को संक्षिप्त, स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: ἐν τῷ ἀμπελῶνι
  choice: अंगूर के बाग में
  rationale: यह ἀμπελών की कृषि-संबंधी छवि को आधुनिक पाठक के लिए स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: τέκνα/τέκνον को पारम्परिक रूप से ‘बेटे/बेटे’ कहना या मूल के व्यापक पारिवारिक शब्द को बनाए रखना
  choice: बच्चे / बच्चे
  alternative: बेटे / बेटे
  rationale: इस पद में यूनानी पाठ υἱοί/υἱέ नहीं, बल्कि व्यापक τέκνα/τέκνον प्रयोग करता है। इसलिए मुख्य पाठ में मूल की व्यापकता और सम्भावित अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अंगूर का बाग’ पारम्परिक ‘दाख की बारी’ की अपेक्षा सामान्य आधुनिक हिन्दी में अधिक स्पष्ट है। सम्बोधन ‘बच्चे’ कुछ कम प्रचलित होते हुए भी मूल के गैर-लिंग-विशिष्ट शब्द को जानबूझकर सुरक्षित रखता है।
