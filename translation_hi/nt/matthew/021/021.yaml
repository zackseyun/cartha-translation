reference: Matthew 21:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: hi
  text: पर यीशु ने उन्हें उत्तर दिया, “मैं तुमसे सच कहता हूँ, यदि तुममें विश्वास हो और तुम संदेह न करो[a], तो तुम न केवल वह करोगे जो अंजीर के पेड़ के साथ हुआ, बल्कि यदि तुम इस पहाड़ से भी कहोगे, ‘उठाया जा और समुद्र में डाला जा,’ तो ऐसा हो जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “डगमगाओ नहीं” या “मन में दुविधा न रखो।”
    reason: διακριθῆτε संदेह के साथ-साथ आंतरिक डगमगाहट या मन के बँट जाने का भाव भी दे सकता है।
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: पर यीशु ने उन्हें उत्तर दिया
  rationale: यह स्वाभाविक हिन्दी में उत्तर देने की क्रिया और δέ के हल्के संक्रमण/विरोध—दोनों को व्यक्त करता है।
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यीशु के गंभीर और अधिकारपूर्ण कथन-सूत्र को आधुनिक, सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἐὰν ἔχητε πίστιν
  choice: यदि तुममें विश्वास हो
  rationale: यहाँ πίστις का आशय परमेश्वर पर भरोसे से भरे विश्वास से है, न कि मुख्यतः चरित्रगत विश्वासयोग्यता से।
- source_word: μὴ διακριθῆτε
  choice: तुम संदेह न करो
  rationale: संदर्भ में क्रिया आंतरिक हिचकिचाहट या संशय को दर्शाती है; अर्थ की व्यापकता को पादटिप्पणी में रखा गया है।
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: तुम न केवल वह करोगे जो अंजीर के पेड़ के साथ हुआ
  rationale: यूनानी पदबंध संक्षिप्त और लुप्तार्थक है; यह रूप निकटवर्ती प्रसंग का संकेत स्पष्ट करता है, पर अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: बल्कि यदि तुम इस पहाड़ से कहोगे
  rationale: κἄν कथन को अंजीर के पेड़ से अधिक बड़े उदाहरण तक ले जाता है; ‘बल्कि यदि’ हिन्दी में उस बढ़ते बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: उखड़ जा और समुद्र में जा गिर
  rationale: दोनों निष्क्रिय आज्ञार्थकों की सजीव भौतिक छवि को सहज हिन्दी में प्रस्तुत करता है; ‘उखड़ जा’ पहाड़ के अपने स्थान से उठा लिए जाने का भाव देता है।
- source_word: γενήσεται
  choice: तो ऐसा हो जाएगा
  rationale: भविष्य में कथित घटना के घटित होने को सरल और वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: चमत्कारिक कार्य के कथन में πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: इस संदर्भ में यीशु भरोसे से भरे विश्वास की बात करते हैं; ‘विश्वासयोग्यता’ यहाँ गुण या आचरण की दिशा में अर्थ को अनुचित रूप से मोड़ सकती है।
- issue: पहाड़ को समुद्र में डालने वाले कथन का स्वरूप
  choice: चित्रात्मक और अतिशयोक्तिपूर्ण शब्दावली को बिना संकीर्ण व्याख्या के बनाए रखना
  alternative: केवल शाब्दिक चमत्कार की प्रतिज्ञा; केवल कठिनाइयों पर विजय पाने का रूपक
  rationale: अनुवाद मूल की प्रबल छवि को सुरक्षित रखता है और यह तय नहीं करता कि इसे केवल शाब्दिक या केवल रूपकात्मक समझा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में बहुवचन ‘तुम’ मूल के ὑμεῖς के अनुरूप है। भाषा सहज पर गरिमापूर्ण रखी गई है। पहाड़ की छवि और कथन का धार्मिक तनाव बिना व्याख्यात्मक संकुचन के सुरक्षित है।
