  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: hi
  text: भीड़ के अधिकतर लोगों ने[a] अपने वस्त्र[b] सड़क पर बिछा दिए, और दूसरे लोग पेड़ों से डालियाँ काट रहे थे और उन्हें सड़क पर बिछा रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भीड़ के अधिकांश लोगों ने।”
    reason: lexical_alternative
  - marker: b
    text: “वस्त्र” का अनुवाद “चोगे” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: भीड़ के अधिकतर लोगों ने
  rationale: πλεῖστος सामूहिक संज्ञा ὄχλος के साथ भीड़ के अधिकांश लोगों को सूचित करता है। यह हिंदी में स्वाभाविक है और δέ को प्रसंग के प्रवाह में अनावश्यक रूप से अलग संयोजक बनाकर नहीं उभारता।
- source_word: ἔστρωσαν
  choice: बिछा दिए
  rationale: στρώννυμι यहाँ किसी वस्तु को मार्ग की सतह पर फैलाने या बिछाने के अर्थ में है; पूर्ण हुई क्रिया के लिए ‘बिछा दिए’ स्वाभाविक है।
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: अपने वस्त्र
  rationale: ‘अपने’ ἑαυτῶν के आत्मवाचक बल को व्यक्त करता है, और ‘वस्त्र’ ἱμάτια का व्यापक तथा गरिमापूर्ण हिंदी रूप है।
- source_word: ἐν τῇ ὁδῷ
  choice: सड़क पर
  rationale: यहाँ ὁδός भौतिक मार्ग को सूचित करता है; हिंदी में सतह पर वस्तुएँ बिछाने के लिए ‘सड़क पर’ मुहावरेदार है।
- source_word: ἄλλοι δὲ
  choice: और दूसरे लोग
  rationale: यह भीड़ के भीतर दूसरे समूह को जोड़ता है; δέ का यहाँ प्रबल विरोध नहीं, बल्कि कथात्मक जोड़ है।
- source_word: ἔκοπτον κλάδους ἀπὸ τῶν δένδρων
  choice: पेड़ों से डालियाँ काट रहे थे
  rationale: ‘काट रहे थे’ अपूर्ण भूतकाल की जारी क्रिया को बनाए रखता है; κλάδους के लिए ‘डालियाँ’ सामान्य आधुनिक हिंदी है।
- source_word: καὶ ἐστρώννυον ἐν τῇ ὁδῷ
  choice: और उन्हें सड़क पर बिछा रहे थे
  rationale: ‘बिछा रहे थे’ दूसरी अपूर्ण, जारी क्रिया को स्पष्ट रखता है और दोहराए गए स्थान-वाक्यांश का भी सम्मान करता है।
