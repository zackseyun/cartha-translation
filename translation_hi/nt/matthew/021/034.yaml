  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: hi
  text: जब फल पकने का समय निकट आया, तब उसने अपनी उपज लेने के लिए अपने सेवकों[a] को काश्तकारों[b] के पास भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने दासों।” यूनानी शब्द δοῦλος का अर्थ “सेवक” या “दास” दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “किसानों,” “किरायेदार किसानों,” अथवा “दाखबारी जोतने वालों।” यूनानी शब्द γεωργός खेती करने वाले व्यक्ति को दर्शाता है; इस दृष्टान्त में वे किसी दूसरे की दाखबारी जोत रहे हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: जब ... तब
  rationale: ὅτε के कालवाचक संबंध को स्वाभाविक हिन्दी में ‘जब ... तब’ से व्यक्त किया गया; δέ का हल्का कथात्मक संक्रमण अलग संयोजक के बिना भी बना रहता है।
- source_word: ἤγγισεν
  choice: निकट आया
  rationale: ἐγγίζω के ‘पास आना/निकट आना’ अर्थ को सीधे और स्वाभाविक रूप में रखता है।
- source_word: ὁ καιρὸς τῶν καρπῶν
  choice: फल का समय
  rationale: कृषि-संदर्भ में καιρός उपयुक्त या निर्धारित ऋतु-समय को दर्शाता है; ‘फल का समय’ हिन्दी में सहज है और καρπῶν की उपज/फल की धारणा बनाए रखता है।
- source_word: τοὺς δούλους αὐτοῦ
  choice: अपने सेवकों
  rationale: δοῦλος दास या सेवक दोनों अर्थ दे सकता है। यहाँ भूस्वामी के प्रतिनिधि-दूतों की भूमिका प्रमुख है, इसलिए मुख्य पाठ में ‘सेवक’ रखा गया और विकल्प पादटिप्पणी में दिया गया।
- source_word: πρὸς τοὺς γεωργοὺς
  choice: बटाईदारों के पास
  rationale: γεωργός मूलतः कृषक है, पर दृष्टान्त में ये दूसरे की दाखबारी जोतने वाले काश्तकार हैं। ‘बटाईदार’ फल में स्वामी का हिस्सा होने के संदर्भ को संक्षेप में स्पष्ट करता है।
- source_word: λαβεῖν τοὺς καρποὺς αὐτοῦ
  choice: अपना फल लेने के लिए
  rationale: λαβεῖν का मूल अर्थ ‘लेना/प्राप्त करना’ है और αὐτοῦ स्वामी के अधिकार को बताता है। यह अनुवाद ‘वसूल करने’ जैसी अतिरिक्त कानूनी छटा जोड़े बिना अर्थ सुरक्षित रखता है।
