  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: hi
  text: और वह उन्हें छोड़कर नगर से बाहर बैतनिय्याह चला गया और वहीं रात बिताई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλιπὼν
  choice: छोड़कर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की क्रिया दिखाता है; ‘छोड़कर’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: αὐτοὺς
  choice: उन्हें
  rationale: यह प्रसंग में पहले उल्लिखित लोगों की ओर संकेत करने वाला सरल सर्वनाम है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: नगर से बाहर ... चला गया
  rationale: क्रिया और ἔξω दोनों मिलकर नगर के बाहर जाने पर बल देते हैं; हिन्दी वाक्य-विन्यास में गन्तव्य को बीच में रखते हुए यह भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: πόλεως
  choice: नगर
  rationale: यहाँ यरूशलेम अभिप्रेत है; ‘नगर’ dignified और सामान्य आधुनिक हिन्दी में उपयुक्त है।
- source_word: εἰς Βηθανίαν
  choice: बैतनिय्याह चला गया
  rationale: εἰς स्थान की ओर गति बताता है; स्थाननाम के साथ ‘चला गया’ स्वाभाविक हिन्दी है।
- source_word: ηὐλίσθη
  choice: रात बिताई
  rationale: αὐλίζομαι का यहाँ अर्थ रात ठहरना या बिताना है; ‘रात बिताई’ स्पष्ट, सहज और मूल के कालगत अर्थ के अनुरूप है।
- source_word: ἐκεῖ
  choice: वहीं
  rationale: यह बैतनिय्याह की ओर पुनः संकेत करता है; ‘वहीं’ स्थान-सन्दर्भ को स्पष्ट और स्वाभाविक बनाता है।
