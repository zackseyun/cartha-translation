source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: hi
  text: जब वे यरूशलेम के पास आए और जैतून के पहाड़ पर बैतफगे पहुँचे[a], तब यीशु ने दो शिष्यों को भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम के निकट आए और बैतफगे पहुँचे, जैतून के पहाड़ की ओर।”
    reason: पहली क्रिया का ‘निकट आए’ अनुवाद और दूसरे εἰς-पदबंध की अधिक दिशात्मक समझ सम्भव है।
lexical_decisions:
- source_word: ἤγγισαν
  choice: पास पहुँचे
  rationale: ἐγγίζω यहाँ स्थान की दृष्टि से निकट आने को व्यक्त करता है। ‘पास पहुँचे’ सहज आधुनिक हिन्दी है और यरूशलेम की ओर गति बनाए रखता है।
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: इस स्थान-नाम का प्रचलित हिन्दी रूप।
- source_word: ἦλθον
  choice: आए
  rationale: ἔρχομαι के सामान्य गति-सूचक अर्थ को सीधे व्यक्त करता है और पहले क्रियापद से भेद भी बनाए रखता है।
- source_word: Βηθφαγὴ
  choice: बैतफगे
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: जैतून पहाड़ पर
  rationale: इस क्रम में पदबंध बैतफगे की भौगोलिक स्थिति बताता है। ‘पर’ स्वाभाविक हिन्दी में उस स्थान-संबंध को व्यक्त करता है, बिना पहाड़ के भीतर प्रवेश का भाव दिए।
- source_word: τότε
  choice: तब
  rationale: कथा में अगले कार्य की ओर सरल और स्वाभाविक संक्रमण।
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: किसी काम के लिए भेजने का सीधा और सामान्य कथात्मक अर्थ।
- source_word: δύο μαθητὰς
  choice: दो शिष्यों
  rationale: μαθητής के लिए ‘शिष्य’ स्पष्ट, प्रतिष्ठित और सामान्य आधुनिक हिन्दी शब्द है।
theological_decisions:
- issue: यीशु का नाम आने से पहले बहुवचन क्रियाओं का कर्ता
  choice: आरंभिक कार्यों को केवल ‘वे’ के साथ रखा गया है और यीशु का नाम वहीं दिया गया है जहाँ यूनानी पाठ उसे देता है।
  alternative: ‘यीशु और उसके शिष्य यरूशलेम के पास पहुँचे…’
  rationale: यूनानी में बहुवचन कर्ता संदर्भ से समझा जाता है, पर इस पद में ‘यीशु और उसके शिष्य’ स्पष्ट रूप से नहीं दोहराया गया। अनुवाद मूल की कथात्मक संक्षिप्तता बनाए रखता है।
- issue: बैतफगे और जैतून पहाड़ का भौगोलिक संबंध
  choice: ‘जैतून पहाड़ पर बैतफगे आए’
  alternative: ‘बैतफगे आए, जैतून पहाड़ की ओर’
  rationale: दूसरा εἰς-पदबंध बैतफगे को जैतून पहाड़ के संदर्भ में स्थित करता हुआ समझा गया है। फिर भी स्रोत की संक्षिप्त रचना के कारण वैकल्पिक दिशात्मक समझ को पूरी तरह समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वे’ मूल पाठ के निहित समूह-कर्ता को सुरक्षित रखता है; ‘यीशु और उसके शिष्य’ जैसा अतिरिक्त स्पष्टिकरण नहीं जोड़ा गया।
