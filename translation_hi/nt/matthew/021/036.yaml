base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: hi
  text: फिर उसने पहले सेवकों की अपेक्षा अधिक संख्या में अन्य सेवकों[a] को भेजा, और उन्होंने उनके साथ भी वैसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अन्य दासों को।” यूनानी शब्द δοῦλος का अर्थ प्रसंग के अनुसार “सेवक” या “दास” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: फिर
  rationale: यह क्रिया की पुनरावृत्ति दिखाता है और हिन्दी कथन-क्रम में स्वाभाविक है।
- source_word: ἀπέστειλεν
  choice: उसने ... भेजा
  rationale: ἀποστέλλω के अओरिस्ट रूप का सीधा और सहज कथात्मक अनुवाद।
- source_word: ἄλλους δούλους
  choice: दूसरे सेवकों
  rationale: इस दृष्टान्त में ये स्वामी द्वारा भेजे गए प्रतिनिधि हैं; आधुनिक हिन्दी में ‘सेवक’ स्वाभाविक है, जबकि दासत्व का सम्भव अर्थ पादटिप्पणी में रखा गया है।
- source_word: πλείονας τῶν πρώτων
  choice: पहले से भी अधिक संख्या में
  rationale: तुलनात्मक वाक्यांश बाद के दल की संख्या पहले दल से अधिक बताता है; यह हिन्दी में तुलना को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: उन्होंने उनके साथ भी वैसा ही किया
  rationale: पिछले पद में बताए व्यवहार की ओर संकेत बनाए रखता है और मूल की अनाफोरिक संक्षिप्तता को अनावश्यक रूप से नहीं खोलता।
theological_decisions:
- issue: दृष्टान्त में δοῦλος का अनुवाद
  choice: सेवक
  alternative: दास
  rationale: यहाँ कथा का मुख्य बल स्वामी द्वारा भेजे गए प्रतिनिधियों और उनके साथ हुए दुर्व्यवहार पर है, उनकी कानूनी दास-स्थिति पर नहीं। फिर भी यूनानी शब्द की अर्थ-सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण कथात्मक शैली। ‘पहले से भी अधिक संख्या में’ मूल तुलना को स्पष्ट करता है, और ‘वैसा ही किया’ पिछले पद पर निर्भर मूल अभिव्यक्ति को बनाए रखता है।
