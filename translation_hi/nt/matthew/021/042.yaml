id: MAT.21.42
reference: Matthew 21:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: hi
  text: 'यीशु ने उनसे कहा, “क्या तुमने पवित्र शास्त्रों में कभी नहीं पढ़ा: ‘जिस पत्थर को भवन बनानेवालों ने अस्वीकार कर दिया था, वही कोने का मुख्य पत्थर[a] बन गया। यह प्रभु[b] की ओर से हुआ, और हमारी दृष्टि में अद्भुत है’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शिखर का पत्थर’; शाब्दिक अर्थ ‘कोने का सिर’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘प्रभु’; इस उद्धरण के इब्रानी स्रोत में ‘यहोवा’ (YHWH) है।
    reason: source_language_background
lexical_decisions:
- source_word: Λέγει
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथन-शैली में भूतकाल ‘कहा’ अधिक स्वाभाविक है और अर्थ में कोई परिवर्तन नहीं करता।
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: क्या तुमने ... कभी नहीं पढ़ा
  rationale: यह स्वाभाविक हिन्दी में मूल के जोरदार आलंकारिक प्रश्न को बनाए रखता है।
- source_word: ἐν ταῖς γραφαῖς
  choice: पवित्र शास्त्रों में
  rationale: यहाँ γραφαί इस्राएल के मान्य पवित्र लेखों को दर्शाता है; बहुवचन ‘शास्त्रों’ मूल के रूप को भी सुरक्षित रखता है।
- source_word: Λίθον
  choice: जिस पत्थर को
  rationale: उद्धरण एक विशेष पत्थर की बात करता है; सम्बन्धवाचक रचना हिन्दी में आगे के वाक्य को स्वाभाविक रूप से जोड़ती है।
- source_word: ἀπεδοκίμασαν
  choice: अस्वीकार कर दिया था
  rationale: क्रिया जाँचने के बाद अनुपयुक्त मानकर ठुकराने का भाव रखती है; ‘अस्वीकार’ dignified और स्पष्ट है।
- source_word: οἱ οἰκοδομοῦντες
  choice: भवन बनानेवालों
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त का अर्थ ‘बनानेवाले’ है; ‘भवन’ जोड़ने से पत्थर और निर्माण का रूपक सहज स्पष्ट होता है।
- source_word: οὗτος
  choice: वही
  rationale: ‘वही’ यूनानी संकेतवाचक के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐγενήθη εἰς
  choice: बन गया
  rationale: यह परिणामस्वरूप प्राप्त हुई नई स्थिति को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κεφαλὴν γωνίας
  choice: कोने का मुख्य पत्थर
  rationale: यह मूल मुहावरे के ‘कोने’ और प्रधानता—दोनों भावों को बनाए रखता है, जबकि सम्भव स्थापत्य अर्थ ‘शिखर का पत्थर’ पाद-टिप्पणी में दिया गया है।
- source_word: παρὰ κυρίου
  choice: प्रभु की ओर से
  rationale: सम्बन्धबोधक παρά के सम्बन्धकारक प्रयोग में स्रोत या उद्गम का भाव है; ‘की ओर से’ हिन्दी में उसे स्पष्ट रूप से व्यक्त करता है।
- source_word: θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν
  choice: हमारी दृष्टि में अद्भुत
  rationale: यह उद्धरण की गरिमापूर्ण शैली और ‘हमारी आँखों में’ के अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: भजन के उद्धरण में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी पाठ में κυρίου है, इसलिए मुख्य पाठ में ‘प्रभु’ रखा गया है। उद्धृत इब्रानी स्रोत में परमेश्वर का नाम YHWH है; स्रोतगत यह जानकारी पाद-टिप्पणी में पारदर्शी रूप से दी गई है।
- issue: पत्थर के रूपक का मसीही अनुप्रयोग
  choice: रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: मुख्य पाठ में पत्थर को स्पष्ट रूप से मसीह कहना
  rationale: आसपास के प्रसंग में यीशु इस उद्धरण को अपने ऊपर लागू करते हैं, लेकिन इस पद के उद्धृत शब्द स्वयं पत्थर को सीधे ‘मसीह’ नहीं कहते। इसलिए अनुवाद व्याख्या को पाठ में नहीं जोड़ता।
- issue: κεφαλὴ γωνίας का स्थापत्य अर्थ
  choice: कोने का मुख्य पत्थर
  alternative: शिखर का पत्थर
  rationale: वाक्यांश प्रधान कोने के पत्थर को दर्शा सकता है, पर ‘शिखर का पत्थर’ भी सम्भव है। मुख्य पाठ में प्रचलित और रूपक-संगत अर्थ रखा गया है तथा वास्तविक अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी की स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। शास्त्रीय उद्धरण की ऊँची शैली बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ या पुरातन शब्दावली से बचा गया है। सभी पाद-टिप्पणी चिह्न सम्बन्धित शब्दों के ठीक बाद मुख्य पाठ में रखे गए हैं।
