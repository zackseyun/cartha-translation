  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: hi
  text: इसलिए, जब अंगूर का बाग का मालिक[a] आएगा, तो वह उन किसानों[b] के साथ क्या करेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अंगूर के बाग का स्वामी।’ यूनानी शब्द क्यूरियोस का अनुवाद प्रायः ‘प्रभु’ भी होता है, लेकिन यहाँ दृष्टान्त के भीतर इसका अर्थ बाग का मालिक है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पट्टेदार किसान।’ पूरे दृष्टान्त से स्पष्ट है कि ये किसान बाग लेकर खेती कर रहे थे, यद्यपि यूनानी शब्द का सामान्य अर्थ ‘किसान’ या ‘खेती करने वाला’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: जब
  rationale: उपवाक्य में प्रत्याशित भावी अवसर का संकेत है; इस प्रसंग में ‘जब’ स्वाभाविक है, जबकि ‘जब कभी’ अनावश्यक रूप से बार-बार होने का भाव दे सकता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछली कथा से निकलने वाले प्रश्न की ओर तार्किक संक्रमण दिखाता है; ‘इसलिए’ इस निष्कर्षात्मक बल को स्पष्ट और सहज रखता है।
- source_word: ἔλθῃ
  choice: आएगा
  rationale: ὅταν के साथ प्रयुक्त एओरिस्ट सब्जंक्टिव प्रत्याशित भावी आगमन बताता है; हिन्दी में भविष्यकाल स्वाभाविक है।
- source_word: κύριος
  choice: मालिक
  rationale: यहाँ दाखबारी के स्वामी या संपत्ति-मालिक का अर्थ है, न कि सीधे तौर पर ईश्वरीय उपाधि ‘प्रभु’। ‘मालिक’ आधुनिक हिन्दी में भूमिका को स्पष्ट करता है।
- source_word: ἀμπελῶνος
  choice: अंगूरों के बाग
  rationale: ἀμπελών का अर्थ अंगूर उगाने का बाग है। यह रूप सामान्य पाठक के लिए पारंपरिक ‘दाख की बारी’ से अधिक तुरंत समझ में आता है।
- source_word: τί ποιήσει
  choice: क्या करेगा
  rationale: भविष्यकालीन प्रश्न मालिक की आगामी कार्रवाई पूछता है। दत्तिव कारक का लक्ष्य हिन्दी के ‘के साथ’ द्वारा स्वाभाविक रूप से व्यक्त होता है।
- source_word: γεωργοῖς
  choice: किसानों
  rationale: γεωργός का सामान्य अर्थ किसान या खेती करने वाला है। कथा के व्यापक प्रसंग में वे पट्टेदार हैं, पर यह विशेषता स्वयं शब्द में अनिवार्य रूप से निहित नहीं है।
- source_word: ἐκείνοις
  choice: उन
  rationale: संकेतवाचक शब्द विशेष रूप से पहले वर्णित किसानों की ओर इशारा करता है; ‘उन’ इसकी विशिष्टता और हल्की दूरी बनाए रखता है।
theological_decisions:
- issue: दृष्टान्त में κύριος का अनुवाद
  choice: मालिक
  alternative: स्वामी; प्रभु
  rationale: तत्काल प्रसंग में यह अंगूरों के बाग के संपत्ति-मालिक को दर्शाता है। ‘प्रभु’ करने से यहाँ ऐसा प्रत्यक्ष ईश्वरीय या मसीही शीर्षक आ सकता है जिसे इस वाक्य का कथास्तरीय प्रयोग स्वयं स्पष्ट नहीं करता।
- issue: γεωργοί में पट्टेदारी का भाव
  choice: किसान
  alternative: पट्टेदार किसान; काश्तकार
  rationale: दृष्टान्त से ज्ञात होता है कि वे बाग लेकर खेती कर रहे हैं, लेकिन यूनानी संज्ञा मूलतः खेती करने वालों को कहती है। मुख्य पाठ में व्यापक अर्थ रखा गया है और प्रसंगगत पट्टेदारी को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘अंगूरों का बाग’ सामान्य पाठक के लिए सहज है; ‘मालिक’ कथानक की संपत्ति-संबंधी भूमिका स्पष्ट करता है। प्रश्न की मौखिक स्वाभाविकता के लिए ‘तो’ और लक्षित कार्रवाई के लिए ‘के साथ’ प्रयुक्त हैं।
