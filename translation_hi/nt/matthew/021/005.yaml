id: MAT.21.5
reference: Matthew 21:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: hi
  text: सिय्योन की बेटी से कहो, ‘देख, तेरा राजा तेरे पास आ रहा है। वह नम्र[a] है और गधे पर, और एक बछेड़े[b] पर—जो बोझा ढोनेवाले पशु का बच्चा है—सवार है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोमल स्वभाव का।” यूनानी शब्द πραΰς का अर्थ “नम्र,” “दीन” या “कोमल स्वभाव का” हो सकता है; यहाँ जकर्याह 9:9 की गूँज है।
    reason: lexical_alternative
  - marker: b
    text: 'मत्ती भविष्यवाणी की दोनों जुड़ी हुई पशु-अभिव्यक्तियाँ बनाए रखता है: “गधे पर, और एक बछेड़े पर—जो बोझा ढोनेवाले पशु का बच्चा है।”'
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: कहो
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; यह उद्धरण सुनाने का निर्देश देता है।
- source_word: τῇ θυγατρὶ Σιών
  choice: सिय्योन की बेटी
  rationale: भविष्यवाणी में प्रयुक्त मानवीकरण को बनाए रखता है; इसे केवल ‘सिय्योन के लोग’ कहकर सपाट नहीं करता।
- source_word: Ἰδοὺ
  choice: देख
  rationale: ध्यान आकर्षित करनेवाले उद्गार का वर्तमान और सहज हिन्दी रूप है।
- source_word: ὁ βασιλεύς σου
  choice: तेरा राजा
  rationale: एकवचन संबोधन और राजकीय आशय दोनों को सीधे बनाए रखता है।
- source_word: ἔρχεταί σοι
  choice: तेरे पास आ रहा है
  rationale: वर्तमान काल की सजीव, निकट आगमन वाली अभिव्यक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πραῢς
  choice: नम्र
  rationale: शब्द की दीनता, कोमलता और गैर-दमनकारी स्वभाव की अर्थ-सीमा में ‘नम्र’ स्वाभाविक है; ‘कोमल स्वभाव का’ भी संभव है।
- source_word: ἐπιβεβηκὼς
  choice: सवार है
  rationale: पूर्ण कृदंत की उस अवस्था को व्यक्त करता है जिसमें राजा पशु पर चढ़ा हुआ आता है।
- source_word: ἐπὶ ὄνον
  choice: गधे पर
  rationale: ὄνος का सीधा आधुनिक हिन्दी अनुवाद।
- source_word: πῶλον
  choice: एक बछेड़े
  rationale: युवा पशु को सूचित करता है; आगे का वाक्यांश उसके प्रकार और संबंध को स्पष्ट करता है।
- source_word: υἱὸν ὑποζυγίου
  choice: जो बोझा ढोनेवाले पशु का बच्चा है
  rationale: सेमिटिक ‘पुत्र’ को हिन्दी में स्वाभाविक संबंधसूचक रूप में देता है और भारवाही पशु की छवि को सुरक्षित रखता है।
theological_decisions:
- issue: जकर्याह 9:9 के भविष्यवाणी-संदर्भ में πραῢς का अर्थ
  choice: नम्र
  alternative: कोमल स्वभाव का; दीन
  rationale: ‘नम्र’ यूनानी शब्द की नैतिक और व्यवहारगत विनम्रता को संक्षेप में व्यक्त करता है, जबकि पादटिप्पणी वास्तविक अर्थ-विकल्प को सुरक्षित रखती है।
- issue: गधे और बछेड़े के दो जुड़े हुए उल्लेख
  choice: ‘गधे पर, और एक बछेड़े पर’ के रूप में दोनों पद बनाए रखना
  alternative: दोनों को एक ही पशु का समानार्थी वर्णन मानकर एक पद में मिला देना
  rationale: मत्ती के यूनानी पाठ में दोनों पशु-अभिव्यक्तियाँ καὶ से जुड़ी हुई हैं। अनुवाद उन्हें चुपचाप एक में नहीं मिलाता, भले ही उनके पारस्परिक संबंध की व्याख्या खुली रहे।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। भविष्यवाणी का मानवीकरण ‘सिय्योन की बेटी’ के रूप में रखा गया है। ‘देख’ पुरातन ‘देखो/निहार’ की अपेक्षा सहज है, और पशुओं से संबंधित दोहरे वाक्य-विन्यास को जानबूझकर सुरक्षित रखा गया है।
