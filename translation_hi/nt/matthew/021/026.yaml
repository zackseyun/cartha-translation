source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: hi
  text: पर यदि हम कहें, ‘मनुष्यों से’[a], तो हम भीड़ से डरते हैं, क्योंकि सभी लोग यूहन्ना को भविष्यद्वक्ता मानते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानवीय मूल से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: पर यदि हम कहें
  rationale: ἐὰν के साथ aorist subjunctive एक संभावित शर्त व्यक्त करता है। ‘यदि हम कहें’ आधुनिक हिन्दी में स्वाभाविक है और विचार-विमर्श की सशर्त भावना बनाए रखता है।
- source_word: Ἐξ ἀνθρώπων
  choice: मनुष्यों की ओर से
  rationale: यह पिछले पद के ‘स्वर्ग की ओर से’ के विपरीत यूहन्ना के बपतिस्मे के मानवीय स्रोत को बताता है। ‘मनुष्यों की ओर से’ संक्षिप्त है और केवल पुरुषों का नहीं, मनुष्यों का सामान्य अर्थ देता है।
- source_word: φοβούμεθα τὸν ὄχλον
  choice: हमें भीड़ से डर लगता है
  rationale: यह हिन्दी में स्वाभाविक ढंग से उनकी तत्काल आशंका व्यक्त करता है; τὸν ὄχλον से आशय वहाँ इकट्ठी भीड़ है।
- source_word: πάντες
  choice: सभी लोग
  rationale: यह भीड़ के लोगों को सामूहिक रूप से संदर्भित करता है। ‘सभी लोग’ हिन्दी में कर्ता को स्पष्ट करता है।
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: यूहन्ना को भविष्यद्वक्ता मानते हैं
  rationale: ἔχω + कर्म + ὡς + विधेय का मुहावरा किसी को कुछ समझने या मानने का भाव देता है। यह हिन्दी रूप उस मूल्यांकन को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἰωάννην
  choice: यूहन्ना
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
theological_decisions:
- issue: ‘स्वर्ग’ और मानवीय स्रोत के बीच विरोध में ἀνθρώπων का अनुवाद
  choice: मनुष्यों की ओर से
  alternative: मानवीय मूल का
  rationale: यह अनुवाद निकट संदर्भ के स्रोत-संबंधी विरोध को बनाए रखता है और ἀνθρώπων को केवल पुरुषों तक सीमित नहीं करता।
- issue: यूहन्ना के विषय में भीड़ की धारणा
  choice: सभी लोग यूहन्ना को भविष्यद्वक्ता मानते हैं
  alternative: सभी लोग यूहन्ना को एक भविष्यद्वक्ता समझते हैं
  rationale: पाठ भीड़ की मान्यता की सूचना देता है; अनुवाद न तो इससे अधिक धर्मवैज्ञानिक निष्कर्ष जोड़ता है, न कथन की शक्ति घटाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मनुष्यों की ओर से’ संदर्भ में ‘स्वर्ग की ओर से’ के साथ समानांतरता बनाए रखता है, जबकि ‘हमें भीड़ से डर लगता है’ सामान्य आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
