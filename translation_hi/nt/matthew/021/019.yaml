id: MAT.21.19
reference: Matthew 21:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: hi
  text: और सड़क के किनारे अंजीर का एक पेड़ देखकर वह उसके पास गया और उस पर पत्तों के सिवा और कुछ न पाया। और उसने उससे कहा, “अब से फिर कभी तुझसे फल न निकले।”[a] और अंजीर का पेड़ उसी क्षण सूख गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अधिक मुहावरेदार ढंग से: “तुझ पर फिर कभी फल न लगे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συκῆν μίαν
  choice: अंजीर का एक पेड़
  rationale: μίαν को स्पष्ट रूप से ‘एक’ रखा गया है; हिन्दी में यह स्वाभाविक है और दृश्य में उस एक पेड़ को सामने लाता है।
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: सड़क के किनारे
  rationale: स्थिर स्थान के लिए यह स्वाभाविक हिन्दी है; ‘सड़क पर’ अनावश्यक रूप से पेड़ को मार्ग के बीच रख सकता है।
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: उसके पास गया
  rationale: पेड़ की ओर जाकर निकट पहुँचने का भाव सहज हिन्दी में व्यक्त होता है।
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον
  choice: उस पर पत्तों के सिवा और कुछ न पाया
  rationale: पेड़ के संबंध में हिन्दी ‘उस पर’ कहती है; ‘के सिवा और कुछ नहीं’ φύλλα μόνον के एकमात्र होने पर बल को बनाए रखता है।
- source_word: λέγει αὐτῇ
  choice: उसने उससे कहा
  rationale: ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथन-शैली में भूतकाल से व्यक्त किया गया है।
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  choice: अब फिर कभी तुझसे फल न निकले
  rationale: ‘अब फिर कभी’ Μηκέτι और εἰς τὸν αἰῶνα की स्थायी निषेधात्मक शक्ति को साथ व्यक्त करता है; ‘तुझसे फल न निकले’ ἐκ σοῦ और जुस्सिव भाव को सुरक्षित रखता है।
- source_word: ἐξηράνθη παραχρῆμα
  choice: उसी क्षण सूख गया
  rationale: पेड़ के सूख जाने और παραχρῆμα की तात्कालिकता, दोनों को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: अंजीर के पेड़ से कहे गए वचन का बल
  choice: 'इसे निषेधात्मक/आज्ञार्थक घोषणा के रूप में रखा गया है: “अब फिर कभी तुझसे फल न निकले।”'
  alternative: 'इसे भविष्यवाणी के रूप में कहा जा सकता था: “तुझ पर फिर कभी फल नहीं लगेगा।”'
  rationale: Μηκέτι के साथ subjunctive γένηται केवल भविष्य का वर्णन नहीं, बल्कि प्रभावशाली निषेधात्मक उद्घोषणा व्यक्त करता है। मुख्य पाठ में पेड़ के प्रतीकात्मक अर्थ की कोई व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखा गया है। पेड़ को संबोधित करते समय ‘तुझसे’ मूल के प्रत्यक्ष और गंभीर संबोधन को बनाए रखता है।
