translation:
  language: hi
  text: और प्रार्थना में विश्वास के साथ तुम जो कुछ भी माँगोगे[a], वह पाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “वह सब जो तुम माँगोगे” या “हर वह चीज़ जो तुम माँगोगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: जो कुछ भी
  rationale: यह संयुक्त अभिव्यक्ति व्यापक और अनिश्चित अर्थ में ‘जो कुछ भी’ या ‘वह सब जो’ बताती है। ‘जो कुछ भी’ स्वाभाविक आधुनिक हिन्दी में इसके पूरे दायरे को बनाए रखता है।
- source_word: ἂν αἰτήσητε
  choice: माँगोगे
  rationale: ἄν के साथ अओरिस्ट सब्जंक्टिव अनिश्चित संबंधवाचक कथन का अंग है। हिन्दी में ‘जो कुछ भी माँगोगे’ इस भाव को स्वाभाविक रूप से व्यक्त करता है; अलग से ‘शायद’ जोड़ना अनावश्यक होगा।
- source_word: ἐν τῇ προσευχῇ
  choice: प्रार्थना में
  rationale: यह पदबंध प्रार्थना के संदर्भ या अवस्था को दर्शाता है। ‘प्रार्थना में’ संज्ञात्मक रूप और यूनानी वाक्य-संबंध दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: πιστεύοντες
  choice: विश्वास करते हुए
  rationale: वर्तमान कृदंत माँगने के साथ-साथ जारी विश्वास को व्यक्त करता है। ‘विश्वास करते हुए’ यूनानी व्याकरण को स्पष्ट शर्तवाचक वाक्य में बदले बिना उस संबंध को बनाए रखता है।
- source_word: λήμψεσθε
  choice: पाओगे
  rationale: भविष्यकालीन क्रिया का सीधा और स्वाभाविक हिन्दी रूप ‘पाओगे’ है। यह सामान्य पाठकों के लिए स्पष्ट है और ‘प्राप्त करोगे’ की अपेक्षा कम औपचारिक होते हुए भी गरिमापूर्ण है।
theological_decisions:
- issue: विश्वास और प्रार्थना के उत्तर का संबंध
  choice: ‘विश्वास करते हुए’ के रूप में कृदंत-संबंध को बनाए रखा गया है।
  alternative: ‘यदि तुम विश्वास करोगे’ या ‘बशर्ते कि तुम विश्वास करो’
  rationale: यूनानी पाठ विश्वास को प्रार्थना और माँगने से जोड़ता है, पर स्पष्ट शर्तवाचक उपवाक्य नहीं बनाता। कृदंत रूप बनाए रखने से पाठ का जोर प्रकट होता है, जबकि उत्तरित प्रार्थना की प्रक्रिया या सीमा से जुड़े धर्मवैज्ञानिक प्रश्नों को अनावश्यक रूप से हल नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और बोलचाल में सहज रूप रखा गया है। ‘जो कुछ भी’ व्यापकता को, ‘प्रार्थना में’ मूल संज्ञात्मक पदबंध को, और ‘विश्वास करते हुए’ मूल कृदंत की समकालिकता तथा धर्मवैज्ञानिक तनाव को सुरक्षित रखते हैं।
