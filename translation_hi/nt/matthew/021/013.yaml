source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: hi
  text: और वह उनसे कहता है, “लिखा है[a], ‘मेरा घर प्रार्थना का घर कहलाएगा,’ पर तुम उसे लुटेरों की मांद बना रहे हो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यीशु यहाँ यशायाह 56:7 और यिर्मयाह 7:11 को एक साथ जोड़ते हैं।
    reason: cross_reference
  - marker: b
    text: या “डाकुओं की मांद।” यूनानी शब्द लुटेरों या हिंसक डाकुओं के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: कहता है
  rationale: यूनानी ऐतिहासिक वर्तमान को बनाए रखता है और मत्ती के वर्णन की सजीवता को अनावश्यक रूप से भूतकाल में नहीं बदलता।
- source_word: Γέγραπται
  choice: लिखा है
  rationale: यह पवित्रशास्त्र उद्धृत करने वाला स्वाभाविक हिन्दी सूत्र है और यूनानी पूर्णकाल में निहित स्थायी प्रामाणिकता को व्यक्त करता है।
- source_word: οἶκός μου
  choice: मेरा घर
  rationale: ‘मन्दिर’ कहकर अर्थ को संकरा करने के बजाय मूल रूपक और यशायाह के उद्धरण की शब्दावली सुरक्षित रखी गई है।
- source_word: οἶκος προσευχῆς
  choice: प्रार्थना का घर
  rationale: सम्बन्धकारक रचना का सहज हिन्दी रूप है और यशायाह 56:7 की पहचान योग्य भाषा बनाए रखता है।
- source_word: κληθήσεται
  choice: कहलाएगा
  rationale: भविष्यत् कर्मवाच्य का सीधा, वर्तमान हिन्दी में स्वाभाविक अनुवाद।
- source_word: ποιεῖτε
  choice: बना रहे हो
  rationale: वर्तमान काल की जारी क्रिया को प्रकट करता है और क्रिया ποιεῖτε के निकट रहता है।
- source_word: σπήλαιον
  choice: मांद
  rationale: यह गुफानुमा अड्डे या छिपने के ठिकाने की छवि व्यक्त करता है और यिर्मयाह 7:11 के भविष्यद्वाणीपूर्ण आरोप के अनुकूल है।
- source_word: λῃστῶν
  choice: लुटेरों
  rationale: सामान्य पाठक के लिए स्वाभाविक है; यूनानी शब्द डाकुओं अथवा हिंसक लुटेरों को भी सूचित कर सकता है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: पुराने नियम का उद्धरण और संकेत
  choice: यशायाह 56:7 (‘मेरा घर प्रार्थना का घर कहलाएगा’) और यिर्मयाह 7:11 (‘लुटेरों की मांद’) दोनों की पहचान योग्य शब्दावली सुरक्षित रखी गई है।
  alternative: ऐसी स्वतंत्र समकालीन अभिव्यक्ति जो इन पारस्परिक शास्त्रीय सम्बन्धों को अस्पष्ट कर दे।
  rationale: यीशु का कथन शास्त्र के उद्धरण और संकेत को जोड़ता है; दोनों को स्पष्ट रखना धर्मवैज्ञानिक पारदर्शिता के लिए महत्त्वपूर्ण है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। ऐतिहासिक वर्तमान तथा शास्त्रीय उद्धरण की पहचानी जा सकने वाली संरचना को बनाए रखा गया है।
