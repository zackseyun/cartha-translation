  text: ⸀Πρωῒ δὲ ⸀ἐπανάγων εἰς τὴν πόλιν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: hi
  text: सुबह-सुबह, जब वह नगर लौट रहा था, तो उसे भूख लगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: सुबह-सुबह
  rationale: यह क्रियाविशेषण दिन के आरंभिक समय को सूचित करता है। ‘सुबह-सुबह’ आधुनिक हिन्दी में स्वाभाविक है और समय की आरंभिकता को स्पष्ट रखता है।
- source_word: δὲ
  choice: तो
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है, प्रबल विरोधसूचक नहीं। हिन्दी की आश्रित कालवाचक रचना ‘जब…तो…’ में ‘तो’ कथा के प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπανάγων
  choice: जब वह … लौट रहा था
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ-साथ चल रही क्रिया बताता है; यह रूप उस समकालिकता को सहज हिन्दी में सुरक्षित रखता है।
- source_word: εἰς τὴν πόλιν
  choice: नगर लौट रहा था
  rationale: εἰς नगर की ओर/नगर में गति दर्शाता है। ‘नगर लौट रहा था’ गंतव्य को स्वाभाविक रूप से व्यक्त करता है, बिना यह मान लेने के कि वह पहुँच चुका था।
- source_word: ἐπείνασεν
  choice: उसे भूख लगी
  rationale: यह हिन्दी में भूख लगने की घटना को स्वाभाविक ढंग से व्यक्त करता है और यूनानी अओरिस्ट के संभावित आरंभसूचक बल को ‘वह भूखा था’ की अपेक्षा बेहतर सुरक्षित रखता है।
theological_decisions:
- issue: यीशु की भूख का मसीह-विज्ञान संबंधी आशय
  choice: भूख के वास्तविक मानवीय अनुभव को सीधे रूप में व्यक्त किया गया है।
  alternative: इसे केवल रूपक मानना या व्याख्यात्मक धार्मिक भाषा जोड़ना।
  rationale: पद भूख को साधारण कथात्मक तथ्य के रूप में प्रस्तुत करता है। सीधा अनुवाद यीशु की वास्तविक मानवता की पाठगत गवाही बनाए रखता है और पाठ से बाहर की व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। ‘नगर’ बाइबलीय कथा-शैली में स्वाभाविक है; ‘सुबह-सुबह’ आरंभिक समय का जीवंत परंतु सामान्य संकेत देता है।
