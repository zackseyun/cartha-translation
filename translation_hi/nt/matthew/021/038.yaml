source:
  edition: SBLGNT
  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: hi
  text: लेकिन जब पट्टेदार किसानों ने बेटे को देखा, तो उन्होंने आपस में कहा, “यही वारिस है। आओ, हम इसे मार डालें और इसकी विरासत हथिया लें[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “हम उसकी विरासत पा लें”; प्रसंग में आशय उस पर बलपूर्वक अधिकार कर लेना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: पट्टेदार किसान
  rationale: दृष्टान्त में ये केवल खेतिहर मज़दूर नहीं, बल्कि मालिक से दाख की बारी लेकर उसे चलाने वाले लोग हैं। ‘पट्टेदार किसान’ उनकी कृषि और किरायेदारी—दोनों भूमिकाएँ स्पष्ट करता है।
- source_word: ἰδόντες
  choice: जब ... देखा
  rationale: भूतकालिक कृदन्त को स्वाभाविक हिन्दी में कालवाचक उपवाक्य के रूप में व्यक्त किया गया है, जिससे घटनाओं का क्रम बना रहता है।
- source_word: τὸν υἱόν
  choice: बेटे को
  rationale: यूनानी में स्पष्ट संबंधवाचक सर्वनाम नहीं है; ‘बेटे’ से कथा-स्तर की सीधी अभिव्यक्ति और प्रसंग से स्पष्ट संबंध दोनों सुरक्षित रहते हैं।
- source_word: ἐν ἑαυτοῖς
  choice: आपस में
  rationale: बहुवचन समूह के भीतर हुई बातचीत को आधुनिक हिन्दी में ‘आपस में’ स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: κληρονόμος
  choice: वारिस
  rationale: यह कानूनी और पारिवारिक उत्तराधिकार का सामान्य, सहज हिन्दी शब्द है।
- source_word: δεῦτε
  choice: आओ
  rationale: यह अगले काम के लिए सामूहिक उकसावे या आह्वान को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀποκτείνωμεν
  choice: हम इसे मार डालें
  rationale: सामूहिक प्रस्तावसूचक subjunctive को ‘हम ... डालें’ से व्यक्त किया गया है। ‘हत्या करें’ यूनानी क्रिया से अधिक स्पष्ट कानूनी-नैतिक निर्णय जोड़ देता।
- source_word: σχῶμεν
  choice: हथिया लें
  rationale: मूल क्रिया का बुनियादी अर्थ ‘अपने पास रखना/पाना’ है, पर बेटे को मारने के बाद विरासत लेने के प्रसंग में बलपूर्वक अधिकार कर लेने का आशय है। ‘हथिया लें’ इस शत्रुतापूर्ण अभिप्राय को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: κληρονομίαν αὐτοῦ
  choice: इसकी विरासत
  rationale: ‘विरासत’ κληρονομία का सीधा समतुल्य है और ‘वारिस’ के साथ अर्थ-संबंध बनाए रखता है; ‘इसकी’ αὐτοῦ को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: दृष्टान्त में बेटे का संकेत
  choice: मुख्य पाठ में केवल ‘बेटे’ रखा गया है और उसकी पहचान स्पष्ट करके यीशु नहीं जोड़ा गया।
  alternative: व्याख्यात्मक रूप से ‘मालिक के बेटे’ या यीशु की ओर स्पष्ट संकेत देने वाली अभिव्यक्ति रखना।
  rationale: मत्ती के व्यापक कथानक में बेटा यीशु की ओर संकेत करता है, पर यह पद स्वयं दृष्टान्त के कथा-स्तर पर बोलता है। सरल शब्दावली उस मसीही संकेत को मिटाती नहीं, पर व्याख्या को अनुवाद में आरोपित भी नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘पट्टेदार किसान’ सामाजिक भूमिका को स्पष्ट करता है, जबकि संवाद में ‘यही’, ‘आओ’ और ‘हथिया लें’ कथात्मक तत्परता और षड्यंत्र का स्वर बनाए रखते हैं। पादटिप्पणी-चिह्न उसी पदांश के बाद रखा गया है जिसे वह स्पष्ट करता है।
