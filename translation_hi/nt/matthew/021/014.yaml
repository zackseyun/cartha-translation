  text: Καὶ προσῆλθον αὐτῷ ⸂τυφλοὶ καὶ χωλοὶ⸃ ἐν τῷ ἱερῷ, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: hi
  text: और मन्दिर-परिसर में अंधे और लँगड़े उसके पास आए, और उसने उन्हें चंगा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: उसके पास आए
  rationale: προσέρχομαι के साथ सम्बन्धित व्यक्ति के लिए प्रयुक्त सम्प्रदान कारक यहाँ यीशु की ओर आकर उसके निकट पहुँचने का भाव देता है। ‘उसके पास आए’ सहज आधुनिक हिन्दी है।
- source_word: τυφλοὶ
  choice: अंधे
  rationale: यह विशेषण संज्ञा के रूप में बहुवचन व्यक्तियों के लिए प्रयुक्त है। ‘अंधे’ यूनानी की संक्षिप्त अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: χωλοὶ
  choice: लँगड़े
  rationale: यह संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण है और उन लोगों को सूचित करता है जिन्हें चलने में अक्षमता थी। ‘लँगड़े’ यहाँ संक्षिप्त और प्रचलित बाइबलीय हिन्दी है।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर-परिसर में
  rationale: ἱερόν सामान्यतः केवल भीतरी पवित्र भवन नहीं, बल्कि समूचे मन्दिर-क्षेत्र को सूचित करता है। ‘मन्दिर-परिसर’ स्थानगत अर्थ को मुख्य पाठ में स्पष्ट करता है।
- source_word: ἐθεράπευσεν αὐτούς
  choice: उसने उन्हें चंगा किया
  rationale: सुसमाचारों में θεραπεύω रोग या अक्षमता से स्वस्थ करने के अर्थ में आता है। ‘चंगा किया’ हिन्दी बाइबल की गरिमापूर्ण और आम समझ में आने वाली अभिव्यक्ति है।
theological_decisions:
- issue: ἱερόν से सूचित चंगाई का स्थान
  choice: यीशु ने उन्हें व्यापक मन्दिर-परिसर में चंगा किया।
  alternative: यीशु ने उन्हें मन्दिर के आँगनों में चंगा किया।
  rationale: ἱερόν का अर्थ मन्दिर का पूरा क्षेत्र है, न कि विशेष रूप से भीतरी पवित्रस्थान (ναός)। ‘मन्दिर-परिसर’ इस भेद को बिना अनावश्यक विशिष्टता के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली। ‘मन्दिर-परिसर’ मूल यूनानी के स्थानगत भेद को पाठ में ही स्पष्ट करता है, इसलिए फुटनोट आवश्यक नहीं है।
