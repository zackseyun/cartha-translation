source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: hi
  text: यूहन्ना का बपतिस्मा कहाँ से था—स्वर्ग की ओर से या मनुष्यों की ओर से?[a] वे आपस में विचार-विमर्श करने लगे, “यदि हम कहें, ‘स्वर्ग की ओर से,’ तो वह हमसे कहेगा, ‘फिर तुमने उसकी बात पर विश्वास क्यों नहीं किया?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “स्वर्ग की ओर से” का अर्थ यहाँ “परमेश्वर की ओर से” है; यह दैवी स्रोत या अधिकार के लिए प्रयुक्त श्रद्धापूर्ण अभिव्यक्ति है। “मनुष्यों की ओर से” का अर्थ केवल मानवीय स्रोत या अधिकार है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: बपतिस्मा
  rationale: यह शब्द यहाँ यूहन्ना के बपतिस्मे की विधि और उसकी सेवकाई से जुड़े कार्य को दर्शाता है; ‘बपतिस्मा’ हिन्दी में स्थापित और स्वाभाविक बाइबलीय शब्द है।
- source_word: τὸ Ἰωάννου
  choice: यूहन्ना का
  rationale: सम्बन्धकारक रूप बपतिस्मे को यूहन्ना से सम्बद्ध करता है; हिन्दी में ‘यूहन्ना का बपतिस्मा’ सहज और स्पष्ट है।
- source_word: πόθεν
  choice: कहाँ से था
  rationale: प्रश्न स्थान से अधिक स्रोत या उत्पत्ति के बारे में है; आगे के विकल्प इस आशय को स्पष्ट कर देते हैं।
- source_word: ἐξ οὐρανοῦ
  choice: स्वर्ग की ओर से
  rationale: यह यूनानी अभिव्यक्ति को बनाए रखते हुए दैवी स्रोत अथवा अधिकार का संकेत देती है।
- source_word: ἐξ ἀνθρώπων
  choice: मनुष्यों की ओर से
  rationale: बहुवचन ἀνθρώπων समस्त मानवीय स्रोत को दर्शाता है, केवल पुरुषों को नहीं; यह ‘स्वर्ग की ओर से’ के साथ स्पष्ट विरोध बनाता है।
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: वे आपस में विचार करने लगे
  rationale: यह चल रहे पारस्परिक विचार-विमर्श को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ἐὰν εἴπωμεν
  choice: यदि हम कहें
  rationale: यह शर्तसूचक वाक्य का सहज और अर्थनिष्ठ हिन्दी रूप है।
- source_word: ἐρεῖ ἡμῖν
  choice: वह हमसे कहेगा
  rationale: प्रत्यक्ष कथन की भूमिका और भावी काल दोनों सुरक्षित रहते हैं।
- source_word: Διὰ τί οὖν
  choice: फिर ... क्यों
  rationale: ‘फिर’ पूर्वकल्पित उत्तर से निकलने वाले तर्कपूर्ण निष्कर्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: तुमने उस पर विश्वास क्यों नहीं किया
  rationale: πιστεύω के साथ व्यक्ति के लिए प्रयुक्त सम्प्रदान को हिन्दी में ‘उस पर विश्वास करना’ स्वाभाविक रूप से व्यक्त करता है और यूहन्ना के संदेश तथा अधिकार को स्वीकार करने का भाव बनाए रखता है।
theological_decisions:
- issue: ‘स्वर्ग की ओर से’ का आशय
  choice: मुख्य पाठ में ‘स्वर्ग की ओर से’ रखा गया है।
  alternative: परमेश्वर की ओर से
  rationale: मूल पाठ की श्रद्धापूर्ण परोक्ष अभिव्यक्ति और उसकी वास्तविक शब्दावली दोनों सुरक्षित रहती हैं; इसका आशय दैवी स्रोत या अधिकार है।
- issue: स्वर्ग और मनुष्यों के स्रोतों का विरोध
  choice: ‘मनुष्यों की ओर से’
  alternative: लोगों की ओर से
  rationale: यह स्पष्ट करता है कि विरोध दैवी और मानवीय स्रोत के बीच है, न कि स्वर्ग और केवल पुरुषों के बीच।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘मनुष्यों’ का प्रयोग लिंग-समावेशी मानवीय अर्थ के लिए किया गया है। स्रोत में λέγοντες विचार-विमर्श की विषयवस्तु प्रस्तुत करता है, इसलिए हिन्दी में अलग से ‘कहते हुए’ जोड़ने के बजाय सीधा उद्धरण स्वाभाविक रखा गया है।
