id: MAT.21.12
reference: Matthew 21:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: hi
  text: और यीशु मन्दिर-परिसर[a] में प्रवेश किए और वहाँ बेचने और खरीदने वाले सभी लोगों को बाहर निकाल दिया; उन्होंने मुद्रा बदलने वालों की मेज़ें और कबूतर बेचने वालों के आसन उलट दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मन्दिर” अथवा “मन्दिर के प्रांगण।” यूनानी शब्द यहाँ भीतरी पवित्रस्थान के बजाय मन्दिर के व्यापक परिसर को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: मन्दिर-परिसर
  rationale: यह शब्द केवल भीतरी पवित्रस्थान नहीं, बल्कि व्यापक मन्दिर-परिसर को सूचित करता है; व्यापार इसी बाहरी परिसर में होता था।
- source_word: ἐξέβαλεν
  choice: बाहर निकाल दिया
  rationale: यह निर्णायक और बलपूर्वक निष्कासन का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: πάντας
  choice: सभी लोगों को
  rationale: मूल पाठ में व्यापार में लगे लोगों के व्यापक समुच्चय को स्पष्ट रूप से बनाए रखता है।
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: बेचने और खरीदने वाले
  rationale: दोनों वर्तमान कृदन्तों की समानान्तर क्रियाओं को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τράπεζας
  choice: मेज़ें
  rationale: साधारण अर्थ को सुरक्षित रखता है और मुद्रा-विनिमय के संदर्भ में स्पष्ट है।
- source_word: κολλυβιστῶν
  choice: मुद्रा बदलने वालों
  rationale: मन्दिर के संदर्भ में सिक्कों या मुद्राओं का विनिमय करने वालों के लिए स्पष्ट आधुनिक अभिव्यक्ति है।
- source_word: κατέστρεψεν
  choice: उलट दीं
  rationale: इस प्रसंग में फर्नीचर को पलट देने की सजीव कार्रवाई बताता है, बिना यह कहे कि उसे नष्ट कर दिया गया।
- source_word: καθέδρας
  choice: चौकियाँ
  rationale: विक्रेताओं के बैठने के आसनों के लिए स्वाभाविक हिन्दी शब्द है और आधुनिक पाठक के लिए दृश्य को स्पष्ट करता है।
- source_word: περιστεράς
  choice: कबूतर
  rationale: ग्रीक शब्द कबूतर/फाख्ता जाति के पक्षियों को सूचित कर सकता है; बलिदानी प्रसंग में हिन्दी का प्रचलित और स्पष्ट रूप 'कबूतर' है।
theological_decisions:
- issue: ἱερόν के संबंध में यीशु के प्रवेश और कार्रवाई का स्थान
  choice: मन्दिर के व्यापक परिसर को स्पष्ट करना
  alternative: केवल 'मन्दिर' कहना, जिससे भीतरी पवित्रस्थान भी समझा जा सकता है
  rationale: स्थानगत भेद को बनाए रखने से पाठ यह संकेत नहीं देता कि यीशु भीतरी पवित्रस्थान में गए थे; यह ऐतिहासिक संदर्भ स्पष्ट करता है, कोई अतिरिक्त धार्मिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज कथात्मक शैली। 'मन्दिर-परिसर' स्थानगत स्पष्टता देता है। वाक्य को हिन्दी की पठनीयता के लिए दो वाक्यों में रखा गया है, जबकि मूल की क्रियात्मक समानता सुरक्षित है।
