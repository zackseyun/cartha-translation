id: MAT.21.15
reference: Matthew 21:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: hi
  text: लेकिन जब प्रधान याजकों और शास्त्रियों ने उसके किए हुए अद्भुत काम देखे, और बच्चों को मन्दिर[a] में ऊँची आवाज़ में पुकारते हुए, “दाऊद के पुत्र को होशन्ना,” कहते देखा, तो वे अप्रसन्न हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी शब्द ἱερόν पूरे मन्दिर-परिसर या उसके प्रांगणों को दर्शाता है, केवल भीतरी पवित्रस्थान को नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ἰδόντες
  choice: जब ... देखा
  rationale: एओरिस्ट कृदन्त मुख्य क्रिया की परिस्थितिजन्य, विशेषतः कालगत, पृष्ठभूमि देता है; ‘जब ... देखा’ स्वाभाविक हिन्दी में इसे स्पष्ट रखता है।
- source_word: δὲ
  choice: लेकिन
  rationale: यह पिछले प्रसंग की तुलना में हल्का विरोध प्रकट करता है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: बहुवचन में यह प्रमुख याजकीय अधिकारियों का परिचित पदनाम है, किसी एक महायाजक का नहीं।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: यह सीधा और स्थापित पदनाम है; ‘व्यवस्था के शिक्षक’ जैसी व्याख्यात्मक वृद्धि आवश्यक नहीं है।
- source_word: τὰ θαυμάσια
  choice: अद्भुत काम
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण उल्लेखनीय कार्यों को व्यापक रूप से दर्शाता है; इसे केवल ‘चमत्कार’ तक सीमित नहीं किया गया।
- source_word: ἐποίησεν
  choice: उसके किए हुए
  rationale: सरल एओरिस्ट क्रिया को व्यापक कर्म ‘अद्भुत काम’ के साथ स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: παῖδας
  choice: बच्चों
  rationale: इस प्रसंग में अर्थ ‘बच्चे’ है; ‘सेवक’ असंगत और ‘लड़के’ अनावश्यक रूप से संकीर्ण होगा।
- source_word: κράζοντας
  choice: ऊँची आवाज़ में ... कहते
  rationale: यह सार्वजनिक और जोरदार उद्घोष को व्यक्त करता है, बिना उसमें वैरभाव जोड़ने के।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर में
  rationale: मुख्य पाठ में यह स्वाभाविक पद है; ἱερόν के व्यापक अर्थ, अर्थात पूरे मन्दिर-परिसर, को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: λέγοντας
  choice: यह कहते
  rationale: यह κράζοντας के साथ बच्चों की उद्घोषणा को प्रस्तुत करता है और हिन्दी वाक्य में स्वाभाविक रूप से जुड़ता है।
- source_word: Ὡσαννὰ
  choice: होशन्ना
  rationale: यूनानी में आया यह इब्रानी-मूल का स्थापित धार्मिक जयघोष है। लिप्यन्तरण उसकी प्रार्थना और स्तुति—दोनों की अनुगूँज बनाए रखता है; अर्थ पादटिप्पणी में दिया गया है।
- source_word: τῷ υἱῷ Δαυίδ
  choice: दाऊद के पुत्र को
  rationale: सम्बोधनात्मक जयघोष के बाद दत्तिव को ‘को’ से व्यक्त किया गया है और मसीही पदवी को शाब्दिक रूप में सुरक्षित रखा गया है।
- source_word: ἠγανάκτησαν
  choice: क्रोधित हो उठे
  rationale: क्रिया तीव्र अप्रसन्नता या रोष व्यक्त करती है; यह हिन्दी प्रयोग उसकी शक्ति और प्रसंगगत प्रतिक्रिया दोनों को दर्शाता है।
theological_decisions:
- issue: ‘दाऊद के पुत्र’ का मसीही महत्त्व
  choice: पदवी को ‘दाऊद के पुत्र’ के रूप में यथावत रखा गया।
  alternative: दाऊद का उत्तराधिकारी
  rationale: मत्ती में यह पहचानी हुई मसीही पदवी है; व्याख्यात्मक रूपान्तरण उसके कथात्मक और धर्मवैचारिक महत्त्व को कम कर सकता है।
- issue: Ὡσαννά का अनुवाद
  choice: मुख्य पाठ में ‘होशन्ना’ का लिप्यन्तरण रखा गया।
  alternative: बचा ले, विनती है / अभी बचा
  rationale: यह अभिव्यक्ति उद्धार की प्रार्थना से निकली है, पर यहाँ स्तुति के स्थापित जयघोष के रूप में भी काम करती है। लिप्यन्तरण इस द्विअर्थी धार्मिक तनाव को बनाए रखता है और अर्थ पादटिप्पणी में स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली रखी गई है। ‘प्रधान याजक’, ‘शास्त्री’, ‘मन्दिर’ और ‘दाऊद के पुत्र’ जैसे स्थापित बाइबलीय पदनाम बनाए गए हैं। वाक्य-रचना यूनानी के सहभागी खण्डों को स्वाभाविक ‘जब ... तो’ संरचना में प्रस्तुत करती है, जबकि बच्चों को पुकारते हुए देखने की मूल दृश्यात्मकता बनी रहती है।
