source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: hi
  text: और उसके आगे चल रही और उसके पीछे आ रही भीड़ें पुकार-पुकारकर कह रही थीं, “दाऊद के पुत्र को होशाना![a][b] धन्य है वह, जो प्रभु के नाम से आता है![c] सर्वोच्च स्थानों में होशाना!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “होशाना” इब्रानी-मूल का जयघोष है, जिसका मूल अर्थ लगभग “कृपया, बचा ले” या “अभी बचा ले” है; यहाँ यह स्तुति के जयघोष के रूप में भी प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: “दाऊद का पुत्र” राजकीय मसीही उपाधि है।
    reason: cultural_note
  - marker: c
    text: यह पंक्ति भजन 118:26 की प्रतिध्वनि है, जहाँ इब्रानी पाठ में “प्रभु” के स्थान पर परमेश्वर का निज नाम YHWH आता है।
    reason: cross_reference
lexical_decisions:
- source_word: ὄχλοι
  choice: भीड़
  rationale: यह आधुनिक हिन्दी में लोगों के बड़े समूह के लिए स्वाभाविक सामूहिक संज्ञा है और यूनानी बहुवचन का अर्थ प्रसंग में ठीक व्यक्त करती है।
- source_word: προάγοντες αὐτόν
  choice: उसके आगे चल रही थी
  rationale: यह जुलूस में यीशु के आगे बढ़ रहे लोगों को स्पष्ट करता है, बिना यह संकेत दिए कि वे औपचारिक रूप से उसका नेतृत्व कर रहे थे।
- source_word: ἀκολουθοῦντες
  choice: उसके पीछे आ रही थी
  rationale: यह आगे चलने वालों के साथ स्वाभाविक समानांतर बनाता है और जुलूस का दृश्य बनाए रखता है।
- source_word: ἔκραζον λέγοντες
  choice: पुकार-पुकारकर कह रही थीं
  rationale: पुनरुक्त क्रियाविशेषण अपूर्णकाल की निरंतर या बार-बार होती ऊँची पुकार को सहज हिन्दी में व्यक्त करता है; ‘कह रही थीं’ λέγοντες को भी दर्शाता है।
- source_word: Ὡσαννά
  choice: होशाना
  rationale: इस इब्रानी-मूल धार्मिक जयघोष को लिप्यंतरित रखा गया है, क्योंकि यहाँ यह केवल उद्धार की विनती नहीं बल्कि स्तुति का उद्घोष भी है; मूल अर्थ पादटिप्पणी में दिया गया है।
- source_word: τῷ υἱῷ Δαυίδ
  choice: दाऊद के पुत्र के लिए
  rationale: यूनानी संप्रदान कारक को हिन्दी में स्वाभाविक रूप से ‘के लिए’ व्यक्त किया गया है। दाऊदी राजकीय-मसीही उपाधि को व्याख्यात्मक रूप से ‘मसीह’ में नहीं बदला गया।
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: धन्य है वह, जो आता है
  rationale: यह विशेषण और संज्ञीकृत कृदंत को स्पष्ट, प्रतिष्ठित और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ὀνόματι κυρίου
  choice: प्रभु के नाम से
  rationale: यह हिन्दी का स्वाभाविक बाइबलीय प्रयोग है और नाम, प्रतिनिधित्व तथा अधिकार की अर्थ-व्याप्ति को बिना विस्तार से समझाए सुरक्षित रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: यह यूनानी κύριος का मानक हिन्दी रूप है; भजन 118 में इसके पीछे उपस्थित YHWH की पृष्ठभूमि पादटिप्पणी में बताई गई है।
- source_word: ἐν τοῖς ὑψίστοις
  choice: सर्वोच्च स्थानों में
  rationale: यह बहुवचन रूप और उच्चतम स्वर्गीय क्षेत्र की ओर संकेत को बनाए रखता है, पर मुख्य पाठ में ‘स्वर्ग’ जोड़कर अर्थ को आवश्यकता से अधिक निश्चित नहीं करता।
theological_decisions:
- issue: τῷ υἱῷ Δαυίδ में राजकीय-मसीही उपाधि
  choice: मुख्य पाठ में ‘दाऊद के पुत्र’ को उपाधि के रूप में बनाए रखना
  alternative: ‘मसीह’ के लिए
  rationale: यूनानी पाठ दाऊदी उपाधि का ही प्रयोग करता है। इसे सुरक्षित रखने से इसका ऐतिहासिक और धर्मवैचारिक तनाव बना रहता है और व्याख्या मुख्य पाठ में नहीं मिलाई जाती।
- issue: Ὡσαννά का अर्थ और कार्य
  choice: मुख्य पाठ में ‘होशाना’ और पादटिप्पणी में उसका मूल अर्थ
  alternative: ‘अभी बचा!’ या ‘कृपया बचा!’
  rationale: विजयी प्रवेश के प्रसंग में यह शब्द इब्रानी-मूल विनती होने के साथ स्थापित स्तुतिपरक जयघोष की तरह काम करता है। लिप्यंतरण दोनों स्तरों को सुरक्षित रखता है।
- issue: भजन के उद्धरण में κυρίου का संदर्भ
  choice: मुख्य पाठ में ‘प्रभु’ और पादटिप्पणी में YHWH की पृष्ठभूमि
  alternative: मुख्य पाठ में ‘यहोवा’
  rationale: उपलब्ध यूनानी पाठ κύριος कहता है, इसलिए ‘प्रभु’ उसका सीधा अनुवाद है। साथ ही भजन 118:26 के इब्रानी पाठ में दिव्य नाम होने की जानकारी पादटिप्पणी में सुरक्षित रहती है।
- issue: ἐν τοῖς ὑψίστοις की स्थान-संबंधी अस्पष्टता
  choice: ‘सर्वोच्च स्थानों में’
  alternative: ‘सर्वोच्च स्वर्ग में’
  rationale: यह सम्भावित स्वर्गीय संदर्भ को खुला रखता है, पर यूनानी में स्पष्ट रूप से न आए ‘स्वर्ग’ को मुख्य पाठ में जोड़कर अर्थ को संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। जुलूस की गतिशीलता और भीड़ की लगातार पुकार को बोलचाल-सुलभ रूप में व्यक्त किया गया है। ‘होशाना’, ‘दाऊद का पुत्र’ और ‘प्रभु’ जैसे बाइबलीय पदों को बनाए रखते हुए आवश्यक सांस्कृतिक और मूल-भाषायी जानकारी पादटिप्पणियों में दी गई है।
