source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: hi
  text: यह देखकर चेले चकित हुए और कहने लगे, “अंजीर का पेड़ इतनी जल्दी कैसे सूख गया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: यह देखकर
  rationale: अओरिस्ट कृदंत को स्वाभाविक हिन्दी में काल-संबंधी अर्थ के साथ व्यक्त किया गया है। ‘यह’ पिछले पद में वर्णित अंजीर के पेड़ के सूखने की घटना की ओर संकेत करता है।
- source_word: οἱ μαθηταί
  choice: चेले
  rationale: ‘चेले’ आधुनिक हिन्दी में यीशु के μαθηταί के लिए सहज, प्रचलित और सामान्य पाठकों को स्पष्ट शब्द है।
- source_word: ἐθαύμασαν
  choice: चकित हुए
  rationale: यह θαυμάζω के आश्चर्य और विस्मय के भाव को स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: λέγοντες
  choice: और कहने लगे
  rationale: वर्तमान कृदंत को मुख्य क्रिया से जुड़ी वाणी के रूप में सहज हिन्दी कथन-शैली में प्रस्तुत किया गया है।
- source_word: Πῶς
  choice: कैसे
  rationale: यह प्रश्न घटना के ढंग या उसके असाधारण रूप से शीघ्र घटने के विषय में है; ‘कैसे’ मूल की खुली प्रश्नवाचकता बनाए रखता है।
- source_word: παραχρῆμα
  choice: इतनी जल्दी
  rationale: शब्द का अर्थ ‘तुरन्त/उसी समय’ है; आश्चर्यसूचक प्रश्न में ‘इतनी जल्दी’ उसके तात्कालिक होने और चेलों के विस्मय दोनों को स्वाभाविक हिन्दी में संप्रेषित करता है।
- source_word: ἐξηράνθη
  choice: सूख गया
  rationale: ξηραίνω के अओरिस्ट कर्मवाच्य रूप को पेड़ के संदर्भ में हिन्दी के स्वाभाविक अकर्मक परिणामसूचक प्रयोग से व्यक्त किया गया है; अनावश्यक रूप से कारण या कर्ता नहीं जोड़ा गया।
- source_word: ἡ συκῆ
  choice: अंजीर का पेड़
  rationale: συκῆ का सटीक और सामान्य हिन्दी अर्थ ‘अंजीर का पेड़’ है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की सहज, मौखिक और गरिमापूर्ण कथन-शैली में है। मूल यूनानी के participial flow को शाब्दिक रूप से बोझिल बनाने के बजाय ‘यह देखकर ... और कहने लगे’ में स्वाभाविक बनाया गया है। किसी पंथगत व्याख्या या घटना के कारण को पाठ में नहीं जोड़ा गया।
