source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: hi
  text: और भीड़ के लोग कह रहे थे, “यह वह भविष्यद्वक्ता यीशु है, जो गलील के नासरत से है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक भविष्यद्वक्ता।” यूनानी में “वह भविष्यद्वक्ता” है, जो शायद यह दिखाता है कि भीड़ यीशु को एक पहचाने हुए भविष्यद्वक्ता के रूप में पहचान रही थी।
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: और भीड़ के लोग
  rationale: δέ कथा को हल्के ढंग से आगे जोड़ता है, इसलिए ‘और’ स्वाभाविक है। बहुवचन ὄχλοι को हिन्दी में सहज सामूहिक अभिव्यक्ति ‘भीड़ के लोग’ से व्यक्त किया गया है।
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल चल रही या बार-बार कही जा रही बात का संकेत दे सकता है; ‘कह रहे थे’ इस पक्ष को बिना अतिव्याख्या के बनाए रखता है।
- source_word: Οὗτός ἐστιν
  choice: यह ... है
  rationale: यह संकेतवाचक पहचानसूचक वाक्य का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: ὁ προφήτης
  choice: वह भविष्यद्वक्ता
  rationale: यूनानी में निश्चित उपपद है। ‘वह भविष्यद्वक्ता’ उसकी निश्चितता और किसी पहचाने या अपेक्षित भविष्यद्वक्ता की सम्भावित गूँज को बनाए रखता है, पर उसे और स्पष्ट करके व्याख्यायित नहीं करता।
- source_word: Ἰησοῦς
  choice: यीशु
  rationale: व्यक्तिवाचक नाम को हिन्दी बाइबलीय प्रचलन के अनुसार लिप्यंतरित किया गया है।
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: गलील के नासरत का
  rationale: यह यीशु को उसके मूल स्थान से पहचानता है। ‘गलील के नासरत का’ यूनानी सम्बन्ध को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ὁ προφήτης को निश्चित या अनिश्चित रूप में प्रस्तुत करना
  choice: वह भविष्यद्वक्ता
  alternative: एक भविष्यद्वक्ता
  rationale: मूल यूनानी में निश्चित उपपद ὁ है और प्रसंग में यह किसी पहचाने अथवा अपेक्षित भविष्यद्वक्ता की ओर संकेत कर सकता है। मुख्य पाठ निश्चितता को बनाए रखता है, जबकि पादटिप्पणी सम्भव अनिश्चित समझ को दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक। ‘भीड़ के लोग’ हिन्दी में स्वाभाविक है, और ‘वह भविष्यद्वक्ता’ मूल की निश्चितता तथा उसकी धर्मवैचारिक अस्पष्टता को सुरक्षित रखता है।
