source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: hi
  text: और जब प्रधान याजकों और फरीसियों ने उसके दृष्टान्त सुने, तो वे समझ गए कि वह उनके विषय में[a] बोल रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके बारे में।” उन्होंने पहचान लिया कि ये दृष्टान्त उन्हीं को लक्ष्य करके कहे गए थे। कुछ अनुवाद अधिक व्याख्यात्मक रूप से “उनके विरुद्ध” कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: जब … ने … सुने
  rationale: अओरिस्ट कृदन्त को मुख्य क्रिया से पहले की परिस्थिति बताने वाले स्वाभाविक हिन्दी कालवाचक उपवाक्य के रूप में व्यक्त किया गया है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: बहुवचन पद यहाँ वरिष्ठ याजकीय नेतृत्व को सूचित करता है; यह एक ही समय में कई महायाजकों का संकेत नहीं है।
- source_word: Φαρισαῖοι
  choice: फरीसी
  rationale: इस यहूदी समूह के नाम का हिन्दी में प्रचलित लिप्यन्तरण रखा गया है।
- source_word: παραβολὰς
  choice: दृष्टान्त
  rationale: यीशु की आलंकारिक कथाओं और उक्तियों के लिए यह स्थापित, अर्थपूर्ण और गरिमापूर्ण हिन्दी शब्द है।
- source_word: ἔγνωσαν
  choice: समझ गए
  rationale: यहाँ क्रिया किसी बात को पहचान लेने या बोध हो जाने का भाव देती है; ‘समझ गए’ आधुनिक हिन्दी में इस प्रसंग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: περὶ αὐτῶν
  choice: उनके विषय में
  rationale: सम्बन्धकारक के साथ περί का सीधा अर्थ ‘के विषय में/के बारे में’ है; ‘उनके विरुद्ध’ प्रसंगगत आलोचना को मूल पद से अधिक स्पष्ट कर देगा।
- source_word: λέγει
  choice: कह रहा था
  rationale: वर्तमानकालीन यूनानी क्रिया को भूतकालीन बोध-क्रिया के अधीन अप्रत्यक्ष कथन में स्वाभाविक हिन्दी अपूर्ण भूतकाल से व्यक्त किया गया है।
theological_decisions:
- issue: क्या यीशु के दृष्टान्तों को धार्मिक अगुओं के विरुद्ध स्पष्ट रूप से कहना चाहिए
  choice: वह उनके विषय में कह रहा था
  alternative: वह उनके विरुद्ध कह रहा था
  rationale: प्रसंग में आलोचना निहित है, पर यूनानी περὶ αὐτῶν केवल उनके विषय में बोलने को स्पष्ट करता है। इसलिए मुख्य पाठ में अधिक प्रबल विरोधात्मक अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘प्रधान याजक’, ‘फरीसी’ और ‘दृष्टान्त’ जैसे परिचित बाइबलीय पद बनाए गए हैं; वाक्य-विन्यास बोलचाल की स्पष्टता के साथ मूल क्रम और आशय को सुरक्षित रखता है।
