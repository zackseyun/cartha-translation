  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: hi
  text: '“एक और दृष्टान्त सुनो: एक भूमि-स्वामी था, जिसने एक अंगूर का बाग लगाया, उसके चारों ओर बाड़ लगाई[b], उसमें दाखरस निकालने का कुंड खोदा और एक मीनार बनाई[a]। फिर उसने उसे किसानों को पट्टे पर दे दिया[c] और चला गया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंगूर का बाग लगाने, उसे घेरने, दाखरस निकालने का कुंड खोदने और मीनार बनाने का यह चित्र यशायाह 5:1–2 की प्रतिध्वनि है।
    reason: cross_reference
  - marker: b
    text: या “उसके चारों ओर झाड़ीदार घेरा लगाया।” यूनानी शब्द किसी घेरने वाली बाड़, झाड़ीदार घेरे या अन्य अवरोध को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “उसे किसानों को किराए पर दे दिया।” यहाँ ऐसे किसानों की बात है जो बाग को पट्टे पर लेकर उसकी खेती करते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: एक और दृष्टान्त सुनो
  rationale: बहुवचन आज्ञार्थक ἀκούσατε को स्वाभाविक हिन्दी में ‘सुनो’ और παραβολή को प्रचलित बाइबलीय शब्द ‘दृष्टान्त’ से व्यक्त किया गया है।
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: एक ज़मींदार था
  rationale: कृषि-भूमि, बाग और पट्टेदार किसानों के प्रसंग में οἰκοδεσπότης का आशय संपत्ति के स्वामी से है; ‘ज़मींदार’ भूमिका को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: अंगूरों का एक बाग लगाया
  rationale: यह φυτεύω की रोपने की ठोस क्रिया और ἀμπελών के अंगूर-बाग के अर्थ को सामान्य आधुनिक हिन्दी में बनाए रखता है।
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: उसके चारों ओर बाड़ लगाई
  rationale: φραγμός किसी घेरने वाली बाड़ या झाड़ी की मेड़ को सूचित कर सकता है; मुख्य पाठ में ‘बाड़’ स्पष्ट है और विकल्प को पादटिप्पणी में रखा गया है।
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: उसमें दाखरस का कुंड खोदा
  rationale: ὀρύσσω का अर्थ खोदना है और ληνός अंगूर दबाकर रस निकालने के लिए खोदे गए कुंड/कोल्हू की व्यवस्था को सूचित करता है; ‘दाखरस का कुंड’ दृश्य और क्रिया दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ᾠκοδόμησεν πύργον
  choice: एक मीनार बनाई
  rationale: πύργος का सीधा अर्थ मीनार है। उसके पहरे के उपयोग को मुख्य पाठ में जोड़ना मूल से अधिक विशिष्ट होता।
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: वह बाग किसानों को पट्टे पर दे दिया
  rationale: मध्यवाच्य ἐκδίδωμι यहाँ किराए या पट्टे पर देने का अर्थ रखता है; γεωργοί खेती करने वाले पट्टेदार हैं, मात्र मजदूर नहीं।
- source_word: ἀπεδήμησεν
  choice: परदेश चला गया
  rationale: ἀποδημέω अपने स्थान से दूर यात्रा पर जाने का भाव रखता है। ‘परदेश चला गया’ गंतव्य को अनावश्यक रूप से निश्चित किए बिना उस दूर जाने के भाव को व्यक्त करता है।
theological_decisions:
- issue: यशायाह 5:1–2 की अंगूर-बाग संबंधी प्रतिध्वनि
  choice: मुख्य पाठ में कृषि-संबंधी ठोस बिंब बनाए रखे गए हैं और संबंध पादटिप्पणी में बताया गया है।
  alternative: मुख्य पाठ में यशायाह से संबंध को स्पष्ट रूप से जोड़ देना या अधिक पुरातन शब्दावली से उसे उभारना।
  rationale: मत्ती का पाठ संकेतपूर्ण प्रतिध्वनि रखता है, पर उसे खुली व्याख्या में नहीं बदलता; इसलिए अनुवाद बिंब को सुरक्षित रखता है और पाठक को पादटिप्पणी में अंतर्पाठीय जानकारी देता है।
- issue: γεωργοί की भूमिका
  choice: किसानों को पट्टे पर दे दिया
  alternative: मजदूरों को सौंप दिया
  rationale: पट्टे का आर्थिक संबंध कथा के आगे के संघर्ष के लिए महत्त्वपूर्ण है। ‘मजदूर’ कहने से उनकी स्वतंत्र पट्टेदार भूमिका कमजोर पड़ती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दृष्टान्त’, ‘दाखरस’ और ‘मीनार’ परिचित बाइबलीय शब्द हैं; वाक्य-विन्यास कथात्मक और मौखिक आज्ञा ‘सुनो’ के अनुरूप है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
