id: MAT.7.17
reference: Matthew 7:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: hi
  text: इसी प्रकार[a], हर अच्छा पेड़ अच्छे फल देता है, पर सड़ा हुआ[b] पेड़ बुरे[c] फल देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘इसी प्रकार’ का अनुवाद ‘इसलिए’ या ‘इस तरह’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘सड़ा हुआ’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘खराब’, ‘बिगड़ा हुआ’ या ‘निकम्मा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘बुरे फल’ का अनुवाद ‘दुष्ट फल’ भी हो सकता है; ‘बुरे’ कृषि-रूपक में अधिक स्वाभाविक है और प्रसंग के नैतिक संकेत को भी बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: इसी प्रकार
  rationale: यह पिछले उदाहरण से निष्कर्ष अथवा समानता जोड़ता है। ‘इसी प्रकार’ स्वाभाविक हिन्दी में इस संबंध को स्पष्ट रखता है।
- source_word: πᾶν δένδρον
  choice: हर ... पेड़
  rationale: एकवचन संज्ञा के साथ πᾶν का अर्थ वितरणात्मक है; ‘हर पेड़’ कहावत के सामान्य कथन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀγαθὸν
  choice: अच्छा
  rationale: यह पेड़ के सकारात्मक गुण को व्यापक अर्थ में व्यक्त करता है और ‘अच्छे फल’ के साथ जानबूझकर बनी समानता को बनाए रखता है।
- source_word: καρποὺς καλοὺς
  choice: अच्छे फल
  rationale: καλός यहाँ फल की वांछनीय गुणवत्ता बताता है; ‘अच्छे फल’ आधुनिक हिन्दी में सहज है और रूपक की सरलता बनाए रखता है।
- source_word: ποιεῖ
  choice: फल देता है
  rationale: ποιέω का मूल अर्थ ‘करना/बनाना’ है, पर पेड़ और फल के संदर्भ में हिन्दी का स्वाभाविक मुहावरा ‘फल देना’ है।
- source_word: τὸ δὲ
  choice: पर ... पेड़
  rationale: δέ यहाँ दोनों प्रकार के पेड़ों के बीच विरोध दिखाता है; ‘पर’ इस प्रतिकूल संबंध को संक्षेप में व्यक्त करता है।
- source_word: σαπρὸν
  choice: सड़ा हुआ
  rationale: σαπρός किसी सड़ी, बिगड़ी या निकम्मी वस्तु को सूचित करता है। पेड़ के ठोस चित्र में ‘सड़ा हुआ’ जीवंत और सटीक है।
- source_word: καρποὺς πονηροὺς
  choice: बुरे फल
  rationale: πονηρός का अर्थ ‘बुरा’, ‘दुष्ट’ या ‘हानिकारक’ हो सकता है। ‘बुरे फल’ कृषि-रूपक में स्वाभाविक रहते हुए प्रसंग में निहित नैतिक अर्थ को भी खुला रखता है।
theological_decisions:
- issue: चित्र का नैतिक अर्थ बनाम उसका प्रत्यक्ष कृषि-संबंधी रूप
  choice: पेड़ और फल के ठोस रूपक को ज्यों का त्यों रखा गया है; उसका नैतिक अनुप्रयोग अनुवाद में स्पष्ट करके नहीं जोड़ा गया।
  alternative: ‘भला मनुष्य अच्छे काम करता है’ जैसे व्याख्यात्मक शब्दों से रूपक का अर्थ खोल देना।
  rationale: झूठे भविष्यद्वक्ताओं के विषय में आसपास का प्रसंग इस रूपक को नैतिक बल देता है, पर यूनानी वाक्य स्वयं पेड़ और फल का चित्र ही प्रस्तुत करता है। इसलिए अनुवाद प्रसंग को अर्थ स्पष्ट करने देता है और मूल की तनावपूर्ण बहुअर्थता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘फल देता है’ पेड़ के विषय में स्वाभाविक हिन्दी प्रयोग है। ‘अच्छा/अच्छे’ और ‘सड़ा हुआ/बुरे’ की समानांतर बनावट मूल कथन की संक्षिप्त, कहावत-जैसी शैली को सुरक्षित रखती है।
