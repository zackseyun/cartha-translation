  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: hi
  text: इसलिए जो कोई मेरी इन बातों को सुनता है और उन पर चलता है, वह एक बुद्धिमान पुरुष[b] के समान होगा[a], जिसने अपना घर चट्टान पर बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी तुलना एक बुद्धिमान पुरुष से की जाएगी” अथवा “वह एक बुद्धिमान पुरुष के समान होगा।”
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में तुलना का पात्र व्याकरण की दृष्टि से पुरुषवाचक है: “एक बुद्धिमान पुरुष।”'
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: इसलिए जो कोई
  rationale: οὖν का निष्कर्षसूचक संबंध ‘इसलिए’ से और Πᾶς ... ὅστις का व्यापक, प्रत्येक व्यक्ति पर लागू भाव ‘जो कोई’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: मेरी ये बातें सुनता
  rationale: λόγοι यहाँ यीशु की कही हुई बातों या वचनों को दर्शाता है; आधुनिक हिन्दी में ‘मेरी ये बातें’ सहज और स्पष्ट है।
- source_word: καὶ ποιεῖ αὐτούς
  choice: और उन पर चलता है
  rationale: शाब्दिक ‘उन्हें करता है’ हिन्दी में अस्वाभाविक है। संदर्भ में अर्थ सुनी हुई बातों का पालन करना है, जिसे ‘उन पर चलता है’ संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁμοιωθήσεται
  choice: के समान ठहरेगा
  rationale: भविष्यत् कर्मवाच्य रूप में तुलना किए जाने या समान माने जाने का भाव है। ‘समान ठहरेगा’ इस व्याकरणिक स्वर को बनाए रखता है; अधिक सहज विकल्प ‘समान होगा’ है।
- source_word: ἀνδρὶ φρονίμῳ
  choice: बुद्धिमान मनुष्य
  rationale: ἀνήρ यहाँ पुरुषवाचक है, पर हिन्दी में ‘मनुष्य’ तुलनात्मक पात्र को गरिमापूर्ण ढंग से व्यक्त करता है; इसका व्याकरणिक पुरुषवाचक स्वरूप पादटिप्पणी में स्पष्ट किया गया है। φρόνιμος के लिए ‘बुद्धिमान’ स्थापित और प्रसंगानुकूल है।
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: जिसने अपना घर बनाया
  rationale: प्रतिबिंबवाचक हिन्दी ‘अपना घर’ यूनानी के स्वामित्व-संबंध को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἐπὶ τὴν πέτραν
  choice: चट्टान पर
  rationale: πέτρα ठोस चट्टानी आधार की छवि देता है; ‘चट्टान पर’ सीधा है और ‘आधारशिला’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
theological_decisions:
- issue: तुलना में पुरुषवाचक प्रतिनिधि भाषा
  choice: बुद्धिमान मनुष्य
  alternative: बुद्धिमान व्यक्ति
  rationale: मूल यूनानी ἀνήρ पुरुषवाचक संज्ञा है। मुख्य कथन ‘जो कोई’ सब पर लागू है, जबकि दृष्टांत के पात्र का पुरुषवाचक रूप पादटिप्पणी में स्पष्ट रखा गया है।
- issue: ὁμοιωθήσεται के कर्मवाच्य तुलनात्मक भाव की व्याख्या
  choice: के समान ठहरेगा
  alternative: के समान होगा / उसकी तुलना ... से की जाएगी
  rationale: मूल रूप भविष्यत् कर्मवाच्य है और ‘तुलना किए जाने’ तथा ‘समान ठहरने’ दोनों का भाव दे सकता है। मुख्य पाठ में सुगम कर्मवाच्य-सदृश अभिव्यक्ति चुनी गई और विकल्प पादटिप्पणी में रखा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘उन पर चलता है’ आज्ञापालन के आशय को स्वाभाविक बनाता है, जबकि तुलना के कर्मवाच्य और पुरुषवाचक पहलुओं को पादटिप्पणियों में सुरक्षित रखा गया है।
