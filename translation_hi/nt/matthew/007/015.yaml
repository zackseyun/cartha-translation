reference: Matthew 7:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: hi
  text: झूठे भविष्यवक्ताओं से सावधान रहो,[a] जो भेड़ों का वेश धारण करके[b] तुम्हारे पास आते हैं, पर भीतर से वे फाड़ खाने वाले भेड़िये हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झूठे भविष्यवक्ताओं से चौकन्ने रहो।’
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘भेड़ों के वस्त्रों में।’'
    reason: lexical_alternative
  - marker: c
    text: या ‘पर भीतर वे झपटने वाले भेड़िये हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: से सावधान रहो
  rationale: वर्तमान काल की बहुवचन आज्ञा लगातार चौकस रहने की चेतावनी देती है। προσέχω के साथ ἀπό उस व्यक्ति या वस्तु को बताता है जिससे बचकर रहना है; इसलिए यह हिन्दी प्रयोग स्वाभाविक और अर्थनिष्ठ है।
- source_word: ψευδοπροφητῶν
  choice: झूठे भविष्यवक्ताओं
  rationale: यह उन लोगों को सूचित करता है जो भविष्यवक्ता होने का झूठा दावा करते हैं या उस हैसियत से झूठ बोलते हैं। ‘झूठे भविष्यवक्ता’ प्रचलित, स्पष्ट और किसी बाद की संस्थागत श्रेणी से मुक्त है।
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: जो … तुम्हारे पास आते हैं
  rationale: गुणसूचक सम्बन्धवाचक उपवाक्य को सरल आधुनिक हिन्दी में रखा गया है और वर्तमान काल उनके आते रहने का भाव बनाए रखता है।
- source_word: ἐν ἐνδύμασι προβάτων
  choice: भेड़ों का वेश धारण करके
  rationale: यूनानी का शाब्दिक रूप ‘भेड़ों के वस्त्रों में’ है। हिन्दी में ‘भेड़ों का वेश धारण करके’ बाहरी रूप और भीतरी वास्तविकता के रूपक को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔσωθεν δέ
  choice: पर भीतर से
  rationale: δέ बाहरी दिखावे और भीतरी वास्तविकता के तीखे विरोध को दर्शाता है, जबकि ἔσωθεν उस आंतरिक वास्तविकता को बताता है।
- source_word: λύκοι ἅρπαγες
  choice: फाड़ खाने वाले भेड़िये
  rationale: ἅρπαγες में झपटने, छीनने और विनाशकारी शिकारी स्वभाव का भाव है। ‘फाड़ खाने वाले’ भेड़िये के रूपक में इस हिंसक अर्थ को सजीव और सहज हिन्दी में रखता है।
theological_decisions:
- issue: कपटपूर्ण धार्मिक अगुओं के विरुद्ध चेतावनी का स्वरूप
  choice: दिखावे और वास्तविकता के विरोध वाले नैतिक-आध्यात्मिक रूपक को सीधे बनाए रखा गया है।
  alternative: इसे विशेष रूप से बाद के किसी मत में परिभाषित विधर्मी शिक्षकों या किसी संस्थागत वर्ग के लिए सीमित करना।
  rationale: यूनानी पाठ झूठे भविष्यवक्ताओं के भ्रामक बाहरी रूप और विनाशकारी भीतरी स्वभाव के विषय में चेतावनी देता है, पर उन्हें बाद की किसी सांप्रदायिक या संस्थागत श्रेणी में नहीं बाँधता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुम्हारे’ और ‘रहो’ बहुवचन श्रोताओं को संबोधित करते हैं। रूपक की तीव्रता बनाए रखते हुए किसी बाद की सांप्रदायिक व्याख्या को पाठ में नहीं जोड़ा गया।
