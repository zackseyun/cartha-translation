id: MAT.7.22
reference: Matthew 7:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: hi
  text: उस दिन बहुत से लोग मुझसे कहेंगे, ‘प्रभु, प्रभु, क्या हमने आपके नाम से भविष्यवाणी नहीं की, आपके नाम से दुष्टात्माओं को नहीं निकाला, और आपके नाम से बहुत से सामर्थ्य के कार्य नहीं किए[a]?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत से चमत्कार किए।” यूनानी में यहाँ ‘सामर्थ्य’ शब्द बहुवचन में है; सुसमाचारों में इसका प्रयोग प्रायः चमत्कारी कार्यों के लिए होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: यूनानी में विशेषण संज्ञा के रूप में प्रयुक्त है; हिन्दी में अर्थ को स्वाभाविक और स्पष्ट बनाने के लिए ‘लोग’ जोड़ा गया है।
- source_word: ἐροῦσίν μοι
  choice: मुझसे कहेंगे
  rationale: भविष्यकाल और सम्प्रदान कारक का सहज हिन्दी रूप, जो कथन की सीधाई बनाए रखता है।
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: उस दिन
  rationale: यह स्वाभाविक हिन्दी कालवाचक अभिव्यक्ति है; न्याय के दिन का संदर्भ निहित रहता है, पर मूल से अधिक स्पष्ट नहीं किया गया।
- source_word: Κύριε κύριε
  choice: प्रभु, प्रभु
  rationale: सम्बोधन की पुनरावृत्ति उसकी तीव्रता और आग्रह को सुरक्षित रखती है; ‘प्रभु’ κύριος का मानक धार्मिक और सामान्य हिन्दी रूप है।
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: क्या हमने ... भविष्यवाणी नहीं की
  rationale: यूनानी प्रश्न सकारात्मक उत्तर की अपेक्षा रखता है; हिन्दी में नकारात्मक प्रश्न यही भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῷ σῷ ὀνόματι
  choice: आपके नाम से
  rationale: यह किसी के नाम और अधिकार के आधार पर कार्य करने का स्वाभाविक हिन्दी मुहावरा है। यूनानी की तरह इसे तीन बार दोहराया गया है।
- source_word: δαιμόνια ἐξεβάλομεν
  choice: दुष्टात्माओं को नहीं निकाला
  rationale: सुसमाचारों के भूत-निष्कासन प्रसंग में ἐκβάλλω का स्पष्ट और सहज हिन्दी रूप है।
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: बहुत-से सामर्थ्य के काम नहीं किए
  rationale: δύναμις के मूल ‘सामर्थ्य’ भाव को बनाए रखते हुए चमत्कारी कार्यों का संकेत दिया गया है; वैकल्पिक अधिक मुहावरेदार अर्थ पादटिप्पणी में है।
theological_decisions:
- issue: यीशु को सीधे सम्बोधित करते हुए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ पदवी के सामान्य अर्थ और उसके मसीह-संबंधी भार दोनों को सुरक्षित रखता है, बिना पाठ से अधिक धर्मवैज्ञानिक निष्कर्ष जोड़े।
- issue: ‘उस दिन’ का युगांत-संबंधी आशय
  choice: उस दिन
  alternative: न्याय के दिन
  rationale: संदर्भ अंतिम न्याय की ओर संकेत करता है, पर यूनानी केवल ‘उस दिन’ कहता है; इसलिए मुख्य पाठ में निहित आशय को स्पष्ट विस्तार में नहीं बदला गया।
- issue: δυνάμεις का चमत्कारी कार्यों के लिए प्रयोग
  choice: सामर्थ्य के काम
  alternative: चमत्कार
  rationale: चुना हुआ रूप शक्ति/सामर्थ्य के शाब्दिक संबंध और चमत्कारी कर्म के सुसमाचारी प्रयोग दोनों को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण प्रत्यक्ष सम्बोधन के लिए ‘आपके’ रखा गया है। वाक्य की तीन समानांतर धाराओं और ‘आपके नाम से’ की पुनरावृत्ति को मूल की वक्तृता बनाए रखने के लिए सुरक्षित रखा गया है।
