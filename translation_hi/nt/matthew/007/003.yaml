reference: Matthew 7:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: hi
  text: पर तू अपने भाई की आँख में जो तिनका[a] है, उसे क्यों देखता है, लेकिन अपनी ही आँख में जो शहतीर[b] है, उस पर ध्यान नहीं देता?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किरच” या “भूसे का कण” (κάρφος)।
    reason: lexical_alternative
  - marker: b
    text: या “लट्ठा” अथवा “मोटी बल्ली” (δοκός)।
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δὲ
  choice: पर ... क्यों
  rationale: प्रश्नवाचक τί यहाँ βλέπεις के साथ कारण पूछते हुए आलंकारिक रूप से ‘क्यों’ का अर्थ देता है; δέ पिछले कथन से हल्का विरोध जोड़ता है, जिसे ‘पर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: βλέπεις
  choice: देखता है
  rationale: यह प्रत्यक्ष देखने की छवि बनाए रखता है और आगे के κατανοεῖς (‘ध्यान देता’) से क्रियात्मक भेद सुरक्षित रखता है।
- source_word: κάρφος
  choice: तिनका
  rationale: κάρφος किसी छोटी सूखी वस्तु—तिनके, भूसे के कण या किरच—को दर्शा सकता है। हिन्दी में आँख और लट्ठे की अतिशयोक्तिपूर्ण तुलना के लिए ‘तिनका’ सहज और परिचित है।
- source_word: ἀδελφοῦ σου
  choice: अपने भाई की
  rationale: यूनानी पाठ में पुल्लिंग एकवचन संबंधवाचक संज्ञा है; ‘भाई’ स्रोत के व्याकरणिक रूप और निकट संबंध दोनों को बनाए रखता है।
- source_word: τῇ σῷ ὀφθαλμῷ
  choice: अपनी ही आँख में
  rationale: ‘ही’ बलयुक्त possessive σῷ को उभारता और भाई की आँख के साथ स्पष्ट विरोध प्रकट करता है।
- source_word: δοκόν
  choice: लट्ठा
  rationale: δοκός बड़ी लकड़ी अथवा भवन में प्रयुक्त भारी शहतीर को दर्शाता है। ‘लट्ठा’ साधारण पाठक के लिए तुरंत समझ आने वाला है और तिनके के साथ तीखा अतिशयोक्तिपूर्ण विरोध रखता है।
- source_word: οὐ κατανοεῖς
  choice: ध्यान नहीं देता
  rationale: κατανοέω ध्यानपूर्वक देखने, पहचानने या विचार करने का भाव रखता है। ‘ध्यान नहीं देता’ केवल अनैच्छिक रूप से न दिखने के बजाय नैतिक विडंबना और βλέπεις से भेद दोनों व्यक्त करता है।
theological_decisions:
- issue: ἀδελφοῦ का लिंगयुक्त संबंध-सूचक अर्थ
  choice: भाई
  alternative: भाई या बहन; संगी विश्वासी
  rationale: यहाँ कोई आवश्यक लिंग-निरपेक्षीकरण नहीं किया गया; यूनानी पुल्लिंग एकवचन को ‘भाई’ से सीधे रखा गया है, जबकि कथन का सिद्धांत व्यापक रूप से लागू हो सकता है।
- issue: कάρφος और δοκός की अतिशयोक्तिपूर्ण छवि
  choice: तिनका और लट्ठा
  alternative: किरच और शहतीर
  rationale: यीशु के कथन में छोटे और अत्यंत बड़े दोष का जानबूझकर असंगत दृश्य-विरोध है। अनुवाद इस अतिशयोक्ति को रूपक की व्याख्या किए बिना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और मौखिक शिक्षा के अनुकूल शैली। ‘तू’ निकटवर्ती उपदेशात्मक संबोधन और एकवचन दूसरे पुरुष को बनाए रखता है; क्रियाएँ उसी के अनुरूप हैं। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न संबद्ध शब्दों के तुरंत बाद दिए गए हैं।
