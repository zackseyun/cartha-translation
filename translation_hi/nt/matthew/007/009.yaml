  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: hi
  text: या तुम में से ऐसा कौन आदमी[क] है जिसका बेटा उससे रोटी माँगे, और वह आदमी उसे पत्थर दे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, अधिक समावेशी हिन्दी प्रयोग में, ‘तुम में से ऐसा कौन व्यक्ति है’; यूनानी में ‘आदमी’ प्रतिनिधिक अर्थ में है।
    reason: प्रतिनिधिक पुल्लिंग ἄνθρωπος के लिए अंग्रेज़ी POB audit-trail के lexical-alternative footnote का समतुल्य।
lexical_decisions:
- source_word: ἢ
  choice: या
  rationale: यह पिछले कथन से जुड़ा अगला आलंकारिक उदाहरण प्रस्तुत करता है; हिन्दी में ‘या’ स्वाभाविक संयोजक है।
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: तुम में से ऐसा कौन आदमी है
  rationale: यह यूनानी के अंशवाचक भाव (‘तुम में से’) और प्रतिनिधिक एकवचन ‘आदमी’ को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ
  choice: जिससे उसका बेटा ... माँगे
  rationale: सम्बन्धवाचक संरचना को बनाए रखते हुए αἰτήσει को सामान्य काल्पनिक परिस्थिति के अनुकूल ‘माँगे’ से व्यक्त किया गया है।
- source_word: ἄρτον
  choice: रोटी
  rationale: ‘रोटी’ सामान्य भोजन के रूप में bread का सीधा, परिचित और प्रसंगानुकूल हिन्दी पर्याय है।
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: और वह उसे पत्थर दे?
  rationale: μή ऐसे आलंकारिक प्रश्न को चिह्नित करता है जिसका अपेक्षित उत्तर ‘नहीं’ है; हिन्दी में प्रश्न-रचना स्वयं उस नकारात्मक अपेक्षा को स्वाभाविक रूप से व्यक्त करती है।
theological_decisions:
- issue: प्रतिनिधिक पुल्लिंग भाषा
  choice: आदमी ... उसका बेटा
  alternative: व्यक्ति ... उसकी संतान
  rationale: मूल में ἄνθρωπος और υἱός पुल्लिंग एकवचन में हैं। चुना हुआ अनुवाद उस रूप को बनाए रखता है, पर उससे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं निकालता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मनुष्य’ की अपेक्षा ‘आदमी’ सामान्य पाठक के लिए अधिक स्वाभाविक है; वाक्य की आलंकारिक प्रकृति प्रश्नचिह्न और ‘माँगे ... दे?’ की रचना से स्पष्ट होती है।
