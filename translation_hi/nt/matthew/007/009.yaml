  source_fidelity: The draft accurately conveys the rhetorical alternative, the representative singular ‘man,’ the son’s request for bread, and the expected-negative question. The Greek future forms function naturally in a general hypothetical comparison; Hindi subjunctive ‘माँगे ... दे’ is appropriate.
