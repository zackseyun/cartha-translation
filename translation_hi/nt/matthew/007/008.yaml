id: MAT.7.8
reference: Matthew 7:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: hi
  text: क्योंकि जो कोई माँगता है, उसे मिलता है; और जो खोजता है, वह पाता है; और जो खटखटाता है, उसके लिए खोला जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में ‘द्वार’ स्पष्ट रूप से नहीं कहा गया है; खटखटाने के बिंब से उसका संकेत मिलता है।
    reason: मूल पाठ में निष्क्रिय क्रिया का कर्ता अनिर्दिष्ट है; टिप्पणी अनुवाद में ‘द्वार’ न जोड़ने का कारण स्पष्ट करती है।
lexical_decisions:
- source_word: πᾶς
  choice: जो कोई
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत के साथ यह व्यापक सामान्यता व्यक्त करता है। ‘जो कोई’ आधुनिक हिन्दी में स्वाभाविक है और सार्वभौमिक दायरे को बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले पद के उपदेश का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ उस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ αἰτῶν
  choice: माँगता है
  rationale: वर्तमानकालिक कृदंत सामान्य या निरंतर क्रिया का बोध कराता है। ‘जो कोई माँगता है’ हिन्दी में स्वाभाविक है और यूनानी रचना का भाव सुरक्षित रखता है।
- source_word: λαμβάνει
  choice: उसे मिलता है
  rationale: λαμβάνω का यहाँ सामान्य अर्थ ‘पाना/प्राप्त करना’ है। ‘उसे मिलता है’ माँगने वाले को प्राप्तकर्ता के रूप में स्पष्ट करता है और हिन्दी मुहावरे के अनुरूप है।
- source_word: ὁ ζητῶν
  choice: जो खोजता है
  rationale: यह संज्ञार्थक कृदंत ‘खोजने वाला व्यक्ति’ दर्शाता है। इस रूप से कथन की समानांतर लय बनी रहती है।
- source_word: εὑρίσκει
  choice: वह पाता है
  rationale: ‘पाता है’ εὑρίσκω का सीधा और प्रसंगानुकूल अर्थ है तथा कथन की सरलता बनाए रखता है।
- source_word: τῷ κρούοντι
  choice: जो खटखटाता है, उसके लिए
  rationale: सम्प्रदान कारक को ‘उसके लिए’ से व्यक्त किया गया है, जिससे निष्क्रिय क्रिया के साथ यूनानी वाक्य-संबंध सुरक्षित और हिन्दी में स्पष्ट रहता है।
- source_word: ἀνοιγήσεται
  choice: खोला जाएगा
  rationale: यह भविष्यकालीन कर्मवाच्य है। यूनानी में क्या खोला जाएगा, यह स्पष्ट रूप से नहीं कहा गया; इसलिए अनुवाद में ‘द्वार’ नहीं जोड़ा गया।
theological_decisions:
- issue: प्रतिज्ञा का दायरा और बल
  choice: कथन को उसके सार्वभौमिक शब्दों में एक सामान्य आश्वासन के रूप में रखा गया है, बिना प्रसंग से अलग किसी निरपेक्ष गारंटी को अनुवाद में जोड़ने के।
  alternative: इसे या तो हर विशिष्ट माँग के ठीक उसी रूप में पूरा होने की बिना शर्त गारंटी, या केवल कुछ आध्यात्मिक माँगों तक सीमित प्रतिज्ञा के रूप में अनुवादित करना।
  rationale: मूल पाठ व्यापक भाषा का प्रयोग करता है। अनुवाद न तो उसमें कोई सीमा जोड़ता है, न उसके कथन को प्रसंग से परे और अधिक निरपेक्ष बनाता है; इस प्रकार व्याख्यात्मक और धर्मवैज्ञानिक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। तीनों समानांतर उपवाक्यों की लय बनाए रखने के लिए ‘माँगता है—मिलता है’, ‘खोजता है—पाता है’ और ‘खटखटाता है—खोला जाएगा’ की संरचना अपनाई गई है।
