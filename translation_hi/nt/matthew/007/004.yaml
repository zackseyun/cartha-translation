id: MAT.7.4
reference: Matthew 7:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: hi
  text: या तुम अपने भाई से कैसे कहोगे, ‘मुझे तुम्हारी आँख से तिनका निकालने दो,’ और देखो, तुम्हारी अपनी आँख में शहतीर है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: या
  rationale: यह यीशु के तर्क में अगला प्रश्नात्मक विकल्प प्रस्तुत करता है; हिन्दी में ‘या’ स्वाभाविक और सटीक है।
- source_word: πῶς ἐρεῖς
  choice: कैसे कहोगे
  rationale: भविष्यकालीन क्रिया और प्रश्न की चुनौतीपूर्ण शक्ति—दोनों को बनाए रखता है।
- source_word: τῷ ἀδελφῷ σου
  choice: अपने भाई से
  rationale: मूल यूनानी में पुल्लिंग एकवचन है; ‘भाई’ उसका सीधा और प्रसंगानुकूल रूप है।
- source_word: Ἄφες ἐκβάλω
  choice: मुझे … निकालने दो
  rationale: आज्ञार्थक Ἄφες यहाँ अनुमति माँगने वाला मुहावरा है, और ἐκβάλω आँख से किसी वस्तु को निकालने का भाव देता है।
- source_word: τὸ κάρφος
  choice: तिनका
  rationale: किसी छोटी, सूखी वस्तु के टुकड़े का बोध देता है और हिन्दी में आँख तथा शहतीर के अतिशयोक्तिपूर्ण विरोध को सहज रखता है।
- source_word: καὶ ἰδοὺ
  choice: जबकि देखो
  rationale: ἰδού ध्यान आकृष्ट करता है; ‘देखो’ आधुनिक हिन्दी में उसकी शक्ति बचाता है। ‘जबकि’ प्रसंग का तीखा विरोध स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἡ δοκὸς
  choice: शहतीर
  rationale: δοκός बड़े संरचनात्मक काष्ठखंड को दर्शाता है; ‘शहतीर’ ‘लट्ठे’ या ‘तख़्ते’ से अधिक सटीक है।
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: तुम्हारी अपनी आँख में है
  rationale: स्थान को सीधे रखता है; ‘अपनी’ प्रसंगगत विरोध पर स्वाभाविक बल देता है।
theological_decisions:
- issue: ἀδελφῷ का लिंग-संबंधी अनुवाद
  choice: भाई
  alternative: भाई या बहन; साथी विश्वासी
  rationale: मूल पाठ पुल्लिंग एकवचन में एक काल्पनिक व्यक्ति को संबोधित करता है। व्यापक प्रतिनिधि अर्थ संभव है, पर उसे मुख्य पाठ में विस्तार देकर नहीं जोड़ा गया।
- issue: κάρφος और δοκός का अतिशयोक्तिपूर्ण विरोध
  choice: तिनका / शहतीर
  alternative: कण / लट्ठा; किरचा / तख़्ता
  rationale: यह जोड़ी छोटी और अत्यन्त बड़ी वस्तु के जानबूझकर किए गए असंगत विरोध को स्पष्ट, गरिमापूर्ण और स्वाभाविक हिन्दी में बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य को बोलचाल योग्य किंतु गरिमापूर्ण रखा गया है। ‘निहारो’ या ‘देखो तो’ की अपेक्षा ‘देखो’ अधिक वर्तमान और सीधा है। मूल पाठ की अलंकारिक अतिशयोक्ति और प्रश्नात्मक चुनौती को सुरक्षित रखा गया है।
