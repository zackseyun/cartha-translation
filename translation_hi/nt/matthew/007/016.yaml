id: MAT.7.16
reference: Matthew 7:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: hi
  text: उनके फलों से तुम उन्हें पहचान लोगे।[a] क्या लोग काँटेदार झाड़ियों से अंगूर या ऊँटकटारों से अंजीर तोड़ते हैं?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके फलों से तुम उन्हें जान लोगे।’
    reason: lexical_alternative
  - marker: b
    text: 'इस प्रश्न का अपेक्षित उत्तर ‘नहीं’ है: लोग काँटेदार झाड़ियों से अंगूर या ऊँटकटारों से अंजीर नहीं तोड़ते।'
    reason: rhetorical_question
lexical_decisions:
- source_word: καρπῶν
  choice: फलों
  rationale: यूनानी में बहुवचन है। यहाँ यह लोगों के दिखाई देने वाले परिणामों या कामों का रूपक है, पर कृषि-संबंधी मूल बिंब और उसका व्यापक धर्मवैचारिक अर्थ बनाए रखने के लिए ‘फलों’ रखा गया है।
- source_word: ἐπιγνώσεσθε
  choice: पहचान लोगे
  rationale: यह भविष्यकालीन क्रिया अवलोकन के आधार पर पहचानने या जान लेने का भाव देती है। झूठे भविष्यवक्ताओं को उनके फलों से परखने के संदर्भ में ‘पहचान लोगे’ स्वाभाविक है और ‘पूरी तरह जान लोगे’ जैसी अतिव्याख्या से बचता है।
- source_word: μήτι
  choice: क्या
  rationale: μήτι ऐसा आलंकारिक प्रश्न आरंभ करता है जिसका अपेक्षित उत्तर ‘नहीं’ है। हिंदी में ‘क्या लोग...?’ इस आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: συλλέγουσιν
  choice: तोड़ते हैं
  rationale: फल इकट्ठा करने के लिए हिंदी में ‘तोड़ना’ सहज और कृषि-बिंब के अनुकूल है; संदर्भ में इसका अर्थ पौधों से फल एकत्र करना है।
- source_word: ἀκανθῶν
  choice: काँटेदार झाड़ियों
  rationale: शब्द काँटों अथवा काँटेदार झाड़ियों को सूचित कर सकता है। फल तोड़ने की क्रिया के साथ ‘काँटेदार झाड़ियों’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: σταφυλάς
  choice: अंगूर
  rationale: बहुवचन वस्तु के लिए सीधा और सामान्य हिंदी समतुल्य।
- source_word: τριβόλων
  choice: ऊँटकटारों
  rationale: यह एक काँटेदार जंगली पौधे को सूचित करता है। ‘ऊँटकटारा’ आधुनिक हिंदी में समझ में आने वाला पौधा-संबंधी शब्द है और पहले पद की काँटेदार झाड़ियों से कुछ भिन्नता भी बनाए रखता है।
- source_word: σῦκα
  choice: अंजीर
  rationale: मूल बहुवचन का मानक हिंदी समतुल्य; हिंदी में फलवाचक संज्ञा इस रूप में स्वाभाविक है।
- source_word: αὐτῶν / αὐτούς
  choice: उनके / उन्हें
  rationale: दोनों सर्वनाम संदर्भ में बताए गए लोगों, अर्थात पिछले पद के झूठे भविष्यवक्ताओं, की ओर संकेत करते हैं। हिंदी में व्यक्तिगत संदर्भ यथावत रखा गया है।
theological_decisions:
- issue: लोगों को पहचानने में ‘फलों’ का रूपक
  choice: ‘फलों’ का मूल रूपक बनाए रखा गया है।
  alternative: ‘कामों’, ‘व्यवहार’ या ‘उनसे निकलने वाले परिणामों’ जैसी व्याख्यात्मक अभिव्यक्ति।
  rationale: यीशु की उक्ति में कृषि-बिंब ही पहचान और परख का आधार व्यक्त करता है। ‘फलों’ को बनाए रखने से इसके अर्थ को किसी एक प्रकार के काम या परिणाम तक सीमित किए बिना इसकी धर्मवैचारिक और साहित्यिक प्रतिध्वनि सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पहचान लोगे’ संदर्भगत विवेक को स्पष्ट करता है, जबकि ‘फलों’ का ठोस रूपक ज्यों का त्यों रखा गया है। ‘काँटेदार झाड़ियों’ और ‘ऊँटकटारों’ से दोनों यूनानी पौधा-संबंधी शब्दों का समानांतर किंतु अलग रूप प्रस्तुत होता है।
