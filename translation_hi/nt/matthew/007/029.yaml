  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: hi
  text: क्योंकि वह उन्हें ऐसे व्यक्ति के समान शिक्षा देता था जिसके पास अधिकार था[a], न कि उनके शास्त्रियों के समान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्वाभाविक रूप में, “अधिकार के साथ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: क्योंकि वह ... शिक्षा देता था
  rationale: γάρ पिछले पद में लोगों के चकित होने का कारण बताता है, और ἦν के साथ वर्तमान कृदंत भूतकाल में जारी अथवा सामान्य ढंग की शिक्षा देने की क्रिया व्यक्त करता है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: यह कर्मवाचक सर्वनाम सुननेवाली भीड़ की ओर संकेत करता है।
- source_word: ὡς ἐξουσίαν ἔχων
  choice: ऐसे व्यक्ति के समान ... जिसके पास अधिकार हो
  rationale: यह यूनानी तुलना और व्यक्ति-केंद्रित रचना को बनाए रखता है; ἐξουσία यहाँ अधिकार, हक़ या प्रामाणिक सामर्थ्य का भाव रखता है। अधिक स्वाभाविक संक्षिप्त विकल्प ‘अधिकार के साथ’ पादटिप्पणी में दिया गया है।
- source_word: καὶ οὐχ ὡς
  choice: न कि ... के समान
  rationale: यह मूल पाठ की स्पष्ट तुलना और विरोध को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: उनके शास्त्रियों
  rationale: γραμματεῖς व्यवस्था के मान्य विद्वानों और व्याख्याताओं को सूचित करता है; ‘शास्त्री’ सुसमाचार-संदर्भ में सीधा और प्रचलित समतुल्य है। ‘उनके’ αὐτῶν को सुरक्षित रखता है।
theological_decisions:
- issue: यीशु की शिक्षा के अधिकार का स्वरूप
  choice: कथन को शिक्षा देने के ढंग और वास्तविक अधिकार की वर्णनात्मक तुलना के रूप में रखा गया है।
  alternative: इसे स्पष्ट रूप से ‘दिव्य अधिकार’ कहना, या इसे केवल आत्मविश्वास और प्रभावशाली वाणी तक सीमित करना।
  rationale: पद यीशु के अधिकार को शास्त्रियों से अलग और वास्तविक बताता है, पर इसी पद में उस अधिकार का पूर्ण धर्मवैज्ञानिक आधार स्पष्ट नहीं करता। अनुवाद इस तनाव को बिना अतिरिक्त व्याख्या जोड़े बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शास्त्री’ बाइबलीय-सांस्कृतिक पद को सुरक्षित रखता है, जबकि वाक्यरचना मूल यूनानी की तुलना को स्पष्ट करती है।
