review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the reciprocal imperative and the generic force of οἱ ἄνθρωποι. However, placing “हर बात में” after “उनके साथ” makes it attach most naturally to the commanded action rather than to the comprehensive opening Πάντα οὖν ὅσα. Moving it to the front better reflects the Greek scope. “तुम्हारे/उनके लिए” is also a more direct rendering of the benefactive dative than “साथ.”
  naturalness: The revised wording is natural modern standard Hindi, maintains the correlative structure, and gives the concluding scriptural formula a clear Hindi predicate without turning it into a broader paraphrase.
  terminology: “लोग” appropriately renders generic ἄνθρωποι. “व्यवस्था और भविष्यद्वक्ताओं” retains the established Jewish scriptural formula. Adding “की शिक्षा” is a restrained idiomatic clarification of the formula’s ethical-summary sense, not a doctrinal expansion.
  issues:
  - severity: medium
    issue: Scope and placement of “हर बात में”
    rationale: Πάντα occurs at the start and governs the whole maxim. In the draft, “उनके साथ हर बात में करो” can be read as an adverbial qualification only of the second clause. Fronting “हर बात में” preserves the source emphasis and scope more clearly.
  - severity: low
    issue: “तुम्हारे साथ / उनके साथ” for ποιεῖν + dative
    rationale: Although understandable in a reciprocal-behavior context, “तुम्हारे लिए / उनके लिए” more directly expresses the benefactive sense represented by the English audit trail and fits this maxim naturally in Hindi.
  revised_text: इसलिए हर बात में, जो कुछ तुम चाहते हो कि लोग तुम्हारे लिए करें, तुम भी उनके लिए वैसा ही करो; क्योंकि यही व्यवस्था और भविष्यद्वक्ताओं की शिक्षा है।
  revised_footnotes: []
