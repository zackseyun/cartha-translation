id: MAT.7.12
reference: Matthew 7:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: hi
  text: इसलिए हर बात में, जो कुछ तुम चाहते हो कि लोग तुम्हारे लिए करें, तुम भी उनके लिए वैसा ही करो; क्योंकि यही व्यवस्था और भविष्यद्वक्ताओं की शिक्षा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα οὖν ὅσα
  choice: इसलिए, जैसा ... वैसा ही ... हर बात में
  rationale: Πάντα और ὅσα मिलकर व्यापक अर्थ देते हैं। हिन्दी में सहसंबंधी ‘जैसा…वैसा’ रचना के साथ ‘हर बात में’ रखने से सार्वभौमिक दायरा और स्वाभाविक प्रवाह दोनों बने रहते हैं; οὖν को ‘इसलिए’ ने पिछले उपदेश से निष्कर्ष के रूप में जोड़ा है।
- source_word: ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν
  choice: तुम चाहते हो कि ... तुम्हारे साथ करें
  rationale: θέλητε के बाद ἵνα और संभावनार्थक क्रिया इच्छित व्यवहार को व्यक्त करते हैं। ‘चाहते हो कि’ इसका सहज आधुनिक हिन्दी रूप है और ‘तुम्हारे साथ’ पारस्परिक व्यवहार के संदर्भ को स्पष्ट रखता है।
- source_word: οἱ ἄνθρωποι
  choice: लोग
  rationale: यहाँ ἄνθρωποι समस्त मनुष्यों के लिए सामान्य रूप से प्रयुक्त है, केवल पुरुषों के लिए नहीं। ‘लोग’ हिन्दी में स्वाभाविक और लिंग-समावेशी है।
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: वैसा ही तुम भी उनके साथ ... करो
  rationale: οὕτως καὶ का अनुरूप और पारस्परिक बल ‘वैसा ही…भी’ से आता है। वर्तमान आज्ञार्थक ποιεῖτε को ‘करो’ ने सतत आचरण की आज्ञा के रूप में व्यक्त किया है।
- source_word: οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται
  choice: क्योंकि व्यवस्था और भविष्यद्वक्ताओं की शिक्षा यही है
  rationale: γάρ का कारणसूचक अर्थ ‘क्योंकि’ से सुरक्षित है। यूनानी का संक्षिप्त ‘यही व्यवस्था और भविष्यद्वक्ता हैं’ हिन्दी में अस्वाभाविक हो सकता है; ‘की शिक्षा’ निहित सार-संदर्भ को स्पष्ट करते हुए स्थापित शास्त्रीय युग्म को बनाए रखता है।
theological_decisions:
- issue: οἱ ἄνθρωποι का सामान्य पुल्लिंग प्रयोग
  choice: लोग
  alternative: मनुष्य / पुरुष
  rationale: संदर्भ सार्वभौमिक मानवीय संबंधों का है; ‘पुरुष’ अर्थ को अनुचित रूप से पुरुषों तक सीमित कर सकता है।
- issue: ‘व्यवस्था और भविष्यद्वक्ता’ का अर्थ-क्षेत्र
  choice: स्थापित शास्त्रीय सार-सूत्र को ‘व्यवस्था और भविष्यद्वक्ताओं की शिक्षा’ के रूप में रखना
  alternative: पूरा पवित्रशास्त्र / व्यवस्था और भविष्यद्वक्ता यही हैं
  rationale: मत्ती का यह यहूदी शास्त्रीय सूत्र सुरक्षित रहता है, जबकि ‘की शिक्षा’ हिन्दी में वाक्य का आशय स्पष्ट करता है। इसे ‘पूरा पवित्रशास्त्र’ कहकर विस्तृत करना मूल अभिव्यक्ति की अंतर्पाठीय विशेषता मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘तुम’ बहुवचन श्रोताओं के लिए है। वाक्य की पारस्परिक ‘जैसा…वैसा’ संरचना स्वाभाविक हिन्दी में मूल तर्क और सार्वभौमिक दायरा बनाए रखती है।
