- from: इसलिए, जैसा व्यवहार तुम चाहते हो कि लोग तुम्हारे साथ करें, वैसा ही तुम भी उनके साथ हर बात में करो; क्योंकि व्यवस्था और भविष्यद्वक्ताओं की शिक्षा यही है।
  to: इसलिए हर बात में, जो कुछ तुम चाहते हो कि लोग तुम्हारे लिए करें, तुम भी उनके लिए वैसा ही करो; क्योंकि यही व्यवस्था और भविष्यद्वक्ताओं की शिक्षा है।
  rationale: 'The revision relocates the comprehensive qualifier to mirror Πάντα, uses benefactive Hindi pronoun phrases for the dative relationship, and preserves the conventional formula “व्यवस्था और भविष्यद्वक्ता” while retaining the draft’s clear idiomatic explanation of its ethical force. No footnote is needed: “लोग” is already an unambiguous inclusive Hindi rendering of generic ἄνθρωποι.'
