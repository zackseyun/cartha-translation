source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: hi
  text: सँकरे फाटक से प्रवेश करो, क्योंकि चौड़ा है फाटक और विस्तृत है वह मार्ग[a] जो विनाश[b] की ओर ले जाता है, और बहुत-से लोग उससे होकर प्रवेश करते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खुला हुआ वह मार्ग।’ यूनानी शब्द का अर्थ ‘विस्तृत,’ ‘चौड़ा’ या ‘खुला’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बरबादी’ अथवा ‘सर्वनाश।’
    reason: lexical_alternative
  - marker: c
    text: ‘उससे’ का संकेत संभवतः फाटक की ओर है; यूनानी व्याकरण में यह मार्ग की ओर भी संकेत कर सकता है।
    reason: referential_ambiguity
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: प्रवेश करो
  rationale: द्वितीय पुरुष बहुवचन की आज्ञा को सीधे और स्वाभाविक रूप में व्यक्त करता है।
- source_word: διὰ τῆς στενῆς πύλης
  choice: सँकरे फाटक से
  rationale: διά के साथ संबंधकारक यहाँ किसी द्वार से होकर भीतर जाने का भाव देता है; आधुनिक हिन्दी में ‘से प्रवेश करो’ स्वाभाविक है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह आरम्भिक आज्ञा का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: πλατεῖα ἡ πύλη
  choice: चौड़ा है फाटक
  rationale: विशेषण को आगे रखकर यूनानी के बलाघात को हिन्दी में भी बनाए रखा गया है।
- source_word: εὐρύχωρος ἡ ὁδός
  choice: विस्तृत है वह मार्ग
  rationale: εὐρύχωρος में चौड़े, खुले या पर्याप्त जगह वाले होने का भाव है; ‘विस्तृत’ फाटक के ‘चौड़ा’ होने से समानांतर विरोध बनाए रखता है।
- source_word: ἡ ἀπάγουσα
  choice: जो … की ओर ले जाता है
  rationale: वर्तमान कृदन्त का दिशात्मक भाव स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है।
- source_word: εἰς τὴν ἀπώλειαν
  choice: विनाश की ओर
  rationale: ἀπώλεια के गंभीर परिणाम को व्यक्त करता है, पर उस परिणाम की धार्मिक प्रकृति को पाठ से अधिक निश्चित नहीं करता।
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: बहुत-से लोग उससे होकर प्रवेश करते हैं
  rationale: ‘बहुत-से’ पर बल बनाए रखते हुए हिन्दी में स्वाभाविक वाक्य दिया गया है; ‘उससे’ यूनानी स्त्रीलिंग सर्वनाम के संभावित संदर्भ को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: ἀπώλεια का आशय
  choice: विनाश
  alternative: बरबादी; सर्वनाश
  rationale: मूल पाठ एक घातक अंतिम परिणाम की चेतावनी देता है, लेकिन इस पद में उसकी पूरी धार्मिक प्रकृति परिभाषित नहीं करता; ‘विनाश’ इस तनाव को बनाए रखता है।
- issue: δι’ αὐτῆς में सर्वनाम का संदर्भ
  choice: उससे होकर
  alternative: उस फाटक से होकर
  rationale: यूनानी में ‘फाटक’ और ‘मार्ग’ दोनों स्त्रीलिंग हैं, यद्यपि ‘प्रवेश करना’ अर्थ की दृष्टि से फाटक की ओर प्रबल संकेत करता है। सर्वनाम बनाए रखने से मूल की व्याकरणिक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘फाटक’ और ‘मार्ग’ रूपक को ठोस रखते हैं; उलटा विशेषण-विन्यास यूनानी के बलाघात को हल्के औपचारिक रंग के साथ सुरक्षित रखता है।
