id: MAT.7.18
reference: Matthew 7:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: hi
  text: अच्छा पेड़[a] बुरे फल[b] नहीं दे सकता, और न सड़ा हुआ पेड़[c] अच्छे फल दे सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘स्वस्थ पेड़।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘दुष्ट फल।’
    reason: lexical_alternative
  - marker: c
    text: या, ‘गला-सड़ा पेड़।’
    reason: lexical_alternative
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: अच्छा पेड़
  rationale: ἀγαθός का सामान्य अर्थ ‘अच्छा’ है। यह चुनाव पेड़ के शाब्दिक चित्र और उसके मूल्यांकनात्मक आशय—दोनों को बनाए रखता है; ‘स्वस्थ’ अधिक व्याख्यात्मक होता।
- source_word: δύναται ... ποιεῖν
  choice: फल दे सकता
  rationale: δύναται सामर्थ्य या क्षमता व्यक्त करता है, जबकि καρπούς के साथ ποιεῖν का अर्थ स्वाभाविक रूप से फल उत्पन्न करना या देना है। हिंदी में ‘फल दे सकता’ इस मुहावरे के लिए सहज है।
- source_word: καρποὺς πονηρούς
  choice: बुरे फल
  rationale: πονηρός में बुरे, दुष्ट या निकृष्ट होने का भाव हो सकता है। ‘बुरे फल’ रूपक की व्यापक मूल्यांकनात्मक और नैतिक शक्ति को बनाए रखते हुए स्वाभाविक हिंदी है।
- source_word: οὐδέ
  choice: और न
  rationale: οὐδέ दूसरे निषेध को पहले के समानांतर जोड़ता है। ‘और न’ दोनों खंडों का संतुलन और निषेध स्पष्ट रखता है।
- source_word: δένδρον σαπρόν
  choice: सड़ा हुआ पेड़
  rationale: σαπρός सड़ी, गली या भ्रष्ट दशा बताता है। ‘सड़ा हुआ’ पेड़ के ठोस चित्र को बनाए रखता है और केवल सामान्य ‘बुरा’ कहने से अधिक सटीक है।
- source_word: καρποὺς καλούς
  choice: अच्छे फल
  rationale: καλός यहाँ अच्छी गुणवत्ता वाले फल को बताता है। ‘अच्छे फल’ ‘बुरे फल’ के साथ स्पष्ट विरोध और मूल वाक्य का समानांतर ढाँचा बनाए रखता है।
theological_decisions:
- issue: रूपक में असमर्थता का स्वरूप
  choice: ‘नहीं दे सकता’ के द्वारा कथन को स्पष्ट और पूर्ण असमर्थता के रूप में प्रस्तुत किया गया है।
  alternative: ‘आमतौर पर नहीं देता’ या ‘नहीं देना चाहिए’
  rationale: यूनानी δύναται क्षमता की बात करता है और οὐ के साथ स्पष्ट असमर्थता व्यक्त करता है। इसे संभावना या नैतिक निर्देश में नरम करना मूल कथन की प्रबलता घटा देता; साथ ही अनुवाद इस रूपक से आगे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और बोलचाल में सहज वाक्य-विन्यास रखा गया है। ‘फल देना’ हिंदी का स्वाभाविक मुहावरा है। सभी पाद-टिप्पणी चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
