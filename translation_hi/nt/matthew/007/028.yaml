  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: hi
  text: और जब यीशु ये बातें कह चुके, तो भीड़ें उसकी शिक्षा पर चकित थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: और ऐसा हुआ कि जब
  rationale: यह कथात्मक सूत्र पिछले प्रसंग की निरंतरता और अगले परिणाम की ओर संक्रमण दोनों दिखाता है। हिन्दी में यह यूनानी रचना को स्पष्ट रूप से बनाए रखता है, यद्यपि ‘फिर जब’ अधिक सहज विकल्प है।
- source_word: ἐτέλεσεν
  choice: कहनी समाप्त कीं
  rationale: क्रिया यहाँ पूरे उपदेश को उसके अंत तक पहुँचाने का भाव देती है। ‘कहनी समाप्त कीं’ आधुनिक हिन्दी में स्वाभाविक रहते हुए पूर्णता का अर्थ व्यक्त करता है।
- source_word: τοὺς λόγους τούτους
  choice: ये बातें
  rationale: λόγοι का अर्थ ‘शब्द’, ‘बातें’ या ‘कथन’ हो सकता है। इस संदर्भ में ‘ये बातें’ अभी-अभी कही गई शिक्षा की ओर सहज रूप से संकेत करता है और ‘उपदेश’ जैसा अतिरिक्त व्याख्यात्मक नाम नहीं जोड़ता।
- source_word: ἐξεπλήσσοντο
  choice: चकित थी
  rationale: यूनानी अपूर्ण काल भीड़ की सामूहिक और बनी हुई प्रतिक्रिया दर्शाता है। हिन्दी का अवस्थासूचक ‘चकित थी’ उस प्रतिक्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οἱ ὄχλοι
  choice: लोगों की भीड़
  rationale: यूनानी में बहुवचन है, पर हिन्दी में ‘भीड़ें’ इस वाक्य में असहज लगता है। ‘लोगों की भीड़’ सामूहिक समूह का अर्थ स्वाभाविक आधुनिक हिन्दी में देता है।
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: उसकी शिक्षा पर
  rationale: ἐπί के साथ यह पद चकित होने के आधार या कारण को बताता है। ‘उसकी शिक्षा पर’ हिन्दी में संक्षिप्त और अर्थानुकूल है।
theological_decisions:
- issue: यीशु की पूरी हुई वाणी का संदर्भ
  choice: ये बातें
  alternative: ये कथन; यह उपदेश
  rationale: यह पद ठीक पहले दी गई यीशु की शिक्षा की ओर संकेत करता है। ‘ये बातें’ मूल पाठ की व्यापकता बनाए रखता है और ‘पहाड़ी उपदेश’ जैसा ऐसा शीर्षक नहीं जोड़ता जो यूनानी पाठ में नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कथात्मक सूत्र को मुख्य पाठ में अपेक्षाकृत औपचारिक रूप से सुरक्षित रखा गया है; उसके अधिक सहज हिन्दी विकल्प को पादटिप्पणी में दिया गया है।
