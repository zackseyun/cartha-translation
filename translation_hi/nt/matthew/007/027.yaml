  source_fidelity: The draft preserves the sequence of rain, rivers, winds striking the house, its fall, and the emphatic description of that fall. However, it adds ‘तब’ where the Greek continues with καί (‘and’), and ‘उसका गिरना बहुत बड़ा था’ is not idiomatic Hindi for the severity conveyed by μεγάλη.
  naturalness: ‘वर्षा बरसी,’ ‘नदियाँ उमड़ आईं,’ and ‘आँधियाँ चलीं’ are natural in the storm context. The final predicate ‘बहुत बड़ा था’ sounds semantically awkward with ‘गिरना’; ‘बहुत भयंकर था’ communicates the grave result naturally without adding an explicit theological interpretation.
  terminology: ‘नदियाँ’ appropriately retains the lexical sense of ποταμοί, and the footnote correctly supplies ‘बाढ़ का पानी’ as a contextual alternative. ‘गिर पड़ा’ and the repeated noun ‘गिरना’ preserve the Greek wordplay between ἔπεσεν and πτῶσις.
  issues:
