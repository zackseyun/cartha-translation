  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: hi
  text: और वर्षा बरसी, और नदियाँ उमड़ आईं[a], और आँधियाँ चलीं और उस घर से टकराईं, और वह गिर पड़ा, और उसका गिरना बहुत भयंकर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाढ़ का पानी उमड़ आया।’ यूनानी शब्द का अधिक शाब्दिक अर्थ ‘नदियाँ’ है, पर इस प्रसंग में वह बाढ़ के पानी का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: वर्षा बरसी
  rationale: यूनानी पद में वर्षा के नीचे आने का भाव है; स्वाभाविक आधुनिक हिन्दी में ‘वर्षा बरसी’ उसी घटना को संक्षेप और सहज ढंग से व्यक्त करता है।
- source_word: ἦλθον οἱ ποταμοί
  choice: नदियाँ उमड़ आईं
  rationale: ποταμοί का मूल अर्थ ‘नदियाँ’ है। ‘उमड़ आईं’ प्रसंग में बढ़ते और घर तक आ पहुँचते जल का भाव स्पष्ट करता है, जबकि संज्ञा के मूल अर्थ को बनाए रखता है।
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: आँधियाँ चलीं
  rationale: शाब्दिक रूप से ‘हवाएँ चलीं’; तूफानी प्रसंग में ‘आँधियाँ चलीं’ स्वाभाविक हिन्दी है और बहुवचन तथा प्रचंडता दोनों व्यक्त करता है।
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: उस घर से टकराईं
  rationale: प्रसंग में προσκόπτω का अर्थ किसी वस्तु से जोर से टकराना है। ‘से टकराईं’ दत्तिव संबंध और तूफान के प्रहार को स्वाभाविक हिन्दी में रखता है।
- source_word: ἔπεσεν
  choice: वह गिर पड़ा
  rationale: πίπτω का सीधा अर्थ ‘गिरना’ है। ‘गिर पड़ा’ घर के ढहने को स्वाभाविक रूप से व्यक्त करता है, बिना ‘नष्ट हो गया’ जैसी व्याख्या जोड़ने के।
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: उसका गिरना बहुत बड़ा था
  rationale: मूल पाठ ‘गिरने’ की संज्ञा को दोहराता और उसकी महानता बताता है। यह रूप उसी शब्दगत पुनरावृत्ति और गंभीर परिणाम को सुरक्षित रखता है।
theological_decisions:
- issue: दृष्टान्त के अंत में विनाश अथवा न्याय की तीव्रता
  choice: ‘उसका गिरना बहुत बड़ा था’ कहकर मूल विनाश-चित्र को यथावत रखा गया है।
  alternative: ‘वह पूरी तरह नष्ट हो गया’ या इसे स्पष्ट रूप से अंतिम न्याय बताना।
  rationale: यूनानी पाठ घर के गिरने को बड़ा बताता है, पर यहाँ स्वयं उसे किसी विशिष्ट अंतकालीन न्याय के रूप में नहीं खोलता। अनुवाद चेतावनी की तीव्रता बनाए रखते हुए अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप। वाक्य की बार-बार आने वाली ‘और’ वाली लय को अधिकांशतः सुरक्षित रखा गया है। ‘वर्षा’, ‘नदियाँ’ और ‘गिरना’ मूल शब्दावली के निकट हैं; ‘उमड़ आईं’ और ‘आँधियाँ’ तूफानी प्रसंग को सामान्य पाठक के लिए स्पष्ट करते हैं।
