    issue: The final clause is unnatural in Hindi.
    rationale: ‘उसका गिरना बहुत बड़ा था’ is a calque-like expression and does not naturally convey that the house’s fall was severe. ‘उसका गिरना बहुत भयंकर था’ is idiomatic and retains the source’s emphasis without specifying the nature of the judgment.
  - severity: low
    issue: ‘तब’ is an unnecessary connective expansion.
    rationale: The source retains the repeated καί cadence. Replacing ‘तब’ with ‘और’ better reflects that coordination and preserves the narrative rhythm.
