id: MAT.7.11
reference: Matthew 7:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: hi
  text: इसलिए यदि तुम बुरे होकर भी अपने बच्चों को अच्छे उपहार देना जानते हो, तो तुम्हारा पिता, जो स्वर्गों में है,[a] उन लोगों को जो उससे माँगते हैं, कितना अधिक अच्छी वस्तुएँ देगा!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक पारंपरिक अनुवाद है, ‘तुम्हारा पिता, जो स्वर्ग में है।’ यूनानी में ‘स्वर्ग’ बहुवचन है: ‘स्वर्गों में।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ οὖν
  choice: इसलिए यदि
  rationale: यह यूनानी के निष्कर्षसूचक οὖν और शर्तसूचक εἰ, दोनों को बनाए रखता है और पिछले उदाहरण से इस वाक्य का संबंध स्पष्ट करता है।
- source_word: πονηροὶ ὄντες
  choice: बुरे होकर भी
  rationale: ‘भी’ इस कृदन्तीय वाक्यांश के प्रसंगगत रियायती भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘बुरे’ मूल कथन की नैतिक तीक्ष्णता को न तो घटाता है, न उससे अधिक कठोर बनाता है।
- source_word: οἴδατε ... διδόναι
  choice: देना जानते हो
  rationale: पूरक infinitive के साथ οἴδατε व्यावहारिक योग्यता या समझ बताता है; हिन्दी में ‘देना जानते हो’ इसका सहज समतुल्य है।
- source_word: δόματα ἀγαθὰ
  choice: अच्छे उपहार
  rationale: δόματα स्पष्ट रूप से दी जाने वाली भेंटों को सूचित करता है और ἀγαθὰ उनका गुण बताता है। ‘उपहार’ आधुनिक, सम्मानपूर्ण और सामान्य हिन्दी है।
- source_word: τοῖς τέκνοις ὑμῶν
  choice: अपने बच्चों को
  rationale: τέκνα लिंग-समावेशी है; ‘बच्चों’ से पुत्र और पुत्रियाँ दोनों स्वाभाविक रूप से सम्मिलित होते हैं।
- source_word: πόσῳ μᾶλλον
  choice: कितनी अधिक
  rationale: यह कम से अधिक की यूनानी तर्क-पद्धति को स्पष्ट और मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: तुम्हारा पिता, जो स्वर्गों में है
  rationale: यह πατήρ और उसके बाद आए स्थानसूचक विशेषण-वाक्यांश की संरचना बनाए रखता है तथा οὐρανοῖς के बहुवचन को ‘स्वर्गों’ के रूप में दर्शाता है।
- source_word: δώσει ἀγαθὰ
  choice: अच्छी वस्तुएँ देगा
  rationale: दूसरे खंड में δόματα दोहराया नहीं गया है; इसलिए substantival ἀγαθὰ को ‘अच्छी वस्तुएँ’ कहना मूल की इस भिन्नता को सुरक्षित रखता है।
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: उन लोगों को ... जो उससे माँगते हैं
  rationale: वर्तमान कृदन्त सामान्य रूप से माँगनेवाले लोगों को दर्शाता है। ‘उससे माँगते हैं’ αὐτόν को स्पष्ट रखता है और हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: मनुष्यों के लिए πονηροὶ का नैतिक कथन
  choice: ‘बुरे होकर भी’ के सीधे कथन को बनाए रखना
  alternative: ‘पापी होने पर भी’ या ‘कमियों से भरे होने पर भी’
  rationale: मूल मनुष्यों को सीधे ‘बुरा’ कहता है। ‘पापी’ एक अतिरिक्त धर्मवैज्ञानिक शब्द जोड़ता, जबकि ‘कमियों से भरे’ कथन को नरम कर देता; चुना गया रूप मूल तनाव को सुरक्षित रखता है।
- issue: ὁ ἐν τοῖς οὐρανοῖς में बहुवचन और स्थानसूचक अभिव्यक्ति
  choice: ‘जो स्वर्गों में है’
  alternative: ‘स्वर्गीय पिता’ या ‘जो स्वर्ग में है’
  rationale: यह यूनानी बहुवचन और स्थानसूचक संरचना को पारंपरिक एकवचन या विशेषणात्मक उपाधि में बदले बिना व्यक्त करता है।
- issue: दूसरे खंड में ἀγαθὰ का स्वतंत्र संज्ञात्मक प्रयोग
  choice: ‘अच्छी वस्तुएँ’
  alternative: ‘अच्छे उपहार’
  rationale: यह परमेश्वर की देन की भलाई को बनाए रखते हुए पहले खंड के δόματα को वहाँ न जोड़ने देता जहाँ यूनानी ने उसे दोहराया नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण रखी गई है। ‘बुरे होकर भी’ बोलचाल की सहजता के साथ मूल की नैतिक तीक्ष्णता बनाए रखता है। ‘स्वर्गों’ का कम प्रचलित बहुवचन स्रोत-पाठ के कारण जानबूझकर रखा गया है और पादटिप्पणी में पारंपरिक विकल्प दिया गया है।
