id: MAT.7.21
reference: Matthew 7:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: hi
  text: जो मुझसे, ‘प्रभु, प्रभु,’ कहते हैं, उन सब में से हर कोई स्वर्ग के राज्य[a] में प्रवेश नहीं करेगा, बल्कि वही प्रवेश करेगा जो स्वर्ग में रहने वाले मेरे पिता की इच्छा पूरी करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “स्वर्गों के राज्य में।” मत्ती प्रायः इस अभिव्यक्ति का प्रयोग करता है, जहाँ अन्य प्रसंगों में “परमेश्वर का राज्य” कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “स्वर्गों में” बहुवचन है; हिन्दी में इसे स्वाभाविक रूप से “स्वर्ग में” किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: मुझसे … कहने वालों में से हर कोई … नहीं
  rationale: 'यह रचना οὐ πᾶς की आंशिक नकारात्मकता को स्पष्ट रखती है: आशय ‘कोई भी नहीं’ नहीं, बल्कि ‘हर कोई नहीं’ है। बहुवचन ‘कहने वालों में से’ आधुनिक हिन्दी में स्वाभाविक ढंग से यूनानी के सामान्यवाचक एकवचन कृदंत का भाव व्यक्त करता है।'
- source_word: Κύριε κύριε
  choice: प्रभु, प्रभु
  rationale: κύριος के सम्मानसूचक और धार्मिक अर्थ के लिए ‘प्रभु’ उपयुक्त है; दोहराव को उसके जोरदार संबोधन सहित सुरक्षित रखा गया है।
- source_word: εἰσελεύσεται
  choice: प्रवेश करेगा
  rationale: भविष्यकालीन क्रिया का सीधा और स्वाभाविक हिन्दी रूप। दूसरे खंड में यूनानी की लुप्त किंतु निहित क्रिया भी स्पष्टता के लिए दोहराई गई है।
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: स्वर्ग के राज्य में
  rationale: βασιλεία के लिए ‘राज्य’ और मत्ती की विशेष अभिव्यक्ति τῶν οὐρανῶν के लिए प्रचलित, अर्थपूर्ण हिन्दी ‘स्वर्ग के’ चुना गया है; यूनानी का बहुवचन पादटिप्पणी में बताया गया है।
- source_word: ἀλλ’ ὁ ποιῶν
  choice: बल्कि वही … जो … पूरी करता है
  rationale: यह विरोध को स्पष्ट रखता है और संज्ञार्थक वर्तमान कृदंत को स्वाभाविक हिन्दी संबंधवाचक रचना में व्यक्त करता है।
- source_word: τὸ θέλημα
  choice: इच्छा
  rationale: ‘इच्छा’ θέλημα के अभिप्राय, उद्देश्य और चाह के अर्थ को धार्मिक निष्कर्ष जोड़े बिना सुरक्षित रखती है। ‘इच्छा पूरी करता है’ हिन्दी में ‘इच्छा को करता है’ से अधिक स्वाभाविक है।
- source_word: τοῦ πατρός μου τοῦ ἐν τοῖς οὐρανοῖς
  choice: मेरे उस पिता … जो स्वर्ग में है
  rationale: ‘उस … जो’ की रचना स्पष्ट करती है कि ‘जो स्वर्ग में है’ पिता का विशेषण है। मूल के ‘मेरे पिता’ और स्थानसूचक वाक्यांश, दोनों अलग-अलग सुरक्षित रहते हैं।
theological_decisions:
- issue: मौखिक स्वीकार और पिता की इच्छा पूरी करने के संबंध में राज्य में प्रवेश
  choice: 'पद के स्पष्ट विरोध को बनाए रखा गया है: केवल यीशु को ‘प्रभु’ कहना पर्याप्त नहीं बताया गया; पिता की इच्छा पूरी करने वाला प्रवेश करेगा।'
  alternative: इसे अपने-आप में कर्मों द्वारा उद्धार का पूर्ण सिद्धांत मानना, या मौखिक स्वीकार को ही पर्याप्त मानना।
  rationale: यूनानी पाठ कहने और करने के बीच तीखा विरोध रखता है, पर इस एक पद में उद्धार का कोई संपूर्ण सिद्धांत व्यवस्थित नहीं करता। अनुवाद उसी तनाव को बिना सांप्रदायिक निष्कर्ष के सुरक्षित रखता है।
- issue: दूसरे खंड में ‘प्रवेश करेगा’ की पुनरावृत्ति
  choice: हिन्दी में निहित क्रिया ‘प्रवेश करेगा’ स्पष्ट रूप से दोहराई गई है।
  alternative: शब्दशः लोप रखते हुए ‘बल्कि वह जो…’ कहना।
  rationale: यूनानी में क्रिया पहले खंड से समझी जाती है। हिन्दी में उसे दोहराने से तुलना और अर्थ स्पष्ट तथा स्वाभाविक होते हैं, कोई नया धर्मवैज्ञानिक दावा नहीं जुड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘हर कोई … नहीं’ की संभावित अस्पष्टता घटाने के लिए ‘कहने वालों में से’ जोड़ा गया है। ‘प्रभु’ और ‘स्वर्ग का राज्य’ जैसे परिचित बाइबलीय पद बनाए रखते हुए वाक्यरचना स्वाभाविक हिन्दी की है।
