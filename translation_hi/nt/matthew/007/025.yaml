source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: hi
  text: और वर्षा बरसी, नदियाँ उमड़ आईं[a], और हवाएँ चलीं; वे उस घर पर टूट पड़ीं[b]। फिर भी वह नहीं गिरा, क्योंकि उसकी नींव चट्टान पर डाली गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाढ़ आ गई”; यूनानी शब्द का अधिक शाब्दिक अर्थ “नदियाँ” है।
    reason: lexical_alternative
  - marker: b
    text: या “उस घर पर आ पड़ीं” अथवा “उस घर पर प्रहार किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: वर्षा बरसी
  rationale: शाब्दिक अर्थ ‘वर्षा नीचे आई’ है; स्वाभाविक हिन्दी में ‘वर्षा बरसी’ नीचे गिरने की गति को सहज रूप से व्यक्त करता है।
- source_word: οἱ ποταμοί
  choice: नदियाँ उमड़ आईं
  rationale: ποταμοί का मूल अर्थ ‘नदियाँ’ है। ‘उमड़ आईं’ तूफ़ान के प्रसंग में उनके बढ़कर घर तक आने को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘बाढ़’ को मुख्य पाठ में रखकर शब्दार्थ को संकुचित नहीं करता।
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: हवाएँ चलीं
  rationale: यह यूनानी पद का सीधा, सामान्य और स्वाभाविक हिन्दी रूप है।
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: उस घर से टकराईं
  rationale: προσπίπτω का मूल भाव किसी वस्तु पर या उसके विरुद्ध आ पड़ना है; इस तूफ़ानी प्रसंग में ‘टकराईं’ बलपूर्ण प्रहार को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὐκ ἔπεσεν
  choice: वह नहीं गिरा
  rationale: यह क्रिया का सीधा अनुवाद है और ‘ढह गया’ जैसी अधिक विशिष्ट व्याख्या जोड़ने से बचता है।
- source_word: τεθεμελίωτο
  choice: उसकी नींव … डाली गई थी
  rationale: पूर्णभूत कर्मवाच्य रूप पहले से पूरी हो चुकी नींव डालने की क्रिया और उसके बने हुए परिणाम—दोनों को बनाए रखता है।
- source_word: ἐπὶ τὴν πέτραν
  choice: चट्टान पर
  rationale: πέτρα के ठोस शैल-संबंधी अर्थ को व्यक्त करता है और इसे ‘आधारशिला’ जैसे अधिक धर्मवैज्ञानिक पद से नहीं बदलता।
theological_decisions:
- issue: नींव की दृष्टान्तात्मक छवि
  choice: चट्टान पर
  alternative: ठोस चट्टान पर / आधारशिला पर
  rationale: पद स्वयं चट्टान की अलग से धर्मवैज्ञानिक पहचान नहीं बताता। साधारण दृष्टान्तात्मक छवि को बनाए रखने से निकटवर्ती संदर्भ अपनी व्याख्यात्मक भूमिका निभा सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य के क्रमिक ‘और’ यूनानी वर्णन की संचयी लय को बनाए रखते हैं; परिणाम को स्वाभाविक हिन्दी में स्पष्ट करने के लिए अंतिम खंड की शुरुआत ‘फिर भी’ से की गई है।
