id: MAT.7.2
reference: Matthew 7:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: hi
  text: क्योंकि जिस न्याय से तुम न्याय करते हो, उसी से तुम्हारा न्याय किया जाएगा; और जिस नाप से तुम नापते हो, उसी से तुम्हारे लिए नापा जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίματι
  choice: न्याय
  rationale: यहाँ संज्ञा न्याय या न्यायिक आकलन को व्यक्त करती है। ‘न्याय’ निकटवर्ती सजातीय क्रियाओं के साथ शब्दगत संबंध बनाए रखता है।
- source_word: κρίνετε
  choice: न्याय करते हो
  rationale: κρίνω का अर्थ न्याय करना, मूल्यांकन करना या दोषी ठहराना हो सकता है। सामान्य अर्थ चुनने से पाठ को केवल ‘दोषी ठहराने’ तक सीमित नहीं किया जाता।
- source_word: κριθήσεσθε
  choice: तुम्हारा न्याय किया जाएगा
  rationale: भविष्यत् कर्मवाच्य मूल क्रिया की पुनरावृत्ति और पारस्परिकता को सुरक्षित रखता है, जबकि न्याय करने वाले कर्ता को अनिर्दिष्ट छोड़ता है।
- source_word: μέτρῳ
  choice: नाप
  rationale: μέτρον यहाँ उस मानदंड या मात्रा का रूपक है जिसे दूसरों के प्रति लागू किया जाता है। ‘नाप’ सहज हिन्दी है और संबंधित क्रियाओं के साथ शब्दालंकार बनाए रखता है।
- source_word: μετρεῖτε
  choice: नापते हो
  rationale: संज्ञा ‘नाप’ और क्रिया ‘नापना’ की पुनरावृत्ति यूनानी पाठ के समानांतर और लोकोक्तिपरक प्रभाव को बनाए रखती है।
- source_word: μετρηθήσεται ὑμῖν
  choice: तुम्हारे लिए नापा जाएगा
  rationale: कर्मवाच्य और सम्प्रदान ὑμῖν को निकटता से व्यक्त करता है। यूनानी में ‘वापस’ स्पष्ट नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: जिस ... से ... उसी से
  rationale: दत्तिव के साथ यह रचना साधन अथवा मानदंड बताती है। हिन्दी का ‘जिस...से, उसी से’ दोनों खंडों की समानांतर और पारस्परिक संरचना स्वाभाविक रूप से व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले पद की मनाही का कारण प्रस्तुत करता है; ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पारस्परिक न्याय का स्वरूप
  choice: पद समान न्याय और नाप का पारस्परिक सिद्धांत व्यक्त करता है, पर कर्मवाच्य में न्याय करने वाले कर्ता को अनिर्दिष्ट रखता है।
  alternative: इसे स्पष्ट रूप से केवल परमेश्वर द्वारा किए जाने वाले न्याय या केवल मनुष्यों की प्रतिक्रिया के रूप में प्रस्तुत करना।
  rationale: यूनानी कर्मवाच्य क्रियाएँ कर्ता का नाम नहीं बतातीं। अनुवाद इस खुलेपन को बनाए रखता है और किसी एक धर्मवैचारिक व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध और निकट-स्रोत शैली। ‘न्याय करते हो/न्याय किया जाएगा’ तथा ‘नाप/नापते हो/नापा जाएगा’ की पुनरावृत्ति मूल पाठ के सजातीय शब्दों और समानांतरता को सुरक्षित रखती है।
