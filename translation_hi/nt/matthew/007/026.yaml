  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: hi
  text: और जो कोई मेरी ये बातें सुनता है और उनके अनुसार नहीं चलता, वह उस मूर्ख मनुष्य[a] के समान होगा, जिसने अपना घर रेत पर बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मूर्ख व्यक्ति।” यूनानी पाठ में “मूर्ख मनुष्य” है; तुलना में यह पुल्लिंग रूप प्रतिनिधि अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: जो कोई ... सुनता है
  rationale: वर्तमान कृदंत का प्रयोग सामान्य और सार्वभौमिक है। ‘जो कोई’ आधुनिक हिन्दी में सहज है और प्रत्येक सुनने वाले को समेटता है।
- source_word: μου τοὺς λόγους τούτους
  choice: मेरी ये बातें
  rationale: यह पदक्रम वक्ता से संबंध और संकेतवाचक बल दोनों बनाए रखता है। इस उपदेश के संदर्भ में λόγοι के लिए ‘बातें’ स्वाभाविक हिन्दी है।
- source_word: μὴ ποιῶν αὐτούς
  choice: उन पर नहीं चलता
  rationale: शाब्दिक ‘उन्हें नहीं करता’ हिन्दी में अस्वाभाविक है। ‘उन पर चलना’ सुनी हुई बातों को आचरण में लाने का भाव स्पष्ट करता और पिछले पद के समानांतर अर्थ को बनाए रखता है।
- source_word: ὁμοιωθήσεται
  choice: के समान ठहरेगा
  rationale: भविष्यकालीन निष्क्रिय तुलना को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है; यह केवल बाहरी समानता नहीं, दृष्टांत में दिए जाने वाले तुल्यांकन का भी संकेत देता है।
- source_word: ἀνδρὶ μωρῷ
  choice: मूर्ख मनुष्य
  rationale: ἀνήρ यहाँ पुल्लिंग एकवचन मनुष्य को तुलना के प्रतिनिधि पात्र के रूप में रखता है। ‘मूर्ख’ μωρός का सटीक और प्रचलित रूप है।
- source_word: ὅστις
  choice: जिसने
  rationale: संबंधवाचक सर्वनाम और भूतकालीन क्रिया को हिन्दी में स्वाभाविक रूप से एक साथ व्यक्त करता है।
- source_word: ᾠκοδόμησεν
  choice: बनाया
  rationale: घर के निर्माण के लिए ‘बनाया’ साधारण आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से पर्याप्त है।
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: अपना घर
  rationale: कर्ता की ओर लौटते स्वामित्व को हिन्दी में ‘अपना’ स्वाभाविक रूप से व्यक्त करता है; ‘घर’ भौतिक भवन की दृष्टांत-छवि बनाए रखता है।
- source_word: ἐπὶ τὴν ἄμμον
  choice: रेत पर
  rationale: निर्माण के आधार या स्थान को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
theological_decisions:
- issue: तुलना में पुल्लिंग प्रतिनिधि भाषा
  choice: मूर्ख मनुष्य
  alternative: मूर्ख व्यक्ति
  rationale: यूनानी ἀνδρί स्पष्ट रूप से पुल्लिंग एकवचन है, यद्यपि दृष्टांत का प्रयोग सामान्य रूप से हर सुनने वाले पर लागू होता है। मुख्य पाठ स्रोत की पुल्लिंग छवि रखता है और पादटिप्पणी उसके प्रतिनिधि प्रयोग को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उन पर नहीं चलता’ शाब्दिक संरचना के स्थान पर हिन्दी का स्वाभाविक आचरण-सूचक मुहावरा है। मुख्य पाठ में यूनानी की प्रतिनिधि पुल्लिंग तुलना सुरक्षित रखी गई है।
