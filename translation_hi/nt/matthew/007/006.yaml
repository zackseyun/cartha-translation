source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: hi
  text: जो पवित्र है, उसे कुत्तों को मत दो[a], और अपने मोती सूअरों के आगे मत फेंको[b], कहीं ऐसा न हो कि वे उन्हें अपने पैरों तले रौंदें और फिर पलटकर तुम्हें फाड़ डालें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र वस्तु’। यूनानी अभिव्यक्ति व्यापक है और सामान्यतः किसी समर्पित या पवित्र चीज़ की ओर संकेत कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: 'परंपरागत रूप में: ‘अपने मोती सूअरों के सामने मत डालो।’'
    reason: lexical_alternative
  - marker: c
    text: या ‘तुम्हें चीर डालें’ अथवा ‘तुम्हारे टुकड़े कर डालें।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: पवित्र वस्तु
  rationale: नपुंसकलिंग एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘पवित्र वस्तु’ इसके व्यापक और अनिर्दिष्ट संदर्भ को बनाए रखता है; पद स्वयं इसे शिक्षा, राज्य के संदेश या किसी अर्पित वस्तु तक सीमित नहीं करता।
- source_word: τοῖς κυσίν
  choice: कुत्तों को
  rationale: सीधा बहुवचन रूपक; मूल की तीखी सांस्कृतिक छवि को नरम किए बिना सुरक्षित रखता है।
- source_word: βάλητε
  choice: मत फेंको
  rationale: βάλλω का स्वाभाविक आधुनिक हिन्दी समतुल्य ‘फेंकना’ है; निषेध μηδὲ के साथ ‘मत’ रखा गया है।
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: अपने मोती
  rationale: ‘मोती’ मानक अर्थ है और ὑμῶν को स्वाभाविक हिन्दी में ‘अपने’ से व्यक्त किया गया है।
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: सूअरों के आगे
  rationale: मूल स्थान-संबंध और पशु-रूपक दोनों को स्पष्ट, आधुनिक हिन्दी में बनाए रखता है।
- source_word: μήποτε
  choice: कहीं ऐसा न हो कि
  rationale: यह नकारात्मक आशंका अथवा चेतावनी को स्वाभाविक हिन्दी में व्यक्त करता है और उद्देश्य तथा संभावित परिणाम के बीच मूल की गुंजाइश बनाए रखता है।
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: वे उन्हें अपने पैरों तले रौंदें
  rationale: ‘रौंदें’ καταπατέω की तीव्रता व्यक्त करता है; ‘अपने पैरों तले’ स्पष्ट यूनानी पदबंध को सुरक्षित रखता है। αὐτούς व्याकरणतः ‘मोती’ की ओर संकेत करता है, इसलिए ‘उन्हें’ रखा गया है।
- source_word: στραφέντες ῥήξωσιν ὑμᾶς
  choice: फिर पलटकर तुम्हें फाड़ डालें
  rationale: ‘पलटकर’ aorist participle की पहले मुड़ने और उसके बाद हमला करने की क्रमिकता दर्शाता है। ‘फाड़ डालें’ ῥήγνυμι की हिंसक छवि को बनाए रखता है, बिना अनावश्यक रूप से ‘टुकड़े-टुकड़े’ जोड़ने के।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: द्वितीय पुरुष बहुवचन कर्म को सामान्य आधुनिक हिन्दी में ‘तुम्हें’ से व्यक्त किया गया है; हिन्दी में यह रूप संख्या के विषय में मूल जैसी स्पष्टता नहीं देता, पर प्रसंगानुकूल और स्वाभाविक है।
theological_decisions:
- issue: ‘पवित्र वस्तु’, ‘कुत्ते’, ‘मोती’ और ‘सूअर’ रूपकों की व्याख्या
  choice: रूपकों को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों बनाए रखना।
  alternative: ‘पवित्र वस्तु’ या ‘मोती’ को स्पष्टतः पवित्र शिक्षा अथवा राज्य का संदेश, और ‘कुत्तों’ तथा ‘सूअरों’ को दुष्ट या सुसमाचार-विरोधी लोग बताना।
  rationale: पद स्वयं इन चित्रों का सटीक अर्थ निर्धारित नहीं करता। अनुवाद में उनका अर्थ खोल देने से पाठ की वास्तविक व्यापकता और धार्मिक तनाव अनावश्यक रूप से सीमित हो जाएगा।
- issue: μήποτε में उद्देश्य और संभावित परिणाम का संबंध
  choice: ‘कहीं ऐसा न हो कि’ द्वारा चेतावनी और आशंका दोनों को खुला रखना।
  alternative: इसे केवल उद्देश्य के रूप में ‘ताकि वे न...’ या केवल निश्चित परिणाम के रूप में ‘नहीं तो वे अवश्य...’ कहना।
  rationale: यूनानी μήποτε नकारात्मक उद्देश्य अथवा आशंकित परिणाम की छाया दे सकता है। चुनी हुई हिन्दी इस संबंध को जरूरत से अधिक निश्चित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी, संबोधन के लिए सहज ‘तुम’ रूप, और संक्षिप्त किंतु गरिमापूर्ण आज्ञार्थक शैली अपनाई गई है। मूल के तीखे पशु-रूपक सुरक्षित रखे गए हैं। ‘पवित्र वस्तु’ थोड़ा औपचारिक है, पर ‘पवित्र चीज़’ की अपेक्षा प्रकाशन-योग्य गरिमा देता है और अनिर्दिष्ट संदर्भ को बनाए रखता है।
