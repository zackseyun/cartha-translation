lexical_decisions:
- source_word: Μὴ κρίνετε
  choice: न्याय मत करो
  rationale: μή के साथ वर्तमान आज्ञार्थक क्रिया निषेध व्यक्त करती है। ‘न्याय मत करो’ आधुनिक हिन्दी में स्वाभाविक है और κρίνω के व्यापक अर्थ को बनाए रखता है।
- source_word: ἵνα μὴ
  choice: ताकि … न
  rationale: ἵνα के उद्देश्य/परिणाम-संबंध और उसके बाद के निषेध को ‘ताकि … न’ स्पष्ट तथा सहज रूप से व्यक्त करता है।
- source_word: κριθῆτε
  choice: तुम्हारा भी न्याय न किया जाए
  rationale: यह κρίνω का कर्मवाच्य रूप है। ‘न्याय’ की पुनरावृत्ति यूनानी पाठ का शाब्दिक और अलंकारिक संबंध बनाए रखती है; ‘भी’ हिन्दी में पारस्परिक परिणाम को सहज बनाता है, यद्यपि उसका अलग यूनानी शब्द नहीं है।
theological_decisions:
- issue: यीशु के निषेध में κρίνω का दायरा
  choice: मुख्य पाठ में व्यापक ‘न्याय करना’ रखा गया है।
  alternative: “दोषी मत ठहराओ, ताकि तुम्हें भी दोषी न ठहराया जाए।”
  rationale: इस पद में κρίνω स्वयं यह तय नहीं करता कि हर प्रकार का मूल्यांकन निषिद्ध है या विशेष रूप से दोषारोपण। व्यापक शब्द रखने से निकटवर्ती प्रसंग को निषेध की सीमा स्पष्ट करने दिया जाता है और किसी संकीर्ण व्याख्या को पाठ में नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘न्याय मत करो’ सामान्य पाठक के लिए बोधगम्य है और मूल पद की संतुलित पुनरावृत्ति सुरक्षित रखता है।
