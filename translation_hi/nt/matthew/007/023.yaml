source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: hi
  text: और तब मैं उनसे स्पष्ट रूप से कह दूँगा, ‘मैंने तुम्हें कभी नहीं जाना[a]। मुझसे दूर चले जाओ, तुम जो अधर्म करते हो[b]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘जानना’ केवल किसी के बारे में जानकारी रखने का नहीं, बल्कि संबंध में पहचानने या स्वीकार करने का भाव भी रख सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तुम जो व्यवस्था का उल्लंघन करते हो’ अथवा ‘तुम जो दुष्टता करते हो।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογήσω
  choice: स्पष्ट रूप से कह दूँगा
  rationale: यहाँ क्रिया सार्वजनिक और निर्णायक कथन का भाव रखती है। यह अनुवाद न्यायिक गंभीरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Οὐδέποτε
  choice: कभी नहीं
  rationale: यह मूल के पूर्ण और emphatic निषेध को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔγνων
  choice: जाना
  rationale: ‘जानना’ मूल की संबंधपरक पहचान सहित उसकी व्यापकता और धार्मिक तनाव को सुरक्षित रखता है; इसे ‘स्वीकार किया’ या ‘अपना माना’ कहकर अर्थ को सीमित नहीं किया गया।
- source_word: ἀποχωρεῖτε
  choice: चले जाओ
  rationale: यह निष्कासन की आज्ञा को स्पष्ट और गंभीर, परन्तु अनावश्यक रूप से पुरातन न लगने वाली हिन्दी में व्यक्त करता है।
- source_word: ἐργαζόμενοι
  choice: करते हो
  rationale: वर्तमान कृदंत यहाँ निरंतर या चरित्रगत आचरण बताता है; सापेक्ष वाक्य ‘तुम जो ... करते हो’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνομίαν
  choice: अधर्म
  rationale: ‘अधर्म’ दुष्टता के साथ व्यवस्था-विरोध और नैतिक अवज्ञा का भाव भी रखता है तथा आधुनिक धार्मिक हिन्दी में संक्षिप्त और बोधगम्य है।
- source_word: καὶ τότε
  choice: और तब
  rationale: यह पिछले संदर्भ से संबंध और घटनाक्रम की अगली अवस्था, दोनों को बनाए रखता है।
theological_decisions:
- issue: ‘मैंने तुम्हें कभी नहीं जाना’ का अर्थ
  choice: संबंधपरक और न्यायिक अर्थ की संभावना सहित ‘मैंने तुम्हें कभी नहीं जाना’ रखा गया।
  alternative: ‘मैंने तुम्हें कभी स्वीकार नहीं किया’ या ‘मैंने तुम्हें कभी अपना नहीं माना।’
  rationale: मूल पाठ सीधे ‘जानने’ की भाषा प्रयोग करता है। अधिक व्याख्यात्मक रूप किसी विशेष धर्मवैज्ञानिक निष्कर्ष को पाठ में जोड़ देता।
- issue: ἀνομία का नैतिक-वैधानिक बल
  choice: ‘अधर्म’
  alternative: ‘व्यवस्था-विरोध’, ‘दुष्टता’ या ‘व्यवस्था का उल्लंघन’
  rationale: ‘अधर्म’ हिन्दी में नैतिक बुराई और उचित/दैवी व्यवस्था के विरोध, दोनों को समेट सकता है। पादटिप्पणी अधिक शाब्दिक विकल्प स्पष्ट करती है, बिना मुख्य पाठ को बोझिल बनाए।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘स्पष्ट रूप से कह दूँगा’ सार्वजनिक घोषणा की गंभीरता व्यक्त करता है, जबकि ‘चले जाओ’ आज के पाठक के लिए स्वाभाविक है। ‘जानना’ मूल की जानबूझकर खुली संबंधपरक भाषा को सुरक्षित रखता है।
