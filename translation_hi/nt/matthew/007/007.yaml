id: MAT.7.7
reference: Matthew 7:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: hi
  text: माँगो[a], और तुम्हें दिया जाएगा; खोजो, और तुम पाओगे; खटखटाओ, और तुम्हारे लिए खोला जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वर्तमान आज्ञार्थकों को जारी रहने के भाव में भी समझा जा सकता है: “माँगते रहो… खोजते रहो… खटखटाते रहो।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: माँगो
  rationale: वर्तमान काल का सक्रिय आज्ञार्थक, बहुवचन। ‘माँगो’ स्वाभाविक हिंदी में आदेश का बल बनाए रखता है; जारी रहने का संभावित पक्ष पादटिप्पणी में दिया गया है।
- source_word: δοθήσεται
  choice: दिया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य को सुरक्षित रखता है और यूनानी पाठ की तरह देने वाले को अनकहा छोड़ता है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: दाता से प्राप्तकर्ता की ओर संबंध को संक्षिप्त और स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: ζητεῖτε
  choice: खोजो
  rationale: आज्ञार्थक बल और शाब्दिक तथा लाक्षणिक दोनों संभावनाओं को बनाए रखता है।
- source_word: εὑρήσετε
  choice: तुम पाओगे
  rationale: भविष्यकालीन सक्रिय कथन का स्वाभाविक हिंदी रूप; ‘खोजो—पाओगे’ की अर्थगत समानांतरता भी स्पष्ट रहती है।
- source_word: κρούετε
  choice: खटखटाओ
  rationale: दरवाज़े पर दस्तक देने के अर्थ का प्रचलित और सटीक हिंदी आज्ञार्थक रूप है।
- source_word: ἀνοιγήσεται
  choice: तुम्हारे लिए खोला जाएगा
  rationale: यूनानी कर्मवाच्य को सुरक्षित रखता है; ‘तुम्हारे लिए’ ὑμῖν के हित/संबंध को हिंदी में स्वाभाविक रूप से व्यक्त करता है और खोलने वाले को अनकहा छोड़ता है।
- source_word: καὶ
  choice: और
  rationale: तीनों खंडों में यूनानी समुच्चय और लयबद्ध समानांतरता को बनाए रखता है; ‘तो’ परिणाम का संबंध अधिक स्पष्ट कर देता।
theological_decisions:
- issue: तीनों वर्तमान आज्ञार्थकों का पक्ष
  choice: मुख्य पाठ में सरल आज्ञार्थक—‘माँगो’, ‘खोजो’, ‘खटखटाओ’—रखे गए हैं।
  alternative: ‘माँगते रहो… खोजते रहो… खटखटाते रहो।’
  rationale: यूनानी वर्तमान आज्ञार्थक जारी या बार-बार होने वाली क्रिया का संकेत दे सकते हैं, पर हर स्थान पर उसका विस्तार अनिवार्य नहीं है। मुख्य पाठ आदेश की संक्षिप्तता रखता है और संभावित निरंतरता पादटिप्पणी में बताता है।
- issue: कर्मवाच्य में निहित कर्ता
  choice: ‘दिया जाएगा’ और ‘खोला जाएगा’ में कर्ता अनकहा रखा गया है।
  alternative: ‘परमेश्वर तुम्हें देगा’ और ‘परमेश्वर तुम्हारे लिए खोलेगा।’
  rationale: संदर्भ में परमेश्वर निहित कर्ता समझे जा सकते हैं, पर यूनानी पाठ उनका नाम स्पष्ट रूप से नहीं लेता; अनुवाद उस अर्थ को बिना आवश्यकता स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘और’ की पुनरावृत्ति मूल की त्रिखंडी लय तथा समांतर रचना को बनाए रखती है। सर्वनाम बहुवचन है, जिसे हिंदी में संदर्भानुसार सामान्य संबोधन ‘तुम’ से व्यक्त किया गया है।
