id: MAT.7.14
reference: Matthew 7:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: hi
  text: क्योंकि द्वार संकरा है और जीवन की ओर ले जाने वाला मार्ग कठिन है, और उसे पाने वाले थोड़े हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενὴ
  choice: संकरा
  rationale: द्वार के सीमित और तंग होने का स्वाभाविक तथा सटीक हिन्दी वर्णन।
- source_word: τεθλιμμένη
  choice: कठिन
  rationale: यह कृदन्त मार्ग के दबे-सिकुड़े, कष्टकर या कठिन होने का भाव देता है; प्रसंग में सहज हिन्दी के लिए ‘कठिन’ चुना गया है, बिना कठिनाई के कारण को अधिक स्पष्ट किए।
- source_word: ἀπάγουσα
  choice: की ओर ले जाता है
  rationale: मार्ग के किसी गंतव्य तक पहुँचाने के अर्थ को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ζωήν
  choice: जीवन
  rationale: मूल के व्यापक और धर्मवैज्ञानिक रूप से अर्थपूर्ण शब्द को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: εὑρίσκοντες
  choice: पानेवाले
  rationale: द्वार/मार्ग को खोजकर पा लेने के भाव को संक्षिप्त, स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ‘जीवन’ का आशय
  choice: जीवन
  alternative: अनन्त जीवन
  rationale: मूल पाठ केवल ζωή कहता है; ‘अनन्त’ जोड़ना निहितार्थ की व्याख्या होगी, इसलिए मूल की संक्षिप्तता और अर्थगत विस्तार सुरक्षित रखा गया है।
- issue: τεθλιμμένη में कठिनाई या संकुचन
  choice: कठिन
  alternative: तंग / संकुचित
  rationale: शब्द में दबाव, क्लेश और संकुचन की अर्थछायाएँ हैं। यहाँ मार्ग के अनुभव को स्वाभाविक हिन्दी में ‘कठिन’ कहा गया है; किसी विशिष्ट धर्मवैज्ञानिक कारण को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ में सहज। समानांतर रचना ‘द्वार संकरा’ और ‘मार्ग कठिन’ को स्पष्ट रखती है।
