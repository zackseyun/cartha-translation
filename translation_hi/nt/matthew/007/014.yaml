- from: क्योंकि वह द्वार संकरा है और वह मार्ग कठिन है जो जीवन की ओर ले जाता है, और उसे पानेवाले थोड़े हैं।
  to: क्योंकि द्वार संकरा है और जीवन की ओर ले जाने वाला मार्ग कठिन है, और उसे पाने वाले थोड़े हैं।
  rationale: 'The revision makes only stylistic and lexical refinements: it removes nonessential demonstratives, places the destination phrase naturally with “मार्ग,” and standardizes “पाने वाले.” It preserves the source’s contrast, the broad term “जीवन,” the sense of a difficult way, and the ambiguity of what “उसे” specifically refers to.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:30:14Z'
review_pass:
  verdict: revise
  source_fidelity: Greek ὅτι is correctly represented by “क्योंकि”; στενή by “संकरा,” τεθλιμμένη by “कठिन,” and ἀπάγουσα εἰς τὴν ζωήν by “जीवन की ओर ले जाने वाला.” The final clause retains the deliberately unspecified feminine antecedent of αὐτήν (“it”), without adding an interpretive referent.
  naturalness: The draft is understandable, but repeated demonstratives (“वह द्वार… वह मार्ग”) are unnecessary in Hindi, and “उसे पानेवाले” is less idiomatic and slightly less precise for εὑρίσκοντες (“those finding”). Recasting the sentence improves flow while retaining its compact, elevated register.
  terminology: “द्वार,” “मार्ग,” and “जीवन” are appropriate modern-standard Hindi biblical terms. “कठिन” is a defensible natural rendering of τεθλιμμένη and agrees with the English audit trail’s “hard,” while not over-specifying the image as merely spatial constriction.
  issues:
  - severity: low
    issue: Unnecessary repeated demonstratives
    rationale: “वह द्वार” and “वह मार्ग” can sound overly deictic in Hindi where the Greek articles are not necessarily demonstrative. Omitting them is smoother and does not alter meaning.
  - severity: low
    issue: “पानेवाले” is less exact for εὑρίσκοντες
    rationale: The Greek means “those who find.” “पाने वाले” is acceptable but can suggest obtaining; standard spaced spelling and a clearer syntactic arrangement improve idiomatic readability without adding interpretation.
  revised_text: क्योंकि द्वार संकरा है और जीवन की ओर ले जाने वाला मार्ग कठिन है, और उसे पाने वाले थोड़े हैं।
