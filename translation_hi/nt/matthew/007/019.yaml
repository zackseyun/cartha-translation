  text: πᾶν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: hi
  text: हर वह पेड़ जो अच्छा फल नहीं देता, काटा जाता है और आग में फेंका जाता है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अच्छा फल उत्पन्न नहीं करता।’
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘आग’ न्याय का चित्र है; यह पद स्वयं अधिक स्पष्ट रूप से नहीं बताता कि ज़ोर वर्तमान समय के न्याय पर है, अंतकालीन न्याय पर, या दोनों पर।
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: हर वह पेड़
  rationale: एकवचन संज्ञा के साथ πᾶν का अर्थ वितरणात्मक है—प्रत्येक पेड़। ‘हर वह पेड़’ अगले विशेषणात्मक वाक्यांश से स्वाभाविक रूप से जुड़ता है और कथन की लोकोक्तिपूर्ण धार बनाए रखता है।
- source_word: μὴ ποιοῦν
  choice: जो ... नहीं देता
  rationale: वर्तमान कृदंत पेड़ की निरंतर या चारित्रिक क्रिया बताता है। फल के साथ ‘देता’ आधुनिक हिन्दी में स्वाभाविक है; यह भावार्थ में ‘उत्पन्न नहीं करता’ के बराबर है।
- source_word: καρπὸν καλὸν
  choice: अच्छा फल
  rationale: καλός यहाँ अच्छे, उत्तम या उपयुक्त फल का मूल्यांकन व्यक्त करता है। ‘अच्छा फल’ सरल, स्वाभाविक और संदर्भ के नैतिक अर्थ के लिए खुला है।
- source_word: ἐκκόπτεται
  choice: काट डाला जाता
  rationale: वर्तमान कर्मवाच्य रूप ऐसे पेड़ के साथ होने वाली कार्रवाई बताता है। पूरे पेड़ के संदर्भ में ‘काट डाला जाता’ स्वाभाविक है और उसे गिरा देने का भाव स्पष्ट करता है।
- source_word: εἰς πῦρ βάλλεται
  choice: आग में फेंक दिया जाता है
  rationale: कर्मवाच्य βάλλεται और दिशा बताने वाला εἰς आग के भीतर फेंके जाने को व्यक्त करते हैं। हिन्दी में ‘आग में’ बिना अनावश्यक निश्चितता जोड़े स्वाभाविक है।
theological_decisions:
- issue: आग के द्वारा न्याय का चित्र
  choice: पेड़ के काटे और आग में फेंके जाने के रूपक को बनाए रखा गया है, पर आग के ठीक-ठीक अभिप्राय को निर्धारित नहीं किया गया।
  alternative: इसे केवल सांसारिक न्याय, अंत-कालीन न्याय, या नरक के स्पष्ट उल्लेख के रूप में अनूदित करना।
  rationale: पद कृषि-आधारित चित्र के द्वारा न्याय की गंभीर चेतावनी देता है, पर स्वयं उसके समय और सटीक स्वरूप को परिभाषित नहीं करता। इसलिए अनुवाद उस धार्मिक तनाव और अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फल देता’ सामान्य पाठक के लिए ‘फल उत्पन्न करता’ से अधिक स्वाभाविक है, जबकि यूनानी क्रिया के आशय को ठीक प्रकार व्यक्त करता है। समानांतर कर्मवाच्य क्रियाओं से मूल वाक्य की चेतावनीपूर्ण लय बनी रहती है।
