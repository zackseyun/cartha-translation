id: MAT.7.10
reference: Matthew 7:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: hi
  text: या यदि वह मछली माँगे—तो क्या वह उसे साँप देगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: या यदि
  rationale: यह पिछले उदाहरण के साथ दूसरा वैकल्पिक उदाहरण जोड़ता है; हिन्दी में ‘या यदि’ स्वाभाविक है और καί का अनावश्यक शाब्दिक विस्तार नहीं करता।
- source_word: ἰχθὺν
  choice: मछली
  rationale: सामान्य खाद्य वस्तु के घरेलू संदर्भ में इसका सीधा और स्वाभाविक अर्थ ‘मछली’ है।
- source_word: αἰτήσει
  choice: माँगे
  rationale: भविष्यत् सूचक यूनानी रूप यहाँ सामान्य काल्पनिक परिस्थिति में प्रयुक्त है; हिन्दी में संभाव्य ‘माँगे’ स्वाभाविक रूप से वही अर्थ देता है।
- source_word: μὴ
  choice: तो क्या ... देगा?
  rationale: μή ऐसे प्रश्न को चिह्नित करता है जिसका अपेक्षित उत्तर ‘नहीं’ है; हिन्दी प्रश्न-विन्यास इस आलंकारिक बल को सहजता से व्यक्त करता है।
- source_word: ὄφιν
  choice: साँप
  rationale: आधुनिक सामान्य हिन्दी में जीव के लिए ‘साँप’ सर्वाधिक स्वाभाविक शब्द है; ‘सर्प’ अधिक साहित्यिक विकल्प है।
- source_word: ἐπιδώσει
  choice: देगा
  rationale: इस पिता-पुत्र उपमा में क्रिया का स्पष्ट प्रासंगिक अर्थ ‘देना’ है।
- source_word: αὐτῷ
  choice: उसे
  rationale: दत्तिव अप्रत्यक्ष कर्म को हिन्दी में स्वाभाविक रूप से ‘उसे’ व्यक्त करता है।
theological_decisions:
- issue: आलंकारिक प्रश्न का बल
  choice: ‘तो क्या वह उसे साँप देगा?’—ऐसा प्रश्न जिसका अपेक्षित उत्तर ‘नहीं’ है
  alternative: ‘वह उसे साँप नहीं देगा’ के रूप में साधारण कथन
  rationale: मूल के μή-युक्त प्रश्न को बनाए रखने से यीशु की दलील का आलंकारिक बल सुरक्षित रहता है और कथन में बदलकर उसे सपाट नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘साँप’ सामान्य आधुनिक हिन्दी है; ‘सर्प’ की अपेक्षा कम साहित्यिक और इस घरेलू उदाहरण में अधिक स्वाभाविक है। डैश मूल पाठ में उपस्थित तीखे आलंकारिक मोड़ को दर्शाता है।
