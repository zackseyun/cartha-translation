  edition: SBLGNT
  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: hi
  text: इसलिए[a] तुम उन्हें उनके फलों से पहचान लोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अतः निश्चय ही, उनके फलों से तुम उन्हें जान लोगे।”
    reason: ἄρα γε के निष्कर्षात्मक बल और हल्के जोर तथा ἐπιγνώσεσθε के अधिक शाब्दिक विकल्प को दर्शाने के लिए।
lexical_decisions:
- source_word: ἄρα γε
  choice: इसलिए
  rationale: यह पद पिछले कथन से निष्कर्ष निकालता है और उसमें हल्का बल भी है। आधुनिक हिन्दी में ‘इसलिए’ इस निष्कर्षात्मक संबंध को स्वाभाविक ढंग से व्यक्त करता है; वैकल्पिक अधिक शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: ἀπὸ
  choice: से
  rationale: यहाँ यह पहचान के आधार को दर्शाता है। ‘उनके फलों से’ हिन्दी में स्वाभाविक है और यूनानी संरचना के निकट भी रहता है।
- source_word: καρπῶν
  choice: फलों
  rationale: यूनानी शब्द बहुवचन में है। ‘फलों’ से मूल रूपक और निकटवर्ती संदर्भ के साथ उसका संबंध दोनों सुरक्षित रहते हैं।
- source_word: αὐτῶν
  choice: उनके
  rationale: संबंधवाचक सर्वनाम ‘फलों’ को विशेषित करता है और हिन्दी में स्वाभाविक रूप से ‘उनके’ है।
- source_word: ἐπιγνώσεσθε
  choice: पहचान लोगे
  rationale: भविष्यकालीन क्रिया यहाँ दिखाई देने वाले प्रमाण के आधार पर लोगों की असल पहचान जान लेने का भाव देती है। ‘पहचान लोगे’ साधारण ‘जानोगे’ की अपेक्षा इस संदर्भ को अधिक स्पष्टता से व्यक्त करता है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: यह सर्वनाम संदर्भ में पहले उल्लिखित लोगों की ओर लौटता है और हिन्दी में ‘उन्हें’ स्वाभाविक है।
theological_decisions:
- issue: लोगों को परखने के लिए ‘फलों’ का रूपक
  choice: मुख्य पाठ में ‘फलों’ का रूपक बनाए रखा गया।
  alternative: उनके कामों से; उनके परिणामों से
  rationale: पद दिखाई देने वाले परिणामों के आधार पर पहचान की बात करता है, पर मूल पाठ स्वयं ‘फल’ का रूपक इस्तेमाल करता है। इसे बनाए रखने से निकटवर्ती संदर्भ के साथ निरंतरता रहती है और किसी संकीर्ण व्याख्या को पाठ में नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, संक्षिप्त और गरिमापूर्ण है। भविष्यकाल के लिए बोलचाल में स्वाभाविक ‘पहचान लोगे’ रखा गया है, जबकि मूल रूपक और बहुवचन ‘फलों’ सुरक्षित हैं।
