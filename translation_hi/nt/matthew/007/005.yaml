id: MAT.7.5
reference: Matthew 7:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: hi
  text: कपटी! पहले अपनी आँख में से शहतीर[a] निकाल, तब तू अपने भाई की आँख से तिनका[b] निकालने के लिए साफ़-साफ़ देख सकेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लकड़ी की बड़ी बल्ली’ अथवा ‘धरन’।
    reason: lexical_alternative
  - marker: b
    text: या ‘किरच’ अथवा ‘सूखा छोटा कण’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: कपटी!
  rationale: यह पुल्लिंग एकवचन संबोधन है और सीधे, तीखे उलाहने का भाव रखता है। ‘कपटी!’ आधुनिक हिन्दी में इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔκβαλε
  choice: निकाल
  rationale: ἐκβάλλω का यह आज्ञार्थक रूप है। आँख में पड़ी वस्तु के रूपक में ‘निकाल’ स्वाभाविक और सटीक है।
- source_word: πρῶτον
  choice: पहले
  rationale: यह कार्यों के क्रम और प्राथमिकता को सीधे व्यक्त करता है।
- source_word: δοκόν
  choice: शहतीर
  rationale: δοκός भवन में प्रयुक्त लकड़ी की बड़ी धरन या बल्ली को दर्शाता है। ‘शहतीर’ छोटी वस्तु के साथ जानबूझकर किए गए अतिशयोक्तिपूर्ण विरोध को बनाए रखता है।
- source_word: ὀφθαλμοῦ
  choice: आँख
  rationale: शारीरिक रूपक में ὀφθαλμός का सामान्य और स्पष्ट हिन्दी रूप।
- source_word: διαβλέψεις
  choice: साफ़-साफ़ देख सकेगा
  rationale: διαβλέπω में स्पष्ट रूप से देखने का भाव है। ‘देख सकेगा’ आगे के कार्य को करने योग्य स्पष्ट दृष्टि का स्वाभाविक हिन्दी बोध देता है।
- source_word: ἐκβαλεῖν
  choice: निकालने के लिए
  rationale: यह पहले आए ἔκβαλε से संबंधित infinitive है; ‘निकाल’ की पुनरावृत्ति मूल की शब्दगत संगति बनाए रखती है।
- source_word: κάρφος
  choice: तिनका
  rationale: κάρφος किसी छोटे सूखे कण, तिनके या किरच को दर्शा सकता है। ‘तिनका’ सरल, ठोस और शहतीर के साथ तीखा आकार-विरोध प्रस्तुत करता है।
- source_word: ἀδελφοῦ
  choice: भाई की
  rationale: ग्रीक शब्द पुल्लिंग एकवचन है और इस प्रसंग में समुदाय के दूसरे सदस्य के लिए प्रयुक्त है। ‘भाई’ मूल के संबंधपरक और लिंगगत रूप को बनाए रखता है।
theological_decisions:
- issue: ἀδελφοῦ का लिंगयुक्त संबंधपरक अर्थ
  choice: भाई की
  alternative: दूसरे व्यक्ति की / पड़ोसी की
  rationale: मूल पाठ में पुल्लिंग एकवचन ‘भाई’ है। प्रसंग इसे लिंग-निरपेक्ष बनाने की माँग नहीं करता, इसलिए मूल रूप और समुदायगत संबंध दोनों सुरक्षित रखे गए हैं।
- issue: διαβλέψεις ἐκβαλεῖν में स्पष्ट दृष्टि और आगे की क्रिया का संबंध
  choice: निकालने के लिए साफ़-साफ़ देख सकेगा
  alternative: तब तू साफ़-साफ़ देखेगा और निकाल सकेगा
  rationale: ग्रीक infinitive को उद्देश्य/परिणाम से जुड़ा रहने दिया गया है और उसे अलग स्वतंत्र प्रतिज्ञा में नहीं बदला गया। इससे आत्म-सुधार के बाद दूसरे की सहायता करने की क्रमिकता बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। एकवचन ‘तू’ मूल के सीधे संबोधन और तीखे उलाहने को व्यक्त करता है; यह यहाँ अपमानसूचक बोलचाल नहीं, बल्कि भविष्यद्वक्ताओं जैसी सीधी फटकार के रूप में प्रयुक्त है। ‘शहतीर’ और ‘तिनका’ मूल के अतिशयोक्तिपूर्ण आकार-विरोध को सुरक्षित रखते हैं।
