reference: Matthew 18:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked servant[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: hi
  text: तब उसके स्वामी ने उसे अपने पास बुलाकर कहा, ‘दुष्ट दास[a], मैंने तेरा वह सारा ऋण माफ कर दिया था[b], क्योंकि तूने मुझसे विनती की थी।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘सेवक’ या ‘दास/गुलाम’ हो सकता है। यहाँ स्वामी के अधीन बंधित संबंध प्रमुख होने के कारण ‘दास’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तेरा वह सारा ऋण रद्द कर दिया था।’ यूनानी क्रिया ऋण छोड़ने या रद्द करने के साथ-साथ क्षमा करने का अर्थ भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कथा के घटनाक्रम में अगले चरण को स्वाभाविक रूप से जोड़ता है।
- source_word: προσκαλεσάμενος
  choice: उसे अपने पास बुलाकर
  rationale: मध्यवाच्य कृदंत किसी को अपने पास बुलाने का भाव देता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ὁ κύριος αὐτοῦ
  choice: उसके स्वामी
  rationale: यहाँ κύριος दास के स्वामी को दर्शाता है, न कि सीधे किसी ईश्वरीय उपाधि को।
- source_word: λέγει αὐτῷ
  choice: कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथा-शैली में सामान्य भूतकाल से व्यक्त किया गया है।
- source_word: Δοῦλε πονηρέ
  choice: दुष्ट दास
  rationale: πονηρός नैतिक निंदा प्रकट करता है और δοῦλος अधीन, बंधित सामाजिक स्थिति को; ‘दुष्ट दास’ संक्षिप्त और गंभीर है।
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: तेरा वह सारा ऋण
  rationale: यह पूर्ण ऋणराशि पर बल देता है; ‘वह सारा ऋण’ आधुनिक हिन्दी में सहज है।
- source_word: ἀφῆκά σοι
  choice: मैंने तेरा … ऋण माफ कर दिया था
  rationale: ‘माफ करना’ हिन्दी में ऋण रद्द करने और क्षमा करने, दोनों अर्थ-संबंधों को बनाए रखता है; ‘था’ पहले हो चुकी कार्रवाई को कथा-संदर्भ में स्पष्ट करता है।
- source_word: ἐπεὶ
  choice: क्योंकि
  rationale: यह स्वामी की कार्रवाई का कारण स्पष्ट रूप से प्रस्तुत करता है।
- source_word: παρεκάλεσάς με
  choice: तूने मुझसे विनती की थी
  rationale: यह गंभीर और आग्रहपूर्ण निवेदन का भाव देता है; स्वामी का ‘तू’ कहना सामाजिक असमानता और फटकार के प्रसंग में स्वाभाविक है।
theological_decisions:
- issue: δοῦλος का स्वामी-दास संबंध में अनुवाद
  choice: दास
  alternative: सेवक; गुलाम
  rationale: दृष्टांत में आर्थिक और कानूनी अधीनता महत्त्वपूर्ण है। ‘दास’ उस बंधित संबंध को ‘सेवक’ से अधिक स्पष्ट करता है, जबकि ‘गुलाम’ की अपेक्षा अधिक dignified बाइबलीय हिन्दी देता है; पादटिप्पणी वैकल्पिक अर्थ बताती है।
- issue: ऋण के प्रसंग में ἀφίημι का अनुवाद
  choice: माफ कर दिया
  alternative: रद्द कर दिया; छोड़ दिया; क्षमा कर दिया
  rationale: तात्कालिक अर्थ ऋण-मुक्ति है, पर यही क्रिया क्षमा के लिए भी प्रयुक्त होती है। ‘माफ कर दिया’ आर्थिक रूपक और क्षमा के नैतिक-धार्मिक संकेत, दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। स्वामी के संबोधन में ‘तेरा/तूने’ सामाजिक पदानुक्रम और कठोर फटकार को स्वाभाविक हिन्दी में व्यक्त करता है। ‘ऋण’ औपचारिक किन्तु सामान्यतः समझा जाने वाला शब्द है, और ‘माफ करना’ ऋण-मुक्ति तथा क्षमा के बीच मूल पाठ की अर्थगत परत को बनाए रखता है।
