id: MAT.18.20
reference: Matthew 18:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: hi
  text: क्योंकि जहाँ दो या तीन मेरे नाम पर इकट्ठे होते हैं, वहाँ मैं उनके बीच में हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनके बीच।’
    reason: ἐν μέσῳ αὐτῶν के लिए स्वाभाविक हिन्दी का वैकल्पिक अनुवाद; मुख्य पाठ में स्थानिक बिंब बना रहता है।
lexical_decisions:
- source_word: οὗ
  choice: जहाँ
  rationale: यह स्थानसूचक उपवाक्य आरम्भ करता है; ‘जहाँ’ यूनानी के दायरे को स्वाभाविक रूप से बनाए रखता है, जबकि ‘जहाँ कहीं’ कुछ अधिक व्यापक हो सकता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह कथन को पिछले प्रसंग से जोड़ने वाली व्याख्यात्मक कड़ी को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δύο ἢ τρεῖς
  choice: दो या तीन
  rationale: मूल की सीधी संख्यात्मक अभिव्यक्ति को यथावत रखता है।
- source_word: συνηγμένοι
  choice: इकट्ठे होते हैं
  rationale: पूर्ण निष्क्रिय कृदंत से व्यक्त एकत्र हुई अवस्था को सहज हिन्दी में प्रस्तुत करता है। ‘इकट्ठे किए गए हैं’ अत्यधिक यांत्रिक और प्रसंग में अस्वाभाविक होता।
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: मेरे नाम में
  rationale: मूल की असामान्य पर अर्थगर्भित रचना को निकटता से रखता है और यीशु के नाम के संदर्भ, अधिकार या निष्ठा में इकट्ठा होने का भाव खुला छोड़ता है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: ‘जहाँ…वहाँ’ की यूनानी सहसम्बन्धी संरचना को सुरक्षित रखता है।
- source_word: εἰμι
  choice: मैं … हूँ
  rationale: सरल वर्तमान काल और कथन की प्रत्यक्षता को बनाए रखता है; ‘उपस्थित रहता हूँ’ अनावश्यक व्याख्या जोड़ता।
- source_word: ἐν μέσῳ αὐτῶν
  choice: उनके बीच में
  rationale: स्थानिक बिंब को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘उनके मध्य’ अधिक औपचारिक और ‘उनके बीच’ समान अर्थ वाला संक्षिप्त विकल्प है।
theological_decisions:
- issue: इकट्ठे हुए शिष्यों के बीच यीशु की उपस्थिति का मसीह-संबंधी आशय
  choice: ‘वहाँ मैं उनके बीच में हूँ’ के रूप में सीधे कथन को रखा गया है।
  alternative: ‘वहाँ मैं उनके साथ उपस्थित हूँ’ या किसी विशिष्ट संस्कारात्मक अथवा कलीसियाई सिद्धान्त को स्पष्ट करने वाला अनुवाद।
  rationale: पद यीशु की उपस्थिति का दावा करता है, पर उसकी रीति या तत्त्वमीमांसीय स्वरूप को परिभाषित नहीं करता; इसलिए अनुवाद न तो दावे को कमजोर करता है, न बाद की साम्प्रदायिक व्याख्या जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘मेरे नाम में’ बाइबिलीय अभिव्यक्ति है, पर वर्तमान धार्मिक हिन्दी में समझने योग्य है।
