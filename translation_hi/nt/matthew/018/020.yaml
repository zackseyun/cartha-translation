  rationale: केवल ‘मेरे नाम में’ को अधिक स्वाभाविक और प्रचलित ‘मेरे नाम पर’ से बदला गया है। इससे मूल के अर्थ की खुली प्रकृति और यीशु की उपस्थिति का सीधा दावा सुरक्षित रहता है। अंग्रेज़ी audit trail के अनुरूप ‘उनके बीच’ का वैकल्पिक पाठ एक फुटनोट में जोड़ा गया है।
