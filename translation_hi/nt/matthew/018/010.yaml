id: MAT.18.10
reference: Matthew 18:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: hi
  text: सावधान रहो कि इन छोटों में से किसी को तुच्छ न समझो।[a] क्योंकि मैं तुमसे कहता हूँ कि स्वर्ग में उनके दूत[b] मेरे पिता का मुख निरंतर देखते हैं, जो स्वर्ग में हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन छोटों में से किसी को नीची दृष्टि से न देखो” अथवा “किसी का तिरस्कार न करो।”
    reason: lexical_alternative
  - marker: b
    text: “उनके दूत” से आशय इन छोटों से जुड़े या उनका प्रतिनिधित्व करने वाले दूत हो सकते हैं; केवल यह पद रक्षक-दूतों के पूरे सिद्धांत को निश्चित नहीं करता।
    reason: alternative_reading
  - marker: c
    text: यूनानी में दोनों स्थानों पर शाब्दिक रूप से “स्वर्गों में” है; हिन्दी मुहावरे के अनुसार “स्वर्ग में” किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: सावधान रहो कि
  rationale: वर्तमान आज्ञार्थक यहाँ सतर्क करने वाली चेतावनी आरम्भ करता है; यह हिन्दी में स्वाभाविक ढंग से उसका बल बनाए रखता है।
- source_word: μὴ καταφρονήσητε
  choice: तुच्छ न समझो
  rationale: καταφρονέω किसी को नगण्य मानने, नीची दृष्टि से देखने या उसका तिरस्कार करने का भाव रखता है। 'तुच्छ न समझो' इस संदर्भ में सहज और अर्थपूर्ण है।
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: इन छोटों में से किसी को
  rationale: यह यूनानी विभाजक संबंधवाचक रचना का स्वाभाविक हिन्दी रूप है। 'छोटों' से आयु अथवा विनम्र/कम प्रतिष्ठित स्थिति—दोनों की संभाव्यता बनी रहती है; इसे केवल बच्चों तक सीमित नहीं किया गया।
- source_word: λέγω γὰρ ὑμῖν
  choice: क्योंकि मैं तुमसे कहता हूँ
  rationale: γάρ पूर्व चेतावनी का कारण प्रस्तुत करता है और वाक्यांश यीशु की कथन-शैली को सीधे रूप में रखता है।
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: उनके दूत
  rationale: संबंधवाचक सर्वनाम को सीधे सुरक्षित रखा गया है, बिना यह निश्चित किए कि यहाँ प्रत्येक व्यक्ति के लिए नियुक्त निजी रक्षक-दूत का सिद्धांत सिखाया गया है।
- source_word: ἐν οὐρανοῖς
  choice: स्वर्ग में
  rationale: यूनानी बहुवचन का हिन्दी धार्मिक मुहावरे में स्वाभाविक समतुल्य एकवचन 'स्वर्ग' है।
- source_word: διὰ παντὸς
  choice: निरंतर
  rationale: मुहावरे का अर्थ हर समय अथवा लगातार है; 'निरंतर' वर्तमान क्रिया के साथ स्वाभाविक है।
- source_word: βλέπουσι τὸ πρόσωπον
  choice: मुख ... देखते हैं
  rationale: मूल की प्रत्यक्ष उपस्थिति और राजदरबारी पहुँच की बिंबात्मक भाषा सुरक्षित रहती है।
- source_word: τοῦ πατρός μου
  choice: मेरे ... पिता का
  rationale: यीशु का स्पष्ट संबंधसूचक 'मेरे' ज्यों का त्यों रखा गया है।
- source_word: τοῦ ἐν οὐρανοῖς
  choice: जो स्वर्ग में है
  rationale: यह विशेषणात्मक पद 'मेरे पिता' को विशेषित करता है; हिन्दी में संबंधवाचक उपवाक्य स्वाभाविक है।
theological_decisions:
- issue: '''उनके दूत'' का आशय'
  choice: '''उनके दूत'' को बिना किसी निश्चित दूत-सिद्धांत के ज्यों का त्यों रखना'
  alternative: इसे हर बच्चे या विश्वासी के लिए नियुक्त व्यक्तिगत रक्षक-दूतों का स्पष्ट उल्लेख मानना; अथवा सामान्यतः उनका प्रतिनिधित्व या उनकी सेवा करने वाले दूत मानना
  rationale: यूनानी पाठ संबंध को व्यक्त करता है, पर उस संबंध की पूरी प्रकृति स्पष्ट नहीं करता। इसलिए अनुवाद किसी एक दूत-विज्ञान संबंधी निष्कर्ष को आरोपित नहीं करता।
- issue: '''इन छोटों'' का संदर्भ'
  choice: ऐसी अभिव्यक्ति रखना जिसमें बच्चे और दीन/विनम्र विश्वासी दोनों की संभाव्यता बनी रहे
  alternative: इसे केवल छोटे बच्चों के अर्थ में अनुवाद करना
  rationale: निकटवर्ती प्रसंग में बच्चा उपस्थित है, पर मत्ती में 'छोटे' का प्रयोग विनम्र अथवा कम प्रतिष्ठित शिष्यों तक भी विस्तृत हो सकता है; अतः अनुवाद जानबूझकर व्यापक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। 'तुच्छ न समझो' सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी तिरस्कार/नीची दृष्टि के वैकल्पिक भाव स्पष्ट करती है। 'मुख देखते हैं' मूल बिंब को बनाए रखता है।
