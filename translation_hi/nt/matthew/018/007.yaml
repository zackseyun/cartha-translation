id: MAT.18.7
reference: Matthew 18:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: hi
  text: ठोकर खिलाने वाली बातों[a] के कारण संसार पर हाय! क्योंकि ठोकर खिलाने वाली बातों का आना आवश्यक है; परन्तु उस मनुष्य[b] पर हाय, जिसके द्वारा ठोकर खिलाने वाली बात आती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपराधों,’ ‘पाप में गिराने वाली बातों,’ अथवा ‘फंदों।’ यूनानी शब्द σκάνδαλον/σκάνδαλα ऐसी किसी बात को दर्शाता है जो किसी को ठोकर खिलाए—चाहे वह ठेस पहुँचाने वाली बात हो, प्रलोभन हो, या पाप का अवसर।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘मनुष्य’ व्याकरण की दृष्टि से पुल्लिंग एकवचन है; यहाँ यह ऐसे किसी भी व्यक्ति का प्रतिनिधित्व करता है जिसके द्वारा ठोकर खिलाने वाली बात आती है।
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  choice: हाय
  rationale: यह भविष्यद्वक्ताओं जैसी चेतावनी और न्याय की घोषणा का बल बनाए रखता है; दोनों उपवाक्यों में इसकी पुनरावृत्ति भी सुरक्षित है।
- source_word: κόσμῳ
  choice: संसार
  rationale: यहाँ शब्द व्यापक मानव-जगत की ओर संकेत करता है; ‘संसार’ इस दायरे को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἀπὸ
  choice: के कारण
  rationale: इस प्रसंग में यह कारण या स्रोत बताता है, इसलिए वर्तमान हिन्दी में ‘के कारण’ स्पष्ट और स्वाभाविक है।
- source_word: σκάνδαλα / σκάνδαλον
  choice: ठोकर खिलाने वाली बातें / ठोकर खिलाने वाली बात
  rationale: यह अभिव्यक्ति ठोकर के मूल रूपक को बनाए रखते हुए प्रलोभन, अपराध और पाप के अवसर जैसे व्यापक अर्थों के लिए स्थान छोड़ती है। यूनानी के बहुवचन और एकवचन का भेद भी रखा गया है।
- source_word: ἀνάγκη
  choice: आवश्यक है
  rationale: यह आवश्यकता या अनिवार्यता को व्यक्त करता है, पर उसके आधार को—दैवी आदेश, परिस्थितिगत अनिवार्यता या कुछ और—निर्धारित नहीं करता।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पहले कथन का कारण या स्पष्टीकरण प्रस्तुत करने वाले संबंध को सहज हिन्दी में दिखाता है।
- source_word: ἐλθεῖν ... ἔρχεται
  choice: आना ... आती है
  rationale: ‘आना’ यूनानी क्रिया की पुनरावृत्ति और उसके अपेक्षाकृत ठोस बिंब को बनाए रखता है।
- source_word: πλήν
  choice: फिर भी
  rationale: यह अनिवार्यता के कथन से व्यक्तिगत उत्तरदायित्व की चेतावनी की ओर प्रबल विरोधी मोड़ दिखाता है।
- source_word: ἀνθρώπῳ
  choice: उस मनुष्य
  rationale: यूनानी में पुल्लिंग एकवचन को मुख्य पाठ में सुरक्षित रखा गया है; इसका प्रतिनिधिक प्रयोग पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: δι’ οὗ
  choice: जिसके द्वारा
  rationale: यह उस व्यक्ति को माध्यम या अभिकर्ता के रूप में दर्शाता है जिसके द्वारा ठोकर का कारण आता है।
theological_decisions:
- issue: ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα में आवश्यकता का स्वरूप
  choice: ‘आना आवश्यक है’ कहकर आवश्यकता को बनाए रखा गया है, पर उसका कारण नहीं बताया गया।
  alternative: ‘इनका आना ही है’ व्यावहारिक अनिवार्यता पर अधिक बल दे सकता था, जबकि ‘इनका आना अवश्य ठहराया गया है’ दैवी निर्धारण का संकेत जोड़ सकता था।
  rationale: यूनानी पाठ आवश्यकता व्यक्त करता है, लेकिन यह नहीं बताता कि उसका आधार क्या है। अनुवाद उसी धर्मवैज्ञानिक तनाव को खुला रखता है।
- issue: ἀνθρώπῳ का प्रतिनिधिक बल
  choice: मुख्य पाठ में ‘उस मनुष्य’ रखा गया है और पाद-टिप्पणी में इसके सामान्य अनुप्रयोग को स्पष्ट किया गया है।
  alternative: ‘उस व्यक्ति’ या ‘जो कोई’ अधिक लिंग-निरपेक्ष होते, पर यूनानी के पुल्लिंग एकवचन रूप को कम स्पष्ट करते।
  rationale: स्रोत का व्याकरणिक रूप सुरक्षित रखते हुए यह स्पष्ट करना आवश्यक है कि चेतावनी किसी भी ऐसे व्यक्ति पर लागू होती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘ठोकर खिलाने वाली बात’ मूल रूपक को बचाती है, जबकि पाद-टिप्पणी उसके विस्तृत अर्थ-क्षेत्र को स्पष्ट करती है। वाक्य की दोहरी ‘हाय’ संरचना और एकवचन-बहुवचन का अंतर सुरक्षित रखा गया है।
