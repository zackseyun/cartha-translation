  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। 'इन छोटों' मूल की व्यापकता बनाए रखता है, और 'गधे से चलाया जानेवाला चक्की का पाट' प्राचीन सांस्कृतिक वस्तु को सामान्य पाठक के लिए स्पष्ट करता है।
