  choice: खुले समुद्र में
  rationale: πέλαγος तट से दूर समुद्र के खुले विस्तार को सूचित करता है; इसे केवल 'समुद्र की गहराई' तक सीमित नहीं किया गया।
theological_decisions:
- issue: '''इन छोटों'' का दायरा'
  choice: 'वाक्य को व्यापक रखा गया है: ''मुझ पर विश्वास करनेवाले इन छोटों''।'
  alternative: मुझ पर विश्वास करनेवाले इन छोटे बच्चों
  rationale: निकट संदर्भ में बच्चा एक जीवंत उदाहरण है, पर 'मुझ पर विश्वास करनेवाले' यह विशेषण दीनता और असुरक्षा से पहचाने जानेवाले शिष्यों की ओर भी संकेत कर सकता है। अनुवाद इस तनाव को किसी एक सीमित अर्थ में नहीं बाँधता।
