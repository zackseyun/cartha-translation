  choice: इन छोटों
  rationale: यह पद केवल आयु में छोटे बच्चों तक सीमित नहीं किया गया; संदर्भ में यह दीन, कम महत्त्वपूर्ण समझे जानेवाले या असुरक्षित विश्वासियों को भी सूचित कर सकता है।
- source_word: τῶν πιστευόντων εἰς ἐμέ
