  rationale: व्यक्तिवाचक कर्म के साथ πιστεύω εἰς का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: συμφέρει αὐτῷ
  choice: उसके लिए यह अच्छा होता
  rationale: चेतावनी के इस संदर्भ में यह तुलना के रूप में उसके लिए अधिक हितकर या बेहतर होने का भाव व्यक्त करता है।
- source_word: μύλος ὀνικὸς
  choice: गधे से चलाया जानेवाला चक्की का पाट
  rationale: ὀνικός गधे से चलनेवाले बड़े चक्की-पाट को हाथ की छोटी चक्की से अलग करता है; यह रूप सांस्कृतिक चित्र को स्पष्ट रखता है।
