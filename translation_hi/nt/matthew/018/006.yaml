source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: hi
  text: पर जो कोई मुझ पर विश्वास करने वाले इन छोटों में से किसी एक के ठोकर खाने का कारण बने[a], उसके लिए अच्छा होता कि गधे से चलाया जाने वाला चक्की-पाट[b] उसके गले में लटकाया जाता और उसे खुले समुद्र में डुबो दिया जाता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे पाप में गिराता है।” यूनानी क्रिया का अर्थ किसी के ठोकर खाने, पाप में गिरने, या विश्वास से दूर हो जाने का कारण बनना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “गधे का चक्की-पाट,” अर्थात हाथ से चलाई जाने वाली छोटी चक्की के बजाय गधे से चलाया जाने वाला बड़ा चक्की-पाट।
    reason: cultural_note
  - marker: c
    text: या “समुद्र के गहरे विस्तार में।” यूनानी पद विशेष रूप से तट से दूर खुले समुद्र को सूचित करता है।
    reason: lexical_alternative
