  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: hi
  text: और उसके स्वामी ने क्रोधित होकर उसे यातना देने वालों के हवाले कर दिया, जब तक कि वह सारा बकाया चुका न दे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रभु”; यूनानी शब्द क्यूरियोस है। यहाँ दृष्टान्त में यह सेवक के स्वामी के लिए प्रयुक्त हुआ है, इसलिए मुख्य पाठ में “स्वामी” रखा गया है।
    reason: alternative_reading
  - marker: b
    text: या “यातना पहुँचाने वालों”; अपेक्षाकृत हल्के अर्थ में “कारागार-अधिकारियों।” यूनानी शब्द केवल साधारण पहरेदारों के बजाय यातना देने वालों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: क्रोधित होकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया की भावात्मक और सम्भवतः कारणात्मक परिस्थिति बताता है; ‘क्रोधित होकर’ हिन्दी में स्वाभाविक और निकट है।
- source_word: κύριος
  choice: स्वामी
  rationale: दृष्टान्त में यह दास के मानवीय अधिकारी को सूचित करता है। ‘स्वामी’ कथा-संबंध को स्पष्ट रखता है और यहाँ अनावश्यक रूप से ईश्वरीय उपाधि आरोपित नहीं करता।
- source_word: παρέδωκεν
  choice: हवाले कर दिया
  rationale: यह किसी को दूसरे के अधिकार या नियंत्रण में सौंपने का न्यायिक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βασανισταῖς
  choice: यातना देनेवालों
  rationale: यह शब्द केवल साधारण पहरेदारों के बजाय यातना देनेवालों को सूचित करता है; चुना हुआ रूप मूल की कठोरता बनाए रखता है।
- source_word: ἕως οὗ
  choice: जब तक कि
  rationale: यह अपेक्षित समय-सीमा या अंतिम बिंदु को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀποδῷ
  choice: चुका न दे
  rationale: सुब्जंक्टिव के भावी, अपेक्षित अंतिम बिंदु को ‘जब तक कि ... न दे’ की हिन्दी संरचना ठीक ढंग से व्यक्त करती है।
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: अपना पूरा बकाया
  rationale: यह देय पूरी राशि का अर्थ संक्षिप्त और सहज रूप से देता है; ‘अपना’ उस व्यक्ति पर बकाया होने का संबंध स्पष्ट करता है, बिना राशि या ऋण की प्रकृति को और सीमित किए।
theological_decisions:
- issue: क्या κύριος को धार्मिक उपाधि ‘प्रभु’ के रूप में अनूदित किया जाए
  choice: स्वामी
  alternative: प्रभु
  rationale: तत्काल कथा-संदर्भ में यह सेवक के मानवीय स्वामी के लिए है। ‘स्वामी’ दृष्टान्त के कथा-स्तर को सुरक्षित रखता है, जबकि उसके व्यापक धार्मिक संकेतों को न तो नकारता है न मुख्य पाठ में पहले से निर्धारित करता है।
- issue: न्याय-संदर्भ में βασανισταῖς की कठोरता
  choice: यातना देनेवाले
  alternative: यातना पहुँचानेवाले; कारागार के पहरेदार
  rationale: मूल शब्द यातना देने की धारणा रखता है, इसलिए केवल ‘पहरेदार’ कहना अर्थ को नरम कर देगा। यह चयन दण्ड की व्यापक धर्मवैज्ञानिक प्रकृति को अतिरिक्त रूप से परिभाषित किए बिना पद की चेतावनी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। ‘हवाले कर दिया’ न्यायिक नियंत्रण में सौंपने का स्वाभाविक मुहावरा है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
