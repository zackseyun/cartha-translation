source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: hi
  text: पर वह राज़ी नहीं था[a]; बल्कि वह चला गया और उसने उसे जेल में फेंक दिया[b], जब तक कि वह बकाया[c] न चुका दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसने इनकार कर दिया’; यूनानी में शाब्दिक अर्थ ‘वह इच्छुक नहीं था’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसे जेल में डाल दिया’; यूनानी क्रिया अधिक कठोर है और उसका शाब्दिक अर्थ ‘उसे जेल में फेंक दिया’ है।
    reason: lexical_alternative
  - marker: c
    text: या ‘जो देय था’ अथवा ‘कर्ज़’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: पर वह
  rationale: δέ के विरोधसूचक भाव को ‘पर’ व्यक्त करता है, और substantival article से पहले दास की ओर संकेत करने के लिए हिन्दी में स्वाभाविक सर्वनाम ‘वह’ रखा गया है।
- source_word: οὐκ ἤθελεν
  choice: तैयार नहीं हुआ
  rationale: θέλω की इच्छा अथवा तत्परता का भाव बना रहता है; यह ‘साफ़ इनकार कर दिया’ की अपेक्षा कम व्याख्यात्मक और आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पहले बताए गए अनिच्छुक उत्तर और उसके विपरीत किए गए कठोर कार्य के बीच प्रबल विरोध को व्यक्त करता है।
- source_word: ἀπελθὼν
  choice: वहाँ से जाकर
  rationale: Aorist participle को हिन्दी के पूर्वकालिक कृदन्त से स्वाभाविक रूप में व्यक्त किया गया है और क्रियाओं का क्रम सुरक्षित रहता है। ‘वहाँ से’ प्रस्थान के निहित भाव को स्पष्ट करता है, कोई नया स्थान निर्दिष्ट नहीं करता।
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: उसने उसे जेल में फेंक दिया
  rationale: βάλλω की कठोरता को तटस्थ ‘डाल दिया’ की बजाय ‘फेंक दिया’ से बनाए रखा गया है; प्रसंग में इसका अर्थ जबरन जेल में बंद कराना है।
- source_word: ἕως οὗ
  choice: जब तक कि
  rationale: यह कैद की समय-सीमा बताने वाले यूनानी संयोजक का स्वाभाविक हिन्दी रूप है।
- source_word: ἀποδῷ
  choice: चुका दे
  rationale: ἕως οὗ के बाद subjunctive प्रत्याशित पूर्ण भुगतान को दर्शाता है; ‘न चुका दे’ वाली हिन्दी संरचना इसी भविष्याभिमुख सीमा को स्वाभाविक रूप से व्यक्त करती है।
- source_word: τὸ ὀφειλόμενον
  choice: बकाया
  rationale: Substantival participle का अर्थ ‘जो देय था’ है। ‘बकाया’ संक्षिप्त, सटीक और सामान्य आधुनिक हिन्दी में सहज है, जबकि केवल ‘कर्ज़’ कहना अभिव्यक्ति को कुछ अधिक विशिष्ट बना देता।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप रखा गया है। ‘जेल’ आम पाठक के लिए ‘कारागार’ से अधिक स्वाभाविक है। वाक्य में मूल पाठ का विरोध, क्रियाओं का क्रम और कठोरता सुरक्षित रखी गई है; ‘न चुका दे’ हिन्दी में ‘जब तक’ के साथ स्वाभाविक है और निषेध का स्वतंत्र कथन नहीं है।
