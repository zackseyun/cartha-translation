- from: पर वह तैयार नहीं हुआ[a]; बल्कि वहाँ से जाकर उसने उसे जेल में फेंक दिया[b], जब तक कि वह बकाया न चुका दे[c]।
  to: पर वह राज़ी नहीं था[a]; बल्कि वह चला गया और उसने उसे जेल में फेंक दिया[b], जब तक कि वह बकाया[c] न चुका दे।
