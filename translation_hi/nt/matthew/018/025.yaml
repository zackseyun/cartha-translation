reference: Matthew 18:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: hi
  text: परन्तु उसके पास चुकाने के लिए कुछ न था, इसलिए मालिक[a] ने आदेश दिया कि उसे, उसकी पत्नी और बच्चों को, और उसकी सारी संपत्ति को बेच दिया जाए[b] और भुगतान किया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वामी’। यहाँ यूनानी κύριος से अभिप्राय दृष्टान्त में सेवक के मानवीय अधिकारी से है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात उसे और उसके परिवार को बेचकर तथा उसकी संपत्ति बेचकर भुगतान किया जाना था।
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: परन्तु उसके पास चुकाने के लिए कुछ न था
  rationale: यह संबंधवाचक स्वतंत्र रचना उस परिस्थिति अथवा कारण को व्यक्त करती है कि देनदार के पास ऋण चुकाने के साधन नहीं थे। यह हिन्दी में स्वाभाविक है और केवल असमर्थता कहने के बजाय ἔχω के ‘पास होना’ भाव को बनाए रखती है।
- source_word: ἐκέλευσεν
  choice: आदेश दिया
  rationale: κελεύω अधिकारपूर्वक आदेश देने को दर्शाता है; ‘आदेश दिया’ आधुनिक और गरिमापूर्ण हिन्दी है।
- source_word: ὁ κύριος
  choice: मालिक
  rationale: दृष्टान्त में यह सेवक के मानवीय स्वामी के लिए प्रयुक्त है। ‘मालिक’ प्रसंग में स्वाभाविक है और इसे प्रत्यक्ष ईश्वरीय उपाधि समझे जाने से बचाता है।
- source_word: πραθῆναι
  choice: बेच दिया जाए
  rationale: यह πιπράσκω का कर्मवाच्य अनन्तरूप है और ऋण के कारण व्यक्ति को बेचे जाने का अर्थ स्पष्ट करता है।
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: उसकी पत्नी और बच्चों को
  rationale: यूनानी में निश्चित उपपद हैं, पर हिन्दी में संबंध स्पष्ट करने के लिए ‘उसकी’ स्वाभाविक है।
- source_word: πάντα ὅσα ἔχει
  choice: जो कुछ उसका था, वह सब
  rationale: यह उसकी समस्त संपत्ति को समेटता है और मूल की व्यापकता को बनाए रखता है।
- source_word: καὶ ἀποδοθῆναι
  choice: और रकम चुका दी जाए
  rationale: ἀποδίδωμι ऋण की अदायगी के प्रसंग में है। ‘रकम’ निहित भुगतान को स्वाभाविक हिन्दी में व्यक्त करती है, बिना यह दावा किए कि बिक्री से पूरा विशाल ऋण अवश्य चुक जाता।
theological_decisions:
- issue: दृष्टान्त में κύριος का अनुवाद
  choice: मालिक
  alternative: स्वामी
  rationale: यहाँ κύριος कथा के भीतर सेवक के मानवीय अधिकारी को सूचित करता है। ‘मालिक’ उस सामाजिक संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है; ‘स्वामी’ भी संभव है, पर उसमें धार्मिक उपाधि की ध्वनि अधिक आ सकती है।
- issue: बिक्री से भुगतान का परिणाम
  choice: रकम चुका दी जाए
  alternative: ऋण चुका दिया जाए
  rationale: मूल में अंतिम ἀποδοθῆναι का कर्म स्पष्ट नहीं किया गया। इसलिए ‘ऋण’ जोड़कर पूर्ण भुगतान का दावा करने के बजाय अधिक खुला ‘रकम’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। वाक्य मूल के कारणात्मक प्रवाह, बिक्री की कठोरता और अंतिम कर्मवाच्य भुगतान को बनाए रखता है।
