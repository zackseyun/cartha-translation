  verdict: revise
  source_fidelity: The draft accurately represents the causal genitive absolute, the master's authoritative order, the sale of the debtor, his wife, children, and all he possessed, and the final passive expression for repayment. Rendering κύριος as “मालिक” is contextually appropriate for the human superior in the parable.
  naturalness: The wording is generally modern and clear. However, “उसे, उसकी पत्नी और बच्चों को तथा जो कुछ उसका था, वह सब बेच दिया जाए” is syntactically heavy and momentarily unclear in Hindi. Explicitly coordinating “उसकी सारी संपत्ति” makes the ordered items clear and natural.
  terminology: “मालिक,” “आदेश दिया,” and “चुकाने” fit the narrative register. “भुगतान किया जाए” preserves the Greek passive without unnecessarily specifying that the entire debt was repaid.
  issues:
  - severity: low
    issue: The sale list is awkwardly constructed in Hindi.
    rationale: The relative expression “जो कुछ उसका था, वह सब” placed within the coordinated object list creates an avoidable syntactic snag. “उसकी सारी संपत्ति” communicates πάντα ὅσα ἔχει clearly in idiomatic modern Hindi.
