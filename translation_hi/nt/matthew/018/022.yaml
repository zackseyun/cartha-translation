  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: hi
  text: यीशु उससे कहते हैं, “मैं तुमसे नहीं कहता कि सात बार तक ही, बल्कि सत्तर गुना सात बार तक[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सतहत्तर बार तक।”
    reason: यूनानी वाक्यांश ἑβδομηκοντάκις ἑπτά का अर्थ ‘सत्तर गुना सात’ या ‘सतहत्तर’—दोनों प्रकार से समझा गया है।
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: यीशु उससे कहते हैं
  rationale: यूनानी के कथात्मक वर्तमान काल को बनाए रखा गया है। ‘उससे’ αὐτῷ के सर्वनामिक रूप को सुरक्षित रखता है; संदर्भ से उसका आशय पतरस है। यीशु के लिए आदरसूचक बहुवचन आधुनिक मानक हिन्दी में स्वाभाविक है।
- source_word: Οὐ λέγω σοι
  choice: मैं तुमसे यह नहीं कहता
  rationale: यह वर्तमान काल और प्रत्यक्ष संबोधन को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है। ‘यह’ आगे आने वाली सीमा-सूचक बात से वाक्य को सहजता से जोड़ता है।
- source_word: ἕως ἑπτάκις
  choice: सात बार तक
  rationale: गिनती के इस प्रसंग में ἕως सीमा और ἑπτάκις आवृत्ति प्रकट करता है; इसलिए ‘सात बार तक’ सीधा और सहज अनुवाद है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पहले बताए गए विकल्प का प्रबल सुधार या विस्तार व्यक्त करता है और हिन्दी में इस विरोध को स्वाभाविक ढंग से रखता है।
- source_word: ἕως ἑβδομηκοντάκις ἑπτά
  choice: सत्तर गुना सात बार तक
  rationale: यह यूनानी पदसमूह को ‘सत्तर बार सात’ अर्थात 70×7 के रूप में पढ़ता है और हिन्दी में गणितीय संबंध स्पष्ट करता है। पदसमूह की दूसरी प्राचीन और व्यापक समझ ‘सतहत्तर बार’ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: क्षमा की संख्या बताने वाले ἑβδομηκοντάκις ἑπτά की अस्पष्टता
  choice: सत्तर गुना सात बार
  alternative: सतहत्तर बार
  rationale: यूनानी वाक्यांश का रूप 70×7 पढ़े जाने की अनुमति देता है, जबकि उत्पत्ति 4:24 की यूनानी अभिव्यक्ति से संबंध के कारण इसे 77 भी समझा गया है। मुख्य पाठ एक अर्थ चुनता है, पर पादटिप्पणी वास्तविक पाठगत-व्याख्यात्मक अस्पष्टता को सुरक्षित रखती है; पद में निहित संख्या से आगे बढ़कर क्षमा की कोई निश्चित धर्मवैज्ञानिक सीमा निर्धारित नहीं की गई है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और बोलचाल में समझ आने योग्य रखी गई है। कथात्मक वर्तमान को सुरक्षित रखा गया है और संख्या-संबंधी वास्तविक अस्पष्टता को पादटिप्पणी में स्पष्ट किया गया है।
