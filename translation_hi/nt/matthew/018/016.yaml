  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: hi
  text: लेकिन यदि वह तुम्हारी न सुने, तो एक या दो और लोगों को अपने साथ ले जाओ, ताकि “दो या तीन गवाहों के मुँह से हर बात प्रमाणित हो जाए।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'व्यवस्थाविवरण 19:15 का संकेत। अधिक भावार्थपूर्ण अनुवाद: “दो या तीन गवाहों की गवाही से हर बात प्रमाणित हो जाए।”'
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: ἀκούσῃ
  choice: तुम्हारी न सुने
  rationale: संदर्भ में क्रिया का अर्थ केवल ध्वनि सुनना नहीं, बल्कि बात पर ध्यान देकर उसे मानना है। ‘तुम्हारी न सुने’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: παράλαβε μετὰ σοῦ
  choice: अपने साथ ले जाओ
  rationale: आज्ञार्थक क्रिया और संगति सूचक पद को मिलाकर ठोस निर्देश स्पष्ट किया गया है।
- source_word: ἔτι ἕνα ἢ δύο
  choice: एक या दो और लोगों को
  rationale: ἔτι अतिरिक्त व्यक्तियों का भाव देता है; ‘लोगों’ का प्रयोग हिन्दी में कर्म को स्पष्ट करता है, यद्यपि यूनानी में संज्ञा निहित है।
- source_word: ἐπὶ στόματος
  choice: के मुँह से
  rationale: व्यवस्थाविवरण 19:15 की सामी कानूनी अभिव्यक्ति को बनाए रखा गया है; हिन्दी में यह समझने योग्य है और गवाही के माध्यम को दर्शाती है।
- source_word: μαρτύρων
  choice: गवाहों
  rationale: कानूनी और सामुदायिक पुष्टि के संदर्भ में यह प्रचलित तथा सटीक हिन्दी शब्द है।
- source_word: σταθῇ
  choice: प्रमाणित हो जाए
  rationale: कानूनी संदर्भ में निष्क्रिय क्रिया का आशय किसी बात का ठहराया, पुष्ट या स्थापित किया जाना है। ‘प्रमाणित’ इस कार्य को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πᾶν ῥῆμα
  choice: हर बात
  rationale: शाब्दिक ‘हर वचन’ की अपेक्षा यहाँ विचाराधीन कथन या मामले का अर्थ प्रमुख है। ‘हर बात’ मूल की व्यापकता को बनाए रखती है और इसे केवल ‘आरोप’ तक सीमित नहीं करती।
theological_decisions:
- issue: पुराने नियम की कानूनी गवाह-सूत्र का सामुदायिक अनुशासन में प्रयोग
  choice: “दो या तीन गवाहों के मुँह से हर बात प्रमाणित हो जाए”
  alternative: “दो या तीन गवाहों की गवाही से हर मामला सिद्ध हो जाए”
  rationale: चुना हुआ पाठ व्यवस्थाविवरण 19:15 के संकेत और ‘मुँह से’ वाली बाइबलीय अभिव्यक्ति को बनाए रखता है, साथ ही σταθῇ का कानूनी पुष्टि-भाव स्पष्ट करता है। ‘हर बात’ मूल की अस्पष्ट व्यापकता बचाती है और अर्थ को केवल आरोप या मुकदमे तक सीमित नहीं करती।
