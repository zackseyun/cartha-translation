source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow servant fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: hi
  text: तब उसका साथी दास गिर पड़ा और उससे विनती करने लगा, ‘मेरे साथ धीरज रख, और मैं तेरा कर्ज़ चुका दूँगा।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν
  choice: गिर पड़ा
  rationale: यह विनती करते समय भूमि पर गिरने की शारीरिक मुद्रा को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले परिणाम और कथा की अगली घटना, दोनों को जोड़ता है।
- source_word: σύνδουλος
  choice: साथी दास
  rationale: σύνδουλος उसी स्वामी के अधीन रहने वाले सह-दास को दर्शाता है। ‘साथी दास’ बंधी हुई सामाजिक स्थिति और साझा स्वामी—दोनों भावों को बनाए रखता है।
- source_word: παρεκάλει
  choice: विनती करने लगा
  rationale: अपूर्ण भूतकाल निरंतर या बार-बार की जा रही earnest appeal को दर्शाता है; यह हिन्दी में उस जारी विनती को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: मेरे साथ धीरज रख
  rationale: यह व्यक्ति के प्रति समय देने और सहनशील बने रहने की प्रार्थना को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: ἀποδώσω
  choice: चुका दूँगा
  rationale: ऋण के प्रसंग में यह बकाया राशि लौटाने का स्पष्ट और स्वाभाविक हिन्दी प्रयोग है।
theological_decisions:
- issue: σύνδουλος में दासता-संबंधी भाषा
  choice: मुख्य पाठ में ‘साथी दास’
  alternative: ‘साथी सेवक’ या ‘सह-दास’
  rationale: दृष्टान्त में राजा, ऋण और अधीनस्थों का संबंध प्रमुख है। ‘दास’ मूल शब्द की बंधी हुई सामाजिक स्थिति को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रखता है, जबकि ‘साथी’ साझा स्वामी के अधीन समान स्थिति का भाव देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन में प्रसंगानुकूल एकवचन अनौपचारिक संबोधन ‘तू’ के रूप ‘रख’ और ‘तुझे’ प्रयुक्त हैं, जो दासों के बीच मूल पाठ के एकवचन संबोधन को स्वाभाविक रूप से दर्शाते हैं।
