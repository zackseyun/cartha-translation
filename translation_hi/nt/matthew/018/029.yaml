review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents σύνδουλος as “साथी दास,” preserves the supplicatory act and the ongoing force of παρεκάλει, and renders the request for patience faithfully. However, “इसलिए” can imply a stronger logical conclusion than οὖν bears in this narrative transition, and “मैं तुझे चुका दूँगा” is not idiomatic Hindi for repaying a debt.
  naturalness: “तब” is a more natural narrative connector here. Explicitly naming the debt makes the final clause idiomatic and clear in modern Hindi while retaining the debt-contextual sense of ἀποδώσω σοι.
  terminology: “साथी दास” appropriately retains the shared-master and enslaved-status sense of σύνδουλος. “धीरज रख” is suitable modern Hindi in the direct, singular address of the parable.
  issues:
  - severity: low
    issue: Narrative connector “इसलिए” is overly inferential.
    rationale: οὖν may introduce a result, but in this context it principally advances the narrative; “तब” avoids overstating a logical consequence.
  - severity: medium
    issue: “मैं तुझे चुका दूँगा” is not a natural way to express repayment in Hindi.
    rationale: The verb चुकाना normally takes the debt or obligation as its object. “मैं तेरा कर्ज़ चुका दूँगा” clearly and naturally conveys repayment in the established debt context.
  revised_text: तब उसका साथी दास गिर पड़ा और उससे विनती करने लगा, ‘मेरे साथ धीरज रख, और मैं तेरा कर्ज़ चुका दूँगा।’
