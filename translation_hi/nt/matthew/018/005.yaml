base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: hi
  text: और जो कोई मेरे नाम पर ऐसे किसी एक बच्चे को ग्रहण करता है[a][b], वह मुझे ग्रहण करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वागत करता है।” यूनानी क्रिया का अर्थ “ग्रहण करना,” “स्वागत करना,” या “स्वीकार करना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “ऐसे किसी एक बच्चे को”; इस पद के यूनानी पाठ में “छोटा” विशेषण नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: जो कोई
  rationale: संबंधवाचक सर्वनाम और ἐάν मिलकर सामान्य तथा अनिश्चित शर्त व्यक्त करते हैं; ‘जो कोई’ आधुनिक हिन्दी में इस व्यापक अर्थ को स्वाभाविक रूप से रखता है।
- source_word: δέξηται / δέχεται
  choice: ग्रहण करता है / ग्रहण करता है
  rationale: एक ही यूनानी क्रिया की पुनरावृत्ति को हिन्दी में भी रखा गया है, ताकि बच्चे को ग्रहण करने और यीशु को ग्रहण करने का सीधा संबंध स्पष्ट रहे। संदर्भ में ‘स्वागत करता है’ भी संभव है।
- source_word: ἓν παιδίον τοιοῦτο
  choice: ऐसे एक बच्चे को
  rationale: यह पदबंध पहले उपस्थित किए गए बच्चे और उसी प्रकार के बच्चे की ओर संकेत करता है। παιδίον का अर्थ ‘बच्चा’ है; इस पद में ‘छोटा’ के लिए अलग विशेषण नहीं है।
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: मेरे नाम में
  rationale: यह अभिव्यक्ति यीशु के नाम, अधिकार या उनसे संबंध के आधार पर किए गए ग्रहण को दर्शा सकती है। ‘मेरे नाम में’ इस अर्थ-सीमा को बिना अनावश्यक रूप से सीमित किए सुरक्षित रखता है।
- source_word: ἐμὲ
  choice: मुझे
  rationale: प्रबल रूप वाले सर्वनाम का स्वाभाविक हिन्दी रूप ‘मुझे’ है; वाक्य की समानांतर रचना स्वयं उस पर पर्याप्त बल देती है।
theological_decisions:
- issue: बच्चे और यीशु के बीच प्रतिनिधिक पहचान
  choice: यीशु के नाम में ऐसे बच्चे को ग्रहण करना स्वयं यीशु को ग्रहण करना है।
  alternative: इसे केवल ऐसे बच्चे का स्वागत करके यीशु का सम्मान करने के अर्थ में नरम किया जा सकता था।
  rationale: दोनों उपवाक्यों में एक ही क्रिया का प्रयोग बच्चे को ग्रहण करने और यीशु को ग्रहण करने के बीच सीधी तथा सशक्त पहचान स्थापित करता है। अनुवाद इस तनाव को बनाए रखता है और कोई अतिरिक्त संस्कारात्मक या कलीसियाई अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप। ‘ग्रहण करता है’ कुछ औपचारिक है, पर यूनानी क्रिया की पुनरावृत्ति और दोनों उपवाक्यों की धार्मिक-साहित्यिक समानता को ठीक प्रकार से सुरक्षित रखता है।
