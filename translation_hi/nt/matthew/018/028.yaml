id: MAT.18.28
reference: Matthew 18:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that servant went out[a], he found one of his fellow servants who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: hi
  text: लेकिन जब वह दास बाहर निकला, तो उसे अपने साथी दासों में से एक मिला, जिस पर उसके सौ दीनार[a] बकाया थे। उसने उसे पकड़ लिया और उसका गला घोंटने लगा। वह कह रहा था, “तेरे ऊपर जो कुछ बकाया है, चुका दे।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दीनार उस समय किसी मज़दूर या सैनिक की एक दिन की सामान्य मज़दूरी के लगभग बराबर चाँदी का सिक्का था।
    reason: cultural_note
  - marker: b
    text: 'अधिक शब्दशः: “यदि तुझ पर कुछ बकाया है, तो चुका दे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: दास
  rationale: दृष्टान्त में स्वामित्व और बँधी हुई सामाजिक स्थिति निहित है। ‘दास’ आधुनिक हिन्दी में गरिमापूर्ण रहते हुए इस स्थिति को ‘सेवक’ से अधिक स्पष्ट रूप में व्यक्त करता है।
- source_word: ἐξελθὼν δὲ
  choice: लेकिन जब वह दास बाहर निकला
  rationale: δέ के विरोधात्मक कथानक-संक्रमण और कृदन्त के कालगत सम्बन्ध—बाहर निकलने के बाद अगली घटना—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συνδούλων
  choice: साथी दासों
  rationale: σύν- का ‘साथी/उसी स्थिति में’ अर्थ सुरक्षित रखता है और δοῦλος के अनुवाद से संगति बनाए रखता है।
- source_word: ὤφειλεν
  choice: बकाया थे
  rationale: यहाँ आर्थिक ऋण की बात है; ‘बकाया’ सहज आधुनिक हिन्दी में देनदारी को स्पष्ट करता है।
- source_word: ἑκατὸν δηνάρια
  choice: सौ दीनार
  rationale: ऐतिहासिक मुद्रा का नाम बनाए रखता है और पिछले विशाल ऋण के साथ कथानक का मात्रात्मक विरोध सुरक्षित करता है।
- source_word: κρατήσας
  choice: पकड़ लिया
  rationale: बलपूर्वक पकड़ने की पूर्ण हुई क्रिया को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔπνιγεν
  choice: गला घोंटने लगा
  rationale: अपूर्ण भूतकाल क्रिया की आरम्भिक और जारी हिंसक कार्रवाई को व्यक्त करता है।
- source_word: Ἀπόδος
  choice: चुका दे
  rationale: ऋण के प्रसंग में तीखी आज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἴ τι ὀφείλεις
  choice: तेरे ऊपर जो कुछ बकाया है
  rationale: εἴ τι की अनिश्चितता को ‘जो कुछ’ से बनाए रखता है; अधिक शब्दशः सशर्त रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दृष्टान्त में δοῦλος का अनुवाद
  choice: दास / साथी दास
  alternative: सेवक / साथी सेवक; गुलाम / साथी गुलाम
  rationale: यह प्रसंग स्वामी के अधीन बँधी स्थिति, ऋण और बलपूर्वक अधिकार को सामने रखता है। ‘दास’ उस सामाजिक वास्तविकता को ‘सेवक’ से अधिक स्पष्ट रखता है, जबकि ‘गुलाम’ की अपेक्षा अधिक गरिमापूर्ण कथात्मक शैली देता है।
- issue: εἴ τι ὀφείλεις की अनिश्चित अभिव्यक्ति
  choice: तेरे ऊपर जो कुछ बकाया है
  alternative: यदि तुझ पर कुछ बकाया है; तुझ पर जो बकाया है
  rationale: ‘जो कुछ’ अनिश्चित और व्यापक माँग को सुरक्षित रखता है; इसे किसी निश्चित, पहले से पहचानी गई रकम तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ऋणी दास के प्रति हिंसक और अपमानजनक संबोधन को दिखाने के लिए संवाद में ‘तेरे’ का प्रयोग किया गया है। मूल के दो निकटवर्ती कृदन्तों और अपूर्ण क्रिया को बोझिल वाक्य बनाए बिना क्रमिक हिन्दी वाक्यों में व्यक्त किया गया है।
