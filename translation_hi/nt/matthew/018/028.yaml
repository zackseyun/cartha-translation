  source_fidelity: 'The translation accurately represents the narrative sequence and key expressions: the slave goes out, finds a fellow slave owing him one hundred denarii, seizes and begins choking him, and demands repayment. ‘तेरे ऊपर जो कुछ बकाया है’ appropriately retains the indefinite breadth of εἴ τι ὀφείλεις without turning it into a specified amount.'
  naturalness: The Hindi is modern, clear, and suitably forceful. ‘साथी दासों में से एक’ is idiomatic for ‘one of his fellow slaves,’ and the split into short sentences effectively conveys the physical violence. The informal ‘तेरे’ is fitting for the aggressor’s hostile demand.
  terminology: ‘दास’ and ‘साथी दास’ consistently render δοῦλος and σύνδουλος while preserving the bonded-status dimension relevant to this parable. ‘दीनार’ is retained appropriately, with a clear cultural note. ‘चुका दे’ is natural in a debt-demand context.
