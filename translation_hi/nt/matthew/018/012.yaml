id: MAT.18.12
reference: Matthew 18:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: hi
  text: तुम्हें क्या लगता है? यदि किसी मनुष्य के पास सौ भेड़ें हों और उनमें से एक भटक जाए, तो क्या वह निन्यानबे को पहाड़ों पर छोड़कर उस भटकती हुई भेड़ को खोजने नहीं जाएगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: तुम्हें क्या लगता है?
  rationale: यह श्रोताओं से सीधे उनका विचार पूछने वाला स्वाभाविक आधुनिक हिन्दी प्रश्न है और बहुवचन ὑμῖν के संबोधन को बनाए रखता है।
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: यदि किसी मनुष्य के पास ... हों
  rationale: दत्तिवाचक के साथ γίνομαι यहाँ अधिकार या परिस्थिति व्यक्त करता है। ‘किसी मनुष्य’ मूल के पुल्लिंग एकवचन प्रतिनिधिक रूप को स्पष्ट रखता है।
- source_word: ἑκατὸν πρόβατα
  choice: सौ भेड़ें
  rationale: संख्या और संज्ञा का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: उनमें से एक भटक जाए
  rationale: πλανάω का यह रूप ‘भटक जाना’ या ‘भटका दिया जाना’ दोनों अर्थ दे सकता है; प्रसंग में ‘भटक जाए’ बाहरी कर्ता को अनावश्यक रूप से निश्चित किए बिना चरवाही के रूपक को बनाए रखता है।
- source_word: οὐχὶ ἀφήσει
  choice: तो क्या वह ... छोड़कर ... नहीं जाएगा?
  rationale: οὐχί सकारात्मक उत्तर की अपेक्षा करता है। हिन्दी की यह प्रश्न-रचना उस अपेक्षा को स्वाभाविक ढंग से व्यक्त करती है; ‘छोड़कर’ अस्थायी रूप से पीछे छोड़ने का भाव देता है, परित्याग का नहीं।
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: निन्यानबे
  rationale: मूल संख्या का मानक हिन्दी रूप।
- source_word: ἐπὶ τὰ ὄρη
  choice: पहाड़ों पर
  rationale: ὄρη की ठोस स्थलाकृतिक छवि को निकटता से सुरक्षित रखता है।
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: जाकर ... खोजने नहीं जाएगा
  rationale: क्रियाविशेषणीय कृदंत और मुख्य क्रिया को हिन्दी में स्वाभाविक संयुक्त गति और उद्देश्य के रूप में व्यक्त किया गया है; ‘खोजना’ ζητέω के लिए उपयुक्त है।
- source_word: τὸ πλανώμενον
  choice: उस भटकती हुई भेड़ को
  rationale: वर्तमान कृदंत की जारी क्रिया तथा पहले आए πλανηθῇ से शब्दार्थ-संबंध बनाए रखता है। ‘खोई हुई’ कहना मूल में न आए ἀπόλλυμι की छाया जोड़ सकता था।
theological_decisions:
- issue: ἀνθρώπῳ का प्रतिनिधिक पुल्लिंग एकवचन
  choice: किसी मनुष्य
  alternative: किसी व्यक्ति
  rationale: ‘किसी मनुष्य’ मूल के व्याकरणिक रूप को बनाए रखता है, जबकि सन्दर्भ में इसका प्रतिनिधिक अर्थ स्वाभाविक रूप से समझ आता है।
- issue: भेड़ के रूपक में πλανάω की अर्थ-छाया
  choice: भटक जाए / भटकती हुई भेड़
  alternative: भटका दी जाए / खोई हुई भेड़
  rationale: यह चुनाव स्वेच्छा, दोष या बाहरी बहकावे को अनावश्यक रूप से निश्चित नहीं करता और पद के भीतर शब्दार्थ-संगति बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष और गरिमापूर्ण शैली। वाक्य को सामान्य पाठक के लिए सहज रखा गया है, जबकि मूल के प्रश्नात्मक बल, पहाड़ी स्थलचित्र और πλανάω की अर्थगत अस्पष्टता सुरक्षित हैं।
