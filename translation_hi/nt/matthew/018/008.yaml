source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: hi
  text: और यदि तुम्हारा हाथ या तुम्हारा पैर तुम्हें ठोकर खिलाता है[a], तो उसे काट डालो और अपने से दूर फेंक दो। तुम्हारे लिए बेहतर है कि तुम अपंग या लँगड़े होकर जीवन में प्रवेश करो, बजाय इसके कि दो हाथ या दो पैर होते हुए अनन्त आग में फेंके जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुमसे पाप करवाता है।” यूनानी क्रिया का शाब्दिक भाव “ठोकर खिलाता है” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: ठोकर खिलाता है
  rationale: यह यूनानी क्रिया के ठोकर या पतन कराने वाले रूपक को बनाए रखता है; प्रसंग में पाप की ओर ले जाने का नैतिक आशय भी निहित रहता है।
- source_word: ἔκκοψον
  choice: काट डालो
  rationale: यह आज्ञा की तीव्रता और हाथ या पैर को काटकर अलग करने की ठोस छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βάλε ἀπὸ σοῦ
  choice: अपने से दूर फेंक दो
  rationale: यह बलपूर्वक हटाने और अपने से अलग कर देने, दोनों भावों को व्यक्त करता है।
- source_word: καλόν σοί ἐστιν
  choice: तुम्हारे लिए यह अच्छा है
  rationale: καλόν का मूल अर्थ ‘अच्छा’ रखा गया है; आगे ‘बजाय इसके कि’ वाली तुलनात्मक रचना से ‘बेहतर’ का आशय स्पष्ट हो जाता है।
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: जीवन में प्रवेश करो
  rationale: यह εἰς की प्रवेश-दिशा तथा ζωή के युगान्त-संबंधी धार्मिक भार को बिना ‘अनन्त’ शब्द जोड़े सुरक्षित रखता है।
- source_word: κυλλὸν
  choice: अपंग
  rationale: प्रसंग में यह कटे हुए हाथ के कारण अंगहीन या विकलांग दशा को दर्शाता है; ‘अपंग’ संक्षिप्त और वर्तमान हिन्दी में समझने योग्य है।
- source_word: χωλόν
  choice: लँगड़े
  rationale: यह पैर से संबंधित χωλός का सीधा और प्रसंगानुकूल हिन्दी रूप है।
- source_word: ἔχοντα
  choice: होते हुए
  rationale: यह कृदन्त को स्पष्ट रखता है और दो अंगों के बने रहने तथा अंग-विहीन होकर जीवन में प्रवेश करने के बीच विरोध को सहज हिन्दी में दिखाता है।
- source_word: βληθῆναι
  choice: फेंके जाओ
  rationale: यह यूनानी कर्मवाच्य अनन्त रूप की तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: अनन्त आग
  rationale: न्याय के इस प्रसंग में αἰώνιος का स्वाभाविक अर्थ ‘अनन्त’ है; ‘आग’ सामान्य पाठक के लिए सीधा और स्पष्ट है।
theological_decisions:
- issue: σκανδαλίζει को सीधे पाप कराने के अर्थ में खोलना या ठोकर का रूपक बनाए रखना
  choice: ठोकर खिलाता है
  alternative: तुमसे पाप करवाता है
  rationale: मूल यूनानी ठोकर की छवि को बनाए रखता है। नैतिक पतन का आशय प्रसंग से स्पष्ट है, इसलिए उसे मुख्य पाठ में व्याख्यात्मक ढंग से सीमित नहीं किया गया।
- issue: εἰς τὴν ζωὴν में ‘जीवन’ का अर्थ
  choice: केवल ‘जीवन’ रखा गया
  alternative: अनन्त जीवन
  rationale: यहाँ युगान्त-संबंधी जीवन अभिप्रेत है, पर मूल पाठ में विशेषण ‘अनन्त’ नहीं है। अनन्त आग के साथ विरोध इसका धार्मिक आशय स्पष्ट करता है।
- issue: शारीरिक अंग काटने की आज्ञा को शाब्दिक रूप में रखना या उसके अलंकारिक आशय की व्याख्या करना
  choice: आज्ञा की कठोर और ठोस भाषा ज्यों की त्यों रखी गई
  alternative: इसे बुरी आदत या पाप के अवसर को त्यागने की व्याख्या के रूप में अनूदित करना
  rationale: मूल कथन की तीव्रता को नरम करना या उसके अतिशयोक्तिपूर्ण होने का निर्णय मुख्य पाठ में जोड़ना उचित नहीं होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गंभीर और प्रत्यक्ष रूप अपनाया गया है। ‘काट डालो’, ‘दूर फेंक दो’ और ‘अनन्त आग’ मूल कथन की कठोरता बनाए रखते हैं। ‘लँगड़ा’ का प्रयोग यहाँ विशिष्ट शारीरिक दशा के स्रोत-संगत वर्णन के रूप में हुआ है, अपमानसूचक अर्थ में नहीं।
