source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: hi
  text: तब वह दास उसके सामने गिर पड़ा और उसे दण्डवत करता हुआ कहने लगा, “मुझ पर धीरज रखिए, और मैं आपको सब कुछ चुका दूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν
  choice: गिर पड़ा
  rationale: यह क्रिया दास के वास्तविक रूप से नीचे गिरने और स्वयं को दीन करने की शारीरिक मुद्रा व्यक्त करती है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले पद की स्थिति के परिणामस्वरूप दास की प्रतिक्रिया को जोड़ता है।
- source_word: δοῦλος
  choice: दास
  rationale: ऋण, स्वामित्व और पूर्ण अधीनता के इस प्रसंग में ‘दास’ मूल शब्द की सामाजिक स्थिति को ‘सेवक’ से अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: προσεκύνει
  choice: दण्डवत होकर विनती करने लगा
  rationale: मानवीय स्वामी के सामने यह क्रिया आदरपूर्ण आत्मसमर्पण और भूमि तक झुकने की मुद्रा बताती है; अपूर्ण काल की निरंतरता को ‘करने लगा’ से व्यक्त किया गया है। धार्मिक अर्थ में केवल ‘आराधना की’ कहना इस प्रसंग में आवश्यकता से अधिक अर्थ जोड़ सकता है।
- source_word: λέγων
  choice: विनती करने लगा
  rationale: शाब्दिक अर्थ ‘कहते हुए’ है, पर कथन की विषयवस्तु और दास की मुद्रा इसे विनती के रूप में स्पष्ट करती है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: मेरे साथ धीरज रखिए
  rationale: यह दण्ड या वसूली को कुछ समय टालने और सहनशीलता दिखाने की प्रार्थना है। आदरसूचक रूप दास द्वारा अपने स्वामी को संबोधित करने के सामाजिक प्रसंग के अनुकूल है।
- source_word: πάντα
  choice: सब कुछ
  rationale: मूल का व्यापक अर्थ बनाए रखता है और प्रतिज्ञा को केवल किसी स्पष्ट रूप से जोड़े गए संज्ञा तक सीमित नहीं करता।
- source_word: ἀποδώσω σοι
  choice: मैं आपको ... चुका दूँगा
  rationale: ऋण के प्रसंग में क्रिया का अर्थ पूरा भुगतान लौटाना है; ‘चुका दूँगा’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: मानवीय स्वामी के प्रति προσκυνέω का अर्थ
  choice: आदर और अधीनता प्रकट करने वाला दण्डवत
  alternative: उसकी आराधना की
  rationale: दृष्टान्त के भीतर क्रिया का लक्ष्य एक मानवीय राजा/स्वामी है और तत्काल भाव दीनतापूर्ण दण्डवत का है। ‘आराधना’ धार्मिक अर्थ को अनावश्यक रूप से निर्णायक बना सकती है, इसलिए मुख्य पाठ शारीरिक मुद्रा और विनती को व्यक्त करता है तथा पादटिप्पणी शब्द की व्यापक अर्थ-सीमा बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्वामी के प्रति दास के संबोधन में ‘आप’ का प्रयोग हिन्दी की स्वाभाविक सामाजिक मर्यादा को व्यक्त करता है; इससे यूनानी सर्वनाम में कोई अतिरिक्त धार्मिक अर्थ नहीं जोड़ा गया।
