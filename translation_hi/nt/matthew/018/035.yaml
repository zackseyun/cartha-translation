source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: hi
  text: इसी प्रकार मेरा स्वर्गीय पिता तुम्हारे साथ भी वैसा ही करेगा, यदि तुममें से हर एक अपने भाई[a] को अपने हृदय से क्षमा न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाई’ मूल यूनानी के पुल्लिंग एकवचन का अनुवाद है; इस प्रसंग में यह प्रत्येक सहशिष्य या सहविश्वासी के लिए प्रतिनिधि रूप में प्रयुक्त है।
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: इसी प्रकार ... भी
  rationale: यह पिछले दृष्टान्त के परिणाम को वर्तमान चेतावनी पर लागू करता है और तुलनात्मक बल बनाए रखता है।
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: मेरा स्वर्गीय पिता
  rationale: यह स्वामित्व और οὐράνιος विशेषण दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ποιήσει ὑμῖν
  choice: तुम्हारे साथ करेगा
  rationale: यह पिछले दृष्टान्त में स्वामी के किए हुए कार्य की ओर संकेत करता है, पर न्याय की व्यवस्थित-धर्मवैज्ञानिक प्रकृति को अनावश्यक रूप से नहीं खोलता।
- source_word: ἐὰν μὴ
  choice: यदि ... न
  rationale: नकारात्मक शर्त को स्पष्ट और स्रोत-सन्निकट रूप में व्यक्त करता है।
- source_word: ἀφῆτε
  choice: क्षमा करे
  rationale: पारस्परिक अपराध और ऋण के प्रसंग में ἀφίημι का अर्थ क्षमा करना है।
- source_word: ἕκαστος
  choice: तुममें से हर एक
  rationale: एकवचन वितरणात्मक अर्थ को बहुवचन श्रोताओं पर स्पष्ट रूप से लागू करता है।
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: अपने भाई को
  rationale: यूनानी पुल्लिंग एकवचन को सुरक्षित रखता है; प्रसंग में यह सहविश्वासी या सहशिष्य के लिए प्रतिनिधिक रूप से प्रयुक्त है।
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: अपने हृदय से
  rationale: हिन्दी का स्वाभाविक वितरणात्मक वाक्य-विन्यास प्रत्येक व्यक्ति की भीतरी, सच्ची क्षमा पर बल देता है; यूनानी में बहुवचन ‘तुम्हारे हृदयों से’ है।
theological_decisions:
- issue: चेतावनी का क्षेत्र और बल
  choice: दृष्टान्त के अनुरूप परमेश्वर के न्याय की सीधी और गंभीर चेतावनी
  alternative: इसे केवल अनुशासन, प्रतिफल की हानि, या अनन्त दण्ड के रूप में स्पष्ट कर देना
  rationale: पद न्याय की गंभीर शर्त रखता है, पर उसकी पूरी व्यवस्थित-धर्मवैज्ञानिक श्रेणी निर्धारित नहीं करता; इसलिए तनाव को खुला रखा गया है।
- issue: ἀδελφῷ में लिंगबोधक भाषा
  choice: अपने भाई को
  alternative: अपने भाई या बहन को; किसी सहविश्वासी को
  rationale: मूल पाठ पुल्लिंग एकवचन है। मुख्य पाठ स्रोत-रूप को रखता है, जबकि प्रतिनिधिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर, स्पष्ट और गरिमामय शैली। ‘तुम्हारे साथ करेगा’ पिछले दृष्टान्त की ओर संकेत को बनाए रखता है। वितरणात्मक कर्ता ‘हर एक’ के कारण ‘अपने हृदय से’ स्वाभाविक हिन्दी है।
