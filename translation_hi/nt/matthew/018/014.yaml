  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: hi
  text: इसी प्रकार, तुम्हारे स्वर्गीय पिता की यह इच्छा नहीं है कि इन छोटों में से एक भी नाश हो जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि इन छोटों में से एक भी खो जाए।” यूनानी क्रिया का अर्थ “नाश होना” या “खो जाना” दोनों हो सकता है; ठीक पहले खोई हुई भेड़ का प्रसंग दूसरे अर्थ का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: इसी प्रकार
  rationale: यह पद को पहले आए खोई हुई भेड़ के दृष्टांत और उसके निष्कर्ष से स्वाभाविक रूप से जोड़ता है।
- source_word: οὐκ ἔστιν θέλημα ἔμπροσθεν τοῦ πατρὸς ὑμῶν
  choice: तुम्हारे ... पिता की यह इच्छा नहीं है
  rationale: ἔμπροσθεν सहित यूनानी वाक्यांश का आशय पिता की इच्छा या अभिलाषा बताना है; शाब्दिक ‘पिता के सामने इच्छा नहीं है’ आधुनिक हिन्दी में अस्वाभाविक और अस्पष्ट होगा।
- source_word: τοῦ ἐν οὐρανοῖς
  choice: स्वर्गीय
  rationale: यूनानी बहुवचन ‘आकाशों में’ का आधुनिक हिन्दी में स्वाभाविक और प्रतिष्ठित समतुल्य है, बिना स्थान-संबंधी आशय खोए।
- source_word: ἵνα ἀπόληται
  choice: कि ... नाश हो जाए
  rationale: ἀπόλλυμι यहाँ ‘नाश होना’ अथवा ‘खो जाना’ दोनों अर्थ दे सकता है। मुख्य पाठ में चेतावनी की गंभीरता के लिए ‘नाश हो जाए’ रखा गया है और निकटवर्ती खोई भेड़ के प्रसंग से समर्थित दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἓν τῶν μικρῶν τούτων
  choice: इन छोटों में से एक भी
  rationale: ‘एक भी’ प्रसंग में एक अकेले व्यक्ति तक को न खोने का बल स्वाभाविक हिन्दी में व्यक्त करता है; ‘इन छोटों’ से केवल बालकों तक अर्थ सीमित नहीं होता।
theological_decisions:
- issue: ἀπόληται का अर्थ और खोई हुई भेड़ के निकटवर्ती प्रसंग से उसका संबंध
  choice: नाश हो जाए
  alternative: खो जाए
  rationale: क्रिया अंतिम विनाश और खो जाने, दोनों की ओर संकेत कर सकती है। मुख्य पाठ गंभीर परिणाम को बनाए रखता है, जबकि पादटिप्पणी दृष्टांत से जुड़े अर्थ को सुरक्षित रखती है।
- issue: τῶν μικρῶν τούτων की पहचान
  choice: इन छोटों
  alternative: इन छोटे बच्चों
  rationale: अध्याय के प्रसंग में अभिव्यक्ति बालकों की छवि से आगे विनम्र या गौण समझे जाने वाले शिष्यों को भी समेट सकती है; इसलिए आयु को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘तुम्हारे’ मूल के बहुवचन ὑμῶν को दर्शाता है।
