  source_fidelity: ‘इसी प्रकार’ appropriately carries οὕτως and links the saying to the preceding sheep parable. ‘तुम्हारे स्वर्गीय पिता की यह इच्छा नहीं है’ idiomatically conveys οὐκ ἔστιν θέλημα ἔμπροσθεν τοῦ πατρὸς ὑμῶν; a wooden rendering of ἔμπροσθεν as ‘के सामने’ would be misleading in Hindi. ‘इन छोटों में से एक भी’ preserves the singular-inclusive force of ἓν τῶν μικρῶν τούτων without limiting the referent to literal children. ‘नाश हो जाए’ is a defensible primary rendering of ἀπόληται, with the contextual ‘खो जाए’ retained in the note.
