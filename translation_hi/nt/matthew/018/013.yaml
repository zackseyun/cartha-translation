  to: और यदि ऐसा हो कि वह उसे पा ले[a], तो मैं तुमसे सच कहता हूँ कि वह उस एक के कारण उन निन्यानबे के कारण, जो भटके नहीं हैं, होने वाले आनन्द से कहीं अधिक आनन्दित होता है।
