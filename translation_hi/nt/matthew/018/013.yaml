review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the connective, the contingency expressed by ἐὰν γένηται, Jesus’ solemn assurance, and the direct comparison of joy. The implied referent is clear from the immediate sheep illustration. However, the repeated phrasing “के लिए … के लिए” makes ἐπ’ αὐτῷ sound as though the shepherd is happy on the sheep’s behalf rather than rejoicing because of/over it.
  naturalness: The long comparative sentence is grammatically understandable but cumbersome. Recasting the two objects of joy with “के कारण” produces a natural modern-Hindi comparison while retaining the Greek’s direct force.
  terminology: “सच कहता हूँ,” “निन्यानबे,” and “भटके नहीं हैं” are appropriate modern standard Hindi. “आनन्दित” is suitably dignified and clear. No theological interpretation is added.
  issues:
  - severity: low
    issue: The expression “उस एक के लिए आनन्दित” is semantically less precise in Hindi.
    rationale: In Hindi, “X के लिए आनन्दित” can imply being happy for X’s benefit. Here χαίρει ἐπ’ αὐτῷ identifies the recovered sheep as the occasion/object of joy. “X के कारण आनन्दित” more naturally conveys that relation.
  - severity: low
    issue: The comparative syntax repeats an awkward “के लिए” construction.
    rationale: The original order is retained at the cost of fluency. A modest recasting clarifies the comparison without changing its meaning or weakening μᾶλλον ἢ.
  revised_text: और यदि ऐसा हो कि वह उसे पा ले[a], तो मैं तुमसे सच कहता हूँ कि वह उस एक के कारण उन निन्यानबे के कारण, जो भटके नहीं हैं, होने वाले आनन्द से कहीं अधिक आनन्दित होता है।
  revised_footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “यदि ऐसा घटित हो कि वह उसे पा ले।”'
    reason: lexical_alternative
  revision_rationale: The revision keeps the source’s contingency and unsoftened comparison, while making the sheep the occasion of the shepherd’s joy in idiomatic Hindi. It does not state that the ninety-nine are less valuable or uncared for.
