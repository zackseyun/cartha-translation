source:
  edition: SBLGNT
  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: hi
  text: और यदि ऐसा हो कि वह उसे पा ले[a], तो मैं तुमसे सच कहता हूँ कि वह उस एक के कारण उन निन्यानबे के कारण, जो भटके नहीं हैं, होने वाले आनन्द से कहीं अधिक आनन्दित होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “यदि ऐसा घटित हो कि वह उसे पा ले।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: सरल संयोजक को बनाए रखकर यीशु के दृष्टान्त का प्रवाह सुरक्षित रखा गया है।
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: यदि ऐसा हो कि वह उसे पा ले
  rationale: यह स्वाभाविक हिन्दी में ग्रीक पदबंध की आकस्मिकता और अनिश्चितता दोनों को व्यक्त करता है; केवल ‘यदि वह उसे पा ले’ से γένηται की बारीकी दब सकती थी।
- source_word: ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यीशु की गंभीर और बलपूर्ण कथन-विधि को स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी में प्रस्तुत करता है।
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: उस एक के लिए आनन्दित होता है
  rationale: χαίρει के प्रबल हर्ष को ‘आनन्दित’ व्यक्त करता है, और ἐπί के विषयगत सम्बन्ध को हिन्दी में स्वाभाविक ‘के लिए’ से दिया गया है।
- source_word: μᾶλλον ἢ
  choice: उससे कहीं अधिक
  rationale: वास्तविक तुलना को स्पष्ट रखता है और ‘के बजाय’ जैसे बहिष्कारसूचक अर्थ से बचता है।
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: उन निन्यानबे
  rationale: ग्रीक की तरह ‘भेड़ों’ को सन्दर्भ से निहित रहने दिया गया है, जबकि हिन्दी में संकेतवाचक पद स्पष्टता बनाए रखता है।
- source_word: τοῖς μὴ πεπλανημένοις
  choice: जो भटके नहीं हैं
  rationale: पूर्ण कृदन्त की परिणामी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है और भेड़ों के मार्ग से भटकने की छवि बनाए रखता है।
theological_decisions:
- issue: चरवाहे के आनन्द की तुलना का अर्थ
  choice: पाई गई एक भेड़ के लिए आनन्द को न भटकी निन्यानबे भेड़ों के लिए आनन्द से अधिक बताया गया है।
  alternative: तुलना को नरम करके केवल यह कहना कि चरवाहा उस एक के मिलने पर बहुत आनन्दित होता है।
  rationale: μᾶλλον ἢ स्पष्ट तुलना करता है। अनुवाद निन्यानबे के प्रति उदासीनता या कम मूल्य का निष्कर्ष जोड़े बिना कथन के धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; ‘आनन्दित’ और ‘भटके’ गरिमापूर्ण होने के साथ सामान्य पाठकों के लिए सहज हैं। तुलनात्मक वाक्य को हिन्दी में स्पष्ट करने के लिए दूसरे खण्ड में क्रिया दोहराई गई है।
