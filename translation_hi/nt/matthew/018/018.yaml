id: MAT.18.18
reference: Matthew 18:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: hi
  text: “मैं तुमसे सच कहता हूँ, जो कुछ तुम धरती पर बाँधोगे, वह स्वर्ग में बाँधा हुआ होगा; और जो कुछ तुम धरती पर खोलोगे, वह स्वर्ग में खोला हुआ होगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक पारंपरिक रूप में: “स्वर्ग में बाँधा जाएगा ... स्वर्ग में खोला जाएगा।” यूनानी रचना का अनुवाद इस प्रकार भी किया जा सकता है; मुख्य पाठ का रूप भविष्यकालीन क्रिया के साथ पूर्णकालिक कृदंत को दर्शाता है, जो स्वर्ग में पहले से स्थापित दशा का संकेत दे सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: सच
  rationale: यहाँ ἀμήν किसी कथन के आरम्भ में गंभीर और अधिकारपूर्ण पुष्टि है। ‘सच’ आधुनिक हिन्दी में इसका अर्थ सहज रूप से व्यक्त करता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: प्रत्यक्ष संबोधन और कथन के अधिकारपूर्ण स्वर को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ὅσα ἐὰν
  choice: जो कुछ
  rationale: अनिश्चित और व्यापक दायरे को हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: δήσητε
  choice: बाँधोगे
  rationale: δέω के मूल बिंब ‘बाँधना’ को सुरक्षित रखता है और इसके न्यायिक या अधिकार-संबंधी अर्थ को केवल ‘मना करना’ तक सीमित नहीं करता।
- source_word: ἐπὶ τῆς γῆς
  choice: धरती पर
  rationale: धरती और स्वर्ग के परस्पर विरोध को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔσται δεδεμένα
  choice: बाँधा हुआ होगा
  rationale: भविष्यकालीन εἰμί और पूर्णकालिक कर्मवाच्य कृदंत के मेल को परिणामस्वरूप बनी हुई दशा के रूप में व्यक्त करता है; केवल ‘बाँधा जाएगा’ कहने की अपेक्षा यूनानी पक्ष को अधिक निकटता से सुरक्षित रखता है।
- source_word: ἐν οὐρανῷ
  choice: स्वर्ग में
  rationale: यहाँ एकवचन οὐρανῷ परमेश्वर के क्षेत्र के अर्थ में प्रयुक्त है; ‘स्वर्ग में’ इसका स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: λύσητε
  choice: खोलोगे
  rationale: λύω के ‘खोलना, बंधन मुक्त करना’ वाले मूल अर्थ और ‘बाँधना—खोलना’ की जोड़ी को सुरक्षित रखता है, बिना इसे केवल ‘अनुमति देना’ अर्थ तक सीमित किए।
- source_word: ἔσται λελυμένα
  choice: खोला हुआ होगा
  rationale: पहले खंड के समान भविष्यकाल और पूर्ण कर्मवाच्य कृदंत के मेल को बनी हुई दशा के रूप में व्यक्त करता है और दोनों समानांतर खंडों की रचना बनाए रखता है।
theological_decisions:
- issue: बाँधने और खोलने के सूत्र का काल-संबंधी तथा धर्मवैज्ञानिक बल
  choice: ‘स्वर्ग में बाँधा हुआ होगा ... स्वर्ग में खोला हुआ होगा’
  alternative: ‘स्वर्ग में बाँधा जाएगा ... स्वर्ग में खोला जाएगा’
  rationale: यूनानी रचना ἔσται के साथ पूर्णकालिक कर्मवाच्य कृदंत का प्रयोग करती है, जो पहले से संपन्न कार्य के फलस्वरूप बनी दशा का संकेत दे सकती है। चुना हुआ रूप धरती के निर्णय और स्वर्ग में स्थापित दशा के बीच के संबंध को खुला रखता है और कलीसियाई अधिकार की किसी विशिष्ट सांप्रदायिक व्याख्या को पाठ में नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बाँधना—खोलना’ का मूल रूपक सुरक्षित है। ‘तुम’ यूनानी बहुवचन ὑμῖν/δήσητε/λύσητε को सामूहिक संबोधन के रूप में व्यक्त करता है।
