base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: hi
  text: जब उसने हिसाब-किताब का निपटारा करना शुरू किया, तो एक देनदार उसके सामने लाया गया, जिस पर दस हज़ार तोड़ों का कर्ज़ था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: जब उसने ... शुरू किया
  rationale: संबंधवाचक स्वतंत्र पदबंध मुख्य घटना की समयगत परिस्थिति बताता है; यह हिन्दी में स्वाभाविक रहते हुए यूनानी की कालगत भावना सुरक्षित रखता है।
- source_word: συναίρειν
  choice: हिसाब चुकता करना
  rationale: वित्तीय संदर्भ में इसका अर्थ खातों का निपटारा करना है; यह वर्तमान हिन्दी में सहज है और लेखे की छवि बनाए रखता है।
- source_word: προσηνέχθη αὐτῷ
  choice: उसके सामने लाया गया
  rationale: कर्मवाच्य रूप बताता है कि दूसरे लोग देनदार को लाए; 'उसके सामने' दरबार और लेखा-जाँच के प्रसंग में स्वाभाविक है।
- source_word: εἷς ὀφειλέτης
  choice: एक देनदार
  rationale: εἷς को स्पष्ट रूप से 'एक' रखा गया है और ὀφειλέτης का सीधा अर्थ 'देनदार' है।
- source_word: μυρίων ταλάντων
  choice: दस हज़ार तोड़े
  rationale: μύριοι का संख्यात्मक अर्थ 'दस हज़ार' है। प्राचीन मुद्रा/भार-इकाई τάλαντον के लिए हिन्दी बाइबलीय रूप 'तोड़ा' रखा गया है; आधुनिक मुद्रा में बदलने से अनिश्चित और भ्रामक सटीकता आती।
