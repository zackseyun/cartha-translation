base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: hi
  text: पर यदि वह उनकी बात सुनने से इनकार करे, तो यह बात सभा[a] को बताओ। और यदि वह सभा की बात भी सुनने से इनकार करे, तो वह तुम्हारे लिए गैर-यहूदी और चुंगी लेनेवाले के समान हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“सभा” के लिए “कलीसिया” अथवा “मंडली” भी अनुवादित किया जा सकता है (यूनानी: एक्क्लेसिया)।'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: बात मानने से इनकार करे
  rationale: यहाँ क्रिया केवल सुन न पाने की नहीं, बल्कि अनुशासनात्मक संदर्भ में कही बात पर ध्यान देने या उसे मानने से जानबूझकर इनकार करने की ओर संकेत करती है।
- source_word: εἰπὸν
  choice: यह बात ... को बता
  rationale: आज्ञार्थक रूप अगले कदम के रूप में मामले को समुदाय के सामने रखने को कहता है; संदर्भ से निहित कर्म को ‘यह बात’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: सभा
  rationale: ‘सभा’ एकत्र समुदाय का मूल भाव रखता है और बाद की संस्थागत धारणाओं को अनावश्यक रूप से पाठ में नहीं लाता।
- source_word: ἔστω σοι
  choice: वह तेरे लिए ... हो
  rationale: यह यूनानी आज्ञार्थक और σοι के व्यक्तिगत एकवचन भाव को निकटता से बनाए रखता है।
- source_word: ὥσπερ
  choice: के समान
  rationale: यह तुलना को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ὁ ἐθνικὸς
  choice: गैर-यहूदी
  rationale: यह यहूदी संदर्भ में वाचा-समुदाय के बाहर के व्यक्ति का प्रतिनिधि वर्ग दर्शाता है; ‘अन्यजाति’ की अपेक्षा आधुनिक पाठक के लिए अधिक सहज है।
- source_word: ὁ τελώνης
  choice: चुंगी लेनेवाला
  rationale: यह रोमी काल के कर-संग्रहकर्ता के लिए प्रचलित बाइबलीय हिन्दी पद है और प्रतिनिधि श्रेणी को व्यक्त करता है।
theological_decisions:
- issue: पुनरुत्थान-पूर्व मत्ती के अनुशासनात्मक संदर्भ में ἐκκλησία का अनुवाद
  choice: सभा
  alternative: कलीसिया / मंडली
  rationale: ‘सभा’ एकत्र विश्वास-समुदाय का मूल अर्थ व्यक्त करता है और बाद की संस्थागत या संप्रदायगत संरचना को नहीं थोपता; पारंपरिक विकल्प पादटिप्पणी में दिए गए हैं।
- issue: न माननेवाले व्यक्ति को बाहरी मानने की शक्ति
  choice: वह तेरे लिए गैर-यहूदी और चुंगी लेनेवाले के समान हो
  alternative: उसके साथ गैर-यहूदी और चुंगी लेनेवाले जैसा व्यवहार कर / उसे बाहरी समझ
  rationale: यह मूल उपमा और आज्ञार्थक रचना को बनाए रखता है तथा पद में कही बात से आगे बढ़कर निष्कासन की विस्तृत प्रक्रिया नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। एकवचन σοι तथा निकटवर्ती संबोधन के कारण ‘तेरे लिए’ रखा गया है। ‘सभा’ को मुख्य पाठ में रखकर पारंपरिक ‘कलीसिया’ और सामान्य ‘मंडली’ को पादटिप्पणी में सुरक्षित किया गया है।
