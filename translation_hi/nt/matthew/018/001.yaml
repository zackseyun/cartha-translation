source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: hi
  text: उसी समय शिष्य यीशु के पास आकर बोले, “तो स्वर्ग के राज्य में कौन बड़ा है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: उसी समय
  rationale: यूनानी काल-सूचक वाक्यांश का स्वाभाविक और संदर्भ-संबद्ध हिन्दी रूप।
- source_word: προσῆλθον ... τῷ Ἰησοῦ
  choice: यीशु के पास आकर
  rationale: क्रिया और सम्प्रदान कारक मिलकर यीशु के निकट आने का भाव व्यक्त करते हैं।
- source_word: λέγοντες
  choice: पूछने लगे
  rationale: शाब्दिक अर्थ ‘कहते हुए’ है, पर इसके बाद प्रत्यक्ष प्रश्न होने के कारण हिन्दी में ‘पूछने लगे’ अधिक स्वाभाविक है।
- source_word: Τίς ἄρα
  choice: तो ... कौन
  rationale: ἄρα यहाँ प्रश्न में निष्कर्ष अथवा प्रसंगगत जिज्ञासा का भाव देता है; ‘तो’ उसे संक्षेप में बनाए रखता है।
- source_word: μείζων
  choice: बड़ा
  rationale: यह तुलनात्मक रूप है (‘अधिक बड़ा’), सर्वोत्तम रूप नहीं; हिन्दी प्रश्न में ‘कौन बड़ा है?’ तुलनात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: मत्ती की विशिष्ट अभिव्यक्ति का प्रचलित, स्पष्ट और औपचारिक हिन्दी रूप।
theological_decisions:
- issue: μείζων के तुलनात्मक भाव को बनाए रखना
  choice: कौन बड़ा है?
  alternative: सबसे बड़ा कौन है?
  rationale: मूल पाठ में तुलनात्मक μείζων है, न कि स्पष्ट सर्वोत्तम रूप; इसलिए ‘सबसे बड़ा’ द्वारा तनाव को निर्णीत नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक संवाद में स्वाभाविक। कोई पादटिप्पणी आवश्यक नहीं।
