  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow servant[a], as I also had mercy on you?
translation:
  language: hi
  text: क्या तुझे भी अपने साथी दास पर दया नहीं करनी चाहिए थी, जैसे मैंने भी तुझ पर दया की थी?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: क्या ... नहीं करनी चाहिए थी
  rationale: यह पदबंध नैतिक आवश्यकता और कर्तव्य को व्यक्त करता है; हिन्दी में यह आलंकारिक प्रश्न राजा की फटकार को स्वाभाविक ढंग से रखता है।
- source_word: καὶ
  choice: भी
  rationale: यह सेवक से अपेक्षित दया को राजा द्वारा पहले की गई दया के समानांतर रखता है।
- source_word: σὲ
  choice: तुझे / तुझ पर
  rationale: एकवचन प्रत्यक्ष संबोधन को बनाए रखा गया है; प्रसंग के राजकीय फटकार-भरे स्वर के अनुरूप अनौपचारिक एकवचन रूप स्वाभाविक है।
- source_word: ἐλεῆσαι / ἠλέησα
  choice: दया करनी / दया की
  rationale: दोनों रूपों में एक ही हिन्दी क्रिया-पद रखकर यूनानी की शाब्दिक पुनरावृत्ति और नैतिक-धार्मिक बल सुरक्षित रखा गया है।
- source_word: τὸν σύνδουλόν σου
  choice: अपने सह-दास
  rationale: σύνδουλος उसी स्वामी के अधीन दूसरे दास को दर्शाता है। ‘सह-दास’ σύν- के साझा दर्जे और δοῦλος के बंधुआ अधीनत्व—दोनों को संक्षेप में सुरक्षित रखता है।
- source_word: ὡς
  choice: जैसे
  rationale: यह अपेक्षित दया और पहले प्राप्त दया के बीच सीधी तुलना व्यक्त करता है।
- source_word: κἀγὼ
  choice: मैंने ... भी
  rationale: κἀγώ में निहित καί तुलना में वक्ता की समानांतर क्रिया पर बल देता है; हिन्दी वाक्य में ‘भी’ इसी पारस्परिकता को स्पष्ट करता है।
theological_decisions:
- issue: σύνδουλος में δοῦλος-समूह के शब्द का अनुवाद
  choice: सह-दास
  alternative: साथी सेवक / सह-सेवक
  rationale: दृष्टान्त में राजा के अधीन बंधुआ स्थिति अर्थ की दृष्टि से महत्वपूर्ण है। ‘सह-दास’ इस अधीनता और एक ही स्वामी के अधीन साझा दर्जे को बनाए रखता है, जबकि अधिक परिचित विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। राजा द्वारा एक दास को सीधे संबोधित किए जाने के कारण ‘तुझे/तुझ’ रखा गया है। ‘दया’ की पुनरावृत्ति मूल पाठ की पुनरावृत्ति को सुरक्षित रखती है।
