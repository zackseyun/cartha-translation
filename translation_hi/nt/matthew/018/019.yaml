source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: hi
  text: 'फिर मैं तुमसे सच कहता हूँ: यदि पृथ्वी पर तुममें से दो जिस किसी बात के लिए वे माँगें, उसके विषय में एकमत हों,[a] तो वह उनके लिए मेरे स्वर्गीय पिता[b] की ओर से किया जाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रसंग में यह कथन समुदाय के अधिकार और अनुशासन की शिक्षा (18:15–18) के बाद आता है; फिर भी यहाँ प्रयुक्त शब्द सहमति से की गई माँग के विषय को व्यापक रूप में रखते हैं।
    reason: cross_reference
  - marker: b
    text: शाब्दिक रूप से, “मेरे पिता, जो स्वर्गों में हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: फिर
  rationale: यह पिछले कथन से जुड़े एक और गंभीर कथन का संकेत देता है; ‘फिर’ प्रवचन के क्रम को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यीशु के गंभीर और बलपूर्ण कथन-सूत्र का आधुनिक, सहज हिन्दी रूप; ‘आमीन’ के अनावश्यक लिप्यंतरण से बचता है।
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: यदि तुममें से दो जन ... एकमत हों
  rationale: συμφωνέω यहाँ सहमति या एकमत होने को व्यक्त करता है और ἐξ ὑμῶν का अर्थ ‘तुममें से’ स्वाभाविक रूप से आता है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: पिता के स्वर्ग में होने के विपरीत पृथ्वी के क्षेत्र को स्पष्ट और स्वाभाविक ढंग से बनाए रखता है।
- source_word: περὶ παντὸς πράγματος
  choice: किसी भी ऐसे विषय में
  rationale: πρᾶγμα का व्यापक अर्थ ‘विषय, मामला, बात’ है; ‘विषय’ गरिमापूर्ण और आधुनिक है तथा अगली संबंधवाचक उपवाक्य-रचना से सहज जुड़ता है।
- source_word: οὗ ἐὰν αἰτήσωνται
  choice: जिसके लिए वे माँगें
  rationale: अनिश्चित संबंधवाचक रचना और αἰτέω के माँगने/निवेदन करने के अर्थ को सुरक्षित रखता है, बिना मुख्य पाठ में ‘प्रार्थना’ जोड़ने के।
- source_word: γενήσεται αὐτοῖς
  choice: वह उनके लिए ... किया जाएगा
  rationale: भविष्य परिणाम को व्यक्त करता है और इसके बाद आने वाले παρά + संबंधकारक को स्रोत अथवा कर्तृत्व की कुछ खुली गुंजाइश देता है।
- source_word: παρὰ τοῦ πατρός μου
  choice: मेरे ... पिता की ओर से
  rationale: παρά + संबंधकारक यहाँ स्रोत या कर्तृत्व सूचित कर सकता है; ‘की ओर से’ दोनों के बीच की मूल लचीलेपन को ‘द्वारा’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: τοῦ ἐν οὐρανοῖς
  choice: स्वर्गीय पिता
  rationale: बहुवचन οὐρανοῖς के हिन्दी मुहावरेदार अर्थ को व्यक्त करता है; शाब्दिक रूप ‘जो स्वर्गों में हैं’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: प्रतिज्ञा का प्रसंगगत दायरा
  choice: कथन को उसके व्यापक शब्दों में रखा गया है और मुख्य पाठ में कलीसियाई अनुशासन, प्रार्थना या परमेश्वर की इच्छा संबंधी कोई अतिरिक्त सीमा नहीं जोड़ी गई।
  alternative: इसे केवल समुदाय के अनुशासन संबंधी निर्णयों तक सीमित करना, अथवा हर सहमत निवेदन की निर्बाध प्रतिज्ञा के रूप में विस्तृत करना।
  rationale: निकटवर्ती प्रसंग समुदाय के अनुशासन और अधिकार (18:15–18) से जुड़ा है, जबकि αἰτέω माँगने या निवेदन करने को दर्शाता है। फिर भी पद स्वयं कोई स्पष्ट व्याख्यात्मक सीमा नहीं जोड़ता; इसलिए अनुवाद उसकी व्यापकता और प्रसंगगत तनाव दोनों सुरक्षित रखता है।
- issue: παρά में स्रोत और कर्तृत्व
  choice: ‘मेरे स्वर्गीय पिता की ओर से किया जाएगा’
  alternative: ‘मेरे स्वर्गीय पिता द्वारा किया जाएगा’ अथवा ‘मेरे स्वर्गीय पिता से उन्हें मिलेगा।’
  rationale: यूनानी παρά + संबंधकारक स्रोत या कर्तृत्व दोनों की छाया रख सकता है। चुना हुआ हिन्दी रूप पिता की सक्रिय भूमिका को स्पष्ट रखते हुए इस सूक्ष्म अस्पष्टता को पूरी तरह बंद नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘दो जन’ ने संख्या को स्पष्ट रखा है; ‘माँगें’ मूल क्रिया की व्यापकता बचाता है और मुख्य पाठ में ‘प्रार्थना करें’ जैसा व्याख्यात्मक विस्तार नहीं जोड़ता। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
