id: MAT.18.9
reference: Matthew 18:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: hi
  text: और यदि तुम्हारी आँख तुम्हारे लिए ठोकर का कारण बनती है[a], तो उसे निकालकर अपने से दूर फेंक दो। तुम्हारे लिए एक-आँखा होकर जीवन में प्रवेश करना इससे अच्छा है कि दो आँखें होते हुए तुम्हें आग के गेहन्ना[b] में फेंक दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमसे पाप करवाती है।” यूनानी क्रिया का अर्थ किसी को ठोकर लगवाना, गिराना, या पाप करवाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “गेहन्ना” अंतिम न्याय के स्थान को सूचित करता है; परंपरागत रूप से इसका अनुवाद “नरक” किया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: ठोकर खिलाती है
  rationale: यह अभिव्यक्ति ठोकर या पतन के यूनानी रूपक को बनाए रखती है और प्रसंग में पाप कराने का भाव भी समेटती है।
- source_word: ἔξελε
  choice: निकालकर
  rationale: आज्ञा की कठोर और तात्कालिक छवि को स्वाभाविक हिन्दी में व्यक्त करता है; आँख के संदर्भ में इसका बल स्पष्ट है।
- source_word: βάλε ἀπὸ σοῦ
  choice: अपने से दूर फेंक दो
  rationale: निर्णायक रूप से अलग कर देने और दूर हटाने का भाव सुरक्षित रखता है।
- source_word: καλόν σοί ἐστιν
  choice: तुम्हारे लिए ... अच्छा है
  rationale: ἤ से बने स्पष्ट तुलनात्मक वाक्य में हिन्दी की ‘इससे अच्छा है’ संरचना स्वाभाविक रूप से बेहतर या अधिक लाभकारी होने का अर्थ देती है।
- source_word: μονόφθαλμον
  choice: एक आँख के साथ
  rationale: ‘एक-आँखा’ की अपेक्षा यह आधुनिक हिन्दी में सहज है और शारीरिक चित्र को बनाए रखता है।
- source_word: εἰς τὴν ζωὴν
  choice: जीवन में
  rationale: मूल में ‘अनन्त’ विशेषण नहीं है; इसलिए युगान्तीय संकेत को बिना अधिक स्पष्ट किए केवल ‘जीवन’ रखा गया है।
- source_word: βληθῆναι
  choice: फेंक दिया जाए
  rationale: निष्क्रिय क्रिया का सीधा और वर्तमान हिन्दी में स्वाभाविक अनुवाद है।
- source_word: γέενναν
  choice: गेहन्ना
  rationale: विशिष्ट यूनानी पद का लिप्यंतरण उसकी यहूदी ऐतिहासिक और अंतिम न्याय संबंधी विशिष्टता को बनाए रखता है।
- source_word: τοῦ πυρός
  choice: आग के
  rationale: संबंधकारक संरचना ‘आग के गेहन्ना’ के रूप में सीधे सुरक्षित रखी गई है।
theological_decisions:
- issue: γέεννα का अनुवाद
  choice: गेहन्ना
  alternative: नरक
  rationale: मूल पाठ सामान्य अधोलोक के बजाय विशिष्ट γέεννα कहता है। लिप्यंतरण बाद की व्यापक धार्मिक धारणाओं को अनावश्यक रूप से आरोपित नहीं करता; अर्थ फुटनोट में स्पष्ट किया गया है।
- issue: εἰς τὴν ζωὴν का अनुवाद
  choice: जीवन में
  alternative: अनन्त जीवन में
  rationale: प्रसंग में अंतिम जीवन का संकेत हो सकता है, पर यूनानी में ‘अनन्त’ स्पष्टतः नहीं है; अतः मूल की संक्षिप्तता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
- issue: आँख निकालने की आज्ञा की तीव्रता
  choice: चित्रात्मक कठोरता को यथावत रखना
  alternative: हानिकारक वस्तु को दूर करने जैसी व्याख्यात्मक नरमी
  rationale: मूल वचन जानबूझकर तीखा शारीरिक चित्र प्रस्तुत करता है। अनुवाद उसका व्याख्यात्मक समाधान या शमन नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘ठोकर खिलाती है’ मूल रूपक को बचाता है, जबकि फुटनोट पाप संबंधी अर्थ खोलता है। ‘गेहन्ना’ जैसे अपरिचित पद को मुख्य पाठ में सुरक्षित रखकर फुटनोट में समझाया गया है।
