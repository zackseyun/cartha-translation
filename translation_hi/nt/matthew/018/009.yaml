  terminology: “गेहन्ना” appropriately retains γέεννα, while “आग के गेहन्ना” directly reflects τοῦ πυρός. The explanatory note may retain “नरक” only as a traditional rendering, not as the main-text equivalent. The Gehenna note anchor should follow “गेहन्ना,” the term it explains.
