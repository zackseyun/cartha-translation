  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his servants[a][b].
translation:
  language: hi
  text: इसलिए स्वर्ग का राज्य एक राजा के समान ठहराया गया, जो अपने दासों[a] से हिसाब लेना चाहता था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवकों’ अथवा ‘बंधुआ सेवकों’; यूनानी शब्द δοῦλοι राजा के अधीन उनकी बंधी हुई स्थिति पर बल देता है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में ‘के समान ठहराया गया’ या ‘जिसकी तुलना ... से की गई।’
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: इसलिए
  rationale: यह पद को पिछली शिक्षा से जोड़ने वाला कारणात्मक और निष्कर्षसूचक संबंध स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὡμοιώθη
  choice: के समान ठहराया गया
  rationale: यह ὁμοιόω के अओरिस्ट कर्मवाच्य रूप की तुलना और कर्मवाच्य बारीकी को बनाए रखता है; केवल ‘के समान है’ कहने से यह बारीकी मिट जाती।
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: यह मत्ती की विशिष्ट अभिव्यक्ति का प्रचलित, स्वाभाविक और अर्थपूर्ण हिन्दी रूप है।
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: एक ऐसे राजा
  rationale: मूलतः ‘एक मनुष्य, अर्थात राजा’ को हिन्दी में बिना अनावश्यक भारीपन के स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἠθέλησεν
  choice: चाहता था
  rationale: θέλω की इच्छा या मंशा को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: συνᾶραι λόγον
  choice: हिसाब चुकता करना
  rationale: यह आर्थिक लेखे की जाँच और देनदारी के निपटारे से संबंधित यूनानी मुहावरे का स्वाभाविक हिन्दी समतुल्य है।
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: अपने दासों से
  rationale: ‘दास’ δοῦλος की अधीन और बंधी हुई स्थिति को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रखता है; ‘से’ हिसाब चुकता करने के हिन्दी मुहावरे के अनुकूल है।
theological_decisions:
- issue: राजकीय और आर्थिक दृष्टान्त में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक; बंधुआ सेवक
  rationale: राजा का अधिकार और हिसाब-किताब का प्रसंग अधीनता तथा बंधी हुई स्थिति को प्रमुख बनाता है। फिर भी शब्द का प्रयोग सेवक के अर्थ में भी समझा जा सकता है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- issue: ὡμοιώθη के कर्मवाच्य तुलनात्मक रूप का अनुवाद
  choice: के समान ठहराया गया
  alternative: के समान है; जिसकी तुलना ... से की गई
  rationale: चुना हुआ रूप कर्मवाच्य संरचना को बनाए रखते हुए हिन्दी में समझने योग्य है और यह निर्धारित नहीं करता कि तुलना करने वाला कौन है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। ‘स्वर्ग का राज्य’ और ‘हिसाब चुकता करना’ परिचित अभिव्यक्तियाँ हैं; ‘दास’ स्रोत की सामाजिक स्थिति को स्पष्ट रखता है।
