language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: hi
  text: तब पतरस ने उसके पास आकर कहा, “प्रभु, मेरा भाई कितनी बार मेरे विरुद्ध पाप करेगा और मैं उसे क्षमा करूँगा? सात बार तक?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा भाई या बहन”; यूनानी में “मेरा भाई” (पुल्लिंग एकवचन) है, जो इस प्रसंग में व्यापक रूप से किसी साथी शिष्य को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह स्वाभाविक काल-क्रमसूचक शब्द है और पिछले प्रसंग से कथा का प्रवाह बनाए रखता है।
- source_word: προσελθὼν αὐτῷ ὁ Πέτρος εἶπεν
  choice: पतरस ने उसके पास आकर कहा
  rationale: कृदंत में व्यक्त पहले पास आने और फिर बोलने के क्रम को स्वाभाविक हिन्दी में सुरक्षित रखा गया है; ‘उसके’ का संकेत प्रसंगानुसार यीशु की ओर है।
- source_word: Κύριε
  choice: प्रभु
  rationale: सम्बोधन में आदर और κύριος की सम्भावित धर्मवैचारिक गूँज दोनों सुरक्षित रहती हैं।
- source_word: ποσάκις
  choice: कितनी बार
  rationale: यह संख्यात्मक आवृत्ति को व्यक्त करता है और आगे आए ‘सात बार तक’ से सीधा मेल रखता है।
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: मेरे विरुद्ध पाप करेगा
  rationale: भविष्यकाल और पतरस के विरुद्ध निर्देशित अपराध—दोनों को निकटता से व्यक्त किया गया है।
- source_word: ὁ ἀδελφός μου
  choice: मेरा भाई
  rationale: यूनानी पाठ के पुल्लिंग एकवचन को मुख्य पाठ में बनाए रखा गया है; प्रसंग में सम्भावित व्यापक अर्थ फुटनोट में दिया गया है।
- source_word: καὶ ἀφήσω αὐτῷ
  choice: और मैं उसे क्षमा करूँगा
  rationale: ἀφίημι का नैतिक अर्थ ‘क्षमा करना’ है; भविष्यकाल और समन्वित प्रश्न-वाक्य की संरचना सुरक्षित रखी गई है।
- source_word: ἕως ἑπτάκις
  choice: सात बार तक?
  rationale: ἕως द्वारा व्यक्त प्रस्तावित अधिकतम सीमा को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: ἀδελφός का प्रसंगगत दायरा
  choice: मुख्य पाठ में ‘मेरा भाई’
  alternative: ‘मेरा भाई या बहन’ अथवा ‘मेरा सहविश्वासी’
  rationale: मूल यूनानी पुल्लिंग एकवचन है, पर प्रसंग में यह किसी साथी शिष्य के लिए व्यापक रूप से प्रयुक्त हो सकता है। मूल रूप को मुख्य पाठ में और व्यापक सम्भावना को फुटनोट में रखा गया है।
- issue: प्रश्न में भविष्यकाल की असामान्य अभिव्यक्ति
  choice: ‘पाप करेगा और मैं उसे क्षमा करूँगा?’
  alternative: ‘पाप करे तो मैं उसे क्षमा करता रहूँ?’
  rationale: अधिक मुहावरेदार विकल्प आशय स्पष्ट करता, पर यूनानी के दोनों भविष्यकालों को वर्तमान या सम्भावनार्थक रूप में बदल देता। पाठ की खुली, कुछ असामान्य संरचना को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘पतरस’ और ‘प्रभु’ बाइबलीय हिन्दी में परिचित हैं। फुटनोट-चिह्न [a] सम्बद्ध वाक्य के अंत में रखा गया है।
