  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that servant[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: hi
  text: तब उस दास के स्वामी ने करुणा से भरकर उसे जाने दिया और उसका कर्ज़[a] माफ़ कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अधिक विशिष्ट अर्थ ‘उधार’ या ‘उधार दी हुई रकम’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: गहरी दया आई
  rationale: यह अभिव्यक्ति भीतर से उमड़ी प्रबल करुणा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को आगे बढ़ाता है; ‘तब’ प्रसंग के क्रम को सहज रूप से दिखाता है।
- source_word: κύριος
  choice: स्वामी
  rationale: दृष्टान्त में यह दास पर अधिकार रखने वाले मानवीय स्वामी को सूचित करता है; ‘स्वामी’ हिन्दी में स्वाभाविक है और इसे प्रत्यक्ष ईश्वरीय उपाधि नहीं बनाता।
- source_word: δοῦλου
  choice: दास
  rationale: यह अधीनता और स्वामित्व के सामाजिक संबंध को ‘सेवक’ की अपेक्षा अधिक स्पष्टता से बनाए रखता है।
- source_word: ἀπέλυσεν αὐτόν
  choice: उसे छोड़ दिया
  rationale: यह तत्काल बंधन अथवा हिरासत से जाने देने के अर्थ को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: τὸ δάνειον
  choice: कर्ज़
  rationale: δάνειον मूलतः उधार दी हुई राशि है, पर इस प्रसंग में देनदारी के रूप में उसका कर्ज़ माफ़ किया जा रहा है; ‘कर्ज़’ सामान्य हिन्दी में इस अर्थ को स्पष्ट रखता है।
- source_word: ἀφῆκεν αὐτῷ
  choice: उसका ... माफ़ कर दिया
  rationale: ἀφίημι यहाँ वित्तीय देनदारी को क्षमा अथवा रद्द करने का भाव देता है; ‘कर्ज़ माफ़ करना’ हिन्दी का स्वाभाविक प्रयोग है।
theological_decisions:
- issue: κύριος को ईश्वरीय उपाधि मान लेने की संभावना
  choice: मानवीय पात्र के लिए ‘स्वामी’
  alternative: ‘प्रभु’
  rationale: तात्कालिक कथा-संदर्भ में यह दास का मानवीय स्वामी है। ‘स्वामी’ दृष्टान्त की व्यापक धार्मिक सार्थकता को रोके बिना प्रत्यक्ष ईश्वरीय पहचान आरोपित करने से बचता है।
- issue: δοῦλος की सामाजिक स्थिति
  choice: ‘दास’
  alternative: ‘सेवक’
  rationale: ऋण, अधिकार और दंड वाले इस दृष्टान्त में असमान स्वामित्व-संबंध महत्वपूर्ण है; ‘दास’ इस कठोर वास्तविकता को बनाए रखता है।
- issue: δάνειον की विशिष्टता
  choice: मुख्य पाठ में ‘कर्ज़’, पादटिप्पणी में ‘उधार/ऋण’ की विशिष्टता
  alternative: ‘उधार दी हुई रकम’
  rationale: ‘कर्ज़’ सहज और संदर्भानुकूल है, जबकि पादटिप्पणी बताती है कि यूनानी संज्ञा विशेष रूप से उधार दी गई वस्तु या राशि को दर्शाती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘गहरी दया आई’ करुणा की तीव्रता रखता है; ‘कर्ज़ माफ़ कर दिया’ सामान्य पाठक के लिए स्वाभाविक कानूनी-वित्तीय अभिव्यक्ति है।
