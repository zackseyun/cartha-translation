id: MAT.18.31
reference: Matthew 18:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow servants saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: hi
  text: इसलिए, जब उसके साथी दासों[a] ने जो कुछ हुआ था वह देखा, तो वे बहुत दुःखी हुए। वे अपने स्वामी[b] के पास आकर उसे जो कुछ हुआ था, वह सब बता दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘साथी सेवकों’। यूनानी σύνδουλοι का शाब्दिक अर्थ ‘साथी दास’ है; यह ऐसे दासों को दर्शाता है जो एक ही स्वामी के अधीन हों।
    reason: lexical_alternative
  - marker: b
    text: या ‘मालिक’। यूनानी κύριος का अर्थ संदर्भ के अनुसार ‘स्वामी’, ‘मालिक’ या ‘प्रभु’ हो सकता है; यहाँ यह दृष्टान्त के मानवीय स्वामी के लिए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले घटनाक्रम से निकलने वाले परिणाम और कथा की प्रगति—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σύνδουλοι
  choice: साथी दासों
  rationale: यह उन लोगों को दर्शाता है जो उसी स्वामी के अधीन दास की समान स्थिति में हैं। ‘साथी दास’ मूल शब्द के संयुक्त अर्थ और दृष्टान्त में उनकी बँधी हुई सामाजिक स्थिति को बनाए रखता है।
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: क्या हुआ था / जो कुछ हुआ था, वह सब
  rationale: पहली अभिव्यक्ति घटना को सामान्य रूप से बताती है, जबकि दूसरी में πάντα के कारण समग्रता पर बल है; हिन्दी में यह भेद स्पष्ट और स्वाभाविक रहता है।
- source_word: ἐλυπήθησαν σφόδρα
  choice: बहुत व्यथित हुए
  rationale: ‘व्यथित’ गहरे दुःख और मानसिक कष्ट दोनों को व्यक्त करता है, और ‘बहुत’ σφόδρα की तीव्रता बनाए रखता है।
- source_word: ἐλθόντες
  choice: वे ... के पास गए
  rationale: पूर्वकालिक सहभागी क्रिया को हिन्दी कथा-क्रम में स्वाभाविक स्वतंत्र क्रिया के रूप में व्यक्त किया गया है। संदर्भ में वे अपने स्वामी के पास पहुँचते हैं।
- source_word: διεσάφησαν
  choice: बता दिया
  rationale: संदर्भ में इसका अर्थ स्पष्ट रूप से सूचना देना या पूरा वृत्तांत सुनाना है। साथ के ‘जो कुछ ... वह सब’ से विस्तृत और संपूर्ण सूचना का भाव पहले ही व्यक्त हो जाता है।
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: अपने स्वामी
  rationale: यहाँ κύριος दृष्टान्त के मानवीय स्वामी के लिए है। ‘स्वामी’ उसके अधिकार-संबंध को व्यक्त करता है और हिन्दी में सहज है।
theological_decisions:
- issue: दृष्टान्त की सामाजिक पृष्ठभूमि में σύνδουλοι का अनुवाद
  choice: साथी दासों
  alternative: साथी सेवकों
  rationale: σύνδουλοι, δοῦλος-परिवार का शब्द है और एक ही स्वामी के अधीन समान दास-स्थिति बताता है। ऋण और अधीनता के इस दृष्टान्त में उस स्थिति को नरम करके केवल ‘सेवक’ कहना उचित नहीं होगा।
- issue: मानवीय अधिकारी के लिए κύριος का अनुवाद
  choice: स्वामी
  alternative: मालिक
  rationale: यहाँ संबोधन परमेश्वर के लिए नहीं, दृष्टान्त के मानवीय अधिकारी के लिए है। ‘स्वामी’ मूल के अधिकार-संबंध को बनाए रखता है, जबकि ‘मालिक’ भी संदर्भानुसार संभव है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘साथी दास’ मूल सामाजिक संबंध को स्पष्ट करता है; ‘बहुत व्यथित’ भाव की तीव्रता को बिना अतिशयोक्ति व्यक्त करता है। दो वाक्यों में विभाजन हिन्दी में कथा-क्रम को सुबोध बनाता है।
