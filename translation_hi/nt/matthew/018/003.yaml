source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: hi
  text: और उसने कहा, “मैं तुमसे सच कहता हूँ, यदि तुम न फिरो[a] और बच्चों के समान[b] न बनो, तो तुम स्वर्ग के राज्य में कदापि प्रवेश नहीं करोगे[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘फिरो’ का अनुवाद ‘परिवर्तित हो जाओ’ या ‘तुम्हें फेरा जाए’ भी किया जा सकता है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में ‘बच्चे’ लेख के साथ है। निकट संदर्भ में यीशु द्वारा उनके बीच खड़े किए गए बच्चे की घटना की ओर संकेत भी हो सकता है।
    reason: contextual_ambiguity
  - marker: c
    text: यूनानी में यहाँ अत्यन्त प्रबल निषेध है; इसका अनुवाद ‘कभी भी प्रवेश नहीं करोगे’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यह किसी गंभीर और अधिकारपूर्ण कथन का परिचय देने वाला सूत्र है। ‘सच’ आधुनिक हिन्दी में इसका अर्थ स्वाभाविक रूप से पहुँचाता है; केवल ‘आमीन’ कहना सामान्य पाठक के लिए कम स्पष्ट हो सकता है।
- source_word: στραφῆτε
  choice: फिरो
  rationale: यह रूप ‘फिरना’ या ‘फेरा जाना’—दोनों भाव ग्रहण कर सकता है। ‘फिरो’ हिन्दी में निर्णायक दिशा-परिवर्तन को संक्षेप में व्यक्त करता है, पर परिवर्तन कराने वाले को निर्दिष्ट नहीं करता।
- source_word: γένησθε
  choice: बनो
  rationale: γίνομαι यहाँ अवस्था में परिवर्तन, अर्थात ‘बनना’, व्यक्त करता है और προηγामी ‘फिरो’ के साथ स्वाभाविक समन्वय बनाता है।
- source_word: ὡς τὰ παιδία
  choice: बच्चों के समान
  rationale: बहुवचन παιδία का सामान्य वर्गगत अर्थ हिन्दी में ‘बच्चों’ से स्वाभाविक रूप से व्यक्त होता है। अनुवाद बच्चों के किस गुण की ओर संकेत है, यह स्वयं तय नहीं करता।
- source_word: οὐ μὴ εἰσέλθητε
  choice: कदापि प्रवेश नहीं करोगे
  rationale: οὐ μή के साथ यह क्रियारूप अत्यन्त प्रबल निषेध व्यक्त करता है। ‘कदापि ... नहीं’ उस बल को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है।
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: यह मत्ती का विशिष्ट पदबंध है। ‘स्वर्ग का राज्य’ हिन्दी में प्रचलित, स्वाभाविक और अर्थतः उपयुक्त अनुवाद है; शाब्दिक बहुवचन ‘स्वर्गों’ की आवश्यकता नहीं है।
theological_decisions:
- issue: στραφῆτε में मन-परिवर्तन या परिवर्तन कराए जाने का भाव
  choice: ‘फिरो’ रखा गया है, किसी तकनीकी धार्मिक पद का प्रयोग नहीं किया गया।
  alternative: ‘फेरे जाओ’ या ‘मन-परिवर्तन करो’
  rationale: यूनानी रूप कर्मवाच्य/अकर्मक अर्थ की गुंजाइश रखता है। ‘फिरो’ निर्णायक परिवर्तन को व्यक्त करता है, पर न तो कर्तृत्व का प्रश्न हल करता है और न बाद की किसी विशेष धर्मवैज्ञानिक परिभाषा को पाठ में डालता है।
- issue: बच्चों के समान बनने का आशय
  choice: तुलना को ‘बच्चों के समान’ के रूप में खुला रखा गया है।
  alternative: ‘बच्चों के समान निर्दोष/नम्र/विश्वासी बनो’
  rationale: इस पद में बच्चों का कोई विशिष्ट गुण स्पष्ट नहीं किया गया। किसी एक गुण को मुख्य पाठ में जोड़ना व्याख्या को अनुवाद बना देता।
- issue: स्वर्ग के राज्य में प्रवेश पर प्रबल निषेध
  choice: ‘कदापि प्रवेश नहीं करोगे’
  alternative: ‘प्रवेश नहीं करोगे’
  rationale: साधारण निषेध यूनानी οὐ μή की जोरदार शक्ति को कम कर देता; ‘कदापि’ चेतावनी की तीव्रता बनाए रखता है, बिना उससे आगे कोई धर्मवैज्ञानिक निष्कर्ष जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण और मौखिक रूप से स्पष्ट स्तर रखा गया है। ‘कदापि’ अपेक्षाकृत औपचारिक शब्द है, पर यहाँ यूनानी के प्रबल निषेध को संक्षेप और प्रतिष्ठित ढंग से व्यक्त करता है। वाक्य की शर्तात्मक संरचना और दोनों समन्वित क्रियाएँ सुरक्षित रखी गई हैं।
