  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: hi
  text: “पर यदि तुम्हारा भाई[b] तुम्हारे विरुद्ध पाप करे[a], तो जाओ और केवल तुम दोनों के बीच उसे उसकी गलती बताओ। यदि वह तुम्हारी बात सुन ले, तो तुमने अपने भाई को पा लिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ प्राचीन हस्तलिपियों में “तुम्हारे विरुद्ध” नहीं है; उनके अनुसार वाक्य होगा: “यदि तुम्हारा भाई पाप करे, तो जाओ...”'
    reason: textual_variant
  - marker: b
    text: “भाई” यूनानी में व्याकरण की दृष्टि से पुल्लिंग एकवचन है; इस प्रसंग में यह व्यापक रूप से किसी सह-शिष्य को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: पाप करे
  rationale: ἐὰν के साथ एओरिस्ट सब्जंक्टिव सामान्य शर्त व्यक्त करता है। ‘पाप करे’ नैतिक और धार्मिक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἰς σέ
  choice: तुम्हारे विरुद्ध
  rationale: यहाँ εἰς + कर्मकारक उस व्यक्ति को दर्शाता है जिसके विरुद्ध अपराध हुआ। SBLGNT में यह वाक्यांश है, इसलिए मुख्य पाठ में रखा गया और पाठांतर पादटिप्पणी में दिया गया है।
- source_word: ὁ ἀδελφός σου
  choice: तुम्हारा भाई
  rationale: यूनानी पद व्याकरण की दृष्टि से पुल्लिंग एकवचन है। प्रसंग में यह सह-शिष्य को सूचित कर सकता है, पर मुख्य पाठ स्रोत की अभिव्यक्ति को बनाए रखता है।
- source_word: ὕπαγε
  choice: जाओ
  rationale: आज्ञार्थक क्रिया के लिए यह संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: ἔλεγξον
  choice: उसे उसकी गलती बताओ
  rationale: ἐλέγχω यहाँ दोष को सामने लाने या व्यक्ति को उसका दोष दिखाने का अर्थ देता है। यह हिन्दी में ‘डाँटो’ की अपेक्षा कम कठोर और ‘सामना करो’ की अपेक्षा अधिक स्पष्ट है।
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: केवल अपने और उसके बीच
  rationale: यह अभिव्यक्ति बातचीत की निजता और दोनों व्यक्तियों तक उसके सीमित रहने पर बल देती है।
- source_word: ἀκούσῃ
  choice: तुम्हारी बात सुन ले
  rationale: ἀκούω यहाँ केवल ध्वनि सुनने से बढ़कर ग्रहणशीलता का संकेत देता है, लेकिन ‘मान ले’ या ‘आज्ञा माने’ जितना प्रबल नहीं है।
- source_word: ἐκέρδησας
  choice: तुमने ... को पा लिया है
  rationale: κερδαίνω के ‘प्राप्त करना/जीतना’ रूपक को बनाए रखता है। ‘वापस पा लिया’ सम्बन्ध की पूर्व हानि का अतिरिक्त अर्थ जोड़ता।
theological_decisions:
- issue: ἀδελφός के व्यापक अनुप्रयोग को मुख्य पाठ में स्पष्ट करना
  choice: तुम्हारा भाई
  alternative: तुम्हारा भाई या बहन; तुम्हारा सह-विश्वासी
  rationale: मूल पाठ पुल्लिंग एकवचन है। प्रसंग में शब्द का दायरा सह-शिष्य तक व्यापक हो सकता है; इसे पादटिप्पणी में स्पष्ट किया गया है, मुख्य पाठ में नहीं बढ़ाया गया।
- issue: εἰς σέ की पाठालोचनात्मक स्थिति
  choice: मुख्य पाठ में ‘तुम्हारे विरुद्ध’ शामिल करना
  alternative: ‘यदि तुम्हारा भाई पाप करे’
  rationale: SBLGNT इस वाक्यांश को स्वीकार करता है, पर प्राचीन हस्तलिपियों में इसके लोप का महत्त्वपूर्ण पाठांतर है, जो निर्देश के दायरे को प्रभावित करता है। इसलिए पाठांतर पादटिप्पणी में रखा गया है।
- issue: ἐκέρδησας के पुनर्मिलन-संबंधी अर्थ को कितना स्पष्ट करना
  choice: तुमने अपने भाई को पा लिया है
  alternative: तुमने अपने भाई को वापस पा लिया है; तुमने अपने भाई को जीत लिया है
  rationale: ‘पा लिया’ मूल रूपक और उसके संभावित संबंधपरक अर्थ को सुरक्षित रखता है, जबकि ‘वापस’ मूल में प्रत्यक्ष निहित नहीं और ‘जीत लिया’ हिन्दी में व्यक्ति पर विजय का अनुचित भाव दे सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। प्रत्यक्ष सम्बोधन में ‘तुम’ रखा गया है। ‘उसे उसकी गलती बताओ’ निजी सुधार के भाव को स्पष्ट करता है और अनावश्यक कठोरता से बचता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
