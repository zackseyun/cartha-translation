  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: hi
  text: इसलिए जो कोई अपने आपको इस बालक के समान नम्र करेगा, वही स्वर्ग के राज्य में सबसे बड़ा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινώσει ἑαυτόν
  choice: अपने आपको … नम्र करेगा
  rationale: भविष्यकाल और आत्मवाचक भाव को बनाए रखते हुए स्वेच्छा से स्वयं को दीन या नीचा करने का अर्थ सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: इस बालक के समान
  rationale: ὡς की तुलना और संकेतवाचक τοῦτο, दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ὁ μείζων
  choice: सबसे बड़ा
  rationale: संदर्भ में तुलनात्मक रूप का श्रेष्ठतावाचक अर्थ है; हिन्दी में स्वाभाविक रूप से ‘सबसे बड़ा’ कहा जाता है।
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: मत्ती के विशिष्ट वाक्यांश का परिचित, अर्थ-संगत और गैर-सांप्रदायिक हिन्दी रूप।
theological_decisions:
- issue: नम्रता और राज्य में महानता का संबंध
  choice: ‘जो कोई … नम्र करेगा, वही … सबसे बड़ा है’
  alternative: ‘जो कोई … नम्र करता है, वह … बड़ा होगा’
  rationale: मूल पाठ के भविष्यकालीन ταπεινώσει और वर्तमान ἐστιν को बनाए रखा गया है। ‘वही’ οὗτός की बलात्मक पुनरुक्ति को व्यक्त करता है, बिना यह बताए कि नम्रता अर्जित उद्धार का साधन है या केवल राज्य की महानता का लक्षण।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। यूनानी वाक्य की बलात्मक संरचना को हिन्दी में ‘वही’ से स्वाभाविक रूप दिया गया है।
