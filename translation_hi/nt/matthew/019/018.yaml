  source_fidelity: Ποίας is correctly rendered as an implicit-plural “कौन-सी?” in reference to commandments. The four prohibitions are accurately represented, including φονεύσεις as “हत्या न करना” and ψευδομαρτυρήσεις as “झूठी गवाही न देना.” However, “ये:” does not adequately convey the Greek Τὸ, which functions anomalously as a substantivized article introducing the answer (“the [ones]”).
  naturalness: The register is clear and modern. “वह उससे कहता है” preserves the Greek historical present but is somewhat calqued; it remains comprehensible. “वे ये हैं:” is a more idiomatic Hindi answer to “कौन-सी?” while retaining the source’s marked introductory construction with an explanatory note.
  terminology: “हत्या,” “व्यभिचार,” “चोरी,” and “झूठी गवाही” are established, suitably precise Hindi biblical terms. No doctrinally loaded terminology has been introduced.
  issues:
  - severity: medium
    issue: The rendering “ये[a]:” weakly represents Τὸ.
    rationale: Τὸ is a singular neuter definite article used in an unusual elliptical/list-introducing construction. Hindi “ये” alone merely points forward and loses the responsive sense “the [ones]”; “वे ये हैं:” supplies the implicit answer without treating the article as grammatically ordinary.
