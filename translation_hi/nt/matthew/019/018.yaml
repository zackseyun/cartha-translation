source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: hi
  text: 'वह उससे कहता है, “कौन-सी?” यीशु ने कहा, “वे ये[a] हैं: हत्या न करना, व्यभिचार न करना, चोरी न करना और झूठी गवाही न देना,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ एकवचन नपुंसकलिंग निश्चित उपपद है, जो असामान्य रूप से आगे दी गई आज्ञाओं की सूची का परिचय देता है।
    reason: Τὸ की असामान्य और कुछ हद तक अस्पष्ट सूची-परिचायक संरचना को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: Ποίας
  choice: कौन-सी
  rationale: यह स्त्रीलिंग बहुवचन प्रश्नवाचक रूप है; प्रसंग में ‘आज्ञाएँ’ निहित हैं, इसलिए हिन्दी में ‘कौन-सी’ स्वाभाविक और सटीक है।
- source_word: Οὐ φονεύσεις
  choice: हत्या न करना
  rationale: φονεύω का अर्थ अनुचित रूप से मनुष्य की हत्या करना है; ‘मारना’ की अपेक्षा ‘हत्या करना’ अधिक सटीक है।
- source_word: Οὐ μοιχεύσεις
  choice: व्यभिचार न करना
  rationale: यह विवाहित संबंध के प्रति यौन बेवफाई के लिए प्रयुक्त मानक बाइबिलीय पद है।
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: झूठी गवाही न देना
  rationale: यह न्यायिक अथवा औपचारिक झूठी साक्षी देने के अर्थ को सीधे व्यक्त करता है।
theological_decisions:
- issue: Τὸ द्वारा आज्ञाओं की सूची का परिचय
  choice: 'ये[a]:'
  alternative: 'ये हैं: / उपपद को अनूदित न करना'
  rationale: यूनानी का Τὸ यहाँ असामान्य रूप से सूची अथवा उद्धरण का परिचय देता है। ‘ये:’ उसकी आकस्मिक संरचना को बनाए रखता है, जबकि पादटिप्पणी पाठ की व्याकरणिक असामान्यता स्पष्ट करती है और किसी एक व्याख्या को निर्णायक नहीं बनाती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ऐतिहासिक वर्तमान ‘कहता है’ को रखा गया है। दशाज्ञा की निषेधात्मक शैली के लिए ‘न करना/न देना’ प्रयोग किया गया है।
