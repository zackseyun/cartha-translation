  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: hi
  text: और फ़रीसी उसके पास आए और उसकी परीक्षा लेते हुए उससे बोले, “क्या किसी पुरुष को किसी भी कारण से अपनी पत्नी को तलाक़ देने की अनुमति है?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसी भी आधार पर” अथवा “हर कारण से।” यूनानी वाक्यांश तलाक़ के स्वीकार्य आधारों के विषय में एक व्यापक कानूनी प्रश्न व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: पास आए
  rationale: क्रिया किसी व्यक्ति की ओर आकर निकट पहुँचने का भाव देती है; ‘उसके पास आए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: πειράζοντες
  choice: परीक्षा लेते हुए
  rationale: यहाँ प्रश्न द्वारा यीशु को परखने का विरोधपूर्ण आशय है। यह अनुवाद मूल के ‘परखना/जाँचना’ अर्थ को रखता है, बिना सीधे ‘फँसाने’ को पाठ में जोड़ने के।
- source_word: ἔξεστιν
  choice: उचित है
  rationale: यह अनुमति और वैधता से जुड़ा प्रश्न है। ‘उचित है’ साधारण हिन्दी में विधि-सम्मत होने का प्रश्न व्यक्त करता है, यद्यपि ‘व्यवस्था के अनुसार उचित’ अधिक स्पष्ट विकल्प है।
- source_word: ἀνθρώπῳ
  choice: किसी पुरुष के लिए
  rationale: संज्ञा रूपतः पुल्लिंग है और ‘अपनी पत्नी’ के कारण संदर्भ में पति की बात हो रही है; इसलिए लिंग-विशिष्ट अर्थ बनाए रखा गया है।
- source_word: ἀπολῦσαι
  choice: तलाक़ देना
  rationale: विवाह के इस संदर्भ में क्रिया का मुहावरेदार कानूनी अर्थ पत्नी को विवाह-विच्छेद देना है, न कि केवल विदा करना।
- source_word: γυναῖκα αὐτοῦ
  choice: अपनी पत्नी को
  rationale: γυνή यहाँ संबंध और तलाक़ के प्रसंग में ‘पत्नी’ है; हिन्दी में कर्ता की ओर लौटता स्वामित्व ‘अपनी’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: किसी भी कारण से
  rationale: यह व्यापक प्रश्न को बनाए रखता है कि क्या हर प्रकार का कारण तलाक़ का आधार हो सकता है; किसी एक विशेष आधार तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: तलाक़ के आधारों पर पहली सदी की कानूनी बहस को बाद की किसी सांप्रदायिक व्याख्या के बिना व्यक्त करना
  choice: क्या किसी पुरुष के लिए अपनी पत्नी को किसी भी कारण से तलाक़ देना उचित है?
  alternative: क्या किसी पति को हर कारण के आधार पर अपनी पत्नी को तलाक़ देने की अनुमति है?
  rationale: पद केवल यीशु के सामने रखा गया व्यापक कानूनी प्रश्न प्रस्तुत करता है, उसका उत्तर नहीं। इसलिए अनुवाद प्रश्न की व्यापकता और तनाव को सुरक्षित रखता है तथा तलाक़ के मान्य आधारों पर कोई अतिरिक्त निर्णय नहीं देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘फ़रीसी’ और ‘तलाक़’ के प्रचलित रूप रखे गए हैं। मुख्य पाठ में कानूनी भाव सामान्य पाठक के लिए ‘उचित है’ से व्यक्त किया गया है और व्यापक आधार का संकेत पाद-टिप्पणी में स्पष्ट किया गया है।
