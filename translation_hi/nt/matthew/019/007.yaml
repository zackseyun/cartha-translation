reference: Matthew 19:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: hi
  text: उन्होंने उससे कहा, “तो फिर मूसा ने यह आज्ञा क्यों दी कि तलाक़-पत्र देकर उसे विदा कर दिया जाए[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे तलाक़ दे दिया जाए।” यूनानी क्रिया का अर्थ “विदा करना” हो सकता है और इस प्रसंग में यह तलाक़ देने के लिए प्रयुक्त हुई है।
    reason: मूल यूनानी क्रिया के शाब्दिक और प्रसंगगत-कानूनी अर्थ, दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: उन्होंने उससे कहा
  rationale: कथात्मक प्रसंग में यूनानी का वर्तमान काल ऐतिहासिक वर्तमान है; स्वाभाविक हिन्दी कथा-शैली में भूतकाल उपयुक्त है।
- source_word: Τί οὖν
  choice: तो फिर … क्यों
  rationale: यह यीशु की पिछली बात के विरुद्ध उठाई गई आपत्ति है; यह प्रयोग प्रश्न के तर्कात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐνετείλατο
  choice: आज्ञा दी
  rationale: यूनानी क्रिया स्पष्ट रूप से आदेश देने का भाव रखती है। प्रश्नकर्ताओं की अपनी प्रस्तुति को बनाए रखा गया है, भले ही अगले पद में यीशु इसे अनुमति के रूप में स्पष्ट करते हैं।
- source_word: δοῦναι βιβλίον ἀποστασίου
  choice: तलाक़-पत्र देकर
  rationale: यह व्यवस्थाविवरण 24:1 में तलाक़ के लिखित कानूनी दस्तावेज़ को सूचित करने वाला पदबंध है; ‘तलाक़-पत्र’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: उसे विदा कर दिया जाए
  rationale: यहाँ क्रिया पत्नी को भेज देने और इस प्रकार वैवाहिक संबंध समाप्त करने का संकेत देती है। ‘विदा कर दिया जाए’ मूल अभिव्यक्ति को सुरक्षित रखता है, जबकि ‘तलाक़-पत्र’ कानूनी संदर्भ स्पष्ट करता है।
theological_decisions:
- issue: क्या प्रश्नकर्ताओं की बात को अगले पद में यीशु के सुधार के अनुरूप पहले ही ‘अनुमति दी’ बनाया जाए
  choice: ‘आज्ञा दी’ को मुख्य पाठ में रखा गया
  alternative: ‘अनुमति दी’ या ‘इजाज़त दी’
  rationale: यूनानी पाठ में यहाँ ‘आज्ञा दी’ ही है। अगले पद की व्याख्या को इस पद में पहले से मिलाने के बजाय प्रश्नकर्ताओं की अपनी शब्दावली और कथन का तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण प्रश्न-वाक्य। ‘तो फिर’ आपत्ति की तार्किक कड़ी व्यक्त करता है। निष्क्रिय रचना से यूनानी infinitive के अनिर्दिष्ट कर्ता में अनावश्यक ‘हमें’ नहीं जोड़ा गया।
