  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/030.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: hi
  text: परन्तु बहुत-से जो पहले हैं, अन्तिम होंगे[a], और जो अन्तिम हैं, पहले होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: ‘परन्तु बहुत-से पहले अन्तिम होंगे, और अन्तिम पहले।’ यूनानी कथन विशेष रूप से संक्षिप्त और सूक्तिपरक है।'
    reason: शब्दशः वैकल्पिक रूप और मूल की संक्षिप्त शैली बताना।
lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से
  rationale: यह विशेषण संज्ञा के समान प्रयुक्त होकर एक व्यापक, अनिर्दिष्ट समूह को दर्शाता है। ‘बहुत-से’ स्वाभाविक है और अनावश्यक रूप से ‘लोग’ नहीं जोड़ता।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले प्रसंग से हल्का विरोध या परिवर्तन दिखाता है; ‘परन्तु’ उस भाव को गरिमापूर्ण आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ἔσονται
  choice: होंगे
  rationale: εἰμί के भविष्यकाल का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: πρῶτοι
  choice: पहले
  rationale: यहाँ पद या क्रम का भाव है। ‘पहले’ इसके व्यापक अर्थ और सूक्तिपरक विरोध को बनाए रखता है।
- source_word: ἔσχατοι
  choice: अन्तिम
  rationale: यह πρῶτοι के विपरीत पद या क्रम को दर्शाता है। ‘अन्तिम’ सीधे विरोध और कथन की गरिमा को सुरक्षित रखता है।
- source_word: πρῶτοι ἔσχατοι
  choice: जो पहले हैं, अन्तिम होंगे
  rationale: यूनानी की संक्षिप्त विशेषण-रचना को हिन्दी में स्पष्ट और स्वाभाविक बनाने के लिए ‘जो ... हैं’ जोड़ा गया है, बिना अर्थ को सीमित किए।
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: और जो अन्तिम हैं, पहले होंगे
  rationale: यूनानी में दूसरी उपवाक्य-रचना में क्रिया लुप्त है, पर पहले भाग से समझी जाती है। हिन्दी में क्रिया दोहराने से अर्थ स्पष्ट रहता है और समानांतरता बनी रहती है।
theological_decisions:
- issue: उलटाव के कथन का स्वरूप
  choice: पद या क्रम के उलटाव का सामान्य कथन, जिसका सटीक क्षेत्र अनिर्धारित रखा गया है।
  alternative: इसे विशेष रूप से उद्धार, राज्य में प्रवेश, शिष्यों के प्रतिफल, सामाजिक प्रतिष्ठा या अन्तकालीन पद से जोड़ना।
  rationale: पद स्वयं इस सूक्ति के सटीक क्षेत्र को परिभाषित नहीं करता। व्यापक और सूक्तिपरक अनुवाद मूल की धर्मवैचारिक अस्पष्टता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप। ‘पहले/अन्तिम’ की सीधी जोड़ी मूल की सूक्तिपरक शक्ति बनाए रखती है; मुख्य पाठ में स्पष्टता के लिए ‘जो ... हैं’ और दूसरे भाग में ‘होंगे’ दिया गया है।
