source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: hi
  text: यीशु ने उनसे कहा, “तुम्हारे हृदय की कठोरता के कारण[a] मूसा ने तुम्हें तुम्हारी पत्नियों को तलाक देने की अनुमति दी[b], पर आरम्भ से ऐसा नहीं था[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी कठोरहृदयता को देखते हुए।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तुम्हारी पत्नियों को विदा करने”; इस प्रसंग में इसका अर्थ तलाक देना है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात यह अनुमति सृष्टि के आरम्भ की मूल व्यवस्था को व्यक्त नहीं करती थी।
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: यीशु ने उनसे कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथा में सामान्य भूतकाल स्वाभाविक है। प्रसंग से निहित कर्ता यीशु को स्पष्ट करने से हिन्दी में संदर्भ साफ रहता है।
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: तुम्हारे हृदय की कठोरता के कारण
  rationale: πρός के कारण अथवा आधार-सूचक अर्थ को स्पष्ट करता है और ‘हृदय की कठोरता’ के बाइबलीय मूर्त रूपक को बनाए रखता है।
- source_word: ἐπέτρεψεν
  choice: अनुमति दी
  rationale: यह क्रिया आज्ञा देने या अनुमोदन करने के बजाय अनुमति अथवा रियायत देने का अर्थ रखती है।
- source_word: ἀπολῦσαι
  choice: तलाक देने
  rationale: वैवाहिक प्रसंग में इसका अर्थ केवल विदा करना नहीं, बल्कि विवाह-विच्छेद करना है।
- source_word: τὰς γυναῖκας ὑμῶν
  choice: अपनी पत्नियों को
  rationale: γυνή का अर्थ स्त्री या पत्नी हो सकता है; विवाह और तलाक के इस प्रसंग में ‘पत्नियाँ’ उपयुक्त है।
- source_word: ἀπ’ ἀρχῆς
  choice: आरम्भ से
  rationale: यह सृष्टि के आरम्भ की ओर प्रसंगगत संकेत को संक्षिप्त और स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: οὐ γέγονεν οὕτως
  choice: ऐसा नहीं था
  rationale: यूनानी पूर्णकाल यहाँ स्थापित स्थिति को व्यक्त करता है। हिन्दी में यह वाक्यांश मूल व्यवस्था के विषय में स्वाभाविक है और अर्थ को अनावश्यक रूप से नहीं खोलता।
theological_decisions:
- issue: मूसा की व्यवस्था को आज्ञा, स्वीकृति या रियायत के रूप में प्रस्तुत करना
  choice: मूसा ने ... अनुमति दी
  alternative: मूसा ने ... आज्ञा दी
  rationale: ἐπέτρεψεν स्पष्टतः अनुमति को दर्शाता है, सकारात्मक आज्ञा को नहीं; इससे यीशु की दलील में मानवीय कठोरता के कारण दी गई रियायत और आरम्भिक व्यवस्था के बीच अंतर बना रहता है।
- issue: आरम्भ की ओर यीशु के संकेत को कितना स्पष्ट करना
  choice: पर आरम्भ से ऐसा नहीं था
  alternative: पर आरम्भ में परमेश्वर की योजना ऐसी नहीं थी
  rationale: चुना हुआ पाठ यूनानी की संक्षिप्तता और प्रसंगगत तनाव को बनाए रखता है; ‘परमेश्वर की योजना’ कहना सही व्याख्यात्मक निष्कर्ष हो सकता है, पर वह मूल वाक्य से अधिक स्पष्ट विस्तार होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। ‘हृदय की कठोरता’ बाइबलीय रूपक को सुरक्षित रखता है, जबकि ‘तलाक’ प्रसंग का कानूनी अर्थ स्पष्ट करता है।
