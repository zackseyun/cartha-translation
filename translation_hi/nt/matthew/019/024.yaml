reference: Matthew 19:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: hi
  text: 'मैं तुमसे फिर कहता हूँ: किसी धनी व्यक्ति का परमेश्वर के राज्य में प्रवेश करने की अपेक्षा ऊँट का सुई के छेद से होकर निकल जाना आसान है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ लोगों ने ‘ऊँट’ के स्थान पर ‘रस्सा’ का सुझाव दिया है, पर यहाँ यूनानी पाठ में ‘ऊँट’ ही है।
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: मैं तुमसे फिर कहता हूँ
  rationale: πάλιν पुनरुक्ति को दर्शाता है; δέ यहाँ हल्का संयोजक है, जिसे स्वाभाविक हिन्दी में अलग शब्द देना आवश्यक नहीं। यह वाक्यांश सीधे संबोधन और वर्तमान कथन की शक्ति बनाए रखता है।
- source_word: εὐκοπώτερόν ἐστιν
  choice: उससे आसान है
  rationale: तुलनात्मक विशेषण को हिन्दी की स्वाभाविक तुलनात्मक रचना में व्यक्त किया गया है, जिससे दोनों infinitive खंडों की तुलना स्पष्ट रहती है।
- source_word: κάμηλον
  choice: ऊँट
  rationale: यूनानी पाठ κάμηλον का सामान्य और प्रमाणित अर्थ ‘ऊँट’ है; ‘रस्सा’ पाठ में नहीं है और अतिशयोक्तिपूर्ण चित्र को अनावश्यक रूप से नरम करता है।
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: सुई के छेद में से
  rationale: यह सिलाई की सुई के छेद को सूचित करता है। ‘में से’ διά के आर-पार जाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰσελθεῖν
  choice: निकल जाना / प्रवेश करना
  rationale: पहले खंड में सुई के छेद से होकर जाने के लिए ‘निकल जाना’ और दूसरे में राज्य में जाने के लिए ‘प्रवेश करना’ प्रसंगानुकूल हिन्दी समतुल्य हैं; दोनों एक ही यूनानी क्रिया की गतिशीलता बनाए रखते हैं।
- source_word: ἢ πλούσιον
  choice: किसी धनी व्यक्ति का ... जितना कठिन है, उससे
  rationale: πλούσιον किसी धनवान मनुष्य को सूचित करता है। ‘धनी व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक है और कथन के सामान्य मानवीय संदर्भ को बिना अनावश्यक लिंग-विशेष जोड़ के व्यक्त करता है।
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर के राज्य में प्रवेश करना
  rationale: εἰς का गमन-लक्ष्य ‘में प्रवेश करना’ से स्पष्ट होता है और βασιλεία τοῦ θεοῦ का स्थापित अर्थ ‘परमेश्वर का राज्य’ सुरक्षित रहता है।
theological_decisions:
- issue: ऊँट और सुई के छेद के चित्र का अर्थ
  choice: अत्यंत कठिन अथवा मानवीय दृष्टि से असंभव बात को प्रबल अतिशयोक्तिपूर्ण तुलना के रूप में यथावत रखा गया है।
  alternative: इसे यरूशलेम के किसी कथित ‘सुई-द्वार’ का संकेत मानना या ‘ऊँट’ के स्थान पर ‘रस्सा’ पढ़ना।
  rationale: यूनानी पाठ सीधे ‘ऊँट’ और सिलाई की ‘सुई के छेद’ का असंभव-सा चित्र प्रस्तुत करता है। संदर्भ की धर्मवैचारिक तीव्रता को किसी अप्रमाणित द्वार या वैकल्पिक शब्द से कम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। हिन्दी में अधिक स्वाभाविक तुलना के लिए यूनानी क्रम को पुनर्गठित किया गया है, पर कथन की तीखी अतिशयोक्ति और परमेश्वर के राज्य में प्रवेश का भाव सुरक्षित है।
