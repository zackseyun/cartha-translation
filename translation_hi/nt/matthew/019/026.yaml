id: MAT.19.26
reference: Matthew 19:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: hi
  text: पर यीशु ने उनकी ओर देखकर उनसे कहा, “मनुष्यों के लिए यह असम्भव है, पर परमेश्वर के लिए सब कुछ सम्भव है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: उनकी ओर देखकर
  rationale: यह क्रिया किसी की ओर दृष्टि करने को व्यक्त करती है। ‘उनकी ओर देखकर’ स्वाभाविक हिन्दी में सहभागी क्रिया का कथात्मक संबंध बनाए रखता है, बिना दृष्टि की तीव्रता बढ़ाए।
- source_word: δὲ
  choice: पर
  rationale: यहाँ δέ हल्का विरोध दर्शाता है और शिष्यों की चिंता के उत्तर में आने वाले कथन को पिछले प्रसंग से जोड़ता है।
- source_word: εἶπεν αὐτοῖς
  choice: उनसे कहा
  rationale: यूनानी में αὐτοῖς स्पष्ट है; ‘उनसे कहा’ उसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: παρὰ ἀνθρώποις
  choice: मनुष्यों के लिए
  rationale: παρά के साथ सम्प्रदान यहाँ क्षेत्र अथवा जिस पक्ष के विषय में बात हो रही है उसे दर्शाता है। ἄνθρωποις समस्त मानवजाति के लिए प्रयुक्त है, इसलिए ‘मनुष्यों के लिए’ सटीक और सहज है।
- source_word: τοῦτο
  choice: यह
  rationale: संकेतवाचक शब्द पिछले प्रसंग में उठे उद्धार के प्रश्न की ओर संकेत करता है; साधारण ‘यह’ उसी संदर्भ को खुला रखता है।
- source_word: ἀδύνατόν ἐστιν
  choice: असम्भव है
  rationale: यह विधेय विशेषण और सहायक क्रिया का सीधा, प्रचलित हिन्दी रूप है।
- source_word: παρὰ δὲ θεῷ
  choice: पर परमेश्वर के लिए
  rationale: दोहराए गए παρά + सम्प्रदान के समानांतर ढाँचे को ‘के लिए’ द्वारा बनाए रखा गया है, जिससे मनुष्यों और परमेश्वर का विरोध स्पष्ट रहता है।
- source_word: πάντα δυνατά
  choice: सब कुछ सम्भव है
  rationale: यह πάντα की व्यापकता और δυνατά के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है; इसे परमेश्वर की क्षमता के विषय में कथन ही रहने दिया गया है।
theological_decisions:
- issue: ἄνθρωποις का सामान्य मानवता के अर्थ में अनुवाद
  choice: मनुष्यों
  alternative: लोगों
  rationale: यूनानी पुल्लिंग बहुवचन यहाँ किसी विशेष लिंग को नहीं, बल्कि मानवजाति को सामान्य रूप से दर्शाता है। ‘मनुष्यों’ से परमेश्वर और मानवता के बीच मूल विरोध स्पष्ट तथा समावेशी रहता है।
- issue: πάντα δυνατά की व्यापक अभिव्यक्ति
  choice: सब कुछ सम्भव है
  alternative: सभी बातें सम्भव हैं
  rationale: मूल कथन की व्यापकता को सुरक्षित रखा गया है और संदर्भ से परे उसकी कोई विशेष धर्मवैज्ञानिक सीमा अथवा अर्थ अनुवाद में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सहज रखी गई है। ‘असम्भव/सम्भव’ की समान शब्दावली तथा ‘मनुष्यों के लिए/परमेश्वर के लिए’ का समानांतर ढाँचा मूल वाक्य की प्रभावशाली विरोधात्मक रचना बनाए रखता है।
