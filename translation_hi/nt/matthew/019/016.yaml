base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: hi
  text: और देखो, एक व्यक्ति उसके पास आया और बोला, “गुरु, अनन्त जीवन पाने के लिए मैं कौन-सा भला काम करूँ?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं कौन-सी भली बात करूँ कि मुझे अनन्त जीवन मिले?” यूनानी पद τί ἀγαθὸν का अर्थ “भली बात” या, ‘करना’ क्रिया के साथ, “भला काम” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: और देखो
  rationale: καί को ‘और’ तथा ἰδού के ध्यान आकर्षित करने वाले कथात्मक बल को स्वाभाविक आधुनिक हिन्दी में ‘देखो’ से व्यक्त किया गया है।
- source_word: εἷς
  choice: एक व्यक्ति
  rationale: यूनानी में केवल ‘एक’ है; हिन्दी में अकेला ‘एक’ अस्वाभाविक होता, इसलिए ‘व्यक्ति’ जोड़ा गया है, पर ‘पुरुष’ या ‘धनी युवक’ जैसी बाद की जानकारी नहीं लाई गई।
- source_word: προσελθὼν αὐτῷ εἶπεν
  choice: उसके पास आया और बोला
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले निकट आने की क्रिया दर्शाता है। हिन्दी में समन्वित क्रम अधिक स्वाभाविक है और घटनाक्रम सुरक्षित रखता है।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: यह शिक्षक/उपदेशक के आदरसूचक संबोधन के रूप में आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: τί ἀγαθὸν ποιήσω
  choice: मैं कौन-सा भला काम करूँ
  rationale: τί ἀγαθόν का खुला अर्थ ‘कौन-सी भली बात/कौन-सा भला काम’ हो सकता है। ποιήσω के साथ ‘भला काम’ सहज है; ‘करूँ’ विचार-विमर्शसूचक प्रश्न का बल बनाए रखता है, बिना अनावश्यक रूप से बाध्यता जोड़ने के।
- source_word: ἵνα σχῶ ζωὴν αἰώνιον
  choice: अनन्त जीवन पाने के लिए
  rationale: ἵνα का प्रयोजन और σχῶ का ‘प्राप्त करना/अपने पास होना’ भाव सहज हिन्दी में व्यक्त होता है। स्थापित पद ‘अनन्त जीवन’ ζωὴν αἰώνιον के लिए उपयुक्त है।
theological_decisions:
- issue: वक्ता की पहचान
  choice: एक व्यक्ति
  alternative: एक पुरुष; एक धनी युवक
  rationale: इस पद का εἷς केवल ‘एक’ कहता है। लिंग या बाद के प्रसंग से प्राप्त ‘धनी युवक’ की पहचान समय से पहले नहीं जोड़ी गई।
- issue: कर्म और अनन्त जीवन के बीच प्रश्न में व्यक्त संबंध
  choice: अनन्त जीवन पाने के लिए मैं कौन-सा भला काम करूँ?
  alternative: अनन्त जीवन का अधिकारी होने के लिए मुझे कौन-सा पुण्य-कर्म करना चाहिए?
  rationale: अनुवाद प्रश्न के कर्म-केंद्रित और प्रयोजनसूचक स्वरूप को बनाए रखता है, पर ‘पुण्य’, ‘योग्यता’ या किसी निश्चित उद्धार-सिद्धान्त को मूल से अधिक स्पष्ट नहीं करता।
- issue: ποιήσω की विधा
  choice: करूँ
  alternative: मुझे करना ही होगा; मुझे करना चाहिए
  rationale: अओरिस्ट सब्जंक्टिव यहाँ विचार-विमर्शसूचक प्रश्न है। ‘करूँ’ इस खुले प्रश्न को सुरक्षित रखता है और ‘अवश्य’ जैसी अतिरिक्त बाध्यता नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, आदरपूर्ण और कथात्मक शैली। ‘देखो’ मूल के ध्यानाकर्षक पद को रखता है। ‘एक व्यक्ति’ हिन्दी की स्वाभाविकता के लिए न्यूनतम स्पष्टता देता है, जबकि बाद के प्रसंग की पहचान नहीं जोड़ता।
