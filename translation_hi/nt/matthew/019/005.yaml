source:
  edition: SBLGNT
  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: hi
  text: और कहा, ‘इस कारण पुरुष अपने पिता और माता को छोड़ देगा और अपनी पत्नी से जुड़ जाएगा[a], और वे दोनों एक देह हो जाएँगे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी पत्नी के साथ एक हो जाएगा’ अथवा ‘अपनी पत्नी से घनिष्ठ रूप से जुड़ जाएगा।’ यूनानी क्रिया निकट लगाव का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: इस कारण
  rationale: यह सहज आधुनिक हिन्दी में कारण और निष्कर्ष—दोनों का संबंध स्पष्ट करता है।
- source_word: καταλείψει
  choice: छोड़ देगा
  rationale: भविष्यकाल को स्वाभाविक हिन्दी में व्यक्त करता है और मूल कथन की सूत्रात्मक शक्ति बनाए रखता है।
- source_word: ἄνθρωπος
  choice: पुरुष
  rationale: उत्पत्ति से लिए गए इस विवाह-संबंधी उद्धरण में यह शब्द पत्नी के पुरुष साथी को विशेष रूप से दर्शाता है।
- source_word: κολληθήσεται
  choice: जुड़ जाएगा
  rationale: यह क्रिया घनिष्ठ और स्थायी जुड़ाव का बोध कराती है; चुना गया रूप स्पष्ट है और अनावश्यक भावात्मक व्याख्या नहीं जोड़ता।
- source_word: γυναικὶ αὐτοῦ
  choice: अपनी पत्नी से
  rationale: विवाह के प्रसंग में γυνή का अर्थ ‘पत्नी’ है; हिन्दी में कर्ता की ओर लौटता ‘अपनी’ स्वाभाविक है।
- source_word: οἱ δύο
  choice: वे दोनों
  rationale: मूल यूनानी में दो व्यक्तियों का स्पष्ट उल्लेख है, इसलिए उसे संक्षिप्त किए बिना रखा गया है।
- source_word: εἰς σάρκα μίαν
  choice: एक देह हो जाएँगे
  rationale: यह विवाह-संबंधी मूल बिंब को बनाए रखते हुए ἔσονται εἰς में निहित परिणामी एकता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: विवाह-संबंधी उद्धरण में लिंगसूचक भाषा
  choice: पुरुष … अपनी पत्नी
  alternative: व्यक्ति … अपने जीवनसाथी
  rationale: प्रसंग और यूनानी पाठ पुरुष तथा उसकी पत्नी की विशिष्ट जोड़ी का वर्णन करते हैं; लिंग-निरपेक्ष रूप मूल की विशिष्टता को मिटा देता।
- issue: वैवाहिक एकता का मुहावरा
  choice: वे दोनों एक देह हो जाएँगे
  alternative: वे दोनों एक देह होंगे
  rationale: ‘हो जाएँगे’ εἰς के परिणामी अथवा नई अवस्था में प्रवेश करने के भाव को स्पष्ट करता है, जबकि ‘एक देह’ के धर्मवैचारिक और संबंधपरक बिंब को बिना विस्तार के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘एक देह’ परिचित बाइबलीय अभिव्यक्ति होने के साथ मूल σάρκα μίαν का सीधा बिंब सुरक्षित रखती है।
