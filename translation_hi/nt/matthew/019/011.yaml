base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: hi
  text: पर उसने उनसे कहा, “हर कोई इस बात[a] को स्वीकार नहीं कर सकता; केवल वे ही इसे स्वीकार कर सकते हैं जिन्हें यह दिया गया है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस कथन” अथवा “इस शिक्षा”।
    reason: lexical_alternative
  - marker: b
    text: “दिया गया है” में देने वाला सम्भवतः परमेश्वर है, लेकिन यूनानी पाठ कर्ता को स्पष्ट रूप से नहीं बताता।
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: कहा
  rationale: कथात्मक परिचय में λέγω के सामान्य भूतकालीन रूप का स्वाभाविक हिन्दी अनुवाद।
- source_word: Οὐ πάντες
  choice: सब लोग ... नहीं
  rationale: नकारात्मक सार्वत्रिक कथन को स्वाभाविक हिन्दी में व्यक्त करता है और यह अर्थ बनाए रखता है कि यह क्षमता सभी में नहीं है।
- source_word: χωροῦσι
  choice: स्वीकार नहीं कर सकते
  rationale: λόγος के साथ χωρέω का भाव किसी बात के लिए मन में स्थान रखने, उसे ग्रहण करने या स्वीकार करने का है; यह रूप आधुनिक हिन्दी में अर्थ को स्पष्ट रखता है।
- source_word: τὸν λόγον τοῦτον
  choice: इस बात
  rationale: यह पद तत्काल पूर्ववर्ती कथन की ओर संकेत करता है। ‘इस बात’ सहज हिन्दी है और ‘कथन’ अथवा ‘शिक्षा’ की सम्भावना को अत्यधिक सीमित नहीं करता।
- source_word: ἀλλ’ οἷς
  choice: बल्कि केवल वे ही जिन्हें
  rationale: विरोध और समूह की सीमितता दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δέδοται
  choice: यह दिया गया है
  rationale: पूर्णकालिक कर्मवाच्य को बनाए रखता है और प्रदाता का नाम नहीं जोड़ता; दी गई क्षमता या अनुग्रह के वर्तमान परिणाम का भाव भी सुरक्षित रहता है।
theological_decisions:
- issue: कर्मवाच्य ‘दिया गया है’ में निहित प्रदाता की पहचान
  choice: मुख्य पाठ में प्रदाता को अनकहा रखते हुए कर्मवाच्य बनाए रखना
  alternative: ‘जिन्हें परमेश्वर ने यह दिया है’
  rationale: यूनानी पाठ प्रदाता को स्पष्ट रूप से नहीं बताता। यहाँ परमेश्वर निहित हो सकता है, पर मुख्य पाठ में उसका नाम जोड़ना स्रोत की वास्तविक अस्पष्टता को समाप्त कर देगा।
- issue: ‘यह’ किस वस्तु को दिए जाने की ओर संकेत करता है
  choice: सर्वनाम ‘यह’ को बनाए रखना
  alternative: ‘यह क्षमता दी गई है’
  rationale: सन्दर्भ में इसका आशय उक्त बात को स्वीकार करने की क्षमता या अनुग्रह हो सकता है, पर यूनानी वाक्य इसे संज्ञा जोड़कर स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ‘इस बात’ साधारण पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी λόγος की अन्य सम्भव छायाएँ सुरक्षित रखती है।
