id: MAT.19.10
reference: Matthew 19:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: hi
  text: उसके चेलों ने उससे कहा, “यदि अपनी पत्नी के साथ पुरुष की स्थिति ऐसी है,[a] तो विवाह करना लाभदायक नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि पुरुष का अपनी पत्नी के साथ मामला ऐसा है।” यूनानी वाक्यांश संक्षिप्त है; “स्थिति” के स्थान पर “मामला” या “परिस्थिति” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: उसके चेलों ने उससे कहा
  rationale: वर्णन में यूनानी वर्तमान काल ऐतिहासिक वर्तमान है; स्वाभाविक हिन्दी कथा-शैली में भूतकाल उपयुक्त है। सर्वनाम यीशु की ओर संकेत करता है।
- source_word: μαθηταί
  choice: चेले
  rationale: सुसमाचारों में यीशु के μαθηταί के लिए प्रचलित, सहज और शिष्यत्व-संबंध को व्यक्त करने वाला शब्द।
- source_word: Εἰ οὕτως ἐστὶν ἡ αἰτία
  choice: यदि ... स्थिति ऐसी है
  rationale: αἰτία यहाँ कठोर अर्थ में ‘कारण’ नहीं, बल्कि दशा, मामला या परिस्थिति है; यह वाक्यांश οὕτως की पूर्व कथन की ओर संकेत करने वाली शक्ति भी बनाए रखता है।
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: अपनी पत्नी के साथ पुरुष की
  rationale: संदर्भ में γυνή का अर्थ ‘पत्नी’ है और ἀνήρ/ἄνθρωπος-संबंधी पुरुषवाची अभिव्यक्ति विवाह के पुरुष पक्ष को दर्शाती है। ‘अपनी’ हिन्दी में वैवाहिक संबंध स्वाभाविक बनाता है, यद्यपि यूनानी में अलग अधिकारवाचक सर्वनाम नहीं है।
- source_word: οὐ συμφέρει
  choice: लाभदायक नहीं है
  rationale: συμφέρει के लाभ या हित के मूल भाव को सीधे रखता है और ‘उचित नहीं’ कहकर नैतिक निषेध नहीं जोड़ता।
- source_word: γαμῆσαι
  choice: विवाह करना
  rationale: अओरिस्ट infinitive का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
theological_decisions:
- issue: ἀνθρώπου ... γυναικός में लिंग-सूचक भाषा
  choice: अपनी पत्नी के साथ पुरुष
  alternative: पति-पत्नी का संबंध / किसी व्यक्ति की अपने जीवनसाथी के साथ स्थिति
  rationale: तात्कालिक प्रसंग में पुरुष और पत्नी के वैवाहिक संबंध की स्पष्ट चर्चा है; लिंग-निरपेक्ष रूप मूल की विशिष्टता घटा देता।
- issue: οὐ συμφέρει का मूल्यांकनात्मक बल
  choice: लाभदायक नहीं है
  alternative: विवाह करना उचित नहीं है / विवाह करना अच्छा नहीं
  rationale: मूल पद लाभ या हित की बात करता है, अनिवार्य नैतिक निषेध की नहीं; इसलिए तनाव को बिना बढ़ाए संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। ‘चेले’ सामान्य पाठक के लिए परिचित बाइबलीय पद है। मुख्य वाक्य में ‘स्थिति’ αἰτία की संदर्भगत व्यापकता को स्वाभाविक रूप से व्यक्त करता है।
