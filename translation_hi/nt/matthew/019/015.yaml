  text: καὶ ἐπιθεὶς ⸂τὰς χεῖρας αὐτοῖς⸃ ἐπορεύθη ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/015.yaml
  text: And after laying his hands on them[a], he went on from there.
translation:
  language: hi
  text: और उन पर हाथ रखने के बाद[a] वह वहाँ से चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उन पर हाथ रखकर वह वहाँ से चला गया।”
    reason: कृदन्तीय रचना का वैकल्पिक, समानार्थी हिन्दी रूप।
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह संयोजक पिछले प्रसंग से इस क्रिया को सीधे जोड़ता है; ‘और’ बिना अतिरिक्त व्याख्या जोड़े उसके सामान्य कथात्मक बल को बनाए रखता है।
- source_word: ἐπιθεὶς
  choice: रखने के बाद
  rationale: ἐπιτίθημι का यह अनिश्चितकालिक कृदन्त मुख्य क्रिया से पहले पूरी हुई क्रिया बताता है। ‘रखने के बाद’ हिन्दी में स्वाभाविक है और घटनाओं का क्रम स्पष्ट रखता है।
- source_word: τὰς χεῖρας αὐτοῖς
  choice: उन पर हाथ
  rationale: यह पदबंध किसी व्यक्ति पर हाथ रखने की ठोस क्रिया व्यक्त करता है। हिन्दी में ‘हाथ’ को एकवचन रूप में कहना इस मुहावरे में स्वाभाविक है और यूनानी बहुवचन का आशय सुरक्षित रहता है।
- source_word: ἐπορεύθη
  choice: वह चला गया
  rationale: πορεύομαι यहाँ उस स्थान से जाने को बताता है। ‘चला गया’ आधुनिक मानक हिन्दी में स्वाभाविक है और अनावश्यक रूप से औपचारिक नहीं लगता।
- source_word: ἐκεῖθεν
  choice: वहाँ से
  rationale: ἐκεῖθεν स्थान के स्रोत को दर्शाता है; ‘वहाँ से’ इसका स्पष्ट और सहज हिन्दी रूप है।
theological_decisions:
- issue: यीशु के हाथ रखने की क्रिया का स्वरूप
  choice: मुख्य पाठ में ‘उन पर हाथ रखने’ की ठोस शारीरिक क्रिया को रखा गया है।
  alternative: मुख्य पाठ में व्याख्यात्मक रूप से ‘उन्हें आशीष देने’ कहना।
  rationale: संदर्भ आशीष का संकेत देता है, पर यूनानी पाठ स्पष्ट रूप से हाथ रखने की क्रिया कहता है। इसलिए संस्कार, अभिषेक या दीक्षा जैसी कोई अतिरिक्त धार्मिक धारणा जोड़े बिना मूल कथन सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक। ‘हस्त रखने’ जैसे कृत्रिम या अत्यधिक औपचारिक पदों से बचते हुए मूल की क्रियात्मक स्पष्टता बनाए रखी गई है।
