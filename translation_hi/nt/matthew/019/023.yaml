id: MAT.19.23
reference: Matthew 19:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: hi
  text: तब यीशु ने अपने चेलों से कहा, “मैं तुमसे सच कहता हूँ[a], धनी मनुष्य कठिनाई से[b] स्वर्ग के राज्य में प्रवेश करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आमीन, मैं तुमसे कहता हूँ।”
    reason: lexical_alternative
  - marker: b
    text: या, “मुश्किल से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: तब
  rationale: यह कथा में अगले प्रसंग की ओर बढ़ने का संकेत देता है; ‘तब’ आधुनिक हिन्दी में इस संक्रमण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: अपने चेलों से
  rationale: ‘अपने’ स्पष्ट αὐτοῦ को बनाए रखता है और ‘चेले’ सुसमाचारों के संदर्भ में μαθηταί का प्रचलित तथा सहज हिन्दी रूप है।
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यह यीशु के कथन की गंभीरता और प्रामाणिकता को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘आमीन’ वाला अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: πλούσιος
  choice: धनी मनुष्य
  rationale: यह विशेषण यहाँ संज्ञा के रूप में, पुल्लिंग एकवचन में प्रयुक्त है। ‘धनी मनुष्य’ उसका प्रतिनिधिक और लिंग-सटीक अर्थ बनाए रखता है।
- source_word: δυσκόλως
  choice: कठिनाई से
  rationale: यह क्रिया-विशेषण प्रवेश करने की कठिनता बताता है, पर इस पद में स्वयं असंभवता को बढ़ाकर व्यक्त नहीं करता।
- source_word: εἰσελεύσεται
  choice: प्रवेश करेगा
  rationale: यह भविष्यकाल के अर्थ को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: स्वर्ग के राज्य
  rationale: यह मत्ती की विशिष्ट अभिव्यक्ति का प्रचलित हिन्दी रूप है और ‘राज्य’ में राजकीय शासन तथा क्षेत्र—दोनों की अर्थ-संभावना बनी रहती है।
theological_decisions:
- issue: πλούσιος का संज्ञात्मक पुल्लिंग प्रयोग
  choice: धनी मनुष्य
  alternative: धनी व्यक्ति
  rationale: यूनानी रूप पुल्लिंग एकवचन है और एक प्रतिनिधिक मनुष्य की बात करता है; इसलिए मूल का व्याकरणिक लिंग बनाए रखा गया है, यद्यपि कथन का सिद्धांत सामान्य रूप से धनवानों पर लागू होता है।
- issue: यीशु के सूत्र Ἀμὴν λέγω ὑμῖν में Ἀμὴν
  choice: मैं तुमसे सच कहता हूँ
  alternative: आमीन, मैं तुमसे कहता हूँ
  rationale: मुख्य पाठ में सूत्र का आशय स्पष्ट और स्वाभाविक हिन्दी में दिया गया है, जबकि उसका सामी मूल-रूप पादटिप्पणी में सुरक्षित है।
- issue: δυσκόλως की कठिनता का स्तर
  choice: कठिनाई से
  alternative: मुश्किल से
  rationale: ‘कठिनाई से’ मूल क्रिया-विशेषण का सीधा अर्थ देता है और अगली आयत में आने वाली अधिक तीखी असंभवता-सदृश तुलना को समय से पहले इस आयत में नहीं मिला देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘चेले’, ‘धनी मनुष्य’ और ‘स्वर्ग का राज्य’ जैसे परिचित बाइबलीय पदों को बनाए रखते हुए वाक्य-रचना स्वाभाविक हिन्दी के अनुरूप है।
