id: MAT.19.12
reference: Matthew 19:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: hi
  text: क्योंकि कुछ नपुंसक ऐसे हैं जो माँ के गर्भ से ही ऐसे जन्मे हैं, कुछ ऐसे हैं जिन्हें लोगों ने नपुंसक बनाया है, और कुछ ऐसे हैं जिन्होंने स्वर्ग के राज्य के लिए अपने आपको नपुंसक बना लिया है[a]। जो इसे स्वीकार कर सकता है, वह स्वीकार करे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आपको बधिया कर लिया है।” बहुत-से लोग इसे परमेश्वर के राज्य के लिए विवाह न करने का चुनाव करने के रूपक के रूप में समझते हैं।
    reason: alternative_reading
  - marker: b
    text: या, “जो इसे ग्रहण कर सकता है, वह ग्रहण करे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: नपुंसक
  rationale: यह प्रचलित हिन्दी शब्द यूनानी संज्ञा की तीनों आवृत्तियों में एकरूपता बनाए रखता है और तीसरी श्रेणी को पहले से ही ‘ब्रह्मचारी’ कहकर उसकी व्याख्या तय नहीं कर देता।
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: माँ के गर्भ से ही ऐसे जन्मे हैं
  rationale: यह मूल के सजीव मुहावरे और οὕτως (‘ऐसे’) को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: जिन्हें लोगों ने नपुंसक बनाया है
  rationale: यह संज्ञा और क्रिया का शब्द-संबंध बनाए रखता है। ‘लोगों’ से οἱ ἄνθρωποι का सामान्य मानवीय अर्थ आता है; ‘बधिया किया’ अधिक शारीरिक और संकीर्ण अभिव्यक्ति होती।
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: अपने आपको नपुंसक बना लिया है
  rationale: यह यूनानी की जानबूझकर तीखी और संदिग्ध अभिव्यक्ति को सीधे रखता है, बिना यह निर्धारित किए कि आशय शाब्दिक अंगच्छेदन है या विवाह-त्याग का रूपक।
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: स्वर्ग के राज्य के लिए
  rationale: διά के उद्देश्य या प्रेरणा के भाव को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: जो इसे स्वीकार कर सकता है, वह स्वीकार करे
  rationale: χωρέω के यहाँ प्रयुक्त मुहावरेदार अर्थ—कठिन शिक्षा को अपने भीतर स्थान देना या मान लेना—को आधुनिक हिन्दी में स्पष्ट करता है और आज्ञार्थक बल बनाए रखता है।
theological_decisions:
- issue: क्या εὐνούχισαν ἑαυτοὺς को शाब्दिक या रूपकात्मक समझा जाए
  choice: मुख्य पाठ में ‘अपने आपको नपुंसक बना लिया’ रखकर मूल की शाब्दिक शब्दावली और उसका तनाव सुरक्षित रखा गया है।
  alternative: ‘अपने आपको बधिया कर लिया’ अथवा ‘विवाह न करने का चुनाव किया।’
  rationale: पद स्वयं यह स्पष्ट नहीं करता कि तीसरी श्रेणी का कथन शाब्दिक, अतिशयोक्तिपूर्ण या परमेश्वर के राज्य के लिए स्वैच्छिक अविवाहित जीवन का रूपक है। अनुवाद इस प्रश्न को चुपचाप तय नहीं करता; टिप्पणी प्रमुख व्याख्यात्मक संभावना बताती है।
- issue: ὁ δυνάμενος χωρεῖν χωρείτω का अर्थ
  choice: ‘स्वीकार कर सकता है ... स्वीकार करे।’
  alternative: ‘ग्रहण कर सकता है ... ग्रहण करे’ अथवा ‘इसके लिए अपने भीतर स्थान दे सकता है ... स्थान दे।’
  rationale: ‘स्वीकार’ कठिन शिक्षा को समझकर अपनाने का मुहावरेदार भाव साफ़ ढंग से देता है, जबकि टिप्पणी अधिक शब्दशः विकल्प को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नपुंसक’ की पुनरावृत्ति मूल यूनानी की संज्ञा-क्रिया शृंखला को यथासंभव सुरक्षित रखती है। टिप्पणियों के चिह्न संबंधित कठिन अभिव्यक्तियों के तुरंत बाद लगाए गए हैं।
