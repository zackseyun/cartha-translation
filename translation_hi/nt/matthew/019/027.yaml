review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys Peter, the leaving of everything, and the question about what they will receive. However, λέγειν after ἀποκριθείς specifically frames Peter's words as an answer; this is not represented by simply “कहा.” The idiom “आपके पीछे हो लिए हैं” can mean joining someone or taking up a position behind them, but is less precise than the discipleship sense of ἠκολουθήσαμεν σοι.
  naturalness: The draft is fluent modern Hindi. “हम सब कुछ छोड़कर” is natural, but “हम सब कुछ छोड़ आए हैं” better preserves the completed action without making the participial linkage sound merely sequential. “हमारा अनुसरण किया है” is standard, clear Hindi in this context.
  terminology: “पतरस” is the established Hindi form. Respectful second-person language for Jesus is consistently maintained. “देखिए” suitably renders ἰδού as a discourse-attention marker, and “हमें क्या मिलेगा?” appropriately gives the contextual force of τί ἄρα ἔσται ἡμῖν without interpretive overstatement.
  issues:
  - severity: medium
    issue: ἀποκριθεὶς (“answering/in reply”) is omitted.
    rationale: The Greek explicitly introduces Peter's statement as a response. “उत्तर में ... कहा” retains this discourse relationship naturally in Hindi.
  - severity: low
    issue: “आपके पीछे हो लिए हैं” is less exact for ἠκολουθήσαμεν σοι.
    rationale: Although idiomatic, it can suggest merely having joined or gone behind Jesus. “आपका अनुसरण किया है” clearly conveys following Jesus as disciples while retaining the source's broad sense.
  revised_text: तब पतरस ने उत्तर में उससे कहा, “देखिए, हम सब कुछ छोड़ आए हैं और आपका अनुसरण किया है। तो हमें क्या मिलेगा?”
  revised_footnotes: []
  revision_rationale: The revision restores the explicit responsive force of ἀποκριθείς and uses unambiguous, modern Hindi for the disciples' completed act of following Jesus. It retains the source's emphasis, respectful register, and the contextual but non-doctrinally loaded question about what they will receive.
