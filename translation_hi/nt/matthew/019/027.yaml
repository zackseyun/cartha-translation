  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: hi
  text: तब पतरस ने उत्तर में उससे कहा, “देखिए, हम सब कुछ छोड़ आए हैं और आपका अनुसरण किया है। तो हमें क्या मिलेगा?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; आधुनिक आदरपूर्ण हिन्दी में “देखिए” स्वाभाविक है और कथन पर बल बनाए रखता है।
- source_word: ἀφήκαμεν πάντα
  choice: हम सब कुछ छोड़कर
  rationale: मूल के पूर्ण क्रियात्मक भाव और πάντα की व्यापकता को सीधे व्यक्त करता है।
- source_word: ἠκολουθήσαμέν σοι
  choice: आपके पीछे हो लिए हैं
  rationale: शिष्य के रूप में पीछे चलने/अनुसरण करने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: तो हमें क्या मिलेगा?
  rationale: शाब्दिक “हमारे लिए क्या होगा?” का प्रसंगगत अर्थ अपेक्षित प्रतिफल से जुड़ा है; “मिलेगा” आधुनिक हिन्दी में स्पष्ट और सहज है।
theological_decisions:
- issue: पतरस के प्रश्न में प्रतिफल की अपेक्षा
  choice: तो हमें क्या मिलेगा?
  alternative: तो हमारे लिए क्या होगा?
  rationale: प्रसंग में त्याग के बदले मिलने वाली वस्तु/प्रतिफल का प्रश्न है। अनुवाद प्रश्न की संभावित स्वार्थपरता या वैधता पर कोई अतिरिक्त निर्णय नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी; यीशु के लिए आदरसूचक “आप” का प्रयोग। भाषा सरल, मौखिक और गरिमापूर्ण रखी गई है।
