base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: hi
  text: उस युवक ने उससे कहा, “इन सबका तो मैंने पालन किया है। मुझमें अब भी क्या कमी है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथा-शैली में भूतकाल ‘कहा’ अधिक स्वाभाविक है और घटना का अर्थ सुरक्षित रखता है।
- source_word: αὐτῷ
  choice: उससे
  rationale: ‘उससे कहा’ हिन्दी में दत्तिव संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ νεανίσκος
  choice: उस जवान ने
  rationale: νεανίσκος का अर्थ युवा पुरुष है। ‘जवान’ सहज आधुनिक हिन्दी है; ‘युवा शासक’ इस पद में न दी गई जानकारी जोड़ देगा।
- source_word: Πάντα ταῦτα
  choice: इन सबका
  rationale: यह पहले बताई गई आज्ञाओं की ओर संकेत करता है; ‘इन सबका’ संक्षिप्त और स्वाभाविक है।
- source_word: ἐφύλαξα
  choice: मैंने पालन किया है
  rationale: φυλάσσω यहाँ आज्ञाओं को मानने या उनका पालन करने के अर्थ में है। पूर्णकालीन हिन्दी रूप बीते आचरण की वर्तमान प्रासंगिकता दिखाता है।
- source_word: τί ἔτι ὑστερῶ
  choice: मुझमें अब भी क्या कमी है?
  rationale: ὑστερέω कमी होने या पीछे रह जाने को व्यक्त करता है। यह हिन्दी प्रश्न मूल की शेष कमी संबंधी अस्पष्टता को स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: आज्ञापालन के विषय में जवान का आत्म-मूल्यांकन
  choice: उसके दावे को बिना समर्थन, व्यंग्य या निंदा जोड़े सीधे कथन के रूप में रखा गया है।
  alternative: कथन को आत्मभ्रम या अतिशयोक्ति का संकेत देते हुए अनूदित करना।
  rationale: यूनानी पाठ उसका दावा सीधे प्रस्तुत करता है; उसकी सत्यता पर धर्मवैचारिक निर्णय अनुवाद में नहीं जोड़ा जाना चाहिए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘जवान’ सामान्य पाठकों के लिए स्वाभाविक है, जबकि वाक्य की संरचना संवाद की संक्षिप्तता और मूल पाठ के धर्मवैचारिक तनाव को बनाए रखती है।
