id: MAT.19.29
reference: Matthew 19:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: hi
  text: और जिस किसी ने मेरे नाम के कारण घरों, भाइयों, बहनों, पिता, माता, पत्नी, बच्चों या खेतों को छोड़ दिया है, वह सौ गुना पाएगा और अनंत जीवन विरासत में पाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: जिस किसी ने
  rationale: यह संयोजन प्रत्येक ऐसे व्यक्ति को समाविष्ट करता है जो बताई गई शर्त पूरी करता है; ‘जिस किसी ने’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है।
- source_word: ἀφῆκεν
  choice: छोड़ दिया है
  rationale: यह पूर्ण किए गए त्याग और उसकी वर्तमान प्रासंगिकता को सहज हिन्दी में व्यक्त करता है; ‘त्याग दिया’ की अपेक्षा यह कम व्याख्यात्मक है।
- source_word: οἰκίας
  choice: घरों
  rationale: बहुवचन और संपत्ति/गृहस्थी के ठोस अर्थ को सुरक्षित रखता है।
- source_word: ἀδελφοὺς ἢ ἀδελφὰς
  choice: भाइयों, बहनों
  rationale: मूल पाठ दोनों संबंधों का अलग-अलग उल्लेख करता है, इसलिए दोनों को स्पष्ट रखा गया है।
- source_word: πατέρα ἢ μητέρα
  choice: पिता, माता
  rationale: एकवचन पारिवारिक संबंधों को सीधे और गरिमापूर्ण ढंग से प्रस्तुत करता है।
- source_word: γυναῖκα
  choice: पत्नी
  rationale: परिवार और गृहस्थी की इस सूची में γυνή का संदर्भगत अर्थ ‘पत्नी’ है, सामान्य ‘स्त्री’ नहीं।
- source_word: τέκνα
  choice: बच्चों
  rationale: संतान के लिए स्वाभाविक और व्यापक आधुनिक हिन्दी शब्द।
- source_word: ἀγρούς
  choice: खेतों
  rationale: कृषि-भूमि और आर्थिक संपत्ति के ठोस आशय को बिना अतिरिक्त विशिष्टीकरण के व्यक्त करता है।
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: मेरे नाम के कारण
  rationale: मूल के ‘मेरे नाम’ वाले मुहावरे और यीशु के व्यक्तित्व, अधिकार तथा पहचान के प्रति निष्ठा को बनाए रखते हुए कारण/प्रेरणा व्यक्त करता है।
- source_word: ἑκατονταπλασίονα
  choice: सौ गुना
  rationale: परिमाण की प्रबलता को संक्षिप्त, स्वाभाविक और प्रचलित हिन्दी में सुरक्षित रखता है।
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: अनन्त जीवन का वारिस होगा
  rationale: ‘विरासत में पाने’ की मूल धारणा को प्रचलित बाइबलीय हिन्दी में स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: γυνή का पारिवारिक त्याग की सूची में अर्थ
  choice: पत्नी
  alternative: स्त्री
  rationale: निकट संदर्भ पारिवारिक संबंधों और संपत्तियों की सूची है; ‘पत्नी’ गृहस्थी-संबंधी आशय को सुरक्षित रखता है और सामान्य रूप से स्त्रियों को छोड़ने का अनुचित अर्थ नहीं देता।
- issue: ἕνεκεν τοῦ ὀνόματός μου में ‘नाम’ का संरक्षण
  choice: मेरे नाम के कारण
  alternative: मेरे कारण
  rationale: ‘नाम’ को बनाए रखने से यीशु की पहचान, अधिकार और सार्वजनिक स्वीकृति से जुड़ा स्रोत-पाठ का धर्मवैज्ञानिक भार सुरक्षित रहता है।
- issue: ἑκατονταπλασίονα की मात्रा
  choice: सौ गुना
  alternative: सौ गुणा अधिक / सौ गुना प्रतिफल
  rationale: मूल पाठ प्रतिफल की वस्तु या गणना-पद्धति को विस्तार से नहीं बताता; ‘सौ गुना’ उसी संक्षिप्तता और संभावित तनाव को बनाए रखता है।
- issue: κληρονομήσει का विरासत-संबंधी रूपक
  choice: वारिस होगा
  alternative: विरासत में पाएगा
  rationale: चुना हुआ रूप मूल के उत्तराधिकार-विषयक रूपक को बनाए रखते हुए हिन्दी में संक्षिप्त और स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। संबंधों की सूची में विभक्ति-संगति रखी गई है और मूल की पुनरुक्त संरचना को हिन्दी की स्वाभाविकता के अनुसार संक्षिप्त किया गया है।
