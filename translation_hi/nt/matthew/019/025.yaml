id: MAT.19.25
reference: Matthew 19:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: hi
  text: यह सुनकर चेले बहुत ही चकित हुए और कहने लगे, “तो फिर कौन उद्धार पा सकता है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: यह सुनकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की परिस्थिति बताता है। ‘यह’ प्रसंग से यीशु की पिछली बात की ओर संकेत करता है और स्वाभाविक हिन्दी के लिए आवश्यक है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं
  rationale: δέ कथा को आगे बढ़ाता है या हल्का विरोध दिखाता है; ‘यह सुनकर’ से संक्रमण स्वाभाविक रूप से स्पष्ट हो जाता है।
- source_word: μαθηταὶ
  choice: चेले
  rationale: सुसमाचारों में यीशु के μαθηταί के लिए यह प्रचलित, सहज और सटीक हिन्दी शब्द है।
- source_word: ἐξεπλήσσοντο σφόδρα
  choice: बहुत ही चकित हुए
  rationale: ἐξεπλήσσοντο तीव्र विस्मय और आघात जैसी प्रतिक्रिया व्यक्त करता है, जबकि σφόδρα उसकी मात्रा को बल देता है। हिन्दी में ‘बहुत ही चकित हुए’ दोनों का स्वाभाविक संयुक्त रूप है।
- source_word: λέγοντες
  choice: और कहने लगे
  rationale: वर्तमान कृदन्त साथ होने वाली वाणी को दर्शाता है। ‘कहने लगे’ उस प्रतिक्रियात्मक कथन को स्वाभाविक हिन्दी आख्यान में व्यक्त करता है।
- source_word: Τίς ἄρα
  choice: तो फिर कौन
  rationale: Τίς व्यक्ति के विषय में प्रश्न करता है और ἄρα पिछली बात से निकले आश्चर्यपूर्ण निष्कर्ष को दर्शाता है; ‘तो फिर कौन’ दोनों भावों को सुरक्षित रखता है।
- source_word: δύναται
  choice: सकता है
  rationale: यह सामर्थ्य या संभावना का सीधा बोध देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: σωθῆναι
  choice: उद्धार पा
  rationale: राज्य में प्रवेश के निकट प्रसंग में क्रिया पूर्ण धार्मिक अर्थ में बचाए जाने को दर्शाती है। ‘उद्धार पाना’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक है और कर्मवाच्य अर्थ को बिना उसके साधन की व्याख्या किए बनाए रखता है।
theological_decisions:
- issue: प्रसंग में σωθῆναι का अर्थ
  choice: उद्धार पा सकता है
  alternative: बचाया जा सकता है; बच सकता है
  rationale: धनी व्यक्ति और परमेश्वर के राज्य में प्रवेश के तत्काल प्रसंग में प्रश्न केवल किसी सांसारिक संकट से बचने का नहीं, बल्कि पूर्ण धार्मिक अर्थ में उद्धार का है। ‘उद्धार पा सकता है’ इस अर्थ को बनाए रखता है, पर उद्धार के ढंग या साधन के बारे में कोई सांप्रदायिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक शैली। ‘चेले’ और ‘उद्धार’ व्यापक हिन्दी बाइबलीय पाठक-वर्ग के लिए परिचित हैं; वाक्य मूल यूनानी के आश्चर्य और निष्कर्षात्मक प्रश्न को बनाए रखता है।
