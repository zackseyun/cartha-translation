id: MAT.19.21
reference: Matthew 19:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: hi
  text: यीशु ने उससे कहा, “यदि तुम परिपूर्ण[a] होना चाहते हो, तो जाओ, अपनी संपत्ति बेचकर गरीबों को दे दो। तब स्वर्ग में तुम्हारा खजाना होगा। फिर आओ और मेरे पीछे चलो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पूर्ण,” “परिपक्व” अथवा “सिद्ध।” यूनानी शब्द समग्रता, पूर्णता या परिपक्वता का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: यीशु ने उससे कहा
  rationale: साधारण कथात्मक वाक्य-विन्यास मूल के वक्ता, श्रोता और तटस्थ कथन-क्रिया को स्वाभाविक हिन्दी में रखता है।
- source_word: τέλειος
  choice: परिपूर्ण
  rationale: यह शब्द पूर्णता, समग्रता अथवा परिपक्वता का भाव दे सकता है। ‘परिपूर्ण’ इस व्यापक अर्थ-क्षेत्र को बनाए रखता है; वैकल्पिक अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: ὕπαγε πώλησόν σου τὰ ὑπάρχοντα
  choice: जाओ, अपनी संपत्ति बेचकर
  rationale: आदेशों के क्रम को स्वाभाविक हिन्दी में रखा गया है। ‘संपत्ति’ τὰ ὑπάρχοντα के भौतिक स्वामित्व का संक्षिप्त सामूहिक रूप है।
- source_word: δὸς πτωχοῖς
  choice: गरीबों को दे दो
  rationale: मूल में वस्तु पूर्ववर्ती ‘संपत्ति’ से समझी जाती है; हिन्दी में ‘दे दो’ आदेश की स्पष्टता और स्वाभाविकता बनाए रखता है।
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: स्वर्ग में तुम्हारा खजाना होगा
  rationale: यह ἕξεις के ‘तुम्हारे पास होगा’ वाले अर्थ को सहज हिन्दी में व्यक्त करता है। यूनानी बहुवचन οὐρανοῖς के लिए हिन्दी का प्रचलित एकवचन ‘स्वर्ग’ अर्थ को स्वाभाविक रूप से संप्रेषित करता है।
- source_word: δεῦρο ἀκολούθει μοι
  choice: फिर आओ और मेरे पीछे चलो
  rationale: ‘आओ’ बुलावे को और ‘मेरे पीछे चलो’ यीशु का शिष्य बनने तथा उसके साथ चलने की सुसमाचारी भाषा को बनाए रखता है। ‘फिर’ पहले दिए आदेशों के बाद की क्रमिकता स्पष्ट करता है।
theological_decisions:
- issue: τέλειος का शिष्यत्व के संदर्भ में अर्थ
  choice: मुख्य पाठ में ‘परिपूर्ण’
  alternative: ‘पूर्ण’, ‘परिपक्व’ या ‘सिद्ध’
  rationale: ‘परिपूर्ण’ यीशु की समग्र और अविभाजित निष्ठा की मांग को व्यक्त करता है, पर इसे अनिवार्य रूप से पापरहित सिद्धता के किसी बाद के धर्मसैद्धांतिक दावे तक सीमित नहीं करता। मूल शब्द की वास्तविक अर्थगत व्यापकता पाद-टिप्पणी में सुरक्षित है।
- issue: स्वर्गीय खजाने का स्वरूप
  choice: ‘स्वर्ग में तुम्हारा खजाना होगा’
  alternative: ‘तुम्हें स्वर्ग में खजाना मिलेगा’
  rationale: यह अनुवाद प्रतिफल की बात को बनाए रखता है, पर खजाने के स्वरूप या उसे पाने के सटीक समय के बारे में मूल से अधिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परिपूर्ण’ धर्मग्रंथीय संदर्भ के अनुकूल है, जबकि पाद-टिप्पणी साधारण पाठक के लिए उसकी अर्थगत व्यापकता स्पष्ट करती है। छोटे वाक्यों में विभाजन से आदेश, प्रतिज्ञा और बुलावे का क्रम साफ रहता है।
