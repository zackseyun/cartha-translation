  source_fidelity: The translation accurately conveys ἀποκριθεὶς εἶπεν as “उसने उत्तर दिया,” retains the challenging perfect question in “क्या तुमने नहीं पढ़ा,” and represents the articular participle ὁ κτίσας with “जिसने … सृजा.” “आरम्भ से” is appropriately connected with the creating action, and the distinct verbs κτίζω and ποιέω are preserved through “सृजा” and “बनाया.” “नर और नारी” faithfully retains the Genesis-derived pair ἄρσεν καὶ θῆλυ without importing interpretive conclusions.
