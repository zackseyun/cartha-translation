reference: Matthew 19:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: hi
  text: उसने उत्तर दिया, “क्या तुमने नहीं पढ़ा कि जिसने आरम्भ से उन्हें सृजा, उसने उन्हें नर और नारी बनाया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: उसने उत्तर दिया
  rationale: कृदन्त और सीमित क्रिया के इस यूनानी प्रयोग को स्वाभाविक हिन्दी में एक ही कथन-क्रिया से व्यक्त किया गया है; ‘उत्तर देकर कहा’ अनावश्यक रूप से बोझिल होता।
- source_word: Οὐκ ἀνέγνωτε
  choice: क्या तुमने नहीं पढ़ा
  rationale: यह प्रश्न श्रोताओं को उनके पवित्रशास्त्र-पाठ की याद दिलाते हुए चुनौती देता है। हिन्दी का पूर्णतासूचक रूप इस वर्तमान प्रासंगिकता को स्वाभाविक ढंग से रखता है।
- source_word: ὁ κτίσας
  choice: जिसने … सृजा
  rationale: संज्ञीकृत कृदन्त को उपाधि ‘सृष्टिकर्ता’ बनाने के बजाय सम्बन्धवाचक रचना से व्यक्त किया गया है, जिससे यूनानी रूप और क्रिया दोनों सुरक्षित रहते हैं।
- source_word: ἀπ’ ἀρχῆς
  choice: आरम्भ से
  rationale: यह उत्पत्ति-वृत्तान्त की भाषा की ओर संकेत करता है और यूनानी पदबंध का निकट, स्वाभाविक हिन्दी रूप है। शब्दक्रम इसे ‘सृजा’ से सम्बद्ध रखता है।
- source_word: ἄρσεν καὶ θῆλυ
  choice: नर और नारी
  rationale: यह सृष्टि-वर्णन की लैंगिक जोड़ी को सीधे बनाए रखता है। ‘पुरुष और स्त्री’ की तुलना में ‘नर और नारी’ मूल के जैविक/सृष्टिगत वर्गीकरण को अधिक स्पष्टता से व्यक्त करता है।
- source_word: ἐποίησεν αὐτούς
  choice: उसने उन्हें … बनाया
  rationale: κτίζω के लिए ‘सृजा’ और ποιέω के लिए ‘बनाया’ रखकर मूल की दो अलग क्रियाओं का भेद सुरक्षित किया गया है और अनावश्यक पुनरुक्ति से बचा गया है।
theological_decisions:
- issue: उत्पत्ति 1:27 के सृष्टि-वचन का अनुवाद
  choice: ‘नर और नारी’ की सृष्टिगत जोड़ी को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘पुरुष और स्त्री’ या ‘एक नर और एक नारी’
  rationale: यीशु सीधे सृष्टि-वृत्तान्त की भाषा की ओर संकेत करते हैं। चुना हुआ रूप मूल के युग्म को सुरक्षित रखता है, पर इस पद से आगे कोई अतिरिक्त सिद्धान्तगत निष्कर्ष नहीं जोड़ता।
- issue: ἀπ’ ἀρχῆς का वाक्यगत सम्बन्ध
  choice: ‘आरम्भ से’ को ‘सृजा’ के निकट रखा गया है।
  alternative: ‘कि आरम्भ से सृष्टिकर्ता ने…’
  rationale: यूनानी शब्दक्रम में यह पदबंध ὁ κτίσας के बाद आता है और सृष्टि-कार्य की आरम्भिकता पर बल दे सकता है। हिन्दी शब्दक्रम उस सम्भावित सम्बन्ध को स्पष्ट रखता है, जबकि मूल कथन का आशय नहीं बढ़ाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आरम्भ’, ‘सृजा’, और ‘नारी’ साहित्यिक तो हैं, पर प्रचलित बाइबलीय हिन्दी में स्पष्ट हैं। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
