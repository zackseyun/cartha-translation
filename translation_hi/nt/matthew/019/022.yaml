lexical_decisions:
- source_word: ἀκούσας
  choice: जब ... सुनी
  rationale: कालवाचक अर्थ में प्रयुक्त एओरिस्ट कृदन्त को स्वाभाविक हिन्दी में ‘जब ... सुनी’ कहा गया है; इससे घटनाओं का क्रम स्पष्ट रहता है।
- source_word: δὲ
  choice: पर
  rationale: δέ यहाँ पिछली बात पर युवक की नकारात्मक प्रतिक्रिया के रूप में हल्का विरोध अथवा कथानक का मोड़ दिखाता है।
- source_word: νεανίσκος
  choice: जवान
  rationale: शब्द का अर्थ जवान अथवा युवा पुरुष है। ‘जवान’ आधुनिक सामान्य हिन्दी में सहज है; ‘शासक’ जोड़ना समानान्तर वृत्तान्त की सूचना को इस पद में आयात करना होगा।
- source_word: τὸν λόγον
  choice: यह बात
  rationale: सन्दर्भ में λόγος यीशु की ठीक पिछली कही हुई बात को सूचित करता है। ‘यह बात’ स्वाभाविक हिन्दी है और सन्दर्भगत निर्देश को स्पष्ट रखता है।
- source_word: ἀπῆλθεν
  choice: चला गया
  rationale: यह जाने अथवा वहाँ से विदा होने की सामान्य कथात्मक क्रिया है; ‘चला गया’ सहज आधुनिक हिन्दी रूप है।
- source_word: λυπούμενος
  choice: दुःखी होकर
  rationale: वर्तमान कृदन्त उसके जाते समय साथ बनी हुई मनःस्थिति बताता है। ‘दुःखी होकर’ क्रिया और अवस्था दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἦν γὰρ ἔχων
  choice: क्योंकि उसके पास ... थी
  rationale: परिप्रयुक्त अपूर्ण भूतकाल निरन्तर स्वामित्व की अवस्था दर्शाता है; हिन्दी में ‘उसके पास ... थी’ इसका स्वाभाविक रूप है।
- source_word: κτήματα πολλά
  choice: बहुत-सी सम्पत्ति
  rationale: κτήματα स्वामित्व की वस्तुओं अथवा सम्पत्ति को और πολλά उनकी अधिक मात्रा को दर्शाता है। हिन्दी में ‘सम्पत्ति’ सामान्यतः समूहवाचक है, इसलिए ‘बहुत-सी सम्पत्ति’ अर्थ को सहजता से व्यक्त करता है।
theological_decisions:
- issue: क्या समानान्तर वृत्तान्त से ‘शासक’ की पहचान यहाँ जोड़ी जाए
  choice: νεανίσκος का अनुवाद केवल ‘जवान’ करना
  alternative: जवान शासक
  rationale: मत्ती के इस पद का यूनानी पाठ उसे केवल जवान कहता है। ‘शासक’ जोड़ना लूका के समानान्तर वृत्तान्त के साथ सामंजस्य स्थापित करना होगा, न कि मत्ती के इसी पाठ का अनुवाद।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘यह बात’ और ‘चला गया’ सामान्य पाठक के लिए स्वाभाविक हैं। ‘सम्पत्ति’ का प्रयोग धन के साथ व्यापक स्वामित्व और मिल्कियत को भी समेटता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
