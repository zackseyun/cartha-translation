    text: या, “यरदन की दूसरी ओर।”
    reason: पέραν के भौगोलिक अर्थ को व्यक्त करने वाला वैकल्पिक हिन्दी रूप।
  revision_rationale: “ये बातें पूरी कर चुके थे” ὅτε ἐτέλεσεν τοὺς λόγους τούτους के पूर्णता-बोध और पूर्वकालिक क्रम को अधिक ठीक ढंग से व्यक्त करता है तथा आधुनिक मानक हिन्दी में व्याकरणिक है. शेष पाठ और फुटनोट स्रोत तथा अंग्रेज़ी audit trail के अनुरूप हैं.
