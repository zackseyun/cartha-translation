source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: hi
  text: फिर ऐसा हुआ कि जब यीशु ये बातें पूरी कर चुके थे, तो वे गलील से चले गए और यरदन के पार[a] यहूदिया के प्रदेश में आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरदन की दूसरी ओर।”
    reason: पέραν के भौगोलिक अर्थ को व्यक्त करने वाला वैकल्पिक हिन्दी रूप।
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: फिर ऐसा हुआ कि
  rationale: यह मत्ती में प्रयुक्त कथा-संक्रमण है। यह अभिव्यक्ति यूनानी रचना का भाव बनाए रखते हुए आधुनिक हिन्दी में अगले प्रसंग की ओर स्वाभाविक रूप से ले जाती है।
- source_word: ὅτε ἐτέλεσεν
  choice: जब ... कह चुके
  rationale: ἐτέλεσεν पहले के उपदेश के पूरा हो जाने को दर्शाता है। हिन्दी का पूर्णताबोधक ‘कह चुके’ अगली यात्रा से पहले उस वचन-क्रम की समाप्ति स्पष्ट करता है।
- source_word: τοὺς λόγους τούτους
  choice: ये बातें
  rationale: यह पद ठीक पहले दिए गए उपदेश को संदर्भित करता है। ‘ये बातें’ साधारण आधुनिक हिन्दी में स्वाभाविक है और ‘कथनों’ की अपेक्षा पूरे प्रवचन के लिए अधिक उपयुक्त है।
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: वे गलील से चले गए
  rationale: μετῆρεν किसी स्थान से प्रस्थान करने का अर्थ देता है। ‘चले गए’ स्पष्ट, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: ἦλθεν εἰς
  choice: में आए
  rationale: यूनानी क्रिया और पूर्वसर्ग किसी क्षेत्र में पहुँचने की गति व्यक्त करते हैं; ‘में आए’ हिन्दी में इस स्थानांतरण को सहज रूप से बताता है।
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: यहूदिया के प्रदेश
  rationale: ὅρια यहाँ केवल सीमा-रेखा नहीं, भौगोलिक क्षेत्र या भूभाग का बोध करा सकता है। यात्रा-वर्णन में ‘प्रदेश’ यही अर्थ स्पष्ट करता है।
- source_word: πέραν τοῦ Ἰορδάνου
  choice: यरदन के पार
  rationale: πέραν यरदन के दूसरी ओर स्थित क्षेत्र को दर्शाता है। ‘यरदन के पार’ हिन्दी में संक्षिप्त और प्रचलित भौगोलिक अभिव्यक्ति है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। आदरसूचक बहुवचन ‘वे’ और ‘आए’ का प्रयोग हिन्दी पाठकीय परंपरा तथा स्वाभाविक सम्मानसूचक प्रयोग के अनुरूप है।
