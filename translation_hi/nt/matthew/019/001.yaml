review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the narrative transition, Jesus’ departure from Galilee, and arrival in the Judean region beyond/across the Jordan. However, “कह चुके” renders having spoken rather than the explicit completion in ἐτέλεσεν; “पूरी कर चुके थे” better conveys completion of the preceding discourse.
  naturalness: The sentence is generally natural modern Hindi, but “जब यीशु ये बातें कह चुके” lacks the expected finite auxiliary “थे” in this past narrative construction. The revision supplies it and uses an idiomatic completion expression.
  terminology: “यीशु,” “गलील,” “यरदन,” “यहूदिया,” and “प्रदेश” are appropriate. “यरदन के पार” faithfully preserves the geographic wording, while the footnote supplies a valid alternative.
  issues:
  - severity: medium
    issue: The perfect expression “कह चुके” is incomplete and slightly undertranslates ἐτέλεσεν.
    rationale: With the honorific plural form, the past auxiliary “थे” is needed here. More importantly, ἐτέλεσεν means that Jesus finished/completed the words, not merely that he had said them.
  revised_text: फिर ऐसा हुआ कि जब यीशु ये बातें पूरी कर चुके थे, तो वे गलील से चले गए और यरदन के पार[a] यहूदिया के प्रदेश में आए।
  revised_footnotes:
