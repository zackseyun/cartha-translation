id: MAT.19.6
reference: Matthew 19:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: hi
  text: इसलिए वे अब दो नहीं, बल्कि एक देह हैं। अतः जिसे परमेश्वर ने एक साथ जोड़ा है, उसे कोई मनुष्य अलग न करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले कथन—दोनों के एक देह होने—का परिणाम बताता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक रूप से इसका निष्कर्षात्मक बल व्यक्त करता है।
- source_word: οὐκέτι εἰσὶν δύο
  choice: वे अब दो नहीं
  rationale: कालगत निषेध और संख्या के स्पष्ट विरोध को सीधे तथा स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἀλλὰ σὰρξ μία
  choice: बल्कि एक देह हैं
  rationale: ‘एक देह’ उत्पत्ति के विवाह-वर्णन की प्रतिध्वनि और मूल के देह-संबंधी रूपक को सुरक्षित रखता है; ‘हैं’ हिन्दी वाक्य को पूर्ण करता है।
- source_word: ὃ οὖν
  choice: अतः जिसे
  rationale: οὖν का निष्कर्षात्मक बल ‘अतः’ से और नपुंसकलिंगी संबंधवाचक ὃ का आशय हिन्दी में स्वाभाविक ‘जिसे’ से व्यक्त होता है, जो परमेश्वर द्वारा स्थापित वैवाहिक संयोग की ओर संकेत करता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: ईश्वर के लिए प्रतिष्ठित, dignified और सामान्य हिन्दी बाइबलीय पद।
- source_word: συνέζευξεν
  choice: एक साथ जोड़ा है
  rationale: क्रिया का अर्थ जोड़ना या एक जुए में बाँधना है; ‘एक साथ जोड़ा है’ वैवाहिक संदर्भ में स्वाभाविक है और पूर्ण कार्य की वर्तमान प्रासंगिकता व्यक्त करता है।
- source_word: ἄνθρωπος
  choice: कोई मनुष्य
  rationale: एकवचन ἄνθρωπος यहाँ सामान्य मानव-संदर्भ रखता है। ‘कोई मनुष्य’ उसके मानवीय और सार्वत्रिक निषेध को स्पष्ट करता है, बिना उसे केवल पुरुष तक सीमित किए।
- source_word: μὴ χωριζέτω
  choice: अलग न करे
  rationale: μή के साथ वर्तमान आज्ञार्थक निषेध को संक्षिप्त और गरिमापूर्ण हिन्दी आज्ञार्थक रूप में व्यक्त किया गया है।
theological_decisions:
- issue: विवाह के विषय में निषेध में ἄνθρωπος का सामान्य मानवीय अर्थ
  choice: ‘कोई मनुष्य’ के रूप में अनुवाद
  alternative: ‘मनुष्य’ या ‘कोई व्यक्ति’
  rationale: यूनानी शब्द व्याकरणतः एकवचन है, पर यहाँ उसका संदर्भ सामान्य है। ‘कोई मनुष्य’ मूल की मानव-ईश्वर विषमता और निषेध की सार्वत्रिकता दोनों बनाए रखता है।
- issue: उत्पत्ति की प्रतिध्वनि रखने वाला σὰρξ μία
  choice: ‘एक देह’
  alternative: ‘एक शरीर’
  rationale: ‘एक देह’ मूल रूपक और उत्पत्ति के विवाह-वर्णन से अंतर्पाठीय संबंध को सुरक्षित रखता है, जबकि अतिरिक्त वैवाहिक सिद्धांत नहीं जोड़ता।
- issue: ὃ का संबंध
  choice: ‘जिसे’—परमेश्वर द्वारा स्थापित वैवाहिक संयोग की ओर संकेत
  alternative: ‘जिन्हें’—विवाहित दंपती की ओर व्यक्तिगत संकेत
  rationale: यूनानी ὃ नपुंसकलिंगी एकवचन है, इसलिए ‘जिसे’ उसके व्याकरणिक रूप और संयोग को एक वास्तविकता के रूप में देखने की अस्पष्टता को ‘जिन्हें’ की तुलना में बेहतर सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘इसलिए… अतः’ मूल के ὥστε और οὖν, दोनों निष्कर्षात्मक संकेतों को बनाए रखते हैं। किसी पादटिप्पणी की आवश्यकता नहीं, क्योंकि ‘कोई मनुष्य’ ἄνθρωπος के सामान्य अर्थ को मुख्य पाठ में ही स्पष्ट करता है।
