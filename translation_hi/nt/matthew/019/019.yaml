  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τίμα τὸν πατέρα καὶ τὴν μητέρα, καὶ Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/019.yaml
  text: Honor your father and mother[a], and love your neighbor as yourself.
translation:
  language: hi
  text: अपने पिता और माता का आदर करो,[a] और अपने पड़ोसी से अपने समान प्रेम करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “अपने पिता और माता का आदर करो, और अपने पड़ोसी से अपने समान प्रेम करोगे।”'
    reason: Ἀγαπήσεις के भविष्यत् सूचक रूप को अधिक औपचारिक ढंग से दिखाने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: Τίμα
  choice: आदर करो
  rationale: यह आज्ञार्थक क्रिया दस आज्ञाओं की भाषा को प्रतिध्वनित करती है और केवल मन में सम्मान रखने के बजाय माता-पिता को उचित आदर देने का भाव व्यक्त करती है।
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: अपने पिता और माता
  rationale: यूनानी में संबंधवाचक सर्वनाम स्पष्ट नहीं है, पर प्रत्यक्ष संबोधन और दस आज्ञाओं की पृष्ठभूमि में हिन्दी में ‘अपने’ स्वाभाविक और अर्थानुकूल है।
- source_word: Ἀγαπήσεις
  choice: प्रेम करो
  rationale: यूनानी में भविष्यत् सूचक रूप तोराह की आज्ञा उद्धृत करने की शैली में आया है। हिन्दी मुख्य पाठ में सीधी आज्ञा इस सूची का बल स्वाभाविक ढंग से बनाए रखती है; अधिक रूपगत अनुवाद पादटिप्पणी में दिया गया है।
- source_word: τὸν πλησίον σου
  choice: अपने पड़ोसी से
  rationale: इस नैतिक संदर्भ में πλησίον का मानक अर्थ ‘पड़ोसी’ है—अर्थात निकट संबंध-क्षेत्र का दूसरा व्यक्ति, केवल पास रहने वाला व्यक्ति नहीं। हिन्दी में ‘से प्रेम करना’ स्वाभाविक प्रयोग है।
- source_word: ὡς σεαυτόν
  choice: अपने समान
  rationale: यह तुलना को संक्षिप्त रूप में बनाए रखता है और यूनानी में निहित न होने वाले व्याख्यात्मक शब्द नहीं जोड़ता।
theological_decisions:
- issue: आज्ञाओं के उद्धरण में आज्ञार्थक और भविष्यत् रूपों का अनुवाद
  choice: 'मुख्य पाठ में दोनों कथनों को सीधी आज्ञा के रूप में प्रस्तुत किया गया: ‘आदर करो ... प्रेम करो।’'
  alternative: ‘अपने पिता और माता का आदर करो, और अपने पड़ोसी से अपने समान प्रेम करोगे।’
  rationale: यूनानी पाठ में Τίμα आज्ञार्थक है, जबकि Ἀγαπήσεις भविष्यत् सूचक है; यह व्यवस्था की आज्ञा उद्धृत करने की शैलीगत विशेषता है। समकालीन हिन्दी में दोनों को आज्ञार्थक रखना स्वाभाविक और स्पष्ट है, जबकि रूपगत भिन्नता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। ‘आदर करो’ तथा ‘प्रेम करो’ प्रत्यक्ष आज्ञा का बल रखते हैं; ‘पड़ोसी’ प्रचलित शास्त्रीय शब्दावली को बनाए रखता है।
