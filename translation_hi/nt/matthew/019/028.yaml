  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: hi
  text: तब यीशु ने उनसे कहा, “मैं तुमसे सच कहता हूँ, तुम जिन्होंने मेरा अनुसरण किया है, पुनर्नवीकरण में[a], जब मनुष्य का पुत्र अपनी महिमा के सिंहासन पर बैठेगा, तुम भी बारह सिंहासनों पर बैठोगे और इस्राएल के बारह गोत्रों का न्याय करोगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नई सृष्टि में,” “नए संसार में,” अथवा “पुनर्जन्म में।” यहाँ इसका आशय संभवतः व्यक्ति के नए जन्म से नहीं, बल्कि मनुष्य के पुत्र के राज्य से जुड़े भावी पुनर्नवीकरण से है।
    reason: lexical_alternative
  - marker: b
    text: “न्याय करोगे” में शासन या प्रशासन करने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यह यीशु के गंभीर और अधिकारपूर्ण कथन का स्वाभाविक आधुनिक हिन्दी रूप है; ‘आमीन’ को बिना अनुवाद छोड़े मूल सूत्र का बल बनाए रखता है।
- source_word: ἀκολουθήσαντές μοι
  choice: तुम जो मेरे पीछे चले हो
  rationale: यह संबोधित लोगों को यीशु का अनुसरण कर चुके समूह के रूप में पहचानता है और ‘मेरे’ को स्पष्ट रखता है।
- source_word: ἐν τῇ παλιγγενεσίᾳ
  choice: नई सृष्टि में
  rationale: इस भविष्यकालीन संदर्भ में शब्द समस्त व्यवस्था के पुनर्नवीकरण या नए सृजन की ओर संकेत करता है, न कि मुख्यतः किसी व्यक्ति के नए जन्म की ओर। संक्षिप्त पदबंध मूल की अस्पष्टता को पूरी तरह समाप्त नहीं करता।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह उपाधि का प्रचलित और स्रोत-समीप हिन्दी रूप है तथा उसके दानिय्येली और मसीही संकेत सुरक्षित रखता है।
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: अपनी महिमा के सिंहासन पर
  rationale: यह मूल संबंधवाचक रचना और कथन की गरिमा को सुरक्षित रखता है।
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: तुम भी ... बैठकर
  rationale: ‘भी’ पुत्र के बैठने और शिष्यों के भावी बैठने के बीच मूल के बलाघातपूर्ण संबंध को व्यक्त करता है।
- source_word: κρίνοντες
  choice: न्याय करोगे
  rationale: यह क्रिया के सबसे सीधे अर्थ को रखता है; शासन करने का संभावित व्यापक भाव पादटिप्पणी में दिया गया है।
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: इस्राएल के बारह गोत्रों
  rationale: यह इस्राएल के बारह जनजातीय विभागों का प्रचलित और सटीक बाइबलीय हिन्दी रूप है।
theological_decisions:
- issue: παλιγγενεσία का आशय
  choice: मनुष्य के पुत्र के सिंहासनारूढ़ होने से जुड़ी भावी नई सृष्टि या सार्वभौमिक पुनर्नवीकरण
  alternative: व्यक्तिगत नया जन्म; नया युग; नया संसार
  rationale: निकट संदर्भ भावी सिंहासन और न्याय का है, व्यक्तिगत परिवर्तन का नहीं। फिर भी अनुवाद किसी विशिष्ट सहस्राब्दीवादी या संप्रदायगत योजना को निर्धारित नहीं करता।
- issue: κρίνοντες का दायरा
  choice: न्याय करना
  alternative: शासन करना या प्रशासन चलाना
  rationale: मूल क्रिया सीधे तौर पर न्याय करने को व्यक्त करती है, यद्यपि प्राचीन संदर्भ में इसमें शासकीय अधिकार भी समाहित हो सकता है। मुख्य पाठ सीधे अर्थ को और पादटिप्पणी व्यापक संभावना को रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य-विन्यास मूल यूनानी के संबंधों को स्पष्ट रखता है; तकनीकी ‘पुनरुत्पत्ति’ से बचकर सामान्य पाठक के लिए ‘नई सृष्टि’ चुना गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
