source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: hi
  text: उसने उससे कहा[a], “तुम मुझसे भलाई के विषय में क्यों पूछते हो? भला तो एक ही है[b]। लेकिन यदि तुम जीवन में प्रवेश करना चाहते हो, तो आज्ञाओं का पालन करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों और समानांतर वृत्तांतों में है, “तुम मुझे भला क्यों कहते हो? एक को, अर्थात् परमेश्वर को, छोड़कर कोई भला नहीं है।” इसके विपरीत, मत्ती के SBLGNT पाठ में है, “तुम मुझसे भलाई के विषय में क्यों पूछते हो? भला तो एक ही है।”
    reason: textual_variant
  - marker: b
    text: या अधिक सहज रूप में, “केवल एक ही भला है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: तुम मुझसे भलाई के विषय में क्यों पूछते हो?
  rationale: नपुंसकलिंग एकवचन τοῦ ἀγαθοῦ को किसी व्यक्ति के बजाय ‘भलाई’ के वस्तुगत या अमूर्त अर्थ में लिया गया है। यह मत्ती के यूनानी वाक्य-विन्यास को सुरक्षित रखता है और मरकुस तथा लूका के समानांतर वृत्तांतों के साथ कृत्रिम सामंजस्य नहीं बैठाता।
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: भला तो एक ही है
  rationale: यह εἷς और संज्ञा के रूप में प्रयुक्त ὁ ἀγαθός—दोनों को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है। ‘तो’ पिछले वाक्य की ‘भलाई’ से संबंध उभारता है, जबकि कथन के एकमात्र ‘भले’ व्यक्ति की पहचान अनकही ही रहती है।
- source_word: εἰ δὲ θέλεις
  choice: लेकिन यदि तुम ... चाहते हो
  rationale: θέλω इच्छा या अभिलाषा व्यक्त करता है, जिसके लिए आधुनिक हिन्दी में ‘चाहते हो’ स्वाभाविक है। δέ के हल्के विरोधात्मक भाव के लिए ‘लेकिन’ रखा गया है।
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: जीवन में प्रवेश करना
  rationale: यह εἰς के दिशात्मक भाव को बनाए रखता है और भावी पूर्ण जीवन की ओर संकेत करता है, पर यूनानी में अनुपस्थित ‘अनन्त’ शब्द को पाठ में नहीं जोड़ता।
- source_word: τήρησον τὰς ἐντολάς
  choice: आज्ञाओं का पालन करो
  rationale: आज्ञाओं के संदर्भ में τηρέω का अर्थ उन्हें मानना और उनके अनुसार चलना है। ‘आज्ञाओं का पालन करो’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: यीशु के कथन का परमेश्वर की भलाई और मसीह-विज्ञान से संबंध
  choice: मत्ती के पाठ के अनुसार प्रश्न को ‘भलाई’ के विषय में और उत्तर को ‘भला तो एक ही है’ के रूप में रखा गया है।
  alternative: 'मरकुस और लूका के समानांतर पाठ के अनुसार अनुवाद करना: ‘तुम मुझे भला क्यों कहते हो? एक अर्थात् परमेश्वर को छोड़ कोई भला नहीं।’'
  rationale: SBLGNT में मत्ती का पाठ समानांतर वृत्तांतों से अलग है। अनुवाद न तो यीशु की भलाई का निषेध आरोपित करता है, न ‘एक’ की पहचान पाठ में जोड़ता है, और न दूसरे सुसमाचारों के शब्दों से मत्ती का सामंजस्य कराता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘भलाई के विषय में’ मूल के अमूर्त अर्थ को, ‘जीवन में प्रवेश’ उसके युगांत-संबंधी संकेत को, और ‘भला तो एक ही है’ मूल कथन की संक्षिप्तता तथा खुली पहचान को बनाए रखता है। अंग्रेज़ी परामर्श-पाठ में [b] का स्थान ‘जीवन’ के बाद दिया गया था, पर उसकी टिप्पणी वास्तव में εἷς ἐστιν ὁ ἀγαθός से संबंधित है; इसलिए हिन्दी मुख्य पाठ में [b] उसी कथन के बाद रखा गया है।
