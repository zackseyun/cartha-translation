reference: Matthew 19:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: hi
  text: पर यीशु ने कहा, “बच्चों को मेरे पास आने दो और उन्हें मत रोको, क्योंकि स्वर्ग का राज्य ऐसों का है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ऐसों” का संकेत उपस्थित बच्चों के साथ-साथ उनके जैसे प्रकार के लोगों की ओर भी हो सकता है; यहाँ यह नहीं बताया गया कि समानता का कौन-सा गुण अभिप्रेत है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφετε
  choice: आने दो
  rationale: ἀφίημι का आज्ञार्थक रूप यहाँ अनुमति देने के अर्थ में है। अगले वाक्यांश के साथ ‘बच्चों को ... आने दो’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: τὰ παιδία
  choice: बच्चों
  rationale: παιδία छोटे या कम आयु के बच्चों को सूचित कर सकता है, पर यहाँ केवल ‘बच्चों’ कहना व्यापक, सहज और पर्याप्त रूप से सटीक है।
- source_word: μὴ κωλύετε
  choice: उन्हें मत रोको
  rationale: κωλύω का अर्थ रोकना, बाधा डालना या निषेध करना है। ‘मत रोको’ संक्षिप्त और स्वाभाविक है तथा यह अनावश्यक रूप से नहीं बताता कि रोकने की क्रिया पहले से जारी थी या नहीं।
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: बच्चों को मेरे पास आने ... उन्हें
  rationale: κωλύω के साथ infinitive को हिन्दी में ‘किसी को आने से रोकना’ और Ἄφετε के साथ ‘आने देना’ स्वाभाविक रूप से व्यक्त किया गया है। πρός με का अर्थ ‘मेरे पास’ है।
- source_word: τῶν γὰρ τοιούτων
  choice: क्योंकि ... ऐसों ही का
  rationale: τοιούτων उपस्थित बच्चों तक सीमित न रहकर उनके जैसे प्रकार या वर्ग के लोगों की ओर भी संकेत कर सकता है। ‘ऐसों ही का’ इस प्रतिनिधिक व्यापकता को बिना उसका गुण परिभाषित किए बनाए रखता है।
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: यह मत्ती की विशिष्ट अभिव्यक्ति है। ‘स्वर्ग का राज्य’ आधुनिक हिन्दी में स्थापित, स्पष्ट और अर्थसंगत रूप है।
- source_word: ἐστὶν
  choice: का है
  rationale: यूनानी genitive और ἐστὶν की रचना को ‘ऐसों ही का है’ निकटता से सुरक्षित रखती है। यह ‘उनका है’ की तुलना में मूल की genuine ambiguity को बेहतर बनाए रखती है।
theological_decisions:
- issue: क्या यीशु केवल उपस्थित वास्तविक बच्चों की बात करते हैं, या बच्चों जैसे प्रकार के अन्य लोगों की भी
  choice: ‘ऐसों ही का’ रखा गया है, जिससे तत्काल बच्चों का संदर्भ और उनसे आगे जाती प्रतिनिधिक व्यापकता दोनों बने रहें।
  alternative: ‘इन बच्चों का’ कहना संदर्भ को संकरा कर देता; ‘जो बच्चों के समान हैं उनका’ कहना समानता के आशय को मूल से अधिक स्पष्ट कर देता।
  rationale: τοιούτων किसी प्रकार के लोगों को सूचित करता है, पर यहाँ वह गुण स्पष्ट नहीं करता जिसके कारण वे इन बच्चों जैसे हैं। अनुवाद को इस धर्मवैज्ञानिक तनाव को स्वयं हल नहीं करना चाहिए।
- issue: राज्य के संबंध को अधिकार, सहभागिता या चरित्र के रूप में समझना
  choice: ‘ऐसों ही का है’—मूल की संबंधसूचक रचना को बनाए रखा गया है।
  alternative: ‘ऐसों ही को मिलता है’ या ‘ऐसों ही के लिए है’ अधिक व्याख्यात्मक होते।
  rationale: यूनानी पाठ केवल genitive के साथ ‘है’ कहता है; वह इस पद में संबंध की प्रकृति को और अधिक परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘मेरे पास आने दो’ तथा ‘मत रोको’ सामान्य पाठक के लिए सहज हैं। ‘ऐसों ही का है’ कुछ औपचारिक होते हुए भी मूल यूनानी की संक्षिप्तता और अर्थगत खुलापन सुरक्षित रखता है।
