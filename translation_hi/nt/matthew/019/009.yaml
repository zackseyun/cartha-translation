id: MAT.19.9
reference: Matthew 19:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: hi
  text: पर मैं तुमसे कहता हूँ कि जो कोई यौन अनैतिकता के कारण के सिवा अपनी पत्नी को तलाक देता है[a] और दूसरी स्त्री से विवाह करता है, वह व्यभिचार करता है; और जो कोई तलाक दी हुई स्त्री से विवाह करता है, वह व्यभिचार करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यौन अनैतिकता के आधार के सिवा।’ यूनानी पद का अधिक संकीर्ण अनुवाद ‘जारकर्म को छोड़’ किया जा सकता है; कुछ लोग इसका अर्थ ‘यौन विश्वासघात को छोड़’ समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'कुछ पांडुलिपियों में ये शब्द नहीं हैं: ‘और जो कोई तलाक दी हुई स्त्री से विवाह करता है, वह व्यभिचार करता है।’'
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: पर मैं तुमसे कहता हूँ
  rationale: δέ यहाँ पिछले कथन के संदर्भ में हल्का विरोध या आगे बढ़ता हुआ संबंध दिखाता है; ‘पर’ इसे स्वाभाविक हिन्दी में व्यक्त करता है। λέγω ... ὑμῖν का सीधा और गरिमापूर्ण रूप ‘मैं तुमसे कहता हूँ’ है।
- source_word: ὃς ἂν
  choice: जो कोई
  rationale: सापेक्ष सर्वनाम के साथ ἄν एक सामान्य, अनिश्चित शर्त व्यक्त करता है; ‘जो कोई’ इस व्यापक अर्थ को बनाए रखता है।
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: अपनी पत्नी को ... तलाक देता है
  rationale: विवाह-संबंधी संदर्भ में ἀπολύω का अर्थ केवल भेज देना नहीं, बल्कि तलाक देना है; γυνή यहाँ स्पष्टतः ‘पत्नी’ है।
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: यौन अनैतिकता के कारण को छोड़ किसी और कारण से
  rationale: यह अभिव्यक्ति अपवाद की शर्त को स्पष्ट करती है। πορνεία का अर्थ केवल व्यभिचार तक सीमित नहीं है, इसलिए व्यापक और आधुनिक ‘यौन अनैतिकता’ चुना गया है। हिन्दी वाक्य-विन्यास इस बात को स्पष्ट रखता है कि अपवाद तलाक के आधार से संबंधित है।
- source_word: καὶ γαμήσῃ ἄλλην
  choice: और दूसरी स्त्री से विवाह करता है
  rationale: ἄλλην स्त्रीलिंग है और दूसरी स्त्री को सूचित करता है; हिन्दी में संज्ञा व्यक्त करना अर्थ की स्पष्टता के लिए स्वाभाविक है।
- source_word: μοιχᾶται
  choice: वह व्यभिचार करता है
  rationale: यह वर्तमान क्रिया उस कार्य के नैतिक स्वरूप को बताती है। ‘व्यभिचार करता है’ आधुनिक हिन्दी में मानक और स्पष्ट अभिव्यक्ति है।
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: और जो कोई तलाक दी हुई स्त्री से विवाह करता है, वह व्यभिचार करता है
  rationale: संज्ञात्मक कृदन्तीय रचना को सामान्य कथन के रूप में ‘जो कोई’ से व्यक्त किया गया है। पूर्ण कर्मवाच्य कृदन्त ἀπολελυμένην उस स्त्री को दर्शाता है जिसे तलाक दिया गया है।
theological_decisions:
- issue: अपवाद-वाक्यांश में πορνεία का अर्थ
  choice: ‘यौन अनैतिकता’ के रूप में व्यापक अनुवाद
  alternative: ‘व्यभिचार’, ‘जारकर्म’ या ‘यौन विश्वासघात’
  rationale: πορνεία का शब्दार्थ μοιχεία से व्यापक हो सकता है। व्यापक अनुवाद मूल की अर्थ-सीमा को सुरक्षित रखता है और विवादित अपवाद को किसी एक संप्रदायगत व्याख्या तक सीमित नहीं करता।
- issue: अंतिम वाक्यांश καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται का समावेश
  choice: मुख्य पाठ में शामिल करना और पाठांतर को पादटिप्पणी में बताना
  alternative: कुछ पांडुलिपियों के अनुसार वाक्यांश को छोड़ देना
  rationale: दिया गया SBLGNT पाठ इस वाक्यांश को पाठांतर-चिह्नों सहित शामिल करता है। इसलिए इसका अनुवाद मुख्य पाठ में रखा गया है और पांडुलिपीय अनिश्चितता को स्पष्ट रूप से पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण रखी गई है। ‘यौन अनैतिकता’ मूल शब्द की व्यापकता बनाए रखता है; ‘तलाक’ वर्तमान हिन्दी का सहज और सटीक वैवाहिक-कानूनी शब्द है। अपवाद-वाक्यांश को हिन्दी में इस प्रकार व्यवस्थित किया गया है कि वह तलाक के कारण पर लागू हो, पर उसके धर्मवैज्ञानिक दायरे को संकीर्ण न किया जाए।
