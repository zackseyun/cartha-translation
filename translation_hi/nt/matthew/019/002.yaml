translation:
  language: hi
  text: और बड़ी-बड़ी भीड़ें उसके पीछे चलीं, और उसने वहाँ उन्हें चंगा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: पीछे हो ली
  rationale: यह ἀκολουθέω के साधारण कथात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है—भीड़ यीशु के साथ उसके पीछे चली—और अनावश्यक रूप से औपचारिक शिष्यत्व का भाव नहीं जोड़ता।
- source_word: αὐτῷ
  choice: उसके
  rationale: ἀκολουθέω के साथ आए दत्तिव सर्वनाम को हिन्दी मुहावरे ‘उसके पीछे हो ली’ में स्वाभाविक रूप दिया गया है।
- source_word: ὄχλοι πολλοί
  choice: बड़ी भीड़
  rationale: यूनानी में शाब्दिक रूप से ‘बहुत-सी भीड़ें’ है; आधुनिक हिन्दी में ‘बड़ी भीड़’ लोगों की विशाल संख्या को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐθεράπευσεν
  choice: चंगा किया
  rationale: चंगाई के सुसमाचारी प्रसंग में θεραπεύω के लिए ‘चंगा किया’ स्पष्ट, प्रचलित और अर्थानुकूल है।
- source_word: αὐτούς
  choice: लोगों को
  rationale: सर्वनाम का संकेत पहले उल्लिखित भीड़ के लोगों की ओर है। हिन्दी में ‘उन्हें’ से संभावित अस्पष्टता बचाने और स्वाभाविकता बनाए रखने के लिए संदर्भित संज्ञा व्यक्त की गई है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण के सरल अर्थ को ठीक और स्वाभाविक ढंग से बनाए रखता है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: दोनों καί को ‘और’ से रखकर यूनानी की समन्वयी कथात्मक लय तथा दोनों क्रियाओं के क्रम को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
