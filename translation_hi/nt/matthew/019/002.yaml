  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘पीछे हो ली’ यहाँ भौतिक रूप से साथ चलने का भाव देता है, जबकि ‘चंगा किया’ बाइबिलीय प्रयोग में परिचित होने के साथ सामान्य पाठक के लिए भी स्पष्ट है।
