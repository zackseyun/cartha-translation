  edition: SBLGNT
  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: hi
  text: तब बच्चों को उसके पास लाया गया, ताकि वह उन पर अपने हाथ रखे और प्रार्थना करे; पर चेलों ने उन्हें[a] डाँटा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम “उन्हें” बच्चों के लिए भी हो सकता है और उन्हें लाने वालों के लिए भी।
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह कथा के क्रम में अगली घटना को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: προσηνέχθησαν αὐτῷ
  choice: उसके पास लाया गया
  rationale: प्रसφέρω के कर्मवाच्य रूप और αὐτῷ के लक्ष्य-सूचक अर्थ को सहज आधुनिक हिन्दी में रखता है। हिन्दी में बहुवचन निर्जीव/अमानवीय संज्ञा के साथ यहाँ एकवचन कर्मवाच्य क्रिया स्वाभाविक है।
- source_word: παιδία
  choice: बच्चों
  rationale: यह παιδίον के सामान्य अर्थ को व्यक्त करता है; ‘छोटे’ जोड़कर आयु या लघुता का अनावश्यक आग्रह नहीं किया गया।
- source_word: ἵνα
  choice: ताकि
  rationale: यूनानी उद्देश्यवाचक संबंध को स्पष्ट और बोलचाल-सम्मत आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: वह उन पर अपने हाथ रखे
  rationale: यूनानी में ‘हाथों’ का बहुवचन और हाथ रखने की क्रिया दोनों सुरक्षित रहते हैं; हिन्दी मुहावरे में ‘अपने’ स्वाभाविक है।
- source_word: προσεύξηται
  choice: प्रार्थना करे
  rationale: क्रिया का कोई स्पष्ट कर्म या ‘उनके लिए’ जैसा संबंध यूनानी में नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: οἱ δὲ μαθηταὶ
  choice: पर चेलों ने
  rationale: δέ का हल्का विरोध ‘पर’ से स्वाभाविक रूप में सामने आता है। μαθηταί के लिए ‘चेले’ सामान्य, सुबोध बाइबलीय हिन्दी है।
- source_word: ἐπετίμησαν αὐτοῖς
  choice: उन्हें डाँटा
  rationale: ἐπιτιμάω की फटकार या झिड़की की शक्ति को वर्तमान सहज हिन्दी में व्यक्त करता है, जबकि ‘उन्हें’ अंतिम सर्वनाम की संदर्भगत अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: अंतिम αὐτοῖς किसे सूचित करता है
  choice: उन्हें
  alternative: बच्चों को; अथवा बच्चों को लाने वालों को
  rationale: यूनानी बहुवचन सर्वनाम व्याकरणतः दोनों समूहों की ओर संकेत कर सकता है। मुख्य पाठ में अस्पष्ट सर्वनाम रखकर किसी एक अर्थ को अनावश्यक रूप से निर्णायक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘चेला’ स्थापित तथा आम पाठक के लिए सुबोध बाइबलीय शब्द है। पादटिप्पणी-चिह्न को उसी वाक्य के अंत में रखा गया है जिसकी अंतिम सर्वनाम-संदर्भगत अस्पष्टता वह स्पष्ट करता है।
