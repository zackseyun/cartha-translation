id: MAT.1.16
reference: Matthew 1:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: hi
  text: और याकूब यूसुफ का पिता था, जो मरियम का पति था; उसी मरियम से यीशु का जन्म हुआ, जो मसीह कहलाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ वंशावली को हल्के ढंग से आगे बढ़ाता है; ‘और’ बिना अनावश्यक विरोध का भाव जोड़े इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐγέννησεν
  choice: पिता हुआ
  rationale: वंशावली में यह पुरुष के जनक होने को दर्शाता है। ‘पिता हुआ’ संक्षिप्त और गरिमापूर्ण है तथा पुरुष के लिए अस्वाभाविक ‘जन्म दिया’ से बचता है।
- source_word: τὸν ἄνδρα Μαρίας
  choice: जो मरियम का पति था
  rationale: मरियम के साथ संबंध में ἀνήρ का अर्थ स्पष्टतः ‘पति’ है। हिन्दी में संबंधवाचक उपवाक्य यूसुफ की पहचान स्वाभाविक रूप से बताता है।
- source_word: ἐξ ἧς
  choice: उसी मरियम से
  rationale: स्त्रीलिंग एकवचन सर्वनाम केवल मरियम की ओर संकेत करता है। ‘उसी मरियम से’ इस संदर्भ को स्पष्ट रखता और पुरुष-केंद्रित वंशावली-सूत्र में आए बदलाव को उभारता है।
- source_word: ἐγεννήθη
  choice: जन्म हुआ
  rationale: कर्मवाच्य क्रिया यीशु के विषय में पहले प्रयुक्त सक्रिय ‘पिता हुआ’ से जानबूझकर अलग है; ‘जन्म हुआ’ आधुनिक हिन्दी में स्वाभाविक रूप से इस अंतर को बनाए रखता है।
- source_word: ὁ λεγόμενος
  choice: जो … कहलाता है
  rationale: यह अभिव्यक्ति यीशु की पहचान उस उपाधि से कराती है जिससे वह जाना जाता है; ‘कहलाता है’ सीधा और स्वाभाविक अनुवाद है।
- source_word: χριστός
  choice: मसीह
  rationale: यहाँ χριστός नाम-सदृश प्रयोग के बजाय उपाधि के रूप में आया है। हिन्दी में ‘मसीह’ इस स्थापित मसीहाई उपाधि को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: χριστός को पहचान-सूत्र में कैसे प्रस्तुत किया जाए
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: ὁ λεγόμενος χριστός में χριστός उपाधि है। ‘मसीह’ हिन्दी पाठकों के लिए प्रचलित उपाधि है और पद में किसी अतिरिक्त सिद्धान्तगत व्याख्या को नहीं जोड़ता।
- issue: यूसुफ की उत्पत्ति और यीशु के जन्म के बीच व्याकरणिक बदलाव
  choice: याकूब को यूसुफ का पिता कहा गया है, पर यीशु का जन्म मरियम से बताया गया है
  alternative: ऐसी समान वंशावली भाषा जिसमें यूसुफ को यीशु का पिता बनाने का आभास हो
  rationale: यूनानी पाठ सक्रिय ἐγέννησεν से कर्मवाच्य ἐγεννήθη और स्त्रीलिंग ἐξ ἧς की ओर बदलता है। अनुवाद इस बदलाव को सुरक्षित रखता है और उससे आगे कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। अर्धविराम मूल वाक्य की एकता बनाए रखते हुए मरियम से यीशु के जन्म वाले निर्णायक व्याकरणिक बदलाव को स्पष्ट करता है।
