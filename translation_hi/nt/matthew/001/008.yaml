source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: hi
  text: आसाफ यहोशापात का पिता था[a], यहोशापात योराम का पिता था, और योराम उज्जियाह का पिता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में ‘आसाफ’ के स्थान पर ‘आसा’ है; पुराने नियम की वंशावली में यहूदा के राजा का नाम भी ‘आसा’ है।
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: आसाफ
  rationale: SBLGNT के मुख्य पाठ में Ἀσὰφ है, इसलिए नाम को सुधारकर ‘आसा’ करने के बजाय उसका देवनागरी लिप्यंतरण मुख्य पाठ में रखा गया है; पाठांतर और पुराने नियम की वंशावली से उसका संबंध पादटिप्पणी में स्पष्ट किया गया है।
- source_word: δὲ
  choice: और / अल्पविराम द्वारा क्रम-संबंध
  rationale: वंशावली में δέ हल्का संयोजक है, विरोधसूचक नहीं। स्वाभाविक हिन्दी के लिए पहले दो खंड अल्पविराम से और अंतिम खंड ‘और’ से जोड़ा गया है।
- source_word: ἐγέννησεν
  choice: ने … को जन्म दिया
  rationale: यह हिन्दी में वंशावली के पिता-पुत्र संबंध को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है तथा पुराने ‘उत्पन्न किया’ की अपेक्षा अधिक सहज है।
- source_word: Ἰωσαφάτ
  choice: यहोशापात
  rationale: यह पुराने नियम के इसी यहूदी राजा के नाम का हिन्दी पाठकों में प्रचलित और पहचाना जाने वाला रूप है।
- source_word: Ἰωράμ
  choice: योराम
  rationale: यह यूनानी Ἰωράμ का निकट, प्रचलित देवनागरी रूप है; ‘यहोराम’ इब्रानी के अधिक पूर्ण रूप को दर्शाता है।
- source_word: Ὀζίαν
  choice: उज्जियाह
  rationale: यह पुराने नियम के यहूदी राजा का हिन्दी में परिचित नाम है और यूनानी नाम से अभिप्रेत व्यक्ति की पहचान स्पष्ट रखता है।
theological_decisions:
- issue: बार-बार आए δὲ और ἐγέννησεν के साथ वंशावली-क्रम का अनुवाद
  choice: हर पिता-पुत्र संबंध को पूरा रखते हुए तीनों खंडों को सहज हिन्दी वाक्य में जोड़ना।
  alternative: हर खंड के बीच ‘और’ दोहराना, अथवा ‘उत्पन्न किया’ का प्रयोग करना।
  rationale: यह शैलीगत निर्णय है। चुना हुआ रूप मूल वंशावली का क्रम और प्रत्येक संबंध सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- issue: मुख्य पाठ में Ἀσὰφ को अपेक्षित ऐतिहासिक नाम ‘आसा’ से मिलाना या न मिलाना
  choice: मुख्य पाठ में ‘आसाफ’ रखना और ‘आसा’ को पादटिप्पणी में देना।
  alternative: पुराने नियम की वंशावली से सामंजस्य बैठाकर मुख्य पाठ में ‘आसा’ लिखना।
  rationale: स्रोत-पाठ की प्राथमिकता के अनुसार उपलब्ध यूनानी रूप का अनुवाद किया गया है, उसे चुपचाप संशोधित नहीं किया गया। साथ ही, पाठांतर और पुराने नियम की वंशावली का प्रमाण पाठक के लिए पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण वंशावली-शैली। परिचित बाइबलीय नाम-रूप अपनाए गए हैं, पर Ἀσὰφ के वास्तविक मुख्य-पाठ रूप को पादटिप्पणी के सहारे पारदर्शी ढंग से सुरक्षित रखा गया है।
