  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: hi
  text: हिजकिय्याह से मनश्शे उत्पन्न हुआ, मनश्शे से आमोस[a] उत्पन्न हुआ, और आमोस से योशिय्याह उत्पन्न हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ अनुवाद यहाँ “आमोन” पढ़ते हैं, ताकि नाम 2 राजाओं 21 में यहूदा के राजा के नाम के अनुरूप हो; मत्ती के यूनानी पाठ में “आमोस” है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: से … उत्पन्न हुआ
  rationale: वंशावली में यह पुरुष के द्वारा जन्म देने अथवा वंशगत पिता होने का संकेत देता है। हिन्दी में ‘से … उत्पन्न हुआ’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है तथा प्रत्यक्ष पिता से आगे वंशगत संबंध की सम्भावना को अनावश्यक रूप से सीमित नहीं करता।
- source_word: Ἑζεκίας
  choice: हिजकिय्याह
  rationale: यूनानी नाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: Μανασσῆς
  choice: मनश्शे
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: Ἀμώς
  choice: आमोस
  rationale: SBLGNT के यूनानी पाठ Ἀμώς को सीधे लिप्यंतरित किया गया है; इसे पुराने नियम के राजा ‘आमोन’ के नाम से चुपचाप सामंजस्य नहीं दिया गया।
- source_word: Ἰωσίας
  choice: योशिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: δέ
  choice: और / विराम-चिह्न
  rationale: दोहराव वाली वंशावली में δέ सूची को आगे बढ़ाने वाला सामान्य संयोजक है। सहज हिन्दी के लिए पहले उदाहरणों को अल्पविराम से और अंतिम को ‘और’ से व्यक्त किया गया है।
theological_decisions:
- issue: मत्ती के यूनानी पाठ और पुराने नियम में यहूदा के राजा के नाम के बीच अंतर
  choice: मुख्य पाठ में यूनानी Ἀμώς के अनुसार ‘आमोस’
  alternative: राजाओं और इतिहास-वृत्तांत के नाम से सामंजस्य करते हुए ‘आमोन’
  rationale: मूल-भाषा के उपलब्ध पाठ को प्राथमिकता दी गई है। नामांतर को चुपचाप ठीक करने के बजाय मुख्य पाठ में ‘आमोस’ रखा और पाठक के लिए ‘आमोन’ को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में वंशावली की लय और संक्षिप्तता बनाए रखी गई है। नामों के परिचित हिन्दी बाइबलीय रूप प्रयुक्त हैं; भाषा न तो पुरातन ‘जन्माया’ पर निर्भर है, न अत्यधिक व्याख्यात्मक है।
