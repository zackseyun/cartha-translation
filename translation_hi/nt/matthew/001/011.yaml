    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: से … उत्पन्न हुए
  rationale: वंशावली में यह स्वाभाविक और गरिमापूर्ण हिन्दी प्रयोग है। यह पुरुष-वंश की कड़ी व्यक्त करता है, पर हर कड़ी में तत्काल जैविक पितृत्व का प्रश्न अनावश्यक रूप से तय नहीं करता।
- source_word: Ἰεχονίαν
  choice: यकोनियाह
  rationale: यूनानी नाम Ἰεχονίας का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: ἀδελφοὺς αὐτοῦ
  choice: उसके भाई
  rationale: यूनानी पद पुल्लिंग बहुवचन है और इस वंशावली के संदर्भ में पुरुष संबंधियों को दर्शाता है।
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: बाबेल को निर्वासन के समय
  rationale: μετοικεσία जबरन स्थानांतरण अथवा निर्वासन को सूचित करता है; ἐπί सहित यह पद समय बताता है, और Βαβυλῶνος यहाँ गंतव्य के अर्थ में है।
- source_word: δὲ
  choice: अलग से अनूदित नहीं
  rationale: यह वंशावली में हल्का संयोजक है; हिन्दी में अलग शब्द जोड़े बिना प्रवाह स्वाभाविक रहता है।
theological_decisions:
- issue: मत्ती की वंशावली में पीढ़ियों का संक्षेप
  choice: यूनानी में दी गई वंशावली को सीधे प्रस्तुत करना और ऐतिहासिक प्रश्नों का समाधान मुख्य पाठ में न जोड़ना
  alternative: ἐγέννησεν को प्रत्येक स्थान पर अनिवार्यतः तत्काल जैविक पितृत्व मानना, या स्पष्ट रूप से ‘पूर्वज था’ कहना
  rationale: वंशावलियाँ पीढ़ियों को संक्षिप्त कर सकती हैं। ‘से … उत्पन्न हुए’ मूल वंशावली-सूत्र को व्यक्त करता है और उस ऐतिहासिक-धर्मवैज्ञानिक तनाव को अनावश्यक रूप से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘बाबेल’ हिन्दी बाइबल परंपरा में पहचाना जाने वाला स्थान-नाम है। मुख्य पाठ में घटना को दो वाक्यों में रखा गया है ताकि ‘के समय’ का संबंध स्पष्ट और हिन्दी प्रवाह स्वाभाविक रहे।
