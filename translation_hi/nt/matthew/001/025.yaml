base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: hi
  text: और वह उसके साथ पति-पत्नी के संबंध नहीं रखता था, जब तक कि उसने एक पुत्र को जन्म नहीं दिया[a][b]; और उसने उसका नाम यीशु रखा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में शाब्दिक रूप से ‘वह उसे नहीं जानता था’ है; यहाँ ‘जानना’ पति-पत्नी के यौन-संबंध के लिए एक शिष्टोक्ति है।
    reason: lexical_alternative
  - marker: b
    text: ‘जब तक’ केवल यीशु के जन्म तक की स्थिति बताता है; यह अपने आप में तय नहीं करता कि उसके बाद क्या हुआ।
    reason: alternative_reading
  - marker: c
    text: इसे ‘उसने उसे यीशु नाम दिया’ भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: वैवाहिक संबंध में नहीं आया
  rationale: यहाँ γινώσκω (‘जानना’) दांपत्य यौन-संबंध के लिए प्रयुक्त शिष्टोक्ति है। हिन्दी में ‘उसे नहीं जाना’ सामान्य पाठक को अपेक्षित अर्थ स्पष्ट नहीं करेगा, इसलिए अर्थ को स्वाभाविक और मर्यादित भाषा में व्यक्त किया गया है; शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: ἕως οὗ
  choice: जब तक … तब तक
  rationale: यह स्वाभाविक हिन्दी काल-संरचना जन्म तक की स्थिति बताती है और अपने आप में उसके बाद की स्थिति के विषय में कोई निष्कर्ष नहीं देती।
- source_word: ἔτεκεν
  choice: जन्म दिया
  rationale: τίκτω के लिए यह आधुनिक हिन्दी का स्वाभाविक और सटीक प्रयोग है।
- source_word: υἱόν
  choice: एक पुत्र
  rationale: मूल यूनानी में संज्ञा निर्धारक रहित है; ‘एक पुत्र’ उसके अनिश्चित रूप को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: उसने उसका नाम यीशु रखा
  rationale: यह सेमिटिक-यूनानी अभिव्यक्ति का अर्थ और संरचना पर्याप्त निकटता से रखते हुए सहज आधुनिक हिन्दी देता है।
- source_word: Ἰησοῦν
  choice: यीशु
  rationale: नए नियम में इस नाम का मानक और व्यापक रूप ‘यीशु’ है।
theological_decisions:
- issue: ‘जब तक’ से मरियम के बाद के वैवाहिक जीवन के विषय में निकाला जाने वाला निष्कर्ष
  choice: ἕως οὗ को ‘जब तक … तब तक’ अनूदित किया गया है, बिना यह कहे कि जन्म के बाद वैवाहिक संबंध बने या नहीं बने।
  alternative: कुछ पाठक इससे बाद में सामान्य वैवाहिक संबंध आरम्भ होने का संकेत मानते हैं; अन्य मानते हैं कि यह वाक्य जन्म के बाद की स्थिति के विषय में कुछ नहीं बताता।
  rationale: यूनानी काल-सूचक पद केवल यीशु के जन्म तक की स्थिति स्पष्ट करता है; वह अकेला बाद की स्थिति का निर्णय नहीं करता। इसलिए अनुवाद इस धार्मिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, मर्यादित और सामान्य पाठक के लिए स्पष्ट रखी गई है। यौन-संबंध के लिए अशिष्ट या चिकित्सकीय शब्दावली से बचते हुए यूनानी शिष्टोक्ति का आशय दिया गया है। सर्वनाम मूल पाठ के अनुरूप रखे गए हैं और उनका संदर्भ पूर्ववर्ती पद से स्पष्ट होता है।
