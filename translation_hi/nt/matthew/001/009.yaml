base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: hi
  text: उज्जियाह योताम का पिता था, और योताम आहाज का पिता था, और आहाज हिजकियाह का पिता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὀζίας
  choice: उज्जियाह
  rationale: यूनानी नामरूप को पुराने नियम के परिचित यहूदी राजा के मानक हिन्दी नाम से प्रस्तुत किया गया है।
- source_word: δὲ
  choice: और
  rationale: वंशावली की क्रमिक कड़ियों को जोड़ने वाले हल्के संयोजक के रूप में ‘और’ स्वाभाविक है और दोहराए गए ढाँचे को बनाए रखता है।
- source_word: ἐγέννησεν
  choice: से … उत्पन्न हुआ
  rationale: वंशावली में γεννάω के पितृवंशीय संबंध को स्पष्ट, संक्षिप्त और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है; ‘जन्म दिया’ पुरुष कर्ता के साथ अस्वाभाविक होता।
- source_word: Ἰωαθάμ
  choice: योताम
  rationale: पुराने नियम के यहूदी राजा के लिए प्रचलित मानक हिन्दी बाइबलीय नाम अपनाया गया है।
- source_word: Ἀχάζ
  choice: आहाज
  rationale: पुराने नियम के राजा के लिए प्रचलित हिन्दी बाइबलीय नाम चुना गया है, न कि यूनानी रूप का यांत्रिक लिप्यंतरण।
- source_word: Ἑζεκίαν
  choice: हिजकियाह
  rationale: पुराने नियम के यहूदी राजा के परिचित मानक हिन्दी नाम का प्रयोग किया गया है।
theological_decisions:
- issue: γεννάω का वंशावली-संबंधी बल
  choice: सीधे पितृवंशीय उत्तराधिकार को ‘से … उत्पन्न हुआ’ द्वारा व्यक्त किया गया है।
  alternative: ‘का पिता था’ अथवा व्यापक अर्थ में ‘का पूर्वज था’
  rationale: मत्ती का पाठ क्रमबद्ध वंशावली-सूत्र प्रस्तुत करता है। मुख्य पाठ में ‘पूर्वज’ जोड़ना संभावित पीढ़ी-लोप की व्याख्या को अनावश्यक रूप से निश्चित कर देता; इसलिए स्रोत की सीधी अभिव्यक्ति और साहित्यिक पुनरावृत्ति सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। नाम पुराने नियम में परिचित हिन्दी बाइबलीय रूपों के अनुसार हैं। दोहराया हुआ वंशावली-ढाँचा जानबूझकर सुरक्षित रखा गया है।
