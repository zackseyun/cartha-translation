  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: hi
  text: 'यह सब इसलिए हुआ कि वह बात पूरी हो जो प्रभु द्वारा भविष्यद्वक्ता के माध्यम से कही गई थी, जैसा कि भविष्यद्वक्ता ने कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: यह सब
  rationale: यह पदबंध अभी-अभी वर्णित घटनाओं को समग्र रूप से इंगित करता है; ‘सब’ ὅλον के समग्रता-बल को स्वाभाविक हिन्दी में बनाए रखता है। δέ यहाँ हल्का कथात्मक संयोजक है, जिसके लिए अलग शब्द जोड़ना आवश्यक नहीं।
- source_word: γέγονεν
  choice: हुआ
  rationale: γίνομαι के पूर्णकालिक रूप को हिन्दी कथावृत्त में स्वाभाविक ढंग से ‘हुआ’ कहा गया है; संदर्भ से घटनाओं का संपन्न होना स्पष्ट है।
- source_word: ἵνα πληρωθῇ
  choice: इसलिए ... कि ... पूरा हो
  rationale: ἵνα और कर्मवाच्य संभावनार्थक πληρωθῇ उद्देश्य और परिणाम दोनों की खुली हुई छाया रखते हैं। यह रचना उस तनाव को बनाए रखती है और ‘वचन’ जैसा अनुपस्थित संज्ञापद नहीं जोड़ती।
- source_word: τὸ ῥηθὲν
  choice: जो कहा था
  rationale: संज्ञीकृत कर्मवाच्य कृदंत का सहज हिन्दी रूप; ‘कहा गया था’ अधिक शब्दशः होता, पर कर्ता ‘प्रभु’ के साथ सक्रिय हिन्दी वाक्य अधिक स्पष्ट और स्वाभाविक है।
- source_word: ὑπὸ κυρίου διὰ τοῦ προφήτου
  choice: प्रभु ने भविष्यद्वक्ता के द्वारा
  rationale: ‘प्रभु ने’ परम वक्ता और ‘भविष्यद्वक्ता के द्वारा’ मानवीय माध्यम के बीच यूनानी व्याकरण में उपस्थित भेद को सुरक्षित रखते हैं।
- source_word: λέγοντος
  choice: 'उसने कहा:'
  rationale: यह कृदंत अगले पद के उद्धरण का परिचय देता है और व्याकरणतः निकटवर्ती ‘भविष्यद्वक्ता’ से जुड़ता है; हिन्दी में स्पष्ट उद्धरण-भूमिका के लिए यह रूप स्वाभाविक है।
theological_decisions:
- issue: भविष्यद्वाणी में कर्तृत्व
  choice: प्रभु को मूल वक्ता और भविष्यद्वक्ता को माध्यम के रूप में प्रस्तुत किया गया है।
  alternative: भविष्यद्वक्ता ने प्रभु की ओर से कहा
  rationale: ὑπό और διά के अलग-अलग प्रयोग को बनाए रखते हुए पाठ से आगे बढ़कर प्रेरणा का कोई विस्तृत सिद्धांत नहीं जोड़ा गया।
- issue: पूर्ति-सूत्र का उद्देश्य/परिणाम
  choice: ‘इसलिए ... कि ... पूरा हो’
  alternative: ‘जिसके परिणामस्वरूप ... पूरा हुआ’
  rationale: ἵνα + संभावनार्थक क्रिया उद्देश्य अथवा परिणाम, या दोनों, की छाया रख सकती है; चुना हुआ रूप इसे केवल परिणाम तक सीमित नहीं करता।
- issue: लेख के अभाव में ‘प्रभु’ की पहचान
  choice: ‘प्रभु’
  alternative: ‘प्रभु परमेश्वर’
  rationale: κύριος का सम्मानपूर्ण और परिचित हिन्दी समतुल्य दिया गया है; ‘परमेश्वर’ जोड़ने से मूल से अधिक सामग्री आ जाती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘भविष्यद्वक्ता’ बाइबलीय संदर्भ में परिचित पद है। पद अगले पद के उद्धरण की भूमिका है, इसलिए अंत में दीर्घ विराम लगाया गया है।
