  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: hi
  text: एलियूद एलीआज़र का पिता था, एलीआज़र मत्तान का पिता था, और मत्तान याकूब का पिता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: एलियूद
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी में ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: δὲ
  choice: और / अल्पविराम द्वारा व्यक्त
  rationale: वंशावली में δέ हल्के क्रमिक संयोजक के रूप में काम करता है। अंतिम खंड में ‘और’ तथा पहले खंडों में विराम-चिह्न स्वाभाविक हिन्दी प्रवाह देते हैं और क्रमिक संबंध बनाए रखते हैं।
- source_word: ἐγέννησεν
  choice: से … उत्पन्न हुआ
  rationale: वंशावली के संदर्भ में यह पुरुष वंश-संबंध बताता है। ‘से … उत्पन्न हुआ’ आधुनिक, गरिमापूर्ण और स्वाभाविक हिन्दी है तथा ‘जन्म दिया’ से जुड़े अस्वाभाविक पुरुष-विषयक प्रयोग से बचता है।
- source_word: τὸν
  choice: अलग से अनूदित नहीं
  rationale: यूनानी निश्चित उपपद यहाँ व्यक्तिनाम को कर्म के रूप में चिह्नित करता है; हिन्दी में व्यक्तिनाम के साथ इसके लिए अलग शब्द आवश्यक नहीं है।
- source_word: Ἐλεάζαρ
  choice: एलीआज़र
  rationale: यूनानी रूप का ऐसा देवनागरी लिप्यंतरण जो मूल उच्चारण और प्रचलित बाइबलीय नाम-रूप के बीच संतुलन रखता है।
- source_word: Ματθάν
  choice: मत्तान
  rationale: यूनानी व्यक्तिगत नाम का निकट ध्वन्यात्मक देवनागरी लिप्यंतरण।
- source_word: Ἰακώβ
  choice: याकूब
  rationale: मूल नाम का हिन्दी में सुस्थापित बाइबलीय रूप अपनाया गया है।
theological_decisions:
- issue: ἐγέννησεν में प्रत्यक्ष पितृत्व बनाम व्यापक वंश-संबंध
  choice: ‘से … उत्पन्न हुआ’
  alternative: ‘का पिता था’ / ‘उत्पन्न किया’
  rationale: यह अभिव्यक्ति वंशावली का संबंध स्पष्ट रखती है, पर यूनानी वंशावली-शैली की संभावित व्यापकता को अनावश्यक रूप से प्रत्यक्ष जैविक पितृत्व तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण वंशावली-शैली। तीनों समानांतर खंडों में एक ही संरचना रखी गई है, और अंतिम खंड से पहले ‘और’ लगाया गया है।
