  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: hi
  text: बाबुल को देश-निकाला दिए जाने[a] के बाद यकोन्याह से शालतीएल उत्पन्न हुआ, और शालतीएल से जरुब्बाबेल उत्पन्न हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाबुल में निर्वासन।” यूनानी शब्द लोगों को बलपूर्वक हटाकर बाबुल में निर्वासन के लिए ले जाए जाने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: के बाद
  rationale: μετά के साथ कर्मकारक समय-क्रम में ‘के बाद’ का अर्थ देता है। δέ हल्का संयोजक है, जिसे स्वाभाविक हिन्दी वाक्य में अलग से व्यक्त करना आवश्यक नहीं।
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: बाबुल में निर्वासन
  rationale: μετοικεσία लोगों को बलपूर्वक हटाकर निर्वासन में ले जाने की ऐतिहासिक घटना को सूचित करता है। ‘बाबुल में निर्वासन’ आधुनिक हिन्दी में स्वाभाविक है; पादटिप्पणी इसके स्थानांतरण वाले पहलू को स्पष्ट करती है।
- source_word: Ἰεχονίας
  choice: यकोन्याह
  rationale: यह Ἰεχονίας का प्रचलित हिन्दी बाइबलीय नाम-रूप है।
- source_word: ἐγέννησεν
  choice: से ... उत्पन्न हुआ
  rationale: वंशावली में γεννάω पुरुष-वंश की उत्पत्ति या वंशगत संबंध बताता है। हिन्दी की वंशावली-शैली ‘से ... उत्पन्न हुआ’ स्वाभाविक और गरिमापूर्ण है तथा आवश्यक नहीं कि हर पीढ़ी की जैविक निकटता को कड़ा बनाए।
- source_word: Σαλαθιήλ
  choice: शालतीएल
  rationale: यूनानी Σαλαθιήλ के लिए पहचाना जाने वाला हिन्दी बाइबलीय नाम-रूप।
- source_word: δὲ
  choice: और
  rationale: दूसरा δέ वंशावली की अगली कड़ी जोड़ता है; यहाँ ‘और’ स्वाभाविक संयोजक है।
- source_word: Ζοροβαβέλ
  choice: जरुब्बाबेल
  rationale: यूनानी Ζοροβαβέλ के लिए प्रचलित और पहचाना जाने वाला हिन्दी बाइबलीय नाम-रूप।
theological_decisions:
- issue: वंशावली में γεννάω का अनुवाद
  choice: ‘से ... उत्पन्न हुआ’ द्वारा पुरुष-वंश का संबंध व्यक्त करना, बिना हर संबंध को अनिवार्यतः तत्काल जैविक पिता-पुत्र संबंध ठहराए।
  alternative: ‘का पिता हुआ’ या ‘जन्म दिया’
  rationale: मत्ती की वंशावली पारंपरिक पूर्वज-संतान सूत्र का प्रयोग करती है। चुना हुआ रूप उस संबंध को बनाए रखता है और वंशावली की शैली से अधिक कठोर दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वंशावली के लिए संक्षिप्त, गरिमापूर्ण और सहज ‘से ... उत्पन्न हुआ’ सूत्र अपनाया गया है। नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं।
