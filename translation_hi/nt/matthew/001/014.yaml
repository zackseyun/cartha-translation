source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: hi
  text: अज़ोर से सादोक उत्पन्न हुआ, सादोक से अखीम उत्पन्न हुआ, और अखीम से इलीहूद उत्पन्न हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: अज़ोर
  rationale: यूनानी व्यक्तिगत नाम का आधुनिक हिन्दी में ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: δέ
  choice: और / वाक्य-क्रम में निहित
  rationale: वंशावली में δέ साधारण क्रमसूचक संयोजक है। पहले दो खंडों में समानांतर रचना से संबंध स्पष्ट है और अंतिम खंड में ‘और’ स्वाभाविक हिन्दी देता है।
- source_word: ἐγέννησεν
  choice: से … उत्पन्न हुआ
  rationale: वंशावली के संदर्भ में यह प्रयोग संतान या वंशज होने का संबंध बताता है। ‘से … उत्पन्न हुआ’ आधुनिक हिन्दी की परिचित वंशावली-शैली है और पुरुष के लिए अस्वाभाविक ‘जन्म दिया’ से बचता है।
- source_word: τὸν
  choice: अलग से अनूदित नहीं
  rationale: यह प्रत्येक नाम को प्रत्यक्ष कर्म के रूप में चिह्नित करने वाला यूनानी कर्मकारक लेख है; हिन्दी में व्यक्तिवाचक नाम के साथ इसके लिए अलग शब्द आवश्यक नहीं है।
- source_word: Σαδώκ
  choice: सादोक
  rationale: यूनानी नाम का हिन्दी में ध्वन्यात्मक लिप्यंतरण।
- source_word: Ἀχίμ
  choice: अखीम
  rationale: यूनानी नाम का हिन्दी में ध्वन्यात्मक लिप्यंतरण।
- source_word: Ἐλιούδ
  choice: इलीहूद
  rationale: यूनानी नाम का हिन्दी में ध्वन्यात्मक लिप्यंतरण।
theological_decisions:
- issue: वंशावली में γεννάω का संबंध प्रत्यक्ष पिता-पुत्र तक सीमित है या व्यापक वंशगत संबंध भी हो सकता है
  choice: ‘से … उत्पन्न हुआ’
  alternative: ‘… का पिता बना’
  rationale: चुनी हुई अभिव्यक्ति मूल के वंशगत संबंध को स्पष्ट रखती है, पर उसे अनावश्यक रूप से केवल तात्कालिक जैविक पितृत्व तक सीमित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। तीनों समानांतर वंशसूचक खंडों को स्पष्टता और मूल की पुनरावृत्ति बनाए रखने के लिए पूरा दोहराया गया है।
