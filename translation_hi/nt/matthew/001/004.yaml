  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: hi
  text: अराम[a] से अम्मीनादाब उत्पन्न हुआ, अम्मीनादाब से नहशोन उत्पन्न हुआ, और नहशोन से सलमोन उत्पन्न हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राम’। यूनानी पाठ में ‘अराम’ (Ἀράμ) है, जबकि इब्रानी वंशावलियों में इस नाम का रूप ‘राम’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρὰμ
  choice: अराम
  rationale: यूनानी पाठ के Ἀράμ का सीधा देवनागरी लिप्यंतरण; इब्रानी वंशावली में प्रचलित ‘राम’ को पाठ में मिलाए बिना पादटिप्पणी में रखा गया है।
- source_word: δὲ
  choice: और / अल्पविराम द्वारा क्रम-संबंध
  rationale: यहाँ δέ विरोध नहीं, बल्कि वंशावली की अगली कड़ी जोड़ता है। अंतिम कड़ी में ‘और’ तथा पहले स्थान पर अल्पविराम स्वाभाविक हिन्दी प्रवाह देते हैं।
- source_word: ἐγέννησεν
  choice: को जन्म दिया
  rationale: वंशावली के प्रसंग में यह पिता से संतान की उत्पत्ति को व्यक्त करता है। यह आधुनिक पाठक के लिए स्पष्ट है और मूल की बार-बार दोहराई गई सक्रिय रचना को बनाए रखता है।
- source_word: Ἀμιναδάβ
  choice: अम्मीनादाब
  rationale: यूनानी नाम का पहचानने योग्य और हिन्दी बाइबलीय परंपरा के अनुकूल लिप्यंतरण।
- source_word: Ναασσών
  choice: नहशोन
  rationale: संबंधित इब्रानी नाम से मेल खाने वाला, हिन्दी में प्रचलित बाइबलीय रूप चुना गया है; अधिक अक्षरशः यूनानी रूप ‘नास्सोन’ की अपेक्षा यह पूरे बाइबलीय संदर्भ में पहचान बनाए रखता है।
- source_word: Σαλμών
  choice: सलमोन
  rationale: यूनानी नाम का सरल, प्रचलित देवनागरी रूप, जिसे ‘सुलैमान’ से अलग रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की वंशावली-संबंधी पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है; नामों में जहाँ उपयुक्त है, व्यापक बाइबलीय पहचान को ध्यान में रखा गया है।
