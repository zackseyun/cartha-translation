source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: hi
  text: सलमोन ने राहाब से[a] बोअज़ को उत्पन्न किया, बोअज़ ने रूत से ओबेद को उत्पन्न किया, और ओबेद ने यिशै को उत्पन्न किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में राहाब और रूत—दोनों के नाम के साथ ἐκ (‘से,’ अर्थात मातृ-स्रोत या मातृत्व सूचित करने वाला शब्द) आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: उत्पन्न किया
  rationale: वंशावली में यह क्रिया पुरुष की ओर से संतानोत्पत्ति और वंशगत संबंध बताती है। ‘उत्पन्न किया’ आधुनिक हिन्दी में ‘जन्म दिया’ की अपेक्षा पुरुष कर्ता के साथ अधिक उपयुक्त है और पुरातन ‘जना’ से अधिक सहज है।
- source_word: ἐκ
  choice: से
  rationale: माता के नाम के साथ ἐκ मातृ-स्रोत अथवा मातृत्व को स्पष्ट करता है। हिन्दी में ‘राहाब से’ और ‘रूत से’ इस वंशावली-संबंध को स्वाभाविक और संक्षिप्त रूप में व्यक्त करते हैं।
- source_word: δὲ
  choice: और / क्रमसूचक अल्पविराम
  rationale: यहाँ δέ विरोध नहीं, बल्कि वंशावली की अगली कड़ी जोड़ता है। अंतिम कड़ी से पहले ‘और’ तथा पहले स्थान पर अल्पविराम हिन्दी के स्वाभाविक प्रवाह को बनाए रखते हैं।
- source_word: Σαλμὼν
  choice: सलमोन
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: Βόες
  choice: बोअज़
  rationale: पुराने नियम के इसी प्रसिद्ध व्यक्ति से नामगत निरंतरता बनाए रखने वाला प्रचलित हिन्दी रूप।
- source_word: Ῥαχάβ
  choice: राहाब
  rationale: पुराने नियम की संबंधित स्त्री के लिए प्रचलित हिन्दी नाम।
- source_word: Ἰωβὴδ
  choice: ओबेद
  rationale: इब्रानी नाम के प्रचलित हिन्दी बाइबलीय रूप द्वारा दोनों नियमों में पहचान बनी रहती है।
- source_word: Ῥούθ
  choice: रूत
  rationale: पुराने नियम की पुस्तक और स्त्री के नाम का प्रचलित हिन्दी रूप।
- source_word: Ἰεσσαί
  choice: यिशै
  rationale: दाऊद के पिता के लिए प्रचलित हिन्दी बाइबलीय रूप, जो पुराने और नए नियम में नामगत निरंतरता रखता है।
theological_decisions:
- issue: वंशावली के सूत्र में माताओं का स्पष्ट उल्लेख
  choice: पिता को कर्ता रखते हुए ‘राहाब से’ और ‘रूत से’ को स्पष्ट रूप से बनाए रखा गया है।
  alternative: केवल ‘का पिता हुआ’ कहना, अथवा अधिक यांत्रिक रूप से ‘राहाब में से’ कहना।
  rationale: यूनानी पाठ सामान्य पितृवंशीय सूत्र के भीतर ἐκ के साथ दोनों माताओं का विशेष उल्लेख करता है। अनुवाद इस उल्लेख को न तो मिटाता है, न उसका अर्थ आवश्यकता से अधिक निर्धारित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और वंशावली के लिए उपयुक्त रखी गई है। ‘उत्पन्न किया’ पितृवंशीय क्रिया को स्पष्ट करता है; स्त्रियों के नामों के साथ ‘से’ मूल पाठ की संक्षिप्तता और अर्थगत खुलापन बनाए रखता है।
