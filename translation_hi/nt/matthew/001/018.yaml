id: MAT.1.18
reference: Matthew 1:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: hi
  text: 'यीशु मसीह का जन्म[a] इस प्रकार हुआ: उनकी माता मरियम की मंगनी[b] यूसुफ से हो चुकी थी। उनके साथ रहने से पहले ही वह पवित्र आत्मा से गर्भवती पाई गईं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उत्पत्ति।” यहाँ यूनानी शब्द यीशु के जन्म अथवा उनके संसार में आने के आरम्भ का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: उस समय मंगनी विवाह की कानूनी रूप से मान्य प्रतिज्ञा थी और आज की सामान्य सगाई से अधिक बंधनकारी थी।
    reason: cultural_note
lexical_decisions:
- source_word: γένεσις
  choice: जन्म
  rationale: यहाँ यह शब्द यीशु के संसार में आने और जन्म की कथा का परिचय देता है। ‘जन्म’ आधुनिक हिन्दी में स्वाभाविक है, जबकि ‘उत्पत्ति’ इसका व्यापक सम्भव अर्थ है और उसे पादटिप्पणी में रखा गया है।
- source_word: Ἰησοῦ χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है। हिन्दी में ‘मसीह’ प्रचलित अर्थपूर्ण उपाधि है और इसे कुलनाम की तरह प्रस्तुत नहीं करता।
- source_word: οὕτως ἦν
  choice: इस प्रकार हुआ
  rationale: यह अभिव्यक्ति आगे वर्णित घटना के ढंग का परिचय देती है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: μνηστευθείσης
  choice: मंगनी … हो चुकी थी
  rationale: यह विवाह से पहले की औपचारिक और बंधनकारी प्रतिज्ञा को दर्शाता है। मुख्य पाठ में सहज हिन्दी रखी गई है और सांस्कृतिक-कानूनी बल पादटिप्पणी में स्पष्ट किया गया है।
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: उनके एक साथ आने से पहले
  rationale: यह यूनानी की शालीन और कुछ हद तक व्यापक अभिव्यक्ति को बनाए रखता है; सन्दर्भ में वैवाहिक सहवास और दाम्पत्य सम्बन्ध दोनों निहित हो सकते हैं।
- source_word: εὑρέθη
  choice: पाई गईं
  rationale: मूल का कर्मवाच्य बनाए रखा गया है और यह नहीं जोड़ा गया कि किसने या कैसे जाना।
- source_word: ἐν γαστρὶ ἔχουσα
  choice: गर्भवती
  rationale: यह यूनानी मुहावरे का स्पष्ट, वर्तमान और स्वाभाविक हिन्दी रूप है।
- source_word: ἐκ πνεύματος ἁγίου
  choice: पवित्र आत्मा से
  rationale: ‘से’ गर्भधारण के स्रोत को व्यक्त करता है। प्रसंग में πνεῦμα ἅγιον परमेश्वर के पवित्र आत्मा का निर्देश करता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: कथा के इस परिचय में यह अर्थपूर्ण उपाधि है। ‘मसीह’ हिन्दी पाठक के लिए स्थापित रूप है और उपाधि का भाव सुरक्षित रखता है।
- issue: πνεύματος ἁγίου का निर्देश
  choice: पवित्र आत्मा
  alternative: पवित्र आत्मा-शक्ति
  rationale: मत्ती के जन्म-वृत्तान्त में यह दैवी पवित्र आत्मा का निर्देश करता है। यूनानी में निश्चित उपपद न होना इसे अनिवार्यतः अनिश्चित नहीं बनाता।
- issue: συνελθεῖν का आशय
  choice: एक साथ आने
  alternative: दाम्पत्य सम्बन्ध बनाने
  rationale: मुख्य पाठ मूल की शालीनता और सम्भव व्यापकता बनाए रखता है; अधिक विशिष्ट यौन आशय को पादटिप्पणी में संकेत किया गया है, न कि चुपचाप मुख्य पाठ में निश्चित कर दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उनकी/पाई गईं’ आदरसूचक रूप हैं। वाक्य-विन्यास को स्वाभाविक बनाने के लिए यूनानी की लम्बी आश्रित रचना को दो वाक्यों में बाँटा गया है, पर घटनाक्रम और ‘पहले’ का बल सुरक्षित है।
