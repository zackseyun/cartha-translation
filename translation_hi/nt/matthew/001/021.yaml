id: MAT.1.21
reference: Matthew 1:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: hi
  text: वह एक पुत्र को जन्म देगी, और तुम उसका नाम यीशु[a] रखना, क्योंकि वही अपने लोगों को उनके पापों से बचाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यीशु’ उस यूनानी नाम का हिन्दी रूप है जो इब्रानी/अरामी ‘येशुआ’ (यहोशू) के अनुरूप है और ‘याहवे बचाता है’ के भाव से जुड़ा है। ‘क्योंकि वही … बचाएगा’ कहकर मत्ती इसी नाम-संबंधी शब्द-क्रीड़ा को प्रकट करते हैं।
    reason: नाम के मूल रूप और ‘बचाएगा’ के साथ उसकी शब्द-क्रीड़ा को स्पष्ट करना।
lexical_decisions:
- source_word: τέξεται
  choice: जन्म देगी
  rationale: प्रसव के संदर्भ में τίκτω के भविष्यकाल का स्वाभाविक और स्पष्ट हिन्दी रूप; भविष्यवाणी का बल बना रहता है।
- source_word: δὲ
  choice: —
  rationale: δέ एक हल्का संयोजक है; हिन्दी में इसे अलग से व्यक्त किए बिना वाक्य का प्रवाह स्वाभाविक रहता है।
- source_word: υἱὸν
  choice: एक पुत्र
  rationale: प्रसव-सूचना में अनिश्चित, एकवचन υἱόν को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: तुम उसका नाम … रखना
  rationale: यूनानी नामकरण-सूत्र का अर्थ स्पष्ट रखते हुए आधुनिक हिन्दी की स्वाभाविक आज्ञार्थक अभिव्यक्ति अपनाई गई है; संदर्भ में भविष्यकालीन कथन निर्देश का कार्य करता है।
- source_word: Ἰησοῦν
  choice: यीशु
  rationale: नए नियम के इस व्यक्ति के नाम का हिन्दी में स्थापित रूप; मूल नाम से जुड़े उद्धार-विषयक शब्द-संबंध को पाद-टिप्पणी स्पष्ट करती है।
- source_word: αὐτὸς
  choice: वही
  rationale: कर्तृवाचक सर्वनाम की व्यक्त बलाघातपूर्णता को संक्षेप और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: नाम रखने के कारण और उसके अर्थ-संबंधी व्याख्या को स्पष्ट रूप से प्रस्तुत करता है।
- source_word: σώσει
  choice: बचाएगा
  rationale: σῴζω का सीधा हिन्दी रूप; ‘पापों से’ के साथ उद्धार का अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: τὸν λαὸν αὐτοῦ
  choice: अपने लोगों को
  rationale: स्वामित्व-संबंध को स्वाभाविक हिन्दी में रखता है और ‘लोगों’ की सीमा को पाठ से आगे न तो संकुचित करता है, न विस्तृत।
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: उनके पापों से
  rationale: ἀπό के अलगाव के भाव तथा ἁμαρτιῶν के बहुवचन को ठीक तरह से बनाए रखता है।
theological_decisions:
- issue: यीशु के उद्धारकारी कार्य के संबंध में αὐτός का बल
  choice: ‘वही … बचाएगा’ द्वारा बल को बनाए रखा गया
  alternative: ‘वह … बचाएगा’
  rationale: यूनानी में व्यक्त कर्तृ-बल को बिना अतिरिक्त धर्मशास्त्रीय व्याख्या जोड़े स्वाभाविक हिन्दी में दर्शाता है।
- issue: ‘अपने लोगों’ की सीमा
  choice: वाक्यांश को बिना अतिरिक्त परिभाषा के ‘अपने लोगों’ रखा गया
  alternative: ‘अपने इस्राएली लोगों’ अथवा ‘उन सब लोगों जो उसके हैं’
  rationale: तात्कालिक संदर्भ यहूदी और वाचागत है, पर इस पद में समूह की सीमा स्पष्ट नहीं की गई; अनुवाद मूल की खुली हुई सीमा को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘पुत्र’ बाइबिलीय संदर्भ की गरिमा रखता है, जबकि ‘जन्म देगी’, ‘नाम … रखना’ और ‘बचाएगा’ सामान्य पाठक के लिए सहज हैं।
