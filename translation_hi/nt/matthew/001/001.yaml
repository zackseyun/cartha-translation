translation:
  language: hi
  text: दाऊद के पुत्र, अब्राहम के पुत्र यीशु मसीह की वंशावली[a] की पुस्तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उत्पत्ति की पुस्तक” अथवा “जन्म की पुस्तक।” यूनानी शब्द का व्यापक अर्थ “उत्पत्ति” या “जन्म” भी हो सकता है, यद्यपि आगे आने वाली वंश-सूची के संदर्भ में “वंशावली” सबसे उपयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: पुस्तक
  rationale: βίβλος पुस्तक, ग्रंथ या लिखित अभिलेख को दर्शा सकता है। शीर्षक-सदृश आरंभ में ‘पुस्तक’ मूल की औपचारिकता और शास्त्रीय गरिमा को बनाए रखता है।
- source_word: γενέσεως
  choice: वंशावली
  rationale: γένεσις का अर्थ उत्पत्ति, जन्म या वंशावली हो सकता है। इसके तुरंत बाद आने वाली वंश-सूची के कारण मुख्य पाठ में ‘वंशावली’ सबसे उपयुक्त है; व्यापक ‘उत्पत्ति’ का संकेत पादटिप्पणी में रखा गया है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: नाम का मानक हिन्दी रूप।
- source_word: χριστοῦ
  choice: मसीह
  rationale: Χριστός यहाँ यीशु की अभिषिक्त राजकीय पहचान बताने वाली उपाधि है। ‘मसीह’ आधुनिक हिन्दी में स्वाभाविक और धर्मवैचारिक रूप से पारदर्शी है।
- source_word: υἱοῦ Δαυὶδ
  choice: दाऊद का पुत्र
  rationale: शाब्दिक ‘पुत्र’ वंशज का भाव भी रखता है और स्थापित मसीहाई-राजकीय उपाधि की शक्ति को सुरक्षित रखता है।
- source_word: υἱοῦ Ἀβραάμ
  choice: अब्राहम का पुत्र
  rationale: यहाँ ‘पुत्र’ दूर के वंशज को भी दर्शाता है; मूल वंशावली-मुहावरे और वाचा-संबंधी संकेत को सुरक्षित रखने के लिए शाब्दिक रूप चुना गया है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: इस पद में शब्द उपाधि के रूप में यीशु की अभिषिक्त पहचान प्रस्तुत करता है; इसलिए हिन्दी में अर्थपूर्ण और प्रचलित ‘मसीह’ चुना गया है।
- issue: γενέσεως का आशय
  choice: वंशावली
  alternative: उत्पत्ति या जन्म
  rationale: तत्काल साहित्यिक संदर्भ वंश-सूची है, पर यूनानी शब्द के व्यापक उत्पत्ति/आरंभ संबंधी संकेत को पादटिप्पणी में बनाए रखा गया है।
- issue: ‘दाऊद का पुत्र, अब्राहम का पुत्र’ का संबंध
  choice: यीशु मसीह के वर्णन के रूप में रखा गया
  alternative: वंशावली के साथ व्याकरणिक संबंध मानना
  rationale: यूनानी संबंधकारक संरचना में कुछ व्याकरणिक खुलापन है, किंतु निकटतम और स्वाभाविक पठन इन पदबंधों को यीशु की दाऊदी और अब्राहमी पहचान बताने वाला मानता है। विराम-चिह्न अर्थ को स्पष्ट करते हैं, बिना ‘वंशज’ कहकर मूल ‘पुत्र’ को समतल किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, औपचारिक किंतु सहज बाइबलीय शैली। ‘वंशावली की पुस्तक’ मूल Βίβλος γενέσεως की औपचारिक संरचना को बनाए रखता है। डैश शीर्षकीय वाक्य में यीशु की दाऊदी और अब्राहमी पहचान को स्वाभाविक रूप से जोड़ता है।
