id: MAT.1.20
reference: Matthew 1:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: hi
  text: जब वह इन बातों पर विचार कर रहा था, तभी प्रभु का एक स्वर्गदूत उसे स्वप्न में दिखाई दिया और बोला, “दाऊद के पुत्र यूसुफ, अपनी पत्नी मरियम को अपने घर ले आने से मत डरना,[a] क्योंकि जो उसके गर्भ में उत्पन्न हुआ है, वह पवित्र आत्मा से है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी पत्नी मरियम को अपने साथ ले आने से।” यूनानी अभिव्यक्ति का आशय उसे विवाह-संबंध में अपने घर ले आने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: विचार कर ही रहा था
  rationale: यह यूसुफ के मन में चल रहे विचार-विमर्श को व्यक्त करता है और इसे पक्का निर्णय नहीं बनाता।
- source_word: ἰδοὺ
  choice: तभी
  rationale: आधुनिक हिन्दी में यह कथानक के अचानक और ध्यान खींचने वाले मोड़ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἄγγελος κυρίου
  choice: प्रभु का एक स्वर्गदूत
  rationale: यूनानी में ἄγγελος के साथ निश्चित उपपद नहीं है; इसलिए ‘एक स्वर्गदूत’ किसी विशिष्ट पुराने नियमीय पहचान को आरोपित नहीं करता।
- source_word: κατ’ ὄναρ ἐφάνη
  choice: सपने में दिखाई दिया
  rationale: रहस्योद्घाटनकारी दर्शन के लिए स्पष्ट और स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: υἱὸς Δαυίδ
  choice: दाऊद के पुत्र
  rationale: वंशगत संबंध और दाऊदी अनुगूँज दोनों सुरक्षित रहती हैं।
- source_word: μὴ φοβηθῇς
  choice: मत डरना
  rationale: निषेध और भय की भावना को सीधी, स्वाभाविक हिन्दी में रखता है।
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: मरियम को अपनी पत्नी के रूप में अपने घर ले आने
  rationale: परिप्रेक्ष्य में παραλαμβάνω का आशय विवाह-संबंध में मरियम को अपने साथ घर लाना है; ‘अपनी पत्नी’ यूनानी पदबंध के वैवाहिक अर्थ को बनाए रखता है।
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: जो उसके गर्भ में उत्पन्न हुआ है
  rationale: नपुंसकलिंग substantival participle की अनिश्चितता को ‘जो’ से बनाए रखते हुए गर्भावस्था का संदर्भ स्पष्ट करता है; समयपूर्व रूप से ‘बालक’ नहीं जोड़ता।
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: वह पवित्र आत्मा से है
  rationale: ἐκ के स्रोत अथवा उद्गम के अर्थ को संक्षिप्त और औपचारिक-समान हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ἄγγελος κυρίου में κυρίου का अनुवाद
  choice: प्रभु का एक स्वर्गदूत
  alternative: यहोवा का दूत / प्रभु का स्वर्गदूत
  rationale: ‘प्रभु’ κύριος का सीधा अनुवाद है; ‘एक’ यूनानी की अनिश्चितता को दर्शाता है और किसी विशिष्ट थियोफनी की पहचान को पाठ पर आरोपित नहीं करता।
- issue: πνεύματός ... ἁγίου का संदर्भ
  choice: पवित्र आत्मा
  alternative: पवित्र आत्मा की सामर्थ्य / कोई पवित्र आत्मा
  rationale: मत्ती के जन्म-वृत्तांत में यह ईश्वरीय पवित्र आत्मा का पदनाम है, केवल किसी शक्ति या अनिश्चित आत्मा का नहीं।
- issue: मरियम की वैवाहिक स्थिति
  choice: अपनी पत्नी के रूप में अपने घर ले आने
  alternative: अपनी पत्नी मरियम को ग्रहण करने
  rationale: यह भाषा यूनानी में मरियम को ‘तुम्हारी पत्नी’ कहे जाने को बनाए रखती है, साथ ही παραλαμβάνω के संदर्भगत आशय—उसे वैवाहिक घर में साथ लाना—को स्पष्ट करती है; यह किसी नए या दूसरे विवाह-संस्कार का दावा नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। ‘देखो’ का कृत्रिम प्रयोग न करके ἰδοὺ की कथात्मक शक्ति ‘तभी’ से व्यक्त की गई है।
