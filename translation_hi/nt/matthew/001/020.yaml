  terminology: “प्रभु का एक स्वर्गदूत,” “दाऊद के पुत्र,” and “पवित्र आत्मा” are appropriate. Revising the marital phrase to “अपनी पत्नी मरियम को” preserves the Greek wording while the footnote can explain the contextual sense of taking her into his home.
  issues:
  - severity: medium
    issue: “मरियम को अपनी पत्नी के रूप में” weakens the explicit designation “your wife.”
    rationale: The phrase “के रूप में” may be read as making Mary Joseph's wife only through the impending action. In Greek, τὴν γυναῖκά σου already identifies Mary as his wife; παραλαβεῖν concerns taking her into his home.
  - severity: low
    issue: The emphatic particle “ही” in “विचार कर ही रहा था” is not represented in the source.
    rationale: ἐνθυμηθέντος expresses Joseph's consideration, without the added emphasis or limitation conveyed by ही.
