    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: से … उत्पन्न हुआ/हुए
  rationale: वंशावली में γεννάω पिता की ओर से वंशोत्पत्ति दर्शाता है। हिन्दी की स्वाभाविक रचना ‘फलाँ से फलाँ उत्पन्न हुआ’ इस पितृवंशीय संबंध को स्पष्ट रखती है और हर खंड में कृत्रिम ‘पिता बना’ से बचती है। अंतिम खंड में संयुक्त बहुवचन कर्ता के कारण ‘उत्पन्न हुए’ है।
- source_word: δὲ
  choice: अल्पविराम / और
  rationale: यहाँ δέ विरोध नहीं, वंशावली की अगली कड़ी जोड़ने वाला हल्का संयोजक है। हिन्दी प्रवाह के लिए पहली कड़ी अल्पविराम से और अगली ‘और’ से जोड़ी गई है।
- source_word: Ἰούδαν
  choice: यहूदा
  rationale: यह याकूब के पुत्र और कुलपिता यहूदा का प्रचलित हिन्दी बाइबलीय नाम है, नए नियम के यहूदा/यहूदास नामक अन्य व्यक्तियों से संदर्भतः अलग।
- source_word: ἀδελφοὺς αὐτοῦ
  choice: उसके भाई
  rationale: पुल्लिंग बहुवचन ἀδελφούς यहाँ याकूब के अन्य पुत्रों, अर्थात यहूदा के भाइयों, को सूचित करता है; इसलिए लिंग-विशिष्ट ‘भाई’ सटीक है।
- source_word: Ἀβραὰμ / Ἰσαάκ / Ἰακώβ
  choice: अब्राहम / इसहाक / याकूब
  rationale: इन कुलपिताओं के लिए मानक और व्यापक रूप से पहचाने जाने वाले हिन्दी बाइबलीय नाम अपनाए गए हैं।
theological_decisions:
- issue: वंशावली के क्रियापद का अर्थ
  choice: ‘से … उत्पन्न हुआ/हुए’
  alternative: ‘ने … को जन्म दिया’ या ‘… का पिता बना’
  rationale: चुनी हुई रचना यूनानी के पितृवंशीय बल को बनाए रखती है, पर यह अनावश्यक रूप से तय नहीं करती कि प्रत्येक संबंध अनिवार्यतः बिना किसी पीढ़ीगत अंतर के प्रत्यक्ष पिता-पुत्र संबंध है। साथ ही पुरुष के लिए हिन्दी में अस्वाभाविक लग सकने वाले ‘जन्म दिया’ से बचती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। दोहराव मूल वंशावली की क्रमिक लय को सुरक्षित रखता है; ‘उत्पन्न हुआ’ औपचारिक है, पर सामान्य पाठक के लिए स्पष्ट और प्रचलित है।
