  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: hi
  text: तब यूसुफ नींद से जागा और उसने वैसा ही किया जैसा प्रभु के दूत ने उसे आज्ञा दी थी; उसने अपनी पत्नी को अपने साथ ले लिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपनी पत्नी को ग्रहण किया’ या ‘अपनी पत्नी को अपने घर ले आया।’ यूनानी क्रिया में किसी को अपने साथ अथवा अपने घराने में लेने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου
  choice: तब यूसुफ नींद से जागकर उठा
  rationale: δέ कथा को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है। ἐγερθεὶς और ἀπὸ τοῦ ὕπνου को मिलाकर यह वाक्यांश जागने और उठने की क्रमिक क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐποίησεν ὡς προσέταξεν αὐτῷ
  choice: उसने वैसा ही किया जैसा ... ने उसे आज्ञा दी थी
  rationale: यह आज्ञा के अनुरूप कार्य करने का अर्थ स्पष्ट रखता है; ‘आज्ञा’ προστάσσω की अधिकारपूर्ण शक्ति को व्यक्त करती है।
- source_word: ὁ ἄγγελος κυρίου
  choice: प्रभु के दूत
  rationale: यह यूनानी संबंधकारक पदबंध का सीधा और हिन्दी में प्रचलित बाइबलीय रूप है।
- source_word: παρέλαβεν τὴν γυναῖκα αὐτοῦ
  choice: वह अपनी पत्नी को अपने घर ले आया
  rationale: παραλαμβάνω यहाँ किसी को अपने साथ अथवा अपने घर ग्रहण करने का भाव रख सकता है। वैवाहिक संदर्भ में यह सहज हिन्दी है और केवल ‘ले लिया’ से उत्पन्न होने वाली कठोरता या अस्पष्टता से बचता है।
theological_decisions:
- issue: सहवास से पहले के संदर्भ में γυνή का अनुवाद
  choice: अपनी पत्नी
  alternative: उस स्त्री को
  rationale: मत्ती मरियम को कानूनी-सामाजिक वैवाहिक ढाँचे में प्रस्तुत करता है। ‘पत्नी’ इस स्थिति को व्यक्त करता है, पर अपने आप में विवाह-संबंध पूर्ण होने का दावा नहीं करता।
- issue: ἄγγελος κυρίου में κύριος का अनुवाद
  choice: प्रभु के दूत
  alternative: याहवे के दूत
  rationale: ‘प्रभु’ यूनानी κύριος का पारदर्शी अनुवाद है और इस परिचित बाइबलीय पदबंध को किसी ऐसी विशिष्टता से नहीं भरता जो यूनानी पाठ में प्रत्यक्ष नहीं है।
