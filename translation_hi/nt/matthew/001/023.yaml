source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: hi
  text: “देखो, कुँवारी[a] गर्भधारण करेगी और एक पुत्र को जन्म देगी, और लोग[b] उसका नाम इम्मानुएल[c] रखेंगे”—जिसका अनुवाद[d] है, “परमेश्वर हमारे साथ है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युवती।” फिर भी मत्ती के संदर्भ में यूनानी शब्द παρθένος और आसपास का जन्म-वृत्तांत “कुँवारी” अर्थ का समर्थन करते हैं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “वे उसका नाम … रखेंगे”; यह अनिर्दिष्ट बहुवचन प्रयोग है।
    reason: lexical_alternative
  - marker: c
    text: इस नाम को “एम्मानुएल” भी लिखा जाता है।
    reason: lexical_alternative
  - marker: d
    text: या, “जिसका अनुवाद करने पर अर्थ होता है।”
    reason: previous_rendering
lexical_decisions:
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह भविष्यवाणी के उद्धरण में ध्यान आकर्षित करने वाले उद्गार का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ἡ παρθένος
  choice: कुँवारी
  rationale: मत्ती के जन्म-वृत्तांत में παρθένος का सामान्य अर्थ ऐसी स्त्री है जिसने यौन-संबंध नहीं बनाया; इसलिए मुख्य पाठ में ‘कुँवारी’ संदर्भानुकूल है। व्यापक शाब्दिक संभावना ‘युवती’ को पादटिप्पणी में रखा गया है।
- source_word: ἐν γαστρὶ ἕξει
  choice: गर्भधारण करेगी
  rationale: यूनानी मुहावरे का शाब्दिक भाव ‘गर्भ में रखेगी’ है; आधुनिक हिन्दी में ‘गर्भधारण करेगी’ उसी भाव को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: τέξεται υἱόν
  choice: एक पुत्र को जन्म देगी
  rationale: यह प्रसव और पुत्र—दोनों को सीधे व्यक्त करता है तथा यूनानी भविष्यकाल को बनाए रखता है।
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: लोग उसका नाम … रखेंगे
  rationale: यूनानी में कर्ता अनिर्दिष्ट तृतीय पुरुष बहुवचन है। हिन्दी में ‘लोग’ उस अनिर्दिष्ट बहुवचन को निष्क्रिय वाक्य में बदले बिना स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἐμμανουήλ
  choice: इम्मानुएल
  rationale: यह यूनानी नाम का हिन्दी में प्रचलित और उसके सामी मूल के निकट लिप्यंतरण है।
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: जिसका अनुवाद है
  rationale: यह व्याख्यात्मक कृदंत का स्वाभाविक हिन्दी रूप है और स्पष्ट करता है कि लेखक नाम का अर्थ पाठक को बता रहा है।
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: परमेश्वर हमारे साथ है
  rationale: यूनानी नाम-वाक्य में क्रिया व्यक्त नहीं है, पर हिन्दी में ‘है’ जोड़ना स्वाभाविक है; इससे नाम का अर्थ स्पष्ट रहता है, बिना किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या के।
theological_decisions:
- issue: कुँवारी से गर्भधारण के संदर्भ में παρθένος का अनुवाद
  choice: कुँवारी
  alternative: युवती
  rationale: मत्ती 1 के निकट संदर्भ और प्रयुक्त यूनानी शब्द के सामान्य अर्थ के कारण ‘कुँवारी’ मुख्य पाठ के लिए उचित है। फिर भी शब्द की व्यापक शाब्दिक संभावना को पादटिप्पणी में बताया गया है, ताकि चर्चा को छिपाया न जाए।
- issue: ‘इम्मानुएल’ नाम के अर्थ का धर्मवैज्ञानिक भार
  choice: पाठ के अपने स्पष्टीकरण ‘परमेश्वर हमारे साथ है’ तक सीमित रहना
  alternative: देहधारण या मसीह की प्रकृति के विषय में विस्तृत व्याख्यात्मक वाक्य जोड़ना
  rationale: मत्ती स्वयं नाम का अर्थ देता है। अनुवाद उस अर्थ को पूर्ण भार के साथ रखता है, लेकिन पद में न कही गई धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: καλέσουσιν के अनिर्दिष्ट बहुवचन कर्ता को बनाए रखना
  choice: लोग … रखेंगे
  alternative: उसका नाम … रखा जाएगा
  rationale: सक्रिय, अनिर्दिष्ट बहुवचन मूल यूनानी की वास्तविक अस्पष्टता बनाए रखता है और यह तय नहीं करता कि नाम रखने वाला कोई विशेष व्यक्ति या समूह है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यवाणी के उद्धरण के अनुरूप गरिमापूर्ण स्वर रखा गया है। ‘देखो’ ध्यान आकर्षित करने वाले Ἰδοὺ को सहज रूप में व्यक्त करता है। ‘परमेश्वर’ बाइबिलीय संदर्भ के लिए व्यापक रूप से समझा जाने वाला पद है।
