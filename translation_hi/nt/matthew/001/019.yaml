source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: hi
  text: और उसका पति यूसुफ[a] धर्मी था और उसे सार्वजनिक रूप से अपमानित नहीं करना चाहता था,[b] इसलिए उसने उसे चुपचाप तलाक देने का निश्चय किया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका मंगेतर।” यूनानी में शाब्दिक रूप से “उसका पुरुष/पति” है; यह यहूदी मंगनी की कानूनी रूप से बाध्यकारी प्रकृति दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसे सबके सामने अपमानित करना” अथवा “उसे उदाहरण बनाना”।
    reason: lexical_alternative
  - marker: c
    text: या “उसे गुप्त रूप से विदा कर देना।” इस प्रसंग में इसका अर्थ मंगनी की अवधि में औपचारिक तलाक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: उसका पति
  rationale: ἀνήρ संबंध के अनुसार ‘पुरुष’ या ‘पति’ हो सकता है। यहाँ कानूनी रूप से बंधी मंगनी और संबंध-विच्छेद के लिए ἀπολῦσαι के प्रयोग के कारण ‘पति’ स्वाभाविक है; मंगनी की अवस्था को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: δίκαιος
  choice: धर्मी
  rationale: यह यूसुफ के नैतिक चरित्र को व्यक्त करता है और बाइबलीय-धर्मवैज्ञानिक अनुगूँज बनाए रखता है, बिना यह तय किए कि यहाँ मुख्य बल व्यवस्था-पालन पर है या करुणा पर।
- source_word: δειγματίσαι
  choice: सार्वजनिक रूप से लज्जित करना
  rationale: क्रिया किसी को खुले तौर पर प्रदर्शित करके अपमानित करने का भाव रखती है। यह हिन्दी अभिव्यक्ति सार्वजनिक अपमान के प्रसंगगत अर्थ को स्पष्ट और स्वाभाविक ढंग से देती है।
- source_word: ἐβουλήθη
  choice: निश्चय किया
  rationale: βούλομαι यहाँ सोच-विचार से बने इरादे या निर्णय को सूचित करता है; ‘निश्चय किया’ आधुनिक हिन्दी में इस विचारपूर्ण संकल्प को व्यक्त करता है।
- source_word: λάθρᾳ
  choice: चुपचाप
  rationale: शब्द का अर्थ गुप्त या निजी ढंग से है। ‘चुपचाप’ सार्वजनिक अपमान से बचने की चिंता के अनुरूप स्वाभाविक हिन्दी है।
- source_word: ἀπολῦσαι αὐτήν
  choice: उसे ... तलाक देने
  rationale: यहूदी मंगनी कानूनी रूप से बाध्यकारी थी, इसलिए ἀπολύω यहाँ औपचारिक संबंध-विच्छेद बताता है। ‘तलाक देना’ आधुनिक पाठक के लिए कानूनी बल स्पष्ट करता है।
- source_word: δὲ
  choice: और
  rationale: यह कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘और’ हिन्दी में सहज है।
- source_word: ὢν καὶ μὴ θέλων
  choice: धर्मी था और ... नहीं करना चाहता था
  rationale: यूनानी कृदन्तीय रचना यूसुफ के निर्णय की पृष्ठभूमि देती है। हिन्दी में सीमित क्रियाओं वाली यह रचना अर्थ-संबंध को स्पष्ट और स्वाभाविक रखती है।
theological_decisions:
- issue: यूसुफ का δίκαιος के रूप में चरित्र-चित्रण
  choice: ‘धर्मी’ रखा गया है, बिना यह निर्धारित किए कि इसका आशय मुख्यतः व्यवस्था के प्रति निष्ठा, करुणा, या दोनों से है।
  alternative: ‘न्यायी’ अथवा दया पर बल देने वाली व्याख्यात्मक पुनरुक्ति।
  rationale: यूनानी पाठ यूसुफ को δίκαιος कहता है और साथ ही मरियम को सार्वजनिक रूप से लज्जित न करने की उसकी इच्छा बताता है। अनुवाद नैतिक सीधाई और दयापूर्ण संयम के बीच तनाव को खुला रखता है।
- issue: यूसुफ और मरियम की कानूनी स्थिति
  choice: मुख्य पाठ में ‘पति’ और ‘तलाक’ का प्रयोग किया गया है।
  alternative: ‘मंगेतर’ और ‘मंगनी तोड़ना’, अथवा अधिक शब्दशः ‘पुरुष’ और ‘विदा कर देना’।
  rationale: यूनानी शब्दावली और पहली सदी की यहूदी मंगनी की बाध्यकारी प्रकृति औपचारिक वैवाहिक-कानूनी संबंध दिखाती है। आधुनिक कानूनी शब्द इसे स्पष्ट करते हैं, जबकि पादटिप्पणियाँ वास्तविक चरण और शाब्दिक विकल्प सुरक्षित रखती हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘धर्मी’, ‘सार्वजनिक रूप से लज्जित’, ‘चुपचाप’ और ‘तलाक’ मूल के नैतिक, सामाजिक और कानूनी आयामों को संतुलित करते हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
