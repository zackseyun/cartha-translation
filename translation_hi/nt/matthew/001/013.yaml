  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: hi
  text: जरुब्बाबेल से अबीहूद[a] उत्पन्न हुआ, अबीहूद से एल्याकीम उत्पन्न हुआ, और एल्याकीम से अजोर उत्पन्न हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जरुब्बाबेल अबीहूद का पिता बना”; बाइबलीय वंशावलियों में बार-बार प्रयुक्त यह क्रिया कभी-कभी कई पीढ़ियों को संक्षेप में प्रस्तुत कर सकती है।
    reason: शाब्दिक विकल्प और वंशावली-संक्षेप की सम्भावना स्पष्ट करना।
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: जरुब्बाबेल
  rationale: व्यक्तिनाम को हिन्दी की प्रचलित बाइबलीय वर्तनी में लिप्यंतरित किया गया है; यह पुराने नियम के उसी ऐतिहासिक व्यक्ति की पहचानी जाने वाली हिन्दी रूपावली है।
- source_word: δέ
  choice: — / और
  rationale: यहाँ δέ विरोध नहीं, बल्कि वंशावली की अगली कड़ी जोड़ने वाला हल्का संयोजक है। सहज हिन्दी में हर उपवाक्य में इसे दोहराना आवश्यक नहीं; अंतिम उपवाक्य से पहले ‘और’ क्रमिक प्रवाह को व्यक्त करता है।
- source_word: ἐγέννησεν
  choice: से … उत्पन्न हुआ
  rationale: वंशावली के प्रसंग में यह स्वाभाविक और गरिमापूर्ण हिन्दी प्रयोग है। यह पुरुष वंश की कड़ी को व्यक्त करता है और ‘जन्म दिया’ जैसी आधुनिक हिन्दी में अस्वाभाविक लगने वाली अभिव्यक्ति से बचता है।
- source_word: Ἀβιούδ
  choice: अबीहूद
  rationale: यूनानी व्यक्तिनाम का देवनागरी में सुबोध लिप्यंतरण; दीर्घ स्वर और अंतिम ध्वनि को हिन्दी पाठक के लिए स्पष्ट रखा गया है।
- source_word: Ἐλιακίμ
  choice: एल्याकीम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप चुना गया है, जो यूनानी उच्चारण को पर्याप्त रूप से दर्शाता है।
- source_word: Ἀζώρ
  choice: अजोर
  rationale: व्यक्तिनाम का सरल देवनागरी लिप्यंतरण चुना गया है; यूनानी ζ को हिन्दी की स्वाभाविक ‘ज’ ध्वनि से व्यक्त किया गया है।
theological_decisions:
- issue: वंशावली में γεννάω का अर्थ और पीढ़ियों के संक्षेप की सम्भावना
  choice: से … उत्पन्न हुआ
  alternative: का पिता हुआ / का पूर्वज था
  rationale: मुख्य पाठ का प्रयोग यूनानी की वंशावली-सूत्रात्मकता और सीधी वंश-कड़ी को बनाए रखता है, पर यह स्वयं यह निर्णय नहीं करता कि हर कड़ी अनिवार्यतः निकटतम पीढ़ी ही है। ‘पूर्वज था’ सम्भावित संक्षेप को स्पष्ट कर देता, पर यूनानी से कम सीधा होता; इसलिए उस सम्भावना को पाद-टिप्पणी में समझाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वंशावली-शैली अपनाई गई है। समानान्तर उपवाक्यों में क्रिया दोहराकर यूनानी सूत्र की लय और स्पष्टता बनाए रखी गई है।
