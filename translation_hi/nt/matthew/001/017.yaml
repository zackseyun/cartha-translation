id: MAT.1.17
reference: Matthew 1:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: hi
  text: इस प्रकार, अब्राहम से दाऊद तक कुल चौदह पीढ़ियाँ हुईं, दाऊद से बाबुल को निर्वासन तक चौदह पीढ़ियाँ, और बाबुल को निर्वासन से मसीह तक चौदह पीढ़ियाँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: इस प्रकार ... कुल ... पीढ़ियाँ
  rationale: οὖν के सार-सूचक निष्कर्ष को ‘इस प्रकार’ व्यक्त करता है; Πᾶσαι का भाव ‘कुल’ से और γενεαί का वंशावली-संदर्भित अर्थ ‘पीढ़ियाँ’ से स्वाभाविक हिन्दी में आता है।
- source_word: ἀπὸ ... ἕως
  choice: से ... तक
  rationale: वंशावली के दो सीमाबिंदुओं के बीच के विस्तार को हिन्दी की स्वाभाविक युग्मित रचना ‘से ... तक’ ठीक व्यक्त करती है।
- source_word: μετοικεσίας Βαβυλῶνος
  choice: बाबुल-निर्वासन
  rationale: μετοικεσία बलपूर्वक स्थानांतरण और निर्वासन की घटना को सूचित करता है। ‘बाबुल-निर्वासन’ संक्षिप्त है और केवल बंदी अवस्था के बजाय निर्वासित किए जाने के ऐतिहासिक भाव को रखता है।
- source_word: τοῦ χριστοῦ
  choice: मसीह
  rationale: सव्यंजक लेख और वंशावली के चरमबिंदु में χριστός उपाधि के रूप में प्रयुक्त है; ‘मसीह’ हिन्दी में इस अभिषिक्त उद्धारकर्ता-संबंधी उपाधि का स्थापित और अर्थपूर्ण रूप है।
- source_word: γενεαὶ δεκατέσσαρες
  choice: चौदह पीढ़ियाँ
  rationale: तीनों खंडों में दोहराई गई गणनात्मक संज्ञा-रचना को समानांतर रूप में सुरक्षित रखा गया है।
- source_word: Ἀβραὰμ / Δαυὶδ / Βαβυλῶνος
  choice: अब्राहम / दाऊद / बाबुल
  rationale: हिन्दी बाइबल-पाठकों में प्रचलित और सहज पहचाने जाने वाले नामरूप अपनाए गए हैं।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / क्राइस्ट
  rationale: यहाँ शब्द व्यक्तिगत नाम मात्र नहीं, वंशावली की प्रतिज्ञात्मक परिणति बताने वाली उपाधि है। ‘मसीह’ उसके उपाधिगत अर्थ को स्पष्ट रखते हुए किसी अतिरिक्त सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: ‘कुल चौदह पीढ़ियाँ’ और सूची में नामों की गणना
  choice: मत्ती के सार-वाक्य को यथावत प्रस्तुत करना
  alternative: गणना मिलाने के लिए ‘पीढ़ियाँ’ को ‘वंश-खंड’ कहना या पाठ में स्पष्टीकरण जोड़ना
  rationale: Πᾶσαι और γενεαὶ δεκατέσσαρες को स्पष्ट रूप से अनूदित किया गया है; वंशावली की चयनात्मक संरचना से उत्पन्न तनाव को पाठ में चुपचाप हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सरल। यूनानी की तीन समानांतर अवधियों को बनाए रखने के लिए मुख्य क्रिया ‘हुईं’ अंत में रखी गई है। ‘बाबुल-निर्वासन’ ऐतिहासिक घटना के लिए संक्षिप्त संयुक्त पद है।
