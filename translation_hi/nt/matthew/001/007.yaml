base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: hi
  text: सुलैमान ने रहूबियाम को जन्म दिया, रहूबियाम ने अबिय्याह को जन्म दिया, और अबिय्याह ने आसाप[a] को जन्म दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में ‘आसा’ पढ़ा जाता है, जो 1 राजा 15 और 2 इतिहास 14–16 में वर्णित यहूदा के राजा आसा से मेल खाता है; यहाँ दिए गए यूनानी पाठ में ‘आसाप’ है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: का पिता हुआ
  rationale: वंशावली में यह क्रिया पुरुष के पिता होने और वंश-क्रम को व्यक्त करती है। ‘का पिता हुआ’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है तथा ‘से उत्पन्न हुआ’ की संभावित अस्पष्टता से बचती है।
- source_word: δὲ
  choice: और / क्रमसूचक विराम
  rationale: यहाँ δέ विरोध नहीं, बल्कि वंशावली की अगली कड़ी जोड़ने वाला हल्का संयोजक है। हिन्दी में अंतिम कड़ी पर ‘और’ तथा पहले स्थान पर अल्पविराम स्वाभाविक रूप से यही कार्य करते हैं।
- source_word: Σολομών
  choice: सुलैमान
  rationale: हिन्दी बाइबल परंपरा और सामान्य पाठकीय पहचान में प्रचलित नामरूप।
- source_word: Ῥοβοάμ
  choice: रहूबियाम
  rationale: पुराने नियम के इसी व्यक्ति के लिए हिन्दी में प्रचलित और पहचान योग्य नामरूप।
- source_word: Ἀβιά
  choice: अबिय्याह
  rationale: पुराने नियम के राजकीय नाम से संबंध स्पष्ट रखने वाला प्रचलित हिन्दी रूप।
- source_word: Ἀσάφ
  choice: आसाप
  rationale: प्रदत्त यूनानी पाठ Ἀσάφ का हिन्दी लिप्यंतरण; अपेक्षित ‘आसा’ से चुपचाप सामंजस्य नहीं किया गया।
theological_decisions:
- issue: क्या मत्ती की वंशावली को पुराने नियम की यहूदा-राजा सूची से मिलाने के लिए Ἀσάφ का अनुवाद ‘आसा’ किया जाए
  choice: मुख्य पाठ में ‘आसाप’ रखा गया
  alternative: ‘आसा’
  rationale: प्रदत्त SBLGNT पाठ में Ἀσάφ है। मूल-पाठ को प्राथमिकता देते हुए इसी पाठ को मुख्य पंक्ति में सुरक्षित रखा गया है; ‘आसा’ पाठांतर और पुराने नियम से उसके संबंध को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्यरचना सरल, स्वाभाविक और वंशावली के औपचारिक स्वर के अनुरूप रखी गई है। नामों के लिए हिन्दी बाइबल परंपरा में पहचाने जाने वाले रूप अपनाए गए हैं, जबकि Ἀσάφ की वास्तविक पाठ-भिन्नता स्पष्ट रूप से सुरक्षित है।
