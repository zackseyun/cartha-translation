  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: hi
  text: यहूदा के तामार से पेरेस और जेरह उत्पन्न हुए। पेरेस से हेस्रोन उत्पन्न हुआ, और हेस्रोन से अराम[a] उत्पन्न हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ अनुवादों और बाइबलीय वंशावली-परंपराओं में यहाँ “राम” नाम मिलता है; इस यूनानी पाठ में “अराम” है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: यहूदा
  rationale: यह वंशावली में इस्राएल के कुलपिता का नाम है; हिन्दी बाइबल परंपरा का परिचित रूप ‘यहूदा’ नए नियम के ‘यहूदा/यूदास’ नामधारी अन्य व्यक्तियों से संदर्भगत भेद भी स्पष्ट करता है।
- source_word: δὲ
  choice: वाक्य-विभाजन और ‘और’
  rationale: यहाँ δέ हल्का क्रमसूचक संयोजक है, विरोधसूचक नहीं। स्वाभाविक हिन्दी में पहले दो प्रयोग वाक्य-विन्यास से और अंतिम प्रयोग ‘और’ से व्यक्त किए गए हैं।
- source_word: ἐγέννησεν
  choice: से ... उत्पन्न हुए/हुआ
  rationale: वंशावली में γεννάω पिता के माध्यम से जन्म अथवा वंशगत उत्पत्ति बताता है। हिन्दी का यह प्रचलित वंशावली-विन्यास संक्षिप्त और गरिमापूर्ण है तथा ‘जन्म दिया’ जैसे मातृ-केंद्रित अर्थ से बचता है।
- source_word: Φαρὲς
  choice: पेरेस
  rationale: यह इब्रानी פֶּרֶץ के अनुरूप हिन्दी में परिचित नामरूप है और पुराने नियम के नाम से निरंतरता रखता है।
- source_word: Ζάρα
  choice: जेरह
  rationale: यह इब्रानी זֶרַח के अनुरूप हिन्दी नामरूप है और पुराने नियम की पहचान बनाए रखता है।
- source_word: ἐκ τῆς Θαμάρ
  choice: तामार के द्वारा
  rationale: ἐκ मातृ-स्रोत को सूचित करता है। ‘के द्वारा’ तामार की उल्लेखनीय मातृभूमिका को स्पष्ट रखता है, बिना अतिरिक्त व्याख्या जोड़े।
- source_word: Θαμάρ
  choice: तामार
  rationale: हिन्दी में प्रचलित बाइबलीय नामरूप।
- source_word: Ἑσρώμ
  choice: हेस्रोन
  rationale: यह इब्रानी חֶצְרוֹן के अनुरूप हिन्दी में प्रचलित रूप है और पुराने नियम से नामगत निरंतरता रखता है।
- source_word: Ἀράμ
  choice: अराम
  rationale: प्रदत्त यूनानी पाठ में स्पष्ट रूप से Ἀράμ है; इसलिए मुख्य पाठ उसी का सीधा लिप्यंतरण करता है, उसे ‘राम’ से समरूप नहीं बनाता।
theological_decisions:
- issue: अंतिम नाम को पुराने नियम की प्रचलित वंशावली के अनुसार समरूप करना या यूनानी पाठ का रूप बनाए रखना
  choice: अराम
  alternative: राम
  rationale: मूल-भाषा की प्राथमिकता के अनुसार मुख्य पाठ SBLGNT के Ἀράμ का अनुसरण करता है। पाठकों को अन्य वंशावलियों अथवा अनुवाद-परंपराओं में मिलने वाला ‘राम’ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वंशावली-शैली अपनाई गई है। ‘फलाँ ने फलाँ को जन्म दिया’ की अपेक्षा ‘फलाँ से फलाँ उत्पन्न हुआ’ चुना गया है, क्योंकि यह पितृवंशीय γεννάω को स्वाभाविक हिन्दी में व्यक्त करता है। सभी नाम देवनागरी में पुराने नियम से यथासंभव परिचित रूपों में दिए गए हैं।
