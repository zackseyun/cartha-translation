id: MAT.5.16
reference: Matthew 5:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: hi
  text: उसी प्रकार तुम्हारा प्रकाश लोगों के सामने चमके, ताकि वे तुम्हारे भले कामों को देखें और तुम्हारे पिता की महिमा करें, जो स्वर्गों में हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: उसी प्रकार
  rationale: यह पिछले पद के दीपक और प्रकाश के चित्र से संबंध जोड़ता है और रीति या ढंग का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λαμψάτω
  choice: चमके
  rationale: तीसरे पुरुष की आज्ञार्थक क्रिया को हिन्दी में इच्छार्थक-आज्ञार्थक रूप से रखा गया है; पूरे वाक्य में इसका बल है कि शिष्य अपने प्रकाश को दिखाई देने दें।
- source_word: τὸ φῶς ὑμῶν
  choice: तुम्हारा प्रकाश
  rationale: यूनानी के एकवचन और सामूहिक आशय दोनों को सुरक्षित रखते हुए स्वाभाविक संबंधसूचक अनुवाद।
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: लोगों के सामने
  rationale: ἄνθρωποι यहाँ सामान्य रूप से मनुष्यों को दर्शाता है, केवल पुरुषों को नहीं; ‘लोगों’ आधुनिक हिन्दी में अर्थ को सही और सहज रूप से व्यक्त करता है।
- source_word: ὅπως
  choice: ताकि
  rationale: आगे आने वाली संभावनार्थक क्रियाओं के उद्देश्य या अपेक्षित परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἴδωσιν
  choice: वे ... देखें
  rationale: ὅπως के साथ प्रयुक्त यूनानी संभावनार्थक रूप का आशय हिन्दी के ‘ताकि ... देखें’ निर्माण से स्पष्ट होता है।
- source_word: τὰ καλὰ ἔργα
  choice: तुम्हारे भले कामों
  rationale: καλά में अच्छे, उत्तम और प्रशंसनीय होने का भाव है; ‘भले काम’ सामान्य पाठकों के लिए सहज है और नैतिक गुणवत्ता को व्यक्त करता है।
- source_word: δοξάσωσιν
  choice: महिमा करें
  rationale: δοξάζω का ईश्वर के संबंध में प्रचलित, अर्थपूर्ण और गरिमापूर्ण हिन्दी प्रतिरूप।
- source_word: τὸν πατέρα ὑμῶν
  choice: तुम्हारे पिता
  rationale: संबंधपरक भाषा और बहुवचन ‘तुम्हारे’ को सुरक्षित रखता है।
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: जो स्वर्गों में हैं
  rationale: मूल यूनानी के बहुवचन οὐρανοῖς को सुरक्षित रखते हुए हिन्दी में सम्मानसूचक क्रिया का प्रयोग किया गया है।
theological_decisions:
- issue: ἀνθρώπων का सामान्य मानवीय संदर्भ
  choice: लोगों के सामने
  alternative: मनुष्यों के सामने / पुरुषों के सामने
  rationale: यहाँ शब्द सभी मनुष्यों को समाविष्ट करता है। हिन्दी में ‘पुरुषों’ कहने से अर्थ अनावश्यक रूप से केवल पुरुषों तक सीमित प्रतीत होगा; ‘लोगों’ से मूल का सामान्य आशय स्पष्ट रहता है।
- issue: οὐρανοῖς का बहुवचन
  choice: जो स्वर्गों में हैं
  alternative: जो स्वर्ग में हैं
  rationale: मूल पाठ के व्याकरणिक बहुवचन को बिना किसी विशिष्ट ब्रह्मांड-विज्ञान की व्याख्या जोड़े सुरक्षित रखा गया है।
- issue: दिखने वाले भले कामों और पिता की महिमा का संबंध
  choice: ताकि वे तुम्हारे भले कामों को देखें और तुम्हारे पिता की महिमा करें
  alternative: ताकि तुम्हारे भले काम देखकर वे तुम्हारे पिता की महिमा करें
  rationale: दोनों संभावनार्थक क्रियाओं की समानांतर यूनानी रचना को बनाए रखा गया है, जिससे मानवीय कामों और परमेश्वर को दी जाने वाली महिमा के बीच मूल पाठ का तनाव और संबंध बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। ‘तुम्हारा/तुम्हारे’ से शिष्यों को बहुवचन संबोधन संदर्भानुसार व्यक्त होता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘लोगों’ सामान्य मानवीय अर्थ को सीधे स्पष्ट करता है और ‘स्वर्गों’ मूल के बहुवचन को मुख्य पाठ में ही सुरक्षित रखता है।
