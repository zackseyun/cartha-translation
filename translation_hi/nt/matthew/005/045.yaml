id: MAT.5.45
reference: Matthew 5:45
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: hi
  text: ताकि तुम अपने स्वर्ग में रहनेवाले पिता के पुत्र[a] बनो, क्योंकि वह अपने सूर्य को बुरे और भले लोगों पर उगाता है और धर्मियों और अधर्मियों पर वर्षा करता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पिता की संतान।” यूनानी में “पुत्र” है; स्रोत के पुत्रत्व-संबंधी शब्द को बनाए रखने के लिए मुख्य पाठ में यही रखा गया है।
    reason: lexical_alternative
  - marker: c
    text: या “धर्मियों और अधर्मियों पर बारिश बरसाता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως γένησθε
  choice: ताकि तुम ... बनो
  rationale: ὅπως उद्देश्य या परिणाम का भाव देता है और γένησθε ‘बनना’ व्यक्त करता है। यह अनुवाद क्रिया की गतिशीलता को बनाए रखता है, उसे केवल स्थिर ‘हो’ में नहीं बदलता।
- source_word: υἱοὶ τοῦ πατρὸς ὑμῶν
  choice: अपने ... पिता के पुत्र
  rationale: υἱοί स्पष्ट रूप से ‘पुत्र’ है; इसे बनाए रखने से स्रोत का पुत्रत्व-संबंधी शब्दचित्र सुरक्षित रहता है। ‘अपने’ हिन्दी में ὑμῶν के संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῦ ἐν οὐρανοῖς
  choice: जो स्वर्गों में है
  rationale: मत्ती के यूनानी प्रयोग में οὐρανοῖς बहुवचन है। हिन्दी में ‘स्वर्ग में’ अधिक प्रचलित है, पर मुख्य पाठ में ‘स्वर्गों में’ रखने से मूल रूप सुरक्षित रहता है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: τὸν ἥλιον αὐτοῦ ἀνατέλλει
  choice: अपने सूर्य को ... उदय करता है
  rationale: αὐτοῦ का अधिकार-सूचक भाव ‘अपने’ से सुरक्षित है। सकर्मक प्रयोग ἀνατέλλει में परमेश्वर की सक्रिय भूमिका व्यक्त होती है।
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: बुरे और भले लोगों पर
  rationale: यूनानी विशेषण संज्ञा की तरह प्रयुक्त हैं। हिन्दी में ‘लोगों’ जोड़ना अर्थ को स्पष्ट और स्वाभाविक बनाता है, जबकि नैतिक विरोध बरकरार रहता है।
- source_word: βρέχει
  choice: वर्षा करता है
  rationale: यूनानी क्रिया सीधे ‘वर्षा करता है’ कहती है। हिन्दी में यह प्रयोग स्वाभाविक है और परमेश्वर की कर्तृता भी बनाए रखता है।
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: धर्मियों और अधर्मियों पर
  rationale: यह δίκαιος/ἄδικος के स्थापित नैतिक और बाइबलीय विरोध को संक्षिप्त रूप में व्यक्त करता है।
theological_decisions:
- issue: पुत्रत्व की लिंग-सूचक भाषा
  choice: पिता के पुत्र
  alternative: पिता की संतान
  rationale: मूल में υἱοί है, τέκνα नहीं। इसलिए मुख्य पाठ में ‘पुत्र’ रखा गया है; संदर्भ में शिष्यों का व्यापक समूह अभिप्रेत हो सकता है, जिसे पादटिप्पणी स्पष्ट करती है।
- issue: γένησθε और परमेश्वर से पुत्रत्व का संबंध
  choice: बनो
  alternative: ठहरो / सिद्ध हो कि तुम हो
  rationale: ‘बनो’ यूनानी क्रिया का सीधा बल सुरक्षित रखता है। संदर्भ पिता की उदारता का अनुकरण करने पर केंद्रित है; अनुवाद इससे आगे बढ़कर यह निर्धारित नहीं करता कि पुत्रत्व किस उद्धार-विधि से प्राप्त होता है।
- issue: सभी पर परमेश्वर की सामान्य कृपा
  choice: बुरे और भले ... धर्मियों और अधर्मियों पर
  alternative: केवल योग्य लोगों पर कृपा का संकेत
  rationale: वाक्य का संतुलित समानांतर स्पष्ट रूप से दोनों नैतिक वर्गों पर सूर्य और वर्षा की बात करता है; इसे बिना धर्मशास्त्रीय संकुचन के रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भले’, ‘धर्मी’ और ‘अधर्मी’ नैतिक समानांतर को स्पष्ट रखते हैं। मुख्य पाठ में यूनानी बहुवचन ‘स्वर्गों’ और पुत्रत्व-संबंधी ‘पुत्र’ को संरक्षित किया गया है; अधिक मुहावरेदार विकल्प पादटिप्पणियों में हैं।
