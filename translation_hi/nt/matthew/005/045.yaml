  source_fidelity: The draft accurately preserves the purpose clause, the dynamic force of γένησθε ('बनो'), the explicit filial term υἱοί ('पुत्र'), God's possessive relation to the sun, and the balanced scope of both clauses. However, 'स्वर्गों में' is overly literal and unnatural in modern Hindi for this Matthean idiom; singular 'स्वर्ग में' is idiomatic without a semantic loss. 'सूर्य को ... उदय करता है' is also not idiomatic Hindi verbal usage.
  naturalness: A small revision makes the verse read more naturally and maintain a dignified modern Hindi register. 'स्वर्ग में रहनेवाले पिता' clearly and naturally represents 'the Father ... in the heavens,' while 'उगाता है' is the natural Hindi causative expression for making the sun rise.
  terminology: '''पुत्र,'' ''धर्मी,'' and ''अधर्मी'' appropriately preserve the Greek''s gendered filial wording and established moral contrast. The alternative ''संतान'' belongs in the footnote, not the main text. Footnote b should identify the Greek plural as a literal form while explaining the idiomatic Hindi singular.'
  issues:
  - severity: medium
    issue: ‘स्वर्गों में’ is an unnatural calque in the main text.
    rationale: Although οὐρανοῖς is formally plural, Hindi normally uses singular ‘स्वर्ग में’ in this expression. The plural can be documented in a footnote without making the main text stilted.
  - severity: medium
    issue: ‘अपने सूर्य को ... उदय करता है’ is awkward Hindi.
    rationale: Hindi normally says that the sun rises (उगता है); when God is the agent, ‘अपने सूर्य को ... उगाता है’ expresses the Greek active/cognitive causative sense naturally.
  - severity: low
    issue: The wording ‘अपने उस पिता’ is less smooth than necessary.
    rationale: ‘अपने स्वर्ग में रहनेवाले पिता’ naturally expresses the full Greek description without turning it into the less explicit adjective ‘स्वर्गीय।’
