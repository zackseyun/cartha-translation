  to: ताकि तुम अपने स्वर्ग में रहनेवाले पिता के पुत्र[a] बनो, क्योंकि वह अपने सूर्य को बुरे और भले लोगों पर उगाता है और धर्मियों और अधर्मियों पर वर्षा करता है[c]।
  rationale: The revision retains the source's purpose, sonship language, divine agency, possessive ‘his sun,’ and moral parallelism. It replaces two literal but awkward Hindi expressions with idiomatic equivalents. Footnote b is retained as an audit-trail note for the Greek plural, but no b marker is placed in the revised text because the singular Hindi idiom is not a separate lexical alternative requiring a visible anchor in this compact verse.
