id: MAT.5.47
reference: Matthew 5:47
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: hi
  text: और यदि तुम केवल अपने भाइयों[a] को नमस्कार करते हो, तो तुम कौन-सा असाधारण काम करते हो?[b] क्या गैर-यहूदी भी ऐसा ही नहीं करते?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाइयों और बहनों’; यूनानी में ‘भाइयों’ है, लेकिन यहाँ इसका संकेत अपने समूह या समुदाय के लोगों की ओर अधिक व्यापक रूप से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तुम इससे बढ़कर क्या करते हो?’
    reason: lexical_alternative
  - marker: c
    text: या ‘अन्यजाति’; कुछ संदर्भों में ‘मूर्तिपूजक’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: नमस्कार करते हो
  rationale: यह क्रिया अभिवादन करने को व्यक्त करती है। ‘नमस्कार करते हो’ आधुनिक हिन्दी में स्वाभाविक है और आतिथ्य जैसे अतिरिक्त अर्थ नहीं जोड़ती।
- source_word: ἀδελφοὺς
  choice: भाइयों
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है। मुख्य पाठ में इसका रूप सुरक्षित रखा गया है, जबकि अपने समुदाय के स्त्री-पुरुष सदस्यों के व्यापक अर्थ की संभावना पादटिप्पणी में दी गई है।
- source_word: μόνον
  choice: केवल
  rationale: यह अभिवादन को एक सीमित समूह तक बाँधता है; ‘केवल’ स्पष्ट और सहज हिन्दी है।
- source_word: τί περισσὸν ποιεῖτε
  choice: तुम कौन-सा असाधारण काम करते हो?
  rationale: περισσόν सामान्य से बढ़कर, विशेष या असाधारण बात को सूचित करता है। यह अनुवाद प्रश्न की आलंकारिक धार बनाए रखता है।
- source_word: ἐθνικοὶ
  choice: गैर-यहूदी
  rationale: यहाँ शब्द यहूदियों से बाहर के लोगों को दर्शाता है। ‘गैर-यहूदी’ आधुनिक पाठक के लिए सीधे समझ में आता है और ‘मूर्तिपूजक’ जैसा अधिक संकीर्ण धार्मिक अर्थ नहीं थोपता।
- source_word: τὸ αὐτὸ
  choice: ऐसा ही
  rationale: यह पूर्वोक्त व्यवहार के समान कार्य को दर्शाता है; हिन्दी में ‘ऐसा ही करते’ स्वाभाविक है।
theological_decisions:
- issue: नैतिक शिक्षा में ἀδελφοὺς का दायरा
  choice: मुख्य पाठ में ‘भाइयों’, और व्यापक सामुदायिक अर्थ पादटिप्पणी में
  alternative: भाइयों और बहनों; अपने लोगों
  rationale: मूल का पुल्लिंग बहुवचन रूप सुरक्षित रखा गया है, पर शब्द के केवल सगे पुरुष भाई तक सीमित न होने की वास्तविक संभावना भी स्पष्ट की गई है।
- issue: ἐθνικοὶ का अर्थ
  choice: गैर-यहूदी
  alternative: अन्यजाति; मूर्तिपूजक
  rationale: मूल शब्द का प्राथमिक जातीय-सामुदायिक विरोध सुरक्षित रहता है। ‘मूर्तिपूजक’ धार्मिक अर्थ को आवश्यकता से अधिक प्रबल कर सकता है।
- issue: περισσόν की नैतिक तुलना
  choice: असाधारण काम
  alternative: इससे बढ़कर क्या करते हो
  rationale: मुख्य पाठ सामान्य आचरण से आगे बढ़ने की माँग को व्यक्त करता है; वैकल्पिक, अधिक शाब्दिक तुलनात्मक अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन रखा गया है। ‘तुम’ यीशु के शिष्यों को दिए गए बहुवचन संबोधन के लिए स्वाभाविक है। आलंकारिक प्रश्नों की तीक्ष्णता और मूल पाठ की सामुदायिक तथा नैतिक तुलना सुरक्षित रखी गई है।
