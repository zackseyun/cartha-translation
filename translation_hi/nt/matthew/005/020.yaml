id: MAT.5.20
reference: Matthew 5:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: hi
  text: क्योंकि मैं तुमसे कहता हूँ कि यदि तुम्हारी धार्मिकता शास्त्रियों और फ़रीसियों की धार्मिकता से बढ़कर न हो,[a] तो तुम स्वर्ग के राज्य में हरगिज़ प्रवेश नहीं करोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धार्मिकता’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘न्याय’ या ‘न्यायप्रियता’ भी हो सकता है; यहाँ मत्ती 5 के संदर्भ में ‘धार्मिकता’ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: क्योंकि मैं तुमसे कहता हूँ
  rationale: γάρ का व्याख्यात्मक संबंध ‘क्योंकि’ से और λέγω का सीधा, वर्तमान संबोधन स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: ἐὰν μὴ
  choice: यदि ... न हो
  rationale: यह आवश्यक नकारात्मक शर्त व्यक्त करता है; हिन्दी में ‘यदि ... न’ वाक्य की तुलना-संरचना के साथ सहज है।
- source_word: περισσεύσῃ ... πλεῖον
  choice: से बढ़कर न हो
  rationale: क्रिया और तुलनात्मक पद मिलकर मात्रा या गुण में अधिक होने का भाव देते हैं; ‘से बढ़कर’ इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: तुम्हारी धार्मिकता
  rationale: यहाँ δικαιοσύνη परमेश्वर की इच्छा के अनुरूप सही आचरण और चरित्र की ओर संकेत करती है। ‘धार्मिकता’ हिन्दी बाइबिलीय प्रयोग में इस व्यापक अर्थ को सुरक्षित रखती है।
- source_word: τῶν γραμματέων καὶ Φαρισαίων
  choice: शास्त्रियों और फ़रीसियों की धार्मिकता
  rationale: यूनानी में तुलना संक्षिप्त है; हिन्दी में ‘की धार्मिकता’ दोहराने से स्पष्ट होता है कि तुलना व्यक्तियों की नहीं, उनकी धार्मिकता की है। γραμματεῖς के लिए ‘शास्त्री’ और Φαρισαῖοι के लिए मानक समूह-नाम ‘फ़रीसी’ रखा गया है।
- source_word: οὐ μὴ εἰσέλθητε
  choice: हरगिज़ प्रवेश नहीं करोगे
  rationale: οὐ μή का प्रबल निषेध ‘हरगिज़ ... नहीं’ द्वारा व्यक्त होता है, जबकि भविष्यसूचक अर्थ ‘करोगे’ में स्वाभाविक रहता है।
- source_word: τὴν βασιλείαν τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: यह मत्ती का विशिष्ट पद है। ‘स्वर्ग का राज्य’ हिन्दी में स्थापित, स्पष्ट और मूल के संबंधवाचक अर्थ के अनुरूप है।
theological_decisions:
- issue: मत्ती के संदर्भ में δικαιοσύνη का अर्थ
  choice: धार्मिकता
  alternative: न्यायप्रियता / न्याय
  rationale: तत्काल संदर्भ में बात केवल सामाजिक न्याय की नहीं, बल्कि परमेश्वर की इच्छा के अनुरूप जीवन और आज्ञाकारिता की व्यापक गुणवत्ता की है। फिर भी मूल शब्द में न्याय-संबंधी अर्थ-छाया संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: शास्त्रियों और फ़रीसियों से तुलना का आशय
  choice: ‘की धार्मिकता’ स्पष्ट रूप से दोहराई गई
  alternative: ‘शास्त्रियों और फ़रीसियों से बढ़कर’
  rationale: मूल का आशय उनकी धार्मिकता से तुलना करना है। हिन्दी में संज्ञा दोहराने से यह स्पष्ट होता है, बिना यह तय किए कि ‘बढ़कर’ का अर्थ केवल मात्रा, आंतरिकता या किसी विशिष्ट धर्मवैधानिक सिद्धांत से है।
- issue: οὐ μή की धर्मवैचारिक तीव्रता
  choice: हरगिज़ प्रवेश नहीं करोगे
  alternative: प्रवेश नहीं करोगे
  rationale: मूल का दुहरा निषेध अत्यंत दृढ़ है; साधारण निषेध उसकी चेतावनी की शक्ति घटा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘तुम’ यीशु के शिष्यों से बहुवचन प्रत्यक्ष संबोधन को स्वाभाविक ढंग से व्यक्त करता है। ‘हरगिज़’ प्रबल निषेध को बिना पुरातन शैली के सुरक्षित रखता है।
