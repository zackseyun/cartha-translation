source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: hi
  text: क्योंकि यदि तुम उन्हीं से प्रेम करते हो जो तुमसे प्रेम करते हैं, तो तुम्हें क्या प्रतिफल मिलता है?[a] क्या चुंगी लेने वाले भी ऐसा ही नहीं करते?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें क्या मजदूरी मिलती है?” यूनानी शब्द का अर्थ “मजदूरी” या “प्रतिफल” हो सकता है; यहाँ यह यीशु की शिक्षा के संदर्भ में मिलने वाले प्रतिदान को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: क्योंकि यदि
  rationale: γάρ पिछले कथन का कारण बताता है और ἐάν शर्त प्रस्तुत करता है; ‘क्योंकि यदि’ दोनों संबंधों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀγαπήσητε
  choice: तुम ... प्रेम करते हो
  rationale: ἐάν के साथ एओरिस्ट सब्जंक्टिव सामान्य शर्त व्यक्त करता है; हिन्दी का वर्तमानकाल इस अर्थ को सहज रूप से प्रकट करता है।
- source_word: τοὺς ἀγαπῶντας ὑμᾶς
  choice: जो तुमसे प्रेम करते हैं
  rationale: संज्ञात्मक कृदंत उस समूह को दर्शाता है जिसकी पहचान श्रोताओं से प्रेम करने के द्वारा होती है; यह अनुवाद मूल की प्रेम-वाचक पुनरावृत्ति भी बनाए रखता है।
- source_word: τίνα μισθὸν ἔχετε
  choice: तुम्हें क्या प्रतिफल मिलेगा
  rationale: μισθός का अर्थ मजदूरी या प्रतिफल हो सकता है। इस नैतिक संदर्भ में ‘प्रतिफल’ उपयुक्त है; हिन्दी में भविष्यसूचक ‘मिलेगा’ अपेक्षित फल की बात अधिक स्वाभाविक ढंग से कहता है।
- source_word: οὐχὶ καὶ
  choice: क्या ... भी ... नहीं
  rationale: οὐχί सकारात्मक उत्तर की अपेक्षा वाला आलंकारिक प्रश्न बनाता है और καί यहाँ ‘भी’ के द्वारा तुलना को उभारता है।
- source_word: οἱ τελῶναι
  choice: चुंगी लेनेवाले
  rationale: τελῶναι कर या मार्ग-शुल्क वसूलनेवालों को दर्शाता है। ‘चुंगी लेनेवाले’ सुसमाचारों के ऐतिहासिक संदर्भ में सटीक और हिन्दी पाठकों के लिए परिचित है।
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: ऐसा ही ... करते
  rationale: यह उसी पारस्परिक प्रेम के व्यवहार को सूचित करता है; ‘ऐसा ही करते’ संक्षिप्त और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: यीशु की नैतिक शिक्षा में μισθός का अर्थ
  choice: प्रतिफल
  alternative: मजदूरी
  rationale: ‘प्रतिफल’ नैतिक तथा परमेश्वर-संबंधी संदर्भ को बनाए रखता है, पर किसी यांत्रिक पुण्य-अर्जन की धारणा नहीं जोड़ता। ‘मजदूरी’ मूल शब्द का संभव अर्थ है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए बहुवचन ‘तुम’ रखा गया है। शैली सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल है। ‘चुंगी लेनेवाले’ ऐतिहासिक-सांस्कृतिक पद को संक्षेप में सुरक्षित रखता है।
