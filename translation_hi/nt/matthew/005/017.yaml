  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: hi
  text: यह न समझो कि मैं व्यवस्था या भविष्यद्वक्ताओं को रद्द करने आया हूँ।[a] मैं उन्हें रद्द करने नहीं, बल्कि पूरा करने आया हूँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर ‘आया हूँ’ का अनुवाद ‘आया’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पूरा करने’ का अर्थ ‘पूर्णता तक पहुँचाने’ या ‘पूरी तरह प्रकट करने’ के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: यह न समझो
  rationale: μή के साथ aorist subjunctive यहाँ निषेध व्यक्त करता है। ‘यह न समझो’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: ἦλθον
  choice: मैं ... आया हूँ
  rationale: यूनानी aorist को प्रसंगानुसार हिन्दी के वर्तमान-पूर्ण रूप में देना स्वाभाविक है और यीशु के आगमन के वर्तमान उद्देश्य को स्पष्ट रखता है; दोनों occurrences में समान रूप रखा गया है।
- source_word: καταλῦσαι
  choice: रद्द करने
  rationale: व्यवस्था और भविष्यद्वक्ताओं के संदर्भ में इसका आशय भौतिक विनाश नहीं, बल्कि निरस्त करना या प्रभावहीन कर देना है। ‘रद्द करना’ साधारण आधुनिक हिन्दी में इस अर्थ को साफ़ व्यक्त करता है।
- source_word: τὸν νόμον ἢ τοὺς προφήτας
  choice: व्यवस्था या भविष्यद्वक्ताओं को
  rationale: यह युग्म इस्राएल के पवित्र शास्त्र के मान्य विभागों की ओर संकेत करता है। ‘व्यवस्था’ और ‘भविष्यद्वक्ता’ हिन्दी बाइबलीय प्रयोग में पहचाने जाने वाले, गरिमापूर्ण शब्द हैं।
- source_word: ἀλλὰ πληρῶσαι
  choice: बल्कि पूरा करने
  rationale: ‘पूरा करना’ πληρόω की व्यापकता बनाए रखता है—पूर्णता तक पहुँचाना, सिद्ध करना, या पूरा अर्थ प्रकट करना—बिना किसी एक धर्मवैज्ञानिक व्याख्या को मुख्य पाठ में तय किए। पीछे के दोनों संज्ञापदों को स्पष्ट करने के लिए ‘उन्हें’ जोड़ा गया है।
theological_decisions:
- issue: πληρῶσαι में यीशु का ‘व्यवस्था या भविष्यद्वक्ताओं’ से संबंध
  choice: ‘पूरा करने’ का व्यापक पद बनाए रखा गया
  alternative: पूर्णता तक पहुँचाने; पूर्ण रूप से प्रकट करने; स्थापित करने
  rationale: इस पद की व्याख्या विभिन्न परंपराओं में अलग-अलग ढंग से होती है। ‘पूरा करना’ मूल की अर्थगत और धर्मवैज्ञानिक व्यापकता को बनाए रखता है तथा किसी एक व्याख्या को अनिवार्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सीधी और गरिमापूर्ण है। ‘व्यवस्था’ तथा ‘भविष्यद्वक्ता’ शास्त्रीय युग्म को सुरक्षित रखते हैं। पादटिप्पणी चिह्न संबंधित दावों के बाद रखे गए हैं और मुख्य पाठ में दोनों चिह्न उपस्थित हैं।
