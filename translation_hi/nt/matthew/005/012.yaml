  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: hi
  text: आनन्दित हो और हर्ष से भर जाओ, क्योंकि स्वर्ग में[a] तुम्हारा प्रतिफल बहुत बड़ा है; क्योंकि इसी तरह उन्होंने उन नबियों को सताया जो तुमसे पहले आए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, शाब्दिक: ‘स्वर्गों में।’ मत्ती प्रायः यूनानी में बहुवचन रूप का प्रयोग करते हैं, जहाँ हिन्दी में सामान्यतः एकवचन ‘स्वर्ग’ कहा जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρετε
  choice: आनन्दित हो
  rationale: वर्तमानकालिक बहुवचन आज्ञा सक्रिय आनन्द का आह्वान करती है; यह आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀγαλλιᾶσθε
  choice: हर्ष से भर जाओ
  rationale: यह χαίρετε से अधिक प्रबल, उमड़ते हुए आनन्द को व्यक्त करता है; चुना हुआ वाक्यांश तीव्रता को सहज हिन्दी में बनाए रखता है।
- source_word: μισθὸς
  choice: प्रतिफल
  rationale: सन्दर्भ में यह सताए जाने के बदले परमेश्वर से मिलने वाले फल को दर्शाता है; ‘प्रतिफल’ व्यापारिक मजदूरी का अनावश्यक भाव नहीं लाता।
- source_word: πολὺς
  choice: बहुत बड़ा
  rationale: यह प्रतिफल की महत्ता या परिमाण पर बल देता है और हिन्दी में ‘प्रतिफल’ के साथ स्वाभाविक है।
- source_word: ἐν τοῖς οὐρανοῖς
  choice: स्वर्गों में
  rationale: मत्ती के यूनानी पाठ में आए बहुवचन को मुख्य पाठ में सुरक्षित रखा गया है, यद्यपि हिन्दी में एकवचन ‘स्वर्ग में’ अधिक सामान्य है।
- source_word: οὕτως
  choice: इसी तरह
  rationale: यह शिष्यों के सताव और पहले के नबियों के सताव के ढंग में समानता को स्पष्ट करता है।
- source_word: ἐδίωξαν
  choice: उन्होंने ... सताया
  rationale: इस सन्दर्भ में διώκω का अर्थ शत्रुतापूर्ण सताव है; यूनानी के अनिर्दिष्ट बहुवचन कर्ता को ‘उन्होंने’ द्वारा अस्पष्ट ही रखा गया है।
- source_word: προφήτας
  choice: नबियों
  rationale: इस्राएल के भविष्यद्वक्ताओं के लिए आधुनिक, व्यापक रूप से समझा जाने वाला हिन्दी पद।
- source_word: τοὺς πρὸ ὑμῶν
  choice: जो तुमसे पहले हुए थे
  rationale: यह उन नबियों को ऐतिहासिक रूप से पहले की पीढ़ी के रूप में स्पष्ट और स्वाभाविक हिन्दी में पहचानता है।
theological_decisions:
- issue: ἐν τοῖς οὐρανοῖς का बहुवचन
  choice: मुख्य पाठ में ‘स्वर्गों में’
  alternative: ‘स्वर्ग में’
  rationale: बहुवचन यूनानी रूप को औपचारिक रूप से दृश्यमान रखा गया है, जबकि पादटिप्पणी हिन्दी के सामान्य एकवचन विकल्प को बताती है; इससे किसी विशिष्ट ब्रह्माण्ड-विज्ञान को आरोपित नहीं किया जाता।
- issue: प्रतिफल की प्रकृति
  choice: ‘प्रतिफल’ बिना अतिरिक्त व्याख्या के
  alternative: ‘इनाम’ या व्याख्यात्मक रूप से ‘परमेश्वर से मिलने वाला प्रतिफल’
  rationale: μισθός को स्पष्ट रूप से प्रस्तुत किया गया है, पर यह पद प्रतिफल के आधार, समय या सटीक स्वरूप को नहीं समझाता; इसलिए अनुवाद भी इन बातों को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दो आनन्दसूचक आज्ञाओं की तीव्रता को ‘आनन्दित हो’ और ‘हर्ष से भर जाओ’ द्वारा सुरक्षित किया गया है। मुख्य पाठ में यूनानी बहुवचन के कारण ‘स्वर्गों’ रखा गया और अधिक सामान्य हिन्दी रूप पादटिप्पणी में दिया गया है।
