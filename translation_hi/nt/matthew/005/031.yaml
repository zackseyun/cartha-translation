base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: hi
  text: “यह भी कहा गया था, ‘जो कोई अपनी पत्नी को तलाक दे[a], वह उसे तलाक-पत्र दे।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी पत्नी को विदा करे।” यूनानी क्रिया का अर्थ “विदा करना” भी हो सकता है, लेकिन यहाँ वैवाहिक कानूनी संदर्भ में इसका आशय तलाक देना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη
  choice: कहा गया था
  rationale: यह मत्ती में पहले कही गई शिक्षा का उद्धरण प्रस्तुत करने वाला कर्मवाच्य सूत्र है; आधुनिक हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: δέ
  choice: भी
  rationale: यहाँ δέ अगली संबंधित शिक्षा की ओर संक्रमण कराता है। हिन्दी में ‘यह भी कहा गया था’ प्रसंग के क्रम को स्वाभाविक ढंग से व्यक्त करता है; ‘परन्तु’ इस पद में आवश्यकता से अधिक स्पष्ट विरोध जता सकता है।
- source_word: Ὃς ἂν
  choice: जो कोई
  rationale: सापेक्ष सर्वनाम और ἄν मिलकर अनिश्चित सामान्य शर्त व्यक्त करते हैं, जिसे ‘जो कोई’ सहज रूप से दर्शाता है।
- source_word: ἀπολύσῃ
  choice: तलाक दे
  rationale: ἀπολύω का सामान्य अर्थ ‘विदा करना’ हो सकता है, पर पत्नी और तलाक-पत्र के इस कानूनी वैवाहिक संदर्भ में इसका आशय तलाक देना है।
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: अपनी पत्नी को
  rationale: γυνή संदर्भानुसार स्त्री या पत्नी हो सकता है; स्वत्वसूचक पद और तलाक का संदर्भ ‘पत्नी’ निश्चित करते हैं। हिन्दी में कर्ता की ओर लौटता ‘अपनी’ स्वाभाविक है।
- source_word: δότω
  choice: वह ... दे
  rationale: तीसरे पुरुष की आज्ञार्थक क्रिया को हिन्दी कानूनी कथन में ‘वह ... दे’ स्वाभाविक रूप से व्यक्त करता है और आदेशात्मक बल बनाए रखता है।
- source_word: αὐτῇ
  choice: उसे
  rationale: सम्प्रदान कारक उस पत्नी को दस्तावेज़ दिए जाने का संकेत देता है; हिन्दी में ‘उसे’ स्पष्ट और सहज है।
- source_word: ἀποστάσιον
  choice: तलाक-पत्र
  rationale: यह शब्द विवाह-विच्छेद के लिखित दस्तावेज़ को दर्शाता है। ‘तलाक-पत्र’ संक्षिप्त, वर्तमान और कानूनी आशय में स्पष्ट है।
theological_decisions:
- issue: मूसा की तलाक-संबंधी व्यवस्था से यीशु के कथन का संबंध
  choice: इसे पहले कही गई कानूनी शिक्षा के उद्धरण के रूप में प्रस्तुत किया गया है, बिना इस पद में उसकी स्वीकृति या अस्वीकृति जोड़े।
  alternative: इसे तलाक की प्रक्रिया का यीशु द्वारा समर्थन करने वाली सीधी आज्ञा, अथवा केवल प्रचलित व्यवहार का वर्णन मानकर अधिक व्याख्यात्मक ढंग से अनुवाद करना।
  rationale: यह पद उस पुराने कथन का परिचय देता है जिस पर यीशु अगले पद में प्रतिक्रिया देते हैं। अतः अनुवाद को इस पद में व्यापक नैतिक प्रश्न का निर्णय नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रूप। उद्धरण की कानूनी शैली रखी गई है; ‘यह भी कहा गया था’ आसपास के शिक्षण-क्रम से संबंध दिखाता है।
