  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: hi
  text: मैं तुमसे सच कहता हूँ, तुम वहाँ से तब तक किसी भी तरह बाहर नहीं निकलोगे, जब तक तुम आखिरी क्वाड्रांस[a] भी चुका न दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: क्वाड्रांस एक बहुत छोटा रोमी सिक्का था।
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: सच
  rationale: आरंभिक सूत्र में यह कथन की सत्यता पर गंभीर और अधिकारपूर्ण बल देता है; आधुनिक हिन्दी में “सच कहता हूँ” स्वाभाविक है।
- source_word: λέγω σοι
  choice: मैं तुमसे कहता हूँ
  rationale: यह सीधे एक व्यक्ति को संबोधित करने वाला सूत्र है; “तुमसे” हिन्दी में स्वाभाविक प्रत्यक्ष संबोधन व्यक्त करता है।
- source_word: οὐ μὴ ἐξέλθῃς
  choice: किसी भी तरह बाहर नहीं निकलोगे
  rationale: οὐ μή के प्रबल निषेध को “किसी भी तरह ... नहीं” व्यक्त करता है, जबकि भविष्यसूचक कथन भी बना रहता है।
- source_word: ἐκεῖθεν
  choice: वहाँ से
  rationale: यह उस स्थान से बाहर जाने की दिशा बताता है और हिन्दी में स्पष्ट तथा स्वाभाविक है।
- source_word: ἕως ἂν ἀποδῷς
  choice: जब तक ... न चुका दो
  rationale: यह भविष्य में पूर्ण भुगतान होने तक की सीमा बताता है; “चुका दो” ऋण के पूरे भुगतान का भाव रखता है।
- source_word: τὸν ἔσχατον
  choice: आखिरी ... तक
  rationale: यह भुगतान की अंतिम, सबसे छोटी इकाई तक पहुँचने पर बल देता है।
- source_word: κοδράντην
  choice: क्वाड्रांस
  rationale: यह एक विशिष्ट रोमी सिक्के का नाम है। आधुनिक मुद्रा का भ्रामक समतुल्य देने के बजाय नाम को लिप्यंतरित करके टिप्पणी में समझाया गया है।
theological_decisions:
- issue: क्या कथन को अंतिम न्याय, शुद्धिकरण या केवल कानूनी-कारागार की परिस्थिति के रूप में स्पष्ट किया जाए
  choice: पाठ में ऋण के कारण बंदी होने और पूरा भुगतान होने तक न निकल पाने का ठोस चित्र बनाए रखा गया है।
  alternative: इसे स्पष्ट रूप से ईश्वरीय न्याय या मृत्यु के बाद शुद्धिकरण का कथन बनाना।
  rationale: यूनानी पाठ स्वयं व्यापक धर्मवैज्ञानिक अर्थ को निश्चित नहीं करता। इसलिए अनुवाद किसी विशिष्ट सिद्धांत को आरोपित किए बिना मूल चेतावनी और उसके तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। “किसी भी तरह ... नहीं” प्रबल यूनानी निषेध को सहज हिन्दी में व्यक्त करता है; सिक्के का ऐतिहासिक नाम पारदर्शिता के लिए सुरक्षित रखा गया है।
