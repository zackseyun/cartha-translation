  naturalness: The Hindi is fluent, modern, and suitably dignified. “लोगों को ऐसा ही सिखाता है” naturally makes explicit the backward reference of οὕτως. The paired wording “उनका पालन करता और सिखाता है” is idiomatic and clear in context.
  terminology: “आज्ञाएँ,” “स्वर्ग का राज्य,” “पालन,” “छोटा,” and “महान” are appropriate and consistent theological and biblical-register terms. The note responsibly explains the lexical range of “ढीला करता है” without imposing an interpretive or denominational conclusion.
