id: MAT.5.19
reference: Matthew 5:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: hi
  text: इसलिए, जो कोई इन छोटी-से-छोटी आज्ञाओं में से किसी एक को भी ढीला करता है[a] और लोगों को ऐसा ही सिखाता है, वह स्वर्ग के राज्य में छोटा कहलाएगा; पर जो उनका पालन करता और सिखाता है, वही स्वर्ग के राज्य में महान कहलाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रद्द करता है” अथवा “तोड़ता है।” यूनानी क्रिया का शाब्दिक अर्थ “खोलना” या “ढीला करना” है; यहाँ आशय किसी आज्ञा की बाध्यकारी शक्ति को कम करने या उसे गैर-बाध्यकारी मानने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले निष्कर्ष को व्यक्त करता है और पद 18 से तार्किक संबंध बनाए रखता है।
- source_word: λύσῃ
  choice: ढीला करता है
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘खोलना/ढीला करना’ है; आज्ञा के संदर्भ में यह उसकी बाध्यकारी शक्ति को कम करने या उसे गैर-बाध्यकारी मानने की ओर संकेत करता है।
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: इन छोटी-से-छोटी आज्ञाओं में से किसी एक को भी
  rationale: यह इन आज्ञाओं में अपेक्षाकृत छोटी मानी जाने वाली किसी एक आज्ञा का बोध कराता है; ‘भी’ μίαν के बल को स्वाभाविक हिन्दी में उभारता है।
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: लोगों को ऐसा ही सिखाता है
  rationale: ἀνθρώπους यहाँ सभी मनुष्यों के लिए सामान्य अर्थ में है, और οὕτως पीछे कही गई आज्ञा को ढीला करने की रीति की ओर संकेत करता है।
- source_word: ἐλάχιστος κληθήσεται
  choice: छोटा कहलाएगा
  rationale: यह भविष्यत् कर्मवाच्य को सीधे व्यक्त करता है और राज्य के भीतर तुलनात्मक प्रतिष्ठा की भाषा को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: स्वर्ग के राज्य में
  rationale: यह मत्ती की विशिष्ट अभिव्यक्ति का प्रचलित, स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: उनका पालन करता और सिखाता है
  rationale: आज्ञाओं को ‘करने’ का स्वाभाविक हिन्दी रूप ‘पालन करना’ है; इससे आचरण और शिक्षा दोनों का विरोध स्पष्ट होता है।
- source_word: οὗτος
  choice: वही
  rationale: यह संकेतवाचक सर्वनाम के बल और पहले व्यक्ति से स्पष्ट विरोध को सहज हिन्दी में सुरक्षित रखता है।
- source_word: μέγας
  choice: महान
  rationale: यह μέγας का सीधा समतुल्य है और ‘छोटा’ के साथ प्रतिष्ठा का विरोध बनाए रखता है।
theological_decisions:
- issue: स्वर्ग के राज्य में ‘छोटा’ और ‘महान’ कहलाने का आशय
  choice: राज्य के भीतर तुलनात्मक प्रतिष्ठा की भाषा को यथावत रखना
  alternative: ‘छोटा’ को राज्य से बहिष्कृत समझना, अथवा ‘महान’ को स्वर्गीय प्रतिफल की तकनीकी श्रेणी बनाना
  rationale: मूल पाठ व्यक्ति को ‘स्वर्ग के राज्य में’ छोटा या महान कहलाता बताता है; अनुवाद उद्धार, बहिष्कार या प्रतिफल की किसी विस्तृत धर्मवैज्ञानिक व्यवस्था को आरोपित नहीं करता।
- issue: τοὺς ἀνθρώπους का सामान्य मानवीय संदर्भ
  choice: लोगों
  alternative: पुरुषों/मनुष्यों
  rationale: यहाँ यूनानी बहुवचन समस्त लोगों के लिए सामान्य रूप से प्रयुक्त है; ‘लोगों’ आधुनिक हिन्दी में अर्थ को बिना लैंगिक भ्रम के ठीक व्यक्त करता है।
- issue: ποιήσῃ में आज्ञाओं को करने का अर्थ
  choice: पालन करता
  alternative: करता
  rationale: हिन्दी में आज्ञाओं के साथ ‘पालन करना’ स्वाभाविक है, पर इससे पूर्ण निष्पापता या योग्यता का कोई अतिरिक्त सिद्धान्त नहीं जोड़ा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज शैली रखी गई है। ‘छोटी-से-छोटी’ और ‘वही’ मूल के तुलनात्मक तथा संकेतवाचक बल को स्वाभाविक रूप से व्यक्त करते हैं।
