reference: Matthew 5:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: hi
  text: तुम पृथ्वी के नमक हो। पर यदि नमक अपना खारापन खो दे, तो उसे किससे नमकीन किया जाएगा? वह फिर किसी काम का नहीं रहता, सिवाय इसके कि बाहर फेंका जाए और मनुष्यों[a] के पैरों तले रौंदा जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लोगों’; यूनानी शब्द का अर्थ यहाँ सामान्य रूप से मनुष्य है, केवल पुरुष नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: तुम
  rationale: यूनानी में सर्वनाम स्पष्ट होने से कुछ बल मिलता है। हिन्दी में वाक्य के आरम्भ में ‘तुम’ स्वाभाविक रूप से श्रोताओं को सीधे उभारता है; ‘तुम ही’ अनावश्यक रूप से अपवर्जक अर्थ दे सकता है।
- source_word: τὸ ἅλας τῆς γῆς
  choice: पृथ्वी के नमक
  rationale: γῆ का अर्थ ‘पृथ्वी’, ‘भूमि’ या ‘देश’ हो सकता है। यहाँ व्यापक रूपक के लिए ‘पृथ्वी’ स्वाभाविक है और मूल की अर्थ-व्याप्ति बनाए रखता है।
- source_word: μωρανθῇ
  choice: अपना खारापन खो दे
  rationale: क्रिया का मूल संबंध ‘मूर्ख’ होने से है, पर नमक के विषय में इसका अर्थ फीका या बेस्वाद हो जाना है। ‘अपना खारापन खो दे’ हिन्दी में रूपक को स्पष्ट और स्वाभाविक रखता है।
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: उसे किससे नमकीन किया जाएगा?
  rationale: भविष्यत् कर्मवाच्य प्रश्न उस साधन के विषय में पूछता है जिससे नमक को नमकीन किया जा सके। यह रूप मूल की संरचना और उसकी जानबूझकर रखी गई असंगति दोनों को बनाए रखता है।
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: वह फिर किसी काम का नहीं रहता
  rationale: ἰσχύω यहाँ उपयोगी या प्रभावी होने का भाव देता है। चुना हुआ वाक्यांश सामान्य आधुनिक हिन्दी में व्यावहारिक निरर्थकता व्यक्त करता है।
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: सिवाय इसके कि बाहर फेंका जाए
  rationale: ‘बाहर’ ἔξω के स्थानगत भाव को स्पष्ट रखता है, जबकि कर्मवाच्य रूप यूनानी कृदन्त की दिशा को बनाए रखता है।
- source_word: καταπατεῖσθαι
  choice: पैरों तले रौंदा जाए
  rationale: यह पद कुचले या रौंदे जाने की सजीव छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: मनुष्यों के
  rationale: ἄνθρωποι यहाँ सामान्य रूप से मानवों को दर्शाता है। ‘मनुष्यों’ स्रोत के मानव-संदर्भ को सीधे रखता है और केवल पुरुषों तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: ὑπὸ τῶν ἀνθρώπων में सामान्य मानव-संदर्भ
  choice: मनुष्यों के पैरों तले
  alternative: लोगों के पैरों तले
  rationale: संदर्भ समस्त मनुष्यों का है, केवल वयस्क पुरुषों का नहीं। ‘मनुष्यों’ मूल संज्ञा से निकट भी है और हिन्दी में सामान्य मानव-संदर्भ भी स्पष्ट करता है; पादटिप्पणी अधिक बोलचाल के विकल्प को दर्ज करती है।
- issue: नमक के खारापन खोने की असामान्य छवि
  choice: यदि नमक अपना खारापन खो दे
  alternative: यदि नमक बेस्वाद हो जाए
  rationale: पाठ रूपक की भौतिक असामान्यता को समझाता नहीं है। अनुवाद भी इसे ऐतिहासिक या रासायनिक व्याख्या से हल किए बिना उसी तनाव के साथ रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘खारापन’, ‘नमकीन किया जाएगा’ और ‘पैरों तले रौंदा जाए’ मूल रूपक की पुनरावृत्ति तथा सजीवता को बनाए रखते हैं।
