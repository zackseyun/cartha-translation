  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: hi
  text: धन्य हैं वे, जिनका हृदय शुद्ध है[a], क्योंकि वे परमेश्वर को देखेंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जिनका हृदय निर्मल है।’
    reason: lexical_alternative
  - marker: b
    text: ‘परमेश्वर को देखेंगे’ का आशय परमेश्वर की उपस्थिति तक सीधी पहुँच से हो सकता है, जिसमें भविष्य में उसकी पूर्णता भी सम्मिलित है; अनुवाद मूल कथन को किसी एक अर्थ तक सीमित नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: धन्य हैं
  rationale: यह वाक्यांश केवल भावनात्मक प्रसन्नता नहीं, बल्कि परमेश्वर की कृपा और अनुग्रह के कारण प्राप्त सराहनीय दशा को व्यक्त करता है तथा धन्य-वचनों की प्रतिष्ठित हिन्दी शैली के अनुरूप है।
- source_word: καθαροὶ
  choice: शुद्ध
  rationale: यहाँ नैतिक और आंतरिक निर्मलता प्रमुख है। ‘शुद्ध’ आधुनिक हिन्दी में स्वाभाविक है और ‘साफ़’ की अपेक्षा बाहरी या केवल भौतिक स्वच्छता का आभास कम देता है।
- source_word: τῇ καρδίᾳ
  choice: जिनका हृदय
  rationale: यूनानी संबंध को स्वाभाविक हिन्दी में गुणसूचक उपवाक्य के रूप में व्यक्त किया गया है। ‘हृदय’ यहाँ केवल भावनाओं के बजाय भीतरी मनुष्य—विचार, इच्छा और अभिप्राय—की ओर संकेत करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह धन्य दशा के साथ जुड़ी प्रतिज्ञा का कारण या आधार प्रस्तुत करता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: αὐτοὶ
  choice: वे
  rationale: यूनानी सर्वनाम बलाघातयुक्त है और उन्हीं लोगों को प्रतिज्ञा का पात्र ठहराता है। हिन्दी में ‘वे’ की पुनरावृत्ति इसे सहज रूप से बनाए रखती है; ‘वे ही’ अनावश्यक रूप से अपवर्जक अर्थ दे सकता है।
- source_word: τὸν θεὸν
  choice: परमेश्वर को
  rationale: यह क्रिया का सीधा कर्म है। ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय भाषा में गरिमापूर्ण और व्यापक रूप से बोधगम्य है।
- source_word: ὄψονται
  choice: देखेंगे
  rationale: यह भविष्यकालीन प्रतिज्ञा को सीधे और स्वाभाविक ढंग से व्यक्त करता है, बिना ‘देखने’ के अर्थ को अनुभव, दर्शन या अंतिम युग की किसी एक व्याख्या तक सीमित किए।
theological_decisions:
- issue: ‘परमेश्वर को देखेंगे’ का आशय
  choice: मूल की सीधी अभिव्यक्ति ‘परमेश्वर को देखेंगे’ सुरक्षित रखी गई है।
  alternative: ‘परमेश्वर की उपस्थिति का अनुभव करेंगे’ या ‘अंतिम समय में परमेश्वर का दर्शन करेंगे।’
  rationale: वाक्य में परमेश्वर की उपस्थिति तक सीधी पहुँच और उसकी भावी पूर्णता, दोनों की गूँज हो सकती है; पर यूनानी पाठ इसे संक्षेप में और बिना स्पष्टीकरण के कहता है। इसलिए अनुवाद इस धर्मवैज्ञानिक व्यापकता और तनाव को संकुचित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘धन्य’ और ‘परमेश्वर’ बाइबलीय संदर्भ की प्रतिष्ठित शब्दावली को बनाए रखते हैं, जबकि वाक्य-संरचना साधारण पाठक के लिए स्वाभाविक रखी गई है।
