id: MAT.5.29
reference: Matthew 5:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: hi
  text: पर यदि तुम्हारी दाहिनी आँख तुम्हें ठोकर खिलाती है[a], तो उसे निकालकर अपने से दूर फेंक दो। क्योंकि तुम्हारे लिए यह भला है कि तुम्हारे अंगों में से एक नष्ट हो जाए, न कि तुम्हारा सारा शरीर गेहन्ना में फेंका जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमसे पाप करवाती है।”
    reason: lexical_alternative
  - marker: b
    text: गेहन्ना यूनानी में हिन्नोम की घाटी से जुड़ा एक नाम है; परंपरागत रूप से इसका अनुवाद “नरक” किया जाता है।
    reason: historical_and_translation_note
lexical_decisions:
- source_word: σκανδαλίζει
  choice: ठोकर खिलाती है
  rationale: यह प्रयोग यूनानी क्रिया के ठोकर या पतन कराने वाले रूपक को बनाए रखता है; प्रसंग में इसका आशय पाप में गिराना है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἔξελε
  choice: निकालकर
  rationale: आँख को निकाल देने की कठोर और अत्यावश्यक छवि को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: βάλε ἀπὸ σοῦ
  choice: अपने से दूर फेंक दो
  rationale: क्रिया की तीव्रता और ἀπὸ σοῦ में निहित अपने से अलग कर देने—दोनों भावों को सुरक्षित रखता है।
- source_word: συμφέρει
  choice: तुम्हारे लिए यह भला है
  rationale: लाभ या हित के तुलनात्मक अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἀπόληται
  choice: नष्ट हो जाए
  rationale: एक शारीरिक अंग के खो जाने की गंभीरता को बनाए रखता है, बिना उसके अर्थ को अनावश्यक रूप से अधिक संकीर्ण किए।
- source_word: μελῶν
  choice: अंगों
  rationale: आँख सहित शरीर के किसी भी भाग के लिए उपयुक्त है और ‘सारा शरीर’ के साथ मूल पाठ का विरोध स्पष्ट रखता है।
- source_word: βληθῇ
  choice: फेंका जाए
  rationale: βάλλω के कर्मवाच्य रूप की शक्ति को सीधे और वर्तमान हिन्दी में प्रस्तुत करता है।
- source_word: γέενναν
  choice: गेहन्ना
  rationale: मूल का विशिष्ट स्थान-संबंधी और धर्मवैचारिक शब्द सुरक्षित रहता है; इसे सामान्यीकृत ‘नरक’ में चुपचाप नहीं बदला गया।
- source_word: ὁ δεξιὸς
  choice: दाहिनी
  rationale: मूल पाठ में स्पष्ट रूप से दिए गए दाहिनी आँख के विवरण को बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: पिछले कथन से जुड़ाव और हल्के विरोध—दोनों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: γέεννα का अनुवाद
  choice: गेहन्ना
  alternative: नरक
  rationale: लिप्यंतरण यीशु द्वारा प्रयुक्त विशिष्ट शब्द और हिन्नोम की घाटी से उसके ऐतिहासिक संबंध को सुरक्षित रखता है तथा बाद की व्यापक धर्मवैचारिक धारणाओं को मुख्य पाठ में आरोपित नहीं करता।
- issue: σκανδαλίζω के रूपक का अनुवाद
  choice: ठोकर खिलाती है
  alternative: पाप करवाती है
  rationale: मुख्य पाठ यूनानी का ठोकर खाने वाला रूपक बनाए रखता है; संदर्भगत अर्थ पादटिप्पणी में दिया गया है ताकि रूपक और उसका निहितार्थ दोनों सुरक्षित रहें।
- issue: कठोर शारीरिक चित्रण
  choice: आँख निकालकर दूर फेंकने की छवि को यथावत रखना
  alternative: पाप के कारण को पूरी तरह दूर कर दो
  rationale: मूल कथन की अतिशयोक्तिपूर्ण और झकझोरने वाली नैतिक तीव्रता को व्याख्यात्मक सामान्यीकरण से नरम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप। ‘ठोकर खिलाती है’ मूल रूपक को बनाए रखता है, जबकि ‘गेहन्ना’ विशिष्ट यूनानी पद को सुरक्षित रखता है।
