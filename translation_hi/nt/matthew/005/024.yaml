id: MAT.5.24
reference: Matthew 5:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: hi
  text: अपनी भेंट वहीं वेदी के सामने छोड़ दे और जा; पहले अपने भाई से मेल कर[a], और तब आकर अपनी भेंट चढ़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाई’ के लिए प्रयुक्त यूनानी शब्द पुल्लिंग एकवचन है; इस संदर्भ में मेल-मिलाप का सिद्धांत अधिक व्यापक संबंधों पर भी लागू हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: छोड़ दे
  rationale: यहाँ क्रिया का अर्थ किसी वस्तु को उसी स्थान पर छोड़ देना है; एकवचन आज्ञार्थक रूप को स्वाभाविक हिंदी में रखा गया है।
- source_word: ἐκεῖ
  choice: वहीं
  rationale: यह भेंट को वेदी के सामने उसी स्थान पर छोड़ने के स्थानिक बल को स्पष्ट करता है।
- source_word: τὸ δῶρόν σου
  choice: अपनी भेंट
  rationale: δῶρον परमेश्वर के लिए लाई गई भेंट को दर्शाता है; वेदी का संदर्भ इसके अर्पण-संबंधी अर्थ को स्पष्ट करता है।
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: वेदी के सामने
  rationale: स्थानिक संबंध का सीधा, प्रचलित और गरिमापूर्ण हिंदी रूप।
- source_word: ὕπαγε
  choice: जा
  rationale: गति की संक्षिप्त आज्ञा को अगले आदेश के साथ मूल क्रम में रखता है।
- source_word: πρῶτον
  choice: पहले
  rationale: भेंट चढ़ाने से पहले मेल-मिलाप की प्राथमिकता बनाए रखता है।
- source_word: διαλλάγηθι
  choice: मेल कर
  rationale: ग्रीक निष्क्रिय आज्ञार्थक का भाव मेल की अवस्था में आने का है। हिंदी में ‘मेल कर’ स्वाभाविक है और पारस्परिक संबंध की बहाली व्यक्त करता है, बिना क्षमा या दोष के विषय को अतिरिक्त रूप से निर्धारित किए।
- source_word: τῷ ἀδελφῷ σου
  choice: अपने भाई से
  rationale: διαλλάγηθι के साथ दत्तिव संबंध को हिंदी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया गया है; ‘भाई’ ग्रीक के पुल्लिंग एकवचन रूप को सुरक्षित रखता है।
- source_word: καὶ τότε ἐλθὼν
  choice: और तब आकर
  rationale: मेल के बाद लौटने और अगली क्रिया करने की समयगत क्रमबद्धता को संक्षेप में बनाए रखता है।
- source_word: πρόσφερε τὸ δῶρόν σου
  choice: अपनी भेंट चढ़ा
  rationale: बलिदानी उपासना के संदर्भ में πρόσφερε के लिए ‘चढ़ा’ सहज और सटीक हिंदी है।
theological_decisions:
- issue: διαλλάγηθι में मेल-मिलाप की दिशा और पारस्परिकता
  choice: अपने भाई से मेल कर
  alternative: अपने भाई के साथ मेल-मिलाप कर / अपने भाई से मेल मिला ले
  rationale: ग्रीक रूप मेल की अवस्था में आने का आदेश देता है और दत्तिव संबंध को खुला रखता है। ‘मेल कर’ संबंध की बहाली बताता है, पर यह निर्धारित नहीं करता कि दोष किसका है या पहल का परिणाम पूरी तरह एक पक्ष के नियंत्रण में है।
- issue: ἀδελφός का नैतिक संदर्भ में अनुवाद
  choice: भाई
  alternative: भाई या बहन / साथी विश्वासी
  rationale: ग्रीक शब्द पुल्लिंग एकवचन है, इसलिए मुख्य पाठ में उसका रूप सुरक्षित रखा गया है। संदर्भ में सिद्धांत का व्यापक संबंधों पर लागू होना संभव है; इसे पाद-टिप्पणी में बताया गया है, मुख्य पाठ में विस्तार जोड़कर नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन के अनुरूप एकवचन आज्ञार्थक शैली। ‘भेंट’, ‘वेदी’ और ‘चढ़ा’ उपासना-संदर्भ में परिचित, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट हैं। अंग्रेज़ी परामर्श-पाठ की पाद-टिप्पणी-चिह्न व्यवस्था में असंगति थी; यूनानी पाठ के वास्तविक भाषिक प्रश्न के अनुसार एक ही पाद-टिप्पणी रखी गई है।
