  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: hi
  text: धन्य हैं वे जो शांति स्थापित करते हैं[a], क्योंकि वे परमेश्वर के पुत्र[b] कहलाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेल कराने वाले।” यूनानी शब्द ऐसे लोगों को दर्शाता है जो सक्रिय रूप से शांति या मेल स्थापित करते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर की संतान।” यूनानी में “पुत्र” पुल्लिंग बहुवचन है, जिसका प्रयोग प्रतिनिधिक अर्थ में भी हो सकता है।
    reason: gendered_filial_language
lexical_decisions:
- source_word: μακάριοι
  choice: धन्य हैं
  rationale: यह धन्य-वचनों की स्वाभाविक और प्रतिष्ठित हिन्दी अभिव्यक्ति है; यह केवल मनोभावगत ‘सुखी’ होने के बजाय परमेश्वर की कृपा और सम्मानित दशा का भाव रखती है।
- source_word: εἰρηνοποιοί
  choice: वे जो मेल कराते हैं
  rationale: 'यह यौगिक संज्ञा के सक्रिय, कर्तृवाचक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है: ऐसे लोग जो शांति या मेल स्थापित करते हैं, न कि केवल स्वयं शांत रहते हैं।'
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह आशीष का कारण या आधार प्रस्तुत करने वाले यूनानी संबंधबोध को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: αὐτοὶ
  choice: वे
  rationale: सर्वनाम का स्पष्ट प्रयोग यूनानी के बलाघात को पर्याप्त रूप से बनाए रखता है; ‘वे ही’ अनावश्यक रूप से अपवर्जक सुनाई दे सकता है।
- source_word: υἱοὶ θεοῦ
  choice: परमेश्वर के पुत्र
  rationale: यह मूल के पुल्लिंग बहुवचन पुत्र-संबंधी पद को औपचारिक रूप से सुरक्षित रखता है; प्रतिनिधिक और समावेशी आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: κληθήσονται
  choice: कहलाएँगे
  rationale: यह καλέω के भविष्यत् कर्मवाच्य का सीधा और स्वाभाविक हिन्दी रूप है तथा केवल मानवीय ‘पहचान’ का अर्थ आरोपित नहीं करता।
theological_decisions:
- issue: υἱοὶ θεοῦ में लिंगसूचक पुत्र-संबंधी भाषा
  choice: परमेश्वर के पुत्र
  alternative: परमेश्वर की संतान
  rationale: मुख्य पाठ में ‘पुत्र’ मूल यूनानी के पुल्लिंग बहुवचन और उससे जुड़े पुत्रत्व के धार्मिक अर्थ को बनाए रखता है। साथ ही, बहुवचन का प्रतिनिधिक प्रयोग स्त्रियों को बाहर नहीं करता; इसलिए समावेशी अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘मेल कराते हैं’ सामान्य पाठक के लिए स्वाभाविक है और सक्रिय εἰρηνοποιοί को व्यक्त करता है। मुख्य पाठ में मूल की पुत्र-संबंधी भाषा सुरक्षित रखी गई है।
