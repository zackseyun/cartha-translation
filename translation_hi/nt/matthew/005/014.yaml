id: MAT.5.14
reference: Matthew 5:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: hi
  text: तुम संसार की ज्योति हो। पहाड़ी पर बसा नगर छिप नहीं सकता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “पहाड़ पर स्थित नगर छिप नहीं सकता।”
    reason: ὄρος का अर्थ ‘पहाड़’ भी हो सकता है और κειμένη का अधिक शाब्दिक अर्थ ‘स्थित’ है।
lexical_decisions:
- source_word: Ὑμεῖς
  choice: तुम
  rationale: यह द्वितीय पुरुष बहुवचन का स्पष्ट और बलयुक्त सर्वनाम है। हिन्दी में प्रत्यक्ष संबोधन ‘तुम’ स्वाभाविक है; ‘तुम ही’ अनावश्यक रूप से विशिष्टता का भाव जोड़ सकता है।
- source_word: τὸ φῶς
  choice: ज्योति
  rationale: सप्रत्यय संज्ञा का रूपकात्मक अर्थ ‘ज्योति’ से स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त होता है।
- source_word: τοῦ κόσμου
  choice: संसार की
  rationale: κόσμος यहाँ व्यापक संसार अथवा मानव-जगत को सूचित करता है। संबंधकारक का सीधा रूप ‘संसार की’ है, जो ‘संसार के लिए’ जैसी व्याख्यात्मक दिशा नहीं जोड़ता।
- source_word: οὐ δύναται
  choice: नहीं सकता
  rationale: यह असमर्थता या असंभवता को आधुनिक हिन्दी में संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πόλις
  choice: नगर
  rationale: πόλις का सामान्य अर्थ नगर या शहर है। ‘नगर’ इस कहावत-सदृश चित्र में स्पष्ट, स्वाभाविक और गरिमापूर्ण है।
- source_word: κρυβῆναι
  choice: छिप
  rationale: κρύπτω के निष्क्रिय अनंत रूप का भाव ‘छिप नहीं सकता’ में स्वाभाविक हिन्दी के अनुसार व्यक्त होता है; अलग से ‘छिपाया जाना’ कहना यहाँ अपेक्षाकृत कृत्रिम होगा।
- source_word: ἐπάνω ὄρους
  choice: पहाड़ी पर
  rationale: ὄρος पहाड़ या पहाड़ी दोनों के लिए प्रयुक्त हो सकता है। दिखाई देने वाले ऊँचे स्थान पर बसे नगर के चित्र में ‘पहाड़ी पर’ सहज है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: κειμένη
  choice: बसा
  rationale: इस कृदंत का अर्थ ‘स्थित/पड़ा हुआ’ है। नगर के लिए ‘बसा’ वर्तमान हिन्दी में स्वाभाविक रूप से उसकी स्थिति को व्यक्त करता है।
theological_decisions:
- issue: शिष्यों की पहचान संसार की ज्योति के रूप में
  choice: 'सीधा रूपक रखा गया: ‘तुम संसार की ज्योति हो।’'
  alternative: ‘तुम संसार के लिए ज्योति हो।’
  rationale: मूल यूनानी संबंधकारक के साथ श्रोताओं को सीधे ‘संसार की ज्योति’ कहता है। ‘के लिए’ उद्देश्य या लाभ का व्याख्यात्मक भाव जोड़ सकता है, इसलिए मूल की रूपकात्मक पहचान और उसका तनाव यथावत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, प्रत्यक्ष और गरिमापूर्ण शैली रखी गई है। ‘ज्योति’ रूपक की बाइबिलीय गरिमा बनाए रखती है, जबकि ‘पहाड़ी पर बसा नगर’ सामान्य पाठक के लिए सहज दृश्य प्रस्तुत करता है।
