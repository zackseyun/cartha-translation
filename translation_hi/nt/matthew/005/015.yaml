source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: hi
  text: और लोग दीया जलाकर उसे टोकरी[a] के नीचे नहीं रखते, बल्कि दीवट पर रखते हैं, और वह घर में सबको उजाला देता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नापने की टोकरी के नीचे।’ यूनानी शब्द μόδιος सूखी वस्तुओं की एक माप और उस माप के लिए प्रयुक्त पात्र को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘और वह घर में सबको प्रकाश देता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: और ... नहीं
  rationale: यह पिछले कथन से जुड़ा एक और नकारात्मक उदाहरण प्रस्तुत करता है। हिंदी में ‘और ... नहीं’ इस संबंध को स्वाभाविक ढंग से बनाए रखता है।
- source_word: καίουσιν λύχνον
  choice: दीया जलाकर
  rationale: λύχνος यहाँ तेल के दीये जैसे ठोस प्रकाश-पात्र को दर्शाता है; ‘दीया जलाना’ आधुनिक हिंदी में स्वाभाविक और चित्रात्मक है।
- source_word: τιθέασιν αὐτόν
  choice: उसे ... रखते हैं
  rationale: सामान्य वर्तमान काल में कही गई प्रचलित मानवीय क्रिया को सरल और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ὑπὸ τὸν μόδιον
  choice: टोकरी के नीचे
  rationale: μόδιος मूलतः सूखी वस्तुओं की एक माप और फिर उस माप के पात्र को दर्शाता है। मुख्य पाठ में ‘टोकरी’ चित्र को सुबोध रखता है, जबकि माप-पात्र का अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: बल्कि दीवट पर
  rationale: λυχνία दीया रखने के आधार को दर्शाता है। ‘दीवट’ संक्षिप्त, प्रतिष्ठित और इस बाइबिलीय घरेलू चित्र के लिए सटीक हिंदी शब्द है।
- source_word: λάμπει
  choice: उजाला देता है
  rationale: λάμπω का शाब्दिक अर्थ ‘चमकना’ है, पर यहाँ सब लोगों के लिए दीये के प्रकाश देने का परिणाम प्रमुख है। वैकल्पिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: घर में सबको
  rationale: यह घर के भीतर उपस्थित सभी लोगों को समाविष्ट करता है और πᾶσιν की सार्वभौमिकता को सहज हिंदी में बनाए रखता है।
theological_decisions:
- issue: यूनानी में स्पष्ट कर्ता के बिना सामान्य तृतीय-पुरुष बहुवचन
  choice: लोग ... रखते हैं
  alternative: कोई ... नहीं रखता
  rationale: यूनानी बहुवचन क्रियाएँ एक सामान्य मानवीय व्यवहार व्यक्त करती हैं। ‘लोग’ उस लोकोक्तिपरक व्यापकता को बनाए रखता है और किसी अनिर्दिष्ट ‘वे’ की अस्पष्टता से बचाता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘दीया’ और ‘दीवट’ मूल घरेलू चित्र को ठोस रूप में बनाए रखते हैं; वाक्य की लोकोक्तिपरक सामान्यता के लिए ‘लोग’ और बहुवचन क्रिया का प्रयोग किया गया है।
