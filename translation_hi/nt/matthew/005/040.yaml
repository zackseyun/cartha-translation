source:
  edition: SBLGNT
  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: hi
  text: और जो तुम पर मुकदमा करके तुम्हारा कुरता[a] लेना चाहता है, उसे अपना चोगा भी ले लेने दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “कुरता” शरीर के पास पहने जाने वाले भीतरी वस्त्र और “चोगा” उसके ऊपर पहने जाने वाले बाहरी वस्त्र को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: जो ... चाहता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत किसी भी ऐसे व्यक्ति का संकेत करता है; यह चुनाव इच्छा के भाव को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: σοι κριθῆναι
  choice: तुम पर मुकदमा करके
  rationale: यूनानी पद का शाब्दिक संबंध न्यायिक निर्णय या अदालत में जाने से है; इस संदर्भ में यह श्रोता के विरुद्ध कानूनी कार्रवाई को व्यक्त करता है।
- source_word: χιτῶνά
  choice: कुरता
  rationale: χιτών शरीर के पास पहना जाने वाला भीतरी वस्त्र था। ‘कुरता’ सामान्य हिन्दी पाठक के लिए सहज है, जबकि पादटिप्पणी ऐतिहासिक वस्त्र-भेद स्पष्ट करती है।
- source_word: λαβεῖν
  choice: लेना
  rationale: कानूनी संदर्भ में वस्त्र पर अधिकार या कब्ज़ा प्राप्त करने का सीधा भाव सुरक्षित रहता है।
- source_word: ἄφες αὐτῷ
  choice: उसे ... ले लेने दो
  rationale: आज्ञार्थक रूप किसी चीज़ को छोड़ देने या सामने वाले को लेने देने का भाव रखता है; यह हिन्दी में प्रत्यक्ष और स्वाभाविक है।
- source_word: ἱμάτιον
  choice: चोगा
  rationale: ἱμάτιον बाहरी ओढ़ने-पहनने का वस्त्र था और χιτών से उसका भेद बनाए रखना आवश्यक है।
- source_word: καὶ ... καὶ
  choice: और ... भी
  rationale: पहला καί पिछले कथन से जोड़ता है और दूसरा अतिरिक्त बाहरी वस्त्र तक दे देने की तीव्र माँग को स्पष्ट करता है।
theological_decisions:
- issue: कानूनी विवाद में यीशु की आज्ञा का नैतिक बल
  choice: इसे बदला न लेने और असाधारण उदारता की सीधी, तीखी आज्ञा के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल अपने अधिकार छोड़ने के सामान्य रूपक या सिद्धांत के रूप में ढीला करना।
  rationale: ἄφες का आज्ञार्थक रूप और दोनों वस्त्रों का ठोस चित्र वास्तविक तथा चुनौतीपूर्ण निर्देश को सामने रखते हैं; अनुवाद इसे न तो नरम करता है, न किसी विशिष्ट सांप्रदायिक व्याख्या में सीमित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ‘मुकदमा करके’ न्यायिक संदर्भ को स्पष्ट करता है, जबकि ‘कुरता’ और ‘चोगा’ सामान्य पाठक के लिए वस्त्रों का भेद बनाए रखते हैं।
