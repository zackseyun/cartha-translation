id: MAT.5.5
reference: Matthew 5:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: hi
  text: धन्य हैं वे जो नम्र हैं,[a] क्योंकि वे ही पृथ्वी[b] को विरासत में पाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोमल स्वभाव के हैं”; यहाँ नम्रता का अर्थ दुर्बलता नहीं, बल्कि विनम्र कोमलता है।
    reason: lexical_alternative
  - marker: b
    text: या “भूमि”; यह वाक्य संभवतः भजन 37:11 की प्रतिध्वनि है, जहाँ प्रतिज्ञा वाचा की भूमि के अर्थ में भी और अधिक व्यापक अर्थ में भी समझी जा सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: धन्य हैं
  rationale: यह वचन परमेश्वर की कृपा और उसके फलस्वरूप मिलने वाली सच्ची भलाई को व्यक्त करता है; केवल भावनात्मक ‘सुखी’ कहने से अर्थ संकुचित हो जाता।
- source_word: οἱ πραεῖς
  choice: वे जो नम्र हैं
  rationale: πραΰς ऐसी विनम्र कोमलता का बोध कराता है जो दुर्बलता या भीरुता नहीं है। ‘नम्र’ आधुनिक हिन्दी में इस भाव को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह शब्द इस धन्य-वचन के कारण या आधार का परिचय देता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: αὐτοὶ
  choice: वे ही
  rationale: यूनानी सर्वनाम में बल है। ‘वे ही’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κληρονομήσουσι
  choice: विरासत में पाएँगे
  rationale: यह क्रिया विरासत के रूप में प्राप्त करने का अर्थ रखती है। यह चुनाव प्रतिज्ञा और उत्तराधिकार की भाषा को सुरक्षित रखता है।
- source_word: τὴν γῆν
  choice: पृथ्वी
  rationale: γῆ का अर्थ ‘पृथ्वी’ या ‘भूमि/देश’ हो सकता है। मुख्य पाठ में ‘पृथ्वी’ व्यापक प्रतिज्ञा को स्वाभाविक रूप से व्यक्त करता है, जबकि वैकल्पिक अर्थ टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: τὴν γῆν की सीमा
  choice: पृथ्वी
  alternative: भूमि या देश
  rationale: यूनानी γῆ में सार्वभौमिक ‘पृथ्वी’ और वाचा-संबंधी ‘भूमि/देश’ दोनों अर्थ संभव हैं। भजन 37:11 की संभावित प्रतिध्वनि के कारण स्थानीय या वाचा-संबंधी अर्थ को टिप्पणी में रखा गया है, जबकि मुख्य पाठ व्यापक अर्थ को प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वे ही’ यूनानी के बल को दर्शाता है, और ‘विरासत में पाएँगे’ उत्तराधिकार तथा प्रतिज्ञा की छवि को बनाए रखता है।
