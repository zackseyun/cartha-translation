  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: hi
  text: और अपने सिर की शपथ भी मत खाना, क्योंकि तुम एक भी बाल को सफेद या काला नहीं बना सकते।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम एक भी बाल को सफेद या काला नहीं कर सकते।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτε
  choice: और न
  rationale: यह पिछले निषेधों की समन्वित नकारात्मक शृंखला को स्वाभाविक हिन्दी में आगे बढ़ाता है।
- source_word: ἐν τῇ κεφαλῇ σου
  choice: अपने सिर की
  rationale: ὀμόσῃς के साथ यह शपथ में सिर को आधार या साक्षी बनाने का मुहावरा है; हिन्दी में ‘सिर की शपथ खाना’ स्वाभाविक है।
- source_word: ὀμόσῃς
  choice: शपथ खाना
  rationale: यह निषेधात्मक प्रयोग को सीधे और सामान्य हिन्दी में व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करने वाली स्पष्ट कारणवाचक कड़ी है।
- source_word: οὐ δύνασαι
  choice: नहीं कर सकते
  rationale: यह मानवीय असमर्थता को सहज आधुनिक हिन्दी में ठीक प्रकार व्यक्त करता है।
- source_word: μίαν τρίχα
  choice: एक भी बाल
  rationale: ‘भी’ यूनानी μίαν के उस बल को स्वाभाविक हिन्दी में उभारता है कि मनुष्य एक अकेले बाल पर भी ऐसा अधिकार नहीं रखता।
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: सफेद या काला
  rationale: मूल पाठ के सीधे रंग-विरोध को बिना व्याख्यात्मक नरमी के सुरक्षित रखता है।
- source_word: ποιῆσαι
  choice: कर सकते
  rationale: रंग-सूचक पूरकों के साथ इसका अर्थ किसी बाल को सफेद या काला ‘करना’ है; हिन्दी में यही संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: शपथ लेने के निषेध का स्वरूप
  choice: कथन को अपने सिर की शपथ खाने के सीधे निषेध के रूप में रखा गया है।
  alternative: इसे सभी परिस्थितियों में हर प्रकार की शपथ पर पूर्ण धर्मसैद्धान्तिक प्रतिबंध, अथवा केवल छलपूर्ण शपथ-सूत्रों की निंदा के रूप में विस्तारित करना।
  rationale: यह पद विशेष रूप से अपने सिर की शपथ का उल्लेख करता है और उसका आधार मनुष्य की सीमित सामर्थ्य को बताता है। व्यापक विवाद को अनुवाद में तय नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पाठ में सहज है। ‘अपने सिर की शपथ खाना’ प्रचलित हिन्दी मुहावरे को बनाए रखता है।
