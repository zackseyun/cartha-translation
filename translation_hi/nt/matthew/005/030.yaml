review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the right hand, decisive removal, disposal, the contrast between one bodily member and the whole body, and the movement into Gehenna. ‘गेहन्ना’ appropriately preserves γέεννα without importing a fuller later doctrinal sense.
  naturalness: ‘तुम्हें ठोकर खिलाता है’ is understandable but is less idiomatic in contemporary standard Hindi and can sound awkward. ‘तुम्हारे लिए ठोकर का कारण बनता है’ preserves the metaphor in natural Hindi. ‘तुम्हारे लिए यही बेहतर है’ also more clearly conveys the comparative force of συμφέρει in this context.
  terminology: ‘दाहिना हाथ,’ ‘अंग,’ ‘पूरा शरीर,’ and ‘गेहन्ना’ are suitable. The Gehenna footnote is accurate and restrained. The lexical note should describe the Greek as ‘ठोकर का कारण बनना,’ rather than presenting the awkward Hindi phrase as its literal sense.
  issues:
  - severity: medium
    issue: ‘तुम्हें ठोकर खिलाता है’ is awkward modern Hindi.
    rationale: Although it attempts to retain the stumbling metaphor of σκανδαλίζει, contemporary Hindi more naturally expresses the causative sense as ‘तुम्हारे लिए ठोकर का कारण बनता है.’ This retains the metaphor without prematurely replacing it in the main text with ‘पाप में गिराता है.’
  - severity: low
    issue: The comparative sense of συμφέρει can be made clearer.
    rationale: ‘तुम्हारे लिए यही बेहतर है’ is more idiomatic and explicitly comparative than ‘तुम्हारे लिए यह अच्छा है,’ especially before the contrast introduced by ‘बजाय इसके कि.’
  revised_text: और यदि तुम्हारा दाहिना हाथ तुम्हारे लिए ठोकर का कारण बनता है[a], तो उसे काटकर अपने से दूर फेंक दो। क्योंकि तुम्हारे लिए यही बेहतर है कि तुम्हारे अंगों में से एक नष्ट हो जाए, बजाय इसके कि तुम्हारा पूरा शरीर गेहन्ना[b] में चला जाए।
