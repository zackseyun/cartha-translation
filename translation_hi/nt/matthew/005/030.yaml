id: MAT.5.30
reference: Matthew 5:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: hi
  text: और यदि तुम्हारा दाहिना हाथ तुम्हारे लिए ठोकर का कारण बनता है[a], तो उसे काटकर अपने से दूर फेंक दो। क्योंकि तुम्हारे लिए यही बेहतर है कि तुम्हारे अंगों में से एक नष्ट हो जाए, बजाय इसके कि तुम्हारा पूरा शरीर गेहन्ना[b] में चला जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘तुम्हें पाप में गिराता है।’ यूनानी क्रिया का शाब्दिक भाव किसी के लिए ठोकर का कारण बनना है।
    reason: lexical_alternative
  - marker: b
    text: या ‘नरक।’ ‘गेहन्ना’ हिन्नोम की घाटी से निकला शब्द है, जिसका प्रयोग अंतिम न्याय के लिए किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: तुम्हारा दाहिना हाथ
  rationale: यह आधुनिक हिन्दी का स्वाभाविक प्रयोग है और मूल पाठ की शारीरिक विशिष्टता को बनाए रखता है।
- source_word: σκανδαλίζει
  choice: तुम्हें ठोकर खिलाता है
  rationale: यह यूनानी क्रिया के ठोकर या पतन के रूपक को सुरक्षित रखता है; प्रसंग में पाप में गिराने का आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἔκκοψον
  choice: उसे काटकर
  rationale: यह निर्णायक आज्ञा और हाथ को शरीर से अलग करने की तीव्र शारीरिक छवि को सीधे व्यक्त करता है।
- source_word: βάλε ἀπὸ σοῦ
  choice: अपने से दूर फेंक दो
  rationale: यह फेंकने की प्रबल क्रिया और स्वयं से अलग कर देने—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συμφέρει γάρ σοι
  choice: क्योंकि तुम्हारे लिए यह अच्छा है
  rationale: यहाँ अर्थ आर्थिक लाभ नहीं, बल्कि तुलनात्मक भलाई या हित है।
- source_word: ἵνα ἀπόληται
  choice: नष्ट हो जाए
  rationale: यह ἀπόλλυμι की हानि और विनाश की गंभीरता को बनाए रखता है और पूरे शरीर के गेहन्ना में जाने के साथ विरोध को स्पष्ट करता है।
- source_word: ἓν τῶν μελῶν σου
  choice: तुम्हारे अंगों में से एक
  rationale: ‘अंग’ शरीर के किसी भाग के लिए व्यापक और स्वाभाविक हिन्दी शब्द है; इसे केवल हाथ-पैर तक सीमित नहीं करता।
- source_word: ὅλον τὸ σῶμά σου
  choice: तुम्हारा पूरा शरीर
  rationale: यह एक अंग और समूचे शरीर के बीच मूल पाठ के विरोध को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: गेहन्ना में चला जाए
  rationale: ‘गेहन्ना’ मूल ऐतिहासिक और न्याय-संबंधी पद को सुरक्षित रखता है, जबकि ‘चला जाए’ ἀπέλθῃ की सक्रिय गति को अनावश्यक रूप से ‘डाले जाने’ में नहीं बदलता।
theological_decisions:
- issue: γέεννα का अनुवाद
  choice: गेहन्ना
  alternative: नरक
  rationale: लिप्यंतरण मूल यूनानी पद तथा हिन्नोम की घाटी से जुड़े उसके ऐतिहासिक और अंतिम न्याय-संबंधी संकेतों को सुरक्षित रखता है। ‘नरक’ सम्भव प्रासंगिक अर्थ है, पर वह बाद की व्यापक धार्मिक धारणाओं को सीधे पाठ में ला सकता है; इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: σκανδαλίζει में पाप का आशय
  choice: ठोकर खिलाता है
  alternative: पाप में गिराता है
  rationale: मुख्य पाठ में ठोकर का मूल रूपक बनाए रखा गया है, जबकि प्रसंगगत नैतिक अर्थ को पादटिप्पणी में दिया गया है ताकि रूपक और आशय दोनों उपलब्ध रहें।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘ठोकर खिलाता है’ मूल रूपक को बचाता है; ‘अपने से दूर फेंक दो’ आज्ञा की तीव्रता बनाए रखता है। वाक्य-विन्यास हिन्दी में स्वाभाविक है, पर एक अंग और पूरे शरीर के बीच मूल पाठ का गंभीर विरोध यथावत है।
