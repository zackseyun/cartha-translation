  yaml_path: translation/nt/matthew/005/027.yaml
  text: You have heard that it was said[a], ‘You shall not commit adultery.’
translation:
  language: hi
  text: “तुम सुन चुके हो कि कहा गया था, ‘व्यभिचार न करना।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: तुम सुन चुके हो
  rationale: यूनानी एओरिस्ट इस सूत्रात्मक भूमिका में श्रोताओं को पहले से मिली और अब प्रासंगिक शिक्षा की ओर संकेत करता है; हिन्दी में पूर्ण वर्तमान इसका स्वाभाविक भाव देता है।
- source_word: ὅτι
  choice: कि
  rationale: यह सुनी हुई बात की विषय-वस्तु प्रस्तुत करने वाला स्वाभाविक हिन्दी संयोजक है।
- source_word: ἐρρέθη
  choice: कहा गया था
  rationale: यूनानी कर्मवाच्य को बिना वक्ता का नाम जोड़े सहज हिन्दी में व्यक्त करता है और पूर्व में कही गई आज्ञा का संकेत बनाए रखता है।
- source_word: Οὐ μοιχεύσεις
  choice: व्यभिचार न करना
  rationale: यह निषेधात्मक आज्ञा है और दस आज्ञाओं की उद्धरणात्मक शैली को संक्षिप्त, प्रतिष्ठित तथा आधुनिक हिन्दी में बनाए रखती है।
theological_decisions:
- issue: दस आज्ञाओं के उद्धरण से संबंध
  choice: “व्यभिचार न करना” के आज्ञार्थक रूप में अनुवाद
  alternative: “तुम व्यभिचार नहीं करोगे”
  rationale: भविष्यत् सूचक यूनानी रूप यहाँ निषेधात्मक आज्ञा के रूप में प्रयुक्त है। हिन्दी में “न करना” विधिक-आज्ञात्मक प्रतिध्वनि को स्वाभाविक ढंग से सुरक्षित रखता है, जबकि “नहीं करोगे” भविष्यवाणी जैसा भी समझा जा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में बहुवचन/सामूहिक “तुम”; भाषा सरल, गरिमापूर्ण और शास्त्रीय उद्धरण के अनुरूप है। कोई पाद-टिप्पणी आवश्यक नहीं, क्योंकि “तुम सुन चुके हो” यूनानी सूत्र का निकट और स्वाभाविक अनुवाद है।
