source:
  edition: SBLGNT
  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: hi
  text: धन्य हैं वे जो दयालु हैं, क्योंकि उन पर दया की जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: धन्य हैं
  rationale: यह केवल मन की प्रसन्नता नहीं, बल्कि परमेश्वर की कृपा और सच्चे कल्याण की अवस्था बताता है; साथ ही हिन्दी में धन्य-वचनों की गरिमापूर्ण और परिचित शैली बनाए रखता है।
- source_word: οἱ ἐλεήμονες
  choice: वे जो दयालु हैं
  rationale: संज्ञा की तरह प्रयुक्त विशेषण उन लोगों को दर्शाता है जो दया करते हैं। यह सहज आधुनिक हिन्दी है और आगे आने वाली ‘दया’ के साथ मूल की शब्दगत प्रतिध्वनि बनाए रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पहले कथन का कारण या आधार प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: αὐτοὶ
  choice: उन पर
  rationale: मूल सर्वनाम उन्हीं दयालु लोगों पर बल देता है। हिन्दी की निष्क्रिय रचना में ‘उन पर’ इस संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ἐλεηθήσονται
  choice: दया की जाएगी
  rationale: भविष्यकालीन निष्क्रिय क्रिया को निष्क्रिय रूप में रखा गया है, जिससे कर्ता अनकहा रहता है और ‘दयालु’ तथा ‘दया’ की शब्दगत कड़ी भी बनी रहती है।
theological_decisions:
- issue: प्रतिज्ञा की गई दया का कर्ता
  choice: ‘उन पर दया की जाएगी’ कहकर कर्ता को अनिर्दिष्ट रखना
  alternative: ‘परमेश्वर उन पर दया करेगा’
  rationale: संदर्भ में परमेश्वर का कर्ता होना दृढ़ता से निहित है, पर यूनानी पाठ उसे स्पष्ट रूप से नहीं कहता। निष्क्रिय रचना मूल की अस्पष्टता और धर्मवैज्ञानिक तनाव को सुरक्षित रखती है।
translation_notes:
  register: संक्षिप्त, गरिमापूर्ण और सहज आधुनिक मानक हिन्दी। धन्य-वचन की सूत्रात्मक शैली तथा दया-संबंधी मूल शब्दों की पुनरावृत्ति सुरक्षित रखी गई है।
