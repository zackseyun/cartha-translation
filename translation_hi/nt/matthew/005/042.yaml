  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: hi
  text: जो तुमसे माँगे, उसे दो; और जो तुमसे उधार लेना चाहे, उससे मुँह न मोड़ो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτοῦντί
  choice: जो तुमसे माँगे
  rationale: लेखयुक्त वर्तमान कृदंत यहाँ सामान्य रूप से माँगने वाले व्यक्ति को दर्शाता है। यह हिंदी अभिव्यक्ति स्वाभाविक है और किसी विशेष प्रकार की माँग तक अर्थ को सीमित नहीं करती।
- source_word: δός
  choice: उसे दो
  rationale: δίδωμι का यह एओरिस्ट आज्ञार्थक रूप सीधी आज्ञा देता है; सरल 'दो' उसके बल को बिना कुछ जोड़े बनाए रखता है।
- source_word: θέλοντα
  choice: जो ... चाहे
  rationale: लेखयुक्त वर्तमान कृदंत θέλω की इच्छा को व्यक्त करता है। 'चाहे' आधुनिक हिंदी में स्वाभाविक है और 'इच्छुक हो' की अपेक्षा अधिक सहज है।
- source_word: ἀπὸ σοῦ
  choice: तुमसे
  rationale: यह पूर्वसर्गीय पद उधार की वस्तु के स्रोत को बताता है; हिंदी में 'तुमसे उधार लेना' इसका स्वाभाविक रूप है।
- source_word: δανίσασθαι
  choice: उधार लेना
  rationale: संदर्भ में क्रिया का अर्थ उधार लेना है। मूल में वस्तु निर्दिष्ट नहीं है, इसलिए 'पैसे उधार लेना' कहकर अर्थ को संकुचित नहीं किया गया।
- source_word: μὴ ἀποστραφῇς
  choice: उससे मुँह न मोड़ो
  rationale: μή के साथ यह रूप निषेधात्मक आज्ञा देता है। 'मुँह न मोड़ो' ἀποστρέφω की चित्रात्मकता को सुरक्षित रखते हुए हिंदी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: यीशु की नैतिक आज्ञा का दायरा और बल
  choice: आज्ञा को सीधे और सामान्य रूप में रखा गया है, बिना उसे नरम करने या पात्रता की अनकही शर्त जोड़ने के।
  alternative: इसे केवल योग्य माँगने वालों तक सीमित करना, या चित्रात्मक भाषा को व्याख्यात्मक रूप से 'इनकार न करो' कहना।
  rationale: यूनानी पाठ दो सीधी आज्ञाएँ देता है। अनुवाद में उनकी व्यापकता और नैतिक तीक्ष्णता बनी रहनी चाहिए, जबकि पाठ में न दी गई बाद की योग्यताएँ नहीं जोड़ी जानी चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'मुँह न मोड़ो' मूल की छवि को स्वाभाविक हिंदी में बनाए रखता है।
