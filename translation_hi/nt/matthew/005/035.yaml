id: MAT.5.35
reference: Matthew 5:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: hi
  text: और न पृथ्वी की शपथ खाना,[a] क्योंकि वह उसके पाँवों की चौकी है; और न यरूशलेम की शपथ खाना,[b] क्योंकि वह महान राजा का नगर है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यशायाह 66:1 की ओर संकेत: “पृथ्वी मेरे पाँवों की चौकी है।”'
    reason: cross_reference
  - marker: b
    text: यूनानी में शाब्दिक रूप से “यरूशलेम की ओर/को” है; शपथ के इस प्रसंग में इसका मुहावरेदार अर्थ “यरूशलेम की शपथ” है।
    reason: lexical_alternative
  - marker: c
    text: भजन 48:2 की ओर संकेत, जहाँ यरूशलेम को “महान राजा का नगर” कहा गया है।
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: और न
  rationale: यह पिछले पद से चली आ रही निषेधों की शृंखला को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: ἐν τῇ γῇ
  choice: पृथ्वी की शपथ खाना
  rationale: शपथ-सूत्र में ἐν का अर्थ किसी वस्तु को शपथ का आधार बनाना है; हिन्दी में ‘की शपथ खाना’ स्पष्ट और स्वाभाविक है।
- source_word: γῇ
  choice: पृथ्वी
  rationale: स्वर्ग और यरूशलेम के साथ विरोध में यहाँ किसी विशेष देश के बजाय पूरी पृथ्वी अभिप्रेत है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह निषेध का कारण बताता है और आधुनिक हिन्दी में स्पष्ट कारणसूचक है।
- source_word: ὑποπόδιόν
  choice: चौकी
  rationale: ‘पाँवों की चौकी’ ὑποπόδιον का सहज, गरिमापूर्ण हिन्दी रूप है और शास्त्रीय संकेत बनाए रखता है।
- source_word: τῶν ποδῶν αὐτοῦ
  choice: उसके पाँवों की
  rationale: यूनानी सर्वनाम में आदरसूचक पूँजीकरण नहीं है; यह रूप परमेश्वर की ओर संदर्भ को प्रसंग से समझने देता है।
- source_word: εἰς Ἱεροσόλυμα
  choice: यरूशलेम की शपथ खाना
  rationale: यद्यपि εἰς सामान्यतः दिशासूचक है, यहाँ शपथ के मुहावरे में ‘की शपथ’ अर्थ देता है; दिशासूचक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: πόλις
  choice: नगर
  rationale: यह πόλις का सटीक और गरिमापूर्ण, फिर भी सामान्यतः समझा जाने वाला हिन्दी समतुल्य है।
- source_word: τοῦ μεγάλου βασιλέως
  choice: महान राजा का
  rationale: यह संबंधकारक अर्थ और भजन 48:2 की उन्नत शास्त्रीय भाषा दोनों को बनाए रखता है।
theological_decisions:
- issue: ‘उसके पाँवों’ में सर्वनाम का संदर्भ
  choice: ‘उसके’ रखा गया है, जिससे संदर्भ प्रसंग के द्वारा परमेश्वर की ओर संकेत करता है।
  alternative: ‘परमेश्वर के पाँवों’ या आदरसूचक ‘उनके पाँवों’ द्वारा संदर्भ को स्पष्ट करना।
  rationale: αὐτοῦ स्वयं सम्मानसूचकता या नाम को व्यक्त नहीं करता। निकटवर्ती प्रसंग और यशायाह का संकेत संदर्भ स्पष्ट करते हैं, इसलिए अनावश्यक व्याख्यात्मक विस्तार नहीं किया गया।
- issue: εἰς Ἱεροσόλυμα का शपथ-सूत्र में अर्थ
  choice: मुख्य पाठ में ‘यरूशलेम की शपथ खाना’।
  alternative: ‘यरूशलेम की ओर’ या ‘यरूशलेम को’।
  rationale: दिशासूचक शाब्दिक रूप हिन्दी में शपथ के निषेध को अस्पष्ट कर देगा। मुहावरेदार अर्थ मुख्य पाठ में रखा गया और मूल पूर्वसर्ग की विशिष्टता पादटिप्पणी में बताई गई।
- issue: ‘महान राजा’ का संदर्भ
  choice: उपाधि को बिना व्याख्यात्मक नाम जोड़े रखा गया।
  alternative: ‘महान राजा परमेश्वर’।
  rationale: यूनानी पाठ केवल ‘महान राजा’ कहता है; भजन 48:2 का संकेत परमेश्वर की ओर इंगित करता है, पर मुख्य पाठ में नाम जोड़ना मूल से अधिक स्पष्टता थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए स्पष्ट, किंतु गरिमापूर्ण। ‘शपथ खाना’ हिन्दी का स्वाभाविक शपथ-मुहावरा है। ‘पाँवों की चौकी’ और ‘महान राजा का नगर’ शास्त्रीय संकेतों को पहचानने योग्य रखते हैं।
