  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: hi
  text: तुम सुन चुके हो कि कहा गया था[a], ‘तुम अपने पड़ोसी से प्रेम करोगे और अपने शत्रु से घृणा करोगे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहला खंड लैव्यव्यवस्था 19:18 की प्रतिध्वनि है; दूसरा खंड (‘और अपने शत्रु से घृणा करोगे’) पुराने नियम का प्रत्यक्ष उद्धरण नहीं है, बल्कि उस प्रचलित शिक्षा को दर्शाता है जिसे यीशु यहाँ सुधारते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: तुम सुन चुके हो
  rationale: सूत्रात्मक शिक्षण-भूमिका में यूनानी एओरिस्ट पूर्व में सुनी और अब भी परिचित शिक्षा की ओर संकेत करता है; आधुनिक हिन्दी में ‘सुन चुके हो’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐρρέθη
  choice: कहा गया था
  rationale: λέγω के कर्मवाच्य रूप को अनिर्दिष्ट वक्ता के साथ सुरक्षित रखता है और किसी विशेष स्रोत को मुख्य पाठ में नहीं जोड़ता।
- source_word: Ἀγαπήσεις
  choice: तुम ... प्रेम करना
  rationale: भविष्यत् रूप यहाँ आज्ञार्थक बल रखता है। उद्धृत शिक्षण की समानांतर हिन्दी संरचना में ‘करना’ स्पष्ट और स्वाभाविक आदेश व्यक्त करता है।
- source_word: τὸν πλησίον σου
  choice: अपने पड़ोसी से
  rationale: लैव्यव्यवस्था 19:18 की प्रतिध्वनि वाले नैतिक संदर्भ में πλησίον का प्रचलित और सटीक हिन्दी समतुल्य ‘पड़ोसी’ है।
- source_word: μισήσεις
  choice: घृणा करना
  rationale: यह भी उद्धृत कथन में आज्ञार्थक बल वाला भविष्यत् रूप है; समानांतर संरचना पहले आदेश के साथ इसका बल बनाए रखती है।
- source_word: τὸν ἐχθρόν σου
  choice: अपने शत्रु से
  rationale: ἐχθρός के नैतिक विरोध को ‘शत्रु’ सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘और अपने शत्रु से घृणा करना’ खंड की स्थिति
  choice: इसे उस पूरे कथन का भाग रखा गया है जिसे यीशु अपने श्रोताओं द्वारा सुनी हुई शिक्षा के रूप में प्रस्तुत करते हैं, पर इसे सीधे पवित्रशास्त्रीय उद्धरण के रूप में चिह्नित नहीं किया गया।
  alternative: पूरी पंक्ति को समान रूप से पुराने नियम का प्रत्यक्ष उद्धरण मानना, अथवा दूसरे खंड को मुख्य पाठ में ही बाद की व्याख्यात्मक परंपरा कहना।
  rationale: यूनानी पाठ दोनों खंडों को ‘कहा गया था’ के अधीन एक ही कथन के रूप में देता है। पहला खंड लैव्यव्यवस्था 19:18 की प्रतिध्वनि है, जबकि दूसरा पुराने नियम का प्रत्यक्ष आदेश नहीं है; पादटिप्पणी इस तनाव को स्पष्ट करती है, मुख्य पाठ उसे समय से पहले नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; ‘तुम’ बहुवचन श्रोताओं को संबोधित करने वाली स्वाभाविक शैली है। भाषा सरल, गरिमापूर्ण और मौखिक शिक्षा के अनुकूल रखी गई है; समानांतर ‘प्रेम करना/घृणा करना’ संरचना मूल कथन की लय और आज्ञार्थक बल बनाए रखती है।
