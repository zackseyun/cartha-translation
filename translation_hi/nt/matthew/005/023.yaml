  rationale: मूल पाठ पुल्लिंग एकवचन है। उसके व्यापक प्रतिनिधिक प्रयोग की संभावना को मुख्य पाठ में विस्तार के रूप में जोड़ने के बजाय पाद-टिप्पणी में रखा गया है।
