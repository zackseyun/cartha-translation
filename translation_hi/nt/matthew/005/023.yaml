lexical_decisions:
- source_word: ἐὰν οὖν
  choice: इसलिए, यदि
  rationale: ‘इसलिए’ पिछले उपदेश से निष्कर्षात्मक संबंध और ‘यदि’ शर्त—दोनों को स्वाभाविक हिन्दी में बनाए रखते हैं।
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: तुम अपनी भेंट ... चढ़ा रहे हो
  rationale: वर्तमान संभावनार्थक रूप इस जीवंत परिस्थिति में चल रही क्रिया का बोध कराता है। बलिदान-संबंधी प्रसंग में ‘भेंट चढ़ाना’ सहज और सटीक है।
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: वेदी पर
  rationale: θυσιαστήριον बलिदान की वेदी है; ἐπί के साथ ‘वेदी पर’ भेंट को वहाँ प्रस्तुत करने का स्थान स्पष्ट करता है।
- source_word: κἀκεῖ μνησθῇς
  choice: और वहीं तुम्हें याद आए
  rationale: ‘वहीं’ स्थान पर दिए गए बल को बनाए रखता है। ‘तुम्हें याद आए’ हिन्दी में स्वाभाविक है और यह तय नहीं करता कि स्मरण स्वतः हुआ या किसी ने कराया।
- source_word: ὁ ἀδελφός σου
  choice: तुम्हारे भाई
  rationale: यूनानी में पुल्लिंग एकवचन ‘भाई’ है; मुख्य पाठ स्रोत-रूप को बनाए रखता है, जबकि उसके संभावित प्रतिनिधिक प्रयोग को पाद-टिप्पणी में बताया गया है।
- source_word: ἔχει τι κατὰ σοῦ
  choice: को तुमसे कोई शिकायत है
  rationale: यह यूनानी मुहावरा किसी के विरुद्ध शिकायत या गिला होने को व्यक्त करता है। ‘कोई शिकायत’ τι की अनिश्चितता को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
