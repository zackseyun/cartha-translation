source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: hi
  text: अपने विरोधी के प्रति जल्दी सद्भाव रखो[a], जब तक तुम उसके साथ रास्ते में हो; कहीं ऐसा न हो कि वह विरोधी तुम्हें न्यायाधीश के हवाले कर दे, और न्यायाधीश अधिकारी के हवाले कर दे, और तुम्हें जेल में डाल दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, इस कानूनी प्रसंग में अधिक मुहावरेदार ढंग से, “अपने विरोधी से जल्दी समझौता कर लो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: सद्भाव रखो
  rationale: यह यूनानी की परिधीय आज्ञा और εὐνοέω के मूल भाव—किसी के प्रति अनुकूल मनोभाव रखना—को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है। कानूनी समझौते का अधिक मुहावरेदार अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: मुद्दई
  rationale: न्यायाधीश, अधिकारी और बन्दीगृह का प्रसंग इसे कानूनी विरोधी पक्ष बताता है। ‘मुद्दई’ उस व्यक्ति को व्यक्त करता है जो कानूनी दावा लेकर सामने है, यद्यपि व्यापक अर्थ ‘विरोधी पक्ष’ भी सम्भव है।
- source_word: ταχὺ
  choice: जल्दी ही
  rationale: आज्ञा की तात्कालिकता को सहज हिन्दी में व्यक्त करता है।
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: जब तक तुम उसके साथ रास्ते में हो
  rationale: मूल की ठोस रास्ते वाली छवि को रखता है और ‘अदालत जाते समय’ जोड़कर निहितार्थ को स्पष्ट कथन नहीं बनाता।
- source_word: μήποτέ
  choice: कहीं ऐसा न हो कि
  rationale: चेतावनी और आशंकित परिणाम को स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: παραδῷ
  choice: हवाले कर दे
  rationale: न्यायिक अधिकार के अधीन सौंपे जाने के भाव को स्पष्ट और मुहावरेदार ढंग से देता है।
- source_word: κριτῇ / κριτὴς
  choice: न्यायाधीश
  rationale: कानूनी सन्दर्भ में κριτής का मानक और स्पष्ट हिन्दी रूप।
- source_word: ὑπηρέτῃ
  choice: अधिकारी
  rationale: यह न्यायाधीश के अधीन आदेश लागू करने वाले कर्मचारी को पर्याप्त व्यापकता से व्यक्त करता है; ‘बेलिफ़’ जैसी संस्कृति-विशिष्ट संज्ञा से बचता है।
- source_word: εἰς φυλακὴν
  choice: बन्दीगृह में
  rationale: φυλακή के कारावास-स्थान वाले अर्थ को गरिमापूर्ण मानक हिन्दी में व्यक्त करता है।
- source_word: βληθήσῃ
  choice: डाल दिए जाओ
  rationale: निष्क्रिय क्रिया और बलपूर्वक बन्दीगृह भेजे जाने की सजीवता को बनाए रखता है।
theological_decisions:
- issue: आरम्भिक आज्ञा को अनुकूल मनोभाव के रूप में रखा जाए या कानूनी समझौते के मुहावरे के रूप में
  choice: मुख्य पाठ में ‘अपने मुद्दई के प्रति ... सद्भाव रखो’
  alternative: ‘अपने मुद्दई से जल्दी समझौता कर लो’
  rationale: कानूनी प्रसंग समझौते का भाव सम्भव बनाता है, पर εὐνοέω का प्रत्यक्ष अर्थ अनुकूल या सद्भावपूर्ण होना है। मुख्य पाठ इस शाब्दिक तनाव को रखता है और कानूनी मुहावरेदार अर्थ पाद-टिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रजिस्टर अपनाया गया है। ‘सद्भाव रखो’ मूल क्रिया की अर्थगत खुलावट बचाता है; ‘मुद्दई’ कानूनी क्रम को स्पष्ट करता है। मुख्य पाठ में पाद-टिप्पणी संकेत [a] उपस्थित है।
