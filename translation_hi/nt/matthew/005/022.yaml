source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: hi
  text: पर मैं तुमसे कहता हूँ कि हर वह व्यक्ति जो अपने भाई पर क्रोध करता है, न्याय का भागी होगा[a]; और जो कोई अपने भाई से कहे, ‘राका’[b], वह महासभा[c] का भागी होगा; और जो कोई कहे, ‘मूर्ख!’ वह आग की गेहन्ना[e] का भागी होगा।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में ‘अपने भाई पर क्रोध करता है’ के बाद ‘बिना कारण’ जोड़ा गया है। प्राचीनतम और अधिक समर्थित पाठ में ये शब्द नहीं हैं।
    reason: textual_variant
  - marker: b
    text: ‘राका’ अरामी भाषा का तिरस्कारसूचक शब्द है, जिसका लगभग अर्थ ‘खोखले दिमाग वाला’ या ‘निकम्मा’ है।
    reason: cultural_note
  - marker: c
    text: या ‘सनहेद्रिन’, अर्थात यहूदियों की शासकीय महासभा।
    reason: alternative_reading
  - marker: d
    text: यहाँ ‘भाई’ के लिए पुल्लिंग एकवचन शब्द है, पर उसका प्रयोग प्रतिनिधिक रूप से हो सकता है; यह कथन केवल पुरुष सहोदर तक सीमित नहीं है।
    reason: lexical_alternative
  - marker: e
    text: या ‘आग का नरक’। ‘गेहन्ना’ यीशु के विशिष्ट शब्द को सुरक्षित रखता है, जो न्याय से जुड़ी हिन्नोम घाटी की छवि से निकला है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: पर मैं तुमसे कहता हूँ
  rationale: ἐγώ और δέ के बलयुक्त विरोध को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है और λέγω के लिए ‘कहता हूँ’ का सीधा रूप देता है।
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: हर वह व्यक्ति जो ... क्रोध करता है
  rationale: वर्तमान कृदन्त की सामान्य, नीतिवचनात्मक व्यापकता को बनाए रखता है; इसे केवल क्षणिक रूप से ‘क्रोधित हो जाने’ तक सीमित नहीं करता।
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: अपने भाई पर
  rationale: ὀργίζομαι के साथ सम्प्रदान कारक का स्वाभाविक हिन्दी संबंध व्यक्त करता है। ‘भाई’ यूनानी पुल्लिंग एकवचन को सुरक्षित रखता है, जबकि उसके प्रतिनिधिक व्यापक प्रयोग को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἔνοχος ἔσται
  choice: दण्ड का भागी होगा
  rationale: न्यायिक उत्तरदायित्व और दण्ड के अधीन होने का भाव सहज हिन्दी में देता है तथा पद के तीनों चेतावनी-वाक्यों में समानांतरता बनाए रखता है।
- source_word: τῇ κρίσει
  choice: न्याय के दण्ड
  rationale: κρίσις के न्यायिक अर्थ को बनाए रखता है, पर यह अनावश्यक रूप से तय नहीं करता कि यहाँ कोई स्थानीय अदालत अभिप्रेत है या व्यापक न्याय-प्रक्रिया।
- source_word: Ῥακά
  choice: राका
  rationale: यूनानी पाठ में सुरक्षित अरामी अपमानसूचक शब्द का लिप्यंतरण है; उसका लगभग अर्थ पादटिप्पणी में दिया गया है ताकि स्रोत की सांस्कृतिक बनावट न मिटे।
- source_word: τῷ συνεδρίῳ
  choice: महासभा
  rationale: συνέδριον के परिषद/सभा संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। ‘सनहेद्रिन’ की अधिक विशिष्ट पहचान को विकल्प के रूप में पादटिप्पणी में रखा गया है।
- source_word: Μωρέ
  choice: मूर्ख!
  rationale: सम्बोधन रूप में प्रयुक्त सीधे अपमान को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है, बिना आधुनिक चिकित्सकीय या बौद्धिक श्रेणी थोपे।
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: आग की गेहन्ना
  rationale: γέεννα के विशिष्ट ऐतिहासिक-धार्मिक शब्द को लिप्यंतरित करता है और τοῦ πυρός की अग्नि-छवि को बनाए रखता है।
theological_decisions:
- issue: γέεννα का अनुवाद
  choice: गेहन्ना
  alternative: नरक
  rationale: यह यीशु द्वारा प्रयुक्त हिन्नोम घाटी से निकले विशिष्ट न्याय-चित्र को सुरक्षित रखता है और बाद की सभी धारणाओं को एक ही हिन्दी शब्द में अनजाने में नहीं समेटता।
- issue: ἀδελφός का लिंग और दायरा
  choice: भाई
  alternative: भाई या बहन / साथी विश्वासी
  rationale: मुख्य पाठ यूनानी पुल्लिंग एकवचन के अनुरूप रहता है, जबकि उसका प्रतिनिधिक और व्यापक अनुप्रयोग पादटिप्पणी में स्पष्ट किया गया है।
- issue: क्रोध के लिए पाठांतर
  choice: ‘बिना कारण’ को मुख्य पाठ में नहीं जोड़ा गया
  alternative: जो अपने भाई पर बिना कारण क्रोध करता है
  rationale: प्राचीनतम और अधिक समर्थित पाठ में εἰκῇ नहीं है; इसलिए चेतावनी की तीक्ष्णता को पाठांतर जोड़कर सीमित नहीं किया गया।
- issue: τῇ κρίσει की पहचान
  choice: न्याय
  alternative: अदालत
  rationale: यह न्यायिक अर्थ को सुरक्षित रखते हुए इस बात को खुला रखता है कि कोई स्थानीय न्यायालय अभिप्रेत है या न्याय की प्रक्रिया।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सामान्य पाठक के लिए बोधगम्य रखी गई है। न्यायिक क्रम को ‘दण्ड का भागी होगा’ की पुनरावृत्ति से स्पष्ट किया गया है। ‘राका’ और ‘गेहन्ना’ जैसे सांस्कृतिक रूप से विशिष्ट शब्द मुख्य पाठ में सुरक्षित रखकर पादटिप्पणियों में समझाए गए हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
