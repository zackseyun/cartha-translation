id: MAT.5.41
reference: Matthew 5:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὅστις σε ἀγγαρεύσει μίλιον ἕν, ὕπαγε μετ’ αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/041.yaml
  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: hi
  text: और जो कोई तुम्हें एक मील चलने के लिए मजबूर करे[a], उसके साथ दो मील चले जाओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त यूनानी क्रिया किसी व्यक्ति को अधिकारपूर्वक सेवा के लिए बाध्य करने का अर्थ दे सकती है; संभवतः इसमें रोमी शासन के समय कराई जाने वाली जबरन सेवा का संकेत है।
    reason: lexical_alternative
  - marker: b
    text: मूल पाठ में शाब्दिक रूप से ‘उसके साथ दो चले जाओ’ है; दूसरी बार ‘मील’ शब्द समझा हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: जो कोई
  rationale: यह अनिश्चित संबंधवाचक सर्वनाम एक सामान्य स्थिति प्रस्तुत करता है; ‘जो कोई’ उसके व्यापक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: ἀγγαρεύσει
  choice: चलने के लिए मजबूर करे
  rationale: यह क्रिया किसी व्यक्ति को अधिकारपूर्वक सेवा के लिए बाध्य करने का भाव रखती है। प्रसंग में दूरी दी गई है, इसलिए ‘चलने के लिए मजबूर करे’ बाध्यता और गति—दोनों को स्पष्ट करता है, बिना मुख्य पाठ में रोमी सैनिकों का उल्लेख जोड़े।
- source_word: μίλιον ἕν
  choice: एक मील
  rationale: यह रोमी मील की दूरी सूचित करता है। परिचित हिन्दी इकाई ‘मील’ ठोस दूरी और मूल संख्या दोनों को बनाए रखती है।
- source_word: ὕπαγε
  choice: चले जाओ
  rationale: आज्ञार्थक क्रिया आगे जाने को कहती है; ‘चले जाओ’ इस प्रसंग में स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: μετ’ αὐτοῦ
  choice: उसके साथ
  rationale: μετά संबंध और साथ जाने का अर्थ देता है; ‘उसके साथ’ सीधा और स्वाभाविक अनुवाद है।
- source_word: δύο
  choice: दो मील
  rationale: यूनानी में केवल ‘दो’ है और ‘मील’ पहले पद से समझा जाता है। हिन्दी में संपूर्ण पद दोहराना अधिक स्वाभाविक है और अर्थ में कुछ नहीं जोड़ता।
theological_decisions:
- issue: अधिकार के अधीन जबरन सेवा का ऐतिहासिक-सामाजिक संकेत
  choice: मुख्य पाठ में बाध्य किए जाने का भाव रखा गया, पर रोमी सैनिकों को स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: इसे मुख्य पाठ में रोमी सैनिक द्वारा कराई गई बेगार के रूप में स्पष्ट करना।
  rationale: ἀγγαρεύω और ‘मील’ रोमी शासन के अंतर्गत जबरन सेवा की पृष्ठभूमि जगा सकते हैं, लेकिन मूल पाठ सैनिक या अधिकारी का स्पष्ट उल्लेख नहीं करता। इसलिए संभावित ऐतिहासिक संदर्भ को टिप्पणी में रखा गया है, मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘मजबूर करे’ सामान्य पाठक के लिए स्पष्ट है, जबकि ऐतिहासिक रूप से अधिक विशिष्ट ‘बेगार’ को मुख्य पाठ में न रखकर टिप्पणी में समझाया गया है।
