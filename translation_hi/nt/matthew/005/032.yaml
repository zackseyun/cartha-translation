source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: hi
  text: पर मैं तुमसे कहता हूँ कि जो कोई यौन अनैतिकता[a] के मामले को छोड़कर अपनी पत्नी को तलाक देता है, वह उसके व्यभिचार का कारण बनता है[b]; और जो कोई तलाकशुदा स्त्री से विवाह करता है, वह व्यभिचार करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यौन अनैतिकता’ यूनानी शब्द porneia का अनुवाद है। यह निषिद्ध यौन आचरण के लिए एक व्यापक शब्द है; कुछ अनुवादों में ‘जारकर्म’ या ‘अशुचिता’ मिलता है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, ‘उसे व्यभिचारिणी बनाता है।’ यहाँ यूनानी infinitive रूप की दृष्टि से कर्मवाच्य है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: तलाक देता है / तलाक दी हुई स्त्री
  rationale: विवाह के संदर्भ में ἀπολύω का अर्थ केवल ‘विदा करना’ नहीं, बल्कि वैवाहिक संबंध को समाप्त करना, अर्थात तलाक देना है। दोनों रूपों में एक ही वैवाहिक-कानूनी अर्थ रखा गया है।
- source_word: γυναῖκα
  choice: पत्नी
  rationale: γυνή का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है; यहाँ αὐτοῦ (‘अपनी/उसकी’) और तलाक का संदर्भ ‘पत्नी’ का अर्थ स्पष्ट करते हैं।
- source_word: παρεκτὸς λόγου πορνείας
  choice: यौन अनैतिकता के कारण को छोड़कर
  rationale: παρεκτός एक अपवाद प्रस्तुत करता है और λόγου यहाँ कारण या आधार के अर्थ में है। πορνεία अवैध यौन आचरण के लिए व्यापक शब्द है, इसलिए इसे केवल ‘व्यभिचार’ जैसे किसी एक कृत्य तक सीमित नहीं किया गया।
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: वह उससे व्यभिचार करवाता है
  rationale: ποιέω के साथ infinitive कारण उत्पन्न करने का भाव देता है। यह हिंदी में संक्षिप्त और बोधगम्य है; साथ ही μοιχευθῆναι के व्याकरणिक रूप और ‘उसे व्यभिचारिणी बनाता है’ वाले परिणामसूचक भाव को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: जो कोई ... विवाह करता है
  rationale: ἐάν के साथ यह संबंधवाचक वाक्यांश एक सामान्य और अनिश्चित शर्त व्यक्त करता है; ‘जो कोई’ उसे स्वाभाविक हिंदी में बनाए रखता है।
- source_word: μοιχᾶται
  choice: व्यभिचार करता है
  rationale: वर्तमानकालीन यूनानी क्रिया को हिंदी में सामान्य नैतिक कथन के रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: πᾶς ὁ ἀπολύων
  choice: जो कोई ... तलाक देता है
  rationale: पुल्लिंग एकवचन participial construction यहाँ सामान्य श्रेणी को व्यक्त करता है। ‘जो कोई’ उसकी व्यापकता रखता है, जबकि ‘अपनी पत्नी’ तत्कालीन पुरुष-केंद्रित सामाजिक प्रसंग को स्पष्ट बनाए रखता है।
theological_decisions:
- issue: παρεκτὸς λόγου πορνείας में अपवाद का अर्थ
  choice: 'इसे वास्तविक अपवाद के रूप में अनूदित किया गया है: ‘यौन अनैतिकता के कारण को छोड़कर।’'
  alternative: इसे ‘अवैध विवाह के मामले को छोड़कर’ जैसे अधिक संकीर्ण अर्थ में समझना।
  rationale: यूनानी पाठ स्पष्ट रूप से अपवाद प्रस्तुत करता है, पर πορνεία की ठीक सीमा निर्धारित नहीं करता। अनुवाद अपवाद को स्पष्ट रखता है, किंतु किसी विशेष व्याख्यात्मक या सांप्रदायिक निष्कर्ष को पाठ में नहीं जोड़ता।
- issue: ποιεῖ αὐτὴν μοιχευθῆναι का कर्तृवाच्य अथवा कर्मवाच्य-परिणामसूचक बल
  choice: मुख्य पाठ में स्वाभाविक हिंदी ‘वह उससे व्यभिचार करवाता है’ रखा गया है और अधिक शाब्दिक परिणामसूचक विकल्प पादटिप्पणी में दिया गया है।
  alternative: ‘वह उसे व्यभिचारिणी बनाता है’ अथवा ‘उसके साथ व्यभिचार होने का कारण बनता है।’
  rationale: μοιχευθῆναι रूप की दृष्टि से passive infinitive है, लेकिन संदर्भ में उसके सटीक बल पर मतभेद है। मुख्य पाठ अर्थ को पठनीय रखता है और पादटिप्पणी वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में आदरपूर्ण किंतु सरल शैली रखी गई है। ‘तलाक’, ‘यौन अनैतिकता’ और ‘व्यभिचार’ सामान्य पाठकों के लिए परिचित तथा संदर्भानुकूल शब्द हैं। अपवाद-वाक्यांश को पत्नी और तलाक के मुख्य कथन के बीच रखा गया है, ताकि यूनानी तर्क-संबंध स्पष्ट रहे।
