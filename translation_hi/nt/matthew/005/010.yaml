lexical_decisions:
- source_word: μακάριοι
  choice: धन्य हैं
  rationale: यह आशीर्वचन की घोषणात्मक और परमेश्वर-संबंधी अर्थछाया को बनाए रखता है; केवल मन की अवस्था बताने वाला ‘सुखी’ यहाँ कम पर्याप्त है।
- source_word: οἱ δεδιωγμένοι
  choice: वे, जिन्हें सताया गया है
  rationale: निश्चयवाचक पद के साथ पूर्णकालिक कर्मवाच्य कृदंत लोगों के एक वर्ग और उन पर हुए उत्पीड़न की वर्तमान परिणामी अवस्था को दर्शाता है।
- source_word: ἕνεκεν
  choice: के कारण
  rationale: यह उत्पीड़न के कारण को आधुनिक और स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: यह परमेश्वर की इच्छा के अनुरूप सही आचरण और जीवन की व्यापक अर्थछाया रखता है; ‘न्याय’ संभव अर्थ है और पादटिप्पणी में दिया गया है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह आशीर्वचन के आधार या कारण का परिचय स्पष्ट रूप से देता है।
- source_word: αὐτῶν
  choice: उन्हीं का
  rationale: बलसूचक ‘ही’ यूनानी सर्वनाम की प्रमुखता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: यह मत्ती की विशिष्ट अभिव्यक्ति का प्रचलित, सटीक और सहज हिन्दी रूप है तथा परमेश्वर के स्वर्गीय शासन की ओर संकेत करता है।
theological_decisions:
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: इस प्रसंग में शब्द मुख्यतः परमेश्वर की इच्छा के अनुरूप जीवन और आचरण को सूचित करता है, पर न्याय की अर्थछाया भी वास्तविक है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज आशीर्वचन शैली। ‘धन्य’ बाइबलीय घोषणात्मक स्वर को बनाए रखता है, जबकि वाक्य-विन्यास समकालीन रखा गया है।
