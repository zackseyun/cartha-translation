source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: hi
  text: “फिर तुमने सुना है कि पुराने समय के लोगों से कहा गया था, ‘झूठी शपथ मत खाना[a], बल्कि प्रभु[b] के लिए अपनी शपथें पूरी करना।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी शपथ मत तोड़ना”; इस क्रिया का अर्थ झूठी शपथ खाना या खाई हुई शपथ का उल्लंघन करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “यहोवा”; पुराने नियम की पृष्ठभूमि में यह वाचा के दिव्य नाम को दर्शा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: फिर
  rationale: यह शब्द यीशु द्वारा दिए जा रहे अगले उदाहरण को पिछले उदाहरणों से जोड़ता है और विचार-क्रम को स्वाभाविक हिंदी में आगे बढ़ाता है।
- source_word: ἠκούσατε
  choice: तुमने सुना है
  rationale: सूत्रवत अओरिस्ट क्रिया को वर्तमान प्रासंगिकता बनाए रखते हुए हिंदी के पूर्ण पक्ष में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ἐρρέθη
  choice: कहा गया था
  rationale: कर्मवाच्य और वक्ता की अनिर्दिष्टता दोनों सुरक्षित रहती हैं।
- source_word: τοῖς ἀρχαίοις
  choice: प्राचीनकाल के लोगों से
  rationale: यह पहले की पीढ़ियों को दर्शाता है; इससे केवल वृद्ध लोगों का अर्थ निकलने से बचता है।
- source_word: Οὐκ ἐπιορκήσεις
  choice: झूठी शपथ मत खाना
  rationale: ἐπιορκέω झूठी शपथ खाने या शपथ तोड़ने, दोनों की ओर संकेत कर सकता है। मुख्य पाठ में प्रचलित और व्यापक अर्थ रखा गया है तथा दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀποδώσεις
  choice: पूरी करना
  rationale: यहाँ क्रिया का आशय शपथ से स्वीकार किए गए दायित्व को निभाना है; ‘पूरी करना’ साधारण हिंदी में स्पष्ट है।
- source_word: τῷ κυρίῳ
  choice: प्रभु के प्रति
  rationale: κύριος का सीधा और गरिमापूर्ण हिंदी रूप ‘प्रभु’ है। संबंधकारक भाव को ‘के प्रति’ से व्यक्त करना शपथ के दायित्व को स्वाभाविक रूप से बताता है।
- source_word: τοὺς ὅρκους σου
  choice: अपनी शपथें
  rationale: बहुवचन और स्वामित्व दोनों को सीधे बनाए रखा गया है।
theological_decisions:
- issue: इस्राएल के धर्मशास्त्र के संकेत में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी पाठ में κυρίῳ है, इसलिए मुख्य पाठ में ‘प्रभु’ रखा गया है। पुराने नियम की पृष्ठभूमि में वाचा का दिव्य नाम संभव होने के कारण ‘यहोवा’ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἐπιορκέω का अर्थ-क्षेत्र
  choice: झूठी शपथ खाना
  alternative: शपथ तोड़ना
  rationale: क्रिया झूठी शपथ और शपथ-भंग दोनों को व्यक्त कर सकती है। मुख्य पाठ का रूप प्राचीन विधिक कथन से मेल खाता है, जबकि वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। उद्धरण में ‘मत खाना’ और ‘पूरी करना’ विधिक आज्ञा को सहज हिंदी में व्यक्त करते हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित स्थानों पर दिए गए हैं।
