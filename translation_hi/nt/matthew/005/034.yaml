base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: hi
  text: परन्तु मैं तुमसे कहता हूँ, बिल्कुल शपथ मत खाओ—न स्वर्ग की, क्योंकि वह परमेश्वर का सिंहासन है;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: परन्तु मैं तुमसे कहता हूँ
  rationale: δὲ का विरोधसूचक प्रवाह ‘परन्तु’ से और ἐγώ के स्पष्ट बल को ‘मैं’ से बनाए रखा गया है।
- source_word: μὴ ὀμόσαι ὅλως
  choice: शपथ बिल्कुल न खाना
  rationale: ὀμόσαι का स्वाभाविक हिन्दी मुहावरा ‘शपथ खाना’ है; ὅλως की व्यापक निषेधात्मक शक्ति ‘बिल्कुल न’ से व्यक्त होती है।
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: न तो स्वर्ग की
  rationale: शपथ के साधन/आधार को हिन्दी में स्वाभाविक रूप से ‘स्वर्ग की शपथ’ कहा जाता है; पुनरुक्त ‘शपथ’ को प्रसंग से समझा जाता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι स्वर्ग की शपथ न खाने का कारण प्रस्तुत करता है।
- source_word: θρόνος ἐστὶν τοῦ θεοῦ
  choice: वह परमेश्वर का सिंहासन है
  rationale: सम्बन्धवाचक genitive और कथन की सीधी रूपकात्मक संरचना सुरक्षित रखी गई है।
theological_decisions:
- issue: μὴ ὀμόσαι ὅλως की व्यापकता
  choice: शपथ बिल्कुल न खाना
  alternative: झूठी शपथ न खाना
  rationale: मूल पाठ निषेध को झूठी शपथ तक सीमित नहीं करता; इसलिए उसकी व्यापकता और सम्भावित व्याख्यात्मक तनाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘शपथ खाना’ प्रचलित हिन्दी मुहावरा है। पद अगले वाक्य से जुड़ता है, इसलिए अन्त में अर्धविराम रखा गया है।
