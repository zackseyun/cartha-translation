revisions:
- from: परन्तु मैं तुमसे कहता हूँ कि शपथ बिल्कुल न खाना—न तो स्वर्ग की, क्योंकि वह परमेश्वर का सिंहासन है;
  to: परन्तु मैं तुमसे कहता हूँ, बिल्कुल शपथ मत खाओ—न स्वर्ग की, क्योंकि वह परमेश्वर का सिंहासन है;
  rationale: The revision only improves the Hindi syntax and naturalness of the prohibition. ‘बिल्कुल’ retains the comprehensive force of ὅλως, while ‘न स्वर्ग की’ continues the conventional Hindi ellipsis for ‘न स्वर्ग की शपथ,’ corresponding to μήτε ἐν τῷ οὐρανῷ. The semicolon is retained because the sentence continues in the following verse.
