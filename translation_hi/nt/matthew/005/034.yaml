review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the emphatic first-person contrast, the comprehensive prohibition (μὴ ὀμόσαι ὅλως), the specific instance of swearing by heaven, and the causal clause identifying heaven as God's throne. The ellipsis in ‘न तो स्वर्ग की’ is understandable, but the governing prohibition is more faithfully and idiomatically expressed as a direct plural prohibition in Hindi.
  naturalness: ‘मैं तुमसे कहता हूँ कि शपथ बिल्कुल न खाना’ is less natural in modern standard Hindi because the infinitive ‘न खाना’ after ‘कहता हूँ कि’ is awkward here. ‘बिल्कुल शपथ मत खाओ’ is direct, clear, and retains the Greek’s broad force. The following elliptical ‘न स्वर्ग की’ is natural in context, with ‘शपथ’ understood.
  terminology: ‘शपथ खाना,’ ‘स्वर्ग,’ ‘परमेश्वर,’ and ‘सिंहासन’ are standard, dignified Hindi renderings and preserve the intended register. No doctrinal narrowing is introduced.
  issues:
  - severity: medium
    issue: Awkward Hindi verbal construction
    rationale: The phrase ‘मैं तुमसे कहता हूँ कि शपथ बिल्कुल न खाना’ uses an infinitive in a way that is not smooth modern standard Hindi. A direct prohibitive plural form better communicates the addressed command without changing its scope.
  revised_text: परन्तु मैं तुमसे कहता हूँ, बिल्कुल शपथ मत खाओ—न स्वर्ग की, क्योंकि वह परमेश्वर का सिंहासन है;
