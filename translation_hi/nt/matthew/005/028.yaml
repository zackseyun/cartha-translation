id: MAT.5.28
reference: Matthew 5:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: hi
  text: पर मैं तुमसे कहता हूँ कि जो कोई किसी स्त्री[a] को उसकी कामना करने के इरादे से[b] देखता है, वह अपने हृदय में उसके साथ पहले ही व्यभिचार कर चुका है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ संदर्भ के अनुसार ‘स्त्री’ या ‘पत्नी’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'या: “उसके प्रति कामुक लालसा रखने के लिए।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: पर मैं तुमसे कहता हूँ
  rationale: δέ के विरोधात्मक बल और ἐγώ के स्पष्ट प्रथम-पुरुष बल को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: πᾶς ὁ βλέπων
  choice: जो कोई … देखता है
  rationale: यह यूनानी रचना सामान्य और सर्वसमावेशी कथन है; ‘जो कोई’ हिन्दी में उसके सार्वत्रिक बल को सहज रूप से व्यक्त करता है।
- source_word: γυναῖκα
  choice: किसी स्त्री
  rationale: γυνή का अर्थ संदर्भ के अनुसार ‘स्त्री’ या ‘पत्नी’ हो सकता है। यहाँ यूनानी पाठ वैवाहिक स्थिति स्पष्ट नहीं करता, इसलिए मुख्य पाठ में व्यापक अर्थ चुना गया है।
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτήν
  choice: उसकी कामना करने के इरादे से
  rationale: πρός के साथ सप्रत्यय क्रियार्थक संज्ञा उद्देश्य या अभिप्राय प्रकट करती है। यह अनुवाद केवल आकस्मिक दृष्टि के बजाय इच्छा करने के उद्देश्य से देखने का भाव सुरक्षित रखता है।
- source_word: ἤδη ἐμοίχευσεν αὐτήν
  choice: उसके साथ पहले ही व्यभिचार कर चुका है
  rationale: ἤδη को ‘पहले ही’ और μοιχεύω को प्रचलित हिन्दी पद ‘व्यभिचार करना’ से व्यक्त किया गया है; ‘के साथ’ αὐτήν के संबंध को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: अपने हृदय में
  rationale: ‘हृदय’ καρδία के शाब्दिक और बाइबलीय भाव को बनाए रखता है, जहाँ यह विचार, इच्छा और भीतरी व्यक्ति को सूचित करता है।
theological_decisions:
- issue: γυνή को ‘स्त्री’ या ‘पत्नी’ अनूदित करना
  choice: स्त्री
  alternative: पत्नी
  rationale: यूनानी शब्द दोनों अर्थ रखता है, पर इस सामान्य नैतिक कथन में वैवाहिक स्थिति स्पष्ट नहीं है। ‘स्त्री’ स्रोत से अधिक संकीर्ण निष्कर्ष नहीं निकालता; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: ἐπιθυμέω को ‘कामना करना’ या ‘वासना करना’ अनूदित करना
  choice: कामना करना
  alternative: वासना करना / कामुक लालसा रखना
  rationale: क्रिया का मूल अर्थ केवल यौन वासना तक सीमित नहीं है, यद्यपि इस संदर्भ में इच्छा अनुचित और यौन है। ‘कामना’ शब्दार्थ की व्यापकता बचाता है, जबकि व्यभिचार का संदर्भ नैतिक अर्थ स्पष्ट करता है।
- issue: नज़र पड़ने और जानबूझकर इच्छा से देखने के बीच संबंध
  choice: इरादे से
  alternative: कामुक इच्छा से
  rationale: πρὸς τὸ और infinitive उद्देश्य या निर्देशित अभिप्राय दर्शाते हैं। इसलिए पाठ को मात्र अनैच्छिक दृष्टि या अनायास उत्पन्न विचार की निंदा के रूप में नहीं ढाला गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ‘हृदय’ और ‘व्यभिचार’ जैसे परिचित बाइबलीय-नैतिक शब्द गरिमा और स्रोत-समीपता के लिए रखे गए हैं। ‘उसकी कामना करने के इरादे से’ उद्देश्य का भाव स्पष्ट करता है और अनायास देखने को जानबूझकर इच्छा से देखने के बराबर नहीं ठहराता।
