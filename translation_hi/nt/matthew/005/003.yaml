  text: Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: hi
  text: “धन्य हैं वे जो मन के दीन हैं,[a] क्योंकि स्वर्ग का राज्य उनका है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मन के दीन’ को ‘आत्मिक रूप से निर्धन’ या ‘अपनी आत्मिक आवश्यकता पहचानने वाले’ भी समझा जा सकता है। मूल यूनानी पदबंध की अर्थ-सीमा खुली है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, ‘स्वर्गों का राज्य’; यह मत्ती की विशिष्ट अभिव्यक्ति है, जिसे हिन्दी में परंपरागत रूप से ‘स्वर्ग का राज्य’ कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: धन्य हैं
  rationale: ‘धन्य’ ईश्वरीय अनुग्रह और ऐसी सराहनीय दशा को व्यक्त करता है जो केवल मन की प्रसन्नता नहीं है; यह धन्य-वचनों के लिए प्रतिष्ठित और स्वाभाविक हिन्दी प्रयोग भी है।
- source_word: οἱ πτωχοὶ τῷ πνεύματι
  choice: वे जो मन में दीन हैं
  rationale: πτωχοί अभाव और दीनता का प्रबल बोध देता है, जबकि τῷ πνεύματι उस दीनता के क्षेत्र या संबंध को बताता है। ‘मन में दीन’ आधुनिक हिन्दी में समझने योग्य है और इसे केवल नम्रता अथवा अपनी आत्मिक आवश्यकता पहचानने तक सीमित नहीं करता।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι धन्य कहे जाने का आधार प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: αὐτῶν ἐστιν
  choice: उन्हीं का है
  rationale: मूल में αὐτῶν की अग्रस्थिति से प्राप्त बल को ‘उन्हीं’ व्यक्त करता है और ἐστιν के वर्तमान काल को बनाए रखता है।
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: यह मत्ती की विशिष्ट अभिव्यक्ति का स्वाभाविक और प्रचलित हिन्दी रूप है। βασιλεία में राजकीय शासन और राज्य—दोनों की अर्थ-छायाएँ रह सकती हैं।
theological_decisions:
- issue: ‘आत्मा में दीन’ पदबंध का आशय
  choice: मुख्य पाठ में ‘मन में दीन’ रखकर पदबंध की व्याख्यात्मक खुलावट बनाए रखना।
  alternative: ‘आत्मिक रूप से निर्धन’, ‘नम्र’, अथवा ‘अपनी आत्मिक आवश्यकता पहचानने वाले’।
  rationale: मूल पदबंध समृद्ध और कुछ हद तक खुला है। किसी एक व्याख्या को मुख्य पाठ में रखने से यूनानी पाठ की अर्थ-सीमा अनावश्यक रूप से संकुचित हो जाती। हिन्दी में ‘आत्मा में दीन’ पवित्र आत्मा से संबंध का भ्रम पैदा कर सकता है, इसलिए ‘मन में दीन’ अधिक स्वाभाविक है।
- issue: राज्य पर अधिकार का वर्तमान काल
  choice: ‘उन्हीं का है’
  alternative: ‘उन्हीं का होगा’ अथवा ‘उन्हें मिलेगा’।
  rationale: ἐστιν वर्तमान काल में है; इसलिए कथन को केवल भविष्य के प्रतिफल में बदलना उचित नहीं होगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘धन्य’ जैसे परिचित बाइबलीय शब्द को बनाए रखते हुए वाक्य-विन्यास सरल रखा गया है।
