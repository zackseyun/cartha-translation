source:
  edition: SBLGNT
  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: hi
  text: पर तुम्हारी बात ‘हाँ, हाँ’ या ‘नहीं, नहीं’ हो। इनसे बढ़कर जो कुछ है, वह उस दुष्ट से आता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह बुराई से आता है।” यूनानी पद का अर्थ व्यक्तिगत रूप से “उस दुष्ट से” या अवैयक्तिक रूप से “बुराई से” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: हो
  rationale: εἰμί का तृतीय-पुरुष वर्तमान आज्ञार्थक रूप है; ‘हो’ हिन्दी में उपदेशात्मक आग्रह को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: λόγος
  choice: बात
  rationale: यहाँ λόγος सामान्य बोलचाल में कही गई बात या कथन को सूचित करता है। ‘बात’ आधुनिक हिन्दी में ‘वचन’ की अपेक्षा अधिक सहज है और सूक्ति की संक्षिप्तता बनाए रखता है।
- source_word: ναὶ ναί, οὒ οὔ
  choice: ‘हाँ’ की ‘हाँ,’ या ‘नहीं’ की ‘नहीं’
  rationale: यह प्रयोग यूनानी के दोहराव और उसके दृढ़, स्पष्ट कथन के बल को बनाए रखता है तथा हिन्दी में स्वाभाविक सुनाई देता है।
- source_word: περισσὸν
  choice: इससे बढ़कर जो कुछ
  rationale: संज्ञावत प्रयुक्त विशेषण उस बात को दर्शाता है जो सीधे ‘हाँ’ या ‘नहीं’ से आगे बढ़ती है; यह हिन्दी अभिव्यक्ति उसके तुलनात्मक अर्थ को स्पष्ट रखती है।
- source_word: τούτων
  choice: इससे
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पहले कही गई ‘हाँ’ और ‘नहीं’ की जोड़ी की ओर लौटता है; हिन्दी में एकवचन-जैसा ‘इससे’ पूरे कथन को स्वाभाविक रूप से समेटता है।
- source_word: ἐκ
  choice: से आता है
  rationale: यह संबंध स्रोत या उद्गम को दर्शाता है; हिन्दी में ‘से आता है’ इस संबंध को स्पष्ट और सहज बनाता है।
- source_word: τοῦ πονηροῦ
  choice: उस दुष्ट
  rationale: सव्यय लेखयुक्त रूप व्यक्तिगत ‘दुष्ट’ अर्थात दुष्ट जन की ओर संकेत कर सकता है। मत्ती में व्यक्तिगत अर्थ की संभावना प्रबल है, पर अवैयक्तिक ‘बुराई’ भी व्याकरणतः संभव है और पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: τοῦ πονηροῦ का अर्थ अवैयक्तिक ‘बुराई’ है या व्यक्तिगत ‘दुष्ट’
  choice: उस दुष्ट
  alternative: बुराई
  rationale: यूनानी पदबंध व्याकरणतः दोनों अर्थ दे सकता है। मत्ती में ὁ πονηρός का व्यक्तिगत प्रयोग मिलने के कारण मुख्य पाठ में ‘उस दुष्ट’ चुना गया है, जबकि वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘हाँ की हाँ’ और ‘नहीं की नहीं’ यूनानी दोहराव तथा सूक्तिपरक लय को बचाते हैं।
