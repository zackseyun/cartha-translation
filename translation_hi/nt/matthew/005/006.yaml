id: MAT.5.6
reference: Matthew 5:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: hi
  text: धन्य हैं वे जो धार्मिकता[a] के भूखे और प्यासे हैं, क्योंकि वे तृप्त किए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय।” यूनानी शब्द का अर्थ धार्मिकता, न्याय, या वह जो परमेश्वर की दृष्टि में सही है, हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: धन्य हैं
  rationale: यह वाक्य मनोवैज्ञानिक प्रसन्नता से अधिक परमेश्वर की कृपा और स्वीकृति की घोषणा करता है; ‘धन्य’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक और गरिमापूर्ण है।
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: वे जो ... के भूखे और प्यासे हैं
  rationale: वर्तमान कृदन्त निरंतर और तीव्र अभिलाषा व्यक्त करते हैं। यह रूपक हिन्दी में स्वाभाविक रहते हुए उस जारी लालसा को बनाए रखता है।
- source_word: τὴν δικαιοσύνην
  choice: धार्मिकता
  rationale: δικαιοσύνη यहाँ परमेश्वर के सामने सही होने, सही आचरण और न्यायपूर्ण व्यवस्था की व्यापक धारणा रख सकता है। मुख्य पाठ में प्रचलित ‘धार्मिकता’ रखा गया है और ‘न्याय’ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह धन्यता के कारण को स्पष्ट रूप से प्रस्तुत करता है और आधुनिक हिन्दी में सहज है।
- source_word: αὐτοὶ
  choice: वे
  rationale: यूनानी सर्वनाम में बल है; हिन्दी में ‘वे’ को प्रतिज्ञा के सीधे कर्ता के रूप में रखकर इसे स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: χορτασθήσονται
  choice: तृप्त किए जाएँगे
  rationale: भविष्यत् कर्मवाच्य भूख-प्यास के रूपक को पूर्ण तृप्ति तक ले जाता है। कर्मवाच्य परमेश्वर को अप्रकट कर्ता मानने की सम्भावना भी सुरक्षित रखता है।
theological_decisions:
- issue: δικαιοσύνη का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘धार्मिकता’
  alternative: ‘न्याय’ अथवा ‘जो परमेश्वर की दृष्टि में सही है’
  rationale: शब्द व्यक्तिगत सदाचार तक सीमित नहीं है; उसमें न्याय और परमेश्वर की इच्छा के अनुरूप सही व्यवस्था भी शामिल हो सकती है। इसलिए मुख्य पाठ में स्थापित व्यापक धार्मिक शब्द रखा गया है, पर वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: χορτασθήσονται में अप्रकट कर्ता
  choice: ‘तृप्त किए जाएँगे’
  alternative: ‘तृप्त होंगे’
  rationale: कर्मवाच्य यूनानी रूप को सुरक्षित रखता है और इस सम्भावना को खुला रखता है कि तृप्त करने वाला परमेश्वर है, बिना उसका नाम मूल पाठ में जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मौखिक पाठ के योग्य शैली। ‘धन्य’ और ‘धार्मिकता’ जैसे परिचित बाइबलीय शब्द रखे गए हैं, जबकि वाक्य-विन्यास साधारण पाठक के लिए स्पष्ट है।
