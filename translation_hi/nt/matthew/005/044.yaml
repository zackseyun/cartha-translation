source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: hi
  text: 'पर मैं तुमसे कहता हूँ: अपने शत्रुओं से प्रेम करो और जो तुम्हें सताते हैं, उनके लिए[a] प्रार्थना करो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके हित में।”
    reason: ὑπέρ यहाँ प्रार्थना के लाभार्थी अथवा हितकारी पक्ष का भाव व्यक्त कर सकता है; मुख्य पाठ में अधिक स्वाभाविक ‘के लिए’ रखा गया है।
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: पर मैं तुमसे कहता हूँ
  rationale: ‘पर’ पिछले कथन के साथ δέ का विरोध बनाए रखता है, और व्यक्त सर्वनाम ‘मैं’ ἐγώ के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀγαπᾶτε
  choice: प्रेम करो
  rationale: आज्ञार्थक भाव को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है; वर्तमान काल के पक्ष को अलग शब्द जोड़कर अनावश्यक रूप से विस्तृत नहीं किया गया।
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: अपने शत्रुओं से
  rationale: ‘अपने’ हिन्दी में कर्ता से संबंध स्पष्ट करता है, और ‘शत्रु’ ἐχθρός की संबंधपरक शत्रुता को बिना नरम किए सुरक्षित रखता है।
- source_word: προσεύχεσθε
  choice: प्रार्थना करो
  rationale: प्रार्थना करने की आज्ञा का मानक, स्वाभाविक हिन्दी रूप है।
- source_word: ὑπὲρ
  choice: के लिए
  rationale: इस प्रसंग में संबंधकारक के साथ ὑπέρ किसी के हित में अथवा उसकी ओर से प्रार्थना करने का भाव रखता है; मुख्य पाठ में ‘के लिए’ सर्वाधिक स्वाभाविक है।
- source_word: τῶν διωκόντων ὑμᾶς
  choice: जो तुम्हें सताते हैं
  rationale: संज्ञात्मक वर्तमान कृदन्त के जारी अथवा सामान्य व्यवहार को क्रियात्मक रूप में बनाए रखता है और हिन्दी में सहज है।
theological_decisions:
- issue: शत्रुओं के प्रति आज्ञा का दायरा
  choice: प्रेम करने और सताने वालों के लिए प्रार्थना करने—दोनों आज्ञाओं को बिना व्याख्यात्मक विस्तार के सीधे रखा गया है।
  alternative: ‘प्रेम’ को केवल हितकारी कर्म के रूप में स्पष्ट करना, या प्रार्थना को विशेष रूप से आशीष अथवा मन-परिवर्तन की प्रार्थना बताना।
  rationale: यूनानी पाठ प्रेम और प्रार्थना की आज्ञा देता है, पर इस पद में उनके सभी व्यावहारिक या भावनात्मक आयाम परिभाषित नहीं करता; इसलिए अनुवाद उस धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, संक्षिप्त और गरिमापूर्ण शैली। ‘तुम’ बहुवचन श्रोताओं के लिए प्रयुक्त है और निकटवर्ती उपदेशात्मक संबोधन को बनाए रखता है।
