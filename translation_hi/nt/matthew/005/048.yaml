  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: hi
  text: इसलिए तुम सिद्ध[a] बनो, जैसे तुम्हारा स्वर्गीय पिता सिद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूर्ण,” “संपूर्ण,” अथवा “परिपक्व।” यूनानी शब्द τέλειος पूर्णता या परिपक्वता का भाव भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: बनो
  rationale: यह भविष्यत् रूप संदर्भ में आदेश या प्रबल आग्रह का काम करता है। हिंदी में ‘बनो’ उसके नैतिक आह्वान को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले पदों, विशेषकर शत्रुओं से प्रेम करने की शिक्षा, से निकला निष्कर्ष दिखाता है।
- source_word: ὑμεῖς
  choice: तुम
  rationale: यूनानी में सर्वनाम स्पष्ट रूप से आया है और बल देता है; हिंदी में ‘तुम’ को बनाए रखने से यह बल सहज रूप में व्यक्त होता है।
- source_word: τέλειοι / τέλειός
  choice: सिद्ध
  rationale: दोनों स्थानों पर एक ही शब्द रखकर शिष्यों के लिए आह्वान और पिता के गुण के बीच यूनानी की सीधी तुलना तथा पुनरुक्ति सुरक्षित रहती है। ‘सिद्ध’ पूर्णता का प्रबल नैतिक भाव देता है, जबकि अन्य संभव अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: ὡς
  choice: जैसे
  rationale: यह शिष्यों के लिए किए गए आह्वान की तुलना स्वर्गीय पिता से करता है।
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: तुम्हारा स्वर्गीय पिता
  rationale: यह संबंधसूचक और विशेषणयुक्त यूनानी पदबंध का स्वाभाविक हिंदी रूप है।
theological_decisions:
- issue: नैतिक आह्वान में τέλειος का अर्थ
  choice: मुख्य पाठ में ‘सिद्ध’
  alternative: ‘पूर्ण,’ ‘संपूर्ण,’ या ‘परिपक्व’
  rationale: तात्कालिक संदर्भ में यह शत्रुओं तक को समेटने वाले अखंड और पूर्ण प्रेम की ओर बुलाता है। ‘सिद्ध’ पद की तीक्ष्ण नैतिक शक्ति और पिता के साथ तुलना को बनाए रखता है; पाद-टिप्पणी उसकी व्यापक अर्थ-सीमा को सुरक्षित रखती है और पाठ को किसी एक व्यवस्थित धर्मवैज्ञानिक व्याख्या तक सीमित नहीं करती।
- issue: Ἔσεσθε की विधा
  choice: आज्ञार्थक ‘बनो’
  alternative: भविष्यसूचक ‘होओगे’
  rationale: रूप व्याकरणतः भविष्यत् है, पर इस उपदेशात्मक संदर्भ में वह आदेश या आह्वान की शक्ति रखता है। हिंदी का साधारण भविष्यत् रूप अनचाहे ढंग से इसे केवल भविष्यवाणी बना सकता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘इसलिए’ पूर्ववर्ती शिक्षा से तार्किक संबंध स्पष्ट करता है; ‘बनो’ आज्ञार्थक बल को स्वाभाविक रखता है।
