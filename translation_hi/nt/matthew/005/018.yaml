id: MAT.5.18
reference: Matthew 5:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: hi
  text: 'क्योंकि मैं तुमसे सच कहता हूँ: जब तक आकाश और पृथ्वी टल न जाएँ, तब तक व्यवस्था में से एक योता या एक छोटी-सी रेखा भी किसी भी तरह नहीं टलेगी, जब तक सब कुछ हो न जाए।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν
  choice: सच
  rationale: यीशु के कथन के आरम्भ में यह गंभीर और अधिकारपूर्ण पुष्टि है; ‘सच’ आधुनिक हिन्दी में स्वाभाविक रूप से उसका बल व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ उस संयोजक भूमिका को स्पष्ट रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: मूल की प्रत्यक्ष और अधिकारपूर्ण वाणी को सहज हिन्दी में बनाए रखता है।
- source_word: ἕως ἂν παρέλθῃ
  choice: जब तक ... टल न जाएँ
  rationale: παρέρχομαι के बीत जाने अथवा समाप्त हो जाने के भाव को ‘आकाश और पृथ्वी’ तथा ‘व्यवस्था’ दोनों के साथ संगत हिन्दी में व्यक्त करता है।
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: आकाश और पृथ्वी
  rationale: सृष्टि की समग्रता सूचित करने वाली इस जोड़ी का स्वाभाविक और प्रतिष्ठित हिन्दी रूप।
- source_word: ἰῶτα ἓν
  choice: एक भी योता
  rationale: मूल में सबसे छोटे यूनानी अक्षर का विशिष्ट नाम है; लिप्यंतरण उस ठोस लिखित-बिंब को बचाता है, और पादटिप्पणी अर्थ स्पष्ट करती है।
- source_word: μία κεραία
  choice: एक भी छोटी रेखा
  rationale: यह अक्षर की बहुत छोटी रेखा या चिह्न को दर्शाता है; यह रूप आधुनिक पाठक के लिए समझने योग्य है।
- source_word: οὐ μὴ παρέλθῃ
  choice: किसी रीति से न टलेगी
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को औपचारिक किंतु स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀπὸ τοῦ νόμου
  choice: व्यवस्था में से
  rationale: संदर्भ में νόμος परमेश्वर की शास्त्रीय व्यवस्था की ओर संकेत करता है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में परिचित है और केवल सामान्य कानूनी सिद्धांत तक सीमित नहीं करता।
- source_word: ἕως ἂν πάντα γένηται
  choice: जब तक सब कुछ हो न जाए
  rationale: γίνομαι के ‘घटित होना/हो जाना’ भाव को व्यापक रखता है और इसे केवल ‘पूरा किया जाना’ अर्थ में संकीर्ण नहीं करता।
theological_decisions:
- issue: νόμος का संदर्भ
  choice: ‘व्यवस्था’—परमेश्वर की शास्त्रीय व्यवस्था
  alternative: विशेषतः तोराह/मूसा की पाँच पुस्तकें, अथवा विस्तार से समूचा पुराना नियम
  rationale: मत्ती 5:17–19 में ‘व्यवस्था और भविष्यद्वक्ता’ का प्रसंग शास्त्रीय अर्थ को स्पष्ट करता है, पर अनुवाद यूनानी शब्द से अधिक संकीर्ण या व्यापक सीमा निर्धारित नहीं करता।
- issue: πάντα γένηται का अर्थ
  choice: ‘सब कुछ हो न जाए’
  alternative: ‘सब कुछ पूरा न हो जाए’ अथवा ‘सब कुछ घटित न हो जाए’
  rationale: वाक्यांश में घटित होने और पूर्णता तक पहुँचने, दोनों की अर्थ-संभावना है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी पूर्णता वाले अर्थ को सामने लाती है।
- issue: व्यवस्था के अक्षर और छोटी रेखा का स्थायित्व
  choice: प्रबल निषेध को ‘किसी रीति से न टलेगी’ द्वारा व्यक्त किया
  alternative: ‘कदापि न टलेगी’
  rationale: यह मूल के οὐ μή का जोर सुरक्षित रखता है, बिना इस पद से व्यवस्था की अवधि के विषय में किसी विशेष धर्मवैज्ञानिक प्रणाली का अतिरिक्त निष्कर्ष जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, मौखिक रूप से सुबोध शैली अपनाई गई है। ‘योता’ मूल के विशिष्ट लिखित-बिंब को बचाता है; उसकी अपरिचितता पादटिप्पणी से दूर की गई है। ‘किसी रीति से’ प्रबल निषेध को स्पष्ट करता है, और अंतिम उपवाक्य की वास्तविक अर्थगत व्यापकता बनाए रखी गई है।
