  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: hi
  text: जनसमूहों को देखकर[a] वह पहाड़ पर चढ़ गया[b]; और जब वह बैठ गया[c], तो उसके शिष्य उसके पास आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उसने जनसमूहों को देखा, तब वह पहाड़ पर चढ़ गया।”
    reason: कृदंत के समयगत संबंध को पूर्ण उपवाक्य के रूप में भी व्यक्त किया जा सकता है।
  - marker: b
    text: या, “वह पहाड़ के ऊपर गया।”
    reason: यूनानी पदबंध ऊपर की ओर गति और पहाड़ पर पहुँचने—दोनों का भाव दे सकता है।
  - marker: c
    text: या, “उसके बैठ जाने के बाद।” यूनानी में यहाँ संबंधकारक निरपेक्ष रचना है।
    reason: यह रचना समयगत परिस्थिति बताती है; इसे अपेक्षाकृत स्पष्ट पूर्वकालिक क्रम के रूप में भी समझा जा सकता है।
lexical_decisions:
- source_word: Ἰδὼν
  choice: देखकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया की परिस्थिति बताता है। ‘देखकर’ संक्षिप्त और स्वाभाविक है तथा समय-संबंध को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: δὲ
  choice: प्रत्यक्ष अनुवाद नहीं किया गया
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है। हिंदी में इसे अलग शब्द से व्यक्त करने पर अनावश्यक बल आता; वाक्य-प्रवाह स्वयं संक्रमण स्पष्ट करता है।
- source_word: τοὺς ὄχλους
  choice: भीड़ों को
  rationale: मूल शब्द बहुवचन है। ‘भीड़ों’ हिंदी में कुछ कम प्रचलित होते हुए भी अलग-अलग एकत्र जनसमूहों के बहुवचन को सुरक्षित रखता है; एकवचन ‘भीड़’ मूल की संख्या को समतल कर देता।
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: पहाड़ पर चढ़ गया
  rationale: यह पदबंध ऊपर की ओर जाकर पहाड़ पर पहुँचने को व्यक्त करता है। ‘पहाड़ पर चढ़ गया’ आधुनिक हिंदी में सहज है और गति तथा स्थान दोनों का भाव देता है।
- source_word: τὸ ὄρος
  choice: पहाड़
  rationale: ὄρος का सीधा अर्थ पहाड़ है। निश्चित लेख को हिंदी में अलग शब्द देकर दिखाना स्वाभाविक नहीं; प्रसंग में ‘पहाड़’ पर्याप्त रूप से निश्चित समझा जाता है।
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: और जब वह बैठ गया
  rationale: यह संबंधकारक निरपेक्ष रचना अगली क्रिया की समयगत परिस्थिति बताती है। ‘जब’ संबंध को स्वाभाविक रूप से रखता है, बिना उसे कठोरता से केवल ‘बाद में’ ठहराए।
- source_word: προσῆλθαν αὐτῷ
  choice: उसके पास आए
  rationale: προσέρχομαι का अर्थ किसी के पास आना या निकट जाना है। चुना हुआ रूप सरल, स्वाभाविक और कथात्मक प्रसंग के अनुकूल है।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: उसके शिष्य
  rationale: μαθηταί शिक्षक से सीखने और उसका अनुसरण करने वालों को दर्शाता है। ‘शिष्य’ आधुनिक मानक हिंदी में स्पष्ट, प्रतिष्ठित और संप्रदाय-निरपेक्ष शब्द है।
theological_decisions:
- issue: τὸ ὄρος के निश्चित लेख का निरूपण
  choice: पहाड़
  alternative: एक पहाड़; पहाड़ी
  rationale: मूल में निश्चित लेख है, पर हिंदी में निश्चितता के लिए अलग लेख नहीं होता। ‘पहाड़’ मूल संज्ञा को सुरक्षित रखता है और किसी अनाम ‘एक पहाड़’ का भाव जोड़ने से बचता है, फिर भी किसी विशेष नामित पहाड़ की पहचान नहीं थोपता।
- issue: καθίσαντος αὐτοῦ का समयगत संबंध
  choice: जब वह बैठ गया
  alternative: उसके बैठ जाने के बाद
  rationale: रचना समय या साथ की परिस्थिति बता सकती है। ‘जब’ घटनाक्रम को बनाए रखता है, पर बैठने की क्रिया को किसी विशेष औपचारिक या धार्मिक शिक्षण-मुद्रा के रूप में नहीं समझाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिंदी अपनाई गई है। ‘भीड़ों’ से मूल का बहुवचन सुरक्षित रखा गया है, जबकि ‘शिष्य’ सामान्य पाठक के लिए स्पष्ट और संप्रदाय-निरपेक्ष है। सर्वनाम एकवचन में रखे गए हैं ताकि यूनानी कथन की संख्या और संदर्भ स्पष्ट रहें।
