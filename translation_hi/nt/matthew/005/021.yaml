  verdict: revise
  source_fidelity: The draft correctly renders the discourse formula, passive ‘was said,’ the recipient sense of τοῖς ἀρχαίοις, and φονεύω as ‘murder.’ However, ‘न्याय के योग्य ठहरेगा’ means ‘will be worthy of judgment’ and does not adequately convey ἔνοχος, namely legal liability or accountability to judgment.
  naturalness: The wording is generally clear and appropriately formal. ‘पुराने समय के लोगों’ is understandable but somewhat cumbersome; ‘पूर्वकाल के लोगों’ is more concise and idiomatic in this context. ‘न्याय के अधीन होगा’ is natural and retains the intended judicial sense.
  terminology: ‘हत्या’ appropriately distinguishes φονεύω from the broader ‘मारना.’ ‘न्याय के अधीन होगा’ preserves κρίσις as judicial judgment without identifying a particular court or importing final-judgment terminology.
  issues:
  - severity: medium
    issue: ‘न्याय के योग्य ठहरेगा’ weakens the legal force of ἔνοχος ἔσται τῇ κρίσει.
    rationale: ἔνοχος denotes being liable, answerable, or subject to a judicial consequence. Being ‘worthy of judgment’ can imply merely deserving evaluation rather than being legally liable to it.
  - severity: low
    issue: ‘पुराने समय के लोगों से’ is somewhat heavy in modern Hindi.
    rationale: ‘पूर्वकाल के लोगों से’ conveys the same recipient sense of τοῖς ἀρχαίοις more idiomatically, while avoiding the potentially ancestral implication of ‘पूर्वजों से।’
