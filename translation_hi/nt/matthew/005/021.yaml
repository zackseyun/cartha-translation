  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: hi
  text: “तुम सुन चुके हो कि पूर्वकाल के लोगों से कहा गया था[a], ‘हत्या न करना[b]; और जो कोई हत्या करेगा, वह न्याय के अधीन होगा।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्राचीन लोगों से।”
    reason: lexical_alternative
  - marker: b
    text: परंपरागत अनुवादों में कभी-कभी “मारना” मिलता है, लेकिन यहाँ प्रयुक्त यूनानी क्रिया विशेष रूप से “हत्या करना” दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: तुम सुन चुके हो
  rationale: यह प्रवचन-सूत्र उस शिक्षा को दर्शाता है जिसे श्रोता पहले से सुनते आए हैं; पूर्णताबोधक हिन्दी वर्तमान प्रासंगिकता को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἐρρέθη
  choice: कहा गया था
  rationale: कर्मवाच्य रूप वक्ता की पहचान तय किए बिना यूनानी अभिव्यक्ति को सुरक्षित रखता है।
- source_word: τοῖς ἀρχαίοις
  choice: पुराने समय के लोगों से
  rationale: दत्तिव को कथन के प्राप्तकर्ताओं के रूप में व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है; ‘पूर्वजों से’ अनावश्यक वंशगत अर्थ दे सकता है।
- source_word: Οὐ φονεύσεις
  choice: हत्या न करना
  rationale: φονεύω सामान्य रूप से किसी को मारने के बजाय हत्या करने का बोध देता है; निषेध आज्ञार्थक हिन्दी में स्वाभाविक है।
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: जो कोई हत्या करेगा
  rationale: ἄν के साथ अनिश्चित सामान्य शर्त को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ἔνοχος ἔσται τῇ κρίσει
  choice: न्याय के योग्य ठहरेगा
  rationale: न्यायिक उत्तरदायित्व का भाव रखता है, पर κρίσις को किसी विशिष्ट मानवीय अदालत या अंतिम दण्ड के रूप में सीमित नहीं करता।
theological_decisions:
- issue: छठी आज्ञा में φονεύω का अर्थ
  choice: हत्या
  alternative: मारना
  rationale: यूनानी क्रिया अवैध मानव-वध/हत्या का विशिष्ट अर्थ रखती है; ‘मारना’ सभी प्रकार के प्राण लेने का अधिक व्यापक अर्थ दे सकता है।
- issue: τῇ κρίσει की प्रकृति
  choice: न्याय
  alternative: अदालत
  rationale: मूल शब्द न्यायिक निर्णय को सूचित करता है, पर यहाँ किसी खास संस्था को निश्चित नहीं करता; इसलिए मूल की व्यापकता और संभावित अस्पष्टता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए प्रसंगानुकूल बहुवचन ‘तुम’; भाषा सरल, गरिमापूर्ण और कानूनी भाव को बनाए रखने वाली है। उद्धरण को आज्ञा और उसके न्यायिक परिणाम की एक संयुक्त इकाई के रूप में अर्धविराम से प्रस्तुत किया गया है।
