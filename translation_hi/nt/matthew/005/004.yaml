  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: hi
  text: धन्य हैं वे जो शोक करते हैं[a], क्योंकि उन्हें सांत्वना दी जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो दुःखी होकर विलाप करते हैं।’ यूनानी शब्द व्यापक है और यह नहीं बताता कि शोक किस कारण से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: धन्य हैं
  rationale: यह मसीह के धन्य-वचनों की मूल्यांकनात्मक और परमेश्वर-संबंधी गहराई बनाए रखता है; ‘सुखी’ इसे केवल मन की वर्तमान अनुभूति तक सीमित कर सकता है।
- source_word: οἱ πενθοῦντες
  choice: वे जो शोक करते हैं
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत को स्वाभाविक हिन्दी में बहुवचन समूह के रूप में व्यक्त किया गया है। ‘शोक करते हैं’ दुःख, हानि, पाप या दमन में से किसी एक कारण को निश्चित नहीं करता।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह धन्य होने का कारण या आधार प्रस्तुत करने वाले यूनानी संबंधबोध को आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: αὐτοὶ
  choice: उन्हें
  rationale: यूनानी सर्वनाम में कुछ बल है, पर ‘उन्हीं को’ हिन्दी में अनावश्यक रूप से बहिष्कारी अर्थ दे सकता है। वाक्य की रचना अपेक्षित बल को पर्याप्त रूप से व्यक्त करती है।
- source_word: παρακληθήσονται
  choice: सांत्वना दी जाएगी
  rationale: भविष्यत् कर्मवाच्य को बनाए रखते हुए यह इस प्रसंग में सांत्वना प्राप्त करने का स्वाभाविक अर्थ देता है और सांत्वना देने वाले को पाठ से अधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: धन्य-वचन में शोक का दायरा
  choice: ‘वे जो शोक करते हैं’ कहकर शोक के कारण को अनिर्दिष्ट और व्यापक रखा गया है।
  alternative: इसे केवल पाप पर शोक, सामान्य व्यक्तिगत दुःख, अथवा इस्राएल की दशा पर विलाप के रूप में सीमित करना।
  rationale: यूनानी पाठ शोक का कारण नहीं बताता। व्यापक अनुवाद इस कथन की धार्मिक और मानवीय खुली अर्थ-सीमा को सुरक्षित रखता है।
- issue: सांत्वना देने वाले की पहचान
  choice: कर्मवाच्य ‘सांत्वना दी जाएगी’ रखा गया है।
  alternative: ‘परमेश्वर उन्हें सांत्वना देगा।’
  rationale: यहाँ कर्ता स्पष्ट रूप से नहीं दिया गया है; परमेश्वर निहित हो सकते हैं, पर अनुवाद में उनका नाम जोड़ना मूल की अप्रत्यक्षता को समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘धन्य हैं’ स्थापित बाइबलीय अभिव्यक्ति है, जबकि शेष वाक्य सहज वर्तमान हिन्दी में है।
