id: MAT.5.11
reference: Matthew 5:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: hi
  text: धन्य हो तुम, जब लोग मेरे कारण[c] तुम्हारा अपमान करें[a], तुम्हें सताएँ और झूठ बोलकर तुम्हारे विरुद्ध हर प्रकार की बुरी बात कहें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें बुरा-भला कहें।”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारे विरुद्ध हर बुरी बात कहें।”
    reason: lexical_alternative
  - marker: c
    text: या, “मेरी खातिर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: धन्य हो तुम
  rationale: यह मत्ती के धन्य-वचनों की परिचित और धर्मवैचारिक रूप से सार्थक अभिव्यक्ति को बनाए रखता है; ‘भाग्यशाली’ यहाँ अत्यधिक लौकिक अर्थ दे सकता है।
- source_word: ὅταν
  choice: जब
  rationale: यह अनिश्चित भावी परिस्थिति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और प्रसंग में सामान्य रूप से घट सकने वाली स्थिति को खुला रखता है।
- source_word: ὀνειδίσωσιν
  choice: तुम्हारा अपमान करें
  rationale: यह मौखिक तिरस्कार और दुर्वचन का अर्थ सामान्य पाठक के लिए स्पष्ट रूप से व्यक्त करता है।
- source_word: διώξωσιν
  choice: तुम्हें सताएँ
  rationale: यह यीशु से संबंध के कारण होने वाले व्यापक शत्रुतापूर्ण व्यवहार को व्यक्त करता है और उसे केवल शारीरिक हिंसा तक सीमित नहीं करता।
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: तुम्हारे विरुद्ध हर प्रकार की बुरी बात कहें
  rationale: यह व्यापक और दुर्भावनापूर्ण आरोपों की अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है; κατά के विरोधात्मक अर्थ को ‘विरुद्ध’ व्यक्त करता है।
- source_word: ψευδόμενοι
  choice: झूठ बोलकर
  rationale: यह क्रियाविशेषणात्मक रूप में स्पष्ट करता है कि कही गई बुरी बातें असत्य हैं।
- source_word: ἕνεκεν ἐμοῦ
  choice: मेरे कारण
  rationale: यह विरोध का कारण यीशु से संबंध होना सीधे और समकालीन हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: वर्णित विरोध का स्वरूप
  choice: यह पद यीशु के कारण सहा गया मौखिक अपमान, व्यापक उत्पीड़न और झूठे दुर्भावनापूर्ण कथन—तीनों प्रस्तुत करता है।
  alternative: ‘सताएँ’ को केवल शारीरिक हिंसा तक या पूरे विरोध को केवल बदनामी तक सीमित समझना।
  rationale: तीनों समन्वित क्रियाएँ विरोध के अलग-अलग किंतु परस्पर जुड़े रूप बताती हैं; अनुवाद उनकी व्यापकता को बनाए रखता है।
- issue: ἕνεκεν ἐμοῦ का संबंध
  choice: ‘मेरे कारण’ को आरंभिक उपवाक्य में रखकर पूरे वर्णित विरोध का कारण यीशु को माना गया है।
  alternative: इसे केवल अंतिम झूठे कथनों से जोड़ना।
  rationale: यूनानी में वाक्य के अंत में आया कारणसूचक पद स्वाभाविक रूप से समूची शृंखला पर लागू हो सकता है; हिन्दी में इसे पहले रखने से वही व्यापक संबंध स्पष्ट और सहज बनता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। ‘धन्य हो तुम’ धन्य-वचन की साहित्यिक पहचान बनाए रखता है, जबकि शेष वाक्य सामान्य आधुनिक प्रयोग में है।
