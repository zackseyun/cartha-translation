id: MAT.5.39
reference: Matthew 5:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: hi
  text: 'पर मैं तुमसे कहता हूँ: बुरे व्यक्ति का विरोध मत करो।[a] बल्कि, यदि कोई तुम्हारे दाहिने गाल पर थप्पड़ मारे, तो दूसरा गाल भी उसकी ओर कर दो।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुराई का विरोध मत करो”; अथवा, “उस दुष्ट का विरोध मत करो।”
    reason: τῷ πονηρῷ व्याकरण की दृष्टि से निराकार, सामान्य मानवीय, या विशिष्ट व्यक्तिगत अर्थ दे सकता है।
  - marker: b
    text: शाब्दिक रूप से, “उसकी ओर दूसरा भी कर दो”; प्रसंग से आशय दूसरे गाल से है।
    reason: यूनानी में दूसरी बार ‘गाल’ शब्द नहीं दोहराया गया, बल्कि संदर्भ से समझा जाता है।
lexical_decisions:
- source_word: μὴ ἀντιστῆναι
  choice: विरोध मत करो
  rationale: ἀνθίστημι का मूल भाव किसी के विरुद्ध खड़े होने या उसका प्रतिरोध करने का है। ‘विरोध मत करो’ इस व्यापक अर्थ को बनाए रखता है और इसे केवल कानूनी प्रतिरोध या बदला लेने तक सीमित नहीं करता।
- source_word: τῷ πονηρῷ
  choice: बुरे व्यक्ति का
  rationale: सविशेषण पद व्याकरण की दृष्टि से ‘बुराई’, ‘बुरा व्यक्ति’, या ‘उस दुष्ट’ का संकेत दे सकता है। आगे किसी थप्पड़ मारने वाले व्यक्ति का उदाहरण होने के कारण मुख्य पाठ में मानवीय कर्ता उपयुक्त है, जबकि अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: ῥαπίζει
  choice: थप्पड़ मारे
  rationale: ῥαπίζω हाथ से प्रहार करने, विशेषकर थप्पड़ मारने, को व्यक्त करता है। गाल के संदर्भ में ‘थप्पड़ मारे’ स्वाभाविक है और अपमान के भाव को भी बनाए रखता है।
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: दाहिने गाल पर
  rationale: σιαγών का अर्थ जबड़ा या गाल हो सकता है; थप्पड़ के संदर्भ में आधुनिक हिन्दी में ‘गाल’ अधिक स्वाभाविक है।
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: दूसरा गाल भी उसकी ओर कर दो
  rationale: στρέφω का सीधा अर्थ ‘मोड़ना/ओर करना’ है। ‘उसकी ओर कर दो’ यूनानी क्रिया के निकट रहते हुए हिन्दी में स्वाभाविक है और ‘पेश कर दो’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: ὅστις
  choice: यदि कोई
  rationale: इस शर्त-सदृश रचना में ‘यदि कोई’ अनिश्चित व्यक्ति का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: पर मैं तुमसे कहता हूँ
  rationale: यह वाक्यांश पहले कही गई बात से यीशु की शिक्षा का विरोधात्मक संबंध दिखाता है। ‘पर’ δέ के विरोधात्मक भाव को और ‘मैं तुमसे कहता हूँ’ मूल संरचना को सुरक्षित रखता है।
theological_decisions:
- issue: τῷ πονηρῷ का आशय
  choice: 'सामान्य मानवीय अर्थ: ‘बुरे व्यक्ति’'
  alternative: 'निराकार अर्थ: ‘बुराई’; विशिष्ट व्यक्तिगत अर्थ: ‘उस दुष्ट’'
  rationale: पद वास्तव में अस्पष्ट है। निकटवर्ती उदाहरण एक अपमान करने वाले मनुष्य से संबंधित है, इसलिए मुख्य पाठ में मानवीय अर्थ रखा गया है; फिर भी निराकार या विशेष दुष्ट सत्ता वाले अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुमसे’ सामान्य बहुवचन संबोधन के रूप में प्रयुक्त है। मुख्य पाठ में व्याख्यात्मक विस्तार न्यूनतम रखा गया है और वास्तविक स्रोतगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
