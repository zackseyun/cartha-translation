id: MAT.26.51
reference: Matthew 26:51
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s servant, and cut off his ear.
translation:
  language: hi
  text: और देखो, यीशु के साथ जो लोग थे, उनमें से एक ने हाथ बढ़ाकर अपनी तलवार खींची, महायाजक के दास[a] पर वार किया और उसका कान काट डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवक”।
    reason: δοῦλος के लिए अधिक सामान्य किन्तु सामाजिक स्थिति को कुछ नरम करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह कथात्मक संकेत घटना की अचानकता और सजीवता बनाए रखता है तथा आधुनिक हिन्दी में सहज है।
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: यीशु के साथ वालों में से एक
  rationale: यह अंशात्मक रचना को स्वाभाविक हिन्दी में व्यक्त करता है और व्यक्ति की पहचान को मूल पाठ से अधिक स्पष्ट नहीं करता।
- source_word: ἐκτείνας τὴν χεῖρα
  choice: हाथ बढ़ाकर
  rationale: पूर्ववर्ती शारीरिक क्रिया को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: अपनी तलवार खींची
  rationale: हथियार निकालने की क्रिया का सटीक और मुहावरेदार अनुवाद है; αὐτοῦ का सम्बन्ध कर्ता से स्वाभाविक रूप से 'अपनी' द्वारा व्यक्त होता है।
- source_word: μάχαιραν
  choice: तलवार
  rationale: शब्द छोटी तलवार या बड़े चाकू को सूचित कर सकता है, पर यहाँ 'तलवार' पर्याप्त सटीक है और अनावश्यक विशिष्टता से बचता है।
- source_word: πατάξας
  choice: वार करके
  rationale: हथियार से किए गए हिंसक प्रहार को प्रसंगानुकूल और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δοῦλον
  choice: दास
  rationale: यह व्यक्ति की अधीन और बंधुआ सामाजिक स्थिति को 'सेवक' की अपेक्षा अधिक सीधे रूप में सुरक्षित रखता है।
- source_word: ἀρχιερέως
  choice: महायाजक
  rationale: एकवचन ἀρχιερεύς के लिए प्रचलित और प्रसंगानुकूल हिन्दी पद है।
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: उसका कान काट डाला
  rationale: यूनानी में शाब्दिक भाव 'कान अलग कर दिया' है; तलवार के वार के परिणाम को हिन्दी में 'काट डाला' स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὠτίον
  choice: कान
  rationale: लघुरूप होने पर भी यहाँ सामान्य अर्थ 'कान' ही है; 'कान की लौ' कहना मूल से अधिक विशिष्ट होगा।
theological_decisions:
- issue: सामाजिक रूप से ठोस प्रसंग में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: गिरफ्तारी के इस प्रसंग में शब्द महायाजक के अधीन व्यक्ति की सामाजिक स्थिति बताता है। 'दास' उस वास्तविकता को नरम किए बिना व्यक्त करता है, जबकि पाठक-सहायता हेतु 'सेवक' को पादटिप्पणी में विकल्प दिया गया है।
translation_notes:
  register: आधुनिक, सजीव और गरिमापूर्ण कथात्मक हिन्दी। 'और देखो' से मत्ती की आकस्मिक कथात्मक गति बनी रहती है; क्रियाओं का क्रम यूनानी पाठ के अनुरूप स्पष्ट रखा गया है।
