id: MAT.26.27
reference: Matthew 26:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: hi
  text: और उसने एक प्याला लिया और धन्यवाद देकर उन्हें दिया और कहा, “तुम सब इसमें से पियो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: लिया
  rationale: यूनानी में यह मुख्य क्रिया से पहले का एओरिस्ट कृदंत है। हिन्दी में क्रमबद्ध क्रिया ‘लिया ... देकर ... दिया’ उसके पूर्वकालिक संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करती है।
- source_word: ποτήριον
  choice: एक प्याला
  rationale: यूनानी संज्ञा के साथ लेख नहीं है; इसलिए ‘एक प्याला’ उसके रूप को सुरक्षित रखता है, यद्यपि भोज के प्रसंग में ‘प्याला’ भी संभव है।
- source_word: εὐχαριστήσας
  choice: धन्यवाद देकर
  rationale: यह मुख्य क्रिया से पहले हुई धन्यवाद की क्रिया बताता है। यह सहज हिन्दी है और ‘आशीष दी’ जैसे अर्थ को पाठ में नहीं जोड़ता।
- source_word: ἔδωκεν αὐτοῖς
  choice: उन्हें दिया
  rationale: सम्प्रदान αὐτοῖς का सीधा अर्थ ‘उन्हें’ है; प्याला संदर्भ से स्पष्ट होने के कारण अलग सर्वनाम आवश्यक नहीं।
- source_word: λέγων
  choice: और कहा
  rationale: शाब्दिक ‘कहते हुए’ की अपेक्षा हिन्दी कथा-शैली में ‘और कहा’ स्वाभाविक है और प्रत्यक्ष वचन का वही संबंध व्यक्त करता है।
- source_word: Πίετε
  choice: पियो
  rationale: बहुवचन आज्ञार्थ को आधुनिक मानक हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: ἐξ αὐτοῦ
  choice: इसमें से
  rationale: ἐξ स्रोत को सूचित करता है। प्याले के लिए हिन्दी में ‘इसमें से पियो’ स्वाभाविक है और ‘पूरा पी जाओ’ जैसा मात्रात्मक अर्थ नहीं देता।
- source_word: πάντες
  choice: तुम सब
  rationale: यह आज्ञा के संबोधित पूरे समूह को दर्शाता है; ‘तुम सब’ स्पष्ट करता है कि बात प्रत्येक उपस्थित शिष्य से कही गई है।
theological_decisions:
- issue: εὐχαριστήσας के संभावित प्रभुभोज-संबंधी निहितार्थ
  choice: धन्यवाद देकर
  alternative: आशीष देकर
  rationale: क्रिया का मूल अर्थ धन्यवाद देना है। यह चयन बाद की संस्कार-विषयक शब्दावली को कथा में जोड़े बिना मूल अर्थ सुरक्षित रखता है।
- issue: πάντες का संबंध
  choice: तुम सब
  alternative: सब कुछ
  rationale: यूनानी व्याकरण में πάντες आज्ञार्थ क्रिया के निहित बहुवचन कर्ता, अर्थात संबोधित लोगों, को स्पष्ट करता है; यह प्याले की पूरी मात्रा पीने का आदेश नहीं है।
- issue: ποτήριον की निश्चितता
  choice: एक प्याला
  alternative: प्याला
  rationale: लेखरहित यूनानी रूप को मुख्य पाठ में दर्शाया गया है, जबकि यह स्वीकार किया गया है कि भोज का प्रसंग संदर्भित प्याले को निश्चित समझने की गुंजाइश देता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य की क्रमबद्ध क्रियाएँ यूनानी कृदंतों और मुख्य क्रिया का कालानुक्रमिक संबंध स्वाभाविक हिन्दी में व्यक्त करती हैं।
