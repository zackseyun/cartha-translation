- from: फिर उसने एक प्याला लिया और धन्यवाद देकर उन्हें दिया और कहा, “तुम सब इसमें से पियो।”
  to: और उसने एक प्याला लिया और धन्यवाद देकर उन्हें दिया और कहा, “तुम सब इसमें से पियो।”
  rationale: 'A minimal revision replaces “फिर” with “और” for closer fidelity to καί. No footnotes are needed in Hindi for this verse: the potentially relevant distinctions are adequately represented in the main text, and no source ambiguity requires annotation.'
