id: MAT.26.24
reference: Matthew 26:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: hi
  text: मनुष्य का पुत्र तो जा रहा है, जैसा उसके विषय में लिखा है; पर हाय उस मनुष्य पर, जिसके द्वारा मनुष्य का पुत्र पकड़वाया जाता है[a]! उस मनुष्य के लिए अच्छा होता कि वह जन्मा ही न होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सौंपा जाता है।” यूनानी क्रिया का अर्थ किसी को सौंपना भी हो सकता है और विश्वासघात करके पकड़वाना भी; यहाँ यहूदा का विश्वासघात प्रसंग में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र तो
  rationale: स्थापित उपाधि को बनाए रखते हुए μὲν को ‘तो’ से व्यक्त किया गया है, जिससे आगे δὲ के साथ विरोध स्वाभाविक रूप से उभरता है।
- source_word: ὑπάγει
  choice: जा रहा है
  rationale: वर्तमानकालीन क्रिया की गतिशीलता बनाए रखता है और इसे स्पष्ट रूप से केवल मृत्यु या प्रस्थान तक सीमित नहीं करता।
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: ठीक जैसा उसके विषय में लिखा है
  rationale: γέγραπται के पूर्ण होकर विद्यमान रहने वाले भाव को हिन्दी की प्रचलित शास्त्रीय अभिव्यक्ति ‘लिखा है’ स्वाभाविक ढंग से व्यक्त करती है।
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: पर हाय उस मनुष्य पर
  rationale: οὐαί की गंभीर भविष्यवाणी-सदृश चेतावनी और δὲ का विरोध दोनों सुरक्षित रहते हैं।
- source_word: δι’ οὗ
  choice: जिसके द्वारा
  rationale: διά के संबंधकारक के साथ साधन अथवा मानवीय माध्यम के अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: παραδίδοται
  choice: पकड़वाया जाता है
  rationale: इस प्रसंग में यह स्वाभाविक हिन्दी प्रयोग यहूदा के विश्वासघाती माध्यम से यीशु को अधिकारियों के हाथ सौंपे जाने—दोनों पहलुओं—को समेटता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: καλὸν ἦν αὐτῷ
  choice: उस मनुष्य के लिए अच्छा होता
  rationale: यूनानी के ‘अच्छा होता’ को बनाए रखकर अनुवाद में तुलनात्मक ‘बेहतर’ नहीं जोड़ा गया, यद्यपि कथन का आशय उसके लिए अधिक हितकर होने का है।
- source_word: εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: यदि वह जन्मा ही न होता
  rationale: अवास्तविक भूतकालीन शर्त को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ही’ कथन की तीव्रता देता है, बिना ‘कभी’ जैसा अतिरिक्त शब्द जोड़े।
theological_decisions:
- issue: पवित्रशास्त्र में लिखी योजना और विश्वासघाती की मानवीय जवाबदेही का संबंध
  choice: 'दोनों को साथ रखा गया है: मनुष्य का पुत्र लिखे हुए के अनुसार जाता है, फिर भी उसे पकड़वाने वाले पर हाय है।'
  alternative: ऐसा नियतिवादी पाठ जो मनुष्य की जवाबदेही घटा दे, अथवा ऐसा केवल मानवीय पाठ जो शास्त्रीय पूर्ति को कम कर दे।
  rationale: यूनानी पाठ दोनों सत्यों को बिना उनका दार्शनिक समाधान दिए साथ रखता है; हिन्दी भी उसी तनाव को सुरक्षित रखती है।
- issue: जन्म न लेने संबंधी अंतिम कथन का बल
  choice: इसे अत्यंत गंभीर न्याय-वचन के रूप में ज्यों का त्यों रखा गया है।
  alternative: इसे केवल अतिशयोक्ति मानना या इससे किसी विस्तृत दंड-सिद्धांत को सिद्ध करना।
  rationale: पाठ उस मनुष्य के लिए जन्म न लेना अच्छा होने की बात कहता है, पर इससे आगे कोई व्यवस्थित धर्मवैज्ञानिक निष्कर्ष स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘मनुष्य का पुत्र’ पारंपरिक और स्रोत-संगत उपाधि है। ‘पकड़वाया जाता है’ हिन्दी में विश्वासघात और अधिकारियों के हाथ सौंपे जाने, दोनों को स्वाभाविक रूप से व्यक्त करता है।
