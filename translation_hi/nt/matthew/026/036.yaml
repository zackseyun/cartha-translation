id: MAT.26.36
reference: Matthew 26:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: hi
  text: तब यीशु उनके साथ गतसमनी नामक एक स्थान पर आते हैं और चेलों से कहते हैं, “यहाँ बैठो, जब तक मैं वहाँ जाकर प्रार्थना करूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह अगले घटनाक्रम को जोड़ने वाला स्वाभाविक कालसूचक शब्द है।
- source_word: ἔρχεται
  choice: आते हैं
  rationale: मूल यूनानी के ऐतिहासिक वर्तमान को बनाए रखकर वर्णन की सजीवता सुरक्षित रखी गई है।
- source_word: μετ’ αὐτῶν
  choice: उनके साथ
  rationale: μετά के साथ होने या संगति के सीधे अर्थ को व्यक्त करता है।
- source_word: χωρίον
  choice: एक स्थान
  rationale: यह शब्द किसी जगह, भूखंड या संपत्ति को सूचित कर सकता है; ‘स्थान’ व्यापक और स्वाभाविक है तथा मत्ती के पाठ में न दिए गए ‘बगीचे’ के विवरण को नहीं जोड़ता।
- source_word: λεγόμενον Γεθσημανί
  choice: गतसमनी नामक
  rationale: स्थान के नाम को आधुनिक हिन्दी की स्वाभाविक नामसूचक रचना में दिया गया है और मूल नाम का लिप्यंतरण किया गया है।
- source_word: λέγει τοῖς μαθηταῖς
  choice: चेलों से कहते हैं
  rationale: ऐतिहासिक वर्तमान को बनाए रखा गया है; ‘चेले’ सामान्य पाठक के लिए परिचित और प्रसंगानुकूल है।
- source_word: Καθίσατε αὐτοῦ
  choice: यहाँ बैठो
  rationale: आज्ञार्थक क्रिया और स्थानवाचक क्रियाविशेषण का सीधा, सहज अनुवाद है।
- source_word: ἕως οὗ
  choice: जब तक
  rationale: मूल की समय-सीमा वाली रचना को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπελθὼν ἐκεῖ προσεύξωμαι
  choice: मैं वहाँ जाकर प्रार्थना करूँ
  rationale: यूनानी कृदंत से व्यक्त जाने और फिर प्रार्थना करने के क्रम को हिन्दी की सहज ‘जाकर’ रचना में सुरक्षित रखा गया है; ‘वहाँ’ का ‘यहाँ’ से स्थानगत विरोध भी बना रहता है।
theological_decisions:
- issue: गतसमनी के स्थान का स्वरूप
  choice: χωρίον का अनुवाद ‘स्थान’ किया गया है।
  alternative: ‘बगीचा’
  rationale: मत्ती यहाँ केवल एक स्थान या भूखंड का उल्लेख करता है। ‘बगीचा’ कहना यूहन्ना 18:1 की जानकारी को मत्ती के पद में आयात करेगा।
- issue: यीशु के निर्देश की समयगत रचना
  choice: ‘जब तक मैं वहाँ जाकर प्रार्थना करूँ’
  alternative: ‘जब मैं वहाँ जाकर प्रार्थना करूँ, तब तक’ अथवा ‘मेरे वहाँ जाकर प्रार्थना करने के दौरान’
  rationale: ‘जब तक’ ἕως οὗ के औपचारिक अर्थ और चेलों के अस्थायी रूप से वहीं बैठे रहने की बात—दोनों को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यूनानी के दोनों ऐतिहासिक वर्तमान रूपों को हिन्दी वर्तमान काल (‘आते हैं’, ‘कहते हैं’) में रखा गया है ताकि कथन की सजीवता बनी रहे।
