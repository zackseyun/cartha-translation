  source_fidelity: The draft accurately represents the Greek historical presents (ἔρχεται, λέγει) with Hindi present forms, preserves accompaniment, renders χωρίον broadly as ‘स्थान’ without importing ‘garden,’ and retains the contrast between αὐτοῦ (‘यहाँ’) and ἐκεῖ (‘वहाँ’). ‘जब तक’ faithfully reflects ἕως οὗ, while ‘जाकर प्रार्थना करूँ’ naturally conveys the prior going expressed by ἀπελθών.
  naturalness: The Hindi is modern, clear, and appropriately dignified. The direct speech, ‘यहाँ बैठो, जब तक मैं वहाँ जाकर प्रार्थना करूँ,’ is idiomatic and understandable without becoming paraphrastic.
