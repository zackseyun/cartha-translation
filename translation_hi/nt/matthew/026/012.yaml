source:
  edition: SBLGNT
  text: βαλοῦσα γὰρ αὕτη τὸ μύρον τοῦτο ἐπὶ τοῦ σώματός μου πρὸς τὸ ἐνταφιάσαι με ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: hi
  text: क्योंकि इस स्त्री ने यह सुगंधित तेल मेरे शरीर पर डालकर मुझे दफ़नाए जाने के लिए तैयार किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने यह मेरे दफ़न के लिए किया है।” यूनानी क्रिया में शरीर को दफ़न के लिए तैयार करने का भाव भी शामिल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: डालकर
  rationale: अओरिस्ट कृदंत यहाँ तेल को शरीर पर लगाने या उँडेलने की क्रिया बताता है; ‘डालकर’ मुख्य क्रिया के साथ उसके संबंध को सहज हिंदी में रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिंदी में इस व्याख्यात्मक संबंध को स्पष्ट करता है।
- source_word: αὕτη
  choice: इस स्त्री ने
  rationale: यूनानी संकेतवाचक सर्वनाम के स्त्रीलिंग संदर्भ और संकेतात्मक बल, दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: μύρον
  choice: सुगंधित तेल
  rationale: μύρον सुगंधयुक्त मरहम या तेल को दर्शाता है। ‘सुगंधित तेल’ आधुनिक पाठक के लिए स्पष्ट है और इसे केवल आधुनिक इत्र समझे जाने से बचाता है।
- source_word: ἐπὶ τοῦ σώματός μου
  choice: मेरे शरीर पर
  rationale: ἐπί के साथ संबंधकारक यहाँ सतह पर लगाए जाने का भाव देता है; इसका स्वाभाविक हिंदी रूप ‘मेरे शरीर पर’ है।
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: मुझे दफ़नाए जाने के लिए तैयार किया
  rationale: πρός और निश्चित कृदंत उद्देश्य बताते हैं, जबकि ἐνταφιάζω में शव को दफ़न के लिए तैयार करने का भाव सम्मिलित है। हिंदी में यह अर्थ स्पष्ट करने के लिए ‘दफ़नाए जाने के लिए तैयार’ चुना गया है।
- source_word: ἐποίησεν
  choice: किया है
  rationale: मुख्य क्रिया स्त्री के किए हुए कार्य को समेटती है। हिंदी में संयुक्त संरचना ‘तैयार किया है’ अनावश्यक पुनरुक्ति के बिना पूर्ण क्रिया व्यक्त करती है।
theological_decisions:
- issue: ἐνταφιάζω का अर्थ और यीशु की आगामी मृत्यु से उसका संबंध
  choice: स्त्री के कार्य को यीशु के दफ़न की तैयारी के रूप में प्रस्तुत किया गया है।
  alternative: इसे अधिक संक्षेप में ‘मेरे दफ़न के लिए’ कहा जा सकता है।
  rationale: क्रिया केवल दफ़नाने की घटना नहीं, बल्कि शव को दफ़न के लिए तैयार करने का भाव भी रखती है। यह अनुवाद यीशु की व्याख्या को सुरक्षित रखता है, बिना स्त्री की सचेत मंशा के बारे में अतिरिक्त दावा किए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘सुगंधित तेल’ सांस्कृतिक वस्तु को स्पष्ट करता है; ‘दफ़नाए जाने के लिए तैयार’ मूल क्रिया की अर्थ-छाया को व्यक्त करता है।
