  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι ἐν ταύτῃ τῇ νυκτὶ πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: hi
  text: यीशु ने उससे कहा, “मैं तुमसे सच कहता हूँ, इसी रात[a], मुर्गे के बाँग देने से पहले[b] तुम तीन बार मेरा इनकार करोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “इस रात में”; ‘इसी’ पर बल है। इसका अनुवाद “आज रात” भी हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “मुर्गे की बाँग से पहले” भी हो सकता है। यूनानी में यहाँ किसी एक विशेष मुर्गे का उल्लेख निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: यीशु ने उससे कहा
  rationale: सरल कथात्मक भूतकाल और अप्रत्यक्ष सर्वनाम को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: Ἀμὴν λέγω σοι
  choice: मैं तुमसे सच कहता हूँ
  rationale: यह यीशु के कथन की गंभीर और प्रामाणिक पुष्टि को स्पष्ट, प्रचलित हिन्दी में व्यक्त करता है; ‘आमीन’ को बिना अनुवाद छोड़े जाने से बचाता है।
- source_word: ἐν ταύτῃ τῇ νυκτὶ
  choice: आज इसी रात
  rationale: ‘आज रात’ समय को स्वाभाविक रूप से व्यक्त करता है और ‘इसी’ demonstrative ταύτῃ के बल को सुरक्षित रखता है।
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: मुर्गे के बाँग देने से पहले
  rationale: अनंत-क्रियात्मक यूनानी रचना को स्वाभाविक हिन्दी उपवाक्य में बदला गया है। यूनानी में संज्ञा निर्धारक-रहित है; हिन्दी का संबंधसूचक रूप सामान्य घटना या किसी मुर्गे की बाँग, दोनों के अनुकूल है।
- source_word: τρὶς
  choice: तीन बार
  rationale: आधुनिक हिन्दी में संख्या और आवृत्ति को सीधे व्यक्त करता है।
- source_word: ἀπαρνήσῃ με
  choice: तुम तीन बार मेरा इनकार करोगे
  rationale: ἀπαρνέομαι यहाँ यीशु से अपने संबंध या परिचय को नकारने का भाव रखता है। ‘मेरा इनकार करना’ प्रचलित बाइबलीय हिन्दी है और भविष्यवाची बल बनाए रखता है।
theological_decisions:
- issue: Ἀμὴν λέγω σοι का अनुवाद
  choice: मैं तुमसे सच कहता हूँ
  alternative: आमीन, मैं तुमसे कहता हूँ; मैं तुम्हें विश्वास दिलाता हूँ
  rationale: चुना हुआ रूप कथन की गंभीर पुष्टि और यीशु के प्रत्यक्ष अधिकार को बनाए रखता है, पर बाद की उपासना-पद्धति से जुड़े अर्थ को मुख्य पाठ में नहीं लाता।
- issue: ἀπαρνήσῃ με में इनकार का लक्ष्य
  choice: मेरा इनकार करोगे
  alternative: मुझे जानने से इनकार करोगे; मुझसे मुकर जाओगे
  rationale: मूल पाठ केवल ‘मेरा इनकार’ कहता है। अधिक व्याख्यात्मक विस्तार से बचते हुए संबंध-विच्छेद और अस्वीकार की अंतर्निहित तीव्रता खुली रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। ‘आज इसी रात’ मूल के समय-सूचक और बलवाचक दोनों पहलुओं को सहज हिन्दी में व्यक्त करता है। सर्वनाम संदर्भानुसार अनौपचारिक एकवचन ‘तुम’ है।
