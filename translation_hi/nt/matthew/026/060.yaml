    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὗρον
  choice: उन्हें कुछ नहीं मिला
  rationale: यूनानी में क्रिया का कर्म स्पष्ट नहीं है; पिछले पद के न्यायिक संदर्भ से आशय ऐसी गवाही या आरोप से है जो यीशु के विरुद्ध काम आ सके। हिंदी में ‘कुछ नहीं मिला’ इस निहित अर्थ को स्वाभाविक ढंग से बनाए रखता है।
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: हालाँकि बहुत-से झूठे गवाह सामने आए थे
  rationale: 'संबंधकारक निरपेक्ष रचना यहाँ रियायती अर्थ देती है: अनेक झूठे गवाहों के आने पर भी अपेक्षित गवाही नहीं मिली। न्यायिक संदर्भ में ψευδομάρτυρες का सटीक और सहज अनुवाद ‘झूठे गवाह’ है।'
- source_word: ὕστερον δὲ
  choice: लेकिन बाद में
  rationale: ὕστερον कार्यवाही में बाद के समय को सूचित करता है और δέ हल्का विरोध अथवा कथात्मक मोड़ प्रकट करता है।
- source_word: προσελθόντες δύο
  choice: दो गवाह सामने आए
  rationale: न्यायिक प्रसंग में προσέρχομαι के लिए ‘सामने आना’ स्वाभाविक है। ‘गवाह’ यूनानी विशेषण-संज्ञा के संदर्भ से पूरित है और हिंदी में अस्पष्टता से बचाता है।
