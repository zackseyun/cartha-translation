source:
  edition: SBLGNT
  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: hi
  text: और वह थोड़ा आगे जाकर मुँह के बल गिर पड़ा और प्रार्थना करते हुए कहा, “हे मेरे पिता, यदि हो सके, तो यह प्याला मुझसे टल जाए; फिर भी, जैसा मैं चाहता हूँ वैसा नहीं, बल्कि जैसा आप चाहते हैं वैसा ही हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यह प्याला’ बाइबल में किसी ठहराए हुए भाग, विशेषकर दुःख, का बिंब है; तुलना करें मत्ती 20:22 और 26:42।
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: थोड़ा आगे जाकर
  rationale: यह प्रयोग थोड़ी दूरी आगे बढ़ने को व्यक्त करता है; हिंदी में यह स्वाभाविक है और मूल के तुलनात्मक भाव को बनाए रखता है।
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: मुँह के बल गिर पड़ा
  rationale: यह दंडवत मुद्रा का सजीव वर्णन है और मूल यूनानी मुहावरे को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: προσευχόμενος καὶ λέγων
  choice: यह कहते हुए प्रार्थना करने लगा
  rationale: दोनों वर्तमान कृदंत मुख्य क्रिया के साथ चल रही क्रिया बताते हैं; हिंदी की स्वाभाविक कथात्मक शैली में इन्हें संयुक्त रूप से व्यक्त किया गया है।
- source_word: Πάτερ μου
  choice: हे मेरे पिता
  rationale: संबोधन में निकटता और आदर दोनों सुरक्षित रहते हैं; ‘हे’ प्रार्थना के गरिमापूर्ण संबोधन को स्पष्ट करता है।
- source_word: εἰ δυνατόν ἐστιν
  choice: यदि हो सके
  rationale: यह पूर्ण शर्तीय अर्थ को संक्षिप्त और स्वाभाविक हिंदी में रखता है, बिना किसी अनिर्दिष्ट विषय को जोड़ने के।
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: मुझसे टल जाए
  rationale: संदर्भ में प्याले के ‘पास से निकल जाने’ का भाव हिंदी में ‘टल जाए’ से स्वाभाविक रूप में आता है और विनती का अर्थ बनाए रखता है।
- source_word: τὸ ποτήριον τοῦτο
  choice: यह प्याला
  rationale: मूल रूपक को ज्यों का त्यों रखा गया है, ताकि ठहराए हुए भाग और विशेषकर दुःख से जुड़ी बाइबलीय प्रतिध्वनि बनी रहे।
- source_word: πλὴν
  choice: फिर भी
  rationale: यह पहले की विनती पर प्रबल योग्यता या विरोध व्यक्त करता है और आधुनिक हिंदी में सहज है।
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: जैसा मैं चाहता हूँ वैसा नहीं, बल्कि जैसा आप चाहते हैं वैसा ही हो
  rationale: θέλω के इच्छा-संबंधी अर्थ को स्पष्ट रखते हुए दूसरे खंड की यूनानी लोप-रचना को हिंदी में पूर्ण किया गया है; ‘वैसा ही हो’ प्रार्थना में निहित आशय स्पष्ट करता है।
theological_decisions:
- issue: यीशु की प्रार्थना में ‘प्याले’ का रूपक
  choice: मुख्य पाठ में शाब्दिक बिंब ‘यह प्याला’ रखा गया
  alternative: यह दुःख; यह नियत भाग
  rationale: ποτήριον रूपकात्मक होते हुए भी स्पष्टतः ‘प्याला’ है। इसे बनाए रखने से नियुक्त भाग, दुःख और न्याय से जुड़ी बाइबलीय गहराई सुरक्षित रहती है, जबकि मुख्य पाठ किसी एक व्याख्या को अंतिम नहीं बनाता।
- issue: यीशु की इच्छा और पिता की इच्छा का संबंध
  choice: दोनों पक्षों में चाहने की वास्तविकता को स्पष्ट रखा और अंत में ‘वैसा ही हो’ जोड़ा
  alternative: मेरी इच्छा नहीं, आपकी इच्छा पूरी हो
  rationale: वैकल्पिक रूप अधिक व्याख्यात्मक और अमूर्त है। चुना गया रूप यीशु की वास्तविक इच्छा तथा पिता के प्रति समर्पण के तनाव को सुरक्षित रखता है और यूनानी ὡς की ‘जैसा’ संरचना को दर्शाता है।
- issue: पिता के लिए संबोधन का स्तर
  choice: आप
  alternative: तू; तुम
  rationale: आधुनिक मानक हिंदी में ‘आप’ निकटता को मिटाए बिना प्रार्थनापूर्ण आदर व्यक्त करता है; मूल में संख्या या सामाजिक स्तर का ऐसा भेद नहीं है, इसलिए यह लक्ष्य-भाषा का पंजीय निर्णय है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु साधारण पाठक के लिए सहज। वाक्य में ‘मुँह के बल’ दंडवत मुद्रा को स्पष्ट करता है; इसलिए इसके लिए अलग पाठांतर-टिप्पणी आवश्यक नहीं मानी गई। मुख्य पाठ का [a] चिह्न संबंधित टिप्पणी के साथ उपस्थित है।
