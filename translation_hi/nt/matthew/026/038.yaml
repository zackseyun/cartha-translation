  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: hi
  text: तब वह उनसे कहता है, “मेरा प्राण अत्यन्त दुःखी[a] है, मृत्यु की हद तक[b]। तुम यहीं ठहरो और मेरे साथ जागते रहो[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत दुःखी,” “गहरे दुःखी,” या “शोक से अभिभूत।”
    reason: lexical_alternative
  - marker: b
    text: या “मृत्यु के बिन्दु तक” या “मरने की हद तक।”
    reason: lexical_alternative
  - marker: c
    text: या “मेरे साथ चौकस रहो।” यूनानी क्रिया में जागे रहने और सतर्क निगरानी करने—दोनों के भाव हो सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: घटनाक्रम में अगले क्षण को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: λέγει
  choice: कहता है
  rationale: यूनानी ऐतिहासिक वर्तमान की कथात्मक सजीवता बनाए रखी गई है।
- source_word: Περίλυπός
  choice: अत्यन्त दुःखी
  rationale: यह शब्द गहरे और चारों ओर से घेर लेने वाले शोक को व्यक्त करता है; हिन्दी में यह चयन तीव्रता को स्पष्ट और गरिमापूर्ण ढंग से रखता है।
- source_word: ἡ ψυχή μου
  choice: मेरा प्राण
  rationale: ψυχή के स्पष्ट संज्ञात्मक रूप को बचाता है और यीशु की गहरी आन्तरिक व्यथा व्यक्त करता है, बिना किसी तकनीकी मानव-विज्ञान को थोपे।
- source_word: ἕως θανάτου
  choice: यहाँ तक कि मृत्यु की सीमा तक
  rationale: शोक की चरम तीव्रता और ‘मृत्यु तक’ की वास्तविक अस्पष्टता को बनाए रखता है—अर्थात मृत्यु जितना अथवा मृत्यु के बिन्दु तक।
- source_word: μείνατε ὧδε
  choice: तुम यहीं ठहरो
  rationale: स्थान पर बने रहने की आज्ञा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: γρηγορεῖτε
  choice: जागते रहो
  rationale: गतसमनी के निकट सन्दर्भ में शाब्दिक रूप से न सोने की आज्ञा प्रमुख है, जबकि इसमें निहित सतर्कता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: μετ’ ἐμοῦ
  choice: मेरे साथ
  rationale: संगति या साथ रहने का सीधा अर्थ स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: यीशु के कथन में ψυχή का अनुवाद
  choice: मेरा प्राण
  alternative: मैं अत्यन्त दुःखी हूँ
  rationale: मूल पाठ की स्पष्ट संज्ञा को सर्वनाम में विलीन नहीं किया गया। इससे यीशु की सच्ची मानवीय आन्तरिक व्यथा पूर्ण बल के साथ सामने आती है, पर पाठ से आगे कोई विशिष्ट मानव-विज्ञान नहीं गढ़ा जाता।
- issue: γρηγορεῖτε का प्रसंगगत बल
  choice: जागते रहो
  alternative: चौकस रहो / पहरा देते रहो
  rationale: शिष्य आगे सचमुच सो जाते हैं, इसलिए जागे रहने का अर्थ अत्यन्त प्रत्यक्ष है; साथ ही क्रिया में सतर्क निगरानी का भाव भी हो सकता है, जिसे पादटिप्पणी में रखा गया है।
- issue: ἕως θανάτου का अर्थ
  choice: यहाँ तक कि मृत्यु की सीमा तक
  alternative: मृत्यु के समान / मरने की हद तक
  rationale: वाक्यांश शोक की चरम सीमा बताता है, पर यह निश्चित नहीं करता कि आशय केवल उपमा है या मृत्यु के बिन्दु तक पहुँचना; मुख्य पाठ इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन गरिमापूर्ण पर सामान्य पाठक के लिए स्पष्ट है। ऐतिहासिक वर्तमान को रखा गया है। ‘प्राण’ ने ψυχή की संज्ञात्मक अभिव्यक्ति बचाई है; ‘जागते रहो’ प्रसंग की तात्कालिकता को सामने रखता है।
