  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: hi
  text: और पतरस और जब्दी के दोनों पुत्रों को अपने साथ लेकर, वह दुखी और बहुत व्याकुल होने लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραλαβὼν
  choice: अपने साथ लेकर
  rationale: यहाँ क्रिया का कृदन्त रूप यीशु द्वारा चुने हुए साथियों को अपने साथ ले जाने का भाव देता है; यह आधुनिक हिन्दी में स्वाभाविक और स्रोत के अनुरूप है।
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: ज़बदी के दोनों पुत्रों
  rationale: यूनानी पाठ का सीधा परिचय सुरक्षित रखा गया है; इस पद में याकूब और यूहन्ना के नाम जोड़ना व्याख्यात्मक विस्तार होता।
- source_word: ἤρξατο
  choice: होने लगा
  rationale: यह आरम्भ होने का स्पष्ट भाव व्यक्त करता है और दोनों भाववाचक क्रियाओं के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: λυπεῖσθαι
  choice: दुखी
  rationale: यह वास्तविक शोक या दुःख का सामान्य और गरिमापूर्ण हिन्दी रूप है; केवल 'उदास' कहना भाव को हल्का कर सकता है।
- source_word: ἀδημονεῖν
  choice: बहुत व्याकुल
  rationale: यह तीव्र आन्तरिक बेचैनी और संकट को व्यक्त करता है तथा λυπεῖσθαι से आगे बढ़ती भावात्मक तीव्रता को बनाए रखता है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: दोनों साथियों के उल्लेख और दोनों भावात्मक अवस्थाओं के संचय को सरल समन्वय के द्वारा सुरक्षित रखा गया है।
theological_decisions:
- issue: यीशु की भावात्मक अवस्था का वर्णन
  choice: दुःख और गहरी व्याकुलता—दोनों को वास्तविक मानवीय अनुभव के रूप में सीधे व्यक्त करना
  alternative: भावात्मक दुर्बलता से बचने के लिए भाषा को नरम करना, या शब्दार्थ से आगे बढ़कर इसे आतंक अथवा निराशा कहना
  rationale: यूनानी की दोनों क्रियाएँ वास्तविक दुःख और तीव्र व्याकुलता बताती हैं। अनुवाद न तो यीशु के मानवीय कष्ट को कम करता है, न उसे प्रमाण से परे निराशा में बदलता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध। 'ज़बदी' प्रचलित बाइबलीय नामरूप है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि चुना हुआ पाठ दोनों यूनानी भाववाचक क्रियाओं को स्पष्ट रूप से व्यक्त करता है।
