source:
  edition: SBLGNT
  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: hi
  text: अख़मीरी रोटी के पर्व के पहले दिन[a] शिष्य यीशु के पास आए और बोले, “आप कहाँ चाहते हैं कि हम आपके लिए फसह[b] का भोजन तैयार करें, ताकि आप उसे खा सकें?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह अनुवाद यूनानी पदबंध को निकटता से दर्शाता है। फसह के कालक्रम से जुड़े प्रश्नों का निर्णय केवल अनुवाद के आधार पर नहीं किया जाना चाहिए।
    reason: cultural_note
  - marker: b
    text: यहाँ “फसह” से आशय फसह का भोजन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: अख़मीरी रोटी के पर्व के पहले दिन
  rationale: दत्तिव कालवाचक पदबंध को स्वाभाविक हिन्दी में ‘पहले दिन’ कहा गया है। τῶν ἀζύμων पर्व की अवधि को सूचित करता है, इसलिए ‘के पर्व’ जोड़ना हिन्दी पाठक के लिए सांस्कृतिक संकेत स्पष्ट करता है; δέ का हल्का संयोजक बल प्रसंग में स्वाभाविक रूप से निहित है।
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: शिष्य यीशु के पास आए
  rationale: προσέρχομαι का यहाँ सामान्य अर्थ किसी के पास आना है। यूनानी में ‘उसके’ नहीं है, इसलिए केवल ‘शिष्य’ रखा गया है।
- source_word: λέγοντες
  choice: और बोले
  rationale: समकालिक कृदंत को सहज आधुनिक हिन्दी में समन्वित क्रिया के रूप में व्यक्त किया गया है; इससे भाषण का आरम्भ स्पष्ट होता है और ‘पूछा’ जैसी अतिरिक्त व्याख्या नहीं जुड़ती।
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: आप कहाँ चाहते हैं कि हम आपके लिए … तैयार करें
  rationale: θέλω की इच्छा/मंशा को ‘चाहते हैं’ और σοι को ‘आपके लिए’ से व्यक्त किया गया है। प्रथम पुरुष बहुवचन संभावनार्थक क्रिया को ‘कि हम … तैयार करें’ स्वाभाविक रूप से दर्शाता है।
- source_word: φαγεῖν τὸ πάσχα
  choice: फसह का भोजन तैयार करें
  rationale: इस प्रसंग में πάσχα उस भोज को सूचित करता है जिसे खाया जाना है। हिन्दी में ‘फसह का भोजन तैयार करें’ खाने के उद्देश्य को स्वाभाविक रूप से समाहित करता है, जबकि मुख्य सांस्कृतिक पद ‘फसह’ को बनाए रखता है।
theological_decisions:
- issue: फसह के भोजन के समय के संबंध में ‘अख़मीरी रोटी के पर्व के पहले दिन’ का कालक्रम
  choice: यूनानी का उत्सव-संबंधी कालवाचक पदबंध ज्यों का त्यों रखा गया है।
  alternative: इसे व्याख्यात्मक रूप से ‘अख़मीरी रोटी के पर्व से एक दिन पहले’ या ‘फसह के पहले दिन’ कहना।
  rationale: मूल पाठ स्पष्ट रूप से ‘अख़मीरी रोटी के पहले दिन’ कहता है। सुसमाचारों के कालक्रम से जुड़ी बहस को अनुवाद द्वारा सुलझाने के बजाय मूल की संभावित तनावपूर्ण अभिव्यक्ति सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, आदरसूचक और सहज मानक हिन्दी अपनाई गई है। ‘अख़मीरी रोटी’ तथा ‘फसह’ जैसे स्थापित बाइबलीय-सांस्कृतिक पद बनाए गए हैं; ‘पर्व’ और ‘भोजन’ से उनका आशय साधारण पाठक के लिए स्पष्ट किया गया है।
