id: MAT.26.45
reference: Matthew 26:45
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: hi
  text: तब वह चेलों के पास आता है और उनसे कहता है, “अब सोते रहो और आराम करो[a]। देखो, वह घड़ी निकट आ गई है[b], और मनुष्य का पुत्र पापियों के हाथों में सौंपा जा रहा है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम अब भी सो रहे हो और आराम कर रहे हो?” यूनानी वाक्य को आलंकारिक प्रश्न के रूप में भी समझा जा सकता है; प्रसंग में व्यंग्य का भाव सम्भव है।
    reason: alternative_reading
  - marker: b
    text: या, “वह घड़ी आ पहुँची है” अथवा “वह घड़ी निकट है।”
    reason: lexical_alternative
  - marker: c
    text: या, “पकड़वाया जा रहा है।” यूनानी क्रिया का व्यापक अर्थ किसी को सौंपना या हवाले करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: घटनाक्रम में अगली घटना का स्वाभाविक और सटीक कालसूचक संयोजक।
- source_word: ἔρχεται ... καὶ λέγει
  choice: आता है ... और ... कहता है
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी में बनाए रखकर वर्णन की सजीवता सुरक्षित रखी गई है।
- source_word: πρὸς τοὺς μαθητάς
  choice: चेलों के पास
  rationale: πρός के यहाँ निकट आने या किसी के पास जाने के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: अब सोते रहो और आराम करो
  rationale: रूपतः कथन/आज्ञा जैसे शब्दों को रखते हुए प्रसंगगत व्यंग्यात्मक या प्रश्नात्मक संभावना को मुख्य पाठ में बंद नहीं किया गया; वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: ἰδού
  choice: देखो
  rationale: ध्यान आकर्षित करने वाला आधुनिक, गरिमापूर्ण और स्वाभाविक हिन्दी रूप।
- source_word: ἤγγικεν ἡ ὥρα
  choice: वह घड़ी निकट आ गई है
  rationale: ἐγγίζω के निकट आने के मूल भाव तथा पूर्णकाल से व्यक्त वर्तमान परिणति—दोनों को सुरक्षित रखता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की स्थापित और प्रसंगतः महत्त्वपूर्ण आत्म-पदवी का पारंपरिक, अर्थपूर्ण अनुवाद।
- source_word: παραδίδοται
  choice: सौंपा जा रहा है
  rationale: क्रिया के व्यापक ‘हवाले/सुपुर्द किए जाने’ के अर्थ को रखता है और इसे केवल ‘विश्वासघात’ तक सीमित नहीं करता।
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: पापियों के हाथों में
  rationale: यूनानी की ठोस उपमा हिन्दी में भी स्पष्ट और स्वाभाविक है तथा उनके अधिकार में दिए जाने का भाव रखती है।
theological_decisions:
- issue: Καθεύδετε ... καὶ ἀναπαύεσθε का वाक्यबल
  choice: मुख्य पाठ में “अब सोते रहो और आराम करो”
  alternative: “क्या तुम अब भी सो रहे हो और आराम कर रहे हो?”
  rationale: यूनानी शब्दरूप को कथन/आज्ञा की सतही रचना के साथ रखना सम्भव है, पर निकटवर्ती घोषणा इसे व्यंग्यात्मक या आलंकारिक प्रश्न भी बना सकती है। मुख्य पाठ तनाव को बनाए रखता है और पादटिप्पणी दूसरी सम्भावना बताती है।
- issue: दुःखभोग के प्रसंग में παραδίδοται का अर्थ
  choice: “सौंपा जा रहा है”
  alternative: “पकड़वाया जा रहा है” या “विश्वासघात से सौंपा जा रहा है”
  rationale: व्यापक निष्क्रिय अभिव्यक्ति मानवीय पकड़वाए जाने के साथ घटनाक्रम के बड़े आयाम को भी खुला रखती है; संकीर्ण अर्थ थोपने से बचा गया है।
- issue: ἤγγικεν की समयगत शक्ति
  choice: “निकट आ गई है”
  alternative: “आ पहुँची है” या “निकट है”
  rationale: मूल क्रिया के ‘निकट आने’ के अर्थ और पूर्णकाल की परिणामी अवस्था दोनों को यथासम्भव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथन। ‘चेला’, ‘वह घड़ी’ और ‘मनुष्य का पुत्र’ जैसे स्थापित बाइबलीय पद रखे गए हैं। ऐतिहासिक वर्तमान सुरक्षित है। मुख्य पाठ में वास्तविक यूनानी अस्पष्टता को अत्यधिक स्पष्ट करके हल नहीं किया गया; आवश्यक विकल्प पादटिप्पणियों में हैं।
