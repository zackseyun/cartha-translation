    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: तुम्हारा क्या विचार है?
  rationale: δοκέω के साथ ὑμῖν यहाँ राय से अधिक न्यायिक निर्णय पूछने का मुहावरा है। प्रसंग में “तुम्हारा क्या विचार है?” स्वाभाविक हिन्दी है और प्रश्न की सीधी शक्ति बनाए रखता है।
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: उन्होंने उत्तर दिया
  rationale: ἀποκριθέντες εἶπαν को हिन्दी में दोहराव के बिना एक सामान्य सीमित क्रिया से स्वाभाविक रूप में व्यक्त किया गया है। δέ यहाँ हल्का कथात्मक संयोजक है, इसलिए अलग से “और” या “परन्तु” आवश्यक नहीं।
- source_word: Ἔνοχος
  choice: योग्य
  rationale: ἔνοχος न्यायिक संदर्भ में दोषी, उत्तरदायी या दंड का भागी होने का भाव देता है। θανάτου के साथ “मृत्युदंड के योग्य” परिषद के कानूनी निर्णय को सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: θανάτου
  choice: मृत्युदंड
  rationale: ἔνοχος के साथ संबंधवाचक θανάτου यहाँ केवल मृत्यु की अवस्था नहीं, मृत्यु के दंड की देयता प्रकट करता है; इसलिए “मृत्युदंड” न्यायिक आशय स्पष्ट करता है।
- source_word: ἐστίν
  choice: यह ... है
  rationale: यूनानी में कर्ता प्रसंग से ज्ञात है। हिन्दी में परिषद द्वारा यीशु के विषय में दिए गए प्रत्यक्ष निर्णय को “यह ... है” से स्वाभाविक और स्पष्ट रखा गया है।
theological_decisions:
- issue: परिषद के निर्णय की न्यायिक शक्ति
  choice: यह मृत्युदंड के योग्य है
  alternative: यह मृत्यु का दोषी है / यह मृत्यु के दंड का भागी है
  rationale: अनुवाद परिषद के कथित कानूनी निर्णय को दर्ज करता है, न कि परमेश्वर के सामने यीशु की वास्तविक दोषिता पर कोई धर्मवैज्ञानिक निष्कर्ष जोड़ता है। मुख्य पाठ स्वाभाविक हिन्दी में न्यायिक भाव देता है, और पादटिप्पणी मूल पदबंध के अन्य संभव रूप बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। न्यायिक प्रसंग को स्पष्ट रखने के लिए “मृत्युदंड” चुना गया है।
