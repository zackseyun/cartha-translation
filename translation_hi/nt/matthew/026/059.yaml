revisions:
- from: पर प्रधान याजक और पूरी महासभा यीशु के विरुद्ध झूठी गवाही[a] ढूँढ़ रहे थे, ताकि वे उसे मृत्युदंड दिला सकें।[b]
  to: प्रधान याजक और सारी महासभा[b] यीशु के विरुद्ध झूठी गवाही[a] की तलाश कर रहे थे, ताकि वे उसे मार डालें।
  rationale: The revision retains the ongoing legal search and the purposive force of the Greek while rendering θανατώσωσιν directly as “वे उसे मार डालें,” without adding an unstated procedural mechanism. It restores the cultural note for συνέδριον and uses idiomatic modern Hindi.
  reviewer_model: gpt-5.6-terra
