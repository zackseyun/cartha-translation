source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς ⸀καὶ τὸ συνέδριον ὅλον ἐζήτουν ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ ὅπως ⸂αὐτὸν θανατώσωσιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: hi
  text: प्रधान याजक और सारी महासभा[b] यीशु के विरुद्ध झूठी गवाही[a] की तलाश कर रहे थे, ताकि वे उसे मार डालें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झूठा साक्ष्य।” यूनानी शब्द कानूनी प्रसंग में झूठी गवाही या झूठे साक्ष्य को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “पूरी सन्हेद्रिन।” यूनानी शब्द यहूदी शासकीय-न्यायिक परिषद को सूचित करता है।
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यहाँ δέ कथा में हल्का संक्रमण करता है और पिछले प्रसंग से कुछ विरोध भी व्यक्त करता है; ‘पर’ स्वाभाविक है और किसी काल-सूचक शब्द को नहीं जोड़ता।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: बहुवचन पद वरिष्ठ याजकीय नेतृत्व को सूचित करता है; हिन्दी बाइबलीय प्रयोग में ‘प्रधान याजक’ स्थापित और समझने योग्य रूप है।
- source_word: τὸ συνέδριον ὅλον
  choice: पूरी महासभा
  rationale: συνέδριον यहूदी शासकीय-न्यायिक परिषद को और ὅλον उसकी समग्रता को दर्शाता है। ‘महासभा’ सामान्य पाठक के लिए लिप्यंतरित ‘सन्हेद्रिन’ से अधिक पारदर्शी है।
- source_word: ἐζήτουν
  choice: ढूँढ़ रहे थे
  rationale: अपूर्ण भूतकाल जारी और प्रयत्नशील खोज को व्यक्त करता है; हिन्दी का प्रगतिशील रूप इस पक्ष को सहजता से बनाए रखता है।
- source_word: ψευδομαρτυρίαν
  choice: झूठी गवाही
  rationale: कानूनी प्रसंग में यह शब्द झूठे साक्ष्य या झूठी गवाही को सूचित करता है; ‘झूठी गवाही’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: यीशु के विरुद्ध
  rationale: κατά के संबंधकारक प्रयोग का यहाँ न्यायिक विरोध का अर्थ है, जिसे ‘के विरुद्ध’ सटीक रूप से व्यक्त करता है।
- source_word: ὅπως
  choice: ताकि
  rationale: यह उद्देश्यवाचक उपवाक्य प्रस्तुत करता है; ‘ताकि’ संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
- source_word: αὐτὸν θανατώσωσιν
  choice: वे उसे मृत्युदंड दिला सकें
  rationale: न्यायिक परिवेश में यह अनुवाद मृत्यु कराने के उद्देश्य को व्यक्त करता है। ‘दिला सकें’ परिषद द्वारा न्यायिक प्रक्रिया से मृत्यु सुनिश्चित कराने का स्वाभाविक हिन्दी रूप है, यद्यपि यूनानी क्रिया स्वयं अधिक सामान्यतः ‘मार डालें/मृत्यु के घाट उतारें’ भी हो सकती है।
theological_decisions:
- issue: धार्मिक अगुओं के न्यायिक उद्देश्य की बारीकी
  choice: पद को ऐसी जारी खोज के रूप में प्रस्तुत किया गया है जिसका घोषित उद्देश्य यीशु को मृत्युदंड दिलाना था।
  alternative: इसे अधिक सीधा ‘ताकि वे उसे मार डालें’ कहा जा सकता है।
  rationale: ἐζήτουν का अपूर्ण पक्ष और ὅπως...θανατώσωσιν का उद्देश्यवाचक उपवाक्य योजनाबद्ध, जारी न्यायिक प्रयास दिखाते हैं। अनुवाद उस नैतिक तनाव को बनाए रखता है, पर अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘महासभा’ यहूदी शासकीय परिषद को पारदर्शी ढंग से व्यक्त करता है। कानूनी प्रसंग को ‘गवाही’ और ‘मृत्युदंड’ द्वारा बनाए रखा गया है।
