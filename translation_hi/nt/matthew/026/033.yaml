source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: hi
  text: पर पतरस ने उससे कहा, “चाहे सब लोग तेरे कारण ठोकर खाकर गिर जाएँ[a], फिर भी मैं कभी ठोकर खाकर नहीं गिरूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे कारण पीछे हट जाएँ।” यूनानी क्रिया का अर्थ ठोकर खाना, किसी के कारण डिग जाना, या निष्ठा से पीछे हट जाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: पर पतरस ने उससे कहा
  rationale: यूनानी में कृदंत और मुख्य क्रिया का यह मेल कथात्मक मुहावरा है, जिसका स्वाभाविक हिन्दी रूप ‘ने ... कहा’ है। δέ पिछले कथन के प्रति हल्का विरोध दिखाता है, इसलिए ‘पर’ उपयुक्त है; αὐτῷ को ‘उससे’ में बनाए रखा गया है।
- source_word: Εἰ πάντες
  choice: चाहे सब लोग
  rationale: εἰ मूलतः शर्तसूचक है, पर यहाँ पतरस के प्रबल आत्म-विरोध के कारण रियायती भाव है। ‘चाहे’ आधुनिक हिन्दी में ‘भले ही/यदि ... भी’ का यह भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: σκανδαλισθήσονται
  choice: ठोकर खाकर गिर जाएँ
  rationale: σκανδαλίζω यहाँ केवल भावनात्मक बुरा मानने की नहीं, यीशु से निष्ठा में लड़खड़ाकर पीछे हटने की ओर संकेत करता है। ‘ठोकर खाकर गिर जाना’ मूल रूपक और उसके गंभीर शिष्यत्व-संबंधी अर्थ—दोनों को खुला रखता है।
- source_word: ἐν σοί
  choice: तेरे कारण
  rationale: इस क्रिया के साथ ἐν σοί का अर्थ यीशु के कारण या उससे संबंधित होकर ठोकर खाना है। निकट संबोधन में ‘तेरे’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: ἐγὼ οὐδέποτε σκανδαλισθήσομαι
  choice: फिर भी मैं कभी ठोकर खाकर नहीं गिरूँगा
  rationale: ἐγώ का स्पष्ट प्रयोग पतरस और ‘सब लोगों’ के बीच जोरदार विरोध बनाता है, जिसे ‘फिर भी मैं’ व्यक्त करता है। οὐδέποτε का सीधा अर्थ ‘कभी नहीं’ है और उसी क्रिया का समान अनुवाद वाक्य की पुनरावृत्ति बनाए रखता है।
theological_decisions:
- issue: शिष्यत्व की विफलता के प्रसंग में σκανδαλίζω का अर्थ
  choice: ठोकर खाकर गिर जाना
  alternative: पीछे हट जाना / विश्वास छोड़ देना / बुरा मानना
  rationale: यह रूप शिष्य के निष्ठा से डिगने की गंभीरता को व्यक्त करता है, पर इसे अंतिम धर्मत्याग जैसी किसी तकनीकी धर्मवैज्ञानिक धारणा तक सीमित नहीं करता। साथ ही यूनानी क्रिया का ‘ठोकर’ वाला रूपक भी सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘ठोकर खाकर गिरना’ परिचित रूपक है और मूल की अर्थ-व्याप्ति को किसी एक धर्मवैज्ञानिक निष्कर्ष में बंद नहीं करता। संबोधन में ‘तेरे’ चुना गया है, क्योंकि पतरस सीधे यीशु से बात कर रहा है और यह हिन्दी बाइबलीय कथन में स्वाभाविक है।
