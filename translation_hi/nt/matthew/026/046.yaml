  choice: मुझे पकड़वाने वाला
  alternative: मुझे सौंपने वाला; मेरा विश्वासघाती
  rationale: मूल क्रिया का ठोस अर्थ किसी को दूसरे के हाथ सौंपना है, जबकि प्रसंग में यह विश्वासघात भी है। मुख्य पाठ ‘पकड़वाने’ के द्वारा गिरफ्तारी की तत्काल स्थिति और विश्वासघाती भूमिका दोनों का संकेत देता है, और पाद-टिप्पणी अधिक शाब्दिक अर्थ सुरक्षित रखती है।
