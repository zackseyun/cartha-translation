source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: hi
  text: तुम जानते हो कि दो दिन बाद फ़सह होगा, और मनुष्य का पुत्र क्रूस पर चढ़ाए जाने के लिए सौंपा जा रहा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वासघात के द्वारा सौंपा जा रहा है।” यूनानी क्रिया का अर्थ विश्वासघात भी हो सकता है, पर अधिक व्यापक रूप से इसका अर्थ “सौंपा जाना” या “हवाले किया जाना” है।
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: तुम जानते हो
  rationale: οἶδα का यह द्वितीय पुरुष बहुवचन रूप वर्तमान अर्थ रखता है; हिन्दी में सीधा और स्वाभाविक अनुवाद।
- source_word: μετὰ δύο ἡμέρας
  choice: दो दिन बाद
  rationale: μετά के साथ कर्मकारक यहाँ समयसूचक ‘दो दिन बाद’ है; यह मूल के निकट और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὸ πάσχα
  choice: फ़सह
  rationale: πάσχα यहूदी फ़सह पर्व को सूचित करता है; ‘पर्व’ जोड़ना आवश्यक नहीं, क्योंकि वह मूल में स्पष्ट रूप से नहीं है।
- source_word: γίνεται
  choice: होगा
  rationale: यहाँ γίνομαι फ़सह के होने या घटित होने को व्यक्त करता है; भविष्य-संदर्भ में ‘होगा’ सहज हिन्दी है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की आत्म-पदवी का प्रचलित बाइबलीय अनुवाद, जो उसके अर्थगत और धर्मवैज्ञानिक अनुनाद को बनाए रखता है।
- source_word: παραδίδοται
  choice: सौंपा जा रहा है
  rationale: वर्तमान कर्मवाच्य को बनाए रखते हुए παραδίδωμι के व्यापक अर्थ ‘सौंप देना’ को व्यक्त करता है; इसे केवल ‘विश्वासघात किया जाता है’ तक सीमित नहीं करता।
- source_word: εἰς τὸ σταυρωθῆναι
  choice: क्रूस पर चढ़ाए जाने के लिए
  rationale: εἰς के साथ भाववाचक क्रिया उद्देश्य या परिणति बताती है; हिन्दी में यह स्पष्ट रूप से क्रूस पर चढ़ाए जाने का उद्देश्य व्यक्त करता है।
theological_decisions:
- issue: दुःखभोग की भविष्यवाणी में παραδίδοται का अनुवाद
  choice: सौंपा जा रहा है
  alternative: विश्वासघात करके पकड़वाया जा रहा है
  rationale: संदर्भ में यहूदा का विश्वासघात शामिल है, पर यूनानी क्रिया का अर्थ उससे व्यापक है। ‘सौंपा जा रहा है’ मानवीय विश्वासघात और व्यापक रूप से सौंपे जाने—दोनों की धर्मवैज्ञानिक परतों को खुला रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘फ़सह’ और ‘मनुष्य का पुत्र’ जैसे स्थापित बाइबलीय पदों को रखा गया है। वाक्य में निकट भविष्य के लिए यूनानी वर्तमान ‘सौंपा जा रहा है’ सुरक्षित है।
