source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: hi
  text: मैं तुमसे सच कहता हूँ, सारे संसार में जहाँ कहीं यह शुभ समाचार[a] घोषित किया जाएगा, वहाँ इस स्त्री के किए हुए काम की चर्चा भी उसकी स्मृति में की जाएगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह सुसमाचार।”
    reason: lexical_alternative
  - marker: b
    text: या, “इस स्त्री के किए हुए काम का भी उसके स्मारक के रूप में वर्णन किया जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: सच
  rationale: यीशु के गंभीर और अधिकारपूर्ण कथन की भूमिका को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; यहाँ लिप्यंतरण ‘आमीन’ की अपेक्षा अर्थ स्पष्ट है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: प्रत्यक्ष संबोधन और वर्तमान कथन-रूप को सहज हिन्दी में बनाए रखता है।
- source_word: ὅπου ἐὰν
  choice: जहाँ कहीं
  rationale: अनिश्चित स्थानवाचक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κηρυχθῇ
  choice: घोषित किया जाएगा
  rationale: κηρύσσω के सार्वजनिक उद्घोषणा के भाव को रखता है और केवल धार्मिक उपदेश तक अर्थ को सीमित नहीं करता।
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: यह शुभ समाचार
  rationale: εὐαγγέλιον का मूल अर्थ सुलभ आधुनिक हिन्दी में देता है; पारंपरिक ‘सुसमाचार’ को पादटिप्पणी में रखा गया है।
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: सारे संसार में
  rationale: व्यापक, सार्वभौमिक स्थानगत अर्थ का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: λαληθήσεται
  choice: चर्चा भी की जाएगी
  rationale: कर्म उस स्त्री का किया हुआ कार्य है; हिन्दी में उसके विषय में बोले जाने का अर्थ ‘उसकी चर्चा’ से स्वाभाविक रूप से प्रकट होता है।
- source_word: ὃ ἐποίησεν αὕτη
  choice: इस स्त्री ने जो किया है
  rationale: αὕτη का प्रसंगगत संकेत स्पष्ट करता है और पूर्ण किए गए कार्य की वर्तमान प्रासंगिकता रखता है।
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: उसकी याद में
  rationale: स्मरण और स्मारकीय उद्देश्य को सामान्य, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: εὐαγγέλιον का अनुवाद
  choice: शुभ समाचार
  alternative: सुसमाचार
  rationale: ‘शुभ समाचार’ यूनानी शब्द के अर्थ को सीधे और सुलभ रूप में देता है, जबकि ‘सुसमाचार’ मान्य पारंपरिक बाइबलीय विकल्प है; किसी विशेष धर्मसैद्धांतिक अर्थ को जोड़े बिना दोनों को स्वीकार किया गया है।
- issue: εἰς μνημόσυνον αὐτῆς का संबंध
  choice: उस स्त्री की याद में उसके किए हुए कार्य की चर्चा
  alternative: उसके लिए एक स्मारक के रूप में बताया जाएगा
  rationale: यूनानी वाक्य स्मरण के भाव को रखता है, पर हिन्दी में ‘उसकी याद में उसकी चर्चा’ स्पष्ट और स्वाभाविक है; पादटिप्पणी अधिक औपचारिक स्मारकीय रूप को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; साधारण पाठक के लिए सुलभ, किंतु गंभीर और गरिमापूर्ण। ‘तुमसे’ मूल के बहुवचन संबोधन को प्रसंगानुकूल सामूहिक रूप में रखता है। पादटिप्पणी चिह्न [a] और [b] मुख्य पाठ में उपस्थित हैं।
