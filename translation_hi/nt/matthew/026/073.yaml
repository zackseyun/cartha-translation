  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: hi
  text: थोड़ी देर बाद वहाँ खड़े लोगों ने पतरस के पास आकर उससे कहा, “निश्चय ही तुम भी उन्हीं में से एक हो, क्योंकि तुम्हारे बोलने का ढंग भी तुम्हारी पहचान करा देता है।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी बोली तुम्हारा भेद खोल देती है।” यूनानी शब्द λαλιά का अर्थ बोली, बोलने का ढंग या लहजा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: थोड़ी देर बाद
  rationale: यह संक्षिप्त समयांतराल बताने वाली स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: δὲ
  choice: —
  rationale: यहाँ यह कथा को आगे बढ़ाने वाला हल्का संयोजक है; हिन्दी में अलग शब्द जोड़े बिना वाक्य-क्रम से इसका कार्य स्पष्ट है।
- source_word: προσελθόντες
  choice: पास आकर
  rationale: यह पतरस की ओर बढ़कर आने की क्रिया को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: οἱ ἑστῶτες
  choice: वहाँ खड़े लोगों
  rationale: मूल के कृदन्तीय वाक्यांश ‘जो खड़े थे’ का अर्थ बनाए रखता है और प्रसंगगत स्थान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἶπον τῷ Πέτρῳ
  choice: पतरस से कहा
  rationale: λέγω और सम्प्रदान कारक का सीधा तथा स्वाभाविक हिन्दी रूप।
- source_word: Ἀληθῶς
  choice: निश्चय ही
  rationale: वक्ताओं के दृढ़ विश्वास और आरोपात्मक पहचान को वर्तमान मानक हिन्दी में व्यक्त करता है।
- source_word: καὶ σὺ
  choice: तुम भी
  rationale: पतरस को उसी समूह में सम्मिलित करने वाले बल को सुरक्षित रखता है।
- source_word: ἐξ αὐτῶν
  choice: उन्हीं में से एक
  rationale: समूह से सम्बन्ध या सदस्यता का स्वाभाविक हिन्दी रूप है; ‘ही’ प्रसंग में इंगित उसी समूह को स्पष्ट करता है।
- source_word: καὶ γὰρ
  choice: क्योंकि ... भी
  rationale: γάρ के कारणसूचक अर्थ और καί के बल—दोनों को हिन्दी वाक्य-विन्यास में सुरक्षित रखता है।
- source_word: ἡ λαλιά σου
  choice: तुम्हारे बोलने का ढंग
  rationale: λαλιά बोली, वाणी या बोलने के विशिष्ट ढंग को सूचित कर सकता है। यह चयन किसी खास क्षेत्रीय उच्चारण को पाठ में अनिवार्य बनाए बिना प्रसंग का अर्थ स्पष्ट करता है।
- source_word: δῆλόν σε ποιεῖ
  choice: तुम्हारी पहचान करा देता है
  rationale: शाब्दिक भाव ‘तुम्हें स्पष्ट/प्रत्यक्ष कर देता है’ को स्वाभाविक हिन्दी मुहावरे में व्यक्त करता है और यह बनाए रखता है कि बोलने का ढंग पतरस को उस समूह से जुड़ा हुआ प्रकट करता है।
