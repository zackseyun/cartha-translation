id: MAT.26.65
reference: Matthew 26:65
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: hi
  text: तब महायाजक ने अपने वस्त्र फाड़े[a] और कहा, “उसने परमेश्वर की निन्दा की है! अब हमें गवाहों की और क्या आवश्यकता है? देखो, अब तुमने यह निन्दा सुन ली है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वस्त्र फाड़ना सदमे, शोक या रोष का सार्वजनिक संकेत था।
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: कथा में अगली घटना को स्वाभाविक क्रम से जोड़ता है।
- source_word: ὁ ἀρχιερεὺς
  choice: महायाजक
  rationale: यह उस समय के एकवचन पदाधिकारी के लिए प्रचलित और सटीक हिन्दी पद है।
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: अपने वस्त्र फाड़े
  rationale: क्रिया के बल और सार्वजनिक संकेत को बनाए रखता है; ‘वस्त्र’ आधुनिक किन्तु गरिमापूर्ण है और ‘याजकीय चोगे’ जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: Ἐβλασφήμησεν
  choice: उसने परमेश्वर की निन्दा की है
  rationale: तत्काल लगाए गए धार्मिक-कानूनी आरोप को स्पष्ट करता है। हिन्दी में केवल ‘निन्दा’ अस्पष्ट हो सकती है, इसलिए βλασφημέω का आशय ‘परमेश्वर की निन्दा’ से व्यक्त किया गया है।
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: अब हमें गवाहों की और क्या आवश्यकता है?
  rationale: ग्रीक प्रश्न की संरचना और ἔτι के ‘अब और’ भाव को स्वाभाविक, औपचारिक हिन्दी में बनाए रखता है।
- source_word: ἴδε νῦν ἠκούσατε
  choice: देखो, अब तुमने ... सुन ली है
  rationale: ἴδε का ध्यान आकर्षित करने वाला बल, νῦν की तात्कालिकता और बहुवचन ἠκούσατε—तीनों सुरक्षित रहते हैं।
- source_word: τὴν βλασφημίαν
  choice: यह निन्दा
  rationale: सुनने वालों के सामने अभी कहे गए कथन की ओर संकेत करता है और आरोप को महायाजक के कथन के रूप में रखता है।
theological_decisions:
- issue: βλασφημέω / βλασφημία के आरोप का अनुवाद
  choice: “परमेश्वर की निन्दा की है” / “यह निन्दा”
  alternative: “ईशनिन्दा की है” / “ईशनिन्दा”
  rationale: यह महायाजक का आरोप है, कथावाचक का निर्णय नहीं। ‘परमेश्वर की निन्दा’ सामान्य आधुनिक पाठक के लिए अधिक तुरंत समझ में आता है और धार्मिक-कानूनी गंभीरता भी बनाए रखता है।
- issue: महायाजक द्वारा वस्त्र फाड़ने का अर्थ
  choice: मुख्य पाठ में केवल क्रिया; सांस्कृतिक अर्थ पादटिप्पणी में
  alternative: मुख्य पाठ में शोक या रोष की व्याख्या जोड़ना
  rationale: मूल पाठ क्रिया बताता है पर उसकी भावना को एक ही अर्थ तक सीमित नहीं करता; इसलिए सदमा, शोक या रोष की सम्भावनाएँ खुली रखी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सहज शैली। ‘महायाजक’, ‘वस्त्र’ और ‘गवाह’ जैसे परिचित धार्मिक-कानूनी शब्द रखे गए हैं। प्रत्यक्ष कथन में आरोप की तीव्रता बनी रहती है, पर अनुवाद उसे कथावाचक की स्वीकृति के रूप में प्रस्तुत नहीं करता।
