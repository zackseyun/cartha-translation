source:
  edition: SBLGNT
  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: hi
  text: 'उसे धोखा देने वाले ने[a] उन्हें एक संकेत[b] दिया था: “जिसे मैं चूमूँ, वही है; उसे पकड़ लेना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे सौंपने वाले ने।”
    reason: lexical_alternative
  - marker: b
    text: या, “चिह्न।”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: उसके साथ विश्वासघात करने वाले
  rationale: दुःखभोग-वृत्तांत में यह क्रिया केवल सौंपने की तटस्थ क्रिया नहीं, बल्कि यहूदा के विश्वासघात को व्यक्त करती है। यह हिन्दी पदबंध प्रसंग के नैतिक बल को स्वाभाविक रूप से सामने लाता है।
- source_word: σημεῖον
  choice: संकेत
  rationale: यहाँ शब्द का अर्थ पहले से तय किया गया पहचान-संकेत है। ‘संकेत’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंगगत कार्य को स्पष्ट रखता है।
- source_word: Ὃν ἂν φιλήσω
  choice: जिसे मैं चूमूँ
  rationale: यह अनिश्चित संबंधवाचक रचना पहचान के लिए चुने जाने वाले व्यक्ति को बताती है; यह हिन्दी रूप संक्षिप्त और स्वाभाविक है।
- source_word: φιλήσω
  choice: चूमूँ
  rationale: मूल क्रिया सीधे चूमने की क्रिया बताती है; ‘चूमकर अभिवादन करूँ’ कहना मूल से अधिक विशिष्ट होता।
- source_word: αὐτός ἐστιν
  choice: वही है
  rationale: यह संक्षिप्त पहचान-वाक्य यूनानी के बल और संक्षिप्तता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κρατήσατε
  choice: उसे पकड़ लेना
  rationale: क्रिया दृढ़ता से पकड़ लेने का आदेश देती है। यह गिरफ्तारी के प्रसंग के अनुकूल है, पर मूल में स्पष्ट न किए गए औपचारिक कानूनी शब्द को नहीं जोड़ती।
theological_decisions:
- issue: यहूदा के लिए παραδιδοὺς का नैतिक बल
  choice: उसके साथ विश्वासघात करने वाले
  alternative: उसे पकड़वाने वाले
  rationale: निकटवर्ती दुःखभोग-प्रसंग में यहूदा का कार्य विश्वासघात है। मुख्य पाठ इस नैतिक बल को व्यक्त करता है, जबकि पादटिप्पणी क्रिया के अधिक शाब्दिक ‘सौंपने/पकड़वाने’ वाले पहलू को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पूर्वकालिक ἔδωκεν को ‘दे रखा था’ और उसके साथ आए λέγων को स्वाभाविक हिन्दी में ‘उसने कहा था’ के रूप में अलग वाक्य बनाया गया है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
