  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: hi
  text: जब वे खा रहे थे[a], तब यीशु ने रोटी ली और आशीष देकर[b] उसे तोड़ा। फिर उसे चेलों को देकर कहा, “लो, खाओ[c]; यह मेरा शरीर है[d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जबकि वे खा रहे थे।”
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “आशीष की प्रार्थना करके” भी हो सकता है; कुछ लोग इसे रोटी के लिए परमेश्वर को धन्यवाद देने के अर्थ में समझते हैं।
    reason: lexical_alternative
  - marker: c
    text: या, “लो और खाओ।”
    reason: lexical_alternative
  - marker: d
    text: यूनानी का शाब्दिक कथन है, “यह मेरा शरीर है।” कुछ लोग इसका अर्थ “यह मेरे शरीर को दर्शाता है” समझते हैं, पर मुख्य पाठ स्रोत की शब्दावली को बनाए रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: जब वे खा रहे थे, तब
  rationale: यह संबंधवाचक कृदंत-रचना भोजन जारी रहने की समयगत पृष्ठभूमि बताती है। ‘जब…तब’ आधुनिक हिन्दी में स्वाभाविक है; δέ यहाँ हल्का संयोजक है, विरोधसूचक नहीं।
- source_word: λαβὼν
  choice: ली
  rationale: पूर्वकालिक कृदंत को हिन्दी कथन-क्रम में स्वाभाविक समापिका क्रिया के रूप में रखा गया है।
- source_word: ἄρτον
  choice: रोटी
  rationale: ἄρτος का सामान्य अर्थ ‘रोटी’ है; यहाँ ‘एक रोटी’ या ‘रोटी का एक टुकड़ा’ कहना स्रोत से अधिक विशिष्ट हो जाता।
- source_word: εὐλογήσας
  choice: आशीष देकर
  rationale: यह अनुवाद εὐλογέω के मूल भाव को बनाए रखता है और यह अनावश्यक रूप से निश्चित नहीं करता कि व्याकरणिक रूप से आशीष का प्रत्यक्ष लक्ष्य रोटी थी या भोजन के अवसर पर परमेश्वर की स्तुति/धन्यवाद किया गया।
- source_word: ἔκλασεν
  choice: उसे तोड़ा
  rationale: क्रिया का अर्थ ‘तोड़ना’ है; स्वाभाविक हिन्दी के लिए ‘उसे’ जोड़ा गया है, जिसका संकेत रोटी की ओर है।
- source_word: δοὺς τοῖς μαθηταῖς
  choice: उसे चेलों को देते हुए
  rationale: कृदंत को ‘देते हुए’ के रूप में रखने से देने और कहने का निकट संबंध बना रहता है। τοῖς μαθηταῖς परिचित समूह ‘चेलों’ को सूचित करता है; स्रोत में निहित न होने के कारण ‘अपने’ नहीं जोड़ा गया।
- source_word: Λάβετε φάγετε
  choice: लो, खाओ
  rationale: दोनों आदेश बिना संयोजक के लगातार आते हैं। अल्पविराम वही तीव्र, सीधा क्रम बनाए रखता है।
- source_word: τοῦτό ἐστιν
  choice: यह … है
  rationale: सरल संयोजक क्रिया ἐστιν का सीधा अनुवाद है; ‘अर्थ है’ या ‘प्रतीक है’ कहकर कथन की व्याख्या पहले से तय नहीं की गई।
- source_word: τὸ σῶμά μου
  choice: मेरा शरीर
  rationale: σῶμα का सामान्य और प्रत्यक्ष हिन्दी अर्थ ‘शरीर’ है और μου का अनुवाद ‘मेरा’ किया गया है।
theological_decisions:
- issue: प्रभु-भोज के कथन में ‘यह मेरा शरीर है’
  choice: यह मेरा शरीर है
  alternative: यह मेरे शरीर का अर्थ/चिह्न है
  rationale: यूनानी पाठ में सामान्य संयोजक ἐστιν (‘है’) है। मुख्य पाठ इसे उसी रूप में रखता है और वास्तविक उपस्थिति, प्रतीकवाद या किसी अन्य संस्कार-संबंधी मत को अनुवाद में आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चेलों’ का प्रयोग हिन्दी बाइबलीय प्रचलन के अनुरूप है। वाक्य-विन्यास को स्वाभाविक बनाने के लिए कृदंतों का मिश्रित रूप से समापिका क्रियाओं और ‘देते हुए’ द्वारा अनुवाद किया गया है, जबकि मूल घटनाक्रम और धार्मिक तनाव सुरक्षित रखा गया है।
