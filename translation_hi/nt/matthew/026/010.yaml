reference: Matthew 26:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: hi
  text: पर यीशु यह जानकर उनसे बोले, “तुम इस स्त्री को क्यों परेशान कर रहे हो? उसने मेरे लिए एक सुंदर काम किया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: यह जानकर
  rationale: अओरिस्ट कृदन्त यहाँ मुख्य क्रिया से पहले की परिस्थितिजन्य क्रिया है। संदर्भ से निहित बात—शिष्यों की आलोचना—को ‘यह’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: δέ शिष्यों की शिकायत से यीशु के सुधारात्मक उत्तर की ओर हल्का विरोध अथवा संक्रमण दिखाता है।
- source_word: Τί κόπους παρέχετε τῇ γυναικί
  choice: तुम इस स्त्री को क्यों परेशान कर रहे हो?
  rationale: κόπους παρέχετε का मुहावरा किसी के लिए कष्ट या परेशानी उत्पन्न करने का भाव देता है। ‘परेशान कर रहे हो’ आधुनिक हिन्दी में स्वाभाविक है और डाँट के बल को बनाए रखता है।
- source_word: ἔργον καλὸν
  choice: एक सुंदर काम
  rationale: καλός में केवल नैतिक भलाई ही नहीं, बल्कि सराहनीय, उत्तम और शोभनीय होने का भाव भी है; ‘सुंदर काम’ इस व्यापक प्रशंसात्मक अर्थ को सुरक्षित रखता है।
- source_word: ἠργάσατο
  choice: किया है
  rationale: पूर्ण हो चुके कार्य की वर्तमान प्रासंगिकता को हिन्दी का पूर्ण पक्ष स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰς ἐμέ
  choice: मेरे लिए
  rationale: व्यक्ति के साथ εἰς यहाँ उसकी ओर निर्देशित अथवा उसके संबंध में किए गए कार्य का संकेत देता है। हिन्दी में ‘मेरे लिए’ इस प्रसंग में स्वाभाविक है।
theological_decisions:
- issue: स्त्री के कार्य का मूल्यांकन
  choice: एक सुंदर काम
  alternative: एक अच्छा काम / एक उत्तम काम
  rationale: यह अनुवाद उसके कार्य की स्पष्ट सराहना और καλός की नैतिक-सौंदर्यात्मक छाया को रखता है, पर उसमें पुण्य, संस्कार या किसी विशेष संप्रदायगत सिद्धान्त का अर्थ नहीं जोड़ता।
- issue: εἰς ἐμέ का संबंधसूचक अर्थ
  choice: मेरे लिए
  alternative: मेरे प्रति / मुझ पर
  rationale: अभिषेक के प्रसंग में कार्य यीशु की ओर निर्देशित है और उनके हित या सम्मान में किया गया है। ‘मेरे लिए’ स्वाभाविक हिन्दी है, जबकि अन्य विकल्प दिशा या प्रत्यक्ष अनुप्रयोग को अधिक उभार सकते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, सम्मानपूर्ण और मौखिक संवाद के अनुकूल शैली। ‘स्त्री’ गरिमापूर्ण सामान्य संज्ञा है और ‘परेशान कर रहे हो’ मूल प्रश्न की सुधारात्मक तीव्रता को सहज हिन्दी में रखता है।
