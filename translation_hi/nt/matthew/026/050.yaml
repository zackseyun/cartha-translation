source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: hi
  text: पर यीशु ने उससे कहा[a], “मित्र, जिस काम के लिए तुम आए हो, वह कर लो।” तब वे पास आए, यीशु पर हाथ डाला और उसे पकड़ लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मित्र, तुम किस काम के लिए आए हो?” यूनानी अभिव्यक्ति बहुत संक्षिप्त है और इसे प्रश्न के रूप में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: मित्र
  rationale: यह यहूदा को किया गया संबोधन है। ‘मित्र’ आधुनिक हिन्दी में स्वाभाविक है और संयत स्वर रखता है; इससे अनिवार्य रूप से घनिष्ठ मित्रता का भाव नहीं आता।
- source_word: ἐφ’ ὃ πάρει
  choice: जिस काम के लिए तुम आए हो, वह कर लो
  rationale: यूनानी पदबंध अत्यंत संक्षिप्त है और कथन/आज्ञार्थक अभिव्यक्ति अथवा प्रश्न, दोनों रूपों में समझा जा सकता है। मुख्य पाठ में यहूदा के उद्देश्य को पूरा करने देने वाला अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है; प्रश्नवाचक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: προσελθόντες
  choice: पास आकर
  rationale: कृदंत यीशु की ओर बढ़ने और उसके बाद की कार्रवाई का क्रम बताता है। ‘पास आकर’ सहज और संक्षिप्त हिन्दी है।
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: यीशु को पकड़ लिया
  rationale: यह मुहावरा शत्रुतापूर्वक हाथ डालकर गिरफ्त में लेने की शारीरिक कार्रवाई बताता है। ‘पकड़ लिया’ हिन्दी में अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκράτησαν αὐτόν
  choice: अपने काबू में कर लिया
  rationale: यहाँ क्रिया बलपूर्वक थामे रखने या वश में कर लेने का अर्थ देती है। पिछले ‘पकड़ लिया’ से अनावश्यक पुनरुक्ति बचाते हुए यह गिरफ्त में बनाए रखने की परिणति व्यक्त करती है।
- source_word: δὲ
  choice: पर
  rationale: δέ यहाँ हल्का विरोध अथवा कथानक का मोड़ दिखाता है। ‘पर’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: यहूदा के प्रति यीशु के संबोधन और उत्तर की व्याख्या
  choice: “मित्र, जिस काम के लिए तुम आए हो, वह कर लो।”
  alternative: “मित्र, तुम किस काम के लिए आए हो?”
  rationale: मुख्य पाठ यीशु के संयत संबोधन और यहूदा के उद्देश्य को उजागर करने वाले अर्थ को रखता है, लेकिन यूनानी की संक्षिप्तता के कारण प्रश्नवाचक समझ भी वास्तविक संभावना है। उसे पादटिप्पणी में रखकर व्याख्यात्मक तनाव सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मित्र’ संबोधन को न अत्यधिक आत्मीय बनाया गया है, न कटु। गिरफ्तारी की दो क्रमिक क्रियाओं को ‘पकड़ लिया’ और ‘अपने काबू में कर लिया’ से व्यक्त किया गया है।
