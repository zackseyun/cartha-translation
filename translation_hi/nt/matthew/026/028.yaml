id: MAT.26.28
reference: Matthew 26:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: hi
  text: क्योंकि यह वाचा का मेरा लहू है[a], जो बहुतों के लिए[b] पापों की क्षमा के लिए बहाया जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में है, “नई वाचा का मेरा लहू।”
    reason: textual_variant
  - marker: b
    text: या, “बहुतों की ओर से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: यह
  rationale: यूनानी में केवल संकेतवाचक सर्वनाम है; इस उपवाक्य में ‘कटोरा’ शब्द नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले आदेश का कारण या स्पष्टीकरण देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὸ αἷμά μου
  choice: मेरा लहू
  rationale: यह αἷμα का सीधा अनुवाद है और बलिदान तथा वाचा से जुड़े अर्थ को बनाए रखता है। ‘लहू’ इस धार्मिक संदर्भ में गरिमापूर्ण और व्यापक रूप से समझा जाने वाला शब्द है।
- source_word: τῆς διαθήκης
  choice: वाचा का
  rationale: मूल पाठ में ‘वाचा’ है, ‘नई वाचा’ नहीं। ‘वाचा’ बाइबलीय covenant की गंभीर और प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: περὶ πολλῶν
  choice: बहुतों के लिए
  rationale: बलिदान के इस संदर्भ में περί के साथ संबंध और हित/प्रतिनिधित्व का भाव है। यह अनुवाद मूल के ‘बहुतों’ को बनाए रखता है और प्रायश्चित के विस्तार पर किसी धर्मसैद्धांतिक निष्कर्ष को नहीं थोपता।
- source_word: ἐκχυννόμενον
  choice: जो ... बहाया जाता है
  rationale: वर्तमानकालिक कर्मवाच्य कृदन्त को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है। ‘बहाया जाता है’ उँडेलने और बलिदान—दोनों की छवि बनाए रखता है।
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: पापों की क्षमा के लिए
  rationale: यह उद्देश्य/परिणाम के भाव को स्पष्ट, आधुनिक और धर्मशास्त्रीय रूप से संयमित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या ‘वाचा’ के साथ ‘नई’ जोड़ा जाए
  choice: वाचा का
  alternative: नई वाचा का
  rationale: प्रदत्त SBLGNT पाठ में καινῆς (‘नई’) नहीं है। इसलिए मुख्य पाठ मूल के अनुसार रखा गया है और पांडुलिपीय पाठांतर को पादटिप्पणी में दिया गया है।
- issue: प्रायश्चित की भाषा में ‘बहुतों’ का अभिप्राय
  choice: बहुतों के लिए
  alternative: सबके लिए
  rationale: यूनानी πολλῶν का अर्थ ‘बहुतों’ है। अनुवाद इसी शब्दावली को बनाए रखता है और इस पद के आधार पर प्रायश्चित के विस्तार से जुड़े व्यापक धर्मसैद्धांतिक विवाद का निर्णय नहीं करता।
- issue: περὶ πολλῶν में प्रतिनिधित्व या हित का भाव
  choice: बहुतों के लिए
  alternative: बहुतों की ओर से
  rationale: मुख्य पाठ में संक्षिप्त और स्वाभाविक हिन्दी चुनी गई है; ‘की ओर से’ वाला संभावित प्रतिनिधिक भाव पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘लहू’ और ‘वाचा’ बाइबलीय संदर्भ की बलिदानी तथा वाचागत प्रतिध्वनियों को बनाए रखते हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित पदबंधों के तुरंत बाद रखे गए हैं।
