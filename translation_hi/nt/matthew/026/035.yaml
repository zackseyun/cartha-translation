reference: Matthew 26:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: hi
  text: पतरस ने उससे कहा, “चाहे मुझे आपके साथ मरना ही क्यों न पड़े, मैं आपका इनकार कभी नहीं करूँगा[a]।” इसी प्रकार सभी चेलों ने भी यही कहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यहाँ निषेध बहुत प्रबल है; इसका अनुवाद यह भी हो सकता है: “मैं आपका इनकार हरगिज़ नहीं करूँगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथा-शैली में भूतकाल ‘कहा’ अधिक स्वाभाविक है और वही कथात्मक कार्य निभाता है।
- source_word: Κἂν δέῃ με
  choice: चाहे मुझे … ही क्यों न पड़े
  rationale: यह प्रयोग रियायती शर्त और आवश्यकता, दोनों को व्यक्त करता है; हिन्दी की यह संरचना पतरस के कथन का जोर स्वाभाविक ढंग से बनाए रखती है।
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: आपके साथ मरना
  rationale: यह साथ होने और मरने की क्रिया को सीधे तथा सहज हिन्दी में व्यक्त करता है।
- source_word: οὐ μή
  choice: कभी नहीं
  rationale: दोहरा यूनानी निषेध अत्यंत प्रबल है। ‘कभी नहीं’ हिन्दी में उसके दृढ़ और व्यापक निषेध को स्वाभाविक रूप से व्यक्त करता है; फुटनोट में उसका विशेष जोर स्पष्ट किया गया है।
- source_word: ἀπαρνήσομαι
  choice: आपका इनकार … करूँगा
  rationale: संदर्भ में इसका अर्थ यीशु को पहचानने या उनसे संबंध होने से इनकार करना है। ‘आपका इनकार करना’ हिन्दी की स्थापित और स्पष्ट अभिव्यक्ति है, जबकि ‘त्यागना’ मूल से अधिक अर्थ जोड़ सकता है।
- source_word: ὁμοίως
  choice: इसी प्रकार … भी यही
  rationale: यह अन्य चेलों के कथन को पतरस के कथन के समान बताता है; हिन्दी में यह संयोजन अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: πάντες οἱ μαθηταὶ
  choice: सभी चेलों
  rationale: ‘चेले’ सुसमाचारों के प्रसंग में μαθηταί का प्रचलित, सामान्य पाठकों के लिए सुबोध हिन्दी पर्याय है।
- source_word: εἶπαν
  choice: कहा
  rationale: साधारण भूतकालीन कथन के लिए सीधा और स्वाभाविक अनुवाद।
theological_decisions:
- issue: पतरस के निषेध की दृढ़ता
  choice: ‘मैं आपका इनकार कभी नहीं करूँगा’ के रूप में प्रबल भविष्यकालीन निषेध
  alternative: ‘मैं आपका इनकार हरगिज़ नहीं करूँगा’
  rationale: οὐ μή पतरस के दृढ़ आत्मविश्वास को व्यक्त करता है। ‘कभी नहीं’ उस प्रबल निषेध को बनाए रखता है, पर उसके कथन की विडंबना या आगामी असफलता की कोई व्याख्या पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यीशु के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है। ‘मरना ही क्यों न पड़े’ पतरस के जोर को स्वाभाविक हिन्दी में सामने लाता है, और ‘इसी प्रकार’ ὁμοίως को स्पष्ट रूप से सुरक्षित रखता है।
