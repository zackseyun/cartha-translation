id: MAT.26.11
reference: Matthew 26:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: hi
  text: क्योंकि गरीब तो हमेशा तुम्हारे साथ रहते हैं[a], पर मैं हमेशा तुम्हारे साथ नहीं रहता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘गरीब लोग।’
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: हमेशा
  rationale: यह क्रियाविशेषण निरंतर उपलब्धता या उपस्थिति बताता है। दोनों खंडों में ‘हमेशा’ रखने से यूनानी की पुनरावृत्ति और विरोध सुरक्षित रहता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοὺς πτωχοὺς
  choice: गरीब
  rationale: यह बहुवचन रूप निर्धन लोगों को सामूहिक रूप से दर्शाता है। हिन्दी में ‘गरीब’ व्यक्ति और वर्ग दोनों के लिए स्वाभाविक है।
- source_word: ἔχετε
  choice: साथ रहते हैं / साथ नहीं रहूँगा
  rationale: यहाँ ἔχω स्वामित्व नहीं, बल्कि किसी की उपस्थिति या उपलब्धता व्यक्त करता है। शब्दशः ‘तुम्हारे पास हैं’ सम्भव है, पर इस संदर्भ में ‘तुम्हारे साथ रहते हैं’ और ‘तुम्हारे साथ नहीं रहूँगा’ अधिक स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: μεθ’ ἑαυτῶν
  choice: तुम्हारे साथ
  rationale: यह वाक्यांश शिष्यों के बीच या उनके साथ उपस्थिति व्यक्त करता है। ‘तुम्हारे साथ’ सीधा और सहज अनुवाद है।
- source_word: ἐμὲ
  choice: मैं
  rationale: यूनानी में यह बलयुक्त कर्मकारक सर्वनाम है। हिन्दी वाक्य-रचना में क्रिया को ‘रहूँगा’ करके ‘मैं’ कर्ता के रूप में आता है और यीशु का व्यक्तिगत संदर्भ स्पष्ट रहता है।
- source_word: δὲ
  choice: पर
  rationale: δέ गरीबों की निरंतर उपस्थिति और यीशु की सीमित शारीरिक उपस्थिति के बीच विरोध दिखाता है; ‘पर’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὐ πάντοτε
  choice: हमेशा ... नहीं
  rationale: यह पहले πάντοτε के साथ सीधा कालगत विरोध बनाता है। ‘हमेशा ... नहीं’ उसी विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: यीशु की उपस्थिति का आशय
  choice: वचन गरीबों की निरंतर उपस्थिति की तुलना शिष्यों के बीच यीशु की सीमित समय वाली शारीरिक उपस्थिति से करता है।
  alternative: इसे गरीबों की देखभाल का महत्त्व घटाने वाला कथन समझना।
  rationale: यूनानी पाठ मुख्यतः कालगत विरोध करता है, गरीबों का नैतिक अवमूल्यन नहीं। अनुवाद यीशु की निकट आती मृत्यु से जुड़ी इस अद्वितीय घड़ी को बनाए रखता है, पर दया या सहायता के विषय में कोई अतिरिक्त निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और बोलचाल में सहज। ‘गरीब’ को सामूहिक संज्ञा के रूप में रखा गया है और विकल्प को पादटिप्पणी में स्पष्ट किया गया है।
