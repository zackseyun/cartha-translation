source:
  edition: SBLGNT
  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: hi
  text: तब वह शाप देने और शपथ खाने लगा[a], “मैं उस मनुष्य को नहीं जानता।” और तुरन्त मुर्गे ने बाँग दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “वह शापों का आह्वान करने और शपथ खाने लगा।” सम्भवतः उसने अपने इनकार को दृढ़ करने के लिए अपने ही ऊपर शाप आने की बात कही।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कथा में घटनाओं के क्रम को स्वाभाविक और संक्षिप्त ढंग से आगे बढ़ाता है।
- source_word: ἤρξατο
  choice: लगा
  rationale: पूरक क्रियाओं के साथ आरम्भ होने और पतरस के इनकार की तीव्रता बढ़ने का भाव रखता है।
- source_word: καταθεματίζειν
  choice: शाप देने
  rationale: मूल क्रिया शाप का आह्वान करने को व्यक्त करती है। मुख्य पाठ में जानबूझकर यह खुला रखा गया है कि शाप किस पर था; सम्भावित आत्म-शाप की व्याख्या पादटिप्पणी में दी गई है।
- source_word: ὀμνύειν
  choice: शपथ खाने
  rationale: यह केवल अपशब्द कहने के बजाय गंभीर शपथ लेने का अर्थ स्पष्ट करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὅτι
  choice: प्रत्यक्ष उद्धरण
  rationale: यह शपथ और इनकार की विषय-वस्तु प्रस्तुत करता है; हिन्दी में प्रत्यक्ष कथन सर्वाधिक स्पष्ट है।
- source_word: Οὐκ οἶδα
  choice: मैं ... नहीं जानता
  rationale: ज्ञान अथवा परिचय के स्पष्ट निषेध को सीधे रखता है।
- source_word: τὸν ἄνθρωπον
  choice: उस मनुष्य को
  rationale: संदर्भित व्यक्ति यीशु हैं; ‘उस’ हिन्दी में निश्चित संदर्भ को स्वाभाविक बनाता है, जबकि अपमानसूचक अतिरिक्त भाव नहीं जोड़ता।
- source_word: καὶ εὐθέως
  choice: और तुरन्त
  rationale: यीशु की भविष्यवाणी के तत्काल पूरा होने की कथात्मक तीव्रता बनाए रखता है।
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: मुर्गे ने बाँग दी
  rationale: मुर्गे की पुकार के लिए यह प्रचलित और सटीक हिन्दी मुहावरा है।
theological_decisions:
- issue: καταθεματίζειν में शाप का लक्ष्य
  choice: मुख्य पाठ में ‘शाप देने’ रखा गया और सम्भावित आत्म-शाप को पादटिप्पणी में समझाया गया।
  alternative: स्पष्ट रूप से ‘अपने ऊपर शाप बुलाने’ का अनुवाद करना; अथवा यीशु को शाप देने का अर्थ लेना।
  rationale: शपथ खाने के साथ प्रयुक्त होने के कारण आत्म-शाप की सम्भावना प्रबल है, पर यूनानी क्रिया स्वयं कर्म या लक्ष्य स्पष्ट नहीं करती। इसलिए मुख्य पाठ मूल की अस्पष्टता बचाता है और यह नहीं कहता कि पतरस ने यीशु को शाप दिया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण कथात्मक स्तर अपनाया गया है। ‘शपथ खाने’ से धार्मिक-सांस्कृतिक प्रसंग स्पष्ट रहता है और ‘बाँग दी’ सामान्य पाठक के लिए स्वाभाविक है।
