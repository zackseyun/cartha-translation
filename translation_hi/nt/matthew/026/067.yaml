  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: hi
  text: तब उन्होंने उसके मुँह पर थूका[a] और उसे घूँसों से मारा[b]; और कुछ लोगों ने उसे थप्पड़ मारे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके चेहरे पर थूका।” यूनानी अभिव्यक्ति का शाब्दिक रूप है, “उसके चेहरे में थूका,” जिसका आशय सीधे उसके चेहरे पर थूकना है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसे घूँसे मारे।” यूनानी क्रिया विशेष रूप से मुट्ठी से किए गए प्रहार का संकेत देती है।
    reason: lexical_alternative
  - marker: c
    text: या, “कुछ लोगों ने उसे खुले हाथ से मारा।” अंतिम यूनानी क्रिया प्रायः थप्पड़ मारने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण घटनाक्रम में अगली घटना को दिखाता है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: उन्होंने उसके मुँह पर थूका
  rationale: ἐμπτύω का अर्थ ‘थूकना’ है और εἰς τὸ πρόσωπον सीधे चेहरे को लक्ष्य करके थूकने का भाव देता है। हिन्दी में ‘मुँह पर थूका’ इस अपमानजनक कृत्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκολάφισαν αὐτόν
  choice: उसे घूँसों से मारा
  rationale: κολαφίζω विशेष रूप से मुट्ठी के प्रहार का संकेत देता है; ‘घूँसों से मारा’ सामान्य पाठक के लिए स्पष्ट और ठोस है।
- source_word: οἱ δὲ ἐράπισαν
  choice: और कुछ लोगों ने उसे थप्पड़ मारे
  rationale: संज्ञात्मक οἱ का अर्थ यहाँ दूसरे या कुछ लोग है, और ῥαπίζω प्रायः खुले हाथ से प्रहार, अर्थात थप्पड़ मारना, दर्शाता है। प्रसंग से निहित कर्म ‘उसे’ हिन्दी में स्पष्ट किया गया है।
- source_word: δέ
  choice: और
  rationale: यहाँ δέ तीव्र विरोध नहीं, बल्कि दूसरे समूह या अगली क्रिया की ओर हल्का संक्रमण दिखाता है; ‘और’ स्वाभाविक है।
theological_decisions:
- issue: महासभा के सामने यीशु के अपमान और शारीरिक दुर्व्यवहार का वर्णन
  choice: थूकने, घूँसों से मारने और थप्पड़ मारने की क्रियाओं को ठोस और स्पष्ट रूप में प्रस्तुत किया गया है।
  alternative: इसे सामान्य शब्दों में ‘उसके साथ दुर्व्यवहार किया’ या ‘उसे पीटा’ कहा जा सकता था।
  rationale: मूल पाठ अपमान और हिंसा के अलग-अलग कृत्यों पर जोर देता है। स्पष्ट अनुवाद कथात्मक तीव्रता बनाए रखता है और अतिरिक्त धर्मवैचारिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मुँह पर थूका’ हिन्दी का स्वाभाविक मुहावरा है, जबकि पादटिप्पणी में ‘चेहरे’ वाला अधिक शाब्दिक विकल्प सुरक्षित रखा गया है।
