source:
  edition: SBLGNT
  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: hi
  text: या क्या तुम सोचते हो कि मैं अपने पिता से विनती नहीं कर सकता[a], और वह अभी मेरी सहायता के लिए स्वर्गदूतों के बारह से अधिक लीजनों को उपलब्ध नहीं करा देगा[b]?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पिता को पुकार नहीं सकता” अथवा “अपने पिता से माँग नहीं सकता।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “मेरे पास उपस्थित कर देगा”; अर्थात मेरी सहायता के लिए उपलब्ध करा देगा।
    reason: lexical_alternative
  - marker: c
    text: रोमी सेना में ‘लीजन’ एक बहुत बड़ी सैन्य इकाई थी; यह अभिव्यक्ति स्वर्गीय सेना की अत्यधिक विशाल संख्या पर बल देती है।
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: या
  rationale: यह यीशु की फटकार में एक वैकल्पिक प्रश्न प्रस्तुत करता है और पिछले कथन से स्वाभाविक संबंध बनाए रखता है।
- source_word: δοκεῖς
  choice: क्या तुम सोचते हो
  rationale: प्रत्यक्ष आलंकारिक प्रश्न का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: οὐ δύναμαι
  choice: मैं ... नहीं कर सकता
  rationale: यह अनुमति या इच्छा नहीं, बल्कि सामर्थ्य को व्यक्त करता है; यूनानी की नकारात्मक प्रश्नात्मक संरचना सुरक्षित रखी गई है।
- source_word: παρακαλέσαι
  choice: विनती करना
  rationale: सहायता के लिए पिता से गंभीर अनुरोध करने का भाव देता है; ‘पुकारना’ और ‘माँगना’ भी संभव हैं।
- source_word: τὸν πατέρα μου
  choice: अपने पिता से
  rationale: यीशु और पिता के संबंध को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παραστήσει μοι
  choice: मेरे लिए ... उपस्थित कर देगा
  rationale: मूल क्रिया के ‘पास उपस्थित/उपलब्ध करा देना’ के चित्र को बनाए रखता है और केवल ‘भेज देगा’ कहकर अर्थ को सीमित नहीं करता।
- source_word: ἄρτι
  choice: अभी
  rationale: तत्काल उपलब्धता का अर्थ संक्षेप और स्वाभाविक रूप से देता है।
- source_word: πλείω δώδεκα
  choice: बारह ... से भी अधिक
  rationale: बारह से अधिक मात्रा का सीधा और स्पष्ट अनुवाद।
- source_word: λεγιῶνας
  choice: पलटनों
  rationale: रोमी सैन्य इकाइयों की छवि को हिन्दी में समझने योग्य सैन्य शब्द से व्यक्त करता है; इसका तकनीकी आकार पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἀγγέλων
  choice: स्वर्गदूतों की
  rationale: इस प्रसंग में मानव संदेशवाहक नहीं, स्वर्गीय प्राणी अभिप्रेत हैं।
theological_decisions:
- issue: क्या कथन यीशु की असमर्थता, अनुमति या इच्छा से संबंधित है
  choice: 'सामर्थ्य के रूप में: ‘मैं ... नहीं कर सकता’'
  alternative: इसे अनिच्छा या अनुमति के अभाव के रूप में ढीले ढंग से व्यक्त करना
  rationale: δύναμαι सामर्थ्य बताता है। नकारात्मक आलंकारिक प्रश्न इस बात पर बल देता है कि यीशु सहायता बुलाने में असमर्थ नहीं हैं, फिर भी पाठ यह व्याख्या नहीं जोड़ता कि वह ऐसा क्यों नहीं करते।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझने योग्य रखी गई है। ‘विनती’ गंभीर अनुरोध का भाव देती है, जबकि ‘उपस्थित कर देगा’ मूल के स्थानिक चित्र को बचाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रमशः लगाए गए हैं।
