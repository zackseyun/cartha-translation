  rationale: संदर्भ में इसका आशय उस स्थान से निकलकर गंतव्य की ओर जाने से है; ‘चले गए’ आधुनिक हिन्दी में सहज है, जबकि ‘बाहर गए’ अनावश्यक रूप से शाब्दिक लगेगा।
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: जैतून पहाड़ पर
