lexical_decisions:
- source_word: λέγοντες
  choice: और कहने लगे
  rationale: यह वर्तमान कृदन्त उपहास करने वालों की वाणी का परिचय देता है और पिछले कार्यों से जुड़ा है; हिन्दी में पद को स्वतंत्र और स्वाभाविक बनाने के लिए ‘और कहने लगे’ उपयुक्त है।
- source_word: Προφήτευσον ἡμῖν
  choice: भविष्यवाणी करके हमें बता
  rationale: आज्ञार्थक क्रिया और सम्प्रदान ‘हमें’ दोनों सुरक्षित रहते हैं; यह हिन्दी में स्वाभाविक ढंग से उस व्यंग्यपूर्ण माँग को व्यक्त करता है कि यीशु अलौकिक ज्ञान से हमलावर को पहचानें।
- source_word: χριστέ
  choice: हे मसीह
  rationale: सम्बोधन रूप में प्रयुक्त Χριστός यहाँ नाम नहीं, उपाधि है। ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में इस मसीही उपाधि का परिचित और अर्थवाही रूप है; ‘हे’ सम्बोधन को स्पष्ट करता है।
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: तुझे किसने मारा?
  rationale: यूनानी पदबंध का आशय मारने वाले की पहचान पूछना है। यह संक्षिप्त हिन्दी प्रश्न उसी अर्थ और प्रहार की ठोस क्रिया को स्वाभाविक रूप में रखता है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ χριστέ स्पष्ट सम्बोधन और उपाधि है तथा उपहास की मसीही धार को सामने लाता है। ‘मसीह’ हिन्दी पाठकों के लिए प्रचलित अर्थवाही रूप है; मात्र नाम-जैसा लिप्यन्तरण संदर्भ में उपाधि का बल कम कर सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भविष्यवाणी करके हमें बता’ मूल आज्ञा की व्यंग्यपूर्ण चुनौती को स्पष्ट करता है, और डैश पहचान पूछने वाले प्रश्न को उसी चुनौती से सीधे जोड़ता है।
