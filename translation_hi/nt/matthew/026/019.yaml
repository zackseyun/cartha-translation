  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: hi
  text: तब चेलों ने वैसा ही किया जैसा यीशु ने उन्हें निर्देश दिया था, और उन्होंने फ़सह[a] की तैयारी की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘फ़सह के भोज’; πάσχα से फ़सह का पूरा आयोजन अभिप्रेत हो सकता है, जिसमें उसके लिए तैयार किया जाने वाला भोज भी शामिल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: किया
  rationale: ὡς συνέταξεν के साथ यह स्वाभाविक रूप से निर्देश के अनुसार कार्य करने को व्यक्त करता है; ‘किया’ सरल और सटीक है।
- source_word: οἱ μαθηταὶ
  choice: चेलों
  rationale: सुसमाचारों में μαθηταί के लिए प्रचलित और सामान्य पाठकों को सहज रूप से समझ आने वाला संबंधपरक शब्द।
- source_word: ὡς
  choice: वैसा ही ... जैसा
  rationale: यह यीशु के निर्देश और चेलों के कार्य के बीच अनुरूपता को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: συνέταξεν
  choice: निर्देश दिया था
  rationale: συντάσσω यहाँ अधिकारपूर्वक निर्देश देने के अर्थ में है; ‘दिया था’ उस निर्देश के पहले दिए जाने को भी व्यक्त करता है।
- source_word: ἡτοίμασαν
  choice: तैयारी की
  rationale: ἑτοιμάζω का प्रसंगानुकूल, सहज हिन्दी रूप, जो फ़सह के लिए आवश्यक प्रबंध करने को दर्शाता है।
- source_word: τὸ πάσχα
  choice: फ़सह
  rationale: यूनानी शब्द की व्यापकता बनाए रखता है; यह पर्व, उसका भोजन या उससे जुड़ी विधि का संकेत दे सकता है, इसलिए मुख्य पाठ में ‘भोज’ या ‘मेमना’ जोड़कर अर्थ सीमित नहीं किया गया।
- source_word: ὁ Ἰησοῦς
  choice: यीशु
  rationale: नाम का हिन्दी बाइबलीय परंपरा में मानक रूप।
theological_decisions:
- issue: τὸ πάσχα का अर्थ-क्षेत्र
  choice: फ़सह
  alternative: फ़सह का भोज; फ़सह का मेमना
  rationale: प्रसंग भोजन की तैयारी की ओर संकेत करता है, पर यूनानी संज्ञा स्वयं अर्थ को केवल भोज या मेमने तक सीमित नहीं करती। अतः मुख्य पाठ में व्यापक पद रखा गया और संभावित संकीर्ण अर्थ पाद-टिप्पणी में बताया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘चेला’ तथा ‘फ़सह’ हिन्दी बाइबल पाठकों में परिचित शब्द हैं। वाक्य-संरचना मूल के दो समन्वित कार्यों को बनाए रखती है।
