lexical_decisions:
- source_word: δὲ
  choice: अलग से अनूदित नहीं
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है। हिन्दी में नया वाक्य और प्रसंग-क्रम उसके कार्य को स्वाभाविक रूप से व्यक्त करते हैं; ‘अब’ जोड़ने से अनावश्यक काल-सूचक भाव आ सकता है।
- source_word: ἐκάθητο ἔξω
  choice: बाहर ... बैठा हुआ था
  rationale: अपूर्ण भूतकाल चल रही अवस्था को दिखाता है; ‘बैठा हुआ था’ इसे सहज हिन्दी में बनाए रखता है, और ἔξω के लिए ‘बाहर’ रखा गया है।
- source_word: ἐν τῇ αὐλῇ
  choice: आँगन में
  rationale: αὐλή यहाँ महायाजक के निवास के खुले प्रांगण को सूचित करता है। साधारण आधुनिक हिन्दी में ‘आँगन’ स्पष्ट और स्वाभाविक है।
- source_word: προσῆλθεν αὐτῷ
  choice: उसके पास आई
  rationale: क्रिया शारीरिक रूप से निकट आने को व्यक्त करती है; यह हिन्दी में सीधा और स्वाभाविक रूप है।
- source_word: μία παιδίσκη
  choice: एक दासी
  rationale: μία का परिचयात्मक ‘एक’ बनाए रखा गया है। παιδίσκη किसी युवती सेविका को, कभी दास-स्थिति वाली लड़की को, सूचित कर सकता है; ‘दासी’ सामाजिक भूमिका को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: λέγουσα
  choice: और बोली
  rationale: यूनानी वर्तमान कृदंत को हिन्दी कथन-प्रवाह में समापिका क्रिया के रूप में देना अधिक स्वाभाविक है और अर्थ को नहीं बदलता।
- source_word: Καὶ σὺ
  choice: तुम भी
  rationale: καί यहाँ बलयुक्त σὺ के साथ पतरस को यीशु से जुड़े अन्य लोगों में सम्मिलित करता है; ‘तुम भी’ इस बल को स्पष्ट रखता है।
- source_word: ἦσθα μετὰ
  choice: के साथ थे
  rationale: मूल का सीधा संबंधपरक अर्थ रखा गया है; इसे ‘अनुयायी थे’ कहना अनावश्यक व्याख्यात्मक विस्तार होता।
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: उस गलीली यीशु
  rationale: Γαλιλαίου को पहचान बताने वाली उपाधि के रूप में ‘गलीली’ दिया गया है। हिन्दी में संकेतवाचक ‘उस’ कथन के आरोपात्मक और पहचानसूचक संदर्भ को स्वाभाविक बनाता है, बिना मूल आशय बदले।
