  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: hi
  text: उन्होंने कहा, “इसने कहा, ‘मैं परमेश्वर के मंदिर को ढा सकता हूँ और तीन दिनों में[a] उसे बना सकता हूँ।’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तीन दिनों के भीतर।” यूनानी अभिव्यक्ति उस समयावधि के दौरान कार्य पूरा होने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: यूहन्ना 2:19–21 में मंदिर के विषय में यीशु के कथन को उसके शरीर के संदर्भ में बताया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: उन्होंने कहा
  rationale: एओरिस्ट क्रिया गवाहों के आरोप को कथा में एक साधारण भूतकालीन घटना के रूप में प्रस्तुत करती है।
- source_word: Οὗτος
  choice: इसने
  rationale: न्यायिक आरोप के प्रसंग में यह स्वाभाविक हिन्दी है और संकेतात्मक तथा कुछ हद तक तिरस्कारपूर्ण बल को बनाए रखती है।
- source_word: ἔφη
  choice: कहा था
  rationale: यह कथित पूर्व कथन का सीधा उल्लेख है; हिन्दी का पूर्ण भूतकाल आरोप के भीतर समय-संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: Δύναμαι
  choice: मैं ... सकता हूँ
  rationale: यह सामर्थ्य व्यक्त करने वाली यूनानी क्रिया का सहज और सटीक हिन्दी रूप है।
- source_word: καταλῦσαι
  choice: ढा सकता हूँ
  rationale: इमारत या मंदिर के प्रसंग में क्रिया का अर्थ गिराना या नष्ट करना है; ‘ढाना’ निर्माण-संबंधी विरोधाभास को स्पष्ट रखता है।
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: परमेश्वर के मंदिर को
  rationale: ναός यहाँ मंदिर को सूचित करता है और संबंधकारक τοῦ θεοῦ को स्वाभाविक हिन्दी में ‘परमेश्वर के’ से व्यक्त किया गया है।
- source_word: διὰ τριῶν ἡμερῶν
  choice: तीन दिनों में
  rationale: διά और संबंधकारक कालावधि के भीतर कार्य पूरा होने का भाव दे सकते हैं; यह हिन्दी उस वास्तविक अर्थगत विस्तार को संक्षेप में बनाए रखती है।
- source_word: οἰκοδομῆσαι
  choice: उसे बना सकता हूँ
  rationale: यूनानी क्रिया मूलतः ‘बनाना’ है; हिन्दी में पहले उल्लिखित मंदिर के लिए ‘उसे’ जोड़ना आवश्यक और स्वाभाविक है, जबकि ‘फिर से बनाना’ अनावश्यक व्याख्या जोड़ता।
theological_decisions:
- issue: आरोप में ‘परमेश्वर के मंदिर’ का संदर्भ
  choice: मुख्य पाठ में गवाहों के आरोप को भौतिक मंदिर के विषय में कही गई बात के रूप में यथावत प्रस्तुत किया गया है।
  alternative: यूहन्ना 2:19–21 के आधार पर मुख्य पाठ में ‘मंदिर’ को सीधे यीशु का शरीर कहना।
  rationale: मत्ती यहाँ मुकदमे के दौरान गवाहों का आरोप सुना रहा है। यूहन्ना की व्याख्यात्मक पहचान को मुख्य पाठ में मिला देने के बजाय पादटिप्पणी में देना मत्ती के कथात्मक स्तर और धर्मवैज्ञानिक तनाव दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। ‘इसने’ आरोप लगाने वालों की संकेतात्मक कठोरता को स्वाभाविक हिन्दी में व्यक्त करता है। पादटिप्पणी [a] को संबंधित कालवाचक पद के बाद और [b] को पूरे कथन के बाद रखा गया है।
