translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नाराज़ हो गए’ साधारण पाठक के लिए ‘क्रोधित/कुपित हुए’ से अधिक स्वाभाविक है, जबकि मूल की तीव्र अप्रसन्नता को पर्याप्त रूप से व्यक्त करता है।
