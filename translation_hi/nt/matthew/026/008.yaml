  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ ἠγανάκτησαν λέγοντες· Εἰς τί ἡ ἀπώλεια αὕτη;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/008.yaml
  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: hi
  text: पर यह देखकर शिष्य क्रोधित हो गए और कहने लगे, “यह बरबादी क्यों?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह बरबादी किसलिए?”
    reason: Εἰς τί के उद्देश्यसूचक अर्थ (‘किस प्रयोजन से/किसलिए’) को स्पष्ट करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ἰδόντες
  choice: यह देखकर
  rationale: अओरिस्ट कृदंत को स्वाभाविक हिन्दी में कालसूचक रूप दिया गया है। Greek में कर्म निहित है; ‘यह’ पिछली घटना, अर्थात स्त्री के अभिषेक, की ओर संकेत करता है।
- source_word: δὲ
  choice: वाक्य के प्रवाह में अलग शब्द से व्यक्त नहीं
  rationale: δέ यहाँ हल्का घटनात्मक मोड़ या विरोध दिखाता है। हिन्दी में ‘यह देखकर’ से प्रतिक्रिया का मोड़ स्वाभाविक रूप से स्पष्ट हो जाता है; ‘लेकिन’ जोड़ना अनावश्यक रूप से अधिक प्रबल विरोध पैदा कर सकता था।
- source_word: οἱ μαθηταὶ
  choice: शिष्य
  rationale: सुसमाचार के संदर्भ में μαθηταί का मानक, स्पष्ट और स्वाभाविक हिन्दी रूप। Greek में ‘उसके’ स्पष्ट रूप से नहीं है, इसलिए नहीं जोड़ा गया।
- source_word: ἠγανάκτησαν
  choice: नाराज़ हो गए
  rationale: ἀγανακτέω तीव्र अप्रसन्नता या रोष व्यक्त करता है। ‘नाराज़ हो गए’ आधुनिक सामान्य हिन्दी में सहज है और प्रतिक्रिया की तीव्रता बनाए रखता है।
- source_word: λέγοντες
  choice: और कहने लगे
  rationale: कृदंत को हिन्दी के स्वाभाविक संयुक्त क्रियात्मक ढाँचे में रखा गया है; ‘कहने लगे’ प्रत्यक्ष कथन का सहज परिचय देता है।
- source_word: Εἰς τί
  choice: क्यों
  rationale: शाब्दिक अर्थ ‘किस उद्देश्य से/किसलिए’ है, पर प्रश्न की स्वाभाविक हिन्दी शक्ति ‘क्यों’ से स्पष्ट होती है। अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: ἡ ἀπώλεια αὕτη
  choice: यह बरबादी
  rationale: ἀπώλεια के अर्थ-क्षेत्र में नाश, हानि और अपव्यय आते हैं। महँगे इत्र को उँडेलने के संदर्भ में ‘बरबादी’ सामान्य हिन्दी में सबसे उपयुक्त है।
