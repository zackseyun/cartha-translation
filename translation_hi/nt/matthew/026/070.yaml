  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: hi
  text: पर उसने सबके सामने इनकार किया और कहा, “मैं नहीं जानता कि तुम क्या कह रही हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: इनकार करते हुए
  rationale: क्रिया यहाँ पिछली बात या आरोप को नकारने का संकेत देती है। हिन्दी में अलग से कर्म जोड़े बिना ‘इनकार’ कहना स्वाभाविक है और यूनानी पाठ की अनिर्दिष्टता बनाए रखता है।
- source_word: ἔμπροσθεν πάντων
  choice: सबके सामने
  rationale: यह वाक्यांश सार्वजनिक रूप से, वहाँ उपस्थित सभी लोगों की मौजूदगी में इनकार किए जाने को व्यक्त करता है।
- source_word: λέγων
  choice: कहा
  rationale: यूनानी कृदंत को ‘इनकार करते हुए कहा’ के रूप में देना हिन्दी में प्रवाहपूर्ण है और दोनों क्रियाओं का संबंध बनाए रखता है।
- source_word: Οὐκ οἶδα
  choice: मैं नहीं जानता
  rationale: यह जानने से स्पष्ट इनकार है; वक्ता पतरस होने के कारण पुल्लिंग रूप ‘जानता’ उपयुक्त है।
- source_word: τί λέγεις
  choice: तुम क्या कह रही हो
  rationale: यह यूनानी अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप है। संदर्भ में संबोधित व्यक्ति दासी है, इसलिए हिन्दी में आवश्यक स्त्रीलिंग रूप प्रयुक्त हुआ है।
theological_decisions:
- issue: पतरस के इनकार का विषय
  choice: इनकार का कोई स्पष्ट कर्म नहीं जोड़ा गया
  alternative: ‘उस बात से इनकार किया’ या ‘यीशु को जानने से इनकार किया’
  rationale: यूनानी पाठ केवल ‘उसने इनकार किया’ कहता है और विषय को तत्काल प्रसंग से समझने देता है। इसलिए अनुवाद आरोप या संबंध की ऐसी अतिरिक्त व्याख्या नहीं जोड़ता जिसे इस पद में स्पष्ट रूप से नहीं कहा गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘सबके सामने’ सार्वजनिक परिस्थिति को स्वाभाविक ढंग से व्यक्त करता है। प्रत्यक्ष कथन में ‘तुम क्या कह रही हो’ मूल वाक्य के निकट रहते हुए सामान्य हिन्दी में स्पष्ट है।
