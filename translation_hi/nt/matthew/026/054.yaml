  text: तो फिर पवित्र शास्त्र कैसे पूरे होंगे[a] कि ऐसा ही होना आवश्यक है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो फिर पवित्र शास्त्र कैसे पूरे हो सकते हैं कि ऐसा होना ही आवश्यक है?”
    reason: यूनानी संभावनार्थक आलंकारिक प्रश्न को ‘कैसे पूरे हो सकते हैं’ से भी व्यक्त किया जा सकता है; ‘ऐसा ही’ के स्थान पर ‘ऐसा होना ही’ समान बल को अधिक स्पष्ट रूप में रखता है।
lexical_decisions:
- source_word: πῶς οὖν
  choice: तो फिर ... कैसे
  rationale: यह स्वाभाविक हिन्दी में पूर्व कथन से निष्कर्षात्मक संबंध और आलंकारिक प्रश्न—दोनों को बनाए रखता है।
- source_word: πληρωθῶσιν
  choice: पूरी होंगी
  rationale: अोरिस्ट कर्मवाच्य संभावनार्थक रूप को प्रसंग में भविष्याभिमुख आलंकारिक प्रश्न के रूप में व्यक्त करता है; कर्ता को जोड़े बिना कर्मवाच्य भाव सुरक्षित रहता है।
- source_word: αἱ γραφαὶ
  choice: पवित्र शास्त्र की बातें
  rationale: बहुवचन γραφαί इस्राएल के पवित्र लेखों की ओर संकेत करता है। 'की बातें' हिन्दी में उनके कथनों/वचनों के पूरा होने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὅτι
  choice: कि
  rationale: यह आगे आने वाली बात को शास्त्र की विषय-वस्तु के रूप में प्रस्तुत करता है और यूनानी की संभावित व्याख्यात्मक संबद्धता को खुला रखता है।
- source_word: οὕτως
  choice: ऐसा ही
  rationale: घटनाओं के इसी ढंग से घटने पर बल देता है और οὕτως का संकेतात्मक तथा बलात्मक भाव बनाए रखता है।
- source_word: δεῖ γενέσθαι
  choice: होना आवश्यक है
  rationale: δεῖ की आवश्यकता और γενέσθαι के घटना/होने के अर्थ को स्पष्ट, गरिमापूर्ण आधुनिक हिन्दी में रखता है, बिना आवश्यकता के स्रोत को पाठ से अधिक स्पष्ट किए।
theological_decisions:
- issue: δεῖ द्वारा व्यक्त आवश्यकता का स्वरूप
  choice: '''होना आवश्यक है''—बिना ''परमेश्वर की योजना के अनुसार'' जैसी व्याख्या जोड़े'
  alternative: '''परमेश्वर की इच्छा के अनुसार ऐसा होना ही चाहिए'''
  rationale: शास्त्र की पूर्ति के प्रसंग में दैवी आवश्यकता निहित है, पर यूनानी पाठ उसका विस्तृत धर्मवैज्ञानिक स्पष्टीकरण नहीं देता। इसलिए निहितार्थ को बनाए रखते हुए अतिरिक्त सिद्धान्त नहीं जोड़ा गया।
- issue: ὅτι का संबंध
  choice: '''कि'' द्वारा इसे शास्त्रों की विषय-वस्तु से जोड़ना'
  alternative: '''क्योंकि'' द्वारा कारणसूचक संबंध बनाना'
  rationale: यहाँ ὅτι को विषय-वस्तु सूचक समझना अधिक सीधा है, फिर भी पादटिप्पणी वैकल्पिक वाक्य-विन्यास के माध्यम से मूल की संक्षिप्तता और संभावित अस्पष्टता दर्शाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। 'पवित्र शास्त्र' सामान्य पाठक के लिए स्थापित धार्मिक पद है। आलंकारिक प्रश्न और शास्त्रीय आवश्यकता के बीच तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
