id: MAT.26.31
reference: Matthew 26:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: hi
  text: तब यीशु उनसे कहते हैं, “आज रात तुम सब मेरे कारण ठोकर खाकर मेरा साथ छोड़ दोगे[a], क्योंकि लिखा है, ‘मैं चरवाहे पर प्रहार करूँगा, और झुंड की भेड़ें तितर-बितर हो जाएँगी।’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ “ठोकर खाना,” “ठोकर खिलाया जाना” या “विमुख हो जाना” भी हो सकता है। यहाँ संदर्भ यीशु का साथ छोड़ देने की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: यह जकर्याह 13:7 का उद्धरण है।
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह कथा में अगली घटना का स्वाभाविक काल-सूचक है।
- source_word: λέγει
  choice: कहते हैं
  rationale: यूनानी ऐतिहासिक वर्तमान को बनाए रखकर कथा की जीवंतता सुरक्षित रखी गई है।
- source_word: Πάντες ὑμεῖς
  choice: तुम सब
  rationale: मूल के स्पष्ट बलाघात को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σκανδαλισθήσεσθε
  choice: ठोकर खाकर मेरा साथ छोड़ दोगे
  rationale: क्रिया में ठोकर खाने से लेकर विमुख होने तक अर्थ-सीमा है; निकट संदर्भ शिष्यों द्वारा यीशु को छोड़ देने की ओर संकेत करता है, जबकि ‘ठोकर’ मूल रूपक को भी बचाए रखता है।
- source_word: ἐν ἐμοὶ
  choice: मेरे कारण
  rationale: यहाँ वाक्यांश यीशु के संबंध में उत्पन्न ठोकर का कारणात्मक भाव प्रकट करता है।
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: आज रात
  rationale: मूल के ‘इस रात’ का आधुनिक और स्वाभाविक हिन्दी रूप।
- source_word: γέγραπται γάρ
  choice: क्योंकि लिखा है
  rationale: पवित्रशास्त्र का उद्धरण प्रस्तुत करने वाले यूनानी सूत्र का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: Πατάξω
  choice: मैं ... प्रहार करूँगा
  rationale: साधारण अर्थ को बिना यह अतिरिक्त रूप से निश्चित किए व्यक्त करता है कि प्रहार का परिणाम तत्काल मृत्यु ही होगा।
- source_word: τὸν ποιμένα
  choice: चरवाहे
  rationale: शास्त्रीय रूपक का सीधा और परिचित हिन्दी अनुवाद।
- source_word: διασκορπισθήσονται
  choice: तितर-बितर हो जाएँगी
  rationale: भविष्यत् निष्क्रिय भाव और बिखराव की चित्रात्मकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ πρόβατα τῆς ποίμνης
  choice: झुंड की भेड़ें
  rationale: मूल में ‘भेड़ें’ और ‘झुंड’ दोनों को बनाए रखते हुए हिन्दी की स्वाभाविक शब्द-रचना अपनाई गई है।
theological_decisions:
- issue: σκανδαλισθήσεσθε का यीशु के संबंध में अर्थ
  choice: शिष्य यीशु के साथ घटने वाली बातों के कारण ठोकर खाकर उस रात उनका साथ छोड़ देंगे।
  alternative: वे केवल यीशु से नाराज़ होंगे, अथवा सामान्य नैतिक अर्थ में पाप में पड़ेंगे।
  rationale: आगे का संदर्भ शिष्यों के तितर-बितर होने और यीशु को छोड़ने का है। अनुवाद उस संदर्भगत बल को व्यक्त करता है, पर इसे अंतिम धर्मत्याग की किसी बाद की पारिभाषिक श्रेणी में नहीं बदलता।
- issue: λέγει का ऐतिहासिक वर्तमान
  choice: ‘कहते हैं’ के रूप में वर्तमान काल बनाए रखा गया है।
  alternative: कथात्मक भूतकाल ‘कहा’।
  rationale: यह यूनानी कथाशैली की जीवंतता को सुरक्षित रखता है और अर्थ में कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: जकर्याह 13:7 के उद्धरण की वक्ता-भाषा
  choice: ‘मैं चरवाहे पर प्रहार करूँगा’ को प्रथम पुरुष में ज्यों का त्यों रखा गया है।
  alternative: वक्ता की पहचान स्पष्ट करने के लिए कोई व्याख्यात्मक पद जोड़ना।
  rationale: मूल पाठ वक्ता की पहचान की व्याख्या यहाँ नहीं करता; इसलिए उद्धरण का धर्मवैज्ञानिक तनाव बिना विस्तार के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में शिष्यों के लिए स्वाभाविक ‘तुम’; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट है। ‘ठोकर खाकर मेरा साथ छोड़ दोगे’ मूल रूपक और संदर्भगत अर्थ दोनों को साथ रखता है।
