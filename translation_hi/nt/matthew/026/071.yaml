  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: hi
  text: पर जब वह निकलकर फाटक के पास गया, तो एक दूसरी स्त्री ने उसे देखा और वहाँ मौजूद लोगों से कहती है, “यह आदमी नासरत के यीशु के साथ था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλῶνα
  choice: फाटक
  rationale: यह प्रवेश-द्वार या फाटक के क्षेत्र को दर्शाता है; प्रसंग में स्वाभाविक और सामान्य हिन्दी शब्द।
- source_word: ἄλλη
  choice: एक दूसरी स्त्री
  rationale: ग्रीक विशेषण स्त्रीलिंग है और पहले उल्लेखित दासी से भिन्न स्त्री की ओर संकेत करता है।
- source_word: λέγει
  choice: कहती है
  rationale: ऐतिहासिक वर्तमान को स्रोत के कथात्मक प्रभाव और काल-परिवर्तन सहित सुरक्षित रखा गया है।
- source_word: τοῦ Ναζωραίου
  choice: नासरत के
  rationale: यीशु की नासरत से पहचान/संबंध को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
