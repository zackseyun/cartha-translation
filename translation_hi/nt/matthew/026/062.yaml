source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: hi
  text: और महायाजक ने खड़े होकर उससे कहा, “क्या तुम कोई उत्तर नहीं देते? ये लोग तुम्हारे विरुद्ध क्या गवाही दे रहे हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: खड़े होकर
  rationale: यह क्रिया महायाजक के बोलने से पहले उसके शारीरिक रूप से उठकर खड़े होने को व्यक्त करती है; ‘खड़े होकर’ आधुनिक हिन्दी में स्वाभाविक है और दृश्य की नाटकीयता बनाए रखती है।
- source_word: ὁ ἀρχιερεὺς
  choice: महायाजक
  rationale: यह उस समय के यहूदी प्रधान याजकीय पद का प्रचलित और सटीक हिन्दी नाम है।
- source_word: εἶπεν αὐτῷ
  choice: उससे कहा
  rationale: यूनानी पाठ में सर्वनाम है; इसलिए नाम जोड़ने के बजाय उसी संदर्भगत सर्वनाम को रखा गया है।
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: क्या तुम कोई उत्तर नहीं देते?
  rationale: यह मूल के नकारात्मक प्रश्न और उत्तर की माँग—दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὗτοί
  choice: ये लोग
  rationale: पुल्लिंग बहुवचन संकेतवाचक शब्द उपस्थित गवाहों की ओर संकेत करता है; ‘ये लोग’ अनावश्यक रूप से उनका लिंग प्रमुख किए बिना संदर्भ स्पष्ट करता है।
- source_word: σου καταμαρτυροῦσιν
  choice: तुम्हारे विरुद्ध ... गवाही दे रहे हैं
  rationale: καταμαρτυρέω का यहाँ न्यायिक और विरोधात्मक अर्थ है; यह केवल किसी के विषय में बोलना नहीं, बल्कि उसके विरुद्ध साक्ष्य देना है।
- source_word: τί
  choice: क्या
  rationale: सरल प्रश्नवाचक रूप मूल पाठ की संक्षिप्तता और गवाही की विषयवस्तु पूछने वाले आशय को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। न्यायिक संदर्भ को ‘विरुद्ध गवाही दे रहे हैं’ से स्पष्ट किया गया है, पर मूल पाठ से बाहर कोई आरोप या व्याख्या नहीं जोड़ी गई।
