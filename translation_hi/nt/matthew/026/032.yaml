  text: But after I am raised up[a], I will go ahead of you into Galilee.
translation:
  language: hi
  text: लेकिन मुझे जिलाए जाने के बाद[a], मैं तुमसे पहले गलील जाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “मेरे जी उठने के बाद।” यूनानी में अधिक शाब्दिक रूप से कर्मवाच्य प्रयोग है: “मुझे जिलाए जाने के बाद।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: लेकिन ... के बाद
  rationale: μετά के साथ भाववाचक क्रिया समयक्रम, ‘के बाद,’ बताती है; δέ पिछले पद में शिष्यों के ठोकर खाने की भविष्यवाणी के साथ हल्का विरोध प्रकट करता है, इसलिए ‘लेकिन’ स्वाभाविक है।
- source_word: τὸ ἐγερθῆναί με
  choice: मेरे जिलाए जाने के बाद
  rationale: ἐγερθῆναι अओरिस्ट कर्मवाच्य infinitive है और με उसका कर्ता है। ‘जिलाए जाने’ से यूनानी का कर्मवाच्य रूप बना रहता है और पुनरुत्थान के प्रसंग में निहित दिव्य कर्तृत्व को स्पष्ट रूप से जोड़ा नहीं जाता।
- source_word: προάξω
  choice: मैं तुमसे पहले ... जाऊँगा
  rationale: प्रसंग में προάγω का अर्थ किसी से पहले या आगे जाना है। यह हिंदी प्रयोग दिशात्मक अर्थ को स्वाभाविक ढंग से रखता है और इसे अनावश्यक रूप से ‘अगुवाई करने’ के अर्थ तक सीमित नहीं करता।
- source_word: ὑμᾶς
  choice: तुमसे
  rationale: यह द्वितीय पुरुष बहुवचन है। शिष्यों को सामूहिक रूप से संबोधित करने के लिए आधुनिक मानक हिंदी में ‘तुमसे’ स्वाभाविक है।
- source_word: εἰς τὴν Γαλιλαίαν
  choice: गलील जाऊँगा
  rationale: εἰς गलील की ओर अथवा उसमें जाने की गति बताता है। हिंदी में स्थान के साथ ‘गलील जाऊँगा’ स्वाभाविक है और वही दिशात्मक आशय व्यक्त करता है।
theological_decisions:
- issue: ἐγερθῆναί में पुनरुत्थान का कर्मवाच्य रूप
  choice: ‘मेरे जिलाए जाने के बाद’ कहकर कर्मवाच्य रूप सुरक्षित रखा गया।
  alternative: ‘मेरे जी उठने के बाद’
  rationale: यूनानी पाठ स्पष्ट रूप से कर्मवाच्य है। उसे बनाए रखने से पाठ के रूप और पुनरुत्थान के प्रसंग में निहित, पर अनुक्त, कर्तृत्व दोनों का सम्मान होता है; पादटिप्पणी अधिक प्रचलित कर्तृवाच्य हिंदी विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जिलाए जाने’ थोड़ा औपचारिक होते हुए भी मूल के कर्मवाच्य रूप को स्पष्ट रखता है; पादटिप्पणी में अधिक बोलचाल का ‘जी उठने’ वाला विकल्प दिया गया है।
