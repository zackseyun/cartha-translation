lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: जब शाम हुई
  rationale: यह संबंधकारक निरपेक्ष रचना समय की पृष्ठभूमि बताती है। ‘जब शाम हुई’ स्वाभाविक आधुनिक हिन्दी में उसका कालगत अर्थ सुरक्षित रखता है।
- source_word: ἀνέκειτο
  choice: भोजन करने बैठा
  rationale: यूनानी क्रिया भोजन के लिए मेज़ के पास टेक लगाकर लेटने की प्राचीन मुद्रा को सूचित करती है। हिन्दी में ‘भोजन करने बैठा’ प्रसंग का स्वाभाविक अर्थ देता है; शाब्दिक ‘लेट गया’ आधुनिक पाठक को भटका सकता है।
- source_word: μετὰ
  choice: के साथ
  rationale: संबंधकारक के साथ μετά संगति का सीधा अर्थ देता है, जिसे हिन्दी में ‘के साथ’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῶν δώδεκα μαθητῶν
  choice: बारह शिष्यों
  rationale: SBLGNT के मुख्य पाठ में μαθητῶν उपस्थित है, इसलिए उसका अनुवाद ‘शिष्यों’ किया गया है; ‘बारह’ निश्चित और पहचाने हुए समूह को दर्शाता है।
