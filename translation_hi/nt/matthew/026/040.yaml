id: MAT.26.40
reference: Matthew 26:40
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: hi
  text: और वह शिष्यों के पास आते हैं और उन्हें सोते हुए पाते हैं। वह पतरस से कहते हैं, “तो क्या तुम लोग मेरे साथ एक घंटा भी जागते नहीं रह सके[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे साथ एक घंटा भी चौकसी नहीं कर सके?”
    reason: γρηγορέω का अर्थ प्रसंग में ‘जागते रहना’ है, पर इसमें सतर्क रहने या चौकसी करने का भाव भी हो सकता है।
lexical_decisions:
- source_word: ἔρχεται
  choice: आते हैं
  rationale: यूनानी ऐतिहासिक वर्तमान को बनाए रखता है और वर्णन को सजीव बनाता है; हिन्दी कथा में यह प्रयोग स्वाभाविक है।
- source_word: πρὸς τοὺς μαθητὰς
  choice: शिष्यों के पास
  rationale: गति के साथ प्रयुक्त πρός का सहज और सटीक हिन्दी रूप।
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: उन्हें सोते हुए पाते हैं
  rationale: वर्तमान कृदन्त की क्रियात्मकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: λέγει τῷ Πέτρῳ
  choice: वह पतरस से कहते हैं
  rationale: ऐतिहासिक वर्तमान तथा स्पष्ट एकवचन सम्बोधित व्यक्ति पतरस—दोनों को सुरक्षित रखता है।
- source_word: Οὕτως
  choice: तो क्या
  rationale: यहाँ οὕτως आश्चर्य और हल्की झिड़की के साथ निष्कर्षात्मक प्रश्न आरम्भ करता है; ‘तो क्या’ आधुनिक हिन्दी में उस भाव को सहज ढंग से व्यक्त करता है।
- source_word: οὐκ ἰσχύσατε
  choice: नहीं रह सके
  rationale: ἰσχύω की सामर्थ्य-सूचक भावना को ‘सके’ व्यक्त करता है। बहुवचन क्रिया का अर्थ ‘तुम लोग’ द्वारा स्पष्ट रखा गया है।
- source_word: μίαν ὥραν
  choice: एक घंटा भी
  rationale: समयावधि का स्वाभाविक आधुनिक हिन्दी रूप; ‘भी’ प्रश्न में निहित झिड़की और इतनी-सी अवधि पर बल को व्यक्त करता है।
- source_word: γρηγορῆσαι
  choice: जागते रहना
  rationale: सोते पाए जाने के तत्काल प्रसंग में γρηγορέω का प्राथमिक ठोस अर्थ स्पष्ट करता है, जबकि चौकसी का सम्भव भाव पाद-टिप्पणी में सुरक्षित है।
- source_word: μετ’ ἐμοῦ
  choice: मेरे साथ
  rationale: साथ होने या सहभागिता का सीधा और स्वाभाविक अनुवाद।
theological_decisions:
- issue: यीशु पतरस से कहते हैं, पर ἰσχύσατε बहुवचन है
  choice: ‘पतरस से कहते हैं’ के साथ प्रश्न में ‘तुम लोग’ रखा गया है।
  alternative: प्रश्न को केवल पतरस के लिए एकवचन बनाना, या यह समझाकर जोड़ना कि पतरस समूह का प्रतिनिधि है।
  rationale: मूल पाठ एकवचन सम्बोधित व्यक्ति और बहुवचन झिड़की के बीच तनाव बनाए रखता है। अनुवाद इसे समझाकर समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ऐतिहासिक वर्तमान के लिए ‘आते हैं,’ ‘पाते हैं,’ और ‘कहते हैं’ का प्रयोग किया गया है। ‘एक घंटा’ आधुनिक पाठक के लिए ‘एक घड़ी’ से अधिक स्पष्ट है।
