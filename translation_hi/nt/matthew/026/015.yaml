  edition: SBLGNT
  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: hi
  text: उसने कहा, “तुम मुझे क्या देने को तैयार हो? और मैं उसे तुम्हारे हवाले कर दूँगा[a]।” तब उन्होंने उसे चाँदी के तीस सिक्के तौलकर दे दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे पकड़वा दूँगा।” यूनानी क्रिया का अर्थ “सौंपना,” “हवाले करना” या, इस प्रसंग में, “विश्वासघात करके पकड़वाना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: तुम मुझे क्या देने को तैयार हो?
  rationale: θέλω इच्छा या तत्परता व्यक्त कर सकता है। सौदेबाज़ी के इस प्रसंग में ‘देने को तैयार हो’ उसका भाव स्वाभाविक और स्पष्ट रूप से रखता है।
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: मैं उसे तुम्हारे हाथ सौंप दूँगा
  rationale: παραδίδωμι का मूल अर्थ किसी को दूसरे के अधिकार या नियंत्रण में सौंपना है। ‘तुम्हारे हाथ सौंप दूँगा’ हिन्दी में स्वाभाविक है और क्रिया में सीधे ‘विश्वासघात’ का नैतिक अर्थ जोड़ने से बचता है।
- source_word: οἱ δὲ
  choice: तब उन्होंने
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है। प्रश्न के उत्तर में हुई अगली कार्रवाई को हिन्दी में ‘तब’ सहज रूप से जोड़ता है, बिना प्रबल विरोध दिखाए।
- source_word: ἔστησαν αὐτῷ
  choice: उसे ... तौलकर दे दिए
  rationale: इस भुगतान-संबंधी प्रयोग में ἵστημι राशि निर्धारित करने अथवा चाँदी तौलकर देने की ओर संकेत करता है। ‘तौलकर दे दिए’ प्राचीन चाँदी के भुगतान का ठोस व्यापारिक भाव बनाए रखता है।
- source_word: τριάκοντα ἀργύρια
  choice: चाँदी के तीस सिक्के
  rationale: ἀργύρια का अर्थ चाँदी के टुकड़े या चाँदी का धन है। ‘चाँदी के तीस सिक्के’ आधुनिक हिन्दी में स्पष्ट है और यूनानी पाठ में अनुपस्थित किसी विशेष सिक्का-मूल्य को नहीं जोड़ता।
theological_decisions:
- issue: यहूदा के प्रस्ताव में παραδώσω का अनुवाद
  choice: सौंप दूँगा
  alternative: पकड़वा दूँगा / विश्वासघात करके सौंप दूँगा
  rationale: ‘सौंप दूँगा’ यूनानी क्रिया की व्यापक अर्थ-सीमा को सुरक्षित रखता है। प्रसंग में यह कार्य विश्वासघात है, पर मूल क्रिया अपने आप में अधिक व्यापक है; इसलिए उस नैतिक अर्थ को मुख्य पाठ में अनावश्यक रूप से सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। प्रत्यक्ष कथन में स्वाभाविक सौदेबाज़ी का स्वर रखा गया है और ‘सौंपना’ द्वारा मूल यूनानी की अर्थगत व्यापकता सुरक्षित रखी गई है।
