source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: hi
  text: यीशु ने उससे कहा, “तुमने ही कहा है।[a] परन्तु मैं तुमसे कहता हूँ:[c] अब से तुम मनुष्य के पुत्र को सामर्थ्य[b] के दाहिने विराजमान और आकाश के बादलों पर आते देखोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने ऐसा कहा है।” यूनानी में यह स्वीकारात्मक उत्तर देने का एक मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: मूल यूनानी में “सामर्थ्य” परमेश्वर के लिए आदरपूर्ण परोक्ष संबोधन है।
    reason: cultural_note
  - marker: c
    text: यहाँ दानिय्येल 7:13 और भजन 110:1 की ओर संकेत है।
    reason: cross_reference
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: तुमने स्वयं कह दिया है
  rationale: यह यूनानी मुहावरे की स्वीकारात्मक शक्ति को बनाए रखता है, पर उसे सपाट ‘हाँ’ में नहीं बदलता। ‘स्वयं’ उत्तर की स्वाभाविक हिन्दी अभिव्यक्ति में वक्ता की ओर संकेत लौटाता है।
- source_word: πλὴν
  choice: फिर भी
  rationale: यह उत्तर से आगे आने वाली गंभीर घोषणा की ओर प्रबल संक्रमण दिखाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀπ’ ἄρτι
  choice: अब से
  rationale: इस बिंदु से आरम्भ होने वाली स्थिति या घटनाक्रम का समयबोध संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: ὄψεσθε
  choice: तुम ... देखोगे
  rationale: भविष्यकाल की सीधी और स्वाभाविक हिन्दी अभिव्यक्ति है; बहुवचन को ‘तुम लोगों’ और क्रिया के संदर्भ से स्पष्ट किया गया है।
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: स्थापित बाइबलीय पदवी को बनाए रखता है और दानिय्येल 7 से उसका संबंध सुरक्षित रखता है।
- source_word: καθήμενον
  choice: विराजमान
  rationale: सिर्फ शारीरिक रूप से बैठने के बजाय राजकीय प्रतिष्ठा और अधिकार का भाव व्यक्त करता है, जो भजन 110 के संकेत के अनुकूल है।
- source_word: ἐκ δεξιῶν
  choice: के दाहिने
  rationale: सम्मान, निकटता और अधिकार के बाइबलीय मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῆς δυνάμεως
  choice: सामर्थ्यवान परमेश्वर
  rationale: ग्रीक का शाब्दिक रूप ‘सामर्थ्य’ परमेश्वर के लिए श्रद्धापूर्ण परोक्ष संबोधन है। हिन्दी में केवल ‘सामर्थ्य के दाहिने’ अत्यंत अप्राकृतिक और अस्पष्ट होता; यह रूप आशय स्पष्ट करते हुए सामर्थ्य के भाव को बनाए रखता है।
- source_word: ἐρχόμενον
  choice: आते
  rationale: दानिय्येल 7 के आगमन-संबंधी संकेत को सीधी क्रियात्मक भाषा में सुरक्षित रखता है।
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: आकाश के बादलों पर
  rationale: पूर्वसर्गीय वाक्यांश का पारदर्शी अनुवाद है और दानिय्येल 7:13 की प्रतिध्वनि बनाए रखता है।
theological_decisions:
- issue: महायाजक को दिए गए उत्तर Σὺ εἶπας का बल
  choice: 'स्वीकारात्मक किंतु शब्दशः संरचना बचाने वाला उत्तर: ‘तुमने स्वयं कह दिया है।’'
  alternative: सीधा ‘हाँ’; अथवा टालने वाला अनुत्तर
  rationale: मुहावरा कथन की पुष्टि करता है, लेकिन केवल ‘हाँ’ करने से यीशु के वास्तविक शब्द मिट जाते हैं; इसे टालना मानना प्रसंग में उसकी स्वीकारात्मक शक्ति को कम करता है।
- issue: ‘सामर्थ्य’ (τῆς δυνάμεως) का अभिप्राय
  choice: परमेश्वर के लिए श्रद्धापूर्ण परोक्ष संबोधन को ‘सामर्थ्यवान परमेश्वर’ से स्पष्ट करना
  alternative: शाब्दिक ‘सामर्थ्य’; या केवल ‘परमेश्वर’
  rationale: मूल में यह परमेश्वर के लिए श्रद्धापूर्ण परोक्ष संकेत है। हिन्दी में अकेला अमूर्त संज्ञा-रूप भ्रमकारी होता, जबकि केवल ‘परमेश्वर’ मूल के सामर्थ्य-तत्त्व को हटा देता। पादटिप्पणी मूल अभिव्यक्ति बताती है।
- issue: ‘तुम देखोगे’ में विराजमान होने और बादलों पर आने का समय-संबंध
  choice: दोनों को एक ही घोषणा के संयुक्त अंग के रूप में रखना, किसी एक काल-योजना को न थोपना
  alternative: इसे पूरी तरह निकट भविष्य में पूरा मानना; अथवा केवल अंतिम पुनरागमन से जोड़ना
  rationale: यूनानी पाठ दोनों कृदन्तों को एक साथ ‘देखोगे’ का विषय बनाता है। अनुवाद इस धर्मवैचारिक और कालगत तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य हिन्दी। ‘विराजमान’ राजकीय-अधिकार का भाव स्वाभाविक ढंग से देता है। संबोधन में पहले एकवचन ‘उससे/तुमने’ और फिर बहुवचन ‘तुम लोगों/देखोगे’ को मूल यूनानी के बदलाव के अनुसार रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
