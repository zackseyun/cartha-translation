id: MAT.26.18
reference: Matthew 26:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: hi
  text: उसने कहा, “नगर में अमुक व्यक्ति के पास जाओ और उससे कहो, ‘गुरु कहते हैं, “मेरा समय निकट है। मैं अपने शिष्यों के साथ तुम्हारे यहाँ फ़सह मनाऊँगा।”’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπάγετε
  choice: जाओ
  rationale: आज्ञार्थक गति को स्वाभाविक और सीधी आधुनिक हिन्दी में व्यक्त करता है; अतिरिक्त बल नहीं जोड़ता।
- source_word: πρὸς τὸν δεῖνα
  choice: अमुक व्यक्ति के पास
  rationale: δεῖνα किसी जानबूझकर अनाम रखे गए, पर विशिष्ट व्यक्ति को सूचित करता है। ‘अमुक व्यक्ति’ हिन्दी में यही अर्थ गरिमापूर्ण ढंग से देता है।
- source_word: Ὁ διδάσκαλος
  choice: गुरु
  rationale: यहाँ διδάσκαλος यीशु के लिए प्रयुक्त मान्य संबोधन है। ‘गुरु’ स्वाभाविक हिन्दी में शिक्षा देने वाले आदरणीय व्यक्ति को दर्शाता है।
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: मेरा समय निकट है
  rationale: καιρός के महत्त्वपूर्ण अथवा नियत समय के भाव को व्यापक रखता है और पद से आगे बढ़कर उसका आशय निर्धारित नहीं करता।
- source_word: πρὸς σὲ
  choice: तुम्हारे यहाँ
  rationale: शाब्दिक संबंध ‘तुम्हारे साथ/पास’ है; आतिथ्य के प्रसंग में ‘तुम्हारे यहाँ’ स्थान और मेज़बानी का स्वाभाविक हिन्दी संकेत देता है, बिना ‘घर’ शब्द जोड़ने के।
- source_word: ποιῶ τὸ πάσχα
  choice: फ़सह मनाऊँगा
  rationale: ποιέω + πάσχα फ़सह का पालन/उत्सव मनाने का मुहावरा है। प्रसंग में निकट भविष्य की योजना के लिए हिन्दी भविष्यकाल स्वाभाविक है।
- source_word: τὸ πάσχα
  choice: फ़सह
  rationale: यह यहूदी पर्व का हिन्दी बाइबलीय नाम है।
- source_word: μετὰ τῶν μαθητῶν μου
  choice: अपने शिष्यों के साथ
  rationale: μαθηταί के स्थापित संबंधपरक और धार्मिक अर्थ को ‘शिष्य’ सटीक रूप से व्यक्त करता है।
theological_decisions:
- issue: यीशु के निकट आते καιρός का आशय
  choice: मेरा समय निकट है
  alternative: मेरा नियत समय निकट है / मेरी घड़ी निकट है
  rationale: यह पद उस समय को केवल मृत्यु, फ़सह-भोज या मिशन की व्यापक परिणति तक सीमित नहीं करता। व्यापक अभिव्यक्ति कथात्मक और धर्मवैचारिक तनाव बनाए रखती है।
- issue: ποιῶ का कालगत रूप
  choice: मैं ... मनाऊँगा
  alternative: मैं ... मना रहा हूँ / मनाता हूँ
  rationale: यूनानी वर्तमान निकट भविष्य की दृढ़ योजना व्यक्त कर सकता है। हिन्दी में भविष्यकाल प्रसंगानुकूल है और कथन को वर्तमान में चल रहे उत्सव के रूप में गलत समझे जाने से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अमुक व्यक्ति’ जानबूझकर अनाम किंतु विशिष्ट व्यक्ति को दर्शाता है। ‘तुम्हारे यहाँ’ πρὸς σέ की निकटता बनाए रखते हुए आतिथ्य-स्थल का स्वाभाविक संकेत देता है।
