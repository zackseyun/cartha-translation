source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: hi
  text: 'और पतरस को यीशु की कही हुई बात याद आई: “मुर्गे के बाँग देने से पहले[a] तुम तीन बार मेरा इनकार करोगे।” और वह बाहर जाकर फूट-फूटकर रोया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुर्गा बाँग दे, उससे पहले।” यूनानी में “मुर्गे” के साथ निश्चित उपपद नहीं है; आशय मुर्गे के बाँग देने की घटना से है, किसी विशेष पहचाने हुए मुर्गे से आवश्यक रूप से नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: याद आई
  rationale: मध्य/निष्क्रिय रूप यहाँ स्मरण हो आने का भाव देता है। हिन्दी में ‘पतरस को ... याद आई’ स्वाभाविक है और कथा के उस अचानक स्मरण को व्यक्त करता है।
- source_word: ῥήματος
  choice: बात
  rationale: ῥῆμα यहाँ कही गई उक्ति को सूचित करता है। आधुनिक हिन्दी में ‘कही हुई बात’ ‘वचन’ की अपेक्षा अधिक सहज है और अर्थ को स्पष्ट रखता है।
- source_word: εἰρηκότος
  choice: कही हुई
  rationale: पूर्णकालिक कृदंत पहले कही गई और अब भी प्रासंगिक उक्ति को दर्शाता है। ‘कही हुई बात’ हिन्दी में स्वाभाविक रूप से यह पूर्वता व्यक्त करती है।
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: मुर्गे के बाँग देने से पहले
  rationale: यह infinitival रचना हिन्दी में कालवाचक उपवाक्य के रूप में स्वाभाविक है। यूनानी में ἀλέκτορα अनिश्चित है, पर हिन्दी में प्रजातिगत/घटनात्मक उल्लेख के लिए ‘मुर्गे के बाँग देने’ सहज है; यह किसी खास मुर्गे की पहचान अनिवार्य नहीं करता।
- source_word: τρὶς
  choice: तीन बार
  rationale: यह आधुनिक हिन्दी में सीधा और स्पष्ट समतुल्य है।
- source_word: ἀπαρνήσῃ
  choice: मेरा इनकार करोगे
  rationale: ἀπαρνέομαι यहाँ यीशु से संबंध या परिचय को नकारने का अर्थ रखता है। ‘मेरा इनकार करना’ प्रचलित, स्पष्ट और गंभीरता बनाए रखने वाला अनुवाद है।
- source_word: ἐξελθὼν ἔξω
  choice: बाहर जाकर
  rationale: यूनानी कृदंत और क्रियाविशेषण दोनों बाहर निकलने पर बल देते हैं। ‘बाहर जाकर’ हिन्दी में अनावश्यक पुनरुक्ति के बिना गति और क्रम दोनों को बनाए रखता है।
- source_word: ἔκλαυσεν πικρῶς
  choice: फूट-फूटकर रोया
  rationale: πικρῶς गहरे दुःख और तीव्र रोने को व्यक्त करता है। हिन्दी मुहावरे ‘फूट-फूटकर रोया’ में यही भाव स्वाभाविक और गरिमापूर्ण ढंग से आता है, बिना पश्चात्ताप की मनोस्थिति को स्रोत से आगे स्पष्ट किए।
theological_decisions:
- issue: यीशु के नाम के साथ उपाधि
  choice: यीशु
  alternative: प्रभु यीशु
  rationale: यूनानी पाठ में केवल Ἰησοῦ है; इसलिए स्रोत में अनुपस्थित मसीही उपाधि नहीं जोड़ी गई।
- issue: पतरस के रोने की मनोवैज्ञानिक व्याख्या
  choice: तीव्र रोने का वर्णन, कारण की अतिरिक्त व्याख्या नहीं
  alternative: पश्चात्ताप से रोया
  rationale: पाठ उसके रोने को πικρῶς कहता है, पर इस पद में स्पष्ट रूप से ‘पश्चात्ताप’ शब्द नहीं जोड़ता। अनुवाद घटना की भावनात्मक तीव्रता रखता है, लेकिन धर्मवैचारिक निष्कर्ष नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘कही हुई बात’ और ‘बाहर जाकर’ बोलचाल में सहज हैं; ‘फूट-फूटकर रोया’ तीव्र दुःख को स्वाभाविक हिन्दी मुहावरे में व्यक्त करता है।
