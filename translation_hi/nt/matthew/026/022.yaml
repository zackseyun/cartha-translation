  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: hi
  text: वे बहुत दुखी होकर एक-एक करके[a] उससे पूछने लगे, “प्रभु, कहीं मैं तो नहीं?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर एक ने उससे कहा” या “बारी-बारी से।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में प्रश्न इस प्रकार रखा गया है कि बोलने वाला ‘नहीं’ उत्तर की आशा करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: बहुत दुखी होकर
  rationale: कृदंत λυπούμενοι उनकी उस समय की भावात्मक अवस्था व्यक्त करता है और σφόδρα उसकी तीव्रता बढ़ाता है। ‘बहुत दुखी होकर’ सहज आधुनिक हिन्दी में दोनों का संयुक्त बल बनाए रखता है।
- source_word: ἤρξαντο λέγειν
  choice: पूछने लगे
  rationale: ἤρξαντο आरम्भ का भाव देता है। यद्यपि λέγειν का मूल अर्थ ‘कहना’ है, इसके बाद प्रत्यक्ष प्रश्न आने के कारण हिन्दी में ‘पूछने लगे’ अधिक स्वाभाविक और प्रसंगानुकूल है।
- source_word: αὐτῷ
  choice: उससे
  rationale: दत्तिव αὐτῷ को हिन्दी में संवाद के अप्रत्यक्ष संबंध के रूप में सहज ढंग से व्यक्त किया गया है।
- source_word: εἷς ἕκαστος
  choice: एक-एक करके
  rationale: यह वितरणात्मक पद प्रत्येक शिष्य की अलग-अलग प्रतिक्रिया पर बल देता है। ‘एक-एक करके’ हिन्दी में उस अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: Μήτι ἐγώ εἰμι
  choice: कहीं वह मैं तो नहीं?
  rationale: μήτι ऐसे प्रश्न का संकेत देता है जिसमें बोलने वाला नकारात्मक उत्तर की आशा करता है। ‘कहीं ... तो नहीं?’ हिन्दी में उस आशंका और अपेक्षा को स्वाभाविक रूप से व्यक्त करता है; प्रसंग से निहित ‘वह’ विश्वासघाती व्यक्ति की ओर संकेत करता है।
- source_word: κύριε
  choice: प्रभु
  rationale: यीशु को संबोधित κύριε के सम्मानसूचक और संभावित धर्मवैचारिक भार को ‘प्रभु’ सुरक्षित रखता है।
theological_decisions:
- issue: यीशु के लिए संबोधन κύριε का अनुवाद
  choice: प्रभु
  alternative: महोदय / स्वामी
  rationale: κύριε कभी सामान्य आदरसूचक संबोधन भी हो सकता है, पर मत्ती के कथानक में यीशु के लिए प्रयुक्त इस पद का अधिक गहरा कथात्मक और धर्मवैचारिक भार हो सकता है। ‘प्रभु’ उस संभावना को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
- issue: μήτι वाले प्रश्न की अपेक्षित प्रतिक्रिया
  choice: कहीं वह मैं तो नहीं?
  alternative: क्या वह मैं हूँ?
  rationale: साधारण प्रश्न की अपेक्षा μήτι नकारात्मक उत्तर की आशा प्रकट करता है। चुना हुआ हिन्दी मुहावरा इस सूक्ष्मता को बनाए रखता है, फिर भी शिष्यों की चिंता और कथात्मक तनाव को समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कहीं वह मैं तो नहीं?’ सामान्य पाठक के लिए स्वाभाविक है और यूनानी प्रश्न की नकारात्मक उत्तर की अपेक्षा को भी व्यक्त करता है।
