lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: जब यीशु ... थे
  rationale: सम्बन्धकारक स्वतंत्र रचना यहाँ समय और दृश्य की पृष्ठभूमि स्थापित करती है। ‘जब ... थे’ स्वाभाविक हिन्दी है और घटना को अनावश्यक रूप से ‘पहुँचने’ के अर्थ में नहीं बदलती। δέ का हल्का कथात्मक संक्रमण हिन्दी में अलग शब्द जोड़े बिना वाक्य-संबंध से व्यक्त होता है।
- source_word: ἐν Βηθανίᾳ
  choice: बैतनिय्याह में
  rationale: ἐν का सीधा स्थानवाचक अर्थ रखा गया है और स्थान-नाम का प्रचलित हिन्दी रूप लिया गया है।
- source_word: ἐν οἰκίᾳ Σίμωνος
  choice: शमौन ... के घर में
  rationale: οἰκία यहाँ भौतिक निवास-स्थान है और Σίμωνος सम्बन्ध/स्वामित्व बताता है; हिन्दी में ‘के घर में’ स्वाभाविक रचना है।
- source_word: τοῦ λεπροῦ
  choice: कोढ़ी
  rationale: यह शमौन के साथ जुड़ा पहचानसूचक विशेषण है। संक्षिप्त पारंपरिक शब्द मूल की पहचानसूचक शक्ति बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि मूल पाठ उसकी तत्कालीन दशा या आधुनिक चिकित्सकीय निदान निश्चित नहीं करता।
theological_decisions:
- issue: ‘कोढ़ी’ पहचानसूचक पद से शमौन की अवस्था का संभावित निष्कर्ष
  choice: ‘शमौन कोढ़ी’ को पहचानसूचक संबोधन के रूप में बनाए रखा गया, बिना यह बताए कि उस समय भी उसे रोग था या वह पहले चंगा हो चुका था।
  alternative: ‘शमौन, जो पहले कोढ़ी था’ अथवा ‘शमौन, जिसे चर्मरोग था’
  rationale: यूनानी पाठ केवल λεπρός पद से उसकी पहचान कराता है; वह न रोग का समय बताता है, न आधुनिक चिकित्सकीय वर्गीकरण। अनुवाद को अनकही चंगाई या निदान नहीं जोड़ना चाहिए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। पद मूल में अधूरा आश्रित उपवाक्य है और अगले पद में पूरा होता है, इसलिए अन्त में अल्पविराम रखा गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में स्पष्ट रूप से दिए गए हैं।
