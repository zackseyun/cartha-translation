base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: hi
  text: और वह तुरन्त यीशु के पास आया और बोला, “नमस्कार, रब्बी!”[a] और उसने उन्हें चूमा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “जय हो, रब्बी!”
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी क्रिया में विशेष भाव से या बार-बार चूमने का संकेत हो सकता है: “उन्हें विशेष भाव से चूमा” या “उन्हें बार-बार चूमा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: तुरन्त
  rationale: यह क्रिया की तत्परता और कथा की तीव्र गति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: वह यीशु के पास आया
  rationale: कृदन्त से व्यक्त यीशु के निकट आने की क्रिया को हिन्दी की स्वाभाविक क्रमिक वाक्य-रचना में रखा गया है।
- source_word: Χαῖρε
  choice: नमस्कार
  rationale: यहाँ शब्द आनन्दित होने की आज्ञा नहीं, बल्कि प्रचलित अभिवादन है; ‘नमस्कार’ आधुनिक, सम्मानजनक और संदर्भानुकूल है।
- source_word: ῥαββί
  choice: रब्बी
  rationale: यूनानी पाठ में सुरक्षित सामी संबोधन का लिप्यंतरण रखा गया है; इसे ‘गुरु’ में बदलने से मूल संबोधन की विशिष्टता घट सकती थी।
- source_word: κατεφίλησεν
  choice: चूमा
  rationale: मुख्य पाठ में सरल और स्वाभाविक क्रिया रखी गई है; उपसर्गयुक्त यूनानी क्रिया में सम्भव प्रबल या बार-बार चूमने का भाव पादटिप्पणी में सुरक्षित है।
- source_word: αὐτόν
  choice: उन्हें
  rationale: सर्वनाम यीशु की ओर संकेत करता है; हिन्दी में उनके लिए सम्मानसूचक एकवचन के अर्थ में ‘उन्हें’ स्वाभाविक है।
theological_decisions:
- issue: यहूदा के अभिवादन Χαῖρε का अर्थ
  choice: नमस्कार
  alternative: आनन्दित हो; जय हो
  rationale: इस प्रसंग में यह सामान्य सामाजिक अभिवादन है, कोई धर्मवैचारिक जयघोष नहीं। सरल अभिवादन रखने से विश्वासघात की विडम्बना कथा से स्वयं उभरती है।
- issue: κατεφίλησεν की तीव्रता
  choice: मुख्य पाठ में ‘चूमा’
  alternative: बहुत प्रेम से चूमा; बार-बार चूमा
  rationale: क्रिया प्रबल अथवा बार-बार किए गए चुम्बन का संकेत दे सकती है, पर यह निश्चित नहीं कि कौन-सा भाव अभिप्रेत है। इसलिए अस्पष्टता को पादटिप्पणी में बताया गया है, मुख्य पाठ में किसी एक अर्थ को थोपा नहीं गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘रब्बी’ मूल संबोधन को सुरक्षित रखता है, जबकि ‘नमस्कार’ सामान्य पाठक के लिए सहज अभिवादन है। यीशु के लिए सम्मानसूचक ‘उन्हें’ का प्रयोग किया गया है।
