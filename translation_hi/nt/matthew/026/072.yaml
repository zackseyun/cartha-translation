base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/072.yaml
  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: hi
  text: और उसने फिर शपथ खाकर इनकार किया, “मैं उस आदमी को नहीं जानता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ πάλιν
  choice: और ... फिर
  rationale: सरल कथात्मक संबंध और इनकार की पुनरावृत्ति—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἠρνήσατο
  choice: उसने ... इनकार किया
  rationale: क्रिया का अर्थ नकारना या अस्वीकार करना है। इसके बाद आने वाला प्रत्यक्ष कथन इनकार की विषयवस्तु स्पष्ट कर देता है, इसलिए हिन्दी में अलग कर्म जोड़ना आवश्यक नहीं है।
- source_word: μετὰ ὅρκου
  choice: शपथ खाकर
  rationale: यह शपथ के साथ किए गए इनकार को स्वाभाविक हिन्दी में व्यक्त करता है और किसी औपचारिक न्यायिक शपथ का अनावश्यक संकेत नहीं देता।
- source_word: ὅτι
  choice: अल्पविराम के बाद प्रत्यक्ष कथन
  rationale: यह इनकार की विषयवस्तु प्रस्तुत करता है; हिन्दी में प्रत्यक्ष उद्धरण सबसे स्वाभाविक है।
- source_word: Οὐκ οἶδα
  choice: मैं ... नहीं जानता
  rationale: ज्ञान के स्पष्ट निषेध का सीधा और गरिमापूर्ण अनुवाद।
- source_word: τὸν ἄνθρωπον
  choice: उस आदमी को
  rationale: ἄνθρωπος यहाँ किसी पुरुष व्यक्ति को सूचित करता है। 'उस आदमी' हिन्दी में निश्चित संदर्भ को स्पष्ट करता और पतरस की दूरी बनाने वाली भाषा को बनाए रखता है।
theological_decisions:
- issue: '''उस आदमी'' का संदर्भ'
  choice: '''उस आदमी'' को बनाए रखा गया है'
  alternative: '''उसे'' या ''यीशु को'''
  rationale: यूनानी पाठ स्पष्ट रूप से 'उस मनुष्य/आदमी' कहता है। इसे 'यीशु' से बदलना व्याख्या को मुख्य पाठ में ले आता और पतरस के दूरी बनाने वाले कथन की आलंकारिक शक्ति घटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक कथन के अनुकूल। 'मनुष्य' की अपेक्षा 'आदमी' इस संवाद में अधिक स्वाभाविक है, जबकि मूल का पुरुष-संदर्भ सुरक्षित रहता है।
