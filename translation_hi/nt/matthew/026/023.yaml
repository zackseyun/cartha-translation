  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: hi
  text: उसने उत्तर दिया, “जिसने मेरे साथ कटोरे में हाथ डुबोया है, वही मुझे धोखा देगा।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे हवाले कर देगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: उसने उत्तर दिया
  rationale: कृदन्त और सीमित क्रिया का यह सामान्य यूनानी प्रयोग स्वाभाविक हिन्दी में एक ही वाक्यांश ‘उत्तर दिया’ से ठीक व्यक्त होता है।
- source_word: ἐμβάψας
  choice: जिसने … हाथ डुबोया है
  rationale: अओरिस्ट कृदन्त पूरी हो चुकी पहचानसूचक क्रिया बताता है; हिन्दी का पूर्णतावाचक रूप इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μετ’ ἐμοῦ
  choice: मेरे साथ
  rationale: सम्बद्धता अथवा साथ होने का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: τὴν χεῖρα
  choice: हाथ
  rationale: यूनानी में अंग के साथ प्रयुक्त निश्चित उपपद का हिन्दी में अलग स्वत्वसूचक सर्वनाम आवश्यक नहीं; कर्ता से उसका अपना हाथ स्वतः स्पष्ट है।
- source_word: ἐν τῷ τρυβλίῳ
  choice: कटोरे में
  rationale: τρύβλιον भोजन रखने या परोसने के कटोरे अथवा गहरे पात्र को दर्शाता है; ‘कटोरा’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: οὗτός
  choice: वही
  rationale: बलाघाती संकेतवाचक का स्वाभाविक हिन्दी समतुल्य ‘वही’ है, जो पहचान पर जोर बनाए रखता है।
- source_word: παραδώσει
  choice: पकड़वा देगा
  rationale: मूल क्रिया का अर्थ किसी को अधिकारियों के हवाले करना है; इस प्रसंग में ‘पकड़वा देगा’ विश्वासघाती कार्रवाई और सुपुर्द किए जाने, दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यहूदा के प्रसंग में παραδίδωμι का अनुवाद
  choice: पकड़वा देगा
  alternative: धोखा देगा; हवाले कर देगा
  rationale: क्रिया का मूल अर्थ ‘सौंप देना/हवाले करना’ है, जबकि प्रसंग में यह विश्वासघाती कार्य है। ‘पकड़वा देगा’ घटना की ठोस कार्रवाई को व्यक्त करता है और केवल सामान्य छल का अर्थ देने से बचता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में सहज रखी गई है। ‘वही’ से οὗτός का बल सुरक्षित है। मुख्य पाठ में केवल एक पादटिप्पणी-चिह्न है और उसका विकल्प παραδώσει की वास्तविक अर्थ-सीमा को दिखाता है।
