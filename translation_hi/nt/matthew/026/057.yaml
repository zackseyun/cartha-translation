  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: hi
  text: जिन लोगों ने यीशु को पकड़ लिया था, वे उसे महायाजक कैफा के पास ले गए, जहाँ शास्त्री और पुरनिए इकट्ठे हुए थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एकत्र थे।” इस प्रसंग में यूनानी क्रिया का अर्थ ‘इकट्ठे हुए थे’ या ‘एकत्र थे,’ दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: जिन लोगों ने
  rationale: लेखयुक्त कृदन्त को स्वाभाविक हिन्दी संबंधवाचक वाक्यांश के रूप में प्रस्तुत किया गया है। δέ यहाँ कथा को आगे बढ़ाने वाला हल्का संयोजक है; हिन्दी में अलग संयोजक जोड़े बिना प्रवाह स्पष्ट रहता है।
- source_word: κρατήσαντες
  choice: पकड़ लिया था
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई कार्रवाई बताता है। यह अनुवाद बलपूर्वक पकड़ने या हिरासत में लेने का अर्थ रखता है, पर यूनानी से अधिक कानूनी अर्थ वाला ‘गिरफ़्तार किया’ नहीं जोड़ता।
- source_word: ἀπήγαγον
  choice: ले गए
  rationale: क्रिया किसी को वहाँ से अपने साथ दूसरी ओर ले जाने को व्यक्त करती है; प्रसंग में ‘ले गए’ सहज और सटीक है।
- source_word: πρὸς Καϊάφαν
  choice: कैफा के पास
  rationale: πρός तथा कर्मकारक किसी व्यक्ति की ओर गति दर्शाते हैं। ‘के पास’ सीधे अर्थ को रखता है; ‘कैफा के घर’ जैसी अनुल्लिखित जानकारी नहीं जोड़ता।
- source_word: τὸν ἀρχιερέα
  choice: महायाजक
  rationale: एकवचन ἀρχιερεύς इस प्रसंग में कैफा के पद की मानक उपाधि है।
- source_word: ὅπου
  choice: जहाँ
  rationale: स्थानवाचक संबंधसूचक क्रियाविशेषण का सरल और स्वाभाविक हिन्दी रूप।
- source_word: οἱ γραμματεῖς
  choice: शास्त्री
  rationale: सुसमाचारों के यहूदी धार्मिक और न्यायिक संदर्भ में γραμματεῖς के लिए स्थापित तथा संक्षिप्त पदनाम।
- source_word: οἱ πρεσβύτεροι
  choice: पुरनिए
  rationale: यहाँ मान्यताप्राप्त यहूदी वरिष्ठ अगुवों के समूह का पदनाम है; ‘पुरनिए’ इस संस्थागत अर्थ को बनाए रखता है।
- source_word: συνήχθησαν
  choice: इकट्ठे हुए थे
  rationale: अओरिस्ट रूप बताता है कि यीशु को लाए जाने तक वे वहाँ एकत्र हो चुके थे। यूनानी रूप का कर्मवाच्य अर्थ भी संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
