id: MAT.26.44
reference: Matthew 26:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: hi
  text: और उन्हें छोड़कर वह फिर चला गया और तीसरी बार प्रार्थना की; उसने फिर वही बात[a] कही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वही वचन” या “वही कथन।”
    reason: λόγον एकवचन है और इसका अर्थ ‘वचन,’ ‘कथन,’ या प्रसंगानुसार कही गई ‘बात’ हो सकता है।
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: उन्हें छोड़कर
  rationale: यह कृदन्तीय पद शिष्यों को वहीं छोड़कर उनसे दूर जाने की क्रमिक क्रिया व्यक्त करता है।
- source_word: πάλιν ἀπελθὼν
  choice: वह फिर चला गया
  rationale: पहला πάλιν यीशु के एक बार फिर शिष्यों से दूर जाने को चिह्नित करता है; सहज हिन्दी में इसे मुख्य क्रिया के रूप में व्यक्त किया गया है।
- source_word: προσηύξατο ἐκ τρίτου
  choice: तीसरी बार प्रार्थना की
  rationale: ἐκ τρίτου का स्वाभाविक हिन्दी अर्थ ‘तीसरी बार’ है और προσηύξατο साधारण कथात्मक भूतकाल में ‘प्रार्थना की’ है।
- source_word: τὸν αὐτὸν λόγον
  choice: वही बात
  rationale: λόγον व्याकरणतः एकवचन है और यहाँ पहले कही गई प्रार्थना की विषयवस्तु को सूचित करता है; ‘वही बात’ आधुनिक हिन्दी में स्वाभाविक रहते हुए एकवचन को बनाए रखता है।
- source_word: εἰπὼν πάλιν
  choice: उसने फिर ... कही
  rationale: अन्तिम πάλιν को स्पष्ट रूप से रखा गया है ताकि उसी प्रार्थना-विषय के पुनः कहे जाने पर यूनानी पाठ का बल बना रहे।
theological_decisions:
- issue: प्रार्थना की पुनरावृत्ति
  choice: तीसरे अवसर और उसी बात को फिर कहने—दोनों को स्पष्ट रखा गया है।
  alternative: शैलीगत सहजता के लिए अन्तिम ‘फिर’ को छोड़ देना।
  rationale: यूनानी पाठ में πάλιν दो बार है। दोनों को रखने से कथा का पुनरावृत्ति पर दिया गया बल सुरक्षित रहता है, बिना उसके धर्मवैज्ञानिक अर्थ को अतिरिक्त रूप से निर्धारित किए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कृदन्तों की यूनानी शृंखला को स्वाभाविक हिन्दी वाक्य-क्रम में ढाला गया है, जबकि दोनों बार आए ‘फिर’ और ‘तीसरी बार’ को स्पष्ट रूप से सुरक्षित रखा गया है।
