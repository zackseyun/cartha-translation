lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह समय-सूचक पद घटनाक्रम में अगली घटना आरम्भ करता है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: συνήχθησαν
  choice: इकट्ठे हुए
  rationale: यूनानी क्रिया रूप की निष्प्रयोज्य/कर्मवाच्य बनावट के बावजूद प्रसंग में लोगों के एकत्र होने का अर्थ प्रमुख है। ‘इकट्ठे हुए’ आधुनिक हिन्दी में स्वाभाविक है; रूपगत कर्मवाच्य की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: सुसमाचारों में यह बहुवचन प्रमुख याजकीय अधिकारियों को दर्शाता है, न कि एक ही समय पद धारण करने वाले अनेक महायाजकों को।
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: लोगों के पुरनिये
  rationale: यह जनसमुदाय के मान्य वरिष्ठ अगुओं को सूचित करता है और संबंधवाचक यूनानी रचना को स्पष्ट रूप से व्यक्त करता है।
- source_word: εἰς τὴν αὐλὴν
  choice: आँगन में
  rationale: εἰς दिशा या परिणामी स्थान बता सकता है; इकट्ठा होने की क्रिया के साथ हिन्दी में ‘में’ स्वाभाविक है। αὐλή किसी बड़े निवास के आँगन अथवा प्रांगण को सूचित कर सकता है।
- source_word: τοῦ ἀρχιερέως
  choice: महायाजक के
  rationale: यहाँ एकवचन पदाधिकारी अभिप्रेत है; ‘महायाजक’ हिन्दी बाइबलीय प्रयोग में सटीक और परिचित पद है।
- source_word: τοῦ λεγομένου Καϊάφα
  choice: कैफा नामक
  rationale: यह कृदन्तीय पदबंध महायाजक की पहचान उसके नाम से कराता है; ‘कैफा नामक’ निकट और स्वाभाविक हिन्दी है।
