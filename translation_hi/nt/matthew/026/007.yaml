source:
  edition: SBLGNT
  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: hi
  text: एक स्त्री उनके पास आई। वह अलबास्तर की एक शीशी में बहुत कीमती सुगंधित तेल लिए हुए थी[a]। जब वे भोजन के लिए टेक लगाकर लेटे हुए थे[b], तब उसने वह तेल उनके सिर पर उँडेल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत कीमती सुगंधित लेप से भरा अलबास्तर का पात्र।” यूनानी शब्द μύρον सुगंधित तेल या लेप, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: उस समय भोजन के लिए टेक लगाकर लेटना प्रचलित था।
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν αὐτῷ
  choice: उनके पास आई
  rationale: यह स्वाभाविक आधुनिक हिन्दी में किसी व्यक्ति की ओर आने का दिशात्मक भाव सुरक्षित रखता है।
- source_word: γυνὴ
  choice: एक स्त्री
  rationale: मूल पाठ यहाँ स्त्री की कोई पहचान या विशेषण नहीं देता; अनिश्चित एकवचन को यथावत रखा गया है।
- source_word: ἔχουσα
  choice: लिए हुए थी
  rationale: वर्तमान कृदन्त स्त्री के पास पात्र होने का संकेत देता है; हिन्दी में यह ‘रखे हुए’ या शाब्दिक ‘रखती हुई’ से अधिक स्वाभाविक है।
- source_word: ἀλάβαστρον μύρου
  choice: अलबास्तर की एक शीशी में ... सुगंधित तेल
  rationale: ἀλάβαστρον एक अलबास्तर पात्र/शीशी को और μύρον सुगंधित तेल अथवा लेप को सूचित करता है। ‘सुगंधित तेल’ आधुनिक पाठक के लिए स्पष्ट है और आधुनिक मदिरा-आधारित इत्र का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: βαρυτίμου
  choice: बहुत कीमती
  rationale: यह पदार्थ के असाधारण मूल्य पर दिए गए बल को सहज हिन्दी में व्यक्त करता है।
- source_word: κατέχεεν
  choice: उँडेल दिया
  rationale: क्रिया ऊपर से किसी वस्तु पर तरल डालने का भाव रखती है; पूर्ण घटना के लिए ‘उँडेल दिया’ स्वाभाविक है।
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: उनके सिर पर
  rationale: यह स्थान और संपर्क का सीधा अर्थ देता है; यीशु के लिए सम्मानसूचक बहुवचन हिन्दी प्रयोग के अनुरूप है।
- source_word: ἀνακειμένου
  choice: जब वे भोजन करने के लिए लेटे हुए थे
  rationale: यह तत्कालीन भोजन के समय टेक लगाकर लेटने की मुद्रा को बताता है। ‘भोजन करने के लिए’ जोड़ने से आधुनिक हिन्दी में लेटने का प्रसंग स्पष्ट होता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अलबास्तर’ ऐतिहासिक पात्र की विशिष्टता बनाए रखता है, जबकि पादटिप्पणी उसके रूप और भीतर के सुगंधित पदार्थ की वैकल्पिक अभिव्यक्ति स्पष्ट करती है।
