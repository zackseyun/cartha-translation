review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal transition, Jesus’ completion of the preceding discourse, and his address to his disciples. However, the temporal clause is more grammatically complete in standard Hindi with ‘थे,’ which also clearly represents the completed action before ‘कहा.’
  naturalness: ‘जब यीशु ये सारी बातें कह चुके, तो’ is understandable but slightly elliptical in modern standard Hindi. ‘जब यीशु ये सारी बातें कह चुके थे, तब’ is smooth, idiomatic narrative Hindi.
  terminology: ‘यीशु,’ ‘चेलों,’ and ‘बातें’ are suitable and consistent. ‘बातें कह चुके थे’ naturally renders the sense of having finished all these words without artificially reproducing the Greek idiom.
  issues:
  - severity: low
    issue: The auxiliary verb is omitted in the temporal clause.
    rationale: 'Adding ‘थे’ produces a fully natural Hindi past-perfect construction and makes the antecedent completion explicit: ‘जब यीशु ये सारी बातें कह चुके थे…’'
  - severity: low
    issue: The formal footnote’s rendering ‘बातों को पूरा कर लिया’ is less idiomatic and less precise than a formal rendering with ‘वचन’ and ‘समाप्त किए.’
    rationale: The footnote is intended to display the more literal narrative formula. ‘इन सब वचनों को समाप्त किया’ more directly reflects λόγους and ἐτέλεσεν while remaining intelligible Hindi.
  revised_text: जब यीशु ये सारी बातें कह चुके थे, तब उन्होंने अपने चेलों से कहा,
