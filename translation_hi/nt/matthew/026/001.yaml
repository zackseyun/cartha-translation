  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς πάντας τοὺς λόγους τούτους, εἶπεν τοῖς μαθηταῖς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/001.yaml
  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: hi
  text: जब यीशु ये सारी बातें कह चुके थे, तब उन्होंने अपने चेलों से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: जब … तो
  rationale: यह मत्ती का सामी प्रभाव वाला कथानक-सूत्र है। आधुनिक हिन्दी में ‘और ऐसा हुआ कि जब’ अस्वाभाविक रूप से भारी लगता है; ‘जब … तो’ उसके कालगत और संक्रमणकारी भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐτέλεσεν
  choice: कह चुके
  rationale: क्रिया का मूल भाव ‘समाप्त करना’ है। λόγους के साथ हिन्दी में ‘बातें कह चुके’ यह स्पष्ट और स्वाभाविक रूप से बताता है कि यीशु ने अपना कथन समाप्त कर लिया था, और मुख्य क्रिया से पहले की पूर्णता भी बनाए रखता है।
- source_word: πάντας τοὺς λόγους τούτους
  choice: ये सारी बातें
  rationale: λόγους का अर्थ यहाँ यीशु के अभी-अभी पूरे हुए कथन से है। ‘बातें’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और ‘इन सब वचनों’ की अपेक्षा कम कृत्रिम सुनाई देता है; ‘सारी’ πάντας की व्यापकता को बनाए रखता है।
- source_word: εἶπεν
  choice: कहा
  rationale: कथात्मक प्रसंग में λέγω का सीधा और सामान्य हिन्दी रूप ‘कहा’ है।
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: अपने चेलों से
  rationale: ‘अपने’ αὐτοῦ के संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है। ‘चेला’ μαθητής का सामान्य, सुबोध और पारंपरिक हिन्दी समतुल्य है।
