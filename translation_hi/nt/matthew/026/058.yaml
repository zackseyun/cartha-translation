review_pass:
  verdict: revise
  source_fidelity: Draft captures the setting, the high priest's courtyard, Peter's entry, and his purpose. However, both ἠκολούθει and ἐκάθητο are imperfects. “गया” and “बैठ गया” present completed, ingressive actions and obscure the source's ongoing background action/posture. The purpose phrase is better rendered explicitly as seeing the result/outcome.
  naturalness: The draft is generally fluent modern Hindi, but “ताकि देखे कि अंत में क्या होता है” is less direct than the Greek and can sound like a general future prediction. “यह देखने के लिए कि परिणाम क्या होगा” is idiomatic and clear. “चला आ रहा था” and “बैठा था” preserve the narrative flow naturally.
  terminology: “महायाजक” is appropriate. In this context ὑπηρέται is better represented by “अधिकारियों” than unqualified “सेवकों,” since these are subordinate personnel connected with the high-priestly proceedings; the broader lexical range remains appropriately documented in a footnote. “परिणाम” conveys τὸ τέλος while the footnote preserves the more literal “अंत.”
  issues:
  - severity: medium
    issue: Imperfect verbal aspect is not adequately reflected.
    rationale: ἠκολούθει (“was following”) and ἐκάθητο (“was sitting”) are imperfect forms. The draft's “गया” and “बैठ गया” portray single completed actions rather than continuing action and posture.
  - severity: low
    issue: The rendering of τὸ τέλος is slightly diffuse.
    rationale: “अंत में क्या होता है” can be understood temporally. “परिणाम क्या होगा” more directly communicates the contextual sense of τέλος, while a footnote can retain the literal alternative “अंत.”},{
