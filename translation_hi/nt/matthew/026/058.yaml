- from: पर पतरस दूर से उसके पीछे-पीछे महायाजक के आँगन तक गया। फिर भीतर जाकर वह सेवकों[a] के साथ बैठ गया, ताकि देखे कि अंत में क्या होता है[b]।
  to: पर पतरस दूर से उसके पीछे-पीछे महायाजक के आँगन तक चला आ रहा था। भीतर जाकर वह अधिकारियों[a] के साथ बैठा था, यह देखने के लिए कि परिणाम क्या होगा[b]।
  rationale: Revised the two main verbs to reflect the Greek imperfects, used contextually suitable “अधिकारी” for ὑπηρέται with alternatives retained in the footnote, and rendered τὸ τέλος as “परिणाम” while preserving the literal “अंत” in the footnote. Footnote anchors remain attached to the relevant translated terms.
