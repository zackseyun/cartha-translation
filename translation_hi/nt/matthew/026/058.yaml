source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: hi
  text: पर पतरस दूर से उसके पीछे-पीछे महायाजक के आँगन तक चला आ रहा था। भीतर जाकर वह अधिकारियों[a] के साथ बैठा था, यह देखने के लिए कि परिणाम क्या होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवकों,” “परिचारकों” अथवा “पहरेदारों”; यूनानी शब्द ὑπηρέται अधीनस्थ कर्मियों, सेवकों या अधिकारियों को सूचित कर सकता है, और यहाँ उनकी ठीक भूमिका निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अंत देखने के लिए।” यहाँ आशय संभवतः यह जानना है कि यीशु के साथ होने वाली कार्यवाही का परिणाम क्या होगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: पीछे-पीछे ... गया
  rationale: अपूर्ण काल पतरस के कुछ दूरी बनाए रखते हुए निरंतर पीछे चलने की पृष्ठभूमि व्यक्त करता है; हिंदी में यह पदबंध स्वाभाविक रूप से उस गति को दर्शाता है।
- source_word: ἀπὸ μακρόθεν
  choice: दूर से
  rationale: भौतिक दूरी का सीधा, सहज और आधुनिक हिंदी रूप।
- source_word: ἕως τῆς αὐλῆς τοῦ ἀρχιερέως
  choice: महायाजक के आँगन तक
  rationale: ἕως सीमा या पहुँच की हद बताता है और αὐλή यहाँ घिरे हुए आँगन को सूचित करता है।
- source_word: εἰσελθὼν ἔσω
  choice: फिर भीतर जाकर
  rationale: कृदंत मुख्य क्रिया से पहले भीतर जाने की क्रिया बताता है; 'फिर' घटनाक्रम को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: ἐκάθητο
  choice: बैठ गया
  rationale: यूनानी अपूर्ण काल बैठी हुई अवस्था को सामने रखता है, जबकि प्रसंग के घटनाक्रम में हिंदी का 'बैठ गया' प्रवेश के बाद आसन लेने और वहाँ बने रहने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: सेवकों के साथ
  rationale: ὑπηρέται अधीनस्थ सेवकों, परिचारकों या पदाधिकारियों के लिए प्रयुक्त हो सकता है। 'सेवक' व्यापक और सहज है; प्रसंगगत विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: ἰδεῖν τὸ τέλος
  choice: ताकि देखे कि अंत में क्या होता है
  rationale: ἰδεῖν उद्देश्य बताता है और τέλος को केवल अंतिम क्षण नहीं, बल्कि घटनाओं के परिणाम की प्रतीक्षा के अर्थ में स्वाभाविक हिंदी में प्रस्तुत किया गया है।
