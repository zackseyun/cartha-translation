source:
  edition: SBLGNT
  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: hi
  text: और जब वह अब भी बोल ही रहा था, देखो, बारहों में से एक, यहूदा, आ पहुँचा। उसके साथ तलवारें और लाठियाँ[a] लिए एक बड़ी भीड़ थी, जो प्रधान याजकों और लोगों के बुज़ुर्ग अगुओं की ओर से आई थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लकड़ी के डंडे।’ यूनानी शब्द का शाब्दिक अर्थ लकड़ी या लकड़ी के टुकड़े हैं; यहाँ सम्भवतः उन्हें लाठियों की तरह इस्तेमाल किया गया था।
    reason: lexical_alternative
  - marker: b
    text: या ‘प्रधान याजकों और लोगों के बुज़ुर्ग अगुओं द्वारा भेजी गई थी।’ यूनानी में अधिक शाब्दिक रूप से ‘प्रधान याजकों और लोगों के बुज़ुर्ग अगुओं की ओर से’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: जब वह अब भी बोल ही रहा था
  rationale: यह संबंधवाचक स्वतंत्र रचना उसी समय जारी क्रिया को व्यक्त करती है। ‘अब भी’ ἔτι को और ‘जब’ समकालिकता को स्वाभाविक आधुनिक हिन्दी में दर्शाता है।
- source_word: ἰδοὺ
  choice: तभी देखो
  rationale: ‘देखो’ कथन में जीवंतता और ध्यानाकर्षण बनाए रखता है; ‘तभी’ प्रसंग के तात्कालिक मोड़ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘अचानक’ जैसी अतिरिक्त धारणा जोड़े।
- source_word: Ἰούδας
  choice: यहूदा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: εἷς τῶν δώδεκα
  choice: बारहों में से एक
  rationale: अंशसूचक यूनानी वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप; इसे औपचारिक पदवी बनाकर अर्थ नहीं बढ़ाया गया।
- source_word: ἦλθεν
  choice: आ पहुँचा
  rationale: ἔρχομαι के आगमन-सूचक अर्थ को कथा के प्रसंग में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὄχλος πολὺς
  choice: एक बड़ी भीड़
  rationale: πολύς की परिमाणवाचक शक्ति को बनाए रखता है; ‘उपद्रवी झुंड’ जैसे शब्द से शत्रुता को मूल संज्ञा से अधिक स्पष्ट नहीं किया गया।
- source_word: μετὰ μαχαιρῶν
  choice: तलवारें लिए
  rationale: μάχαιρα तलवार अथवा कटार-जैसे हथियार को सूचित कर सकता है; इस गिरफ्तारी के प्रसंग में ‘तलवारें’ पर्याप्त व्यापक और प्रचलित रूप है।
- source_word: καὶ ξύλων
  choice: और लाठियाँ
  rationale: ξύλον का मूल अर्थ लकड़ी या लकड़ी का टुकड़ा है, पर यहाँ हथियार के रूप में प्रयुक्त वस्तुएँ अभिप्रेत हैं; ‘लाठियाँ’ आधुनिक हिन्दी में उस प्रयोग को स्पष्ट करती हैं।
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: प्रधान याजकों और लोगों के बुज़ुर्ग अगुओं के यहाँ से
  rationale: ἀπό के स्रोत/उद्गम-सूचक अर्थ को बनाए रखते हुए ‘भेजी गई’ जैसी अनुपस्थित क्रिया नहीं जोड़ी गई। ‘बुज़ुर्ग अगुए’ πρεσβύτεροι के आयु और नेतृत्व से जुड़े संस्थागत भाव को आधुनिक पाठक के लिए स्पष्ट करता है।
theological_decisions:
- issue: क्या भीड़ को यहूदी नेतृत्व द्वारा औपचारिक रूप से भेजा गया था, इसे मुख्य पाठ में स्पष्ट किया जाए
  choice: प्रधान याजकों और लोगों के बुज़ुर्ग अगुओं के यहाँ से आई थी
  alternative: प्रधान याजकों और लोगों के बुज़ुर्ग अगुओं द्वारा भेजी गई थी
  rationale: ἀπό स्रोत या उद्गम बताता है और प्रसंग अधिकारपूर्वक भेजे जाने की ओर संकेत कर सकता है, पर यूनानी पाठ में ‘भेजना’ क्रिया नहीं है। इसलिए मुख्य पाठ उस निहितार्थ को अनिवार्य दावा नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘देखो’ से मूल का ध्यानाकर्षक प्रभाव बचाया गया है। ‘पुरनिए’ जैसे अधिक पुराने शब्द के स्थान पर ‘बुज़ुर्ग अगुए’ चुना गया है, जबकि ‘प्रधान याजक’ जैसे व्यापक रूप से पहचाने जाने वाले बाइबलीय पद को बनाए रखा गया है।
