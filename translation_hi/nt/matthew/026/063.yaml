id: MAT.26.63
reference: Matthew 26:63
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: hi
  text: 'पर यीशु चुप ही रहे। तब महायाजक ने उनसे कहा, “मैं तुम्हें जीवित परमेश्वर की शपथ दिलाता हूँ[b]: हमें बताओ, क्या तुम मसीह[a], परमेश्वर के पुत्र हो?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ख्रीस्त।” यूनानी उपाधि Christos है; यहाँ “मसीह” इसलिए रखा गया है क्योंकि यह नाम नहीं, उपाधि के रूप में प्रयुक्त है।
    reason: alternative_reading
  - marker: b
    text: या “मैं जीवित परमेश्वर के नाम पर तुम्हें गंभीरता से आदेश देता हूँ।” यूनानी में यह शपथ दिलाने का गंभीर सूत्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπα
  choice: चुप ही रहे
  rationale: अपूर्ण भूतकाल निरंतर चुप रहने का भाव देता है; ‘चुप ही रहे’ इसे स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀρχιερεὺς
  choice: महायाजक
  rationale: यह उस समय के यहूदी प्रधान याजकीय पद का मानक और सटीक हिन्दी रूप है।
- source_word: Ἐξορκίζω
  choice: मैं तुम्हें ... शपथ दिलाता हूँ
  rationale: यहाँ क्रिया का अर्थ भूत-प्रेत निकालना नहीं, बल्कि न्यायिक प्रसंग में किसी को परमेश्वर का नाम लेकर गंभीर शपथ के अधीन करना है।
- source_word: κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: जीवित परमेश्वर की
  rationale: शपथ-सूत्र के साथ यह परमेश्वर के गंभीर आह्वान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: हमें बताओ
  rationale: यह शपथ दिलाने के बाद माँगे गए कथन की विषयवस्तु है; हिन्दी में सीधी आज्ञा स्पष्ट और स्वाभाविक है।
- source_word: ὁ χριστὸς
  choice: मसीह
  rationale: निश्चित पदबंध यहाँ नाम नहीं, अपेक्षित अभिषिक्त उद्धारकर्ता की उपाधि है; ‘मसीह’ आधुनिक हिन्दी में इस यहूदी मसीही संदर्भ को स्पष्ट रखता है।
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: परमेश्वर के पुत्र
  rationale: यह उपाधि सीधे रूप में रखी गई है और ‘मसीह’ के समानाधिकरण में इसकी मसीह-संबंधी दावेदारी को न घटाती है, न बढ़ाती है।
- source_word: ὁ δὲ Ἰησοῦς
  choice: पर यीशु
  rationale: δέ पिछले आरोपों और यीशु की प्रतिक्रिया के बीच हल्का विरोध दर्शाता है; ‘पर’ यह कथात्मक मोड़ बनाए रखता है।
theological_decisions:
- issue: प्रत्यक्ष मसीही पूछताछ में Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस प्रश्न में शब्द एक उपाधि के रूप में प्रयुक्त है, नाम के रूप में नहीं। मुख्य पाठ में अर्थसूचक ‘मसीह’ रखा गया है और यूनानी-आधारित वैकल्पिक रूप पादटिप्पणी में सुरक्षित है।
- issue: Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος का बल
  choice: जीवित परमेश्वर की शपथ के अधीन करना
  alternative: जीवित परमेश्वर के नाम पर गंभीरता से आदेश देना
  rationale: सूत्र परमेश्वर का औपचारिक आह्वान करता है और न्यायिक प्रसंग को तीव्र बनाता है। ‘शपथ दिलाता हूँ’ इसके गंभीर विधिक बल को स्पष्ट करता है, पर पाठ से आगे कोई तकनीकी व्यवस्था नहीं जोड़ता।
- issue: ‘मसीह’ और ‘परमेश्वर के पुत्र’ का संबंध
  choice: दोनों उपाधियों को समानाधिकरण में रखना
  alternative: दो अलग-अलग प्रश्नों के रूप में प्रस्तुत करना
  rationale: यूनानी वाक्य में ‘परमेश्वर का पुत्र’ ‘मसीह’ को और पहचान देता है; विराम-चिह्न ऐसा रखा गया है कि इस संबंध को बिना अतिरिक्त व्याख्या के बनाए रखा जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चुप ही रहे’ निरंतरता व्यक्त करता है; ‘महायाजक’ और ‘मसीह’ प्रचलित बाइबलीय पद हैं। सम्मानसूचक ‘उनसे’ और संबोधन में सामान्य ‘तुम्हें/तुम’ का प्रयोग किया गया है। पादटिप्पणी-चिह्न अपने-अपने संबंधित शब्दों के तुरंत बाद रखे गए हैं।
