  text: καὶ ἀπὸ τότε ἐζήτει εὐκαιρίαν ἵνα αὐτὸν παραδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/016.yaml
  text: And from then on he was seeking an opportunity to hand him over[a].
translation:
  language: hi
  text: और तब से वह उसे सौंपने का अवसर ढूँढ़ता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τότε
  choice: तब से
  rationale: ἀπό + τότε आरम्भ-बिंदु से आगे जारी समय को व्यक्त करता है; ‘तब से’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: ἐζήτει
  choice: ढूँढ़ने लगा
  rationale: अपूर्ण भूतकाल चलती हुई चेष्टा को दर्शाता है। ‘ढूँढ़ने लगा’ उस समय से आरम्भ हुई निरंतर खोज को सहज हिन्दी में व्यक्त करता है।
- source_word: εὐκαιρίαν
  choice: अवसर
  rationale: यह किसी उपयुक्त या अनुकूल मौके को सूचित करता है; ‘अवसर’ संक्षिप्त और स्वाभाविक है।
- source_word: ἵνα
  choice: का
  rationale: ἵνα यहाँ उद्देश्य बताता है; हिन्दी की ‘उसे पकड़वाने का अवसर’ संरचना उस उद्देश्य को स्वाभाविक रूप से व्यक्त करती है।
- source_word: αὐτὸν
  choice: उसे
  rationale: यह कर्मकारक सर्वनाम प्रसंग में यीशु की ओर संकेत करता है।
- source_word: παραδῷ
  choice: पकड़वाने
  rationale: παραδίδωμι का मूल भाव किसी को दूसरे के अधिकार या कब्ज़े में सौंपना है। इस गिरफ्तारी-संबंधी प्रसंग में ‘पकड़वाना’ सहज हिन्दी है और ‘विश्वासघात करना’ की अपेक्षा क्रिया के हस्तांतरण वाले भाव को बनाए रखता है।
theological_decisions:
- issue: यहूदा के प्रसंग में παραδῷ का अनुवाद
  choice: पकड़वाने
  alternative: उसके साथ विश्वासघात करने; उसे सौंप देने
  rationale: प्रसंग में यह कार्य विश्वासघात अवश्य है, पर यूनानी क्रिया का व्यापक अर्थ ‘सौंप देना’ है। मुख्य पाठ में ‘पकड़वाने’ से इच्छित गिरफ्तारी और दूसरे पक्ष के हाथों सौंपे जाने का भाव स्वाभाविक हिन्दी में आता है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ढूँढ़ने लगा’ अपूर्ण भूतकाल की जारी चेष्टा तथा ἀπὸ τότε के आरम्भ-बिंदु—दोनों को मिलाकर स्वाभाविक हिन्दी में व्यक्त करता है।
