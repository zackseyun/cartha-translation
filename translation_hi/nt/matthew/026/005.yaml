  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔλεγον δέ· Μὴ ἐν τῇ ἑορτῇ, ἵνα μὴ θόρυβος γένηται ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/005.yaml
  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: hi
  text: पर वे कह रहे थे, “पर्व के समय नहीं,[a] कहीं ऐसा न हो कि लोगों में उपद्रव मच जाए।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “त्योहार के दौरान नहीं।” यूनानी शब्द ἑορτή का अर्थ इस संदर्भ में “पर्व” या “त्योहार” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “कहीं लोगों में हंगामा न हो” अथवा “कहीं लोगों में दंगा न भड़क उठे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल चल रही या बार-बार व्यक्त की जा रही सलाह को दर्शाता है; इसलिए साधारण ‘कहा’ की अपेक्षा यह अधिक उपयुक्त है।
- source_word: δέ
  choice: पर
  rationale: यह पिछले कथन से हल्का विरोध या कथा में नया मोड़ दिखाता है।
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: पर्व के समय नहीं
  rationale: ἐν का प्रयोग यहाँ कालवाचक है और ἑορτή धार्मिक उत्सव को सूचित करता है; ‘पर्व’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: ἵνα μὴ
  choice: कहीं ऐसा न हो कि
  rationale: यह किसी अनचाहे परिणाम को टालने का आशय व्यक्त करता है और हिन्दी में स्वाभाविक है।
- source_word: θόρυβος
  choice: उपद्रव
  rationale: यह सार्वजनिक अशांति या हंगामे को सूचित करता है, पर अनिवार्य रूप से पूर्ण दंगे का अर्थ नहीं देता।
- source_word: γένηται
  choice: मच जाए
  rationale: उपद्रव के साथ हिन्दी का स्वाभाविक क्रियापद है और ‘उत्पन्न हो’ के अर्थ को सहज रूप में व्यक्त करता है।
- source_word: ἐν τῷ λαῷ
  choice: लोगों में
  rationale: λαός यहाँ एकत्र जनसमुदाय को दर्शाता है; ‘लोगों में’ मूल के सामाजिक संदर्भ को सहज हिन्दी में रखता है।
