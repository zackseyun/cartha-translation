translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद की अपूर्ण, विचार-विमर्शात्मक प्रकृति ‘कह रहे थे’ से और संभावित जन-अशांति की व्यापकता ‘उपद्रव’ से सुरक्षित रखी गई है।
