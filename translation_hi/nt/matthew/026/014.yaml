  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: hi
  text: तब बारहों में से एक[a], जिसे यहूदा इस्करियोती कहा जाता था, प्रधान याजकों के पास गया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बारह में से एक।’
    reason: यूनानी εἷς τῶν δώδεκα की शाब्दिक, संक्षिप्त अभिव्यक्ति को दर्शाता है; ‘बारहों’ हिन्दी में उसी पहचाने हुए समूह के लिए स्वाभाविक रूप है।
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह अगले घटनाक्रम का संकेत देने वाला कालवाचक कथन-सूचक है; ‘तब’ स्वाभाविक हिन्दी में कथा का क्रम बनाए रखता है।
- source_word: πορευθεὶς
  choice: गया
  rationale: यह πορεύομαι का क्रियाविशेषणात्मक कृदन्त है। हिन्दी में ‘जाकर’ भी सम्भव है, पर गन्तव्य के साथ मुख्य क्रिया ‘गया’ अधिक स्वाभाविक है और यूनानी वाक्य की गति को स्पष्ट रखती है।
- source_word: εἷς τῶν δώδεκα
  choice: बारह शिष्यों में से एक
  rationale: मूल में शाब्दिक रूप से ‘बारह में से एक’ है। हिन्दी में सन्दर्भ स्पष्ट करने के लिए ‘शिष्यों’ जोड़ा गया है; इसे पादटिप्पणी में अधिक शाब्दिक विकल्प के साथ दर्ज किया गया है।
- source_word: ὁ λεγόμενος
  choice: जिसे ... कहा जाता था
  rationale: यह कृदन्तीय पद यहूदा की पहचान बताता है। ‘कहा जाता था’ यूनानी अभिव्यक्ति का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: Ἰούδας Ἰσκαριώτης
  choice: यहूदा इस्करियोती
  rationale: नाम और उपनाम का प्रचलित हिन्दी बाइबलीय लिप्यन्तरण अपनाया गया है।
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: प्रधान याजकों के पास
  rationale: πρός के साथ कर्मकारक दिशा या गन्तव्य दर्शाता है। ‘प्रधान याजक’ उन वरिष्ठ याजकीय अधिकारियों के लिए प्रचलित और सन्दर्भानुकूल पद है।
theological_decisions:
- issue: τῶν δώδεκα में समूह-संज्ञा और स्पष्टता
  choice: बारह शिष्यों में से एक
  alternative: बारह में से एक
  rationale: यूनानी में ‘शिष्य’ शब्द नहीं है, पर ‘बारह’ यीशु के निकटतम शिष्य-समूह को सूचित करता है। मुख्य पाठ में साधारण पाठक के लिए स्पष्टता रखी गई है, जबकि पादटिप्पणी मूल की संक्षिप्त अभिव्यक्ति सुरक्षित रखती है। यह किसी धर्मसैद्धान्तिक भेद को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। नामों और याजकीय पदावली में प्रचलित हिन्दी बाइबलीय प्रयोग रखा गया है। वाक्य के अन्त में अल्पविराम अगले पद में जारी कथन को दर्शाता है।
