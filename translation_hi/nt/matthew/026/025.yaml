  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: hi
  text: तब उसे पकड़वाने वाले यहूदा ने उत्तर देकर कहा, “रब्बी, कहीं मैं तो नहीं हूँ?” यीशु ने उससे कहा, “तुमने स्वयं कह दिया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: उसे पकड़वाने वाला
  rationale: वर्तमान कृदंत यहूदा की पहचान उस व्यक्ति के रूप में कराता है जो यीशु को अधिकारियों के हाथ सौंपने वाला था; ‘पकड़वाने वाला’ प्रसंगानुकूल और स्वाभाविक हिन्दी है।
- source_word: Μήτι ἐγώ εἰμι
  choice: कहीं वह मैं तो नहीं?
  rationale: μήτι ऐसे प्रश्न का संकेत देता है जिसमें नकारात्मक उत्तर की अपेक्षा है; यह हिन्दी प्रयोग उस भाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: ῥαββί
  choice: रब्बी
  rationale: यह संबोधन ध्वन्यंतरित रूप में रखा गया है, क्योंकि यह यहूदी गुरु के लिए विशिष्ट पद है और हिन्दी बाइबलीय प्रयोग में परिचित है।
- source_word: Σὺ εἶπας
  choice: तुमने स्वयं कह दिया
  rationale: मूल का संक्षिप्त और कुछ हद तक परोक्ष उत्तर सुरक्षित रहता है; ‘स्वयं’ वक्ता की ओर लौटते बल को व्यक्त करता है, बिना इसे सीधे ‘हाँ’ में बदलने के।
theological_decisions:
- issue: यीशु के उत्तर की परोक्षता
  choice: तुमने स्वयं कह दिया।
  alternative: हाँ, तुम ही हो।
  rationale: Σὺ εἶπας शब्दशः प्रत्यक्ष ‘हाँ’ नहीं है। चुना हुआ अनुवाद उत्तर की वास्तविक पुष्टि-सदृश शक्ति और उसकी परोक्षता, दोनों को सुरक्षित रखता है।
- issue: यहूदा के प्रश्न में अपेक्षित उत्तर
  choice: कहीं वह मैं तो नहीं?
  alternative: क्या वह मैं हूँ?
  rationale: μήτι सामान्य तटस्थ प्रश्न नहीं, बल्कि ‘नहीं’ की अपेक्षा वाला प्रश्न बनाता है; चुना हुआ रूप उस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद स्वाभाविक, संक्षिप्त और गरिमापूर्ण रखा गया है। ‘यीशु’ को दूसरे वाक्य में स्पष्ट किया गया है ताकि हिन्दी में कर्ता अस्पष्ट न हो, यद्यपि यूनानी में केवल अंतर्निहित कर्ता है।
