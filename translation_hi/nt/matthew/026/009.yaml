  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उसका पैसा’ हिन्दी में स्पष्ट करता है कि गरीबों को वस्तु नहीं, उसकी बिक्री से मिली रकम दी जाती; यह संदर्भगत आशय है, कोई निश्चित राशि नहीं जोड़ी गई।
