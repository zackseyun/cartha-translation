    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: दिया जा सकता था
  rationale: अपूर्णकालीन δύναμαι यहाँ अतीत की ऐसी संभावना व्यक्त करता है जो पूरी नहीं हुई; हिन्दी में ‘जा सकता था’ इसे स्वाभाविक रूप से व्यक्त करता है और दोनों समन्वित क्रियाओं पर लागू होता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन में की गई शिकायत का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में इस व्याख्यात्मक संबंध को स्पष्ट रखता है।
- source_word: τοῦτο
  choice: इसे
  rationale: नपुंसकलिंग एकवचन संकेतवाचक पहले उल्लिखित वस्तु की ओर लौटता है; ‘इसे’ किसी अतिरिक्त संज्ञा को जोड़े बिना वही संदर्भ बनाए रखता है।
- source_word: πραθῆναι
  choice: बेचकर
  rationale: मूल में यह अओरिस्ट कर्मवाच्य अनंत रूप है। हिन्दी की संयुक्त संरचना ‘बेचकर ... दिया जा सकता था’ बिक्री और उसके बाद दान की स्वाभाविक क्रमिकता व्यक्त करती है; कर्मवाच्य संभावना मुख्य क्रिया में बनी रहती है।
- source_word: πολλοῦ
  choice: बड़ी रकम में
  rationale: यह मूल्य-सूचक संबंधकारक है और ऊँची बिक्री-राशि बताता है। ‘बड़ी रकम में’ सहज आधुनिक हिन्दी है, बिना कोई निश्चित राशि बताए।
- source_word: δοθῆναι
  choice: दिया जा सकता था
  rationale: अओरिस्ट कर्मवाच्य अनंत रूप को δύναμαι के साथ हिन्दी में अतीत की अपूर्ण संभावना के रूप में व्यक्त किया गया है।
- source_word: πτωχοῖς
  choice: गरीबों को
  rationale: संज्ञा के रूप में प्रयुक्त बहुवचन सम्प्रदान कारक निर्धन लोगों को सामूहिक रूप से दर्शाता है; ‘गरीबों को’ संक्षिप्त और स्वाभाविक है।
