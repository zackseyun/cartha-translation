translation:
  language: hi
  text: और उन्होंने षड्यंत्र रचा कि यीशु को छल से पकड़ें और मार डालें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: मिलकर योजना बनाई
  rationale: मध्यवाच्य क्रिया सामूहिक विचार-विमर्श और योजना बनाने को व्यक्त करती है; यह आधुनिक हिन्दी में स्वाभाविक है और केवल सामान्य ‘सलाह की’ से अधिक स्पष्ट है।
- source_word: δόλῳ
  choice: छल से
  rationale: δόλος का अर्थ छल, कपट या धूर्त युक्ति है। ‘छल से’ संक्षिप्त, सहज और प्रसंगानुकूल है; यह अनिवार्य रूप से केवल गुप्तता का अर्थ नहीं थोपता।
- source_word: κρατήσωσιν
  choice: पकड़ें
  rationale: इस प्रसंग में क्रिया का अर्थ किसी को बलपूर्वक अपने अधिकार में लेना या गिरफ्तार करना है। ‘पकड़ें’ मूल की सामान्य अभिव्यक्ति और कथात्मक प्रवाह दोनों बनाए रखता है।
- source_word: ἀποκτείνωσιν
  choice: मार डालें
  rationale: यह जान से मारने की स्पष्ट मंशा व्यक्त करता है और साधारण आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: ἵνα के उद्देश्यसूचक संबंध को बनाए रखना
  choice: कि यीशु को… पकड़ें और मार डालें
  alternative: यीशु को… पकड़ने और मार डालने की योजना बनाई
  rationale: ‘कि’ वाला आश्रित उपवाक्य योजना के लक्षित परिणाम/उद्देश्य को बनाए रखता है, बिना किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘छल से’ मूल के कपटपूर्ण साधन को बनाए रखता है, जबकि ‘मिलकर योजना बनाई’ सामूहिक षड्यंत्रकारी विचार को स्वाभाविक रूप से व्यक्त करता है।
