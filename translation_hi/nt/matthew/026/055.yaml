  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: hi
  text: उसी घड़ी यीशु ने भीड़ में इकट्ठे लोगों से कहा, “क्या तुम मुझे पकड़ने के लिए तलवारें और लाठियाँ लेकर ऐसे निकले हो, मानो मैं कोई डाकू[a] हूँ? मैं प्रतिदिन मंदिर में बैठकर सिखाता था, फिर भी तुमने मुझे नहीं पकड़ा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लुटेरा” अथवा “विद्रोही”; यूनानी शब्द λῃστής का अर्थ साधारण चोर से अधिक व्यापक हो सकता है और यह हिंसक डाकू या कुछ प्रसंगों में विद्रोही को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: उसी घड़ी
  rationale: यह समय-सूचक पदबंध की तात्कालिकता को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: τοῖς ὄχλοις
  choice: भीड़ों से
  rationale: यूनानी बहुवचन ὄχλοις को बनाए रखा गया है; प्रसंग में वहाँ उपस्थित विभिन्न समूहों की ओर संकेत संभव है।
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: मानो मैं कोई डाकू हूँ
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है। ‘डाकू’ हिंसक लुटेरे का अर्थ व्यक्त करता है, पर राजनीतिक विद्रोही का अर्थ अनिवार्य नहीं बनाता।
- source_word: ἐξήλθατε
  choice: निकले हो
  rationale: वक्ता की ओर आने के लिए हथियारबंद होकर निकलने की अभी-अभी हुई कार्रवाई को हिन्दी पूर्ण वर्तमान स्वाभाविक रूप से व्यक्त करता है।
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: तलवारें और लाठियाँ लेकर
  rationale: ξύλα यहाँ हथियार के रूप में प्रयुक्त लकड़ी की लाठियाँ हैं; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: συλλαβεῖν με
  choice: मुझे पकड़ने के लिए
  rationale: प्रसंग में इसका अर्थ हिरासत में लेने के लिए पकड़ना है। ‘गिरफ़्तार करने’ की तुलना में ‘पकड़ने’ से बाद के κρατέω के साथ मूल की पुनरुक्ति भी स्वाभाविक हिन्दी में बनी रहती है।
- source_word: καθ’ ἡμέραν
  choice: प्रतिदिन
  rationale: κατά के वितरणात्मक भाव को संक्षिप्त, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर में
  rationale: ἱερόν पूरे मन्दिर-परिसर को सूचित करता है; हिन्दी में ‘मन्दिर’ सामान्यतः इस व्यापक अर्थ को वहन कर सकता है, इसलिए अनावश्यक व्याख्यात्मक विस्तार नहीं किया गया।
- source_word: ἐκαθεζόμην διδάσκων
  choice: बैठकर शिक्षा देता था
  rationale: अपूर्णकाल की जारी अथवा प्रचलित क्रिया और साथ-साथ हो रहे शिक्षण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐκ ἐκρατήσατέ με
  choice: तुमने मुझे नहीं पकड़ा
  rationale: κρατέω का पकड़ने अथवा काबू में करने का भाव स्पष्ट है और खुले रूप से पहले न पकड़ने की विडंबना को बनाए रखता है।
theological_decisions:
- issue: λῃστής का अर्थ-क्षेत्र
  choice: डाकू
  alternative: लुटेरा; हिंसक गिरोहबाज़; विद्रोही
  rationale: यह शब्द साधारण चोर से अधिक हिंसक अपराधी को सूचित कर सकता है और कुछ प्रसंगों में विद्रोही भी हो सकता है। इस पद में राजनीतिक अर्थ निश्चित नहीं है, इसलिए मुख्य पाठ में ‘डाकू’ रखा और व्यापक अर्थ-क्षेत्र पादटिप्पणी में सुरक्षित किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, मौखिक किंतु गरिमापूर्ण संवादात्मक रूप अपनाया गया है। ‘मन्दिर’ व्यापक ἱερόν के लिए पर्याप्त स्वाभाविक है। मुख्य पाठ में केवल एक स्रोत-संगत पादटिप्पणी रखी गई है; प्रदत्त अंग्रेज़ी पादटिप्पणी b पाठ से असंबद्ध पूर्व-रूप प्रतीत होती है, इसलिए उसे आयात नहीं किया गया।
