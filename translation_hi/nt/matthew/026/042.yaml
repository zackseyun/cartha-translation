    text: “यह” और “इसे” से आशय पिछले पद में बताए गए दुःख के कटोरे से है। इस पद के यूनानी पाठ में केवल “यह” और “इसे” कहा गया है।
    reason: cross_reference
  revision_rationale: The revision removes contextual spatial information not present in the verse, restores the explicit object pronoun, and keeps the referent deliberately unspecified in the main text. The footnote supplies the immediate contextual connection to the cup without importing that noun into the translation.
