  to: फिर वह दूसरी बार चला गया और यह कहते हुए प्रार्थना की, “हे मेरे पिता, यदि यह तब तक नहीं टल सकता जब तक मैं इसे न पी लूँ,[a] तो आपकी इच्छा पूरी हो।”
