  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πάλιν ἐκ δευτέρου ἀπελθὼν προσηύξατο λέγων· Πάτερ μου, εἰ οὐ δύναται ⸀τοῦτο ⸀παρελθεῖν ἐὰν μὴ αὐτὸ πίω, γενηθήτω τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: hi
  text: फिर वह दूसरी बार चला गया और यह कहते हुए प्रार्थना की, “हे मेरे पिता, यदि यह तब तक नहीं टल सकता जब तक मैं इसे न पी लूँ,[a] तो आपकी इच्छा पूरी हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यह” और “इसे” से आशय पिछले पद में बताए गए दुःख के कटोरे से है। इस पद के यूनानी पाठ में केवल “यह” और “इसे” कहा गया है।
    reason: cross_reference
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: फिर ... दूसरी बार
  rationale: दोनों अभिव्यक्तियाँ पुनरावृत्ति को रेखांकित करती हैं; हिन्दी में इन्हें स्वाभाविक ढंग से रखते हुए यूनानी के दोनों तत्व सुरक्षित किए गए हैं।
- source_word: ἀπελθὼν
  choice: वह ... उनसे कुछ दूर गया
  rationale: पूर्ववर्ती क्रिया को हिन्दी कथा-शैली में मुख्य क्रिया के साथ रखा गया है। ‘कुछ दूर’ प्रसंगानुकूल अर्थ स्पष्ट करता है, यद्यपि मूल क्रिया का शाब्दिक अर्थ ‘चला गया/दूर गया’ है।
- source_word: προσηύξατο λέγων
  choice: यह कहते हुए प्रार्थना की
  rationale: कृदन्त λέγων और मुख्य क्रिया προσηύξατο का संबंध बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: Πάτερ μου
  choice: हे मेरे पिता
  rationale: सम्बोधन और स्वत्वसूचक सर्वनाम दोनों सुरक्षित हैं; ‘हे’ प्रार्थनात्मक सम्बोधन को स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: यदि यह ... नहीं टल सकता
  rationale: οὐ δύναται की असमर्थता/असंभवता और παρελθεῖν के यहाँ संकट के टल जाने के भाव को संक्षिप्त, सहज हिन्दी में व्यक्त किया गया है।
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: मेरे पिए बिना
  rationale: ἐὰν μή की ‘जब तक नहीं/बिना’ शर्त को स्वाभाविक हिन्दी में व्यक्त करता है। ‘यह’ का संदर्भ उसी वाक्य में बना रहता है और मूल में अनुपस्थित ‘कटोरा’ मुख्य पाठ में नहीं जोड़ा गया।
- source_word: γενηθήτω τὸ θέλημά σου
  choice: आपकी इच्छा पूरी हो
  rationale: आज्ञार्थक प्रार्थना का भाव और मत्ती 6:10 से भाषिक सामंजस्य बनाए रखा गया है। परमेश्वर के प्रति आधुनिक मानक हिन्दी का सम्मानसूचक ‘आपकी’ प्रयुक्त है।
theological_decisions:
- issue: τοῦτο / αὐτό के लिए मुख्य पाठ में ‘कटोरा’ जोड़ना या न जोड़ना
  choice: मुख्य पाठ में संकेतवाचक ‘यह’ रखा गया; ‘कटोरा’ नहीं जोड़ा गया।
  alternative: ‘यह कटोरा ... इसे पिए बिना’
  rationale: निकट प्रसंग (26:39) में संदर्भ कटोरे का है, पर इस पद के यूनानी पाठ में ποτήριον नहीं आता। इसलिए मुख्य पाठ मूल की अनिर्दिष्टता रखता है और संदर्भ पाद-टिप्पणी में स्पष्ट किया गया है।
- issue: γενηθήτω τὸ θέλημά σου में समर्पण की प्रार्थना
  choice: आपकी इच्छा पूरी हो
  alternative: आपकी इच्छा हो जाए
  rationale: यह रूप आज्ञार्थक प्रार्थना की शक्ति, गरिमा और मत्ती 6:10 के साथ अंतर्पाठीय सामंजस्य को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण प्रार्थनात्मक शैली। परमेश्वर के लिए सम्मानसूचक ‘आप’ का प्रयोग किया गया है। मुख्य पाठ में मूल यूनानी की संकेतात्मक अभिव्यक्ति को बनाए रखा गया है।
