  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: hi
  text: जब वे भोजन कर रहे थे, यीशु ने कहा, “मैं तुमसे सच कहता हूँ, तुममें से एक मेरे साथ विश्वासघात करेगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “मुझे सौंप देगा” या “मुझे हवाले कर देगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: जब वे भोजन कर रहे थे
  rationale: संबंधकारक स्वतंत्र रचना साथ-साथ चल रही क्रिया बताती है। यह चयन उसी समयगत अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ἀμὴν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यीशु के कथनों के आरम्भ में ἀμήν आने वाले कथन की सत्यता और गंभीर प्रामाणिकता पर बल देता है। हिन्दी में ‘सच’ इस कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे … कहता हूँ
  rationale: प्रत्यक्ष संबोधन और वर्तमानकालीन कथन-सूत्र दोनों सुरक्षित रखे गए हैं; Ἀμὴν के अनुवाद के साथ इसे एक स्वाभाविक हिन्दी वाक्य में जोड़ा गया है।
- source_word: εἷς ἐξ ὑμῶν
  choice: तुममें से एक
  rationale: यह अंशात्मक अभिव्यक्ति का सीधा, स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: παραδώσει με
  choice: मेरे साथ विश्वासघात करेगा
  rationale: इस प्रसंग में क्रिया यीशु को शत्रुओं के हाथ सौंपने के साथ-साथ अपने निकट साथी द्वारा किए गए विश्वासघात को सूचित करती है। मुख्य पाठ में प्रसंगगत अर्थ दिया गया है, जबकि व्यापक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: दुःखभोग-वृत्तांत में παραδώσει का अनुवाद
  choice: मेरे साथ विश्वासघात करेगा
  alternative: मुझे सौंप देगा / मुझे उनके हवाले कर देगा
  rationale: यूनानी क्रिया का मूल अर्थ किसी को सौंपना या हवाले करना है, पर यहाँ यीशु के अपने शिष्यों में से एक द्वारा किया जाने वाला कपटपूर्ण कार्य सामने है। ‘विश्वासघात’ प्रसंगगत संबंधपरक अर्थ स्पष्ट करता है; पादटिप्पणी क्रिया की व्यापक अर्थ-सीमा बनाए रखती है और किसी एक व्याख्या को छिपाती नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भोजन कर रहे थे’ सामान्य ‘खा रहे थे’ की अपेक्षा थोड़ा अधिक औपचारिक है, पर साधारण पाठक के लिए पूर्णतः स्पष्ट है। कर्ता को संदर्भानुसार ‘यीशु’ कहकर स्पष्ट किया गया है, क्योंकि हिन्दी में केवल ‘उसने’ कहना स्वतंत्र पद-पाठ में अस्पष्ट हो सकता है।
