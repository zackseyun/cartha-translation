id: MAT.26.41
reference: Matthew 26:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: hi
  text: जागते रहो और प्रार्थना करते रहो, ताकि तुम परीक्षा[a] में न पड़ो। आत्मा तो तैयार है, पर शरीर दुर्बल है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रलोभन’ अथवा ‘कठिन परीक्षा’। यूनानी शब्द का अर्थ पाप की ओर लुभाया जाना या किसी कठिन कसौटी से गुजरना—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: जागते रहो
  rationale: बहुवचन आज्ञार्थक क्रिया का मूल अर्थ जागना और सतर्क रहना है। गतसमनी में शिष्यों के सो जाने के संदर्भ में ‘जागते रहो’ शारीरिक जागरण और आत्मिक सतर्कता—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: προσεύχεσθε
  choice: प्रार्थना करते रहो
  rationale: वर्तमान आज्ञार्थक रूप निरंतरता का भाव दे सकता है; ‘करते रहो’ आधुनिक हिन्दी में उस जारी रहने वाली आज्ञा को सहज रूप से व्यक्त करता है।
- source_word: ἵνα μὴ εἰσέλθητε
  choice: ताकि तुम ... में न पड़ो
  rationale: वाक्यांश उद्देश्य या रोकथाम व्यक्त करता है। यूनानी में शाब्दिक रूप से ‘प्रवेश न करो’ है, पर हिन्दी में परीक्षा/प्रलोभन के साथ ‘में न पड़ो’ स्वाभाविक मुहावरा है और संकट में फँसने का रूपक बनाए रखता है।
- source_word: πειρασμόν
  choice: परीक्षा
  rationale: πειρασμός परीक्षा, कठिन कसौटी या पाप के प्रलोभन को सूचित कर सकता है। आसन्न दबाव और नैतिक विफलता दोनों की संभावना होने से ‘परीक्षा’ मुख्य पाठ में व्यापक अर्थ बनाए रखता है; ‘प्रलोभन’ को पादटिप्पणी में दिया गया है।
- source_word: τὸ μὲν πνεῦμα
  choice: आत्मा तो
  rationale: μέν...δέ का विरोध हिन्दी के ‘तो...पर’ से सहज रूप में व्यक्त होता है। यहाँ ‘आत्मा’ मनुष्य की भीतरी इच्छा या तत्परता को सूचित करती प्रतीत होती है, हालांकि शब्द स्वयं कुछ अर्थगत खुलापन रखता है।
- source_word: πρόθυμον
  choice: तैयार है
  rationale: πρόθυμος इच्छा, उत्सुकता और तत्परता का बोध कराता है। ‘तैयार’ शिष्यों की सच्ची भीतरी तत्परता को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἡ δὲ σὰρξ
  choice: पर शरीर
  rationale: σάρξ का शाब्दिक अर्थ ‘मांस’ है, पर यहाँ इसका आशय मनुष्य की देहधारी दुर्बलता है। आधुनिक हिन्दी में ‘शरीर’ उस अर्थ को स्पष्ट करता है और ‘पापी स्वभाव’ जैसी अधिक व्याख्यात्मक धारणा आरोपित नहीं करता।
- source_word: ἀσθενής
  choice: दुर्बल है
  rationale: ἀσθενής का अर्थ कमजोर या सामर्थ्यहीन है। ‘दुर्बल’ गरिमापूर्ण, स्पष्ट और आत्मा की तत्परता के साथ उचित विरोध बनाता है।
theological_decisions:
- issue: πνεῦμα का अभिप्राय
  choice: मनुष्य की आत्मा/भीतरी तत्परता
  alternative: पवित्र आत्मा
  rationale: शिष्यों की सच्ची इच्छा और उनकी वास्तविक विफलता के संदर्भ में ‘शरीर’ के साथ विरोध मानव आत्मा या भीतरी मनोभाव की ओर संकेत करता है। हिन्दी में ‘आत्मा’ शब्द रखा गया है, बिना पाठ में कोई अतिरिक्त सिद्धान्त जोड़ने के।
- issue: σάρξ का अनुवाद
  choice: शरीर
  alternative: मांस; पापी स्वभाव
  rationale: यहाँ विषय विकसित पाप-स्वभाव की धारणा नहीं, बल्कि मनुष्य की देहधारी दुर्बलता है। ‘शरीर’ साधारण पाठक के लिए स्वाभाविक है, जबकि ‘पापी स्वभाव’ अर्थ को आवश्यकता से अधिक निश्चित कर देगा।
- issue: πειρασμός का अर्थ
  choice: परीक्षा
  alternative: प्रलोभन; कठिन कसौटी
  rationale: आसन्न घटना एक कठिन परीक्षा भी है और पाप में गिराने वाला प्रलोभन भी। मुख्य पाठ में व्यापक ‘परीक्षा’ और पादटिप्पणी में विकल्प रखकर मूल की अर्थगत बहुलता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, बहुवचन संबोधन और गरिमापूर्ण किंतु सामान्य शब्दावली। ‘जागते रहो’ तथा ‘प्रार्थना करते रहो’ से लगातार सतर्कता और प्रार्थना का भाव आता है। मुख्य पाठ में केवल एक आवश्यक पादटिप्पणी रखी गई है।
