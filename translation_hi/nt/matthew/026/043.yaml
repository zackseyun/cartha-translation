source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ⸂πάλιν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ βεβαρημένοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: hi
  text: वह फिर आया और उसने उन्हें सोते हुए पाया, क्योंकि उनकी आँखें बोझिल हो गई थीं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी आँखें भारी हो गई थीं।”
    reason: βεβαρημένοι के अधिक शाब्दिक विकल्प को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ἐλθὼν
  choice: आया
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले की सहायक क्रिया बताता है; हिन्दी में ‘आया और’ स्वाभाविक रूप से घटनाक्रम बनाए रखता है।
- source_word: πάλιν
  choice: फिर
  rationale: यह पुनरावृत्ति का सामान्य क्रियाविशेषण है; ‘फिर’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: εὗρεν
  choice: उसने ... पाया
  rationale: εὑρίσκω का सामान्य कथात्मक अर्थ ‘पाना’ है; कर्ता प्रसंग से यीशु है और हिन्दी में सर्वनाम स्पष्ट किया गया है।
- source_word: καθεύδοντας
  choice: सोते हुए
  rationale: वर्तमान कृदंत उस समय जारी अवस्था/क्रिया को दिखाता है जब उसने उन्हें पाया; ‘सोते हुए’ इस पक्ष को सुरक्षित रखता है।
- source_word: ἦσαν γὰρ
  choice: क्योंकि ... थीं
  rationale: γάρ उनके सोते पाए जाने का कारण स्पष्ट करता है; ‘क्योंकि’ हिन्दी में इस व्याख्यात्मक संबंध को सहजता से व्यक्त करता है।
- source_word: οἱ ὀφθαλμοὶ
  choice: उनकी आँखें
  rationale: αὐτῶν οἱ ὀφθαλμοί का स्वाभाविक हिन्दी रूप ‘उनकी आँखें’ है।
- source_word: βεβαρημένοι
  choice: बोझिल हो गई थीं
  rationale: पूर्ण निष्क्रिय कृदंत उस परिणामी अवस्था को व्यक्त करता है जिसमें आँखें नींद से भारी पड़ चुकी थीं; ‘बोझिल हो गई थीं’ अर्थ और परिणामी पक्ष दोनों को स्वाभाविक हिन्दी में रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यूनानी कृदंतीय रचना को अप्राकृतिक हिन्दी में ज्यों का त्यों रखने के बजाय ‘आया और ... पाया’ से कथात्मक प्रवाह व्यक्त किया गया है। उपलब्ध अंग्रेज़ी परामर्श-पाठ में [a] का स्थान ‘again’ के बाद है, जबकि उसकी टिप्पणी βεβαρημένοι (‘भारी/बोझिल’) से संबंधित है; इसलिए स्रोत-संगति के लिए चिह्न संबंधित वाक्यांश के बाद रखा गया है।
