  verdict: revise
  source_fidelity: The draft accurately renders the overall sequence, the perfect force of γέγονεν ('हुआ है'), the fulfillment clause, and the disciples' collective flight. However, αἱ γραφαὶ is plural, while 'पवित्रशास्त्र' normally functions as a singular collective in Hindi and can suggest the Bible as one volume. 'पवित्र लेख' preserves the plural sacred-text sense more directly. The supplied English audit trail also marks the contextual stronger sense of ἀφέντες with a footnote; the Hindi text should retain a corresponding anchored alternative.
  naturalness: The narrative is clear and modern. 'भविष्यद्वक्ताओं के पवित्रशास्त्र पूरे हों' is understandable but somewhat less idiomatic and less precise in number than 'भविष्यद्वक्ताओं के पवित्र लेख पूरे हों.'
  terminology: '''भविष्यद्वक्ता,'' ''चेले,'' and fulfillment wording are suitable. ''पवित्र लेख'' is preferable here for the plural γραφαί without adding whether the prophets spoke or wrote them.'
  issues:
  - severity: medium
    issue: The plural αἱ γραφαὶ is rendered by the normally singular/collective 'पवित्रशास्त्र.'
    rationale: Using 'पवित्र लेख' naturally represents plural sacred writings in Hindi and avoids implying a single later bound volume.
  - severity: low
    issue: The lexical-alternative footnote for ἀφέντες is not carried over.
    rationale: The English POB audit trail explicitly flags 'abandoned/deserted' as a contextual alternative. Adding an anchored Hindi note preserves this nuance without forcing an interpretive main-text rendering.
