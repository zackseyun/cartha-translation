  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: hi
  text: पर यह सब इसलिए हुआ है कि भविष्यद्वक्ताओं के पवित्र लेख पूरे हों। तब सभी चेले उसे छोड़कर[a] भाग गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे त्यागकर”; ἀφέντες का अर्थ इस संदर्भ में अधिक प्रबल रूप से “उसे छोड़ देना” या “त्याग देना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: पर यह सब
  rationale: यह पूरे पूर्ववर्ती घटनाक्रम की ओर संकेत करता है; ‘पर’ δέ के हल्के विरोधात्मक या संयोजक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: γέγονεν
  choice: हुआ है
  rationale: पूर्ण काल घटित घटना के वर्तमान परिणाम या प्रासंगिकता को व्यक्त करता है; ‘हुआ है’ इसे सहज हिन्दी में बनाए रखता है।
- source_word: ἵνα πληρωθῶσιν
  choice: इसलिए ... कि ... पूरे हों
  rationale: यह ἵνα और विधिलिंग की उद्देश्य/परिणाम संबंधी शक्ति को हिन्दी के स्वाभाविक ढाँचे में व्यक्त करता है।
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: भविष्यद्वक्ताओं के पवित्रशास्त्र
  rationale: γραφαί यहाँ पवित्र और प्रामाणिक लेखों को सूचित करता है; संबंधकारक को ‘के’ द्वारा संक्षिप्त रखा गया है, बिना ‘लिखे’ या ‘कहे’ जोड़कर अर्थ सीमित किए।
- source_word: τότε
  choice: तब
  rationale: यह कथा में अगले घटनाक्रम को सीधे और स्वाभाविक रूप से चिह्नित करता है।
- source_word: οἱ μαθηταὶ πάντες
  choice: सभी चेले
  rationale: πάντες की समग्रता स्पष्ट रहती है और मूल में निहित न होने के कारण ‘उसके’ नहीं जोड़ा गया।
- source_word: ἀφέντες αὐτὸν
  choice: उसे छोड़कर
  rationale: ἀφίημι का प्रसंगगत अर्थ उसे पीछे छोड़ना या त्याग देना है; ‘छोड़कर’ स्वाभाविक है और साथ आने वाला ‘भाग गए’ परित्याग की गंभीरता स्पष्ट करता है।
- source_word: ἔφυγον
  choice: भाग गए
  rationale: यह ἔφυγον के पलायन संबंधी अर्थ को साधारण आधुनिक हिन्दी में ठीक प्रकार व्यक्त करता है।
theological_decisions:
- issue: भविष्यद्वक्ताओं के पवित्रशास्त्र की पूर्ति
  choice: 'पूर्ति की स्पष्ट भाषा रखी गई: ‘कि भविष्यद्वक्ताओं के पवित्रशास्त्र पूरे हों।’'
  alternative: ‘कि भविष्यद्वक्ताओं ने जो लिखा था वह सच हो जाए।’
  rationale: मत्ती का पूर्ति-विषयक बल मूल पाठ में स्पष्ट और धर्मवैज्ञानिक रूप से महत्त्वपूर्ण है। चुना गया रूप पवित्रशास्त्रीय तथा भविष्यद्वक्ताई संबंध को बनाए रखता है और संबंधकारक को अनावश्यक रूप से ‘लिखे’ या ‘कहे’ में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘पवित्रशास्त्र’ धार्मिक संदर्भ में γραφαί का सटीक तथा परिचित रूप है। ‘चेले’ सामान्य पाठक के लिए सहज है। अंग्रेज़ी परामर्श-पाठ की फुटनोट ἀφέντες से संबंधित थी, न कि पूर्ति-वाक्य से; हिन्दी ‘छोड़कर’ मूल की अर्थ-सीमा पर्याप्त रूप से रखता है, इसलिए अलग फुटनोट आवश्यक नहीं समझा गया।
