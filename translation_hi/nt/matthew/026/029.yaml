  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: hi
  text: पर मैं तुमसे कहता हूँ, अब से मैं दाखलता के इस फल में से उस दिन तक निश्चय ही नहीं पीऊँगा, जब मैं इसे अपने पिता के राज्य में तुम्हारे साथ नए रूप में[a] पीऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘फिर से’ अथवा ‘नई रीति से’; यूनानी विशेषण प्रकार या गुण की नवीनता बता सकता है, और यह वाक्य आने वाले राज्य में इसे नए ढंग से पीने का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: पर मैं तुमसे कहता हूँ
  rationale: δέ यहाँ हल्का विरोध अथवा कथन में परिवर्तन सूचित करता है। ‘पर’ इस बदलाव को स्वाभाविक ढंग से व्यक्त करता है, बिना विरोध को आवश्यकता से अधिक प्रबल बनाए।
- source_word: οὐ μὴ πίω
  choice: निश्चय ही नहीं पीऊँगा
  rationale: οὐ μή के साथ aorist subjunctive भविष्य के विषय में प्रबल निषेध व्यक्त करता है। यह रूप उस बल को आधुनिक और सहज हिन्दी में बनाए रखता है।
- source_word: ἀπ’ ἄρτι
  choice: अब से
  rationale: यह वर्तमान क्षण से आरम्भ होने वाली अवधि को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: दाखलता का यह फल
  rationale: γένημα का अर्थ उपज या फल है। मूल के मुहावरे को बनाए रखा गया है और उसे केवल ‘दाखरस’ कहकर स्पष्ट नहीं किया गया, ताकि स्रोत की शब्दावली और संकेत दोनों सुरक्षित रहें।
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: उस दिन तक
  rationale: ἐκείνης एक निश्चित भावी दिन की ओर संकेत करता है; ‘उस दिन’ इस संकेत को बनाए रखता है।
- source_word: ὅταν αὐτὸ πίνω
  choice: जब मैं इसे ... पीऊँगा
  rationale: ὅταν के साथ present subjunctive यहाँ समय की दृष्टि से भावी घटना को दर्शाता है। ‘इसे’ का संकेत दाखलता के फल, अर्थात प्याले की वस्तु, की ओर है।
- source_word: καινὸν
  choice: नए रूप में
  rationale: καινός प्रकार या गुण की नवीनता व्यक्त कर सकता है। हिन्दी में अकेला ‘नया पीऊँगा’ अस्वाभाविक है, इसलिए ‘नए रूप में’ चुना गया; ‘फिर से’ की सम्भावित छाया को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: μεθ’ ὑμῶν
  choice: तुम्हारे साथ
  rationale: यह सहभागिता या संगति को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: अपने पिता के राज्य में
  rationale: वक्ता यीशु होने के कारण हिन्दी में ‘अपने पिता’ स्वाभाविक रूप से यूनानी ‘मेरे पिता’ का सम्बन्ध स्पष्ट करता है और वाक्य को अनावश्यक रूप से भारी नहीं बनाता।
theological_decisions:
- issue: प्याले की वस्तु को सीधे ‘दाखरस’ कहना या मूल मुहावरा बनाए रखना
  choice: मुख्य पाठ में ‘दाखलता का यह फल’
  alternative: दाखरस
  rationale: यूनानी पाठ οἶνος नहीं, बल्कि ‘दाखलता का फल/उपज’ कहता है। मुहावरे को बनाए रखना मूल-भाषा की प्रधानता का सम्मान करता है और पाठ से आगे बढ़कर संस्कारात्मक या प्रतीकात्मक विशिष्टता निर्धारित नहीं करता।
- issue: भावी राज्य के भोज में καινὸν का आशय
  choice: मुख्य पाठ में ‘नए रूप में’, साथ में पादटिप्पणी
  alternative: फिर से; नई रीति से; नया
  rationale: विशेषण गुण या प्रकार की नवीनता, अथवा नए सिरे से सहभागिता की ओर संकेत कर सकता है। पद इस सूक्ष्मता को पूरी तरह निश्चित नहीं करता, इसलिए मुख्य पाठ और पादटिप्पणी मिलकर अस्पष्टता को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। मूल के प्रबल निषेध, दाखलता-वाले मुहावरे और καινὸν की अर्थगत खुली जगह को बनाए रखा गया है।
