source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: hi
  text: तब यीशु ने उससे कहा, “अपनी तलवार वापस उसकी जगह रख दो, क्योंकि जो भी तलवार उठाते हैं[a], वे तलवार से नाश होंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तलवार हाथ में लेते हैं”; यह अभिव्यक्ति केवल हथियार पकड़ने के बजाय हिंसक बल का सहारा लेने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: कथा में अगली घटना का स्वाभाविक काल-संकेत देता है।
- source_word: λέγει αὐτῷ
  choice: यीशु ने उससे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथन-शैली में सामान्य भूतकाल से व्यक्त किया गया है।
- source_word: Ἀπόστρεψον
  choice: वापस ... रख दो
  rationale: आज्ञा तत्काल उलटाव की माँग करती है; प्रसंग में निकाली हुई तलवार को उसके स्थान पर लौटाना अभिप्रेत है।
- source_word: τὴν μάχαιράν σου
  choice: अपनी तलवार
  rationale: μάχαιρα चाकू, कटार या छोटी तलवार हो सकती है; इस गिरफ्तारी-प्रसंग और सूक्तिपरक समानांतर में ‘तलवार’ सबसे स्पष्ट और प्रचलित है।
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: उसकी जगह
  rationale: हथियार को उसके निर्धारित स्थान पर वापस रखने का भाव सरल और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: क्योंकि जो भी तलवार उठाते हैं
  rationale: संज्ञीकृत कृदन्त यहाँ सामान्य सिद्धान्त व्यक्त करता है। ‘तलवार उठाना’ हथियार पकड़ने के साथ हिंसक बल का सहारा लेने का अर्थ भी रख सकता है।
- source_word: ἐν μαχαίρῃ
  choice: तलवार से
  rationale: करण कारक के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता और कथन का समानांतर बनाए रखता है।
- source_word: ἀπολοῦνται
  choice: नाश होंगे
  rationale: भविष्यकालीन ἀπόλλυμι यहाँ मृत्यु या विनाश को सूचित करता है; ‘नाश होंगे’ उसकी गंभीरता और कुछ अर्थगत व्यापकता को सुरक्षित रखता है।
theological_decisions:
- issue: तलवार के विषय में यीशु के कथन का दायरा
  choice: 'इसे सामान्य सिद्धान्त के रूप में रखा गया है: ‘जो भी तलवार उठाते हैं ...’।'
  alternative: इसे या तो हर प्रकार के बल का निरपेक्ष निषेध, या केवल इसी तत्काल परिस्थिति से संबंधित भविष्यवाणी समझना।
  rationale: यूनानी रचना सामान्यीकरण करती है। अनुवाद कथन की व्यापकता बनाए रखता है, पर हिंसा के संबंध में पाठ से आगे बढ़कर कोई सांप्रदायिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सूक्तिपरक। ‘रख दो’ प्रत्यक्ष आज्ञा की स्वाभाविकता बनाए रखता है, जबकि ‘नाश होंगे’ मूल क्रिया की गंभीरता को व्यक्त करता है।
