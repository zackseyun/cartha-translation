  terminology: ‘मनुष्य का पुत्र,’ ‘महिमा,’ and ‘स्वर्गदूत’ are suitable established biblical terminology. ‘प्रतिफल देगा’ adequately conveys judicial recompense without restricting it to either reward or punishment. ‘काम’ is a natural distributive rendering of singular πρᾶξις in this context.
