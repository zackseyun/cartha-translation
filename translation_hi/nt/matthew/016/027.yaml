id: MAT.16.27
reference: Matthew 16:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: hi
  text: क्योंकि मनुष्य का पुत्र अपने पिता की महिमा में अपने स्वर्गदूतों के साथ आने वाला है[a], और तब वह हर एक को उसके काम के अनुसार प्रतिफल देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आएगा’ अथवा ‘आने को है।’ यूनानी क्रिया में केवल साधारण भविष्य से अधिक, होने वाली या आसन्न क्रिया का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसने जो किया है, उसके अनुसार।’ यूनानी में ‘काम/कार्य’ एकवचन है, पर यहाँ वह प्रत्येक व्यक्ति के आचरण या किए हुए काम को वितरणात्मक रूप से बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει
  choice: आने पर है
  rationale: μέλλω के साथ infinitive आसन्न या निकट भविष्य की क्रिया का भाव देता है। ‘आने पर है’ सामान्य भविष्य ‘आएगा’ की अपेक्षा इस निकटता को बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को सहज और स्पष्ट बनाता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु की स्थापित आत्म-पदवी का औपचारिक और अंतर्पाठीय प्रतिध्वनि बनाए रखने वाला अनुवाद है।
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: अपने पिता की महिमा में
  rationale: ἐν को ‘में’ से व्यक्त किया गया है, जिससे उस महिमा के क्षेत्र या प्रकट रूप में आगमन का भाव बना रहता है।
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: अपने स्वर्गदूतों के साथ
  rationale: μετά + संबंधकारक साथ या संगति बताता है; ‘के साथ’ इसका सीधा स्वाभाविक रूप है। ἄγγελοι को प्रसंगानुसार ‘स्वर्गदूत’ किया गया है।
- source_word: ἀποδώσει
  choice: प्रतिफल देगा
  rationale: ἀποδίδωμι न्याय के प्रसंग में किसी को उसके अनुसार देय परिणाम लौटाने का अर्थ रखता है। ‘प्रतिफल देगा’ अच्छे या बुरे दोनों न्यायोचित परिणामों के लिए खुला रहता है और केवल पुरस्कार का अर्थ नहीं थोपता।
- source_word: ἑκάστῳ
  choice: हर एक को
  rationale: एकवचन दत्तिव का वितरणात्मक बल स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: उसके काम के अनुसार
  rationale: πρᾶξις का एकवचन प्रत्येक व्यक्ति के आचरण या किए हुए काम को वितरणात्मक रूप में बताता है। ‘काम’ आधुनिक पाठक के लिए स्वाभाविक है और पाप या पुण्य में से किसी एक तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: μέλλει के साथ मनुष्य के पुत्र के आगमन का कालगत बल
  choice: ‘आने पर है’ द्वारा आसन्नता का भाव बनाए रखा गया।
  alternative: ‘आएगा’ या ‘आनेवाला है’।
  rationale: मूल यूनानी केवल साधारण भविष्य नहीं कहता, बल्कि μέλλω + infinitive का प्रयोग करता है। व्यापक अंतकाल-संबंधी विवाद को अनुवाद में हल किए बिना इस कालगत तनाव को सुरक्षित रखना उचित है।
- issue: कर्म के अनुसार न्याय और प्रतिदान
  choice: ‘हर एक को उसके काम के अनुसार प्रतिफल देगा।’
  alternative: ‘हर एक को उसके किए के अनुसार बदला देगा’ या ‘हर एक को उसके कामों के अनुसार देगा।’
  rationale: वाक्य व्यक्तिगत न्यायोचित प्रतिदान कहता है, पर उद्धार-विज्ञान की कोई अतिरिक्त व्यवस्था नहीं समझाता। ‘प्रतिफल’ न्याय के अनुकूल परिणाम को व्यक्त करता है, जबकि एकवचन ‘काम’ मूल के πρᾶξις को यथासंभव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘मनुष्य का पुत्र’ और ‘महिमा’ जैसी स्थापित बाइबलीय पदावली रखी गई है। ‘आने पर है’ कुछ चिह्नित अभिव्यक्ति है, पर मूल की वास्तविक आसन्नता को जानबूझकर सुरक्षित रखती है; पादटिप्पणी स्वाभाविक विकल्प देती है।
