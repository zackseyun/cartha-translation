reference: Matthew 16:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: hi
  text: जब यीशु कैसरिया फिलिप्पी के क्षेत्र में आए, तो वे अपने शिष्यों से पूछने लगे, “लोग क्या कहते हैं कि मनुष्य का पुत्र[b] कौन है?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “लोग मनुष्य के पुत्र को कौन कहते हैं कि वह है?”
    reason: यूनानी के ‘किसे ... होना कहते हैं’ वाले वाक्य-विन्यास का अधिक निकट विकल्प दिखाने के लिए।
  - marker: b
    text: “मनुष्य का पुत्र” यीशु द्वारा अपने लिए प्रयुक्त एक विशिष्ट पद है; इसका अनुवाद “मानव-पुत्र” भी किया जा सकता है।
    reason: इस आत्म-संदर्भात्मक, शीर्षक-सदृश पद की महत्ता बताते हुए एक वैकल्पिक हिन्दी रूप देना, बिना उसका अर्थ निर्णायक रूप से सीमित किए।
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: जब ... आए, तो
  rationale: अओरिस्ट कृदंत नए प्रसंग में यीशु के आने को मुख्य क्रिया की समय-भूमि बनाता है। δέ के हल्के संक्रमण को हिन्दी के स्वाभाविक ‘जब ... तो’ विन्यास में समाहित किया गया है; अलग से ‘अब’ जोड़ना आवश्यक नहीं है।
- source_word: εἰς τὰ μέρη
  choice: के क्षेत्र में
  rationale: μέρη यहाँ शाब्दिक ‘भागों’ के बजाय किसी नगर के आसपास के इलाके या क्षेत्र को दर्शाता है।
- source_word: Καισαρείας τῆς Φιλίππου
  choice: कैसरिया फिलिप्पी
  rationale: स्थान-नाम का प्रचलित लिप्यंतरण अपनाया गया है; यूनानी संबंधकारक रचना को कृत्रिम रूप से ‘फिलिप्पुस का कैसरिया’ नहीं बनाया गया।
- source_word: ἠρώτα
  choice: पूछने लगे
  rationale: अपूर्ण भूतकाल के प्रवाहशील अथवा आरंभात्मक पक्ष को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है और केवल एक क्षणिक ‘पूछा’ से कुछ अधिक पहलूगत अर्थ बचाता है।
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: अपने शिष्यों से
  rationale: μαθηταί के लिए सुस्पष्ट और स्थापित हिन्दी शब्द ‘शिष्य’ है; αὐτοῦ को कर्ता के संदर्भ में स्वाभाविक ‘अपने’ से व्यक्त किया गया है।
- source_word: λέγων
  choice: यह
  rationale: यूनानी का ‘कहते हुए’ हिन्दी में प्रश्नवाचक उद्धरण के साथ शब्दशः दोहराने पर बोझिल होता; ‘यह पूछने लगे’ उसी उद्धरण-परिचायक कार्य को स्वाभाविक रूप में निभाता है।
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι
  choice: लोग ... को कौन कहते हैं
  rationale: ἄνθρωποι यहाँ सामान्य रूप से लोगों के लिए है, केवल पुरुषों के लिए नहीं। हिन्दी का यह प्रश्न-विन्यास यूनानी अप्रत्यक्ष कथन का अर्थ स्पष्ट और सहज रखता है।
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र को
  rationale: मूल पदबंध ‘मनुष्य का पुत्र’ है; ‘को’ के कारण हिन्दी में संबंधसूचक ‘का’ का रूप ‘के’ होना व्याकरणिक है। यह पारंपरिक पद दानिय्येल 7 से संभावित अंतर्पाठीय संबंध और यीशु की विशिष्ट आत्म-पदवी दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου का अनुवाद
  choice: 'मनुष्य का पुत्र (वाक्य में: मनुष्य के पुत्र को)'
  alternative: मानव-पुत्र / वह मानव जन
  rationale: ‘मनुष्य का पुत्र’ हिन्दी बाइबल परंपरा में पहचानी जाने वाली अभिव्यक्ति है और मूल की सामी पृष्ठभूमि, यीशु के आत्म-संदर्भ तथा दानिय्येल 7 की संभावित प्रतिध्वनि को बिना किसी एक व्याख्या में सीमित किए बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘क्षेत्र’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘पूछने लगे’ यूनानी अपूर्ण भूतकाल का पक्ष स्वाभाविक हिन्दी में संकेत करता है। उद्धरण में शब्दक्रम बोलचाल के अनुकूल है और ‘मनुष्य का पुत्र’ की पारंपरिक धार्मिक प्रतिध्वनि सुरक्षित है।
