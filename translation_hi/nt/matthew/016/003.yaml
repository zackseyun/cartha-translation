id: MAT.16.3
reference: Matthew 16:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: hi
  text: और सुबह कहते हो, ‘आज तूफ़ानी मौसम रहेगा, क्योंकि आकाश लाल और घिरा हुआ है।’ तुम आकाश का रूप[a] पहचानना जानते हो, पर समयों के चिन्हों[b] को नहीं पहचान सकते।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘आकाश का चेहरा’।
    reason: lexical_alternative
  - marker: b
    text: ‘समयों के चिन्ह’ वर्तमान घड़ी के आत्मिक महत्त्व को सूचित कर सकते हैं, जिसमें यीशु के मसीहाई कार्य भी शामिल हैं।
    reason: alternative_reading
  - marker: c
    text: कुछ प्राचीन पांडुलिपियों में यह अंतिम वाक्य नहीं मिलता।
    reason: textual_variant
lexical_decisions:
- source_word: πρωΐ
  choice: सुबह
  rationale: यह क्रियाविशेषण सुबह के समय को दर्शाता है; ‘सुबह’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: χειμών
  choice: तूफ़ानी मौसम
  rationale: इस प्रसंग में शब्द ऋतु ‘सर्दी’ के बजाय खराब या तूफ़ानी मौसम को सूचित करता है।
- source_word: πυρράζει
  choice: लाल ... है
  rationale: क्रिया आकाश के लाल दिखाई देने को बताती है; ‘लाल है’ हिन्दी में सहज है और अर्थ को अनावश्यक रूप से तीव्र नहीं करती।
- source_word: στυγνάζων
  choice: घिरा हुआ
  rationale: कृदंत आकाश के उदास, अँधियारे या बादलों से ढके रूप को दर्शाता है; मौसम के प्रसंग में ‘घिरा हुआ’ स्वाभाविक है।
- source_word: πρόσωπον
  choice: रूप
  rationale: शाब्दिक अर्थ ‘चेहरा’ है, पर यहाँ आकाश का दिखाई देने वाला रूप अभिप्रेत है।
- source_word: γινώσκετε διακρίνειν
  choice: परखना जानते हो
  rationale: यह रचना सीखी हुई पहचान और विवेचन की क्षमता व्यक्त करती है; ‘परखना जानते हो’ दोनों भावों को सहज हिन्दी में रखती है।
- source_word: σημεῖα
  choice: चिन्हों
  rationale: ‘चिन्ह’ मत्ती में प्रमाणसूचक और प्रकाशनात्मक दोनों अर्थ-संभावनाएँ बनाए रखता है।
- source_word: καιρῶν
  choice: समयों
  rationale: बहुवचन और विशेष महत्त्व वाले अवसरों या कालखंडों का भाव सुरक्षित रखा गया है; इसे केवल मौसम या ऋतुओं तक सीमित नहीं किया गया।
- source_word: οὐ δύνασθε
  choice: नहीं परख सकते
  rationale: यह स्पष्ट असमर्थता व्यक्त करता है; पहली उपवाक्य की क्रिया दोहराने से विरोध उभरता है।
theological_decisions:
- issue: ‘समयों के चिन्हों’ का आशय
  choice: वाक्यांश को व्यापक और अनिर्णीत रखा गया है।
  alternative: इसे केवल अंत-समय के चिन्हों या केवल यीशु के मसीही कार्यों के रूप में स्पष्ट करना।
  rationale: यूनानी वाक्यांश वर्तमान घड़ी के आत्मिक महत्त्व, यीशु के कार्यों और संभावित युगान्त-संबंधी संकेतों को समेट सकता है; अनुवाद इनमें से किसी एक अर्थ को अनिवार्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मौसम-वर्णन में स्वाभाविक हिन्दी का प्रयोग है, जबकि ‘समयों के चिन्हों’ की जानबूझकर व्यापक धार्मिक अर्थ-संभावना सुरक्षित है।
