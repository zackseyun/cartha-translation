  to: और सुबह कहते हो, ‘आज तूफ़ानी मौसम रहेगा, क्योंकि आकाश लाल और घिरा हुआ है।’ तुम आकाश का रूप[a] पहचानना जानते हो, पर समयों के चिन्हों[b] को नहीं पहचान सकते।[c]
