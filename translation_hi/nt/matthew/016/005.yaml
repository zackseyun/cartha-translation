  text: And when the disciples came to the other side[a], they had forgotten to take bread.
translation:
  language: hi
  text: जब चेले उस पार पहुँचे, तो वे रोटियाँ साथ लेना भूल गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες
  choice: जब ... पहुँचे
  rationale: अओरिस्ट कृदन्त को मुख्य क्रिया के साथ स्वाभाविक कालवाचक संबंध में रखा गया है; ‘पहुँचे’ गंतव्य तक आने का भाव स्पष्ट करता है।
- source_word: οἱ μαθηταὶ
  choice: चेले
  rationale: सुसमाचारों में यीशु के μαθηταί के लिए यह प्रचलित, सहज और संदर्भानुकूल हिन्दी शब्द है।
- source_word: εἰς τὸ πέραν
  choice: उस पार
  rationale: झील के दूसरी ओर जाने के लिए स्वाभाविक हिन्दी अभिव्यक्ति; यह यूनानी पद का स्थानगत अर्थ बनाए रखती है।
- source_word: ἐπελάθοντο
  choice: भूल गए थे
  rationale: भूलने की घटना उनके पहुँचने पर बताई गई स्थिति से पहले घट चुकी थी; पूर्ण भूतकाल हिन्दी कथा-क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἄρτους
  choice: रोटियाँ
  rationale: यूनानी में शब्द बहुवचन है और गिनी जा सकने वाली रोटियों को दर्शाता है; हिन्दी में ‘रोटियाँ’ मूल संख्या और आगे के प्रसंग को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: λαβεῖν
  choice: साथ लेना
  rationale: λαβεῖν का मूल अर्थ ‘लेना’ है; ‘साथ’ जोड़ने से यात्रा में भोजन ले चलने का संदर्भ स्वाभाविक हिन्दी में स्पष्ट होता है।
