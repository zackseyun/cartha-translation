source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: hi
  text: पर यीशु यह जानकर कहा, “अल्पविश्वासियो, तुम आपस में यह क्यों विचार कर रहे हो कि तुम रोटियाँ नहीं लाए[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “तुमने रोटियाँ नहीं लीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: यह जानकर
  rationale: अओरिस्ट कृदंत यीशु के बोलने से पहले उसके जान लेने को दर्शाता है; निहित कर्म को प्रसंगानुसार ‘यह’ से व्यक्त किया गया है।
- source_word: δὲ
  choice: पर
  rationale: यह हल्का विरोध अथवा कथात्मक मोड़ दिखाता है, क्योंकि यीशु चेलों की चर्चा पर प्रतिक्रिया देता है।
- source_word: εἶπεν
  choice: बोला
  rationale: प्रत्यक्ष कथन की स्वाभाविक हिंदी भूमिका; प्रश्न होने पर भी यूनानी क्रिया का सामान्य कथात्मक अर्थ सुरक्षित रहता है।
- source_word: Τί
  choice: क्यों
  rationale: διαλογίζεσθε और ὅτι-वाक्यांश के साथ यहाँ प्रश्न चर्चा के कारण पर है, इसलिए ‘क्यों’ स्वाभाविक और अर्थानुकूल है।
- source_word: διαλογίζεσθε
  choice: विचार कर रहे हो
  rationale: यह आपसी तर्क-विचार या मनन को व्यक्त करता है; ‘विचार कर रहे हो’ आधुनिक हिंदी में स्वाभाविक है और अनावश्यक रूप से तीखी ‘बहस’ का भाव नहीं जोड़ता।
- source_word: ἐν ἑαυτοῖς
  choice: आपस में
  rationale: पदबंध भीतर-ही-भीतर अथवा परस्पर—दोनों अर्थ दे सकता है; निकट प्रसंग में चेलों की सामूहिक चर्चा के कारण ‘आपस में’ उपयुक्त है।
- source_word: ὀλιγόπιστοι
  choice: अल्पविश्वासियो
  rationale: संबोधन के रूप में यीशु की सीधी फटकार और मत्ती में प्रयुक्त विशिष्ट ‘कम विश्वास’ की धारणा को संक्षेप तथा गरिमा के साथ सुरक्षित रखता है।
- source_word: ὅτι
  choice: कि
  rationale: यह उनके विचार-विमर्श की विषयवस्तु प्रस्तुत करता है—कि वे रोटियाँ नहीं लाए।
- source_word: ἄρτους
  choice: रोटियाँ
  rationale: बहुवचन ἄρτους को हिंदी के सहज गणनीय शब्द ‘रोटियाँ’ से व्यक्त किया गया है; इससे मूल का बहुवचन भी बना रहता है।
- source_word: οὐκ ἐλάβετε
  choice: नहीं लाए
  rationale: λαμβάνω का मूल अर्थ लेना/ग्रहण करना है, पर यात्रा-संदर्भ में आशय साथ न लाने का है; मुख्य पाठ में प्रसंगगत अर्थ और पादटिप्पणी में अधिक शाब्दिक विकल्प रखा गया है।
theological_decisions:
- issue: ὀλιγόπιστοι में यीशु की फटकार का बल
  choice: ‘अल्पविश्वासियो’ द्वारा चेलों के अपर्याप्त विश्वास पर सीधी फटकार
  alternative: इसे केवल उनकी गलत समझ या असावधानी का वर्णन मानना
  rationale: यूनानी पद स्पष्ट रूप से विश्वास की कमी को लक्ष्य करता है। अनुवाद इस धर्मवैचारिक तनाव को बनाए रखता है, पर इससे आगे कोई व्यापक सिद्धान्त नहीं जोड़ता।
- issue: ἐν ἑαυτοῖς की संभावित अस्पष्टता
  choice: सामूहिक प्रसंग के अनुसार ‘आपस में’
  alternative: ‘अपने-अपने मन में’
  rationale: यूनानी दोनों अर्थों की अनुमति देता है, किंतु आसपास का वर्णन चेलों के परस्पर विचार-विमर्श की ओर संकेत करता है; विकल्प को टिप्पणी में अलग से बढ़ाना इस पद के लिए आवश्यक नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट और मौखिक रूप से सहज शैली। ‘अल्पविश्वासियो’ कुछ साहित्यिक है, पर मत्ती के विशिष्ट संबोधन और फटकार को सटीक रूप से सुरक्षित रखता है। मुख्य पाठ में ‘रोटियाँ नहीं लाए’ प्रसंगानुकूल है; अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
