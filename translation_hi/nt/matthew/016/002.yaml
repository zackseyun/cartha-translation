  text: पर उसने उन्हें उत्तर दिया, “जब साँझ होती है, तो तुम कहते हो, ‘मौसम साफ रहेगा, क्योंकि आकाश[a] लाल है।’”
  philosophy: optimal-equivalence
  footnotes:
