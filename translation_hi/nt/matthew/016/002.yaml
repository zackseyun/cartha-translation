    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: उत्तर दिया
  rationale: यूनानी में यह उत्तर आरम्भ करने का प्रचलित संयुक्त मुहावरा है। हिन्दी में केवल ‘उत्तर दिया’ स्वाभाविक है और अनावश्यक पुनरुक्ति से बचते हुए उसका संवादात्मक कार्य बनाए रखता है।
- source_word: Ὀψίας γενομένης
  choice: जब साँझ होती है
  rationale: यह कालसूचक संबंधविहीन षष्ठी रचना है। वर्तमानकालीन हिन्दी रूप इस प्रसंग में बार-बार कही जाने वाली मौसम-संबंधी उक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λέγετε
  choice: तुम कहते हो
  rationale: वर्तमान काल यहाँ आदतन या प्रचलित कथन को दिखाता है।
- source_word: Εὐδία
  choice: मौसम अच्छा रहेगा
  rationale: शब्द अनुकूल या साफ़ मौसम का बोध कराता है। भविष्यकाल ‘रहेगा’ लाल साँझ देखकर अगले समय के मौसम का अनुमान लगाने वाली उक्ति को स्पष्ट और स्वाभाविक बनाता है।
- source_word: πυρράζει
  choice: लाल है
  rationale: यह आकाश के लाल दिखाई देने का सीधा वर्णन है; ‘लाल है’ सरल और सटीक हिन्दी है।
- source_word: οὐρανός
  choice: आकाश
  rationale: शब्द का अर्थ ‘आकाश’ या ‘स्वर्ग’ हो सकता है, पर यहाँ मौसम के प्रत्यक्ष चिह्न के कारण दिखाई देने वाला आकाश अभिप्रेत है।
