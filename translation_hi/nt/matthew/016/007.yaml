  text: οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: hi
  text: और वे आपस में चर्चा कर रहे थे और कह रहे थे, “हम रोटियाँ साथ नहीं लाए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: और वे
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है; ‘और’ प्रसंग के प्रवाह को स्वाभाविक रूप से बनाए रखता है।
- source_word: διελογίζοντο
  choice: विचार-विमर्श करते हुए कहने लगे
  rationale: अपूर्णकाल चल रही पारस्परिक चर्चा या मनन को दर्शाता है। संयुक्त हिन्दी अभिव्यक्ति λέγοντες के साथ वाक्य को स्वाभाविक रखती है।
- source_word: ἐν ἑαυτοῖς
  choice: आपस में
  rationale: यह शिष्यों के अपने समूह के भीतर हुई चर्चा को व्यक्त करता है; ‘आपस में’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: λέγοντες
  choice: कहने लगे
  rationale: कृदंत चर्चा की विषय-वस्तु प्रस्तुत करता है; कथात्मक हिन्दी में ‘कहने लगे’ चल रही चर्चा के भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Ἄρτους
  choice: रोटियाँ
  rationale: बहुवचन ἄρτους यहाँ यात्रा के लिए रखी जाने वाली रोटियों को सूचित करता है। ‘रोटियाँ’ बहुवचन को बनाए रखता है और सामान्य पाठक के लिए स्पष्ट है।
- source_word: οὐκ ἐλάβομεν
  choice: साथ नहीं लाए
  rationale: λαμβάνω का मूल अर्थ ‘लेना’ है, पर यात्रा-सामग्री के संदर्भ में आशय अपने साथ लाने/ले जाने का है। हिन्दी में वक्ताओं के वर्तमान दृष्टिकोण से ‘साथ नहीं लाए’ सहज है।
theological_decisions:
- issue: ὅτι द्वारा कथन की विषय-वस्तु अथवा कारण का परिचय
  choice: 'सीधा कथन: “हम रोटियाँ साथ नहीं लाए।”'
  alternative: “यह इसलिए है कि हम रोटियाँ साथ नहीं लाए।”
  rationale: यूनानी में ὅτι कथन की विषय-वस्तु प्रस्तुत कर सकता है और कोई स्पष्ट ‘यह इसलिए है’ नहीं है। सीधा कथन मूल की संक्षिप्तता और प्रसंगगत अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘विचार-विमर्श’ चर्चा और मनन दोनों का भाव देता है, जबकि ‘आपस में’ समूह के भीतर होने को स्पष्ट करता है।
