  rationale: The revision replaces the inceptive «कहने लगे» with ongoing «कह रहे थे» and renders διελογίζοντο as «चर्चा कर रहे थे». It preserves the internal/group sense of ἐν ἑαυτοῖς, the direct-content reading of ὅτι, and the plural «रोटियाँ» without adding an implied causal clause.
