base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: hi
  text: शमौन पतरस ने उत्तर दिया, “आप ही मसीह[a] हैं, जीवित परमेश्वर के पुत्र।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीस्त।” यूनानी उपाधि Χριστός का अनुवाद “ख्रीस्त” भी किया जा सकता है; यहाँ उसके उपाधिसूचक अर्थ और यहूदी मसीहाई संदर्भ को स्पष्ट रखने के लिए “मसीह” दिया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: ने उत्तर दिया
  rationale: यूनानी में शाब्दिक रूप से ‘उत्तर देते हुए कहा’ है, पर कथा में दोनों मिलकर उत्तर देने का स्वाभाविक भाव व्यक्त करते हैं; हिन्दी में अनावश्यक दोहराव से बचाया गया है।
- source_word: δὲ
  choice: —
  rationale: यह हल्के कथात्मक संक्रमण को सूचित करता है; यहाँ हिन्दी में अलग संयोजक जोड़ना स्वाभाविक नहीं है।
- source_word: Σίμων Πέτρος
  choice: शमौन पतरस
  rationale: व्यक्तिगत नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं।
- source_word: Σὺ εἶ
  choice: आप ही … हैं
  rationale: स्पष्ट यूनानी सर्वनाम Σὺ पर बल है। सम्मानपूर्ण आधुनिक हिन्दी में ‘आप’ और बलसूचक ‘ही’ उस प्रमुखता को स्वाभाविक ढंग से व्यक्त करते हैं।
- source_word: ὁ χριστὸς
  choice: मसीह
  rationale: यहाँ Χριστός व्यक्तिगत नाम नहीं, अभिषिक्त राजा की उपाधि है। ‘मसीह’ यहूदी मसीहाई संदर्भ और उपाधि का भाव बनाए रखता है।
- source_word: ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος
  choice: जीवित परमेश्वर के पुत्र
  rationale: निश्चित और उपाधिसूचक पुत्र-संबंध को बनाए रखते हुए attributive participle ζῶντος का स्वाभाविक हिन्दी रूप ‘जीवित परमेश्वर’ दिया गया है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: पतरस की स्वीकारोक्ति में Χριστός स्पष्टतः मसीहाई उपाधि है। मुख्य पाठ अर्थसूचक रूप रखता है और प्रचलित वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- issue: ‘परमेश्वर के पुत्र’ का आशय
  choice: जीवित परमेश्वर के पुत्र
  alternative: कोई व्याख्यात्मक विस्तार नहीं
  rationale: यूनानी स्वीकारोक्ति को उसके अपने उपाधिसूचक और संबंधपरक रूप में रखा गया है; बाद की धर्मवैज्ञानिक शब्दावली जोड़कर इसके आशय को सीमित या विस्तृत नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। यीशु के लिए ‘आप’ सामान्य आधुनिक हिन्दी में गरिमापूर्ण है। वाक्य के अंतिम अंश को समानाधिकरण के रूप में रखा गया है, जिससे ‘मसीह’ और ‘जीवित परमेश्वर के पुत्र’ दोनों स्वीकारोक्तियाँ स्पष्ट रहें।
