id: MAT.16.24
reference: Matthew 16:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: hi
  text: तब यीशु ने अपने शिष्यों से कहा, “यदि कोई मेरे पीछे आना चाहता है, तो वह अपने आप का इन्कार करे, अपना क्रूस उठा ले और मेरा अनुसरण करता रहे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह अगले कथन को पिछले प्रसंग से जोड़ने वाला कालसूचक शब्द है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: अपने शिष्यों से
  rationale: ‘शिष्य’ μαθητής के शिक्षक-अनुयायी संबंध को सटीक रूप से व्यक्त करता है; ‘अपने’ यीशु से संबंध स्पष्ट करता है।
- source_word: Εἴ τις θέλει ὀπίσω μου ἐλθεῖν
  choice: यदि कोई मेरे पीछे आना चाहता है
  rationale: यह अनिश्चित और सर्वसमावेशी शर्त तथा स्वेच्छा दोनों को बनाए रखता है। ‘मेरे पीछे आना’ मूल स्थानात्मक रूपक को बचाता है और अंतिम ἀκολουθείτω का पहले ही अर्थानुवाद नहीं करता।
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: वह अपने आप को नकारे
  rationale: ἀπαρνέομαι के निर्णायक आत्म-अस्वीकार के भाव को सीधे व्यक्त करता है; ‘अपने स्वार्थ का त्याग करे’ जैसे अधिक व्याख्यात्मक अर्थ को पाठ में नहीं जोड़ा गया।
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: अपना क्रूस उठा ले
  rationale: अओरिस्ट आज्ञार्थक की निर्णायक क्रिया और प्रत्येक व्यक्ति के अपने क्रूस का भाव सुरक्षित है। ‘उठा ले’ में उठाकर वहन करने का प्रसंगगत संकेत भी है।
- source_word: ἀκολουθείτω μοι
  choice: मेरे पीछे चलता रहे
  rationale: वर्तमान आज्ञार्थक के निरंतर अनुसरण के पहलू को ‘चलता रहे’ स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आत्म-निषेध का आशय
  choice: ‘अपने आप को नकारे’ के रूप में खुला और सीधा अनुवाद
  alternative: ‘अपने स्वार्थ का त्याग करे’ या ‘अपनी इच्छाएँ छोड़ दे’
  rationale: मूल पाठ व्यापक और चुनौतीपूर्ण आत्म-निषेध की भाषा रखता है। किसी एक नैतिक या मनोवैज्ञानिक व्याख्या तक इसे सीमित नहीं किया गया।
- issue: प्रतिनिधिक एकवचन और सार्वभौमिक दायरा
  choice: ‘यदि कोई… तो वह…’
  alternative: स्पष्ट पुल्लिंग रूप का प्रयोग
  rationale: τις और एकवचन आज्ञार्थकों का व्यक्तिगत तथा सार्वभौमिक दायरा हिन्दी के लिंग-निरपेक्ष सर्वनाम ‘वह’ से स्वाभाविक रूप में बना रहता है; इससे स्रोत के आशय में कोई लिंगगत सीमा नहीं जोड़ी जाती।
- issue: क्रूस उठाने की रूपकात्मक और ऐतिहासिक तीव्रता
  choice: ‘अपना क्रूस उठा ले’
  alternative: ‘अपना दुःख सह ले’
  rationale: ‘दुःख’ कहना क्रूस की मृत्यु-दंड संबंधी कठोर छवि को सामान्य कष्ट तक सीमित कर देता। मूल रूपक को ज्यों का त्यों रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘क्रूस’ स्थापित बाइबलीय शब्द है, जबकि पादटिप्पणी में अधिक सामान्य पर्याय ‘सलीब’ दिया गया है। ‘मेरे पीछे आना’ और ‘मेरे पीछे चलता रहे’ की पुनरावृत्ति जानबूझकर रखी गई है, क्योंकि यूनानी में भी निकटार्थी पर अलग अभिव्यक्तियाँ हैं और अंतिम वर्तमान आज्ञार्थक निरंतर शिष्यत्व पर बल देता है।
