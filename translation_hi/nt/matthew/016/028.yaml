  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: hi
  text: मैं तुमसे सच कहता हूँ, यहाँ खड़े लोगों में से कुछ ऐसे हैं जो मृत्यु का स्वाद निश्चय ही नहीं चखेंगे[a], जब तक कि वे मनुष्य के पुत्र को उसके राज्य में आते न देखें[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘किसी भी दशा में मृत्यु का स्वाद नहीं चखेंगे’; यूनानी में निषेध अत्यंत प्रबल है।
    reason: lexical_alternative
  - marker: b
    text: ‘मनुष्य के पुत्र को उसके राज्य में आते’ से रूपान्तरण, पुनरुत्थान और महिमारोहण, पिन्तेकुस्त, यरूशलेम पर न्याय, या अंतिम आगमन का संकेत समझा जा सकता है; पाठ स्वयं किसी एक घटना को स्पष्ट नहीं करता।
    reason: alternative_reading
  - marker: c
    text: ‘उसके राज्य में’ का अनुवाद ‘उसके शासन में’ या ‘उसके राजकीय अधिकार के साथ’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: सच
  rationale: यहाँ ἀμήν किसी कथन के आरम्भ में उसकी गंभीर सत्यता और अधिकार को पुष्ट करता है। ‘सच कहता हूँ’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: प्रत्यक्ष संबोधन और वर्तमानकालीन कथन-सूत्र को सहज हिन्दी में बनाए रखता है।
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: यहाँ खड़े लोगों में से कुछ ऐसे हैं
  rationale: मूल के अंशवाचक भाव—उपस्थित लोगों में से कुछ—को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: मृत्यु का स्वाद निश्चय ही नहीं चखेंगे
  rationale: ‘मृत्यु का स्वाद चखना’ मूल रूपक को सुरक्षित रखता है, और ‘निश्चय ही नहीं’ οὐ μή के प्रबल निषेध को व्यक्त करता है।
- source_word: ἕως ἂν ἴδωσιν
  choice: जब तक वे ... न देख लें
  rationale: भविष्य की सीमा बताने वाली यूनानी रचना का स्वाभाविक हिन्दी समतुल्य है; ‘देख लें’ घटना को देखने की पूर्णता का सहज संकेत देता है।
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की इस विशिष्ट आत्म-पदवी का सीधा अनुवाद है और उसके बाइबिलीय तथा प्रलयदर्शी संबंधों को बनाए रखता है।
- source_word: ἐρχόμενον
  choice: आते
  rationale: कृदन्त का सीधा अर्थ सुरक्षित है; मूल में अनुपस्थित ‘सामर्थ्य के साथ’ जैसे शब्द नहीं जोड़े गए।
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: उसके राज्य में
  rationale: βασιλεία के राज्य, शासन या राजकीय अधिकार संबंधी अर्थ-क्षेत्र को ठोस और परिचित हिन्दी में सुरक्षित रखता है, बिना किसी एक व्याख्या को निर्णायक बनाए।
theological_decisions:
- issue: ‘मनुष्य के पुत्र को उसके राज्य में आते’ का संकेत किस घटना की ओर है
  choice: वाक्यांश को बिना किसी घटना की पहचान निश्चित किए सीधे अनूदित किया गया है।
  alternative: इसे रूपान्तरण, पुनरुत्थान और महिमारोहण, पिन्तेकुस्त, यरूशलेम पर न्याय, अथवा अंतिम आगमन के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ स्वयं अपेक्षित घटना की ठीक पहचान नहीं करता। अनुवाद में किसी विवादित व्याख्या को जोड़ने के बजाय मूल की अस्पष्टता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
- issue: βασιλεία का अर्थ-बल
  choice: राज्य
  alternative: शासन; राजकीय अधिकार
  rationale: ‘राज्य’ मूल बिंब और प्रमुख पारिभाषिक निरंतरता को बनाए रखता है, जबकि पादटिप्पणी अन्य वैध अर्थ-संभावनाएँ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में ‘तुम’ मूल के बहुवचन ὑμῖν के अनुरूप सामूहिक है। शैली सहज, गंभीर और बाइबिलीय है। मूल रूपक ‘मृत्यु का स्वाद चखना’ तथा पदवी ‘मनुष्य का पुत्र’ सुरक्षित रखी गई हैं।
