source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: hi
  text: क्योंकि यदि कोई मनुष्य सारे संसार को पा ले, पर अपना जीवन गँवा दे, तो उसे क्या लाभ होगा? या मनुष्य अपने जीवन के बदले क्या देगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर यूनानी शब्द ψυχή का अनुवाद “आत्मा” भी हो सकता है। प्रसंग के अनुसार इस शब्द का अर्थ “जीवन,” “स्वयं” या “आत्मा” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: क्योंकि ... क्या
  rationale: γάρ का पिछले कथन से व्याख्यात्मक संबंध ‘क्योंकि’ से और τί का आलंकारिक प्रश्न ‘क्या’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: ὠφεληθήσεται
  choice: उसे क्या लाभ होगा
  rationale: यूनानी का आशय लाभ प्राप्त होने से है; यह हिंदी में स्वाभाविक है और निष्क्रिय अर्थ को बनाए रखता है।
- source_word: ἄνθρωπος
  choice: कोई मनुष्य / मनुष्य
  rationale: यहाँ संज्ञा एक प्रतिनिधि व्यक्ति के लिए सामान्य अर्थ में प्रयुक्त है; ‘मनुष्य’ मूल की संज्ञात्मक और सार्वभौमिक शक्ति बनाए रखता है।
- source_word: τὸν κόσμον ὅλον
  choice: सारे संसार
  rationale: यह संसार की संपूर्णता को व्यक्त करता है और हिंदी में सहज है।
- source_word: κερδήσῃ
  choice: पा ले
  rationale: संसार को लाभ के रूप में हासिल करने का अर्थ स्वाभाविक हिंदी में व्यक्त होता है; ‘लाभ’ के साथ अनावश्यक शब्द-पुनरावृत्ति भी नहीं होती।
- source_word: ψυχή
  choice: जीवन
  rationale: इस प्रसंग में ψυχή व्यक्ति के जीवन अथवा स्वयं उसके अस्तित्व को व्यापक अर्थ में सूचित कर सकता है। ‘जीवन’ मुख्य पाठ में स्पष्ट है, जबकि ‘प्राण’ और ‘आत्मा’ की संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: ζημιωθῇ
  choice: गँवा दे
  rationale: यह अत्यंत मूल्यवान वस्तु की हानि को स्पष्ट और वर्तमान हिंदी में व्यक्त करता है तथा पाने और खोने का विरोध बनाए रखता है।
- source_word: ἀντάλλαγμα
  choice: के बदले
  rationale: लेन-देन अथवा विनिमय का रूपक बिना फिरौती जैसी अधिक विशिष्ट धारणा जोड़े स्वाभाविक ढंग से व्यक्त होता है।
theological_decisions:
- issue: अंतिम हानि के संदर्भ में ψυχή का अनुवाद
  choice: जीवन
  alternative: प्राण; आत्मा; स्वयं
  rationale: यहाँ ψυχή को केवल शरीर से पृथक अमूर्त आत्मा के तकनीकी अर्थ तक सीमित करना आवश्यक नहीं है। ‘जीवन’ व्यक्ति के समूचे अस्तित्व और उसके सर्वोच्च मूल्य को व्यक्त करता है; अन्य प्रामाणिक अर्थ पादटिप्पणी में दिए गए हैं ताकि मूल की अर्थगत व्यापकता और धर्मवैज्ञानिक तनाव बना रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सारे संसार को पा ले’ और ‘जीवन गँवा दे’ के बीच मूल का तीखा लाभ-हानि विरोध सुरक्षित है।
