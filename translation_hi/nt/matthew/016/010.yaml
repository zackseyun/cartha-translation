  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: hi
  text: न ही तुम्हें उन सात रोटियों की याद है, जो चार हज़ार लोगों के लिए थीं, और यह कि तुमने कितने बड़े टोकरे उठाए थे?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “न ही चार हज़ार लोगों के लिए वे सात रोटियाँ, और कितने बड़े टोकरे तुमने उठाए थे?”
    reason: मूल यूनानी में पिछले प्रश्न से निहित ‘याद है/याद करते हो’ क्रिया को दोहराया नहीं गया है; यह पादटिप्पणी उस संक्षिप्त, दीर्घवृत्तीय वाक्य-विन्यास को अधिक निकटता से दर्शाती है।
lexical_decisions:
- source_word: οὐδὲ
  choice: और ... भी ... नहीं
  rationale: यह पद पिछले आलंकारिक प्रश्नों की निरंतरता है। हिन्दी में नकारात्मक प्रश्न-श्रृंखला को स्वाभाविक रूप से आगे बढ़ाने के लिए यह रूप चुना गया है।
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: उन सात रोटियों
  rationale: भोजन-वितरण के प्रसंग में ἄρτους ठोस रोटियों को सूचित करता है; 'रोटियाँ' सामान्य और सहज हिन्दी है।
- source_word: τῶν τετρακισχιλίων
  choice: जो चार हज़ार लोगों के लिए थीं
  rationale: सम्बन्धकारक पद भोजन पाने वाले चार हज़ार लोगों से रोटियों का सम्बन्ध बताता है। हिन्दी में 'के लिए' इस प्रसंगगत सम्बन्ध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: πόσας
  choice: कितने
  rationale: यह प्रश्नवाचक विशेषण σπυρίδας की संख्या पूछता है।
- source_word: σπυρίδας
  choice: बड़े टोकरे
  rationale: σπυρίς उस बड़े प्रकार के टोकरे को दर्शाता है जो κόφινος से भिन्न है; 'बड़े टोकरे' इस कथात्मक शब्द-भेद को बनाए रखता है।
- source_word: ἐλάβετε
  choice: भरकर उठाए थे
  rationale: यहाँ क्रिया भोजन के बचे टुकड़ों से टोकरों को भरकर उठाने/इकट्ठा करने के अर्थ में है। 'भरकर उठाए' प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण प्रश्नात्मक रूप अपनाया गया है। पिछले पद से जुड़े दीर्घवृत्त को मुख्य पाठ में 'याद नहीं करते' से पूरा किया गया है; पादटिप्पणी अधिक शाब्दिक संरचना सुरक्षित रखती है।
