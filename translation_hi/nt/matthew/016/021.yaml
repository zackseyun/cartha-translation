source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: hi
  text: उस समय से यीशु अपने चेलों को यह बताने लगे कि उन्हें यरूशलेम जाना, बुज़ुर्गों, प्रधान याजकों और शास्त्रियों से बहुत-से दुःख सहना[a][b], मार डाला जाना और तीसरे दिन जिलाया जाना[c] आवश्यक है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘बहुत-सी बातें सहना’; अर्थात अनेक प्रकार के दुःख सहना।
    reason: lexical_alternative
  - marker: b
    text: ‘बुज़ुर्गों, प्रधान याजकों और शास्त्रियों से’ का अनुवाद ‘बुज़ुर्गों, प्रधान याजकों और शास्त्रियों के हाथों’ भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: 'इसका अनुवाद ‘जी उठना’ भी हो सकता है; यूनानी में क्रिया निष्क्रिय है: ‘जिलाया जाना।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: उस समय से
  rationale: यह कथा में एक नए चरण का संकेत देता है और यूनानी पदबंध की समय-संबंधी शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἤρξατο
  choice: लगे
  rationale: ‘बताने लगे’ नई और निरंतर शिक्षा के आरम्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δεικνύειν
  choice: बताने
  rationale: इस प्रसंग में इसका अर्थ चेलों पर बात प्रकट या स्पष्ट करना है; ‘बताने’ सामान्य पाठक के लिए सहज है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: δεῖ
  choice: आवश्यक है
  rationale: यह आवश्यकता की प्रबलता को बनाए रखता है, पर उसके स्रोत को मुख्य पाठ में निर्धारित नहीं करता।
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: यरूशलेम जाना
  rationale: गंतव्य की ओर जाने का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: πολλὰ παθεῖν
  choice: बहुत-से दुःख सहना
  rationale: πολλά की बहुवचन अभिव्यक्ति को बनाए रखते हुए हिन्दी में अनेक प्रकार के कष्टों का भाव स्पष्ट करता है।
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: पुरनियों, प्रधान याजकों और शास्त्रियों के कारण
  rationale: ἀπό के स्रोत/कारण अथवा कर्तृ-संबंध को व्यक्त करता है, बिना ‘के हाथों’ को मुख्य पाठ में अनिवार्य किए।
- source_word: πρεσβυτέρων
  choice: पुरनियों
  rationale: यह यहूदी नेतृत्व-वर्ग के लिए हिन्दी बाइबलीय प्रयोग में स्थापित और अपेक्षाकृत सीधा समतुल्य है।
- source_word: ἀρχιερέων
  choice: प्रधान याजकों
  rationale: बहुवचन में यह याजकीय शासक-वर्ग को दर्शाता है, न कि एक ही समय में अनेक महायाजकों को।
- source_word: γραμματέων
  choice: शास्त्रियों
  rationale: यूनानी पद का सीधा और हिन्दी पाठकों के लिए स्थापित समतुल्य।
- source_word: ἀποκτανθῆναι
  choice: मार डाला जाना
  rationale: निष्क्रिय क्रिया का स्पष्ट, सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἐγερθῆναι
  choice: जिलाया जाना
  rationale: निष्क्रिय वाच्य को सुरक्षित रखता है और कर्ता को वहाँ स्पष्ट नहीं करता जहाँ इस वाक्य में यूनानी पाठ उसे व्यक्त नहीं करता।
theological_decisions:
- issue: यीशु के दुःखभोग के विषय में δεῖ की आवश्यकता
  choice: ‘आवश्यक है’ कहा गया है, पर आवश्यकता का स्रोत मुख्य पाठ में स्पष्ट नहीं किया गया।
  alternative: ‘उन्हें अवश्य जाना होगा’ या ‘उनके लिए जाना अनिवार्य है।’
  rationale: यूनानी पाठ आवश्यकता बताता है, पर इस उपवाक्य में उसे स्पष्ट रूप से परमेश्वर की आज्ञा, योजना, पवित्रशास्त्र की पूर्ति या ऐतिहासिक अनिवार्यता नहीं कहता।
- issue: ἐγερθῆναι का वाच्य
  choice: निष्क्रिय ‘जिलाया जाना।’
  alternative: सक्रिय/अकर्मक ‘जी उठना।’
  rationale: यूनानी क्रिया निष्क्रिय है। निष्क्रिय रूप मूल शब्दावली और निहित कर्ता से जुड़ी धर्मवैचारिक गुंजाइश को सुरक्षित रखता है।
- issue: ἀπό के साथ नेतृत्व-वर्ग की भूमिका
  choice: मुख्य पाठ में ‘के कारण।’
  alternative: ‘के हाथों।’
  rationale: ἀπό दुःखों के स्रोत अथवा कारक को दर्शाता है। ‘के हाथों’ प्रसंगानुकूल है, पर अधिक स्पष्ट कर्तृ-संबंध जोड़ता है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘चेला’, ‘प्रधान याजक’ और ‘शास्त्री’ जैसे स्थापित बाइबलीय शब्द प्रसंग की ऐतिहासिक विशिष्टता बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
