source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: hi
  text: उन्होंने कहा, “कुछ लोग कहते हैं कि आप यूहन्ना बपतिस्मा देनेवाले हैं, दूसरे एलिय्याह, और दूसरे यिर्मयाह या भविष्यद्वक्ताओं में से कोई एक हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: उन्होंने कहा
  rationale: δέ यहाँ साधारण कथात्मक संबंध रखता है; हिन्दी में अलग से ‘और’ जोड़ना आवश्यक नहीं। εἶπαν का स्वाभाविक अनुवाद ‘कहा’ है।
- source_word: Οἱ μὲν
  choice: कुछ लोग कहते हैं
  rationale: μέν आगे आने वाले ἄλλοι और ἕτεροι के साथ अलग-अलग समूहों की राय प्रस्तुत करता है। वर्तमानकालीन ‘कहते हैं’ पहले पद के प्रश्न के संदर्भ में निहित है।
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: यूहन्ना बपतिस्मा देनेवाला
  rationale: यह βαπτιστής के कार्यगत अर्थ को स्पष्ट और प्रचलित आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἄλλοι δὲ
  choice: कुछ
  rationale: यह दूसरे समूह की पहचान बताता है; समानांतर सूची में ‘कुछ’ स्वाभाविक हिन्दी है और δέ को अनावश्यक विरोध में नहीं बदलता।
- source_word: Ἠλίαν
  choice: एलिय्याह
  rationale: यह भविष्यद्वक्ता के नाम का हिन्दी बाइबलीय रूप है।
- source_word: ἕτεροι δὲ
  choice: और कुछ
  rationale: यह सूची के तीसरे समूह को सहज रूप से जोड़ता है और ἕτεροι की पृथकता बनाए रखता है।
- source_word: Ἰερεμίαν
  choice: यिर्मयाह
  rationale: यह भविष्यद्वक्ता के नाम का मानक हिन्दी रूप है।
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: या भविष्यद्वक्ताओं में से कोई एक
  rationale: ἤ विकल्प प्रकट करता है और ἕνα τῶν προφητῶν का संख्यात्मक तथा समूह-संबंधी अर्थ स्पष्ट रखता है; मूल में ‘अन्य’ नहीं है।
theological_decisions:
- issue: पहचानों का निहित कर्म
  choice: मुख्य पाठ में ‘कि आप हैं’ को न जोड़कर यूनानी की संक्षिप्त, अपूर्णोक्त सूची को रखा गया है।
  alternative: कुछ लोग कहते हैं कि आप यूहन्ना बपतिस्मा देनेवाले हैं; कुछ एलिय्याह...
  rationale: पहले पद में यीशु का प्रश्न इन पहचानों का कर्म स्पष्ट करता है। उसे मुख्य पाठ में दोहराना अर्थ की दृष्टि से उचित हो सकता है, पर इस पद के यूनानी शब्दों में वह स्पष्ट रूप से उपस्थित नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। उद्धरणों के भीतर संक्षिप्त नामसूची यूनानी की अपूर्णोक्ति को सुरक्षित रखती है। ‘बपतिस्मा देनेवाला’ कार्य को स्पष्ट करता है; नामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
