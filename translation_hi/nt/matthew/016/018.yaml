id: MAT.16.18
reference: Matthew 16:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: hi
  text: और मैं भी तुमसे कहता हूँ कि तुम पतरस[a] हो, और इस चट्टान पर मैं अपनी कलीसिया बनाऊँगा; और अधोलोक[b] के फाटक उस पर विजय नहीं पाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘पतरस’ (Petros) और ‘चट्टान’ (petra) के बीच शब्द-क्रीड़ा है। ‘इस चट्टान’ को पतरस, पतरस की स्वीकारोक्ति, या स्वीकारकर्ता और प्रतिनिधि प्रेरित के रूप में पतरस का संदर्भ माना जा सकता है।
    reason: alternative_reading
  - marker: b
    text: 'यूनानी: ‘हेडीज़’; अर्थात मृतकों का लोक। परंपरागत अनुवाद: ‘नरक’।'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ
  choice: और मैं भी
  rationale: κἀγώ के बलाघात (‘मैं भी’) और δέ के क्रम-विकास अथवा हल्के प्रतिवाद—दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: σοι λέγω
  choice: तुमसे कहता हूँ
  rationale: प्रत्यक्ष संबोधन और λέγω के सामान्य अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Πέτρος
  choice: पतरस
  rationale: यह हिन्दी बाइबलीय परंपरा में प्रचलित नाम है; साथ की पादटिप्पणी यूनानी शब्द-क्रीड़ा स्पष्ट करती है, जो हिन्दी में पूरी तरह सुरक्षित नहीं रह सकती।
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: इस चट्टान पर
  rationale: ἐπί के स्थान-संबंध और ταύτῃ के संकेतवाचक बल को सीधे रखता है तथा संदर्भ की व्याख्यात्मक अस्पष्टता नहीं मिटाता।
- source_word: οἰκοδομήσω
  choice: बनाऊँगा
  rationale: निर्माण के रूपक को सहज हिन्दी में बनाए रखता है; ‘स्थापित करूँगा’ मूल के भवन-रूपक को कमजोर कर देता।
- source_word: μου τὴν ἐκκλησίαν
  choice: अपनी कलीसिया
  rationale: ἐκκλησία के लिए हिन्दी मसीही प्रयोग में व्यापक और पहचाना हुआ शब्द है तथा μου का स्वामित्व ‘अपनी’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: πύλαι ᾅδου
  choice: अधोलोक के फाटक
  rationale: ᾅδης को अंतिम दंड के स्थान ‘नरक’ के साथ मिलाए बिना मृतकों के लोक के अर्थ में प्रस्तुत करता है और फाटकों की मूल छवि सुरक्षित रखता है।
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: उस पर विजय नहीं पाएँगे
  rationale: κατισχύω के प्रबल होने या परास्त करने के विरोधात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘उस’ का संदर्भ कलीसिया है।
theological_decisions:
- issue: ‘इस चट्टान’ (ταύτῃ τῇ πέτρᾳ) का संदर्भ
  choice: मुख्य पाठ में केवल ‘इस चट्टान’ रखा गया है और संदर्भ को निर्णीत नहीं किया गया।
  alternative: इसे केवल पतरस, केवल पतरस की स्वीकारोक्ति, अथवा स्वीकारकर्ता और प्रतिनिधि प्रेरित के रूप में पतरस से स्पष्टतः जोड़ना।
  rationale: यूनानी पाठ Πέτρος और πέτρα के बीच शब्द-क्रीड़ा रखता है, पर व्याख्यात्मक संबंध को उस सीमा तक परिभाषित नहीं करता जिस पर विभिन्न परंपराएँ सहमत हों। अनुवाद को इस धर्मवैचारिक तनाव का निर्णय नहीं करना चाहिए।
- issue: ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: नरक; मृतकों का लोक
  rationale: ‘अधोलोक’ यहाँ मृतकों के लोक का संकेत देता है और ‘नरक’ से जुड़ी अंतिम दंड की बाद की या व्यापक धारणाओं को मूल शब्द पर आरोपित करने से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘पतरस’ और ‘कलीसिया’ जैसे स्थापित हिन्दी बाइबलीय शब्द बनाए गए हैं। अर्धविराम से निर्माण-वचन और अधोलोक के फाटकों के विरोधी कथन के बीच मूल वाक्य का संबंध स्पष्ट रहता है।
