  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: hi
  text: यीशु ने उसे उत्तर दिया, “शमौन बार-योना[a], तुम धन्य हो, क्योंकि मांस और लहू[b] ने यह बात तुम्हें प्रकट नहीं की, बल्कि मेरे पिता ने, जो स्वर्गों में हैं[c], प्रकट किया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, ‘योना का पुत्र शमौन।’ यूनानी पाठ ने यहाँ अरामी पितृनामिक रूप को सुरक्षित रखा है।
    reason: lexical_alternative
  - marker: b
    text: ‘मांस और लहू’ मनुष्यों या केवल मानवीय स्रोत के लिए प्रयुक्त एक मुहावरा है।
    reason: cultural_note
  - marker: c
    text: 'मूल यूनानी में बहुवचन है: ‘स्वर्गों में।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: यीशु ने उसे उत्तर दिया
  rationale: कृदंत और मुख्य क्रिया का यह संयोजन ‘उत्तर देकर कहा’ का भाव देता है। आधुनिक हिन्दी में ‘उत्तर दिया’ उसी अर्थ को स्वाभाविक और संक्षिप्त रूप में व्यक्त करता है; δέ को अलग संयोजक से व्यक्त करना यहाँ आवश्यक नहीं है।
- source_word: Μακάριος
  choice: धन्य
  rationale: ‘धन्य’ केवल मनोवैज्ञानिक प्रसन्नता नहीं, बल्कि परमेश्वर से प्राप्त अनुग्रह और सौभाग्य का गहरा भाव बनाए रखता है।
- source_word: Σίμων Βαριωνᾶ
  choice: शमौन बार-योना
  rationale: यूनानी पाठ में सुरक्षित अरामी पितृनामिक रूप को लिप्यंतरित किया गया है; इसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι यीशु की धन्यता-घोषणा का कारण प्रस्तुत करता है।
- source_word: σὰρξ καὶ αἷμα
  choice: मांस और लहू
  rationale: मूल मुहावरे को बनाए रखा गया है। यह मनुष्य अथवा केवल मानवीय स्रोत की ओर संकेत करता है, पर अनुवाद इसे किसी एक संकुचित व्याख्या तक सीमित नहीं करता।
- source_word: ἀπεκάλυψέν σοι
  choice: यह बात तुम पर प्रकट नहीं की
  rationale: ἀποκαλύπτω के प्रकाशन-संबंधी अर्थ को ‘प्रकट’ से सुरक्षित रखा गया है। ‘यह बात’ पिछले संदर्भ में शमौन की स्वीकारोक्ति को स्वाभाविक रूप से इंगित करता है।
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: बल्कि मेरे पिता ने
  rationale: ἀλλά मानवीय स्रोत और पिता से हुए प्रकाशन के बीच प्रबल विरोध दिखाता है; हिन्दी में ‘बल्कि’ इसे स्पष्ट करता है।
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: जो स्वर्गों में हैं
  rationale: यूनानी बहुवचन τοῖς οὐρανοῖς को सुरक्षित रखते हुए सम्बन्धवाचक रचना भी मूल के निकट रखी गई है।
theological_decisions:
- issue: शमौन की स्वीकारोक्ति का स्रोत
  choice: ‘मांस और लहू’ को व्यापक मानवीय स्रोत के विपरीत पिता के प्रकाशन के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल शमौन की निजी बुद्धि या केवल किसी मानवीय शिक्षक के लिए सीमित समझना।
  rationale: मूल मुहावरा मानवीय उत्पत्ति को व्यापक रूप से नकारता है, लेकिन यह तय नहीं करता कि विशेष रूप से कौन-सा मानवीय माध्यम अभिप्रेत है। अनुवाद इस खुलेपन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘धन्य’, ‘प्रकट’ और ‘मेरे पिता’ बाइबलीय धार्मिक भार बनाए रखते हैं, जबकि वाक्य-संरचना अनावश्यक रूप से पुरातन नहीं है।
