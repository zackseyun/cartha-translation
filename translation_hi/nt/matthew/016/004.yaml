source:
  edition: SBLGNT
  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: hi
  text: एक बुरी और व्यभिचारिणी[a] पीढ़ी चिन्ह खोजती है, और योना के चिन्ह[b] के सिवा उसे कोई चिन्ह नहीं दिया जाएगा। और वह उन्हें छोड़कर चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बेवफा पीढ़ी।’ यूनानी में शाब्दिक अर्थ ‘व्यभिचारिणी’ है; यह संभवतः परमेश्वर के प्रति बेवफाई के लिए भविष्यद्वक्ताओं द्वारा प्रयुक्त भाषा की प्रतिध्वनि है।
    reason: lexical_alternative
  - marker: b
    text: ‘योना का चिन्ह’ मत्ती 12:39–40 में योना के तीन दिन और तीन रात के अनुभव से समझाया गया है, जिसे मनुष्य के पुत्र के संबंध में एक प्रतिरूप के रूप में लागू किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: पीढ़ी
  rationale: यहाँ γενεά यीशु के समय के अविश्वासी जनसमूह को सूचित करता है; ‘पीढ़ी’ मत्ती में इसके स्थापित अर्थ को स्वाभाविक रूप से बनाए रखता है।
- source_word: πονηρὰ
  choice: बुरी
  rationale: ‘बुरी’ नैतिक दोष का सीधा, आधुनिक और सहज हिन्दी रूप है; ‘दुष्ट’ भी संभव है, पर कुछ अधिक शैलीगत और कठोर है।
- source_word: μοιχαλὶς
  choice: व्यभिचारिणी
  rationale: यूनानी स्त्रीलिंग विशेषण व्यभिचार का तीखा रूपक बनाए रखता है और भविष्यद्वक्ताओं की वाचा-विमुखता संबंधी भाषा की प्रतिध्वनि भी रहने देता है।
- source_word: σημεῖον
  choice: चिन्ह
  rationale: ‘चिन्ह’ मूल शब्द की व्यापकता बनाए रखता है; मुख्य पाठ में ‘चमत्कारी चिन्ह’ कहना मूल से अधिक स्पष्टता जोड़ देता।
- source_word: ἐπιζητεῖ
  choice: खोजती है
  rationale: यह क्रिया आग्रहपूर्वक खोजने या माँगने का अर्थ दे सकती है; ‘खोजती है’ सीधा अर्थ रखता है और विरोधी भाव को प्रसंग से उभरने देता है।
- source_word: δοθήσεται
  choice: नहीं दिया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: αὐτῇ
  choice: उसे
  rationale: स्त्रीलिंग एकवचन सर्वनाम ‘पीढ़ी’ की ओर लौटता है; हिन्दी में ‘उसे’ इस संबंध को सहज रूप में व्यक्त करता है।
- source_word: εἰ μὴ
  choice: के सिवा
  rationale: यह वाक्यांश एकमात्र अपवाद बताता है; ‘के सिवा’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: योना का चिन्ह
  rationale: सम्बन्धकारक पदबंध को सीधे रखा गया है, ताकि चिन्ह का ठीक स्वरूप मुख्य पाठ में व्याख्यायित करके सीमित न कर दिया जाए।
- source_word: καταλιπὼν
  choice: उन्हें छोड़कर
  rationale: पूर्वकालिक कृदन्त को स्वाभाविक हिन्दी संयुक्त क्रिया में व्यक्त किया गया है।
- source_word: ἀπῆλθεν
  choice: चला गया
  rationale: यह उनसे प्रस्थान करने की गति को आधुनिक और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘व्यभिचारिणी पीढ़ी’ का अर्थ
  choice: मुख्य पाठ में व्यभिचार का रूपक बनाए रखा गया है, जिससे नैतिक व्यभिचार और परमेश्वर के प्रति बेवफाई—दोनों संकेत खुले रहते हैं।
  alternative: ‘विश्वासघाती पीढ़ी’ या ‘बेवफा पीढ़ी’ कहना।
  rationale: भविष्यद्वक्ताओं की भाषा में यह वाचा के प्रति बेवफाई की प्रतिध्वनि हो सकती है, लेकिन यूनानी पाठ स्वयं व्यभिचार का रूपक प्रयोग करता है; उसे बनाए रखना वास्तविक धार्मिक तनाव को सुरक्षित रखता है।
- issue: ‘योना का चिन्ह’ का आशय
  choice: मुख्य पाठ में संक्षिप्त पदबंध को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: इसे यीशु की मृत्यु और पुनरुत्थान का स्पष्ट संदर्भ बताना।
  rationale: मत्ती 12:39–40 इस चिन्ह को आगे स्पष्ट करता है, पर इस पद में अभिव्यक्ति संक्षिप्त है; अतः व्याख्या को मुख्य पाठ में आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। ‘व्यभिचारिणी’ जानबूझकर तीखा और रूपकात्मक रखा गया है। ‘तब’ यूनानी καί को घटनाक्रम के स्वाभाविक हिन्दी संक्रमण के रूप में व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
