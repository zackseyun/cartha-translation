id: MAT.16.19
reference: Matthew 16:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: hi
  text: मैं तुम्हें स्वर्ग के राज्य की कुंजियाँ दूँगा[a]; और जो कुछ तुम पृथ्वी पर बाँधोगे, वह स्वर्ग में बाँधा जा चुका होगा[b][c], और जो कुछ तुम पृथ्वी पर खोलोगे, वह स्वर्ग में खोला जा चुका होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “स्वर्गों का राज्य।” मत्ती इस अभिव्यक्ति का बार-बार प्रयोग करता है।
    reason: lexical_alternative
  - marker: b
    text: परम्परागत अनुवाद में प्रायः “स्वर्ग में बाँधा जाएगा ... स्वर्ग में खोला जाएगा” मिलता है। यूनानी रचना को अधिक ठीक रूप से “बाँधा जा चुका होगा ... खोला जा चुका होगा” समझा जा सकता है।
    reason: alternative_reading
  - marker: c
    text: “बाँधना” और “खोलना” मना करने और अनुमति देने, अथवा दायित्व लगाने और हटाने का अर्थ भी दे सकते हैं; मुख्य पाठ में यूनानी रूपक को सुरक्षित रखा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: δώσω σοι
  choice: मैं तुम्हें ... दूँगा
  rationale: भविष्यकालीन प्रतिज्ञा और परोक्ष कर्म को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰς κλεῖδας
  choice: कुंजियाँ
  rationale: मूल के बहुवचन और उसके रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: स्वर्ग के राज्य
  rationale: मत्ती की विशिष्ट अभिव्यक्ति का हिन्दी में प्रचलित और सहज रूप; यूनानी में ‘स्वर्गों’ बहुवचन है, जिसे पादटिप्पणी में दर्ज किया गया है।
- source_word: ὃ ἐὰν
  choice: जो कुछ
  rationale: अनिश्चित सम्बन्धवाचक रचना का स्वाभाविक हिन्दी रूप, दोनों समानान्तर उपवाक्यों में बरकरार।
- source_word: δήσῃς
  choice: बाँधोगे
  rationale: मूल रूपक और उसके अधिकार-संबंधी अर्थ-संकेत को सुरक्षित रखता है, पर उसका कोई एक संस्थागत अर्थ तय नहीं करता।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: स्वर्ग के साथ मूल के स्थान-विरोध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔσται δεδεμένον
  choice: बाँधा जा चुका होगा
  rationale: εἰμί के भविष्य रूप और पूर्ण निष्क्रिय कृदन्त के संयोग को भविष्य पूर्ण निष्क्रिय रूप में दर्शाता है।
- source_word: ἐν τοῖς οὐρανοῖς
  choice: स्वर्ग में
  rationale: यूनानी बहुवचन का हिन्दी में सहज एकवचन रूप; शाब्दिक बहुवचन पादटिप्पणी में बताया गया है।
- source_word: λύσῃς
  choice: खोलोगे
  rationale: ‘बाँधना/खोलना’ की रूपकात्मक समरूपता को बनाए रखता है; यहाँ ‘छोड़ना’ की तुलना में ‘खोलना’ युग्म को अधिक स्पष्ट बनाता है।
- source_word: ἔσται λελυμένον
  choice: खोला जा चुका होगा
  rationale: भविष्य + पूर्ण निष्क्रिय कृदन्त की पक्षगत शक्ति को सुरक्षित रखता और पहले उपवाक्य के समानान्तर रहता है।
theological_decisions:
- issue: बाँधने और खोलने की उक्ति का पक्ष तथा धर्मवैचारिक निहितार्थ
  choice: ‘बाँधा/खोला जा चुका होगा’
  alternative: ‘बाँधा/खोला जाएगा’
  rationale: यूनानी ἔσται के साथ पूर्ण निष्क्रिय कृदन्त भविष्य में ऐसी अवस्था दर्शाता है जो पूर्ण हो चुकी क्रिया का परिणाम है। यह रूप पृथ्वी की क्रिया और स्वर्गीय निर्णय के सम्बन्ध को खुला रखता है और किसी विशिष्ट सम्प्रदायगत अधिकार-सिद्धान्त को पाठ में नहीं जोड़ता।
- issue: स्वर्ग के राज्य की कुंजियों का अर्थ
  choice: ‘कुंजियाँ’ का रूपक यथावत रखा गया
  alternative: प्रवेश देने और रोकने का अधिकार; भण्डारी-सदृश अधिकार
  rationale: रूपक अधिकार का संकेत दे सकता है, पर पद स्वयं उसकी व्याख्या नहीं करता। इसलिए किसी विशिष्ट कलीसियाई व्यवस्था को अनिवार्य अर्थ बनाने से बचा गया है।
- issue: ‘बाँधना’ और ‘खोलना’ का व्यावहारिक आशय
  choice: मुख्य पाठ में रूपक सुरक्षित रखा गया
  alternative: मना करना और अनुमति देना; दायित्व लगाना और हटाना
  rationale: इन शब्दों का यह न्यायिक/शिक्षकीय प्रयोग सम्भव है, किन्तु मुख्य पाठ में उसे एकमात्र अर्थ बनाना मूल की अर्थ-व्याप्ति को संकुचित करेगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘तुम्हें/तुम’ मूल के एकवचन σοι और क्रियारूपों को दर्शाते हैं। पारम्परिक बाइबलीय शब्दावली ‘स्वर्ग का राज्य’ और ‘कुंजियाँ’ रखी गई है, जबकि दुर्बोध अतिसंस्कृत भाषा से बचा गया है।
