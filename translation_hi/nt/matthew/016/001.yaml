reference: Matthew 16:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: hi
  text: और फ़रीसी और सदूकी उनके पास आए और उनकी परीक्षा लेते हुए[a] उनसे माँग की कि वे उन्हें स्वर्ग से एक चिन्ह दिखाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें लुभाते हुए” अथवा “उन्हें फँसाने की कोशिश करते हुए।”
    reason: πειράζοντες के वैकल्पिक अर्थों और प्रसंग में उसके विरोधी आशय को दर्शाने के लिए।
lexical_decisions:
- source_word: προσελθόντες
  choice: पास आए
  rationale: यह यीशु की ओर बढ़कर आने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और मुख्य क्रिया से पहले की क्रिया को बनाए रखता है।
- source_word: Φαρισαῖοι
  choice: फ़रीसी
  rationale: इस यहूदी धार्मिक समूह के लिए हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: Σαδδουκαῖοι
  choice: सदूकी
  rationale: इस यहूदी धार्मिक समूह के लिए हिन्दी में प्रचलित लिप्यंतरण।
- source_word: πειράζοντες
  choice: परखने के लिए
  rationale: संदर्भ में विरोधी उद्देश्य का संकेत देते हुए भी यूनानी शब्द की मूल 'जाँचने/परखने' वाली व्यापकता को बनाए रखता है; अधिक व्याख्यात्मक 'फँसाने के लिए' मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἐπηρώτησαν
  choice: कहा
  rationale: ἐπηρώτησαν और अनन्त क्रिया ἐπιδεῖξαι का संयुक्त अर्थ यहाँ किसी काम को करने के लिए कहने/माँगने का है। शाब्दिक 'पूछा कि दिखाएँ' हिन्दी में अस्वाभाविक होता।
- source_word: σημεῖον
  choice: कोई चिन्ह
  rationale: यूनानी पाठ केवल 'चिन्ह' कहता है; 'चमत्कारी चिन्ह' जोड़ने से निहित अर्थ को अनावश्यक रूप से स्पष्ट कर दिया जाता। अनिश्चित वस्तु के लिए 'कोई' स्वाभाविक हिन्दी है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से
  rationale: चिन्ह के स्रोत या उद्गम को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπιδεῖξαι
  choice: दिखाएँ
  rationale: माँगी गई क्रिया को सम्मानसूचक हिन्दी वाक्य-विन्यास में सीधे व्यक्त करता है।
theological_decisions:
- issue: फ़रीसियों और सदूकियों की माँग में विरोधी आशय
  choice: πειράζοντες का अनुवाद 'उन्हें परखने के लिए' किया गया।
  alternative: '''उन्हें लुभाने के लिए'' या ''उन्हें फँसाने के लिए'''
  rationale: '''परखने'' से प्रसंग का विरोधी तनाव बना रहता है, जबकि ''फँसाने'' से उद्देश्य को यूनानी शब्द की अपेक्षा अधिक निश्चित कर दिया जाता और ''लुभाने'' का अर्थ इस प्रसंग में भ्रामक हो सकता है।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। 'वह...दिखाएँ' में यीशु के लिए सम्मानसूचक एकवचन रखा गया है। मुख्य पाठ में 'चिन्ह' स्रोत के निकट है और पादटिप्पणी πειράζοντες की वास्तविक अर्थ-व्याप्ति सुरक्षित रखती है।
