id: MAT.16.23
reference: Matthew 16:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: hi
  text: पर उसने मुड़कर पतरस से कहा, “मेरे पीछे हट जा, शैतान! तू मेरे लिए ठोकर का कारण है, क्योंकि तेरा मन परमेश्वर की बातों पर नहीं, बल्कि मनुष्यों की बातों पर लगा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: मुड़कर
  rationale: यह अकर्मक अर्थ में प्रयुक्त कृदंत है और बोलने से पहले यीशु के मुड़ने को स्वाभाविक तथा संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: Ὕπαγε ὀπίσω μου
  choice: मेरे पीछे हट जा
  rationale: यह अनुवाद ὀπίσω के स्थान-संबंधी अर्थ को बनाए रखता है और कड़ी फटकार के रूप में स्वाभाविक हिन्दी भी है; केवल ‘दूर हो जा’ कहने से ‘पीछे’ का बिंब मिट जाता।
- source_word: Σατανᾶ
  choice: शैतान
  rationale: यहाँ संबोधन के रूप में मान्य नाम/उपाधि है। ‘विरोधी’ अर्थ को सीमित कर देता और मूल की धार्मिक तथा कथात्मक प्रतिध्वनि को कमजोर करता।
- source_word: σκάνδαλον
  choice: ठोकर का कारण
  rationale: यह किसी को गिराने या उसके मार्ग में बाधा बनने का रूपक सुरक्षित रखता है; ‘अपराध’ आधुनिक हिन्दी में इस संदर्भ में अधिक अमूर्त होता।
- source_word: ἐμοῦ
  choice: मेरे लिए
  rationale: σκάνδαλον के साथ संबंध को स्वाभाविक हिन्दी में उस व्यक्ति के रूप में व्यक्त करता है जिसके मार्ग में बाधा उपस्थित है।
- source_word: φρονεῖς
  choice: मन लगाता है
  rationale: यह केवल क्षणिक विचार नहीं, बल्कि मानसिक रुझान, सरोकार और अभिमुखता को व्यक्त करता है।
- source_word: τὰ τοῦ θεοῦ
  choice: परमेश्वर की बातें
  rationale: यह मूल के व्यापक और कुछ हद तक खुले अर्थ को बनाए रखता है, उसे केवल ‘योजना’ या ‘हितों’ तक सीमित नहीं करता।
- source_word: τὰ τῶν ἀνθρώπων
  choice: मनुष्यों की बातें
  rationale: ἀνθρώπων यहाँ समस्त मानवजाति के प्रतिनिधि अर्थ में है। ‘मनुष्यों’ मूल के मानव-विरुद्ध-परमेश्वर विरोध को स्पष्ट और आधुनिक हिन्दी में समावेशी ढंग से व्यक्त करता है।
theological_decisions:
- issue: पतरस के लिए ‘शैतान’ संबोधन का आशय
  choice: तीखी फटकार में ‘शैतान’ को सीधे संबोधन के रूप में रखा गया है, पर यह नहीं बताया गया कि पतरस स्वयं शैतान ठहराया गया है या शैतानी विरोध का साधन बन रहा है।
  alternative: इसे सामान्य अर्थ में ‘विरोधी’ कहना, अथवा स्पष्ट करना कि यीशु पतरस के माध्यम से काम कर रहे शैतान को संबोधित कर रहे हैं।
  rationale: मूल पाठ दोनों व्याख्याओं के बीच तनाव को स्पष्ट नहीं करता। ‘शैतान’ उसकी तीव्रता और परीक्षा-वृत्तांत से संभावित प्रतिध्वनि दोनों बचाता है।
- issue: Ὕπαγε ὀπίσω μου में स्थान और शिष्यत्व की प्रतिध्वनि
  choice: ‘मेरे पीछे हट जा’ द्वारा स्थान-संबंधी भाषा को बनाए रखा गया है।
  alternative: ‘मेरे सामने से दूर हो जा’ या केवल ‘दूर हो जा’।
  rationale: ‘पीछे’ यीशु के मार्ग में बाधा न बनने का अर्थ रखता है और संभवतः शिष्य के उचित स्थान की प्रतिध्वनि भी देता है; अनुवाद इस संभावना को सुरक्षित रखता है, पर उसे स्पष्ट व्याख्या में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। वाक्य की तीखी फटकार, ठोकर का रूपक और परमेश्वर तथा मनुष्यों की बातों का समानांतर विरोध सुरक्षित रखा गया है। मुख्य पाठ में कोई पादटिप्पणी आवश्यक नहीं मानी गई।
