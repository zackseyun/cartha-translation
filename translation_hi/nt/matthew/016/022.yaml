  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: hi
  text: और पतरस उसे अलग ले गया और यह कहते हुए उसे डाँटने लगा, “प्रभु, ऐसा आपसे दूर रहे![a] आपके साथ ऐसा कभी नहीं होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु, परमेश्वर ऐसा न करे!” यूनानी अभिव्यक्ति मुहावरेदार और लोपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος
  choice: उसे अलग ले गया
  rationale: मध्यवाच्य कृदंत इस प्रसंग में यीशु को एक ओर, निजी रूप से ले जाने का भाव देता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: उसे डाँटने लगा
  rationale: ἤρξατο के आरम्भसूचक बल और ἐπιτιμᾶν की कड़ी फटकार—दोनों को सीधे व्यक्त करता है।
- source_word: Ἵλεώς σοι
  choice: परमेश्वर आप पर दया करे
  rationale: यह कठिन, लोपयुक्त यूनानी मुहावरा अनिष्ट को टालने की प्रार्थनात्मक कामना व्यक्त करता है। मुख्य पाठ में अर्थ को स्वाभाविक हिन्दी में स्पष्ट किया गया है, जबकि अधिक मुहावरेदार विकल्प पादटिप्पणी में रखा गया है।
- source_word: κύριε
  choice: प्रभु
  rationale: यह κύριε का सामान्य और गरिमापूर्ण हिन्दी संबोधन है तथा मत्ती के मसीह-संबंधी अर्थ-संकेत को बनाए रखता है।
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: आपके साथ ऐसा कभी नहीं होगा
  rationale: οὐ μή और भविष्यकाल की प्रबल निषेधात्मकता को ‘कभी नहीं’ व्यक्त करता है; σοι को प्रसंगानुसार ‘आपके साथ’ कहा गया है।
theological_decisions:
- issue: पतरस की आपत्ति में Ἵλεώς σοι के लोपयुक्त और विवादित अर्थ को व्यक्त करना
  choice: प्रभु, परमेश्वर आप पर दया करे!
  alternative: प्रभु, ऐसा आपसे दूर रहे! / प्रभु, परमेश्वर ऐसा न करे!
  rationale: मुख्य रूप प्रार्थनात्मक दया/अनुग्रह के सम्भावित भाव को स्पष्ट करता है। फिर भी यूनानी में ‘परमेश्वर’ प्रत्यक्ष रूप से नहीं है और वाक्य मुहावरेदार तथा लोपयुक्त है; इसलिए विकल्प पादटिप्पणी में देकर वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरपूर्ण संबोधन के लिए ‘आप’ और गरिमापूर्ण परन्तु सर्वसाधारण को समझ आने वाली शब्दावली। ‘डाँटने लगा’ पतरस के असाधारण रूप से तीखे हस्तक्षेप को बिना नरम किए रखता है।
