  text: πῶς οὐ νοεῖτε ὅτι οὐ περὶ ⸀ἄρτων εἶπον ὑμῖν; ⸂προσέχετε δὲ⸃ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: hi
  text: तुम यह कैसे नहीं समझते कि मैंने तुमसे रोटी के बारे में नहीं कहा था? परन्तु फरीसियों और सदूकियों के खमीर से सावधान रहो।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फरीसियों और सदूकियों के खमीर से बचकर रहो।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “खमीर” एक रूपक है; अगले पद में इसे फरीसियों और सदूकियों की शिक्षा के रूप में समझाया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: तुम यह कैसे नहीं समझते
  rationale: यह अभिव्यक्ति न समझ पाने पर उलाहने के रूप में पूछा गया प्रश्न है। ‘समझते’ νοεῖτε का स्वाभाविक आधुनिक हिन्दी रूप है, और ‘कैसे नहीं’ मूल की आलंकारिक प्रश्नवाचक शक्ति बनाए रखता है।
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: कि मैंने तुमसे रोटी के बारे में नहीं कहा था
  rationale: περὶ ἄρτων का प्रसंगानुकूल हिन्दी रूप ‘रोटी के बारे में’ है; यूनानी में बहुवचन होने पर भी हिन्दी में जातिवाचक एकवचन स्वाभाविक है। ‘कहा था’ पूर्व कथन की ओर संकेत स्पष्ट करता है।
- source_word: προσέχετε δὲ
  choice: बल्कि ... सावधान रहो
  rationale: προσέχετε यहाँ चेतावनी देने वाला आज्ञार्थक शब्द है। δέ सुधारात्मक मोड़ दिखाता है; हिन्दी में ‘बल्कि’ यह स्पष्ट करता है कि विषय रोटी नहीं, खमीर से संबंधित चेतावनी था।
- source_word: ἀπὸ τῆς ζύμης
  choice: खमीर से
  rationale: प्रसέχετε के साथ ἀπό उस वस्तु को बताता है जिससे बचना है। ‘खमीर’ आधुनिक हिन्दी में समझने योग्य है और मूल रूपक को बिना समय से पहले खोलकर बताए सुरक्षित रखता है।
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: फरीसियों और सदूकियों के
  rationale: ये दोनों यहूदी समूहों के प्रचलित हिन्दी नाम हैं। संबंधकारक रूप उनके साथ जुड़ा या उनकी विशेषता वाला ‘खमीर’ दर्शाता है।
theological_decisions:
- issue: ‘खमीर’ का रूपक
  choice: मुख्य पाठ में ‘खमीर’ रूपक को बनाए रखा गया है।
  alternative: ‘फरीसियों और सदूकियों की शिक्षा से सावधान रहो।’
  rationale: अगला पद रूपक को उनकी शिक्षा के रूप में स्पष्ट करता है, पर इस पद में ζύμη ही कहा गया है। रूपक बनाए रखने से मूल कथन का क्रम और उसका प्रभाव सुरक्षित रहता है।
- issue: δέ का संबंधसूचक बल
  choice: ‘बल्कि’
  alternative: ‘परन्तु’ या ‘और’
  rationale: वाक्य रोटी के बारे में हुई गलत समझ को सुधारकर वास्तविक चेतावनी की ओर मोड़ता है। ‘बल्कि’ इस सुधारात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना रूपक का अर्थ पहले से निर्धारित किए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘तुम’ शिष्यों को संबोधित बहुवचन के रूप में प्रसंगानुकूल है। ‘रोटी’ और ‘खमीर’ सामान्य पाठक के लिए परिचित शब्द हैं; वाक्य की फटकार और चेतावनी दोनों को स्पष्ट रखा गया है।
