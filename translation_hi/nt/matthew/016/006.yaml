id: MAT.16.6
reference: Matthew 16:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: hi
  text: पर यीशु ने उनसे कहा, “सचेत रहो और फ़रीसियों तथा सदूकियों के खमीर[a] से सावधान रहो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘खमीर’ रूपक के रूप में प्रयुक्त है। आगे के प्रसंग में यीशु इसे फ़रीसियों और सदूकियों की शिक्षा से संबंधित बताते हैं।
    reason: रूपक की पहचान कराना, बिना उसके अर्थ को मुख्य पाठ में समय से पहले रखे।
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले प्रसंग से हल्का विरोध या संक्रमण प्रकट करता है; आधुनिक हिन्दी में ‘पर’ स्वाभाविक और संक्षिप्त है।
- source_word: εἶπεν αὐτοῖς
  choice: उनसे कहा
  rationale: λέγω और उसके अप्रत्यक्ष कर्म का सीधा तथा स्वाभाविक हिन्दी रूप।
- source_word: Ὁρᾶτε
  choice: सचेत रहो
  rationale: यहाँ ὁράω का आज्ञार्थक रूप सामान्य ‘देखने’ के बजाय चेतावनी देने के मुहावरेदार अर्थ में है।
- source_word: προσέχετε
  choice: सावधान रहो
  rationale: पहली आज्ञा के साथ मिलकर चेतावनी को बल देता है; दोनों क्रियाओं को अलग रखकर यूनानी की आलंकारिक पुनरुक्ति सुरक्षित की गई है।
- source_word: ἀπὸ
  choice: से
  rationale: सावधान रहने की क्रिया के साथ ἀπό का स्वाभाविक हिन्दी संबंधबोधक रूप ‘से’ है।
- source_word: ζύμης
  choice: खमीर
  rationale: यह प्रचलित हिन्दी शब्द मूल रूपक को बनाए रखता है और इस पद में उसके आशय को समय से पहले स्पष्ट नहीं करता।
- source_word: Φαρισαίων
  choice: फ़रीसियों
  rationale: समूह के नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: Σαδδουκαίων
  choice: सदूकियों
  rationale: समूह के नाम का हिन्दी में प्रचलित लिप्यंतरण।
theological_decisions:
- issue: ‘खमीर’ का रूपकात्मक अर्थ
  choice: मुख्य पाठ में ‘खमीर’ का रूपक ज्यों का त्यों रखा गया है।
  alternative: ‘शिक्षा’ या ‘प्रभाव’ लिखकर रूपक को इसी पद में स्पष्ट कर देना।
  rationale: आगे के प्रसंग में रूपक की व्याख्या मिलती है, पर इस पद में यीशु ζύμη ही कहते हैं। इसलिए पाठ की क्रमिक अर्थ-प्रगति और वास्तविक रूपकात्मक तनाव को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सचेत रहो’ और ‘सावधान रहो’ से यूनानी की दोहरी चेतावनी बनी रहती है। ‘फ़रीसियों तथा सदूकियों’ में ‘तथा’ वाक्य को औपचारिक गरिमा देता है, पर भाषा को पुरातन नहीं बनाता।
