source:
  edition: SBLGNT
  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: hi
  text: क्या तुम अब तक नहीं समझते[a]? क्या तुम्हें पाँच हज़ार लोगों के लिए वे पाँच रोटियाँ याद नहीं, और यह भी कि तुमने कितनी टोकरियाँ उठाई थीं[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम अभी तक नहीं समझते?”
    reason: οὔπω और वर्तमानकालीन νοεῖτε के संयुक्त भाव का वैकल्पिक स्वाभाविक हिन्दी रूप।
  - marker: b
    text: या, “तुमने कितनी टोकरियाँ इकट्ठी की थीं?”
    reason: प्रसंग में ἐλάβετε को बचा हुआ भोजन टोकरियों में इकट्ठा करने के अर्थ में भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: οὔπω
  choice: अब तक नहीं
  rationale: यह οὔπω के काल-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और प्रश्न में निहित उलाहने को बनाए रखता है।
- source_word: νοεῖτε
  choice: समझते
  rationale: यहाँ क्रिया पिछले चमत्कारों के महत्त्व को मानसिक रूप से समझने के लिए है, केवल देखने या पहचानने के लिए नहीं।
- source_word: οὐδὲ
  choice: क्या ... और ... याद नहीं
  rationale: हिन्दी में अलग समानांतर प्रश्न के रूप में नकारात्मक समन्वय स्वाभाविक है और यूनानी के οὐδὲ का संबंध स्पष्ट रखता है।
- source_word: μνημονεύετε
  choice: याद
  rationale: पूर्व घटना को स्मरण करने का सीधा और सामान्य हिन्दी रूप।
- source_word: τοὺς πέντε ἄρτους
  choice: वे पाँच रोटियाँ
  rationale: प्रसंग में ἄρτοι खाने की रोटियों को दर्शाता है; 'वे' पहले से ज्ञात घटना की ओर संकेत करता है।
- source_word: τῶν πεντακισχιλίων
  choice: पाँच हज़ार लोगों के लिए
  rationale: संबंधवाचक पद को प्रसंगानुसार भोजन पाए पाँच हज़ार लोगों से जोड़ता है; 'लोगों' से हिन्दी में संख्या का आशय स्पष्ट होता है।
- source_word: πόσους κοφίνους
  choice: कितनी टोकरियाँ
  rationale: κόφινος एक टोकरी है; प्रश्न बची सामग्री उठाने में प्रयुक्त टोकरियों की संख्या के विषय में है।
- source_word: ἐλάβετε
  choice: उठाई थीं
  rationale: λαμβάνω का मूल 'लेना/उठाना' अर्थ सुरक्षित रहता है और भोजन के बाद टोकरियाँ उठाने के प्रसंग में स्वाभाविक है।
