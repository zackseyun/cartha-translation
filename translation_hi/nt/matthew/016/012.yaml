id: MAT.16.12
reference: Matthew 16:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: hi
  text: तब वे समझ गए कि उसने रोटी के खमीर[a] से सावधान रहने को नहीं, बल्कि फरीसियों और सदूकियों की शिक्षा से सावधान रहने को कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘रोटियों के खमीर’। यूनानी में ‘रोटी’ के लिए बहुवचन संज्ञा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह उस क्षण को सूचित करता है जब शिष्यों को यीशु की बात समझ आई; ‘तब’ स्वाभाविक और सटीक है।
- source_word: συνῆκαν
  choice: वे समझ गए
  rationale: क्रिया किसी बात की समझ प्राप्त होने को व्यक्त करती है; ‘समझ गए’ इस पूर्ण हुई बोध-प्रक्रिया को सहज हिन्दी में दिखाता है।
- source_word: οὐκ εἶπεν
  choice: नहीं ... कहा था
  rationale: संदर्भ में शिष्य अब पहले कही गई बात का अर्थ समझते हैं; हिन्दी का पूर्ण भूतकाल घटनाक्रम को स्पष्ट करता है।
- source_word: προσέχειν ἀπό
  choice: से सावधान रहने
  rationale: चेतावनी के इस संदर्भ में προσέχω ἀπό का अर्थ किसी चीज़ से चौकन्ना रहना है; यह हिन्दी में स्वाभाविक अभिव्यक्ति है।
- source_word: τῆς ζύμης
  choice: खमीर
  rationale: ζύμη रोटी के आटे को खमीर उठाने वाले पदार्थ को दर्शाता है। ‘खमीर’ आधुनिक हिन्दी में समझने योग्य है और रूपक को बनाए रखता है।
- source_word: τῶν ἄρτων
  choice: रोटी के
  rationale: यूनानी संज्ञा बहुवचन है, पर हिन्दी में इस सामान्य पदार्थ के लिए एकवचन ‘रोटी’ अधिक स्वाभाविक है; बहुवचन का शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: διδαχῆς
  choice: शिक्षा
  rationale: यह सिखाई गई बात या उपदेश-विषय को व्यक्त करता है; ‘शिक्षा’ आधुनिक, स्पष्ट और अनावश्यक पारिभाषिक भार से मुक्त है।
- source_word: Φαρισαίων καὶ Σαδδουκαίων
  choice: फरीसियों और सदूकियों
  rationale: इन ऐतिहासिक धार्मिक समूहों के नामों के प्रचलित हिन्दी लिप्यंतरण प्रयुक्त किए गए हैं।
theological_decisions:
- issue: ‘खमीर’ का रूपकात्मक आशय
  choice: मुख्य पाठ में रूपक को ‘फरीसियों और सदूकियों की शिक्षा’ तक ही स्पष्ट किया गया है।
  alternative: ‘कपट’, ‘भ्रष्ट शिक्षा’ या किसी अन्य नैतिक व्याख्या को मुख्य पाठ में जोड़ना।
  rationale: पद स्वयं खमीर का संबंध उनकी शिक्षा से बताता है, पर यहाँ उस शिक्षा का नैतिक स्वरूप और अधिक परिभाषित नहीं करता। इसलिए अनुवाद पाठ की अपनी व्याख्यात्मक सीमा बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण वाक्य-विन्यास रखा गया है। चेतावनी की पुनरावृत्ति हिन्दी में अर्थ स्पष्ट करती है और यूनानी के विपरीतार्थक ढाँचे को स्वाभाविक रूप देती है।
