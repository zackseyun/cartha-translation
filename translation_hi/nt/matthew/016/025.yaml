  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: hi
  text: क्योंकि जो कोई अपना जीवन बचाना चाहता है, वह उसे खो देगा; पर जो कोई मेरे लिए अपना जीवन खो दे, वह उसे पा लेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पूरे पद में “जीवन” के लिए प्रयुक्त यूनानी शब्द का अनुवाद प्रसंग के अनुसार “प्राण,” “स्वयं,” या “आत्मा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: क्योंकि जो कोई ... पर जो कोई
  rationale: अनिश्चित सामान्य शर्त को स्वाभाविक हिन्दी में ‘जो कोई’ व्यक्त करता है। γάρ को ‘क्योंकि’ से पिछले कथन के साथ जोड़ा गया है और δέ का विरोध ‘पर’ से रखा गया है।
- source_word: θέλῃ
  choice: चाहता है
  rationale: यहाँ θέλω इच्छा या संकल्प बताता है; ‘चाहता है’ सहज आधुनिक हिन्दी है।
- source_word: ψυχὴν
  choice: जीवन
  rationale: शिष्यत्व और मृत्यु के प्रसंग में ψυχή व्यक्ति के जीवन को दर्शाता है, हालांकि इसका अर्थ ‘प्राण’ या ‘आत्मा’ भी हो सकता है। ‘जीवन’ बचाने, खोने और पाने की समानांतर क्रियाओं के साथ स्वाभाविक है; व्यापक अर्थ-क्षेत्र पादटिप्पणी में सुरक्षित है।
- source_word: σῶσαι
  choice: बचाना
  rationale: σῴζω का यहाँ अर्थ जीवन को बचाना या सुरक्षित रखना है; ‘बचाना’ विरोधाभास को स्पष्ट और संक्षिप्त रखता है।
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: खो देगा / खो देगा
  rationale: इस प्रसंग में ἀπόλλυμι विनाश की दार्शनिक व्याख्या नहीं, जीवन खोने को व्यक्त करता है। हिन्दी में दोनों शर्तीय वाक्यांशों के परिणाममुखी अर्थ को ‘खो देगा’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἕνεκεν ἐμοῦ
  choice: मेरे कारण
  rationale: ἕνεκεν के साथ संबंधकारक कारण या हेतु व्यक्त करता है। ‘मेरे कारण’ स्वाभाविक है और यीशु के कारण जीवन खोने की बात को बिना व्याख्यात्मक विस्तार के रखता है।
- source_word: εὑρήσει
  choice: पा लेगा
  rationale: εὑρίσκω मूलतः ‘पाना/ढूँढ़ पाना’ है। जीवन के साथ हिन्दी में ‘पा लेगा’ अधिक सहज है और कथन के विरोधाभास को बनाए रखता है।
- source_word: αὐτοῦ / αὐτήν
  choice: अपना / उसे
  rationale: कर्तृवाचक स्वामित्व को हिन्दी में ‘अपना’ स्वाभाविक रूप से व्यक्त करता है और प्रतिनिधिक पुल्लिंग को अनावश्यक रूप से नहीं उभारता; ‘उसे’ जीवन की ओर लौटता है।
theological_decisions:
- issue: शिष्यत्व के विरोधाभासी कथन में ψυχή का अनुवाद
  choice: जीवन
  alternative: प्राण; आत्मा; स्वयं
  rationale: बचाने, खोने और पाने की क्रियाएँ तथा प्राण देने का निकट प्रसंग ‘जीवन’ का समर्थन करते हैं। फिर भी ψυχή का अर्थ-क्षेत्र इससे व्यापक है, इसलिए ‘प्राण’, ‘आत्मा’ और ‘स्वयं’ की संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ‘क्योंकि’ पिछले पद से तर्क-संबंध बनाए रखता है। पादटिप्पणी-चिह्न मुख्य पाठ में अंतिम संबंधित कथन के बाद रखा गया है।
