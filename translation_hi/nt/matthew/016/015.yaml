  text: वह उनसे कहता है, “लेकिन तुम्हारे अनुसार मैं कौन हूँ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: कहता है
  rationale: यूनानी ऐतिहासिक वर्तमान की जीवंतता बनाए रखने के लिए वर्तमान काल रखा गया है।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: वचन के अप्रत्यक्ष कर्म को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ὑμεῖς
  choice: तुम
  rationale: स्पष्ट कर्तृवाचक सर्वनाम पर बल है; पूर्ववर्ती लोगों की राय से इसका अंतर ‘लेकिन तुम’ द्वारा प्रकट होता है।
- source_word: δὲ
  choice: लेकिन
  rationale: यह पहले बताई गई जन-सामान्य की राय और शिष्यों के अपने उत्तर के बीच विरोध दर्शाता है।
- source_word: τίνα
  choice: कौन
  rationale: यह व्यक्ति की पहचान पूछने वाला प्रश्नवाचक सर्वनाम है।
- source_word: με ... εἶναι
  choice: मैं कौन हूँ
  rationale: यूनानी कर्मकारक-सहित क्रियार्थक संज्ञा की रचना को अर्थ-समान और स्वाभाविक हिन्दी उपवाक्य में बदला गया है।
- source_word: λέγετε
  choice: क्या कहते हो
  rationale: वर्तमान काल, मध्यम पुरुष बहुवचन को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: शिष्यों की अपनी पहचान-विषयक स्वीकारोक्ति पर बल
  choice: लेकिन तुम क्या कहते हो—मैं कौन हूँ?
  alternative: और तुम, मुझे कौन कहते हो?
  rationale: चुना हुआ रूप जनता की राय और शिष्यों के आकलन के बीच अंतर तथा ‘तुम’ के बल को बनाए रखता है, पर अगले पद की स्वीकारोक्ति को इस पद में पहले से नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘तुम’ शिष्यों के बहुवचन समूह के लिए है। प्रश्न की स्वाभाविकता और यूनानी में ‘तुम’ पर दिए गए बल, दोनों को बनाए रखने के लिए ‘लेकिन तुम क्या कहते हो—मैं कौन हूँ?’ चुना गया है।
