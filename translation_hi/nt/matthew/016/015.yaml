review_pass:
  verdict: revise
  source_fidelity: The draft preserves the historical present in λέγει, the contrast marked by δέ, and the plural address. However, “तुम क्या कहते हो—मैं कौन हूँ?” can be read as two loosely linked questions (“What do you say? Who am I?”) rather than as the Greek construction in which the disciples state who Jesus is. “तुम्हारे अनुसार मैं कौन हूँ?” clearly carries τίνα με λέγετε εἶναι while retaining the emphatic contrast.
  naturalness: “वह उनसे कहता है” is natural enough in a deliberately present-tense narrative. “लेकिन तुम्हारे अनुसार मैं कौन हूँ?” is idiomatic modern Hindi and gives the question a clear, unified form.
  terminology: No theological term or proper name occurs. The plural “तुम” appropriately addresses the disciples collectively. No footnote is required in Hindi, since the idiomatic wording does not conceal a materially disputed meaning.
  issues:
  - severity: medium
    issue: The relation of “क्या कहते हो” to “मैं कौन हूँ” is not explicit.
    rationale: Greek asks whom the disciples say Jesus is, not simply what they say followed by an independent question. The dash improves flow but does not fully remove this ambiguity in Hindi.
