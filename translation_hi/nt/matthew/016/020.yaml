  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: hi
  text: तब उसने चेलों को कड़ा निर्देश दिया कि वे किसी से न कहें कि वह मसीह[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ख्रीस्त।’ यूनानी उपाधि Χριστός का अर्थ ‘अभिषिक्त’ है; यहाँ इसे ‘मसीह’ अनूदित किया गया है।
    reason: वैकल्पिक रूप और उपाधि के मूल अर्थ को स्पष्ट करना
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कथा में घटनाक्रम का क्रम सूचित करता है; ‘तब’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: διεστείλατο
  choice: कड़ा निर्देश दिया
  rationale: यह क्रिया यहाँ दृढ़ आदेश या निषेध व्यक्त करती है। ‘कड़ा निर्देश दिया’ उसके बल को बनाए रखता है, बिना यह अनिवार्य रूप से जताए कि कोई खतरे की चेतावनी दी गई थी।
- source_word: τοῖς μαθηταῖς
  choice: चेलों को
  rationale: यह यीशु के पहले से परिचित अनुयायियों के समूह को सूचित करता है। हिन्दी में ‘चेलों’ से संदर्भ स्पष्ट है; ‘अपने’ जोड़ना आवश्यक नहीं।
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: कि वे किसी से न कहें
  rationale: ἵνα और संभावनार्थक क्रिया आदेश की विषयवस्तु व्यक्त करते हैं; यह हिन्दी में निषेध का स्पष्ट और स्वाभाविक रूप है।
- source_word: ὅτι
  choice: कि
  rationale: यह उस बात की विषयवस्तु प्रस्तुत करता है जिसे बताने से मना किया गया।
- source_word: αὐτός ἐστιν
  choice: वही ... है
  rationale: स्पष्ट सर्वनाम αὐτός को यहाँ ‘वही’ से व्यक्त करने पर पहचान का स्वाभाविक बल बना रहता है, बिना ‘वह स्वयं’ जैसे असहज रूप के।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: Χριστός यहाँ अभिषिक्त उद्धारकर्ता की उपाधि है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘मसीह’ इस उपाधि का परिचित और अर्थपूर्ण रूप है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: संदर्भ में Χριστός व्यक्तिगत नाम नहीं, प्रत्याशित अभिषिक्त की उपाधि है। ‘मसीह’ हिन्दी में स्थापित रूप है; पादटिप्पणी उसके शाब्दिक अर्थ को स्पष्ट करती है और उपाधि के स्वरूप को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कड़ा निर्देश दिया’ आदेश की दृढ़ता व्यक्त करता है, और ‘वही मसीह है’ यूनानी में व्यक्त पहचान को स्वाभाविक हिन्दी में बनाए रखता है।
