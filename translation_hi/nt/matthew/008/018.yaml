  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: hi
  text: जब यीशु ने अपने चारों ओर बहुत-सी भीड़ें देखीं, तो उन्होंने दूसरे पार जाने की आज्ञा दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὺς ὄχλους
  choice: बहुत-सी भीड़
  rationale: बहुवचन ὄχλους को बनाए रखते हुए स्वाभाविक हिन्दी में अनेक भीड़-समूहों का भाव व्यक्त करता है।
- source_word: περὶ αὐτόν
  choice: अपने चारों ओर
  rationale: यीशु को घेरे हुए भीड़ की स्थानगत स्थिति को सहज और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἐκέλευσεν
  choice: आज्ञा दी
  rationale: क्रिया में निहित अधिकारपूर्ण निर्देश का भाव सुरक्षित रखता है; आज्ञा किसे दी गई, यह स्रोत की तरह अनिर्दिष्ट रहता है।
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: झील के उस पार जाने
  rationale: τὸ πέραν का प्रसंगगत अर्थ झील का दूसरा किनारा है; ἀπελθεῖν को अत्यधिक शाब्दिक 'चले जाने' के बजाय स्वाभाविक 'जाने' से व्यक्त किया गया है।
