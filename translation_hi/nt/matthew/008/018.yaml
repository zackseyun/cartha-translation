translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। δέ को अलग से 'अब' या 'परन्तु' नहीं दिया गया, क्योंकि यहाँ वह मुख्यतः कथानक को आगे बढ़ाता है। कर्ता के सम्मानसूचक संदर्भ के कारण 'उन्होंने' प्रयुक्त है।
