  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: hi
  text: और जब वह नाव पर चढ़ा, तो उसके शिष्य उसके पीछे हो लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβάντι
  choice: जब वह…चढ़ा
  rationale: कालवाचक कृदन्त को स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है। नाव के सन्दर्भ में ‘चढ़ा’ प्रवेश करने की क्रिया को सहज ढंग से बताता है।
- source_word: πλοῖον
  choice: नाव
  rationale: गलील झील के प्रसंग में ‘नाव’ आधुनिक हिन्दी में सबसे स्वाभाविक है। हिन्दी में उपपद न होने के कारण यूनानी पाठ की निश्चितता-अनिश्चितता स्वतः खुली रहती है।
- source_word: ἠκολούθησαν αὐτῷ
  choice: उसके पीछे हो लिए
  rationale: यह वाक्यांश नाव पर उसके साथ जाने की वास्तविक क्रिया बताता है और साथ ही मत्ती में ‘पीछे चलने’ की शिष्यत्व-संबंधी प्रतिध्वनि को बिना विस्तार किए बनाए रखता है।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: उसके शिष्य
  rationale: ‘शिष्य’ μαθητής का प्रचलित, गरिमापूर्ण और सम्बन्धपरक अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: ἀκολουθέω में सम्भावित शिष्यत्व-संबंधी अर्थछाया
  choice: उसके पीछे हो लिए
  alternative: उसके साथ गए
  rationale: मुख्य अर्थ यहाँ वास्तविक रूप से यीशु के पीछे नाव पर जाना है, पर ‘पीछे हो लिए’ शिष्यत्व की व्यापक अर्थछाया भी बनाए रखता है; इसे ‘उसके अनुयायी बन गए’ कहकर अनावश्यक रूप से स्पष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तो’ हिन्दी के ‘जब…तो’ कालवाचक ढाँचे को स्वाभाविक बनाता है। यूनानी में नाव के साथ उपपद न होने की अस्पष्टता हिन्दी के उपपद-विहीन रूप ‘नाव’ में बिना पादटिप्पणी के सुरक्षित है।
