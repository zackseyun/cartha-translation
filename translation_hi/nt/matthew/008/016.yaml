  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: hi
  text: साँझ होने पर लोग दुष्टात्माओं से ग्रस्त बहुत-से लोगों[a] को उसके पास लाए। उसने एक शब्द से उन आत्माओं को निकाल दिया और सभी बीमारों को चंगा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्टात्माओं के प्रभाव में पड़े बहुत-से लोगों।” यूनानी कृदंत दुष्टात्मिक प्रभाव या अधीनता से पीड़ित लोगों को दर्शाता है; “दुष्टात्माओं से ग्रस्त” इसका प्रचलित संक्षिप्त अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: साँझ होने पर
  rationale: यह संबंधवाचक स्वतंत्र पदबंध समय बताता है। ‘साँझ होने पर’ आधुनिक हिन्दी में स्वाभाविक है और मूल का कालगत अर्थ बनाए रखता है।
- source_word: προσήνεγκαν αὐτῷ
  choice: लोग ... को उसके पास लाए
  rationale: यहाँ क्रिया का अर्थ लोगों को यीशु के पास लाना है। यूनानी में कर्ता निहित है; हिन्दी में स्वाभाविक वाक्य के लिए ‘लोग’ जोड़ा गया है।
- source_word: δαιμονιζομένους πολλούς
  choice: दुष्टात्माओं से ग्रस्त बहुत-से लोगों
  rationale: यह कृदंत दुष्टात्माओं के अधीन या प्रभाव में पीड़ित लोगों को दर्शाता है। ‘दुष्टात्माओं से ग्रस्त’ संक्षिप्त और प्रचलित है, जबकि पादटिप्पणी इसकी अर्थ-सीमा स्पष्ट करती है।
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: उन आत्माओं को निकाल दिया
  rationale: ‘निकाल दिया’ झाड़-फूँक के संदर्भ में ἐκβάλλω का स्वाभाविक हिन्दी रूप है। ‘आत्माओं’ मूल संज्ञा को बनाए रखता है; पूर्ववर्ती संदर्भ से उनका दुष्ट होना स्पष्ट है।
- source_word: λόγῳ
  choice: एक वचन से
  rationale: करणवाचक एकवचन यीशु के बोले हुए आदेश के साधन को व्यक्त करता है। ‘एक वचन से’ मूल में निहित अधिकार को बनाए रखता है, बिना ‘अपने’ जैसे अनुल्लिखित शब्द जोड़े।
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: सभी बीमारों को
  rationale: κακῶς ἔχειν यहाँ बीमार होने का यूनानी मुहावरा है। यह संक्षिप्त, स्पष्ट और चंगाई के प्रसंग के अनुकूल है।
- source_word: ἐθεράπευσεν
  choice: चंगा किया
  rationale: सुसमाचारों के चंगाई-वृत्तांतों में θεραπεύω का यह प्रचलित और अर्थ-संगत हिन्दी रूप है।
theological_decisions:
- issue: δαιμονιζομένους और τὰ πνεύματα का स्वरूप
  choice: वास्तविक दुष्टात्मिक पीड़ा के रूप में ‘दुष्टात्माओं से ग्रस्त’ और ‘आत्माओं’
  alternative: मानसिक रोगी; दुष्टात्माओं से सताए हुए
  rationale: पद आत्माओं को निकालने और बीमारों को चंगा करने का अलग-अलग उल्लेख करता है। इसलिए अनुवाद मूल पाठ की श्रेणियों को बनाए रखता है और उन्हें केवल मनोवैज्ञानिक अवस्था नहीं बनाता।
- issue: λόγῳ का आशय
  choice: करणवाचक रूप में ‘एक वचन से’
  alternative: अपने वचन से; बोलकर
  rationale: यह यीशु के आदेश के अधिकार को उभारता है, पर मूल से आगे बढ़कर कोई धर्मवैज्ञानिक विस्तार नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वचन’ बाइबलीय संदर्भ में परिचित है, पर वाक्य-विन्यास सरल रखा गया है।
