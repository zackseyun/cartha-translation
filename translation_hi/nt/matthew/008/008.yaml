id: MAT.8.8
reference: Matthew 8:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: hi
  text: सौ सैनिकों का अधिकारी ने उत्तर दिया, “प्रभु, मैं इस योग्य नहीं कि आप मेरी छत के नीचे आएँ। पर बस एक शब्द कह दीजिए[a], और मेरा सेवक[b] चंगा हो जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बस कह दीजिए।” यूनानी में शाब्दिक रूप से “एक शब्द कहिए” है।
    reason: lexical_alternative
  - marker: b
    text: या, “लड़का” अथवा “बालक।” यूनानी शब्द प्रसंग के अनुसार बालक, युवक या सेवक को दर्शा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: उत्तर दिया
  rationale: यूनानी में कृदंत और कथन-क्रिया मिलकर स्वाभाविक रूप से एक ही वाक्-परिचय बनाते हैं; हिन्दी में ‘उत्तर दिया’ प्रत्युत्तर का भाव रखते हुए अनावश्यक दोहराव से बचाता है।
- source_word: ἑκατόνταρχος
  choice: सौ सैनिकों का अधिकारी
  rationale: यह पद लगभग सौ सैनिकों के रोमी अधिकारी को दर्शाता है। यह रूप आधुनिक हिन्दी पाठक के लिए ‘शतपति’ से अधिक स्पष्ट है और ‘सूबेदार’ जैसे भारतीय सैन्य पद के संभावित भ्रम से बचता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: सम्बोधन में आदर बना रहता है और यीशु के विषय में सम्भावित गहरे धार्मिक आशय को केवल ‘श्रीमान’ कहकर सीमित नहीं किया जाता।
- source_word: ἱκανὸς
  choice: इस योग्य
  rationale: यहाँ शब्द केवल सामर्थ्य नहीं, बल्कि अपने को उस सम्मान के योग्य न समझने की विनम्रता व्यक्त करता है।
- source_word: ὑπὸ τὴν στέγην
  choice: मेरी छत के नीचे
  rationale: यूनानी के सजीव घरेलू मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀλλὰ μόνον εἰπὲ λόγῳ
  choice: पर बस एक शब्द कह दीजिए
  rationale: ‘बस’ प्रतिबन्धात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है और ‘एक शब्द’ यूनानी λόγῳ की निकट प्रतिध्वनि बनाए रखता है।
- source_word: ἰαθήσεται
  choice: चंगा हो जाएगा
  rationale: भविष्यकालीन कर्मवाच्य उपचार और स्वस्थ हो जाने का अर्थ स्पष्ट रूप से व्यक्त करता है तथा हिन्दी बाइबलीय भाषा में सहज है।
- source_word: παῖς
  choice: सेवक
  rationale: सैनिक अधिकारी के घरेलू-सामाजिक प्रसंग और समानांतर वृत्तांत में ‘सेवक’ सबसे सम्भावित है; फिर भी मूल शब्द की ‘लड़का/बालक’ वाली अर्थ-सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: यीशु के लिए सम्बोधन κύριος
  choice: प्रभु
  alternative: श्रीमान; स्वामी
  rationale: ‘प्रभु’ सम्मानपूर्ण सम्बोधन और सम्भावित मसीही आशय दोनों को खुला रखता है; यह न तो अर्थ को केवल शिष्टाचार तक सीमित करता है, न उससे अधिक स्पष्ट दावा जोड़ता है।
- issue: παῖς का अर्थ
  choice: सेवक
  alternative: लड़का; बालक
  rationale: प्रसंग ‘सेवक’ का समर्थन करता है, पर यूनानी शब्द की वास्तविक अर्थगत व्यापकता को मिटाने के बजाय पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘सौ सैनिकों का अधिकारी’ ऐतिहासिक पद को समझने योग्य बनाता है; ‘मेरी छत के नीचे’ मूल का चित्रात्मक मुहावरा सुरक्षित रखता है।
