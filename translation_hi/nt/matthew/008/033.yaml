id: MAT.8.33
reference: Matthew 8:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: hi
  text: तब झुंड को चरानेवाले लोग भाग गए। वे नगर में जाकर सब कुछ बता आए, जिसमें दुष्टात्माग्रस्त उन पुरुषों के साथ जो कुछ हुआ था, वह भी शामिल था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और दुष्टात्माग्रस्त पुरुषों से संबंधित बातें भी।”'
    reason: मूल यूनानी वाक्यांश केवल उनके साथ हुई घटना ही नहीं, बल्कि उनसे संबंधित बातों को अधिक व्यापक रूप से भी सूचित कर सकता है।
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: तब चरवाहे
  rationale: βόσκοντες उन लोगों को दर्शाता है जो पशुओं को चरा या संभाल रहे थे; प्रसंग में वे सूअरों के झुंड की रखवाली कर रहे थे। ‘चरवाहे’ संक्षिप्त, स्वाभाविक और सामान्य पाठक के लिए स्पष्ट है। δέ को कथा की अगली घटना दिखाने के लिए ‘तब’ कहा गया है।
- source_word: ἔφυγον
  choice: भाग गए
  rationale: φεύγω का सीधा अर्थ भागना या पलायन करना है। ‘भाग गए’ आधुनिक हिन्दी में स्वाभाविक और कथात्मक रूप से सजीव है।
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: उन्होंने नगर में जाकर
  rationale: भूतकालिक कृदंत ἀπελθόντες मुख्य क्रिया से पहले की संबद्ध क्रिया बताता है। ‘नगर में जाकर’ इस क्रम और εἰς की दिशात्मकता को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀπήγγειλαν πάντα
  choice: सब कुछ बता दिया
  rationale: ἀπαγγέλλω का अर्थ समाचार देना या वृत्तांत सुनाना है, और πάντα समग्रता व्यक्त करता है। ‘सब कुछ बता दिया’ औपचारिक हुए बिना दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: और यह भी कि दुष्टात्माओं से ग्रस्त उन पुरुषों के साथ क्या हुआ था
  rationale: यूनानी वाक्यांश शाब्दिक रूप से ‘और दुष्टात्माग्रस्त लोगों से संबंधित बातें भी’ है। प्रसंग में यह उनके साथ घटी घटना की ओर संकेत करता है; मुख्य पाठ इसे सहज हिन्दी में स्पष्ट करता है, जबकि पादटिप्पणी मूल की अधिक खुली बनावट सुरक्षित रखती है। ‘पुरुषों’ की पूर्ति निकटवर्ती प्रसंग से होती है, जहाँ दो पुरुषों का उल्लेख है।
- source_word: δαιμονιζομένων
  choice: दुष्टात्माओं से ग्रस्त
  rationale: यह पद दुष्टात्माओं के प्रभाव या वश में होने की वास्तविक दशा बताता है। ‘दुष्टात्माओं से ग्रस्त’ हिन्दी में स्पष्ट है और मूल से आगे बढ़कर उस दशा की कोई तकनीकी या सांप्रदायिक व्याख्या निर्धारित नहीं करता।
theological_decisions:
- issue: δαιμονιζομένων में दुष्टात्मिक दशा को वास्तविक रूप में व्यक्त करना, पर उसकी प्रकृति के बारे में अतिरिक्त धर्मवैज्ञानिक भेद न जोड़ना
  choice: दुष्टात्माओं से ग्रस्त
  alternative: दुष्टात्माओं के वश में / दुष्टात्माग्रस्त
  rationale: चुना हुआ रूप कथा में वास्तविक दुष्टात्मिक पीड़ा को स्पष्ट करता है, लेकिन ‘अधिकार’, ‘उत्पीड़न’ या अन्य तकनीकी श्रेणियों के बीच ऐसा भेद नहीं करता जिसे यूनानी पद स्वयं निश्चित नहीं करता।
- issue: τὰ τῶν δαιμονιζομένων के संबंधसूचक वाक्यांश की अंतर्निहित व्यापकता
  choice: मुख्य पाठ में ‘उन पुरुषों के साथ क्या हुआ था’, साथ में अधिक शाब्दिक पादटिप्पणी
  alternative: और दुष्टात्माओं से ग्रस्त पुरुषों से संबंधित बातें भी
  rationale: प्रसंग घटना की सूचना देने का समर्थन करता है, पर यूनानी केवल ‘उनसे संबंधित बातें’ भी अर्थ दे सकता है। पादटिप्पणी इस वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सामान्य और गरिमापूर्ण रखी गई है। ‘भाग गए’, ‘नगर में जाकर’ और ‘सब कुछ बता दिया’ सहज कथात्मक हिन्दी हैं; ‘दुष्टात्माओं से ग्रस्त’ स्पष्ट है, पर अनावश्यक तकनीकी धर्मवैज्ञानिक शब्दावली से बचता है।
