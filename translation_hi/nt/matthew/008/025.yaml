  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: hi
  text: और वे उसके पास आए और उसे जगाकर बोले, “प्रभु, हमें बचाइए[a]! हम नाश हो रहे हैं!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमें छुड़ाइए।” यूनानी क्रिया σῶσον तत्काल खतरे से बचाने के साथ-साथ व्यापक अर्थ में उद्धार देने का भी अर्थ रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: पास आकर
  rationale: यह यीशु की ओर बढ़कर आने और फिर उसे जगाने का क्रम स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἤγειραν
  choice: जगाने लगे
  rationale: ἐγείρω यहाँ सोए हुए व्यक्ति को जगाने के ठोस अर्थ में है; प्रसंग में पुनरुत्थान या उठाने का अर्थ नहीं है।
- source_word: λέγοντες
  choice: कहने लगे
  rationale: यह उनके कथन का सीधा परिचय देता है और मूल से परे ‘चिल्लाकर’ जैसी भावात्मक तीव्रता नहीं जोड़ता।
- source_word: Κύριε
  choice: प्रभु
  rationale: यह κύριος के सम्मानसूचक और सम्भावित मसीही महत्व—दोनों को खुला रखता है; ‘गुरु’ अर्थ को अनावश्यक रूप से सीमित कर सकता है।
- source_word: σῶσον
  choice: हमें बचाइए
  rationale: यह तत्काल संकट से रक्षा की विनती को स्वाभाविक हिन्दी में व्यक्त करता है। ‘हमें’ यूनानी क्रिया में अलग से नहीं है, पर अगले बहुवचन कथन और प्रसंग में स्पष्ट रूप से निहित है।
- source_word: ἀπολλύμεθα
  choice: हम नाश हुए जा रहे हैं
  rationale: यह वर्तमानकालीन, आसन्न विनाश या मृत्यु की तीव्रता को बनाए रखता है और इसे केवल ‘मर रहे हैं’ तक सीमित नहीं करता।
theological_decisions:
- issue: यीशु के लिए सम्बोधन κύριος
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ सम्मानपूर्ण सम्बोधन और अधिक गहरे मसीही संकेत—दोनों की सम्भावना को सुरक्षित रखता है, बिना यह तय किए कि शिष्य उस क्षण इसे किस पूर्ण अर्थ में कह रहे थे।
- issue: σῶσον में निहित कर्म को स्पष्ट करना
  choice: हमें बचाइए
  alternative: बचाइए
  rationale: हिन्दी में ‘हमें’ कहना विनती को सहज और स्पष्ट बनाता है; इसका आधार अगले शब्द ἀπολλύμεθα का प्रथम पुरुष बहुवचन और पूरा प्रसंग है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। आदरसूचक सम्बोधन के अनुरूप ‘बचाइए’ रखा गया है। यूनानी वाक्य के क्रम और तात्कालिक संकट की तीव्रता को यथासम्भव बनाए रखा गया है।
