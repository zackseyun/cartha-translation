  verdict: revise
  source_fidelity: The draft correctly identifies the sequence of approaching Jesus, waking him, addressing him as प्रभु, and pleading for deliverance amid imminent ruin. However, जगाने लगे and कहने लगे introduce an inceptive/progressive nuance not carried by the Greek aorist ἤγειραν and participle λέγοντες. The revised wording renders the completed waking action and ensuing speech without this addition.
  naturalness: पास आकर उसे जगाने लगे और कहने लगे is understandable but somewhat repetitive and less idiomatic in this short urgent narrative. वे उसके पास आए और उसे जगाकर बोले is concise, natural modern Hindi. हम नाश हो रहे हैं better expresses the ongoing imminent peril than the awkward हम नाश हुए जा रहे हैं.
  terminology: प्रभु appropriately preserves the range of Κύριε. हमें बचाइए is a natural, faithful rendering of σῶσον with its contextually implicit plural object. The footnote remains useful for the immediate-rescue versus broader-salvation range.
  issues:
  - severity: medium
    issue: जगाने लगे / कहने लगे adds an inceptive-progressive sense.
    rationale: ἤγειραν is an aorist indicative ('they woke him'), while λέγοντες introduces their words. The Greek does not indicate that they merely began to wake him or began speaking.
  - severity: medium
    issue: हम नाश हुए जा रहे हैं is unnatural and aspectually imprecise.
    rationale: The phrase is not idiomatic modern standard Hindi for an immediate danger of perishing. हम नाश हो रहे हैं naturally conveys the present, urgent sense of ἀπολλύμεθα.
  - severity: low
    issue: The footnote marker is placed after the whole quotation rather than directly after बचाइए.
    rationale: The note concerns σῶσον ('save/rescue'), so its anchor should immediately follow the corresponding Hindi expression.
