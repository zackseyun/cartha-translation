source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: hi
  text: और देखो, एक कोढ़ से पीड़ित व्यक्ति उसके पास आया और उसके सामने दण्डवत किया[a] और उससे कहा, “प्रभु, यदि आप चाहें, तो मुझे शुद्ध कर सकते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी आराधना की।” यूनानी क्रिया का अर्थ संदर्भ के अनुसार आदर में दण्डवत करना, श्रद्धांजलि देना, या आराधना करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह कथात्मक संकेत पाठक का ध्यान अचानक सामने आए दृश्य की ओर खींचता है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसकी सजीवता बनाए रखता है।
- source_word: λεπρὸς
  choice: एक कोढ़ से पीड़ित व्यक्ति
  rationale: यह विशेषण संज्ञा के रूप में ऐसे व्यक्ति को दर्शाता है जिसे ‘कोढ़’ कही जाने वाली त्वचा की बीमारी थी। यह अभिव्यक्ति व्यक्ति को उसकी बीमारी तक सीमित किए बिना पारंपरिक रोग-संज्ञा को बनाए रखती है।
- source_word: προσελθὼν
  choice: उसके पास आया
  rationale: कृदन्त यीशु की ओर आने या निकट पहुँचने को व्यक्त करता है; ‘उसके पास आया’ हिन्दी कथन में स्पष्ट और स्वाभाविक है।
- source_word: προσεκύνει
  choice: उसके सामने दण्डवत करके
  rationale: क्रिया शारीरिक रूप से झुकने या भूमि पर गिरकर आदर प्रकट करने से लेकर आराधना तक अर्थ दे सकती है। ‘दण्डवत करके’ दृश्य की आदरपूर्ण शारीरिक मुद्रा को व्यक्त करता है, पर उसके पूर्ण धार्मिक आशय को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: Κύριε
  choice: प्रभु
  rationale: सम्बोधन में आदर और अधिकार दोनों निहित हैं तथा मसीही अर्थ की सम्भावना भी बनी रहती है; ‘प्रभु’ इस अर्थ-परास को सुरक्षित रखता है।
- source_word: ἐὰν θέλῃς
  choice: यदि आप चाहें
  rationale: यह यीशु की इच्छा पर रखी गई शर्त को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δύνασαί
  choice: कर सकते हैं
  rationale: यह सामर्थ्य या क्षमता को स्पष्ट करता है और हिन्दी में स्वाभाविक है।
- source_word: καθαρίσαι
  choice: मुझे शुद्ध कर सकते हैं
  rationale: यहाँ क्रिया केवल सामान्य चंगाई नहीं, बल्कि रोग से जुड़ी शारीरिक और धार्मिक अशुद्धता से शुद्ध किए जाने का भाव भी रखती है; ‘शुद्ध’ उस व्यापक अर्थ को बनाए रखता है।
theological_decisions:
- issue: यीशु के प्रति προσκυνέω का अर्थ
  choice: ‘उसके सामने दण्डवत करके’ के रूप में आदरपूर्ण शारीरिक क्रिया व्यक्त की गई।
  alternative: ‘उसकी आराधना करके’ या ‘उसके सामने घुटने टेककर’।
  rationale: यूनानी क्रिया सन्दर्भ के अनुसार दण्डवत प्रणाम, श्रद्धांजलि या आराधना बता सकती है। यहाँ गहरा आदर स्पष्ट है, पर मुख्य पाठ में ‘आराधना’ कहना उसके धार्मिक आशय को समय से पहले निश्चित कर देगा।
- issue: καθαρίσαι में चंगाई और शुद्धता
  choice: ‘मुझे शुद्ध कर सकते हैं’।
  alternative: ‘मुझे चंगा कर सकते हैं’।
  rationale: त्वचा-रोग के इस सन्दर्भ में शारीरिक स्वास्थ्य के साथ धार्मिक शुद्धता का आयाम भी है; ‘शुद्ध’ दोनों के बीच का तनाव सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, आदरपूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। यीशु को सम्बोधित करते समय ‘आप’ का प्रयोग किया गया है। ‘दण्डवत’ बाइबिलीय गरिमा और दृश्य की शारीरिक मुद्रा दोनों व्यक्त करता है।
