- source_word: οἱ δὲ
  choice: तब
  rationale: कथा की अगली प्रतिक्रिया को सहजता से जोड़ता है, बिना प्रबल विरोध का भाव जोड़े।
theological_decisions:
- issue: दुष्ट अलौकिक प्राणियों का निरूपण
  choice: दुष्टात्माएँ
  alternative: दुष्ट आत्माएँ / प्रेतात्माएँ
  rationale: पाठ उन्हें यीशु से बोलने और विनती करने वाले व्यक्तिगत बुरे आत्मिक प्राणियों के रूप में प्रस्तुत करता है। ‘दुष्टात्माएँ’ इस दावे को न तो अमूर्त बनाता है, न उसमें अतिरिक्त सांप्रदायिक व्याख्या जोड़ता है।
- issue: शर्त का स्वरूप
  choice: यदि तू हमें निकालता है
  alternative: जब तू हमें निकाले / क्योंकि तू हमें निकाल रहा है
  rationale: ग्रीक Εἰ को वास्तविकता की निश्चित घोषणा में बदले बिना उसकी शर्तात्मकता और संभावित अर्थ-तनाव बनाए रखा गया है।
