  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: hi
  text: और कहा, “प्रभु, मेरा सेवक[a] घर में लकवे से पड़ा है और भयंकर पीड़ा सह रहा है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा लड़का” अथवा “मेरा बालक”; यूनानी शब्द सेवक या बालक—दोनों के लिए प्रयुक्त हो सकता है, पर सूबेदार के प्रसंग में “सेवक” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शब्दशः: “बुरी तरह यातना सह रहा है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: और कहा
  rationale: यूनानी वर्तमान कृदंत कथन को पिछले पद की क्रिया से जोड़ता है। हिन्दी कथा-शैली में ‘और कहा’ इस संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: ‘प्रभु’ सम्मानसूचक संबोधन और अधिक गहरे धार्मिक आशय—दोनों की संभावना खुली रखता है; ‘श्रीमान’ अर्थ को केवल विनम्र संबोधन तक सीमित कर सकता है।
- source_word: ὁ παῖς μου
  choice: मेरा सेवक
  rationale: παῖς का अर्थ सेवक, लड़का या बालक हो सकता है। सूबेदार के प्रसंग और लूका 7 के समानांतर वृत्तांत में दास के उल्लेख के कारण ‘सेवक’ सबसे उपयुक्त है, जबकि मूल की अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: βέβληται ἐν τῇ οἰκίᾳ
  choice: घर में ... पड़ा है
  rationale: पूर्णकालिक कर्मवाच्य यहाँ उस परिणामी दशा को बताता है जिसमें सेवक घर में पड़ा हुआ है। यह हिन्दी में सहज है और ‘फेंका गया’ जैसे अनुपयुक्त शब्दशः अनुवाद से बचता है।
- source_word: παραλυτικός
  choice: लकवे से
  rationale: ‘लकवे से पड़ा है’ आधुनिक हिन्दी में स्वाभाविक रूप से पक्षाघातग्रस्त और बिस्तर पर पड़े होने की दशा व्यक्त करता है।
- source_word: δεινῶς βασανιζόμενος
  choice: भयंकर पीड़ा सह रहा है
  rationale: यह पदबंध तीव्र यातना, कष्ट या पीड़ा व्यक्त करता है। उपचार के प्रसंग में यह चयन सहज और बोधगम्य है, जबकि अधिक शब्दशः विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: यीशु के लिए Κύριε संबोधन का बल
  choice: प्रभु
  alternative: श्रीमान
  rationale: संबोधन केवल शिष्ट सम्मान भी हो सकता है और अधिक ऊँची पहचान भी जता सकता है। ‘प्रभु’ इस धर्मवैचारिक खुलेपन को बनाए रखता है और किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मुख्य पाठ में ‘लकवे से पड़ा है’ तथा ‘भयंकर पीड़ा’ जैसे प्रचलित पदबंध अपनाए गए हैं।
