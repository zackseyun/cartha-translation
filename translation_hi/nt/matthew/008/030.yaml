  text: ἦν δὲ μακρὰν ἀπ’ αὐτῶν ἀγέλη χοίρων πολλῶν βοσκομένη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/030.yaml
  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: hi
  text: उनसे कुछ दूरी पर[a] बहुत-से सूअरों का एक झुंड चर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनसे दूर।”
    reason: μακράν का अधिक सीधा अनुवाद ‘दूर’ भी हो सकता है; मुख्य पाठ का ‘कुछ दूरी पर’ स्वाभाविक हिन्दी में स्थानगत दूरी व्यक्त करता है।
lexical_decisions:
- source_word: ἦν δὲ
  choice: था
  rationale: ἦν अस्तित्व/स्थिति को व्यक्त करता है; हिन्दी वाक्य में ‘था’ इसे स्वाभाविक रूप से व्यक्त करता है। δέ का हल्का कथात्मक संयोजक बल प्रसंग से स्पष्ट है, इसलिए अलग से ‘अब’ या ‘और’ जोड़ना आवश्यक नहीं।
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: उनसे कुछ दूरी पर
  rationale: यह पदबंध स्थानगत दूरी बताता है। ‘कुछ दूरी पर’ आधुनिक हिन्दी में स्वाभाविक है और दूरी को अनावश्यक रूप से निश्चित नहीं करता; ‘उनसे’ αὐτῶν को बनाए रखता है।
- source_word: ἀγέλη
  choice: झुंड
  rationale: पशुओं के समूह के लिए ‘झुंड’ सामान्य और सहज हिन्दी शब्द है।
- source_word: χοίρων πολλῶν
  choice: बहुत-से सूअरों का
  rationale: πολλῶν का सीधा मात्रात्मक अर्थ ‘बहुत-से’ रखकर सूअरों की बड़ी संख्या स्पष्ट की गई है, बजाय केवल झुंड को ‘बड़ा’ कहने के।
- source_word: βοσκομένη
  choice: चर रहा था
  rationale: मध्य/निष्क्रिय रूप में यह कृदंत यहाँ पशुओं के भोजन करने या चरने की अवस्था बताता है। ‘चर रहा था’ हिन्दी में पशुओं के लिए स्वाभाविक है और किसी चरवाहे द्वारा चराए जाने का भाव नहीं जोड़ता।
