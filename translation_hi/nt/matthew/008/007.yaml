  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει ⸀αὐτῷ· Ἐγὼ ἐλθὼν θεραπεύσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: hi
  text: और वह उससे कहता है[a], “मैं आकर उसे चंगा करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या मैं आकर उसे चंगा करूँ?” कुछ व्याख्याकार प्रसंग के आधार पर यीशु के शब्दों को प्रश्न मानते हैं, पर यूनानी वाक्य-विन्यास को स्वाभाविक रूप से कथन के रूप में पढ़ा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य कथात्मक संयोजक है; ‘और’ मूल में निहित न होने वाला विशेष कालगत या परिणामसूचक भाव नहीं जोड़ता।
- source_word: λέγει
  choice: कहता है
  rationale: यूनानी का वर्तमानकालिक कथात्मक प्रयोग सुरक्षित रखा गया है; हिन्दी में भी यह प्रसंग को सजीव और स्वाभाविक रखता है।
- source_word: αὐτῷ
  choice: उससे
  rationale: λέγει के साथ दत्तिव को हिन्दी में स्वाभाविक रूप से ‘उससे’ व्यक्त किया गया है।
- source_word: Ἐγὼ
  choice: मैं
  rationale: स्पष्ट सर्वनाम में हल्का बल हो सकता है; हिन्दी का ‘मैं’ उसे बिना अनावश्यक अतिशयोक्ति के व्यक्त करता है।
- source_word: ἐλθὼν
  choice: आकर
  rationale: पूर्वकालिक एओरिस्ट कृदंत मुख्य क्रिया से पहले आने वाली संबद्ध क्रिया बताता है; ‘आकर’ हिन्दी में क्रम और निकट संबंध दोनों स्वाभाविक रूप से व्यक्त करता है।
- source_word: θεραπεύσω
  choice: चंगा करूँगा
  rationale: इस रोग-मुक्ति के प्रसंग में ‘चंगा करना’ सटीक, परिचित और गरिमापूर्ण बाइबलीय हिन्दी है।
- source_word: αὐτόν
  choice: उसे
  rationale: यह बीमार सेवक की ओर संकेत करने वाला सीधा कर्म है; ‘उसे’ स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: वाक्य को कथन माना जाए या प्रश्न
  choice: 'कथन: “मैं आकर उसे चंगा करूँगा।”'
  alternative: 'प्रश्न: “क्या मैं आकर उसे चंगा करूँ?”'
  rationale: यूनानी पाठ में प्रश्नवाचक अव्यय नहीं है और उसकी स्वाभाविक व्याकरणिक समझ कथन के रूप में होती है। फिर भी प्रसंग के आधार पर प्रश्नात्मक समझ संभव मानी गई है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली रखी गई है। ‘चंगा करूँगा’ सामान्य पाठक के लिए परिचित है और उपचार के धार्मिक-साहित्यिक प्रसंग के अनुकूल है।
