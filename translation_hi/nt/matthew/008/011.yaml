  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: hi
  text: पर मैं तुमसे कहता हूँ कि बहुत-से लोग पूरब और पश्चिम से[a] आएँगे और स्वर्ग के राज्य में अब्राहम, इसहाक और याकूब के साथ भोज की मेज़ पर बैठेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पूरब और पश्चिम से” दूर-दूर के क्षेत्रों से आने वाले लोगों की ओर संकेत करता है; इनमें इस्राएल के बाहर के लोग भी शामिल हो सकते हैं।
    reason: cross_reference
  - marker: b
    text: शाब्दिक रूप से, “टेक लगाकर बैठेंगे”; प्राचीन समय में लोग भोज की मेज़ पर इसी तरह स्थान ग्रहण करते थे।
    reason: cultural_note
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: पर मैं तुमसे कहता हूँ
  rationale: δέ यहाँ पिछले कथन के संबंध में हल्का विरोध या नया मोड़ दिखाता है; ‘पर’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त है; हिन्दी में ‘लोग’ जोड़ने से अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: पूरब और पश्चिम से
  rationale: बहुवचन रूप दिशाओं अथवा व्यापक क्षेत्रों के लिए मुहावरेदार हैं; यह अनुवाद भौगोलिक व्यापकता को बनाए रखता है।
- source_word: ἥξουσιν
  choice: आएँगे
  rationale: ἥκω का सामान्य अर्थ ‘आना/पहुँचना’ है; यहाँ ‘आएँगे’ सहज और संदर्भानुकूल है।
- source_word: ἀνακλιθήσονται
  choice: भोज में बैठेंगे
  rationale: क्रिया प्राचीन रीति के अनुसार भोजन के लिए टेक लगाकर बैठने को सूचित करती है। ‘भोज में बैठेंगे’ आधुनिक पाठक को भोजन-संगति का आशय स्पष्ट करता है, जबकि पाद-टिप्पणी मूल सांस्कृतिक चित्र बताती है।
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: अब्राहम, इसहाक और याकूब के साथ
  rationale: μετά संबंध और सहभागिता व्यक्त करता है; यहाँ कुलपिताओं के साथ भोज की संगति अभिप्रेत है।
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: स्वर्ग के राज्य में
  rationale: यह मत्ती का विशिष्ट पदबंध है; ‘स्वर्ग का राज्य’ हिन्दी में स्थापित, सटीक और स्वाभाविक अभिव्यक्ति है। विभक्ति के कारण यहाँ ‘स्वर्ग के राज्य में’ है।
theological_decisions:
- issue: भोज का बिंब और भावी राज्य की संगति
  choice: मुख्य पाठ में ‘भोज में बैठेंगे’ रखकर भोजन-संगति का बिंब बनाए रखा गया।
  alternative: ‘साथ बैठेंगे’ या शब्दशः ‘टेक लगाकर बैठेंगे’
  rationale: यह कथन केवल राज्य में उपस्थित होने की नहीं, अब्राहम, इसहाक और याकूब के साथ भोज-संगति की छवि प्रस्तुत करता है। आधुनिक हिन्दी में सांस्कृतिक क्रिया को शब्दशः रखने के बजाय अर्थ स्पष्ट किया गया है और शाब्दिक बिंब पाद-टिप्पणी में सुरक्षित है।
- issue: पूरब और पश्चिम से आने वाले ‘बहुत-से लोगों’ की पहचान
  choice: उनकी पहचान को मुख्य पाठ में केवल ‘बहुत-से लोग’ रहने दिया गया।
  alternative: ‘बहुत-से गैर-यहूदी’
  rationale: संदर्भ इस्राएल से बाहर के लोगों के समावेश की ओर संकेत करता है, पर यूनानी पाठ उन्हें स्पष्ट रूप से ‘गैर-यहूदी’ नहीं कहता। इसलिए निहितार्थ को व्याख्यात्मक रूप से मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘भोज में बैठेंगे’ प्राचीन भोजन-रीति को आधुनिक हिन्दी में बोधगम्य बनाता है; शाब्दिक सांस्कृतिक चित्र पाद-टिप्पणी में दिया गया है।
