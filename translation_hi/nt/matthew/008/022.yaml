reference: Matthew 8:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: hi
  text: पर यीशु उससे कहते हैं, “मेरे पीछे चलो, और मुरदों को अपने मुरदे दफ़नाने दो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पहले ‘मुरदों’ को प्रायः रूपकात्मक अर्थ में समझा जाता है: जो लोग आत्मिक रूप से संवेदनहीन हैं, वे शारीरिक रूप से मृत लोगों को दफ़नाएँ।'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले अनुरोध के प्रति यीशु के उत्तर में हल्का विरोध दर्शाता है; ‘पर’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λέγει
  choice: कहते हैं
  rationale: यूनानी का ऐतिहासिक वर्तमान कथा की सजीवता बनाए रखता है; हिन्दी में आदरसूचक बहुवचन के साथ ‘कहते हैं’ उपयुक्त है।
- source_word: Ἀκολούθει μοι
  choice: मेरे पीछे चलो
  rationale: यह शिष्यत्व का सीधा आदेश है और हिन्दी में शाब्दिक अनुसरण तथा प्रतिबद्ध शिष्यत्व—दोनों अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἄφες
  choice: करने दो
  rationale: θάψαι के साथ यह मुहावरेदार हिन्दी में किसी कार्य को उन्हीं पर छोड़ देने का भाव देता है, बिना अतिरिक्त व्याख्या जोड़े।
- source_word: νεκρούς ... νεκρούς
  choice: मुरदों ... मुरदे
  rationale: दोनों स्थानों पर एक ही शब्द रखकर मूल की जानबूझकर की गई पुनरुक्ति, शब्द-क्रीड़ा और अर्थगत तनाव सुरक्षित रहता है।
- source_word: θάψαι
  choice: दफ़नाने
  rationale: यह क्रिया मृत व्यक्ति को गाड़ने के अर्थ को स्पष्ट और सामान्य आधुनिक हिन्दी में व्यक्त करती है।
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: अपने मुरदे
  rationale: ‘अपने’ ἑαυτῶν के आत्मवाचक स्वामित्व और बल को सुरक्षित रखता है।
theological_decisions:
- issue: यीशु के कथन में ‘मुरदों’ का अर्थ
  choice: मुख्य पाठ में ‘मुरदों ... अपने मुरदे’ की समान शब्दावली बनाए रखी गई है।
  alternative: पहले ‘मुरदों’ को स्पष्टतः ‘आत्मिक रूप से मरे हुए लोग’ और दूसरे को शारीरिक रूप से मृत लोग कहना।
  rationale: मूल यूनानी दोनों जगह νεκρούς ही प्रयोग करता है। पहला प्रयोग सम्भवतः रूपकात्मक और दूसरा शाब्दिक है, पर मुख्य पाठ में इसे खोल देना मूल की शब्द-क्रीड़ा और धार्मिक तनाव को समय से पहले सुलझा देगा।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘मुरदा’ दोनों occurrences में स्वाभाविक संज्ञात्मक प्रयोग देता है और मूल की पुनरुक्ति बनाए रखता है; ‘मृतकों’ की अपेक्षा कथन की सीधी और चुभती हुई शक्ति अधिक सुरक्षित रहती है।
