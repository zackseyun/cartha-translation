  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: hi
  text: तब उसने उनसे कहा, “जाओ।” वे निकलकर सूअरों में चले गए। और देखो, पूरा झुंड खड़ी ढलान से[a] नीचे समुद्र में जा दौड़ा और पानी में मर गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कगार से नीचे।” यूनानी शब्द खड़ी ढलान, किनारे या कगार का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “पानी में डूबकर मर गया।” यूनानी में अधिक शाब्दिक रूप से “पानी में मर गया” है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: जाओ
  rationale: यह संक्षिप्त आज्ञा यीशु के कथन की सीधी और स्वाभाविक शक्ति बनाए रखती है।
- source_word: ἐξελθόντες
  choice: वे निकलकर
  rationale: कृदंत दुष्टात्माओं के मनुष्यों में से बाहर निकलने को दर्शाता है; हिन्दी में यह रूप अगली क्रिया से स्वाभाविक रूप से जुड़ता है।
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: सूअरों में जा घुसे
  rationale: संदर्भ में गति केवल सूअरों की ओर नहीं, उनके भीतर प्रवेश करने की है; ‘जा घुसे’ इसे स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ἰδοὺ
  choice: और देखो
  rationale: यह कथावाचक संकेत आगामी आकस्मिक घटना की ओर ध्यान खींचता है; इसे हटाने के बजाय उसकी जीवंतता सुरक्षित रखी गई है।
- source_word: πᾶσα ἡ ἀγέλη
  choice: पूरा झुंड
  rationale: यह सामूहिक संज्ञा और πᾶσα की समग्रता का स्वाभाविक हिन्दी रूप है।
- source_word: ὥρμησεν
  choice: जा दौड़ा
  rationale: क्रिया अचानक और प्रबल गति बताती है; ‘जा दौड़ा’ झुंड के तेज़ी से नीचे समुद्र में जाने को सहज ढंग से व्यक्त करता है।
- source_word: κατὰ τοῦ κρημνοῦ
  choice: खड़ी ढलान से नीचे
  rationale: κρημνός खड़ी ढलान, किनारा या कगार का बोध दे सकता है; मुख्य पाठ में ऐसा रूप चुना गया है जो किसी अनिवार्यतः सीधी चट्टान का अर्थ नहीं जोड़ता।
- source_word: τὴν θάλασσαν
  choice: समुद्र
  rationale: मूल शब्द θάλασσα का सीधा अर्थ ‘समुद्र’ है; भौगोलिक व्याख्या के आधार पर इसे ‘झील’ नहीं बनाया गया।
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: पानी में मर गया
  rationale: यूनानी पाठ शाब्दिक रूप से पानी में मरने की बात कहता है; ‘डूबकर मर गया’ संदर्भसंगत निष्कर्ष है, पर मुख्य पाठ में अतिरिक्त विशिष्टता नहीं जोड़ी गई।
theological_decisions:
- issue: झुंड की मृत्यु का वर्णन कितना विशिष्ट हो
  choice: पानी में मर गया
  alternative: पानी में डूबकर मर गया
  rationale: वृत्तांत में डूबना प्रबल रूप से निहित है, फिर भी मूल क्रिया केवल ‘मरना’ कहती है। मुख्य पाठ स्रोत की अभिव्यक्ति और उसकी व्याख्यात्मक खुली जगह को बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। छोटे वाक्यों और ‘और देखो’ से मूल वृत्तांत की गति तथा जीवंतता बनाए रखी गई है। ‘सूअर’ सामान्य वर्तमान शब्द है; ‘शूकर’ जैसे अधिक साहित्यिक विकल्प से बचा गया है।
