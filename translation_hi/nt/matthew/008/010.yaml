source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: hi
  text: यह सुनकर यीशु अचंभित हुए और जो उनके पीछे चल रहे थे, उनसे कहा, “मैं तुमसे सच कहता हूँ, इस्राएल में मैंने किसी में भी ऐसा विश्वास[a] नहीं पाया।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इतना बड़ा विश्वास।”
    reason: lexical_alternative
  - marker: b
    text: या, “मैंने इस्राएल में किसी में भी ऐसा विश्वास नहीं पाया।”
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: यह सुनकर
  rationale: कालवाचक कृदंत को स्वाभाविक हिन्दी उपवाक्य के रूप में व्यक्त किया गया है। ‘यह’ पिछले प्रसंग में सूबेदार की कही बातों की ओर संकेत करता है।
- source_word: ἐθαύμασεν
  choice: अचंभा हुआ
  rationale: यह यीशु की प्रबल विस्मय-प्रतिक्रिया को सहज और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है; इसका आशय अज्ञान या भूल नहीं है।
- source_word: τοῖς ἀκολουθοῦσιν
  choice: अपने पीछे आनेवालों से
  rationale: वर्तमान कृदंत उस समय यीशु के साथ पीछे चल रहे लोगों को दर्शाता है; यह उन्हें औपचारिक रूप से किसी विशिष्ट वर्ग का नाम दिए बिना मूल अर्थ बनाए रखता है।
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यह यीशु की गंभीर और बलयुक्त उद्घोषणा का स्वाभाविक हिन्दी रूप है।
- source_word: παρ’ οὐδενὶ
  choice: किसी में भी ... नहीं
  rationale: παρά और संबंधकारक यहाँ किसी व्यक्ति के मामले में या उसमें कुछ पाए जाने का भाव देते हैं। हिन्दी में यह रचना विश्वास के व्यक्ति में पाए जाने को स्पष्ट और सहज रूप से व्यक्त करती है।
- source_word: τοσαύτην πίστιν
  choice: ऐसा विश्वास
  rationale: τοσαύτην विश्वास की असाधारण मात्रा या गुणवत्ता पर बल देता है। ‘ऐसा विश्वास’ स्वाभाविक हिन्दी है; अधिक स्पष्ट मात्रात्मक रूप ‘इतना बड़ा विश्वास’ पादटिप्पणी में रखा गया है।
- source_word: ἐν τῷ Ἰσραὴλ
  choice: इस्राएल में
  rationale: यह सीधा स्थानिक-सामुदायिक रूप है और इस्राएल के लोगों के बीच खोजे जाने का भाव बनाए रखता है।
- source_word: εὗρον
  choice: मैंने ... नहीं पाया
  rationale: यूनानी एओरिस्ट को हिन्दी के सामान्य पूर्ण भूतकाल से सीधा और स्वाभाविक रूप मिला है।
theological_decisions:
- issue: πίστις का अनुवाद
  choice: विश्वास
  alternative: भरोसा
  rationale: इस प्रसंग में सूबेदार का यीशु के अधिकार पर भरोसा अभिप्रेत है। ‘विश्वास’ πίστις का व्यापक और प्रचलित हिन्दी रूप है, जबकि ‘भरोसा’ उसकी एक प्रसंगगत छाया को अधिक संकीर्ण ढंग से व्यक्त करता है।
- issue: यीशु के अचंभे का वर्णन
  choice: यीशु को अचंभा हुआ
  alternative: यीशु चकित हुए
  rationale: मूल पाठ की कथात्मक प्रतिक्रिया को बिना किसी दार्शनिक या मसीह-विज्ञान संबंधी अतिरिक्त व्याख्या के रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपने पीछे आनेवाले’ तत्काल साथ चल रहे लोगों को सूचित करता है, और ‘सच कहता हूँ’ Ἀμήν-वाक्य की गंभीरता को सामान्य पाठक के लिए स्पष्ट रखता है।
