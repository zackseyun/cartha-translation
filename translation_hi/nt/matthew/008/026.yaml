source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: hi
  text: उसने उनसे कहा, “तुम क्यों भयभीत हो, अल्प विश्वास वालो?” तब वह उठकर हवाओं और समुद्र को डाँटा, और बड़ी शांति हो गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: भयभीत
  rationale: यह शब्द परिस्थिति में डर से दब जाने या साहस खो देने का भाव रखता है; ‘भयभीत’ आधुनिक और स्वाभाविक हिन्दी में इसे स्पष्ट करता है।
- source_word: ὀλιγόπιστοι
  choice: अल्पविश्वासियो
  rationale: सम्बोधन के रूप में आया यह शब्द विश्वास के पूर्ण अभाव के बजाय विश्वास की कमी को दर्शाता है; संक्षिप्त पारंपरिक पद मूल अर्थ को सुरक्षित रखता है।
- source_word: ἐπετίμησεν
  choice: डाँटा
  rationale: यहाँ हवाओं और झील को अधिकारपूर्वक रोकने की कठोर आज्ञा का भाव है; ‘डाँटा’ सरल और सजीव हिन्दी है।
- source_word: θάλασσα
  choice: झील
  rationale: इस प्रसंग में यह गलील की झील को सूचित करता है; हिन्दी पाठक के लिए भौगोलिक संदर्भ के अनुसार ‘झील’ स्वाभाविक है, यद्यपि यूनानी शब्द सामान्यतः ‘समुद्र’ भी हो सकता है।
- source_word: γαλήνη μεγάλη
  choice: पूरी तरह शांति
  rationale: शाब्दिक ‘बड़ी शांति’ की अपेक्षा यह हिन्दी में परिणाम की प्रबलता—एकदम शांत हो जाना—को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ὀλιγόπιστοι में विश्वास की मात्रा या अनुपस्थिति
  choice: अल्पविश्वासियो
  alternative: अविश्वासियो
  rationale: मूल शब्द ‘कम विश्वास वाले’ कहता है, न कि अनिवार्य रूप से ‘विश्वासरहित’; इसलिए शिष्यों के विश्वास की कमी का तनाव बनाए रखा गया है।
- issue: हवाओं और जलराशि पर यीशु की फटकार
  choice: हवाओं और झील को डाँटा
  alternative: हवाओं और झील को आज्ञा दी
  rationale: ‘डाँटा’ ἐπετίμησεν की कठोरता और अधिकार को बनाए रखता है, बिना इसके पीछे किसी विशिष्ट दुष्ट शक्ति की व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पाठ में सहज है। सम्बोधन ‘हे अल्पविश्वासियो’ मूल की सीधी तीव्रता बनाए रखता है।
