source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: hi
  text: तब यीशु ने सूबेदार से कहा, “जा; जैसा तूने विश्वास किया है, वैसा ही तेरे लिए हो।” और उसी घड़ी उसका सेवक[a] चंगा हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लड़का” अथवा “बालक”; यूनानी शब्द παῖς किसी सेवक या कम आयु के व्यक्ति के लिए प्रयुक्त हो सकता है। इस प्रसंग में “सेवक” सूबेदार के अधीनस्थ व्यक्ति के लिए सबसे उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: सूबेदार
  rationale: रोमी सेना में लगभग सौ सैनिकों के अधिकारी के लिए प्रचलित और सामान्य हिन्दी बाइबलीय पद; आधुनिक पाठक के लिए सहज, यद्यपि यह भारतीय सैन्य पद से शब्दशः समान नहीं है।
- source_word: Ὕπαγε
  choice: जा
  rationale: प्रस्थान की आज्ञा को संक्षिप्त और सीधे रूप में व्यक्त करता है तथा एकवचन संबोधन के अनुरूप है।
- source_word: ὡς ἐπίστευσας
  choice: जैसा तूने विश्वास किया है
  rationale: विश्वास करने की व्यक्तिगत क्रिया को संज्ञात्मक परिभाषा ‘तेरे विश्वास के अनुसार’ में बदले बिना सुरक्षित रखता है।
- source_word: γενηθήτω σοι
  choice: वैसा ही तेरे लिए हो
  rationale: युसीव/आज्ञार्थक भाव और σοι के हितार्थ अर्थ को स्वाभाविक हिन्दी में बनाए रखता है; ‘किया जाए’ जोड़कर अनिर्दिष्ट कर्ता को अधिक स्पष्ट नहीं करता।
- source_word: παῖς
  choice: सेवक
  rationale: निकटवर्ती प्रसंग में यह सूबेदार के अधीनस्थ व्यक्ति को सूचित करता है और समानांतर प्रसंगीय भाषा से मेल खाता है; ‘लड़का’ अथवा ‘बालक’ की वास्तविक शब्दार्थ-संभावना पादटिप्पणी में रखी गई है।
- source_word: ἰάθη
  choice: चंगा हो गया
  rationale: ἰάομαι के निष्क्रिय रूप से व्यक्त आरोग्य-प्राप्ति का मानक, स्वाभाविक हिन्दी अनुवाद।
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: उसी घड़ी
  rationale: मूल समय-सूचक अभिव्यक्ति को रखते हुए प्रसंग की तत्क्षणता व्यक्त करता है, पर उसे ‘उसी क्षण’ कहकर अनावश्यक रूप से अधिक सटीक नहीं बनाता।
theological_decisions:
- issue: πιστεύω की अभिव्यक्ति
  choice: विश्वास किया है
  alternative: भरोसा किया / विश्वास के अनुसार
  rationale: क्रियात्मक और व्यक्तिगत रूप को बनाए रखता है तथा विश्वास को केवल मानसिक स्वीकृति या अमूर्त गुण के रूप में परिभाषित नहीं करता।
- issue: γενηθήτω में परिणाम और दैवी कार्य
  choice: वैसा ही तेरे लिए हो
  alternative: तेरे लिए वैसा ही किया जाए
  rationale: मूल निष्क्रिय आज्ञार्थक की खुली अभिव्यक्ति को सुरक्षित रखता है और कार्य करने वाले का नाम जोड़कर निहितार्थ को सिद्धांतगत रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। संवाद में एकवचन ‘तू/तेरे’ मूल यूनानी के एकवचन प्रत्यक्ष संबोधन और पारंपरिक बाइबलीय गरिमा को रखता है। मुख्य पाठ में हर पादटिप्पणी-चिह्न सम्मिलित है।
