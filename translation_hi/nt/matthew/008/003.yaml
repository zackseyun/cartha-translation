id: MAT.8.3
reference: Matthew 8:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: hi
  text: उसने हाथ बढ़ाकर उसे छुआ और कहा, “मैं चाहता हूँ; शुद्ध हो जा।” और वह तुरंत अपने कोढ़[a] से शुद्ध हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द λέπρα कई गंभीर चर्मरोगों के लिए प्रयुक्त हो सकता था; इसका अर्थ केवल आधुनिक हैन्सन रोग ही नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: हाथ बढ़ाकर
  rationale: यह पूर्ववर्ती सहायक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और शारीरिक संकेत को स्पष्ट बनाए रखता है।
- source_word: ἥψατο αὐτοῦ
  choice: उसे छुआ
  rationale: ἅπτομαι के साथ संबंधकारक का यहाँ सामान्य अर्थ ‘छूना’ है।
- source_word: Θέλω
  choice: मैं चाहता हूँ
  rationale: यह रोगी द्वारा यीशु की इच्छा के विषय में किए गए निवेदन का सीधा उत्तर है और यूनानी क्रिया की इच्छासूचक शक्ति को बनाए रखता है।
- source_word: καθαρίσθητι
  choice: शुद्ध हो जा
  rationale: यह निष्क्रिय आज्ञार्थक का संक्षिप्त, स्वाभाविक रूप है और शारीरिक चंगाई के साथ शुद्धता का आयाम भी बनाए रखता है।
- source_word: εὐθέως
  choice: तुरंत
  rationale: यह परिणाम की तात्कालिकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκαθαρίσθη αὐτοῦ ἡ λέπρα
  choice: वह तुरंत अपने कोढ़ से शुद्ध हो गया
  rationale: यूनानी में ‘उसका कोढ़’ व्याकरणिक कर्ता है, पर ‘कोढ़ शुद्ध हो गया’ आधुनिक हिन्दी में अस्वाभाविक है। व्यक्ति को कोढ़ से शुद्ध बताए जाने से अर्थ और καθαρίζω की शुद्धता-संबंधी भाषा दोनों सुरक्षित रहते हैं।
- source_word: ἡ λέπρα
  choice: कोढ़
  rationale: यह परिचित बाइबलीय शब्द है; पादटिप्पणी स्पष्ट करती है कि यूनानी रोग-श्रेणी आधुनिक हैन्सन रोग से अधिक व्यापक हो सकती है।
theological_decisions:
- issue: καθαρίζω में शुद्धता और चंगाई का संबंध
  choice: आज्ञा और परिणाम दोनों में ‘शुद्ध’ की भाषा
  alternative: ‘चंगा हो जा’ और ‘चंगा हो गया’
  rationale: यूनानी पाठ केवल रोगमुक्ति नहीं, बल्कि अशुद्धता से शुद्ध किए जाने का आयाम भी व्यक्त करता है; केवल ‘चंगा’ कहना इस तनाव को कम कर देता।
- issue: Θέλω का अर्थ
  choice: मैं चाहता हूँ
  alternative: मैं तैयार हूँ
  rationale: यह पहले व्यक्त प्रश्न—क्या यीशु ऐसा करना चाहता है—का सीधा उत्तर देता है और इसे भविष्यकालीन कथन नहीं बनाता।
- issue: अंतिम उपवाक्य का व्याकरणिक रूप
  choice: व्यक्ति को कोढ़ से शुद्ध हुआ बताना
  alternative: ‘उसका कोढ़ शुद्ध हो गया’
  rationale: वैकल्पिक रूप यूनानी वाक्य-विन्यास के अधिक निकट है, पर हिन्दी में रोग के ‘शुद्ध’ होने की बात अस्वाभाविक लगती है। चुना हुआ रूप आशय को बिना केवल ‘चंगा’ कहे स्वाभाविक बनाता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘शुद्ध हो जा’ शारीरिक उपचार और धार्मिक शुद्धता दोनों को सुनाई देता है। सर्वनाम मूल पाठ के अनुरूप रखे गए हैं; प्रसंग से बोलने वाला यीशु स्पष्ट है।
