  text: When he entered Capernaum[a], a centurion came to him, pleading with him[b],
translation:
  language: hi
  text: यीशु के कफरनहूम में प्रवेश करने पर, एक सूबेदार उनके पास आया और उनसे विनती कर रहा था,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: जब यीशु ... प्रवेश कर चुके
  rationale: सम्बन्धकारक निरपेक्ष रचना और अओरिस्ट कृदन्त को स्वाभाविक हिन्दी कालवाचक उपवाक्य में व्यक्त किया गया है। सन्दर्भ से सर्वनाम यीशु को सूचित करता है; ‘कर चुके’ प्रवेश के बाद सूबेदार के आने का क्रम दिखाता है, बिना अनावश्यक समय-अन्तर जोड़े।
- source_word: εἰς Καφαρναοὺμ
  choice: कफरनहूम में
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यन्तरण लिया गया है; ‘प्रवेश करना’ के साथ ‘में’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: προσῆλθεν αὐτῷ
  choice: उनके पास आया
  rationale: यह προσέρχομαι के ‘पास आना/निकट आना’ अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἑκατόνταρχος
  choice: सूबेदार
  rationale: यह सौ सैनिकों पर नियुक्त रोमी अधिकारी के पद को हिन्दी बाइबलीय प्रयोग में संक्षेप और सहज रूप से व्यक्त करता है; केवल ‘अधिकारी’ कहने से पद की विशिष्टता घट जाती।
- source_word: παρακαλῶν αὐτὸν
  choice: उनसे विनती करने लगा
  rationale: कृदन्त को मुख्य क्रिया के साथ चलने वाली सविनय और आग्रहपूर्ण प्रार्थना के रूप में व्यक्त किया गया है। ‘विनती’ आग्रह बनाए रखती है, पर ‘गिड़गिड़ाना’ जैसी अधिक तीव्र भाव-भंगिमा नहीं जोड़ती।
