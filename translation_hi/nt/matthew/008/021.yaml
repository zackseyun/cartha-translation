source:
  edition: SBLGNT
  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: hi
  text: तब एक और चेले ने उससे कहा, “प्रभु, मुझे पहले जाकर अपने पिता को दफनाने की अनुमति दें[a][b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे जाने दें।”
    reason: lexical_alternative
  - marker: b
    text: यह अनुरोध तत्काल दफनाने के लिए भी हो सकता है, या अधिक व्यापक अर्थ में पिता की मृत्यु तक पुत्रधर्म निभाने के लिए; यूनानी पाठ यह स्पष्ट नहीं करता।
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ τῶν μαθητῶν
  choice: तब चेलों में से एक और
  rationale: ἕτερος वक्ता को पहले व्यक्ति से अलग एक अतिरिक्त व्यक्ति के रूप में प्रस्तुत करता है; δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है। यह हिंदी रूप दोनों बातों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: सीधे संबोधन में κύριε आदर को व्यक्त करता है और उसके संभावित धर्मवैज्ञानिक महत्व को भी खुला रखता है।
- source_word: ἐπίτρεψόν μοι
  choice: मुझे … अनुमति दें
  rationale: यह अनुमति माँगने वाला विनम्र आग्रह है। ‘अनुमति दें’ आधुनिक मानक हिंदी में सम्मानपूर्ण और स्पष्ट है।
- source_word: πρῶτον ἀπελθεῖν
  choice: पहले जाकर
  rationale: πρῶτον क्रम में प्राथमिकता बताता है और ἀπελθεῖν वर्तमान स्थान से जाने का भाव रखता है; ‘पहले जाकर’ हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: θάψαι τὸν πατέρα μου
  choice: अपने पिता को दफनाने
  rationale: यह यूनानी वाक्यांश का सीधा अर्थ रखता है। कर्ता के पिता के लिए हिंदी में ‘अपने पिता’ अधिक स्वाभाविक है।
theological_decisions:
- issue: पिता को दफनाने के अनुरोध का समय और आशय
  choice: मुख्य पाठ में अनुरोध को सीधे अनूदित किया गया है और यह तय नहीं किया गया कि पिता अभी-अभी मरे थे या पुत्र भविष्य तक पारिवारिक कर्तव्य निभाने की बात कर रहा था।
  alternative: इसे या तो तत्काल अंतिम संस्कार का अनुरोध, या पिता की मृत्यु तक घर पर रहने की व्यापक पुत्रधर्म-संबंधी इच्छा समझना।
  rationale: यूनानी पाठ केवल जाने और पिता को दफनाने की अनुमति माँगता है; वह समय या परिस्थिति स्पष्ट नहीं करता। इसलिए अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चेलों’ सामान्य पाठकों के लिए परिचित है; ‘प्रभु’ संबोधन के आदर और संभावित धर्मवैज्ञानिक गहराई, दोनों को बनाए रखता है। दोनों पादटिप्पणी-चिह्न संबंधित अनुरोध के बाद रखे गए हैं।
