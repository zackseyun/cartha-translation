  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: hi
  text: जब यीशु पतरस के घर आए, तो उन्होंने पतरस की सास को लेटी हुई और बुखार से ग्रस्त देखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: जब यीशु ... आए
  rationale: कालवाचक एओरिस्ट कृदंत को स्वाभाविक हिन्दी में व्यक्त करता है और घटनाक्रम बनाए रखता है।
- source_word: οἰκίαν Πέτρου
  choice: पतरस के घर
  rationale: सम्बन्धकारक स्वामित्व को स्पष्ट और सहज हिन्दी में व्यक्त करता है; οἰκία के लिए ‘घर’ उपयुक्त है।
- source_word: πενθερὰν αὐτοῦ
  choice: उसकी सास
  rationale: πενθερά का सीधा अर्थ ‘सास’ है; निकटवर्ती पतरस के कारण ‘उसकी’ का संकेत उसी की ओर है।
- source_word: βεβλημένην
  choice: लेटे हुए
  rationale: पूर्ण निष्क्रिय कृदंत यहाँ बीमारी के कारण पड़ी/लेटी हुई अवस्था बताता है। ‘बिस्तर पर’ प्रसंग से सम्भव है, पर यूनानी में स्पष्ट नहीं।
- source_word: πυρέσσουσαν
  choice: बुखार में
  rationale: वर्तमान कृदंत उसकी जारी ज्वरग्रस्त अवस्था बताता है; यह आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: εἶδεν
  choice: पाया
  rationale: शाब्दिक अर्थ ‘देखा’ है, पर इस रचना में ‘लेटे हुए और बुखार में पाया’ हिन्दी में स्वाभाविक रूप से देखने पर ज्ञात अवस्था व्यक्त करता है।
theological_decisions:
- issue: αὐτοῦ (‘उसकी’) का सम्बन्ध
  choice: सर्वनाम पतरस की ओर संकेत करता है; स्त्री पतरस की सास है।
  alternative: हिन्दी में इसे यीशु की ओर संकेत करने वाला समझे जाने से बचाने के लिए ‘पतरस की सास’ दोहराया जा सकता है।
  rationale: वाक्य-विन्यास और प्रसंग में निकटवर्ती पतरस ही सर्वनाम का स्वाभाविक पूर्वपद है। ‘उसकी’ मूल की सर्वनामिक बनावट रखता है, जबकि अर्थ प्रसंग से स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। यीशु के लिए आदरसूचक बहुवचन (‘आए’, ‘उन्होंने’) रखा गया है। मूल में निहित न होने के कारण ‘बिस्तर पर’ नहीं जोड़ा गया।
