source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: hi
  text: जब वह झील के उस पार गदरेनियों[a] के प्रदेश में पहुँचा, तो कब्रों से निकलते हुए दो दुष्टात्मा-ग्रस्त मनुष्य उसे मिले। वे बहुत ही उग्र थे, यहाँ तक कि कोई भी उस रास्ते से होकर गुजर नहीं सकता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन हस्तलिपियों में “गदरेनियों” के स्थान पर “गेर्गेसेनियों” या “गेरासेनियों” है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: जब वह ... पहुँचा
  rationale: संबंधकारक स्वतंत्र रचना को स्वाभाविक हिन्दी कालवाचक उपवाक्य के रूप में रखा गया है।
- source_word: τὸ πέραν
  choice: झील के उस पार
  rationale: प्रसंग में विपरीत तट अभिप्रेत है; हिन्दी में संदर्भ स्पष्ट करने के लिए 'झील' जोड़ा गया है।
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: गदरेनियों के प्रदेश
  rationale: χώρα के भौगोलिक अर्थ के लिए 'प्रदेश' स्वाभाविक है और मुद्रित यूनानी पाठ Γαδαρηνῶν का लिप्यंतरण रखा गया है।
- source_word: δύο δαιμονιζόμενοι
  choice: दो दुष्टात्मा-ग्रस्त मनुष्य
  rationale: यह पद दुष्टात्मिक अधीनता को व्यक्त करता है; 'दुष्टात्मा-ग्रस्त' आधुनिक हिन्दी में स्पष्ट है और पुरुषवाचक बहुवचन संदर्भ को 'मनुष्य' से व्यक्त किया गया है।
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: कब्रों से निकलते हुए
  rationale: μνημεῖον यहाँ दफनाने की जगह को दर्शाता है; 'कब्र' सामान्य और सुबोध हिन्दी है।
- source_word: χαλεποὶ λίαν
  choice: इतने अत्यन्त उग्र
  rationale: χαλεπός की उग्र, भयंकर अथवा खतरनाक होने की अर्थ-सीमा को अनावश्यक रूप से केवल शारीरिक हिंसा तक सीमित नहीं किया गया; λίαν और परिणामसूचक ὥστε दोनों का बल बनाए रखा गया है।
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης
  choice: कि कोई भी उस रास्ते से निकल नहीं सकता था
  rationale: ἰσχύω को यहाँ सामर्थ्य के सामान्य अर्थ में और διά के मार्गवाचक भाव को 'उस रास्ते से' द्वारा सहज हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: दुष्टात्मिक प्रभाव का वर्णन
  choice: दुष्टात्मा-ग्रस्त
  alternative: दुष्टात्माओं के वश में
  rationale: मुख्य पाठ का पद व्यक्तिगत दुष्टात्मिक सत्ता और अधीनता को स्पष्ट रखता है, पर यूनानी कृदंत से आगे कोई तकनीकी सिद्धान्त नहीं जोड़ता।
- issue: स्थाननाम की पाठांतर परंपरा
  choice: गदरेनी
  alternative: गिरगसेनी अथवा गिरासेनी
  rationale: मुख्य पाठ SBLGNT के Γαδαρηνῶν का अनुसरण करता है; अन्य प्राचीन पाठ-रूप पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है; मूल के कालक्रम और परिणाम-संबंध को सुरक्षित रखा गया है।
