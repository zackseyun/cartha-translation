  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: hi
  text: तब वे पुरुष चकित हुए और कहने लगे, “यह कैसा मनुष्य है कि हवाएँ और समुद्र भी उसकी आज्ञा मानते हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: तब वे लोग
  rationale: संदर्भ में नाव पर उपस्थित पुरुष शिष्य अभिप्रेत हैं; हिन्दी में ‘वे लोग’ स्वाभाविक है और ‘मनुष्य’ के सामान्य मानवजातीय अर्थ से बचाता है। δέ को कथात्मक संक्रमण के रूप में ‘तब’ से व्यक्त किया गया है।
- source_word: ἐθαύμασαν
  choice: चकित होकर
  rationale: क्रिया आश्चर्य और विस्मय की तीव्र प्रतिक्रिया बताती है। ‘चकित’ आधुनिक, सहज और गरिमापूर्ण हिन्दी है।
- source_word: λέγοντες
  choice: कहने लगे
  rationale: ग्रीक कृदंत को स्वाभाविक हिन्दी कथन-शैली में मुख्य प्रतिक्रिया से जोड़ता है।
- source_word: Ποταπός ἐστιν οὗτος
  choice: यह कैसा मनुष्य है
  rationale: ποταπός व्यक्ति के प्रकार या गुण के विषय में विस्मयपूर्ण प्रश्न करता है। ‘कैसा मनुष्य’ उस अर्थ को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ὅτι
  choice: कि
  rationale: यहाँ ὅτι विस्मयपूर्ण प्रश्न के आधार अथवा व्याख्यात्मक आशय को प्रस्तुत करता है; हिन्दी में ‘कि’ यही संबंध स्वाभाविक रूप से दिखाता है।
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: आँधियाँ और समुद्र भी
  rationale: ‘भी’ दोहराए गए καί के बल को स्वाभाविक हिन्दी में उभारता है। बहुवचन ἄνεμοι के लिए प्रसंगानुकूल ‘आँधियाँ’ तूफ़ानी हवाओं का भाव देता है।
- source_word: αὐτῷ ὑπακούουσιν
  choice: इसकी आज्ञा मानते हैं
  rationale: ὑπακούω अधीन होकर मानने का अर्थ देता है। ‘आज्ञा मानते हैं’ प्राकृतिक शक्तियों पर व्यक्तिगत अधिकार को स्पष्ट और सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: शिष्यों के प्रश्न का मसीह-संबंधी बल
  choice: प्रश्न को बिना व्याख्यात्मक विस्तार के सीधे रखा गया है, जबकि सृष्टि पर यीशु के अधिकार का निहितार्थ सुरक्षित है।
  alternative: ‘यह आखिर कौन हो सकता है?’ जैसे शब्द जोड़कर मसीह-संबंधी संकेत को अधिक स्पष्ट करना।
  rationale: मूल पाठ असाधारण अधिकार के कारण पहचान का प्रश्न उठाता है, पर स्वयं कोई स्पष्ट सिद्धान्तगत निष्कर्ष नहीं जोड़ता। अनुवाद उसी कथात्मक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज कथात्मक शैली और गरिमापूर्ण शब्दावली। ‘यह कैसा मनुष्य है’ मूल के गुण/प्रकार संबंधी प्रश्न को सामान्य पाठक के लिए स्वाभाविक रूप में रखता है।
