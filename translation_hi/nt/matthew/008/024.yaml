  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: hi
  text: और देखो[a], समुद्र में एक प्रचंड तूफ़ान उठा, यहाँ तक कि नाव लहरों से ढकी जा रही थी[b]; पर वह सो रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यह ध्यान आकर्षित करने वाला कथात्मक संकेत है; शाब्दिक रूप से, ‘देखो’ या ‘लो।’
    reason: discourse_marker
  - marker: b
    text: अर्थात लहरें नाव को ढकती जा रही थीं; संदर्भानुसार, ‘नाव लहरों से भरती जा रही थी’ भी अनुवाद हो सकता है।
