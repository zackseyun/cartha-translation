lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान खींचने वाले जीवंत कथात्मक संकेत को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: σεισμὸς μέγας
  choice: एक भयंकर तूफ़ान
  rationale: σεισμός का मूल भाव तीव्र हिलना या कंपन है, पर समुद्र, नाव और लहरों के इस संदर्भ में यह समुद्र के प्रचंड विक्षोभ अर्थात तूफ़ान को दर्शाता है। ‘भयंकर’ μέγας की तीव्रता और संकट को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐγένετο
  choice: उठा
  rationale: मौसम संबंधी घटना के आरम्भ के लिए ‘तूफ़ान उठा’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: ἐν τῇ θαλάσσῃ
  choice: समुद्र में
  rationale: यद्यपि भौगोलिक रूप से जलाशय झील है, यूनानी पाठ θάλασσα अर्थात ‘समुद्र’ कहता है; इसलिए स्रोत की शब्दावली सुरक्षित रखी गई है।
- source_word: ὥστε
  choice: यहाँ तक कि
  rationale: यह तूफ़ान की तीव्रता से उत्पन्न परिणाम का स्वाभाविक और स्पष्ट परिचय देता है।
- source_word: τὸ πλοῖον
  choice: नाव
  rationale: गलील के समुद्र के कथात्मक संदर्भ में πλοῖον के लिए ‘नाव’ आधुनिक हिन्दी में ‘जहाज़’ से अधिक उपयुक्त है।
- source_word: καλύπτεσθαι
  choice: ढकी जा रही थी
  rationale: वर्तमानकालिक निष्क्रिय infinitive लहरों द्वारा नाव को लगातार ढके जाने की प्रक्रिया बताता है; यह अनुवाद उस चित्र और अपूर्ण पक्ष को सीधे सुरक्षित रखता है।
- source_word: ὑπὸ τῶν κυμάτων
  choice: लहरों से
  rationale: निष्क्रिय रचना में ὑπό लहरों को उस माध्यम या कारक के रूप में प्रस्तुत करता है जिससे नाव ढकी जा रही थी।
- source_word: αὐτὸς δὲ
  choice: पर वह
  rationale: चारों ओर के संकट और यीशु की अवस्था के बीच विरोध को संक्षेप और स्वाभाविक रूप से व्यक्त करता है, बिना αὐτός पर अनावश्यक अतिरिक्त बल दिए।
- source_word: ἐκάθευδεν
  choice: सो रहा था
  rationale: अपूर्णकाल जारी अतीत की क्रिया को दर्शाता है; ‘सो रहा था’ इस पक्ष को स्पष्ट रखता है।
theological_decisions:
- issue: σεισμός द्वारा वर्णित घटना का स्वरूप
  choice: समुद्री संदर्भ के अनुसार ‘तूफ़ान’
  alternative: अधिक शाब्दिक ‘भूकम्प’, ‘भूचाल’ या ‘कंपन’
  rationale: यह सिद्धान्तगत निष्कर्ष नहीं, बल्कि संदर्भगत शब्दार्थ का निर्णय है। समुद्र, नाव और लहरों की निकटवर्ती छवियाँ जल पर हुए प्रचंड विक्षोभ को सूचित करती हैं; ‘भूकम्प’ हिन्दी पाठक को अनावश्यक रूप से स्थल-केंद्रित घटना का बोध करा सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ मूल कथन की आकस्मिकता और जीवंतता बनाए रखता है। मुख्य पाठ में ‘ढकी जा रही थी’ स्रोत की दृश्यात्मकता और जारी क्रिया को सुरक्षित रखता है, जबकि पादटिप्पणी संदर्भगत परिणाम स्पष्ट करती है।
