source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: hi
  text: यीशु ने उससे कहा, “ध्यान रखना, किसी से कुछ न कहना। इसके बजाय जाकर अपने आप को याजक को दिखाओ और वह भेंट चढ़ाओ, जिसे चढ़ाने की आज्ञा मूसा ने दी थी[b], ताकि यह उनके लिए गवाही हो[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उनके लिए गवाही” से आशय याजकों के सामने प्रस्तुत प्रमाण हो सकता है; कुछ लोग इसे विश्वास न करने वालों के विरुद्ध निहित गवाही भी समझते हैं। मूल भाषा में “उनके” का संदर्भ स्पष्ट नहीं किया गया है।
    reason: alternative_reading
  - marker: b
    text: यह निर्देश कोढ़ से शुद्ध हुए व्यक्ति के लिए मूसा की व्यवस्था में दी गई विधि को दर्शाता है; देखें लैव्यव्यवस्था 14।
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα
  choice: ध्यान रखना
  rationale: यहाँ ὁράω का आज्ञार्थक रूप किसी बात के प्रति सावधान रहने या उसे सुनिश्चित करने का भाव देता है। ‘ध्यान रखना’ आधुनिक हिन्दी में स्वाभाविक रूप से वही चेतावनीपूर्ण बल व्यक्त करता है।
- source_word: μηδενὶ εἴπῃς
  choice: किसी से कुछ न कहना
  rationale: μηδενί के साथ निषेध किसी भी व्यक्ति को बात न बताने की आज्ञा देता है; हिन्दी में यह वाक्यांश संक्षिप्त और स्वाभाविक है।
- source_word: ἀλλὰ ὕπαγε
  choice: इसके बजाय जाकर
  rationale: ἀλλά पहले निषेध के विपरीत अगला निर्देश रखता है और ὕπαγε जाने की सीधी आज्ञा है। ‘इसके बजाय जाकर’ इस संबंध को स्पष्ट और सहज रखता है।
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: अपने आप को याजक को दिखाओ
  rationale: प्रतिबिंबवाचक रचना और निश्चित पद τῷ ἱερεῖ को निकटता से सुरक्षित रखा गया है; यह शुद्ध हुए व्यक्ति की याजकीय जाँच की ओर संकेत करता है।
- source_word: προσένεγκον τὸ δῶρον
  choice: वह भेंट चढ़ाओ
  rationale: बलिदान-संबंधी प्रसंग में προσφέρω केवल लाने के बजाय अर्पित करने का भाव रखता है। ‘भेंट चढ़ाओ’ δῶρον के धार्मिक प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: जिसकी आज्ञा मूसा ने दी थी
  rationale: προστάσσω आदेश देने या निर्धारित करने को दर्शाता है। यह अनुवाद मूसा की आज्ञा का सीधा भाव बनाए रखता है।
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ताकि यह उनके लिए गवाही हो
  rationale: εἰς यहाँ उद्देश्य या परिणाम प्रकट कर सकता है। यह रूप μαρτύριον को ‘गवाही’ और αὐτοῖς को अनिर्दिष्ट ‘उनके’ के रूप में रखते हुए उसके सकारात्मक प्रमाण अथवा प्रतिकूल साक्ष्य होने का निर्णय नहीं करता।
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: यीशु ने उससे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान λέγει को स्वाभाविक हिन्दी कथा-शैली में सामान्य भूतकाल से व्यक्त किया गया है।
theological_decisions:
- issue: ‘उनके लिए गवाही’ में ‘उनके’ का संकेत और गवाही का स्वरूप
  choice: व्यक्ति-समूह को अनिर्दिष्ट रखा गया है और गवाही को न तो केवल अनुकूल प्रमाण और न ही अविश्वास के विरुद्ध साक्ष्य बनाया गया है।
  alternative: ‘याजकों के लिए प्रमाण’ अथवा ‘उनके विरुद्ध गवाही’
  rationale: αὐτοῖς का संदर्भ पद में स्पष्ट नहीं है और μαρτύριον का अर्थ व्यापक रूप से गवाही या प्रमाण हो सकता है। इसलिए मूल पाठ की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘याजक’, ‘भेंट’ और ‘गवाही’ जैसे प्रचलित बाइबलीय शब्द प्रसंग की धार्मिक विशिष्टता बनाए रखते हैं। यूनानी वाक्य की अस्पष्टता को हिन्दी में स्पष्ट किए बिना सुरक्षित रखा गया है।
