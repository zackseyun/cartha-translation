  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: hi
  text: परन्तु राज्य के पुत्र[a] बाहर के अन्धकार में फेंक दिए जाएँगे। वहाँ रोना और दाँत पीसना होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वे लोग जिन्हें राज्य का स्वाभाविक अधिकारी या अपेक्षित सदस्य माना जाता था। यूनानी में शाब्दिक रूप से ‘राज्य के पुत्र’।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ τῆς βασιλείας
  choice: परन्तु राज्य के पुत्र
  rationale: δέ पिछले पद के साथ तीखा विरोध दिखाता है। ‘राज्य के पुत्र’ यूनानी मुहावरे को बनाए रखता है और उन लोगों के बहिष्कार की विडम्बना सुरक्षित रखता है जिन्हें राज्य का स्वाभाविक अधिकारी या अपेक्षित सदस्य समझा जाता था।
- source_word: ἐκβληθήσονται
  choice: फेंक दिए जाएँगे
  rationale: भविष्यत् कर्मवाच्य रूप बलपूर्वक बाहर निकाले जाने का भाव देता है; यह हिन्दी में सजीव और स्पष्ट है।
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: बाहर का अन्धकार
  rationale: यह मत्ती का विशिष्ट न्याय-चित्र है। ‘बाहर का अन्धकार’ भीतर के भोज और बाहर के बहिष्कार का स्थानिक विरोध स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κλαυθμός
  choice: रोना
  rationale: यह विलाप और दुःख को बिना अनावश्यक रूप से उसकी तीव्रता बढ़ाए सामान्य, सहज हिन्दी में व्यक्त करता है।
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: दाँत पीसना
  rationale: यह यूनानी अभिव्यक्ति का प्रचलित और स्वाभाविक हिन्दी रूप है तथा पीड़ा या रोष की छवि को खुला रखता है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: आरम्भिक स्थानवाचक क्रियाविशेषण को सीधे रखकर न्याय के उस स्थान पर जोर सुरक्षित रहता है।
theological_decisions:
- issue: न्याय और बहिष्कार की छवि
  choice: ‘बाहर के अन्धकार’ और ‘रोना और दाँत पीसना’ की मूल चित्रात्मक भाषा बनाए रखी गई।
  alternative: इसे ‘नरक’ या ‘अनन्त दण्ड’ जैसे व्यवस्थित धर्मवैज्ञानिक शब्दों से स्पष्ट करना।
  rationale: पद कठोर अन्तकालीन बहिष्कार और व्यथा दर्शाता है, पर यहाँ स्वयं यूनानी पाठ उन विशिष्ट धर्मवैज्ञानिक शब्दों का प्रयोग नहीं करता।
- issue: υἱοὶ का लिंग और मुहावरा
  choice: मुख्य पाठ में ‘पुत्र’ रखा गया।
  alternative: ‘सन्तान’, ‘लोग’ या ‘उत्तराधिकारी’।
  rationale: ‘पुत्र’ मूल के व्याकरणिक रूप और अधिकार/सम्बद्धता के मुहावरे दोनों को बनाए रखता है; पादटिप्पणी इसका आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप; मूल की तीखी न्याय-छवि और मुहावरे को बनाए रखते हुए केवल आवश्यक पादटिप्पणी दी गई है।
