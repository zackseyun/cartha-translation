  naturalness: The Hindi is clear, dignified, and suitable for public reading. “वहन किया” is somewhat formal but natural in this scriptural register and more accurately communicates bearing/carrying than “उठा लिया.”
  terminology: “यशायाह भविष्यद्वक्ता,” “दुर्बलताओं,” and “रोगों” are suitable. The alternative note should align with the revised main rendering and retain the Isaiah 53:4 connection without imposing a theological interpretation.
