id: MAT.8.17
reference: Matthew 8:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: hi
  text: 'ताकि यशायाह भविष्यद्वक्ता के द्वारा कही गई बात पूरी हो: “उसने स्वयं हमारी दुर्बलताओं को ले लिया[a] और हमारे रोगों को वहन किया[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बीमारियों को।” यूनानी शब्द का अर्थ दुर्बलताएँ, अस्वस्थताएँ या बीमारियाँ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उठाया” या “ढोया।” “वहन किया” यशायाह 53:4 में भार उठाने के भाव को व्यक्त करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: ताकि … पूरी हो
  rationale: यह रूप मत्ती के उद्देश्य/परिणाम सूचक पूर्ति-वाक्य को स्वाभाविक हिन्दी में रखता है और पूर्ति के भाव को स्पष्ट बनाए रखता है।
- source_word: τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου
  choice: यशायाह भविष्यद्वक्ता के द्वारा कही गई बात
  rationale: ‘के द्वारा’ διά के साधन/माध्यम वाले भाव को सुरक्षित रखता है; पूरा वाक्यांश आधुनिक हिन्दी में सहज है।
- source_word: Αὐτὸς
  choice: उसने स्वयं
  rationale: स्वतंत्र सर्वनाम के बलाघात को ‘स्वयं’ द्वारा व्यक्त किया गया है।
- source_word: ἀσθενείας
  choice: दुर्बलताओं
  rationale: यह शब्द शारीरिक कमज़ोरियों, अस्वस्थताओं अथवा बीमारियों की व्यापक अर्थ-सीमा को बनाए रखता है; प्रसंग में शारीरिक रोग का भाव भी उपस्थित है।
- source_word: ἔλαβεν
  choice: ले लिया
  rationale: λαμβάνω का सीधा अर्थ रखा गया है; ‘दूर कर दिया’ जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: νόσους
  choice: रोगों
  rationale: νόσος के विशिष्ट बीमारी/रोग संबंधी अर्थ के लिए यह सटीक और स्वाभाविक हिन्दी है।
- source_word: ἐβάστασεν
  choice: उठा लिया
  rationale: βαστάζω के उठाने/ढोने/वहन करने के भाव को साधारण और बोधगम्य हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मत्ती के चंगाई-प्रसंग में यशायाह 53:4 के उद्धरण का स्वरूप
  choice: ‘दुर्बलताओं’ और ‘रोगों’ द्वारा शारीरिक पीड़ा का स्पष्ट, पर अर्थ की व्यापकता को बनाए रखने वाला अनुवाद
  alternative: ‘बीमारियों’ और ‘रोगों’; अथवा अधिक भार-वहन सूचक पारंपरिक शब्दावली
  rationale: निकटवर्ती प्रसंग यीशु की चंगाइयों का है, इसलिए शारीरिक कष्ट स्पष्ट रहना चाहिए। फिर भी पद को केवल किसी एक प्रायश्चित्त-सिद्धांत तक सीमित नहीं किया गया; ‘दुर्बलताओं’ और ‘उठा लिया’ में मूल की व्यापकता और धार्मिक तनाव सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। उद्धरण-परिचय में अनावश्यक ‘यह कहते हुए’ नहीं जोड़ा गया, क्योंकि हिन्दी में द्विबिंदु λέγοντος का कार्य स्वाभाविक रूप से निभाता है।
