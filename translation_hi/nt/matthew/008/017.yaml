    issue: “उठा लिया” is an insufficiently precise rendering of ἐβάστασεν.
    rationale: βαστάζω means to carry or bear. In Hindi, “उठा लिया” may imply picking up or removing something, while “वहन किया” directly expresses carrying/bearing and preserves the distinction from ἔλαβεν, “ले लिया.”
