  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: hi
  text: और उसने उसका हाथ छुआ, और उसका बुखार उतर गया, और वह उठकर उसकी सेवा करने लगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी सेवा करती थी।” यूनानी अपूर्ण भूतकाल जारी क्रिया का वर्णन कर सकता है; प्रसंग में यह सेवा आरंभ करने का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο τῆς χειρὸς αὐτῆς
  choice: उसने उसके हाथ को छुआ
  rationale: ἅπτομαι के साथ संबंधकारक यूनानी मुहावरा है; हिन्दी में कर्मकारक के साथ ‘हाथ को छुआ’ स्वाभाविक है और क्रिया को ‘पकड़ा’ कहकर अधिक प्रबल नहीं बनाता।
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: उसका बुखार उतर गया
  rationale: यूनानी में बुखार के उसे छोड़ने की अभिव्यक्ति है। आधुनिक हिन्दी में बीमारी के समाप्त होने के लिए ‘बुखार उतर गया’ सबसे स्वाभाविक है और अर्थ को ठीक रखता है।
- source_word: ἠγέρθη
  choice: वह उठकर
  rationale: यहाँ ἐγείρω का रूप सामान्य कथात्मक अर्थ में उसके उठने को बताता है; ‘जिलाई गई’ जैसी भाषा अनावश्यक पुनरुत्थान-संबंधी अर्थ जोड़ देती।
- source_word: διηκόνει αὐτῷ
  choice: उसकी सेवा करने लगी
  rationale: διακονέω का अर्थ यहाँ घरेलू प्रसंग में सेवा करना है। अपूर्ण भूतकाल को हिन्दी की आरंभ/प्रगतिशील अभिव्यक्ति ‘करने लगी’ स्वाभाविक रूप से दर्शाती है, यद्यपि सामान्य ‘सेवा की’ भी संभव है।
theological_decisions:
- issue: ἠγέρθη में संभावित पुनरुत्थान-संबंधी अतिपाठ
  choice: सामान्य कथात्मक अर्थ में ‘वह उठकर’
  alternative: ‘वह उठाई गई’
  rationale: तात्कालिक प्रसंग बीमारी से चंगी होने के बाद बिस्तर से उठने का है; यहाँ पुनरुत्थान का विशिष्ट धार्मिक अर्थ आरोपित नहीं किया जाना चाहिए।
- issue: διηκόνει के अपूर्ण भूतकाल का बल
  choice: ‘सेवा करने लगी’
  alternative: ‘सेवा की’
  rationale: अपूर्ण भूतकाल जारी क्रिया को बता सकता है और प्रसंग में सेवा आरंभ होने का भाव भी स्वाभाविक है। पाठ में आरंभ का भाव रखा गया है, जबकि पाद-टिप्पणी सरल भूतकाल की वास्तविक संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘बुखार उतर गया’ हिन्दी का स्वाभाविक चिकित्सकीय मुहावरा है। सर्वनाम मूल पाठ के अनुसार एकवचन पुल्लिंग ‘उसकी’ रखता है।
