  verdict: approve
  source_fidelity: The translation accurately renders the temporal genitive absolute ("जब वह...उतरा"), ἀπὸ τοῦ ὄρους ("पहाड़ से"), and the narrative sense of ἠκολούθησαν αὐτῷ ("उसके पीछे हो लिए"). "बड़ी संख्या में लोग" naturally conveys the large/multiple crowds without falsely implying a single formally organized crowd.
  naturalness: The Hindi is fluent, modern, and appropriately dignified. "पहाड़ से नीचे उतरा" is clear, and "उसके पीछे हो लिए" is an established natural narrative idiom for physically following someone.
  terminology: No theological terminology is involved. "पहाड़" is suitable for ὄρος in this Matthean setting. The note responsibly identifies that ὄχλοι is plural and that the main wording is idiomatic rather than formally literal.
