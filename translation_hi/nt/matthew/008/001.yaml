  text: ⸂Καταβάντος δὲ αὐτοῦ⸃ ἀπὸ τοῦ ὄρους ἠκολούθησαν αὐτῷ ὄχλοι πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/001.yaml
  text: When he came down from the mountain[a], large crowds followed him.
translation:
  language: hi
  text: जब वह पहाड़ से नीचे उतरा, तो बड़ी संख्या में लोग उसके पीछे हो लिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शब्दशः: “बहुत-सी भीड़ें उसके पीछे हो लीं।”'
    reason: यूनानी पाठ में ὄχλοι (‘भीड़ें’) बहुवचन है; मुख्य पाठ में स्वाभाविक हिन्दी के लिए उसका भावार्थ दिया गया है।
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: जब वह नीचे उतरा, तो
  rationale: संबंधकारक स्वतंत्र कृदंत को स्वाभाविक हिन्दी कालवाचक उपवाक्य के रूप में रखा गया है। δέ के हल्के संयोजक भाव को ‘तो’ से व्यक्त किया गया है, बिना उसे प्रबल विरोधसूचक बनाए।
- source_word: ἀπὸ τοῦ ὄρους
  choice: पहाड़ से
  rationale: ὄρος के लिए ‘पहाड़’ आधुनिक मानक हिन्दी का स्वाभाविक शब्द है और पिछले प्रसंग के निश्चित स्थान की ओर संकेत बनाए रखता है।
- source_word: ἠκολούθησαν αὐτῷ
  choice: उसके पीछे हो लिए
  rationale: यह मुहावरा शारीरिक रूप से किसी के पीछे चलने का अर्थ सहज हिन्दी में व्यक्त करता है और बहुवचन कर्ता के अनुरूप है।
- source_word: ὄχλοι πολλοί
  choice: बड़ी संख्या में लोग
  rationale: यूनानी में शब्दशः ‘बहुत-सी भीड़ें’ है। हिन्दी में वह प्रयोग असहज है; ‘बड़ी संख्या में लोग’ अनेक लोगों के जुटकर पीछे चलने का आशय स्पष्ट और स्वाभाविक रूप से देता है।
