id: MAT.8.20
reference: Matthew 8:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: hi
  text: और यीशु उससे कहते हैं, “लोमड़ियों की माँदें[a] हैं और आकाश के पक्षियों के बसेरे[b] हैं, पर मनुष्य के पुत्र[c] के पास सिर टिकाने की जगह नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बिल।”
    reason: lexical_alternative
  - marker: b
    text: या “घोंसले” अथवा “ठहरने की जगहें।”
    reason: lexical_alternative
  - marker: c
    text: “मनुष्य का पुत्र” यीशु द्वारा अपने लिए प्रयुक्त पदवी है; कुछ अनुवाद इसे “मानव-पुत्र” कहते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: कहते हैं
  rationale: यूनानी ऐतिहासिक वर्तमान को वर्तमान काल में रखा गया है; हिन्दी कथा-वर्णन में यह स्वाभाविक है और स्रोत की जीवंतता बनाए रखता है।
- source_word: ἀλώπεκες
  choice: लोमड़ियाँ
  rationale: बहुवचन संज्ञा का सीधा और सामान्य हिन्दी पर्याय।
- source_word: φωλεούς
  choice: माँदें
  rationale: जंगली पशुओं के रहने के स्थान के लिए आधुनिक हिन्दी का स्वाभाविक शब्द; ‘बिल’ भी संभव है।
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: आकाश के पक्षी
  rationale: οὐρανός के दृश्य बिंब को सीधे रखते हुए सहज आधुनिक हिन्दी दी गई है।
- source_word: κατασκηνώσεις
  choice: बसेरे
  rationale: यह शब्द पक्षियों के ठहरने या आश्रय लेने के स्थान को व्यक्त करता है और केवल अंडे देने वाले ‘घोंसले’ तक अर्थ को सीमित नहीं करता।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की आत्म-पदवी का स्थापित रूप रखा गया है, जिससे इसकी मानवीय अभिव्यक्ति और दानिय्येल 7 से संभावित धर्मवैचारिक प्रतिध्वनि दोनों बनी रहती हैं। वाक्य में विभक्ति के कारण ‘मनुष्य के पुत्र’ रूप आया है।
- source_word: οὐκ ἔχει ποῦ
  choice: के पास … जगह नहीं है
  rationale: यूनानी नकार और स्थानवाचक अभिव्यक्ति को स्वाभाविक हिन्दी में ‘जगह नहीं है’ के रूप में व्यक्त किया गया है।
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: सिर टिकाने
  rationale: यह सहज हिन्दी मुहावरा सिर झुकाकर या रखकर विश्राम करने के ठोस बिंब को सुरक्षित रखता है।
theological_decisions:
- issue: यीशु की आत्म-पदवी ὁ υἱὸς τοῦ ἀνθρώπου का अनुवाद
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र; वह मनुष्य
  rationale: ‘मनुष्य का पुत्र’ मूल पदवी की शब्दावली, उसकी प्रचलित पहचान और उसके बहुस्तरीय धर्मवैचारिक संकेतों को बिना किसी एक व्याख्या में सीमित किए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कहते हैं’ से यूनानी ऐतिहासिक वर्तमान सुरक्षित है। ‘माँदें’ और ‘बसेरे’ के समानांतर शब्द पशु-पक्षियों के आश्रय और मनुष्य के पुत्र की आश्रयहीनता के विरोध को स्पष्ट रखते हैं।
