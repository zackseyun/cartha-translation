  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: hi
  text: और देखो, वे चिल्लाकर बोले, “हमारा आपसे क्या लेना-देना है, हे परमेश्वर के पुत्र? क्या आप ठहराए हुए समय से पहले[b] हमें यातना देने यहाँ आए हैं?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “हमारा और आपका क्या?” यह मुहावरा दूरी बनाने या विरोध जताने के लिए प्रयुक्त होता है।'
    reason: lexical_alternative
  - marker: b
    text: या “समय से पहले।” यूनानी शब्द किसी नियत या उपयुक्त समय का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: और देखो
  rationale: ‘और’ कथावृत्त को आगे बढ़ाता है और ‘देखो’ ἰδού के आकस्मिक ध्यानाकर्षक तथा दृश्यात्मक बल को बनाए रखता है।
- source_word: ἔκραξαν λέγοντες
  choice: वे चिल्लाकर कहने लगे
  rationale: यह स्वाभाविक हिन्दी में ऊँची आवाज़ से पुकारने के अर्थ और λέγοντες के वाचिक परिचय—दोनों को व्यक्त करता है।
- source_word: Τί ἡμῖν καὶ σοί
  choice: हमारा आपसे क्या लेना-देना है?
  rationale: यह यूनानी में उपस्थित सामी मुहावरे का स्वाभाविक हिन्दी समतुल्य है और दूरी बनाने अथवा विरोध जताने का भाव सुरक्षित रखता है।
- source_word: υἱὲ τοῦ θεοῦ
  choice: हे परमेश्वर के पुत्र
  rationale: प्रत्यक्ष संबोधन और मसीह-संबंधी उपाधि को बिना घटाए या बढ़ाए स्पष्ट रूप से प्रस्तुत करता है।
- source_word: ἦλθες ὧδε
  choice: क्या आप ... यहाँ आए हैं?
  rationale: ‘यहाँ’ ὧδε के स्थानवाचक अर्थ को रखता है; पूर्णकालीन हिन्दी रूप आगमन के वर्तमान परिणाम और प्रश्न के बल को स्वाभाविक रूप देता है।
- source_word: πρὸ καιροῦ
  choice: ठहराए हुए समय से पहले
  rationale: καιρός केवल सामान्य समय नहीं, बल्कि किसी नियत या उपयुक्त समय की ओर संकेत कर सकता है; ‘ठहराए हुए’ उस निहितार्थ को बचाता है, पर यह नहीं बताता कि किसने समय ठहराया।
- source_word: βασανίσαι
  choice: यातना देने
  rationale: यह न्याय से जुड़ी कठोर पीड़ा के अर्थ को स्वाभाविक और गंभीर हिन्दी में व्यक्त करता है, बिना उसे केवल शारीरिक अत्याचार तक सीमित किए।
- source_word: ἡμᾶς
  choice: हमें
  rationale: बहुवचन कर्मकारक को सीधे व्यक्त करता है और बोलने वाली दुष्टात्माओं की सामूहिक वाणी बनाए रखता है।
theological_decisions:
- issue: दुष्टात्माओं द्वारा यीशु की पहचान
  choice: हे परमेश्वर के पुत्र
  alternative: हे ईश्वर-पुत्र
  rationale: मूल पाठ में स्पष्ट संबोधन υἱὲ τοῦ θεοῦ है। ‘परमेश्वर के पुत्र’ प्रचलित, स्पष्ट और प्रत्यक्ष है तथा पाठ से अधिक कोई धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: καιρός का अंतकालीन अथवा न्याय-संबंधी संकेत
  choice: ठहराए हुए समय से पहले
  alternative: समय से पहले
  rationale: प्रश्न किसी नियत समय पर होने वाली यातना या न्याय का संकेत देता है। चुना हुआ रूप उस तनाव को बनाए रखता है, पर किसी विस्तृत अंतकालीन व्यवस्था को पाठ में नहीं जोड़ता।
- issue: Τί ἡμῖν καὶ σοί में दूरी और विरोध का भाव
  choice: हमारा आपसे क्या लेना-देना है?
  alternative: आपको हमसे क्या काम है?
  rationale: चुना हुआ रूप पारस्परिक असंबंध और चुनौती—दोनों को सुरक्षित रखता है; वैकल्पिक रूप अर्थ को केवल यीशु की मंशा पूछने तक सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और श्रव्य रूप अपनाया गया है। ‘आप’ सम्मानसूचक संबोधन है; इससे मूल यूनानी के एकवचन संबोधन का आशय संदर्भ में स्पष्ट रहता है। मुहावरे को शब्दशः अस्वाभाविक बनाने के बजाय हिन्दी के प्रचलित ‘क्या लेना-देना’ से व्यक्त किया गया है, और अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
