id: MAT.8.9
reference: Matthew 8:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: hi
  text: क्योंकि मैं भी अधिकार के अधीन एक मनुष्य हूँ, और मेरे अधीन सैनिक हैं। मैं एक से कहता हूँ, ‘जा,’ और वह जाता है; दूसरे से, ‘आ,’ और वह आता है; और अपने दास[a] से, ‘यह कर,’ और वह करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “सेवक” (यूनानी: दूलोस)।'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि
  rationale: यह पद सूबेदार की पिछली बात का आधार और स्पष्टीकरण देता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν
  choice: मैं भी अधिकार के अधीन एक मनुष्य हूँ
  rationale: यह अनूदित और प्रत्यायोजित अधिकार की सैनिक व्यवस्था को स्पष्ट रखते हुए यूनानी वाक्य की संरचना तथा ‘मैं भी’ के तुलनात्मक बल को सुरक्षित रखता है।
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: मेरे अधीन सैनिक हैं
  rationale: सहभागी क्रिया-रूप को सहज आधुनिक हिन्दी में स्वतंत्र उपवाक्य बनाया गया है; अधीनता और सैनिक संदर्भ दोनों बने रहते हैं।
- source_word: λέγω τούτῳ
  choice: मैं एक से कहता हूँ
  rationale: शाब्दिक ‘इससे’ हिन्दी में बिना प्रत्यक्ष संकेत के अस्वाभाविक हो सकता है; ‘एक से’ अगले ‘दूसरे से’ के साथ वितरणात्मक समानांतरता स्पष्ट करता है।
- source_word: Πορεύθητι / Ἔρχου / Ποίησον τοῦτο
  choice: जा / आ / यह कर
  rationale: एकवचन आज्ञार्थक रूपों को संक्षिप्त आदेशों के रूप में रखा गया है, जिससे तत्काल आज्ञापालन का समानांतर क्रम सुरक्षित रहता है।
- source_word: δοῦλος
  choice: दास
  rationale: पहली सदी की सामाजिक अधीनता को ‘सेवक’ की अपेक्षा अधिक स्पष्ट और ऐतिहासिक रूप से सटीक ढंग से व्यक्त करता है, जबकि पद का मुख्य बल अधिकार पर है।
theological_decisions:
- issue: δοῦλος का सामाजिक और धार्मिक अर्थ
  choice: दास
  alternative: सेवक
  rationale: यूनानी शब्द स्वामित्व अथवा कठोर सामाजिक अधीनता का संकेत दे सकता है। ‘दास’ उस तनाव को मिटाता नहीं; फिर भी ‘सेवक’ संदर्भानुकूल वैकल्पिक अनुवाद है और पादटिप्पणी में दिया गया है।
- issue: सूबेदार और यीशु के अधिकार के बीच संबंध
  choice: पाठ में केवल सूबेदार का ‘अधिकार के अधीन’ होना और उसके अधीन सैनिक होना कहा गया है
  alternative: यीशु को भी किसी मानवीय या सैनिक अधिकार के अधीन बताना
  rationale: वक्ता अपनी स्थिति से यीशु के प्रभावी अधिकार की समानता समझाता है, पर यूनानी पाठ यीशु की अधीनता की प्रकृति पर प्रत्यक्ष कथन नहीं करता; अनुवाद को उससे आगे नहीं जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। छोटे आज्ञार्थक वाक्य यूनानी की लय और सैनिक आदेशों की तत्क्षणता बनाए रखते हैं। ‘तू’ जैसे स्पष्ट सर्वनाम से बचकर केवल क्रिया-रूप रखे गए हैं, जिससे आदेश स्वाभाविक और संक्षिप्त लगते हैं।
