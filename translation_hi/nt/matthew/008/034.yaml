id: MAT.8.34
reference: Matthew 8:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: hi
  text: और देखो, सारा नगर यीशु से मिलने बाहर निकला; और उसे देखकर उन्होंने उससे विनती की कि वह उनके इलाके से चला जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके क्षेत्र से’; अधिक शाब्दिक रूप में, ‘उनकी सीमाओं से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह कथा में ध्यान खींचने और घटना को जीवंत ढंग से प्रस्तुत करने वाला संकेत है; आधुनिक हिन्दी में ‘देखो’ स्वाभाविक और स्पष्ट है।
- source_word: πᾶσα ἡ πόλις
  choice: सारा नगर
  rationale: यूनानी मुहावरा नगर की आबादी को सामूहिक रूप से दर्शाता है; ‘सारा नगर’ इस भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐξῆλθεν
  choice: बाहर निकला
  rationale: यह नगर से बाहर की ओर हुई गति को सीधे व्यक्त करता है और एकवचन सामूहिक कर्ता ‘नगर’ से मेल खाता है।
- source_word: εἰς ὑπάντησιν τῷ Ἰησοῦ
  choice: यीशु से मिलने
  rationale: यह उद्देश्यसूचक यूनानी पदबंध का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: ἰδόντες αὐτὸν
  choice: उसे देखकर
  rationale: अओरिस्ट कृदंत को समय-संबंधी भाव में सहज हिन्दी में व्यक्त किया गया है, बिना अनावश्यक रूप से क्रम को कठोर बनाने के।
- source_word: παρεκάλεσαν
  choice: विनती की
  rationale: संदर्भ में क्रिया गंभीर और आग्रहपूर्ण अनुरोध बताती है; ‘विनती की’ गरिमापूर्ण तथा आधुनिक हिन्दी में उपयुक्त है।
- source_word: ὅπως μεταβῇ
  choice: कि वह ... चला जाए
  rationale: यह उनकी विनती की विषय-वस्तु को स्पष्ट करता है और यूनानी subjunctive का स्वाभाविक हिन्दी रूप देता है।
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: उनके इलाके से
  rationale: ὅρια का शाब्दिक अर्थ सीमाएँ है, पर यहाँ उससे घिरा क्षेत्र अभिप्रेत है; ‘इलाका’ साधारण पाठक के लिए स्वाभाविक और सटीक है।
theological_decisions:
- issue: नगरवासियों की विनती का कारण
  choice: पद केवल यह बताता है कि उन्होंने यीशु से चले जाने की विनती की; कारण अनकहा रखा गया है।
  alternative: इसे यीशु की सामर्थ्य का भय, सूअरों की हानि पर क्रोध, या घटना से उत्पन्न सामान्य घबराहट मानना।
  rationale: यूनानी पाठ उनके उद्देश्य की व्याख्या नहीं करता। किसी एक कारण को जोड़ना कथा की वास्तविक अस्पष्टता और धर्मवैचारिक तनाव को अनुचित रूप से सुलझा देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देखो’ से ἰδοὺ का कथात्मक ध्यानाकर्षण बचा है; ‘नगर’ सामूहिक कर्ता है, जबकि आगे बहुवचन ‘उन्होंने’ नगरवासियों की ओर स्वाभाविक अर्थानुसार संकेत करता है।
