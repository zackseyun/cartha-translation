source:
  edition: SBLGNT
  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: hi
  text: और एक शास्त्री उसके पास आकर उससे बोला, “गुरुजी, आप जहाँ कहीं जाएँ[a], मैं आपके पीछे चलूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आप जहाँ कहीं चले जाएँ।” यूनानी क्रिया अधिक विशेष रूप से चले जाने या प्रस्थान करने का अर्थ दे सकती है, हालाँकि यहाँ सामान्य अर्थ “जाना” स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: पास आकर
  rationale: यह यीशु की ओर आने और फिर उनसे कहने की क्रमिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἷς
  choice: एक
  rationale: मूल पाठ की संख्या-सूचक अभिव्यक्ति को बनाए रखते हुए यह किसी एक व्यक्ति का परिचय कराता है।
- source_word: γραμματεὺς
  choice: शास्त्री
  rationale: सुसमाचारों के यहूदी संदर्भ में यह धार्मिक धर्मशास्त्र और व्यवस्था के जानकार व्यक्ति के लिए प्रचलित तथा संक्षिप्त हिन्दी पद है।
- source_word: Διδάσκαλε
  choice: गुरुजी
  rationale: प्रत्यक्ष संबोधन में यह आधुनिक हिन्दी का स्वाभाविक और आदरसूचक रूप है; यह यीशु को शिक्षक मानकर संबोधित करने का भाव रखता है।
- source_word: ἀκολουθήσω
  choice: मैं आपके पीछे चलूँगा
  rationale: यह भविष्यकालीन संकल्प को व्यक्त करता है और साथ चलने तथा शिष्य के रूप में अनुसरण करने—दोनों संभावित भावों को खुला रखता है।
- source_word: ὅπου ἐὰν
  choice: जहाँ कहीं
  rationale: यह गंतव्य की अनिश्चित और असीमित व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπέρχῃ
  choice: आप जाएँ
  rationale: संदर्भ में यह सामान्यतः किसी स्थान को जाने का भाव देता है; अधिक विशिष्ट ‘चले जाएँ’ या ‘प्रस्थान करें’ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: यीशु के लिए διδάσκαλος संबोधन
  choice: गुरुजी
  alternative: शिक्षक / स्वामी
  rationale: ‘गुरुजी’ शिक्षक के लिए स्वाभाविक आदरसूचक संबोधन है। ‘स्वामी’ मूल शब्द से अधिक अधिकार या मसीही अर्थ जोड़ सकता है, जबकि केवल ‘शिक्षक’ प्रत्यक्ष हिन्दी संबोधन में अपेक्षाकृत अस्वाभाविक लगता है।
- issue: ἀκολουθήσω में शारीरिक साथ चलना और शिष्यत्व
  choice: मैं आपके पीछे चलूँगा
  alternative: मैं आपका अनुयायी बनूँगा
  rationale: मूल क्रिया में वास्तविक रूप से पीछे चलने और शिष्य के रूप में अनुसरण करने, दोनों का भाव हो सकता है। चुना हुआ रूप इस अर्थ-तनाव को सुरक्षित रखता है, जबकि ‘अनुयायी बनूँगा’ केवल व्याख्यात्मक शिष्यत्व को प्रमुख कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। आदरसूचक ‘आप/उनसे’ का प्रयोग किया गया है। वाक्यरचना मूल यूनानी के क्रम को पर्याप्त रूप से बनाए रखती है, पर संवाद को स्वाभाविक हिन्दी में प्रस्तुत करती है।
