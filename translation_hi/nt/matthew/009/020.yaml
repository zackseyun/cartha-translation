  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: hi
  text: और देखो, एक स्त्री, जिसे बारह वर्ष से रक्तस्राव हो रहा था, पीछे से उसके पास आई और उसने यीशु के वस्त्र की झालर[a][b] को छुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फुंदना” या “किनारा”; यूनानी शब्द वस्त्र की झालर या सीमा के लिए प्रयुक्त हो सकता है, जिसमें यहूदी पोशाक से जुड़ा फुंदने जैसा किनारा भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: इस्राएल की व्यवस्था में वस्त्रों की झालरों या फुंदनों की पृष्ठभूमि के लिए गिनती 15:38 और व्यवस्थाविवरण 22:12 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: और देखो
  rationale: कथानक में अचानक ध्यान खींचने और दृश्य को सजीव बनाने वाले संकेत को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: γυνὴ
  choice: एक स्त्री
  rationale: अनिश्चित उल्लेख का सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: αἱμορροοῦσα
  choice: जिसे ... रक्तस्राव हो रहा था
  rationale: चलती आ रही दीर्घकालिक रक्तस्राव की अवस्था व्यक्त करता है; ‘लहू बहता था’ की अपेक्षा आधुनिक और स्पष्ट है तथा तीव्र आकस्मिक रक्तस्राव का अनावश्यक अर्थ नहीं देता।
- source_word: δώδεκα ἔτη
  choice: बारह वर्ष से
  rationale: अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προσελθοῦσα ὄπισθεν
  choice: पीछे से पास आई
  rationale: यीशु की ओर बढ़ने और पीछे की दिशा से आने—दोनों अर्थों को सुरक्षित रखता है।
- source_word: ἥψατο
  choice: छुआ
  rationale: इस प्रसंग में संपर्क के सामान्य अर्थ को ठीक व्यक्त करता है और पकड़ने का अधिक प्रबल अर्थ नहीं जोड़ता।
- source_word: τοῦ κρασπέδου
  choice: झालर
  rationale: वस्त्र के किनारे अथवा उससे जुड़ी लटकती झालर का अर्थ खुला रखता है; ‘फुंदना’ या ‘किनारा’ की अपेक्षा किसी एक भौतिक रूप पर कम आग्रह करता है।
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: यीशु के वस्त्र की
  rationale: ἱμάτιον के सामान्य अर्थ को बनाए रखता है। हिन्दी में केवल ‘उसके’ से संभावित अस्पष्टता होने के कारण संदर्भगत व्यक्ति ‘यीशु’ स्पष्ट किया गया है।
theological_decisions:
- issue: κράσπεδον का यहूदी पोशाक की धार्मिक झालर/फुंदने से संभावित संबंध
  choice: मुख्य पाठ में सामान्य ‘झालर’
  alternative: ‘फुंदना’ कहकर गिनती 15:38 और व्यवस्थाविवरण 22:12 से संबंध को अधिक प्रत्यक्ष करना, या ‘किनारा’ कहकर केवल वस्त्र की सीमा पर बल देना
  rationale: यूनानी शब्द किनारे, झालर या फुंदने की ओर संकेत कर सकता है, पर यह पद स्वयं उसके धार्मिक प्रतीकवाद को स्पष्ट नहीं करता। ‘झालर’ संभावित सांस्कृतिक संकेत बनाए रखती है, जबकि पादटिप्पणी वैकल्पिक अर्थ और व्यवस्था की पृष्ठभूमि बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘और देखो’ मूल के ध्यानाकर्षक कथात्मक संकेत को रखता है। चिकित्सकीय अवस्था के लिए स्पष्ट ‘रक्तस्राव’ और व्यापक परिधान-संज्ञा के लिए ‘वस्त्र’ चुना गया है।
