source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: hi
  text: लेकिन जब भीड़ को बाहर निकाल दिया गया, तब वह भीतर गया और उसने लड़की का हाथ पकड़ा, और लड़की उठ खड़ी हुई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लड़की उठाई गई।” यूनानी क्रिया का अनुवाद दोनों प्रकार से किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: लेकिन जब
  rationale: ὅτε समयसूचक उपवाक्य प्रस्तुत करता है और δέ कथा में हल्का परिवर्तन या विरोध दिखाता है; ‘लेकिन जब’ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: भीड़ को बाहर निकाल दिया गया
  rationale: ἐξεβλήθη का कर्मवाच्य रूप बनाए रखा गया है। यहाँ लोगों को स्थान से बाहर किए जाने का भाव है; ‘निकाल दिया गया’ स्वाभाविक है और अनावश्यक हिंसक या दुष्टात्मा-निकालने वाला संकेत नहीं जोड़ता।
- source_word: εἰσελθὼν
  choice: वह भीतर गया
  rationale: यूनानी कृदन्त मुख्य क्रिया से पहले होने वाली क्रिया बताता है; इसे आधुनिक हिन्दी में क्रमिक स्वतंत्र क्रिया के रूप में व्यक्त करना अधिक स्वाभाविक है।
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: उसने लड़की का हाथ पकड़ा
  rationale: κρατέω के साथ संबंधकारक का अर्थ हाथ थामना या पकड़ना है। ‘हाथ पकड़ा’ सहज और अर्थ-सटीक है। लड़की का स्पष्ट उल्लेख हिन्दी में सर्वनाम-संदेह से बचाता है।
- source_word: ἠγέρθη
  choice: उठ खड़ी हुई
  rationale: यह रूप व्याकरणतः कर्मवाच्य है, पर प्रसंग में अकर्मक परिणाम ‘उठी’ भी व्यक्त कर सकता है। ‘उठ खड़ी हुई’ हिन्दी में स्वाभाविक है, जबकि वैकल्पिक कर्मवाच्य अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τὸ κοράσιον
  choice: लड़की
  rationale: κοράσιον छोटी या युवा लड़की को सूचित करता है; ‘लड़की’ आधुनिक, स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: जीवन में लौटने के प्रसंग में ἠγέρθη का अनुवाद
  choice: उठ खड़ी हुई
  alternative: उठाई गई
  rationale: यूनानी कर्मवाच्य रूप को अकर्मक अर्थ में भी समझा जा सकता है। मुख्य पाठ में सहज हिन्दी रखी गई है, पर यह निर्धारित नहीं किया गया कि व्याकरणिक बल केवल लड़की की क्रिया पर है या किसी निहित कर्ता द्वारा उसे उठाए जाने पर; वैकल्पिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, कथा-शैली सरल और गरिमापूर्ण रखी गई है। मूल यूनानी के क्रम, कर्मवाच्य और अंतिम क्रिया की वास्तविक अस्पष्टता को यथासंभव सुरक्षित रखा गया है। पादटिप्पणी-चिह्न उस अंतिम क्रिया के बाद रखा गया है जिससे वैकल्पिक अनुवाद संबंधित है।
