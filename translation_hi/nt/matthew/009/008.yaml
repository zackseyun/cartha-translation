source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: hi
  text: पर जब भीड़ों ने यह देखा, तो वे डर गए[a] और उन्होंने परमेश्वर की महिमा की, जिसने मनुष्यों[b] को ऐसा अधिकार दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे श्रद्धामिश्रित विस्मय से भर गए।” यहाँ प्रयुक्त यूनानी क्रिया का अधिक सीधा अर्थ डरना है, पर इस भय में श्रद्धामिश्रित विस्मय भी शामिल हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मनुष्यों” का अर्थ यहाँ “लोगों” या “मानवों” से भी हो सकता है। यूनानी शब्द बहुवचन है और सामान्य रूप से मानवजाति के प्रतिनिधियों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: जब ... ने यह देखा
  rationale: अोरिस्ट कृदन्त को स्वाभाविक हिन्दी में कालवाचक उपवाक्य बनाया गया है। ‘यह’ निकटवर्ती घटना—चंगाई और उससे जुड़े अधिकार के प्रदर्शन—की ओर संकेत करता है।
- source_word: δὲ
  choice: पर
  rationale: यह कथा में प्रतिक्रिया की ओर संक्रमण और हल्का विरोध दर्शाता है; आधुनिक हिन्दी में ‘पर’ संक्षिप्त और स्वाभाविक है।
- source_word: οἱ ὄχλοι
  choice: भीड़ों
  rationale: यूनानी बहुवचन को बनाए रखा गया है; ‘भीड़ें’ की तुलना में परसर्ग के साथ ‘भीड़ों ने’ स्वाभाविक है।
- source_word: ἐφοβήθησαν
  choice: डर गए
  rationale: φοβέομαι का सीधा अर्थ भयभीत होना है। संदर्भ में श्रद्धामिश्रित विस्मय संभव है, पर मुख्य पाठ उस भावगत तनाव को नरम नहीं करता।
- source_word: ἐδόξασαν
  choice: महिमा की
  rationale: δοξάζω के धार्मिक और शाब्दिक भार को बनाए रखने वाला प्रचलित हिन्दी रूप है; केवल ‘स्तुति की’ कहना अर्थ को कुछ संकरा कर सकता है।
- source_word: τὸν θεὸν
  choice: परमेश्वर
  rationale: आधुनिक हिन्दी बाइबलीय शैली में θεός का स्पष्ट और प्रतिष्ठित समतुल्य।
- source_word: τὸν δόντα
  choice: जिसने ... दिया था
  rationale: कर्ता परमेश्वर की ओर लौटता संबंधवाचक उपवाक्य और भीड़ की प्रतिक्रिया से पूर्व हुए कार्य को हिन्दी के पूर्ण भूतकाल में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यह केवल सामर्थ्य नहीं, बल्कि वैध या प्रदत्त अधिकार का बोध कराता है, जो पाप क्षमा करने के निकटवर्ती प्रसंग में महत्त्वपूर्ण है।
- source_word: τοιαύτην
  choice: ऐसा
  rationale: ἐξουσίαν के प्रकार या स्वरूप की ओर संकेत करने वाला स्वाभाविक हिन्दी विशेषण।
- source_word: τοῖς ἀνθρώποις
  choice: मनुष्यों को
  rationale: ἄνθρωποι यहाँ मानव व्यक्तियों या मानवजाति के प्रतिनिधियों का बोध करा सकता है। ‘मनुष्यों’ यूनानी बहुवचन और प्रसंगगत तनाव दोनों को बचाता है, बिना इसे केवल पुरुषों तक सीमित किए।
theological_decisions:
- issue: भीड़ की प्रतिक्रिया भय थी या श्रद्धामिश्रित विस्मय
  choice: वे डर गए
  alternative: वे विस्मय से भर गए / उन पर भय छा गया
  rationale: यूनानी क्रिया का मूल अर्थ भय है। संदर्भ श्रद्धापूर्ण विस्मय की छाया दे सकता है, इसलिए उसे पादटिप्पणी में रखा गया है, मुख्य पाठ में भय को विस्मय बनाकर तनाव समाप्त नहीं किया गया।
- issue: τοῖς ἀνθρώποις का विस्तार
  choice: मनुष्यों को
  alternative: लोगों को / मनुष्य को
  rationale: यूनानी रूप बहुवचन है और सामान्य रूप से मानवों का बोध करा सकता है। ‘मनुष्यों को’ बहुवचन को सुरक्षित रखता है तथा इस प्रश्न को खुला छोड़ता है कि भीड़ यीशु में प्रकट अधिकार को मानवों को दिए गए अधिकार के रूप में कैसे समझ रही थी।
- issue: अधिकार के प्रदाता की पहचान
  choice: परमेश्वर, जिसने मनुष्यों को ऐसा अधिकार दिया था
  alternative: ऐसा अधिकार मनुष्यों को देने वाले परमेश्वर
  rationale: दोनों रूप परमेश्वर को प्रदाता बताते हैं; संबंधवाचक उपवाक्य यूनानी संरचना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है, बिना अधिकार के धर्मवैज्ञानिक विस्तार को समझाए।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘महिमा की’ तथा ‘अधिकार’ जैसे मुख्य धर्मवैज्ञानिक पद सुरक्षित हैं। ‘डर गए’ बोलचाल में सहज है, फिर भी संदर्भ की गंभीरता बनाए रखता है। हर पादटिप्पणी-चिह्न मुख्य पाठ में मौजूद है।
