    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: लेकिन
  rationale: यह पिछले पद में यीशु की चुप रहने की आज्ञा और इन लोगों के कार्य के बीच हल्का विरोध प्रकट करता है।
- source_word: ἐξελθόντες
  choice: बाहर निकलकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुए कार्य को दर्शाता है; यह रूप हिन्दी में समय-क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: διεφήμισαν
  choice: खबर फैला दी
  rationale: क्रिया का अर्थ किसी व्यक्ति के विषय में बात या समाचार को व्यापक रूप से प्रसिद्ध करना है; यह अभिव्यक्ति आधुनिक हिन्दी में सहज है।
- source_word: αὐτὸν
  choice: यीशु के बारे में
  rationale: यूनानी में सीधा कर्म 'उसे' है, पर हिन्दी में 'खबर फैलाना' के साथ 'के बारे में' स्वाभाविक है। नाम का प्रयोग यह भी स्पष्ट करता है कि खबर उन्हीं लोगों के बारे में नहीं, यीशु के बारे में थी।
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: उस पूरे क्षेत्र में
  rationale: सन्दर्भ स्थानीय भौगोलिक इलाके का है; 'क्षेत्र' γῆ के इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि 'पूरे' व्यापक प्रसार को बनाए रखता है।
theological_decisions:
- issue: γῆ का भौगोलिक विस्तार
  choice: क्षेत्र
  alternative: भूमि
  rationale: सन्दर्भ यीशु की प्रसिद्धि के स्थानीय प्रसार का है। 'क्षेत्र' अनावश्यक रूप से राष्ट्रीय या सार्वभौमिक विस्तार का संकेत दिए बिना सम्भावित स्थानीय अर्थ देता है; 'भूमि' भी शाब्दिक रूप से सम्भव है।
translation_notes:
  register: भाषा आधुनिक, सहज और सम्मानपूर्ण रखी गई है। 'लेकिन' पिछले पद से विरोध को स्पष्ट करता है, और 'बाहर निकलकर' यूनानी कृदन्त के समय-क्रम को संक्षेप में बनाए रखता है।
