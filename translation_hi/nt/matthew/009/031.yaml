  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: hi
  text: लेकिन बाहर निकलकर उन्होंने उस पूरे क्षेत्र[a] में यीशु के बारे में खबर फैला दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
