review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Jesus' movement from the previous location, Matthew as a man seated at a tax-collection booth, the summons, and his immediate response. The historical present in λέγει is appropriately rendered in ordinary Hindi narrative past tense and documented in a footnote. Replacing the idiom “उनके पीछे हो लिया” with “उनके पीछे चल पड़ा” more directly reflects ἠκολούθησεν (“followed”) while retaining the immediate sequential force of ἀναστάς (“having risen/gotten up”).
  naturalness: The Hindi is clear and modern. “वह उठकर उनके पीछे चल पड़ा” is more transparent and broadly idiomatic than “वह उठकर उनके पीछे हो लिया,” whose nuance can sound somewhat colloquial or less directly equivalent to following someone.
  terminology: “कर-वसूली की चौकी” suitably conveys τελώνιον without importing a modern bureaucratic institution. “मत्ती” is the standard Hindi form of Matthew. “मेरे पीछे चल” faithfully preserves the concise imperative and does not overinterpret it as an explicit doctrinal formula.
  issues:
  - severity: low
    issue: “उनके पीछे हो लिया” is less direct than the Greek verb for following.
    rationale: Although understandable, this idiom may suggest joining or falling in behind rather than explicitly following. “उनके पीछे चल पड़ा” naturally expresses the concrete action and leaves the discipleship implication unexpanded, as does the Greek.
