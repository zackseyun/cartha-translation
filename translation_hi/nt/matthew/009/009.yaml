reference: Matthew 9:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: hi
  text: यीशु वहाँ से आगे बढ़े तो उन्होंने मत्ती नाम के एक आदमी को कर-वसूली की चौकी पर बैठे देखा। उन्होंने उससे कहा,[a] “मेरे पीछे चल।” वह उठकर उनके पीछे चल पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यहाँ जीवंत कथात्मक वर्तमान काल है: “वे उससे कहते हैं।”'
    reason: मूल भाषा की कथात्मक शैली को दर्ज करना
lexical_decisions:
- source_word: παράγων ... ἐκεῖθεν
  choice: वहाँ से आगे बढ़े तो
  rationale: वर्तमान कृदंत और स्थानवाचक क्रिया-विशेषण यीशु के उस स्थान से आगे जाने की पृष्ठभूमि बताते हैं। यह रूप हिन्दी में स्वाभाविक रहते हुए घटनाक्रम को स्पष्ट रखता है।
- source_word: ἄνθρωπον
  choice: एक आदमी
  rationale: यहाँ शब्द एक निश्चित पुरुष के लिए आया है; ‘आदमी’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: कर-वसूली की चौकी पर बैठे
  rationale: τελώνιον कर या चुंगी वसूलने के स्थान को दर्शाता है। ‘कर-वसूली की चौकी’ आधुनिक पाठक को कार्य और स्थान दोनों स्पष्ट करती है, बिना इसे अनावश्यक रूप से औपचारिक कार्यालय बनाने के।
- source_word: Μαθθαῖον λεγόμενον
  choice: मत्ती नाम के
  rationale: यह वाक्यांश उस व्यक्ति का प्रचलित नाम बताता है। ‘मत्ती नाम के’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: λέγει αὐτῷ
  choice: उन्होंने उससे कहा
  rationale: यूनानी में कथात्मक वर्तमान काल है, पर हिन्दी की सामान्य कथा-शैली में भूतकाल अधिक स्वाभाविक है। पादटिप्पणी मूल की जीवंत कथात्मक वर्तमान शैली दर्ज करती है।
- source_word: Ἀκολούθει μοι
  choice: मेरे पीछे चल
  rationale: यह वर्तमान आज्ञार्थक का सीधा, संक्षिप्त अनुवाद है और शिष्यत्व के आशय को व्याख्यात्मक विस्तार के बिना बनाए रखता है।
- source_word: ἀναστὰς ἠκολούθησεν αὐτῷ
  choice: वह उठकर उनके पीछे हो लिया
  rationale: ‘उठकर’ पहले घटित प्रतिक्रिया को और ‘पीछे हो लिया’ वास्तविक साथ चलने तथा शिष्य के रूप में अनुसरण—दोनों निहितार्थों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यीशु के बुलावे का स्वरूप
  choice: “मेरे पीछे चल”
  alternative: “मेरा शिष्य बन जा”
  rationale: संदर्भ में शिष्यत्व निहित है, लेकिन मूल पाठ केवल अनुसरण की आज्ञा देता है। इसलिए धर्मवैज्ञानिक अर्थ को बनाए रखते हुए उसे पाठ में व्याख्यात्मक रूप से नहीं जोड़ा गया।
- issue: मत्ती की प्रतिक्रिया
  choice: “उनके पीछे हो लिया”
  alternative: “उनका शिष्य बन गया”
  rationale: मूल क्रिया अनुसरण को व्यक्त करती है। चुना हुआ रूप तत्काल बाहरी कार्य और गहरे शिष्यत्व-संबंध दोनों की संभावना खुली रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; यीशु के लिए आदरसूचक बहुवचन प्रयोग किया गया है। भाषा सहज किंतु गरिमापूर्ण रखी गई है। ‘चुंगी’ की अपेक्षा अधिक व्यापक और आज समझ में आने वाला ‘कर-वसूली’ चुना गया है।
