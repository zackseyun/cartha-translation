  to: यीशु वहाँ से आगे बढ़े तो उन्होंने मत्ती नाम के एक आदमी को कर-वसूली की चौकी पर बैठे देखा। उन्होंने उससे कहा,[a] “मेरे पीछे चल।” वह उठकर उनके पीछे चल पड़ा।
