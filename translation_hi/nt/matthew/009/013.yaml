id: MAT.9.13
reference: Matthew 9:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: hi
  text: 'पर जाकर सीखो कि इसका क्या अर्थ है: ‘मैं दया चाहता हूँ, बलिदान नहीं।’[a] क्योंकि मैं धर्मियों को नहीं, बल्कि पापियों को बुलाने नहीं आया।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: होशे 6:6 से उद्धृत।
    reason: cross_reference
  - marker: b
    text: ‘धर्मियों’ का अर्थ सम्भवतः उन लोगों से भी हो सकता है जो अपने को धर्मी समझते हैं; यूनानी में केवल ‘धर्मियों’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες δὲ μάθετε
  choice: पर जाकर सीखो
  rationale: अओरिस्ट कृदन्त πορευθέντες अगले आज्ञार्थक μάθετε के साथ मुहावरेदार ढंग से प्रयुक्त है; ‘जाकर सीखो’ स्वाभाविक हिन्दी में उसकी फटकार और आज्ञा दोनों को बनाए रखता है। δέ को प्रसंगानुकूल ‘पर’ से व्यक्त किया गया है।
- source_word: τί ἐστιν
  choice: इसका क्या अर्थ है
  rationale: शाब्दिक रूप ‘यह क्या है’ हो सकता है, पर यहाँ वचन का आशय समझने को कहा गया है; यह हिन्दी में स्वाभाविक और अर्थसंगत अभिव्यक्ति है।
- source_word: Ἔλεος
  choice: दया
  rationale: यह ἔλεος का प्रचलित और व्यापक हिन्दी समतुल्य है तथा होशे के उद्धरण में नैतिक और वाचा-संबंधी अनुग्रह की प्रतिध्वनि को बिना अनावश्यक विस्तार के रखता है।
- source_word: θέλω
  choice: चाहता हूँ
  rationale: दिव्य इच्छा को स्पष्ट, वर्तमान और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐ θυσίαν
  choice: बलिदान नहीं
  rationale: यूनानी विरोध को हिन्दी की स्वाभाविक ‘बलिदान नहीं, दया’ संरचना में रखा गया है; इससे बलिदान के सर्वथा उन्मूलन का अतिरिक्त दावा नहीं जोड़ा जाता।
- source_word: οὐ γὰρ ἦλθον καλέσαι
  choice: क्योंकि मैं ... बुलाने आया हूँ
  rationale: ἦλθον यीशु के आगमन और मिशन को सूचित करता है; हिन्दी में ‘आया हूँ’ वर्तमान प्रसंग में स्वाभाविक है और καλέσαι के व्यापक बुलावे को बनाए रखता है।
- source_word: δικαίους
  choice: धर्मियों
  rationale: विशेषण का संज्ञात्मक प्रयोग उसी श्रेणीगत कथन के रूप में रखा गया है; इसे ‘अपने को धर्मी समझने वालों’ कहकर व्याख्यात्मक रूप से सीमित नहीं किया गया।
- source_word: ἁμαρτωλούς
  choice: पापियों
  rationale: यह मानक संज्ञात्मक अनुवाद है और धर्मियों के साथ मूल पाठ के तीखे विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: होशे 6:6 के उद्धरण में दया और बलिदान का विरोध
  choice: ‘मैं बलिदान नहीं, दया चाहता हूँ’
  alternative: ‘मैं हर प्रकार के बलिदान को अस्वीकार करता हूँ’ अथवा ‘इस अवसर पर मुझे बलिदान से अधिक दया पसंद है’
  rationale: मूल पाठ भविष्यद्वक्ताई विरोध को तीखे रूप में रखता है, पर अपने आप में हर बलिदान के सार्वकालिक उन्मूलन की व्याख्या नहीं करता। हिन्दी क्रम स्वाभाविक रखते हुए उसी तनाव को सुरक्षित रखा गया है।
- issue: ‘धर्मियों’ का संदर्भ
  choice: मूल के अनुसार केवल ‘धर्मियों’
  alternative: ‘जो अपने को धर्मी समझते हैं’ या ‘आत्मधर्मी’
  rationale: प्रसंग में व्यंग्य या आत्मधार्मिकता का संकेत सम्भव है, पर यूनानी पाठ इसे स्पष्ट नहीं करता। इसलिए मुख्य पाठ में वास्तविक धर्मियों और स्वयं को धर्मी मानने वालों के बीच की अस्पष्टता नहीं सुलझाई गई।
- issue: पापियों को बुलाने का उद्देश्य
  choice: केवल ‘बुलाने’ का अनुवाद
  alternative: ‘मन फिराव के लिए बुलाने’
  rationale: इस पद के SBLGNT पाठ में पश्चात्ताप का उद्देश्य-वाक्यांश नहीं है। अतः समानान्तर परम्परा या बाद की पाठ्य-वृद्धि से उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किन्तु गरिमापूर्ण शैली। ‘जाकर सीखो’ में फटकार का स्वर रखा गया है। उद्धरण में हिन्दी की स्वाभाविक विरोधात्मक शब्द-व्यवस्था अपनाई गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
