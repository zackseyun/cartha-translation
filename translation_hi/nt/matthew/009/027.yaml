  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: hi
  text: जब यीशु वहाँ से आगे जा रहे थे, तो दो अंधे पुरुष उनके पीछे हो लिए और पुकारते हुए कहने लगे, “हे दाऊद के पुत्र,[a] हम पर दया कीजिए!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दाऊद के पुत्र” एक राजसी-मसीही उपाधि है, जो यीशु को दाऊद के वंश के प्रतिज्ञा किए गए उत्तराधिकारी के रूप में पहचानती है।
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν τῷ Ἰησοῦ
  choice: जब यीशु वहाँ से आगे जा रहे थे
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ-साथ चल रही गति को व्यक्त करता है। यह अनुवाद उस स्थान से यीशु के आगे बढ़ने और कथा के प्रवाह—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἠκολούθησαν αὐτῷ
  choice: उनके पीछे हो लिए
  rationale: यहाँ ἀκολουθέω का सामान्य कथात्मक अर्थ शारीरिक रूप से पीछे चलना है। ‘पीछे हो लिए’ प्रसंग में स्वाभाविक है और आरम्भिक क्रिया की पूर्णता को व्यक्त करता है।
- source_word: δύο τυφλοὶ
  choice: दो अंधे पुरुष
  rationale: विशेषण का पुल्लिंग बहुवचन रूप यहाँ व्यक्तियों को सूचित करता है। ‘पुरुष’ जोड़ने से हिन्दी में आशय स्पष्ट होता है और मूल का व्याकरणिक लिंग बना रहता है।
- source_word: κράζοντες καὶ λέγοντες
  choice: पुकार-पुकारकर कहने लगे
  rationale: κράζω ऊँची और व्याकुल पुकार को व्यक्त करता है; पुनरुक्ति ‘पुकार-पुकारकर’ उसकी निरंतरता और आग्रह को स्वाभाविक हिन्दी में दिखाती है। ‘कहने लगे’ दूसरे कृदंत को कथात्मक ढंग से व्यक्त करता है।
- source_word: Ἐλέησον ἡμᾶς
  choice: हम पर दया कीजिए
  rationale: आज्ञार्थक रूप यहाँ दयापूर्ण हस्तक्षेप की सीधी विनती है। आदरसूचक ‘कीजिए’ यीशु को किए गए संबोधन के अनुरूप आधुनिक मानक हिन्दी है।
- source_word: υἱὲ Δαυίδ
  choice: हे दाऊद के पुत्र
  rationale: सम्बोधन रूप को ‘हे’ से स्पष्ट किया गया है। ‘दाऊद के पुत्र’ वंशगत अर्थ के साथ मत्ती में उपस्थित राजकीय-मसीही उपाधि की प्रतिध्वनि को भी सुरक्षित रखता है।
theological_decisions:
- issue: ‘दाऊद के पुत्र’ का मसीही महत्व
  choice: मुख्य पाठ में पारंपरिक उपाधि ‘दाऊद के पुत्र’ रखना
  alternative: व्याख्यात्मक रूप ‘दाऊद के वंश से आने वाले मसीहा’
  rationale: यूनानी पाठ उपाधि का प्रयोग करता है, उसकी व्याख्या मुख्य वाक्य में नहीं जोड़ता। पारंपरिक रूप वंशगत और राजकीय-मसीही दोनों अर्थों को खुला रखता है; संक्षिप्त टिप्पणी पाठक को इसकी पृष्ठभूमि बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘पुकार-पुकारकर’ याचना की तीव्रता व्यक्त करता है, जबकि आदरसूचक क्रियापद संबोधन को स्वाभाविक रखता है।
