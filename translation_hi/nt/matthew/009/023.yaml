source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: hi
  text: जब यीशु उस शासक[a] के घर पहुँचे और उन्होंने बाँसुरी बजानेवालों[b] और कोलाहल करती भीड़[c] को देखा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अधिकारी”; समानांतर वृत्तांतों से तुलना करने पर “आराधनालय का अगुआ।” यहाँ मत्ती के मूल शब्द का सीधा अर्थ केवल “शासक” है।
    reason: alternative_reading
  - marker: b
    text: अर्थात अंत्येष्टि के समय प्रथा के अनुसार बाँसुरी बजानेवालों सहित पेशेवर मातम करनेवाले पहले ही वहाँ आ चुके थे।
    reason: cultural_note
  - marker: c
    text: या “हंगामा मचाती भीड़।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: जब यीशु … पहुँचे
  rationale: कालवाचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है और यूनानी कृदन्त के घटनाक्रम को बनाए रखता है।
- source_word: οἰκίαν
  choice: घर
  rationale: यह οἰκία का सीधा, सामान्य और प्रसंगानुकूल अर्थ है।
- source_word: ἄρχοντος
  choice: शासक
  rationale: मत्ती का व्यापक पदनाम सुरक्षित रहता है; समानांतर वृत्तांतों से ‘आराधनालय का अगुआ’ जैसी अधिक विशिष्ट पहचान मुख्य पाठ में नहीं जोड़ी गई।
- source_word: ἰδὼν
  choice: देखा
  rationale: साधारण कथात्मक क्रिया का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: αὐλητὰς
  choice: बाँसुरी बजानेवालों
  rationale: शोक-संस्कार में वाद्य बजानेवालों के लिए स्पष्ट आधुनिक हिन्दी अभिव्यक्ति है।
- source_word: ὄχλον
  choice: भीड़
  rationale: कथात्मक प्रसंग में ὄχλος का सहज और मानक हिन्दी अर्थ है।
- source_word: θορυβούμενον
  choice: कोलाहल करती
  rationale: यह शोर और हलचल का भाव व्यक्त करता है, पर भीड़ की भावना या उद्देश्य को आवश्यकता से अधिक निश्चित नहीं करता।
theological_decisions:
- issue: घर के स्वामी की पहचान
  choice: शासक
  alternative: अधिकारी; समानांतर वृत्तांतों के आधार पर ‘आराधनालय का अगुआ’
  rationale: यूनानी पाठ में यहाँ केवल ἄρχων है। व्यापक पदनाम रखने से समानांतर वृत्तांत की अधिक विशिष्ट सूचना मत्ती के पाठ में आयात नहीं होती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कोलाहल करती’ शोक के दृश्य का श्रव्य पक्ष बताता है, जबकि ‘शासक’ मूल पाठ की व्यापकता बनाए रखता है।
