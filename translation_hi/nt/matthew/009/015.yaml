id: MAT.9.15
reference: Matthew 9:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: hi
  text: और यीशु ने उनसे कहा, “जब तक दूल्हा उनके साथ है, क्या दूल्हे के साथी[a] शोक मना सकते हैं? लेकिन वे दिन आएँगे, जब दूल्हा उनसे छीन लिया जाएगा[b]; तब वे उपवास करेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “विवाह-कक्ष के पुत्र”; यह दूल्हे के साथियों या विवाह-समारोह में उसके साथ रहनेवालों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या “उनसे हटा दिया जाएगा।” कर्मवाच्य अभिव्यक्ति सामान्य विदाई से बढ़कर किसी के द्वारा उसे ले जाए जाने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: दूल्हे के साथी
  rationale: यह शाब्दिक रूप से ‘विवाह-कक्ष के पुत्र’ है, पर यह एक सामी मुहावरा है जो दूल्हे से जुड़े विवाह-समारोह के साथियों को दर्शाता है। ‘दूल्हे के साथी’ आधुनिक हिन्दी में भूमिका को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πενθεῖν
  choice: शोक मना सकते हैं
  rationale: क्रिया शोक या दुःख मनाने को दर्शाती है और यहाँ उपवास के साथ अर्थपूर्ण विरोध बनाती है।
- source_word: ἐφ’ ὅσον
  choice: जब तक
  rationale: यह अवधि-सूचक यूनानी पदबंध का स्वाभाविक हिन्दी रूप है।
- source_word: νυμφίος
  choice: दूल्हा
  rationale: यह विवाह की उपमा को स्पष्ट और सामान्य आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἀπαρθῇ
  choice: छीन लिया जाएगा
  rationale: इस कर्मवाच्य क्रिया में केवल सामान्य विदाई के बजाय हटाए या ले जाए जाने का भाव है। ‘छीन लिया जाएगा’ उस बलपूर्ण संकेत को बचाता है, बिना उसके निहितार्थ को अनुवाद में स्पष्ट व्याख्या बना देने के।
- source_word: νηστεύσουσιν
  choice: वे उपवास करेंगे
  rationale: यह भविष्यकालीन क्रिया का सीधा, स्वाभाविक और धार्मिक संदर्भ में सर्वमान्य हिन्दी रूप है।
- source_word: Μὴ δύνανται ... ;
  choice: क्या ... शोक मना सकते हैं?
  rationale: μή से आरम्भ प्रश्न नकारात्मक उत्तर की अपेक्षा करता है। हिन्दी में संदर्भ सहित यह आलंकारिक प्रश्न उसी आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: लेकिन वे दिन आएँगे
  rationale: यह भावी समय के आगमन की सामान्य अभिव्यक्ति है; ‘लेकिन’ δέ के हल्के विरोध को प्रकट करता है।
theological_decisions:
- issue: दूल्हे की छवि का संभावित मसीही महत्व
  choice: ‘दूल्हा’ की उपमा को बनाए रखा गया है, पर अनुवाद में यीशु को व्याख्यात्मक रूप से ‘मसीही दूल्हा’ नहीं कहा गया।
  alternative: अनुवाद में विस्तार करके यीशु की पहचान मसीही दूल्हे के रूप में स्पष्ट करना।
  rationale: पद स्वयं यह उपमा प्रस्तुत करता है और पाठक उसका धार्मिक निहितार्थ समझ सकते हैं, पर अनुवाद को पाठ से आगे बढ़कर उस निहितार्थ को स्पष्ट सिद्धांत में नहीं बदलना चाहिए।
- issue: ἀπαρθῇ में मृत्यु या हिंसक हटाए जाने का पूर्वसंकेत
  choice: ‘छीन लिया जाएगा’ द्वारा बलपूर्ण हटाए जाने का संकेत रखा गया है, पर मृत्यु को प्रत्यक्ष रूप से नहीं जोड़ा गया।
  alternative: ‘जब उसे मारकर उनसे अलग कर दिया जाएगा’ जैसे व्याख्यात्मक शब्दों से यीशु की मृत्यु स्पष्ट करना।
  rationale: यूनानी कर्मवाच्य सामान्य प्रस्थान से अधिक का संकेत दे सकता है, किंतु इस पद में मृत्यु प्रत्यक्ष रूप से नहीं कही गई; अतः संकेत को सुरक्षित रखते हुए उसे निर्णायक व्याख्या नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘दूल्हे के साथी’ अस्पष्ट शाब्दिक मुहावरे से बचता है; मुख्य पाठ के दोनों पादटिप्पणी-चिह्न [a] और [b] संबद्ध शब्दों पर लगाए गए हैं।
