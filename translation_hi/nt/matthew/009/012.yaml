source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: hi
  text: पर उसने यह सुनकर कहा, “जो स्वस्थ हैं, उन्हें चिकित्सक की आवश्यकता नहीं है, पर जो बीमार हैं, उन्हें है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: जब उसने यह सुना
  rationale: एओरिस्ट कृदंत का यहाँ समयसूचक भाव है। पूर्ववर्ती कथन को संकेतित कर्म मानकर ‘यह’ जोड़ना स्वाभाविक हिन्दी है।
- source_word: δὲ
  choice: पर
  rationale: δέ यहाँ हल्का विरोध अथवा प्रसंगगत मोड़ दिखाता है; ‘पर’ इसे सहज रूप में व्यक्त करता है।
- source_word: εἶπεν
  choice: कहा
  rationale: मूल में सामान्य कथन-क्रिया है; ‘उत्तर दिया’ प्रसंगानुकूल होता, पर मूल से अधिक व्याख्यात्मक होता।
- source_word: Οὐ χρείαν ἔχουσιν
  choice: आवश्यकता नहीं
  rationale: χρείαν ἔχειν की संज्ञात्मक अभिव्यक्ति को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: οἱ ἰσχύοντες
  choice: जो भले-चंगे हैं
  rationale: ἰσχύω का मूल भाव सामर्थ्यवान होना है, किंतु चिकित्सकीय विरोध में इसका आशय स्वस्थ लोगों से है। ‘भले-चंगे’ साधारण आधुनिक हिन्दी में इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἰατροῦ
  choice: वैद्य
  rationale: ἰατρός का अर्थ चिकित्सक है। ‘वैद्य’ इस लोकोक्तिपरक कथन में संक्षिप्त, परिचित और गरिमापूर्ण है।
- source_word: οἱ κακῶς ἔχοντες
  choice: जो बीमार हैं
  rationale: κακῶς ἔχειν यहाँ अस्वस्थ या बीमार होने का प्रचलित मुहावरा है; ‘बीमार’ सबसे स्पष्ट और सहज हिन्दी है।
theological_decisions:
- issue: कहावत का रूपकात्मक अथवा केवल शारीरिक अर्थ
  choice: मुख्य पाठ में कथन को सीधे चिकित्सकीय भाषा में रखा गया है।
  alternative: ‘पापियों’ की आत्मिक आवश्यकता को अनुवाद में ही स्पष्ट कर देना।
  rationale: प्रसंग इस कहावत का आत्मिक अनुप्रयोग बताता है, किंतु यूनानी वाक्य स्वयं चिकित्सकीय चित्र प्रस्तुत करता है। उसे बनाए रखने से अर्थगत और धर्मवैचारिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, संक्षिप्त और गरिमापूर्ण शैली। ‘भले-चंगे’ चिकित्सा-संदर्भ में οἱ ἰσχύοντες का स्वाभाविक मुहावरेदार प्रतिरूप है, जबकि ‘वैद्य’ कथन के लोकोक्तिपरक स्वर को बनाए रखता है।
