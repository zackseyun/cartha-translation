lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: साधारण समुच्चयबोधक के रूप में यह पिछले वृत्तांत से क्रिया को जोड़ता है और यूनानी की सरल कथात्मक गति बनाए रखता है।
- source_word: ἐγερθεὶς
  choice: वह उठकर
  rationale: ἐγείρω के इस अकर्तृवाच्य रूप का यहाँ अकर्मक अर्थ है। ‘उठकर’ हिन्दी में स्वाभाविक है और मुख्य क्रिया से पहले की क्रिया को ठीक प्रकार व्यक्त करता है।
- source_word: ἀπῆλθεν
  choice: चला गया
  rationale: ἀπέρχομαι यहाँ उस स्थान से प्रस्थान करने को व्यक्त करता है। ‘चला गया’ आधुनिक हिन्दी में स्वाभाविक और अर्थानुकूल है।
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: अपने घर
  rationale: εἰς गंतव्य की ओर गति और οἶκος निवास-स्थान को दर्शाता है। कर्ता की ओर लौटते αὐτοῦ के लिए हिन्दी का ‘अपने’ स्वाभाविक है; ‘घर’ ठोस अर्थ और घरेलू निवास दोनों को बनाए रखता है।
