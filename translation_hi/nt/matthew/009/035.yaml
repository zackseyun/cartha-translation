id: MAT.9.35
reference: Matthew 9:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: hi
  text: और यीशु सब नगरों और गाँवों में घूमते रहे। वे उनके सभाघरों में शिक्षा देते, राज्य का शुभ समाचार[a] घोषित करते और हर प्रकार के रोग और हर प्रकार की दुर्बलता[b] को चंगा करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राज्य का सुसमाचार।”
    reason: lexical_alternative
  - marker: b
    text: या, “हर प्रकार के रोग और हर प्रकार की बीमारी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: घूमते रहे
  rationale: अपूर्ण भूतकाल की क्रिया यीशु की लगातार और स्थान-स्थान की यात्रा को व्यक्त करती है; ‘घूमते रहे’ आधुनिक हिन्दी में इस जारी गतिविधि को स्वाभाविक रूप से दर्शाता है।
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: सब नगरों और गाँवों
  rationale: ‘नगर’ और ‘गाँव’ बड़े और छोटे आबादी-केंद्रों के बीच यूनानी भेद को बनाए रखते हैं, जबकि ‘सब’ संयुक्त व्यापकता को व्यक्त करता है।
- source_word: διδάσκων
  choice: शिक्षा देते
  rationale: यह जारी सहवर्ती कार्य को सरल और प्रतिष्ठित आधुनिक हिन्दी में व्यक्त करता है।
- source_word: συναγωγαῖς αὐτῶν
  choice: उनके सभाघरों
  rationale: ‘सभाघर’ ऐतिहासिक धार्मिक सभा-स्थान को दर्शाता है और αὐτῶν के ‘उनके’ को भी बनाए रखता है, बिना अनावश्यक व्याख्यात्मक विस्तार के।
- source_word: κηρύσσων
  choice: घोषणा करते
  rationale: यह κηρύσσω की सार्वजनिक, संदेशवाहक-सदृश घोषणा की शक्ति को व्यक्त करता है और केवल औपचारिक धार्मिक प्रवचन का अर्थ नहीं थोपता।
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: राज्य के शुभ समाचार
  rationale: ‘शुभ समाचार’ εὐαγγέλιον का अर्थ सामान्य पाठक के लिए स्पष्ट करता है और ‘राज्य के’ संबंधसूचक पदबंध को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: θεραπεύων
  choice: चंगा करते
  rationale: सुसमाचारों में यीशु के आरोग्य देने के कार्य के लिए ‘चंगा करना’ स्वाभाविक और प्रचलित हिन्दी है।
- source_word: πᾶσαν νόσον
  choice: हर प्रकार के रोग
  rationale: νόσος के लिए ‘रोग’ सीधा और व्यापक शब्द है; एकवचन πᾶσαν का वितरणात्मक भाव हिन्दी में ‘हर प्रकार के’ से स्वाभाविक रूप से आता है।
- source_word: πᾶσαν μαλακίαν
  choice: हर प्रकार की दुर्बलता
  rationale: μαλακία बीमारी के साथ शारीरिक कमजोरी या अशक्तता का अर्थ भी रख सकता है; ‘दुर्बलता’ νόσος से उसका शब्दार्थिक भेद बनाए रखती है।
theological_decisions:
- issue: εὐαγγέλιον का अनुवाद
  choice: शुभ समाचार
  alternative: सुसमाचार
  rationale: ‘शुभ समाचार’ मूल शब्द का अर्थ आधुनिक पाठक के लिए पारदर्शी बनाता है; पारंपरिक ‘सुसमाचार’ को पाद-टिप्पणी में रखा गया है।
- issue: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν में चंगाई का व्यापक दायरा
  choice: हर प्रकार के रोग और हर प्रकार की दुर्बलता
  alternative: हर रोग और हर बीमारी
  rationale: दोनों बार आए πᾶσαν की व्यापकता को दोनों पदों में बनाए रखा गया है और νόσος तथा μαλακία को एक ही शब्द में मिलाया नहीं गया; इससे कथन की व्यापकता सुरक्षित रहती है, पर कोई अतिरिक्त सिद्धान्त नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मुख्य वाक्य के बाद छोटे समन्वित खंड हिन्दी में पठनीयता बढ़ाते हैं और यूनानी के तीन वर्तमान कृदंतों—शिक्षा देना, घोषणा करना और चंगा करना—को समानांतर जारी कार्यों के रूप में बनाए रखते हैं।
