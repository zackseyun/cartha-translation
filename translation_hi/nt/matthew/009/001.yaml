  edition: SBLGNT
  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: hi
  text: और नाव पर चढ़कर वह पार गया और अपने नगर में आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβὰς
  choice: नाव पर चढ़कर
  rationale: अओरिस्ट कृदन्त मुख्य क्रियाओं से पहले हुई क्रिया बताता है; ‘चढ़कर’ हिन्दी में इस क्रम को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: πλοῖον
  choice: नाव
  rationale: यह जलयान के लिए सामान्य शब्द है; गलील की झील के प्रसंग में ‘नाव’ स्वाभाविक है। यूनानी में अनिश्चित उपपद का अभाव हिन्दी में किसी अतिरिक्त संकेत की माँग नहीं करता।
- source_word: διεπέρασεν
  choice: झील के पार गया
  rationale: διαπεράω एक ओर से दूसरी ओर पार जाने का भाव रखता है। हिन्दी में केवल ‘पार गया’ भी संभव है, पर ‘झील के’ प्रसंगगत माध्यम को स्पष्ट करता है और कोई नया भौगोलिक निष्कर्ष नहीं जोड़ता।
- source_word: ἦλθεν
  choice: आया
  rationale: ἔρχομαι का मूल अर्थ ‘आना/जाना’ है; कथावाचक दृष्टि के अनुरूप ‘आया’ सीधा अनुवाद है।
- source_word: τὴν ἰδίαν πόλιν
  choice: अपने नगर
  rationale: ἴδιος यीशु के साथ निजी संबंध या संबद्धता पर बल देता है। ‘अपने नगर’ इस अर्थ को सुरक्षित रखता है और इसे निश्चित रूप से ‘जन्मनगर’ या ‘गृहनगर’ नहीं बनाता।
- source_word: Καὶ ... καὶ
  choice: और ... और
  rationale: दोनों καί सरल कथात्मक क्रम में घटनाओं को जोड़ते हैं; उनकी पुनरावृत्ति मत्ती की संयोजक शैली को स्वाभाविक हिन्दी में बनाए रखती है।
theological_decisions:
- issue: ‘अपने नगर’ की पहचान
  choice: मुख्य पाठ में नगर का नाम बताए बिना ‘अपने नगर’ रखा गया।
  alternative: संदर्भ के आधार पर इसे कफरनहूम या गलील में यीशु का कार्य-केंद्र समझना।
  rationale: यूनानी पाठ नगर का नाम नहीं बताता। इसलिए अनुवाद उसकी वास्तविक अस्पष्टता को बनाए रखता है और संदर्भ से संभावित पहचान को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘नगर’ स्रोत के πόλις के अनुरूप है, जबकि ‘चढ़कर’ और ‘पार गया’ सामान्य पाठकों के लिए सहज हैं। कोई पादटिप्पणी आवश्यक नहीं, क्योंकि ‘अपने नगर’ मूल की अस्पष्टता को मुख्य पाठ में ही सुरक्षित रखता है।
