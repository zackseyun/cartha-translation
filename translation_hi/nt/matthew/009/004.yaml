  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: hi
  text: और यीशु ने उनके विचार जानकर[a] कहा, “तुम अपने-अपने हृदय में बुरी बातें क्यों सोच रहे हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके विचारों को भाँपकर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: जानकर
  rationale: यह कृदन्त यीशु को उनके भीतरी विचारों से अवगत बताता है। ‘जानकर’ संक्षिप्त, स्वाभाविक है और पाठ के कथन को किसी अतिरिक्त सिद्धान्तात्मक व्याख्या के बिना बनाए रखता है।
- source_word: ἐνθυμήσεις
  choice: विचार
  rationale: यह शब्द मन के भीतर चलने वाले विचार या तर्क-वितर्क को दर्शाता है; यहाँ ‘विचार’ आधुनिक हिन्दी में सहज और संदर्भानुकूल है।
- source_word: Ἱνατί
  choice: क्यों
  rationale: यह कारण या उद्देश्य पूछने वाला प्रश्नवाचक शब्द है; ‘क्यों’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἐνθυμεῖσθε
  choice: सोच रहे हो
  rationale: वर्तमानकालीन क्रिया भीतर चल रही सोच को दर्शाती है; ‘सोच रहे हो’ उसकी जारी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πονηρὰ
  choice: बुरी बातें
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘बुरी बातें’ उस बहुवचन भाव को स्पष्ट रखता है, बिना उसे केवल इरादों या किसी अन्य अधिक विशिष्ट अर्थ तक सीमित किए।
- source_word: καρδίαις
  choice: हृदयों
  rationale: ‘हृदय’ मूल पाठ के उस रूपक को बनाए रखता है जिसमें भीतर के विचार और अभिप्राय शामिल हैं; ‘मन’ अधिक सहज होता, पर स्रोत की छवि को संकुचित कर देता।
theological_decisions:
- issue: यीशु द्वारा अनकहे भीतरी विचारों को जानना
  choice: यीशु ने उनके विचार जानकर
  alternative: यीशु ने उनके विचार भाँपकर
  rationale: ‘जानकर’ पाठ में यीशु की उनके भीतर के विचारों के प्रति निश्चित जानकारी को सीधे व्यक्त करता है, पर उस कथन को किसी विस्तृत मसीही सिद्धान्त में नहीं बदलता। ‘भाँपकर’ सम्भव है, किन्तु अनुमान लगाने का भाव दे सकता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘अपने हृदयों में’ सामान्य बोलचाल की अपेक्षा कुछ अधिक शास्त्रीय है, पर मूल यूनानी के हृदय-रूपक और प्रत्येक व्यक्ति की भीतरी अवस्था को सुरक्षित रखता है।
