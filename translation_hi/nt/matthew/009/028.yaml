id: MAT.9.28
reference: Matthew 9:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: hi
  text: जब वह घर में गया[a], तो वे अंधे उसके पास आए। यीशु ने उनसे कहा, “क्या तुम विश्वास करते हो कि मैं यह कर सकता हूँ?” उन्होंने उससे कहा, “हाँ, प्रभु[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वह घर में आया।”
    reason: ‘गया’ प्रसंगगत दृष्टिकोण से स्वाभाविक है; यूनानी क्रिया को ‘आया’ भी अनूदित किया जा सकता है।
  - marker: b
    text: या, “महोदय।” यूनानी शब्द सम्मानसूचक संबोधन भी हो सकता है।
    reason: κύριε में ‘प्रभु’ और विनम्र ‘महोदय’—दोनों अर्थों की संभावना है।
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: जब वह घर में गया
  rationale: कालवाचक कृदन्त को स्वाभाविक हिन्दी उपवाक्य से व्यक्त किया गया है। εἰς दिशा और भीतर जाने का भाव देता है; ‘घर में गया’ सरल और सटीक है।
- source_word: προσῆλθον αὐτῷ
  choice: उसके पास आए
  rationale: προσέρχομαι का यहाँ अर्थ किसी व्यक्ति के निकट आना है। ‘उसके पास आए’ सामान्य हिन्दी में स्वाभाविक है और पहले क्रियापद की अनावश्यक पुनरावृत्ति भी नहीं करता।
- source_word: οἱ τυφλοί
  choice: वे अंधे
  rationale: विशेषण संज्ञा के रूप में प्रयुक्त है और निकटवर्ती प्रसंग में पहले से बताए गए दो पुरुषों की ओर संकेत करता है; ‘वे अंधे’ इस संदर्भ-संबंध को बनाए रखता है।
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: यीशु ने उनसे कहा
  rationale: यूनानी का ऐतिहासिक वर्तमान हिन्दी की स्वाभाविक कथा-शैली में सामान्य भूतकाल से व्यक्त किया गया है; कथन की विषयवस्तु अपरिवर्तित रहती है।
- source_word: Πιστεύετε
  choice: क्या तुम विश्वास करते हो
  rationale: πιστεύω यहाँ यीशु की सामर्थ्य पर भरोसा/विश्वास रखने के अर्थ में है। ‘विश्वास करते हो’ साधारण और धार्मिक दोनों संदर्भों में स्पष्ट है।
- source_word: ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: कि मैं यह कर सकता हूँ
  rationale: δύναμαι की सामर्थ्य और τοῦτο के प्रसंगगत संकेत—चंगाई करना—दोनों को बिना अतिरिक्त व्याख्या जोड़े स्वाभाविक हिन्दी में रखा गया है।
- source_word: λέγουσιν αὐτῷ
  choice: उन्होंने उससे कहा
  rationale: ऐतिहासिक वर्तमान को हिन्दी कथा के सामान्य भूतकाल में प्रस्तुत किया गया है। एकवचन ‘उससे’ यूनानी αὐτῷ के अनुरूप यीशु की ओर संकेत करता है।
- source_word: Ναί
  choice: हाँ
  rationale: साधारण सकारात्मक उत्तर का सीधा और स्वाभाविक हिन्दी समानार्थक।
- source_word: κύριε
  choice: प्रभु
  rationale: κύριε सम्मानसूचक संबोधन भी हो सकता है और यीशु के अधिकार की पहचान भी व्यक्त कर सकता है। ‘प्रभु’ इस संभावित गहराई को बनाए रखता है; वैकल्पिक सम्मानसूचक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: यीशु के लिए संबोधन κύριε
  choice: प्रभु
  alternative: महोदय
  rationale: मूल शब्द केवल विनम्र संबोधन से लेकर अधिकार की गहरी स्वीकृति तक अर्थ दे सकता है। मुख्य पाठ में ‘प्रभु’ रखने से संभावित मसीही आशय मिटता नहीं, जबकि पादटिप्पणी यह स्पष्ट करती है कि यहाँ केवल सम्मानसूचक संबोधन भी संभव है।
- issue: λέγει और λέγουσιν के ऐतिहासिक वर्तमान
  choice: 'हिन्दी कथा में सामान्य भूतकाल: ‘कहा’'
  alternative: 'ऐतिहासिक वर्तमान: ‘कहते हैं’'
  rationale: हिन्दी में इन क्रियाओं को वर्तमान में रखने से काल-परिवर्तन अस्वाभाविक रूप से उभर सकता है। भूतकाल घटना-क्रम को सहज रखता है और कोई धर्मवैज्ञानिक अर्थ निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में ‘तुम’ मूल के बहुवचन दूसरे पुरुष को स्वाभाविक हिन्दी में व्यक्त करता है। ‘अंधे’ प्रसंग में पहले से पहचाने गए व्यक्तियों के लिए प्रयुक्त है; अनावश्यक चिकित्सकीय या व्याख्यात्मक शब्दावली नहीं जोड़ी गई।
