id: MAT.9.17
reference: Matthew 9:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: hi
  text: न ही लोग नया दाखरस पुरानी मशकों में भरते हैं। नहीं तो मशकें फट जाती हैं, दाखरस बह जाता है और मशकें नष्ट हो जाती हैं। इसके बजाय, लोग नया दाखरस नई[a] मशकों में भरते हैं, और दोनों सुरक्षित रहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘नए’ दाखरस (νέος) और नई अथवा ताज़ी दशा की मशकों (καινός) के लिए अलग-अलग शब्द हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: न ही
  rationale: यह पिछले कथन से जुड़ा एक और नकारात्मक उदाहरण प्रस्तुत करता है; ‘न ही’ उसके संयोजक और नकारात्मक बल को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: βάλλουσιν
  choice: भरते हैं
  rationale: दाखरस को मशकों में रखने के संदर्भ में ‘भरते हैं’ हिंदी में ‘डालते हैं’ से अधिक स्वाभाविक और सटीक है।
- source_word: οἶνον νέον
  choice: नया दाखरस
  rationale: यह हाल में बने दाखरस के लिए प्रचलित और सीधा अनुवाद है।
- source_word: ἀσκούς
  choice: मशकों
  rationale: ‘मशक’ चमड़े के उस प्राचीन पात्र को स्पष्ट रूप से व्यक्त करती है जिसमें दाखरस रखा जाता था।
- source_word: παλαιούς
  choice: पुरानी
  rationale: यह आयु और दशा में पुरानी मशकों का सीधा वर्णन है और आगे आने वाले καινούς से विरोध बनाता है।
- source_word: εἰ δὲ μή γε
  choice: नहीं तो
  rationale: यह चेतावनी और उसके परिणाम का संबंध स्वाभाविक, संक्षिप्त हिंदी में व्यक्त करता है।
- source_word: ῥήγνυνται
  choice: फट जाती हैं
  rationale: दबाव के कारण चमड़े की मशकों के टूटकर खुल जाने का सजीव और प्रसंगानुकूल वर्णन है।
- source_word: ἐκχεῖται
  choice: बह जाता है
  rationale: मशकों के फटने पर दाखरस के बाहर निकलकर नष्ट होने का परिणाम हिंदी में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: ἀπόλλυνται
  choice: नष्ट हो जाती हैं
  rationale: यह बताता है कि मशकें अनुपयोगी हो जाती हैं; हिंदी में मूल क्रिया के विनाश या हानि के भाव को बनाए रखता है।
- source_word: ἀλλὰ
  choice: इसके बजाय
  rationale: यह गलत व्यवहार के विपरीत उचित व्यवहार प्रस्तुत करने वाले सुधारात्मक विरोध को स्पष्ट करता है।
- source_word: καινούς
  choice: नई
  rationale: मशकों की नई अथवा ताज़ी दशा को दर्शाता है। सहज हिंदी के लिए मुख्य पाठ में ‘नई’ रखा गया है, जबकि नए दाखरस और नई दशा की मशकों के बीच यूनानी शब्दों का अंतर पादटिप्पणी में बताया गया है।
- source_word: ἀμφότεροι συντηροῦνται
  choice: दोनों सुरक्षित रहते हैं
  rationale: यह दाखरस और मशकों, दोनों के बचाए या सुरक्षित रखे जाने को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: एक ही पद में νέος और καινός का अंतर
  choice: दोनों के लिए मुख्य पाठ में ‘नया/नई’, और शब्दगत अंतर पादटिप्पणी में स्पष्ट करना
  alternative: νέος के लिए ‘नया’ और καινός के लिए ‘ताज़ी’ या ‘नई दशा की’ लिखना
  rationale: यूनानी में दाखरस के लिए νέος और मशकों के लिए καινός आया है। हिंदी में ‘ताज़ी मशकें’ अस्वाभाविक लग सकता है और ‘नई दशा की मशकें’ पाठ को बोझिल बनाता है। इसलिए सहज मुख्य पाठ के साथ पादटिप्पणी मूल की सूक्ष्मता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, वर्तमान और गरिमापूर्ण शैली रखी गई है। ‘दाखरस’ और ‘मशक’ बाइबिलीय संदर्भ में परिचित तथा ऐतिहासिक वस्तु के लिए सटीक शब्द हैं।
