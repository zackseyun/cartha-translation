base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: hi
  text: और दुष्टात्मा को निकाल दिए जाने पर गूँगा आदमी[a] बोला। भीड़ के लोग चकित होकर कहने लगे, “इस्राएल में ऐसा कभी नहीं देखा गया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहरा आदमी।” यूनानी शब्द का अर्थ “बहरा” या “गूँगा” दोनों हो सकता है; यहाँ संदर्भ “गूँगा” अर्थ के पक्ष में है, क्योंकि इस बात पर बल है कि वह बोला।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: जब ... निकाल दी गई
