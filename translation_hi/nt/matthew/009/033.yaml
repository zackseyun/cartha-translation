- source_word: τοῦ δαιμονίου
  choice: दुष्टात्मा
  rationale: सुसमाचारों के झाड़ने-निकालने के प्रसंग में δαιμόνιον एक अलौकिक दुष्ट सत्ता को दर्शाता है; आधुनिक हिंदी में ‘दुष्टात्मा’ स्पष्ट और प्रचलित है।
- source_word: ἐλάλησεν
  choice: बोला
  rationale: सरल एओरिस्ट को सरल पूर्ण क्रिया से व्यक्त किया गया है; ‘बोलने लगा’ क्रिया के आरंभ पर ऐसा अतिरिक्त बल डाल सकता है जो रूप में स्पष्ट नहीं है।
- source_word: ὁ κωφός
  choice: गूँगा आदमी
  rationale: κωφός का अर्थ ‘बहरा’ या ‘गूँगा’ दोनों हो सकता है, पर तत्काल परिणाम ‘बोला’ होने के कारण यहाँ बोल न सकने की अवस्था पर बल है। ‘आदमी’ पिछले पद के संदर्भ से स्वाभाविक रूप से पूरा किया गया है।
- source_word: ἐθαύμασαν
  choice: चकित होकर
  rationale: क्रिया भीड़ के आश्चर्य और विस्मय को व्यक्त करती है; यह आधुनिक हिंदी में सहज है और साथ वाली बोलने की क्रिया से स्वाभाविक रूप से जुड़ती है।
- source_word: οἱ ὄχλοι
  choice: भीड़ के लोग
  rationale: यूनानी में बहुवचन ‘भीड़ें’ है, किंतु हिंदी में ‘भीड़ के लोग’ अधिक स्वाभाविक है और सामूहिक प्रतिक्रिया को स्पष्ट रखता है।
- source_word: Οὐδέποτε
  choice: कभी नहीं
  rationale: यह यूनानी के पूर्ण निषेध ‘कभी नहीं’ को सीधे व्यक्त करता है।
- source_word: ἐφάνη
  choice: देखा नहीं गया
  rationale: φαίνω का कर्मवाच्य रूप यहाँ ‘दिखाई देना/देखा जाना’ अर्थ दे सकता है; घटना के लिए ‘ऐसा कभी देखा नहीं गया’ स्वाभाविक हिंदी है और अभूतपूर्वता बनाए रखता है।
- source_word: οὕτως
  choice: ऐसा
  rationale: यह अभी हुई घटना के प्रकार या ढंग की ओर संकेत करता है; हिंदी में ‘ऐसा’ संक्षिप्त और स्वाभाविक है।
- source_word: ἐν τῷ Ἰσραήλ
  choice: इस्राएल में
  rationale: यह वाक्यांश स्थान अथवा इस्राएल के लोगों के बीच के व्यापक क्षेत्र को खुला रखते हुए मूल का सीधा समतुल्य है।
theological_decisions:
- issue: चंगाई और दुष्टात्मा निकाले जाने के प्रसंग में κωφός का अर्थ-क्षेत्र
  choice: ‘गूँगा आदमी’
  alternative: ‘बहरा आदमी’
  rationale: शब्द दोनों अर्थ दे सकता है, इसलिए विकल्प पाद-टिप्पणी में रखा गया है; किंतु ‘वह बोला’ तत्काल संदर्भ में गूँगेपन को प्रमुख बनाता है और बिना आधार कोई दूसरी शारीरिक अवस्था नहीं जोड़ता।
- issue: भीड़ के कथन में ἐφάνη का भाव
  choice: ‘ऐसा कभी देखा नहीं गया’
  alternative: ‘ऐसा कभी प्रकट नहीं हुआ’
  rationale: कर्मवाच्य रूप के ‘देखे जाने’ और ‘प्रकट होने’ दोनों भाव संभव हैं। इस प्रसंग में हिंदी का कर्मवाच्य ‘देखा नहीं गया’ अधिक स्वाभाविक है और किसी विशेष धार्मिक ‘प्रकटीकरण’ का अनावश्यक अर्थ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भीड़ें’ की अस्वाभाविक हिंदी से बचने के लिए ‘भीड़ के लोग’ कहा गया है। पाद-टिप्पणी का चिह्न उसी शब्द-समूह के बाद रखा गया है जिससे उसका वास्तविक संबंध है।
