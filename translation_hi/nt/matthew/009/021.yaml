  edition: SBLGNT
  text: ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: hi
  text: क्योंकि वह मन ही मन कह रही थी, “यदि मैं केवल उसके वस्त्र को छू लूँ, तो मैं बच जाऊँगी[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं चंगी हो जाऊँगी” अथवा “मैं स्वस्थ हो जाऊँगी।” यूनानी पाठ में शाब्दिक अर्थ “मैं बच जाऊँगी” है; प्रयुक्त क्रिया इस प्रसंग में चंगा होने का अर्थ भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: कह रही थी
  rationale: अपूर्ण भूतकाल की निरंतर या बार-बार होने वाली आंतरिक वाणी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह आसपास के वृत्तांत के लिए स्पष्टीकरण प्रस्तुत करने वाले संयोजक का अर्थ स्पष्ट करता है।
- source_word: ἐν ἑαυτῇ
  choice: मन ही मन
  rationale: आंतरिक कथन या विचार के लिए यह आधुनिक हिन्दी का स्वाभाविक मुहावरा है।
- source_word: Ἐὰν μόνον
  choice: यदि मैं केवल
  rationale: शर्त के साथ इस बात पर बल बनाए रखता है कि वस्त्र छूना ही पर्याप्त होगा।
- source_word: ἅψωμαι
  choice: छू लूँ
  rationale: ἐάν के साथ प्रयुक्त संभावनार्थक क्रिया को हिन्दी में स्वाभाविक शर्तसूचक रूप देता है; यहाँ अर्थ छूना है, पकड़ना आवश्यक नहीं।
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: उसके वस्त्र को
  rationale: ἱμάτιον किसी वस्त्र, विशेषतः बाहरी वस्त्र, को सूचित कर सकता है; ‘वस्त्र’ अनावश्यक विशिष्टीकरण से बचता है।
- source_word: σωθήσομαι
  choice: मैं बच जाऊँगी
  rationale: σῴζω के व्यापक अर्थ—बचाया जाना और सन्दर्भानुसार चंगा होना—को मुख्य पाठ में बनाए रखता है; शारीरिक चंगाई का सन्दर्भ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: चंगाई के प्रसंग में σωθήσομαι का अनुवाद
  choice: मैं बच जाऊँगी
  alternative: मैं चंगी हो जाऊँगी; मैं स्वस्थ हो जाऊँगी
  rationale: तात्कालिक प्रसंग शारीरिक चंगाई का है, पर यूनानी क्रिया σῴζω अधिक व्यापक है और बचाए जाने का अर्थ भी रखती है। मुख्य पाठ में इसकी व्यापकता और सम्भावित धर्मवैज्ञानिक अनुगूँज सुरक्षित रखी गई है, जबकि प्रसंगगत अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मन ही मन’ आंतरिक वाणी को स्वाभाविक रूप से व्यक्त करता है, और ‘वस्त्र’ मूल शब्द को किसी विशेष प्रकार के परिधान तक सीमित नहीं करता।
