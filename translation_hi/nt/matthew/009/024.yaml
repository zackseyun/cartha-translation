base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: hi
  text: वह कह रहा था, “यहाँ से चले जाओ, क्योंकि लड़की मरी नहीं है, बल्कि सो रही है।” और वे उसका उपहास कर रहे थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उस पर हँस रहे थे।” यूनानी क्रिया किसी का उपहास करते हुए हँसने का अर्थ भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: वह कह रहा था
  rationale: अपूर्ण भूतकाल दृश्य में जारी या बार-बार कही जा रही बात का संकेत देता है; यह रूप उस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Ἀναχωρεῖτε
  choice: हट जाओ
  rationale: बहुवचन आज्ञार्थक उपस्थित लोगों को वहाँ से हटने के लिए कहता है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: οὐ γὰρ
  choice: क्योंकि ... नहीं
  rationale: γάρ पिछली आज्ञा का कारण देता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ἀπέθανεν
  choice: मरी नहीं है
  rationale: क्रिया मृत्यु की घटना को बताती है; हिन्दी का यह पूर्ण पक्ष वर्तमान स्थिति से उसके संबंध को बनाए रखता है।
- source_word: τὸ κοράσιον
  choice: लड़की
  rationale: κοράσιον एक लड़की, प्रायः कम उम्र की लड़की, को दर्शाता है; ‘लड़की’ बिना अतिरिक्त बल जोड़े स्वाभाविक है।
- source_word: ἀλλὰ καθεύδει
  choice: बल्कि सो रही है
  rationale: वर्तमान काल मौजूदा अवस्था या क्रिया को व्यक्त करता है; ‘सो रही है’ यीशु द्वारा रखे गए विरोध को बनाए रखता है।
- source_word: κατεγέλων αὐτοῦ
  choice: वे उसकी हँसी उड़ाने लगे
  rationale: क्रिया उपहासपूर्वक किसी पर हँसने को व्यक्त करती है। ‘हँसी उड़ाना’ हिन्दी में उपहास का अर्थ स्पष्ट करता है, और ‘लगे’ चल रही या आरंभ हुई प्रतिक्रिया को दृश्यात्मक ढंग से व्यक्त करता है।
theological_decisions:
- issue: यीशु का कथन कि लड़की ‘मरी नहीं है, बल्कि सो रही है’
  choice: मुख्य पाठ में ‘सो रही है’ को बिना व्याख्यात्मक विस्तार के बनाए रखा गया।
  alternative: ‘केवल सो रही है’ कहना या मुख्य पाठ में नींद को मृत्यु का रूपक बताना।
  rationale: यूनानी पाठ यीशु के कथन को जानबूझकर तीखे विरोध के रूप में प्रस्तुत करता है। ‘सो रही है’ को ज्यों का त्यों रखने से यह अस्पष्टता और धर्मवैचारिक तनाव बना रहता है कि कथन रूपकात्मक, दृश्यगत अथवा आने वाले पुनर्जीवन की दृष्टि से है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। संवाद में ‘हट जाओ’ सीधा है, पर अनावश्यक रूप से कठोर या पुरातन नहीं।
