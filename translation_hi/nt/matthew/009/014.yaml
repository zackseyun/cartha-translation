source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: hi
  text: तब यूहन्ना के चेले यीशु के पास आए और कहने लगे, “क्या कारण है कि हम और फ़रीसी तो अकसर[a] उपवास रखते हैं, लेकिन आपके चेले उपवास नहीं रखते?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत उपवास रखते हैं” अथवा “कई बार उपवास रखते हैं”; यूनानी में πολλά यहाँ उपवास रखने की बारंबारता या मात्रा व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह अगले प्रसंग को क्रम में जोड़ने वाला स्वाभाविक और संक्षिप्त कालसूचक शब्द है।
- source_word: προσέρχονται αὐτῷ
  choice: यीशु के पास आए
  rationale: क्रिया का अर्थ पास आना है। सर्वनाम के संकेतित व्यक्ति को स्पष्ट करने के लिए हिन्दी में ‘यीशु’ रखा गया है।
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: यूहन्ना के चेले
  rationale: ‘चेले’ आधुनिक सामान्य हिन्दी में गुरु के अनुयायियों के लिए सहज बाइबलीय शब्द है; Ἰωάννου को प्रचलित हिन्दी नाम ‘यूहन्ना’ से व्यक्त किया गया है।
- source_word: λέγοντες
  choice: और कहने लगे
  rationale: समकालिक कृदन्त को स्वाभाविक हिन्दी कथन-शैली में मुख्य क्रिया से जोड़कर व्यक्त किया गया है।
- source_word: Διὰ τί
  choice: क्या कारण है कि
  rationale: यह प्रश्न के कारणात्मक बल को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: हम और फ़रीसी
  rationale: मूल का बलयुक्त ‘हम’ और तुलना में उल्लिखित फ़रीसियों—दोनों को यथावत रखा गया है।
- source_word: νηστεύομεν
  choice: उपवास रखते हैं
  rationale: धार्मिक उद्देश्य से भोजन से विरत रहने के लिए यह मानक और सामान्य हिन्दी अभिव्यक्ति है।
- source_word: πολλά
  choice: अकसर
  rationale: νηστεύω के साथ πολλά क्रियाविशेषण रूप में बारंबार अभ्यास का भाव देता है; ‘अकसर’ वर्तमान हिन्दी में स्वाभाविक है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: οἱ δὲ μαθηταί σου
  choice: लेकिन आपके चेले
  rationale: δέ के विरोधात्मक बल को ‘लेकिन’ से व्यक्त किया गया है; सम्बोधन में आदरसूचक ‘आपके’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: οὐ νηστεύουσιν
  choice: उपवास नहीं रखते
  rationale: वर्तमान काल यहाँ सामान्य अभ्यास को सूचित करता है, न कि केवल उस क्षण चल रही क्रिया को।
theological_decisions:
- issue: उपवास के विषय में शिकायत का स्वरूप
  choice: प्रश्न को नियमित धार्मिक अभ्यासों की तुलना के रूप में प्रस्तुत किया गया है।
  alternative: इसे यीशु के चेलों पर किसी अनिवार्य आज्ञा के उल्लंघन का स्पष्ट आरोप मानना, या केवल एक विशेष उपवास-दिन तक सीमित करना।
  rationale: वर्तमानकालीन क्रियाएँ और πολλά सामान्य अथवा बारंबार अभ्यास की ओर संकेत करते हैं। अनुवाद प्रश्न में निहित तनाव बनाए रखता है, पर उससे अधिक धार्मिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चेले’, ‘उपवास रखते हैं’ और ‘फ़रीसी’ परिचित बाइबलीय शब्दावली हैं। प्रश्न में ‘तो ... लेकिन’ जोड़ से मूल का स्पष्ट विरोध स्वाभाविक हिन्दी में उभरता है।
