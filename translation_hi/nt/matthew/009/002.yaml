reference: Matthew 9:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: hi
  text: और देखो, वे एक लकवाग्रस्त व्यक्ति को बिस्तर पर पड़े हुए यीशु के पास लाए। यीशु ने उनका विश्वास देखकर उस लकवाग्रस्त व्यक्ति से कहा, “हिम्मत रख, बच्चे; तेरे पाप क्षमा हो गए हैं।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे पाप क्षमा किए जाते हैं।” यूनानी क्रिया वर्तमान निष्क्रिय रूप में है; हिन्दी में यह विकल्प अधिक शाब्दिक है, जबकि मुख्य पाठ व्यक्तिगत घोषणा को अधिक स्वाभाविक ढंग से व्यक्त करता है।
    reason: क्रिया के वर्तमान निष्क्रिय रूप का वैकल्पिक अनुवाद
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाले कथात्मक संकेत की जीवंतता बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: προσέφερον
  choice: लाए
  rationale: अपूर्ण भूतकाल के कथात्मक प्रयोग को हिन्दी में सहज सामान्य भूतकाल से व्यक्त किया गया है; प्रसंग में लोगों द्वारा उसे यीशु के पास लाना स्पष्ट है।
- source_word: παραλυτικὸν
  choice: एक लकवाग्रस्त व्यक्ति
  rationale: विशेषण के संज्ञात्मक प्रयोग को स्पष्ट, सम्मानजनक और आधुनिक हिन्दी में व्यक्त करता है, बिना अनावश्यक रूप से लिंग निर्धारित किए।
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: खाट पर पड़े
  rationale: κλίνη के छोटे बिस्तर या खाट के भाव तथा व्यक्ति की पड़ी हुई अवस्था को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: πίστιν
  choice: विश्वास
  rationale: πίστις का मानक हिन्दी प्रतिरूप है और यहाँ कर्म में प्रकट भरोसे का अर्थ बनाए रखता है।
- source_word: Θάρσει
  choice: हिम्मत रख
  rationale: आश्वासन देने वाली आज्ञा को सीधी, बोलचाल के निकट किंतु गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τέκνον
  choice: बच्चे
  rationale: स्नेहपूर्ण संबोधन को सुरक्षित रखता है और स्रोत से अधिक निश्चित रूप से 'बेटा' नहीं कहता।
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: तेरे पाप क्षमा किए जाते हैं
  rationale: वर्तमान निष्क्रिय क्रिया और अनिर्दिष्ट कर्ता को बनाए रखता है; हिन्दी में यह औपचारिक घोषणात्मक वाक्य स्वाभाविक है।
- source_word: ἁμαρτίαι
  choice: पाप
  rationale: बहुवचन रूप से जुड़े व्यक्तिगत अपराधों के भाव को हिन्दी के स्वाभाविक सामूहिक-बहुवचन प्रयोग में व्यक्त करता है।
theological_decisions:
- issue: τὴν πίστιν αὐτῶν में बहुवचन सर्वनाम का संदर्भ
  choice: मुख्य पाठ में “उनका विश्वास” रखा गया है।
  alternative: इसे केवल उठाकर लाने वालों का विश्वास, या लकवाग्रस्त व्यक्ति सहित पूरे समूह का विश्वास समझना।
  rationale: यूनानी बहुवचन किसी एक व्याख्या को अनिवार्य नहीं करता; अनुवाद उस अस्पष्टता को हल किए बिना सुरक्षित रखता है।
- issue: पापों की क्षमा की घोषणा में निष्क्रिय वाच्य
  choice: “तेरे पाप क्षमा किए जाते हैं” द्वारा निष्क्रिय वाच्य और वर्तमान घोषणा बनाए रखी गई है।
  alternative: “तेरे पाप क्षमा हो गए हैं” या कर्ता को स्पष्ट करते हुए “परमेश्वर ने तेरे पाप क्षमा किए हैं।”
  rationale: स्रोत में क्षमा करने वाला कर्ता व्यक्त नहीं है। मुख्य पाठ में उसे जोड़ना या कालगत बल को पूर्ण भूत में बदलना मूल की धर्मवैचारिक तनावशीलता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन सहज और जनसुलभ है, जबकि यीशु के संबोधन में स्नेह तथा घोषणा में गरिमा रखी गई है। “तू/तेरे” निकट और आत्मीय संबोधन को दर्शाता है, अनादर को नहीं।
