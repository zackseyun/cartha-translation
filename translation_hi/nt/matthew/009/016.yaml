source:
  edition: SBLGNT
  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: hi
  text: पर कोई भी पुराने वस्त्र पर बिना सिकोड़े हुए कपड़े का पैबंद नहीं लगाता[a], क्योंकि वह पैबंद पुराने वस्त्र से खींच लेता है, और फटाव और भी बुरा हो जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिना फुलाए हुए कपड़े का।” यूनानी शब्द ऐसे कपड़े को बताता है जो अभी पूरी तरह तैयार या सिकुड़ाया नहीं गया है; बाद में उसके सिकुड़ने पर वह पुराने वस्त्र को खींच सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δὲ
  choice: पर कोई भी ... नहीं
  rationale: οὐδεὶς का सार्वभौमिक नकार स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है; δὲ पूर्ववर्ती प्रसंग से हल्का विरोध दर्शाता है।
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: पैबंद लगाता
  rationale: क्रिया का मूल अर्थ लगाने/ऊपर रखने का है, और वस्त्र के प्रसंग में ‘पैबंद लगाना’ स्वाभाविक है; ‘सीना’ जैसी अधिक विशिष्ट क्रिया मूल में स्पष्ट रूप से नहीं है।
- source_word: ῥάκους ἀγνάφου
  choice: बिना सिकोड़े हुए कपड़े का
  rationale: ἄγναφος ऐसे कपड़े को बताता है जिसे अभी तैयार करने की प्रक्रिया, विशेषतः सिकुड़ने वाली प्रक्रिया, से नहीं गुजारा गया; यह पद चित्र के व्यावहारिक आशय को स्पष्ट रखता है।
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: पुराने कपड़े पर
  rationale: ἱμάτιον यहाँ वस्त्र के सामान्य अर्थ में है; हिन्दी में ‘पुराना कपड़ा’ इस दृष्टांत के लिए सहज और व्यापक है।
- source_word: αἴρει ... ἀπὸ τοῦ ἱματίου
  choice: उस कपड़े से खिंचकर अलग हो जाता है
  rationale: प्रसंग में पैबंद पुराने वस्त्र पर तनाव डालते हुए उससे अलग होता है; यह अनुवाद अलगाव और खिंचाव दोनों को व्यक्त करता है, बिना क्रिया को केवल ‘फाड़ डालता है’ तक सीमित किए।
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: पैबंद
  rationale: शाब्दिक अर्थ ‘उसका भराव/भरने वाला टुकड़ा’ है, पर सिलाई के प्रसंग में अभिप्रेत वस्तु पैबंद ही है।
- source_word: χεῖρον σχίσμα γίνεται
  choice: फटना और भी बड़ा हो जाता है
  rationale: χείρον तुलनात्मक बिगड़ाव और σχίσμα फटने/चीर को दर्शाता है; हिन्दी में यह परिणाम स्वाभाविक रूप से व्यक्त करता है।
