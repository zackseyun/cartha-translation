base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: hi
  text: इसलिए फसल के प्रभु से विनती करो कि वह अपनी फसल में मज़दूरों को भेजे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मज़दूरों को बलपूर्वक भेजे”; यूनानी क्रिया साधारण “भेजने” से अधिक प्रबल है, हालाँकि यहाँ आशय मज़दूरों को फसल में काम करने के लिए भेजना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: विनती करो
  rationale: यह क्रिया आग्रहपूर्वक प्रार्थना करने या याचना करने का भाव रखती है। ‘विनती करो’ प्रार्थना के संदर्भ और आग्रह, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन—फसल बहुत है, पर मज़दूर थोड़े हैं—से निकलने वाला निष्कर्ष दिखाता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: यहाँ फसल पर अधिकार रखने वाले के लिए κύριος आया है। ‘प्रभु’ उसके अधिकार और बाइबलीय पदवी, दोनों को बनाए रखता है।
- source_word: θερισμοῦ
  choice: फसल
  rationale: यह कटाई या तैयार उपज का सामान्य अर्थ देता है। मिशन और लोगों को इकट्ठा करने के रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: ὅπως
  choice: कि
  rationale: यह विनती की विषय-वस्तु अथवा उद्देश्य प्रस्तुत करता है; ‘कि’ हिन्दी में स्वाभाविक है।
- source_word: ἐκβάλῃ
  choice: भेजे
  rationale: ἐκβάλλω में सामान्य ‘भेजने’ से अधिक बल—बाहर निकालने या जोर देकर रवाना करने—का भाव हो सकता है। इस संदर्भ में मज़दूरों को काम पर रवाना करना अभिप्रेत है; मुख्य पाठ में स्वाभाविक ‘भेजे’ रखा गया और प्रबल अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐργάτας
  choice: मज़दूरों
  rationale: फसल में काम करने वालों के लिए यह स्पष्ट और आम आधुनिक हिन्दी शब्द है तथा कृषि-रूपक को बनाए रखता है।
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: अपनी फसल में
  rationale: εἰς कार्य-क्षेत्र में भेजे जाने की दिशा व्यक्त करता है और αὐτοῦ उसी प्रभु के स्वामित्व को दिखाता है। ‘अपनी’ हिन्दी में कर्ता से संबंध स्वाभाविक रूप से स्पष्ट करता है; ‘खेत’ नहीं जोड़ा गया क्योंकि वह यूनानी पाठ में स्पष्ट नहीं है।
theological_decisions:
- issue: ‘फसल के प्रभु’ की पहचान
  choice: ‘फसल के प्रभु’ पदवी को बिना किसी अधिक विशिष्ट पहचान के रखा गया है।
  alternative: इसे विशेष रूप से पिता, यीशु, या परमेश्वर कहकर स्पष्ट करना।
  rationale: इस पद में संदर्भित व्यक्ति की पहचान ‘फसल के प्रभु’ से आगे स्पष्ट नहीं की गई। अनुवाद उस वास्तविक अस्पष्टता और धर्मवैज्ञानिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘विनती करो’ आग्रहपूर्ण प्रार्थना का भाव देता है; ‘मज़दूर’ कृषि-रूपक को स्पष्ट रखता है।
