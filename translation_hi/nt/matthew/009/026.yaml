- source_word: ἐξῆλθεν
  choice: फैल गई
  rationale: शाब्दिक अर्थ ‘निकल गई’ है, पर चर्चा या समाचार के लिए आधुनिक हिन्दी में ‘फैल गई’ स्वाभाविक है और एक स्थान से बाहर प्रसारित होने का भाव स्पष्ट करता है।
- source_word: ἡ φήμη αὕτη
  choice: इसकी चर्चा
  rationale: φήμη यहाँ किसी घटना के चारों ओर फैलती खबर या चर्चा को दर्शाता है। ‘इसकी चर्चा’ पिछले चमत्कार की ओर αὕτη के संकेत को सहज हिन्दी में व्यक्त करता है और ‘अफवाह’ से जुड़ी अविश्वसनीयता का भाव नहीं लाता।
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: उस सारे क्षेत्र में
  rationale: γῆ के अर्थ पृथ्वी, भूमि अथवा क्षेत्र हो सकते हैं; स्थानीय कथानक में ‘क्षेत्र’ उपयुक्त है। ‘उस सारे क्षेत्र में’ ὅλην और ἐκείνην दोनों को स्वाभाविक ढंग से व्यक्त करता है।
