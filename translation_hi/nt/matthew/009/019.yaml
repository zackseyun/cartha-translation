  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: hi
  text: और यीशु उठकर उसके पीछे चल दिए, और उनके चेले भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: उठकर
  rationale: यह क्रिया-रूप यहाँ बैठी हुई स्थिति से उठने और फिर आगे की क्रिया करने को दर्शाता है। ‘उठकर’ आधुनिक हिन्दी कथा-शैली में स्वाभाविक और संक्षिप्त है।
- source_word: ἠκολούθει
  choice: पीछे चल दिए
  rationale: ἀκολουθέω का अर्थ किसी के पीछे चलना है। अपूर्ण भूतकाल चलती हुई क्रिया दिखा सकता है, पर इस प्रसंग में हिन्दी का ‘चल दिए’ कथा की गति और यीशु के उस व्यक्ति के साथ जाने—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτῷ
  choice: उसके
  rationale: यह सर्वनाम पिछले पद के अधिकारी की ओर संकेत करता है। ‘उसके पीछे’ हिन्दी में ἀκολουθέω के साथ स्वाभाविक प्रयोग है।
- source_word: μαθηταὶ
  choice: चेले
  rationale: ‘चेले’ सुसमाचारों में μαθηταί के शिक्षक-अनुयायी संबंध को सामान्य आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: और उनके चेले भी
  rationale: यूनानी में दूसरी बार क्रिया दोहराई नहीं गई है। हिन्दी में ‘भी’ के साथ यही लोप स्वाभाविक है और अर्थ स्पष्ट रहता है; आदरसूचक ‘उनके’ का संबंध यीशु से है।
