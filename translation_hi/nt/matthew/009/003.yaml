  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: hi
  text: और देखो, कुछ शास्त्रियों ने अपने मन में कहा,[a] “यह मनुष्य परमेश्वर की निन्दा कर रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपस में कहा।” यूनानी अभिव्यक्ति निजी बातचीत या मन के भीतर विचार करने—दोनों का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: सरल कथात्मक संयोजक के रूप में मूल का समन्वय बनाए रखता है।
- source_word: ἰδού
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले कथात्मक संकेत को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: τινες τῶν γραμματέων
  choice: कुछ शास्त्रियों
  rationale: अनिर्दिष्ट समूह के अर्थ और सुसमाचारों में प्रचलित γραμματεῖς के पारंपरिक, संक्षिप्त पदनाम—दोनों को सुरक्षित रखता है।
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: अपने मन में कहा
  rationale: शाब्दिक ‘अपने भीतर कहा’ का स्वाभाविक हिन्दी रूप है और भीतरी विचार-विमर्श का संकेत देता है; निजी आपसी कथन की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: Οὗτος
  choice: यह मनुष्य
  rationale: संकेतवाचक सर्वनाम का स्पष्ट और स्वाभाविक रूप है, बिना अनावश्यक रूप से तिरस्कारपूर्ण भाषा जोड़ने के।
- source_word: βλασφημεῖ
  choice: परमेश्वर की निन्दा कर रहा है
  rationale: सन्दर्भ में βλασφημέω के धार्मिक आरोप को सामान्य हिन्दी पाठक के लिए स्पष्ट करता है और वर्तमानकालीन क्रिया की चल रही कार्रवाई को व्यक्त करता है।
theological_decisions:
- issue: यीशु के विरुद्ध शास्त्रियों के आरोप का अनुवाद
  choice: यह मनुष्य परमेश्वर की निन्दा कर रहा है
  alternative: यह मनुष्य निन्दा कर रहा है
  rationale: आरोप की धार्मिक गंभीरता स्पष्ट रहती है, पर कथन को सत्य या असत्य ठहराकर कथा के धर्मवैचारिक तनाव का समयपूर्व समाधान नहीं किया जाता।
- issue: ἐν ἑαυτοῖς में भीतरी विचार या निजी आपसी बातचीत
  choice: अपने मन में कहा
  alternative: आपस में कहा
  rationale: निकटवर्ती कथानक में यीशु द्वारा उनके विचार जानने के कारण भीतरी विचार-विमर्श सबसे स्वाभाविक है, जबकि यूनानी अभिव्यक्ति की व्यापक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘शास्त्री’ बाइबलीय सन्दर्भ में स्थापित पद है; ‘देखो’ मूल के ध्यानाकर्षक कथात्मक प्रभाव को बनाए रखता है।
