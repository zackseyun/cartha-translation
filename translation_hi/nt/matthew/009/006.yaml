source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: hi
  text: लेकिन ताकि तुम जान लो कि मनुष्य के पुत्र[a] को पृथ्वी पर पाप क्षमा करने का अधिकार है”—तब वह लकवे से पीड़ित व्यक्ति से कहता है, “उठो, अपना बिछौना[b] उठा लो और अपने घर जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मानव-पुत्र।” पारंपरिक अनुवाद “मनुष्य का पुत्र” रखा गया है, क्योंकि यह यीशु की उपाधि और दानिय्येल 7 की संभावित प्रतिध्वनि को सुरक्षित रखता है।
    reason: lexical_alternative
  - marker: b
    text: या “खाट” अथवा “चटाई।” यूनानी शब्द κλίνη पलंग, खाट या सोने के बिछावन को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: पर इसलिए कि तुम जान लो
  rationale: δέ के हल्के विरोध अथवा प्रसंग-परिवर्तन और ἵνα के प्रयोजन को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐξουσίαν ἔχει
  choice: अधिकार है
  rationale: यह केवल सामर्थ्य नहीं, बल्कि पाप क्षमा करने के वैध अधिकार को व्यक्त करता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की स्थापित उपाधि और दानिय्येल 7 से उसकी संभावित प्रतिध्वनि को सुरक्षित रखता है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: यहाँ पृथ्वी के क्षेत्र में अधिकार होने का सीधा और स्वाभाविक अर्थ है।
- source_word: ἀφιέναι ἁμαρτίας
  choice: पाप क्षमा करने
  rationale: इस प्रसंग में ἀφίημι का अर्थ पापों को क्षमा करना अथवा उनका दोष छोड़ देना है।
- source_word: τότε λέγει
  choice: तब वह ... कहता है
  rationale: यूनानी ऐतिहासिक वर्तमान की कथात्मक सजीवता को बनाए रखता है।
- source_word: τῷ παραλυτικῷ
  choice: लकवे से पीड़ित व्यक्ति से
  rationale: संज्ञा की तरह प्रयुक्त विशेषण को स्पष्ट, सम्मानजनक और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ἐγερθεὶς
  choice: उठो
  rationale: आज्ञाओं की इस शृंखला में कृदंत का बल व्यावहारिक रूप से आदेश का है।
- source_word: ἆρόν
  choice: उठा लो
  rationale: बिछौने को उठाकर साथ ले जाने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κλίνην
  choice: बिछौना
  rationale: κλίνη के पलंग, खाट या सोने के बिछावन जैसे अर्थों को इस प्रसंग में बिना अनावश्यक विशिष्टता के व्यक्त करता है।
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: अपने घर जाओ
  rationale: आदेश और गंतव्य दोनों को संक्षिप्त तथा स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: मसीही उपाधि ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र / वह मनुष्य
  rationale: पारंपरिक उपाधि यीशु के आत्म-निर्देशन और दानिय्येल 7 की संभावित अंतर्पाठीय प्रतिध्वनि को बनाए रखती है; अधिक व्याख्यात्मक विकल्प उस तनाव को समतल कर सकते हैं।
- issue: पाप क्षमा करने में ἐξουσία का स्वरूप
  choice: अधिकार
  alternative: सामर्थ्य / हक
  rationale: पद का बल केवल चमत्कार करने की क्षमता पर नहीं, पाप क्षमा करने के वैध अधिकार पर है।
