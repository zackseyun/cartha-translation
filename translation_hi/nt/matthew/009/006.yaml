  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। ऐतिहासिक वर्तमान को “कहता है” से सुरक्षित रखा गया है। प्रत्यक्ष कथन के आरम्भ का संकेत पिछले पद में होने के कारण यहाँ मूल पाठ के अनुरूप समापन उद्धरण-चिह्न रखा गया है।
