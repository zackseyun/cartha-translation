revisions:
- from: पर यीशु ने मुड़कर उसे देखा और कहा, “हिम्मत रख, बेटी; तेरे विश्वास ने तेरा उद्धार किया है।”[a] और उसी घड़ी से वह स्त्री चंगी हो गई।
  to: पर यीशु ने मुड़कर उसे देखा और कहा, “हिम्मत रख, बेटी; तेरे विश्वास ने तुझे बचाया है।”[a] और वह स्त्री उसी घड़ी से स्वस्थ हो गई।
  rationale: 'Revision preserves the Greek’s deliberate σῴζω wordplay: Jesus’ statement remains broad (“तुझे बचाया है”), while the narrator explicitly reports physical recovery (“स्वस्थ हो गई”). It also improves idiomatic modern Hindi and corrects the footnote’s unnatural alternative.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:31:47Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the turning, seeing, encouragement, familial address, faith, and the immediate physical restoration. However, “तेरा उद्धार किया है” narrows σέσωκέν σε toward a specifically soteriological outcome and does not naturally retain the direct object “you.” “तुझे बचाया है” more closely reflects the Greek while retaining its intentionally broad saving/healing resonance, clarified by the following healing statement.
  naturalness: “हिम्मत रख, बेटी” is natural, direct modern Hindi. “चंगी हो गई” is understandable in biblical usage but is less neutral in modern standard Hindi; “स्वस्थ हो गई” is clear and appropriately dignified. The revised word order also makes the temporal phrase attach naturally to the healing result.
  terminology: “विश्वास” appropriately renders πίστις. “बचाया है” preserves the semantic breadth of σῴζω better than “उद्धार किया है” in this healing setting; the footnote explicitly records healing-related alternatives without forcing a doctrinal reading.
  issues:
  - severity: medium
    issue: “तेरा उद्धार किया है” is overly narrowed and somewhat indirect for σέσωκέν σε.
    rationale: The Greek literally has the woman as the object (“has saved you”) and can encompass rescue, healing, and salvation. “उद्धार” foregrounds one theological sense and “तेरा उद्धार किया” changes the direct-object construction. “तुझे बचाया है” retains the broader ambiguity.
  - severity: low
    issue: “चंगी हो गई” is not the most neutral modern-standard Hindi wording.
    rationale: Although established in some Hindi Bible registers, “स्वस्थ हो गई” is broadly natural in modern standard Hindi and clearly conveys the narrative’s physical-healing outcome.
  - severity: low
    issue: The footnote’s alternative “अच्छा किया है” is unnatural Hindi in this context.
    rationale: “तुझे स्वस्थ किया है” or “तुझे चंगा किया है” gives idiomatic alternatives for the healing sense.
  revised_text: पर यीशु ने मुड़कर उसे देखा और कहा, “हिम्मत रख, बेटी; तेरे विश्वास ने तुझे बचाया है।”[a] और वह स्त्री उसी घड़ी से स्वस्थ हो गई।
  revised_footnotes:
  - marker: a
    text: “तुझे बचाया है” का अनुवाद “तुझे चंगा किया है” या “तुझे स्वस्थ किया है” भी हो सकता है। यूनानी क्रिया का अर्थ बचाना, चंगा करना, या स्वस्थ करना हो सकता है।
    reason: lexical_alternative
  revision_rationale: 'Revision preserves the Greek’s deliberate σῴζω wordplay: Jesus’ statement remains broad (“तुझे बचाया है”), while the narrator explicitly reports physical recovery (“स्वस्थ हो गई”). It also improves idiomatic modern Hindi and corrects the footnote’s unnatural alternative.'
