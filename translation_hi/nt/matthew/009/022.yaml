  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: hi
  text: पर यीशु ने मुड़कर उसे देखा और कहा, “हिम्मत रख, बेटी; तेरे विश्वास ने तुझे बचाया है।”[a] और वह स्त्री उसी घड़ी से स्वस्थ हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तुझे बचाया है” का अनुवाद “तुझे चंगा किया है” या “तुझे स्वस्थ किया है” भी हो सकता है। यूनानी क्रिया का अर्थ बचाना, चंगा करना, या स्वस्थ करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς καὶ ἰδὼν αὐτήν
  choice: मुड़कर उसे देखा
  rationale: दोनों कृदंतों की क्रमिक क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना दिशा को अनावश्यक रूप से निश्चित किए।
- source_word: Θάρσει
  choice: हिम्मत रख
  rationale: आज्ञार्थक क्रिया के साहस और आश्वासन के भाव को सीधी, सहज हिन्दी में व्यक्त करता है।
- source_word: θύγατερ
  choice: बेटी
  rationale: सम्बोधन की पारिवारिक कोमलता को बिना अतिरिक्त विशेषण जोड़े सुरक्षित रखता है।
- source_word: ἡ πίστις σου
  choice: तेरे विश्वास ने
  rationale: πίστις के सामान्य धार्मिक और प्रसंगगत अर्थ को बनाए रखता है; यहाँ भरोसा भी निहित है।
- source_word: σέσωκέν σε
  choice: तेरा उद्धार किया है
  rationale: σῴζω के पूर्णकालिक रूप तथा उसके व्यापक बचाने/चंगा करने के अर्थ को यीशु के कथन में सुरक्षित रखता है।
- source_word: ἐσώθη ἡ γυνή
  choice: वह स्त्री चंगी हो गई
  rationale: कथावाचक के निष्कर्ष में प्रसंग स्पष्टतः शारीरिक आरोग्य बताता है, इसलिए यहाँ चंगाई का अर्थ स्वाभाविक है।
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: उसी घड़ी से
  rationale: मूल समय-सूचक वाक्यांश का निकट और हिन्दी में प्रतिष्ठित, बोधगम्य रूप है।
theological_decisions:
- issue: यीशु के कथन में σῴζω का अर्थ
  choice: तेरे विश्वास ने तेरा उद्धार किया है
  alternative: तेरे विश्वास ने तुझे चंगा किया है / तुझे अच्छा किया है
  rationale: मूल क्रिया बचाने, उद्धार करने और चंगा करने का अर्थ दे सकती है। मुख्य पाठ में “उद्धार” व्यापक अर्थ और theological tension को सुरक्षित रखता है, जबकि अगला वाक्य तत्काल शारीरिक चंगाई स्पष्ट करता है।
- issue: πίστις का अनुवाद
  choice: विश्वास
  alternative: भरोसा
  rationale: “विश्वास” मूल शब्द का व्यापक और प्रचलित धार्मिक अर्थ रखता है; इस प्रसंग में भरोसे का भाव इसके भीतर समाहित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “हिम्मत रख, बेटी” कोमल किन्तु सीधा सम्बोधन है। यीशु के कथन में व्यापक “उद्धार” और कथावाचक के निष्कर्ष में स्पष्ट “चंगी” रखकर मूल की अर्थगत बहुलता सुरक्षित की गई है।
