  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: hi
  text: जब वह उस घर[b] में भोजन के समय टेक लगाए हुए था[a], तो देखो, बहुत-से चुंगी लेने वाले और पापी आकर यीशु और उसके शिष्यों के साथ भोजन के समय टेक लगाए हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक मुहावरेदार अनुवाद हो सकता है, “जब वह उस घर में भोजन कर रहा था।” यूनानी पाठ विशेष रूप से भोजन के समय टेक लगाकर लेटने की तत्कालीन प्रथा का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: इस पद में मूल पाठ केवल “उस घर में” कहता है; यह स्पष्ट नहीं करता कि वह घर किसका था।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο
  choice: जब ... तो
  rationale: καὶ ἐγένετο यहाँ कथा को आगे बढ़ाने वाला मुहावरा है। हिन्दी का ‘जब ... तो’ उसके कालगत और कथात्मक कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀνακειμένου
  choice: भोजन करते हुए टेक लगाए लेटा था
  rationale: भोजन के प्रसंग में ἀνάκειμαι उस समय की रीति के अनुसार टेक लगाकर लेटने की मुद्रा बताता है; यह केवल बैठने या सामान्य रूप से लेटने का संकेत नहीं है।
- source_word: ἐν τῇ οἰκίᾳ
  choice: उस घर में
  rationale: यूनानी पदबंध निश्चित है, पर इस पद में घर के स्वामी की पहचान स्पष्ट नहीं की गई है। ‘उस घर में’ निश्चितता बनाए रखता है, बिना यह जोड़े कि घर किसका था।
- source_word: ἰδοὺ
  choice: देखो
  rationale: ἰδού आगे होने वाली बात की ओर ध्यान खींचने वाला कथात्मक संकेत है। ‘देखो’ आधुनिक हिन्दी में उसकी सजीवता और चिह्नित बल बनाए रखता है।
- source_word: τελῶναι
  choice: चुंगी लेनेवाले
  rationale: सुसमाचारों के ऐतिहासिक और सामाजिक संदर्भ में τελῶναι के लिए यह परिचित तथा स्पष्ट हिन्दी पद है और समूह से जुड़ी सामाजिक बदनामी को भी पूरी तरह सपाट नहीं करता।
- source_word: ἁμαρτωλοὶ
  choice: पापी
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘पापी’ उस सामाजिक-धार्मिक वर्गीकरण को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: ἐλθόντες
  choice: आए
  rationale: कर्तृवाचक भूतकालिक कृदंत को हिन्दी कथानक में समापिका क्रिया के रूप में रखना स्वाभाविक है और घटनाक्रम स्पष्ट करता है।
- source_word: συνανέκειντο
  choice: के साथ भोजन करते हुए टेक लगाकर लेट गए
  rationale: संयुक्त क्रिया साझा भोजन और साथ टेक लगाकर लेटने, दोनों को व्यक्त करती है। इस अनुवाद से भोजन-संगति और ऐतिहासिक मुद्रा दोनों दिखाई देते हैं।
- source_word: τῷ Ἰησοῦ
  choice: यीशु
  rationale: नाम का प्रचलित मानक हिन्दी रूप रखा गया है।
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: उसके शिष्यों
  rationale: ‘शिष्य’ μαθητής के शिक्षक-अनुयायी संबंध को स्पष्ट, प्रतिष्ठित और व्यापक रूप से समझे जाने वाले ढंग से व्यक्त करता है।
theological_decisions:
- issue: भोजन की मुद्रा और साथ भोजन करने का भाव
  choice: मुख्य पाठ में टेक लगाकर लेटने की मुद्रा को स्पष्ट रखा गया है।
  alternative: केवल ‘भोजन कर रहा था’ या ‘खाना खा रहा था’
  rationale: इस मुद्रा का उल्लेख साझा मेज़-संगति के ऐतिहासिक और सामाजिक दृश्य को उभारता है। इसे बनाए रखने से पाठ का संकेत सुरक्षित रहता है, बिना कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष जोड़े।
- issue: ‘उस घर’ की पहचान
  choice: मुख्य पाठ में यह नहीं बताया गया कि घर किसका था।
  alternative: ‘उसके घर में’ या ‘मत्ती के घर में’
  rationale: यूनानी पाठ केवल निश्चित ‘घर’ कहता है। निकटवर्ती संदर्भ से किसी स्वामी का अनुमान लगाया जा सकता है, पर इस पद में वह स्पष्ट नहीं है; इसलिए अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ऐतिहासिक भोजन-मुद्रा को अनजाना न होने देने के लिए मुख्य पाठ में अपेक्षाकृत स्पष्ट वर्णन और पादटिप्पणी दी गई है। ‘चुंगी लेनेवाले’, ‘पापी’ और ‘शिष्य’ जैसे सुसमाचार-संदर्भ में परिचित पद चुने गए हैं।
