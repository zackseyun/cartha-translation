source:
  edition: SBLGNT
  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: hi
  text: 'क्योंकि कौन-सी बात कहना आसान है: ‘तुम्हारे पाप क्षमा किए गए हैं[a],’ या कहना: ‘उठो और चलो’?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे पाप क्षमा हो गए हैं।” यूनानी वर्तमानकालीन कर्मवाच्य का अर्थ ऐसी स्थिति भी हो सकता है जो क्षमा किए जाने के फलस्वरूप बनी हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: क्योंकि कौन-सी बात कहना आसान है
  rationale: τί तुलनात्मक εὐκοπώτερον के साथ दो विकल्पों में चुनाव पूछता है। γάρ को ‘क्योंकि’ से व्यक्त किया गया है ताकि पिछले पद के साथ इसका व्याख्यात्मक संबंध बना रहे।
- source_word: εἰπεῖν
  choice: कहना
  rationale: दोनों वाक्यांशों में साधारण बोलने की क्रिया है; समान अनुवाद से यूनानी की समानांतर रचना बनी रहती है।
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: तुम्हारे पाप क्षमा किए जाते हैं
  rationale: ἀφίενταί वर्तमानकालीन कर्मवाच्य है और αἱ ἁμαρτίαι उसका व्याकरणिक कर्ता है। यह रूप मूल काल और वाच्य को निकटता से व्यक्त करता है, जबकि फलस्वरूप स्थिति वाला अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἁμαρτίαι
  choice: पाप
  rationale: यह ἁμαρτίαι का मानक और संदर्भानुकूल हिन्दी अनुवाद है।
- source_word: Ἔγειρε
  choice: उठो
  rationale: चंगाई के संदर्भ में ἐγείρω की आज्ञा के लिए ‘उठो’ स्वाभाविक, संक्षिप्त और सीधा आधुनिक हिन्दी रूप है।
- source_word: καὶ περιπάτει
  choice: और चलो
  rationale: περιπάτει यहाँ उठने के बाद चलने की आज्ञा देता है; ‘चलो’ आधुनिक हिन्दी में स्वाभाविक रूप से इसे व्यक्त करता है।
- source_word: σου
  choice: तुम्हारे
  rationale: द्वितीय पुरुष एकवचन संबंधसूचक रूप को अनौपचारिक एकवचन ‘तुम्हारे’ से व्यक्त किया गया है, जो संबोधन की प्रत्यक्षता बनाए रखता है।
theological_decisions:
- issue: यीशु द्वारा पापों की क्षमा की घोषणा का कालगत अर्थ
  choice: तुम्हारे पाप क्षमा किए जाते हैं
  alternative: तुम्हारे पाप क्षमा हो गए हैं
  rationale: यूनानी वर्तमान कर्मवाच्य को मुख्य पाठ में सीधे रखा गया है। साथ ही, इसे केवल चल रही प्रक्रिया मानकर सीमित नहीं किया गया; फलस्वरूप स्थिति का संभव अर्थ पादटिप्पणी में दिया गया है, ताकि अधिकार और क्षमा के समय से जुड़ा धर्मवैचारिक तनाव अनावश्यक रूप से न सुलझाया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। प्रश्न की दो-विकल्पीय समानांतर रचना और पिछले पद से γάρ का व्याख्यात्मक संबंध सुरक्षित रखा गया है।
