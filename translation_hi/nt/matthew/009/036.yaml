source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: hi
  text: जब उसने भीड़ को देखा, तो उसे उन पर करुणा आई, क्योंकि वे सताए हुए और धराशायी थे[a]—उन भेड़ों के समान जिनका कोई चरवाहा न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परेशान और असहाय।” यूनानी शब्दों का अधिक व्याख्यात्मक अर्थ यह भी हो सकता है कि भीड़ थका दी गई थी और अपनी देखभाल करने में असमर्थ थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ τοὺς ὄχλους
  choice: जब उसने भीड़ को देखा
  rationale: क्रियाविशेषणात्मक भूतकालिक कृदंत को स्वाभाविक हिन्दी में कालसूचक उपवाक्य के रूप में व्यक्त किया गया है। δὲ यहाँ हल्का कथात्मक संयोजक है, जिसे हिन्दी वाक्य-प्रवाह में अलग शब्द से व्यक्त करना आवश्यक नहीं। ὄχλοι के लिए सामूहिक अर्थ में ‘भीड़’ सहज आधुनिक प्रयोग है।
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: उसे उन पर करुणा आई
  rationale: यह पद गहरी आंतरिक दया या करुणा दर्शाता है। चुना हुआ रूप आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी में भाव की तीव्रता बनाए रखता है।
- source_word: ὅτι ἦσαν ἐσκυλμένοι
  choice: क्योंकि वे सताए हुए थे
  rationale: ὅτι कारण बताता है। ἐσκυλμένοι लोगों के दुर्व्यवहार से पीड़ित, परेशान और थका दिए जाने की दशा व्यक्त कर सकता है; ‘सताए हुए’ इस निष्क्रिय और पीड़ित अवस्था को संक्षेप में रखता है।
- source_word: καὶ ἐρριμμένοι
  choice: और धराशायी
  rationale: ῥίπτω का मूल चित्र फेंके या गिराए जाने का है। ‘धराशायी’ उस चित्र और असहाय पड़ी अवस्था को बनाए रखता है, जबकि केवल ‘असहाय’ अधिक व्याख्यात्मक होता।
- source_word: ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα
  choice: उन भेड़ों के समान जिनका कोई चरवाहा न हो
  rationale: तुलना और चरवाहे-विहीन भेड़ों का रूपक स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: यीशु की करुणा का वर्णन
  choice: उसे उन पर करुणा आई
  alternative: वह उनके लिए करुणा से भर गया
  rationale: चुना हुआ रूप गहरी दया को स्पष्ट करता है, पर यूनानी शारीरिक मुहावरे को कृत्रिम ढंग से शब्दशः नहीं दोहराता और कोई अतिरिक्त धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
- issue: भीड़ की दशा
  choice: सताए हुए और धराशायी
  alternative: परेशान और असहाय
  rationale: चुना हुआ पाठ दोनों यूनानी निष्क्रिय कृदंतों की पीड़ा तथा गिरा दिए जाने की सजीव छवि को सुरक्षित रखता है। वैकल्पिक पाठ अर्थ की व्याख्या करता है, पर दूसरे पद की प्रतिमा को कम कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘धराशायी’ मूल की सजीव प्रतिमा बनाए रखता है। मुख्य पाठ का [a] चिह्न पूरे वाक्य में वर्णित भीड़ की दशा के वैकल्पिक अनुवाद की ओर संकेत करता है।
