base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: hi
  text: जब वे बाहर जा रहे थे, देखो, लोग उसके पास एक ऐसे आदमी को लाए जो गूँगा[a] और दुष्टात्मा से ग्रस्त[b] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहरा।” यूनानी शब्द का अर्थ प्रसंग के अनुसार “गूँगा” या “बहरा” हो सकता है। अगले पद में उसके बोलने का उल्लेख “गूँगा” अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “दुष्टात्मा के वश में था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: जब वे बाहर जा रहे थे
  rationale: सम्बन्धकारक स्वतंत्र वाक्यांश का समय-सूचक अर्थ स्वाभाविक हिन्दी में व्यक्त होता है; δέ यहाँ प्रसंग के आगे बढ़ने का संकेत देता है, जिसके लिए अलग संयोजक आवश्यक नहीं है।
- source_word: ἰδοὺ
  choice: तभी देखो
  rationale: ‘देखो’ कथानक में ध्यान खींचने और घटना को सजीव बनाने वाले ἰδού के बल को बनाए रखता है; ‘तभी’ दृश्य में अचानक घटित घटना का स्वाभाविक हिन्दी संकेत है।
- source_word: προσήνεγκαν αὐτῷ
  choice: लोग उसके पास ... लाए
  rationale: क्रिया का बहुवचन कर्ता यूनानी में अनिर्दिष्ट है। हिन्दी में ‘लोग’ इस अनिर्दिष्ट मानवीय कर्ता को स्वाभाविक रूप से व्यक्त करता है, और ‘उसके पास’ αὐτῷ को स्पष्ट रखता है।
- source_word: ἄνθρωπον
  choice: आदमी
  rationale: इस चंगाई-वृत्तांत में एक पुरुष व्यक्ति अभिप्रेत है; ‘आदमी’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: κωφὸν
  choice: गूँगा
  rationale: κωφός का अर्थ प्रसंग के अनुसार ‘बहरा’ या ‘गूँगा’ हो सकता है। अगले पद में उसके बोलने का उल्लेख होने के कारण यहाँ ‘गूँगा’ अधिक संभावित है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: δαιμονιζόμενον
  choice: दुष्टात्मा से ग्रस्त
  rationale: यह प्रचलित, सहज हिन्दी है जो दुष्टात्मा-संबंधी वास्तविक पीड़ा बताती है, पर उसके नियंत्रण की ठीक प्रकृति के विषय में पाठ से अधिक दावा नहीं करती।
theological_decisions:
- issue: दुष्टात्मा-संबंधी पीड़ा का अनुवाद
  choice: दुष्टात्मा से ग्रस्त
  alternative: दुष्टात्मा के वश में
  rationale: यूनानी कृदन्त व्यक्ति की दुष्टात्मा-संबंधी अवस्था को वास्तविक रूप में प्रस्तुत करता है, पर उसके प्रभाव की विधि या सीमा नहीं समझाता। चुना हुआ रूप इस बात को स्पष्ट रखते हुए अनावश्यक दानव-विद्या नहीं जोड़ता।
- issue: κωφός की संदर्भगत अस्पष्टता
  choice: गूँगा
  alternative: बहरा
  rationale: अगले पद में उस आदमी के बोलने लगने से ‘गूँगा’ संदर्भ में अधिक उपयुक्त है, फिर भी यूनानी शब्द की वास्तविक वैकल्पिक सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तभी देखो’ मूल के ध्यानाकर्षक कथात्मक बल को बनाए रखता है। वाक्य को हिन्दी में स्वाभाविक बनाने के लिए दोनों विशेषणों को ‘जो ... था’ उपवाक्य में रखा गया है।
