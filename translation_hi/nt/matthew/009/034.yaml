  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: hi
  text: पर फ़रीसी कहते थे, “वह दुष्टात्माओं के सरदार[a] के द्वारा दुष्टात्माओं को निकालता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्टात्माओं के प्रधान के द्वारा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यहाँ δέ पिछले पद में लोगों की सकारात्मक प्रतिक्रिया के विपरीत फ़रीसियों का विरोधी आरोप प्रस्तुत करता है; इसलिए ‘पर’ स्वाभाविक और स्पष्ट है।
- source_word: Φαρισαῖοι
  choice: फ़रीसी
  rationale: इस यहूदी धार्मिक समूह के लिए आधुनिक हिन्दी में प्रचलित और सुबोध रूप।
- source_word: ἔλεγον
  choice: कहते थे
  rationale: अपूर्ण भूतकाल की जारी या बार-बार की जाने वाली क्रिया का पक्ष सुरक्षित रखता है।
- source_word: Ἐν τῷ ἄρχοντι
  choice: सरदार की शक्ति से
  rationale: ἐν के करणवाचक प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है और आरोपित शक्ति-स्रोत को स्पष्ट करता है।
- source_word: ἄρχοντι
  choice: सरदार
  rationale: अधिकार रखने वाले प्रधान के अर्थ को सामान्य आधुनिक हिन्दी में व्यक्त करता है; ‘राजकुमार’ यहाँ अनावश्यक राजवंशीय अर्थ दे सकता है।
- source_word: τῶν δαιμονίων
  choice: दुष्टात्माओं के
  rationale: सम्बन्धकारक बहुवचन उस प्रधान का दुष्टात्माओं पर अधिकार बताता है।
- source_word: ἐκβάλλει
  choice: निकालता है
  rationale: झाड़-फूँक के प्रसंग में किसी व्यक्ति से दुष्टात्मा को बाहर करने का सहज और सटीक हिन्दी प्रयोग।
- source_word: τὰ δαιμόνια
  choice: दुष्टात्माओं को
  rationale: निश्चित कर्म के रूप में प्रयुक्त यूनानी बहुवचन को स्पष्ट हिन्दी कर्म-चिह्न के साथ प्रस्तुत करता है।
theological_decisions:
- issue: झाड़-फूँक के प्रसंग में δαιμόνια का अनुवाद
  choice: दुष्टात्माएँ
  alternative: दुष्ट शक्तियाँ
  rationale: δαιμόνια व्यक्तिगत अलौकिक सत्ताओं को सूचित करता है; ‘दुष्टात्माएँ’ इस दावे को सुरक्षित रखता है, जबकि ‘दुष्ट शक्तियाँ’ उसे अमूर्त बना सकता है।
- issue: Ἐν τῷ ἄρχοντι में शक्ति-स्रोत का अर्थ
  choice: दुष्टात्माओं के सरदार की शक्ति से
  alternative: दुष्टात्माओं के सरदार के द्वारा
  rationale: करणवाचक ἐν का आशय उस सत्ता से प्राप्त सामर्थ्य अथवा माध्यम है। ‘की शक्ति से’ आरोप का आशय स्पष्ट करता है, बिना यह तय किए कि फ़रीसी प्रतिनिधित्व, अधिकार या प्रत्यक्ष माध्यम में से किस सूक्ष्म अर्थ पर बल दे रहे थे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कहते थे’ यूनानी अपूर्ण भूतकाल का पक्ष बचाता है। ‘सरदार’ सामान्य पाठक के लिए ‘शासक’ की तुलना में इस पदानुक्रमिक आरोप में अधिक स्वाभाविक है।
