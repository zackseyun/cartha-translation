  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: hi
  text: जब वह उनसे ये बातें कह रहा था, तब देखो, एक अधिकारी आया और उसके सामने झुककर बोला, “मेरी बेटी अभी-अभी मर गई है। लेकिन आप आकर उस पर अपना हाथ रख दीजिए, और वह जीवित हो जाएगी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: तभी देखो
  rationale: कथा में अचानक आए नए घटनाक्रम की ओर ध्यान खींचने वाले उद्गार को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἄρχων
  choice: शासक
  rationale: मत्ती यहाँ पद या क्षेत्र को स्पष्ट नहीं करता; इसलिए अधिक विशिष्ट ‘आराधनालय का अधिकारी’ कहने के बजाय व्यापक पदनाम रखा गया है।
- source_word: προσεκύνει
  choice: उसके सामने झुककर
  rationale: क्रिया श्रद्धापूर्वक दंडवत या झुकने को व्यक्त कर सकती है; संदर्भ से आगे बढ़कर इसे अनिवार्य रूप से ‘आराधना’ नहीं कहा गया।
- source_word: ἄρτι ἐτελεύτησεν
  choice: अभी-अभी मर गई है
  rationale: ἄρτι की तात्कालिकता और ἐτελεύτησεν के मृत्यु-संबंधी स्पष्ट अर्थ को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν
  choice: उस पर अपना हाथ रख दीजिए
  rationale: मूल के एकवचन ‘हाथ’ और शारीरिक स्पर्श के अनुरोध को सुरक्षित रखता है।
- source_word: ζήσεται
  choice: जीवित हो जाएगी
  rationale: भविष्यकालीन विश्वासपूर्ण कथन को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: προσεκύνει में निहित सम्मान या आराधना
  choice: उसके सामने झुककर
  alternative: उसकी आराधना करके
  rationale: यूनानी क्रिया दोनों अर्थ-क्षेत्रों में प्रयुक्त हो सकती है; इस स्थल पर केवल शारीरिक श्रद्धा-भाव को स्पष्ट रखते हुए संभावित धर्मवैचारिक अर्थ को जबरन निश्चित नहीं किया गया।
- issue: ἀλλὰ का संबंध
  choice: फिर भी
  alternative: लेकिन
  rationale: पिता अपनी बेटी की मृत्यु के बावजूद यीशु के आने और उसे जीवित करने की आशा व्यक्त करता है; ‘फिर भी’ इस विरोध और विश्वासपूर्ण आग्रह को स्वाभाविक हिन्दी में पकड़ता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। प्रत्यक्ष कथन में सम्मानसूचक ‘आप’ और विनम्र आज्ञार्थ ‘रख दीजिए’ सामान्य हिन्दी प्रयोग के अनुरूप हैं; मुख्य कथन में यीशु के लिए मूल के तीसरे पुरुष को बनाए रखा गया है।
