id: MAT.9.29
reference: Matthew 9:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: hi
  text: तब उसने उनकी आँखों को छूकर कहा, “तुम्हारे विश्वास[a] के अनुसार तुम्हारे लिए हो जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे भरोसे के अनुसार।” यूनानी शब्द πίστις का अर्थ “भरोसा” भी हो सकता है और कुछ प्रसंगों में “निष्ठा” या “विश्वासयोग्यता” भी।
    reason: πίστις के प्रासंगिक अर्थ ‘भरोसा’ को दिखाना और उसकी व्यापक अर्थ-सीमा को सुरक्षित रखना।
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह घटनाक्रम में अगले कार्य को सूचित करने वाला कालवाचक क्रियाविशेषण है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: ἥψατο τῶν ὀφθαλμῶν αὐτῶν
  choice: उसने उनकी आँखों को छूकर
  rationale: ἅπτομαι यहाँ शारीरिक रूप से छूने का अर्थ देता है। यूनानी में जिस वस्तु को छुआ गया है वह संबंधकारक में है, पर हिंदी में ‘आँखों को छूना’ स्वाभाविक प्रयोग है। ‘छूकर’ अगले कृदंत λέγων के साथ क्रियाओं का सहज संबंध व्यक्त करता है।
- source_word: λέγων
  choice: कहा
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ-साथ बोले गए कथन को जोड़ता है। हिंदी में ‘छूकर कहा’ उसी संबंध को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Κατὰ τὴν πίστιν ὑμῶν
  choice: तुम्हारे विश्वास के अनुसार
  rationale: κατά यहाँ अनुरूपता या माप का भाव देता है, न कि अनिवार्य रूप से कठोर कारण का। ‘के अनुसार’ इस अर्थ को सुरक्षित रखता है। πίστις का संदर्भ यीशु पर उनके भरोसे से है, जबकि ‘विश्वास’ इसका मानक और प्रसंगानुकूल हिंदी रूप है।
- source_word: γενηθήτω ὑμῖν
  choice: तुम्हारे लिए हो जाए
  rationale: γενηθήτω अओरिस्ट कर्मवाच्य आज्ञार्थक है और प्रभावकारी घोषणा के रूप में प्रयुक्त हुआ है। ‘हो जाए’ उसके आज्ञार्थक/अनुमतिपरक बल को रखता है; ὑμῖν को लाभार्थक अर्थ में ‘तुम्हारे लिए’ कहा गया है।
theological_decisions:
- issue: चंगाई के कथन में πίστις का अनुवाद
  choice: विश्वास
  alternative: भरोसा; कुछ प्रसंगों में निष्ठा/विश्वासयोग्यता
  rationale: इस प्रसंग में πίστις उन दृष्टिहीन व्यक्तियों के यीशु की चंगा करने की सामर्थ्य पर भरोसे को दर्शाता है। मुख्य पाठ में प्रचलित धर्मशास्त्रीय शब्द ‘विश्वास’ रखा गया है, पर ‘भरोसा’ की जीवित अर्थ-छाया पादटिप्पणी में सुरक्षित है।
- issue: κατά को कारणात्मक बनाने से बचना
  choice: के अनुसार
  alternative: के आधार पर
  rationale: यूनानी वाक्य विश्वास और होने वाली चंगाई के बीच अनुरूपता व्यक्त करता है। ‘के आधार पर’ अधिक स्पष्ट कारणात्मक या योग्यता-सूचक अर्थ ला सकता है, इसलिए उसे मुख्य पाठ में नहीं चुना गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथन। ‘छूकर कहा’ यूनानी कृदंत-रचना को हिंदी के स्वाभाविक घटनाक्रम में ढालता है। ‘तुम्हारे लिए हो जाए’ मूल की संक्षिप्त, प्रभावकारी घोषणा और लाभार्थक दत्तिव दोनों को बनाए रखता है।
