source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: hi
  text: जब फ़रीसियों ने यह देखा[a], तो वे उसके चेलों से कह रहे थे, “तुम्हारा गुरु कर वसूलने वालों और पापियों के साथ क्यों खाता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में वाक्य का क्रम अधिक शाब्दिक रूप से, “और देखकर, फ़रीसी उसके चेलों से कह रहे थे ...” है। ‘देखकर’ का कर्म अव्यक्त है और प्रसंग के भोज-दृश्य की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: जब ... ने यह देखा
  rationale: अओरिस्ट कृदन्त को प्रसंगानुकूल कालवाचक उपवाक्य के रूप में रखा गया है। यूनानी में कर्म अव्यक्त है; हिन्दी में स्वाभाविकता के लिए ‘यह’ जोड़ा गया है, जो पिछले पद के भोज-दृश्य की ओर संकेत करता है।
- source_word: ἔλεγον
  choice: कहने लगे
  rationale: अपूर्ण भूतकाल की आरम्भिक अथवा जारी वाणी को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘कहा’ की तुलना में पक्षगत बल अधिक सुरक्षित रहता है।
- source_word: μαθηταῖς
  choice: चेलों
  rationale: सुसमाचार-वृत्तान्त में गुरु से सीखने और उसके पीछे चलने वाले μαθηταί के लिए प्रचलित, सहज और सम्बन्धसूचक शब्द।
- source_word: Διὰ τί
  choice: क्यों
  rationale: कारण पूछने वाले यूनानी पदबंध का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: τελωνῶν
  choice: चुंगी लेने वालों
  rationale: रोमी व्यवस्था के अधीन कर अथवा महसूल वसूलने वाले सामाजिक रूप से तिरस्कृत वर्ग को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: ἁμαρτωλῶν
  choice: पापियों
  rationale: ἁμαρτωλός का सीधा और मानक अनुवाद; प्रसंग में नैतिक और सामाजिक रूप से चिह्नित समूह का संकेत सुरक्षित रहता है।
- source_word: ἐσθίει
  choice: खाता है
  rationale: वर्तमानकालीन प्रश्न और क्रिया के मूल अर्थ को बिना अतिरिक्त औपचारिकता के स्वाभाविक हिन्दी में रखता है।
- source_word: διδάσκαλος
  choice: गुरु
  rationale: शिक्षक-चेले के सम्बन्ध को सहज आधुनिक हिन्दी में व्यक्त करता है। यहाँ यह किसी विशिष्ट धार्मिक उपाधि को आरोपित नहीं करता।
theological_decisions:
- issue: ‘देखा’ के अव्यक्त कर्म को स्पष्ट करना
  choice: मुख्य पाठ में ‘यह’ जोड़ा गया
  alternative: ‘फ़रीसियों ने देखकर’ अथवा ‘फ़रीसियों ने जब देखा’
  rationale: यूनानी कृदन्त ἰδόντες का कर्म स्पष्ट रूप से नहीं लिखा गया, पर प्रसंग में वह भोज-दृश्य है। हिन्दी में ‘यह’ वाक्य को स्वाभाविक बनाता है; पादटिप्पणी मूल की अव्यक्तता बताती है और किसी धर्मवैज्ञानिक निष्कर्ष को नहीं जोड़ती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘कहने लगे’ अपूर्ण भूतकाल के पक्ष को व्यक्त करता है। ‘गुरु’ और ‘चेलों’ से διδάσκαλος–μαθηταί का सम्बन्ध स्पष्ट और स्वाभाविक रहता है; ‘चुंगी लेने वालों’ का प्रयोग सामान्य पाठक के लिए ऐतिहासिक पेशे को समझने योग्य बनाता है।
