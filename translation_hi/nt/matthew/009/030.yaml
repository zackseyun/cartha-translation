  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: hi
  text: और उनकी आँखें खुल गईं। तब यीशु ने उन्हें कड़ी चेतावनी दी और कहा[a], “ध्यान रखना, किसी को पता न चले[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस यूनानी क्रिया में तीव्र भाव और बलपूर्वक चेतावनी देने का अर्थ है; इसका अनुवाद “कठोर आदेश दिया” या “कड़ाई से ताकीद की” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: “ध्यान रखना कि कोई न जाने।” यूनानी में जानने की बात का कर्म संदर्भ से समझा जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί
  choice: उनकी आँखें खुल गईं
  rationale: यूनानी में क्रिया कर्मवाच्य है। हिन्दी का स्वाभाविक मुहावरा ‘आँखें खुल गईं’ उसी घटना—दृष्टि लौटने—को व्यक्त करता है और चंगाई करने वाले को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: ἐνεβριμήθη αὐτοῖς
  choice: उन्हें कड़ी चेतावनी देकर
  rationale: ἐμβριμάομαι यहाँ तीव्र भाव और आदेश की कठोरता प्रकट करता है। ‘कड़ी चेतावनी’ निषेध की शक्ति को बनाए रखती है, पर इसे क्रोध या डाँट के रूप में अनिवार्यतः नहीं समझाती।
- source_word: λέγων
  choice: कहा
  rationale: समकालिक कृदन्त को स्वाभाविक हिन्दी में मुख्य चेतावनी के साथ ‘कहा’ के रूप में जोड़ा गया है।
- source_word: Ὁρᾶτε
  choice: ध्यान रखना
  rationale: यह वर्तमान आज्ञार्थक रूप यहाँ सावधानीपूर्वक पालन करने का निर्देश देता है। ‘ध्यान रखना’ आधुनिक हिन्दी में ‘देखो कि’ की अपेक्षा अधिक स्वाभाविक है और आदेश का बल बनाए रखता है।
- source_word: μηδεὶς γινωσκέτω
  choice: किसी को पता न चले
  rationale: तीसरे पुरुष का निषेधात्मक आज्ञार्थक वाक्य किसी को जानकारी न होने देने का आदेश है। हिन्दी में यह प्रयोग स्वाभाविक है और यूनानी में अव्यक्त कर्म को स्पष्ट रूप से जोड़ने से बचता है।
theological_decisions:
- issue: चंगाई के बाद यीशु की आज्ञा का बल और उद्देश्य
  choice: यीशु ने कड़ी चेतावनी दी कि किसी को पता न चले।
  alternative: यीशु ने उन्हें डाँटा या कठोर आदेश दिया कि वे चंगाई का प्रचार न करें।
  rationale: मूल पाठ आदेश की तीव्रता दिखाता है, पर यीशु की मनःस्थिति, आज्ञा का कारण या प्रचार के विषय को स्पष्ट नहीं करता। इसलिए अनुवाद निषेध का बल रखता है, लेकिन उसका उद्देश्य या कारण नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘आँखें खुल गईं’ और ‘किसी को पता न चले’ सामान्य हिन्दी के स्वाभाविक प्रयोग हैं; ‘कड़ी चेतावनी’ मूल क्रिया की तीव्रता को बिना अतिरिक्त मनोवैज्ञानिक या धर्मवैज्ञानिक व्याख्या के व्यक्त करती है।
