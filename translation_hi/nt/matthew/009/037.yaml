  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: hi
  text: तब वह अपने चेलों से कहता है[a], “फसल तो बहुत है, पर मज़दूर थोड़े हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यहाँ ऐतिहासिक वर्तमान है: “कहता है।” कुछ अनुवाद इसे “कहा” करते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कथा के क्रम में अगले अवसर को सूचित करने वाला संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: λέγει
  choice: कहता है
  rationale: यूनानी का वर्तमान काल यहाँ ऐतिहासिक वर्तमान है; हिन्दी में वर्तमान रूप रखने से मूल की कथात्मक सजीवता बनी रहती है।
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: अपने चेलों से
  rationale: ‘अपने’ αὐτοῦ के संबंध को स्पष्ट रखता है, और ‘चेले’ μαθηταί का सामान्य, सुबोध बाइबलीय हिन्दी रूप है।
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: तो ... पर
  rationale: यह μέν...δέ के विरोध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: θερισμός
  choice: फसल
  rationale: यह कटाई के लिए तैयार उपज का बोध कराता है और कृषि-रूपक को सहज हिन्दी में बनाए रखता है।
- source_word: πολύς
  choice: बहुत
  rationale: ‘फसल’ के साथ यह उसकी बड़ी मात्रा को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐργάται
  choice: मज़दूर
  rationale: यह खेत में श्रम करने वालों की छवि को बनाए रखते हुए आधुनिक पाठक के लिए स्पष्ट है।
- source_word: ὀλίγοι
  choice: थोड़े
  rationale: यह बहुतायत और कमी के मूल विरोध को बिना ‘बहुत कम’ जैसी अतिरिक्त तीव्रता जोड़े व्यक्त करता है।
theological_decisions:
- issue: फसल के कथन का रूपकात्मक अर्थ
  choice: कृषि-रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: मुख्य पाठ में स्पष्ट कर देना कि फसल से आशय सेवकाई के लिए तैयार लोगों से है।
  rationale: मूल पद स्वयं रूपक प्रस्तुत करता है, पर इस पद में उसका संदर्भ स्पष्ट करके नहीं बताता; इसलिए अनुवाद को उस अर्थगत तनाव और प्रसंगगत निर्भरता को बनाए रखना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘फसल’ और ‘मज़दूर’ कृषि-चित्र को स्वाभाविक हिन्दी में सुरक्षित रखते हैं; ‘कहता है’ मूल के ऐतिहासिक वर्तमान को दर्शाता है।
