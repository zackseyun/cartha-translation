  text: καὶ μακάριός ἐστιν ὃς ⸀ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: hi
  text: और धन्य है वह, जो मेरे कारण ठोकर न खाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मुझ पर आपत्ति न करे”; अथवा, “जो मेरे कारण विश्वास में न डगमगाए।”
    reason: σκανδαλισθῇ ἐν ἐμοί में ठोकर के रूपक के साथ आपत्ति करने या विश्वास में डगमगाने का भाव भी हो सकता है।
lexical_decisions:
- source_word: μακάριος
  choice: धन्य
  rationale: ‘धन्य’ यीशु की आशीष-घोषणा का धार्मिक और वाचा-संबंधी भार बनाए रखता है; ‘सुखी’ यहाँ अधिक व्यक्तिपरक होता।
- source_word: ὃς ἐὰν μὴ
  choice: वह, जो … न
  rationale: यह अनिश्चित और शर्तसूचक व्यक्ति को दर्शाता है। यह हिंदी में स्वाभाविक रहते हुए यूनानी के प्रतिनिधिक एकवचन को बनाए रखता है।
- source_word: σκανδαλισθῇ
  choice: ठोकर न खाए
  rationale: यह चयन मूल क्रिया के ठोकर खाने के रूपक को सुरक्षित रखता है। संदर्भ में इसका आशय यीशु के कारण आपत्ति करने, विश्वास में डगमगाने या उनसे विमुख होने तक जा सकता है, पर मुख्य पाठ उस व्यापकता को संकुचित नहीं करता।
- source_word: ἐν ἐμοί
  choice: मेरे कारण
  rationale: σκανδαλίζω के साथ ἐν ἐμοί यीशु को ठोकर या आपत्ति का अवसर/कारण बताता है। ‘मेरे कारण’ आधुनिक हिंदी में स्वाभाविक है और संबंध को स्पष्ट करता है।
- source_word: καί
  choice: और
  rationale: यह कथन को पिछले प्रसंग से जोड़ता है और मूल के संवाद-प्रवाह को बनाए रखता है।
theological_decisions:
- issue: σκανδαλισθῇ के अर्थ को केवल भावनात्मक बुरा मानने तक सीमित करने का जोखिम
  choice: मुख्य पाठ में ‘ठोकर न खाए’ का रूपक रखा गया है।
  alternative: ‘मुझ पर आपत्ति न करे’ अथवा ‘मेरे कारण विश्वास में न डगमगाए’
  rationale: ठोकर का रूपक यीशु और उनके कार्यों को देखकर आपत्ति करने, विश्वास में डगमगाने या विमुख होने की संभावित अर्थ-व्याप्ति और धार्मिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। ‘धन्य’ मत्ती की आशीष-वाणी की शैली से मेल खाता है, जबकि ‘ठोकर न खाए’ मूल रूपक और उसकी जानबूझकर खुली अर्थ-व्याप्ति को सुरक्षित रखता है।
