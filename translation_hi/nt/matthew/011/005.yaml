source:
  edition: SBLGNT
  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: hi
  text: अंधे देखने लगते हैं और लँगड़े चलते हैं; कोढ़ी शुद्ध किए जाते हैं और बहरे सुनते हैं; मरे हुए जिलाए जाते हैं और गरीबों को शुभ समाचार सुनाया जाता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “गरीबों को सुसमाचार सुनाया जाता है।” यूनानी क्रिया कर्मवाच्य है: गरीब शुभ समाचार के प्राप्तकर्ता हैं।'
    reason: lexical_alternative
  - marker: b
    text: यह सूची यशायाह 35:5–6 और 61:1 की प्रतिध्वनि करती है और मसीह के कार्य से जुड़े चिन्ह प्रस्तुत करती है।
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ
  choice: अंधे
  rationale: विशेषण यहाँ संज्ञा के रूप में अंधे लोगों के एक वर्ग को दर्शाता है; संक्षिप्त और स्वाभाविक हिन्दी रखी गई है।
- source_word: ἀναβλέπουσιν
  choice: देखने लगते हैं
  rationale: चंगाई के प्रसंग में इसका अर्थ दृष्टि पाना या फिर से देखने लगना है। यह अनुवाद केवल ‘ऊपर देखना’ अर्थ से बचता है और यह तय नहीं करता कि हर व्यक्ति पहले कभी देख सकता था।
- source_word: χωλοὶ περιπατοῦσιν
  choice: लँगड़े चलते हैं
  rationale: यूनानी की संक्षिप्त समानांतर रचना और वर्तमानकालीन कथन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: λεπροὶ
  choice: कोढ़ी
  rationale: सुसमाचारों के प्राचीन रोग-वर्ग के लिए प्रचलित और संक्षिप्त हिन्दी शब्द; यह आवश्यक नहीं कि हर दशा आधुनिक चिकित्सकीय हैन्सन रोग के समान हो।
- source_word: καθαρίζονται
  choice: शुद्ध किए जाते हैं
  rationale: कर्मवाच्य को बनाए रखते हुए शारीरिक चंगाई और धार्मिक-सामाजिक शुद्धता, दोनों की ध्वनि सुरक्षित रखता है; केवल ‘चंगे होते हैं’ से अर्थ संकरा हो जाता।
- source_word: κωφοὶ ἀκούουσιν
  choice: बहरे सुनते हैं
  rationale: κωφός कभी गूँगे या बहरे के लिए आ सकता है, पर ἀκούουσιν के साथ यहाँ ‘बहरे’ स्पष्ट अर्थ है।
- source_word: νεκροὶ ἐγείρονται
  choice: मरे हुए जिलाए जाते हैं
  rationale: कर्मवाच्य रूप और मृतकों पर किए गए जीवन-दायक कार्य को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πτωχοὶ
  choice: गरीबों
  rationale: सामाजिक-आर्थिक अर्थ और यशायाह-संबंधी प्रतिध्वनि को बिना अनावश्यक आध्यात्मिकीकरण के सुरक्षित रखता है।
- source_word: εὐαγγελίζονται
  choice: शुभ समाचार सुनाया जाता है
  rationale: कर्मवाच्य अर्थ में गरीबों को समाचार के प्राप्तकर्ता के रूप में रखता है और बाद की तकनीकी कलीसियाई शब्दावली को मुख्य पाठ पर आरोपित नहीं करता।
theological_decisions:
- issue: εὐαγγελίζονται का अनुवाद और ‘सुसमाचार’ की पारिभाषिक भाषा
  choice: गरीबों को शुभ समाचार सुनाया जाता है
  alternative: गरीबों को सुसमाचार सुनाया जाता है
  rationale: चुना हुआ रूप ‘अच्छी खबर सुनाने’ के मूल क्रियात्मक अर्थ और कर्मवाच्य को स्पष्ट रखता है, जबकि वैकल्पिक पारिभाषिक अनुवाद पादटिप्पणी में दिया गया है।
- issue: चमत्कारों की सूची और मसीही पूर्ति
  choice: मुख्य पाठ में केवल कार्यों का सीधा वर्णन
  alternative: मुख्य पाठ में यशायाह की भविष्यवाणी की पूर्ति को स्पष्ट रूप से जोड़ना
  rationale: यह सूची यशायाह 35:5–6 और 61:1 की प्रबल प्रतिध्वनि करती है, किंतु यूनानी पद स्वयं ‘पूर्ति’ शब्द नहीं जोड़ता; इसलिए संबंध पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। समानांतर चमत्कार-सूची की लय बनाए रखने के लिए छोटे वर्तमानकालीन खंड रखे गए हैं; कर्मवाच्य रूप वहाँ सुरक्षित हैं जहाँ यूनानी में प्राप्तकर्ता और दैवी कार्य प्रमुख हैं।
