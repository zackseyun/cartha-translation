id: MAT.11.28
reference: Matthew 11:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: hi
  text: तुम सब, जो परिश्रम करते हो और बोझ से दबे हुए हो[a], मेरे पास आओ; और मैं तुम्हें विश्राम दूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिन पर बोझ लादा गया है और जो अब भी उसके नीचे दबे हैं।” यूनानी का पूर्णकालिक कर्मवाच्य रूप उस बनी हुई दशा को व्यक्त करता है जो किसी पर बोझ लादे जाने से उत्पन्न हुई है।
    reason: lexical_alternative
  - marker: b
    text: या “मैं तुम्हें राहत पहुँचाऊँगा” अथवा “तरोताज़ा करूँगा।” इस क्रिया का अर्थ किसी को विश्राम देना या ताज़गी और राहत पहुँचाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε πρός με
  choice: मेरे पास आओ
  rationale: आमंत्रणसूचक आज्ञार्थ और व्यक्ति की ओर आने की गति—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πάντες
  choice: तुम सब
  rationale: निमंत्रण के व्यापक दायरे को स्पष्ट करता है और यूनानी बहुवचन को बनाए रखता है।
- source_word: οἱ κοπιῶντες
  choice: जो परिश्रम करते हो
  rationale: सक्रिय रूप से मेहनत या कठिन परिश्रम करने का अर्थ सुरक्षित रखता है; केवल थकान की अवस्था तक अर्थ को सीमित नहीं करता।
- source_word: πεφορτισμένοι
  choice: बोझ से दबे हुए हो
  rationale: यूनानी पूर्णकालिक कर्मवाच्य कृदंत किसी पर बोझ लादे जाने के फलस्वरूप बनी हुई वर्तमान दशा को सूचित करता है।
- source_word: κἀγὼ
  choice: और मैं
  rationale: यूनानी में व्यक्त कर्ता और उसके हल्के बलाघात को बिना अतिशयोक्ति के बनाए रखता है।
- source_word: ἀναπαύσω ὑμᾶς
  choice: मैं तुम्हें विश्राम दूँगा
  rationale: किसी को विश्राम देने या उसे राहत पहुँचाने के व्यापक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἀναπαύσω में प्रतिज्ञा किए गए विश्राम का स्वरूप
  choice: “मैं तुम्हें विश्राम दूँगा” के रूप में व्यापक रखा गया है।
  alternative: “मैं तुम्हें तरोताज़ा कर दूँगा” अथवा विश्राम को केवल आत्मिक, भावनात्मक, शारीरिक या युगांत-संबंधी बताना।
  rationale: इस पद में विश्राम के स्वरूप को संकीर्ण रूप से परिभाषित नहीं किया गया है। व्यापक अनुवाद मूल की धर्मवैचारिक समृद्धि और तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और सम्मानपूर्ण हिन्दी। “तुम सब” मूल के व्यापक बहुवचन को स्पष्ट करता है। वाक्य-विन्यास हिन्दी में स्वाभाविक रखा गया है, जबकि आमंत्रण, लगातार परिश्रम, लादे गए बोझ की बनी हुई दशा और यीशु की व्यापक प्रतिज्ञा सुरक्षित हैं।
