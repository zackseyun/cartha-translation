reference: Matthew 11:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: hi
  text: मैं तुमसे सच कहता हूँ, स्त्रियों से जन्मे लोगों में यूहन्ना बपतिस्मा देनेवाले से बड़ा कोई प्रकट नहीं हुआ है[a][b]; फिर भी स्वर्ग के राज्य में सबसे छोटा व्यक्ति उससे बड़ा है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उठ खड़ा हुआ है’ अथवा ‘उठाया गया है।’ यूनानी क्रिया का अर्थ ‘उठ खड़ा होना’ या ‘उठाया जाना’ हो सकता है; यहाँ संभवतः आशय इतिहास में प्रकट होने से है, पुनरुत्थान से नहीं।
    reason: lexical_alternative
  - marker: b
    text: ‘स्त्रियों से जन्मे लोग’ एक सेमिटिक अभिव्यक्ति है, जिसका अर्थ मनुष्यजाति के लोग है।
    reason: cultural_note
  - marker: c
    text: या, ‘कमतर व्यक्ति’ अथवा ‘सबसे छोटा।’ यूनानी में यहाँ तुलनात्मक रूप है, पर प्रसंग में इसका अर्थ राज्य में सबसे कम पद या प्रतिष्ठा वाला व्यक्ति हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: सच
  rationale: यह किसी गंभीर और अधिकारपूर्ण कथन की भूमिका है। ‘मैं तुमसे सच कहता हूँ’ आधुनिक हिन्दी में स्वाभाविक है और सूत्र की गंभीरता बनाए रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: बहुवचन ὑμῖν को ‘तुमसे’ द्वारा स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: οὐκ ἐγήγερται
  choice: कोई उठ खड़ा नहीं हुआ
  rationale: ἐγείρω के पूर्णकाल रूप में उठने, प्रकट होने या खड़ा किए जाने की अर्थ-संभावना है। मुख्य पाठ में ‘उठ खड़ा नहीं हुआ’ ऐतिहासिक रूप से सामने आने का भाव रखता है और पुनरुत्थान का अर्थ अनावश्यक रूप से नहीं थोपता।
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: स्त्रियों से जन्मे हुओं में
  rationale: मूल सेमिटिक अभिव्यक्ति की संरचना और बाइबिलीय रंग को रखते हुए इसे सुबोध हिन्दी में दिया गया है।
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: यूहन्ना बपतिस्मा देनेवाले से बड़ा कोई
  rationale: तुलनात्मक रचना को स्पष्ट और स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त किया गया है।
- source_word: τοῦ βαπτιστοῦ
  choice: बपतिस्मा देनेवाले
  rationale: यह βαπτιστής के कार्य को सीधे व्यक्त करता है और हिन्दी पाठकों के लिए प्रचलित तथा स्पष्ट पदवी है।
- source_word: ὁ δὲ μικρότερος
  choice: फिर भी ... जो सबसे छोटा है
  rationale: δὲ के विरोधसूचक भाव को ‘फिर भी’ और μικρότερος के पद या प्रतिष्ठा में न्यूनतम होने के मुहावरेदार भाव को ‘सबसे छोटा’ से व्यक्त किया गया है; तुलनात्मक रूप की वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: स्वर्ग के राज्य में
  rationale: यह मत्ती की विशिष्ट अभिव्यक्ति का मानक, स्वाभाविक और अर्थ-संगत हिन्दी रूप है।
- source_word: μείζων αὐτοῦ ἐστιν
  choice: वह उससे बड़ा है
  rationale: तुलना को बिना अतिरिक्त व्याख्या के सीधे और स्पष्ट रूप में रखा गया है।
theological_decisions:
- issue: यूहन्ना की महानता और स्वर्ग के राज्य में सबसे छोटे व्यक्ति के बीच तुलना
  choice: विरोधाभासी प्रतीत होने वाली तुलना को ज्यों का त्यों रखा गया है और यह नहीं बताया गया कि राज्य में सबसे छोटा व्यक्ति यूहन्ना से किस अर्थ में बड़ा है।
  alternative: इसे पुरानी और नई वाचा के विशेषाधिकार, उद्धार-इतिहास में स्थान, व्यक्तिगत पवित्रता या राज्य में शिष्य की स्थिति के रूप में स्पष्ट करना।
  rationale: पद स्वयं तुलना का धर्मवैज्ञानिक आधार स्पष्ट नहीं करता। किसी एक व्याख्या को मुख्य पाठ में जोड़ना मूल की तनावपूर्ण खुली अर्थवत्ता को समय से पहले सीमित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘स्त्रियों से जन्मे हुओं’ और ‘स्वर्ग के राज्य’ जैसी बाइबिलीय अभिव्यक्तियाँ अर्थ-स्पष्टता के साथ सुरक्षित हैं; वाक्य की धर्मवैज्ञानिक विडंबना की व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
