base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: hi
  text: वे कहते हैं, ‘हमने तुम्हारे लिए बाँसुरी बजाई, पर तुम नहीं नाचे; हमने शोकगीत गाया, पर तुमने छाती पीटकर शोक नहीं किया।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: वे कहते हैं
  rationale: वर्तमान काल दृष्टांत के दृश्य में बच्चों की शिकायत को सजीव ढंग से प्रस्तुत करता है।
- source_word: Ηὐλήσαμεν
  choice: हमने तुम्हारे लिए बाँसुरी बजाई
  rationale: αὐλέω विशेष रूप से बाँसुरी या पाइप जैसा वाद्य बजाने को दर्शाता है; ‘बाँसुरी बजाई’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ὑμῖν
  choice: तुम्हारे लिए
  rationale: यह उस संगीत-प्रस्तुति को व्यक्त करता है जो सामने वालों के लिए की गई थी।
- source_word: ὠρχήσασθε
  choice: तुम नहीं नाचे
  rationale: मध्यवाच्य रूप का यहाँ स्वाभाविक अर्थ सामान्यतः ‘नाचना’ है; अलग आत्मवाचक भाव जोड़ने की आवश्यकता नहीं।
- source_word: ἐθρηνήσαμεν
  choice: हमने शोकगीत गाया
  rationale: θρηνέω शोक-विलाप, विशेषकर अंत्येष्टि-संबंधी विलाप, को दर्शाता है; ‘शोकगीत गाया’ बाँसुरी बजाने के समानांतर क्रियात्मक चित्र बनाए रखता है।
- source_word: ἐκόψασθε
  choice: तुमने छाती पीटकर शोक नहीं किया
  rationale: κόπτω का मध्यवाच्य यहाँ शोक में अपने को पीटने, विशेषकर छाती पीटने, की प्रथा को सूचित करता है। प्रत्यक्ष अभिव्यक्ति मूल के सांस्कृतिक और शारीरिक चित्र दोनों को सुरक्षित रखती है।
