  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन में बच्चों के खेल का उत्सवी और शोकपूर्ण विरोध स्पष्ट है। ‘छाती पीटकर शोक’ मूल यूनानी संकेत को स्वाभाविक हिन्दी में स्पष्ट करता है, इसलिए अलग सांस्कृतिक पादटिप्पणी आवश्यक नहीं मानी गई।
