translation:
  language: hi
  text: 'और यीशु ने उन्हें उत्तर दिया,[a] “जाकर यूहन्ना को बताओ कि तुम क्या सुन और देख रहे हो:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “और यीशु ने उत्तर देकर उनसे कहा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: आरंभिक संयोजक कथा को पिछले प्रसंग से सीधे जोड़ता है; ‘और’ उसके सामान्य संयोजक बल को बनाए रखता है।
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: ने उन्हें उत्तर दिया
  rationale: यह यूनानी कथात्मक पदबंध शब्दशः ‘उत्तर देकर उनसे कहा’ है, पर आधुनिक हिन्दी में ‘उन्हें उत्तर दिया’ स्वाभाविक है और उत्तर तथा कथन—दोनों का संवादात्मक कार्य व्यक्त करता है।
- source_word: Πορευθέντες
  choice: जाकर
  rationale: आज्ञार्थक क्रिया से पहले आया यह कृदंत सहगामी आज्ञा का भाव देता है; ‘जाकर ... बता दो’ क्रम और आदेश दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπαγγείλατε
  choice: बता दो
  rationale: यहाँ अर्थ यूहन्ना के पास लौटकर देखी-सुनी बातों का समाचार देना है। ‘बता दो’ सामान्य आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: Ἰωάννῃ
  choice: यूहन्ना को
  rationale: सम्प्रदान कारक अप्रत्यक्ष कर्म को दर्शाता है; हिन्दी में इसे ‘को’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: कि तुम क्या सुन और देख रहे हो
  rationale: संबंधवाचक सर्वनाम को ‘क्या’ से और वर्तमानकालीन प्रत्यक्ष अनुभव को ‘सुन और देख रहे हो’ से व्यक्त किया गया है। संयुक्त सहायक क्रिया हिन्दी में दोनों क्रियाओं पर लागू होती है।
theological_decisions:
- issue: ἀποκριθεὶς ... εἶπεν कथात्मक सूत्र का अनुवाद
  choice: ने उन्हें उत्तर दिया
  alternative: उत्तर देकर उनसे कहा
  rationale: संक्षिप्त रूप आधुनिक हिन्दी में अधिक स्वाभाविक है और कोई धार्मिक आशय नहीं घटाता। अधिक शब्दशः रूप को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘बता दो’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी यूनानी कथात्मक पदबंध की अधिक शब्दशः संरचना सुरक्षित रखती है।
