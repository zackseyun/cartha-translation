  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: hi
  text: क्योंकि सभी भविष्यद्वक्ताओं और व्यवस्था ने यूहन्ना तक[a] भविष्यवाणी की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यूहन्ना के समय तक।” यह वाक्यांश यूहन्ना को भविष्यसूचक साक्ष्य की पराकाष्ठा के रूप में प्रस्तुत कर सकता है, या भविष्यसूचक साक्ष्य के संक्रमण को चिह्नित करने वाली सीमा के रूप में।
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: सभी
  rationale: यह οἱ προφῆται के साथ मिलकर भविष्यद्वक्ताओं के पूरे समूह को सामूहिक रूप से दर्शाता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संयोजक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οἱ προφῆται
  choice: भविष्यद्वक्ताओं
  rationale: परमेश्वर की ओर से भविष्यसूचक वचन बोलने वालों के लिए यह मानक और प्रचलित हिन्दी पद है।
- source_word: ὁ νόμος
  choice: व्यवस्था
  rationale: यह सामान्य नियम नहीं, बल्कि इस्राएल के मान्य धर्मग्रन्थीय विधान अर्थात तोराह की ओर संकेत करता है। ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में इस अर्थ को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἕως Ἰωάννου
  choice: यूहन्ना तक
  rationale: यह समय-सीमा को संक्षेप और स्वाभाविक रूप से व्यक्त करता है तथा इस अस्पष्टता को बनाए रखता है कि यूहन्ना भविष्यसूचक साक्ष्य की पराकाष्ठा है या उसके युग की सीमा।
- source_word: ἐπροφήτευσαν
  choice: भविष्यवाणी की
  rationale: यह यूनानी क्रिया का सीधा और सहज अनुवाद है। इसे ‘भविष्यद्वक्ताओं’ और ‘व्यवस्था’ दोनों से जोड़कर मूल पाठ में व्यवस्था के मानवीकरण और उसके भविष्यसूचक साक्ष्य को सुरक्षित रखा गया है।
theological_decisions:
- issue: ὁ νόμος को सामान्य नियम माना जाए या धर्मग्रन्थीय पद
  choice: व्यवस्था
  alternative: नियम / कानून
  rationale: भविष्यद्वक्ताओं के साथ इसका युग्म स्पष्ट करता है कि आशय इस्राएल के धर्मग्रन्थीय विधान से है, न कि सामान्य कानूनी सिद्धान्त से।
- issue: ἕως Ἰωάννου में यूहन्ना का भविष्यसूचक युग में समावेश या उसकी सीमा होना
  choice: यूहन्ना तक
  alternative: यूहन्ना के समय तक
  rationale: मूल वाक्यांश इस प्रश्न को पूरी तरह हल नहीं करता। ‘यूहन्ना तक’ समय-सीमा को रखते हुए किसी एक धर्मवैचारिक व्याख्या को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘भविष्यवाणी की’ को दोनों संयुक्त कर्ताओं के साथ रखकर मूल यूनानी की संरचना और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
