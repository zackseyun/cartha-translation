  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: hi
  text: क्योंकि मेरा जूआ हितकारी है और मेरा बोझ हलका है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζυγός
  choice: जूआ
  rationale: यह बोझ ढोने के लिए पशुओं पर रखे जाने वाले जूए का सीधा और पारंपरिक रूपक है; हिन्दी में यीशु की अधीनता और शिक्षा—दोनों के भाव को बनाए रखता है।
- source_word: χρηστός
  choice: हितकारी
  rationale: χρηστός का अर्थ केवल ‘आसान’ नहीं, बल्कि भला, कृपालु, उपयोगी या कल्याणकारी भी हो सकता है। ‘हितकारी’ जूए के संदर्भ में स्वाभाविक हिन्दी देते हुए उसकी भलाई और लाभदायक प्रकृति को व्यक्त करता है, बिना उसे मात्र श्रमहीन बताने के।
- source_word: φορτίον
  choice: बोझ
  rationale: यह उठाए या ढोए जाने वाले भार का सामान्य शब्द है; ‘बोझ’ रूपक और उसके वजन—दोनों को स्पष्ट रखता है।
- source_word: ἐλαφρόν
  choice: हलका
  rationale: यह भारी के विपरीत कम वजन या कम दबाव का सीधा अर्थ देता है और हिन्दी में ‘बोझ’ के साथ स्वाभाविक है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताने वाला संयोजक है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्पष्ट रखता है।
theological_decisions:
- issue: यीशु के जूए की प्रकृति
  choice: ‘हितकारी’—जूए को भला और मनुष्य के हित में बताया गया है।
  alternative: ‘सहज’ या ‘आसान’—जूए को मुख्यतः उठाने में सुगम बताता।
  rationale: χρηστός में भलाई, कृपालुता और उपयुक्तता का भाव है। ‘हितकारी’ इस व्यापक अर्थ को बनाए रखता है और यह धारणा नहीं थोपता कि शिष्यत्व में कोई कठिनाई नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है। ‘जूआ’ बाइबिलीय रूपक को बनाए रखता है, जबकि ‘हितकारी’ मूल के असामान्य किंतु अर्थपूर्ण विशेषण को स्वाभाविक हिन्दी में प्रस्तुत करता है।
