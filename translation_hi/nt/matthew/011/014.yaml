  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: hi
  text: और यदि तुम इसे स्वीकार करने को तैयार हो[a], तो वही एलिय्याह है जो आनेवाला है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “यदि तुम इसे ग्रहण करने को तैयार हो।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात् यूहन्ना बपतिस्मा देनेवाले की पहचान उस प्रतिज्ञात एलिय्याह के रूप में की गई है जिसके आने की अपेक्षा थी; मलाकी 4:5 और मत्ती 17:10–13 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह पिछले कथन से सीधे संबंध जोड़ता है और यूनानी संयोजक की सरलता बनाए रखता है।
- source_word: εἰ θέλετε δέξασθαι
  choice: यदि तुम इसे स्वीकार करने को तैयार हो
  rationale: θέλετε के साथ infinitive इच्छा मात्र नहीं, बल्कि तत्परता व्यक्त करता है। δέξασθαι का यहाँ अर्थ यीशु के कथन को स्वीकार करना है; हिन्दी में अर्थ स्पष्ट और स्वाभाविक बनाने के लिए निहित कर्म के रूप में ‘इसे’ जोड़ा गया है।
- source_word: αὐτός
  choice: यही
  rationale: सर्वनाम यूहन्ना बपतिस्मा देनेवाले की ओर संकेत करता है। ‘यही’ हिन्दी में संभावित बल को स्वाभाविक रूप से व्यक्त करता है, बिना ‘वह स्वयं’ जैसी अनावश्यक कठोरता के।
- source_word: ἐστιν Ἠλίας
  choice: वह एलिय्याह है
  rationale: मूल पाठ पहचान को सीधे व्यक्त करता है; इसलिए इसे ‘एलिय्याह के समान’ या ‘एलिय्याह की भूमिका में’ कहकर कमजोर नहीं किया गया। ‘एलिय्याह’ हिन्दी बाइबलीय परंपरा में प्रचलित नामरूप है।
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: जिसे आना था
  rationale: यह उस प्रतिज्ञात व्यक्ति की भविष्यवाणी-संबंधी अपेक्षा को व्यक्त करता है जो आनेवाला था। वर्तमान प्रसंग में ‘जिसे आना था’ स्वाभाविक हिन्दी है और यीशु द्वारा उस अपेक्षा की यूहन्ना में पहचान को स्पष्ट रखता है।
theological_decisions:
- issue: यूहन्ना बपतिस्मा देनेवाले की एलिय्याह के रूप में पहचान
  choice: ‘यही वह एलिय्याह है’ के रूप में सीधा कथन
  alternative: ‘वह एलिय्याह की भूमिका पूरी करता है’ या ‘वह एलिय्याह के समान है’
  rationale: यूनानी पाठ स्पष्ट रूप से αὐτός ἐστιν Ἠλίας कहता है, पर इसे सुननेवालों की स्वीकार करने की तत्परता से जोड़ता है। अनुवाद इस पहचान और उससे जुड़ी व्याख्यात्मक जटिलता—दोनों को बनाए रखता है, उनका कोई सांप्रदायिक समाधान नहीं देता।
translation_notes:
  register: भाषा आधुनिक, सहज और सम्मानपूर्ण रखी गई है। ‘स्वीकार करने को तैयार’ सामान्य पाठक के लिए स्वाभाविक है; ‘ग्रहण’ को अधिक शाब्दिक विकल्प के रूप में पादटिप्पणी में दिया गया है। वाक्य में ‘यही वह’ पहचान के बल को बनाए रखता है।
