source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: hi
  text: जब यीशु ने अपने बारह शिष्यों को निर्देश देने[a] का काम पूरा कर लिया, तब वे वहाँ से उनके नगरों[b] में शिक्षा देने और प्रचार करने के लिए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आदेश देने’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘उनके नगरों’ का आशय अस्पष्ट है; इससे शिष्यों के नगर या आसपास के लोगों के नगर अभिप्रेत हो सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: जब … तब
  rationale: मत्ती का यह सामी शैली का कथात्मक सूत्र यहाँ समय और अगले घटनाक्रम की भूमिका बाँधता है। ‘जब … तब’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से ‘ऐसा हुआ’ जोड़ने से बचता है।
- source_word: ἐτέλεσεν
  choice: दे चुके थे
  rationale: यह रूप निर्देश देने का काम अगली क्रिया से पहले पूरा हो जाने को दिखाता है; हिन्दी का पूर्ण भूतकाल उस क्रम को सहज रूप से व्यक्त करता है।
- source_word: διατάσσων
  choice: निर्देश
  rationale: शब्द अधिकारपूर्वक निर्देश या आदेश देने का भाव रखता है। प्रसंग में ‘निर्देश’ स्वाभाविक है, जबकि अधिक प्रबल शाब्दिक विकल्प ‘आदेश’ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: अपने बारह शिष्यों को
  rationale: ‘शिष्य’ सुसमाचार के प्रसंग में μαθητής का स्थापित और सटीक हिन्दी रूप है; ‘अपने’ यूनानी संबंधसूचक सर्वनाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μετέβη ἐκεῖθεν
  choice: वह वहाँ से … चले गए
  rationale: यह पद पिछले स्थान से आगे जाने को बताता है। आदरसूचक बहुवचन आधुनिक हिन्दी में यीशु के उल्लेख के लिए स्वाभाविक और गरिमापूर्ण है।
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: शिक्षा देने और प्रचार करने के लिए
  rationale: सव्यय अनंत रूप उद्देश्य व्यक्त करता है। अनुवाद शिक्षा देने और सार्वजनिक रूप से संदेश सुनाने की दोनों अलग क्रियाओं को बनाए रखता है।
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: उनके नगरों में
  rationale: यह निकट औपचारिक समतुल्य है और αὐτῶν का संदर्भ अनिर्धारित रहने देता है। ‘नगर’ πόλις के लिए उपयुक्त है और हिन्दी में बड़े या छोटे शहरी स्थान के लिए पर्याप्त लचीला है।
theological_decisions:
- issue: ἐν ταῖς πόλεσιν αὐτῶν में αὐτῶν का संदर्भ
  choice: ‘उनके नगरों’ कहकर अस्पष्टता बनाए रखी गई है।
  alternative: ‘शिष्यों के नगरों में’ या ‘उस क्षेत्र के नगरों में’ कहकर संदर्भ स्पष्ट करना।
  rationale: यूनानी सर्वनाम स्वयं स्पष्ट नहीं करता कि नगर किसके हैं। किसी एक अर्थ को मुख्य पाठ में चुनना मूल पाठ से अधिक व्याख्या जोड़ देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यीशु के लिए हिन्दी की स्वाभाविक आदरसूचक क्रिया ‘चले गए’ प्रयुक्त हुई है। ‘जब … तब’ कथात्मक संक्रमण को सरल बनाता है, और दोनों पादटिप्पणी चिह्न संबंधित शब्दों के तुरंत बाद दिए गए हैं।
