id: MAT.11.27
reference: Matthew 11:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: hi
  text: सब कुछ मेरे पिता ने मुझे सौंप दिया है, और कोई भी पुत्र को पिता के सिवा नहीं जानता; न कोई पिता को जानता है, सिवाय पुत्र के और उस व्यक्ति के जिसे पुत्र उसे प्रकट करना चाहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का व्यापक, समग्र अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना उसके दायरे को अनावश्यक रूप से सीमित किए।
- source_word: παρεδόθη
  choice: सौंप दिया है
  rationale: अओरिस्ट कर्मवाच्य में पिता से पुत्र को हस्तांतरण का भाव है; हिन्दी का पूर्ण वर्तमान उस सम्पन्न कार्य और उसके वर्तमान परिणाम दोनों को सहज रूप से व्यक्त करता है।
- source_word: ἐπιγινώσκει
  choice: जानता
  rationale: यहाँ क्रिया पारस्परिक और विशिष्ट ज्ञान को दर्शाती है। केवल उपसर्ग के आधार पर ‘पूरी तरह जानता’ जोड़ना अर्थ को आवश्यकता से अधिक स्पष्ट कर सकता है; प्रसंग स्वयं ज्ञान की अद्वितीयता बताता है।
- source_word: εἰ μὴ
  choice: के सिवा
  rationale: नकारात्मक अपवाद-वाक्य में यह स्वाभाविक हिन्दी समतुल्य है और दोनों समानांतर खंडों को संतुलित रखता है।
- source_word: ᾧ ἐὰν βούληται
  choice: जिस पर ... चाहे
  rationale: अनिश्चित सम्बन्धवाचक और βούλομαι की इच्छात्मक/निर्णयात्मक शक्ति को सहज हिन्दी में सुरक्षित रखता है, बिना इसे केवल इच्छा या किसी विशिष्ट धर्मवैज्ञानिक प्रणाली तक सीमित किए।
- source_word: ἀποκαλύψαι
  choice: प्रकट करना
  rationale: दिव्य प्रकाशन या किसी को ज्ञात कराने के अर्थ का मानक और गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: ἐπιγινώσκω की शक्ति
  choice: ‘जानता’ रखा गया
  alternative: ‘पूरी तरह जानता’
  rationale: ἐπιγινώσκω कभी पूर्ण या निकट ज्ञान का संकेत दे सकता है, पर हर प्रयोग में स्पष्ट तीव्रता अनिवार्य नहीं है। यहाँ पिता और पुत्र के अद्वितीय पारस्परिक ज्ञान की विशिष्टता अपवाद-रचना से स्पष्ट है; अतः अनकहा तीव्रीकरण नहीं जोड़ा गया।
- issue: पुत्र की प्रकाशन-संबंधी इच्छा
  choice: ‘जिस पर पुत्र उसे प्रकट करना चाहे’
  alternative: ‘जिसे पुत्र उसे प्रकट करने के लिए चुने’
  rationale: βούληται में वास्तविक इच्छात्मक निर्णय सुरक्षित रहता है। ‘चाहे’ मूल की अर्थगत खुली बनावट को बनाए रखता है और किसी संप्रदायगत व्याख्या को आरोपित नहीं करता।
- issue: अंतिम सम्बन्धवाचक वाक्य का आशय
  choice: ‘और वह भी, जिस पर...’ द्वारा उस व्यक्ति को पिता को जानने वालों में सम्मिलित किया
  alternative: ऐसी रचना जिसमें ‘पुत्र और व्यक्ति’ दोनों ‘सिवा’ के सीधे समानान्तर पद बनें
  rationale: यूनानी καὶ ᾧ ἐὰν... का अर्थ है कि पुत्र के अतिरिक्त वह व्यक्ति भी पिता को जानता है जिसे पुत्र प्रकाशन देता है। हिन्दी में ‘और वह भी’ यह सम्बन्ध स्पष्ट करता है, जबकि मूल की शर्त और पुत्र की पहल सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण। ‘पिता’ और ‘पुत्र’ को सम्बन्धपरक उपाधियों के रूप में रखा गया है। मुख्य पाठ में सभी फुटनोट चिह्न उपस्थित हैं।
