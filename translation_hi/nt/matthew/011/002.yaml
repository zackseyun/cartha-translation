id: MAT.11.2
reference: Matthew 11:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: hi
  text: जब यूहन्ना ने बंदीगृह में मसीह[a] के कामों के बारे में सुना, तो उसने अपने चेलों के द्वारा संदेश भेजा
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ख्रीस्त’।
    reason: Χριστός के पारंपरिक वैकल्पिक रूप को सुरक्षित रखना।
lexical_decisions:
- source_word: δὲ
  choice: तो
  rationale: यह पद कथा को आगे बढ़ाता है; हिन्दी के ‘जब…तो’ ढाँचे में इसका संक्रमण स्वाभाविक रूप से व्यक्त होता है, बिना कोई अतिरिक्त स्पष्ट कालसूचक शब्द जोड़ने के।
- source_word: ἀκούσας
  choice: जब यूहन्ना ने…सुना
  rationale: अओरिस्ट कृदन्त की पूर्ववर्ती क्रिया को स्वाभाविक हिन्दी कालवाचक उपवाक्य में व्यक्त किया गया है।
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: बंदीगृह में
  rationale: स्थान का अर्थ निकटता से सुरक्षित रहता है और शैली dignified तथा सहज है।
- source_word: τὰ ἔργα
  choice: कामों
  rationale: यह यीशु के सामर्थ्यपूर्ण कार्यों और व्यापक सेवाकार्य, दोनों को समेटने वाला सामान्य शब्द है तथा ἔργα की व्यापकता बनाए रखता है।
- source_word: τοῦ χριστοῦ
  choice: मसीह के
  rationale: यहाँ Χριστός पदवी के रूप में प्रयुक्त है; ‘मसीह’ हिन्दी बाइबलीय प्रयोग में अर्थ और यहूदी संदर्भ दोनों को सुरक्षित रखता है।
- source_word: πέμψας
  choice: संदेश भेजा
  rationale: अगले पद में संदेश की विषयवस्तु आती है; हिन्दी में केवल ‘भेजा’ कहने से यूहन्ना ने चेलों को भेजा, यह अर्थ अधिक प्रबल हो सकता है, जबकि यूनानी पाठ में माध्यम διά से व्यक्त है।
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: अपने चेलों के द्वारा
  rationale: διά के संबंधकारक प्रयोग से शिष्यों का मध्यस्थ माध्यम होना व्यक्त होता है; ‘अपने’ αὐτοῦ को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: संदर्भ में यह अभिषिक्त उद्धारकर्ता की पदवी है। ‘मसीह’ आधुनिक हिन्दी के सामान्य बाइबलीय पाठकों के लिए परिचित है; वैकल्पिक पारंपरिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। ‘बंदीगृह’ और ‘चेले’ परिचित बाइबलीय शब्दावली हैं। वाक्य अगले पद में आने वाले संदेश की विषयवस्तु के लिए जानबूझकर खुला रहता है।
