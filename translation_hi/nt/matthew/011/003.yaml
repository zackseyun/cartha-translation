translation:
  language: hi
  text: और उससे कहा, “क्या आप ही आने वाले हैं[a], या हम किसी और की प्रतीक्षा करें?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह जो आने वाला है” अथवा “जिसे आना है।” यूनानी अभिव्यक्ति मसीहा-संबंधी उपाधि के रूप में प्रयुक्त हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: और उससे कहा
  rationale: क्रिया का सीधा अर्थ ‘उससे कहा’ है। पद पिछले कथन को आगे बढ़ाता है, इसलिए हिन्दी में स्वाभाविक कथाप्रवाह के लिए ‘और’ रखा गया है।
- source_word: Σὺ εἶ
  choice: क्या ... आप ही हैं
  rationale: स्पष्ट सर्वनाम σύ के बल को स्वाभाविक हिन्दी में ‘आप ही’ व्यक्त करता है और प्रश्नवाचक रचना ‘क्या ... हैं’ बनती है।
- source_word: ὁ ἐρχόμενος
  choice: आनेवाला
  rationale: संज्ञा की तरह प्रयुक्त सप्रत्यय वर्तमान कृदंत का अर्थ ‘जो आनेवाला है’ है। ‘आनेवाला’ अपेक्षित मसीही व्यक्ति की उपाधि-सदृश शक्ति को बनाए रखता है, पर सीधे ‘मसीह’ जोड़कर अर्थ को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: ἢ
  choice: या
  rationale: यह प्रश्न के दूसरे विकल्प को प्रस्तुत करनेवाला सामान्य विकल्पसूचक संयोजक है।
- source_word: ἕτερον
  choice: किसी और
  rationale: इस पुल्लिंग एकवचन रूप का आशय किसी दूसरे व्यक्ति से है; आधुनिक हिन्दी में ‘किसी और’ सबसे स्वाभाविक है।
- source_word: προσδοκῶμεν
  choice: हम ... बाट जोहें
  rationale: इस विचार-विमर्शात्मक प्रश्न में वर्तमान रूप अपेक्षा और प्रतीक्षा दोनों का भाव रखता है। ‘बाट जोहें’ उस निरंतर प्रत्याशा को स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ὁ ἐρχόμενος का मसीही अथवा उपाधि-सदृश बल
  choice: मुख्य पाठ में ‘आनेवाला’
  alternative: ‘वह जो आनेवाला है’; ‘आनेवाला जन’; स्पष्ट रूप से ‘मसीह’
  rationale: लेखयुक्त कृदंत और प्रसंग एक पहचाने हुए अपेक्षित व्यक्ति की ओर संकेत करते हैं। ‘आनेवाला’ इस संकेत को बचाता है, जबकि ‘मसीह’ कह देना मूल यूनानी की तुलना में अधिक व्याख्यात्मक होता। पादटिप्पणी सामान्य कृदंतीय अर्थ की संभावना भी खुली रखती है।
- issue: प्रश्न में यीशु की पहचान के विषय में निहित तनाव
  choice: ‘आप ही हैं’ द्वारा पहचान की पुष्टि पूछना
  alternative: साधारण ‘क्या आप हैं’
  rationale: σύ के स्पष्ट प्रयोग का बल यह दिखाता है कि प्रश्न किसी आनेवाले व्यक्ति की सामान्य चर्चा नहीं, बल्कि यीशु की उसी अपेक्षित व्यक्ति के रूप में पहचान के बारे में है; फिर भी अनुवाद प्रश्न का उत्तर पहले से निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप। ‘आप’ यीशु को संबोधित करने के लिए स्वाभाविक सम्मान रखता है। ‘बाट जोहें’ अपेक्षा और प्रतीक्षा के संयुक्त भाव को बनाए रखता है; यदि अधिक बोलचाल का रूप वांछित हो तो ‘प्रतीक्षा करें’ संभव है।
