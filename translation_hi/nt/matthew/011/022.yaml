id: MAT.11.22
reference: Matthew 11:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: hi
  text: 'पर मैं तुमसे कहता हूँ: न्याय के दिन सोर और सैदा के लिए तुम्हारे लिए से अधिक सहनीय होगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: पर
  rationale: यह पिछले कथन के साथ प्रबल विरोध प्रकट करता है; ‘पर’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यह यीशु के सीधे और गंभीर संबोधन को बनाए रखता है; ‘तुमसे’ यूनानी बहुवचन संबोधन के लिए स्वाभाविक हिन्दी है।
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: सोर और सैदा के लिए
  rationale: सम्बन्धसूचक सम्प्रदान कारक उन नगरों को दर्शाता है जिनके लिए न्याय अधिक सहनीय होगा; ‘सोर’ और ‘सैदा’ प्रचलित हिन्दी बाइबलीय नाम हैं।
- source_word: ἀνεκτότερον
  choice: अधिक सहनीय
  rationale: तुलनात्मक रूप ऐसी बात को सूचित करता है जिसे अपेक्षाकृत अधिक सहा जा सके; यह संक्षिप्त, स्पष्ट और न्याय के प्रसंग के अनुकूल है।
- source_word: ἔσται
  choice: होगा
  rationale: भविष्यकालीन क्रिया को हिन्दी में सीधे भविष्यकाल से व्यक्त किया गया है; यूनानी की निर्वैयक्तिक तुलना को अनावश्यक संज्ञा जोड़े बिना रखा गया है।
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: न्याय के दिन
  rationale: यह आने वाले न्याय के समय को स्वाभाविक हिन्दी में व्यक्त करता है और κρίσις के न्यायिक अर्थ को सुरक्षित रखता है।
- source_word: ἢ ὑμῖν
  choice: तुम्हारी अपेक्षा
  rationale: यह तुलना को स्पष्ट और स्वाभाविक हिन्दी में पूरा करता है तथा संबोधित लोगों के बहुवचन को सामूहिक ‘तुम’ में बनाए रखता है।
theological_decisions:
- issue: आने वाले न्याय का स्वरूप
  choice: न्याय के दिन
  alternative: न्याय के एक दिन
  rationale: यूनानी पद में निश्चित उपपद नहीं है, फिर भी मत्ती के इस प्रसंग में यह पहचाने हुए भावी न्याय-दिवस की ओर संकेत करता है। ‘न्याय के दिन’ इसे स्वाभाविक रूप से व्यक्त करता है, बिना न्याय के परिणाम या विस्तृत सिद्धान्त को पाठ में जोड़ने के।
- issue: तुलना का आशय
  choice: सोर और सैदा के लिए ... अधिक सहनीय होगा
  alternative: सोर और सैदा की दशा ... अधिक सहनीय होगी
  rationale: मूल पाठ यह नहीं बताता कि ठीक कौन-सी ‘दशा’ या ‘दण्ड’ अधिक सहनीय होगा। निर्वैयक्तिक रचना उस निहितता और न्याय की गंभीरता को बनाए रखती है, जबकि कोई अतिरिक्त धर्मवैज्ञानिक विवरण नहीं जोड़ती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य में मूल यूनानी की संक्षिप्त, निर्वैयक्तिक तुलना सुरक्षित है; ‘दशा’, ‘दण्ड’ या ‘निंदा’ जैसी व्याख्यात्मक संज्ञाएँ नहीं जोड़ी गईं।
