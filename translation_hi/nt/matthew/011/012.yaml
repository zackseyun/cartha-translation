  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: hi
  text: परन्तु बपतिस्मा देने वाले यूहन्ना के दिनों से लेकर अब तक[a] स्वर्ग का राज्य हिंसा सह रहा है, और हिंसक लोग उसे बलपूर्वक छीन लेते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बपतिस्मा देने वाले यूहन्ना के दिनों से लेकर अब तक स्वर्ग का राज्य बलपूर्वक आगे बढ़ रहा है, और बलवान लोग उस पर अधिकार कर लेते हैं।” ‘हिंसा सह रहा है’ के लिए प्रयुक्त यूनानी क्रिया को मध्यवाच्य अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: परन्तु ... से
  rationale: ἀπό आरम्भ-बिंदु बताता है और δέ प्रसंग में हल्का मोड़ लाता है; ‘परन्तु ... से’ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: बपतिस्मा देनेवाले यूहन्ना के दिनों
  rationale: ‘दिनों’ यूनानी मुहावरे को बनाए रखता है, जबकि ‘बपतिस्मा देनेवाला’ उपाधि का स्पष्ट और सामान्य हिन्दी रूप है।
- source_word: ἕως ἄρτι
  choice: लेकर अब तक
  rationale: यह यूहन्ना के दिनों से यीशु के वर्तमान समय तक चली आ रही अवधि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: यह मत्ती की विशिष्ट अभिव्यक्ति का प्रचलित और अर्थ-संगत हिन्दी रूप है।
- source_word: βιάζεται
  choice: हिंसा सहता आया है
  rationale: मुख्य पाठ में क्रिया का कर्मवाच्य अर्थ लिया गया है। ‘आया है’ आरम्भ से अब तक जारी स्थिति को व्यक्त करता है; वैकल्पिक मध्यवाच्य अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: βιασταὶ
  choice: हिंसक लोग
  rationale: यह बल या हिंसा करनेवालों को सहज आधुनिक हिन्दी में व्यक्त करता है; यूनानी पुल्लिंग बहुवचन यहाँ मिश्रित/सामान्य मानव समूह के लिए भी प्रयुक्त हो सकता है, इसलिए ‘लोग’ अनावश्यक लैंगिक विशिष्टता से बचता है।
- source_word: ἁρπάζουσιν αὐτήν
  choice: उस पर बलपूर्वक अधिकार करते हैं
  rationale: ἁρπάζω के जबरन छीनने या कब्ज़ा करने के भाव को स्पष्ट करता है और राज्य के साथ हिन्दी में स्वाभाविक बैठता है।
theological_decisions:
- issue: राज्य के सम्बन्ध में βιάζεται का अर्थ
  choice: 'मुख्य पाठ में कर्मवाच्य अर्थ: ‘स्वर्ग का राज्य हिंसा सहता आया है’'
  alternative: 'मध्यवाच्य/अकर्मक अर्थ: ‘स्वर्ग का राज्य प्रबलता से आगे बढ़ रहा है’'
  rationale: यूनानी रूप वास्तव में अस्पष्ट है। कर्मवाच्य अर्थ आगे आनेवाले ‘हिंसक लोग’ और बलपूर्वक अधिकार करने की बात के साथ निकटता से जुड़ता है, पर मध्यवाच्य अर्थ भी भाषिक रूप से सम्भव है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। मुख्य पाठ यूनानी वाक्य की तीव्रता और विवादित कर्मवाच्य अर्थ को बनाए रखता है; वास्तविक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
