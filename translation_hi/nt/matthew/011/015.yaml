  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: जिसके … हों
  rationale: संज्ञा के रूप में प्रयुक्त यूनानी लेख और वर्तमान कृदन्त किसी भी ऐसे व्यक्ति को सामान्य रूप से दर्शाते हैं जिसमें यह विशेषता हो। हिंदी का ‘जिसके … हों’ इस सामान्य, एकवचन भाव को सहज और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ὦτα
  choice: कान
  rationale: यूनानी शब्द बहुवचन कर्मकारक है। हिंदी में ‘कान’ स्वाभाविक बहुवचन है और ध्यान देकर ग्रहण करने के मुहावरेदार संकेत को बनाए रखता है।
- source_word: ἀκουέτω
  choice: वह सुन ले
  rationale: यह तीसरे पुरुष, वर्तमानकालिक आज्ञार्थक रूप है। ‘वह सुन ले’ हिंदी में आज्ञा/आह्वान को स्वाभाविक रूप से व्यक्त करता है और ‘सुनना’ में बात को ग्रहण करने तथा मानने का व्यापक संकेत बना रहता है।
theological_decisions:
- issue: सामान्य अर्थ वाला पुल्लिंग एकवचन प्रयोग
  choice: जिसके कान हों, वह सुन ले।
  alternative: जिस किसी के कान हों, वह सुने।
  rationale: यूनानी रचना व्याकरण की दृष्टि से पुल्लिंग एकवचन है, पर अर्थ में किसी भी व्यक्ति पर लागू होती है। चुनी हुई हिंदी एकवचन ‘वह’ को बनाए रखते हुए वाक्य को सामान्य और स्वाभाविक रखती है; इसमें स्रोत से अधिक कोई सांप्रदायिक या व्याख्यात्मक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, स्मरणीय और गरिमापूर्ण आज्ञात्मक शैली। ‘जिसके कान हों’ सामान्य हिंदी में स्वाभाविक है और मूल के एकवचन सामान्य प्रयोग को पर्याप्त रूप से सुरक्षित रखता है।
