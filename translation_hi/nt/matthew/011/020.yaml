  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: hi
  text: तब वह उन नगरों को धिक्कारने लगा, जिनमें उसके सामर्थ्य के सबसे अधिक कार्य हुए थे[a], क्योंकि उन्होंने पश्चाताप नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘चमत्कार’ अथवा ‘सामर्थ्य के कार्य’ (यूनानी: द्यूनामेइस)।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह अगले घटनाक्रम का स्वाभाविक कालवाचक संकेत है।
- source_word: ἤρξατο ὀνειδίζειν
  choice: धिक्कारने लगा
  rationale: ‘लगा’ आरंभसूचक बल को बनाए रखता है, और ‘धिक्कारने’ कड़ी भर्त्सना का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰς πόλεις
  choice: उन नगरों को
  rationale: πόλις के लिए ‘नगर’ मानक और प्रसंगानुकूल है; ‘उन’ आगे आने वाले संबंधवाचक उपवाक्य से सहज जुड़ता है।
- source_word: ἐν αἷς ἐγένοντο
  choice: जिनमें ... हुए थे
  rationale: यह पूर्व में उन्हीं नगरों में घटित कार्यों को हिन्दी में स्वाभाविक भूतपूर्व रूप से व्यक्त करता है।
- source_word: αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: उसके अधिकांश सामर्थ्य के काम
  rationale: πλεῖσται का परिमाण ‘अधिकांश’ से और δυνάμεις का शक्ति-संबंधी अर्थ ‘सामर्थ्य के काम’ से सुरक्षित रहता है।
- source_word: ὅτι οὐ μετενόησαν
  choice: क्योंकि उन्होंने मन नहीं फिराया था
  rationale: ὅτι कारण बताता है; μετανοέω के नैतिक-आत्मिक प्रत्युत्तर को ‘मन फिराना’ स्पष्ट, प्रचलित और गैर-सांप्रदायिक ढंग से व्यक्त करता है।
theological_decisions:
- issue: चमत्कार-संदर्भ में δυνάμεις का अनुवाद
  choice: सामर्थ्य के काम
  alternative: चमत्कार; सामर्थ्य के कार्य
  rationale: यह यूनानी शब्द में निहित सामर्थ्य पर बल बनाए रखता है और उसे केवल आधुनिक श्रेणी ‘चमत्कार’ तक सीमित नहीं करता।
- issue: μετενόησαν का अनुवाद
  choice: मन नहीं फिराया था
  alternative: पश्चाताप नहीं किया था
  rationale: ‘मन फिराना’ नैतिक और आत्मिक परिवर्तन का भाव रखता है, पर किसी विशेष सांप्रदायिक व्याख्या को नहीं जोड़ता; ‘पश्चाताप करना’ भी वैध विकल्प है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। वाक्य में यूनानी की आरंभसूचक क्रिया, कारण-संबंध और δυνάμεις की शक्ति-संबंधी व्यापकता सुरक्षित रखी गई है।
