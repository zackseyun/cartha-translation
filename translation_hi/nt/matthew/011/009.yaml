source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: hi
  text: पर तुम क्या देखने बाहर गए थे? किसी भविष्यद्वक्ता को? हाँ, मैं तुमसे कहता हूँ, और भविष्यद्वक्ता से भी बढ़कर[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भविष्यद्वक्ता से अधिक।’ यूनानी में अधिक शाब्दिक रूप से, ‘भविष्यद्वक्ता से अधिक।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: पर फिर
  rationale: यह पिछले आलंकारिक प्रश्न से विरोध और अगले प्रश्न की ओर बढ़ने का संकेत देता है; आधुनिक हिन्दी में ‘पर फिर’ इस प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τί ἐξήλθατε
  choice: तुम क्या ... बाहर गए थे
  rationale: τί यहाँ ‘क्यों’ नहीं, बल्कि ‘क्या’ है और बाहर जाने के लक्ष्य की वस्तु पूछता है।
- source_word: ἰδεῖν
  choice: देखने
  rationale: यह उद्देश्य बताने वाला क्रियार्थक रूप है; ‘देखने’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: προφήτην
  choice: किसी भविष्यद्वक्ता को
  rationale: आलंकारिक प्रश्न में अनिश्चित एकवचन को हिन्दी में ‘किसी ... को’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ναί
  choice: हाँ
  rationale: यह पिछले प्रश्न का सीधा सकारात्मक उत्तर है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यह प्रचलित कथन-सूत्र को निकटता और गरिमा के साथ प्रस्तुत करता है।
- source_word: καὶ περισσότερον προφήτου
  choice: और भविष्यद्वक्ता से भी बढ़कर
  rationale: καὶ का योगात्मक/बलाघाती भाव ‘और ... भी’ से आता है, जबकि तुलनात्मक वाक्यांश को बिना अतिरिक्त कर्ता या व्याख्या जोड़े सुरक्षित रखा गया है।
theological_decisions:
- issue: यीशु के कथन में यूहन्ना की पहचान और हैसियत
  choice: ‘भविष्यद्वक्ता से भी बढ़कर’
  alternative: ‘भविष्यद्वक्ता से बड़ा व्यक्ति’
  rationale: मूल वाक्य यूहन्ना को भविष्यद्वक्ता की श्रेणी से ऊपर ठहराता है, पर इस उपवाक्य में यह नहीं बताता कि किस अर्थ में। संक्षिप्त तुलनात्मक अभिव्यक्ति उसी धार्मिक तनाव और खुलापन को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए प्रसंगानुकूल ‘तुम’ रखा गया है। भाषा सहज और गरिमापूर्ण है, तथा अंतिम वाक्यांश की मूल यूनानी संक्षिप्तता को यथासंभव बनाए रखा गया है।
