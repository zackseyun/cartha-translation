    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: आया
  rationale: अओरिस्ट क्रिया यहाँ यूहन्ना के लोगों के सामने आने को बताती है; ‘आया’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस संबंध को स्पष्ट रखता है।
- source_word: Ἰωάννης
  choice: यूहन्ना
  rationale: यह हिन्दी बाइबल परंपरा में Ἰωάννης का प्रचलित नाम-रूप है।
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: न खाता हुआ ... न पीता हुआ
  rationale: यूनानी की समानांतर कृदंत रचना और यूहन्ना की तपस्वी जीवन-शैली का संक्षिप्त वर्णन सुरक्षित रहता है। मूल में रोटी या दाखरस का स्पष्ट उल्लेख नहीं है, इसलिए उन्हें नहीं जोड़ा गया।
- source_word: καὶ λέγουσιν
  choice: और वे कहते हैं
  rationale: वर्तमान काल के सजीव, सामान्यीकृत कथन और अनिर्दिष्ट बहुवचन कर्ता—विरोध करने वाले लोगों—दोनों को ज्यों का त्यों रखा गया है।
- source_word: Δαιμόνιον ἔχει
  choice: उसमें दुष्टात्मा है
  rationale: यह हिन्दी में आरोप का स्वाभाविक मुहावरेदार रूप है और यूनानी ‘एक दुष्टात्मा रखता है/है’ के निकट रहता है; इसे अधिक व्याख्यात्मक ‘दुष्टात्मा से ग्रस्त है’ के रूप में मुख्य पाठ में नहीं बदला गया।
theological_decisions:
- issue: δαιμόνιον से संबंधित आरोप का अनुवाद
  choice: उसमें दुष्टात्मा है
  alternative: वह दुष्टात्मा से ग्रस्त है
  rationale: यह कथन यूहन्ना के विरोधियों का आरोप है, वर्णनकर्ता की पुष्टि नहीं। चुना हुआ रूप मूल अभिव्यक्ति के निकट रहते हुए आरोप की प्रकृति सुरक्षित रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘यूहन्ना’ प्रचलित बाइबलीय नाम-रूप है; ‘दुष्टात्मा’ δαιμόνιον को ‘शैतान’ से अलग रखता है।
