- source_word: οὕτως
  choice: यही
  rationale: यह पिछले पद में वर्णित परमेश्वर के छिपाने और प्रकट करने के ढंग की ओर संकेत करता है; “यही” उस पश्च-संदर्भ और बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εὐδοκία ἐγένετο
  choice: अच्छा लगा
  rationale: यह मुहावरेदार हिन्दी में प्रसन्नता अथवा अनुमोदन का भाव व्यक्त करता है, बिना इसे अनिवार्य रूप से किसी विधिवत आदेश या पूर्वनिर्धारित योजना का अर्थ दिए।
- source_word: ἔμπροσθέν σου
  choice: आपकी दृष्टि में
  rationale: शाब्दिक ‘आपके सामने’ का यहाँ अर्थ मूल्यांकन या प्रसन्नता की दृष्टि से है; “आपकी दृष्टि में” स्रोत की relational orientation बनाए रखता है।
theological_decisions:
- issue: क्या εὐδοκία को परमेश्वर की प्रसन्नता/अनुमोदन के रूप में व्यक्त किया जाए या उनकी संप्रभु इच्छा/योजना के रूप में
  choice: “आपकी दृष्टि में अच्छा लगा” द्वारा प्रसन्नता और अनुमोदन का भाव रखा गया है।
  alternative: “ऐसी ही आपकी प्रसन्न इच्छा थी” या “यह आपकी दृष्टि में मनभावना था।”
  rationale: यूनानी पदबंध पिता की प्रसन्नता व्यक्त करता है, पर अपने आप में किसी अधिक विशिष्ट धर्मवैज्ञानिक धारणा—जैसे अपरिवर्तनीय आदेश—को अनिवार्य नहीं करता। मुख्य पाठ स्वाभाविक हिन्दी में है और पादटिप्पणी संज्ञा εὐδοκία की वैकल्पिक अभिव्यक्ति सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। परमेश्वर को संबोधित करते हुए आदरसूचक “आपकी” रखा गया है। “अच्छा लगा” सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी अधिक औपचारिक ‘प्रसन्न इच्छा’ और ‘मनभावना’ विकल्प देती है।
