lexical_decisions:
- source_word: ναί
  choice: हाँ
  rationale: प्रार्थना में पिता की रीति के प्रति यीशु की स्पष्ट स्वीकृति व्यक्त करने वाला स्वाभाविक और सीधा हिन्दी शब्द।
- source_word: ὁ πατήρ
  choice: हे पिता
  rationale: लेखयुक्त कर्तृकारक यहाँ संबोधन के रूप में प्रयुक्त है; हिन्दी में “हे पिता” इसे स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ὅτι
