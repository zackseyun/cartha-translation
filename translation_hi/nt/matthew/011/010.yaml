  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: hi
  text: यह वही है जिसके विषय में लिखा है, “देखो[a], मैं अपने दूत को तुम्हारे सामने भेज रहा हूँ; वह तुम्हारे आगे तुम्हारा मार्ग तैयार करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक मुहावरेदार रूप में, ‘तुम्हारे आगे।’ यूनानी में यहाँ शाब्दिक रूप से ‘तुम्हारे चेहरे के सामने’ जैसी अधिक ठोस अभिव्यक्ति है, जो शास्त्रीय उद्धरण से आई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: यह वही है
  rationale: यह पहचान कराने वाले संकेतवाचक सर्वनाम का बल स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: περὶ οὗ
  choice: जिसके विषय में
  rationale: περί के संबंधसूचक अर्थ ‘के विषय में’ को स्पष्ट और औपचारिक किंतु सहज हिन्दी में रखता है।
- source_word: γέγραπται
  choice: लिखा है
  rationale: यह पवित्रशास्त्र उद्धरण की प्रचलित अभिव्यक्ति है और यूनानी पूर्णकाल के वर्तमान प्रभाव को बनाए रखती है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले भविष्यद्वाणी-संबंधी उद्गार को आधुनिक हिन्दी में गरिमापूर्ण और बोधगम्य रूप देता है।
- source_word: ἀποστέλλω
  choice: भेज रहा हूँ
  rationale: वर्तमान काल की सजीवता और आसन्न कार्य का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: ἄγγελόν
  choice: दूत
  rationale: संदर्भ में यह यूहन्ना जैसे मानवीय संदेशवाहक को सूचित करता है; ‘स्वर्गदूत’ कहना अनावश्यक रूप से अर्थ सीमित कर देगा।
- source_word: πρὸ προσώπου σου
  choice: तुम्हारे आगे
  rationale: शाब्दिक ‘तुम्हारे मुख के आगे’ आधुनिक हिन्दी में अस्वाभाविक है; ‘तुम्हारे आगे’ स्थानिक अर्थ को बिना भ्रम के संप्रेषित करता है।
- source_word: κατασκευάσει
  choice: तैयार करेगा
  rationale: मार्ग को प्रस्तुत करने अथवा तैयार करने के भाव का सीधा और स्वाभाविक समतुल्य है।
- source_word: τὴν ὁδόν σου
  choice: तुम्हारा मार्ग
  rationale: ‘मार्ग’ वास्तविक रास्ते और रूपकात्मक अर्थ दोनों को बनाए रखते हुए उद्धरण की गरिमा के अनुकूल है।
- source_word: ἔμπροσθέν σου
  choice: तुम्हारे आगे
  rationale: स्थानिक अर्थ को स्पष्ट रखता है और यूनानी उद्धरण में दूसरी बार आए पूर्वसर्गीय वाक्यांश को भी बनाए रखता है।
theological_decisions:
- issue: उद्धरण में दो समान स्थानसूचक वाक्यांशों का अनुवाद
  choice: दोनों को ‘तुम्हारे आगे’ के रूप में बनाए रखा गया
  alternative: पहले को ‘तुम्हारे मुख के आगे’ कहना, अथवा दोनों को मिलाकर केवल एक बार कहना
  rationale: यूनानी पाठ में πρὸ προσώπου σου और ἔμπροσθέν σου दोनों उपस्थित हैं। हिन्दी में शाब्दिक ‘मुख के आगे’ कृत्रिम है, पर दोनों वाक्यांशों को अलग-अलग बनाए रखने से मूल की पुनरुक्ति और जोर सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और शास्त्रीय उद्धरण के अनुकूल। ‘देखो’ को पुरातन ‘देख’ या अत्यधिक संस्कृतनिष्ठ विकल्पों पर वरीयता दी गई है। मूल यूनानी की पुनरुक्ति जानबूझकर सुरक्षित रखी गई है।
