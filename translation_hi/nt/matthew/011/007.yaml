id: MAT.11.7
reference: Matthew 11:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: hi
  text: जब वे जा रहे थे, यीशु ने भीड़ से यूहन्ना के विषय में बात करना शुरू किया, “तुम निर्जन प्रदेश में क्या देखने गए थे? हवा से हिलता हुआ सरकंडा?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हवा से हिलते सरकंडे का चित्र अस्थिरता या डगमगाहट का संकेत दे सकता है। प्रश्न का अपेक्षित उत्तर ‘नहीं’ है।
    reason: cultural_note
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: जब वे जा रहे थे
  rationale: संबंधवाचक स्वतंत्र कृदन्त समकालीन क्रिया दर्शाता है। निकटवर्ती प्रसंग से ‘वे’ का संकेत यूहन्ना के शिष्यों की ओर है; हिन्दी में सर्वनाम स्वाभाविक है और मूल की संदर्भगत निर्भरता बनाए रखता है।
- source_word: ἤρξατο ... λέγειν
  choice: कहना शुरू किया
  rationale: ἄρχομαι और infinitive का आरंभसूचक अर्थ सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: τοῖς ὄχλοις
  choice: भीड़ों से
  rationale: मूल का बहुवचन बनाए रखा गया है; ‘भीड़ों’ सामान्य आधुनिक हिन्दी में समझ में आने वाला रूप है।
- source_word: περὶ Ἰωάννου
  choice: यूहन्ना के विषय में
  rationale: περί के संबंध अथवा विषयसूचक अर्थ को गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: तुम निर्जन प्रदेश में क्या देखने गए थे?
  rationale: τί को ‘क्या’ रखा गया है, ‘क्यों’ नहीं। θεάομαι का उद्देश्यसूचक भाव ‘देखने’ से सहजता से व्यक्त होता है; ἔρημος के लिए ‘निर्जन प्रदेश’ इस यहूदी भू-दृश्य के अनुरूप है और केवल रेतीले मरुस्थल का अनावश्यक बोध नहीं कराता।
- source_word: κάλαμον
  choice: सरकंडे को
  rationale: κάλαμος के सामान्य अर्थ ‘reed’ के लिए आधुनिक हिन्दी का स्पष्ट और परिचित शब्द चुना गया है।
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: हवा से हिलते हुए
  rationale: निष्क्रिय कृदन्त को उसकी जारी क्रिया सहित रखा गया है; ‘हिलते हुए’ स्वाभाविक हिन्दी है और डगमगाने की अलंकारिक संभावना को बंद नहीं करता।
theological_decisions:
- issue: Τούτων (‘इन/वे’) का संदर्भ
  choice: ‘वे’ के रूप में रखा गया, जिसका निकटवर्ती संदर्भ यूहन्ना के शिष्य हैं
  alternative: ‘यूहन्ना के शिष्य’ स्पष्ट रूप से जोड़ना
  rationale: मूल पाठ संकेतात्मक सर्वनाम प्रयोग करता है। हिन्दी में ‘वे’ प्रसंग से स्पष्ट है और मूल की अभिव्यक्ति से अधिक स्पष्ट पहचान जोड़ने से बचाता है।
- issue: हवा से हिलते सरकंडे की अलंकारिक व्यंजना
  choice: मुख्य पाठ में चित्र को बिना व्याख्यात्मक विस्तार के रखा और टिप्पणी में संभावित अस्थिरता का संकेत दिया
  alternative: मुख्य पाठ में ही यूहन्ना की अस्थिरता के निषेध के रूप में अर्थ खोल देना
  rationale: यीशु का प्रश्न नकारात्मक उत्तर की अपेक्षा करता है, पर मूल पाठ स्वयं उपमा की व्याख्या नहीं करता। इसलिए व्यंजना को सुरक्षित रखते हुए पाठक-सहायक टिप्पणी दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘निर्जन प्रदेश’ भौगोलिक अर्थ को अनावश्यक रूप से ‘रेगिस्तान’ तक सीमित नहीं करता। वाक्य की प्रश्नात्मक लय और मूल का बहुवचन ‘भीड़ों’ सुरक्षित रखा गया है।
