revisions:
- from: जब वे जा रहे थे, तब यीशु ने यूहन्ना के विषय में भीड़ों से कहना शुरू किया, “तुम निर्जन प्रदेश में क्या देखने गए थे? हवा से हिलते हुए सरकंडे को?”[a]
  to: जब वे जा रहे थे, यीशु ने भीड़ से यूहन्ना के विषय में बात करना शुरू किया, “तुम निर्जन प्रदेश में क्या देखने गए थे? हवा से हिलता हुआ सरकंडा?[a]”
