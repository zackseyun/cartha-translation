  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: hi
  text: मनुष्य का पुत्र खाता-पीता आया, और वे कहते हैं, “देखो, पेटू और पियक्कड़ आदमी, चुंगी लेनेवालों और पापियों का मित्र!” और बुद्धि अपने कामों से सही ठहराई गई।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुद्धि अपने कामों से सही सिद्ध हुई।”
    reason: lexical_alternative
  - marker: b
    text: 'कुछ पांडुलिपियों में “कामों” के स्थान पर “संतानों” है: “बुद्धि अपनी संतानों से सही ठहराई गई।”'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु के आत्म-संदर्भित पदनाम का मानक बाइबलीय रूप है और इसके सामी तथा मसीही अर्थ-संकेतों को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: ἐσθίων καὶ πίνων
  choice: खाता-पीता
  rationale: यह सामान्य और लगातार दिखाई देनेवाले व्यवहार को सहज हिन्दी में व्यक्त करता है तथा यूहन्ना की तपस्वी जीवन-शैली से संदर्भगत विरोध को बिना ‘भोज करता’ जैसी अतिशयोक्ति के सुरक्षित रखता है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह सार्वजनिक आरोप की विस्मयात्मक और ध्यान खींचनेवाली शक्ति का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: φάγος
  choice: पेटू
  rationale: यह निंदात्मक संज्ञा है; ‘पेटू’ आरोप और अपमान, दोनों को संक्षेप में व्यक्त करता है।
- source_word: οἰνοπότης
  choice: पियक्कड़
  rationale: यह तटस्थ रूप से दाखमधु पीनेवाले व्यक्ति का नहीं, बल्कि अत्यधिक पीने का आरोप है; ‘पियक्कड़’ उस निंदात्मक भाव को बनाए रखता है।
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: चुंगी लेनेवालों और पापियों का मित्र
  rationale: यह मूल संबंध-रचना तथा इन सामाजिक-धार्मिक वर्गों से जुड़ी निंदा को सुरक्षित रखता है।
- source_word: ἐδικαιώθη
  choice: सही ठहराई गई
  rationale: यहाँ क्रिया का आशय सही या न्यायसंगत सिद्ध होने से है। यह हिन्दी में स्वाभाविक है और δικαιόω के व्यापक बाइबलीय प्रयोग से संबंध भी बनाए रखता है।
- source_word: ἡ σοφία
  choice: बुद्धि
  rationale: मूल के मानवीकरण को बिना यह तय किए सुरक्षित रखा गया है कि बुद्धि विशेष रूप से यीशु, परमेश्वर की योजना, या किसी अन्य धारणा को दर्शाती है।
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: अपने कामों से
  rationale: यह ἔργων और साधन/प्रमाण सूचक ἀπό का सहज हिन्दी रूप है; आत्मवाचक ‘अपने’ बुद्धि के मानवीकरण को स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य में ‘बुद्धि’ का अर्थ
  choice: ‘बुद्धि’ के मानवीकृत कथन को बिना किसी स्पष्ट पहचान के बनाए रखना
  alternative: इसे सीधे यीशु अथवा परमेश्वर की उद्धार-योजना के रूप में पहचानना
  rationale: मूल पाठ यह पहचान स्पष्ट नहीं करता; अतः इसकी साहित्यिक अस्पष्टता और धर्मवैज्ञानिक तनाव सुरक्षित रखा गया है।
- issue: अंतिम उपवाक्य का पाठांतर
  choice: SBLGNT के ἔργων के अनुसार मुख्य पाठ में ‘कामों’
  alternative: कुछ पांडुलिपियों का τέκνων, अर्थात ‘संतानों’
  rationale: दिए गए मूल-पाठ को मुख्य पाठ में अपनाया गया है और प्रसिद्ध पाठांतर को पाठकीय पारदर्शिता के लिए पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। आरोपों में बोलचाल की निंदात्मक शक्ति बनाए रखने के लिए ‘पेटू’ और ‘पियक्कड़’ चुने गए हैं। पादटिप्पणी चिह्न मुख्य पाठ में अंतिम संबंधित वाक्य के बाद दिए गए हैं।
