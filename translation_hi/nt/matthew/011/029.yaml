  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: hi
  text: मेरा जूआ अपने ऊपर ले लो और मुझसे सीखो[क], क्योंकि मैं कोमल और हृदय से विनम्र हूँ, और तुम अपने प्राणों के लिए विश्राम पाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “मैं नम्र और मन में दीन हूँ।”
    reason: πραΰς और ταπεινὸς τῇ καρδίᾳ के लिए पारंपरिक निकटवर्ती शब्दावली का वैकल्पिक अनुवाद; अंग्रेज़ी POB audit trail के lexical-alternative footnote को बनाए रखता है।
lexical_decisions:
- source_word: ἄρατε
  choice: उठा लो
  rationale: जूए के साथ यह प्रयोग उसे केवल ऊपर उठाने नहीं, बल्कि स्वयं पर स्वीकार करने का भाव देता है; ‘अपने ऊपर’ इस आशय को स्पष्ट करता है।
- source_word: ζυγόν
  choice: जूआ
  rationale: मूल रूपक को बनाए रखा गया है, क्योंकि यह शिक्षा और अधिकार के अधीन होने की केंद्रीय छवि है।
- source_word: ἐφ’ ὑμᾶς
  choice: अपने ऊपर
  rationale: ἐπί के दिशात्मक भाव और जूआ धारण करने की ठोस छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: मुझसे सीखो
  rationale: आज्ञार्थक क्रिया और ἀπό का सीधा, सहज अनुवाद; इसमें यीशु से शिक्षा पाने और शिष्यत्व, दोनों का भाव सुरक्षित है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यीशु से सीखने का कारण प्रस्तुत करने वाले व्याख्यात्मक संबंध को स्पष्ट रखता है।
- source_word: πραΰς
  choice: नम्र
  rationale: यह शब्द कोमल, अहिंसक और अकठोर स्वभाव का सकारात्मक भाव देता है; आधुनिक हिन्दी में ‘नम्र’ स्वाभाविक और सम्मानपूर्ण है।
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: मन में दीन
  rationale: ταπεινός की दीनता और τῇ καρδίᾳ की भीतरी प्रवृत्ति, दोनों को सुरक्षित रखता है; ‘मन’ हिन्दी में हृदयगत स्वभाव के लिए सहज है।
- source_word: εὑρήσετε
  choice: तुम ... पाओगे
  rationale: भविष्यकालीन प्रतिज्ञा को सीधे रूप में व्यक्त करता है।
- source_word: ἀνάπαυσιν
  choice: विश्राम
  rationale: मूल अर्थ और बाइबिलीय प्रतिध्वनि को बनाए रखने वाला स्पष्ट हिन्दी शब्द है।
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: अपने प्राणों के लिए
  rationale: दत्तिव संबंध को हिन्दी में स्वाभाविक ‘के लिए’ से व्यक्त किया गया है; ‘प्राणों’ से ψυχή के आंतरिक जीवन और संपूर्ण व्यक्ति से जुड़े अर्थ को बिना केवल भावनाओं तक सीमित किए सुरक्षित रखा गया है।
theological_decisions:
- issue: πραΰς ... καὶ ταπεινὸς τῇ καρδίᾳ में यीशु के चरित्र का वर्णन
  choice: मैं नम्र और मन में दीन हूँ
  alternative: मैं कोमल और हृदय से विनम्र हूँ
  rationale: चुना हुआ पाठ यीशु के आत्म-वर्णन की विनम्रता और भीतरी दीनता को अलग-अलग किंतु जुड़े हुए गुणों के रूप में रखता है। यह किसी संप्रदायगत अर्थ को नहीं जोड़ता और ‘दीन’ को दुर्बलता के पर्याय में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन। ‘जूआ’ और ‘विश्राम’ जैसी स्थापित बाइबिलीय छवियाँ सुरक्षित रखी गई हैं। ‘मन में दीन’ मूल के शाब्दिक तनाव को बनाए रखता है, जबकि वाक्य सामान्य पाठक के लिए सहज रहता है।
