base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: hi
  text: “खुराजीन, तुझ पर हाय! बैतसैदा, तुझ पर हाय! क्योंकि यदि तुम्हारे बीच हुए सामर्थ्य के काम[a] सूर और सैदा में हुए होते, तो वे बहुत पहले ही टाट और राख में पश्चात्ताप कर चुके होते।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चमत्कार”; यूनानी में “सामर्थ्य के काम” अथवा “शक्ति के कार्य।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: तुझ पर हाय
  rationale: यह अभिव्यक्ति भविष्यद्वक्ताओं जैसी भर्त्सना, शोक और आने वाले न्याय—तीनों का गंभीर भाव बनाए रखती है। नगर को एकवचन में सीधे संबोधित करने के कारण “तुझ” रखा गया है।
- source_word: Χοραζίν
  choice: खुराजीन
  rationale: यूनानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: Βηθσαϊδά
  choice: बैतसैदा
  rationale: प्रचलित हिन्दी बाइबलीय रूप को रखते हुए मूल नाम का लिप्यंतरण।
- source_word: αἱ δυνάμεις
  choice: सामर्थ्य के काम
  rationale: δυνάμεις में निहित शक्ति के अर्थ को बनाए रखता है और संदर्भ में असाधारण दैवी कार्यों को स्वाभाविक हिन्दी में व्यक्त करता है; “चमत्कार” वैध किंतु कुछ अधिक संकीर्ण विकल्प है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: बहुवचन ὑμῖν नगरवासियों के बीच हुए कार्यों को दर्शाता है, न कि उनके भीतर हुई किसी आंतरिक घटना को।
- source_word: πάλαι ἂν ... μετενόησαν
  choice: बहुत पहले ही ... मन फिरा चुके होते
  rationale: πάλαι और प्रतिकल्पित कथन की व्याकरणिक शक्ति दोनों सुरक्षित रहती हैं; “मन फिराना” पश्चात्ताप और जीवन-दिशा के परिवर्तन को परिचित, अर्थपूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: टाट ओढ़कर और राख में बैठकर
  rationale: 'मूल सांस्कृतिक चित्र को स्पष्ट और स्वाभाविक हिन्दी में खोलता है: टाट और राख सार्वजनिक शोक तथा पश्चात्ताप के चिह्न हैं।'
theological_decisions:
- issue: सूर और सैदा के विषय में प्रतिकल्पित तुलना
  choice: यीशु के सामर्थ्य के काम देखकर भी न फिरने वाले नगरों के अधिक उत्तरदायित्व को वास्तविक तुलना के रूप में बनाए रखा गया है।
  alternative: इसे केवल आलंकारिक अतिशयोक्ति मानना।
  rationale: मूल पाठ स्पष्ट प्रतिकल्पित वाक्य द्वारा खुराजीन और बैतसैदा की दोषिता को तीखा करता है; अनुवाद इससे आगे कोई सिद्धान्तगत निष्कर्ष नहीं जोड़ता।
- issue: μετενόησαν का अर्थ
  choice: मन फिरा चुके होते
  alternative: पश्चात्ताप कर चुके होते
  rationale: “मन फिराना” केवल भावनात्मक खेद तक अर्थ को सीमित नहीं करता और दिशा-परिवर्तन का भाव रखता है; पदटिप्पणी अधिक प्रचलित वैकल्पिक अभिव्यक्ति देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। नगरों के लिए एकवचन संबोधन और फिर उनके निवासियों के लिए बहुवचन का मूल बदलाव हिन्दी में “तुझ” तथा “तुम्हारे” से सुरक्षित रखा गया है।
