source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: hi
  text: उस समय यीशु ने उत्तर देते हुए कहा, “हे पिता, स्वर्ग और पृथ्वी के प्रभु, मैं आपकी स्तुति करता हूँ[a], क्योंकि आपने ये बातें ज्ञानियों और समझदारों से छिपा रखीं और छोटे बच्चों को प्रकट कीं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं आपको धन्यवाद देता हूँ।” यूनानी क्रिया धन्यवाद के साथ-साथ स्तुति या खुले रूप से स्वीकार करने का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “शिशुओं।” यहाँ यह शब्द सम्भवतः उन लोगों के लिए रूपक है जो विनम्र या बालक-समान ग्रहणशील हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: उस समय
  rationale: यह स्वाभाविक हिन्दी काल-सूचक अभिव्यक्ति है और कथानक के समय-संदर्भ को बिना अनावश्यक विशिष्टता के बनाए रखती है।
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: उत्तर देते हुए कहा
  rationale: दोनों यूनानी क्रियाओं को सुरक्षित रखते हुए यह सामी प्रभाव वाली कथात्मक अभिव्यक्ति का स्वाभाविक हिन्दी रूप है, भले ही यहाँ कोई स्पष्ट प्रश्न न हो।
- source_word: Ἐξομολογοῦμαί σοι
  choice: मैं आपकी स्तुति करता हूँ
  rationale: इस प्रसंग में क्रिया खुले रूप से स्वीकार करने, धन्यवाद देने और स्तुति करने की अर्थ-छायाएँ रखती है। ‘स्तुति करता हूँ’ संबोधन के आराधनात्मक स्वर को व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: हे पिता, स्वर्ग और पृथ्वी के प्रभु
  rationale: दोनों संबोधनों को सीधे बनाए रखता है और κύριος की प्रभुता तथा बाइबलीय अनुगूँज को व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह यीशु की स्तुति का कारण स्पष्ट करता है और यहाँ सम्भावित कारणवाचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔκρυψας
  choice: आपने ... छिपा रखीं
  rationale: सक्रिय दैवी कर्तृत्व को बनाए रखता है। ‘छिपा रखीं’ हिन्दी में पूर्ण क्रिया के परिणामगत पक्ष को सहज रूप से व्यक्त करता है।
- source_word: ταῦτα ... αὐτά
  choice: ये बातें ... [निहित कर्म]
  rationale: ‘ये बातें’ संकेतवाचक पद की संदर्भगत खुली प्रकृति को बनाए रखता है। दूसरी क्रिया में हिन्दी की स्वाभाविकता के लिए कर्म को दोहराया नहीं गया, पर वही बातें स्पष्टतः अभिप्रेत हैं।
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: ज्ञानियों और समझदारों से
  rationale: विशेषणों के संज्ञात्मक प्रयोग और ज्ञान तथा समझ के युग्मित भाव को संक्षिप्त, सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἀπεκάλυψας
  choice: प्रकट कीं
  rationale: दैवी प्रकाशन अथवा उद्घाटन का मानक और स्वाभाविक हिन्दी रूप है।
- source_word: νηπίοις
  choice: छोटे बच्चों
  rationale: यह मूल बिंब को सुरक्षित रखता है और प्रसंग में विनम्र या बालक-समान ग्रहणशील लोगों की रूपकात्मक ओर संकेत करता है, बिना उसे व्याख्यात्मक अमूर्त पद में बदलने के।
theological_decisions:
- issue: छिपाने और प्रकट करने में परमेश्वर का कर्तृत्व
  choice: 'सीधा दैवी कर्तृत्व बनाए रखा गया: ‘आपने ... छिपा रखीं और ... प्रकट कीं।’'
  alternative: अनुमतिसूचक रूप, जैसे ‘आपने इन्हें छिपा रहने दिया।’
  rationale: यूनानी पाठ में पिता को कर्ता बनाकर सक्रिय क्रियाएँ हैं। अनुवाद इस धर्मवैज्ञानिक तनाव को नरम या किसी पूर्वनिर्धारण-सिद्धांत द्वारा हल नहीं करता।
- issue: νηπίοις का अर्थ
  choice: रूपक को ‘छोटे बच्चों’ के रूप में बनाए रखा गया।
  alternative: शाब्दिक ‘शिशुओं’ अथवा व्याख्यात्मक ‘विनम्र लोगों’।
  rationale: प्रसंग ज्ञानियों और समझदारों के विपरीत बालक-समान ग्रहणशील लोगों को रखता है। चुना हुआ रूप मूल चित्र को बचाता है, जबकि पादटिप्पणी शाब्दिक और रूपकात्मक विस्तार बताती है।
- issue: Ἐξομολογοῦμαί का स्तुति और धन्यवाद के बीच अर्थ
  choice: मुख्य पाठ में ‘स्तुति करता हूँ’।
  alternative: ‘धन्यवाद देता हूँ’ या ‘खुले रूप से स्वीकार करता हूँ’।
  rationale: क्रिया में खुली स्वीकृति, धन्यवाद और स्तुति की अर्थ-छायाएँ मिलती हैं। यहाँ आराधनात्मक संबोधन के अनुकूल ‘स्तुति’ चुनी गई है, पर वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरार्थक ‘आप’ के साथ गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज शैली। ‘हे पिता’ प्रार्थनात्मक संबोधन को स्पष्ट करता है। मूल पाठ की समानांतरता और दैवी कर्तृत्व सुरक्षित हैं; वास्तविक शब्दार्थ-विकल्प पादटिप्पणियों में दिए गए हैं।
