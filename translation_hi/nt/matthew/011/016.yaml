  rationale: वर्तमान कृदन्त दृश्य में बच्चों की स्थिति बताता है; ‘बैठे हैं’ हिन्दी में सहज है।
- source_word: ἐν ταῖς ἀγοραῖς
  choice: बाज़ारों में
