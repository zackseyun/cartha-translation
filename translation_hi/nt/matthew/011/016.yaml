- source_word: ἃ προσφωνοῦντα
  choice: पुकारकर कहते हैं
  rationale: προσφωνέω किसी को आवाज़ देकर संबोधित करने का भाव रखता है। अगले पद में प्रत्यक्ष कथन आने के कारण ‘पुकारकर कहते हैं’ हिन्दी में वाक्य-संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: τοῖς ἑτέροις
  choice: दूसरे बच्चों को
