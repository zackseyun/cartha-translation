  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: hi
  text: परन्तु मैं तुमसे कहता हूँ कि न्याय के दिन सदोम के प्रदेश की दशा तुम्हारी दशा से अधिक सहनीय होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: परन्तु
  rationale: यहाँ यह शब्द पिछले कथन के साथ प्रबल विरोध और गंभीर निष्कर्ष प्रकट करता है; ‘परन्तु’ स्वाभाविक और गरिमापूर्ण है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यह सुसमाचारों में प्रयुक्त प्रत्यक्ष कथन का सामान्य सूत्र है और यूनानी वाक्य की सीधी संबोधन-शैली बनाए रखता है।
- source_word: γῇ Σοδόμων
  choice: सदोम देश के लिए
  rationale: γῇ को स्पष्ट रूप से ‘देश’ कहकर अनूदित किया गया है, जिससे केवल नगर-नाम के बजाय उससे संबद्ध भूभाग का भाव सुरक्षित रहता है।
- source_word: ἀνεκτότερον
  choice: सहना अधिक आसान
  rationale: यह तुलनात्मक विशेषण ‘अधिक सहनीय’ या ‘सहना अधिक आसान’ का अर्थ देता है; चुना हुआ रूप आधुनिक हिन्दी में अधिक सहज है और न्याय की तीव्रता की तुलना बनाए रखता है।
- source_word: ἔσται
  choice: होगा
  rationale: यह भविष्यकालीन संयोजक क्रिया का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: न्याय के दिन
  rationale: यह वाक्यांश भावी न्याय के समय को सूचित करता है और यूनानी संरचना के निकट रहते हुए हिन्दी में स्वाभाविक है।
- source_word: ἢ σοί
  choice: तुम्हारी अपेक्षा
  rationale: तुलना को स्वाभाविक हिन्दी में व्यक्त करता है और एकवचन संबोधन को बहुवचन में विस्तारित नहीं करता।
theological_decisions:
- issue: एकवचन σοί का संदर्भ
  choice: एकवचन ‘तुम्हारी’ बनाए रखा गया है, जो प्रसंग में नगर को मानवीकृत करके किया गया सीधा संबोधन है।
  alternative: ‘तुम लोगों की अपेक्षा’
  rationale: यूनानी सर्वनाम एकवचन है और आसपास के प्रसंग में नगर से भविष्यद्वक्ताओं जैसी शैली में सीधा संबोधन जारी रखता है; बहुवचन जोड़ना व्याख्यात्मक विस्तार होता।
- issue: न्याय में तुलनात्मक सहनीयता
  choice: ‘सहना अधिक आसान होगा’ कहकर तुलनात्मक कथन को यथावत रखा गया है।
  alternative: दोनों के अंतिम परिणाम या दण्ड की मात्रा को स्पष्ट करके बताना
  rationale: मूल पाठ केवल तुलनात्मक सहनीयता बताता है; वह दण्ड की सटीक प्रकृति या परिणाम की पूर्ण व्याख्या नहीं करता, इसलिए उस धर्मवैज्ञानिक तनाव को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; भाषा सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तुम्हारी’ से एकवचन नगर-संबोधन सुरक्षित है। किसी पादटिप्पणी की आवश्यकता नहीं रखी गई, क्योंकि ‘सहना अधिक आसान’ ἀνεκτότερον का स्वाभाविक हिन्दी रूप है और ‘अधिक सहनीय’ को मुख्य पाठ में अलग से समझाने की जरूरत नहीं है।
