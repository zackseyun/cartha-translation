  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: hi
  text: तो फिर तुम क्या देखने बाहर गए थे? मुलायम कपड़े पहने हुए किसी आदमी को?[a] देखो, जो मुलायम कपड़े पहनते हैं, वे राजाओं के घरों में होते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बढ़िया वस्त्र पहने हुए किसी आदमी को?’ यूनानी में शाब्दिक रूप से ‘मुलायम चीज़ों/कपड़ों’ का उल्लेख है, जिसका आशय नाज़ुक या विलासपूर्ण पहनावा भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘वे राजमहलों में होते हैं।’ यूनानी में अधिक शाब्दिक रूप से ‘राजाओं के घरों में’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: तो फिर
  rationale: यह पिछले आलंकारिक प्रश्न से विरोध और अगले प्रश्न की ओर बढ़ने का भाव व्यक्त करता है; आधुनिक हिन्दी में यह केवल ‘लेकिन’ की अपेक्षा इस प्रश्न-श्रृंखला में अधिक स्वाभाविक है।
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: तुम क्या देखने बाहर गए थे
  rationale: τί को ‘क्या’ और उद्देश्यसूचक infinitive ἰδεῖν को ‘देखने’ के रूप में रखते हुए यूनानी प्रश्न की सीधी संरचना सुरक्षित रखी गई है।
- source_word: ἄνθρωπον
  choice: किसी आदमी को
  rationale: एकवचन पुरुष-संदर्भ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और निकट संदर्भ में यूहन्ना की ओर संकेत बनाए रखता है।
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: मुलायम कपड़े पहने हुए
  rationale: μαλακοῖς के शाब्दिक ‘मुलायम’ और ἠμφιεσμένον के ‘पहने हुए’ भाव को रखता है; विलासपूर्ण या बढ़िया वस्त्र होने का निहितार्थ पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले यूनानी अव्यय का वर्तमान, गरिमापूर्ण और सहज हिन्दी रूप है।
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: जो मुलायम कपड़े पहनते हैं
  rationale: φοροῦντες में निहित सामान्य या प्रचलित रूप से पहनने का भाव व्यक्त होता है और μαλακά के अनुवाद में पहले वाक्यांश से शब्दगत संगति बनी रहती है।
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: वे राजाओं के घरों में होते हैं
  rationale: यूनानी के बहुवचन ‘राजाओं के घरों’ को सुरक्षित रखता है; ‘होते हैं’ εἰσίν को हिन्दी में स्वाभाविक सामान्य कथन के रूप में व्यक्त करता है, बिना उसे अनिवार्य रूप से ‘रहते हैं’ बनाने के।
