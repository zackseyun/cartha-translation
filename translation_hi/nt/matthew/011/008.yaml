  register: भाषा आधुनिक मानक हिन्दी की है। आलंकारिक प्रश्नों की मौखिक शक्ति बनाए रखने के लिए ‘तो फिर’ और ‘देखो’ चुने गए हैं। ‘मुलायम कपड़े’ तथा ‘राजाओं के घर’ मूल की ठोस अभिव्यक्तियों को रखते हैं, जबकि अधिक व्याख्यात्मक विकल्प पाद-टिप्पणियों में दिए गए हैं।
