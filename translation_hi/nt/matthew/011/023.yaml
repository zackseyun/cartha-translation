  terminology: ‘कफरनहूम,’ ‘सामर्थ्य के काम,’ and ‘अधोलोक’ are appropriate. The footnote responsibly identifies the Greek term as हेडीज़ and distinguishes it from गेहन्ना, without imposing a doctrinal interpretation.
