id: MAT.11.23
reference: Matthew 11:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: hi
  text: और तू, कफरनहूम, क्या स्वर्ग तक ऊँचा किया जाएगा? तू अधोलोक[a] तक उतरेगा। क्योंकि सामर्थ्य के जो काम तुझमें हुए, यदि वे सदोम में हुए होते, तो वह आज तक बना रहता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘हेडीज़’; अर्थात मृतकों का लोक। यह ‘गेहन्ना’ के लिए प्रयुक्त शब्द नहीं है।
    reason: ᾅδης का अर्थ स्पष्ट करना और इसे गेहन्ना अथवा ‘नरक’ की व्यापक धारणा से अलग रखना।
lexical_decisions:
- source_word: Καφαρναούμ
  choice: कफरनहूम
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: क्या स्वर्ग तक ऊँचा किया जाएगा?
  rationale: μή के साथ भविष्यकालीन कर्मवाच्य रूप को नकारात्मक उत्तर की अपेक्षा रखने वाले अलंकारिक प्रश्न के रूप में रखा गया है; ‘स्वर्ग तक’ मूल स्थानिक रूपक को सुरक्षित रखता है।
- source_word: ἕως ᾅδου καταβήσῃ
  choice: तू अधोलोक तक नीचे उतरेगा
  rationale: καταβαίνω का सीधा अर्थ ‘नीचे उतरना’ है। ᾅδης के लिए ‘अधोलोक’ मृतकों के लोक का अर्थ व्यक्त करता है और इसे गेहन्ना अथवा सामान्य हिन्दी ‘नरक’ से अनावश्यक रूप से नहीं मिलाता।
- source_word: δυνάμεις
  choice: सामर्थ्य के काम
  rationale: यह पद यीशु द्वारा किए गए सामर्थ्यपूर्ण कार्यों को सूचित करता है; यह अनुवाद कार्य और उनमें प्रकट शक्ति, दोनों पहलुओं को बनाए रखता है।
- source_word: γενόμεναι ἐν σοί
  choice: जो काम तुझमें हुए
  rationale: नगर को एकवचन में संबोधित करते हुए ἐν का स्थानवाचक भाव और घटनाओं के वहाँ घटित होने का अर्थ सुरक्षित रखा गया है।
- source_word: ἐγενήθησαν
  choice: हुए होते
  rationale: अवास्तविक भूतकालीन शर्त को स्वाभाविक हिन्दी प्रतितथ्यात्मक रचना में व्यक्त किया गया है।
- source_word: ἔμεινεν ἂν
  choice: वह ... बना रहता
  rationale: एकवचन क्रिया सदोम नगर को सामूहिक इकाई मानती है; यह रूप ἄν सहित अवास्तविक परिणाम को स्पष्ट करता है।
- source_word: μέχρι τῆς σήμερον
  choice: आज तक
  rationale: मूल वाक्यांश के कालवाचक अर्थ का संक्षिप्त और स्वाभाविक आधुनिक हिन्दी रूप।
theological_decisions:
- issue: ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: हेडीज़; मृतकों का लोक; नरक
  rationale: ‘अधोलोक’ यहाँ मृतकों के लोक का अर्थ देता है और ᾅδης को गेहन्ना या अंतिम दंड के लिए प्रयुक्त ‘नरक’ के साथ नहीं मिलाता। पादटिप्पणी मूल यूनानी पद और यह भेद स्पष्ट करती है।
- issue: कफरनहूम के ऊँचा किए जाने वाले कथन का वाक्य-प्रकार
  choice: नकारात्मक उत्तर की अपेक्षा रखने वाला अलंकारिक प्रश्न
  alternative: 'सरल निषेध: ‘तू स्वर्ग तक ऊँचा नहीं किया जाएगा’'
  rationale: μή तथा प्रश्नचिह्न-सदृश वाक्य-संरचना प्रश्नवाचक पाठ का समर्थन करती है; अनुवाद अपेक्षित नकारात्मक उत्तर को स्पष्ट कथन में बदलकर तनाव समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष भविष्यवाणी-सदृश शैली अपनाई गई है। नगर के मानवीकरण और यूनानी एकवचन संबोधन को बनाए रखने के लिए ‘तू/तुझमें’ रखा गया है। ‘सामर्थ्य के काम’ सामान्य पाठक के लिए बोधगम्य रहते हुए δυνάμεις के शक्ति और कार्य—दोनों आयाम सुरक्षित रखता है।
