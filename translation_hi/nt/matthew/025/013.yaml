  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: hi
  text: इसलिए जागते रहो,[a] क्योंकि तुम न तो उस दिन को जानते हो, न उस घड़ी को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सतर्क रहो” अथवा “पहरे पर रहो।” यूनानी वर्तमानकालिक आज्ञा में लगातार सतर्क बने रहने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: जागते रहो
  rationale: वर्तमानकालिक बहुवचन आज्ञार्थक क्रिया निरंतर सतर्कता का आह्वान करती है। ‘जागते रहो’ दृष्टांत में प्रयुक्त जागने की छवि को बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले दृष्टांत से निकलने वाले निष्कर्ष को स्पष्ट रूप से व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह आज्ञा का कारण प्रस्तुत करता है और समकालीन हिन्दी में स्वाभाविक है।
- source_word: οὐκ οἴδατε
  choice: तुम ... नहीं जानते हो
  rationale: दूसरे पुरुष बहुवचन में ज्ञान के निषेध को बिना किसी अनावश्यक विस्तार के व्यक्त करता है।
- source_word: τὴν ἡμέραν
  choice: उस दिन को
  rationale: निश्चित उपपद के संदर्भगत संकेत को ‘उस’ द्वारा व्यक्त किया गया है; पद स्वयं दिन की पहचान को अधिक स्पष्ट नहीं करता।
- source_word: οὐδὲ τὴν ὥραν
  choice: न ... न उस घड़ी को
  rationale: οὐδέ दूसरे निषेधात्मक पद को जोड़ता है। हिन्दी की ‘न ... न ...’ रचना दोनों अज्ञात तत्वों को सहज और स्पष्ट ढंग से समन्वित करती है।
theological_decisions:
- issue: सतर्कता की आज्ञा में निहित रूपक
  choice: जागते रहो
  alternative: चौकस रहो; निगरानी करते रहो
  rationale: ‘जागते रहो’ दृष्टांत की जागने-सोने की छवि और निरंतर तत्परता—दोनों को सुरक्षित रखता है, बिना इसे किसी संकीर्ण अंत-समय संबंधी व्यवस्था से बाँधे।
- issue: ‘उस दिन’ और ‘उस घड़ी’ का आशय
  choice: मूल अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: मनुष्य के पुत्र के आने का दिन या घड़ी; ठहराया हुआ समय
  rationale: व्यापक प्रसंग अंतिम न्याय और मनुष्य के पुत्र के आगमन से जुड़ा है, पर इस पद में केवल दिन और घड़ी कही गई है। अनुवाद पाठ से अधिक स्पष्ट धार्मिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम’ मूल के बहुवचन संबोधन के अनुरूप है; ‘जागते रहो’ सामान्य पाठक के लिए बोधगम्य रहते हुए दृष्टांत की मूल छवि को सुरक्षित रखता है।
