  text: πέντε δὲ ⸂ἐξ αὐτῶν ἦσαν⸃ ⸂μωραὶ καὶ πέντε φρόνιμοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: hi
  text: उनमें से पाँच मूर्ख थीं और पाँच समझदार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: पाँच
  rationale: मूल यूनानी की संख्या को सीधे रखा गया है और संतुलित विरोध बनाए रखने के लिए इसे दोनों समूहों के साथ दोहराया गया है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्का संयोजक है, प्रबल विरोधसूचक नहीं; इसलिए आधुनिक हिन्दी में सहज कथात्मक जोड़ के लिए ‘और’ उपयुक्त है।
- source_word: ἐξ αὐτῶν
  choice: उनमें से
  rationale: यह अंश पहले उल्लिखित दस कुँवारियों में से एक भाग को सूचित करता है; ‘उनमें से’ स्वाभाविक और सटीक हिन्दी है।
- source_word: ἦσαν
  choice: थीं
  rationale: εἰμί का अपूर्णकाल यहाँ वर्णनात्मक योजक क्रिया है। स्त्रीलिंग बहुवचन संदर्भ के अनुसार ‘थीं’ स्वाभाविक है; दूसरे खंड में हिन्दी की सहज समानांतर रचना के कारण इसे अध्याहृत रखा गया है।
- source_word: μωραὶ
  choice: मूर्ख
  rationale: μωρός यहाँ विवेकहीनता या समझ की कमी बताता है। ‘मूर्ख’ φρόνιμοι के साथ स्पष्ट और पारंपरिक विरोध बनाए रखता है।
- source_word: φρόνιμοι
  choice: समझदार
  rationale: φρόνιμος का अर्थ विवेकी, सूझ-बूझ वाला या समझदार हो सकता है। इस व्यावहारिक तैयारी के संदर्भ में ‘समझदार’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और शब्द को अनावश्यक रूप से धार्मिक या दार्शनिक अर्थ नहीं देता।
theological_decisions:
- issue: μωραὶ और φρόνιμοι के विरोध का स्वरूप
  choice: ‘मूर्ख’ और ‘समझदार’
  alternative: ‘मूर्ख’ और ‘बुद्धिमान’
  rationale: ‘समझदार’ यहाँ व्यावहारिक विवेक और दूरदर्शिता को व्यक्त करता है, जबकि ‘बुद्धिमान’ बौद्धिक क्षमता का अधिक व्यापक अर्थ दे सकता है। इससे दृष्टान्त का नैतिक निष्कर्ष समय से पहले व्याख्यायित भी नहीं होता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। स्त्रीलिंग बहुवचन ‘थीं’ पिछले पद की कुँवारियों के संदर्भ को बनाए रखता है। दूसरे ‘पाँच’ के बाद क्रिया न दोहराना हिन्दी में स्वाभाविक है और यूनानी की समानांतर, किंतु लुप्त-क्रिया वाली रचना के निकट भी है।
