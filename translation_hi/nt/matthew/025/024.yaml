id: MAT.25.24
reference: Matthew 25:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: hi
  text: तब वह भी, जिसे एक तोड़ा मिला था, पास आया और बोला, ‘प्रभु, मैं जानता था कि आप कठोर मनुष्य हैं[a]—जहाँ आपने नहीं बोया, वहाँ काटते हैं, और जहाँ आपने नहीं बिखेरा, वहाँ से बटोरते हैं[b]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सख्त मनुष्य’। यूनानी शब्द का अर्थ कठोर, सख्त या कड़ा हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘जहाँ से आपने नहीं बिखेरा, वहाँ से बटोरते हैं।’ यूनानी पाठ यह नहीं बताता कि क्या बिखेरा गया था; प्रसंग में बीज या अनाज समझा जा सकता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: προσελθὼν
  choice: पास आया
  rationale: यह कृदन्त बोलने से पहले उस सेवक के आगे आने या निकट आने की क्रिया बताता है; ‘पास आया’ स्वाभाविक हिन्दी है।
- source_word: δὲ καὶ
  choice: तब ... भी
  rationale: δέ कथा को आगे बढ़ाता है और καί इस सेवक को पहले आए सेवकों के साथ जोड़ता है।
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: जिसे एक तोड़ा मिला था
  rationale: यह सेवक की पहचान उसे मिली राशि से कराता है। ‘मिला था’ पूर्ण हो चुकी और वर्तमान प्रसंग में प्रासंगिक क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: τάλαντον
  choice: तोड़ा
  rationale: ‘तोड़ा’ हिन्दी बाइबिल परंपरा में प्राचीन भार और बड़ी धनराशि की इकाई के लिए प्रचलित स्रोत-सापेक्ष पद है; इसे आधुनिक योग्यता वाले अर्थ ‘प्रतिभा’ से अलग रखता है।
- source_word: Κύριε
  choice: स्वामी
  rationale: दृष्टान्त में सेवक अपने मालिक को आदरपूर्वक संबोधित कर रहा है। ‘स्वामी’ इस संबंध और संबोधन दोनों को स्वाभाविक रूप से व्यक्त करता है, बिना इस कथात्मक प्रयोग को अनिवार्यतः ईश्वरीय उपाधि बना देने के।
- source_word: ἔγνων σε ὅτι
  choice: मैं जानता था कि आप
  rationale: यह सेवक द्वारा स्वामी के स्वभाव के विषय में दावा किए गए ज्ञान को स्वाभाविक हिन्दी में व्यक्त करता है; अलग कर्मवाचक ‘आपको’ जोड़ने से हिन्दी वाक्य असहज होता।
- source_word: σκληρὸς ἄνθρωπος
  choice: कठोर मनुष्य
  rationale: ‘कठोर’ यूनानी पद में निहित सख्ती या कड़ाई को बनाए रखता है और ‘निर्दयी’ जैसे अधिक निर्णायक नैतिक अर्थ को नहीं थोपता।
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: जहाँ आपने नहीं बोया, वहाँ काटते हैं
  rationale: ‘बोना’ और ‘काटना’ कृषि-रूपक तथा दोनों क्रियाओं का विरोध स्पष्ट रखते हैं।
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: जहाँ आपने नहीं बिखेरा, वहाँ से बटोरते हैं
  rationale: ὅθεν के ‘जहाँ से’ भाव को ‘वहाँ से’ द्वारा सुरक्षित रखा गया है। यूनानी में बिखेरी गई वस्तु स्पष्ट नहीं है, इसलिए मुख्य पाठ में ‘बीज’ या ‘अनाज’ नहीं जोड़ा गया।
theological_decisions:
- issue: दृष्टान्त में κύριος का संबोधन
  choice: स्वामी
  alternative: प्रभु
  rationale: यहाँ बोलने वाला सेवक दृष्टान्त के मालिक को संबोधित करता है। ‘स्वामी’ तत्काल कथात्मक संबंध को स्पष्ट रखता है, जबकि ‘प्रभु’ भी संभावित है पर इस प्रसंग में ईश्वरीय उपाधि का अधिक प्रबल संकेत दे सकता है।
- issue: स्वामी के चरित्र पर सेवक का आरोप
  choice: सेवक के कथन को ‘कठोर मनुष्य’ के रूप में बिना नरम किए या सत्य घोषित किए प्रस्तुत करना
  alternative: ‘निर्दयी मनुष्य’ अथवा आरोप को व्याख्यात्मक रूप से नरम करना
  rationale: वचन सेवक की धारणा या आरोप बताता है। अनुवाद को यह तनाव बनाए रखना चाहिए कि कथन सेवक का है; उसे न तो स्वामी के चरित्र पर कथाकार का निर्णय बनाना चाहिए, न उससे तीखापन हटाना चाहिए।
- issue: अंतिम कृषि-चित्र में बिखेरी गई वस्तु
  choice: वस्तु को अनिर्दिष्ट रखना
  alternative: ‘बीज’ या ‘अनाज’ जोड़ना
  rationale: यूनानी पाठ में διασκορπίζω का कर्म व्यक्त नहीं है। कृषि-संदर्भ किसी वस्तु का संकेत देता है, पर उसे स्पष्ट कर देना वास्तविक अस्पष्टता को घटा देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। आदरसूचक ‘आप’ सेवक के संबोधन के अनुकूल है। ‘तोड़ा’ स्रोत की प्राचीन मौद्रिक/भार-इकाई को सुरक्षित रखता है, यद्यपि साधारण पाठक के लिए यह कुछ अपरिचित हो सकता है।
