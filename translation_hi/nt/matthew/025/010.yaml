source:
  edition: SBLGNT
  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: hi
  text: पर जब वे खरीदने जा रही थीं, तभी दूल्हा आ पहुँचा। जो तैयार थीं, वे उसके साथ विवाह-भोज[a] में भीतर चली गईं, और दरवाज़ा बंद कर दिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विवाह-उत्सव’ अथवा केवल ‘विवाह।’ यूनानी बहुवचन पूरे विवाह-समारोह को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι
  choice: पर जब वे खरीदने जा रही थीं
  rationale: सम्बन्धकारक स्वतंत्र रचना साथ-साथ घट रही क्रिया को व्यक्त करती है। ‘जा रही थीं’ ἀπέρχομαι की गति को बनाए रखता है और स्त्रीलिंग कर्ता को प्रसंगानुसार स्पष्ट करता है। ἀγοράσαι प्रयोजनसूचक है; यूनानी की तरह खरीदी जाने वाली वस्तु को यहाँ अनकहा रखा गया है।
- source_word: ὁ νυμφίος
  choice: दूल्हा
  rationale: आधुनिक हिन्दी में विवाह के पुरुष पात्र के लिए यह स्वाभाविक और सटीक शब्द है; इसमें दृष्टान्त की मसीही व्याख्या को मुख्य पाठ में स्पष्ट रूप से नहीं जोड़ा गया है।
- source_word: αἱ ἕτοιμοι
  choice: जो तैयार थीं
  rationale: स्त्रीलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और तैयार युवतियों की ओर संकेत करता है। यह हिन्दी में सहज है और उनके स्त्रीलिंग होने को सुरक्षित रखता है।
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: वे उसके साथ ... भीतर चली गईं
  rationale: यह कथात्मक प्रवेश और साथ होने—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς τοὺς γάμους
  choice: विवाह-भोज
  rationale: γάμοι का बहुवचन रूप यहाँ पूरे विवाह-उत्सव, विशेषकर भोज, को सूचित कर सकता है। ‘विवाह-भोज’ प्रसंग को स्पष्ट रखते हुए इस सांस्कृतिक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: ἐκλείσθη ἡ θύρα
  choice: दरवाज़ा बंद कर दिया गया
  rationale: यूनानी कर्मवाच्य को बनाए रखते हुए कर्ता को अनिर्दिष्ट रखा गया है और दृश्य की निर्णायक समाप्ति व्यक्त होती है।
theological_decisions:
- issue: दृष्टान्त में विवाह-संबंधी चित्रण
  choice: दूल्हा और विवाह-भोज को साधारण कथात्मक चित्रों के रूप में बनाए रखना
  alternative: दूल्हे की मसीही पहचान को अनुवाद में स्पष्ट करना या ‘विवाह’ मात्र कहना
  rationale: मूल पद अपनी प्रतीकात्मक व्याख्या को सीधे नहीं खोलता। अनुवाद को उस धार्मिक अर्थ को मुख्य पाठ में जोड़ने के बजाय प्रसंग और पूरे दृष्टान्त से उभरने देना चाहिए।
- issue: बंद दरवाज़े की क्रिया का कर्ता
  choice: कर्मवाच्य और अनिर्दिष्ट कर्ता बनाए रखना
  alternative: ‘उन्होंने दरवाज़ा बंद कर दिया’
  rationale: मूल यूनानी यह नहीं बताता कि दरवाज़ा किसने बंद किया। कर्ता जोड़ने से अनावश्यक व्याख्या प्रवेश करती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तभी’ दूल्हे के उसी दौरान अचानक पहुँचने की कथात्मक गति को व्यक्त करता है। अंग्रेज़ी परामर्श-पाठ में [a] चिह्न ‘खरीदने’ के बाद था, पर उसकी टिप्पणी γάμοι से संबंधित है; इसलिए स्रोत के अनुरूप चिह्न ‘विवाह-भोज’ पर रखा गया है।
