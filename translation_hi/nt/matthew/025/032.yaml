source:
  edition: SBLGNT
  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: hi
  text: और सभी राष्ट्र उसके सामने एकत्र किए जाएँगे[a], और वह उन्हें एक-दूसरे से अलग करेगा, जैसे चरवाहा भेड़ों को बकरों से अलग करता है[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सभी लोग”; यूनानी में “सभी राष्ट्र” (πάντα τὰ ἔθνη)।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द ἐρίφων का अधिक विशिष्ट अर्थ “बकरी के बच्चे” या “छोटे बकरे” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: इकट्ठी की जाएँगी
  rationale: भविष्यकालीन कर्मवाच्य को बनाए रखता है और किसी कर्ता को स्पष्ट रूप से नहीं जोड़ता। ‘जातियाँ’ के साथ स्त्रीलिंग बहुवचन स्वाभाविक है।
- source_word: ἔμπροσθεν αὐτοῦ
  choice: उसके सामने
  rationale: स्थान और न्यायिक उपस्थिति—दोनों भावों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πάντα τὰ ἔθνη
  choice: सब जातियाँ
  rationale: ἔθνη की व्यापकता को बनाए रखता है; इसे केवल गैर-यहूदियों तक सीमित नहीं करता। ‘सब राष्ट्र’ की अपेक्षा लोगों के समूहों का भाव अधिक स्वाभाविक रूप से देता है।
- source_word: ἀφορίσει
  choice: अलग करेगा
  rationale: एक समूह को दूसरे से पृथक करने की क्रिया का स्पष्ट और सीधा हिन्दी रूप है।
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: उन्हें एक-दूसरे से
  rationale: इकट्ठे किए गए समूहों के परस्पर पृथक्करण को यूनानी संरचना के निकट रखते हुए व्यक्त करता है।
- source_word: ὥσπερ
  choice: जैसे
  rationale: तुलना को सहज और स्पष्ट ढंग से आरम्भ करता है।
- source_word: ὁ ποιμὴν
  choice: चरवाहा
  rationale: यहाँ निश्चित लेख सामान्य उदाहरण में प्रयुक्त है; हिन्दी में बिना किसी अतिरिक्त संकेत के ‘चरवाहा’ स्वाभाविक है।
- source_word: τὰ πρόβατα
  choice: भेड़ों
  rationale: ठोस पशु-चित्र को बनाए रखता है, सामूहिक ‘झुंड’ में नहीं बदलता।
- source_word: τῶν ἐρίφων
  choice: बकरों
  rationale: हिन्दी में भेड़ों के साथ स्वाभाविक सामान्य विरोध प्रस्तुत करता है; अधिक विशिष्ट अर्थ ‘बकरी के बच्चों’ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: πάντα τὰ ἔθνη का दायरा
  choice: सब जातियाँ
  alternative: सब लोग; सभी गैर-यहूदी जातियाँ
  rationale: मूल पदबंध की व्यापकता को खुला रखता है और न्याय में सम्मिलित समूहों को किसी विशेष धर्मवैज्ञानिक योजना के अनुसार संकुचित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। कर्मवाच्य, तुलना और मूल की शब्दार्थगत व्यापकता सुरक्षित रखी गई है। पद के अंत का अल्पविराम अगले वाक्यांश से इसके जुड़ाव को दर्शाता है।
