  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी रखी गई है। समानांतर खंडों में ‘मैं ... था और तुमने ...’ की लय सुरक्षित है। पद के अंत की अल्पविराम-संरचना अगले पद से जारी वाक्य के अनुरूप रखी गई है।
