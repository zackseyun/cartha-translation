  text: क्योंकि मैं भूखा था और तुमने मुझे खाने को दिया; मैं प्यासा था और तुमने मुझे पीने को दिया; मैं अजनबी था और तुमने मुझे अपने यहाँ ठहराया[a],
  philosophy: optimal-equivalence
  footnotes:
