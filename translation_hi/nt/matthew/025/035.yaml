- source_word: ἐδώκατέ μοι φαγεῖν
  choice: तुमने मुझे खाने को दिया
  rationale: δίδωμι के साथ दत्तिव और क्रियार्थक रूप का यह हिन्दी में सहज समतुल्य है और मूल में अनिर्दिष्ट वस्तु को अनावश्यक रूप से ‘भोजन’ नहीं बनाता।
- source_word: ἐδίψησα
  choice: मैं प्यासा था
  rationale: यह अतीत में प्यास की अवस्था का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: ἐποτίσατέ με
  choice: तुमने मुझे पीने को दिया
  rationale: संदर्भ में ποτίζω का अर्थ किसी को पेय देना है; यह पिछले खंड की संरचना के समानांतर भी रहता है और पेय को केवल पानी तक सीमित नहीं करता।
- source_word: ξένος
  choice: अजनबी
  rationale: यहाँ शब्द ऐसे व्यक्ति को दर्शाता है जो परिचित या स्थानीय सामाजिक संबंधों से बाहर है; ‘अजनबी’ आधुनिक हिन्दी में व्यापक अर्थ को बनाए रखता है, जबकि ‘विदेशी’ जातीय या कानूनी अर्थ को अधिक प्रमुख कर सकता है।
- source_word: συνηγάγετέ με
  choice: तुमने मेरा स्वागत किया
  rationale: συνάγω का मूल अर्थ इकट्ठा करना है, पर ξένος के साथ यहाँ आशय आतिथ्यपूर्वक ग्रहण करने का है। ‘स्वागत किया’ उस व्यवहारिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अधिक ठोस रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ξένος ... συνηγάγετέ με में आतिथ्य का आशय
  choice: मैं अजनबी था और तुमने मेरा स्वागत किया
  alternative: मैं अजनबी था और तुमने मुझे अपने यहाँ जगह दी
  rationale: चुना हुआ रूप असहाय अजनबी को व्यक्तिगत रूप से स्वीकार करने और आतिथ्य देने की नैतिक शक्ति बनाए रखता है, पर आधुनिक राष्ट्रीयता, आव्रजन-स्थिति या किसी विशेष संस्थागत व्यवस्था को पाठ में नहीं जोड़ता।
