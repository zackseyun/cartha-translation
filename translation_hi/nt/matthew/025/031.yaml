id: MAT.25.31
reference: Matthew 25:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: hi
  text: पर जब मनुष्य का पुत्र अपनी महिमा में आएगा और सब स्वर्गदूत उसके साथ होंगे, तब वह अपने महिमामय सिंहासन[a] पर बैठेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपनी महिमा के सिंहासन पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: पर जब
  rationale: ὅταν भविष्य की एक निश्चित घटना का समय बताता है, और δέ प्रवचन में हल्का मोड़ लाता है। ‘पर जब’ आधुनिक हिन्दी में दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔλθῃ
  choice: आएगा
  rationale: ὅταν के साथ आया एओरिस्ट सब्जंक्टिव भविष्य की घटना को सूचित करता है; हिन्दी में भविष्यकाल ‘आएगा’ इस अर्थ को स्पष्ट और सहज बनाता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु का स्थापित पदनाम है और दानिय्येल 7 की पृष्ठभूमि को बनाए रखता है; इसे व्याख्यात्मक रूप से सामान्य ‘मनुष्य’ नहीं बनाया गया।
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: अपनी महिमा में
  rationale: δόξα यहाँ प्रकट वैभव, आदर और राजकीय प्रताप का भाव रखता है। ‘महिमा’ बाइबलीय प्रतिध्वनि और व्यापक अर्थ दोनों को सुरक्षित रखता है।
- source_word: πάντες οἱ ἄγγελοι μετ’ αὐτοῦ
  choice: सब स्वर्गदूत उसके साथ होंगे
  rationale: मूल पाठ में ‘सब स्वर्गदूत’ है, ‘उसके सब स्वर्गदूत’ नहीं। हिन्दी में ‘उसके साथ होंगे’ आगमन के समय उनकी संगति को स्वाभाविक रूप से व्यक्त करता है, बिना स्वामित्व जोड़ने के।
- source_word: τότε καθίσει
  choice: तब वह ... बैठेगा
  rationale: τότε घटनाक्रम का अगला चरण बताता है और καθίσει भविष्यकालीन सक्रिय क्रिया है। यह सीधा और स्वाभाविक अनुवाद है।
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: अपने महिमामय सिंहासन पर
  rationale: ἐπί सिंहासन पर बैठने की स्थिति बताता है। θρόνου δόξης αὐτοῦ की संबंधकारक रचना को आधुनिक हिन्दी में विशेषणात्मक ‘अपने महिमामय सिंहासन’ कहना अधिक सहज है; अधिक शाब्दिक रूप पाद-टिप्पणी में रखा गया है।
theological_decisions:
- issue: ‘मनुष्य का पुत्र’ पदनाम
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र / वह मनुष्य
  rationale: स्थापित पदनाम को बनाए रखने से यीशु का आत्म-संदर्भ, दानिय्येल 7 की प्रतिध्वनि और भावी न्यायाधीश की भूमिका सुरक्षित रहती है, जबकि व्याख्यात्मक विकल्प अर्थ को अनावश्यक रूप से सीमित कर सकते हैं।
- issue: θρόνου δόξης αὐτοῦ की व्याख्या
  choice: अपने महिमामय सिंहासन
  alternative: अपनी महिमा के सिंहासन
  rationale: मुख्य पाठ में स्वाभाविक आधुनिक हिन्दी चुनी गई है। संबंधकारक रचना की वास्तविक अस्पष्टता और पारंपरिक शाब्दिक रूप को पाद-टिप्पणी में सुरक्षित रखा गया है; इससे सिंहासन और पुत्र की महिमा के संबंध को किसी संकीर्ण धर्मवैज्ञानिक व्याख्या में नहीं बाँधा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘स्वर्गदूत’ और ‘महिमा’ जैसे परिचित बाइबलीय शब्द अंतर्पाठीय तथा धर्मवैज्ञानिक प्रतिध्वनि बनाए रखते हैं।
