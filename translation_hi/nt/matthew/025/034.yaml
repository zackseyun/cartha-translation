id: MAT.25.34
reference: Matthew 25:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: hi
  text: तब राजा अपनी दाहिनी ओर के लोगों से कहेगा, ‘आओ, मेरे पिता से आशीष पाए हुए लोगो[a]! उस राज्य को विरासत में पाओ, जो संसार की स्थापना से[b] तुम्हारे लिए तैयार किया गया है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, ‘मेरे पिता के आशीषित लोगो।’
    reason: lexical_alternative
  - marker: b
    text: या ‘संसार की नींव डाले जाने से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह न्याय के दृश्य में घटनाक्रम के अगले चरण को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ὁ βασιλεὺς
  choice: राजा
  rationale: संदर्भ में यह निश्चित राजा और न्यायाधीश को सूचित करता है; हिन्दी में पदनाम के लिए अनावश्यक अंग्रेज़ी-शैली के बड़े अक्षर का प्रश्न नहीं उठता।
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: अपने दाहिनी ओर वालों से
  rationale: यह समूह की स्थानगत स्थिति को स्पष्ट रखता है और दाहिनी ओर से जुड़ा सम्मानसूचक भाव भी नष्ट नहीं करता।
- source_word: Δεῦτε
  choice: आओ
  rationale: यह गंभीर किंतु स्वाभाविक आमंत्रणात्मक आज्ञा है।
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: मेरे पिता से आशीष पाए हुए लोगो
  rationale: पूर्ण निष्क्रिय कृदंत की बनी हुई अवस्था तथा संबंधकारक में निहित आशीष के स्रोत—पिता—दोनों को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: κληρονομήσατε
  choice: विरासत में पाओ
  rationale: आज्ञार्थक बल के साथ पारिवारिक और वाचागत विरासत का भाव बनाए रखता है; केवल ‘प्राप्त करो’ की अपेक्षा मूल क्रिया के अधिक निकट है।
- source_word: τὴν ... βασιλείαν
  choice: उस राज्य
  rationale: विरासत में मिलने और तैयार किए जाने के संदर्भ में ‘राज्य’ भावी राजकीय क्षेत्र का सबसे स्वाभाविक अर्थ है, यद्यपि βασιλεία में शासन का व्यापक भाव भी निहित रह सकता है।
- source_word: ἡτοιμασμένην ὑμῖν
  choice: तुम्हारे लिए तैयार किया गया है
  rationale: पूर्ण निष्क्रिय कृदंत को ऐसी तैयारी के रूप में व्यक्त करता है जो पूरी हो चुकी है और जिसका परिणाम वर्तमान में बना हुआ है।
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: संसार की स्थापना से
  rationale: ἀπό के आरम्भ-बिंदु वाले अर्थ को सुरक्षित रखते हुए हिन्दी में प्रचलित और गरिमापूर्ण बाइबलीय अभिव्यक्ति देता है।
theological_decisions:
- issue: τοῦ πατρός μου में आशीष देने वाले का संबंध
  choice: इसे स्रोत अथवा कर्ता के अर्थ में ‘मेरे पिता से आशीष पाए हुए’ अनूदित किया गया है।
  alternative: अधिक शाब्दिक ‘मेरे पिता के आशीषित लोगो’
  rationale: संबंधकारक स्वाभाविक रूप से बताता है कि आशीष पिता से आती है। चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट है और अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
- issue: विरासत के संदर्भ में βασιλεία का अर्थ
  choice: ‘राज्य’
  alternative: ‘राज्य-शासन’ अथवा ‘राजकीय शासन’
  rationale: ‘विरासत में पाओ’ और ‘तैयार किया गया’ के साथ यहाँ भावी राज्य अथवा क्षेत्र प्रमुख है; फिर भी यह अनुवाद परमेश्वर के शासन के व्यापक भाव का निषेध नहीं करता।
- issue: ἀπὸ καταβολῆς κόσμου का वाक्यगत संबंध और कालगत अर्थ
  choice: 'इसे निकटतम पद ‘तैयार किया गया है’ से जोड़ा गया है: राज्य संसार की स्थापना से उनके लिए तैयार है।'
  alternative: इसे पूरे आमंत्रण से ढीले रूप में जोड़ना, अथवा ‘संसार की स्थापना के समय से’ कहना
  rationale: यूनानी वाक्य-विन्यास में कृदंत ἡτοιμασμένην के साथ इसका संबंध सबसे स्वाभाविक है। ‘से’ आरम्भ-बिंदु को रखता है, जबकि उस तैयारी की धर्मवैज्ञानिक प्रणाली को आवश्यकता से अधिक परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, साधारण पाठक के लिए स्पष्ट किंतु प्रसंगानुकूल गरिमापूर्ण रखी गई है। संबोधन में ‘लोगो’ और आज्ञा में ‘आओ’/‘पाओ’ का प्रयोग बहुवचन श्रोताओं के लिए स्वाभाविक है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
