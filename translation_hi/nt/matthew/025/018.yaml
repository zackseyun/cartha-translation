source:
  edition: SBLGNT
  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: hi
  text: परन्तु जिस दास को एक तोड़ा मिला था, वह जाकर ज़मीन खोदकर अपने स्वामी का धन छिपा दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने स्वामी की चाँदी।”
    reason: ἀργύριον के ‘धन’ और ‘चाँदी’ दोनों अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: ὁ δὲ τὸ ἓν λαβὼν
  choice: परन्तु जिस दास को एक तोड़ा मिला था
  rationale: δέ पिछले दो सेवकों के व्यवहार से विरोध दिखाता है। यूनानी में संज्ञा निहित है; प्रसंग से स्पष्ट है कि यह उस दास की बात है जिसे एक प्रतिभा-भर धन मिला था। हिन्दी बाइबलीय परम्परा में मुद्रा/भार की इस इकाई के लिए ‘तोड़ा’ समझने योग्य संक्षिप्त रूप है।
- source_word: ἀπελθὼν
  choice: उसने जाकर
  rationale: यह कृदन्त मुख्य क्रियाओं से पहले की गति को दिखाता है; ‘जाकर’ हिन्दी में क्रम को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ὤρυξεν γῆν
  choice: ज़मीन खोदी
  rationale: यूनानी अभिव्यक्ति का सीधा अर्थ धरती या ज़मीन खोदना है। ‘गड्ढा खोदा’ सम्भावित आशय को अधिक स्पष्ट करता, पर मूल में ‘गड्ढा’ नहीं है।
- source_word: ἔκρυψεν
  choice: छिपा दिया
  rationale: κρύπτω के लिए यह सहज आधुनिक हिन्दी है और पूर्ण की गई क्रिया को स्पष्ट करता है।
- source_word: τὸ ἀργύριον
  choice: धन
  rationale: ἀργύριον का अर्थ ‘चाँदी’ और प्रसंगानुसार ‘धन/रुपया’ दोनों हो सकता है। यहाँ स्वामी द्वारा सौंपे गए मूल्य के लिए ‘धन’ स्वाभाविक है; शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: τοῦ κυρίου αὐτοῦ
  choice: अपने स्वामी का
  rationale: कथा के भीतर κύριος उस दास के मानवीय स्वामी को सूचित करता है। ‘स्वामी’ अधिकार-सम्बन्ध को स्पष्ट रखता है और यहाँ अनावश्यक रूप से दिव्य उपाधि नहीं बनाता।
theological_decisions:
- issue: दृष्टान्त में κύριος का मानवीय या दिव्य उपाधि के रूप में अनुवाद
  choice: स्वामी
  alternative: प्रभु
  rationale: इस वाक्य के कथा-जगत में तत्काल सन्दर्भ दास के मानवीय स्वामी का है। ‘स्वामी’ उसी सम्बन्ध को व्यक्त करता है, जबकि ‘प्रभु’ पाठ में प्रत्यक्ष रूप से न कही गई दिव्य पहचान को आगे ला सकता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘परन्तु’ कथात्मक विरोध को स्पष्ट करता है। ‘तोड़ा’ पारम्परिक बाइबलीय इकाई के रूप में रखा गया है; वाक्य-संरचना सामान्य पाठक के लिए स्वाभाविक बनाई गई है।
