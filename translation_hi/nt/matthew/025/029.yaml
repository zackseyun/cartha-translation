id: MAT.25.29
reference: Matthew 25:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: hi
  text: क्योंकि जिस किसी के पास है, उसे और दिया जाएगा, और उसके पास बहुतायत होगी; पर जिसके पास नहीं है, उससे वह भी ले लिया जाएगा जो उसके पास है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντὶ
  choice: क्योंकि जिस किसी के पास है
  rationale: γάρ पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है, इसलिए ‘क्योंकि’ स्वाभाविक है। दत्तिवाचक कृदंत और παντί का वितरणात्मक अर्थ ‘जिस किसी के पास है’ से व्यक्त होता है।
- source_word: δοθήσεται
  choice: उसे और दिया जाएगा
  rationale: भविष्यत् कर्मवाच्य रूप को ‘दिया जाएगा’ से सुरक्षित रखा गया है। संदर्भ के अनुसार हिन्दी में निहित बढ़ोतरी स्पष्ट करने के लिए ‘और’ जोड़ा गया है।
- source_word: περισσευθήσεται
  choice: उसके पास बहुतायत हो जाएगी
  rationale: यहाँ क्रिया परिणामस्वरूप प्रचुरता या आवश्यकता से अधिक होने की दशा बताती है। यह हिन्दी में स्वाभाविक रहते हुए यूनानी क्रिया की अर्थ-सीमा को बनाए रखता है।
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: पर जिसके पास नहीं है
  rationale: δέ का विरोध ‘पर’ से और संबंधवाचक कृदंत का प्रतिनिधिक एकवचन ‘जिसके’ से व्यक्त किया गया है। वस्तु को मूल की तरह अनिर्दिष्ट रखा गया है।
- source_word: καὶ ὃ ἔχει
  choice: वह भी ... जो उसके पास है
  rationale: καί यहाँ आरोही बल में ‘भी’ है और कथन के विरोधाभास को उभारता है।
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: उससे ... ले लिया जाएगा
  rationale: αἴρω का भविष्यत् कर्मवाच्य और ἀπό द्वारा व्यक्त अलगाव, दोनों ‘उससे ... ले लिया जाएगा’ में सुरक्षित हैं।
theological_decisions:
- issue: ‘पास होना’ किस वस्तु या गुण का संकेत है
  choice: वस्तु को अनिर्दिष्ट रखते हुए ‘जिस किसी के पास है’ कहना
  alternative: संदर्भ के आधार पर ‘जिसके पास धन/प्रतिभा/विश्वास है’ कहना
  rationale: यूनानी पाठ ἔχω का कर्म स्पष्ट नहीं करता। किसी विशेष धार्मिक या व्याख्यात्मक अर्थ को जोड़ने से दृष्टांत की जानबूझकर रखी गई व्यापकता घट जाएगी।
- issue: प्रतिनिधिक एकवचन और लिंग
  choice: ‘जिस किसी ... उसके’ तथा ‘जिसके ... उससे’ की एकवचन संरचना रखना
  alternative: बहुवचन ‘जिनके पास ... उन्हें’ अपनाना
  rationale: यूनानी में व्याकरणिक पुल्लिंग एकवचन कृदंत सामान्य, प्रतिनिधिक अर्थ में हैं। हिन्दी संबंधवाचक संरचना लिंग को अनावश्यक रूप से उभारे बिना इस एकवचन तर्क को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ‘बहुतायत’ बाइबलीय शैली का परिचित शब्द है, फिर भी सामान्य पाठक के लिए स्पष्ट है। मूल पाठ में कोई ऐसी प्रमुख शाब्दिक अस्पष्टता नहीं मिली जिसके लिए प्रकाशन-पादटिप्पणी आवश्यक हो।
