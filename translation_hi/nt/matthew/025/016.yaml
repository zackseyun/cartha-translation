  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: hi
  text: जिसे पाँच तोड़े[a] मिले थे, वह जाकर उन्हें काम में लगाया[b] और पाँच और तोड़े कमाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: तोड़ा उस समय धन की एक बहुत बड़ी इकाई था, जन्मजात योग्यता नहीं।
    reason: cultural_note
  - marker: b
    text: अर्थात उसने उस धन का उपयोग लाभ कमाने के लिए किया; अनुवाद ‘उनसे व्यापार किया’ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: जाकर
  rationale: क्रियाविशेषणीय कृदंत का स्वाभाविक हिन्दी रूप; यह अगली क्रिया से पहले जाने को व्यक्त करता है, पर मूल में न होने के कारण ‘तुरन्त’ नहीं जोड़ता।
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: जिसे पाँच तोड़े मिले थे
  rationale: कर्ता की पहचान उसे मिली राशि से होती है। यह हिन्दी में स्वाभाविक है और यूनानी पूर्ण हुई पूर्ववर्ती क्रिया का भाव बनाए रखता है।
- source_word: τάλαντα
  choice: तोड़े
  rationale: ‘तोड़ा’ प्राचीन बड़ी मौद्रिक इकाई के पारंपरिक नाम को सुरक्षित रखता है; पाठक इसे स्वाभाविक योग्यता न समझें, इसलिए टिप्पणी दी गई है।
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: उनसे काम किया
  rationale: 'यह यूनानी अभिव्यक्ति के व्यापक अर्थ को निकटता से रखता है: उसने उस धन को निष्क्रिय नहीं रखा, बल्कि लाभ के लिए उपयोग किया। ‘व्यापार किया’ संभव है, पर मूल क्रिया उससे अधिक व्यापक है।'
- source_word: ἐκέρδησεν
  choice: कमाए
  rationale: मौद्रिक प्रसंग में κερδαίνω के लाभ प्राप्त करने के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ἄλλα πέντε
  choice: पाँच तोड़े और
  rationale: हिन्दी में इकाई को दोहराना स्पष्ट और स्वाभाविक है तथा अतिरिक्त पाँच की मात्रा को ठीक रखता है।
