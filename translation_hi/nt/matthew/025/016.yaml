  verdict: revise
  source_fidelity: The draft correctly identifies the recipient, the five talents, the preceding movement, and the gain of an additional five. However, “उनसे काम किया” is not idiomatic Hindi for putting money into profitable use and can be understood as having the talents themselves do work. “उन्हें काम में लगाया” clearly conveys the active, gain-oriented use expressed by ἠργάσατο ἐν αὐτοῖς without unnecessarily narrowing it to a particular form of trade.
  naturalness: The revised wording is natural modern standard Hindi and retains a dignified narrative register. “वह जाकर” appropriately renders the participial sequencing without adding “तुरन्त.”
  terminology: “तोड़े” is the established Hindi biblical rendering of τάλαντα. The cultural note correctly prevents confusion with natural ability. “कमाए” suitably renders the financial gain denoted by ἐκέρδησεν.
  issues:
  - severity: medium
    issue: The phrase “उनसे काम किया” is semantically and idiomatically unclear in Hindi.
    rationale: With money as its antecedent, it may suggest making the money itself work in an unnatural or opaque way rather than actively employing it for gain. The Greek phrase denotes profitable use of the funds.
