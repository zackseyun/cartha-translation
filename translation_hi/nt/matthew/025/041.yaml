id: MAT.25.41
reference: Matthew 25:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: hi
  text: तब वह बाईं ओर वालों से भी कहेगा, ‘तुम शापित लोगो[a], मुझसे दूर उस अनन्त आग में चले जाओ, जो शैतान और उसके दूतों के लिए तैयार की गई है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम जिन पर शाप है।”
    reason: मूल यूनानी का निष्क्रिय कृदन्त οἱ κατηραμένοι ‘शापित’ अथवा ‘जिन पर शाप है’ दोनों प्रकार से व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह न्याय के दृश्य में घटनाक्रम की अगली अवस्था बताता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: ἐρεῖ
  choice: कहेगा
  rationale: λέγω के भविष्यत् रूप का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: τοῖς ἐξ εὐωνύμων
  choice: बाईं ओर वालों से
  rationale: निकटवर्ती संदर्भ में राजा की बाईं ओर खड़े समूह का संकेत है; यह आधुनिक हिन्दी में स्पष्ट है।
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: मेरे पास से ... चले जाओ
  rationale: आज्ञार्थक क्रिया और अलगाव व्यक्त करने वाले पदबंध, दोनों की शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οἱ κατηραμένοι
  choice: तुम शापित लोगो
  rationale: पूर्ण निष्क्रिय कृदन्त यहाँ संबोधन के रूप में है; यह रूप संक्षिप्त, गंभीर और आधुनिक हिन्दी में बोधगम्य है।
- source_word: εἰς τὸ πῦρ τὸ αἰώνιον
  choice: उस अनन्त आग में
  rationale: εἰς से व्यक्त गंतव्य को ‘में’ द्वारा और αἰώνιον को इस न्याय-संदर्भ में सामान्य अर्थ ‘अनन्त’ द्वारा व्यक्त किया गया है।
- source_word: τὸ ἡτοιμασμένον
  choice: जो ... तैयार की गई है
  rationale: पूर्ण निष्क्रिय कृदन्त पूर्व तैयारी से उत्पन्न वर्तमान अवस्था को दर्शाता है; हिन्दी में यह संबंधवाचक वाक्य स्वाभाविक है।
- source_word: τῷ διαβόλῳ
  choice: शैतान के लिए
  rationale: यहाँ διάβολος किसी सामान्य निंदक के बजाय स्थापित व्यक्तिगत विरोधी का पदनाम है; ‘शैतान’ सामान्य और स्पष्ट हिन्दी बाइबलीय शब्द है।
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: उसके दूतों के लिए
  rationale: न्याय के इस अलौकिक संदर्भ में ये शैतान से संबद्ध आत्मिक प्राणी हैं; ‘दूत’ मूल शब्द के अर्थ को बनाए रखता है और ‘उसके’ से उनका संबंध स्पष्ट करता है।
theological_decisions:
- issue: न्याय के संदर्भ में αἰώνιον का अनुवाद
  choice: अनन्त
  alternative: सदा रहने वाली; युगपर्यन्त
  rationale: इस संदर्भ में सामान्य कोईने प्रयोग और समानांतर न्याय-वर्णन के अनुसार ‘अनन्त’ सबसे सीधा अर्थ है; यह न्याय की गंभीरता को बनाए रखता है, पर पद में न कही गई विस्तृत सिद्धान्त-व्याख्या नहीं जोड़ता।
- issue: διάβολος और ἄγγελοι के संकेतार्थ
  choice: शैतान और उसके दूत
  alternative: निंदक और उसके संदेशवाहक
  rationale: अन्तिम न्याय का संदर्भ इन शब्दों को शैतान और उससे संबद्ध अलौकिक प्राणियों के स्थापित संकेतार्थ में रखता है; सामान्य मानवीय अर्थ लेना संदर्भ को कम स्पष्ट करेगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रत्यक्ष संबोधन के अनुरूप रखी गई है। वाक्य-क्रम हिन्दी की स्वाभाविकता के लिए समायोजित है, जबकि बाईं ओर का स्थान, वक्ता से अलगाव, आग की ओर गति और उसकी पूर्व तैयारी—इन सभी मूल तत्त्वों को सुरक्षित रखा गया है।
