source:
  edition: SBLGNT
  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless servant into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: hi
  text: और उस निकम्मे दास[a] को बाहर के अंधकार में फेंक दो। वहाँ रोना और दाँत पीसना होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘दास’ या ‘सेवक’ हो सकता है; इस दृष्टान्त में स्वामी के अधीन बँधे होने का भाव प्रमुख है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: निकम्मे
  rationale: यह विशेषण स्वामी की दृष्टि में दास के अनुपयोगी और किसी काम का न होने को व्यक्त करता है। ‘निकम्मा’ आधुनिक हिन्दी में स्वाभाविक है और न्याय की कठोरता को बनाए रखता है।
- source_word: δοῦλον
  choice: दास
  rationale: दृष्टान्त में स्वामी के अधीन बँधे व्यक्ति का सामाजिक संबंध प्रमुख है। ‘दास’ उस अधीनता को ‘सेवक’ से अधिक स्पष्ट रखता है, फिर भी हिन्दी बाइबलीय भाषा में स्वाभाविक है।
- source_word: ἐκβάλετε
  choice: फेंक दो
  rationale: आज्ञार्थक क्रिया बलपूर्वक और अचानक निष्कासन दर्शाती है। ‘फेंक दो’ उसकी तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σκότος τὸ ἐξώτερον
  choice: बाहर के अंधकार
  rationale: यह वाक्यांश उस अंधकार को दर्शाता है जो उत्सव और आशीष के स्थान से बाहर है। ‘बाहर का अंधकार’ मूल की स्थान-संबंधी छवि को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: यह अभी बताए गए बाहर के अंधकार की ओर सीधे संकेत करता है; ‘वहाँ’ संक्षिप्त और स्वाभाविक है।
- source_word: κλαυθμὸς
  choice: रोना
  rationale: ‘रोना’ शोक और दुःख को सामान्य आधुनिक हिन्दी में व्यक्त करता है, बिना उसकी तीव्रता को मूल से अधिक निश्चित किए।
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: दाँत पीसना
  rationale: यह स्थापित हिन्दी मुहावरा मूल की पीड़ा और संभव क्रोध—दोनों की गुंजाइश बनाए रखता है।
theological_decisions:
- issue: दृष्टान्त में न्याय की छवि का स्वरूप
  choice: बहिष्कार और पीड़ा की छवियों को ज्यों का त्यों रखा गया है, बिना यह स्पष्ट किए कि वे सीधे नरक, अंतिम न्याय या किसी अन्य दंड को सूचित करती हैं।
  alternative: अनुवाद में इसे स्पष्ट रूप से नरक अथवा केवल अस्थायी या रूपकात्मक बहिष्कार बताना।
  rationale: यह मत्ती में बार-बार आने वाली न्याय की भाषा है, पर पद स्वयं ‘बाहर के अंधकार’, रोने और दाँत पीसने की छवियों से आगे व्याख्या नहीं करता। अनुवाद को इसी धर्मवैचारिक तनाव को बनाए रखना चाहिए।
- issue: दाँत पीसने का भाव
  choice: ‘दाँत पीसना’ रखा गया है, जो पीड़ा और क्रोध दोनों का संकेत दे सकता है।
  alternative: इसे केवल निराशा, पीड़ा या क्रोध के रूप में स्पष्ट करना।
  rationale: मूल मुहावरा भाव का एकमात्र कारण निश्चित नहीं करता; इसलिए हिन्दी मुहावरा भी वही अर्थगत खुलापन रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘निकम्मा’ न्याय की कठोरता को स्वाभाविक हिन्दी में व्यक्त करता है; ‘बाहर का अंधकार’ और ‘दाँत पीसना’ मूल की प्रभावशाली छवियों को बिना अतिरिक्त धर्मवैचारिक व्याख्या के सुरक्षित रखते हैं।
