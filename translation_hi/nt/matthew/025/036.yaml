id: MAT.25.36
reference: Matthew 25:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: hi
  text: मैं नंगा था[a] और तुमने मुझे कपड़े पहनाए; मैं बीमार था और तुम मुझसे मिलने आए[b]; मैं जेल में था और तुम मेरे पास आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अर्थ ‘मेरे पास पहनने के लिए पर्याप्त कपड़े नहीं थे’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया में चिंता के साथ मिलने या सुधि लेने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: नंगा
  rationale: यह यूनानी विशेषण सीधे तौर पर वस्त्रहीन होने को बताता है; इस दया-संदर्भ में पर्याप्त कपड़े न होने का भाव भी संभव है। ‘नंगा’ संक्षिप्त है और आगे के ‘कपड़े पहनाए’ से स्पष्ट रूप से जुड़ता है।
- source_word: περιεβάλετέ
  choice: कपड़े पहनाए
  rationale: περιβάλλω यहाँ किसी को वस्त्र पहनाने के अर्थ में है। यह आधुनिक हिन्दी में स्वाभाविक और ठोस क्रिया है।
- source_word: ἠσθένησα
  choice: मैं बीमार था
  rationale: क्रिया सामान्य रूप से दुर्बल होने का अर्थ भी दे सकती है, पर इस संदर्भ में बीमारी इसका सबसे संभावित और सहज अर्थ है।
- source_word: ἐπεσκέψασθέ
  choice: मुझसे मिलने आए
  rationale: ἐπισκέπτομαι का अर्थ भेंट करना है, जिसमें चिंता और देखभाल का भाव भी समाहित हो सकता है। मुख्य पाठ में सीधा अर्थ रखा गया है और व्यापक भाव पादटिप्पणी में बताया गया है।
- source_word: φυλακῇ
  choice: जेल में
  rationale: φυλακή यहाँ बंदी बनाए जाने के स्थान को दर्शाता है। ‘जेल’ साधारण आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἤλθατε πρός με
  choice: तुम मेरे पास आए
  rationale: यह यूनानी वाक्यांश का सीधा रूप है और पिछली क्रिया के समानार्थी विस्तार, जैसे ‘मुलाकात करने आए’, को अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: दया के कामों का व्याख्यात्मक विस्तार
  choice: ‘कपड़े पहनाए’, ‘मिलने आए’ और ‘मेरे पास आए’ जैसी ठोस क्रियाओं को बनाए रखा गया है।
  alternative: ‘मेरी देखभाल की’ अथवा ‘जेल में मुझसे मिलने आए’ जैसे विस्तारित रूप।
  rationale: मूल यूनानी ठोस और सरल कार्यों का उल्लेख करता है। सीधे शब्दों को बनाए रखने से दया का संदर्भ स्पष्ट रहता है, पर पाठ में ऐसी अतिरिक्त व्याख्या नहीं जुड़ती जो मूल में स्पष्ट रूप से नहीं कही गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम’ यीशु द्वारा संबोधित समूह के लिए स्वाभाविक बहुवचन रूप है; समानांतर वाक्य-रचना मूल पाठ की लय और ठोसपन को बनाए रखती है।
