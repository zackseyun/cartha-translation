  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: hi
  text: तब स्वर्ग का राज्य दस कुँवारियों के समान होगा[a], जो अपने दीपक[b] लेकर दूल्हे से मिलने बाहर निकलीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दस कुँवारियों से तुलना की जाएगी” या “उनके समान ठहराया जाएगा।” यूनानी क्रिया कर्मवाच्य है।
    reason: lexical_alternative
  - marker: b
    text: या “मशालें।” यूनानी शब्द विवाह-जुलूस में हाथ में लिए जाने वाले दीपक या मशाल, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह समय-सूचक शब्द पिछले अंत-काल संबंधी प्रसंग से दृष्टान्त को जोड़ता है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: ὁμοιωθήσεται
  choice: के समान होगा
  rationale: यूनानी क्रिया भविष्यत् कर्मवाच्य है, पर हिन्दी में ‘के समान होगा’ दृष्टान्त की तुलना को सहज रूप से व्यक्त करता है; कर्मवाच्य रूप की बारीकी पादटिप्पणी में सुरक्षित है।
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: स्वर्ग का राज्य
  rationale: यह मत्ती में प्रयुक्त स्थिर पदबंध का स्वाभाविक और प्रचलित हिन्दी रूप है।
- source_word: δέκα παρθένοις
  choice: दस कुँवारी युवतियों
  rationale: παρθένος विवाह के प्रसंग में अविवाहित युवतियों को दर्शाता है और उनके कुँवारेपन का अर्थ बनाए रखता है।
- source_word: λαβοῦσαι
  choice: लेकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की सहायक क्रिया बताता है; हिन्दी में ‘लेकर’ इसका स्वाभाविक रूप है।
- source_word: τὰς λαμπάδας ἑαυτῶν
  choice: अपने दीपक
  rationale: λαμπάς हाथ में लिए जाने वाले दीपक या मशाल, दोनों का बोध करा सकता है। मुख्य पाठ में परिचित ‘दीपक’ रखा गया है और दूसरा संभव अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐξῆλθον εἰς ὑπάντησιν
  choice: मिलने बाहर निकलीं
  rationale: यह बाहर जाकर किसी के स्वागत में उससे मिलने की गति और उद्देश्य को सहज हिन्दी में व्यक्त करता है।
- source_word: τοῦ νυμφίου
  choice: दूल्हे
  rationale: νυμφίος विवाह के प्रसंग में वर अथवा दूल्हे को दर्शाता है; ‘दूल्हा’ सामान्य आधुनिक हिन्दी में सबसे स्पष्ट है।
theological_decisions:
- issue: दृष्टान्त की तुलना का व्याकरण
  choice: स्वर्ग का राज्य ... के समान होगा
  alternative: स्वर्ग के राज्य की तुलना ... से की जाएगी
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है, जबकि यूनानी भविष्यत् कर्मवाच्य की वास्तविक बारीकी पादटिप्पणी में बताई गई है; इससे तुलना का आशय बिना अनावश्यक व्याख्या के बना रहता है।
- issue: παρθένοις का अर्थ
  choice: कुँवारी युवतियों
  alternative: युवतियों / अविवाहित स्त्रियों
  rationale: चुना हुआ रूप मूल शब्द की वैवाहिक और यौन-स्थिति संबंधी विशिष्टता को बनाए रखता है, पर पात्रों के बारे में इससे आगे कोई धार्मिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कुँवारी युवतियाँ’ मूल की विशिष्टता स्पष्ट करता है; ‘दीपक’ परिचित पाठकीय शब्द है, जबकि ‘मशालें’ को वास्तविक शाब्दिक संभावना के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
