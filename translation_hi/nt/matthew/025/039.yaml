lexical_decisions:
- source_word: πότε
  choice: कब
  rationale: यह प्रश्नवाचक क्रियाविशेषण कार्य के समय के बारे में पूछता है; प्रत्यक्ष प्रश्न में ‘कब’ स्वाभाविक हिन्दी है।
- source_word: δέ
  choice: और
  rationale: यहाँ δέ प्रश्नों की शृंखला में हल्के संयोजक के रूप में है; ‘और’ बिना अनावश्यक विरोध का भाव जोड़े संबंध बनाए रखता है।
- source_word: εἴδομεν
  choice: हमने ... देखा
  rationale: ὁράω का एओरिस्ट रूप भूतकालीन देखने की क्रिया बताता है; हिन्दी प्रश्न में ‘हमने ... कब ... देखा’ स्वाभाविक है।
- source_word: ἀσθενοῦντα
  choice: बीमार
  rationale: संदर्भ में यह शारीरिक रोग की अवस्था को सूचित करता है; ‘बीमार’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἐν φυλακῇ
  choice: जेल में
  rationale: φυλακή यहाँ बंदी रखने की जगह है। ‘जेल में’ सामान्य पाठक के लिए सहज और सटीक आधुनिक प्रयोग है।
- source_word: ἤλθομεν πρός σε
  choice: आपके पास आए
  rationale: यह यूनानी पदबंध का सीधा अर्थ सुरक्षित रखता है और ‘भेंट करने’ जैसा अधिक विशिष्ट आशय मुख्य पाठ में नहीं जोड़ता।
- source_word: σε
  choice: आपको / आपके
  rationale: राजा को संबोधित प्रत्यक्ष वचन में आदरसूचक एकवचन ‘आप’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: ἤλθομεν πρός σε को विशिष्ट रूप से ‘आपसे मिलने आए’ कहना या अधिक सीधे ‘आपके पास आए’ कहना
  choice: आपके पास आए
  alternative: आपसे मिलने आए
  rationale: यूनानी अभिव्यक्ति किसी व्यक्ति के पास आने को कहती है, स्पष्टतः ‘भेंट करने’ की क्रिया को नहीं। मुख्य पाठ स्रोत की व्यापकता बनाए रखता है और स्वाभाविक वैकल्पिक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, आदरसूचक और गरिमापूर्ण प्रत्यक्ष प्रश्न। ‘कारागार’ की अपेक्षा ‘जेल’ सामान्य पाठकों के लिए अधिक सहज है, जबकि अर्थ स्पष्ट बना रहता है।
