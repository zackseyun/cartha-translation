  to: और जिसने पाँच तालन्त[a] प्राप्त किए थे, वह आगे आकर पाँच तालन्त और प्रस्तुत करके कहने लगा, “प्रभु[b], आपने मुझे पाँच तालन्त सौंपे थे; देखिए, मैंने पाँच तालन्त और कमाए हैं।”
  rationale: A small idiomatic revision changes “पाए थे” to “प्राप्त किए थे.” The participial sequence is also rendered as “प्रस्तुत करके कहने लगा,” which makes clear that the servant presented the additional amount and then spoke, while retaining the Greek narrative flow. No doctrinal or interpretive change is made.
