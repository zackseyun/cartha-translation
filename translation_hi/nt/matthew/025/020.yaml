id: MAT.25.20
reference: Matthew 25:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: hi
  text: और जिसने पाँच तालन्त[a] प्राप्त किए थे, वह आगे आकर पाँच तालन्त और प्रस्तुत करके कहने लगा, “प्रभु[b], आपने मुझे पाँच तालन्त सौंपे थे; देखिए, मैंने पाँच तालन्त और कमाए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: तालन्त प्राचीन समय में भार और बड़ी धनराशि की एक इकाई था।
    reason: cultural_note
  - marker: b
    text: या, “स्वामी।”
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν
  choice: आगे आकर
  rationale: यह सेवक के अपने स्वामी के सामने आने और धन प्रस्तुत करने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: जिसने पाँच तालन्त पाए थे
  rationale: सम्बन्धवाचक रचना सेवक की पहचान पहले पाँच तालन्त पाने वाले के रूप में करती है; ‘पाए थे’ मुख्य क्रिया से पहले हुई क्रिया को स्पष्ट करता है और यूनानी में निहित न होने वाला ‘मनुष्य’ नहीं जोड़ता।
- source_word: τάλαντα
  choice: तालन्त
  rationale: यह मूल मौद्रिक/भार इकाई को लिप्यंतरित रूप में सुरक्षित रखता है और उसे आधुनिक मुद्रा या केवल सोने की थैलियों तक सीमित नहीं करता; अर्थ के लिए सांस्कृतिक पादटिप्पणी दी गई है।
- source_word: προσήνεγκεν
  choice: प्रस्तुत किए
  rationale: प्रसंग में सेवक अतिरिक्त धन स्वामी के सामने लाता और दिखाता है। ‘प्रस्तुत किए’ इस औपचारिक हिसाब देने के दृश्य को स्पष्ट करता है, बिना बलिदान-संबंधी अर्थ जोड़े।
- source_word: ἄλλα πέντε τάλαντα
  choice: पाँच तालन्त और
  rationale: यह अतिरिक्त, समान मात्रा को सहज और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यह κύριος के सम्मानसूचक सम्बोधन तथा मत्ती के व्यापक कथात्मक-धर्मवैज्ञानिक अनुनाद—दोनों को सुरक्षित रखता है; तत्काल दृष्टान्त-सन्दर्भ के लिए ‘स्वामी’ विकल्प पादटिप्पणी में दिया गया है।
- source_word: παρέδωκας
  choice: सौंपे थे
  rationale: ‘सौंपना’ धन हाथ में देने के साथ उत्तरदायित्व का प्रसंगगत भाव स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि यूनानी क्रिया का मूल अर्थ ‘हाथ में देना/सुपुर्द करना’ है।
- source_word: ἴδε
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला प्रत्यक्ष सम्बोधन है और सम्मानसूचक संवाद में स्वाभाविक आधुनिक हिन्दी है।
- source_word: ἐκέρδησα
  choice: मैंने ... कमाए हैं
  rationale: यह लाभ या वृद्धि प्राप्त करने का अर्थ देता है; पूर्ण वर्तमान रूप पूरी हुई क्रिया के वर्तमान परिणाम को व्यक्त करता है।
theological_decisions:
- issue: दृष्टान्त में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: दृष्टान्त के भीतर यह सेवक के स्वामी के लिए सम्बोधन है, फिर भी ‘प्रभु’ मूल शब्द की सामान्य मत्ती-संबंधी शब्दावली और सम्भावित व्यापक अनुनाद को बनाए रखता है। पादटिप्पणी तत्काल सामाजिक अर्थ का वैध विकल्प देती है और किसी विशिष्ट मसीही निष्कर्ष को इस पद पर थोपती नहीं।
translation_notes:
  register: आधुनिक, सम्मानपूर्ण और कथात्मक हिन्दी। ‘तालन्त’ मूल सांस्कृतिक इकाई को बनाए रखता है, जबकि पादटिप्पणी साधारण पाठक के लिए उसका अर्थ स्पष्ट करती है। प्रत्यक्ष वचन में ‘देखिए’ सम्मानसूचक और स्वाभाविक है।
