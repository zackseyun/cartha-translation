source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ· Πονηρὲ δοῦλε καὶ ὀκνηρέ, ᾔδεις ὅτι θερίζω ὅπου οὐκ ἔσπειρα καὶ συνάγω ὅθεν οὐ διεσκόρπισα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: hi
  text: पर उसके स्वामी ने उत्तर में उससे कहा, ‘दुष्ट और आलसी दास[a], तू जानता था कि जहाँ मैंने नहीं बोया, वहाँ काटता हूँ और जहाँ मैंने नहीं बिखेरा, वहाँ से बटोरता हूँ?[b]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सेवक।’ यूनानी शब्द doulos दास या सेवक के अर्थ में प्रयुक्त हो सकता है; इस दृष्टान्त में संबंध स्पष्टतः अधीनस्थ का है।
    reason: lexical_alternative
  - marker: b
    text: 'इसे कथन के रूप में भी पढ़ा जा सकता है: ‘तू जानता था कि जहाँ मैंने नहीं बोया, वहाँ काटता हूँ और जहाँ मैंने नहीं बिखेरा, वहाँ से बटोरता हूँ।’'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: परन्तु ... उत्तर दिया
  rationale: यह सामान्य यूनानी कथात्मक अभिव्यक्ति है; ‘परन्तु’ प्रसंग में स्वामी के प्रत्युत्तर का हल्का विरोधात्मक भाव रखता है।
- source_word: ὁ κύριος αὐτοῦ
  choice: उसके स्वामी
  rationale: दृष्टान्त में κύριος सेवक के स्वामी को सूचित करता है; यहाँ इसे सीधे मसीही उपाधि ‘प्रभु’ बनाना प्रसंग से अधिक अर्थ आरोपित करेगा।
- source_word: Πονηρὲ
  choice: दुष्ट
  rationale: यह शब्द नैतिक दोष का कठोर मूल्यांकन करता है, केवल ‘बुरा’ या अयोग्य होने का नहीं।
- source_word: δοῦλε
  choice: दास
  rationale: δοῦλος अधीन और स्वामित्वाधीन सामाजिक स्थिति को व्यक्त करता है। आधुनिक हिन्दी में ‘दास’ इस दृष्टान्त के औपचारिक, प्राचीन सामाजिक संदर्भ को संक्षेप में सुरक्षित रखता है।
- source_word: ὀκνηρέ
  choice: आलसी
  rationale: ὀκνηρός काम करने में सुस्ती या अनिच्छा को बताता है; ‘आलसी’ सहज और वर्तमान हिन्दी है।
- source_word: ᾔδεις
  choice: तू जानता था
  rationale: οἶδα का यह रूप बीते समय में विद्यमान ज्ञान को व्यक्त करता है; ‘जानता था’ स्वाभाविक हिन्दी है और स्वामी के कथन का बल रखता है।
- source_word: ὅτι
  choice: कि
  rationale: यह उस बात की विषयवस्तु आरम्भ करता है जिसे दास जानता था।
- source_word: θερίζω ... ὅπου οὐκ ἔσπειρα
  choice: जहाँ मैंने नहीं बोया, वहाँ काटता हूँ
  rationale: ‘बोना’ और ‘काटना’ कृषि-रूपक का स्वाभाविक हिन्दी युग्म है और कालगत भेद को भी बनाए रखता है।
- source_word: συνάγω ὅθεν οὐ διεσκόρπισα
  choice: जहाँ मैंने नहीं बिखेरा, वहाँ से बटोरता हूँ
  rationale: ὅθεν के स्रोतार्थ को ‘वहाँ से’ से रखा गया है। यूनानी में बिखेरी गई वस्तु स्पष्ट नहीं है, इसलिए ‘बीज’ जोड़कर अस्पष्टता को सीमित नहीं किया गया।
theological_decisions:
- issue: स्वामी के अंतिम कथन का वाक्य-बल और विराम-चिह्न
  choice: इसे व्यंग्यार्थक/आलंकारिक प्रश्न के रूप में प्रस्तुत किया गया है
  alternative: 'इसे कथन के रूप में पढ़ा जा सकता है: ‘तू जानता था कि जहाँ मैंने नहीं बोया, वहाँ काटता हूँ और जहाँ मैंने नहीं बिखेरा, वहाँ से बटोरता हूँ।’'
  rationale: यूनानी पांडुलिपियों का मूल पाठ आधुनिक प्रश्नचिह्न द्वारा इस बल को निर्णायक रूप से तय नहीं करता। पिछले पद में दास के आरोप के प्रत्युत्तर में प्रश्नात्मक पाठ स्वामी द्वारा उसी आधार को पलटकर रखने के रूप में समझ आता है, पर कथनात्मक पाठ भी व्याकरणतः संभव है; इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
- issue: क्या स्वामी दास द्वारा वर्णित अपने चरित्र को स्वीकार करता है
  choice: अनुवाद प्रश्नात्मक स्वर रखता है, पर यह निर्णायक नहीं करता कि स्वामी आरोप को सत्य मानता है या दास के अपने तर्क को उसी पर लागू कर रहा है
  alternative: कथनात्मक विराम इसे स्वामी की स्पष्ट स्वीकृति की तरह अधिक आसानी से पढ़वा सकता है
  rationale: मूल की आलंकारिक और धर्मवैचारिक तनातनी को किसी एक व्याख्या से समाप्त नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सुबोध रखी गई है। सम्बोधन में ‘तू’ सामाजिक दूरी और स्वामी-दास संबंध के अनुरूप है, न कि अनौपचारिक आत्मीयता का संकेत। ‘क्या ऐसा है?’ मूल में अलग शब्दों के रूप में उपस्थित नहीं है, पर हिन्दी में प्रश्नात्मक बल स्पष्ट करने के लिए जोड़ा गया है; पादटिप्पणी कथनात्मक संभावना सुरक्षित रखती है।
