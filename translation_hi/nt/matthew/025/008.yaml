lexical_decisions:
- source_word: μωραὶ
  choice: मूर्ख युवतियों
  rationale: यह विशेषण संज्ञा के रूप में दृष्टान्त की युवतियों के लिए प्रयुक्त है। ‘मूर्ख’ समझदारी और तैयारी के अभाव को सीधे व्यक्त करता है; ‘युवतियों’ जोड़ने से हिन्दी में संदर्भ स्वाभाविक और स्पष्ट रहता है।
- source_word: φρονίμοις
  choice: समझदार युवतियों
  rationale: शब्द यहाँ व्यावहारिक सूझ-बूझ और तैयारी का बोध देता है। ‘समझदार’ आधुनिक हिन्दी में स्वाभाविक है और μωραὶ के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: Δότε
  choice: दो
  rationale: बहुवचन आज्ञार्थक रूप को सीधे और स्वाभाविक अनुरोध के रूप में प्रस्तुत करता है।
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: अपने तेल में से हमें भी कुछ
  rationale: ἐκ का अंशवाचक भाव है—उनके तेल के भंडार में से कुछ हिस्सा। यह हिन्दी विन्यास उस भाव को सहज रूप से व्यक्त करता है।
- source_word: λαμπάδες
  choice: दीपक
  rationale: λαμπάς हाथ में लिए जाने वाले जलते प्रकाश-साधन के लिए प्रयुक्त हो सकता है और ‘मशाल’ भी संभव है। तेल के संदर्भ में ‘दीपक’ स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: σβέννυνται
  choice: बुझते जा रहे हैं
  rationale: वर्तमानकालीन रूप चल रही प्रक्रिया को दर्शाता है; यह हिन्दी अभिव्यक्ति लौ के क्रमशः बुझने का भाव स्पष्ट करती है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: अनुरोध का कारण प्रस्तुत करने वाले संयोजक का स्पष्ट आधुनिक हिन्दी रूप।
