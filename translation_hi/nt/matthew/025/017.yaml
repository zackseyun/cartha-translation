  rationale: यह क्रियाविशेषण इस दास के काम को पद 16 में बताए गए पहले दास के काम के समान बताता है।
- source_word: ὁ τὰ δύο
  choice: दो तोड़े पाने वाले
  rationale: यूनानी पदबंध संक्षिप्त है और प्रसंग में पहले बताए गए दो तोड़े पाने वाले दास की ओर संकेत करता है। हिन्दी में संदर्भ स्पष्ट रखने के लिए निहित वस्तु ‘तोड़े’ और प्राप्ति का भाव स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ἐκέρδησεν
  choice: कमाए
  rationale: वित्तीय प्रसंग में κερδαίνω अतिरिक्त धन प्राप्त करने का भाव देता है; ‘कमाए’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: ἄλλα δύο
  choice: दो और
  rationale: यह उसी प्रकार की दो अतिरिक्त इकाइयों को दर्शाता है; ‘दो और’ स्पष्ट तथा स्वाभाविक हिन्दी है।
