source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: hi
  text: तब धर्मी उसे उत्तर देंगे, “प्रभु, हमने कब आपको भूखा देखा और खिलाया, या प्यासा देखा और पानी पिलाया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह क्रियाविशेषण घटनाक्रम में अगले चरण को सूचित करता है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: ἀποκριθήσονται αὐτῷ
  choice: उसे उत्तर देंगे
  rationale: ἀποκρίνομαι का रूप व्याकरणतः मध्यम/कर्मवाच्य है, पर अर्थ सक्रिय है; αὐτῷ को अप्रत्यक्ष कर्म के रूप में ‘उसे’ से व्यक्त किया गया है।
- source_word: οἱ δίκαιοι
  choice: धर्मी
  rationale: विशेषण यहाँ संज्ञा के रूप में उन लोगों के लिए प्रयुक्त है जो इस न्याय-दृश्य में धर्मी ठहरते हैं; ‘धर्मी’ स्थापित और स्वाभाविक हिन्दी पद है।
- source_word: λέγοντες
  choice: प्रत्यक्ष कथन द्वारा अंतर्निहित
  rationale: हिन्दी में ‘उत्तर देंगे, “...”’ स्वयं बोलने का भाव स्पष्ट करता है; अलग से ‘कहते हुए’ जोड़ना अनावश्यक और बोझिल होता।
- source_word: Κύριε
  choice: प्रभु
  rationale: सम्बोधन में κύριος का ‘प्रभु’ सम्मान और मत्ती के मसीही आशय—दोनों को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: πεινῶντα καὶ ἐθρέψαμεν
  choice: भूखा देखा और भोजन कराया
  rationale: πεινῶντα की जारी अवस्था को ‘भूखा’ और τρέφω के ठोस कार्य को स्वाभाविक हिन्दी में ‘भोजन कराया’ से व्यक्त किया गया है।
- source_word: διψῶντα καὶ ἐποτίσαμεν
  choice: प्यासा देखा और पानी पिलाया
  rationale: ποτίζω का अर्थ किसी को पीने के लिए देना है; प्रसंग में ‘पानी पिलाया’ आधुनिक हिन्दी में सहज और पर्याप्त रूप से सटीक है।
theological_decisions:
- issue: यीशु के लिए सम्बोधन κύριος
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ सम्मानसूचक सम्बोधन के साथ इस पद के मसीही अनुनाद को भी सुरक्षित रखता है, जबकि पाठ में उससे अधिक कोई doctrinal विस्तार नहीं जोड़ता।
- issue: οἱ δίκαιοι की पहचान
  choice: धर्मी
  alternative: धर्मी लोग
  rationale: मूल में विशेषण संज्ञार्थक है। ‘धर्मी’ उसी संक्षिप्तता को बनाए रखता है और यह नहीं बताता कि वे किस प्रक्रिया या आधार पर धर्मी हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज वाक्य। मूल की समानांतर प्रश्न-रचना सुरक्षित रखी गई है; हिन्दी की स्वाभाविकता के लिए दूसरे खंड में ‘देखा’ दोहराया गया है।
