  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὕστερον δὲ ἔρχονται καὶ αἱ λοιπαὶ παρθένοι λέγουσαι· Κύριε κύριε, ἄνοιξον ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: hi
  text: बाद में बाकी कुँवारियाँ भी आईं और कहने लगीं, ‘प्रभु, प्रभु, हमारे लिए खोल दीजिए।’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में केवल ‘हमारे लिए खोल दीजिए’ है; प्रसंग से ‘दरवाज़ा’ समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: बाद में
  rationale: यह समय-सूचक क्रिया-विशेषण कथा में बाद की घटना बताता है; ‘बाद में’ सहज और सटीक है।
- source_word: δὲ
  choice: —
  rationale: यह हल्का संयोजक है; हिन्दी में ‘बाद में’ ही संक्रमण स्पष्ट कर देता है, इसलिए अलग शब्द आवश्यक नहीं।
- source_word: ἔρχονται
  choice: आईं
  rationale: यूनानी का ऐतिहासिक वर्तमान हिन्दी कथा-शैली में स्वाभाविक भूतकाल से व्यक्त किया गया है।
- source_word: καὶ
  choice: भी
  rationale: यहाँ इसका योगात्मक भाव है—बाकी कुँवारियाँ भी वहाँ पहुँचीं।
- source_word: αἱ λοιπαὶ παρθένοι
  choice: बाकी कुँवारियाँ
  rationale: λοιπαί का अर्थ ‘बाकी/शेष’ और παρθένοι का सीधा अर्थ ‘कुँवारियाँ’ है; यह पदबंध आधुनिक हिन्दी में स्वाभाविक है।
- source_word: λέγουσαι
  choice: और कहने लगीं
  rationale: वर्तमान कृदन्त प्रत्यक्ष कथन आरम्भ कराता है; हिन्दी कथा में यह प्रवाहपूर्ण समतुल्य है।
- source_word: Κύριε κύριε
  choice: प्रभु, प्रभु
  rationale: ‘प्रभु’ κύριος के सम्मानसूचक तथा सम्भावित धर्मवैज्ञानिक दोनों अर्थों को सुरक्षित रखता है; पुनरुक्ति आग्रह और तात्कालिकता बनाए रखती है।
- source_word: ἄνοιξον ἡμῖν
  choice: हमारे लिए खोल दीजिए
  rationale: आज्ञार्थक क्रिया और हित/प्रवेश सूचक सम्प्रदान को स्वाभाविक आदरसूचक हिन्दी में व्यक्त किया गया है; यूनानी में ‘दरवाज़ा’ स्पष्ट रूप से नहीं है।
theological_decisions:
- issue: सीधे सम्बोधन में κύριος का अनुवाद
  choice: प्रभु
  alternative: मालिक / श्रीमान
  rationale: दृष्टान्त के सामाजिक स्तर पर यह सम्मानसूचक सम्बोधन हो सकता है, पर मत्ती में इसका व्यापक धर्मवैज्ञानिक अनुनाद भी सम्भव है। ‘प्रभु’ दोनों स्तरों के बीच की तनावपूर्ण बहुअर्थकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। स्त्री-वक्ताओं के अनुरूप ‘आईं’ और ‘कहने लगीं’ रखा गया है। आदरसूचक निवेदन के लिए ‘खोल दीजिए’ प्रयुक्त है।
