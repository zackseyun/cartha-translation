source:
  edition: SBLGNT
  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: hi
  text: तब वह उन्हें उत्तर देगा, “मैं तुमसे सच कहता हूँ[a], जिस हद तक तुमने इन सबसे छोटे लोगों में से किसी एक के लिए नहीं किया[b], उसी हद तक तुमने मेरे लिए भी नहीं किया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक औपचारिक रूप में, “आमीन, मैं तुमसे कहता हूँ।”
    reason: lexical_alternative
  - marker: b
    text: “इन सबसे छोटे लोगों” का अर्थ विशेष रूप से यीशु के शिष्य भी समझा जा सकता है, या अधिक व्यापक रूप से दीन और जरूरतमंद लोग; अनुवाद मूल वाक्यांश को खुला रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: न्याय के दृश्य में घटनाक्रम की अगली कड़ी दिखाने वाला स्वाभाविक और सटीक कालवाचक शब्द।
- source_word: ἀποκριθήσεται αὐτοῖς
  choice: वह उन्हें उत्तर देगा
  rationale: भविष्यकाल और अप्रत्यक्ष कर्म दोनों को स्पष्ट रखते हुए न्यायिक प्रसंग की गंभीरता बनाए रखता है।
- source_word: λέγων
  choice: प्रत्यक्ष कथन में समाहित
  rationale: हिन्दी में ‘उत्तर देगा, कहता हुआ’ अस्वाभाविक होता; उद्धरण आरम्भ करके सहभागी कृदन्त का अर्थ स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यीशु के गंभीर, बलाघातपूर्ण कथन-सूत्र का स्पष्ट और वर्तमान मानक हिन्दी रूप; ‘आमीन’ का अधिक औपचारिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: ἐφ’ ὅσον
  choice: जितना … उतना ही
  rationale: परिमाण/सीमा के भाव को कारणसूचक ‘क्योंकि’ में बदले बिना स्वाभाविक हिन्दी सहसंबंधी रचना में व्यक्त करता है।
- source_word: οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων
  choice: तुमने इन सबसे छोटों में से किसी एक के लिए नहीं किया
  rationale: पूर्ववर्ती प्रसंग से निहित कर्म को हिन्दी में स्वाभाविक रूप से रहने देता है और प्रतिनिधि एकवचन तथा समूह—दोनों को सुरक्षित रखता है।
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: उतना ही मेरे लिए भी नहीं किया
  rationale: दोनों निषेधों का सीधा संबंध और यीशु के साथ पहचान की कथनात्मक शक्ति बनाए रखता है।
theological_decisions:
- issue: ‘इन सबसे छोटों’ की पहचान
  choice: वाक्यांश को बिना अतिरिक्त पहचान जोड़े यथावत खुला रखा गया है।
  alternative: इसे विशेष रूप से यीशु के शिष्यों/दूतों या व्यापक रूप से दीन-दुखियों के लिए स्पष्ट करना।
  rationale: पद यीशु के साथ उनके संबंध को स्पष्ट करता है, पर इस समूह की सीमा स्वयं इस पद में निश्चित नहीं करता; अनुवाद व्याख्यात्मक विवाद का निर्णय नहीं करता।
- issue: यीशु और ‘सबसे छोटों’ के प्रति किए गए व्यवहार का संबंध
  choice: ‘जितना … उतना ही’ के द्वारा प्रत्यक्ष समतुल्यता व्यक्त की गई है।
  alternative: इसे केवल कारण के रूप में ‘क्योंकि’ से प्रस्तुत करना।
  rationale: ἐφ’ ὅσον की सीमा/परिमाण संबंधी सूक्ष्मता और मूल कथन का धार्मिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर किंतु सहज शैली। ‘सबसे छोटों’ मूल के अतिशयोक्तिपरक बहुवचन को बनाए रखता है। कथन-सूत्र को ‘मैं तुमसे सच कहता हूँ’ किया गया है, जो सामान्य पाठक के लिए स्पष्ट है।
