id: MAT.25.21
reference: Matthew 25:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: hi
  text: उसके मालिक[b] ने उससे कहा, ‘शाबाश, अच्छे और विश्वासयोग्य सेवक![a] तू थोड़ी बातों में विश्वासयोग्य रहा; मैं तुझे बहुत-सी बातों पर नियुक्त करूँगा। अपने मालिक के आनन्द में प्रवेश कर।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘दास’: ‘शाबाश, अच्छे और विश्वासयोग्य दास!’ यूनानी शब्द दोउलोस संदर्भ के अनुसार ‘सेवक’ या ‘दास’ हो सकता है।'
    reason: alternative_reading
  - marker: b
    text: यहाँ यूनानी शब्द क्यूरियोस का अनुवाद ‘प्रभु’ भी हो सकता है, पर दृष्टान्त में सेवक और मालिक के संबंध के कारण ‘मालिक’ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: कहा
  rationale: प्रत्यक्ष कथन के परिचय में φημί का सहज और मानक हिन्दी रूप।
- source_word: κύριος
  choice: मालिक
  rationale: दृष्टान्त के तत्काल संदर्भ में यह सेवक के मालिक को दर्शाता है। ‘मालिक’ सामाजिक संबंध को स्पष्ट रखता है और सीधे मसीही उपाधि आरोपित नहीं करता।
- source_word: δοῦλε
  choice: सेवक
  rationale: इस प्रशंसात्मक संबोधन में ‘सेवक’ स्वाभाविक हिन्दी है; यूनानी शब्द में निहित ‘दास’ का संभावित अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: Εὖ
  choice: शाबाश
  rationale: प्रशंसा के इस प्रसंग में εὖ का स्वाभाविक, वर्तमान और संक्षिप्त हिन्दी रूप।
- source_word: ἀγαθὲ
  choice: अच्छे
  rationale: नैतिक प्रशंसा का सीधा अर्थ और πιστέ के साथ स्वाभाविक युग्म।
- source_word: πιστέ / πιστός
  choice: विश्वासयोग्य / विश्वासयोग्य
  rationale: दोनों प्रयोगों में एक ही शब्द रखकर मूल की पुनरावृत्ति और भरोसेमंद निष्ठा का भाव सुरक्षित किया गया है।
- source_word: ἐπὶ ὀλίγα
  choice: थोड़े में
  rationale: मूल में नपुंसकलिंग बहुवचन का आशय थोड़ी वस्तुओं या थोड़ी जिम्मेदारी से है; हिन्दी का संक्षिप्त मुहावरा इस खुलापन को बनाए रखता है।
- source_word: καταστήσω
  choice: अधिकारी ठहराऊँगा
  rationale: यह आगे अधिक जिम्मेदारी और देखरेख सौंपने का भाव व्यक्त करता है, केवल किसी स्थान पर रखने का नहीं।
- source_word: ἐπὶ πολλῶν
  choice: बहुत पर
  rationale: ‘थोड़े में’ के समानांतर मूल के थोड़े–बहुत विरोध को संक्षिप्त रूप में बनाए रखता है।
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: आनन्द में प्रवेश कर
  rationale: प्रवेश करने के मूल रूपक को बनाए रखता है; इसे केवल ‘आनन्द में सहभागी हो’ कहकर समतल नहीं करता।
theological_decisions:
- issue: दृष्टान्त में κύριος का अनुवाद, जबकि मालिक का पात्र प्रतीकात्मक रूप से परमेश्वर या मसीह की ओर संकेत कर सकता है
  choice: मालिक
  alternative: प्रभु
  rationale: कथा के भीतर तत्काल संबंध सेवक और उसके मालिक का है। ‘मालिक’ कहानी के स्तर को स्पष्ट रखता है, जबकि प्रतीकात्मक धार्मिक संकेत को न तो नकारता है, न उसे प्रत्यक्ष उपाधि बनाकर पाठ में जोड़ता है।
- issue: इस संदर्भ में δοῦλος का अनुवाद
  choice: सेवक
  alternative: दास
  rationale: दृष्टान्त के संबोधन में ‘सेवक’ आधुनिक हिन्दी में सहज है। फिर भी बंधुआ अधीनता का वास्तविक अर्थ संभव है, इसलिए ‘दास’ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तू’ मालिक द्वारा सेवक को किए गए एकवचन अधीनस्थ संबोधन को स्वाभाविक रूप से दर्शाता है। ‘थोड़े में/बहुत पर’ मूल की संक्षिप्त समानांतर रचना और उसके वस्तु अथवा जिम्मेदारी-संबंधी खुलेपन को बनाए रखता है।
