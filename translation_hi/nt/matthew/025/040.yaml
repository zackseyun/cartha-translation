source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: hi
  text: और राजा उन्हें उत्तर देगा, “मैं तुमसे सच कहता हूँ[a], तुमने मेरे इन सबसे छोटे भाइयों[b] में से किसी एक के साथ जो किया, वह मेरे ही साथ किया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “आमेन, मैं तुमसे कहता हूँ।”'
    reason: lexical_alternative
  - marker: b
    text: “भाइयों” के लिए यूनानी में पुल्लिंग बहुवचन शब्द है। “मेरे इन सबसे छोटे भाइयों” से विशेष रूप से यीशु के शिष्य, अधिक सामान्य रूप से विश्वासी, या व्यापक अर्थ में असहाय लोग अभिप्रेत हो सकते हैं; अनुवाद इस प्रश्न का निर्णय नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς ... ἐρεῖ
  choice: उत्तर देगा
  rationale: कृदंत और भविष्यकालीन मुख्य क्रिया को स्वाभाविक हिन्दी में एक ही उत्तरसूचक क्रिया से व्यक्त किया गया है।
- source_word: ὁ βασιλεὺς
  choice: राजा
  rationale: यूनानी पाठ की स्पष्ट राजकीय उपाधि को सुरक्षित रखा गया है; हिन्दी में सामान्यतः उपाधि के लिए अलग से बड़े अक्षर का भेद नहीं होता।
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यीशु के गंभीर और अधिकारपूर्ण कथन-सूत्र का अर्थ आधुनिक, स्वाभाविक हिन्दी में व्यक्त होता है; अधिक अक्षरशः रूप पादटिप्पणी में दिया गया है।
- source_word: ἐφ’ ὅσον ... ἐποιήσατε
  choice: जो किया
  rationale: यहाँ वाक्य-विन्यास उस सीमा या प्रसंग को बताता है जिसमें किसी एक के प्रति किया गया कार्य राजा के प्रति किया गया माना जाता है। हिन्दी का ‘जो किया’ इस संबंध को स्वाभाविक ढंग से रखता है, बिना कर्म का प्रकार जोड़कर अर्थ सीमित किए।
- source_word: ἑνὶ τούτων
  choice: इनमें से किसी एक के साथ
  rationale: ἑνί की व्यक्तिवाचक एकवचन शक्ति को ‘किसी एक’ से रखा गया है; ποιέω के साथ हिन्दी में ‘के साथ ... किया’ स्वाभाविक है।
- source_word: τῶν ἀδελφῶν μου τῶν ἐλαχίστων
  choice: मेरे इन छोटे-से-छोटे भाइयों
  rationale: ‘भाइयों’ यूनानी के पुल्लिंग बहुवचन को सुरक्षित रखता है और ‘छोटे-से-छोटे’ ἐλαχίστων की सामाजिक हैसियत, महत्त्व या नगण्य समझे जाने की व्यापकता को बिना किसी एक अर्थ तक सीमित किए व्यक्त करता है।
- source_word: ἐμοὶ ἐποιήσατε
  choice: वह मेरे ही साथ किया
  rationale: ‘ही’ से यूनानी ἐμοί की अग्रस्थित बलवत्ता और उन भाइयों के प्रति किए काम को राजा के प्रति किए काम के समान ठहराने पर जोर प्रकट होता है।
theological_decisions:
- issue: ‘मेरे इन भाइयों’ का संदर्भ
  choice: वाक्यांश को बिना संदर्भ निर्धारित किए यथावत रखना
  alternative: इसे विशेष रूप से यीशु के शिष्यों/दूतों, सामान्यतः विश्वासियों, या व्यापक रूप से असहाय लोगों के रूप में स्पष्ट करना
  rationale: पद स्वयं इन व्याख्याओं में से किसी एक को निर्णायक रूप से नहीं चुनता; अनुवाद इस वास्तविक व्याख्यात्मक तनाव को सुरक्षित रखता है।
- issue: ἀδελφῶν का लिंग
  choice: भाइयों
  alternative: भाई-बहनों या जनों
  rationale: मूल शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है। संदर्भित समूह की सीमा विवादित होने के कारण लिंग-समावेशी विस्तार मूल से अधिक व्याख्या जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, मौखिक रूप से सहज शैली अपनाई गई है। ‘छोटे-से-छोटे’ सामान्य पाठक के लिए बोधगम्य है और ‘सबसे कम महत्त्वपूर्ण’ जैसी संकीर्ण व्याख्या से बचता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
