translation:
  language: hi
  text: क्योंकि मैं भूखा था, और तुमने मुझे खाने को कुछ नहीं दिया[a]; मैं प्यासा था, और तुमने मुझे पीने को कुछ नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “तुमने मुझे खाने को नहीं दिया ... तुमने मुझे पीने को नहीं दिया।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: मैं भूखा था
  rationale: अओरिस्ट रूप यहाँ बीती हुई भूख की अवस्था बताता है; यह सहज आधुनिक हिन्दी है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के न्याय का कारण प्रस्तुत करता है और हिन्दी में स्पष्ट व्याख्यात्मक संबंध बनाता है।
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: तुमने मुझे खाने को कुछ नहीं दिया
  rationale: यह यूनानी के ‘मुझे खाने के लिए नहीं दिया’ भाव को स्वाभाविक हिन्दी में रखता है और व्यक्तिगत सर्वनाम ‘मुझे’ को स्पष्ट बनाए रखता है।
- source_word: ἐδίψησα
  choice: मैं प्यासा था
  rationale: यह भूख वाले समानांतर कथन की तरह बीती हुई अवस्था को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐποτίσατέ με
  choice: तुमने मुझे पीने को कुछ नहीं दिया
  rationale: ποτίζω का प्रसंगानुकूल अर्थ किसी को पीने के लिए देना है; चुना गया रूप पहले खंड के समानांतर और आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: नकारात्मक प्रावधान वाले दोनों वाक्यांशों की स्पष्टता
  choice: दोनों को ‘मुझे खाने/पीने को कुछ नहीं दिया’ के रूप में प्रस्तुत किया गया।
  alternative: ‘मुझे खाने/पीने के लिए नहीं दिया’ अथवा ‘मुझे भोजन/पानी नहीं दिया।’
  rationale: चयन यूनानी की क्रियात्मक रचना और व्यक्तिगत उपेक्षा के बल को बनाए रखते हुए स्वाभाविक हिन्दी देता है; न्याय और दया के व्यापक प्रसंग में कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘खाने को’ और ‘पीने को’ से मूल की क्रियात्मक समानांतरता सुरक्षित रखी गई है।
