  text: ἄρατε οὖν ἀπ’ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/028.yaml
  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: hi
  text: इसलिए उससे वह तोड़ा ले लो[a] और उसे उस व्यक्ति को दे दो जिसके पास वे दस तोड़े हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उससे हटा लो।” यूनानी आज्ञार्थक क्रिया किसी वस्तु को लेने या अलग कर देने—दोनों भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: “तोड़ा” भार की एक बड़ी इकाई थी और उसी आधार पर बड़ी धनराशि के लिए भी प्रयुक्त होती थी।
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: ले लो
  rationale: यह αἴρω का बहुवचन आज्ञार्थक रूप है और यहाँ किसी व्यक्ति से कोई वस्तु अलग कर लेने की सीधी आज्ञा देता है। ‘ले लो’ आधुनिक हिन्दी में स्वाभाविक है; वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले न्याय-वचन से निकलने वाले निष्कर्ष को दर्शाता है। ‘इसलिए’ स्पष्ट, स्वाभाविक और आधुनिक हिन्दी है।
- source_word: ἀπ’ αὐτοῦ
  choice: उससे
  rationale: ἀπό के साथ संबंध-विभक्ति अलगाव का भाव देती है; ‘उससे’ संक्षेप और सीधे ढंग से उसी अर्थ को व्यक्त करता है।
- source_word: τὸ τάλαντον
  choice: वह तोड़ा
  rationale: ‘तोड़ा’ प्राचीन भार और उससे जुड़ी धनराशि की ऐतिहासिक इकाई के लिए हिन्दी बाइबलीय शब्द है। ‘वह’ यूनानी निश्चित उपपद और पहले उल्लिखित विशेष तोड़े की ओर संकेत को व्यक्त करता है।
- source_word: δότε
  choice: दे दो
  rationale: यह δίδωμι का बहुवचन आज्ञार्थक रूप है। ‘दे दो’ हिन्दी में सीधी और स्वाभाविक आज्ञा है।
- source_word: τῷ ἔχοντι
  choice: उस व्यक्ति को जिसके पास
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत को यह वाक्यांश स्वाभाविक हिन्दी में व्यक्त करता है और किसी अतिरिक्त पहचान को नहीं जोड़ता।
- source_word: τὰ δέκα τάλαντα
  choice: वे दस तोड़े
  rationale: ‘वे’ यूनानी निश्चित उपपद को दर्शाता है और कथा में पहले से उल्लिखित विशिष्ट दस तोड़ों की ओर संकेत करता है।
theological_decisions:
- issue: दृष्टान्त में τάλαντον का अर्थ
  choice: ऐतिहासिक भार तथा धन की इकाई के अर्थ में ‘तोड़ा’
  alternative: धनराशि; रुपया; जन्मजात योग्यता
  rationale: संदर्भ सौंपी गई बड़ी धनराशियों और उनके हिसाब का है। ऐतिहासिक इकाई को बनाए रखने से पाठ की सांस्कृतिक विशेषता बचती है और इसे जन्मजात ‘प्रतिभा’ मान लेने जैसी बाद की व्याख्या मूल पाठ में नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘इसलिए’, ‘ले लो’ और ‘दे दो’ सामान्य पाठकों के लिए सहज हैं। ऐतिहासिक शब्द ‘तोड़ा’ को सांस्कृतिक पादटिप्पणी के साथ रखा गया है।
