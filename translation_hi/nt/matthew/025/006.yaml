  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: hi
  text: पर आधी रात को एक पुकार सुनाई दी, “देखो, दूल्हा! उससे मिलने बाहर आओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: लेकिन आधी रात को
  rationale: यह संबंधकारक पदबंध समय का बोध कराता है; δέ को कथा में हलके विरोध अथवा मोड़ के रूप में ‘लेकिन’ से व्यक्त किया गया है।
- source_word: κραυγὴ γέγονεν
  choice: पुकार सुनाई दी
  rationale: γέγονεν यहाँ किसी घटना के घटित होने को बताता है। ‘पुकार सुनाई दी’ आधुनिक हिन्दी में स्वाभाविक है और अचानक हुई घोषणा का भाव रखता है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: ἰδού श्रोताओं का ध्यान खींचने वाला शब्द है; ‘देखो’ वर्तमान, सहज और सीधा हिन्दी रूप है।
- source_word: ὁ νυμφίος
  choice: दूल्हा
  rationale: νυμφίος विवाह के प्रसंग में वर को सूचित करता है। सामान्य आधुनिक हिन्दी में ‘दूल्हा’ सबसे स्पष्ट और स्वाभाविक है।
- source_word: ἐξέρχεσθε
  choice: बाहर आओ
  rationale: आज्ञार्थक क्रिया बाहर निकलने का आह्वान करती है; पुकार सुनने वालों को संबोधित प्रत्यक्ष वाणी में ‘बाहर आओ’ स्वाभाविक है।
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: उससे मिलने
  rationale: εἰς ἀπάντησιν का मुहावरेदार अर्थ किसी से मिलने के लिए बाहर जाना है; ‘उससे मिलने’ इसे संक्षेप और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: दृष्टान्त में νυμφίος का संकेतार्थ
  choice: ‘दूल्हा’ को सामान्य रूप में रखा गया है; सम्मानसूचक बड़े अक्षर या स्पष्ट मसीही पहचान नहीं जोड़ी गई।
  alternative: ऐसा रूप जो दूल्हे को सीधे मसीह के रूप में चिह्नित करे
  rationale: व्यापक संदर्भ में दूल्हा यीशु का प्रतिनिधित्व करता है, पर इस पद में वह दृष्टान्त का पात्र है। अनुवाद साहित्यिक स्तर को बनाए रखता है और व्याख्या को मूल पाठ में नहीं मिलाता।
- issue: दूल्हे के आगमन की पाठगत अभिव्यक्ति
  choice: मुख्य पाठ में ‘दूल्हा आ गया!’
  alternative: ‘दूल्हा!’
  rationale: प्राप्त यूनानी मुख्य पाठ में केवल ‘देखो, दूल्हा’ है; हिन्दी में घोषणा की स्वाभाविकता के लिए आगमन निहित रूप से व्यक्त किया गया है, जबकि पादटिप्पणी अधिक औपचारिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष वाणी में जीवंतता बनाए रखते हुए अत्यधिक शाब्दिक या पुरातन शब्दावली से बचा गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
