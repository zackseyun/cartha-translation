  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those servants comes and settles accounts with them.
translation:
  language: hi
  text: बहुत समय बीतने के बाद, उन दासों का स्वामी आता है और उनसे हिसाब लेता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्वामी’ के लिए यूनानी शब्द का अनुवाद ‘प्रभु’ भी हो सकता है, और ‘दासों’ का ‘सेवकों’ भी; यहाँ दृष्टांत के घरेलू और आर्थिक संदर्भ के अनुसार मुख्य पाठ में ‘स्वामी’ और ‘दास’ रखे गए हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: बहुत समय बीतने के बाद
  rationale: μετά के साथ कर्मकारक χρόνον समयगत उत्तरवर्तिता व्यक्त करता है। δέ यहाँ हल्का कथात्मक संयोजक है; हिंदी में अलग से ‘तब’ या ‘परन्तु’ जोड़ना अनावश्यक है।
- source_word: ἔρχεται
  choice: आता है
  rationale: यूनानी ऐतिहासिक वर्तमान को हिंदी वर्तमान से सुरक्षित रखा गया है, जिससे दृष्टांत की कथात्मक सजीवता बनी रहती है।
- source_word: ὁ κύριος τῶν δούλων ἐκείνων
  choice: उन दासों का स्वामी
  rationale: इस घरेलू-आर्थिक प्रसंग में κύριος अधीनस्थ दासों के स्वामी को बताता है, जबकि δοῦλος की बंधुआ स्थिति स्पष्ट है; इसलिए ‘स्वामी’ और ‘दास’ स्रोत के सामाजिक संबंध को सीधे व्यक्त करते हैं।
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: उनसे हिसाब चुकता करता है
  rationale: यह मुहावरा लेखा लेने अथवा हिसाब निपटाने का अर्थ देता है। ‘हिसाब चुकता करना’ आधुनिक हिंदी में आर्थिक लेखे के निपटारे को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: दृष्टांत में κύριος का अनुवाद
  choice: स्वामी
  alternative: प्रभु
  rationale: पद के भीतर κύριος दृष्टांत के दास-स्वामी संबंध में घराने के स्वामी को सूचित करता है। ‘स्वामी’ कथात्मक भूमिका स्पष्ट करता है और सीधे मसीही उपाधि आरोपित नहीं करता, जबकि दृष्टांत का व्यापक धार्मिक आशय संदर्भ में खुला रहता है।
- issue: δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: स्वामी के अधीन आर्थिक उत्तरदायित्व वाले पात्रों की बंधुआ सामाजिक स्थिति यहाँ प्रासंगिक है। ‘दास’ इसे ‘सेवक’ की अपेक्षा अधिक ठीक रूप से सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ऐतिहासिक वर्तमान के कारण ‘आता है’ और ‘करता है’ बनाए गए हैं। पादटिप्पणी चिह्न को पूरे वाक्य से संबंधित दिखाने के लिए वाक्य के अंत में रखा गया है।
