source:
  edition: SBLGNT
  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: hi
  text: मैं परदेशी था और तुमने मुझे अपने यहाँ नहीं ठहराया[a]; मैं वस्त्रहीन था और तुमने मुझे कपड़े नहीं पहनाए; मैं बीमार और बंदीगृह में था और तुमने मेरी सुधि नहीं ली[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे अपने घर में नहीं लिया” अथवा “मेरा स्वागत नहीं किया”; यूनानी क्रिया का शाब्दिक अर्थ “इकट्ठा करना” है, पर यहाँ उसका आशय किसी परदेशी को आतिथ्यपूर्वक अपने यहाँ लेने से है।
    reason: lexical_alternative
  - marker: b
    text: या “मुझसे मिलने नहीं आए”; यूनानी अभिव्यक्ति में केवल भेंट करने के बजाय चिंता के साथ सुधि लेने और देखभाल करने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: परदेशी
  rationale: यहाँ ऐसे बाहरी और असहाय व्यक्ति का बोध है जिसे आतिथ्य और आश्रय की आवश्यकता है। ‘परदेशी’ जातीय अर्थ को अनावश्यक रूप से सीमित किए बिना यह सामाजिक असुरक्षा व्यक्त करता है।
- source_word: συνηγάγετέ
  choice: अपने यहाँ ठहराया
  rationale: συνάγω का मूल अर्थ ‘इकट्ठा करना’ है, पर ξένος के साथ यह आतिथ्यपूर्वक भीतर लेने या आश्रय देने का अर्थ रखता है। यह हिंदी में स्वाभाविक है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: γυμνός
  choice: वस्त्रहीन
  rationale: शब्द नंगा होने या पर्याप्त वस्त्र न होने, दोनों का संकेत दे सकता है। ‘वस्त्रहीन’ अभाव की गंभीरता बनाए रखते हुए गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: περιεβάλετέ
  choice: कपड़े नहीं पहनाए
  rationale: क्रिया का अर्थ किसी को वस्त्र पहनाना है। यह आधुनिक हिंदी में स्पष्ट और सहज अभिव्यक्ति है।
- source_word: ἀσθενής
  choice: बीमार
  rationale: यद्यपि शब्द सामान्य रूप से ‘निर्बल’ भी हो सकता है, दया के कार्यों की इस सूची में शारीरिक बीमारी सबसे स्वाभाविक अर्थ है।
- source_word: ἐν φυλακῇ
  choice: बंदीगृह में
  rationale: यहाँ φυλακή का अर्थ पहरे का स्थान नहीं, बल्कि कारावास है। ‘बंदीगृह’ स्पष्ट, गरिमापूर्ण और व्यापक हिंदी रूप है।
- source_word: ἐπεσκέψασθέ
  choice: सुधि नहीं ली
  rationale: ἐπισκέπτομαι केवल सामाजिक भेंट नहीं, बल्कि चिंता के साथ जाकर देखना और देखभाल करना भी व्यक्त करता है। ‘सुधि लेना’ हिंदी में इस व्यापक करुणामय भाव को स्वाभाविक रूप से समेटता है।
theological_decisions:
- issue: ἐπεσκέψασθέ με में करुणामय भेंट और देखभाल का संबंध
  choice: तुमने मेरी सुधि नहीं ली
  alternative: तुम मुझसे मिलने नहीं आए / तुमने मेरी देखभाल नहीं की
  rationale: ‘सुधि लेना’ ठोस रूप से हाल जानने और चिंता करने का भाव रखता है, पर इसे केवल सामाजिक मुलाकात या केवल सेवा तक सीमित नहीं करता; इस प्रकार यूनानी क्रिया की अर्थ-व्याप्ति बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। समानांतर वाक्य-रचना और दया के कार्यों की क्रमबद्ध सूची सुरक्षित रखी गई है। ‘परदेशी’, ‘वस्त्रहीन’ और ‘बंदीगृह’ पाठ को स्पष्ट रखते हैं, जबकि पादटिप्पणियाँ आतिथ्य और करुणामय देखभाल की यूनानी अर्थ-छटाओं को संरक्षित करती हैं।
