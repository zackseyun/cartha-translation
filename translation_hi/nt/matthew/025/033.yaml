  yaml_path: translation/nt/matthew/025/033.yaml
  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: hi
  text: और वह भेड़ों को अपने दाहिनी ओर और बकरी के बच्चों को बाईं ओर खड़ा करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στήσει
  choice: खड़ा करेगा
  rationale: ἵστημι का सकर्मक भाव यहाँ किसी को एक स्थान पर खड़ा करने का है। ‘खड़ा करेगा’ चरवाहे द्वारा दो समूहों को अलग-अलग ओर रखने के दृश्य को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: πρόβατα
  choice: भेड़ों
  rationale: πρόβατα भेड़ों के लिए सामान्य शब्द है; हिन्दी में परसर्ग ‘को’ के कारण इसका तिर्यक बहुवचन ‘भेड़ों’ स्वाभाविक है।
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: अपने दाहिने
  rationale: ἐκ + संबंधकारक यहाँ स्थानसूचक मुहावरा है, जिसका अर्थ उसके दाहिने ओर है। ‘अपने दाहिने’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐρίφια
  choice: बकरी के बच्चों
  rationale: ἐρίφια विशेष रूप से छोटे या कम आयु के बकरों/बकरी के बच्चों को सूचित करता है। ‘बकरी के बच्चे’ मूल की आयु-संबंधी सूक्ष्मता बचाता है और हिन्दी में ‘बकरे’ की अपेक्षा अधिक सटीक है।
- source_word: ἐξ εὐωνύμων
  choice: बाएँ
  rationale: यह वाक्यांश स्थानसूचक रूप से बाईं ओर का अर्थ देता है। यूनानी में αὐτοῦ दोबारा नहीं आया है, इसलिए हिन्दी में भी ‘उसके’ को दोहराए बिना ‘बाएँ’ कहना संतुलित और स्पष्ट है।
- source_word: μὲν ... δὲ
  choice: '... और ...'
  rationale: यह युग्म दोनों समूहों के विरोधी विन्यास को चिह्नित करता है। हिन्दी में दाहिने और बाएँ की समानांतर संरचना स्वयं विरोध स्पष्ट करती है; यहाँ ‘और’ अधिक स्वाभाविक है, जबकि ‘परन्तु’ अनावश्यक रूप से तर्कात्मक लग सकता है।
theological_decisions:
- issue: दाहिने और बाएँ स्थानों के प्रतीकात्मक अर्थ को अनुवाद में स्पष्ट करना या न करना
  choice: केवल स्थानसूचक रूप में ‘अपने दाहिने ... बाएँ’ रखना
  alternative: ‘सम्मान के स्थान पर ... अस्वीकार के स्थान पर’ जैसे अर्थ-विस्तार करना
  rationale: यूनानी पाठ इस पद में समूहों की स्थानगत व्यवस्था बताता है। संदर्भ में इन स्थानों का मूल्यांकनात्मक संकेत है, पर उसे मुख्य पाठ में खोलकर कहना मूल से आगे की व्याख्या होगी।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। समानांतर वाक्य-विन्यास न्याय-दृश्य की गंभीरता और भेड़ों तथा बकरी के बच्चों के स्पष्ट विभाजन को बनाए रखता है।
