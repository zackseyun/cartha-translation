  text: और हमने आपको कब अजनबी[a] देखा और अपने यहाँ ठहराया[b], या नंगा[c] देखा और कपड़े पहनाए?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परदेशी’। यूनानी शब्द किसी अपरिचित व्यक्ति या अपने दायरे से बाहर के व्यक्ति के लिए आ सकता है; यहाँ आशय ऐसे व्यक्ति से है जिसे आतिथ्य की आवश्यकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘इकट्ठा किया’ या ‘ग्रहण किया’; यहाँ आशय किसी को अपने यहाँ स्थान देकर आतिथ्य करने से है।
    reason: lexical_alternative
  - marker: c
    text: या ‘पर्याप्त कपड़ों के बिना’। यूनानी शब्द पूरी तरह नंगा होने या पर्याप्त कपड़े न होने, दोनों के लिए आ सकता है।
    reason: lexical_alternative
