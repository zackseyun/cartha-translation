- source_word: δέ
  choice: और
  rationale: यह पिछले प्रश्न से हल्के ढंग से जोड़कर प्रश्नों की शृंखला आगे बढ़ाता है; यहाँ विरोधसूचक ‘परन्तु’ की अपेक्षा ‘और’ उपयुक्त है।
- source_word: σε
  choice: आपको
  rationale: यह राजा/मनुष्य के पुत्र को संबोधित एकवचन कर्मकारक सर्वनाम है। आदरपूर्ण प्रसंग में ‘आपको’ स्वाभाविक है।
- source_word: εἴδομεν
  choice: हमने ... देखा
  rationale: ὁράω का एओरिस्ट रूप अतीत में देखने की क्रिया बताता है; हिन्दी प्रश्न में ‘हमने ... कब ... देखा’ सहज है।
- source_word: ξένον
  choice: अजनबी
  rationale: यह किसी अपरिचित या अपने सामाजिक दायरे से बाहर के व्यक्ति को दर्शाता है, जिसे आतिथ्य की आवश्यकता है। ‘अजनबी’ जातीय या राष्ट्रीय पहचान को अनावश्यक रूप से सीमित नहीं करता।
- source_word: συνηγάγομεν
  choice: अपने यहाँ ठहराया
  rationale: συνάγω का मूल भाव ‘इकट्ठा करना/अन्दर लाना’ है, पर इस आतिथ्य-संदर्भ में इसका अर्थ किसी को अपने यहाँ ग्रहण करके ठहराना है।
- source_word: ἢ
  choice: या
  rationale: यह दूसरे प्रश्न-विकल्प को पहले से जोड़ने वाला सामान्य विकल्पसूचक संयोजक है।
- source_word: γυμνὸν
  choice: नंगा
  rationale: γυμνός पूर्णतः वस्त्रहीन होने या पर्याप्त वस्त्र न होने, दोनों का संकेत दे सकता है। ‘नंगा’ संक्षिप्त मुख्य पाठ रखता है और पादटिप्पणी व्यापक अर्थ स्पष्ट करती है।
- source_word: περιεβάλομεν
  choice: कपड़े पहनाए
  rationale: इस प्रसंग में περιβάλλω का अर्थ किसी को वस्त्र पहनाना है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक अभिव्यक्ति है।
theological_decisions:
