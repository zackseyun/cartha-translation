  choice: अजनबी
  alternative: परदेशी
  rationale: ‘अजनबी’ ऐसे अपरिचित या बाहरी व्यक्ति का सामाजिक भाव बनाए रखता है जिसे स्वागत और ठहरने की जगह चाहिए, जबकि ‘परदेशी’ अर्थ को भौगोलिक या राष्ट्रीय बाहरीपन तक सीमित समझा जा सकता है।
