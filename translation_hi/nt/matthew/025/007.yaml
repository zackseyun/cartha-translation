lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह अगले घटनाक्रम का समय-सूचक शब्द है; ‘तब’ स्वाभाविक हिंदी में कथा का प्रवाह बनाए रखता है।
- source_word: ἠγέρθησαν
  choice: उठीं
  rationale: यहाँ क्रिया नींद या विश्राम की अवस्था से उठने को व्यक्त करती है; हिंदी में ‘उठीं’ सीधा और स्वाभाविक है।
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: वे सभी कुँवारियाँ
  rationale: παρθένοι का मूल अर्थ ‘कुँवारियाँ’ है और विवाह-संदर्भ में इसकी विशिष्टता बनाए रखना उचित है।
- source_word: ἐκόσμησαν
  choice: ठीक करने लगीं
  rationale: κοσμέω का अर्थ व्यवस्थित या तैयार करना है। दीपकों के संदर्भ में बाती आदि ठीक करके उन्हें उपयोग के लिए तैयार करने का भाव है; ‘ठीक करने लगीं’ इसे बिना अनावश्यक तकनीकी विवरण जोड़े स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λαμπάδας
  choice: दीपक
  rationale: λαμπάς दीपक या मशाल, दोनों प्रकार के हाथ में लिए जाने वाले प्रकाश-स्रोत को सूचित कर सकता है। तेल और तैयारी के निकट संदर्भ में ‘दीपक’ मुख्य पाठ के लिए स्वाभाविक है, जबकि ‘मशालें’ संभव विकल्प है।
- source_word: ἑαυτῶν
  choice: अपने
  rationale: यह आत्मवाचक संबंधकारक है और बताता है कि दीपक उन्हीं कुँवारियों के थे; हिंदी में ‘अपने’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
