reference: Matthew 25:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: hi
  text: तब वे भी उत्तर देंगे, ‘प्रभु, हमने आपको कब भूखा, प्यासा, अजनबी, वस्त्रहीन, बीमार या कैद में देखा और आपकी सेवा नहीं की?’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘सेवा नहीं की’ का अनुवाद ‘देखभाल नहीं की’ या ‘सहायता नहीं की’ भी हो सकता है (यूनानी: διακονέω)।'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह न्याय के दृश्य में घटनाक्रम का अगला चरण बताता है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: ἀποκριθήσονται καὶ αὐτοὶ
  choice: वे भी उत्तर देंगे
  rationale: ‘भी’ इस बात को बनाए रखता है कि पिछले समूह की तरह यह समूह भी उत्तर देता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यीशु को किए गए आदरसूचक सम्बोधन और κύριος की मसीही प्रतिध्वनि, दोनों को सुरक्षित रखता है।
- source_word: ξένον
  choice: परदेशी
  rationale: यह ऐसे बाहरी या अपरिचित व्यक्ति का बोध कराता है जिसे आतिथ्य की आवश्यकता है; ‘परदेशी’ जातीय पहचान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: γυμνὸν
  choice: वस्त्रहीन
  rationale: यह γυμνός के सीधे अर्थ को बनाए रखते हुए आधुनिक हिन्दी में गरिमापूर्ण और सुस्पष्ट है; प्रसंग में अपर्याप्त वस्त्र भी निहित हो सकते हैं।
- source_word: ἀσθενῆ
  choice: बीमार
  rationale: शारीरिक और सामाजिक आवश्यकताओं की इस सूची में ἀσθενής का सर्वाधिक स्वाभाविक अर्थ ‘बीमार’ है।
- source_word: ἐν φυλακῇ
  choice: बन्दी
  rationale: ग्रीक पद का आशय कारावास में होने से है; सूची में विशेषणात्मक समानांतरता के लिए ‘बन्दी’ स्वाभाविक है।
- source_word: διηκονήσαμέν σοι
  choice: आपकी सेवा नहीं की
  rationale: यह διακονέω की व्यावहारिक सहायता और सेवा की व्यापक अर्थ-सीमा को रखता है तथा राजा की सेवा और जरूरतमन्दों की सहायता के बीच सम्बन्ध बनाए रखता है।
theological_decisions:
- issue: यीशु के लिए κύριος का सम्बोधन
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ सम्मानसूचक सम्बोधन और मसीह-संबंधी अर्थगूंज दोनों को सुरक्षित रखता है, बिना पद में कही बात से आगे बढ़े।
- issue: अन्तिम खण्ड में διακονέω का अर्थ
  choice: आपकी सेवा नहीं की
  alternative: आपकी देखभाल नहीं की / आपकी सहायता नहीं की
  rationale: ‘सेवा’ मूल क्रिया की व्यापकता को बचाती है; ‘देखभाल’ या ‘सहायता’ इसे कुछ अधिक संकीर्ण कर सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। प्रत्यक्ष कथन में सम्मानसूचक ‘आपको/आपकी’ रखा गया है। ‘या’ की पुनरावृत्ति यूनानी सूची की संरचना और प्रत्येक स्थिति की पृथकता को बनाए रखती है।
