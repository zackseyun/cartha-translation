reference: Matthew 25:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: hi
  text: फिर वह भी, जिसे दो तोड़े[b] मिले थे, पास आया और बोला, “प्रभु[a], आपने मुझे दो तोड़े सौंपे थे। देखिए, मैंने दो तोड़े और कमाए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वामी।” यूनानी संबोधन क्यूरियोस का सामान्य अनुवाद “प्रभु” है; इस दृष्टान्त में यह किसी स्वामी के लिए आदरपूर्ण संबोधन भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: तोड़ा प्राचीन काल में वजन और धन-मूल्य की एक बड़ी इकाई था, किसी व्यक्ति की स्वाभाविक प्रतिभा नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: पास आया
  rationale: यह προσέρχομαι के निकट आने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और बोलने से पहले सेवक के आगे आने को दर्शाता है।
- source_word: δὲ καὶ
  choice: फिर ... भी
  rationale: ‘फिर’ कथा के क्रम को और ‘भी’ पिछले सेवक के समानांतर इस सेवक के आने को व्यक्त करता है।
- source_word: ὁ τὰ δύο τάλαντα
  choice: वह भी, जिसे दो तोड़े मिले थे
  rationale: यूनानी पद सेवक की पहचान उसे दी गई राशि से कराता है। ‘मिले थे’ निकटवर्ती कथा-संदर्भ से स्पष्ट की गई स्वाभाविक हिन्दी है।
- source_word: Κύριε
  choice: प्रभु
  rationale: κύριος का सामान्य हिन्दी बाइबलीय रूप ‘प्रभु’ है; दृष्टान्त के सामाजिक प्रसंग में ‘स्वामी’ भी संभव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
- source_word: παρέδωκας
  choice: सौंपे थे
  rationale: παραδίδωμι के ‘हवाले करने/सौंपने’ के भाव को बनाए रखता है और धन की जिम्मेदारी दिए जाने के प्रसंग में स्वाभाविक है।
- source_word: ἴδε
  choice: देखिए
  rationale: ध्यान खींचने वाली आज्ञार्थक अभिव्यक्ति को सम्मानसूचक, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: ἄλλα δύο τάλαντα
  choice: दो तोड़े और
  rationale: ἄλλα के अतिरिक्त समान मात्रा के अर्थ को हिन्दी के स्वाभाविक क्रम में व्यक्त करता है।
- source_word: ἐκέρδησα
  choice: कमाए हैं
  rationale: κερδαίνω के लाभ या कमाई प्राप्त करने के भाव को इस आर्थिक प्रसंग में सहज हिन्दी में व्यक्त करता है; क्रिया की विधि को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: τάλαντα
  choice: तोड़े
  rationale: τάλαντον प्राचीन काल में भार और बड़ी धनराशि की इकाई था। पारंपरिक हिन्दी पद ‘तोड़ा’ को बनाए रखते हुए पाद-टिप्पणी इसके अर्थ को स्पष्ट करती है।
theological_decisions:
- issue: दृष्टान्त में संबोधन के रूप में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ κύριος का सामान्य और संगत अनुवाद है, जबकि तत्कालीन स्वामी-सेवक प्रसंग में ‘स्वामी’ भी भाषिक रूप से संभव है। मुख्य पाठ एक अर्थ चुनता है और पाद-टिप्पणी वास्तविक प्रसंगगत विकल्प को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और आदरपूर्ण रखी गई है। संवाद में ‘आपने’ और ‘देखिए’ सामाजिक सम्मान को व्यक्त करते हैं। पारंपरिक आर्थिक पद ‘तोड़ा’ को सांस्कृतिक पाद-टिप्पणी के साथ रखा गया है।
