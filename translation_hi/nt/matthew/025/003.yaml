    issue: Directional nuance in “ले गईं”
    rationale: The Greek verbs mean “take,” without specifying movement away. Hindi “ले गईं” can naturally imply carrying something away. “ले लीं” and “नहीं लिया” avoid adding this nuance and maintain the wordplay/repetition of λαβοῦσαι/ἔλαβον.
