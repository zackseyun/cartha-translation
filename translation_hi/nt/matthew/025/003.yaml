  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: hi
  text: क्योंकि मूर्ख युवतियों ने अपनी मशालें[a] तो ले लीं, पर अपने साथ तेल नहीं लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दीपक।” यूनानी शब्द λαμπάς का अर्थ “मशाल” या “दीपक” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μωραὶ
  choice: मूर्ख युवतियाँ
  rationale: स्त्रीलिंग बहुवचन विशेषण पिछले पद की युवतियों की ओर संकेत करता है। संज्ञा जोड़ने से हिन्दी में संदर्भ स्पष्ट और स्वाभाविक रहता है।
- source_word: λαβοῦσαι
  choice: ले गईं
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से जुड़ी पूर्ववर्ती क्रिया बताता है। विवाह-यात्रा के प्रसंग में ‘ले गईं’ स्वाभाविक है।
- source_word: λαμπάδας
  choice: मशालें
  rationale: λαμπάς तेल से जलने वाली मशाल या दीपक हो सकता है। इस विवाह-जुलूस के प्रसंग में ‘मशालें’ संभावित ऐतिहासिक वस्तु को अधिक स्पष्ट करता है, जबकि ‘दीपक’ को पादटिप्पणी में रखा गया है।
- source_word: οὐκ ἔλαβον
  choice: नहीं ले गईं
  rationale: ‘ले गईं ... नहीं ले गईं’ मूल के λαβοῦσαι/ἔλαβον की शाब्दिक पुनरावृत्ति और विरोध को बनाए रखता है।
- source_word: μεθ’ ἑαυτῶν
  choice: अपने साथ
  rationale: यह आत्मवाचक वाक्यांश का स्वाभाविक हिन्दी रूप है।
- source_word: ἔλαιον
  choice: तेल
  rationale: प्रकाश के साधन के लिए प्रयुक्त तेल का सीधा और स्पष्ट अनुवाद।
