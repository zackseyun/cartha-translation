  yaml_path: translation/nt/matthew/025/012.yaml
  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: hi
  text: पर उसने उत्तर दिया, “मैं तुमसे सच कहता हूँ, मैं तुम्हें नहीं जानता[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं तुम्हें नहीं पहचानता।” यूनानी में अधिक शाब्दिक रूप से “मैं तुम्हें नहीं जानता” है, जो इस प्रसंग में संबंधगत पहचान न देने का भाव भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: पर उसने उत्तर दिया
  rationale: प्रतिभागी कृदंत और मुख्य क्रिया की यूनानी कथात्मक अभिव्यक्ति को स्वाभाविक हिन्दी में संक्षिप्त किया गया है; δέ का ‘पर’ पिछली विनती के साथ विरोध दर्शाता है।
- source_word: Ἀμὴν
  choice: सच
  rationale: यहाँ Ἀμὴν कथन की सत्यता और गंभीरता पर बल देता है। ‘मैं तुमसे सच कहता हूँ’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: प्रत्यक्ष संबोधन और गंभीर उद्घोषणा को स्वाभाविक हिन्दी में बनाए रखता है; प्रसंग में ‘तुम’ समूह के लिए है।
- source_word: οὐκ οἶδα
  choice: मैं ... नहीं जानता
  rationale: οἶδα का मूल अर्थ ‘जानना’ है। यह शब्दावली प्रसंगगत पहचान न देने या संबंध से इनकार करने की संभावना को खुला रखती है।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: यह द्वितीय पुरुष बहुवचन कर्म है। आधुनिक हिन्दी में ‘तुम्हें’ समूह-संबोधन के रूप में स्वाभाविक है।
theological_decisions:
- issue: दृष्टांत में ‘मैं तुम्हें नहीं जानता’ का आशय
  choice: मुख्य पाठ में सरल पर संबंधगत रूप से गंभीर वाक्य ‘मैं तुम्हें नहीं जानता’ रखा गया है।
  alternative: ‘मैं तुम्हें नहीं पहचानता’ या ‘मेरा तुमसे कोई संबंध नहीं है।’
  rationale: यूनानी वाक्य प्रसंग में बहिष्कार और संबंधगत अस्वीकार का संकेत दे सकता है, पर अधिक व्याख्यात्मक अनुवाद पद से आगे जाकर किसी विशिष्ट धर्मवैज्ञानिक निष्कर्ष को आरोपित करेगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक कथन के अनुकूल। ‘पर’ विरोध को, और ‘सच कहता हूँ’ Ἀμὴν-वाक्य की गंभीरता को स्पष्ट करता है।
