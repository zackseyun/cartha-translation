  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: hi
  text: परन्तु जब दूल्हे को आने में देर हुई[a], तो वे सब ऊँघने लगीं और सो गईं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, «जब दूल्हे के आने में बहुत समय लग रहा था।»
    reason: lexical_alternative
  - marker: b
    text: या, «वे सब उनींदी हो गईं और सो रही थीं।» यूनानी में ऊँघने लगने (ἐνύσταξαν) और सोने की अवस्था में होने (ἐκάθευδον) के बीच भेद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: आने में देर हुई
  rationale: वर्तमान कृदन्त यहाँ अपेक्षा से अधिक समय लगने या विलम्ब होने का भाव देता है। प्रसंग में दूल्हे के आगमन की प्रतीक्षा है, इसलिए ‘आने में देर हुई’ स्वाभाविक हिन्दी में आशय स्पष्ट करता है, बिना यह तय किए कि विलम्ब जानबूझकर था।
- source_word: δὲ
  choice: परन्तु
  rationale: 'δέ कथा में हल्का विरोध या नया मोड़ दिखाता है: प्रतीक्षा के विपरीत दूल्हे के आने में देर होती है और सब सो जाती हैं।'
- source_word: νυμφίου
  choice: दूल्हे
  rationale: νυμφίος विवाह के प्रसंग में दूल्हे को सूचित करता है। यह वर्तमान हिन्दी में सटीक और सहज है तथा रूपक की धार्मिक व्याख्या को पद में स्पष्ट रूप से नहीं जोड़ता।
- source_word: ἐνύσταξαν
  choice: ऊँघने लगीं
  rationale: क्रिया उनींदा होने या ऊँघने लगने का आरम्भिक भाव व्यक्त करती है। यह बाद की सोने की क्रिया से स्वाभाविक भेद बनाए रखती है।
- source_word: πᾶσαι
  choice: वे सब
  rationale: स्त्रीलिंग बहुवचन पहले उल्लिखित सभी दस कुँवारियों की ओर संकेत करता है; ‘वे सब’ समग्रता को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ἐκάθευδον
  choice: सो गईं
  rationale: καθεύδω का अर्थ सोना है। पहले ‘ऊँघने लगीं’ आने से ‘सो गईं’ उनींदेपन से नींद तक की प्रगति को स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी अपूर्ण काल के कारण ‘सोती रहीं’ भी सम्भव है।
theological_decisions:
- issue: दूल्हे का दृष्टान्तात्मक बिम्ब
  choice: ‘दूल्हे’ को कथा के बिम्ब के रूप में यथावत रखा गया है और उसकी निहित मसीही पहचान को अनुवाद में स्पष्ट नहीं किया गया।
  alternative: व्याख्यात्मक रूप से ‘मसीह रूपी दूल्हा’ कहना, या अधिक औपचारिक ‘वर’ प्रयोग करना।
  rationale: मत्ती के व्यापक सन्दर्भ में दूल्हे के बिम्ब का धर्मवैचारिक महत्त्व है, पर यह पद उसे सीधे कथा के पात्र के रूप में प्रस्तुत करता है। अनुवाद को बिम्ब सुरक्षित रखना चाहिए, न कि निहित अर्थ को व्याख्या बनाकर मूल पाठ में जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘दूल्हा’ सामान्य पाठक के लिए ‘वर’ से अधिक स्वाभाविक है। स्त्रीलिंग क्रियाएँ उन दस कुँवारियों के पूर्ववर्ती उल्लेख के अनुरूप हैं।
