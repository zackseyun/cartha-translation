reference: Matthew 25:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: hi
  text: इसलिए तुम्हें मेरा धन[a] बैंकरों के पास जमा करना चाहिए था, और जब मैं लौटता, तो मैं अपना धन ब्याज समेत वापस पा लेता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी चाँदी।”
    reason: ἀργύρια का शाब्दिक अर्थ ‘चाँदी’ हो सकता है; इस आर्थिक संदर्भ में मुख्य पाठ में ‘धन’ अधिक स्वाभाविक है।
lexical_decisions:
- source_word: ἔδει
  choice: कर देना चाहिए था
  rationale: अपूर्णकालिक निर्वैयक्तिक क्रिया बीते समय के दायित्व या उचित अपेक्षा को व्यक्त करती है; यह हिंदी प्रयोग उसकी फटकारपूर्ण शक्ति को स्वाभाविक ढंग से रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले आरोप से निकले निष्कर्ष को स्पष्ट रूप से जोड़ता है।
- source_word: βαλεῖν
  choice: जमा कर देना
  rationale: मूल अर्थ ‘रखना/डालना’ है, पर साहूकारों और ब्याज के आर्थिक संदर्भ में धन जमा करने का भाव अभिप्रेत है।
- source_word: τὰ ἀργύριά μου
  choice: मेरा धन
  rationale: ἀργύριον का अर्थ चाँदी या मुद्रा हो सकता है; इस व्यापारिक प्रसंग में ‘धन’ सहज और अर्थ-सटीक है।
- source_word: τραπεζίταις
  choice: साहूकारों
  rationale: यह शब्द बैंकिंग या मुद्रा-व्यवहार करने वालों को सूचित करता है। प्राचीन परिवेश में ‘साहूकार’ आधुनिक संस्थागत ‘बैंकर’ से अधिक स्वाभाविक है और ब्याज पर धन रखने का भाव व्यक्त करता है।
- source_word: ἐλθὼν ἐγὼ
  choice: लौटने पर मैं
  rationale: कृदंत का समय-संबंध मुख्य क्रिया से पहले आने को दर्शाता है; दृष्टांत में स्वामी के लौटने का प्रसंग होने से ‘लौटने पर’ स्वाभाविक है।
- source_word: ἐκομισάμην ἂν
  choice: वापस पा लेता
  rationale: मध्यम रूप अपने लिए वापस प्राप्त करने का भाव रखता है, और ἄν अवास्तविक भूतकालीन परिणाम को व्यक्त करता है।
- source_word: τὸ ἐμὸν
  choice: अपना धन
  rationale: संज्ञा के रूप में प्रयुक्त स्वत्ववाचक पद स्वामी की अपनी संपत्ति की ओर संकेत करता है; हिंदी में संदर्भानुसार ‘अपना धन’ स्पष्ट है।
- source_word: σὺν τόκῳ
  choice: ब्याज समेत
  rationale: τόκος यहाँ धन पर मिलने वाला ब्याज है; यह तटस्थ आर्थिक शब्द है और अनावश्यक नैतिक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: दृष्टांत में ब्याज संबंधी आर्थिक भाषा का नैतिक अर्थ
  choice: आर्थिक शब्दों को दृष्टांत की तटस्थ छवि के रूप में सीधे अनूदित किया गया है।
  alternative: ‘सूद’ या किसी ऐसे शब्द का प्रयोग जो शोषण अथवा नैतिक निंदा का संकेत दे।
  rationale: यह पद ब्याज लेने की समस्त प्रथा का समर्थन या निषेध नहीं करता; अनुवाद में बाद के धर्मवैचारिक विवाद आरोपित नहीं किए जाने चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली। ‘साहूकार’ प्राचीन निजी वित्त-व्यवहार के परिवेश को दर्शाता है; ‘ब्याज समेत’ आज के पाठक के लिए स्पष्ट और तटस्थ है।
