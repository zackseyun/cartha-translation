  source_fidelity: 'The draft accurately represents the Greek: the master speaks to his subordinate; the commendation retains both ‘good’ and ‘faithful’; the contrast between few and many entrusted matters is preserved; and ‘enter into the joy of your master’ retains the image of entering rather than merely sharing in joy. ‘स्वामी’ correctly reflects κύριος in the parable’s narrative setting.'
  naturalness: The Hindi is clear, modern, and suitably dignified. ‘शाबाश’ is an idiomatic commendation, and the singular direct address ‘तू/तुझे’ coheres with the master–servant relationship in the parable. ‘बातों में’ and ‘बातों पर अधिकारी ठहराऊँगा’ are understandable, idiomatic ways to express responsibility over a small or larger sphere.
  terminology: ‘स्वामी’ is contextually appropriate for κύριος, without prematurely making it a divine title. ‘सेवक’ is a defensible main-text rendering of δοῦλος, while the footnote preserves ‘दास’ as the stronger alternative. ‘विश्वासयोग्य’ consistently renders πιστός/πιστέ. The footnote marker is correctly placed immediately after ‘सेवक.’
