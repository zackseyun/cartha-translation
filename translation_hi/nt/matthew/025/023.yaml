id: MAT.25.23
reference: Matthew 25:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: hi
  text: उसके स्वामी ने उससे कहा, “शाबाश, अच्छे और विश्वासयोग्य सेवक![a] तू थोड़ी-सी बातों में विश्वासयोग्य रहा; मैं तुझे बहुत-सी बातों पर अधिकारी ठहराऊँगा। अपने स्वामी के आनन्द में प्रवेश कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दास।” यूनानी शब्द δοῦλος सन्दर्भ के अनुसार सेवक या दास को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: कहा
  rationale: प्रत्यक्ष कथन का सहज और मानक हिन्दी परिचय।
- source_word: κύριος
  choice: स्वामी
  rationale: दृष्टान्त में यह सेवक के मानवीय अधिकारी को सूचित करता है; ‘स्वामी’ सम्बन्ध और अधिकार दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δοῦλε
  choice: सेवक
  rationale: सन्दर्भ में अधीनस्थ गृह-सेवक अभिप्रेत है। यूनानी शब्द दास को भी सूचित कर सकता है, इसलिए वह अर्थ पादटिप्पणी में रखा गया है।
- source_word: Εὖ
  choice: शाबाश
  rationale: प्रशंसा व्यक्त करने वाले इस अव्यय का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: ἀγαθὲ καὶ πιστέ
  choice: अच्छे और विश्वासयोग्य
  rationale: दोनों सम्बोधनात्मक विशेषणों को बनाए रखता है और πιστός की अगली आवृत्ति से शब्दगत सम्बन्ध सुरक्षित रखता है।
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: तू थोड़ी-सी बातों में विश्वासयोग्य रहा
  rationale: ἐπί यहाँ सौंपे गए उत्तरदायित्व के क्षेत्र को दर्शाता है; ‘बातों में’ हिन्दी में स्वाभाविक है और मूल के अनिर्दिष्ट बहुवचन को अनावश्यक रूप से वस्तुओं तक सीमित नहीं करता।
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: मैं तुझे बहुत-सी बातों पर अधिकारी ठहराऊँगा
  rationale: καθίστημι का भाव किसी को बड़े उत्तरदायित्व पर नियुक्त करना है; यह रूप थोड़े और बहुत के समानान्तर विरोध को बनाए रखता है।
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: आनन्द में प्रवेश कर
  rationale: प्रवेश के मूल रूपक को बनाए रखता है और उसे केवल ‘आनन्द बाँटना’ कहकर सपाट नहीं करता।
theological_decisions:
- issue: दृष्टान्त में κύριος का अनुवाद
  choice: स्वामी
  alternative: प्रभु
  rationale: कथा के भीतर सन्दर्भ मानवीय स्वामी का है। ‘स्वामी’ इस स्तर को स्पष्ट रखता है और दृष्टान्त के व्यापक धर्मवैज्ञानिक संकेत को अनुवाद में पहले से आरोपित नहीं करता।
- issue: δοῦλος का अनुवाद
  choice: सेवक
  alternative: दास
  rationale: मुख्य बल विश्वासयोग्य उत्तरदायित्व पर है। फिर भी मूल शब्द बन्धुआ दास को भी सूचित कर सकता है, इसलिए अधिक कठोर सम्भावना पादटिप्पणी में सुरक्षित है।
- issue: τὴν χαρὰν τοῦ κυρίου σου की व्याख्या
  choice: अपने स्वामी के आनन्द में प्रवेश कर
  alternative: अपने स्वामी के आनन्द में सहभागी हो
  rationale: मूल में ‘प्रवेश’ का रूपक स्पष्ट है; सहभागी होने का भाव सम्भव है, पर उसे मुख्य पाठ में प्रतिस्थापित करना मूल बिम्ब को कम कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। स्वामी सेवक से सीधे बोल रहा है, इसलिए एकवचन ‘तू’ मूल के निकट तथा सामाजिक सम्बन्ध के अनुकूल है; इसे अनादर के बजाय अधिकार-संबन्ध के रूप में पढ़ा जाना चाहिए।
