  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: hi
  text: और ये अनन्त दण्ड[a] में चले जाएँगे, परन्तु धर्मी अनन्त जीवन में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युग-भर का दण्ड” ... “युग-भर का जीवन।” कुछ प्रसंगों में αἰώνιος के अर्थ पर मतभेद है; यहाँ वही शब्द ‘दण्ड’ और ‘जीवन’ दोनों के लिए आया है, इसलिए मुख्य पाठ में दोनों जगह ‘अनन्त’ रखकर समानान्तरता बनाए रखी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: चले जाएँगे
  rationale: ἀπέρχομαι का भविष्यत् रूप यहाँ किसी स्थान या दशा की ओर प्रस्थान को व्यक्त करता है। ‘चले जाएँगे’ स्वाभाविक आधुनिक हिन्दी है और मूल के गति-बोध को बनाए रखता है।
- source_word: οὗτοι
  choice: ये
  rationale: यह संकेतवाचक सर्वनाम पहले वर्णित समूह की ओर संकेत करता है। ‘ये’ संक्षिप्त है और ‘धर्मी’ के साथ विरोध को स्पष्ट रखता है।
- source_word: κόλασιν
  choice: दण्ड
  rationale: अन्तिम न्याय के इस प्रसंग में κόλασις दण्डात्मक परिणाम को दर्शाता है। ‘दण्ड’ गरिमापूर्ण, स्पष्ट और प्रसंगानुकूल हिन्दी है।
- source_word: αἰώνιον
  choice: अनन्त
  rationale: एक ही विशेषण दण्ड और जीवन दोनों के लिए प्रयुक्त हुआ है। दोनों स्थानों पर ‘अनन्त’ रखने से यूनानी वाक्य का समानान्तर रूप सुरक्षित रहता है; वैकल्पिक अर्थ फुटनोट में दिया गया है।
- source_word: δίκαιοι
  choice: धर्मी
  rationale: विशेषण यहाँ संज्ञा के रूप में उन लोगों के लिए आया है जो धर्मी ठहरते या धर्मी चरित्र वाले हैं। ‘धर्मी’ आधुनिक बाइबलीय हिन्दी में स्वाभाविक और अर्थपूर्ण है।
- source_word: ζωὴν
  choice: जीवन
  rationale: ζωή का सीधा और प्रसंगानुकूल हिन्दी रूप ‘जीवन’ है; विस्तार जोड़ने की आवश्यकता नहीं है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह दोनों समूहों और उनकी परिणतियों के बीच विरोध दिखाता है। ‘परन्तु’ उस विरोध को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: κόλασιν αἰώνιον और ζωὴν αἰώνιον में αἰώνιον का अनुवाद
  choice: दोनों उपवाक्यों में ‘अनन्त’
  alternative: दोनों स्थानों पर ‘युग-भर का’ अथवा ‘युग-संबंधी’
  rationale: मूल में एक ही विशेषण ‘दण्ड’ और ‘जीवन’ दोनों को विशेषित करता है। अतः अनुवाद में समान शब्द रखकर समानान्तरता और अवधि/गुण के विषय में उपस्थित व्याख्यात्मक तनाव को सुरक्षित रखा गया है; वैकल्पिक शाब्दिक संभावना फुटनोट में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘परन्तु’ औपचारिक बाइबलीय लय देता है, जबकि वाक्य-रचना मूल यूनानी की स्पष्ट समानान्तरता को बनाए रखती है।
