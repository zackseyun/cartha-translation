source:
  edition: SBLGNT
  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: hi
  text: पर समझदार युवतियों ने उत्तर दिया, “नहीं; कहीं ऐसा न हो कि हमारे और तुम्हारे लिए तेल पर्याप्त न पड़े। इसके बजाय बेचने वालों के पास जाओ और अपने लिए खरीद लो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “कहीं ऐसा न हो कि वह हमारे और तुम्हारे लिए बिल्कुल पर्याप्त न पड़े।” यूनानी में ‘कहीं ऐसा न हो’ के साथ बलयुक्त निषेध है, जो तेल के अपर्याप्त पड़ने की प्रबल आशंका व्यक्त करता है।'
    reason: मूल यूनानी के μήποτε के साथ बलयुक्त οὐ μή को स्पष्ट करने के लिए, बिना ‘किसी भी तरह’ जैसा अतिरिक्त रीति-संबंधी अर्थ जोड़े।
lexical_decisions:
- source_word: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι
  choice: पर समझदार युवतियों ने उत्तर दिया
  rationale: ‘पर’ संवाद में विरोध को व्यक्त करता है। स्त्रीलिंग बहुवचन विशेषण αἱ φρόνιμοι पिछले संदर्भ की युवतियों को सूचित करता है; ‘समझदार युवतियाँ’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है। ‘उत्तर दिया’ ἀπεκρίθησαν और भाषण-आरंभक λέγουσαι दोनों को बिना अनावश्यक दोहराव के व्यक्त करता है।
- source_word: Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ
  choice: नहीं; कहीं ऐसा न हो कि ... पर्याप्त न पड़े
  rationale: यह रचना दृढ़ इनकार के साथ इस प्रबल आशंका को व्यक्त करती है कि उपलब्ध मात्रा दोनों समूहों के लिए पर्याप्त नहीं होगी। ‘कहीं ऐसा न हो’ आशंका को बनाए रखता है और ‘पर्याप्त न पड़े’ सीमित तेल के प्रसंग में स्वाभाविक है।
- source_word: ἡμῖν καὶ ὑμῖν
  choice: हमारे और तुम्हारे लिए
  rationale: लाभ या उपयोग के अर्थ वाले सम्प्रदान कारक को हिन्दी में ‘के लिए’ से स्पष्ट और सहज रूप में व्यक्त किया गया है।
- source_word: πορεύεσθε μᾶλλον
  choice: इसके बजाय ... जाओ
  rationale: μᾶλλον यहाँ पहले अनुरोध के स्थान पर पसंद किए गए वैकल्पिक कदम को सूचित करता है; ‘इसके बजाय’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: πρὸς τοὺς πωλοῦντας
  choice: बेचनेवालों के पास
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत का सीधा और स्वाभाविक हिन्दी रूप; विक्रय की वस्तु प्रसंग से स्पष्ट है।
- source_word: ἀγοράσατε ἑαυταῖς
  choice: अपने लिए मोल ले लो
  rationale: आज्ञार्थक क्रिया और आत्मवाचक सम्प्रदान दोनों सुरक्षित हैं। ‘मोल ले लो’ गरिमापूर्ण किंतु सामान्य हिन्दी है और अपने उपयोग के लिए खरीदने का अर्थ देता है।
- source_word: ἀρκέσῃ
  choice: तेल पर्याप्त न पड़े
  rationale: यद्यपि ‘तेल’ इस पद में निहित है, पिछले पद के स्पष्ट संदर्भ को हिन्दी में दोहराने से वाक्य सहज और अर्थ निर्विवाद रहता है; कोई नया कथ्य नहीं जोड़ा जाता।
theological_decisions:
- issue: तेल की अपर्याप्तता को निश्चित कथन या आशंका के रूप में प्रस्तुत करना
  choice: ‘कहीं ऐसा न हो’ द्वारा प्रबल आशंका बनाए रखी गई
  alternative: ‘यह हमारे और तुम्हारे लिए पर्याप्त नहीं होगा’ जैसा निश्चित कथन
  rationale: μήποτε के कारण परिणाम को निश्चित भविष्यवाणी में बदलना उचित नहीं; οὐ μή उसकी आशंका को बल देता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज संवाद और गरिमापूर्ण कथात्मक शैली। ‘समझदार’ सामान्य पाठक के लिए ‘बुद्धिमान’ या ‘विवेकी’ से अधिक प्रसंगानुकूल व्यवहारिक सूझ-बूझ व्यक्त करता है। उद्धरण में अर्धविराम इनकार और उसके कारण को अलग करता है।
