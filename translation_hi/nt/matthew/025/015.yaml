reference: Matthew 25:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: hi
  text: उसने एक को पाँच तोड़े[a], दूसरे को दो और तीसरे को एक दिया—हर एक को उसकी अपनी क्षमता के अनुसार—और वह तुरंत यात्रा पर चला गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तोड़ा’ भार और धन की एक बहुत बड़ी प्राचीन इकाई थी; यहाँ इसका अर्थ स्वाभाविक प्रतिभा या योग्यता नहीं है।
    reason: lexical_clarification
  - marker: b
    text: '‘तुरंत’ को अगले पद के साथ भी जोड़ा जा सकता है: “तुरंत ही वह गया जिसे पाँच तोड़े मिले थे…”'
    reason: syntactical_ambiguity
lexical_decisions:
- source_word: τάλαντα
  choice: तोड़े
  rationale: यहाँ शब्द किसी स्वाभाविक प्रतिभा का नहीं, बल्कि भार और धन की बहुत बड़ी प्राचीन इकाई का द्योतक है। ‘तोड़ा’ ऐतिहासिक पद को सुरक्षित रखता है; पादटिप्पणी उसका अर्थ स्पष्ट करती है।
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: एक को ... दूसरे को ... और तीसरे को
  rationale: यह वितरण और प्राप्तकर्ताओं के बीच अंतर को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἕν
  choice: एक
  rationale: पहले आए ‘तोड़े’ से संज्ञा स्वतः समझी जाती है, इसलिए अनावश्यक पुनरावृत्ति नहीं की गई।
- source_word: ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν
  choice: हर एक को उसकी अपनी क्षमता के अनुसार
  rationale: δύναμις यहाँ चमत्कारी सामर्थ्य नहीं, व्यक्ति की योग्यता अथवा कार्य-क्षमता बताता है। एकवचन वितरणात्मक रचना को ‘हर एक ... उसकी अपनी’ से बनाए रखा गया है।
- source_word: ἀπεδήμησεν
  choice: यात्रा पर चला गया
  rationale: क्रिया घर से दूर जाने अथवा यात्रा पर निकलने का भाव रखती है; यह अनिवार्य रूप से किसी दूसरे देश में जाने का दावा नहीं करती।
- source_word: εὐθέως
  choice: तुरंत
  rationale: मुख्य पाठ में इसे यात्रा पर चले जाने से जोड़ा गया है, जो संभव और सहज पाठ है; अगले पद की क्रिया से इसके संभावित संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: दृष्टान्त में τάλαντα का अर्थ
  choice: धन/भार की प्राचीन बड़ी इकाई ‘तोड़ा’
  alternative: बहुत बड़ी धनराशियाँ
  rationale: प्रसंग में सौंपी गई संपत्ति और उसके लेन-देन की बात है; आधुनिक अर्थ वाली जन्मजात ‘प्रतिभा’ समझना मूल आशय को बदल देगा।
- issue: εὐθέως का वाक्यगत संबंध
  choice: मालिक के यात्रा पर चले जाने के साथ
  alternative: अगले पद में पहले सेवक के तुरंत जाकर काम करने के साथ
  rationale: यूनानी शब्द-क्रम दोनों संबंधों की संभावना देता है, और विराम-चिह्न संपादकीय हैं। मुख्य पाठ सहज हिन्दी वाक्य बनाता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता को बनाए रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘तोड़ा’ बाइबलीय ऐतिहासिक पद के रूप में रखा गया है और पादटिप्पणी से स्पष्ट किया गया है। वितरणात्मक एकवचन को प्राकृतिक हिन्दी में सुरक्षित रखा गया है।
