source:
  edition: SBLGNT
  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own servants and entrusted his possessions to them.
translation:
  language: hi
  text: क्योंकि यह एक ऐसे मनुष्य के समान है जो यात्रा पर जा रहा था; उसने अपने दासों[a] को बुलाकर अपनी संपत्ति उन्हें सौंप दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द दोउलोस का अर्थ प्रसंग के अनुसार “दास,” “गुलाम” या “सेवक” हो सकता है। यहाँ स्वामी का अधिकार प्रमुख होने के कारण “दास” रखा गया है।
    reason: शब्द के सामाजिक अर्थ और वैकल्पिक अनुवादों को स्पष्ट करना।
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: क्योंकि यह ... के समान है
  rationale: यूनानी में तुलना संक्षिप्त और वाक्य की दृष्टि से अपूर्ण है; हिन्दी में स्वाभाविक पूर्ण वाक्य के लिए ‘यह’ जोड़ा गया है, जो पिछले प्रसंग की ओर संकेत करता है। ‘क्योंकि’ γὰρ के व्याख्यात्मक संबंध को बनाए रखता है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: दृष्टान्त में एक पुरुष पात्र का उल्लेख है; ‘मनुष्य’ वर्तमान मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀποδημῶν
  choice: यात्रा पर जाते समय
  rationale: यह कृदन्त अपने स्थान से दूर जाने या यात्रा करने का भाव देता है। यह अनुवाद ‘विदेश’ जैसा अनावश्यक भौगोलिक अर्थ नहीं जोड़ता।
- source_word: ἐκάλεσεν
  choice: बुलाया
  rationale: सामान्य और सीधा हिन्दी रूप, जो प्रसंग में स्वामी द्वारा अपने अधीनस्थों को बुलाने के लिए उपयुक्त है।
- source_word: τοὺς ἰδίους δούλους
  choice: अपने दासों
  rationale: ‘अपने’ ἰδίους के स्वामित्व/निज संबंध को व्यक्त करता है। ‘दास’ δοῦλος की बंधी और स्वामी के अधिकार में रहने वाली स्थिति को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: παρέδωκεν
  choice: सौंप दी
  rationale: संपत्ति को उत्तरदायित्व सहित उनके हाथ में देने का भाव व्यक्त करता है; केवल भौतिक रूप से ‘देना’ कहने से अधिक उपयुक्त है।
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: अपनी संपत्ति
  rationale: यह पद उस मनुष्य की वस्तुओं और माल-असबाब को सामूहिक रूप से दर्शाता है; ‘संपत्ति’ संक्षिप्त और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: दृष्टान्त के घरेलू संदर्भ में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक; गुलाम
  rationale: ‘सेवक’ बंधी सामाजिक स्थिति और स्वामी के अधिकार को नरम कर सकता है, जबकि ‘गुलाम’ आधुनिक हिन्दी में अधिक कठोर और कुछ प्रसंगों में शैलीगत रूप से असंगत लगता है। ‘दास’ दोनों पहलुओं को गरिमापूर्ण बाइबलीय हिन्दी में बनाए रखता है; पादटिप्पणी वास्तविक अर्थ-सीमा स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। यूनानी की संक्षिप्त तुलना को हिन्दी में पूर्ण करने के लिए ‘यह’ जोड़ा गया है, पर उसका आशय पिछले प्रसंग से ही ग्रहण किया जाता है।
