lexical_decisions:
- source_word: φρόνιμοι
  choice: समझदार
  rationale: यह शब्द व्यावहारिक बुद्धिमानी और विवेक को दर्शाता है तथा निकट संदर्भ में ‘मूर्ख’ युवतियों के साथ स्वाभाविक विरोध बनाए रखता है। ‘तैयार’ कहना अर्थ की व्याख्या कर देना होता। स्त्रीलिंग कर्ता संदर्भ से स्पष्ट है।
- source_word: ἔλαβον
  choice: ले गईं
  rationale: कथा के प्रसंग में क्रिया का अर्थ अपने साथ ले जाना है; ‘ले गईं’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔλαιον
  choice: तेल
  rationale: मूल शब्द सामान्यतः तेल, प्रायः जैतून का तेल, दर्शाता है। केवल ‘तेल’ कहना मूल की सामान्यता बनाए रखता है।
- source_word: ἀγγείοις
  choice: पात्रों में
  rationale: मूल शब्द किसी सामान्य बरतन या पात्र को दर्शाता है; यह अनुवाद उसके आकार या सामग्री को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: λαμπάδων
  choice: दीपकों
  rationale: शब्द दीपक या मशाल दोनों के लिए प्रयुक्त हो सकता है। मुख्य पाठ में ‘दीपक’ तेल के प्रसंग और हिन्दी बाइबलीय भाषा में स्वाभाविक है; दूसरा सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἑαυτῶν
  choice: अपने
  rationale: निजवाचक सर्वनाम का स्वामित्व-संबंध हिन्दी में ‘अपने’ से स्वाभाविक और स्पष्ट रूप में व्यक्त होता है।
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: अपने दीपकों के साथ
  rationale: सम्बन्धबोधक वाक्यांश साथ होने का भाव देता है—तेल पात्रों में था और दीपकों के अतिरिक्त साथ ले जाया गया था।
