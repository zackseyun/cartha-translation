  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: hi
  text: और डरकर मैं चला गया और मैंने आपका तालन्त[a] ज़मीन में छिपा दिया। देखिए, जो आपका है, वह आपके पास है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: तालन्त बड़ी धनराशि की एक प्राचीन इकाई थी; यहाँ इसका अर्थ जन्मजात योग्यता नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: मैं डर गया
  rationale: यह क्रियाविशेषणात्मक एओरिस्ट कृदंत सेवक के बताए हुए कारण या मनःस्थिति को व्यक्त करता है। ‘मैं डर गया’ स्वाभाविक हिन्दी में भय का अर्थ रखता है और इसे श्रद्धामिश्रित भय नहीं बनाता।
- source_word: ἀπελθὼν
  choice: इसलिए जाकर
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले की क्रिया बताता है। हिन्दी में ‘जाकर ... छिपा दिया’ घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है; ‘इसलिए’ प्रसंग में भय और उसके बाद की कार्रवाई का संबंध स्पष्ट करता है।
- source_word: ἔκρυψα
  choice: छिपा दिया
  rationale: κρύπτω का सीधा अर्थ छिपाना या गुप्त रखना है। ‘ज़मीन में’ से गाड़ने का भाव स्वतः प्रकट होता है, इसलिए क्रिया में अनावश्यक रूप से ‘गाड़ दिया’ नहीं जोड़ा गया।
- source_word: τὸ τάλαντόν σου
  choice: आपका तालन्त
  rationale: τάλαντον बड़ी धनराशि को दर्शाने वाली प्राचीन भार अथवा मौद्रिक इकाई है। ऐतिहासिक शब्द ‘तालन्त’ रखा गया है और आधुनिक पाठक के लिए इसका आर्थिक अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: ἐν τῇ γῇ
  choice: ज़मीन में
  rationale: यहाँ γῆ उस भूमि या मिट्टी को दर्शाता है जिसमें रकम छिपाई गई थी। ‘ज़मीन में’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: ἴδε
  choice: देखिए
  rationale: ἴδε सामने उपस्थित वस्तु की ओर ध्यान खींचने वाला शब्द है। ‘देखिए’ आदरसूचक संबोधन के अनुरूप और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἔχεις τὸ σόν
  choice: जो आपका है, वह आपके पास है
  rationale: यूनानी अभिव्यक्ति में स्वामित्व पर बल है—शाब्दिक भाव ‘आपके पास आपका अपना है।’ चुना गया रूप इस बल और सेवक के इस दावे को बनाए रखता है कि उसने स्वामी की वस्तु लौटा दी है।
theological_decisions:
- issue: दृष्टान्त में τάλαντον का अर्थ
  choice: मुख्य पाठ में ऐतिहासिक मौद्रिक इकाई के रूप में ‘तालन्त’ रखा गया और पाद-टिप्पणी में अर्थ स्पष्ट किया गया।
  alternative: ‘बड़ी धनराशि’ या किसी आधुनिक मुद्रा-मूल्य का प्रयोग
  rationale: मूल शब्द धन या भार की बड़ी इकाई को दर्शाता है, जन्मजात योग्यता को नहीं। ऐतिहासिक शब्द मूल सांस्कृतिक रूपक को बचाता है, जबकि पाद-टिप्पणी गलत आधुनिक अर्थ से बचाती है।
translation_notes:
  register: भाषा आधुनिक, आदरसूचक और सहज रखी गई है। सेवक स्वामी को ‘आप’ कहता है। वाक्य की क्रमिकता—डरना, जाना, छिपाना—मूल के कृदंतों और मुख्य क्रिया के संबंध के अनुसार रखी गई है।
