  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: hi
  text: फिर शैतान उसे एक बहुत ऊँचे पहाड़ पर ले जाता है और उसे संसार के सारे राज्य और उनका वैभव[a] दिखाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी महिमा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: फिर
  rationale: प्रलोभनों के क्रम में पुनरावृत्ति दिखाता है और आधुनिक हिन्दी में सहज है।
- source_word: παραλαμβάνει
  choice: ले जाता है
  rationale: यहाँ गति और साथ ले जाने का भाव स्वाभाविक रूप से व्यक्त होता है; यूनानी ऐतिहासिक वर्तमान को भी वर्तमान काल में रखा गया है।
- source_word: ὁ διάβολος
  choice: शैतान
  rationale: इस प्रसंग में यह परमेश्वर के विरोधी के प्रचलित पदनाम के रूप में है; हिन्दी पाठकों के लिए स्पष्ट और स्वाभाविक है।
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: एक बहुत ऊँचे पहाड़ पर
  rationale: εἰς का गंतव्य-बोध और λίαν का तीव्रताबोध दोनों सुरक्षित रहते हैं।
- source_word: δείκνυσιν
  choice: दिखाता है
  rationale: यूनानी क्रिया का सीधा और अनावश्यक बलवृद्धि से रहित अनुवाद है।
- source_word: πάσας τὰς βασιλείας τοῦ κόσμου
  choice: संसार के सारे राज्य
  rationale: βασιλεία का राजनीतिक-राजकीय अर्थ ‘राज्य’ से और κόσμος का व्यापक अर्थ ‘संसार’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: τὴν δόξαν αὐτῶν
  choice: उनका वैभव
  rationale: इस संदर्भ में δόξα राज्यों की दिखाई देने वाली भव्यता और ऐश्वर्य को सूचित करता है; ‘वैभव’ आधुनिक हिन्दी में इस अर्थ को स्पष्ट रखता है, जबकि ‘महिमा’ को पादटिप्पणी में lexical alternative के रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: प्रलोभन-वृत्तांत में पहाड़ पर दिखाए गए दृश्य का स्वरूप
  choice: घटना को ठीक उसी प्रकार सीधा वर्णित करना जैसा पाठ करता है, बिना यह निर्धारित किए कि दृश्य भौगोलिक, अलौकिक या दर्शनात्मक था।
  alternative: इसे किसी भौतिक पहाड़ से प्रत्यक्ष दृश्य अथवा दर्शनात्मक/अलौकिक प्रकाशन के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ केवल इतना कहता है कि शैतान यीशु को बहुत ऊँचे पहाड़ पर ले गया और संसार के सारे राज्य तथा उनका वैभव दिखाया; अनुवाद को अनिर्दिष्ट बात का निर्णय नहीं करना चाहिए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। कथा के ऐतिहासिक वर्तमान को ‘ले जाता है’ और ‘दिखाता है’ द्वारा बनाए रखा गया है।
