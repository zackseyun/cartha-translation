lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक कथा के प्रवाह को बिना अतिरिक्त कालगत अर्थ जोड़े बनाए रखता है।
- source_word: εἶπεν αὐτῷ
  choice: उसने उससे कहा
  rationale: यूनानी पाठ में केवल सर्वनाम हैं; यह अनुवाद नाम जोड़ने के बजाय उसी संदर्भगत अस्पष्टता को बनाए रखता है।
- source_word: Ταῦτά ... πάντα
  choice: ये सब
  rationale: यह स्वाभाविक आधुनिक हिन्दी में बहुवचन संकेतवाचक और उसकी समग्रता, दोनों को व्यक्त करता है तथा पिछले पद में दिखाए गए राज्यों और उनके वैभव की ओर संकेत करता है।
- source_word: σοι ... δώσω
  choice: तुम्हें दे दूँगा
  rationale: भविष्यकालीन क्रिया एक प्रस्ताव या वचन व्यक्त करती है; हिन्दी में यह क्रम स्वाभाविक है।
- source_word: ἐὰν
  choice: अगर
  rationale: यह शर्त को सरल और प्रचलित आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πεσὼν
  choice: गिरकर
  rationale: यह आराधना के साथ होने वाली ठोस शारीरिक क्रिया को बनाए रखता है, पर मुख्य पाठ में पूर्ण दण्डवत् का अर्थ अनिवार्य नहीं बनाता।
- source_word: προσκυνήσῃς μοι
  choice: मेरी आराधना करो
  rationale: इस परीक्षा के धार्मिक संदर्भ और अगले पद में केवल परमेश्वर की आराधना करने के उत्तर के कारण ‘आराधना’ यहाँ सबसे उपयुक्त है; क्रिया के व्यापक अर्थ पाद-टिप्पणी में दिए गए हैं।
theological_decisions:
- issue: शैतान की माँग में προσκυνέω का अनुवाद
  choice: मेरी आराधना करो
  alternative: मेरे सामने दण्डवत् करो; मुझे सम्मान देने के लिए झुको
  rationale: तत्काल संदर्भ और अगले पद में केवल परमेश्वर की आराधना की विशिष्टता इस माँग को मात्र राजकीय सम्मान से अधिक धार्मिक अर्थ देती है। फिर भी यूनानी क्रिया के व्यापक अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
