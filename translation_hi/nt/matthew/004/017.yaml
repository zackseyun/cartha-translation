id: MAT.4.17
reference: Matthew 4:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: hi
  text: 'उस समय से यीशु ने प्रचार करना आरम्भ किया[a]: “पश्चाताप करो, क्योंकि स्वर्ग का राज्य[b] निकट आ गया है[c]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “प्रचार करना और कहना आरम्भ किया।” यहाँ आगे का उद्धरण प्रचार की विषय-वस्तु बताता है।
    reason: previous_rendering
  - marker: b
    text: यूनानी में “स्वर्गों का राज्य।” मत्ती इस अभिव्यक्ति का नियमित रूप से प्रयोग करता है; अन्य स्थानों पर प्रायः “परमेश्वर का राज्य” मिलता है।
    reason: lexical_alternative
  - marker: c
    text: या “पास आ गया है” अथवा “निकट है।” यूनानी पूर्णकाल इस बात पर बल देता है कि राज्य की निकटता आ चुकी है और बनी हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: उस समय से
  rationale: यह वाक्यांश कथा में एक नए चरण के आरम्भ को सूचित करता है और यूनानी के काल-संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἤρξατο
  choice: आरम्भ किया
  rationale: पूरक क्रिया के साथ ἄρχομαι का सामान्य अर्थ व्यक्त करता है और कथात्मक शैली के अनुकूल है।
- source_word: κηρύσσειν καὶ λέγειν
  choice: प्रचार करना आरम्भ किया
  rationale: हिन्दी में उद्धरण के पहले ‘प्रचार करना आरम्भ किया’ दोनों यूनानी क्रियाओं के आशय को स्वाभाविक ढंग से व्यक्त करता है; ‘और कहना’ को मुख्य पाठ में जोड़ना अनावश्यक रूप से बोझिल होता। शाब्दिक संरचना पादटिप्पणी में दी गई है।
- source_word: Μετανοεῖτε
  choice: पश्चाताप करो
  rationale: यह प्रचलित, स्पष्ट आदेश है, जिसमें केवल दुःख अनुभव करना नहीं, बल्कि मन और जीवन की दिशा बदलना भी निहित है।
- source_word: ἤγγικεν
  choice: निकट आ गया है
  rationale: यूनानी पूर्णकाल उस निकटता को व्यक्त करता है जो आ चुकी है और अब भी प्रभावी है; यह रूप केवल ‘निकट है’ की अपेक्षा उस पक्ष को अधिक स्पष्ट रखता है।
- source_word: βασιλεία
  choice: राज्य
  rationale: यह परिचित हिन्दी समतुल्य है और सन्दर्भ में राजकीय शासन तथा राज्य—दोनों अर्थ-संभावनाओं को खुला रखता है।
- source_word: τῶν οὐρανῶν
  choice: स्वर्ग का
  rationale: यूनानी में ‘स्वर्गों’ बहुवचन है, पर आधुनिक हिन्दी में ‘स्वर्ग का राज्य’ स्वाभाविक और स्थापित अभिव्यक्ति है।
theological_decisions:
- issue: μετανοεῖτε की अर्थ-व्याप्ति
  choice: पश्चाताप करो
  alternative: मन फिराओ; अपना मन और जीवन बदलो
  rationale: ‘पश्चाताप करो’ धार्मिक और नैतिक मोड़ के भार को बनाए रखता है, पर इसे केवल भावनात्मक खेद तक सीमित नहीं माना गया है।
- issue: βασιλεία τῶν οὐρανῶν का अनुवाद
  choice: स्वर्ग का राज्य
  alternative: स्वर्गों का राज्य; स्वर्ग का शासन
  rationale: यह मत्ती की विशिष्ट अभिव्यक्ति को परिचित हिन्दी में सुरक्षित रखता है और इसे केवल स्थान अथवा केवल अमूर्त शासन के अर्थ में सीमित नहीं करता।
- issue: ἤγγικεν के पूर्णकाल का बल
  choice: निकट आ गया है
  alternative: निकट है; पास आ गया है
  rationale: चुना गया रूप उस निकटता को दर्शाता है जो घटित हो चुकी है और बनी हुई है, बिना राज्य के आगमन की प्रकृति को अतिरिक्त धर्मवैज्ञानिक व्याख्या से निर्धारित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी की सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘आरम्भ किया’ औपचारिक किन्तु सामान्य है; ‘प्रचार’ सार्वजनिक घोषणा का भाव देता है। उद्धरण की प्रस्तावना को हिन्दी में सहज बनाने के लिए यूनानी की दो समन्वित क्रियाओं को मुख्य पाठ में संक्षिप्त किया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
