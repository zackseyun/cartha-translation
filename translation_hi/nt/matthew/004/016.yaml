source:
  edition: SBLGNT
  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: hi
  text: अंधकार में बैठे लोगों ने एक बड़ी ज्योति देखी; और जो लोग प्रदेश और मृत्यु की छाया में बैठे थे, उन पर ज्योति उदित हुई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαὸς
  choice: लोगों
  rationale: यह सामूहिक मानव-समुदाय के लिए स्वाभाविक आधुनिक हिन्दी है; ‘जाति’ या ‘राष्ट्र’ अनावश्यक रूप से जातीय अथवा राजनीतिक अर्थ दे सकते हैं।
- source_word: καθήμενος / καθημένοις
  choice: बैठे
  rationale: शाब्दिक बिंब और दोनों उपवाक्यों की समानांतर रचना को बनाए रखता है; ‘रहने वाले’ अधिक मुहावरेदार हो सकता था, पर मूल का सजीव चित्र कम कर देता।
- source_word: σκοτίᾳ
  choice: अंधकार
  rationale: यह शब्द के प्रत्यक्ष और रूपक—दोनों अर्थों को खुला रखता है और अंधकार को केवल पाप, अज्ञान या संकट के रूप में परिभाषित नहीं करता।
- source_word: φῶς εἶδεν μέγα
  choice: एक बड़ी ज्योति देखी
  rationale: यूनानी के साधारण भूतकाल और प्रकाश की असाधारण अभिव्यक्ति को स्वाभाविक हिन्दी में व्यक्त करता है। ‘ज्योति’ भविष्यवाणी-संबंधी काव्यात्मक गरिमा बनाए रखती है।
- source_word: χώρᾳ
  choice: प्रदेश
  rationale: भौगोलिक विस्तार का अर्थ देता है, बिना किसी आधुनिक राष्ट्र-राज्य का संकेत किए।
- source_word: σκιᾷ θανάτου
  choice: मृत्यु की छाया
  rationale: यूनानी में ‘मृत्यु’ स्पष्ट रूप से उपस्थित है; इसलिए परिचित बाइबलीय बिंब को बनाए रखा गया है, न कि उसे केवल ‘घोर अंधकार’ बना दिया गया।
- source_word: ἀνέτειλεν
  choice: उदित हुई
  rationale: प्रकाश के उगने या प्रकट होने का बिंब स्वाभाविक और गरिमापूर्ण हिन्दी में सुरक्षित रहता है।
- source_word: αὐτοῖς
  choice: उन पर
  rationale: ‘ज्योति उदित हुई’ के साथ हिन्दी में स्वाभाविक है और जिन लोगों तक प्रकाश पहुँचा, उन्हें स्पष्ट रखता है।
theological_decisions:
- issue: अंधकार और ज्योति के बिंब का स्वरूप
  choice: बिंबों को बिना संकीर्ण व्याख्या के बनाए रखा गया है।
  alternative: अंधकार को स्पष्टतः पाप, गैर-यहूदी अज्ञान या राजनीतिक संकट कहना; अथवा ज्योति को अनुवाद में ही मसीहा का उद्धारकारी प्रकाश कहना।
  rationale: यशायाह की प्रतिध्वनि से इन बिंबों में समृद्ध धर्मवैज्ञानिक अर्थ है, पर इस वाक्य में यूनानी पाठ उनका केवल एक अर्थ निश्चित नहीं करता। इसलिए अनुवाद मूल की अर्थ-व्याप्ति और तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बैठे’, ‘ज्योति’ और ‘उदित हुई’ भविष्यवाणी के काव्यात्मक बिंब तथा समानांतरता को सुरक्षित रखते हैं; वाक्य में ऐसी व्याख्या नहीं जोड़ी गई जो अंधकार या ज्योति का धर्मवैज्ञानिक अर्थ पहले से तय कर दे।
