  rationale: The revision replaces the causative and overly specific “पकड़वा दिया गया है” with “सौंप दिया गया था,” which preserves the passive voice and semantic breadth of παραδίδωμι, while the footnote retains “arrested” as the contextual alternative. Past tense aligns the temporal participle and main aorist in the narrative. “गलील को” better reflects εἰς as directional movement.
