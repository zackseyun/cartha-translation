    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: जब यीशु ने सुना
  rationale: यह अओरिस्ट कृदन्त मुख्य क्रिया से पहले की परिस्थिति बताता है। हिन्दी में विषय को स्पष्ट करने के लिए संदर्भानुसार ‘यीशु’ जोड़ा गया है।
- source_word: δὲ
  choice: तो
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है, प्रबल विरोध नहीं। हिन्दी की ‘जब…तो’ रचना घटनाओं का स्वाभाविक संबंध व्यक्त करती है।
- source_word: Ἰωάννης
  choice: यूहन्ना
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और सहज नाम-रूप।
- source_word: παρεδόθη
  choice: पकड़वा दिया गया है
  rationale: परमेश्वर-कर्मक नहीं, बल्कि παραδίδωμι का कर्मवाच्य रूप है। ‘पकड़वा दिया’ किसी के अधिकार में सौंपे जाने और प्रसंगगत गिरफ्तारी—दोनों को संकेत करता है; पूर्णता का भाव ‘गया है’ से व्यक्त होता है।
- source_word: ἀνεχώρησεν
  choice: चले गए
  rationale: ἀναχωρέω यहाँ परिस्थितियों के प्रत्युत्तर में वहाँ से निकलकर दूसरी जगह जाने को दर्शाता है। ‘चले गए’ आधुनिक हिन्दी में स्वाभाविक है और ‘पीछे हटे’ जैसी अनावश्यक भय अथवा सैन्य वापसी की छाया से बचता है।
- source_word: εἰς τὴν Γαλιλαίαν
  choice: गलील प्रदेश में
  rationale: εἰς की दिशात्मकता ‘में’ से व्यक्त होती है; ‘प्रदेश’ जोड़ने से आधुनिक पाठक स्पष्ट समझता है कि गलील एक क्षेत्र है।
theological_decisions:
- issue: यूहन्ना के संबंध में παραδίδωμι का अनुवाद
  choice: पकड़वा दिया गया है
  alternative: गिरफ़्तार कर लिया गया है
  rationale: मूल क्रिया केवल तकनीकी गिरफ्तारी से व्यापक है और किसी के अधिकार में सौंपे जाने का भाव रखती है। मुख्य पाठ उस व्यापकता को यथासंभव बनाए रखता है, जबकि प्रसंग में अधिक विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। आदरसूचक बहुवचन क्रिया-रूप यीशु के लिए सामान्य हिन्दी प्रयोग के अनुसार रखा गया है।
