review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Jesus as the understood subject and naturally represents the temporal participle. However, “पकड़वा दिया गया है” means “was made to be arrested” and thus introduces an agent-causing-arrest sense not expressed by the passive παρεδόθη. It also narrows the verb’s broader sense of being handed over. The perfect-style “गया है” is less suitable than past “था” in this past narrative context.
  naturalness: The proposed revision is idiomatic modern standard Hindi. “गलील को चले गए” clearly conveys movement toward Galilee, while retaining a natural narrative style and the conventional respectful plural verb for Jesus.
  terminology: “यूहन्ना को सौंप दिया गया था” preserves the passive and lexical breadth of παραδίδωμι without asserting a particular mechanism. The footnote supplies the contextually specific alternative, “गिरफ़्तार कर लिया गया था.” Names and register are appropriate.
  issues:
  - severity: high
    issue: “पकड़वा दिया गया है” inaccurately renders παρεδόθη.
    rationale: “पकड़वाना” normally means causing someone to be caught/arrested, whereas παραδίδωμι is passive “was handed over/delivered up.” It both adds causative force and narrows the source term. The present-result construction “गया है” also does not fit the past narrative sequence as well as “था.”
  - severity: low
    issue: “गलील प्रदेश में चले गए” weakens the directional force of εἰς.
    rationale: Although understandable, “में” primarily locates the action within Galilee. “गलील को चले गए” more directly expresses movement to the region without needing the explanatory noun “प्रदेश.”
  revised_text: जब यीशु ने सुना कि यूहन्ना को सौंप दिया गया था[a], तो वह गलील को चले गए।
  revised_footnotes:
  - marker: a
    text: या, इस प्रसंग में अधिक स्पष्ट रूप से, “गिरफ़्तार कर लिया गया था।”
    reason: lexical_alternative
  revision_rationale: The revision replaces the causative and overly specific “पकड़वा दिया गया है” with “सौंप दिया गया था,” which preserves the passive voice and semantic breadth of παραδίδωμι, while the footnote retains “arrested” as the contextual alternative. Past tense aligns the temporal participle and main aorist in the narrative. “गलील को” better reflects εἰς as directional movement.
