  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: hi
  text: और वह उनसे कहता है, “मेरे पीछे आओ, और मैं तुम्हें मनुष्यों के मछुए बनाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: कहता है
  rationale: यूनानी के ऐतिहासिक वर्तमान को बनाए रखा गया है; सुसमाचार की कथा में यह शैलीगत रूप से स्वाभाविक है।
- source_word: Δεῦτε ὀπίσω μου
  choice: मेरे पीछे आओ
  rationale: यह सहज हिन्दी में बुलावे और पीछे चलने—दोनों भावों को व्यक्त करता है तथा शिष्यत्व के चित्र को बनाए रखता है।
- source_word: ποιήσω
  choice: मैं ... बनाऊँगा
  rationale: भविष्यकाल यीशु द्वारा किए जानेवाले परिवर्तन की प्रतिज्ञा को सीधे व्यक्त करता है।
- source_word: ἁλιεῖς ἀνθρώπων
  choice: मनुष्यों के मछुए
  rationale: मूल के मछली पकड़नेवाले रूपक और संबंधवाचक रचना को बनाए रखता है। हिन्दी में ‘मनुष्य’ सामान्य रूप से समस्त मानवजाति को दर्शाता है।
theological_decisions:
- issue: ἁλιεῖς ἀνθρώπων में मनुष्यों को पकड़ने का रूपक
  choice: मनुष्यों के मछुए
  alternative: लोगों को पकड़नेवाले
  rationale: मुख्य पाठ मूल के संक्षिप्त और प्रभावशाली रूपक को सुरक्षित रखता है; अधिक व्याख्यात्मक विकल्प अनावश्यक रूप से ‘पकड़ने’ की क्रिया जोड़ देता है।
- issue: ἀνθρώπων का व्यापक मानवीय अर्थ
  choice: मनुष्यों
  alternative: लोगों
  rationale: ‘मनुष्यों’ मूल शब्द के सामान्य मानवीय अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और केवल पुरुषों तक सीमित नहीं है; इसलिए अलग स्पष्टीकरण की आवश्यकता नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। ‘मेरे पीछे आओ’ हिन्दी में स्वाभाविक शिष्यत्व-संबंधी बुलावा है, जबकि ‘मनुष्यों के मछुए’ मूल रूपक की संक्षिप्तता बनाए रखता है।
