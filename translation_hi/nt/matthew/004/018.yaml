  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: hi
  text: जब वह गलील की झील के किनारे-किनारे चल रहा था, तो उसने दो भाइयों—शमौन, जो पतरस कहलाता था, और उसके भाई अन्द्रियास—को देखा। वे झील में एक जाल[a] फेंक रहे थे, क्योंकि वे मछुआरे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द ऐसे जाल के लिए है जिसे मछली पकड़ने के लिए पानी में फेंककर फैलाया जाता था।
    reason: lexical_clarification
lexical_decisions:
- source_word: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: जब वह गलील की झील के किनारे चल रहा था
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ चल रही क्रिया बताता है। παρά के साथ कर्मकारक यहाँ किनारे के साथ-साथ चलने का भाव देता है। आधुनिक हिन्दी में भौगोलिक रूप से स्वाभाविक ‘गलील की झील’ चुना गया, जबकि यूनानी θάλασσα का शाब्दिक अर्थ ‘समुद्र’ भी हो सकता है।
- source_word: εἶδεν δύο ἀδελφούς
  choice: उसने दो भाइयों को देखा
  rationale: सरल कथात्मक भूतकाल और वास्तविक पुरुष सहोदरों का सीधा, स्वाभाविक अनुवाद।
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: शमौन, जो पतरस कहलाता है
  rationale: λεγόμενον को सम्बन्धवाचक उपवाक्य से व्यक्त किया गया है; नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं।
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: उसके भाई अन्द्रियास को
  rationale: सम्बन्धसूचक समानाधिकरण को सहज हिन्दी में व्यक्त किया गया है और αὐτοῦ का निकटतम स्वाभाविक पूर्वपद शमौन रखा गया है।
- source_word: βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν
  choice: वे झील में फेंकने वाला जाल डाल रहे थे
  rationale: ἀμφίβληστρον सामान्य जाल नहीं बल्कि फेंककर फैलाया जाने वाला मछली पकड़ने का जाल है। मुख्य पाठ में उसकी विशिष्टता स्पष्ट रखी गई और ongoing action को ‘डाल रहे थे’ से व्यक्त किया गया।
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: क्योंकि वे मछुआरे थे
  rationale: γάρ का व्याख्यात्मक कारण आधुनिक हिन्दी में ‘क्योंकि’ से स्पष्ट और स्वाभाविक ढंग से व्यक्त होता है; ἁλιεῖς यहाँ पुरुष मछुआरों को बताता है।
