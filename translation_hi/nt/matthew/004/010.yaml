id: MAT.4.10
reference: Matthew 4:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: hi
  text: 'तब यीशु उससे कहते हैं, “दूर हो जा, शैतान! क्योंकि लिखा है: ‘तू अपने प्रभु परमेश्वर की आराधना कर[a] और केवल उसी की सेवा कर[b]।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने प्रभु परमेश्वर को दण्डवत कर।” यूनानी क्रिया का अधिक शाब्दिक अर्थ श्रद्धा से झुकना या दण्डवत करना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “सेवा” के लिए प्रयुक्त क्रिया विशेष रूप से परमेश्वर को अर्पित धार्मिक या पवित्र सेवा का बोध करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कथा के घटनाक्रम में अगले चरण को स्वाभाविक और संक्षिप्त रूप से दर्शाता है।
- source_word: λέγει
  choice: कहते हैं
  rationale: यूनानी ऐतिहासिक वर्तमान की सजीवता बनाए रखने के लिए हिन्दी वर्तमान काल रखा गया है।
- source_word: Ὕπαγε
  choice: दूर हो जा
  rationale: आज्ञार्थक क्रिया यहाँ कड़े रूप में चले जाने का आदेश देती है; यह आधुनिक हिन्दी में स्पष्ट और प्रभावशाली है।
- source_word: Σατανᾶ
  choice: शैतान
  rationale: सम्बोधन में प्रयुक्त इस नाम/उपाधि का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: γέγραπται
  choice: लिखा है
  rationale: पवित्रशास्त्र का उद्धरण प्रस्तुत करने वाले यूनानी पूर्ण निष्क्रिय सूत्र का स्वाभाविक हिन्दी रूप।
- source_word: Κύριον τὸν θεόν σου
  choice: अपने प्रभु परमेश्वर
  rationale: ‘प्रभु’ और ‘तेरा परमेश्वर’ के संयुक्त सन्दर्भ को सहज हिन्दी में सुरक्षित रखता है।
- source_word: προσκυνήσεις
  choice: आराधना कर
  rationale: परमेश्वर के प्रति श्रद्धापूर्ण दण्डवत और उपासना के धार्मिक अर्थ को सन्दर्भानुकूल रूप से व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में है।
- source_word: αὐτῷ μόνῳ
  choice: केवल उसी की
  rationale: ‘केवल’ को उसी व्यक्ति पर केन्द्रित रखता है, जिससे अनन्यता का यूनानी बल सुरक्षित रहता है।
- source_word: λατρεύσεις
  choice: सेवा कर
  rationale: प्रथम क्रिया ‘आराधना’ से भेद बनाए रखते हुए परमेश्वर को दी जाने वाली समर्पित, धार्मिक सेवा को व्यक्त करता है।
theological_decisions:
- issue: προσκυνέω और λατρεύω की अलग-अलग अभिव्यक्ति
  choice: προσκυνήσεις के लिए ‘आराधना कर’ और λατρεύσεις के लिए ‘सेवा कर’
  alternative: पहली क्रिया को ‘दण्डवत कर’ कहना, अथवा दोनों को आराधना-संबंधी एक ही शब्द से व्यक्त करना
  rationale: यूनानी में दोनों क्रियाएँ सम्बन्धित होते हुए भी भिन्न हैं। अलग हिन्दी शब्द परमेश्वर के लिए आराधना और अनन्य धार्मिक सेवा—दोनों को बनाए रखते हैं, बिना उनके अर्थों को एक कर देने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यीशु के कथन में यूनानी ऐतिहासिक वर्तमान की सजीवता हेतु ‘कहते हैं’ रखा गया है; उद्धरण में एकवचन अनौपचारिक ‘तू’ मूल के दूसरे पुरुष एकवचन और पारंपरिक शास्त्रीय सम्बोधन को स्पष्ट करता है।
