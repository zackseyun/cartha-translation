  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: hi
  text: तब शैतान उसे छोड़कर चला गया, और देखो, स्वर्गदूत उसके पास आए और उसकी सेवा करते रहे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी सेवा की।” यूनानी क्रिया का रूप इस सेवा को चल रही गतिविधि के रूप में प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह समय और घटनाक्रम की अगली कड़ी को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀφίησιν αὐτὸν
  choice: उसे छोड़कर चला गया
  rationale: यूनानी ऐतिहासिक वर्तमान को सहज हिन्दी कथा-शैली में भूतकाल से व्यक्त किया गया है; प्रसंग में क्रिया का अर्थ यीशु के पास से चले जाना है।
- source_word: ὁ διάβολος
  choice: शैतान
  rationale: यहाँ शब्द परीक्षा-वृत्तांत में एक व्यक्तिगत पदनाम के रूप में प्रयुक्त है; ‘शैतान’ आधुनिक हिन्दी में स्पष्ट और प्रचलित है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने और दृश्य में आए अचानक परिवर्तन को उभारने वाला कथात्मक संकेत है।
- source_word: ἄγγελοι
  choice: स्वर्गदूत
  rationale: प्रसंग में मनुष्य-संदेशवाहक नहीं, परमेश्वर की ओर से आए स्वर्गीय प्राणी अभिप्रेत हैं।
- source_word: προσῆλθον
  choice: उसके पास आए
  rationale: यह क्रिया निकट आने का भाव रखती है, जिसे हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: διηκόνουν αὐτῷ
  choice: उसकी सेवा करते रहे
  rationale: अपूर्ण भूतकाल क्रिया सेवा को चल रही गतिविधि के रूप में प्रस्तुत करती है; ‘करते रहे’ उस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: διάβολος का व्यक्तिगत पदनाम के रूप में अनुवाद
  choice: शैतान
  alternative: निंदक
  rationale: यद्यपि शब्द का मूल अर्थ ‘निंदक’ हो सकता है, इस प्रसंग में यह परीक्षा लेने वाले व्यक्ति का जाना-पहचाना पदनाम है। ‘शैतान’ संदर्भ को स्पष्ट रखता है और कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
- issue: स्वर्गदूतों की सेवा की अवधि
  choice: सेवा करते रहे
  alternative: सेवा की
  rationale: यूनानी अपूर्ण भूतकाल सेवा को जारी गतिविधि के रूप में दिखाता है; अनुवाद उसी कथात्मक पक्ष को व्यक्त करता है, जबकि सरल भूतकाल भी अर्थ की एक सम्भव हिन्दी अभिव्यक्ति है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘और देखो’ मूल के ध्यानाकर्षक कथात्मक संकेत को बनाए रखता है; ‘सेवा करते रहे’ स्वाभाविक हिन्दी में अपूर्ण भूतकाल का प्रवाह व्यक्त करता है।
