id: MAT.4.25
reference: Matthew 4:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: hi
  text: और गलील, दिकापुलिस, यरूशलेम, यहूदिया और यरदन के पार से[a] लोगों की बड़ी-बड़ी भीड़ें उसके पीछे हो लीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरदन के उस पार से।”
    reason: πέραν τοῦ Ἰορδάνου के स्थानिक अर्थ को हिन्दी में व्यक्त करने का वैकल्पिक रूप।
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: उसके पीछे हो लीं
  rationale: यह कथात्मक प्रसंग में शारीरिक रूप से पीछे चलने का स्वाभाविक हिन्दी रूप है और शिष्यत्व की पूर्ण प्रतिबद्धता को अनावश्यक रूप से नहीं थोपता।
- source_word: ὄχλοι πολλοὶ
  choice: लोगों की बड़ी-बड़ी भीड़ें
  rationale: यह बहुवचन ὄχλοι और बड़ी संख्या दर्शाने वाले πολλοί—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ
  choice: से
  rationale: यह स्रोत या आरंभ-स्थान बताने वाले यूनानी पूर्वसर्ग का सामान्य हिन्दी समतुल्य है और पूरी भौगोलिक सूची पर लागू होता है।
- source_word: Γαλιλαίας
  choice: गलील
  rationale: इस क्षेत्र का प्रचलित हिन्दी बाइबलीय नाम।
- source_word: Δεκαπόλεως
  choice: दिकापुलिस
  rationale: दस नगरों से जुड़े प्रसिद्ध क्षेत्र का प्रचलित लिप्यंतरण; इसे सामान्य संज्ञा में बदलने के बजाय स्थान-नाम के रूप में रखा गया है।
- source_word: Ἱεροσολύμων
  choice: यरूशलेम
  rationale: नगर के नाम का प्रचलित हिन्दी रूप।
- source_word: Ἰουδαίας
  choice: यहूदिया
  rationale: क्षेत्र के नाम का प्रचलित हिन्दी रूप।
- source_word: πέραν τοῦ Ἰορδάνου
  choice: यरदन के पार से
  rationale: यह यरदन नदी के दूसरी ओर के क्षेत्र का स्थानिक अर्थ बनाए रखता है और आरंभ में आए ἀπό के आशय को हिन्दी में स्पष्ट करता है।
- source_word: καὶ ... καὶ ... καὶ
  choice: और ... और ... और
  rationale: दोहराए गए संयोजक भौगोलिक विस्तार के संचयी प्रभाव को बनाए रखते हैं।
