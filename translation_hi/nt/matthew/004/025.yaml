  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “लोगों की बड़ी-बड़ी भीड़ें” यूनानी बहुवचन को बनाए रखते हुए साधारण पाठक के लिए स्पष्ट है; स्थान-नाम प्रचलित हिन्दी बाइबलीय रूपों में दिए गए हैं।
