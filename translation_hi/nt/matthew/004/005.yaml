id: MAT.4.5
reference: Matthew 4:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: hi
  text: तब शैतान उसे पवित्र नगर[a] में ले जाता है और उसे मंदिर के शिखर[b] पर खड़ा कर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् यरूशलेम।
    reason: cross_reference
  - marker: b
    text: या ‘मंदिर का निकला हुआ किनारा’; यूनानी शब्द मंदिर-परिसर के किसी बाहर निकले किनारे या सबसे ऊँचे स्थान को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह कथानक में अगली घटना को क्रम से जोड़ने वाला स्वाभाविक कालवाचक शब्द है।
- source_word: παραλαμβάνει
  choice: ले जाता है
  rationale: ऐतिहासिक वर्तमान की सजीवता बनाए रखता है और गंतव्य के साथ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὁ διάβολος
  choice: शैतान
  rationale: यहाँ शब्द व्यक्तिगत दुष्ट सत्ता की उपाधि के रूप में है; हिन्दी बाइबलीय प्रयोग में ‘शैतान’ सहज और स्पष्ट है।
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: पवित्र नगर में
  rationale: यूनानी पदबंध की सम्मानसूचक अभिव्यक्ति को बनाए रखते हुए गमन का भाव व्यक्त करता है; नगर की पहचान पादटिप्पणी में दी गई है।
- source_word: ἔστησεν
  choice: खड़ा कर देता है
  rationale: यह सकर्मक/कारक अर्थ को स्पष्ट करता है कि शैतान ने यीशु को उस स्थान पर खड़ा किया; ऐतिहासिक वर्तमान के अनुरूप हिन्दी वर्तमान रखा गया है।
- source_word: ἐπὶ τὸ πτερύγιον
  choice: शिखर पर
  rationale: πτερύγιον किसी निकले हुए किनारे, ‘पंख’ या ऊँचे बिंदु को सूचित कर सकता है; ‘शिखर’ पठनीय पारंपरिक अर्थ देता है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: τοῦ ἱεροῦ
  choice: मंदिर के
  rationale: ἱερόν पूरे मंदिर-परिसर को सूचित कर सकता है; मुख्य पाठ में ‘मंदिर’ स्वाभाविक है और व्यापक अर्थ पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: ‘पवित्र नगर’ की पहचान
  choice: मुख्य पाठ में ‘पवित्र नगर’ रखा गया है।
  alternative: मुख्य पाठ में ‘यरूशलेम’ लिखना।
  rationale: मूल पाठ उचित नाम के स्थान पर सम्मानसूचक पदबंध प्रयोग करता है। उसे बनाए रखने से पाठ की अभिव्यक्ति सुरक्षित रहती है और पहचान पादटिप्पणी में स्पष्ट हो जाती है।
- issue: πτερύγιον τοῦ ἱεροῦ का स्थापत्य-संदर्भ
  choice: ‘मंदिर का शिखर’
  alternative: ‘मंदिर का निकला हुआ किनारा’ या ‘मंदिर-परिसर का सबसे ऊँचा स्थान’
  rationale: ठीक स्थापत्य स्थान अनिश्चित है। पठनीय पारंपरिक अनुवाद मुख्य पाठ में रखा गया है, पर वैकल्पिक अर्थ पादटिप्पणी में देकर अस्पष्टता को नहीं मिटाया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यूनानी ऐतिहासिक वर्तमान की कथात्मक सजीवता के लिए ‘ले जाता है’ और ‘खड़ा कर देता है’ प्रयुक्त हैं।
