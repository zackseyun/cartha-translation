id: MAT.4.13
reference: Matthew 4:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: hi
  text: और नाज़ारा[a] को छोड़कर वह आया और समुद्र के किनारे कफ़रनहूम में बस गया, जो ज़बूलून और नप्ताली के क्षेत्र में था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘नाज़ारा’; अनेक अनुवादों में ‘नाज़रत’।
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: को छोड़कर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले नाज़ारा से प्रस्थान को व्यक्त करता है; ‘छोड़कर’ स्वाभाविक हिन्दी में यह क्रम बनाए रखता है।
- source_word: Ναζαρὰ
  choice: नाज़ारा
  rationale: मूल यूनानी में यहाँ Ναζαρά रूप है, इसलिए पाठ में उसी का लिप्यंतरण रखा गया है; परिचित ‘नाज़रत’ को पादटिप्पणी में दिया गया है।
- source_word: ἐλθὼν
  choice: वह आया
  rationale: अओरिस्ट कृदंत को हिन्दी में समापिका क्रिया के रूप में प्रस्तुत करने से घटनाक्रम स्पष्ट और स्वाभाविक रहता है।
- source_word: κατῴκησεν
  choice: बस गया
  rationale: यहाँ κατοικέω निवास स्थापित करने का भाव देता है; ‘बस गया’ केवल रहने की अपेक्षा इस अर्थ को बेहतर व्यक्त करता है।
- source_word: Καφαρναοὺμ
  choice: कफ़रनहूम
  rationale: स्थान-नाम का हिन्दी बाइबलीय परंपरा में प्रचलित और मूल के निकट रूप।
- source_word: τὴν παραθαλασσίαν
  choice: समुद्र के किनारे
  rationale: यह विशेषण कफ़रनहूम को समुद्र के पास स्थित नगर के रूप में बताता है; हिन्दी में यह सहज भौगोलिक अभिव्यक्ति है।
- source_word: ἐν ὁρίοις
  choice: के क्षेत्र में
  rationale: बहुवचन ὅρια यहाँ सीमाओं से घिरे भूभाग अथवा इलाके को सूचित करता है; ‘क्षेत्र’ अस्पष्टता को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: Ζαβουλὼν
  choice: ज़बूलून
  rationale: जनजातीय और भौगोलिक नाम का हिन्दी में स्पष्ट लिप्यंतरण।
- source_word: Νεφθαλίμ
  choice: नप्ताली
  rationale: जनजातीय और भौगोलिक नाम का हिन्दी में प्रचलित रूप।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। कृदंतों का घटनाक्रम स्वाभाविक हिन्दी क्रियाओं से व्यक्त किया गया है। ‘जो ... था’ जोड़कर समुद्र-किनारे स्थित कफ़रनहूम और ज़बूलून-नप्ताली के क्षेत्र के बीच संबंध स्पष्ट किया गया है, बिना भौगोलिक अर्थ बदले।
