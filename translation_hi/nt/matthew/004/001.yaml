source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: hi
  text: तब यीशु आत्मा के द्वारा निर्जन प्रदेश में ले जाए गए, ताकि शैतान उन्हें प्रलोभित करे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी परीक्षा ले।” यूनानी क्रिया का अर्थ “परीक्षा लेना/परखना” या “प्रलोभन देना” हो सकता है; यहाँ शैतान और आगे के प्रसंग के कारण प्रलोभन का भाव प्रमुख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह अगले घटनाक्रम को पिछले प्रसंग से जोड़ने वाला स्वाभाविक कालसूचक शब्द है।
- source_word: ἀνήχθη
  choice: ले जाए गए
  rationale: कर्मवाच्य को सुरक्षित रखता है। यूनानी क्रिया में ऊपर की ओर ले जाने की छाया हो सकती है, पर हिंदी में ‘ऊपर ले जाए गए’ यहाँ अनावश्यक रूप से भौगोलिक अर्थ उभारता।
- source_word: εἰς τὴν ἔρημον
  choice: निर्जन प्रदेश में
  rationale: ἔρημος किसी वीरान, निर्जन या जंगल-सदृश क्षेत्र को सूचित कर सकता है; यह चयन किसी विशेष भू-आकृति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ὑπὸ τοῦ πνεύματος
  choice: आत्मा के द्वारा
  rationale: पिछले बपतिस्मा-प्रसंग के आधार पर परमेश्वर के आत्मा का संदर्भ स्पष्ट है; मूल की तरह ‘पवित्र’ शब्द जोड़े बिना सम्मानसूचक रूप रखा गया है।
- source_word: πειρασθῆναι
  choice: परीक्षा ले
  rationale: πειράζω में ‘परखना’ और ‘प्रलोभन देना’ दोनों अर्थ संभव हैं। ‘परीक्षा लेना’ यह व्यापकता बनाए रखता है, जबकि कर्ता शैतान होने से प्रलोभन का भाव संदर्भ में उपस्थित रहता है।
- source_word: ὑπὸ τοῦ διαβόλου
  choice: शैतान
  rationale: διάβολος यहाँ व्यक्तिगत विरोधी की उपाधि है। आधुनिक हिंदी में ‘शैतान’ सबसे स्पष्ट और स्वाभाविक समतुल्य है।
theological_decisions:
- issue: τοῦ πνεύματος की पहचान
  choice: ‘आत्मा’ से परमेश्वर का आत्मा अभिप्रेत है
  alternative: कोई आत्मा अथवा यीशु की मानवीय आत्मा
  rationale: तुरंत पहले के बपतिस्मा-वृत्तांत में आत्मा के यीशु पर उतरने के कारण यही संदर्भ सबसे स्वाभाविक है; फिर भी मूल में न आए ‘पवित्र’ शब्द को मुख्य पाठ में नहीं जोड़ा गया।
- issue: πειρασθῆναι का अर्थ
  choice: मुख्य पाठ में ‘परीक्षा ले’
  alternative: ‘प्रलोभन दे’ अथवा ‘परखे’
  rationale: यूनानी क्रिया की परीक्षा/प्रलोभन संबंधी अर्थगत व्यापकता को बनाए रखा गया है। शैतान के कर्ता होने और आगे के वृत्तांत से दुष्प्रेरणा का भाव स्पष्ट है; पादटिप्पणी इसे प्रत्यक्ष करती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। वाक्य में कर्मवाच्य और उद्देश्यसूचक रचना सुरक्षित रखी गई है। ‘निर्जन प्रदेश’ ἔρημος की भौगोलिक अस्पष्टता को बनाए रखता है।
