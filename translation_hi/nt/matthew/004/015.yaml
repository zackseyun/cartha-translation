id: MAT.4.15
reference: Matthew 4:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: hi
  text: 'ज़बूलून की भूमि और नप्ताली की भूमि,

    समुद्र का मार्ग, यरदन के पार,

    अन्यजातियों का गलील[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राष्ट्रों का गलील।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γῆ / γῆ
  choice: भूमि
  rationale: भौगोलिक क्षेत्र का अर्थ व्यक्त करता है और दोनों आवृत्तियों में यूनानी की समानांतर पुनरावृत्ति बनाए रखता है।
- source_word: Ζαβουλὼν
  choice: ज़बूलून
  rationale: इस गोत्र और क्षेत्र के नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: Νεφθαλίμ
  choice: नप्ताली
  rationale: इस गोत्र और क्षेत्र के नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: ὁδὸν θαλάσσης
  choice: समुद्र का मार्ग
  rationale: यशायाह के उद्धरण की औपचारिक अभिव्यक्ति और उसकी संभावित अस्पष्टता को बनाए रखता है—यह किसी प्रसिद्ध मार्ग अथवा समुद्र से संबद्ध क्षेत्र की ओर संकेत कर सकता है।
- source_word: πέραν τοῦ Ἰορδάνου
  choice: यरदन के पार
  rationale: भौगोलिक मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है, पर दृष्टिकोण को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: Γαλιλαία
  choice: गलील
  rationale: क्षेत्र के नाम का मानक हिन्दी बाइबलीय रूप।
- source_word: τῶν ἐθνῶν
  choice: अन्यजातियों का
  rationale: मत्ती के यहूदी संदर्भ में गैर-यहूदी लोगों के साथ गलील के संबंध को स्पष्ट करता है; शाब्दिक विकल्प ‘राष्ट्रों का’ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: यशायाह के उद्धरण में ἐθνῶν का अनुवाद
  choice: अन्यजातियों
  alternative: राष्ट्रों
  rationale: संदर्भ में यह शब्द मुख्यतः गैर-यहूदियों की ओर संकेत करता है और मूल श्रोताओं द्वारा समझे जाने वाले जातीय-धार्मिक भेद को व्यक्त करता है। फिर भी ‘राष्ट्रों’ एक वास्तविक शाब्दिक संभावना है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक उद्धरण का समानांतर विन्यास और अंतिम डैश बनाए रखा गया है। पादटिप्पणी-चिह्न उस पदबंध के बाद रखा गया है जिससे उसका वास्तविक संबंध है।
