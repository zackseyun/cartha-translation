id: MAT.4.3
reference: Matthew 4:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: hi
  text: और परीक्षा लेनेवाला उसके पास आया और उससे कहा, “यदि तुम परमेश्वर के पुत्र हो,[a] तो कहो कि ये पत्थर रोटियाँ[b] बन जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चूँकि तुम परमेश्वर के पुत्र हो।” यूनानी शर्त साधारण संदेह व्यक्त करने के बजाय चुनौती के रूप में भी प्रयुक्त हो सकती है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में “रोटियाँ” बहुवचन में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: उसके पास आया
  rationale: यह क्रिया यीशु की ओर बढ़कर निकट आने को व्यक्त करती है; ‘उसके पास आया’ आधुनिक हिन्दी में स्वाभाविक ढंग से गति और निकटता दोनों बताता है।
- source_word: ὁ πειράζων
  choice: परीक्षा लेनेवाला
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त उस व्यक्ति को दिखाता है जो यीशु की परीक्षा ले रहा था। यह चयन यूनानी शब्द में निहित ‘परखने/लुभाने’ की अर्थ-सीमा को अत्यधिक व्याख्यायित किए बिना बनाए रखता है।
- source_word: εἶπεν αὐτῷ
  choice: उससे कहा
  rationale: यह λέγω और अप्रत्यक्ष कर्म का स्वाभाविक तथा निकट हिन्दी रूप है।
- source_word: Εἰ
  choice: यदि
  rationale: ‘यदि’ यूनानी शर्त की संरचना को बनाए रखता है और यह तय नहीं करता कि कथन संदेह, चुनौती या मानी हुई बात व्यक्त करता है।
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: परमेश्वर के पुत्र
  rationale: यह मत्ती के प्रसंग में यीशु की विशिष्ट उपाधि है। हिन्दी संबंध-रचना में ‘परमेश्वर के पुत्र’ स्वाभाविक और निश्चित अर्थ रखता है।
- source_word: εἰπὲ ἵνα
  choice: तो कहो कि
  rationale: आज्ञार्थक λέγω के बाद ἵνα कथन के अपेक्षित परिणाम को प्रस्तुत करता है। ‘कहो कि’ मूल की वाणी-केंद्रित अभिव्यक्ति को रखता है और ‘आज्ञा दो’ जैसा अधिक प्रबल अर्थ नहीं जोड़ता।
- source_word: οἱ λίθοι οὗτοι
  choice: ये पत्थर
  rationale: यह संज्ञा और संकेतवाचक विशेषण दोनों को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἄρτοι
  choice: रोटियाँ
  rationale: यूनानी शब्द बहुवचन है और अलग-अलग रोटियों को सूचित कर सकता है; हिन्दी में ‘रोटियाँ’ इस बहुवचन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: γένωνται
  choice: बन जाएँ
  rationale: यह γίνομαι के परिवर्तन अथवा नई अवस्था में आने के अर्थ को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: Εἰ υἱὸς εἶ τοῦ θεοῦ में शर्त का भाव
  choice: “यदि तुम परमेश्वर के पुत्र हो”
  alternative: “चूँकि तुम परमेश्वर के पुत्र हो”
  rationale: यूनानी वाक्य चुनौती के रूप में काम कर सकता है और आवश्यक नहीं कि साधारण संदेह व्यक्त करे। मुख्य पाठ में ‘यदि’ रखने से मूल संरचना और उसका तनाव दोनों सुरक्षित रहते हैं।
- issue: υἱὸς τοῦ θεοῦ की मसीह-संबंधी उपाधि
  choice: “परमेश्वर के पुत्र”
  alternative: “परमेश्वर के एक पुत्र”
  rationale: अनुच्छेद और मत्ती के व्यापक कथानक में यह यीशु की विशिष्ट पहचान बताने वाली उपाधि है, किसी सामान्य वर्ग की सदस्यता नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परीक्षा लेनेवाला’ मूल शब्द की परखने और प्रलोभन देने की अर्थ-सीमा को खुला रखता है; ‘कहो कि’ मूल के λέγω को ‘आज्ञा दो’ में अधिक स्पष्ट नहीं करता।
