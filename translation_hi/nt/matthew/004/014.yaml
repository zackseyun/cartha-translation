  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: hi
  text: 'ताकि जो बात यशायाह भविष्यद्वक्ता के द्वारा कही गई थी, वह पूरी हो:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह ἵνα-उपवाक्य के उद्देश्य/परिणाम के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना दोनों में से किसी एक को अनावश्यक रूप से निश्चित किए।
- source_word: πληρωθῇ
  choice: पूरा हो
  rationale: अओरिस्ट कर्मवाच्य संभावनार्थक रूप को हिन्दी के स्वाभाविक वाक्य-विन्यास में रखा गया है। ‘वचन पूरा हो’ मत्ती के शास्त्र-पूर्ति सूत्र को स्पष्ट बनाए रखता है।
- source_word: τὸ ῥηθὲν
  choice: वह वचन ... जो ... कहा गया था
  rationale: संज्ञा के रूप में प्रयुक्त कर्मवाच्य कृदंत को सहज हिन्दी में सापेक्ष उपवाक्य द्वारा व्यक्त किया गया है। ‘वचन’ आगामी शास्त्रीय कथन के संदर्भ में स्वाभाविक है।
- source_word: διὰ
  choice: के द्वारा
  rationale: सम्बन्धकारक के साथ διά यहाँ मध्यस्थ अभिकरण दर्शाता है; यह रूप बताता है कि कथन यशायाह के माध्यम से कहा गया।
- source_word: Ἠσαΐου
  choice: यशायाह
  rationale: भविष्यद्वक्ता के नाम का हिन्दी बाइबलीय परंपरा में प्रचलित रूप।
- source_word: τοῦ προφήτου
  choice: भविष्यद्वक्ता
  rationale: यशायाह की भूमिका को मूल के अनुसार स्पष्ट रूप से बनाए रखा गया है।
- source_word: λέγοντος
  choice: 'कहा गया था:'
  rationale: यह कृदंत आगे आने वाले प्रत्यक्ष उद्धरण का परिचय देता है। हिन्दी में पूर्ववर्ती ‘वचन’ वाले सापेक्ष उपवाक्य के भीतर इसे रखना अधिक स्वाभाविक है; द्विबिंदु उद्धरण की शुरुआत दर्शाता है।
theological_decisions:
- issue: मत्ती का पूर्ति-सूत्र
  choice: ‘वचन पूरा हो’ कहकर पूर्ति की भाषा को स्पष्ट रूप से बनाए रखना
  alternative: ‘बात सच साबित हो’ या ‘कथन साकार हो’
  rationale: πληρόω शास्त्र की पूर्ति के मत्ती-संबंधी प्रमुख विषय को व्यक्त करता है। ‘पूरा हो’ इस अंतर्पाठीय और धर्मवैचारिक संबंध को सुरक्षित रखता है, पर उसके अर्थ की व्याख्यात्मक वृद्धि नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। वाक्य अगले पद के उद्धरण की ओर ले जाता है, इसलिए अंत में द्विबिंदु रखा गया है।
