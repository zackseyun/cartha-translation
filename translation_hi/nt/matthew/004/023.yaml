id: MAT.4.23
reference: Matthew 4:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: hi
  text: और यीशु सारे गलील में घूमते हुए, उनके सभाघरों में शिक्षा देते, राज्य के शुभ समाचार[a] की घोषणा करते और लोगों के बीच हर रोग और हर दुर्बलता को चंगा करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘राज्य का सुसमाचार।’
    reason: εὐαγγέλιον के पारंपरिक हिन्दी धार्मिक पर्याय को दर्ज करना।
lexical_decisions:
- source_word: περιῆγεν
  choice: घूमते रहे
  rationale: अपूर्ण भूतकाल निरंतर और स्थान-स्थान की यात्रा का भाव देता है; ‘घूमते रहे’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: पूरे गलील प्रदेश में
  rationale: गतिसूचक क्रिया के साथ यह वाक्यांश समूचे क्षेत्र में भ्रमण का बोध कराता है; ‘प्रदेश’ जोड़ने से आधुनिक पाठक के लिए गलील का भौगोलिक स्वरूप स्पष्ट होता है।
- source_word: διδάσκων
  choice: शिक्षा देते
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ-साथ चलने वाली गतिविधि बताता है; हिन्दी में संयुक्त क्रियात्मक क्रम इसे सहज रूप से व्यक्त करता है।
- source_word: συναγωγαῖς αὐτῶν
  choice: उनके सभाघरों
  rationale: ‘सभाघर’ यहूदी आराधना और सामुदायिक शिक्षा के स्थान के लिए प्रचलित, समझने योग्य शब्द है; ‘उनके’ मूल के संबंधसूचक सर्वनाम को बनाए रखता है।
- source_word: κηρύσσων
  choice: सुनाते
  rationale: संदर्भ में सार्वजनिक रूप से शुभ समाचार घोषित करने का भाव है; ‘सुनाते’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और संदेश के सार्वजनिक संप्रेषण को व्यक्त करता है।
- source_word: τὸ εὐαγγέλιον
  choice: शुभ समाचार
  rationale: यह यूनानी शब्द का सीधा और सामान्य हिन्दी अर्थ है तथा पारंपरिक धार्मिक शब्दावली से अपरिचित पाठक के लिए भी तुरंत समझ में आता है।
- source_word: τῆς βασιλείας
  choice: राज्य का
  rationale: संबंधकारक रचना को निकटता से रखते हुए यह शुभ समाचार को राज्य से संबंधित बताता है, बिना यह तय किए कि संबंध को केवल विषयवस्तु या गुण के रूप में समझा जाए।
- source_word: θεραπεύων
  choice: चंगा करते थे
  rationale: इस संदर्भ में क्रिया वास्तविक आरोग्य प्रदान करने को दर्शाती है; ‘चंगा करना’ आधुनिक हिन्दी बाइबलीय भाषा में स्पष्ट और स्वाभाविक है।
- source_word: πᾶσαν νόσον
  choice: हर प्रकार के रोग
  rationale: ‘हर प्रकार के’ वितरक व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है; ‘रोग’ अगले शब्द ‘दुर्बलता’ से अर्थभेद बनाए रखता है।
- source_word: πᾶσαν μαλακίαν
  choice: हर प्रकार की दुर्बलता
  rationale: μαλακία रोगजन्य कमजोरी, अस्वस्थता या दुर्बलता को सूचित कर सकता है; ‘दुर्बलता’ इस व्यापकता और νόσος से भेद को सुरक्षित रखता है।
- source_word: ἐν τῷ λαῷ
  choice: लोगों के बीच
  rationale: यह उपचार की सामाजिक परिधि बताता है; ‘लोगों के बीच’ सहज हिन्दी है और यहाँ अनावश्यक तकनीकी धार्मिक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: εὐαγγέλιον का अनुवाद
  choice: शुभ समाचार
  alternative: सुसमाचार
  rationale: ‘शुभ समाचार’ मूल शब्द का अर्थ सीधे व्यक्त करता है और सामान्य पाठक के लिए पारदर्शी है; पारंपरिक ‘सुसमाचार’ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν में चंगाई का विस्तार
  choice: हर प्रकार के रोग और हर प्रकार की दुर्बलता
  alternative: हर बीमारी और हर अस्वस्थता
  rationale: दोनों बार आए πᾶσαν की व्यापकता और दोनों संज्ञाओं का अंतर बनाए रखा गया है, बिना पद के कथन को उससे आगे बढ़ाए।
- issue: τῆς βασιλείας संबंधकारक की व्याख्या
  choice: राज्य का शुभ समाचार
  alternative: राज्य के विषय में शुभ समाचार
  rationale: ‘राज्य का’ मूल की वास्तविक अर्थगत व्यापकता को बनाए रखता है; अधिक व्याख्यात्मक विकल्प इसे केवल राज्य के विषय में समाचार मान सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। यूनानी वाक्य की निरंतर भ्रमणशील सेवकाई को ‘घूमते रहे’ और साथ चलती गतिविधियों को समानांतर क्रियाओं द्वारा व्यक्त किया गया है।
