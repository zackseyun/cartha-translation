id: MAT.4.4
reference: Matthew 4:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: hi
  text: परन्तु उसने उत्तर दिया, “लिखा है, ‘मनुष्य[a] केवल रोटी से जीवित नहीं रहेगा, बल्कि परमेश्वर के मुख से निकलने वाले[b] हर वचन से।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मनुष्य” से सामान्य रूप से प्रत्येक मानव का आशय है, केवल पुरुष का नहीं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक भाव है, “परमेश्वर के मुख के द्वारा निकलने वाले”; हिन्दी में “मुख से निकलने वाले” उसी वाणी-चित्र को स्वाभाविक रूप से व्यक्त करता है।
    reason: source_form
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: उसने उत्तर दिया
  rationale: यूनानी की सामी-प्रभावित कथात्मक अभिव्यक्ति का अर्थ स्वाभाविक और संक्षिप्त आधुनिक हिन्दी में व्यक्त होता है; ‘उत्तर देकर कहा’ अनावश्यक रूप से दोहरावपूर्ण होता।
- source_word: Γέγραπται
  choice: लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण का प्रचलित सूत्र है और यूनानी पूर्णकाल में निहित वर्तमान स्थायित्व को सहज हिन्दी में बनाए रखता है।
- source_word: ἄρτῳ μόνῳ
  choice: केवल रोटी से
  rationale: ‘रोटी’ प्रत्यक्ष शाब्दिक अर्थ है; व्यापक ‘भोजन’ कहना अर्थ का अनावश्यक विस्तार होता। ‘केवल ... से’ आधुनिक हिन्दी में μόνῳ का स्वाभाविक रूप है।
- source_word: ζήσεται
  choice: जीवित नहीं रहेगा
  rationale: यूनानी भविष्यकाल का सीधा और वर्तमान हिन्दी के अनुरूप अनुवाद।
- source_word: ὁ ἄνθρωπος
  choice: मनुष्य
  rationale: यह किसी विशेष पुरुष का नहीं, सामान्य रूप से मानव-जाति के प्रत्येक सदस्य का प्रतिनिधिक उल्लेख है; ‘मनुष्य’ हिन्दी में इस समावेशी सामान्य अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: παντὶ ῥήματι
  choice: हर वचन से
  rationale: ῥῆμα यहाँ परमेश्वर द्वारा कही गई प्रत्येक बात को दर्शाता है। ‘वचन’ गरिमापूर्ण, परिचित और प्रसंगानुकूल है।
- source_word: ἐκπορευομένῳ διὰ στόματος θεοῦ
  choice: परमेश्वर के मुख से निकलने वाले
  rationale: यह अनुवाद दिव्य वाणी के मुख से निकलने का मूल चित्र बनाए रखता है। हिन्दी का ‘से’ इस प्रसंग में स्रोत और माध्यम दोनों को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘मुख के द्वारा निकलने वाले’ कृत्रिम लगता।
theological_decisions:
- issue: ὁ ἄνθρωπος का प्रतिनिधिक पुल्लिंग
  choice: मनुष्य
  alternative: मानव / व्यक्ति
  rationale: कथन समस्त मानव जीवन के विषय में सामान्य सत्य कहता है। ‘मनुष्य’ मूल के एकवचन प्रतिनिधिक रूप और उसके व्यापक आशय दोनों को बनाए रखता है।
- issue: Γέγραπται में शास्त्रीय उद्धरण और स्थायी प्रामाणिकता
  choice: लिखा है
  alternative: लिखा हुआ है
  rationale: ‘लिखा है’ बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े उद्धरण-सूत्र और लिखित वचन की वर्तमान प्रासंगिकता को व्यक्त करता है।
- issue: διὰ στόματος θεοῦ में माध्यम/स्रोत की छवि
  choice: परमेश्वर के मुख से
  alternative: परमेश्वर के मुख के द्वारा
  rationale: यूनानी διά मुख को वह माध्यम बताता है जिससे वचन निकलता है। हिन्दी में ‘मुख से निकलना’ इसी छवि का स्वाभाविक रूप है; फुटनोट मूल की शाब्दिक बारीकी स्पष्ट करता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। उद्धरण की परिचित शास्त्रीय लय बनाए रखते हुए अनावश्यक पुरातन रूपों से बचा गया है। अन्तिम खंड में यूनानी की तरह क्रिया अध्याहृत है; हिन्दी में भी ‘हर वचन से’ के बाद ‘जीवित रहेगा’ स्वतः समझ में आता है।
