id: MAT.4.6
reference: Matthew 4:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: hi
  text: 'और उसने उससे कहा, “यदि तुम परमेश्वर के पुत्र हो, तो अपने आप को नीचे फेंक दो[a], क्योंकि लिखा है: ‘वह तुम्हारे विषय में अपने स्वर्गदूतों को आज्ञा देगा,’ और ‘वे तुम्हें अपने हाथों पर उठा लेंगे[b], कहीं ऐसा न हो कि तुम्हारा पाँव किसी पत्थर से टकराए।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आप को नीचे गिरा दो।”
    reason: lexical_alternative
  - marker: b
    text: या, “वे तुम्हें अपने हाथों पर सँभाल लेंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: उसने कहा
  rationale: यूनानी कथात्मक वर्तमान यहाँ ऐतिहासिक वर्तमान है; आधुनिक हिन्दी में भूतकाल कथानक को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Εἰ
  choice: यदि
  rationale: यह शर्त के रूप में चुनौती प्रस्तुत करता है और उसकी सत्यता को पहले से स्वीकार नहीं करता।
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: परमेश्वर के पुत्र
  rationale: मत्ती के प्रसंग में यह एक विशिष्ट मसीही उपाधि है; हिन्दी में यह रूप उसी अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: βάλε σεαυτὸν κάτω
  choice: अपने आप को नीचे फेंक दो
  rationale: आज्ञार्थक क्रिया, निजवाचक सर्वनाम और ‘नीचे’—तीनों को स्पष्ट, आधुनिक हिन्दी में बनाए रखता है।
- source_word: γέγραπται
  choice: लिखा है
  rationale: पवित्रशास्त्र के उद्धरण के लिए यह स्वाभाविक हिन्दी है और यूनानी पूर्णकाल में निहित स्थायी प्रामाणिकता को व्यक्त करती है।
- source_word: ἐντελεῖται
  choice: आज्ञा देगा
  rationale: स्वर्गदूतों को दिए जाने वाले अधिकारपूर्ण निर्देश का भाव सुरक्षित रहता है।
- source_word: περὶ σοῦ
  choice: तुम्हारे विषय में
  rationale: περί के संबंधसूचक अर्थ को सीधे व्यक्त करता है; ‘तुम्हारे लिए’ की अपेक्षा यूनानी शब्द-विन्यास के अधिक निकट है।
- source_word: ἐπὶ χειρῶν
  choice: अपने हाथों पर
  rationale: ἐπί के आधार या सहारे वाले चित्र को बनाए रखता है।
- source_word: ἀροῦσίν σε
  choice: वे तुम्हें ... उठा लेंगे
  rationale: αἴρω के उठाने और सहारा देकर थामने के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μήποτε προσκόψῃς
  choice: कहीं ऐसा न हो कि ... टकराए
  rationale: μήποτε के निवारक भाव और προσκόπτω के यहाँ पाँव के पत्थर से टकराने वाले विशिष्ट अर्थ को सुरक्षित रखता है।
- source_word: πρὸς λίθον
  choice: किसी पत्थर से
  rationale: अनिश्चित λίθον को हिन्दी में स्वाभाविक अनिश्चित अभिव्यक्ति के साथ प्रस्तुत करता है।
- source_word: τὸν πόδα σου
  choice: तुम्हारा पाँव
  rationale: यूनानी के एकवचन को बनाए रखता है।
theological_decisions:
- issue: परीक्षक की चुनौती में ‘परमेश्वर का पुत्र’ का मसीही अर्थ
  choice: ‘परमेश्वर के पुत्र’ को विशिष्ट उपाधि के रूप में अनूदित किया गया
  alternative: इसे सामान्य अर्थ में ‘परमेश्वर के एक पुत्र’ कहना
  rationale: मत्ती के कथानक में यह पद एक पहचानी हुई मसीही उपाधि के रूप में काम करता है; अनुवाद पाठ से आगे कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
- issue: शैतान द्वारा भजन 91 के उद्धरण का प्रस्तुतीकरण
  choice: उद्धरण को उसी के कथन के रूप में बिना व्याख्यात्मक सुधार के रखा गया
  alternative: मुख्य पाठ में उसकी व्याख्या पर टिप्पणी या सुधार जोड़ना
  rationale: मूल पाठ में शैतान पवित्रशास्त्र उद्धृत करता है; अनुवाद को इस तनाव को बनाए रखना चाहिए, न कि मुख्य पाठ में उसका समाधान जोड़ना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परमेश्वर’, ‘स्वर्गदूत’ और ‘लिखा है’ जैसे प्रचलित बाइबलीय पद बनाए गए हैं, जबकि वाक्य-विन्यास को अनावश्यक रूप से पुरातन नहीं बनाया गया।
