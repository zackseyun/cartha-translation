  text: καὶ νηστεύσας ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα ὕστερον ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: hi
  text: और चालीस दिन और चालीस रात उपवास करने के बाद, उसे भूख लगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य कथात्मक संबंधसूचक है; ‘और’ पिछले प्रसंग से स्वाभाविक निरंतरता बनाए रखता है।
- source_word: νηστεύσας
  choice: उपवास करने के बाद
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले पूरी हुई क्रिया बताता है। यह हिंदी में स्वाभाविक रूप से पूर्वकालिक संबंध व्यक्त करता है।
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: चालीस दिन और चालीस रात
  rationale: यह समयावधि का कर्मकारक प्रयोग है। हिंदी में बिना अतिरिक्त परसर्ग के यह अवधि स्पष्ट और बाइबलीय प्रतिध्वनि सहित व्यक्त होती है।
- source_word: ὕστερον
  choice: बाद
  rationale: यह उपवास के पश्चात भूख लगने का समय-संबंध स्पष्ट करता है। इसे कृदंत-वाक्यांश के साथ जोड़ना स्वाभाविक हिंदी देता है और मूल की क्रमिकता बनाए रखता है।
- source_word: ἐπείνασεν
  choice: उसे भूख लगी
  rationale: यह आधुनिक हिंदी में वास्तविक भूख के अनुभव और उसके आरंभ को स्वाभाविक ढंग से व्यक्त करता है; ‘वह भूखा हुआ’ अधिक कृत्रिम लगेगा।
theological_decisions:
- issue: उपवास के बाद यीशु की वास्तविक मानवीय भूख
  choice: उसे भूख लगी
  alternative: वह भूखा हो गया
  rationale: चुना गया वाक्यांश किसी सिद्धांत को बढ़ा-चढ़ाकर जोड़े बिना वास्तविक मानवीय आवश्यकता को स्पष्ट और सहज हिंदी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और कथात्मक। मूल के ‘चालीस दिन और चालीस रात’ को बनाए रखा गया है। अलग पाठ-टिप्पणी आवश्यक नहीं, क्योंकि νηστεύσας और ὕστερον का संयुक्त काल-संबंध मुख्य अनुवाद में स्पष्ट है।
