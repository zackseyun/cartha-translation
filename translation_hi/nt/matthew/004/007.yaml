source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: hi
  text: 'यीशु ने उससे कहा, “फिर लिखा है: ‘तू अपने प्रभु परमेश्वर की परीक्षा न लेना।’”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, “तू अपने प्रभु परमेश्वर को न परखना।” यूनानी क्रिया ἐκπειράζω का अर्थ “परीक्षा लेना” या “परखना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह व्यवस्थाविवरण 6:16 का उद्धरण है। यूनानी पाठ का “प्रभु” सेप्टुआजिंट में परमेश्वर के दिव्य नाम के लिए प्रयुक्त शब्द को दर्शाता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: यीशु ने उससे कहा
  rationale: यह सरल कथन-परिचय है; हिन्दी में कर्ता पहले रखकर अर्थ स्वाभाविक और स्पष्ट रहता है।
- source_word: Πάλιν
  choice: फिर यह भी
  rationale: यह पहले दिए गए शास्त्रीय उद्धरण के उत्तर में एक और शास्त्रीय उद्धरण प्रस्तुत करता है। ‘फिर यह भी’ मूल के पुनरुक्त/प्रतिउत्तर भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γέγραπται
  choice: लिखा है
  rationale: यूनानी पूर्ण निष्क्रिय रूप शास्त्र-उद्धरण का प्रचलित सूत्र है और लिखे हुए वचन की वर्तमान प्रामाणिकता का भाव बनाए रखता है।
- source_word: Οὐκ ἐκπειράσεις
  choice: परीक्षा न लेना
  rationale: भविष्यत् सूचक रूप यहाँ निषेधात्मक आज्ञा के रूप में प्रयुक्त है। ‘परीक्षा लेना’ ἐκπειράζω के किसी को जाँचने या कसौटी पर रखने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: κύριον τὸν θεόν σου
  choice: अपने प्रभु परमेश्वर
  rationale: κύριος को ‘प्रभु’ और θεός को ‘परमेश्वर’ दिया गया है; ‘अपने’ possessive σου को स्वाभाविक हिन्दी में व्यक्त करता है और दोनों पदों का संयुक्त संबोधन सुरक्षित रखता है।
theological_decisions:
- issue: व्यवस्थाविवरण 6:16 के उद्धरण में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: तात्कालिक यूनानी स्रोत में κύριος है, इसलिए मुख्य पाठ में ‘प्रभु’ रखा गया है। पृष्ठभूमि में इब्रानी दिव्य नाम होने की जानकारी पादटिप्पणी में दी गई है, बिना उसे यूनानी पाठ में सीधे प्रतिस्थापित किए।
- issue: ἐκπειράζω में परीक्षा के आशय की तीव्रता
  choice: परीक्षा लेना
  alternative: परखना
  rationale: मुख्य पाठ सामान्य और प्रतिष्ठित हिन्दी मुहावरे को रखता है। मूल क्रिया का अर्थ किसी को कसौटी पर रखना भी हो सकता है; यह विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। उद्धरण में ‘तू’ रखा गया है क्योंकि यह व्यवस्था के एकवचन निषेधात्मक संबोधन को सीधे सुरक्षित रखता है; कथा-वाक्य स्वाभाविक आधुनिक शब्दक्रम में है।
