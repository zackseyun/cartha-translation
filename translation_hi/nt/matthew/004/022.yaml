reference: Matthew 4:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: hi
  text: और वे तुरंत[a] नाव और अपने पिता को छोड़कर उसके पीछे हो लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसी समय।”
    reason: εὐθέως की तात्कालिकता व्यक्त करने वाला एक स्वाभाविक वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है; “और” बिना अनावश्यक विरोध या निष्कर्ष जोड़े स्वाभाविक हिन्दी देता है।
- source_word: εὐθέως
  choice: तुरंत
  rationale: यह शब्द प्रतिक्रिया की तत्परता पर बल देता है। “तुरंत” आधुनिक, सहज और मूल की तात्कालिकता के अनुरूप है।
- source_word: ἀφέντες
  choice: छोड़कर
  rationale: 'अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई क्रिया दिखाता है: पहले उन्होंने नाव और पिता को छोड़ा, फिर वे उसके पीछे हो लिए। “छोड़कर” इस क्रम को स्वाभाविक हिन्दी में बनाए रखता है और “त्यागकर” जैसी अधिक प्रबल व्याख्या से बचता है।'
- source_word: τὸ πλοῖον
  choice: नाव
  rationale: मछली पकड़ने के इस प्रसंग में πλοῖον के लिए “नाव” सामान्य और संदर्भानुकूल शब्द है; “जहाज़” अनावश्यक रूप से बड़े जलयान का आभास दे सकता है।
- source_word: τὸν πατέρα αὐτῶν
  choice: अपने पिता को
  rationale: “अपने पिता” कर्ता के साथ संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है और शिष्य बनने की पारिवारिक कीमत को मूल के अनुरूप व्यक्त करता है।
- source_word: ἠκολούθησαν αὐτῷ
  choice: उसके पीछे हो लिए
  rationale: यह वाक्यांश वास्तविक रूप से पीछे चलने और यीशु के शिष्य बनने—दोनों निहित अर्थों को सहज हिन्दी में बनाए रखता है।
- source_word: οἱ
  choice: वे
  rationale: यह substantival article पिछले पद में बताए गए दोनों भाइयों की ओर संकेत करता है; हिन्दी में “वे” इसका स्वाभाविक रूप है।
theological_decisions:
- issue: शिष्यत्व की प्रतिक्रिया और पिता से अलग होना
  choice: पद को नाव और पिता को छोड़कर तत्काल यीशु के पीछे हो लेने के निर्णायक कार्य के रूप में प्रस्तुत किया गया है।
  alternative: इसे पिता का स्थायी परित्याग मानना, या केवल थोड़ी देर के लिए उनसे दूर जाना।
  rationale: मूल पाठ तत्पर और निर्णायक प्रतिक्रिया पर बल देता है, पर ἀφέντες अपने आप स्थायी परित्याग की अवधि निर्धारित नहीं करता। इसलिए “छोड़कर” मूल की शक्ति बनाए रखते हुए उससे अधिक नहीं कहता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सरल किंतु गरिमापूर्ण है। “उसके पीछे हो लिए” सामान्य पाठक के लिए सहज है और सुसमाचारों में शिष्यत्व की ध्वनि भी बनाए रखता है। पादटिप्पणी-चिह्न उसी शब्द के बाद रखा गया है जिससे वह संबंधित है।
