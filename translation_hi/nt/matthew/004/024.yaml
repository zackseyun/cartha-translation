id: MAT.4.24
reference: Matthew 4:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: hi
  text: और उसके बारे में समाचार पूरे सीरिया में फैल गया। लोग उन सबको उसके पास लाए जो बीमार थे—जो तरह-तरह की बीमारियों और पीड़ाओं से जकड़े हुए थे, जो दुष्टात्माओं से ग्रस्त थे,[a] जिन्हें दौरे पड़ते थे,[b] और जो लकवे से पीड़ित थे—और उसने उन्हें चंगा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दुष्टात्मा-पीड़ित थे” अथवा “जिनमें दुष्टात्माएँ थीं।”
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी शब्द का शाब्दिक संबंध चन्द्रमा से है और ऐसे लोगों के लिए प्रयुक्त होता था जिन्हें चन्द्रमा से प्रभावित माना जाता था; परंपरागत अनुवाद: “मिर्गी के रोगी।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: समाचार
  rationale: यहाँ शब्द का अर्थ यीशु के विषय में सुनी और फैली हुई खबर है, न कि सुनने की शक्ति।
- source_word: ἀπῆλθεν
  choice: फैल गया
  rationale: यूनानी में गति का रूपक है; हिन्दी में समाचार के पूरे क्षेत्र में पहुँचने के लिए ‘फैल गया’ स्वाभाविक और स्पष्ट है।
- source_word: Συρίαν
  choice: सीरिया
  rationale: क्षेत्रीय नाम का प्रचलित आधुनिक हिन्दी रूप।
- source_word: προσήνεγκαν
  choice: लोग ... उसके पास लाए
  rationale: संदर्भ में लोगों को यीशु के पास लाने का सामान्य अर्थ है; अनिर्दिष्ट बहुवचन कर्ता को हिन्दी में ‘लोग’ से स्वाभाविक बनाया गया है।
- source_word: κακῶς ἔχοντας
  choice: जो बीमार थे
  rationale: यह मुहावरा अस्वस्थ या बीमार होने को दर्शाता है।
- source_word: ποικίλαις νόσοις
  choice: तरह-तरह की बीमारियों
  rationale: ποικίλαις अनेक प्रकार या विविधता, और νόσοις बीमारियों को व्यक्त करता है।
- source_word: βασάνοις συνεχομένους
  choice: पीड़ाओं से जकड़े हुए थे
  rationale: συνεχομένους दबोचे या जकड़े होने की तीव्रता और βάσανοι गंभीर पीड़ाओं को व्यक्त करता है।
- source_word: δαιμονιζομένους
  choice: दुष्टात्माओं से ग्रस्त थे
  rationale: यह वास्तविक दुष्टात्मिक प्रभाव को स्पष्ट रखता है, पर यूनानी से अधिक संकीर्ण आधुनिक तकनीकी श्रेणी निर्धारित नहीं करता।
- source_word: σεληνιαζομένους
  choice: जिन्हें दौरे पड़ते थे
  rationale: यह आधुनिक पाठक को संभावित लक्षण स्पष्ट करता है, बिना चन्द्रमा को उसका कारण मान लेने के। शब्द का अधिक शाब्दिक ऐतिहासिक संकेत पादटिप्पणी में सुरक्षित है।
- source_word: παραλυτικούς
  choice: जो लकवे से पीड़ित थे
  rationale: यह παραλυτικός का सहज और सम्मानजनक आधुनिक हिन्दी रूप है।
- source_word: ἐθεράπευσεν
  choice: उसने उन्हें चंगा किया
  rationale: θεραπεύω के उपचार और चंगाई संबंधी अर्थ का मानक बाइबलीय हिन्दी रूप।
theological_decisions:
- issue: δαιμονιζομένους में दुष्टात्मिक दशा की प्रकृति
  choice: दुष्टात्माओं से ग्रस्त थे
  alternative: दुष्टात्मा-पीड़ित थे / जिनमें दुष्टात्माएँ थीं
  rationale: चुना हुआ रूप दुष्टात्मिक प्रभाव की वास्तविकता बनाए रखता है, लेकिन ‘अधिकार’ या किसी निश्चित स्तर की possession को अनावश्यक रूप से तय नहीं करता।
- issue: σεληνιαζομένους का रोग-संबंधी अर्थ
  choice: जिन्हें दौरे पड़ते थे
  alternative: मिर्गी के रोगी / चन्द्रमा से प्रभावित माने जाने वाले लोग
  rationale: शब्द की व्युत्पत्ति चन्द्रमा से जुड़ी है, पर प्रसंग में दौरे जैसी दशा वाले व्यक्तियों का संकेत है। मुख्य पाठ लक्षण को सहज भाषा में देता है और प्राचीन शब्द-चित्र को पादटिप्पणी में रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लंबे यूनानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है। डैश सामान्य श्रेणी ‘बीमार’ के बाद आने वाली विशिष्ट दशाओं को स्पष्ट करते हैं।
