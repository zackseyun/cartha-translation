  edition: SBLGNT
  text: οἱ δὲ εὐθέως ἀφέντες τὰ δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: hi
  text: और वे तुरन्त जालों को छोड़कर उसके पीछे हो लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है। ‘और’ सहज हिन्दी में साधारण समन्वय बनाए रखता है और अनावश्यक विरोध नहीं दर्शाता।
- source_word: εὐθέως
  choice: तुरन्त
  rationale: εὐθέως उनकी त्वरित प्रतिक्रिया पर बल देता है। ‘तुरन्त’ आधुनिक मानक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἀφέντες
  choice: छोड़कर
  rationale: ἀφίημι का यह एओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई क्रिया दर्शाता है। ‘छोड़कर’ हिन्दी में इस क्रम को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है; ‘त्यागकर’ प्रसंग से अधिक प्रबल हो सकता है।
- source_word: τὰ δίκτυα
  choice: जालों को
  rationale: δίκτυα प्रसंग में मछली पकड़ने के जाल हैं। पूर्ववर्ती प्रसंग से अर्थ स्पष्ट होने के कारण ‘मछली पकड़ने के’ या ‘अपने’ जोड़ना आवश्यक नहीं है। बहुवचन को ‘जालों’ से सुरक्षित रखा गया है।
- source_word: ἠκολούθησαν αὐτῷ
  choice: उसके पीछे हो लिए
  rationale: ἀκολουθέω के साथ दत्तिव αὐτῷ किसी व्यक्ति के पीछे चलने और उससे शिष्य के रूप में जुड़ने—दोनों अर्थ-छायाएँ रख सकता है। ‘उसके पीछे हो लिए’ तत्काल शारीरिक अनुसरण और उभरते शिष्यत्व, दोनों के लिए स्वाभाविक स्थान रखता है।
theological_decisions:
- issue: ἠκολούθησαν αὐτῷ में शिष्यत्व की अर्थ-छाया
  choice: उसके पीछे हो लिए
  alternative: उसका अनुसरण किया
  rationale: यूनानी क्रिया वास्तविक रूप से पीछे चलने के साथ सुसमाचार के प्रसंग में शिष्य बनकर जुड़ने का संकेत भी दे सकती है। चुना हुआ वाक्यांश दोनों पहलुओं को बनाए रखता है, जबकि ‘उसका अनुसरण किया’ आधुनिक सामान्य हिन्दी में कुछ औपचारिक और अमूर्त लग सकता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। वाक्य की संक्षिप्तता तथा मूल यूनानी में क्रियाओं का क्रम—पहले जाल छोड़ना, फिर उसके पीछे होना—सुरक्षित रखा गया है।
