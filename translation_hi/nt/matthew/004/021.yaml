id: MAT.4.21
reference: Matthew 4:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: hi
  text: वहाँ से आगे बढ़कर उसने दो और भाइयों को देखा—जबदी के पुत्र याकूब और उसके भाई यूहन्ना को। वे नाव में अपने पिता जबदी के साथ अपने जालों की मरम्मत कर रहे थे। उसने उन्हें बुलाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: वहाँ से आगे बढ़कर
  rationale: क्रियाविशेषण ἐκεῖθεν पहले स्थान से प्रस्थान को और προβὰς आगे जाने को व्यक्त करता है; यह संयोजन हिन्दी में स्वाभाविक रहते हुए दोनों अर्थों को सुरक्षित रखता है।
- source_word: εἶδεν
  choice: उसने ... देखा
  rationale: ὁράω के सामान्य आख्यानात्मक अर्थ को बिना अनावश्यक रूप से ‘ध्यान दिया’ जैसा प्रबल बनाए सीधे व्यक्त करता है।
- source_word: ἄλλους δύο ἀδελφούς
  choice: दो और भाइयों को
  rationale: ἄλλους इन दोनों को पिछले पद में आए भाई-युगल के अतिरिक्त बताता है; ‘दो और भाई’ आधुनिक हिन्दी में सहज है।
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: जबदी के पुत्र याकूब
  rationale: यूनानी संबंधकारक पदबंध यहाँ पितृत्व बताता है। ‘जबदी’ और ‘याकूब’ हिन्दी बाइबल परंपरा में सुविदित नाम-रूप हैं।
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: उसके भाई यूहन्ना को
  rationale: αὐτοῦ का निकटतम और स्वाभाविक पूर्वपद याकूब है; हिन्दी क्रम इस संबंध को स्पष्ट तथा सहज बनाता है।
- source_word: ἐν τῷ πλοίῳ
  choice: नाव में
  rationale: मछली पकड़ने के प्रसंग में πλοῖον के लिए ‘नाव’ उपयुक्त है, ‘जहाज़’ नहीं।
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: अपने पिता जबदी के साथ
  rationale: μετά संगति को बताता है और αὐτῶν दोनों भाइयों की ओर संकेत करता है; हिन्दी में यह शब्दक्रम अधिक स्वाभाविक है।
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: अपने जालों की मरम्मत कर रहे थे
  rationale: मछली पकड़ने के संदर्भ में καταρτίζω जालों को फिर ठीक दशा में लाने का अर्थ देता है; ‘मरम्मत’ अर्थ को स्पष्ट रखता है। बहुवचन δίκτυα को ‘जालों’ से रखा गया है।
- source_word: ἐκάλεσεν αὐτούς
  choice: उसने उन्हें बुलाया
  rationale: καλέω का सरल अर्थ सुरक्षित है। शिष्य बनने का आशय संदर्भ में है, पर मूल पद में ‘अपने पीछे चलने के लिए’ नहीं जोड़ा गया।
theological_decisions:
- issue: ἐκάλεσεν में शिष्यत्व का निहितार्थ
  choice: उसने उन्हें बुलाया
  alternative: उसने उन्हें अपने पीछे चलने के लिए बुलाया
  rationale: निकटवर्ती संदर्भ इसे शिष्यत्व का बुलावा बनाता है, किंतु इस पद के यूनानी पाठ में बुलावे का उद्देश्य स्पष्ट शब्दों में नहीं है। इसलिए मूल की संक्षिप्तता और संदर्भगत तनाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण आख्यानात्मक रूप अपनाया गया है। लंबा यूनानी वाक्य हिन्दी की पठनीयता के लिए तीन वाक्यों में विभाजित किया गया, पर सभी संबंध और क्रियाएँ सुरक्षित रखी गई हैं। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
