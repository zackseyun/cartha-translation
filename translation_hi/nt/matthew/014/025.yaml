  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: hi
  text: और रात के चौथे पहर[b] में वह समुद्र पर चलते हुए[a] उनके पास आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समुद्र के ऊपर चलते हुए।” कुछ लोगों ने इस वाक्यांश को “समुद्र के किनारे चलते हुए” समझा है, पर प्रसंग पानी की सतह पर चलने का प्रबल समर्थन करता है।
    reason: alternative_reading
  - marker: b
    text: “रात का चौथा पहर” रात का अंतिम पहरा था, जो रोमी व्यवस्था में लगभग भोर 3 से 6 बजे तक होता था।
    reason: cultural_note
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: रात के चौथे पहर में
  rationale: यह कालवाचक पद कार्य का समय बताता है। ‘पहर’ रात के प्रहरी-विभाजन की ऐतिहासिक धारणा को सहज हिन्दी में बनाए रखता है; समय का मोटा आधुनिक समतुल्य पादटिप्पणी में दिया गया है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को हल्के ढंग से आगे बढ़ाने वाला संयोजक है; ‘और’ स्वाभाविक हिन्दी कथाशैली के अनुकूल है।
- source_word: ἦλθεν πρὸς αὐτούς
  choice: वह ... उनके पास आया
  rationale: ἔρχομαι और πρός के साथ यह अभिव्यक्ति शिष्यों की ओर आकर उनके पास पहुँचने की गति बताती है।
- source_word: περιπατῶν
  choice: चलते हुए
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ-साथ जारी क्रिया को व्यक्त करता है।
- source_word: ἐπὶ τὴν θάλασσαν
  choice: झील पर
  rationale: इस प्रसंग में ἐπί के साथ यह वाक्यांश पानी की सतह पर गति को सूचित करता है। ‘झील’ आधुनिक हिन्दी में गलील के जलाशय के लिए स्वाभाविक है, यद्यपि θάλασσα का अधिक शाब्दिक रूप ‘समुद्र’ है; इस विकल्प को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: यीशु का पानी पर चलना
  choice: झील पर चलते हुए
  alternative: झील के किनारे चलते हुए
  rationale: वाक्य-विन्यास और तत्काल प्रसंग पानी की सतह पर चलने का प्रबल संकेत देते हैं। अनुवाद चमत्कारिक कथन को न तो कम करता है, न मूल से आगे बढ़ाकर अलंकृत करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ऐतिहासिक ‘चौथे पहर’ को मुख्य पाठ में बनाए रखते हुए उसका समय पादटिप्पणी में स्पष्ट किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
