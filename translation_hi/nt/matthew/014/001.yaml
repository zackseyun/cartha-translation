  - marker: a
    text: या, ‘यीशु के बारे में चर्चा सुनी।’
    reason: ἀκοή यहाँ सुनी हुई बात, अर्थात खबर या चर्चा, को सूचित करता है।
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: उस समय
  rationale: यह यूनानी पदबंध समय का स्वाभाविक संकेत है; ‘उस समय’ आधुनिक हिन्दी में सहज और अर्थनिष्ठ है।
- source_word: ἤκουσεν
  choice: सुनी
  rationale: ἀκούω का सामान्य अर्थ ‘सुनना’ है; हिन्दी में कर्म ‘चर्चा’ के अनुसार स्त्रीलिंग रूप स्वाभाविक है।
- source_word: Ἡρῴδης
  choice: हेरोदेस
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: ὁ τετραάρχης
  choice: चौथाई प्रदेश का शासक
  rationale: τετραάρχης एक ऐतिहासिक राजनीतिक पद था। केवल ‘राजा’ कहना अशुद्ध होता, जबकि ‘चौथाई प्रदेश का शासक’ पद के मूल भाव को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: τὴν ἀκοὴν
  choice: चर्चा
  rationale: यहाँ ἀκοή का अर्थ सुनने की क्रिया नहीं, बल्कि सुनी जाने वाली बात, खबर या चर्चा है। ‘चर्चा’ इस संदर्भ में यीशु के बारे में फैलती हुई बात को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: Ἰησοῦ
  choice: यीशु के विषय में
  rationale: ἀκοή के साथ संबंधवाचक रूप रिपोर्ट या चर्चा की विषयवस्तु बताता है; हिन्दी में ‘के विषय में’ स्पष्ट और स्वाभाविक है।
