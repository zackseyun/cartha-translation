  text: At that time Herod the tetrarch heard the report about Jesus,[a]
translation:
  language: hi
  text: उस समय चौथाई-प्रदेश के शासक हेरोदेस ने यीशु के बारे में खबर सुनी,[a]
  philosophy: optimal-equivalence
