source:
  edition: SBLGNT
  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: hi
  text: पर नाव पहले ही किनारे से कई स्टेडिया दूर थी[a][b] और लहरों से बुरी तरह पीटी जा रही थी[c], क्योंकि हवा उसके विरुद्ध थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि से।” यूनानी में शाब्दिक रूप से “भूमि से” है।
    reason: lexical_alternative
  - marker: b
    text: एक स्टेडियन प्राचीन दूरी की इकाई थी, जो लगभग 185 मीटर के बराबर थी।
    reason: cultural_note
  - marker: c
    text: या, “लहरों के थपेड़े खा रही थी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: नाव
  rationale: गलील झील के प्रसंग में आधुनिक हिन्दी का ‘नाव’ स्वाभाविक है और आकार को अनावश्यक रूप से बड़ा नहीं दर्शाता।
- source_word: ἤδη
  choice: पहले ही
  rationale: यह बताता है कि कथा के इस बिंदु तक नाव उस स्थिति में पहुँच चुकी थी।
- source_word: σταδίους πολλοὺς
  choice: बहुत स्टेडिया
  rationale: मूल यूनानी की प्राचीन दूरी-इकाई को पारदर्शिता के लिए मुख्य पाठ में रखा गया है; उसका अनुमानित मान पाद-टिप्पणी में दिया गया है।
- source_word: ἀπὸ τῆς γῆς
  choice: भूमि से
  rationale: γῆ का मूल अर्थ यहाँ जल के विपरीत भूमि है; संदर्भ में ‘किनारे से’ भी संभव है, जिसे पाद-टिप्पणी में रखा गया है।
- source_word: ἀπεῖχεν
  choice: दूर थी
  rationale: स्थानिक दूरी व्यक्त करने वाला यह स्वाभाविक हिन्दी रूप है।
- source_word: βασανιζόμενον
  choice: बुरी तरह टकराई जा रही थी
  rationale: समुद्री संदर्भ में क्रिया नाव पर लहरों के प्रचंड प्रहार और उससे उत्पन्न कष्ट को व्यक्त करती है; यह रूप मनोवैज्ञानिक अर्थ थोपे बिना तीव्रता बनाए रखता है।
- source_word: ὑπὸ τῶν κυμάτων
  choice: लहरों से
  rationale: यह यूनानी कर्मवाच्य में प्रहार के कारक को सीधे व्यक्त करता है।
- source_word: ἐναντίος
  choice: उसके विरुद्ध
  rationale: हवा नाव की दिशा के प्रतिकूल थी; ‘उसके’ से संदर्भगत लक्ष्य स्पष्ट होता है, जो यूनानी में निहित है।
- source_word: δὲ
  choice: पर
  rationale: यह यीशु की भूमि पर स्थिति से नाव की कठिन दशा की ओर हल्का संक्रमण और विरोध दर्शाता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह नाव की दुर्दशा का कारण स्पष्ट रूप से प्रस्तुत करता है।
