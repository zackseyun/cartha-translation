  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: hi
  text: जब वह नाव से उतरकर किनारे पर आया[a], तो उसने एक बड़ी भीड़ देखी। उसे उन पर गहरी करुणा हुई, और उसने उनके बीमार लोगों को चंगा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “जब वह बाहर निकला” या “बाहर आकर।” संदर्भ में सम्भवतः आशय नाव से उतरकर किनारे पर आने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: जब वह नाव से उतरकर किनारे पर आया
  rationale: मूल शब्द का सामान्य अर्थ ‘बाहर निकलना’ है। पिछले प्रसंग में यीशु नाव में था, इसलिए यहाँ किनारे पर आने का भाव संदर्भानुकूल और स्वाभाविक है; ‘नाव से उतरकर’ संदर्भ को स्पष्ट करता है, इसलिए शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: εἶδεν
  choice: उसने ... देखी
  rationale: ὁράω के इस रूप का सीधा और स्वाभाविक हिन्दी अनुवाद ‘देखा/देखी’ है; ‘भीड़’ के स्त्रीलिंग के अनुसार ‘देखी’ प्रयुक्त हुआ है।
- source_word: πολὺν ὄχλον
  choice: एक बड़ी भीड़
  rationale: πολύς की परिमाणात्मक शक्ति और ὄχλος के सामूहिक अर्थ को आधुनिक, सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: उसे उन पर गहरी करुणा हुई
  rationale: σπλαγχνίζομαι साधारण दया से बढ़कर भीतर तक अनुभव की गई करुणा व्यक्त करता है। ‘गहरी करुणा हुई’ इसका भाव स्वाभाविक हिन्दी में बिना अनावश्यक विस्तार के देता है।
- source_word: ἐθεράπευσεν
  choice: चंगा किया
  rationale: इस प्रसंग में θεραπεύω शारीरिक रोग से आरोग्य करने को दर्शाता है। ‘चंगा किया’ बाइबलीय हिन्दी में परिचित, स्पष्ट और वर्तमान प्रयोग में समझने योग्य है।
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: उनके बीमारों को
  rationale: संज्ञा के रूप में प्रयुक्त ἀρρώστους और संबंधसूचक αὐτῶν की संक्षिप्तता बनाए रखता है; आशय भीड़ से जुड़े बीमार लोगों से है।
theological_decisions:
- issue: यीशु की भावनात्मक प्रतिक्रिया का अनुवाद
  choice: उसे उन पर गहरी करुणा हुई
  alternative: वह उनके लिए करुणा से भर गया
  rationale: यह रूप यीशु की करुणा को उसके द्वारा बीमारों को चंगा करने से स्पष्ट रूप से जोड़ता है और मूल की भावनात्मक तीव्रता को बनाए रखता है, पर उससे अधिक कोई मनोवैज्ञानिक या सिद्धान्तगत अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। वाक्य को हिन्दी की स्वाभाविक लय के लिए दो वाक्यों में रखा गया है। ‘गहरी करुणा’ मूल क्रिया की प्रबल भावात्मक शक्ति को व्यक्त करती है।
