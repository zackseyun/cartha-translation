id: MAT.14.19
reference: Matthew 14:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: hi
  text: और उसने भीड़ को घास पर बैठ जाने की आज्ञा दी। फिर उसने वे पाँच रोटियाँ और दो मछलियाँ लीं, स्वर्ग की ओर आँखें उठाकर आशीष दी[a], और रोटियाँ तोड़कर शिष्यों को दीं; और शिष्यों ने रोटियाँ भीड़ को दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर को धन्य कहा” अथवा “आशीष की प्रार्थना की।” यूनानी में केवल “आशीष दी” है; इसका कर्म स्पष्ट रूप से नहीं कहा गया है।
    reason: मूल पाठ में εὐλόγησεν का कर्म अनिर्दिष्ट है; टिप्पणी वास्तविक भाषिक और धार्मिक अस्पष्टता सुरक्षित रखती है।
lexical_decisions:
- source_word: κελεύσας
  choice: आज्ञा दी
  rationale: यह शब्द स्पष्ट निर्देश अथवा आदेश का भाव रखता है; हिन्दी में यह स्वाभाविक रूप से मुख्य क्रिया से पहले की कार्रवाई बताता है।
- source_word: τοὺς ὄχλους
  choice: भीड़
  rationale: यूनानी बहुवचन एकत्र जनसमूहों को दर्शाता है; हिन्दी में सामूहिक अर्थ वाला ‘भीड़’ अधिक स्वाभाविक है।
- source_word: ἀνακλιθῆναι
  choice: बैठकर भोजन करने
  rationale: क्रिया भोजन के लिए टिककर या अधलेटा होकर बैठने को सूचित करती है। केवल ‘बैठने’ की तुलना में यह भोजन-संदर्भ को बचाता है, जबकि शाब्दिक ‘लेटने’ से आधुनिक पाठक भ्रमित हो सकता है।
- source_word: ἐπὶ τοῦ χόρτου
  choice: घास पर
  rationale: स्थान का सीधा और संक्षिप्त अनुवाद; मरकुस से ‘हरी’ जैसा अतिरिक्त विवरण नहीं जोड़ा गया।
- source_word: τοὺς πέντε ἄρτους
  choice: वे पाँच रोटियाँ
  rationale: इस प्रसंग में ἄρτοι छोटी रोटियों को दर्शाता है; ‘रोटियाँ’ सामान्य हिन्दी पाठक के लिए स्वाभाविक है।
- source_word: τοὺς δύο ἰχθύας
  choice: दो मछलियाँ
  rationale: स्रोत के बहुवचन को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: स्वर्ग की ओर आँखें उठाकर
  rationale: यूनानी वाक्यांश की दिशा और शारीरिक क्रिया दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: εὐλόγησεν
  choice: आशीष दी
  rationale: यूनानी में कर्म स्पष्ट नहीं है; इसलिए हिन्दी में भी ‘उन्हें’ अथवा ‘परमेश्वर को’ जोड़कर अस्पष्टता नहीं मिटाई गई।
- source_word: κλάσας
  choice: रोटियाँ तोड़कर
  rationale: यूनानी कृदंत देने से पहले हुई क्रिया बताता है; संदर्भ से निहित कर्म को स्पष्ट किया गया है।
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: शिष्यों को दीं
  rationale: स्त्रीलिंग बहुवचन क्रिया का संबंध रोटियों से स्पष्ट रहता है और अनावश्यक पुनरावृत्ति टलती है।
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: और शिष्यों ने उन्हें भीड़ को दिया
  rationale: यूनानी में पिछली क्रिया ‘दिया’ लुप्त किंतु समझी हुई है; हिन्दी की स्पष्टता के लिए उसे दोहराया गया है। ‘उन्हें’ रोटियों की ओर संकेत करता है।
theological_decisions:
- issue: εὐλόγησεν में आशीष का कर्म
  choice: 'मुख्य पाठ में कर्म को अनिर्दिष्ट रखा: ‘आशीष दी’'
  alternative: ‘परमेश्वर को धन्य कहा/आशीष दी’ अथवा ‘रोटियों और मछलियों को आशीष दी’
  rationale: यूनानी पाठ क्रिया का कर्म नहीं बताता। यह भोजन से पहले परमेश्वर को धन्य कहने या भोजन पर आशीष देने की ओर समझा जा सकता है; किसी एक व्याख्या को मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। प्राचीन भोजन-मुद्रा को शाब्दिक ‘लेटना’ कहने के बजाय ‘बैठकर भोजन करना’ कहा गया है। मुख्य पाठ में [a] ठीक उसी स्थान पर है जहाँ εὐλόγησεν की अस्पष्टता उत्पन्न होती है।
