base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: hi
  text: यीशु ने तुरंत हाथ बढ़ाकर उसे पकड़ लिया और उससे कहा, “अल्पविश्वासी, तुमने संदेह क्यों किया?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम क्यों डगमगाए?” यूनानी क्रिया संदेह करने के साथ-साथ हिचकने या डगमगाने का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: तुरंत
  rationale: यह क्रिया की तात्कालिकता और वर्णन की तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: —
  rationale: यहाँ संयोजक हल्का संक्रमण या विरोध प्रकट करता है; हिन्दी में अलग शब्द जोड़ने के बजाय वाक्य-प्रवाह से उसका भाव पर्याप्त रूप से व्यक्त होता है।
- source_word: ἐκτείνας τὴν χεῖρα
  choice: हाथ बढ़ाकर
  rationale: यह कृदन्त वाक्यांश की ठोस क्रिया और उसके बाद पकड़ने की क्रमिकता को सहज हिन्दी में बनाए रखता है।
- source_word: ἐπελάβετο αὐτοῦ
  choice: उसे पकड़ लिया
  rationale: यह किसी को थाम लेने या पकड़ लेने का अर्थ स्पष्ट करता है और बचाव की रीति के बारे में अनावश्यक विवरण नहीं जोड़ता।
- source_word: λέγει αὐτῷ
  choice: उससे कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर हिन्दी कथा-शैली में भूतकाल ‘कहा’ अधिक स्वाभाविक है और घटना की जीवंतता को अनावश्यक काल-परिवर्तन के बिना व्यक्त करता है।
- source_word: Ὀλιγόπιστε
  choice: अल्पविश्वासी
  rationale: यह सीधे संबोधन को संक्षिप्त रूप में रखता है और विश्वास की कमी को व्यक्त करता है, पर पूर्ण अविश्वास का अर्थ नहीं देता।
- source_word: εἰς τί
  choice: क्यों
  rationale: इस प्रसंग में प्रश्नवाचक पदबंध का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: ἐδίστασας
  choice: संदेह किया
  rationale: यह सामान्य पाठक के लिए स्पष्ट है; यूनानी क्रिया में डगमगाने या हिचकने की छाया भी हो सकती है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: Ὀλιγόπιστε में πίστις से संबंधित भाव
  choice: अल्पविश्वासी
  alternative: कम विश्वास वाले
  rationale: यह पतरस को पूर्णतः विश्वासहीन नहीं ठहराता, बल्कि उसके विश्वास की कमी पर यीशु की फटकार को बनाए रखता है। संक्षिप्त संबोधन यूनानी एकवचन संबोधन के निकट भी है।
- issue: ἐδίστασας का अर्थ-क्षेत्र
  choice: संदेह किया
  alternative: डगमगाए
  rationale: ‘संदेह किया’ मुख्य अर्थ को स्पष्ट रखता है, जबकि पादटिप्पणी यह बताती है कि यहाँ क्षणिक हिचक या डगमगाहट का भाव भी संभव है।
