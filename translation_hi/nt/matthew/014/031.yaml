  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘तुम’ एकवचन संबोधन को स्वाभाविक रूप से व्यक्त करता है। ‘अल्पविश्वासी’ पारंपरिक धार्मिक शब्दावली से परिचित रहते हुए पूर्ण अविश्वास का अतिशयोक्तिपूर्ण अर्थ नहीं देता।
