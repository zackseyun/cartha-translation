id: MAT.14.15
reference: Matthew 14:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: hi
  text: शाम होने पर चेले यीशु के पास आए और बोले, “यह जगह सुनसान है[a] और बहुत देर हो चुकी है[b]। भीड़ को विदा कर दे, ताकि लोग गाँवों में जाकर अपने लिए खाना खरीद लें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह जगह निर्जन है।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “समय पहले ही निकल चुका है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: शाम होने पर
  rationale: यह संबंधकारक निरपेक्ष रचना समय का परिवर्तन बताती है। ‘शाम होने पर’ आधुनिक हिन्दी में स्वाभाविक है; δέ की हल्की कथात्मक संक्रमण-भूमिका के लिए अलग शब्द जोड़ना आवश्यक नहीं।
- source_word: προσῆλθον αὐτῷ
  choice: यीशु के पास आए
  rationale: प्रसंग में αὐτῷ का संकेत यीशु की ओर है। नाम का प्रयोग हिन्दी में सर्वनाम-संदर्भ को स्पष्ट और सहज बनाता है।
- source_word: οἱ μαθηταὶ
  choice: चेले
  rationale: ‘चेले’ μαθηταί का सामान्य, सुबोध और बाइबलीय हिन्दी प्रतिशब्द है; निश्चित समूह प्रसंग से स्पष्ट है।
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: यह जगह सुनसान है
  rationale: ἔρημος यहाँ ऐसी जगह बताता है जहाँ आबादी या बस्ती नहीं है। ‘सुनसान’ इस व्यावहारिक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: बहुत देर हो चुकी है
  rationale: शाब्दिक अर्थ ‘समय/घड़ी पहले ही निकल चुकी है’ है, पर प्रसंग में यह दिन बहुत ढल जाने का मुहावरेदार कथन है।
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: भीड़ को विदा कर दे
  rationale: ἀπολύω यहाँ लोगों को जाने देने या विदा करने के अर्थ में है। हिन्दी में सामूहिक ‘भीड़’ स्वाभाविक है।
- source_word: ἵνα ἀπελθόντες εἰς τὰς κώμας
  choice: ताकि लोग गाँवों में जाकर
  rationale: ἵνα उद्देश्य बताता है और ἀπελθόντες पहले जाकर फिर खरीदने की क्रिया दर्शाता है। ‘लोग’ जोड़ने से सामूहिक ‘भीड़’ के बाद बहुवचन क्रिया स्वाभाविक रहती है।
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: अपने लिए खाना खरीद लें
  rationale: यह βρώματα के सामान्य अर्थ ‘खाना’ और ἑαυτοῖς के आत्मवाचक बल, दोनों को स्पष्ट रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। यीशु से सीधे संबोधन में प्रसंगानुकूल एकवचन ‘दे’ प्रयुक्त है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनकी सामग्री से मेल नहीं खाता था; स्रोत यूनानी के अनुसार [a] को ἔρημος और [b] को ἡ ὥρα ἤδη παρῆλθεν के साथ रखा गया है।
