  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: hi
  text: उसने कहा, “आओ।” तब पतरस नाव से नीचे उतरा, पानी पर चला और यीशु की ओर आया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु के पास आया।” यूनानी पद का अर्थ यीशु की दिशा में आना है; वह यहाँ पहुँच जाने पर आवश्यक रूप से बल नहीं देता।
    reason: वैकल्पिक अनुवाद
lexical_decisions:
- source_word: Ἐλθέ
  choice: आओ
  rationale: यह ἔρχομαι का आदेशात्मक रूप है और सीधे बुलावे को व्यक्त करता है। “आओ” आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और मूल आदेश के अनुरूप है।
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: नाव से नीचे उतरा
  rationale: καταβὰς नीचे उतरने की पहले हुई क्रिया बताता है। हिन्दी में मुख्य क्रियाओं के क्रम के साथ “नाव से नीचे उतरा” स्वाभाविक रूप से घटनाक्रम को बनाए रखता है।
- source_word: πλοίου
  choice: नाव
  rationale: गलील झील के इस प्रसंग में πλοῖον के लिए “नाव” आधुनिक हिन्दी का सबसे उपयुक्त और सहज शब्द है।
- source_word: περιεπάτησεν
  choice: चला
  rationale: यहाँ περιπατέω सामान्य रूप से पैदल चलने की क्रिया बताता है। “चला” पर्याप्त है और “चलने लगा” जैसी अतिरिक्त आरंभिक छाया नहीं जोड़ता।
- source_word: ἐπὶ τὰ ὕδατα
  choice: पानी पर
  rationale: ἐπί के साथ यह पद पानी की सतह पर गति को दर्शाता है। हिन्दी में “पानी पर” स्वाभाविक है और चमत्कारिक क्रिया को स्पष्ट रखता है।
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: और यीशु की ओर आया
  rationale: πρός यीशु की दिशा में गति पर बल देता है। “की ओर आया” दिशा को सुरक्षित रखता है और यह अनिवार्य रूप से नहीं कहता कि पतरस उनके पास पहुँच गया।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है। प्रसंग में “तब” हिन्दी कथा-प्रवाह को स्वाभाविक रखता है और अनावश्यक विरोध नहीं दर्शाता।
theological_decisions:
- issue: पतरस की यीशु की ओर गति का वर्णन
  choice: यीशु की ओर आया
  alternative: यीशु के पास आया
  rationale: यूनानी πρός दिशा को व्यक्त करता है, जबकि “के पास आया” पहुँच जाने का अधिक स्पष्ट अर्थ दे सकता है। चुना हुआ अनुवाद मूल कथन की दिशात्मकता और कथा के तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे वाक्य और सामान्य शब्द मूल यूनानी के संक्षिप्त कथा-विन्यास को बनाए रखते हैं। पाद-टिप्पणी का चिह्न उसी वाक्यांश के बाद रखा गया है जिससे वह संबंधित है।
