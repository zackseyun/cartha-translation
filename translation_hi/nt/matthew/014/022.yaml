id: MAT.14.22
reference: Matthew 14:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: hi
  text: और तुरन्त यीशु ने चेलों को विवश किया कि वे नाव पर चढ़ें और यीशु से पहले उस पार चले जाएँ, जब तक कि वह भीड़ को विदा कर दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: तुरन्त
  rationale: यह क्रियाविशेषण काम के बिना विलंब होने और कथा में तीव्र परिवर्तन को व्यक्त करता है।
- source_word: ἠνάγκασεν
  choice: विवश किया
  rationale: यह चुनाव प्रबल आग्रह या बाध्यता का भाव बनाए रखता है, पर शारीरिक बल का अनावश्यक संकेत नहीं देता।
- source_word: τοὺς μαθητάς
  choice: चेलों को
  rationale: संदर्भ में ये पहले से पहचाने हुए चेले हैं; हिन्दी में संबंध स्वाभाविक रूप से समझ में आता है।
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: नाव पर चढ़ें
  rationale: नाव में सवार होने की क्रिया के लिए यह स्वाभाविक आधुनिक हिन्दी है।
- source_word: πλοῖον
  choice: नाव
  rationale: संदर्भ एक पहचानी हुई नाव की ओर संकेत करता है; हिन्दी में यहाँ अलग निश्चित उपपद की आवश्यकता नहीं है।
- source_word: προάγειν αὐτόν
  choice: उनसे पहले ... चले जाएँ
  rationale: यह शिष्यों के यीशु से आगे प्रस्थान करने का अर्थ स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς τὸ πέραν
  choice: उस पार
  rationale: जलाशय के दूसरी ओर जाने के लिए यह संक्षिप्त और प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: ἕως οὗ ἀπολύσῃ
  choice: जब तक कि वह ... विदा कर दे
  rationale: यह यूनानी subjunctive के मुख्य क्रिया के सापेक्ष भावी सीमाबिंदु को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπολύσῃ τοὺς ὄχλους
  choice: भीड़ों को विदा कर दे
  rationale: ἀπολύω यहाँ लोगों को जाने देने या भेज देने का अर्थ रखता है; 'विदा कर दे' वर्तमान हिन्दी में स्पष्ट है।
- source_word: ὄχλους
  choice: भीड़ों
  rationale: यूनानी में स्पष्ट बहुवचन है, इसलिए सामान्य एकवचन 'भीड़' के बजाय बहुवचन सुरक्षित रखा गया है।
theological_decisions:
- issue: ἠνάγκασεν में बाध्यता की तीव्रता
  choice: विवश किया
  alternative: आग्रह किया / कहा
  rationale: मूल क्रिया साधारण अनुरोध या आदेश से अधिक प्रबल है; फिर भी पाठ शारीरिक बल की विधि नहीं बताता।
- issue: यीशु का नाम अंतर्निहित कर्ता के रूप में
  choice: यीशु को स्पष्ट किया
  alternative: उसने
  rationale: पद को स्वतंत्र रूप से पढ़ने पर हिन्दी में कर्ता स्पष्ट रखने के लिए नाम जोड़ा गया है; पहचान निकटवर्ती संदर्भ से निश्चित है और इससे कोई नया धर्मवैचारिक दावा नहीं जुड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। 'विवश किया' मूल की तीव्रता रखता है, जबकि 'नाव पर चढ़ें', 'उस पार' और 'विदा कर दे' स्वाभाविक कथात्मक भाषा बनाए रखते हैं।
