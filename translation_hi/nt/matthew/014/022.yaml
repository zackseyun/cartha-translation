revisions:
- from: और तुरन्त यीशु ने चेलों को विवश किया कि वे नाव पर चढ़ें और उनसे पहले उस पार चले जाएँ, जब तक कि वह भीड़ों को विदा कर दे।
  to: और तुरन्त यीशु ने चेलों को विवश किया कि वे नाव पर चढ़ें और यीशु से पहले उस पार चले जाएँ, जब तक कि वह भीड़ को विदा कर दे।
  rationale: The revision explicitly identifies Jesus as the one whom the disciples are to precede, resolving the source-level pronoun error. It also uses idiomatic Hindi collective wording for the crowds while retaining the meaning that Jesus sends the assembled people away.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:33:23Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys εὐθέως, ἠνάγκασεν, boarding the boat, the destination, and the prospective limit 'until he dismisses/sends away.' However, 'उनसे पहले' ordinarily means 'before them' and therefore reverses or obscures the referent of αὐτόν ('him,' Jesus).
  naturalness: The sentence is generally clear and suitably modern. Repeating 'यीशु' in the comparative phrase is the most natural way to avoid the pronoun ambiguity. The Greek plural ὄχλους is idiomatically represented by the Hindi collective singular 'भीड़'; 'भीड़ों' is markedly less natural in this context.
  terminology: '''चेले,'' ''विवश किया,'' ''नाव पर चढ़ें,'' and ''विदा कर दे'' are appropriate. ''विवश किया'' retains the strong force of ἠνάγκασεν without specifying a means of coercion.'
  issues:
  - severity: high
    issue: '''उनसे पहले'' does not faithfully express προάγειν αὐτόν.'
    rationale: The plural pronoun 'उनसे' naturally refers to the disciples or another plural antecedent, whereas αὐτόν is singular and refers to Jesus. The comparison must explicitly be with Jesus.
  - severity: low
    issue: '''भीड़ों'' is unnecessarily unnatural in modern Hindi.'
    rationale: Although ὄχλους is plural, Hindi normally uses the collective noun 'भीड़' in this setting. This preserves the referential sense without awkward calquing of Greek number.
  revised_text: और तुरन्त यीशु ने चेलों को विवश किया कि वे नाव पर चढ़ें और यीशु से पहले उस पार चले जाएँ, जब तक कि वह भीड़ को विदा कर दे।
  revised_footnotes: []
  revision_rationale: The revision explicitly identifies Jesus as the one whom the disciples are to precede, resolving the source-level pronoun error. It also uses idiomatic Hindi collective wording for the crowds while retaining the meaning that Jesus sends the assembled people away.
