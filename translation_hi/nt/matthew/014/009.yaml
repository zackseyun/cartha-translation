    text: शाब्दिक रूप से, “उसके साथ भोजन के लिए लेटे हुए लोग।” उस समय भोजन करते समय साथ लेटने की प्रथा सामान्य थी।
    reason: cultural_note
  - marker: b
    text: यूनानी पाठ “दिए जाने” का कर्म स्पष्ट नहीं करता; इसका संकेत पिछले पद में की गई माँग की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: दुखी हुआ, फिर भी
  rationale: अओरिस्ट निष्क्रिय कृदन्त राजा के दुखी होने को व्यक्त करता है; प्रसंग में इसका भाव रियायती है, क्योंकि दुखी होने पर भी वह आज्ञा देता है।
- source_word: ὁ βασιλεὺς
  choice: राजा
  rationale: βασιλεύς का सीधा और प्रसंगानुकूल अर्थ 'राजा' है।
- source_word: διὰ τοὺς ὅρκους
  choice: अपनी शपथों के कारण
  rationale: διά के साथ कर्मकारक कारण बताता है; प्रसंग से स्पष्ट है कि ये राजा द्वारा खाई गई शपथें हैं।
- source_word: τοὺς συνανακειμένους
  choice: अपने साथ भोजन कर रहे लोगों
  rationale: यह उन लोगों को सूचित करता है जो उसके साथ मेज़ पर टिककर भोजन कर रहे थे; मुख्य पाठ में स्वाभाविक आधुनिक हिन्दी रखी गई है और सांस्कृतिक विवरण पाद-टिप्पणी में दिया गया है।
- source_word: ἐκέλευσεν
  choice: आज्ञा दी
  rationale: κελεύω अधिकारपूर्वक आदेश देने का अर्थ रखता है; 'आज्ञा दी' कथात्मक और गरिमापूर्ण हिन्दी है।
- source_word: δοθῆναι
  choice: उसे दिए जाने
  rationale: निष्क्रिय अनन्तरूप का अर्थ 'दिया जाना' है। यूनानी में कर्म निहित है, इसलिए हिन्दी में 'उसे' पूर्व प्रसंग की माँग की ओर संकेत करता है, बिना उसे स्पष्ट रूप से परिभाषित किए।
