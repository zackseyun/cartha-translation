  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: hi
  text: राजा दुखी तो हुआ, पर अपनी शपथों और अपने साथ भोजन कर रहे लोगों[a] के कारण उसने उसे दिए जाने का आदेश दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
