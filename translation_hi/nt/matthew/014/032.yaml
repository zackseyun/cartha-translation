lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह कथा के क्रम को जोड़ता है; ‘और’ बिना अतिरिक्त व्याख्या के यूनानी संयोजक का स्वाभाविक रूप है।
- source_word: ἀναβάντων αὐτῶν
  choice: जब वे … चढ़ गए
  rationale: संबंधकारक निरपेक्ष रचना को स्वाभाविक हिन्दी की कालवाचक उपवाक्य-रचना में व्यक्त किया गया है। ‘चढ़ गए’ ἀναβαίνω के मूल बिंब को बनाए रखते हुए नाव में प्रवेश के संदर्भ में सहज है।
- source_word: εἰς τὸ πλοῖον
  choice: नाव में
  rationale: गलील की झील में प्रयुक्त शिष्यों की नौका के लिए ‘नाव’ आधुनिक हिन्दी में स्वाभाविक है; ‘जहाज़’ अनावश्यक रूप से बड़े जलयान का बोध करा सकता है।
- source_word: ἐκόπασεν
  choice: थम गई
  rationale: κοπάζω यहाँ हवा के रुकने या शांत पड़ने को दर्शाता है। ‘थम गई’ संक्षिप्त, स्वाभाविक और घटना की सीधी अभिव्यक्ति है।
- source_word: ὁ ἄνεμος
  choice: हवा
  rationale: यह यूनानी कर्ता का सीधा और सामान्य आधुनिक हिन्दी समतुल्य है।
theological_decisions:
- issue: प्रकृति पर यीशु के अधिकार का कथात्मक संकेत
  choice: घटना को बिना व्याख्यात्मक विस्तार के सीधे कहना कि हवा थम गई
  alternative: मुख्य पाठ में इसे स्पष्ट रूप से चमत्कारी अधिकार की घोषणा बनाना
  rationale: संदर्भ में घटना का धर्मवैचारिक महत्व प्रकट है, पर यूनानी पाठ इस पद में केवल घटना बताता है; इसलिए अनुवाद अतिरिक्त निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘तो’ हिन्दी की ‘जब … तो’ रचना को स्वाभाविक बनाता है और कोई नया धर्मवैचारिक अर्थ नहीं जोड़ता।
