  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: hi
  text: क्योंकि यूहन्ना उससे कहता रहता था, “तुम्हारे लिए उसे अपनी पत्नी के रूप में रखना व्यवस्था के अनुसार वैध नहीं है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: बार-बार कहता था
  rationale: अपूर्ण भूतकाल यहाँ बीते समय में जारी या दोहराई गई बात को व्यक्त करता है; हिन्दी में यह रूप उस पक्ष को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या व्याख्यात्मक पृष्ठभूमि प्रस्तुत करता है।
- source_word: αὐτῷ
  choice: उससे
  rationale: λέγω के साथ प्रयुक्त सम्प्रदान का स्वाभाविक हिन्दी रूप ‘उससे कहना’ है।
- source_word: ὁ Ἰωάννης
  choice: यूहन्ना
  rationale: मूल पाठ केवल नाम देता है; निकटवर्ती प्रसंग उसकी पहचान स्पष्ट करता है।
- source_word: Οὐκ ἔξεστίν
  choice: व्यवस्था के अनुसार उचित नहीं है
  rationale: ἔξεστιν अनुमति या वैधानिकता को दर्शाता है। प्रसंग में यह नैतिक-व्यवस्थागत निषेध है; यह हिन्दी रूप केवल सामान्य व्यक्तिगत अनुचितता से अधिक स्पष्ट है।
- source_word: σοι
  choice: तुम्हारे लिए
  rationale: अव्यक्तिपरक ἔξεστιν के साथ सम्प्रदान उस व्यक्ति को सूचित करता है जिसके लिए कार्य अनुमत नहीं है।
- source_word: ἔχειν
  choice: रखना
  rationale: यहाँ क्रिया किसी स्त्री को पत्नी या सहचरी के रूप में अपने पास रखने के प्रसंगगत अर्थ में है; ‘रखना’ मूल की संक्षिप्तता बनाए रखता है।
- source_word: αὐτήν
  choice: उसे
  rationale: सर्वनाम का सीधा संदर्भ हेरोदियास से है; ‘पत्नी के रूप में’ जोड़ना मूल से अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: यूहन्ना की फटकार का स्वरूप
  choice: इसे व्यवस्था और नैतिक अनुमति के स्पष्ट निषेध के रूप में व्यक्त किया गया है।
  alternative: “तुम्हारे लिए उसे रखना उचित नहीं है।”
  rationale: ἔξεστιν केवल सामान्य शिष्टता या निजी राय नहीं, बल्कि अनुमति/वैधानिकता का प्रश्न उठाता है। ‘व्यवस्था के अनुसार’ प्रसंग की शक्ति को बनाए रखता है, पर किसी विशेष निषिद्ध व्यवस्था-वचन को पद में नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘बार-बार कहता था’ अपूर्ण भूतकाल की आवृत्तिमूलक या निरंतर शक्ति को सामने लाता है। संबोधन में ‘तुम’ प्रसंग की सीधी भविष्यद्वक्तापूर्ण फटकार के अनुकूल है।
