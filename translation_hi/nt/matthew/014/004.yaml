review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents γάρ, the imperfect ἔλεγεν, the indirect object, and the legal-permissive force of οὐκ ἔξεστίν. However, ‘उसे रखना’ is insufficiently idiomatic in modern Hindi and can suggest merely keeping a person rather than the contextual marital sense of ἔχειν.
  naturalness: ‘तुम्हारे लिए उसे रखना व्यवस्था के अनुसार उचित नहीं है’ is awkward. In particular, ‘उचित’ weakens the legal-permissive sense, while ‘रखना’ without a relational qualifier is unclear and potentially unnatural.
  terminology: ‘व्यवस्था के अनुसार’ appropriately signals the legal-moral context, but ‘वैध नहीं है’ more directly conveys οὐκ ἔξεστιν than ‘उचित नहीं है.’ The marital qualifier is a warranted idiomatic clarification of ἔχειν in this context, not a denominational addition.
  issues:
  - severity: medium
    issue: ‘उसे रखना’ does not naturally convey having Herodias as wife.
    rationale: In this context ἔχειν is an idiom for having a woman as one's wife. Hindi requires a modest relational clarification to communicate this sense accurately.
  - severity: medium
    issue: ‘उचित नहीं है’ softens the force of οὐκ ἔξεστίν.
    rationale: The expression concerns what is permitted/lawful, not merely what is socially or personally appropriate.
  revised_text: क्योंकि यूहन्ना उससे कहता रहता था, “तुम्हारे लिए उसे अपनी पत्नी के रूप में रखना व्यवस्था के अनुसार वैध नहीं है।”
  revised_footnotes:
