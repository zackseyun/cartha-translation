  verdict: revise
  source_fidelity: The draft accurately conveys the sequence of sending and John's decapitation, and the Hindi causative appropriately represents an action carried out through agents. However, “लोगों को” is not expressed in the Greek and unnecessarily specifies the object of πέμψας.
  naturalness: “भेजकर जेल में यूहन्ना का सिर कटवा दिया” is concise, idiomatic modern Hindi narrative prose. “जेल” is a suitable contemporary equivalent of φυλακή.
  terminology: “यूहन्ना” is an established Hindi biblical form for Ἰωάννης. “सिर कटवा दिया” clearly conveys the specific sense of ἀποκεφαλίζω without implying that Herod personally wielded the instrument.
  issues:
