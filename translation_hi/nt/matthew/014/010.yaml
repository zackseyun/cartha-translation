  yaml_path: translation/nt/matthew/014/010.yaml
  text: And he sent and beheaded John in the prison[a].
translation:
  language: hi
  text: और उसने भेजकर जेल में यूहन्ना का सिर कटवा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह साधारण संयोजक कथा को आगे बढ़ाता है; ‘और’ बिना अतिरिक्त कालगत अर्थ जोड़े यूनानी समन्वय को बनाए रखता है।
- source_word: πέμψας
  choice: उसने लोगों को भेजकर
  rationale: यह πέμπω का एओरिस्ट कृदंत है और मुख्य क्रिया से पहले घटित, साधनात्मक कार्रवाई बताता है। ‘लोगों को’ यूनानी में प्रत्यक्ष नहीं है, पर हिंदी में ‘भेजकर’ का आशय स्पष्ट करने और यह दिखाने के लिए स्वाभाविक पूर्ति है कि हेरोदेस ने किसी को भेजा था।
- source_word: ἀπεκεφάλισεν
  choice: सिर कटवा दिया
  rationale: क्रिया का विशिष्ट अर्थ सिर काटना है। यूनानी व्याकरण कार्य का श्रेय कर्ता को देता है, जबकि προηγούμενο कृदंत संकेत करता है कि काम भेजे गए व्यक्तियों द्वारा हुआ; हिंदी का प्रेरणार्थक ‘कटवा दिया’ इस मध्यस्थता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸν Ἰωάννην
  choice: यूहन्ना का
  rationale: व्यक्तिवाचक नाम को प्रचलित हिंदी बाइबिलीय रूप ‘यूहन्ना’ में रखा गया है। ‘यूहन्ना बपतिस्मा देनेवाला’ जोड़ना इस पद के पाठ से अधिक होगा।
- source_word: ἐν τῇ φυλακῇ
  choice: जेल में
  rationale: यह बंदी रखने के ठोस स्थान को दर्शाता है। आधुनिक सामान्य हिंदी में ‘जेल में’ स्पष्ट और स्वाभाविक है; ‘कारागार में’ अधिक औपचारिक और कम बोलचाल का है।
theological_decisions:
- issue: हेरोदेस द्वारा स्वयं हत्या करने या दूसरों से करवाने का प्रश्न
  choice: ‘लोगों को भेजकर ... सिर कटवा दिया’
  alternative: ‘भेजकर ... सिर काट दिया’
  rationale: यूनानी मुख्य क्रिया कार्य को कर्ता से जोड़ती है, पर πέμψας मध्यस्थों को भेजे जाने का संकेत देता है। हिंदी प्रेरणार्थक रचना नैतिक/शासकीय उत्तरदायित्व बनाए रखते हुए यह भ्रम नहीं पैदा करती कि हेरोदेस ने स्वयं तलवार चलाई।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, कथात्मक और गरिमापूर्ण। ‘जेल’ सामान्य पाठकों के लिए सहज है, और ‘सिर कटवा दिया’ मूल की कार्य-कारण संरचना को स्वाभाविक हिंदी में व्यक्त करता है।
