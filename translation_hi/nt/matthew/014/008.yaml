source:
  edition: SBLGNT
  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: hi
  text: तब उसने अपनी माँ के उकसाने पर कहा, “मुझे यहीं एक थाल में बपतिस्मा देने वाले यूहन्ना[a] का सिर दे दीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, पारंपरिक रूप में, “यूहन्ना बपतिस्मा देनेवाला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: उकसाने पर
  rationale: यह निष्क्रिय कृदन्त लड़की पर उसकी माँ के पहले से डाले गए प्रभाव को व्यक्त करता है। प्रसंग में माँ उसे इस माँग के लिए प्रेरित करती है; ‘उकसाने पर’ इस नकारात्मक और प्रेरक भाव को स्वाभाविक हिन्दी में रखता है, बिना औपचारिक निर्देश का अर्थ थोपे।
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: अपनी माँ के
  rationale: ὑπό के साथ संबंधकारक निष्क्रिय क्रिया के कर्ता को दर्शाता है; हिन्दी में ‘अपनी माँ के उकसाने पर’ वही कर्तृत्व स्वाभाविक रूप से व्यक्त करता है।
- source_word: Δός μοι
  choice: मुझे ... दे दीजिए
  rationale: आज्ञार्थक रूप सीधी माँग व्यक्त करता है। राजकीय भोज के प्रसंग में आदरसूचक ‘दीजिए’ स्वाभाविक है और आज्ञा की स्पष्टता बनाए रखता है।
- source_word: φησίν
  choice: कहा
  rationale: यूनानी का ऐतिहासिक वर्तमान हिन्दी कथा-शैली में स्वाभाविक रूप से सामान्य भूतकाल ‘कहा’ से व्यक्त होता है; ‘कहती है’ यहाँ अनावश्यक रूप से असहज होता।
- source_word: ὧδε
  choice: यहीं
  rationale: ‘यहीं’ स्थान-सूचक अर्थ के साथ माँग की तात्कालिकता और बल को भी संक्षेप में व्यक्त करता है।
- source_word: ἐπὶ πίνακι
  choice: एक थाल में
  rationale: πίναξ भोज में परोसने के बड़े पात्र या थाल को दर्शाता है। हिन्दी में सिर लाकर प्रस्तुत करने के लिए ‘थाल में’ स्वाभाविक प्रयोग है, यद्यपि यूनानी पूर्वसर्ग का मूल चित्र ‘ऊपर’ का है।
- source_word: τὴν κεφαλὴν
  choice: सिर
  rationale: मूल की भयावह और ठोस विशिष्टता को सीधे बनाए रखा गया है।
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: बपतिस्मा देने वाले यूहन्ना
  rationale: βαπτιστής यूहन्ना की गतिविधि बताने वाली उपाधि है। ‘बपतिस्मा देने वाला’ इसका अर्थ सामान्य आधुनिक हिन्दी में स्पष्ट रखता है; परिचित संक्षिप्त उपाधि फुटनोट में दी गई है।
theological_decisions:
- issue: βαπτιστής के रूप में यूहन्ना की उपाधि
  choice: बपतिस्मा देने वाले यूहन्ना
  alternative: यूहन्ना बपतिस्मा देनेवाला
  rationale: मुख्य पाठ में वर्णनात्मक बल को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है। जुड़ा हुआ ‘देनेवाला’ हिन्दी बाइबल परंपरा में परिचित है और फुटनोट में वैकल्पिक शैली के रूप में सुरक्षित है; इससे कोई सांप्रदायिक विशेषता नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘तब’ δέ के प्रसंगगत संक्रमण को सहज बनाता है। लड़की की सीधी माँग में आदरसूचक आज्ञार्थक ‘दीजिए’ सामाजिक प्रसंग के अनुकूल है, जबकि माँग की कठोरता अक्षुण्ण रहती है।
