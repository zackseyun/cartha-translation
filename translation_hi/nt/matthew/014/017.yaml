base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: hi
  text: पर उन्होंने उससे कहा, “यहाँ हमारे पास पाँच रोटियों और दो मछलियों के सिवा कुछ नहीं है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहाँ हमारे पास केवल पाँच रोटियाँ और दो मछलियाँ हैं।”
    reason: नकारात्मक अपवाद-वाक्य का अधिक मुहावरेदार हिन्दी विकल्प।
lexical_decisions:
- source_word: οἱ δὲ
  choice: पर उन्होंने
  rationale: लेखयुक्त बहुवचन पद पहले बताए गए शिष्यों की ओर संकेत करता है। δέ पिछले निर्देश के साथ हल्का विरोध दिखाता है, इसलिए स्वाभाविक हिन्दी में ‘पर’ चुना गया।
- source_word: λέγουσιν αὐτῷ
  choice: उससे कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान ‘कहते हैं’ है, पर हिन्दी कथात्मक शैली में भूतकाल ‘कहा’ अधिक स्वाभाविक है। αὐτῷ का एकवचन संबंध ‘उससे’ में सुरक्षित है।
- source_word: Οὐκ ἔχομεν
  choice: हमारे पास ... कुछ नहीं है
  rationale: नकारात्मक स्वामित्व-वाक्य को हिन्दी में ‘हमारे पास ... कुछ नहीं है’ स्वाभाविक और स्रोत के निकट ढंग से व्यक्त करता है।
- source_word: ὧδε
  choice: यहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण है और सीधे ‘यहाँ’ के रूप में व्यक्त होता है।
- source_word: εἰ μὴ
  choice: के सिवा
  rationale: नकारात्मक कथन के बाद εἰ μή अपवाद का अर्थ देता है, इसलिए ‘के सिवा’ चुना गया, न कि शर्तसूचक ‘यदि नहीं’।
- source_word: πέντε ἄρτους
  choice: पाँच रोटियों
  rationale: ἄρτος यहाँ गिनी जा सकने वाली रोटियों को दर्शाता है; ‘रोटियाँ’ सामान्य आधुनिक हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: δύο ἰχθύας
  choice: दो मछलियों
  rationale: ἰχθύας का सामान्य बहुवचन अर्थ ‘मछलियाँ’ है; संख्या के साथ यह हिन्दी में स्पष्ट और स्वाभाविक है।
