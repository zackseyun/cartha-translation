- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: आस-पास के उस पूरे क्षेत्र में खबर भिजवाई
  rationale: यूनानी में भेजी गई वस्तु या संदेश स्पष्ट नहीं है, पर प्रसंग सूचना फैलाने का संकेत देता है। स्वाभाविक हिन्दी के लिए ‘खबर’ स्पष्ट की गई है और पादटिप्पणी में मूल की अनिर्दिष्टता सुरक्षित रखी गई है।
- source_word: προσήνεγκαν αὐτῷ
  choice: उसके पास ले आए
  rationale: इस प्रसंग में προσφέρω का अर्थ लोगों को यीशु के पास लाना है, बलिदान के रूप में अर्पित करना नहीं।
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: सभी बीमारों
  rationale: κακῶς ἔχειν एक मुहावरा है जिसका अर्थ बीमार या अस्वस्थ होना है; ‘सभी बीमारों’ संक्षिप्त और स्वाभाविक हिन्दी है।
