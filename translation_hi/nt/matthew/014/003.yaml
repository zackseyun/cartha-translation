source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: hi
  text: क्योंकि हेरोदेस ने अपने भाई फिलिप्पुस की पत्नी हेरोदियास के कारण यूहन्ना को गिरफ़्तार किया था[a], उसे बाँध दिया था और जेल में डाल दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यूहन्ना को पकड़कर, उसे बाँध दिया था और जेल में डाल दिया था।”
    reason: κρατήσας के अधिक शाब्दिक ‘पकड़कर’ को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है और यूनानी संयोजक के आधारसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κρατήσας
  choice: गिरफ़्तार करके
  rationale: शाब्दिक अर्थ ‘पकड़कर’ है, पर बंदी बनाए जाने के इस प्रसंग में ‘गिरफ़्तार करके’ अभिप्रेत न्यायिक-राजकीय कार्रवाई को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἔδησεν
  choice: बाँध दिया था
  rationale: यह δέω के ठोस अर्थ को बनाए रखता है, पर रस्सी या बेड़ी जैसे साधन को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: जेल में डाल दिया था
  rationale: यह मुहावरेदार हिन्दी अभिव्यक्ति कैद किए जाने का अर्थ साफ़ और स्वाभाविक ढंग से देती है।
- source_word: διὰ Ἡρῳδιάδα
  choice: हेरोदियास के कारण
  rationale: यहाँ διά के साथ कर्मकारक कारण को व्यक्त करता है; ‘के कारण’ उसका सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: γυναῖκα
  choice: पत्नी
  rationale: इस संबंधसूचक रचना में γυνή का अर्थ सामान्य ‘स्त्री’ नहीं, बल्कि ‘पत्नी’ है।
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: अपने भाई फिलिप्पुस की
  rationale: यह स्पष्ट करता है कि फिलिप्पुस हेरोदेस का भाई था और हिन्दी में यूनानी समानाधिकरण का स्वाभाविक रूप देता है।
theological_decisions:
- issue: फिलिप्पुस के साथ हेरोदियास के संबंध का ऐतिहासिक-नैतिक निरूपण
  choice: उसे तटस्थ रूप से ‘अपने भाई फिलिप्पुस की पत्नी हेरोदियास’ कहा गया है।
  alternative: ‘अपने भाई फिलिप्पुस की अवैध पत्नी हेरोदियास’
  rationale: यह पद हेरोदियास की पहचान फिलिप्पुस की पत्नी के रूप में करता है, पर संबंध की अवैधता का आरोप अगले पद में आता है। इसलिए यहाँ वह नैतिक निर्णय पहले से नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘जेल’ आम पाठकों के लिए ‘बंदीगृह’ या ‘कारागार’ से अधिक सहज है; नामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
