  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: hi
  text: पर यीशु ने तुरंत उनसे कहा, “हिम्मत रखो! मैं ही हूँ।[a] मत डरो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “मैं हूँ।” यहाँ यूनानी अभिव्यक्ति सामान्य आत्म-पहचान के रूप में प्रयुक्त हो सकती है, हालाँकि कुछ पाठकों को इसमें ईश्वरीय आत्म-परिचय की सम्भावित प्रतिध्वनि सुनाई देती है।
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: तुरन्त
  rationale: समय की तात्कालिकता को सहज और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: पिछले पद में शिष्यों के भय के विपरीत यीशु की आश्वस्त करने वाली प्रतिक्रिया की ओर हल्का कथात्मक मोड़ दिखाता है।
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: यीशु ने उनसे कहा
  rationale: ग्रीक की बोलने वाली क्रिया और ‘कहते हुए’ कृदन्त को हिन्दी में अनावश्यक दोहराव के बिना स्वाभाविक कथन में समेटता है।
- source_word: Θαρσεῖτε
  choice: हिम्मत रखो
  rationale: बहुवचन आज्ञार्थक का साहस और ढाढ़स देने वाला भाव सरल, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: ἐγώ εἰμι
  choice: यह मैं हूँ
  rationale: तात्कालिक प्रसंग में आत्म-पहचान को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शब्दशः रूप और उसकी सम्भावित धर्मवैचारिक प्रतिध्वनि पादटिप्पणी में सुरक्षित हैं।
- source_word: μὴ φοβεῖσθε
  choice: मत डरो
  rationale: निषेधात्मक आज्ञा का संक्षिप्त, स्वाभाविक और आश्वस्तिपूर्ण हिन्दी रूप है; क्रिया के पक्ष को ‘डरना बंद करो’ कहकर आवश्यकता से अधिक निश्चित नहीं करता।
theological_decisions:
- issue: क्या ἐγώ εἰμι को केवल आत्म-पहचान के रूप में प्रस्तुत किया जाए या ईश्वरीय आत्म-परिचय की स्पष्ट प्रतिध्वनि बनाया जाए
  choice: मुख्य पाठ में प्रसंगानुकूल आत्म-पहचान ‘यह मैं हूँ’
  alternative: ‘मैं हूँ’
  rationale: यहाँ यीशु भयभीत शिष्यों को अपनी पहचान बताकर आश्वस्त करते हैं। फिर भी यूनानी अभिव्यक्ति अधिक शब्दशः ‘मैं हूँ’ है, जिसमें कुछ पाठक ईश्वरीय आत्म-परिचय की सम्भावित प्रतिध्वनि सुनते हैं; इस तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक आश्वासन के अनुकूल। ‘यह मैं हूँ’ साधारण पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी मूल की शब्दशः अभिव्यक्ति और वास्तविक धर्मवैचारिक अस्पष्टता बनाए रखती है।
