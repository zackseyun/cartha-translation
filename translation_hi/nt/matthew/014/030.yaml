id: MAT.14.30
reference: Matthew 14:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: hi
  text: परन्तु तेज़ हवा[a] को देखकर वह डर गया, और जब वह डूबने लगा तो पुकार उठा, “प्रभु, मुझे बचाइए![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रचंड हवा।”
    reason: lexical_alternative
  - marker: b
    text: या, “मुझे छुड़ाइए।” यूनानी क्रिया तत्काल संकट से बचाने के साथ-साथ व्यापक अर्थ में उद्धार करने को भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: को देखकर
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ-साथ होने वाली दृष्टि/अनुभूति बताता है; ‘को देखकर’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पतरस के पहले पानी पर चलने और अब डरने के बीच कथात्मक विरोध को स्पष्ट करता है।
- source_word: ἄνεμον ἰσχυρόν
  choice: तेज़ हवा
  rationale: ἰσχυρός हवा की शक्ति या तीव्रता बताता है; ‘तेज़ हवा’ सामान्य आधुनिक हिन्दी में सहज और सटीक है, जबकि ‘प्रचंड हवा’ अधिक तीव्र वैकल्पिक अर्थ है।
- source_word: ἐφοβήθη
  choice: वह डर गया
  rationale: क्रिया यहाँ भय आरम्भ होने का भाव देती है; ‘डर गया’ केवल स्थायी अवस्था के बजाय उस क्षण हुए परिवर्तन को व्यक्त करता है।
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: जब वह डूबने लगा
  rationale: ἀρξάμενος आरम्भ और καταποντίζεσθαι पानी में धँसने की प्रक्रिया बताते हैं; यह अनुवाद उसे पहले ही डूबकर मर गया बताने से बचता है।
- source_word: ἔκραξεν λέγων
  choice: पुकार उठा
  rationale: यह ऊँची और अत्यावश्यक पुकार का भाव स्वाभाविक हिन्दी में देता है; अलग से ‘कहते हुए’ जोड़ना हिन्दी में अनावश्यक रूप से बोझिल होता।
- source_word: Κύριε
  choice: प्रभु
  rationale: यीशु को सीधे संबोधन में κύριος का सम्मान और मसीही अर्थ-भार बनाए रखता है।
- source_word: σῶσόν με
  choice: मुझे बचाइए
  rationale: आज्ञार्थक रूप की तत्काल और विनतीपूर्ण पुकार को व्यक्त करता है; आदरसूचक ‘बचाइए’ यीशु को किए गए संबोधन के अनुकूल है और क्रिया के व्यापक ‘बचाने’ के अर्थ को भी बनाए रखता है।
theological_decisions:
- issue: यीशु के लिए सीधे संबोधन में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ संबोधन का सम्मान तथा मत्ती में उपस्थित मसीही अर्थ-भार सुरक्षित रखता है, बिना उससे अधिक कोई उपाधि जोड़ने के।
- issue: तत्काल शारीरिक संकट में σῴζω का अनुवाद
  choice: मुझे बचाइए
  alternative: मुझे छुड़ाइए
  rationale: संदर्भ में तत्काल डूबने से बचाव अभिप्रेत है, फिर भी ‘बचाइए’ यूनानी क्रिया के व्यापक उद्धार-संबंधी अर्थ की प्रतिध्वनि को अनावश्यक रूप से संकुचित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुकार उठा’ संकट की तीव्रता व्यक्त करता है, और ‘बचाइए’ आदरसूचक संबोधन के अनुरूप है।
