translation:
  language: hi
  text: उसे मार डालना चाहने पर भी[a], वह भीड़ से डरता था, क्योंकि वे उसे नबी मानते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “और उसे मार डालना चाहते हुए, वह भीड़ से डरता था।” प्रसंग में कृदन्त का भाव रियायती है: वह उसे मार डालना चाहता था, फिर भी भीड़ से डरता था।'
    reason: lexical_alternative
  - marker: b
    text: या, “वे उसे एक नबी समझते थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: चाहता था
  rationale: वर्तमान कृदन्त इच्छा को व्यक्त करता है। मुख्य क्रिया के साथ इसका संबंध प्रसंग में विरोधात्मक है, जिसे स्वाभाविक हिन्दी में ‘लेकिन’ से स्पष्ट किया गया है।
- source_word: ἀποκτεῖναι
  choice: मार डालना
  rationale: यह क्रिया सीधे किसी की जान लेने को दर्शाती है; ‘हत्या करना’ मूल शब्द में निहित न होने वाला अतिरिक्त नैतिक-कानूनी भाव जोड़ सकता है।
- source_word: ἐφοβήθη
  choice: डरता था
  rationale: φοβέομαι का अर्थ ‘डरना’ है। प्रसंग में यह भीड़ के कारण हेरोदेस के संकोच को स्वाभाविक हिन्दी कथन में व्यक्त करता है।
- source_word: τὸν ὄχλον
  choice: भीड़
  rationale: ὄχλος के लिए यह आधुनिक, सहज और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι डरने का कारण प्रस्तुत करता है।
- source_word: ὡς προφήτην αὐτὸν εἶχον
  choice: लोग उसे नबी मानते थे
  rationale: ἔχω के साथ विधेय कर्मकारक वाला यह मुहावरा किसी को किसी रूप में समझने या मानने का भाव देता है। हिन्दी में ‘नबी मानते थे’ इसका स्वाभाविक और सटीक रूप है।
theological_decisions:
- issue: यूनानी पाठ में कर्ता और कर्म की पहचान सर्वनामों से दी गई है
  choice: पद में नाम जोड़ने के बजाय ‘वह’ और ‘उसे’ बनाए रखे गए
  alternative: ‘हेरोदेस यूहन्ना को मार डालना चाहता था’
  rationale: निकटवर्ती प्रसंग से व्यक्तियों की पहचान स्पष्ट होती है। नाम जोड़ना उपयोगी स्पष्टीकरण होता, पर वह यूनानी पद से अधिक स्पष्टता जोड़ देता।
- issue: कृदन्त θέλων और मुख्य क्रिया ἐφοβήθη के बीच संबंध
  choice: विरोधात्मक संबंध को ‘लेकिन’ से व्यक्त किया गया
  alternative: शाब्दिक रूप से ‘और उसे मार डालना चाहते हुए, वह भीड़ से डरा’
  rationale: यूनानी कृदन्त स्वयं संबंध को व्याकरणिक रूप से निर्धारित नहीं करता, पर प्रसंग में इच्छा और भीड़ के भय के बीच रियायती/विरोधात्मक संबंध है। ‘लेकिन’ इसे स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक संरचना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नबी’ सामान्य हिन्दी बाइबिलीय प्रयोग के अनुरूप है। वाक्य में मूल के सर्वनाम सुरक्षित हैं और प्रसंगगत विरोध को स्पष्ट करने के लिए ‘लेकिन’ प्रयुक्त हुआ है।
