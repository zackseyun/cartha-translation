id: MAT.14.12
reference: Matthew 14:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: hi
  text: तब उसके चेले आए, शव[a] उठाया और उसे दफ़नाया। फिर वे यीशु के पास गए और उन्हें यह समाचार दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ मृत देह है।
    reason: ‘शव’ के लिए प्रयुक्त πτῶμα की स्पष्ट मृत-देह संबंधी अर्थवत्ता बताना।
lexical_decisions:
- source_word: προσελθόντες
  choice: आए
  rationale: संदर्भ में यह यूहन्ना के चेलों के घटनास्थल पर आने और आगे की कार्रवाई आरम्भ करने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μαθηταὶ αὐτοῦ
  choice: उसके चेले
  rationale: सर्वनाम सहित यूनानी संरचना को बनाए रखता है; निकटवर्ती संदर्भ से इसका संकेत यूहन्ना बपतिस्मा देनेवाले के चेलों की ओर है।
- source_word: ἦραν
  choice: ले गए
  rationale: αἴρω का मूल भाव उठाने या लेने का है; दफ़नाने के संदर्भ में ‘ले गए’ स्वाभाविक है, यद्यपि इसमें गंतव्य स्पष्ट नहीं किया गया।
- source_word: πτῶμα
  choice: शव
  rationale: यह शब्द विशेष रूप से मृत देह को सूचित करता है; आधुनिक हिन्दी में ‘शव’ सटीक, संक्षिप्त और गरिमापूर्ण है।
- source_word: ἔθαψαν αὐτόν
  choice: उसे दफ़ना दिया
  rationale: θάπτω का सीधा अर्थ दफ़नाना है; ‘उसे’ मूल पाठ के पुल्लिंग सर्वनाम को दर्शाता है और किसी कब्र या समाधि का अतिरिक्त विवरण नहीं जोड़ता।
- source_word: ἐλθόντες
  choice: फिर वे जाकर
  rationale: अगली क्रमिक क्रिया और यीशु तक जाने की गति को सहज हिन्दी कथन में व्यक्त करता है।
- source_word: ἀπήγγειλαν
  choice: इसकी खबर दी
  rationale: क्रिया का अर्थ सूचना देना या खबर पहुँचाना है; ‘इसकी’ प्रसंग में यूहन्ना की मृत्यु और दफ़नाए जाने की सूचना की ओर संकेत करता है।
- source_word: τῷ Ἰησοῦ
  choice: यीशु को
  rationale: हिन्दी बाइबल परंपरा में Ἰησοῦς का मानक रूप ‘यीशु’ है।
theological_decisions:
- issue: ‘उसके चेले’ किसके चेले हैं
  choice: मूल पाठ की तरह ‘उसके चेले’ रखा गया है; संदर्भ में ये यूहन्ना बपतिस्मा देनेवाले के चेले हैं।
  alternative: स्पष्ट करके ‘यूहन्ना के चेले’ कहना, या इसे यीशु के चेलों के रूप में पढ़ना।
  rationale: तत्काल प्रसंग यूहन्ना की मृत्यु का है, इसलिए सर्वनाम स्वाभाविक रूप से यूहन्ना की ओर संकेत करता है। फिर भी मूल की सर्वनामात्मक अभिव्यक्ति बनाए रखने से अनावश्यक स्पष्टीकरण पाठ में नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। ‘चेले’, ‘शव’, ‘दफ़ना दिया’ और ‘खबर दी’ सामान्य पाठक के लिए स्पष्ट हैं; वाक्य-क्रम यूनानी घटनाक्रम को स्वाभाविक हिन्दी में बनाए रखता है।
