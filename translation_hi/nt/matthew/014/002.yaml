  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: hi
  text: और उसने अपने सेवकों से कहा, “यह बपतिस्मा देनेवाला यूहन्ना है। उसे मृतकों में से जीवित किया गया है, और इसी कारण ये शक्तियाँ[a] उसमें काम कर रही हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ये चमत्कारी शक्तियाँ”; अथवा अधिक भावानुसार, “चमत्कार।” यूनानी में शाब्दिक रूप से “शक्तियाँ” है, जो सामर्थ्यपूर्ण कामों में प्रकट होने वाली अलौकिक शक्ति की ओर संकेत करती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: सेवकों
  rationale: παῖς का अर्थ संदर्भ के अनुसार बालक, सेवक या परिचारक हो सकता है। यहाँ हेरोद अपने घराने अथवा दरबार के अधीनस्थ लोगों से बोल रहा है, इसलिए ‘सेवकों’ स्वाभाविक है और पद को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: ὁ βαπτιστής
  choice: बपतिस्मा देनेवाला
  rationale: यह यूनानी पद के कार्यात्मक अर्थ को स्पष्ट और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: ἠγέρθη
  choice: जिलाया गया है
  rationale: यूनानी क्रिया कर्मवाच्य है। यह अनुवाद उस कर्मवाच्य भाव को बनाए रखता है और यह संकेत नहीं देता कि यूहन्ना अपने आप जी उठा।
- source_word: ἀπὸ τῶν νεκρῶν
  choice: मरे हुओं में से
  rationale: यह बहुवचन और ‘में से’ के भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पदबंध के कारणसूचक निष्कर्ष को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: αἱ δυνάμεις
  choice: ये शक्तियाँ
  rationale: δύναμεις यहाँ अलौकिक सामर्थ्य के प्रभावी प्रकटावों की ओर संकेत करता है। ‘शक्तियाँ’ मूल संज्ञा और उसके बहुवचन को बनाए रखता है; ‘ये’ प्रसंग में हेरोद द्वारा सुने गए कार्यों की ओर स्वाभाविक संकेत करता है।
- source_word: ἐνεργοῦσιν
  choice: सक्रिय हैं
  rationale: ἐνεργέω के कार्यरत और प्रभावी होने के भाव को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: यह ἐν के सबसे सीधे स्थान अथवा कार्यक्षेत्र-संबंधी अर्थ को बनाए रखता है; ‘उसके द्वारा’ अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: यूहन्ना के मृतकों में से लौटने का स्वरूप
  choice: उसे मरे हुओं में से जिलाया गया है
  alternative: वह मरे हुओं में से जी उठा है
  rationale: मूल यूनानी में ἠγέρθη कर्मवाच्य है। कर्मवाच्य अनुवाद व्याकरण को सुरक्षित रखता है और कर्ता के विषय में पाठ से आगे कोई दावा नहीं करता।
- issue: δυνάμεις का संदर्भगत अर्थ
  choice: ये शक्तियाँ उसमें सक्रिय हैं
  alternative: ये चमत्कारी शक्तियाँ उसमें सक्रिय हैं / ये सामर्थ्य के काम उसके द्वारा हो रहे हैं
  rationale: संदर्भ अलौकिक सामर्थ्य की ओर संकेत करता है, पर मुख्य पाठ में ‘शक्तियाँ’ रखने से मूल शब्द का रूप और कुछ अर्थगत खुलापन सुरक्षित रहता है। पादटिप्पणी संभावित संदर्भगत अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘बपतिस्मा देनेवाला’ स्थापित धार्मिक शब्दावली को कार्यात्मक स्पष्टता के साथ रखता है; शेष वाक्य में अनावश्यक संस्कृतनिष्ठता से बचा गया है।
