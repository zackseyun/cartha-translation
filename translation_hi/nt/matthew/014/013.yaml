  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: hi
  text: जब यीशु ने यह सुना, तो वह वहाँ से नाव से एक सुनसान जगह[a] पर अकेले चले गए। पर जब भीड़ों ने यह सुना, तो वे नगरों[b] से पैदल उनके पीछे चल पड़ीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘निर्जन जगह’ अथवा ‘एकांत जगह।’ यूनानी शब्द किसी अलग-थलग या आबादी से दूर स्थान का वर्णन करता है; इसका अर्थ आवश्यक रूप से रेतीला मरुस्थल नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘शहरों से।’ प्रसंग के अनुसार यूनानी शब्द का अर्थ नगर या शहर हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: जब यीशु ने यह सुना, तो
  rationale: कालवाचक कृदंत को स्वाभाविक हिन्दी में ‘जब...तो’ से व्यक्त किया गया है। δέ यहाँ प्रबल विरोध के बजाय कथा को आगे बढ़ाता है, इसलिए पहले वाक्य में अलग संयोजक नहीं जोड़ा गया।
- source_word: ἀνεχώρησεν
  choice: चले गए
  rationale: यहाँ क्रिया परिस्थितियों के बाद उस स्थान से हटकर चले जाने को बताती है। ‘चले गए’ आधुनिक हिन्दी में सहज है और ‘पीछे हटे’ जैसे सैन्य या भय-संबंधी आशय को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἐκεῖθεν ἐν πλοίῳ
  choice: वहाँ से नाव में
  rationale: स्थान से प्रस्थान और यात्रा के साधन दोनों को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: εἰς ἔρημον τόπον
  choice: एक सुनसान जगह पर
  rationale: ἔρημος यहाँ निर्जन या आबादी से अलग स्थान को सूचित करता है, आवश्यक रूप से रेतीले मरुस्थल को नहीं। ‘सुनसान जगह’ सामान्य पाठक के लिए स्पष्ट और भौगोलिक रूप से अनिर्णायक है।
- source_word: κατ’ ἰδίαν
  choice: अकेले
  rationale: यह वाक्यांश अलग या निजी रूप से होने का भाव देता है। ‘अकेले’ संक्षिप्त और प्रसंगानुकूल है, बिना यह मानने के कि आगे शिष्य उनके साथ नहीं थे।
- source_word: οἱ ὄχλοι
  choice: भीड़ों
  rationale: मूल का बहुवचन सुरक्षित रखा गया है; ‘भीड़’ का हिन्दी बहुवचन ‘भीड़ों’ यहाँ विभिन्न नगरों से आए जनसमूहों के लिए उपयुक्त है।
- source_word: ἠκολούθησαν αὐτῷ πεζῇ
  choice: वे ... पैदल उनके पीछे हो लीं
  rationale: πεζῇ को ‘पैदल’ और वास्तविक रूप से पीछे जाने की क्रिया को स्वाभाविक हिन्दी ‘पीछे हो लीं’ से व्यक्त किया गया है; यहाँ शिष्यत्व का अतिरिक्त धार्मिक अर्थ नहीं जोड़ा गया।
- source_word: ἀπὸ τῶν πόλεων
  choice: नगरों से
  rationale: πόλις बस्ती के आकार के अनुसार नगर या शहर हो सकता है। ‘नगर’ आधुनिक मानक हिन्दी में व्यापक और गरिमापूर्ण विकल्प है।
theological_decisions:
- issue: यीशु के चले जाने का उद्देश्य
  choice: क्रिया को तटस्थ रूप में ‘चले गए’ कहा गया है और केवल इतना रखा गया है कि वे सुनसान जगह पर अकेले गए।
  alternative: सुरक्षा के लिए पीछे हटे; शोक या प्रार्थना करने के लिए एकांत में गए
  rationale: पद समाचार सुनने और वहाँ से चले जाने के बीच क्रम बताता है, पर उद्देश्य स्पष्ट नहीं करता। अनुवाद किसी एक संभावित मंशा को निश्चित नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘सुनसान जगह’ मरुस्थल की अनावश्यक छवि से बचाता है। मूल पद में कोई ऐसी पाठकीय टिप्पणी आवश्यक नहीं लगी जिसे पादटिप्पणी में देना पड़े; इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
