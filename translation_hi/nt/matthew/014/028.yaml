  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: hi
  text: तब पतरस ने उसे उत्तर दिया, “प्रभु, यदि आप ही हैं, तो मुझे आज्ञा दीजिए कि मैं पानी[a] पर आपके पास आऊँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ ‘जल’ बहुवचन में है।
    reason: स्रोत में τὰ ὕδατα बहुवचन है, जबकि स्वाभाविक आधुनिक हिन्दी में सामूहिक एकवचन ‘पानी’ अधिक सहज है।
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: तब पतरस ने उससे कहा
  rationale: यह यूनानी का सामान्य कथात्मक उत्तर-सूत्र है। ‘तब’ प्रसंग का संबंध स्वाभाविक ढंग से दिखाता है, और ‘उससे कहा’ आधुनिक हिन्दी में ‘उसे उत्तर दिया’ से अधिक सहज रहते हुए αὐτῷ को व्यक्त करता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यीशु के लिए संबोधन में यह सम्मान और संभावित मसीही-धार्मिक महत्त्व दोनों को सुरक्षित रखता है; इसे केवल ‘स्वामी’ या ‘महोदय’ तक सीमित नहीं करता।
- source_word: εἰ σὺ εἶ
  choice: यदि आप ही हैं
  rationale: बलयुक्त σὺ को ‘आप ही’ से व्यक्त किया गया है। यह प्रसंग में उस व्यक्ति की पहचान यीशु के रूप में सुनिश्चित करने का भाव स्वाभाविक हिन्दी में रखता है।
- source_word: κέλευσόν με
  choice: मुझे आज्ञा दीजिए
  rationale: κελεύω अधिकारपूर्वक निर्देश देने को बताता है। विनम्र संबोधन के अनुरूप ‘दीजिए’ और अर्थ के बल के लिए ‘आज्ञा’ उपयुक्त हैं।
- source_word: ἐλθεῖν πρὸς σὲ
  choice: आपके पास आऊँ
  rationale: यीशु की ओर गति को आधुनिक हिन्दी में सहजता से व्यक्त करता है और ‘आना’ का दृष्टिकोण बनाए रखता है।
- source_word: ἐπὶ τὰ ὕδατα
  choice: पानी पर
  rationale: यूनानी में ὕδατα बहुवचन है, पर आधुनिक हिन्दी में ‘पानियों पर’ अस्वाभाविक होगा। ‘पानी पर’ आशय स्पष्ट और स्वाभाविक रखता है; स्रोत का वचन-भेद पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: यीशु के लिए κύριε संबोधन का बल
  choice: प्रभु
  alternative: स्वामी / महोदय
  rationale: मत्ती में यीशु के लिए यह संबोधन केवल शिष्टाचार से अधिक धार्मिक अर्थ रख सकता है। ‘प्रभु’ उस संभावना को बनाए रखता है, पर इस पद में उसे किसी एक निश्चित मसीही दावे के रूप में नहीं बढ़ाता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। यीशु के लिए आदरसूचक ‘आप’ और ‘दीजिए’ प्रयुक्त हैं। ‘पतरस’ प्रचलित हिन्दी बाइबलीय नाम-रूप है।
