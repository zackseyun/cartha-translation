  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: hi
  text: इसलिए उसने शपथ खाकर उससे वादा किया कि वह जो कुछ भी माँगेगी, उसे दे देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅθεν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निकले परिणाम को व्यक्त करता है और आधुनिक हिन्दी में कारण-परिणाम का संबंध स्वाभाविक रूप से दिखाता है।
- source_word: μετὰ ὅρκου
  choice: शपथ खाकर
  rationale: यह शपथ के साथ किए गए वादे का भाव स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὡμολόγησεν
  choice: वादा किया
  rationale: इस प्रसंग में क्रिया दृढ़ प्रतिबद्धता या प्रतिज्ञा करने के अर्थ में है, न कि अंगीकार करने के अर्थ में।
- source_word: αὐτῇ
  choice: उससे
  rationale: यह लड़की को संबोधित अप्रत्यक्ष कर्म है; हिन्दी में ‘उससे वादा किया’ स्वाभाविक प्रयोग है।
- source_word: δοῦναι
  choice: दे देगा
  rationale: हिन्दी में आश्रित कथन के भीतर भविष्यकालीन प्रतिज्ञा को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ὃ ἐὰν αἰτήσηται
  choice: जो कुछ भी माँगेगी
  rationale: ἐάν के साथ संभावनार्थक उपवाक्य भविष्य की अनिर्धारित और खुली माँग व्यक्त करता है; ‘जो कुछ भी’ इस व्यापकता को सुरक्षित रखता है।
