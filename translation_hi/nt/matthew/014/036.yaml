  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: hi
  text: और वे उससे विनती करते रहे कि वे केवल उसके वस्त्र की किनारी[a] को छू लें; और जितने लोगों ने उस किनारी को छुआ, वे स्वस्थ हो गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छोर’, ‘झालर’ अथवा ‘लटकन’; यूनानी शब्द वस्त्र की किनारी या उससे जुड़े लटकन को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पूरी तरह स्वस्थ हो गए’; यूनानी क्रिया के व्यापक अर्थ ‘बचाए गए’ या ‘सुरक्षित रखे गए’ भी हो सकते हैं, पर यहाँ प्रसंग शारीरिक चंगाई का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: विनती करते रहे
  rationale: अपूर्ण भूतकाल का रूप लगातार या बार-बार की जा रही विनती को दर्शाता है; यह आधुनिक हिन्दी में आग्रह की तीव्रता भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἵνα μόνον ἅψωνται
  choice: कि वे केवल ... छू लें
  rationale: ἵνα के साथ संभावनार्थक क्रिया उनकी विनती की विषय-वस्तु बताती है, और μόνον इस बात पर बल देता है कि वे बस छूना चाहते थे।
- source_word: τοῦ κρασπέδου
  choice: किनारी
  rationale: κράσπεδον वस्त्र की सीमा, किनारे, झालर या उससे जुड़े लटकन का द्योतक हो सकता है। ‘किनारी’ अर्थ को पर्याप्त व्यापक रखती है और हिन्दी में सहज है।
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: उसके वस्त्र की
  rationale: ἱμάτιον सामान्यतः पहने जाने वाले वस्त्र, विशेषकर बाहरी वस्त्र, को दर्शाता है। ‘वस्त्र’ अनावश्यक रूप से चोगा या बागा जैसी किसी विशेष शैली को निर्धारित नहीं करता।
- source_word: ὅσοι
  choice: जितने लोगों ने
  rationale: ὅσοι का परिमाणात्मक और संबंधसूचक भाव ‘जितने लोगों ने’ से स्पष्ट और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: ἥψαντο
  choice: उसे छुआ
  rationale: यहाँ ἅπτω का अर्थ ‘छूना’ है। हिन्दी में ‘उसे’ निकटवर्ती वस्त्र की किनारी की ओर संकेत करता है और वाक्य को सहज बनाता है।
- source_word: διεσώθησαν
  choice: चंगे हो गए
  rationale: इस प्रसंग में διασῴζω शारीरिक रूप से स्वस्थ किए जाने का अर्थ देता है। ‘चंगे हो गए’ सामान्य पाठक के लिए स्पष्ट है, जबकि क्रिया के व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: चंगाई के प्रसंग में διεσώθησαν का अर्थ
  choice: शारीरिक चंगाई—‘चंगे हो गए’
  alternative: ‘भले-चंगे हो गए’, ‘बचा लिए गए’ या ‘उद्धार पाए’
  rationale: निकटवर्ती प्रसंग रोगियों की शारीरिक चंगाई का है, इसलिए मुख्य पाठ में ‘चंगे हो गए’ सर्वाधिक स्पष्ट है। फिर भी मूल क्रिया के बचाए जाने या सुरक्षित पहुँचाए जाने जैसे व्यापक अर्थ को पादटिप्पणी में बताया गया है, ताकि उसकी अर्थ-सीमा पूरी तरह मिट न जाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विनती करते रहे’ मूल के अपूर्ण भूतकाल की निरंतरता व्यक्त करता है। ‘किनारी’ वस्त्र के ठीक स्वरूप को अनावश्यक रूप से निश्चित किए बिना संभावित यहूदी परिधान-पृष्ठभूमि के लिए स्थान छोड़ती है।
