source:
  edition: SBLGNT
  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: hi
  text: और उसका सिर एक थाल[a] में लाया गया और लड़की को दे दिया गया; फिर वह उसे अपनी माँ के पास ले गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बड़ी तश्तरी’ अथवा ‘ट्रे’। यूनानी शब्द πίναξ भोजन परोसने के थाल, बड़ी तश्तरी या ट्रे के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: लाया गया
  rationale: यह φέρω का भूतकालिक कर्मवाच्य रूप है। ‘लाया गया’ कर्मवाच्य अर्थ और कथा का स्वाभाविक प्रवाह दोनों बनाए रखता है।
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: उसका सिर
  rationale: यूनानी संज्ञा-पदबंध का सीधा अनुवाद है; मूल पाठ की कठोरता को किसी शिष्टोक्ति से नरम नहीं किया गया।
- source_word: ἐπὶ πίνακι
  choice: एक थाल में
  rationale: πίναξ भोजन परोसने के बड़े थाल, तश्तरी या ट्रे को दर्शाता है। आधुनिक हिन्दी में किसी वस्तु को थाल में रखकर लाने के लिए ‘एक थाल में’ स्वाभाविक है।
- source_word: ἐδόθη
  choice: दे दिया गया
  rationale: δίδωμι के भूतकालिक कर्मवाच्य अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त करता है। ‘दिया गया’ भी संभव है, पर ‘दे दिया गया’ कथा-क्रम में अधिक स्वाभाविक है।
- source_word: τῷ κορασίῳ
  choice: लड़की को
  rationale: κοράσιον का सामान्य अर्थ लड़की या कम उम्र की लड़की है। ‘लड़की’ स्पष्ट, आधुनिक और अनावश्यक रूप से पुरातन नहीं है।
- source_word: ἤνεγκεν
  choice: वह उसे … ले गई
  rationale: यह φέρω का भूतकालिक सक्रिय रूप है। हिन्दी में गंतव्य की ओर ले जाने के लिए ‘ले गई’ स्वाभाविक है; ‘उसे’ पिछले वाक्यांश में उल्लिखित सिर को स्पष्ट रूप से संदर्भित करता है।
- source_word: τῇ μητρὶ αὐτῆς
  choice: अपनी माँ के पास
  rationale: कर्त्री लड़की ही है, इसलिए हिन्दी का निजवाचक ‘अपनी’ यूनानी αὐτῆς के संबंध को स्वाभाविक ढंग से स्पष्ट करता है। ‘के पास’ यहाँ पहुँचाने की गति को सहज हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मूल के दोनों कर्मवाच्य रूप सुरक्षित हैं, और हिंसक विवरण को न तो नरम किया गया है, न बढ़ाया गया है। अर्धविराम से अंतिम सक्रिय क्रिया और उसके कर्ता ‘वह’ को कथा-क्रम में स्पष्ट किया गया है।
