  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: hi
  text: तब नाव में जो लोग थे, उन्होंने उसकी आराधना की[a] और कहा, “सचमुच तुम परमेश्वर के पुत्र हो।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे दण्डवत प्रणाम किया” या “उसे श्रद्धापूर्वक नमन किया।” यूनानी क्रिया झुकने या भूमि पर गिरकर सम्मान प्रकट करने को दर्शा सकती है; इस प्रसंग में आराधना का अर्थ प्रबल है।
    reason: lexical_alternative
  - marker: b
    text: या “परमेश्वर का पुत्र।” यूनानी पदबंध में ‘परमेश्वर’ के साथ उपपद नहीं है, फिर भी इस प्रसंग में यह एक विशिष्ट उपाधि के रूप में प्रयुक्त हुआ है, न कि “परमेश्वर का एक पुत्र” के अर्थ में।
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: तब ... जो लोग थे
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है; ‘तब’ घटनाक्रम की स्वाभाविक प्रगति दिखाता है, और οἱ को लोगों के रूप में स्पष्ट करता है।
- source_word: ἐν τῷ πλοίῳ
  choice: नाव में
  rationale: πλοῖον के लिए सामान्य और प्रसंगानुकूल आधुनिक हिन्दी अभिव्यक्ति।
- source_word: προσεκύνησαν αὐτῷ
  choice: उसे दण्डवत किया
  rationale: προσκυνέω झुकने या भूमि पर गिरकर श्रद्धा अथवा आराधना प्रकट करने का संकेत दे सकता है। ‘दण्डवत किया’ शारीरिक क्रिया और धार्मिक गम्भीरता दोनों को व्यक्त करते हुए मूल की अर्थ-व्याप्ति बनाए रखता है।
- source_word: λέγοντες
  choice: यह कहते हुए
  rationale: ग्रीक वर्तमान कृदन्त की साथ-साथ होने वाली क्रिया को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Ἀληθῶς
  choice: सचमुच
  rationale: दृढ़ और गम्भीर पुष्टि को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: θεοῦ υἱὸς
  choice: परमेश्वर के पुत्र
  rationale: यहाँ सम्बन्धसूचक पदबंध प्रसंग में उपाधि के रूप में कार्य करता है। हिन्दी में ‘परमेश्वर के पुत्र’ स्वाभाविक रूप से निश्चित और विशिष्ट अर्थ देता है।
- source_word: εἶ
  choice: तुम ... हो
  rationale: प्रत्यक्ष सम्बोधन और वर्तमानकालीन कथन को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त करता है।
theological_decisions:
- issue: यीशु के प्रति προσκυνέω का आशय
  choice: मुख्य पाठ में ‘उसे दण्डवत किया’
  alternative: ‘उसकी आराधना की’
  rationale: समुद्र पर यीशु के अधिकार और उसके बाद की स्वीकारोक्ति से आराधना का आशय प्रबल है; फिर भी ग्रीक क्रिया श्रद्धापूर्वक झुकने या दण्डवत होने की दृश्य क्रिया भी दर्शाती है। मुख्य पाठ व्यापक अर्थ को सुरक्षित रखता है और पादटिप्पणी प्रसंगगत ‘आराधना’ स्पष्ट करती है।
- issue: θεοῦ υἱὸς की निश्चितता
  choice: ‘परमेश्वर के पुत्र’
  alternative: ‘परमेश्वर का एक पुत्र’
  rationale: यद्यपि θεοῦ के साथ उपपद नहीं है, यूनानी विधेय रचना अनिश्चित अर्थ की माँग नहीं करती। मत्ती के इस स्वीकारोक्तिपरक प्रसंग में यह विशिष्ट उपाधि है; ‘एक पुत्र’ कहना उसके बल को घटा देता।
