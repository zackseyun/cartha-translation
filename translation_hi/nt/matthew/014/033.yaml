  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘दण्डवत’ सामान्य धार्मिक शब्दावली में समझने योग्य है और मूल क्रिया की दृश्य तथा उपासनात्मक अर्थ-व्याप्ति को सुरक्षित रखता है।
