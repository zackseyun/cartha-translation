lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह हल्का संयोजक पिछले पद में शिष्यों की आपत्ति और यीशु के उत्तर के बीच के विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἶπεν
  choice: उसने कहा
  rationale: अओरिस्ट रूप का सीधा अर्थ ‘कहा’ है; क्रिया में अपने-आप ‘आज्ञा दी’ का अतिरिक्त भाव नहीं जोड़ा गया।
- source_word: Φέρετέ
  choice: ले आओ
  rationale: वर्तमान सक्रिय आज्ञार्थक, द्वितीय पुरुष बहुवचन, वस्तुओं को वक्ता के पास लाने की आज्ञा देता है; हिन्दी में ‘ले आओ’ स्वाभाविक और सटीक है।
- source_word: μοι
  choice: मेरे पास
  rationale: सम्प्रदान कारक सर्वनाम क्रिया की दिशा यीशु की ओर दिखाता है; हिन्दी में ‘मेरे पास’ सहज अभिव्यक्ति है।
- source_word: ὧδε
  choice: यहाँ
  rationale: स्थानवाचक क्रियाविशेषण का अर्थ ‘यहाँ’ है और यह स्थान-संबंधी बल को बनाए रखता है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: पुल्लिंग बहुवचन सर्वनाम संदर्भ में पिछले पद की रोटियों और मछलियों की ओर संकेत करता है; ‘उन्हें’ इस संदर्भ को बिना अनावश्यक विस्तार के स्वाभाविक रूप से व्यक्त करता है।
