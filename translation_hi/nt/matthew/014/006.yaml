    text: शाब्दिक रूप से, “बीच में।” सम्भवतः इसका अर्थ वहाँ एकत्र लोगों के बीच है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: जब हेरोदेस का जन्मदिन मनाया गया
  rationale: यह पदबंध केवल जन्मदिन की तारीख नहीं, बल्कि उसके मनाए जाने के अवसर को सूचित करता है। यह अनुवाद यूनानी कालवाचक रचना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: यहाँ δέ कथा को आगे बढ़ाते हुए हल्का विरोध या मोड़ दिखाता है; ‘पर’ पिछले प्रसंग से उस संबंध को बनाए रखता है।
- source_word: ὠρχήσατο
  choice: नृत्य किया
  rationale: ὀρχέομαι का सीधा अर्थ नाचना या नृत्य करना है। ‘नृत्य किया’ गरिमापूर्ण और सहज हिन्दी है तथा प्रदर्शन के स्वरूप के बारे में अनावश्यक विवरण नहीं जोड़ता।
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: हेरोदियास की बेटी
  rationale: यह साधारण संबंधवाचक रचना है। पाठ बेटी का नाम नहीं बताता, इसलिए परंपरागत नाम को जोड़ना उचित नहीं है।
- source_word: ἐν τῷ μέσῳ
  choice: सभा के बीच
  rationale: शाब्दिक अर्थ ‘बीच में’ है। प्रसंग में लोगों की सभा के बीच नृत्य करना अभिप्रेत जान पड़ता है; ‘सभा के बीच’ हिन्दी में स्पष्ट है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: हेरोदेस को प्रसन्न किया
  rationale: ἀρέσκω के साथ सम्प्रदान कारक का स्वाभाविक अर्थ ‘किसी को प्रसन्न करना’ है। यह अनुवाद अर्थ को बिना अतिरिक्त भाव जोड़े सीधे व्यक्त करता है।
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: हेरोदेस
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
