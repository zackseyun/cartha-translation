- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: बचे हुए टुकड़े
  rationale: जो टूटे हुए अंश भोजन के बाद शेष रहे, उस सामूहिक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: δώδεκα κοφίνους πλήρεις
