source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: hi
  text: पर यीशु ने उनसे कहा, “उन्हें जाने की ज़रूरत नहीं है; तुम ही उन्हें खाने को दो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह शिष्यों के प्रस्ताव के साथ हल्का विरोध दिखाता है और स्वाभाविक हिन्दी कथन में उपयुक्त है।
- source_word: εἶπεν αὐτοῖς
  choice: उनसे कहा
  rationale: साधारण कथात्मक वाक्य-परिचय को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: Οὐ χρείαν ἔχουσιν
  choice: उन्हें ... ज़रूरत नहीं है
  rationale: χρεία और ἔχω की आवश्यकता-सूचक अभिव्यक्ति का सहज आधुनिक हिन्दी रूप है।
- source_word: ἀπελθεῖν
  choice: जाने की
  rationale: संदर्भ में भीड़ के उस स्थान से चले जाने का अर्थ व्यक्त करता है, बिना अनावश्यक रूप से 'दूर' जोड़ने के।
- source_word: δότε
  choice: दो
  rationale: द्वितीय पुरुष बहुवचन आज्ञार्थक रूप को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: बहुवचन सर्वनाम यहाँ भीड़ की ओर संकेत करता है।
- source_word: ὑμεῖς
  choice: तुम ही
  rationale: 'ग्रीक में स्पष्ट कर्ता-सर्वनाम का बल सुरक्षित रखता है: भोजन देने वाले शिष्य ही हों।'
- source_word: φαγεῖν
  choice: खाने को
  rationale: δίδωμι के साथ प्रयुक्त infinitive का स्वाभाविक हिन्दी रूप है और निहित भोजन को बिना भारी शब्दावली के व्यक्त करता है।
theological_decisions:
- issue: यीशु की आज्ञा में शिष्यों की भूमिका पर बल
  choice: ὑμεῖς को बलपूर्वक ‘तुम ही’ अनूदित किया गया
  alternative: केवल ‘तुम’
  rationale: यह शिष्यों को प्रत्यक्ष कर्ता बनाने वाला मूल यूनानी बल बनाए रखता है, पर उससे आगे कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ‘ज़रूरत’ सामान्य पाठक के लिए स्वाभाविक है, और ‘तुम ही’ मूल के कर्ता-बल को स्पष्ट करता है।
