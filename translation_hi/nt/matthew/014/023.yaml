  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: hi
  text: भीड़ को विदा करने के बाद वह अकेले[a] प्रार्थना करने के लिए पहाड़ पर चढ़ गया। जब शाम हुई, तो वह वहाँ अकेला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘एकांत में’ या ‘निजी रूप से’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσας
  choice: विदा करने के बाद
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले की घटना बताता है; यह अनुवाद भीड़ों को वहाँ से भेजने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοὺς ὄχλους
  choice: भीड़ों
  rationale: मूल यूनानी में बहुवचन है; ‘भीड़ों’ उसे सुरक्षित रखते हुए एकत्र जनसमूहों का अर्थ देता है।
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: पहाड़ पर चढ़ गया
  rationale: यह ऊपर की ओर जाकर पहाड़ के क्षेत्र में पहुँचने का स्थलाकृतिक भाव संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κατ’ ἰδίαν
  choice: एकांत में
  rationale: यह मुहावरा दूसरों से अलग, निजी रूप से होने का भाव रखता है। ‘एकांत में’ अगले वाक्य के μόνος से अनावश्यक शब्दगत पुनरावृत्ति से भी बचाता है।
- source_word: προσεύξασθαι
  choice: प्रार्थना करने
  rationale: यह उद्देश्यसूचक अनंत क्रिया का सीधा और स्वाभाविक अनुवाद है।
- source_word: ὀψίας δὲ γενομένης
  choice: शाम होने पर
  rationale: यह संबंधकारक निरपेक्ष रचना की समयसूचक भूमिका को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μόνος ἦν ἐκεῖ
  choice: वह वहाँ अकेला था
  rationale: यह μόνος के स्पष्ट अकेलेपन और ἐκεῖ के स्थान-संकेत दोनों को बनाए रखता है।
