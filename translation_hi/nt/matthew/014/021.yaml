  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: hi
  text: खाने वालों में लगभग पाँच हज़ार पुरुष थे, स्त्रियों और बच्चों को छोड़कर[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्त्रियों और बच्चों को गिने बिना।”
    reason: χωρίς के बहिष्करणात्मक, अर्थात संख्या में शामिल न किए जाने के, अर्थ को अधिक स्पष्ट करने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: खानेवाले
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत उन लोगों को सूचित करता है जिन्होंने भोजन में भाग लिया। ‘खानेवाले’ स्वाभाविक हिन्दी है और क्रिया के पक्ष को अनावश्यक रूप से सीमित नहीं करता; δέ का हल्का संयोजक बल प्रसंग से स्पष्ट है।
- source_word: ἦσαν
  choice: थे
  rationale: εἰμί का अपूर्णकाल यहाँ संख्या बताने वाला साधारण संयोजक क्रियारूप है; हिन्दी में ‘थे’ इसका स्वाभाविक समतुल्य है।
- source_word: ἄνδρες
  choice: पुरुष
  rationale: ἀνήρ यहाँ सामान्य ‘लोगों’ के बजाय पुरुष व्यक्तियों को दर्शाता है, क्योंकि स्त्रियों और बच्चों का अलग उल्लेख है।
- source_word: ὡσεὶ
  choice: लगभग
  rationale: ὡσεί अनुमानित संख्या को सूचित करता है; ‘लगभग’ आधुनिक मानक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: πεντακισχίλιοι
  choice: पाँच हज़ार
  rationale: यह ἄνδρες की संख्या बताने वाली सीधी संख्या है।
- source_word: χωρὶς
  choice: के अलावा
  rationale: सम्बन्धकारक के साथ χωρίς गिनती से अलग रखे जाने या उसके अतिरिक्त होने का भाव देता है। ‘के अलावा’ मूल की संक्षिप्तता बनाए रखता है; पादटिप्पणी अधिक स्पष्ट वैकल्पिक अभिव्यक्ति देती है।
- source_word: γυναικῶν
  choice: स्त्रियों
  rationale: यहाँ γυνή का अर्थ ‘स्त्री’ है, ‘पत्नी’ नहीं, क्योंकि किसी वैवाहिक संबंध की चर्चा नहीं है।
- source_word: παιδίων
  choice: बच्चों
  rationale: παιδίον के बहुवचन के लिए ‘बच्चे’ स्वाभाविक है और प्रसंग से अधिक संकीर्ण आयु-सीमा नहीं थोपता।
theological_decisions:
- issue: मिश्रित भीड़ में पुरुषों की अलग गिनती
  choice: ἄνδρες का अनुवाद ‘पुरुष’ किया गया और स्त्रियों तथा बच्चों को उस संख्या से अलग रखा गया।
  alternative: ‘लोग’ या ‘व्यक्ति’
  rationale: यूनानी पाठ विशेष रूप से पुरुष व्यक्तियों की संख्या बताता है और फिर स्त्रियों तथा बच्चों का अलग उल्लेख करता है। ‘लोग’ कहने से यह वास्तविक शाब्दिक और सामाजिक-ऐतिहासिक भेद मिट जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और पाठयोग्य रखी गई है। ‘खानेवाले’ संक्षिप्त और स्वाभाविक है, जबकि ‘पुरुष’ मूल पाठ के लिंग-विशिष्ट अर्थ को सुरक्षित रखता है।
