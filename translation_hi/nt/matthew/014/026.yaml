reference: Matthew 14:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: hi
  text: पर जब शिष्यों ने उसे समुद्र पर चलते देखा, तो वे घबरा उठे और कहने लगे, “यह भूत है!” और वे डर के मारे चिल्ला उठे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले वर्णन से हल्का कथात्मक विरोध और शिष्यों की अचानक हुई भयभीत प्रतिक्रिया दिखाता है।
- source_word: μαθηταὶ
  choice: शिष्य
  rationale: सप्रसंग निश्चित समूह यीशु के शिष्यों का है; हिन्दी में ‘शिष्य’ स्वाभाविक और स्पष्ट है।
- source_word: ἰδόντες αὐτὸν
  choice: जब शिष्यों ने उसे ... देखा
  rationale: अओरिस्ट कृदंत को स्वाभाविक हिन्दी में कालवाचक उपवाक्य के रूप में रखा गया है।
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: समुद्र पर चलते
  rationale: ἐπί के साथ संबंधकारक यहाँ समुद्र की सतह पर चलने का भाव देता है; ‘समुद्र’ θάλασσα का निकट और प्रसंगानुकूल रूप है।
- source_word: ἐταράχθησαν
  choice: वे घबरा उठे
  rationale: यह क्रिया भीतर तक विचलित और भयभीत होने को व्यक्त करती है; ‘घबरा उठे’ अचानक और तीव्र प्रतिक्रिया को सहज हिन्दी में बताता है।
- source_word: λέγοντες
  choice: कहने लगे
  rationale: समकालिक कृदंत को हिन्दी कथन-शैली में स्वाभाविक रूप दिया गया है।
- source_word: Φάντασμά ἐστιν
  choice: यह कोई भूत है!
  rationale: φάντασμα किसी दिखाई देने वाली प्रेत-जैसी आकृति या आभास को सूचित करता है; ‘भूत’ सामान्य आधुनिक हिन्दी में शिष्यों की भयभीत धारणा को सबसे स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀπὸ τοῦ φόβου
  choice: डर के मारे
  rationale: ἀπό यहाँ कारण या स्रोत बताता है; ‘डर के मारे’ इसका स्वाभाविक हिन्दी मुहावरा है।
- source_word: ἔκραξαν
  choice: चिल्ला उठे
  rationale: κράζω ऊँची आवाज़ में पुकारने या चिल्लाने को दर्शाता है; ‘चिल्ला उठे’ भय से निकली अचानक तेज़ आवाज़ को व्यक्त करता है।
theological_decisions:
- issue: शिष्यों के कथन में φάντασμα का स्वरूप
  choice: मुख्य पाठ में ‘भूत’
  alternative: ‘प्रेतछाया’ या ‘आभास’
  rationale: यह कथन शिष्यों की भयभीत और गलत पहचान बताता है, आत्माओं के अस्तित्व या स्वरूप पर कोई सैद्धांतिक निर्णय नहीं देता। ‘भूत’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी यूनानी शब्द की व्यापकता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘समुद्र पर’ मूल यूनानी अभिव्यक्ति के निकट है; ‘घबरा उठे’ और ‘डर के मारे चिल्ला उठे’ कथानक की तीव्रता को बिना अतिरिक्त व्याख्या के व्यक्त करते हैं।
