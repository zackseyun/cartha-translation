  naturalness: The register is appropriately modern and dignified. ‘हमारे साझा विश्वास’ is more idiomatic modern standard Hindi than ‘हमारे साझे विश्वास,’ and ‘के आधार पर’ reads more naturally in this epistolary address than ‘के अनुसार.’
  terminology: ‘परमेश्वर पिता,’ ‘मसीह यीशु,’ ‘अनुग्रह,’ ‘शांति,’ and ‘हमारे उद्धारकर्ता’ are suitable and retain the source’s theological terminology without adding interpretation. ‘मसीह’ appropriately preserves the titular semantic content of Χριστός.
