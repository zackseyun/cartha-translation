language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν· χάρις ⸀καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τοῦ σωτῆρος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: hi
  text: 'हमारे साझा विश्वास[a] के आधार पर मेरे सच्चे पुत्र तीतुस के नाम:


    परमेश्वर पिता और हमारे उद्धारकर्ता मसीह यीशु की ओर से तुम्हें अनुग्रह और शांति मिले।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस विश्वास में हम सहभागी हैं।”
    reason: κοινήν का अर्थ केवल समान प्रकार का नहीं, बल्कि सहभागिता से साझा किया हुआ विश्वास भी हो सकता है।
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: मेरे सच्चे पुत्र
  rationale: यह पदबंध जैविक पुत्रत्व नहीं, बल्कि पौलुस और तीतुस के बीच प्रामाणिक आत्मिक पारिवारिक संबंध व्यक्त करता है। तीतुस पुरुष है, इसलिए आधुनिक हिन्दी में ‘पुत्र’ स्वाभाविक है और संबंधसूचक रूपक को बनाए रखता है।
- source_word: κατὰ κοινὴν πίστιν
  choice: हमारे साझे विश्वास के अनुसार
  rationale: κατά संबंध या मानक का भाव देता है और κοινήν उस विश्वास को दोनों का साझा विश्वास बताता है। ‘हमारे’ यूनानी में अलग शब्द के रूप में नहीं है, पर κοινήν और संबोधन में निहित पारस्परिकता को हिन्दी में स्वाभाविक रूप से स्पष्ट करता है।
- source_word: χάρις καὶ εἰρήνη
  choice: अनुग्रह और शांति
  rationale: ये पौलुस के पत्रों में आशीर्वाद के स्थापित शब्द हैं। हिन्दी वाक्य को पूर्ण और स्वाभाविक बनाने के लिए ‘तुम्हें … मिले’ जोड़ा गया है।
- source_word: θεοῦ πατρὸς
  choice: परमेश्वर पिता
  rationale: यूनानी पाठ में πατρός के साथ ‘हमारे’ नहीं है; इसलिए ‘हमारे पिता परमेश्वर’ के बजाय ‘परमेश्वर पिता’ पाठ के अधिक निकट है।
- source_word: Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु
  rationale: Χριστός को केवल ध्वन्यंतरित नाम की तरह नहीं, उसके पदवीगत अर्थ ‘मसीह’ के साथ प्रस्तुत किया गया है। हिन्दी बाइबलीय प्रयोग में ‘मसीह यीशु’ स्वाभाविक और प्रतिष्ठित है।
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: हमारे उद्धारकर्ता
  rationale: यह पदबंध निकटवर्ती ‘मसीह यीशु’ के समानाधिकरण में है और उन्हें ‘हमारा उद्धारकर्ता’ बताता है।
theological_decisions:
- issue: Χριστός का पदवीगत अर्थ
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु / क्राइस्ट यीशु
  rationale: ‘मसीह’ Χριστός के अभिषिक्त उद्धारकर्ता संबंधी पदवीगत अर्थ को हिन्दी में बनाए रखता है, जबकि केवल ध्वन्यंतरण अर्थ को अस्पष्ट कर सकता है।
- issue: ‘हमारे उद्धारकर्ता’ का संबंध
  choice: यह पदवी मसीह यीशु को संबोधित करती है
  alternative: इसे समन्वित स्रोत-वाक्यांश पर अधिक ढीले रूप से लागू समझना
  rationale: καὶ Χριστοῦ Ἰησοῦ τοῦ σωτῆρος ἡμῶν में लेखयुक्त τοῦ σωτῆρος ἡμῶν स्वाभाविक रूप से Χριστοῦ Ἰησοῦ के समानाधिकरण में है। अनुवाद इसी निकटतम वाक्य-संबंध को स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और पत्र-संबोधन के अनुरूप रखी गई है। दत्तिव Τίτῳ को ‘तीतुस के नाम’ से व्यक्त किया गया है। मूल की संक्षिप्त आशीर्वादात्मक संरचना को स्वाभाविक हिन्दी के लिए ‘तुम्हें … मिले’ के रूप में पूरा किया गया है।
