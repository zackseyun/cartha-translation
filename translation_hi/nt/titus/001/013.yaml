  text: ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. δι’ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: hi
  text: यह गवाही सच्ची है। इसी कारण उन्हें कड़ाई से फटकार, ताकि वे विश्वास में स्वस्थ हों[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “विश्वास में स्वस्थ” का अर्थ अपने विश्वास में स्वस्थ होना भी हो सकता है, या मसीही विश्वास की मान्यताओं के संबंध में खरे होना।
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  choice: गवाही
  rationale: पिछले पद में उद्धृत कथन को प्रमाणात्मक गवाही के रूप में प्रस्तुत करता है; ‘गवाही’ उसके साक्ष्य-संबंधी भाव को बनाए रखता है।
- source_word: ἀληθής
  choice: सच
  rationale: यह विधेय विशेषण गवाही को वास्तविकता के अनुरूप बताता है; आधुनिक हिन्दी में ‘सच’ सीधा और स्वाभाविक है।
- source_word: δι’ ἣν αἰτίαν
  choice: इसी कारण
  rationale: यह पदबंध पिछले कथन से निकले कारण और निष्कर्ष को स्पष्ट रूप से जोड़ता है।
- source_word: ἔλεγχε
  choice: फटकार
  rationale: वर्तमान काल की आज्ञा गलती का सीधे सामना करके सुधारने का भाव रखती है; ‘फटकार’ इस दृढ़ सुधारात्मक बल को व्यक्त करता है।
- source_word: ἀποτόμως
  choice: कड़ाई से
  rationale: यह क्रिया-विशेषण तीखे और कठोर ढंग को दर्शाता है; ‘कड़ाई से’ स्वाभाविक हिन्दी में उसके बल को बिना दंडात्मक अर्थ बढ़ाए व्यक्त करता है।
- source_word: ὑγιαίνωσιν
  choice: स्वस्थ हों
  rationale: क्रिया का मूल स्वास्थ्य-संबंधी रूपक है, जिसे पास्तरी पत्रियों में विश्वास और शिक्षा की शुद्धता के लिए लाक्षणिक रूप से प्रयोग किया गया है; ‘स्वस्थ हों’ उस रूपक को सुरक्षित रखता है।
- source_word: πίστει
  choice: विश्वास
  rationale: सप्रत्यय यूनानी पदबंध व्यक्तिगत विश्वास अथवा मसीही विश्वास की मान्यताओं—दोनों की ओर संकेत कर सकता है। हिन्दी का ‘विश्वास में’ मूल की इस वास्तविक अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: ἐν τῇ πίστει का अर्थ
  choice: विश्वास में
  alternative: मसीही विश्वास की मान्यताओं में / अपने विश्वास में
  rationale: संदर्भ में झूठी शिक्षा के कारण यह पदबंध मसीही विश्वास को मान्यताओं के समुच्चय के रूप में सूचित कर सकता है, पर यूनानी व्यक्तिगत विश्वास की दशा का अर्थ भी स्वीकार करता है। मुख्य पाठ जानबूझकर दोनों संभावनाएँ खुली रखता है और पादटिप्पणी उन्हें स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फटकार’ आदेश की दृढ़ता को और ‘स्वस्थ हों’ मूल यूनानी के स्वास्थ्य-रूपक को बनाए रखते हैं। पद के अंत का अल्पविराम अगले पद से वाक्य की निरंतरता दर्शाता है।
