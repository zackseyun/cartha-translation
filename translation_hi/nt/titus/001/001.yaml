id: TIT.1.1
reference: Titus 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ’ εὐσέβειαν
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/001.yaml
  text: Paul[a], a servant of God and an apostle of Jesus the Messiah, for the faith of God’s chosen ones and the knowledge of the truth that accords with godliness[c][b],
translation:
  language: hi
  text: पौलुस, परमेश्वर का दास और यीशु मसीह का प्रेरित—परमेश्वर के चुने हुओं के विश्वास और उस सत्य के ज्ञान के लिए, जो भक्ति के अनुरूप है[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो भक्ति की ओर ले जाता है।”
    reason: κατά सत्य और भक्ति के बीच अनुरूपता के साथ-साथ लक्ष्य या परिणाम का संबंध भी व्यक्त कर सकता है।
  - marker: b
    text: या, “उस सत्य की पूरी पहचान।”
    reason: ἐπίγνωσις साधारण ज्ञान की अपेक्षा अधिक पूर्ण या गहन पहचान का भाव दे सकता है।
lexical_decisions:
- source_word: δοῦλος
  choice: दास
  rationale: ‘दास’ परमेश्वर के प्रति पौलुस के पूर्ण समर्पण और उसके अधिकाराधीन होने को व्यक्त करता है; आधुनिक हिन्दी में ‘गुलाम’ अनावश्यक रूप से केवल सामाजिक दासता पर बल दे सकता है।
- source_word: ἀπόστολος
  choice: प्रेरित
  rationale: यह पौलुस के विशेष रूप से भेजे और अधिकृत सेवक होने के पद के लिए स्थापित तथा सटीक हिन्दी शब्द है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός के अभिषिक्त उद्धारकर्ता वाले पदनाम को ‘मसीह’ स्वाभाविक और पारंपरिक हिन्दी में सुरक्षित रखता है।
- source_word: κατὰ πίστιν
  choice: विश्वास ... के लिए
  rationale: यहाँ κατά पौलुस की प्रेरिताई के लक्ष्य अथवा संदर्भ को सूचित कर सकता है; ‘के लिए’ संक्षिप्त यूनानी वाक्य-विन्यास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκλεκτῶν θεοῦ
  choice: परमेश्वर के चुने हुओं
  rationale: यह परमेश्वर द्वारा चुने जाने का अर्थ स्पष्ट रखता है और किसी संप्रदाय-विशेष की विस्तृत चुनाव-व्यवस्था को पाठ में नहीं जोड़ता।
- source_word: ἐπίγνωσιν
  choice: ज्ञान
  rationale: संदर्भ में ‘ज्ञान’ स्वाभाविक है; सम्भावित तीव्र अर्थ ‘पूरा ज्ञान’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τῆς κατ’ εὐσέβειαν
  choice: जो भक्ति के अनुरूप है
  rationale: यह κατά के अनुरूपता-संबंध को बनाए रखता है और सत्य को भक्ति का कारण बताने वाली अधिक संकीर्ण व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
- source_word: εὐσέβειαν
  choice: भक्ति
  rationale: यह परमेश्वर के प्रति श्रद्धा से आकार पाए जीवन को साधारण, वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἐκλεκτῶν θεοῦ का अनुवाद
  choice: परमेश्वर के चुने हुओं
  alternative: परमेश्वर के चुनाव पाए हुओं
  rationale: मुख्य पाठ दिव्य चुनाव का वास्तविक भाव रखता है, पर किसी विशेष धर्मवैज्ञानिक प्रणाली को नहीं थोपता।
- issue: κατὰ πίστιν ... καὶ ἐπίγνωσιν का पौलुस की प्रेरिताई से संबंध
  choice: विश्वास और ... ज्ञान के लिए
  alternative: विश्वास और ... ज्ञान के अनुसार
  rationale: यूनानी रचना संक्षिप्त है और लक्ष्य/संदर्भ अथवा मानक का भाव दे सकती है। संदर्भ में पौलुस की प्रेरिताई का सेवकीय लक्ष्य अधिक स्वाभाविक है, जबकि वैकल्पिक व्याकरणिक संभावना स्वीकार की जाती है।
- issue: τῆς κατ’ εὐσέβειαν में संबंध
  choice: भक्ति के अनुरूप सत्य
  alternative: भक्ति की ओर ले जाने वाला सत्य
  rationale: मुख्य पाठ अनुरूपता का व्यापक अर्थ बचाता है; उद्देश्य या परिणाम का अर्थ सम्भव है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली अपनाई गई है। पद एक दीर्घ अभिवादन-वाक्य का आरम्भ है, इसलिए अंत में अल्पविराम रखा गया है। ‘दास’, ‘प्रेरित’, ‘मसीह’ और ‘भक्ति’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं, पर वाक्य-विन्यास को स्वाभाविक रखने के लिए डैश का प्रयोग किया गया है।
