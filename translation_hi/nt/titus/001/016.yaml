lexical_decisions:
- source_word: θεὸν
  choice: परमेश्वर
  rationale: ὁμολογοῦσιν εἰδέναι का कर्म; हिन्दी बाइबलीय भाषा में स्पष्ट और मानक रूप।
- source_word: ὁμολογοῦσιν
  choice: दावा तो करते हैं
  rationale: कथनी और करनी के तीखे विरोध को स्वाभाविक हिन्दी में व्यक्त करता है; ‘तो’ अगले विरोधसूचक खंड की भूमिका बनाता है।
- source_word: εἰδέναι
  choice: जानने
  rationale: परमेश्वर के ज्ञान का दावा सीधे व्यक्त करता है, बिना इसके स्वरूप को अतिरिक्त रूप से परिभाषित किए।
- source_word: τοῖς δὲ ἔργοις
  choice: पर अपने कामों से
  rationale: 'दत्तिव को साधन के अर्थ में लिया गया है: उनके काम उनके इनकार को प्रकट करते हैं।'
- source_word: ἀρνοῦνται
  choice: उसका इनकार करते हैं
  rationale: पहले खंड के ‘परमेश्वर’ को निहित कर्म के रूप में आगे ले जाता है और यूनानी के प्रबल विरोध को बनाए रखता है।
- source_word: βδελυκτοὶ
  choice: घृणित
  rationale: नैतिक रूप से घोर अप्रिय होने का तीखा अर्थ आधुनिक और गरिमापूर्ण हिन्दी में देता है।
- source_word: ὄντες
  choice: वे ... हैं
  rationale: यूनानी कृदंत को स्वाभाविक हिन्दी में स्वतंत्र विधेय वाक्य बनाया गया है।
- source_word: ἀπειθεῖς
  choice: आज्ञा न माननेवाले
  rationale: संदर्भ में अवज्ञा का सक्रिय भाव स्पष्ट करता है और सामान्य पाठक के लिए सहज है।
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: हर अच्छे काम के
  rationale: ἀδόκιμοι के साथ योग्यता अथवा उपयुक्तता के संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀδόκιμοι
  choice: अयोग्य
  rationale: कसौटी पर अनुपयुक्त ठहरने अथवा अच्छे काम के योग्य न होने का अर्थ संक्षेप में देता है।
theological_decisions:
- issue: मौखिक दावे और व्यावहारिक इनकार का संबंध
  choice: वे परमेश्वर को जानने का दावा करते हैं, किंतु उनके काम स्वयं परमेश्वर का इनकार करते हैं।
  alternative: दूसरे खंड को सामान्य रूप से परमेश्वर के सत्य के इनकार के अर्थ में समझना।
  rationale: पहले खंड में ‘परमेश्वर’ स्पष्ट कर्म है और दूसरे खंड में वही कर्म स्वाभाविक रूप से निहित रहता है। अनुवाद इस नैतिक-धार्मिक तनाव को बनाए रखता है, पर उससे आगे कोई सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए स्पष्ट, किंतु गरिमापूर्ण। ‘दावा तो करते हैं, पर’ से मूल का कथनी-करनी विरोध उभरता है। ‘कामों’ और ‘अच्छे काम’ की पुनरावृत्ति मूल के ἔργοις/ἔργον संबंध को बनाए रखती है।
