base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: hi
  text: उनका मुँह बंद करना ज़रूरी है[a], क्योंकि वे लज्जाजनक लाभ के लिए ऐसी बातें सिखाकर, जिन्हें उन्हें नहीं सिखाना चाहिए, पूरे घर-परिवारों[b] को उलट-पुलट कर रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उनके हानिकारक उपदेश को रोकना; यूनानी में इसका शाब्दिक भाव है, “उनके मुँह बंद करना।”
    reason: lexical_alternative
  - marker: b
    text: “घर-परिवारों” से आशय संभवतः परिवारों और घर से जुड़े आश्रितों सहित पूरी गृहस्थी से है, केवल मकानों से नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: οὓς δεῖ ἐπιστομίζειν
  choice: उनका मुँह बंद करना ज़रूरी है
  rationale: यूनानी वाक्यांश में आवश्यकता और ‘मुँह रोकने’ का सशक्त मुहावरा दोनों हैं। हिंदी में यह स्वाभाविक है और उनके हानिकारक उपदेश को रोकने का भाव देता है, बिना किसी विशेष दंड-विधि को जोड़ने के।
- source_word: οἵτινες
  choice: क्योंकि वे
  rationale: यह संबंधवाचक रूप यहाँ कारण भी प्रस्तुत करता है; ‘क्योंकि वे’ उस व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ὅλους οἴκους
  choice: पूरे-के-पूरे घरानों
  rationale: οἶκος यहाँ केवल भवन नहीं, परिवार और उससे जुड़े आश्रितों सहित गृहस्थी को सूचित करता है। ‘घरानों’ से यह सामाजिक इकाई व्यक्त होती है।
- source_word: ἀνατρέπουσιν
  choice: उलट-पुलट कर रहे हैं
  rationale: क्रिया में पलट देने, अस्त-व्यस्त करने या गंभीर रूप से अस्थिर करने का भाव है। यह चयन विनाश की सीमा को अनावश्यक रूप से बढ़ाए बिना उसकी प्रबलता रखता है।
- source_word: διδάσκοντες ἃ μὴ δεῖ
  choice: ऐसी बातें सिखाकर, जो उन्हें नहीं सिखानी चाहिए
  rationale: 'कृदंत को साधन के रूप में लिया गया है: वे अपने अनुचित उपदेश के द्वारा घरानों को अस्त-व्यस्त करते हैं।'
- source_word: αἰσχροῦ κέρδους χάριν
  choice: लज्जाजनक लाभ के लिए
  rationale: वाक्यांश ऐसे लाभ की प्रेरणा को दर्शाता है जो नैतिक रूप से निंदनीय है; हिंदी चयन इस मूल्यांकन और उद्देश्य दोनों को बनाए रखता है।
theological_decisions:
- issue: झूठे शिक्षकों का मुँह बंद करने की आवश्यकता का स्वरूप
  choice: उनका मुँह बंद करना ज़रूरी है
  alternative: उन्हें चुप कराना ज़रूरी है
  rationale: मूल का मुहावरा सशक्त रूप से उनके बोलने या सिखाने को रोकने की बात करता है, पर ऐसा करने की नागरिक, शारीरिक या अनुशासनात्मक विधि निर्दिष्ट नहीं करता। अनुवाद उस अनिर्दिष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘मुँह बंद करना’ मूल मुहावरे की शक्ति रखता है; ‘घरानों’ को फुटनोट द्वारा सामाजिक अर्थ में स्पष्ट किया गया है।
