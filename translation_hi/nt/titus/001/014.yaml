source:
  edition: SBLGNT
  text: μὴ προσέχοντες Ἰουδαϊκοῖς μύθοις καὶ ἐντολαῖς ἀνθρώπων ἀποστρεφομένων τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/014.yaml
  text: not paying attention to Jewish myths and commandments of people who turn away from the truth[a].
translation:
  language: hi
  text: और वे यहूदी मिथकों और उन मनुष्यों की आज्ञाओं पर ध्यान न दें, जो सत्य से मुँह मोड़ते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वे यहूदी मिथकों और सत्य से मुँह मोड़नेवाले मनुष्यों की आज्ञाओं में मन न लगाएँ।”
    reason: μὴ προσέχοντες का अर्थ किसी बात पर ध्यान देने के साथ-साथ उसमें मन लगाने या उसके प्रति समर्पित होने का भाव भी रख सकता है।
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: ध्यान न दें
  rationale: यह वर्तमान कृदंत पिछले पद के उपदेश को आगे बढ़ाता है। ‘ध्यान न दें’ मन को किसी बात की ओर लगाने या उसे महत्त्व देने का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: यहूदी मिथकों
  rationale: μῦθος गढ़ी हुई कथाओं या दंतकथाओं को सूचित करता है; ‘मिथक’ समकालीन और स्पष्ट है। विशेषण Ἰουδαϊκοῖς उनके यहूदी स्वरूप या उद्गम को बताता है।
- source_word: ἐντολαῖς ἀνθρώπων
  choice: मनुष्यों की आज्ञाओं
  rationale: यह यूनानी पदबंध के निकट रहते हुए इन आज्ञाओं के मानवीय स्रोत को स्पष्ट करता है और किसी पुरुष-विशेष अर्थ से बचता है।
- source_word: ἀποστρεφομένων
  choice: जो ... से मुँह मोड़ते हैं
  rationale: यह अभिव्यक्ति मूल क्रिया में निहित विमुख होने की छवि को सुरक्षित रखती है और केवल ‘अस्वीकार करते हैं’ से कम व्याख्यात्मक है।
- source_word: τὴν ἀλήθειαν
  choice: सत्य
  rationale: यह ἀλήθεια का मानक और पर्याप्त रूप है; यहाँ अनुवाद इसे स्पष्ट रूप से ‘सुसमाचार का सत्य’ कहकर मूल पाठ से अधिक विशिष्ट नहीं बनाता।
theological_decisions:
- issue: सम्बन्धवाचक कृदंत ἀποστρεφομένων का सम्बंध
  choice: 'इसे निकटतम संबंधवाची बहुवचन ἀνθρώπων से जोड़ा गया है: ‘उन मनुष्यों की आज्ञाओं ... जो सत्य से मुँह मोड़ते हैं।’'
  alternative: इसे अधिक ढीले रूप में मिथकों और आज्ञाओं, दोनों को सत्य से मुँह मोड़नेवालों से जुड़ी वस्तुएँ बताने वाला माना जा सकता है।
  rationale: व्याकरण की दृष्टि से उसी संबंधवाची बहुवचन में आए निकटतम ἀνθρώπων के साथ इसका संबंध सबसे स्वाभाविक है। इससे बिना अतिरिक्त धर्मवैज्ञानिक दावे के सुसंगत अर्थ मिलता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘मिथक’ वर्तमान पाठकों के लिए ‘कल्पित कथा’ या ‘दंतकथा’ की अपेक्षा संक्षिप्त है; ‘मनुष्य’ मानवीय स्रोत पर बल देता है। वाक्य पिछले पद पर निर्भर अंश है, इसलिए आरम्भ में ‘और’ रखा गया है।
