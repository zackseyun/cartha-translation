translation:
  language: hi
  text: अनन्त जीवन की आशा में—जिसकी प्रतिज्ञा झूठ न बोलने वाले परमेश्वर ने युगों के आरम्भ से पहले[a] की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समय के आरम्भ से पहले।” यूनानी में शाब्दिक रूप से “सनातन/युगों तक चलने वाले समयों से पहले” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: आशा में
  rationale: ἐπί के साथ चतुर्थी यहाँ आधार, परिस्थिति या क्षेत्र का भाव दे सकती है। “आशा में” स्वाभाविक हिन्दी है और सम्बन्ध को किसी एक कारणात्मक अर्थ तक सीमित नहीं करती।
- source_word: ζωῆς αἰωνίου
  choice: अनन्त जीवन की
  rationale: सम्बन्धकारक पद आशा की विषय-वस्तु बताता है। “अनन्त जीवन” अवधि और नए नियम में इसके धर्मवैचारिक अर्थ—दोनों को बनाए रखता है।
- source_word: ἣν
  choice: जिसकी
  rationale: स्त्रीलिंग एकवचन सम्बन्धवाचक सर्वनाम का स्वाभाविक पूर्वपद “अनन्त जीवन” है, न कि “आशा।” हिन्दी में “जिसकी प्रतिज्ञा” इस सम्बन्ध को स्पष्ट और सहज बनाता है।
- source_word: ἐπηγγείλατο
  choice: प्रतिज्ञा ... की थी
  rationale: ἐπαγγέλλομαι के भूतकालिक रूप को यह स्वाभाविक और सटीक हिन्दी में व्यक्त करता है।
- source_word: ὁ ἀψευδὴς θεὸς
  choice: झूठ न बोलने वाले परमेश्वर
  rationale: ἀψευδής का सीधा अर्थ झूठ न बोलने वाला अथवा सत्यवादी है। यह अनुवाद मूल कथन को बनाए रखता है और उसे अधिक प्रबल “जो झूठ बोल नहीं सकता” में नहीं बदलता।
- source_word: πρὸ χρόνων αἰωνίων
  choice: युगों के आरम्भ से पहले
  rationale: यह χρόνων αἰωνίων के युग-संबंधी स्वर को बनाए रखते हुए पूर्वकालिक आशय को सहज हिन्दी में व्यक्त करता है। “समय के आरम्भ से पहले” अधिक व्याख्यात्मक विकल्प है।
theological_decisions:
- issue: πρὸ χρόνων αἰωνίων में परमेश्वर की प्रतिज्ञा का काल
  choice: युगों के आरम्भ से पहले
  alternative: समय के आरम्भ से पहले; सनातन कालों से पहले
  rationale: यूनानी पाठ प्रतिज्ञा को युगों से पहले रखता है, पर यह नहीं बताता कि प्रतिज्ञा किससे की गई या उसकी तत्वमीमांसात्मक रीति क्या थी। अनुवाद उस तनाव को खुला रखता है।
- issue: ἀψευδής के द्वारा परमेश्वर का वर्णन
  choice: झूठ न बोलने वाले परमेश्वर
  alternative: झूठ न बोल सकने वाले परमेश्वर; सत्यवादी परमेश्वर
  rationale: चुना हुआ रूप यूनानी विशेषण के नैतिक कथन को सीधे व्यक्त करता है और मूल से अधिक प्रबल असमर्थता का दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाक्यांश पूर्ववर्ती पद से जुड़ा होने के कारण मूल की तरह आश्रित संरचना में रखा गया है; डैश सम्बन्धवाचक उपवाक्य को स्पष्ट करता है।
