source:
  edition: SBLGNT
  text: εἴ τίς ἐστιν ἀνέγκλητος, μιᾶς γυναικὸς ἀνήρ, τέκνα ἔχων πιστά, μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/006.yaml
  text: if anyone is above reproach[a], the husband of one wife[c][b], having faithful children not under accusation of debauchery or insubordinate.
translation:
  language: hi
  text: यदि कोई ऐसा हो जिस पर कोई दोष न लगाया जा सके, जो एक ही पत्नी का पति हो[a], और जिसके बच्चे विश्वासयोग्य[b] हों—उन पर उच्छृंखल जीवन[c] जीने का आरोप न हो और न वे अवज्ञाकारी हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस यूनानी मुहावरे का भाव “अपनी पत्नी के प्रति निष्ठावान पुरुष” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “विश्वास करनेवाले।” यूनानी πιστά का अर्थ “विश्वासयोग्य” या “विश्वास करनेवाले” हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या “बेलगाम आचरण।” इस शब्द में फिजूलखर्च और नैतिक रूप से असंयमित जीवन का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέγκλητος
  choice: जिस पर कोई दोष न लगाया जा सके
  rationale: यह पद किसी व्यक्ति के पूर्णतः निष्पाप होने के बजाय उसके विरुद्ध उचित और सिद्ध आरोप न होने का भाव देता है। यह हिंदी में स्वाभाविक है और यूनानी शब्द के आरोप-संबंधी अर्थ को बनाए रखता है।
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: एक ही पत्नी का पति
  rationale: यह यूनानी वाक्यांश का पारदर्शी, पुरुष-विशिष्ट अनुवाद है और वैवाहिक स्थिति, पुनर्विवाह या निष्ठा से जुड़े विवादित निष्कर्षों को पाठ में नहीं जोड़ता।
- source_word: τέκνα
  choice: बच्चे
  rationale: परिवार और गृहस्थी के इस संदर्भ में यह सामान्य, स्पष्ट और आधुनिक हिंदी शब्द है।
- source_word: πιστά
  choice: विश्वासयोग्य
  rationale: πιστά का अर्थ ‘विश्वासयोग्य/निष्ठावान’ अथवा ‘विश्वास करनेवाले’ हो सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐν κατηγορίᾳ
  choice: आरोप न हो
  rationale: यह यूनानी पदबंध में निहित आरोप या अभियोग के भाव को सहज हिंदी में व्यक्त करता है।
- source_word: ἀσωτίας
  choice: उच्छृंखल जीवन
  rationale: यह फिजूलखर्ची, नैतिक असंयम और बेलगाम आचरण के संयुक्त भाव को सामान्य पाठक के लिए स्पष्ट रूप में व्यक्त करता है।
- source_word: ἀνυπότακτα
  choice: अवज्ञाकारी
  rationale: यह उचित अधीनता या अनुशासन को न मानने का भाव देता है और पारिवारिक संदर्भ में स्वाभाविक है।
theological_decisions:
- issue: τέκνα ἔχων πιστά में πιστά का अर्थ
  choice: विश्वासयोग्य बच्चे
  alternative: विश्वास करनेवाले बच्चे
  rationale: यह विशेषण इस संदर्भ में नैतिक विश्वसनीयता और मसीही विश्वास—दोनों अर्थ ग्रहण कर सकता है। मुख्य पाठ व्यापक अर्थ रखता है और वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित करता है।
- issue: μιᾶς γυναικὸς ἀνήρ का आशय
  choice: एक ही पत्नी का पति
  alternative: अपनी पत्नी के प्रति निष्ठावान पुरुष
  rationale: यूनानी मुहावरे के वैवाहिक और नैतिक निहितार्थों पर मतभेद है। पारदर्शी अनुवाद किसी संप्रदायगत निष्कर्ष को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है। वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। आरोप-संबंधी कानूनी भाव, बच्चों के विषय में यूनानी अस्पष्टता और वैवाहिक मुहावरे की व्याख्यात्मक खुली गुंजाइश सुरक्षित रखी गई है।
