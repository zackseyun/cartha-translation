base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: hi
  text: उन्हीं में से किसी ने, जो उनका अपना भविष्यद्वक्ता था, कहा, “क्रेती लोग सदा झूठे, दुष्ट पशु और आलसी पेटू होते हैं।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आलसी पेट।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: उन्हीं में से किसी ने ... कहा है
  rationale: τις ἐξ αὐτῶν का अनिश्चित और अंशवाचक भाव स्वाभाविक हिन्दी में बना रहता है; पूर्ण क्रिया को उद्धरण के वर्तमान संदर्भ में ‘कहा है’ से व्यक्त किया गया है।
- source_word: ἴδιος αὐτῶν προφήτης
  choice: जो उनका अपना भविष्यद्वक्ता था
  rationale: ἴδιος उनके अपने समुदाय से संबंध पर बल देता है; संबंधवाचक उपवाक्य हिन्दी में वक्ता की पहचान स्पष्ट करता है।
- source_word: Κρῆτες
  choice: क्रेती लोग
  rationale: यह क्रेते द्वीप के निवासियों का जातिवाचक नाम है; ‘क्रेती लोग’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἀεὶ ψεῦσται
  choice: सदा झूठे
  rationale: ἀεί का सीधा अर्थ ‘सदा’ और ψεῦσται का अर्थ ‘झूठे’ है; सूक्तिपरक कथन की तीक्ष्णता सुरक्षित रहती है।
- source_word: κακὰ θηρία
  choice: दुष्ट पशु
  rationale: यह रूपक मूल के नैतिक विशेषण और पशु-बिंब दोनों को बिना नरम किए बनाए रखता है।
- source_word: γαστέρες ἀργαί
  choice: आलसी पेटू
  rationale: शाब्दिक अर्थ ‘आलसी पेट’ है; ‘आलसी पेटू’ हिन्दी में उपभोगप्रिय और काम से जी चुराने वाले लोगों के लिए बोधगम्य अपमानजनक अभिव्यक्ति है।
theological_decisions:
- issue: पौलुस द्वारा उद्धृत जातीय रूढ़ि का अनुवाद
  choice: इसे उनके अपने भविष्यद्वक्ता के कथन के रूप में सीधे उद्धृत करते हुए कठोर भाषा को बनाए रखना
  alternative: कथन की कठोरता घटाने के लिए नरम भावानुवाद करना
  rationale: यूनानी पाठ स्पष्ट रूप से इसे उद्धरण और ‘उनका अपना भविष्यद्वक्ता’ का कथन बताता है। अनुवाद को न तो इसकी तीक्ष्णता कम करनी चाहिए, न उद्धरण के प्रसंग से आगे बढ़कर इसे सार्वकालिक धर्मसैद्धांतिक दावा बनाना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। उद्धृत सूक्ति की कठोर, लयात्मक त्रयी—‘झूठे, दुष्ट पशु और आलसी पेटू’—को सुरक्षित रखा गया है; शाब्दिक मुहावरे को पादटिप्पणी में दिया गया है।
