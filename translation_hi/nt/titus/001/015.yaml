source:
  edition: SBLGNT
  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: hi
  text: शुद्ध लोगों के लिए सब वस्तुएँ शुद्ध हैं; पर जो दूषित और अविश्वासी हैं, उनके लिए कुछ भी शुद्ध नहीं। बल्कि उनका मन और उनका विवेक—दोनों दूषित हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में ‘शुद्ध’ के लिए आया यूनानी शब्द धार्मिक रीति से स्वच्छ होने और नैतिक रूप से शुद्ध होने—दोनों का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: सब वस्तुएँ
  rationale: नपुंसकलिंग बहुवचन का व्यापक अर्थ बनाए रखता है और सूक्तिपरक वाक्य को स्वाभाविक हिन्दी देता है।
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: शुद्ध / शुद्ध लोगों
  rationale: ‘शुद्ध’ धार्मिक और नैतिक—दोनों अर्थ-संकेतों को समेट सकता है; एक ही शब्द का प्रयोग पूरे पद में यूनानी पुनरावृत्ति को सुरक्षित रखता है।
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: जो दूषित ... हैं
  rationale: पूर्णकालिक कृदंत से व्यक्त वर्तमान दूषित दशा को सहज हिन्दी में दर्शाता है।
- source_word: ἀπίστοις
  choice: अविश्वासी
  rationale: यहाँ सच्चे विश्वास के अभाव का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: οὐδὲν καθαρόν
  choice: कुछ भी शुद्ध नहीं
  rationale: पहले उपवाक्य की संरचना और शुद्धता के समान अर्थ-क्षेत्र को बनाए रखता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: बाहरी वस्तुओं से हटाकर व्यक्ति की भीतरी दशा पर दिए गए प्रबल विरोध और स्पष्टीकरण को व्यक्त करता है।
- source_word: μεμίανται
  choice: दूषित हैं
  rationale: पूर्णकालिक रूप की परिणामी वर्तमान दशा को संक्षेप में व्यक्त करता और पहले आए ‘दूषित’ से शब्दगत संबंध बनाए रखता है।
- source_word: νοῦς
  choice: मन
  rationale: सोचने और समझने की क्षमता के लिए सामान्य, स्पष्ट और सन्दर्भानुकूल हिन्दी शब्द।
- source_word: συνείδησις
  choice: विवेक
  rationale: नैतिक आत्मबोध और निर्णय-क्षमता के लिए प्रचलित तथा गरिमापूर्ण हिन्दी रूप।
- source_word: καὶ ... καὶ
  choice: —दोनों
  rationale: युग्मित καὶ का बल स्वाभाविक हिन्दी में स्पष्ट करता है कि मन और विवेक दोनों प्रभावित हैं।
theological_decisions:
- issue: शुद्धता की भाषा का दायरा
  choice: καθαρός को पूरे पद में ‘शुद्ध’ रखा गया है, ताकि धार्मिक और नैतिक दोनों आयाम खुले रहें।
  alternative: पूरे पद में ‘स्वच्छ’ अथवा ‘पवित्र’ कहना, जिससे क्रमशः बाहरी/अनुष्ठानिक या नैतिक अर्थ अधिक प्रमुख हो सकता है।
  rationale: निकटवर्ती सन्दर्भ शुद्धता-सम्बन्धी नियमों की ओर संकेत करता है, पर कथन व्यक्ति की आन्तरिक दशा तक भी पहुँचता है; इसलिए किसी एक आयाम तक अर्थ सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सूक्तिपरक समानांतरता, गरिमा और सामान्य पाठक के लिए स्पष्टता बनाए रखी गई है। ‘मन’ और ‘विवेक’ के बाद ‘दोनों’ रखकर यूनानी युग्म पर स्वाभाविक बल दिया गया है।
