  yaml_path: translation/nt/titus/001/008.yaml
  text: but hospitable[a], loving what is good, self-controlled, upright, holy, and disciplined[d][c][b],
translation:
  language: hi
  text: बल्कि वह अतिथि-सत्कार करनेवाला, भलाई से प्रेम रखनेवाला, विवेकी[a], न्यायी[b], पवित्र[c] और संयमी[a] हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यहाँ दो संबंधित, पर अलग गुण हैं: विवेकपूर्ण और संतुलित होना (σώφρονα), तथा अपनी इच्छाओं और आवेगों पर नियंत्रण रखना (ἐγκρατῆ)।'
    reason: lexical_alternative
  - marker: b
    text: या ‘धर्मी’ अथवा ‘खरा’।
    reason: lexical_alternative
  - marker: c
    text: या ‘भक्त’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पिछले पद के निषेधात्मक गुणों के विपरीत अपेक्षित सकारात्मक गुणों को प्रस्तुत करता है।
- source_word: φιλόξενον
  choice: अतिथि-सत्कार करनेवाला
  rationale: यह शब्द मेहमानों और अपरिचितों का स्वागत करने की तत्परता व्यक्त करता है; यह हिंदी में सहज और स्पष्ट है।
- source_word: φιλάγαθον
  choice: भलाई से प्रेम रखनेवाला
  rationale: यह मूल के ‘अच्छे/भले से प्रेम करनेवाला’ अर्थ को स्वाभाविक आधुनिक हिंदी में बनाए रखता है।
- source_word: σώφρονα
  choice: विवेकी
  rationale: यह स्वस्थ समझ, संतुलित सोच और व्यवहारगत संयम का भाव व्यक्त करता है तथा ἐγκρατῆ से भेद बनाए रखता है।
- source_word: δίκαιον
  choice: न्यायी
  rationale: यह आचरण में न्याय और धार्मिकता/सहीपन का अर्थ देता है, बिना अर्थ को केवल न्यायालय-संबंधी बनाए।
- source_word: ὅσιον
  choice: पवित्र
  rationale: यह परमेश्वर के प्रति भक्तिपूर्ण और उचित आचरण का भारपूर्ण, परिचित हिंदी रूप है।
- source_word: ἐγκρατῆ
  choice: संयमी
  rationale: यह इच्छाओं और आवेगों पर नियंत्रण रखने को व्यक्त करता है और σώφρονα के विवेकपूर्ण संतुलन से संबंधित होते हुए भी अलग रहता है।
theological_decisions:
- issue: σώφρονα और ἐγκρατῆ जैसे निकटार्थक गुणों का भेद
  choice: σώφρονα के लिए ‘विवेकी’ और ἐγκρατῆ के लिए ‘संयमी’
  alternative: दोनों को ‘संयमी’ अथवा पहले को ‘आत्म-संयमी’ और दूसरे को ‘अनुशासित’ कहना
  rationale: 'यूनानी पाठ दो संबंधित पर अलग गुण रखता है: पहला स्वस्थ, संतुलित समझ और दूसरा स्वयं पर अधिकार। अलग हिंदी शब्द इस नैतिक बनावट को सुरक्षित रखते हैं।'
- issue: δίκαιον का नैतिक और धार्मिक अर्थ-क्षेत्र
  choice: न्यायी
  alternative: धर्मी; खरा
  rationale: सूची में यह व्यक्ति के सही और न्यायपूर्ण आचरण को दर्शाता है। ‘न्यायी’ उस भाव को स्पष्ट रखता है, जबकि ‘धर्मी’ अधिक व्यापक धर्मवैज्ञानिक अर्थ ग्रहण कर सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज गुण-सूची। कृदंतात्मक पदबंधों से विशेषणों की समानांतरता रखी गई है; ‘विवेकी’ और ‘संयमी’ द्वारा निकटार्थक यूनानी गुणों का भेद सुरक्षित किया गया है।
