  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: hi
  text: क्योंकि परमेश्वर के भण्डारी के रूप में देखरेख करनेवाले को ऐसा होना चाहिए कि उस पर कोई दोषारोपण न हो सके। वह मनमाना, जल्द क्रोध करनेवाला, मदिरा में लिप्त, मारपीट करनेवाला या अनुचित लाभ का लोभी न हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεῖ
  choice: होना चाहिए
  rationale: यह यूनानी पद में निहित आवश्यकता और दायित्व को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के साथ व्याख्यात्मक संबंध को स्पष्ट रखता है।
- source_word: ἐπίσκοπον
  choice: देखरेख करनेवाले
  rationale: यह पद के मूल अर्थ—निगरानी और देखरेख करनेवाला—को व्यक्त करता है और बाद की विशिष्ट कलीसियाई पदानुक्रम-धारणाओं को पाठ में नहीं जोड़ता।
- source_word: ἀνέγκλητον
  choice: जिस पर कोई उचित आरोप न हो
  rationale: यह पूर्ण नैतिक निष्पापता के बजाय ऐसे व्यक्ति का भाव देता है जिसके विरुद्ध कोई टिकने योग्य आरोप न हो।
- source_word: ὡς θεοῦ οἰκονόμον
  choice: परमेश्वर का भण्डारी होने के नाते
  rationale: ‘भण्डारी’ सौंपे गए घर या संसाधनों के प्रबंधन और स्वामी के प्रति जवाबदेही—दोनों भावों को संक्षेप में बनाए रखता है।
- source_word: αὐθάδη
  choice: मनमाना
  rationale: यह अपने ही मन और इच्छा पर अड़कर चलने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ὀργίλον
  choice: जल्द क्रोध करनेवाला
  rationale: यह किसी एक क्रोधपूर्ण घटना के बजाय क्रोध की ओर झुके हुए स्वभाव को दर्शाता है।
- source_word: πάροινον
  choice: मदिरा में लिप्त
  rationale: यह मदिरा-संबंधी अतिशयता को व्यक्त करता है, पर यूनानी से अधिक कठोर ‘शराब का लती’ जैसा दावा नहीं करता।
- source_word: πλήκτην
  choice: मारपीट करनेवाला
  rationale: यह प्रहार करने या हिंसक व्यवहार की प्रवृत्ति को स्पष्ट और वर्तमान हिन्दी में व्यक्त करता है।
- source_word: αἰσχροκερδῆ
  choice: नीच ढंग से कमाए धन का लोभी
  rationale: यह लाभ की लालसा और उसे पाने के नैतिक रूप से लज्जाजनक साधन—दोनों को रखता है; अर्थ को केवल कानूनी बेईमानी तक सीमित नहीं करता।
theological_decisions:
- issue: कलीसियाई संदर्भ में ἐπίσκοπος का अनुवाद
  choice: देखरेख करनेवाला
  alternative: बिशप
  rationale: मूल यूनानी पद कार्य और उत्तरदायित्व पर बल देता है। ‘बिशप’ बाद के विशिष्ट संस्थागत या संप्रदायगत पदानुक्रम का संकेत दे सकता है, जिसे यह पद स्वयं अनिवार्य नहीं करता।
