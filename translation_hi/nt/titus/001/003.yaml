  text: ἐφανέρωσεν δὲ καιροῖς ἰδίοις, τὸν λόγον αὐτοῦ ἐν κηρύγματι ὃ ἐπιστεύθην ἐγὼ κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/003.yaml
  text: but in his own times he revealed his word through the proclamation with which I was entrusted[a], according to the command of God our Savior[c][b],
translation:
  language: hi
  text: पर अपने ठहराए हुए समयों पर उसने अपने वचन को उस घोषणा के द्वारा प्रकट किया, जो मुझे सौंपी गई थी[a], हमारे उद्धारकर्ता परमेश्वर की आज्ञा के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी समझा जा सकता है कि ‘जो मुझे सौंपी गई थी’ का संबंध ‘अपने वचन’ से है: ‘अपने उस वचन को ... जो मुझे सौंपा गया था।’'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: उसने ... प्रकट किया
  rationale: यह परमेश्वर को निहित कर्ता मानते हुए यूनानी क्रिया के उस भाव को व्यक्त करता है जिसमें पहले छिपी बात को खुलकर जाना जाता है।
- source_word: καιροῖς ἰδίοις
  choice: अपने ठहराए हुए समयों पर
  rationale: ‘अपने’ ἰδίοις के संबंधसूचक बल को बचाता है, जबकि ‘ठहराए हुए’ इन अवसरों के परमेश्वर-नियुक्त और उपयुक्त होने का स्वाभाविक हिन्दी संकेत देता है।
- source_word: τὸν λόγον αὐτοῦ
  choice: अपने वचन को
  rationale: ‘वचन’ λόγος के पारंपरिक किंतु आज भी बोधगम्य धार्मिक अर्थ को रखता है और परमेश्वर के प्रकट किए गए संदेश को सूचित करता है।
- source_word: ἐν κηρύγματι
  choice: उस घोषणा के द्वारा
  rationale: ἐν को साधन के अर्थ में व्यक्त करता है और κήρυγμα को केवल प्रचार करने की क्रिया तक सीमित किए बिना सार्वजनिक घोषणा का भाव देता है।
- source_word: ὃ ... ἐπιστεύθην
  choice: जो मुझे सौंपी गई थी
  rationale: नपुंसकलिंग संबंधवाचक सर्वनाम का निकटतम पूर्वपद κήρυγμα है; हिन्दी में ‘घोषणा’ स्त्रीलिंग होने के कारण व्याकरणिक सामंजस्य स्त्रीलिंग में है। ἐπιστεύθην यहाँ विश्वास करने के बजाय दायित्व सौंपे जाने को व्यक्त करता है।
- source_word: κατ’ ἐπιταγὴν
  choice: आज्ञा के अनुसार
  rationale: अधिकृत निर्देश के अनुरूप कार्य किए जाने का भाव ठीक और स्वाभाविक रूप से देता है।
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: हमारे उद्धारकर्ता परमेश्वर की
  rationale: ‘उद्धारकर्ता’ को परमेश्वर की उपाधि के रूप में रखता है और यूनानी संबंधकारक वाक्यांश को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἐφανέρωσεν का निहित कर्ता और καιροῖς ἰδίοις में संबंधसूचक भाव
  choice: 'परमेश्वर कर्ता है: ‘अपने ठहराए हुए समयों पर उसने ... प्रकट किया।’'
  alternative: 'निर्वैयक्तिक अनुवाद: ‘उचित समय पर वह प्रकट किया गया।’'
  rationale: पूर्ववर्ती संदर्भ में परमेश्वर प्रतिज्ञा करता है और अब उसे प्रकट करता है; व्यक्तिगत कर्ता रखने से विचार-प्रवाह और ἰδίοις का संबंधसूचक बल दोनों सुरक्षित रहते हैं।
- issue: संबंधवाचक सर्वनाम ὃ का पूर्वपद
  choice: इसे निकटवर्ती ‘घोषणा’ से जोड़ा गया है।
  alternative: 'इसे ‘वचन’ से जोड़ना: ‘अपने वचन को ... जो मुझे सौंपा गया था।’'
  rationale: वचन-विन्यास में κήρυγμα निकटतम उपयुक्त पूर्वपद है और ἐπιστεύθην सौंपी गई घोषणा के अर्थ में सहज है; फिर भी ‘वचन’ से संबंध व्याकरणतः संभव है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘वचन’, ‘घोषणा’, ‘उद्धारकर्ता’ और ‘आज्ञा’ परिचित बाइबलीय शब्द हैं। यूनानी के बहुवचन καιροῖς को ‘समयों’ से सुरक्षित रखा गया है।
