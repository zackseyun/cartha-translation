  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: hi
  text: क्योंकि बहुत-से लोग विद्रोही, व्यर्थ बातें करनेवाले और बहकानेवाले हैं—खासकर खतना करानेवालों में से।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खतना-समूह के लोग” अथवा “खतने से जुड़े लोग।” यह वाक्यांश संभवतः यहूदी या यहूदी रीति मनवानेवाले विरोधियों की ओर संकेत करता है, पर यूनानी में यह पहचान इतनी स्पष्ट नहीं है।
    reason: वैकल्पिक अर्थ और ऐतिहासिक संदर्भ की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले निर्देश का कारण बताता है और हिन्दी में वाक्य-संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: विशेषण यहाँ व्यक्तियों के लिए संज्ञा के रूप में प्रयुक्त है; हिन्दी में ‘लोग’ जोड़ना स्वाभाविक और स्पष्ट है।
- source_word: ἀνυπότακτοι
  choice: विद्रोही
  rationale: यह उचित अधिकार के अधीन न होने या मानने से इनकार करने का भाव व्यक्त करता है; ‘विद्रोही’ सरल और वर्तमान हिन्दी है।
- source_word: ματαιολόγοι
  choice: व्यर्थ बातें करनेवाले
  rationale: यह ऐसे लोगों को दर्शाता है जिनकी बातें खोखली या निष्फल हैं; यह रूप अर्थ को सहज हिन्दी में बनाए रखता है।
- source_word: φρεναπάται
  choice: भरमानेवाले
  rationale: मूल शब्द मन को धोखा देने या गुमराह करने का भाव रखता है; ‘भरमानेवाले’ उस सक्रिय अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μάλιστα
  choice: खासकर
  rationale: यह बड़े समूह के भीतर एक विशेष उपसमूह पर जोर देता है; ‘खासकर’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: वे, जो खतनेवालों में से हैं
  rationale: यह यूनानी के ‘खतने में से/खतनेवालों में से’ भाव को बनाए रखता है, पर मुख्य पाठ में ‘यहूदी’ या किसी संगठित ‘दल’ की अधिक स्पष्ट पहचान नहीं जोड़ता।
theological_decisions:
- issue: ‘खतनेवालों में से’ का अभिप्रेत समूह
  choice: मुख्य पाठ में अपेक्षाकृत पारदर्शी रूप ‘वे, जो खतनेवालों में से हैं’ रखा गया।
  alternative: ‘खतने के पक्षवालों में से’ अथवा ‘यहूदी समूह में से’
  rationale: संभवतः संकेत यहूदी या यहूदी रीति मनवानेवाले विरोधियों की ओर है, लेकिन यूनानी वाक्यांश इतना स्पष्ट नहीं है कि मुख्य पाठ में ‘दल’ या ‘यहूदी’ अनिवार्य रूप से जोड़ा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सर्वसुलभ रूप अपनाया गया है। ‘खासकर’ तथा ‘भरमानेवाले’ सहज बोलचाल के निकट हैं, जबकि वाक्य की गंभीर चेतावनी बनी रहती है।
