source:
  edition: SBLGNT
  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: hi
  text: इसी कारण मैंने तुम्हें क्रेते में छोड़ा था, ताकि तुम जो बातें अभी बाकी हैं, उन्हें ठीक से व्यवस्थित करो[a] और हर नगर में प्राचीनों को नियुक्त करो[b], जैसा मैंने तुम्हें निर्देश दिया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कमियाँ रह गई थीं, उन्हें ठीक करो।”
    reason: τὰ λείποντα ‘जो शेष या अधूरा है’ और ἐπιδιορθώσῃ ‘ठीक से व्यवस्थित/सुधारना’ का वैकल्पिक, अधिक सुधारात्मक प्रतिपादन।
  - marker: b
    text: शाब्दिक रूप से, “नगर-नगर में।”
    reason: κατὰ πόλιν के वितरणात्मक भाव को प्रत्यक्ष रूप से दर्शाता है।
  - marker: c
    text: या, “जैसा मैंने तुम्हें आज्ञा दी थी।”
    reason: διεταξάμην निर्देश देने से लेकर अधिकारपूर्वक आज्ञा देने तक का अर्थ दे सकता है।
lexical_decisions:
- source_word: Τούτου χάριν
  choice: इसी कारण
  rationale: यह स्वाभाविक आधुनिक हिन्दी में कारणसूचक अभिव्यक्ति है और यूनानी पदबंध के व्याख्यात्मक बल को बनाए रखती है।
- source_word: ἀπέλιπόν
  choice: मैंने ... छोड़ा था
  rationale: यह पौलुस द्वारा तीतुस को क्रेते में रहने के लिए छोड़ने की पिछली घटना को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν Κρήτῃ
  choice: क्रेते में
  rationale: स्थानसूचक पदबंध और द्वीप के प्रचलित हिन्दी नाम को सीधे प्रस्तुत करता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य को सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: τὰ λείποντα
  choice: बाकी रह गए कामों
  rationale: संज्ञीकृत कृदंत उन मामलों या कामों को सूचित करता है जो अभी अधूरे या शेष थे; 'कामों' का प्रयोग हिन्दी में संदर्भ को स्वाभाविक बनाता है, जबकि कमी का वैकल्पिक भाव पादटिप्पणी में रखा गया है।
- source_word: ἐπιδιορθώσῃ
  choice: व्यवस्थित करो
  rationale: यह अधूरे मामलों को ठीक करने, क्रम में लाने और पूरा करने के संयुक्त भाव को संक्षेप में व्यक्त करता है।
- source_word: καταστήσῃς
  choice: नियुक्त करो
  rationale: कलीसियाई संदर्भ में किसी मान्य भूमिका में व्यक्तियों को ठहराने या नियुक्त करने का सटीक और स्वाभाविक अर्थ देता है।
- source_word: κατὰ πόλιν
  choice: हर नगर में
  rationale: κατά के वितरणात्मक भाव को स्पष्ट करता है; शाब्दिक वैकल्पिक अभिव्यक्ति 'नगर-नगर में' पादटिप्पणी में दी गई है।
- source_word: πρεσβυτέρους
  choice: प्राचीनों
  rationale: इस संदर्भ में यह केवल अधिक आयु वाले पुरुषों के बजाय मान्य कलीसियाई अगुओं को सूचित करता है। 'प्राचीन' हिन्दी बाइबलीय प्रयोग में परिचित है और बाद की किसी विशिष्ट संप्रदायगत संरचना को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: जैसा मैंने तुम्हें निर्देश दिया था
  rationale: यह पौलुस के अधिकारपूर्ण निर्देश को बनाए रखता है, पर मुख्य पाठ में स्वर को अनावश्यक रूप से कठोर नहीं बनाता; 'आज्ञा दी थी' की सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: πρεσβυτέρους में कलीसियाई पद का स्वरूप
  choice: '''प्राचीनों'' रखा गया है, बिना बाद की किसी विशिष्ट कलीसियाई शासन-व्यवस्था को इसमें जोड़ने के।'
  alternative: '''पुरनियों'', ''अध्यक्षों'' या ''प्रेस्बिटरों'''
  rationale: तात्कालिक संदर्भ मान्य कलीसियाई नेतृत्व की ओर संकेत करता है, पर यह पद अकेले बाद की संप्रदायगत पद-रचनाओं का निर्णय नहीं करता।
- issue: διεταξάμην की अधिकारसूचक शक्ति
  choice: मुख्य पाठ में 'निर्देश दिया था'
  alternative: '''आज्ञा दी थी'' या ''हिदायत दी थी'''
  rationale: यूनानी क्रिया अधिकारपूर्ण व्यवस्था या आदेश दोनों का भाव दे सकती है। चुना हुआ रूप अधिकार को बनाए रखता है, जबकि अधिक प्रबल सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए सुबोध शैली अपनाई गई है। 'प्राचीन' परिचित बाइबलीय पद है; वाक्यरचना को स्वाभाविक हिन्दी के अनुसार रखा गया है और मूल की वास्तविक अर्थ-सम्भावनाएँ पादटिप्पणियों में सुरक्षित की गई हैं।
