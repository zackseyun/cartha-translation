source:
  edition: SBLGNT
  text: ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/009.yaml
  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: hi
  text: वह उस भरोसेमंद वचन को दृढ़ता से थामे रहे, जो शिक्षा के अनुसार है,[a] ताकि वह शुद्ध शिक्षा के द्वारा प्रोत्साहन देने और विरोध करने वालों का खंडन करने[b]—दोनों में समर्थ हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “शिक्षा के अनुरूप भरोसेमंद वचन को दृढ़ता से थामे रहे।”
    reason: lexical_alternative
  - marker: b
    text: अथवा, “उन्हें गलत सिद्ध करने,” “दोष दिखाने,” या “फटकारने।” यूनानी क्रिया में किसी की गलती उजागर करने या उसे गलत सिद्ध करने के साथ-साथ फटकारने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: दृढ़ता से थामे रहे
  rationale: यह चुनाव सक्रिय और अटल निष्ठा का भाव रखता है तथा प्राचीन की योग्यता के संदर्भ में स्वाभाविक हिन्दी है।
- source_word: πιστοῦ λόγου
  choice: भरोसेमंद वचन
  rationale: πιστός यहाँ मुख्यतः विश्वसनीय या भरोसेमंद होने का अर्थ देता है; λόγος के लिए ‘वचन’ संदेश और कथन दोनों की गुंजाइश बनाए रखता है।
- source_word: κατὰ τὴν διδαχήν
  choice: जो दी गई शिक्षा के अनुसार है
  rationale: κατά अनुरूपता व्यक्त करता है। ‘दी गई’ हिन्दी में यह स्पष्ट करता है कि वचन मान्य शिक्षा के अनुरूप है, बिना किसी बाद की तकनीकी धर्मवैज्ञानिक श्रेणी को जोड़ने के।
- source_word: παρακαλεῖν
  choice: प्रोत्साहित करने
  rationale: παρακαλέω में आग्रह, उत्साह और प्रोत्साहन के अर्थ समाए हैं। यहाँ ‘प्रोत्साहित’ सकारात्मक पासबानी निर्देश को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: खरी शिक्षा के द्वारा
  rationale: ὑγιαίνω का रूपक ऐसी शिक्षा को दर्शाता है जो सही और दोषरहित है। ‘खरी शिक्षा’ प्राकृतिक हिन्दी में ‘sound teaching’ का भाव देती है और अत्यधिक तकनीकी शब्दावली से बचती है।
- source_word: ἀντιλέγοντας
  choice: विरोध करनेवालों
  rationale: यह कृदंत उन लोगों की ओर संकेत करता है जो उक्त वचन या शिक्षा के विरुद्ध बोलते हैं। हिन्दी में वस्तु को अनावश्यक रूप से निश्चित किए बिना संदर्भगत संबंध बना रहता है।
- source_word: ἐλέγχειν
  choice: सुधारने
  rationale: क्रिया में दोष प्रकट करना, गलत सिद्ध करना, डाँटना और सुधारना सम्मिलित हो सकते हैं। ‘सुधारने’ पासबानी लक्ष्य को व्यक्त करता है; अधिक वादात्मक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: δυνατὸς ᾖ
  choice: समर्थ हो
  rationale: यह ἵνα के बाद उद्देश्य के अंतर्गत योग्यता या सामर्थ्य व्यक्त करता है; ‘समर्थ हो’ संक्षिप्त और प्रतिष्ठित हिन्दी है।
theological_decisions:
- issue: ‘शिक्षा’ और ‘भरोसेमंद वचन’ का संदर्भ
  choice: इन्हें कलीसिया के अगुवों को सौंपी गई मान्य मसीही शिक्षा के रूप में खुला रखा गया है।
  alternative: सामान्य नैतिक शिक्षा या अगुवे की निजी राय
  rationale: निश्चित उपपद वाली διδαχή और पास्तरी पत्रियों में πιστὸς λόγος का प्रयोग स्थापित शिक्षा की ओर संकेत करता है, पर मुख्य पाठ बाद की धर्मसैद्धांतिक शब्दावली नहीं जोड़ता।
- issue: विरोधियों के संबंध में ἐλέγχειν
  choice: मुख्य पाठ में ‘सुधारने’ और पादटिप्पणी में ‘गलत सिद्ध करने या डाँटकर समझाने’ का विकल्प
  alternative: केवल ‘खण्डन करने’ या केवल ‘डाँटने’
  rationale: यूनानी क्रिया प्रमाण द्वारा दोष दिखाने और सुधारात्मक फटकार—दोनों का भाव रख सकती है। मुख्य पाठ पासबानी पक्ष रखता है और पादटिप्पणी वादात्मक तथा फटकार संबंधी अर्थ सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘वचन’, ‘खरी शिक्षा’ और ‘समर्थ’ जैसे परिचित शब्द रखे गए हैं; अस्पष्टता को पादटिप्पणियों में सुरक्षित किया गया है।
