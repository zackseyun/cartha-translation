source:
  edition: SBLGNT
  text: Δούλους ἰδίοις δεσπόταις ὑποτάσσεσθαι ἐν πᾶσιν, εὐαρέστους εἶναι, μὴ ἀντιλέγοντας,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/009.yaml
  text: Servants are to submit to their own masters in everything[a], to be pleasing, not argumentative[b],
translation:
  language: hi
  text: दास[a] हर बात में अपने-अपने स्वामियों के अधीन रहें और उन्हें प्रसन्न करनेवाले हों; वे पलटकर जवाब न दें[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बंधुआ सेवक”; यूनानी शब्द δοῦλος सेवा करनेवाले व्यक्ति को भी दर्शा सकता है, पर यहाँ दासता की बंधी हुई स्थिति संभवतः अभिप्रेत है।
    reason: alternative_reading
  - marker: b
    text: या “बात न काटें” अथवा “विरोध में न बोलें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δούλους
  choice: दास
  rationale: यहाँ δεσπόταις के साथ घरेलू दासता की वास्तविक सामाजिक स्थिति अभिप्रेत है। ‘सेवक’ इस बंधी हुई स्थिति को अनावश्यक रूप से नरम कर सकता है, जबकि ‘दास’ आधुनिक हिन्दी में स्पष्ट और ऐतिहासिक रूप से उपयुक्त है।
- source_word: ἰδίοις δεσπόταις
  choice: अपने-अपने स्वामियों
  rationale: ἰδίοις की वितरणात्मक निजता को ‘अपने-अपने’ व्यक्त करता है और δεσπόταις के स्वामित्व तथा अधिकार के भाव के लिए ‘स्वामियों’ स्वाभाविक हिन्दी है।
- source_word: ὑποτάσσεσθαι
  choice: के अधीन रहें
  rationale: यह पद अपेक्षित अधीनता की निरंतर प्रवृत्ति व्यक्त करता है। ‘अधीन रहें’ उपदेशात्मक आशय को सहज आधुनिक हिन्दी में रखता है।
- source_word: ἐν πᾶσιν
  choice: हर बात में
  rationale: यह व्यापक दायरे को दर्शाता है और हिन्दी में ‘सब बातों में’ की अपेक्षा अधिक सहज है; इसे अधीन रहने के साथ रखा गया है, जैसा यूनानी वाक्यक्रम संकेत करता है।
- source_word: εὐαρέστους εἶναι
  choice: उन्हें प्रसन्न करनेवाले हों
  rationale: εὐαρέστους का अर्थ प्रसन्नकारी या स्वीकार्य होना है। प्रसंग से स्वामी इसके निहित लक्ष्य हैं; हिन्दी में ‘उन्हें’ जोड़ना अर्थ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: μὴ ἀντιλέγοντας
  choice: पलटकर जवाब न दें
  rationale: ἀντιλέγω यहाँ मौखिक विरोध, बात काटने या प्रत्युत्तर देने का भाव रखता है। ‘पलटकर जवाब देना’ आधुनिक हिन्दी में उस व्यवहार को स्पष्ट करता है, बिना इसे केवल सामान्य वाद-विवाद तक सीमित किए।
theological_decisions:
- issue: घरेलू दासता के प्रसंग में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक / बंधुआ सेवक
  rationale: स्वामियों के अधिकार के अधीन व्यक्तियों की वास्तविक बंधी हुई सामाजिक स्थिति यहाँ प्रमुख है। ‘दास’ मूल पाठ की कठोर ऐतिहासिक वास्तविकता को छिपाता नहीं है; यह अनुवाद उस संस्था का समर्थन करने का कथन नहीं है।
- issue: ἐν πᾶσιν के व्यापक दायरे का निरूपण
  choice: हर बात में
  alternative: हर प्रकार से / सब बातों में
  rationale: मूल वाक्य व्यापक अधीनता की अपेक्षा व्यक्त करता है। अनुवाद उस तनाव को बनाए रखता है और पाठ में न दी गई सीमा को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पिछले निर्देश पर निर्भर यूनानी वाक्यांश है, इसलिए हिन्दी में उपदेशात्मक रूप ‘रहें/हों/दें’ अपनाया गया है। अंतिम अल्पविराम अगले पद से वाक्य के जारी रहने को दर्शाता है।
