  text: προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/013.yaml
  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: hi
  text: और उस धन्य आशा तथा हमारे महान परमेश्वर और उद्धारकर्ता, यीशु मसीह की महिमा के प्रकट होने की प्रतीक्षा करते हुए,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: प्रतीक्षा करते हुए
  rationale: यह वर्तमान कृदन्त पिछले वाक्य से संबंध बनाए रखता है और निरंतर, उत्सुक प्रतीक्षा का भाव देता है।
- source_word: μακαρίαν ἐλπίδα
  choice: उस धन्य आशा
  rationale: ‘धन्य आशा’ भावी उद्धार की सुनिश्चित और अनुग्रहपूर्ण आशा को व्यक्त करती है; ‘सुखद’ जैसे विकल्प संदर्भ में हल्के पड़ते।
- source_word: ἐπιφάνειαν
  choice: प्रकट होने
  rationale: यह दृश्य और निर्णायक आगमन या अभिव्यक्ति का सहज आधुनिक हिन्दी रूप है; तकनीकी पारिभाषिक शब्द से बचा गया है।
- source_word: δόξης
  choice: महिमा
  rationale: सम्बन्धकारक संरचना को ‘महिमा के प्रकट होने’ के रूप में रखा गया है, बिना उसे केवल व्यक्ति के आगमन में बदलकर मूल अभिव्यक्ति को सरल किए।
- source_word: τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν
  choice: हमारे महान परमेश्वर और उद्धारकर्ता
  rationale: एक ही यूनानी निर्धारक से जुड़े दोनों एकवचन व्यक्तिगत पदों को एक संयुक्त उपाधि के रूप में प्रस्तुत किया गया है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός को उसके पदवीगत अर्थ ‘मसीह’ से दिया गया है; हिन्दी में ‘यीशु मसीह’ स्वाभाविक और प्रतिष्ठित रूप है।
theological_decisions:
- issue: क्या ‘हमारे महान परमेश्वर और उद्धारकर्ता’ एक ही व्यक्ति, यीशु मसीह, को बताता है या परमेश्वर और यीशु को दो अलग व्यक्तियों के रूप में?
  choice: मुख्य पाठ में दोनों उपाधियाँ एक ही व्यक्ति, यीशु मसीह, के लिए हैं।
  alternative: ‘महान परमेश्वर’ और ‘हमारे उद्धारकर्ता यीशु मसीह’ को दो अलग संदर्भ मानना।
  rationale: यूनानी में एक ही निर्धारक दो एकवचन व्यक्तिगत संज्ञाओं को नियंत्रित करता है और उनके बाद ‘यीशु मसीह’ आता है; इसलिए एक ही संदर्भ सबसे स्वाभाविक है। फिर भी व्याकरणिक रूप से प्रस्तावित दो-संदर्भीय समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण धार्मिक गद्य। पद कृदन्त रूप ‘प्रतीक्षा करते हुए’ पर समाप्त होता है, क्योंकि मूल यूनानी में यह पिछले कथन से जुड़ा हुआ वाक्यांश है। ‘तथा’ समन्वित वस्तुओं को स्पष्ट करता है, जबकि अल्पविराम ‘यीशु मसीह’ को संयुक्त उपाधि का समानाधिकरण दिखाता है।
