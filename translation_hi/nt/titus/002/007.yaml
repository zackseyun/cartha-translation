  yaml_path: translation/nt/titus/002/007.yaml
  text: in every way presenting yourself as an example of good works[a]; in your teaching, purity, dignity[e][d][c][b],
translation:
  language: hi
  text: हर बात में अपने आपको भले कामों का एक आदर्श[a] प्रस्तुत करो; अपनी शिक्षा में शुद्धता[b] और गरिमा रखो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भले कामों का एक नमूना” अथवा “उदाहरण।”
    reason: lexical_alternative
  - marker: b
    text: या “खरापन” अथवा “अविकृतता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ πάντα
  choice: हर बात में
  rationale: यह पदबंध यहाँ तीतुस के आचरण की व्यापकता बताता है। हिंदी में ‘हर बात में’ स्वाभाविक है और ‘सब प्रकार से’ का भाव भी समेटता है।
- source_word: σεαυτὸν παρεχόμενος
  choice: अपने आपको ... प्रस्तुत करो
  rationale: मध्यवाची कृदंत का आत्मवाचक बल बनाए रखते हुए तीतुस के सक्रिय आत्म-प्रस्तुतीकरण को व्यक्त करता है। हिंदी वाक्य में आज्ञार्थक रूप प्रसंगानुकूल है।
- source_word: τύπον
  choice: एक आदर्श
  rationale: नैतिक प्रसंग में यह अनुकरण योग्य नमूने या उदाहरण को दर्शाता है। ‘आदर्श’ सहज और गरिमापूर्ण हिंदी है।
- source_word: καλῶν ἔργων
  choice: भले कामों का
  rationale: यह τύπον को विशेषित करने वाला संबंधसूचक पदबंध है। ‘भले काम’ आधुनिक हिंदी में स्पष्ट है और अनावश्यक पारिभाषिक भार से बचता है।
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: अपनी शिक्षा में
  rationale: संदर्भ तीतुस के सिखाने के काम और उसकी विषयवस्तु की ओर संकेत करता है। ‘अपनी’ संबंध को स्वाभाविक हिंदी में स्पष्ट करता है, जबकि यूनानी लेख अपने आप में स्वामित्व को निर्दिष्ट नहीं करता।
- source_word: ἀφθορίαν
  choice: शुद्धता
  rationale: इस संदर्भ में भ्रष्टता या मिलावट से मुक्त शिक्षा का भाव व्यक्त करता है। ‘अविनाशिता’ हिंदी में भौतिक अमरता का भ्रम पैदा कर सकती है; ‘शुद्धता’ अर्थ को स्वाभाविक रूप से पहुँचाती है, जबकि ‘खरापन’ भी संभव है।
- source_word: σεμνότητα
  choice: गरिमा
  rationale: यह सम्मान योग्य गंभीरता और मर्यादा का गुण बताता है। ‘गरिमा’ आधुनिक हिंदी में इस भाव को संक्षेप और स्वाभाविकता से व्यक्त करती है।
theological_decisions:
- issue: διδασκαλία को ‘शिक्षा’ या अधिक कलीसियाई ‘सिद्धांत’ कहना
  choice: ‘अपनी शिक्षा में’
  alternative: ‘उपदेश में’ या ‘सिद्धांत में’
  rationale: यहाँ शब्द तीतुस के शिक्षण की क्रिया और विषयवस्तु दोनों को समेट सकता है। ‘शिक्षा’ इस व्यापकता को बनाए रखता है और उसे केवल औपचारिक मत-सिद्धांत तक सीमित नहीं करता।
- issue: ἀφθορίαν का नैतिक या शिक्षण-संबंधी आशय
  choice: ‘शुद्धता’
  alternative: ‘खरापन’, ‘अविकृतता’ या ‘निष्कलंकता’
  rationale: यूनानी शब्द भ्रष्टता या विकृति से मुक्त होने का भाव रखता है, पर यहाँ ठीक-ठीक यह कहना कठिन है कि जोर विषयवस्तु की अविकृतता पर है या शिक्षक की सत्यनिष्ठा पर। ‘शुद्धता’ इस व्यापकता को काफी हद तक सुरक्षित रखती है; पादटिप्पणी विकल्प दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। यूनानी कृदंत को हिंदी में स्वाभाविक आज्ञार्थक वाक्य बनाया गया है। मुख्य पाठ संक्षिप्त रखा गया है और वास्तविक शब्दार्थ-विकल्प पादटिप्पणियों में दिए गए हैं।
