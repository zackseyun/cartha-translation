source:
  edition: SBLGNT
  text: λόγον ὑγιῆ ἀκατάγνωστον, ἵνα ὁ ἐξ ἐναντίας ἐντραπῇ μηδὲν ἔχων ⸂λέγειν περὶ ἡμῶν⸃ φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/008.yaml
  text: sound speech that cannot be condemned[a], so that the one who opposes us may be put to shame[c][b], having nothing evil to say about us.
translation:
  language: hi
  text: ऐसी खरी वाणी बोलो, जिस पर कोई दोष न लगा सके,[a] ताकि विरोधी पक्ष का व्यक्ति लज्जित हो जाए[b] और उसके पास हमारे विषय में कहने के लिए कोई बुरी बात न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वस्थ” या “हितकारी वचन”; अथवा, “निंदा के योग्य न हो।”
    reason: λόγον, ὑγιῆ और ἀκατάγνωστον के निकटवर्ती शब्दार्थ-विकल्पों को सुरक्षित रखना।
  - marker: b
    text: शाब्दिक अर्थ, “विरोधी पक्ष का व्यक्ति।”
    reason: ὁ ἐξ ἐναντίας की यूनानी अभिव्यक्ति स्पष्ट करना।
lexical_decisions:
- source_word: λόγον
  choice: शिक्षा
  rationale: संदर्भ में यह तीतुस द्वारा दी जाने वाली शिक्षा की वाणी और विषय-वस्तु को दर्शाता है। केवल ‘शब्द’ की अपेक्षा ‘शिक्षा’ आधुनिक हिन्दी में आशय अधिक स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ὑγιῆ
  choice: खरी
  rationale: शाब्दिक अर्थ ‘स्वस्थ’ है, पर पास्तरी पत्रियों में यह सही, शुद्ध और हितकारी शिक्षा का रूपक है। ‘खरी’ इस गुण को सहज हिन्दी में व्यक्त करती है।
- source_word: ἀκατάγνωστον
  choice: जिस पर कोई दोष न लगा सके
  rationale: यह ऐसी वाणी या शिक्षा को दर्शाता है जिसके विरुद्ध उचित निंदा या दोषारोपण न किया जा सके। उपवाक्य हिन्दी में विशेषणों के ढेर से अधिक स्वाभाविक है।
- source_word: ὁ ἐξ ἐναντίας
  choice: विरोधी
  rationale: यूनानी पद का अर्थ विरोधी पक्ष में खड़ा व्यक्ति है। ‘विरोधी’ संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: ἐντραπῇ
  choice: लज्जित हो जाए
  rationale: निष्क्रिय रूप सामाजिक और नैतिक लज्जा में पड़ने का भाव देता है; हिन्दी में ‘लज्जित हो जाए’ स्वाभाविक रहते हुए इसे सुरक्षित रखता है।
- source_word: μηδὲν ἔχων λέγειν
  choice: उसके पास ... कुछ भी ... कहने को न हो
  rationale: यह सहभागी रचना आरोप लगाने के लिए कोई आधार या बात न होने को व्यक्त करती है।
- source_word: περὶ ἡμῶν
  choice: हमारे विषय में
  rationale: यूनानी प्रथम पुरुष बहुवचन को बिना संकुचित या विस्तृत किए ज्यों का त्यों रखा गया है।
- source_word: φαῦλον
  choice: बुरा
  rationale: यहाँ शब्द नैतिक रूप से बुरी या निंदनीय बात को सूचित करता है। ‘बुरा’ आधुनिक हिन्दी में स्वाभाविक है और आरोप के संदर्भ में पर्याप्त नैतिक भार रखता है।
theological_decisions:
- issue: περὶ ἡμῶν में प्रथम पुरुष बहुवचन का दायरा
  choice: ‘हमारे विषय में’ रखकर दायरा अनिर्धारित रखा गया।
  alternative: ‘तुम्हारे विषय में’, ‘हम विश्वासियों के विषय में’, या ‘हमारी शिक्षा के विषय में’।
  rationale: मूल पाठ ‘हमारे’ कहता है; इसे तीतुस, मसीही समुदाय या शिक्षा तक सीमित करना पाठ से अधिक विशिष्ट हो जाता।
- issue: λόγον का संदर्भगत अर्थ
  choice: ‘शिक्षा’ चुना गया, जिसमें बोलने का ढंग और सिखाई गई विषय-वस्तु दोनों का संदर्भ संभव है।
  alternative: ‘वाणी’, ‘बात’, या ‘संदेश’।
  rationale: पिछली आयत के शिक्षण-संदर्भ में ‘शिक्षा’ सबसे स्वाभाविक है, फिर भी टिप्पणी में व्यापक अर्थ की संभावना सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। ‘दोष न लगा सके’ और ‘लज्जित हो जाए’ सामान्य पाठक के लिए स्पष्ट हैं। कारणसूचक ‘क्योंकि’ सहभागी वाक्यांश का स्वाभाविक हिन्दी रूप है।
