  text: Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: hi
  text: इन बातों को कहो, समझाओ और पूरे अधिकार के साथ डाँटो। कोई तुम्हें तुच्छ न समझे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: इन बातों
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक शब्द अध्याय में पहले दिए गए निर्देशों की ओर लौटता है; ‘इन बातों’ उसके व्यापक संदर्भ को बिना अनावश्यक रूप से सीमित किए बनाए रखता है।
- source_word: λάλει
  choice: कहते रहो
  rationale: वर्तमानकालीन आज्ञार्थक रूप निरंतर बोलते रहने का भाव दे सकता है। ‘कहते रहो’ स्वाभाविक हिन्दी में इस पक्ष को व्यक्त करता है और इसे केवल ‘सिखाने’ तक सीमित नहीं करता।
- source_word: παρακάλει
  choice: प्रोत्साहित करो
  rationale: παρακαλέω में प्रोत्साहन, आग्रह और समझाने के अर्थ संभव हैं। यहाँ ‘प्रोत्साहित करो’ सामान्य पाठक के लिए स्पष्ट है, जबकि साथ के आज्ञार्थक शब्द उसके नैतिक आग्रह को बनाए रखते हैं।
- source_word: ἔλεγχε
  choice: डाँटो
  rationale: ἐλέγχω गलत बात को उजागर कर सुधारने के लिए फटकारने का भाव रखता है। ‘डाँटो’ इस पासबानी संदर्भ में सीधा और सहज है।
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: पूरे अधिकार के साथ
  rationale: ἐπιταγή आदेश या अधिकार का बोध करा सकता है; इस रचना में ‘पूरे अधिकार के साथ’ इन कार्यों को सौंपे गए अधिकार के पूरे भार से करने का भाव स्वाभाविक रूप से देता है।
- source_word: μηδείς
  choice: कोई ... न
  rationale: निषेधात्मक आज्ञा में μηδείς का मानक और सहज हिन्दी रूप।
- source_word: σου
  choice: तुम्हें
  rationale: περιφρονείτω के साथ सम्बन्धित सर्वनाम को हिन्दी में कर्मकारक ‘तुम्हें’ से स्वाभाविक रूप मिलता है।
- source_word: περιφρονείτω
  choice: तुच्छ न समझे
  rationale: περιφρονέω किसी को छोटा, नगण्य या अवमानना योग्य समझने का अर्थ देता है। ‘तुच्छ न समझे’ उसके व्यक्ति और अधिकार को हेय मानने का भाव बनाए रखता है।
theological_decisions:
- issue: μετὰ πάσης ἐπιταγῆς में तीतुस के सेवकीय अधिकार का बल
  choice: तीतुस को बोलने, प्रोत्साहित करने और डाँटने का काम पूरे सौंपे गए अधिकार के साथ करना है।
  alternative: यह केवल आदेशात्मक लहजे का निर्देश हो सकता है, या अधिकार केवल संदेश का माना जा सकता है।
  rationale: वाक्यांश स्वाभाविक रूप से इन आज्ञार्थक क्रियाओं के ढंग को बताता है। ‘पूरे अधिकार के साथ’ उस बल को सुरक्षित रखता है, पर अधिकार को तीतुस की स्वतंत्र निजी शक्ति नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक। समानांतर आज्ञार्थक क्रियाओं को स्पष्ट रखा गया है और मूल की संक्षिप्त, दृढ़ शैली संरक्षित है।
