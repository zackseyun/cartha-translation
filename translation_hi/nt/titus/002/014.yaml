id: TIT.2.14
reference: Titus 2:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: hi
  text: जिसने अपने आप को हमारे लिए दे दिया, ताकि वह हमें हर प्रकार की अधर्मता से छुड़ाए और अपने लिए एक ऐसी प्रजा को शुद्ध करे जो उसकी अपनी हो[a] और भले काम करने के लिए उत्सुक हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी निज प्रजा” अथवा “उसकी बहुमूल्य प्रजा।” यूनानी पद ऐसी प्रजा का वाचा-संबंधी भाव रखता है जो विशेष रूप से उसकी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: अपने आप को ... दे दिया
  rationale: यह यूनानी पद स्वेच्छापूर्ण आत्म-समर्पण व्यक्त करता है। हिंदी में यह रूप प्रतिवाचक बल और पूर्ण क्रिया दोनों को स्वाभाविक ढंग से बनाए रखता है।
- source_word: ὑπὲρ ἡμῶν
  choice: हमारे लिए
  rationale: यह संक्षिप्त और स्वाभाविक है तथा लाभार्थक और संभावित स्थानापन्न—दोनों अर्थछायाओं को किसी एक प्रायश्चित-सिद्धांत तक सीमित किए बिना खुला रखता है।
- source_word: ἵνα λυτρώσηται
  choice: ताकि वह हमें ... छुड़ाए
  rationale: λυτρόομαι में मूल्य देकर मुक्त करने अथवा बंधन से छुटकारा देने की धारणा है। 'छुड़ाए' सामान्य पाठक के लिए सहज है और मुक्ति का प्रमुख भाव सुरक्षित रखता है।
- source_word: ἀπὸ πάσης ἀνομίας
  choice: हर प्रकार की अधर्मता से
  rationale: ἀνομία व्यवस्था-विरोध अथवा अधर्मता का बोध कराता है। 'हर प्रकार की' πάσης की व्यापकता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: καθαρίσῃ
  choice: शुद्ध करे
  rationale: यह नैतिक और वाचागत शुद्धीकरण, दोनों संदर्भों के अनुकूल है और καθαρίζω का निकट अर्थ देता है।
- source_word: ἑαυτῷ
  choice: अपने लिए
  rationale: यह लाभ और संबंध/अधिकार की दत्तिवाचक भावना को स्पष्ट रखता है।
- source_word: λαὸν περιούσιον
  choice: एक ऐसी प्रजा ... जो उसकी अपनी हो
  rationale: यह περιούσιος में निहित विशिष्ट स्वामित्व और वाचा-संबंधी भाव को स्वाभाविक आधुनिक हिंदी में सुरक्षित रखता है; पादटिप्पणी वैकल्पिक संक्षिप्त रूप देती है।
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: भले काम करने के लिए उत्सुक
  rationale: यह अच्छे कार्यों के प्रति सक्रिय तत्परता को स्पष्ट और सहज हिंदी में व्यक्त करता है, बिना 'जोशीला' जैसे संभावित अस्वाभाविक शब्द के।
theological_decisions:
- issue: मसीह के आत्म-समर्पण में ὑπὲρ ἡμῶν का बल
  choice: '''हमारे लिए'''
  alternative: '''हमारी ओर से'' या ''हमारे स्थान पर'''
  rationale: यूनानी पद लाभार्थक तथा संदर्भानुसार स्थानापन्न अर्थछाया रख सकता है। चुना हुआ रूप पद को किसी एक विशिष्ट प्रायश्चित-प्रतिमान तक सीमित नहीं करता।
- issue: λαὸν περιούσιον की वाचा-संबंधी अर्थछाया
  choice: '''एक ऐसी प्रजा ... जो उसकी अपनी हो'''
  alternative: '''उसकी निज प्रजा'' या ''बहुमूल्य प्रजा'''
  rationale: चुना हुआ रूप परमेश्वर/मसीह के विशेष अधिकार और संबंध को बनाए रखता है तथा केवल सामान्य 'विशेष प्रजा' की अपेक्षा मूल के स्वामित्व-भाव को अधिक स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'प्रजा' वाचा-संबंधी सामूहिक पहचान को व्यक्त करती है; 'भले काम' नैतिक आग्रह को सामान्य हिंदी में स्पष्ट रखता है।
