source:
  edition: SBLGNT
  text: παιδεύουσα ἡμᾶς, ἵνα ἀρνησάμενοι τὴν ἀσέβειαν καὶ τὰς κοσμικὰς ἐπιθυμίας σωφρόνως καὶ δικαίως καὶ εὐσεβῶς ζήσωμεν ἐν τῷ νῦν αἰῶνι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/012.yaml
  text: training us[a], so that, having renounced ungodliness and worldly desires, we might live self-controlled, righteous, and godly lives in the present age[c][b],
translation:
  language: hi
  text: वह हमें[a] प्रशिक्षित करती है, ताकि हम अभक्ति और सांसारिक अभिलाषाओं[b] का त्याग करके इस वर्तमान युग में संयम से, न्यायपूर्वक और भक्तिपूर्वक जीवन बिताएँ।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमें शिक्षा देती है’ अथवा ‘हमें अनुशासित करती है’; यूनानी शब्द में चरित्र गढ़ने वाले प्रशिक्षण का भाव शामिल है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सांसारिक लालसाओं’।
    reason: lexical_alternative
  - marker: c
    text: 'यूनानी में तीन क्रिया-विशेषण हैं: ‘संयम से, न्यायपूर्वक और भक्तिपूर्वक’; अर्थात ऐसा जीवन जो संयम, न्याय और भक्ति से पहचाना जाए।'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύουσα
  choice: प्रशिक्षण देती है
  rationale: यह कृपा की शिक्षाप्रद और चरित्र-निर्माण करने वाली निरंतर क्रिया को व्यक्त करता है; केवल ‘सिखाती है’ से अधिक व्यापक और ‘अनुशासित करती है’ से अधिक स्वाभाविक है।
- source_word: ἵνα
  choice: कि
  rationale: हिन्दी में ‘प्रशिक्षण देती है कि’ उद्देश्य और अपेक्षित परिणाम का स्वाभाविक संबंध व्यक्त करता है।
- source_word: ἀρνησάμενοι
  choice: त्याग करके
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले के निर्णायक अस्वीकार को दर्शाता है; ‘त्याग करके’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τὴν ἀσέβειαν
  choice: अभक्ति
  rationale: यह परमेश्वर के प्रति श्रद्धा और उचित भक्ति के अभाव का धार्मिक-नैतिक अर्थ बनाए रखता है।
- source_word: τὰς κοσμικὰς ἐπιθυμίας
  choice: सांसारिक अभिलाषाओं
  rationale: यह वर्तमान संसार-व्यवस्था से आकार पाने वाली लालसाओं को दर्शाता है; ‘अभिलाषाएँ’ व्यापक है और केवल कामुक इच्छा तक सीमित नहीं।
- source_word: σωφρόνως
  choice: संयम से
  rationale: यह विवेकपूर्ण आत्म-संयम और अनुशासित आचरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δικαίως
  choice: धार्मिकता से
  rationale: यह सही और न्यायसम्मत आचरण का नैतिक तथा धर्मवैचारिक आयाम बनाए रखता है।
- source_word: εὐσεβῶς
  choice: भक्ति से
  rationale: यह परमेश्वर के प्रति श्रद्धापूर्ण, उन्मुख जीवन को व्यक्त करता है और ἀσέβεια के साथ निहित विरोध भी बनाए रखता है।
- source_word: ζήσωμεν
  choice: जीवन बिताएँ
  rationale: ἵνα के अधीन संभावनार्थक क्रिया का उद्देश्यपरक भाव हिन्दी के विधिलिंग ‘बिताएँ’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: इस वर्तमान युग में
  rationale: ‘युग’ वर्तमान व्यवस्था और आने वाले युग के बीच निहित कालांतशास्त्रीय भेद को ‘समय’ या ‘संसार’ की अपेक्षा अधिक ठीक रखता है।
theological_decisions:
- issue: σωφρόνως καὶ δικαίως καὶ εὐσεβῶς की त्रयी
  choice: संयम, धार्मिकता और भक्ति से जीवन बिताएँ
  alternative: संयमी, धर्मी और भक्तिपूर्ण जीवन बिताएँ
  rationale: यूनानी में तीनों शब्द क्रिया-विशेषण हैं और ‘जीएँ’ को संशोधित करते हैं। हिन्दी में ‘से’ के साथ तीन समानांतर संज्ञाएँ उस संरचना और तीन अलग नैतिक आयामों को सहज ढंग से सुरक्षित रखती हैं।
- issue: ἀσέβεια और εὐσεβῶς का शब्दगत विरोध
  choice: अभक्ति … भक्ति से
  alternative: भक्तिहीनता … भक्तिपूर्वक
  rationale: एक ही शब्द-परिवार का प्रयोग यूनानी पदों के स्पष्ट विरोध को बनाए रखता है, बिना किसी संप्रदायगत अर्थ को जोड़े।
- issue: ἀρνησάμενοι का कालगत संबंध
  choice: त्याग करके
  alternative: त्यागते हुए
  rationale: अओरिस्ट कृदंत को मुख्य जीवन-आचरण से पूर्व या उसके आधारभूत निर्णायक परित्याग के रूप में प्रस्तुत किया गया है, पर इसे एक बार की अपरिवर्तनीय घटना के रूप में अतिरंजित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘अभक्ति/भक्ति’ का जोड़ा मूल के विरोध को सुरक्षित रखता है। पद पिछले वाक्य के कर्ता ‘परमेश्वर की कृपा’ पर निर्भर है, इसलिए स्त्रीलिंग ‘देती है’ रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
