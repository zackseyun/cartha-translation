  - severity: medium
    issue: “धार्मिकता से” does not precisely distinguish δικαίως from εὐσεβῶς.
    rationale: “धार्मिकता” can overlap substantially with “भक्ति,” whereas δικαίως concerns just/right conduct. “न्यायपूर्वक” maintains the interpersonal ethical dimension of the Greek triad.
