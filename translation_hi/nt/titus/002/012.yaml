  terminology: “न्यायपूर्वक” better represents δικαίως as just conduct, while “भक्तिपूर्वक” represents εὐσεβῶς as reverent God-oriented conduct. “अभक्ति” is retained for ἀσέβεια, preserving the lexical contrast with “भक्तिपूर्वक” without introducing a sectarian term.
