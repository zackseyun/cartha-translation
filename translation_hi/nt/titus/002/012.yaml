  source_fidelity: The draft accurately conveys the formative force of παιδεύουσα, the renunciation expressed by ἀρνησάμενοι, the threefold ethical adverbial pattern, and the eschatological sense of ἐν τῷ νῦν αἰῶνι. A small revision improves the purposive force of ἵνα and distinguishes δικαίως (justly/rightly) more clearly from εὐσεβῶς (piously).
