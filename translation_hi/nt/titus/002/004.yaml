- source_word: φιλάνδρους
  choice: अपने पतियों से प्रेम करना
  rationale: यह विशेषण पति के प्रति प्रेम रखने का भाव व्यक्त करता है। हिन्दी में क्रियात्मक अभिव्यक्ति अधिक स्वाभाविक है।
- source_word: εἶναι
  choice: करना
  rationale: यूनानी अनंत क्रिया विशेषणों को ‘होना’ से जोड़ती है; हिन्दी में ‘प्रेम करना सिखाएँ’ उसी पूरक संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: φιλοτέκνους
  choice: बच्चों से प्रेम करना
  rationale: यह विशेषण अपनी संतान के प्रति प्रेम रखने का भाव व्यक्त करता है और पिछले पद के समानांतर अनूदित है।
theological_decisions:
- issue: गृहस्थ-संदर्भ में ‘युवतियों’ को दी जाने वाली शिक्षा का दायरा
  choice: यूनानी के अनुसार संबोधन को ‘युवतियों’ रखा गया है और पति-बच्चों वाले तत्कालीन संदर्भ को सीधे व्यक्त किया गया है।
  alternative: ‘युवा पत्नियों’ कहना, या इसे सभी स्त्रियों के लिए सर्वकालिक और संपूर्ण घरेलू आदर्श के रूप में विस्तार देना।
  rationale: τὰς νέας का अर्थ कम आयु की स्त्रियाँ है, केवल पत्नियाँ नहीं; यद्यपि अगले विशेषण उन संबोधित स्त्रियों की पति और बच्चों वाली परिस्थिति मानते हैं। अनुवाद न तो संदर्भ को मिटाता है, न उसे स्त्रीत्व की सर्वांगीण परिभाषा बनाता है।
