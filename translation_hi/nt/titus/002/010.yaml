  text: not pilfering[a], but showing all good faith, so that in everything they may adorn the teaching of God our Savior.
translation:
  language: hi
  text: वे चोरी न करें, बल्कि पूरी निष्ठा दिखाएँ[a], ताकि वे हर बात में हमारे उद्धारकर्ता परमेश्वर की शिक्षा की शोभा बढ़ाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरी भरोसेमंदी दिखाएँ।” यूनानी शब्द पिस्तिस का सामान्य अर्थ “विश्वास” भी है, पर यहाँ वह संभवतः निष्ठा या भरोसेमंदी के नैतिक अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: νοσφιζομένους
  choice: चोरी न करें
  rationale: यह क्रिया किसी दूसरे की वस्तु को चुपके से अपने लिए रख लेने या हड़प लेने को दर्शाती है। दासों के घरेलू संदर्भ में ‘चोरी न करें’ स्पष्ट, स्वाभाविक और पर्याप्त व्यापक है।
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: पूरी खरी निष्ठा दिखाएँ
  rationale: इस संदर्भ में πίστις मुख्यतः व्यवहारगत निष्ठा, ईमानदारी और भरोसेमंद होने का भाव रखता है। ‘पूरी’ πᾶσαν की व्यापकता और ‘खरी’ ἀγαθήν की अच्छी तथा सच्ची गुणवत्ता व्यक्त करता है।
- source_word: κοσμῶσιν
  choice: शोभा बढ़ाएँ
  rationale: यह रूपक सजाने या सुंदर बनाने का भाव रखता है। ‘शोभा बढ़ाएँ’ रूपक को बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: διδασκαλίαν
  choice: शिक्षा
  rationale: ‘शिक्षा’ आधुनिक हिन्दी में सामान्य और सुबोध है तथा यहाँ दी गई धार्मिक शिक्षा के अर्थ को ठीक से व्यक्त करता है।
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: हमारे उद्धारकर्ता परमेश्वर की
  rationale: यह यूनानी संबंधकारक पदबंध को सीधे व्यक्त करता है और इस वाक्य में ‘उद्धारकर्ता’ की उपाधि परमेश्वर के लिए ही रखता है।
- source_word: ἐν πᾶσιν
  choice: हर बात में
  rationale: यह उनके आचरण के समूचे दायरे को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: नैतिक संदर्भ में πίστις का अर्थ
  choice: मुख्य पाठ में ‘निष्ठा’
  alternative: ‘विश्वास’, ‘विश्वसनीयता’ या ‘भरोसेमंदी’
  rationale: मालिकों के प्रति दासों के आचरण की चर्चा में यह शब्द सैद्धांतिक विश्वास से अधिक निष्ठावान और भरोसेमंद व्यवहार को सूचित करता है। फिर भी शब्द की अर्थ-व्याप्ति को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘हमारे उद्धारकर्ता परमेश्वर’ का संदर्भ
  choice: पदबंध को सीधे परमेश्वर के लिए रखा गया
  alternative: पासबानी पत्रियों में ‘उद्धारकर्ता’ का मसीह के लिए भी प्रयोग ध्यान में रखना
  rationale: इस वाक्यांश में θεοῦ स्पष्ट रूप से ‘उद्धारकर्ता’ को निर्धारित करता है; अनुवाद इस पद से आगे कोई अतिरिक्त मसीह-सम्बन्धी पहचान आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘शोभा बढ़ाएँ’ मूल रूपक को बचाता है, जबकि ‘पूरी खरी निष्ठा’ सेवकों के व्यवहारगत भरोसे को स्वाभाविक हिन्दी में व्यक्त करता है।
