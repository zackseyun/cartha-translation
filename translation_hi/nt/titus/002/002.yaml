  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: hi
  text: बुज़ुर्ग पुरुषों को सतर्क, गरिमामय, आत्म-संयमी, और विश्वास[a], प्रेम तथा धीरज में दृढ़ होना चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वासयोग्यता।” यूनानी πίστις का अर्थ संदर्भ के अनुसार “विश्वास” या “विश्वासयोग्यता” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: बुज़ुर्ग पुरुष
  rationale: घर-परिवार संबंधी निर्देशों के इस संदर्भ में यह पद कलीसियाई प्राचीन के पदनाम के बजाय अधिक आयु के पुरुषों को दर्शाता है।
- source_word: νηφαλίους
  choice: संयमी
  rationale: यह शब्द नशे से दूर और सचेत रहने के साथ व्यापक आत्म-संयम का भाव भी रखता है; ‘संयमी’ हिंदी में इस नैतिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: σεμνούς
  choice: आदरणीय
  rationale: यह ऐसी गंभीर और गरिमामय चाल-चलन को दर्शाता है जो सम्मान के योग्य हो; ‘आदरणीय’ साधारण आधुनिक हिंदी में स्पष्ट है।
- source_word: σώφρονας
  choice: आत्म-संयमी
  rationale: यह विवेकपूर्ण और अनुशासित आत्म-नियंत्रण का बोध कराता है; पास के ‘संयमी’ से अर्थ-संबंध रहते हुए भी स्वयं पर नियंत्रण के पहलू को स्पष्ट करता है।
- source_word: ὑγιαίνοντας
  choice: दृढ़
  rationale: मूल अर्थ ‘स्वस्थ’ या ‘सुदृढ़’ है। विश्वास, प्रेम और धीरज के साथ हिंदी में ‘में दृढ़’ इस रूपक को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: τῇ πίστει
  choice: विश्वास में
  rationale: πίστις का यहाँ ‘विश्वास’ या ‘विश्वासयोग्यता’ दोनों अर्थ संभव हैं। मुख्य पाठ में सामान्य अनुवाद ‘विश्वास’ रखा गया है और दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: τῇ ἀγάπῃ
  choice: प्रेम में
  rationale: ἀγάπη के लिए ‘प्रेम’ सीधा और स्थापित आधुनिक हिंदी रूप है; यह ‘दृढ़’ के अधीन समानांतर दत्तिव संबंध में है।
- source_word: τῇ ὑπομονῇ
  choice: धीरज में
  rationale: ὑπομονή कठिनाई के बीच टिके रहने और धैर्यपूर्ण सहनशीलता को दर्शाता है; ‘धीरज’ सहज हिंदी में इस गुण को समेटता है।
- source_word: εἶναι
  choice: हों
  rationale: अनंत क्रिया पिछले पद के निर्देश पर निर्भर है; हिंदी में विधिसूचक ‘हों’ निर्देशात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: सद्गुणों की सूची में πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता
  rationale: विश्वास, प्रेम और धीरज की त्रयी में πίστις व्यक्ति के विश्वास अथवा उसकी विश्वासयोग्यता, दोनों का संकेत दे सकता है। मुख्य पाठ में ‘विश्वास’ रखा गया है, पर वास्तविक अर्थगत अस्पष्टता को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बुज़ुर्ग पुरुष’ आयु का संकेत देता है, कलीसियाई पद का नहीं। समानार्थी लग सकने वाले ‘संयमी’ और ‘आत्म-संयमी’ मूल के दो अलग गुणों—सचेत मर्यादा और अनुशासित आत्म-नियंत्रण—को बनाए रखते हैं।
