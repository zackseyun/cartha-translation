  text: Πρεσβύτιδας ὡσαύτως ἐν καταστήματι ἱεροπρεπεῖς, μὴ διαβόλους ⸀μηδὲ οἴνῳ πολλῷ δεδουλωμένας, καλοδιδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/003.yaml
  text: Older women likewise are to be reverent in behavior[a], not slanderers nor enslaved to much wine, teachers of what is good[b],
translation:
  language: hi
  text: इसी प्रकार वृद्ध स्त्रियाँ अपने आचरण में पवित्रता के अनुरूप हों, न दूसरों को बदनाम करनेवाली[a], न बहुत दाखरस की दास बनी हुई[b], और जो भला है उसकी शिक्षा देनेवाली हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झूठे दोष लगानेवाली” या “दुर्भावनापूर्ण चुगली करनेवाली।” यूनानी शब्द उसी शब्द से संबंधित है जिसका अनुवाद अक्सर “शैतान” किया जाता है, पर यहाँ इसका अर्थ दूसरों को बदनाम करनेवाले लोग है।
    reason: lexical_alternative
  - marker: b
    text: या, “बहुत दाखरस की लत में पड़ी हुई।” यूनानी में अधिक शाब्दिक रूप से, “बहुत दाखरस की दास बनी हुई” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβύτιδας
  choice: वृद्ध स्त्रियाँ
  rationale: यह स्त्रियों की अधिक आयु को सूचित करता है और पिछले पद के वृद्ध पुरुषों के समानांतर है।
- source_word: ὡσαύτως
  choice: इसी प्रकार
  rationale: यह पिछले उपदेश के साथ स्पष्ट और स्वाभाविक संबंध बनाए रखता है।
- source_word: ἐν καταστήματι ἱεροπρεπεῖς
  choice: अपने आचरण में पवित्रता के योग्य
  rationale: κατάστημα बाहरी चाल-चलन या व्यवहार को और ἱεροπρεπής पवित्र अथवा पावन बातों के अनुरूप होने को व्यक्त करता है। यह अनुवाद दोनों पक्षों को समेटता है।
- source_word: μὴ διαβόλους
  choice: न बदनामी करनेवाली
  rationale: यहाँ διάβολος शैतान का नाम नहीं, बल्कि दूसरों पर निंदात्मक या झूठा आरोप लगानेवाले व्यक्ति का वर्णन है।
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: न बहुत दाखरस की दास बनी हुई
  rationale: पूर्णकालिक कर्मवाच्य कृदंत δεδουλωμένας अधीनता या दासता का सशक्त बिंब रखता है; इसे केवल ‘लत लगी हुई’ कहने से वह बिंब कमज़ोर पड़ता।
- source_word: καλοδιδασκάλους
  choice: भली बातें सिखानेवाली
  rationale: यह दुर्लभ संयुक्त शब्द अच्छे विषय या अच्छी बातों की शिक्षा देने को सूचित करता है, न कि केवल शिक्षण-कौशल को।
theological_decisions:
- issue: दाखरस के संबंध में δουλόω की दासता-छवि
  choice: दास बनी हुई
  alternative: लत लगी हुई
  rationale: मूल पाठ दाखरस के वश में होने को दासता के रूपक से व्यक्त करता है। इस रूपक को बनाए रखने से कथन की नैतिक तीव्रता और मूल अर्थ सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दाखरस’ बाइबलीय संदर्भ में οἶνος का परिचित और सटीक शब्द है। ‘पवित्रता के योग्य’ ἱεροπρεπεῖς के पवित्र बातों के अनुरूप आचरण के भाव को संप्रदायगत विस्तार के बिना व्यक्त करता है।
