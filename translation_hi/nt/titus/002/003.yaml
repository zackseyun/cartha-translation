  to: इसी प्रकार वृद्ध स्त्रियाँ अपने आचरण में पवित्रता के अनुरूप हों, न दूसरों को बदनाम करनेवाली[a], न बहुत दाखरस की दास बनी हुई[b], और जो भला है उसकी शिक्षा देनेवाली हों।
