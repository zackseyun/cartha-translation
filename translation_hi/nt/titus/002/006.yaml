- source_word: ὡσαύτως
  choice: इसी प्रकार
  rationale: यह पिछले निर्देशों के साथ समानांतर संबंध और वाक्य की आलंकारिक निरंतरता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: παρακάλει
  choice: समझा
  rationale: वर्तमान काल की आज्ञा लगातार आग्रहपूर्ण शिक्षा देने का भाव रखती है। ‘समझा’ आधुनिक हिन्दी में प्रोत्साहन, आग्रह और निर्देश के संयुक्त भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: σωφρονεῖν
