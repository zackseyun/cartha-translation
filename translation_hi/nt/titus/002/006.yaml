- issue: σωφρονεῖν का अर्थ-क्षेत्र
  choice: संयमी बनें
  alternative: समझदार बनें / सूझ-बूझ से काम लें
  rationale: मूल शब्द केवल व्यवहार रोकने तक सीमित नहीं, बल्कि स्वस्थ निर्णय और अनुशासित आत्म-नियंत्रण दोनों को समेटता है। मुख्य पाठ में ‘संयमी’ चुना गया और व्यापक अर्थ-पहलू को टिप्पणी में सुरक्षित रखा गया।
