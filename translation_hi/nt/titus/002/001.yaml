  yaml_path: translation/nt/titus/002/001.yaml
  text: But as for you[a], speak the things that are fitting for sound teaching.
translation:
  language: hi
  text: पर तुम वे बातें कहा करो जो खरी शिक्षा के अनुरूप हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σὺ δὲ
  choice: पर तुम
  rationale: स्पष्ट सर्वनाम Σὺ और δὲ मिलकर पिछले प्रसंग के लोगों से तीतुस का विरोध दर्शाते हैं। ‘पर तुम’ आधुनिक हिन्दी में इस विरोध और बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: λάλει
  choice: कहा करो
  rationale: वर्तमानकालीन आज्ञार्थक रूप लगातार या नियमित रूप से बोलने का निर्देश दे सकता है। ‘कहा करो’ इसे केवल औपचारिक शिक्षण तक सीमित किए बिना व्यक्त करता है।
- source_word: ἃ
  choice: ऐसी बातें
  rationale: नपुंसकलिंग बहुवचन सम्बन्धवाचक सर्वनाम तीतुस के कथन की विषयवस्तु बताता है। ‘ऐसी बातें’ हिन्दी में स्वाभाविक है और बहुवचन अर्थ बनाए रखता है।
- source_word: πρέπει
  choice: के अनुरूप हों
  rationale: πρέπει उपयुक्तता या मेल का भाव देता है। इस सन्दर्भ में शिक्षा के ‘अनुरूप’ होना हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ὑγιαινούσῃ
  choice: खरी
  rationale: यहाँ ‘स्वस्थ’ का रूपक ऐसी शिक्षा के लिए है जो सही, विश्वसनीय और विकृतिरहित हो। ‘खरी’ इस रूपक का आशय साधारण आधुनिक हिन्दी में संक्षेप और गरिमा से व्यक्त करता है।
- source_word: διδασκαλίᾳ
  choice: शिक्षा
  rationale: διδασκαλία शिक्षण की क्रिया या उसकी विषयवस्तु दोनों का संकेत दे सकता है। ‘शिक्षा’ इस सम्भावित व्यापकता को बनाए रखती है और ‘सिद्धान्त’ की अपेक्षा अधिक सुलभ है।
theological_decisions:
- issue: τῇ ὑγιαινούσῃ διδασκαλίᾳ का अनुवाद
  choice: खरी शिक्षा
  alternative: स्वस्थ शिक्षा; खरा सिद्धान्त
  rationale: यह वाक्यांश प्रेरितीय शिक्षा की सत्यता और अहानिकर, सुदृढ़ प्रकृति को व्यक्त करता है। ‘खरी शिक्षा’ सही और विश्वसनीय शिक्षा का भाव देता है, पर इसे केवल तकनीकी ‘सिद्धान्त’ तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पर तुम’ प्रसंगगत विरोध को, और ‘कहा करो’ निरन्तर निर्देश को स्वाभाविक हिन्दी में व्यक्त करता है।
