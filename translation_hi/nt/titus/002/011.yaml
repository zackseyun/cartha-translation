  text: क्योंकि परमेश्वर का अनुग्रह प्रकट हुआ है, जो सब लोगों[b] के लिए उद्धार लाता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “जो सब लोगों का उद्धार करता है” या “सब लोगों को प्रकट हुआ है।” यूनानी में “उद्धारकारी” और “सब लोगों” के बीच संबंध को एक से अधिक ढंग से समझा जा सकता है।'
    reason: lexical_alternative
  - marker: b
    text: “लोगों” के लिए प्रयुक्त यूनानी शब्द यहाँ सामान्य रूप से पूरी मानवजाति को दर्शाता है, केवल पुरुषों को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: प्रकट हुआ है
  rationale: यह क्रिया यहाँ अकर्मक अर्थ में ‘प्रकट होना’ व्यक्त करती है। पूर्ण वर्तमान हिंदी में उस ऐतिहासिक प्रकट होने और उसकी वर्तमान प्रासंगिकता दोनों का स्वाभाविक संकेत मिलता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले उपदेशों का आधार या कारण प्रस्तुत करता है; आधुनिक हिंदी में ‘क्योंकि’ संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: परमेश्वर का अनुग्रह
  rationale: ‘अनुग्रह’ पौलुस की भाषा में स्थापित और गरिमापूर्ण शब्द है; संबंधकारक पदबंध को ‘परमेश्वर का’ सीधे रूप में सुरक्षित रखता है।
- source_word: σωτήριος
  choice: उद्धार लाता है
  rationale: यह विशेषण अनुग्रह को उद्धारकारी बताता है। संबंधवाचक उपवाक्य हिंदी में अर्थ को स्वाभाविक बनाता है, बिना किसी विशिष्ट उद्धार-सिद्धांत को जोड़ने के।
- source_word: πᾶσιν ἀνθρώποις
  choice: सब लोगों के लिए
  rationale: ἄνθρωποι यहाँ केवल पुरुषों के लिए नहीं, सामान्य रूप से मनुष्यों के लिए है। ‘के लिए’ दत्तिव के लाभ/संदर्भार्थ को व्यक्त करता है और यूनानी की व्यापकता बनाए रखता है।
theological_decisions:
- issue: πᾶσιν ἀνθρώποις के संबंध में उद्धार का दायरा
  choice: सब लोगों के लिए
  alternative: सब लोगों को; हर प्रकार के लोगों के लिए
  rationale: अनुवाद यूनानी पदबंध की सार्वभौमिक व्यापकता को बनाए रखता है, पर यह तय नहीं करता कि आशय बिना अपवाद हर व्यक्ति है या सभी वर्गों के लोग।
- issue: σωτήριος और πᾶσιν ἀνθρώποις का वाक्यगत संबंध
  choice: जो सब लोगों के लिए उद्धार लाता है
  alternative: सब लोगों का उद्धार करने वाला प्रकट हुआ है; सब लोगों पर प्रकट हुआ है
  rationale: चुना हुआ रूप σωτήριος को ‘अनुग्रह’ का विशेषण मानता है और दत्तिव को लाभ/संदर्भ के रूप में पढ़ता है; अन्य संभावित संबंधों को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अनुग्रह’ और ‘उद्धार’ जैसे प्रचलित बाइबिलीय शब्द सामान्य हिंदी पाठकों के लिए पर्याप्त रूप से परिचित हैं। पादटिप्पणी-चिह्न मुख्य पाठ में उसी क्रम में रखे गए हैं जिसमें संबंधित अस्पष्टता सामने आती है।
