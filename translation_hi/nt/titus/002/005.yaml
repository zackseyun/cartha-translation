source:
  edition: SBLGNT
  text: σώφρονας, ἁγνάς, ⸀οἰκουργούς, ἀγαθάς, ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν, ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/005.yaml
  text: self-controlled[a], pure, working at home, kind, being subject to their own husbands[c][b], so that the word of God may not be slandered.
translation:
  language: hi
  text: संयमी, शुद्ध, घर के काम में लगी रहनेवाली[a], दयालु और अपने-अपने पतियों के अधीन रहनेवाली[b] हों, ताकि परमेश्वर के वचन की निंदा[c] न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘घर के काम में व्यस्त’ अथवा ‘घर संभालनेवाली।’ यूनानी शब्द दुर्लभ है और घर के कामों में लगे रहने का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने-अपने पतियों के अधीन होती हुई।’
    reason: lexical_alternative
  - marker: c
    text: या ‘बदनाम न किया जाए’; अधिक शाब्दिक रूप में, ‘ईशनिंदा न की जाए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: σώφρονας
  choice: संयमी
  rationale: यह शब्द विवेकपूर्ण आत्म-संयम को व्यक्त करता है। ‘संयमी’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और इस सद्गुण-सूची के अनुकूल है।
- source_word: ἁγνάς
  choice: शुद्ध
  rationale: यहाँ नैतिक पवित्रता का भाव है। ‘शुद्ध’ व्यापक अर्थ को बनाए रखता है और अनावश्यक रूप से इसे केवल यौन शुचिता तक सीमित नहीं करता।
- source_word: οἰκουργούς
  choice: घर के काम में लगी रहनेवाली
  rationale: यह दुर्लभ शब्द घर और काम के विचारों को जोड़ता है तथा घरेलू दायित्वों में सक्रियता बताता है। यह अनुवाद श्रम के भाव को रखता है, पर घर में बंद रहने का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἀγαθάς
  choice: दयालु
  rationale: सद्गुणों और पारस्परिक आचरण की इस सूची में ‘दयालु’ सामान्य ‘अच्छी’ की अपेक्षा संबंधपरक भलाई को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑποτασσομένας
  choice: अधीन रहनेवाली
  rationale: कृदंत वैवाहिक संबंध में व्यवस्थित अधीनता का भाव रखता है। यह चयन यूनानी के निकट रहते हुए स्वेच्छा या बलपूर्वकता जैसी अतिरिक्त धारणा नहीं जोड़ता।
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: अपने-अपने पतियों के
  rationale: गृहस्थी के प्रसंग में ἀνήρ का अर्थ ‘पति’ है। ‘अपने-अपने’ यूनानी ἰδίοις को बनाए रखता और निर्देश का दायरा प्रत्येक स्त्री के अपने वैवाहिक संबंध तक सीमित करता है।
- source_word: ἵνα μὴ
  choice: ताकि ... न हो
  rationale: यह उद्देश्यसूचक रचना को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: यह यूनानी पदबंध का सीधा और हिन्दी बाइबलीय प्रयोग में स्थापित रूप है; प्रसंग में इसका संकेत परमेश्वर के संदेश की ओर है।
- source_word: βλασφημῆται
  choice: निंदा न हो
  rationale: क्रिया बदनाम करने, अपमानजनक ढंग से बोलने या ईशनिंदा करने का अर्थ दे सकती है। परमेश्वर का वचन यहाँ कर्म है, इसलिए ‘निंदा’ सार्वजनिक बदनामी के भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions:
- issue: οἰκουργούς का ऐसा अनुवाद जो घरेलू दायित्व बताए पर घर तक सीमित रहने का अतिरिक्त आदेश न बनाए
  choice: घर के काम में लगी रहनेवाली
  alternative: घर संभालनेवाली; घर के काम में व्यस्त
  rationale: यूनानी शब्द उत्पादक घरेलू काम में संलग्नता पर बल देता है। चुना हुआ रूप न तो श्रम के तत्व को मिटाता है, न ही पाठ से आगे बढ़कर सामाजिक एकांत या अन्य कामों के निषेध का सिद्धांत बनाता है।
- issue: ὑποτασσομένας में वैवाहिक संबंध की व्यवस्था को सांप्रदायिक विस्तार के बिना बनाए रखना
  choice: अपने-अपने पतियों के अधीन रहनेवाली
  alternative: अपने-अपने पतियों के प्रति समर्पित रहनेवाली
  rationale: ‘अधीन रहनेवाली’ मूल पाठ के संबंधपरक क्रम को सुरक्षित रखता है। ‘अपने-अपने पतियों’ से इसका दायरा स्पष्ट रूप से वैवाहिक संबंध तक सीमित रहता है; पद से परे कोई व्यापक स्त्री-पुरुष व्यवस्था नहीं जोड़ी गई।
- issue: βλασφημῆται का अर्थ परमेश्वर के वचन के संदर्भ में
  choice: निंदा न हो
  alternative: बदनामी न हो; ईशनिंदा न हो
  rationale: मूल क्रिया में निंदा, अपमान और ईशनिंदा की अर्थ-सीमा है। ‘निंदा’ इस संदर्भ में वचन के विरुद्ध अपमानजनक सार्वजनिक कथन को व्यक्त करती है, जबकि पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। स्त्रीलिंग बहुवचन विशेषणों को पिछले पद से जारी उपदेश के अनुसार ‘हों’ के साथ पूरा किया गया है। ‘अपने-अपने’ वितरणात्मक अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
