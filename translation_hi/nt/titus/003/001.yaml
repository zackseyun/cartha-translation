  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: hi
  text: उन्हें याद दिलाते रहो कि वे शासकों और अधिकारियों के अधीन रहें, आज्ञा मानें और हर भले काम के लिए तैयार रहें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: याद दिलाते रहो
  rationale: वर्तमानकालीन आज्ञार्थक रूप निरंतर या बार-बार स्मरण कराने का भाव रखता है; हिंदी में यह प्रयोग उस पक्ष को स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτοὺς
  choice: उन्हें
  rationale: यह बहुवचन सर्वनाम उन विश्वासियों की ओर संकेत करता है जिन्हें तीतुस शिक्षा दे रहा है।
- source_word: ἀρχαῖς
  choice: शासकों
  rationale: नागरिक संदर्भ में यह शब्द शासन करने वालों या शासकीय पदाधिकारियों को दर्शाता है, न कि आत्मिक शक्तियों को।
- source_word: ἐξουσίαις
  choice: अधिकारियों
  rationale: ἀρχαῖς के साथ प्रयुक्त यह शब्द अधिकार रखने वाली शासकीय सत्ताओं को दर्शाता है; दोहरे यूनानी पदबंध को हिंदी में अलग-अलग बनाए रखा गया है।
- source_word: ὑποτάσσεσθαι
  choice: के अधीन रहें
  rationale: यह क्रमबद्ध अधीनता या शासन के प्रति समर्पण का भाव व्यक्त करता है; हिंदी में यह औपचारिक किंतु स्पष्ट नागरिक अभिव्यक्ति है।
- source_word: πειθαρχεῖν
  choice: आज्ञा मानें
  rationale: क्रिया का अर्थ अधिकार रखने वालों की बात मानना है; यह हिंदी में संक्षिप्त, स्वाभाविक और स्पष्ट है।
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: हर भले काम के लिए
  rationale: πρός यहाँ तत्परता के लक्ष्य को व्यक्त करता है और ἔργον ἀγαθόν का नैतिक बल 'भले काम' में स्वाभाविक रूप से आता है।
- source_word: ἑτοίμους εἶναι
  choice: तैयार रहें
  rationale: यह किसी कार्य के लिए तत्पर अवस्था में रहने को दर्शाता है; 'तैयार रहें' सहज और सीधा हिंदी रूप है।
theological_decisions:
- issue: नागरिक शासन के प्रति अधीनता और आज्ञापालन की सीमा
  choice: पद को शासन के प्रति सामान्य अधीनता और आज्ञापालन के निर्देश के रूप में अनूदित किया गया है, पर इसे हर संभव परिस्थिति में निरपेक्ष आज्ञापालन के रूप में विस्तृत नहीं किया गया।
  alternative: ऐसा अधिक प्रबल अनुवाद जो शासकीय अधिकारियों के प्रति बिना किसी अपवाद के आज्ञापालन का अर्थ दे।
  rationale: पद नागरिक अधीनता का स्पष्ट निर्देश देता है, किंतु उसकी सीमाओं पर यहाँ कुछ नहीं कहता। इसलिए अनुवाद मूल कथन को बनाए रखता है और उससे आगे कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण शैली। 'याद दिलाते रहो' वर्तमान आज्ञार्थक की निरंतरता को स्पष्ट करता है। 'शासकों और अधिकारियों' से यूनानी के दोनों नागरिक शासन-संबंधी पद सुरक्षित रहते हैं।
