lexical_decisions:
- source_word: αἱρετικὸν
  choice: फूट डालनेवाले
  rationale: यह शब्द यहाँ बाद के तकनीकी अर्थ में केवल ‘विधर्मी’ होने के बजाय गुटबंदी या सामुदायिक विभाजन करानेवाले व्यक्ति की ओर संकेत करता है।
- source_word: ἄνθρωπον
  choice: व्यक्ति
  rationale: यूनानी रूप पुल्लिंग एकवचन है, पर संदर्भ में सामान्यतः किसी व्यक्ति का उल्लेख है; आधुनिक हिंदी में ‘व्यक्ति’ स्वाभाविक और अर्थ-सटीक है।
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: पहली और दूसरी चेतावनी देने के बाद
  rationale: वाक्यांश क्रमिक और दोहराए गए सुधारात्मक समझाने को व्यक्त करता है; ‘चेतावनी’ νουθεσία की सुधार के उद्देश्य वाली ताकीद को सरल आधुनिक हिंदी में रखती है।
- source_word: παραιτοῦ
  choice: उससे कोई संबंध न रखो
  rationale: मध्यवाच्य आज्ञार्थक रूप ऐसे व्यक्ति से संबंध या संगति अस्वीकार करने की निर्णायक कार्रवाई दर्शाता है; यह हिंदी में ‘त्याग दो’ की संभावित अस्पष्टता से बचता है।
theological_decisions:
- issue: αἱρετικὸν को बाद के तकनीकी धर्मसैद्धांतिक अर्थ में प्रस्तुत किया जाए या पहली सदी के गुटबंदी कराने के अर्थ में
  choice: फूट डालनेवाले
  alternative: विधर्मी; गुटबाज
  rationale: संदर्भ बार-बार समझाए जाने के बाद कलीसियाई अनुशासन का है। ‘फूट डालनेवाले’ संभावित मूल अर्थ को स्पष्ट करता और बाद की औपचारिक ‘विधर्म’ की श्रेणी को पाठ में आरोपित करने से बचता है।
- issue: παραιτοῦ में अपेक्षित अनुशासनात्मक कार्रवाई की तीव्रता
  choice: उससे कोई संबंध न रखो
  alternative: उसे अस्वीकार करो; उससे दूर रहो
  rationale: यह संबंध या संगति से इनकार का भाव स्पष्ट करता है, पर व्यक्ति के मूल्य या उद्धार पर पाठ से आगे बढ़कर कोई निर्णय नहीं सुनाता।
