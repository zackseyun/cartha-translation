- from: मेरे साथ के सभी लोग तुम्हें नमस्कार कहते हैं। जो विश्वास में[a] हमसे प्रेम रखते हैं, उन्हें नमस्कार कहना। तुम सब पर अनुग्रह बना रहे।
  to: मेरे साथ के सभी लोग तुम्हें नमस्कार कहते हैं। जो विश्वास में[a] हमसे प्रेम रखते हैं, उन्हें नमस्कार कहना। तुम सबके साथ अनुग्रह रहे।
  rationale: केवल अंतिम आशीर्वचन को संशोधित किया गया है, ताकि μετὰ (‘के साथ’) का संबंध स्पष्ट और सटीक रहे। पादटिप्पणी को भी इस प्रकार स्पष्ट किया गया है कि ‘स्थापित विश्वास’ वाला विकल्प व्याख्यात्मक विकल्प रहे, मुख्य यूनानी पाठ पर आरोपित निश्चितता नहीं।
