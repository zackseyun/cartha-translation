review_pass:
  verdict: revise
  source_fidelity: 'The greeting clauses faithfully represent the Greek: πάντες is retained as ‘सभी,’ the singular recipient is maintained in ‘तुम्हें,’ and the plural scope of the final benediction is retained in ‘तुम सब.’ The final phrase should render μετά more directly as ‘के साथ,’ rather than ‘पर,’ which can suggest bestowal upon rather than accompanying presence.'
  naturalness: ‘मेरे साथ के सभी लोग’ and the epistolary greeting ‘नमस्कार कहते हैं/नमस्कार कहना’ are natural, clear modern Hindi. ‘तुम सबके साथ अनुग्रह रहे’ is a more idiomatic and source-near Hindi benediction than ‘तुम सब पर अनुग्रह बना रहे।’
  terminology: ‘अनुग्रह’ is an appropriate established rendering for χάρις. ‘विश्वास में’ appropriately preserves the primary sense of ἐν πίστει without over-interpreting it. The footnote retains viable alternatives, though ‘उस विश्वास में’ should be expressed as ‘विश्वास में’ in the sense of the established faith, without implying that the Greek itself has a demonstrative.
  issues:
  - severity: medium
    issue: Final benediction uses ‘तुम सब पर’ for μετὰ πάντων ὑμῶν.
    rationale: μετά with the genitive means ‘with.’ ‘तुम सबके साथ अनुग्रह रहे’ directly preserves this relation and remains natural in Hindi.
