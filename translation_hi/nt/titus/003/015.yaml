source:
  edition: SBLGNT
  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: hi
  text: मेरे साथ के सभी लोग तुम्हें नमस्कार कहते हैं। जो विश्वास में[a] हमसे प्रेम रखते हैं, उन्हें नमस्कार कहना। तुम सबके साथ अनुग्रह रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘विश्वास में’ उस अर्थ में कि यह स्थापित विश्वास है; अथवा, ‘विश्वासयोग्यता में।’
    reason: ἐν πίστει में πίστις का अर्थ और पदबंध का आशय संदर्भ में एक से अधिक प्रकार से समझा जा सकता है।
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: नमस्कार कहते हैं
  rationale: पत्र के समापन में ἀσπάζομαι का सामान्य अभिवादन-संबंधी अर्थ; यह आधुनिक हिन्दी में स्वाभाविक है और मूल के वर्तमानकाल को बनाए रखता है।
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: मेरे साथ के सभी लोग
  rationale: πάντες के ‘सभी’ और μετά के साथ होने के संबंध—दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ἄσπασαι
  choice: नमस्कार कहना
  rationale: आज्ञार्थक अभिवादन को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φιλοῦντας
  choice: प्रेम रखते हैं
  rationale: φιλέω के व्यक्तिगत स्नेह और लगाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν πίστει
  choice: विश्वास में
  rationale: πίστις का प्राथमिक अर्थ ‘विश्वास’ रखा गया है; ἐν को ‘में’ से व्यक्त करके प्रेम के क्षेत्र या साझे आधार की मूल अस्पष्टता सुरक्षित रहती है।
- source_word: ἡ χάρις
  choice: अनुग्रह
  rationale: पौलुस के आशीर्वचन में χάρις का स्थापित और अर्थपूर्ण हिन्दी समतुल्य।
- source_word: μετὰ πάντων ὑμῶν
  choice: तुम सब पर … बना रहे
  rationale: πάντων को ‘सब’ से सुरक्षित रखते हुए हिन्दी आशीर्वचन की स्वाभाविक अभिव्यक्ति दी गई है; μετά का साथ बने रहने का भाव ‘बना रहे’ में व्यक्त होता है।
theological_decisions:
- issue: ἐν πίστει में πίστις का अर्थ
  choice: विश्वास में
  alternative: उस विश्वास में; अथवा विश्वासयोग्यता में
  rationale: यह पदबंध साझे विश्वास के क्षेत्र या आधार की ओर संकेत कर सकता है, पर यूनानी में निश्चित उपपद नहीं है; ‘विश्वासयोग्यता’ भी शब्दार्थ की दृष्टि से संभव है। मुख्य पाठ किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता और विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सरल पत्रात्मक शैली। एकवचन संबोधन के लिए ‘तुम्हें/कहना’ और सामूहिक आशीर्वचन के लिए ‘तुम सब’ रखा गया है।
