source:
  edition: SBLGNT
  text: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ⸀ἃ ἐποιήσαμεν ἡμεῖς ἀλλὰ κατὰ ⸂τὸ αὐτοῦ ἔλεος⸃ ἔσωσεν ἡμᾶς διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/005.yaml
  text: not from works done in righteousness, which we ourselves did, but according to his mercy he saved us, through the washing of regeneration and renewal by the Holy Spirit,
translation:
  language: hi
  text: उसने हमारा उद्धार उन कामों के आधार पर नहीं किया जो हमने स्वयं धार्मिकता[a] में किए थे, बल्कि अपनी दया के अनुसार किया—नए जन्म के स्नान[b] और पवित्र आत्मा के द्वारा नवीकरण[c] के माध्यम से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धार्मिकता’ का अनुवाद ‘न्याय’ भी हो सकता है। यूनानी शब्द में धार्मिकता और न्याय—दोनों अर्थ संभव हैं; पौलुस के इस प्रयोग में मुख्य पाठ ‘धार्मिकता’ रखता है।
    reason: alternative_reading
  - marker: b
    text: ‘स्नान’ बपतिस्मा, शुद्ध किए जाने की छवि, या दोनों की ओर संकेत कर सकता है; यूनानी पाठ स्वयं मुख्य पाठ में इनमें से केवल एक अर्थ चुनना अनिवार्य नहीं करता।
    reason: lexical_alternative
  - marker: c
    text: या ‘पवित्र आत्मा का नवीकरण।’ यूनानी रचना में ‘पवित्र आत्मा’ और ‘नवीकरण’ के संबंध को कुछ भिन्न प्रकार से समझना संभव है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ
  choice: उन धार्मिकता के कामों के कारण नहीं
  rationale: ἐκ यहाँ आधार/कारण का भाव देता है। हिंदी में ‘के कारण नहीं’ स्वाभाविक रूप से यह स्पष्ट करता है कि उद्धार का आधार मनुष्य के धार्मिक काम नहीं हैं; δικαιοσύνη के लिए पौलुसी संदर्भ में ‘धार्मिकता’ रखा गया है।
- source_word: ἃ ἐποιήσαμεν ἡμεῖς
  choice: जो हमने स्वयं किए थे
  rationale: स्पष्ट सर्वनाम ἡμεῖς पर बल है; ‘स्वयं’ उस बल को सुरक्षित रखता है।
- source_word: ἀλλὰ κατὰ τὸ αὐτοῦ ἔλεος
  choice: बल्कि अपनी दया के अनुसार
  rationale: κατά मानक अथवा आधार का भाव रखता है। ‘अपनी दया के अनुसार’ कामों और परमेश्वर की दया के बीच मूल विरोध को बनाए रखता है।
- source_word: ἔσωσεν ἡμᾶς
  choice: उसने हमारा उद्धार ... किया
  rationale: σῴζω के उद्धार-संबंधी अर्थ के लिए ‘उद्धार किया’ आधुनिक धार्मिक हिंदी में स्पष्ट और प्रतिष्ठित अभिव्यक्ति है।
- source_word: διὰ λουτροῦ
  choice: स्नान ... के माध्यम से
  rationale: διά + संबंधकारक साधन को व्यक्त करता है। λουτρόν के लिए ‘स्नान’ मूल धुलाई/स्नान की छवि को रखता है और मुख्य पाठ में बपतिस्मा अथवा रूपकात्मक शुद्धि का निर्णय नहीं करता।
- source_word: παλιγγενεσίας
  choice: नए जन्म के
  rationale: παλιγγενεσία का अर्थ पुनर्जन्म/नया जन्म है। ‘नया जन्म’ सामान्य पाठक के लिए सहज है और इस संदर्भ की जीवन-नवीकरण संबंधी शक्ति को बनाए रखता है।
- source_word: ἀνακαινώσεως πνεύματος ἁγίου
  choice: पवित्र आत्मा के द्वारा नवीकरण
  rationale: निकटतम संबंध ἀνακαίνωσις और πνεῦμα ἅγιον के बीच है। ‘के द्वारा’ आत्मा को नवीकरण का कर्ता/स्रोत बताता है, जबकि वैकल्पिक संबंध को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: δικαιοσύνη का अर्थ
  choice: धार्मिकता
  alternative: न्यायपरायणता / न्याय
  rationale: पौलुसी प्रयोग और इस वाक्य में कामों के नैतिक चरित्र के लिए ‘धार्मिकता’ सबसे उपयुक्त है; शब्द के न्याय-संबंधी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: λουτρόν का बपतिस्मा और शुद्धि से संबंध
  choice: स्नान
  alternative: धुलाई / बपतिस्मा का स्नान
  rationale: यूनानी शब्द स्नान या धुलाई को सूचित करता है, पर अपने आप यह तय नहीं करता कि संकेत केवल बपतिस्मा, रूपकात्मक शुद्धि, या दोनों की ओर है। इसलिए मुख्य पाठ जानबूझकर इस तनाव को खुला रखता है।
- issue: πνεύματος ἁγίου का ἀνακαινώσεως से संबंध
  choice: पवित्र आत्मा के द्वारा नवीकरण
  alternative: पवित्र आत्मा का नवीकरण
  rationale: ‘के द्वारा’ संभावित कर्ता/स्रोत संबंध को स्वाभाविक हिंदी में व्यक्त करता है। यूनानी संबंधकारक के कारण ‘का नवीकरण’ भी संभव है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए बोधगम्य रखी गई है। वाक्य-क्रम को स्वाभाविक हिंदी के अनुरूप बदला गया है, किंतु कामों के निषेध, दया के आधार और स्नान/नए जन्म/नवीकरण के साधनात्मक संबंध को सुरक्षित रखा गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
