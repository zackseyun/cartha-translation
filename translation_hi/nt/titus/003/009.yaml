id: TIT.3.9
reference: Titus 3:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: hi
  text: पर मूर्खतापूर्ण विवादों[a], वंशावलियों, कलह और व्यवस्था के विषय में होने वाले झगड़ों[b] से दूर रहो, क्योंकि वे निष्फल और व्यर्थ हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रश्नों’ अथवा ‘अटकलों’।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘व्यवस्था-संबंधी झगड़े’।'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς ζητήσεις
  choice: मूर्खतापूर्ण विवादों
  rationale: यह पदबंध निरर्थक या विवेकहीन ढंग से चलाए जाने वाले विवादास्पद प्रश्नों को दर्शाता है; ‘मूर्खतापूर्ण विवाद’ आधुनिक हिन्दी में स्वाभाविक है और नैतिक-व्यावहारिक बल बनाए रखता है।
- source_word: γενεαλογίας
  choice: वंशावलियों
  rationale: मूल के बहुवचन संज्ञा-रूप को बिना किसी विशेष ऐतिहासिक पुनर्निर्माण के सीधे सुरक्षित रखता है।
- source_word: ἔρεις
  choice: कलह
  rationale: यह विरोध, फूट और तनातनी का भाव देता है तथा आगे आने वाले ‘झगड़ों’ से पर्याप्त भेद भी बनाए रखता है।
- source_word: μάχας νομικὰς
  choice: व्यवस्था के विषय में होने वाले झगड़ों
  rationale: यहाँ μάχας मौखिक झगड़ों को और νομικὰς उनके व्यवस्था-संबंधी विषय को व्यक्त करता है; यह अनुवाद अदालती मुकदमों का भ्रामक संकेत नहीं देता।
- source_word: περιΐστασο
  choice: से दूर रहो
  rationale: मध्यवाच्य आज्ञार्थक का अपने को इन बातों से अलग रखने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: ἀνωφελεῖς
  choice: निष्फल
  rationale: लाभ या उपयोग न पहुँचाने का भाव संक्षेप में व्यक्त करता है।
- source_word: μάταιοι
  choice: व्यर्थ
  rationale: खोखलेपन और निरुद्देश्यता का अर्थ आधुनिक, सहज हिन्दी में देता है।
theological_decisions:
- issue: ‘वंशावलियों’ और ‘व्यवस्था के विषय में होने वाले झगड़ों’ की प्रकृति
  choice: दोनों पदों को सामान्य रूप में अनूदित किया गया है।
  alternative: इन्हें विशेष रूप से यहूदी वंशगत बहसों अथवा आरंभिक ज्ञानवादी अटकलों के रूप में स्पष्ट करना।
  rationale: पद स्वयं किसी एक ऐतिहासिक या धार्मिक व्यवस्था की स्पष्ट पहचान नहीं करता; सामान्य शब्दावली मूल की अस्पष्टता बनाए रखती और बाहरी सिद्धांत आरोपित करने से बचती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु साधारण पाठक के लिए सहज। ‘व्यवस्था’ का प्रयोग νόμος-संबंधी धार्मिक अर्थ को सुरक्षित रखने के लिए किया गया है।
