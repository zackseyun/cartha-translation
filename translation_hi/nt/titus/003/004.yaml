- source_word: χρηστότης
  choice: कृपा
  rationale: यहाँ शब्द संबंधपरक भलाई, दयालुता और हितकारी व्यवहार को व्यक्त करता है। आधुनिक हिन्दी में ‘कृपा’ स्वाभाविक और गरिमापूर्ण है तथा अगले पद में अलग से आने वाली ἔλεος (‘दया’) से पर्याप्त भिन्न रहती है।
- source_word: φιλανθρωπία
  choice: मानव-प्रेम
  rationale: यह मनुष्यों के प्रति प्रेम और परोपकारी सद्भाव को दर्शाता है। ‘मानव-प्रेम’ संक्षिप्त रूप से इसके लक्षित अर्थ को बनाए रखता है; वैकल्पिक अर्थ फुटनोट में दिया गया है।
- source_word: ἐπεφάνη
  choice: प्रकट हुआ
  rationale: क्रिया के प्रकट होने या दिखाई देने के भाव को सीधे व्यक्त करता है, बिना प्रकाशन के ढंग को अतिरिक्त रूप से निर्धारित किए। संयुक्त कर्ता को एक समग्र प्रकटता के रूप में लेकर एकवचन क्रिया रखी गई है।
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: हमारे उद्धारकर्ता परमेश्वर की
  rationale: यह संबंधकारक पद ‘कृपा’ और ‘मानव-प्रेम’ दोनों को विशेषित करता है। हिन्दी शब्दक्रम में यह स्वाभाविक है और ‘उद्धारकर्ता’ की उपाधि का महत्व बनाए रखता है।
theological_decisions:
