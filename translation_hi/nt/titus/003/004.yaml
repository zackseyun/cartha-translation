  choice: वाक्यांश को बिना व्याख्यात्मक विस्तार के ‘हमारे उद्धारकर्ता परमेश्वर’ रखा गया है; निकट संदर्भ में यह परमेश्वर पिता की ओर संकेत करता है।
  alternative: इसे केवल सामान्य दैवी उपाधि मानकर इस पद में किसी विशिष्ट व्यक्ति से न जोड़ना।
  rationale: पास्टोरल पत्रियों में ‘परमेश्वर हमारे उद्धारकर्ता’ प्रायः पिता के लिए आता है, जबकि पद 6 में यीशु मसीह का अलग उल्लेख है। अनुवाद मूल उपाधि को जस का तस रखता है और पाठ में व्यक्ति-संबंधी व्याख्या नहीं जोड़ता।
translation_notes:
