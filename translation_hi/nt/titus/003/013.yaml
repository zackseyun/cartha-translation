- source_word: τὸν νομικὸν
  choice: व्यवस्था के जानकार
  rationale: νομικός किसी कानून या व्यवस्था में निपुण व्यक्ति को सूचित करता है। यह रूप संक्षिप्त है और इसे अनावश्यक रूप से आधुनिक पेशेवर पद ‘वकील’ तक सीमित नहीं करता।
- source_word: Ἀπολλῶν
  choice: अपुल्लोस
  rationale: यूनानी व्यक्तिनाम का प्रचलित बाइबलीय हिन्दी लिप्यंतरण।
- source_word: σπουδαίως
  choice: पूरी तत्परता से
  rationale: क्रियाविशेषण के गंभीर प्रयास, लगन और सावधानी के भाव को व्यक्त करता है, पर इसे केवल शीघ्रता के अर्थ तक सीमित नहीं करता।
- source_word: πρόπεμψον
  choice: उनकी यात्रा के लिए विदा करो
  rationale: प्राचीन पत्रों के यात्रा-संदर्भ में क्रिया केवल विदा करने के बजाय यात्रियों को आवश्यक सहायता देकर आगे भेजने का भाव रख सकती है; मुख्य पाठ स्वाभाविक है और पादटिप्पणी इस व्यापक अर्थ को स्पष्ट करती है।
- source_word: ἵνα μηδὲν αὐτοῖς λείπῃ
  choice: ताकि उन्हें किसी बात की कमी न हो
  rationale: ग्रीक उद्देश्य-वाक्य और μηδέν की व्यापकता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
