id: TIT.3.8
reference: Titus 3:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: hi
  text: यह बात भरोसेयोग्य है। मैं चाहता हूँ कि तुम इन बातों पर पूरे विश्वास के साथ ज़ोर दो[a], ताकि जिन्होंने परमेश्वर पर विश्वास किया है[b], वे भले कामों में लगे रहने का ध्यान रखें। ये बातें लोगों के लिए अच्छी और लाभदायक हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन बातों को दृढ़तापूर्वक कहते रहो” अथवा “इन पर ज़ोर देकर दृढ़ता से कहो।”
    reason: διαβεβαιοῦσθαι के विश्वासपूर्ण कथन और प्रबल आग्रह—दोनों अर्थ-रंग संभव हैं।
  - marker: b
    text: या, “जिन्होंने परमेश्वर पर भरोसा रखा है”; अथवा, “जिन्होंने परमेश्वर की बात मानी है।”
    reason: πιστεύω के साथ दत्तिव θεῷ परमेश्वर पर विश्वास/भरोसा करने या परमेश्वर को सत्य मानने की अर्थ-छाया दे सकता है।
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: यह बात भरोसेयोग्य है
  rationale: यह पास्टोरल पत्रियों के परिचित सूत्र को स्वाभाविक हिन्दी में व्यक्त करता है। यहाँ λόγος किसी एक शब्द के बजाय पहले कही गई बात या संदेश की ओर संकेत करता है।
- source_word: περὶ τούτων
  choice: इन बातों पर
  rationale: यह περί के विषय-सूचक अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में रखता है तथा पिछले कथनों से संबंध बनाए रखता है।
- source_word: βούλομαί σε διαβεβαιοῦσθαι
  choice: मैं चाहता हूँ कि तुम ... पूरे विश्वास के साथ ज़ोर दो
  rationale: βούλομαι की इच्छासूचक शक्ति और διαβεβαιόομαι के दृढ़, विश्वासपूर्ण आग्रह—दोनों को वर्तमान, सहज हिन्दी में व्यक्त करता है।
- source_word: ἵνα φροντίζωσιν
  choice: ताकि ... ध्यान रखें
  rationale: φροντίζω में सोच-विचार, सावधानी और सचेत चिंता का भाव है; ‘ध्यान रखें’ इसे बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: καλῶν ἔργων προΐστασθαι
  choice: भले कामों में लगे रहने
  rationale: इस प्रसंग में προΐστασθαι का अर्थ भले कामों में निरंतर लगना या स्वयं को उनके लिए समर्पित करना है; इसे संगठनात्मक नेतृत्व के अर्थ तक सीमित नहीं किया गया।
- source_word: οἱ πεπιστευκότες θεῷ
  choice: जिन्होंने परमेश्वर पर विश्वास किया है
  rationale: पूर्णकालिक कृदन्त पहले आरम्भ हुए और अब भी बने हुए विश्वास की स्थिति दिखाता है। हिन्दी में दत्तिव θεῷ का सर्वाधिक स्वाभाविक रूप ‘परमेश्वर पर विश्वास’ है; अन्य संभव छायाएँ पादटिप्पणी में रखी गई हैं।
- source_word: ταῦτά ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις
  choice: ये बातें लोगों के लिए अच्छी और लाभदायक हैं
  rationale: नपुंसकलिंग बहुवचन ταῦτα को हिन्दी बहुवचन में रखा गया है; ἄνθρωποι यहाँ सभी मनुष्यों के लिए सामान्य शब्द है, इसलिए ‘लोगों’ उपयुक्त है।
theological_decisions:
- issue: विश्वास और भले कामों का संबंध
  choice: भले कामों को उन लोगों के जीवन में अपेक्षित फल के रूप में रखा गया है जो पहले ही परमेश्वर पर विश्वास कर चुके हैं।
  alternative: भले कामों को उद्धार का आधार या पुण्य कमाने का साधन बताना।
  rationale: यूनानी वाक्य में विश्वास कर चुके लोग कर्ता हैं और भले कामों में लगना लक्ष्य/परिणाम है; अनुवाद इसी क्रम को रखता है, पर किसी सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: πιστεύω के साथ दत्तिव θεῷ
  choice: मुख्य पाठ में ‘परमेश्वर पर विश्वास किया है’।
  alternative: ‘परमेश्वर पर भरोसा रखा है’ अथवा ‘परमेश्वर की बात मानी है’।
  rationale: मूल रचना परमेश्वर को विश्वसनीय मानने और उस पर भरोसा करने की निकटवर्ती अर्थ-छायाएँ रख सकती है। स्वाभाविक हिन्दी के लिए मुख्य पाठ में ‘पर विश्वास’ रखा गया है और शेष संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भले काम’ पौलुस की नैतिक शब्दावली से निरंतरता रखता है, जबकि ‘पूरे विश्वास के साथ ज़ोर दो’ आदेश की दृढ़ता को बिना कठोर या विवादात्मक बनाए व्यक्त करता है।
