  text: μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/002.yaml
  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: hi
  text: किसी की निंदा न करें[a], झगड़ालू न हों, सहनशील हों, और सब लोगों के प्रति हर प्रकार की नम्रता दिखाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी के विषय में बुरा न बोलें।” यूनानी क्रिया केवल झूठी बदनामी नहीं, बल्कि अपमानजनक या बुरी बातें कहने का व्यापक अर्थ भी रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδένα
  choice: किसी की ... न
  rationale: यह βλασφημεῖν का कर्म है और निषेध का सार्वभौमिक विस्तार स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βλασφημεῖν
  choice: निन्दा करें
  rationale: मनुष्यों के प्रति इस नैतिक संदर्भ में इसका अर्थ अपमानजनक या बुरी बातें कहना है; ‘निन्दा करना’ इस व्यापकता को औपचारिक ‘बदनामी’ से बेहतर रखता है।
- source_word: ἀμάχους εἶναι
  choice: झगड़ालू न हों
  rationale: मूल विशेषण लड़ाई-झगड़े में न पड़ने की प्रवृत्ति बताता है; नकारात्मक रूप और व्यावहारिक नैतिक अर्थ दोनों सुरक्षित हैं।
- source_word: ἐπιεικεῖς
  choice: उदार हों
  rationale: यहाँ शब्द कठोरता के विपरीत नरमी, सहनशीलता और उचित रियायत का भाव रखता है। ‘उदार’ अगले πραΰτης से शब्दार्थगत भेद भी बनाए रखता है।
- source_word: πᾶσαν ἐνδεικνυμένους πραΰτητα
  choice: हर प्रकार की नम्रता दिखाएँ
  rationale: सहभागी क्रिया को समन्वित आज्ञा के रूप में स्वाभाविक हिन्दी में रखा गया है; πᾶσαν की व्यापकता और πραΰτης की विनम्र कोमलता दोनों व्यक्त होती हैं।
- source_word: πρὸς πάντας ἀνθρώπους
  choice: सब लोगों के प्रति
  rationale: πρός संबंध या व्यवहार की दिशा बताता है और ἀνθρώπους यहाँ सभी मनुष्यों के लिए समावेशी है।
theological_decisions:
- issue: ἀνθρώπους का सामान्य मानवीय अर्थ
  choice: सब लोगों
  alternative: सब मनुष्यों
  rationale: यहाँ यूनानी शब्द केवल पुरुषों को नहीं, सभी लोगों को समेटता है; ‘सब लोगों’ सहज आधुनिक हिन्दी में वही सार्वभौमिक आशय देता है।
- issue: ἐπιεικεῖς और πραΰτητα के बीच भेद
  choice: उदार ... नम्रता
  alternative: नम्र ... कोमलता
  rationale: दोनों निकटार्थी गुणों को एक ही हिन्दी शब्द से मिलाने के बजाय पहले में सहनशील उदारता और दूसरे में नम्र कोमलता का भेद रखा गया है, बिना उसे किसी संप्रदायगत अर्थ में सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; आज्ञात्मक शृंखला को आदरसूचक बहुवचन में रखा गया है। भाषा सरल और गरिमापूर्ण है। ‘बल्कि’ मूल में अलग शब्द के रूप में नहीं है, पर नकारात्मक और सकारात्मक गुणों के विरोध को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
