base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: hi
  text: जब मैं अरतेमास या तुखिकुस को तुम्हारे पास भेजूँ, तो निकोपुलिस में मेरे पास आने का भरसक प्रयत्न करना,[a] क्योंकि मैंने वहीं जाड़ा बिताने का निश्चय किया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे पास आने में पूरी तत्परता दिखाना” अथवा “मेरे पास आने का पूरा प्रयास करना।”
    reason: lexical_alternative
  - marker: b
    text: या “क्योंकि मैंने वहीं जाड़ा बिताने का निर्णय कर लिया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: जब मैं ... भेजूँ
  rationale: ὅταν के साथ aorist subjunctive भविष्य में अपेक्षित किंतु अभी घटित न हुई घटना को दर्शाता है; हिंदी में ‘जब ... भेजूँ’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἀρτεμᾶν
  choice: अरतेमास
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: ἢ
  choice: या
  rationale: दो संभावित दूतों में से एक को दर्शाने वाला साधारण विकल्पबोधक समुच्चयबोधक।
- source_word: Τυχικόν
  choice: तुखिकुस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: πρὸς σὲ
  choice: तुम्हारे पास
  rationale: दिशा और प्राप्तकर्ता—तीतुस—दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: σπούδασον
  choice: भरसक प्रयत्न करना
  rationale: आज्ञार्थक क्रिया तत्परता, गंभीर प्रयास और शीघ्रता का भाव रखती है; यह चयन अर्थ को केवल ‘जल्दी करना’ तक सीमित नहीं करता।
- source_word: ἐλθεῖν πρός με
  choice: मेरे पास आने
  rationale: गति वक्ता पौलुस की ओर है, इसलिए ‘आने’ उपयुक्त है; πρός με को ‘मेरे पास’ से व्यक्त किया गया है।
- source_word: εἰς Νικόπολιν
  choice: निकुपुलिस में
  rationale: गंतव्य नगर को हिंदी में ‘मेरे पास आने’ के साथ स्वाभाविक ढंग से जोड़ा गया है और दोहरे ‘के पास’ जैसे असहज विन्यास से बचा गया है।
- source_word: ἐκεῖ γὰρ
  choice: क्योंकि ... वहीं
  rationale: γάρ पिछले निर्देश का कारण देता है और ἐκεῖ निकुपुलिस की ओर पुनः संकेत करता है।
- source_word: κέκρικα
  choice: मैंने ... निश्चय किया है
  rationale: पूर्णकालिक रूप एक स्थापित निर्णय की वर्तमान प्रासंगिकता व्यक्त करता है।
- source_word: παραχειμάσαι
  choice: जाड़ा बिताने
  rationale: क्रिया का अर्थ किसी स्थान पर शीत ऋतु बिताना है; वर्तमान सामान्य हिंदी में यह स्पष्ट और स्वाभाविक है।
