source:
  edition: SBLGNT
  text: ἦμεν γάρ ποτε καὶ ἡμεῖς ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, ἐν κακίᾳ καὶ φθόνῳ διάγοντες, στυγητοί, μισοῦντες ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: hi
  text: क्योंकि हम स्वयं भी पहले मूर्ख, अवज्ञाकारी और भटकाए जाते थे[a]। हम तरह-तरह की अभिलाषाओं और सुख-विलास के दास बने हुए थे; दुर्भावना और ईर्ष्या में जीवन बिताते थे; घृणास्पद थे[b] और एक-दूसरे से घृणा करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धोखे में पड़े हुए थे।”
    reason: lexical_alternative
  - marker: b
    text: या, “जिनसे घृणा की जाती थी।” यूनानी विशेषण का अर्थ सक्रिय रूप में “घृणास्पद” अथवा कर्मवाच्य रूप में “जिससे घृणा की जाती हो”—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: क्योंकि हम स्वयं भी पहले
  rationale: ‘क्योंकि’ पिछले कथन से γάρ का संबंध दिखाता है; ‘हम स्वयं भी’ समावेशी बल को और ‘पहले’ ποτε के समय-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνόητοι
  choice: मूर्ख
  rationale: यह समझ और नैतिक विवेक के अभाव को सरल, प्रचलित हिन्दी में व्यक्त करता है।
- source_word: ἀπειθεῖς
  choice: अवज्ञाकारी
  rationale: यह न मानने और उसके फलस्वरूप आज्ञा का उल्लंघन करने—दोनों भावों को नैतिक दोषों की इस सूची में उपयुक्त रूप से व्यक्त करता है।
- source_word: πλανώμενοι
  choice: भटकाए जाते थे
  rationale: यह कृदंत के संभावित कर्मवाच्य भाव को बनाए रखता है और अर्थ को केवल बौद्धिक धोखे तक सीमित नहीं करता।
- source_word: δουλεύοντες
  choice: दास बने हुए थे
  rationale: यह केवल सेवा करने के बजाय इच्छाओं और सुखों के बंधन में होने का प्रबल भाव सुरक्षित रखता है।
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: तरह-तरह की अभिलाषाओं और सुख-विलास
  rationale: ‘अभिलाषाएँ’ शब्द को केवल यौन वासना तक सीमित नहीं करता; ‘सुख-विलास’ इस नकारात्मक नैतिक संदर्भ में ἡδοναί का स्वाभाविक अर्थ देता है, और ‘तरह-तरह की’ दोनों संज्ञाओं पर लागू होती है।
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: दुर्भावना और ईर्ष्या में जीवन बिताते थे
  rationale: ‘जीवन बिताते थे’ διάγω के दीर्घकालिक जीवन-व्यवहार को व्यक्त करता है; पारस्परिक दोषों के संदर्भ में ‘दुर्भावना’ κακία के आशय को सामान्य ‘बुराई’ से अधिक सटीक ढंग से बताती है।
- source_word: στυγητοί
  choice: घृणित
  rationale: दोषों की सूची में सक्रिय अर्थ—घृणा योग्य या घृणित—स्वाभाविक है; संभावित कर्मवाच्य अर्थ को पादटिप्पणी में रखा गया है।
- source_word: μισοῦντες ἀλλήλους
  choice: एक-दूसरे से घृणा करते थे
  rationale: यह कृदंत और पारस्परिक सर्वनाम का सीधा तथा स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: निर्जीव स्वामियों—अभिलाषाओं और सुख-विलास—के साथ δουλεύοντες में बंधन का भाव
  choice: तरह-तरह की अभिलाषाओं और सुख-विलास के दास बने हुए थे
  alternative: तरह-तरह की अभिलाषाओं और सुख-विलास की सेवा करते थे
  rationale: पद मनुष्य की पूर्व नैतिक पराधीनता का प्रबल चित्र देता है। ‘दास बने हुए थे’ यूनानी दासत्व-संबंधी भाषा की शक्ति बनाए रखता है, पर पाठ से आगे कोई विशिष्ट सिद्धांत नहीं जोड़ता।
- issue: στυγητοί का सक्रिय या कर्मवाच्य अर्थ
  choice: घृणित थे
  alternative: लोग हमसे घृणा करते थे
  rationale: दोष-सूची और अगले वाक्यांश ‘एक-दूसरे से घृणा करते थे’ के साथ सक्रिय अर्थ सुगठित है; फिर भी यूनानी विशेषण कर्मवाच्य अर्थ भी दे सकता है, इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। यूनानी वाक्य की लंबी दोष-सूची को स्पष्टता के लिए दो वाक्यों और अर्धविरामों में व्यवस्थित किया गया है, जबकि उसके संचयी प्रभाव और अर्थ-संबंध को बनाए रखा गया है।
