translation:
  language: hi
  text: जिसे[a] उसने हमारे उद्धारकर्ता यीशु मसीह[b] के द्वारा हम पर बहुतायत से उंडेला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जिसे’ का संकेत पिछले पद में आए पवित्र आत्मा की ओर है; इसे ‘जिसको’ भी अनूदित किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी: ‘Ἰησοῦ Χριστοῦ’; यहाँ Χριστός को पदवी मानकर ‘मसीह’ अनूदित किया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ
  choice: जिसे
  rationale: यह संबंधवाचक सर्वनाम पिछले पद में आए ‘पवित्र आत्मा’ की ओर संकेत करता है। ‘जिसे’ आधुनिक हिन्दी में स्वाभाविक है और आत्मा के व्यक्तिगत संदर्भ को बनाए रखता है।
- source_word: ἐξέχεεν
  choice: उंडेला
  rationale: ἐκχέω का मूल अर्थ किसी वस्तु को उंडेलना है और पवित्र आत्मा दिए जाने के लिए यही बिंब प्रयुक्त हुआ है।
- source_word: ἐφ’ ἡμᾶς
  choice: हम पर
  rationale: ἐπί के साथ कर्मकारक यहाँ दिशा या किसी पर आने का भाव व्यक्त करता है; ‘हम पर’ इसका सहज हिन्दी रूप है।
- source_word: πλουσίως
  choice: बहुतायत से
  rationale: यह क्रियाविशेषण प्रचुर मात्रा का भाव देता है। ‘बहुतायत से’ आत्मा के भरपूर उंडेले जाने को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: διὰ
  choice: के द्वारा
  rationale: सम्बन्धकारक के साथ διά माध्यम या अभिकरण बताता है; यहाँ यीशु मसीह वह माध्यम हैं जिनके द्वारा आत्मा उंडेला गया।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός यहाँ पदवी है। हिन्दी में ‘मसीह’ इसका प्रचलित अर्थपरक रूप है और स्वाभाविक रूप से ‘यीशु’ के साथ आता है।
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: हमारे उद्धारकर्ता
  rationale: σωτήρ का अर्थ उद्धार करने वाला है। ‘हमारे उद्धारकर्ता’ सटीक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
theological_decisions:
- issue: संबंधवाचक सर्वनाम οὗ का संदर्भ
  choice: इसे पिछले पद के ‘पवित्र आत्मा’ के व्यक्तिगत संदर्भ में ‘जिसे’ अनूदित किया गया है।
  alternative: व्याकरणिक रूप को अधिक अस्पष्ट रखते हुए ‘जिसको’ कहा जा सकता है।
  rationale: निकटतम पूर्वपद पद 5 का ‘पवित्र आत्मा’ है। ‘जिसे’ स्रोत के संबंध को बनाए रखता है, बिना पद में ‘पवित्र आत्मा’ को दोहराकर स्पष्टता थोपे।
- issue: Χριστοῦ का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीष्ट / यीशु क्राइस्ट
  rationale: Χριστός का अर्थ ‘अभिषिक्त जन’ अर्थात ‘मसीह’ है। यहाँ यह यीशु की पदवी के रूप में प्रयुक्त है; इसलिए अर्थपरक और हिन्दी में स्थापित रूप ‘मसीह’ चुना गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। वाक्य ने यूनानी की संबंधवाचक संरचना और ‘उंडेलने’ के बिंब को बनाए रखा है। ‘बहुतायत से’ गरिमापूर्ण होने के साथ सामान्य पाठक के लिए स्पष्ट है; ‘हमारे उद्धारकर्ता’ को ‘यीशु मसीह’ से पहले रखकर हिन्दी का स्वाभाविक सम्बन्धकारक क्रम अपनाया गया है।
