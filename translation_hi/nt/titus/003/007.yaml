source:
  edition: SBLGNT
  text: ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι κληρονόμοι ⸀γενηθῶμεν κατ’ ἐλπίδα ζωῆς αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/007.yaml
  text: so that[a], having been justified by his grace[b], we might become heirs according to the hope of eternal life.
translation:
  language: hi
  text: ताकि हम उसके अनुग्रह से धर्मी ठहराए जाकर[a], अनन्त जीवन की आशा के अनुसार[b] उत्तराधिकारी बनें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धर्मी ठहराए जाकर’ का अनुवाद ‘धर्मी घोषित किए जाकर’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘अनन्त जीवन की आशा में’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणाम का भाव व्यक्त करता है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी उपवाक्य की प्रयोजनात्मक शक्ति बनाए रखता है।
- source_word: δικαιωθέντες
  choice: धर्मी ठहराए जाकर
  rationale: यह δικαιόω का एओरिस्ट कर्मवाच्य कृदन्त है। यह अनुवाद कर्मवाच्य और मुख्य क्रिया से पहले की क्रिया—दोनों को बनाए रखता है, जबकि इसका अर्थ किसी विशेष धर्मवैज्ञानिक व्याख्या तक सीमित नहीं करता।
- source_word: τῇ ἐκείνου χάριτι
  choice: उसके अनुग्रह से
  rationale: करण कारक के भाव को ‘से’ द्वारा व्यक्त किया गया है। ‘उसके’ से सर्वनाम का संकेत बना रहता है, पर उसका संदर्भ अनावश्यक रूप से स्पष्ट करके मूल की सम्भावित अस्पष्टता दूर नहीं की गई।
- source_word: κληρονόμοι
  choice: उत्तराधिकारी
  rationale: यह विरासत पाने वाले व्यक्ति और विरासत की बाइबिलीय छवि को स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: γενηθῶμεν
  choice: बनें
  rationale: ἵνα के बाद आया एओरिस्ट सम्भावनार्थक रूप किसी नई स्थिति में प्रवेश का भाव देता है; ‘बनें’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: κατ’ ἐλπίδα
  choice: आशा के अनुसार
  rationale: यह κατά के स्वरूप को निकटता से बनाए रखता है और आशा तथा उत्तराधिकारी बनने के सम्बन्ध को जानबूझकर अधिक स्पष्ट नहीं करता; अधिक स्वाभाविक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ζωῆς αἰωνίου
  choice: अनन्त जीवन की
  rationale: यह सम्बन्धकारक पद आशा की विषयवस्तु बताता है। ‘अनन्त जीवन’ ζωὴ αἰώνιος का मानक और सहज हिन्दी रूप है।
theological_decisions:
- issue: पौलुसी उद्धार-सन्दर्भ में δικαιωθέντες का अर्थ
  choice: धर्मी ठहराए जाकर
  alternative: निर्दोष ठहराए जाकर
  rationale: ‘धर्मी ठहराना’ न्यायिक और धर्मवैज्ञानिक सम्बन्ध को बनाए रखता है, फिर भी यह नहीं तय करता कि इस ठहराए जाने की पूरी प्रक्रिया या रीति क्या है।
- issue: ἐκείνου (‘उसके’) का संदर्भ
  choice: सर्वनाम को ‘उसके’ ही रहने देना
  alternative: ‘परमेश्वर के’ अथवा ‘यीशु मसीह के’ रूप में संदर्भ स्पष्ट करना
  rationale: निकटवर्ती सन्दर्भ में दिव्य उद्धारकारी कार्य है, पर मूल पद यहाँ नाम दोहराकर संदर्भ को स्पष्ट नहीं करता। इसलिए हिन्दी में भी सर्वनाम रखा गया है, ताकि सम्भावित संदर्भगत तनाव बना रहे।
- issue: κατ’ ἐλπίδα और उत्तराधिकार का सम्बन्ध
  choice: आशा के अनुसार
  alternative: अनन्त जीवन की आशा में
  rationale: ‘के अनुसार’ यूनानी पूर्वसर्ग के अधिक निकट है, जबकि ‘आशा में’ सम्भव और अधिक मुहावरेदार अर्थ है। मुख्य पाठ औपचारिक सम्बन्ध को बचाता है और विकल्प पादटिप्पणी में रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण रखी गई है। ‘अनुग्रह’, ‘धर्मी ठहराना’, ‘अनन्त जीवन’ और ‘उत्तराधिकारी’ जैसे परिचित बाइबिलीय पद मूल की धर्मवैज्ञानिक तथा विरासत-सम्बन्धी छवियों को बनाए रखते हैं।
