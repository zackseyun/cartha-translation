source:
  edition: SBLGNT
  text: μανθανέτωσαν δὲ καὶ οἱ ἡμέτεροι καλῶν ἔργων προΐστασθαι εἰς τὰς ἀναγκαίας χρείας, ἵνα μὴ ὦσιν ἄκαρποι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/014.yaml
  text: And let our people also learn to engage in good works for necessary needs[c][b][a], so that they may not be unfruitful.
translation:
  language: hi
  text: हमारे लोग भी[a] आवश्यक जरूरतों को पूरा करने के लिए भले कामों में लगे रहना[b][c] सीखें, ताकि वे निष्फल न रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमारे अपने’ अथवा ‘हमारे अपने लोग’।
    reason: lexical_alternative
  - marker: b
    text: या ‘भले काम करने में अगुवाई करना’।
    reason: lexical_alternative
  - marker: c
    text: या ‘तात्कालिक जरूरतों के लिए’।
    reason: lexical_alternative
lexical_decisions:
- source_word: μανθανέτωσαν
  choice: सीखें
  rationale: वर्तमानकालिक तृतीय-पुरुष बहुवचन आज्ञार्थक रूप है। हिंदी का ‘सीखें’ आग्रह और उपदेश, दोनों का स्वाभाविक भाव देता है, बिना इसे अनावश्यक रूप से कठोर बनाए।
- source_word: οἱ ἡμέτεροι
  choice: हमारे लोग
  rationale: शाब्दिक अर्थ ‘हमारे अपने’ है; प्रसंग में यह पौलुस और तीतुस से संबंधित मसीही समुदाय के लोगों को सूचित करता है। ‘हमारे लोग’ सहज है और अनावश्यक लैंगिक सीमा नहीं लगाता।
- source_word: καλῶν ἔργων
  choice: भले कामों
  rationale: यह पदबंध नैतिक और व्यावहारिक रूप से लाभकारी कार्यों को दर्शाता है तथा तीतुस में बार-बार आने वाले विषय के साथ शब्दगत संगति रखता है।
- source_word: προΐστασθαι
  choice: लगे रहना
  rationale: क्रिया अगुवाई करने, देखभाल करने, या किसी काम में समर्पित होकर लगे रहने का अर्थ दे सकती है। यहाँ भले कामों के साथ सक्रिय और निरंतर संलग्नता प्रसंगानुकूल है; वैकल्पिक अर्थ फुटनोट में सुरक्षित रखा गया है।
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: ज़रूरी आवश्यकताओं को पूरा करने के लिए
  rationale: ἀναγκαίας और χρείας मिलकर वास्तविक, आवश्यक या तात्कालिक जरूरतों की ओर संकेत करते हैं। हिंदी में उद्देश्य स्पष्ट और स्वाभाविक करने के लिए ‘पूरा करने’ का प्रयोग किया गया है।
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: ताकि वे निष्फल न रहें
  rationale: उद्देश्यवाचक उपवाक्य और ‘फलरहित’ होने के रूपक को संक्षिप्त, प्रतिष्ठित हिंदी में सुरक्षित रखता है।
theological_decisions:
- issue: οἱ ἡμέτεροι का दायरा
  choice: पौलुस और तीतुस से संबंधित मसीही समुदाय के लोग (‘हमारे लोग’)
  alternative: हमारे अपने; हमारे अपने पुरुष; बाहरी लोगों के विपरीत हमारे लोग
  rationale: मूल पद संबंध और समुदाय को व्यक्त करता है, केवल पुरुषों को नहीं। इसलिए मिश्रित समुदाय की संभावित व्यापकता को बनाए रखा गया है।
- issue: προΐστασθαι का आशय
  choice: भले कामों में निरंतर सक्रिय रूप से लगे रहना
  alternative: भले कामों में अगुवाई करना
  rationale: तीतुस 3:8 और 3:14 में भले कामों के साथ इसका प्रयोग नेतृत्व के पद की अपेक्षा व्यावहारिक संलग्नता का संकेत अधिक स्वाभाविक रूप से देता है; फिर भी नेतृत्व वाला वास्तविक शब्दार्थ फुटनोट में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सामुदायिक उपदेशात्मक स्वर रखा गया है। ‘निष्फल’ मूल के फल-विषयक रूपक को बनाए रखता है। मुख्य वाक्य में ‘ज़रूरी आवश्यकताओं’ का हल्का अर्थ-पुनरुक्ति मूल के ἀναγκαίας χρείας की तीव्रता को दर्शाती है; ‘पूरा करने’ से हिंदी में व्यावहारिक उद्देश्य स्पष्ट होता है।
