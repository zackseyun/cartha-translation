lexical_decisions:
- source_word: εἰδὼς
  choice: यह जानते हुए
  rationale: कृदन्त रूप को बनाए रखते हुए यह पिछले पद की आज्ञा से स्वाभाविक संबंध रखता है और कारणात्मक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐξέστραπται
  choice: भटक चुका है
  rationale: यूनानी पूर्णकाल पहले हुए विचलन से उत्पन्न वर्तमान दशा बताता है। यह हिंदी में स्वाभाविक है और नैतिक विकृति के अर्थ को जरूरत से अधिक तीखा नहीं बनाता।
- source_word: ὁ τοιοῦτος
  choice: ऐसा व्यक्ति
  rationale: यह पिछले पद के फूट डालने वाले व्यक्ति की ओर संकेत करता है। हिंदी में 'व्यक्ति' प्रसंगगत पुरुष को समेटते हुए सहज और सामान्य अभिव्यक्ति है।
- source_word: ἁμαρτάνει
  choice: पाप कर रहा है
  rationale: वर्तमानकाल की जारी क्रिया को व्यक्त करता है, पर 'लगातार' जोड़कर अर्थ का विस्तार नहीं करता।
- source_word: ὢν
  choice: और ... ठहरता है
  rationale: यूनानी कृदन्त को शब्दशः असहज हिंदी बनाने के बजाय समन्वित वाक्यांश से जोड़ा गया है; इसकी कारणात्मक या परिस्थितिजन्य सूक्ष्मता को निर्णायक रूप से नहीं बाँधा गया।
- source_word: αὐτοκατάκριτος
  choice: अपने ही द्वारा दोषी ठहरता है
  rationale: यह व्यक्ति के अपने आचरण या गवाही के कारण उसी पर दोष सिद्ध होने का भाव रखता है और अंतिम न्याय की विस्तृत धारणा आरोपित नहीं करता।
theological_decisions:
- issue: ὁ τοιοῦτος में पुरुषवाचक रूप
  choice: ऐसा व्यक्ति
  alternative: ऐसा पुरुष
  rationale: यूनानी रूप व्याकरणतः पुल्लिंग एकवचन है और प्रसंग में एक फूट डालने वाले व्यक्ति को दर्शाता है। आधुनिक हिंदी में 'व्यक्ति' किसी doctrinal निष्कर्ष को बदले बिना स्वाभाविक संदर्भ देता है; क्रिया का पुल्लिंग रूप प्रसंगगत एकवचन को बनाए रखता है।
- issue: αὐτοκατάκριτος का आशय
  choice: अपने ही द्वारा दोषी ठहरता है
  alternative: स्वयं-दोषी है
  rationale: यह अनुवाद उस वास्तविक अस्पष्टता को खुला रखता है कि दोष उसकी अपनी कार्रवाई/गवाही से सिद्ध होता है या वह स्वयं अपने विरुद्ध निर्णय देता है; यह अंतिम दंडादेश को अनावश्यक रूप से नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'भटक चुका है' पूर्णकाल की परिणामी दशा व्यक्त करता है; 'विकृत हो चुका है' अधिक तीखा विकल्प था। मुख्य पाठ में एकमात्र पादटिप्पणी-चिह्न [a] उसके संबंधित कथन के बाद रखा गया है।
