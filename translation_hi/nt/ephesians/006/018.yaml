source:
  edition: SBLGNT
  text: διὰ πάσης προσευχῆς καὶ δεήσεως, προσευχόμενοι ἐν παντὶ καιρῷ ἐν πνεύματι, καὶ εἰς ⸀αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ δεήσει περὶ πάντων τῶν ἁγίων,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/018.yaml
  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: hi
  text: हर प्रकार की प्रार्थना और विनती के साथ हर समय पवित्र आत्मा में[a] प्रार्थना करते रहो। इसी उद्देश्य से पूरी दृढ़ता के साथ सतर्क रहो और सभी पवित्र जनों[b] के लिए विनती करते रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आत्मिक रूप से।” यूनानी को सामान्य अर्थ में भी समझा जा सकता है, पर संदर्भ में सम्भवतः पवित्र आत्मा अभिप्रेत है।
    reason: alternative_reading
  - marker: b
    text: “पवित्र जन” से आशय परमेश्वर के सभी पवित्र लोगों, अर्थात सभी विश्वासियों से है।
    reason: lexical_clarification
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: हर प्रकार की प्रार्थना और विनती के साथ
  rationale: διά के साधनसूचक अर्थ को स्वाभाविक हिन्दी में ‘के साथ’ से व्यक्त किया गया है। προσευχή के सामान्य अर्थ के लिए ‘प्रार्थना’ और δέησις की विशेष याचना के लिए ‘विनती’ रखकर दोनों शब्दों का भेद बचाया गया है।
- source_word: προσευχόμενοι ἐν παντὶ καιρῷ
  choice: हर समय ... प्रार्थना करते रहो
  rationale: वर्तमान कृदन्त की निरंतर क्रिया और पिछले आदेश से उसके संबंध को हिन्दी के सहज आदेशात्मक प्रवाह ‘करते रहो’ से व्यक्त किया गया है; ἐν παντὶ καιρῷ की व्यापकता ‘हर समय’ में बनी रहती है।
- source_word: ἐν πνεύματι
  choice: पवित्र आत्मा में
  rationale: इफिसियों के निकट संदर्भ और पौलुस के प्रयोग में यहाँ सम्भवतः पवित्र आत्मा अभिप्रेत है। यूनानी में लेख न होने के कारण सम्भव वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: εἰς αὐτό
  choice: इसी उद्देश्य से
  rationale: यह मुहावरा अभी कही गई प्रार्थना की ओर लक्ष्यसूचक ढंग से संकेत करता है। ‘इसी’ αὐτό के बल को और ‘उद्देश्य से’ उसके प्रयोजन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει
  choice: पूरी दृढ़ता के साथ जागते रहो
  rationale: ἀγρυπνοῦντες की चौकस सतर्कता के लिए ‘जागते रहो’ और προσκαρτέρησις की सतत लगन के लिए ‘पूरी दृढ़ता’ चुना गया है।
- source_word: καὶ δεήσει περὶ πάντων τῶν ἁγίων
  choice: और सभी पवित्र जनों के लिए विनती करते रहो
  rationale: समन्वयक καί और दूसरी δέησις को स्पष्ट रखा गया है। ἅγιοι का अनुवाद ‘पवित्र जन’ किया गया है, जो परमेश्वर के लिए अलग किए गए विश्वासियों के पूरे समुदाय को दर्शाता है और बाद की सीमित धार्मिक उपाधि का भ्रम नहीं पैदा करता।
theological_decisions:
- issue: πνεύματι का संदर्भ
  choice: पवित्र आत्मा
  alternative: मनुष्य की आत्मा अथवा आत्मिक भाव से
  rationale: पद 17 के ‘आत्मा की तलवार’ और इफिसियों में आत्मा-संबंधी भाषा के कारण पवित्र आत्मा अधिक सम्भावित है; फिर भी यूनानी की व्याकरणिक अस्पष्टता पादटिप्पणी में रखी गई है।
- issue: ἅγιοι का अर्थ
  choice: सभी पवित्र जन, अर्थात परमेश्वर के सभी विश्वासी लोग
  alternative: बाद की कलीसियाई परंपरा में विशेष रूप से मान्य संत
  rationale: पौलुस के सामान्य प्रयोग में यह शब्द समस्त विश्वासी समुदाय के लिए है, न कि केवल किसी बाद की सीमित श्रेणी के लिए।
- issue: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει का संबंध
  choice: दृढ़ता से जागते रहना और सब पवित्र जनों के लिए विनती करते रहना
  alternative: विनती में पूरी दृढ़ता के साथ जागते रहना
  rationale: यूनानी καί दोनों संज्ञाओं को जोड़ता है, पर हिन्दी में ‘दृढ़ता और विनती के साथ जागना’ अस्वाभाविक है। क्रियात्मक रूप अर्थ और समन्वय दोनों को स्पष्ट रूप से संप्रेषित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, आदरपूर्ण और सामुदायिक पाठ-योग्य रूप अपनाया गया है। ‘विनती’, ‘दृढ़ता’ और ‘जागते रहो’ जैसे प्रचलित शब्द मूल की प्रार्थना, निरंतरता और सतर्कता को बनाए रखते हैं।
