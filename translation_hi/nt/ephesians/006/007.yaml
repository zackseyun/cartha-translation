translation:
  language: hi
  text: सद्भावना से सेवा करो, प्रभु के लिए, न कि मनुष्यों के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: सद्भावना से
  rationale: μετά के साथ संबंधकारक यहाँ रीति अथवा साथ रहने वाली मनोवृत्ति बताता है; εὔνοια अनुकूल, भली और इच्छुक भावना को व्यक्त करता है। ‘सद्भावना से’ इस भीतरी भाव को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है।
- source_word: δουλεύοντες
  choice: सेवा करो
  rationale: δουλεύω का मूल अर्थ दास के रूप में सेवा करना है। निकटवर्ती संदर्भ में संबोधित लोगों की दास-स्थिति पहले से स्पष्ट है; इस पद में कृदन्त चल रहे उपदेशात्मक वाक्य से जुड़कर सेवा करने की रीति बताता है। इसलिए हिन्दी में ‘सेवा करो’ स्वाभाविक है और संदर्भ की सामाजिक वास्तविकता को नहीं मिटाता।
- source_word: ὡς τῷ κυρίῳ
  choice: मानो प्रभु की सेवा कर रहे हो
  rationale: ὡς सेवा की तुलना अथवा दृष्टि प्रस्तुत करता है। केवल ‘जैसे प्रभु को’ हिन्दी में अधूरा और अस्वाभाविक होता; क्रिया को स्पष्ट रूप से दोहराने से आशय खुलता है, बिना यह जोड़ने के कि सेवा केवल काल्पनिक रूप से प्रभु के लिए है। κύριος के लिए ‘प्रभु’ मसीही उपाधि सुरक्षित रखता है।
- source_word: καὶ οὐκ ἀνθρώποις
  choice: न कि मनुष्यों की
  rationale: καὶ οὐκ यहाँ तीखा विरोध बनाता है। ἄνθρωποι का आशय प्रभु के विपरीत नश्वर मानवों से है, केवल पुरुषों से नहीं; ‘मनुष्यों’ स्रोत का व्यापक मानवीय अर्थ और धार्मिक विरोध दोनों सुरक्षित रखता है।
theological_decisions:
- issue: κύριος और मानवीय स्वामियों के बीच विरोध
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ मसीह-संबंधी उपाधि को सुरक्षित रखता है और उसे आसपास उल्लिखित सांसारिक स्वामियों से अलग करता है।
- issue: δουλεύοντες में दासत्व की तीव्रता
  choice: सेवा करो
  alternative: दासों के समान सेवा करो
  rationale: संदर्भ में श्रोता पहले ही दासों के रूप में पहचाने गए हैं। इस पद में अनावश्यक विस्तार किए बिना क्रिया का स्वाभाविक हिन्दी रूप उचित है; अधिक स्पष्ट रूप स्रोत में नई तुलना जोड़ सकता है।
- issue: ὡς का भाव
  choice: मानो प्रभु की सेवा कर रहे हो
  alternative: प्रभु के लिए समझकर
  rationale: यह तुलना और सेवा की अंतिम दिशा दोनों को सहज हिन्दी में व्यक्त करता है। ‘मानो’ को पूरी क्रियात्मक अभिव्यक्ति के साथ रखने से यह अर्थ नहीं निकलता कि प्रभु से संबंध असत्य है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। पद पूर्ववर्ती आज्ञा से व्याकरणतः जुड़ा है, इसलिए यूनानी कृदन्त को हिन्दी में स्वाभाविक आज्ञार्थक रूप दिया गया है। ‘मनुष्यों’ लिंग-समावेशी सामान्य अर्थ को व्यक्त करता है, अतः अंग्रेज़ी की तरह वैकल्पिक पादटिप्पणी आवश्यक नहीं है।
