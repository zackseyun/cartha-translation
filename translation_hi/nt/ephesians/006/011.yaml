source:
  edition: SBLGNT
  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: hi
  text: परमेश्वर का पूरा युद्ध-साज[a] धारण कर लो, ताकि तुम शैतान की चालों[b] के विरुद्ध खड़े रह सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परमेश्वर के सारे युद्ध-उपकरण।’ यूनानी शब्द सैनिक के संपूर्ण साज-सामान को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘शैतान की कपटपूर्ण युक्तियों’ अथवा ‘शैतान के धूर्त तरीकों।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: धारण कर लो
  rationale: यह बहुवचन आज्ञा है। ‘धारण कर लो’ युद्ध-साज पहनने की क्रिया और आदेश—दोनों को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: πανοπλίαν
  choice: पूरा युद्ध-साज
  rationale: यूनानी शब्द किसी सैनिक के केवल रक्षात्मक कवच का नहीं, बल्कि उसके संपूर्ण युद्ध-उपकरण का बोध कराता है। ‘पूरा युद्ध-साज’ इस व्यापकता और पूर्णता को बनाए रखता है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर का
  rationale: सम्बन्धकारक पद को जानबूझकर व्यापक रखा गया है; इससे युद्ध-साज के परमेश्वर से सम्बन्धित होने का अर्थ आता है, पर यह तय नहीं किया जाता कि बल केवल स्वामित्व पर है या स्रोत पर।
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: ताकि तुम ... खड़े रह सको
  rationale: यह रचना उद्देश्य को व्यक्त करती है। हिन्दी वाक्य आदेश के उद्देश्य और सामर्थ्य—दोनों को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: στῆναι
  choice: खड़े रह सको
  rationale: मूल क्रिया ‘खड़ा होना/रहना’ है। ‘विरुद्ध खड़े रहना’ सैन्य प्रसंग में अपना स्थान बनाए रखने का भाव स्वाभाविक रूप से देता है, बिना मुख्य पाठ में ‘दृढ़ता से’ जैसा अतिरिक्त विशेषण जोड़ने के।
- source_word: μεθοδείας
  choice: चालों
  rationale: यह शब्द योजनाबद्ध, कपटपूर्ण युक्तियों या तरीकों का बोध कराता है। ‘चालों’ आधुनिक और सहज हिन्दी में उस नकारात्मक तथा छलपूर्ण भाव को व्यक्त करता है।
- source_word: τοῦ διαβόλου
  choice: शैतान
  rationale: इस आत्मिक संघर्ष के प्रसंग में διάβολος एक व्यक्तिगत दुष्ट विरोधी का प्रचलित पदनाम है। हिन्दी में ‘शैतान’ इसका स्पष्ट और सामान्य बाइबिलीय रूप है।
theological_decisions:
- issue: διάβολος का सन्दर्भ और अनुवाद
  choice: व्यक्तिगत दुष्ट विरोधी के लिए ‘शैतान’
  alternative: ‘बदनाम करनेवाला’ या ‘निन्दक’
  rationale: इफिसियों 6 में आत्मिक संघर्ष का निकट प्रसंग किसी सामान्य मानवीय निन्दक के बजाय व्यक्तिगत अलौकिक विरोधी की ओर संकेत करता है। अनुवाद इससे आगे कोई अतिरिक्त सैद्धान्तिक विवरण नहीं जोड़ता।
- issue: τοῦ θεοῦ में सम्बन्ध का स्वरूप
  choice: ‘परमेश्वर का’ कहकर सम्बन्ध को व्यापक रखना
  alternative: ‘परमेश्वर से मिला’
  rationale: सम्बन्धकारक रूप स्वामित्व, सम्बन्ध या प्रदत्त स्रोत की छाया रख सकता है। ‘परमेश्वर का’ मूल की व्यापकता बचाता है और स्रोत के अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण स्तर रखा गया है। ‘युद्ध-साज’ सैनिक के संपूर्ण उपकरण का अर्थ देता है; ‘धारण कर लो’ आदेश की शक्ति बनाए रखता है। सर्वनाम बहुवचन ‘तुम’ मूल के बहुवचन को व्यक्त करता है।
