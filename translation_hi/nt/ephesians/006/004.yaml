  text: Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: hi
  text: और हे पिताओ, अपने बच्चों को क्रोध न दिलाओ,[a] बल्कि प्रभु के[c] अनुशासन और समझाइश[b] में उनका पालन-पोषण करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने बच्चों को खिझाकर उनके मन में रोष न जगाओ।” यूनानी क्रिया का अर्थ क्रोध या आक्रोश भड़काना है।
    reason: lexical_alternative
  - marker: b
    text: या “प्रभु के प्रशिक्षण और चेतावनी में उनका पालन-पोषण करो।”
    reason: lexical_alternative
  - marker: c
    text: “प्रभु के” का अर्थ प्रभु से मिलने वाला, प्रभु का अपना, प्रभु के अनुरूप या प्रभु द्वारा निर्देशित अनुशासन और समझाइश हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: पिताओ
  rationale: यूनानी शब्द स्पष्ट रूप से पुल्लिंग बहुवचन ‘पिता’ है। सम्बोधन को ‘माता-पिता’ बनाकर व्यापक नहीं किया गया।
- source_word: παροργίζετε
  choice: क्रोध न दिलाओ
  rationale: यह क्रिया किसी को क्रोधित करने या उसके मन में रोष भड़काने का कारण बनने का भाव रखती है; यह हिन्दी प्रयोग उस कारक अर्थ को स्पष्ट रखता है।
- source_word: τέκνα
  choice: बच्चों
  rationale: पारिवारिक सन्दर्भ में यह संतान के लिए सामान्य और समावेशी शब्द है; आधुनिक हिन्दी में ‘बच्चे’ स्वाभाविक है।
- source_word: ἐκτρέφετε
  choice: पालन-पोषण करो
  rationale: मूल क्रिया का शाब्दिक अर्थ पोषण करना हो सकता है, पर यहाँ बच्चों को पालने-बढ़ाने का व्यापक अर्थ अभिप्रेत है।
- source_word: παιδείᾳ
  choice: अनुशासन
  rationale: इसमें निर्माणकारी प्रशिक्षण और सुधार—दोनों का भाव है; ‘अनुशासन’ इसके सुधारात्मक पक्ष को भी बनाए रखता है।
- source_word: νουθεσίᾳ
  choice: समझाइश
  rationale: यह मौखिक मार्गदर्शन, चेतावनी या सुधारात्मक शिक्षा का संकेत देता है। ‘समझाइश’ साधारण आधुनिक हिन्दी में स्वाभाविक है और ‘अनुशासन’ से अर्थगत भेद भी रखता है।
- source_word: κυρίου
  choice: प्रभु के
  rationale: सम्बन्धकारक रूप को संक्षिप्त और खुला रखा गया है, ताकि स्रोत, स्वामित्व, चरित्र या निर्देशन में से किसी एक अर्थ को अनावश्यक रूप से निश्चित न किया जाए।
theological_decisions:
- issue: πατέρες के सम्बोधन का दायरा
  choice: विशेष रूप से ‘पिताओ’
  alternative: ‘माता-पिताओ’ या ‘अभिभावको’
  rationale: यूनानी पाठ पिता कहता है। व्यापक व्यावहारिक अनुप्रयोग सम्भव होने पर भी अनुवाद में मूल सम्बोधन का दायरा नहीं बढ़ाया गया।
- issue: ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου में κυρίου का सम्बन्ध
  choice: ‘प्रभु के’ कहकर सम्बन्धकारक की व्यापकता बनाए रखना
  alternative: ‘प्रभु से मिलने वाले’, ‘प्रभु के विषय में’, या ‘प्रभु के अनुसार’
  rationale: यूनानी सम्बन्धकारक स्रोत, स्वामित्व, चरित्र या निर्देशन का बोध करा सकता है। हिन्दी का ‘प्रभु के’ इस वास्तविक अस्पष्टता को किसी एक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘हे पिताओ’ सीधे सम्बोधन को स्वाभाविक बनाता है; ‘पालन-पोषण’ बाल-पालन के व्यापक भाव को व्यक्त करता है। सम्बन्धकारक की धर्मवैज्ञानिक अस्पष्टता मुख्य पाठ और टिप्पणी दोनों में सुरक्षित है।
