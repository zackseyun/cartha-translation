base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: hi
  text: मैंने उसे तुम्हारे पास इसी उद्देश्य से भेजा है कि तुम जान सको कि हमारा क्या हाल है[a], और वह तुम्हारे हृदयों को प्रोत्साहित करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम हमारी परिस्थितियाँ जान सको”; शाब्दिक रूप से, “तुम हमारे विषय में बातें जान सको।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: उसे
  rationale: यह पुल्लिंग एकवचन सम्बन्धवाचक सर्वनाम पिछले पद के तुखिकुस की ओर संकेत करता है; हिन्दी में मुख्य वाक्य के साथ स्वाभाविक रूप से ‘उसे’ कहा गया है।
- source_word: ἔπεμψα
  choice: मैंने भेजा है
  rationale: पत्र लिखने की स्थिति में यूनानी एओरिस्ट उस भेजने को व्यक्त करता है जिसका वर्तमान पाठकों से सीधा सम्बन्ध है; आधुनिक हिन्दी में पूर्ण वर्तमान स्वाभाविक है।
- source_word: πρὸς ὑμᾶς
  choice: तुम्हारे पास
  rationale: भेजने की क्रिया के साथ πρός व्यक्ति की ओर गति दर्शाता है; ‘तुम्हारे पास’ सहज हिन्दी है।
- source_word: εἰς αὐτὸ τοῦτο
  choice: इसी उद्देश्य से
  rationale: αὐτὸ τοῦτο के बल को ‘इसी’ सुरक्षित रखता है और उद्देश्य का भाव स्पष्ट करता है।
- source_word: ἵνα
  choice: कि
  rationale: यह उद्देश्यसूचक उपवाक्य आरम्भ करता है; ‘कि’ यहाँ संक्षिप्त और स्वाभाविक है।
- source_word: γνῶτε τὰ περὶ ἡμῶν
  choice: तुम जान सको कि हमारा क्या हाल है
  rationale: यह पौलुस और उसके साथियों से सम्बन्धित दशा और परिस्थितियों, दोनों को समेटता है तथा यूनानी की व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: παρακαλέσῃ
  choice: वह ... प्रोत्साहित करे
  rationale: παρακαλέω में प्रोत्साहन, सांत्वना और आग्रह की अर्थ-सीमा है; ‘हृदयों’ के साथ इस प्रसंग में ‘प्रोत्साहित करे’ सबसे उपयुक्त और खुला अर्थ देता है।
- source_word: τὰς καρδίας ὑμῶν
  choice: तुम्हारे हृदयों को
  rationale: मूल बाइबलीय मानव-विज्ञान की अभिव्यक्ति को सुरक्षित रखते हुए यह हिन्दी में समझने योग्य है।
theological_decisions:
- issue: τὰ περὶ ἡμῶν का अर्थ
  choice: ‘हमारा क्या हाल है’
  alternative: ‘हमारी परिस्थितियाँ क्या हैं’ अथवा ‘हमारे विषय की बातें’
  rationale: यूनानी पदबंध व्यक्तिगत दशा और बाहरी परिस्थितियों दोनों को समेट सकता है। मुख्य पाठ का चयन इस व्यापकता को बनाए रखता है, और पादटिप्पणी शाब्दिक तथा परिस्थितिजन्य विकल्प बताती है।
- issue: παρακαλέσῃ की अर्थ-सीमा
  choice: ‘प्रोत्साहित करे’
  alternative: ‘सांत्वना दे’ अथवा ‘दृढ़ करे’
  rationale: प्रसंग विश्वासियों के आन्तरिक उत्साह और दृढ़ता से सम्बन्धित है; ‘प्रोत्साहित’ किसी विशिष्ट सिद्धान्तगत अर्थ को थोपे बिना व्यापक अर्थ को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। ‘तुम’ बहुवचन समुदाय को सम्बोधित करता है; ‘हृदयों’ को मूल के बाइबलीय रूपक के कारण बनाए रखा गया है।
