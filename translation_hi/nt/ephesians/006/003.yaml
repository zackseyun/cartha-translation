source:
  edition: SBLGNT
  text: ἵνα εὖ σοι γένηται καὶ ἔσῃ μακροχρόνιος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/003.yaml
  text: so that it may go well with you and you may live long on the earth[a].
translation:
  language: hi
  text: ताकि तुम्हारा भला हो और तुम पृथ्वी पर बहुत दिनों तक जीवित रहो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश में”; यह निर्गमन 20:12 और व्यवस्थाविवरण 5:16 में दी गई पाँचवीं आज्ञा के शब्दों की प्रतिध्वनि है।
    reason: वैकल्पिक अनुवाद और पुराने नियम की पृष्ठभूमि
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह पिछले पद की आज्ञा से जुड़ी प्रतिज्ञा का उद्देश्य या परिणाम बताता है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी संयोजक का बल बनाए रखता है।
- source_word: εὖ σοι γένηται
  choice: तुम्हारा भला हो
  rationale: यह पूरा यूनानी वाक्यांश एक मुहावरा है जिसका अर्थ है कि किसी के साथ बातें अच्छी तरह घटें; ‘तुम्हारा भला हो’ संक्षिप्त, स्वाभाविक और अर्थनिष्ठ हिन्दी है।
- source_word: καὶ
  choice: और
  rationale: यह प्रतिज्ञा के दोनों परिणामों को जोड़ने वाला साधारण समुच्चयबोधक है।
- source_word: ἔσῃ μακροχρόνιος
  choice: तुम बहुत दिनों तक जीवित रहो
  rationale: शाब्दिक रूप से ‘तुम दीर्घायु होगे’; हिन्दी में ‘बहुत दिनों तक जीवित रहो’ इस विधेय विशेषण का अर्थ स्पष्ट और सहज रूप से व्यक्त करता है तथा ἵνα के अधीन वाक्य-संबंध को बनाए रखता है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: γῆ का व्यापक अर्थ ‘पृथ्वी’ है और इफिसियों में यूनानी पाठ किसी विशेष देश या भूमि का उल्लेख नहीं करता। दस आज्ञाओं की पृष्ठभूमि के कारण ‘देश में’ संभव है, जिसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: पाँचवीं आज्ञा की प्रतिज्ञा के संबंध में ἐπὶ τῆς γῆς का दायरा
  choice: पृथ्वी पर
  alternative: देश में
  rationale: अनुवाद इफिसियों के वर्तमान यूनानी पाठ की व्यापक अभिव्यक्ति का अनुसरण करता है और निर्गमन/व्यवस्थाविवरण की वाचा-भूमि संबंधी विशिष्टता को मुख्य पाठ में नहीं जोड़ता; फिर भी आज्ञा की प्रतिध्वनि और ‘देश में’ की संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘तुम्हारा भला हो’ सामान्य हिन्दी का स्वाभाविक मुहावरा है। ‘पृथ्वी पर’ मुख्य यूनानी पाठ की व्यापकता बनाए रखता है, जबकि पादटिप्पणी शास्त्रीय प्रतिध्वनि को स्पष्ट करती है।
