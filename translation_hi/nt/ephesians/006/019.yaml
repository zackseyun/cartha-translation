source:
  edition: SBLGNT
  text: καὶ ὑπὲρ ἐμοῦ, ἵνα μοι δοθῇ λόγος ἐν ἀνοίξει τοῦ στόματός μου, ἐν παρρησίᾳ γνωρίσαι τὸ μυστήριον τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/019.yaml
  text: and for me[a], that words may be given to me in opening my mouth, to make known with boldness the mystery of the gospel[e][d][c][b],
translation:
  language: hi
  text: और मेरे लिए भी प्रार्थना करो कि जब मैं अपना मुँह खोलूँ, तो मुझे बोलने के लिए शब्द दिए जाएँ, ताकि मैं निर्भीकता से सुसमाचार का रहस्य प्रकट कर सकूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὑπὲρ ἐμοῦ
  choice: और मेरे लिए भी प्रार्थना करो
  rationale: पिछले पद से प्रार्थना का आग्रह यहाँ निहित है; उसे स्पष्ट करना हिन्दी में वाक्य को स्वाभाविक बनाता है। καί को ‘भी’ से व्यक्त किया गया है।
- source_word: δοθῇ λόγος
  choice: मुझे सही वचन दिया जाए
  rationale: λόγος यहाँ बोलने के लिए प्रदान की गई वाणी या कथन को दर्शाता है। ‘वचन’ एकवचन और दैवी रूप से दिए जाने के भाव को बनाए रखता है; ‘सही’ हिन्दी में आशय स्पष्ट करता है, यद्यपि यह यूनानी में अलग विशेषण नहीं है।
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: जब मैं अपना मुँह खोलूँ
  rationale: मूल बिंब को बनाए रखते हुए यह हिन्दी में बोलना आरम्भ करने का स्वाभाविक मुहावरा है।
- source_word: ἐν παρρησίᾳ
  choice: साहस के साथ
  rationale: παρρησία में निर्भीक, खुलकर बोलने का भाव है; ‘साहस के साथ’ सामान्य हिन्दी में इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: γνωρίσαι
  choice: प्रकट करूँ
  rationale: क्रिया का अर्थ किसी बात को ज्ञात कराना है। ‘प्रकट करूँ’ संक्षिप्त है और प्रचार की ऐसी विशिष्ट विधि नहीं जोड़ता जो मूल में नहीं है।
- source_word: τὸ μυστήριον τοῦ εὐαγγελίου
  choice: सुसमाचार का भेद
  rationale: μυστήριον पौलुस के प्रयोग में पहले छिपी और अब प्रकट की गई परमेश्वर की योजना को सूचित करता है; ‘भेद’ आधुनिक हिन्दी में अनसुलझी पहेली की अपेक्षा गुप्त रहे सत्य का भाव बेहतर देता है। εὐαγγέλιον के लिए स्थापित ‘सुसमाचार’ रखा गया है।
theological_decisions:
- issue: λόγος का आशय
  choice: ‘वचन’—बोलने के लिए दिया गया कथन
  alternative: ‘संदेश’ या ‘वाणी’
  rationale: यह अनिवार्यतः किसी तकनीकी प्रेरणा-सिद्धान्त को नहीं बताता, पर परमेश्वर से उपयुक्त कथन मिलने की प्रार्थना अवश्य व्यक्त करता है।
- issue: παρρησία का बल
  choice: ‘साहस के साथ’
  alternative: ‘निडर होकर’ या ‘खुलकर’
  rationale: चयन सार्वजनिक गवाही में निर्भीकता को व्यक्त करता है और इसे केवल आत्मविश्वास तक सीमित नहीं करता।
- issue: μυστήριον का पौलुसी अर्थ
  choice: ‘भेद’
  alternative: ‘रहस्य’
  rationale: यह कोई अनसुलझी पहेली नहीं, बल्कि परमेश्वर का वह उद्देश्य है जो पहले छिपा था और अब ज्ञात कराया जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पिछले पद से आए प्रार्थना-संदर्भ को स्पष्ट किया गया है। पद के अंत में पूर्णविराम दिया गया है क्योंकि इसे स्वतंत्र उद्धरण के रूप में प्रस्तुत किया गया है।
