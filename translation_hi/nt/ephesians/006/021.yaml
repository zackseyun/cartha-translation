base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: hi
  text: ताकि तुम भी मेरे विषय में—कि मैं क्या कर रहा हूँ—जान सको, तुखिकुस, जो प्रभु में प्रिय भाई और विश्वासयोग्य सेवक है, तुम्हें सब कुछ बता देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: पर ... इसलिए
  rationale: ἵνα उद्देश्य बताता है और δέ हल्का संयोजक अथवा विपरीतार्थक संबंध जोड़ता है। हिन्दी में विभाजित संरचना ‘पर ... इसलिए’ दोनों का स्वाभाविक रूप से संकेत करती है।
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: तुम भी ... जान सको
  rationale: καί और स्पष्ट ὑμεῖς का योग पाठकों पर अतिरिक्त बल देता है; ‘तुम भी’ इसे सहज हिन्दी में बनाए रखता है।
- source_word: τὰ κατ’ ἐμέ
  choice: मेरी परिस्थितियों के विषय में
  rationale: यह यूनानी मुहावरा पौलुस से संबंधित बातों अथवा उसकी परिस्थितियों को दर्शाता है। चुना हुआ रूप अर्थ स्पष्ट करता है, जबकि पादटिप्पणी अधिक शब्दशः विकल्प सुरक्षित रखती है।
- source_word: τί πράσσω
  choice: मैं क्या कर रहा हूँ
  rationale: प्रसंग में πράσσω पौलुस के कार्य या गतिविधि को दर्शाता है; यह सीधा और स्वाभाविक अनुवाद है।
- source_word: πάντα γνωρίσει ὑμῖν
  choice: तुम्हें सब कुछ बता देगा
  rationale: γνωρίζω का अर्थ किसी बात से अवगत कराना है। हिन्दी में ‘बता देगा’ स्वाभाविक है और भविष्यकाल को बनाए रखता है।
- source_word: Τυχικὸς
  choice: तुखिकुस
  rationale: यूनानी नाम का देवनागरी में निकट और प्रचलन-संगत लिप्यंतरण।
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: प्रिय भाई
  rationale: यह तुखिकुस के प्रति स्नेह और मसीही पारिवारिक संबंध दोनों व्यक्त करता है। हिन्दी में ‘प्रिय’ गरिमापूर्ण और सहज है।
- source_word: πιστὸς διάκονος
  choice: विश्वासयोग्य सेवक
  rationale: πιστός यहाँ भरोसेमंद अथवा निष्ठावान होने का भाव रखता है। διάκονος इस प्रसंग में सेवा करने वाले सहकर्मी को दर्शाता है; ‘सेवक’ किसी औपचारिक कलीसियाई पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह पौलुस की विशिष्ट संबंध अथवा क्षेत्र-सूचक अभिव्यक्ति को संक्षिप्त और परिचित हिन्दी में बनाए रखता है।
theological_decisions:
- issue: तुखिकुस के लिए διάκονος का अनुवाद
  choice: सेवक
  alternative: सेवकाई करने वाला; परिचारक; डीकन
  rationale: प्रसंग तुखिकुस को पौलुस का भरोसेमंद सहकर्मी बताता है, पर औपचारिक ‘डीकन’ पद को स्पष्ट रूप से स्थापित नहीं करता। ‘सेवक’ इस खुलापन को सुरक्षित रखता है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- issue: ἀδελφός का अनुवाद
  choice: भाई
  alternative: सहोदर
  rationale: यहाँ एक विशिष्ट पुरुष सहकर्मी तुखिकुस का उल्लेख है, इसलिए ‘भाई’ संदर्भ और लिंग दोनों की दृष्टि से सटीक है।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ἐν κυρίῳ पौलुस के लेखन में यीशु के साथ संबंध को व्यक्त करने वाला स्थापित प्रयोग है; ‘प्रभु’ उस उपाधि को उचित रूप से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए बहुवचन ‘तुम’ रखा गया है। वाक्य को सहज बनाने और तुखिकुस संबंधी विशेषणों की सीमा स्पष्ट करने के लिए डैश प्रयुक्त हैं। भाषा गरिमापूर्ण है, पर अत्यधिक संस्कृतनिष्ठ नहीं।
