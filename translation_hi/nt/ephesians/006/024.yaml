  text: ἡ χάρις μετὰ πάντων τῶν ἀγαπώντων τὸν κύριον ἡμῶν Ἰησοῦν Χριστὸν ἐν ⸀ἀφθαρσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: hi
  text: अनुग्रह उन सबके साथ रहे जो हमारे प्रभु यीशु मसीह से अविनश्वरता में प्रेम करते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘अविनाशी प्रेम से’ भी समझा जा सकता है; अन्य सम्भव अनुवाद हैं, ‘निष्कपटता से’ या ‘कभी न मिटनेवाले प्रेम से।’ यूनानी पदबंध का शाब्दिक अर्थ ‘अविनश्वरता में’ है और उसके एक से अधिक अर्थ सम्भव हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस के पत्रों की आशीर्वचन-शैली के अनुरूप; यहाँ यह परमेश्वर के कृपापूर्ण अनुग्रह की कामना व्यक्त करता है।
- source_word: μετὰ πάντων
  choice: उन सबके साथ रहे
  rationale: यूनानी वाक्य में क्रिया निहित है; स्वाभाविक हिन्दी आशीर्वचन में ‘रहे’ जोड़कर μετά के ‘साथ’ वाले अर्थ को सुरक्षित रखा गया है।
- source_word: ἀγαπώντων
  choice: जो ... प्रेम करते हैं
  rationale: वर्तमान कृदन्त को स्वाभाविक सम्बन्धवाचक उपवाक्य में व्यक्त किया गया है, जो निरन्तर पहचाने जानेवाले गुण का बोध देता है।
- source_word: κύριον
  choice: प्रभु
  rationale: मसीही उपाधि के रूप में κύριος का प्रचलित, गरिमापूर्ण और सीधा हिन्दी प्रतिरूप।
- source_word: Ἰησοῦν Χριστὸν
  choice: यीशु मसीह
  rationale: Χριστός के अभिषिक्त/मसीहा संबंधी उपाधिगत अर्थ को हिन्दी के स्वाभाविक और व्यापक रूप ‘मसीह’ से व्यक्त किया गया है।
- source_word: ἐν ἀφθαρσίᾳ
  choice: अविनश्वरता में
  rationale: यूनानी पदबंध की संक्षिप्तता और वास्तविक अर्थगत अस्पष्टता को मुख्य पाठ में बनाए रखने के लिए अपेक्षाकृत रूप-समीपी अनुवाद चुना गया है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ἐν ἀφθαρσίᾳ का संबंध और आशय
  choice: मुख्य पाठ में ‘अविनश्वरता में’ रखकर अस्पष्टता सुरक्षित रखना
  alternative: ‘अविनाशी प्रेम से’, ‘निष्कपटता से’, या ‘कभी न मिटनेवाले प्रेम से’
  rationale: यूनानी से यह पूरी तरह स्पष्ट नहीं है कि ἀφθαρσία प्रेम की अविनाशी प्रकृति बताता है, प्रेम करने की रीति, अथवा उस आशीष का क्षेत्र या गुण। किसी एक व्याख्या को निर्णायक बनाए बिना सम्भावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण आशीर्वचनात्मक रूप। ‘अविनश्वरता में’ सामान्य बोलचाल से कुछ अधिक औपचारिक है, पर मूल यूनानी की जानबूझकर न सुलझाई गई अस्पष्टता को सुरक्षित रखने के लिए उपयुक्त है।
