  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: hi
  text: बच्चो, प्रभु में[a] अपने माता-पिता की आज्ञा मानो, क्योंकि यह उचित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रभु में’ का अर्थ ‘प्रभु के अपने जन होने के नाते’ या ‘प्रभु के साथ एकता में’ भी हो सकता है। यह वाक्यांश आज्ञापालन के क्षेत्र या ढंग को बता सकता है और यह संकेत भी दे सकता है कि ऐसा आज्ञापालन प्रभु के प्रति निष्ठा की सीमा में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: बच्चो
  rationale: सम्बोधन बहुवचन घरों के बच्चों को सीधे संबोधित करता है। ‘बच्चो’ आधुनिक हिन्दी में स्वाभाविक है और पारिवारिक संबंध स्पष्ट रखता है।
- source_word: ὑπακούετε
  choice: आज्ञा मानो
  rationale: वर्तमान सक्रिय आज्ञार्थक केवल सुनने नहीं, बल्कि बात मानकर चलने का निर्देश देता है; ‘आज्ञा मानो’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: γονεῦσιν
  choice: माता-पिता
  rationale: बहुवचन संज्ञा दोनों अभिभावकों को सामूहिक रूप से दर्शाती है; ‘माता-पिता’ सटीक और प्रचलित हिन्दी है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह संक्षिप्त पौलुसी अभिव्यक्ति आज्ञापालन के क्षेत्र या ढंग तथा प्रभु से संबंध—दोनों की सम्भावना खुली रखती है।
- source_word: δίκαιον
  choice: उचित
  rationale: यहाँ शब्द नैतिक रूप से सही और शोभनीय बात को दर्शाता है। ‘उचित’ आधुनिक हिन्दी में स्पष्ट है और प्रसंग में ‘धर्मी’ से अधिक स्वाभाविक है।
theological_decisions:
- issue: ‘प्रभु में’ वाक्यांश का दायरा
  choice: 'इसे आज्ञा के साथ रखा गया है: ‘प्रभु में अपने माता-पिता की आज्ञा मानो।’'
  alternative: ‘जो बच्चे प्रभु में हैं, वे अपने माता-पिता की आज्ञा मानें’ अथवा ‘माता-पिता की आज्ञा वैसे मानो जैसा प्रभु में उचित है।’
  rationale: यूनानी में ἐν κυρίῳ सबसे स्वाभाविक रूप से आज्ञार्थक क्रिया से जुड़ता है, पर इसकी ठीक छाया स्पष्ट नहीं है। शाब्दिक वाक्यांश बच्चों की प्रभु में पहचान, आज्ञापालन के क्षेत्र या ढंग, और प्रभु के प्रति निष्ठा से उसकी अन्तर्निहित सीमा की सम्भावना को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बच्चो’ प्रत्यक्ष सम्बोधन को और ‘आज्ञा मानो’ घरेलू उपदेश की स्पष्ट आज्ञार्थक शक्ति को बनाए रखते हैं।
