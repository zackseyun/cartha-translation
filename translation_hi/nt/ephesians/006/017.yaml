  text: καὶ τὴν περικεφαλαίαν τοῦ σωτηρίου ⸀δέξασθε, καὶ τὴν μάχαιραν τοῦ πνεύματος, ὅ ἐστιν ῥῆμα θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/017.yaml
  text: And receive the helmet of salvation[a], and the sword of the Spirit, which is the word of God[b],
translation:
  language: hi
  text: और उद्धार का टोप[a] ग्रहण करो, और आत्मा की तलवार भी, जो परमेश्वर का वचन[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ले लो’।
    reason: lexical_alternative
  - marker: b
    text: या ‘परमेश्वर की कही हुई बात’; यूनानी शब्द rhēma किसी बोले गए वचन, कथन या संदेश पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξασθε
  choice: ग्रहण करो
  rationale: बहुवचन आज्ञार्थक क्रिया का अर्थ किसी दी हुई वस्तु को लेना या स्वीकार करना है। ‘ग्रहण करो’ इस भाव को बनाए रखता है और कवच के रूपक में स्वाभाविक, गरिमापूर्ण हिन्दी है।
- source_word: περικεφαλαίαν
  choice: टोप
  rationale: यह सिर की रक्षा करने वाले सैनिक कवच का सामान्य शब्द है। ‘टोप’ आधुनिक हिन्दी बाइबलीय प्रयोग में संक्षिप्त और स्पष्ट समतुल्य है।
- source_word: τοῦ σωτηρίου
  choice: उद्धार का
  rationale: यह सम्बन्धवाचक पद उद्धार/छुटकारे का भाव रखता है। ‘उद्धार का’ पौलुस के व्यापक धर्मवैज्ञानिक प्रयोग और यहाँ के रूपक—दोनों को बिना सम्बन्ध की प्रकृति अधिक निश्चित किए सुरक्षित रखता है।
- source_word: μάχαιραν
  choice: तलवार
  rationale: यह धारदार युद्धास्त्र को सूचित करता है, प्रायः छोटी तलवार को भी; मुख्य पाठ में ‘तलवार’ सबसे स्वाभाविक है और अनावश्यक रूप से आकार निश्चित नहीं करता।
- source_word: τοῦ πνεύματος
  choice: आत्मा की
  rationale: इस प्रसंग में πνεῦμα का सबसे स्वाभाविक संकेत पवित्र आत्मा की ओर है। हिन्दी में ‘आत्मा’ उस संकेत को बनाए रखता है, जबकि सम्बन्ध—आत्मा द्वारा दी गई या आत्मा से सम्बद्ध तलवार—को अनावश्यक रूप से नहीं खोलता।
- source_word: ὅ ἐστιν
  choice: जो ... है
  rationale: नपुंसकलिंग सम्बन्धवाचक सर्वनाम अगले पद द्वारा तलवार के रूपक की व्याख्या करता है। ‘जो ... है’ हिन्दी में इस व्याख्यात्मक सम्बन्ध को सहजता से व्यक्त करता है।
- source_word: ῥῆμα θεοῦ
  choice: परमेश्वर का वचन
  rationale: ῥῆμα कही गई बात, कथन या संदेश पर बल दे सकता है। ‘परमेश्वर का वचन’ परिचित और स्वाभाविक है; पादटिप्पणी उसके कथित वचन/उक्ति वाले सम्भव सूक्ष्म अर्थ को सुरक्षित रखती है।
theological_decisions:
- issue: ‘आत्मा’ का अभिप्रेत सन्दर्भ
  choice: पवित्र आत्मा
  alternative: मानवीय आत्मा अथवा सामान्य आत्मिक क्षेत्र
  rationale: परमेश्वर के हथियारों के इस प्रसंग में और आगे ‘परमेश्वर का वचन’ से इसकी पहचान के कारण पवित्र आत्मा सबसे स्वाभाविक अभिप्रेत है। फिर भी अनुवाद सम्बन्ध की ठीक प्रकृति—आत्मा की, आत्मा से मिली, या आत्मा द्वारा प्रयुक्त—को स्पष्ट करके सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘ग्रहण करो’ मूल क्रिया के प्राप्त करने/लेने के भाव को रखता है; ‘टोप’ सैनिक कवच के रूपक को संक्षिप्त रूप में व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
