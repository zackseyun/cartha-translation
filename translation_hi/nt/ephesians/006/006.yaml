  text: not by eye-service[a], as people-pleasers, but as servants of Messiah[c][b], doing the will of God from the soul.
translation:
  language: hi
  text: लोगों को प्रसन्न करनेवालों की तरह केवल लोगों की निगाह में की जानेवाली सेवा मत करो[a], बल्कि मसीह[b] के दासों की तरह पूरे मन से[c] परमेश्वर की इच्छा पूरी करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘आँख-सेवा’; अर्थात केवल दिखावे के लिए या किसी के देखते समय की जानेवाली सेवा।
    reason: lexical_alternative
  - marker: b
    text: या ‘ख्रीस्त’; यूनानी ‘ख्रिस्तोस’। ‘मसीह’ का अर्थ ‘अभिषिक्त जन’ है।
    reason: alternative_reading
  - marker: c
    text: या ‘जी-जान से’; शाब्दिक रूप से ‘प्राण से’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: केवल तभी सेवा ... जब कोई देख रहा हो
  rationale: यूनानी का दुर्लभ संयुक्त शब्द शाब्दिक रूप से ‘आँख-सेवा’ है और ऐसी सेवा बताता है जो निगरानी में केवल दिखावे के लिए की जाए। अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट किया गया है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: ἀνθρωπάρεσκοι
  choice: लोगों को प्रसन्न करनेवाले
  rationale: यह उन लोगों को दर्शाता है जो मनुष्यों की स्वीकृति पाने के लिए काम करते हैं। यह हिन्दी में स्वाभाविक है और शब्द का नकारात्मक भाव बनाए रखता है।
- source_word: δοῦλοι
  choice: दास
  rationale: तात्कालिक संदर्भ वास्तविक दासों का है और यहाँ मसीह के प्रति उनके बँधे हुए संबंध को सामने रखा गया है। ‘दास’ आधुनिक हिन्दी में इस अधीनता को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός अभिषिक्त राजा की उपाधि है। ‘मसीह’ हिन्दी बाइबलीय प्रयोग में प्रचलित है और उपाधि के अर्थ को बनाए रखता है।
- source_word: ποιοῦντες τὸ θέλημα τοῦ θεοῦ
  choice: परमेश्वर की इच्छा पूरी करो
  rationale: हिन्दी में ‘इच्छा करना’ की अपेक्षा ‘इच्छा पूरी करना’ नैतिक आज्ञा के संदर्भ में अधिक स्वाभाविक ढंग से यूनानी ‘करते हुए’ का अर्थ देता है।
- source_word: ἐκ ψυχῆς
  choice: पूरे मन से
  rationale: शाब्दिक अर्थ ‘प्राण/आत्मा से’ है, पर मुहावरे का आशय भीतर से, निष्कपट और समग्र तत्परता के साथ करना है। ‘पूरे मन से’ सामान्य हिन्दी में यही भाव देता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: घराने-संबंधी निर्देश के संदर्भ में δοῦλοι का अनुवाद
  choice: मसीह के दास
  alternative: मसीह के सेवक
  rationale: आस-पास का संदर्भ वास्तविक दासता का है और वाक्य उनकी परम निष्ठा को मसीह से जोड़ता है। इसलिए ‘दास’ सामाजिक कठोरता और संबंधगत अधीनता को नरम किए बिना रखता है।
- issue: Χριστοῦ को उपाधि या नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ अभिषिक्त प्रभु के प्रति स्वामिभक्ति का भाव प्रमुख है। ‘मसीह’ उपाधि का अर्थ बनाए रखने वाला प्रचलित हिन्दी रूप है।
- issue: ἐκ ψυχῆς की मानव-स्वरूप संबंधी भाषा
  choice: पूरे मन से
  alternative: प्राण से / आत्मा से
  rationale: यूनानी ψυχή को यहाँ मनुष्य के किसी पृथक तत्त्व के बारे में सिद्धान्तगत कथन मानना आवश्यक नहीं; पूरा वाक्य निष्कपट, अंतःकरण से की गई सेवा पर बल देता है। मुख्य पाठ में स्वाभाविक मुहावरा और पादटिप्पणी में शाब्दिक रूप दोनों रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘केवल तभी ... जब कोई देख रहा हो’ दुर्लभ यूनानी रूपक का अर्थ सामान्य पाठक के लिए खोलता है, जबकि पादटिप्पणी उसका शाब्दिक रूप सुरक्षित रखती है। ‘दास’ से मूल संदर्भ की असुविधाजनक सामाजिक वास्तविकता को ‘सेवक’ कहकर नरम नहीं किया गया।
