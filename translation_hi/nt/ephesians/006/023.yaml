base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/023.yaml
  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: hi
  text: भाइयों[a] को परमेश्वर पिता और प्रभु यीशु मसीह की ओर से शान्ति और विश्वास के साथ प्रेम मिलें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भाई-बहनों को।” यूनानी में “भाइयों” का पुल्लिंग बहुवचन रूप है, जो पूरे विश्वासी समुदाय को सम्बोधित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰρήνη
  choice: शान्ति ... मिले
  rationale: यूनानी में संज्ञा आशीर्वाद की संक्षिप्त कामना के रूप में प्रयुक्त है। स्वाभाविक हिन्दी में ‘मिले’ जोड़कर उसका कामनात्मक भाव स्पष्ट किया गया है, बिना अर्थ बढ़ाए।
- source_word: τοῖς ἀδελφοῖς
  choice: भाइयों को
  rationale: यह व्याकरण की दृष्टि से पुल्लिंग बहुवचन है और पौलुस के प्रयोग में प्रायः सम्पूर्ण विश्वासी समुदाय को सम्बोधित करता है; समावेशी आशय पाद-टिप्पणी में रखा गया है।
- source_word: ἀγάπη
  choice: प्रेम
  rationale: ἀγάπη का सामान्य और प्रसंगानुकूल हिन्दी प्रतिशब्द है।
- source_word: μετὰ πίστεως
  choice: विश्वास के साथ
  rationale: μετά के साथ सम्बन्धसूचक रूप संगति का अर्थ देता है; πίστις का प्राथमिक अनुवाद ‘विश्वास’ रखा गया है, जबकि अन्य सम्भव अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: ἀπὸ
  choice: की ओर से
  rationale: यहाँ स्रोत या उद्गम व्यक्त होता है। आशीर्वाद देने वाले व्यक्तियों के साथ ‘की ओर से’ स्वाभाविक हिन्दी है।
- source_word: θεοῦ πατρὸς
  choice: परमेश्वर पिता
  rationale: मूल में ‘हमारे’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: κυρίου
  choice: प्रभु
  rationale: नए नियम के इस धार्मिक और मसीह-संबंधी प्रयोग में κύριος का प्रचलित तथा उपयुक्त अनुवाद है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός पदवी है; हिन्दी में ‘मसीह’ उसका अर्थपूर्ण, प्रचलित रूप है और ‘यीशु मसीह’ स्वाभाविक मानक अभिव्यक्ति है।
theological_decisions:
- issue: Χριστοῦ को पदवी के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त / क्राइस्ट
  rationale: Χριστός के अभिषिक्त उद्धारकर्ता वाले पदवीगत अर्थ को ‘मसीह’ सुरक्षित रखता है और आधुनिक हिन्दी बाइबलीय भाषा में स्वाभाविक है।
- issue: ἀδελφοῖς में लिंग और समुदाय का दायरा
  choice: भाइयों
  alternative: भाई-बहनों
  rationale: मुख्य पाठ यूनानी के पुल्लिंग बहुवचन रूप को दर्शाता है, जबकि सम्भावित पूरे विश्वासी समुदाय का समावेशी आशय पाद-टिप्पणी में स्पष्ट किया गया है।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता / भरोसा
  rationale: इस स्वतंत्र प्रयोग में ‘विश्वास’ प्राथमिक अर्थ है; शब्द के सम्भव अर्थों को निर्णायक रूप से सीमित न करते हुए विकल्प पाद-टिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी की संक्षिप्त आशीर्वाद-वाक्य रचना को स्वाभाविक हिन्दी बनाने के लिए अन्त में ‘मिले’ रखा गया है। ‘शान्ति’ की वर्तनी हिन्दी बाइबलीय परम्परा और औपचारिक रजिस्टर के अनुरूप है।
