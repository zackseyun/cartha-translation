  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: hi
  text: हर परिस्थिति में विश्वास[c] की ढाल उठा लो। उससे तुम दुष्ट[b] के सभी जलते हुए तीरों[a] को बुझा सकोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तीरों’ के स्थान पर ‘प्रक्षेपास्त्र’ भी अनुवाद किया जा सकता है; यूनानी शब्द विभिन्न प्रकार के फेंके या चलाए जाने वाले हथियारों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘दुष्ट’ के स्थान पर ‘बुराई’ भी संभव है; यूनानी पद को व्यक्तिगत या अमूर्त अर्थ में समझा जा सकता है, यद्यपि युद्ध का प्रसंग व्यक्तिगत अर्थ के अधिक अनुकूल है।
    reason: alternative_reading
  - marker: c
    text: ‘विश्वास’ का भाव यहाँ ‘भरोसा’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: हर परिस्थिति में
  rationale: 'यहाँ पदबंध को कवच-संबंधी उपदेश के बीच क्रियाविशेषणात्मक अर्थ में लिया गया है: प्रत्येक परिस्थिति में। यह स्वाभाविक आधुनिक हिन्दी है और ‘सब बातों में’ की अपेक्षा आशय अधिक स्पष्ट करता है।'
- source_word: ἀναλαβόντες
  choice: उठा लो
  rationale: कृदन्त इस उपदेश-श्रृंखला की मुख्य आज्ञा के साथ जुड़ी हुई क्रिया व्यक्त करता है। हिन्दी में आज्ञार्थक रूप स्वाभाविक ढंग से वही बल बनाए रखता है।
- source_word: θυρεὸν
  choice: ढाल
  rationale: यह शब्द बड़ी रक्षात्मक ढाल को सूचित करता है; सामान्य पाठक के लिए ‘ढाल’ स्पष्ट है और रूपक को अक्षुण्ण रखता है।
- source_word: τῆς πίστεως
  choice: विश्वास की
  rationale: यह संबंधकारक ढाल को रूपकात्मक रूप से विश्वास से संबद्ध करता है। ‘विश्वास’ πίστις का यहाँ स्वाभाविक और प्रचलित हिन्दी प्रतिरूप है।
- source_word: ἐν ᾧ
  choice: उससे
  rationale: संबंधवाचक सर्वनाम का संकेत ढाल की ओर है और प्रयोग साधनवाचक है; ‘उससे’ हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: δυνήσεσθε
  choice: बुझा सकोगे
  rationale: यह भविष्यकालीन सामर्थ्य व्यक्त करता है; संयुक्त क्रिया ‘सकोगे’ काल और क्षमता दोनों को बनाए रखती है।
- source_word: βέλη
  choice: तीरों
  rationale: βέλη प्रक्षेपास्त्रों का व्यापक शब्द हो सकता है, पर युद्ध के इस चित्र में ‘तीर’ आधुनिक हिन्दी में सहज और स्पष्ट है। व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τοῦ πονηροῦ
  choice: उस दुष्ट
  rationale: सपद लेखयुक्त एकवचन और आत्मिक युद्ध का प्रसंग व्यक्तिगत अर्थ का समर्थन करते हैं। ‘उस दुष्ट’ किसी अतिरिक्त नाम को जोड़े बिना व्यक्तिगत संदर्भ बनाए रखता है।
- source_word: πεπυρωμένα
  choice: जलते हुए
  rationale: पूर्ण निष्क्रिय कृदन्त का मूल भाव आग लगाए गए अथवा धधकते प्रक्षेपास्त्रों का है। ‘जलते हुए’ स्वाभाविक हिन्दी में दृश्य को स्पष्ट रखता है।
- source_word: σβέσαι
  choice: बुझा
  rationale: क्रिया आग बुझाने को व्यक्त करती है; ‘बुझाना’ सहज आधुनिक हिन्दी है और अग्नि-रूपक को बनाए रखता है।
theological_decisions:
- issue: τοῦ πονηροῦ का व्यक्तिगत या अमूर्त अर्थ
  choice: उस दुष्ट
  alternative: बुराई
  rationale: आत्मिक युद्ध और आक्रमण के प्रसंग में व्यक्तिगत अर्थ अधिक संभावित है, फिर भी यूनानी रूप अमूर्त ‘बुराई’ की संभावना को पूरी तरह समाप्त नहीं करता; इसलिए विकल्प पादटिप्पणी में दिया गया है।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा
  rationale: इस प्रसंग में परमेश्वर पर रक्षात्मक निर्भरता का भाव है। ‘विश्वास’ धार्मिक और सामान्य दोनों प्रयोगों में समझा जाता है, जबकि ‘भरोसा’ इसी भाव को अधिक बोलचाल की भाषा में व्यक्त कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। छोटे वाक्य युद्ध-चित्र की गति बनाए रखते हैं। ‘उस दुष्ट’ व्यक्तिगत अर्थ को व्यक्त करता है, पर वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
