lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: अन्त में
  rationale: यह पत्र के समापन-खंड का परिचय देने वाला स्वाभाविक हिन्दी संक्रमण है; ‘अब से’ सम्भव है, पर इस सन्दर्भ में कम सम्भावित है।
- source_word: ἐνδυναμοῦσθε
  choice: बलवन्त किए जाओ
  rationale: 'वर्तमान आज्ञार्थक रूप के निष्क्रिय भाव को बनाए रखता है: पाठक केवल अपने भीतर से साहस जुटाएँ नहीं, बल्कि बल प्राप्त करें।'
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: ‘में’ पौलुस की सम्बन्ध अथवा क्षेत्र की भाषा को सुरक्षित रखता है; ‘प्रभु के द्वारा’ साधन का अर्थ आवश्यकता से अधिक निश्चित कर देता।
- source_word: κράτει
  choice: शक्ति
  rationale: यह प्रकट या प्रभावी शक्ति को व्यक्त करता है और ἰσχύς से शब्दगत भेद भी बनाए रखता है।
- source_word: ἰσχύος
  choice: सामर्थ्य
  rationale: यह अन्तर्निहित बल या सामर्थ्य को व्यक्त करता है; ‘उसके सामर्थ्य की शक्ति’ यूनानी के गहन, दोहरे शक्ति-वर्णन को स्वाभाविक हिन्दी में रखता है।
- source_word: αὐτοῦ
  choice: उसके
  rationale: सर्वनाम स्वाभाविक रूप से ‘प्रभु’ की ओर संकेत करता है; संज्ञा को दोहराना आवश्यक नहीं है।
theological_decisions:
- issue: ἐνδυναμοῦσθε में वाच्य और बल का स्रोत
  choice: 'निष्क्रिय आग्रह: ‘बलवन्त किए जाओ’'
  alternative: 'सक्रिय मुहावरा: ‘बलवन्त बनो’ अथवा ‘दृढ़ बनो’'
  rationale: निष्क्रिय अर्थ इस बात को खुला और प्रमुख रखता है कि विश्वासियों को बल प्राप्त होता है; यह उनके अपने संकल्प को ही स्रोत नहीं ठहराता, फिर भी बल दिए जाने की प्रक्रिया को आवश्यकता से अधिक परिभाषित नहीं करता।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस पौलुसी सन्दर्भ में ‘प्रभु’ स्वाभाविक और मानक धार्मिक सम्बोधन है तथा बिना व्याख्यात्मक विस्तार के यीशु की ओर संकेत करता है।
