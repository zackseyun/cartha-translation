lexical_decisions:
- source_word: στῆτε
  choice: स्थिर खड़े रहो
  rationale: क्रिया का मूल अर्थ ‘खड़े रहो’ है; प्रसंग में विरोध के सामने डटे रहने का भाव स्वाभाविक रूप से व्यक्त करने के लिए ‘स्थिर’ जोड़ा गया है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले उपदेश से निष्कर्ष और संबंध को स्पष्ट करता है।
- source_word: περιζωσάμενοι τὴν ὀσφὺν ὑμῶν
  choice: अपनी कमर ... कसकर
  rationale: ‘कमर कसना’ आधुनिक हिन्दी का सहज मुहावरा है और मूल क्रिया के चारों ओर कसने के बिंब को बनाए रखता है; मूल पाठ में ‘पेटी’ संज्ञा स्पष्ट रूप से नहीं है।
- source_word: ἐν ἀληθείᾳ
  choice: सत्य से
  rationale: यह साधन अथवा क्षेत्र—दोनों संभावित संबंधों को अपेक्षाकृत खुला रखता है और सत्य तथा सत्यनिष्ठा के बीच के अर्थ-तनाव को अनावश्यक रूप से नहीं सुलझाता।
- source_word: ἐνδυσάμενοι
  choice: पहनकर
  rationale: वस्त्र या कवच धारण करने के लिए स्वाभाविक हिन्दी, और कृदंत रूप मुख्य आज्ञा के साथ सहायक क्रिया को व्यक्त करता है।
- source_word: θώρακα
  choice: छाती-कवच
  rationale: धड़ की रक्षा करने वाले सैनिक कवच का बिंब साधारण पाठक के लिए स्पष्ट रखता है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: पौलुस के प्रयोग में परमेश्वर के अनुरूप सही स्थिति और सही आचरण के व्यापक अर्थ को बनाए रखता है; ‘न्याय’ को वैध विकल्प के रूप में पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ἐν ἀληθείᾳ का संबंध और अर्थ
  choice: सत्य से
  alternative: सत्य की पेटी अपनी कमर पर कसकर
  rationale: मूल यूनानी में ‘पेटी’ के लिए अलग संज्ञा नहीं है। मुख्य पाठ अधिक निकट रूप रखता है, जबकि पादटिप्पणी प्रचलित कवचात्मक समझ बताती है।
- issue: पौलुस के कवच-रूपक में δικαιοσύνη
  choice: धार्मिकता
  alternative: न्याय
  rationale: ‘धार्मिकता’ शब्द व्यक्तिगत और संबंधपरक सहीपन के व्यापक अर्थ को रखता है, जबकि ‘न्याय’ इसके सार्वजनिक और नैतिक आयाम को उजागर करने वाला वास्तविक विकल्प है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के लिए सहज रखी गई है। ‘कमर कसना’ परिचित हिन्दी प्रयोग है; ‘छाती-कवच’ सैन्य रूपक को स्पष्ट करता है। डैश मुख्य आज्ञा और उसे क्रियान्वित करने वाले दोनों कृदंत वाक्यांशों का संबंध दिखाता है।
