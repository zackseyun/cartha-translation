id: EPH.6.8
reference: Ephesians 6:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ⸂ἕκαστος, ὃ ἂν⸃ ποιήσῃ ἀγαθόν, τοῦτο ⸀κομίσεται ⸀παρὰ κυρίου, εἴτε δοῦλος εἴτε ἐλεύθερος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/008.yaml
  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether servant or free.
translation:
  language: hi
  text: यह जानते हुए कि हर व्यक्ति जो भी भला काम करेगा, उसका प्रतिफल वह प्रभु से पाएगा[a]—चाहे वह दास हो या स्वतंत्र व्यक्ति[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वही प्रभु से वापस पाएगा।” यूनानी क्रिया किए गए काम के अनुरूप वापस पाने या प्रतिफल पाने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “दास” के लिए प्रयुक्त यूनानी शब्द बंधी हुई सामाजिक स्थिति को दर्शाता है; इसका अनुवाद कभी-कभी “सेवक” भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: यह जानते हुए
  rationale: कृदन्त रूप को बनाए रखता है और पिछली आज्ञा के आधार से इसका संबंध दिखाता है, बिना कारणवाचक अर्थ को अनावश्यक रूप से स्पष्ट किए।
- source_word: ἕκαστος
  choice: हर व्यक्ति
  rationale: वितरणात्मक बल को स्वाभाविक और समावेशी आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: जो भी भला काम करेगा
  rationale: ἄν सहित संबंधवाचक उपवाक्य की अनिश्चितता ‘जो भी’ से और ἀγαθόν का नैतिक गुण ‘भला काम’ से स्पष्ट होता है।
- source_word: τοῦτο κομίσεται
  choice: उसका प्रतिफल वह ... पाएगा
  rationale: यूनानी मुहावरे का आशय है कि किए गए भले काम के अनुरूप व्यक्ति को वापस प्राप्त होगा। शाब्दिक ‘वही वापस पाएगा’ हिन्दी में ऐसा लग सकता है मानो वही काम वस्तु की तरह लौटेगा; ‘प्रतिफल’ प्रत्युत्तर और अनुरूपता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: παρὰ κυρίου
  choice: प्रभु से
  rationale: παρά के संबंधकारक प्रयोग में स्रोत का अर्थ है; ‘प्रभु’ संभावित मसीही संदर्भ और पदवी का भार बनाए रखता है।
- source_word: δοῦλος
  choice: दास
  rationale: ἐλεύθερος के साथ स्पष्ट सामाजिक विरोध होने के कारण ‘दास’ बंधी हुई सामाजिक स्थिति को ‘सेवक’ से अधिक ठीक रूप में व्यक्त करता है।
- source_word: ἐλεύθερος
  choice: स्वतंत्र व्यक्ति
  rationale: दास के विपरीत स्वतंत्र सामाजिक स्थिति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: गृहस्थ-संहिता के संदर्भ में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: पद में दास और स्वतंत्र व्यक्ति का सीधा विरोध है; इसलिए ऐतिहासिक सामाजिक वास्तविकता को नरम किए बिना ‘दास’ अधिक सटीक है।
- issue: κύριος का संदर्भ और अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: निकट संदर्भ में मानवीय स्वामियों की चर्चा होने पर भी प्रतिफल का स्रोत दिव्य प्रभु है; ‘प्रभु’ संभावित मसीही संदर्भ को सुरक्षित रखता है, जबकि ‘स्वामी’ उसे केवल गृहस्थ संबंध में सीमित कर सकता है।
- issue: κομίσεται में प्रतिफल का स्वरूप
  choice: उसका प्रतिफल ... पाएगा
  alternative: वही वापस पाएगा
  rationale: मूल क्रिया प्रत्युत्तर में या किए हुए के अनुरूप पाने का अर्थ दे सकती है। ‘प्रतिफल’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, पर प्रतिफल के सटीक स्वरूप को निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। वाक्य में ‘हर व्यक्ति’ का वितरणात्मक बल, प्रभु से मिलने वाले प्रतिफल का स्रोत, और दास तथा स्वतंत्र व्यक्ति का सामाजिक विरोध स्पष्ट रखा गया है।
