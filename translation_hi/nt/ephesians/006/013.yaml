base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: hi
  text: इसलिए परमेश्वर का पूरा युद्ध-साज उठा लो[a], ताकि तुम बुरे दिन[d] में प्रतिरोध कर सको[b] और सब कुछ कर चुकने के बाद[c] दृढ़ खड़े रह सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परमेश्वर के सारे हथियार।’ यूनानी शब्द एक सैनिक के पूरे युद्ध-साज को दर्शाता है, जिसमें हथियार और रक्षा-साधन दोनों शामिल हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘सामना कर सको’ अथवा ‘विरोध में डटे रह सको।’
    reason: lexical_alternative
  - marker: c
    text: या ‘सब कुछ पूरा कर लेने के बाद।’
    reason: lexical_alternative
  - marker: d
    text: ‘बुरा दिन’ घोर बुराई, परीक्षा या संघर्ष के समय को दर्शा सकता है; यह आवश्यक नहीं कि केवल अंत-समय के किसी एक विशिष्ट दिन का उल्लेख हो।
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह संक्षिप्त और स्वाभाविक निष्कर्षसूचक शब्द है, जो पिछले उपदेश से तार्किक संबंध बनाए रखता है।
- source_word: ἀναλάβετε
  choice: उठा लो
  rationale: ἀναλαμβάνω का मूल भाव किसी वस्तु को उठा लेने या अपने उपयोग के लिए ग्रहण करने का है; सैनिक रूपक में यह स्वाभाविक है और केवल ‘पहन लो’ कहने से अधिक सटीक है।
- source_word: τὴν πανοπλίαν
  choice: सारे हथियार
  rationale: πανοπλία सैनिक के पूर्ण युद्ध-साज को दर्शाता है। आधुनिक हिन्दी में ‘सारे हथियार’ सहज है; टिप्पणी इसके व्यापक अर्थ को स्पष्ट करती है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर के
  rationale: यह यूनानी संबंधकारक की व्यापकता बनाए रखता है और यह तय नहीं करता कि युद्ध-साज परमेश्वर का अपना है या परमेश्वर द्वारा दिया गया है।
- source_word: ἵνα δυνηθῆτε
  choice: ताकि तुम ... सको
  rationale: यह प्रयोजन और सामर्थ्य—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है। बहुवचन संबोधन के लिए ‘तुम’ सामान्य और सुबोध है।
- source_word: ἀντιστῆναι
  choice: सामना कर सको
  rationale: यह विरोध में टिकने या डटकर प्रतिरोध करने का अर्थ देता है, जबकि अंत के στῆναι के साथ खड़े रहने की पुनरुक्ति भी अलग रूप में बनी रहती है।
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: बुरे दिन में
  rationale: यह पदबंध को खुला रखता है—यह घोर बुराई, परीक्षा या संघर्ष के समय का संकेत हो सकता है, बिना इसे अनिवार्य रूप से किसी एक अंतिम दिन तक सीमित किए।
- source_word: ἅπαντα κατεργασάμενοι
  choice: सब कुछ कर चुकने के बाद
  rationale: यह पूर्ण हुए कार्य का भाव देता है, पर विजय या उपलब्धि का ऐसा अर्थ नहीं जोड़ता जो पाठ में निश्चित नहीं है।
- source_word: στῆναι
  choice: दृढ़ खड़े रह सको
  rationale: सैनिक प्रसंग में केवल शारीरिक रूप से खड़ा होना नहीं, बल्कि अपना स्थान बनाए रखना अभिप्रेत है; ‘दृढ़’ इस प्रसंगगत बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘बुरे दिन’ का आशय
  choice: बुराई या आत्मिक संघर्ष का समय, जिसका संदर्भ सामान्य रखा गया है
  alternative: अंत-समय का कोई विशिष्ट दिन; अथवा व्यक्तिगत परीक्षा का एक दिन
  rationale: यूनानी पदबंध किसी तीव्र विरोध या परीक्षा के समय को समेट सकता है, पर स्वयं किसी एक काल-सिद्धान्त को अनिवार्य नहीं करता।
- issue: ‘परमेश्वर के हथियार’ में संबंधकारक का बल
  choice: ‘परमेश्वर के’ कहकर संबंध को व्यापक रखा गया है
  alternative: परमेश्वर के अपने हथियार; अथवा परमेश्वर द्वारा दिए गए हथियार
  rationale: मूल यूनानी दोनों संबंधित अर्थों की अनुमति देता है; अधिक स्पष्ट व्याख्या अनावश्यक रूप से अर्थ को संकीर्ण कर देती।
- issue: ἅπαντα κατεργασάμενοι का परिणाम
  choice: ‘सब कुछ कर चुकने के बाद’
  alternative: सब कुछ पूरा कर लेने के बाद; सब पर विजय पाने के बाद
  rationale: यह आवश्यक कार्य पूरा करने का व्यापक भाव सुरक्षित रखता है, पर निश्चित विजय का अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। सैनिक रूपक को बनाए रखा गया है। बहुवचन आदेश के लिए ‘तुम/लो’ का प्रयोग निकट और स्पष्ट है, जबकि भाषा अनौपचारिक या हल्की नहीं बनती।
