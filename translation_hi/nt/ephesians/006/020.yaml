  yaml_path: translation/nt/ephesians/006/020.yaml
  text: for which I am an ambassador in chains[a], so that in it I may speak boldly[c][b], as I ought to speak.
translation:
  language: hi
  text: जिसके लिए मैं ज़ंजीर में जकड़ा हुआ राजदूत हूँ, ताकि मैं उसमें निर्भीकता से बोल सकूँ, जैसा मुझे बोलना चाहिए।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: ‘उसमें’ का यूनानी सर्वनाम नपुंसकलिंग एकवचन है और सम्भवतः पिछले पद के ‘सुसमाचार के भेद’ अथवा सुसमाचार की ओर संकेत करता है। इसे ‘उसके संबंध में’ भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ οὗ
  choice: जिसके लिए
  rationale: οὗ नपुंसकलिंग एकवचन है और पिछले पद के “सुसमाचार के भेद” की ओर संकेत करता है; “जिसके लिए” ὑπέρ के ‘उसके निमित्त/संबंध में’ भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: πρεσβεύω
  choice: मैं ... राजदूत हूँ
  rationale: यह क्रिया अधिकृत दूत या प्रतिनिधि के रूप में कार्य करने का भाव देती है; “राजदूत” उसके औपचारिक प्रतिनिधित्व को बनाए रखता है।
- source_word: ἐν ἁλύσει
  choice: ज़ंजीर में जकड़ा हुआ
  rationale: यूनानी में “एक ज़ंजीर में” है। यह हिन्दी अभिव्यक्ति कारावास और वास्तविक बंधन, दोनों की छवि को सहज रूप में बनाए रखती है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह प्रयोजन बताने वाला संयोजक है; आधुनिक हिन्दी में “ताकि” स्पष्ट और स्वाभाविक है।
- source_word: ἐν αὐτῷ
  choice: उसके विषय में
  rationale: αὐτῷ यहाँ नपुंसकलिंग है और सम्भवतः सुसमाचार या उसके भेद की ओर लौटता है। प्रसंगगत अर्थ को हिन्दी में स्पष्ट करते हुए “उसके विषय में” व्यक्तिगत मसीही संदर्भ आरोपित नहीं करता।
- source_word: παρρησιάσωμαι
  choice: मैं निर्भीक होकर बोलूँ
  rationale: क्रिया खुलकर, साहस के साथ वाणी देने का भाव रखती है; “निर्भीक होकर बोलूँ” इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὡς δεῖ με λαλῆσαι
  choice: जैसा मुझे बोलना चाहिए
  rationale: δεῖ आवश्यकता या दायित्व व्यक्त करता है; यह अनुवाद उस अपेक्षित दायित्व को स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: οὗ और αὐτῷ का संदर्भ
  choice: दोनों को नपुंसकलिंग रूप मानकर पिछले पद के सुसमाचार अथवा “सुसमाचार के भेद” से जोड़ा गया है।
  alternative: αὐτῷ को “उसमें/उस व्यक्ति में” समझकर मसीह की ओर संकेत मानना; अथवा οὗ को अधिक व्यक्तिगत अर्थ में लेना।
  rationale: SBLGNT में दोनों सर्वनामों की रूपरचना नपुंसकलिंग एकवचन है, इसलिए पिछले पद के “सुसमाचार के भेद” की ओर संदर्भ सबसे स्वाभाविक है। अनुवाद अनावश्यक रूप से व्यक्तिगत या मसीह-केंद्रित संदर्भ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “राजदूत” आधिकारिक प्रतिनिधित्व को और “ज़ंजीर में जकड़ा हुआ” पौलुस के कारावास की ठोस छवि को सुरक्षित रखते हैं। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ में नपुंसकलिंग संदर्भ स्वाभाविक रूप से स्पष्ट किया गया है।
