source:
  edition: SBLGNT
  text: Οἱ δοῦλοι, ὑπακούετε τοῖς ⸂κατὰ σάρκα κυρίοις⸃ μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/005.yaml
  text: Servants[a], obey your masters according to the flesh with fear and trembling, in sincerity of your heart, as to Messiah[b],
translation:
  language: hi
  text: हे दासो, अपने सांसारिक स्वामियों[a] की आज्ञा भय और थरथराहट के साथ, अपने हृदय की निष्कपटता से मानो, जैसे मसीह की आज्ञा मानते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “शरीर के अनुसार स्वामी”; अर्थात वे स्वामी जिनका अधिकार केवल इस सांसारिक, मानवीय जीवन के क्षेत्र तक है।
    reason: यूनानी मुहावरे κατὰ σάρκα का शाब्दिक रूप और उसका सीमित सांसारिक/मानवीय आशय स्पष्ट करना।
lexical_decisions:
- source_word: δοῦλοι
  choice: दासो
  rationale: यह शब्द बंधुआ दासता में रहने वालों को संबोधित करता है; घरेलू व्यवस्था के इस प्रसंग में सामाजिक वास्तविकता को नरम करके केवल ‘सेवक’ कहना उचित नहीं।
- source_word: ὑπακούετε
  choice: की बात ... मानो
  rationale: वर्तमान आज्ञार्थक रूप निरंतर आज्ञापालन का आह्वान करता है; आधुनिक हिन्दी में ‘बात मानो’ स्वाभाविक और स्पष्ट है।
- source_word: κατὰ σάρκα
  choice: शरीर के अनुसार
  rationale: मूल यूनानी की ठोस अभिव्यक्ति और उसके जानबूझकर सीमित किए गए मानवीय/सांसारिक संबंध को सुरक्षित रखा गया है; अर्थ स्पष्ट करने के लिए पादटिप्पणी दी गई है।
- source_word: κυρίοις
  choice: स्वामियों
  rationale: दासता के सामाजिक संबंध में κύριος घर के स्वामी अथवा मालिक को दर्शाता है; ‘प्रभुओं’ से अगले मसीह-संदर्भ के साथ भ्रम हो सकता था।
- source_word: μετὰ φόβου καὶ τρόμου
  choice: भय और काँपते हुए
  rationale: पौलुस की प्रभावशाली युग्म-अभिव्यक्ति का भय तथा शारीरिक कंपन दोनों बनाए रखे गए हैं।
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: अपने हृदय की सच्चाई से
  rationale: ἁπλότης यहाँ निष्कपटता, एकनिष्ठता और अविभाजित मनोभाव व्यक्त करता है; ‘हृदय की सच्चाई’ सामान्य हिन्दी में सहज है।
- source_word: ὡς τῷ Χριστῷ
  choice: मानो मसीह की बात मान रहे हो
  rationale: ὡς की तुलनात्मक शक्ति को ‘मानो’ से और Χριστός के पदवीगत अर्थ को ‘मसीह’ से व्यक्त किया गया है; वाक्य को हिन्दी में स्पष्ट बनाने के लिए निहित क्रिया दोहराई गई है।
theological_decisions:
- issue: Χριστῷ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: Χριστός यहाँ अभिषिक्त जन की पदवी के रूप में प्रयुक्त है; इसलिए अर्थानुवाद ‘मसीह’ उपयुक्त है।
- issue: δοῦλοι का दासता-संदर्भ
  choice: दासो
  alternative: सेवको
  rationale: यह पद मालिकों के अधीन बंधुआ व्यक्तियों को संबोधित करता है; ‘सेवक’ उस कठोर सामाजिक स्थिति को अस्पष्ट कर सकता है।
- issue: κατὰ σάρκα की सीमा
  choice: शरीर के अनुसार
  alternative: सांसारिक/मानवीय
  rationale: शाब्दिक रूप उस संबंध की सीमित, देहगत-मानवीय प्रकृति और मसीह के प्रति संबंध के साथ निहित तनाव को सुरक्षित रखता है; पादटिप्पणी मुहावरे का आशय बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। संबोधन बहुवचन है। दासता की वास्तविकता को ‘दास’ से स्पष्ट रखा गया है और मूल के ‘शरीर के अनुसार’ मुहावरे को पादटिप्पणी सहित सुरक्षित किया गया है।
