review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies δοῦλοι as ‘दास’ and Χριστός as ‘मसीह’. However, ‘अपने शरीर के अनुसार स्वामियों’ is not idiomatic Hindi and can suggest that the masters are related to the slaves’ own bodies, rather than that their mastery belongs only to the earthly/human sphere. The comparative force of ὡς is better conveyed directly as ‘जैसे ... मानते हो’ than by a hypothetical ‘मानो ... मान रहे हो.’
  naturalness: The two short sentences are understandable, but the first has an awkward modifier and the second unnecessarily restates the command. A single sentence with ‘आज्ञा मानो’ and ‘भय और थरथराहट के साथ’ is natural, dignified modern Hindi while retaining the formal force of the Greek.
  terminology: ‘दास’ appropriately retains the enslaved social setting; ‘स्वामी’ is suitable for κύριοις in this context; and ‘मसीह’ preserves the titular sense of Χριστῷ. ‘सांसारिक’ is an idiomatic contextual rendering of κατὰ σάρκα, with a footnote preserving and explaining the Greek expression.
  issues:
  - severity: medium
    issue: ‘अपने शरीर के अनुसार स्वामियों’ is an unnatural and potentially misleading rendering of κατὰ σάρκα κυρίοις.
    rationale: The Greek qualifies the masters as masters only in the flesh/earthly-human sphere. In Hindi, ‘अपने शरीर के अनुसार’ attaches naturally to the addressed slaves and does not convey that contrast clearly.
  - severity: low
    issue: ‘मानो मसीह की बात मान रहे हो’ weakens the direct comparative construction.
    rationale: ὡς τῷ Χριστῷ means obedience rendered ‘as to the Messiah’; ‘जैसे मसीह की आज्ञा मानते हो’ is direct, clear, and preserves the comparison.
  revised_text: हे दासो, अपने सांसारिक स्वामियों[a] की आज्ञा भय और थरथराहट के साथ, अपने हृदय की निष्कपटता से मानो, जैसे मसीह की आज्ञा मानते हो।
