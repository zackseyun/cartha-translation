id: EPH.6.12
reference: Ephesians 6:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ ⸀σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: hi
  text: क्योंकि हमारा संघर्ष रक्त और मांस के विरुद्ध नहीं है[a], बल्कि शासकों के विरुद्ध, अधिकारियों के विरुद्ध, इस अंधकार के विश्व-शासकों के विरुद्ध[b], और स्वर्गीय क्षेत्रों में दुष्टता की आत्मिक शक्तियों के विरुद्ध है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्योंकि हमारी कुश्ती रक्त और मांस के विरुद्ध नहीं है।”
    reason: lexical_alternative
  - marker: b
    text: या “इस वर्तमान अंधकार के विश्व-शासकों के विरुद्ध।” मूल पाठ में “वर्तमान” निहित समझा जा सकता है, पर स्पष्ट रूप से लिखा नहीं है।
    reason: lexical_alternative
  - marker: c
    text: या “स्वर्गीय स्थानों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: लड़ाई
  rationale: यह शब्द कुश्ती या निकट संघर्ष को दर्शाता है। ‘लड़ाई’ आधुनिक हिन्दी में सहज है और व्यक्तिगत, कठिन संघर्ष का भाव बनाए रखता है; अधिक शाब्दिक ‘कुश्ती’ को पादटिप्पणी में रखा गया है।
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: खून और मांस के विरुद्ध
  rationale: यूनानी क्रम ‘खून और मांस’ है और यह देहधारी मनुष्यों के लिए मुहावरा है। हिन्दी में यह क्रम समझने योग्य है और स्रोत की अभिव्यक्ति को सुरक्षित रखता है।
- source_word: σάρκα
  choice: मांस
  rationale: यहाँ σάρξ ‘खून और मांस’ वाले मुहावरे का अंग है और मनुष्य की देहधारी अवस्था को सूचित करता है, ‘पापी स्वभाव’ को नहीं।
- source_word: ἀρχάς
  choice: शासकों
  rationale: पौलुस के इस प्रसंग में यह प्रधान शासनकारी शक्तियों को दर्शाता है। ‘शासक’ स्पष्ट और वर्तमान हिन्दी है।
- source_word: ἐξουσίας
  choice: अधिकारियों
  rationale: यह शब्द अधिकार रखने वाली या अधिकार-प्राप्त शक्तियों को दर्शाता है। ‘अधिकारी’ शासन और अधिकार का भाव बनाए रखता है।
- source_word: κοσμοκράτορας
  choice: विश्व-शासकों
  rationale: दुर्लभ संयुक्त शब्द का अर्थ संसार या विश्व पर शासन करने वाले है। ‘विश्व-शासक’ इसकी संयुक्त संरचना और व्यापक दायरे को बनाए रखता है, बिना इसे केवल मानवीय राजनीतिक शासक मान लेने के।
- source_word: τοῦ σκότους τούτου
  choice: इस अंधकार के
  rationale: यह संबंधवाचक पद विश्व-शासकों को ‘इस अंधकार’ से संबंधित या उसकी विशेषता वाला बताता है। पाठ में ‘वर्तमान’ स्पष्ट रूप से नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: दुष्टता की आत्मिक शक्तियों
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त होकर आत्मिक सत्ताओं या शक्तियों को सूचित करता है। ‘आत्मिक शक्तियाँ’ हिन्दी में अर्थ स्पष्ट करता है, जबकि ‘दुष्टता की’ मूल संबंधवाचक बनावट को बनाए रखता है।
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: स्वर्गीय क्षेत्रों में
  rationale: इफिसियों में यह आवर्ती पद स्वर्गीय क्षेत्र या परिधि को दर्शाता है। ‘स्वर्गीय क्षेत्र’ स्वाभाविक आधुनिक हिन्दी है और केवल किसी एक स्थान तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: पद में बताए गए विरोधियों का स्वरूप
  choice: शब्दावली मुख्यतः मनुष्य से परे आत्मिक शक्तियों की ओर संकेत करती है।
  alternative: ये शब्द मुख्यतः मानवीय शासकों और संस्थाओं को, या आत्मिक शक्तियों और उनकी सांसारिक अभिव्यक्तियों दोनों को समेट सकते हैं।
  rationale: κοσμοκράτορας और विशेषतः τὰ πνευματικὰ τῆς πονηρίας आत्मिक विरोधियों की ओर स्पष्ट संकेत करते हैं। फिर भी अनुवाद यह निर्णय नहीं थोपता कि उनका मानवीय संरचनाओं से कोई संबंध नहीं हो सकता।
- issue: इस प्रसंग में σάρξ का अर्थ
  choice: मुहावरे के भीतर इसे शाब्दिक ‘मांस’ रखा गया है।
  alternative: ‘पापी स्वभाव’ या अर्थ-स्पष्टकारी ‘मनुष्य’।
  rationale: यहाँ अर्थ देहधारी मनुष्य है, न कि पौलुस का ‘पापी स्वभाव’ संबंधी रूपक। मूल मुहावरे को बनाए रखने से अनुचित धर्मवैज्ञानिक अर्थ आरोपित नहीं होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। समानांतर ‘के विरुद्ध’ संरचना मूल यूनानी की लय और विरोधियों की क्रमिक सूची को सुरक्षित रखती है। ‘खून और मांस’ तथा ‘विश्व-शासक’ जैसे पद स्रोत-पाठ की विशिष्टता बनाए रखते हैं; जहाँ अधिक सहज या व्याख्यात्मक विकल्प संभव हैं, उन्हें पादटिप्पणियों में दिया गया है।
