lexical_decisions:
- source_word: τίμα
  choice: आदर करो
  rationale: आज्ञार्थक क्रिया सक्रिय रूप से सम्मान देने की माँग करती है; ‘आदर करो’ प्रचलित, स्वाभाविक और नैतिक भार को बनाए रखने वाला अनुवाद है।
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: अपने पिता और माता
  rationale: प्रत्यक्ष पारिवारिक संबोधन को सरल और स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: ἥτις ἐστὶν ἐντολὴ πρώτη
  choice: यह ... पहली आज्ञा है
  rationale: सम्बन्धवाचक सर्वनाम उद्धृत आज्ञा की ओर लौटता है; ‘पहली’ को क्रमवाचक अर्थ में रखा गया है, ‘प्रधान’ नहीं बनाया गया।
- source_word: ἐν ἐπαγγελίᾳ
  choice: प्रतिज्ञा के साथ
  rationale: शाब्दिक ‘प्रतिज्ञा में’ हिन्दी में अस्पष्ट और अस्वाभाविक होगा; प्रसंग में आशय आज्ञा के साथ जुड़ी प्रतिज्ञा है।
theological_decisions:
- issue: ‘पहली आज्ञा’ का आशय और दस आज्ञाओं की गणना
  choice: ‘प्रतिज्ञा के साथ पहली आज्ञा’
  alternative: ‘प्रतिज्ञा में पहली आज्ञा’; ‘दूसरी पटिया की पहली आज्ञा’
  rationale: मूल पाठ ‘पहली’ कहता है, पर किसी विशिष्ट सम्प्रदायगत गणना को स्पष्ट नहीं करता। मुख्य पाठ स्वाभाविक अर्थ देता है और पाद-टिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज। उद्धरण और व्याख्यात्मक खंड को दीर्घ विराम-चिह्नों से अलग किया गया है; पद अगले पद में जारी रहने के कारण अंतिम दीर्घ विराम रखा गया है।
