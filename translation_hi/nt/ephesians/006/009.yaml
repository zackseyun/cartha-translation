  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: hi
  text: और हे स्वामियो, तुम भी उनके साथ वैसा ही व्यवहार करो[a]। धमकी देना छोड़ दो[b], क्योंकि तुम जानते हो कि उनका और तुम्हारा, दोनों का स्वामी स्वर्ग में है[c], और वह किसी का पक्षपात नहीं करता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके प्रति वही करो” या “उनके साथ भी उसी तरह व्यवहार करो।” यूनानी वाक्यांश पिछले निर्देश के साथ संबंध और पारस्परिकता पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी धमकियाँ बंद कर दो।” यूनानी अभिव्यक्ति धमकी देने की प्रथा को छोड़ देने का भाव देती है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में “स्वर्गों में”; हिन्दी में इसका स्वाभाविक रूप “स्वर्ग में” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριοι
  choice: स्वामियो
  rationale: प्राचीन गृह-व्यवस्था के इस संदर्भ में यह उन मानव स्वामियों को संबोधित करता है जिनके अधीन दास थे। संबोधन रूप ‘हे स्वामियो’ सामाजिक भूमिका और प्रत्यक्ष आज्ञा दोनों को स्पष्ट रखता है।
- source_word: τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς
  choice: तुम भी उनके साथ वैसा ही व्यवहार करो
  rationale: यह स्वाभाविक हिन्दी में पिछले निर्देश से पारस्परिकता का संबंध बनाए रखता है; ‘भी’ καί और ‘वैसा ही’ τὰ αὐτά के बल को व्यक्त करते हैं।
- source_word: ἀνιέντες τὴν ἀπειλήν
  choice: धमकाना छोड़ दो
  rationale: ἀνίημι यहाँ धमकी देने की आदत को त्यागने या बंद करने का अर्थ देता है। हिन्दी में यह सीधा, वर्तमान और सहज निषेध है।
- source_word: εἰδότες
  choice: क्योंकि तुम जानते हो
  rationale: कृदन्त का कारणसूचक बल हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त होता है, बिना आज्ञा के आधार को बदले।
- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: उनका और तुम्हारा, दोनों का स्वामी
  rationale: एक ही ‘स्वामी’ दासों और मानवीय स्वामियों दोनों के ऊपर है। ‘दोनों का’ समावेशी संरचना को स्पष्ट करता है और इसी पद में मानवीय तथा स्वर्गीय अधिकार के बीच जानबूझकर रखे गए शब्द-संबंध को बनाए रखता है।
- source_word: ἐν οὐρανοῖς
  choice: स्वर्ग में
  rationale: यूनानी बहुवचन का यह स्वाभाविक हिन्दी मुहावरेदार समतुल्य है।
- source_word: προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ
  choice: वह किसी का पक्षपात नहीं करता
  rationale: शाब्दिक ‘उसके यहाँ पक्षपात नहीं है’ का अर्थ स्वाभाविक आधुनिक हिन्दी में सक्रिय वाक्य द्वारा स्पष्ट होता है और परमेश्वर की निष्पक्षता को ठीक तरह व्यक्त करता है।
theological_decisions:
- issue: मानवीय κύριοι और स्वर्गीय κύριος को हिन्दी में कैसे व्यक्त किया जाए
  choice: दोनों के लिए ‘स्वामी/स्वामियो’
  alternative: मानवीय पद के लिए ‘मालिको’ और दिव्य पद के लिए ‘प्रभु’
  rationale: यूनानी जानबूझकर एक ही शब्द-मूल दोहराकर दिखाता है कि पृथ्वी के स्वामी स्वयं स्वर्गीय स्वामी के अधीन हैं। हिन्दी में ‘स्वामी’ दोनों संदर्भों में समझ में आता है और इस अलंकारिक तथा नैतिक संबंध को सुरक्षित रखता है; ‘प्रभु’ भी संभव है, पर वह शब्द-पुनरावृत्ति को छिपा देता।
- issue: προσωπολημψία को कथनात्मक या क्रियात्मक रूप में देना
  choice: वह किसी का पक्षपात नहीं करता
  alternative: उसके यहाँ पक्षपात नहीं है
  rationale: दोनों अर्थतः संभव हैं। चुना हुआ रूप साधारण पाठक के लिए अधिक स्वाभाविक है और किसी सामाजिक दर्जे के आधार पर अनुचित पक्ष लेने के निषेध को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘हे स्वामियो’ ऐतिहासिक गृह-व्यवस्था को अनाकालिक ‘नियोक्ताओ’ में नहीं बदलता। मुख्य वाक्य में आज्ञाएँ सीधी हैं, जबकि कारणसूचक खंड उनके साझा स्वर्गीय स्वामी और उसकी निष्पक्षता पर बल देता है।
