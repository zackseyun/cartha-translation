lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: जूते के समान पहनकर
  rationale: क्रिया का मूल अर्थ पैरों में जूते या चप्पल बाँधना अथवा पहनना है। हिन्दी में रूपक स्पष्ट और स्वाभाविक रखने के लिए ‘जूते के समान पहनकर’ कहा गया है।
- source_word: τοὺς πόδας
  choice: अपने पैरों में
  rationale: मूल पाठ में प्रत्यक्ष रूप से ‘पैरों’ का उल्लेख है; ‘अपने’ हिन्दी में स्वाभाविक संबंध स्पष्ट करता है।
- source_word: ἐν
  choice: में
  rationale: यहाँ ἐν साज-सज्जा अथवा साधन का भाव देता है; ‘पैरों में ... पहनकर’ हिन्दी में कवच-रूपक को स्वाभाविक बनाता है।
- source_word: ἑτοιμασίᾳ
  choice: तत्परता
  rationale: यह शब्द तैयारी या तत्परता का भाव रखता है। ‘तत्परता’ संक्षिप्त है और यह तय नहीं करता कि आशय प्रचार के लिए तैयार रहने से है या सुसमाचार से मिलने वाली स्थिरता से।
- source_word: εὐαγγελίου
  choice: सुसमाचार
  rationale: यह पौलुस के प्रयोग के अनुरूप स्थापित और सामान्य हिन्दी धार्मिक शब्द है तथा ‘शुभ समाचार’ का अर्थ वहन करता है।
- source_word: τῆς εἰρήνης
  choice: शान्ति के
  rationale: यह संबंधकारक ‘सुसमाचार’ को विशेषित करता है—वह सुसमाचार जो शान्ति से संबंधित है या जिसकी विशेषता शान्ति है।
theological_decisions:
- issue: ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης का अर्थ
  choice: पैरों को शान्ति के सुसमाचार से जुड़ी तत्परता से सुसज्जित करना
  alternative: शान्ति का सुसमाचार सुनाने की तत्परता; अथवा शान्ति के सुसमाचार से मिलने वाला दृढ़ आधार
  rationale: यूनानी पदबंध संक्षिप्त और अर्थ की दृष्टि से खुला है। मुख्य पाठ ‘तत्परता’ और संबंधकारक शृंखला को बनाए रखता है, इसलिए वह प्रचार या दृढ़ आधार में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
