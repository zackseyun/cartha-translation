  text: καὶ μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ, ἐν ᾧ ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/030.yaml
  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: hi
  text: और परमेश्वर के पवित्र आत्मा को दुःखी न करो, जिनमें तुम छुटकारे के दिन के लिए मुहरबंद किए गए थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “छुटकारे के दिन तक” भी हो सकता है। यूनानी में शाब्दिक रूप से “छुटकारे के दिन के लिए” है, जिसमें भविष्य की ओर उन्मुख भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπεῖτε
  choice: दुःखी न करो
  rationale: μή के साथ वर्तमान आज्ञार्थक रूप निषेध व्यक्त करता है। ‘दुःखी न करो’ आत्मा के प्रति व्यक्तिगत और संबंधपरक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: परमेश्वर के पवित्र आत्मा
  rationale: यह अभिव्यक्ति यूनानी पदबंध में उपस्थित ‘परमेश्वर के’ संबंध को स्पष्ट रखते हुए हिन्दी में प्रचलित सम्मानपूर्ण नाम ‘पवित्र आत्मा’ को बनाए रखती है।
- source_word: ἐν ᾧ
  choice: जिनमें
  rationale: ἐν का मूल संबंध ‘में’ से व्यक्त होता है और ‘जिनमें’ पवित्र आत्मा के व्यक्तिगत संदर्भ का सम्मान करता है। ‘जिनके द्वारा’ संभव व्याख्या है, पर वह साधन का अर्थ अधिक स्पष्ट कर देती है।
- source_word: ἐσφραγίσθητε
  choice: मुहरबंद किए गए हो
  rationale: यह कर्मवाच्य रूप और मुहर के रूपक—स्वामित्व, प्रमाणीकरण अथवा सुरक्षा—को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: छुटकारे के दिन के लिए
  rationale: ‘के लिए’ εἰς की लक्ष्य और भविष्य की ओर उन्मुख शक्ति को बनाए रखता है। ‘छुटकारा’ ἀπολύτρωσις का सामान्य, स्पष्ट और प्रसंगानुकूल हिन्दी रूप है।
theological_decisions:
- issue: पवित्र आत्मा के लिए व्यक्तिगत संबंधवाचक प्रयोग
  choice: ‘जिनमें’
  alternative: ‘जिसमें’ अथवा ‘जिनके द्वारा’
  rationale: यूनानी πνεῦμα व्याकरणतः नपुंसकलिंग है, पर संदर्भ ऐसे व्यक्तिगत कर्ता का है जिसे दुःखी किया जा सकता है। हिन्दी का आदरसूचक बहुवचन इस व्यक्तिगत संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- issue: मुहरबंदी और छुटकारे के दिन का संबंध
  choice: ‘छुटकारे के दिन के लिए’
  alternative: ‘छुटकारे के दिन तक’
  rationale: मुख्य पाठ εἰς के लक्ष्याभिमुख अर्थ को सुरक्षित रखता है और मुहरबंदी की अवधि या किसी विशिष्ट धर्मवैज्ञानिक व्यवस्था को आवश्यकता से अधिक निश्चित नहीं करता। वैकल्पिक कालगत अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘परमेश्वर के पवित्र आत्मा’, ‘दुःखी न करो’ और ‘मुहरबंद’ जैसे परिचित बाइबलीय पद रखे गए हैं; वाक्य-संरचना को मूल यूनानी के निकट रखते हुए हिन्दी में स्वाभाविक बनाया गया है।
