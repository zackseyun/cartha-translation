id: EPH.4.13
reference: Ephesians 4:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: hi
  text: जब तक हम सब विश्वास[a] तथा परमेश्वर के पुत्र के ज्ञान[b] की एकता को प्राप्त न कर लें, एक परिपक्व मनुष्य की दशा तक न पहुँच जाएँ[c], और मसीह[e] की परिपूर्णता के कद की माप तक न पहुँच जाएँ[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वास।” यहाँ आशय कलीसिया के साझे विश्वास से हो सकता है, अथवा विश्वासियों के विश्वास से अधिक सामान्य रूप में।
    reason: alternative_reading
  - marker: b
    text: या “पूर्ण ज्ञान” अथवा “गहरा ज्ञान।”
    reason: lexical_alternative
  - marker: c
    text: यूनानी में शाब्दिक रूप से “एक परिपक्व मनुष्य तक।” पुल्लिंग एकवचन की यह छवि पूरी कलीसिया की सामूहिक परिपक्वता को दर्शाती है। इसे “परिपक्व मनुष्यत्व तक” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: “कद” के स्थान पर “परिपक्वता” भी सम्भव है।
    reason: lexical_alternative
  - marker: e
    text: 'यूनानी: “ख्रीस्त,” अर्थात “अभिषिक्त जन”; यहाँ इसे उपाधि-सूचक “मसीह” किया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: μέχρι καταντήσωμεν οἱ πάντες
  choice: जब तक हम सब … प्राप्त न कर लें / पहुँच न जाएँ
  rationale: μέχρι के लक्ष्यसूचक अर्थ और καταντήσωμεν के किसी लक्ष्य तक पहुँचने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; οἱ πάντες का समावेशी बल “हम सब” से सुरक्षित रहता है।
- source_word: εἰς τὴν ἑνότητα τῆς πίστεως
  choice: विश्वास की एकता को
  rationale: ἑνότης की सामुदायिक एकता और πίστις की जानबूझकर बनी हुई अर्थ-व्याप्ति को बनाए रखता है; सन्दर्भ में साझे विश्वास की सम्भावना प्रबल है।
- source_word: τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ
  choice: परमेश्वर के पुत्र के ज्ञान
  rationale: सम्बन्धकारक रचना और ज्ञान के विषय, अर्थात परमेश्वर के पुत्र, दोनों को सीधे सुरक्षित रखता है। “ज्ञान” ἐπίγνωσις को अनावश्यक रूप से किसी एक तीव्र अर्थ तक सीमित नहीं करता।
- source_word: εἰς ἄνδρα τέλειον
  choice: एक परिपक्व मनुष्य की दशा तक
  rationale: τέλειος के विकास-सन्दर्भ वाले “परिपक्व” अर्थ और ἀνήρ की पुल्लिंग एकवचन सामूहिक छवि को बनाए रखता है। “की दशा तक” बहुवचन कर्ता के साथ हिन्दी वाक्य को स्वाभाविक बनाता है।
- source_word: εἰς μέτρον ἡλικίας
  choice: कद की माप तक
  rationale: μέτρον की माप और ἡλικία की शारीरिक वृद्धि/कद की छवि को सुरक्षित रखता है; “परिपक्वता” सम्भव है, पर वह रूपक को अधिक अमूर्त बना देता है।
- source_word: τοῦ πληρώματος τοῦ Χριστοῦ
  choice: मसीह की परिपूर्णता
  rationale: πλήρωμα के धर्मवैज्ञानिक रूप से महत्त्वपूर्ण “परिपूर्णता” भाव को बनाए रखता है और Χριστός को यहाँ उपाधि-सूचक “मसीह” के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: τῆς πίστεως का अर्थ
  choice: साझे मसीही विश्वास की ओर संकेत करते हुए “विश्वास”
  alternative: विश्वासियों का व्यक्तिगत विश्वास या भरोसा
  rationale: निश्चित लेख और कलीसिया की सामूहिक वृद्धि का सन्दर्भ साझे विश्वास का समर्थन करते हैं, पर मुख्य पाठ “विश्वास” रखकर वास्तविक अर्थगत सम्भावना को खुला छोड़ता है।
- issue: εἰς ἄνδρα τέλειον की सामूहिक पुल्लिंग छवि
  choice: एक परिपक्व मनुष्य की दशा तक
  alternative: परिपक्व मानवता तक; सिद्ध मनुष्य तक
  rationale: यूनानी में पुल्लिंग एकवचन ἀνήρ पूरी कलीसिया की सामूहिक परिपक्वता की छवि है। इसे लिंग-निरपेक्ष बनाकर मिटाया नहीं गया, जबकि τέλειος को सन्दर्भानुसार “परिपक्व” कहा गया है, न कि नैतिक निष्पापता सूचित करने वाला “सिद्ध।”
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त; अभिषिक्त जन
  rationale: यहाँ Χριστός धर्मवैज्ञानिक उपाधि के रूप में प्रयुक्त है; हिन्दी में प्रचलित और स्वाभाविक उपाधि “मसीह” उस अर्थ को बनाए रखती है।
- issue: τοῦ πληρώματος τοῦ Χριστοῦ का सम्बन्ध
  choice: मसीह की परिपूर्णता
  alternative: मसीह से मिलने वाली परिपूर्णता; मसीह को भर देने वाली परिपूर्णता
  rationale: सम्बन्धकारक की सम्भावित सूक्ष्मताओं को व्याख्यात्मक परिभाषा से तय किए बिना मूल की संक्षिप्त रचना सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण परन्तु सहज रूप रखा गया है। “एक परिपक्व मनुष्य” और “कद की माप” जैसी मूल की वृद्धि-संबंधी छवियाँ सुरक्षित हैं। दोहराए गए εἰς को लक्ष्यसूचक “तक” से यथासम्भव प्रतिबिम्बित किया गया है; पहले पद में स्वाभाविक हिन्दी के लिए “एकता को प्राप्त” प्रयुक्त है।
