base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/008.yaml
  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: hi
  text: इसलिए ऐसा कहा गया है[a], “ऊँचाई पर चढ़कर उसने बंदियों को बंदी बनाकर ले गया[b] और लोगों को उपहार दिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्रशास्त्र कहता है।” यूनानी में “कहता है” का कर्ता स्पष्ट नहीं है।
    reason: source_ambiguity
  - marker: b
    text: 'शाब्दिक रूप से यह जानबूझकर दोहरावपूर्ण अभिव्यक्ति है: “उसने बंदी अवस्था को बंदी बनाया।” इसका अर्थ “उसने बंदियों को बंदी बनाकर ले गया” या “वह बंदियों के समूह को बंदी बनाकर ले गया” भी समझा जा सकता है। यह भजन 68:18 की भाषा की प्रतिध्वनि है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह निष्कर्षसूचक संयोजक पिछले कथन से उद्धरण का तार्किक संबंध बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: λέγει
  choice: वह कहता है
  rationale: यूनानी क्रिया वर्तमान काल में है, पर उसका कर्ता स्पष्ट नहीं है। यह रूप उस अस्पष्टता को काफी हद तक बनाए रखता है; सम्भव कर्ता पवित्रशास्त्र या परमेश्वर हो सकता है।
- source_word: Ἀναβὰς εἰς ὕψος
  choice: ऊँचे पर चढ़कर
  rationale: कृदन्त की पूर्वकालिक क्रिया और भजन 68:18 की ऊर्ध्वारोहण-संबंधी भाषा दोनों को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: बंदियों को बंदी बना लिया
  rationale: यूनानी के सजातीय क्रिया-संज्ञा प्रयोग की जानबूझकर दोहरावपूर्ण तीव्रता को बनाए रखता है, साथ ही हिन्दी में बोधगम्य रहता है।
- source_word: ἔδωκεν δόματα
  choice: वरदान दिए
  rationale: सन्दर्भ में दिए गए उपहारों के लिए ‘वरदान’ स्वाभाविक और धार्मिक रूप से तटस्थ हिन्दी है।
- source_word: τοῖς ἀνθρώποις
  choice: लोगों को
  rationale: ἄνθρωποι यहाँ सामान्य अर्थ में मनुष्यों को सूचित करता है; ‘लोगों’ से यही व्यापक अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: λέγει के अव्यक्त कर्ता की पहचान
  choice: वह कहता है
  alternative: पवित्रशास्त्र कहता है / कहा गया है
  rationale: मूल यूनानी कर्ता को स्पष्ट नहीं करता। मुख्य पाठ में ‘वह’ रखने और पादटिप्पणी में सम्भावनाएँ बताने से परमेश्वर या पवित्रशास्त्र में से किसी एक को अनावश्यक रूप से निश्चित नहीं किया जाता।
- issue: बंदियों से संबंधित भजन-संकेत की व्याख्या
  choice: बंदियों को बंदी बना लिया
  alternative: बंदी बनाए हुओं के समूह को पकड़ लिया / बंदी अवस्था को बंदी बना लिया
  rationale: यह भजन की सघन और बहुअर्थी विजय-छवि को बनाए रखता है तथा बंदियों की पहचान या घटना की धर्मवैज्ञानिक व्याख्या को समय से पहले निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। उद्धरण की काव्यात्मक पुनरुक्ति को पूरी तरह समतल करने के बजाय हिन्दी में सम्भव सीमा तक सुरक्षित रखा गया है।
