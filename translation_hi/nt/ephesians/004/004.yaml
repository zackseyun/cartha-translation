base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: hi
  text: एक ही देह है और एक ही आत्मा[a] है, जैसे तुम भी अपनी बुलाहट की एक ही आशा में बुलाए गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आत्मा’ से विश्वासियों की साझा आत्मिक दशा अभिप्रेत हो सकती है। यूनानी शब्द का अर्थ ‘आत्मा’ है; इस एकता-सूत्र के सन्दर्भ में इसका अभिप्राय सम्भवतः पवित्र आत्मा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν
  choice: एक ही
  rationale: बार-बार आए इस विशेषण का एकता पर बल हिन्दी में स्वाभाविक रूप से व्यक्त करने के लिए ‘एक ही’ चुना गया।
- source_word: σῶμα
  choice: देह
  rationale: यह मूल रूपक को बनाए रखता है और विश्वासियों के सामूहिक समुदाय की ओर संकेत को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: सन्दर्भ में सम्भवतः पवित्र आत्मा अभिप्रेत हैं; फिर भी यूनानी शब्द में बड़े-छोटे अक्षर से भेद न होने के कारण वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: καθὼς καὶ
  choice: ठीक वैसे ही जैसे ... भी
  rationale: तुलना और καί के समावेशी बल—दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκλήθητε
  choice: तुम्हें ... बुलाया गया था
  rationale: कर्मवाच्य को सुरक्षित रखता है और बुलाने वाले को मूल पाठ की तरह अनकहा छोड़ता है।
- source_word: ἐν μιᾷ ἐλπίδι
  choice: एक ही आशा में
  rationale: ἐν का निकटस्थ अर्थ ‘में’ बनाए रखते हुए एकता के दोहराए गए सूत्र को व्यक्त करता है।
- source_word: τῆς κλήσεως ὑμῶν
  choice: तुम्हारे बुलावे की
  rationale: ἐκλήθητε और κλῆσις के शब्दगत सम्बन्ध को ‘बुलाया’ और ‘बुलावा’ के द्वारा सुरक्षित रखता है।
theological_decisions:
- issue: πνεῦμα का अभिप्राय
  choice: पवित्र आत्मा की सम्भावित ओर संकेत करते हुए ‘आत्मा’
  alternative: विश्वासियों की साझा आत्मिक दशा या आत्मा
  rationale: इफिसियों 4:4–6 के ‘एक देह ... एक आत्मा ... एक प्रभु ... एक परमेश्वर और पिता’ वाले एकता-सूत्र में पवित्र आत्मा का अभिप्राय अधिक सम्भावित है। किन्तु यूनानी की वास्तविक शब्दगत अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘एक ही’ की पुनरावृत्ति मूल के एकता-बल को उभारती है; ‘बुलाया गया’ और ‘बुलावा’ मूल की शब्दगत कड़ी बनाए रखते हैं।
