source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: hi
  text: और उसी ने कुछ को प्रेरितों के रूप में, कुछ को भविष्यद्वक्ताओं के रूप में, कुछ को सुसमाचार-प्रचारकों के रूप में, और कुछ को चरवाहों[a] और शिक्षकों[b] के रूप में दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पास्टर’। यूनानी में शाब्दिक रूप से ‘चरवाहे’ है।
    reason: lexical_alternative
  - marker: b
    text: ‘चरवाहे और शिक्षक’ से पहले यूनानी में एक ही उपपद है। इससे इन भूमिकाओं के बीच विशेष निकट संबंध का संकेत मिल सकता है, पर यह आवश्यक नहीं कि दोनों को एक ही पद माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: सामान्य संयोजक के रूप में पिछले प्रसंग से पद की निरंतरता बनाए रखता है।
- source_word: αὐτὸς
  choice: उसी ने
  rationale: बलाघाती सर्वनाम का स्वाभाविक हिन्दी रूप; यह इस बात पर जोर देता है कि देने वाला वही मसीह है।
- source_word: ἔδωκεν
  choice: बनाकर दिया
  rationale: मूल अर्थ ‘दिया’ सुरक्षित है; ‘बनाकर’ हिन्दी में व्यक्तियों को विभिन्न सेवाभूमिकाओं में दिए जाने का आशय स्पष्ट करता है, बिना इसे केवल औपचारिक नियुक्ति तक सीमित किए।
- source_word: τοὺς μὲν ἀποστόλους
  choice: कुछ लोगों को प्रेरित
  rationale: μέν/δέ के साथ बार-बार आए निश्चित उपपद का वितरणात्मक भाव ‘कुछ...कुछ...’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: προφήτας
  choice: भविष्यद्वक्ता
  rationale: प्रचलित और सीधा हिन्दी समतुल्य।
- source_word: εὐαγγελιστάς
  choice: सुसमाचार-प्रचारक
  rationale: भूमिका का अर्थ सामान्य पाठक के लिए स्पष्ट रखते हुए यूनानी εὐαγγελιστής का सटीक और प्रचलित रूप देता है।
- source_word: ποιμένας
  choice: चरवाहे
  rationale: ποιμήν के मूल चरवाही-रूपक को सुरक्षित रखता है; ‘पास्टर’ अधिक पारिभाषिक और परवर्ती कलीसियाई पदनाम है।
- source_word: καὶ διδασκάλους
  choice: और शिक्षक
  rationale: दोनों संज्ञाओं को समन्वित रूप में रखता है और उनके संबंध को अनावश्यक रूप से एक ही पद या दो पूर्णतः अलग पदों के रूप में तय नहीं करता।
theological_decisions:
- issue: ποιμένας को ‘चरवाहे’ कहा जाए या पारंपरिक कलीसियाई पदनाम ‘पास्टर’
  choice: चरवाहे
  alternative: पास्टर
  rationale: मुख्य पाठ में यूनानी का वास्तविक रूपक सुरक्षित रहता है; पारंपरिक और संदर्भानुकूल विकल्प पादटिप्पणी में दिया गया है।
- issue: ‘चरवाहे और शिक्षक’ एक संयुक्त समूह/पद हैं या दो अलग भूमिकाएँ
  choice: दोनों संज्ञाओं को यथावत समन्वित रखा गया है
  alternative: ‘चरवाहे-शिक्षक’ के रूप में एक संयुक्त पद, अथवा दो स्पष्टतः पृथक समूह
  rationale: ‘चरवाहे और शिक्षक’ से पहले एक ही उपपद उनका निकट संबंध सूचित कर सकता है, पर वाक्य-विन्यास किसी एक मत को अनिवार्य नहीं बनाता; अनुवाद इस अस्पष्टता को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। ‘प्रेरित’, ‘भविष्यद्वक्ता’ और ‘सुसमाचार-प्रचारक’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। ‘उसी ने’ αὐτός का बल स्वाभाविक ढंग से व्यक्त करता है।
