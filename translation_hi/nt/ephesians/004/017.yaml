  text: Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ ⸀τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/017.yaml
  text: 'Therefore I say this and testify in the Lord: you must no longer walk as the Gentiles walk[a], in the futility of their minds,'
translation:
  language: hi
  text: 'इसलिए मैं यह कहता हूँ और प्रभु में गवाही देता हूँ: अब तुम वैसे न चलो जैसे अन्यजाति के लोग[a] अपने मन की व्यर्थता में चलते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राष्ट्र”; कुछ अनुवाद यहाँ “मूर्तिपूजक” लिखते हैं।
    reason: ἔθνη के जातीय/राष्ट्रीय अर्थ-विस्तार और संदर्भानुसार प्रयुक्त अनुवाद-विकल्प को दिखाता है, जबकि मुख्य पाठ में ‘अन्यजाति के लोग’ रखा गया है।
lexical_decisions:
- source_word: Τοῦτο οὖν λέγω
  choice: इसलिए मैं यह कहता हूँ
  rationale: οὖν पिछले उपदेश से निष्कर्षात्मक संबंध दिखाता है; ‘इसलिए’ उस संबंध को स्पष्ट रखता है और Τοῦτο को ‘यह’ के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μαρτύρομαι
  choice: दृढ़तापूर्वक गवाही देता हूँ
  rationale: यह क्रिया गंभीर व्यक्तिगत पुष्टि और साक्ष्य देने का भाव रखती है। केवल ‘गवाही देता हूँ’ हिंदी में संदर्भगत आग्रह को कुछ कमजोर कर सकता था, इसलिए ‘दृढ़तापूर्वक’ गंभीरता को व्यक्त करता है, बिना इसे मात्र ‘आग्रह करता हूँ’ बना देने के।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: मूल पदबंध को निकटता से सुरक्षित रखता है और उस क्षेत्र अथवा अधिकार को खुला रहने देता है जिसमें पौलुस बोलता है।
- source_word: μηκέτι ὑμᾶς περιπατεῖν
  choice: अब तुम ... चाल-चलन न चलो
  rationale: μηκέτι पूर्व व्यवहार के बंद होने का अर्थ देता है। हिंदी निषेधात्मक आज्ञार्थ exhortational infinitive का स्वाभाविक और पर्याप्त रूप है; ‘अवश्य’ जोड़ना आवश्यक नहीं।
- source_word: καθὼς καὶ τὰ ἔθνη
  choice: जैसा अन्यजाति के लोग
  rationale: ἔθνη यहाँ पौलुसी यहूदी–गैर-यहूदी श्रेणी को सूचित करता है। ‘अन्यजाति के लोग’ ‘राष्ट्रों’ से अधिक संदर्भानुकूल और ‘मूर्तिपूजक’ से कम व्याख्यात्मक है।
- source_word: περιπατεῖν / περιπατεῖ
  choice: चाल-चलन चलो / चलते हैं
  rationale: दोनों रूपों में एक ही नैतिक ‘चलने’ के रूपक को बनाए रखा गया है। ‘चाल-चलन चलना’ थोड़ा साहित्यिक होते हुए भी सामान्य हिंदी में बोधगम्य है और केवल ‘जीना’ कहने की अपेक्षा मूल रूपक को बचाता है।
- source_word: ἐν ματαιότητι τοῦ νοὸς αὐτῶν
  choice: अपने मन की व्यर्थता में
  rationale: ματαιότης का अर्थ निष्फलता, खोखलापन अथवा व्यर्थता है; ‘व्यर्थता’ नैतिक-बौद्धिक संदर्भ को संक्षेप में व्यक्त करती है। νοῦς के लिए ‘मन’ सीधा और स्वाभाविक हिंदी विकल्प है तथा अगले पद की διάνοια से अनावश्यक समानता नहीं बनाता।
theological_decisions:
- issue: मुख्यतः अन्यजातीय पृष्ठभूमि वाली कलीसिया को संबोधित नैतिक तुलना में ἔθνη का अर्थ
  choice: अन्यजाति के लोग
  alternative: राष्ट्रों के लोग; मूर्तिपूजक
  rationale: यह पौलुस की जातीय और वाचागत श्रेणी को सुरक्षित रखता है, पर ‘मूर्तिपूजक’ जैसा अधिक निंदात्मक धार्मिक अर्थ नहीं जोड़ता। संदर्भ पुराने अन्यजातीय जीवन-ढंग और प्रभु में नए जीवन का विरोध करता है।
- issue: λέγω καὶ μαρτύρομαι के बाद περιπατεῖν का उपदेशात्मक बल
  choice: अब तुम ... न चलो
  alternative: कि तुम अब ... नहीं चलते; तुम्हें अब ... नहीं चलना चाहिए
  rationale: हिंदी में सीधा निषेधात्मक आज्ञार्थ प्रेरित के नैतिक आग्रह को स्वाभाविक रूप से व्यक्त करता है और मूल वाक्य की गंभीरता बनाए रखता है, बिना अलग से बाध्यता की कोई धर्मवैज्ञानिक श्रेणी जोड़ने के।
- issue: ἐν κυρίῳ में संबंध का प्रकार
  choice: प्रभु में
  alternative: प्रभु के अधिकार से; प्रभु के सामने
  rationale: शाब्दिक पदबंध मूल की संभावित क्षेत्रगत और अधिकारगत दोनों छायाओं को खुला रखता है; किसी एक को चुपचाप निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘प्रभु में’ और ‘मन की व्यर्थता’ मूल की संक्षिप्तता तथा धर्मवैज्ञानिक तनाव को सुरक्षित रखते हैं। दोहराए गए περιπατέω-रूपक के लिए ‘चाल-चलन चलना’ चुना गया है; स्पष्टता के लिए दूसरे खंड में कर्ता और क्रिया को फिर व्यक्त किया गया है।
