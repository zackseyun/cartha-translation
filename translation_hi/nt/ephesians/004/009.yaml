  text: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ ⸀κατέβη εἰς τὰ κατώτερα μέρη τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: hi
  text: “वह ऊपर चढ़ा”—का क्या अर्थ है, सिवाय इसके कि वह पृथ्वी के निचले भागों में भी उतरा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निचले क्षेत्रों में, अर्थात् पृथ्वी पर”; यह वाक्यांश केवल पृथ्वी पर उतरने या अधिक विशेष रूप से मृतकों के लोक में उतरने की ओर संकेत कर सकता है।
    reason: मूल यूनानी वाक्यांश की व्याकरणिक और अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: Ἀνέβη
  choice: वह ऊपर चढ़ गया
  rationale: यह ἀναβαίνω की ऊर्ध्वगामी छवि को बनाए रखता है और पद 8 के उद्धरण की प्रतिध्वनि को स्पष्ट करता है; ‘ऊपर चढ़ गया’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τί ἐστιν εἰ μὴ ὅτι
  choice: इसका क्या अर्थ है, यदि यह नहीं कि
  rationale: यह यूनानी प्रश्न की निष्कर्षात्मक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसके तर्क को अधिक स्पष्ट करके मूल से आगे बढ़े।
- source_word: καὶ κατέβη
  choice: उतरा भी था
  rationale: ‘भी’ καί के योगात्मक बल को सुरक्षित रखता है और ऊपर चढ़ने तथा उतरने का विरोध स्पष्ट करता है। हिन्दी में ‘था’ प्रसंग के अनुसार आरोहण से पहले हुए अवरोह को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς
  choice: में
  rationale: ‘में’ किसी क्षेत्र के भीतर जाने की दिशा व्यक्त करता है और εἰς के गतिसूचक अर्थ के अनुकूल है।
- source_word: τὰ κατώτερα μέρη
  choice: निचले भागों
  rationale: ‘निचले’ तुलनात्मक अर्थ और ‘भागों’ μέρη की खुली, अनिर्णीत अभिव्यक्ति को बनाए रखते हैं; इसे सीधे अधोलोक नहीं बनाया गया है।
- source_word: τῆς γῆς
  choice: पृथ्वी के
  rationale: यह γῆ के व्यापक अर्थ को व्यक्त करता है और संबंधवाचक रचना की उस अस्पष्टता को बनाए रखता है जिसमें अर्थ ‘पृथ्वी के निचले भाग’ अथवा ‘निचले क्षेत्र, अर्थात् पृथ्वी’ हो सकता है।
theological_decisions:
- issue: εἰς τὰ κατώτερα μέρη τῆς γῆς का आशय
  choice: मुख्य पाठ में ‘पृथ्वी के निचले भागों में’ रखकर वाक्यांश को खुला छोड़ा गया है।
  alternative: ‘निचले क्षेत्रों में, अर्थात् पृथ्वी पर’ अथवा विशेष रूप से ‘मृतकों के लोक में’।
  rationale: यूनानी व्याकरण पृथ्वी को निचले क्षेत्रों की व्याख्या मानने और पृथ्वी के भीतर के निचले भागों का संकेत मानने—दोनों की गुंजाइश देता है। इसलिए मुख्य पाठ किसी विशिष्ट सिद्धान्त को निर्णायक नहीं बनाता और प्रमुख विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। उद्धृत शब्दों को स्पष्ट दिखाने के लिए हिन्दी उद्धरण-चिह्न और डैश का प्रयोग किया गया है। किसी सांप्रदायिक व्याख्या को मुख्य पाठ में नहीं जोड़ा गया।
