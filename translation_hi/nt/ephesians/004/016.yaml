source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: hi
  text: उसी से सारी देह, हर सहारा पहुँचाने वाले जोड़ के द्वारा जुड़ी हुई और एक साथ बँधी हुई, प्रत्येक अंग की अपने माप के अनुसार कार्यशीलता के अनुरूप अपनी वृद्धि करती है, ताकि प्रेम में अपने निर्माण के लिए बढ़े।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “हर सहारा पहुँचाने वाले जोड़” का अनुवाद “हर आपूर्ति करने वाले जोड़,” “हर सहारा देने वाले बंधन,” या “हर उस संपर्क के द्वारा जो आवश्यक सहायता देता है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ οὗ
  choice: उसी से
  rationale: पिछले पद में निकटतम संदर्भ मसीह है; यह प्रयोग उन्हें देह के जीवन और बढ़ोतरी के व्यक्तिगत स्रोत के रूप में रखता है।
- source_word: πᾶν τὸ σῶμα
  choice: सारी देह
  rationale: एकवचन सामूहिक अभिव्यक्ति का स्वाभाविक हिन्दी रूप, जिसमें सम्पूर्ण देह का भाव बना रहता है।
- source_word: συναρμολογούμενον καὶ συμβιβαζόμενον
  choice: ठीक-ठीक जुड़कर और एक साथ बँधकर
  rationale: पहला शब्द अंगों के सुव्यवस्थित रीति से जोड़े जाने और दूसरा उनकी एकता व दृढ़ सम्बद्धता को व्यक्त करता है। हिन्दी में कर्मवाच्य का भाव संयुक्त कृदन्तों से स्वाभाविक रूप में व्यक्त हुआ है।
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: हर सहारा देने वाले जोड़ के द्वारा
  rationale: ἁφή के शारीरिक जोड़/सम्पर्क और ἐπιχορηγία के सहायता या आपूर्ति देने के दोनों भावों को रखते हुए देह का रूपक स्पष्ट रखा गया है।
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: प्रत्येक अंग के अपने माप के अनुसार काम करने से
  rationale: वाक्यांश हर अंग की मापानुकूल सक्रियता बताता है। 'अपने माप के अनुसार' न तो 'उचित' जैसी व्याख्या जोड़ता है, न अस्वाभाविक शब्दशः हिन्दी बनाता है।
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: अपनी बढ़ोतरी करती है
  rationale: मध्यवाच्य और आत्मवाचक प्रवाह के अनुसार देह अपनी वृद्धि का सक्रिय साधन है; यह हिन्दी में 'देह की बढ़ोतरी उत्पन्न करती है' से अधिक स्वाभाविक है।
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ
  choice: ताकि वह ... स्वयं को बनाए
  rationale: οἰκοδομή के निर्माण और उन्नति के रूपक तथा ἑαυτοῦ के आत्मवाचक बल को सुरक्षित रखता है।
- source_word: ἐν ἀγάπῃ
  choice: प्रेम में
  rationale: ἀγάπη का सीधा, स्वाभाविक और प्रसंगानुकूल हिन्दी रूप।
theological_decisions:
- issue: कलीसिया की बढ़ोतरी का स्रोत और माध्यम
  choice: मसीह को स्रोत ('उसी से') और सारी देह के प्रत्येक अंग की मापानुकूल सक्रियता को माध्यम—दोनों रूपों में रखा गया है।
  alternative: सम्बन्धवाचक को निर्वैयक्तिक 'जिससे' मानना, अथवा बढ़ोतरी का श्रेय लगभग केवल जोड़ या अंगों को देना।
  rationale: पद 15 का संदर्भ मसीह को सम्बन्धवाचक का व्यक्तिगत पूर्वपद ठहराता है, जबकि पद 16 प्रत्येक अंग की वास्तविक भूमिका भी स्पष्ट करता है; अनुवाद दोनों के बीच का तनाव बनाए रखता है।
- issue: ἁφῆς τῆς ἐπιχορηγίας में देह का रूपक
  choice: '''सहारा देने वाले जोड़'' द्वारा शारीरिक रूपक और सहायता/आपूर्ति का भाव रखा गया है।'
  alternative: '''आपूर्ति की नस/स्नायु'' या अमूर्त ''सम्बन्ध जो आपूर्ति करता है''।'
  rationale: यूनानी अभिव्यक्ति जोड़, सम्पर्क, सहारा और आपूर्ति के अर्थक्षेत्रों को छूती है। चुना हुआ रूप अनावश्यक शारीरिक अति-सटीकता से बचते हुए मूर्त रूपक रखता है।
- issue: देह की आत्मवृद्धि और आत्मनिर्माण
  choice: '''अपनी बढ़ोतरी करती है'' और ''स्वयं को बनाए'' से देह की सहभागी सक्रियता व्यक्त की गई है, पर आरम्भिक ''उसी से'' इसे मसीह से स्वतंत्र नहीं होने देता।'
  alternative: सिर्फ मसीह को व्याकरणिक कर्ता बनाकर देह की सक्रिय सहभागिता मिटा देना, अथवा देह को स्वतंत्र स्रोत समझना।
  rationale: यूनानी वाक्य में देह मुख्य कर्ता है, पर वह मसीह 'से' जुड़ी और उन्हीं से उद्भूत है; दोनों पहलू सुरक्षित रहने चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण स्तर रखा गया है। लम्बे यूनानी वाक्य की तर्क-श्रृंखला बनाए रखते हुए हिन्दी में कृदन्तों और उद्देश्यवाचक उपवाक्य का प्रयोग किया गया है। 'अंग' सामान्य पाठक के लिए 'भाग' से अधिक स्पष्ट रूप से देह के रूपक को बनाए रखता है।
