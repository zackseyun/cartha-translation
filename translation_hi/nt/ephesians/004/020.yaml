  text: But you did not learn Messiah in this way,[a]
translation:
  language: hi
  text: पर तुमने मसीह को इस तरह नहीं सीखा,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर तुमने ख्रीष्ट को इस तरह नहीं सीखा।”
    reason: Χριστός का वैकल्पिक, परंपरागत हिन्दी रूप दिया गया है; मुख्य पाठ में उसके पदवी-संबंधी अर्थ के लिए ‘मसीह’ रखा गया है।
lexical_decisions:
- source_word: ὑμεῖς
  choice: तुमने
  rationale: द्वितीय पुरुष बहुवचन को स्वाभाविक आधुनिक हिन्दी में रखा गया है; स्पष्ट सर्वनाम और ‘पर’ मिलकर पूर्ववर्ती लोगों से विरोध को उभारते हैं।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले पदों में वर्णित अन्यजातियों के आचरण के साथ स्पष्ट विरोध व्यक्त करता है।
- source_word: οὐχ οὕτως
  choice: इस तरह नहीं
  rationale: οὕτως रीति या ढंग की ओर संकेत करता है; यह अनुवाद पिछले वर्णित जीवन-ढंग से विरोध को सहज हिन्दी में बनाए रखता है।
- source_word: ἐμάθετε
  choice: सीखा
  rationale: क्रिया μανθάνω का सीधा अर्थ ‘सीखना’ है। ‘तुम्हें सिखाया गया’ कहने से निष्क्रिय भाव आ जाता, जो यहाँ यूनानी में नहीं है और अगले पद में अधिक स्पष्ट होता है।
- source_word: τὸν Χριστόν
  choice: मसीह को
  rationale: Χριστός के मसीही पदवी-संबंधी अर्थ को ‘मसीह’ व्यक्त करता है। व्यक्ति को ‘सीखने’ की पौलुस की असामान्य अभिव्यक्ति को व्याख्यात्मक विस्तार किए बिना सुरक्षित रखा गया है।
theological_decisions:
- issue: Χριστόν को पदवी-सूचक ‘मसीह’ या प्रचलित ‘ख्रीष्ट’ के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ Χριστός उस व्यक्ति को मसीही पदवी के साथ प्रस्तुत करता है जिसे विश्वासियों ने सुसमाचार में सीखा। यूनानी में न आए ‘यीशु’ को जोड़ने से बचते हुए ‘मसीह’ मूल पदवी का अर्थ स्पष्ट रखता है।
- issue: ‘मसीह को सीखना’ जैसी असामान्य संरचना
  choice: मसीह को इस तरह नहीं सीखा
  alternative: मसीह के विषय में ऐसी शिक्षा नहीं पाई
  rationale: सीधे कर्म के रूप में τὸν Χριστόν को बनाए रखने से व्यक्ति, उसके विषय की शिक्षा और उसके साथ संबंध के बीच मूल की अर्थपूर्ण कसावट व तनाव सुरक्षित रहते हैं; वैकल्पिक भावार्थ इसे केवल विषय-वस्तु की शिक्षा बना देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘मसीह को सीखना’ सामान्य हिन्दी में कुछ असामान्य है, पर मूल यूनानी की जानबूझकर असामान्य और धर्मवैचारिक रूप से महत्वपूर्ण अभिव्यक्ति को सुरक्षित रखने के लिए इसे रखा गया है।
