    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: आग्रह करता हूँ
  rationale: यह पद एक प्रबल किंतु पासबानी अपील व्यक्त करता है; ‘आग्रह करता हूँ’ आधुनिक हिन्दी में इसके प्रोत्साहन और अनुरोध—दोनों पक्षों को स्वाभाविक रूप से रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले विवेचन से निकले व्यावहारिक निष्कर्ष को स्पष्ट रूप से जोड़ता है।
- source_word: δέσμιος
  choice: कैदी
  rationale: ‘कैदी’ δέσμιος का सीधा, स्पष्ट और प्रचलित हिन्दी समतुल्य है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यूनानी पूर्वसर्गीय वाक्यांश को औपचारिक रूप से बनाए रखने से पौलुस की विशिष्ट धर्मवैज्ञानिक अभिव्यक्ति और उसकी अर्थगत व्यापकता सुरक्षित रहती है।
- source_word: ἀξίως
  choice: के योग्य
  rationale: यह ऐसे आचरण को दर्शाता है जो मिली हुई बुलाहट के अनुरूप हो; हिन्दी में ‘उसके योग्य’ स्वाभाविक और सटीक है।
- source_word: περιπατῆσαι
  choice: चाल चलो
  rationale: यह पौलुस के जीवन-आचरण संबंधी ‘चलने’ के रूपक को सुरक्षित रखता है; फुटनोट में अधिक स्पष्ट अर्थ दिया गया है।
- source_word: κλήσεως
  choice: बुलाहट
  rationale: यह परमेश्वर के बुलाने और उससे प्राप्त स्थिति, दोनों से संबंध बनाए रखता है तथा हिन्दी बाइबलीय प्रयोग में समझने योग्य है।
- source_word: ἧς ἐκλήθητε
  choice: जिस बुलाहट से तुम बुलाए गए हो
  rationale: यह यूनानी में संज्ञा और उसी मूल की क्रिया की पुनरावृत्ति को बनाए रखता है; ‘से’ बुलाने के माध्यम या बुलाहट मिलने की धारणा व्यक्त करता है, जबकि वैकल्पिक स्वाभाविक हिन्दी फुटनोट में दी गई है।
theological_decisions:
- issue: ὁ δέσμιος ἐν κυρίῳ में पौलुस के आत्म-वर्णन का संबंध
  choice: जो प्रभु में कैदी हूँ
  alternative: प्रभु का कैदी; प्रभु के लिए कैदी
  rationale: ‘प्रभु में’ यूनानी वाक्यांश को बिना स्वामित्व या कारण में सीमित किए सुरक्षित रखता है। इससे पौलुस की कैद का प्रभु से संबंध बना रहता है, पर उसका सटीक प्रकार अनावश्यक रूप से तय नहीं किया जाता।
- issue: περιπατέω का जीवन-आचरण संबंधी रूपक
  choice: चाल चलो
  alternative: जीवन बिताओ; आचरण करो
  rationale: रूपक को मुख्य पाठ में रखने से पौलुस की भाषा संरक्षित रहती है; फुटनोट साधारण पाठक के लिए इसका आशय स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और पासबानी स्वर रखा गया है। ‘प्रभु में’ और ‘चाल चलो’ जैसे पौलुसी मुहावरों को मुख्य पाठ में सुरक्षित रखते हुए फुटनोटों से उनके वैकल्पिक या स्पष्ट अर्थ दिए गए हैं।
