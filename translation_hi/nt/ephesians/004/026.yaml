lexical_decisions:
- source_word: ὀργίζεσθε
  choice: क्रोध करो
  rationale: यूनानी में यह आज्ञार्थक रूप है। यह अनुवाद उसकी स्पष्ट आज्ञार्थक शक्ति और भजन 4:4 (एलXX 4:5) की संभावित प्रतिध्वनि को बनाए रखता है; संदर्भ में इसे रियायती अर्थ में समझना भी संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: μὴ ἁμαρτάνετε
  choice: पर पाप मत करो
  rationale: यह निषेधात्मक आज्ञा का स्वाभाविक हिन्दी रूप है। καί को यहाँ ‘पर’ कहना दोनों आज्ञाओं के बीच निहित नैतिक तनाव को स्पष्ट करता है, बिना मूल आशय को बदलने के।
- source_word: ὁ ἥλιος μὴ ἐπιδυέτω
  choice: सूर्य अस्त न हो
  rationale: तीसरे पुरुष की निषेधात्मक आज्ञा को संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: तुम्हारे क्रोध पर
  rationale: παροργισμός क्रोध, चिढ़ या उकसावे से उत्पन्न रोष की अवस्था को सूचित कर सकता है। ‘क्रोध’ इस संदर्भ में सबसे स्पष्ट और स्वाभाविक है तथा आरंभिक क्रिया से संबंध बनाए रखता है।
theological_decisions:
- issue: क्या आरंभिक वाक्यांश क्रोध करने की आज्ञा है या रियायती कथन
  choice: 'आज्ञार्थक रूप: ‘क्रोध करो’'
  alternative: 'रियायती रूप: ‘यदि तुम्हें क्रोध आए’'
  rationale: यूनानी क्रिया व्याकरणतः आज्ञार्थक है। मुख्य पाठ में इसे बनाए रखने से मूल का तनाव सुरक्षित रहता है; इसके तुरंत बाद पाप न करने की मनाही क्रोध को नैतिक सीमा में रखती है। रियायती समझ पादटिप्पणी में दी गई है।
- issue: παροργισμός का अर्थ
  choice: क्रोध
  alternative: चिढ़, रोष, या उकसावे की अवस्था
  rationale: शब्द की अर्थ-सीमा को स्वीकारते हुए मुख्य पाठ में सबसे स्वाभाविक संदर्भगत अर्थ चुना गया है और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सीधी और गरिमापूर्ण शैली रखी गई है। ‘क्रोध करो’ मूल आज्ञार्थक रूप की असुविधाजनक किंतु महत्वपूर्ण धार्मिक-नैतिक तनातनी को सुरक्षित रखता है; वैकल्पिक रियायती अर्थ पादटिप्पणी में स्पष्ट है।
