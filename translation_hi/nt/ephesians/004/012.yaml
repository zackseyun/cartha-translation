    text: या ‘सेवकाई के कार्य के लिए।’ यूनानी διακονία का अर्थ ‘सेवा’ या ‘सेवकाई’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘ख़्रीस्त की देह की उन्नति के लिए।’ यूनानी Χριστός यहाँ उपाधि है; मुख्य पाठ में इसे ‘मसीह’ कहा गया है।
    reason: alternative_reading
