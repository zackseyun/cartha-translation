    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: तैयार करने के लिए
  rationale: καταρτισμός का अर्थ किसी को योग्य, सक्षम या सुसज्जित बनाना है। ‘तैयार करने’ से यह भाव सहज और वर्तमान मानक हिन्दी में स्पष्ट रहता है।
- source_word: τῶν ἁγίων
  choice: पवित्र लोगों को
  rationale: यह पौलुस द्वारा परमेश्वर के लिए अलग किए गए विश्वासियों के लिए प्रयुक्त सामूहिक पद है। ‘पवित्र लोगों’ से बाद की औपचारिक संत-घोषणा का अर्थ नहीं जुड़ता।
- source_word: εἰς ἔργον διακονίας
  choice: सेवा के काम के लिए
  rationale: διακονία सेवा अथवा सेवकाई, दोनों को व्यक्त कर सकता है। ‘सेवा के काम’ सामान्य पाठक के लिए स्वाभाविक है और इसे केवल धर्मगुरुओं के कार्य तक सीमित नहीं करता।
- source_word: εἰς οἰκοδομὴν
  choice: निर्माण के लिए
  rationale: οἰκοδομή में इमारत बनाने का रूपक है, जिसका आशय समुदाय को दृढ़ और विकसित करना है। ‘निर्माण’ उस रूपक को बनाए रखता है।
- source_word: τοῦ σώματος τοῦ Χριστοῦ
  choice: मसीह की देह
  rationale: σῶμα समुदाय के लिए प्रयुक्त देह का रूपक है। Χριστός यहाँ उपाधि के रूप में है, इसलिए ‘मसीह’ चुना गया है।
theological_decisions:
- issue: तीन उद्देश्य-सूचक पदबंधों का परस्पर वाक्यगत संबंध
  choice: 'तीनों पदबंधों को समानांतर रखा गया है: पवित्र लोगों को तैयार करना, सेवा का काम, और मसीह की देह का निर्माण।'
  alternative: 'इसे क्रमिक रूप में समझा जा सकता है: पवित्र लोगों को सेवा के काम के लिए तैयार करना, ताकि मसीह की देह का निर्माण हो।'
  rationale: यूनानी क्रम πρός ... εἰς ... εἰς समानांतर उद्देश्यों अथवा क्रमिक प्रक्रिया, दोनों की अनुमति देता है। मुख्य पाठ यूनानी संरचना को निकटता से बनाए रखता है और वैकल्पिक समझ को टिप्पणी में सुरक्षित रखता है।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख़्रीस्त
  rationale: यहाँ Χριστός नाम मात्र नहीं, अभिषिक्त जन की उपाधि के रूप में प्रयुक्त है; ‘मसीह’ हिन्दी में इस उपाधिगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सेवकाई’ जैसे कलीसियाई पारिभाषिक शब्द के स्थान पर मुख्य पाठ में ‘सेवा’ रखा गया है, जबकि रूपकात्मक ‘देह’ और ‘निर्माण’ को मूल की छवि बनाए रखने के लिए सुरक्षित रखा गया है।
