lexical_decisions:
- source_word: μηδὲ
  choice: और ... मत
  rationale: यह संयोजक पिछले उपदेश को आगे बढ़ाता है; हिन्दी में निषेधात्मक आज्ञा के साथ “और ... मत” स्वाभाविक है।
- source_word: δίδοτε
  choice: दो
  rationale: δίδωμι का सीधा अर्थ “देना” है; हिन्दी की अभिव्यक्ति “अवसर देना” मूल क्रिया को बनाए रखती है।
- source_word: τόπον
  choice: अवसर
  rationale: शाब्दिक अर्थ “स्थान” है, पर इस प्रयोग में किसी को कार्य करने की गुंजाइश या मौका देना अभिप्रेत है। “अवसर” आधुनिक हिन्दी में यह अर्थ स्पष्ट करता है, जबकि “पाँव जमाने का मौका” जैसी व्याख्यात्मक छवि नहीं जोड़ता।
- source_word: τῷ διαβόλῳ
  choice: शैतान को
  rationale: यहाँ साभिप्राय पद व्यक्तिगत दुष्ट विरोधी का संकेत करता है; हिन्दी बाइबलीय और सामान्य प्रयोग में “शैतान” स्वाभाविक तथा स्पष्ट है।
theological_decisions:
- issue: διάβολος को सामान्य संज्ञा “निन्दक” माना जाए या व्यक्तिगत दुष्ट सत्ता का नाम
  choice: शैतान
  alternative: निन्दक
  rationale: इस पौलुसी उपदेश के संदर्भ में यह पद किसी मानवीय निन्दक के बजाय व्यक्तिगत विरोधी को सूचित करता है; “शैतान” पाठ का संभावित संदर्भ स्पष्ट करता है, बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
translation_notes:
  register: संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिन्दी। “अवसर देना” मूल के शाब्दिक “स्थान देना” का अर्थगत बल स्वाभाविक हिन्दी में व्यक्त करता है।
