lexical_decisions:
- source_word: ἐσκοτωμένοι τῇ διανοίᾳ ὄντες
  choice: अपनी समझ में अन्धकारमय हो गए हैं
  rationale: पूर्ण निष्क्रिय कृदन्त से उत्पन्न वर्तमान दशा व्यक्त होती है। यह रूप अन्धकारमय होने के परिणाम और समझ के क्षेत्र—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀπηλλοτριωμένοι
  choice: अलग हो गए हैं
  rationale: यह पूर्ण निष्क्रिय कृदन्त अलगाव की बनी हुई दशा बताता है। ‘अलग हो गए हैं’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल कानूनी बहिष्कार तक सीमित नहीं करता।
- source_word: τῆς ζωῆς τοῦ θεοῦ
  choice: परमेश्वर के जीवन से
  rationale: सम्बन्धकारक रचना को निकटता से रखा गया है, ताकि यह अस्पष्टता बनी रहे कि आशय परमेश्वर का अपना जीवन है या परमेश्वर से मिलने वाला जीवन।
- source_word: διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς
  choice: उस अज्ञान के कारण जो उनमें है
  rationale: διά के कारणसूचक अर्थ और अज्ञान के उनके भीतर विद्यमान होने—दोनों को स्पष्ट और सीधे रूप में रखा गया है।
- source_word: διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν
  choice: अपने हृदयों की कठोरता के कारण
  rationale: πώρωσις के कठोरता/संवेदनहीनता वाले रूपक को ‘कठोरता’ से सुरक्षित रखा गया है। बहुवचन समूह के लिए हिन्दी में ‘हृदयों’ स्वाभाविक है, जबकि पादटिप्पणी यूनानी के एकवचन रूप को दर्ज करती है।
theological_decisions:
- issue: ‘परमेश्वर के जीवन’ का अर्थ
  choice: सम्बन्धकारक को ‘परमेश्वर के जीवन’ के रूप में खुला रखा गया है।
  alternative: ‘परमेश्वर से मिलने वाले जीवन’ या ‘परमेश्वर के अपने जीवन’
  rationale: यूनानी पदबंध दोनों निकट अर्थों की सम्भावना रखता है; मुख्य पाठ में किसी एक को निश्चित करना मूल की वास्तविक अस्पष्टता को मिटा देता।
- issue: एकवचन ‘हृदय’ और बहुवचन व्यक्तियों का सम्बन्ध
  choice: स्वाभाविक हिन्दी में ‘अपने हृदयों’
  alternative: ‘अपने हृदय की’
  rationale: यूनानी में संज्ञा एकवचन और सम्बन्धसूचक सर्वनाम बहुवचन है। हिन्दी में बहुवचन लोगों के लिए ‘हृदयों’ अधिक सहज है; मूल रूप की जानकारी पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य को हिन्दी के स्वाभाविक क्रम में रखते हुए दोनों कारणसूचक पदबंधों और मूल की अर्थगत अस्पष्टताओं को सुरक्षित रखा गया है।
