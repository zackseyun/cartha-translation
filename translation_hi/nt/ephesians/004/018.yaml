  text: उनकी समझ अंधकारमय कर दी गई है[a], और वे उस अज्ञान के कारण जो उनमें है, तथा अपने हृदयों की कठोरता[d][e] के कारण परमेश्वर के जीवन[c] से अलग किए गए हैं[b]।
