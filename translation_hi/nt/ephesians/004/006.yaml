id: EPH.4.6
reference: Ephesians 4:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἷς θεὸς καὶ πατὴρ πάντων, ὁ ἐπὶ πάντων καὶ διὰ πάντων καὶ ἐν ⸀πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/006.yaml
  text: one God and Father of all[b][a], who is over all and through all and in all.
translation:
  language: hi
  text: एक ही परमेश्वर और सबका पिता है,[a] जो सबके ऊपर, सबके द्वारा और सबमें है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सब लोगों का” अथवा “सब वस्तुओं का”; इस पद में बार-बार आए “सब” के साथ यूनानी में कोई स्पष्ट संज्ञा नहीं दी गई है।
    reason: lexical_alternative
  - marker: b
    text: या “सब लोगों में।” कुछ पांडुलिपियों में “तुम सबमें” है।
    reason: textual_variant
lexical_decisions:
- source_word: εἷς
  choice: एक ही
  rationale: ‘ही’ यूनानी के बलाघाती ‘एक’ को स्वाभाविक हिन्दी में व्यक्त करता है और आसपास की एकता-विषयक शृंखला से मेल रखता है।
- source_word: θεὸς καὶ πατὴρ
  choice: परमेश्वर और ... पिता
  rationale: θεός के लिए मानक ‘परमेश्वर’ और πατήρ के लिए व्यक्तिगत, संबंधपरक दिव्य पदवी ‘पिता’ रखी गई है।
- source_word: πάντων
  choice: सबका / सबके
  rationale: यूनानी में कोई स्पष्ट संज्ञा नहीं है; ‘सब’ व्यक्ति और वस्तु—दोनों की सम्भावित व्यापकता को बिना अनावश्यक रूप से सीमित किए बनाए रखता है। कारक के अनुसार हिन्दी रूप बदला गया है।
- source_word: ὁ ἐπὶ πάντων
  choice: जो सबके ऊपर
  rationale: ἐπί के साथ संबंधकारक यहाँ सर्वोच्चता या प्रभुता का भाव देता है; ‘ऊपर’ संक्षिप्त समानांतरता बनाए रखता है।
- source_word: διὰ πάντων
  choice: सबके द्वारा
  rationale: διά के साथ संबंधकारक माध्यम या अभिकरण दर्शाता है। ‘द्वारा’ मूल की संक्षिप्तता बचाता है और ‘कार्य करता है’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἐν πᾶσιν
  choice: सबमें
  rationale: ἐν के स्थानगत अर्थ और त्रिक समानांतरता को स्वाभाविक हिन्दी में सुरक्षित रखता है; निहित संज्ञा को स्पष्ट करके दायरा संकरा नहीं किया गया।
theological_decisions:
- issue: πάντων / πᾶσιν की बार-बार आने वाली व्यापकता
  choice: मुख्य पाठ में ‘सब’ रखा गया है, बिना यह निश्चित किए कि आशय सभी लोग, सभी विश्वासी या सभी वस्तुएँ हैं।
  alternative: ‘सब लोगों’, ‘सब विश्वासियों’ या ‘सब वस्तुओं’ के रूप में स्पष्ट करना।
  rationale: तात्कालिक प्रसंग कलीसिया की एकता का है, पर यूनानी में स्पष्ट संज्ञा नहीं है और भाषा व्यापक है। इसलिए वास्तविक अर्थगत तनाव सुरक्षित रखा गया है।
- issue: ἐν πᾶσιν का पाठांतर
  choice: SBLGNT के अनुसार ‘सबमें’ रखा गया है।
  alternative: कुछ पांडुलिपियों के अनुसार ‘तुम सबमें’।
  rationale: दिए गए आलोचनात्मक मूलपाठ का अनुसरण किया गया है; महत्वपूर्ण पाठांतर को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘एक ही’ से बलाघात और ‘सबका… सबके… सबमें’ से मूल की पुनरावृत्ति तथा लय सुरक्षित रखी गई है।
