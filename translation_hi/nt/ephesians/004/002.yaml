translation:
  language: hi
  text: पूर्ण विनम्रता और कोमलता के साथ, धैर्य के साथ, प्रेम में एक-दूसरे को सहन करते रहो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης
  choice: पूरी ... के साथ
  rationale: μετά + संबंधकारक साथ होने का भाव देता है, और πάσης गुण की पूर्णता पर बल देता है। हिंदी में ‘पूरी ... के साथ’ स्वाभाविक और अर्थानुरूप है।
- source_word: ταπεινοφροσύνης
  choice: दीनता
  rationale: यह मन की नम्रता और अपने को ऊँचा न समझने का गुण दर्शाता है। ‘दीनता’ संक्षिप्त, गरिमापूर्ण और आधुनिक हिंदी में बोधगम्य है।
- source_word: πραΰτητος
  choice: नम्रता
  rationale: यह सौम्यता और संयमित व्यवहार का गुण है। ‘नम्रता’ यहाँ प्रचलित और सहज हिंदी अभिव्यक्ति है, यद्यपि निकटवर्ती ταπεινοφροσύνη से अर्थगत अंतर संदर्भ द्वारा बना रहता है।
- source_word: μακροθυμίας
  choice: धीरज रखते हुए
  rationale: शब्द विशेषकर लोगों के प्रति लंबे समय तक धैर्य रखने और क्रोध में धीमे होने का भाव देता है। ‘धीरज रखते हुए’ वर्तमान कृदंत के साथ वाक्य में स्वाभाविक रूप से जुड़ता है।
- source_word: ἀνεχόμενοι
  choice: सहते रहो
  rationale: वर्तमान कृदंत निरंतर पारस्परिक सहनशीलता को व्यक्त करता है। हिंदी में मुख्य आज्ञा पिछले पद से ग्रहण करनी पड़ती है; ‘सहते रहो’ इस चलते रहने वाले भाव को स्पष्ट करता है।
- source_word: ἀλλήλων
  choice: एक-दूसरे को
  rationale: पारस्परिक सर्वनाम का सामान्य और स्वाभाविक हिंदी रूप।
- source_word: ἐν ἀγάπῃ
  choice: प्रेम में
  rationale: ἐν + संबंधवाचक रूप यहाँ उस क्षेत्र या रीति को व्यक्त कर सकता है जिसमें परस्पर सहना होता है। ‘प्रेम में’ इस संभावित व्यापकता को बनाए रखता है।
theological_decisions:
- issue: ἀγάπη का अनुवाद
  choice: प्रेम
  alternative: प्रीति
  rationale: ‘प्रेम’ आधुनिक मानक हिंदी में स्पष्ट और व्यापक रूप से समझा जाने वाला शब्द है; यह किसी संप्रदायगत विशेष अर्थ को नहीं जोड़ता।
- issue: ἐν ἀγάπῃ का संबंध
  choice: ‘एक-दूसरे को सहते रहो’ से जोड़ना
  alternative: पूरे आचरण अथवा अगले कथन से अर्थगत संबंध
  rationale: शब्दक्रम के अनुसार इसका निकटतम और स्वाभाविक संबंध पारस्परिक सहनशीलता से है; ‘प्रेम में’ की अभिव्यक्ति क्षेत्र और रीति की मूल अस्पष्टता को अनावश्यक रूप से सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। पद यूनानी में पिछले पद की बुलाहट के अनुरूप चलने वाली आज्ञा पर निर्भर है; स्वतंत्र उद्धरण के रूप में हिंदी वाक्य को स्वाभाविक बनाने के लिए अंतिम कृदंत को ‘सहते रहो’ के रूप में व्यक्त किया गया है।
