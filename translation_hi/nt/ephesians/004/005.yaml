lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: एक ही
  rationale: तीनों लिंग-रूप एक ही संख्या-सूचक विशेषण के हैं। हिन्दी में “एक ही” की पुनरावृत्ति एकता और विशिष्टता के बल को स्वाभाविक ढंग से बनाए रखती है।
- source_word: κύριος
  choice: प्रभु
  rationale: पौलुस के इस संदर्भ में यह सम्मानसूचक मसीही उपाधि है; “प्रभु” आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक और सटीक है।
- source_word: πίστις
  choice: विश्वास
  rationale: यहाँ साझा विश्वास अथवा विश्वास करने की प्रतिक्रिया का अर्थ प्रसंग के एकता-विषय से सर्वोत्तम मेल खाता है; शब्द की अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: βάπτισμα
  choice: बपतिस्मा
  rationale: यह दीक्षा-संबंधी धार्मिक क्रिया का प्रचलित और सटीक हिन्दी पद है; मूल वचन से अधिक व्याख्या जोड़े बिना इसे बनाए रखा गया है।
theological_decisions:
- issue: “प्रभु” का अभिप्रेत व्यक्ति
  choice: “प्रभु” को मसीही उपाधि के रूप में रखा गया है, जो इफिसियों 4:4–6 के प्रवाह में सबसे स्वाभाविक रूप से यीशु को सूचित करती है।
  alternative: सामान्य रूप से परमेश्वर का उल्लेख
  rationale: एक आत्मा (पद 4), एक प्रभु (पद 5), और एक परमेश्वर और पिता (पद 6) की त्रिक संरचना पुत्र की ओर संकेत करती है, पर अनुवाद स्वयं नाम जोड़कर मूल से अधिक स्पष्ट नहीं करता।
- issue: “एक ही बपतिस्मा” का अर्थ
  choice: इसे तटस्थ रूप से “एक ही बपतिस्मा” रखा गया है।
  alternative: विशेष रूप से संस्कारात्मक अर्थ; अथवा मुख्यतः रूपकात्मक/आत्मिक बपतिस्मे का अर्थ
  rationale: वचन एकता का दावा करता है, पर बपतिस्मे की विधि, प्रभाव या स्वरूप से जुड़े सम्प्रदायगत प्रश्नों का स्वयं समाधान नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और लयात्मक वाक्यांश। “एक ही” की तीन बार पुनरावृत्ति यूनानी मूल की समानांतर संरचना और एकता पर दिए गए बल को सुरक्षित रखती है।
