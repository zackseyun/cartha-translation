source:
  edition: SBLGNT
  text: ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/014.yaml
  text: so that we may no longer be children[a], tossed by waves and carried about by every wind of teaching, by human trickery, by craftiness in the scheming of error[c][b],
translation:
  language: hi
  text: ताकि हम अब बच्चे न रहें, जो लहरों से उछाले जाते और शिक्षा की हर हवा से इधर-उधर बहाए जाते हैं—लोगों की चालबाज़ी[a] और भटकावे की योजना के लिए की जाने वाली धूर्तता[b] के कारण।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “लोगों के पासा खेलने में”; यह बेईमानी या छलपूर्ण चालबाज़ी का बिंब है।
    reason: cultural_note
  - marker: b
    text: या, “भटकावे की योजना की ओर।” “भटकावा” का अर्थ “भूल” या “धोखा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν
  choice: ताकि हम आगे को ... न रहें
  rationale: ἵνα के प्रयोजन/परिणाम और μηκέτι के ‘अब आगे नहीं’ भाव को स्वाभाविक हिन्दी में व्यक्त करता है; संभावनार्थक उपवाक्य हिन्दी में ‘ताकि ... न रहें’ से स्पष्ट है।
- source_word: νήπιοι
  choice: बच्चे
  rationale: यहाँ आत्मिक अपरिपक्वता का रूपक है। ‘बच्चे’ सामान्य और सहज है; ‘शिशु’ आयु को आवश्यकता से अधिक सीमित कर सकता है।
- source_word: κλυδωνιζόμενοι
  choice: लहरों से उछाले जाते
  rationale: क्रिया समुद्री लहरों द्वारा उछाले जाने का चित्र प्रस्तुत करती है, जिसे हिन्दी में स्पष्ट बनाए रखा गया है।
- source_word: περιφερόμενοι
  choice: इधर-उधर बहाए जाते हैं
  rationale: निष्क्रिय रूप और अस्थिर ढंग से एक ओर से दूसरी ओर ले जाए जाने का भाव रखता है तथा हवा के रूपक से स्वाभाविक रूप से जुड़ता है।
- source_word: παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: शिक्षा की हर हवा से
  rationale: διδασκαλία का सामान्य अर्थ ‘शिक्षा’ है; ‘सिद्धान्त’ सम्भव है, पर यूनानी शब्द को अधिक तकनीकी बनाने की आवश्यकता नहीं।
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: लोगों की चालबाज़ी के द्वारा
  rationale: κυβεία मूलतः पासा खेलने और उससे जुड़ी बेईमानी का बिंब है; सन्दर्भगत अर्थ छलपूर्ण चालबाज़ी है।
- source_word: ἐν πανουργίᾳ
  choice: उस धूर्तता के द्वारा
  rationale: πανουργία नैतिक रूप से नकारात्मक चतुराई या कपटपूर्ण धूर्तता बताता है।
- source_word: πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: जो भटकावे की साज़िश रचती है
  rationale: कठिन यूनानी वाक्यांश में πρός लक्ष्य/दिशा, μεθοδεία सुनियोजित युक्ति, और πλάνη भूल, भटकाव अथवा धोखे का भाव दे सकता है। हिन्दी में सम्बन्ध स्पष्ट करते हुए मूल की नकारात्मक सुनियोजितता रखी गई है।
theological_decisions:
- issue: διδασκαλία का अनुवाद
  choice: शिक्षा
  alternative: सिद्धान्त
  rationale: यह पद अस्थिर करने वाली हर प्रकार की शिक्षा की बात करता है। ‘शिक्षा’ आधुनिक और व्यापक है तथा अनावश्यक रूप से औपचारिक धर्मसिद्धान्त तक अर्थ सीमित नहीं करती।
- issue: πλάνη का अनुवाद
  choice: भटकावा
  alternative: भूल; धोखा
  rationale: πλάνη में गलत मार्ग पर भटकने और दूसरों को भटकाने, दोनों की अर्थ-छाया हो सकती है। ‘भटकावा’ इस तनाव को ‘भूल’ या केवल ‘धोखे’ की तुलना में अधिक सुरक्षित रखता है।
- issue: πρὸς τὴν μεθοδείαν τῆς πλάνης का वाक्यगत सम्बन्ध
  choice: धूर्तता को ऐसी बताया गया है जो भटकावे की साज़िश रचती है
  alternative: भटकावे की साज़िश की ओर; भटकावे की योजना के अनुसार
  rationale: यूनानी वाक्यांश संक्षिप्त और व्याख्यात्मक रूप से कठिन है। चुना हुआ रूप हिन्दी में पठनीय है, पर फुटनोट में अधिक शाब्दिक विकल्प देकर दिशा/लक्ष्य की सम्भावना सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सामान्य पाठक के लिए सहज शैली। समुद्र, हवा और अस्थिरता के मूल रूपकों को रखा गया है। ‘चालबाज़ी’, ‘धूर्तता’ और ‘साज़िश’ जानबूझकर किए गए छल के क्रमिक बल को व्यक्त करते हैं, जबकि फुटनोट कठिन अंतिम यूनानी वाक्यांश की वास्तविक अस्पष्टता सुरक्षित रखता है।
