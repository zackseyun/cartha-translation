  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: hi
  text: हर प्रकार की कड़वाहट, क्रोध का आवेश, गुस्सा, चीख-पुकार और निंदा[a], साथ ही हर प्रकार की दुर्भावना, तुमसे दूर की जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपमानजनक बातें”; परंपरागत अनुवाद “ईशनिंदा।” इस संदर्भ में यूनानी शब्द का आशय संभवतः दूसरों के विरुद्ध हानिकारक वाणी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα πικρία
  choice: हर प्रकार की कड़वाहट
  rationale: πᾶσα की व्यापकता और πικρία के कटु, मन में जमे वैरभाव—दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: θυμός
  choice: क्रोध का आवेश
  rationale: यह ὀργή से अलग उग्र और भड़क उठने वाले भाव को दिखाता है; केवल 'क्रोध' कहने पर दोनों यूनानी शब्दों का भेद मिट जाता।
- source_word: ὀργή
  choice: गुस्सा
  rationale: θυμός के उग्र आवेश से भेद रखते हुए सामान्य क्रोध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κραυγή
  choice: चीख-पुकार
  rationale: संदर्भ में ऊँची और झगड़ालू आवाज़ को स्पष्ट करता है तथा केवल तटस्थ पुकार का अर्थ नहीं देता।
- source_word: βλασφημία
  choice: निंदा
  rationale: इस पारस्परिक नैतिक संदर्भ में दूसरों के विरुद्ध अपमानजनक या हानिकारक वाणी सबसे संभावित है; 'निंदा' अर्थ को अनावश्यक रूप से केवल झूठे आरोप तक सीमित नहीं करती।
- source_word: ἀρθήτω ἀφ’ ὑμῶν
  choice: तुमसे दूर की जाए
  rationale: अओरिस्ट निष्क्रिय आज्ञार्थक की निष्क्रियता और समुदाय से पूर्ण निष्कासन की माँग, दोनों सुरक्षित रहते हैं।
- source_word: σὺν πάσῃ κακίᾳ
  choice: साथ ही हर प्रकार की दुर्भावना
  rationale: σύν का साथ होने का भाव, πάσῃ की व्यापकता और κακία का इस संदर्भ में द्वेषपूर्ण मनोभाव स्वाभाविक ढंग से व्यक्त होते हैं।
theological_decisions:
- issue: βλασφημία का आशय
  choice: मनुष्यों के विरुद्ध निंदात्मक या अपमानजनक वाणी
  alternative: परमेश्वर के विरुद्ध ईशनिंदा
  rationale: आस-पास के शब्द पारस्परिक संबंधों को बिगाड़ने वाले भावों और वाणी की सूची बनाते हैं। फिर भी यूनानी शब्द की व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'क्रोध का आवेश' और 'गुस्सा' द्वारा θυμός तथा ὀργή का अर्थगत भेद बनाए रखा गया है; निष्क्रिय आज्ञार्थक को भी यथासंभव सुरक्षित रखा गया है।
