id: EPH.4.22
reference: Ephesians 4:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀποθέσθαι ὑμᾶς κατὰ τὴν προτέραν ἀναστροφὴν τὸν παλαιὸν ἄνθρωπον τὸν φθειρόμενον κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/022.yaml
  text: to put off[a], with respect to your former way of life, the old man, which is being corrupted according to deceitful desires[b],
translation:
  language: hi
  text: कि तुम अपने पहले के जीवन-व्यवहार के संबंध में उस पुराने मनुष्य को उतार दो[a], जो छल की इच्छाओं[b] के अनुसार भ्रष्ट होता जा रहा है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “पुराना मनुष्य।” यह पहले के मानव जीवन-ढंग के लिए एक प्रतिनिधिक अभिव्यक्ति है; इसका अर्थ “पुराना स्व” भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से “छल की इच्छाएँ।” इसका अर्थ ऐसी इच्छाएँ हो सकता है जो छल से चिह्नित या छल द्वारा आकार पाती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθέσθαι
  choice: उतार दो
  rationale: यह वस्त्र उतारने के रूपक को बनाए रखता है, जो पद 24 के ‘पहन लो’ से मेल खाता है। प्रसंग में आश्रित अनंत क्रिया को स्वाभाविक हिन्दी में ‘कि तुम ... उतार दो’ से व्यक्त किया गया है।
- source_word: κατὰ τὴν προτέραν ἀναστροφὴν
  choice: अपने पहले के चाल-चलन के संबंध में
  rationale: ἀναστροφή जीवन-व्यवहार या आचरण को दर्शाता है और यहाँ κατά संबंध अथवा क्षेत्र बताता है। ‘चाल-चलन’ सामान्य, नैतिक जीवन-व्यवहार का बोध कराता है।
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: उस पुराने मनुष्य
  rationale: मूल के प्रतिनिधिक और व्याकरणतः पुल्लिंग मानव-संबंधी रूपक को सुरक्षित रखा गया है; इसे केवल पुरुषों तक सीमित नहीं समझना चाहिए।
- source_word: φθειρόμενον
  choice: भ्रष्ट होता जा रहा है
  rationale: वर्तमान कर्मवाच्य कृदंत नैतिक बिगाड़ की जारी प्रक्रिया बताता है; ‘होता जा रहा है’ उसकी प्रगतिशीलता को स्पष्ट करता है।
- source_word: κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης
  choice: छल से उपजी अभिलाषाओं के अनुसार
  rationale: κατά को नियंत्रक मानक के रूप में ‘के अनुसार’ दिया गया है। संबंधकारक τῆς ἀπάτης की अस्पष्टता को मात्र ‘छलपूर्ण’ कहकर दबाने के बजाय ऐसी अभिलाषाओं के रूप में व्यक्त किया गया है जिन्हें छल आकार देता है।
- source_word: ἐπιθυμίας
  choice: अभिलाषाओं
  rationale: यह प्रबल इच्छाओं का व्यापक अर्थ रखता है और अर्थ को केवल यौन वासना तक सीमित नहीं करता।
theological_decisions:
- issue: τὸν παλαιὸν ἄνθρωπον का अर्थ
  choice: पुराना मनुष्य
  alternative: पुराना स्वभाव / पुराना व्यक्तित्व
  rationale: शाब्दिक मानव-संबंधी और संभावित सामूहिक/आदम-संबंधी अनुगूंज को बनाए रखा गया है। यह प्रतिनिधिक अभिव्यक्ति है, केवल पुरुषों का उल्लेख नहीं।
- issue: ἀποθέσθαι की प्रसंगगत शक्ति
  choice: कि तुम ... उतार दो
  alternative: उतारना / कि तुमने उतार दिया
  rationale: हिन्दी में पद 21 से जुड़ी शिक्षा की विषयवस्तु स्वाभाविक रूप से व्यक्त होती है। पूर्ण हो चुकी घटना का अर्थ थोपने से बचते हुए निर्देशात्मक बल को खुला रखा गया है।
- issue: φθειρόμενον का कालगत बल
  choice: भ्रष्ट होता जा रहा है
  alternative: भ्रष्ट हो गया है / नष्ट होता है
  rationale: वर्तमान कृदंत में दिखाई देने वाली जारी प्रक्रिया को रखा गया है, बिना यह तय किए कि आशय केवल नैतिक भ्रष्टता है या अंतिम विनाश भी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। पद एक आश्रित वाक्यांश है, इसलिए अंत में अल्पविराम रखा गया है। ‘पुराना मनुष्य’ मूल रूपक को सुरक्षित रखता है, जबकि पादटिप्पणी उसका प्रतिनिधिक अर्थ स्पष्ट करती है।
