source:
  edition: SBLGNT
  text: ⸀γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, χαριζόμενοι ἑαυτοῖς καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: hi
  text: एक-दूसरे के प्रति दयालु और कोमल हृदयवाले बनो। एक-दूसरे को क्षमा करो, जैसे परमेश्वर ने भी मसीह में तुम्हें[a] क्षमा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन हस्तलिपियों में ‘हमें’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: γίνεσθε
  choice: बनो
  rationale: वर्तमानकालीन आज्ञार्थक रूप निरंतर विकसित और प्रकट होने वाले चरित्र का आह्वान करता है; ‘बनो’ स्वाभाविक हिन्दी में इसकी आज्ञात्मक शक्ति बनाए रखता है।
- source_word: εἰς ἀλλήλους
  choice: एक-दूसरे के प्रति
  rationale: यह संबंध की पारस्परिक दिशा व्यक्त करता है; ‘के प्रति’ हिन्दी में स्वाभाविक और सटीक है।
- source_word: χρηστοί
  choice: दयालु
  rationale: इस पारस्परिक नैतिक संदर्भ में यह भलाई और कृपापूर्ण व्यवहार को व्यक्त करता है; ‘दयालु’ सामान्य आधुनिक हिन्दी में सहज है।
- source_word: εὔσπλαγχνοι
  choice: कोमल हृदयवाले
  rationale: यह भीतर से उपजने वाली गहरी करुणा को दर्शाता है और ‘दयालु’ से इसका भावात्मक अंतर भी बनाए रखता है।
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: एक-दूसरे को क्षमा करो
  rationale: यहाँ अगले उपवाक्य में परमेश्वर के क्षमा करने से तुलना होने के कारण χαρίζομαι का संदर्भगत अर्थ ‘क्षमा करना’ है; बहुवचन आत्मवाचक सर्वनाम पारस्परिक अर्थ में प्रयुक्त हुआ है।
- source_word: καθὼς καὶ
  choice: जैसे ... भी
  rationale: ‘जैसे’ तुलना और ‘भी’ καί का बल बनाए रखते हैं, बिना हिन्दी को अनावश्यक रूप से भारी बनाए।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: Χριστός यहाँ उपाधि है, इसलिए ‘मसीह’ उपयुक्त है; ‘में’ ἐν को जानबूझकर खुला रखता है और उसे व्याख्यात्मक रूप से केवल ‘के द्वारा’ नहीं बनाता।
- source_word: ἐχαρίσατο
  choice: क्षमा किया
  rationale: इस संदर्भ में क्रिया परमेश्वर के पूर्ण क्षमादान को दर्शाती है; ‘क्षमा किया’ स्पष्ट और सीधा अनुवाद है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: यह बहुवचन द्वितीय पुरुष का अप्रत्यक्ष कर्म है; हिन्दी में ‘तुम्हें क्षमा किया’ स्वाभाविक है।
theological_decisions:
- issue: ἐν Χριστῷ में मसीह और परमेश्वर के क्षमादान का संबंध
  choice: मसीह में
  alternative: मसीह के द्वारा
  rationale: मूल ἐν संबंध या क्षेत्र को व्यक्त कर सकता है और प्रसंग में साधनगत अर्थ भी निहित हो सकता है। ‘मसीह में’ मूल की व्यापकता और पौलुस की धर्मवैचारिक अभिव्यक्ति को बिना संकुचित किए सुरक्षित रखता है।
- issue: Χριστός का रूपांतरण
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ शब्द उपाधि के रूप में कार्य करता है; अर्थानुवाद ‘मसीह’ सामान्य हिन्दी बाइबलीय प्रयोग में स्पष्ट और स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और पारस्परिक उपदेश के अनुकूल रूप। यूनानी कृदंत को हिन्दी में स्वतंत्र आज्ञा के रूप में रखा गया है ताकि वाक्य सहज रहे; दो वाक्यों में विभाजन से अर्थ-संबंध नहीं बदलता।
