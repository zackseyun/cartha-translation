  yaml_path: translation/nt/ephesians/004/007.yaml
  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: hi
  text: पर हममें से हर एक को मसीह के वरदान के माप के अनुसार अनुग्रह दिया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἑνὶ δὲ ἑκάστῳ ἡμῶν
  choice: पर हममें से हर एक को
  rationale: ἑνὶ और ἑκάστῳ का संयुक्त प्रयोग समुदाय के प्रत्येक व्यक्ति पर बल देता है। ‘हममें से हर एक को’ इस वितरणात्मक बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है। δέ पिछले पदों की एकता से अब विविधता की ओर हल्का विरोधात्मक मोड़ दिखाता है, इसलिए ‘पर’ चुना गया।
- source_word: ἐδόθη ἡ χάρις
  choice: अनुग्रह दिया गया
  rationale: अओरिस्ट कर्मवाच्य को सरल भूतकालीन कर्मवाच्य में रखा गया है। ‘अनुग्रह’ पौलुस की धर्मवैचारिक शब्दावली और इस प्रसंग में सेवाकार्य हेतु दी गई कृपापूर्ण सामर्थ्य—दोनों की संभावना बनाए रखता है।
- source_word: κατὰ τὸ μέτρον
  choice: परिमाण के अनुसार
  rationale: κατά यहाँ मान या अनुपात व्यक्त करता है। ‘परिमाण के अनुसार’ निर्धारित अंश अथवा अनुपात का भाव सुरक्षित रखता है।
- source_word: τῆς δωρεᾶς
  choice: वरदान
  rationale: δωρεά स्वतंत्र रूप से दी गई देन को सूचित करता है। ‘वरदान’ कलीसिया के सेवाकार्य-संबंधी प्रसंग में स्वाभाविक है और χάρις के लिए प्रयुक्त ‘अनुग्रह’ से स्पष्ट भेद भी बनाए रखता है।
- source_word: τοῦ Χριστοῦ
  choice: मसीह के
  rationale: 'Χριστός का शीर्षकीय अर्थ हिन्दी के प्रचलित और अर्थपूर्ण रूप ‘मसीह’ से व्यक्त होता है। सम्बन्धकारक रचना को जानबूझकर खुला रखा गया है: वरदान मसीह का है और प्रसंगतः उसी के द्वारा दिया गया समझा जा सकता है।'
theological_decisions:
- issue: इस प्रसंग में χάρις का आशय
  choice: ‘अनुग्रह’—जिसमें प्रत्येक विश्वासी को सेवाकार्य के लिए दी गई कृपापूर्ण सामर्थ्य का प्रसंगगत अर्थ समाया है
  alternative: केवल उद्धार देने वाला अनुग्रह; अथवा सीधे ‘आत्मिक वरदान’
  rationale: आगे के पद विभिन्न सेवाओं और वरदानों की चर्चा करते हैं, फिर भी यूनानी पाठ χάρις कहता है। इसलिए व्यापक धर्मवैचारिक शब्द ‘अनुग्रह’ रखा गया है और अर्थ को संकीर्ण नहीं किया गया।
- issue: τοῦ Χριστοῦ में सम्बन्धकारक का अर्थ
  choice: ‘मसीह के वरदान’
  alternative: ‘मसीह द्वारा दिए गए वरदान’
  rationale: ‘मसीह द्वारा दिए गए’ दाता का अर्थ स्पष्ट कर देता, पर यूनानी सम्बन्धकारक अपने-आप में स्वामित्व, स्रोत या दाता के बीच पूर्ण निर्णय नहीं करता। हिन्दी सम्बन्धकारक मूल अस्पष्टता को बेहतर सुरक्षित रखता है।
- issue: Χριστός का रूपांतरण
  choice: मसीह
  alternative: क्राइस्ट
  rationale: यहाँ Χριστός का शीर्षकीय अर्थ सक्रिय है। ‘मसीह’ हिन्दी में प्रतिष्ठित होने के साथ अभिषिक्त जन की मसीही उपाधि को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘परिमाण’ कुछ औपचारिक है, पर ‘माप’ की तुलना में यहाँ अनुपात और बाँटे गए अंश का भाव अधिक सटीकता से देता है। किसी पाद-टिप्पणी की आवश्यकता नहीं पड़ी।
