  text: if indeed you heard him and were taught in him[a], just as truth is in Jesus[b],
translation:
  language: hi
  text: यदि सचमुच तुमने उसे सुना और उसमें तुम्हें शिक्षा दी गई[a]—जैसा कि सत्य यीशु में है[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने उसके विषय में सुना।” यूनानी में अधिक शाब्दिक रूप से “तुमने उसे सुना” है; संभवतः भाव यह है कि प्रेरितों के संदेश में तुमने सच में स्वयं मसीह को सुना।
    reason: alternative_reading
  - marker: b
    text: “उसमें” और “यीशु में” क्षेत्र, एकता या घनिष्ठ संबंध व्यक्त कर सकते हैं; यूनानी में भाव केवल “उसके द्वारा” की अपेक्षा अधिक व्यापक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: यदि सचमुच
  rationale: यह यूनानी की शर्तात्मक रचना और γε के बल—जिसमें कही गई बात को हल्के ढंग से मानकर चला गया है—दोनों को बनाए रखता है; इसे कारणसूचक ‘क्योंकि’ नहीं बनाता।
- source_word: αὐτὸν ἠκούσατε
  choice: तुमने उसी को सुना
  rationale: αὐτόν सीधा कर्म है, इसलिए ‘उसी को सुना’ मूल की असामान्य पर अर्थपूर्ण अभिव्यक्ति बचाता है; ‘उसके विषय में सुना’ संभव व्याख्या है, पर वह मूल में निहित नहीं है।
- source_word: ἐν αὐτῷ
  choice: उसी में
  rationale: ‘उसी में’ पौलुस की व्यापक ἐν-भाषा को बनाए रखता है, जो क्षेत्र, एकता या घनिष्ठ संबंध सूचित कर सकती है; इसे केवल ‘उसके द्वारा’ कहकर साधन तक सीमित नहीं करता।
- source_word: ἐδιδάχθητε
  choice: तुम्हें शिक्षा दी गई
  rationale: यह अओरिस्ट कर्मवाच्य का स्वाभाविक और वर्तमान मानक हिन्दी रूप है।
- source_word: καθώς
  choice: जैसा कि
  rationale: यह पाठकों को मिली शिक्षा और यीशु में स्थित सत्य के बीच तुलनात्मक संबंध व्यक्त करता है।
- source_word: ἀλήθεια
  choice: सत्य
  rationale: बिना उपपद वाले ἀλήθεια का सीधा अनुवाद ‘सत्य’ है; ‘वास्तविकता’ कहना संदर्भ को जरूरत से अधिक व्याख्यायित करेगा।
- source_word: ἐν τῷ Ἰησοῦ
  choice: यीशु में
  rationale: यह व्यक्तिगत नाम ‘यीशु’ और ἐν की व्यापक स्थानिक/संबंधात्मक शक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: αὐτὸν ἠκούσατε को सीधे ‘उसी को सुना’ कहा जाए या व्याख्यात्मक रूप से ‘उसके विषय में सुना’।
  choice: उसी को सुना
  alternative: उसके विषय में सुना
  rationale: सीधा कर्म पहले विकल्प का समर्थन करता है और प्रेरितीय संदेश में स्वयं मसीह को सुनने की संभावित धारणा बनाए रखता है, बिना उसे स्पष्ट रहस्यवादी दावा बनाए।
- issue: ἐν αὐτῷ और ἐν τῷ Ἰησοῦ में ἐν का अर्थ कैसे प्रस्तुत किया जाए।
  choice: उसी में / यीशु में
  alternative: उसके द्वारा / यीशु के साथ एकता में
  rationale: सीधा ‘में’ क्षेत्र, एकता और घनिष्ठ संबंध की वास्तविक अस्पष्टता को बनाए रखता है; कोई एक धर्मवैज्ञानिक अर्थ थोपता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। ‘उसी’ से पिछले पद के मसीह की ओर संकेत स्पष्ट रहता है। पद की वाक्यगत अपूर्णता और अगले संदर्भ से उसका संबंध दिखाने के लिए अंत में डैश रखा गया है; दोनों पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
