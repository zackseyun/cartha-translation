base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/003.yaml
  text: making every effort to keep the unity of the Spirit in the bond of peace[a][b].
translation:
  language: hi
  text: और शांति के बंधन में पवित्र आत्मा की एकता बनाए रखने का हर संभव प्रयास करो।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसे बनाए रखने के लिए पूरी लगन दिखाओ” अथवा “इसे सुरक्षित रखने के लिए भरसक प्रयत्न करो।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “पवित्र आत्मा” से संभवतः पवित्र आत्मा अभिप्रेत है; कुछ लोग इसे विश्वासियों में साझा आत्मिक भाव के अर्थ में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδάζοντες
  choice: हर सम्भव प्रयास करो
  rationale: वर्तमान सक्रिय कृदन्त यहाँ 4:1–2 से चली आ रही उपदेशात्मक धारा को आगे बढ़ाता है और तत्पर, परिश्रमी प्रयत्न व्यक्त करता है। स्वाभाविक हिन्दी में क्रियात्मक बल स्पष्ट करने के लिए इसे आज्ञार्थक रूप में रखा गया है।
- source_word: τηρεῖν
  choice: बनाए रखने
  rationale: यह किसी पहले से विद्यमान वस्तु को कायम रखने या सुरक्षित रखने का भाव देता है, न कि नई एकता बनाने का।
- source_word: ἑνότητα
  choice: एकता
  rationale: ἑνότης का स्पष्ट, प्रचलित और प्रसंगानुकूल हिन्दी पर्याय।
- source_word: τοῦ πνεύματος
  choice: आत्मा की
  rationale: इफिसियों के निकटवर्ती प्रसंग, विशेषकर 4:4 और 4:30, में संकेत सबसे स्वाभाविक रूप से पवित्र आत्मा की ओर है; देवनागरी में बड़े अक्षर का भेद न होने से टिप्पणी में सम्भावित अर्थ स्पष्ट किया गया है।
- source_word: ἐν
  choice: में
  rationale: यह उस क्षेत्र अथवा साधन को व्यक्त करता है जिसमें एकता कायम रखी जाती है; 'में' मूल रूपक को सीधे बनाए रखता है।
- source_word: συνδέσμῳ
  choice: बन्धन
  rationale: संज्ञा उस वस्तु या सम्बन्ध को सूचित करती है जो जोड़कर रखता है। 'बन्धन' संक्षिप्त रूप से मूल रूपक को सुरक्षित रखता है।
- source_word: τῆς εἰρήνης
  choice: शान्ति के
  rationale: सरल सम्बन्धकारक रचना को सुरक्षित रखते हुए शान्ति को जोड़ने वाले बन्धन के रूप में प्रस्तुत करता है, बिना सम्बन्ध को आवश्यकता से अधिक परिभाषित किए।
theological_decisions:
- issue: πνεύματος का सन्दर्भ
  choice: पवित्र आत्मा
  alternative: मानवीय आत्मा अथवा विश्वासियों में साझा भाव
  rationale: इफिसियों के निकटवर्ती प्रयोग पवित्र आत्मा की ओर प्रबल संकेत करते हैं, फिर भी मूल शब्द अपने आप में दूसरी समझ को पूरी तरह असम्भव नहीं बनाता; इसलिए मुख्य पाठ में स्वाभाविक पाठ और पादटिप्पणी में वास्तविक वैकल्पिक समझ रखी गई है।
- issue: एकता का स्वरूप
  choice: पहले से दी गई एकता को बनाए रखना
  alternative: विश्वासियों द्वारा एकता उत्पन्न करना
  rationale: τηρεῖν का अर्थ कायम रखना या सुरक्षित रखना है; इसलिए पाठ विश्वासियों को एकता बनाने के बजाय उसे बनाए रखने को कहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज उपदेशात्मक स्वर अपनाया गया है। ग्रीक कृदन्त को हिन्दी में स्वाभाविक आज्ञार्थक वाक्य बनाया गया है। 'बन्धन' मूल जोड़ने वाले रूपक को बनाए रखता है; 'बनाए रखने' से पहले से विद्यमान एकता का भाव स्पष्ट रहता है।
