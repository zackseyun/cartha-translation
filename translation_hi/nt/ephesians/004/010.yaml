id: EPH.4.10
reference: Ephesians 4:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς ὑπεράνω πάντων τῶν οὐρανῶν, ἵνα πληρώσῃ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/010.yaml
  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: hi
  text: जो नीचे उतरा, वही है जो सब आकाशों से बहुत ऊपर चढ़ गया[a], ताकि वह सब कुछ भर दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब आकाशों के ऊपर।” यह वाक्यांश हर स्वर्गीय क्षेत्र से ऊपर उसकी महान ऊँचाई और श्रेष्ठता पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “ताकि वह सब कुछ पूरा करे।” यूनानी क्रिया का अर्थ कुछ प्रसंगों में “पूरा करना” भी हो सकता है, पर यहाँ “भरना” निकटवर्ती प्रसंग के अधिक अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: जो नीचे उतरा
  rationale: संज्ञात्मक एओरिस्ट कृदन्त को स्वाभाविक हिन्दी सम्बन्धवाचक उपवाक्य में व्यक्त किया गया है; यह पूर्ण हुई उतरने की क्रिया को स्पष्ट रखता है।
- source_word: αὐτός ἐστιν καὶ
  choice: वही है जो
  rationale: αὐτός का बल उतरने और चढ़ने वाले की एक ही पहचान पर है। ‘वही’ इस ज़ोर को सहज और संक्षिप्त हिन्दी में सुरक्षित रखता है।
- source_word: ὁ ἀναβὰς
  choice: जो ... चढ़ गया
  rationale: पहले संज्ञात्मक कृदन्त के समान इसे भी सम्बन्धवाचक उपवाक्य बनाया गया है। ‘चढ़ गया’ आरोहण की पूर्ण हुई क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑπεράνω
  choice: बहुत ऊपर
  rationale: यह पद केवल ‘ऊपर’ नहीं, बल्कि उससे परे ऊँचाई और श्रेष्ठता का भाव देता है; ‘बहुत ऊपर’ इस बल को सामान्य आधुनिक हिन्दी में दर्शाता है।
- source_word: πάντων τῶν οὐρανῶν
  choice: सब आकाशों से
  rationale: यूनानी बहुवचन को ‘आकाशों’ के रूप में बनाए रखा गया है। ὑπεράνω के साथ हिन्दी का अपादान ‘से’ स्वाभाविक रूप से ‘सब आकाशों से बहुत ऊपर’ का अर्थ देता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यहाँ उद्देश्य का भाव है; ‘ताकि’ आधुनिक हिन्दी में उसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πληρώσῃ
  choice: वह ... भर दे
  rationale: तात्कालिक सन्दर्भ में πληρόω का मूल अर्थ ‘भरना’ उपयुक्त है। ‘भर दे’ उद्देश्य और परिणामी पूर्णता का भाव रखता है, जबकि ‘पूरा करे’ सम्भव वैकल्पिक अर्थ के रूप में पादटिप्पणी में दिया गया है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: यह व्यापक नपुंसकलिंग बहुवचन पद है। ‘सब कुछ’ इसकी समावेशी व्यापकता बनाए रखता है और इसे केवल लोगों अथवा ब्रह्माण्ड तक सीमित नहीं करता।
theological_decisions:
- issue: नीचे उतरने और ऊपर चढ़ने वाले की पहचान
  choice: ‘वही’ द्वारा दोनों क्रियाओं के कर्ता की एक ही पहचान पर ज़ोर रखा गया है।
  alternative: 'केवल क्रम बताते हुए कहना: ‘जो नीचे उतरा, वह भी ऊपर चढ़ा।’'
  rationale: αὐτός और दोहराए गए संज्ञात्मक कृदन्त स्पष्ट रूप से बताते हैं कि उतरने वाला और चढ़ने वाला एक ही व्यक्ति है; अनुवाद इस बल को रखता है, पर कोई अतिरिक्त व्याख्या नहीं जोड़ता।
- issue: τὰ πάντα का दायरा
  choice: ‘सब कुछ’
  alternative: ‘सब लोग’ अथवा ‘सारा ब्रह्माण्ड’
  rationale: यूनानी पद जानबूझकर व्यापक है। अधिक सीमित या विस्तारपूर्ण अर्थ चुनना मूल की खुली व्यापकता को अनावश्यक रूप से तय कर देता।
- issue: πληρώσῃ का अर्थ
  choice: ‘भर दे’
  alternative: ‘पूरा करे’
  rationale: इस प्रसंग में भरने या अपनी परिपूर्ण उपस्थिति से व्याप्त करने का अर्थ अधिक सम्भावित है, पर ‘पूरा करना’ शब्द का वास्तविक वैकल्पिक अर्थ है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आकाशों’ का बहुवचन मूल यूनानी की विश्व-रचनात्मक अभिव्यक्ति को सुरक्षित रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में अपने सम्बन्धित पदों के तुरन्त बाद दिए गए हैं।
