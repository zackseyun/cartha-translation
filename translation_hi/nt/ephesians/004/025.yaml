id: EPH.4.25
reference: Ephesians 4:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: hi
  text: इसलिए, झूठ[a] को त्यागकर तुम में से हर एक अपने पड़ोसी से सच बोले, क्योंकि हम एक-दूसरे के अंग हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस झूठ को।”
    reason: यूनानी τὸ ψεῦδος में निश्चित उपपद है; इसलिए अधिक शाब्दिक रूप ‘उस झूठ’ संभव है, यद्यपि संदर्भ में ‘झूठ’ को व्यापक बुराई मानना अधिक स्वाभाविक है।
lexical_decisions:
- source_word: Διὸ
  choice: इसलिए
  rationale: यह पिछले विचार से निष्कर्ष निकालने वाला संयोजक है; ‘इसलिए’ उसके तार्किक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀποθέμενοι
  choice: त्यागकर
  rationale: अओरिस्ट कृदन्त मुख्य आज्ञा से पहले झूठ को निर्णायक रूप से छोड़ देने को व्यक्त करता है। ‘त्यागकर’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: τὸ ψεῦδος
  choice: झूठ
  rationale: संदर्भ में यह किसी एक असत्य कथन से अधिक, झूठ और कपट की व्यापक प्रवृत्ति को दर्शाता है। यूनानी निश्चित उपपद के कारण ‘उस झूठ’ भी संभव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
- source_word: λαλεῖτε ἀλήθειαν
  choice: सच बोले
  rationale: वर्तमान आज्ञार्थक रूप निरंतर नैतिक आचरण की आज्ञा देता है। ‘सच बोले’ आधुनिक हिन्दी में सीधा और स्वाभाविक है तथा झूठ के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: ἕκαστος
  choice: तुम में से हर एक
  rationale: यह बहुवचन श्रोताओं में से प्रत्येक व्यक्ति पर आज्ञा लागू करता है। यह रूप हिन्दी में वितरणात्मक बल स्पष्ट करता है।
- source_word: μετὰ τοῦ πλησίον αὐτοῦ
  choice: अपने पड़ोसी से
  rationale: μετά सम्बन्ध या संगति को व्यक्त करता है; हिन्दी में बोलने के साथ ‘से’ स्वाभाविक है। ‘अपने पड़ोसी’ नैतिक-सामाजिक अर्थ को सुरक्षित रखता है और पूरे समुदाय पर लागू होता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह आज्ञा का कारण प्रस्तुत करता है; ‘क्योंकि’ कारणसूचक बल को स्पष्ट रखता है।
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: हम एक-दूसरे के अंग हैं
  rationale: ‘अंग’ देह की मूल उपमा और विश्वासियों की पारस्परिक निर्भरता दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ψεῦδος का विस्तार
  choice: ‘झूठ’ को सामान्य नैतिक बुराई के अर्थ में प्रस्तुत किया गया है।
  alternative: ‘उस झूठ’—निश्चित उपपद को अधिक प्रत्यक्ष रूप से दिखाने वाला अनुवाद।
  rationale: निकटवर्ती नैतिक उपदेश झूठे व्यवहार के विपरीत सच बोलने की आज्ञा देता है। फिर भी निश्चित उपपद के कारण विशिष्ट या सामूहिक ‘उस झूठ’ की संभावना वास्तविक है और पाद-टिप्पणी में सुरक्षित रखी गई है।
- issue: समुदाय और देह की उपमा
  choice: ‘हम एक-दूसरे के अंग हैं’
  alternative: ‘हम एक-दूसरे से जुड़े हुए अंग हैं’ या ‘हम एक ही देह के अंग हैं।’
  rationale: चुना हुआ रूप यूनानी की असामान्य और विचारोत्तेजक पारस्परिक अभिव्यक्ति को बनाए रखता है। ‘एक ही देह’ जोड़ना अर्थ स्पष्ट करता, पर इस पद में वे शब्द प्रत्यक्ष रूप से नहीं हैं।
- issue: वितरणात्मक भाषा और लिंग
  choice: ‘तुम में से हर एक अपने पड़ोसी से’
  alternative: ‘हर व्यक्ति अपने पड़ोसी से’
  rationale: यह यूनानी के प्रत्येक श्रोता पर लागू प्रतिनिधिक एकवचन को बनाए रखता है, पर हिन्दी में अनावश्यक रूप से किसी एक लिंग तक अर्थ सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘त्यागकर’ वस्त्र उतारने की मूल रूपक-छाया को कुछ कम प्रत्यक्ष करता है, पर सामान्य पाठक के लिए नैतिक आज्ञा को स्वाभाविक ढंग से व्यक्त करता है। ‘एक-दूसरे के अंग’ जानबूझकर रखा गया है ताकि देह की उपमा और मूल कथन का पारस्परिक तनाव दोनों बने रहें।
