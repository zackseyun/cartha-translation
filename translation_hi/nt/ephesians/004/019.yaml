translation:
  language: hi
  text: वे संवेदनहीन हो गए हैं[a] और उन्होंने अपने आपको बेलगाम भोग-विलास[b] के हवाले कर दिया है, ताकि वे लोभ के साथ[c] हर प्रकार की अशुद्धता करने में लगे रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वे सारी संवेदना खो चुके हैं’ अथवा ‘वे महसूस करने की शक्ति खो बैठे हैं।’
    reason: lexical_alternative
  - marker: b
    text: या ‘कामुकता’ अथवा ‘निर्लज्ज आचरण।’
    reason: lexical_alternative
  - marker: c
    text: या ‘अतृप्त लालसा के साथ’ अथवा ‘लालच के साथ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: वे
  rationale: यह संबंधवाचक सर्वनाम पिछले पद में बताए लोगों की ओर संकेत करता है। हिन्दी में पिछले वाक्य से स्वाभाविक संबंध बनाए रखने के लिए ‘वे’ उपयुक्त है; ‘ऐसे लोग’ भी संभव है, पर उसमें गुणसूचक बल कुछ अधिक हो सकता है।
- source_word: ἀπηλγηκότες
  choice: संवेदनहीन हो गए हैं
  rationale: पूर्ण कृदंत ऐसी दशा बताता है जो उत्पन्न होकर बनी हुई है। यह प्रयोग मुख्यतः नैतिक संवेदना के कुंठित हो जाने को व्यक्त करता है, केवल भावनात्मक सुन्नता को नहीं।
- source_word: ἑαυτοὺς παρέδωκαν
  choice: उन्होंने अपने आप को ... के हवाले कर दिया है
  rationale: आत्मवाचक कर्म के साथ क्रिया स्वेच्छा से अपने को किसी शक्ति या आचरण के अधीन कर देने का भाव रखती है। ‘के हवाले कर दिया’ आधुनिक हिन्दी में इस आत्मसमर्पण को स्पष्ट करता है।
- source_word: τῇ ἀσελγείᾳ
  choice: बेलगाम भोग-विलास
  rationale: यह शब्द निर्लज्ज और अनियंत्रित आत्म-तुष्टि को दर्शाता है, जिसमें प्रायः यौन अनैतिकता शामिल होती है, पर अर्थ उसी तक सीमित नहीं है। ‘बेलगाम भोग-विलास’ इसकी व्यापकता और अनियंत्रित स्वरूप दोनों को व्यक्त करता है।
- source_word: εἰς ἐργασίαν
  choice: ताकि वे ... करते रहें
  rationale: यहाँ संज्ञा गतिविधि, अभ्यास या आचरण में लगे रहने का भाव देती है। हिन्दी में क्रियात्मक रूप उद्देश्य या परिणाम को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀκαθαρσίας πάσης
  choice: हर प्रकार की अशुद्धता
  rationale: यह पदबंध अशुद्ध आचरण की समूची व्यापकता को दर्शाता है। ‘हर प्रकार की’ हिन्दी में इस व्यापक अर्थ को सहज रूप से प्रकट करता है।
- source_word: ἐν πλεονεξίᾳ
  choice: अतृप्त लालसा के साथ
  rationale: πλεονεξία अधिक पाने की लोभी, कभी न भरने वाली इच्छा को दर्शाता है। यहाँ यह संभवतः अशुद्धता करने के ढंग या मनोवृत्ति को बताता है; ‘अतृप्त लालसा’ उस असीम चाह को स्पष्ट करती है।
theological_decisions:
- issue: ἀπηλγηκότες का नैतिक-मनोवैज्ञानिक बल
  choice: नैतिक संवेदना के कुंठित हो जाने की दशा के रूप में ‘संवेदनहीन हो गए हैं’
  alternative: ‘सारी अनुभूति खो चुके हैं’ या ‘महसूस करने की शक्ति खो बैठे हैं’
  rationale: संदर्भ नैतिक अलगाव और अशुद्धता के प्रति आत्मसमर्पण का है। चुना हुआ रूप नैतिक कठोरता को व्यक्त करता है, पर पाठ में ‘नैतिक’ जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- issue: ἀσέλγεια का दायरा
  choice: व्यापक, निर्लज्ज और अनियंत्रित आत्म-तुष्टि के अर्थ में ‘बेलगाम भोग-विलास’
  alternative: ‘कामुकता’, ‘व्यभिचारी आचरण’ या ‘लुचपन’
  rationale: यूनानी शब्द में यौन निर्लज्जता प्रायः निहित है, फिर भी वह केवल किसी एक यौन पाप तक सीमित नहीं। व्यापक अनियंत्रित भोग का रूप इस तनाव को बनाए रखता है।
- issue: ἐν πλεονεξίᾳ का संबंध और अर्थ
  choice: अशुद्धता के अभ्यास की मनोवृत्ति या रीति के रूप में ‘अतृप्त लालसा के साथ’
  alternative: ‘लोभ में’ या ‘लालच के साथ’
  rationale: व्याकरणतः पद अभ्यास की रीति बता सकता है, और πλεονεξία का अर्थ आर्थिक लोभ से व्यापक होकर अधिक पाने की अतृप्त चाह भी हो सकता है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बेलगाम भोग-विलास’ ἀσέλγεια की निर्लज्जता और अनियंत्रित आत्म-तुष्टि को बिना केवल यौन अर्थ तक सीमित किए व्यक्त करता है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद दिए गए हैं।
