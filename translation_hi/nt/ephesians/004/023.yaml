lexical_decisions:
- source_word: ἀνανεοῦσθαι
  choice: नया किए जाते रहो
  rationale: वर्तमानकालिक कर्मवाच्य अनन्त क्रिया को सुरक्षित रखता है और चलती रहने वाली प्रक्रिया का स्वाभाविक हिन्दी संकेत देता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ यह तीखा विरोध नहीं, बल्कि आसपास की अनन्त क्रियाओं की शृंखला में हल्का संयोजक है।
- source_word: τῷ πνεύματι
  choice: स्वभाव में
  rationale: सम्बन्धवाचक पद ‘तुम्हारी बुद्धि का’ के साथ यह मन की भीतरी प्रवृत्ति या अभिमुखता को स्वाभाविक हिन्दी में व्यक्त करता है; फिर भी वैकल्पिक पवित्र आत्मा-संबंधी समझ को पादटिप्पणी में रखा गया है।
- source_word: νοὸς
  choice: बुद्धि
  rationale: यहाँ νοῦς मन, समझ और सोचने की क्षमता को दर्शाता है। ‘बुद्धि’ ‘स्वभाव’ के साथ मिलकर भीतरी मानसिक अभिमुखता का अर्थ स्पष्ट करती है।
- source_word: ὑμῶν
  choice: अपनी
  rationale: सन्दर्भगत कर्ता बहुवचन ‘तुम’ है; हिन्दी में ‘अपनी’ उसी के साथ स्वाभाविक रूप से जुड़ता है।
theological_decisions:
- issue: क्या πνεύματι पवित्र आत्मा को बताता है या मनुष्य की भीतरी मानसिक प्रवृत्ति को
  choice: ‘अपनी बुद्धि के स्वभाव में’—भीतरी मानसिक प्रवृत्ति
  alternative: ‘उस आत्मा के द्वारा जो तुम्हारी बुद्धि को नया करता है’ अथवा पवित्र आत्मा-संबंधी समझ
  rationale: τοῦ νοὸς ὑμῶν सबसे स्वाभाविक रूप से πνεύματι को विशेषित करता है, इसलिए मुख्य पाठ मन की भीतरी प्रवृत्ति को व्यक्त करता है। मूल वाक्य की सम्भावित पवित्र आत्मा-संबंधी व्याख्या को नकारे बिना पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘नया किए जाते रहो’ कर्मवाच्य और निरन्तरता दोनों को बनाए रखता है। ‘बुद्धि के स्वभाव’ को अपेक्षाकृत सहज मानवशास्त्रीय अभिव्यक्ति के रूप में चुना गया है।
