language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ⸂ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν⸃, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/028.yaml
  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: hi
  text: जो चोरी करता है, वह अब चोरी न करे, बल्कि अपने हाथों से भला काम[a] करते हुए मेहनत करे, ताकि उसके पास ज़रूरतमंद के साथ बाँटने के लिए कुछ हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अच्छा है वह करते हुए।”
    reason: τὸ ἀγαθόν का शाब्दिक, व्यापक विकल्प; मुख्य पाठ का ‘भला काम’ प्रसंगानुकूल और स्वाभाविक हिन्दी है।
lexical_decisions:
- source_word: ὁ κλέπτων
  choice: जो चोरी करता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत व्यक्ति को उसके चोरी करने के आचरण के संदर्भ में बताता है; यह अनुवाद उसे स्थायी रूप से ‘चोर’ का लेबल दिए बिना यूनानी संरचना और वर्तमान भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: μηκέτι κλεπτέτω
  choice: वह अब चोरी न करे
  rationale: μηκέτι पहले के आचरण को रोकने का अर्थ देता है और तीसरे पुरुष की आज्ञा को ‘न करे’ आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: μᾶλλον δὲ
  choice: बल्कि
  rationale: यह चोरी के स्थान पर आदेशित सकारात्मक विकल्प का प्रबल विरोध और सुधारात्मक भाव व्यक्त करता है।
- source_word: κοπιάτω
  choice: मेहनत करे
  rationale: κοπιάω साधारण काम से बढ़कर परिश्रम और श्रम का भाव रखता है; ‘मेहनत करे’ वर्तमान हिन्दी में इसका स्वाभाविक आज्ञार्थक रूप है।
- source_word: ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν
  choice: अपने हाथों से अच्छा काम करते हुए
  rationale: यह वाक्यांश व्यक्तिगत और ईमानदार श्रम के ढंग तथा उसके अच्छे/उपयोगी परिणाम को साथ रखता है। ‘अच्छा काम’ τὸ ἀγαθόν को प्रसंगानुकूल व्यक्त करता है, बिना उसे केवल नैतिक कर्म या केवल उत्पादन तक सीमित किए।
- source_word: ἵνα ἔχῃ
  choice: ताकि उसके पास ... कुछ हो
  rationale: यह उद्देश्यवाचक उपवाक्य है। बाँटने के लिए उपलब्ध साधनों का भाव स्पष्ट करने हेतु ‘कुछ’ स्वाभाविक रूप से निहित पूरक के रूप में दिया गया है।
- source_word: μεταδιδόναι
  choice: के साथ बाँटने
  rationale: क्रिया अपनी वस्तुओं या संसाधनों में दूसरे को सहभागी बनाने का भाव देती है; ‘बाँटना’ केवल हस्तांतरण की अपेक्षा इस अर्थ को बेहतर व्यक्त करता है।
- source_word: τῷ χρείαν ἔχοντι
  choice: ज़रूरतमंद के साथ
  rationale: दत्तिव कृदंतीय पद उस व्यक्ति को सूचित करता है जिसे आवश्यकता है। ‘ज़रूरतमंद’ संक्षिप्त, सम्मानजनक और आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: मेहनत का नैतिक उद्देश्य
  choice: ईमानदार मेहनत को चोरी का सकारात्मक विकल्प और ज़रूरतमंद के साथ बाँटने का साधन बताया गया है।
  alternative: मुख्य बल केवल आत्मनिर्भरता पर है, अथवा मुख्य बल चोरी की भरपाई पर है।
  rationale: स्पष्ट उद्देश्यवाचक वाक्य ‘ताकि ... बाँटने के लिए’ श्रम के लक्ष्य को केवल अपना भरण-पोषण करने से आगे उदारता की ओर ले जाता है। पाठ सीधे तौर पर भरपाई का आदेश नहीं देता, इसलिए उसे अनुवाद में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘जो चोरी करता है’ मूल कृदंतीय अभिव्यक्ति को सुरक्षित रखता है; ‘मेहनत करे’ श्रम की तीव्रता व्यक्त करता है। किसी पाद-टिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि प्रमुख शाब्दिक संभावनाएँ मुख्य पाठ में स्वाभाविक रूप से समाहित हैं।
