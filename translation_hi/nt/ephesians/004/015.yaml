lexical_decisions:
- source_word: ἀληθεύοντες
  choice: सच बोलते हुए
  rationale: यह क्रिया सच बोलने के साथ सत्यनिष्ठ आचरण को भी समेट सकती है। निकटवर्ती संदर्भ में झूठी शिक्षा और छल के विपरीत होने के कारण मुख्य पाठ में स्वाभाविक हिन्दी 'सच बोलते हुए' रखा गया है; व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: δὲ
  choice: बल्कि
  rationale: यह पिछले पदों की अस्थिरता और छल के विपरीत हल्का विरोध दिखाता है; हिन्दी में 'बल्कि' इस संक्रमण को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἐν ἀγάπῃ
  choice: प्रेम में
  rationale: यह रीति और क्षेत्र, दोनों की सम्भावना बनाए रखता है और यूनानी अभिव्यक्ति का सीधा, प्रचलित अनुवाद है।
- source_word: αὐξήσωμεν
  choice: हम ... बढ़ते जाएँ
  rationale: प्रथम पुरुष बहुवचन संभावनार्थक यहाँ प्रोत्साहन या आह्वान व्यक्त करता है। 'बढ़ते जाएँ' सामूहिक आग्रह तथा निरन्तर विकास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς αὐτὸν
  choice: उसमें
  rationale: दिशात्मक εἰς को 'उसमें' कहने से मसीह की ओर तथा उससे जुड़कर बढ़ने की देह-संबंधी छवि बनी रहती है।
- source_word: τὰ πάντα
  choice: हर तरह से
  rationale: शाब्दिक अर्थ 'सब बातें/सब कुछ' है, पर बढ़ने के साथ यह व्यापकता या प्रत्येक पहलू में विकास का भाव देता है। 'हर तरह से' हिन्दी में इस क्रियाविशेषणीय अर्थ को स्पष्ट करता है।
- source_word: κεφαλή
  choice: सिर
  rationale: यह पौलुस की देह-वाली उपमा को बिना 'स्रोत' या 'अधिकारी' जैसे विवादित व्याख्यात्मक अर्थ थोपे सीधे सुरक्षित रखता है।
- source_word: Χριστός
  choice: मसीह
  rationale: यहाँ शब्द 'सिर' के बाद उपाधि के रूप में आता है; हिन्दी बाइबलीय प्रयोग में 'मसीह' उसका स्वाभाविक और मानक रूप है।
theological_decisions:
- issue: ἀληθεύοντες का अर्थ-क्षेत्र
  choice: मुख्य पाठ में 'सच बोलते हुए'
  alternative: '''सत्यनिष्ठ रहते हुए'' या ''सत्य पर चलते हुए'''
  rationale: संदर्भ झूठी शिक्षा और छल को सामने रखता है, इसलिए वाणी का अर्थ प्रमुख है; फिर भी यूनानी क्रिया सच्चे आचरण तक फैल सकती है, जिसे पादटिप्पणी में बनाए रखा गया है।
- issue: κεφαλή की व्याख्यात्मक शक्ति
  choice: केवल 'सिर'
  alternative: '''स्रोत'' या ''अधिकारी'''
  rationale: मूल पाठ उपमा देता है पर इस पद में उसके विवादित धर्मवैज्ञानिक आशयों में से किसी एक को स्पष्ट नहीं करता; अतः अनुवाद उपमा को ही रखता है।
- issue: Χριστός का नाम या उपाधि के रूप में प्रयोग
  choice: '''मसीह'''
  alternative: '''ख्रीस्त'''
  rationale: यहाँ Χριστός समानाधिकरण में उस व्यक्ति की पहचान करने वाली उपाधि है जो सिर है। 'मसीह' उपाधिगत अर्थ को हिन्दी में स्पष्ट रूप से बनाए रखता है।
