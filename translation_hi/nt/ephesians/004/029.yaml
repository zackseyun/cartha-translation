  text: πᾶς λόγος σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: hi
  text: कोई सड़ी हुई बात तुम्हारे मुँह से न निकले,[a] बल्कि केवल वही बात निकले जो ज़रूरत के अनुसार लोगों को मज़बूत बनाने के लिए अच्छी हो,[b] ताकि वह सुनने वालों को अनुग्रह दे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई भ्रष्ट करने वाली बात” अथवा “कोई हानिकारक बात।” यूनानी में शाब्दिक रूप से “कोई सड़ी हुई बात” है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “ज़रूरत के अनुसार निर्माण के लिए” अथवा “जैसी आवश्यकता हो, वैसा निर्माण करने के लिए” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “ताकि वह सुनने वालों को लाभ दे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: कोई सड़ी हुई बात
  rationale: निषेध के साथ πᾶς का अर्थ ‘कोई भी नहीं’ है। ‘सड़ी हुई’ σαπρός के सजीव रूपक को बनाए रखता है, जबकि ‘बात’ यहाँ λόγος को बोलचाल या कथन के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: तुम्हारे मुँह से न निकले
  rationale: यह यूनानी निषेध और मुँह से वाणी निकलने की शारीरिक छवि, दोनों को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: बल्कि केवल वही निकले ... जो ... अच्छी हो
  rationale: यूनानी वाक्य में छूटी हुई संज्ञा λόγος के आशय को हिन्दी में स्पष्ट किया गया है और विरोध का भाव ‘बल्कि केवल’ से व्यक्त किया गया है।
- source_word: πρὸς οἰκοδομὴν τῆς χρείας
  choice: आवश्यकता के अनुसार उन्नति करने के लिए
  rationale: ‘उन्नति करना’ οἰκοδομή के रूपकात्मक अर्थ—किसी को बनाना, दृढ़ करना—को सामान्य हिन्दी में व्यक्त करता है। ‘आवश्यकता के अनुसार’ संक्षिप्त यूनानी संबंध की अस्पष्टता को काफी हद तक बनाए रखता है।
- source_word: ἵνα δῷ χάριν
  choice: ताकि वह ... अनुग्रह पहुँचाए
  rationale: ‘अनुग्रह’ χάρις की पौलुस-संबंधी और पारस्परिक प्रतिध्वनि बनाए रखता है। ‘पहुँचाए’ हिन्दी में वाणी द्वारा श्रोताओं को अनुग्रह मिलने का भाव ‘दे’ की अपेक्षा अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῖς ἀκούουσιν
  choice: सुनने वालों को
  rationale: वर्तमान कृदंत का सीधा, स्वाभाविक और व्यापक हिन्दी रूप।
theological_decisions:
- issue: नैतिक उपदेश के संदर्भ में χάριν का अनुवाद
  choice: अनुग्रह
  alternative: लाभ / भलाई
  rationale: संदर्भ में श्रोताओं को लाभ पहुँचाने का अर्थ संभव है, पर ‘अनुग्रह’ मूल शब्द की व्यापक धार्मिक और संबंधपरक प्रतिध्वनि को बिना किसी विशिष्ट सांप्रदायिक व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘सड़ी हुई बात’ मूल के तीखे रूपक को जानबूझकर बनाए रखता है; ‘उन्नति’ सामान्य पाठक के लिए ‘आत्मिक निर्माण’ या ‘सम्प्रदायगत शिक्षावर्धन’ जैसे अधिक व्याख्यात्मक पदों से अधिक खुला है।
