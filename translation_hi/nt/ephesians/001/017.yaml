- issue: Χριστός को पदवी या नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: Χριστός का मूल पदवीगत अर्थ ‘मसीह’ है और हिन्दी पाठकों के लिए यही स्वाभाविक, प्रतिष्ठित रूप है।
- issue: ὁ πατὴρ τῆς δόξης में संबंधकारक का अर्थ
  choice: महिमा का पिता
  alternative: महिमामय पिता
  rationale: शाब्दिक संबंधकारक में परमेश्वर को महिमा का स्रोत/स्वामी या महिमामय पिता समझने की गुंजाइश है; मुख्य पाठ उसे संकुचित नहीं करता।
