lexical_decisions:
- source_word: ἵνα
  choice: कि
  rationale: यह पिछले पद में व्यक्त प्रार्थना की विषय-वस्तु और उद्देश्य को जोड़ता है; हिन्दी में ‘कि’ स्वाभाविक अधीनस्थ संबंध बनाए रखता है।
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: हमारे प्रभु यीशु मसीह का परमेश्वर
  rationale: यूनानी संबंधकारक रचना को निकटता से रखता है। κύριος के लिए ‘प्रभु’ और Χριστός के पदवीगत अर्थ के लिए हिन्दी का प्रचलित ‘मसीह’ उपयुक्त है।
- source_word: ὁ πατὴρ τῆς δόξης
  choice: महिमा का पिता
  rationale: संबंधकारक पदबंध को जानबूझकर अक्षुण्ण रखता है और उसे केवल ‘महिमामय पिता’ मानकर व्याख्यायित नहीं करता।
- source_word: δώῃ
  choice: दे
  rationale: ἵνα के साथ प्रयुक्त संभावनार्थक क्रिया यहाँ प्रार्थना की कामना व्यक्त करती है; हिन्दी में ‘दे’ स्वाभाविक रूप से यही भाव देता है।
- source_word: πνεῦμα σοφίας καὶ ἀποκαλύψεως
  choice: बुद्धि और प्रकाशन की आत्मा
  rationale: ‘आत्मा’ हिन्दी में पवित्र आत्मा अथवा परमेश्वर-प्रदत्त आत्मिक दशा—दोनों संभावनाओं को खुला रख सकती है; ‘प्रकाशन’ दिव्य प्रकट किए जाने का स्थापित और पारदर्शी शब्द है।
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: उसे भली-भाँति जानने में
  rationale: ἐπίγνωσις के गहरे/पूर्ण ज्ञान के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और ἐν को ‘में’ द्वारा बनाए रखता है। संदर्भ में αὐτοῦ का संकेत परमेश्वर की ओर समझा जाता है।
