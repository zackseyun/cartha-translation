source:
  edition: SBLGNT
  text: ἣν ⸀ἐνήργηκεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ⸀ἐκ νεκρῶν, καὶ ⸀καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/020.yaml
  text: which he worked in the Messiah when he raised him from the dead and seated him at his right hand in the heavenly places[b][a],
translation:
  language: hi
  text: जिसे उसने मसीह में तब कार्यान्वित किया, जब उसने उसे मरे हुओं में से जिलाया और स्वर्गीय लोकों में अपने दाहिने हाथ पर बैठाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἣν
  choice: जिसे
  rationale: यह संबंधवाचक सर्वनाम पिछले संदर्भ में स्त्रीलिंग ‘सामर्थ्य’ की ओर लौटता है; ‘जिसे’ हिंदी में उस संबंध को बनाए रखता है।
- source_word: ἐνήργηκεν
  choice: कार्यान्वित किया
  rationale: क्रिया प्रभावी रूप से काम करने या सामर्थ्य को क्रियाशील करने का भाव देती है; यहाँ परमेश्वर द्वारा अपने सामर्थ्य को कार्य में प्रकट करने का अर्थ है।
- source_word: ἐν τῷ Χριστῷ
  choice: मसीह में
  rationale: पूर्वसर्ग ἐν और Χριστός के मसीहाई पदनाम, दोनों को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: ἐγείρας αὐτὸν ἐκ νεκρῶν
  choice: जब उसने उसे मरे हुओं में से जिलाया
  rationale: कृदंत का मुख्य क्रिया से कालगत/सहचारी संबंध स्पष्ट करता है और बहुवचन νεκρῶν को ‘मरे हुओं’ के रूप में बनाए रखता है।
- source_word: καθίσας
  choice: और ... बैठाया
  rationale: ἐγείρας के साथ समन्वित कृदंत है; यह परमेश्वर द्वारा मसीह को प्रतिष्ठित स्थान पर बैठाने की अगली क्रिया व्यक्त करता है।
- source_word: ἐν δεξιᾷ αὐτοῦ
  choice: अपने दाहिने हाथ
  rationale: यह प्रतिष्ठा और अधिकार के स्थान का प्रचलित हिंदी मुहावरा है; ‘बैठाया’ के साथ ‘पर’ का लोप स्वाभाविक हिंदी प्रयोग है।
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: स्वर्गीय लोकों में
  rationale: नपुंसकलिंग बहुवचन विशेषण स्वर्गीय क्षेत्र या लोकों को सूचित करता है; ‘स्वर्गीय लोकों’ से बहुवचन और स्थानगत भाव दोनों बने रहते हैं।
theological_decisions:
- issue: Χριστῷ का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यहाँ शब्द पदनाम के रूप में प्रयुक्त है; ‘मसीह’ उसके अभिषिक्त और मसीहाई अर्थ को स्वाभाविक हिंदी में सुरक्षित रखता है।
- issue: ἐν τοῖς ἐπουρανίοις का आशय
  choice: स्वर्गीय लोकों में
  alternative: स्वर्गीय स्थानों में
  rationale: ग्रीक अभिव्यक्ति स्वर्गीय क्षेत्र को दर्शाती है। ‘लोकों’ आधुनिक हिंदी में अधिक स्वाभाविक है और बहुवचन रूप को भी बनाए रखता है, जबकि ‘स्थान’ अधिक शब्दशः विकल्प है।
- issue: दोनों कृदंतों का मुख्य क्रिया से संबंध
  choice: ‘जब’ द्वारा जिलाने को कालगत रूप से जोड़कर, बैठाने को समन्वित क्रिया रखा
  alternative: ‘जिलाकर और बैठाकर’ द्वारा साधनात्मक संबंध
  rationale: ग्रीक कृदंत काल, साधन अथवा सहचारी परिस्थिति का भाव दे सकते हैं। चुना हुआ रूप स्वाभाविक हिंदी में क्रम स्पष्ट करता है, पर किसी कठोर साधनात्मक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। पद पिछले वाक्य की ‘सामर्थ्य’ से व्याकरणिक रूप से जुड़ा है, इसलिए आरंभ ‘जिसे’ से किया गया है।
