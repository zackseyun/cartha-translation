  text: इसी कारण मैं भी, प्रभु यीशु में तुम्हारे विश्वास[a] और सभी पवित्र जनों के प्रति तुम्हारे प्रेम[b] के विषय में सुनकर,
  philosophy: optimal-equivalence
  footnotes:
