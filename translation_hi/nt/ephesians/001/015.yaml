    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पद पिछले कथन की ओर संकेत करते हुए पौलुस की प्रतिक्रिया का आधार बताता है; ‘इसी कारण’ इस संबंध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: κἀγώ
  choice: मैं भी
  rationale: καί और ἐγώ के संयुक्त रूप का योगात्मक बल सरल और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: ἀκούσας
  choice: सुनकर
  rationale: यूनानी अओरिस्ट कृदंत की कालगत और अधीनस्थ भूमिका को बनाए रखता है तथा अगले पद में आने वाली मुख्य क्रिया से वाक्य को जोड़ता है।
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: तुम्हारे विश्वास
  rationale: καθ’ ὑμᾶς यहाँ पाठकों से संबंधित विश्वास को दर्शाता है; ‘तुम्हारे विश्वास’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: πίστιν
  choice: विश्वास
  rationale: इस संदर्भ में प्रभु यीशु पर भरोसा रखने का भाव प्रमुख है; ‘विश्वास’ मानक हिंदी बाइबलीय शब्द है और मूल शब्द की व्यापकता भी बनाए रखता है।
- source_word: ἐν τῷ κυρίῳ Ἰησοῦ
  choice: प्रभु यीशु में
  rationale: ἐν के पौलुसी प्रयोग और यीशु के साथ विश्वास-संबंध को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: κυρίῳ
  choice: प्रभु
  rationale: यह यीशु की धर्मवैज्ञानिक उपाधि है; ‘प्रभु’ आधुनिक हिंदी में प्रतिष्ठित और अर्थपूर्ण समतुल्य है।
- source_word: ἀγάπην
  choice: प्रेम
  rationale: ἀγάπη का सीधा, वर्तमान और गरिमापूर्ण हिंदी समतुल्य है।
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: सभी पवित्र जनों के प्रति
  rationale: εἰς प्रेम की दिशा या उसके पात्रों को दर्शाता है; ‘के प्रति’ इस संबंध को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἁγίους
  choice: पवित्र जनों
  rationale: यह पौलुस द्वारा विश्वासियों के सामूहिक संबोधन को व्यक्त करता है और बाद की औपचारिक संत-घोषणा का आभास देने से बचता है।
theological_decisions:
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: यहाँ ‘प्रभु यीशु में’ वाक्यांश पाठकों के यीशु पर विश्वास या भरोसे की ओर सबसे स्वाभाविक रूप से संकेत करता है। ‘विश्वासयोग्यता’ शब्दगत रूप से संभव अर्थ है, पर इस रचना में कम संभावित है।
- issue: κύριος का मसीह-संबंधी शीर्षक
  choice: प्रभु
  alternative: स्वामी
  rationale: यीशु के शीर्षक के रूप में κύριος का धर्मवैज्ञानिक भार ‘प्रभु’ से बेहतर सुरक्षित रहता है; ‘स्वामी’ संभव है, पर यहाँ अपेक्षाकृत कमजोर है।
- issue: ἅγιοι की पहचान
  choice: पवित्र जन
  alternative: संत
  rationale: मूल में यह सभी विश्वासियों के लिए सामूहिक पद है। ‘पवित्र जन’ इस अर्थ को पारदर्शी रखता है और किसी विशेष रूप से संत घोषित वर्ग का अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। पद मूल यूनानी की तरह एक अधीनस्थ कृदंत-वाक्यांश है और अगले पद में पूरा होता है, इसलिए अंत में अल्पविराम रखा गया है। ‘तुम्हारे’ बहुवचन पाठक-समुदाय के लिए है।
