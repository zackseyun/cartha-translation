translation:
  language: hi
  text: जो उसकी देह है—उसकी परिपूर्णता, अर्थात् उस की जो सब कुछ सब में भरता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “उसकी परिपूर्णता—उस की जो सब कुछ सब में भरता है।”'
    reason: lexical_alternative
  - marker: b
    text: “भरता है” के लिए प्रयुक्त यूनानी रूप का अर्थ “जो भरा जा रहा है” भी लिया जा सकता है, यद्यपि यहाँ अधिकांश व्याख्याकार इसे सक्रिय अर्थ में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἥτις
  choice: जो
  rationale: यह संबंधवाचक सर्वनाम पिछले पद की ‘कलीसिया’ की ओर संकेत करता है। ‘जो’ आधुनिक हिन्दी में स्वाभाविक है; इसका गुणसूचक बल संदर्भ से समझ में आता है।
- source_word: τὸ σῶμα αὐτοῦ
  choice: उसकी देह
  rationale: यह मसीह और कलीसिया के संबंध के लिए पौलुस का स्थापित रूपक है और यूनानी का सीधा अर्थ रखता है।
- source_word: τὸ πλήρωμα
  choice: उसकी परिपूर्णता
  rationale: ‘परिपूर्णता’ शब्द की गहन और विवादित अर्थ-व्याप्ति को बनाए रखता है; ‘उसकी’ संबंधसूचक षष्ठी को स्वाभाविक हिन्दी में स्पष्ट करती है, बिना यह तय किए कि कलीसिया वह है जिसे मसीह भरता है या जो किसी अर्थ में उसकी पूर्णता है।
- source_word: τοῦ ... πληρουμένου
  choice: जो ... भरता है
  rationale: कृदंत का रूप मध्य/कर्मवाच्य है, पर इस संदर्भ में सक्रिय अर्थ सर्वाधिक स्वाभाविक है। संभावित कर्मवाच्य अर्थ पादटिप्पणी में रखा गया है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन की सर्वसमावेशी व्यापकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν πᾶσιν
  choice: सब में
  rationale: यूनानी की संक्षिप्त और अस्पष्ट अभिव्यक्ति को निकटता से सुरक्षित रखता है; इसे केवल ‘हर रीति से’ या ‘हर व्यक्ति में’ तक सीमित नहीं करता।
theological_decisions:
- issue: कलीसिया और मसीह के संबंध में πλήρωμα का अर्थ
  choice: कलीसिया को मसीह की देह और ‘उसकी परिपूर्णता’ कहा गया है; संबंध की सटीक दिशा खुली रखी गई है।
  alternative: ‘वह जिसे मसीह भरता है’ अथवा ‘वह जो मसीह को पूर्ण करती है’
  rationale: यूनानी कई निकटवर्ती अर्थों की अनुमति देता है। अनुवाद किसी एक व्याख्या को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता।
- issue: πληρουμένου का वाच्य और अर्थ
  choice: 'सक्रिय अर्थ: ‘जो सब कुछ सब में भरता है।’'
  alternative: ‘जो सब में सबके द्वारा भरा जाता है’
  rationale: रूपात्मक रूप से मध्य/कर्मवाच्य होने पर भी संदर्भ सक्रिय अर्थ का समर्थन करता है; वास्तविक व्याकरणिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἐν πᾶσιν की व्याख्या
  choice: ‘सब में’
  alternative: ‘हर रीति से’ अथवा ‘सब लोगों में’
  rationale: यह औपचारिक अस्पष्टता को बचाता है और वाक्यांश को रीति या व्यक्तियों में से केवल एक अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप। ‘देह’ और ‘परिपूर्णता’ पौलुस की सघन धार्मिक भाषा को बनाए रखते हैं। ‘सब में’ मूल की जानबूझकर संक्षिप्त और विवादित अभिव्यक्ति को खुला रखता है।
