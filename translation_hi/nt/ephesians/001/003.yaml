id: EPH.1.3
reference: Ephesians 1:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: hi
  text: हमारे प्रभु यीशु मसीह के परमेश्वर और पिता की स्तुति हो! उन्होंने हमें मसीह में स्वर्गीय क्षेत्रों में हर आत्मिक आशीष से आशीष दी है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हर आत्मिक आशीष’ का अनुवाद ‘पवित्र आत्मा से मिलने वाली हर आशीष’ भी हो सकता है। यूनानी विशेषण का अर्थ व्यापक रूप से ‘आत्मिक’ अथवा विशेष रूप से ‘आत्मा से संबंधित’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘स्वर्गीय क्षेत्रों’ का अनुवाद ‘स्वर्गीय स्थानों’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: स्तुति हो
  rationale: यह परमेश्वर के लिए प्रयुक्त स्तुतिपरक उद्घोष है। आधुनिक हिन्दी में ‘स्तुति हो’ स्वाभाविक और गरिमापूर्ण है तथा इसे परमेश्वर को दी जाने वाली आशीष समझने की अस्पष्टता से बचाता है।
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: परमेश्वर और पिता
  rationale: दोनों संज्ञाओं को बनाए रखकर पौलुस की संयुक्त उपाधि और संबंधपरक अर्थ सुरक्षित रखा गया है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος की मसीह-संबंधी उपाधि के लिए ‘प्रभु’ मानक और अर्थानुकूल हिन्दी है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: ‘यीशु’ नाम का प्रचलित हिन्दी रूप है और ‘मसीह’ Χριστός की अभिषिक्त/मसीही उपाधि का अर्थ सुरक्षित रखता है।
- source_word: ὁ εὐλογήσας
  choice: उन्होंने ... आशीष दी है
  rationale: अओरिस्ट कृदंत परमेश्वर के पूर्ण किए हुए, वर्तमान महत्त्व रखने वाले कार्य को व्यक्त करता है; हिन्दी पूर्णकाल इस संदर्भ में स्वाभाविक है।
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: हर आत्मिक आशीष से
  rationale: आशीष देने के साथ हिन्दी में ‘से’ साधन अथवा प्रदत्त वस्तु को स्वाभाविक रूप से व्यक्त करता है। ‘आत्मिक’ विशेषण की व्यापकता बनाए रखता है।
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: स्वर्गीय क्षेत्रों में
  rationale: यह इफिसियों का विशिष्ट बहुवचन-नपुंसकलिंग पद है; ‘स्वर्गीय क्षेत्र’ स्थान मात्र से अधिक एक क्षेत्र या लोक का भाव देता है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: संक्षिप्त पूर्वसर्गीय पद और पौलुस की ‘मसीह में’ धारणा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: ‘यीशु मसीह’ और ‘मसीह में’
  alternative: ‘यीशु ख्रीस्त’ और ‘ख्रीस्त में’
  rationale: ‘मसीह’ हिन्दी में Χριστός की उपाधिगत, अर्थात अभिषिक्त जन की, अर्थवत्ता को स्पष्ट और स्वाभाविक रूप से सुरक्षित रखता है।
- issue: πνευματικῇ का आशय
  choice: आत्मिक
  alternative: पवित्र आत्मा से मिलने वाली / आत्मा की
  rationale: यूनानी विशेषण सामान्यतः ‘आत्मिक’ अथवा विशेष रूप से ‘आत्मा से संबंधित’ हो सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और अधिक विशिष्ट संभावना पादटिप्पणी में दी गई है।
- issue: ἐν τοῖς ἐπουρανίοις का क्षेत्र
  choice: स्वर्गीय क्षेत्रों में
  alternative: स्वर्गीय स्थानों में
  rationale: मूल पद किसी एक ठोस स्थान को निर्दिष्ट नहीं करता; ‘क्षेत्रों’ से उसके बहुवचन और क्षेत्रगत भाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण स्तुतिपरक शैली। मूल यूनानी की लंबी वाक्य-रचना को हिन्दी में स्वाभाविक प्रवाह के लिए दो वाक्यों में बाँटा गया है। ‘आत्मिक’ की वास्तविक अर्थगत व्यापकता और ‘स्वर्गीय क्षेत्रों’ की स्थान/क्षेत्र संबंधी संभावना पादटिप्पणियों में सुरक्षित है।
