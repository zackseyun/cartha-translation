    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ παύομαι
  choice: नहीं छोड़ता
  rationale: वर्तमान काल में चलती रहने वाली क्रिया का भाव है। ‘नहीं छोड़ता’ आधुनिक हिंदी में स्वाभाविक रहते हुए निरंतरता को व्यक्त करता है।
- source_word: εὐχαριστῶν
  choice: धन्यवाद देना
  rationale: यह समकालिक वर्तमान कृदंत है और परमेश्वर को धन्यवाद देने की क्रिया को स्पष्ट रूप से बनाए रखता है।
- source_word: ὑπὲρ ὑμῶν
  choice: तुम्हारे लिए
  rationale: धन्यवाद के इस संदर्भ में ὑπέρ उन लोगों को दर्शाता है जिनके कारण या विषय में धन्यवाद दिया जाता है; ‘तुम्हारे लिए’ इसका स्वाभाविक हिंदी रूप है।
- source_word: μνείαν ποιούμενος
  choice: तुम्हारा उल्लेख करता हूँ
  rationale: यूनानी मुहावरे का शाब्दिक भाव ‘उल्लेख करना’ है। संदर्भ से निहित कर्म ‘तुम्हारा’ स्पष्ट किया गया है, पर इसे केवल ‘याद करना’ बनाकर अर्थ को सीमित नहीं किया गया।
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: अपनी प्रार्थनाओं में
  rationale: यह उस अवसर या क्षेत्र को बताता है जिसमें उल्लेख किया जाता है। ‘अपनी प्रार्थनाओं में’ आधुनिक हिंदी में स्वाभाविक और अर्थ-संगत है।
