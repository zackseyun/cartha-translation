id: EPH.1.5
reference: Ephesians 1:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: προορίσας ἡμᾶς εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ εἰς αὐτόν, κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/005.yaml
  text: having predestined us for adoption through Jesus the Messiah to himself[a], according to the good pleasure of his will[c][b],
translation:
  language: hi
  text: उसने अपनी इच्छा की प्रसन्नता के अनुसार हमें यीशु मसीह[b] के द्वारा अपने लिए[c] पुत्रों के रूप में गोद लेने के लिए[a] पहले से ठहराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गोद लेकर पुत्रों का दर्जा देने के लिए।” यूनानी शब्द गोद लिए जाने के साथ पुत्र का कानूनी और उत्तराधिकारी-संबंधी दर्जा पाने पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: “मसीह” यूनानी पदवी ख्रिस्तोस का अनुवाद है।
    reason: alternative_reading
  - marker: c
    text: या, “अपने पास।” यूनानी पदबंध परमेश्वर की ओर लक्ष्य या अपने लिए किए गए प्रयोजन—दोनों भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προορίσας
  choice: पहले से ठहराया
  rationale: यह προορίζω के ‘पहले से निर्धारित करने’ के अर्थ को बनाए रखता है और विवादित धर्मवैज्ञानिक अर्थ को न तो हल्का करता है, न किसी विशेष मत के अनुसार विस्तार देता है। यूनानी कृदन्त पिछले वाक्य के मुख्य कथन पर निर्भर है; हिन्दी में स्पष्ट और स्वाभाविक वाक्य के लिए इसे सीमित क्रिया के रूप में रखा गया है।
- source_word: εἰς υἱοθεσίαν
  choice: पुत्रों के रूप में गोद ले
  rationale: υἱοθεσία गोद लेकर पुत्र का कानूनी दर्जा देने को सूचित करता है। यह अभिव्यक्ति आधुनिक हिन्दी में समझने योग्य रहते हुए ‘पुत्र’ और उत्तराधिकारी-संबंधी दर्जे की मूल छाया बचाती है।
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह के द्वारा
  rationale: सम्बन्धकारक के साथ διά साधन अथवा माध्यम बताता है। Χριστός को नाम का मात्र अंश मानने के बजाय उसके पदवीगत अर्थ के अनुसार ‘मसीह’ किया गया है।
- source_word: εἰς αὐτόν
  choice: अपने लिए
  rationale: संदर्भ में αὐτόν परमेश्वर की ओर लौटता है। εἰς लक्ष्य या प्रयोजन दोनों व्यक्त कर सकता है; ‘अपने लिए’ यहाँ स्वाभाविक है, जबकि ‘अपने पास’ सम्भव वैकल्पिक अर्थ है।
- source_word: κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ
  choice: अपनी इच्छा की प्रसन्नता के अनुसार
  rationale: κατά को ‘के अनुसार’, εὐδοκία को अनुकूल प्रसन्नता, और θέλημα को सीधे ‘इच्छा’ के रूप में रखा गया है; इसे ‘योजना’ कहकर अर्थ का अनावश्यक विस्तार नहीं किया गया।
theological_decisions:
- issue: प्रοορίσας का धर्मवैज्ञानिक रूप से विवादित अर्थ
  choice: पहले से ठहराया
  alternative: पहले ही निश्चय किया
  rationale: मूल पाठ स्पष्ट रूप से पहले से निर्धारित करने की बात करता है। चुना हुआ रूप इस बल को सुरक्षित रखता है, पर पूर्वनिर्धारण की किसी सम्पूर्ण मत-व्यवस्था को पद में नहीं जोड़ता।
- issue: υἱοθεσία में पुत्र-संबंधी और कानूनी भाव
  choice: पुत्रों के रूप में गोद ले
  alternative: गोद ले; पुत्रत्व प्रदान करे
  rationale: मूल शब्द में ‘पुत्र’ का लैंगिक रूप और कानूनी उत्तराधिकारी-दर्जा निहित है। अनुवाद इसे सुरक्षित रखता है; ‘हमें’ के कारण इसका प्रयोग विश्वासियों के पूरे समुदाय पर लागू रहता है।
- issue: Χριστοῦ का पदवीगत अर्थ
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός पदवी है; ‘मसीह’ उसके अर्थ और हिन्दी की प्रचलित बाइबलीय भाषा दोनों को बनाए रखता है।
- issue: εἰς αὐτόν का लक्ष्य अथवा प्रयोजन
  choice: अपने लिए
  alternative: अपने पास
  rationale: यूनानी पदबंध दोनों छायाएँ ग्रहण कर सकता है। मुख्य पाठ में प्रयोजन का स्वाभाविक हिन्दी रूप रखा गया है और दिशात्मक विकल्प को टिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण रूप अपनाया गया है। वाक्य-क्रम हिन्दी की स्वाभाविकता के लिए बदला गया है, पर कारण, माध्यम, लक्ष्य और परमेश्वर की इच्छा के अनुसार होने के सभी संबंध सुरक्षित हैं। ‘पहले से ठहराया’ स्थापित धर्मवैज्ञानिक शब्दावली से जुड़ता है, फिर भी किसी सम्प्रदायगत व्याख्या को नहीं जोड़ता।
