lexical_decisions:
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन यहाँ समस्त सृष्टि और वस्तुओं की व्यापक समग्रता बताता है; ‘सब कुछ’ आधुनिक हिन्दी में स्वाभाविक है और इस विश्वव्यापी दायरे को बनाए रखता है।
- source_word: ὑπέταξεν
  choice: अधीन कर दिया
  rationale: यह क्रिया किसी को अधीनस्थ स्थिति में रखने का भाव व्यक्त करती है। ‘अधीन कर दिया’ यूनानी क्रिया की सक्रिय और निर्णायक शक्ति को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: उसके पैरों के नीचे
  rationale: शासन और वश में किए जाने की इस शास्त्रीय छवि को शाब्दिक रूप में रखा गया है, क्योंकि यह भजन 8:6 की प्रतिध्वनि है।
- source_word: αὐτὸν ἔδωκεν
  choice: उसे ... दे दिया
  rationale: δίδωμι का मूल अर्थ ‘देना’ है। ‘नियुक्त किया’ जैसे अर्थ-विस्तार के बजाय ‘दे दिया’ यूनानी अभिव्यक्ति और कलीसिया के साथ उसके संबंध—प्राप्तकर्ता अथवा हितग्राही—दोनों की संभावना बनाए रखता है।
- source_word: κεφαλὴν
  choice: सिर के रूप में
  rationale: ‘सिर’ मूल रूपक को बनाए रखता है और यहाँ अधिकार तथा सर्वोच्चता का संकेत देता है; ‘के रूप में’ हिन्दी में विधेयात्मक पूरक को स्पष्ट करता है।
- source_word: ὑπὲρ πάντα
  choice: सब कुछ के ऊपर
  rationale: ὑπέρ यहाँ समस्त वस्तुओं पर सर्वोच्चता या अधिकार व्यक्त करता है। ‘सब कुछ के ऊपर’ इस व्यापक दायरे को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: τῇ ἐκκλησίᾳ
  choice: कलीसिया को
  rationale: सम्प्रदान कारक को पहले प्राप्तकर्ता के अर्थ में ‘कलीसिया को’ दिया गया है। साथ ही, उसके हितार्थ अर्थ की वास्तविक व्याकरणिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: मसीह के सिर होने का संबंध सब कुछ और कलीसिया से
  choice: परमेश्वर ने मसीह को, जो सब कुछ के ऊपर सिर है, कलीसिया को दिया।
  alternative: परमेश्वर ने मसीह को कलीसिया के हित के लिए सब कुछ के ऊपर सिर के रूप में दिया।
  rationale: वाक्य-विन्यास स्वाभाविक रूप से ‘सिर’ को ‘सब कुछ के ऊपर’ से जोड़ता है, जबकि τῇ ἐκκλησίᾳ प्राप्तकर्ता या हितग्राही दोनों हो सकता है। मुख्य पाठ और पादटिप्पणी मिलकर मसीह की सार्वभौमिक सर्वोच्चता तथा कलीसिया के साथ उसके विशेष संबंध को बिना अनावश्यक रूप से तय किए सुरक्षित रखते हैं।
translation_notes:
  register: 'भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सिर’ और ‘पैरों के नीचे’ जैसे मूल बाइबलीय रूपकों को सुरक्षित रखा गया है। ‘कलीसिया’ पौलुस के पत्रों के प्रचलित हिन्दी पारिभाषिक प्रयोग के अनुरूप है। पादटिप्पणी-चिह्न उनके वास्तविक विषयों के पास रखे गए हैं: भजन की प्रतिध्वनि ‘पैरों के नीचे’ पर और सम्प्रदान कारक की वैकल्पिक व्याख्या ‘कलीसिया को’ पर।'
