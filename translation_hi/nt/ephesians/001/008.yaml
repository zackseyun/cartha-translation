translation:
  language: hi
  text: जिसे उसने हर प्रकार की बुद्धि और समझ के साथ हम पर बहुतायत से उंडेल दिया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे उसने हमारी ओर बहुतायत से बढ़ाया।”
    reason: lexical_alternative
  - marker: b
    text: “हर प्रकार की बुद्धि और समझ के साथ” परमेश्वर द्वारा अनुग्रह उंडेलने की रीति को भी बता सकता है, या उस बुद्धि और समझ को जो विश्वासियों को उसके साथ मिली।
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: जिसे
  rationale: यह स्त्रीलिंग सम्बन्धवाचक सर्वनाम पिछले पद की ‘उसके अनुग्रह की भरपूरी’ की ओर संकेत करता है। हिंदी में ‘जिसे’ इस सम्बन्ध को स्वाभाविक ढंग से आगे बढ़ाता है।
- source_word: ἐπερίσσευσεν
  choice: बहुतायत से उंडेल दिया
  rationale: यहाँ क्रिया का सकर्मक/कारक भाव है—परमेश्वर ने अनुग्रह को हमारे लिए प्रचुर किया। ‘बहुतायत से उंडेल दिया’ अतिशय प्रचुरता का रूपक स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: εἰς ἡμᾶς
  choice: हम पर
  rationale: εἰς प्राप्तकर्ताओं की ओर दिशा दर्शाता है। ‘उंडेल दिया’ के साथ ‘हम पर’ सहज है और अनुग्रह के विश्वासियों की ओर आने का भाव रखता है।
- source_word: ἐν πάσῃ σοφίᾳ καὶ φρονήσει
  choice: सारे ज्ञान और समझ सहित
  rationale: ἐν साधन, रीति या साथ जुड़ी विशेषता का संकेत दे सकता है। ‘सहित’ वाक्यांश को परमेश्वर के उंडेलने की रीति अथवा विश्वासियों को मिले ज्ञान-समझ—दोनों से जोड़ने की सम्भावना खुली रखता है।
- source_word: σοφίᾳ
  choice: ज्ञान
  rationale: σοφία के लिए ‘ज्ञान’ सामान्य और पारदर्शी हिंदी शब्द है; यहाँ यह बुद्धिमत्तापूर्ण बोध को व्यक्त करता है।
- source_word: φρονήσει
  choice: समझ
  rationale: φρόνησις व्यावहारिक समझ, सूझ-बूझ या विवेक पर बल देता है। ‘समझ’ आधुनिक पाठकों के लिए सहज है और निकटवर्ती σοφία से कुछ भेद भी बनाए रखता है।
theological_decisions:
- issue: ‘सारे ज्ञान और समझ सहित’ का सम्बन्ध
  choice: वाक्यांश को इस प्रकार रखा गया है कि उसका सम्बन्ध व्याकरणतः खुला रहे।
  alternative: यह या तो परमेश्वर द्वारा अनुग्रह उंडेलने की बुद्धिमान रीति बता सकता है, या विश्वासियों को अनुग्रह के साथ मिले ज्ञान और समझ को।
  rationale: यूनानी रचना दोनों सम्बन्धों की सम्भावना देती है; किसी एक को स्पष्ट करके अनुवाद में थोपना वास्तविक व्याकरणिक और धर्मवैचारिक तनाव को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘बहुतायत से उंडेल दिया’ मूल के प्रचुरता-भाव को मुहावरेदार ढंग से रखता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न सम्मिलित हैं।
