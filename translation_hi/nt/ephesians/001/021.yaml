source:
  edition: SBLGNT
  text: ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/021.yaml
  text: far above every rule and authority and power and dominion[a], and every name that is named[c][b], not only in this age but also in the one to come.
translation:
  language: hi
  text: हर शासन, अधिकार, सामर्थ्य और प्रभुता[a] से, और हर उस नाम से जिसका उल्लेख किया जाता है[b], बहुत ऊपर—न केवल इस युग में, बल्कि आने वाले युग में भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हर प्रधानता, अधिकार, सामर्थ्य और प्रभुता।’ यूनानी शब्द अधिकार की श्रेणियों या क्षेत्रों को सूचित कर सकते हैं, जिनमें ब्रह्माण्डीय या आत्मिक शक्तियाँ भी शामिल हो सकती हैं।
    reason: lexical_alternative
  - marker: b
    text: या, ‘हर उस पदवी से जो दी जाती है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεράνω
  choice: बहुत ऊपर
  rationale: यह शब्द केवल स्थान नहीं, बल्कि श्रेष्ठता और उच्च प्रतिष्ठा व्यक्त करता है; ‘बहुत ऊपर’ उसके प्रबल भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: πάσης ἀρχῆς
  choice: हर एक शासन
  rationale: सन्दर्भ में ἀρχή किसी शासकीय सत्ता या प्रभुता की श्रेणी सूचित करता है। ‘शासन’ अमूर्त/श्रेणीगत अर्थ बनाए रखता है और इसे केवल मानवीय या केवल आत्मिक शासक तक सीमित नहीं करता।
- source_word: ἐξουσίας
  choice: अधिकार
  rationale: यह वैध या प्रयुक्त सत्ता का सामान्य और स्पष्ट हिन्दी रूप है तथा δύναμις से भेद बनाए रखता है।
- source_word: δυνάμεως
  choice: सामर्थ्य
  rationale: ‘सामर्थ्य’ शक्ति या बल की क्षमता को व्यक्त करता है और ‘अधिकार’ से इसका अर्थगत अन्तर स्पष्ट रखता है।
- source_word: κυριότητος
  choice: प्रभुता
  rationale: यह प्रभुत्व या स्वामित्वपूर्ण शासन की श्रेणी को दर्शाता है; ‘प्रभुता’ संक्षिप्त और गरिमापूर्ण है।
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: हर उस नाम से जो लिया जाता है
  rationale: यह यूनानी की नाम/नाम लेने वाली शब्दावली को यथासम्भव बनाए रखता है और अर्थ को केवल पदवी तक सीमित नहीं करता।
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: न केवल ... बल्कि ... भी
  rationale: यह यूनानी सहसम्बन्धी संरचना का स्वाभाविक हिन्दी समानार्थक है।
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: इस युग में
  rationale: αἰών का कालगत अर्थ और आने वाले युग से उसका विरोध सुरक्षित रहता है।
- source_word: ἐν τῷ μέλλοντι
  choice: आने वाले युग में
  rationale: यूनानी में पहले आए αἰών का लोप है; हिन्दी में स्पष्टता के लिए ‘युग’ दोहराना स्वाभाविक है और आशय नहीं बदलता।
theological_decisions:
- issue: ἀρχή, ἐξουσία, δύναμις और κυριότης में उल्लिखित सत्ताओं का स्वरूप
  choice: मुख्य पाठ में इन्हें शासन और सत्ता की व्यापक श्रेणियों के रूप में रखा गया है।
  alternative: इन्हें स्पष्ट रूप से आत्मिक/ब्रह्माण्डीय शक्तियाँ या स्वर्गदूतों की श्रेणियाँ कहना।
  rationale: सन्दर्भ में आत्मिक या ब्रह्माण्डीय शक्तियाँ सम्मिलित हो सकती हैं, पर यूनानी पाठ स्वयं उनके अस्तित्वगत स्वरूप को स्पष्ट नहीं करता; इसलिए अनुवाद उसकी व्यापकता और तनाव बनाए रखता है।
- issue: παντὸς ὀνόματος ὀνομαζομένου में ‘नाम’ का आशय
  choice: ‘नाम’ की व्यापक और कुछ हद तक अलंकारिक अभिव्यक्ति बनाए रखी गई है।
  alternative: इसे केवल ‘हर दी जाने वाली पदवी’ के रूप में स्पष्ट करना।
  rationale: ‘नाम’ पदवी, प्रतिष्ठा, सत्ता या पहचाने जाने वाले किसी भी दर्जे को समेट सकता है; इसे केवल पदवी कहना अर्थ को अनावश्यक रूप से संकरा कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली रखी गई है। पदानुक्रम की तकनीकी व्याख्या थोपे बिना चारों यूनानी सत्ता-शब्दों का भेद यथासम्भव सुरक्षित रखा गया है। वाक्यांश पिछले पद से व्याकरणिक रूप से जुड़ा है, इसलिए अनुवाद खण्ड-वाक्य के रूप में समाप्त होता है।
