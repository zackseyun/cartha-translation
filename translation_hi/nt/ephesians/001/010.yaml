  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: hi
  text: नियत समयों की परिपूर्णता के प्रबंध के लिए—सब कुछ मसीह में समेटने के लिए, अर्थात् स्वर्गों में जो कुछ है और पृथ्वी पर जो कुछ है—उसी में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκονομίαν
  choice: लागू होने वाली व्यवस्था
  rationale: यहाँ शब्द किसी सुव्यवस्थित प्रबंध या व्यवस्था को दर्शाता है। ‘व्यवस्था’ अर्थ को संप्रदायगत व्याख्या से बचाते हुए सहज हिन्दी में व्यक्त करता है; ‘लागू होने वाली’ समय-संबंधी वाक्यांश के साथ इसका संबंध स्पष्ट करता है।
- source_word: πληρώματος τῶν καιρῶν
  choice: निर्धारित समयों के पूरा होने पर
  rationale: καιροί साधारण काल के बजाय उपयुक्त या निर्धारित समयों का बोध करा सकता है, और πλήρωμα उनके पूर्ण हो जाने को। यह रूप शाब्दिक रूप से कठिन ‘समयों की परिपूर्णता’ की अपेक्षा स्वाभाविक हिन्दी है।
- source_word: ἀνακεφαλαιώσασθαι
  choice: समेट दे
  rationale: क्रिया का सार-संकलन या एक केंद्र में लाने का भाव ‘समेट दे’ से स्वाभाविक रूप में आता है। ‘एक सिर के अधीन लाना’ वाला संभावित भाव पादटिप्पणी में सुरक्षित है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: यूनानी नपुंसकलिंग बहुवचन यहाँ समस्त सृष्ट वास्तविकता को व्यापक रूप से समेटता है; ‘सब कुछ’ वर्तमान हिन्दी में व्यापक और सहज है।
- source_word: ἐν τῷ Χριστῷ
  choice: मसीह में
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; हिन्दी में ‘मसीह’ उसका स्थापित और अर्थपूर्ण रूप है।
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς
  choice: चाहे वह स्वर्गों में हो
  rationale: ‘स्वर्गों’ यूनानी बहुवचन को बनाए रखता है और वाक्य को स्वाभाविक हिन्दी में स्थानवाचक अर्थ देता है।
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: या पृथ्वी पर
  rationale: यह स्वर्गीय क्षेत्र के विपरीत पृथ्वी पर स्थित सब कुछ दर्शाता है।
- source_word: ἐν αὐτῷ
  choice: हाँ, उसी में
  rationale: अंतिम दोहराव को छोड़ा नहीं गया है। ‘हाँ’ हिन्दी में उसके बलाघात को स्पष्ट करता है, जबकि ‘उसी में’ सर्वनाम का मसीह की ओर संकेत बनाए रखता है।
theological_decisions:
- issue: Χριστῷ का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ शब्द निजी नाम से अधिक अभिषिक्त जन की उपाधि के रूप में कार्य करता है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और व्यापक रूप से समझा जाता है।
- issue: ἀνακεφαλαιώσασθαι का अर्थ
  choice: सब कुछ मसीह में समेट दे
  alternative: सब कुछ मसीह को सिर बनाकर उसके अधीन एक कर दे
  rationale: यूनानी क्रिया में सार रूप में समेटने और एक सिर के अधीन एकत्र करने, दोनों की छाया संभव है। मुख्य पाठ संक्षिप्त और कम व्याख्यात्मक अर्थ रखता है; सिरत्व का संभावित भाव पादटिप्पणी में दिया गया है।
- issue: ἐν αὐτῷ का अंतिम दोहराव
  choice: हाँ, उसी में
  alternative: दोहराव को हिन्दी में लोप करना
  rationale: यूनानी पाठ मसीह-केंद्रित कथन को अंत में फिर बल देता है। इसे बनाए रखने से धर्मवैचारिक बल सुरक्षित रहता है, भले ही हिन्दी में कुछ पुनरुक्ति सुनाई दे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद मूल वाक्य की निरंतरता में एक उद्देश्यसूचक खंड है, इसलिए अंत में पूर्ण विराम के बजाय स्रोत-संदर्भ के अनुसार इसे अगले विचार से जुड़ा समझा जा सकता है; प्रस्तुत पाठ स्वतंत्र उद्धरण के रूप में पूर्ण विराम के साथ दिया गया है।
