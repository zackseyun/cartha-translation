  yaml_path: translation/nt/ephesians/001/007.yaml
  text: In him we have redemption through his blood[a], the forgiveness of trespasses[b], according to the riches of his grace
translation:
  language: hi
  text: उसमें हमें उसके लहू के द्वारा छुटकारा, अर्थात् अपराधों की क्षमा, प्राप्त है, उसके अनुग्रह की भरपूरी के अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: उसी में
  rationale: सम्बन्धवाचक सर्वनाम पिछले पद के ‘प्रिय’ की ओर संकेत करता है। ‘उसी में’ स्वाभाविक हिन्दी में मसीह के साथ सम्बन्ध में प्राप्त होने वाले उद्धार का भाव बनाए रखता है।
- source_word: ἔχομεν
  choice: हमें ... मिला है
  rationale: यूनानी वर्तमान काल वर्तमान में प्राप्त वास्तविकता व्यक्त करता है। हिन्दी में ‘हमें ... मिला है’ इस प्राप्त और वर्तमान अधिकार को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπολύτρωσιν
  choice: छुटकारा
  rationale: यह शब्द मूल्य चुकाकर बन्धन से मुक्त किए जाने का भाव रखता है। ‘छुटकारा’ सामान्य आधुनिक हिन्दी में बोधगम्य है और मुक्ति का मूल अर्थ बनाए रखता है।
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: उसके लहू के द्वारा
  rationale: διά के साथ सम्बन्धकारक साधन को दर्शाता है। ‘लहू’ मूल पाठ की ठोस बलिदानी और वाचागत छवि को ‘मृत्यु’ कहकर व्याख्यायित किए बिना सुरक्षित रखता है।
- source_word: ἄφεσιν
  choice: क्षमा
  rationale: यहाँ यह अपराधों को छोड़ दिए जाने या माफ किए जाने को व्यक्त करता और ‘छुटकारा’ की व्याख्या करता है। ‘क्षमा’ स्पष्ट, प्रचलित और प्रसंगानुकूल है।
- source_word: παραπτωμάτων
  choice: अपराधों
  rationale: παράπτωμα नैतिक चूक, अनुचित कर्म या उल्लंघन को दर्शाता है। ‘अपराध’ सहज आधुनिक हिन्दी में नैतिक दोष का भाव देता है, बिना इसे केवल कानूनी अर्थ तक सीमित किए।
- source_word: κατὰ τὸ πλοῦτος
  choice: भरपूरी के अनुसार
  rationale: κατά यहाँ माप या मानक व्यक्त करता है। एकवचन πλοῦτος का अर्थ धन-सम्पदा या प्रचुरता है; ‘भरपूरी के अनुसार’ अनुग्रह की अपार मात्रा और उसी के अनुरूप दिए जाने का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: χάριτος
  choice: अनुग्रह
  rationale: पौलुस के प्रयोग में χάρις परमेश्वर की अयोग्य पात्रों पर की गई कृपापूर्ण भलाई का प्रमुख शब्द है। ‘अनुग्रह’ हिन्दी बाइबलीय भाषा में स्थापित और अर्थ की दृष्टि से पर्याप्त है।
theological_decisions:
- issue: ‘छुटकारा’ और ‘अपराधों की क्षमा’ का सम्बन्ध
  choice: दूसरे पदबंध को व्याख्यात्मक समानाधिकरण के रूप में ‘अर्थात्’ से स्पष्ट किया गया
  alternative: ‘छुटकारा, अपराधों की क्षमा’ के रूप में यूनानी संरचना को बिना संयोजक के बनाए रखना
  rationale: दोनों कर्मकारक पदबंध समानाधिकरण में हैं; दूसरा पहले की विषयवस्तु या परिणाम स्पष्ट करता है। हिन्दी में बिना संयोजक के यह संरचना असहज और अस्पष्ट हो सकती है, इसलिए ‘अर्थात्’ कोई नया सिद्धान्त जोड़े बिना निहित व्याकरणिक सम्बन्ध स्पष्ट करता है।
- issue: ‘उसके लहू के द्वारा’ में प्रायश्चित्त की भाषा
  choice: मूल ठोस अभिव्यक्ति ‘उसके लहू के द्वारा’ सुरक्षित रखी गई
  alternative: ‘उसकी मृत्यु के द्वारा’ या ‘उसकी बलिदानी मृत्यु के द्वारा’
  rationale: मूल पाठ स्पष्ट रूप से ‘लहू’ कहता है। इसे ‘मृत्यु’ से बदलना अर्थ की व्याख्या करना और बलिदानी-वाचागत छवि को कम करना होता।
- issue: κατὰ τὸ πλοῦτος की पाठगत और व्याकरणिक असामान्यता
  choice: ‘उसके अनुग्रह की भरपूरी के अनुसार’
  alternative: पाण्डुलिपियों में सामान्यीकृत बहुवचन के आधार पर ‘उसके अनुग्रह के धन के अनुसार’
  rationale: दिए गए SBLGNT पाठ में एकवचन τὸ πλοῦτος है, यद्यपि रूप असामान्य है और परम्परा में बहुवचन सामान्य है। अनुवाद अर्थगत प्रचुरता को व्यक्त करता है, किसी पाठभेद को चुपचाप निर्णायक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लहू’ और ‘अनुग्रह’ जैसे स्थापित धर्मशास्त्रीय शब्द मूल की छवियों और पौलुसी शब्दावली को सुरक्षित रखते हैं; वाक्य की लम्बी यूनानी संरचना को स्पष्ट हिन्दी प्रवाह के लिए डैश से व्यवस्थित किया गया है।
