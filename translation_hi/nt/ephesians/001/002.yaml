  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: hi
  text: तुम्हें हमारे पिता परमेश्वर और प्रभु यीशु मसीहा[a] की ओर से अनुग्रह और शांति मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “यीशु मसीह।” यूनानी शब्द Χριστός उपाधि के रूप में “मसीहा” अथवा कुछ प्रसंगों में नाम-जैसे रूप में “मसीह” समझा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस के अभिवादन में यह सामान्य शुभकामना के साथ परमेश्वर की कृपा का धर्मवैचारिक अर्थ भी रखता है; ‘अनुग्रह’ दोनों पहलुओं को बनाए रखता है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: समुदाय को संबोधित बहुवचन दत्तिव का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: εἰρήνη
  choice: शांति
  rationale: यह सामान्य शांति और यहूदी ‘शालोम’ की व्यापक अनुगूँज—दोनों को व्यक्त कर सकता है।
- source_word: ἀπὸ
  choice: की ओर से
  rationale: यह आशीष के स्रोत को दर्शाता है और हिन्दी अभिवादन में ‘से’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: हमारे पिता परमेश्वर
  rationale: सम्बन्धकारक पदावली को सामानाधिकरण के रूप में प्रस्तुत करता है—परमेश्वर ही ‘हमारे पिता’ हैं—और मूल में न पाए जाने वाले ‘और’ को नहीं जोड़ता।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος की उपाधिगत और मसीह-विषयक शक्ति को बनाए रखने वाला मानक हिन्दी रूप।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीहा
  rationale: Χριστός के अभिषिक्त उद्धारकर्ता की उपाधि होने का अर्थ स्पष्ट करता है; हिन्दी में ‘मसीहा’ बिना किसी अतिरिक्त निश्चयवाचक शब्द के स्वाभाविक है।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστοῦ का रूप
  choice: यीशु मसीहा
  alternative: यीशु मसीह
  rationale: ‘मसीहा’ उपाधि का अर्थ स्पष्ट रखता है, जबकि ‘मसीह’ हिन्दी मसीही प्रयोग में नाम-जैसा भी समझा जा सकता है। मूल यूनानी दोनों प्रकार के प्रयोग की गुंजाइश रखता है, इसलिए प्रचलित विकल्प पादटिप्पणी में दिया गया है।
- issue: θεοῦ πατρὸς ἡμῶν का सम्बन्ध
  choice: हमारे पिता परमेश्वर
  alternative: हमारे परमेश्वर और पिता
  rationale: मूल यूनानी में ‘और’ नहीं है और निकटतम अर्थ सामानाधिकरण है; अतः ऐसा दूसरा समन्वित पद नहीं बनाया गया जो पाठ में स्पष्ट नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। मूल यूनानी में क्रिया नहीं है, पर हिन्दी में पूर्ण और स्वाभाविक आशीर्वचन के लिए ‘मिले’ जोड़ा गया है। ‘तुम्हें’ पूरे विश्वास-समुदाय के लिए बहुवचन संबोधन है।
