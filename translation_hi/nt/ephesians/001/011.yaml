  text: ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: hi
  text: उसी में हम भी उसकी विरासत बनाए गए, क्योंकि हमें उस परमेश्वर के उद्देश्य के अनुसार पहले से ठहराया गया था, जो अपनी इच्छा के विचारपूर्वक किए गए निर्णय के अनुसार सब कुछ करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: उसी में
  rationale: सम्बन्धवाचक सर्वनाम पिछले संदर्भ में मसीह की ओर संकेत करता है। ‘उसी में’ स्वाभाविक हिन्दी में मसीह के साथ सम्बन्ध का भाव बनाए रखता है।
- source_word: ἐκληρώθημεν
  choice: हम भी विरासत ठहराए गए
  rationale: κληρόω का कर्मवाच्य रूप या तो विरासत पाने या परमेश्वर की विरासत/नियत प्रजा बनाए जाने का अर्थ दे सकता है। मुख्य पाठ में दूसरा अर्थ रखा गया है, जबकि वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: προορισθέντες
  choice: हमें ... पहले से ठहराया गया था
  rationale: यह कृदन्त पूर्व-निर्धारण का भाव स्पष्ट करता है। यह हिन्दी अभिव्यक्ति किसी विस्तृत धर्मवैज्ञानिक व्यवस्था को जोड़े बिना मूल अर्थ को व्यक्त करती है।
- source_word: κατὰ πρόθεσιν
  choice: उसके उद्देश्य के अनुसार
  rationale: πρόθεσις यहाँ सोद्देश्य अभिप्राय या योजना को दर्शाता है; ‘उद्देश्य’ निकट और सहज अनुवाद है।
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: जो ... सब कुछ करता है
  rationale: मूल का कृदन्त परमेश्वर को सक्रिय कर्ता के रूप में प्रस्तुत करता है। ‘करता है’ सामान्य पाठक के लिए स्पष्ट है और कार्य की रीति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: यह τὰ πάντα की व्यापकता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: κατὰ τὴν βουλὴν
  choice: निर्णय के अनुसार
  rationale: βουλή सुविचारित संकल्प या निर्णय को व्यक्त करता है। ‘निर्णय’ आधुनिक हिन्दी में सहज है और विचारपूर्वक ठहराए गए संकल्प का भाव रखता है।
- source_word: τοῦ θελήματος αὐτοῦ
  choice: अपनी इच्छा के
  rationale: यह θέλημα के अर्थ और परमेश्वर की इच्छा से βουλή के सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἐκληρώθημεν का अर्थ
  choice: विश्वासियों को परमेश्वर की विरासत अथवा उसकी ठहराई हुई प्रजा बनाया गया।
  alternative: विश्वासियों ने विरासत पाई।
  rationale: कर्मवाच्य क्रिया दोनों अर्थों की अनुमति देती है। परमेश्वर की प्रजा को उसकी विरासत कहने वाली पुराने नियम की पृष्ठभूमि मुख्य पाठ में चुने गए अर्थ का समर्थन करती है, पर दूसरा अर्थ भी पर्याप्त रूप से सम्भव है और इसलिए पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। वाक्य की तर्क-श्रृंखला बनाए रखते हुए हिन्दी में सहजता के लिए कृदन्त को ‘क्योंकि ... ठहराया गया था’ से व्यक्त किया गया है।
