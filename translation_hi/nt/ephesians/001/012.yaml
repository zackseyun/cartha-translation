  text: εἰς τὸ εἶναι ἡμᾶς εἰς ἔπαινον δόξης αὐτοῦ τοὺς προηλπικότας ἐν τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/012.yaml
  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: hi
  text: ताकि हम जो मसीह में पहले से आशा रखते आए हैं[a], उसकी महिमा की स्तुति के लिए हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम जो मसीह में सबसे पहले आशा रखते थे।”
    reason: προηλπικότας में ‘पहले से आशा रखने’ या ‘सबसे पहले आशा करने’—दोनों अर्थों की संभावना है।
lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: ताकि … बनें
  rationale: सव्यय आर्टिक्युलर इनफिनिटिव यहाँ उद्देश्य या परिणाम व्यक्त करता है। हिंदी में ‘ताकि … बनें’ इसके लक्ष्यसूचक बल को स्वाभाविक रूप से प्रकट करता है।
- source_word: ἡμᾶς
  choice: हम
  rationale: यूनानी में यह इनफिनिटिव का कर्मकारक कर्ता है; हिंदी में पुनर्गठित उपवाक्य के कर्ता के रूप में ‘हम’ स्वाभाविक है।
- source_word: εἰς ἔπαινον
  choice: स्तुति का कारण
  rationale: ‘स्तुति के लिए हों’ अधिक शब्दशः है, पर आधुनिक हिंदी में अस्वाभाविक लगता है। ‘स्तुति का कारण बनें’ उद्देश्य/परिणाम को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: δόξης αὐτοῦ
  choice: उसकी महिमा की
  rationale: संबंधकारक रचना और ‘महिमा’ की धर्मवैचारिक गंभीरता दोनों सुरक्षित रखी गई हैं।
- source_word: τοὺς προηλπικότας
  choice: जिन्होंने … पहले से आशा रखी थी
  rationale: पूर्णकालिक कृदंत पूर्ववर्ती आशा और उसकी बनी हुई प्रासंगिकता बताता है। यह अनुवाद कालगत प्राथमिकता रखता है, पर यह तय नहीं करता कि समूह आशा करने वाला पहला समूह था।
- source_word: ἐν τῷ Χριστῷ
  choice: मसीह पर
  rationale: Χριστός को उपाधि के रूप में ‘मसीह’ किया गया है। आशा रखने के साथ हिंदी में ‘पर’ स्वाभाविक है और मसीह को आशा के आधार/केंद्र के रूप में व्यक्त करता है।
theological_decisions:
- issue: क्या προηλπικότας का अर्थ केवल पहले से आशा रखना है या सबसे पहले आशा करने वाला विशिष्ट समूह होना
  choice: मुख्य पाठ में ‘पहले से आशा रखी थी’
  alternative: ‘सबसे पहले मसीह पर आशा रखी थी’
  rationale: προ- पूर्वता सूचित करता है, पर यह स्पष्ट नहीं करता कि पौलुस केवल पहले की आशा की बात कर रहा है या उद्धार-इतिहास में पहले समूह की। मुख्य पाठ सावधान अर्थ रखता है और अधिक विशिष्ट संभावना पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। संबंधवाचक उपवाक्य को अल्पविरामों से अलग नहीं किया गया, क्योंकि वह ‘हम’ की पहचान स्पष्ट करता है, केवल अतिरिक्त सूचना नहीं देता।
