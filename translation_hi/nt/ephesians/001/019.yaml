revisions:
- from: और उसकी सामर्थ्य की वह महानता, जो हम विश्वास करनेवालों की ओर है,[a] कितनी बढ़कर है—उसके बल की शक्ति की सक्रियता के अनुसार।
  to: और हम विश्वास करनेवालों के प्रति उसकी सामर्थ्य की असाधारण महानता कितनी है—उसके बल की शक्ति के कार्य के अनुसार।
  rationale: संशोधन ने ὑπερβάλλον μέγεθος के लिए अधिक स्वाभाविक हिन्दी प्रयोग “असाधारण महानता” अपनाया, εἰς के दिशात्मक/लागू होने के भाव के लिए “के प्रति” रखा, और ἐνέργεια के प्रभावकारी कार्य के अर्थ के लिए “कार्य” किया। शक्ति-संबंधी चार निकटार्थी शब्दों का संचय बनाए रखा गया है, और वैकल्पिक “में” को फुटनोट में रखा गया है।
