review_pass:
  verdict: revise
  source_fidelity: Draft correctly represents the main syntax and preserves the directional force of εἰς ἡμᾶς as well as the accumulation of δύναμις, ἐνέργεια, κράτος, and ἰσχύς. However, “वह महानता ... कितनी बढ़कर है” is not idiomatic Hindi for τὸ ὑπερβάλλον μέγεθος, and “सक्रियता” denotes a quality of being active rather than the effective working denoted by ἐνέργεια.
  naturalness: The proposed revision uses natural modern Hindi while retaining the elevated, prayer-list register. “हम ... के प्रति” is more idiomatic than “हम ... की ओर” for power directed toward persons, without deciding between inward operation and beneficent action.
  terminology: “सामर्थ्य ... कार्य ... शक्ति ... बल” retains the source’s rhetorical sequence of related power terms. “असाधारण महानता” communicates the surpassing/exceeding force of ὑπερβάλλον without importing the stronger idea of immeasurability.
  issues:
  - severity: medium
    issue: The phrase “वह महानता ... कितनी बढ़कर है” is grammatically and stylistically strained.
    rationale: The Greek asks about “the surpassing greatness” of God’s power. Hindi needs the adjectival force to modify “महानता” directly; “असाधारण महानता” is clear and suitably restrained.
  - severity: medium
    issue: “सक्रियता” is not the best rendering of ἐνέργεια in this genitival phrase.
    rationale: ἐνέργεια refers to operative working/activity. “कार्य” more directly conveys effective working and fits the phrase “शक्ति के बल के कार्य के अनुसार.”
  - severity: low
    issue: “हम विश्वास करनेवालों की ओर” is overly literal and awkward Hindi.
    rationale: “हम विश्वास करनेवालों के प्रति” naturally expresses divine power directed toward believers and preserves the source ambiguity better than “में” or “के लिए.”}],
  - severity: low
    issue: Footnote wording should match the revised main-text preposition.
    rationale: The note can retain the literal observation about εἰς while clearly identifying “में” as an alternative interpretive rendering.
