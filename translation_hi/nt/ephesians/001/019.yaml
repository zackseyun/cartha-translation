language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τί τὸ ὑπερβάλλον μέγεθος τῆς δυνάμεως αὐτοῦ εἰς ἡμᾶς τοὺς πιστεύοντας κατὰ τὴν ἐνέργειαν τοῦ κράτους τῆς ἰσχύος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/019.yaml
  text: and what is the surpassing greatness of his power toward us who believe[a], according to the working of the might of his strength
translation:
  language: hi
  text: और हम विश्वास करनेवालों के प्रति उसकी सामर्थ्य की असाधारण महानता कितनी है—उसके बल की शक्ति के कार्य के अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερβάλλον
  choice: बढ़कर
  rationale: यह विशेषणात्मक कृदंत सीमा से आगे निकलने या श्रेष्ठ होने का भाव देता है; ‘बढ़कर’ उस तुलनात्मक बल को बनाए रखता है, बिना ‘असीम’ जैसा अधिक प्रबल अर्थ जोड़े।
- source_word: μέγεθος
  choice: महानता
  rationale: अमूर्त संज्ञा के लिए यह स्वाभाविक, गरिमापूर्ण और सामान्य आधुनिक हिन्दी है।
- source_word: δύναμις
  choice: सामर्थ्य
  rationale: यह प्रभावकारी क्षमता या शक्ति को व्यक्त करता है और आगे आनेवाले κράτος तथा ἰσχύς से शब्दगत भेद बनाए रखने में सहायक है।
- source_word: εἰς ἡμᾶς
  choice: हम ... की ओर
  rationale: εἰς का दिशात्मक भाव सीधे सुरक्षित रहता है; अनुवाद यह तय नहीं करता कि बल केवल विश्वासियों के भीतर कार्यरत है या उनके हित में उनकी ओर लगा हुआ है।
- source_word: τοὺς πιστεύοντας
  choice: विश्वास करनेवालों
  rationale: वर्तमान कृदंत का क्रियात्मक भाव बना रहता है और हिन्दी में स्वाभाविक सुनाई देता है।
- source_word: κατά
  choice: के अनुसार
  rationale: 'यह मानक या अनुरूपता का संबंध व्यक्त करता है: विश्वासियों की ओर सामर्थ्य उसकी प्रभावकारी सक्रियता के अनुरूप है।'
- source_word: ἐνέργεια
  choice: सक्रियता
  rationale: यह प्रभावकारी कार्यशीलता का भाव देता है; केवल ‘कार्य’ की अपेक्षा सक्रिय क्रिया पर बल रखता है और आधुनिक ‘ऊर्जा’ के भ्रामक अर्थ से बचता है।
- source_word: κράτος
  choice: शक्ति
  rationale: यह प्रकट या प्रभावी बल को व्यक्त करता है और ἰσχύς के लिए चुने गए ‘बल’ से संबंधित रहते हुए अलग शब्द बनाए रखता है।
- source_word: ἰσχύς
  choice: बल
  rationale: यह अंतर्निहित ताकत या सामर्थ्य का स्वाभाविक हिन्दी निरूपण है और पौलुस के निकटार्थी शब्दों के संचय को बनाए रखता है।
- source_word: καὶ τί
  choice: और ... कितनी
  rationale: यह पिछले पद की प्रार्थना-सूची को आगे बढ़ाता है; हिन्दी में ‘कितनी’ को विशेषण-समूह के साथ रखना अधिक स्वाभाविक है।
theological_decisions:
- issue: δύναμις / ἐνέργεια / κράτος / ἰσχύς के शक्ति-संबंधी शब्दों का संचय
  choice: 'अलग लेकिन संबंधित शब्दों से संचय बनाए रखा गया: ‘सामर्थ्य ... सक्रियता ... शक्ति ... बल।’'
  alternative: इन्हें समेटकर ‘उसकी पूरी सामर्थ्य का प्रभावकारी काम’ जैसा सरल वाक्य बनाया जा सकता था।
  rationale: मूल पाठ में निकटार्थी शब्दों का जानबूझकर संचय परमेश्वर की सामर्थ्य की विशालता और प्रभावकारिता पर बल देता है; इसे किसी तकनीकी धर्मवैज्ञानिक क्रम में बदले बिना सुरक्षित रखा गया है।
- issue: εἰς ἡμᾶς में परमेश्वर की सामर्थ्य की दिशा
  choice: ‘हम विश्वास करनेवालों की ओर’
  alternative: ‘हम विश्वास करनेवालों में’ अथवा ‘हम विश्वास करनेवालों के लिए’
  rationale: मूल में εἰς है, ἐν नहीं। ‘की ओर’ दिशा को सुरक्षित रखता है और भीतर कार्य करने तथा हित में कार्य करने के बीच अस्पष्टता को अनावश्यक रूप से समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-अनुकूल स्तर रखा गया है। वाक्य को पिछले पद से जुड़ी सूची के रूप में ‘और’ से आरम्भ किया गया है। निकटार्थी शक्ति-शब्दों की कुछ असामान्य घनता मूल की अलंकारिक संरचना के कारण जानबूझकर बनाए रखी गई है।
