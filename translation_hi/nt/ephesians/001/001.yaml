source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ τοῖς ἁγίοις τοῖς οὖσιν ⸂[ἐν Ἐφέσῳ]⸃ καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: hi
  text: 'पौलुस की ओर से, जो परमेश्वर की इच्छा से मसीह यीशु[c] का प्रेरित है—उन पवित्र जनों को, जो [इफिसुस में][a] हैं और मसीह यीशु में विश्वासी[b] हैं:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन हस्तलिपियों में ‘इफिसुस में’ शब्द नहीं हैं। इसलिए सम्भव है कि यह पत्र केवल इफिसुस की कलीसिया के लिए नहीं, बल्कि व्यापक रूप से पढ़े जाने के लिए लिखा गया हो।
    reason: textual_variant
  - marker: b
    text: या, ‘मसीह यीशु में निष्ठावान’; अथवा, ‘मसीह यीशु में विश्वास रखने वाले’।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में ‘ख्रिस्तोस इएसूस’; यहाँ ‘ख्रिस्तोस’ एक उपाधि है, इसलिए उसका अनुवाद ‘मसीह’ किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: प्रेरित
  rationale: यहाँ यह पौलुस के अधिकार और भेजे जाने से जुड़ा आरंभिक मसीही पद है; ‘प्रेरित’ हिन्दी में इसका स्थापित और तकनीकी अर्थ सुरक्षित रखता है।
- source_word: Χριστοῦ Ἰησοῦ / ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु का / मसीह यीशु में
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है, इसलिए ‘मसीह’ रखा गया है; सम्बन्धकारक और ἐν के सम्बन्धात्मक भाव को क्रमशः ‘का’ और ‘में’ से व्यक्त किया गया है।
- source_word: διὰ θελήματος θεοῦ
  choice: परमेश्वर की इच्छा से
  rationale: διά के साथ सम्बन्धकारक यहाँ पौलुस की प्रेरिताई के दैवी आधार और अधिकार को दर्शाता है; ‘इच्छा से’ स्वाभाविक हिन्दी में यही भाव देता है।
- source_word: ἁγίοις
  choice: पवित्र जनों
  rationale: यह परमेश्वर के लिए अलग किए गए समुदाय का संबोधन है। ‘पवित्र जन’ स्रोत के अर्थ को ‘संत’ की अपेक्षा अधिक पारदर्शी ढंग से व्यक्त करता है।
- source_word: τοῖς οὖσιν
  choice: जो … हैं
  rationale: यह कृदन्त प्राप्तकर्ताओं की पहचान कराता है; सीधा और कम व्याख्यात्मक हिन्दी रूप चुना गया है।
- source_word: '[ἐν Ἐφέσῳ]'
  choice: '[इफिसुस में]'
  rationale: स्रोत पाठ में इन शब्दों की पाठालोचनात्मक अनिश्चितता को मुख्य पाठ में वर्ग कोष्ठकों द्वारा सुरक्षित रखा गया है।
- source_word: πιστοῖς
  choice: विश्वासयोग्य
  rationale: πιστός का अर्थ ‘विश्वासयोग्य’ अथवा ‘विश्वासी’ हो सकता है। मुख्य पाठ में विशेषणात्मक अर्थ रखा गया है और दूसरा सम्भव अर्थ पादटिप्पणी में दिया गया है।
- source_word: Παῦλος
  choice: पौलुस
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / क्राइस्ट
  rationale: इस अभिवादन में Χριστός की उपाधिगत शक्ति स्पष्ट है; ‘मसीह’ उस अर्थ को हिन्दी में सीधे सुरक्षित रखता है।
- issue: ἐν Ἐφέσῳ की पाठगत स्थिति
  choice: मुख्य पाठ में [इफिसुस में] को वर्ग कोष्ठकों में रखना
  alternative: शब्दों को छोड़ देना
  rationale: कुछ प्राचीन हस्तलिपियों में ये शब्द नहीं हैं। कोष्ठक और पादटिप्पणी इस वास्तविक पाठगत अनिश्चितता को बिना चुपचाप सुलझाए दिखाते हैं।
- issue: πιστοῖς का अर्थ
  choice: विश्वासयोग्य
  alternative: विश्वासी
  rationale: यूनानी शब्द निष्ठा और विश्वास करने वाले होने—दोनों भाव दे सकता है; मुख्य पाठ एक सम्भावना रखता है और पादटिप्पणी दूसरी को सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। पत्रारम्भ को स्वाभाविक बनाने के लिए ‘पौलुस की ओर से’ और ‘के नाम’ का प्रयोग किया गया है। ‘पवित्र जन’ सामुदायिक संबोधन को स्पष्ट करता है, जबकि पाठगत और शब्दार्थगत अनिश्चितताएँ कोष्ठकों तथा पादटिप्पणियों में सुरक्षित हैं।
