source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/013.yaml
  text: In him[a], you also, after hearing the word of truth, the good news of your salvation, in him, and after believing, were sealed with the Holy Spirit of promise[d][c][b],
translation:
  language: hi
  text: उसी में[a] तुम भी, सत्य का वचन—अपने उद्धार का शुभ समाचार[b]—सुनने और उसी में विश्वास करने के बाद, प्रतिज्ञा किए हुए पवित्र आत्मा[c] से मुहरबंद किए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसमें।”
    reason: सम्बन्धवाचक यूनानी रूप का अधिक शाब्दिक विकल्प।
  - marker: b
    text: या, “अपने उद्धार का सुसमाचार।”
    reason: εὐαγγέλιον के पारम्परिक हिन्दी रूप को सुरक्षित रखना।
  - marker: c
    text: शाब्दिक रूप से, “प्रतिज्ञा के पवित्र आत्मा”; या, “प्रतिज्ञा के आत्मा।”
    reason: τῆς ἐπαγγελίας के संक्षिप्त सम्बन्धकारक पद के निकट विकल्पों को दर्शाना; मुख्य पाठ उसे स्वाभाविक हिन्दी में व्यक्त करता है।
lexical_decisions:
- source_word: ἐν ᾧ
  choice: उसी में
  rationale: सम्बन्धवाचक पद पिछले प्रसंग के मसीह की ओर संकेत करता है और मसीह में होने के पौलुसी भाव को बनाए रखता है।
- source_word: καὶ ὑμεῖς
  choice: तुम भी
  rationale: पिछले पदों के ‘हम’ के साथ पाठकों के सम्मिलित होने का योगात्मक बल सुरक्षित रहता है।
- source_word: ἀκούσαντες
  choice: सुनने ... के बाद
  rationale: अओरिस्ट कृदन्त को मुख्य क्रिया से पूर्व की क्रिया के रूप में स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी कठोर धर्मशास्त्रीय समयक्रम को आरोपित किए।
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: सत्य का वचन
  rationale: λόγος के ‘वचन/सन्देश’ अर्थ और पहचाने जाने योग्य पौलुसी अभिव्यक्ति दोनों को बनाए रखता है।
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: अपने उद्धार का शुभ समाचार
  rationale: εὐαγγέλιον को सामान्य पाठक के लिए सुबोध ‘शुभ समाचार’ से व्यक्त करते हुए उद्धार से उसके सम्बन्ध को सुरक्षित रखता है।
- source_word: πιστεύσαντες
  choice: विश्वास करने के बाद
  rationale: अओरिस्ट कृदन्त का मुख्य क्रिया से पूर्ववर्ती बल स्पष्ट करता है, पर सुनने और विश्वास करने के बीच अनावश्यक अतिरिक्त क्रम निर्धारित नहीं करता।
- source_word: ἐσφραγίσθητε
  choice: मुहरबंद किए गए
  rationale: निष्क्रिय क्रिया और मुहर लगाए जाने, स्वामित्व तथा प्रमाणीकरण की मूल उपमा को संक्षेप में सुरक्षित रखता है।
- source_word: τῷ πνεύματι
  choice: आत्मा से
  rationale: करण अथवा साधन के दातिव भाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अन्य सम्भव सूक्ष्मताओं को अनावश्यक रूप से सीमित नहीं करता।
- source_word: τῆς ἐπαγγελίας τῷ ἁγίῳ
  choice: प्रतिज्ञा के पवित्र आत्मा
  rationale: यूनानी की संक्षिप्त सम्बन्धकारक रचना को निकटता से रखता है; अधिक स्वाभाविक अर्थ ‘प्रतिज्ञा किए हुए पवित्र आत्मा’ को पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: सुनने, विश्वास करने और मुहरबंद किए जाने का सम्बन्ध
  choice: ‘सुनने और ... विश्वास करने के बाद ... मुहरबंद किए गए’
  alternative: ‘जब तुमने सुना और विश्वास किया, तब ... मुहरबंद किए गए’
  rationale: मुख्य क्रिया से पहले आए अओरिस्ट कृदन्त सामान्यतः पूर्ववर्ती क्रिया दिखाते हैं। अनुवाद इतना क्रम सुरक्षित रखता है, पर आत्मा-प्राप्ति के सटीक धर्मशास्त्रीय क्षण पर किसी सम्प्रदायगत निष्कर्ष को आरोपित नहीं करता।
- issue: ἐν ᾧ की दूसरी आवृत्ति का सम्बन्ध
  choice: ‘उसी में विश्वास करने’
  alternative: ‘उसी में रहते हुए, विश्वास करने के बाद’
  rationale: यूनानी पद शाब्दिक रूप से ‘जिसमें’ है और विश्वास से निकट जुड़ा हुआ पढ़ा जा सकता है। हिन्दी में ‘उसी में विश्वास करने’ स्वाभाविक है, जबकि मसीह में होने का स्थानिक/सहभागितामूलक भाव मुख्य वाक्य के आरम्भिक ‘उसी में’ से बना रहता है।
- issue: ‘प्रतिज्ञा के आत्मा’ का अर्थ
  choice: मुख्य पाठ में संक्षिप्त सम्बन्धकारक रूप ‘प्रतिज्ञा के पवित्र आत्मा’
  alternative: ‘प्रतिज्ञा किए हुए पवित्र आत्मा’
  rationale: मूल की सघन और कुछ हद तक खुली रचना को मुख्य पाठ में रखा गया है; सम्भव स्पष्टार्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। ‘तुम’ बहुवचन समुदाय को सम्बोधित करता है। ‘मुहरबंद’ बाइबलीय उपमा को बनाए रखता है; विराम-चिह्न ‘सत्य का वचन’ और ‘अपने उद्धार का शुभ समाचार’ के समानाधिकरण को स्पष्ट करते हैं।
