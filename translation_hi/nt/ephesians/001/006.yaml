lexical_decisions:
- source_word: εἰς ἔπαινον
  choice: ताकि … स्तुति हो
  rationale: यह पदबंध उद्देश्य या परिणाम व्यक्त करता है। हिंदी में यह रचना स्वाभाविक ढंग से उसी भाव को सामने लाती है।
- source_word: δόξης τῆς χάριτος αὐτοῦ
  choice: उसके अनुग्रह की महिमा
  rationale: यह अनुवाद संबंधवाचक यूनानी रचना को बनाए रखता है और χάρις के लिए प्रचलित तथा धर्मवैज्ञानिक रूप से उपयुक्त ‘अनुग्रह’ का प्रयोग करता है।
- source_word: ἧς ἐχαρίτωσεν ἡμᾶς
  choice: उस अनुग्रह की, जिससे उसने हमें … अनुगृहीत किया है
  rationale: ‘अनुग्रह’ और ‘अनुगृहीत’ के माध्यम से χάρις और उसके सजातीय क्रिया-रूप χαριτόω का शब्द-संबंध यथासंभव सुरक्षित रहता है।
- source_word: ἐν τῷ ἠγαπημένῳ
  choice: उस प्रिय में
  rationale: ‘में’ ἐν की मूल व्यापकता को बनाए रखता है; ‘उस प्रिय’ संज्ञा के रूप में प्रयुक्त कृदंत को उपाधि-सदृश ढंग से प्रस्तुत करता है, बिना पद में स्पष्ट न होने वाले ‘पुत्र’ शब्द को मुख्य पाठ में जोड़ने के।
theological_decisions:
- issue: χάρις और χαριτόω के पारस्परिक शब्द-संबंध का अनुवाद
  choice: अनुग्रह … अनुगृहीत किया है
  alternative: कृपा करके हमें स्वीकार किया है / हमें अनुग्रह दिया है
  rationale: चुना हुआ रूप परमेश्वर के अनुग्रह और उसके अनुग्रहपूर्ण कार्य के बीच मूल पाठ के जानबूझकर रखे गए संबंध को बचाता है। फुटनोट अधिक बोलचाल के विकल्प स्पष्ट करता है।
- issue: τῷ ἠγαπημένῳ का मसीह-संबंधी आशय
  choice: उस प्रिय
  alternative: उसके प्रिय पुत्र / जिससे वह प्रेम करता है
  rationale: संदर्भ में यह मसीह को सूचित करता है, पर इस पद में ‘पुत्र’ स्पष्ट रूप से नहीं लिखा है। इसलिए मुख्य पाठ मूल अभिव्यक्ति की उपाधि-सदृश संक्षिप्तता बनाए रखता है और पहचान फुटनोट में बताई जाती है।
- issue: ἐν का संबंध
  choice: में
  alternative: के द्वारा / के साथ एकता में
  rationale: ‘में’ साधन, क्षेत्र या मसीह के साथ संबंध की संभावित अर्थ-छायाओं में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘अनुगृहीत’ अपेक्षाकृत औपचारिक है, पर ‘अनुग्रह’ के साथ मूल यूनानी के शब्द-संबंध को सुरक्षित रखने के लिए उपयुक्त है; उसका सहज अर्थ फुटनोट में दिया गया है।
