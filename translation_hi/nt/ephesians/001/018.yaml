  text: तुम्हारे हृदय की आँखें प्रकाशित हो चुकी हों, ताकि तुम जान सको कि उसके बुलावे की आशा क्या है, और पवित्र जनों के बीच उसकी विरासत की महिमा की संपदा कितनी अपार है[a],[b]
