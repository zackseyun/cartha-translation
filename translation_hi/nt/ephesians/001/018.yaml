- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: ताकि तुम जान सको
  rationale: ग्रीक के प्रयोजनसूचक infinitival construction को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἐλπὶς τῆς κλήσεως αὐτοῦ
  choice: उसके बुलावे से कैसी आशा मिलती है
  rationale: ‘उसका बुलावा’ संबंध को सुरक्षित रखते हुए हिंदी में आशा और बुलावे का संबंध स्पष्ट एवं स्वाभाविक बनाता है, बिना आशा की विषयवस्तु को सिद्धांतगत रूप से सीमित किए।
- source_word: πλοῦτος τῆς δόξης
  choice: महिमा का वैभव
  rationale: πλοῦτος की प्रचुरता और δόξα की धर्मवैचारिक अनुगूँज दोनों को सहज हिंदी में व्यक्त करता है; ‘महिमा का धन’ अधिक शाब्दिक पर कम स्वाभाविक है।
- source_word: τῆς κληρονομίας αὐτοῦ
  choice: उसकी विरासत
  rationale: ग्रीक संबंधकारक की अस्पष्टता बनाए रखता है—यह परमेश्वर की अपनी विरासत अथवा उसके द्वारा दी जाने वाली विरासत, दोनों अर्थों की संभावना खुली छोड़ता है।
- source_word: ἐν τοῖς ἁγίοις
  choice: पवित्र लोगों के बीच
  rationale: ἐν का सामुदायिक अर्थ स्वाभाविक हिंदी में देता है। ‘पवित्र जनों में’ अधिक शाब्दिक विकल्प है और अर्थगत अस्पष्टता के कारण पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ‘उसकी विरासत’ परमेश्वर के लोगों पर उसके अधिकार को दर्शाती है या विश्वासियों को मिलने वाली विरासत को
  choice: उसकी विरासत
  alternative: उसके द्वारा दी जाने वाली विरासत
  rationale: मूल यूनानी संबंधकारक किसी एक व्याख्या को अनिवार्य नहीं करता; इसलिए मुख्य पाठ धर्मवैचारिक तनाव को खुला रखता है।
- issue: ἐν τοῖς ἁγίοις का अर्थ ‘पवित्र लोगों के बीच’ है या ‘पवित्र जनों में’
  choice: पवित्र लोगों के बीच
  alternative: पवित्र जनों में
  rationale: ‘के बीच’ सामुदायिक अर्थ में स्वाभाविक है, जबकि ‘में’ विरासत के लोगों में निहित होने का अर्थ दे सकता है; मूल की संभावना पादटिप्पणी में सुरक्षित है।
