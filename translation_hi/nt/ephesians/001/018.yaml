  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। पद पिछले वाक्य की प्रार्थना पर निर्भर है, इसलिए अंत में अल्पविराम रखा गया है। ‘हृदय की आँखें’ मूल रूपक को सुरक्षित रखता है; ‘पवित्र लोगों’ से सामान्य पाठक के लिए अर्थ स्पष्ट होता है।
