id: EPH.1.4
reference: Ephesians 1:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καθὼς ἐξελέξατο ἡμᾶς ἐν αὐτῷ πρὸ καταβολῆς κόσμου, εἶναι ἡμᾶς ἁγίους καὶ ἀμώμους κατενώπιον αὐτοῦ ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/004.yaml
  text: just as he chose us in him before the foundation of the world[a], to be holy and blameless before him in love[c][b],
translation:
  language: hi
  text: जिस प्रकार उसने हमें जगत की नींव रखे जाने से पहले उसमें चुन लिया, ताकि हम उसके सामने प्रेम में[a] पवित्र और निर्दोष[b] हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘प्रेम में’ को अगले पद के साथ भी जोड़ा जा सकता है: “प्रेम में उसने हमें पहले से ठहराया ...”'
    reason: alternative_reading
  - marker: b
    text: या “निष्कलंक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: जिस प्रकार
  rationale: यह पिछले वाक्य के साथ तुलना और संबंध को बनाए रखता है तथा आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐξελέξατο
  choice: उसने ... चुन लिया
  rationale: यह परमेश्वर के चुनने के अर्थ को स्पष्ट रखता है, पर बाद की किसी विशिष्ट धर्मवैज्ञानिक व्यवस्था का शब्द अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἡμᾶς
  choice: हमें
  rationale: यह क्रिया का सीधा कर्म है और आगे के उद्देश्यवाचक खंड में भी इसी समूह का संकेत करता है।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: यह पौलुस की संक्षिप्त संबंधसूचक अभिव्यक्ति को विस्तार देकर व्याख्यायित किए बिना सुरक्षित रखता है। संदर्भ में सर्वनाम पुत्र की ओर संकेत करता है।
- source_word: πρὸ καταβολῆς κόσμου
  choice: जगत की नींव रखे जाने से पहले
  rationale: यह यूनानी रूपक और उसके स्पष्ट कालगत अर्थ, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἶναι ἡμᾶς
  choice: ताकि हम ... हों
  rationale: अनंत क्रिया वाला खंड उद्देश्य या अभिप्रेत परिणाम व्यक्त कर सकता है। ‘ताकि हम ... हों’ हिन्दी में सहज है और चुने जाने से इस खंड का संबंध स्पष्ट करता है।
- source_word: ἁγίους
  choice: पवित्र
  rationale: यह नैतिक शुद्धता और परमेश्वर के लिए अलग किए जाने, दोनों अर्थछायाओं को बनाए रखने वाला प्रचलित समतुल्य है।
- source_word: ἀμώμους
  choice: निर्दोष
  rationale: यह आधुनिक हिन्दी में सहज है और दोषरहित होने का अर्थ देता है; ‘निष्कलंक’ की अधिक शाब्दिक तथा बलिदान-संबंधी अर्थछाया पादटिप्पणी में दी गई है।
- source_word: κατενώπιον αὐτοῦ
  choice: उसके सामने
  rationale: यह परमेश्वर की उपस्थिति और उसके समक्ष उत्तरदायित्व की संक्षिप्त यूनानी अभिव्यक्ति को सुरक्षित रखता है।
- source_word: ἐν ἀγάπῃ
  choice: प्रेम में
  rationale: यह मूल पदक्रम के निकट रहते हुए वाक्यांश को संक्षिप्त रखता है। इसका पिछले खंड या अगले पद से जुड़ना व्याकरण की दृष्टि से संभव है, इसलिए वैकल्पिक संबंध पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: पूर्वनियति के संदर्भ में ἐξελέξατο को किसी बाद की धर्मवैज्ञानिक प्रणाली के अनुसार अधिक विशिष्ट बना देने की संभावना
  choice: चुन लिया
  alternative: निर्वाचित किया
  rationale: मूल पाठ परमेश्वर के चुनने की बात स्पष्ट रूप से कहता है, लेकिन ‘निर्वाचित’ सामान्य हिन्दी में तकनीकी या संस्थागत अर्थ ला सकता है। ‘चुन लिया’ पाठ का अर्थ रखता है और किसी सम्प्रदायगत निष्कर्ष को नहीं थोपता।
- issue: ἐν ἀγάπῃ का वाक्यगत संबंध
  choice: पद 4 में ‘प्रेम में’ को उसी स्थान के निकट रखना और वैकल्पिक संबंध पादटिप्पणी में बताना
  alternative: 'इसे पद 5 के आरंभ से जोड़ना: ‘प्रेम में उसने हमें पहले से ठहराया...’'
  rationale: यूनानी वाक्यांश पद 4 के पिछले कथन को विशेषित कर सकता है या पद 5 के अगले कथन से जुड़ सकता है। मुख्य पाठ इसे मूल स्थान के निकट रखता है और पादटिप्पणी वास्तविक अस्पष्टता को सुरक्षित रखती है।
- issue: εἶναι ἡμᾶς में उद्देश्य और परिणाम की अर्थछाया
  choice: ताकि हम ... हों
  alternative: कि हम ... हों
  rationale: संदर्भ चुने जाने के अभिप्रेत लक्ष्य को प्रमुखता देता है, पर यूनानी अनंत क्रिया परिणाम की अर्थछाया भी रख सकती है। ‘ताकि’ उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह दावा किए कि दूसरी अर्थछाया असंभव है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जगत की नींव रखे जाने’ से मूल रूपक सुरक्षित रहता है; ‘उसमें’ को व्याख्यात्मक विस्तार दिए बिना रखा गया है।
