source:
  edition: SBLGNT
  text: ⸀ὅ ἐστιν ἀρραβὼν τῆς κληρονομίας ἡμῶν, εἰς ἀπολύτρωσιν τῆς περιποιήσεως, εἰς ἔπαινον τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/014.yaml
  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: hi
  text: वही हमारी विरासत की अग्रिम राशि है, जो उस अर्जित संपत्ति के छुटकारे की ओर है, ताकि उसकी महिमा की स्तुति हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उस अर्जित संपत्ति” का अनुवाद “परमेश्वर की अपनी प्रजा” भी किया जा सकता है।
    reason: τῆς περιποιήσεως में अर्जित अधिकार/संपत्ति का व्यापक अर्थ है, जो प्रसंग में परमेश्वर के अपने लोगों के लिए भी प्रयुक्त हो सकता है।
lexical_decisions:
- source_word: ἀρραβών
  choice: अग्रिम राशि
  rationale: यह किसी भावी पूर्ण प्राप्ति की गारंटी के रूप में अभी दिए गए पहले अंश का अर्थ व्यक्त करता है; आधुनिक हिंदी में 'बयाना' की तुलना में अधिक व्यापक और गरिमापूर्ण है।
- source_word: κληρονομία
  choice: विरासत
  rationale: मसीही समुदाय को भविष्य में मिलने वाले ईश्वरीय भाग या अधिकार के लिए स्वाभाविक आधुनिक हिंदी शब्द।
- source_word: ἀπολύτρωσις
  choice: छुटकारा
  rationale: मूल शब्द में मूल्य देकर मुक्त करने की पृष्ठभूमि है; हिंदी बाइबलीय प्रयोग में 'छुटकारा' सहज और व्यापक रूप से बोधगम्य है।
- source_word: περιποίησις
  choice: अपनी प्रजा
  rationale: यहाँ संज्ञा का आशय परमेश्वर द्वारा अपने लिए अर्जित/सुरक्षित लोगों से समझा गया है; केवल 'सम्पत्ति' मनुष्यों के लिए हिंदी में वस्तुकरण जैसा और अस्पष्ट सुनाई देता।
- source_word: εἰς
  choice: की ओर ले जाती है / ताकि
  rationale: पहला प्रयोग भावी छुटकारे की दिशा या लक्ष्य और दूसरा स्तुति के उद्देश्य/परिणाम को संदर्भानुसार व्यक्त करता है।
theological_decisions:
- issue: ὅ का संबंध और पवित्र आत्मा का व्यक्तित्व
  choice: वही
  alternative: जो
  rationale: पूर्ववर्ती पद के 'प्रतिज्ञा किए हुए पवित्र आत्मा' को संदर्भित करता है। हिंदी में 'वही' वाक्य को स्वतंत्र रूप से स्पष्ट रखता है और आत्मा को केवल निर्जीव साधन की तरह प्रस्तुत नहीं करता।
- issue: τῆς περιποιήσεως का अर्थ
  choice: परमेश्वर की अपनी प्रजा
  alternative: अर्जित सम्पत्ति / अधिकार में ली हुई वस्तु
  rationale: शब्द में प्राप्ति, संरक्षण या निजी अधिकार का भाव हो सकता है। प्रसंग में परमेश्वर के अपने लोगों का सामूहिक अर्थ सबसे स्वाभाविक है, पर वास्तविक शाब्दिक विकल्प फुटनोट में सुरक्षित रखा गया है।
- issue: विरासत का स्वामी कौन है
  choice: हमारी विरासत
  alternative: हम जो परमेश्वर की विरासत हैं
  rationale: व्याकरण में 'हमारी विरासत' वह विरासत है जो हमें मिलनी है; इसे विश्वासियों को परमेश्वर की विरासत बताकर तनाव को उलटना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। पद 13 से संबंध बनाए रखने के लिए आरंभ में 'वही' रखा गया है। 'अग्रिम राशि' कानूनी-व्यावसायिक रूपक को समझने योग्य ढंग से संप्रेषित करती है।
