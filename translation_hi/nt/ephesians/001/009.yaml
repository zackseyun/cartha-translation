revisions:
- from: उसने अपनी इच्छा का रहस्य हम पर प्रकट किया। यह उसके उस शुभ अभिप्राय के अनुसार था, जिसे उसने उसमें[a] ठहराया था।
  to: उसने हमें अपनी इच्छा का रहस्य अपने उस शुभ अभिप्राय के अनुसार प्रकट किया, जिसे उसने उसमें[a] ठाना था।
  rationale: This revision corrects the Hindi expression of the Greek indirect object, improves the idiomatic rendering of προέθετο, and retains the source text’s ambiguity concerning ἐν αὐτῷ in both the main text and footnote. It does not adopt the English audit trail’s resolved reading ‘in himself.’
  reviewer_model: gpt-5.6-terra
