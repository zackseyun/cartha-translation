  text: γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/009.yaml
  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: hi
  text: उसने हमें अपनी इच्छा का रहस्य अपने उस शुभ अभिप्राय के अनुसार प्रकट किया, जिसे उसने उसमें[a] ठाना था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘मसीह में’; कुछ लोग ‘उसमें’ को आत्मवाचक अर्थ में ‘अपने आप में’ समझते हैं।
    reason: ἐν αὐτῷ के संदर्भ की वास्तविक व्याकरणिक और व्याख्यात्मक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: γνωρίσας
  choice: प्रकट किया
  rationale: यूनानी में यह एओरिस्ट कृदंत है और पिछले वाक्य से जुड़ा है। स्वाभाविक हिन्दी में इसे पूर्ण क्रिया के रूप में रखना उसके प्रकट करने के भाव को स्पष्ट करता है, बिना इसे केवल सूचना देने तक सीमित किए।
- source_word: ἡμῖν
  choice: हम पर
  rationale: ज्ञात या प्रकट करने के साथ हिन्दी में ‘हम पर प्रकट किया’ स्वाभाविक रूप से उन लोगों को दर्शाता है जिन्हें रहस्य बताया गया।
- source_word: μυστήριον
  choice: रहस्य
  rationale: यह परमेश्वर की ऐसी योजना का संकेत है जो पहले छिपी थी और अब प्रकट की गई है। ‘रहस्य’ आधुनिक हिन्दी में इस अर्थ को सहजता से व्यक्त करता है।
- source_word: θέλημα
  choice: इच्छा
  rationale: यह θέλημα का सीधा और व्यापक हिन्दी प्रतिरूप है तथा आगे आने वाले προέθετο के उद्देश्य या निश्चय के भाव से भेद बनाए रखता है।
- source_word: κατὰ τὴν εὐδοκίαν αὐτοῦ
  choice: उसके उस शुभ अभिप्राय के अनुसार
  rationale: κατά अनुरूपता दर्शाता है। ‘शुभ अभिप्राय’ εὐδοκία के प्रसन्नतापूर्ण और कृपालु उद्देश्य को व्यक्त करता है तथा ‘इच्छा’ की अनावश्यक पुनरावृत्ति से बचता है।
- source_word: προέθετο
  choice: ठहराया था
  rationale: यह किसी उद्देश्य को अपने सामने रखने या निश्चित करने का भाव देता है। ‘ठहराया था’ दिव्य निश्चय को व्यक्त करता है, पर अनिवार्यतः किसी सार्वजनिक प्रदर्शन का अर्थ नहीं जोड़ता।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: यूनानी सर्वनाम को पारदर्शी रूप से रखा गया है ताकि उसका संदर्भ मुख्य पाठ में जबरन निश्चित न हो। संभावित अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ἐν αὐτῷ का संदर्भ
  choice: मुख्य पाठ में सर्वनाम-सदृश ‘उसमें’ रखा गया है।
  alternative: ‘मसीह में’ अथवा आत्मवाचक अर्थ में ‘अपने आप में’
  rationale: निकटवर्ती संदर्भ के कारण इसे मसीह के विषय में समझा जा सकता है, जबकि कुछ व्याख्याकार इसे परमेश्वर की ओर लौटता आत्मवाचक प्रयोग मानते हैं। मूल की वास्तविक अस्पष्टता को मुख्य पाठ में बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी कृदंत से बनी लंबी संरचना को दो छोटे वाक्यों में बाँटा गया है, पर विचारों का संबंध ‘यह ... के अनुसार था’ से बनाए रखा गया है।
