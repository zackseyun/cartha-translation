  yaml_path: translation/nt/ephesians/005/017.yaml
  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: hi
  text: इस कारण[a] नासमझ न बनो, बल्कि समझो कि प्रभु की इच्छा क्या है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसलिए नासमझ न हो।” यूनानी क्रिया का अनुवाद अवस्था बताने वाले “हो” से भी किया जा सकता है, पर “बनो” उसके किसी अवस्था में आने के भाव को अधिक स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इस कारण
  rationale: यह पद पिछले उपदेश से कारणात्मक और निष्कर्षात्मक संबंध जोड़ता है; ‘इस कारण’ आधुनिक हिन्दी में दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: μὴ γίνεσθε
  choice: न बनो
  rationale: γίνομαι किसी अवस्था में आने या बनने का भाव रखता है। ‘न बनो’ केवल स्थिर अवस्था बताने वाले ‘न हो’ की अपेक्षा इस प्रक्रिया-सूचक अर्थ को बेहतर सुरक्षित रखता है।
- source_word: ἄφρονες
  choice: नासमझ
  rationale: यह शब्द समझ और व्यावहारिक विवेक की कमी बताता है। ‘नासमझ’ अगले आदेश ‘समझो’ के साथ मूल यूनानी का स्पष्ट शब्दार्थ-संबंध बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह नकारात्मक आदेश के विपरीत सकारात्मक आदेश को प्रबलता से रखता है; हिन्दी में ‘बल्कि’ इस सुधारात्मक विरोध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: συνίετε
  choice: समझो
  rationale: संदर्भ में अर्थ किसी बात को ग्रहण करने और उसका विवेकपूर्ण बोध पाने का है; ‘समझो’ स्पष्ट तथा सामान्य हिन्दी है।
- source_word: τί
  choice: क्या
  rationale: यह उस विषयवस्तु का परिचय देता है जिसे समझना है; ‘क्या’ हिन्दी में सीधा और स्वाभाविक रूप है।
- source_word: τὸ θέλημα
  choice: इच्छा
  rationale: θέλημα यहाँ किसी की इच्छा अथवा जो वह चाहता है उसका बोध देता है। ‘इच्छा’ हिन्दी बाइबलीय और सामान्य प्रयोग दोनों में स्पष्ट है।
- source_word: τοῦ κυρίου
  choice: प्रभु की
  rationale: सम्बन्धकारक रचना को हिन्दी में स्वाभाविक रूप से ‘प्रभु की’ कहा गया है। मूल पाठ जिस व्यक्ति को केवल ‘प्रभु’ कहता है, अनुवाद उससे अधिक स्पष्टता नहीं जोड़ता।
theological_decisions:
- issue: τοῦ κυρίου में ‘प्रभु’ का अभिप्रेत व्यक्ति
  choice: मुख्य पाठ में केवल ‘प्रभु’ रखा गया है।
  alternative: ‘प्रभु यीशु’ या ‘परमेश्वर’
  rationale: इफिसियों के निकट संदर्भ में यह उपाधि सम्भवतः यीशु को सूचित करती है, पर इस पद का यूनानी पाठ केवल κυρίου कहता है। इसलिए अनुवाद मूल की अनिर्दिष्टता बनाए रखता है।
- issue: μὴ γίνεσθε के निषेध का बल
  choice: ‘न बनो’
  alternative: ‘न हो’ या ‘नासमझ बने रहना छोड़ दो’
  rationale: ‘न बनो’ किसी अवस्था में आने से रोकने का भाव सुरक्षित रखता है और यह पूर्वधारणा नहीं जोड़ता कि पाठक पहले से पूर्णतः नासमझ हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण उपदेशात्मक शैली। ‘नासमझ/समझो’ का मेल मूल के अर्थगत विरोध को साफ रखता है; वाक्य-संरचना साधारण पाठक के लिए सहज है।
