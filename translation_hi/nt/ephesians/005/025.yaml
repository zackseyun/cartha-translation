id: EPH.5.25
reference: Ephesians 5:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: hi
  text: हे पतियो, अपनी पत्नियों से प्रेम करो, ठीक वैसे ही जैसे मसीह[a] ने भी कलीसिया से प्रेम किया और अपने आप को उसके लिए दे दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ख्रीष्ट।’ यूनानी उपाधि Χριστός का अनुवाद यहाँ ‘मसीह’ किया गया है ताकि उपाधि का अर्थ बना रहे।
    reason: alternative_reading
  - marker: b
    text: या, ‘अपने आप को उसके लिए सौंप दिया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνδρες
  choice: पतियो
  rationale: गृहस्थ-संबंधी प्रसंग और γυναῖκας के साथ युग्मित प्रयोग के कारण यहाँ अर्थ सामान्य ‘पुरुषो’ नहीं, बल्कि ‘पतियो’ है। संबोधन रूप हिंदी में प्रत्यक्ष आज्ञा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀγαπᾶτε / ἠγάπησεν
  choice: प्रेम करो / प्रेम किया
  rationale: दोनों सजातीय यूनानी क्रियाओं के लिए ‘प्रेम’ बनाए रखने से पति की आज्ञा और मसीह के आदर्श के बीच शब्दगत संबंध सुरक्षित रहता है।
- source_word: γυναῖκας
  choice: अपनी पत्नियों से
  rationale: विवाह के प्रसंग में अर्थ ‘पत्नियाँ’ है। हिंदी में ‘अपनी’ संबंध को स्पष्ट और स्वाभाविक बनाता है, और ‘प्रेम करना’ के साथ ‘से’ सामान्य प्रयोग है।
- source_word: καθὼς καὶ
  choice: ठीक वैसे ही जैसे ... ने भी
  rationale: यह तुलना के साथ καί के ‘भी’ वाले बल को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ὁ Χριστός
  choice: मसीह
  rationale: Χριστός यहाँ उपाधि के रूप में है; ‘मसीह’ उसके अभिषिक्त जन वाले अर्थ को सुरक्षित रखता है और हिंदी में स्थापित रूप है।
- source_word: τὴν ἐκκλησίαν
  choice: कलीसिया
  rationale: यहाँ पौलुस परमेश्वर के लोगों के सामूहिक समुदाय की बात करता है। ‘कलीसिया’ हिंदी बाइबलीय भाषा में परिचित और इस संदर्भ में स्पष्ट है।
- source_word: ἑαυτὸν παρέδωκεν
  choice: अपने आप को ... दे दिया
  rationale: यह स्वेच्छापूर्ण आत्म-समर्पण को सहज हिंदी में व्यक्त करता है, पर इस खंड में प्रत्यक्ष रूप से न दिए गए प्रायश्चित-संबंधी विवरण नहीं जोड़ता। अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ὑπὲρ αὐτῆς
  choice: उसके लिए
  rationale: ὑπέρ के ‘के लिए/की ओर से’ अर्थ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है। ‘उसके’ का संदर्भ कलीसिया से है और हिंदी में यूनानी व्याकरणिक लिंग की कृत्रिम नकल से बचता है।
theological_decisions:
- issue: वैवाहिक-कलीसियाई उपमा में Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यूनानी शब्द यहाँ उपाधि के रूप में प्रयुक्त है। ‘मसीह’ उसके अर्थ को बनाए रखता है, जबकि वैकल्पिक पारंपरिक लिप्यंतरण पादटिप्पणी में दिया गया है।
- issue: παρέδωκεν ὑπὲρ αὐτῆς में आत्म-बलिदान का भाव
  choice: अपने आप को उसके लिए दे दिया
  alternative: अपने आप को उसके लिए सौंप दिया
  rationale: मुख्य पाठ स्वैच्छिक आत्मदान का भार बनाए रखता है, पर ‘बलिदान कर दिया’ जैसे अधिक व्याख्यात्मक शब्द नहीं जोड़ता। ‘सौंप दिया’ यूनानी क्रिया का अधिक शाब्दिक विकल्प है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘हे पतियो’ प्रत्यक्ष संबोधन को स्पष्ट करता है; ‘ठीक वैसे ही जैसे’ तुलना को सहज बनाता है। ‘कलीसिया’ स्थापित हिंदी बाइबलीय शब्दावली के अनुरूप है।
