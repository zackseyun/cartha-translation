  yaml_path: translation/nt/ephesians/005/033.yaml
  text: Nevertheless[a], you also—each one individually—must love his own wife as himself[b], and the wife must fear her husband.
translation:
  language: hi
  text: फिर भी, तुम भी—तुम में से हर एक—अपनी पत्नी से उसी प्रकार प्रेम करे जैसे वह अपने आप से करता है, और पत्नी अपने पति का आदर करे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पत्नी अपने पति से डरे।” यहाँ “डरने” का अर्थ भयभीत होना नहीं, बल्कि श्रद्धापूर्ण आदर रखना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: फिर भी
  rationale: यह पिछले विवेचन से उसके व्यावहारिक निष्कर्ष की ओर ले जाने वाले विरोधात्मक-सारांशात्मक संक्रमण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος
  choice: तुममें से हर एक
  rationale: यह संयुक्त अभिव्यक्ति के व्यक्ति-व्यक्ति पर लागू होने वाले वितरणात्मक बल को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है; अलग से ‘तुम भी’ जोड़ना हिन्दी में बोझिल होता।
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: अपनी पत्नी से
  rationale: वैवाहिक प्रसंग में γυνή का अर्थ ‘पत्नी’ है और ἑαυτοῦ का आत्मवाचक भाव ‘अपनी’ से सुरक्षित रहता है। हिन्दी में ‘प्रेम करना’ के साथ ‘से’ स्वाभाविक है।
- source_word: οὕτως ἀγαπάτω ὡς ἑαυτόν
  choice: अपने समान इसी प्रकार प्रेम करे
  rationale: οὕτως का पीछे की ओर संकेत ‘इसी प्रकार’ से और ὡς ἑαυτόν का तुलनात्मक भाव ‘अपने समान’ से सुरक्षित रहता है; ‘करे’ तीसरे पुरुष की आज्ञार्थक प्रेरणा को गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἡ δὲ γυνὴ
  choice: और पत्नी
  rationale: δέ यहाँ युग्मित उपदेश के दूसरे भाग को प्रस्तुत करता है; ‘और’ हिन्दी में प्रवाहपूर्ण है, जबकि ‘पत्नी’ वैवाहिक संदर्भ को ठीक रखता है।
- source_word: ἵνα φοβῆται τὸν ἄνδρα
  choice: अपने पति का आदर करे
  rationale: φοβέομαι का मूल अर्थ ‘डरना’ हो सकता है, पर इस वैवाहिक संदर्भ में सम्मानपूर्ण श्रद्धा अभिप्रेत है। ‘आदर करे’ आधुनिक हिन्दी में भय या आतंक का भ्रामक अर्थ उत्पन्न किए बिना यह संबंधपरक भाव व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: वैवाहिक उपदेश में φοβῆται का अर्थ
  choice: आदर करे
  alternative: डरे / भय माने
  rationale: क्रिया में भय और श्रद्धापूर्ण सम्मान दोनों अर्थ-संभावनाएँ हैं। प्रसंग पत्नी को आतंकित होने का आदेश स्पष्टतः नहीं देता; इसलिए मुख्य पाठ में ‘आदर करे’ अर्थ को संप्रेषित करता है, जबकि पादटिप्पणी मूल शब्द की व्यापकता और अधिक शाब्दिक रूप को सुरक्षित रखती है।
- issue: पति-पत्नी के लिए लिंग-विशिष्ट एकवचन
  choice: अपनी पत्नी ... पत्नी ... अपने पति
  alternative: अपने जीवनसाथी
  rationale: यूनानी पाठ पति और पत्नी के लिए लिंग-विशिष्ट एकवचन रूपों का प्रयोग करता है; अनुवाद उस विशिष्टता को निष्प्रभावी नहीं करता।
- issue: पति के प्रेम की तुलना
  choice: अपने समान
  alternative: जैसा वह अपने आप से प्रेम करता है
  rationale: संक्षिप्त आत्मवाचक तुलना मूल पाठ की वास्तविक अभिव्यक्ति और पिछले प्रसंग से उसके तनाव को बिना अनावश्यक व्याख्या के बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘तुममें से हर एक’ वितरणात्मक बल रखता है, ‘इसी प्रकार’ पिछले पदों की ओर संकेत बनाए रखता है, और एकमात्र पादटिप्पणी φοβῆται की वास्तविक शब्दार्थगत व्यापकता स्पष्ट करती है।
