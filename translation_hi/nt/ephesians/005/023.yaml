source:
  edition: SBLGNT
  text: ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, ⸀αὐτὸς σωτὴρ τοῦ σώματος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: hi
  text: क्योंकि पति पत्नी का सिर[a] है, जैसे मसीह भी कलीसिया का सिर है; वही शरीर का उद्धारकर्ता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सिर’ यूनानी रूपक को बनाए रखता है। यहाँ इसका आशय अधिकार, प्रमुखता या स्रोत के रूप में अलग-अलग समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले उपदेश का आधार या कारण बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀνήρ / γυνή
  choice: पति / पत्नी
  rationale: घरेलू और वैवाहिक संदर्भ में ये शब्द सामान्य ‘पुरुष / स्त्री’ नहीं, बल्कि पति और पत्नी के संबंध को सूचित करते हैं।
- source_word: κεφαλή
  choice: सिर
  rationale: यूनानी रूपक को ज्यों का त्यों रखा गया है, ताकि इसे केवल ‘अधिकारी’, ‘अगुवा’ या ‘स्रोत’ कहकर विवादित अर्थ को मुख्य पाठ में निश्चित न किया जाए।
- source_word: ὡς καὶ
  choice: जैसे ... भी
  rationale: यह पति-पत्नी और मसीह-कलीसिया के संबंधों के बीच तुलना को स्पष्ट रखते हुए दोनों को पूर्णतः समान नहीं ठहराता।
- source_word: Χριστός
  choice: मसीह
  rationale: ‘मसीह’ हिन्दी में प्रचलित उपाधि है और यहाँ यूनानी शब्द के अभिषिक्त जन अथवा Messiah वाले अर्थ को व्यक्त करता है।
- source_word: ἐκκλησία
  choice: कलीसिया
  rationale: पौलुस के इस संदर्भ में यह विश्वासियों के समुदाय के लिए स्थापित और सुबोध हिन्दी धार्मिक शब्द है।
- source_word: αὐτός
  choice: वही
  rationale: यह जोरदार सर्वनाम है; ‘वही’ उद्धारकर्ता की भूमिका को विशेष रूप से मसीह से जोड़ता है।
- source_word: σωτήρ
  choice: उद्धारकर्ता
  rationale: यह बचाने और उद्धार देने, दोनों भावों को समेटने वाला मानक हिन्दी समतुल्य है।
- source_word: σῶμα
  choice: शरीर
  rationale: कलीसिया के लिए पौलुस के शरीर-रूपक को बनाए रखा गया है; मूल में ‘उसका’ स्पष्ट रूप से नहीं है, इसलिए उसे नहीं जोड़ा गया।
theological_decisions:
- issue: पति-पत्नी और मसीह-कलीसिया की तुलना में κεφαλή का अर्थ
  choice: मुख्य पाठ में ‘सिर’ का रूपक बनाए रखना
  alternative: स्रोत; अगुवा; अधिकारी
  rationale: शब्द का आशय व्याख्यात्मक रूप से विवादित है। रूपक को बनाए रखने से अनुवाद किसी एक धर्मवैज्ञानिक निष्कर्ष को चुपचाप पाठ में नहीं डालता।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट; क्राइस्ट
  rationale: यहाँ शब्द उपाधि के रूप में सक्रिय है; ‘मसीह’ आधुनिक हिन्दी में उसका अर्थ और बाइबलीय पहचान दोनों सुरक्षित रखता है।
- issue: αὐτὸς σωτὴρ τοῦ σώματος की संरचना
  choice: ‘वही शरीर का उद्धारकर्ता है’ को पूर्व कथन से डैश द्वारा जोड़ना
  alternative: ‘और वह स्वयं शरीर का उद्धारकर्ता है’; ‘वह शरीर का उद्धारकर्ता होकर’
  rationale: मूल की संक्षिप्त, जोरदार समानाधिकरणात्मक संरचना को रखा गया है और ऐसा कृदंतीय अर्थ नहीं जोड़ा गया जो यूनानी में नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘कलीसिया’, ‘मसीह’ और ‘उद्धारकर्ता’ जैसे स्थापित बाइबलीय शब्द प्रयुक्त हैं। वाक्य की तुलना और जोर को स्वाभाविक हिन्दी क्रम में सुरक्षित रखा गया है।
