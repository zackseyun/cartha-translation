id: EPH.5.24
reference: Ephesians 5:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: hi
  text: परन्तु जैसे कलीसिया मसीह के अधीन रहती है, वैसे ही पत्नियाँ भी हर बात में अपने पतियों के अधीन रहती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: परन्तु
  rationale: यह पिछले कथन से विरोध और विषय की पुनः प्रस्तुति को दर्शाता है; गरिमापूर्ण आधुनिक हिन्दी में ‘परन्तु’ स्वाभाविक है।
- source_word: ὡς ... οὕτως καὶ
  choice: जैसे ... वैसे ही ... भी
  rationale: यूनानी की सहसंबंधी तुलना-संरचना को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἡ ἐκκλησία
  choice: कलीसिया
  rationale: पौलुस के इस संदर्भ में यह मसीही समुदाय को सूचित करता है; ‘कलीसिया’ प्रचलित और संदर्भानुकूल हिन्दी पद है।
- source_word: ὑποτάσσεται
  choice: के अधीन रहती है
  rationale: मध्य/कर्मवाच्य रूप व्यवस्थित अधीनता का भाव देता है। यह चयन क्रिया में बलपूर्वक दबाए जाने का अतिरिक्त भाव जोड़े बिना संबंधपरक अर्थ व्यक्त करता है।
- source_word: τῷ Χριστῷ
  choice: मसीह के
  rationale: Χριστός यहाँ पदवी के रूप में प्रयुक्त है। ‘मसीह’ हिन्दी में इस पदवी का स्थापित रूप है और ‘के अधीन’ के साथ स्वाभाविक संबंध बनाता है।
- source_word: αἱ γυναῖκες
  choice: पत्नियाँ
  rationale: गृहस्थी-संबंधी प्रसंग और ἀνδράσιν के साथ युग्म के कारण यहाँ सामान्य ‘स्त्रियाँ’ नहीं, बल्कि ‘पत्नियाँ’ अभिप्रेत हैं।
- source_word: τοῖς ἀνδράσιν
  choice: अपने पतियों के
  rationale: गृहस्थी के संदर्भ में ἀνήρ का अर्थ ‘पति’ है। हिन्दी में ‘अपने’ वैवाहिक संबंध को स्वाभाविक रूप से स्पष्ट करता है, यद्यपि यूनानी में अधिकारवाचक सर्वनाम अलग से नहीं है।
- source_word: ἐν παντί
  choice: हर बात में
  rationale: यह पदबंध की व्यापकता को बिना किसी व्याख्यात्मक सीमा या योग्यता जोड़े सहज हिन्दी में सुरक्षित रखता है।
- source_word: '[ellipsis in second clause]'
  choice: अधीन रहती हैं
  rationale: दूसरे उपवाक्य में यूनानी क्रिया दोहराई नहीं गई, पर वह पहले उपवाक्य से स्पष्ट रूप से समझी जाती है। हिन्दी में पूर्ण और स्वाभाविक वाक्य के लिए इसे बहुवचन रूप में दोहराया गया है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ शब्द पदवी का कार्य करता है; ‘मसीह’ हिन्दी में उस पदवी का स्थापित और व्यापक रूप से समझा जाने वाला अनुवाद है।
- issue: वैवाहिक अधीनता वाले कथन का विस्तार
  choice: ‘हर बात में’ को बिना किसी अतिरिक्त सीमा के बनाए रखना
  alternative: ‘हर उचित बात में’ या ‘जो उचित हो उसमें’ जैसी व्याख्यात्मक वृद्धि
  rationale: यूनानी पाठ केवल ἐν παντί कहता है। अनुवाद में अतिरिक्त सीमाएँ जोड़ना इस पद में उपस्थित तनाव को व्याख्या द्वारा हल कर देना होता।
- issue: दूसरे उपवाक्य की लुप्त क्रिया
  choice: पहले उपवाक्य से ‘अधीन रहती हैं’ की पूर्ति
  alternative: क्रिया को छोड़कर यूनानी दीर्घवृत्त का शब्दशः अनुकरण
  rationale: यूनानी में क्रिया पहले उपवाक्य से सहज रूप से ग्रहण होती है, जबकि हिन्दी में उसे पूरी तरह छोड़ने पर वाक्य अस्वाभाविक और अधूरा लगेगा। पूर्ति वही अर्थ दोहराती है और नया आदेशात्मक भाव नहीं जोड़ती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अधीन रहती है/हैं’ में समानांतरता बनाए रखकर यूनानी तुलना स्पष्ट की गई है। ‘आज्ञा मानती है’ नहीं चुना गया, क्योंकि वह ὑποτάσσομαι को आज्ञापालन के अपेक्षाकृत संकरे अर्थ में बदल सकता है।
