  text: καὶ μὴ μεθύσκεσθε οἴνῳ, ἐν ᾧ ἐστιν ἀσωτία, ἀλλὰ πληροῦσθε ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/018.yaml
  text: And do not get drunk with wine[a], in which there is debauchery, but be filled with the Spirit,
translation:
  language: hi
  text: और दाखमधु पीकर मतवाले न बनो, जिसमें उच्छृंखलता है; बल्कि पवित्र आत्मा से परिपूर्ण होते जाओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आत्मा में।” कुछ लोग इसका अधिक सामान्य अर्थ “आत्मिक रूप से” या “अपनी आत्मा में” समझते हैं।
    reason: πνεύματι बिना निश्चित उपपद के है, और ἐν साधन या क्षेत्र दोनों का भाव दे सकता है; इसलिए पवित्र आत्मा तथा मानवीय आत्मा/आत्मिक दशा से जुड़े विकल्प उल्लेखनीय हैं।
lexical_decisions:
- source_word: μεθύσκεσθε
  choice: मतवाले न बनो
  rationale: μή के साथ वर्तमानकालिक आज्ञार्थक रूप निषेध व्यक्त करता है। ‘मतवाले न बनो’ प्रक्रिया और परिणामी दशा दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἴνῳ
  choice: दाखमधु पीकर
  rationale: यह संबंध उस पदार्थ अथवा साधन को दर्शाता है जिससे नशा होता है। ‘पीकर’ हिन्दी में अर्थ को स्पष्ट और सहज बनाता है; ‘दाखमधु’ मदिराजनक wine को अपेक्षाकृत सटीक बताता है।
- source_word: ἐν ᾧ
  choice: इसमें
  rationale: सर्वनाम निकटवर्ती दाखमधु से उत्पन्न मतवालेपन अथवा उससे जुड़ी दशा की ओर संकेत कर सकता है। ‘इसमें’ यूनानी संबंध की संक्षिप्तता और कुछ संदर्भगत लचीलेपन को बनाए रखता है।
- source_word: ἀσωτία
  choice: उच्छृंखलता
  rationale: यह शब्द अपव्ययी, अनियंत्रित और नैतिक संयम से रहित आचरण को सूचित करता है। ‘उच्छृंखलता’ आधुनिक हिन्दी में इसका नैतिक बल बनाए रखती है।
- source_word: πληροῦσθε
  choice: भरते जाओ
  rationale: वर्तमानकालिक कर्मवाच्य आज्ञार्थक रूप निरंतर अथवा बार-बार होने वाली क्रिया का भाव दे सकता है। ‘भरते जाओ’ उस पहलू को स्वाभाविक हिन्दी में व्यक्त करता है और कर्ता द्वारा भरने का अर्थ नहीं देता।
- source_word: ἐν πνεύματι
  choice: आत्मा से
  rationale: πληροῦσθε के साथ ἐν + चतुर्थी साधन, क्षेत्र अथवा भरने वाले प्रभाव का संकेत दे सकता है। ‘आत्मा से’ पवित्र आत्मा के संभावित संदर्भ और wine के साथ विरोध को स्वाभाविक हिन्दी में रखता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: πνεύματι का संदर्भ
  choice: आत्मा (पवित्र आत्मा)
  alternative: आत्मा में; आत्मिक रूप से; अपनी आत्मा में
  rationale: पौलुस के निकट संदर्भ में इसे पवित्र आत्मा का उल्लेख समझना सबसे संभावित है, यद्यपि यूनानी में निश्चित उपपद नहीं है। इसलिए मुख्य पाठ में ‘आत्मा’ रखा गया है और वास्तविक व्याकरणिक/अर्थगत विकल्प पादटिप्पणी में सुरक्षित हैं।
- issue: ἐν πνεύματι में ἐν का संबंध
  choice: आत्मा से
  alternative: आत्मा में
  rationale: यह वाक्यांश साधन, क्षेत्र या प्रभाव का भाव दे सकता है। मुख्य पाठ में सहज हिन्दी ‘से’ चुना गया है, पर ‘में’ को पादटिप्पणी में रखा गया है ताकि अर्थगत तनाव दबाया न जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘दाखमधु’ सामान्य ‘शराब’ से अधिक स्रोत-विशिष्ट है, और ‘उच्छृंखलता’ ἀσωτία के नैतिक तथा अनियंत्रित आचरण के भाव को व्यक्त करती है। मुख्य पाठ में पादटिप्पणी-सूचक [a] अनिवार्य रूप से शामिल है।
