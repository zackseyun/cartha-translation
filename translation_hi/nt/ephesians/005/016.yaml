lexical_decisions:
- source_word: ἐξαγοραζόμενοι
  choice: पूरा लाभ उठाओ
  rationale: मूल क्रिया में ‘मोल लेकर अपने लिए कर लेना’ का बिंब है, पर इस उपदेशात्मक संदर्भ में इसका मुहावरेदार अर्थ उपलब्ध समय या अवसर का सर्वोत्तम उपयोग करना है। हिंदी में ‘पूरा लाभ उठाओ’ स्वाभाविक रूप से यही अर्थ देता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: τὸν καιρόν
  choice: समय
  rationale: καιρός किसी उपयुक्त समय या अवसर को सूचित कर सकता है। मुख्य पाठ में ‘समय’ संक्षिप्त और परिचित है, जबकि ‘अवसर’ की अर्थ-छाया पादटिप्पणी में दी गई है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण प्रस्तुत करता है; आधुनिक हिंदी में ‘क्योंकि’ इसका स्पष्ट समतुल्य है।
- source_word: αἱ ἡμέραι
  choice: दिन
  rationale: बहुवचन संज्ञा को औपचारिक रूप से बनाए रखा गया है; संदर्भ वर्तमान परिस्थितियों या युग की ओर संकेत कर सकता है, पर मुख्य पाठ में व्याख्यात्मक विस्तार नहीं किया गया।
- source_word: πονηραί
  choice: बुरे
  rationale: यह शब्द दिनों को नैतिक रूप से दुष्ट या प्रतिकूल बताता है। ‘बुरे’ स्वाभाविक हिंदी में इस व्यापक अर्थ को बनाए रखता है; केवल ‘कठिन’ कहना नैतिक आयाम को कमजोर कर देता।
theological_decisions:
- issue: ἐξαγοραζόμενοι को उद्धार-संबंधी भाषा समझे जाने की संभावना
  choice: समय या अवसर का पूरा उपयोग करने का व्यावहारिक उपदेश
  alternative: समय को छुड़ा लो / मोल ले लो
  rationale: इस उपदेशात्मक संदर्भ में क्रिया का आशय उपलब्ध समय या अवसर का बुद्धिमानी से उपयोग करना है, न कि स्पष्ट रूप से प्रायश्चित या उद्धार की शिक्षा देना। फिर भी मूल रूपक को पादटिप्पणी में रखा गया है।
