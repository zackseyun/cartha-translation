- from: और अश्लीलता, मूर्खतापूर्ण बातें या भद्दा मज़ाक[a] न हों, क्योंकि ये उचित नहीं हैं[b]; बल्कि धन्यवाद दिया जाए।
  to: और अश्लीलता, मूर्खतापूर्ण बातें या भद्दा मज़ाक[a]—जो उचित नहीं हैं[b]—न हों; बल्कि धन्यवाद हो।
  rationale: Revision replaces the causal connector with a relative clause corresponding to ἃ οὐκ ἀνῆκεν and retains εὐχαριστία as the noun “धन्यवाद.” The contextual prohibition is still made explicit through “न हों,” consistent with the surrounding discourse, while the contrast is expressed without adding an unnecessary passive construction.
