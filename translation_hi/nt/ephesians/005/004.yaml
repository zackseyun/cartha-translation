source:
  edition: SBLGNT
  text: καὶ αἰσχρότης καὶ μωρολογία ἢ εὐτραπελία, ⸂ἃ οὐκ ἀνῆκεν⸃, ἀλλὰ μᾶλλον εὐχαριστία.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/004.yaml
  text: And obscenity and foolish talk or crude joking[a], which are not fitting[b], but rather thanksgiving.
translation:
  language: hi
  text: और अश्लीलता, मूर्खतापूर्ण बातें या भद्दा मज़ाक[a]—जो उचित नहीं हैं[b]—न हों; बल्कि धन्यवाद हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अशोभनीय ठट्ठा।’ यूनानी शब्द εὐτραπελία सामान्य रूप से हाज़िरजवाबी या चतुर विनोद को भी दर्शा सकता है, पर यहाँ अनुचित वाणी के साथ रखे जाने के कारण इसका प्रयोग नकारात्मक अर्थ में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जो शोभनीय नहीं हैं’ अथवा ‘जो उपयुक्त नहीं हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχρότης
  choice: अश्लीलता
  rationale: यह शब्द लज्जाजनक या अभद्र व्यवहार/अभिव्यक्ति को दर्शाता है। निकटवर्ती वाणी-संबंधी शब्दों के कारण यहाँ ‘अश्लीलता’ स्वाभाविक रूप से अशोभनीय अभिव्यक्ति का भाव देती है, फिर भी इसे केवल किसी एक प्रकार की गाली तक सीमित नहीं करती।
- source_word: μωρολογία
  choice: मूर्खतापूर्ण बातें
  rationale: यह यौगिक शब्द मूर्ख या निरर्थक ढंग की वाणी को बताता है। यह चयन आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: ἢ
  choice: या
  rationale: यह सूची की अंतिम मद को जोड़ता है; ‘या’ यूनानी संयोजक का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: εὐτραπελία
  choice: भद्दा मज़ाक
  rationale: अन्य संदर्भों में यह शब्द चतुर विनोद का अर्थ दे सकता है, पर यहाँ दोषों की सूची और ‘उचित नहीं’ के साथ होने के कारण इसका नकारात्मक अर्थ है। ‘भद्दा मज़ाक’ अनुचित या अशोभनीय हास्य को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: ἃ οὐκ ἀνῆκεν
  choice: क्योंकि ये उचित नहीं हैं
  rationale: नपुंसकलिंग बहुवचन सम्बन्धवाचक सर्वनाम पिछली तीन बातों को सामूहिक रूप से संदर्भित करता है। हिन्दी में कारणसूचक उपवाक्य अर्थ-संबंध को स्वाभाविक बनाता है, जबकि ‘उचित नहीं’ नैतिक अनुपयुक्तता को बनाए रखता है।
- source_word: ἀλλὰ μᾶλλον
  choice: बल्कि
  rationale: यह निषिद्ध वाणी और उसके सकारात्मक विकल्प के बीच प्रबल विरोध व्यक्त करता है; हिन्दी में ‘बल्कि’ इस सुधारात्मक विरोध को संक्षेप में व्यक्त करता है।
- source_word: εὐχαριστία
  choice: धन्यवाद दिया जाए
  rationale: संज्ञा का मूल भाव धन्यवाद की अभिव्यक्ति है। हिन्दी में क्रियात्मक रूप ‘धन्यवाद दिया जाए’ पिछले निषेध के समानांतर अपेक्षित सकारात्मक वाणी को अधिक स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: दोष-सूची का वाणी से संबंध
  choice: तीनों पदों को मुख्यतः अशोभनीय वाणी के संदर्भ में प्रस्तुत किया गया है, जिसके विपरीत धन्यवाद की वाणी रखी गई है।
  alternative: αἰσχρότης को वाणी तक सीमित किए बिना व्यापक नैतिक लज्जाजनकता या अभद्र आचरण मानना।
  rationale: μωρολογία और εὐτραπελία स्पष्टतः वाणी से संबंधित हैं और उनके विपरीत εὐχαριστία है। फिर भी ‘अश्लीलता’ में अभिव्यक्ति और व्यवहार दोनों की कुछ व्यापकता बनी रहती है, जिससे मूल की सीमा को अत्यधिक संकीर्ण नहीं किया गया।
- issue: εὐτραπελία का नैतिक मूल्यांकन
  choice: मुख्य पाठ में नकारात्मक अर्थ के साथ ‘भद्दा मज़ाक’।
  alternative: ‘हाज़िरजवाबी’ या ‘चतुर विनोद’।
  rationale: दोषों की सूची तथा ‘ये उचित नहीं हैं’ यह स्पष्ट करते हैं कि इस संदर्भ में शब्द प्रशंसनीय चतुराई नहीं, बल्कि अनुचित हास्य को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मज़ाक’ प्रचलित आधुनिक हिन्दी है; ‘भद्दा’ संदर्भ की नैतिक नकारात्मकता बताता है। वाक्य में पहले निषेध और फिर ‘बल्कि’ से सकारात्मक विकल्प रखा गया है।
