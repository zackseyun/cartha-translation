theological_decisions:
- issue: ψάλλοντες और संगीत-प्रथा का संबंध
  choice: ‘मधुर गान करते’ कहा गया है, बिना वाद्य-संगत निर्दिष्ट किए।
  alternative: ‘स्तुति गाते’ या ‘वाद्य बजाते’
  rationale: कोइने यूनानी में यह क्रिया स्तुति गाने या संगीत उत्पन्न करने का अर्थ दे सकती है, पर यहाँ वाद्य का प्रयोग अनिवार्य नहीं करती; अतः किसी पक्ष की सांप्रदायिक मान्यता नहीं जोड़ी गई।
- issue: ‘प्रभु’ का संदर्भ
  choice: मूल के अनुसार केवल ‘प्रभु’ रखा गया है।
  alternative: ‘प्रभु यीशु’ स्पष्ट करना
  rationale: व्यापक संदर्भ में मसीह अभिप्रेत हो सकते हैं, पर इस पद में केवल κύριος है; इसलिए पहचान को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- issue: πνευματικαῖς का अर्थ
  choice: ‘आत्मिक’
  alternative: ‘पवित्र आत्मा से प्रेरित’
  rationale: ‘आत्मिक’ मूल विशेषण की वास्तविक व्यापकता और संभावित अर्थ-तनाव बचाता है; औपचारिक प्रेरणा का अधिक विशिष्ट दावा पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक उपासना के संदर्भ में सहज रखी गई है। ‘भजन—स्तुतिगान—आत्मिक गीत’ की त्रयी सुरक्षित है। क्रियाओं में निरंतरता दिखाने के लिए ‘करते रहो’ प्रयुक्त है; पद अगले वाक्यांश से जुड़ा होने के कारण अंतिम अल्पविराम रखा गया है।
