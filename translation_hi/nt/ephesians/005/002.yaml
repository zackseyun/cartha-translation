source:
  edition: SBLGNT
  text: καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ⸀ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ⸀ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: hi
  text: और प्रेम में चलो, जैसे मसीह ने भी हमसे प्रेम किया और हमारे लिए अपने आपको परमेश्वर के लिए सुगन्धित सुगन्ध के निमित्त भेंट और बलिदान के रूप में दे दिया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “हमारे लिए” का अर्थ “हमारी ओर से” भी हो सकता है; यूनानी वाक्यांश लाभार्थक या प्रतिनिधिक भाव रख सकता है।
    reason: lexical_alternative
  - marker: b
    text: “सुगन्धित सुगन्ध के निमित्त” पुराने नियम की उस बलिदानी भाषा की प्रतिध्वनि है जिसमें अर्पण की सुगन्ध परमेश्वर को भाती है।
    reason: cross_reference
lexical_decisions:
- source_word: περιπατεῖτε
  choice: चलो
  rationale: पौलुस के जीवन-चाल संबंधी रूपक को बनाए रखता है और हिन्दी में ‘प्रेम में चलो’ स्वाभाविक बाइबलीय अभिव्यक्ति है।
- source_word: ἐν ἀγάπῃ
  choice: प्रेम में
  rationale: यह प्रेम को जीवन के क्षेत्र और रीति—दोनों के रूप में व्यक्त करने वाली पूर्वसर्गीय बनावट को सुरक्षित रखता है।
- source_word: ὁ Χριστός
  choice: मसीह
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; ‘मसीह’ आधुनिक हिन्दी में स्थापित और अर्थपूर्ण रूप है।
- source_word: ἠγάπησεν ἡμᾶς
  choice: हमसे प्रेम किया
  rationale: ἀγάπη के साथ शब्दगत संबंध बनाए रखते हुए हिन्दी की स्वाभाविक क्रिया-रचना अपनाता है।
- source_word: παρέδωκεν ἑαυτὸν
  choice: अपने आप को ... अर्पित कर दिया
  rationale: स्वेच्छापूर्ण आत्म-समर्पण और आगे आने वाली बलिदानी भाषा दोनों को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: ὑπὲρ ἡμῶν
  choice: हमारे लिए
  rationale: लाभार्थक अथवा प्रतिनिधिक बल को सुरक्षित रखता है, पर इसे अनावश्यक रूप से केवल स्थानापन्नता तक सीमित नहीं करता।
- source_word: προσφορὰν καὶ θυσίαν
  choice: भेंट और बलिदान
  rationale: दोनों बलिदानी संज्ञाओं को अलग-अलग बनाए रखता है; ‘भेंट’ προσφορά और ‘बलिदान’ θυσία का सुबोध हिन्दी प्रतिरूप है।
- source_word: τῷ θεῷ
  choice: परमेश्वर के सामने
  rationale: अर्पण के प्राप्तकर्ता/दिशा को व्यक्त करता है और हिन्दी में बलिदानी प्रसंग के अनुकूल है।
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: सुगन्धित ... के रूप में
  rationale: मूल की ठोस सुगन्ध-छवि और पुराने नियम की बलिदानी प्रतिध्वनि को बनाए रखता है; हिन्दी वाक्य-विन्यास के लिए इसे ‘भेंट और बलिदान’ का विशेषण बनाया गया है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ निश्चित उपपद के साथ शब्द उपाधि-सदृश है। ‘मसीह’ हिन्दी में उस अभिषिक्त उद्धारकर्ता की स्थापित उपाधि है, इसलिए अर्थ को केवल नाम की तरह अस्पष्ट नहीं करता।
- issue: ὑπὲρ ἡμῶν का बलिदानी अर्थ
  choice: हमारे लिए
  alternative: हमारी ओर से / हमारे स्थान पर
  rationale: ‘हमारे लिए’ लाभ, प्रतिनिधित्व और आत्म-समर्पण की व्यापकता को बनाए रखता है; मूल पूर्वसर्ग से अधिक संकीर्ण स्थानापन्न अर्थ को मुख्य पाठ में आरोपित नहीं करता।
- issue: εἰς ὀσμὴν εὐωδίας की बलिदानी प्रतिध्वनि
  choice: सुगन्धित भेंट और बलिदान
  alternative: मनभावनी सुगन्ध के लिए भेंट और बलिदान
  rationale: मुख्य पाठ ठोस सुगन्ध की छवि रखता है, जबकि यह तथ्य कि सुगन्ध परमेश्वर को प्रसन्न करने वाली है, पुराने नियम की पृष्ठभूमि से निहित है; उसे मुख्य पाठ में व्याख्यात्मक रूप से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली रखी गई है। ‘प्रेम में चलो’ पौलुस की रूपकात्मक भाषा को सुरक्षित रखता है। ‘अपने आप को ... अर्पित कर दिया’ हिन्दी में स्वाभाविक है और आत्म-समर्पण को बलिदानी पदों से स्पष्ट रूप से जोड़ता है।
