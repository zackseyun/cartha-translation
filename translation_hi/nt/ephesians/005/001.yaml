revisions:
- from: इसलिए परमेश्वर का अनुकरण करनेवाले बनो,[a] जैसे उसके प्यारे बच्चे करते हैं।
  to: इसलिए, प्रिय बच्चों की तरह परमेश्वर के अनुकरणकर्ता बनो।[a]
  rationale: 'The revision removes the added action and possessive, restoring the Greek’s compact exhortation: become imitators of God as beloved children. It retains a natural Hindi word order and preserves the present imperative’s possible ongoing nuance in the footnote.'
  reviewer_model: gpt-5.6-terra
