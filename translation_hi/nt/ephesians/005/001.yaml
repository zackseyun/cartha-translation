lexical_decisions:
- source_word: γίνεσθε
  choice: बनो
  rationale: वर्तमान काल की आज्ञार्थक क्रिया बनने अथवा निरंतर वैसा होते जाने की प्रक्रिया व्यक्त कर सकती है। ‘बनो’ इस आग्रह को स्वाभाविक और संक्षिप्त हिन्दी में बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकले निष्कर्ष को दिखाता है; ‘इसलिए’ उस तार्किक संबंध को स्पष्ट रखता है।
- source_word: μιμηταὶ
  choice: अनुकरण करनेवाले
  rationale: यह परमेश्वर के आचरण का अनुसरण या उसकी नकल करने का स्पष्ट भाव रखता है; केवल ‘पीछे चलनेवाले’ कहना इस भाव को कमजोर कर देता।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर का
  rationale: सम्बन्धकारक रूप को स्वाभाविक हिन्दी में सीधे व्यक्त करता है।
- source_word: ὡς
  choice: जैसे
  rationale: यह बच्चों की पहचान और उनके अनुरूप व्यवहार के बीच संक्षिप्त तुलना को सुरक्षित रखता है, बिना कारण-सूचक अर्थ को अनिवार्य बनाए।
- source_word: τέκνα
  choice: बच्चे
  rationale: यह शब्द स्त्री-पुरुष दोनों को समाहित करता है और संतान-संबंध व्यक्त करता है।
- source_word: ἀγαπητά
  choice: प्यारे
  rationale: यह प्रेम पाए हुए और प्रिय होने—दोनों का स्नेहपूर्ण भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अनुकरण की आज्ञा और परमेश्वर की संतान होने का संबंध
  choice: विश्वासियों को प्यारे बच्चों के रूप में परमेश्वर का अनुकरण करने को कहा गया है; अनुकरण करके संतान बनने की बात नहीं कही गई।
  alternative: 'वाक्यांश को केवल सामान्य तुलना माना जा सकता है: ‘प्यारे बच्चों की तरह परमेश्वर का अनुकरण करो।’'
  rationale: वाक्य-विन्यास ‘प्यारे बच्चों के समान/रूप में’ आज्ञा की रीति या आधार दोनों का संकेत दे सकता है। अनुवाद इस संबंध को खुला रखता है और दत्तकत्व संबंधी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘अनुकरण करनेवाले’ मूल संज्ञा की स्पष्टता बचाता है, जबकि ‘प्यारे बच्चे’ स्वाभाविक हिन्दी में संबंध और स्नेह दोनों व्यक्त करता है।
