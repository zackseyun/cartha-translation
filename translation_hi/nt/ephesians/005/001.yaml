review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the inferential ‘इसलिए,’ the imperative/process sense of γίνεσθε, and the imitation motif. However, ‘जैसे उसके प्यारे बच्चे करते हैं’ supplies the finite action ‘करते हैं’ and the possessive ‘उसके,’ turning the final phrase into a comparison with what children do. The Greek says ‘as beloved children’ and does not state that children perform the imitation.
  naturalness: ‘प्यारे बच्चों की तरह’ is idiomatic modern Hindi and allows the final phrase to qualify the exhortation without adding an unstated verb. ‘परमेश्वर के अनुकरणकर्ता’ is concise, clear, and suitably dignified.
  terminology: ‘परमेश्वर,’ ‘अनुकरणकर्ता,’ and ‘प्रिय’ preserve the established biblical register. ‘प्रिय बच्चे’ retains the gender-inclusive filial sense of τέκνα and the affectionate/passive sense of ἀγαπητά without adding a doctrinal explanation.
  issues:
  - severity: medium
    issue: The wording ‘जैसे उसके प्यारे बच्चे करते हैं’ adds ‘करते हैं’ and explicitly makes the children the performers of the imitation.
    rationale: ὡς τέκνα ἀγαπητά is a verbless phrase, ‘as beloved children.’ The added verb narrows the syntax and introduces a proposition absent from the source.
  - severity: low
    issue: The possessive ‘उसके’ is not expressed in the Greek final phrase.
    rationale: The children’s relation to God is strongly suggested by the context, but leaving it implicit better follows the compact wording and avoids unnecessary expansion.
  revised_text: इसलिए, प्रिय बच्चों की तरह परमेश्वर के अनुकरणकर्ता बनो।[a]
