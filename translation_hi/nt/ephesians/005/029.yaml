source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ ⸀Χριστὸς τὴν ἐκκλησίαν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/029.yaml
  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: hi
  text: क्योंकि किसी ने कभी अपने शरीर से घृणा नहीं की, बल्कि वह उसका पालन-पोषण करता और उसे स्नेह से सँभालता है, ठीक वैसे ही जैसे मसीह भी कलीसिया का पालन-पोषण करता और उसे स्नेह से सँभालता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: क्योंकि किसी ने कभी ... नहीं
  rationale: γάρ पिछले कथन का आधार बताता है; οὐδεὶς और ποτε के साथ यह स्वाभाविक हिन्दी में सार्वभौमिक नकार व्यक्त करता है।
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: अपने शरीर
  rationale: यहाँ σάρξ मनुष्य के अपने भौतिक शरीर/स्वयं को दर्शाता है, न कि नैतिक अर्थ में 'पापी स्वभाव' को। हिन्दी में 'अपना शरीर' अधिक स्वाभाविक और स्पष्ट है।
- source_word: ἐμίσησεν
  choice: घृणा की
  rationale: मिसेओ का सीधा और गरिमापूर्ण हिन्दी समतुल्य, जो क्रिया की तीव्रता बनाए रखता है।
- source_word: ἐκτρέφει
  choice: पालन-पोषण करता
  rationale: क्रिया में भोजन देकर पोसने और देखभाल करने का भाव है; यह हिन्दी पद शरीर और कलीसिया दोनों के संदर्भ में स्वाभाविक है।
- source_word: θάλπει
  choice: स्नेह से सँभालता
  rationale: शाब्दिक रूप से गरम रखने से विकसित कोमल देखभाल का भाव व्यक्त करता है; केवल 'दुलारता' की तुलना में इस संदर्भ में अधिक व्यापक और स्वाभाविक है।
- source_word: καθὼς καὶ
  choice: ठीक वैसे ही जैसे ... भी
  rationale: तुलना और καί के योगात्मक बल दोनों को सुरक्षित रखता है।
- source_word: ὁ Χριστὸς
  choice: मसीह
  rationale: आधुनिक मानक हिन्दी बाइबलीय प्रयोग में Χριστός का स्थापित, अर्थवाही रूप 'मसीह' है और यहाँ उपाधि का भाव बनाए रखता है।
- source_word: τὴν ἐκκλησίαν
  choice: कलीसिया
  rationale: पौलुस के सामूहिक परमेश्वर-जन संबंधी प्रयोग के लिए हिन्दी मसीही परंपरा में प्रचलित और सटीक शब्द।
theological_decisions:
- issue: σάρξ का अर्थ
  choice: शरीर
  alternative: देह; मांस
  rationale: विवाह और शरीर की उपमा में संदर्भ अपने भौतिक अस्तित्व का है। 'शरीर' इस शाब्दिक अर्थ को स्पष्ट रखता है और 'पापी स्वभाव' जैसा असंगत धर्मवैज्ञानिक अर्थ नहीं लाता।
- issue: Χριστός का निरूपण
  choice: मसीह
  alternative: ख्रीस्त; अभिषिक्त जन
  rationale: '''मसीह'' हिन्दी में स्थापित रूप है और यूनानी उपाधि के मसीही/अभिषिक्त अर्थ-संबंध को बनाए रखता है।'
- issue: अंतिम उपवाक्य में लुप्त क्रिया
  choice: कलीसिया का करता है
  alternative: कलीसिया का पालन-पोषण करता और उसे स्नेह से सँभालता है
  rationale: यूनानी में क्रियाएँ समझी हुई हैं। संक्षिप्त हिन्दी मुख्य तुलना को बनाए रखती है और पूर्ववर्ती दोनों क्रियाओं की ओर लौटती है; विस्तृत विकल्प अर्थ को स्पष्ट करता, पर मूल की अल्पोक्ति को खोल देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज गद्य। 'पालन-पोषण' और 'स्नेह से सँभालता' समानार्थी पुनरुक्ति से बचते हुए पोषण तथा कोमल देखभाल के दो अलग पहलू व्यक्त करते हैं। अंतिम वाक्यांश में मूल यूनानी की क्रिया-लोप संरचना को स्वाभाविक हिन्दी सीमा तक सुरक्षित रखा गया है।
