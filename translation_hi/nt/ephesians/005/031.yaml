id: EPH.5.31
reference: Ephesians 5:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀντὶ τούτου καταλείψει ἄνθρωπος ⸀τὸν ⸀πατέρα καὶ ⸀τὴν μητέρα καὶ προσκολληθήσεται ⸂τῇ γυναικὶ⸃ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: hi
  text: इस कारण[a] पुरुष अपने पिता और माता को छोड़कर अपनी पत्नी से जुड़ जाएगा, और वे दोनों एक देह होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसके कारण।” यूनानी पदबंध यहाँ उत्पत्ति 2:24 के उद्धरण में कारणसूचक संबंध व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: इस कारण
  rationale: उत्पत्ति 2:24 के इस उद्धरण में यह पदबंध प्रतिस्थापन के बजाय कारण अथवा परिणामसूचक संबंध व्यक्त करता है। ‘इस कारण’ स्वाभाविक हिन्दी में वही संबंध बनाए रखता है।
- source_word: καταλείψει
  choice: छोड़कर
  rationale: यह अपने माता-पिता के घर को छोड़कर नया वैवाहिक संबंध स्थापित करने का भाव देता है; ‘त्याग देगा’ अनावश्यक रूप से भावनात्मक परित्याग का अर्थ ला सकता है।
- source_word: ἄνθρωπος
  choice: पुरुष
  rationale: यद्यपि यह शब्द सामान्यतः ‘मनुष्य’ भी हो सकता है, यहाँ ‘अपनी पत्नी’ के साथ वैवाहिक जोड़ी में पुरुष पक्ष स्पष्ट है।
- source_word: προσκολληθήσεται
  choice: जुड़ जाएगा
  rationale: भविष्यकालीन कर्मवाच्य रूप घनिष्ठ रूप से जोड़े जाने या संलग्न होने का भाव देता है। हिन्दी में ‘जुड़ जाएगा’ स्वाभाविक है और वैवाहिक मिलन की गंभीरता बनाए रखता है।
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: अपनी पत्नी से
  rationale: वैवाहिक संदर्भ में γυνή का अर्थ ‘पत्नी’ है; हिन्दी में ‘से जुड़ना’ स्वाभाविक कारक-प्रयोग है।
- source_word: ἔσονται οἱ δύο
  choice: वे दोनों ... होंगे
  rationale: यह यूनानी के स्पष्ट ‘दोनों’ और भविष्यकालीन ‘होंगे’ को बनाए रखता है।
- source_word: εἰς σάρκα μίαν
  choice: एक देह
  rationale: यह उत्पत्ति से आए वैवाहिक एकत्व के मूर्त और संबंधपरक रूपक को सुरक्षित रखता है; इसे केवल ‘एक शरीर’ या किसी अमूर्त धारणा में सीमित नहीं किया गया।
theological_decisions:
- issue: वैवाहिक उद्धरण में लिंग-सूचक भाषा
  choice: पुरुष ... अपनी पत्नी
  alternative: मनुष्य ... अपने जीवनसाथी
  rationale: मूल पाठ उत्पत्ति 2:24 के उद्धरण में पुरुष और उसकी पत्नी की जोड़ी प्रस्तुत करता है; लिंग-निरपेक्ष करना स्रोत की विशिष्टता को मिटा देता।
- issue: εἰς σάρκα μίαν में σάρξ का अनुवाद
  choice: एक देह
  alternative: एक शरीर
  rationale: यहाँ σάρξ पापमय स्वभाव का पौलुसी रूपक नहीं, बल्कि उत्पत्ति से लिया गया वैवाहिक एकत्व का कथन है। ‘देह’ स्थापित बाइबलीय प्रतिध्वनि और व्यापक संबंधपरक भाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-रचना उद्धरण की औपचारिकता बनाए रखते हुए हिन्दी के स्वाभाविक प्रवाह के अनुरूप है।
