language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: hi
  text: क्योंकि जो कुछ प्रकट होता है, वह ज्योति है।[a] इसलिए कहा गया है:[b] “हे सोने वाले, जाग उठ और मरे हुओं में से जी उठ, और मसीह[c] तुझ पर चमकेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ उजागर होता है, वह ज्योति है।” यूनानी कृदंत का अर्थ “प्रकट होता है,” “दिखाई देने लगता है,” या “उजागर होता है” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस उद्धरण का निश्चित स्रोत ज्ञात नहीं है। यह पवित्रशास्त्र के विषयों—विशेषकर यशायाह 60:1—की प्रतिध्वनि हो सकता है, या संभवतः किसी आरंभिक मसीही भजन से लिया गया हो।
    reason: cross_reference
  - marker: c
    text: 'यूनानी में ‘मसीह’ के साथ निश्चित उपपद है; यहाँ Χριστός एक उपाधि है, जिसका अर्थ “अभिषिक्त जन” है। पारंपरिक हिंदी रूप: “ख्रीस्त।”'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν
  choice: जो कुछ
  rationale: नपुंसकलिंग एकवचन और संज्ञा के रूप में प्रयुक्त कृदंत के साथ यह व्यापक, सामान्य अर्थ देता है; इससे कथन को केवल व्यक्तियों तक सीमित नहीं किया जाता।
- source_word: φανερούμενον
  choice: प्रकट किया जाता है
  rationale: यह रूप किसी वस्तु के दिखाई देने योग्य बनाए जाने, प्रकट किए जाने या उजागर किए जाने का अर्थ दे सकता है। मुख्य पाठ में निष्क्रिय भाव रखा गया है और निकटवर्ती ‘ज्योति’ की छवि से संबंध बना रहता है।
- source_word: φῶς
  choice: ज्योति
  rationale: मूल रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखने वाला सीधा अनुवाद।
- source_word: διὸ
  choice: इसलिए
  rationale: यह पहले कथन से निकलने वाले निष्कर्ष को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: λέγει
  choice: यह कहा गया है
  rationale: यूनानी में वक्ता अथवा उद्धरण-स्रोत निर्दिष्ट नहीं है। हिंदी का यह निर्वैयक्तिक प्रयोग उस अनिश्चितता को बचाता है, यद्यपि काल और वाच्य को स्वाभाविक हिंदी के अनुरूप ढाला गया है।
- source_word: Ἔγειρε
  choice: जाग उठ
  rationale: आज्ञार्थक संबोधन में नींद की छवि को सहज आधुनिक हिंदी में रखता है।
- source_word: ὁ καθεύδων
  choice: हे सोने वाले
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत के संबोधन-भाव को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἀνάστα
  choice: जी उठ
  rationale: ‘मरे हुओं में से’ के साथ यह उठ खड़े होने और पुनर्जीवन—दोनों की प्रतिध्वनि बनाए रखता है।
- source_word: ἐκ τῶν νεκρῶν
  choice: मरे हुओं में से
  rationale: बहुवचन अभिव्यक्ति और ‘उनके बीच से’ उठने के भाव को मानक बाइबलीय हिंदी में सुरक्षित रखता है।
- source_word: ἐπιφαύσει
  choice: प्रकाश डालेगा
  rationale: तुझ पर चमकने अथवा प्रकाश देने का भाव स्वाभाविक हिंदी में व्यक्त करता है और प्रकाश की मूल छवि बनाए रखता है।
- source_word: ὁ Χριστός
  choice: मसीह
  rationale: सप्रत्यय यूनानी पद यहाँ उपाधि के रूप में प्रयुक्त है। ‘मसीह’ हिंदी में उस उपाधि का स्थापित रूप है, न कि केवल एक अस्पष्ट व्यक्तिवाचक नाम।
theological_decisions:
- issue: उद्धरण का स्रोत
  choice: निर्वैयक्तिक रूप ‘यह कहा गया है’ रखा गया है।
  alternative: ‘पवित्रशास्त्र कहता है,’ ‘वह कहता है,’ या ‘एक भजन में कहा गया है।’
  rationale: मूल यूनानी उद्धरण के वक्ता या स्रोत की पहचान नहीं करता; इसलिए अनुवाद उसे पवित्रशास्त्र, परमेश्वर या किसी आरंभिक मसीही भजन के रूप में निश्चित नहीं करता।
- issue: Χριστός का स्वरूप
  choice: मसीह
  alternative: ख्रीस्त अथवा अभिषिक्त जन
  rationale: यहाँ पद उपाधि के रूप में है। ‘मसीह’ आधुनिक हिंदी में अर्थवान और व्यापक रूप से पहचाना जाने वाला पारंपरिक रूप है।
- issue: ‘मरे हुओं में से जी उठ’ का आशय
  choice: पुनरुत्थान-सदृश भाषा को यथावत रखा गया है।
  alternative: इसे केवल नैतिक या आत्मिक जागरण के रूप में स्पष्ट करना।
  rationale: संदर्भ में रूपक हो सकता है, पर मूल कथन मृत्यु और जी उठने की प्रबल भाषा का उपयोग करता है; अनुवाद उस धर्मवैचारिक तनाव को हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। उद्धरण में एकवचन आत्मीय संबोधन ‘तुझ’ मूल के एकवचन रूपों और काव्यात्मक आह्वान को व्यक्त करता है। ‘ज्योति’ और ‘प्रकाश’ का चयन एक ही प्रकाश-रूपक को बनाए रखते हुए हिंदी की स्वाभाविक अभिव्यक्ति के लिए किया गया है।
