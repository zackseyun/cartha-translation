lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: धन्यवाद देते रहो
  rationale: वर्तमानकालिक कृदन्त निरंतर चलने वाले कार्य को व्यक्त करता है और पिछले आदेश पर निर्भर है। हिन्दी में ‘देते रहो’ उस निरंतरता और आदेशात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πάντοτε
  choice: हमेशा
  rationale: यह πάντοτε का संक्षिप्त, सामान्य और स्वाभाविक हिन्दी समतुल्य है।
- source_word: ὑπὲρ πάντων
  choice: हर बात के लिए
  rationale: πάντων का रूप वस्तुओं/बातों या व्यक्तियों—दोनों की ओर संकेत कर सकता है। प्रसंग में व्यापक परिस्थितियों और बातों के लिए कृतज्ञता अधिक संभावित है; ‘हर बात’ हिन्दी में ‘सब वस्तुओं’ से अधिक स्वाभाविक है।
- source_word: ἐν ὀνόματι
  choice: के नाम में
  rationale: यह मूल रूपक को बनाए रखता है और प्रतिनिधित्व अथवा मध्यस्थता के भाव को अनावश्यक व्याख्या के बिना खुला छोड़ता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος के मसीही पदनाम के लिए मानक, गरिमापूर्ण हिन्दी शब्द।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: यीशु नाम का प्रचलित हिन्दी रूप है और ‘मसीह’ Χριστός के पदनाम ‘अभिषिक्त जन/मसीहा’ को हिन्दी की स्थापित बाइबलीय भाषा में व्यक्त करता है।
- source_word: τῷ θεῷ καὶ πατρί
  choice: परमेश्वर पिता को
  rationale: चतुर्थी धन्यवाद पाने वाले को दिखाती है। संयुक्त पद एक ही व्यक्ति—परमेश्वर जो पिता है—की ओर संकेत करता है; ‘परमेश्वर पिता’ स्वाभाविक और स्पष्ट हिन्दी है।
theological_decisions:
- issue: Χριστοῦ को पदनाम या केवल नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ Χριστός में पदनाम का बल बना हुआ है। ‘मसीह’ हिन्दी में स्थापित होने के साथ उसके ‘अभिषिक्त जन’ वाले अर्थ-संबंध को भी बनाए रखता है; केवल परंपरागत लिप्यंतरण को मुख्य पाठ में रखना आवश्यक नहीं है।
- issue: ὑπὲρ πάντων का संदर्भ
  choice: हर बात के लिए
  alternative: सब लोगों के लिए
  rationale: व्याकरणतः व्यक्तियों का अर्थ संभव है, पर निकटवर्ती उपदेश में सर्वव्यापी कृतज्ञता का भाव परिस्थितियों और सभी बातों को अधिक स्वाभाविक बनाता है। संभावित वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और उपदेशात्मक शैली रखी गई है। पद के आरंभिक कृदन्त को उसके पूर्ववर्ती आदेश से जोड़ने के लिए ‘देते रहो’ प्रयोग किया गया है।
