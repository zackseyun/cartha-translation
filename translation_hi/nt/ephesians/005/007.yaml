lexical_decisions:
- source_word: μὴ
  choice: न
  rationale: निषेधात्मक आज्ञा के साथ आधुनिक हिन्दी में ‘न बनो’ स्वाभाविक और स्पष्ट है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पद 3–6 की चेतावनी से निकला निष्कर्ष व्यक्त करता है; ‘इसलिए’ उस तार्किक संबंध को बनाए रखता है।
- source_word: γίνεσθε
  choice: बनो
  rationale: क्रिया किसी अवस्था में आने या वैसा हो जाने का भाव देती है; ‘बनो’ केवल स्थिर ‘हो’ की अपेक्षा इस भाव को बेहतर व्यक्त करता है।
- source_word: συμμέτοχοι
  choice: सहभागी
  rationale: यह दूसरों के साथ किसी बात में हिस्सा रखने वाले व्यक्ति को दर्शाता है। ‘सहभागी’ आधुनिक, गरिमापूर्ण और पर्याप्त व्यापक है।
- source_word: αὐτῶν
  choice: उनके
  rationale: सम्बन्धकारक सर्वनाम को ‘सहभागी’ के साथ हिन्दी में स्वाभाविक रूप से ‘उनके सहभागी’ कहा जा सकता है; इससे मूल के व्यक्तिवाचक संकेत को बिना अनावश्यक विस्तार के सुरक्षित रखा गया है।
theological_decisions:
- issue: συμμέτοχοι αὐτῶν में सहभागिता का दायरा
  choice: उन लोगों और उनके पापमय आचरण में सहभागिता की सामान्य मनाही, पर मुख्य पाठ में सहभागिता का विषय अधिक स्पष्ट न करना
  alternative: उनके कामों में सहभागी न बनो
  rationale: निकटवर्ती संदर्भ अवज्ञाकारी लोगों के आचरण और उन पर आने वाले परिणाम दोनों से जुड़ा है, जबकि यूनानी पाठ स्पष्ट रूप से ‘उनके’ कहता है, ‘इन बातों के’ या ‘उनके कामों में’ नहीं। अतः अनुवाद मूल की व्यापकता और निहित तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘सहभागी’ धार्मिक संदर्भ में परिचित है, फिर भी अत्यधिक पारिभाषिक नहीं।
