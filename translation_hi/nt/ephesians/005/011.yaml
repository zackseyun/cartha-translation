source:
  edition: SBLGNT
  text: καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, μᾶλλον δὲ καὶ ἐλέγχετε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/011.yaml
  text: And do not participate in the unfruitful works of darkness[a], but instead even expose them[b],
translation:
  language: hi
  text: और अंधकार के निष्फल कामों में सहभागी न बनो[a], बल्कि उन्हें उजागर भी करो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनमें भाग न लो” अथवा “उनके साथ साझीदार न बनो।”
    reason: lexical_alternative
  - marker: b
    text: या, “उनका दोष दिखाओ” अथवा “उन्हें फटकारो।” यूनानी क्रिया में सुधार या फटकार का भाव हो सकता है, पर इस प्रसंग में ऐसे कामों को प्रकाश में लाने का भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: सहभागी न बनो
  rationale: यह क्रिया किसी काम में साथ देने या उसमें भाग लेने का भाव रखती है। ‘सहभागी न बनो’ सक्रिय संलिप्तता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔργοις
  choice: कामों
  rationale: ‘कामों’ पौलुस की नैतिक शब्दावली के अनुरूप है और यहाँ किए जाने वाले कार्यों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀκάρποις
  choice: निष्फल
  rationale: ‘निष्फल’ यूनानी के फल न देने वाले रूपक को बनाए रखता है और निकटवर्ती प्रसंग में फलदायी जीवन के साथ निहित विरोध को व्यक्त करता है।
- source_word: σκότους
  choice: अंधकार के
  rationale: यह संबंधकारक पद का सीधा अनुवाद है और अंधकार के नैतिक तथा रूपकात्मक दोनों अर्थों को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: μᾶλλον δὲ καὶ
  choice: बल्कि ... भी
  rationale: 'यह रचना तीखे विरोध के साथ आगे बढ़कर सकारात्मक कार्रवाई की माँग करती है: केवल भाग न लेना ही नहीं, बल्कि उन कामों को उजागर भी करना है।'
- source_word: ἐλέγχετε
  choice: उजागर करो
  rationale: यहाँ प्रकाश और अंधकार के प्रसंग में ‘उजागर करो’ बात को प्रकाश में लाने का अर्थ स्पष्ट करता है, जबकि पाद-टिप्पणी दोष दिखाने या फटकारने की संभावित अर्थछाया को सुरक्षित रखती है।
theological_decisions:
- issue: ἐλέγχετε का अंधकार के कामों से संबंध
  choice: उन्हें उजागर भी करो
  alternative: उनका दोष दिखाओ; उन्हें फटकारो
  rationale: आस-पास का प्रसंग प्रकाश द्वारा वस्तुओं को प्रकट किए जाने पर बल देता है (पद 8, 13)। इसलिए ‘उजागर करो’ प्रसंगगत रूपक को बनाए रखता है, पर यूनानी क्रिया में निहित नैतिक सुधार या फटकार के भाव को पाद-टिप्पणी में खुला रखा गया है।
- issue: निषेध और सकारात्मक आज्ञा के बीच विरोध
  choice: सहभागी न बनो ... बल्कि ... उजागर भी करो
  alternative: भाग न लो ... बल्कि उनका दोष दिखाओ
  rationale: यूनानी पाठ केवल बुराई से अलग रहने की नहीं, उसके विरुद्ध सक्रिय रूप से कार्य करने की भी आज्ञा देता है। अनुवाद इस तनाव को बनाए रखता है और कार्रवाई की किसी एक विधि को पाठ पर आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘निष्फल’ फल के रूपक को और ‘उजागर’ प्रकाश-अंधकार की प्रसंगगत छवि को बनाए रखते हैं।
