  text: क्योंकि हम उसकी देह के अंग हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियाँ यहाँ जोड़ती हैं, “उसके मांस और उसकी हड्डियों में से।”
    reason: textual_variant
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार बताता है; ‘क्योंकि’ आधुनिक हिन्दी में इसके कारणवाचक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μέλη
  choice: अंग
  rationale: यह देह के घटक भागों को दर्शाता है। ‘अंग’ पौलुस की देह-संबंधी उपमा में स्वाभाविक है और शारीरिक तथा सामूहिक—दोनों भाव बनाए रखता है।
- source_word: ἐσμὲν
  choice: हम ... हैं
  rationale: वर्तमानकालीन ‘होना’ क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: τοῦ σώματος
  choice: देह के
  rationale: संदर्भ में यह मसीह की देह की पौलुसी उपमा है; ‘देह’ मूल अर्थ और धार्मिक संदर्भ दोनों को स्पष्ट रखता है।
- source_word: αὐτοῦ
  choice: उसकी
  rationale: सर्वनाम निकटवर्ती संदर्भ में मसीह की ओर संकेत करता है; ‘उसकी’ अनावश्यक व्याख्या जोड़े बिना व्यक्तिगत संदर्भ बनाए रखता है।
theological_decisions:
- issue: क्या लंबे बीजान्टिन पाठ ‘उसके मांस और उसकी हड्डियों में से’ को मुख्य पाठ में शामिल किया जाए
  choice: 'केवल SBLGNT का संक्षिप्त पाठ अनूदित किया गया: ‘क्योंकि हम उसकी देह के अंग हैं।’'
  alternative: क्योंकि हम उसकी देह के, उसके मांस और उसकी हड्डियों के अंग हैं।
  rationale: दिया गया यूनानी स्रोत संक्षिप्त पाठ प्रस्तुत करता है। लंबे पाठ को मुख्य पाठ में मिलाने के बजाय पाठांतर के रूप में पाद-टिप्पणी में देना मूल-पाठ की प्राथमिकता और पाठकीय पारदर्शिता दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। ‘देह’ और ‘अंग’ पौलुस की मूल उपमा को स्वाभाविक रूप से सुरक्षित रखते हैं।
