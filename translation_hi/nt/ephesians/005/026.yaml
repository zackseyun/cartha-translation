  yaml_path: translation/nt/ephesians/005/026.yaml
  text: so that he might sanctify her[a], having cleansed her by the washing of water with the word[c][b],
translation:
  language: hi
  text: ताकि वह उसे वचन के साथ जल के स्नान से शुद्ध करके पवित्र बनाए[a][b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि वह उसे पवित्र करे, जल के स्नान से वचन के द्वारा शुद्ध करके।”
    reason: lexical_alternative
  - marker: b
    text: “जल के स्नान” की अभिव्यक्ति संभवतः बपतिस्मा की छवि जगाती है, लेकिन यूनानी पाठ अपने आप यह निश्चित नहीं करता कि यहाँ संदर्भ कितनी विशिष्ट रीति से संस्कारात्मक है।
    reason: cultural_note
  - marker: c
    text: '“वचन” के स्थान पर “संदेश” भी हो सकता है (यूनानी: rhēmati)।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य प्रकट करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: αὐτὴν
  choice: उसे
  rationale: स्त्रीलिंग एकवचन सर्वनाम संदर्भ में कलीसिया की ओर संकेत करता है; हिन्दी में ‘उसे’ स्वाभाविक रूप से वही संदर्भ बनाए रखता है।
- source_word: ἁγιάσῃ
  choice: पवित्र बनाए
  rationale: यह ἁγιάζω के पवित्र करने के अर्थ को सामान्य पाठक के लिए स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है। ‘पवित्र ठहराए’ न्यायिक अर्थ का अनावश्यक संकेत दे सकता है।
- source_word: καθαρίσας
  choice: शुद्ध करके
  rationale: अओरिस्ट कृदन्त को मुख्य क्रिया से संबद्ध पूर्ववर्ती या सहगामी कार्य के रूप में रखता है और हिन्दी में सहज है।
- source_word: τῷ λουτρῷ
  choice: स्नान से
  rationale: λουτρόν का अर्थ स्नान या धोना है। ‘स्नान’ जल की धुलाई की मूर्त छवि बचाता है, जबकि ‘से’ साधनसूचक दत्तिव को व्यक्त करता है।
- source_word: τοῦ ὕδατος
  choice: जल के
  rationale: सम्बन्धकारक रचना को निकटता से बनाए रखता है और ‘जल के स्नान’ के रूप में λουτρόν को विशेषित करता है।
- source_word: ἐν ῥήματι
  choice: वचन के साथ
  rationale: ἐν यहाँ साधन या सहवर्ती परिस्थिति बता सकता है। ‘के साथ’ जल के स्नान और वचन के संबंध को जानबूझकर खुला रखता है।
- source_word: ῥήματι
  choice: वचन
  rationale: ῥῆμα वचन, कही हुई बात या संदेश हो सकता है। ‘वचन’ अर्थक्षेत्र और धार्मिक अनुगूँज को बचाता है, पर किसी विशेष उद्घोषणा या सूत्र को अनिवार्य नहीं करता।
theological_decisions:
- issue: शुद्धीकरण, जल के स्नान और वचन का संबंध
  choice: ऐसी रचना रखना जो जल-स्नान की छवि और वचन से उसके संबंध को व्यक्त करे, पर किसी विशिष्ट संस्कारवादी निष्कर्ष को अनिवार्य न बनाए।
  alternative: इसे स्पष्ट रूप से बपतिस्मा-संस्कार कहना, अथवा इसे केवल रूपक मानना।
  rationale: यूनानी भाषा बपतिस्मा की छवि जगा सकती है, किंतु अपने आप यह निश्चित नहीं करती कि संदर्भ किस सीमा तक संस्कारात्मक है।
- issue: ῥήματι का अधिक विशिष्ट अर्थ
  choice: मुख्य पाठ में ‘वचन’ रखना।
  alternative: ‘संदेश’, ‘कहा हुआ वचन’, या ‘सुसमाचार का संदेश’।
  rationale: संदर्भ किसी बोले या सुनाए गए संदेश की ओर संकेत कर सकता है, पर यूनानी शब्द अधिक व्यापक है; ‘वचन’ अनावश्यक संकीर्णता से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। वाक्य को पद 25 से जारी उद्देश्य-वाक्य मानते हुए अंत में अल्पविराम रखा गया है। ‘जल के स्नान’ और ‘वचन के साथ’ मूल की संबंधगत अस्पष्टता को यथासंभव बनाए रखते हैं।
