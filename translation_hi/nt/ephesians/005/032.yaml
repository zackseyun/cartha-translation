  text: τὸ μυστήριον τοῦτο μέγα ἐστίν, ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/032.yaml
  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: hi
  text: यह रहस्य महान है,[a] पर मैं मसीह और कलीसिया के विषय में कह रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह रहस्य गहन है।” यूनानी में अधिक शाब्दिक रूप से “महान” है, जो केवल गहराई ही नहीं, बल्कि महानता या महत्त्व भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: रहस्य
  rationale: पौलुस के प्रयोग में यह परमेश्वर की उस सच्चाई को सूचित करता है जो पहले छिपी थी और अब प्रकट हुई है; ‘रहस्य’ इस अर्थ और पारिभाषिक भार को बनाए रखता है।
- source_word: μέγα
  choice: महान
  rationale: यह यूनानी विशेषण का सीधा अर्थ है और उसके परिमाण अथवा महत्त्व की अस्पष्टता को बनाए रखता है; ‘गहन’ अर्थ को केवल गहराई की ओर सीमित कर सकता है।
- source_word: δὲ
  choice: पर
  rationale: यह कथन से पौलुस के स्पष्टीकरण की ओर हल्का विरोध अथवा संक्रमण व्यक्त करता है।
- source_word: λέγω
  choice: कह रहा हूँ
  rationale: वर्तमान काल की क्रियात्मकता को स्वाभाविक हिन्दी में बनाए रखता है; ‘मेरा अर्थ है’ अधिक व्याख्यात्मक होता।
- source_word: εἰς
  choice: के विषय में
  rationale: λέγω के साथ यहाँ यह दिशा नहीं, बल्कि संदर्भ सूचित करता है; ‘के विषय में’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: Χριστόν
  choice: मसीह
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; हिन्दी में ‘मसीह’ उसका प्रचलित और अर्थपूर्ण रूप है।
- source_word: ἐκκλησίαν
  choice: कलीसिया
  rationale: यहाँ इसका आशय परमेश्वर के लोगों की सामूहिक पहचान से है; ‘कलीसिया’ पौलुसी और हिन्दी बाइबलीय प्रयोग में स्थापित है।
theological_decisions:
- issue: ‘यह रहस्य’ किसका उल्लेख करता है
  choice: मुख्य पाठ में संदर्भ को अनिर्धारित रखा गया है और केवल पौलुस का मसीह तथा कलीसिया की ओर संकेत सुरक्षित रखा गया है।
  alternative: इसे विशेष रूप से वैवाहिक एक-देह संबंध, उत्पत्ति 2:24 के उद्धरण, अथवा विवाह के प्रतिरूपात्मक अर्थ के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ स्वयं इन संभावनाओं में से किसी एक को स्पष्ट रूप से सीमित नहीं करता; अनुवाद को इस धर्मवैज्ञानिक तनाव को बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और बाइबलीय शब्दावली रखी गई है। ‘मसीह’ और ‘कलीसिया’ प्रचलित धार्मिक शब्द हैं; वाक्यरचना मूल के स्पष्टीकरणात्मक क्रम और वास्तविक अस्पष्टता को सुरक्षित रखती है।
