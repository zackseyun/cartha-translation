source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: hi
  text: क्योंकि तुम यह जानते हो और समझते भी हो कि हर यौन-अनैतिक, अशुद्ध या लोभी व्यक्ति—जो मूर्तिपूजक है[a]—की मसीह[b] और परमेश्वर के राज्य में कोई विरासत नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, इस वाक्यांश को अधिक भाववाचक रूप में, “जो मूर्तिपूजा है” समझा जा सकता है; संभवतः यह विशेष रूप से लोभ की ओर संकेत करता है।
    reason: alternative_reading
  - marker: b
    text: यूनानी शब्द का अर्थ “अभिषिक्त” है; यहाँ इसे उपाधि के रूप में “मसीह” अनुवाद किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: तुम यह जानते हो और समझते भी हो
  rationale: οἶδα और γινώσκω के कृदन्त, दोनों के बल को स्वाभाविक हिन्दी में बनाए रखता है; ‘भी’ इस दोहरे कथन की विशेष दृढ़ता दिखाता है।
- source_word: πόρνος
  choice: यौन-अनैतिक व्यक्ति
  rationale: यह किसी ऐसे व्यक्ति को सूचित करता है जिसकी पहचान यौन अनैतिकता से होती है। यह आधुनिक हिन्दी में स्पष्ट है और ‘व्यभिचारी’ के संभावित संकुचित अर्थ से बचता है।
- source_word: ἀκάθαρτος
  choice: अशुद्ध
  rationale: नैतिक अशुद्धता के साथ शब्द की शुद्ध-अशुद्ध संबंधी रूपकात्मक प्रतिध्वनि भी बनाए रखता है।
- source_word: πλεονέκτης
  choice: लोभी व्यक्ति
  rationale: हड़पने या अधिक पाने की लालसा से चिह्नित व्यक्ति के लिए सहज और प्रचलित आधुनिक हिन्दी।
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: जो मूर्तिपूजक है
  rationale: मुख्य पाठ में इस उपवाक्य को अभी-अभी बताए गए व्यक्ति, विशेषकर लोभी व्यक्ति, पर लागू किया गया है। यूनानी नपुंसकलिंग संबंधवाचक सर्वनाम से उत्पन्न दूसरी सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: κληρονομίαν
  choice: उत्तराधिकार
  rationale: पौलुस के वाचा-संबंधी और भावी-राज्य संबंधी अर्थ-संकेतों को ‘हिस्से’ की अपेक्षा अधिक अच्छी तरह सुरक्षित रखता है।
- source_word: βασιλείᾳ
  choice: राज्य
  rationale: राजकीय शासन और उसके क्षेत्र, दोनों को समेटने वाला स्थापित और स्वाभाविक बाइबलीय शब्द।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है, इसलिए हिन्दी में स्थापित उपाधि ‘मसीह’ उपयुक्त है।
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: मसीह और परमेश्वर के
  rationale: दोनों संबंधकारकों को सीधे समन्वित रूप में रखता है और यूनानी वाक्य-विन्यास पर कोई अतिरिक्त विवादित मसीह-विज्ञान संबंधी निष्कर्ष नहीं थोपता।
theological_decisions:
- issue: ὅ ἐστιν εἰδωλολάτρης का संबंध
  choice: 'मुख्य पाठ में व्यक्ति पर लागू: ‘जो मूर्तिपूजक है’'
  alternative: इसे भाववाचक रूप में, विशेषतः लोभ के विषय में, ‘जो मूर्तिपूजा है’ समझना
  rationale: नपुंसकलिंग संबंधवाचक सर्वनाम संदर्भ को कुछ अस्पष्ट बनाता है। संदर्भ और कुलुस्सियों 3:5 का निकट समानांतर लोभ के मूर्तिपूजक स्वरूप की ओर संकेत करते हैं। मुख्य पाठ स्वाभाविक हिन्दी देता है, जबकि वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
- issue: उत्तराधिकार से वंचित होने का कालगत अर्थ
  choice: 'वर्तमान स्थिति: ‘कोई उत्तराधिकार नहीं है’'
  alternative: ‘राज्य का उत्तराधिकारी नहीं होगा’
  rationale: यूनानी में οὐκ ἔχει वर्तमान काल में है। हिन्दी अनुवाद चेतावनी को नरम किए बिना इसी वर्तमान कथन को बनाए रखता है।
- issue: ‘मसीह और परमेश्वर’ का परस्पर संबंध
  choice: 'सीधा समन्वित संबंध: ‘मसीह और परमेश्वर के राज्य में’'
  alternative: ऐसा अधिक व्याख्यात्मक अनुवाद जो किसी विशिष्ट मसीह-विज्ञान संबंधी वाक्य-विन्यासगत निष्कर्ष पर बल दे
  rationale: यह रूप यूनानी पदावली को सुरक्षित रखता है और पाठ की अपेक्षा अधिक विशिष्ट धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘यौन-अनैतिक’ संक्षिप्त सूची-शैली बनाए रखते हुए अर्थ की अनावश्यक संकीर्णता से बचता है। डैश जटिल संबंधवाचक उपवाक्य को स्पष्ट करता है; दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
