lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: पत्नियो
  rationale: गृहस्थ-संबंधी प्रसंग और ‘अपने-अपने पतियों’ के साथ संबंधसूचक प्रयोग के कारण यहाँ सामान्य ‘स्त्रियो’ नहीं, बल्कि ‘पत्नियो’ स्वाभाविक अर्थ है। संबोधन के रूप में ‘पत्नियो’ आधुनिक मानक हिंदी में स्पष्ट है।
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: अपने-अपने पतियों के प्रति
  rationale: ἀνήρ यहाँ वैवाहिक संदर्भ में ‘पति’ है। ἰδίοις को ‘अपने-अपने’ से व्यक्त किया गया है, जिससे प्रत्येक पत्नी के अपने पति से विशिष्ट संबंध का भाव बना रहता है। दत्तिव संबंध को अधूरे निहित क्रियाभाव के साथ स्वाभाविक हिंदी में ‘के प्रति’ से दर्शाया गया है।
- source_word: ὡς
  choice: वैसे ही जैसे
  rationale: यह तुलना को स्पष्ट और स्वाभाविक हिंदी में रखता है, पर तुलना की सीमा या स्वरूप को अतिरिक्त रूप से निर्धारित नहीं करता।
- source_word: τῷ κυρίῳ
  choice: प्रभु के प्रति
  rationale: पौलुस के इस संदर्भ में κύριος प्रभु यीशु को सूचित करता है। दत्तिव का समानांतर रूप बनाए रखने के लिए ‘के प्रति’ रखा गया है।
- source_word: implicit verb from context
  choice: मुख्य पाठ में क्रिया नहीं जोड़ी गई
  rationale: इस पद के SBLGNT यूनानी पाठ में स्पष्ट क्रिया नहीं है; वाक्य पद 21 के ὑποτασσόμενοι (‘अधीन होते हुए’) पर निर्भर है। इसलिए मूल की अपूर्ण/अध्याहृत रचना को मुख्य पाठ में सुरक्षित रखा गया है और अर्थ पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: क्या पद 22 में यूनानी पाठ में अनुपस्थित ‘अधीन रहो’ को मुख्य पाठ में जोड़ा जाए
  choice: क्रिया को मुख्य पाठ में न जोड़कर मूल की अध्याहृत रचना बनाए रखी गई।
  alternative: पत्नियो, अपने-अपने पतियों के अधीन रहो, जैसे प्रभु के अधीन।
  rationale: ‘अधीन रहो’ पद 21 से अर्थतः समझा जाता है, किंतु पद 22 के दिए गए यूनानी पाठ में स्वयं व्यक्त नहीं है। उसे मुख्य पाठ में न जोड़ना स्रोत-पाठ की संरचना और पद 21 पर उसकी निर्भरता को अधिक पारदर्शी ढंग से सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अपने-अपने’ मूल के ἰδίοις को स्पष्ट करता है। जानबूझकर सुरक्षित रखी गई वाक्यगत अपूर्णता हिंदी में असामान्य है, इसलिए पादटिप्पणी आवश्यक है।
