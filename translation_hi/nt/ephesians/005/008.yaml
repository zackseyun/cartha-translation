lexical_decisions:
- source_word: ἦτε
  choice: थे
  rationale: εἰμί का अपूर्णकाल भूतकाल की अवस्था बताता है; ‘थे’ सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: γάρ
  choice: क्योंकि
  rationale: γάρ पिछले उपदेश का कारण या आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ποτε
  choice: पहले
  rationale: यह पूर्व अवस्था और वर्तमान अवस्था के बीच समयगत विरोध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σκότος
  choice: अंधकार
  rationale: मूल में यह विधेय संज्ञा है; ‘अंधकार’ बनाए रखने से केवल अंधकार में होने के बजाय पहचान और अवस्था का प्रबल रूपक सुरक्षित रहता है।
- source_word: νῦν δὲ
  choice: पर अब
  rationale: यह पूर्व और वर्तमान अवस्था के बीच तीखा विरोध स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: φῶς
  choice: ज्योति
  rationale: मूल की विधेय संज्ञा और पहचान-संबंधी रूपक को बनाए रखा गया है; इसे ‘ज्योति में’ या ‘प्रकाशित’ करके नरम नहीं किया गया।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह प्रभु के साथ संबंध और उसी में स्थित जीवन-क्षेत्र को खुला रखता है तथा पौलुस की विशिष्ट अभिव्यक्ति को सुरक्षित रखता है।
- source_word: ὡς
  choice: के समान
  rationale: यह उस रीति को व्यक्त करता है जो ज्योति की संतान की पहचान के अनुरूप है।
- source_word: τέκνα φωτός
  choice: ज्योति की संतान
  rationale: τέκνα लिंग-समावेशी है; एकवचन सामूहिक ‘संतान’ आधुनिक हिन्दी में स्त्री-पुरुष दोनों को समेटते हुए मूल संबंधपरक रूपक को बनाए रखता है।
- source_word: περιπατεῖτε
  choice: चलो
  rationale: वर्तमान आज्ञार्थक का नैतिक जीवन-रीति वाला पौलुसी रूपक सुरक्षित रखा गया है; अर्थ स्पष्ट करने के लिए पादटिप्पणी दी गई है।
theological_decisions:
- issue: ‘पहले अंधकार थे, पर अब ... ज्योति हो’ में रूपकात्मक पहचान
  choice: ‘अंधकार’ और ‘ज्योति’ को विधेय संज्ञाओं के रूप में बनाए रखना
  alternative: ‘अंधकार में थे, पर अब ज्योति में हो’ या ‘अंधकारमय थे, पर अब प्रकाशित हो’
  rationale: यूनानी पाठ केवल स्थान या अनुभव नहीं, बल्कि बदली हुई नैतिक-आत्मिक अवस्था और पहचान को तीखे रूपक में व्यक्त करता है; अनुवाद उस तनाव को नरम नहीं करता।
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ नए नियम के धर्मवैज्ञानिक अनुनाद और पौलुसी प्रयोग को बिना अनावश्यक रूप से अर्थ सीमित किए बनाए रखता है।
- issue: ἐν κυρίῳ का संबंध
  choice: प्रभु में
  alternative: प्रभु के द्वारा
  rationale: मूल का ἐν संबंध, सहभागिता या जीवन-क्षेत्र का अर्थ दे सकता है; ‘प्रभु में’ इस अर्थगत विस्तार को सुरक्षित रखता है और साधनार्थक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। ‘अंधकार’ और ‘ज्योति’ का प्रबल समानांतर रखा गया है। ‘चलो’ के रूपक को मुख्य पाठ में सुरक्षित रखते हुए उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
