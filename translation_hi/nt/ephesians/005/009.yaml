lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले पद के कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: καρπὸς
