- source_word: ἐν
  choice: में दिखाई देता है
  rationale: यहाँ ἐν उन गुणों के क्षेत्र या अभिव्यक्ति को दर्शाता है जिनमें ज्योति का फल प्रकट होता है। केवल ‘में है’ हिन्दी में अस्वाभाविक और स्थानसूचक लग सकता है; ‘में दिखाई देता है’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πάσῃ
  choice: हर प्रकार की
  rationale: एकवचन भाववाचक संज्ञा के साथ πᾶς की व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀγαθωσύνῃ
  choice: भलाई
  rationale: नैतिक अच्छाई और हितकारी आचरण, दोनों की व्यापकता बनाए रखता है।
- source_word: δικαιοσύνῃ
  choice: धार्मिकता
  rationale: पौलुस के प्रयोग में नैतिक खराई/सही आचरण के व्यापक अर्थ को व्यक्त करने वाला परिचित बाइबलीय हिन्दी शब्द है; ‘न्याय’ को अर्थपूर्ण विकल्प के रूप में पादटिप्पणी में रखा गया है।
- source_word: ἀληθείᾳ
  choice: सच्चाई
  rationale: यहाँ सत्य के अनुरूपता और आचरण की सत्यनिष्ठा दोनों को सहज हिन्दी में समेटता है।
theological_decisions:
- issue: संबंधकारक पदबंध का पाठांतर
  choice: ज्योति का फल
  alternative: आत्मा का फल
  rationale: SBLGNT में φωτός (‘ज्योति’) है और यह पद 8 के निकट संदर्भ से मेल खाता है। ‘आत्मा’ वाला पाठांतर पांडुलिपि परंपरा में मिलता है, इसलिए उसे मुख्य पाठ में अपनाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: शब्द यहाँ नैतिक खराई या सही आचरण तथा न्याय, दोनों की ओर संकेत कर सकता है। मुख्य पाठ में परिचित व्यापक पद ‘धार्मिकता’ रखा गया है और ‘न्याय’ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘ज्योति’ तत्काल संदर्भ और बाइबलीय रूपक को बनाए रखता है। ‘में दिखाई देता है’ स्रोत के ἐν की अभिव्यक्तिपरक भूमिका को स्वाभाविक हिन्दी में स्पष्ट करता है।
