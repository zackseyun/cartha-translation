source:
  edition: SBLGNT
  text: οὕτως ὀφείλουσιν ⸀καὶ οἱ ἄνδρες ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας ὡς τὰ ἑαυτῶν σώματα· ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/028.yaml
  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: hi
  text: इसी प्रकार पतियों को भी अपनी पत्नियों से अपने शरीरों के समान प्रेम करना चाहिए। जो अपनी पत्नी से प्रेम करता है, वह अपने आप से प्रेम करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: इसी प्रकार
  rationale: पिछले संदर्भ में दिए गए आदर्श और तुलना से इस उपदेश का संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὀφείλουσιν
  choice: करना चाहिए
  rationale: नैतिक दायित्व को आधुनिक और स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे मूल के संकेतार्थक क्रियारूप से अधिक कठोर आज्ञा बनाए।
- source_word: καὶ οἱ ἄνδρες
  choice: पतियों को भी
  rationale: καί का योगात्मक भाव ‘भी’ से और वैवाहिक संदर्भ में ἄνδρες का अर्थ ‘पतियों’ से स्पष्ट होता है।
- source_word: ἀγαπᾶν
  choice: प्रेम करना
  rationale: पद में ἀγαπάω की पुनरावृत्ति को एक ही हिन्दी क्रिया द्वारा बनाए रखता है।
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: अपनी पत्नियों से
  rationale: वैवाहिक अर्थ तथा ἑαυτῶν के निजवाचक बल—दोनों को सुरक्षित रखता है; हिन्दी में ‘से प्रेम करना’ स्वाभाविक प्रयोग है।
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: अपने शरीरों के समान
  rationale: ὡς की तुलना और σώματα के बहुवचन को औपचारिक रूप से सुरक्षित रखते हुए सहज हिन्दी देता है।
- source_word: ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα
  choice: जो अपनी पत्नी से प्रेम करता है
  rationale: संज्ञात्मक कृदंत को सहज सम्बन्धवाचक वाक्य में व्यक्त करता है; निकट संदर्भ के कारण पति का पुरुषवाचक आशय हिन्दी क्रिया से बना रहता है।
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: वह अपने आप से प्रेम करता है
  rationale: निजवाचक सर्वनाम और दोहराई गई ‘प्रेम’ क्रिया को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: वैवाहिक उपदेश में लिंग-सूचक भाषा
  choice: οἱ ἄνδρες को ‘पतियों’ और γυναῖκας को ‘पत्नियों’ के रूप में अनूदित किया गया।
  alternative: ‘पुरुषों’ और ‘स्त्रियों’
  rationale: घर-परिवार संबंधी इस संदर्भ में ये शब्द सामान्यतः पुरुष और स्त्री नहीं, बल्कि पति और पत्नी को सूचित करते हैं।
- issue: पत्नी और अपने शरीर के बीच तुलना का स्वरूप
  choice: तुलना को ‘अपने शरीरों के समान’ कहकर स्पष्ट रखा गया और निष्कर्ष को ज्यों का त्यों व्यक्त किया गया।
  alternative: इसे तात्त्विक अभिन्नता की व्याख्या के रूप में विस्तृत करना
  rationale: मूल पाठ प्रेम की नैतिक और वैवाहिक समानता प्रस्तुत करता है; अनुवाद उसमें कोई अतिरिक्त सिद्धान्तगत व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। ‘अपनी/अपने आप’ से मूल के निजवाचक बल को सुरक्षित रखा गया है।
