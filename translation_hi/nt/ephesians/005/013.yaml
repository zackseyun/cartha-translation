translation:
  language: hi
  text: परन्तु सब कुछ[a], जब ज्योति के द्वारा उजागर किया जाता है, तो दिखाई देने लगता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ ज्योति के द्वारा उजागर किया जाता है, वह सब दिखाई देने लगता है।” यूनानी कृदन्त और क्रिया को निकट-संबंधित दो प्रकार से समझा जा सकता है—बल या तो उजागर किए जाने की क्रिया पर है या उसके परिणामस्वरूप दिखाई देने पर।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πάντα
  choice: सब कुछ
  rationale: सव्यय नपुंसकलिंग बहुवचन का दायरा व्यापक और समावेशी है; आधुनिक हिन्दी में ‘सब कुछ’ स्वाभाविक रूप से यही व्यापकता व्यक्त करता है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले कथन से हल्का विरोध अथवा विचार में आगे बढ़ना दर्शाता है; ‘परन्तु’ इस मोड़ को गरिमापूर्ण आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: ἐλεγχόμενα
  choice: जब ... उजागर किया जाता है
  rationale: ἐλέγχω का अर्थ दोष दिखाना, निरुत्तर करना या उजागर करना हो सकता है। यहाँ ज्योति के माध्यम और अगले क्रियापद के कारण ‘उजागर’ दृश्य प्रकाशन का भाव सबसे उपयुक्त ढंग से देता है; ‘जब’ कृदन्त का परिस्थितिजन्य संबंध सहज हिन्दी में व्यक्त करता है।
- source_word: ὑπὸ τοῦ φωτὸς
  choice: ज्योति के द्वारा
  rationale: ὑπό के साथ संबंधकारक साधन/कर्ता को सूचित करता है। संदर्भ में पहले से उल्लिखित ज्योति को निश्चित रूप में रखते हुए ‘ज्योति के द्वारा’ निष्क्रिय रचना को सुरक्षित रखता है।
- source_word: φανεροῦται
  choice: दिखाई देने लगता है
  rationale: निष्क्रिय φανερόω प्रकट या दृश्य हो जाने का अर्थ देता है। यह चयन ज्योति के बिंब और परिणामी दृश्यता दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: संदर्भ में ‘ज्योति’ का अभिप्राय
  choice: पद में केवल ‘ज्योति’ रखकर उसके अभिप्राय को निर्दिष्ट न करना
  alternative: इसे स्पष्ट रूप से मसीह, सुसमाचार, नैतिक सत्य, या विश्वासियों की साक्षी कहना
  rationale: निकटवर्ती संदर्भ विश्वासियों को प्रभु में ज्योति कहता है और अन्धकार के कामों को उजागर करने की बात करता है, पर यह पद स्वयं ‘ज्योति’ का एकमात्र अभिप्राय निर्धारित नहीं करता। अतः रूपक की व्यापकता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
- issue: कृदन्त और मुख्य क्रिया का वाक्यगत संबंध
  choice: '‘सब कुछ’ को विषय मानकर: जब वह ज्योति से उजागर होता है, तब दिखाई देने लगता है'
  alternative: ‘जो कुछ ज्योति के द्वारा उजागर किया जाता है, वह सब दिखाई देने लगता है’
  rationale: यूनानी रचना दोनों निकट-संबंधित बलाघातों की अनुमति देती है—उजागर किए जाने की क्रिया या उसके परिणामस्वरूप दृश्य होने पर। मुख्य पाठ पहला विन्यास रखता है और पादटिप्पणी दूसरे को सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ज्योति’ बाइबिलीय रूपक की गरिमा बनाए रखती है, जबकि ‘उजागर’ और ‘दिखाई देने लगता है’ अर्थ को सहज बनाते हैं।
