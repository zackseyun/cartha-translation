lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: अधीन होते हुए
  rationale: वर्तमानकालिक कृदन्त का रूप बनाए रखता है और इसे स्वयं को अधीन करने की स्पष्ट आत्मवाचक क्रिया नहीं बनाता। यह पिछले आदेश से जुड़े कृदन्तों की शृंखला को भी सुरक्षित रखता है।
- source_word: ἀλλήλοις
  choice: एक-दूसरे के
  rationale: सम्प्रदान बहुवचन पारस्परिक सर्वनाम का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: ἐν
  choice: में
  rationale: φόβῳ के साथ क्षेत्र अथवा रीति का भाव बनाए रखता है; हिन्दी में कुछ औपचारिक होते हुए भी अर्थ स्पष्ट है।
- source_word: φόβῳ
  choice: भय
  rationale: मूल शब्द के प्रबल अर्थ और श्रद्धामिश्रित भय की धर्मवैचारिक कसावट को सुरक्षित रखता है; ‘श्रद्धा’ या ‘विस्मय’ कहकर इसे नरम नहीं किया गया।
- source_word: Χριστοῦ
  choice: मसीहा
  rationale: यहाँ Χριστός को सक्रिय उपाधि के रूप में लिया गया है; इसलिए परम्परागत नाम-सदृश ‘मसीह’ के बजाय उपाधिसूचक ‘मसीहा’ रखा गया है।
theological_decisions:
- issue: φόβῳ Χριστοῦ में सम्बन्ध
  choice: मसीहा की ओर निर्देशित श्रद्धामिश्रित भय
  alternative: मसीहा द्वारा उत्पन्न भय; मसीहा के प्रति श्रद्धा
  rationale: सम्बन्धकारक का सबसे सीधा अर्थ मसीहा की ओर निर्देशित भय है। मुख्य पाठ में ‘भय’ रखने से उसका बल और धर्मवैचारिक तनाव बना रहता है।
- issue: Χριστοῦ का हिन्दी रूप
  choice: मसीहा
  alternative: मसीह; अभिषिक्त जन
  rationale: इस वाक्यांश में उपाधि का भाव पर्याप्त रूप से सक्रिय है। ‘मसीहा’ सामान्य पाठक के लिए सुबोध है, जबकि ‘अभिषिक्त जन’ अधिक व्याख्यात्मक और ‘मसीह’ अधिक नाम-सदृश है।
- issue: कृदन्तीय वाक्य-संबंध
  choice: अधीन होते हुए
  alternative: अधीन रहो; अपने आपको अधीन करते हुए
  rationale: यूनानी पाठ का कृदन्त पिछले प्रसंग के आदेश पर निर्भर है। इसे स्वतंत्र आज्ञा बनाने या अनकही आत्मवाचकता जोड़ने के बजाय वही खुला वाक्य-संबंध रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और स्रोत-समीप है। ‘के भय में’ हिन्दी में अपेक्षाकृत औपचारिक है, पर मूल ἐν φόβῳ की संरचना और अर्थगत तनाव को सुरक्षित रखता है। कृदन्तीय खंड जानबूझकर पिछले पद के वाक्य-संदर्भ पर निर्भर रखा गया है।
