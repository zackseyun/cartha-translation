  text: ἵνα παραστήσῃ ⸀αὐτὸς ἑαυτῷ ἔνδοξον τὴν ἐκκλησίαν, μὴ ἔχουσαν σπίλον ἢ ῥυτίδα ἤ τι τῶν τοιούτων, ἀλλ’ ἵνα ᾖ ἁγία καὶ ἄμωμος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/027.yaml
  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: hi
  text: ताकि वह स्वयं महिमामय[a] कलीसिया को अपने सामने प्रस्तुत करे—जिसमें न दाग हो, न झुर्री, न ऐसी कोई बात[b]—बल्कि वह पवित्र और निष्कलंक[c] हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महिमा में” या “महिमा से भरपूर।” यूनानी विशेषण को गुणवाचक (“महिमामय”) अथवा प्रस्तुत किए जाने की अवस्था के रूप में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “ऐसी कोई और वस्तु” या “ऐसी कोई बात।”
    reason: lexical_alternative
  - marker: c
    text: या “निर्दोष” या “बेदाग।”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραστήσῃ
  choice: सामने प्रस्तुत करे
  rationale: ἵνα के साथ प्रयुक्त अओरिस्ट सब्जंक्टिव उद्देश्य व्यक्त करता है। ‘सामने प्रस्तुत करे’ औपचारिक रूप से उपस्थित करने का भाव स्वाभाविक हिन्दी में रखता है।
- source_word: αὐτὸς ἑαυτῷ
  choice: वह स्वयं…अपने सामने
  rationale: αὐτός का बल और ἑαυτῷ का आत्मवाचक संबंध दोनों सुरक्षित रखे गए हैं; इन्हें केवल ‘वह प्रस्तुत करे’ कहकर सरल नहीं किया गया।
- source_word: ἔνδοξον
  choice: महिमामय बनाकर
  rationale: विशेषण कलीसिया की उस दशा को बताता है जिसमें उसे प्रस्तुत किया जाता है। हिन्दी में यह रचना स्वाभाविक है और ‘महिमामय’ होने के गुणवाचक अर्थ को बनाए रखती है।
- source_word: ἐκκλησίαν
  choice: कलीसिया
  rationale: यहाँ पौलुस का आशय परमेश्वर के लोगों के सामूहिक समुदाय से है; हिन्दी बाइबलीय प्रयोग में ‘कलीसिया’ इसका स्थापित और सटीक रूप है।
- source_word: μὴ ἔχουσαν σπίλον ἢ ῥυτίδα
  choice: जिसमें न दाग हो, न झुर्री
  rationale: कृदन्तीय वर्णन को सहज हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है। ‘दाग’ और ‘झुर्री’ मूल की ठोस वैवाहिक/शुद्धता-संबंधी छवि रखते हैं।
- source_word: ἤ τι τῶν τοιούτων
  choice: न ऐसी कोई और कमी
  rationale: वाक्यांश पहले दिए उदाहरणों जैसी किसी भी वस्तु या दोष को समेटता है। ‘कमी’ सन्दर्भगत अर्थ स्पष्ट करती है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
- source_word: ἀλλ’ ἵνα ᾖ
  choice: बल्कि वह…हो
  rationale: दूसरा ἵνα-वाक्य नकारात्मक दशा के सामने सकारात्मक उद्देश्य रखता है। स्त्रीलिंग ‘वह’ का संदर्भ कलीसिया है।
- source_word: ἁγία
  choice: पवित्र
  rationale: ‘पवित्र’ मानक, अर्थपूर्ण और सन्दर्भानुकूल हिन्दी पर्याय है।
- source_word: ἄμωμος
  choice: निर्दोष
  rationale: यह शब्द दोष या कलंक से रहित होने का अर्थ दे सकता है। ‘निर्दोष’ नैतिक तथा मूल्यांकनात्मक आयाम को स्वाभाविक हिन्दी में रखता है; ‘बेदाग’ विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: मसीह द्वारा कलीसिया को स्वयं अपने सामने प्रस्तुत करने की आत्मवाचक छवि
  choice: ‘वह स्वयं…अपने सामने प्रस्तुत करे’
  alternative: केवल ‘वह कलीसिया को प्रस्तुत करे’ या इसे स्पष्टतः परमेश्वर के सामने अंतिम प्रस्तुति कहना
  rationale: यूनानी पाठ में emphatic αὐτός और reflexive ἑαυτῷ दोनों स्पष्ट हैं। अनुवाद इस तनाव को रखता है और प्रस्तुति के लक्ष्य की अलग धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: कलीसिया के लिए वैवाहिक और शुद्धता-संबंधी भाषा
  choice: ‘दाग…झुर्री…पवित्र और निर्दोष’
  alternative: ‘कलंक…सिलवट…पवित्र और बेदाग’
  rationale: मूल पद ठोस शारीरिक/वधू-संबंधी बिंब और पवित्रता की भाषा को साथ रखता है। चुना रूप दोनों आयामों को किसी एक संप्रदायगत व्याख्या में सीमित किए बिना सुरक्षित रखता है।
- issue: ἔνδοξον में गुण अथवा अवस्था का बल
  choice: ‘महिमामय बनाकर’
  alternative: ‘महिमा से भरपूर’ या ‘गौरवशाली’
  rationale: यूनानी विशेषण कलीसिया का गुण भी बता सकता है और प्रस्तुत किए जाने की महिमापूर्ण अवस्था भी। मुख्य पाठ सहज हिन्दी में अवस्थागत भाव देता है और पादटिप्पणी वास्तविक वैकल्पिक रूप रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। ‘कलीसिया’ स्थापित बाइबलीय शब्दावली के कारण रखा गया है। विराम-चिह्न नकारात्मक वर्णन को स्पष्ट करते हैं, और सभी पादटिप्पणी-चिह्न मुख्य पाठ में मौजूद हैं।
