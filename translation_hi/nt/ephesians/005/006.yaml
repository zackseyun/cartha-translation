reference: Ephesians 5:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: hi
  text: कोई तुम्हें खोखली बातों से धोखा न दे, क्योंकि इन्हीं बातों के कारण परमेश्वर का क्रोध अवज्ञा के पुत्रों[a] पर आता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वे लोग जिनकी पहचान अवज्ञा से होती है; या ‘अवज्ञा की संतान।’
    reason: मूल का ‘अवज्ञा के पुत्र’ एक सामी मुहावरा है, जिसका आशय अवज्ञा से चिह्नित लोगों से है।
lexical_decisions:
- source_word: Μηδεὶς … ἀπατάτω
  choice: कोई … धोखा न दे
  rationale: यह वर्तमान आज्ञार्थक के निषेधात्मक बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κενοῖς λόγοις
  choice: खोखली बातों से
  rationale: ‘खोखली’ मूल के खाली, निरर्थक या सारहीन होने के रूपक को बनाए रखता है; ‘बातों’ में कथन और तर्क दोनों समा सकते हैं।
- source_word: διὰ ταῦτα
  choice: इन्हीं बातों के कारण
  rationale: διά के कारणवाचक अर्थ को स्पष्ट करता है और ταῦτα का पिछले प्रसंग की बातों की ओर संकेत बनाए रखता है।
- source_word: ἔρχεται
  choice: आता है
  rationale: यूनानी वर्तमान काल को बिना यह तय किए सुरक्षित रखता है कि बल सामान्य सत्य पर है या आसन्न घटना पर।
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: परमेश्वर का क्रोध
  rationale: ὀργή के स्पष्ट अर्थ ‘क्रोध’ को नरम करके केवल ‘न्याय’ नहीं बनाता।
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: अवज्ञा के पुत्रों
  rationale: मूल के सामी-शैली वाले ‘पुत्र’ रूपक और उसके पुरुषवाचक रूप को मुख्य पाठ में बनाए रखता है; भावार्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἀπειθείας
  choice: अवज्ञा
  rationale: न मानने या आज्ञा का उल्लंघन करने के नैतिक भाव को संक्षेप और गरिमा से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के क्रोध की भाषा
  choice: परमेश्वर का क्रोध
  alternative: परमेश्वर का न्याय
  rationale: मूल में ὀργή है, इसलिए उसके धर्मवैज्ञानिक तनाव को व्यापक और अपेक्षाकृत नरम ‘न्याय’ से प्रतिस्थापित नहीं किया गया।
- issue: τοὺς υἱοὺς τῆς ἀπειθείας का मुहावरा
  choice: अवज्ञा के पुत्रों
  alternative: अवज्ञाकारी लोगों
  rationale: मुख्य पाठ मूल के ‘पुत्र’ रूपक को सुरक्षित रखता है, जबकि पादटिप्पणी बताती है कि इसका आशय अवज्ञा से पहचाने जाने वाले लोगों से है।
- issue: ἔρχεται का कालगत बल
  choice: आता है
  alternative: आनेवाला है
  rationale: वर्तमान रूप को इस प्रकार रखा गया है कि पाठ को केवल भविष्यसूचक या केवल सामान्य सिद्धांत के रूप में सीमित न किया जाए।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘खोखली बातें’ सामान्य पाठक के लिए सहज है, जबकि ‘अवज्ञा के पुत्र’ जानबूझकर कुछ औपचारिक रखा गया है ताकि मूल रूपक न मिटे; उसकी व्याख्या पादटिप्पणी में है।
