  text: For it is shameful even to speak of the things done by them in secret[a].
translation:
  language: hi
  text: क्योंकि वे जो काम छिपकर करते हैं, उनका उल्लेख करना भी लज्जाजनक है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ... γινόμενα
  choice: जो काम ... करते हैं
  rationale: लेखयुक्त वर्तमान कृदंत यहाँ संज्ञा के रूप में किए जाने वाले कामों को दर्शाता है; हिंदी में यह रचना स्वाभाविक और स्पष्ट है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण या स्पष्टीकरण प्रस्तुत करता है और पौलुस के तर्क-संबंध को बनाए रखता है।
- source_word: κρυφῇ
  choice: छिपकर
  rationale: यह कार्य के गुप्त या छिपे ढंग से किए जाने का भाव स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: γινόμενα
  choice: करते हैं
  rationale: यूनानी कृदंत के वर्तमान भाव को हिंदी में स्वाभाविक सक्रिय वाक्य-विन्यास द्वारा व्यक्त किया गया है; ὑπ’ αὐτῶν कर्ता को स्पष्ट करता है।
- source_word: ὑπ’ αὐτῶν
  choice: वे
  rationale: ὑπό के साथ संबंध कार्य करने वालों को सूचित करता है। हिंदी में सक्रिय रचना अपनाने पर सर्वनाम कर्ता के रूप में आता है, जबकि उसका अनिर्दिष्ट संदर्भ सुरक्षित रहता है।
- source_word: αἰσχρόν
  choice: लज्जा की बात
  rationale: यह नैतिक रूप से लज्जाजनक या शर्मनाक होने का भाव dignified और सामान्य आधुनिक हिंदी में व्यक्त करता है।
- source_word: καὶ λέγειν
  choice: चर्चा करना भी
  rationale: 'καί का आरोही बल ‘भी’ से व्यक्त होता है: ऐसे कामों का उल्लेख या वर्णन तक लज्जाजनक है। ‘चर्चा करना’ संदर्भ में केवल शब्द बोलने के बजाय उन कामों के विषय में बोलने का अर्थ स्पष्ट करता है।'
theological_decisions:
- issue: αὐτῶν का संदर्भ
  choice: ‘वे’ सर्वनाम को बिना किसी स्पष्ट पहचान के बनाए रखा गया है।
  alternative: ‘अवज्ञाकारी लोग’ या ‘अंधकार के काम करने वाले’ जोड़ना।
  rationale: यूनानी पाठ केवल सर्वनाम देता है और उसका पूर्वपद आसपास के संदर्भ से मिलता है। पहचान जोड़ने से अनुवाद में व्याख्या आ जाती।
- issue: वाच्य का रूपांतरण
  choice: यूनानी की निष्क्रिय रचना को हिंदी में ‘जो काम वे ... करते हैं’ सक्रिय रचना से व्यक्त किया गया है।
  alternative: ‘जो काम उनके द्वारा छिपकर किए जाते हैं’।
  rationale: सक्रिय रचना आधुनिक हिंदी में अधिक स्वाभाविक है और कार्यों तथा कर्ताओं के बीच वही अर्थ-संबंध बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘लज्जा की बात’ नैतिक गंभीरता को बिना अनावश्यक कठोरता के व्यक्त करता है; ‘उनकी चर्चा करना भी’ καὶ λέγειν के बल को सहज हिंदी में सुरक्षित रखता है।
