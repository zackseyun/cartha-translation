lexical_decisions:
- source_word: Βλέπετε
  choice: ध्यान दो
  rationale: वर्तमान काल का बहुवचन आदेश यहाँ सतर्क होकर ध्यान देने का आग्रह करता है। ‘ध्यान दो’ आधुनिक हिन्दी में स्वाभाविक है और आदेश का बल बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले विचारों से निष्कर्ष अथवा व्यावहारिक परिणाम की ओर संकेत करता है।
- source_word: ἀκριβῶς πῶς
  choice: सावधानी से … कैसे
  rationale: ἀκριβῶς बारीकी और सतर्कता का भाव देता है, जबकि πῶς चाल-चलन के ढंग पर ध्यान केंद्रित करता है। यह विन्यास हिन्दी में दोनों तत्वों को स्पष्ट रखता है।
- source_word: περιπατεῖτε
  choice: तुम कैसे चलते हो
  rationale: शाब्दिक ‘चलना’ पौलुस के यहाँ जीवन-व्यवहार का रूपक है। मुख्य पाठ में रूपक रखा गया है और पाद-टिप्पणी उसका आशय स्पष्ट करती है।
- source_word: μὴ ὡς ἄσοφοι ἀλλ’ ὡς σοφοί
  choice: निर्बुद्धि लोगों के समान नहीं, बल्कि बुद्धिमान लोगों के समान
  rationale: यह विरोधी समानांतरता ‘बुद्धि से रहित’ और ‘बुद्धिमान’ जीवन-व्यवहार की तुलना करती है। ‘लोगों’ से समुदाय के सभी संबोधित जन स्वाभाविक रूप से सम्मिलित होते हैं; यूनानी पुल्लिंग बहुवचन यहाँ प्रतिनिधिक है।
theological_decisions:
- issue: ἄσοφοι / σοφοί के पुल्लिंग बहुवचन रूपों का प्रतिनिधिक अर्थ
  choice: निर्बुद्धि लोगों … बुद्धिमान लोगों
  alternative: निर्बुद्धि पुरुषों … बुद्धिमान पुरुषों
  rationale: व्याकरणिक पुल्लिंग बहुवचन इस प्रसंग में पूरी विश्वास-समुदाय को संबोधित करता है, केवल पुरुषों को नहीं। ‘लोग’ वास्तविक संदर्भगत विस्तार को स्पष्ट करता है और कोई अतिरिक्त धर्मवैज्ञानिक सीमा नहीं जोड़ता।
- issue: ‘चलने’ के रूपक को बनाए रखना
  choice: तुम कैसे चलते हो
  alternative: तुम किस प्रकार जीवन बिताते हो
  rationale: मूल का रूपक अर्थपूर्ण और हिन्दी में समझने योग्य है। पाद-टिप्पणी रूपक के जीवन-व्यवहार संबंधी आशय को बिना मुख्य पाठ को सपाट किए स्पष्ट करती है।
