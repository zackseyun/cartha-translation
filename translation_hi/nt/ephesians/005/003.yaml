  text: पर तुम लोगों के बीच यौन अनैतिकता, किसी भी प्रकार की अशुद्धता या लोभ का नाम तक न लिया जाए[a], जैसा कि पवित्र लोगों[b] के लिए उचित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम लोगों के बीच इसकी चर्चा तक न हो।”
    reason: lexical_alternative
  - marker: b
    text: “पवित्र लोगों” से आशय परमेश्वर के लिए अलग किए गए विश्वासियों से है, न कि बाद में संत घोषित किए गए किसी विशेष वर्ग से।
    reason: cultural_note
lexical_decisions:
- source_word: Πορνεία
  choice: यौन अनैतिकता
  rationale: यह शब्द व्यापक रूप से अनुचित यौन आचरण को दर्शाता है; यह केवल विवाह-पूर्व संबंधों तक सीमित नहीं है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन से हल्का विरोध अथवा संक्रमण दिखाता है।
- source_word: ἀκαθαρσία πᾶσα
  choice: किसी भी प्रकार की अशुद्धता
  rationale: यह स्वाभाविक हिन्दी में πᾶσα की व्यापकता को स्पष्ट रखता है।
- source_word: ἢ
  choice: या
  rationale: यह यूनानी पाठ के विकल्पसूचक संबंध को सीधे व्यक्त करता है।
- source_word: πλεονεξία
  choice: लोभ
  rationale: यह अधिक पाने की लालसा और स्वार्थपूर्ण हड़पने की प्रवृत्ति को दर्शाता है; इसे केवल यौन वासना तक सीमित नहीं किया गया।
- source_word: μηδὲ ὀνομαζέσθω
  choice: नाम तक न लिया जाए
  rationale: यह निषेध की तीव्रता और ‘यहाँ तक कि’ के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν ὑμῖν
  choice: तुम लोगों के बीच
  rationale: सामुदायिक संदर्भ में यह मसीही समुदाय के मध्य होने की बात व्यक्त करता है।
- source_word: καθὼς πρέπει
  choice: जैसा कि ... के लिए उचित है
  rationale: यह नैतिक उपयुक्तता के मानदंड को स्पष्ट और वर्तमान हिन्दी में व्यक्त करता है।
- source_word: ἁγίοις
  choice: पवित्र लोगों
  rationale: यह परमेश्वर के लिए अलग किए गए सभी विश्वासियों को दर्शाता है और बाद की औपचारिक संत-घोषणा की धारणा से बचता है।
theological_decisions:
- issue: यौन पापों की सूची के साथ πλεονεξία का अर्थ
  choice: व्यापक अर्थ वाला ‘लोभ’
  alternative: लालच; यौन लालसा
  rationale: निकट संदर्भ यौन नैतिकता का है, फिर भी पौलुस के प्रयोग में यह शब्द अधिक व्यापक बुराई है; पाठ में स्पष्ट आधार न होने पर इसका अर्थ संकुचित नहीं किया गया।
- issue: ἁγίοις का अभिप्राय
  choice: पवित्र लोगों—अर्थात परमेश्वर के लिए अलग किए गए विश्वासियों
  alternative: संतों
  rationale: यहाँ शब्द सभी विश्वासियों की सामुदायिक पहचान बताता है, न कि बाद में औपचारिक रूप से संत घोषित किए गए किसी विशेष वर्ग की।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यौन अनैतिकता’ व्यापक नैतिक अर्थ देता है; ‘पवित्र लोग’ सामान्य पाठक के लिए अर्थ स्पष्ट करता है। निष्क्रिय आज्ञार्थक संरचना को ‘नाम तक न लिया जाए’ द्वारा सुरक्षित रखा गया है।
