  text: ἵνα ἐξισχύσητε καταλαβέσθαι σὺν πᾶσιν τοῖς ἁγίοις τί τὸ πλάτος καὶ μῆκος καὶ ⸂ὕψος καὶ βάθος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/018.yaml
  text: so that you may be strong enough to comprehend[a], together with all the saints, what is the width and length and height and depth[b],
translation:
  language: hi
  text: ताकि तुम सब पवित्र जनों के साथ मिलकर यह समझने में समर्थ हो सको कि चौड़ाई[a], लंबाई, ऊँचाई और गहराई क्या है[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विस्तार’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ यह नहीं बताता कि ये आयाम किसके हैं; बहुत से लोग समझते हैं कि अगले पद में ‘मसीह के प्रेम’ के उल्लेख से यह विचार पूरा होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह पिछले पद की प्रार्थना से जुड़ा उद्देश्य या अपेक्षित परिणाम व्यक्त करता है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक रूप से इसका प्रयोजनात्मक बल बनाए रखता है।
- source_word: ἐξισχύσητε
  choice: समर्थ हो सको
  rationale: क्रिया किसी कार्य के लिए पर्याप्त सामर्थ्य या योग्यता होने का भाव देती है। ‘समर्थ हो सको’ आगे आने वाले बोधात्मक क्रिया-रूप के साथ सहज बैठता है।
- source_word: καταλαβέσθαι
  choice: समझने
  rationale: यहाँ अर्थ किसी आत्मिक वास्तविकता को मन से ग्रहण करने या समझ पाने का है। ‘समझने’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है, जबकि ‘ग्रहण करने’ कुछ अधिक अमूर्त हो सकता है।
- source_word: σὺν πᾶσιν τοῖς ἁγίοις
  choice: सब पवित्र जनों के साथ मिलकर
  rationale: σύν साझा सहभागिता दर्शाता है। ‘पवित्र जन’ पौलुस के πισ्‍वासियों के लिए प्रयुक्त पद का अर्थ सुरक्षित रखता है, और ‘साथ मिलकर’ सामुदायिक भाव स्पष्ट करता है।
- source_word: τί
  choice: क्या है
  rationale: नपुंसकलिंग प्रश्नवाचक सर्वनाम समझी जाने वाली बात का परिचय देता है। ‘क्या है’ चारों आयामों के साथ हिन्दी में पूर्ण और स्वाभाविक उपवाक्य बनाता है।
- source_word: τὸ πλάτος
  choice: चौड़ाई
  rationale: πλάτος का सीधा आधुनिक हिन्दी समतुल्य ‘चौड़ाई’ है; ‘विस्तार’ एक सम्भव किंतु कुछ कम आयामी विकल्प है।
- source_word: μῆκος
  choice: लंबाई
  rationale: यह सामान्य आयामी शब्द का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: ὕψος
  choice: ऊँचाई
  rationale: यह सामान्य आयामी शब्द का सीधा हिन्दी समतुल्य है।
- source_word: βάθος
  choice: गहराई
  rationale: यह सामान्य आयामी शब्द का सीधा हिन्दी समतुल्य है।
theological_decisions:
- issue: चार आयामों का संदर्भ
  choice: मुख्य पाठ में यह नहीं जोड़ा गया कि चौड़ाई, लंबाई, ऊँचाई और गहराई किसकी है।
  alternative: इन्हें मसीह के प्रेम, परमेश्वर की उद्धार-योजना या उसकी परिपूर्णता के आयाम बताना।
  rationale: यूनानी पाठ इस पद में इन आयामों का संबंध-विषय स्पष्ट नहीं करता। ‘मसीह के प्रेम की’ जोड़ना अगले पद से अर्थ लेकर यहाँ व्याख्यात्मक रूप से भर देता और मूल की खुली संरचना तथा धर्मवैज्ञानिक तनाव को समय से पहले सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पवित्र जन’ पौलुस के सामुदायिक पद को बनाए रखता है। वाक्य को पद 17–19 की चलती हुई प्रार्थना के अंश के रूप में दर्शाने के लिए अंत में अल्पविराम रखा गया है।
