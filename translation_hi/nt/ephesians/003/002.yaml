  text: εἴ γε ἠκούσατε τὴν οἰκονομίαν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/002.yaml
  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: hi
  text: यदि सचमुच[a] आपने परमेश्वर के उस अनुग्रह के प्रबंध[b] के विषय में सुना है, जो मुझे आपके लिए दिया गया था—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि वास्तव में आपने सुना है।” यूनानी में शर्तसूचक रूप बना हुआ है, यद्यपि संदर्भ में पौलुस संभवतः इसे सत्य मानकर कहता है।
    reason: alternative_reading
  - marker: b
    text: या, “प्रशासन” अथवा “सौंपा गया दायित्व।” यूनानी शब्द किसी को सौंपे गए प्रबंध या संचालन को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: यदि सचमुच
  rationale: यह यूनानी की शर्तसूचक बनावट को बनाए रखता है; संदर्भ में पौलुस संभवतः इसे सत्य मानकर कह रहा है, न कि वास्तविक संदेह जता रहा है।
- source_word: ἠκούσατε
  choice: आपने ... सुना है
  rationale: यूनानी अओरिस्ट सुनने की घटना को समग्र रूप में देखता है; हिन्दी में वर्तमान संदर्भ से जुड़े बीते सुनने के लिए यह स्वाभाविक रूप है।
- source_word: οἰκονομίαν
  choice: प्रबंध
  rationale: यह सौंपे गए संचालन अथवा उत्तरदायित्व का भाव व्यक्त करता है और इसे केवल अमूर्त उद्धार-योजना तक सीमित नहीं करता।
- source_word: χάριτος
  choice: अनुग्रह
  rationale: यह पौलुस के प्रयोग में परमेश्वर की उदार कृपा और उससे मिले बुलावे या वरदान की धार्मिक तथा शब्दगत निरंतरता बनाए रखता है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर के
  rationale: 'यह संबंधकारक को स्वाभाविक हिन्दी में व्यक्त करता है: अनुग्रह परमेश्वर का है और उसी से आता है।'
- source_word: τῆς δοθείσης
  choice: जो ... मुझे सौंपा गया था
  rationale: निष्क्रिय रूप और दिव्य रूप से दिए जाने का भाव सुरक्षित है। हिन्दी वाक्य में यह निकटवर्ती पूरे ‘अनुग्रह के प्रबंध’ को सौंपी गई जिम्मेदारी के रूप में व्यक्त करता है।
- source_word: μοι
  choice: मुझे
  rationale: यह अप्रत्यक्ष कर्म का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: εἰς ὑμᾶς
  choice: आपके लिए
  rationale: यह पौलुस को सौंपी गई सेवा की पाठकों की ओर दिशा और उनके हित—दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘परमेश्वर के अनुग्रह के प्रबंध’ का आशय
  choice: पौलुस को पाठकों के हित में सौंपा गया अनुग्रह-संबंधी प्रबंध अथवा उत्तरदायित्व
  alternative: परमेश्वर की उद्धार-योजना या व्यवस्था का अधिक अमूर्त अर्थ
  rationale: आस-पास का संदर्भ अन्यजातियों के प्रति पौलुस की सेवकाई पर बल देता है। ‘प्रबंध’ सौंपे गए उत्तरदायित्व को प्रमुख रखता है, पर व्यापक दिव्य योजना को नकारता नहीं।
- issue: εἴ γε का बल
  choice: सत्य मानी गई बात को शर्तसूचक ढंग से कहना
  alternative: वास्तविक अनिश्चितता व्यक्त करने वाली सीधी शर्त
  rationale: ‘यदि सचमुच’ यूनानी रूप को सुरक्षित रखता है; पादटिप्पणी स्पष्ट करती है कि संदर्भ में पौलुस संभवतः पाठकों के सुन चुकने को मानकर चलता है।
- issue: τῆς δοθείσης का व्याकरणिक संबंध
  choice: हिन्दी में पूरे ‘अनुग्रह के प्रबंध’ को पौलुस को सौंपे गए दायित्व के रूप में व्यक्त करना
  alternative: इसे विशेष रूप से केवल ‘अनुग्रह’ से जोड़कर ‘जो मुझे दिया गया’ कहना
  rationale: यूनानी में कृदंत निकटवर्ती ‘अनुग्रह’ से मेल खाता है, जबकि अर्थ की दृष्टि से पूरे प्रबंध/दायित्व से भी घनिष्ठ संबंध है। हिन्दी में ‘सौंपा गया’ οἰκονομία के उत्तरदायित्व-बोध को स्वाभाविक रूप से सामने लाता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अनुग्रह’ पौलुस की शब्दावली से परिचित धार्मिक पद है; ‘प्रबंध’ उसके साथ अपेक्षाकृत सहज रहते हुए सौंपे गए उत्तरदायित्व का अर्थ देता है। पद अगले वाक्यांश से जुड़ा है, इसलिए अंत में दीर्घ विराम-चिह्न रखा गया है।
