source:
  edition: SBLGNT
  text: διὸ αἰτοῦμαι μὴ ⸀ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: hi
  text: इसलिए मैं तुमसे विनती करता हूँ कि मेरी उन मुसीबतों के कारण, जो मैं तुम्हारे लिए सह रहा हूँ, हिम्मत न हारो[a]—वे तुम्हारी महिमा हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी उन मुसीबतों को देखकर, जो मैं तुम्हारे लिए सह रहा हूँ, निराश न हो।”
    reason: ἐν और ἐγκακεῖν के संबंध को कारण अथवा अवसर के रूप में व्यक्त करने वाला शाब्दिक विकल्प।
  - marker: b
    text: अर्थात, उनके लिए पौलुस का दुःख सहना परमेश्वर की उद्धार-योजना में उनके सम्मान का कारण है।
    reason: ‘तुम्हारी महिमा’ के संक्षिप्त कथन का संदर्भगत आशय स्पष्ट करना।
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को संक्षिप्त और स्वाभाविक ढंग से जोड़ता है।
- source_word: αἰτοῦμαι
  choice: मैं तुमसे विनती करता हूँ
  rationale: क्रिया पौलुस की गंभीर अपील व्यक्त करती है; संदर्भ से निहित संबोधित जनों को हिंदी में स्पष्ट करना स्वाभाविक है।
- source_word: μὴ ἐγκακεῖν
  choice: हिम्मत न हारो
  rationale: यह साहस खोने या निरुत्साहित होने के मुहावरेदार अर्थ को सरल, वर्तमान हिंदी में व्यक्त करता है।
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: मेरी उन मुसीबतों के कारण
  rationale: ἐν यहाँ निराशा के अवसर या कारण का बोध करा सकता है; ‘के कारण’ हिंदी में संबंध स्पष्ट करता है, जबकि ‘मुसीबतों’ से θλῖψις की गंभीरता बनी रहती है।
- source_word: ὑπὲρ ὑμῶν
  choice: जो मैं तुम्हारे लिए सह रहा हूँ
  rationale: यह लाभार्थक अर्थ को स्पष्ट करता है और हिंदी में ‘मेरी मुसीबतें तुम्हारे लिए’ की संभावित अस्वाभाविकता दूर करता है।
- source_word: ἥτις ἐστὶν δόξα ὑμῶν
  choice: वे तुम्हारी महिमा हैं
  rationale: हिंदी में ‘मुसीबतें’ बहुवचन होने के कारण बहुवचन सर्वनाम स्वाभाविक है; कथन के धार्मिक और अलंकारिक भार को ‘महिमा’ सुरक्षित रखता है।
theological_decisions:
- issue: ἥτις ἐστὶν δόξα ὑμῶν में संबंधवाचक उपवाक्य का संदर्भ
  choice: इसे पौलुस की उन मुसीबतों से जोड़ा गया है जो वह पाठकों के लिए सह रहा है।
  alternative: यह पौलुस की पूरी सेवकाई और उनके लिए उसके दुःख सहने के व्यापक विचार को सूचित कर सकता है।
  rationale: निकटतम पूर्वपद ‘मेरी मुसीबतें’ है, पर यूनानी एकवचन संबंधवाचक रूप पूरे विचार को एक इकाई मान सकता है। अनुवाद निकट संबंध बनाए रखता है और पादटिप्पणी व्यापक आशय स्पष्ट करती है, बिना तनाव मिटाए।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण संबोधन। ‘हिम्मत न हारो’ सामान्य पाठक के लिए सहज है; ‘महिमा’ मूल के धार्मिक और अलंकारिक भार को बनाए रखती है।
