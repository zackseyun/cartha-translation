  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: hi
  text: उसी की महिमा कलीसिया में और मसीह यीशु[a] में पीढ़ी से पीढ़ी तक, युगानुयुग होती रहे। आमीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीष्ट यीशु।” यूनानी उपाधि Χριστός का अर्थ “अभिषिक्त” है; इसलिए इसे यहाँ “मसीह” अनूदित किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: उसी की महिमा ... होती रहे
  rationale: यूनानी वाक्य क्रियारहित महिमारोपण है। हिंदी में ‘उसी की महिमा ... होती रहे’ इसकी आशीर्वचनात्मक/कामनात्मक शक्ति को स्वाभाविक ढंग से व्यक्त करता है और पिछले संदर्भ में परमेश्वर की ओर संकेत बनाए रखता है।
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: कलीसिया में
  rationale: ἐκκλησία यहाँ परमेश्वर के लोगों के समुदाय को दर्शाता है। ‘कलीसिया’ आधुनिक हिंदी बाइबलीय प्रयोग में स्थापित और समझने योग्य पद है; ‘में’ मूल ἐν तथा अगले समानांतर पदबंध से मेल रखता है।
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: और मसीह यीशु में
  rationale: Χριστός को अर्थपूर्ण उपाधि मानकर ‘मसीह’ किया गया है; Ἰησοῦ का प्रचलित हिंदी रूप ‘यीशु’ है। ‘में’ दोनों समानांतर ἐν-पदबंधों की संरचना सुरक्षित रखता है।
- source_word: εἰς πάσας τὰς γενεὰς
  choice: सभी पीढ़ियों तक
  rationale: εἰς का कालगत विस्तार ‘तक’ से व्यक्त होता है और πάσας का स्पष्ट अर्थ ‘सभी’ सुरक्षित रहता है।
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: युगानुयुग
  rationale: यह अनंत कालावधि का सामी-यूनानी प्रबल मुहावरा है। ‘युगानुयुग’ हिंदी के गरिमापूर्ण धार्मिक प्रयोग में संक्षिप्त और स्वाभाविक है।
- source_word: ἀμήν
  choice: आमीन
  rationale: आराधनात्मक पुष्टि के लिए प्रचलित हिंदी लिप्यंतरण।
theological_decisions:
- issue: Χριστῷ को अर्थपूर्ण उपाधि के रूप में अनुवादित करना या नाम-सदृश रूप में रखना
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु
  rationale: Χριστός यहाँ यीशु की उपाधि है; ‘मसीह’ उसके अभिषिक्त जन होने का अर्थ प्रचलित हिंदी में सुरक्षित रखता है, जबकि वैकल्पिक लिप्यंतरण को पादटिप्पणी में बताया गया है।
- issue: महिमा को वर्तमान तथ्य मानना या कामनात्मक महिमारोपण
  choice: महिमा ... होती रहे
  alternative: महिमा ... है
  rationale: मूल यूनानी में क्रिया नहीं है, इसलिए दोनों अर्थ-छायाएँ संभव हैं। स्तुतिगान के संदर्भ में हिंदी का ‘होती रहे’ स्वाभाविक महिमारोपण व्यक्त करता है, बिना यह दावा किए कि यूनानी में स्पष्ट आज्ञार्थक क्रिया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक आराधना में सहज उच्चारण योग्य रखी गई है। ‘कलीसिया’, ‘मसीह’ और ‘आमीन’ जैसे स्थापित हिंदी बाइबलीय पद बनाए गए हैं; कालगत वाक्यांश में मूल की ‘सभी पीढ़ियों’ और ‘युगानुयुग’ दोनों छवियाँ सुरक्षित हैं।
