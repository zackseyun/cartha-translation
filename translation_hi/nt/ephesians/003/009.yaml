- from: और सब लोगों पर यह बात प्रकाश में लाऊँ कि उस रहस्य का प्रबंध[a] क्या है, जो युगों से[b] उस परमेश्वर में छिपा रहा है जिसने सब कुछ सृजा।
  to: और सब लोगों को यह बात स्पष्ट करूँ कि उस रहस्य का प्रबंध[a] क्या है, जो युगों से[b] उस परमेश्वर में छिपा हुआ था, जिसने सब कुछ रचा।
  rationale: The revision corrects the Hindi case/construction governing ‘सब लोगों,’ uses an idiomatic expression for making the matter known, and renders the mystery’s long prior concealment in a way that coheres with the surrounding context of revelation. It retains the source’s ambiguity concerning οἰκονομία and the direct ‘in God’ relationship, while preserving both existing footnote anchors and their lexical function.
