review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the mystery, its administration (οἰκονομία), its concealment from the ages, its being hidden in God, and God as creator. However, ‘सब लोगों पर’ does not convey the Greek accusative πάντας naturally in Hindi. The perfect participle ἀποκεκρυμμένου is more appropriately rendered here with a past state of concealment (‘छिपा हुआ था’) in view of the mystery's present disclosure in the surrounding context.
  naturalness: ‘सब लोगों पर यह बात प्रकाश में लाऊँ’ is not idiomatic modern Hindi. ‘सब लोगों को यह बात स्पष्ट करूँ’ naturally expresses making the matter known to all. ‘रचा’ is a more natural modern verb than the elevated and less common ‘सृजा,’ while retaining the sense of creation.
  terminology: ‘रहस्य’ and ‘प्रबंध’ are suitable, non-sectarian renderings. ‘परमेश्वर में’ properly retains ἐν rather than weakening it to ‘परमेश्वर के पास.’ The alternatives in the notes preserve the lexical range of οἰκονομία and ἀπὸ τῶν αἰώνων.
  issues:
  - severity: medium
    issue: ‘सब लोगों पर’ is an incorrect/unnatural construction for πάντας.
    rationale: The phrase means something like bringing the matter to light upon people, rather than enlightening or informing all people. Hindi requires ‘सब लोगों को’ or an equivalent construction.
  - severity: low
    issue: ‘छिपा रहा है’ leaves the concealment as an ongoing present condition.
    rationale: In this context, where the mystery is being made known, ‘युगों से ... छिपा हुआ था’ more naturally represents its prior, enduring concealment without adding a doctrinal temporal claim.
  - severity: low
    issue: ‘सृजा’ is stylistically elevated and less natural in modern standard Hindi.
    rationale: ‘रचा’ is clear, dignified, and preserves the creator sense of κτίσαντι.
  revised_text: और सब लोगों को यह बात स्पष्ट करूँ कि उस रहस्य का प्रबंध[a] क्या है, जो युगों से[b] उस परमेश्वर में छिपा हुआ था, जिसने सब कुछ रचा।
