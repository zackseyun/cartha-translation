id: EPH.3.9
reference: Ephesians 3:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ φωτίσαι ⸀πάντας τίς ἡ οἰκονομία τοῦ μυστηρίου τοῦ ἀποκεκρυμμένου ἀπὸ τῶν αἰώνων ἐν τῷ θεῷ τῷ τὰ πάντα ⸀κτίσαντι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/009.yaml
  text: and to bring to light for everyone what is the administration of the mystery hidden from the ages in God[a], who created all things[b],
translation:
  language: hi
  text: और सब लोगों को यह बात स्पष्ट करूँ कि उस रहस्य का प्रबंध[a] क्या है, जो युगों से[b] उस परमेश्वर में छिपा हुआ था, जिसने सब कुछ रचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस रहस्य की व्यवस्था’, ‘उस रहस्य का दायित्वपूर्ण संचालन’, अथवा ‘उस रहस्य की योजना’।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से ‘युगों से’; अर्थ ‘युगों से छिपा हुआ’ है। अधिक व्याख्यात्मक अनुवाद: ‘अनादिकाल से’।'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωτίσαι
  choice: प्रकाश में लाऊँ
  rationale: यह यूनानी प्रकाश-रूपक को बनाए रखते हुए स्वाभाविक हिन्दी में किसी छिपी बात को सबके सामने स्पष्ट करने का भाव देता है।
- source_word: πάντας
  choice: सब लोगों पर
  rationale: यहाँ πάντας का आशय व्यक्तियों से है। ‘सब लोगों पर यह बात प्रकाश में लाऊँ’ सार्वभौमिक दायरे और प्रकाश के रूपक—दोनों को व्यक्त करता है।
- source_word: τίς ἡ οἰκονομία
  choice: प्रबंध क्या है
  rationale: οἰκονομία व्यवस्था, प्रबंध, दायित्वपूर्ण संचालन या योजना का संकेत दे सकता है। ‘प्रबंध’ इसके क्रियान्वयन और व्यवस्था के भाव को रखता है, बिना किसी बाद की तकनीकी धर्मवैज्ञानिक प्रणाली को पाठ में डालने के।
- source_word: μυστήριον
  choice: रहस्य
  rationale: पौलुस के प्रयोग में यह परमेश्वर के उस उद्देश्य को सूचित करता है जो पहले छिपा था और अब प्रकट हुआ है। ‘रहस्य’ हिन्दी में इस स्थापित भाव को सुरक्षित रखता है।
- source_word: ἀποκεκρυμμένου
  choice: छिपा रहा है
  rationale: पूर्णकालिक कर्मवाच्य कृदंत पहले से छिपाए जाने के फलस्वरूप बनी हुई अवस्था बताता है। ‘छिपा रहा है’ उस निरंतर अवस्था को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τῶν αἰώνων
  choice: युगों से
  rationale: यह मूल के बहुवचन ‘युगों’ और दीर्घकाल से चले आ रहे छिपाव को बनाए रखता है; ‘अनादिकाल से’ कहना मूल से अधिक व्याख्यात्मक होता।
- source_word: ἐν τῷ θεῷ
  choice: उस परमेश्वर में
  rationale: ἐν का सीधा स्थानवाचक भाव ‘में’ है। यह रहस्य के परमेश्वर में छिपे होने की पौलुसी अभिव्यक्ति को ‘परमेश्वर के पास’ बनाकर कमजोर नहीं करता।
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: जिसने सब कुछ सृजा
  rationale: सम्बन्धवाचक उपवाक्य हिन्दी में स्वाभाविक रूप से उस परमेश्वर का वर्णन करता है; ‘सब कुछ’ τὰ πάντα का व्यापक अर्थ रखता है।
theological_decisions:
- issue: रहस्य के संबंध में οἰκονομία का अर्थ
  choice: प्रबंध
  alternative: व्यवस्था; भंडारीपन; योजना
  rationale: संदर्भ रहस्य के केवल विषय-वस्तु की नहीं, उसके व्यवस्थित क्रियान्वयन या संचालन की ओर संकेत कर सकता है। ‘प्रबंध’ प्रबंधकीय भाव बचाता है, पर किसी विशिष्ट बाद की धर्मवैज्ञानिक प्रणाली को आरोपित नहीं करता।
- issue: ἀπὸ τῶν αἰώνων का कालगत बल
  choice: युगों से
  alternative: युगों तक; अनादिकाल से
  rationale: यूनानी पाठ स्पष्ट रूप से ‘युगों’ की बात करता है, ‘अनन्तता’ की नहीं। इसलिए अधिक व्याख्यात्मक ‘अनादिकाल से’ को मुख्य पाठ में नहीं रखा गया।
- issue: ἐν τῷ θεῷ में रहस्य और परमेश्वर का संबंध
  choice: परमेश्वर में छिपा
  alternative: परमेश्वर के पास छिपा
  rationale: ‘में’ मूल पूर्वसर्ग को निकटता से व्यक्त करता है और इस कथन की धर्मवैज्ञानिक गहनता व संभावित तनाव को सरल करके केवल अधिकार या संरक्षण का भाव नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘प्रकाश में लाना’ मूल के प्रकाश-रूपक को बनाए रखता है। वाक्य पिछले पद के उद्देश्यसूचक क्रम को आगे बढ़ाता है, इसलिए आरम्भ में ‘और’ तथा प्रथम पुरुष ‘लाऊँ’ रखा गया है।
