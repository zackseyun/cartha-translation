lexical_decisions:
- source_word: ἵνα
  choice: कि
  rationale: यह पौलुस की प्रार्थना की विषय-वस्तु अथवा अभिप्राय को आगे बढ़ाता है और पिछले वाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: δῷ ὑμῖν
  choice: वह ... तुम्हें यह दे
  rationale: δίδωμι के देने या प्रदान करने के सामान्य अर्थ को रखा गया है; ‘यह’ आगे आने वाले क्रियार्थक कथन को सहज हिन्दी में प्रस्तुत करता है।
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: अपनी महिमा के धन के अनुसार
  rationale: κατά यहाँ मापदण्ड या परिमाण बताता है। ‘के अनुसार’ इस भाव को रखता है, जबकि ‘में से’ केवल एक अंश दिए जाने का संकेत दे सकता है।
- source_word: δυνάμει κραταιωθῆναι
  choice: सामर्थ्य पाकर ... बलवन्त हो जाओ
  rationale: यह प्रयोग साधनसूचक δυνάμει और निष्क्रिय क्रिया κραταιωθῆναι, दोनों के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: उसके आत्मा के द्वारा
  rationale: διά के साथ सम्बन्धकारक साधन अथवा माध्यम दर्शाता है; ‘उसके आत्मा’ परमेश्वर के आत्मा के सन्दर्भ को स्पष्ट रखता है।
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: अपने भीतरी स्वरूप में
  rationale: यह व्यक्ति के आन्तरिक अस्तित्व को दर्शाता है। ‘भीतरी स्वरूप’ आधुनिक हिन्दी में स्वाभाविक है और पुरुष-विशेष का अनावश्यक आभास नहीं देता; यूनानी का शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: πνεῦμα का सन्दर्भ
  choice: परमेश्वर का आत्मा (‘उसके आत्मा’)
  alternative: सामान्य अर्थ में उसकी आत्मिक शक्ति या प्रभाव
  rationale: प्रसंग में विश्वासियों को बल देने वाला माध्यम परमेश्वर का आत्मा है; फिर भी अनुवाद यूनानी की सरल अभिव्यक्ति ‘उसके आत्मा’ से आगे नहीं जाता।
- issue: ἔσω ἄνθρωπον का अर्थ
  choice: व्यक्ति का भीतरी स्वरूप
  alternative: भीतरी मनुष्य
  rationale: ἄνθρωπος यहाँ प्रतिनिधिक एकवचन है, पुरुषों तक सीमित नहीं। मुख्य पाठ में स्वाभाविक और समावेशी हिन्दी रखी गई है तथा शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। पद पिछले वाक्य पर निर्भर उपवाक्य है, इसलिए आरम्भ और अन्त में उसकी निरन्तरता बनाए रखी गई है।
