lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: प्रकाशन के द्वारा
  rationale: यह वाक्यांश उस माध्यम या रीति को बताता है जिसके द्वारा रहस्य प्रकट हुआ। ‘प्रकाशन के द्वारा’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी के संभावित अर्थ ‘प्रकाशन के अनुसार’ को आवश्यकता से अधिक निर्णायक बनाए बिना संदर्भगत भाव देता है।
- source_word: ἐγνωρίσθη μοι
  choice: मुझ पर प्रकट किया गया
  rationale: यूनानी क्रिया कर्मवाच्य है और कर्ता को स्पष्ट नहीं करती। ‘प्रकट किया गया’ इस कर्मवाच्य को बनाए रखता है; ‘मुझे बताया गया’ रहस्योद्घाटन के भाव को कमजोर करता।
- source_word: τὸ μυστήριον
  choice: वह रहस्य
  rationale: ‘रहस्य’ पौलुस की उस धारणा को सुरक्षित रखता है जिसमें पहले छिपी हुई ईश्वरीय योजना अब प्रकट होती है। ‘वह’ निश्चित पद और पूर्वोक्त विषय की ओर संकेत को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καθὼς
  choice: जैसा कि
  rationale: यह वर्तमान कथन की तुलना पौलुस के पहले लिखे कथन से सहज और सटीक रूप में जोड़ता है।
- source_word: προέγραψα
  choice: मैं पहले ... लिख चुका हूँ
  rationale: संदर्भ में इसका अर्थ इसी पत्र में पहले लिखना है। हिन्दी का पूर्ण पक्ष पहले सम्पन्न लेखन और उसकी वर्तमान प्रासंगिकता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν ὀλίγῳ
  choice: थोड़े शब्दों में
  rationale: यह मुहावरा संक्षिप्त लेखन को दर्शाता है। ‘थोड़े शब्दों में’ सामान्य पाठक के लिए ‘संक्षेप में’ जितना स्वाभाविक है और मूल रूपक को अधिक स्पष्टता से रखता है।
theological_decisions:
- issue: पौलुसी प्रयोग में μυστήριον का अर्थ
  choice: ‘रहस्य’ को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: ‘गुप्त योजना’ या ‘परमेश्वर की छिपी हुई योजना’
  rationale: इस पद में रहस्य का पूरा आशय अभी परिभाषित नहीं किया गया है। संदर्भ से आगे बढ़कर उसकी विषयवस्तु जोड़ना मूल पाठ से अधिक कहना होता; ‘रहस्य’ पौलुस की धर्मवैचारिक धारणा और आगे आने वाली व्याख्या दोनों को सुरक्षित रखता है।
- issue: प्रकाशन का निहित कर्ता
  choice: कर्मवाच्य ‘प्रकट किया गया’ रखना
  alternative: ‘परमेश्वर ने मुझ पर प्रकट किया’
  rationale: संदर्भ में परमेश्वर कर्ता समझे जा सकते हैं, पर यूनानी इस पद में उन्हें स्पष्ट रूप से नहीं कहता। अनकहे कर्ता को न जोड़ना मूल की संरचना और अंतर्निहित अस्पष्टता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘प्रकाशन’ और ‘रहस्य’ जैसे स्थापित धर्मवैचारिक शब्द सुरक्षित रखे गए हैं, पर वाक्य-विन्यास स्वाभाविक हिन्दी का है।
