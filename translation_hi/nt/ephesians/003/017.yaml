id: EPH.3.17
reference: Ephesians 3:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: κατοικῆσαι τὸν Χριστὸν διὰ τῆς πίστεως ἐν ταῖς καρδίαις ὑμῶν ἐν ἀγάπῃ· ἐρριζωμένοι καὶ τεθεμελιωμένοι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/017.yaml
  text: so that Messiah may dwell in your hearts through faith[a], being rooted and grounded in love[c][b],
translation:
  language: hi
  text: कि विश्वास[a] के द्वारा मसीह आपके हृदयों में वास करे, और आप प्रेम में[b] जड़ पकड़े हुए और नींव पर स्थापित हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भरोसे के द्वारा।” यहाँ यूनानी शब्द πίστις के लिए “विश्वास” संदर्भ में अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: “प्रेम में” को सबसे स्वाभाविक रूप से “जड़ पकड़े हुए और नींव पर स्थापित” के साथ जोड़ा जाता है; कुछ इसे “आपके हृदयों में वास करे” के साथ जोड़ते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: κατοικῆσαι
  choice: वास करे
  rationale: यह क्रिया स्थायी रूप से निवास करने का भाव देती है। हिंदी में ‘वास करे’ गरिमापूर्ण, स्वाभाविक और ‘रहे’ से अधिक स्थायी निवास का संकेत देती है।
- source_word: τὸν Χριστόν
  choice: मसीह
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है। ‘मसीह’ आधुनिक हिंदी बाइबलीय भाषा में इस उपाधि का मानक और अर्थपूर्ण रूप है।
- source_word: διὰ τῆς πίστεως
  choice: विश्वास के द्वारा
  rationale: यहाँ πίστις उस माध्यम को दर्शाता है जिसके द्वारा मसीह हृदयों में वास करता है। संदर्भ में ‘विश्वास’ सबसे उपयुक्त है, जबकि ‘भरोसा’ एक संभव अर्थछाया है।
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: आपके हृदयों में
  rationale: बहुवचन मूल पाठ के अनुरूप है और प्रत्येक संबोधित व्यक्ति के भीतरी अस्तित्व को दर्शाता है; यह केवल भावनाओं तक सीमित नहीं है।
- source_word: ἐν ἀγάπῃ
  choice: प्रेम में
  rationale: यह वाक्यांश सबसे स्वाभाविक रूप से आगे के दोनों कृदंतों की अवस्था या आधार को बताता है।
- source_word: ἐρριζωμένοι
  choice: जड़ पकड़े हुए
  rationale: पूर्ण निष्क्रिय कृदंत से उत्पन्न और जारी अवस्था व्यक्त होती है। यह हिंदी रूप कृषि-संबंधी रूपक को स्वाभाविक ढंग से बनाए रखता है।
- source_word: τεθεμελιωμένοι
  choice: नींव पर स्थापित
  rationale: यह स्थापत्य रूपक और पूर्ण निष्क्रिय कृदंत की स्थायी परिणामी अवस्था दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: Χριστός का रूपांतरण
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: संदर्भ में यह अभिषिक्त जन की उपाधि है। ‘मसीह’ हिंदी में प्रचलित है और केवल नाम-जैसे लिप्यंतरण की अपेक्षा उपाधि की पहचान को बेहतर बनाए रखता है।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा
  rationale: यहाँ किसी व्यक्ति की ‘विश्वासयोग्यता’ की अपेक्षा विश्वास के माध्यम का अर्थ अधिक स्वाभाविक है; फिर भी ‘भरोसा’ इसकी निकट अर्थछाया है।
- issue: ἐν ἀγάπῃ का संबंध
  choice: ‘जड़ पकड़े हुए और नींव पर स्थापित’ के साथ
  alternative: ‘आपके हृदयों में वास करे’ के साथ
  rationale: शब्दक्रम और दोनों रूपकों का प्रवाह ‘प्रेम में’ को आगे आने वाले कृदंतों से जोड़ने का समर्थन करते हैं, पर वैकल्पिक व्याकरणिक संबंध संभव है।
translation_notes:
  register: आधुनिक मानक हिंदी में सम्मानसूचक बहुवचन ‘आपके’ रखा गया है। ‘वास करे’ और ‘नींव पर स्थापित’ गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट हैं। कृषि और स्थापत्य के दोनों मूल रूपक सुरक्षित रखे गए हैं।
