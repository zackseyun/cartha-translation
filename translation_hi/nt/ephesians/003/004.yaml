  yaml_path: translation/nt/ephesians/003/004.yaml
  text: By reading this[a], you are able to understand my insight into the mystery of Messiah,
translation:
  language: hi
  text: इसे पढ़कर आप मसीह[a] के रहस्य के विषय में मेरी अंतर्दृष्टि को समझ सकते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीष्ट”। यूनानी उपाधि Χριστός का अनुवाद “मसीह” किया जा सकता है, या पारंपरिक रूप से “ख्रीष्ट”।
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὃ … ἀναγινώσκοντες
  choice: इसे पढ़कर
  rationale: πρὸς ὃ पहले लिखी हुई बात की ओर संकेत करता है, और ἀναγινώσκοντες के साथ मिलकर उसे पढ़ने को समझ प्राप्त करने का साधन बताता है। ‘इसे पढ़कर’ इस संबंध को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: δύνασθε
  choice: आप … सकते हैं
  rationale: यह सामर्थ्य या क्षमता प्रकट करता है; हिन्दी में ‘सकते हैं’ इसका सहज समतुल्य है।
- source_word: νοῆσαι
  choice: जान सकते हैं
  rationale: यह मानसिक रूप से ग्रहण करने या समझने का भाव देता है। आगे σύνεσις के लिए ‘समझ’ आने के कारण ‘जान सकते हैं’ अनावश्यक पुनरावृत्ति से बचते हुए अर्थ बनाए रखता है।
- source_word: τὴν σύνεσίν μου
  choice: मेरी समझ
  rationale: σύνεσις बोध, समझ या अंतर्दृष्टि को सूचित करता है। ‘मेरी समझ’ सामान्य पाठक के लिए स्पष्ट और स्रोत के निकट है।
- source_word: ἐν τῷ μυστηρίῳ
  choice: रहस्य के विषय में
  rationale: ἐν यहाँ समझ के क्षेत्र या विषय को बताता है। ‘के विषय में’ हिन्दी मुहावरे में स्वाभाविक है और संबंध को जरूरत से अधिक निश्चित नहीं करता।
- source_word: τοῦ Χριστοῦ
  choice: मसीह के
  rationale: Χριστός यहाँ उपाधि के रूप में है। ‘मसीह’ हिन्दी में इसके अभिषिक्त जन/मसीहा संबंधी अर्थ को स्वाभाविक ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: τοῦ Χριστοῦ का अर्थ-संबंध
  choice: मसीह के रहस्य
  alternative: मसीह के विषय का रहस्य
  rationale: यूनानी संबंधकारक यह खुला छोड़ सकता है कि रहस्य मसीह से संबंधित है, मसीह में केंद्रित है, या किसी अर्थ में मसीह का है। संक्षिप्त संबंधकारक ‘मसीह के रहस्य’ इसी व्यापकता को बनाए रखता है।
- issue: Χριστός का हिन्दी रूप
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: ‘मसीह’ आधुनिक हिन्दी में उपाधि का अर्थ अधिक स्पष्ट रखता है; पारंपरिक रूप को पादटिप्पणी में दिया गया है।
translation_notes:
  register: वाक्य आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखा गया है। ‘इसे पढ़कर’ पूर्ववर्ती लिखित कथन से संबंध स्पष्ट करता है, जबकि ‘मसीह के रहस्य’ मूल की संक्षिप्तता और अर्थगत व्यापकता बनाए रखता है।
