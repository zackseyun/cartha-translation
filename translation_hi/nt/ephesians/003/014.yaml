translation:
  language: hi
  text: इस कारण मैं पिता के सामने घुटने टेकता हूँ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: इस कारण
  rationale: यह वाक्यांश आगे कही जाने वाली प्रार्थना का कारण बताते हुए पिछले प्रसंग से संबंध जोड़ता है। ‘इस कारण’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: κάμπτω τὰ γόνατά μου
  choice: मैं ... घुटने टेकता हूँ
  rationale: यूनानी में शाब्दिक चित्र ‘अपने घुटने मोड़ता हूँ’ है, पर हिन्दी में प्रार्थना की इस शारीरिक मुद्रा के लिए ‘घुटने टेकना’ स्वाभाविक मुहावरा है और घुटनों का स्पष्ट उल्लेख भी बनाए रखता है।
- source_word: πρὸς
  choice: के सामने
  rationale: यहाँ πρός प्रार्थना में व्यक्ति की ओर अभिमुख होने का भाव देता है। ‘के सामने’ हिन्दी में घुटने टेकने के साथ स्वाभाविक है, यद्यपि ‘की ओर’ अधिक शाब्दिक विकल्प है।
- source_word: πατέρα
  choice: पिता
  rationale: संदर्भ में इसका संकेत परमेश्वर की ओर है और यह संबोधनात्मक ईश्वरीय पद के रूप में प्रयुक्त है। हिन्दी में ‘पिता’ इसी अर्थ को गरिमापूर्वक व्यक्त करता है।
theological_decisions:
- issue: क्या πατέρα को परमेश्वर के लिए ईश्वरीय पद माना जाए
  choice: पिता
  alternative: उस पिता / पिता की ओर
  rationale: पौलुस यहाँ अपनी प्रार्थना परमेश्वर से किए जाने की बात कहता है, और अगला पद पितृत्व की भाषा को आगे बढ़ाता है। फिर भी पद में ‘परमेश्वर’ या ‘हमारे’ जोड़ना स्रोत से अधिक स्पष्टता भर देता, इसलिए केवल ‘पिता’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘घुटने टेकता हूँ’ शाब्दिक ‘अपने घुटने मोड़ता हूँ’ की अपेक्षा स्वाभाविक हिन्दी है, जबकि मूल शारीरिक बिंब को सुरक्षित रखता है।
