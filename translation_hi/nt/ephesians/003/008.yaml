  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: hi
  text: मुझे, जो सभी पवित्र जनों में सबसे छोटा हूँ[a], यह अनुग्रह दिया गया कि मैं गैर-यहूदियों[b] के बीच मसीह[c] की अथाह संपदा का शुभ समाचार सुनाऊँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: ‘सभी पवित्र जनों में छोटे से भी छोटा।’'
    reason: lexical_alternative
  - marker: b
    text: या ‘अन्यजातियों’; यूनानी शब्द का मूल अर्थ ‘जातियाँ’ भी हो सकता है, पर यहाँ आशय गैर-यहूदी लोगों से है।
    reason: lexical_alternative
  - marker: c
    text: या ‘ख्रीष्ट’; यूनानी उपाधि Χριστός का अर्थ ‘अभिषिक्त जन’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: सबसे छोटा
  rationale: यह असामान्य, प्रबल रूप पौलुस की अत्यंत दीनता व्यक्त करता है। ‘सबसे छोटा’ सहज आधुनिक हिन्दी है; पादटिप्पणी में इसकी अधिक शाब्दिक तीव्रता दी गई है।
- source_word: ἁγίων
  choice: पवित्र जनों
  rationale: यह पौलुस के प्रयोग में परमेश्वर के लिए अलग किए गए विश्वासियों को दर्शाता है। ‘पवित्र जन’ अर्थ स्पष्ट रखते हुए ‘संत’ से जुड़ी बाद की विशिष्ट धारणाओं से बचता है।
- source_word: χάρις
  choice: अनुग्रह
  rationale: यह परमेश्वर की कृपा और उसी से सौंपे गए दायित्व—दोनों की छाया को बनाए रखता है।
- source_word: ἔθνεσιν
  choice: गैर-यहूदियों
  rationale: इस प्रसंग में शब्द का संकेत यहूदी जाति से बाहर के लोगों की ओर है, न कि केवल राजनीतिक राष्ट्रों की ओर।
- source_word: εὐαγγελίσασθαι
  choice: शुभ समाचार सुनाऊँ
  rationale: क्रिया का अर्थ शुभ समाचार घोषित करना है। यह हिन्दी में स्वाभाविक है और आगे आने वाली ‘संपदा’ को उसी संदेश की विषयवस्तु के रूप में जोड़ता है।
- source_word: ἀνεξιχνίαστον
  choice: अथाह
  rationale: शब्द ऐसी वस्तु को दर्शाता है जिसकी पूरी थाह या खोज नहीं ली जा सकती। ‘अथाह’ हिन्दी में इस रूपक और अगम्यता दोनों को सहज रूप से व्यक्त करता है।
- source_word: πλοῦτος
  choice: संपदा
  rationale: एकवचन यूनानी शब्द प्रचुर धन या वैभव के रूपक को व्यक्त करता है। ‘संपदा’ मसीह में उपलब्ध असीम बहुतायत के लिए स्वाभाविक है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός यहाँ अभिषिक्त जन की उपाधि के रूप में प्रयुक्त है; ‘मसीह’ हिन्दी में उस उपाधि के अर्थ और प्रचलित बाइबलीय पहचान को बनाए रखता है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ Χριστός उपाधि-सदृश है। ‘मसीह’ अभिषिक्त जन की धारणा को व्यक्त करता है, जबकि ‘ख्रीष्ट’ उसी यूनानी उपाधि का लिप्यंतरण है; पाठ में अर्थसूचक रूप चुना गया है।
- issue: χάρις में कृपा और सेवकीय दायित्व का संबंध
  choice: यह अनुग्रह किया गया कि मैं… शुभ समाचार सुनाऊँ
  alternative: मुझे यह अनुग्रह-दान मिला
  rationale: वाक्य परमेश्वर के अनुग्रह को पौलुस को सौंपी गई घोषणा की सेवा से जोड़ता है। चुना गया रूप दोनों को साथ रखता है और ‘अनुग्रह’ को केवल योग्यता या केवल पद नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पवित्र जन’ सामूहिक पौलुसी अर्थ स्पष्ट करता है; ‘गैर-यहूदी’ आज अधिक तुरंत समझ में आता है। ‘अथाह संपदा’ यूनानी रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
