source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ ὧν αἰτούμεθα ἢ νοοῦμεν κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/020.yaml
  text: To the one who is able to do far beyond all that we ask or think[a], according to the power at work in us[b],
translation:
  language: hi
  text: और जो हम जो कुछ माँगते या सोचते हैं, उस सब से कहीं बढ़कर[a] करने में समर्थ है—उस सामर्थ्य के अनुसार जो हममें कार्य कर रही है[b]—उसको,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अत्यन्त बढ़कर’ अथवा ‘हद से कहीं अधिक’; यूनानी शब्द हमारी माँग और सोच से बढ़कर होने के भाव पर बहुत बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हमारे बीच कार्य कर रही है’; यूनानी वाक्यांश का अर्थ विश्वासियों के भीतर अथवा उनके समुदाय में सक्रिय होना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: जो ... कर सकता है ... उसको
  rationale: सम्प्रदान कारक में आए संज्ञा-समान कृदन्त को हिन्दी में स्वाभाविक सम्बन्धवाचक रचना से व्यक्त किया गया है। इससे पद 21 में पूरी होने वाली स्तुतिवाचक वाक्य-रचना भी बनी रहती है और यहाँ ‘परमेश्वर’ शब्द नहीं जोड़ा जाता।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ तीखा विरोध नहीं, बल्कि स्तुति की ओर हल्का संक्रमण दिखाता है। ‘और’ उस सम्बन्ध को स्वाभाविक ढंग से व्यक्त करता है; कालसूचक ‘अब’ मूल में नहीं है।
- source_word: ὑπὲρ πάντα ... ὧν
  choice: हम ... उस सब से ... बढ़कर
  rationale: तुलनात्मक रचना का आशय यह है कि उसका करना हमारी समस्त माँग और सोच की सीमा से परे है। हिन्दी में ‘उस सब से’ सम्बन्धवाचक वाक्य को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ποιῆσαι
  choice: कर सकता है
  rationale: ποιέω का व्यापक और सरल अर्थ ‘करना’ है; ‘पूरा करना’ या ‘सिद्ध करना’ अनावश्यक रूप से अर्थ को सीमित कर सकता है।
- source_word: ὑπερεκπερισσοῦ
  choice: कहीं बढ़कर
  rationale: यह अत्यन्त बलवर्धक क्रिया-विशेषण सीमा से बहुत अधिक होने का भाव देता है। ‘कहीं बढ़कर’ आधुनिक हिन्दी में उसका जोर सहज रूप से पहुँचाता है।
- source_word: αἰτούμεθα ἢ νοοῦμεν
  choice: माँगते या सोचते हैं
  rationale: αἰτέω को ‘माँगना’ और νοέω को व्यापक मानसिक क्रिया ‘सोचना’ के रूप में रखा गया है। ‘कल्पना करना’ सम्भव है, पर वह अर्थ को कुछ संकरा कर सकता है।
- source_word: κατὰ τὴν δύναμιν
  choice: उस सामर्थ्य के अनुसार
  rationale: κατά यहाँ केवल साधन नहीं, मानक या परिमाण का भाव देता है; इसलिए ‘के द्वारा’ की अपेक्षा ‘के अनुसार’ अधिक सटीक है।
- source_word: τὴν ἐνεργουμένην
  choice: कार्य कर रहा है
  rationale: वर्तमान कृदन्त निरन्तर और प्रभावी सक्रियता बताता है। यह हिन्दी अभिव्यक्ति उस जारी कार्य को स्पष्ट रखती है।
- source_word: ἐν ἡμῖν
  choice: हममें
  rationale: यह सीधा अनुवाद विश्वासियों के भीतर या उनके सामूहिक जीवन में सक्रिय सामर्थ्य का व्यापक भाव बनाए रखता है।
theological_decisions:
- issue: स्तुति पाने वाले का निहित सन्दर्भ
  choice: ‘जो ... कर सकता है ... उसको’—इस पद में ‘परमेश्वर’ नहीं जोड़ा गया
  alternative: ‘उस परमेश्वर को जो ... कर सकता है’
  rationale: सन्दर्भ स्पष्टतः परमेश्वर की ओर संकेत करता है, पर इस पद के यूनानी पाठ में संज्ञा दोहराई नहीं गई। चुनी हुई रचना पद 21 तक चलने वाली मूल वाक्य-संरचना और निहित सन्दर्भ दोनों को सुरक्षित रखती है।
- issue: विश्वासियों में सक्रिय सामर्थ्य का स्वरूप
  choice: ‘वह सामर्थ्य जो हममें कार्य कर रहा है’
  alternative: ‘वह सामर्थ्य जो हमारे बीच कार्य कर रहा है’
  rationale: अनुवाद परमेश्वर के प्रभावी सामर्थ्य की वास्तविक सक्रियता को स्वीकार करता है, पर उसके संचालन को किसी विशेष सम्प्रदायगत शिक्षा, वरदान या पवित्रीकरण की व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद स्वयं एक अधूरा स्तुतिवाचक खण्ड है जो अगले पद में पूरा होता है; अन्त का अल्पविराम और बीच के डैश इसी निरन्तर वाक्य-संरचना को दर्शाते हैं।
