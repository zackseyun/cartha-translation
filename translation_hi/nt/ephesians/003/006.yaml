  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘गैर-यहूदी’ ने संदर्भगत अर्थ स्पष्ट किया है; ‘मसीह’, ‘सुसमाचार’, ‘प्रतिज्ञा’ और ‘देह’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं। ‘भी साथ-साथ’ यूनानी के तीन σύν-युक्त विशेषणों की साझा-समानता को पूरे त्रिक पर लागू करता है।
