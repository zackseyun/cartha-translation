translation:
  language: hi
  text: अर्थात गैर-यहूदी लोग[a] भी सुसमाचार के द्वारा मसीह यीशु में सह-उत्तराधिकारी, एक ही देह के अंग[b] और प्रतिज्ञा में सहभागी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘जातियाँ’; यहाँ आशय गैर-यहूदी लोगों से है, जिन्हें इस्राएल के साथ परमेश्वर की उद्धारकारी प्रतिज्ञा में सम्मिलित किया गया है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी का दुर्लभ शब्द एक ही देह में साथ सम्मिलित होने का भाव देता है; इसे ‘एक ही देह के सह-अंग’ भी कहा जा सकता है।
    reason: lexical_clarification
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: गैर-यहूदी लोग
  rationale: इस संदर्भ में यह शब्द राजनीतिक अर्थ में ‘राष्ट्रों’ के लिए नहीं, बल्कि यहूदियों के साथ परमेश्वर की प्रतिज्ञा में सम्मिलित किए गए गैर-यहूदी लोगों के लिए है।
- source_word: συγκληρονόμα
  choice: साथ-साथ उत्तराधिकारी
  rationale: σύν- उपसर्ग साझा अधिकार पर बल देता है। यह रूप समान उत्तराधिकार को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σύσσωμα
  choice: एक ही देह के अंग
  rationale: यह दुर्लभ संयुक्त शब्द एक ही देह में सम्मिलित होने का भाव देता है। अनुवाद पौलुस की देह-वाली उपमा को स्पष्ट और स्वाभाविक रखता है।
- source_word: συμμέτοχα
  choice: सहभागी
  rationale: यह शब्द दूसरों के साथ किसी वस्तु में भाग लेने को दर्शाता है। वाक्य में ‘भी’ और ‘साथ-साथ’ तीनों समानताओं के संयुक्त भाव को वहन करते हैं।
- source_word: τῆς ἐπαγγελίας
  choice: प्रतिज्ञा में
  rationale: सम्बन्धकारक यहाँ सहभागिता की वस्तु बताता है; हिन्दी में ‘प्रतिज्ञा में सहभागी’ सबसे स्वाभाविक है और यूनानी के एकवचन को बनाए रखता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ‘मसीह’ Χριστός के अभिषिक्त उद्धारकर्ता वाले पदवीगत अर्थ को सुरक्षित रखता है; ‘में’ संघ और उद्धार-क्षेत्र की मूल अस्पष्टता को अनावश्यक रूप से नहीं खोलता।
- source_word: διὰ τοῦ εὐαγγελίου
  choice: सुसमाचार के द्वारा
  rationale: सम्बन्धकारक के साथ διά उस माध्यम को बताता है जिसके द्वारा गैर-यहूदी इस साझेदारी में आते हैं।
- source_word: εἶναι
  choice: अर्थात ... हैं
  rationale: यह अनंत क्रिया पिछले पद में बताए गए भेद का आशय खोलती है। ‘अर्थात’ हिन्दी में इस व्याख्यात्मक सम्बन्ध को स्वाभाविक रूप से जोड़ता है।
theological_decisions:
- issue: Χριστῷ को पदवी के रूप में या नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु / क्राइस्ट यीशु
  rationale: इस उद्धार-ऐतिहासिक प्रसंग में Χριστός की पदवीगत शक्ति सक्रिय है; हिन्दी ‘मसीह’ उस अर्थ को स्पष्ट और प्रचलित रूप में व्यक्त करता है।
- issue: ἔθνη का संदर्भ
  choice: गैर-यहूदी लोग
  alternative: जातियाँ / राष्ट्र
  rationale: तात्कालिक प्रसंग यहूदियों के साथ गैर-यहूदियों की समान सहभागिता का है। ‘जातियाँ’ आधुनिक हिन्दी में जाति-व्यवस्था का भ्रम पैदा कर सकता है और ‘राष्ट्र’ अर्थ को भू-राजनीतिक बना सकता है।
- issue: तीनों σύν-युक्त शब्दों की समानता
  choice: ‘भी साथ-साथ’ के साथ उत्तराधिकारी, एक ही देह के अंग और सहभागी
  alternative: सह-उत्तराधिकारी, सह-देही और सह-भागी
  rationale: यूनानी की त्रिस्तरीय समानता को बनाए रखते हुए कृत्रिम हिन्दी संयुक्त शब्दों से बचा गया है। इससे यह संकेत बना रहता है कि तीनों दर्जे गैर-यहूदियों को अन्य विश्वासियों के साथ समान रूप से प्राप्त हैं।
