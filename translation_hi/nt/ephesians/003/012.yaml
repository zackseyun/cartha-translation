    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: जिसमें
  rationale: पुल्लिंग एकवचन सम्बन्धवाचक सर्वनाम निकटवर्ती संदर्भ में मसीह की ओर संकेत करता है; ‘जिसमें’ मसीह के साथ संबंध का भाव बनाए रखता है।
- source_word: παρρησίαν
  choice: साहस
  rationale: यह खुलकर और निडर होकर उपस्थित होने का भाव देता है तथा बाद के πεποίθησις (‘भरोसा’) से अलग अर्थ बनाए रखता है।
- source_word: προσαγωγὴν
  choice: परमेश्वर तक पहुँच
  rationale: पौलुस के प्रयोग में यह परमेश्वर की उपस्थिति में प्रवेश या पहुँच को दर्शाता है। लक्ष्य ‘परमेश्वर’ संदर्भ से स्पष्ट है और हिन्दी में इसे व्यक्त करने से वाक्य स्वाभाविक बनता है।
- source_word: ἐν πεποιθήσει
  choice: भरोसे के साथ
  rationale: यह आश्वस्त होकर पहुँचने की रीति बताता है; आधुनिक हिन्दी में स्वाभाविक है और ‘साहस’ की पुनरावृत्ति से बचता है।
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: उस पर विश्वास के द्वारा
  rationale: मुख्य पाठ में αὐτοῦ को वस्तुगत संबंध मानते हुए मसीह पर किए गए विश्वास का अर्थ लिया गया है; कर्तृगत संबंध की वास्तविक सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: διὰ τῆς πίστεως αὐτοῦ में αὐτοῦ का संबंध
  choice: उस पर विश्वास के द्वारा
  alternative: उसकी विश्वासयोग्यता के द्वारा
  rationale: यूनानी संबंधकारक विश्वास को मसीह की ओर निर्देशित या मसीह की अपनी विश्वासयोग्यता—दोनों रूपों में व्यक्त कर सकता है। विश्वासियों की वर्तमान पहुँच पर बल होने के कारण सामान्य वस्तुगत अर्थ मुख्य पाठ में रखा गया है, पर वैकल्पिक अर्थ को हटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धार्मिक गद्य। ‘साहस’ और ‘भरोसा’ द्वारा मूल के दो निकट लेकिन अलग शब्दों का भेद रखा गया है। पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित है।
