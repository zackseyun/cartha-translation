source:
  edition: SBLGNT
  text: ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/005.yaml
  text: which was not made known to the sons of men in other generations as it has now been revealed to his holy apostles and prophets in the Spirit[b][a],
translation:
  language: hi
  text: जो अन्य पीढ़ियों में मनुष्यों के पुत्रों[a] को उस प्रकार ज्ञात नहीं कराया गया था, जिस प्रकार अब आत्मा में[b] उसके पवित्र प्रेरितों और भविष्यद्वक्ताओं को प्रकट किया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘मनुष्यों को’ या ‘मानवजाति को’; यूनानी में शाब्दिक रूप से ‘मनुष्यों के पुत्रों’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘आत्मा के द्वारा’; यूनानी वाक्यांश क्षेत्र अथवा माध्यम, दोनों का भाव व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: जो
  rationale: सम्बन्धवाचक सर्वनाम को बनाए रखता है और पिछले पद में आए ‘रहस्य’ को इस पद में अनावश्यक रूप से दोहराता नहीं।
- source_word: ἑτέραις γενεαῖς
  choice: बीती हुई पीढ़ियों में
  rationale: यहाँ दत्तिव का कालवाचक अर्थ है। हिन्दी में यह स्वाभाविक रूप से पहले की पीढ़ियों को दर्शाता है।
- source_word: οὐκ ἐγνωρίσθη
  choice: नहीं बताया गया था
  rationale: γνωρίζω के कर्मवाच्य और ‘ज्ञात कराना/बताना’ के कारक भाव को स्पष्ट, सहज हिन्दी में सुरक्षित रखता है।
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: मनुष्यों के पुत्रों
  rationale: मूल के सामी-शैली वाले रूप को निकटता से रखता है; पादटिप्पणी स्पष्ट करती है कि अभिप्राय सामान्यतः मानवजाति से है।
- source_word: ὡς νῦν
  choice: जिस प्रकार अब
  rationale: पहले और अब के प्रकाशन के ढंग या परिमाण की तुलना को बनाए रखता है; यह पूर्णतः अज्ञात होने का अनावश्यक दावा नहीं करता।
- source_word: ἀπεκαλύφθη
  choice: प्रकट किया गया है
  rationale: प्रकाशन-संबंधी प्रमुख पौलुसी क्रिया का कर्मवाच्य और धार्मिक अर्थ सुरक्षित रहता है।
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: उसके पवित्र प्रेरितों और भविष्यद्वक्ताओं पर
  rationale: ‘पवित्र’ को दोनों समन्वित समूहों से सम्बद्ध रखता है और αὐτοῦ को बिना उसके सन्दर्भ को अत्यधिक निर्दिष्ट किए ‘उसके’ कहता है।
- source_word: ἐν πνεύματι
  choice: आत्मा में
  rationale: ἐν का निकट रूप रखते हुए आत्मा को प्रकाशन के क्षेत्र अथवा माध्यम—दोनों सम्भावनाओं के लिए खुला छोड़ता है।
theological_decisions:
- issue: πνεύματι का सन्दर्भ
  choice: परमेश्वर का पवित्र आत्मा
  alternative: मानवीय आत्मा या आत्मिक दशा
  rationale: प्रेरितों और भविष्यद्वक्ताओं को दिए गए दिव्य प्रकाशन का प्रसंग पवित्र आत्मा की ओर दृढ़ता से संकेत करता है। फिर भी ‘आत्मा में’ कहने से यूनानी वाक्यांश के क्षेत्र और माध्यम के बीच का वास्तविक अर्थभेद बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। पद पिछले वाक्य से जुड़ा सम्बन्धवाचक उपवाक्य है, इसलिए आरम्भ में ‘जो’ बनाए रखा गया है।
