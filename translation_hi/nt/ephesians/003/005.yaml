review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the relative linkage, passive voice, comparison between earlier generations and the present, the inclusive Semitic expression, and the ambiguity of ἐν πνεύματι. However, «बीती हुई» narrows ἑτέραις (‘other’) to merely ‘past,’ and «प्रेरितों ... पर» does not represent the Greek dative recipients, which requires ‘to’ rather than ‘upon.’
  naturalness: The sentence is otherwise clear and suitably formal. Replacing «पर» with «को» makes the revelation clause idiomatic and grammatically precise in modern Hindi.
  terminology: «मनुष्यों के पुत्रों» appropriately retains the source expression with an explanatory note. «पवित्र प्रेरितों और भविष्यद्वक्ताओं» and «आत्मा में» are appropriate; the latter, with its footnote, preserves the sphere/means ambiguity.
  issues:
  - severity: medium
    issue: «बीती हुई पीढ़ियों» renders ἑτέραις γενεαῖς too narrowly.
    rationale: ἑτέραις means ‘other’; although these generations are earlier in the comparison, ‘बीती हुई’ omits the stated contrast and may overstate the temporal sense. «अन्य पीढ़ियों में» more closely reflects the Greek.
  - severity: high
    issue: «उसके पवित्र प्रेरितों और भविष्यद्वक्ताओं पर प्रकट किया गया है» uses «पर» for the recipients.
    rationale: τοῖς ... ἀποστόλοις ... καὶ προφήταις is dative, indicating those to whom revelation was given. In Hindi «को प्रकट किया गया है» is required; «पर» can suggest revelation occurring upon them rather than being made known to them.
