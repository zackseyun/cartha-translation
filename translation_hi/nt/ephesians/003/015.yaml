translation:
  language: hi
  text: जिससे स्वर्ग में और पृथ्वी पर हर परिवार का नाम रखा जाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिससे स्वर्ग में और पृथ्वी पर समूचे परिवार का नाम रखा जाता है”; अथवा अधिक व्याख्यात्मक रूप में, “जिससे स्वर्ग में और पृथ्वी पर समस्त पितृत्व अपना नाम पाता है।”
    reason: πᾶσα πατριὰ का अर्थ ‘हर परिवार’ या ‘समूचा परिवार’ हो सकता है; पिछले पद के ‘पिता’ के साथ शब्द-संबंध के कारण ‘समस्त पितृत्व’ भी एक व्याख्यात्मक संभावना है।
lexical_decisions:
- source_word: ἐξ οὗ
  choice: जिससे
  rationale: यह संबंधवाचक पद स्रोत या उद्गम का भाव देता है। ‘जिससे’ संक्षिप्त, स्वाभाविक है और पिछले पद के ‘पिता’ की ओर संकेत बनाए रखता है।
- source_word: πᾶσα
  choice: हर
  rationale: एकवचन संज्ञा के साथ यहाँ वितरणात्मक अर्थ ‘हर’ सर्वाधिक स्वाभाविक है। ‘समूचा’ संभव है, पर वह एक ही सामूहिक परिवार का अर्थ अधिक स्पष्टता से सुझाता है।
- source_word: πατριὰ
  choice: परिवार
  rationale: इसका सामान्य अर्थ परिवार, कुल या वंश-समूह है। ‘परिवार’ आधुनिक हिन्दी में सबसे स्पष्ट है और पिछले पद के ‘पिता’ के साथ निहित शब्द-संबंध को पूरी तरह अमूर्त ‘पितृत्व’ में नहीं बदलता।
- source_word: ἐν οὐρανοῖς
  choice: स्वर्ग में
  rationale: यूनानी में रूप बहुवचन है, पर इस स्थानवाचक अर्थ के लिए हिन्दी में ‘स्वर्ग में’ स्वाभाविक और अर्थपूर्ण है। संयुक्त वाक्यांश में इसे ‘स्वर्ग और पृथ्वी पर’ रूप दिया गया है।
- source_word: ἐπὶ γῆς
  choice: पृथ्वी पर
  rationale: यह मूल के स्थानवाचक अर्थ का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ὀνομάζεται
  choice: नाम रखा जाता है
  rationale: वर्तमान कर्मवाच्य का सीधा अर्थ ‘नाम दिया/रखा जाता है’ है। ‘नाम पाता है’ भी संभव है, जबकि ‘अपना नाम प्राप्त करता है’ स्रोत-व्युत्पत्ति के भाव को अधिक व्याख्यात्मक बना देता है।
theological_decisions:
- issue: पिछले पद के ‘पिता’ के संबंध में πᾶσα πατριὰ का अर्थ
  choice: हर परिवार
  alternative: समूचा परिवार; समस्त पितृत्व
  rationale: ‘हर परिवार’ πᾶσα के संभावित वितरणात्मक अर्थ और πατριά के सामान्य सामाजिक अर्थ को सुरक्षित रखता है। मुख्य पाठ इसे एक ही सार्वभौमिक परिवार या अमूर्त ‘पितृत्व’ के रूप में निर्णायक ढंग से नहीं समझाता; अन्य संभावनाएँ टिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘कुल’ या ‘वंश’ की अपेक्षा ‘परिवार’ व्यापक और स्पष्ट है। मुख्य पाठ में वास्तविक अर्थगत अस्पष्टता को निर्णायक रूप से हल नहीं किया गया; वैकल्पिक पाठ फुटनोट में सुरक्षित हैं।
