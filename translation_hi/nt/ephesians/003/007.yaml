translation:
  language: hi
  text: मैं उस सुसमाचार का सेवक बना, परमेश्वर के अनुग्रह के उस वरदान के अनुसार जो मुझे उसकी सामर्थ्य के सक्रिय कार्य के अनुसार दिया गया—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗ
  choice: उस सुसमाचार का
  rationale: सम्बन्धवाचक सर्वनाम नपुंसकलिंग एकवचन है और पिछले पद के εὐαγγέλιον (‘सुसमाचार’) की ओर संकेत करता है। हिन्दी में संज्ञा को दोहराने से सम्बन्ध स्पष्ट और स्वाभाविक रहता है।
- source_word: ἐγενήθην
  choice: मैं ... बना
  rationale: γίνομαι का यह रूप भूमिका में आने का अर्थ देता है। ‘बना’ सहज हिन्दी है और कर्तृता को अनावश्यक रूप से निश्चित नहीं करता; सम्भव कर्मवाच्य भाव पादटिप्पणी में रखा गया है।
- source_word: διάκονος
  choice: सेवक
  rationale: यहाँ शब्द सुसमाचार की सेवा करनेवाले व्यक्ति को दर्शाता है। ‘सेवक’ कार्यगत अर्थ को बनाए रखता है और बाद के औपचारिक कलीसियाई पद का भाव नहीं जोड़ता।
- source_word: κατὰ τὴν δωρεὰν
  choice: उस वरदान के अनुसार
  rationale: κατά यहाँ मानक, आधार अथवा अनुरूपता व्यक्त करता है। ‘के अनुसार’ यूनानी संरचना और वरदान से जुड़े माप/आधार के भाव को सुरक्षित रखता है।
- source_word: τῆς χάριτος τοῦ θεοῦ
  choice: परमेश्वर के अनुग्रह के
  rationale: सम्बन्धकारक शृंखला को निकटता से रखते हुए यह दर्शाता है कि वरदान परमेश्वर के अनुग्रह का है।
- source_word: τῆς δοθείσης μοι
  choice: जो ... मुझे दिया गया
  rationale: कर्मवाच्य कृदन्त χάριτος से सम्बद्ध है। हिन्दी सम्बन्धवाचक उपवाक्य अर्थ को स्पष्ट रखता है और प्रदान किए जाने के कर्मवाच्य भाव को सुरक्षित रखता है।
- source_word: κατὰ τὴν ἐνέργειαν
  choice: प्रभावी कार्य के अनुसार
  rationale: ἐνέργεια केवल सामान्य ‘काम’ नहीं, बल्कि सक्रिय और फलदायी ढंग से कार्यरत शक्ति का भाव रखता है; ‘प्रभावी कार्य’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: उसकी सामर्थ्य के
  rationale: δύναμις के लिए ‘सामर्थ्य’ पौलुस के प्रसंग में शक्ति और क्षमता दोनों का dignified, प्रचलित हिन्दी रूप है। सर्वनाम का निकटतम दैवी सन्दर्भ परमेश्वर है।
theological_decisions:
- issue: διάκονος में पौलुस की भूमिका का स्वरूप
  choice: सेवक
  alternative: सेवकाई करनेवाला / धर्मसेवक / डीकन
  rationale: प्रसंग सुसमाचार के लिए पौलुस की सौंपी हुई सेवा की बात करता है, किसी औपचारिक कलीसियाई पद को स्पष्ट रूप से निर्दिष्ट नहीं करता। इसलिए ‘सेवक’ बाद की संस्थागत धारणा जोड़े बिना कार्यगत अर्थ देता है।
- issue: ἐγενήθην में कर्तृता
  choice: मैं ... बना
  alternative: मुझे ... बनाया गया
  rationale: यूनानी रूप ‘बना’ और सम्भावित कर्मवाच्य ‘बनाया गया’ दोनों की गुंजाइश रखता है। मुख्य पाठ सहज हिन्दी में अस्पष्टता बनाए रखता है, जबकि आसपास के वाक्यांश परमेश्वर के अनुग्रह और सामर्थ्य को स्रोत बताते हैं; वैकल्पिक कर्मवाच्य पादटिप्पणी में दिया गया है।
- issue: दोनों κατά वाक्यांशों का सम्बन्ध
  choice: दोनों के लिए ‘के अनुसार’
  alternative: ‘के द्वारा’ अथवा ‘के कारण’
  rationale: दोहराई गई यूनानी रचना वरदान और दैवी सामर्थ्य के प्रभावी कार्य के अनुरूपता/मानक के भाव को जोड़ती है। एक ही हिन्दी रचना इस समानान्तरता को सुरक्षित रखती है और साधन या कारण को अनावश्यक रूप से निश्चित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज पर गरिमापूर्ण शैली अपनाई गई है। ‘अनुग्रह’, ‘वरदान’, ‘सामर्थ्य’ और ‘सुसमाचार’ जैसे व्यापक रूप से समझे जानेवाले बाइबिलीय शब्द रखे गए हैं। डैश अगले विचार की ओर बढ़ते मूल वाक्य के प्रवाह को संकेत करता है।
