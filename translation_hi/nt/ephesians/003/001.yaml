translation:
  language: hi
  text: इसी कारण मैं, पौलुस, मसीह यीशु का बंदी, तुम गैर-यहूदियों के लिए—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: इसी कारण
  rationale: यह पदबंध पिछले कथन की ओर संकेत करने वाला तर्कसूचक वाक्यांश है; ‘इसी कारण’ उसके संबंध और बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐγὼ Παῦλος
  choice: मैं, पौलुस
  rationale: स्पष्ट सर्वनाम के बल और नाम द्वारा आत्मपरिचय—दोनों को अल्पविराम सहित सुरक्षित रखा गया है।
- source_word: ὁ δέσμιος
  choice: बंदी
  rationale: δέσμιος हिरासत में रखे गए व्यक्ति को दर्शाता है; ‘बंदी’ संक्षिप्त, सीधा और गरिमापूर्ण हिन्दी रूप है।
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु का
  rationale: Χριστός को उपाधि के रूप में ‘मसीह’ अनूदित किया गया है। संबंधकारक की व्यापकता—मसीह से संबंध या उनके कारण बंदी होना—को ‘का’ द्वारा खुला रखा गया है।
- source_word: ὑπὲρ ὑμῶν
  choice: तुम ... के लिए
  rationale: ὑπέρ का हितकारी अर्थ ‘के लिए’ से सहज रूप में व्यक्त होता है; इसमें हित और निमित्त दोनों की संभावित छाया बनी रहती है।
- source_word: τῶν ἐθνῶν
  choice: गैर-यहूदियों
  rationale: यहाँ संबोधित लोग यहूदीेतर हैं; ‘गैर-यहूदी’ आधुनिक पाठक के लिए ‘अन्यजाति’ से अधिक तत्काल स्पष्ट है।
theological_decisions:
- issue: Χριστοῦ को उपाधि के रूप में या नाम-सदृश पारंपरिक रूप में प्रस्तुत करना
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु
  rationale: Χριστός यहाँ यीशु की उपाधि है; इसलिए अर्थपूर्ण हिन्दी ‘मसीह’ को मुख्य पाठ में रखा गया है।
- issue: ‘मसीह यीशु का बंदी’ संबंध का अर्थ
  choice: संबंधकारक को ‘का’ से खुला रखना
  alternative: मसीह यीशु के कारण बंदी
  rationale: यूनानी संबंधकारक यह स्पष्ट नहीं करता कि पौलुस मसीह का सेवक-बंदी है या मसीह के कारण कैद है; व्याख्यात्मक विस्तार से बचते हुए तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। पद यूनानी मूल की तरह अधूरा वाक्य है, इसलिए अंत में दीर्घ विराम-चिह्न रखा गया है; वाक्य आगे के पदों में जारी रहता है।
