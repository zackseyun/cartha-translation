  rationale: यूनानी पूर्वसर्ग का सीधा रूप सुरक्षित रखा गया है; साधनवाचक ‘के द्वारा’ की संभावित व्याख्या पादटिप्पणी में दी गई है।
- source_word: Χριστῷ
