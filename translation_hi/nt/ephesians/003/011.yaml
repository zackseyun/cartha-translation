  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; ‘मसीहा’ उसके अर्थ और यहूदी पृष्ठभूमि को स्पष्ट रखता है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित मानक नाम-रूप।
- source_word: κυρίῳ ἡμῶν
  choice: हमारे प्रभु
  rationale: κύριος की उपाधि और ἡμῶν के संबंधवाचक अर्थ को सीधे और स्वाभाविक रूप में रखा गया है।
theological_decisions:
- issue: πρόθεσιν τῶν αἰώνων का अर्थ
  choice: सनातन उद्देश्य
  alternative: युगों का उद्देश्य
  rationale: यूनानी पदबंध शाब्दिक रूप से ‘युगों का उद्देश्य’ है, पर प्रसंग में वह परमेश्वर के सनातन उद्देश्य का बोध कराता है। मुख्य पाठ में स्वाभाविक हिन्दी और पादटिप्पणी में शाब्दिक रूप देकर दोनों पक्ष सुरक्षित रखे गए हैं।
- issue: ἐν τῷ Χριστῷ Ἰησοῦ का संबंध
  choice: मसीहा यीशु में
  alternative: मसीहा यीशु के द्वारा
  rationale: ἐν का सीधा अर्थ ‘में’ है, यद्यपि यहाँ साधनवाचक अर्थ संभव है। मुख्य पाठ स्रोत की अस्पष्टता को बनाए रखता है और वैकल्पिक समझ पादटिप्पणी में देता है।
- issue: Χριστός का अनुवाद
  choice: मसीहा
  alternative: मसीह / ख्रीस्त
  rationale: यहाँ शब्द उपाधि के रूप में कार्य करता है; ‘मसीहा’ उसके पद और अभिषिक्त उद्धारकर्ता की पृष्ठभूमि को व्यक्त करता है।
