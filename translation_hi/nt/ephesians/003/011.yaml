- source_word: ἣν ἐποίησεν
  choice: जिसे उसने ... पूरा किया
  rationale: ποιέω का मूल अर्थ ‘करना/बनाना’ है, पर उद्देश्य के साथ यहाँ उसे कार्यरूप देने या संपन्न करने का भाव है। ‘पूरा किया’ इस संदर्भ में स्वाभाविक है।
- source_word: ἐν
