lexical_decisions:
- source_word: κατὰ
  choice: के अनुसार
  rationale: करणवाचक प्रयोग नहीं, बल्कि उद्देश्य के अनुरूप होने का भाव व्यक्त करता है।
- source_word: πρόθεσιν
