source:
  edition: SBLGNT
  text: ἵνα γνωρισθῇ νῦν ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις ἐν τοῖς ἐπουρανίοις διὰ τῆς ἐκκλησίας ἡ πολυποίκιλος σοφία τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/010.yaml
  text: so that now[a], through the church, the manifold wisdom of God might be made known to the rulers and the authorities in the heavenly realms[c][b],
translation:
  language: hi
  text: ताकि अब कलीसिया के द्वारा परमेश्वर की बहुविध बुद्धि स्वर्गीय लोकों में स्थित शासकों और अधिकारियों को ज्ञात कराई जाए।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बहुविध बुद्धि” का अर्थ ऐसी बुद्धि है जिसमें अनेक पहलू और समृद्ध विविधता हो।
    reason: lexical_alternative
  - marker: b
    text: “स्वर्गीय लोकों में स्थित शासकों और अधिकारियों” से संभवतः केवल मानवीय अधिकारियों के बजाय ब्रह्मांडीय या आत्मिक सत्ताओं का संकेत है।
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्यसूचक बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: γνωρισθῇ
  choice: प्रकट की जाए
  rationale: निष्क्रिय वाच्य और उद्देश्यसूचक संभावनार्थ को बनाए रखता है; यहाँ अर्थ है किसी बात को ज्ञात कराना।
- source_word: νῦν
  choice: अब
  rationale: मूल के स्पष्ट कालवाचक क्रियाविशेषण का सीधा अनुवाद।
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: प्रधानताओं और अधिकारों पर
  rationale: पौलुस के इस युग्म की ब्रह्मांडीय/आत्मिक सत्ता-संबंधी ध्वनि को बनाए रखता है और उन्हें केवल मानवीय शासक नहीं ठहराता। हिन्दी में ‘पर प्रकट’ प्राप्तकर्ता को स्वाभाविक ढंग से दर्शाता है।
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: स्वर्गीय लोकों की
  rationale: इस पदबंध को संबंधित सत्ताओं का क्षेत्र बताने के लिए रखा गया है; ‘स्वर्गीय लोक’ इफिसियों में प्रयुक्त स्थान/क्षेत्र की धारणा को सहज हिन्दी में व्यक्त करता है।
- source_word: διὰ τῆς ἐκκλησίας
  choice: कलीसिया के द्वारा
  rationale: διά के साधनवाचक अर्थ को स्पष्ट रखता है।
- source_word: ἡ πολυποίκιλος σοφία τοῦ θεοῦ
  choice: परमेश्वर की बहुरंगी बुद्धि
  rationale: πολυποίκιλος की अनेक रूपों, पहलुओं और समृद्ध विविधता वाली छवि को संक्षिप्त तथा बोधगम्य हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘प्रधानताओं और अधिकारों’ की पहचान
  choice: मुख्य पाठ उन्हें स्वर्गीय लोकों से संबंधित सत्ताओं के रूप में रखता है।
  alternative: मानवीय शासक और अधिकारी; अथवा पृथ्वी और स्वर्ग दोनों की सत्ताओं को समेटता व्यापक संकेत।
  rationale: ἐν τοῖς ἐπουρανίοις और पौलुस के प्रयोग के कारण ब्रह्मांडीय/आत्मिक सत्ताएँ अधिक संभावित हैं; फिर भी मुख्य पाठ उन्हें ‘स्वर्गदूत’ या ‘दुष्टात्माएँ’ कहकर अनावश्यक रूप से सीमित नहीं करता।
- issue: πολυποίκιλος σοφία की रूपकात्मक विविधता
  choice: बहुरंगी बुद्धि
  alternative: अनेक पहलुओं वाली बुद्धि; अत्यंत विविध बुद्धि
  rationale: ‘बहुरंगी’ मूल शब्द की विविधता और अनेकता की सजीव छवि बचाता है, बिना उसका आशय किसी एक धर्मवैज्ञानिक व्याख्या तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘कलीसिया’ प्रचलित बाइबलीय हिन्दी है; ‘बहुरंगी’ मूल की रूपकात्मक समृद्धि को स्वाभाविक ढंग से व्यक्त करता है।
