review_pass:
  verdict: revise
  source_fidelity: Draft has the purpose clause, present-time reference, instrumental role of the church, and passive sense broadly correct. However, “प्रधानताओं और अधिकारों पर प्रकट की जाए” changes the recipients marked by ταῖς ... ταῖς into a target/surface (“upon”) and attaches “स्वर्गीय लोकों” to the authorities by a genitive construction rather than retaining the Greek locative phrase.
  naturalness: “पर ... प्रकट की जाए” is not natural for making wisdom known to persons/powers in this context. “ज्ञात कराई जाए” with dative recipient “को” is clear, idiomatic modern Hindi. “बहुविध” is a dignified and natural rendering for wisdom characterized by rich variety.
  terminology: “कलीसिया” and “परमेश्वर” are suitable established biblical Hindi terms. “शासकों और अधिकारियों” renders the two terms accessibly without deciding their precise nature; the locative “स्वर्गीय लोकों में स्थित” retains the cosmic setting without labeling them angels or evil spirits.
  issues:
  - severity: high
    issue: Recipient relation mistranslated as “प्रधानताओं और अधिकारों पर प्रकट की जाए.”
    rationale: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις is dative and identifies those to whom God’s wisdom is made known. Hindi should use “को,” not “पर.”
  - severity: medium
    issue: “स्वर्गीय लोकों की प्रधानताओं और अधिकारों” recasts ἐν τοῖς ἐπουρανίοις as a possessive modifier.
    rationale: The Greek says the rulers and authorities are “in the heavenly realms,” not explicitly “the heavenly realms’ rulers and authorities.” A locative Hindi expression better preserves the syntax and scope.
  - severity: low
    issue: “बहुरंगी बुद्धि” may overemphasize literal colors.
    rationale: It can work figuratively, but “बहुविध बुद्धि” more directly conveys πολυποίκιλος as richly varied or many-faceted wisdom in this formal context.
  revised_text: ताकि अब कलीसिया के द्वारा परमेश्वर की बहुविध बुद्धि स्वर्गीय लोकों में स्थित शासकों और अधिकारियों को ज्ञात कराई जाए।[a][b]
