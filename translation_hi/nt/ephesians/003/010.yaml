revisions:
- from: ताकि अब कलीसिया के द्वारा परमेश्वर की बहुरंगी बुद्धि स्वर्गीय लोकों की प्रधानताओं और अधिकारों पर प्रकट की जाए।[a][b]
  to: ताकि अब कलीसिया के द्वारा परमेश्वर की बहुविध बुद्धि स्वर्गीय लोकों में स्थित शासकों और अधिकारियों को ज्ञात कराई जाए।[a][b]
  rationale: The revision restores the dative recipient relationship (“को”) and the locative force of ἐν τοῖς ἐπουρανίοις (“स्वर्गीय लोकों में स्थित”). It keeps the identity of these powers open in the main text, preserves the passive purpose construction, and uses a more semantically direct Hindi expression for God’s richly varied wisdom.
  reviewer_model: gpt-5.6-terra
