  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: hi
  text: और मसीह के उस प्रेम को जानें, जो ज्ञान से परे है, ताकि आप परमेश्वर की सारी परिपूर्णता तक भर दिए जाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि आप परमेश्वर की सारी परिपूर्णता से भर जाएँ।” यूनानी में भाव संक्षिप्त है और शाब्दिक रूप से “परमेश्वर की सारी परिपूर्णता तक” लक्ष्य या पूर्ण माप की ओर बढ़ने का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί τε
  choice: और ... जानें
  rationale: γνῶναί पूर्ववर्ती प्रार्थना-विनतियों से जुड़ा अनंत क्रियारूप है और τέ हल्का समन्वयक है। हिंदी में ‘और ... जानें’ इसका स्वाभाविक और सीधा रूप है; ‘जानें’ अनुभवात्मक और बौद्धिक दोनों अर्थों की गुंजाइश रखता है।
- source_word: τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην
  choice: उस प्रेम को ... जो ज्ञान से परे है
  rationale: यह वाक्यांश प्रेम को ज्ञान की सीमा से बढ़कर बताता है। ‘ज्ञान से परे’ मूल की विरोधाभासी धार को बनाए रखता है—ऐसे प्रेम को जानना जो ज्ञान से परे है।
- source_word: τοῦ Χριστοῦ
  choice: मसीह के
  rationale: Χριστός को उसके पदवीगत अर्थ के अनुरूप ‘मसीह’ कहा गया है। संबंधकारक रचना को ‘मसीह के ... प्रेम’ के रूप में रखा गया है, जो संदर्भ में मुख्यतः मसीह के प्रेम को दर्शाती है, पर अनावश्यक विस्तार नहीं जोड़ती।
- source_word: ἵνα πληρωθῆτε
  choice: ताकि आप ... परिपूर्ण हो जाएँ
  rationale: ἵνα उद्देश्य/परिणाम प्रकट करता है और πληρωθῆτε अओरिस्ट कर्मवाच्य संभावनार्थक है। ‘ताकि’ तथा ‘हो जाएँ’ इस संरचना को स्वाभाविक हिंदी में रखते हैं। πλήρωμα के साथ शब्द-संबंध बनाए रखने के लिए ‘परिपूर्ण’ चुना गया है।
- source_word: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: परमेश्वर की सारी परिपूर्णता तक
  rationale: εἰς की लक्ष्य-दिशा को ‘तक’ से सुरक्षित रखा गया है, बजाय इसे केवल ‘से’ या ‘से भर जाएँ’ बनाकर समतल कर देने के। πᾶν τὸ πλήρωμα की व्यापकता ‘सारी परिपूर्णता’ से व्यक्त होती है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / क्राइस्ट
  rationale: यहाँ Χριστός की पदवीगत शक्ति बनी हुई है; ‘मसीह’ आधुनिक हिंदी बाइबलीय प्रयोग में समझने योग्य है और मूल पदवी का अर्थ संप्रेषित करता है।
- issue: τοῦ Χριστοῦ में संबंधकारक का आशय
  choice: मसीह के उस प्रेम
  alternative: मसीह के लिए प्रेम
  rationale: निकट संदर्भ मसीह द्वारा विश्वासियों से किए गए प्रेम के पक्ष में है। फिर भी मुख्य पाठ में कोई व्याख्यात्मक कर्म नहीं जोड़ा गया; हिंदी संबंधकारक मूल की संक्षिप्तता को काफी हद तक बनाए रखता है।
- issue: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: परमेश्वर की सारी परिपूर्णता तक परिपूर्ण हो जाएँ
  alternative: परमेश्वर की सारी परिपूर्णता से भर जाएँ
  rationale: यूनानी εἰς लक्ष्य या दिशा का बोध देता है। ‘तक’ उस गतिशील, लक्ष्यपरक बल को बचाता है और इस गहन कथन को किसी सरल पात्र-भराव की उपमा तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ज्ञान से परे’ मूल के जानने/ज्ञान वाले विरोधाभास को स्वाभाविक हिंदी में सुरक्षित रखता है। ‘परिपूर्णता तक परिपूर्ण’ जानबूझकर कुछ ऊँचा और सघन है, क्योंकि मूल वाक्यांश भी धर्मवैचारिक रूप से सघन और असामान्य है; पादटिप्पणी अधिक प्रचलित विकल्प देती है।
