source:
  edition: SBLGNT
  text: Διὸ μνημονεύετε ὅτι ⸂ποτὲ ὑμεῖς⸃ τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: hi
  text: इसलिए याद रखो कि पहले तुम—शरीर के अनुसार गैर-यहूदी[a], जिन्हें शरीर में हाथों से किए हुए “खतना” कहलाने वालों द्वारा “खतनारहित” कहा जाता है[b][c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “शरीर में अन्यजाति लोग।” यहाँ “गैर-यहूदी” का अर्थ यहूदी समुदाय से बाहर के लोग हैं।
    reason: lexical_alternative
  - marker: b
    text: “खतना” और “खतनारहित” यहाँ केवल शारीरिक वर्णन नहीं, बल्कि जातीय और वाचा-संबंधी सामुदायिक नाम भी हैं।
    reason: cultural_note
  - marker: c
    text: या, “उस ‘खतने’ द्वारा, जो शरीर में हाथों से किया हुआ है।” पौलुस के शब्द बाहरी, मनुष्य द्वारा किए गए खतने की सीमा या उसके प्रति कुछ आलोचनात्मक दूरी का संकेत दे सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले निष्कर्ष और अगले स्मरण-आह्वान के बीच स्वाभाविक तार्किक संबंध व्यक्त करता है।
- source_word: μνημονεύετε
  choice: याद रखो
  rationale: वर्तमानकालीन बहुवचन आज्ञा के लिए यह सहज आधुनिक हिन्दी है और निरंतर स्मरण में रखने का भाव भी दे सकती है।
- source_word: ποτὲ ὑμεῖς
  choice: पहले तुम
  rationale: ποτέ के भूतकालीन विरोध और ὑμεῖς पर दिए गए बल, दोनों को संक्षेप और स्वाभाविकता से रखता है।
- source_word: τὰ ἔθνη ἐν σαρκί
  choice: शरीर से गैर-यहूदी
  rationale: यहाँ ἔθνη राजनीतिक राष्ट्र नहीं, यहूदियों से अलग गैर-यहूदी लोग हैं; ἐν σαρκί उनकी शारीरिक-जातीय पहचान की ओर संकेत करता है, नैतिक पापी स्वभाव की ओर नहीं।
- source_word: οἱ λεγόμενοι ἀκροβυστία
  choice: जिन्हें … “खतनारहित” कहते हैं
  rationale: निष्क्रिय सामाजिक नामकरण को बनाए रखता है और उद्धरण-चिह्न इसे सामुदायिक पहचान-सूचक पद के रूप में दिखाते हैं।
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: वे लोग … जो “खतनावाले” कहलाते हैं
  rationale: अमूर्त एकवचन περιτομή यहाँ खतना किए हुए समुदाय के लिए प्रयुक्त है। हिन्दी में समूह को स्पष्ट करने के साथ λεγομένης की ‘कहलाने’ वाली भाषिक दूरी भी सुरक्षित रहती है।
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: यह खतना शरीर पर मनुष्य के हाथों किया हुआ है
  rationale: χειροποίητος का हाथों से किए जाने का भाव स्पष्ट करता है और वाक्यांश को ‘खतना’ से जोड़ता है; ‘शरीर पर’ हिन्दी में शारीरिक क्रिया को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ἐν σαρκί में σάρξ का अर्थ
  choice: शरीर से / शरीर पर
  alternative: देह में; शारीरिक रूप से
  rationale: दोनों occurrences में संदर्भ शारीरिक और जातीय-धार्मिक पहचान का है, पापी स्वभाव का नहीं। इसलिए नैतिक अर्थ आरोपित नहीं किया गया।
- issue: περιτομή और ἀκροβυστία का सामुदायिक प्रयोग
  choice: “खतनावाले” और “खतनारहित”
  alternative: “खतना” और “बेखतना”
  rationale: ये केवल शारीरिक अवस्थाएँ नहीं, वाचा और जातीय पहचान के सामुदायिक नाम भी हैं। व्यक्ति-सूचक हिन्दी रूप अर्थ को स्पष्ट करते हैं, जबकि उद्धरण-चिह्न नामकरण की प्रकृति बनाए रखते हैं।
- issue: λεγομένης की अलंकारिक शक्ति
  choice: जो “खतनावाले” कहलाते हैं
  alternative: तथाकथित “खतना”
  rationale: ‘कहलाते हैं’ यूनानी में दोनों पक्षों के लिए दोहराए गए λεγόμενοι/λεγομένης की समरूपता और कुछ भाषिक दूरी को सुरक्षित रखता है, पर अनावश्यक रूप से तीखा व्यंग्य या यहूदी-विरोधी भाव नहीं जोड़ता।
- issue: पद का अगले वाक्य से व्याकरणिक संबंध
  choice: अंत में दीर्घ डैश
  alternative: पूर्ण विराम
  rationale: यूनानी वाक्य अगले पद में पूरा होता है। डैश पाठक को बताता है कि विचार अभी समाप्त नहीं हुआ, और स्रोत की लंबित संरचना को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सामान्य और गरिमापूर्ण रखी गई है। “गैर-यहूदी” सामान्य पाठक के लिए “अन्यजाति” से अधिक तुरंत स्पष्ट है; फुटनोट में अधिक शाब्दिक विकल्प दिया गया है। मूल यूनानी की लंबी, अगले पद तक चलने वाली रचना को अंतिम डैश से दर्शाया गया है।
