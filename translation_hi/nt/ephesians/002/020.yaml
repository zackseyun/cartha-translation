- source_word: ὄντος ἀκρογωνιαίου
  choice: कोने का पत्थर हैं
  rationale: यह भवन के मूल रूपक को बनाए रखता है। हिंदी में कृदंतीय संरचना को स्वाभाविक मुख्य कथन बनाया गया है।
- source_word: αὐτοῦ
