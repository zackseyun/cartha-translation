theological_decisions:
- issue: ‘प्रेरितों और भविष्यद्वक्ताओं की नींव’ का आशय
  choice: संबंधकारक की व्यापकता को ‘की नींव’ में बनाए रखा गया है।
  alternative: ‘प्रेरितों और भविष्यद्वक्ताओं द्वारा डाली गई नींव’ अथवा ‘वही प्रेरित और भविष्यद्वक्ता जो नींव हैं।’
  rationale: यूनानी संबंधकारक यह निश्चित नहीं करता कि नींव उनके द्वारा रखी गई, उनकी गवाही से जुड़ी है, या किसी अर्थ में उन्हीं से बनी है; अनुवाद इस तनाव का निर्णय नहीं करता।
- issue: Χριστός का अनुवाद
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु
  rationale: इस प्रसंग में Χριστός उपाधि के रूप में अर्थपूर्ण है, इसलिए अर्थसूचक और हिंदी में प्रचलित ‘मसीह’ चुना गया है।
- issue: ἀκρογωνιαῖος की स्थापत्य भूमिका
  choice: कोने का पत्थर
  alternative: शीर्ष-पत्थर
  rationale: नींव के तत्काल संदर्भ में ‘कोने का पत्थर’ अधिक संभावित है, यद्यपि शब्द के स्थापत्य प्रयोग पर कुछ चर्चा संभव है।
