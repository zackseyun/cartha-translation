  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और स्थापत्य रूपक को स्पष्ट रखने वाला पाठ। ‘हैं’ का प्रयोग यीशु के लिए स्वाभाविक आदरसूचक हिंदी के अनुसार है; मूल का एकवचन संदर्भ अपरिवर्तित रहता है।
