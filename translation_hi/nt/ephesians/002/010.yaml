id: EPH.2.10
reference: Ephesians 2:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: hi
  text: क्योंकि हम परमेश्वर की कारीगरी हैं—मसीह[a] यीशु में भले कामों के लिए सृजे गए हैं। इन कामों को परमेश्वर ने पहले से तैयार किया था, ताकि हम उनमें चलें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीस्त यीशु में।” यूनानी शब्द Χριστός एक उपाधि है, जिसका अर्थ “मसीह” अर्थात “अभिषिक्त जन” है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “चलें” का अर्थ है अपने जीवन और आचरण में इन भले कामों को करते रहें।
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοῦ … ποίημα
  choice: परमेश्वर की कारीगरी
  rationale: संदर्भ में αὐτοῦ परमेश्वर को सूचित करता है। ‘कारीगरी’ ποίημα के उस ठोस भाव को रखता है जिसमें मनुष्य परमेश्वर द्वारा रची हुई कृति हैं।
- source_word: κτισθέντες
  choice: सृजे गए हैं
  rationale: कर्मवाच्य कृदंत परमेश्वर के सृजनात्मक कार्य को व्यक्त करता है और मुख्य कथन ‘हम … कारीगरी हैं’ से स्वाभाविक रूप से जुड़ता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: Χριστός यहाँ अभिषिक्त जन की उपाधि है; ‘मसीह’ उसके अर्थ को सुरक्षित रखता है और ‘में’ विश्वासियों के मसीह से संबंध के मूल रूपक को बनाए रखता है।
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: भले कामों के लिए
  rationale: ἐπί के साथ यहाँ उद्देश्य या अभिप्रेत परिणाम का भाव है। यह अनुवाद नैतिक कर्मों के अर्थ को बिना अतिरिक्त व्याख्या के स्पष्ट करता है।
- source_word: οἷς προητοίμασεν ὁ θεός
  choice: इन कामों को परमेश्वर ने पहले से तैयार किया था
  rationale: संबंधवाचक सर्वनाम का संकेत ‘भले कामों’ की ओर है। ‘पहले से’ προ- के कालगत भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἵνα ἐν αὐτοῖς περιπατήσωμεν
  choice: ताकि हम उनमें चलें
  rationale: ‘ताकि’ उद्देश्य को व्यक्त करता है। ‘उनमें चलें’ पौलुस के जीवन-आचरण संबंधी रूपक को सुरक्षित रखता है; पादटिप्पणी उसका आशय स्पष्ट करती है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन के लिए व्याख्यात्मक आधार प्रस्तुत करने वाले संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में अनूदित करना
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु
  rationale: यहाँ Χριστός का अभिषिक्त जन संबंधी उपाधिगत अर्थ सक्रिय है; ‘मसीह’ केवल ध्वन्यंतरण की अपेक्षा उस अर्थ को अधिक स्पष्ट रूप से सुरक्षित रखता है।
- issue: परमेश्वर की पूर्व तैयारी और मनुष्य के आचरण का संबंध
  choice: इन कामों को परमेश्वर ने पहले से तैयार किया था, ताकि हम उनमें चलें
  alternative: इन कामों को परमेश्वर ने पहले से तैयार किया था कि हम उन्हें करें
  rationale: चुना हुआ रूप परमेश्वर की पहल और विश्वासियों के जीवन-आचरण, दोनों को मूल पाठ के अनुसार साथ रखता है तथा व्यापक पूर्वनियति-विवाद का कोई अतिरिक्त निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘कारीगरी’ और ‘सृजे गए’ सृष्टि-संबंधी ठोस भाषा को रखते हैं; ‘उनमें चलें’ मूल पौलुसी रूपक को बचाता है और पादटिप्पणी सामान्य पाठक के लिए उसका अर्थ खोलती है।
