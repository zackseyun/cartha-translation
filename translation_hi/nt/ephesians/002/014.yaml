  text: αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/014.yaml
  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: hi
  text: क्योंकि वह स्वयं हमारी शांति है। उसने दोनों[a] को एक कर दिया और बँटवारे की दीवार[b]—अर्थात बैर—को अपनी देह में ढा दिया[c][d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दोनों” से तत्काल संदर्भ में यहूदी और गैर-यहूदी अभिप्रेत हैं।
    reason: contextual_clarification
  - marker: b
    text: या “अवरोध की बीचवाली दीवार।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “अपनी देह में।” यह पदबंध मसीह की देहधारी मृत्यु के संदर्भ में है, न कि उसकी मानवता को दूर करने के अर्थ में।
    reason: lexical_clarification
  - marker: d
    text: 'वाक्य को इस प्रकार भी जोड़ा जा सकता है: “अपनी देह में बैर को [ढा दिया]।”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: वही स्वयं
  rationale: बलवाचक सर्वनाम का जोर बनाए रखता है कि मसीह केवल शांति लानेवाला नहीं, स्वयं हमारी शांति है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार प्रस्तुत करनेवाले संयोजक का स्वाभाविक हिन्दी रूप है।
- source_word: ἡ εἰρήνη ἡμῶν
  choice: हमारी शांति
  rationale: मूल रूपक को सीधे बनाए रखता है; संदर्भ में यह मेल और पुनर्मिलन करानेवाली शांति है।
- source_word: τὰ ἀμφότερα ἓν
  choice: दोनों को एक कर दिया
  rationale: मूल में निहित दो पक्षों को बिना अनावश्यक विस्तार के व्यक्त करता है; संदर्भ यहूदियों और गैर-यहूदियों की पहचान कराता है।
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: रुकावट की बीचवाली दीवार
  rationale: दीवार और अवरोध, दोनों चित्रों को रखते हुए यूनानी संबंध की कुछ असामान्यता को भी पूरी तरह समतल नहीं करता।
- source_word: λύσας
  choice: ढा दिया
  rationale: दीवार के प्रसंग में इसे खोलने या नष्ट करने का स्वाभाविक और सजीव हिन्दी रूप है।
- source_word: τὴν ἔχθραν
  choice: अर्थात बैर को
  rationale: ‘बैर’ आधुनिक पाठक के लिए स्पष्ट है और इसे पिछली रुकावट की व्याख्या के रूप में रखा गया है।
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: अपनी देह में
  rationale: मसीह की वास्तविक देहधारी मृत्यु की ओर संकेत करते हुए σάρξ का ठोस अर्थ बनाए रखता है और इसे पापी स्वभाव नहीं बनाता।
theological_decisions:
- issue: ‘दोनों’ का संदर्भ
  choice: मुख्य पाठ में ‘दोनों’ को निहित रखा गया और पादटिप्पणी में यहूदियों तथा गैर-यहूदियों की पहचान दी गई।
  alternative: मुख्य पाठ में ‘दोनों समूहों’ या ‘यहूदियों और गैर-यहूदियों’ कहना।
  rationale: τὰ ἀμφότερα का निकट रूप सुरक्षित रहता है, जबकि तत्काल संदर्भ पाठक को दोनों पक्षों की पहचान देता है।
- issue: σάρξ का अनुवाद
  choice: देह
  alternative: शरीर; देह के द्वारा; पापी स्वभाव
  rationale: यहाँ शब्द मसीह की देहधारी और बलिदानी मृत्यु से जुड़ा है। ‘देह’ उसकी मानवता को मिटाए बिना मूल की ठोस भाषा बनाए रखता है।
- issue: ‘बैर’ का वाक्यगत संबंध
  choice: डैश के भीतर ‘अर्थात बैर को’ रखकर इसे रुकावट/दीवार की व्याख्या माना गया।
  alternative: ‘बैर को’ अगले पद से जोड़ना, या ‘अपनी देह में स्थित बैर’ के रूप में पढ़ना।
  rationale: यह विन्यास बैर को मसीह की देह के भीतर स्थित बताने से बचाता है, फिर भी यूनानी वाक्य की संभावित वाक्यगत अस्पष्टता को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद का विचार अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है। “रुकावट की बीचवाली दीवार” मूल यूनानी के दोहरे दीवार/अवरोध चित्र को जानबूझकर बनाए रखता है।
