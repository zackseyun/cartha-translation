  text: καὶ ὄντας ἡμᾶς νεκροὺς τοῖς παραπτώμασιν συνεζωοποίησεν τῷ Χριστῷ— χάριτί ἐστε σεσῳσμένοι—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/005.yaml
  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: hi
  text: जब हम अपने अपराधों में मरे हुए थे, तब भी उसने हमें मसीह के साथ जीवित किया—अनुग्रह से तुम्हारा उद्धार हुआ है—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκροὺς
  choice: जब हम ... मरे हुए थे
  rationale: यह कृदन्तीय रचना प्रसंग में उस अवस्था और समय दोनों को व्यक्त करती है; यह हिन्दी में स्वाभाविक रहते हुए मूल की बात को अनावश्यक रूप से केवल कारण या विरोध के अर्थ में सीमित नहीं करती।
- source_word: τοῖς παραπτώμασιν
  choice: अपने अपराधों में
  rationale: सम्प्रदान कारक यहाँ उस क्षेत्र या अवस्था को सूचित करता है जिसमें वे मृत थे। ‘अपराधों में’ इस अर्थ को बनाए रखता है; ‘अपने’ प्रथम पुरुष बहुवचन और निकटवर्ती प्रसंग से स्पष्ट सम्बन्ध व्यक्त करता है।
- source_word: συνεζωοποίησεν
  choice: साथ जीवित किया
  rationale: संयुक्त क्रिया में जीवित करने और किसी के साथ संयुक्त रूप से ऐसा करने—दोनों का भाव है; अगला पद बताता है कि यह मसीह के साथ हुआ।
- source_word: τῷ Χριστῷ
  choice: मसीह के साथ
  rationale: सम्प्रदान कारक को साहचर्य के अर्थ में लिया गया है। ‘मसीह’ आधुनिक हिन्दी में स्थापित पदवी है और Χριστός के अभिषिक्त उद्धारकर्ता वाले अर्थ को सुरक्षित रखती है।
- source_word: χάριτί
  choice: अनुग्रह से
  rationale: यहाँ कारक साधन को व्यक्त करता है। ‘अनुग्रह’ सटीक, प्रचलित और इस पौलुस-संबंधी धार्मिक प्रसंग में सहज बोधगम्य शब्द है।
- source_word: ἐστε σεσῳσμένοι
  choice: तुम्हारा उद्धार हुआ है
  rationale: यह पूर्णकालिक परोक्ष रचना पूरी हुई क्रिया से उत्पन्न वर्तमान दशा को व्यक्त करती है। हिन्दी का ‘हुआ है’ उस परिणामकारी पूर्णता को स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: τῷ Χριστῷ का अनुवाद
  choice: मसीह के साथ
  alternative: ख्रीष्ट के साथ
  rationale: यहाँ Χριστός की पदवी का अर्थ सक्रिय है। ‘मसीह’ हिन्दी में स्वाभाविक और व्यापक रूप से समझा जाने वाला रूप है तथा मूल पदवी के अर्थ को नाम मात्र में नहीं बदलता।
- issue: χάριτί ἐστε σεσῳσμένοι की आकस्मिक अन्तःस्थ टिप्पणी
  choice: दो दीर्घ विराम-चिह्नों के बीच रखा गया
  alternative: इसे बिना विशेष विराम के मुख्य वाक्य में मिला देना
  rationale: यह वाक्यांश पौलुस के विचार में जोरदार आकस्मिक प्रवेश है और आगे 2:8–9 में विस्तृत होता है। दीर्घ विराम मूल की आलंकारिक तीव्रता को सुरक्षित रखते हैं।
- issue: उद्धार के पूर्णकालिक पक्ष का निर्वाह
  choice: तुम्हारा उद्धार हुआ है
  alternative: तुम उद्धार पाए हुए हो
  rationale: चुना गया रूप पूरी हुई उद्धारकारी क्रिया और उसके वर्तमान परिणाम दोनों को दर्शाता है, जबकि कर्मवाच्य भाव भी बना रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। शैली संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तब भी’ καὶ के प्रसंगगत बल को व्यक्त करता है; ‘ही’ नहीं जोड़ा गया, क्योंकि χάριτί में स्वयं ऐसा विशिष्ट बलसूचक कण नहीं है।
