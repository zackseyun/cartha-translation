source:
  edition: SBLGNT
  text: ὅτι δι’ αὐτοῦ ἔχομεν τὴν προσαγωγὴν οἱ ἀμφότεροι ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/018.yaml
  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: hi
  text: क्योंकि उसके द्वारा हम दोनों को एक ही आत्मा में पिता तक पहुँच है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पहुँच’ का अनुवाद ‘निकट आने का अवसर’ या ‘उपस्थिति में प्रवेश’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘एक ही आत्मा के द्वारा’; ‘एक ही आत्मा में’ यूनानी शब्द-विन्यास को बनाए रखता है और साधन अथवा सहभागिता के क्षेत्र—दोनों का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह संयोजक पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: δι’ αὐτοῦ
  choice: उसी के द्वारा
  rationale: διά के संबंधकारक रूप के साथ साधन या मध्यस्थता का भाव है। ‘उसी के द्वारा’ मसीह की मध्यस्थ भूमिका और पूर्ववर्ती संदर्भ दोनों को बनाए रखता है।
- source_word: ἔχομεν
  choice: हम ... है
  rationale: ग्रीक वर्तमानकाल साझा वर्तमान वास्तविकता बताता है। हिन्दी में ‘हम दोनों की ... पहुँच है’ स्वाभाविक रूप से ‘we have’ का अर्थ देता है।
- source_word: τὴν προσαγωγὴν
  choice: पहुँच
  rationale: προσαγωγή किसी प्रतिष्ठित व्यक्ति की उपस्थिति तक पहुँच या उसके सामने प्रस्तुत किए जाने का भाव रख सकता है। ‘पहुँच’ आधुनिक हिन्दी में स्पष्ट है और आरंभिक परिचय तक अर्थ को सीमित नहीं करता।
- source_word: οἱ ἀμφότεροι
  choice: हम दोनों
  rationale: यह यहूदियों और गैर-यहूदियों—दोनों पक्षों—की ओर संकेत करते हुए ग्रीक के प्रथम-पुरुष वाले साझा भाव को बनाए रखता है।
- source_word: ἐν ἑνὶ πνεύματι
  choice: एक ही आत्मा में
  rationale: ‘एक ही’ दोनों पक्षों की साझी भागीदारी पर बल देता है। ‘में’ ग्रीक ἐν को सुरक्षित रखता है, जो साधन या क्षेत्र—दोनों का भाव दे सकता है। संदर्भ में ‘आत्मा’ से पवित्र आत्मा अभिप्रेत है।
- source_word: πρὸς τὸν πατέρα
  choice: पिता तक
  rationale: πρός यहाँ व्यक्ति की उपस्थिति की ओर पहुँचने या उन्मुख होने का भाव देता है। ‘पिता तक पहुँच’ स्वाभाविक हिन्दी है और स्रोत का संबंध बनाए रखती है।
theological_decisions:
- issue: ‘एक ही आत्मा’ का संदर्भ
  choice: पवित्र आत्मा
  alternative: मनुष्यों की साझी आत्मिक प्रवृत्ति
  rationale: आसपास का कथन पुत्र के द्वारा, एक आत्मा में, पिता तक पहुँच का त्रिएक ढाँचा प्रस्तुत करता है। मुख्य पाठ में अतिरिक्त व्याख्या जोड़े बिना ‘आत्मा’ इस संभावित संदर्भ को बनाए रखता है।
- issue: προσαγωγή का अर्थ-बल
  choice: पिता तक साझा पहुँच
  alternative: पिता की उपस्थिति में औपचारिक रूप से प्रस्तुत किया जाना
  rationale: शब्द में राजदरबारी या उपासना-संबंधी परिचय का संकेत हो सकता है, पर ‘पहुँच’ दोनों पक्षों को मिले निरंतर विशेषाधिकार को स्पष्ट करता है और रूपक को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘हम दोनों’ दो पूर्ववर्ती समुदायों का स्पष्ट संकेत देता है; ‘उसी के द्वारा’ मसीह की मध्यस्थता पर संदर्भगत बल रखता है।
