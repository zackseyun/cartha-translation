  yaml_path: translation/nt/ephesians/002/017.yaml
  text: And he came and proclaimed peace to you who were far away[b][a], and peace to those who were near.
translation:
  language: hi
  text: और वह आकर तुम्हें, जो दूर थे, शांति का शुभ समाचार सुनाया,[a] और जो निकट थे, उन्हें भी शांति का।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शांति का प्रचार किया।” यूनानी क्रिया प्रायः शुभ समाचार सुनाने के लिए प्रयुक्त होती है; यहाँ सुनाए गए समाचार का विषय शांति है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात जो पहले दूर थे और जो निकट थे—प्रसंग में क्रमशः गैर-यहूदी और यहूदी (देखें इफिसियों 2:11–13)।
    reason: cross_reference
lexical_decisions:
- source_word: ἐλθὼν
  choice: उसने आकर
  rationale: अओरिस्ट कृदन्त को स्वाभाविक हिन्दी में पूर्वकालिक क्रिया के रूप में रखा गया है; इससे उसके आने और घोषणा करने का क्रम तथा गति-बिंब दोनों बने रहते हैं।
- source_word: εὐηγγελίσατο
  choice: शांति का शुभ समाचार सुनाया
  rationale: क्रिया में शुभ समाचार सुनाने या घोषित करने का भाव है। यहाँ उसका कर्म ‘शांति’ है, इसलिए यह रूप यूनानी शब्द के शुभ-संदेश संबंधी अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰρήνην
  choice: शांति
  rationale: यह सीधा और प्रचलित समतुल्य है; प्रसंग में मेल-मिलाप और समग्र कुशल का भाव भी समाहित रह सकता है।
- source_word: ὑμῖν τοῖς μακρὰν
  choice: तुम दूरवालों को
  rationale: प्रत्यक्ष संबोधन और दूरी के रूपक दोनों को बनाए रखता है। ‘दूरवालों’ का अर्थ प्रसंग से खुलता है, इसलिए मुख्य पाठ में पहचान नहीं जोड़ी गई।
- source_word: τοῖς ἐγγύς
  choice: निकटवालों को
  rationale: ‘दूरवालों’ के समानांतर संक्षिप्त हिन्दी अभिव्यक्ति है और मूल विरोध को सुरक्षित रखती है।
- source_word: καὶ ... καὶ
  choice: और ... और ... भी
  rationale: दोनों समूहों को एक ही शांति की घोषणा में जोड़ता है। अंतिम ‘भी’ हिन्दी में समान समावेश को स्वाभाविक बनाता है।
theological_decisions:
- issue: ‘दूरवाले’ और ‘निकटवाले’ किन्हें कहते हैं
  choice: मुख्य पाठ में रूपकात्मक पद ‘दूरवाले’ और ‘निकटवाले’ ही रखे गए हैं।
  alternative: इन्हें सीधे ‘गैर-यहूदी’ और ‘यहूदी’ कहना।
  rationale: इफिसियों 2:11–13 के प्रसंग में ये क्रमशः गैर-यहूदियों और यहूदियों की ओर संकेत करते हैं, पर पद स्वयं उनकी पहचान न देकर ‘दूर’ और ‘निकट’ की भाषा इस्तेमाल करता है। अनुवाद उसी आलंकारिक और धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दूरवाले/निकटवाले’ मूल की संक्षिप्त समानांतर संरचना और रूपक को सुरक्षित रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
