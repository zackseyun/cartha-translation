  text: And you were dead in your trespasses and sins,
translation:
  language: hi
  text: और तुम अपने अपराधों और पापों के कारण मरे हुए थे,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπτώμασιν
  choice: अपराधों
  rationale: यह शब्द सीमा लाँघने, चूकने या गलत काम करने का भाव रखता है; ‘अपराध’ आधुनिक हिन्दी में इसे संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: ἁμαρτίαις
  choice: पापों
  rationale: नैतिक और धार्मिक विफलता के लिए प्रचलित तथा स्रोत-संगत हिन्दी शब्द।
- source_word: νεκρούς
  choice: मरे हुए
  rationale: मूल के प्रबल रूपक को बिना हल्का किए बनाए रखता है।
- source_word: τοῖς … καὶ ταῖς …
  choice: के कारण
  rationale: यहाँ संबंध बताने वाले कारक को सहज हिन्दी में कारण के रूप में व्यक्त किया गया है; प्रसंग में अपराध और पाप मृत्यु की दशा से जुड़े हैं।
theological_decisions:
- issue: आत्मिक मृत्यु के रूपक का स्वरूप
  choice: ‘मरे हुए’ का सीधा रूपक बनाए रखा
  alternative: ‘आत्मिक रूप से मृत’ या ‘परमेश्वर से अलग’
  rationale: मूल पाठ केवल ‘मरे हुए’ कहता है; व्याख्यात्मक विस्तार जोड़ने से उसकी संक्षिप्तता और तनाव घटता।
- issue: ὄντας का कालगत प्रस्तुतीकरण
  choice: ‘थे’
  alternative: ‘होते हुए’
  rationale: यद्यपि यूनानी कृदंत वाक्य 2:5 तक व्याकरणिक रूप से आगे बढ़ता है, हिन्दी में पूर्व दशा को ‘थे’ कहना स्पष्ट और स्वाभाविक है तथा अंग्रेज़ी परामर्श-पाठ से भी मेल खाता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। यह पद यूनानी में अगले पदों से जुड़ा अपूर्ण वाक्यांश है; अंत में अल्पविराम इसी प्रवाह को संकेत करता है।
