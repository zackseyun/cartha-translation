translation:
  language: hi
  text: उसी में पूरी इमारत आपस में जुड़ती हुई प्रभु में एक पवित्र मंदिर बनने के लिए बढ़ती जाती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: उसी में
  rationale: सम्बन्धवाचक सर्वनाम का स्वाभाविक पूर्वपद पिछले पद का मसीह यीशु है; ‘उसी में’ व्यक्तिगत सन्दर्भ और पौलुस की व्यापक ‘मसीह में’ भाषा दोनों को बनाए रखता है।
- source_word: πᾶσα οἰκοδομὴ
  choice: पूरी इमारत
  rationale: बिना उपपद वाले एकवचन पदबंध का अर्थ ‘हर इमारत’ भी हो सकता है, पर निकट सन्दर्भ यहूदियों और गैर-यहूदियों से बनी एक संयुक्त संरचना पर बल देता है। वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: συναρμολογουμένη
  choice: एक साथ ठीक-ठीक जुड़ती हुई
  rationale: वर्तमानकालिक कर्मवाच्य कृदन्त निरन्तर चल रही उस प्रक्रिया को व्यक्त करता है जिसमें अलग-अलग भाग एक सुसंगत संरचना में जोड़े जाते हैं; हिन्दी में सहज प्रवाह के लिए कर्मवाच्य भाव ‘जुड़ती हुई’ से व्यक्त किया गया है।
- source_word: αὔξει
  choice: बढ़ती जाती है
  rationale: वर्तमानकाल निरन्तर विकास दर्शाता है। ‘बढ़ती जाती है’ इमारत पर लागू जैविक वृद्धि के रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἰς
  choice: बनने के लिए
  rationale: यहाँ εἰς लक्ष्य अथवा परिणति बताता है। हिन्दी में ‘एक मंदिर में बढ़ती है’ अस्वाभाविक है, इसलिए ‘बनने के लिए’ उसी लक्ष्यसूचक अर्थ को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: ναὸν ἅγιον
  choice: एक पवित्र मंदिर
  rationale: ναός विशेष रूप से मंदिर के पवित्र भवन/धाम को सूचित करता है; साधारण पाठकों के लिए ‘पवित्र मंदिर’ सबसे स्पष्ट और प्रतिष्ठित रूप है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: ‘प्रभु में’ पौलुस की संघ, सम्बन्ध अथवा क्षेत्र की बहुअर्थी अभिव्यक्ति को किसी एक व्याख्या तक सीमित किए बिना सुरक्षित रखता है।
theological_decisions:
- issue: ᾧ का पूर्वपद व्यक्तिगत रूप से मसीह है या स्थापत्य रूपक की कोई वस्तु
  choice: 'व्यक्तिगत मसीह-सन्दर्भ: ‘उसी में’'
  alternative: 'वस्तुगत सन्दर्भ: ‘जिसमें’'
  rationale: पद 20 में निकटतम प्रमुख पूर्वपद मसीह यीशु हैं, और इस अनुच्छेद में दोहराया गया ‘उसमें’ का प्रयोग मसीह के साथ सम्बन्ध को प्रमुख बनाता है।
- issue: πᾶσα οἰκοδομὴ का सामूहिक या वितरणात्मक अर्थ
  choice: 'सामूहिक अर्थ: ‘पूरी इमारत’'
  alternative: 'वितरणात्मक अर्थ: ‘हर इमारत’'
  rationale: 2:14–22 में एक नई मानवता और एक संयुक्त पवित्र निवास की छवि सामूहिक अर्थ का समर्थन करती है; फिर भी यूनानी व्याकरण वितरणात्मक अर्थ की सम्भावना रहने देता है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘प्रभु में’ का सम्बन्ध मंदिर, वृद्धि या पूरी प्रक्रिया से
  choice: मूल का व्यापक सम्बन्ध बनाए रखा गया
  alternative: स्पष्ट व्याख्यात्मक रूप, जैसे ‘प्रभु के साथ एकता में’
  rationale: यूनानी पदबंध वाक्य के अन्त में है और क्षेत्र, सम्बन्ध अथवा संघ के भाव दे सकता है। शाब्दिक रूप इस धर्मवैज्ञानिक व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। ‘इमारत’ और ‘मंदिर’ से स्थापत्य रूपक स्पष्ट रहता है; ‘एक साथ ठीक-ठीक जुड़ती हुई’ संयुक्त संरचना की निरन्तर प्रक्रिया व्यक्त करता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है।
