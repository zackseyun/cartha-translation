- issue: τῶν ἁγίων का सन्दर्भ
  choice: ‘पवित्र लोग’—अर्थ को व्यापक और खुला रखा गया है
  alternative: केवल यहूदी विश्वासी; केवल स्वर्गदूत; अथवा स्पष्ट रूप से सभी विश्वासी
