source:
  edition: SBLGNT
  text: ἵνα ἐνδείξηται ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις ⸂τὸ ὑπερβάλλον πλοῦτος⸃ τῆς χάριτος αὐτοῦ ἐν χρηστότητι ἐφ’ ἡμᾶς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: hi
  text: ताकि वह आने वाले युगों में[a] अपनी उस दयालुता में, जो मसीह यीशु में हमारे प्रति है, अपनी कृपा की अपार संपदा[b] दिखाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आने वाले समयों में।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी कृपा का अतुलनीय धन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह पिछले कथन से निकलने वाले उद्देश्य अथवा परिणाम का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐνδείξηται
  choice: दिखाए
  rationale: यह सार्वजनिक रूप से प्रकट करने या प्रमाणित करके दिखाने के अर्थ को सरल, वर्तमान हिंदी में व्यक्त करता है।
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: आने वाले युगों में
  rationale: αἰῶσιν के बहुवचन और भविष्य की ओर संकेत करने वाले ἐπερχομένοις—दोनों को सुरक्षित रखता है।
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: अपार संपदा
  rationale: ὑπερβάλλον के सीमा से बढ़कर या अत्यधिक होने के भाव और πλοῦτος के प्रचुर धन-संपदा रूपक को सहज हिंदी में व्यक्त करता है।
- source_word: τῆς χάριτος αὐτοῦ
  choice: अपनी कृपा की
  rationale: χάρις के पौलुसीय अर्थ के लिए स्थापित और अर्थपूर्ण हिंदी शब्द ‘कृपा’ रखा गया है।
- source_word: ἐν χρηστότητι
  choice: अपनी दयालुता के द्वारा
  rationale: χρηστότης की कृपालु भलाई और उदार व्यवहार का भाव ‘दयालुता’ से व्यक्त होता है; ‘के द्वारा’ यहाँ कृपा दिखाने के ढंग को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: ἐφ’ ἡμᾶς
  choice: हमारे प्रति
  rationale: ἐπί के दिशात्मक, हितकारी संबंध को ठीक और सहज रूप से व्यक्त करता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: Χριστός को उपाधि के रूप में ‘मसीह’ अनूदित किया गया है और ‘में’ पौलुस के मसीह के साथ संबंध/एकता वाले कथन को बनाए रखता है।
theological_decisions:
- issue: Χριστῷ को उपाधि मानना या नाम-सदृश रूप में लेना
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु / क्राइस्ट जीसस
  rationale: यहाँ Χριστός की उपाधिगत अर्थवत्ता बनी हुई है; ‘मसीह’ आधुनिक हिंदी में इस उपाधि का प्रचलित और अर्थपूर्ण रूप है।
- issue: ἐν Χριστῷ Ἰησοῦ का संबंध
  choice: वाक्य के अंतर्भाग में ‘मसीह यीशु में’ रखकर कृपा/दयालुता के मसीह-केंद्रित क्षेत्र को व्यक्त करना
  alternative: इसे केवल ‘मसीह यीशु के द्वारा’ कहना
  rationale: ‘के द्वारा’ साधन का अर्थ निश्चित कर देता, जबकि यूनानी ἐν संबंध, क्षेत्र या एकता का व्यापक भाव रख सकता है; इसलिए ‘में’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपार संपदा’ कृपा की प्रचुरता का रूपक बनाए रखता है; ‘मसीह यीशु में’ को पारंपरिक धार्मिक सूत्र मात्र न बनाकर मूल के संबंधात्मक भाव के साथ रखा गया है।
