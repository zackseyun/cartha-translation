  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: hi
  text: क्योंकि अनुग्रह से, विश्वास[a] के द्वारा तुम बचाए गए हो; और यह[b] तुम्हारी अपनी ओर से नहीं है—यह परमेश्वर का दान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विश्वास’ का अर्थ ‘भरोसा’ भी हो सकता है; कुछ प्रसंगों में यूनानी शब्द का अर्थ ‘निष्ठा’ भी होता है।
    reason: lexical_alternative
  - marker: b
    text: ‘यह’ संभवतः केवल ‘विश्वास’ की ओर नहीं, बल्कि अनुग्रह से, विश्वास के द्वारा हुए उद्धार की पूरी पूर्ववर्ती वास्तविकता की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: χάριτί
  choice: अनुग्रह
  rationale: पौलुस के प्रयोग में χάρις प्रायः परमेश्वर की कृपापूर्ण और अनर्जित भलाई को दर्शाता है। ‘अनुग्रह’ इस स्थापित अर्थ को गरिमापूर्ण और संक्षिप्त रूप में बनाए रखता है।
- source_word: ἐστε σεσῳσμένοι
  choice: तुम बचाए गए हो
  rationale: εἰμί के वर्तमान रूप और σῴζω के पूर्ण कृदंत की यह रचना अतीत में पूरी हुई क्रिया और उसके वर्तमान परिणाम, दोनों को व्यक्त करती है। हिंदी का पूर्ण कर्मवाच्य इन दोनों पहलुओं को स्वाभाविक रूप से रखता है।
- source_word: διὰ πίστεως
  choice: विश्वास के द्वारा
  rationale: διά के संबंधकारक रूप के साथ साधन या माध्यम का भाव है। πίστις के लिए ‘विश्वास’ सामान्य और प्रसंगानुकूल शब्द है; ‘भरोसा’ और कुछ प्रसंगों में ‘विश्वासयोग्यता’ भी संभव अर्थ हैं।
- source_word: τοῦτο
  choice: यह
  rationale: नपुंसकलिंग संकेतवाचक τοῦτο संभवतः किसी एक स्त्रीलिंग संज्ञा—χάρις या πίστις—के बजाय पहले कही गई पूरी बात की ओर संकेत करता है। ‘यह’ यूनानी की संक्षिप्तता और संभावित व्यापक संकेत, दोनों को बनाए रखता है।
- source_word: οὐκ ἐξ ὑμῶν
  choice: तुम्हारी ओर से नहीं है
  rationale: ἐκ स्रोत या उद्गम बताता है। ‘तुम्हारी ओर से नहीं’ यह स्पष्ट करता है कि पहले कही गई बचाने वाली वास्तविकता का स्रोत पाठक स्वयं नहीं हैं, और इसमें ‘प्रयास’ या ‘काम’ जैसी कोई अतिरिक्त धारणा नहीं जोड़ी जाती।
- source_word: θεοῦ τὸ δῶρον
  choice: यह परमेश्वर का दान है
  rationale: यह पद पहले कही गई वास्तविकता को परमेश्वर के दान के रूप में पहचानता है। हिंदी में ‘यह ... है’ जोड़ने से वाक्य स्वाभाविक बनता है और संबंध स्पष्ट रहता है।
theological_decisions:
- issue: τοῦτο (‘यह’) का संकेत अनुग्रह, विश्वास या पूरी पूर्ववर्ती बात में से किसकी ओर है
  choice: मुख्य पाठ में ‘यह’ को खुला रखा गया है; पादटिप्पणी में इसे अनुग्रह से, विश्वास के द्वारा हुए उद्धार की पूरी पूर्ववर्ती वास्तविकता की ओर संभावित संकेत बताया गया है।
  alternative: ‘यह’ विशेष रूप से विश्वास को परमेश्वर का दान बताता है; अथवा विशेष रूप से अनुग्रह की ओर संकेत करता है।
  rationale: τοῦτο नपुंसकलिंग है, जबकि χάρις और πίστις दोनों स्त्रीलिंग हैं; इसलिए इसका पूरी पूर्ववर्ती बात या धारणा की ओर संकेत करना अधिक स्वाभाविक है। फिर भी मुख्य पाठ की संक्षिप्तता मूल की व्याकरणिक और धर्मवैचारिक गुंजाइश को अनावश्यक रूप से बंद नहीं करती।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और मंडलीय पठन के अनुकूल शैली रखी गई है। ‘बचाए गए हो’ मूल के कर्मवाच्य और वर्तमान परिणाम को बनाए रखता है। ‘तुम्हारी ओर से’ स्रोत का भाव व्यक्त करता है और पाठ में न आए ‘कर्म’ या ‘प्रयास’ को नहीं जोड़ता।
