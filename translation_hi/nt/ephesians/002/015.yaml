source:
  edition: SBLGNT
  text: τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας, ἵνα τοὺς δύο κτίσῃ ἐν ⸀αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/015.yaml
  text: having abolished the law of commandments expressed in decrees, so that he might create the two into one new man in himself, making peace,
translation:
  language: hi
  text: उसने विधियों में व्यक्त आज्ञाओं की व्यवस्था को निष्प्रभावी कर दिया,[a] ताकि वह अपने में उन दोनों को एक नए मनुष्य के रूप में सृजे,[b] और इस प्रकार शांति स्थापित करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विधियों में आज्ञाओं की व्यवस्था को समाप्त कर दिया।” यूनानी पदबंध का अर्थ “विधियों में,” “विधियों से बनी,” अथवा “विधियों में व्यक्त” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: '“एक नया मनुष्य” एकवचन में प्रयुक्त सामूहिक चित्र है; अर्थात “एक नई मानवता।” यूनानी पदक्रम के अनुसार यह भी अनुवाद हो सकता है: “अपने में उन दोनों को एक नया मनुष्य सृजे।”'
    reason: lexical_alternative_and_syntactic_ambiguity
lexical_decisions:
- source_word: νόμον
  choice: व्यवस्था
  rationale: यहाँ शब्द आज्ञाओं और विधियों से विशेषित मूसा की व्यवस्था को सूचित करता है; हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐντολῶν
  choice: आज्ञाओं
  rationale: यह वाचा-संबंधी आदेशों के औपचारिक भाव को बनाए रखता है और νόμον के साथ संबंध स्पष्ट करता है।
- source_word: ἐν δόγμασιν
  choice: विधियों में व्यक्त
  rationale: δόγμασιν के ‘विधि/अध्यादेश’ अर्थ को रखते हुए यह हिन्दी में आज्ञाओं और विधियों का संबंध स्पष्ट करता है; केवल ‘विधियों में’ भी व्याकरणतः संभव है।
- source_word: καταργήσας
  choice: निष्प्रभावी कर दिया
  rationale: καταργέω किसी वस्तु को प्रभावहीन या अमान्य करने का प्रबल भाव रखता है। यह ‘मिटा दिया’ की अपेक्षा मूल की सीमा को अधिक सावधानी से बनाए रखता है, जबकि निर्णायक क्रिया भी व्यक्त करता है।
- source_word: τοὺς δύο
  choice: उन दोनों को
  rationale: स्पष्ट संख्या को बनाए रखता और निकटवर्ती संदर्भ के यहूदी तथा गैर-यहूदी दो समूहों की ओर संकेत करता है।
- source_word: κτίσῃ
  choice: सृजे
  rationale: κτίζω के सृष्टि करने के प्रबल भाव और नई सृष्टि की प्रतिध्वनि को सुरक्षित रखता है।
- source_word: ἐν αὑτῷ
  choice: अपने आप में
  rationale: प्रतिवाचक सर्वनाम का बल बनाए रखता है और बताता है कि एकता मसीह में रची जाती है।
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: एक नया मनुष्य बनाकर
  rationale: एकवचन सामूहिक रूपक को बनाए रखता है। ‘एक नई मानवता’ अर्थ स्पष्ट कर सकता है, पर वह मूल रूपक की व्याख्या कर देता है।
- source_word: ποιῶν εἰρήνην
  choice: इस प्रकार शांति स्थापित करे
  rationale: शाब्दिक ‘शांति बनाते हुए’ की अपेक्षा स्वाभाविक हिन्दी में क्रिया और उसके परिणाम का संबंध व्यक्त करता है।
theological_decisions:
- issue: ἄνθρωπον का सामूहिक उद्धार-संदर्भ में अनुवाद
  choice: एक नया मनुष्य
  alternative: एक नई मानवता
  rationale: दो समूहों के एक होने का आशय सामूहिक है, फिर भी ‘मनुष्य’ पौलुस के एकवचन मानवीय रूपक को सुरक्षित रखता है और उसकी व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
- issue: καταργήσας का व्यवस्था के विषय में बल
  choice: निष्प्रभावी कर दिया
  alternative: समाप्त कर दिया
  rationale: मूल क्रिया प्रबल है, पर पद में उसका कर्म विशेष रूप से ‘विधियों में व्यक्त आज्ञाओं की व्यवस्था’ है। यह चयन व्यापक धर्मवैज्ञानिक निष्कर्ष जोड़े बिना उस व्यवस्था के विभाजक प्रभाव को निष्फल करने का भाव रखता है।
- issue: ἐν αὑτῷ का वाक्यगत संबंध
  choice: अपने आप में उन दोनों को एक नया मनुष्य बनाकर सृजे
  alternative: उन दोनों को एक नया मनुष्य बनाकर अपने आप में सृजे
  rationale: यूनानी पदक्रम और मसीह में सृजन के भाव को निकटता से रखता है, यद्यपि व्याकरणतः स्थान-वाक्यांश को परिणाम-वाक्यांश के बाद जोड़ना भी संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक के लिए सुबोध शैली। ‘व्यवस्था,’ ‘आज्ञा,’ ‘सृजे’ और ‘शांति’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं; जटिल यूनानी संबंधों की वास्तविक अस्पष्टता पादटिप्पणियों में सुरक्षित है।
