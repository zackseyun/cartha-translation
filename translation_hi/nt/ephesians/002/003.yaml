source:
  edition: SBLGNT
  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: hi
  text: उन लोगों में हम सब भी कभी अपनी देह की लालसाओं में जीते थे[a][b] और देह तथा मन की इच्छाएँ पूरी करते थे[c]। हम स्वभाव से क्रोध की सन्तान थे[d], जैसे बाकी लोग भी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन बातों में”; यूनानी वाक्यांश अवज्ञाकारी लोगों की ओर या उस अवज्ञापूर्ण जीवन-क्षेत्र की ओर संकेत कर सकता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “देह” पौलुस का व्यापक नैतिक-अस्तित्वगत शब्द है; इसका अर्थ केवल भौतिक देह नहीं है। इसका अनुवाद “पापी स्वभाव” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'अधिक शब्दशः: “देह और विचारों की इच्छाओं को करते थे।”'
    reason: formal_rendering
  - marker: d
    text: या, “स्वभाव से क्रोध के पात्र थे।” “क्रोध की सन्तान” यूनानी उपमा का निकट अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: उन लोगों में
  rationale: सम्बन्धवाचक सर्वनाम बहुवचन है और निकटतम सन्दर्भ में अवज्ञा के पुत्रों की ओर संकेत कर सकता है। हिन्दी में यह व्यक्ति-सापेक्ष अर्थ स्वाभाविक है; वैकल्पिक क्षेत्र-सापेक्ष अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἀνεστράφημέν
  choice: जीते थे
  rationale: मध्य/कर्मवाच्य रूप यहाँ जीवन बिताने या आचरण करने का भाव देता है। ‘जीते थे’ सहज आधुनिक हिन्दी में जीवन-रीति को व्यक्त करता है।
- source_word: ποτε
  choice: पहले
  rationale: यह वर्तमान से पहले की अवस्था बताता है; ‘पहले’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ἐπιθυμίαις
  choice: लालसाओं
  rationale: यह नैतिक रूप से विकृत प्रबल इच्छाओं का संकेत देता है, पर इसे केवल यौन वासना तक सीमित नहीं करता।
- source_word: σάρξ
  choice: शरीर
  rationale: पौलुस के शब्द को व्याख्यात्मक ‘पापी स्वभाव’ से बदलने के बजाय प्रत्यक्ष रूप में रखा गया है। सन्दर्भ में इसका नैतिक-अस्तित्वगत आशय है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: ποιοῦντες
  choice: पूरी करते थे
  rationale: हिन्दी में इच्छाओं के साथ ‘पूरी करना’ स्वाभाविक है और उन इच्छाओं को व्यवहार में क्रियान्वित करने का भाव देता है।
- source_word: θελήματα
  choice: इच्छाएँ
  rationale: शाब्दिक ‘इच्छाशक्तियाँ’ या ‘संकल्प’ यहाँ अस्वाभाविक होते। ‘इच्छाएँ’ पठनीय है; पहले आए ἐπιθυμίαις से भेद बनाए रखने के लिए वहाँ ‘लालसाएँ’ रखा गया है।
- source_word: διανοιῶν
  choice: मन
  rationale: बहुवचन यूनानी शब्द मानसिक प्रवृत्तियों और विचार-प्रक्रियाओं को समेटता है। हिन्दी में ‘मन की इच्छाएँ’ सहज है; अधिक रूप-सन्निकट विकल्प पादटिप्पणी में दिया गया है।
- source_word: τέκνα ὀργῆς
  choice: क्रोध की सन्तान
  rationale: यूनानी की सामी शैली वाली उपमा को सुरक्षित रखा गया है, ताकि इसे केवल ‘क्रोध के पात्र’ या किसी निश्चित व्यवस्थित धर्मवैज्ञानिक सूत्र में न बदला जाए।
- source_word: φύσει
  choice: स्वभाव से
  rationale: यह ‘प्रकृति से’ की तुलना में अधिक स्वाभाविक हिन्दी है और जन्म, मूल दशा तथा अन्तर्निहित अवस्था के बीच मौजूद व्याख्यात्मक तनाव को खुला रखता है।
- source_word: οἱ λοιποί
  choice: बाकी लोग
  rationale: यह शेष मानव समुदाय से तुलना को सरल, स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: नैतिक अर्थ वाले पौलुसी प्रयोग में σάρξ का अनुवाद
  choice: शरीर
  alternative: पापी स्वभाव
  rationale: ‘पापी स्वभाव’ नैतिक आशय स्पष्ट करता, पर पौलुस की मानव-सम्बन्धी भाषा को एक विशिष्ट व्याख्या में सीमित कर देता। मुख्य पाठ मूल शब्दावली और उसके तनाव को बनाए रखता है।
- issue: τέκνα φύσει ὀργῆς का धर्मवैज्ञानिक बल
  choice: स्वभाव से क्रोध की सन्तान
  alternative: जन्म से क्रोध के पात्र
  rationale: चुना हुआ रूप φύσει और ‘सन्तान’ की उपमा दोनों को सुरक्षित रखता है। यह वाक्य को मूल पाप, जैविक जन्म या दण्ड की पूर्वनियति के किसी एक व्यवस्थित निष्कर्ष में नहीं बदलता।
- issue: ὀργή में क्रोध का कर्ता
  choice: क्रोध
  alternative: परमेश्वर का क्रोध
  rationale: व्यापक सन्दर्भ इसे परमेश्वर के न्यायपूर्ण क्रोध से जोड़ सकता है, पर इस पद में ‘परमेश्वर’ स्पष्ट रूप से नहीं आया; इसलिए मुख्य पाठ में निहित कर्ता को जोड़ा नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य को हिन्दी की स्पष्टता के लिए दो वाक्यों में बाँटा गया है। ‘लालसाएँ’ और ‘इच्छाएँ’ का भेद ἐπιθυμίαις और θελήματα के भेद को यथासम्भव बनाए रखता है; ‘क्रोध की सन्तान’ जानबूझकर मूल उपमा और धर्मवैज्ञानिक तनाव सुरक्षित रखता है।
