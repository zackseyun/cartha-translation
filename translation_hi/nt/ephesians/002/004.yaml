source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πλούσιος ὢν ἐν ἐλέει, διὰ τὴν πολλὴν ἀγάπην αὐτοῦ ἣν ἠγάπησεν ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/004.yaml
  text: But God[a], being rich in mercy, because of his great love with which he loved us,
translation:
  language: hi
  text: परन्तु परमेश्वर, जो दया में धनी है, अपने उस महान प्रेम के कारण, जिससे उसने हमसे प्रेम किया,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले प्रसंग में मनुष्यों की आत्मिक मृत्यु और क्रोध के अधीन होने की दशा के विपरीत परमेश्वर के कार्य का प्रबल विरोध दर्शाता है।
- source_word: πλούσιος ὢν ἐν ἐλέει
  choice: जो दया में धनी है
  rationale: यह यूनानी रूपक और कृदन्त की वर्णनात्मक शक्ति को बनाए रखता है तथा आधुनिक हिन्दी में स्पष्ट है।
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: अपने उस महान प्रेम के कारण
  rationale: διά के कारणसूचक अर्थ, αὐτοῦ के परमेश्वर की ओर संकेत और πολλή के परिमाणात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है। 'उस' आगे आने वाले सम्बन्धवाचक उपवाक्य से प्रेम को जोड़ता है।
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: जिससे उसने हमसे प्रेम किया
  rationale: संज्ञा और क्रिया में एक ही मूल की पुनरावृत्ति—प्रेम ... प्रेम किया—को सुरक्षित रखता है।
theological_decisions:
- issue: ‘प्रेम’ संज्ञा और ‘प्रेम किया’ क्रिया की पुनरावृत्ति
  choice: अपने उस महान प्रेम के कारण, जिससे उसने हमसे प्रेम किया
  alternative: हमारे प्रति अपने महान प्रेम के कारण
  rationale: यूनानी ἀγάπην ... ἠγάπησεν में जानबूझकर की गई सजातीय पुनरावृत्ति है; इसे बनाए रखने से पौलुस का बलाघात सुरक्षित रहता है।
- issue: दया और प्रेम का परस्पर सम्बन्ध
  choice: 'दोनों को अलग किन्तु सम्बद्ध रखा गया: ‘दया में धनी ... महान प्रेम के कारण’'
  alternative: ‘अपने दयालु प्रेम के कारण’ जैसे एक संयुक्त विचार में मिला देना
  rationale: मूल पाठ दया और प्रेम को सम्बद्ध करता है, पर उन्हें समान अर्थ वाले एक ही गुण में नहीं मिलाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य के अन्त का अल्पविराम मूल यूनानी वाक्य के अगले पद में जारी रहने को दर्शाता है।
