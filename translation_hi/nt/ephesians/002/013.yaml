  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लहू’ बाइबलीय बल और बलिदान-संबंधी प्रसंग को बनाए रखता है; वाक्य-विन्यास हिन्दी के स्वाभाविक क्रम के अनुसार है, जबकि ‘मसीह यीशु में’ की पौलुसी अभिव्यक्ति ज्यों की त्यों सुरक्षित है।
