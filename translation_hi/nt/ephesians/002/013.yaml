lexical_decisions:
- source_word: νυνὶ δὲ
  choice: पर अब
  rationale: यह पूर्व अवस्था और वर्तमान नई अवस्था के बीच δέ के विरोध तथा νυνί के कालगत बल—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ‘में’ पौलुस की सहभागिता अथवा एकता की भाषा को बनाए रखता है; Χριστός को यहाँ पदवी मानकर ‘मसीह’ अनूदित किया गया है।
- source_word: ὑμεῖς οἵ ποτε ὄντες
  choice: तुम जो पहले ... थे
  rationale: सर्वनाम, सम्बन्धवाचक उपवाक्य और पहले की अवस्था को दर्शाने वाले ποτε तथा ὄντες को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: μακρὰν
  choice: दूर
  rationale: यह दूरी के रूपक को संक्षिप्त और स्वाभाविक ढंग से बनाए रखता है, बिना उसे केवल भौगोलिक या केवल आत्मिक अर्थ तक सीमित किए।
- source_word: ἐγενήθητε ἐγγὺς
  choice: निकट हो गए हो
  rationale: यह γίνομαι के ‘हो जाना’ वाले अर्थ को सीधे व्यक्त करता और कर्ता को अनावश्यक रूप से निर्दिष्ट किए बिना परिणामस्वरूप आई निकटता दिखाता है।
- source_word: ἐν τῷ αἵματι
  choice: लहू के द्वारा
  rationale: यहाँ ἐν को साधन के अर्थ में लेना प्रसंगानुकूल है; ‘के द्वारा’ बताता है कि निकटता मसीह के लहू के माध्यम से आई, जबकि वैकल्पिक ‘में’ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: τοῦ Χριστοῦ
  choice: मसीह के
  rationale: Χριστός को नाम-सदृश लिप्यंतरण के बजाय अर्थपूर्ण पदवी ‘मसीह’ के रूप में रखा गया है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस पद में Χριστός पदवी के रूप में अर्थपूर्ण है। ‘मसीह’ आधुनिक हिन्दी में परिचित है और इसके अभिषिक्त जन होने का भाव सुरक्षित रखता है।
- issue: ἐν τῷ αἵματι τοῦ Χριστοῦ का बल
  choice: 'साधनार्थक: ‘मसीह के लहू के द्वारा’'
  alternative: 'क्षेत्र अथवा सहभागिता: ‘मसीह के लहू में’; माध्यम: ‘मसीह के लहू से’'
  rationale: प्रसंग इस वाक्यांश को निकट होने के साधन के रूप में समझने का समर्थन करता है, पर पाद-टिप्पणी यूनानी ἐν की दूसरी सम्भव अभिव्यक्ति को सुरक्षित रखती है और किसी विस्तृत प्रायश्चित-सिद्धान्त को पाठ में नहीं जोड़ती।
- issue: ἐγενήθητε में कर्तृत्व
  choice: ‘निकट हो गए हो’
  alternative: ‘निकट लाए गए हो’
  rationale: मुख्य पाठ यूनानी क्रिया के ‘हो जाना’ वाले रूप को सीधे रखता है और दैवी कर्तृत्व को स्पष्टतः जोड़ता नहीं; वैकल्पिक भाव पाद-टिप्पणी में दिया गया है।
