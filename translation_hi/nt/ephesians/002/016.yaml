source:
  edition: SBLGNT
  text: καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: hi
  text: और क्रूस के द्वारा उन दोनों को एक ही शरीर में परमेश्वर के साथ मेल करा दे, और उसी के द्वारा[a] वैरभाव को मार डाले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसी में।” यूनानी अभिव्यक्ति का संबंध क्रूस से हो सकता है; कुछ लोग इसे मसीह की ओर संकेत मानते हैं।
    reason: ἐν αὐτῷ में दत्तिव विभक्ति साधन या क्षेत्र/स्थान का भाव दे सकती है, और सर्वनाम का संदर्भ पूरी तरह निर्विवाद नहीं है।
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: मिला दे
  rationale: यहाँ अर्थ टूटे हुए संबंध को फिर से मेल में लाकर परमेश्वर से मिलाने का है; सरल और स्वाभाविक हिन्दी में इसे व्यक्त किया गया है।
- source_word: τοὺς ἀμφοτέρους
  choice: उन दोनों को
  rationale: यह पिछले संदर्भ के दो समूहों—यहूदियों और गैर-यहूदियों—को स्पष्ट किए बिना मूल के संदर्भात्मक रूप को बनाए रखता है।
- source_word: ἐν ἑνὶ σώματι
  choice: एक ही शरीर में
  rationale: मूल के एकत्व और पौलुस के ‘शरीर’ रूपक, दोनों को यथावत रखता है।
- source_word: διὰ τοῦ σταυροῦ
  choice: क्रूस के द्वारा
  rationale: διά के साधनार्थक भाव को सीधे व्यक्त करता है और σταυρός के स्थापित हिन्दी बाइबलीय शब्द को रखता है।
- source_word: ἀποκτείνας τὴν ἔχθραν
  choice: वैर को मार डाले
  rationale: मूल की सशक्त मृत्यु-छवि को नरम किए बिना स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘एक ही शरीर’ का आशय
  choice: रूपक को ‘एक ही शरीर में’ के रूप में खुला रखा गया
  alternative: इसे स्पष्ट करके ‘अपनी देह में’ या ‘कलीसिया के एक शरीर में’ कहना
  rationale: मूल वाक्यांश स्वयं यह विस्तार नहीं करता; किसी एक व्याख्या को पाठ में आरोपित करने से धर्मवैचारिक तनाव और संदर्भगत व्यापकता घट सकती है।
- issue: ἐν αὐτῷ का संदर्भ और अर्थ
  choice: ‘उसी के द्वारा’—निकटवर्ती ‘क्रूस’ को संदर्भ मानते हुए
  alternative: ‘उसी में’ या ‘अपने में’
  rationale: निकटतम संभावित पूर्वपद ‘क्रूस’ है और साधनार्थक अर्थ संदर्भ में स्वाभाविक है; फिर भी यूनानी दत्तिव विभक्ति और सर्वनाम दूसरी व्याख्या की संभावना खुली रखते हैं, इसलिए उसे पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘क्रूस’, ‘शरीर’ और ‘वैर’ जैसे प्रमुख बाइबलीय शब्द मूल की छवियों और धर्मवैचारिक गहराई को बनाए रखते हैं।
