base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/022.yaml
  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: hi
  text: उसी में आप भी परमेश्वर का निवास-स्थान बनने के लिए आत्मा में एक साथ बनाए जा रहे हैं[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसी भवन में”; यदि सम्बन्धवाचक शब्द को सीधे मसीह के बजाय पूरे भवन से जुड़ा माना जाए।
    reason: alternative_reading
  - marker: b
    text: या, “आत्मिक रूप से” अथवा “आत्मा के द्वारा।” यह वाक्यांश परमेश्वर के निवास के क्षेत्र या पवित्र आत्मा के कार्य—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: उसी में
  rationale: यह स्वाभाविक हिन्दी अभिव्यक्ति निकटवर्ती मसीह की ओर संकेत कर सकती है और यूनानी के संभावित भवन-संबंधी संकेत को भी अनावश्यक रूप से बंद नहीं करती।
- source_word: καὶ ὑμεῖς
  choice: आप भी
  rationale: ‘भी’ अन्य विश्वासियों के साथ संबोधित लोगों के जुड़ने का भाव रखता है; ‘आप’ बहुवचन संबोधन को गरिमापूर्ण और सहज रूप में व्यक्त करता है।
- source_word: συνοικοδομεῖσθε
  choice: एक साथ बनाए जा रहे हैं
  rationale: वर्तमानकालिक कर्मवाच्य चल रही निर्माण-प्रक्रिया को दिखाता है, और ‘एक साथ’ σύν उपसर्ग के सामूहिक भाव को सुरक्षित रखता है।
- source_word: εἰς κατοικητήριον
  choice: निवास-स्थान बनने के लिए
  rationale: εἰς लक्ष्य अथवा परिणति बताता है; यह रूप हिन्दी में स्वाभाविक रहते हुए विश्वासियों के परमेश्वर के निवास-स्थान के रूप में गढ़े जाने का भाव स्पष्ट करता है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर का
  rationale: सम्बन्धकारक को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है; प्रसंग स्पष्ट करता है कि यह वह स्थान है जहाँ परमेश्वर निवास करते हैं।
- source_word: ἐν πνεύματι
  choice: आत्मा में
  rationale: पौलुस के मन्दिर और ईश्वरीय निवास के प्रसंग में ‘आत्मा’ का सबसे सम्भावित संकेत पवित्र आत्मा है; ‘में’ स्थान/क्षेत्र और माध्यम के बीच यूनानी की आंशिक खुली अर्थ-सीमा बनाए रखता है।
theological_decisions:
- issue: ἐν ᾧ का पूर्वपद
  choice: मुख्य पाठ में ‘उसी में’, जिसका सबसे स्वाभाविक संकेत मसीह की ओर है
  alternative: पूरे भवन के अर्थ में ‘उसी भवन में’
  rationale: निकटवर्ती प्रसंग में भवन का जुड़ना और बढ़ना मसीह में होता है। हिन्दी ‘उसी में’ इस मसीह-केंद्रित प्रवाह को रखता है, साथ ही यूनानी रूप में निहित भवन-संबंधी सम्भावना को पूरी तरह समाप्त नहीं करता।
- issue: ἐν πνεύματι का अर्थ
  choice: पवित्र आत्मा के संदर्भ में ‘आत्मा में’
  alternative: ‘आत्मिक रूप से’ अथवा ‘आत्मा के द्वारा’
  rationale: इफिसियों में निवास और मन्दिर की भाषा पवित्र आत्मा की उपस्थिति और कार्य से सबसे स्वाभाविक रूप से जुड़ती है। फिर भी ‘में’ को बनाए रखने से इसे केवल साधनवाचक अर्थ तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामूहिक मन्दिर-रूपक के अनुरूप भाषा रखी गई है। ‘आप’ प्रसंग के बहुवचन संबोधन को व्यक्त करता है; ‘बनाए जा रहे हैं’ जारी प्रक्रिया को स्पष्ट करता है।
