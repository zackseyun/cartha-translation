source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: hi
  text: कि उस समय तुम मसीह[a] के बिना थे, इस्राएल के नागरिक-समुदाय से अलग और प्रतिज्ञा की वाचाओं[b] से पराए थे; तुम्हारे पास कोई आशा नहीं थी और संसार में तुम परमेश्वर से रहित[c] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ख्रीस्त’। यूनानी Χριστός एक उपाधि है, जिसका अर्थ ‘अभिषिक्त जन’ है; यहाँ ‘मसीह’ इस्राएल और वाचाओं से जुड़े संदर्भ को उभारता है।
    reason: alternative_reading
  - marker: b
    text: या ‘प्रतिज्ञा वाली वाचाएँ’।
    reason: lexical_alternative
  - marker: c
    text: या ‘भक्तिहीन’। यहाँ आशय आधुनिक अर्थ में दार्शनिक नास्तिकता के बजाय सच्चे परमेश्वर से रहित होना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: मसीह से अलग
  rationale: यहाँ Χριστός इस्राएल के अभिषिक्त उद्धारकर्ता की उपाधि है। ‘मसीह’ हिन्दी में इस उपाधि का प्रचलित और स्वाभाविक रूप है; ‘से अलग’ पूर्व अवस्था की दूरी को स्पष्ट करता है।
- source_word: ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραήλ
  choice: इस्राएल की नागरिकता से वंचित
  rationale: πολιτεία इस्राएल की सामुदायिक-नागरिक व्यवस्था या सदस्यता को दर्शाता है, और निष्क्रिय कृदंत उससे कटे हुए होने की अवस्था बताता है। ‘नागरिकता से वंचित’ आधुनिक हिन्दी में इस नागरिक-सामुदायिक अर्थ को सहजता से व्यक्त करता है।
- source_word: ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας
  choice: प्रतिज्ञा की वाचाओं से अपरिचित
  rationale: ξένοι किसी क्षेत्र से बाहर और उससे असंबद्ध लोगों को दर्शाता है। ‘अपरिचित’ हिन्दी में स्वाभाविक है और वाचागत क्षेत्र से बाहर होने का भाव देता है। διαθηκῶν का बहुवचन और ἐπαγγελίας का एकवचन सुरक्षित रखा गया है।
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: तुम्हारे पास कोई आशा नहीं थी
  rationale: कृदंतीय पदबंध को स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है, जबकि आशा के पूर्ण अभाव का अर्थ बना रहता है।
- source_word: ἄθεοι ἐν τῷ κόσμῳ
  choice: संसार में तुम परमेश्वर से रहित थे
  rationale: ἄθεοι को आधुनिक दार्शनिक अर्थ वाले ‘नास्तिक’ के बजाय संबंध और अभाव सूचक रूप में अनूदित किया गया है। इससे संसार में सच्चे परमेश्वर से अलग उनकी दशा व्यक्त होती है।
theological_decisions:
- issue: Χριστός को उपाधि या व्यक्तिवाचक नाम के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस वचन का इस्राएल और वाचाओं से जुड़ा संदर्भ उपाधिगत अर्थ को प्रमुख बनाता है। ‘मसीह’ यहूदी-मसीही संदर्भ को हिन्दी में स्पष्ट और परिचित ढंग से रखता है।
- issue: ἄθεοι का अर्थ
  choice: परमेश्वर से रहित
  alternative: भक्तिहीन / नास्तिक
  rationale: पद यहाँ आधुनिक वैचारिक नास्तिकता को अनिवार्य रूप से नहीं बताता। चुना हुआ अनुवाद परमेश्वर के साथ संबंध से बाहर होने और उसके अभाव—दोनों की अर्थगत गुंजाइश बनाए रखता है।
- issue: διαθηκῶν τῆς ἐπαγγελίας में संबंधसूचक पदबंध
  choice: प्रतिज्ञा की वाचाएँ
  alternative: प्रतिज्ञा वाली वाचाएँ
  rationale: यूनानी में ‘वाचाएँ’ बहुवचन और ‘प्रतिज्ञा’ एकवचन है। संक्षिप्त संबंधसूचक रचना इस तनाव को बिना ‘वाचा की प्रतिज्ञाएँ’ बनाकर संख्या बदलने के सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वाचा’, ‘मसीह’ और ‘परमेश्वर’ जैसे स्थापित बाइबलीय शब्द बनाए रखे गए हैं। अर्धविराम यूनानी वाक्य की क्रमिक दशाओं को स्पष्ट करता है, और अनावश्यक व्याख्यात्मक विस्तार से बचा गया है।
