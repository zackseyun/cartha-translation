lexical_decisions:
- source_word: συνήγειρεν
  choice: हमें उसके साथ उठाया
  rationale: συν- उपसर्ग मसीह के साथ सहभागी होकर उठाए जाने का भाव देता है। व्यापक वाक्य-संदर्भ से कर्म ‘हमें’ आता है; ‘उसके साथ’ इस संयुक्त क्रिया का अर्थ स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: συνεκάθισεν
  choice: उसके साथ बैठाया
  rationale: क्रिया का अर्थ साथ बैठाना है। यह अनुवाद मसीह के साथ सहभागिता को बनाए रखता है, पर ‘सिंहासन पर बैठाया’ कहकर निहितार्थ को मूल पाठ से अधिक स्पष्ट नहीं करता।
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: स्वर्गीय स्थानों में
  rationale: इफिसियों में प्रयुक्त यह पद स्वर्गीय क्षेत्र या स्थान को सूचित करता है। ‘स्वर्गीय स्थानों में’ मूल की स्थानवाचक और कुछ हद तक खुली अभिव्यक्ति को बनाए रखता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: Χριστός यहाँ यीशु की मसीही उपाधि का भाव रखता है। ‘मसीह यीशु’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और स्वाभाविक है।
- source_word: καὶ
  choice: और
  rationale: दोनों क्रियाओं को जोड़ने वाली पुनरुक्त संयोजक रचना को सीधे रूप में रखा गया है।
theological_decisions:
- issue: संयुक्त क्रियाओं में मसीह के साथ सहभागिता
  choice: दोनों क्रियाओं में ‘उसके साथ’ स्पष्ट किया गया है।
  alternative: ‘हमें उठाया और बैठाया,’ जिसमें सहभागिता केवल निहित रहती।
  rationale: συν- उपसर्ग दोनों क्रियाओं में मसीह के साथ विश्वासियों की सहभागिता व्यक्त करता है; हिन्दी में ‘उसके साथ’ इसे बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े स्पष्ट करता है।
- issue: Χριστῷ को उपाधि के रूप में या नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु
  rationale: यहाँ Χριστός की उपाधिगत अर्थवत्ता बनी हुई है; ‘मसीह’ उसके अर्थ को हिन्दी पाठक तक पहुँचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पूर्ववर्ती वाक्य पर निर्भर है, इसलिए अन्त में अल्पविराम रखा गया है। ‘उठाया’ पुनरुत्थान-संबंधी अर्थ को बनाए रखता है, जबकि ‘बैठाया’ को ‘सिंहासन पर बैठाया’ बनाकर अतिव्याख्यायित नहीं किया गया।
