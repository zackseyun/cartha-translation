  edition: SBLGNT
  text: ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: hi
  text: जिनमें तुम पहले चला करते थे[a]—इस संसार के युग[b] के अनुसार, वायु की सत्ता के शासक[c] के अनुसार, अर्थात् उस आत्मा के अनुसार जो अब अवज्ञा के पुत्रों[d] में काम कर रही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात तुम इसी प्रकार जीवन बिताते थे। ‘चलना’ यहाँ जीवन जीने के ढंग का रूपक है।
    reason: idiom_clarification
  - marker: b
    text: इसका अनुवाद ‘इस संसार की रीति के अनुसार’ भी हो सकता है। यूनानी शब्द ‘युग’ वर्तमान संसार के काल और प्रचलित ढाँचे पर बल देता है।
    reason: lexical_alternative
  - marker: c
    text: ‘वायु’ प्राचीन जगत की उस भाषा को दर्शाती है जिसमें इसे विरोधी आत्मिक शक्तियों से जुड़ा क्षेत्र समझा जाता था।
    reason: cultural_note
  - marker: d
    text: ‘अवज्ञा के पुत्र’ एक मुहावरा है, जिसका अर्थ है ऐसे लोग जिनकी पहचान अवज्ञा से होती है; इसे ‘अवज्ञा की संतान’ भी कहा जा सकता है।
    reason: idiom_clarification
lexical_decisions:
- source_word: ἐν αἷς
  choice: जिनमें
  rationale: यह पिछले पद के स्त्रीलिंग बहुवचन ‘अपराधों और पापों’ की ओर संकेत करता है और यूनानी के स्थानवाचक संबंध को बनाए रखता है।
- source_word: ποτε περιεπατήσατε
  choice: तुम पहले चला करते थे
  rationale: ‘पहले’ बीते हुए जीवन को दर्शाता है; ‘चला करते थे’ पौलुस के जीवन-चाल संबंधी रूपक और क्रिया की अभ्यस्तता दोनों को सुरक्षित रखता है।
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: इस संसार के युग के अनुसार
  rationale: ‘युग’ αἰών को ‘संसार’ κόσμος से अलग रखता है; ‘के अनुसार’ अनुरूपता या प्रभाव में जीवन जीने का भाव देता है।
- source_word: τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος
  choice: वायु के अधिकार के शासक
  rationale: यह कठिन यूनानी संबंध-श्रृंखला को व्याख्यात्मक रूप से सरल किए बिना रखता है। ‘शासक’ आधुनिक और स्पष्ट है, जबकि ‘वायु’ ἀήρ का सीधा अर्थ है।
- source_word: τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος
  choice: उस आत्मा के अनुसार जो अब ... काम कर रही है
  rationale: ‘आत्मा’ को छोटे अक्षर से अलग दिखाना हिन्दी में संभव नहीं, इसलिए संदर्भ और ‘उस’ से प्रतिकूल आत्मिक सत्ता का संकेत मिलता है। ‘काम कर रही है’ वर्तमान सक्रिय क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: अवज्ञा के पुत्रों में
  rationale: यह सामी शैली के मूल मुहावरे और υἱοί के पुल्लिंग रूप को बनाए रखता है; पादटिप्पणी इसका अभिप्राय स्पष्ट करती है।
theological_decisions:
- issue: ‘अब काम कर रही आत्मा’ और ‘वायु के अधिकार के शासक’ का संबंध
  choice: ‘अर्थात’ लगाकर आत्मा को शासक का आगे का वर्णन माना गया है।
  alternative: इसे शासक से अलग कोई अधीनस्थ या निरपेक्ष आत्मिक शक्ति माना जा सकता है।
  rationale: यूनानी संबंधकारक संरचना व्याख्यात्मक समानाधिकरण की अनुमति देती है। अनुवाद निकट संबंध दिखाता है, पर यह तय नहीं करता कि ‘आत्मा’ शैतान का पूर्ण पर्याय है या उसके प्रभाव का वर्णन।
- issue: υἱοῖς τῆς ἀπειθείας का मुहावरा
  choice: मुख्य पाठ में ‘अवज्ञा के पुत्रों’ को बनाए रखा गया है।
  alternative: ‘अवज्ञाकारी लोग’ या ‘अवज्ञा की सन्तान’।
  rationale: यह मूल की पुरुषवाचक, सामी मुहावरेदार अभिव्यक्ति को सुरक्षित रखता है; पादटिप्पणी स्पष्ट करती है कि आशय अवज्ञा से पहचाने जानेवाले लोगों से है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। मूल के ‘चलने’, ‘युग’, ‘वायु’ और ‘अवज्ञा के पुत्र’ जैसे अर्थपूर्ण रूपकों तथा मुहावरों को मुख्य पाठ में रखा गया है और आवश्यक स्पष्टीकरण पादटिप्पणियों में दिया गया है।
