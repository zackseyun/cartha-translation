    issue: The phrase ‘वायु के अधिकार के शासक’ is syntactically heavy and potentially unclear in Hindi.
    rationale: Although it aims to reproduce the Greek genitive chain, it does not clearly signal that the ruler governs the authority/domain associated with the air. ‘वायु की सत्ता के शासक’ is clearer while preserving the same ambiguity concerning the exact nature of that authority.
