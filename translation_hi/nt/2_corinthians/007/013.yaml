id: 2CO.7.13
reference: 2 Corinthians 7:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: hi
  text: इसी कारण हमें सांत्वना मिली है[a]। और अपनी इस सांत्वना के अतिरिक्त, तीतुस के आनन्द के कारण हम और भी कहीं अधिक आनन्दित हुए, क्योंकि आप सबके द्वारा उसकी आत्मा तरोताज़ा हुई है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सांत्वना’ के स्थान पर ‘प्रोत्साहन’ भी हो सकता है; यहाँ प्रयुक्त यूनानी क्रिया और संज्ञा दोनों अर्थ दे सकती हैं।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसकी आत्मा को विश्राम मिला है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह यूनानी पद पिछले कथन से स्पष्ट कारणात्मक निष्कर्ष जोड़ता है; ‘इसी कारण’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: παρακεκλήμεθα / παρακλήσει
  choice: हमें सांत्वना मिली है / अपनी इस सांत्वना
  rationale: संबंधित क्रिया और संज्ञा को एक ही शब्द-परिवार से अनूदित किया गया है। पूर्णकालीन निष्क्रिय क्रिया के परिणामस्वरूप बनी वर्तमान दशा को ‘मिली है’ व्यक्त करता है; प्रसंग में ‘सांत्वना’ उपयुक्त है, यद्यपि ‘प्रोत्साहन’ भी संभव है।
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: और अपनी इस सांत्वना के अतिरिक्त
  rationale: यह वाक्यांश पहले मिली सांत्वना के ऊपर जुड़ने वाले और बड़े आनन्द को दर्शाता है; ‘के अतिरिक्त’ उस वृद्धिशील संबंध को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: περισσοτέρως μᾶλλον ἐχάρημεν
  choice: हम और भी कहीं अधिक आनन्दित हुए
  rationale: दोनों तुलनात्मक शब्दों के संयुक्त बल को ‘और भी कहीं अधिक’ व्यक्त करता है और ἐχάρημεν के भाव को ‘आनन्दित हुए’ बनाए रखता है।
- source_word: ἐπὶ τῇ χαρᾷ Τίτου
  choice: तीतुस के आनन्द के कारण
  rationale: ἐπί के साथ यहाँ तीतुस का आनन्द पौलुस और उसके साथियों के अधिक आनन्दित होने का आधार है; हिन्दी में ‘के कारण’ यह संबंध सहज रूप से व्यक्त करता है।
- source_word: ἀναπέπαυται
  choice: तरोताज़ा हुई है
  rationale: पूर्णकाल पूर्व में हुए कार्य और उससे बनी वर्तमान स्थिति दोनों को संकेत करता है। ‘तरोताज़ा हुई है’ इस अंतरव्यक्तिगत प्रसंग में विश्राम, राहत और नई स्फूर्ति के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: उसकी आत्मा
  rationale: यह तीतुस की अपनी आंतरिक दशा या मनोभाव को सूचित करता है। ‘आत्मा’ मूल की मानवविज्ञान-संबंधी शब्दावली को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ἀπὸ πάντων ὑμῶν
  choice: आप सबके द्वारा
  rationale: यहाँ ἀπό उन सभी कुरिन्थियों को उस ताज़गी के सामूहिक माध्यम या स्रोत के रूप में प्रस्तुत करता है; ‘आप सबके द्वारा’ हिन्दी में इसे स्पष्ट करता है।
theological_decisions:
- issue: तीतुस के संबंध में πνεῦμα का अर्थ
  choice: तीतुस की मानवीय आत्मा अथवा आंतरिक दशा
  alternative: पवित्र आत्मा
  rationale: सर्वनाम ‘उसकी’ और तीतुस के आनन्द तथा राहत का निकट प्रसंग उसकी अपनी आंतरिक दशा की ओर संकेत करते हैं, पवित्र आत्मा की ओर नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज रूप रखा गया है। ‘आप सब’ बहुवचन संबोधन और समुदाय की सामूहिक भूमिका को स्पष्ट करता है; ‘आत्मा’ मूल की शब्दावली को सुरक्षित रखता है।
