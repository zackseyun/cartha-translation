id: 2CO.7.9
reference: 2 Corinthians 7:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: hi
  text: अब मैं आनन्दित हूँ—इसलिए नहीं कि तुम दुःखी हुए, बल्कि इसलिए कि तुम्हारा दुःख तुम्हें पश्चात्ताप की ओर ले गया[a]। क्योंकि तुम परमेश्वर के अनुसार दुःखी हुए[b], ताकि हमारी ओर से तुम्हें किसी बात में हानि न हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा दुःख तुम्हें मन फिराव तक ले गया।”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम परमेश्वर की इच्छा के अनुसार दुःखी हुए” अथवा “तुम ईश्वरीय रीति से दुःखी हुए।”
    reason: lexical_alternative
  - marker: c
    text: या, “ताकि हमारे कारण तुम्हें किसी बात में हानि न हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν χαίρω
  choice: अब मैं आनन्दित हूँ
  rationale: वर्तमान दृष्टिकोण और पहले की परिस्थिति के बीच अंतर को स्पष्ट रखते हुए χαίρω की गरिमापूर्ण क्रियात्मकता बनाए रखता है।
- source_word: ἐλυπήθητε
  choice: तुम दुःखी हुए
  rationale: यूनानी में दोहराई गई क्रिया को हिन्दी में भी दोहराता है और दुःख के कारक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: εἰς μετάνοιαν
  choice: तुम्हारा दुःख तुम्हें पश्चात्ताप की ओर ले गया
  rationale: εἰς की परिणाम अथवा दिशा की भावना को स्वाभाविक हिन्दी में व्यक्त करता है; μετάνοια का नैतिक-आत्मिक आशय ‘पश्चात्ताप’ से सुरक्षित रहता है।
- source_word: κατὰ θεόν
  choice: परमेश्वर के अनुसार
  rationale: जानबूझकर अपेक्षाकृत औपचारिक अनुवाद है, जो परमेश्वर के मानक, इच्छा या रीति से सम्बन्ध की मूल अस्पष्टता बनाए रखता है।
- source_word: ἐν μηδενὶ ζημιωθῆτε
  choice: तुम्हें किसी बात में हानि न हो
  rationale: ἵνα के उद्देश्य/परिणाम और ζημιόω के हानि उठाने के अर्थ को बिना शारीरिक क्षति का भाव थोपे व्यक्त करता है।
- source_word: ἐξ ἡμῶν
  choice: हमारी ओर से
  rationale: ἐξ के स्रोतगत भाव को स्वाभाविक हिन्दी में बनाए रखता है और कारणगत अर्थ की सम्भावना को खुला छोड़ता है।
theological_decisions:
- issue: μετάνοια का स्वरूप
  choice: मुख्य पाठ में ‘पश्चात्ताप’
  alternative: ‘मन फिराव’ अथवा ‘मन का परिवर्तन’
  rationale: इस सन्दर्भ में शब्द केवल बौद्धिक मत-परिवर्तन नहीं, बल्कि नैतिक-आत्मिक प्रत्युत्तर बताता है; फिर भी पादटिप्पणी उसके मन और दिशा बदलने के मूल भाव को सामने रखती है।
- issue: κατὰ θεόν में दुःख का परमेश्वर से सम्बन्ध
  choice: ‘परमेश्वर के अनुसार दुःखी हुए’
  alternative: ‘परमेश्वर की इच्छा के अनुसार दुःखी हुए’ अथवा ‘ईश्वरीय रीति से दुःखी हुए’
  rationale: मुख्य पाठ मूल वाक्यांश की व्यापकता और धर्मवैज्ञानिक तनाव को बनाए रखता है; वह इसे केवल दुःख की रीति या केवल परमेश्वर की इच्छा तक सीमित नहीं करता।
- issue: ἐξ ἡμῶν में हानि का स्रोत या कारण
  choice: ‘हमारी ओर से’
  alternative: ‘हमारे कारण’
  rationale: स्रोत का सीधा भाव सुरक्षित रहता है, जबकि पादटिप्पणी सम्भव कारणगत अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘परमेश्वर के अनुसार’ को मूल की जानबूझकर संरक्षित अस्पष्टता के कारण कुछ औपचारिक रखा गया है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
