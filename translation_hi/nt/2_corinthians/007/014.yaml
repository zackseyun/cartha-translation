language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: hi
  text: क्योंकि यदि मैंने तीतुस से तुम्हारे विषय में कुछ डींग मारी थी, तो मुझे लज्जित नहीं होना पड़ा। बल्कि जैसे हमने तुमसे सारी बातें सच-सच कही थीं, वैसे ही तीतुस से कही गई हमारी डींग भी सच निकली।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “तीतुस के सामने हमारी डींग।” यूनानी वाक्यांश का अर्थ तीतुस को संबोधित करके या उसकी उपस्थिति में की गई डींग हो सकता है; संदर्भ में यह कुरिन्थियों के विषय में तीतुस से कही गई बात है।
    reason: ἐπὶ Τίτου के अनुवाद की व्याकरणिक संभावना को सुरक्षित रखते हुए संदर्भगत अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: κεκαύχημαι / ἡ καύχησις
  choice: घमंड किया / हमारा घमंड
  rationale: क्रिया और उसी मूल से बनी संज्ञा के संबंध को बनाए रखता है। यहाँ ‘घमंड’ का अर्थ संदर्भ के अनुसार कुरिन्थियों के विषय में विश्वासपूर्वक अच्छी बात कहना है; अनुवाद मूल की प्रबल अलंकारिक भाषा को ‘भरोसा’ कहकर नरम नहीं करता।
- source_word: οὐ κατῃσχύνθην
  choice: मुझे लज्जित नहीं होना पड़ा
  rationale: 'कर्मवाच्य भाव को सुरक्षित रखता है: पौलुस का कहा हुआ झूठा सिद्ध होकर उसे लज्जित नहीं करता। यह केवल उसके भीतर शर्म अनुभव न करने की बात नहीं है।'
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν
  choice: हमने तुमसे सारी बातें सच-सच कही थीं
  rationale: πάντα की व्यापकता और ἐν ἀληθείᾳ के क्रियाविशेषणात्मक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἡ ἐπὶ Τίτου
  choice: तीतुस के सामने किया गया
  rationale: ἐπί के साथ संबंधकारक यहाँ तीतुस की उपस्थिति में अथवा उससे कही गई गर्व की बात को सूचित करता है। ‘के सामने’ मूल की संरचना के निकट रहते हुए स्वाभाविक हिन्दी देता है।
- source_word: ἀλήθεια ἐγενήθη
  choice: सच निकला
  rationale: शाब्दिक ‘सत्य हो गया’ की अपेक्षा यह हिन्दी मुहावरा उस अर्थ को स्पष्ट करता है कि पौलुस का घमंड वास्तविकता से सही प्रमाणित हुआ।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है।
theological_decisions:
- issue: पौलुस के ‘घमंड’ का स्वरूप
  choice: मूल के घमंड/गर्व संबंधी प्रबल शब्द को बनाए रखा गया है, और संदर्भ को यह दिखाने दिया गया है कि यह उचित प्रशंसा थी।
  alternative: ‘भरोसा’ या ‘गर्वपूर्ण प्रशंसा’ कहकर संभावित नकारात्मक अर्थ को पहले ही दूर कर देना।
  rationale: पौलुस के प्रयोग में καυχάομαι और καύχησις अहंकारी डींग के साथ अनिवार्य रूप से समानार्थी नहीं हैं; यहाँ वह कुरिन्थियों के विषय में कही अपनी अच्छी बात के सत्य सिद्ध होने की चर्चा करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लज्जित नहीं होना पड़ा’ कर्मवाच्य परिणाम को, ‘सच-सच’ सत्यनिष्ठ ढंग को, और ‘सच निकला’ प्रमाणित होने के स्वाभाविक हिन्दी भाव को व्यक्त करता है। सर्वनाम ‘उसके’ से तीतुस का संकेत पूर्ववर्ती संदर्भ के अनुसार सुरक्षित है।
