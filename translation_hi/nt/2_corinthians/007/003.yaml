  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: hi
  text: मैं यह तुम्हें दोषी ठहराने के लिए नहीं कहता,[a] क्योंकि मैं पहले ही कह चुका हूँ कि तुम हमारे हृदयों में हो—यहाँ तक कि हम साथ मरें और साथ जिएँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निन्दा के लिए” या “दोष ठहराने के उद्देश्य से।”
    reason: lexical_alternative
  - marker: b
    text: या, “साथ मरने और साथ जीने के लिए।” यूनानी में मृत्यु और जीवन—दोनों में साझा एकजुटता पर बल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν
  choice: दोषी ठहराने के लिए
  rationale: यह पदबंध उद्देश्य या अभिप्राय व्यक्त करता है। यह स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है कि पौलुस की बात का लक्ष्य कुरिन्थियों को दोषी ठहराना नहीं है।
- source_word: λέγω
  choice: मैं यह ... कह रहा हूँ
  rationale: वर्तमान काल को स्वाभाविक हिन्दी में रखा गया है; संदर्भ की ओर संकेत करने के लिए ‘यह’ जोड़ा गया है।
- source_word: προείρηκα
  choice: मैं पहले ही कह चुका हूँ
  rationale: यूनानी पूर्णकाल पहले कही गई ऐसी बात दर्शाता है जिसकी प्रासंगिकता अभी बनी हुई है।
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: तुम हमारे हृदयों में बसे हो
  rationale: ‘हृदयों’ का बहुवचन पौलुस और उसके साथियों की सामूहिक आत्मीयता को बनाए रखता है; ‘बसे हो’ हिन्दी में गहरी और स्थायी आत्मीयता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: ताकि हम साथ मरें और साथ जिएँ
  rationale: εἰς के उद्देश्य/परिणाम-संबंध को ‘ताकि’ व्यक्त करता है, और दोनों συν- संयुक्त क्रियाओं का साझा भाव ‘साथ’ से समानांतर रूप में सुरक्षित रहता है।
theological_decisions:
- issue: ‘साथ मरें और साथ जिएँ’ को किसी विशिष्ट वाचागत, वैवाहिक या मसीह-संयोग संबंधी श्रेणी के रूप में स्पष्ट करना
  choice: इसे गहरी पारस्परिक आत्मीयता और एकजुटता की भाषा के रूप में अनिर्दिष्ट रखा गया
  alternative: इसे वाचा-निष्ठा या मसीह में सहभागिता का स्पष्ट संकेत बनाना
  rationale: मूल पाठ अत्यंत गहरी एकजुटता व्यक्त करता है, पर स्वयं किसी तकनीकी धर्मवैज्ञानिक श्रेणी को स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का आत्मीय किंतु गरिमापूर्ण रूप अपनाया गया है। ‘तुम’ सामुदायिक संबोधन और पौलुस के निकट संबंध के अनुकूल है। शब्दक्रम को हिन्दी में स्वाभाविक रखा गया है, जबकि मूल की ‘मरना—जीना’ क्रमावली और समानांतरता सुरक्षित है।
