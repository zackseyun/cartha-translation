source:
  edition: SBLGNT
  text: Καὶ γὰρ ἐλθόντων ἡμῶν εἰς Μακεδονίαν οὐδεμίαν ⸀ἔσχηκεν ἄνεσιν ἡ σὰρξ ἡμῶν, ἀλλ’ ἐν παντὶ θλιβόμενοι— ἔξωθεν μάχαι, ἔσωθεν φόβοι—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: hi
  text: क्योंकि मकिदुनिया पहुँचने पर भी हमारे शरीर[a] को कोई चैन नहीं मिला, बल्कि हम हर प्रकार से दबाव में थे—बाहर संघर्ष, भीतर भय।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमें स्वयं कोई चैन नहीं मिला।” यूनानी में शाब्दिक रूप से “हमारे शरीर” है, जो यहाँ देहधारी मनुष्यों की दुर्बलता और व्यथा को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: क्योंकि ... तब भी
  rationale: यह पद पिछले प्रसंग का कारण या स्पष्टीकरण देता है और साथ ही जोर भी प्रकट करता है; हिंदी में ‘क्योंकि ... तब भी’ इस संबंध और बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: जब हम मकिदुनिया पहुँचे
  rationale: संबंधवाचक कृदंत-वाक्यांश का कालगत अर्थ है। ‘पहुँचे’ आधुनिक हिंदी में आगमन को सहजता से व्यक्त करता है।
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: कोई चैन नहीं मिला
  rationale: ἄνεσις दबाव से राहत, विश्राम या चैन का बोध कराता है। ‘कोई चैन नहीं मिला’ प्रसंग की शारीरिक और भावनात्मक व्याकुलता दोनों के लिए स्वाभाविक है।
- source_word: ἡ σὰρξ ἡμῶν
  choice: हमारे शरीर
  rationale: σάρξ का मूल देहगत अर्थ बनाए रखा गया है, पर हिंदी के ‘मांस’ से उत्पन्न भ्रामक या अप्राकृतिक प्रभाव से बचने के लिए ‘शरीर’ चुना गया है। यहाँ इसका संकेत पापी स्वभाव की ओर नहीं, बल्कि देहधारी मानवीय दुर्बलता और कष्ट की ओर है।
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: बल्कि हम हर ओर से क्लेश में थे
  rationale: θλιβόμενοι दबाए जाने, सताए जाने या क्लेश पाने का अर्थ देता है। ‘हर ओर से क्लेश में थे’ व्यापक दबाव को स्पष्ट और गरिमापूर्ण हिंदी में रखता है।
- source_word: ἔξωθεν μάχαι
  choice: बाहर संघर्ष
  rationale: μάχαι यहाँ आवश्यक रूप से शारीरिक लड़ाइयाँ नहीं, बल्कि बाहरी विरोध और टकराव हैं; ‘संघर्ष’ इस व्यापकता को बनाए रखता है।
- source_word: ἔσωθεν φόβοι
  choice: भीतर भय
  rationale: यह बाहरी संघर्षों के विपरीत आंतरिक आशंकाओं को संक्षेप और प्रभावी समानांतर संरचना में व्यक्त करता है।
theological_decisions:
- issue: σάρξ का अनुवाद
  choice: हमारे शरीर
  alternative: हमें स्वयं / हमारे तन को
  rationale: इस प्रसंग में σάρξ नैतिक रूप से ‘पापी स्वभाव’ नहीं, बल्कि देहधारी मनुष्य की दुर्बलता और व्यथा को सूचित करता है। ‘शरीर’ मूल रूपक का पर्याप्त अंश बचाता है और आधुनिक हिंदी में ‘हमारे मांस’ की अपेक्षा अधिक स्वाभाविक है; पादटिप्पणी इसका भावार्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘बाहर संघर्ष, भीतर भय’ मूल की संक्षिप्त और संतुलित विरोधी संरचना को बनाए रखता है।
