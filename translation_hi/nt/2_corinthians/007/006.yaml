source:
  edition: SBLGNT
  text: ἀλλ’ ὁ παρακαλῶν τοὺς ταπεινοὺς παρεκάλεσεν ἡμᾶς ὁ θεὸς ἐν τῇ παρουσίᾳ Τίτου·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: hi
  text: परन्तु दीनों[a] को सांत्वना देनेवाले परमेश्वर ने तीतुस के आने से[b] हमें सांत्वना दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नम्र लोगों’, ‘हताश लोगों’ अथवा ‘नीची दशा में पड़े लोगों’।
    reason: lexical_alternative
  - marker: b
    text: या ‘तीतुस की उपस्थिति से’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: परन्तु
  rationale: यह पिछले प्रसंग में वर्णित क्लेश और वर्तमान सांत्वना के बीच स्पष्ट विरोध दर्शाता है।
- source_word: ὁ παρακαλῶν
  choice: सांत्वना देनेवाले
  rationale: वर्तमान कृदन्त परमेश्वर के चरित्रगत कार्य का वर्णन करता है। ‘सांत्वना’ क्लेश के प्रसंग के अनुकूल है और आगे के παρεκάλεσεν के साथ शब्दगत संबंध बनाए रखती है।
- source_word: τοὺς ταπεινοὺς
  choice: दीनों
  rationale: ταπεινός में दीन, नम्र, नीची दशा में पड़े या हताश लोगों का अर्थ हो सकता है। ‘दीनों’ सामाजिक और भावात्मक दोनों संभावनाओं को संक्षेप में खुला रखता है।
- source_word: παρεκάλεσεν
  choice: सांत्वना दी
  rationale: यह पहले आए παρακαλῶν के साथ शब्दगत संबंध बनाए रखता है और इस प्रसंग में पौलुस को मिली राहत व्यक्त करता है।
- source_word: ἐν τῇ παρουσίᾳ
  choice: के आने से
  rationale: παρουσία यहाँ तीतुस के आगमन या उपस्थित होने को सूचित कर सकता है। प्रसंग में उसके आगमन की घटना को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: Τίτου
  choice: तीतुस
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: यूनानी पाठ में परमेश्वर स्पष्ट कर्ता है; हिन्दी वाक्यक्रम में उसे स्वाभाविक ढंग से रखा गया है।
theological_decisions:
- issue: τοὺς ταπεινοὺς का अर्थ
  choice: दीनों
  alternative: नम्र लोगों; हताश लोगों; नीची दशा में पड़े लोगों
  rationale: प्रसंग क्लेश के कारण मन से गिरे हुए लोगों की ओर संकेत कर सकता है, पर शब्द का अर्थ केवल भावात्मक निराशा तक सीमित नहीं है। ‘दीनों’ इस व्यापकता और तनाव को बनाए रखता है।
- issue: ἐν τῇ παρουσίᾳ Τίτου का संबंध
  choice: तीतुस के आने से
  alternative: तीतुस की उपस्थिति से
  rationale: यह पदबंध आगमन की घटना और उसके परिणामस्वरूप हुई उपस्थिति—दोनों को व्यक्त कर सकता है। मुख्य पाठ में प्रसंगानुकूल घटना-भाव रखा गया है और दूसरा अर्थ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘सांत्वना देनेवाले/सांत्वना दी’ की पुनरावृत्ति मूल यूनानी में एक ही शब्द-परिवार की पुनरावृत्ति को सुरक्षित रखती है।
