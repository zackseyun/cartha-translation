source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: hi
  text: और केवल उसके आने से ही नहीं,[a] बल्कि उस सांत्वना से भी जो उसे तुम्हारे कारण मिली थी, जब उसने हमें मेरे लिए तुम्हारी लालसा, तुम्हारे शोक,[b] और मेरे लिए तुम्हारे उत्साह के विषय में बताया। इससे मैं और भी अधिक आनन्दित हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी उपस्थिति से।”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारा विलाप।”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: आने
  rationale: इस व्यक्तिगत यात्रा-संदर्भ में शब्द तीतुस की उपस्थिति से अधिक उसके आगमन की घटना पर बल देता है; ‘आने’ सहज हिन्दी है।
- source_word: παρακλήσει / παρεκλήθη
  choice: सांत्वना / सांत्वना मिली
  rationale: संज्ञा और सजातीय क्रिया का संबंध यथासंभव बनाए रखते हुए प्रसंग की भावनात्मक राहत व्यक्त की गई है।
- source_word: ἐφ’ ὑμῖν
  choice: तुम्हारे कारण
  rationale: ἐπί के साथ दत्तिव यहाँ कुरिन्थियों और उनकी प्रतिक्रिया को तीतुस को मिली सांत्वना का आधार या अवसर बताता है।
- source_word: ἀναγγέλλων
  choice: उसने हमें बताया
  rationale: कृदन्त को सहज हिन्दी में मुख्य कथन से जोड़कर सूचना देने का अर्थ सुरक्षित रखा गया है।
- source_word: ἐπιπόθησιν
  choice: मुझसे मिलने के लिए कितने लालायित
  rationale: यह प्रबल अभिलाषा व्यक्त करता है; प्रसंग में इच्छा पौलुस की ओर निर्देशित है, इसलिए हिन्दी में उसका लक्ष्य स्पष्ट किया गया है।
- source_word: ὀδυρμόν
  choice: शोक
  rationale: यह गहरे दुःख और उसके विलापपूर्ण प्रकटीकरण दोनों को सूचित कर सकता है; ‘शोक’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ζῆλον ὑπὲρ ἐμοῦ
  choice: मेरे लिए कितने उत्साही
  rationale: उनकी पौलुस के प्रति उत्कट चिंता और तत्परता को व्यक्त करता है, बिना उसका स्वरूप आवश्यकता से अधिक निश्चित किए।
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: इससे मुझे और भी अधिक आनन्द हुआ
  rationale: परिणाम और μᾶλλον की तुलनात्मक तीव्रता दोनों स्पष्ट और स्वाभाविक हिन्दी में रखी गई हैं।
