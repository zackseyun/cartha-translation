base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: hi
  text: मुझे तुमसे बहुत खुलकर बोलने का साहस है[a], और तुम्हारे विषय में मैं बहुत गर्व करता हूँ। मैं प्रोत्साहन[b] से भर गया हूँ; हमारे सारे क्लेश के बीच[c] मैं आनन्द से उमड़ पड़ता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे तुम पर बहुत भरोसा है।” यूनानी शब्द में निःसंकोच और खुलकर बोलने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “सांत्वना।” यूनानी शब्द में ढाढ़स देने और दृढ़ करने—दोनों का भाव है।
    reason: lexical_alternative
  - marker: c
    text: या, “हमारे सारे क्लेश के बावजूद।” यहाँ आनन्द का क्लेश के बीच भी उमड़ना समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: खुलकर बोलने का साहस
  rationale: यह पद साहस, भरोसे और वाणी की खुली स्पष्टता—तीनों का भाव रखता है। प्रसंग में पौलुस की कुरिन्थियों से निःसंकोच बात करने की स्वतंत्रता प्रमुख है।
- source_word: πρὸς ὑμᾶς
  choice: तुमसे
  rationale: πρός यहाँ संबंध की दिशा बताता है; ‘तुमसे’ आधुनिक हिन्दी में स्वाभाविक रूप से पौलुस के उनके प्रति खुले व्यवहार को व्यक्त करता है।
- source_word: καύχησις
  choice: गर्व करता हूँ
  rationale: यह पौलुस की सकारात्मक καύχησις को व्यक्त करता है—कुरिन्थियों के विषय में प्रसन्नतापूर्वक गौरव करना—और हिन्दी में अनावश्यक रूप से पापपूर्ण डींग का अर्थ थोपने से बचता है।
- source_word: ὑπὲρ ὑμῶν
  choice: तुम्हारे विषय में
  rationale: ὑπέρ सम्बन्ध या पक्ष में बोलने का भाव दे सकता है। यहाँ ‘तुम्हारे विषय में’ उस संदर्भ को सहज हिन्दी में सुरक्षित रखता है।
- source_word: πεπλήρωμαι
  choice: मैं ... से भर गया हूँ
  rationale: पूर्णकालिक कर्मवाच्य वर्तमान परिणामी अवस्था को दर्शाता है; ‘भर गया हूँ’ पूर्व घटना से उत्पन्न वर्तमान परिपूर्णता व्यक्त करता है।
- source_word: παρακλήσει
  choice: प्रोत्साहन
  rationale: παράκλησις में ढाढ़स, सांत्वना और बलवर्धन सम्मिलित हैं। ‘प्रोत्साहन’ प्रसंग में मिली सांत्वना और सुदृढ़ता को समेटता है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: ὑπερπερισσεύομαι
  choice: उमड़ा पड़ता है
  rationale: इस तीव्र क्रिया का अर्थ अत्यधिक भरपूर या छलकना है। ‘उमड़ा पड़ता है’ हिन्दी में प्रचुरता और प्रवाह का चित्र स्वाभाविक रूप से रखता है।
- source_word: χαρᾷ
  choice: आनन्द
  rationale: χαρά का सीधा और गरिमापूर्ण हिन्दी समतुल्य ‘आनन्द’ है।
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: हमारे सारे क्लेश के बीच
  rationale: ἐπί सहित पदबंध आनन्द को क्लेश के चलते मिटा हुआ नहीं, बल्कि उसी के बीच उमड़ता हुआ दिखाता है। यह अनुवाद उस सह-अस्तित्व और तनाव को बनाए रखता है।
- source_word: πολλή ... πολλή
  choice: बहुत ... बहुत
  rationale: दोहराव मूल की समानांतर प्रचुरता को सुरक्षित रखता है और आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: पौलुस की सकारात्मक καύχησις को कैसे व्यक्त किया जाए
  choice: ‘गर्व करता हूँ’ द्वारा कुरिन्थियों के विषय में सकारात्मक गौरव व्यक्त करना
  alternative: ‘डींग मारता हूँ’ या ‘घमण्ड करता हूँ’
  rationale: मूल शब्द पौलुस के यहाँ सकारात्मक अर्थ में भी आता है। ‘गर्व’ उसकी प्रबल वाणी को बनाए रखता है, जबकि ‘डींग’ या ‘घमण्ड’ यहाँ अनुचित रूप से पापपूर्ण आत्मश्लाघा का अर्थ दे सकता है।
- issue: आनन्द और क्लेश के संबंध को बनाए रखना
  choice: ‘हमारे सारे क्लेश के बीच’
  alternative: ‘हमारे सारे क्लेश के बावजूद’
  rationale: यूनानी पाठ आनन्द और क्लेश को एक साथ उपस्थित रखता है। ‘के बीच’ इस धर्मवैचारिक तनाव को सुरक्षित रखता है, जबकि ‘के बावजूद’ संबंध को अधिक विरोधात्मक ढंग से व्याख्यायित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और संबोधन में सुसंगत रूप अपनाया गया है। ‘तुम’ बहुवचन मंडली के लिए है। वाक्य की समानांतर बनावट, प्रचुरता का दोहराव और आनन्द-क्लेश का तनाव सुरक्षित रखा गया है।
