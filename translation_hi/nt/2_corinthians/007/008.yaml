id: 2CO.7.8
reference: 2 Corinthians 7:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι εἰ καὶ ἐλύπησα ὑμᾶς ἐν τῇ ἐπιστολῇ, οὐ μεταμέλομαι· εἰ καὶ μετεμελόμην (⸀βλέπω ὅτι ἡ ἐπιστολὴ ἐκείνη εἰ καὶ πρὸς ὥραν ἐλύπησεν ὑμᾶς),
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/008.yaml
  text: For even if I grieved you with the letter[a], I do not regret it—though I did regret it, for I see that that letter grieved you[b], though only for a time.
translation:
  language: hi
  text: क्योंकि यदि मैंने पत्र के द्वारा आपको दुःखी किया भी, तो मुझे इसका पछतावा नहीं है—यद्यपि मुझे पछतावा हुआ था[a]; क्योंकि मैं देखता हूँ कि उस पत्र ने आपको दुःखी किया था, हालाँकि केवल थोड़े समय के लिए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे पछतावा हो रहा था।” यूनानी अपूर्ण भूतकाल अतीत में बनी हुई पछतावे की अवस्था पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “एक घड़ी के लिए”; यह एक मुहावरा है जिसका अर्थ “थोड़े समय के लिए” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύπησα / ἐλύπησεν
  choice: दुःखी किया / दुःखी किया था
  rationale: λυπέω का अर्थ दुःख या मानसिक पीड़ा पहुँचाना है। ‘दुःखी किया’ सरल, स्वाभाविक और मूल भाव के निकट है।
- source_word: ἐν τῇ ἐπιστολῇ
  choice: पत्र के द्वारा
  rationale: यहाँ ἐν साधन का बोध कराता है; ‘पत्र के द्वारा’ स्पष्ट करता है कि पत्र दुःख पहुँचाने का माध्यम था।
- source_word: μεταμέλομαι
  choice: मुझे इसका पछतावा नहीं है
  rationale: इस प्रसंग में μεταμέλομαι नैतिक मन-फिराव नहीं, बल्कि अपने किए के परिणाम को लेकर पछतावा व्यक्त करता है।
- source_word: μετεμελόμην
  choice: मुझे पछतावा हुआ था
  rationale: अपूर्ण भूतकाल अतीत में पछतावे की अवस्था व्यक्त कर सकता है। यह रूप वर्तमान ‘पछतावा नहीं है’ के साथ विरोध को स्पष्ट रखता है; वैकल्पिक पक्ष पाद-टिप्पणी में दिया गया है।
- source_word: βλέπω
  choice: मैं देखता हूँ
  rationale: यह मूल क्रिया का सीधा अर्थ है और यहाँ पौलुस की समझ या पहचान को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἡ ἐπιστολὴ ἐκείνη
  choice: उस पत्र
  rationale: ‘उस’ यूनानी संकेतवाचक ἐκείνη की विशिष्टता को बनाए रखता है।
- source_word: πρὸς ὥραν
  choice: केवल थोड़े समय के लिए
  rationale: शाब्दिक अर्थ ‘एक घड़ी के लिए’ है, पर यह मुहावरा अल्प अवधि का बोध कराता है। ‘केवल थोड़े समय के लिए’ अस्थायी प्रभाव को स्पष्ट करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: दोनों स्थानों पर यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: εἰ καὶ
  choice: यदि ... भी / हालाँकि
  rationale: पहले प्रयोग में ‘यदि ... भी’ यूनानी की रियायती संरचना को सुरक्षित रखता है; अंतिम प्रयोग में स्वाभाविक हिंदी के लिए ‘हालाँकि’ वही रियायती संबंध व्यक्त करता है।
theological_decisions:
- issue: पौलुस के भावनात्मक आत्म-वर्णन में μεταμέλομαι का अर्थ
  choice: ‘पछतावा’
  alternative: ‘मन फिराना’ या ‘पश्चात्ताप करना’
  rationale: प्रसंग में पौलुस अपने पिछले पत्र से हुए दुःख के प्रति अपनी भावनात्मक प्रतिक्रिया बता रहा है, परमेश्वर के सामने नैतिक पश्चात्ताप नहीं। ‘पछतावा’ इस भेद को बनाए रखता है और अनावश्यक धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल किंतु गरिमापूर्ण शैली अपनाई गई है। रियायती वाक्य-रचना और वर्तमान तथा भूतकाल के पछतावे के बीच तनाव को बनाए रखा गया है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
