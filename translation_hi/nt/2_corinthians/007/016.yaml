  text: I rejoice that in every way I have confidence in you[a].
translation:
  language: hi
  text: मुझे आनन्द है कि मुझे हर बात में तुम पर भरोसा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρω
  choice: मुझे आनन्द है
  rationale: वर्तमानकालीन आनन्द को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है; ‘मैं आनन्दित होता हूँ’ की अपेक्षा अधिक सहज है।
- source_word: ὅτι
  choice: कि
  rationale: यहाँ ὅτι मुख्यतः पौलुस के आनन्द की विषय-वस्तु प्रस्तुत करता है, इसलिए ‘कि’ उपयुक्त है; कारणवाचक ‘क्योंकि’ भी व्याकरणतः सम्भव है।
- source_word: ἐν παντί
  choice: हर बात में
  rationale: नपुंसकलिंग एकवचन पदबंध यहाँ व्यापक, क्रियाविशेषणीय अर्थ रखता है। ‘हर बात में’ उस व्यापकता को सहज हिन्दी में बनाए रखता है।
- source_word: θαρρῶ
  choice: मुझे ... भरोसा है
  rationale: संदर्भ में क्रिया साहस रखने से अधिक कुरिन्थियों के विषय में स्थिर विश्वास व्यक्त करती है; ‘भरोसा है’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐν ὑμῖν
  choice: तुम पर
  rationale: θαρρέω के साथ ἐν व्यक्तियों के प्रति या उनमें रखे विश्वास को बताता है। हिन्दी में ‘तुम पर भरोसा’ relational force को स्वाभाविक रूप से व्यक्त करता है।
