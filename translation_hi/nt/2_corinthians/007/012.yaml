base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: hi
  text: इसलिए, यद्यपि मैंने तुम्हें लिखा, तो भी यह न तो उस व्यक्ति के कारण था जिसने अन्याय किया, न ही उस व्यक्ति के कारण जिसके साथ अन्याय किया गया, बल्कि इसलिए कि हमारे लिए तुम्हारी तत्परता परमेश्वर के सामने तुम्हारे बीच प्रकट हो जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में है, “तुम्हारे लिए हमारी तत्परता तुम्हारे बीच परमेश्वर के सामने प्रकट हो जाए।”
    reason: textual_variant
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: इसलिए, यद्यपि
  rationale: ἄρα के निष्कर्षसूचक भाव और εἰ καὶ के रियायती भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔγραψα ὑμῖν
  choice: मैंने तुम्हें लिखा
  rationale: अओरिस्ट को पूर्व में लिखे गए पत्र के संदर्भ में साधारण भूतकाल से व्यक्त किया गया है।
- source_word: οὐχ ἕνεκεν τοῦ ἀδικήσαντος
  choice: न तो उस व्यक्ति के कारण था जिसने अन्याय किया
  rationale: ἕνεκεν का कारणसूचक अर्थ और कर्तृवाचक कृदंत का व्यक्तिगत, क्रियात्मक भाव सुरक्षित रहता है।
- source_word: οὐδὲ ἕνεκεν τοῦ ἀδικηθέντος
  choice: और न उस व्यक्ति के कारण जिसके साथ अन्याय हुआ
  rationale: निष्क्रिय कृदंत को पिछले वाक्यांश के समानांतर और सहज हिन्दी में रखा गया है।
- source_word: ἀλλ’ ἕνεκεν τοῦ φανερωθῆναι
  choice: बल्कि इसलिए कि ... प्रकट हो जाए
  rationale: सप्रत्यय infinitive की प्रयोजनवाचकता और φανερωθῆναι का निष्क्रिय भाव दोनों व्यक्त होते हैं।
- source_word: τὴν σπουδὴν ὑμῶν
  choice: तुम्हारी तत्परता
  rationale: σπουδή की गंभीर उत्सुकता, लगन और सक्रिय चिंता को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὴν ὑπὲρ ἡμῶν
  choice: हमारे लिए
  rationale: पौलुस और उसके सहकर्मियों के प्रति समर्थन या चिंता की दिशा को बिना अधिक व्याख्या के व्यक्त करता है।
- source_word: πρὸς ὑμᾶς
  choice: तुम्हारे बीच
  rationale: इस कठिन संरचना में समुदाय के भीतर प्रकट होने का अर्थ देता है और उपलब्ध साक्ष्य में निहित अस्पष्टता को पूरी तरह समाप्त नहीं करता।
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर के सामने
  rationale: दिव्य उपस्थिति और साक्षी के गंभीर भाव को परिचित बाइबलीय हिन्दी में बनाए रखता है।
theological_decisions:
- issue: कठिन वाक्यांश ‘तुम्हारी तत्परता हमारे लिए ... तुम्हारे बीच’ का संबंध
  choice: मुख्य पाठ में कुरिन्थियों की पौलुस और उसके साथियों के लिए तत्परता को उन्हीं के बीच परमेश्वर के सामने प्रकट होने के रूप में रखा गया है।
  alternative: 'कुछ पांडुलिपियों के अनुसार: ‘तुम्हारे लिए हमारी तत्परता तुम्हारे बीच परमेश्वर के सामने प्रकट हो जाए।’'
  rationale: SBLGNT के मुद्रित पाठ में ὑμῶν को ‘तुम्हारी’, ὑπὲρ ἡμῶν को ‘हमारे लिए’ और πρὸς ὑμᾶς को ‘तुम्हारे बीच’ समझा गया है। भिन्न पांडुलिपि-पाठ वास्तविक पाठालोचनात्मक विकल्प है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संबोधन में बहुवचन ‘तुम’ रखा गया है। ‘अन्याय किया/जिसके साथ अन्याय हुआ’ मूल के सक्रिय और निष्क्रिय कृदंतों की समानांतरता बनाए रखते हैं।
