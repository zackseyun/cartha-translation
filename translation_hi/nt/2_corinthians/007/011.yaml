id: 2CO.7.11
reference: 2 Corinthians 7:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: hi
  text: क्योंकि देखो, परमेश्वर के अनुरूप हुए इस दुःख[a] ने तुममें कितनी तत्परता उत्पन्न की—और तो और, कैसा बचाव[b], कैसा रोष, कैसा भय, कैसी लालसा, कैसा जोश और कैसा प्रतिकार[c]! इस मामले में तुमने हर तरह से अपने आप को दोष से मुक्त प्रमाणित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर को भाने वाला यही दुःख।”
    reason: κατὰ θεόν का अधिक सहज, किंतु कुछ अधिक व्याख्यात्मक हिन्दी रूप।
  - marker: b
    text: या, “कैसी सफ़ाई” या “अपने को दोष से अलग सिद्ध करना।”
    reason: ἀπολογία बचाव या सफ़ाई देने, और संदर्भ में अपराध में सहभागिता से स्वयं को अलग सिद्ध करने का अर्थ रख सकता है।
  - marker: c
    text: या, “कैसा दंड” अथवा “कैसा न्याय।”
    reason: ἐκδίκησις दंड, न्याय, या गलत काम के उचित प्रतिकार की ओर संकेत कर सकता है।
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: क्योंकि देखो
  rationale: γάρ के कारणसूचक संबंध और ἰδού के ध्यान आकर्षित करने वाले बल—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: τὸ κατὰ θεὸν λυπηθῆναι
  choice: परमेश्वर के अनुसार हुआ यही दुःख
  rationale: κατὰ θεόν को केवल ‘भक्ति से भरा’ कहकर व्याख्यायित करने के बजाय परमेश्वर की इच्छा या मानक के अनुरूप होने का खुला भाव सुरक्षित रखा गया है।
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: तुममें कितनी तत्परता उत्पन्न की
  rationale: κατεργάζομαι किसी परिणाम को उत्पन्न करने और σπουδή गंभीर तत्परता का बोध कराते हैं।
- source_word: ἀλλὰ
  choice: और तो और
  rationale: बार-बार आया ἀλλά यहाँ मुख्यतः विरोध नहीं, बल्कि क्रमशः बढ़ते हुए जोर और अतिरिक्त प्रमाणों को प्रकट करता है। हिन्दी में इसे एक आरंभिक पदबंध और समानांतर ‘कैसा/कैसी’ संरचना से व्यक्त किया गया है।
- source_word: ἀπολογίαν
  choice: अपना पक्ष स्पष्ट करने की कैसी उत्सुकता
  rationale: यह अपने आचरण या स्थिति की सफ़ाई देने और स्वयं को अपराध में सहभागी न ठहराने के प्रयास को दर्शाता है; ‘उत्सुकता’ वाक्य में पहले आए σπουδή के प्रभाव से स्वाभाविक रूप से जुड़ती है।
- source_word: ἀγανάκτησιν
  choice: रोष
  rationale: पाप या उत्पन्न स्थिति के प्रति तीव्र नैतिक अप्रसन्नता व्यक्त करता है, पर उसके लक्ष्य को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: φόβον
  choice: भय
  rationale: यूनानी पाठ भय का लक्ष्य नहीं बताता; इसलिए परमेश्वर, पौलुस या परिणामों के प्रति भय में से किसी एक को मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: ἐπιπόθησιν
  choice: लालसा
  rationale: गहरी इच्छा या पुनर्मिलन की उत्कंठा का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ζῆλον
  choice: जोश
  rationale: शक्तिशाली नैतिक उत्साह व्यक्त करता है और पहले आए ‘तत्परता’ से शब्दगत भेद बनाए रखता है।
- source_word: ἐκδίκησιν
  choice: न्याय करने की कैसी तत्परता
  rationale: यह गलत बात को ठीक करने के लिए निर्णायक कार्रवाई का संकेत दे सकता है। यह निजी प्रतिशोध से बचते हुए न्याय अथवा दंड के संभावित अर्थ को खुला रखता है।
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς εἶναι τῷ πράγματι
  choice: इस मामले में तुमने हर तरह से अपने आप को निर्दोष प्रमाणित किया
  rationale: संदर्भ में συνίστημι प्रमाणित या प्रदर्शित करने और ἁγνός मामले के संबंध में दोषमुक्त होने का बोध देता है।
theological_decisions:
- issue: κατὰ θεόν का अर्थ
  choice: परमेश्वर के अनुसार
  alternative: परमेश्वर को भाने वाला / भक्ति से उत्पन्न
  rationale: यह अधिक निकट रूप परमेश्वर की इच्छा, मानक या उद्देश्य के अनुरूप दुःख की सम्भावना को सुरक्षित रखता है और किसी एक व्याख्यात्मक अर्थ को आरोपित नहीं करता।
- issue: ἐκδίκησις का पश्चाताप के संदर्भ में अर्थ
  choice: न्याय करना
  alternative: दंड देना / गलत बात का प्रतिकार करना
  rationale: संदर्भ कलीसिया की सुधरी हुई प्रतिक्रिया का है। ‘न्याय करना’ निर्णायक सुधारात्मक कार्रवाई को व्यक्त करता है, पर व्यक्तिगत बदला लेने का भाव नहीं देता।
- issue: ἁγνούς का संबंध
  choice: इस मामले में निर्दोष
  alternative: इस मामले में शुद्ध
  rationale: यह कथन उनके समग्र पापरहित होने का दावा नहीं, बल्कि उल्लिखित मामले के संबंध में उनकी सुधरी हुई स्थिति और प्रतिक्रिया का प्रमाण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। यूनानी की तीव्र, क्रमिक सूची को ‘कैसा/कैसी’ की पुनरावृत्ति से व्यक्त किया गया है। ‘भय’ का लक्ष्य और ‘न्याय’ की ठीक प्रकृति जानबूझकर अनिर्धारित रखी गई है, क्योंकि मूल पाठ भी उन्हें स्पष्ट नहीं करता।
