  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: hi
  text: और जब वह आप सबकी आज्ञाकारिता को याद करता है—कि आपने उसे डरते और काँपते हुए[a] ग्रहण किया था—तो आपके प्रति उसका स्नेह और भी बढ़ जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आदर और गम्भीरता के साथ”; “डरते और काँपते हुए” पौलुस का एक मुहावरा है, जो गम्भीर और विनम्र तत्परता व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: स्नेह
  rationale: यह शब्द शाब्दिक रूप से भीतरी अंगों को दर्शाता है, पर यहाँ मुहावरे के रूप में गहरे भावनात्मक लगाव और कोमल आत्मीयता का अर्थ देता है।
- source_word: περισσοτέρως
  choice: और भी बढ़ जाता है
  rationale: तुलनात्मक तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है; तीतुस का स्नेह पहले से अधिक होने का भाव बना रहता है।
- source_word: εἰς ὑμᾶς
  choice: आपके प्रति
  rationale: स्नेह की दिशा कुरिन्थियों की ओर होने को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ἀναμιμνῃσκομένου
  choice: जब वह ... याद करता है
  rationale: कृदन्त से व्यक्त परिस्थिति और स्मरण की क्रिया को स्वाभाविक हिन्दी उपवाक्य में प्रस्तुत करता है।
- source_word: τὴν πάντων ὑμῶν ὑπακοήν
  choice: आप सबकी आज्ञाकारिता
  rationale: ὑπακοή का सीधा अर्थ ‘आज्ञाकारिता’ है और πάντων ὑμῶν पूरी मण्डली के समावेश पर बल देता है।
- source_word: μετὰ φόβου καὶ τρόμου
  choice: डरते और काँपते हुए
  rationale: पौलुस के प्रबल मुहावरे की ठोस छवि और अर्थगत तनाव को बनाए रखता है; संदर्भ में आदरपूर्ण गंभीरता की सम्भावना पादटिप्पणी में दी गई है।
- source_word: ἐδέξασθε
  choice: स्वागत किया था
  rationale: संदर्भ में तीतुस को ग्रहण करने और स्वीकार करने का भाव है; ‘स्वागत किया’ आधुनिक हिन्दी में व्यक्तिगत आगमन के लिए स्वाभाविक है।
- source_word: αὐτόν
  choice: उसका
  rationale: यूनानी सर्वनाम को बनाए रखता है; निकटवर्ती संदर्भ में इसका संकेत तीतुस की ओर स्पष्ट है।
theological_decisions:
- issue: तीतुस के स्वागत के सम्बन्ध में ‘डर और काँपना’ का अर्थ
  choice: मुख्य पाठ में मुहावरे की प्रबल भाषा ‘डरते और काँपते हुए’ बनाए रखना
  alternative: ‘आदर और गम्भीरता के साथ’ अथवा ‘श्रद्धा से काँपते हुए’
  rationale: वाक्यांश केवल आतंक नहीं, बल्कि गम्भीर, विनम्र और आदरपूर्ण तत्परता भी व्यक्त कर सकता है। मुख्य पाठ इसकी वास्तविक तीव्रता और अर्थगत खुलापन बचाता है, जबकि पादटिप्पणी सम्भावित आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानसूचक बहुवचन ‘आप’ का प्रयोग। भाषा सहज और गरिमापूर्ण रखी गई है। मूल यूनानी की वाक्य-संरचना को हिन्दी में स्वाभाविक बनाने के लिए स्मरण वाले उपवाक्य को पहले रखा गया है, पर कारणात्मक सम्बन्ध और बल सुरक्षित हैं।
