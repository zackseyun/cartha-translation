  text: ἡ γὰρ κατὰ θεὸν λύπη μετάνοιαν εἰς σωτηρίαν ἀμεταμέλητον ⸀ἐργάζεται· ἡ δὲ τοῦ κόσμου λύπη θάνατον κατεργάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: hi
  text: क्योंकि परमेश्वर के अनुरूप शोक ऐसा मन-फिराव उत्पन्न करता है, जो उद्धार की ओर ले जाता है और जिस पर पछतावा नहीं होता[a]; पर संसार का शोक मृत्यु उत्पन्न करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उद्धार की ओर ले जाने वाला ऐसा मन-फिराव, जिस पर पछतावा नहीं होता।” यूनानी में “जिस पर पछतावा नहीं होता” सीधे “मन-फिराव” से मेल खाता है; शब्दक्रम के कारण हिन्दी में इसे उद्धार की ओर ले जाने वाले मन-फिराव के पूरे पदबंध के साथ भी पढ़ा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ θεὸν
  choice: परमेश्वर के अनुसार होने वाला
  rationale: यह यूनानी पदबंध का निकट और स्वाभाविक हिन्दी रूप है; यह शोक को परमेश्वर के अनुरूप या उसके मानदंड के अनुसार बताता है और अस्पष्टता को संप्रदायगत शब्दावली से नहीं भरता।
- source_word: λύπη
  choice: शोक
  rationale: दोनों खंडों में भावात्मक और नैतिक पीड़ा के लिए स्वाभाविक तथा गरिमापूर्ण समान शब्द है।
- source_word: μετάνοιαν
  choice: मन-फिराव
  rationale: यह केवल विचार बदलने से अधिक, व्यक्ति के भीतर और दिशा में होने वाले नैतिक-आत्मिक परिवर्तन को व्यक्त करता है; स्थापित धार्मिक अर्थ भी बनाए रखता है।
- source_word: εἰς σωτηρίαν
  choice: उद्धार की ओर ले जाता है
  rationale: εἰς के लक्ष्य या परिणाम-सूचक बल को व्यक्त करता है, पर उद्धार की कार्यविधि को आवश्यकता से अधिक परिभाषित नहीं करता।
- source_word: ἀμεταμέλητον
  choice: जिसका पछतावा नहीं होता
  rationale: विशेषण को निकटतम संज्ञा ‘मन-फिराव’ से जोड़ता है, जो यूनानी व्याकरण के अनुसार स्वाभाविक है; पाठक्रम से उत्पन्न संभावित व्यापक संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐργάζεται
  choice: उत्पन्न करता है
  rationale: क्रिया के परिणाम लाने या पैदा करने के अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: τοῦ κόσμου
  choice: संसार का
  rationale: यूनानी संबंधकारक का सीधा रूप है और ‘परमेश्वर के अनुसार’ वाले शोक के साथ विरोध बनाए रखता है।
- source_word: θάνατον
  choice: मृत्यु
  rationale: मूल पाठ की व्यापकता बनाए रखता है और इसे केवल शारीरिक, आत्मिक या अंतिम मृत्यु तक सीमित नहीं करता।
- source_word: κατεργάζεται
  choice: उत्पन्न करता है
  rationale: पहले खंड के समानांतर प्रभाव को सुरक्षित रखता है; उपसर्गयुक्त क्रिया की हल्की तीव्रता यहाँ अलग हिन्दी क्रिया की मांग नहीं करती।
theological_decisions:
- issue: दो प्रकार के शोक का विरोध
  choice: ‘परमेश्वर के अनुसार होने वाला शोक’ और ‘संसार का शोक’
  alternative: ‘ईश्वरीय शोक’ और ‘सांसारिक शोक’
  rationale: चुना हुआ रूप κατὰ θεόν की वास्तविक संरचना और संभावित अर्थ-विस्तार को अधिक स्पष्ट रखता है, जबकि विरोध भी सहज बना रहता है।
- issue: मन-फिराव और उद्धार का संबंध
  choice: ‘मन-फिराव ... जो उद्धार की ओर ले जाता है’
  alternative: ‘उद्धार के लिए मन-फिराव’ या ‘उद्धार उत्पन्न करने वाला मन-फिराव’
  rationale: यह लक्ष्य/परिणाम को व्यक्त करता है, लेकिन मन-फिराव को अपने-आप में उद्धार का अर्जक कारण बताने जैसी अतिरिक्त धर्मवैज्ञानिक धारणा नहीं जोड़ता।
- issue: ἀμεταμέλητον का संबंध
  choice: मुख्य पाठ में इसे ‘मन-फिराव’ का विशेषण माना गया है
  alternative: इसे उद्धार या मन-फिराव-से-उद्धार तक की पूरी प्रक्रिया से जोड़ना
  rationale: लिंग, वचन और कारक के अनुसार विशेषण μετάνοιαν से सीधे मेल खाता है; फिर भी शब्दक्रम के कारण व्यापक संबंध की संभावना पादटिप्पणी में दी गई है।
- issue: ‘मृत्यु’ का स्वरूप
  choice: केवल ‘मृत्यु’
  alternative: ‘आत्मिक मृत्यु’, ‘अनन्त मृत्यु’ या ‘शारीरिक मृत्यु’
  rationale: पद स्वयं मृत्यु का प्रकार निर्दिष्ट नहीं करता; अतः उसकी धर्मवैज्ञानिक व्यापकता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘मन-फिराव’ को μετάνοια के नैतिक-आत्मिक अर्थ के लिए चुना गया है; वाक्य में मूल के कारणात्मक समानांतर और धर्मवैज्ञानिक अस्पष्टता सुरक्षित रखी गई है।
