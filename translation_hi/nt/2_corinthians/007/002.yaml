base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/002.yaml
  text: Make room for us[a]. We have wronged no one, corrupted no one[b], taken advantage of no one.
translation:
  language: hi
  text: हमारे लिए जगह बनाओ।[a] हमने किसी के साथ अन्याय नहीं किया, किसी को बिगाड़ा नहीं किया,[b] और किसी का अनुचित लाभ नहीं उठाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हमारे लिए जगह बनाओ।” या, “हमें स्वीकार करो” अथवा “अपने हृदय हमारे लिए खोलो।” संभवतः यह 6:11–13 में हृदय खोलने और स्नेह में स्थान देने की बात को आगे बढ़ाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “किसी को भ्रष्ट नहीं किया,” “किसी को बरबाद नहीं किया,” अथवा “किसी का शोषण नहीं किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χωρήσατε ἡμᾶς
  choice: हमें अपने हृदय में जगह दो
  rationale: χωρέω का मूल बिंब ‘जगह देना’ है। 6:11–13 के निकट संदर्भ में यह शारीरिक स्थान नहीं, बल्कि संबंध और स्नेह में स्थान देने की अपील है। हिंदी में केवल ‘हमें जगह दो’ अस्पष्ट हो सकता है, इसलिए ‘अपने हृदय में’ जोड़कर प्रसंगगत अर्थ स्वाभाविक ढंग से व्यक्त किया गया है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: οὐδένα
  choice: किसी के…नहीं / किसी को…नहीं / किसी का…नहीं
  rationale: तीन बार आए οὐδένα की नकारात्मक पुनरावृत्ति को हिंदी की कारक-रचना के अनुसार तीनों खंडों में सुरक्षित रखा गया है।
- source_word: ἠδικήσαμεν
  choice: अन्याय नहीं किया
  rationale: ἀδικέω किसी के प्रति अन्याय करने या उसे अनुचित हानि पहुँचाने का व्यापक अर्थ रखता है। ‘अन्याय नहीं किया’ आधुनिक हिंदी में स्पष्ट और पर्याप्त रूप से व्यापक है।
- source_word: ἐφθείραμεν
  choice: भ्रष्ट नहीं किया
  rationale: φθείρω के ‘बिगाड़ना, भ्रष्ट करना, नष्ट करना’ अर्थों में यहाँ नैतिक या आत्मिक हानि का भाव संभव है। ‘भ्रष्ट नहीं किया’ इस अर्थ को व्यक्त करता है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: ἐπλεονεκτήσαμεν
  choice: लाभ नहीं उठाया
  rationale: πλεονεκτέω अपने लाभ के लिए किसी का शोषण करने, ठगने या अनुचित लाभ उठाने का अर्थ दे सकता है। ‘किसी का लाभ नहीं उठाया’ स्वाभाविक आधुनिक हिंदी है और इसे केवल आर्थिक धोखाधड़ी तक सीमित नहीं करता।
theological_decisions:
- issue: Χωρήσατε ἡμᾶς में पौलुस की अपील का स्वरूप
  choice: कुरिन्थियों से पौलुस और उसके सहकर्मियों को अपने हृदय और संबंधों में स्थान देने की अपील
  alternative: उन्हें सामान्य अर्थ में स्वीकार करने या उनका स्वागत करने की अपील
  rationale: 6:11–13 में हृदय के खुलने और स्नेह में स्थान की भाषा इस संबंधपरक अर्थ का समर्थन करती है। मुख्य पाठ में ‘हृदय’ प्रसंग को स्पष्ट करता है, जबकि पादटिप्पणी यूनानी के अधिक शाब्दिक रूप और अन्य वैध अनुवादों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सीधी और संबंधपरक भाषा रखी गई है। तीन समानांतर नकारात्मक कथनों की अलंकारिक पुनरावृत्ति सुरक्षित है। ‘अपने हृदय में’ प्रसंगगत स्पष्टता के लिए अर्थ-स्पष्टकारी विस्तार है; यूनानी का शाब्दिक बिंब पादटिप्पणी में दिया गया है।
