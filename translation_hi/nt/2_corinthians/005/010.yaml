id: 2CO.5.10
reference: 2 Corinthians 5:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: hi
  text: क्योंकि हम सबका मसीह के न्यायासन के सामने प्रकट होना आवश्यक है[a], ताकि हर एक ने देह में रहकर जो कुछ किया है[b], उसका उचित प्रतिफल पाए—चाहे भला हो या बुरा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसीह के न्यायासन के सामने उपस्थित होना आवश्यक है।” यूनानी क्रिया का अर्थ केवल उपस्थित होना भी हो सकता है, पर उसमें खुले रूप से प्रकट या उजागर किए जाने का भाव भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, “देह के द्वारा किए गए कामों के अनुसार।” यूनानी वाक्यांश देह को कार्यों का माध्यम अथवा देहधारी जीवन को उनके क्षेत्र के रूप में व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθῆναι
  choice: प्रकट होना
  rationale: यह कर्मवाच्य क्रिया केवल उपस्थित होने से अधिक, खुले रूप से सामने लाए जाने या उजागर होने का भाव रख सकती है। ‘प्रकट होना’ इस अर्थ-व्याप्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: βήματος
  choice: न्यायासन
  rationale: इस संदर्भ में βῆμα न्यायिक जाँच और निर्णय से जुड़ा आसन या मंच है। ‘न्यायासन’ संक्षिप्त, प्रतिष्ठित और स्पष्ट हिन्दी रूप है।
- source_word: Χριστοῦ
  choice: मसीह के
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उसके अभिषिक्त जन होने के अर्थ को बनाए रखता है।
- source_word: κομίσηται
  choice: उचित प्रतिफल पाए
  rationale: मध्यवाच्य रूप अपने किए के अनुरूप वापस पाने का भाव देता है। ‘उचित प्रतिफल पाए’ प्रतिदान का आशय स्पष्ट करता है, पर उसके स्वरूप को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν
  choice: देह में रहकर जो कुछ किया है, उसका उचित प्रतिफल
  rationale: यूनानी वाक्यांश संक्षिप्त है और διά देह के माध्यम से किए गए कार्यों की ओर संकेत कर सकता है। मुख्य पाठ में ‘देह में रहकर’ वर्तमान हिन्दी में समूचे देहधारी जीवन का स्वाभाविक बोध देता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἕκαστος
  choice: हर एक
  rationale: यह एक-एक व्यक्ति की जवाबदेही पर बल देने वाले वितरणात्मक एकवचन को बनाए रखता है।
- source_word: ἀγαθὸν ... φαῦλον
  choice: भला ... बुरा
  rationale: ये शब्द व्यापक नैतिक विरोध व्यक्त करते हैं। ‘भला’ और ‘बुरा’ सीधा विरोध बनाए रखते हैं और φαῦλον को हर स्थिति में अधिक तीखे ‘दुष्ट’ के अर्थ तक सीमित नहीं करते।
theological_decisions:
- issue: मसीह के सामने होने वाले मूल्यांकन का स्वरूप और दायरा
  choice: ‘न्यायासन’ और सबकी व्यक्तिगत जवाबदेही को स्पष्ट रखा गया है, पर यह निर्धारित नहीं किया गया कि यहाँ केवल विश्वासियों के पुरस्कार, समस्त मानवता का अंतिम न्याय, या किसी विशेष प्रकार का दंड अभिप्रेत है।
  alternative: इसे केवल विश्वासियों के पुरस्कारों का न्याय अथवा समस्त लोगों के अंतिम न्याय के रूप में स्पष्ट करना।
  rationale: पद सार्वभौमिक रूप से प्रकट होने और कर्मों के अनुरूप व्यक्तिगत प्रतिफल की बात करता है, लेकिन अपने आप में इस न्याय के दायरे और परिणाम से संबंधित बाद की धर्मवैज्ञानिक भिन्नताओं का निर्णय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘न्यायासन’, ‘मसीह’ और ‘प्रतिफल’ बाइबिलीय-न्यायिक संदर्भ को स्पष्ट रखते हैं; वाक्य को अत्यधिक संस्कृतनिष्ठ या संप्रदाय-विशिष्ट नहीं बनाया गया।
