base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/009.yaml
  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: hi
  text: इसलिए हम भी यह लक्ष्य रखते हैं कि, चाहे घर पर हों या घर से दूर हों, हम उसे प्रसन्न करने वाले हों।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, प्रसंग के अनुसार अधिक स्पष्ट रूप में: “चाहे शरीर में निवास कर रहे हों या शरीर से दूर हों।”'
    reason: प्रसंग में निहित पूरक को स्पष्ट करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले विचार से निष्कर्ष प्रकट करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: καὶ
  choice: भी
  rationale: यह पौलुस के कथन को पिछले प्रसंग से जोड़ता है और यूनानी के संयोजक बल को सहज रूप में रखता है।
- source_word: φιλοτιμούμεθα
  choice: इसे अपना लक्ष्य बनाते हैं
  rationale: क्रिया उत्साहपूर्वक किसी बात को अपना ध्येय बनाने का भाव देती है; यह हिन्दी में स्वाभाविक और उद्देश्यपूर्ण है।
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: चाहे घर में हों या घर से दूर
  rationale: यूनानी की संक्षिप्त 'घर में/घर से दूर' अभिव्यक्ति को बनाए रखता है और शरीर संबंधी निहित पूरक को मुख्य पाठ में नहीं जोड़ता।
- source_word: εὐάρεστοι
  choice: प्रसन्न करें
  rationale: हिन्दी में 'उसे प्रसन्न करने' का प्रयोग किसी को स्वीकार्य या प्रिय लगने का संबंधपरक अर्थ स्पष्ट और स्वाभाविक ढंग से देता है।
- source_word: αὐτῷ
  choice: उसे
  rationale: यूनानी सर्वनाम को सर्वनाम ही रखा गया है; प्रसंग में इसका संकेत प्रभु की ओर है।
- source_word: εἶναι
  choice: करें
  rationale: εὐάρεστοι εἶναι का हिन्दी मुहावरेदार रूप 'उसे प्रसन्न करें' है; शाब्दिक 'प्रसन्नकारी हों' की अपेक्षा यह अधिक सहज है।
theological_decisions:
- issue: '''घर में'' और ''घर से दूर'' के निहित पूरक को स्पष्ट करना या नहीं'
  choice: मुख्य पाठ में संक्षिप्त अभिव्यक्ति 'चाहे घर में हों या घर से दूर' रखी गई है।
  alternative: चाहे शरीर में घर पर हों या शरीर से दूर
  rationale: पद 6–8 का निकट प्रसंग शरीर में रहने और उससे दूर होकर प्रभु के साथ रहने की ओर संकेत करता है, पर इस पद में यूनानी पाठ पूरकों को स्पष्ट नहीं करता। मुख्य पाठ उसकी संक्षिप्तता और संभावित तनाव को बनाए रखता है; अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। 'इसे अपना लक्ष्य बनाते हैं' earnest aspiration को व्यक्त करता है, जबकि 'घर में/घर से दूर' मूल की संक्षिप्तता बनाए रखता है।
