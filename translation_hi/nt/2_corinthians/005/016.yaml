source:
  edition: SBLGNT
  text: Ὥστε ἡμεῖς ἀπὸ τοῦ νῦν οὐδένα οἴδαμεν κατὰ σάρκα· ⸀εἰ καὶ ἐγνώκαμεν κατὰ σάρκα Χριστόν, ἀλλὰ νῦν οὐκέτι γινώσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: hi
  text: इसलिए अब से हम किसी को भी शरीर के अनुसार नहीं जानते।[a] भले ही हमने मसीह[b] को शरीर के अनुसार जाना हो, फिर भी अब हम उन्हें इस प्रकार नहीं जानते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “शरीर के अनुसार” का अर्थ यहाँ “मानवीय दृष्टिकोण से” या “सांसारिक मानदंडों के अनुसार” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी Χριστόν; परंपरागत रूप से “ख्रीस्त।” यहाँ इसके शीर्षकीय अर्थ को बनाए रखने के लिए “मसीह” अनुवाद किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: इसलिए
  rationale: यह पिछले तर्क से निकला निष्कर्ष व्यक्त करता है और हिन्दी में स्वाभाविक तार्किक संबंध बनाए रखता है।
- source_word: ἀπὸ τοῦ νῦν
  choice: अब से
  rationale: यह वर्तमान बिंदु से आगे होने वाले निर्णायक परिवर्तन को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὐδένα οἴδαμεν
  choice: हम किसी को भी ... नहीं जानते
  rationale: οἴδαμεν का मूल अर्थ ‘जानते हैं’ बनाए रखा गया है; संदर्भ में यह किसी को समझने या उसका आकलन करने की रीति भी सूचित करता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: κατὰ σάρκα
  choice: शरीर के अनुसार
  rationale: यह पौलुस की महत्त्वपूर्ण शब्दावली और उसकी वास्तविक अर्थगत व्यापकता को सुरक्षित रखता है; यहाँ आशय केवल मानवीय या सांसारिक दृष्टिकोण हो सकता है, न कि अनिवार्य रूप से पापी स्वभाव।
- source_word: εἰ καὶ
  choice: यद्यपि
  rationale: 'प्रसंग में स्वीकारात्मक रियायत अधिक स्वाभाविक है: भूतकाल में ऐसा जानना मानकर उसके विपरीत वर्तमान स्थिति बताई गई है।'
- source_word: ἐγνώκαμεν
  choice: हमने ... जाना था
  rationale: हिन्दी का पूर्ण भूतकाल पूर्व अवस्था को वर्तमान विरोध के साथ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: Χριστόν
  choice: मसीह
  rationale: हिन्दी में ‘मसीह’ Χριστός के अभिषिक्त उद्धारकर्ता वाले पदनाम का प्रचलित और अर्थपूर्ण रूप है।
- source_word: ἀλλὰ νῦν οὐκέτι γινώσκομεν
  choice: फिर भी अब हम उन्हें इस प्रकार नहीं जानते
  rationale: यह पहले और अब के बीच प्रबल विरोध को बनाए रखता है; ‘उन्हें’ पूर्ववर्ती कर्म ‘मसीह’ से स्पष्ट है और ‘इस प्रकार’ बदली हुई जानने की रीति को व्यक्त करता है।
theological_decisions:
- issue: κατὰ σάρκα का लोगों और मसीह के संबंध में अर्थ
  choice: मुख्य पाठ में ‘शरीर के अनुसार’ रखा गया है।
  alternative: ‘मानवीय दृष्टिकोण से’ अथवा ‘सांसारिक मानदंडों के अनुसार’
  rationale: शाब्दिक रूप पौलुस की धर्मवैचारिक भाषा और तनाव को सुरक्षित रखता है। कथन मसीह की वास्तविक मानवता का निषेध नहीं करता, बल्कि उन्हें केवल मानवीय या सांसारिक श्रेणियों से जानने की अपर्याप्त रीति को छोड़ने की बात करता है।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: ‘मसीह’ आधुनिक मानक हिन्दी में पदनाम के अर्थ और बाइबलीय पहचान दोनों को स्वाभाविक रूप से संप्रेषित करता है; इसे केवल निजी नाम के रूप में अस्पष्ट नहीं किया गया।
- issue: εἰ καὶ की concessive force
  choice: यद्यपि
  alternative: भले ही
  rationale: यूनानी रचना औपचारिक रूप से दोनों अर्थ दे सकती है, पर इस प्रसंग में वास्तविक पूर्व अवस्था को स्वीकार करके वर्तमान विरोध दिखाने वाला ‘यद्यपि’ अधिक संभावित और स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘शरीर के अनुसार’ को मुख्य पाठ में बनाए रखकर मूल की पुनरावृत्ति और धर्मवैचारिक तनाव सुरक्षित किया गया है; व्याख्यात्मक विकल्प पादटिप्पणी में दिए गए हैं।
