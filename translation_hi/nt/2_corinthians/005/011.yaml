source:
  edition: SBLGNT
  text: Εἰδότες οὖν τὸν φόβον τοῦ κυρίου ἀνθρώπους πείθομεν, θεῷ δὲ πεφανερώμεθα· ἐλπίζω δὲ καὶ ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: hi
  text: इसलिए, प्रभु के भय[a] को जानते हुए, हम लोगों को विश्वास दिलाते हैं; पर हम परमेश्वर के सामने प्रकट हो चुके हैं[b], और मुझे आशा है कि तुम्हारे विवेक में भी हम प्रकट हो चुके हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रभु का भय” यहाँ प्रभु के प्रति श्रद्धामय विस्मय भी व्यक्त कर सकता है; पिछले पद में उसके न्यायासन का उल्लेख है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हम परमेश्वर के लिए प्रकट किए गए हैं”; अर्थात हमारे विषय में परमेश्वर से कुछ छिपा नहीं है। इसी क्रिया का प्रयोग आगे “तुम्हारे विवेक में” भी हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰδότες οὖν
  choice: इसलिए ... जानते हुए
  rationale: οὖν पिछले पद के न्यायासन-संदर्भ से निष्कर्ष जोड़ता है, और कृदंत Εἰδότες की वर्तमान-अर्थ वाली सहभागी संरचना को ‘जानते हुए’ बनाए रखता है।
- source_word: τὸν φόβον τοῦ κυρίου
  choice: प्रभु के भय
  rationale: ‘भय’ न्यायासन के निकट संदर्भ में उत्तरदायित्व और श्रद्धामय विस्मय दोनों की संभावना बनाए रखता है; केवल ‘श्रद्धा’ कहना इसकी तीव्रता घटा सकता है।
- source_word: ἀνθρώπους πείθομεν
  choice: हम लोगों को समझाते हैं
  rationale: ‘लोगों’ से ἀνθρώπους का सामान्य, सभी मनुष्यों को समेटने वाला अर्थ आता है। ‘समझाते हैं’ πείθω के मनाने/विश्वास दिलाने के प्रयत्न को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना सफलता को अनिवार्य बताए।
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: पर हम परमेश्वर के सामने पूरी तरह प्रकट हैं
  rationale: पूर्णकालिक कर्मवाच्य रूप के परिणामस्वरूप वर्तमान में खुले और ज्ञात होने का भाव है। ‘सामने’ हिन्दी में दत्तिव के संबंध को स्वाभाविक बनाता है; ‘पूरी तरह प्रकट’ चरित्र और सेवा के परमेश्वर से न छिपे होने को व्यक्त करता है।
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν
  choice: तुम्हारे विवेकों में
  rationale: यूनानी बहुवचन को बनाए रखा गया है, क्योंकि पौलुस कुरिन्थियों की व्यक्तिगत आंतरिक नैतिक चेतना की ओर संकेत करता है।
- source_word: πεφανερῶσθαι
  choice: पूरी तरह प्रकट हैं
  rationale: पूर्णकालिक अनन्तरूप का परिणामकारी भाव स्वाभाविक हिन्दी में मुख्य क्रिया के पूरक के रूप में व्यक्त किया गया है; इससे परमेश्वर वाले पूर्ववर्ती समानान्तर पदबंध की पुनरावृत्ति भी बनी रहती है।
theological_decisions:
- issue: ‘प्रभु के भय’ का आशय
  choice: ‘भय’ को मुख्य पाठ में बनाए रखा गया
  alternative: ‘प्रभु के प्रति श्रद्धामय भय’ या ‘प्रभु के प्रति श्रद्धा’
  rationale: 5:10 के न्यायासन-संदर्भ में यह पद केवल आदर नहीं, बल्कि प्रभु के सामने उत्तरदायित्व भी व्यक्त कर सकता है। मुख्य पाठ व्यापक और परंपरागत अभिव्यक्ति रखता है; पादटिप्पणी श्रद्धामय विस्मय की संभावना बताती है।
- issue: φανερόω का परमेश्वर और कुरिन्थियों से संबंध
  choice: ‘पूरी तरह प्रकट हैं’
  alternative: ‘जाने गए हैं’ या ‘प्रकट किए गए हैं’
  rationale: इससे पौलुस और उसके सहकर्मियों के वास्तविक चरित्र/सेवा का परमेश्वर के सामने खुला होना और कुरिन्थियों के विवेक में भी वैसा पहचाना जाना व्यक्त होता है, बिना किसी अतिरिक्त धर्मसैद्धांतिक निष्कर्ष के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘तुम्हारे’ मूल पाठ के बहुवचन संबोधन को दर्शाता है। ‘विवेकों’ का कुछ असामान्य बहुवचन स्रोत की व्याकरणिक सटीकता और प्रत्येक श्रोता की अंतरात्मा पर बल बनाए रखने के लिए रखा गया है।
