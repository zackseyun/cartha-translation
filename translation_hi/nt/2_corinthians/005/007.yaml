lexical_decisions:
- source_word: διὰ πίστεως
  choice: विश्वास के आधार पर
  rationale: διά के साथ संबंधकारक यहाँ साधन या जीवन-निर्देशक आधार व्यक्त करता है। ‘विश्वास के आधार पर’ आधुनिक हिन्दी में स्वाभाविक है और πίστις का सामान्य अर्थ ‘विश्वास’ बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: περιπατοῦμεν
  choice: हम ... चलते हैं
  rationale: περιπατέω के ‘चलना’ रूपक को सुरक्षित रखा गया है; प्रसंग में इसका आशय जीवन बिताने या आचरण करने से है, पर रूपक सामान्य पाठक के लिए बोधगम्य है।
- source_word: οὐ διὰ εἴδους
  choice: जो दिखाई देता है उसके आधार पर नहीं
  rationale: εἶδος दृश्य रूप, बाहरी स्वरूप या दिखाई देनेवाली वस्तुस्थिति का बोध करा सकता है। यह चयन ‘विश्वास’ के साथ विरोध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अर्थ को केवल शारीरिक दृष्टि तक सीमित किए।
theological_decisions:
- issue: पौलुस के कथन में πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: यहाँ πίστις का विरोध εἶδος, अर्थात दिखाई देनेवाली वास्तविकता, से है। इसलिए ‘विश्वास’ सबसे उपयुक्त व्यापक अर्थ देता है; ‘विश्वासयोग्यता’ इस संदर्भ में अनावश्यक रूप से नैतिक गुण की ओर संकेत करेगी।
- issue: εἶδος को केवल ‘दृष्टि’ मानना या दृश्य रूप/दिखाई देनेवाली बात के अर्थ में रखना
  choice: जो दिखाई देता है
  alternative: दृष्टि; बाहरी रूप; दृश्य रूप
  rationale: यूनानी शब्द में दृश्य रूप या दिखाई देनेवाली वस्तुस्थिति की अर्थ-छाया है। मुख्य पाठ व्यापकता को बनाए रखता है और विश्वास बनाम वर्तमान दृश्य अनुभव का तनाव सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चलते हैं’ का मूल रूपक सुरक्षित है। अंतिम डैश अगले पद से वाक्य के निकट संबंध को दर्शाता है।
