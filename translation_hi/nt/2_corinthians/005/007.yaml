  text: क्योंकि हम विश्वास से चलते हैं, न कि दृश्य रूप के आधार पर[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दृष्टि के आधार पर नहीं,’ ‘बाहरी रूप के आधार पर नहीं,’ अथवा ‘जो दिखाई देता है उसके आधार पर नहीं।’ यूनानी शब्द दृश्य रूप, बाहरी स्वरूप, या दिखाई देनेवाली वस्तुस्थिति का बोध करा सकता है।
