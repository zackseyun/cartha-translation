translation:
  language: hi
  text: क्योंकि हम इसमें कराहते हैं, और स्वर्ग से आनेवाले अपने निवास को पहन लेने की लालसा रखते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पहन लेने’ के लिए प्रयुक्त यूनानी क्रिया में किसी वस्त्र के ऊपर दूसरा वस्त्र पहनने का भाव हो सकता है। यहाँ पौलुस ‘निवास’ और ‘वस्त्र’ के रूपकों को एक साथ प्रयोग करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि
  rationale: यह पद पिछले कथन की व्याख्या करता है। हिन्दी में “क्योंकि” इस संबंध को स्वाभाविक रूप से व्यक्त करता है; καί का हल्का बल पूरे वाक्य के प्रवाह में समाहित है।
- source_word: ἐν τούτῳ
  choice: इसमें
  rationale: मूल का संकेतवाचक पद अस्पष्ट है और संभवतः वर्तमान देहगत दशा की ओर संकेत करता है। “इसमें” उस अस्पष्टता को बनाए रखता है और मुख्य पाठ में “इस तम्बू में” जोड़कर अर्थ सीमित नहीं करता।
- source_word: στενάζομεν
  choice: हम कराहते हैं
  rationale: यह शब्द बोझ और गहरी अभिलाषा से निकली आंतरिक कराह को व्यक्त करता है; “कराहते हैं” आधुनिक हिन्दी में सशक्त और सहज है।
- source_word: τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ
  choice: स्वर्ग से मिलनेवाले अपने निवास
  rationale: “निवास” οἰκητήριον के रहने के स्थान वाले रूपक को बनाए रखता है। “स्वर्ग से मिलनेवाले” ἐξ οὐρανοῦ में निहित उद्गम को स्वाभाविक हिन्दी में व्यक्त करता है, न कि केवल निवास के गुण को।
- source_word: ἐπενδύσασθαι
  choice: ऊपर से पहन लेने
  rationale: क्रिया में पहले से पहने हुए वस्त्र के ऊपर दूसरा वस्त्र पहनने का भाव हो सकता है। “ऊपर से पहन लेने” उस विशिष्ट सूक्ष्मता को स्पष्ट रखते हुए वस्त्र-रूपक को सुरक्षित रखता है।
- source_word: ἐπιποθοῦντες
  choice: लालसा रखते हैं
  rationale: यह कृदंत तीव्र और निरंतर इच्छा व्यक्त करता है। “लालसा रखते हैं” गरिमापूर्ण तथा सामान्य आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: स्वर्गीय देह अथवा निवास के रूपक का आशय
  choice: निवास और वस्त्र—दोनों परस्पर जुड़े रूपकों को बनाए रखा गया है और इसे किसी एक व्यवस्थित धर्मवैज्ञानिक व्याख्या तक सीमित नहीं किया गया।
  alternative: इसे स्पष्ट रूप से “पुनरुत्थान की देह” या “स्वर्गीय घर” कहना।
  rationale: पद स्वयं “निवास” और “पहनने” की छवियों को साथ रखता है, पर यह अकेला पद मध्यवर्ती अवस्था, पुनरुत्थान की देह या अंतिम स्वर्गीय निवास में से किसी एक को स्पष्टतः निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज पर गरिमापूर्ण। “इसमें” मूल की संदर्भगत अस्पष्टता बनाए रखता है; “स्वर्ग से मिलनेवाले” उद्गम का भाव स्पष्ट करता है; और “ऊपर से पहन लेने” असामान्य किंतु महत्त्वपूर्ण वस्त्र-रूपक को सुरक्षित रखता है।
