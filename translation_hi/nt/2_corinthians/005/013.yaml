  source_fidelity: The draft preserves the explanatory force of γάρ, the paired conditional alternatives, and the concise dative clauses (‘परमेश्वर के लिए’ / ‘तुम्हारे लिए’). However, ‘अपने होश में नहीं हैं’ can ordinarily mean unconscious in modern Hindi, which is not the sense of ἐξέστημεν here.
  naturalness: ‘स्वस्थ मन के हैं’ is understandable but somewhat clinical and less idiomatic in this rhetorical contrast. ‘अपने आपे में नहीं हैं’ and ‘समझ-बूझ से काम लेते हैं’ are natural modern Hindi and retain the contrast without asserting literal insanity or unconsciousness.
  terminology: ‘परमेश्वर’ is appropriate for θεῷ in this register. The revised renderings preserve the rhetorical ambiguity of ἐξέστημεν and the practical sound-mindedness denoted by σωφρονοῦμεν.
