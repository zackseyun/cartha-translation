  text: क्योंकि यदि हम अपने आपे में नहीं हैं[a], तो परमेश्वर के लिए हैं; और यदि हम समझ-बूझ से काम लेते हैं[b], तो तुम्हारे लिए हैं।
  philosophy: optimal-equivalence
