lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: यदि ... और यदि
  rationale: दोनों वैकल्पिक स्थितियों को स्पष्ट रखते हुए हिन्दी में संक्षिप्त और स्वाभाविक समानांतर रचना बनती है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करनेवाले संयोजक का बल बनाए रखता है।
- source_word: ἐξέστημεν
  choice: हम अपने होश में नहीं हैं
  rationale: यह मन की सामान्य अवस्था से बाहर होने या दूसरों को असामान्य प्रतीत होने का अर्थ सहज आधुनिक हिन्दी में देता है, पर वास्तविक पागलपन अथवा किसी तकनीकी प्रकार की धार्मिक भावावस्था को निश्चित नहीं करता।
- source_word: θεῷ
  choice: परमेश्वर के लिए
  rationale: संक्षिप्त दत्तिव पद को हित अथवा अभिमुखता के अर्थ में प्रस्तुत करता है और मूल की संक्षिप्तता बनाए रखता है।
- source_word: σωφρονοῦμεν
  choice: हम स्वस्थ मन के हैं
  rationale: यह समझदारी और संतुलित मानसिक दशा व्यक्त करता है तथा ἐξέστημεν के साथ मूल विरोध को बनाए रखता है।
- source_word: ὑμῖν
  choice: तुम्हारे लिए
  rationale: दत्तिव को कुरिन्थियों के हित के अर्थ में स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पौलुस के परस्पर-विरोधी आत्मवर्णन का आशय
  choice: वचन ऐसे आचरण के बीच विरोध बनाए रखता है जो होश से बाहर प्रतीत हो सकता है और ऐसे आचरण के बीच जो समझदार तथा संतुलित दिखाई देता है; यह वास्तविक पागलपन को निश्चित नहीं करता।
  alternative: इसे वास्तविक धार्मिक भावावेश का वर्णन या केवल विरोधियों के आरोप का अतिशयोक्तिपूर्ण उल्लेख माना जा सकता है।
  rationale: यूनानी कथन आलंकारिक और संक्षिप्त है। अनुवाद किसी एक व्याख्या को आरोपित किए बिना उसका तीखा विरोध और धर्मवैचारिक तनाव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमामय किंतु सामान्य पाठक के लिए सहज। ‘स्वस्थ मन’ को ‘होश में नहीं’ के स्पष्ट विरोध के लिए चुना गया है। पद की संक्षिप्त, समानांतर संरचना सुरक्षित रखी गई है।
