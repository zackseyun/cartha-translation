translation:
  language: hi
  text: यदि सचमुच[a], पहन लेने के बाद, हम नंगे नहीं पाए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि सचमुच, वस्त्र पहन लेने के बाद, हम वस्त्रहीन नहीं पाए जाएँगे।”
    reason: ‘नंगे’ के स्थान पर ‘वस्त्रहीन’ सम्भव शब्दगत विकल्प है; ‘वस्त्र पहन लेने’ ἐνδυσάμενοι के ‘पहन लेने’ वाले अर्थ को स्पष्ट करता है, बिना रूपक का धर्मवैज्ञानिक आशय निश्चित किए।
lexical_decisions:
- source_word: εἴ γε
  choice: यदि सचमुच
  rationale: यह अनुवाद εἰ की शर्त और γε के बल—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: καὶ ἐνδυσάμενοι
  choice: पहन लेने पर
  rationale: मध्यवाच्य कृदन्त का मूल भाव ‘पहन लेना’ है; ‘पर’ उस क्रिया और भावी मुख्य क्रिया का पूर्वकालिक/परिस्थितिजन्य संबंध संक्षेप में व्यक्त करता है। वस्तु को स्पष्ट न करके यूनानी पाठ की अंतर्निहितता बनाए रखी गई है।
- source_word: οὐ
  choice: नहीं
  rationale: यह भावी निष्क्रिय क्रिया का सामान्य निषेध है।
- source_word: γυμνοὶ
  choice: नंगे
  rationale: यह γυμνός का सीधा अर्थ है और वस्त्र पहनने के रूपक को बनाए रखता है; ‘वस्त्रहीन’ सम्भव विकल्प है।
- source_word: εὑρεθησόμεθα
  choice: हम ... पाए जाएँगे
  rationale: भावी निष्क्रिय रूप को हिन्दी में स्वाभाविक निष्क्रिय अभिव्यक्ति से प्रस्तुत किया गया है।
theological_decisions:
- issue: वस्त्र पहनने और नंगे होने के रूपक का आशय
  choice: रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: ‘नंगा’ को देह-विहीन मध्यवर्ती अवस्था, स्वर्गीय देह के अभाव, या परमेश्वर के सामने लज्जा के निश्चित संकेत के रूप में स्पष्ट करना।
  rationale: इस पद में यूनानी पाठ रूपक के पूर्ण धर्मवैज्ञानिक आशय को निर्धारित नहीं करता; इसलिए अनुवाद उसकी वास्तविक अस्पष्टता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘पहन लेने पर’ से मूल मध्यवाच्य रूप सुरक्षित रहता है और संदर्भ से वस्तु समझे जाने दी जाती है।
