id: 2CO.5.4
reference: 2 Corinthians 5:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι ἐφ’ ᾧ οὐ θέλομεν ἐκδύσασθαι ἀλλ’ ἐπενδύσασθαι, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/004.yaml
  text: For indeed[a], while we are in this tent, we groan, being burdened, because we do not want to be unclothed but to be further clothed[b], so that what is mortal may be swallowed up by life.
translation:
  language: hi
  text: क्योंकि सचमुच, जब तक हम इस तंबू में हैं, हम बोझ से दबे हुए कराहते हैं; क्योंकि हम वस्त्रहीन होना नहीं, बल्कि ऊपर से वस्त्र पहनना चाहते हैं[a], ताकि जो नश्वर है[b], वह जीवन के द्वारा निगल लिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वस्त्र पहनना।” यूनानी क्रिया पहले से पहने हुए वस्त्र के ऊपर एक और वस्त्र पहनने का संकेत देती है।
    reason: lexical_alternative
  - marker: b
    text: या, “नश्वर” अथवा “नश्वरता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि सचमुच
  rationale: ‘क्योंकि’ पिछले कथन से व्याख्यात्मक संबंध और ‘सचमुच’ बलाघात को व्यक्त करता है।
- source_word: σκήνει
  choice: तंबू
  rationale: यह वर्तमान शारीरिक अस्तित्व का रूपक है; ‘तंबू’ पौलुस के चित्र और आसपास के प्रसंग से संबंध को बनाए रखता है।
- source_word: στενάζομεν
  choice: हम ... कराहते हैं
  rationale: ‘कराहते हैं’ बोझ और भावी परिवर्तन की गहरी लालसा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βαρούμενοι
  choice: बोझ से दबे हुए
  rationale: यह कृदंत कराहने के साथ जुड़ी अवस्था या कारण बताता है और मूल के कर्मवाच्य भाव को बनाए रखता है।
- source_word: ἐφ’ ᾧ
  choice: क्योंकि
  rationale: यहाँ यह पदबंध कराहने का कारण प्रस्तुत करता जान पड़ता है; हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: ἐκδύσασθαι
  choice: वस्त्रहीन होना
  rationale: यह अनुवाद वस्त्र के रूपक को बनाए रखता है और किसी विशिष्ट मध्यवर्ती अवस्था को स्पष्ट रूप से आरोपित नहीं करता।
- source_word: ἐπενδύσασθαι
  choice: अपने ऊपर और वस्त्र पहनना
  rationale: यौगिक क्रिया पहले से पहने हुए वस्त्र के ऊपर एक और वस्त्र पहनने का संकेत देती है; यह वाक्यांश उस अतिरिक्त या आवरणात्मक भाव को स्पष्ट रखता है।
- source_word: καταποθῇ
  choice: निगल लिया जाए
  rationale: यह मूल के सजीव रूपक और नश्वरता पर जीवन की पूर्ण विजय को बनाए रखता है।
- source_word: τὸ θνητόν
  choice: जो नश्वर है
  rationale: नपुंसकलिंग विशेषण यहाँ संज्ञा की तरह प्रयुक्त है; यह चयन संदर्भ को केवल अमूर्त ‘नश्वरता’ तक सीमित नहीं करता।
- source_word: ζωῆς
  choice: जीवन
  rationale: ‘जीवन’ नश्वरता के साथ मूल विरोध को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: पौलुस का वस्त्र-रूपक और मध्यवर्ती अवस्था
  choice: ‘वस्त्रहीन होना’ और ‘अपने ऊपर और वस्त्र पहनना’—दोनों रूपकों को किसी निश्चित धर्मसैद्धांतिक योजना में बदले बिना बनाए रखा गया है।
  alternative: ‘वस्त्रहीन’ को स्पष्टतः देहरहित अस्तित्व और ‘ऊपर से वस्त्र पहनना’ को केवल पुनरुत्थान की देह के रूप में व्याख्यायित करना।
  rationale: यूनानी पाठ शारीरिक अस्तित्व और भावी परिवर्तन के विषय में रूपकात्मक भाषा का प्रयोग करता है। अनुवाद विवादित प्रश्नों को पाठ से आगे जाकर हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘तंबू,’ ‘वस्त्रहीन’ और ‘निगल लिया जाए’ जैसे प्रमुख रूपकों को समतल व्याख्या में बदलने के बजाय सुरक्षित रखा गया है। परामर्श-पाठ में फुटनोट चिह्नों का स्थान उनकी सामग्री से मेल नहीं खाता था; हिन्दी मसौदे में [a] को ἐπενδύσασθαι और [b] को τὸ θνητόν के साथ रखा गया है।
