review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the tent and clothing metaphors, the burdened groaning, the purpose clause, and the broad substantival force of τὸ θνητόν. The causal force of καὶ γὰρ and ἐφ’ ᾧ is adequately represented by ‘क्योंकि’ in each respective context.
  naturalness: ‘अपने ऊपर और वस्त्र पहनना’ is understandable but is not idiomatic modern Hindi. ‘ऊपर से वस्त्र पहनना’ naturally expresses the over-clothing imagery. The remaining phrasing is clear and suitably dignified.
  terminology: ‘तंबू,’ ‘वस्त्रहीन,’ ‘नश्वर,’ and ‘जीवन’ appropriately retain the passage’s central imagery and theological openness. The footnote alternative ‘नश्वर तत्व’ is unnecessarily interpretive and less faithful than alternatives based directly on the Greek adjective.
  issues:
  - severity: medium
    issue: The wording ‘अपने ऊपर और वस्त्र पहनना’ is awkward.
    rationale: It can sound as though one puts clothing upon oneself in a redundant sense, rather than expressing the Greek compound verb ἐπενδύσασθαι, to put clothing on over what is already worn.
  - severity: low
    issue: Footnote [b] offers ‘नश्वर तत्व’ as an alternative.
    rationale: ‘तत्व’ introduces an abstract metaphysical sense not present in τὸ θνητόν. ‘नश्वर’ or ‘नश्वरता’ preserves the lexical ambiguity without added interpretation.
  revised_text: क्योंकि सचमुच, जब तक हम इस तंबू में हैं, हम बोझ से दबे हुए कराहते हैं; क्योंकि हम वस्त्रहीन होना नहीं, बल्कि ऊपर से वस्त्र पहनना चाहते हैं[a], ताकि जो नश्वर है[b], वह जीवन के द्वारा निगल लिया जाए।
