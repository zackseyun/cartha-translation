  to: क्योंकि सचमुच, जब तक हम इस तंबू में हैं, हम बोझ से दबे हुए कराहते हैं; क्योंकि हम वस्त्रहीन होना नहीं, बल्कि ऊपर से वस्त्र पहनना चाहते हैं[a], ताकि जो नश्वर है[b], वह जीवन के द्वारा निगल लिया जाए।
