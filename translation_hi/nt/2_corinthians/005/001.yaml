source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ, οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: hi
  text: क्योंकि हम जानते हैं कि यदि हमारा पार्थिव तम्बू-घर ढह जाए[a], तो हमारे पास परमेश्वर की ओर से एक भवन है[c]—ऐसा घर जो हाथों से बना हुआ नहीं है[b], जो स्वर्गों में है और अनन्त है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नष्ट हो जाए” अथवा “खोल दिया जाए”; यूनानी क्रिया किसी ढाँचे के ढहने या तम्बू के खोल दिए जाने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “ऐसा घर जो मनुष्य के हाथों से नहीं बनाया गया।” यह अभिव्यक्ति उसके मानवीय नहीं, बल्कि दैवी मूल पर बल देती है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में “हमारे पास है” वर्तमान काल में है, “हमारे पास होगा” नहीं; इससे वर्तमान अधिकार और भावी साकारता के बीच का तनाव बना रहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδαμεν γὰρ
  choice: क्योंकि हम जानते हैं
  rationale: οἴδαμεν निश्चित ज्ञान व्यक्त करता है, और γάρ पिछले तर्क का कारण या आधार बताता है; यह हिन्दी में दोनों अर्थ स्वाभाविक रूप से रखता है।
- source_word: ἐὰν ... καταλυθῇ
  choice: यदि ... गिरा दिया जाए
  rationale: यह भविष्य की सम्भावना व्यक्त करता है। καταλύω किसी ढाँचे को गिराने या खोल देने के लिए प्रयुक्त हो सकता है; 'गिरा दिया जाए' घर और तम्बू, दोनों बिम्बों के अनुकूल है।
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: हमारा धरती का तम्बू-घर
  rationale: यूनानी पदबंध में οἰκία ('घर') और σκῆνος ('तम्बू') दोनों बिम्ब मौजूद हैं। 'तम्बू-घर' उन्हें केवल 'शरीर' कहकर व्याख्यायित करने के बजाय दोनों को बनाए रखता है।
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: परमेश्वर की ओर से एक भवन
  rationale: οἰκοδομή यहाँ किसी निर्मित संरचना का ठोस अर्थ देता है, और ἐκ θεοῦ उसके परमेश्वर से आने या उद्भूत होने को व्यक्त करता है।
- source_word: ἔχομεν
  choice: हमारे पास ... है
  rationale: यूनानी क्रिया वर्तमान काल में है। हिन्दी वर्तमान काल को बनाए रखती है और इसे 'होगा' बनाकर भविष्य तक सीमित नहीं करती।
- source_word: οἰκίαν ἀχειροποίητον
  choice: ऐसा घर जो हाथों से बनाया हुआ नहीं है
  rationale: यह ἀχειροποίητος का निकट, समझने योग्य अनुवाद है और दैवी बनाम मानवीय निर्माण की बाइबलीय प्रतिध्वनि को बनाए रखता है।
- source_word: αἰώνιον
  choice: अनन्त
  rationale: यह धरती के अस्थायी निवास के विपरीत उस घर की स्थायी, अनन्त प्रकृति को व्यक्त करता है।
- source_word: ἐν τοῖς οὐρανοῖς
  choice: स्वर्गों में
  rationale: यूनानी संज्ञा बहुवचन में है; हिन्दी में 'स्वर्गों में' उसी रूप को सुरक्षित रखता है।
theological_decisions:
- issue: निवास-सम्बन्धी बिम्ब का आशय
  choice: मुख्य पाठ में घर, तम्बू और भवन के बिम्ब बनाए गए हैं।
  alternative: बिम्बों के स्थान पर सीधे 'शरीर' कहना।
  rationale: मूल पाठ स्वयं शरीर नहीं कहता, बल्कि परस्पर जुड़े स्थापत्य और तम्बू के बिम्बों का प्रयोग करता है। सीधे 'शरीर' कहना व्याख्या को अनुवाद में मिला देता।
- issue: ἔχομεν का कालगत अर्थ
  choice: 'वर्तमान काल: ''हमारे पास ... है''।'
  alternative: 'भविष्य काल: ''हमारे पास ... होगा''।'
  rationale: यूनानी में वर्तमान काल है। इससे वर्तमान अधिकार और भावी साकारता के बीच जो तनाव बनता है, उसे अनुवाद में खुला रखा गया है।
- issue: ἀχειροποίητον का धार्मिक संकेत
  choice: '''हाथों से बनाया हुआ नहीं'' कहकर मूल अभिव्यक्ति सुरक्षित रखी गई है।'
  alternative: '''मानव-निर्मित नहीं'' कहकर अर्थ को स्पष्ट करना।'
  rationale: चुनी हुई भाषा मूल के ठोस बिम्ब और उसके व्यापक बाइबलीय अनुनाद को बनाए रखती है, बिना किसी विशेष सिद्धान्त को थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। 'तम्बू-घर' कुछ असामान्य होते हुए भी मूल यूनानी के जानबूझकर मिश्रित बिम्ब को स्पष्ट और संक्षिप्त ढंग से सुरक्षित रखता है।
