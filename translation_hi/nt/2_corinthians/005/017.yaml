id: 2CO.5.17
reference: 2 Corinthians 5:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὥστε εἴ τις ἐν Χριστῷ, καινὴ κτίσις· τὰ ἀρχαῖα παρῆλθεν, ἰδοὺ γέγονεν ⸀καινά·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: hi
  text: इसलिए, यदि कोई मसीह में है, तो नई सृष्टि है[a]; पुरानी बातें बीत गईं; देखो[b], नई बातें आ गई हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह नई सृष्टि है।” यूनानी वाक्य संक्षिप्त और क्रियारहित है; शाब्दिक रूप से, “यदि कोई मसीह में—नई सृष्टि।”
    reason: alternative_reading
  - marker: b
    text: अनेक अनुवादों में है, “सब कुछ नया हो गया है।” यहाँ SBLGNT के पाठ में स्पष्ट रूप से “सब कुछ” नहीं, बल्कि केवल “नई बातें” है।
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले तर्क से निकला निष्कर्ष व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: εἴ τις
  choice: यदि कोई
  rationale: अनिश्चित और सर्वसमावेशी शर्त को बिना अनावश्यक लैंगिक विशेषता के व्यक्त करता है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: Χριστός की उपाधिगत, मसीहाई अर्थवत्ता और पौलुस की संघ-संबंधी अभिव्यक्ति दोनों को बनाए रखता है।
- source_word: καινὴ κτίσις
  choice: तो नई सृष्टि है
  rationale: यूनानी वाक्यांश क्रियारहित और संक्षिप्त है। यह अनुवाद व्यक्ति को ही एकमात्र व्याकरणिक विषय ठहराए बिना उसकी संक्षिप्तता और व्यापक नई-सृष्टि की संभावना को सुरक्षित रखता है।
- source_word: τὰ ἀρχαῖα
  choice: पुरानी बातें
  rationale: नपुंसकलिंग बहुवचन विशेषण के संज्ञात्मक प्रयोग और उसके व्यापक दायरे को दर्शाता है।
- source_word: παρῆλθεν
  choice: बीत गईं
  rationale: घटित परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है; बहुवचन कर्ता के अनुसार हिन्दी में सहमति रखी गई है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले उद्गार का स्पष्ट, गरिमापूर्ण और आधुनिक हिन्दी रूप है।
- source_word: γέγονεν καινά
  choice: नई बातें आ गई हैं
  rationale: पूर्णकाल से सूचित वर्तमान परिणामी अवस्था और καινά के नपुंसकलिंग बहुवचन को व्यक्त करता है; पाठ में अनुपस्थित ‘सब’ नहीं जोड़ा गया।
theological_decisions:
- issue: Χριστῷ को उपाधि के रूप में या नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह में
  alternative: ख्रीस्त में / क्राइस्ट में
  rationale: यहाँ मसीहाई उपाधि अर्थपूर्ण है; ‘मसीह’ मानक हिन्दी बाइबलीय प्रयोग में भी स्वाभाविक और बोधगम्य है।
- issue: क्रियारहित καινὴ κτίσις की पूर्ति
  choice: तो नई सृष्टि है
  alternative: वह नई सृष्टि है
  rationale: यूनानी में स्पष्ट कर्ता और क्रिया नहीं हैं। मुख्य पाठ कम प्रतिबंधित रूप रखता है, जबकि व्यक्तिकेंद्रित व्याख्या पादटिप्पणी में दी गई है।
- issue: γέγονεν καινά में ‘सब कुछ’ जोड़ना या न जोड़ना
  choice: नई बातें आ गई हैं
  alternative: सब कुछ नया हो गया है
  rationale: दिए गए SBLGNT पाठ में καινά बहुवचन है, पर ‘सब कुछ’ के लिए कोई स्पष्ट शब्द नहीं है; इसलिए उसका विस्तार मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और पाठ के निकट शैली रखी गई है। ‘नई सृष्टि’ की वास्तविक व्याकरणिक और धर्मवैचारिक अस्पष्टता को मुख्य पाठ तथा पादटिप्पणी के माध्यम से सुरक्षित रखा गया है।
