id: 2CO.5.20
reference: 2 Corinthians 5:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: hi
  text: 'इसलिए हम मसीह[a] की ओर से राजदूत हैं, मानो परमेश्वर हमारे द्वारा विनती कर रहा हो। हम मसीह की ओर से आपसे विनती करते हैं: परमेश्वर से मेल कर लीजिए[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मसीह” यूनानी पदवी Χριστός का स्थापित हिन्दी रूप है; इसका अर्थ “अभिषिक्त” है। इसे “ख्रीस्त” भी कहा जाता है।
    reason: title_clarification
  - marker: b
    text: यूनानी क्रिया कर्मवाच्य आदेश है। हिन्दी में उसका ठीक-ठीक कर्मवाच्य रूप असहज है; “परमेश्वर के साथ मेल कर लीजिए” भी संभव है।
    reason: grammatical_and_lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: मसीह की ओर से
  rationale: संबंधकारक के साथ ὑπέρ यहाँ प्रतिनिधित्व का भाव देता है—‘की ओर से’। Χριστός के लिए प्रचलित और अर्थपूर्ण हिन्दी पदवी ‘मसीह’ स्वाभाविक है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले निष्कर्ष को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: πρεσβεύομεν
  choice: हम ... राजदूत हैं
  rationale: क्रिया का अर्थ राजदूत या प्रतिनिधि के रूप में कार्य करना है; यह रूप वर्तमान और प्रतिनिधिक भूमिका दोनों को सहजता से व्यक्त करता है।
- source_word: ὡς
  choice: मानो
  rationale: यह परमेश्वर के प्रेरितों द्वारा विनती करने को तुलनात्मक ढंग से प्रस्तुत करता है और मूल की तुलना को सुरक्षित रखता है।
- source_word: παρακαλοῦντος
  choice: विनती कर रहा हो
  rationale: मेल-मिलाप के प्रसंग में यह आग्रहपूर्ण अपील का भाव देता है; ‘विनती’ उसकी गंभीर और आमंत्रणात्मक ध्वनि को व्यक्त करती है।
- source_word: δι’ ἡμῶν
  choice: हमारे द्वारा
  rationale: संबंधकारक के साथ διά माध्यम या अभिकरण बताता है; हिन्दी में ‘हमारे द्वारा’ स्वाभाविक रूप से व्यक्त करता है कि परमेश्वर उनके माध्यम से अपील करता है।
- source_word: δεόμεθα
  choice: हम ... आग्रह करते हैं
  rationale: यह गंभीर अनुरोध को दर्शाता है। ‘आग्रह करते हैं’ आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है।
- source_word: καταλλάγητε
  choice: मेल कर लो
  rationale: यह आदेशात्मक अभिव्यक्ति मेल-मिलाप स्वीकार करने का आह्वान करती है। हिन्दी का मुहावरा स्वाभाविक है, यद्यपि यूनानी का व्याकरणिक कर्मवाच्य हिन्दी में ठीक उसी रूप में सहज नहीं बैठता।
- source_word: τῷ θεῷ
  choice: परमेश्वर से
  rationale: καταλλάσσω के साथ चतुर्थी को हिन्दी में संबंधपरक मेल-मिलाप के लिए स्वाभाविक रूप से ‘से’ कहा जाता है; ‘परमेश्वर के साथ’ भी संभव है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: ‘मसीह’ हिन्दी में Χριστός की पदवी का स्थापित अर्थपूर्ण रूप है और इसे केवल निजी नाम की तरह नहीं बनाता।
- issue: मेल-मिलाप में वाच्य और अभिकरण
  choice: परमेश्वर से मेल कर लो
  alternative: परमेश्वर से मेल-मिलाप होने दो
  rationale: पहला रूप आधुनिक हिन्दी में स्पष्ट और प्रभावी आदेश है; पादटिप्पणी बताती है कि यूनानी रूप कर्मवाच्य है, जिससे परमेश्वर की पहल और सुनने वालों को दिए आदेश के बीच का तनाव सुरक्षित रहता है।
- issue: τῷ θεῷ का संबंध
  choice: परमेश्वर से
  alternative: परमेश्वर के साथ
  rationale: दोनों हिन्दी रूप संबंधपरक मेल को व्यक्त कर सकते हैं। मुख्य पाठ में अधिक मुहावरेदार ‘से’ रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘राजदूत’, ‘विनती’ और ‘आग्रह’ मूल के प्रतिनिधिक तथा गंभीर स्वर को बनाए रखते हैं।
