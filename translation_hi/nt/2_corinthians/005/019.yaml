reference: 2 Corinthians 5:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὡς ὅτι θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/019.yaml
  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: hi
  text: अर्थात्, परमेश्वर मसीह में था और संसार का अपने साथ मेल करा रहा था[a]—वह उनके अपराधों का लेखा उनके विरुद्ध नहीं रख रहा था—और उसने मेल-मिलाप का संदेश हमें सौंप दिया[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसीह में परमेश्वर संसार का अपने साथ मेल करा रहा था।”
    reason: यूनानी वाक्य-विन्यास परमेश्वर के ‘मसीह में’ होने और संसार का मेल कराने की क्रिया के संबंध को निकट रखता है; हिन्दी में दोनों विन्यास संभव हैं।
  - marker: b
    text: शाब्दिक रूप से, “हममें रख दिया”; इसका अर्थ “हमारे बीच रख दिया” भी हो सकता है।
    reason: ἐν ἡμῖν का सीधा रूप ‘हममें’ है, जबकि प्रसंग में ‘हमें सौंपना’ मुहावरेदार अर्थ देता है।
  - marker: c
    text: या, “मेल-मिलाप का वचन।”
    reason: λόγος का अनुवाद प्रसंग के अनुसार ‘संदेश’ या अधिक शाब्दिक रूप से ‘वचन’ हो सकता है।
lexical_decisions:
- source_word: ὡς ὅτι
  choice: अर्थात्
  rationale: यह पद 18 के कथन को स्पष्ट करने वाला सूत्र है। ‘अर्थात्’ आधुनिक हिन्दी में इसके व्याख्यात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: θεὸς ἦν ἐν Χριστῷ
  choice: परमेश्वर मसीह में होकर
  rationale: यह रूप ἐν को ‘में’ के रूप में बनाए रखता है और परमेश्वर के मसीह में होने तथा उसके द्वारा मेल कराने के निकट संबंध को व्यक्त करता है; वैकल्पिक वाक्य-विन्यास पादटिप्पणी में दिया गया है।
- source_word: Χριστῷ
  choice: मसीह
  rationale: Χριστός यहाँ पदवी के रूप में प्रयुक्त है; ‘मसीह’ आधुनिक हिन्दी में स्थापित और अर्थपूर्ण रूप है।
- source_word: κόσμον
  choice: संसार
  rationale: यहाँ ‘संसार’ मानव-जगत को उसकी परमेश्वर से विमुख अवस्था में समेटता है और मूल शब्द की व्यापकता बनाए रखता है।
- source_word: καταλλάσσων / καταλλαγῆς
  choice: मेल करा रहा था / मेल-मिलाप
  rationale: दोनों संबंधित यूनानी शब्दों का साझा भाव बनाए रखते हुए क्रिया के लिए स्वाभाविक हिन्दी और संज्ञा के लिए प्रचलित धार्मिक किंतु सुबोध अभिव्यक्ति चुनी गई है।
- source_word: μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν
  choice: लोगों के अपराधों का लेखा उनके विरुद्ध नहीं रख रहा था
  rationale: यह λογίζομαι के हिसाब-किताब संबंधी रूपक को सुरक्षित रखता है। ‘लोगों’ से यूनानी बहुवचन αὐτοῖς का आशय स्पष्ट होता है, जिसका संबंध सामूहिक ‘संसार’ से है।
- source_word: καὶ θέμενος ἐν ἡμῖν
  choice: और उसने … हमें सौंप दिया था
  rationale: शाब्दिक ‘हममें रख दिया’ आधुनिक हिन्दी में अस्पष्ट और अस्वाभाविक होता। ‘हमें सौंप दिया’ इस प्रसंग में दायित्व दिए जाने का मुहावरेदार अर्थ व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: मेल-मिलाप का संदेश
  rationale: λόγος यहाँ घोषित की जाने वाली विषय-वस्तु को सूचित करता है, इसलिए ‘संदेश’ साधारण पाठक के लिए स्पष्ट है; ‘वचन’ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: θεὸς ἦν ἐν Χριστῷ का संबंध
  choice: परमेश्वर मसीह में होकर संसार का अपने साथ मेल करा रहा था
  alternative: मसीह में परमेश्वर संसार का अपने साथ मेल करा रहा था
  rationale: मुख्य पाठ परमेश्वर की उपस्थिति और मेल कराने की क्रिया को साथ रखता है, पर इसे केवल ‘मसीह के द्वारा’ कहकर साधनवाचक अर्थ तक सीमित नहीं करता। पादटिप्पणी अधिक प्रत्यक्ष वाक्य-विन्यास दिखाती है।
- issue: ἐν ἡμῖν का अर्थ
  choice: हमें सौंप दिया था
  alternative: हममें रख दिया था; हमारे बीच रख दिया था
  rationale: प्रसंग में प्रेरिताई सेवा का दायित्व सौंपना प्रमुख है, पर यूनानी ἐν की अधिक स्थानवाचक संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- issue: अपराधों को न गिनना
  choice: अपराधों का लेखा उनके विरुद्ध नहीं रखना
  alternative: अपराध उनके खाते में न डालना
  rationale: लेखा-संबंधी रूपक और क्षमा/मेल-मिलाप के धर्मवैचारिक तनाव को बनाए रखा गया है; इसे किसी विशिष्ट पारिभाषिक मत के शब्द में सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘लेखा उनके विरुद्ध रखना’ मूल के हिसाब-किताब वाले रूपक को बचाता है। डैश के भीतर का खंड मेल कराने की क्रिया की व्याख्या के रूप में स्पष्ट किया गया है; किसी संप्रदाय-विशिष्ट पारिभाषिक शब्दावली से बचा गया है।
