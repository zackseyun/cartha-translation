reference: 2 Corinthians 5:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: hi
  text: हम फिर से अपने को तुम्हारे सामने अनुशंसित नहीं कर रहे हैं, बल्कि तुम्हें हमारे विषय में गर्व करने का अवसर दे रहे हैं,[a] ताकि जो लोग बाहरी रूप पर गर्व करते हैं, हृदय में नहीं,[b] उन्हें देने के लिए तुम्हारे पास उत्तर हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे विषय में गर्व करने का आधार दे रहे हैं।”
    reason: ἀφορμή का अर्थ ‘अवसर’ के साथ-साथ ‘आधार’ या ‘अवसर का कारण’ भी हो सकता है।
  - marker: b
    text: शाब्दिक रूप से, “जो चेहरे में गर्व करते हैं, हृदय में नहीं”; अर्थात जो हृदय की भीतरी वास्तविकता के बजाय बाहरी रूप पर गर्व करते हैं।
    reason: मूल यूनानी में ‘चेहरे/बाहरी रूप’ और ‘हृदय’ का विरोध बना रहता है; हिन्दी में ‘हृदय में नहीं’ को इसी समानांतरता को सुरक्षित रखने के लिए रखा गया है।
lexical_decisions:
- source_word: συνιστάνομεν
  choice: अपनी प्रशंसा ... कर रहे हैं
  rationale: यहाँ क्रिया का अर्थ स्वयं को सराहनीय या विश्वसनीय ठहराना है। ‘अपनी प्रशंसा करना’ आधुनिक हिन्दी में आत्म-प्रशंसा के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀφορμὴν
  choice: अवसर
  rationale: यह शब्द आरम्भ-बिंदु, आधार या अवसर का अर्थ दे सकता है; यहाँ पौलुस कुरिन्थियों को अपने विषय में बोलने का अवसर या आधार दे रहा है।
- source_word: καυχήματος
  choice: गर्व करने
  rationale: καύχημα के गर्व/गौरव के अर्थ को रखा गया है और आगे καυχωμένους के साथ शब्दगत संबंध बनाए रखने के लिए समान हिन्दी क्रिया प्रयुक्त हुई है।
- source_word: ὑπὲρ ἡμῶν
  choice: हमारे विषय में
  rationale: संदर्भ में इसका आशय पौलुस और उसके सहकर्मियों के पक्ष में या उनके विषय में गर्व करना है। ‘हमारे विषय में’ मूल की व्यापकता बनाए रखता है; पक्ष-समर्थन का भाव संदर्भ से उभरता है।
- source_word: ἵνα ἔχητε πρὸς
  choice: उन्हें उत्तर देने के लिए तुम्हारे पास कुछ हो
  rationale: यूनानी वाक्यांश शाब्दिक रूप से ‘ताकि तुम्हारे पास ... के लिए कुछ हो’ है और संदर्भ में प्रत्युत्तर देने का संकेत देता है। हिन्दी में यह रचना स्वाभाविक रहते हुए मूल की कुछ अनिर्दिष्टता भी बचाती है।
- source_word: ἐν προσώπῳ
  choice: बाहरी रूप पर
  rationale: शाब्दिक ‘चेहरे में/पर’ यहाँ बाहरी प्रस्तुति या दिखाई देनेवाली बातों के लिए मुहावरेदार है। ‘बाहरी रूप’ हृदय के साथ विरोध को स्पष्ट करता है।
- source_word: καυχωμένους
  choice: जो लोग ... गर्व करते हैं
  rationale: ‘गर्व करना’ पहले प्रयुक्त καύχημα से शब्दगत संबंध बनाए रखता है और नकारात्मक आत्म-प्रदर्शन के संदर्भ में उपयुक्त है।
- source_word: καρδίᾳ
  choice: हृदय की दशा
  rationale: ‘हृदय’ मूल बाइबिलीय प्रतिमा को सुरक्षित रखता है; ‘की दशा’ जोड़ने से हिन्दी में ‘बाहरी रूप’ के साथ स्वाभाविक समानांतर बनता है, बिना भीतरी वास्तविकता को किसी संकीर्ण सिद्धान्त में बाँधे।
- source_word: πάλιν
  choice: फिर से
  rationale: यह पुनरावृत्ति के अर्थ को सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἐν προσώπῳ ... καὶ μὴ ἐν καρδίᾳ का विरोध
  choice: बाहरी रूप और हृदय की दशा के बीच विरोध
  alternative: सार्वजनिक प्रतिष्ठा और निष्कपटता के बीच विरोध; आमने-सामने उपस्थिति और भीतरी मनोभाव के बीच विरोध
  rationale: ‘बाहरी रूप ... हृदय’ मूल की ठोस प्रतिमाओं और नैतिक तनाव को बनाए रखता है। ‘की दशा’ केवल हिन्दी की स्पष्टता के लिए है और किसी विशिष्ट धार्मिक व्याख्या को आरोपित नहीं करता।
- issue: ὑπὲρ ἡμῶν में विषय अथवा पक्ष-समर्थन
  choice: हमारे विषय में
  alternative: हमारी ओर से; हमारे पक्ष में
  rationale: संदर्भ में पक्ष-समर्थन निहित हो सकता है, पर मूल पूर्वसर्ग विषय और हित—दोनों भाव ग्रहण कर सकता है। ‘हमारे विषय में’ इस व्यापकता को अधिक सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘तुम्हारे’ बहुवचन समुदाय को संबोधित करता है। वाक्य में पौलुस की आत्म-प्रशंसा से दूरी, कुरिन्थियों को दिया गया प्रत्युत्तर का आधार, और बाहरी रूप बनाम हृदय का तनाव सुरक्षित रखा गया है।
