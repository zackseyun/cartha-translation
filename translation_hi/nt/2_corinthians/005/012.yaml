review_pass:
  verdict: revise
  source_fidelity: The draft conveys the verse's overall argument, but ‘हृदय की दशा पर नहीं’ changes the Greek contrast. The Greek says that the opponents boast ‘in outward appearance’ and ‘not in heart’; it does not make the condition of their hearts the object on which they boast. ‘तुम्हारे सामने’ is a minor, unnecessary expansion of the dative ‘to you.’
  naturalness: The proposed revision uses natural modern Hindi while retaining the compact rhetorical contrast. ‘अपने को अनुशंसित’ is more exact than ‘अपनी प्रशंसा,’ which can suggest merely praising oneself rather than commending oneself.
  terminology: ‘गर्व करने’ consistently represents the καύχημα/καυχάομαι word group. ‘बाहरी रूप’ and ‘हृदय में’ retain the original external/internal contrast without resolving it into a narrower doctrinal interpretation.
  issues:
  - severity: medium
    issue: ‘हृदय की दशा पर नहीं’ treats the heart's condition as the object of boasting.
    rationale: 'The phrase καὶ μὴ ἐν καρδίᾳ is syntactically parallel to ἐν προσώπῳ: ‘and not in heart.’ The Hindi should retain this locative/contrastive force rather than add ‘दशा पर.’'
  - severity: low
    issue: ‘तुम्हारे सामने’ adds a spatial/presentational nuance.
    rationale: The source has ὑμῖν (‘to you’). The addition is not seriously misleading, but it is not needed.
  - severity: low
    issue: ‘अपनी प्रशंसा’ is less precise for συνιστάνομεν.
    rationale: In this context Paul denies commending or recommending himself. ‘अपने को अनुशंसित’ better preserves that rhetorical sense.
  revised_text: हम फिर से अपने को तुम्हारे सामने अनुशंसित नहीं कर रहे हैं, बल्कि तुम्हें हमारे विषय में गर्व करने का अवसर दे रहे हैं,[a] ताकि जो लोग बाहरी रूप पर गर्व करते हैं, हृदय में नहीं,[b] उन्हें देने के लिए तुम्हारे पास उत्तर हो।
