  text: θαρροῦμεν δὲ καὶ εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: hi
  text: इसलिए हम साहसी हैं और इससे अधिक यह पसंद करते हैं कि शरीर से दूर हों और प्रभु के पास घर में हों।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शरीर से अनुपस्थित होना और प्रभु के पास घर में होना।”
    reason: ἐκδημῆσαι के लिए ‘दूर होना’ और ‘अनुपस्थित होना’ दोनों संभव हैं। ‘घर में होना’ ἐνδημῆσαι और ἐκδημῆσαι के परस्पर घर/परदेश संबंधी रूपक को बनाए रखता है।
lexical_decisions:
- source_word: θαρροῦμεν
  choice: हम साहस रखते हैं
  rationale: वर्तमान काल में स्थिर साहस या हौसले को व्यक्त करता है; यह स्वाभाविक हिन्दी में यूनानी भाव को बनाए रखता है।
- source_word: δὲ
  choice: इसलिए
  rationale: यहाँ यह पिछले कथन से निष्कर्ष अथवा विचार की निरंतरता दिखाता है, न कि प्रबल विरोध।
- source_word: εὐδοκοῦμεν μᾶλλον
  choice: अधिक अच्छा समझते हैं
  rationale: यह तुलना के साथ इच्छा और वरीयता व्यक्त करता है; केवल भावनात्मक प्रसन्नता नहीं।
- source_word: ἐκδημῆσαι ἐκ τοῦ σώματος
  choice: शरीर से दूर होकर
  rationale: ἐκδημέω का मूल बिंब अपने घर या निवास से दूर होने का है; 'शरीर' को शाब्दिक रखा गया है और मृत्यु को स्पष्ट रूप से जोड़कर अर्थ का विस्तार नहीं किया गया।
- source_word: ἐνδημῆσαι πρὸς τὸν κύριον
  choice: प्रभु के साथ अपने घर में रहना
  rationale: ἐνδημέω, ἐκδημέω का प्रतिलोम है और घर में होने का बिंब रखता है; πρός यहाँ प्रभु की व्यक्तिगत संगति या उपस्थिति सूचित करता है।
theological_decisions:
- issue: क्या इस पद को मृत्यु के बाद की अवस्था के स्पष्ट सैद्धांतिक वर्णन के रूप में विस्तार दिया जाए
  choice: शरीर से दूर होने और प्रभु के साथ घर में रहने का पौलुस का रूपक बनाए रखा गया है।
  alternative: '''मरकर स्वर्ग में प्रभु के पास जाना'' जैसे स्पष्टार्थक शब्द जोड़ना।'
  rationale: पद मृत्यु के बाद प्रभु के साथ उपस्थिति का प्रबल संकेत देता है, पर यूनानी पाठ में 'मरना' या 'स्वर्ग' नहीं है; उन्हें जोड़ना वास्तविक रूपक और उसकी धर्मवैचारिक सूक्ष्मता को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप। ‘अपने घर में रहना’ घर/परदेश के यूनानी रूपक को सुरक्षित रखता है; ‘प्रभु’ प्रचलित और संदर्भानुकूल धार्मिक पद है।
