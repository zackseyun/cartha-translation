reference: 2 Corinthians 5:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀγάπη τοῦ Χριστοῦ συνέχει ἡμᾶς, κρίναντας τοῦτο ⸀ὅτι εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: hi
  text: क्योंकि मसीह का प्रेम हमें विवश करता है[a], क्योंकि हम इस निष्कर्ष पर पहुँचे हैं कि एक व्यक्ति सबके लिए मरा; इसलिए सब मर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मसीह का हमारे प्रति प्रेम” अथवा “मसीह के प्रति हमारा प्रेम”; यूनानी संबंधकारक दोनों प्रकार से समझा जा सकता है।
    reason: मूल यूनानी में कर्तृवाचक और कर्मवाचक संबंधकारक की वास्तविक अस्पष्टता है।
lexical_decisions:
- source_word: ἀγάπη
  choice: प्रेम
  rationale: ‘प्रेम’ आधुनिक मानक हिन्दी में स्वाभाविक है और ἀγάπη के अर्थ को बिना पुरातन या सांप्रदायिक रंग दिए व्यक्त करता है।
- source_word: τοῦ Χριστοῦ
  choice: मसीह का
  rationale: Χριστός को पदवी के रूप में ‘मसीह’ अनूदित किया गया है। हिन्दी का संबंधसूचक रूप मुख्य पाठ में संक्षिप्त और स्वाभाविक है; यूनानी संबंधकारक की वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
- source_word: συνέχει
  choice: विवश करता है
  rationale: यहाँ क्रिया उस प्रबल प्रेरक और नियंत्रक प्रभाव को व्यक्त करती है जो पौलुस और उसके साथियों को कार्य करने के लिए बाध्य करता है। ‘विवश करता है’ इस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κρίναντας
  choice: हम इस निष्कर्ष पर पहुँचे हैं
  rationale: संदर्भ में κρίνω विचार करके निर्णय या निष्कर्ष निकालने का भाव रखता है। कृदंत का कारणसूचक संबंध अगले ‘क्योंकि’ से स्पष्ट किया गया है।
- source_word: εἷς
  choice: एक जन
  rationale: यूनानी में केवल ‘एक’ है; हिन्दी में व्यक्ति-संदर्भ स्पष्ट और व्याकरणतः स्वाभाविक करने के लिए ‘जन’ जोड़ा गया है, बिना उसे मुख्य पाठ में स्पष्टतः मसीह कहकर अलंकारिक संक्षिप्तता मिटाए।
- source_word: ὑπὲρ πάντων
  choice: सबकी ओर से
  rationale: यह प्रतिनिधित्व या हित में किए गए कार्य का भाव रखता है, पर ‘सबके स्थान पर’ कहकर प्रायश्चित्त की किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἄρα
  choice: इसलिए
  rationale: यह पिछले कथन से निकाले गए सीधे निष्कर्ष को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ πάντες ἀπέθανον
  choice: सब मर गए
  rationale: पौलुस के संक्षिप्त कथन को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
theological_decisions:
- issue: ἡ ἀγάπη τοῦ Χριστοῦ में संबंधकारक का अर्थ
  choice: मुख्य पाठ में ‘मसीह का प्रेम’
  alternative: ‘मसीह का हमारे प्रति प्रेम’ अथवा ‘मसीह के प्रति हमारा प्रेम’
  rationale: यूनानी संबंधकारक कर्तृवाचक या कर्मवाचक समझा जा सकता है। हिन्दी में पूरी अस्पष्टता सहज रूप से बनाए रखना कठिन है, इसलिए संक्षिप्त संबंधसूचक रूप रखा गया और दोनों संभावनाएँ पादटिप्पणी में स्पष्ट की गईं।
- issue: ‘सब मर गए’ का आशय
  choice: कथन को संक्षेप में ज्यों का त्यों रखा गया
  alternative: सब मसीह में प्रतिनिधिक रूप से मरे; अथवा सभी विश्वासी उसके साथ मरे
  rationale: पद स्वयं सहभागिता या प्रतिनिधित्व की विस्तृत व्याख्या नहीं करता। इसलिए ‘सब’ के दायरे और मृत्यु की रीति पर किसी एक धर्मवैज्ञानिक निष्कर्ष को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘विवश करता है’ मूल क्रिया की प्रबल प्रेरक शक्ति व्यक्त करता है; अर्धविराम पौलुस के निष्कर्ष की सघन तर्क-रचना को बनाए रखता है।
