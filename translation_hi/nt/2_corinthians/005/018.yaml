id: 2CO.5.18
reference: 2 Corinthians 5:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: hi
  text: और ये सब बातें परमेश्वर की ओर से हैं[a], जिसने मसीह[b] के द्वारा अपने साथ हमारा[c] मेल-मिलाप कराया और हमें मेल-मिलाप की सेवा सौंपी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सब कुछ।’ यह वाक्यांश इस नई वास्तविकता की सभी बातों को व्यापक रूप से, अथवा प्रसंग में अभी बताई गई बातों को विशेष रूप से सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में Χριστός है, जो यहाँ उपाधि के रूप में प्रयुक्त है; इसका अर्थ ‘अभिषिक्त जन’ या ‘मसीह’ है।
    reason: alternative_reading
  - marker: c
    text: ‘हमारा/हमें’ व्यापक रूप से विश्वासियों को सूचित कर सकता है, यद्यपि आस-पास के प्रसंग में पौलुस विशेष रूप से अपने और अपने सहकर्मियों को सौंपे गए प्रेरिताई कार्य पर बल देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: और ये सब बातें
  rationale: τὰ πάντα का संकेत प्रसंग में अभी बताई गई नई सृष्टि और बदले हुए जीवन की वास्तविकताओं की ओर जाता है। ‘ये सब बातें’ उस संदर्भसूचकता को बनाए रखता है; δέ को हल्के संयोजक ‘और’ से व्यक्त किया गया है।
- source_word: ἐκ τοῦ θεοῦ
  choice: परमेश्वर की ओर से हैं
  rationale: ἐκ स्रोत या उद्गम बताता है। यह हिन्दी प्रयोग स्पष्ट करता है कि इन सबका मूल परमेश्वर है।
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: जिसने … अपने साथ हमारा मेल-मिलाप कराया
  rationale: कर्तृवाचक एओरिस्ट कृदंत को स्वाभाविक सम्बन्धवाचक उपवाक्य बनाया गया है। ‘अपने साथ’ ἑαυτῷ को और ‘मेल-मिलाप कराया’ καταλλάσσω के सम्बन्ध बहाल करने वाले अर्थ को व्यक्त करता है।
- source_word: διὰ Χριστοῦ
  choice: मसीह के द्वारा
  rationale: διά सहित सम्बन्धकारक माध्यम को दर्शाता है। Χριστός यहाँ मध्यस्थ की उपाधि के रूप में प्रयुक्त है; हिन्दी ‘मसीह’ स्थापित और स्वाभाविक शीर्षकीय रूप है।
- source_word: δόντος ἡμῖν
  choice: हमें … सौंपी
  rationale: दूसरे समन्वित एओरिस्ट कृदंत को हिन्दी में उसी कर्ता के साथ परिमित क्रिया बनाया गया है। सेवा या दायित्व के संदर्भ में ‘सौंपी’ शाब्दिक ‘दी’ से अधिक स्वाभाविक है और सौंपे गए कार्य का भाव व्यक्त करती है।
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: मेल-मिलाप की सेवा
  rationale: διακονία यहाँ सौंपे गए सेवाकार्य को और सम्बन्धकारक τῆς καταλλαγῆς उस सेवा की विषयवस्तु अथवा विशेषता को बताता है। ‘मेल-मिलाप की सेवा’ संक्षिप्त और अर्थपूर्ण है।
theological_decisions:
- issue: Χριστοῦ का रूपान्तरण
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: इस पद में Χριστός परमेश्वर द्वारा मेल-मिलाप कराने वाले मध्यस्थ की उपाधि है। ‘मसीह’ आधुनिक हिन्दी मसीही प्रयोग में परिचित शीर्षकीय रूप है और इसे केवल व्यक्तिगत नाम बनाकर प्रस्तुत नहीं करता।
- issue: ἡμᾶς / ἡμῖν का दायरा
  choice: हमारा / हमें
  alternative: सभी विश्वासियों को / विशेष रूप से पौलुस और उसके सहकर्मियों को
  rationale: मूल यूनानी सर्वनामों के दायरे को स्पष्ट रूप से सीमित नहीं करता। व्यापक रूप से विश्वासी अभिप्रेत हो सकते हैं, जबकि निकटवर्ती प्रसंग प्रेरिताई दायित्व पर विशेष बल देता है; मुख्य पाठ इस तनाव को खुला रखता है।
- issue: καταλλάσσω और καταλλαγή की पुनरावृत्ति
  choice: मेल-मिलाप कराया / मेल-मिलाप की सेवा
  alternative: मिला लिया / मिलाने की सेवा
  rationale: एक ही शब्द-परिवार की पुनरावृत्ति पौलुस के तर्क में महत्वपूर्ण है। हिन्दी में ‘मेल-मिलाप’ दोहराने से परमेश्वर के कार्य और सौंपी गई सेवा का स्पष्ट सम्बन्ध बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परमेश्वर की ओर से’, ‘मसीह के द्वारा’ और ‘मेल-मिलाप की सेवा’ औपचारिक अर्थ-सटीकता रखते हैं, जबकि ‘सेवा सौंपी’ स्वाभाविक हिन्दी में दायित्व का भाव स्पष्ट करता है।
