  text: ⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: hi
  text: जो पाप को नहीं जानता था, उसे परमेश्वर ने हमारे लिए पाप[a] बना दिया, ताकि हम उसमें परमेश्वर की धार्मिकता[b] बन जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पाप-बलि’। यूनानी में दोनों स्थानों पर ‘पाप’ ही है; कुछ लोग दूसरे प्रयोग को बलिदान के अर्थ में समझते हैं।
    reason: alternative_reading
  - marker: b
    text: या ‘परमेश्वर का न्याय’; अथवा ‘परमेश्वर से मिलने वाली धार्मिकता’।
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντα
  choice: नहीं जाना था
  rationale: यह γινώσκω के सामान्य अर्थ ‘जानना’ और पौलुस की संक्षिप्त अभिव्यक्ति को बनाए रखता है। संदर्भ में इसका आशय पाप में व्यक्तिगत सहभागिता न होने से है, पर मुख्य पाठ इसे ‘पाप नहीं किया’ कहकर व्याख्यात्मक रूप से नहीं खोलता।
- source_word: ἁμαρτίαν (पहला प्रयोग)
  choice: पाप
  rationale: γνόντα के कर्म के रूप में अमूर्त संज्ञा का सीधा अनुवाद पौलुस की संक्षिप्त भाषा को सुरक्षित रखता है।
- source_word: ὑπὲρ ἡμῶν
  choice: हमारे लिए
  rationale: यह प्रतिनिधिक और हितकारी दोनों संभावित अर्थों के लिए खुला, स्वाभाविक हिन्दी रूप है और प्रायश्चित की किसी एक व्याख्या को आरोपित नहीं करता।
- source_word: ἁμαρτίαν (दूसरा प्रयोग)
  choice: पाप
  rationale: यूनानी में दोनों स्थानों पर एक ही शब्द है। मुख्य पाठ में उसकी तीखी पुनरावृत्ति रखी गई है; ‘पापबलि’ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: ἐποίησεν
  choice: बना दिया
  rationale: यह दैवी क्रिया की शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है, पर यह निर्धारित नहीं करता कि ‘पाप बना दिया’ को ठीक किस तात्त्विक अर्थ में समझा जाए।
- source_word: γενώμεθα
  choice: बन जाएँ
  rationale: यह γίνομαι और ἵνα वाले उद्देश्य-वाक्य की गतिशीलता को बनाए रखता है; इसे स्थिर ‘हों’ या कर्मवाच्य ‘बनाए जाएँ’ में नहीं बदलता।
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: यह पौलुस के न्यायिक, वाचागत और नैतिक अर्थ-क्षेत्र के लिए अपेक्षाकृत व्यापक तथा प्रचलित हिन्दी शब्द है; ‘न्याय’ को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- source_word: θεοῦ
  choice: परमेश्वर की
  rationale: सम्बन्धकारक की संक्षिप्तता को बनाए रखा गया है, ताकि यह वाक्यांश परमेश्वर की अपनी धार्मिकता, परमेश्वर से मिलने वाली धार्मिकता, अथवा उससे सम्बन्धित धार्मिक स्थिति जैसे सम्भव अर्थों के लिए खुला रहे।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: यह पौलुस की महत्त्वपूर्ण और संक्षिप्त अभिव्यक्ति ‘उसमें’ को बनाए रखता है; ‘उसके साथ एकता में’ कहना अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: ‘उसे ... पाप बना दिया’ का अर्थ
  choice: मुख्य पाठ पौलुस की अभिव्यक्ति को यथावत रखता है और इसे यह कहकर नहीं खोलता कि मसीह नैतिक रूप से पापी हो गया; आरम्भिक उपवाक्य उसकी पापहीनता को स्पष्ट रखता है।
  alternative: ‘उसे पापबलि बना दिया’ अथवा नैतिक अर्थ में ‘पापी बना दिया’।
  rationale: ‘पापबलि’ सम्भव बलिदानी व्याख्या है और पादटिप्पणी में दी गई है। पर यूनानी पाठ ‘पाप’ कहता है। मसीह को नैतिक रूप से पापी मानना उसी वाक्य में कही गई उसकी पाप से अनभिज्ञता के विरुद्ध होगा।
- issue: δικαιοσύνη θεοῦ का बल
  choice: ‘परमेश्वर की धार्मिकता’ कहकर सम्बन्धकारक की बहुअर्थकता सुरक्षित रखी गई है।
  alternative: ‘परमेश्वर से मिलने वाली धार्मिकता’ या ‘परमेश्वर का न्याय’।
  rationale: यह घना और विवादित पौलुसी वाक्यांश है। मुख्य पाठ इसे किसी एक न्यायिक, वाचागत, स्रोत-सूचक या स्वामित्व-सूचक अर्थ तक सीमित नहीं करता; प्रमुख विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, मानक और गरिमापूर्ण हिन्दी है। ‘पाप बना दिया’ और ‘धार्मिकता बन जाएँ’ जैसी असामान्य पर जानबूझकर संक्षिप्त अभिव्यक्तियाँ मूल यूनानी के धर्मवैज्ञानिक तनाव को सुरक्षित रखती हैं। सर्वनाम ‘उसने’ पिछले संदर्भ में परमेश्वर की ओर संकेत करता है और मूल पद में नया स्पष्ट कर्ता नहीं जोड़ता।
