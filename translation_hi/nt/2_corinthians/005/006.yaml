revisions:
- from: इसलिए हम सदा हिम्मत रखते हैं और जानते हैं कि जब तक हम शरीर में अपने घर में हैं, तब तक प्रभु से दूर हैं।
  to: इसलिए हम सदा साहस रखते हैं और यह जानते हैं कि शरीर में रहते हुए हम घर पर हैं और प्रभु से दूर हैं।
  rationale: Revision removes the unwarranted ‘until’ implication and recasts the body/home metaphor in idiomatic Hindi. The translation maintains the source’s present, ongoing contrast and does not resolve its theological tension beyond the verse itself.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:48:31Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the inference (οὖν), continuing confidence, settled knowledge, and the contrast between embodied existence and being away from the Lord. However, “जब तक” gives the participial phrase a stronger ‘until’ sense than the Greek requires, and “शरीर में अपने घर में” is syntactically awkward and can obscure that the body itself is the metaphorical home.
  naturalness: “शरीर में रहते हुए हम घर पर हैं” is natural modern Hindi and retains the deliberately metaphorical ‘at home’ language without the confusing double locative of the draft.
  terminology: “साहस रखते हैं,” “शरीर,” and “प्रभु” are suitable, dignified, and theologically non-expansive. “प्रभु से दूर” accurately expresses ἐκδημοῦμεν ἀπὸ τοῦ κυρίου without importing the following verse’s wording.
  issues:
  - severity: medium
    issue: ‘जब तक’ over-specifies the temporal relation.
    rationale: ἐνδημοῦντες is a present participle meaning ‘while/being at home’; it does not itself require an ‘until’ construction.
  - severity: medium
    issue: ‘शरीर में अपने घर में’ is unclear and unnatural.
    rationale: The phrase can sound as though there are two separate locations. The source’s point is that being in the body is being ‘at home.’
  revised_text: इसलिए हम सदा साहस रखते हैं और यह जानते हैं कि शरीर में रहते हुए हम घर पर हैं और प्रभु से दूर हैं।
  revised_footnotes:
