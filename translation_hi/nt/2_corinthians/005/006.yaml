source:
  edition: SBLGNT
  text: Θαρροῦντες οὖν πάντοτε καὶ εἰδότες ὅτι ἐνδημοῦντες ἐν τῷ σώματι ἐκδημοῦμεν ἀπὸ τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/006.yaml
  text: Therefore[a], we are always confident and know that while we are at home in the body, we are away from the Lord,
translation:
  language: hi
  text: इसलिए हम सदा साहस रखते हैं और यह जानते हैं कि शरीर में रहते हुए हम घर पर हैं और प्रभु से दूर हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θαρροῦντες
  choice: हम ... हिम्मत रखते हैं
  rationale: वर्तमान कृदन्त निरन्तर साहस की अवस्था बताता है। हिन्दी में कर्ता और समापिका क्रिया के साथ यह स्वाभाविक है तथा अगले वाक्यांश से इसका सम्बन्ध बना रहता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकलने वाले निष्कर्ष को चिह्नित करता है।
- source_word: πάντοτε
  choice: सदा
  rationale: निरन्तरता का संक्षिप्त, dignified और सहज हिन्दी रूप।
- source_word: εἰδότες
  choice: जानते हैं
  rationale: οἶδα का पूर्ण कृदन्त यहाँ वर्तमान अर्थ में स्थिर ज्ञान या बोध व्यक्त करता है।
- source_word: ἐνδημοῦντες
  choice: जब तक हम ... अपने घर में हैं
  rationale: क्रिया का मूल बिम्ब अपने देश या घर में रहने का है। 'अपने घर में' अगले विरोधी पद ἐκδημοῦμεν के साथ स्थानगत रूपक को बनाए रखता है।
- source_word: ἐν τῷ σώματι
  choice: शरीर में
  rationale: यह देहधारी वर्तमान अस्तित्व की स्थानवाचक अभिव्यक्ति है; 'इस शरीर' जोड़ना आवश्यक नहीं।
- source_word: ἐκδημοῦμεν
  choice: दूर हैं
  rationale: ἐνδημοῦντες का विरोधी पद है और घर से बाहर या अनुपस्थित होने का भाव देता है। 'दूर हैं' आधुनिक हिन्दी में स्वाभाविक है तथा स्थानगत विरोध बनाए रखता है।
- source_word: ἀπὸ τοῦ κυρίου
  choice: प्रभु से
  rationale: ἀπό अलगाव का भाव देता है; 'दूर हैं' के साथ 'प्रभु से' स्वाभाविक हिन्दी रचना बनती है।
theological_decisions:
- issue: देह में वर्तमान जीवन और प्रभु के साथ उपस्थिति का रूपकात्मक विरोध
  choice: वर्तमान देहधारी जीवन को 'शरीर में अपने घर में' और उसी अनुपात में 'प्रभु से दूर' कहा गया है।
  alternative: अगले पद की भाषा को यहाँ लाकर 'शरीर से दूर और प्रभु के पास' कहना, या इसे मसीह से पूर्ण आध्यात्मिक अलगाव मानना।
  rationale: पद के अपने रूपक और तनाव को रखा गया है। यह प्रभु के साथ अभी न हुई प्रत्यक्ष/पूर्ण उपस्थिति की ओर संकेत करता है, पर मसीह की वर्तमान आत्मिक या संभालने वाली उपस्थिति के विषय में इससे अधिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली। 'हिम्मत रखते हैं' सामान्य पाठक के लिए 'आश्वस्त हैं' की तुलना में Θαρροῦντες के साहस-बोध को अधिक स्पष्ट रखता है। घर/दूर का रूपक यथासम्भव सुरक्षित रखा गया है।
