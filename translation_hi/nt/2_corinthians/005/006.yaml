    reason: lexical_alternative
  revision_rationale: Revision removes the unwarranted ‘until’ implication and recasts the body/home metaphor in idiomatic Hindi. The translation maintains the source’s present, ongoing contrast and does not resolve its theological tension beyond the verse itself.
