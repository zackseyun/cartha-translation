source:
  edition: SBLGNT
  text: ὁ δὲ κατεργασάμενος ἡμᾶς εἰς αὐτὸ τοῦτο θεός, ⸀ὁ δοὺς ἡμῖν τὸν ἀρραβῶνα τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: hi
  text: जिसने हमें इसी बात के लिए तैयार किया, वह परमेश्वर है, जिसने हमें आत्मा का बयाना दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργασάμενος
  choice: तैयार किया है
  rationale: संदर्भ में परमेश्वर विश्वासियों को उस भावी देहधारी अवस्था के योग्य बना रहा है जिसका वर्णन पद 1–4 में है। ‘तैयार किया है’ उद्देश्यपूर्ण रीति से गढ़ने और नियत परिणाम की ओर ले जाने का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: εἰς αὐτὸ τοῦτο
  choice: इसी के लिए
  rationale: यह पदबंध ठीक उसी बात की ओर जोर देकर संकेत करता है जिसकी चर्चा पहले हुई है। ‘इसी के लिए’ संक्षिप्त, स्वाभाविक और बलयुक्त है।
- source_word: θεός
  choice: परमेश्वर
  rationale: यूनानी वाक्य में परमेश्वर ही वह कर्ता है जिसने हमें तैयार किया है।
- source_word: δοὺς
  choice: उसी ने ... दिया है
  rationale: कृदंत को हिंदी में मुख्य कर्ता से जुड़ी दूसरी उपवाक्यात्मक अभिव्यक्ति के रूप में देना स्वाभाविक है। ‘उसी ने’ इस बात को स्पष्ट करता है कि आत्मा का बयाना देने वाला भी परमेश्वर ही है।
- source_word: ἀρραβῶνα
  choice: बयाना
  rationale: यह शब्द ऐसी आरंभिक भुगतान-राशि को दर्शाता है जो शेष के मिलने की गारंटी देती है। ‘बयाना’ हिंदी में ठोस आर्थिक रूपक और भावी पूर्णता की आश्वस्ति—दोनों को बनाए रखता है।
- source_word: τοῦ πνεύματος
  choice: आत्मा का
  rationale: संबंधकारक की मूल संरचना को बनाए रखने से यह अनिर्णीत रहता है कि आत्मा स्वयं बयाना है या आत्मा से संबंधित/आत्मा द्वारा सुनिश्चित बयाना अभिप्रेत है।
- source_word: δὲ
  choice: अलग शब्द के रूप में व्यक्त नहीं किया
  rationale: यहाँ δέ हल्के संक्रमण या विचार की आगे बढ़त को चिह्नित करता है, प्रबल विरोध या स्पष्ट कालगत ‘अब’ को नहीं। हिंदी में वाक्य-संबंध और संदर्भ से यह कार्य स्वाभाविक रूप से प्रकट होता है; ‘अब’ जोड़ना अनुचित कालगत अर्थ दे सकता था।
theological_decisions:
- issue: ‘आत्मा का बयाना’ का अर्थ
  choice: मुख्य पाठ में संबंधकारक की अस्पष्टता बनाए रखी गई है; प्रमुख संभावना यह है कि पवित्र आत्मा स्वयं भावी पुनरुत्थान-जीवन की वर्तमान पहली किस्त और गारंटी है।
  alternative: इसे उस बयाने के रूप में भी समझा जा सकता है जो आत्मा देता है या जो आत्मा द्वारा पूर्ण की जाने वाली बात की गारंटी है।
  rationale: पौलुस के अन्य प्रयोग आत्मा के स्वयं बयाना होने की ओर दृढ़ संकेत करते हैं (2 कुरिन्थियों 1:22; इफिसियों 1:13–14), पर यूनानी संबंधकारक को मुख्य पाठ में अधिक स्पष्ट करके इसकी वास्तविक व्याकरणिक-धर्मवैज्ञानिक गुंजाइश समाप्त नहीं की गई।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘बयाना’ सामान्य पाठक के लिए परिचित आर्थिक रूपक है। अर्धविराम और ‘उसी ने’ यूनानी कृदंत-संबंध को स्पष्ट एवं स्वाभाविक हिंदी में व्यक्त करते हैं।
