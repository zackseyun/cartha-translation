source:
  edition: SBLGNT
  text: καὶ ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: hi
  text: और वह सबके लिए[a] मरा, ताकि जो जीवित हैं वे अब अपने लिए न जिएँ, बल्कि उसके लिए जिएँ जो उनके लिए मरा और जिलाया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सबकी ओर से’। इस पद में दोनों बार आए ‘के लिए’ (ὑπέρ) में किसी के लाभ के लिए या उसकी ओर से कार्य करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में क्रिया कर्मवाच्य है: ‘जिलाया गया’; कुछ अनुवाद इसे ‘जी उठा’ कहते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ πάντων
  choice: सबके लिए
  rationale: ὑπέρ के साथ संबंधकारक यहाँ लाभ या प्रतिनिधित्व का भाव व्यक्त करता है। ‘सबके लिए’ स्वाभाविक हिन्दी है और किसी विशेष प्रायश्चित-सिद्धांत को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀπέθανεν
  choice: वह ... मरा
  rationale: अनिश्चित भूतकाल की क्रिया को एक घटित घटना के रूप में सरल भूतकाल से व्यक्त किया गया है; कर्ता प्रसंग से स्पष्ट है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा अभिप्रेत परिणाम का परिचय देता है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक रूप से वही बल रखता है।
- source_word: οἱ ζῶντες
  choice: जो जीवित हैं
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त को स्पष्ट और सहज हिन्दी में व्यक्त किया गया है, बिना यह तय किए कि जीवन का आशय केवल शारीरिक है या व्यापक आत्मिक-अस्तित्वगत।
- source_word: μηκέτι
  choice: अब ... न
  rationale: यह पहले की रीति के समाप्त होने का संकेत देता है। हिन्दी में निषेधात्मक क्रिया के साथ ‘अब ... न’ ‘अब और नहीं’ की अपेक्षा अधिक सहज है।
- source_word: ἑαυτοῖς ζῶσιν
  choice: अपने लिए न जिएँ
  rationale: आत्मवाचक सम्प्रदान कारक जीवन की दिशा या हित को सूचित करता है। ‘अपने लिए जीना’ स्वार्थ-केंद्रित जीवन का स्वाभाविक हिन्दी प्रयोग है।
- source_word: ἀλλὰ τῷ ... ἀποθανόντι καὶ ἐγερθέντι
  choice: बल्कि उसके लिए जिएँ जो ... मरा और जिलाया गया
  rationale: पहली क्रिया ‘जिएँ’ को विरोधी खंड में दोहराकर हिन्दी वाक्य स्पष्ट रखा गया है। कृदन्तीय रचना का संबंध उसी व्यक्ति से बनाए रखा गया है।
- source_word: ἐγερθέντι
  choice: जिलाया गया
  rationale: ग्रीक का कर्मवाच्य रूप सुरक्षित रहता है और यह संकेत बना रहता है कि पुनर्जीवन की क्रिया उस पर की गई; ‘जी उठा’ अधिक मुहावरेदार विकल्प है, पर कर्मवाच्य का भाव खो देता है।
- source_word: ὑπὲρ αὐτῶν
  choice: उनके लिए
  rationale: पहले आए ὑπέρ के अनुरूप वही हिन्दी संरचना रखी गई है, जिससे लाभ और प्रतिनिधित्व—दोनों संभावित अर्थ खुले रहते हैं।
theological_decisions:
- issue: πάντων और αὐτῶν का दायरा
  choice: ‘सब’ और ‘उनके’ को बिना संकुचित किए सीधा अनुवादित किया गया है।
  alternative: ‘सब’ को केवल विश्वासियों अथवा मसीह द्वारा प्रतिनिधित्व किए गए लोगों तक स्पष्ट रूप से सीमित करना; या इसे हर मनुष्य के लिए निर्बाध सार्वभौमिक कथन के रूप में विस्तार देना।
  rationale: पद व्यापक शब्दावली का प्रयोग करता है, पर प्रायश्चित के दायरे पर बाद के धर्मवैज्ञानिक विवादों को स्वयं स्पष्ट रूप से नहीं सुलझाता। अनुवाद उस तनाव को बनाए रखता है।
- issue: ἐγερθέντι में पुनरुत्थान का कर्मवाच्य
  choice: ‘जिलाया गया’
  alternative: ‘जी उठा’
  rationale: कर्मवाच्य ग्रीक व्याकरण को दर्शाता है और परमेश्वर की क्रिया की निहित संभावना को सुरक्षित रखता है, बिना वाक्य में ऐसा कर्ता जोड़ने के जो यहाँ स्पष्टतः लिखा नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल और गरिमापूर्ण रखी गई है। ‘जिलाया गया’ सामान्य बोलचाल से कुछ अधिक धर्मग्रंथीय है, पर यहाँ यूनानी कर्मवाच्य को स्पष्ट और संक्षिप्त रूप से सुरक्षित करता है। अंग्रेज़ी परामर्श-पाठ में [b] का चिह्न ‘अपने लिए’ के बाद दिखता है, जबकि उसकी टिप्पणी पुनरुत्थान की क्रिया से संबंधित है; हिन्दी मुख्य पाठ में उसे संबद्ध शब्द के बाद रखा गया है।
