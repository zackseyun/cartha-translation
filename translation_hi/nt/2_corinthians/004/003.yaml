  text: εἰ δὲ καὶ ἔστιν κεκαλυμμένον τὸ εὐαγγέλιον ἡμῶν, ἐν τοῖς ἀπολλυμένοις ἐστὶν κεκαλυμμένον,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/003.yaml
  text: And even if our gospel is veiled[a], it is veiled among those who are perishing,
translation:
  language: hi
  text: और यदि हमारा सुसमाचार परदे से ढका हुआ भी है, तो वह नाश होनेवालों में परदे से ढका हुआ है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नाश होनेवालों के लिए” अथवा “खोए हुओं में।”
    reason: मूल के ἐν τοῖς ἀπολλυμένοις में पूर्वसर्ग ἐν के संभावित संबंध और ἀπολλυμένοις के वैकल्पिक शाब्दिक अर्थ को दर्शाता है।
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: और यदि … भी
  rationale: शर्त के साथ रियायत का भाव स्वाभाविक हिन्दी में व्यक्त करता है; δέ को प्रसंग की कड़ी के रूप में ‘और’ तथा καί को ‘भी’ से दर्शाया गया है।
- source_word: κεκαλυμμένον
  choice: परदे में ढका
  rationale: पूर्ण निष्क्रिय कृदन्त का भाव रखते हुए निकटवर्ती प्रसंग (3:14–16; 4:4) के परदे के रूपक को बनाए रखता है; केवल ‘छिपा’ कहना रूपक को सपाट कर देता।
- source_word: τὸ εὐαγγέλιον ἡμῶν
  choice: हमारा सुसमाचार
  rationale: ἡμῶν के संबंधसूचक अर्थ और पौलुस के संक्षिप्त पदबंध को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: नाश होनेवालों के बीच
  rationale: ἐν के क्षेत्र/समूह-संबंधी भाव को ‘के बीच’ से और वर्तमान कृदन्त के चलते हुए दशा-भाव को ‘नाश होनेवालों’ से व्यक्त किया गया है।
- source_word: ἐστὶν κεκαλυμμένον
  choice: वह … परदे में ढका है
  rationale: यूनानी में दोहराए गए विधेय को जोर सहित बनाए रखता है; ‘वह’ सुसमाचार की ओर स्पष्ट संकेत करता है।
theological_decisions:
- issue: पौलुस के उद्धार-संबंधी प्रसंग में ἀπολλυμένοις की प्रकृति
  choice: नाश होनेवाले
  alternative: खोए हुए
  rationale: वर्तमान कृदन्त चल रही दशा या प्रक्रिया का संकेत देता है। ‘नाश होनेवाले’ इस तनाव को सुरक्षित रखता है, जबकि ‘खोए हुए’ इसे अधिक स्थिर और व्याख्यात्मक पहचान बना सकता है।
- issue: ἐν τοῖς ἀπολλυμένοις में ἐν का संबंध
  choice: नाश होनेवालों के बीच
  alternative: नाश होनेवालों के लिए
  rationale: ‘के बीच’ मूल पूर्वसर्ग के क्षेत्र अथवा समूह-संबंधी अर्थ को सीधे दर्शाता है; ‘के लिए’ संभावित अर्थ है, पर दिशा या ग्रहणकर्ता का भाव अधिक स्पष्ट कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। ‘परदे में ढका’ निकटवर्ती प्रसंग का प्रमुख रूपक बनाए रखता है; ‘नाश होनेवाले’ धार्मिक रूप से परिचित होते हुए भी मूल की प्रक्रियात्मक अस्पष्टता सुरक्षित रखता है।
