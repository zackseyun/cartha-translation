translation:
  language: hi
  text: इसलिए मृत्यु हममें कार्य कर रही है, पर जीवन तुममें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले परिणाम या निष्कर्ष को व्यक्त करता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ὁ θάνατος
  choice: मृत्यु
  rationale: यूनानी का निश्चित उपपद हिन्दी में अलग से व्यक्त करना आवश्यक नहीं; ‘मृत्यु’ यहाँ पौलुस और उसके सहकर्मियों के देहगत, मृत्यु-सदृश कष्टों में सक्रिय वास्तविकता को खुला रखता है।
- source_word: ἐν ἡμῖν
  choice: हममें
  rationale: यह यूनानी पद का सीधा और संक्षिप्त रूप है तथा प्रेरितों और कुरिन्थियों के बीच समानांतर विरोध को बनाए रखता है।
- source_word: ἐνεργεῖται
  choice: काम कर रही है
  rationale: यह निरंतर और प्रभावी सक्रियता को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना निष्क्रिय या तकनीकी अर्थ थोपे।
- source_word: ἡ δὲ ζωὴ
  choice: पर जीवन
  rationale: δέ यहाँ स्पष्ट विरोध दिखाता है; ‘पर’ मृत्यु और जीवन के बीच संक्षिप्त प्रतितुलना बनाए रखता है।
- source_word: ἐν ὑμῖν
  choice: तुममें
  rationale: यह ἐν ἡμῖν के साथ यूनानी समानांतरता को बनाए रखता है और व्यक्तिगत तथा सामुदायिक दोनों संकेतों को खुला छोड़ता है।
theological_decisions:
- issue: मृत्यु और जीवन के विरोध का अर्थ
  choice: मूल पाठ की संक्षिप्त ‘मृत्यु’ और ‘जीवन’ शब्दावली को बनाए रखा गया है, जिससे प्रेरितों के मृत्यु-सदृश कष्ट और उनकी सेवा द्वारा कुरिन्थियों में कार्यरत जीवन दोनों निहित रह सकें।
  alternative: इसे केवल शारीरिक मृत्यु और संरक्षण, अथवा केवल आत्मिक आत्म-त्याग और अनन्त जीवन के रूप में स्पष्ट कर देना।
  rationale: पद 10–11 यीशु की मृत्यु और जीवन के प्रेरितों के शरीर में प्रकट होने की बात करते हैं, जबकि व्यापक प्रसंग दूसरों को जीवन पहुँचाने वाली सेवा का है; किसी एक अर्थ तक सीमित करना मूल का धर्मवैज्ञानिक तनाव घटा देगा।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘हममें…तुममें’ तथा ‘मृत्यु…जीवन’ की संतुलित संरचना मूल यूनानी की तीखी प्रतितुलना को सुरक्षित रखती है।
