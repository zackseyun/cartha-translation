source:
  edition: SBLGNT
  text: μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ τὰ μὴ βλεπόμενα, τὰ γὰρ βλεπόμενα πρόσκαιρα, τὰ δὲ μὴ βλεπόμενα αἰώνια.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/018.yaml
  text: as we look not to the things that are seen but to the things that are not seen. For the things that are seen are temporary[a], but the things that are not seen are eternal.
translation:
  language: hi
  text: हम दिखाई देने वाली वस्तुओं पर नहीं, बल्कि न दिखाई देने वाली वस्तुओं पर अपनी दृष्टि लगाए रखते हैं; क्योंकि दिखाई देने वाली वस्तुएँ कुछ समय की हैं[a], पर न दिखाई देने वाली वस्तुएँ अनन्त हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘जो दिखाई देता है ... जो दिखाई नहीं देता’; एक अन्य सम्भव अनुवाद: ‘दृश्य वस्तुएँ ... अदृश्य वस्तुएँ’।'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοπούντων
  choice: अपनी दृष्टि लगाए रखते हैं
  rationale: यह वर्तमान कृदन्त किसी ओर ध्यान या दृष्टि केंद्रित रखने का भाव देता है। यह अनुवाद दृश्य रूपक को बनाए रखता है और निरन्तर अभिमुखता व्यक्त करता है।
- source_word: μὴ
  choice: नहीं / न
  rationale: यह साधारण निषेध है; यूनानी पाठ में ‘अब नहीं’ जैसा कोई कालगत भाव नहीं है।
- source_word: τὰ βλεπόμενα
  choice: दिखाई देने वाली वस्तुएँ
  rationale: संज्ञा के रूप में प्रयुक्त बहुवचन कृदन्त का ठोस और समानान्तर अनुवाद है; यह दृश्य वास्तविकताओं को ‘भौतिक’ कहकर सीमित नहीं करता।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: दोनों लक्ष्यों के बीच प्रबल विरोध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: τὰ μὴ βλεπόμενα
  choice: न दिखाई देने वाली वस्तुएँ
  rationale: यूनानी में पहले पद के साथ जानबूझकर रखी गई समानान्तर संरचना को बनाए रखता है और इसे सीधे ‘आत्मिक वस्तुएँ’ नहीं बनाता।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार प्रस्तुत करता है और हिन्दी वाक्य में तर्क-संबंध साफ रखता है।
- source_word: πρόσκαιρα
  choice: कुछ समय की
  rationale: सीमित अवधि तक रहने का अर्थ सहज आधुनिक हिन्दी में व्यक्त होता है; ‘क्षणिक’ इस स्थान पर मूल शब्द से अधिक तीव्र हो सकता है।
- source_word: δὲ
  choice: पर
  rationale: वाक्य के दूसरे भाग को पहले से विरोध में रखता है और संक्षिप्त, स्वाभाविक हिन्दी देता है।
- source_word: αἰώνια
  choice: अनन्त
  rationale: πρόσκαιρα के विरोध में ऐसी वास्तविकता का बोध कराता है जो सदा बनी रहती है; यह सन्दर्भानुकूल और प्रचलित हिन्दी पद है।
- source_word: ἡμῶν
  choice: हम
  rationale: यूनानी में कृदन्त के कर्ता को हिन्दी में स्पष्ट कर्ता ‘हम’ के रूप में व्यक्त करना स्वाभाविक है।
theological_decisions:
- issue: दिखाई देने और न दिखाई देने वाली वास्तविकताओं का विरोध
  choice: ‘दिखाई देने वाली वस्तुएँ’ और ‘न दिखाई देने वाली वस्तुएँ’ जैसी ठोस भाषा बनाए रखी गई है।
  alternative: ‘भौतिक वस्तुएँ’ और ‘आत्मिक वस्तुएँ’
  rationale: पौलुस यहाँ दृश्य और अदृश्य का विरोध करता है, पर इन्हें स्पष्ट रूप से भौतिक और आत्मिक दार्शनिक वर्गों में नहीं बाँटता। चुना गया रूप पाठ की वास्तविक अस्पष्टता और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अपनी दृष्टि लगाए रखते हैं’ मूल के दृश्य रूपक तथा वर्तमान कृदन्त की निरन्तरता को बनाए रखता है। अर्धविराम तर्क के दोनों निकट जुड़े भागों को स्पष्ट करता है।
