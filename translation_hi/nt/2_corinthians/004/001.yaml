revisions:
- from: इसलिए, जब परमेश्वर की दया से हमें यह सेवा मिली है, तो हम हिम्मत नहीं हारते।
  to: इसलिए, हम पर की गई दया के अनुसार यह सेवा पाकर, हम हिम्मत नहीं हारते।
  rationale: The revision retains ‘सेवा’ and the natural idiom ‘हिम्मत नहीं हारते,’ but avoids supplying an unstated divine agent. ‘हम पर की गई दया के अनुसार’ represents the Greek passive mercy clause and its καθὼς connection without forcing a more specific causal formulation than the text provides.
