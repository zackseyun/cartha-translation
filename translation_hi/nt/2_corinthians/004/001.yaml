source:
  edition: SBLGNT
  text: Διὰ τοῦτο, ἔχοντες τὴν διακονίαν ταύτην καθὼς ἠλεήθημεν, οὐκ ⸀ἐγκακοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/001.yaml
  text: Therefore, since we have this ministry, just as we have received mercy, we do not lose heart.
translation:
  language: hi
  text: इसलिए, हम पर की गई दया के अनुसार यह सेवा पाकर, हम हिम्मत नहीं हारते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διακονία
  choice: सेवा
  rationale: यहाँ पौलुस की सुसमाचार-संबंधी सेवकाई अभिप्रेत है; ‘सेवा’ आधुनिक हिन्दी में सहज है और पद अथवा संस्था का अनावश्यक भाव नहीं जोड़ती।
- source_word: ἠλεήθημεν
  choice: परमेश्वर की दया से हमें ... मिली है
  rationale: यूनानी निष्क्रिय क्रिया का कर्ता अप्रकट है, पर संदर्भ में परमेश्वर स्पष्ट निहित कर्ता हैं। हिन्दी में इस संबंध को स्वाभाविक बनाने के लिए दया को सेवा मिलने के आधार के रूप में व्यक्त किया गया है।
- source_word: ἐγκακοῦμεν
  choice: हम हिम्मत नहीं हारते
  rationale: मुहावरे का आशय कठिनाइयों के कारण निरुत्साहित होकर पीछे न हटना है; यह हिन्दी अभिव्यक्ति उस अर्थ को सहजता से पहुँचाती है।
theological_decisions:
- issue: दया और सेवा के बीच καθὼς का संबंध
  choice: ‘परमेश्वर की दया से हमें यह सेवा मिली है’
  alternative: ‘जैसे हम पर दया की गई, वैसे ही हमें यह सेवा मिली है’
  rationale: καθὼς यहाँ सेवा प्राप्त होने को दया प्राप्त होने के अनुरूप अथवा उसके आधार पर रखता है। चुना हुआ रूप हिन्दी में स्वाभाविक है और यह स्पष्ट करता है कि सेवकाई योग्यता से नहीं, दया से मिली है; ‘वैसे ही’ वाला शाब्दिक रूप अस्पष्ट और असहज हो सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘सेवकाई’ के स्थान पर अधिक प्रचलित ‘सेवा’ और ‘मन छोटा नहीं करते’ के स्थान पर स्वाभाविक ‘हिम्मत नहीं हारते’ चुना गया है।
