review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the overall sense, especially the refusal to lose heart. However, it makes God explicit although the Greek uses an unexpressed passive ('we were shown mercy'), and it recasts καθὼς ('as/just as') as the causal phrase 'परमेश्वर की दया से,' more tightly making mercy the means by which the ministry was received than the source explicitly states.
  naturalness: ‘हम हिम्मत नहीं हारते’ is natural, modern, and suitable for the register. The revised wording remains idiomatic while retaining the source's more closely linked phrasing.
  terminology: ‘सेवा’ is an appropriate, clear rendering of διακονία in this context. ‘दया’ appropriately renders the mercy language without importing a theological interpretation.
  issues:
  - severity: medium
    issue: The implied agent of the passive ἠλεήθημεν is made explicit as ‘परमेश्वर.’
    rationale: Although God is readily inferred from context, the Greek does not state the agent. The translation should retain this textual restraint.
  - severity: medium
    issue: The phrase ‘परमेश्वर की दया से हमें यह सेवा मिली है’ changes the stated relationship introduced by καθὼς.
    rationale: It presents mercy directly as the means/cause of receiving the ministry. A closer Hindi construction can preserve the source's ‘in accordance with/as we were shown mercy’ connection without overexplaining it.
  revised_text: इसलिए, हम पर की गई दया के अनुसार यह सेवा पाकर, हम हिम्मत नहीं हारते।
