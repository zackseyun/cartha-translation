lexical_decisions:
- source_word: διωκόμενοι
  choice: सताए जाते हैं
  rationale: यहाँ क्रिया विरोधियों द्वारा शत्रुतापूर्ण पीछा और उत्पीड़न को व्यक्त करती है। ‘सताए जाते हैं’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से बताता है और कर्मवाच्य समानांतरता बनाए रखता है।
- source_word: ἐγκαταλειπόμενοι
  choice: त्यागे नहीं जाते
  rationale: ἐγκαταλείπω का भाव किसी को छोड़ देने या असहाय अवस्था में त्याग देने का है। ‘त्यागे नहीं जाते’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: καταβαλλόμενοι
  choice: गिरा दिए जाते हैं
  rationale: क्रिया का मूल भाव नीचे गिरा देने या धराशायी करने का है। यह अनुवाद उस चित्रात्मकता को सुरक्षित रखता है और केवल मानसिक निराशा का अर्थ नहीं देता।
- source_word: ἀπολλύμενοι
  choice: नष्ट नहीं होते
  rationale: गिराए जाने के विपरीत यहाँ पूर्ण विनाश न होने की बात है। ‘नष्ट नहीं होते’ यूनानी रूप में संभव विनाश/नाश की अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अनावश्यक रूप से कर्ता निर्धारित किए।
- source_word: ἀλλ’ οὐκ
  choice: फिर भी ... नहीं
  rationale: दोनों विरोधी युग्मों में ‘फिर भी ... नहीं’ कठिन परिस्थिति और उसके सीमित परिणाम के बीच तीखा विरोध तथा लय बनाए रखता है।
theological_decisions:
- issue: ἐγκαταλειπόμενοι में सामान्यतः छोड़ दिए जाने और परमेश्वर द्वारा त्यागे जाने की धार्मिक अनुगूँज के बीच संबंध
  choice: त्यागे नहीं जाते
  alternative: बेसहारा नहीं छोड़े जाते
  rationale: ‘त्यागे नहीं जाते’ मूल शब्द की व्यापकता और धार्मिक तनाव को बनाए रखता है, पर यह स्पष्ट रूप से परमेश्वर को व्याकरणिक कर्ता बनाकर उस बात को नहीं जोड़ता जो इस खंड में प्रत्यक्ष नहीं कही गई।
- issue: ἀπολλύμενοι को बाहरी विनाश या स्वयं नाश होने की प्रक्रिया के रूप में व्यक्त करना
  choice: नष्ट नहीं होते
  alternative: नाश नहीं किए जाते
  rationale: यूनानी वर्तमान कर्मवाच्य/मध्यवाच्य कृदंत परिणाम और प्रक्रिया दोनों की छाया रख सकता है। हिन्दी में ‘नष्ट नहीं होते’ इस अस्पष्टता को ‘नाश नहीं किए जाते’ की अपेक्षा अधिक सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और मौखिक पाठ में लयबद्ध। पिछले प्रसंग से निहित प्रथम-पुरुष बहुवचन को स्पष्ट करने के लिए आरम्भ में ‘हम’ रखा गया है। दोनों विरोधी युग्मों में समानांतर संरचना सुरक्षित है।
