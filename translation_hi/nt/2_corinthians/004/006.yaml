  edition: SBLGNT
  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: hi
  text: क्योंकि जिस परमेश्वर ने कहा, “अंधकार में से प्रकाश चमकेगा,”[c] उसी ने हमारे हृदयों में चमककर मसीह[b] के मुख में परमेश्वर की महिमा के ज्ञान को प्रकाश देने का कार्य किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: यूनानी Χριστοῦ; परम्परागत रूप से “ख्रीस्त।” यहाँ “मसीह” किया गया है, क्योंकि यह शब्द पदवी के रूप में प्रयुक्त है।
    reason: lexical_alternative
  - marker: c
    text: यह कथन उत्पत्ति 1:3 की प्रतिध्वनि है और विश्वासियों में परमेश्वर के प्रकाशनकारी कार्य के लिए सृष्टि के प्रकाश की छवि का प्रयोग करता है।
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार बताता है; इसलिए कारणसूचक ‘क्योंकि’ तर्क-संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ θεὸς ὁ εἰπών
  choice: परमेश्वर, जिसने कहा
  rationale: सव्यंजक कृदन्त को हिन्दी में सम्बन्धवाचक उपवाक्य के रूप में देना स्वाभाविक है और यूनानी वाक्य का अर्थ सुरक्षित रखता है।
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: अंधकार में से प्रकाश चमकेगा
  rationale: यह अनुवाद ἐκ के स्रोत-बोध और भविष्यकाल को बनाए रखता है तथा सृष्टि के प्रकाश की ओर संकेत करने वाली भाषा को सुरक्षित रखता है।
- source_word: ὃς ἔλαμψεν
  choice: वही ... चमका है
  rationale: ‘वही’ पहले वर्णित परमेश्वर को फिर से स्पष्ट करता है। ‘चमका है’ परमेश्वर के हृदयों में प्रकाशमान होने के कार्य और उसके बने रहने वाले प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है; क्रिया को अनावश्यक रूप से कारक नहीं बनाया गया।
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: हमारे हृदयों में
  rationale: ‘हृदय’ भीतरी मनुष्य के लिए प्रचलित और समझ में आने वाला बाइबलीय रूपक है।
- source_word: πρὸς φωτισμὸν τῆς γνώσεως
  choice: ताकि ... ज्ञान का प्रकाश फैले
  rationale: यह अमूर्त यूनानी संज्ञा φωτισμός को सुबोध हिन्दी में परिणाम अथवा उद्देश्य के रूप में व्यक्त करता है, जबकि ‘ज्ञान’ की संज्ञात्मकता और प्रकाश की मूल छवि दोनों बनाए रखता है।
- source_word: τῆς δόξης τοῦ θεοῦ
  choice: परमेश्वर की महिमा
  rationale: यह सम्बन्धकारक पदबंध का सीधा, स्वाभाविक और धर्मवैचारिक रूप से निष्पक्ष हिन्दी रूप है।
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: मसीह के मुख में
  rationale: πρόσωπον का प्राथमिक ठोस अर्थ ‘मुख’ है, और निकट प्रसंग में चमक तथा महिमा की छवियाँ इसे समर्थित करती हैं। Χριστοῦ को यहाँ पदवी के रूप में ‘मसीह’ दिया गया है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस प्रसंग में Χριστός अभिषिक्त जन की पदवी के रूप में कार्य करता है; ‘मसीह’ आधुनिक हिन्दी में इस पदवी का स्थापित और व्यापक रूप है।
- issue: ἐν προσώπῳ Χριστοῦ का आशय
  choice: मसीह के मुख में
  alternative: मसीह के व्यक्तित्व में
  rationale: ‘मुख’ प्रकाश और महिमा की ठोस दृश्यात्मक छवि को सुरक्षित रखता है। ‘व्यक्तित्व में’ सम्भव मुहावरेदार अर्थ है, पर वह मूल रूपक को अधिक अमूर्त बना देता है; इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: πρὸς φωτισμὸν का सम्बन्ध
  choice: ताकि ... ज्ञान का प्रकाश फैले
  alternative: ज्ञान को प्रकाशित करने के लिए
  rationale: यूनानी पद उद्देश्य अथवा परिणाम की दिशा व्यक्त कर सकता है। चुना हुआ रूप इस खुलेपन को पर्याप्त रूप से बनाए रखते हुए हिन्दी में प्रकाश की छवि को स्वाभाविक बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘अंधकार’, ‘प्रकाश’, ‘हृदय’, ‘महिमा’ और ‘मुख’ जैसी मूल बाइबलीय छवियाँ सुरक्षित रखी गई हैं। वाक्य को अत्यधिक संस्कृतनिष्ठ बनाए बिना पौलुस की सघन विचार-रचना और कारणसूचक सम्बन्ध बनाए रखा गया है।
