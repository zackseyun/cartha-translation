  text: Ἔχομεν δὲ τὸν θησαυρὸν τοῦτον ἐν ὀστρακίνοις σκεύεσιν, ἵνα ἡ ὑπερβολὴ τῆς δυνάμεως ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: hi
  text: परन्तु यह खज़ाना हमारे पास मिट्टी के बरतनों[a] में है, ताकि सामर्थ्य की असाधारण महानता[b] परमेश्वर की ओर से हो, हमारी ओर से नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिट्टी के पात्रों में।”
    reason: lexical_alternative
  - marker: b
    text: या, “असाधारण सामर्थ्य” अथवा “बढ़कर सामर्थ्य।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχομεν δὲ
  choice: परन्तु ... हमारे पास है
  rationale: δὲ का प्रसंगगत विरोध ‘परन्तु’ से और ἔχομεν का वर्तमानकालीन अधिकार/धारण ‘हमारे पास है’ से स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: τὸν θησαυρὸν τοῦτον
  choice: यह खज़ाना
  rationale: संकेतवाचक सर्वनाम सुरक्षित रखते हुए θησαυρός के सामान्य रूपकात्मक अर्थ को बिना व्याख्यात्मक विस्तार के व्यक्त करता है।
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: मिट्टी के बरतनों में
  rationale: ὀστράκινος पकी मिट्टी से बने होने और σκεῦος पात्र/बरतन को सूचित करता है। यह रूपक की साधारणता और नश्वरता को आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य तथा उसके फल, दोनों की सम्भावित छाया को हिन्दी के स्वाभाविक उद्देश्यसूचक संयोजक से व्यक्त करता है।
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: सामर्थ्य की यह असाधारण महानता
  rationale: ὑπερβολή के अत्यधिक अथवा सीमा से बढ़कर होने के भाव और यूनानी संज्ञात्मक रचना को यथासम्भव बनाए रखता है। ‘यह’ हिन्दी में उक्त सामर्थ्य को प्रसंग से जोड़ता है।
- source_word: ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν
  choice: यह स्पष्ट हो कि ... परमेश्वर की ओर से है, हमारी ओर से नहीं
  rationale: यूनानी में εἶναι के साथ संबंध/स्रोत का संक्षिप्त कथन है और ἐξ स्पष्टतः स्रोत बताता है। हिन्दी में केवल ‘परमेश्वर की हो’ अस्वाभाविक और संदिग्ध होता; ‘स्पष्ट हो’ ἵνα-वाक्य के आशय को स्वाभाविक बनाता है, जबकि ‘की ओर से’ स्रोत-विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: ‘खज़ाना’ और ‘मिट्टी के बरतन’ के रूपक की पहचान
  choice: मुख्य पाठ में रूपक को ज्यों का त्यों रखा गया है।
  alternative: ‘सुसमाचार का खज़ाना’ या ‘हमारे दुर्बल शरीरों में’ कहकर अर्थ खोलना।
  rationale: निकटवर्ती प्रसंग रूपक का संकेत देता है, पर इस पद में पौलुस स्वयं उसका ऐसा स्पष्ट विस्तार नहीं करता।
- issue: ἵνα-वाक्य का उद्देश्य अथवा परिणाम
  choice: ‘ताकि यह स्पष्ट हो’ द्वारा उद्देश्य को प्रमुख रखते हुए प्रकट परिणाम का भाव भी व्यक्त किया गया है।
  alternative: केवल परिणाम के रूप में ‘जिससे स्पष्ट होता है’ कहना।
  rationale: ἵνα सामान्यतः उद्देश्यसूचक है, यद्यपि यहाँ परिणाम का भाव भी सम्भव है; चुना हुआ रूप उद्देश्य को मिटाए बिना स्वाभाविक हिन्दी देता है।
- issue: τοῦ θεοῦ और ἐξ ἡμῶν में स्रोत/अधिकार का संबंध
  choice: ‘परमेश्वर की ओर से ... हमारी ओर से नहीं’
  alternative: ‘परमेश्वर की है, हमारी नहीं’
  rationale: यह अनुवाद शक्ति के स्रोत पर बल देता है, विशेषतः ἐξ ἡμῶν के कारण, पर मुख्य दावे—सामर्थ्य हमारा नहीं, परमेश्वर का है—को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बरतन’ अधिक प्रचलित है; अधिक औपचारिक ‘पात्र’ को पादटिप्पणी में दिया गया है। मुख्य पाठ में रूपक की व्याख्या नहीं जोड़ी गई।
