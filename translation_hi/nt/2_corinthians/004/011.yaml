id: 2CO.4.11
reference: 2 Corinthians 4:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: hi
  text: क्योंकि हम जो जीवित हैं, यीशु के कारण[a] सदा मृत्यु के हवाले किए जाते हैं, ताकि यीशु का जीवन भी हमारी नश्वर देह[b] में प्रकट हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यीशु के लिए” अथवा “यीशु के निमित्त”।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “देह” का अर्थ मृत्यु के अधीन शारीरिक अस्तित्व है, “पापी स्वभाव” नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεί
  choice: सदा
  rationale: यह लगातार या बार-बार बनी रहने वाली परिस्थिति व्यक्त करता है; ‘सदा’ संक्षिप्त और स्वाभाविक है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है और वाक्य-संबंध को स्पष्ट रखता है।
- source_word: οἱ ζῶντες
  choice: हम जो जीवित हैं
  rationale: वर्तमान कृदंत के निरंतर भाव को बनाए रखता है और इसी वाक्य में ‘मृत्यु’ के साथ उसका विरोध स्पष्ट करता है।
- source_word: εἰς θάνατον
  choice: मृत्यु के हवाले
  rationale: παραδιδόμεθα के साथ यह मृत्यु की ओर सौंपे जाने या उसका सामना करने के लिए दिए जाने का भाव व्यक्त करता है।
- source_word: παραδιδόμεθα
  choice: हवाले किए जाते हैं
  rationale: वर्तमान कर्मवाच्य के लगातार घटित होने वाले भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: διὰ Ἰησοῦν
  choice: यीशु के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण या आधार को दर्शाता है; यह दुःख यीशु से संबंध के कारण आता है। विकल्पों को पाद-टिप्पणी में रखा गया है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा परिणाम की दिशा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καὶ
  choice: भी
  rationale: मृत्यु के बीच यीशु के जीवन के प्रकट होने की संगति और समानांतरता को बनाए रखता है।
- source_word: ἡ ζωὴ τοῦ Ἰησοῦ
  choice: यीशु का जीवन
  rationale: मूल संबंधसूचक पदबंध को सीधे रखता है और मृत्यु के साथ धार्मिक-वैचारिक विरोध को सुरक्षित करता है।
- source_word: φανερωθῇ
  choice: प्रकट हो
  rationale: कर्मवाच्य संभावनार्थक भाव को बिना किसी कर्ता को जोड़े स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: हमारी नश्वर देह में
  rationale: ‘नश्वर’ शारीरिक मरणशीलता को स्पष्ट करता है और ‘देह’ σάρξ के यहाँ के वास्तविक शारीरिक अर्थ को सुरक्षित रखती है।
theological_decisions:
- issue: पौलुस के प्रयोग में σάρξ का अर्थ
  choice: नश्वर देह
  alternative: नश्वर शरीर; पापी स्वभाव
  rationale: इस संदर्भ में शब्द मनुष्य के मृत्यु के अधीन शारीरिक अस्तित्व को दर्शाता है, नैतिक अर्थ में ‘पापी स्वभाव’ को नहीं। ‘देह’ मूल शब्द की शारीरिक अनुगूँज रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- issue: διὰ Ἰησοῦν में कारण और उद्देश्य की निकटता
  choice: यीशु के कारण
  alternative: यीशु के लिए; यीशु के निमित्त
  rationale: διά के साथ कर्मकारक का प्रमुख भाव कारण है। फिर भी यीशु के प्रति निष्ठा के लिए सहा गया दुःख भी संदर्भ में निहित हो सकता है, इसलिए विकल्प पाद-टिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मृत्यु के हवाले किए जाते हैं’ मूल के कर्मवाच्य और सतत संकट को बनाए रखता है; ‘नश्वर देह’ पौलुस की शब्दावली को अनावश्यक सांप्रदायिक व्याख्या के बिना व्यक्त करती है।
