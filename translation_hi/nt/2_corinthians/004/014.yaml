reference: 2 Corinthians 4:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: hi
  text: क्योंकि हम जानते हैं कि जिसने यीशु[a] को जिलाया, वह हमें भी यीशु के साथ जिलाएगा और तुम्हारे साथ हमें प्रस्तुत करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में ‘यीशु’ के स्थान पर ‘प्रभु यीशु’ है।
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: क्योंकि हम जानते हैं
  rationale: यह कृदन्त प्रसंग में पौलुस के धीरज का कारण बताता है; हिन्दी में कारणवाचक उपवाक्य इसका अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ ἐγείρας τὸν Ἰησοῦν
  choice: जिसने यीशु को मरे हुओं में से जिलाया
  rationale: ἐγείρω यहाँ पुनरुत्थान के अर्थ में है। हिन्दी में केवल ‘उठाया’ अस्पष्ट हो सकता है, इसलिए ‘मरे हुओं में से जिलाया’ आशय को स्पष्ट करता है; कर्ता को यूनानी की तरह स्पष्ट नाम नहीं दिया गया।
- source_word: καὶ ἡμᾶς ... ἐγερεῖ
  choice: वह हमें भी ... जिलाएगा
  rationale: καί की योगात्मक शक्ति ‘भी’ से व्यक्त होती है और भावी पुनरुत्थान का समान क्रियापद ‘जिलाएगा’ बनाए रखता है।
- source_word: σὺν Ἰησοῦ
  choice: यीशु के साथ
  rationale: σύν सहचर्य या सहभागिता बताता है; ‘के साथ’ इसका सीधा और स्वाभाविक हिन्दी समतुल्य है, जबकि ‘यीशु के द्वारा’ अनावश्यक साधनवाचक अर्थ जोड़ता।
- source_word: παραστήσει
  choice: अपने सामने उपस्थित करेगा
  rationale: क्रिया किसी को सामने खड़ा करने या प्रस्तुत करने का भाव रखती है। ‘उपस्थित करेगा’ भावी दैवी प्रस्तुति को व्यक्त करता है; ‘अपने सामने’ निहित दैवी उपस्थिति स्पष्ट करता है, पर न्याय के सटीक दृश्य को निर्धारित नहीं करता।
- source_word: σὺν ὑμῖν
  choice: तुम्हारे साथ
  rationale: यह पौलुस और कुरिन्थियों की साझा भावी आशा को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἐγείρας के बाद पाठांतर
  choice: मुख्य पाठ में SBLGNT के अनुसार ‘यीशु’
  alternative: ‘प्रभु यीशु’
  rationale: SBLGNT का आधार-पाठ τὸν Ἰησοῦν है। अधिक विस्तृत पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है; दोनों पाठ यीशु के पुनरुत्थान की पुष्टि करते हैं।
- issue: σὺν Ἰησοῦ में पुनरुत्थान-संबंध
  choice: ‘यीशु के साथ जिलाएगा’
  alternative: ‘यीशु के द्वारा जिलाएगा’
  rationale: σύν मूलतः सहचर्य बताता है। अनुवाद विश्वासियों के पुनरुत्थान को यीशु के साथ जोड़ता है, बिना इसे साधनवाचक बनाकर तनाव को मिटाए।
- issue: παραστήσει का अंतकालीन भाव
  choice: ‘अपने सामने उपस्थित करेगा’
  alternative: सामान्य रूप से ‘सम्मान दिलाएगा’ अथवा विशेष रूप से ‘न्यायासन के सामने खड़ा करेगा’
  rationale: पुनरुत्थान का संदर्भ भावी दैवी प्रस्तुति की ओर संकेत करता है, पर यूनानी वाक्य यह स्पष्ट नहीं करता कि यह न्याय, स्वीकार या किसी अन्य विशिष्ट दृश्य का तकनीकी वर्णन है। चुना हुआ रूप इस व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘तुम्हारे’ बहुवचन समुदाय को संबोधित करता है। ‘मरे हुओं में से’ मूल में स्पष्ट रूप से नहीं है, पर पुनरुत्थान के संदर्भ में हिन्दी की अस्पष्टता दूर करने के लिए स्वाभाविक अर्थ-विस्तार है।
