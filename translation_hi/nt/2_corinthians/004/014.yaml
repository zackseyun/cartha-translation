    issue: The phrase ‘मरे हुओं में से’ is added to the first resurrection clause.
    rationale: The Greek says only that God ‘raised Jesus.’ The resurrection sense is clear from ἐγείρας and context, but ‘from among the dead’ is not expressed here and should not be added in an optimal-equivalence rendering.
  - severity: medium
    issue: The phrase ‘अपने सामने’ is added to the final clause.
    rationale: παραστήσει means ‘will present’ or ‘will cause to stand,’ but the Greek does not explicitly say ‘before himself.’ The divine subject supports the inference, yet the translation should preserve the source’s unelaborated expression.
  - severity: low
