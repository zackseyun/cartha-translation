base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/008.yaml
  text: We are afflicted in every way[a], but not crushed; perplexed[c][b], but not driven to despair.
translation:
  language: hi
  text: हम हर प्रकार से दबाए जाते हैं[a], पर कुचले नहीं जाते; असमंजस में पड़ते हैं, पर पूरी तरह निराश नहीं होते[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर बात में।” इसका अर्थ क्लेश के व्यापक दायरे से है, न कि आवश्यक रूप से चारों ओर से स्थानिक घेराव से।
    reason: lexical_alternative
  - marker: b
    text: या, “बिलकुल निरुपाय नहीं होते।” यूनानी शब्द पहले आए “असमंजस में पड़ते हैं” का अधिक तीव्र रूप है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντί
  choice: हर प्रकार से
  rationale: यह पदबंध दुःख के व्यापक दायरे या रीति को व्यक्त करता है; हिन्दी में ‘हर प्रकार से’ स्वाभाविक है और इसे केवल स्थान-संबंधी अर्थ तक सीमित नहीं करता।
- source_word: θλιβόμενοι
  choice: दबाए जाते हैं
  rationale: θλίβω बाहरी दबाव और क्लेश का बिंब रखता है। ‘दबाए जाते हैं’ इस बिंब को बनाए रखता है और अगले क्रियापद के साथ विरोध स्पष्ट करता है।
- source_word: στενοχωρούμενοι
  choice: कुचले नहीं जाते
  rationale: यह क्रिया संकुचित या तंग जगह में घिर जाने का भाव देती है। ‘कुचले नहीं जाते’ उस अंतिम परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है जिसे पौलुस नकारता है।
- source_word: ἀπορούμενοι
  choice: असमंजस में पड़ते हैं
  rationale: क्रिया का अर्थ किसी स्थिति में उपाय या दिशा न सूझना है। यह अनिश्चितता को व्यक्त करता है, पर अभी पूर्ण निराशा नहीं।
- source_word: ἐξαπορούμενοι
  choice: पूरी तरह निराश नहीं होते
  rationale: उपसर्ग ἐξ- पहले क्रियापद की तीव्रता बढ़ाता है। ‘पूरी तरह’ इस वृद्धि को दिखाता है, जबकि ‘निराश’ ऐसी अवस्था बताता है जिसमें कोई राह या आशा न दिखे।
- source_word: ἀλλ’ οὐ ... ἀλλ’ οὐκ
  choice: पर ... नहीं; ... पर ... नहीं
  rationale: दोहराया गया ‘पर ... नहीं’ मूल के संतुलित विरोध और लय को हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: दूसरे क्रियापद-युग्म में तीव्रता की मात्रा
  choice: ἐξαπορούμενοι को ‘पूरी तरह निराश नहीं होते’ कहना
  alternative: ‘बिलकुल निरुपाय नहीं होते’ या ‘पूरी तरह असमंजस में नहीं पड़ते’
  rationale: मूल में दूसरी क्रिया पहली का तीव्र रूप है। चुना हुआ अनुवाद आशा या उपाय के पूर्ण अभाव को नकारता है, पर इसे विश्वास खोने के किसी तकनीकी धर्मसैद्धांतिक दावे में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज वाक्य-विन्यास रखा गया है। मूल के दो समानांतर विरोधों और दबाव से विनाश तक तथा असमंजस से पूर्ण निराशा तक की तीव्रता को बनाए रखा गया है।
