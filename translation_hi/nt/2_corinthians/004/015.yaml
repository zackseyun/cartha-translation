source:
  edition: SBLGNT
  text: τὰ γὰρ πάντα δι’ ὑμᾶς, ἵνα ἡ χάρις πλεονάσασα διὰ τῶν πλειόνων τὴν εὐχαριστίαν περισσεύσῃ εἰς τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: hi
  text: क्योंकि सब कुछ तुम्हारे लिए है, ताकि अनुग्रह अधिक से अधिक लोगों[a] के द्वारा बढ़कर परमेश्वर की महिमा के लिए धन्यवाद को बहुतायत से बढ़ाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहुतों के द्वारा’ अथवा ‘लोगों की बढ़ती संख्या के द्वारा।’ यूनानी वाक्यांश सामान्य रूप से बहुत-से लोगों या लोगों की बढ़ती हुई संख्या—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: यह व्यापक, स्वाभाविक हिन्दी अभिव्यक्ति यूनानी नपुंसकलिंग बहुवचन के समग्र अर्थ को बनाए रखती है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार स्पष्ट करता है और हिन्दी में वाक्य के आरम्भ में सहज है।
- source_word: δι’ ὑμᾶς
  choice: तुम्हारे ही लिए
  rationale: यहाँ διά के साथ कर्मकारक हित या लाभ का भाव देता है; ‘ही’ इस बात पर उचित बल देता है कि ये सब बातें पाठकों के हित में हैं।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἡ χάρις
  choice: अनुग्रह
  rationale: यह परमेश्वर की कृपा और उसकी सक्रिय उदारता—दोनों की धार्मिक व्यापकता को बिना सीमित किए बनाए रखता है।
- source_word: πλεονάσασα
  choice: बढ़कर
  rationale: कृदन्त की आश्रित क्रिया को संक्षिप्त रखते हुए अनुग्रह के बढ़ने का भाव सुरक्षित रहता है।
- source_word: διὰ τῶν πλειόνων
  choice: अधिक से अधिक लोगों के द्वारा
  rationale: यह वाक्यांश लोगों की बढ़ती संख्या का प्रासंगिक अर्थ व्यक्त करता है, जबकि पादटिप्पणी यूनानी की अन्य संभव बारीकियाँ सुरक्षित रखती है।
- source_word: τὴν εὐχαριστίαν
  choice: धन्यवाद
  rationale: यह परमेश्वर की ओर निर्देशित कृतज्ञता की अभिव्यक्ति के लिए प्रचलित और सुसंगत शब्द है।
- source_word: περισσεύσῃ
  choice: और भी बढ़ाए
  rationale: यूनानी क्रिया यहाँ सकर्मक रूप में धन्यवाद को बहुतायत से बढ़ाने का भाव देती है; यह हिन्दी में कारणात्मक संबंध को स्पष्ट रखता है।
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: परमेश्वर की महिमा के लिए
  rationale: यह लक्ष्य अथवा परिणति का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: उद्देश्यवाचक उपवाक्य में ‘अनुग्रह’ का संदर्भ और प्रभाव
  choice: ‘अनुग्रह’ को परमेश्वर की सक्रिय कृपा के व्यापक अर्थ में रखा गया है, जो बढ़ती हुई धन्यवाद-भावना उत्पन्न करती है।
  alternative: इसे विशेष रूप से अधिक लोगों तक पहुँचने वाले उद्धारकारी अनुग्रह या प्रेरितीय सेवा में प्रकट कृपा के रूप में सीमित करना।
  rationale: पद स्वयं इन अर्थों में से किसी एक को निर्णायक रूप से नहीं चुनता; व्यापक शब्दावली मूल की धार्मिक अर्थ-समृद्धि और तनाव को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य शैली। मूल वाक्य के कारण, उद्देश्य और परिणाम के संबंधों को बनाए रखते हुए अत्यधिक शाब्दिक असहजता से बचा गया है।
