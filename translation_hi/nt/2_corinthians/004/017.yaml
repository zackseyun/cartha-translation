lexical_decisions:
- source_word: παραυτίκα
  choice: पल भर का
  rationale: यह वर्तमान और अस्थायी अवधि को व्यक्त करता है तथा आगे आने वाले ‘अनन्त’ के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: ἐλαφρόν
  choice: हलका
  rationale: ‘भार’ के साथ पौलुस के जानबूझकर रखे गए रूपकात्मक विरोध को सुरक्षित रखता है।
- source_word: θλίψεως
  choice: क्लेश
  rationale: दबाव, संकट और दुःख की गंभीरता व्यक्त करता है, पर किसी विशिष्ट अंत-कालीन तकनीकी अर्थ को अनिवार्य नहीं बनाता।
- source_word: ἡμῶν
  choice: हमारा
  rationale: संबंधवाचक अर्थ को सीधे व्यक्त करता है और क्लेश को वक्ता तथा उसके साथियों से जोड़ता है।
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολήν
  choice: जो हर तुलना से परे है
  rationale: यूनानी की तीव्रतासूचक पुनरुक्ति का स्वाभाविक हिन्दी रूप है और महिमा के असाधारण परिमाण को प्रकट करता है।
- source_word: αἰώνιον
  choice: अनन्त
  rationale: क्षणभंगुर क्लेश के विपरीत स्थायी, युगान्तकारी महिमा का स्वाभाविक हिन्दी समतुल्य है।
- source_word: βάρος
  choice: भार
  rationale: ‘हलका’ के साथ अलंकारिक विरोध बचाता है; ‘बोझ’ जैसा नकारात्मक भाव नहीं लाता।
- source_word: δόξης
  choice: महिमा का
  rationale: संबंधवाचक संरचना ‘महिमा का भार’ को बनाए रखती है और इसे केवल विशेषण में बदलकर अर्थ को सपाट नहीं करती।
- source_word: κατεργάζεται
  choice: उत्पन्न कर रहा है
  rationale: वर्तमानकालीन प्रभावकारी प्रक्रिया और परिणाम दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡμῖν
  choice: हमारे लिए
  rationale: सम्प्रदान कारक का हितार्थक अर्थ व्यक्त करता है; ‘हममें’ कहने से केवल भीतरी नैतिक परिवर्तन का अनावश्यक संकेत मिल सकता था।
- source_word: τὸ ... ἐλαφρὸν τῆς θλίψεως ἡμῶν
  choice: हमारा यह पल भर का हलका क्लेश
  rationale: मूल के सभी घटकों—अपनापन, अल्पकालिकता और हलकेपन—को स्वाभाविक हिन्दी क्रम में रखता है।
theological_decisions:
- issue: क्लेश द्वारा उत्पन्न महिमा का स्वरूप
  choice: वर्तमान क्लेश विश्वासियों के लिए भावी, अनन्त महिमा का परिणाम ला रहा है; अनुवाद यह नहीं कहता कि मनुष्य दुःख सहकर उद्धार अर्जित करता है।
  alternative: क्लेश मानवीय पुण्य के द्वारा महिमा कमाता है, अथवा केवल वर्तमान आत्मिक परिपक्वता उत्पन्न करता है।
  rationale: ‘पल भर’ और ‘अनन्त’ का विरोध भावी महिमा की ओर संकेत करता है। ‘उत्पन्न कर रहा है’ मूल में उपस्थित साधन-परिणाम संबंध को रखता है, पर योग्यता या अर्जित उद्धार का विचार नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप। ‘हलका’ और ‘भार’ का अलंकारिक विरोध तथा ‘पल भर’ और ‘अनन्त’ का कालगत विरोध सुरक्षित रखा गया है।
