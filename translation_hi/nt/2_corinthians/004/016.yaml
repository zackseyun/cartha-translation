  text: Διὸ οὐκ ⸀ἐγκακοῦμεν, ἀλλ’ εἰ καὶ ὁ ἔξω ἡμῶν ἄνθρωπος διαφθείρεται, ἀλλ’ ὁ ⸂ἔσω ἡμῶν⸃ ἀνακαινοῦται ἡμέρᾳ καὶ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: hi
  text: इसलिए हम हिम्मत नहीं हारते। यद्यपि हमारा बाहरी मनुष्य क्षीण होता जा रहा है,[a] फिर भी हमारा भीतरी मनुष्य दिन-प्रतिदिन नया किया जा रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारा बाहरी व्यक्ति” और “हमारा भीतरी व्यक्ति।” यूनानी में “मनुष्य” प्रतिनिधिक अर्थ में प्रयुक्त है और बाहरी तथा भीतरी मानव-जीवन के बीच जानबूझकर विरोध स्थापित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: οὐκ ἐγκακοῦμεν
  choice: हम हिम्मत नहीं हारते
  rationale: यह पौलुस के प्रयोग में निरुत्साहित न होने और साहस न छोड़ने का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀλλ’ εἰ καὶ
  choice: यद्यपि
  rationale: यह स्वीकारात्मक-विरोधात्मक भाव को हिन्दी में संक्षेप और स्वाभाविकता से प्रकट करता है।
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: हमारा बाहरी मनुष्य
  rationale: यह एकवचन ἄνθρωπος को बनाए रखता है और 'भीतरी मनुष्य' के साथ जानबूझकर रखे गए समानांतर विरोध को सुरक्षित करता है।
- source_word: διαφθείρεται
  choice: क्षीण होता जा रहा है
  rationale: वर्तमान काल में चल रही टूट-फूट अथवा गिरावट को व्यक्त करता है, विनाश की पूर्णता को नहीं।
- source_word: ἀλλ’
  choice: फिर भी
  rationale: पहले खंड की बाहरी क्षीणता और दूसरे खंड के भीतरी नवीनीकरण के बीच प्रबल विरोध स्पष्ट करता है।
- source_word: ὁ ἔσω ἡμῶν
  choice: हमारा भीतरी मनुष्य
  rationale: मूल के लुप्तपद विन्यास को 'बाहरी मनुष्य' के समानांतर पूरा करता है और पौलुस की अभिव्यक्ति को सुरक्षित रखता है।
- source_word: ἀνακαινοῦται
  choice: नया किया जा रहा है
  rationale: वर्तमान कर्मवाच्य के निरंतर और ग्रहण किए जा रहे नवीनीकरण को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: दिन-प्रतिदिन
  rationale: निरंतर, प्रत्येक दिन होने वाली प्रक्रिया का स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: ὁ ἔξω ἄνθρωπος और ὁ ἔσω के बीच मानवशास्त्रीय विरोध
  choice: '''बाहरी मनुष्य'' और ''भीतरी मनुष्य'' रखा गया है, बिना इसे पूर्ण देह-आत्मा द्वैत के रूप में परिभाषित किए।'
  alternative: '''बाहरी व्यक्तित्व'' और ''भीतरी व्यक्तित्व'' अथवा ''बाहरी जीवन'' और ''भीतरी जीवन'''
  rationale: मूल पाठ बाहरी क्षीणता और भीतरी नवीनीकरण का विरोध करता है, पर कोई विस्तृत तकनीकी मानवशास्त्र नहीं देता। शाब्दिक समानांतरता इस तनाव और पौलुस की विशिष्ट अभिव्यक्ति दोनों को बचाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। 'बाहरी मनुष्य/भीतरी मनुष्य' कुछ हद तक औपचारिक है, पर मूल की समानांतर शब्दावली और पौलुस की अभिव्यक्ति को सुरक्षित रखने के लिए चुना गया है; पादटिप्पणी अधिक सहज विकल्प स्पष्ट करती है।
