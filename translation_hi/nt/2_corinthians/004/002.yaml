reference: 2 Corinthians 4:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: hi
  text: बल्कि हमने उन गुप्त बातों को त्याग दिया है जो लज्जाजनक हैं; न हम धूर्तता से चलते हैं, न परमेश्वर के वचन में छल से मिलावट करते हैं[a]। इसके विपरीत, सत्य के प्रकट होने के द्वारा हम हर व्यक्ति के विवेक के समक्ष अपने आपको प्रशंसनीय ठहराते हैं, परमेश्वर के सामने[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के वचन को छल से बिगाड़ते हैं।” मूल क्रिया में धोखे से किसी वस्तु को मिलावटी या भ्रष्ट करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने आपको अनुशंसित करते हैं” या “अपने आपको ग्रहणयोग्य रूप में प्रस्तुत करते हैं।” यहाँ मूल क्रिया का अर्थ अपने आपको अनुकूल या प्रशंसनीय रूप में प्रस्तुत करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: हमने ... त्याग दिया है
  rationale: अओरिस्ट मध्य रूप एक निर्णायक अस्वीकार को व्यक्त करता है। हिंदी में यह स्वाभाविक और गंभीर है।
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: लज्जा की छिपी हुई बातें
  rationale: संबंधकारक संरचना को यथासंभव बनाए रखता है और उन गुप्त बातों या आचरणों को दर्शाता है जिनका चरित्र लज्जाजनक है।
- source_word: περιπατοῦντες ἐν πανουργίᾳ
  choice: धूर्तता से चलते हैं
  rationale: चलना जीवन और आचरण का पौलुसी रूपक बनाए रखता है; धूर्तता πανουργία की अनैतिक चतुराई व्यक्त करती है।
- source_word: δολοῦντες
  choice: छल से मिलावट करते हैं
  rationale: क्रिया में धोखे से किसी वस्तु को भ्रष्ट या मिलावटी बनाने का सजीव भाव है; यह केवल सामान्य विकृति से अधिक विशिष्ट है।
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: λόγος की व्यापकता और धार्मिक गंभीरता को बिना केवल लिखित शास्त्र या केवल प्रचारित संदेश तक सीमित किए सुरक्षित रखता है।
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: सत्य को प्रकट करके
  rationale: φανέρωσις का मूल भाव सत्य को स्पष्ट या प्रत्यक्ष कर देना है; इसे केवल मौखिक घोषणा तक सीमित नहीं करता।
- source_word: συνιστάνοντες ἑαυτούς
  choice: अपने आपको खरा ठहराते हैं
  rationale: हिंदी में विवेक के समक्ष स्वयं को अनुमोदन योग्य सिद्ध करने का भाव स्वाभाविक ढंग से व्यक्त करता है, बिना आत्मप्रशंसा का अनावश्यक संकेत दिए।
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: हर मनुष्य के विवेक के समक्ष
  rationale: πᾶσαν का वितरणात्मक भाव और συνείδησις की नैतिक चेतना दोनों बनाए रखता है।
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर के सामने
  rationale: परमेश्वर की उपस्थिति, साक्षी और न्याय के भाव को संक्षिप्त तथा स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: कपटपूर्ण सेवा और सत्यपूर्ण सेवा के बीच पौलुस का विरोध
  choice: पद को सेवा में नैतिक पारदर्शिता और सत्य को प्रत्यक्ष करने के वर्णन के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल भाषण-कौशल की निंदा या समस्त शास्त्र-व्याख्या पर एक तकनीकी सिद्धांत के रूप में पढ़ना।
  rationale: तात्कालिक प्रसंग प्रेरिताई सेवा के आचरण और संदेश से जुड़ा है; अनुवाद उससे अधिक संकीर्ण या अधिक व्यापक सांप्रदायिक दावा नहीं जोड़ता।
- issue: συνιστάνοντες का आशय
  choice: विवेक के समक्ष अपने आपको खरा ठहराना
  alternative: अपनी प्रशंसा करना
  rationale: यहाँ भाव सत्य के खुले प्रकटीकरण के द्वारा अनुमोदन योग्य सिद्ध होने का है, न कि निराधार आत्मप्रशंसा का।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। पौलुसी ‘चलना’ रूपक रखा गया है। लंबे यूनानी वाक्य को हिंदी की स्पष्टता के लिए दो वाक्यों में बाँटा गया है, जबकि विरोधात्मक संरचना सुरक्षित है।
