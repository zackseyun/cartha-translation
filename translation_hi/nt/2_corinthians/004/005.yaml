source:
  edition: SBLGNT
  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your servants for Jesus' sake.
translation:
  language: hi
  text: क्योंकि हम अपने आप का प्रचार नहीं करते, बल्कि मसीह यीशु[a] को प्रभु के रूप में घोषित करते हैं; और यीशु के कारण[c] अपने आपको तुम्हारे दास[b] के रूप में घोषित करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्राइस्ट यीशु।” यूनानी Χριστός का अर्थ “मसीह” है, पर जहाँ यह नाम की तरह प्रयुक्त हो वहाँ इसका लिप्यंतर भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “सेवक।” यूनानी शब्द दास या सेवक के लिए प्रयुक्त हो सकता है; यहाँ “दास” प्रभु के अधीन होने का अधिक प्रबल भाव रखता है।
    reason: lexical_alternative
  - marker: c
    text: या, “यीशु की खातिर।”
    reason: translation_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: प्रचार नहीं करते / घोषित करते हैं
  rationale: एक ही यूनानी क्रिया दोनों खंडों पर लागू होती है। हिन्दी में पहले खंड में ‘प्रचार करना’ और प्रभुता की विधेयात्मक घोषणा वाले दूसरे खंड में ‘घोषित करना’ अधिक स्वाभाविक है; दोनों सार्वजनिक उद्घोषणा का भाव रखते हैं।
- source_word: ἑαυτοὺς
  choice: अपना / अपने आपको
  rationale: 'दोहराए गए आत्मवाचक सर्वनाम का विरोध सुरक्षित रखा गया है: प्रचार का विषय प्रचारक स्वयं नहीं हैं, पर वे कुरिन्थियों के संबंध में अपने आपको दास बताते हैं।'
- source_word: Χριστὸν Ἰησοῦν
  choice: मसीह यीशु
  rationale: यूनानी शब्दक्रम रखा गया है और Χριστός के पदवीगत अर्थ को ‘मसीह’ से व्यक्त किया गया है।
- source_word: κύριον
  choice: प्रभु के रूप में
  rationale: 'κύριον यहाँ विधेयात्मक है: यीशु को प्रभु घोषित किया जाता है। ‘के रूप में’ इस संबंध को बिना अतिरिक्त स्वतंत्र वाक्य जोड़े स्पष्ट करता है।'
- source_word: δούλους
  choice: दास
  rationale: ‘दास’ अधीनता के प्रबल अर्थ को बनाए रखता है और यीशु के ‘प्रभु’ होने के साथ जानबूझकर रखे गए विरोध को स्पष्ट करता है।
- source_word: ὑμῶν
  choice: तुम्हारे
  rationale: सम्बन्धकारक ὑμῶν को सीधे संबंधसूचक ‘तुम्हारे’ से व्यक्त किया गया है।
- source_word: διὰ Ἰησοῦν
  choice: यीशु के कारण
  rationale: 'διά के साथ कर्मकारक यहाँ कारण या प्रेरणा बताता है: कुरिन्थियों के प्रति उनका दासत्व यीशु के कारण है।'
theological_decisions:
- issue: Χριστός को पदवी मानना या नाम-सदृश रूप
  choice: पदवीगत ‘मसीह’
  alternative: ‘ख्रीष्ट’ या नाम-सदृश ‘क्राइस्ट’
  rationale: यह वाक्य यीशु के विषय में उद्घोषणा प्रस्तुत करता है, इसलिए अभिषिक्त जन की पदवी का अर्थ सक्रिय रखा गया है।
- issue: Χριστὸν Ἰησοῦν κύριον में κύριον का संबंध
  choice: ‘मसीह यीशु को प्रभु के रूप में घोषित करते हैं’
  alternative: ‘प्रभु मसीह यीशु का प्रचार करते हैं’
  rationale: κύριον को विधेयात्मक मानना इस बात को सुरक्षित रखता है कि उद्घोषणा यीशु की प्रभुता की है; हिन्दी में ‘के रूप में’ यूनानी संरचना को स्पष्ट और स्वाभाविक बनाता है।
- issue: δοῦλος की प्रबलता
  choice: ‘दास’
  alternative: ‘सेवक’
  rationale: प्रभु-दास का विरोध इस पद में अर्थपूर्ण है। ‘सेवक’ अधिक सहज है, पर वह अधीनता की तीव्रता कम कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘तुम्हारे’ मूल के बहुवचन संबोधन को रखता है। अर्धविराम उद्घोषणा के दो परस्पर-विरोधी पक्षों—यीशु की प्रभुता और प्रचारकों के दासत्व—को स्पष्ट करता है।
