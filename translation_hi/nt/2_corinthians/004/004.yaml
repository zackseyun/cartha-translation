  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि वे मसीह की महिमा के सुसमाचार का प्रकाश न देख सकें।” यहाँ प्रयुक्त दुर्लभ क्रिया प्रकाश के चमकने या लोगों के उसे देखने—दोनों में से किसी भाव पर बल दे सकती है।
    reason: lexical_alternative
