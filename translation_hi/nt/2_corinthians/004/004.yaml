  rationale: दुर्लभ क्रिया दोनों अर्थों की अनुमति दे सकती है। मुख्य पाठ में ‘प्रकाश’ के साथ स्वाभाविक चमकने का अर्थ लिया गया है और वास्तविक वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
