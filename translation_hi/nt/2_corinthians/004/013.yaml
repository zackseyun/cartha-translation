source:
  edition: SBLGNT
  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: hi
  text: परन्तु विश्वास की वही आत्मा हमारे पास है[a], जैसा लिखा है, “मैंने विश्वास किया, इसलिए मैंने कहा,” हम भी विश्वास करते हैं; इसलिए हम भी बोलते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विश्वास की वही आत्मा’ का अर्थ विश्वास से भरा वही मनोभाव हो सकता है; अथवा यहाँ ‘आत्मा’ पवित्र आत्मा की ओर संकेत कर सकता है।
    reason: alternative_reading
  - marker: b
    text: पौलुस भजन 116:10 का उद्धरण करता है (यूनानी पुराना नियम 115:1) और अपने विश्वास तथा बोलने को भजनकार की गवाही के साथ जोड़ता है।
    reason: cross_reference
lexical_decisions:
- source_word: Ἔχοντες δὲ
  choice: परन्तु हमारे पास ... है
  rationale: यूनानी कृदन्त मुख्य क्रिया से जुड़ा है; हिन्दी में स्वाभाविक पूर्ण वाक्य-रचना अपनाई गई है। δέ का हल्का विरोध ‘परन्तु’ से व्यक्त होता है।
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: विश्वास की वही आत्मा
  rationale: ‘आत्मा’ πνεῦμα की अस्पष्टता बनाए रखती है—यह विश्वासपूर्ण मनोभाव अथवा पवित्र आत्मा का संकेत हो सकता है। ‘विश्वास की’ संबंधकारक रचना को सुरक्षित रखता है।
- source_word: κατὰ τὸ γεγραμμένον
  choice: जैसा लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण का स्वाभाविक और प्रतिष्ठित हिन्दी सूत्र है।
- source_word: Ἐπίστευσα, διὸ ἐλάλησα
  choice: मैंने विश्वास किया, इसलिए मैंने कहा
  rationale: विश्वास करने और बोलने के कारणात्मक संबंध को सीधे रखा गया है; उद्धरण में भूतकाल सुरक्षित है।
- source_word: καὶ ἡμεῖς πιστεύομεν
  choice: वैसे ही हम भी विश्वास करते हैं
  rationale: καί और बलाघाती ἡμεῖς द्वारा भजनकार और पौलुस के बीच स्थापित समानता को ‘वैसे ही ... भी’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: διὸ καὶ λαλοῦμεν
  choice: इसलिए हम बोलते भी हैं
  rationale: διό का निष्कर्षात्मक अर्थ और καί का ‘भी’ दोनों सुरक्षित हैं।
theological_decisions:
- issue: क्या πνεῦμα पवित्र आत्मा को दर्शाता है या विश्वास से भरे साझा मनोभाव को
  choice: मुख्य पाठ में ‘आत्मा’, बिना व्याख्यात्मक विशेषण के
  alternative: ‘पवित्र आत्मा’ अथवा ‘विश्वास से भरा मनोभाव’
  rationale: यूनानी पाठ किसी एक अर्थ को निर्णायक नहीं बनाता। मुख्य पाठ ‘आत्मा’ के द्वारा अस्पष्टता बनाए रखता है और पादटिप्पणी दोनों संभावनाएँ बताती है।
- issue: πιστεύω शब्द-समूह का अनुवाद
  choice: विश्वास किया / विश्वास करते हैं
  alternative: भरोसा किया / भरोसा रखते हैं
  rationale: यह संज्ञा πίστις के साथ शब्दगत संबंध बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। उद्धरण-सूत्र पारंपरिक रूप से परिचित है, पर भाषा अनावश्यक रूप से पुरातन नहीं है।
