id: 2CO.4.10
reference: 2 Corinthians 4:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πάντοτε τὴν νέκρωσιν ⸀τοῦ Ἰησοῦ ἐν τῷ σώματι περιφέροντες, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ ἐν τῷ σώματι ἡμῶν φανερωθῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/010.yaml
  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: hi
  text: हम शरीर में यीशु की मृत्यु[a] को सदा लिए फिरते हैं, ताकि यीशु का जीवन भी हमारे शरीर में प्रकट हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु के मरने को।” यूनानी संज्ञा शरीर में सहन की जाने वाली मृत्यु की दशा या अनुभव पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: सदा
  rationale: यह निरंतर परिस्थिति को व्यक्त करता है; ‘सदा’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: νέκρωσιν
  choice: मृत्यु
  rationale: यह संज्ञा मृत्यु, मृत दशा या मृत्यु के अनुभव का बोध करा सकती है। यहाँ ‘मृत्यु’ आगे आने वाले ‘जीवन’ के साथ समानांतरता बनाए रखती है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: τοῦ Ἰησοῦ
  choice: यीशु की
  rationale: संबंधकारक को बिना अधिक व्याख्या जोड़े औपचारिक रूप से रखा गया है, जिससे यीशु से संबद्ध मृत्यु का सटीक संबंध संदर्भ के लिए खुला रहता है।
- source_word: ἐν τῷ σώματι
  choice: शरीर में
  rationale: पहले प्रयोग में यूनानी पाठ में अधिकारवाचक सर्वनाम नहीं है; इसलिए ‘हमारे’ जोड़कर दूसरे वाक्यांश से व्याख्यात्मक समानता नहीं की गई।
- source_word: περιφέροντες
  choice: लिए फिरते हैं
  rationale: वर्तमान कृदंत लगातार अपने साथ ढोने का अर्थ देता है। ‘लिए फिरते हैं’ आधुनिक हिन्दी में स्वाभाविक ढंग से इस सतत, देहगत वहन को व्यक्त करता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणाम का संबंध व्यक्त करता है; ‘ताकि’ सहज आधुनिक हिन्दी है।
- source_word: καὶ
  choice: भी
  rationale: यह यीशु की मृत्यु और उनके जीवन के बीच अनुरूप जोड़ को बनाए रखता है।
- source_word: ζωὴ
  choice: जीवन
  rationale: मूल शब्द का सीधा और स्वाभाविक अनुवाद है; संदर्भ में यह यीशु के प्रकट होने वाले जीवन को दर्शाता है।
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: हमारे शरीर में
  rationale: यूनानी में ‘शरीर’ एकवचन है और अधिकारवाचक बहुवचन। हिन्दी में सामूहिक एकवचन सहज है और मूल की अलंकारिक समानांतरता बनाए रखता है।
- source_word: φανερωθῇ
  choice: प्रकट हो
  rationale: यह ἵνα के बाद कर्मवाच्य संभावनार्थक रूप है। ‘प्रकट हो’ स्वाभाविक है और किसी कर्ता को अनावश्यक रूप से स्पष्ट किए बिना मूल का कर्मवाच्य भाव रखता है।
theological_decisions:
- issue: νέκρωσις का यीशु के संबंध में अर्थ
  choice: ‘यीशु की मृत्यु’
  alternative: ‘यीशु का मरना’ या ‘यीशु की मृत्यु-दशा’
  rationale: ‘मृत्यु’ संज्ञा के मूल अर्थ और ‘यीशु का जीवन’ के साथ समानांतरता को अच्छी तरह रखती है। फिर भी मृत्यु की दशा या अनुभव का अर्थ संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: σῶμα की वचन-संख्या
  choice: दोनों स्थानों पर एकवचन ‘शरीर’
  alternative: दूसरे स्थान पर ‘हमारे शरीरों में’
  rationale: यूनानी पाठ दोनों बार एकवचन का प्रयोग करता है। इसे बनाए रखने से पौलुस की सामूहिक देहगत सेवकाई का भाव और वाक्य की समानांतर रचना सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘लिए फिरते हैं’ सतत वहन की सजीवता रखता है; ‘प्रकट हो’ धार्मिक संदर्भ में परिचित होते हुए भी वर्तमान हिन्दी में सहज है।
