source:
  edition: SBLGNT
  text: Τοῦτο δέ, ὁ σπείρων φειδομένως φειδομένως καὶ θερίσει, καὶ ὁ σπείρων ἐπ’ εὐλογίαις ἐπ’ εὐλογίαις καὶ θερίσει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: hi
  text: 'बात यह है: जो थोड़ा बोता है, वह थोड़ा ही काटेगा; और जो आशीषों के साथ[a] बोता है, वह आशीषों के साथ ही काटेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आशीषों के साथ’ का अनुवाद ‘उदारता से’ या ‘बहुतायत से’ भी हो सकता है। यूनानी में यहाँ ‘आशीषों’ संज्ञा का प्रयोग है, जो इस संदर्भ में उदार मात्रा को मुहावरेदार ढंग से व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: 'बात यह है:'
  rationale: यह पद एक सूत्रवत सिद्धांत प्रस्तुत करता है। यह हिन्दी में स्वाभाविक है और δέ के हल्के प्रसंग-परिवर्तन को बिना अनावश्यक कालसूचक शब्द जोड़े व्यक्त करता है।
- source_word: ὁ σπείρων
  choice: जो ... बोता है
  rationale: संज्ञात्मक वर्तमान कृदंत का सामान्य, लोकोक्तिपरक अर्थ है; यह रूप हिन्दी में उसी प्रतिनिधिक व्यापकता को स्वाभाविक ढंग से रखता है।
- source_word: φειδομένως
  choice: थोड़ा
  rationale: संदर्भ में इसका अर्थ कम या सीमित मात्रा में है। 'थोड़ा' बोने-काटने के कृषि-रूपक में सहज है और 'कंजूसी से' जैसी अतिरिक्त नैतिक निंदा नहीं जोड़ता।
- source_word: καὶ θερίσει
  choice: वह ... ही काटेगा
  rationale: καί बोने के ढंग और उसके अनुरूप परिणाम को जोड़ता है। हिन्दी का 'ही' इस अनुरूपता और समानांतरता को स्पष्ट तथा स्वाभाविक बनाता है।
- source_word: ἐπ’ εὐλογίαις
  choice: आशीषों के साथ
  rationale: यह εὐλογία के संज्ञात्मक 'आशीष' अर्थ को और दोनों प्रयोगों की पुनरावृत्ति को बचाता है। प्रसंग में इसका मुहावरेदार आशय उदार मात्रा से भी हो सकता है, जिसे पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: ἐπ’ εὐλογίαις का अर्थ
  choice: '''आशीषों के साथ'' रखकर आशीष-संबंधी शब्दावली और उसकी पुनरावृत्ति सुरक्षित रखी गई।'
  alternative: '''उदारता से'' या ''बहुतायत से'''
  rationale: दान के संदर्भ में उदारता का अर्थ उचित है, पर मूल में संज्ञा εὐλογία है। शाब्दिक प्रतिध्वनि बनाए रखने से उदार देने और आशीष के बीच पौलुस का संबंध बना रहता है, जबकि इसे भौतिक समृद्धि की यांत्रिक गारंटी नहीं बनाया जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। कृषि-रूपक में प्रचलित 'बोना/काटना' रखा गया है। 'आशीषों के साथ' जानबूझकर कुछ असामान्य रखा गया है ताकि मूल की वास्तविक शब्दावली और अर्थगत तनाव न मिटे; पादटिप्पणी इसका मुहावरेदार विकल्प स्पष्ट करती है।
