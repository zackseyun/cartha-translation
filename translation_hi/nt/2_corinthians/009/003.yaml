  text: परन्तु मैंने भाइयों को भेजा, ताकि इस मामले में[b] हमने तुम्हारे विषय में जो गर्व की बातें कही हैं, वे व्यर्थ न ठहरें[a], ताकि, जैसा मैं कहता आया था, तुम तैयार रहो।
