    text: या “इस संबंध में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψα
  choice: मैंने ... भेजा
  rationale: अओरिस्ट सूचक रूप को इस वर्णनात्मक संदर्भ में सामान्य भूतकाल से व्यक्त किया गया है।
- source_word: τοὺς ἀδελφούς
  choice: भाइयों को
  rationale: यहाँ यूनानी पुल्लिंग बहुवचन निकटवर्ती संदर्भ में बताए गए विशिष्ट पुरुष प्रतिनिधियों की ओर संकेत करता है।
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: तुम्हारे विषय में हमारा गर्व
  rationale: καύχημα गर्व करने या गर्व के आधार का भाव रखता है; यह वाक्यांश कुरिन्थियों के विषय में पौलुस के गर्वपूर्ण कथन को दर्शाता है।
- source_word: κενωθῇ
  choice: खोखला न ठहरे
  rationale: यह निष्क्रिय अओरिस्ट संभावनार्थक रूप ἵνα μή के बाद रोकथाम का उद्देश्य व्यक्त करता है। 'खोखला' मूल शब्द की खाली या निष्फल हो जाने की छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν τῷ μέρει τούτῳ
  choice: इस मामले में
  rationale: μέρος यहाँ किसी भौतिक भाग के बजाय किसी विशेष विषय या संबंध में प्रयुक्त हुआ है।
- source_word: καθὼς ἔλεγον
  choice: जैसा मैं कहता आया था
  rationale: अपूर्ण भूतकाल ἔλεγον पहले से जारी या दोहराए गए कथन का संकेत देता है, जिसे 'कहता आया था' व्यक्त करता है।
- source_word: παρεσκευασμένοι ἦτε
  choice: तुम तैयार रहो
  rationale: परिप्रयुक्त पूर्णकालिक रचना अपेक्षित तैयार अवस्था पर बल देती है; उद्देश्यवाचक हिन्दी में 'तैयार रहो' स्वाभाविक रूप से उसी परिणामी अवस्था को व्यक्त करता है।
