source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers[a] to go to you ahead of us and arrange in advance the generous gift[b] you had promised, so that it would be ready as a generous gift and not as something extorted[c].
translation:
  language: hi
  text: इसलिए मैंने भाइयों[a] से आग्रह करना आवश्यक समझा कि वे हमसे पहले आपके पास जाएँ और उस उदार भेंट[b] को, जिसका आपने पहले वादा किया था, पहले से तैयार कर दें, ताकि वह इस प्रकार तैयार रहे कि वह उदार भेंट हो, न कि दबाव डालकर वसूली गई भेंट।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यदि यहाँ प्रतिनिधिमंडल में स्त्री-पुरुष दोनों सम्मिलित समझे जाएँ, तो इसका अनुवाद “भाई-बहनों” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “आशीष” है; यहाँ इससे कुरिन्थियों की प्रतिज्ञात उदार भेंट अभिप्रेत है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी शब्द का सामान्य अर्थ “लोभ” या “लालच” है; यहाँ वह ऐसी वसूली का भाव देता है जो उदारता से नहीं, बल्कि दबाव डालकर कराई गई हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον οὖν ἡγησάμην
  choice: इसलिए मैंने यह ज़रूरी समझा
  rationale: यह पौलुस के व्यावहारिक निर्णय और आवश्यकता-बोध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παρακαλέσαι
  choice: आग्रह करूँ
  rationale: संदर्भ में यह भाइयों को शीघ्र कार्रवाई के लिए गंभीरतापूर्वक प्रेरित करने का भाव देता है।
- source_word: τοὺς ἀδελφοὺς
  choice: भाइयों
  rationale: यूनानी रूप पुल्लिंग बहुवचन है; सम्भावित समावेशी अर्थ को पादटिप्पणी में रखा गया है।
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: वे हमसे पहले आपके पास जाएँ
  rationale: क्रिया के आगे जाने के भाव को यात्रा-संदर्भ के निहित तुलना-बिंदु सहित स्पष्ट करता है।
- source_word: προκαταρτίσωσι
  choice: पहले से प्रबंध कर दें
  rationale: यह पौलुस के आने से पहले प्रतिज्ञात चंदे को व्यवस्थित और तैयार करने का भाव देता है।
- source_word: τὴν προεπηγγελμένην εὐλογίαν ὑμῶν
  choice: उस उदार भेंट का ... जिसका आपने वादा किया था
  rationale: संग्रह के संदर्भ में εὐλογία प्रतिज्ञात उदार योगदान को दर्शाता है; उसका शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: οὕτως ὡς εὐλογίαν
  choice: एक उदार भेंट के रूप में
  rationale: εὐλογία की पुनरावृत्ति और उदारता के सकारात्मक स्वर को सहज हिन्दी में बनाए रखता है।
- source_word: πλεονεξίαν
  choice: दबाव डालकर वसूली गई चीज़
  rationale: सामान्यतः लोभ या लालच बताने वाला यह शब्द यहाँ ऐसी भेंट का चित्र खींचता है जिसे उदारतापूर्वक देने के बजाय दबाव से निकलवाया गया हो।
theological_decisions:
- issue: ἀδελφοὺς का लिंग-संबंधी संदर्भ
  choice: भाइयों
  alternative: भाई-बहनों
  rationale: मूल का व्याकरणिक पुल्लिंग मुख्य पाठ में रखा गया है, जबकि प्रतिनिधिमंडल के समावेशी रूप से समझे जाने की वास्तविक सम्भावना पादटिप्पणी में दी गई है।
- issue: संग्रह के संदर्भ में εὐλογία का अर्थ
  choice: उदार भेंट
  alternative: आशीष
  rationale: यहाँ शब्द कुरिन्थियों के प्रतिज्ञात योगदान के लिए प्रयुक्त है। 'उदार भेंट' संदर्भगत अर्थ स्पष्ट करता है, जबकि 'आशीष' की मूल छवि पादटिप्पणी में सुरक्षित रखी गई है।
- issue: πλεονεξία के संदर्भगत अर्थ का रूपांतरण
  choice: दबाव डालकर वसूली गई चीज़
  alternative: लोभ / लालच
  rationale: सीधे 'लोभ' कहने से हिन्दी में भेंट और लोभ के बीच व्याकरणिक तथा अर्थगत विरोध अस्पष्ट रहता। चुना हुआ रूप उस अर्थ को व्यक्त करता है कि योगदान उदार भेंट न लगे, बल्कि दबाव से निकलवाई गई राशि लगे।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘चंदा’ की अपेक्षा ‘भेंट’ धार्मिक और प्रसंगानुकूल है; ‘दबाव डालकर वसूली गई चीज़’ अंतिम विरोध को सामान्य पाठक के लिए स्पष्ट रखता है।
