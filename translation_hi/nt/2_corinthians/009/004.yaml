source:
  edition: SBLGNT
  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: hi
  text: कहीं ऐसा न हो कि यदि मेरे साथ कुछ मकिदुनी आएँ और तुम्हें तैयार न पाएँ, तो इस भरोसे[a] के विषय में हमें—तुम्हारी तो बात ही न करें[b]—लज्जित होना पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस भरोसे में।” संदर्भ में यूनानी शब्द का अर्थ “उद्यम” या “परिस्थिति” भी हो सकता है, पर यहाँ संभवतः यह तुम्हारे विषय में पौलुस के भरोसे को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारा उल्लेख न करें।” पौलुस बीच में यह संकेत करता है कि यदि वे तैयार न पाए गए, तो कुरिन्थियों को भी लज्जित होना पड़ेगा।
    reason: alternative_reading
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: कहीं ऐसा न हो कि यदि
  rationale: यह पदबंध भविष्य की एक आशंकित संभावना व्यक्त करता है; हिंदी में यह रचना निषेधात्मक चिंता और शर्त, दोनों को बनाए रखती है।
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: कोई मकिदुनी मेरे साथ आएँ
  rationale: अनिश्चित और संभाव्य व्यक्तियों का भाव रखने के लिए ‘कोई’ लिया गया है; बहुवचन क्रिया यूनानी जातिवाचक बहुवचन के अनुरूप है।
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: तुम्हें तैयार न पाएँ
  rationale: यह स्वाभाविक आधुनिक हिंदी में संग्रह की तैयारी पूरी न होने का अर्थ स्पष्ट करता है।
- source_word: καταισχυνθῶμεν
  choice: हमें लज्जित होना पड़े
  rationale: इससे संभाव्य भविष्य और दूसरों के सामने लज्जा की निष्क्रिय/सामाजिक छाया व्यक्त होती है।
- source_word: ἡμεῖς
  choice: हमें
  rationale: यूनानी सर्वनाम बलाघाती है; वाक्य में ‘हमें—तुम्हारी तो बात ही छोड़ो—’ द्वारा उसका जोर सुरक्षित रखा गया है।
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: तुम्हारी तो बात ही छोड़ो
  rationale: यह बीच की टिप्पणी कुरिन्थियों की संभावित लज्जा को बिना कठोरता से सीधे कहे संकेतित करती है।
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: इस भरोसे के विषय में
  rationale: संदर्भ में ὑπόστασις पौलुस के कुरिन्थियों पर भरोसे या उसके आधार को दर्शाता है; बाद के दार्शनिक अर्थ ‘तत्त्व/सत्ता’ से बचा गया है।
theological_decisions:
- issue: गैर-पारिभाषिक पौलुसी संदर्भ में ὑπόστασις का अर्थ
  choice: भरोसा
  alternative: उद्यम या परिस्थिति
  rationale: निकटवर्ती संदर्भ कुरिन्थियों की तैयारी के विषय में पौलुस के भरोसे का है। फिर भी शब्द की संदर्भगत व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए सुलभ रूप। ‘कहीं ऐसा न हो’ आशंका को, डैश पौलुस की बीच की टिप्पणी को, और ‘भरोसा’ संदर्भगत अर्थ को व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
