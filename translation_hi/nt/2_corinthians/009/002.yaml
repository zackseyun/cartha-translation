source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: hi
  text: क्योंकि मैं तुम्हारी तत्परता[a] जानता हूँ, जिसके विषय में मैं मकिदुनियावासियों से तुम्हारी ओर से गर्व से कहता हूँ कि अखाया पिछले वर्ष से तैयार है[b]; और तुम्हारे उत्साह ने उनमें से अधिकांश को उभारा है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उत्सुकता” अथवा “तैयार रहने की इच्छा।”
    reason: lexical_alternative
  - marker: b
    text: अखाया रोमी प्रांत था, जिसमें कुरिन्थ भी था; यहाँ प्रदेश का नाम वहाँ के विश्वासियों के लिए प्रयुक्त हुआ है।
    reason: cultural_note
  - marker: c
    text: या, “बहुसंख्यक” या “अधिकतर लोग”; अर्थात् मकिदुनियावासियों में से अधिकतर।
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμίαν
  choice: तत्परता
  rationale: यह शब्द मन की इच्छापूर्ण तैयारी और उत्सुकता दोनों व्यक्त करता है; ‘तत्परता’ दान देने की तैयार इच्छा को स्वाभाविक हिन्दी में रखता है।
- source_word: καυχῶμαι
  choice: गर्व से कहता हूँ
  rationale: καυχάομαι की प्रबल सार्वजनिक शेखी/गर्व की वाचिक धारणा को बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὑπὲρ ὑμῶν
  choice: तुम्हारे विषय में
  rationale: καυχῶμαι के साथ यह उनके पक्ष में और उनके बारे में गर्व से बोलने को दर्शाता है; हिन्दी में ‘तुम्हारे विषय में’ स्पष्ट और सहज है।
- source_word: Μακεδόσιν
  choice: मकिदुनियावासियों के सामने
  rationale: यह मकिदुनिया के लोगों को सूचित करता है जिनके बीच पौलुस यह बात कहता है; ‘के सामने’ कथन के श्रोताओं को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἀχαΐα
  choice: अखाया
  rationale: यूनानी पाठ के भौगोलिक नाम को सुरक्षित रखा गया है; यहाँ प्रदेश अपने विश्वासियों, विशेषकर कुरिन्थ के लोगों, के लिए लक्षणा रूप में प्रयुक्त है।
- source_word: παρεσκεύασται
  choice: तैयार है
  rationale: पूर्णकाल से उत्पन्न वर्तमान अवस्था व्यक्त होती है; ‘पिछले वर्ष से तैयार है’ इस निरंतर स्थिति को स्वाभाविक हिन्दी में बताता है।
- source_word: ἀπὸ πέρυσι
  choice: पिछले वर्ष से
  rationale: मुहावरा पिछले वर्ष से वर्तमान तक चली आ रही अवधि को दर्शाता है।
- source_word: τὸ ὑμῶν ζῆλος
  choice: तुम्हारा उत्साह
  rationale: सकारात्मक जोश और सक्रिय लगन को दर्शाता है; ‘उत्साह’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἠρέθισε
  choice: प्रेरित किया है
  rationale: सकारात्मक प्रसंग में दूसरों को सक्रिय करने या उकसाने का अर्थ है; ‘प्रेरित’ अनावश्यक नकारात्मक भाव से बचता है।
- source_word: τοὺς πλείονας
  choice: उनमें से अधिकांश को
  rationale: तुलनात्मक बहुवचन यहाँ पहले उल्लिखित मकिदुनियावासियों में से बहुसंख्यक लोगों को सूचित करता है।
theological_decisions:
- issue: ‘अखाया’ का संदर्भ
  choice: भौगोलिक नाम ‘अखाया’ रखा गया है, जो वहाँ के विश्वासियों के लिए लक्षणा रूप में प्रयुक्त है।
  alternative: ‘तुम लोग’ या ‘अखाया के विश्वासी’ को सीधे मुख्य पाठ में लिखना।
  rationale: यूनानी पाठ स्पष्टतः प्रदेश का नाम लेता है। नाम बनाए रखने से पौलुस की क्षेत्रीय अभिव्यक्ति और उसका व्यापक दायरा सुरक्षित रहता है।
- issue: पौलुस के गर्व करने की शक्ति
  choice: ‘गर्व से कहता हूँ’ द्वारा सार्वजनिक गर्वपूर्ण कथन को स्पष्ट रखा गया है।
  alternative: ‘तुम्हारी प्रशंसा करता हूँ’ जैसे नरम रूप में प्रस्तुत करना।
  rationale: καυχῶμαι एक प्रबल आलंकारिक शब्द है; उसे केवल प्रशंसा में बदलना मूल की धार को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘तत्परता’, ‘गर्व से कहता हूँ’ और ‘उत्साह’ मूल की प्रशंसात्मक तथा प्रेरक वाणी बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उसी क्रम में दिए गए हैं जिस क्रम में संबंधित बात आती है।
