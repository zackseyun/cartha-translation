base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/010.yaml
  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: hi
  text: जो बोनेवाले को बीज और खाने के लिए रोटी देता है, वह तुम्हें बीज देगा और उसे बहुत बढ़ाएगा, और तुम्हारी धार्मिकता की उपज[a][b] बढ़ाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी धार्मिकता के फल” अथवा “तुम्हारी धार्मिकता की पैदावार।”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारे न्याय की उपज।” यूनानी शब्द δικαιοσύνη का अर्थ “धार्मिकता” या कुछ प्रसंगों में “न्याय” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ ἐπιχορηγῶν
  choice: जो ... देता है
  rationale: लेखयुक्त कृदंत को स्वाभाविक हिन्दी संबंधवाचक रचना में व्यक्त किया गया है। δὲ का हल्का संयोजक बल हिन्दी में अलग शब्द जोड़कर भारी नहीं किया गया।
- source_word: σπόρον τῷ σπείροντι
  choice: बोनेवाले को बीज
  rationale: कृषि-संबंधी मूल बिंब और बीज देने के उद्देश्य को सीधे बनाए रखता है।
- source_word: ἄρτον εἰς βρῶσιν
  choice: खाने के लिए रोटी
  rationale: बीज बोने के लिए और रोटी खाने के लिए होने का मूल भेद सहज आधुनिक हिन्दी में सुरक्षित है।
- source_word: χορηγήσει καὶ πληθυνεῖ τὸν σπόρον ὑμῶν
  choice: तुम्हें बीज देगा और उसे बहुत बढ़ाएगा
  rationale: भविष्यकाल तथा प्रावधान और वृद्धि—दोनों क्रियाएँ सुरक्षित हैं। हिन्दी में ‘तुम्हारा बीज देगा’ की अस्वाभाविकता से बचने के लिए प्राप्तकर्ता को स्पष्ट किया गया है।
- source_word: αὐξήσει τὰ γενήματα
  choice: उपज बढ़ाएगा
  rationale: γενήματα का अर्थ खेत की पैदावार/फल है; ‘उपज’ कृषि-बिंब को रखते हुए बहुवचन के सामूहिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῆς δικαιοσύνης ὑμῶν
  choice: तुम्हारी धार्मिकता की
  rationale: δικαιοσύνη के व्यापक नैतिक-धर्मवैचारिक अर्थ के लिए ‘धार्मिकता’ चुना गया है; ‘न्याय’ की वास्तविक संभावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: ‘तुम्हारी धार्मिकता की उपज’ का आशय
  choice: उदार और धर्मसम्मत आचरण से उत्पन्न फल या परिणाम का खुला कृषि-रूपक
  alternative: भौतिक प्रतिफल मात्र; वाचा-निष्ठा या न्याय का फल; धर्मी आचरण का प्रमाण
  rationale: दान की प्रसंगभूमि कृषि-बिंब को अर्थ देती है, पर पाठ इसे केवल भौतिक समृद्धि, केवल सामाजिक न्याय या केवल धर्मवैधानिक स्थिति तक सीमित नहीं करता।
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: ‘धार्मिकता’ पौलुस की व्यापक शब्दावली को सुरक्षित रखती है, जबकि प्रसंग में ‘न्याय’ भी संभव है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘बोनेवाले’, ‘बीज’, ‘रोटी’ और ‘उपज’ से कृषि-बिंब लगातार बना रहता है; किसी संप्रदायगत व्याख्या को मुख्य पाठ में नहीं थोपा गया।
