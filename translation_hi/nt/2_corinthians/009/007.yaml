source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ⸀προῄρηται τῇ καρδίᾳ, μὴ ἐκ λύπης ἢ ἐξ ἀνάγκης· ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: hi
  text: हर व्यक्ति अपने हृदय में जैसा निश्चय कर चुका है, वैसा ही दे—न दुःख से[a], न विवशता से[b]; क्योंकि परमेश्वर हर्षपूर्वक देने वाले से प्रेम करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ ‘दुःख से’ या ‘खेद से’ है; इस प्रसंग में भाव ‘मन मारकर’ या ‘अनिच्छा से’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘विवशता’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘बाध्यता’, ‘दबाव’ या ‘आवश्यकता’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: हर व्यक्ति
  rationale: यह वितरणसूचक एकवचन को बनाए रखता है और यूनानी के प्रतिनिधिक प्रयोग को किसी एक लिंग तक सीमित किए बिना स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καθὼς
  choice: जैसा ... वैसा ही
  rationale: हिन्दी की सहसंबंधी रचना स्वाभाविक ढंग से उस मानदंड को व्यक्त करती है जिसके अनुसार प्रत्येक व्यक्ति को देना है।
- source_word: προῄρηται
  choice: निश्चय कर चुका है
  rationale: पूर्णकालिक क्रिया सोच-विचारकर किए गए और अब भी प्रभावी व्यक्तिगत निर्णय को दर्शाती है।
- source_word: τῇ καρδίᾳ
  choice: अपने हृदय में
  rationale: ‘हृदय’ बाइबलीय मानव-विज्ञान की व्यापक धारणा—भीतरी विचार, इच्छा और संकल्प—को सुरक्षित रखता है।
- source_word: μὴ ἐκ λύπης
  choice: न दुःखी मन से
  rationale: यह λύπη के मूल अर्थ ‘दुःख/खेद’ को बनाए रखते हुए दान के प्रसंग में अनिच्छा से होने वाली आंतरिक पीड़ा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἢ ἐξ ἀνάγκης
  choice: न विवशता में
  rationale: यह बाहरी दबाव, बाध्यता अथवा ऐसी आवश्यकता को व्यक्त करता है जिसमें व्यक्ति अपने को स्वतंत्र नहीं समझता।
- source_word: ἱλαρὸν
  choice: हर्ष से
  rationale: यह प्रसन्न, आनंदपूर्ण और स्वेच्छापूर्ण मनोभाव को स्पष्ट तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: δότην
  choice: देनेवाले
  rationale: यह संज्ञा ‘दाता’ की अपेक्षा सामान्य पाठक के लिए अधिक सहज है और यूनानी एकवचन को बनाए रखती है।
- source_word: ἀγαπᾷ
  choice: प्रेम करता है
  rationale: ἀγαπάω का सीधा अर्थ सुरक्षित रखा गया है; इसे केवल ‘प्रसन्न होता है’ कहकर दैवी प्रेम को संकुचित नहीं किया गया।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: यह आधुनिक हिन्दी बाइबल-प्रयोग में स्वाभाविक और गरिमापूर्ण मानक संबोधन है।
theological_decisions:
- issue: दान में व्यक्तिगत और पूर्वनिश्चित संकल्प
  choice: हर व्यक्ति अपने हृदय में जैसा निश्चय कर चुका है, वैसा ही दे
  alternative: हर व्यक्ति जितना देना चाहता है, उतना दे
  rationale: चुना गया पाठ निर्णय की मात्रा मात्र नहीं, बल्कि व्यक्ति के भीतरी और विचारपूर्वक किए गए संकल्प को व्यक्त करता है; स्रोत स्वयं कोई निश्चित राशि नहीं बताता।
- issue: λύπη का अर्थ
  choice: न दुःखी मन से
  alternative: मन मारकर नहीं / अनिच्छा से नहीं
  rationale: स्रोत का प्रत्यक्ष अर्थ ‘दुःख/खेद’ है, जबकि प्रसंग में अनिच्छा निहित हो सकती है। मुख्य पाठ मूल बिंब को रखता है और पादटिप्पणी प्रसंगगत विकल्प बताती है।
- issue: ἀνάγκη का अर्थ
  choice: न विवशता में
  alternative: न आवश्यकता के कारण / न दबाव में
  rationale: दान के प्रसंग में ‘विवशता’ बाध्यता और दबाव दोनों को समेटती है, पर स्रोत में ‘आवश्यकता’ की अर्थ-छाया भी संभव है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: परमेश्वर का हर्ष से देनेवाले से प्रेम
  choice: परमेश्वर हर्ष से देनेवाले से प्रेम करता है
  alternative: परमेश्वर हर्ष से देनेवाले से प्रसन्न होता है
  rationale: ἀγαπᾷ को उसके सामान्य अर्थ ‘प्रेम करता है’ में रखा गया है। इसे केवल अनुमोदन या प्रसन्नता में बदलना स्रोत के कथन को अनावश्यक रूप से हल्का कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘हर व्यक्ति’ प्रतिनिधिक एकवचन को स्पष्ट करता है; ‘हृदय’, ‘विवशता’ और ‘हर्ष’ परिचित साहित्यिक शब्द हैं, पर वाक्यरचना सामान्य पाठकों के लिए सहज है।
