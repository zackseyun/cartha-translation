  text: ἐν παντὶ πλουτιζόμενοι εἰς πᾶσαν ἁπλότητα, ἥτις κατεργάζεται δι’ ἡμῶν εὐχαριστίαν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/011.yaml
  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: hi
  text: हर प्रकार से समृद्ध किए जाते हुए, ताकि आप हर प्रकार से उदार हो सकें, और इस उदारता से हमारे माध्यम से परमेश्वर को धन्यवाद मिले—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν παντὶ
  choice: हर प्रकार से
  rationale: यह प्रयोग व्यापकता व्यक्त करता है; आधुनिक हिन्दी में ‘हर प्रकार से’ स्वाभाविक है और साधनों की समग्र उपलब्धता का भाव रखता है।
- source_word: πλουτιζόμενοι
  choice: समृद्ध किए जाते हुए
  rationale: वर्तमानकालिक कर्मवाच्य कृदन्त को सुरक्षित रखता है और परमेश्वर को निहित कर्ता रहने देता है; इससे केवल सांसारिक धन-संपन्नता का दावा भी नहीं बनता।
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: ताकि आप हर तरह की उदारता दिखाएँ
  rationale: εἰς उद्देश्य/परिणाम की ओर संकेत करता है और इस दान-संग्रह के संदर्भ में ἁπλότης का प्रमुख अर्थ खुले हाथ से उदारता है। ‘दिखाएँ’ हिन्दी में उद्देश्य को स्वाभाविक बनाता है, यद्यपि यूनानी में इसका अलग क्रियापद नहीं है।
- source_word: ἥτις
  choice: जो
  rationale: यह संबंधवाचक सर्वनाम पहले कही गई उदारता की विशेषता और उसका प्रभाव बताता है।
- source_word: κατεργάζεται
  choice: उत्पन्न करती है
  rationale: क्रिया किसी परिणाम को घटित करने या लाने का अर्थ देती है; ‘उत्पन्न करती है’ कारण-परिणाम संबंध स्पष्ट रखता है।
- source_word: δι’ ἡμῶν
  choice: हमारे द्वारा
  rationale: διά के संबंधकारक प्रयोग में माध्यम/अभिकरण का भाव है; यह पौलुस और उसके साथियों की दान पहुँचाने वाली भूमिका को बिना विस्तार जोड़े बनाए रखता है।
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: परमेश्वर के प्रति धन्यवाद
  rationale: मूल संज्ञात्मक अभिव्यक्ति को बनाए रखता है और धन्यवाद की दिशा परमेश्वर की ओर स्पष्ट करता है।
theological_decisions:
- issue: दान-संग्रह के संदर्भ में ἁπλότης का अर्थ
  choice: उदारता/खुले हाथ से देना
  alternative: सरलता, निष्कपटता या एकनिष्ठता
  rationale: शब्द अन्य प्रसंगों में सरलता या निष्कपटता बता सकता है, पर यहाँ आर्थिक सहायता और उससे उत्पन्न परमेश्वर के प्रति धन्यवाद का निकट संदर्भ ठोस उदारता के अर्थ का समर्थन करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप। वाक्य को अगले पद से जुड़ा रहने देने के लिए अंत में दीर्घ विराम-चिह्न रखा गया है। ‘समृद्ध किए जाते हुए’ मूल के कर्मवाच्य और सतत भाव को बनाए रखता है।
