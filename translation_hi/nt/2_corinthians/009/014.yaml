source:
  edition: SBLGNT
  text: καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ’ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/014.yaml
  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: hi
  text: और वे आपके लिए प्रार्थना[a] करते हैं और आपके लिए लालायित हैं, आप पर परमेश्वर के अतिशय अनुग्रह के कारण।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विनती।”
    reason: δέησις के लिए प्रार्थना के साथ-साथ ‘विनती’ भी एक निकट lexical विकल्प है।
lexical_decisions:
- source_word: δεήσει
  choice: प्रार्थना
  rationale: यहाँ शब्द दूसरों के लिए की जाने वाली earnest विनती को दर्शाता है; ‘प्रार्थना’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: αὐτῶν
  choice: वे … करते हुए
  rationale: सम्बन्धवाचक बहुवचन पहले उल्लिखित दान पाने वाले विश्वासियों की ओर संकेत करता है; हिन्दी में कर्ता ‘वे’ के रूप में वाक्य खोलना अधिक स्वाभाविक है।
- source_word: ὑπὲρ ὑμῶν
  choice: आपके लिए
  rationale: सम्बन्धकारक के साथ ὑπέρ का अर्थ यहाँ ‘के लिए/की ओर से’ है; प्रार्थना के प्रसंग में ‘आपके लिए’ सहज है।
- source_word: ἐπιποθούντων
  choice: लालायित रहते हैं
  rationale: वर्तमान कृदन्त गहरी और निरन्तर आत्मीय अभिलाषा व्यक्त करता है; यह चयन उस भाव और जारी अवस्था दोनों को रखता है।
- source_word: διὰ
  choice: क्योंकि
  rationale: 'कर्मकारक के साथ διά यहाँ कारण बताता है: उनकी लालसा का आधार परमेश्वर का अनुग्रह है।'
- source_word: ὑπερβάλλουσαν
  choice: असीम
  rationale: यह अनुग्रह की असाधारण, सीमा से बढ़कर मात्रा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: χάριν
  choice: अनुग्रह
  rationale: पौलुस के प्रयोग में यह परमेश्वर की कृपापूर्ण कृपा और सामर्थ्य का भार रखता है; ‘अनुग्रह’ स्थापित और उपयुक्त हिन्दी शब्द है।
- source_word: ἐφ’ ὑμῖν
  choice: आप पर
  rationale: यह ἐπί के स्थानिक रूपक को बनाए रखता है—परमेश्वर का अनुग्रह उन पर है।
- source_word: καὶ
  choice: और
  rationale: यह पिछले वाक्य से साधारण संयोजक सम्बन्ध बनाए रखता है।
theological_decisions:
- issue: प्रार्थना और लालसा का वाक्यगत सम्बन्ध
  choice: दान पाने वाले विश्वासी कुरिन्थियों के लिए प्रार्थना करते हुए उनके लिए लालायित रहते हैं।
  alternative: इसे अधिक शब्दशः ‘और आपके लिए उनकी विनती में, आपके लिए लालायित होते हुए…’ कहा जा सकता है, जिससे प्रार्थना को लालसा की अभिव्यक्ति का क्षेत्र या साधन माना जा सकता है।
  rationale: यूनानी रचना संक्षिप्त है और सम्बन्धवाचक कृदन्त αὐτῶν से जुड़ा है। हिन्दी में ‘प्रार्थना करते हुए’ दोनों क्रियाओं का निकट सम्बन्ध बनाए रखता है, पर उनके बीच ऐसा निश्चित साधनात्मक सम्बन्ध नहीं जोड़ता जो पाठ स्पष्ट रूप से नहीं कहता।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरसूचक बहुवचन ‘आप’। भाषा सहज किंतु गरिमापूर्ण रखी गई है। कोई पादटिप्पणी नहीं जोड़ी गई, क्योंकि ‘प्रार्थना करते हुए’ यूनानी की संक्षिप्त रचना को पर्याप्त रूप से सँभालता है और ‘विनती’ का विकल्प अर्थ में निर्णायक परिवर्तन नहीं करता।
