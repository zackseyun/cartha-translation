source:
  edition: SBLGNT
  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: hi
  text: क्योंकि इस सेवा से जुड़ी सेवकाई न केवल पवित्र जनों के अभावों की पूर्ति कर रही है[a], बल्कि परमेश्वर के प्रति बहुत-से धन्यवादों के द्वारा भरपूर भी हो रही है—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र जनों की आवश्यकताओं को पूरा कर रही है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसका संबंध स्पष्ट और स्वाभाविक रखता है।
- source_word: ἡ διακονία τῆς λειτουργίας ταύτης
  choice: इस सेवा का काम
  rationale: दोनों निकटार्थक संज्ञाओं का भेद कुछ हद तक बनाए रखते हुए यह वाक्यांश सहज आधुनिक हिन्दी देता है; ‘काम’ διακονία और ‘सेवा’ λειτουργία को व्यक्त करते हैं।
- source_word: προσαναπληροῦσα τὰ ὑστερήματα
  choice: घटी को पूरा कर रहा है
  rationale: यह मूल के ‘जो कमी है उसे भरना/पूरा करना’ भाव को बनाए रखता है और केवल सामान्य ‘ज़रूरतें पूरी करना’ से अधिक स्रोत-सन्निकट है।
- source_word: τῶν ἁγίων
  choice: पवित्र जनों
  rationale: यह पौलुस के विश्वासियों के लिए प्रयुक्त पद का धार्मिक भार बनाए रखता है, पर हिन्दी में बाद के औपचारिक संत-पद की अनचाही धारणा से बचता है।
- source_word: περισσεύουσα
  choice: भरपूर भी हो रहा है
  rationale: क्रिया के बहुतायत या प्रचुर होने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ
  choice: परमेश्वर के प्रति बहुत-से धन्यवादों के द्वारा
  rationale: διά के माध्यम-सूचक बल और धन्यवाद के परमेश्वर की ओर निर्देशित होने—दोनों को सुरक्षित रखता है, यद्यपि हिन्दी में संरचना कुछ औपचारिक है।
theological_decisions:
- issue: ἅγιοι का अनुवाद
  choice: पवित्र जन
  alternative: संत; परमेश्वर के लोग
  rationale: ‘पवित्र जन’ मूल शब्द से निकट है और सभी विश्वासियों के लिए पौलुस के प्रयोग को बनाए रखता है; ‘संत’ से बाद की विशिष्ट धार्मिक उपाधि समझी जा सकती है, जबकि ‘परमेश्वर के लोग’ अधिक व्याख्यात्मक है।
- issue: दान-सेवा और धन्यवादों के बीच संबंध
  choice: धन्यवादों के द्वारा भरपूर हो रहा है
  alternative: बहुत-से धन्यवाद उत्पन्न कर रहा है
  rationale: मूल διά और περισσεύουσα की संरचना को बनाए रखा गया है तथा यह निर्णायक रूप से नहीं कहा गया कि संबंध केवल परिणाम का है; परिणाम-सूचक अनुवाद सम्भव है, पर अधिक व्याख्यात्मक होगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य हिन्दी। पद के अंत का डैश अगले विचार से इसके निकट संबंध को दर्शाने के लिए रखा गया है।
