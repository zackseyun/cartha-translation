id: 2CO.9.8
reference: 2 Corinthians 9:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: hi
  text: और परमेश्वर तुम पर हर प्रकार का अनुग्रह बहुतायत से बरसाने में समर्थ है, ताकि हर बात में, हर समय, तुम्हारी हर आवश्यकता के लिए पर्याप्त व्यवस्था पाकर, तुम हर भले काम में बढ़ते जाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δυνατεῖ
  choice: समर्थ है
  rationale: वर्तमान काल में यह परमेश्वर की सामर्थ्य को व्यक्त करता है; ‘समर्थ है’ स्वाभाविक हिन्दी में इस बल को बनाए रखता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ प्रबल विरोध नहीं, बल्कि पिछले कथन से हल्का संबंध जोड़ता है।
- source_word: πᾶσαν χάριν
  choice: हर प्रकार का अनुग्रह
  rationale: χάρις यहाँ परमेश्वर के व्यापक कृपापूर्ण प्रबंध को दर्शाता है, जिसमें उदारता के लिए आवश्यक सहायता भी सम्मिलित है; इसे केवल धन तक सीमित नहीं किया गया।
- source_word: περισσεῦσαι
  choice: बहुतायत से देने
  rationale: यह क्रिया अनुग्रह को प्राप्तकर्ताओं की ओर प्रचुर करने का कारक भाव रखती है; हिन्दी में यह प्रयोग स्वाभाविक है और बहुतायत का बिंब बचाता है।
- source_word: εἰς ὑμᾶς
  choice: तुम्हें
  rationale: यह कुरिन्थियों की ओर परमेश्वर के अनुग्रह की दिशा को सहज हिन्दी में व्यक्त करता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणाम का उपवाक्य आरम्भ करता है।
- source_word: ἐν παντὶ πάντοτε
  choice: हर बात में, हर समय
  rationale: दोनों व्यापक पद अलग-अलग रखकर यूनानी के बार-बार आने वाले πᾶς-समूह के आलंकारिक बल को सुरक्षित किया गया है।
- source_word: πᾶσαν αὐτάρκειαν
  choice: अपनी हर आवश्यकता के लिए पर्याप्त
  rationale: संदर्भ में अर्थ परमेश्वर से मिली पर्याप्त व्यवस्था है, न कि परमेश्वर से स्वतंत्र आत्मनिर्भरता। स्वाभाविक हिन्दी के लिए अमूर्त ‘पूर्ण पर्याप्तता’ के स्थान पर अर्थ-स्पष्ट वाक्यांश चुना गया है।
- source_word: ἔχοντες
  choice: तुम्हारे पास ... हो
  rationale: यूनानी कृदंत की समकालिक परिस्थिति को हिन्दी में स्वाभाविक अस्तित्ववाचक रचना से व्यक्त किया गया है।
- source_word: περισσεύητε
  choice: बढ़ते जाओ
  rationale: यह भले कामों में निरंतर प्रचुर होने का भाव देता है; ‘बढ़ते जाओ’ वर्तमान पक्ष और व्यावहारिक फल दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: हर भले काम में
  rationale: ‘बढ़ते जाओ’ के साथ ‘में’ स्वाभाविक है और प्रत्येक अच्छे कार्य में सक्रिय प्रचुरता का अर्थ देता है।
theological_decisions:
- issue: उदारता के संदर्भ में χάρις का अर्थ
  choice: परमेश्वर का व्यापक अनुग्रहपूर्ण प्रबंध, जिसमें उदार होने की सामर्थ्य भी शामिल है
  alternative: केवल कृपादृष्टि; केवल भौतिक दान
  rationale: निकटवर्ती संदर्भ देने और उदारता का है, पर χάρις का अर्थ धन तक सीमित नहीं होता। ‘अनुग्रह’ इसकी व्यापक धार्मिक और व्यावहारिक अर्थ-सीमा बनाए रखता है।
- issue: αὐτάρκεια का अर्थ
  choice: परमेश्वर से प्राप्त पर्याप्तता—हर आवश्यकता के लिए पर्याप्त होना
  alternative: संतोष; स्वतंत्र आत्मनिर्भरता
  rationale: संदर्भ में परमेश्वर ही पर्याप्त व्यवस्था देता है ताकि विश्वासी उदार हों। इसलिए दार्शनिक या स्वायत्त आत्मनिर्भरता का भाव नहीं अपनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। ‘हर’ की पुनरावृत्ति से मूल यूनानी की व्यापकता बचाई गई है, जबकि αὐτάρκεια को शाब्दिक लेकिन असहज ‘पूर्ण पर्याप्तता’ के बजाय अर्थ-स्पष्ट हिन्दी में व्यक्त किया गया है।
