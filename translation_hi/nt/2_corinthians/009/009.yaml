translation:
  language: hi
  text: 'जैसा लिखा है:


    “उसने बिखेरा, उसने गरीबों को दिया;


    उसकी धार्मिकता[a] सदा बनी रहती है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय।” यूनानी शब्द में धार्मिकता और न्याय, दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: जैसा लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण का प्रचलित और स्वाभाविक हिन्दी सूत्र है।
- source_word: Ἐσκόρπισεν
  choice: उसने उदारता से बाँटा
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘बिखेरना’ है, पर यहाँ दान को व्यापक रूप से बाँटने का भाव है; यह हिन्दी में उस चित्र और प्रसंग दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔδωκεν
  choice: उसने ... दिया
  rationale: साधारण भूतकाल यूनानी एओरिस्ट को कविता-सदृश उद्धरण में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῖς πένησιν
  choice: गरीबों को
  rationale: यह सीमित साधनों वाले निर्धन लोगों के लिए सीधा, सामान्य और प्रसंगानुकूल आधुनिक हिन्दी प्रयोग है।
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: उसकी धार्मिकता
  rationale: ‘धार्मिकता’ δικαιοσύνη के नैतिक रूप से सही चरित्र और आचरण दोनों को समेटती है तथा पौलुस के लेखन में शब्दगत निरंतरता बनाए रखती है; ‘न्यायपरायणता’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: μένει
  choice: बनी रहती है
  rationale: यह निरंतर कायम रहने के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह अनंत काल तक बने रहने के भाव का संक्षिप्त, काव्यात्मक और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: δικαιοσύνη का अर्थ
  choice: धार्मिकता
  alternative: न्यायपरायणता
  rationale: इस उद्धरण में शब्द उदार व्यक्ति के सही चरित्र अथवा सही कर्म का संकेत दे सकता है। ‘धार्मिकता’ व्यापक अर्थ और पौलुस-साहित्य की शब्दगत निरंतरता बनाए रखती है, जबकि न्याय का नैतिक आयाम पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल और काव्यात्मक उद्धरण-शैली रखी गई है। ‘बिखेरा’ की अपेक्षा ‘उदारता से बाँटा’ प्रसंग में अधिक स्वाभाविक है और व्यापक वितरण की मूल छवि को स्पष्ट करता है।
