translation:
  language: hi
  text: परमेश्वर को उसके अवर्णनीय उपहार के लिए धन्यवाद हो![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके अकथनीय उपहार के लिए।” यूनानी विशेषण का अर्थ ऐसी वस्तु हो सकता है जिसका पूरा वर्णन या कथन नहीं किया जा सकता।
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: धन्यवाद हो
  rationale: τῷ θεῷ के साथ यह विस्मयादिबोधक प्रयोग अनुग्रह की अपेक्षा परमेश्वर के प्रति धन्यवाद या स्तुति व्यक्त करता है। हिंदी में “धन्यवाद हो” इसकी स्तुतिपरक शक्ति को स्वाभाविक रूप से रखता है।
- source_word: τῷ θεῷ
  choice: परमेश्वर को
  rationale: यह धन्यवाद के प्राप्तकर्ता को दर्शाने वाला संप्रदान कारक है; हिंदी में “परमेश्वर को” सीधा और स्वाभाविक है।
- source_word: ἐπὶ
  choice: के लिए
  rationale: यहाँ संप्रदान कारक के साथ ἐπί धन्यवाद के आधार या कारण को व्यक्त करता है; “के लिए” वर्तमान हिंदी में उपयुक्त है।
- source_word: ἀνεκδιηγήτῳ
  choice: जिसका वर्णन शब्दों में नहीं किया जा सकता
  rationale: विशेषण ऐसी वस्तु को बताता है जिसे पूरी तरह सुनाया या व्यक्त नहीं किया जा सकता। यह वाक्यांश अर्थ को स्पष्ट, गरिमापूर्ण और सहज हिंदी में व्यक्त करता है।
- source_word: αὐτοῦ
  choice: उसके
  rationale: सर्वनाम स्वाभाविक रूप से परमेश्वर की ओर संकेत करता है। “उसके” यूनानी की सर्वनामात्मक अभिव्यक्ति को बनाए रखता है।
- source_word: δωρεᾷ
  choice: वरदान
  rationale: δωρεά स्वतंत्र रूप से दिए गए उपहार को दर्शाता है। इस स्तुतिपरक धार्मिक संदर्भ में “वरदान” स्वाभाविक है और अलग से “मुफ़्त” जोड़ने की आवश्यकता नहीं है।
theological_decisions:
- issue: “उसके उस वरदान” का अभिप्राय
  choice: अनुवाद में इसे परमेश्वर का वरदान ही रहने दिया गया है; इसकी पहचान को अधिक संकीर्ण रूप से निर्धारित नहीं किया गया।
  alternative: इसे विशेष रूप से मसीह, मसीह में उद्धार/अनुग्रह, अथवा कुरिन्थियों की उदारता सहित परमेश्वर के अनुग्रहपूर्ण प्रबंध का संदर्भ मानना।
  rationale: पद स्वयं केवल परमेश्वर के अवर्णनीय वरदान की बात करता है। निकटवर्ती संदर्भ उदारता उत्पन्न करने वाले परमेश्वर के अनुग्रह से जुड़ा है, जबकि मसीही व्याख्या में इसे अक्सर मसीह से भी जोड़ा गया है। अनुवाद मूल की व्यापकता और धर्मवैज्ञानिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और स्तुतिपरक शैली अपनाई गई है। “अकथनीय” की तुलना में मुख्य पाठ का वर्णनात्मक वाक्यांश सामान्य पाठकों के लिए अधिक सहज है; संक्षिप्त विकल्प पादटिप्पणी में दिया गया है।
