    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ μὲν γὰρ
  choice: क्योंकि ... के विषय में
  rationale: Περὶ विषय प्रस्तुत करता है, जबकि γὰρ पिछले प्रसंग से कारणात्मक संबंध जोड़ता है। हिंदी में वाक्य का यह विन्यास दोनों कार्यों को स्वाभाविक रूप से व्यक्त करता है; μὲν को अलग शब्द देकर बोझिल नहीं बनाया गया।
- source_word: διακονίας
  choice: सेवा
  rationale: διακονία यहाँ जरूरतमंद विश्वासियों के लिए एकत्र सहायता पहुँचाने के कार्य को दर्शाता है। ‘सेवा’ आधुनिक हिंदी में स्वाभाविक है और इस कार्य की गरिमा को बनाए रखता है।
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: पवित्र जनों के लिए की जानेवाली
  rationale: εἰς इस संदर्भ में दिशा अथवा लाभार्थी को सूचित कर सकता है। मुख्य पाठ में लाभार्थी का अर्थ स्वाभाविक हिंदी में दिया गया है और वैकल्पिक दिशात्मक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἁγίους
  choice: पवित्र जनों
  rationale: ἅγιοι पौलुस द्वारा परमेश्वर के लिए अलग किए गए विश्वासियों के लिए प्रयुक्त सामान्य पद है। ‘पवित्र जन’ इसका अर्थ स्पष्ट रखता है और साधारण पाठक के लिए ‘संतों’ से कम संभावित रूप से भ्रामक है।
- source_word: περισσόν
  choice: अनावश्यक
  rationale: यहाँ περισσόν का अर्थ जरूरत से अधिक अथवा गैर-जरूरी है। ‘अनावश्यक’ हिंदी में स्पष्ट, गरिमापूर्ण और पौलुस के अलंकारिक कथन के अनुरूप है।
- source_word: μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: तुम्हें लिखना मेरे लिए ... है
  rationale: यह रचना यूनानी के दत्तिवाचक μοί और संज्ञात्मक infinitive τὸ γράφειν को स्पष्ट और स्वाभाविक हिंदी क्रम में व्यक्त करती है।
theological_decisions:
- issue: ἅγιοι की पहचान
  choice: पवित्र जन
  alternative: संत
  rationale: पद विश्वासियों के सामूहिक, परमेश्वर के लिए अलग किए हुए दर्जे को बताता है; ‘पवित्र जन’ किसी विशेष आधिकारिक संत-वर्ग की धारणा जोड़े बिना यह अर्थ देता है।
- issue: εἰς द्वारा सेवा का संबंध
  choice: पवित्र जनों के लिए
  alternative: पवित्र जनों तक
  rationale: संदर्भ में लाभार्थी का भाव प्रमुख है, पर यूनानी दिशा का भाव भी दे सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सम्मानपूर्ण किंतु सहज शैली। ‘सेवा’ को धार्मिक तकनीकी शब्द से अधिक व्यापक व्यावहारिक सहायता के अर्थ में रखा गया है; ‘अनावश्यक’ सामान्य पाठक के लिए ‘अतिशय’ जैसे अधिक संस्कृतनिष्ठ विकल्प से स्पष्ट है।
