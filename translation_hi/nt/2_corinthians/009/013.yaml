source:
  edition: SBLGNT
  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: hi
  text: इस सेवा के द्वारा मिले प्रमाण के कारण वे परमेश्वर की महिमा करते हैं—मसीह के सुसमाचार के प्रति तुम्हारे अंगीकार में दिखाई देने वाली आज्ञाकारिता के कारण, और उनके तथा सबके लिए तुम्हारी उदार सहभागिता के कारण।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “मसीह के सुसमाचार के प्रति तुम्हारे अंगीकार की अधीनता और उनके तथा सबके प्रति तुम्हारी सहभागिता की उदारता।” यहाँ “सहभागिता” खास तौर पर आर्थिक सहायता में भाग लेने को दर्शाती है।'
    reason: यूनानी वाक्यांश τῇ ὑποταγῇ τῆς ὁμολογίας की संक्षिप्त और कुछ अस्पष्ट संरचना तथा κοινωνία के संदर्भगत आर्थिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: δοκιμῆς
  choice: खरी सच्चाई का प्रमाण
  rationale: यहाँ शब्द जाँच की प्रक्रिया से अधिक, इस सेवा द्वारा प्रमाणित प्रामाणिकता की ओर संकेत करता है। हिंदी में यह अभिव्यक्ति उस परिणाम को स्वाभाविक ढंग से बताती है।
- source_word: διακονίας
  choice: सेवा
  rationale: संदर्भ में यह विश्वासियों के लिए संगठित आर्थिक सहायता की सेवा है; ‘सेवा’ व्यावहारिक और धार्मिक दोनों आयाम बनाए रखती है।
- source_word: δοξάζοντες τὸν θεὸν
  choice: वे परमेश्वर की महिमा करते हैं
  rationale: कृदंत को हिंदी में स्पष्ट मुख्य क्रिया के रूप में व्यक्त किया गया है; ‘महिमा करते हैं’ δοξάζω के अर्थ को निकटता से रखता है।
- source_word: ὑποταγῇ
  choice: आज्ञाकारी हो
  rationale: शब्द समर्पण अथवा अधीनता का भाव रखता है, जो यहाँ सुसमाचार के प्रति व्यवहारिक आज्ञाकारिता में प्रकट होता है।
- source_word: ὁμολογίας ὑμῶν
  choice: जिस बात को तुम स्वीकार करते हो
  rationale: ὁμολογία सार्वजनिक स्वीकार या अंगीकार को दर्शाता है। क्रियात्मक हिंदी मूल संबंध को समझने योग्य बनाती है और इस कठिन संबंध को इस रूप में व्यक्त करती है कि जीवन घोषित विश्वास के अनुरूप है।
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: मसीह के सुसमाचार को मानने
  rationale: εἰς संबंध अथवा दिशा बताता है। ‘सुसमाचार को मानने’ हिंदी में स्वीकार और आज्ञाकारिता दोनों के साथ स्वाभाविक संबंध बनाता है। Χριστός को उसके पदवीगत अर्थ में ‘मसीह’ रखा गया है।
- source_word: ἁπλότητι
  choice: उदारता से
  rationale: दान-संग्रह के इस संदर्भ में शब्द निष्कपट खुलेपन से उत्पन्न उदारता को दर्शाता है, न कि केवल सरलता को।
- source_word: κοινωνίας
  choice: बाँटते हो
  rationale: यहाँ κοινωνία सामान्य संगति मात्र नहीं, बल्कि आर्थिक सहायता में सक्रिय सहभागिता है। ‘बाँटना’ आधुनिक हिंदी में इस ठोस भाव को सहजता से व्यक्त करता है।
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: उनके साथ और सबके साथ
  rationale: दोहराया गया εἰς सहभागिता की दिशा या लाभार्थियों को दर्शाता है; ‘साथ’ κοινωνία के पारस्परिक भाव को बनाए रखता है।
theological_decisions:
- issue: εὐαγγέλιον τοῦ Χριστοῦ में Χριστοῦ का अनुवाद
  choice: मसीह के सुसमाचार
  alternative: ख्रीस्त के सुसमाचार / मसीहा के सुसमाचार
  rationale: Χριστός यहाँ उपाधि है। ‘मसीह’ मानक हिंदी बाइबलीय प्रयोग में उसके अभिषिक्त उद्धारकर्ता संबंधी पदवीगत अर्थ को सुरक्षित रखता है और इसे केवल व्यक्तिगत नाम नहीं बनाता।
- issue: τῇ ὑποταγῇ τῆς ὁμολογίας का संबंध
  choice: जिस बात को तुम स्वीकार करते हो, उसके अनुसार तुम आज्ञाकारी हो
  alternative: तुम्हारे अंगीकार की अधीनता
  rationale: 'यूनानी संबंध संक्षिप्त और अर्थ की दृष्टि से तनावपूर्ण है: अधीनता अंगीकार की विशेषता, उसका परिणाम, अथवा उससे मेल खाने वाला आचरण हो सकती है। मुख्य पाठ इसे स्वाभाविक हिंदी में व्यक्त करता है; पादटिप्पणी अधिक औपचारिक विकल्प सुरक्षित रखती है।'
translation_notes:
  register: आधुनिक मानक हिंदी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। लंबे यूनानी वाक्य को डैश और स्पष्ट उपवाक्यों से खोला गया है। पद पिछले और अगले पद से जुड़े वाक्य का अंश है, फिर भी उपलब्ध संदर्भ में पूर्ण हिंदी वाक्य के रूप में प्रस्तुत किया गया है।
