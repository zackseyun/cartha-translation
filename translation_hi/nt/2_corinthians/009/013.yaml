revisions:
- from: इस सेवा से मिली उनकी खरी सच्चाई का प्रमाण देखकर, वे परमेश्वर की महिमा करते हैं—क्योंकि मसीह के सुसमाचार को मानने की जिस बात को तुम स्वीकार करते हो, उसके अनुसार तुम आज्ञाकारी हो, और क्योंकि तुम उनके साथ और सबके साथ उदारता से बाँटते हो।[a]
  to: इस सेवा के द्वारा मिले प्रमाण के कारण वे परमेश्वर की महिमा करते हैं—मसीह के सुसमाचार के प्रति तुम्हारे अंगीकार में दिखाई देने वाली आज्ञाकारिता के कारण, और उनके तथा सबके लिए तुम्हारी उदार सहभागिता के कारण।[a]
  rationale: The revision removes the unsupported ‘खरी सच्चाई,’ makes the ministry’s evidentiary role clear, and gives the confession/obedience construction a natural Hindi rendering without resolving its precise genitive relationship beyond what the source warrants. It also preserves the collection-related sense of κοινωνία through ‘उदार सहभागिता’ and a concise explanatory note.
