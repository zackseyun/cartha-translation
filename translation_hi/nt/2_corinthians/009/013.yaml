review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the charitable-service context and renders God’s glorification, obedience, generosity, and the scope ‘them and all.’ However, ‘उनकी खरी सच्चाई’ is not expressed in the Greek and makes the proof refer explicitly to the recipients’ genuineness rather than to the evidence furnished through this ministry. The rendering of the confession/obedience phrase is also overly expansive and repetitive (‘जिस बात को… स्वीकार… सुसमाचार को मानने’).
  naturalness: The current Hindi is generally readable, but the opening is cumbersome, and ‘मसीह के सुसमाचार को मानने की जिस बात को तुम स्वीकार करते हो’ is unnatural and tautological. The revision is smoother while retaining the compact, somewhat difficult Greek relationship.
  terminology: ‘सेवा,’ ‘परमेश्वर की महिमा करते हैं,’ ‘मसीह,’ ‘सुसमाचार,’ ‘आज्ञाकारिता,’ and ‘उदार सहभागिता’ are suitable modern standard Hindi terms. ‘उदार सहभागिता’ retains κοινωνία more faithfully than a bare ‘बाँटते हो,’ while the note clarifies the material-sharing sense in context.
  issues:
  - severity: medium
    issue: ‘उनकी खरी सच्चाई’ adds a referent and idea not explicit in the source.
    rationale: δοκιμῆς refers to proof/evidence associated with this ministry; the Greek does not say ‘their genuine truth.’
  - severity: medium
    issue: The confession/obedience clause is paraphrastic and redundant.
    rationale: The draft turns ὁμολογία into ‘the matter you accept’ and then adds ‘accepting the gospel.’ A formulation that speaks of obedience shown in the confession preserves the grammatical connection without duplication.
  - severity: low
    issue: ‘उदारता से बाँटते हो’ underrepresents κοινωνία.
    rationale: In context the word concerns material participation/sharing, but its participation aspect should remain visible in the main text or note.
