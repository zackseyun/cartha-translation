source:
  edition: SBLGNT
  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: hi
  text: इसलिए इसमें कोई बड़ी बात नहीं कि उसके सेवक भी धार्मिकता[a] के सेवकों का भेष धरते हैं। उनका अंत उनके कामों के अनुसार होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय के सेवक।” यूनानी शब्द का अर्थ “धार्मिकता” या “न्याय” हो सकता है; यहाँ आशय ऐसे लोगों के रूप में दिखाई देने से है जो सही बात के पक्ष में हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέγα
  choice: इसमें कोई बड़ी बात नहीं
  rationale: यह यूनानी मुहावरा बताता है कि पिछली बात को देखते हुए ऐसा होना असाधारण या आश्चर्यजनक नहीं है; हिंदी में यह अभिव्यक्ति मूल संरचना और आशय दोनों को बनाए रखती है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले पद से निकलने वाले निष्कर्ष को स्पष्ट और स्वाभाविक ढंग से जोड़ता है।
- source_word: διάκονοι
  choice: सेवक
  rationale: यहाँ शैतान की सेवा करने वाले उसके प्रतिनिधि अभिप्रेत हैं; ‘सेवक’ इस संबंध को स्पष्ट रखता है और अनावश्यक कलीसियाई पदवी का आभास नहीं देता।
- source_word: μετασχηματίζονται
  choice: रूप धरते हैं
  rationale: क्रिया बाहरी रूप या प्रस्तुति बदलने की ओर संकेत करती है, भीतरी परिवर्तन की ओर नहीं; ‘रूप धरते हैं’ छलपूर्ण दिखावे को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ὡς
  choice: के सेवकों का
  rationale: यह उस भूमिका या पहचान को व्यक्त करता है जिसे वे झूठे रूप में अपनाते हैं।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: इस प्रसंग में नैतिक रूप से सही और परमेश्वर के अनुकूल दिखाई देने का भाव प्रमुख है; ‘न्याय’ की वास्तविक शाब्दिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: τὸ τέλος
  choice: उनका अंत
  rationale: यह उनके अंतिम परिणाम या न्यायगत परिणति को संक्षिप्त और गंभीर रूप में व्यक्त करता है।
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: उनके कामों के अनुसार
  rationale: यह परिणाम और उनके किए हुए कार्यों के बीच अनुरूपता बनाए रखता है; ‘काम’ आधुनिक हिंदी में सहज और स्पष्ट है।
theological_decisions:
- issue: पौलुस के प्रयोग में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ झूठे सेवक अपने को सही और नैतिक रूप से खरे पक्ष के सेवक दिखाते हैं, इसलिए मुख्य पाठ में ‘धार्मिकता’ प्रसंगानुकूल है। फिर भी यूनानी शब्द में ‘न्याय’ का अर्थ भी संभव है, जिसे पादटिप्पणी में दिया गया है।
- issue: अंत का कामों के अनुसार होना
  choice: उनका अंत उनके कामों के अनुसार होगा
  alternative: उनका परिणाम उनके कर्मों के अनुरूप होगा
  rationale: मुख्य पाठ यूनानी न्याय-सूत्र की सीधी संरचना और उसके धर्मवैचारिक तनाव को बनाए रखता है, बिना यह विस्तार किए कि यह अंतिम परिणाम किस प्रकार लागू होगा।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘रूप धरते हैं’ बाहरी छलपूर्ण वेश को स्पष्ट करता है, और ‘कामों के अनुसार’ मूल के न्याय-संबंधी सूत्र को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
