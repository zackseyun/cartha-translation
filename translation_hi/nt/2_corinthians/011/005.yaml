  text: λογίζομαι γὰρ μηδὲν ὑστερηκέναι τῶν ὑπερλίαν ἀποστόλων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/005.yaml
  text: For I consider that I am not in the least inferior to those super-apostles[a].
translation:
  language: hi
  text: क्योंकि मैं मानता हूँ कि मैं उन अति-प्रतिष्ठित प्रेरितों[a] से किसी भी बात में कम नहीं हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सबसे प्रतिष्ठित प्रेरित।” यूनानी पद को व्यंग्यात्मक रूप से पौलुस के विरोधियों के लिए, अथवा सीधे तौर पर अत्यंत प्रतिष्ठित प्रेरितों के लिए समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: λογίζομαι
  choice: मैं मानता हूँ
  rationale: यह क्रिया विचार करके किसी निष्कर्ष पर पहुँचने या आकलन करने का भाव देती है। ‘मैं मानता हूँ’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ पौलुस के सोचे-समझे आकलन को व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन के समर्थन या स्पष्टीकरण का संकेत देता है। ‘क्योंकि’ हिन्दी में इस तर्क-संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: μηδὲν
  choice: किसी भी बात में ... नहीं
  rationale: यहाँ μηδέν क्रियाविशेषणवत् प्रयुक्त होकर पूर्ण निषेध पर बल देता है—पौलुस किसी भी दृष्टि से अपने को कम नहीं मानता।
- source_word: ὑστερηκέναι
  choice: कम नहीं हूँ
  rationale: ὑστερέω का पूर्णकालिक infinitive तुलना में पीछे या न्यून होने की वर्तमान परिणामी दशा बताता है। ‘कम नहीं हूँ’ सहज हिन्दी में इसी तुलनात्मक अर्थ को व्यक्त करता है।
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: उन “महान से महान प्रेरितों”
  rationale: ὑπερλίαν अत्यधिक या असाधारण होने का भाव देता है। उद्धरण-चिह्न संभावित व्यंग्य का संकेत देते हैं, जबकि ‘महान से महान प्रेरित’ उस वैकल्पिक अर्थ को भी खुला रखता है जिसमें यह प्रतिष्ठित प्रेरितों का सीधा उल्लेख हो सकता है।
theological_decisions:
- issue: क्या τῶν ὑπερλίαν ἀποστόλων पौलुस के विरोधियों के लिए व्यंग्यपूर्ण पद है या अत्यंत प्रतिष्ठित प्रेरितों का सीधा उल्लेख
  choice: मुख्य पाठ में ‘उन “महान से महान प्रेरितों”’ रखा गया है, जिसमें उद्धरण-चिह्न संभावित व्यंग्य की ओर संकेत करते हैं।
  alternative: ‘सबसे प्रतिष्ठित प्रेरितों’—इसे प्रमुख प्रेरितों का निष्कपट उल्लेख माना जा सकता है।
  rationale: निकटवर्ती प्रसंग में पौलुस का विवादात्मक और विडंबनापूर्ण स्वर व्यंग्य की संभावना को प्रबल करता है, पर यूनानी पद स्वयं सीधे अर्थ की संभावना को समाप्त नहीं करता। इसलिए मुख्य पाठ में तनाव बनाए रखा गया है और वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रेरित’ प्रचलित बाइबलीय पद है। ‘महान से महान’ अतिशयता को स्वाभाविक हिन्दी में व्यक्त करता है; उद्धरण-चिह्न व्यंग्य की संभावना दर्शाते हैं, पर पादटिप्पणी अर्थगत अस्पष्टता को सुरक्षित रखती है।
