  text: Why? Because I do not love you? God knows I do.
translation:
  language: hi
  text: क्यों? क्या इसलिए कि मैं तुमसे प्रेम नहीं करता? परमेश्वर जानता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τί
  choice: क्यों?
  rationale: यह कारण पूछने वाला संक्षिप्त प्रश्न है; ‘क्यों?’ उसके अलंकारिक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὅτι
  choice: क्या इसलिए कि
  rationale: यहाँ ὅτι पिछले ‘क्यों?’ के संभावित कारण को प्रश्न के रूप में सामने लाता है; हिन्दी में ‘क्या इसलिए कि’ वाक्य-संबंध और अलंकारिक प्रश्न दोनों को स्पष्ट करता है।
- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: मैं तुमसे प्रेम नहीं करता
  rationale: निषेध, क्रिया और संबोधित समुदाय को सीधे तथा स्वाभाविक रूप से सुरक्षित रखा गया है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: θεός के लिए मानक, गरिमापूर्ण और व्यापक रूप से समझा जाने वाला हिन्दी रूप।
- source_word: οἶδεν
  choice: जानता है
  rationale: यूनानी पाठ केवल ‘जानता है’ कहता है; निहित उत्तर को मुख्य पाठ में जोड़ने के बजाय मूल की संक्षिप्तता और अर्थगत तनाव सुरक्षित रखा गया है।
theological_decisions:
- issue: क्या अंतिम कथन में निहित सकारात्मक उत्तर को स्पष्ट किया जाए
  choice: परमेश्वर जानता है।
  alternative: परमेश्वर जानता है कि मैं तुमसे प्रेम करता हूँ।
  rationale: स्रोत-पाठ में कर्म या पूरक कथन व्यक्त नहीं है। संदर्भ से सकारात्मक उत्तर दृढ़ता से निहित है, फिर भी उसे स्पष्ट रूप से जोड़ना मूल की वाक्यगत अस्पष्टता को समाप्त कर देता; इसलिए संक्षिप्त मूल रूप रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और बोलचाल में सहज। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। अंतिम वाक्य की मूलभाषाई संक्षिप्तता जानबूझकर रखी गई है।
