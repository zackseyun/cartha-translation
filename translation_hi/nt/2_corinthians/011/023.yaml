id: 2CO.11.23
reference: 2 Corinthians 11:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διάκονοι Χριστοῦ εἰσιν; παραφρονῶν λαλῶ, ὑπὲρ ἐγώ· ἐν κόποις περισσοτέρως, ἐν ⸂φυλακαῖς περισσοτέρως, ἐν πληγαῖς ὑπερβαλλόντως⸃, ἐν θανάτοις πολλάκις·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: hi
  text: 'क्या वे मसीह के सेवक हैं? मैं पागल की तरह बोल रहा हूँ—मैं उनसे बढ़कर हूँ: परिश्रमों में कहीं अधिक, कैदों में कहीं अधिक, मार खाने में बेहिसाब, और बार-बार मौत के मुँह में पड़ा हूँ।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अनेक बार मौतों में”; आशय शायद यह है कि वह बार-बार मृत्यु के निकट पहुँचा या प्राणघातक संकटों में पड़ा।'
    reason: ग्रीक के असामान्य बहुवचन और उसकी वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: διάκονοι
  choice: सेवक
  rationale: यह सामान्य सेवा करने वालों को दर्शाता है; ‘सेवक’ स्वाभाविक है और कलीसियाई पद का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: Χριστοῦ
  choice: मसीह के
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; आधुनिक हिन्दी में ‘मसीह’ इसका प्रचलित और अर्थपूर्ण रूप है।
- source_word: παραφρονῶν λαλῶ
  choice: मैं पागल की तरह बोल रहा हूँ
  rationale: यह पौलुस की इस आत्मचेतना को व्यक्त करता है कि उसका ऐसा गर्व करना विक्षिप्तता-जैसा सुनाई देता है, बिना उसे वास्तव में पागल घोषित किए।
- source_word: ὑπὲρ ἐγώ
  choice: मैं उनसे बढ़कर हूँ
  rationale: ग्रीक की संक्षिप्त तुलनात्मक उक्ति को हिन्दी में स्पष्ट करता है और तुलना का आशय बनाए रखता है।
- source_word: ἐν κόποις περισσοτέρως
  choice: परिश्रमों में कहीं अधिक
  rationale: κόπος कठिन और थका देने वाले श्रम को दर्शाता है; ‘कहीं अधिक’ तुलनात्मक तीव्रता व्यक्त करता है।
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: कैदों में कहीं अधिक
  rationale: बहुवचन बार-बार बंदी बनाए जाने के अनुभवों की ओर संकेत करता है; ‘कैदों’ से इसकी पुनरावृत्ति बनी रहती है।
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: मार खाने में बेहिसाब
  rationale: यह प्रहार और पिटाई सहने तथा उनकी असाधारण मात्रा, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν θανάτοις πολλάκις
  choice: बार-बार मौत के मुँह में पड़ा हूँ
  rationale: ग्रीक का असामान्य बहुवचन शाब्दिक रूप से ‘मौतों में’ है; हिन्दी मुहावरा बार-बार मृत्यु के निकट आने या प्राणघातक संकट झेलने का संभावित आशय स्पष्ट करता है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: संदर्भ में यह उपाधि है; ‘मसीह’ हिन्दी पाठक के लिए अर्थपूर्ण और स्थापित रूप है तथा किसी संप्रदायगत विशिष्टता को नहीं जोड़ता।
- issue: ἐν θανάτοις πολλάκις की व्याख्या
  choice: मुख्य पाठ में ‘बार-बार मौत के मुँह में पड़ा हूँ’, साथ में शाब्दिक रूप की पाद-टिप्पणी
  alternative: ‘अनेक बार मौतों में’
  rationale: ग्रीक की प्रभावशाली और कुछ अस्पष्ट अभिव्यक्ति को अस्वाभाविक हिन्दी में ज्यों का त्यों रखने के बजाय उसका संभावित अर्थ दिया गया है, जबकि पाद-टिप्पणी मूल बहुवचन और अनिश्चितता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सहज शैली। पौलुस की तीखी, आत्मसचेत विडंबना और दुःखों की क्रमिक सूची बनाए रखने के लिए संक्षिप्त वाक्यांश तथा डैश का प्रयोग किया गया है।
