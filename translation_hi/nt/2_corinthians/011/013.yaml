review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the explanatory γάρ, the denunciatory nouns, and Χριστοῦ as “मसीह.” However, “मसीह के प्रेरितों का रूप धारण करते हैं” can suggest that they take on merely the appearance of the Messiah’s apostles, whereas μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ denotes deceptive self-presentation in the role/identity of apostles of the Messiah.
  naturalness: The wording is generally clear and modern. “अपने आपको ... के रूप में प्रस्तुत करते हैं” is more idiomatic in this context and communicates intentional deceptive presentation without the potentially narrower “का रूप धारण करना.”
  terminology: “प्रेरित” and “मसीह” are established, appropriate Hindi biblical terms. “धोखेबाज़ काम करने वाले” naturally conveys ἐργάται δόλιοι; it describes workers characterized by deceit rather than merely workers who sometimes deceive.
  issues:
  - severity: medium
    issue: The phrase “मसीह के प्रेरितों का रूप धारण करते हैं” may reduce the claimed identity/role to external appearance.
    rationale: The Greek εἰς ἀποστόλους Χριστοῦ with μετασχηματίζομαι expresses presenting oneself as, or assuming the guise of, apostles of the Messiah. The revision preserves this role-identification more directly.
  revised_text: क्योंकि ऐसे लोग झूठे प्रेरित और धोखेबाज़ काम करने वाले हैं, जो अपने आपको मसीह के प्रेरितों के रूप में प्रस्तुत करते हैं।
