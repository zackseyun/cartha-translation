  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: hi
  text: क्योंकि ऐसे लोग झूठे प्रेरित और धोखेबाज़ काम करने वाले हैं, जो अपने आपको मसीह के प्रेरितों के रूप में प्रस्तुत करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिंदी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοιοῦτοι
  choice: ऐसे लोग
  rationale: यह पहले वर्णित विशेष प्रकार के लोगों की ओर संकेत करता है और आधुनिक हिंदी में सहज है।
- source_word: ψευδαπόστολοι
  choice: झूठे प्रेरित
  rationale: यह उन लोगों को बताता है जो प्रेरित होने का झूठा दावा करते हैं; मूल संयुक्त शब्द का अर्थ स्पष्ट रूप से बना रहता है।
- source_word: ἐργάται δόλιοι
  choice: छल करने वाले कार्यकर्ता
  rationale: यह उनके काम और छलपूर्ण चरित्र दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: μετασχηματιζόμενοι
  choice: रूप धारण करते हैं
  rationale: संदर्भ में यह भीतरी परिवर्तन नहीं, बल्कि जानबूझकर बाहरी पहचान या रूप अपनाने का भाव देता है।
- source_word: εἰς ἀποστόλους Χριστοῦ
  choice: मसीह के प्रेरितों का रूप
  rationale: εἰς यहाँ अपनाई गई भूमिका या पहचान को दर्शाता है; पूरी अभिव्यक्ति हिंदी में ‘का रूप धारण करना’ के साथ स्वाभाविक है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यहाँ Χριστός उस अभिषिक्त जन की उपाधि के रूप में सक्रिय है; ‘मसीह’ हिंदी बाइबलीय प्रयोग में अर्थपूर्ण और परिचित पद है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: संबंधकारक वाक्यांश ‘मसीह के प्रेरित’ में उपाधि का अर्थ सक्रिय है। ‘मसीह’ उस उपाधि को हिंदी में सुरक्षित रखता है और किसी सांप्रदायिक विशिष्टता को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘प्रेरित’ और ‘मसीह’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं; वाक्य की आरोपात्मक तीव्रता भी सुरक्षित है।
