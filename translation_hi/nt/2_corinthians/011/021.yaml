base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: hi
  text: मैं यह हमारी लज्जा के लिए कहता हूँ[a], मानो हम निर्बल ही थे[b]। फिर भी, जिस किसी बात में कोई शेखी बघारने का साहस करता है[c]—मैं मूर्खता में कह रहा हूँ[d]—उसी में मैं भी साहस करता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं यह अपमान के रूप में कहता हूँ”; यूनानी अभिव्यक्ति का अर्थ “मैं यह हमारी बदनामी की बात कहता हूँ” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मानो हम निर्बल रहे हों।” प्रसंग में पौलुस विडंबनापूर्वक बोल रहा है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “जिस किसी बात में कोई साहस करता है।” आसपास के प्रसंग में शेखी बघारने का भाव निहित है।
    reason: lexical_alternative
  - marker: d
    text: या, “मैं मूर्ख की तरह कहता हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: अपनी लज्जा की बात
  rationale: यह कठिन यूनानी मुहावरा अपमान या लज्जा के भाव को व्यक्त करता है। प्रसंग में पौलुस विडंबनापूर्वक अपने और अपने सहकर्मियों पर लगाई गई निर्बलता की धारणा का उल्लेख करता है; यह रूप हिंदी में स्वाभाविक रहते हुए उस भाव को बनाए रखता है।
- source_word: ὡς ὅτι
  choice: मानो
  rationale: यह रूप कथन को वास्तविक स्वीकारोक्ति के बजाय विडंबनापूर्ण मान्यता या प्रतीति के रूप में प्रस्तुत करता है।
- source_word: ἠσθενήκαμεν
  choice: हम निर्बल रहे हों
  rationale: यहाँ क्रिया मुख्यतः शारीरिक बीमारी नहीं, बल्कि सामर्थ्य, प्रभाव या प्रतिष्ठा की कमी समझे जाने की ओर संकेत करती है। पूर्ण पक्ष को 'रहे हों' से व्यक्त किया गया है।
- source_word: ἐν ᾧ
  choice: जिस बात में
  rationale: यह उस क्षेत्र या विषय को दर्शाता है जिसमें कोई साहस दिखाता है; आधुनिक हिंदी में यह स्पष्ट और स्वाभाविक है।
- source_word: τολμᾷ
  choice: साहस करता है
  rationale: मूल क्रिया का अर्थ 'साहस करना' है। शेखी बघारने का आशय निकटवर्ती प्रसंग से स्पष्ट है, इसलिए उसे मुख्य पाठ में जोड़कर मूल की निहितता को समाप्त नहीं किया गया।
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: मैं मूर्खता में कह रहा हूँ
  rationale: यह पौलुस की आत्म-सचेत अलंकारिक टिप्पणी को निकटता से रखता है और 'मूर्ख की तरह' अर्थ की संभावना भी खुली छोड़ता है।
- source_word: τολμῶ κἀγώ
  choice: उसमें मैं भी साहस करता हूँ
  rationale: पहली क्रिया के साथ शब्दगत समानता बनाए रखी गई है और 'भी' से κἀγώ का बल व्यक्त होता है।
theological_decisions:
- issue: पौलुस की 'निर्बलता' से संबंधित अलंकारिक विडंबना
  choice: कथन को 'मानो हम निर्बल रहे हों' के रूप में विडंबनापूर्ण मान्यता बनाया गया
  alternative: 'इसे सीधी स्वीकारोक्ति के रूप में अनूदित करना: ''कि हम निर्बल थे'''
  rationale: व्यापक प्रसंग पौलुस के 'मूर्खतापूर्ण' गर्व और विरोधियों से तुलना का है। अनुवाद उसकी प्रेरिताई को वास्तव में कमतर मानने का निष्कर्ष नहीं थोपता, पर कथन का तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। 'निर्बल', 'लज्जा' और 'साहस' जैसे परिचित साहित्यिक शब्द मूल की अलंकारिक गंभीरता बनाए रखते हैं। मुख्य पाठ मूल की पुनरुक्ति और निहित अर्थ को यथासंभव सुरक्षित रखता है; वैकल्पिक अर्थ टिप्पणियों में दिए गए हैं।
