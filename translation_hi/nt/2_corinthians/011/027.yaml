  yaml_path: translation/nt/2_corinthians/011/027.yaml
  text: in labor and hardship[a], in many sleepless nights, in hunger and thirst, in frequent fastings[b], in cold and exposure.
translation:
  language: hi
  text: मेहनत और कष्ट में, बार-बार जागते रहने में, भूख और प्यास में, बार-बार उपवास करने में[a], ठंड और वस्त्रों की कमी में[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बार-बार निराहार रहने में।” यूनानी शब्द बार-बार उपवास करने को दर्शा सकता है; पाठ यह स्पष्ट नहीं करता कि ये उपवास स्वेच्छा से किए गए थे या परिस्थितियों के कारण हुए।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “नग्नता में।” यहाँ आशय पर्याप्त वस्त्र न होने और मौसम की मार के सामने असुरक्षित रहने से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κόπῳ
  choice: मेहनत
  rationale: यह शब्द श्रमसाध्य काम और थका देने वाले प्रयास को दर्शाता है; सामान्य आधुनिक हिन्दी में ‘मेहनत’ स्वाभाविक है।
- source_word: μόχθῳ
  choice: कठिन परिश्रम
  rationale: यह κόπος के निकटार्थी होते हुए श्रम से जुड़ी कठिनाई और क्लेश पर बल देता है; दोनों शब्दों की संचयी अभिव्यक्ति बनाए रखने के लिए अलग किंतु संबंधित पद चुना गया है।
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: बार-बार जागते रहने में
  rationale: ἀγρυπνία जागरण अथवा नींद से वंचित रहने को दर्शाता है। हिन्दी वाक्यांश कारण को अनिर्धारित रखते हुए बारंबारता को स्पष्ट करता है।
- source_word: ἐν λιμῷ καὶ δίψει
  choice: भूख और प्यास में
  rationale: यह युग्म अभाव की सहन की गई अवस्थाओं को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν νηστείαις πολλάκις
  choice: बार-बार उपवासों में
  rationale: νηστεία को ‘उपवास’ कहना इसे पहले आए λιμός, अर्थात भूख, से अलग रखता है; स्वैच्छिक या परिस्थितिजन्य होने का प्रश्न पादटिप्पणी में खुला रखा गया है।
- source_word: ἐν ψύχει
  choice: ठंड
  rationale: ψῦχος सहन की गई ठंड की अवस्था को दर्शाता है।
- source_word: γυμνότητι
  choice: अपर्याप्त वस्त्रों
  rationale: कष्टों की इस सूची में यह शब्द संभवतः वस्त्रों की कमी और मौसम के सामने असुरक्षित होने को दर्शाता है; यह हिन्दी में ‘नग्नता’ की अपेक्षा संदर्भगत अर्थ को अधिक स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: νηστείαις का आशय
  choice: उपवासों
  alternative: भोजन न मिलने से भूखा रहना अथवा परिस्थितिवश निराहार रहना
  rationale: यूनानी पद उपवास को व्यक्त करता है और सूची में ‘भूख’ पहले अलग से मौजूद है। फिर भी पाठ यह नहीं बताता कि ये उपवास स्वैच्छिक थे या परिस्थितियों से विवश होकर हुए, इसलिए इस अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: γυμνότητι का आशय
  choice: अपर्याप्त वस्त्रों
  alternative: नग्नता
  rationale: ठंड के साथ इसका युग्म वस्त्रों की कमी और तत्वों के सामने असुरक्षा की ओर संकेत कर सकता है। मुख्य पाठ में संदर्भगत, सहज अर्थ रखा गया है और अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। यूनानी की आवर्ती सूची-संरचना को ‘में’ और ‘बार-बार’ द्वारा बनाए रखा गया है; स्वैच्छिक उपवास और विवश अभाव तथा γυμνότης के शाब्दिक और संदर्भगत अर्थों के बीच की अस्पष्टता पादटिप्पणियों में सुरक्षित है।
