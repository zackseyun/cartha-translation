base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: hi
  text: तीन बार मुझे छड़ियों से पीटा गया, एक बार मुझ पर पथराव किया गया, तीन बार मैं जहाज़ी दुर्घटना का शिकार हुआ; मैंने गहरे समुद्र में[a] एक रात और एक दिन बिताया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खुले समुद्र में”।
    reason: βυθός यहाँ गहरे समुद्र या खुले समुद्र में होने का संकेत दे सकता है; ठीक परिस्थिति निश्चित नहीं है।
lexical_decisions:
- source_word: τρὶς
  choice: तीन बार
  rationale: दोनों स्थानों पर पुनरावृत्ति की संख्या को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐραβδίσθην
  choice: मुझे छड़ियों से पीटा गया
  rationale: निष्क्रिय क्रिया के साथ मारने के साधन, अर्थात छड़ियों, को स्पष्ट रखता है।
- source_word: ἅπαξ
  choice: एक बार
  rationale: एकमात्र घटना को आधुनिक मानक हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: ἐλιθάσθην
  choice: मुझ पर पथराव किया गया
  rationale: पत्थरों से किए गए हिंसक आक्रमण का स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: ἐναυάγησα
  choice: मैं जहाज़ टूटने का शिकार हुआ
  rationale: जहाज़ी दुर्घटना झेलने का भाव व्यक्त करता है, पर यह अनावश्यक रूप से नहीं बताता कि जहाज़ अवश्य डूब गया था।
- source_word: νυχθήμερον
  choice: एक रात और एक दिन
  rationale: रात-दिन की अवधि और स्रोत में दिए क्रम को बनाए रखता है; ‘चौबीस घंटे’ जैसी अति-सटीक व्याख्या से बचता है।
- source_word: ἐν τῷ βυθῷ
  choice: गहरे समुद्र में
  rationale: βυθός के गहरे जल अथवा समुद्र के अर्थ को स्वाभाविक हिन्दी में रखता है, जबकि ‘खुले समुद्र में’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: πεποίηκα
  choice: मैंने … बिताया है
  rationale: समय-सूचक पद के साथ ποιέω का अर्थ समय बिताना है; पूर्णकाल की पीछे मुड़कर बताने वाली शक्ति भी बनी रहती है।
