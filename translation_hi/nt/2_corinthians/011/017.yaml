  text: ὃ λαλῶ οὐ ⸂κατὰ κύριον λαλῶ⸃, ἀλλ’ ὡς ἐν ἀφροσύνῃ, ἐν ταύτῃ τῇ ὑποστάσει τῆς καυχήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/017.yaml
  text: What I am saying[a], I am not saying according to the Lord, but as in foolishness[c][b], in this confidence of boasting.
translation:
  language: hi
  text: जो मैं कह रहा हूँ, वह मैं प्रभु के अनुसार नहीं कह रहा हूँ,[a] बल्कि मानो मूर्खता में,[b] घमण्ड करने के इस आत्मविश्वास में कह रहा हूँ।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं यह प्रभु की ओर से नहीं कह रहा हूँ,” अथवा “प्रभु के मानक के अनुसार नहीं।”
    reason: alternative_reading
  - marker: b
    text: या, “बल्कि मानो मूर्खता में,” अथवा, अधिक मुहावरेदार रूप में, “बल्कि जैसे कोई मूर्ख बोलता है।”
    reason: lexical_alternative
  - marker: c
    text: “आत्मविश्वास” के लिए प्रयुक्त यूनानी शब्द का अर्थ इस संदर्भ में “विषय,” “आधार,” या “उपक्रम” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ λαλῶ
  choice: जो मैं कह रहा हूँ
  rationale: यह स्वाभाविक आधुनिक हिन्दी में पौलुस की वर्तमान वाणी के विषय को व्यक्त करता है और यूनानी वर्तमान काल की निरन्तरता बनाए रखता है।
- source_word: κατὰ κύριον
  choice: प्रभु के अनुसार
  rationale: κατά के मानक या रीति-संबंधी अर्थ को खुला रखता है; यह निश्चय नहीं करता कि आशय प्रभु से प्रत्यक्ष आदेश, प्रभु की रीति, या प्रभु के मानक से है।
- source_word: κύριον
  choice: प्रभु
  rationale: इस संदर्भ में κύριος के लिए स्वाभाविक और परम्परागत हिन्दी पद है, सम्भवतः प्रभु यीशु का संकेत, पर मुख्य पाठ में विस्तार अनावश्यक है।
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: बल्कि मानो मूर्खता में
  rationale: ὡς की तुलनात्मक सावधानी तथा ἐν ἀφροσύνῃ की रीति/क्षेत्र की छाया बनाए रखता है और पौलुस को सीधे 'मूर्ख' कह देने से बचता है।
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: इस आत्मविश्वास के साथ
  rationale: ὑπόστασις यहाँ कठिन और बहुअर्थी है। 'आत्मविश्वास' घमण्डपूर्ण बोलने की साहसिक मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी 'आधार/विषय/उद्यम' की सम्भावनाएँ सुरक्षित रखती है।
- source_word: τῆς καυχήσεως
  choice: घमण्ड करने के
  rationale: καύχησις की क्रियात्मक शक्ति को बनाए रखता है और हिन्दी में अगले पद 'आत्मविश्वास' से स्वाभाविक संबंध बनाता है।
theological_decisions:
- issue: κατὰ κύριον का संकेत और बल
  choice: मुख्य पाठ में 'प्रभु के अनुसार' रखकर पौलुस की घमण्ड करने की आगामी शैली को प्रभु की रीति या मानक से अलग बताया गया है।
  alternative: इसे 'प्रभु की ओर से' कहने पर प्रत्यक्ष आदेश या प्रकाशन का अभाव प्रमुख अर्थ बन सकता है।
  rationale: यूनानी वाक्यांश में मानक, रीति और अधिकार की सम्भव छायाएँ हैं। अनुवाद को यह तनाव बनाए रखना चाहिए और इसे प्रेरणा या सत्यता के स्पष्ट निषेध में नहीं बदलना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'मानो मूर्खता में' मूल की असामान्य अभिव्यक्ति को कुछ हद तक बनाए रखता है; दीर्घ विराम-चिह्न वाक्य के विरोध और स्पष्टीकरण को स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
