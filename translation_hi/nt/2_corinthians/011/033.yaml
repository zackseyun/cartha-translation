translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘बैठाकर’ हिन्दी में टोकरी द्वारा उतारे जाने की स्थिति को स्वाभाविक बनाता है, यद्यपि यूनानी में यह क्रिया स्पष्ट रूप से नहीं है।
