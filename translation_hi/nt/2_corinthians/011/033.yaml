translation:
  language: hi
  text: और मुझे दीवार में बनी एक खिड़की से टोकरी में नीचे उतारा गया, और मैं उसके हाथों से बच निकला।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे दीवार में बने एक खुले स्थान से रस्सियों की बुनी टोकरी में नीचे उतारा गया।”
    reason: ‘खिड़की’ छोटे खुले स्थान को भी दर्शा सकती है, और σαργάνη रस्सियों या अन्य सामग्री से बुनी टोकरी हो सकती है।
lexical_decisions:
- source_word: θυρίδος
  choice: खिड़की
  rationale: यह शब्द खिड़की या छोटे खुले स्थान को दर्शाता है; प्रसंग में ‘खिड़की’ सबसे स्वाभाविक और विशिष्ट हिन्दी शब्द है।
- source_word: σαργάνῃ
  choice: टोकरी
  rationale: यह बुनी हुई, सम्भवतः रस्सी या बेंत की, टोकरी को दर्शाता है। मुख्य पाठ में ‘टोकरी’ सहज है, जबकि सामग्री की सम्भावित विशिष्टता पाद-टिप्पणी में रखी गई है।
- source_word: ἐχαλάσθην
  choice: मुझे ... नीचे उतारा गया
  rationale: χαλάω के कर्मवाच्य रूप का अर्थ यहाँ रस्सी आदि के सहारे नीचे उतारा जाना है। यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: διὰ τοῦ τείχους
  choice: दीवार के आर-पार
  rationale: वाक्यांश दीवार में बने खुले स्थान के रास्ते निकलने का भाव देता है। ‘आर-पार’ इस गति को स्पष्ट करता है, बिना ‘नगर की’ जैसा अप्रकट विवरण जोड़े।
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: मैं उसके हाथों से बच निकला
  rationale: यह यूनानी मुहावरे की सजीवता बनाए रखते हुए किसी की पकड़ या अधिकार से बच निकलने का स्वाभाविक हिन्दी रूप है।
