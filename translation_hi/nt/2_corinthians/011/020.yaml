reference: 2 Corinthians 11:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀνέχεσθε γὰρ εἴ τις ὑμᾶς καταδουλοῖ, εἴ τις κατεσθίει, εἴ τις λαμβάνει, εἴ τις ἐπαίρεται, εἴ τις ⸂εἰς πρόσωπον ὑμᾶς⸃ δέρει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: hi
  text: क्योंकि यदि कोई तुम्हें दास बना ले, यदि कोई तुम्हें निगल जाए, यदि कोई तुमसे कुछ ले ले[a], यदि कोई अपने आपको ऊँचा उठाए, यदि कोई तुम्हारे चेहरे पर मारे, तो तुम यह सब सहते हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारा लाभ उठाए”; यूनानी में केवल “लेता है” है, जिसका यहाँ आशय संभवतः शोषण करना है।
    reason: lexical_alternative
  - marker: b
    text: या “तुम यह सब बरदाश्त करते हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: तुम यह सब सह लेते हो
  rationale: वर्तमानकालीन क्रिया कुरिन्थियों द्वारा ऐसे दुर्व्यवहार को वास्तव में सहते रहने को व्यक्त करती है। हिंदी में सूची के अंत में ‘यह सब’ जोड़ना सभी शर्तों को स्वाभाविक ढंग से समेटता है और व्यंग्यात्मक फटकार बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन से पद के व्याख्यात्मक संबंध को स्पष्ट रखता है।
- source_word: καταδουλοῖ
  choice: दास बना ले
  rationale: क्रिया किसी को दासता या अधीनता में लाने का प्रबल अर्थ रखती है; इसे नरम करके केवल ‘वश में करना’ नहीं कहा गया।
- source_word: κατεσθίει
  choice: निगल जाए
  rationale: यह शोषण के लिए प्रयुक्त सजीव, हिंसक रूपक को सुरक्षित रखता है।
- source_word: λαμβάνει
  choice: तुमसे कुछ ले ले
  rationale: यूनानी क्रिया अपने आप में व्यापक है। ‘कुछ’ हिंदी में वाक्य को पूरा करता है, पर धन या किसी विशेष वस्तु को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐπαίρεται
  choice: अपने आपको ऊँचा उठाए
  rationale: यह आत्म-उन्नयन और घमंड की भाव-छवि को विशेषणात्मक भावानुवाद की अपेक्षा अधिक निकटता से रखता है।
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: तुम्हारे मुँह पर मारे
  rationale: यह शारीरिक प्रहार और सार्वजनिक अपमान दोनों की ठोस छवि रखता है, जबकि इसे केवल ‘थप्पड़’ तक सीमित नहीं करता।
- source_word: εἴ τις
  choice: यदि कोई
  rationale: हर खंड में दोहराई गई शर्तीय संरचना मूल की अलंकारिक लय और बढ़ती हुई फटकार को सुरक्षित रखती है।
theological_decisions:
- issue: पौलुस के कथन का व्यंग्यात्मक स्वर
  choice: दुर्व्यवहार सहने के लिए कुरिन्थियों को विडंबनापूर्ण फटकार के रूप में कथन रखा गया है, पर दुर्व्यवहार करने वालों को मुख्य पाठ में ‘झूठे प्रेरित’ नहीं कहा गया।
  alternative: मुख्य पाठ में अपराधियों को स्पष्ट रूप से झूठे प्रेरित या शिक्षक कहना।
  rationale: व्यापक संदर्भ उस पहचान और व्यंग्य का समर्थन करता है, किंतु इस पद का यूनानी पाठ केवल उनके कामों की सूची देता है; इसलिए संदर्भगत निष्कर्ष को पाठ में नहीं जोड़ा गया।
- issue: λαμβάνει का आशय
  choice: ‘तुमसे कुछ ले ले’ के द्वारा शोषण की संभावना रखते हुए वस्तु को अनिश्चित छोड़ा गया है।
  alternative: ‘तुम्हारा लाभ उठाए’ या विशेष रूप से धन ऐंठने का अर्थ देना।
  rationale: संदर्भ शोषण का संकेत देता है, लेकिन मूल क्रिया केवल ‘लेता है’ कहती है; इसलिए अस्पष्टता को पादटिप्पणी सहित सुरक्षित रखा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर ‘यदि कोई’ संरचना मूल की अलंकारिक पुनरावृत्ति को बनाए रखती है। हिंदी में स्वाभाविक प्रवाह के लिए मुख्य क्रिया को सूची के अंत में रखा गया है; ‘या’ अंतिम शर्त को जोड़ते हुए संचयी लय स्पष्ट करता है।
