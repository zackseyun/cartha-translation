source:
  edition: SBLGNT
  text: ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ⸀Ἰησοῦ οἶδεν, ὁ ὢν εὐλογητὸς εἰς τοὺς αἰῶνας, ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: hi
  text: प्रभु यीशु का परमेश्वर और पिता—जो सदा धन्य है[a]—जानता है कि मैं झूठ नहीं बोल रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “युगों-युगों तक।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: परमेश्वर और पिता
  rationale: एक ही निश्चित उपपद दोनों संज्ञाओं को जोड़ता है; इसलिए पौलुस की गंभीर अपील में दोनों पदों को बनाए रखा गया है।
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: प्रभु यीशु का
  rationale: मूल पाठ में ‘हमारे’ नहीं है; इसलिए उसे नहीं जोड़ा गया। κύριος को पदवी के रूप में ‘प्रभु’ किया गया है।
- source_word: οἶδεν
  choice: जानता है
  rationale: क्रिया का सीधा अर्थ ‘जानता है’ है। कथन शपथ-जैसी अपील का काम करता है, पर मुख्य पाठ में अर्थ को ‘गवाह है’ कहकर विस्तृत नहीं किया गया।
- source_word: ὁ ὢν εὐλογητὸς
  choice: जो ... धन्य है
  rationale: यह परमेश्वर का वर्णन करने वाला भक्तिपूर्ण उपवाक्य है; हिंदी में संबंधवाचक रचना स्वाभाविक और स्पष्ट है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा
  rationale: यह कालों तक बनी रहने वाली स्तुति को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है; अधिक शब्दशः रूप पादटिप्पणी में दिया गया है।
- source_word: ὅτι
  choice: कि
  rationale: यह परमेश्वर के जानने की विषय-वस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: οὐ ψεύδομαι
  choice: मैं झूठ नहीं बोल रहा हूँ
  rationale: वर्तमान क्रिया के तत्काल, गंभीर दावे को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ‘परमेश्वर और पिता’ का ‘प्रभु यीशु’ से संबंध
  choice: ‘प्रभु यीशु का परमेश्वर और पिता’ के रूप में सीधे अनुवाद किया गया है।
  alternative: धर्मवैज्ञानिक तनाव से बचने के लिए संबंध को ढीला या व्याख्यात्मक बनाना।
  rationale: मूल पाठ पिता और प्रभु यीशु के संबंध तथा व्यक्तियों के भेद को स्पष्ट रखता है; अनुवाद को इसे न दबाना चाहिए, न अतिरिक्त व्याख्या जोड़नी चाहिए।
- issue: स्तुतिपरक उपवाक्य का संबंध और विराम-चिह्न
  choice: ‘जो सदा धन्य है’ को परमेश्वर का कोष्ठकीय, स्तुतिपरक वर्णन मानकर डैश के बीच रखा गया है।
  alternative: इसे बिना अलग विराम के सीमितकारी संबंधवाचक उपवाक्य की तरह जोड़ना।
  rationale: यह पौलुस के गंभीर कथन के भीतर श्रद्धापूर्ण अतिरिक्त वर्णन है; डैश हिंदी में संबंध और प्रवाह दोनों स्पष्ट करते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘धन्य’ बाइबिलीय स्तुतिपरक अर्थ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
