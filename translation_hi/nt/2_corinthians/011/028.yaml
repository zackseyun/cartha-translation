lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: इन बाहरी बातों के अलावा
  rationale: χωρίς के साथ संबंधकारक पद पहले गिनाई गई बातों से अलग एक और बोझ की ओर संकेत करता है। παρεκτός का अर्थ ‘बाहरी बातें’, ‘अन्य बातें’ या ‘जो बातें छोड़ दी गई हैं’ हो सकता है; मुख्य पाठ में प्रसंग से जुड़ा स्वाभाविक अर्थ रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ἐπίστασίς μοι
  choice: मुझ पर ... यह दबाव रहता है
  rationale: ἐπίστασις यहाँ प्रतिदिन अनुभव होने वाले दबाव या बोझ को दर्शाता है। μοι को ‘मुझ पर’ कहना उसके अनुभवात्मक बल को बनाए रखता है; ‘यह’ आगे आने वाली समानाधिकरणीय व्याख्या ‘सभी कलीसियाओं की चिंता’ से स्वाभाविक संबंध बनाता है।
- source_word: ἡ καθ’ ἡμέραν
  choice: हर दिन
  rationale: यह पद दबाव के प्रतिदिन बने रहने या बार-बार आने को व्यक्त करता है। ‘हर दिन’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: ἡ μέριμνα
  choice: चिंता
  rationale: μέριμνα में देखभाल से उपजी चिंता और मानसिक व्याकुलता, दोनों की छाया हो सकती है। हिन्दी का ‘चिंता’ यहाँ उस भावनात्मक और सेवकीय भार को संक्षेप में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: सभी कलीसियाओं की
  rationale: पौलुस के प्रयोग में ἐκκλησίαι मसीही समुदायों को दर्शाता है। हिन्दी बाइबलीय प्रयोग में ‘कलीसियाएँ’ स्पष्ट और परिचित है; संबंधकारक रचना चिंता के विषय को स्वाभाविक रूप से व्यक्त करती है।
theological_decisions:
- issue: μέριμνα में पौलुस के सेवकीय भार का भाव
  choice: ‘चिंता’ रखा गया, जो कलीसियाओं के लिए उसकी गहरी परवाह और उसके मानसिक भार दोनों को व्यक्त कर सकता है।
  alternative: ‘सभी कलीसियाओं की परवाह’ या ‘सभी कलीसियाओं की देखभाल का भार’।
  rationale: मूल शब्द को केवल सद्गुणपूर्ण देखभाल या केवल नकारात्मक व्याकुलता तक सीमित नहीं किया गया; इससे मूल की भावात्मक और धर्मवैचारिक खिंचाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की दीर्घ विराम-रेखा अंतिम पद को प्रतिदिन के दबाव की व्याख्या के रूप में सामने लाती है। ‘कलीसिया’ स्थापित हिन्दी मसीही शब्दावली के अनुरूप है।
