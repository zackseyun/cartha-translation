source:
  edition: SBLGNT
  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: hi
  text: और जब मैं तुम्हारे बीच था और अभाव में था, तब मैं किसी पर बोझ नहीं बना; क्योंकि मकिदुनिया से आए भाइयों ने मेरी कमी पूरी कर दी। और हर बात में मैंने अपने आपको तुम पर बोझ बनने से बचाए रखा और आगे भी बचाए रखूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: जब मैं तुम्हारे बीच था
  rationale: कालवाचक कृदन्त और πρὸς ὑμᾶς का स्वाभाविक, आधुनिक हिन्दी रूप; यह पौलुस की व्यक्तिगत उपस्थिति को स्पष्ट रखता है।
- source_word: ὑστερηθεὶς
  choice: अभाव में पड़ गया था
  rationale: निष्क्रिय कृदन्त यहाँ भौतिक आवश्यकता या कमी का अनुभव बताता है; यह रूप प्रसंगानुकूल और सहज है।
- source_word: οὐ κατενάρκησα οὐθενός
  choice: मैंने किसी पर भार नहीं डाला
  rationale: καταναρκάω यहाँ विशेषतः आर्थिक रूप से बोझ बनने का मुहावरेदार अर्थ देता है; हिन्दी में 'भार डालना' वही संबंधपरक और आर्थिक भाव संप्रेषित करता है।
- source_word: τὸ ὑστέρημά μου
  choice: मेरी कमी
  rationale: संज्ञा उस वस्तु या आवश्यकता को सूचित करती है जिसकी पूर्ति नहीं हुई थी; 'मेरी कमी' संक्षिप्त है और अगले क्रियापद के साथ स्वाभाविक बैठती है।
- source_word: προσανεπλήρωσαν
  choice: पूरी कर दी
  rationale: यह क्रिया विद्यमान कमी की पूर्ति करने का अर्थ देती है; 'कमी पूरी कर दी' हिन्दी का स्वाभाविक प्रयोग है।
- source_word: οἱ ἀδελφοὶ
  choice: भाइयों
  rationale: यूनानी रूप पुल्लिंग बहुवचन है और इस प्रसंग में मकिदुनिया से आए विशिष्ट सहकर्मियों की ओर संकेत संभवतः करता है; इसलिए मुख्य पाठ में पुल्लिंग रखा गया है।
- source_word: ἐλθόντες ἀπὸ Μακεδονίας
  choice: मकिदुनिया से आए
  rationale: कृदन्त को हिन्दी में विशेषणात्मक पदबंध बनाना सहज है और सहायता देने वालों के भौगोलिक स्रोत को सुरक्षित रखता है।
- source_word: ἐν παντί
  choice: हर बात में
  rationale: यह व्यापक क्रियाविशेषणीय अर्थ को बिना अनावश्यक व्याख्या के स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν
  choice: अपने आपको तुम पर भार बनने से बचाए रखा
  rationale: यूनानी पदबंध का अर्थ स्वयं को उनके लिए बोझरहित बनाए रखना है, विशेषतः आर्थिक दृष्टि से; हिन्दी में अर्थ स्पष्ट करने के लिए हल्का विस्तार आवश्यक है।
- source_word: ἐτήρησα καὶ τηρήσω
  choice: बचाए रखा है और आगे भी बचाए रखूँगा
  rationale: दोनों क्रियारूप अतीत में निभाई गई और भविष्य में जारी रखी जाने वाली नीति को बताते हैं; हिन्दी पूर्ण पक्ष वर्तमान प्रासंगिकता भी व्यक्त करता है।
theological_decisions:
- issue: ἀδελφοὶ का लिंग-सटीक अनुवाद
  choice: भाइयों
  alternative: भाई-बहनों / विश्वासियों
  rationale: मूल शब्द पुल्लिंग बहुवचन है और प्रसंग में मकिदुनिया से आए विशिष्ट पुरुष सहकर्मी अभिप्रेत हो सकते हैं। व्यापक पौलुसी प्रयोग की संभावना को मुख्य पाठ में निश्चित मानकर लिंग-निरपेक्ष नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सामान्य पाठकों के लिए सहज। 'तुम्हारे' शैलीगत रूप से यूनानी बहुवचन संबोधन को स्वाभाविक ढंग से व्यक्त करता है। आर्थिक प्रसंग स्पष्ट है, पर 'भार' की व्यापक संबंधपरक प्रतिध्वनि भी बनी रहती है।
