translation:
  language: hi
  text: क्योंकि तुम तो समझदार होकर मूर्खों को खुशी से सह लेते हो।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्खों को बर्दाश्त कर लेते हो।”
    reason: lexical_alternative
  - marker: b
    text: 'पौलुस यहाँ विडंबना से बोल रहा है: कुरिन्थी अपने आपको समझदार मानते थे, फिर भी वे मूर्खों को सह लेते थे।'
    reason: cultural_note
lexical_decisions:
- source_word: ἡδέως
  choice: खुशी से
  rationale: यह क्रियाविशेषण प्रसन्नतापूर्वक या स्वेच्छा से स्वीकार करने का भाव देता है; यहाँ यह पौलुस की विडंबना को भी बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है और हिन्दी में संबंध को स्पष्ट रखता है।
- source_word: ἀνέχεσθε
  choice: सह लेते हो
  rationale: क्रिया का अर्थ किसी व्यक्ति को सहना या बर्दाश्त करना है। ‘सह लेते हो’ स्वाभाविक आधुनिक हिन्दी है और प्रसंग की तीखी विडंबना बनाए रखता है।
- source_word: τῶν ἀφρόνων
  choice: मूर्खों को
  rationale: यह ἀνέχεσθε का व्यक्तिवाचक कर्म है। ‘मूर्खों’ से φρόνιμοι के साथ मूल पाठ का सीधा विरोध बना रहता है।
- source_word: φρόνιμοι
  choice: समझदार
  rationale: शब्द विवेकशील या बुद्धिमान होने का भाव देता है। ‘समझदार’ साधारण आधुनिक हिन्दी में स्वाभाविक है और यहाँ व्यंग्यपूर्ण विरोध को स्पष्ट रखता है।
- source_word: ὄντες
  choice: होकर भी
  rationale: कृदन्त को सहज हिन्दी में व्यक्त किया गया है। ‘भी’ प्रसंग में निहित विडंबनापूर्ण विरोध दिखाता है, पर कथन को खुली व्याख्यात्मक पुनर्रचना में नहीं बदलता।
theological_decisions:
- issue: कुरिन्थियों के प्रति पौलुस की विडंबनापूर्ण भाषा
  choice: मूर्खों और समझदार होने का सीधा विरोध रखते हुए वाक्य को स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
  alternative: ‘तुम अपने आपको इतना समझदार जो मानते हो’ जैसे शब्द जोड़कर व्यंग्य को स्पष्ट करना।
  rationale: यूनानी पाठ में विडंबना ‘मूर्खों’ और ‘समझदार’ के विरोध से उभरती है। अनूदित पाठ इसे बनाए रखता है, लेकिन कुरिन्थियों के आत्म-मूल्यांकन को मुख्य पाठ में अतिरिक्त शब्दों से स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘खुशी से सह लेते हो’ मूल की स्वैच्छिक सहनशीलता और व्यंग्यात्मक तीखेपन को व्यक्त करता है।
