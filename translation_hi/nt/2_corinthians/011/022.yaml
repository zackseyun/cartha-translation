base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: hi
  text: क्या वे इब्रानी हैं? मैं भी हूँ। क्या वे इस्राएली हैं? मैं भी हूँ। क्या वे अब्राहम की संतान हैं[a]? मैं भी हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अब्राहम का बीज’। यूनानी में सामूहिक अर्थ वाला एकवचन शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: इब्रानी
  rationale: यह स्थापित जातीय-सांस्कृतिक पद है और ‘इस्राएली’ से स्रोत में उपस्थित भेद को बनाए रखता है।
- source_word: κἀγώ
  choice: मैं भी हूँ
  rationale: καί + ἐγώ की संक्षिप्त, बलपूर्ण पुनरावृत्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἰσραηλῖταί
  choice: इस्राएली
  rationale: यह इस्राएल की प्रजा से संबंधित पहचान को ठीक प्रकार व्यक्त करता और ‘इब्रानी’ से अलग पद बनाए रखता है।
- source_word: σπέρμα Ἀβραάμ
  choice: अब्राहम के वंश
  rationale: ‘वंश’ हिन्दी में स्वाभाविक सामूहिक एकवचन है, इसलिए यूनानी σπέρμα की सामूहिक एकवचन अभिव्यक्ति को यथासंभव बनाए रखता है।
- source_word: εἰσιν
  choice: क्या वे ... हैं? / मैं भी हूँ
  rationale: बार-बार प्रयुक्त संयोजक क्रिया को हिन्दी के स्वाभाविक प्रश्न-उत्तर रूप में रखते हुए स्रोत की तीखी आलंकारिक लय बचाई गई है।
theological_decisions:
- issue: यहूदी पहचान के तीन निकटवर्ती किंतु अलग पद
  choice: ‘इब्रानी’, ‘इस्राएली’ और ‘अब्राहम के वंश’—तीनों को अलग रखा गया है।
  alternative: तीनों को ‘यहूदी’ या ‘अब्राहम के वंशज’ जैसे एक ही अर्थवाले पद में मिला देना।
  rationale: पौलुस की दलील पहचान और विरासत के एक-दूसरे से जुड़े, पर अलग-अलग दावों को क्रम से रखने पर निर्भर है; उन्हें एक ही श्रेणी में मिलाना स्रोत की बलपूर्ण रचना को समतल कर देगा।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। छोटे प्रश्नों और ‘मैं भी हूँ’ की पुनरावृत्ति से मूल की संक्षिप्त, चुनौतीपूर्ण लय बनाए रखी गई है।
