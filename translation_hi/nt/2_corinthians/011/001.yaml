base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/001.yaml
  text: I wish you would bear with me in a little foolishness[a]. But indeed[b], do bear with me.
translation:
  language: hi
  text: काश, तुम मेरी थोड़ी-सी मूर्खता को सह लेते![a] पर सचमुच, मुझे सह लो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “थोड़ी-सी नासमझी।”
    reason: lexical_alternative
  - marker: b
    text: या, “पर सचमुच, तुम मुझे सह भी रहे हो।” यूनानी क्रिया-रूप को कथन या अपील—दोनों के रूप में समझा जा सकता है।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: Ὄφελον
  choice: काश
  rationale: यह इच्छा व्यक्त करने वाला अव्यय है। ‘काश’ आधुनिक हिन्दी में इसकी प्रबल कामना को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἀνείχεσθέ / ἀνέχεσθέ
  choice: सह लेते / सह लो
  rationale: ἀνέχομαι का भाव किसी व्यक्ति या उसके व्यवहार को धैर्य से सहने का है। दोनों बार ‘सहना’ रखकर पौलुस की दोहराई हुई अपील सुरक्षित रखी गई है।
- source_word: μου
  choice: मेरी / मुझे
  rationale: पहले वाक्य में हिन्दी प्रयोग के अनुसार इसे ‘मेरी ... मूर्खता’ से जोड़ा गया है; दूसरे में उसी व्यक्ति-संबंधी भाव को स्वाभाविक रूप से ‘मुझे’ कहा गया है।
- source_word: μικρόν τι
  choice: थोड़ी-सी
  rationale: यह मात्रा को विनम्रतापूर्वक छोटा करके बताने वाली अभिव्यक्ति है; ‘थोड़ी-सी’ पौलुस के आलंकारिक न्यूनोक्ति-भाव को बनाए रखती है।
- source_word: ἀφροσύνης
  choice: मूर्खता
  rationale: यह शब्द मूर्खता या मूर्खतापूर्ण आचरण को सूचित करता है। ‘मूर्खता’ स्पष्ट, वर्तमान और आगे आने वाले विडंबनापूर्ण घमंड के प्रसंग के अनुकूल है।
- source_word: ἀλλὰ καὶ
  choice: पर सचमुच
  rationale: यह संयोजन पहली इच्छा के बाद अपील को विरोधात्मक ढंग से फिर उठाकर उस पर बल देता है। ‘पर सचमुच’ दोनों पहलुओं को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: पौलुस का अपनी बात को ‘मूर्खता’ कहना
  choice: इसे आलंकारिक आत्म-नम्रता के रूप में बिना नरम किए ‘मूर्खता’ रखा गया है
  alternative: नासमझी या मूर्खतापूर्ण बात
  rationale: यह पद आगे आने वाले पौलुस के विडंबनापूर्ण ‘घमंड’ का आरम्भ करता है। स्पष्ट शब्द बनाए रखने से पाठ का तनाव सुरक्षित रहता है।
- issue: ἀνέχεσθέ की विधि-संबंधी अस्पष्टता
  choice: मुख्य पाठ में इसे आदेश/अपील के रूप में ‘मुझे सह लो’ रखा गया है
  alternative: ‘तुम मुझे सह भी रहे हो’—इसे कथन के रूप में समझना
  rationale: यूनानी रूप आदेश और कथन, दोनों के रूप में समझा जा सकता है। निकट प्रसंग और दोहराई गई अपील आदेश का समर्थन करते हैं, पर वैकल्पिक व्याकरणिक समझ पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘काश’ इच्छा की तीव्रता और ‘पर सचमुच’ दोहराई हुई जोरदार अपील को व्यक्त करते हैं; ‘मूर्खता’ पौलुस की जानबूझकर रखी गई विडंबना को बनाए रखती है।
