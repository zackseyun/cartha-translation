id: 2CO.11.10
reference: 2 Corinthians 11:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι ἡ καύχησις αὕτη οὐ φραγήσεται εἰς ἐμὲ ἐν τοῖς κλίμασι τῆς Ἀχαΐας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: hi
  text: मसीह की सच्चाई मुझ में है[a]—अखाया के प्रदेशों में मेरे इस गर्व करने पर रोक नहीं लगाई जाएगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसीह की सच्चाई मेरे भीतर है।” यह कथन गंभीर आश्वासन या शपथ-जैसा है।
    reason: alternative_reading
  - marker: b
    text: 'शाब्दिक भाव: “जहाँ तक मेरा संबंध है, इस गर्व करने को रोका या बंद नहीं किया जाएगा।” यूनानी अभिव्यक्ति कठिन और मुहावरेदार है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια Χριστοῦ
  choice: मसीह की सच्चाई
  rationale: संबंधवाचक षष्ठी को स्वाभाविक रूप से उस सच्चाई के रूप में रखा गया है जो मसीह से संबंधित है अथवा उनकी है; Χριστός को यहाँ उपाधि के रूप में ‘मसीह’ कहा गया है।
- source_word: ἐν ἐμοὶ
  choice: मुझ में है
  rationale: मूल के सीधेसादे स्थानवाचक कथन को बनाए रखता है और पौलुस के गंभीर, शपथ-जैसे आश्वासन को अनावश्यक रूप से नहीं समझाता।
- source_word: ὅτι
  choice: —
  rationale: यहाँ ὅτι शपथ-जैसे आरंभ के बाद कथन की विषयवस्तु प्रस्तुत करता है। हिन्दी में डैश उस संबंध को स्वाभाविक ढंग से व्यक्त करता है, बिना इसे कारणसूचक ‘क्योंकि’ बनाने के।
- source_word: καύχησις
  choice: गर्व करना
  rationale: यह चुनाव घमंड या गर्व करने की क्रिया/विषय दोनों को व्यक्त करता है और प्रसंग में पौलुस के अपने दावे की ओर संकेत करता है।
- source_word: οὐ φραγήσεται
  choice: रोक नहीं लगाई जाएगी
  rationale: φράσσω के रोकने, बंद करने या अवरुद्ध करने के रूपक और भविष्यत् कर्मवाच्य को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: εἰς ἐμὲ
  choice: मेरे इस गर्व करने पर
  rationale: कठिन यूनानी पदबंध को हिन्दी में पौलुस से संबंधित गर्व के रूप में व्यक्त किया गया है; अधिक शाब्दिक संबंधसूचक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: अखाया के प्रदेशों में
  rationale: κλίμασι के बहुवचन ‘प्रदेशों/क्षेत्रों’ को बनाए रखते हुए रोमी प्रांत Ἀχαΐα का मानक लिप्यंतरण ‘अखाया’ दिया गया है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: इस पौलुसी कथन में Χριστός उपाधि का बल रखता है; इसलिए आधुनिक हिन्दी में व्यापक और अर्थपूर्ण ‘मसीह’ चुना गया है।
- issue: ἀλήθεια Χριστοῦ में संबंध
  choice: मसीह की सच्चाई
  alternative: मसीह के विषय की सच्चाई
  rationale: मूल का संबंधवाचक रूप जानबूझकर खुला रखा गया है; इसे केवल मसीह के विषय में संदेश मानकर सीमित नहीं किया गया।
- issue: शपथ-जैसे वाक्य का बल
  choice: मसीह की सच्चाई मुझ में है—
  alternative: मसीह की सच्चाई मुझ में है कि
  rationale: मूल की गंभीर प्रतिज्ञात्मक शैली को सुरक्षित रखते हुए हिन्दी की अस्वाभाविक ‘है कि’ रचना से बचा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘गर्व करना’ प्रसंग के तकनीकी पौलुसी भाव को रखता है, जबकि ‘रोक लगाई जाएगी’ अवरोध के रूपक को सहज हिन्दी में व्यक्त करता है।
