  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: hi
  text: पर जो मैं कर रहा हूँ, उसे करता रहूँगा, ताकि उन लोगों से अवसर[a] छीन लूँ जो अवसर चाहते हैं, जिससे जिस बात पर वे घमंड करते हैं, उसी में वे हमारे समान पाए जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘अवसर’ के दोनों स्थानों पर ‘बहाना’ या ‘मौका’ भी सम्भव है (यूनानी: ἀφορμή)।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: परन्तु जो मैं कर रहा हूँ, वही करता रहूँगा
  rationale: वर्तमान ποιῶ और भविष्य ποιήσω पौलुस के वर्तमान आचरण तथा उसे जारी रखने के निश्चय को व्यक्त करते हैं। ‘करता रहूँगा’ आधुनिक हिन्दी में इस आशय को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ἐκκόψω
  choice: छीन लूँ
  rationale: ἐκκόπτω का मूल चित्र ‘काट देना’ है, पर यहाँ आशय विरोधियों को किसी अवसर से वंचित करना है। ‘अवसर छीन लूँ’ हिन्दी में रूपक की तीक्ष्णता और प्रसंगगत अर्थ दोनों रखता है।
- source_word: ἀφορμή
  choice: अवसर
  rationale: ἀφορμή का अर्थ अवसर, मौका, आधार या बहाना हो सकता है। ‘अवसर’ अपेक्षाकृत तटस्थ है और दोनों बार की पुनरावृत्ति बनाए रखता है; अधिक आरोपात्मक ‘बहाना’ को पादटिप्पणी में रखा गया है।
- source_word: τῶν θελόντων ἀφορμήν
  choice: उन लोगों से अवसर ... जो अवसर चाहते हैं
  rationale: यह अनुवाद यूनानी में ἀφορμή की जानबूझकर की गई पुनरावृत्ति को बनाए रखता है और वाक्य को साधारण आधुनिक हिन्दी में सुबोध बनाता है।
- source_word: ἐν ᾧ καυχῶνται
  choice: जिस बात पर वे घमण्ड करते हैं
  rationale: यह पद उस विषय या क्षेत्र को दर्शाता है जिसके संबंध में विरोधी घमण्ड करते हैं। ‘जिस बात पर’ हिन्दी में स्वाभाविक है और विषय को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: वे भी हमारे समान ही पाए जाएँ
  rationale: ‘पाए जाएँ’ निष्क्रिय विधिलिंग εὑρεθῶσιν को बनाए रखता है, और ‘हमारे समान ही’ καθὼς καὶ ἡμεῖς के तुलनात्मक बल को व्यक्त करता है।
theological_decisions:
- issue: विरोधियों द्वारा चाही गई ἀφορμή का स्वरूप
  choice: मुख्य पाठ में तटस्थ ‘अवसर’
  alternative: ‘बहाना’ या ‘मौका’
  rationale: पौलुस का प्रसंग विवादात्मक है, फिर भी संज्ञा ἀφορμή स्वयं अनिवार्यतः छलपूर्ण ‘बहाना’ नहीं दर्शाती। तटस्थ शब्द मूल की अर्थगत खुली संभावना को सुरक्षित रखता है, जबकि प्रसंग से संभावित नकारात्मक अर्थ पादटिप्पणी में दिया गया है।
- issue: ‘हमारे समान’ होने का सटीक आधार
  choice: तुलना को सामान्य और अनिर्दिष्ट रखा गया
  alternative: इसे विशेष रूप से निःशुल्क सेवा या आर्थिक आत्मनिर्भरता के रूप में स्पष्ट करना
  rationale: निकटवर्ती प्रसंग उस दिशा का संकेत दे सकता है, पर इस पद में तुलना का आधार स्पष्ट संज्ञा से नहीं बताया गया। इसलिए अनुवाद मूल की संक्षिप्तता और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप अपनाया गया है। यूनानी वाक्य की पुनरावृत्ति, भविष्यगत दृढ़ता और तुलना की अस्पष्टता सुरक्षित रखी गई है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में संबंधित वाक्य के अंत में दिया गया है।
