lexical_decisions:
- source_word: ὑπὸ Ἰουδαίων
  choice: यहूदियों से
  rationale: ὑπό के साथ संबंधकारक दंड देने वाले व्यक्तियों/स्रोत को सूचित करता है। ‘यहूदियों से’ स्वाभाविक हिंदी है और किसी विशिष्ट शासी निकाय को अनावश्यक रूप से नहीं जोड़ता।
- source_word: πεντάκις
  choice: पाँच बार
  rationale: यह क्रियाविशेषण सीधे-सीधे घटना के पाँच बार होने को व्यक्त करता है।
- source_word: τεσσεράκοντα παρὰ μίαν
  choice: चालीस में एक कम कोड़े
  rationale: यूनानी अभिव्यक्ति का रूप ‘चालीस में से एक कम’ है। दंड के प्रसंग में निहित प्रहारों को स्पष्ट करने के लिए ‘कोड़े’ जोड़ा गया है, जबकि केवल ‘उनतालीस’ कहने के बजाय मूल अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: ἔλαβον
  choice: मैंने ... खाए
  rationale: यहाँ λαμβάνω दंड पाने/सहने के अर्थ में है। हिंदी में ‘कोड़े खाए’ ‘प्राप्त किए’ की अपेक्षा अधिक स्वाभाविक और सटीक है।
theological_decisions:
- issue: दंड देने वालों की पहचान
  choice: यहूदियों से
  alternative: यहूदी अधिकारियों से
  rationale: मूल पाठ यहूदियों को कारक/स्रोत बताता है, पर किसी विशेष परिषद या आधिकारिक निकाय का स्पष्ट उल्लेख नहीं करता; इसलिए अधिक विशिष्ट पहचान नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कोड़े खाए’ सामान्य हिंदी में दंड सहने की स्वाभाविक अभिव्यक्ति है; शब्दक्रम बार-बार हुए अनुभव पर बल बनाए रखता है।
