reference: 2 Corinthians 11:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ἰδιώτης τῷ λόγῳ, ἀλλ’ οὐ τῇ γνώσει, ἀλλ’ ἐν παντὶ ⸀φανερώσαντες ἐν πᾶσιν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: hi
  text: पर यदि मैं बोलने की कला में अकुशल[a] भी हूँ, तो ज्ञान में नहीं; फिर भी, हर प्रकार से और सब बातों में हमने इसे तुम्हारे सामने स्पष्ट कर दिया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बोलने में अप्रशिक्षित”; अर्थात् माँजी हुई वक्तृत्व-कला से रहित।
    reason: lexical_alternative
  - marker: b
    text: 'मूल यूनानी अभिव्यक्ति संक्षिप्त और कुछ अस्पष्ट है। इसका अर्थ यह भी हो सकता है: “हर प्रकार से हमने इसे सब लोगों के बीच तुम्हारे सामने स्पष्ट कर दिया है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης τῷ λόγῳ
  choice: बोलने की कला में अकुशल
  rationale: यह पद सामान्य अशिक्षा नहीं, बल्कि औपचारिक या प्रभावशाली वक्तृत्व-कौशल की कमी दर्शाता है; ‘बोलने की कला’ आधुनिक हिन्दी में इस संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: γνώσει
  choice: ज्ञान
  rationale: वक्तृत्व-कौशल के विपरीत पौलुस विषय-वस्तु की समझ और ज्ञान का दावा करता है; ‘ज्ञान’ मूल शब्द का सीधा और गरिमापूर्ण अनुवाद है।
- source_word: φανερώσαντες
  choice: हमने इसे ... स्पष्ट कर दिया है
  rationale: कृदन्त यहाँ पौलुस और उसके सहकर्मियों द्वारा इस तथ्य को प्रत्यक्ष रूप से प्रकट करने का भाव देता है; हिन्दी में पूर्ण क्रिया अधिक स्वाभाविक है।
- source_word: ἐν παντί
  choice: हर प्रकार से
  rationale: यह व्यापक रीति या हर दृष्टि से प्रदर्शन का भाव रखता है।
- source_word: ἐν πᾶσιν
  choice: सब बातों में
  rationale: ग्रीक वाक्यांश संक्षिप्त और कुछ हद तक अस्पष्ट है; यह चयन उसके व्यापक दायरे को व्यक्त करता है, बिना उसे केवल व्यक्तियों या परिस्थितियों तक सीमित किए।
- source_word: εἰς ὑμᾶς
  choice: तुम्हारे सामने
  rationale: यह कुरिन्थियों की ओर किए गए खुले प्रकटीकरण का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पौलुस के आत्मवर्णन में ἰδιώτης का आशय
  choice: वह वक्तृत्व-कला में अपनी कमी मानता है, ज्ञान या सत्य में नहीं
  alternative: वह सामान्य रूप से अशिक्षित है; अथवा उसका कथन पूर्णतः व्यंग्यात्मक है
  rationale: ‘बोलने’ और ‘ज्ञान’ का स्पष्ट विरोध बताता है कि प्रसंग अलंकृत या प्रशिक्षित वक्तृत्व का है, न कि पौलुस के अधिकार, शिक्षा या संदेश की सत्यता का।
- issue: ἐν παντί ... ἐν πᾶσιν की व्याख्या
  choice: हर प्रकार से और सब बातों में
  alternative: हर प्रकार से सब लोगों के बीच; अथवा हर परिस्थिति में
  rationale: दोनों निकटवर्ती व्यापक अभिव्यक्तियों को बनाए रखने से मूल की संक्षिप्तता और संभावित अर्थ-तनाव सुरक्षित रहता है; वैकल्पिक व्यक्तिवाचक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; ‘तुम्हारे’ का प्रयोग पत्र के सामुदायिक संबोधन के लिए है। भाषा सरल और गरिमापूर्ण रखी गई है। ‘बोलने की कला’ वक्तृत्व-संदर्भ स्पष्ट करती है, जबकि अंतिम खंड की यूनानी अस्पष्टता पादटिप्पणी में सुरक्षित है।
