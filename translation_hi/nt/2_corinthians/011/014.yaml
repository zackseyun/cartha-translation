  yaml_path: translation/nt/2_corinthians/011/014.yaml
  text: And no wonder[a], for Satan himself disguises himself as an angel of light.
translation:
  language: hi
  text: और इसमें कोई आश्चर्य नहीं, क्योंकि शैतान स्वयं ज्योति के स्वर्गदूत का रूप धारण करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आपको ज्योति के स्वर्गदूत के रूप में बदल लेता है।” यूनानी क्रिया का अधिक शाब्दिक अर्थ “रूप बदलना” है, पर यहाँ संभवतः छलपूर्ण बाहरी रूप का संकेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: पिछले पद से विचार का संबंध बनाए रखने वाला सामान्य संयोजक।
- source_word: οὐ θαῦμα
  choice: यह कोई आश्चर्य की बात नहीं
  rationale: यूनानी मुहावरे का स्वाभाविक आधुनिक हिन्दी रूप, जिसका अर्थ है कि यह चकित करने वाली बात नहीं है।
- source_word: αὐτὸς ... ὁ Σατανᾶς
  choice: शैतान स्वयं
  rationale: αὐτός की बलात्मकता को ‘स्वयं’ से व्यक्त किया गया है; यूनानी लेख को हिन्दी में अलग से व्यक्त करना आवश्यक नहीं।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पहले कथन का कारण बताता है और हिन्दी में व्याख्यात्मक संबंध स्पष्ट रखता है।
- source_word: μετασχηματίζεται
  choice: रूप धारण कर लेता है
  rationale: क्रिया दिखाई देने वाले रूप या प्रस्तुति में बदलाव को व्यक्त कर सकती है; यह अनिवार्य रूप से तत्त्वगत परिवर्तन का दावा नहीं करती।
- source_word: εἰς
  choice: का
  rationale: ‘ज्योति के दूत का रूप धारण करना’ हिन्दी में स्वाभाविक ढंग से किसी रूप या भूमिका को अपनाना व्यक्त करता है।
- source_word: ἄγγελον
  choice: दूत
  rationale: ἄγγελος का मूल अर्थ ‘दूत’ है; अलौकिक संदर्भ यहाँ स्पष्ट है, और ‘ज्योति के दूत’ बाइबलीय गरिमा बनाए रखता है।
- source_word: φωτός
  choice: ज्योति के
  rationale: सम्बन्धकारक रचना और बाइबलीय प्रकाश-प्रतिमा को संक्षिप्त तथा औपचारिक रूप में सुरक्षित रखता है।
theological_decisions:
- issue: शैतान के रूप-परिवर्तन की प्रकृति
  choice: पाठ में ‘ज्योति के दूत का रूप धारण करना’ रखा गया है, जो भ्रामक बाहरी प्रस्तुति को समाहित करता है और वास्तविक तत्त्वगत परिवर्तन को अनिवार्य नहीं बनाता।
  alternative: शैतान वास्तव में ज्योति के दूत में बदल जाता है।
  rationale: μετασχηματίζεται रूप या दिखाई देने वाली प्रस्तुति के बदलने का बोध करा सकता है। निकट संदर्भ छलपूर्ण सेवकों का है; फिर भी क्रिया की ‘रूप बदलने’ वाली वास्तविक शब्दगत गुंजाइश को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ज्योति’ ने मूल की बाइबलीय प्रतिमा सुरक्षित रखी है, जबकि ‘रूप धारण कर लेता है’ सामान्य पाठक के लिए स्वाभाविक है।
