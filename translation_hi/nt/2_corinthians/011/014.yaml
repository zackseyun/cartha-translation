review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the connective, the intensive ‘शैतान स्वयं,’ the explanatory ‘क्योंकि,’ and the imagery of an angel associated with light. However, ‘दूत’ can denote an ordinary human messenger in modern Hindi, whereas ἄγγελον in this context specifically denotes an angelic being. ‘स्वर्गदूत’ supplies the required sense without making a claim about the nature of the apparent transformation.
  naturalness: ‘और इसमें कोई आश्चर्य नहीं’ and the present-tense ‘रूप धारण करता है’ are slightly more idiomatic and closer to the Greek present than ‘और यह कोई आश्चर्य की बात नहीं’ and ‘रूप धारण कर लेता है.’
  terminology: Use ‘स्वर्गदूत’ for ἄγγελος in this supernatural context. Retain ‘ज्योति’ to preserve the source’s genitive imagery and biblical register.
  issues:
  - severity: medium
    issue: ‘दूत’ is semantically broader than the intended angelic referent.
    rationale: In modern Hindi it can readily mean a human envoy or messenger. The Greek context and the English audit trail identify ἄγγελον as ‘angel,’ so ‘स्वर्गदूत’ is the clearer equivalent.
  - severity: low
    issue: The main verb is rendered with a somewhat completive form.
    rationale: ‘रूप धारण कर लेता है’ is possible, but ‘रूप धारण करता है’ more directly reflects the Greek present and reads naturally in this general statement.
  revised_text: और इसमें कोई आश्चर्य नहीं, क्योंकि शैतान स्वयं ज्योति के स्वर्गदूत का रूप धारण करता है।[a]
