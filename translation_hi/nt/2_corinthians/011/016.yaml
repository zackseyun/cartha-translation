  text: Πάλιν λέγω, μή τίς με δόξῃ ἄφρονα εἶναι— εἰ δὲ μή γε, κἂν ὡς ἄφρονα δέξασθέ με, ἵνα κἀγὼ μικρόν τι καυχήσωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: hi
  text: मैं फिर कहता हूँ, कोई मुझे मूर्ख न समझे; पर यदि नहीं, तो मुझे मूर्ख समझकर भी स्वीकार कर लो, ताकि मैं भी थोड़ा-सा घमण्ड कर सकूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: मैं फिर कहता हूँ
  rationale: पुनरावृत्ति और सीधे कथन—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: कोई मुझे मूर्ख न समझे
  rationale: μή के साथ संभावनार्थक क्रिया के निषेधात्मक आग्रह और δοκέω के ‘समझना/मानना’ अर्थ को संक्षिप्त तथा स्वाभाविक रूप में व्यक्त करता है। हिन्दी में ‘मूर्ख’ विशेषण और संज्ञा दोनों की तरह समझा जा सकता है, इसलिए यूनानी की वास्तविक लचक बनी रहती है।
- source_word: εἰ δὲ μή γε
  choice: लेकिन यदि ऐसा न हो
  rationale: पहले आग्रह को श्रोता स्वीकार न करें तो पौलुस जिस वैकल्पिक रियायत की ओर मुड़ता है, उसे स्पष्ट करता है और यूनानी वाक्यांश के संक्षिप्त अलंकारिक मोड़ को बनाए रखता है।
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: तो मुझे मूर्ख ही समझकर स्वीकार कर लो
  rationale: κἂν के रियायती बल को ‘ही’ से और δέξασθέ के आदेश को ‘स्वीकार कर लो’ से व्यक्त किया गया है। ‘मूर्ख समझकर’ पौलुस की विडम्बनापूर्ण भूमिका को बिना नरम किए रखता है।
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: ताकि मैं भी थोड़ा-सा घमण्ड कर सकूँ
  rationale: ἵνα का प्रयोजन, κἀγώ का समावेशात्मक बल और μικρόν τι की सीमित मात्रा स्पष्ट रहती है; καυχάομαι को नरम किए बिना ‘घमण्ड करना’ कहा गया है।
theological_decisions:
- issue: पौलुस द्वारा मूर्खता और घमण्ड की भाषा का विडम्बनापूर्ण प्रयोग
  choice: ‘मूर्ख’ और ‘घमण्ड’ की प्रत्यक्ष भाषा बनाए रखना
  alternative: इसे ‘बिना समझदारी की बात करना’ या ‘अपनी उपलब्धियाँ बताना’ जैसे नरम भावार्थ में कहना
  rationale: सन्दर्भ में पौलुस अनिच्छा से ऐसी भूमिका स्वीकार करता है जो मूर्खतापूर्ण दिखाई देती है, ताकि विरोधियों जैसी डींग की भाषा में प्रत्युत्तर दे सके। अनुवाद इस अलंकारिक और धर्मवैचारिक तनाव को हल या मंद नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मूर्ख’ हिन्दी में विशेषण तथा संज्ञा दोनों रूपों में स्वाभाविक है, इसलिए ἄφρων की व्याकरणिक लचक बिना पादटिप्पणी के सुरक्षित रहती है।
