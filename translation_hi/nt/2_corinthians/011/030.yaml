id: 2CO.11.30
reference: 2 Corinthians 11:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἰ καυχᾶσθαι δεῖ, τὰ τῆς ἀσθενείας μου καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/030.yaml
  text: If I must boast[a], I will boast in the things of my weakness.
translation:
  language: hi
  text: यदि घमण्ड करना आवश्यक है, तो मैं अपनी निर्बलता से सम्बन्धित बातों पर घमण्ड करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ
  choice: यदि
  rationale: यह यूनानी की शर्तसूचक संरचना को बनाए रखता है और इसे कारणसूचक ‘चूँकि’ बनाकर आवश्यकता से अधिक व्याख्या नहीं करता।
- source_word: καυχᾶσθαι / καυχήσομαι
  choice: घमण्ड करना / घमण्ड करूँगा
  rationale: पौलुस की विडंबनापूर्ण भाषा और दोनों क्रियारूपों की शब्दगत पुनरावृत्ति बनाए रखने के लिए एक ही स्वाभाविक हिन्दी पद चुना गया है।
- source_word: δεῖ
  choice: आवश्यक है
  rationale: यह निर्वैयक्तिक क्रिया में निहित आवश्यकता या विवशता का बल स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘ही’ प्रसंगगत बल को सामने लाता है।
- source_word: τὰ τῆς ἀσθενείας μου
  choice: उन बातों पर ... जो मेरी निर्बलता को दिखाती हैं
  rationale: नपुंसकलिंग बहुवचन τὰ को ‘बातों’ द्वारा बनाए रखते हुए संबंधकारक वाक्यांश का अर्थ सहज हिन्दी में स्पष्ट किया गया है, बिना उसे केवल ‘मेरी निर्बलताओं’ तक सीमित किए।
- source_word: ἀσθενείας
  choice: निर्बलता
  rationale: यह पौलुस की शारीरिक, सामाजिक और परिस्थितिजन्य कमजोरी के व्यापक भाव को रखता है; ‘दुर्बलता’ भी संभव है, पर ‘निर्बलता’ यहाँ स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: पौलुस के घमण्ड का स्वरूप
  choice: घमण्ड को निर्बलता प्रकट करने वाली बातों पर केंद्रित विडंबनापूर्ण कथन के रूप में रखा गया है।
  alternative: ‘मैं अपनी निर्बलताओं पर घमण्ड करूँगा’ या अधिक अक्षरशः ‘मैं अपनी निर्बलता की बातों में घमण्ड करूँगा।’
  rationale: मूल पाठ सामान्य घमण्ड और निर्बलता में घमण्ड के बीच तनाव रखता है। अनुवाद इस विरोधाभास को किसी विस्तृत धर्मवैज्ञानिक व्याख्या से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में सहज। ‘जो मेरी निर्बलता को दिखाती हैं’ मूल के असामान्य संबंधकारक वाक्यांश का अर्थ स्पष्ट करता है, जबकि ‘बातों’ से उसके बहुवचन स्वरूप को बनाए रखता है।
