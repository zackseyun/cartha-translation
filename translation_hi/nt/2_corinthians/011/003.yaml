source:
  edition: SBLGNT
  text: φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ⸂ἐξηπάτησεν Εὕαν⸃ ἐν τῇ πανουργίᾳ αὐτοῦ, ⸀φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος ⸂καὶ τῆς ἁγνότητος⸃ τῆς εἰς τὸν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: hi
  text: परन्तु मुझे डर है कि कहीं ऐसा न हो कि जैसे साँप ने अपनी धूर्तता से हव्वा को धोखा दिया, वैसे ही आपके मन भ्रष्ट होकर मसीह के प्रति निष्कपटता[a] और शुद्धता[b] से दूर हो जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “निष्कपटता” का अनुवाद “सरलता” या “एकनिष्ठता” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: कुछ पाण्डुलिपियों में “और शुद्धता” नहीं है।
    reason: textual_variant
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: परन्तु मुझे डर है कि कहीं ऐसा न हो कि
  rationale: यह स्वाभाविक हिन्दी में पौलुस की निरन्तर आशंका और μή πως से व्यक्त सम्भावना दोनों को सुरक्षित रखता है।
- source_word: ὁ ὄφις
  choice: साँप
  rationale: आधुनिक हिन्दी में सहज और स्पष्ट शब्द है तथा उत्पत्ति के वृत्तान्त का संकेत बनाए रखता है।
- source_word: ἐξηπάτησεν Εὕαν
  choice: हव्वा को धोखा दिया
  rationale: क्रिया के छल देने के अर्थ को सीधे व्यक्त करता है; हव्वा हिन्दी बाइबल परम्परा में प्रचलित नामरूप है।
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: अपनी धूर्तता से
  rationale: ἐν के साधनवाचक प्रयोग और πανουργία की छलपूर्ण चतुराई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: आपके विचार ... भ्रष्ट हो जाएँ
  rationale: νόημα यहाँ सोच-विचार या मानसिक अभिप्राय को सूचित करता है; बहुवचन 'विचार' यूनानी रूप के निकट है और φθαρῇ का निष्क्रिय भाव सुरक्षित रखता है।
- source_word: τῆς ἁπλότητος
  choice: निष्कपटता
  rationale: यहाँ शब्द का भाव सरलता मात्र नहीं, बल्कि सच्ची और एकनिष्ठ वृत्ति है; 'निष्कपटता' आधुनिक हिन्दी में इस नैतिक भाव को स्पष्ट करता है।
- source_word: καὶ τῆς ἁγνότητος
  choice: और पवित्रता
  rationale: यह व्यापक नैतिक शुद्धता को व्यक्त करता है और प्रसंग को केवल यौन शुचिता तक सीमित नहीं करता।
- source_word: τῆς εἰς τὸν Χριστόν
  choice: मसीह के प्रति
  rationale: यह सम्बन्धित गुणों की दिशा या निष्ठा को स्पष्ट करता है; Χριστός को यहाँ उपाधि के रूप में 'मसीह' किया गया है।
theological_decisions:
- issue: Χριστόν का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: इस प्रसंग में Χριστός मसीही उपाधि को व्यक्त करता है; हिन्दी में 'मसीह' अर्थपूर्ण और व्यापक रूप से समझा जाने वाला रूप है।
- issue: ἁπλότης का अर्थ
  choice: निष्कपटता
  alternative: सरलता; एकनिष्ठता
  rationale: प्रसंग मसीह के प्रति अविभाजित और छलरहित निष्ठा का है। मुख्य पाठ में 'निष्कपटता' चुना गया है, जबकि अन्य वास्तविक अर्थछटाएँ पादटिप्पणी में रखी गई हैं।
- issue: καὶ τῆς ἁγνότητος की पाठगत स्थिति
  choice: मुख्य पाठ में 'और पवित्रता' सम्मिलित
  alternative: इन शब्दों का लोप
  rationale: SBLGNT इन्हें मुख्य पाठ में रखता है; कुछ पाण्डुलिपियों का छोटा पाठ पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। तुलना की यूनानी संरचना को स्पष्ट करने के लिए हिन्दी में “वैसे ही” जोड़ा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
