  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: hi
  text: क्योंकि यदि कोई आकर किसी दूसरे यीशु का प्रचार करता है, जिसका प्रचार हमने नहीं किया, या तुम कोई भिन्न आत्मा ग्रहण करते हो, जिसे तुमने ग्रहण नहीं किया, या कोई भिन्न सुसमाचार स्वीकार करते हो, जिसे तुमने स्वीकार नहीं किया, तो तुम उसे बड़ी आसानी से सह लेते हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बड़ी आसानी से सह लेते हो” व्यंग्यपूर्ण है; पौलुस उनकी प्रशंसा नहीं, बल्कि इस बात के लिए उन्हें उलाहना दे रहा है कि वे ऐसे दावों को बहुत जल्दी बरदाश्त कर लेते हैं।
    reason: प्रासंगिक व्यंग्य को स्पष्ट करना
lexical_decisions:
- source_word: ὁ ἐρχόμενος
  choice: कोई आकर
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत यहाँ अनिश्चित रूप से आने वाले किसी व्यक्ति को दर्शाता है; ‘कोई आकर’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: ἄλλον Ἰησοῦν
  choice: किसी दूसरे यीशु
  rationale: ἄλλον उसी नाम से प्रस्तुत किसी अन्य यीशु की ओर संकेत करता है; यह अनुवाद प्रतिद्वंद्वी प्रस्तुति को स्पष्ट करता है, पर उसके स्वरूप की व्याख्या नहीं जोड़ता।
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: प्रचार करता है / प्रचार हमने नहीं किया
  rationale: κηρύσσω के सार्वजनिक घोषणा या प्रचार के भाव को ‘प्रचार करना’ सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: πνεῦμα ἕτερον
  choice: कोई भिन्न आत्मा
  rationale: ἕτερον गुणात्मक भिन्नता पर बल दे सकता है। ‘आत्मा’ को किसी खास प्रकार—पवित्र, दुष्ट, या मनोभाव—के रूप में सीमित नहीं किया गया, इसलिए मूल की संदिग्धता बनी रहती है।
- source_word: λαμβάνετε / ἐλάβετε
  choice: ग्रहण करते हो / ग्रहण नहीं किया था
  rationale: λαμβάνω के पाने या ग्रहण करने के भाव के लिए ‘ग्रहण’ चुना गया है और अगले उपवाक्य के δέχομαι से शब्दगत भेद रखा गया है।
- source_word: εὐαγγέλιον ἕτερον
  choice: कोई भिन्न सुसमाचार
  rationale: ‘सुसमाचार’ पौलुस के प्रयोग का मानक हिन्दी रूप है और ‘भिन्न’ ἕτερον की विरोधात्मक शक्ति को व्यक्त करता है।
- source_word: ἐδέξασθε
  choice: स्वीकार नहीं किया था
  rationale: δέχομαι में स्वीकार या स्वागत करने का भाव है; ‘स्वीकार’ इसे λαμβάνω के लिए प्रयुक्त ‘ग्रहण’ से अलग रखता है।
- source_word: καλῶς ἀνέχεσθε
  choice: बड़ी आसानी से सह लेते हो
  rationale: ἀνέχομαι का अर्थ सहना या बरदाश्त करना है। प्रसंग में καλῶς के साथ यह वाक्यांश उनकी अनुचित सहनशीलता पर व्यंग्य करता है; ‘बड़ी आसानी से’ उस भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: εἰ μὲν γὰρ
  choice: क्योंकि यदि
  rationale: यह पदसमूह पिछले तर्क का कारण देते हुए शर्त प्रस्तुत करता है; ‘क्योंकि यदि’ दोनों संबंधों को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: ‘भिन्न आत्मा’ का संदर्भ
  choice: ‘कोई भिन्न आत्मा’ कहकर संदर्भ खुला रखा गया है।
  alternative: इसे गलत ढंग से प्रस्तुत पवित्र आत्मा, दुष्ट आत्मा, या भिन्न आत्मिक प्रभाव के रूप में स्पष्ट करना।
  rationale: निकट प्रसंग इन विकल्पों में से किसी एक को निर्णायक रूप से नहीं चुनता; अतः मूल की धार्मिक अस्पष्टता बनाए रखी गई है।
- issue: καλῶς ἀνέχεσθε का स्वर
  choice: कुरिन्थियों की तत्पर सहनशीलता पर व्यंग्यपूर्ण झिड़की।
  alternative: सीधी प्रशंसा या तटस्थ कथन।
  rationale: अध्याय के विवादात्मक प्रसंग में पौलुस झूठे दावों को सहने के लिए उनकी प्रशंसा नहीं, बल्कि आलोचना कर रहा है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘ग्रहण’ और ‘स्वीकार’ द्वारा λαμβάνω और δέχομαι का अंतर बनाए रखा गया है; ‘भिन्न आत्मा’ की धार्मिक पहचान को जानबूझकर अनिर्णीत छोड़ा गया है।
