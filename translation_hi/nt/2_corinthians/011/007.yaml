  text: Ἢ ἁμαρτίαν ἐποίησα ἐμαυτὸν ταπεινῶν ἵνα ὑμεῖς ὑψωθῆτε, ὅτι δωρεὰν τὸ τοῦ θεοῦ εὐαγγέλιον εὐηγγελισάμην ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: hi
  text: या क्या मैंने स्वयं को दीन बनाकर पाप किया[a], ताकि तुम ऊँचे किए जाओ, क्योंकि मैंने तुम्हें परमेश्वर का सुसमाचार निःशुल्क[b] सुनाया?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या मैंने कोई पाप किया?” यूनानी मुहावरे में शाब्दिक रूप से, “क्या मैंने पाप किया?” है।
    reason: lexical_alternative
  - marker: b
    text: या, “बिना पारिश्रमिक लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: या क्या
  rationale: यह पिछले तर्क से जुड़ा तीखा आलंकारिक विकल्प प्रस्तुत करता है; ‘या क्या’ हिंदी में उस संबंध और प्रश्नात्मक बल को बनाए रखता है।
- source_word: ἁμαρτίαν ἐποίησα
  choice: पाप किया
  rationale: यूनानी मुहावरे का स्वाभाविक हिंदी रूप है और कार्य की नैतिक श्रेणी को स्पष्ट रखता है।
- source_word: ἐμαυτὸν ταπεινῶν
  choice: स्वयं को दीन बनाकर
  rationale: आत्मवाचक अर्थ और पौलुस की सामाजिक रूप से स्वयं को नीचे रखने की क्रिया, दोनों को स्वाभाविक और गरिमापूर्ण हिंदी में व्यक्त करता है।
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: ताकि तुम ऊँचे किए जाओ
  rationale: उद्देश्यवाचक संबंध, कर्मवाच्य रूप और ‘दीन बनाने/ऊँचा किए जाने’ का विरोधाभास सुरक्षित रहता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह कथित ‘पाप’ का आधार बताता है और हिंदी में कारण-संबंध को स्पष्ट रूप से जोड़ता है।
- source_word: δωρεὰν
  choice: बिना कोई मूल्य लिए
  rationale: यह भुगतान न लेने के आशय को साधारण आधुनिक हिंदी में व्यक्त करता है, बिना अत्यधिक बोलचाल या प्रशासनिक शैली के।
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: परमेश्वर का सुसमाचार
  rationale: यूनानी संबंधकारक रचना को पारदर्शी रूप से रखता है और पौलुस की परिचित धार्मिक शब्दावली को बनाए रखता है।
- source_word: εὐηγγελισάμην ὑμῖν
  choice: मैंने तुम्हें … सुनाया
  rationale: समाचार घोषित करने की क्रिया को सहज आधुनिक हिंदी में व्यक्त करता है; इसे केवल औपचारिक उपदेश देने तक सीमित नहीं करता।
theological_decisions:
- issue: आर्थिक सहायता और पौलुस के स्वयं को दीन बनाने से संबंधित आलंकारिक प्रश्न
  choice: प्रश्न को उसके व्यंग्यात्मक तनाव सहित सीधे रूप में रखा गया है, बिना सेवकाई के पारिश्रमिक पर कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष जोड़े।
  alternative: ऐसी व्याख्यात्मक शब्दावली जोड़ना जिससे लगे कि पौलुस स्पष्ट रूप से अपने प्रेरितीय अधिकार का त्याग बता रहा है, या प्रश्न के व्यंग्य को केवल क्षमा-याचना बना देना।
  rationale: यूनानी पाठ पूछता है कि क्या स्वयं को दीन बनाना और निःशुल्क सुसमाचार सुनाना ‘पाप’ था; अनुवाद को इसी तनाव पर रुकना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। ‘दीन बनाकर’ और ‘ऊँचे किए जाओ’ से मूल का सामाजिक-प्रतिष्ठात्मक विरोध सुरक्षित रहता है; ‘बिना कोई मूल्य लिए’ सामान्य पाठक के लिए ‘निःशुल्क’ से अधिक सहज है।
