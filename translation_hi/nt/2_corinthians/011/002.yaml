source:
  edition: SBLGNT
  text: ζηλῶ γὰρ ὑμᾶς θεοῦ ζήλῳ, ἡρμοσάμην γὰρ ὑμᾶς ἑνὶ ἀνδρὶ παρθένον ἁγνὴν παραστῆσαι τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: hi
  text: क्योंकि मैं तुम्हारे लिए परमेश्वर की जलन से जलता हूँ[a], क्योंकि मैंने तुम्हारी मंगनी एक ही पति से कराई है, ताकि मैं तुम्हें एक शुद्ध कुँवारी के रूप में मसीह के सामने प्रस्तुत करूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के अनुरूप जलन से।” यूनानी वाक्यांश का अर्थ परमेश्वर की अपनी जलन अथवा परमेश्वर के अनुरूप जलन हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλῶ
  choice: जलन रखता हूँ
  rationale: विवाह और वाचा के रूपक में यह क्रिया सुरक्षात्मक, विशिष्ट निष्ठा चाहने वाली जलन व्यक्त करती है; केवल ‘उत्साह’ कहने से यह भाव दब जाता।
- source_word: θεοῦ ζήλῳ
  choice: परमेश्वर की-सी जलन
  rationale: यूनानी संबंधकारक परमेश्वर की अपनी जलन अथवा परमेश्वर के अनुरूप जलन—दोनों का संकेत दे सकता है। ‘परमेश्वर की-सी’ सहज हिन्दी में इस दैवी स्वरूप को व्यक्त करता है, और वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἡρμοσάμην
  choice: मैंने तुम्हारी मंगनी ... कराई है
  rationale: विवाह तय कराने या वाग्दान कराने का भाव है। हिन्दी में ‘मंगनी कराई’ पौलुस की मध्यस्थ भूमिका और वैवाहिक रूपक दोनों स्पष्ट रखता है।
- source_word: ἑνὶ ἀνδρὶ
  choice: एक ही पति से
  rationale: ἀνήρ का सामान्य अर्थ ‘पुरुष’ भी हो सकता है, पर यहाँ दुल्हन और मंगनी के रूपक में ‘पति’ प्रसंगानुकूल है; ‘ही’ एकनिष्ठता पर बल देता है।
- source_word: παρθένον ἁγνὴν
  choice: एक पवित्र कुँवारी
  rationale: ‘कुँवारी’ वैवाहिक और शुचिता-संबंधी चित्र बनाए रखता है; ἁγνή के लिए ‘पवित्र’ सामान्य आधुनिक हिन्दी में नैतिक शुद्धता व्यक्त करता है।
- source_word: παραστῆσαι
  choice: सामने प्रस्तुत करूँ
  rationale: क्रिया किसी व्यक्ति को दूसरे के सम्मुख विधिवत उपस्थित करने का भाव रखती है; ‘सामने प्रस्तुत’ इसे स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: τῷ Χριστῷ
  choice: मसीह के सामने
  rationale: Χριστός यहाँ वर की पदवी-सदृश पहचान है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘मसीह’ इसका स्वाभाविक और व्यापक रूप है।
theological_decisions:
- issue: पौलुस की ‘जलन’ का स्वरूप
  choice: ऐसी सुरक्षात्मक जलन जो परमेश्वर के चरित्र अथवा उसकी वाचागत जलन को प्रतिबिंबित करती है
  alternative: केवल परमेश्वर से संबंधित जलन, या सामान्य धार्मिक उत्साह
  rationale: θεοῦ संबंधकारक के अनेक संभावित संबंधों को पूरी तरह निर्णीत नहीं करता। मुख्य पाठ और पादटिप्पणी इस वास्तविक अस्पष्टता को बनाए रखते हैं, जबकि विवाह-रूपक के कारण ‘जलन’ को केवल ‘उत्साह’ नहीं बनाया गया।
- issue: मसीह के साथ विवाह का रूपक
  choice: पौलुस समुदाय की मंगनी एक ही पति, मसीह, से कराने वाले मध्यस्थ के रूप में बोलता है
  alternative: पौलुस स्वयं वर है, या वाक्य केवल सामान्य समर्पण की बात करता है
  rationale: ἡρμοσάμην ὑμᾶς ἑνὶ ἀνδρί और τῷ Χριστῷ स्पष्ट करते हैं कि समुदाय दुल्हन, मसीह पति, और पौलुस विवाह तय कराने वाला है।
- issue: ἁγνή का आशय
  choice: नैतिक और वैवाहिक निष्ठा सहित पवित्रता
  alternative: केवल शारीरिक कौमार्य
  rationale: कुँवारी का रूपक बना रहता है, पर ἁγνή को ‘पवित्र’ कहना उसके व्यापक नैतिक और आत्मिक आशय को अनावश्यक रूप से संकुचित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘मंगनी कराई’, ‘एक ही पति’ और ‘पवित्र कुँवारी’ से मूल वैवाहिक रूपक स्पष्ट रखा गया है। ‘ईर्ष्या’ के बजाय ‘जलन’ चुना गया है, क्योंकि ‘ईर्ष्या’ प्रायः पापपूर्ण डाह का अर्थ देती है; पादटिप्पणी यूनानी संबंधकारक की अस्पष्टता सुरक्षित रखती है।
