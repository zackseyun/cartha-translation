source:
  edition: SBLGNT
  text: ἐν Δαμασκῷ ὁ ἐθνάρχης Ἁρέτα τοῦ βασιλέως ἐφρούρει τὴν ⸂πόλιν Δαμασκηνῶν⸃ πιάσαι ⸀με,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/032.yaml
  text: In Damascus[a], the ethnarch of King Aretas was guarding the city of the Damascenes in order to seize me,
translation:
  language: hi
  text: दमिश्क में राजा अरेतास का एथनार्क[a] दमिश्कवासियों के नगर[b] की रखवाली कर रहा था, ताकि मुझे पकड़ सके,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एथनार्क एक ऐतिहासिक प्रशासनिक पद था, अर्थात किसी जनसमूह या क्षेत्र का शासक।
    reason: historical_term
  - marker: b
    text: या, “दमिश्क नगर।” यूनानी में अधिक शाब्दिक रूप से “दमिश्कवासियों का नगर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: दमिश्क में
  rationale: ἐν के साथ दत्तिवाचक रूप स्थान सूचित करता है; आधुनिक हिन्दी में यह स्वाभाविक स्थानीय अभिव्यक्ति है।
- source_word: ἐθνάρχης
  choice: अधिपति
  rationale: यह किसी जाति या क्षेत्र पर नियुक्त शासक का ऐतिहासिक पद है। ‘अधिपति’ पद की विशिष्टता को सामान्य ‘राज्यपाल’ की अपेक्षा बेहतर बनाए रखता है, यद्यपि मूल पद का पूरा तकनीकी आशय हिन्दी के किसी एक शब्द में नहीं समाता।
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: राजा अरितास का
  rationale: सम्बन्धकारक रचना अधिपति को राजा अरितास से सम्बद्ध, सम्भवतः उसके अधीन नियुक्त, बताती है; हिन्दी में ‘का’ इस सम्बन्ध को बिना अधिक व्याख्या के सुरक्षित रखता है।
- source_word: ἐφρούρει
  choice: पहरा लगवाए हुए था
  rationale: अपूर्ण भूतकाल निरन्तर चल रही कार्रवाई दिखाता है। नगर की निगरानी एक अधिकारी द्वारा कराई जा रही थी, इसलिए यह हिन्दी प्रयोग क्रिया के काल-पक्ष और प्रशासनिक सन्दर्भ दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: दमिश्कवासियों के नगर
  rationale: यह यूनानी के बहुवचन सम्बन्धकारक ‘दमिश्कवासियों का नगर’ को सुरक्षित रखता है; अधिक सामान्य ‘दमिश्क नगर’ को पादटिप्पणी में विकल्प के रूप में दिया गया है।
- source_word: πιάσαι με
  choice: ताकि मुझे पकड़ सके
  rationale: अनन्त क्रिया उद्देश्य व्यक्त करती है। ‘पकड़ना’ मूल की व्यापक शत्रुतापूर्ण गिरफ्त में लेने की धारणा रखता है और ‘गिरफ़्तार करना’ जैसी अधिक विशिष्ट कानूनी व्याख्या से बचता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अधिपति’ अपेक्षाकृत औपचारिक है, क्योंकि ἐθνάρχης एक विशिष्ट ऐतिहासिक प्रशासनिक पद है। वाक्य के अन्त में अल्पविराम रखा गया है, क्योंकि मूल पद अगली आयत में पूरा होता है।
