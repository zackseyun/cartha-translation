review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the setting, King Aretas's association with the official, the purpose of seizing Paul, and the verse-continuing final comma. However, “पहरा लगवाए हुए था” is causative (“had guards posted / was having guarding done”), whereas ἐφρούρει directly states that the ethnarch himself was guarding/keeping watch over the city. The historical title ἐθνάρχης is also better retained explicitly rather than rendered by the overly broad “अधिपति.”
  naturalness: “नगर पर पहरा लगवाए हुए था” is less natural in this construction and changes the subject’s action. “नगर की रखवाली कर रहा था” is idiomatic modern Hindi and accurately represents the imperfect ongoing action. “एथनार्क” is a loan title, but a brief explanatory footnote makes it readable while preserving the source's historical specificity.
  terminology: Revise “अरितास” to “अरेतास,” a closer standard Hindi transliteration of Ἁρέτας. Render ἐθνάρχης as “एथनार्क,” explained as a historical administrative title. Retain “दमिश्कवासियों का नगर” and its lexical alternative, since the Greek deliberately has “city of the Damascenes.”
  issues:
  - severity: medium
    issue: Causative rendering of ἐφρούρει
    rationale: “पहरा लगवाए हुए था” says that the ethnarch caused guards to be posted, while ἐφρούρει has the ethnarch as the direct agent who was guarding the city.
  - severity: medium
    issue: Historical title ἐθνάρχης flattened as “अधिपति”
    rationale: “अधिपति” is generic and can suggest a sovereign lord; “एथनार्क,” with explanation, preserves the specific historical office without claiming more than the Greek states.
  - severity: low
    issue: Name transliteration
    rationale: “अरेतास” more closely represents Ἁρέτας than “अरितास.”
  revised_text: दमिश्क में राजा अरेतास का एथनार्क[a] दमिश्कवासियों के नगर[b] की रखवाली कर रहा था, ताकि मुझे पकड़ सके,
