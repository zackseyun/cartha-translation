lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: निर्बल होता है / निर्बल नहीं होता
  rationale: ‘निर्बल’ शारीरिक, सामाजिक और आत्मिक कमजोरी की व्यापकता बनाए रखता है तथा पौलुस की सहानुभूतिपूर्ण सहभागिता व्यक्त करता है।
- source_word: σκανδαλίζεται
  choice: ठोकर खिलाई जाती है
  rationale: निष्क्रिय रूप और ठोकर के रूपक को बनाए रखते हुए यह नैतिक अथवा आत्मिक पतन के कारण को खुला छोड़ता है।
- source_word: πυροῦμαι
  choice: भीतर से जल नहीं उठता
  rationale: मूल आग/जलने के सजीव रूपक को सुरक्षित रखता है और भावना को केवल रोष, शोक या उत्साह में सीमित नहीं करता।
- source_word: τίς
  choice: कौन / किसे
  rationale: दोनों आलंकारिक प्रश्नों में व्यक्तियों का स्वाभाविक आधुनिक हिन्दी संकेत।
- source_word: καὶ οὐκ ἐγὼ
  choice: और मैं ... नहीं होता / और मैं ... नहीं उठता
  rationale: स्पष्ट ἐγώ का बल ‘मैं’ द्वारा बना रहता है और हिन्दी में प्रश्नों की समानांतर रचना भी सुरक्षित रहती है।
theological_decisions:
- issue: πυροῦμαι में पौलुस की प्रतिक्रिया का स्वरूप
  choice: मुख्य पाठ में ‘भीतर से जल उठता’ का रूपक बनाए रखना
  alternative: रोष से जल उठता / शोक से जल उठता / अत्यन्त व्याकुल होता
  rationale: यूनानी क्रिया तीव्र आंतरिक भाव व्यक्त करती है, पर वह भाव रोष, शोक या उत्साह में से किसी एक तक स्पष्ट रूप से सीमित नहीं है; अतः मूल की भावगत और धर्मवैचारिक अनिश्चितता सुरक्षित रखी गई है।
