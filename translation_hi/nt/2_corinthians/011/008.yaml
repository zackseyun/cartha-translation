lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: दूसरी कलीसियाओं
  rationale: पौलुस के प्रयोग में ἐκκλησία सामान्यतः स्थानीय मसीही समुदायों को दर्शाता है; आधुनिक हिन्दी बाइबलीय भाषा में ‘कलीसियाओं’ स्वाभाविक और सटीक है।
- source_word: ἐσύλησα
  choice: मानो उन्हें लूटा
  rationale: क्रिया का अर्थ ‘लूटना’ या ‘छीन लेना’ है और इसकी तीखी आलंकारिक शक्ति बनाए रखना आवश्यक है। ‘मानो’ यह स्पष्ट करता है कि कथन विडंबनापूर्ण अतिशयोक्ति है, वास्तविक चोरी की स्वीकारोक्ति नहीं।
- source_word: λαβὼν
  choice: सहायता लेकर
  rationale: एओरिस्ट कृदंत साधन या रीति बताता है—दूसरी कलीसियाओं से सहायता लेना ही वह कार्य था जिसे पौलुस आलंकारिक रूप से ‘लूटना’ कहता है।
- source_word: ὀψώνιον
  choice: सहायता
  rationale: शब्द का मूल अर्थ वेतन, पारिश्रमिक या निर्वाह-राशि हो सकता है; इस सेवकाई-संदर्भ में ‘सहायता’ आर्थिक या भौतिक सहयोग को स्वाभाविक हिन्दी में व्यक्त करता है। अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: ताकि मैं आपकी सेवा कर सकूँ
  rationale: πρός और कर्मकारक यहाँ उद्देश्य का भाव देते हैं। यह रूप स्पष्ट करता है कि पौलुस को मिली सहायता कुरिन्थियों की सेवा करने के लिए थी।
theological_decisions:
- issue: दूसरी कलीसियाओं से धन लेने के विषय में पौलुस के कथन की आलंकारिक शक्ति
  choice: ‘मानो उन्हें लूटा’ के रूप में तीखे रूपक और विडंबना को बनाए रखा गया।
  alternative: मुख्य पाठ में इसे नरम करके ‘दूसरी कलीसियाओं से सहायता ली’ या ‘उन्हें वंचित किया’ कहना।
  rationale: मूल यूनानी क्रिया जानबूझकर प्रबल है। प्रसंग आर्थिक सहायता का है, वास्तविक चोरी का नहीं; इसलिए ‘लूटा’ रूपक की धार रखता है और ‘मानो’ उसके आलंकारिक प्रयोग का संकेत देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘कलीसिया’ स्थापित हिन्दी बाइबलीय पद है। वाक्य में पौलुस की तीखी आत्म-विडंबना बनाए रखते हुए वास्तविक चोरी का अनपेक्षित अर्थ सीमित किया गया है।
