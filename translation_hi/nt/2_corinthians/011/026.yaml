  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘खतरों में’ की पुनरावृत्ति जानबूझकर बनाए रखी गई है ताकि मूल की अलंकारिक लय और संकटों के संचय का प्रभाव बना रहे। पद पिछले वाक्य की सूची का अंश है, इसलिए इसका सूचीबद्ध वाक्यखंड-रूप सुरक्षित रखा गया है।
