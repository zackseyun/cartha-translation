  text: often on journeys[a], in dangers from rivers, in dangers from robbers, in dangers from my own people, in dangers from Gentiles, in dangers in the city, in dangers in the wilderness, in dangers at sea, in dangers among false brothers[b],
translation:
  language: hi
  text: अक्सर यात्राओं में, नदियों से खतरे, डाकुओं से खतरे, अपने ही लोगों[a] से खतरे, गैर-यहूदियों से खतरे, नगर में खतरे, निर्जन प्रदेश में खतरे, समुद्र में खतरे और झूठे भाइयों[b] के बीच खतरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी ही जाति के लोगों से’ अथवा ‘अपने ही राष्ट्र के लोगों से’; यूनानी में शाब्दिक रूप से ‘अपने वंश/लोगों से’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘झूठे विश्वासियों के बीच’; यूनानी में शाब्दिक रूप से ‘झूठे भाइयों के बीच’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: अक्सर यात्राओं में
  rationale: दत्तिव बहुवचन और क्रियाविशेषण को स्वाभाविक हिन्दी में रखते हुए बार-बार यात्रा करने का भाव व्यक्त किया गया है।
- source_word: κινδύνοις
  choice: खतरों में
  rationale: बार-बार आए बहुवचन को दोहराकर यूनानी की संचयी लय और संकटों की लंबी शृंखला सुरक्षित रखी गई है।
- source_word: ποταμῶν
  choice: नदियों से
  rationale: यह खतरे के स्रोत को बताता है; यूनानी की तरह यह स्पष्ट नहीं किया गया कि खतरा बाढ़, धारा या नदी पार करने से था।
- source_word: λῃστῶν
  choice: डाकुओं से
  rationale: यात्रा के प्रसंग में λῃσταί सशस्त्र लुटेरों या डाकुओं के लिए प्रयुक्त है; ‘डाकू’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἐκ γένους
  choice: अपने ही लोगों से
  rationale: γένος पौलुस के अपने जातीय समुदाय को सूचित करता है। यह अनुवाद किसी ऐसे स्पष्ट जातिनाम को नहीं जोड़ता जो यूनानी में नहीं है और अगले पदबंध के साथ विरोध बनाए रखता है।
- source_word: ἐξ ἐθνῶν
  choice: गैर-यहूदियों से
  rationale: अपने लोगों के साथ विरोध में ἔθνη का आशय यहूदियों से बाहर के लोग है। ‘गैर-यहूदी’ आधुनिक पाठक के लिए ‘अन्यजाति’ से अधिक सीधा और स्पष्ट है।
- source_word: ἐν πόλει
  choice: नगर में
  rationale: एकवचन को सामान्य या प्रतिनिधिक अर्थ में रखते हुए यूनानी रूप और सूची की लय बनाए रखी गई है।
- source_word: ἐν ἐρημίᾳ
  choice: निर्जन प्रदेश में
  rationale: ἐρημία रेगिस्तान, जंगल या किसी उजाड़ क्षेत्र को सूचित कर सकता है। ‘निर्जन प्रदेश’ इस व्यापकता को सुरक्षित रखता है।
- source_word: ἐν θαλάσσῃ
  choice: समुद्र में
  rationale: यह समुद्री यात्रा के दौरान उपस्थित खतरे को सरल और स्रोत-संगत हिन्दी में व्यक्त करता है।
- source_word: ἐν ψευδαδέλφοις
  choice: झूठे भाइयों के बीच
  rationale: ψευδάδελφοι का शाब्दिक अर्थ ऐसे ‘भाई’ हैं जिनका भाई होने का दावा झूठा है। स्रोत के पुल्लिंग बहुवचन और धार्मिक संबंध की विडंबना दोनों को बनाए रखा गया है।
theological_decisions:
- issue: ψευδαδέλφοις में लिंग और धार्मिक संबंध
  choice: झूठे भाइयों के बीच
  alternative: झूठे विश्वासियों के बीच
  rationale: यूनानी शब्द पुल्लिंग बहुवचन है और स्वयं को संगी विश्वासी बताने वालों की ओर संकेत करता है। ‘विश्वासी’ कहना अर्थ को व्याख्यात्मक रूप से सामान्य बना देता; ‘भाई’ स्रोत की भाषा और तनाव दोनों बनाए रखता है।
- issue: ἐξ ἐθνῶν और ἐκ γένους का जातीय विरोध
  choice: गैर-यहूदियों से
  alternative: अन्यजातियों से
  rationale: संदर्भ में पौलुस के अपने लोगों के विपरीत वे लोग अभिप्रेत हैं जो यहूदी नहीं थे। आधुनिक हिन्दी में ‘गैर-यहूदी’ वही भेद स्पष्ट करता है, बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े।
