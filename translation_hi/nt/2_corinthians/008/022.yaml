source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ αὐτοῖς τὸν ἀδελφὸν ἡμῶν ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις σπουδαῖον ὄντα, νυνὶ δὲ πολὺ σπουδαιότερον πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: hi
  text: और हमने उनके साथ हमारे उस भाई को भी भेजा है, जिसे हमने बहुत-सी बातों में कई बार परखकर तत्पर पाया है। अब वह तुम पर अपने बड़े भरोसे के कारण और भी अधिक तत्पर है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब वह तुम्हारे प्रति अपने बड़े भरोसे के द्वारा और भी अधिक तत्पर है।” यूनानी दत्तिव पदबंध को कारणसूचक (‘के कारण’) या साधनसूचक (‘के द्वारा’) समझा जा सकता है।
    reason: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς के दत्तिव संबंध का सुरक्षित व्याकरणिक विकल्प
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: हमने उनके साथ ... भी भेजा है
  rationale: अओरिस्ट क्रिया एक पूर्ण किए गए भेजने के कार्य को बताती है, जिसका वर्तमान पत्र-संदर्भ में महत्व है; σύν- का भाव ‘उनके साथ’ से व्यक्त होता है।
- source_word: ἀδελφὸν ἡμῶν
  choice: अपने उस भाई
  rationale: ‘भाई’ आरंभिक मसीही समुदाय के पारिवारिक संबोधन को बनाए रखता है और यहाँ बताए गए अज्ञात पुरुष सहकर्मी के लिए स्वाभाविक है।
- source_word: ἐδοκιμάσαμεν
  choice: परखकर ... पाया है
  rationale: δοκιμάζω में जाँचने और उससे सिद्ध चरित्र प्रकट होने—दोनों का भाव है; ‘परखकर ... पाया’ इन दोनों पहलुओं को स्पष्ट करता है।
- source_word: ἐν πολλοῖς πολλάκις
  choice: बहुत-सी बातों में कई बार
  rationale: यह पदबंध परिस्थितियों की व्यापकता और परीक्षा की पुनरावृत्ति, दोनों को बनाए रखता है।
- source_word: σπουδαῖον ὄντα
  choice: तत्पर पाया है
  rationale: ‘तत्पर’ σπουδαῖος के लगन, गंभीरता और उत्सुकता के संयुक्त भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: अब ... और भी अधिक तत्पर है
  rationale: यह πολὺ सहित तुलनात्मक रूप की तीव्रता को पहले आए ‘तत्पर’ से स्पष्ट रूप से जोड़ता है।
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: तुम पर अपने बड़े भरोसे के कारण
  rationale: सम्प्रदान कारक को कारणसूचक मानना निकटतम वाक्य-विन्यास में स्वाभाविक है; ‘अपने’ स्पष्ट करता है कि मुख्य पाठ में भरोसा उस भाई का माना गया है, जबकि टिप्पणी दूसरी संभावित संबद्धता को सुरक्षित रखती है।
theological_decisions:
- issue: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς में भरोसे का कर्ता और उसका संबंध
  choice: उस भाई की बढ़ी हुई तत्परता कुरिन्थियों पर उसके बड़े भरोसे के कारण है
  alternative: इसे पौलुस के कुरिन्थियों पर बड़े भरोसे से, अथवा ‘तुम्हारे प्रति बड़े साहस’ के अर्थ में भी समझा जा सकता है
  rationale: निकटतम वाक्य-विन्यास में यह पदबंध उस अज्ञात भाई की अधिक बढ़ी हुई तत्परता का कारण बताता है। फिर भी यूनानी में कर्ता स्पष्ट रूप से दोहराया नहीं गया है और πεποίθησις में ‘भरोसा’ के साथ ‘साहस’ की छाया भी हो सकती है, इसलिए टिप्पणी में वैकल्पिक समझ सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भाई’, ‘परखकर’ और ‘तत्पर’ जैसे शब्द मूल के सामुदायिक, प्रमाणित चरित्र और उत्साही सेवा के भावों को बिना अनावश्यक व्याख्यात्मक विस्तार के व्यक्त करते हैं।
