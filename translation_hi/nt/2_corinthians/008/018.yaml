source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: hi
  text: और हमने उसके साथ उस भाई को भेजा, जिसकी प्रशंसा सुसमाचार के संबंध में सभी कलीसियाओं में होती है—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुसमाचार के संबंध में जिसकी सराहना सभी कलीसियाओं में है।”
    reason: ἔπαινος में ‘प्रशंसा’ के साथ ‘सराहना/अनुशंसा’ का भाव और διά में ‘सभी कलीसियाओं में/के बीच’ का भाव संभव है।
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: हमने उसके साथ ... भेजा
  rationale: अओरिस्ट क्रिया पूरी की गई घटना बताती है, और σύν का भाव साथ भेजने का है; यह हिंदी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ तीखा विरोध नहीं, बल्कि वर्णन को आगे बढ़ाने वाला हल्का संयोजक है।
- source_word: τὸν ἀδελφόν
  choice: उस भाई को
  rationale: निश्चित पदबंध किसी परिचित मसीही पुरुष सहकर्मी की ओर संकेत करता है; हिंदी में ‘उस भाई’ संदर्भगत निश्चितता को सहजता से व्यक्त करता है।
- source_word: οὗ ὁ ἔπαινος
  choice: जिसकी प्रशंसा ... होती है
  rationale: यह संबंधवाचक और संज्ञात्मक रचना ἔπαινος के ‘प्रशंसा’ अर्थ को बनाए रखती है और हिंदी में स्वाभाविक है।
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: सुसमाचार के संबंध में
  rationale: यह वाक्यांश उसकी प्रशंसा का क्षेत्र या संबंध बताता है। चयन मूल की व्यापकता बनाए रखता है और प्रचार अथवा किसी विशिष्ट सेवकाई को अनावश्यक रूप से नहीं जोड़ता।
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: सभी कलीसियाओं में
  rationale: διά सहित यह पदबंध समस्त कलीसियाओं में व्यापक मान्यता का भाव देता है; ‘में’ सहज आधुनिक हिंदी है।
- source_word: ἐκκλησιῶν
  choice: कलीसियाओं
  rationale: पौलुस के प्रयोग में यह स्थानीय मसीही समुदायों को सूचित करता है; ‘कलीसिया’ प्रचलित और स्पष्ट बाइबलीय हिंदी शब्द है।
theological_decisions:
- issue: ἀδελφός की पहचान और स्थिति
  choice: ‘उस भाई’—कुरिन्थियों को ज्ञात एक पुरुष मसीही सहकर्मी
  alternative: ‘एक सहविश्वासी’
  rationale: पुल्लिंग एकवचन, निश्चित पद और यात्रा-संदर्भ किसी विशिष्ट पुरुष की ओर संकेत करते हैं; सामान्यीकृत शब्द व्यक्तिगत संदर्भ को धुंधला कर देगा।
- issue: ἐν τῷ εὐαγγελίῳ का आशय
  choice: ‘सुसमाचार के संबंध में’ कहकर अर्थ को व्यापक रखा गया
  alternative: ‘सुसमाचार का प्रचार करने में’ अथवा ‘सुसमाचार की सेवकाई में’
  rationale: यूनानी पाठ स्पष्ट रूप से न प्रचार का कार्य बताता है, न कोई सेवकाई-पद; इसलिए अधिक संकीर्ण व्याख्या नहीं जोड़ी गई।
- issue: ἔπαινος और διά का संबंध
  choice: भाई की सुसमाचार-संबंधी प्रशंसा सभी कलीसियाओं में होती है
  alternative: सभी कलीसियाओं द्वारा सुसमाचार में उसकी अनुशंसा होती है
  rationale: वाक्यांश प्रशंसा, प्रतिष्ठा या अनुशंसा तथा उसके प्रसार—दोनों की छाया रख सकता है। मुख्य पाठ सहज अर्थ देता है और पादटिप्पणी वैकल्पिक बारीकी सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सरल शैली। ‘सुसमाचार’ और ‘कलीसिया’ जैसे व्यापक रूप से पहचाने जाने वाले बाइबलीय पद रखे गए हैं। अंतिम दीर्घ डैश अगले पद से वाक्य के जुड़े होने को दर्शाता है।
