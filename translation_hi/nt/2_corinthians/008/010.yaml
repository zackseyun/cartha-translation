  text: καὶ γνώμην ἐν τούτῳ δίδωμι· τοῦτο γὰρ ὑμῖν συμφέρει, οἵτινες οὐ μόνον τὸ ποιῆσαι ἀλλὰ καὶ τὸ θέλειν προενήρξασθε ἀπὸ πέρυσι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: hi
  text: और इस विषय में मैं अपनी राय[a] देता हूँ, क्योंकि यह तुम्हारे लिए लाभदायक है—तुमने पिछले वर्ष न केवल इसे करने, बल्कि इसकी इच्छा करने का भी आरम्भ किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विचार” अथवा “परामर्श।” पौलुस इसे आज्ञा के रूप में नहीं, बल्कि सोच-विचारकर दी गई सलाह के रूप में प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώμην
  choice: राय
  rationale: यहाँ संज्ञा एक सोच-विचारकर दी गई सम्मति या परामर्श को व्यक्त करती है, प्रत्यक्ष आज्ञा को नहीं। ‘राय’ आधुनिक हिन्दी में स्वाभाविक है और कथन की गंभीरता भी बनाए रखती है।
- source_word: ἐν τούτῳ
  choice: इस विषय में
  rationale: यह वाक्यांश चर्चा के विशेष विषय, अर्थात संग्रह के कार्य, की ओर संकेत करता है।
- source_word: δίδωμι
  choice: देता हूँ
  rationale: वर्तमानकालीन क्रिया का सीधा और स्वाभाविक हिन्दी रूप; ‘राय देता हूँ’ प्रचलित प्रयोग है।
- source_word: συμφέρει
  choice: लाभदायक है
  rationale: यह उस बात को दर्शाता है जो उनके हित में या उनके लिए अच्छी है; ‘लाभदायक’ स्पष्ट है और इसे केवल आर्थिक लाभ तक सीमित नहीं करता।
- source_word: οἵτινες
  choice: तुम लोगों ने
  rationale: हिन्दी में अलग वाक्य बनाकर सम्बोधन को दोहराना यूनानी सम्बन्धवाचक उपवाक्य का अर्थ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸ ποιῆσαι
  choice: इसे करना
  rationale: यह संग्रह के कार्य को वास्तव में पूरा करने या उसमें कार्य करने की ओर संकेत करता है; कर्म प्रसंग से स्पष्ट है।
- source_word: τὸ θέλειν
  choice: ऐसा करने की इच्छा रखना
  rationale: यह बाहरी कार्य से अलग भीतरी चाह या तत्परता को व्यक्त करता है। ‘इच्छा रखना’ ποιῆσαι और θέλειν के बीच भेद बनाए रखता है।
- source_word: προενήρξασθε
  choice: आरम्भ कर दिया था
  rationale: क्रिया पहले आरम्भ किए गए कार्य को बताती है; ‘पिछले वर्ष ही’ उसके पूर्वकालिक पक्ष को हिन्दी में पर्याप्त रूप से व्यक्त करता है।
- source_word: ἀπὸ πέρυσι
  choice: पिछले वर्ष ही
  rationale: यह आरम्भ को पिछले वर्ष में रखता है। ‘ही’ पहले से पहल करने या पहले आरम्भ करने की छाया को स्वाभाविक हिन्दी में उभारता है, बिना अनिवार्य रूप से निरन्तर क्रिया का अर्थ थोपे।
theological_decisions:
- issue: पौलुस के कथन का बल और प्रेरितीय अधिकार से उसका सम्बन्ध
  choice: पौलुस यहाँ सोच-विचारकर अपनी राय या सम्मति देता है, प्रत्यक्ष आज्ञा नहीं।
  alternative: इसे एक अधिकारपूर्ण आदेश के रूप में प्रस्तुत करना।
  rationale: निकटवर्ती प्रसंग में पौलुस आज्ञा देने और अपनी सम्मति देने में भेद करता है (8:8, 10)। ‘राय’ उसके परामर्श की गंभीरता को बनाए रखते हुए उसे स्पष्ट आज्ञा नहीं बनाती।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। यूनानी वाक्य की लम्बी सम्बन्धवाचक रचना को दो हिन्दी वाक्यों में बाँटा गया है, पर विचारों का क्रम—राय, लाभ, करना और इच्छा रखना—सुरक्षित है।
