source:
  edition: SBLGNT
  text: μετὰ πολλῆς παρακλήσεως δεόμενοι ἡμῶν, τὴν χάριν καὶ τὴν κοινωνίαν τῆς διακονίας τῆς εἰς τοὺς ἁγίους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/004.yaml
  text: begging us with much urging for the grace and the fellowship of this ministry to the saints—[a]
translation:
  language: hi
  text: उन्होंने बहुत आग्रह के साथ हमसे विनती की कि उन्हें पवित्र जनों के लिए सेवा करने का अनुग्रह और उसमें सहभागिता मिले—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र जनों के लिए सेवा में भाग लेने का विशेषाधिकार और सहभागिता मिले।”
    reason: χάρις का प्रसंगानुकूल अर्थ ‘विशेषाधिकार’ भी हो सकता है, और κοινωνία सक्रिय भागीदारी को दर्शाता है।
lexical_decisions:
- source_word: μετὰ πολλῆς παρακλήσεως
  choice: बहुत आग्रह के साथ
  rationale: यहाँ παράκλησις, δεόμενοι के साथ मिलकर सांत्वना नहीं, बल्कि प्रबल और earnest निवेदन का भाव देता है; यह पदबंध उस तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δεόμενοι ἡμῶν
  choice: हमसे विनती की
  rationale: δέομαι का अर्थ निवेदन करना, गिड़गिड़ाना या विनती करना हो सकता है; ‘विनती की’ दृढ़ किंतु गरिमापूर्ण आधुनिक हिन्दी है, और ἡμῶν विनती किए जाने वाले व्यक्तियों को दर्शाता है।
- source_word: τὴν χάριν
  choice: अनुग्रह
  rationale: χάρις के ‘अनुग्रह’, ‘कृपा’ और प्रसंगानुसार ‘विशेषाधिकार’ जैसे अर्थ हो सकते हैं। ‘अनुग्रह’ पौलुस की प्रमुख शब्दावली और यहाँ निहित ईश्वरीय कृपा का स्वर बनाए रखता है; ‘विशेषाधिकार’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τὴν κοινωνίαν
  choice: सहभागिता
  rationale: κοινωνία यहाँ राहत-सेवा में वास्तविक भागीदारी को दर्शाता है, साथ ही साझा संबंध का भाव भी रखता है। ‘सहभागिता’ दोनों पहलुओं को संक्षेप में व्यक्त करता है।
- source_word: τῆς διακονίας
  choice: सेवा करने
  rationale: διακονία इस प्रसंग में जरूरतमंद विश्वासियों के लिए व्यावहारिक सहायता-सेवा है। ‘सेवा करने’ साधारण पाठक के लिए स्वाभाविक है और इसे केवल औपचारिक कलीसियाई पद तक सीमित नहीं करता।
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: पवित्र जनों की
  rationale: यह पदबंध सेवा के लाभार्थियों की ओर संकेत करता है। ‘पवित्र जन’ पौलुस द्वारा विश्वासियों के लिए प्रयुक्त सामूहिक पहचान को बनाए रखता है और बाद के विशिष्ट संत-पद का आभास नहीं देता।
theological_decisions:
- issue: χάρις को कृपा-संबंधी शब्द या केवल ‘विशेषाधिकार’ के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में ‘अनुग्रह’
  alternative: ‘विशेषाधिकार’
  rationale: ‘अनुग्रह’ पौलुस की धर्मवैचारिक शब्दावली और यूनानी की व्यापकता को सुरक्षित रखता है, जबकि प्रसंग में भाग लेने के विशेषाधिकार का अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- issue: ἅγιοι का अनुवाद
  choice: पवित्र जन
  alternative: संत; परमेश्वर के पवित्र लोग
  rationale: यहाँ अभिप्राय सभी संबंधित विश्वासियों से है, किसी विशिष्ट आधिकारिक या मरणोत्तर संत-वर्ग से नहीं। ‘पवित्र जन’ इस सामूहिक पहचान को स्पष्ट और निष्पक्ष ढंग से रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यूनानी वाक्यांश की खंडात्मक रचना को हिन्दी में स्पष्ट करने के लिए ‘कि उन्हें … मिले’ जोड़ा गया है; इससे विनती की विषयवस्तु खुलती है, पर कोई नया कर्ता या धर्मवैचारिक दावा नहीं जुड़ता।
