  text: परन्तु परमेश्वर का धन्यवाद हो, जो तुम्हारे लिए वही लगन तीतुस के हृदय में डालता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χάρις δὲ τῷ θεῷ
  choice: परन्तु परमेश्वर का धन्यवाद हो
  rationale: χάρις के साथ परमेश्वर के लिए प्रयुक्त यह वाक्यांश कृतज्ञता व्यक्त करता है, इसलिए यहाँ ‘अनुग्रह’ के बजाय स्वाभाविक हिन्दी धन्यवाद-सूत्र रखा गया है। δέ पिछले विषय से हल्का परिवर्तन सूचित करता है, जिसे ‘परन्तु’ व्यक्त करता है।
- source_word: τῷ διδόντι
  choice: जो ... डालता है
  rationale: δίδωμι का मूल अर्थ ‘देना’ है, पर हृदय के भीतर किसी मनोभाव को स्थापित करने के प्रसंग में ‘हृदय में डालता है’ स्वाभाविक हिन्दी है और यूनानी रूपक को बनाए रखता है।
- source_word: τὴν αὐτὴν σπουδὴν
  choice: वही उत्सुकता
  rationale: σπουδή यहाँ तत्पर, गंभीर लगन या उत्साहपूर्ण चिंता का भाव रखता है। ‘उत्सुकता’ इस प्रसंग में तीतुस की सक्रिय रुचि को सरल आधुनिक हिन्दी में व्यक्त करती है; αὐτήν का तुलनात्मक संकेत ‘वही’ से सुरक्षित है।
- source_word: ὑπὲρ ὑμῶν
  choice: तुम्हारे लिए
  rationale: यहाँ ὑπέρ कुरिन्थियों की ओर निर्देशित हितचिंता बताता है; ‘तुम्हारे लिए’ इसका संक्षिप्त और स्वाभाविक अनुवाद है।
- source_word: ἐν τῇ καρδίᾳ Τίτου
  choice: तीतुस के हृदय में
  rationale: ἐν का स्थानगत अर्थ ‘में’ रखते हुए Τίτου को संबंधसूचक ‘तीतुस के’ से व्यक्त किया गया है। इससे आंतरिक मनोभाव का हृदय-वाला रूपक सुरक्षित रहता है।
