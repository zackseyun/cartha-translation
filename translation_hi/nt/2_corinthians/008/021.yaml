source:
  edition: SBLGNT
  text: ⸂προνοοῦμεν γὰρ⸃ καλὰ οὐ μόνον ἐνώπιον κυρίου ἀλλὰ καὶ ἐνώπιον ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: hi
  text: क्योंकि हम जो अच्छा[a] है, उसका ध्यान न केवल प्रभु के सामने, बल्कि लोगों के सामने भी रखते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो आदरणीय है” अथवा “जो उचित है।”
    reason: καλά के व्यापक नैतिक अर्थ के साथ उसके सम्माननीय अथवा उचित आचरण वाले प्रसंगानुकूल अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: προνοοῦμεν
  choice: हम ... ध्यान रखते हैं
  rationale: यह क्रिया पहले से सोच-विचार करने, सावधानी बरतने और उचित प्रबंध का ध्यान रखने का भाव देती है। चंदे के उत्तरदायी प्रबंधन के इस संदर्भ में यह स्वाभाविक हिन्दी है और जानबूझकर बरती गई सावधानी को व्यक्त करती है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछली बात का कारण या स्पष्टीकरण देता है; हिन्दी में “क्योंकि” इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: καλὰ
  choice: जो अच्छा है
  rationale: नपुंसकलिंग बहुवचन καλὰ अच्छे, उचित या सम्मानजनक कामों को सूचित कर सकता है। मुख्य पाठ में व्यापक नैतिक अर्थ रखा गया है, जबकि प्रसंगानुकूल विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: केवल ... ही नहीं, बल्कि ... भी
  rationale: यह यूनानी सहसंबंधी रचना का स्वाभाविक हिन्दी रूप है और दोनों पक्षों पर संतुलित बल बनाए रखता है।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: यह “दृष्टि में” या “उपस्थिति में” का भाव देता है। “के सामने” दोनों खंडों में संक्षिप्त और सहज है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος के लिए प्रतिष्ठित और स्वाभाविक हिन्दी धार्मिक पद “प्रभु” रखा गया है।
- source_word: ἀνθρώπων
  choice: लोगों
  rationale: यहाँ ἄνθρωποι सामान्य रूप से मानव पर्यवेक्षकों को सूचित करता है, केवल पुरुषों को नहीं; इसलिए “लोगों” सटीक और आधुनिक है।
theological_decisions:
- issue: वित्तीय उत्तरदायित्व के प्रसंग में καλὰ की नैतिक छाया
  choice: मुख्य पाठ में व्यापक अर्थ “जो अच्छा है”
  alternative: “जो आदरणीय है” या “जो उचित है”
  rationale: यह पद ऐसे आचरण पर बल देता है जो प्रभु की दृष्टि और मानवीय निरीक्षण—दोनों में अच्छा माना जाए। यूनानी शब्द व्यापक नैतिक अच्छाई और सार्वजनिक रूप से सम्माननीय या उचित आचरण, दोनों को समेट सकता है; इसलिए मुख्य पाठ इसे संकीर्ण नहीं करता और विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट। “ध्यान रखते हैं” प्रशासनिक सावधानी और नैतिक उत्तरदायित्व दोनों को स्वाभाविक रूप से व्यक्त करता है।
