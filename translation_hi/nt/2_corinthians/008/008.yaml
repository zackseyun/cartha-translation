id: 2CO.8.8
reference: 2 Corinthians 8:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὐ κατ’ ἐπιταγὴν λέγω ἀλλὰ διὰ τῆς ἑτέρων σπουδῆς καὶ τὸ τῆς ὑμετέρας ἀγάπης γνήσιον δοκιμάζων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: hi
  text: मैं यह आज्ञा के रूप में नहीं कह रहा हूँ, बल्कि दूसरों की तत्परता[a] के माध्यम से आपके प्रेम की सच्चाई को भी परख[b] रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दूसरों के उत्साह’ अथवा ‘दूसरों की लगन’; σπουδή में तत्परता, उत्साह या परिश्रमपूर्ण लगन का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘कसौटी पर रख’ अथवा ‘प्रमाणित कर’; δοκιμάζω जाँचने, परखने या जाँच के द्वारा प्रामाणिक सिद्ध करने का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: आज्ञा
  rationale: यह शब्द अधिकारपूर्वक दिए गए आदेश को दर्शाता है। ‘आज्ञा के रूप में’ οὐ κατ’ ἐπιταγὴν की रीति या आधार संबंधी अर्थछाया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: दूसरों की तत्परता के माध्यम से
  rationale: διά के साथ संबंधकारक यहाँ माध्यम को दर्शाता है; ἑτέρων को संदर्भ से अधिक विशिष्ट बनाए बिना ‘दूसरों’ कहा गया है।
- source_word: σπουδή
  choice: तत्परता
  rationale: दान के इस प्रसंग में यह गंभीर उत्साह, लगन और तत्परता का भाव रखता है। ‘तत्परता’ आधुनिक हिन्दी में इन अर्थों को संक्षेप में व्यक्त करती है।
- source_word: ἀγάπη
  choice: प्रेम
  rationale: यह ἀγάπη का सामान्य और संदर्भानुकूल हिन्दी रूप है; यहाँ प्रेम दान देने की प्रतिक्रिया में प्रकट होता है।
- source_word: γνήσιον
  choice: सच्चाई
  rationale: संज्ञा के रूप में प्रयुक्त यह विशेषण किसी वस्तु के असली या निष्कपट होने को दर्शाता है। ‘आपके प्रेम की सच्चाई’ स्वाभाविक हिन्दी में उसकी प्रामाणिकता का भाव रखता है।
- source_word: δοκιμάζων
  choice: परख रहा हूँ
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ-साथ चल रहे कार्य या उद्देश्य को व्यक्त करता है। ‘परख रहा हूँ’ जाँचने की प्रक्रिया को स्पष्ट रखता है, बिना परिणाम पहले से तय किए।
- source_word: καί
  choice: भी
  rationale: 'καί का योगात्मक बल सुरक्षित है: दूसरों की तत्परता का उल्लेख करते हुए पौलुस उनके प्रेम की सच्चाई भी परख रहा है।'
- source_word: ὑμετέρας
  choice: आपके
  rationale: यह कुरिन्थ के विश्वासियों के सामूहिक अधिकारवाचक रूप को सम्मानपूर्ण मानक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दान देने के विषय में पौलुस का प्रेरितीय रुख
  choice: पौलुस स्पष्ट करता है कि वह इसे आज्ञा के रूप में नहीं कह रहा, बल्कि उनके प्रेम की सच्चाई परख रहा है।
  alternative: इसे ऐसी अप्रत्यक्ष आज्ञा मानना जिसका बल केवल अलंकारिक रूप से नरम किया गया है।
  rationale: οὐ κατ’ ἐπιταγὴν λέγω सीधे तौर पर आज्ञा के रूप में बोलने का निषेध करता है। अनुवाद प्रेरितीय अधिकार और स्वेच्छापूर्ण, प्रेम-प्रेरित उदारता के बीच के तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सहज मानक हिन्दी है। ‘आज्ञा के रूप में’ अधिकारपूर्ण आदेश के निषेध को स्पष्ट रखता है, जबकि ‘माध्यम से’ मूल के διά-वाक्यांश को बिना अत्यधिक शाब्दिक कठोरता के व्यक्त करता है।
