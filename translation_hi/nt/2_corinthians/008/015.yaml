reference: 2 Corinthians 8:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ὁ τὸ πολὺ οὐκ ἐπλεόνασεν, καὶ ὁ τὸ ὀλίγον οὐκ ἠλαττόνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: hi
  text: 'जैसा लिखा है: “जिसके पास बहुत था, उसके पास ज़रूरत से ज़्यादा नहीं था; और जिसके पास थोड़ा था, उसके पास ज़रूरत से कम नहीं था।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, निर्गमन 16:18 के शब्दों के अधिक निकट: “जिसने बहुत बटोरा, उसके पास कुछ अधिक न बचा, और जिसने थोड़ा बटोरा, उसके पास कमी न रही।”'
    reason: मूल यूनानी उद्धरण में ‘बटोरा’ क्रिया स्पष्ट नहीं है, पर निर्गमन 16:18 के स्रोत-पाठ में यह उपस्थित है; पादटिप्पणी उस अंतर और अधिक शाब्दिक विकल्प को सुरक्षित रखती है।
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: जैसा लिखा है
  rationale: यह पवित्रशास्त्र का उद्धरण प्रस्तुत करने वाला प्रचलित सूत्र है; यूनानी पूर्णकाल लिखित गवाही की स्थायी प्रामाणिकता दर्शाता है।
- source_word: Ὁ τὸ πολὺ
  choice: जिसके पास बहुत था
  rationale: संज्ञा के रूप में प्रयुक्त पद का अर्थ ‘वह जिसके पास बहुत [था]’ है। पौलुस की उद्धृत पंक्ति में बटोरने की क्रिया स्पष्ट रूप से नहीं दोहराई गई है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἐπλεόνασεν
  choice: उसके पास आवश्यकता से अधिक नहीं हुआ
  rationale: क्रिया यहाँ अधिकता या अधिशेष होने का भाव देती है। ‘आवश्यकता से अधिक’ सहज हिंदी में पर्याप्तता और समान वितरण के परिणाम को व्यक्त करता है।
- source_word: ὁ τὸ ὀλίγον
  choice: जिसके पास थोड़ा था
  rationale: यह पहले पद के समानांतर ‘वह जिसके पास थोड़ा [था]’ है और यूनानी में अनुपस्थित ‘बटोरा’ क्रिया को नहीं जोड़ता।
- source_word: ἠλαττόνησεν
  choice: उसके पास कमी नहीं हुई
  rationale: यहाँ क्रिया अभाव या आवश्यक मात्रा से कम पड़ने को दर्शाती है। यह हिंदी में स्वाभाविक है और अधिकता के विपरीत भाव को बनाए रखती है।
theological_decisions:
- issue: निर्गमन 16:18 के उद्धरण का उदारता और समानता के प्रसंग में प्रयोग
  choice: मुख्य पाठ में बटोरने की गतिविधि के बजाय अंतिम पर्याप्तता और वितरण को व्यक्त किया गया है।
  alternative: “जिसने बहुत बटोरा, उसके पास कुछ अधिक न निकला, और जिसने थोड़ा बटोरा, उसके पास कोई कमी न हुई।”
  rationale: पौलुस इस उद्धरण को विश्वासियों की भौतिक आवश्यकताओं की न्यायसंगत पूर्ति के समर्थन में प्रयोग करता है। फिर भी निर्गमन के मन्ना-बटोरने वाले मूल प्रसंग को वैकल्पिक अनुवाद के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘आवश्यकता से अधिक’ और ‘कमी’ का संतुलन समान वितरण के प्रसंग को स्पष्ट करता है, जबकि पादटिप्पणी उद्धरण के निर्गमन-संबंधी रूप को दिखाती है।
