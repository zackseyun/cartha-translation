language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: hi
  text: क्योंकि तुम हमारे प्रभु यीशु मसीह के अनुग्रह को जानते हो कि धनी होते हुए भी वह तुम्हारे लिए निर्धन हो गया, ताकि उसकी निर्धनता के द्वारा तुम धनी हो जाओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘धनी’ और ‘निर्धन’ संभवतः रूपक हैं। पौलुस इस पद में यह स्पष्ट नहीं करता कि मसीह की समृद्धि, उसकी निर्धनता और विश्वासियों की समृद्धि से ठीक-ठीक क्या अभिप्राय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: तुम ... जानते हो
  rationale: वर्तमानकालीन क्रिया यहाँ कुरिन्थियों के पहले से विदित ज्ञान की ओर संकेत करती है; सरल वर्तमान हिंदी में स्वाभाविक है।
- source_word: χάριν
  choice: अनुग्रह
  rationale: यह शब्द मसीह के कृपापूर्ण आत्मदान और संदर्भ में उदारता के आदर्श—दोनों को समेटता है; ‘अनुग्रह’ इसकी धार्मिक गहराई बनाए रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: यह κύριος का मानक और गरिमापूर्ण हिंदी रूप है तथा अधिकार और मसीह-संबंधी महत्त्व दोनों बनाए रखता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: आधुनिक हिंदी बाइबलीय प्रयोग में ‘मसीह’ Χριστός के पदवीगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δι’ ὑμᾶς
  choice: तुम्हारे लिए
  rationale: διά के साथ कर्मकारक का हितार्थक भाव संक्षिप्त और सहज हिंदी में व्यक्त होता है।
- source_word: πλούσιος ὤν
  choice: धनी होते हुए भी
  rationale: कृदन्त की विरोधसूचक रियायत को स्पष्ट करता है और यूनानी वाक्य के तनाव को बनाए रखता है।
- source_word: ἐπτώχευσεν
  choice: निर्धन हो गया
  rationale: यह सक्रिय क्रिया द्वारा धनी अवस्था से निर्धनता की ओर परिवर्तन को बिना उसका ढंग अधिक निश्चित किए व्यक्त करता है।
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: उसकी निर्धनता के द्वारा
  rationale: करणवाचक चतुर्थी को स्पष्ट करता है और ἐκείνου को स्वाभाविक सर्वनाम से व्यक्त करता है।
- source_word: πλουτήσητε
  choice: धनी हो जाओ
  rationale: ἵνα के बाद प्रयोजन/परिणाम का भाव रखता है और ‘निर्धन हो गया/धनी हो जाओ’ का जानबूझकर किया गया विरोध सुरक्षित करता है।
theological_decisions:
- issue: मसीह का ‘धनी’ होना और विश्वासियों का ‘धनी’ होना
  choice: मुख्य पाठ में आर्थिक रूपक को बिना किसी एक विशिष्ट धर्मवैज्ञानिक अर्थ तक सीमित किए बनाए रखा गया है।
  alternative: इसे केवल मसीह की देहधारण-पूर्व महिमा, उसके मसीही विशेषाधिकार, भौतिक संपत्ति, या केवल आत्मिक उद्धार की आशीषों के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ इन शब्दों की व्याख्या स्वयं सीमित नहीं करता। व्यापक आत्मदान का भाव आसपास के उदारता-विषयक संदर्भ में काम करता है; इसलिए वास्तविक धर्मवैज्ञानिक तनाव सुरक्षित रहना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘निर्धन’ ने ‘गरीब’ की अपेक्षा वाक्य को औपचारिक गरिमा दी है, जबकि अर्थ सामान्य पाठक के लिए स्पष्ट है। मूल यूनानी की कारणसूचक शुरुआत, विरोध और प्रयोजन-रचना सुरक्षित रखी गई है।
