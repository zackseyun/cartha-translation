  yaml_path: translation/nt/2_corinthians/008/017.yaml
  text: For he accepted the appeal[a], but being more earnest[d][c][b], he went to you of his own accord.
translation:
  language: hi
  text: क्योंकि उसने आग्रह स्वीकार तो किया[a], पर और भी अधिक उत्सुक होकर वह अपनी ही इच्छा से[c] तुम्हारे पास निकल पड़ा[d]।
  philosophy: optimal-equivalence
  footnotes:
