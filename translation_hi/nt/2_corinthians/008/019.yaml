  text: οὐ μόνον δὲ ἀλλὰ καὶ χειροτονηθεὶς ὑπὸ τῶν ἐκκλησιῶν συνέκδημος ἡμῶν ⸀σὺν τῇ χάριτι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν πρὸς τὴν ⸀αὐτοῦ τοῦ κυρίου δόξαν καὶ προθυμίαν ἡμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/019.yaml
  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: hi
  text: और इतना ही नहीं, बल्कि कलीसियाओं ने उसे इस अनुग्रह-दान[a] के साथ हमारा सहयात्री भी नियुक्त किया[b] है, जिसका प्रबंध हम स्वयं प्रभु की महिमा[c] और हमारी तत्परता के लिए कर रहे हैं—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस अनुग्रह के साथ”; इस संदर्भ में “अनुग्रह” इस दान को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “चुना” अथवा “निर्वाचित किया”।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद “उसके प्रभु की महिमा” अथवा केवल “प्रभु की महिमा” भी संभव है।
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: नियुक्त किया
  rationale: यह कलीसियाओं द्वारा उसे इस दायित्व के लिए चुने और ठहराए जाने को व्यक्त करता है, पर आधुनिक मतदान-प्रक्रिया का अनावश्यक संकेत नहीं देता।
- source_word: ἐκκλησιῶν
  choice: कलीसियाओं
  rationale: पौलुस के प्रयोग में यह स्थानीय मसीही समुदायों के लिए स्वाभाविक और प्रचलित हिन्दी शब्द है।
- source_word: συνέκδημος
  choice: यात्रा में हमारा साथी
  rationale: यह साथ यात्रा करने वाले व्यक्ति का स्पष्ट और स्वाभाविक वर्णन है।
- source_word: χάριτι
  choice: अनुग्रह-दान
  rationale: संदर्भ में यह यरूशलेम के लिए एकत्र किए गए ठोस दान को दर्शाता है, जबकि 'अनुग्रह' का भाव भी बनाए रखता है।
- source_word: διακονουμένῃ
  choice: सेवा ... की जा रही है
  rationale: διακονέω की सेवकाई-संबंधी ध्वनि को बनाए रखते हुए यहाँ दान को संभालने और पहुँचाने के कार्य को व्यक्त करता है।
- source_word: πρὸς
  choice: के लिए
  rationale: यहाँ उद्देश्य अथवा लक्ष्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αὐτοῦ τοῦ κυρίου
  choice: स्वयं प्रभु की
  rationale: αὐτοῦ को प्रबलतासूचक मानते हुए प्रभु पर दिए गए बल को सुरक्षित रखता है।
- source_word: δόξαν
  choice: महिमा
  rationale: δόξα का मानक और धर्मवैचारिक भार रखने वाला हिन्दी प्रतिशब्द है।
- source_word: προθυμίαν
  choice: तत्परता
  rationale: यह इच्छापूर्वक तैयार रहने और उत्साह का भाव देता है, बिना 'सहायता' जैसी संदर्भगत बात को मूल पाठ में जोड़े।
theological_decisions:
- issue: πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν में αὐτοῦ का संबंध और बल
  choice: '''स्वयं प्रभु की महिमा''—αὐτοῦ को प्रबलतासूचक समझा गया है।'
  alternative: '''उसके प्रभु की महिमा'' अथवा सामान्यतः ''प्रभु की महिमा''।'
  rationale: यूनानी वाक्यांश संक्षिप्त है और एकाधिक व्याकरणिक समझ संभव हैं। मुख्य पाठ में प्रबलतासूचक अर्थ स्वाभाविक है; पादटिप्पणी वास्तविक वैकल्पिक समझ को सुरक्षित रखती है।
- issue: προθυμίαν ἡμῶν का उद्देश्य-वाक्य में स्थान
  choice: '''हमारी तत्परता प्रकट करने के लिए'''
  alternative: '''हमारी तत्परता के लिए'' अथवा ''हमारे उत्साह के लिए''।'
  rationale: क्रिया की पूर्ति हिन्दी में आवश्यक है; 'प्रकट करने' से दान के संचालन द्वारा उनकी तत्परता दिखाई देने का आशय मिलता है, जबकि 'सहायता' जैसा अतिरिक्त कर्म नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप अपनाया गया है। पद अगले विचार की ओर बढ़ता है, इसलिए अंत में दीर्घ विराम-चिह्न रखा गया है। सभी पादटिप्पणी-चिह्न संबंधित पदांश के तुरंत बाद दिए गए हैं।
