  text: εἰ γὰρ ἡ προθυμία πρόκειται, καθὸ ἐὰν ⸀ἔχῃ εὐπρόσδεκτος, οὐ καθὸ οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: hi
  text: क्योंकि यदि तत्परता मौजूद है[a], तो जो किसी के पास है उसी के अनुसार वह स्वीकार्य होती है[b], न कि उसके अनुसार जो उसके पास नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उत्सुकता’ अथवा ‘इच्छा’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘जो कुछ किसी के पास हो, उसके अनुसार ... न कि उसके अनुसार जो उसके पास नहीं है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: तत्परता
  rationale: यह शब्द इच्छुक और उत्सुक मनोभाव को दर्शाता है। ‘तत्परता’ वर्तमान संदर्भ में स्वेच्छा से उदारता दिखाने की तैयार इच्छा को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: πρόκειται
  choice: मौजूद है
  rationale: इस प्रयोग में अर्थ किसी वस्तु के सामने रखे होने से अधिक उसके विद्यमान या उपस्थित होने का है; ‘मौजूद है’ आधुनिक हिन्दी में इसे स्पष्ट रखता है।
- source_word: καθὸ ἐὰν ἔχῃ
  choice: जो किसी के पास है उसी के अनुसार
  rationale: यह उपलब्ध साधनों को मानदंड बताता है। ‘किसी’ यूनानी के सामान्य एकवचन को लिंग-निरपेक्ष रखता है, और ‘उसी’ विरोध को स्पष्ट करता है।
- source_word: εὐπρόσδεκτος
  choice: स्वीकार्य होती है
  rationale: विशेषण का अर्थ स्वीकारयोग्य या स्वागतयोग्य है। स्त्रीलिंग क्रिया ‘तत्परता’ से इसका संबंध स्पष्ट करती है, पर यह नहीं जोड़ती कि स्वीकार करने वाला परमेश्वर है या समुदाय।
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: न कि उसके अनुसार जो उसके पास नहीं है
  rationale: 'यह पहले खंड के समानांतर ढाँचे और पौलुस के सटीक विरोध को सुरक्षित रखता है: मूल्यांकन उपलब्ध साधनों के अनुसार है, अनुपलब्ध साधनों के अनुसार नहीं।'
- source_word: εἰ γὰρ
  choice: क्योंकि यदि
  rationale: ‘क्योंकि’ व्याख्यात्मक संबंध और ‘यदि’ शर्त—दोनों को बनाए रखता है।
theological_decisions:
- issue: स्वीकार्यता का निहित मानदंड और स्वीकार करने वाला
  choice: तत्परता को वास्तविक साधनों के अनुसार स्वीकार्य कहा गया है, पर यह निर्दिष्ट नहीं किया गया कि वह परमेश्वर, समुदाय, या दोनों के सामने स्वीकार्य है।
  alternative: ‘परमेश्वर को स्वीकार्य’ अथवा ‘समुदाय को स्वीकार्य’ कहना।
  rationale: εὐπρόσδεκτος स्वीकृति का भाव देता है, पर पाठ स्वीकार करने वाले को स्पष्ट नहीं करता; इसलिए अनुवाद इस धार्मिक और सामाजिक संदर्भ की वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। समानांतर वाक्य-संरचना मूल यूनानी के अनुपात और विरोध को सुरक्षित रखती है; ‘किसी’ सामान्य एकवचन को लिंग-निरपेक्ष रखता है।
