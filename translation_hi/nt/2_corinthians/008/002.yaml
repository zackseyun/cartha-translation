source:
  edition: SBLGNT
  text: ὅτι ἐν πολλῇ δοκιμῇ θλίψεως ἡ περισσεία τῆς χαρᾶς αὐτῶν καὶ ἡ κατὰ βάθους πτωχεία αὐτῶν ἐπερίσσευσεν εἰς ⸂τὸ πλοῦτος⸃ τῆς ἁπλότητος αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/002.yaml
  text: that in a severe test of affliction[b][a], the abundance of their joy and their deep poverty overflowed into the wealth of their generosity.
translation:
  language: hi
  text: कि क्लेश की कठोर परीक्षा में उनके आनंद की भरपूरी और उनकी गहरी गरीबी[a] उनकी उदारता[b] की बहुतायत के रूप में उमड़ पड़ी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी गरीबी गहराई तक थी” अथवा “उनकी अत्यन्त गरीबी।”
    reason: lexical_alternative
  - marker: b
    text: या, “उनकी निष्कपटता की बहुतायत।” यहाँ अनूदित यूनानी शब्द का अर्थ “सरलता,” “निष्कपटता” या “एकनिष्ठता” भी हो सकता है, पर इस प्रसंग में सम्भवतः उदारतापूर्वक देना अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: क्लेश की बड़ी परीक्षा में
  rationale: यह अनुवाद δοκιμή के ‘परीक्षा/परख’ भाव और θλίψεως के साथ उसके संबंध को बनाए रखता है; πολλῇ की तीव्रता ‘बड़ी’ से स्वाभाविक हिन्दी में व्यक्त होती है।
- source_word: ἡ περισσεία τῆς χαρᾶς αὐτῶν
  choice: उनके आनन्द की भरपूरी
  rationale: περισσεία संज्ञा के रूप में प्रचुरता व्यक्त करता है। ‘भरपूरी’ मूल की संज्ञात्मक रचना को रखती और आगे ἐπερίσσευσεν के उमड़ने वाले बिंब से जुड़ती है।
- source_word: ἡ κατὰ βάθους πτωχεία αὐτῶν
  choice: उनकी गहरी गरीबी
  rationale: κατὰ βάθους गरीबी की चरम गहराई को तीव्र करता है। ‘गहरी गरीबी’ संक्षिप्त, स्वाभाविक और मूल के गहराई-वाले बिंब के निकट है।
- source_word: ἐπερίσσευσεν
  choice: उमड़कर … बन गई
  rationale: περισσεύω की अत्यधिक होने या उमड़ने की गतिशीलता और εἰς के परिणामसूचक बल को हिन्दी में संयुक्त रूप से व्यक्त करता है। संयुक्त कर्ता को हिन्दी में समग्र परिणाम मानकर एकवचन क्रिया दी गई है।
- source_word: εἰς τὸ πλοῦτος
  choice: समृद्धि बन गई
  rationale: εἰς यहाँ परिणाम की ओर गति दिखाता है। ‘बन गई’ उस परिणामसूचक संबंध को सहज हिन्दी में स्पष्ट करता है, जबकि ‘समृद्धि’ πλοῦτος के धनाधिक्य के रूपक को रखती है।
- source_word: τῆς ἁπλότητος αὐτῶν
  choice: उनकी उदारता
  rationale: दान-संग्रह के तत्काल प्रसंग में ἁπλότης का आशय खुले हाथ से देने वाली उदारता है। फिर भी इसके ‘निष्कपटता/सरलता’ संबंधी मूल अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: आर्थिक दान के प्रसंग में ἁπλότης का अर्थ
  choice: उदारता
  alternative: निष्कपटता, सरलता या एकनिष्ठता
  rationale: आसपास का प्रसंग पवित्र लोगों के लिए आर्थिक सहायता देने का है, इसलिए ‘उदारता’ सबसे संभावित प्रसंगगत अर्थ है। पादटिप्पणी दूसरी वास्तविक अर्थ-संभावना को सुरक्षित रखती है और पाठ को किसी विशिष्ट सांप्रदायिक व्याख्या तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। ‘क्लेश,’ ‘आनन्द’ और ‘उदारता’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; अत्यधिक संस्कृतनिष्ठ वाक्य-विन्यास से बचते हुए यूनानी पाठ की संज्ञात्मक समानता और उमड़ने के रूपक को यथासम्भव सुरक्षित रखा गया है।
