lexical_decisions:
- source_word: οὐ γὰρ
  choice: क्योंकि ... नहीं
  rationale: γάρ पिछले कथन का कारण या स्पष्टीकरण देता है, और οὐ उस आशय का निषेध करता है।
- source_word: ἵνα
  choice: मेरा आशय यह ... कि ... हो
  rationale: यहाँ ἵνα एक निहित अभिप्राय के बाद आता है; स्वाभाविक हिन्दी में निहित भाव को स्पष्ट करने के लिए ‘मेरा आशय’ जोड़ा गया है।
- source_word: ἄλλοις
  choice: दूसरों को
  rationale: दत्तिव बहुवचन उस पक्ष को बताता है जिसे राहत प्राप्त होगी; ‘दूसरों को’ सहज और अनिश्चित अर्थ बनाए रखता है।
- source_word: ἄνεσις
  choice: राहत
  rationale: दान-संग्रह के प्रसंग में यह दबाव या बोझ कम होने को दर्शाता है, केवल भावनात्मक सांत्वना को नहीं।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: यह ἄλλοις के समानांतर उस पक्ष को बताता है जिस पर विपरीत दशा आएगी।
- source_word: θλῖψις
  choice: कष्ट
  rationale: यहाँ आर्थिक देने से उत्पन्न दबाव या कठिनाई अभिप्रेत है; ‘कष्ट’ अर्थ को व्यापक और स्वाभाविक रूप में रखता है।
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: बल्कि बराबरी हो
  rationale: ἰσότης बराबरी अथवा न्यायपूर्ण संतुलन को व्यक्त कर सकता है। ‘बराबरी’ सीधा lexical समतुल्य है; ἐξ का संबंध हिन्दी की स्वाभाविक विधेय रचना में समाहित किया गया है।
theological_decisions:
- issue: भौतिक साझेदारी के प्रसंग में ἰσότης का अर्थ
  choice: बराबरी
  alternative: न्यायपूर्ण संतुलन
  rationale: ‘बराबरी’ पौलुस की शब्दावली और अगले पदों के पारस्परिक संतुलन को बनाए रखती है, जबकि पादटिप्पणी स्पष्ट करती है कि इसका अर्थ आवश्यक रूप से सबकी संपत्ति का पूर्णतः समान होना नहीं है।
