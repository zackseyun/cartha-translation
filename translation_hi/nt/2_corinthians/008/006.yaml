id: 2CO.8.6
reference: 2 Corinthians 8:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: hi
  text: इसलिए हमने तीतुस से आग्रह किया कि जैसे उसने पहले आरम्भ किया था, वैसे ही वह तुम्हारे बीच अनुग्रह के इस कार्य[a] को पूरा भी करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस उदार कार्य’; अधिक शाब्दिक रूप में, ‘इस अनुग्रह’।
    reason: χάρις के ठोस प्रसंगगत अर्थ और अधिक शाब्दिक ‘अनुग्रह’ के बीच अर्थगत विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: παρακαλέσαι
  choice: आग्रह किया
  rationale: यहाँ क्रिया तीतुस को ठोस कार्रवाई के लिए प्रेरित करने का भाव रखती है; ‘आग्रह किया’ आधुनिक हिन्दी में स्वाभाविक है और न तो बहुत हल्का है, न अत्यधिक औपचारिक।
- source_word: Τίτον
  choice: तीतुस
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: καθὼς προενήρξατο
  choice: जैसे उसने पहले आरम्भ किया था
  rationale: προενήρξατο में पहले से आरम्भ कर चुकने का कालगत भाव है; यह वाक्यांश उस पूर्व आरम्भ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπιτελέσῃ
  choice: पूरा भी करे
  rationale: क्रिया आरम्भ किए गए कार्य को उसकी परिणति तक पहुँचाने का संकेत देती है; ‘भी’ यूनानी καί के योगात्मक बल को व्यक्त करता है।
- source_word: εἰς ὑμᾶς
  choice: तुम्हारे बीच
  rationale: यहाँ दिशा-सूचक पद कुरिन्थियों के समुदाय में किए जा रहे कार्य को दर्शाता है; ‘तुम्हारे बीच’ प्रसंगानुकूल है।
- source_word: χάριν
  choice: अनुग्रह के इस कार्य
  rationale: संग्रह के प्रसंग में χάρις किसी ठोस उदार सेवा अथवा योगदान को दर्शाता है, पर उसमें ‘अनुग्रह’ का पौलुसी धार्मिक आयाम भी बना रहता है।
- source_word: καὶ τὴν χάριν ταύτην
  choice: अनुग्रह के इस कार्य को पूरा भी करे
  rationale: रचना इस विशेष अनुग्रहपूर्ण कार्य को भी पूरा करने पर बल देती है; हिन्दी शब्दक्रम अर्थ को सहज रखते हुए καί के बल को ‘भी’ से दर्शाता है।
theological_decisions:
- issue: संग्रह के प्रसंग में χάρις का अर्थ
  choice: ‘अनुग्रह के इस कार्य’—एक ठोस उदार सेवा, जिसे पौलुस अनुग्रह के रूप में प्रस्तुत करता है
  alternative: ‘यह अनुग्रह’ अथवा ‘यह उदार कार्य’
  rationale: निकटवर्ती प्रसंग पवित्र लोगों के लिए संग्रह और उसे पूरा कराने में तीतुस की भूमिका से जुड़ा है। मुख्य पाठ ठोस कार्य को स्पष्ट करता है, साथ ही ‘अनुग्रह’ रखकर पौलुस की धार्मिक भाषा और उसकी अर्थगत व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सरल शैली। ‘आरम्भ’ और ‘अनुग्रह’ बाइबलीय गरिमा बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठकों के लिए सहज है।
