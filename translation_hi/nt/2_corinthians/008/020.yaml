    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενοι τοῦτο
  choice: हम यह सावधानी बरत रहे हैं
  rationale: मध्यवाच्य कृदन्त यहाँ किसी संभावित आपत्ति से बचने के लिए सावधानीपूर्वक उपाय करने का भाव देता है। वर्तमान हिंदी में यह अभिव्यक्ति स्वाभाविक रूप से उस निवारक आशय को प्रकट करती है।
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: कि ... कोई हम पर दोष न लगाए
  rationale: μή के साथ संभावनार्थक क्रिया उस परिणाम को रोकने का उद्देश्य बताती है। μωμάομαι का अर्थ दोष लगाना या निन्दा करना है; यहाँ उत्तरदायित्व के संदर्भ में 'दोष न लगाए' उपयुक्त है।
- source_word: ἐν τῇ ἁδρότητι ταύτῃ
  choice: इस उदार दान के विषय में
  rationale: ἁδρότης बहुतायत या उदारता को दर्शाता है और प्रसंग में एक बड़ी सहायता-राशि की ओर संकेत करता है। 'उदार दान' वस्तु और उदारता दोनों को स्पष्ट करता है, जबकि 'के विषय में' ἐν के विषयगत अर्थ को व्यक्त करता है।
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: हमारे द्वारा सँभाले जा रहे
  rationale: वित्तीय सहायता के इस प्रसंग में διακονέω दान की सेवा-संबंधी व्यवस्था और प्रबन्ध को दर्शाता है। 'सँभाले जा रहे' सहज हिंदी है और केवल धन अपने पास रखने के बजाय उसके उत्तरदायी प्रबन्ध का भाव देता है।
theological_decisions:
- issue: दान के प्रबन्ध में पौलुस और उसके सहकर्मियों की चिंता
  choice: पद को वित्तीय सेवा में व्यावहारिक उत्तरदायित्व और दोषारोपण से बचने की सावधानी पर बल देते हुए प्रस्तुत किया गया है।
  alternative: इसे केवल यात्रा या सामान्य व्यवस्था से जुड़ी सावधानी के रूप में प्रस्तुत करना।
  rationale: यूनानी वाक्य स्पष्ट रूप से उस निवारक उपाय पर केंद्रित है जिससे इस बड़ी भेंट के संबंध में उन पर कोई दोष न लगा सके। इससे आगे कोई साम्प्रदायिक या व्यापक सैद्धान्तिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। 'सँभाले जा रहे' प्रशासनिक उत्तरदायित्व को सहज भाषा में व्यक्त करता है; 'उदार दान' के साथ पादटिप्पणी मूल शब्द की बहुतायत और उदारता की अर्थ-सीमा सुरक्षित रखती है।
