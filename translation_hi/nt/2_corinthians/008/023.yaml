id: 2CO.8.23
reference: 2 Corinthians 8:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: hi
  text: जहाँ तक तीतुस की बात है, वह मेरा सहभागी और तुम्हारे लिए मेरा सहकर्मी है; और जहाँ तक हमारे भाइयों की बात है, वे कलीसियाओं के भेजे हुए प्रतिनिधि[a] और मसीह की महिमा[b] हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कलीसियाओं के प्रेरित।” यूनानी शब्द का अर्थ नियुक्त दूत अथवा प्रतिनिधि भी हो सकता है और व्यापक अर्थ में प्रेरित भी; यहाँ प्रसंग कलीसियाओं के प्रतिनिधियों के अर्थ का समर्थन करता है।
    reason: alternative_reading
  - marker: b
    text: या, “ख्रीष्ट की महिमा।” यहाँ यूनानी Χριστός एक उपाधि है, इसलिए मुख्य पाठ में उसका अनुवाद “मसीह” किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου
  choice: जहाँ तक तीतुस की बात है
  rationale: यूनानी वाक्यांश संक्षिप्त और अध्याहृत है तथा दो समानांतर विषय प्रस्तुत करता है। यह हिंदी प्रयोग उसके संवादात्मक कार्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κοινωνὸς ἐμὸς
  choice: मेरा सहभागी
  rationale: κοινωνός साझा भागीदारी और निकट सहयोग का बोध कराता है; ‘सहभागी’ संबंध और सेवकाई—दोनों आयाम बनाए रखता है।
- source_word: εἰς ὑμᾶς συνεργός
  choice: तुम्हारे लिए मेरा सहकर्मी
  rationale: ‘सहकर्मी’ συνεργός का सीधा अर्थ देता है और ‘तुम्हारे लिए’ सेवा की कुरिन्थियों की ओर दिशा को बिना ‘भलाई’ जैसी अतिरिक्त व्याख्या जोड़े व्यक्त करता है।
- source_word: ἀδελφοὶ ἡμῶν
  choice: हमारे भाई
  rationale: यूनानी पद पुल्लिंग बहुवचन है और इस प्रसंग में संग्रह के साथ भेजे जा रहे पुरुष प्रतिनिधियों की ओर संकेत करता है।
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: कलीसियाओं के भेजे हुए प्रतिनिधि
  rationale: ἀπόστολοι यहाँ कलीसियाओं द्वारा नियुक्त और भेजे गए दूतों अथवा प्रतिनिधियों के अर्थ में है। यह अनुवाद शब्द के भेजे जाने के भाव को बनाए रखते हुए किसी विशिष्ट पद को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: δόξα Χριστοῦ
  choice: मसीह की महिमा
  rationale: यह क्रियारहित समानाधिकरणात्मक पद है और इन भाइयों को मसीह की महिमा के रूप में वर्णित करता है। ‘मसीह’ Χριστός को उपाधि के रूप में अनूदित करता है।
theological_decisions:
- issue: ἀπόστολοι का इन अनाम भाइयों के लिए आशय
  choice: कलीसियाओं के भेजे हुए प्रतिनिधि
  alternative: कलीसियाओं के प्रेरित
  rationale: दान-संग्रह के प्रसंग और ‘कलीसियाओं के’ संबंधसूचक प्रयोग से कलीसियाओं द्वारा नियुक्त प्रतिनिधि अभिप्रेत जान पड़ते हैं। फिर भी पादटिप्पणी व्यापक अर्थ में ‘प्रेरित’ की वास्तविक शब्दार्थ-संभावना सुरक्षित रखती है।
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; ‘मसीह’ आधुनिक हिंदी में उसके अर्थ को स्वाभाविक और प्रतिष्ठित ढंग से व्यक्त करता है।
- issue: δόξα Χριστοῦ की समानाधिकरणात्मक शक्ति
  choice: मसीह की महिमा हैं
  alternative: मसीह के लिए आदर का कारण हैं
  rationale: मूल यूनानी में क्रिया नहीं है और वाक्यांश सीधे भाइयों को ‘मसीह की महिमा’ कहता है। अधिक व्याख्यात्मक विकल्प के बजाय इस सघन और धर्मवैचारिक रूप से तनावपूर्ण अभिव्यक्ति को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। समानांतर ‘जहाँ तक…की बात है’ संरचना मूल के εἴτε…εἴτε संबंध को स्वाभाविक हिंदी में दर्शाती है। ‘मसीह की महिमा’ की असामान्य किंतु अर्थपूर्ण संक्षिप्तता जानबूझकर सुरक्षित रखी गई है।
