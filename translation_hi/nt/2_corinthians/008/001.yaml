  text: हम तुम्हें, भाइयो[a], परमेश्वर के उस अनुग्रह[b] के विषय में बताते हैं जो मकिदुनिया की कलीसियाओं में दिया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाइयो और बहनो’; यूनानी में ‘भाइयो’ है, और पुल्लिंग रूप का प्रयोग प्रायः पूरी मण्डली को सम्बोधित करने के लिए होता है।
    reason: lexical_alternative
  - marker: b
    text: ‘परमेश्वर का अनुग्रह’ परमेश्वर की कृपा और उस कृपा से मकिदुनिया की कलीसियाओं में उत्पन्न उदारता—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζομεν
  choice: हम तुम्हें ... बताते हैं
  rationale: γνωρίζω का अर्थ किसी बात को प्रकट करना या ज्ञात कराना है। यह रूप वर्तमानकालीन कथन को स्वाभाविक, स्पष्ट हिन्दी में व्यक्त करता है और ‘हम चाहते हैं कि तुम जानो’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया गया
  rationale: यहाँ δέ हल्के प्रसंग-परिवर्तन का संकेत देता है, प्रबल विरोध का नहीं। हिन्दी में पद और अध्याय के प्रवाह से यह परिवर्तन स्पष्ट है; ‘परन्तु’ विरोध को बढ़ा देता और ‘अब’ समय-संबंधी अर्थ का आभास दे सकता था।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग सम्बोधन है। पौलुस के पत्रों में यह प्रायः पूरी मण्डली को सम्बोधित करता है; इसलिए समावेशी आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: χάριν τοῦ θεοῦ
  choice: परमेश्वर के उस अनुग्रह
  rationale: ‘अनुग्रह’ पौलुस के प्रमुख धर्मवैचारिक शब्द χάρις की व्यापकता बनाए रखता है—परमेश्वर की कृपा और उससे उत्पन्न उदारता, दोनों यहाँ दृष्टि में हो सकते हैं।
- source_word: τὴν δεδομένην
  choice: जो ... दिया गया है
  rationale: पूर्ण निष्क्रिय कृदन्त को हिन्दी के पूर्ण निष्क्रिय रूप से व्यक्त किया गया है, जिससे दिए जाने की पूरी हुई क्रिया और उसका वर्तमान प्रभाव दोनों बने रहते हैं।
- source_word: ἐν ταῖς ἐκκλησίαις
  choice: कलीसियाओं में
  rationale: ἐν यहाँ उस क्षेत्र या समुदाय को बताता है जिसमें अनुग्रह कार्यरत हुआ। ‘कलीसियाओं में’ स्रोत की संरचना और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- source_word: τῆς Μακεδονίας
  choice: मकिदुनिया की
  rationale: सम्बन्धकारक रूप को सीधे ‘मकिदुनिया की कलीसियाओं’ के रूप में रखा गया है।
theological_decisions:
- issue: ‘परमेश्वर के अनुग्रह’ का प्रसंगगत अर्थ
  choice: परमेश्वर का कृपापूर्ण कार्य, जो मकिदुनिया की कलीसियाओं की उदारता में फलित हुआ
  alternative: केवल दान की ठोस भेंट, अथवा केवल उन कलीसियाओं पर हुआ सामान्य ईश्वरीय उपकार
  rationale: मूल पदावली परमेश्वर की कृपा और उस कृपा से उत्पन्न उदार दान के बीच जानबूझकर व्यापक अर्थ बनाए रखती है। मुख्य पाठ में ‘अनुग्रह’ रखकर इस धर्मवैचारिक तनाव को संकुचित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘कलीसिया’ और ‘अनुग्रह’ प्रचलित बाइबलीय शब्द हैं; वाक्य-विन्यास को सामान्य पाठक के लिए स्पष्ट रखा गया है।
