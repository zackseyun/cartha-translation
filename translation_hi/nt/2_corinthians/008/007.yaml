  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: hi
  text: परन्तु जैसे तुम हर बात में—विश्वास में, बोलने में, ज्ञान में, पूरी तत्परता में, और उस प्रेम में जो हमारी ओर से तुममें उत्पन्न हुआ है[a]—भरपूर हो, वैसे ही इस अनुग्रह में भी भरपूर होते जाओ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “हमारे प्रति तुम्हारे प्रेम में।” यूनानी वाक्यांश कठिन है; कुछ पाण्डुलिपियों में ऐसा पाठ मिलता है जिसका अर्थ “हमारे प्रति तुम्हारा प्रेम” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: अर्थात् उदारतापूर्वक देने का यह कृपापूर्ण कार्य।
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: बहुतायत से भरे हो / बहुतायत से भर जाओ
  rationale: दोनों occurrences में बहुतायत की मूल छवि और वर्तमान समृद्धि से आग्रह की ओर बढ़ती समानांतर रचना बनी रहती है।
- source_word: ἐν παντί
  choice: हर बात में
  rationale: यह आगे दी गई विशेषताओं को समेटने वाला स्वाभाविक और व्यापक हिन्दी वाक्यांश है।
- source_word: πίστει
  choice: विश्वास
  rationale: इस मसीही गुण-सूची में πίστις का सामान्य और संदर्भानुकूल अर्थ।
- source_word: λόγῳ
  choice: वचन
  rationale: यहाँ λόγος बोलने या अभिव्यक्ति की क्षमता का सूचक हो सकता है; ‘वचन’ मूल शब्द की व्यापकता रखता है, यद्यपि हिन्दी में इसके धार्मिक अर्थ की छाया भी है।
- source_word: γνώσει
  choice: ज्ञान
  rationale: गुण-सूची में सीधा और स्वाभाविक समतुल्य।
- source_word: πάσῃ σπουδῇ
  choice: हर प्रकार की तत्परता
  rationale: σπουδή की गंभीर उत्सुकता, लगन और सक्रिय तत्परता को वर्तमान हिन्दी में सहज ढंग से व्यक्त करता है।
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: हमारे उस प्रेम में जो तुममें है
  rationale: SBLGNT के कठिन ἐξ ἡμῶν ἐν ὑμῖν को पूरी तरह सरल करके एक ही व्याख्या तय नहीं की गई; ‘हमारे’ और ‘तुममें’ दोनों संबंध सुरक्षित हैं।
- source_word: χάριτι
  choice: अनुग्रह
  rationale: दान की कृपापूर्ण सेवा की ओर संकेत करते हुए भी पौलुस की θεologically समृद्ध χάρις शब्दावली सुरक्षित रहती है।
theological_decisions:
- issue: यरूशलेम के लिए संग्रह के संदर्भ में χάρις का अर्थ
  choice: मुख्य पाठ में ‘अनुग्रह’
  alternative: ‘दान का यह कृपापूर्ण कार्य’ या ‘उदारतापूर्वक देने का यह काम’
  rationale: संदर्भ में ठोस रूप से देने का कार्य है, पर ‘अनुग्रह’ रखने से पौलुस की धार्मिक गहराई और शब्द-संबंध सुरक्षित रहते हैं; पादटिप्पणी ठोस आशय स्पष्ट करती है।
- issue: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ की व्याख्या
  choice: ‘हमारे उस प्रेम में जो तुममें है’
  alternative: ‘हमारे प्रति तुम्हारे प्रेम में’
  rationale: वाक्यांश पाठ-समीक्षात्मक और वाक्य-विन्यास की दृष्टि से कठिन है। मुख्य पाठ स्वीकृत SBLGNT पाठ के संबंधों को बनाए रखता है और पादटिप्पणी संभावित वैकल्पिक अर्थ तथा पाठांतर बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप रखा गया है। ‘बहुतायत से भरे’ मूल क्रिया की abundance imagery बचाता है; कठिन प्रेम-वाक्यांश को अस्वाभाविक शब्दशःता के बिना जानबूझकर कुछ खुला रखा गया है।
