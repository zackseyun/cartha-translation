id: 2CO.8.5
reference: 2 Corinthians 8:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οὐ καθὼς ἠλπίσαμεν ἀλλ’ ἑαυτοὺς ἔδωκαν πρῶτον τῷ κυρίῳ καὶ ἡμῖν διὰ θελήματος θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/005.yaml
  text: And not as we expected[a], but they gave themselves first to the Lord and to us through the will of God[b],
translation:
  language: hi
  text: और जैसा हमने आशा की थी[a], केवल वैसा ही नहीं हुआ, बल्कि उन्होंने परमेश्वर की इच्छा के द्वारा[b] पहले अपने आप को प्रभु को, और फिर हमें सौंप दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसा हमने अपेक्षा की थी।”
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर की इच्छा से,” अथवा “परमेश्वर की इच्छा के अनुसार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἠλπίσαμεν
  choice: जैसा हमने आशा की थी
  rationale: ἐλπίζω का सामान्य अर्थ ‘आशा करना’ है। यहाँ यह प्रेरितों की प्रत्याशा को व्यक्त करता है; ‘आशा की थी’ मूल शब्द का भाव बनाए रखता है।
- source_word: ἑαυτοὺς ἔδωκαν
  choice: उन्होंने अपने आप को ... सौंप दिया
  rationale: प्रतिबिंबवाचक सर्वनाम और δίδωμι के व्यक्तिगत आत्म-समर्पण के अर्थ को बनाए रखा गया है; इसे केवल धन देने तक सीमित नहीं किया गया।
- source_word: πρῶτον
  choice: पहले
  rationale: यह क्रम और प्राथमिकता दोनों का संकेत दे सकता है। ‘पहले’ इस संभावित द्विअर्थता को सुरक्षित रखता है।
- source_word: τῷ κυρίῳ
  choice: प्रभु को
  rationale: κύριος के लिए स्वाभाविक और प्रतिष्ठित हिन्दी ‘प्रभु’ है; यहाँ पौलुस के प्रयोग में संकेत मसीह की ओर है।
- source_word: καὶ ἡμῖν
  choice: और फिर हमें
  rationale: समानांतर सम्प्रदान संरचना को रखा गया है। हिन्दी में ‘फिर’ से प्रभु को दिए गए प्राथमिक स्थान के बाद पौलुस और उसके साथियों के प्रति सहयोग का क्रम स्पष्ट होता है।
- source_word: διὰ θελήματος θεοῦ
  choice: परमेश्वर की इच्छा के द्वारा
  rationale: διά के साथ संबंधकारक के साधन अथवा माध्यम के भाव को औपचारिक रूप से सुरक्षित रखता है और दैवी साधन, अनुमति तथा इच्छा के अनुरूप होने के बीच की सूक्ष्म अस्पष्टता को पूरी तरह समाप्त नहीं करता।
theological_decisions:
- issue: अपने आप को प्रभु को और हमें सौंपने का संबंध
  choice: आत्म-समर्पण पहले प्रभु की ओर और उसके बाद पौलुस तथा उसके साथियों की ओर प्रस्तुत किया गया है।
  alternative: इसे ‘पहले’ से किसी स्पष्ट अधीनस्थ क्रम के बिना दोहरा समर्पण माना जा सकता है।
  rationale: πρῶτον और सम्प्रदान पदों का क्रम प्रभु की प्राथमिकता दर्शाता है, पर अनुवाद इससे कोई अधिक प्रबल कलीसियाई दावा नहीं बनाता।
- issue: διὰ θελήματος θεοῦ का बल
  choice: ‘परमेश्वर की इच्छा के द्वारा’ रखा गया है।
  alternative: ‘परमेश्वर की इच्छा से’ अथवा ‘परमेश्वर की इच्छा के अनुसार’।
  rationale: यूनानी पद दैवी माध्यम/कारण, अनुमति या अनुरूपता के भाव ग्रहण कर सकता है; मुख्य पाठ मूल पूर्वसर्गीय संरचना के निकट रहकर इस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। आरम्भिक यूनानी οὐ καθὼς ... ἀλλά की तुलना को स्वाभाविक हिन्दी में ‘केवल वैसा ही नहीं ... बल्कि’ से व्यक्त किया गया है।
