  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: hi
  text: पर अब इसे पूरा भी कर दो[a], ताकि जैसे तुम इसे करने के लिए तत्पर थे, वैसे ही जो कुछ तुम्हारे पास है उसके अनुसार इसे पूरा भी किया जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसे कार्यान्वित करने का काम पूरा कर दो।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जो कुछ तुम्हारे पास है, उसमें से”; अर्थात अपने वर्तमान साधनों के अनुरूप।
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: पर अब
  rationale: यह पद पिछले विचार से वर्तमान कार्यवाही की ओर हल्का विरोधात्मक और कालगत परिवर्तन दिखाता है।
- source_word: τὸ ποιῆσαι ἐπιτελέσατε
  choice: उसे पूरा भी कर दो
  rationale: यूनानी पदबंध पहले से प्रस्तावित दान के वास्तविक क्रियान्वयन को पूरा करने का आदेश देता है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: इच्छा करने की तत्परता
  rationale: προθυμία उत्सुक तत्परता और θέλειν इच्छा/संकल्प को व्यक्त करता है; यह रूप दोनों भावों को अलग रखते हुए सहज हिन्दी देता है।
- source_word: οὕτως καὶ τὸ ἐπιτελέσαι
  choice: वैसे ही ... उसे पूरा भी किया जाए
  rationale: यह पहले की तत्परता और अब अपेक्षित पूर्णता के बीच तुलना और समरूपता बनाए रखता है।
- source_word: ἐκ τοῦ ἔχειν
  choice: जो कुछ तुम्हारे पास है उसके अनुसार
  rationale: वाक्यांश उपलब्ध साधनों से या उनके अनुरूप पूरा करने का भाव देता है; 'के अनुसार' हिन्दी में माप/क्षमता का आशय स्पष्ट करता है, बिना साधनों से अधिक देने की मांग जोड़े।
theological_decisions:
- issue: उपलब्ध साधनों के अनुसार दान पूरा करना
  choice: प्रतिज्ञात योगदान को वर्तमान साधनों के अनुरूप पूरा करने का आग्रह
  alternative: साधनों की परवाह किए बिना किसी भी अच्छे संकल्प को पूरा करने का सामान्य आदेश
  rationale: निकट संदर्भ कुरिन्थियों के योगदान का है, और ἐκ τοῦ ἔχειν उपलब्ध साधनों को सीमा या माप के रूप में प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। मुख्य पाठ में स्वाभाविकता के लिए पहले और दूसरे ἐπιτελέω का शब्दशः एक-जैसा रूप न रखकर दोनों में ‘पूरा’ की शब्दगत कड़ी बनाए रखी गई है।
