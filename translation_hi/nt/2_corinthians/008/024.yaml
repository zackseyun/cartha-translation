  text: τὴν οὖν ἔνδειξιν τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν εἰς αὐτοὺς ⸀ἐνδεικνύμενοι εἰς πρόσωπον τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/024.yaml
  text: Therefore[b][a], show them before the churches the proof of your love and of our boasting about you.
translation:
  language: hi
  text: इसलिए, कलीसियाओं के सामने उन्हें अपने प्रेम और तुम्हारे विषय में हमारे गर्व करने का प्रमाण[a] दिखाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रदर्शन” अथवा “साक्ष्य”।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले आग्रह को स्पष्ट रूप से जोड़ता है।
- source_word: ἔνδειξιν
  choice: प्रमाण
  rationale: यह ऐसे प्रत्यक्ष प्रदर्शन या साक्ष्य को व्यक्त करता है जिससे प्रेम स्पष्ट हो जाए।
- source_word: ἀγάπης
  choice: प्रेम
  rationale: संदर्भ में यह कार्यों द्वारा प्रकट व्यावहारिक और संबंधपरक प्रेम है।
- source_word: καυχήσεως
  choice: गर्व करने का आधार
  rationale: यह पौलुस के καύχησις की सकारात्मक आलंकारिक शक्ति को स्वाभाविक हिन्दी में रखता है और वाक्य को ऐसा अर्थ देने से बचाता है मानो स्वयं गर्व को प्रमाणित करना हो।
- source_word: ὑπὲρ ὑμῶν
  choice: तुम्हारे विषय में
  rationale: καύχησις के साथ यह कुरिन्थियों के विषय में पौलुस के गर्व करने को दर्शाता है।
- source_word: εἰς αὐτοὺς
  choice: उन्हें
  rationale: यह निकटवर्ती संदर्भ में बताए गए भाइयों या कलीसियाओं के प्रतिनिधियों की ओर संकेत करता है।
- source_word: ἐνδεικνύμενοι
  choice: दिखाओ
  rationale: संदर्भ में कृदंत आज्ञार्थक बल रखता है और किसी बात को प्रत्यक्ष रूप से प्रकट करने का आग्रह करता है।
- source_word: εἰς πρόσωπον τῶν ἐκκλησιῶν
  choice: कलीसियाओं के सामने
  rationale: यह कलीसियाओं की सार्वजनिक उपस्थिति अथवा उनके प्रतिनिधियों के सामने किए जाने वाले प्रदर्शन को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῶν ἐκκλησιῶν
  choice: कलीसियाओं
  rationale: पौलुस के प्रयोग में यह स्थानीय मसीही समुदायों के लिए मानक हिन्दी शब्द है।
theological_decisions:
- issue: καύχησις का सकारात्मक पौलुसी प्रयोग
  choice: गर्व करने का आधार
  alternative: घमण्ड
  rationale: यहाँ शब्द दोषपूर्ण आत्मश्लाघा नहीं, बल्कि कुरिन्थियों के विषय में पौलुस के भरोसेपूर्ण गर्व को दर्शाता है; इसलिए नकारात्मक अर्थ वाला ‘घमण्ड’ भ्रामक होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज आज्ञार्थक वाक्य। ‘कलीसिया’ परियोजना-संगत धार्मिक शब्द है; ‘गर्व करने का आधार’ मूल की आलंकारिक शक्ति और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
