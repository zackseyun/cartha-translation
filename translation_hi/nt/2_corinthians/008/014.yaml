base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: hi
  text: वर्तमान समय में तुम्हारी बहुतायत उनकी कमी पूरी करे, ताकि उनकी बहुतायत भी तुम्हारी कमी पूरी करे, जिससे बराबरी[a] हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निष्पक्षता” अथवा “न्यायसंगत संतुलन”; यहाँ यूनानी शब्द का आशय परस्पर आवश्यकताएँ पूरी करने से उत्पन्न संतुलन है, न कि यह कि सबके पास बिल्कुल समान संपत्ति हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: इस समय
  rationale: यह पदबंध वर्तमान परिस्थिति या अवसर की ओर संकेत करता है; ‘इस समय’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: τὸ ὑμῶν περίσσευμα
  choice: तुम्हारी भरपूरी
  rationale: περίσσευμα आवश्यकता से अधिक उपलब्ध साधनों या प्रचुरता को दर्शाता है। ‘भरपूरी’ भौतिक संदर्भ को बनाए रखते हुए इसे केवल धन तक सीमित नहीं करती।
- source_word: εἰς τὸ ἐκείνων ὑστέρημα
  choice: उनकी कमी को पूरा करे
  rationale: ὑστέρημα यहाँ अभाव या आवश्यकता है, और εἰς उद्देश्य/परिणाम व्यक्त करता है। हिन्दी में ‘कमी को पूरा करे’ इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἵνα καὶ τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα
  choice: ताकि उनकी भरपूरी भी तुम्हारी कमी को पूरा करे
  rationale: ‘ताकि’ उद्देश्य और ‘भी’ पारस्परिकता को सुरक्षित रखते हैं। दोनों ओर समान शब्दावली यूनानी वाक्य की संतुलित संरचना को दर्शाती है।
- source_word: ὅπως γένηται ἰσότης
  choice: और इस तरह बराबरी हो
  rationale: ἰσότης बराबरी, निष्पक्षता या संतुलन का भाव रखता है। ‘इस तरह’ परिणाम-संबंध को और ‘बराबरी’ मूल शब्द के सीधे अर्थ को व्यक्त करता है।
theological_decisions:
- issue: पौलुस की देने की अपील में ἰσότης का अर्थ
  choice: ज़रूरतों की पारस्परिक पूर्ति में बराबरी
  alternative: निष्पक्षता या न्यायसंगत संतुलन
  rationale: संदर्भ विश्वासियों के बीच एक-दूसरे की कमी पूरी करने का है, न कि सबके पास बिल्कुल समान संपत्ति होने का। मुख्य पाठ मूल शब्द का सीधा अर्थ रखता है और पाद-टिप्पणी उसका प्रसंगगत भाव स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भरपूरी’ और ‘कमी’ की पुनरावृत्ति मूल यूनानी की पारस्परिक तथा संतुलित संरचना को सुरक्षित रखती है। पाद-टिप्पणी का चिह्न अर्थगत रूप से ‘बराबरी’ के साथ लगाया गया है।
