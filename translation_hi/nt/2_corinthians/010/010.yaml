source:
  edition: SBLGNT
  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: hi
  text: क्योंकि वे कहते हैं,[a] “उसकी चिट्ठियाँ तो वज़नदार और शक्तिशाली हैं, पर उसकी शारीरिक उपस्थिति दुर्बल है और उसकी वाणी को तुच्छ समझा जाता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि वह कहता है, ‘चिट्ठियाँ तो वज़नदार और शक्तिशाली हैं ...।’” यूनानी में क्रिया एकवचन है (“वह कहता है”), पर यहाँ वह उद्धरण प्रस्तुत करने वाला सूत्र हो सकती है; संदर्भ में यह पौलुस के आलोचकों की राय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि वे कहते हैं’ स्वाभाविक है।
- source_word: ἐπιστολαὶ
  choice: चिट्ठियाँ
  rationale: यह सामान्य लिखित पत्राचार को दर्शाता है; ‘चिट्ठियाँ’ आधुनिक पाठक के लिए सहज है और अनावश्यक धर्मशास्त्रीय शैली से बचता है।
- source_word: μέν ... δὲ
  choice: तो ... पर
  rationale: यह विरोध प्रकट करने वाली युग्मित संरचना है, जिसे हिन्दी में स्वाभाविक रूप से ‘तो ... पर’ से व्यक्त किया गया है।
- source_word: φησίν
  choice: वे कहते हैं
  rationale: यूनानी रूप व्याकरणतः एकवचन है, पर यहाँ यह आलोचकों की प्रतिनिधिक या उद्धरणसूचक टिप्पणी के रूप में प्रयुक्त हो सकता है; संदर्भ में बहुवचन हिन्दी अधिक स्वाभाविक है, जबकि एकवचन विकल्प पादटिप्पणी में रखा गया है।
- source_word: βαρεῖαι
  choice: प्रभावशाली
  rationale: मूल अर्थ ‘भारी/वज़नी’ है, पर पत्रों के संदर्भ में इसका आशय गंभीर प्रभाव डालने वाला है; ‘प्रभावशाली’ आधुनिक हिन्दी में उस अलंकारिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἰσχυραί
  choice: सामर्थी
  rationale: यह पत्रों की शक्ति और असर को सीधे व्यक्त करता है तथा ‘प्रभावशाली’ के साथ उपयुक्त युग्म बनाता है।
- source_word: παρουσία τοῦ σώματος
  choice: सामने आने पर उसका शरीर ... दिखता है
  rationale: यह पौलुस की व्यक्तिगत, शारीरिक उपस्थिति को उसकी चिट्ठियों से विपरीत रखता है; हिन्दी में शाब्दिक ‘शरीर की उपस्थिति’ की अपेक्षा यह अधिक स्वाभाविक है।
- source_word: ἀσθενής
  choice: दुर्बल
  rationale: यह आलोचकों के कथन की अस्पष्टता बनाए रखता है और यह निर्धारित नहीं करता कि दुर्बलता वास्तविक शक्ति, रूप-रंग या प्रभाव में थी।
- source_word: λόγος
  choice: बोलने की शैली
  rationale: चिट्ठियों और व्यक्तिगत उपस्थिति के विरोध में यह मौखिक अभिव्यक्ति या भाषण को सूचित करता है; ‘बोलने की शैली’ हिन्दी में संदर्भ स्पष्ट करती है।
- source_word: ἐξουθενημένος
  choice: तुच्छ समझी जाती है
  rationale: कृदंत दूसरों द्वारा तिरस्कार या नगण्य समझे जाने का भाव देता है; यह अनुवाद आलोचकों के मूल्यांकन को व्यक्त करता है, न कि भाषण की अंतर्निहित निकृष्टता को।
theological_decisions:
- issue: पौलुस की आलोचना को कथाकार की स्वीकृति न बनाना
  choice: आलोचना को ‘वे कहते हैं’ के अंतर्गत उद्धृत मत के रूप में प्रस्तुत किया गया है।
  alternative: ‘वह कहता है’ या ‘कहा जाता है’
  rationale: संदर्भ में ये पौलुस के आलोचकों के शब्द हैं, पौलुस की वास्तविक योग्यता पर कथाकार का निर्णय नहीं।
- issue: ἀσθενής की कमजोरी का स्वरूप
  choice: ‘दुर्बल दिखता है’ कहकर आलोचकों की धारणा व्यक्त की गई है, बिना कमजोरी की प्रकृति निश्चित किए।
  alternative: ‘प्रभावहीन है’ या ‘उसका व्यक्तित्व कमजोर है’
  rationale: वैकल्पिक अनुवाद अर्थ को शारीरिक रूप, व्यक्तित्व या वक्तृत्व-प्रभाव तक सीमित कर सकते हैं, जबकि यूनानी पाठ अधिक खुला है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। उद्धरण में आलोचकों का तिरस्कारपूर्ण स्वर बना रहता है, पर अनुवाद स्वयं उनकी आलोचना का समर्थन नहीं करता।
