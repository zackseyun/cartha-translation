id: 2CO.10.1
reference: 2 Corinthians 10:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: hi
  text: मैं स्वयं, पौलुस, मसीह की नम्रता और कोमलता के द्वारा तुमसे विनती करता हूँ—मैं, जो तुम्हारे बीच उपस्थित होने पर नम्र हूँ, पर अनुपस्थित होने पर तुम्हारे प्रति साहसी हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: और मैं, पौलुस, स्वयं
  rationale: αὐτός और ἐγώ के संयुक्त बल को ‘मैं... स्वयं’ से रखा गया है। δέ को पद के आरंभ में हल्के संक्रमणसूचक ‘और’ के रूप में व्यक्त किया गया है; इसे कालवाचक ‘अब’ नहीं बनाया गया।
- source_word: παρακαλῶ ὑμᾶς
  choice: तुमसे विनती करता हूँ
  rationale: यहाँ क्रिया एक व्यक्तिगत और गंभीर अनुरोध व्यक्त करती है; ‘विनती’ आदेशात्मक ‘उपदेश’ की अपेक्षा उसके संबंधपरक स्वर को बेहतर रखती है।
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: नम्रता और कोमलता के द्वारा
  rationale: διά + संबंधकारक को माध्यम अथवा आधार के रूप में ‘के द्वारा’ से व्यक्त किया गया है। πραΰτης के लिए ‘नम्रता’ और ἐπιείκεια के लिए ‘कोमलता’ स्वाभाविक हिंदी में अलग लेकिन निकट गुणों को रखते हैं।
- source_word: τοῦ Χριστοῦ
  choice: मसीह की
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; हिंदी में अर्थवाही और प्रचलित उपाधि ‘मसीह’ उपयुक्त है।
- source_word: κατὰ πρόσωπον
  choice: आमने-सामने
  rationale: शाब्दिक मुख-संबंधी मुहावरा यहाँ व्यक्तिगत उपस्थिति का अर्थ देता है और आगे के ‘अनुपस्थित’ से स्पष्ट विरोध बनाता है।
- source_word: ταπεινὸς
  choice: दीन
  rationale: ‘दीन’ नीचता/लघुता का भाव बनाए रखता है और यह तय नहीं करता कि पौलुस स्वयं को नम्र बता रहा है या अपने विरोधियों के ताने को दोहरा रहा है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: यह कुरिन्थियों के मध्य पौलुस की व्यक्तिगत उपस्थिति दर्शाता है।
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: पर अनुपस्थित होने पर तुम्हारे प्रति साहसी हूँ
  rationale: ἀπών को परिस्थितिजन्य ‘अनुपस्थित होने पर’, θαρρῶ को ‘साहसी’ और εἰς ὑμᾶς को व्यापक दिशात्मक ‘तुम्हारे प्रति’ दिया गया है, ताकि अनावश्यक शत्रुता न जोड़ी जाए।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / क्राइस्ट
  rationale: यहाँ शब्द उपाधि है, इसलिए उसके मसीहाई अर्थ को व्यक्त करने वाला हिंदी रूप चुना गया है।
- issue: पौलुस के आत्म-वर्णन का संभावित व्यंग्य
  choice: ‘दीन’ रखकर संदिग्ध/विडंबनापूर्ण स्वर सुरक्षित रखना
  alternative: ‘नम्र’ या अधिक व्याख्यात्मक ‘डरपोक’
  rationale: यूनानी पाठ स्पष्ट उद्धरण-चिह्न नहीं देता। संभव है कि पौलुस विरोधियों की धारणा दोहरा रहा हो; मुख्य पाठ उस प्रश्न का निर्णय नहीं करता।
- issue: εἰς ὑμᾶς में भाव की दिशा
  choice: तुम्हारे प्रति
  alternative: तुम्हारे विरुद्ध
  rationale: ‘विरुद्ध’ शत्रुतापूर्ण अर्थ को आवश्यकता से अधिक निश्चित कर देगा; ‘प्रति’ मूल की व्यापक दिशात्मकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली। ‘तुम’ बहुवचन समुदाय के लिए है। वाक्य की तीखी व्यक्तिगत अपील और उपस्थिति/अनुपस्थिति का विरोध सुरक्षित रखा गया है।
