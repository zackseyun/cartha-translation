  to: मैं स्वयं, पौलुस, मसीह की नम्रता और कोमलता के द्वारा तुमसे विनती करता हूँ—मैं, जो तुम्हारे बीच उपस्थित होने पर नम्र हूँ, पर अनुपस्थित होने पर तुम्हारे प्रति साहसी हूँ।
  rationale: The revision improves Hindi idiom and restores a clear, natural contrast between Paul's personal presence and absence. It preserves the emphatic “मैं स्वयं, पौलुस,” retains “मसीह” as the title rendering of Χριστός, and leaves the potentially ironic sense of ταπεινός unresolved in the main text.
