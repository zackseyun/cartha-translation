base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: hi
  text: क्योंकि हम अपने आपको उन लोगों में गिनने या उनसे अपनी तुलना करने का साहस नहीं करते, जो अपनी ही प्रशंसा करते हैं।[a] पर वे स्वयं अपने ही को मापदंड बनाकर अपने आपको मापते और अपने ही से अपनी तुलना करते हैं;[b] वे नहीं समझते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने आपको उन लोगों में गिनने” का अनुवाद “अपने आपको उन लोगों की श्रेणी में रखने” भी हो सकता है। यूनानी क्रिया में स्वयं को दूसरों के समान वर्ग में रखने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने आप में अपने आपको मापते और अपने आपको अपने आप से तुलना करते हैं।” आशय यह है कि वे स्वयं को ही अपना मापदंड बनाते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: हम यह साहस नहीं करते
  rationale: यह वाक्यांश किसी काम को करने का दुस्साहस न करने या ऐसा करने की धृष्टता से इनकार करने का भाव रखता है और पौलुस के व्यंग्यपूर्ण स्वर को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐγκρῖναι
  choice: अपने-आप की गिनती ... में करें
  rationale: यहाँ क्रिया का अर्थ साधारण न्याय करना नहीं, बल्कि स्वयं को किसी वर्ग या समूह में रखना है। यह मुहावरा आधुनिक हिन्दी में उस सामाजिक श्रेणीकरण को स्पष्ट करता है।
- source_word: συγκρῖναι / συγκρίνοντες
  choice: तुलना करें / तुलना करते हैं
  rationale: दोनों प्रयोगों में एक ही शब्द रखकर यूनानी पाठ की आलंकारिक पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων
  choice: अपने-आप की गिनती उन लोगों में करें ... जो अपनी ही प्रशंसा करते हैं
  rationale: सन्दर्भ में συνιστάνω का अर्थ स्वयं को सराहनीय ठहराना या अपनी प्रशंसा करना है; आत्मवाचक रचना को स्पष्ट रखा गया है।
- source_word: ἐν ἑαυτοῖς
  choice: अपने ही मापदंड से
  rationale: शाब्दिक रूप 'अपने में' अस्पष्ट हिन्दी देता। प्रसंग यह संकेत करता है कि वे स्वयं को ही मूल्यांकन का मानदंड बनाते हैं; इस अर्थ को मुख्य पाठ में स्वाभाविक ढंग से व्यक्त किया गया है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: μετροῦντες
  choice: मापते
  rationale: मूल पाठ के मापने वाले रूपक और उसके आलोचनात्मक बल को सुरक्षित रखा गया है।
- source_word: οὐ συνιᾶσιν
  choice: वे समझ नहीं रखते
  rationale: यह अभिव्यक्ति समझ या सूझ के अभाव को बताती है और किसी अनकहे कर्म को अनावश्यक रूप से निश्चित नहीं करती।
