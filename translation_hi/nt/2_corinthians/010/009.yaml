translation:
  language: hi
  text: ताकि ऐसा न लगे कि मैं पत्रों के द्वारा तुम्हें डरा रहा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μὴ
  choice: ताकि ... न
  rationale: ἵνα उद्देश्य या अपेक्षित परिणाम का संबंध दिखाता है और μή निषेध व्यक्त करता है; आधुनिक हिन्दी में ‘ताकि ... न’ दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δόξω
  choice: ऐसा न लगे
  rationale: यहाँ δοκέω का अर्थ ‘सोचना’ नहीं, बल्कि ‘प्रतीत होना/लगना’ है। प्रथम पुरुष का आशय आगे ‘मैं’ से स्पष्ट होता है।
- source_word: ὡς ἂν
  choice: कि
  rationale: ἐκφοβεῖν के साथ यह कथित आभास को कुछ नरम ढंग से प्रस्तुत करता है; हिन्दी में ‘ऐसा लगे कि’ इस अर्थ को स्वाभाविक रूप से वहन करता है।
- source_word: ἐκφοβεῖν
  choice: डराने की कोशिश कर रहा हूँ
  rationale: क्रिया का अर्थ भयभीत करना या धमकाकर डराना है। ‘कोशिश कर रहा हूँ’ मूल के infinitival भाव को ‘ऐसा लगे कि’ के अधीन सहज हिन्दी में व्यक्त करता है, बिना परिणाम को निश्चित बताए।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: यह बहुवचन द्वितीय पुरुष कर्म है; पत्र की मण्डली-संबंधी शैली में ‘तुम्हें’ स्वाभाविक और स्पष्ट है।
- source_word: διὰ τῶν ἐπιστολῶν
  choice: पत्रों के द्वारा
  rationale: διά के साथ संबंधकारक साधन या माध्यम बताता है। यूनानी में ‘पत्रों’ के साथ निश्चित लेख है, पर स्वामित्व-सूचक ‘मेरे’ स्पष्ट रूप से नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
