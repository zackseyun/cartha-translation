  rationale: संदर्भ में भावी, अपेक्षित परिस्थिति को व्यक्त करने के लिए ‘जब’ स्वाभाविक है; यूनानी में घटना की पूर्ति पर निर्भरता का भाव बना रहता है।
- source_word: πληρωθῇ
  choice: पूरी हो जाएगी
  rationale: निष्क्रिय संभावनार्थक रूप यहाँ आज्ञाकारिता के पूर्णता तक पहुँचने को दर्शाता है।
- source_word: ὑμῶν ἡ ὑπακοή
  choice: तुम्हारी आज्ञाकारिता
  rationale: यह सीधा और स्वाभाविक संबंधवाचक अनुवाद है।
theological_decisions:
- issue: पौलुस की प्रस्तावित कार्रवाई का स्वरूप
  choice: अवज्ञा को अनुशासनात्मक रूप से दण्ड देना
  alternative: अवज्ञा का बदला लेना अथवा उसके लिए न्याय चुकाना
  rationale: निकटवर्ती संदर्भ प्रेरितिक अधिकार और विरोध के सुधार से जुड़ा है। फिर भी ἐκδικῆσαι में न्याय दिलाने या बदला लेने की शाब्दिक संभावना है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: आज्ञाकारिता की पूर्णता
  choice: समुदाय की आज्ञाकारिता का पूरी हो जाना
  alternative: आज्ञाकारिता का पूरा किया जाना अथवा अपनी पूर्ण मात्रा तक पहुँचना
  rationale: मूल निष्क्रिय क्रिया यह स्पष्ट नहीं करती कि पूर्णता किस अभिकर्ता से आती है; हिन्दी मुख्य पाठ इस अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
