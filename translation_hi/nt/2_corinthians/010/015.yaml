translation:
  language: hi
  text: हम सीमा से बाहर जाकर दूसरों के परिश्रम के विषय में घमंड नहीं करते, बल्कि यह आशा रखते हैं कि जैसे-जैसे आपका विश्वास बढ़ रहा है, हमारे निर्धारित कार्यक्षेत्र के अनुसार आपके बीच हमारा बहुतायत से विस्तार हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कि हम आपके बीच अपने निर्धारित माप के अनुसार बहुतायत के लिए बढ़ाए जाएँ।” “निर्धारित कार्यक्षेत्र” का अनुवाद “ठहराया हुआ माप,” “सीमा,” या “नियम” भी किया जा सकता है। प्रसंग में इसका आशय पौलुस और उसके सहकर्मियों की सेवा के विस्तार से समझा जा सकता है।
    reason: यूनानी μεγαλυνθῆναι, κανών, और εἰς περισσείαν के वैकल्पिक अर्थों तथा मूल के कर्मवाच्य रूपक को सुरक्षित रखना।
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: हम सीमा से बाहर जाकर ... घमण्ड नहीं करते
  rationale: यह यूनानी वाक्यांश उचित सीमा से परे घमण्ड करने का निषेध करता है। ‘सीमा से बाहर’ माप और निर्धारित हद की उपमा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: दूसरों की मेहनत पर
  rationale: ἀλλοτρίοις दूसरों से संबंधित और κόποις कठिन परिश्रम को दर्शाता है; आशय दूसरों के किए काम का श्रेय लेने से है।
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν
  choice: जैसे-जैसे आपका विश्वास बढ़ेगा
  rationale: जननात्मक निरपेक्ष रचना को सहज हिन्दी में काल-संबंधी वाक्यांश से व्यक्त किया गया है; πίστις के लिए ‘विश्वास’ उपयुक्त है।
- source_word: ἐν ὑμῖν μεγαλυνθῆναι
  choice: आपके बीच हमारे कार्य का विस्तार ... होगा
  rationale: ἐν ὑμῖν को μεγαλυνθῆναι से जोड़ा गया है। कर्मवाच्य ‘बड़ा किए जाएँ’ हिन्दी में अस्पष्ट होता; प्रसंग के अनुसार आशय पौलुस के प्रेरितीय कार्य के विस्तार से है, जिसे स्पष्ट लेकिन संयत रूप में व्यक्त किया गया है।
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: हमारे निर्धारित क्षेत्र के अनुसार
  rationale: κανών यहाँ नियम-पुस्तक या बाद का ‘कैनन’ नहीं, बल्कि नापा या सौंपा हुआ कार्यक्षेत्र दर्शाता है। ‘निर्धारित क्षेत्र’ निकटवर्ती प्रसंग की सीमा-संबंधी भाषा को सुरक्षित रखता है।
- source_word: εἰς περισσείαν
  choice: बहुत अधिक
  rationale: यह वाक्यांश बड़ी मात्रा या आगे तक विस्तार की दिशा बताता है। ‘बहुत अधिक’ हिन्दी में स्वाभाविक है और विस्तार की प्रचुरता व्यक्त करता है।
theological_decisions:
- issue: μεγαλυνθῆναι का आशय
  choice: पौलुस और उसके सहकर्मियों के कार्यक्षेत्र का विस्तार
  alternative: कुरिन्थियों द्वारा उनका अधिक सम्मान किया जाना या उनकी प्रतिष्ठा बढ़ना
  rationale: पद 13–16 का प्रसंग परमेश्वर द्वारा निर्धारित क्षेत्र, दूसरों के परिश्रम का श्रेय न लेने और आगे सुसमाचार सुनाने पर केंद्रित है। फिर भी क्रिया की शाब्दिक व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: κανών का अर्थ
  choice: निर्धारित क्षेत्र
  alternative: नियम, माप या मानदण्ड
  rationale: इस प्रसंग में शब्द प्रेरितीय सेवा की मापी हुई सीमा या कार्यभूमि को सूचित करता है; ‘नियम’ कहने से अर्थ भटक सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मेहनत’, ‘घमण्ड’, ‘विश्वास’ और ‘निर्धारित क्षेत्र’ जैसे प्रचलित शब्द चुने गए हैं। मूल के माप, सीमा और विस्तार के पारस्परिक रूपक को यथासम्भव बनाए रखा गया है।
