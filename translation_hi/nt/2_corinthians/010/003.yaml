translation:
  language: hi
  text: क्योंकि देह में रहते हुए भी हम देह के अनुसार युद्ध नहीं करते—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: शरीर में
  rationale: पहला प्रयोग सामान्य देहधारी मानवीय जीवन को दर्शाता है। हिन्दी में शाब्दिक ‘देह में चलते हैं’ की अपेक्षा ‘शरीर में जीवन बिताते हैं’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है और इसे ‘पापी स्वभाव’ मानकर अधिक व्याख्यायित नहीं करता।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में तर्क-संबंध स्पष्ट और स्वाभाविक रखता है।
- source_word: περιπατοῦντες
  choice: यद्यपि ... जीवन बिताते हैं
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘चलना’ है, पर पौलुस के प्रयोग में यह प्रायः जीवन जीने को सूचित करती है। कृदन्त को विरोधसूचक रूप में समझना अगले खंड के साथ उसके संबंध के अनुकूल है।
- source_word: οὐ κατὰ σάρκα
  choice: शरीर के अनुसार ... नहीं
  rationale: κατά यहाँ मानदंड या ढंग सूचित करता है। ‘शरीर के अनुसार’ σάρξ की पुनरावृत्ति बनाए रखता है और ‘केवल मानवीय साधनों/मानदंडों से’ जैसे अधिक स्पष्ट व्याख्यात्मक अर्थ को मुख्य पाठ में निश्चित नहीं करता।
- source_word: στρατευόμεθα
  choice: युद्ध नहीं लड़ते
  rationale: संदर्भ में प्रेरिताई संघर्ष के लिए सैनिक रूपक है। ‘युद्ध लड़ना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: σάρξ के दोनों प्रयोगों का अनुवाद
  choice: दोनों स्थानों पर ‘शरीर’ रखकर मूल की पुनरावृत्ति और अर्थगत तनाव सुरक्षित रखना।
  alternative: ‘शरीर में जीवन बिताते हैं, पर केवल मानवीय मानदंडों के अनुसार युद्ध नहीं लड़ते’ अथवा ‘मानवीय दुर्बलता में ... सांसारिक रीति से नहीं’।
  rationale: पहला प्रयोग देहधारी मानवीय अस्तित्व की ओर संकेत करता है, जबकि दूसरा मानवीय/सांसारिक ढंग या मानदंड का भाव रख सकता है। दोनों को ‘शरीर’ से व्यक्त करने पर पाठ किसी एक संकीर्ण नैतिक या सिद्धान्तगत अर्थ—जैसे ‘पापी स्वभाव’—में बंद नहीं होता; पाद-टिप्पणी स्वाभाविक व्याख्यात्मक विकल्प देती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘जीवन बिताते हैं’ से περιπατέω का मुहावरेदार भाव दिया गया है, जबकि ‘शरीर के अनुसार’ मूल की जानबूझकर की गई σάρξ-पुनरावृत्ति तथा उसकी अस्पष्टता को बनाए रखता है। पद के अंत का दीर्घ विराम अगले पद से जारी सैन्य रूपक को सूचित करता है।
