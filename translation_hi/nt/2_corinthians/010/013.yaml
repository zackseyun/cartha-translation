  text: ἡμεῖς δὲ ⸀οὐκ εἰς τὰ ἄμετρα καυχησόμεθα, ἀλλὰ κατὰ τὸ μέτρον τοῦ κανόνος οὗ ἐμέρισεν ἡμῖν ὁ θεὸς μέτρου, ἐφικέσθαι ἄχρι καὶ ὑμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/013.yaml
  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: hi
  text: पर हम उचित सीमा से आगे बढ़कर डींग नहीं मारेंगे, बल्कि उस कार्य-क्षेत्र के माप के अनुसार जिसे परमेश्वर ने हमारे लिए निर्धारित किया है—ऐसे माप के अनुसार जो आप लोगों तक भी पहुँचता है—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄμετρα
  choice: अपनी सीमा से बाहर जाकर
  rationale: यह पदबंध उचित या निर्धारित हद से आगे बढ़ने का भाव देता है। यह चुनाव माप और सीमा के रूपक को बनाए रखते हुए स्वाभाविक हिन्दी प्रस्तुत करता है।
- source_word: καυχησόμεθα
  choice: घमंड करेंगे
  rationale: विवादात्मक संदर्भ में यह अपने काम या अधिकार का श्रेय लेने और उसकी डींग मारने को व्यक्त करता है; ‘घमंड करना’ इसका सीधा और प्रचलित हिन्दी रूप है।
- source_word: κατὰ τὸ μέτρον
  choice: सीमा के अनुसार
  rationale: यह सौंपे गए माप या हद के अनुरूप रहने का भाव व्यक्त करता है और पद में चल रहे सीमा-संबंधी रूपक को बनाए रखता है।
- source_word: κανόνος
  choice: कार्य-क्षेत्र
  rationale: यहाँ शब्द मुख्यतः परमेश्वर द्वारा सौंपे गए सेवाकार्य के क्षेत्र या उसकी निर्धारित परिधि को दर्शाता है, न कि केवल किसी नैतिक नियम को। संभावित अर्थों की व्यापकता पाद-टिप्पणी में दी गई है।
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς
  choice: जिसे परमेश्वर ने हमें सौंपा है
  rationale: μερίζω यहाँ किसी हिस्से या कार्य-क्षेत्र को बाँटकर निर्धारित करने का भाव देता है। ‘सौंपा है’ सहज हिन्दी में दैवी नियुक्ति को स्पष्ट करता है।
- source_word: μέτρου
  choice: यह सीमा
  rationale: दूसरा μέτρον पहले बताए गए माप या सीमा को स्पष्ट करता है। ‘यह सीमा’ पुनरुक्ति को अर्थपूर्ण और हिन्दी को स्वाभाविक रखता है।
- source_word: ἐφικέσθαι
  choice: पहुँचती है
  rationale: क्रिया सौंपे गए क्षेत्र की पहुँच या विस्तार को व्यक्त करती है।
- source_word: ἄχρι καὶ ὑμῶν
  choice: आप लोगों तक भी
  rationale: ἄχρι विस्तार की अंतिम पहुँच और καί कुरिन्थियों के विशेष समावेश पर बल देता है; ‘तक भी’ दोनों भाव सुरक्षित रखता है।
theological_decisions:
- issue: पौलुस के सेवाकार्य के दावे में κανών का अर्थ
  choice: परमेश्वर द्वारा सौंपा गया कार्य-क्षेत्र, जिसकी सीमा में कुरिन्थुस के विश्वासी भी आते हैं
  alternative: वह नियम या मापदंड जिसके अनुसार पौलुस अपने घमंड को परखता है
  rationale: निकटवर्ती संदर्भ में माप, सीमा और ‘आप लोगों तक भी पहुँचने’ की स्थानिक भाषा प्रमुख है। फिर भी κανών में मापदंड का अर्थ संभव होने के कारण उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण बहुवचन ‘आप लोगों’ रखा गया है। वाक्य को सहज बनाने के लिए निहित ‘घमंड करेंगे’ दोहराया गया है। ‘कार्य-क्षेत्र’ सेवाकार्य की सौंपे गए परिधि को स्पष्ट करता है, जबकि ‘सीमा’ मूल पाठ में बार-बार आने वाले माप और हद के रूपक को बनाए रखती है।
