    text: या “जो स्वयं अपनी सिफ़ारिश करता है ... जिसकी सिफ़ारिश प्रभु करता है।” दोनों स्थानों पर एक ही यूनानी क्रिया आई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: प्रशंसा करता है
  rationale: इस संदर्भ में क्रिया का अर्थ किसी को स्वीकृति के योग्य बताना या उसके पक्ष में प्रमाण देना है। दोनों स्थानों पर एक ही हिन्दी अभिव्यक्ति रखकर यूनानी की पुनरावृत्ति सुरक्षित की गई है।
- source_word: δόκιμος
  choice: खरा ठहरता है
  rationale: यह शब्द जाँच या मूल्यांकन के बाद स्वीकृत और प्रमाणित पाए जाने का भाव देता है। ‘खरा ठहरता है’ उस परीक्षण-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κύριος
  choice: प्रभु
  rationale: शीर्षक को मानक हिन्दी रूप में रखा गया है; पद में निहित संकेत से आगे बढ़कर इसकी पहचान स्पष्ट नहीं की गई।
- source_word: ἑαυτὸν
  choice: अपनी ... स्वयं
  rationale: आत्म-संदर्भ और आत्म-प्रशंसा का बल स्वाभाविक हिन्दी में स्पष्ट करने के लिए यह रचना चुनी गई है।
- source_word: ὃν
  choice: जिसकी
  rationale: 'यह विरोध को सहज हिन्दी में व्यक्त करता है: स्वयं अपनी प्रशंसा करने वाला नहीं, बल्कि वह व्यक्ति जिसकी प्रशंसा प्रभु करता है।'
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के लिए दिए जा रहे स्पष्टीकरण का संबंध स्पष्ट करता है।
theological_decisions:
- issue: ‘प्रभु’ (ὁ κύριος) का संदर्भ
  choice: मुख्य पाठ में केवल ‘प्रभु’
  alternative: ‘प्रभु यीशु’ या ‘परमेश्वर’
  rationale: पौलुस के संदर्भ में यह प्रायः यीशु की ओर संकेत करता है, पर इस पद में केवल κύριος है। अनुवाद उसी अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘खरा ठहरता है’ मूल्यांकन के बाद प्रमाणित होने का भाव रखता है; फुटनोट ‘सिफ़ारिश’ वाला वैकल्पिक अर्थ दिखाता है।
