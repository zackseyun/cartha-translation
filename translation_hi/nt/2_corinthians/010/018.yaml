  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: hi
  text: क्योंकि जो अपनी प्रशंसा स्वयं करता है, वह नहीं, बल्कि जिसकी प्रशंसा प्रभु करता है, वही खरा ठहरता है।[a]
  philosophy: optimal-equivalence
  footnotes:
