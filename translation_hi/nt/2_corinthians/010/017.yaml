translation:
  language: hi
  text: परन्तु जो घमण्ड करता है, वह प्रभु में घमण्ड करे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “जो घमण्ड करता है, वह प्रभु में घमण्ड करे।” सम्भवतः पौलुस यहाँ यिर्मयाह 9:24 (सेप्टुआजिन्ट में 9:23) की ओर संकेत कर रहा है।'
    reason: cross_reference
lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: जो घमण्ड करता है
  rationale: लेख के साथ वर्तमानकालिक कृदन्त यहाँ संज्ञा के रूप में किसी भी ऐसे व्यक्ति को दर्शाता है जो घमण्ड करता है। यह हिन्दी में स्वाभाविक है और यूनानी के प्रतिनिधिक एकवचन को बनाए रखता है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले तर्क के साथ हल्का विरोध दिखाता है—अनुचित आत्म-प्रशंसा के विपरीत उचित घमण्ड।
- source_word: καυχώμενος / καυχάσθω
  choice: घमण्ड करता है / घमण्ड करे
  rationale: दोनों रूपों के लिए एक ही हिन्दी शब्द रखकर यूनानी की अलंकारिक पुनरावृत्ति बचाई गई है। आज्ञार्थक रूप को स्वाभाविक विधिलिंग से व्यक्त किया गया है।
- source_word: ἐν
  choice: में ही
  rationale: καυχάομαι के साथ ἐν घमण्ड के आधार या क्षेत्र को व्यक्त करता है। ‘ही’ प्रभु को घमण्ड का एकमात्र उचित आधार बताने वाले आशय को स्वाभाविक हिन्दी में स्पष्ट करता है, बिना किसी नए विषय को जोड़े।
- source_word: κυρίῳ
  choice: प्रभु
  rationale: κύριος का मानक, गरिमापूर्ण हिन्दी रूप ‘प्रभु’ है। यूनानी पाठ संदर्भ को अधिक स्पष्ट नहीं करता, इसलिए ‘यीशु’ या ‘परमेश्वर’ जोड़कर अर्थ सीमित नहीं किया गया।
theological_decisions:
- issue: शास्त्रीय संकेत के प्रसंग में ‘प्रभु’ का संदर्भ
  choice: प्रभु
  alternative: प्रभु यीशु; परमेश्वर
  rationale: यह कथन यिर्मयाह 9:24 (सेप्टुआजिन्ट में 9:23) की ओर संकेत करता प्रतीत होता है, पर यूनानी में केवल κυρίῳ है। इसलिए अनुवाद पौलुस के प्रयोग में निहित धर्मवैचारिक तनाव को बनाए रखता है और संदर्भ को किसी एक व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक लहजा रखा गया है। ‘घमण्ड’ ने मूल की तीखी अलंकारिक धार और एक ही क्रिया की पुनरावृत्ति को सुरक्षित रखा है; ‘प्रभु’ जानबूझकर अनिर्दिष्ट रखा गया है।
