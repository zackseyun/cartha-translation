source:
  edition: SBLGNT
  text: εἰς τὰ ὑπερέκεινα ὑμῶν εὐαγγελίσασθαι, οὐκ ἐν ἀλλοτρίῳ κανόνι εἰς τὰ ἕτοιμα καυχήσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/016.yaml
  text: to proclaim the good news in the regions beyond you[c][b][a], not to boast in another's sphere about things already prepared.
translation:
  language: hi
  text: ताकि हम तुमसे आगे के क्षेत्रों में शुभ समाचार का प्रचार करें,[a] और किसी दूसरे के कार्यक्षेत्र में जो कुछ पहले से तैयार है उसके विषय में घमण्ड न करें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमसे आगे के देशों में सुसमाचार का प्रचार करें।”
    reason: lexical_alternative
  - marker: b
    text: “कार्यक्षेत्र” यूनानी κανών का अनुवाद है। यहाँ इसका अर्थ किसी को सौंपा गया सेवा का क्षेत्र या दायरा है, न कि नैतिक “नियम” या बाद के अर्थ में “कैनन।” “जो कुछ पहले से तैयार है” प्रसंग में उस काम की ओर भी संकेत कर सकता है जो पहले ही किया जा चुका हो।
    reason: cultural_note
lexical_decisions:
- source_word: ὑπερέκεινα ὑμῶν
  choice: तुम्हारे पार के क्षेत्रों में
  rationale: यह वाक्यांश कुरिन्थियों से आगे स्थित भौगोलिक क्षेत्रों को दर्शाता है। यह अनुवाद संबंधपरक अर्थ को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: εὐαγγελίσασθαι
  choice: शुभ समाचार सुनाएँ
  rationale: यह पौलुस के मिशनरी उद्देश्य को व्यक्त करता है और क्रियात्मक अर्थ को सहज, गैर-पारिभाषिक हिन्दी में रखता है।
- source_word: ἀλλοτρίῳ κανόνι
  choice: किसी दूसरे के कार्यक्षेत्र में
  rationale: यहाँ κανών नैतिक नियम या बाद का ‘कैनन’ नहीं, बल्कि किसी दूसरे को मिला कार्य-क्षेत्र अथवा सेवकाई का दायरा है।
- source_word: τὰ ἕτοιμα
  choice: पहले से तैयार बातें
  rationale: यूनानी में विशेषण संज्ञा के रूप में प्रयुक्त है और शाब्दिक रूप से ‘तैयार चीज़ों/बातों’ की ओर संकेत करता है। ‘बातें’ मूल की अस्पष्टता को ‘काम’ जोड़कर अनावश्यक रूप से सीमित नहीं करती।
- source_word: καυχήσασθαι
  choice: घमण्ड करें
  rationale: यह आसपास के पदों में बार-बार आने वाली पौलुस की शब्दावली से संबंध बनाए रखता है और कथन की तीक्ष्णता को नरम नहीं करता।
theological_decisions:
- issue: सेवकाई के संदर्भ में κανών का अर्थ
  choice: निर्धारित कार्यक्षेत्र या सेवकाई का दायरा
  alternative: नियम, मापदण्ड, अथवा धर्मग्रन्थों का कैनन
  rationale: पद 13–15 की निकटवर्ती चर्चा सीमाओं, नाप और सौंपे गए श्रम-क्षेत्र की है; इसलिए यहाँ स्थानिक/सेवकाई-संबंधी अर्थ उपयुक्त है।
- issue: τὰ ἕτοιμα का संकेत
  choice: पहले से तैयार बातें, जो प्रसंग में दूसरे के किए या तैयार किए काम की ओर संकेत कर सकती हैं
  alternative: स्पष्ट रूप से ‘दूसरों द्वारा पूरा किया गया काम’
  rationale: प्रसंग दूसरे के क्षेत्र में हुए कार्य का संकेत देता है, पर यूनानी अभिव्यक्ति स्वयं संक्षिप्त और अस्पष्ट है; इसलिए मुख्य पाठ में व्याख्या को पूरी तरह निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘शुभ समाचार’ सामान्य पाठक के लिए स्पष्ट है; विकल्प के रूप में अधिक परम्परागत ‘सुसमाचार’ पादटिप्पणी में दिया गया है। मुख्य पाठ यूनानी की संक्षिप्तता और τὰ ἕτοιμα की वास्तविक अस्पष्टता को बनाए रखता है।
