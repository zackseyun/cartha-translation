  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: hi
  text: तुम लोग बाहरी बातों को देखते हो।[a] यदि किसी को अपने विषय में यह भरोसा है कि वह मसीह का है, तो वह अपने मन में इस बात पर फिर विचार करे कि जैसे वह मसीह का है, वैसे ही हम भी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “तुम लोग उन बातों को देखते हो जो सामने दिखाई देती हैं”; संभवतः, “जो तुम्हारे सामने है, उसे देखो।”
    reason: βλέπετε को विधानवाचक या आज्ञार्थक समझा जा सकता है, और Τὰ κατὰ πρόσωπον का अर्थ बाहरी/सतही बातें अथवा सामने उपस्थित बातें हो सकता है।
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: बाहरी रूप
  rationale: यह वाक्यांश यहाँ सामने दिखाई देनेवाली या बाहरी बातों के आधार पर मूल्यांकन करने का भाव देता है; ‘बाहरी रूप’ स्वाभाविक और स्पष्ट हिंदी है।
- source_word: βλέπετε
  choice: तुम लोग ... देखते हो
  rationale: रूप विधानवाचक और आज्ञार्थक दोनों समझा जा सकता है; प्रसंग में पौलुस की फटकार होने के कारण इसे विधानवाचक लिया गया है।
- source_word: πέποιθεν ἑαυτῷ
  choice: अपने विषय में यह भरोसा है
  rationale: पूर्णकालिक क्रिया स्थिर आत्मविश्वास बताती है, और ἑαυτῷ उस भरोसे का स्वयं से संबंधित होना व्यक्त करता है।
- source_word: Χριστοῦ εἶναι
  choice: मसीह का है
  rationale: संबंधकारक के साथ εἶναι स्वामित्व, संबंध या निष्ठा का भाव देता है; ‘मसीह का है’ मूल की संक्षिप्तता और अर्थगत व्यापकता बनाए रखता है।
- source_word: λογιζέσθω πάλιν ἐφ’ ἑαυτοῦ
  choice: अपने मन में इस बात पर फिर विचार करे
  rationale: आज्ञार्थक क्रिया पुनर्विचार की माँग करती है और ἐφ’ ἑαυτοῦ को आंतरिक आत्मचिंतन के रूप में व्यक्त किया गया है।
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: जैसे वह मसीह का है, वैसे ही हम भी हैं
  rationale: तुलनात्मक रचना पौलुस और दूसरे दावेदार के मसीह से समान संबंध का दावा करती है; हिंदी में अंतिम लोप को ‘हैं’ से स्वाभाविक रूप दिया गया है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह का
  alternative: ख्रीस्त का / मसीह से संबंध रखता है
  rationale: Χριστός यहाँ उपाधि के रूप में है। ‘मसीह’ आधुनिक हिंदी बाइबलीय प्रयोग में स्वाभाविक है, जबकि ‘का’ संबंध, स्वामित्व और निष्ठा की मूल अस्पष्टता को ‘संबंध रखता है’ की तुलना में बेहतर बचाए रखता है।
- issue: पौलुस के दावे की प्रकृति
  choice: जैसे वह मसीह का है, वैसे ही हम भी हैं
  alternative: यदि वह सचमुच मसीह का है, तो हम भी हैं
  rationale: मूल पाठ दूसरे व्यक्ति के दावे को सीधे शर्त या संदेह में नहीं बदलता; इसलिए समानांतर कथन की तनावपूर्ण सीधाई सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में सीधे, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप का प्रयोग किया गया है। बहुवचन ‘तुम लोग’ यूनानी दूसरे पुरुष बहुवचन को स्पष्ट करता है। मुख्य पाठ में विधानवाचक अर्थ चुना गया है, जबकि वैकल्पिक आज्ञार्थक अर्थ पादटिप्पणी में सुरक्षित है।
