  text: καὶ πᾶν ὕψωμα ἐπαιρόμενον κατὰ τῆς γνώσεως τοῦ θεοῦ, καὶ αἰχμαλωτίζοντες πᾶν νόημα εἰς τὴν ὑπακοὴν τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/005.yaml
  text: and every lofty thing raised up against the knowledge of God[a], and taking every thought captive into obedience to Messiah[b],
translation:
  language: hi
  text: और हर ऊँची वस्तु को, जो परमेश्वर के ज्ञान के विरुद्ध उठाई जाती है[a], हम ढा देते हैं; और हर विचार को बंदी बनाकर मसीह[b] की आज्ञाकारिता में ले आते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हर ऊँची चीज़’ अथवा ‘हर घमंडी दावा’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का अर्थ ‘अभिषिक्त जन’ है; परंपरागत रूप से ‘ख्रीष्ट’ या ‘क्राइस्ट’।
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν ὕψωμα
  choice: हर ऊँची वस्तु
  rationale: यह पदबंध किसी ऊँची या ऊँचा उठी हुई चीज़ का रूपक है। ‘ऊँची वस्तु’ इस व्यापक चित्र को बनाए रखता है और इसे केवल ‘घमंड’ या ‘दावा’ तक सीमित नहीं करता।
- source_word: ἐπαιρόμενον
  choice: उठाई जाती है
  rationale: यह अनुवाद कृदंत के निष्क्रिय/परिणामसूचक रूप को बनाए रखता है और अनावश्यक रूप से ‘अपने आपको ऊँचा करती है’ का आत्मवाचक भाव नहीं जोड़ता।
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: परमेश्वर के ज्ञान के विरुद्ध
  rationale: यह यूनानी की संक्षिप्त संबंधवाचक रचना को सुरक्षित रखता है; इसका अर्थ परमेश्वर का ज्ञान या परमेश्वर को जानना—दोनों से संबंधित हो सकता है।
- source_word: αἰχμαλωτίζοντες
  choice: बंदी बनाकर
  rationale: यह युद्ध में किसी को बंदी बनाने की सजीव सैन्य उपमा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πᾶν νόημα
  choice: हर विचार
  rationale: νόημα विचार, अभिप्राय या मनोभाव का अर्थ दे सकता है; यहाँ ‘हर विचार’ सबसे स्वाभाविक है और πᾶν के वितरणात्मक बल को व्यक्त करता है।
- source_word: εἰς τὴν ὑπακοὴν
  choice: आज्ञाकारिता में
  rationale: ‘में ले आते हैं’ के साथ यह किसी परिणामी दशा की ओर गति को व्यक्त करता है, जो εἰς के दिशात्मक बल के अनुकूल है।
- source_word: τοῦ Χριστοῦ
  choice: मसीह की
  rationale: Χριστός यहाँ यीशु की पदवी के रूप में प्रयुक्त है; ‘मसीह’ हिन्दी में इस अभिषिक्त पदवी का प्रचलित और अर्थपूर्ण रूप है।
theological_decisions:
- issue: πᾶν ὕψωμα ἐπαιρόμενον में विरोध की प्रकृति
  choice: परमेश्वर के ज्ञान के विरुद्ध उठाई गई हर ऊँची वस्तु
  alternative: हर घमंडी दावा जो परमेश्वर के ज्ञान के विरुद्ध उठता है
  rationale: यूनानी रूपक व्यापक है। मुख्य पाठ उसे केवल बौद्धिक दावे या मनोवैज्ञानिक घमंड तक सीमित नहीं करता।
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यहाँ शब्द पदवी के रूप में स्वाभाविक है; ‘मसीह’ उसके अभिषिक्त राजा होने का अर्थ सुरक्षित रखता है।
- issue: τοῦ Χριστοῦ के संबंध का अर्थ
  choice: मसीह की आज्ञाकारिता
  alternative: मसीह के प्रति आज्ञाकारिता
  rationale: यूनानी संबंधवाचक रचना यह स्पष्ट नहीं करती कि आज्ञाकारिता मसीह के प्रति है या मसीह से संबंधित/उसके द्वारा प्रतिरूपित है। मुख्य पाठ ‘मसीह की’ कहकर इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। पद पिछले वाक्य से जुड़ा है; हिन्दी में अर्थ स्पष्ट रखने के लिए पिछले पद से निहित मुख्य क्रिया ‘हम ढा देते हैं’ दोहराई गई है। सैन्य रूपक ‘बंदी बनाकर’ में सुरक्षित है, जबकि ‘मसीह की आज्ञाकारिता’ यूनानी संबंध की अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
