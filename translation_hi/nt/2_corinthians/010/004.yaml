  text: τὰ γὰρ ὅπλα τῆς στρατείας ἡμῶν οὐ σαρκικὰ ἀλλὰ δυνατὰ τῷ θεῷ πρὸς καθαίρεσιν ὀχυρωμάτων— λογισμοὺς καθαιροῦντες
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: hi
  text: क्योंकि हमारे युद्ध के हथियार शरीर के अनुसार नहीं हैं[a], बल्कि परमेश्वर के लिए सामर्थी हैं[b], गढ़ों को ढा देने के लिए—तर्कों को ढाते हुए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शरीर के नहीं”; अथवा, “सांसारिक नहीं।”
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर के सामने सामर्थी”; अथवा, “परमेश्वर के द्वारा सामर्थी” या “ईश्वरीय सामर्थ्य से भरपूर।”
    reason: alternative_reading
  - marker: c
    text: “तर्कों” का अनुवाद “विचार-वितर्कों,” “विचारों” या “कल्पनाओं” के रूप में भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: हथियार
  rationale: यह युद्ध-संबंधी ठोस रूपक को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: στρατείας
  choice: युद्ध
  rationale: सन्दर्भ में चल रहे संघर्ष के सैनिक रूपक को संक्षिप्त और सहज ढंग से व्यक्त करता है।
- source_word: σαρκικὰ
  choice: शरीर के अनुसार
  rationale: σάρξ से सम्बन्ध बनाए रखते हुए इसे केवल पापमय या सांसारिक मानकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: δυνατὰ τῷ θεῷ
  choice: परमेश्वर के सामने सामर्थी
  rationale: दत्तिव τῷ θεῷ की संक्षिप्त और अस्पष्ट बनावट को सुरक्षित रखता है तथा स्रोत या साधन का अर्थ मुख्य पाठ में नहीं जोड़ता।
- source_word: καθαίρεσιν
  choice: ढा देने
  rationale: किलेबन्दी गिराने के सजीव सैनिक बिम्ब को बनाए रखता है।
- source_word: ὀχυρωμάτων
  choice: गढ़ों
  rationale: दृढ़ किलेबन्द स्थानों का स्वाभाविक हिन्दी समतुल्य है और रूपक के लिए भी उपयुक्त है।
- source_word: λογισμοὺς
  choice: तर्कों
  rationale: अगले पद के सन्दर्भ में परमेश्वर के ज्ञान का विरोध करने वाली विचार-रचनाओं को व्यक्त करता है, न कि केवल तटस्थ विचारों को।
- source_word: καθαιροῦντες
  choice: ढा देते हैं
  rationale: καθαίρεσιν के साथ शब्दगत सम्बन्ध और दोहराव की अलंकारिक शक्ति को बनाए रखता है।
theological_decisions:
- issue: σαρκικὰ में मानवीय शरीर/सांसारिक साधनों का विरोध
  choice: शरीर के अनुसार नहीं
  alternative: शारीरिक नहीं / सांसारिक नहीं
  rationale: यह पौलुस की σάρξ-सम्बन्धी भाषा को बनाए रखता है और उसे केवल नैतिक पाप या संसारपन तक सीमित नहीं करता।
- issue: δυνατὰ τῷ θεῷ में τῷ θεῷ का सम्बन्ध
  choice: परमेश्वर के सामने सामर्थी
  alternative: परमेश्वर के द्वारा सामर्थी / परमेश्वर से सामर्थी
  rationale: यूनानी दत्तिव का अर्थ यहाँ संक्षिप्त है। मुख्य पाठ ‘परमेश्वर के सामने’ रखकर अस्पष्टता बचाता है; वैकल्पिक साधन/स्रोत अर्थ पादटिप्पणी में दिया गया है।
- issue: λογισμοὺς का आशय
  choice: तर्कों
  alternative: विचारों / विचार-वितर्कों / कल्पनाओं
  rationale: अगले पद में परमेश्वर के ज्ञान के विरुद्ध उठने वाली बातों से सम्बन्ध के कारण विरोधी विचार-प्रणालियों का भाव उपयुक्त है, फिर भी वैकल्पिक व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘शरीर के अनुसार’ और ‘परमेश्वर के सामने’ कुछ हद तक स्रोत-सन्निकट अभिव्यक्तियाँ हैं; उनकी वास्तविक अर्थगत व्यापकता पादटिप्पणियों में दी गई है। यूनानी वाक्य में λογισμοὺς καθαιροῦντες अगले पद की ओर बढ़ता है; हिन्दी में अर्धविराम और स्वतंत्र क्रियात्मक वाक्यांश से उसी प्रवाह को पठनीय बनाया गया है।
