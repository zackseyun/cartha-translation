base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: hi
  text: लेकिन मैं विनती करता हूँ कि जब मैं उपस्थित होऊँ, तब मुझे उस आत्मविश्वास के साथ साहस न दिखाना पड़े, जिसके साथ मैं उन कुछ लोगों के विरुद्ध साहस करने का विचार करता हूँ जो हमें शरीर के अनुसार चलनेवाले समझते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानवीय मानदंडों के अनुसार जीवन बितानेवाले।”
    reason: κατὰ σάρκα और περιπατεῖν का अधिक व्याख्यात्मक, स्वाभाविक विकल्प।
lexical_decisions:
- source_word: δέομαι
  choice: मैं विनती करता हूँ
  rationale: यह साधारण अनुरोध से अधिक गंभीर आग्रह व्यक्त करता है और आधुनिक सम्मानपूर्ण हिन्दी में स्वाभाविक है।
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: कि जब मैं उपस्थित होऊँ, तब मुझे ... साहस न दिखाना पड़े
  rationale: वाक्यांश पौलुस की विनती की विषयवस्तु बताता है; ‘न दिखाना पड़े’ उस अनचाही आवश्यकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῇ πεποιθήσει
  choice: उस दृढ़ विश्वास के साथ
  rationale: πεποίθησις के आत्मविश्वास अथवा निश्चय के भाव को बनाए रखता है और करण/सहचारिता के रूप में प्रयुक्त संप्रदान कारक को व्यक्त करता है।
- source_word: ᾗ λογίζομαι
  choice: जिसके भरोसे मैं ... विचार करता हूँ
  rationale: λογίζομαι यहाँ सोचे-समझे आकलन या इरादे को व्यक्त करता है; सम्बन्धवाचक पद को πεποίθησις से स्पष्ट रूप से जोड़ता है।
- source_word: τολμῆσαι ἐπί τινας
  choice: उन कुछ लोगों के विरुद्ध कठोरता दिखाने
  rationale: ἐπί के विरोधात्मक दिशाभाव को ‘के विरुद्ध’ सुरक्षित रखा गया है; प्रसंग में τολμᾶν केवल साहस रखने से अधिक, दृढ़तापूर्वक कार्रवाई करने की ओर संकेत करता है।
- source_word: τοὺς λογιζομένους
  choice: जो ... समझते हैं
  rationale: यह विरोधियों के मूल्यांकन या धारणा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατὰ σάρκα
  choice: शरीर के अनुसार
  rationale: पौलुस के महत्त्वपूर्ण और अर्थगत रूप से व्यापक शब्द σάρξ को व्याख्यात्मक रूप से सीमित किए बिना सुरक्षित रखता है।
- source_word: περιπατοῦντας
  choice: चलनेवाला
  rationale: आचरण के लिए प्रयुक्त पौलुस के ‘चलने’ के रूपक को बनाए रखता है।
theological_decisions:
- issue: κατὰ σάρκα में σάρξ का अनुवाद
  choice: शरीर के अनुसार
  alternative: मानवीय मानदंडों के अनुसार
  rationale: आरोप सांसारिक या केवल मानवीय ढंग से आचरण करने का संकेत दे सकता है, पर ‘पापी स्वभाव’ कहना अर्थ को अनावश्यक रूप से सीमित करेगा। मुख्य पाठ पौलुस की शब्दावली और वास्तविक अस्पष्टता बनाए रखता है; व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए समझने योग्य रखी गई है। ‘उपस्थित’, ‘दृढ़ विश्वास’ और ‘शरीर के अनुसार चलना’ मूल की औपचारिक तथा पौलुसी बनावट को बनाए रखते हैं; ‘चलनेवाला’ संयुक्त रूप में मानक हिन्दी वर्तनी के अनुसार रखा गया है।
