reference: 2 Corinthians 10:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: hi
  text: क्योंकि हम अपने आपको सीमा से आगे नहीं बढ़ा रहे हैं, मानो हम तुम तक पहुँचे ही न हों; क्योंकि मसीह का सुसमाचार लेकर हम तुम तक भी पहुँच चुके हैं—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: हम अपने आपको सीमा से आगे नहीं बढ़ा रहे हैं
  rationale: यह रूप मूल क्रिया में निहित ‘उचित सीमा से आगे खिंचने’ के रूपक को बनाए रखता है और वर्तमान काल को भी व्यक्त करता है।
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: मानो हम तुम तक पहुँचे ही न हों
  rationale: यह काल्पनिक स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ही’ इस बात पर बल देता है कि कुरिन्थुस तक उनकी वास्तविक पहुँच को नकारना अनुचित होता।
- source_word: ἄχρι ... καὶ ὑμῶν
  choice: तुम तक भी
  rationale: '‘भी’ यूनानी καί के बल को सहज हिन्दी में सुरक्षित रखता है: उनकी सेवकाई कुरिन्थियों तक भी वास्तव में पहुँची थी।'
- source_word: ἐφθάσαμεν
  choice: पहुँच चुके हैं
  rationale: यह पूर्ण हो चुकी पहुँच और उसके वर्तमान संदर्भ में बने परिणाम को स्पष्ट करता है।
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: सुसमाचार लेकर
  rationale: यहाँ ἐν सुसमाचार की सेवकाई के साथ अथवा उसके माध्यम से पहुँचने का भाव देता है; ‘लेकर’ आधुनिक हिन्दी में स्वाभाविक है और साधन-सहचर्य दोनों के निकट रहता है।
- source_word: εὐαγγελίῳ
  choice: सुसमाचार
  rationale: यह पौलुस के धार्मिक संदर्भ में स्थापित, स्पष्ट और गरिमापूर्ण हिन्दी पद है।
- source_word: τοῦ Χριστοῦ
  choice: मसीह का
  rationale: यहाँ Χριστός सुसमाचार को विशेषित करते हुए उपाधि का अर्थ बनाए रखता है; ‘मसीह’ उस अर्थ को सीधे व्यक्त करता है।
theological_decisions:
- issue: τοῦ Χριστοῦ का अनुवाद
  choice: मसीह का
  alternative: ख्रीष्ट का
  rationale: इस वाक्यांश में Χριστός की मसीही उपाधि अर्थपूर्ण है। ‘मसीह का सुसमाचार’ सम्बन्ध को खुला रखता है—यह मसीह से सम्बन्धित और उनका सुसमाचार दोनों हो सकता है—और किसी संप्रदायगत व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत के रूपक के निकट रखी गई है। वाक्य के अंत का दीर्घ विराम-चिह्न अगले पद में विचार जारी रहने का संकेत देता है।
