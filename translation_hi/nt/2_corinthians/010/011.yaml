reference: 2 Corinthians 10:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοῦτο λογιζέσθω ὁ τοιοῦτος, ὅτι οἷοί ἐσμεν τῷ λόγῳ δι’ ἐπιστολῶν ἀπόντες, τοιοῦτοι καὶ παρόντες τῷ ἔργῳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/011.yaml
  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: hi
  text: ऐसा व्यक्ति यह बात समझ ले कि अनुपस्थित रहते हुए हम पत्रों के द्वारा अपनी बातों में जैसे हैं, उपस्थित होने पर काम में भी वैसे ही हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογιζέσθω
  choice: समझ ले
  rationale: तीसरे पुरुष की आज्ञार्थक क्रिया यहाँ किसी तथ्य पर गंभीरता से विचार करके उसे मान लेने का आग्रह करती है; ‘समझ ले’ आधुनिक और स्वाभाविक हिंदी में यह बल व्यक्त करता है।
- source_word: ὁ τοιοῦτος
  choice: ऐसा व्यक्ति
  rationale: यह पिछले संदर्भ में बताए गए प्रकार के आलोचक की ओर एकवचन में संकेत करता है; ‘ऐसा व्यक्ति’ सहज और गरिमापूर्ण है।
- source_word: οἷοί ἐσμεν … τοιοῦτοι
  choice: जैसे हैं … वैसे ही होंगे
  rationale: ग्रीक की गुणात्मक तुलना को हिंदी के स्वाभाविक ‘जैसे … वैसे’ ढाँचे में रखा गया है। उपस्थित होने पर भावी कार्यवाही का संदर्भ होने के कारण अंतिम खंड में ‘होंगे’ स्वाभाविक है, यद्यपि ग्रीक में क्रिया निहित है।
- source_word: τῷ λόγῳ
  choice: अपने शब्दों से
  rationale: यह संबंध अथवा क्षेत्र बताने वाला दत्तिव है और पत्रों में व्यक्त कथन की ओर संकेत करता है; यह τῷ ἔργῳ के साथ शब्द–काम का विरोध बनाए रखता है।
- source_word: δι’ ἐπιστολῶν
  choice: पत्रों में
  rationale: διά और संबंधकारक पत्रों को माध्यम बताता है। हिंदी में ‘पत्रों में अपने शब्दों से’ इस माध्यम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπόντες
  choice: अनुपस्थित रहते हुए
  rationale: परिस्थितिजन्य वर्तमान कृदंत को इस प्रकार अनूदित करने से παρόντες के साथ स्पष्ट समानांतर बनता है।
- source_word: παρόντες
  choice: उपस्थित होने पर
  rationale: यह ἀπόντες का समानांतर परिस्थितिजन्य कृदंत है; हिंदी में समय और परिस्थिति दोनों स्पष्ट होते हैं।
- source_word: τῷ ἔργῳ
  choice: अपने कामों में
  rationale: यह शब्दों के विपरीत वास्तविक आचरण अथवा कार्य को दर्शाता है। बहुवचन ‘कामों’ हिंदी में व्यक्तिगत उपस्थिति के दौरान किए जाने वाले कार्यों को सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: पौलुस के पत्रों के शब्दों और उसकी व्यक्तिगत उपस्थिति के कामों के बीच संबंध
  choice: अनुवाद इसे दृढ़ चेतावनी के रूप में रखता है कि उपस्थित होने पर उसके काम उसके अनुपस्थित रहते हुए लिखे शब्दों के अनुरूप होंगे।
  alternative: इसे केवल बोलने की शैली और सामर्थ्य के भेद या एक विस्तृत भावी दंड की स्पष्ट धमकी के रूप में प्रस्तुत करना।
  rationale: ग्रीक सीधी गुणात्मक तुलना करता है—पत्रों में शब्दों से जैसे, उपस्थिति में काम से वैसे। अनुवाद चेतावनी का बल बनाए रखता है, पर मूल से आगे बढ़कर किसी विशिष्ट दंड या कलीसियाई सिद्धांत को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘शब्दों’ और ‘कामों’ का समानांतर मूल की वाग्मितापूर्ण विषमता को बनाए रखता है। किसी पाठ-भेद या आवश्यक व्याख्यात्मक विकल्प के अभाव में पादटिप्पणी नहीं जोड़ी गई।
