review_pass:
  verdict: revise
  source_fidelity: The draft conveys the central comparison between Paul and his coworkers' written words while absent and their conduct when present. However, the future “होंगे” is not represented by the Greek, which uses the present participle “present” and leaves the copula understood; the present-tense assertion should be retained. “कामों” also unnecessarily pluralizes τῷ ἔργῳ.
  naturalness: The wording is generally clear, but “पत्रों में अपने शब्दों से जैसे हैं” is somewhat cumbersome in modern Hindi. “पत्रों के द्वारा अपनी बातों में” expresses the instrumental role of the letters and the word/speech sphere more naturally.
  terminology: “ऐसा व्यक्ति” and “समझ ले” are suitable. “बातों” is a natural Hindi contextual rendering of λόγῳ here, while “काम में” preserves the compact contrast of λόγῳ and ἔργῳ without importing a plural sense.
  issues:
  - severity: medium
    issue: 'The final verb is future: “वैसे ही होंगे।”'
    rationale: 'The Greek states the comparison in the present: “such [we are] also [when] present in deed.” The context has a warning force, but the translation should not make this a distinct future prediction.'
  - severity: low
    issue: “कामों” renders τῷ ἔργῳ as a plural.
    rationale: The source has singular ἔργῳ, denoting deed, action, or conduct as a sphere. Singular “काम में” better preserves the rhetorical word/deed contrast.
  - severity: low
    issue: “पत्रों में अपने शब्दों से” is stylistically heavy.
    rationale: The Greek means ‘in word through/by letters.’ “पत्रों के द्वारा अपनी बातों में” is more idiomatic Hindi while retaining both elements.
  revised_text: ऐसा व्यक्ति यह बात समझ ले कि अनुपस्थित रहते हुए हम पत्रों के द्वारा अपनी बातों में जैसे हैं, उपस्थित होने पर काम में भी वैसे ही हैं।
  revised_footnotes: []
