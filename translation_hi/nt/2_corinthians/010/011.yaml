  to: ऐसा व्यक्ति यह बात समझ ले कि अनुपस्थित रहते हुए हम पत्रों के द्वारा अपनी बातों में जैसे हैं, उपस्थित होने पर काम में भी वैसे ही हैं।
  rationale: The revision retains the imperative warning and the absent/present parallel, while restoring the Greek present assertion rather than an explicit future. It renders διά with “पत्रों के द्वारा,” retains λόγῳ as the sphere of what is said, and uses singular “काम में” for ἔργῳ.
