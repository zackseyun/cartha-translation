base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: hi
  text: क्योंकि यदि मैं हमारे उस अधिकार के विषय में कुछ अधिक भी गर्व करूँ, जिसे प्रभु ने तुम्हारी उन्नति के लिए दिया है, न कि तुम्हें गिराने के लिए[a], तो मैं लज्जित नहीं ठहरूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे विनाश के लिए नहीं।” यूनानी शब्द का अर्थ ‘ढहाना/गिराना’ या ‘विनाश’ हो सकता है; यहाँ ‘उन्नति’ और ‘गिराने’ का विरोधी रूपक रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “मुझे लज्जा नहीं होगी।” यूनानी क्रिया भविष्यत् कर्मवाच्य है; “लज्जित नहीं ठहरूँगा” उस परिणामात्मक कर्मवाच्य भाव को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: क्योंकि यदि … भी
