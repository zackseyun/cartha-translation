- source_word: καυχήσωμαι
  choice: मैं … गर्व करूँ
  rationale: ἐάν के साथ आए विधिलिंग के काल्पनिक शर्तसूचक भाव को वर्तमान मानक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: हमारे उस अधिकार के विषय में
  rationale: ἐξουσία यहाँ केवल सामर्थ्य नहीं, प्रभु से मिला हुआ अधिकार है; ‘हमारे’ मूल पाठ के बहुवचन को सुरक्षित रखता है।
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: जिसे प्रभु ने … दिया है
  rationale: संबंधवाचक सर्वनाम को ‘अधिकार’ से स्पष्ट रूप से जोड़ता है और κύριος के लिए प्रतिष्ठित उपाधि ‘प्रभु’ रखता है। हिन्दी में वर्तमान-संबद्ध प्राप्त अधिकार के लिए पूर्ण पक्ष स्वाभाविक है।
- source_word: εἰς οἰκοδομὴν
  choice: तुम्हें बनाने के लिए
  rationale: οἰκοδομή के निर्माण-रूपक को बनाए रखते हुए ὑμῶν से ज्ञात व्यक्तिवाचक लक्ष्य को हिन्दी में स्पष्ट करता है।
- source_word: καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: गिराने के लिए नहीं
  rationale: καθαίρεσις को οἰκοδομή के विपरीत निर्माण/ढहाने के रूपक में रखता है, न कि अनिवार्यतः पूर्ण विनाश के अर्थ में।
- source_word: οὐκ αἰσχυνθήσομαι
  choice: मुझे लज्जित नहीं किया जाएगा
  rationale: यूनानी भविष्यत् कर्मवाच्य को स्पष्ट रूप से सुरक्षित रखता है और यह भाव देता है कि पौलुस का गर्व खोखला सिद्ध करके उसे लज्जित नहीं करेगा।
theological_decisions:
- issue: प्रेरिताई अधिकार का स्रोत और उद्देश्य
  choice: यह अधिकार प्रभु द्वारा दिया गया है और कुरिन्थियों को बनाने के लिए है, गिराने के लिए नहीं।
  alternative: यह अधिकार मुख्यतः दंडात्मक विनाश के लिए है।
  rationale: मूल पाठ οἰκοδομή और καθαίρεσις को सीधे आमने-सामने रखता है। अनुवाद अधिकार की वास्तविकता और उसके रचनात्मक उद्देश्य—दोनों को रखता है, बिना कठोर अनुशासन की संभावना को अलग से नकारे।
- issue: अंतिम क्रिया का कर्मवाच्य भाव
  choice: मुझे लज्जित नहीं किया जाएगा
  alternative: मुझे लज्जा नहीं होगी
  rationale: कर्मवाच्य रूप उस बाहरी प्रमाणित होने या लज्जित किए जाने की संभावना को खुला रखता है; वैकल्पिक भाववाचक अनुवाद पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘गर्व करूँ’ इस प्रसंग में καυχάομαι का स्वाभाविक हिन्दी रूप है; वाक्य में निर्माण और गिराने का मूल रूपक जानबूझकर सुरक्षित रखा गया है।
