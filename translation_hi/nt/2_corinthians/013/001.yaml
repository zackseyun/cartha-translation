reference: 2 Corinthians 13:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τρίτον τοῦτο ἔρχομαι πρὸς ὑμᾶς· ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν σταθήσεται πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: hi
  text: 'यह तीसरी बार है कि मैं तुम्हारे पास आ रहा हूँ: “हर मामला दो या तीन गवाहों की गवाही से प्रमाणित किया जाएगा।”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर बात दो गवाहों या तीन [गवाहों] के मुँह से प्रमाणित की जाएगी।” यूनानी पाठ व्यवस्थाविवरण 19:15 के शब्दों का निकटता से अनुसरण करता है और एक कानूनी मुहावरे का प्रयोग करता है।
    reason: lexical_alternative
  - marker: b
    text: यह व्यवस्थाविवरण 19:15 की ओर संकेत है।
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: यह तीसरी बार है
  rationale: नपुंसकलिंग कर्मकारक पद यहाँ क्रियाविशेषण की तरह पौलुस के आने की तीसरी घटना बताता है; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: मैं तुम्हारे पास आ रहा हूँ
  rationale: वर्तमानकालीन ἔρχομαι प्रसंग में निकट भविष्य में होने वाले आगमन की तत्परता व्यक्त करता है।
- source_word: ἐπὶ στόματος
  choice: के मुँह से
  rationale: यह व्यवस्थाविवरण 19:15 की कानूनी अभिव्यक्ति को निकटता से सुरक्षित रखता है; अर्थ स्पष्ट करने के लिए पादटिप्पणी में ‘गवाही से’ दिया गया है।
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: दो गवाहों या तीन
  rationale: καί यहाँ उद्धृत पारंपरिक सूत्र में विकल्पात्मक अर्थ देता है; हिंदी में ‘या’ दो अथवा तीन गवाहों का आशय साफ करता है।
- source_word: σταθήσεται
  choice: प्रमाणित किया जाएगा
  rationale: ἵστημι का भविष्यत् कर्मवाच्य कानूनी प्रसंग में किसी बात के पुष्ट या स्थापित होने को दर्शाता है।
- source_word: πᾶν ῥῆμα
  choice: हर मामला
  rationale: ῥῆμα का मूल अर्थ ‘बात/वचन’ हो सकता है, पर इस कानूनी उद्धरण में यह विचाराधीन मामले को सूचित करता है; ‘हर मामला’ व्यापक न्यायिक अर्थ बनाए रखता है।
theological_decisions:
- issue: पौलुस के अनुशासनात्मक प्रसंग में व्यवस्थाविवरण के कानूनी सिद्धांत का प्रयोग
  choice: उद्धरण को किसी भी मामले के प्रमाणित होने के व्यापक कानूनी सिद्धांत के रूप में रखा गया है।
  alternative: इसे विशेष रूप से ‘हर आरोप’ या केवल कलीसियाई अनुशासन से संबंधित कहना।
  rationale: यूनानी पाठ किसी आरोप या कलीसियाई प्रक्रिया तक अर्थ को स्पष्ट रूप से सीमित नहीं करता; इसलिए अनुवाद उस व्यापकता और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। मुख्य पाठ में शास्त्रीय कानूनी मुहावरे ‘मुँह से’ को सुरक्षित रखा गया है और पादटिप्पणी में उसका स्वाभाविक अर्थ स्पष्ट किया गया है।
