  yaml_path: translation/nt/2_corinthians/013/012.yaml
  text: Greet one another with a holy kiss[b][a]. All the saints greet you.
translation:
  language: hi
  text: पवित्र चुम्बन के साथ एक-दूसरे का अभिवादन करो। सभी पवित्र जन[a] तुम्हें नमस्कार भेजते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पवित्र जन’ से आशय सभी विश्वासियों, अर्थात् परमेश्वर के पवित्र लोगों, से है; केवल विशेष रूप से मान्यता-प्राप्त किसी चुनिंदा वर्ग से नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: अभिवादन करो
  rationale: यह बहुवचन में सीधी आज्ञा है। ‘अभिवादन करो’ आधुनिक मानक हिन्दी में स्वाभाविक है और पत्र के समापन-संदर्भ के अनुकूल है।
- source_word: ἀλλήλους
  choice: एक-दूसरे का
  rationale: यह पारस्परिक सर्वनाम है और समुदाय के सदस्यों द्वारा परस्पर किए जाने वाले अभिवादन को व्यक्त करता है।
- source_word: ἐν ἁγίῳ φιλήματι
  choice: पवित्र चुम्बन के साथ
  rationale: ἐν को इस अभिवादन-सूत्र में साधन या रीति के अर्थ में ‘के साथ’ कहना स्वाभाविक है। ‘पवित्र’ ἁγίῳ के धार्मिक-सामुदायिक भाव को और ‘चुम्बन’ φιλήματι के सीधे अर्थ को बनाए रखता है।
- source_word: ἀσπάζονται ὑμᾶς
  choice: तुम्हें नमस्कार कहते हैं
  rationale: पत्रात्मक संदर्भ में यह हिन्दी मुहावरा दूर उपस्थित लोगों की ओर से भेजे गए अभिवादन को स्वाभाविक रूप से व्यक्त करता है; ‘तुम्हें’ बहुवचन समुदाय को संबोधित करता है।
- source_word: οἱ ἅγιοι πάντες
  choice: परमेश्वर के सभी पवित्र जन
  rationale: पौलुस के प्रयोग में ἅγιοι सभी विश्वासियों के लिए सामुदायिक पद है। ‘पवित्र जन’ मूल अर्थ को स्पष्ट रखता है, और ‘परमेश्वर के’ यह बताता है कि उनकी पवित्रता परमेश्वर से संबंध के कारण है, न कि किसी विशेष धर्माधिकारी दर्जे के कारण।
theological_decisions:
- issue: पौलुस के सामुदायिक संबोधन में ἅγιοι का अनुवाद
  choice: परमेश्वर के सभी पवित्र जन
  alternative: सभी संत
  rationale: ‘पवित्र जन’ यूनानी शब्द के मूल भाव और सभी विश्वासियों के लिए उसके पौलुसी प्रयोग को स्पष्ट करता है। ‘संत’ आधुनिक पाठक को विशेष रूप से मान्यता-प्राप्त कुछ व्यक्तियों की बाद की श्रेणी का भ्रम दे सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और समुदाय-केंद्रित रखी गई है। ‘चुम्बन’ को सांस्कृतिक रूप से सामान्यीकृत अभिवादन में बदलने के बजाय मूल के ठोस संकेत के रूप में बनाए रखा गया है।
