source:
  edition: SBLGNT
  text: ⸀εὐχόμεθα δὲ πρὸς τὸν θεὸν μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν, οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν, ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε, ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: hi
  text: हम परमेश्वर से प्रार्थना करते हैं कि तुम कोई बुराई न करो—इसलिए नहीं कि हम खरे सिद्ध दिखाई दें, बल्कि इसलिए कि तुम भलाई करो, भले ही हम अयोग्य-से दिखाई दें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχόμεθα δὲ πρὸς τὸν θεὸν
  choice: हम परमेश्वर से प्रार्थना करते हैं
  rationale: εὔχομαι प्रार्थना को और πρός + कर्मकारक उसके परमेश्वर की ओर निर्देशित होने को व्यक्त करता है। δέ को हिन्दी में अलग संयोजक देकर भारी बनाने की आवश्यकता नहीं है; प्रसंग में वाक्य का संबंध स्वाभाविक रहता है।
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: कि तुम कोई बुराई न करो
  rationale: यह प्रार्थना की विषयवस्तु है। κακὸν μηδέν का नैतिक और बलयुक्त अर्थ ‘कोई बुराई नहीं’ है; ‘कोई बुराई न करो’ सहज हिन्दी है।
- source_word: οὐχ ἵνα
  choice: इसलिए नहीं कि
  rationale: यह पौलुस द्वारा नकारे गए उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δόκιμοι φανῶμεν
  choice: हम परखे हुए सिद्ध दिखाई दें
  rationale: δόκιμος में जाँच के बाद खरा या मान्य सिद्ध होने का भाव है और φανῶμεν दृश्यतः प्रकट होने का; यह पदावली दोनों अर्थों को सुरक्षित रखती है।
- source_word: τὸ καλὸν ποιῆτε
  choice: तुम भलाई करो
  rationale: नैतिक संदर्भ में καλός उस काम को बताता है जो अच्छा और उचित है। संज्ञात्मक एकवचन को हिन्दी में ‘भलाई’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὡς ἀδόκιμοι ὦμεν
  choice: भले ही हम परीक्षा में असफल जैसे ठहरें
  rationale: ἀδόκιμος, δόκιμος का प्रतिलोम है और परीक्षा में खरा न उतरने का भाव रखता है। ὡς के कारण ‘जैसे’ रूप या आकलन की अस्पष्टता बनाए रखता है; ‘भले ही’ प्रसंगगत रियायत को व्यक्त करता है।
theological_decisions:
- issue: ὡς ἀδόκιμοι में पौलुस के आत्म-वर्णन का आशय
  choice: इसे ‘परीक्षा में असफल जैसे ठहरें’ कहा गया है, जिससे परीक्षा, मूल्यांकन और दूसरों की दृष्टि में ऐसा माने जाने की संभावना बनी रहती है।
  alternative: ‘अयोग्य ठहरें’ या ‘नामंज़ूर सिद्ध हों’
  rationale: मूल पद तत्काल प्रसंग में δόκιμοι के साथ शब्दगत विरोध बनाता है। अनुवाद इसे अंतिम आध्यात्मिक दंड या उद्धार-विहीनता का निश्चित कथन नहीं बनाता और वास्तविक अस्पष्टता सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परखे हुए सिद्ध’ और ‘परीक्षा में असफल’ से यूनानी δόκιμοι/ἀδόκιμοι का परस्पर विरोध यथासंभव स्पष्ट रखा गया है। मुख्य पाठ में कोई पाद-टिप्पणी चिह्न आवश्यक नहीं समझा गया।
