- source_word: χαίρομεν
  choice: हम आनन्दित होते हैं
  rationale: वर्तमान काल में पौलुस की प्रबल प्रसन्नता व्यक्त करता है; ‘आनन्दित’ सामान्य आधुनिक हिन्दी में गरिमापूर्ण और स्वाभाविक है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करने वाले संयोजक को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὅταν
  choice: जब … तब
  rationale: उपवाक्य का सामान्य कालवाचक अर्थ बनाए रखता है और हिन्दी में दोनों विपरीत अवस्थाओं को सहज ढंग से जोड़ता है।
- source_word: ἀσθενῶμεν
  choice: हम निर्बल होते हैं
  rationale: शारीरिक, सामाजिक अथवा प्रकट असामर्थ्य में से किसी एक को निश्चित किए बिना यूनानी शब्द का व्यापक अर्थ और δυνατοὶ के साथ विरोध सुरक्षित रखता है।
- source_word: δυνατοὶ
  choice: आप सामर्थी होते हैं
  rationale: ἀσθενῶμεν के विपरीत शक्ति अथवा क्षमता का भाव देता है; ‘सामर्थी’ यहाँ ‘शक्तिशाली’ की अपेक्षा कम प्रभुत्व-सूचक है।
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: और हम यह प्रार्थना भी करते हैं
  rationale: εὐχόμεθα को प्रार्थना के रूप में व्यक्त करता है और τοῦτο तथा καὶ दोनों के बल को स्वाभाविक हिन्दी शब्दक्रम में बनाए रखता है।
- source_word: κατάρτισιν
  choice: आप सुधरकर ठीक दशा में आ जाएँ
  rationale: संज्ञा का अर्थ केवल ‘परिपक्वता’ तक सीमित न करके सुधार, पुनर्स्थापन और उचित दशा में लाए जाने की व्यापक धारणा व्यक्त करता है।
theological_decisions:
- issue: κατάρτισις में पौलुस के पास्तरीय उद्देश्य का अर्थ
  choice: आप सुधरकर ठीक दशा में आ जाएँ
  alternative: आप परिपक्व हो जाएँ; आपको पूर्ण बनाया जाए; आपका पुनर्स्थापन हो
  rationale: संदर्भ में कुरिन्थियों को उचित दशा में लाने की इच्छा प्रमुख है। यह अनुवाद किसी तकनीकी सिद्धता-सिद्धान्त को आरोपित किए बिना सुधार और पुनर्स्थापन का भाव देता है; अन्य वास्तविक अर्थ-सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
