  text: क्योंकि जब हम निर्बल होते हैं और तुम बलवान होते हो, तब हम आनन्दित होते हैं। और हम यह भी प्रार्थना करते हैं कि तुम्हारी पुनःस्थापना हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी परिपक्वता,” “तुम्हारा पूर्ण किया जाना,” अथवा “तुम्हें उचित दशा में लाया जाना।” यूनानी शब्द पुनःस्थापना, सुसज्जित किए जाने, या किसी वस्तु अथवा व्यक्ति को उचित दशा में लाने का अर्थ दे सकता है।
    reason: lexical_alternative
