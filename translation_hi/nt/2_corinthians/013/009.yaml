  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण स्तर अपनाया गया है। ‘निर्बल’ और ‘सामर्थी’ मूल के स्पष्ट विरोध को रखते हैं। κατάρτισις की अर्थ-व्याप्ति मुख्य पाठ में स्वाभाविक क्रियात्मक वाक्यांश और पादटिप्पणी में विकल्पों द्वारा सुरक्षित की गई है।
