source:
  edition: SBLGNT
  text: Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: hi
  text: अब अंत में, भाइयो[b], आनंदित रहो[a], सुधर जाओ[c], प्रोत्साहित हो[d], एक ही बात सोचो[e], मेल से रहो; और प्रेम और शांति का परमेश्वर तुम्हारे साथ रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कुशल से रहो’ अथवा ‘विदा।’ यूनानी शब्द समापन-अभिवादन के रूप में भी प्रयुक्त हो सकता है, पर यहाँ संभवतः आदेशों की श्रृंखला में ‘आनंदित रहो’ का अर्थ देता है।
    reason: lexical_alternative
  - marker: b
    text: ‘भाइयो’ से यहाँ पूरी मंडली को संबोधित किया गया है; इसमें स्त्री और पुरुष दोनों सम्मिलित हैं।
    reason: cultural_note
  - marker: c
    text: या ‘पूर्ण बनो,’ ‘सुधारे जाओ,’ अथवा ‘अपने को व्यवस्थित करो।’
    reason: lexical_alternative
  - marker: d
    text: या ‘प्रोत्साहन अथवा समझाइश स्वीकार करो’; यूनानी रूप का अर्थ ‘सांत्वना पाओ’ भी हो सकता है।
    reason: lexical_alternative
  - marker: e
    text: शाब्दिक रूप से ‘एक ही बात सोचो’; अर्थात् ‘एक मन रहो।’
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: अब अन्त में
  rationale: यह पत्र के समापन की ओर ले जाने वाला विचार-संकेत है; ‘अब अन्त में’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है और यहाँ पूरी मण्डली को सम्बोधित करता है; समावेशी आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: χαίρετε
  choice: आनन्दित रहो
  rationale: यद्यपि यह विदाई-अभिवादन भी हो सकता है, यहाँ आदेशों की शृंखला में होने के कारण ‘आनन्दित रहो’ अधिक उपयुक्त है।
- source_word: καταρτίζεσθε
  choice: ठीक दशा में आओ
  rationale: क्रिया में सुधारने, पुनः व्यवस्थित करने या पूर्णतः उपयुक्त दशा में लाने का भाव है। यह रूप निष्क्रिय/मध्यवाच्य की सम्भावना को किसी एक संकीर्ण अर्थ तक सीमित नहीं करता।
- source_word: παρακαλεῖσθε
  choice: प्रोत्साहित हो
  rationale: यह निष्क्रिय/मध्यवाच्य रूप प्रोत्साहन, सांत्वना या समझाइश ग्रहण करने का भाव दे सकता है; चुना हुआ रूप संक्षिप्त और स्वाभाविक है।
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: एक ही बात सोचो
  rationale: यह यूनानी अभिव्यक्ति के शाब्दिक संज्ञानात्मक रूप को बनाए रखता है, जबकि इसका सामुदायिक आशय एक मन होना है।
- source_word: εἰρηνεύετε
  choice: मेल से रहो
  rationale: वर्तमानकालीन आदेश निरन्तर शान्तिपूर्ण सामुदायिक जीवन का आह्वान करता है; ‘मेल से रहो’ हिन्दी में स्वाभाविक है।
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: प्रेम और शान्ति का परमेश्वर
  rationale: सम्बन्धकारक यूनानी पदबंध का सीधा और धर्मवैज्ञानिक रूप से खुला अनुवाद है।
- source_word: ἔσται μεθ’ ὑμῶν
  choice: तुम्हारे साथ रहेगा
  rationale: यह साधारण भविष्यकालीन प्रतिज्ञा को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मण्डली को सम्बोधित करते समय ἀδελφοί का समावेशी आशय
  choice: मुख्य पाठ में ‘भाइयो’ रखा गया है और पादटिप्पणी में बताया गया है कि सम्बोधन में स्त्री और पुरुष दोनों सम्मिलित हैं।
  alternative: ‘भाइयो और बहनो’
  rationale: यह चयन यूनानी के व्याकरणिक पुल्लिंग रूप को सुरक्षित रखते हुए उसके सामुदायिक और समावेशी प्रयोग को पाठक के लिए स्पष्ट करता है।
- issue: καταρτίζεσθε में मध्यवाच्य और निष्क्रिय भाव की सम्भावना
  choice: ‘ठीक दशा में आओ’
  alternative: ‘सुधारे जाओ’ या ‘अपने को व्यवस्थित करो’
  rationale: यूनानी रूप ग्रहण किए जा रहे सुधार और समुदाय द्वारा अपने को व्यवस्थित करने—दोनों की छाया रख सकता है; मुख्य पाठ किसी एक को कठोरता से निश्चित नहीं करता।
- issue: χαίρετε का उपदेश या विदाई-अभिवादन होना
  choice: ‘आनन्दित रहो’
  alternative: ‘विदा’ या ‘कुशल से रहो’
  rationale: आस-पास के आदेशात्मक रूप उपदेशात्मक अर्थ का समर्थन करते हैं, पर विदाई-अभिवादन की वास्तविक शाब्दिक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामुदायिक उपदेश के अनुकूल शैली रखी गई है। लगातार आने वाले यूनानी आदेशों को छोटे, समानान्तर हिन्दी खण्डों में प्रस्तुत किया गया है; ‘परमेश्वर,’ ‘प्रेम’ और ‘शान्ति’ जैसे प्रचलित बाइबलीय शब्द बनाए रखे गए हैं।
