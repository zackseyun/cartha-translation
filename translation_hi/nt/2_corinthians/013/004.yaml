source:
  edition: SBLGNT
  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: hi
  text: क्योंकि वह निर्बलता में क्रूस पर चढ़ाया गया,[a] फिर भी वह परमेश्वर की सामर्थ्य से जीवित है। क्योंकि हम भी उसमें निर्बल हैं, परन्तु तुम्हारे प्रति परमेश्वर की सामर्थ्य से उसके साथ जीवित रहेंगे।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘निर्बलता से’; यूनानी ἐξ स्रोत या आधार का भाव भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसके साथ जीवित रहेंगे’ कुरिन्थियों के प्रति मसीह की सामर्थ्य से प्रकट होने वाले पौलुस के भावी जीवन और सेवकाई को सूचित कर सकता है; इसमें पुनरुत्थान-जीवन की व्यापक प्रतिध्वनि भी हो सकती है।
    reason: alternative_reading
  - marker: c
    text: ‘तुम्हारे प्रति’ का अनुवाद ‘तुम्हारे लिए’, ‘तुम्हारे बीच’ या ‘तुम्हारे संबंध में’ भी किया जा सकता है; यूनानी εἰς ὑμᾶς दिशा, संबंध या प्रभाव बता सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: क्रूस पर चढ़ाया गया था
  rationale: यूनानी कर्मवाच्य क्रिया और क्रूस पर मृत्यु के मानक अर्थ को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξ ἀσθενείας
  choice: निर्बलता में
  rationale: ἐξ का मूल भाव स्रोत या आधार हो सकता है, पर इस प्रसंग में हिन्दी का ‘निर्बलता में’ क्रूस पर चढ़ाए जाने की अवस्था या दशा को स्वाभाविक रूप से व्यक्त करता है और पौलुस के विरोधाभास को बनाए रखता है।
- source_word: ζῇ
  choice: जीवित है
  rationale: वर्तमान काल की सतत वास्तविकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκ δυνάμεως θεοῦ
  choice: परमेश्वर की सामर्थ्य से
  rationale: ἐκ के स्रोत/आधार भाव को हिन्दी में सहज साधन-स्रोत रूप से व्यक्त करता है और ‘निर्बलता’ के साथ जानबूझकर रखे गए विरोध को बनाए रखता है।
- source_word: ἀσθενοῦμεν
  choice: निर्बल हैं
  rationale: पहले प्रयुक्त ἀσθένεια से शब्दगत संबंध बनाए रखता है और अनावश्यक रूप से ‘शक्तिहीन’ जैसा अधिक निर्णायक अर्थ नहीं जोड़ता।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: मसीह के साथ संबंध या सहभागिता की पौलुसी संक्षिप्त अभिव्यक्ति को बिना विस्तार से समझाए सुरक्षित रखता है।
- source_word: ζήσομεν
  choice: जीवित रहेंगे
  rationale: यूनानी भविष्यकाल को सुरक्षित रखता है; इसे केवल वर्तमान सेवकाई या केवल अंतिम पुनरुत्थान तक सीमित नहीं करता।
- source_word: σὺν αὐτῷ
  choice: उसके साथ
  rationale: सहभागिता और साथ होने का सीधा तथा स्वाभाविक हिन्दी रूप है।
- source_word: εἰς ὑμᾶς
  choice: तुम्हारे प्रति
  rationale: दिशा, संबंध या प्रभाव के संक्षिप्त यूनानी भाव को सुरक्षित रखता है; प्रसंग में कुरिन्थियों के संबंध में प्रकट होने वाले जीवन और सामर्थ्य की ओर संकेत करता है।
theological_decisions:
- issue: क्रूस पर चढ़ाए जाने में मसीह की ‘निर्बलता’ का अर्थ
  choice: भाषा यह बताती है कि वह निर्बलता की दशा में क्रूस पर चढ़ाया गया; यह उसके ईश्वरत्व, निष्पापता या वर्तमान जीवित सामर्थ्य का निषेध नहीं करती।
  alternative: इसे केवल लोगों की दृष्टि में दिखाई देने वाली निर्बलता के रूप में स्पष्ट कर देना।
  rationale: मूल पाठ निर्बलता और परमेश्वर की सामर्थ्य के बीच पौलुसी विरोधाभास रखता है। अनुवाद इस तनाव को सुरक्षित रखता है और पाठ में अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: ‘उसके साथ जीवित रहेंगे’ का संदर्भ
  choice: भविष्यकाल को व्यापक रखा गया है, ताकि यह कुरिन्थियों के प्रति मसीह-सामर्थ्य से युक्त पौलुस की भावी सेवकाई को सूचित कर सके और पुनरुत्थान-जीवन की व्यापक प्रतिध्वनि को भी न रोके।
  alternative: इसे केवल अंतिम पुनरुत्थान या केवल निकट भविष्य की प्रेरिताई कार्रवाई तक सीमित करना।
  rationale: निकट प्रसंग ‘तुम्हारे प्रति’ प्रेरिताई व्यवहार की ओर इंगित करता है, जबकि ‘उसके साथ जीवित’ होने की भाषा पुनरुत्थान-संबंधी अर्थ भी जगा सकती है; अनुवाद दोनों के बीच के तनाव को नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘निर्बलता/निर्बल’ की पुनरावृत्ति मूल यूनानी के शब्दगत संबंध को बनाए रखती है। ‘सामर्थ्य’ बाइबलीय संदर्भ में परिचित है और ‘शक्ति’ की तुलना में यहाँ उपयुक्त धार्मिक-गंभीरता रखता है।
