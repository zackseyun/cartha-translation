  yaml_path: translation/nt/2_corinthians/013/008.yaml
  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: hi
  text: क्योंकि हम सत्य के विरुद्ध कुछ भी नहीं कर सकते, बल्कि सत्य के पक्ष में कर सकते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ γὰρ
  choice: क्योंकि ... नहीं
  rationale: γάρ पिछले कथन का कारण या आधार बताता है; यहाँ ‘क्योंकि’ आधुनिक हिन्दी में संबंध को स्पष्ट और स्वाभाविक रखता है। οὐ निषेध व्यक्त करता है।
- source_word: δυνάμεθά
  choice: हम ... नहीं कर सकते
  rationale: δύναμαι सामर्थ्य या क्षमता को दर्शाता है। हिन्दी में ‘नहीं कर सकते’ इसका सहज और सटीक रूप है।
- source_word: τι
  choice: कुछ भी
  rationale: निषेधात्मक वाक्य में अनिश्चित सर्वनाम τι का व्यापक अर्थ हिन्दी में स्वाभाविक रूप से ‘कुछ भी’ है।
- source_word: κατὰ τῆς ἀληθείας
  choice: सत्य के विरुद्ध
  rationale: संबंधकारक के साथ κατά यहाँ विरोध का अर्थ देता है। ‘सत्य के विरुद्ध’ यूनानी पदबंध का संक्षिप्त और सीधा प्रतिरूप है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: ἀλλά तीखा विरोध और सकारात्मक प्रतिपक्ष प्रस्तुत करता है; ‘बल्कि’ हिन्दी में इस संरचना को स्पष्ट करता है।
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: सत्य के पक्ष में
  rationale: ὑπέρ यहाँ समर्थन या पक्ष में होने का अर्थ देता है। ‘सत्य के पक्ष में’ κατὰ के साथ बने विरोध को स्पष्ट रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: τῆς ἀληθείας
  choice: सत्य
  rationale: निश्चित लेख सहित ἀλήθεια को ‘सत्य’ रखा गया है; इसे ‘सुसमाचार का सत्य’ या केवल ‘जो सच है’ कहकर संकुचित नहीं किया गया।
theological_decisions:
- issue: ‘सत्य’ का आशय
  choice: ‘सत्य’ को व्यापक रूप में यथावत रखना
  alternative: ‘सुसमाचार का सत्य’ अथवा ‘जो सत्य है’
  rationale: पौलुस का पद व्यापक है। संदर्भ में इसमें सुसमाचार का सत्य अवश्य सम्मिलित हो सकता है, पर मूल पाठ इसे किसी एक सिद्धान्तगत सूत्र तक सीमित नहीं करता।
- issue: दूसरे खंड में क्रिया का अध्याहार
  choice: ‘कर सकते हैं’ को हिन्दी में दोहराना
  alternative: ‘बल्कि सत्य के पक्ष में’
  rationale: यूनानी में दूसरे खंड की क्रिया पहले खंड से समझी जाती है। हिन्दी में उसे दोहराने से वाक्य पूर्ण और सहज बनता है, बिना अर्थ बढ़ाए।
- issue: ὑπέρ के साथ विशिष्टता का भाव
  choice: ‘ही’ द्वारा विरोधात्मक बल व्यक्त करना
  alternative: ‘सत्य के पक्ष में’ बिना ‘ही’ के
  rationale: मूल में ‘केवल’ का अलग शब्द नहीं है, पर οὐ ... ἀλλά की विपरीतार्थक संरचना निषिद्ध दिशा के मुकाबले एकमात्र सकारात्मक दिशा पर बल देती है। हिन्दी का ‘ही’ इस विरोधात्मक बल को स्वाभाविक ढंग से व्यक्त करता है; इसे अलग परिमाणसूचक ‘केवल’ के रूप में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘सत्य के विरुद्ध/सत्य के पक्ष में’ की समांतर रचना मूल यूनानी के अलंकारिक विरोध को बनाए रखती है।
