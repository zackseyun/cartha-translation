id: 2CO.13.3
reference: 2 Corinthians 13:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐπεὶ δοκιμὴν ζητεῖτε τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ· ὃς εἰς ὑμᾶς οὐκ ἀσθενεῖ ἀλλὰ δυνατεῖ ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/003.yaml
  text: since you are seeking proof that Messiah is speaking in me—he is not weak toward you[a], but is powerful in you[b],
translation:
  language: hi
  text: क्योंकि तुम इस बात का प्रमाण चाहते हो कि मसीह मुझमें बोल रहा है[a]—वह तुम्हारे प्रति निर्बल नहीं, बल्कि तुममें सामर्थी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसीह मेरे द्वारा बोल रहा है।” यूनानी में अधिक शाब्दिक रूप से “मुझमें बोलने वाला मसीह” है।
    reason: ἐν ἐμοί उपस्थिति (‘मुझमें’) अथवा माध्यम/कार्यकारी भाव (‘मेरे द्वारा’) में समझा जा सकता है; विकल्प वास्तविक अर्थगत अस्पष्टता सुरक्षित रखता है।
lexical_decisions:
- source_word: ἐπεὶ
  choice: क्योंकि
  rationale: यह पिछले संदर्भ में पौलुस की आगामी कठोरता का कारण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में स्वाभाविक रूप से कारणसूचक है।
- source_word: δοκιμήν
  choice: प्रमाण
  rationale: यहाँ अर्थ जाँच की प्रक्रिया नहीं, बल्कि किसी दावे को सत्य सिद्ध करने वाले प्रमाण का है।
- source_word: ζητεῖτε
  choice: चाहते हो
  rationale: वर्तमान काल कुरिन्थियों की जारी माँग को व्यक्त करता है; ‘प्रमाण चाहते हो’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: कि मसीह मुझमें बोल रहा है
  rationale: सम्बन्धकारक कृदन्त-रचना को हिन्दी में विषय-वाचक उपवाक्य द्वारा स्वाभाविक बनाया गया है, जबकि ἐν ἐμοί का ‘मुझमें’ औपचारिक रूप से सुरक्षित है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός के अभिषिक्त उद्धारकर्ता वाले पदवीगत अर्थ को हिन्दी का स्थापित शब्द ‘मसीह’ व्यक्त करता है।
- source_word: εἰς ὑμᾶς
  choice: तुम्हारे प्रति
  rationale: εἰς यहाँ दिशा अथवा सम्बन्ध व्यक्त करता है; ‘तुम्हारे प्रति’ इस भाव को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: οὐκ ἀσθενεῖ
  choice: निर्बल नहीं
  rationale: यह अनुवाद दुर्बलता के मूल अर्थ और अगले सामर्थ्य-वाचक क्रिया के साथ विरोध को बनाए रखता है।
- source_word: ἀλλὰ δυνατεῖ
  choice: बल्कि ... सामर्थी है
  rationale: दुर्लभ क्रिया δυνατέω यहाँ प्रभावी सामर्थ्य को दर्शाती है; ‘सामर्थी है’ निर्बलता के साथ सीधा विरोध बनाए रखता है।
- source_word: ἐν ὑμῖν
  choice: तुममें
  rationale: यह यूनानी पूर्वसर्ग का सीधा प्रतिनिधित्व है और बहुवचन सम्बोधन में सामूहिक या व्यक्तिगत अंतर्निवास—दोनों सम्भावनाएँ खुली रखता है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यहाँ पदवीगत अर्थ सहज है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय भाषा में स्वाभाविक तथा अर्थपूर्ण है।
- issue: ἐν ἐμοί का आशय
  choice: मुझमें बोल रहा है
  alternative: मेरे द्वारा बोल रहा है
  rationale: मूल पाठ का पूर्वसर्ग ‘में’ है। मुख्य पाठ उसे बनाए रखता है और पादटिप्पणी साधनात्मक अर्थ की सम्भावना बताती है, ताकि मसीह की पौलुस में उपस्थिति और उसके द्वारा बोलने के बीच तनाव को अनावश्यक रूप से न सुलझाया जाए।
- issue: ἐν ὑμῖν का आशय
  choice: तुममें सामर्थी है
  alternative: तुम्हारे बीच सामर्थी है
  rationale: ‘तुममें’ मूल अभिव्यक्ति का निकट अनुवाद है और कलीसिया के भीतर अथवा उसके सदस्यों में सामर्थ्य—दोनों सम्भव अर्थों को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली। ‘तुम’ बहुवचन कलीसियाई सम्बोधन है। ‘निर्बल’ और ‘सामर्थी’ आसपास के दुर्बलता-सामर्थ्य विषय को स्पष्ट रखते हैं।
