language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: hi
  text: अपने आप को परखो कि तुम विश्वास में हो या नहीं; अपने आप को जाँचो। क्या तुम स्वयं यह नहीं पहचानते कि यीशु मसीह तुम में[a] है?—यदि कहीं तुम कसौटी पर खरे न उतरते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे बीच।”
    reason: यूनानी ἐν ὑμῖν का अर्थ व्यक्तियों के भीतर या समुदाय के बीच, दोनों हो सकता है।
lexical_decisions:
- source_word: πειράζετε
  choice: परखो
  rationale: यहाँ अर्थ परीक्षा लेकर वास्तविक दशा जानना है, प्रलोभन देना नहीं। ‘परखो’ इस मूल्यांकनात्मक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐν τῇ πίστει
  choice: विश्वास में
  rationale: यूनानी पदबंध को जानबूझकर खुला रखा गया है; यह मसीही विश्वास के दायरे में बने रहने या सच्चा विश्वास रखने, दोनों की ओर संकेत कर सकता है।
- source_word: δοκιμάζετε
  choice: जाँचो
  rationale: ‘परखो’ के समानार्थी होते हुए भी यह सावधानी से जाँचकर प्रामाणिकता निर्धारित करने का भाव देता है और दोनों यूनानी क्रियाओं के बीच हल्का अंतर बनाए रखता है।
- source_word: ἐπιγινώσκετε
  choice: पहचानते
  rationale: रूपक प्रश्न में यह केवल जानकारी रखने से अधिक, अपनी स्थिति को समझने या पहचानने का भाव व्यक्त करता है।
- source_word: Ἰησοῦς Χριστός
  choice: यीशु मसीह
  rationale: ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में Χριστός के अभिषिक्त उद्धारकर्ता संबंधी शीर्षक को स्वाभाविक और अर्थपूर्ण ढंग से व्यक्त करता है।
- source_word: ἐν ὑμῖν
  choice: तुम में
  rationale: आत्म-परीक्षण का संदर्भ व्यक्तियों के भीतर मसीह की उपस्थिति को प्रमुख बनाता है; बहुवचन के कारण सामुदायिक अर्थ ‘तुम्हारे बीच’ भी संभव है और उसे पादटिप्पणी में रखा गया है।
- source_word: εἰ μήτι
  choice: जब तक कि
  rationale: यह अपवादसूचक वाक्यांश यहाँ संभावित विफलता को हल्के रूपक ढंग से सामने रखता है; हिन्दी में यह संरचना उसी शर्तात्मक अपवाद को व्यक्त करती है।
- source_word: ἀδόκιμοί
  choice: कसौटी पर खरे न उतरे
  rationale: यह शब्द सफल परीक्षण और स्वीकृति के विपरीत है। यह मुहावरा परीक्षण में असफल होने का अर्थ स्पष्ट करता है और ‘त्याज्य’ जैसे भारी धर्मशास्त्रीय अर्थ से बचता है।
theological_decisions:
- issue: ἐν τῇ πίστει का आशय
  choice: विश्वास में
  alternative: मसीही विश्वास में बने रहना; सच्चा व्यक्तिगत विश्वास रखना
  rationale: अनुवाद यूनानी की संक्षिप्तता और वास्तविक अर्थगत तनाव को बनाए रखता है, किसी एक धर्मशास्त्रीय व्याख्या को थोपता नहीं।
- issue: ἐν ὑμῖν का आशय
  choice: तुम में
  alternative: तुम्हारे बीच
  rationale: आत्म-परीक्षण का निकट संदर्भ भीतर की उपस्थिति का समर्थन करता है, पर बहुवचन ὑμῖν सामुदायिक उपस्थिति भी व्यक्त कर सकता है; इसलिए विकल्प पादटिप्पणी में है।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: अभिषिक्त जन
  rationale: ‘मसीह’ हिन्दी में स्थापित शीर्षक है और इसे केवल व्यक्तिगत नाम बना देने के बजाय इसके मसीहाई अर्थ को सुरक्षित रखता है।
- issue: ἀδόκιμοι का धर्मशास्त्रीय भार
  choice: कसौटी पर खरे न उतरे
  alternative: अयोग्य ठहरे; अस्वीकृत हो
  rationale: यह चयन परीक्षण की शब्दावली से संबंध बनाए रखता है और बाद की किसी विशिष्ट ‘त्याज्य’ संबंधी धर्मशास्त्रीय धारणा को पाठ में आयात नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपने आप को’ बहुवचन संबोधन का स्वाभाविक हिन्दी रूप है। अंतिम वाक्यांश में ‘कसौटी पर खरे न उतरे’ परीक्षण-विषयक शब्द-संबंध को स्पष्ट और गैर-सांप्रदायिक ढंग से बनाए रखता है।
