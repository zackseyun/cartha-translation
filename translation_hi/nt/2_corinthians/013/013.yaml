source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: hi
  text: प्रभु यीशु मसीह का अनुग्रह, परमेश्वर का प्रेम और पवित्र आत्मा की सहभागिता[a] तुम सबके साथ रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र आत्मा की संगति,” अथवा “पवित्र आत्मा में सहभागिता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस के आशीर्वचन में यह स्थापित और अर्थपूर्ण हिन्दी शब्द है; यह कृपापूर्ण उपकार और ईश्वरीय अनुग्रह, दोनों का भाव बनाए रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: यह यीशु के लिए प्रयुक्त सम्मानसूचक और मसीही उपाधि का स्वाभाविक मानक हिन्दी रूप है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: ‘यीशु’ नाम का लिप्यंतरण और Χριστός की उपाधि के लिए अर्थ-संबद्ध, हिन्दी में प्रचलित ‘मसीह’ रखा गया है।
- source_word: ἀγάπη τοῦ θεοῦ
  choice: परमेश्वर का प्रेम
  rationale: सम्बन्धकारक रचना को यथावत रखकर यह अस्पष्टता नहीं मिटाई गई कि प्रमुख बल परमेश्वर के प्रेम करने पर है या परमेश्वर से सम्बद्ध प्रेम पर।
- source_word: κοινωνία
  choice: सहभागिता
  rationale: यह शब्द साझा भागीदारी और पारस्परिक संगति, दोनों को समेट सकता है और यूनानी पद की व्यापकता को केवल सामाजिक ‘संगति’ तक सीमित नहीं करता।
- source_word: ἁγίου πνεύματος
  choice: पवित्र आत्मा
  rationale: दिव्य आत्मा के लिए आधुनिक मानक हिन्दी पद।
- source_word: μετὰ πάντων ὑμῶν
  choice: तुम सबके साथ रहे
  rationale: μετά के साथ होने के भाव और πάντων की स्पष्ट सर्वसमावेशिता को व्यक्त करता है; आशीर्वचन की लुप्त क्रिया हिन्दी में ‘रहे’ से स्वाभाविक रूप से पूरी होती है।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστοῦ का स्वरूप
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ Χριστός को केवल उपनाम-जैसा न मानकर उपाधि के रूप में प्रस्तुत किया गया है। ‘मसीह’ हिन्दी में अर्थ और प्रचलन दोनों बनाए रखता है।
- issue: κοινωνία τοῦ ἁγίου πνεύματος का अर्थ और सम्बन्धकारक
  choice: पवित्र आत्मा की सहभागिता
  alternative: पवित्र आत्मा की संगति; पवित्र आत्मा में सहभागिता
  rationale: यूनानी रचना आत्मा द्वारा दी गई संगति, आत्मा के साथ संगति, अथवा आत्मा में भागीदारी के निकट अर्थों के लिए खुली है। मुख्य पाठ किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
- issue: ἀγάπη τοῦ θεοῦ में सम्बन्धकारक का अर्थ
  choice: परमेश्वर का प्रेम
  alternative: परमेश्वर का तुम्हारे प्रति प्रेम
  rationale: मुख्य पाठ मूल की संक्षिप्त रचना और सम्भावित अर्थ-व्यापकता बनाए रखता है; ‘तुम्हारे प्रति’ जोड़ने से अर्थ अधिक संकीर्ण हो जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘तुम सब’ बहुवचन ὑμῶν और πάντων की समावेशिता स्पष्ट करता है। वाक्य का आशीर्वचनात्मक स्वर बनाए रखने के लिए अंत में ‘रहे’ रखा गया है।
