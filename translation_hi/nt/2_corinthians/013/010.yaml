source:
  edition: SBLGNT
  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: hi
  text: इसी कारण मैं दूर रहते हुए ये बातें लिख रहा हूँ, ताकि उपस्थित होने पर मुझे उस अधिकार का कठोरता से प्रयोग न करना पड़े[a], जो प्रभु ने मुझे निर्माण के लिए दिया है, न कि ढाने के लिए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे कठोरता न बरतनी पड़े” अथवा “मुझे सख्ती से व्यवहार न करना पड़े।”
    reason: lexical_alternative
  - marker: b
    text: 'या, “उन्नति के लिए, विनाश के लिए नहीं।” यूनानी में निर्माण का रूपक है: “निर्माण के लिए, न कि ढाने के लिए।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह स्वाभाविक हिन्दी में पिछले संदर्भ से स्पष्ट कारण-परिणाम संबंध बनाए रखता है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: यूनानी बहुवचन को बनाए रखते हुए पत्र में कही गई बातों या चेतावनियों की ओर संकेत करता है।
- source_word: ἀπὼν γράφω
  choice: मैं दूर रहते हुए ... लिख रहा हूँ
  rationale: ἀπών और γράφω के संबंध को स्वाभाविक कालिक वाक्यांश में व्यक्त करता है तथा आगे παρών के साथ विरोध बनाए रखता है।
- source_word: ἵνα παρὼν
  choice: ताकि उपस्थित होने पर
  rationale: ἵνα का प्रयोजन और παρών का कालिक अर्थ स्पष्ट एवं संक्षिप्त रूप में व्यक्त होता है।
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: मुझे ... कठोरता से काम न लेना पड़े
  rationale: ἀποτόμως की कठोरता और χράομαι के प्रयोग/व्यवहार के भाव को सहज हिन्दी में व्यक्त करता है; संदर्भ में अनचाही आवश्यकता का निहित भाव भी सुरक्षित रहता है।
- source_word: κατὰ τὴν ἐξουσίαν
  choice: उस अधिकार के अनुसार
  rationale: κατά को अधिकार के अनुरूप कार्य करने के अर्थ में रखता है और ἐξουσία का सामान्य अर्थ 'अधिकार' देता है।
- source_word: ἣν ὁ κύριος ἔδωκέν μοι
  choice: जो प्रभु ने मुझे ... दिया है
  rationale: संबंधवाचक संरचना और κύριος की उपाधि को सुरक्षित रखता है; हिन्दी में प्राप्त और अब भी धारित अधिकार के लिए पूर्ण वर्तमान स्वाभाविक है।
- source_word: εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν
  choice: बनाने के लिए ... गिराने के लिए नहीं
  rationale: निर्माण और ध्वंस के परस्पर जुड़े रूपक को सरल, वर्तमान हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ‘प्रभु’ का निश्चित संदर्भ
  choice: केवल ‘प्रभु’ रखा गया है
  alternative: इसे स्पष्ट रूप से ‘प्रभु यीशु’ अथवा व्यापक अर्थ में परमेश्वर कहना
  rationale: यूनानी पाठ ὁ κύριος कहता है; अनुवाद इससे अधिक विशिष्ट धर्मवैचारिक पहचान आरोपित नहीं करता।
- issue: प्रेरितिक अधिकार का उद्देश्य
  choice: ‘बनाने के लिए ... गिराने के लिए नहीं’
  alternative: ‘उन्नति के लिए, विनाश के लिए नहीं’
  rationale: पाठ अधिकार के रचनात्मक उद्देश्य और उसके निषेधात्मक प्रतिपक्ष को साथ रखता है; निर्माण-रूपक को बनाए रखना इस तनाव को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘दूर रहते हुए/उपस्थित होने पर’ से मूल विरोध रखा गया है। निर्माण के रूपक को मुख्य पाठ में सुरक्षित रखा गया है।
