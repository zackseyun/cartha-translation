  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: hi
  text: 'मैं पहले कह चुका हूँ और अब अनुपस्थित रहते हुए पहले से कहता हूँ—जैसा दूसरी बार उपस्थित होकर कहा था—उन लोगों से जिन्होंने पहले पाप किया था और बाकी सभी से: यदि मैं फिर आऊँ[a], तो उन्हें नहीं बख्शूँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक स्पष्ट रूप से, “यदि मैं तीसरी बार आऊँ।” यूनानी में शाब्दिक रूप से “यदि मैं फिर आऊँ” है, पर पौलुस की यात्राओं का प्रसंग इसे दूसरी यात्रा के बाद की एक और यात्रा बताता है।
    reason: alternative_reading
lexical_decisions:
- source_word: προείρηκα
  choice: मैं पहले कह चुका हूँ
  rationale: पूर्णकालिक क्रिया पहले कही गई बात और उसकी बनी हुई प्रासंगिकता को व्यक्त करती है; इसे केवल ‘चेतावनी’ कहकर अर्थ को अधिक विशिष्ट नहीं किया गया।
- source_word: προλέγω
  choice: पहले से कहता हूँ
  rationale: यह ‘पहले ही कह देना’ व्यक्त करता है और προείρηκα के साथ शब्दगत संबंध बनाए रखता है; चेतावनी का भाव संदर्भ से उभरता है।
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: अब अनुपस्थित रहते हुए ... जैसे दूसरी बार उपस्थित रहते हुए कहा था
  rationale: संक्षिप्त यूनानी वाक्यांश में दूसरी बार की उपस्थिति और वर्तमान अनुपस्थिति का विरोध है। हिंदी शब्दक्रम इस संबंध को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: τοῖς προημαρτηκόσιν
  choice: उन लोगों से जिन्होंने पहले पाप किया था
  rationale: पूर्ण कृदंत उन लोगों की ओर संकेत करता है जिनका पिछला पाप पहले से विचाराधीन है; अनुवाद उनके पश्चात्ताप या अपश्चात्ताप का निर्णय नहीं करता।
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: बाकी सब लोगों से भी
  rationale: यह अभिव्यक्ति पहले बताए समूह के अतिरिक्त शेष सभी को समाविष्ट करती है। ‘भी’ दोनों संबोधित समूहों को स्वाभाविक हिंदी में जोड़ता है।
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: यदि मैं फिर आऊँगा
  rationale: यूनानी मुहावरे का सीधा अर्थ एक और आगमन है। तीसरी यात्रा कहना प्रसंग-सम्मत है, पर मूल अभिव्यक्ति से अधिक स्पष्ट व्याख्या होगी, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: οὐ φείσομαι
  choice: तो किसी को नहीं बख्शूँगा
  rationale: यह प्रचलित हिंदी मुहावरा कठोरता से न रुकने का अर्थ व्यक्त करता है। संदर्भगत कर्म ‘किसी को’ जोड़ने से हिंदी पूर्ण और स्वाभाविक बनती है, जबकि अनुशासन का कोई विशिष्ट संस्थागत रूप नहीं थोपा जाता।
theological_decisions:
- issue: पौलुस की चेतावनी की परिधि
  choice: चेतावनी पहले पाप कर चुके लोगों और बाकी सब लोगों—दोनों—को संबोधित है; लौटने पर पौलुस नरमी न बरतने की बात कहता है।
  alternative: चेतावनी केवल पहले पाप कर चुके लोगों के लिए समझी जाए, या इसे किसी निश्चित अनुशासन-पद्धति का उल्लेख माना जाए।
  rationale: वाक्य-विन्यास में दोनों समूह संबोधित हैं, पर मूल पाठ कार्रवाई का विशिष्ट रूप नहीं बताता। इसलिए व्यापक चेतावनी रखी गई है और किसी कलीसियाई शासन-पद्धति को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण शैली रखी गई है। लंबे यूनानी वाक्य की संबोधन-रचना को स्पष्ट करने के लिए डैश और द्विबिंदु का प्रयोग किया गया है; ‘बख्शूँगा’ सामान्य पाठक के लिए स्वाभाविक है और चेतावनी की गंभीरता बनाए रखता है।
