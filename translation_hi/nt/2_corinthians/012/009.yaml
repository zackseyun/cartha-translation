reference: 2 Corinthians 12:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: hi
  text: और उसने मुझसे कहा है, “मेरा अनुग्रह तेरे लिए पर्याप्त है, क्योंकि सामर्थ्य निर्बलता में पूर्ण होती है।” इसलिए मैं अपनी निर्बलताओं पर और भी अधिक आनन्द से गर्व करूँगा, ताकि मसीह की सामर्थ्य मुझ पर ठहर सके।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसीह की सामर्थ्य मुझ पर डेरा डाले”; मूल क्रिया में किसी के ऊपर तम्बू लगाने या निवास करने की छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκέν
  choice: कहा है
  rationale: पूर्णकाल के भूतकालीन कथन और उसकी वर्तमान, स्थायी प्रासंगिकता—दोनों को व्यक्त करता है।
- source_word: Ἀρκεῖ
  choice: पर्याप्त है
  rationale: यह χάρις की पर्याप्तता को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस के प्रयोग में निहित ईश्वरीय कृपा और कृपापूर्ण सहायता के व्यापक अर्थ को बनाए रखता है।
- source_word: δύναμις
  choice: सामर्थ्य
  rationale: पद में दोहराए गए संज्ञा-रूप को एक ही शब्द से रखता है और निर्बलता के साथ स्पष्ट विरोध बनाता है।
- source_word: ἀσθενείᾳ / ἀσθενείαις
  choice: निर्बलता / निर्बलताओं
  rationale: एकवचन में सामान्य सिद्धान्त और बहुवचन में पौलुस के ठोस अनुभवों के बीच का अंतर सुरक्षित रहता है।
- source_word: τελεῖται
  choice: पूर्ण होती है
  rationale: क्रिया के पूर्णता या लक्ष्य तक पहुँचने के भाव को संक्षिप्त हिन्दी में व्यक्त करता है; यह परमेश्वर की सामर्थ्य में नैतिक दोष होने का अनावश्यक संकेत नहीं देता।
- source_word: ἥδιστα ... μᾶλλον
  choice: और भी अधिक आनन्द से
  rationale: दोनों क्रियाविशेषणों की संयुक्त तीव्रता को सहज हिन्दी में व्यक्त करता है।
- source_word: καυχήσομαι
  choice: गर्व करूँगा
  rationale: पौलुस की निर्बलताओं पर गर्व करने की जानबूझकर रखी गई विरोधाभासी भाषा को बनाए रखता है।
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: मेरे ऊपर निवास करे
  rationale: ‘ऊपर डेरा डालने’ की मूल छवि को पठनीय रूप में रखते हुए उपस्थिति और आश्रय के भाव को व्यक्त करता है।
- source_word: Χριστοῦ
  choice: मसीह की
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; ‘मसीह’ हिन्दी में स्थापित और स्वाभाविक रूप है।
theological_decisions:
- issue: δύναμις के साथ स्वामित्व-सूचक सर्वनाम
  choice: सामर्थ्य
  alternative: मेरी सामर्थ्य
  rationale: दिए गए यूनानी पाठ में δύναμις के साथ μου नहीं है। वक्ता और आगे आने वाला ‘मसीह की सामर्थ्य’ संदर्भ स्पष्ट करते हैं, पर मुख्य पाठ में अनुपस्थित सर्वनाम जोड़कर अस्पष्टता को चुपचाप समाप्त नहीं किया गया।
- issue: τελεῖται का अर्थ
  choice: पूर्ण होती है
  alternative: सिद्ध होती है / अपनी पूर्णता तक पहुँचती है
  rationale: ‘पूर्ण होती है’ लक्ष्य या पूर्ण अभिव्यक्ति के भाव को बनाए रखता है और आधुनिक हिन्दी में संक्षिप्त है।
- issue: Χριστοῦ का अनुवाद
  choice: मसीह की
  alternative: क्राइस्ट की
  rationale: यहाँ शब्द उपाधि का कार्य करता है; इसलिए अर्थपूर्ण और हिन्दी में प्रचलित ‘मसीह’ चुना गया।
- issue: ἐπισκηνώσῃ की रूपकात्मक छवि
  choice: मेरे ऊपर निवास करे
  alternative: मेरे ऊपर डेरा डाले / मुझ पर छाया रहे
  rationale: मुख्य पाठ में स्वाभाविकता रखते हुए ‘ऊपर’ और स्थायी उपस्थिति का भाव बचाया गया है; अधिक शाब्दिक तम्बू-छवि पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण पर सहज स्तर रखा गया है। ‘तेरे’ को प्रत्यक्ष ईश्वरीय कथन की एकवचन आत्मीय संबोधन-शैली के लिए चुना गया है। ‘सामर्थ्य’ और ‘निर्बलता’ की पुनरावृत्ति मूल पाठ के मुख्य विरोध और धर्मवैचारिक तनाव को सुरक्षित रखती है।
