  yaml_path: translation/nt/2_corinthians/012/008.yaml
  text: Concerning this[d][c][b][a], three times I pleaded with the Lord that it might depart from me.
translation:
  language: hi
  text: इसके विषय में[a] मैंने तीन बार प्रभु[c] से विनती की[b] कि यह मुझसे दूर हो जाए[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस बारे में’ अथवा ‘इसके कारण’।
    reason: lexical_alternative
  - marker: b
    text: या ‘आग्रह किया’ अथवा ‘गिड़गिड़ाकर माँगा’।
    reason: lexical_alternative
  - marker: c
    text: यूनानी पाठ में केवल ‘प्रभु’ है; पौलुस यहाँ स्पष्ट रूप से यीशु का नाम नहीं लेते।
    reason: alternative_reading
  - marker: d
    text: या ‘यह मुझे छोड़ दे’ अथवा ‘यह मुझसे चला जाए’। यूनानी में कर्ता व्यक्त नहीं है; संकेत पिछले पद में बताई गई पीड़ा की ओर है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: इसके विषय में
  rationale: ὑπέρ के साथ संबंधकारक यहाँ पिछले पद में कही गई पीड़ा के विषय को सूचित करता है। ‘इसके विषय में’ उस संदर्भ-संबंध को स्पष्ट और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: τρὶς
  choice: तीन बार
  rationale: यह क्रियाविशेषण तीन अवसरों को दर्शाता है; ‘तीन बार’ आधुनिक हिंदी में सीधा और सहज है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: κύριος का सामान्य और प्रतिष्ठित हिंदी समतुल्य ‘प्रभु’ है। मूल पाठ यहाँ यीशु का नाम स्पष्ट रूप से नहीं जोड़ता।
- source_word: παρεκάλεσα
  choice: मैंने ... विनती की
  rationale: प्रार्थना के इस संदर्भ में παρακαλέω आग्रहपूर्ण निवेदन व्यक्त करता है। ‘विनती की’ गंभीरता रखता है, पर यूनानी से अधिक तीव्र अर्थ आरोपित नहीं करता।
- source_word: ἵνα ἀποστῇ ἀπ’ ἐμοῦ
  choice: कि यह मुझसे दूर हो जाए
  rationale: ἵνα निवेदन की विषय-वस्तु प्रस्तुत करता है और ἀποστῇ अलग या दूर हो जाने को व्यक्त करता है। हिंदी में ‘यह’ निहित कर्ता को पिछले संदर्भ से जोड़ता है, बिना उसे काँटा या दूत के रूप में निश्चित किए।
theological_decisions:
- issue: ‘प्रभु’ का संदर्भ
  choice: केवल ‘प्रभु’ रखा गया
  alternative: ‘प्रभु यीशु’
  rationale: इस संदर्भ में संकेत संभवतः यीशु की ओर है, पर यूनानी पाठ में केवल κύριον है। नाम जोड़ना मूल की अपेक्षा अधिक विशिष्ट होगा।
- issue: ἀποστῇ का निहित कर्ता
  choice: नपुंसक-संदर्भात्मक ‘यह’
  alternative: ‘वह दूत’ या ‘वह काँटा’
  rationale: पिछले पद में ‘शरीर में काँटा’ और ‘शैतान का दूत’ दोनों आते हैं। ‘यह’ उस संदर्भगत अस्पष्टता को अनावश्यक रूप से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और प्रार्थनात्मक स्वर रखा गया है। वाक्य-क्रम हिंदी की स्वाभाविकता के अनुसार है; मूल पाठ की संदर्भगत और धर्मवैज्ञानिक अस्पष्टताएँ सुरक्षित रखी गई हैं।
