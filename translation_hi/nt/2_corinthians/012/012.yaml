source:
  edition: SBLGNT
  text: τὰ μὲν σημεῖα τοῦ ἀποστόλου κατειργάσθη ἐν ὑμῖν ἐν πάσῃ ⸀ὑπομονῇ, σημείοις ⸀τε καὶ τέρασιν καὶ δυνάμεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: hi
  text: सचमुच, एक प्रेरित[a] के चिन्ह तुम्हारे बीच बड़े धीरज के साथ, चिन्हों, अद्भुत कार्यों और सामर्थ्य के कार्यों[b] के द्वारा किए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस प्रेरित के”; इससे विशेष रूप से पौलुस की ओर संकेत समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “सामर्थ्य के कार्यों” का अनुवाद “चमत्कार” या “पराक्रम के कार्य” भी किया जा सकता है; यूनानी शब्द सामर्थ्य प्रकट करने वाले कार्यों पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: सचमुच, ... चिन्ह
  rationale: μέν यहाँ बिना व्यक्त δέ के कथन पर पुष्टिकारक बल देता है। ‘सचमुच’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है और σημεῖα को ‘चिन्ह’ रखता है।
- source_word: τοῦ ἀποστόλου
  choice: एक प्रेरित के
  rationale: 'सम्बन्धकारक पद को सामान्य अथवा गुणसूचक अर्थ में लिया गया है: वे चिन्ह जो प्रेरित की सेवकाई को प्रमाणित करते हैं। निश्चित उपपद के कारण सम्भव ‘उस प्रेरित के’ अर्थ को पादटिप्पणी में रखा गया है।'
- source_word: κατειργάσθη
  choice: दिखाए गए
  rationale: यूनानी क्रिया कर्मवाच्य है और किसी बात को कार्यरूप में सम्पन्न या प्रदर्शित किए जाने का भाव देती है। प्रसंग में ‘दिखाए गए’ स्वाभाविक है तथा कर्ता को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: यह कुरिन्थियों के समुदाय में हुई प्रेरिताई सेवकाई की ओर संकेत करता है, न कि उनके भीतर की किसी आन्तरिक दशा की ओर।
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: पूरे धीरज के साथ
  rationale: ὑπομονή कठिनाई में स्थिर बने रहने को दर्शाता है। ‘पूरे धीरज के साथ’ इस परिस्थिति और रीति दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: अर्थात चिन्ह, अद्भुत काम और सामर्थ्य के काम
  rationale: इस त्रिपदी को पिछले ‘चिन्हों’ की व्याख्या के रूप में रखा गया है। σημεῖα, τέρατα और δυνάμεις के भेद को क्रमशः ‘चिन्ह’, ‘अद्भुत काम’ और ‘सामर्थ्य के काम’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘एक प्रेरित के चिन्ह’ का आशय
  choice: इसे प्रेरिताई सेवकाई को प्रमाणित करने वाले चिन्हों के रूप में प्रस्तुत किया गया है, जिनके साथ धीरज और अलौकिक सामर्थ्य के कार्य जुड़े हैं।
  alternative: इसे केवल चमत्कारों की ऐसी निश्चित सूची माना जाए जो अपने आप में प्रेरित होने की पूर्ण परिभाषा है।
  rationale: वाक्य पहले प्रेरित के चिन्हों का समग्र कथन करता है, फिर धीरज और चिन्हों, अद्भुत कामों तथा सामर्थ्य के कामों का उल्लेख करता है। अनुवाद इससे आगे कोई निश्चित धर्मसैद्धान्तिक सूची निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामुदायिक पाठ के अनुकूल शैली रखी गई है। ‘प्रेरित’, ‘चिन्ह’ और ‘धीरज’ जैसे परिचित बाइबलीय शब्द बनाए रखते हुए वाक्य-विन्यास को स्वाभाविक किया गया है।
