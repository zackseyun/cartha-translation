language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: hi
  text: क्योंकि यदि मैं घमण्ड करना चाहूँ भी, तो मूर्ख न ठहरूँगा, क्योंकि मैं सत्य ही कहूँगा। फिर भी मैं अपने को रोकता हूँ, ताकि कोई मेरे बारे में उससे अधिक न सोचे, जो वह मुझ में देखता है या मुझसे कुछ सुनता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θελήσω καυχήσασθαι
  choice: घमण्ड करना चाहूँ भी
  rationale: ἐὰν के साथ aorist subjunctive एक काल्पनिक संभावना व्यक्त करता है। ‘चाहूँ भी’ उस सशर्त भाव और पौलुस की अनिच्छुक आत्म-प्रशंसा, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: οὐκ ἔσομαι ἄφρων
  choice: मूर्ख न ठहरूँगा
  rationale: भविष्यकालीन ἔσομαι और विधेय ἄφρων को बनाए रखते हुए यह हिन्दी अभिव्यक्ति केवल व्यवहार नहीं, बल्कि उस स्थिति में पौलुस के मूल्यांकन को व्यक्त करती है।
- source_word: ἀλήθειαν γὰρ ἐρῶ
  choice: क्योंकि मैं सत्य ही कहूँगा
  rationale: ἐρῶ के भविष्यकाल और ἀλήθειαν के स्पष्ट बल को रखा गया है; ‘ही’ इस बात पर जोर देता है कि संभावित घमण्ड तथ्य से परे न होता।
- source_word: φείδομαι
  choice: मैं अपने को रोकता हूँ
  rationale: संदर्भ में क्रिया का अर्थ आगे घमण्ड करने से रुकना या संयम बरतना है। यह आधुनिक हिन्दी में ‘मैं विरत रहता हूँ’ से अधिक सहज है।
- source_word: λογίσηται
  choice: समझे
  rationale: यहाँ λογίζομαι किसी के विषय में मूल्यांकन या धारणा बनाने के अर्थ में है। ‘समझे’ सामान्य पाठक के लिए स्वाभाविक है और ‘गिने’ की कृत्रिमता से बचता है।
- source_word: ὑπὲρ ὃ
  choice: उससे बढ़कर
  rationale: ὑπέρ यहाँ दिखाई या सुनाई देने वाले प्रमाण से अधिक ऊँचा मूल्यांकन करने का भाव देता है।
- source_word: βλέπει με ἢ ἀκούει τι ἐξ ἐμοῦ
  choice: जैसा वह मुझे देखता है या मुझसे कुछ सुनता है
  rationale: वाक्यांश प्रत्यक्ष अवलोकन और पौलुस से सुनी बात को मूल्यांकन का आधार बनाए रखता है। τι को ‘कुछ’ के रूप में स्पष्ट रखा गया है, इसलिए अलग पाठ-टिप्पणी आवश्यक नहीं है।
theological_decisions:
- issue: पौलुस का संभावित घमण्ड और उसका संयम
  choice: पौलुस कहता है कि यदि वह घमण्ड करता तो उसकी बात सत्य होती और इसलिए वह मूर्ख न ठहरता; फिर भी वह लोगों द्वारा बढ़ा-चढ़ाकर आँके जाने से बचने के लिए रुकता है।
  alternative: इसे या तो घमण्ड का सामान्य समर्थन मानना, या हर प्रकार के घमण्ड को यहाँ अनिवार्य रूप से झूठा और पापपूर्ण बताना।
  rationale: यूनानी पाठ सत्य बोलने की उसकी क्षमता और स्वेच्छा से बरते गए संयम के बीच तनाव बनाए रखता है। अनुवाद इससे कोई व्यापक साम्प्रदायिक या सिद्धान्तगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘घमण्ड’ पौलुस की प्रसंगगत, कुछ हद तक विडंबनापूर्ण आत्म-प्रशंसा को व्यक्त करता है; ‘अपने को रोकता हूँ’ संयम को बोलचाल की अतिसाधारणता के बिना स्पष्ट करता है।
