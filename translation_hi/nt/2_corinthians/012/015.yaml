reference: 2 Corinthians 12:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: hi
  text: पर मैं तुम्हारे प्राणों[a] के लिए बहुत प्रसन्नता से खर्च करूँगा और स्वयं भी खर्च हो जाऊँगा। यदि मैं तुमसे और भी अधिक प्रेम करता हूँ, तो क्या मुझसे कम प्रेम किया जाता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे जीवन के लिए” अथवा “तुम्हारे लिए।”
    reason: ψυχή यहाँ प्राण, जीवन, या स्वयं व्यक्ति को सूचित कर सकता है।
lexical_decisions:
- source_word: ἥδιστα
  choice: बड़े आनंद से
  rationale: यह अतिशयोक्तिपरक क्रियाविशेषण पौलुस की अत्यंत प्रसन्न और तत्पर इच्छा व्यक्त करता है; यह केवल अनिच्छापूर्वक सहमति का भाव नहीं देता।
- source_word: δαπανήσω
  choice: खर्च करूँगा
  rationale: यह संसाधनों को खर्च करने का रूपक बनाए रखता है और इसके साथ आने वाले तीव्रतर निष्क्रिय रूप से स्वाभाविक रूप से जुड़ता है।
- source_word: ἐκδαπανηθήσομαι
  choice: स्वयं भी खर्च हो जाऊँगा
  rationale: 'यह पहले क्रिया-रूपक को तीव्र करता है: पौलुस केवल अपनी वस्तुएँ ही नहीं, स्वयं को भी अर्पित करने को तैयार है। ''स्वयं भी'' यूनानी में निहित विरोधात्मक तीव्रता को हिंदी में स्पष्ट करता है।'
- source_word: ὑπὲρ
  choice: के लिए
  rationale: यहाँ यह लाभ और हित के अर्थ में है; 'के लिए' संक्षिप्त, सहज और बलिदानी प्रयोजन के अनुकूल है।
- source_word: τῶν ψυχῶν ὑμῶν
  choice: तुम्हारे प्राणों
  rationale: '''प्राण'' व्यक्ति के जीवन और भीतरी अस्तित्व—दोनों की ओर संकेत कर सकता है, इसलिए ψυχή की अर्थ-व्याप्ति को किसी कठोर तकनीकी मानव-विज्ञान में सीमित नहीं करता।'
- source_word: εἰ
  choice: यदि
  rationale: यह प्रश्न की शर्तात्मक रचना को बनाए रखता है और उसे चुपचाप कारणसूचक 'क्योंकि' या सहसंबंधी 'जितना...उतना' में नहीं बदलता।
- source_word: περισσοτέρως
  choice: और भी अधिक
  rationale: यह तुलनात्मक तीव्रता को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἀγαπῶν
  choice: मैं ... प्रेम करता हूँ
  rationale: यूनानी कृदंत को हिंदी के स्वाभाविक शर्तात्मक वाक्य में सीमित क्रिया के रूप में प्रस्तुत किया गया है।
- source_word: ἧσσον
  choice: कम
  rationale: यह περισσοτέρως के साथ मूल तुलनात्मक विरोध को स्पष्ट और संक्षिप्त रूप से बनाए रखता है।
- source_word: ἀγαπῶμαι
  choice: मुझसे ... प्रेम किया जाता है
  rationale: निष्क्रिय वाच्य को सुरक्षित रखा गया है, जिससे मूल पाठ की अनिर्दिष्ट कर्ता-संबंधी अस्पष्टता बनी रहती है।
theological_decisions:
- issue: पौलुस के पासबानी संदर्भ में ψυχαί का अर्थ
  choice: तुम्हारे प्राणों
  alternative: तुम्हारे जीवनों; तुम लोगों के लिए
  rationale: '''प्राणों'' पौलुस की गहरी व्यक्तिगत और आत्मिक चिंता को व्यक्त करता है, पर ψυχή को केवल देह से अलग तकनीकी ''आत्मा'' मानने के लिए बाध्य नहीं करता।'
- issue: ἀγαπῶμαι के निष्क्रिय वाच्य का कर्ता
  choice: निष्क्रिय रूप—'मुझसे कम प्रेम किया जाता है'
  alternative: सक्रिय रूप—'तुम मुझसे कम प्रेम करते हो'
  rationale: संदर्भ में कुरिन्थियों का कर्ता होना संभावित है, फिर भी यूनानी पाठ उसे स्पष्ट नहीं करता; निष्क्रिय हिंदी मूल की उस खुली संरचना को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। 'खर्च करूँगा ... खर्च हो जाऊँगा' जानबूझकर दोहराया गया है ताकि यूनानी शब्द-युग्म का आर्थिक और आत्म-बलिदानी रूपक बना रहे।
