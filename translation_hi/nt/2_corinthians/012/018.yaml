id: 2CO.12.18
reference: 2 Corinthians 12:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: hi
  text: मैंने तीतुस से आग्रह किया और उसके साथ उस भाई को भेजा। क्या तीतुस ने तुमसे अनुचित लाभ उठाया? क्या हम एक ही मनोभाव से नहीं चले? क्या हम उन्हीं पदचिह्नों पर नहीं चले?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσα Τίτον
  choice: मैंने तीतुस से आग्रह किया
  rationale: παρακαλέω यहाँ सेवाकार्य से जुड़े व्यावहारिक अनुरोध को व्यक्त करता है। ‘आग्रह किया’ उसकी earnest force को स्वाभाविक हिन्दी में रखता है; यूनानी पाठ में ‘जाने’ का स्पष्ट क्रियापद नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: συναπέστειλα
  choice: उसके साथ ... भेजा
  rationale: संयुक्त क्रिया किसी व्यक्ति को तीतुस के साथ भेजने का भाव देती है। हिन्दी में ‘उसके साथ ... भेजा’ यह संबंध स्पष्ट और सहज बनाता है।
- source_word: τὸν ἀδελφόν
  choice: उस भाई को
  rationale: यूनानी में निश्चित उपपद है, पर कोई अधिकारसूचक सर्वनाम नहीं। ‘उस भाई’ किसी परिचित मसीही भाई की ओर संकेत करता है और ‘हमारे’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος
  choice: क्या तीतुस ने तुम्हारा अनुचित लाभ उठाया?
  rationale: μήτι ऐसे प्रश्न का परिचय देता है जिसका अपेक्षित उत्तर ‘नहीं’ है। πλεονεκτέω अपने लाभ के लिए किसी का शोषण करने का व्यापक भाव रखता है; ‘अनुचित लाभ उठाया’ आर्थिक संदर्भ को समेटते हुए ‘ठगा’ से कम संकीर्ण है।
- source_word: τῷ αὐτῷ πνεύματι
  choice: एक ही आत्मा के अनुसार
  rationale: दत्तिव कारक रीति, क्षेत्र या माध्यम सूचित कर सकता है। यह वाक्यांश साझा भीतरी भाव और पवित्र आत्मा—दोनों संभावनाओं को पूरी तरह बंद नहीं करता; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: περιεπατήσαμεν
  choice: चले
  rationale: ‘चलना’ पौलुस के आचरण-संबंधी रूपक को बनाए रखता है और अगले ‘पदचिह्नों’ के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: उन्हीं पदचिह्नों पर
  rationale: ἴχνος का शाब्दिक अर्थ पदचिह्न या पगचिह्न है और यहाँ समान आचरण-पद्धति का रूपक है। ‘उन्हीं पदचिह्नों पर’ इस चित्रात्मकता को बनाए रखता है।
theological_decisions:
- issue: τῷ αὐτῷ πνεύματι में πνεῦμα का आशय
  choice: मुख्य पाठ में ‘एक ही आत्मा के अनुसार’, जिससे साझा भीतरी भाव या प्रवृत्ति का अर्थ संदर्भ में सुना जा सकता है
  alternative: ‘एक ही आत्मा के द्वारा’, जहाँ आत्मा से पवित्र आत्मा अभिप्रेत हो सकता है
  rationale: तात्कालिक संदर्भ पौलुस और तीतुस के एक-समान निष्कपट आचरण पर बल देता है, पर यूनानी दत्तिव और πνεῦμα पवित्र आत्मा के संदर्भ की संभावना भी रखते हैं। मुख्य पाठ और पादटिप्पणी मिलकर इस धर्मवैज्ञानिक तनाव को बिना निर्णायक रूप से सुलझाए सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चलना’ और ‘पदचिह्न’ के जुड़े हुए रूपकों को सुरक्षित रखा गया है। प्रश्नों का रूप ऐसा है कि अपेक्षित नकारात्मक उत्तर संदर्भ से स्पष्ट रहे।
