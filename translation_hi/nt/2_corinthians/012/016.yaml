source:
  edition: SBLGNT
  text: ἔστω δέ, ἐγὼ οὐ κατεβάρησα ὑμᾶς· ἀλλὰ ὑπάρχων πανοῦργος δόλῳ ὑμᾶς ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: hi
  text: 'पर मान लिया जाए: मैंने तुम पर बोझ नहीं डाला; लेकिन धूर्त होकर मैंने तुम्हें छल से फँसा लिया।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर ऐसा ही सही,” “खैर, ऐसा मान लिया जाए,” अथवा “मान लो कि ऐसा ही है”; पौलुस तर्क के लिए यह बात स्वीकार करता जान पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: '“धूर्त होकर मैंने तुम्हें छल से फँसा लिया” संभवतः पौलुस की वास्तविक स्वीकारोक्ति नहीं, बल्कि उस पर लगाए गए आरोप की व्यंग्यात्मक पुनरुक्ति है। इसका अनुवाद यह भी हो सकता है: “धूर्त होकर मैंने छल से तुम्हारा लाभ उठाया” या “मैंने तुम्हें चालाकी से जाल में फँसा लिया।”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω δέ
  choice: पर मान लिया कि
  rationale: यह वाक्यांश तर्क के लिए किसी बात को मान लेने की रियायती और आलंकारिक भूमिका निभाता है; यह हिंदी में स्वाभाविक है और आशय को अनावश्यक रूप से नहीं खोलता।
- source_word: κατεβάρησα
  choice: बोझ नहीं डाला
  rationale: संदर्भ में मुख्यतः आर्थिक या भौतिक भार का संकेत है, जबकि ‘बोझ’ यूनानी रूपक की व्यापकता बनाए रखता है।
- source_word: ὑπάρχων πανοῦργος
  choice: चतुर होकर
  rationale: सहभागी क्रिया की संरचना रखी गई है। संदर्भ में ‘चतुर’ नकारात्मक, धूर्ततापूर्ण आरोप का भाव ग्रहण करता है, जिसे अगला ‘छल’ स्पष्ट करता है।
- source_word: δόλῳ
  choice: छल से
  rationale: करणवाचक दत्तिव का संक्षिप्त और स्वाभाविक हिंदी रूप, जो कपटपूर्ण साधन का आरोप व्यक्त करता है।
- source_word: ἔλαβον
  choice: फँसा लिया
  rationale: यहाँ साधारण ‘लेना’ हिंदी में अस्पष्ट और अस्वाभाविक होगा; ‘फँसा लिया’ युक्ति से पकड़ने के प्रसंगगत भाव को व्यक्त करता है, फिर भी आर्थिक शोषण का अर्थ सीधे आरोपित नहीं करता।
theological_decisions:
- issue: क्या ἀλλὰ के बाद के शब्द पौलुस की वास्तविक स्वीकारोक्ति हैं या उस पर लगाए गए आरोप की व्यंग्यात्मक पुनरुक्ति
  choice: मुख्य पाठ में आरोप को सीधे कथन के रूप में रखा गया है और विस्मयादिबोधक चिह्न से उसकी व्यंग्यात्मक धार संकेतित की गई है; पादटिप्पणी संदर्भ स्पष्ट करती है।
  alternative: पर चूँकि मैं धूर्त था, इसलिए मैंने छल से तुम्हारा लाभ उठाया।
  rationale: आसपास के संदर्भ में पौलुस शोषण से इनकार करता है; इसलिए यह संभवतः विरोधियों के आरोप की व्यंग्यात्मक प्रतिध्वनि है। फिर भी मुख्य पाठ में व्यंग्य को स्पष्ट परिभाषा बनाकर नहीं जोड़ा गया, ताकि मूल का तनाव बना रहे।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और मौखिक रूप से स्वाभाविक शैली। ‘तुम’ बहुवचन मंडली के लिए रखा गया है। ‘चतुर’ को अकेले सकारात्मक समझे जाने की संभावना अगले पदबंध ‘छल से फँसा लिया’ और पादटिप्पणी से नियंत्रित होती है।
