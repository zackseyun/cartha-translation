review_pass:
  verdict: revise
  source_fidelity: The draft correctly carries forward the fear introduced in the preceding context, preserves the repeated coming, God's possible humbling of Paul in relation to the Corinthians, and the three distinct vice terms. However, “मुझे ... शोक करना पड़े” introduces an unnecessary sense of compulsion, whereas πενθήσω is a straightforward future, “I will mourn.” “जिनमें वे लगे रहे” also overstates an ongoing aspect not required by the aorist ἔπραξαν and is less precise for the collective antecedent.
  naturalness: The register is generally clear modern Hindi. Recasting the future mourning as “मैं ... शोक करूँगा” is both more direct and more faithful. “जिनका उन्होंने आचरण किया” naturally refers collectively to the listed behaviors without imposing a durative meaning.
  terminology: “परमेश्वर,” “मन फिराना,” “अशुद्धता,” and “यौन अनैतिकता” are appropriate. “निर्लज्ज कामुकता” suitably communicates the shameless and sexually unrestrained connotations of ἀσέλγεια without reducing it to a narrowly defined offense.
  issues:
  - severity: medium
    issue: “मुझे उन बहुतों के लिए शोक करना पड़े” renders πενθήσω with compulsion.
    rationale: The Greek future states that Paul will mourn; it does not say that he will be forced or obliged to mourn. The feared outcome can be expressed in Hindi without “पड़े.”
  - severity: medium
    issue: “जिनमें वे लगे रहे” gives ἔπραξαν an unwarranted continuing sense.
    rationale: πράσσω can concern practiced conduct, but the aorist here does not require “kept engaging.” A collective expression for the listed conduct is more exact.
