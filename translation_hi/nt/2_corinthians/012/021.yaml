id: 2CO.12.21
reference: 2 Corinthians 12:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: hi
  text: मुझे डर है कि जब मैं फिर आऊँगा[a], तो कहीं मेरा परमेश्वर मुझे तुम्हारे सामने दीन न करे[b], और मैं उन बहुतों के लिए शोक करूँगा जिन्होंने पहले पाप किया है और उस अशुद्धता, यौन अनैतिकता और निर्लज्ज कामुकता से मन नहीं फिराया, जिनका उन्होंने आचरण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब मैं लौटकर आऊँगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “मुझे तुम्हारे बीच नीचा करे।” यूनानी क्रिया का अर्थ प्रसंग के अनुसार दीन करना, नीचा करना या अपमानित करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: जब मैं फिर आऊँगा
  rationale: पद 20 के भय-सूचक कथन को आगे बढ़ाते हुए μή आशंका व्यक्त करता है; πάλιν आगमन के दोबारा होने को सूचित करता है।
- source_word: ταπεινώσῃ με ὁ θεός μου πρὸς ὑμᾶς
  choice: कहीं मेरा परमेश्वर मुझे तुम्हारे सामने दीन न करे
  rationale: ταπεινόω का मूल भाव दीन करना या नीचा करना है; πρὸς ὑμᾶς को इस भेंट के प्रसंग में उनकी उपस्थिति के अर्थ में लिया गया है।
- source_word: πενθήσω
  choice: मुझे ... शोक करना पड़े
  rationale: क्रिया गहरे शोक या विलाप को व्यक्त करती है; आशंका की पूरी संरचना से जुड़ने के कारण हिंदी में संभावित परिणाम के रूप में यह स्वाभाविक है।
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: उन बहुतों के लिए ... जिन्होंने पहले पाप किया है
  rationale: संबंधसूचक रचना 'बहुतों' को पहले पाप करने वालों के बड़े समूह में रखती है; पूर्णकालिक कृदंत पूर्व पाप की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: μὴ μετανοησάντων
  choice: मन नहीं फिराया
  rationale: μετανοέω के लिए 'मन फिराना' प्रचलित, सहज और नैतिक दिशा-परिवर्तन को व्यक्त करने वाला हिंदी पद है।
- source_word: ἀκαθαρσίᾳ
  choice: अशुद्धता
  rationale: यह नैतिक अशुद्धता का व्यापक अर्थ बनाए रखता है।
- source_word: πορνείᾳ
  choice: यौन अनैतिकता
  rationale: यह आधुनिक हिंदी में πορνεία का व्यापक और स्पष्ट अर्थ देता है, उसे किसी एक विशेष यौन अपराध तक सीमित नहीं करता।
- source_word: ἀσελγείᾳ
  choice: निर्लज्ज कामुकता
  rationale: ἀσέλγεια में बेशर्मी और अनियंत्रित आचरण का भाव है, जो यहाँ यौन संदर्भ वाली दोष-सूची में आता है।
- source_word: ᾗ ἔπραξαν
  choice: जिनमें वे लगे रहे
  rationale: एकवचन संबंधवाचक सर्वनाम तीनों दोषों को सामूहिक रूप से संदर्भित करता है; πράσσω लगातार किए गए आचरण का संकेत दे सकता है।
theological_decisions:
- issue: μή के साथ पद 20 से जारी भय-सूचक वाक्य की शक्ति
  choice: '''मुझे डर है ... कहीं ... न करे'' के रूप में स्पष्ट किया'
  alternative: '''ऐसा न हो कि जब मैं फिर आऊँ...'''
  rationale: यूनानी में भय व्यक्त करने वाली क्रिया पिछले पद से समझी जाती है; हिंदी में उसे दोहराने से वाक्य स्पष्ट होता है और कोई नया धर्मवैज्ञानिक दावा नहीं जुड़ता।
- issue: ταπεινόω में दीन किए जाने और अपमानित किए जाने के बीच अर्थ-छाया
  choice: दीन न करे
  alternative: अपमानित न करे / नीचा न दिखाए
  rationale: '''दीन करना'' ईश्वर द्वारा पौलुस को नीचे लाए जाने का भाव सुरक्षित रखता है, बिना सार्वजनिक अपमान के अर्थ को अनिवार्य बनाए।'
- issue: तीन नैतिक दोषों की विशिष्टता
  choice: अशुद्धता, यौन अनैतिकता और निर्लज्ज कामुकता
  alternative: मलिनता, व्यभिचार और लुचपन
  rationale: मूल पाठ के तीन परस्पर संबंधित किंतु अलग पदों को अलग रखा गया है और किसी संप्रदायगत संकीर्ण परिभाषा में नहीं बाँधा गया।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। भय की लंबी यूनानी संरचना को स्वाभाविक हिंदी में रखा गया है; दोष-सूची की संचयी शक्ति और अर्थगत भिन्नता सुरक्षित है।
