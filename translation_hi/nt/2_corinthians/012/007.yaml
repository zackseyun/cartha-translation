source:
  edition: SBLGNT
  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: hi
  text: और रहस्योद्घाटनों की असाधारण महानता के कारण—ताकि मैं अभिमान से फूल न जाऊँ—मेरे शरीर में एक काँटा दिया गया[a], अर्थात् शैतान का एक दूत[b], ताकि वह मुझे घूँसे मारता रहे[c], ताकि मैं अभिमान से फूल न जाऊँ[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे शरीर में एक नुकीला खूंटा दिया गया।” यूनानी शब्द काँटे, नुकीली खपच्ची या खूंटे का अर्थ दे सकता है; ठीक बिंब निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “शैतान का एक स्वर्गदूत।” यूनानी शब्द का अर्थ “दूत” या “स्वर्गदूत” हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या “ताकि वह मुझे सताता रहे” अथवा “मुझ पर प्रहार करता रहे।” यूनानी क्रिया का शाब्दिक अर्थ घूँसे मारना या प्रहार करना है।
    reason: lexical_alternative
  - marker: d
    text: “ताकि मैं अभिमान से फूल न जाऊँ” वाक्यांश यूनानी पाठ में दो बार आया है और यहाँ दोनों बार रखा गया है।
    reason: textual_transparency
lexical_decisions:
- source_word: τῇ ὑπερβολῇ τῶν ἀποκαλύψεων
  choice: प्रकाशनों की अत्यधिक महानता के कारण
  rationale: यह पदबंध प्रकाशनों की असाधारण महत्ता या विशालता को व्यक्त करता है। ‘प्रकाशन’ पौलुस के संदर्भ में दिव्य रहस्योद्घाटनों के लिए स्वाभाविक और सटीक है।
- source_word: ὑπεραίρωμαι
  choice: मैं अपने आपको ऊँचा न समझूँ
  rationale: यह क्रिया स्वयं को ऊँचा उठाने, अत्यधिक गर्वित होने या घमण्ड करने का भाव रखती है। यह चयन आत्म-संबंधी अर्थ को बनाए रखता है और दोनों आवृत्तियों में समान रूप से प्रयुक्त हुआ है।
- source_word: ἐδόθη μοι
  choice: मुझे ... दिया गया
  rationale: कर्मवाच्य को बनाए रखने से देनेवाले की पहचान अनकही रहती है; मूल पाठ भी यहाँ कर्ता को स्पष्ट नहीं करता।
- source_word: σκόλοψ τῇ σαρκί
  choice: मेरे शरीर में एक काँटा
  rationale: σκόλοψ किसी काँटे, नुकीली खपच्ची या खूंटे का बोध करा सकता है। ‘काँटा’ रूपक को स्वाभाविक रूप में रखता है, जबकि τῇ σαρκί को इस ठोस संदर्भ में ‘शरीर में’ कहना आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἄγγελος Σατανᾶ
  choice: शैतान का एक दूत
  rationale: ἄγγελος का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। ‘दूत’ प्राणी अथवा माध्यम की सटीक प्रकृति तय किए बिना मूल अस्पष्टता बनाए रखता है।
- source_word: κολαφίζῃ
  choice: वह मुझे घूँसे मारे
  rationale: क्रिया का ठोस अर्थ घूँसों से मारना या लगातार प्रहार करना है। यह चयन मूल के हिंसक बिंब को बनाए रखता है; व्यापक अर्थ ‘सताए’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘शरीर में काँटा’ की प्रकृति
  choice: रूपक को बिना व्याख्यात्मक पहचान दिए बनाए रखा गया है।
  alternative: शारीरिक बीमारी, विरोधी या सताव, अथवा दुष्टात्मिक उत्पीड़न
  rationale: मूल यूनानी पाठ इस पीड़ा की ठीक पहचान नहीं बताता; इसलिए किसी एक धार्मिक या ऐतिहासिक व्याख्या को मुख्य पाठ में थोपना उचित नहीं है।
- issue: ‘दिया गया’ में कर्ता
  choice: अनिर्दिष्ट कर्मवाच्य रखा गया है।
  alternative: ‘परमेश्वर ने मुझे दिया’ या ‘इसे होने दिया गया’
  rationale: पाठ देनेवाले को नाम से नहीं बताता। कर्मवाच्य दिव्य अनुमति और शैतानी माध्यम के बीच निहित तनाव को सुरक्षित रखता है।
- issue: ἄγγελος Σατανᾶ की पहचान
  choice: ‘शैतान का एक दूत’
  alternative: ‘शैतान का एक स्वर्गदूत’ या कोई मानवीय प्रतिनिधि
  rationale: ἄγγελος का अर्थ व्यापक है; ‘दूत’ उसकी सत्तात्मक पहचान निश्चित नहीं करता।
- issue: उद्देश्य-वाक्य की पुनरावृत्ति
  choice: ‘ताकि मैं अपने आपको ऊँचा न समझूँ’ दोनों बार रखा गया है।
  alternative: दूसरी आवृत्ति को शैलीगत पुनरुक्ति मानकर छोड़ देना
  rationale: SBLGNT के प्रस्तुत पाठ में वाक्यांश दोनों बार है; पुनरावृत्ति पौलुस के कथन के जोर और संरचना का अंग है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। वाक्य की अग्रस्थ कारण-संरचना और बीच के उद्देश्य-वाक्य को दीर्घ विराम-चिह्नों से स्पष्ट किया गया है। ‘देह’ की अपेक्षा ‘शरीर’ अधिक सहज है और यहाँ σάρξ के ठोस, शारीरिक संदर्भ को व्यक्त करता है।
