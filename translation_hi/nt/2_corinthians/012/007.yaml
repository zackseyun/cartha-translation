review_pass:
  verdict: revise
  source_fidelity: The draft preserves the passive ‘was given,’ the undefined metaphor of σκόλοψ, the ambiguity of ἄγγελος, the force of κολαφίζῃ, and the repeated purpose clause. However, ‘प्रकाशनों’ ordinarily means publications in modern Hindi and does not reliably communicate ἀποκαλύψεων (‘revelations’).
  naturalness: The sentence structure, em-dash parenthesis, and ‘शरीर में एक काँटा’ are clear and suitably dignified. ‘मैं अपने आपको ऊँचा न समझूँ’ is understandable but less idiomatic and less precise for the warning against becoming conceited than ‘मैं अभिमान से फूल न जाऊँ.’
  terminology: ‘रहस्योद्घाटन’ accurately expresses divine revelation in this context without identifying its content. ‘शैतान का एक दूत’ appropriately retains the lexical ambiguity of ἄγγελος; the footnote supplies ‘स्वर्गदूत’ as the alternative. ‘घूँसे मारता रहे’ preserves the repeated-buffeting sense of κολαφίζῃ.
  issues:
  - severity: medium
    issue: ‘प्रकाशनों’ for ἀποκαλύψεων
    rationale: In standard contemporary Hindi, ‘प्रकाशन’ most commonly denotes a publication or publishing. ‘रहस्योद्घाटन’ communicates disclosed revelation and avoids a misleading secular sense.
  - severity: low
    issue: ‘अपने आपको ऊँचा न समझूँ’ for ὑπεραίρωμαι
    rationale: The Greek conveys becoming overly elated or conceited, not merely judging oneself highly. ‘अभिमान से फूल न जाऊँ’ is idiomatic Hindi and better reflects the inceptive/passive-middle force.
