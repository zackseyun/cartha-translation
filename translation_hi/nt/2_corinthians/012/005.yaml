  text: ὑπὲρ τοῦ τοιούτου καυχήσομαι, ὑπὲρ δὲ ἐμαυτοῦ οὐ καυχήσομαι εἰ μὴ ἐν ταῖς ⸀ἀσθενείαις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/005.yaml
  text: On behalf of such a one I will boast[a], but on behalf of myself I will not boast[b], except in my weaknesses.
translation:
  language: hi
  text: ऐसे व्यक्ति के विषय में तो मैं घमंड करूँगा[a], पर अपने विषय में घमंड नहीं करूँगा; केवल अपनी निर्बलताओं को लेकर घमंड करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऐसे व्यक्ति की ओर से।” यूनानी पूर्वसर्ग का अर्थ अधिक सामान्य रूप से “के विषय में” भी हो सकता है; यहाँ की अप्रत्यक्ष भाषा पौलुस की आलंकारिक दूरी बनाए रखती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “निर्बलताओं में।” यहाँ ‘निर्बलताएँ’ मानवीय दुर्बलता, कष्ट, या ऐसी सीमित दशाओं को सूचित कर सकती हैं जिनमें परमेश्वर की सामर्थ्य प्रकट होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ τοῦ τοιούτου
  choice: ऐसे व्यक्ति के विषय में
  rationale: ὑπέρ + संबंधकारक यहाँ उस व्यक्ति को दर्शाता है जिसके विषय में घमण्ड किया जाता है। यह हिंदी में स्वाभाविक है और पौलुस की जानबूझकर रखी गई दूरी को बनाए रखता है।
- source_word: καυχήσομαι
  choice: मैं घमण्ड करूँगा
  rationale: καυχάομαι के लिए ‘घमण्ड करना’ आधुनिक हिंदी में स्पष्ट और पौलुस की तर्क-शैली के अनुरूप है।
- source_word: ἐμαυτοῦ
  choice: अपने विषय में
  rationale: यह आत्मवाचक सर्वनाम पहले खंड के ‘ऐसे व्यक्ति’ के साथ स्पष्ट विरोध दिखाता है।
- source_word: εἰ μὴ
  choice: सिवाय
  rationale: यहाँ पदबंध किसी शर्त के बजाय अपवाद प्रकट करता है।
- source_word: ἐν ταῖς ἀσθενείαις
  choice: अपनी निर्बलताओं के
  rationale: ‘निर्बलताएँ’ शारीरिक या मानवीय दुर्बलता, कष्ट और सीमितता के व्यापक अर्थ को बनाए रखता है। संदर्भ के कारण हिंदी में ‘अपनी’ स्पष्ट रूप से पौलुस की निर्बलताओं की ओर संकेत करता है।
theological_decisions:
- issue: पौलुस किसके विषय में घमण्ड करता है
  choice: अनुवाद ‘ऐसे व्यक्ति’ और ‘अपने’ के बीच पौलुस की आलंकारिक दूरी को बनाए रखता है और केवल अपनी निर्बलताओं को अपवाद बनाता है।
  alternative: ‘ऐसा व्यक्ति’ पौलुस से सचमुच भिन्न कोई दूसरा व्यक्ति है; अथवा पौलुस उसी अनुभव के संबंध में अपने आपको तीसरे पुरुष में प्रस्तुत कर रहा है।
  rationale: मूल यूनानी इस व्यापक आत्मकथात्मक प्रश्न को इस पद में स्पष्ट रूप से हल नहीं करता। इसलिए अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘ऐसे व्यक्ति’ मूल की अप्रत्यक्ष और दूरी बनाने वाली अभिव्यक्ति को सुरक्षित रखता है।
