  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: hi
  text: अपनी बड़ाई करना ज़रूरी है। इससे कोई लाभ तो नहीं, फिर भी मैं प्रभु के[a] दर्शनों और प्रकाशनों की ओर बढ़ूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रभु की ओर से मिले’। यूनानी संबंधकारक स्रोत का संकेत दे सकता है, लेकिन ‘प्रभु के’ मूल शब्दावली और उसकी अस्पष्टता को अधिक निकटता से बनाए रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχᾶσθαι
  choice: घमंड करना
  rationale: वर्तमान मध्यवाच्य अनंत क्रिया यहाँ संज्ञा-सदृश कर्ता के रूप में प्रयुक्त है। ‘घमंड करना’ पौलुस के अनिच्छापूर्ण आत्म-प्रशंसा वाले प्रसंग को स्पष्ट और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: δεῖ
  choice: जरूरी है
  rationale: यह आवश्यकता व्यक्त करता है। ‘जरूरी है’ आधुनिक मानक हिंदी में स्वाभाविक है और यूनानी की बाध्यता को अनावश्यक रूप से कठोर किए बिना व्यक्त करता है।
- source_word: οὐ συμφέρον μέν … δὲ
  choice: इससे कोई लाभ तो नहीं, फिर भी
  rationale: ‘तो … फिर भी’ की संरचना μέν…δέ के विरोधात्मक संबंध को स्वाभाविक हिंदी में व्यक्त करती है और पौलुस की अनिच्छा तथा आगे बढ़ने—दोनों को बनाए रखती है।
- source_word: ἐλεύσομαι … εἰς
  choice: की ओर बढ़ूँगा
  rationale: इस संदर्भ में यह किसी नए विषय की ओर जाने को सूचित करता है। ‘की ओर बढ़ूँगा’ शाब्दिक गति और विमर्श की प्रगति, दोनों के अनुकूल है।
- source_word: ὀπτασίας
  choice: दर्शनों
  rationale: यह अलौकिक दृश्य या दर्शन को सूचित करता है। ‘दर्शन’ हिंदी बाइबलीय प्रयोग में परिचित, संक्षिप्त और गरिमापूर्ण है।
- source_word: ἀποκαλύψεις
  choice: प्रकाशनों
  rationale: यह किसी बात के प्रकट या उद्घाटित किए जाने को सूचित करता है। ‘प्रकाशन’ स्थापित धार्मिक शब्द है और ‘दर्शन’ से इसका भेद बनाए रखता है।
- source_word: κυρίου
  choice: प्रभु के
  rationale: संबंधकारक रूप दोनों संज्ञाओं से जुड़ता है। ‘प्रभु के’ यूनानी की संक्षिप्तता और इस अस्पष्टता को बनाए रखता है कि ये प्रभु से प्राप्त हैं या किसी अन्य अर्थ में प्रभु से संबंधित हैं।
theological_decisions:
- issue: κυρίου का ‘दर्शनों और प्रकाशनों’ से संबंध
  choice: प्रभु के
  alternative: प्रभु की ओर से मिले
  rationale: यूनानी संबंधकारक स्रोत का अर्थ दे सकता है, पर उसे स्पष्ट रूप से अनिवार्य नहीं करता। ‘प्रभु के’ मूल की धर्मवैचारिक संयमता और वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है। ‘जरूरी है’ सामान्य पाठक के लिए सहज है, जबकि ‘दर्शन’, ‘प्रकाशन’ और ‘प्रभु’ गरिमापूर्ण बाइबलीय स्तर बनाए रखते हैं। दो वाक्यों में विभाजन हिंदी में विचार-क्रम को स्पष्ट करता है; ‘तो … फिर भी’ यूनानी विरोध को स्वाभाविक रूप देता है।
