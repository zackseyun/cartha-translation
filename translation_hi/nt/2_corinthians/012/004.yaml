  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: hi
  text: कि वह परादीस तक उठा लिया गया और उसने अकथनीय वचन सुने, जिन्हें किसी मनुष्य को कहने की अनुमति नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: उठा लिया गया
  rationale: अओरिस्ट कर्मवाच्य क्रिया की अचानक और बाहरी सामर्थ्य से किए गए उठाए जाने की भावना को स्वाभाविक हिन्दी में रखता है।
- source_word: παράδεισον
  choice: स्वर्गलोक
  rationale: यहाँ संदर्भ में परमेश्वर के स्वर्गीय निवास का बोध है; आधुनिक हिन्दी में ‘स्वर्गलोक’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: ἄρρητα ῥήματα
  choice: अकथनीय बातें
  rationale: ἄρρητα में ऐसी बातों का अर्थ हो सकता है जिन्हें व्यक्त नहीं किया जा सकता या जिन्हें कहना वर्जित है; ‘अकथनीय’ इस तनाव को बनाए रखता है, जबकि अगला उपवाक्य अनुमति न होने को स्पष्ट करता है।
- source_word: ἀνθρώπῳ
  choice: मनुष्य
  rationale: यह सामान्य मानव-संदर्भ है, न कि आवश्यक रूप से केवल पुरुष; ‘मनुष्य’ स्रोत की सामान्य अर्थ-सीमा को सुरक्षित रखता है।
- source_word: οὐκ ἐξὸν ... λαλῆσαι
  choice: बोलने की अनुमति नहीं है
  rationale: ἐξόν वैधता या अनुमति को सूचित करता है; यह अनुवाद ‘असंभव’ कहने के बजाय निषेध की भावना व्यक्त करता है।
theological_decisions:
- issue: ‘परादीस’ के लिए स्थान-संज्ञा
  choice: स्वर्गलोक
  alternative: परादीस
  rationale: निकट संदर्भ में तीसरे स्वर्ग और परादीस का संबंध है। ‘स्वर्गलोक’ पाठक को आशय समझाता है, फिर भी पद में स्थान की वास्तविकता को बनाए रखता है; किसी विशिष्ट मध्यवर्ती-अवस्था संबंधी सिद्धांत को नहीं जोड़ा गया।
- issue: अकथनीय वचनों का स्वरूप
  choice: अकथनीय बातें ... बोलने की अनुमति नहीं
  alternative: ऐसे शब्द जिन्हें व्यक्त नहीं किया जा सकता
  rationale: यूनानी पाठ पहले ἄρρητα कहता है और फिर स्पष्ट करता है कि मनुष्य को उन्हें बोलना वैध नहीं। अनुवाद अक्षमता और निषेध को एक ही अर्थ में समेटे बिना दोनों अभिव्यक्तियों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘वह’ पिछले पद के तृतीय पुरुष संदर्भ को बनाए रखता है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
