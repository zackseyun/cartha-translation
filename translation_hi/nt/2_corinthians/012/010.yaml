source:
  edition: SBLGNT
  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: hi
  text: इसलिए मैं मसीहा की खातिर निर्बलताओं, अपमानों, कठिनाइयों, सतावों और संकटों में प्रसन्न होता हूँ; क्योंकि जब मैं निर्बल होता हूँ, तभी बलवान होता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले निष्कर्ष को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: εὐδοκῶ
  choice: प्रसन्न हूँ
  rationale: यह केवल सह लेने या संतुष्ट रहने के बजाय अनुकूल भाव और प्रसन्नता का अर्थ बनाए रखता है, साथ ही पौलुस के विरोधाभासी कथन को अनावश्यक रूप से नहीं समझाता।
- source_word: ἐν ἀσθενείαις
  choice: निर्बलताओं में
  rationale: बहुवचन को बनाए रखते हुए यह शारीरिक बीमारी तक सीमित न रहकर विभिन्न प्रकार की दुर्बलता और असमर्थता को समेटता है।
- source_word: ἐν ὕβρεσιν
  choice: अपमानों में
  rationale: यह अपमानजनक और दुर्व्यवहारपूर्ण आचरण का अर्थ संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν ἀνάγκαις
  choice: कठिनाइयों में
  rationale: सन्दर्भ में यह विवश करने वाली कठिन परिस्थितियों को दर्शाता है; ‘कठिनाइयों’ सामान्य पाठक के लिए स्पष्ट है और इसे केवल आवश्यकताओं तक सीमित नहीं करता।
- source_word: ἐν διωγμοῖς
  choice: सतावों में
  rationale: यह मसीहा से निष्ठा के कारण झेले गए उत्पीड़न के लिए प्रचलित और सन्दर्भानुकूल बाइबिलीय हिन्दी है।
- source_word: καὶ στενοχωρίαις
  choice: और संकटों में
  rationale: यह दबाव, घिराव और अत्यन्त तंगी की स्थिति की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπὲρ Χριστοῦ
  choice: मसीहा के लिए
  rationale: ὑπέρ यहाँ कारण और निष्ठा के लिए सहने का भाव देता है। ‘मसीहा’ Χριστός की पदवीगत शक्ति और यहूदी मसीहाई पृष्ठभूमि को स्पष्ट रखता है।
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: क्योंकि जब मैं निर्बल होता हूँ
  rationale: ὅταν के सामान्य कालिक भाव को सहज हिन्दी में रखता है और अगले विरोधी कथन से सीधा संबंध बनाता है।
- source_word: τότε δυνατός εἰμι
  choice: तभी बलवान होता हूँ
  rationale: ‘बलवान’ को ‘निर्बल’ के स्पष्ट विलोम के रूप में चुनकर मूल कथन का तीखा विरोधाभास बनाए रखा गया है; ‘तभी’ τότε के बल को स्वाभाविक हिन्दी में उभारता है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीहा
  alternative: मसीह
  rationale: इस प्रसंग में पदवीगत अर्थ को सामने रखने के लिए ‘मसीहा’ चुना गया है। हिन्दी बाइबिल परम्परा में अधिक परिचित ‘मसीह’ को पादटिप्पणी में रखा गया है, बिना दोनों रूपों के धर्मवैज्ञानिक अंतर को बढ़ा-चढ़ाकर प्रस्तुत किए।
- issue: निर्बल होने पर बलवान होने का विरोधाभास
  choice: क्योंकि जब मैं निर्बल होता हूँ, तभी बलवान होता हूँ
  alternative: क्योंकि जब मैं निर्बल होता हूँ, तभी मसीह की सामर्थ्य से बलवान होता हूँ
  rationale: मूल पद में सामर्थ्य का स्रोत यहाँ स्पष्ट रूप से दोहराया नहीं गया, यद्यपि पिछले सन्दर्भ में वह विद्यमान है। अनुवाद ने उस निहित अर्थ को मुख्य पाठ में जोड़ने के बजाय मूल की संक्षिप्तता और धर्मवैज्ञानिक तनाव बनाए रखा है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। दुःखों की सूची में समान कारक-रचना बनाए रखी गई है, और अंतिम वाक्य में ‘निर्बल—बलवान’ का सीधा विरोध मूल की स्मरणीय संक्षिप्तता को सुरक्षित रखता है।
