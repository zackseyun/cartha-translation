base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/017.yaml
  text: Did I exploit you through any of those whom I sent to you?[a]
translation:
  language: hi
  text: जिन्हें मैंने तुम्हारे पास भेजा, क्या उनमें से किसी के द्वारा मैंने तुम्हारा अनुचित लाभ उठाया?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारा फायदा उठाया” अथवा “तुम्हें ठगा।” यूनानी क्रिया में दूसरे की कीमत पर अपना लाभ करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
  choice: क्या ...?
  rationale: μή यहाँ ऐसे अलंकारिक प्रश्न का संकेत देता है जिसका अपेक्षित उत्तर नकारात्मक है। हिन्दी में प्रसंग और प्रश्न-रूप से यह अपेक्षा स्वाभाविक रूप से स्पष्ट होती है।
- source_word: τινα ὧν
  choice: जिन्हें ... उनमें से किसी
  rationale: यह उन व्यक्तियों के समूह में से किसी एक की ओर संकेत करने वाला अंशात्मक प्रयोग है; यह रचना हिन्दी में उस अर्थ को स्वाभाविक रूप से बनाए रखती है।
- source_word: ἀπέσταλκα πρὸς ὑμᾶς
  choice: मैंने तुम्हारे पास भेजा
  rationale: पूर्णकालीन यूनानी रूप उन भेजे गए प्रतिनिधियों की ओर देखता है; हिन्दी का सामान्य पूर्ण भूतकाल यहाँ सहज और पर्याप्त है। πρὸς ὑμᾶς का स्वाभाविक दिशात्मक अर्थ ‘तुम्हारे पास’ है।
- source_word: δι’ αὐτοῦ
  choice: किसी के द्वारा
  rationale: मूल में सर्वनाम एकवचन है—‘उसके द्वारा’—पर वह पहले आए ‘किसी’ को पुनः ग्रहण करता है। हिन्दी में ‘किसी के द्वारा’ इस वितरणात्मक संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: ἐπλεονέκτησα ὑμᾶς
  choice: मैंने तुम्हारा अनुचित लाभ उठाया
  rationale: क्रिया का अर्थ अपने लाभ के लिए दूसरे का अनुचित फायदा उठाना है। यह चयन आर्थिक या संबंधपरक शोषण की धारणा को बनाए रखता है, पर अर्थ को केवल कानूनी धोखाधड़ी तक सीमित नहीं करता।
