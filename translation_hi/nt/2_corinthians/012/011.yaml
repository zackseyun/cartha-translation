source:
  edition: SBLGNT
  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: hi
  text: मैं मूर्ख बन गया हूँ; तुमने ही मुझे ऐसा करने के लिए विवश किया। क्योंकि मुझे तो तुमसे सराहा जाना चाहिए था; मैंने उन बड़े-से-बड़े प्रेरितों से किसी बात में कमी नहीं की, यद्यपि मैं कुछ भी नहीं हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γέγονα ἄφρων
  choice: मैं मूर्ख बन गया हूँ
  rationale: पूर्णकाल वर्तमान में बनी हुई दशा को व्यक्त करता है; यह रूप पौलुस के व्यंग्यपूर्ण आत्म-वर्णन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: तुमने ही मुझे विवश किया
  rationale: ‘ही’ से बलयुक्त ὑμεῖς प्रकट होता है; प्रसंग से समझी जाने वाली मूर्खतापूर्ण डींग की क्रिया को अनावश्यक रूप से दोहराया नहीं गया।
- source_word: ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι
  choice: वास्तव में तुम्हें मेरी प्रशंसा करनी चाहिए थी
  rationale: यूनानी निष्क्रिय रचना का स्वाभाविक हिन्दी रूप यह स्पष्ट करता है कि कुरिन्थियों से पौलुस के पक्ष में बोलने की अपेक्षा थी। γάρ को तर्क की अगली कड़ी के रूप में ‘वास्तव में’ से व्यक्त किया गया है।
- source_word: οὐδὲν γὰρ ὑστέρησα
  choice: किसी बात में कम नहीं ठहरा
  rationale: ὑστερέω का तुलनात्मक भाव सुरक्षित रखते हुए सहज हिन्दी प्रयोग चुना गया है।
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: उन तथाकथित बड़े प्रेरितों
  rationale: ὑπερλίαν की अत्यधिक प्रशंसात्मक ध्वनि और प्रसंगगत संभावित व्यंग्य को हिन्दी में संकेतित करता है, जबकि पादटिप्पणी गैर-व्यंग्यात्मक अर्थ भी देती है।
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: यद्यपि मैं कुछ भी नहीं हूँ
  rationale: सहायतार्थक concessive अर्थ को निकटता से रखता है और पौलुस की आत्म-लघुता को बिना नरम किए व्यक्त करता है।
theological_decisions:
- issue: τῶν ὑπερλίαν ἀποστόλων का आशय
  choice: मुख्य पाठ में ‘तथाकथित बड़े प्रेरितों’ द्वारा संभावित व्यंग्य का संकेत
  alternative: ‘अत्यन्त प्रतिष्ठित प्रेरितों’—बिना व्यंग्य के अत्यधिक सम्मानित प्रेरित
  rationale: संदर्भ में पदबंध संभवतः विरोधियों के दावों पर व्यंग्य करता है, पर यूनानी रूप स्वयं दोनों संभावनाओं को पूरी तरह बंद नहीं करता; इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- issue: εἰ καί का concessive बल
  choice: ‘यद्यपि ... फिर भी’
  alternative: ‘भले ही मैं कुछ भी नहीं हूँ’
  rationale: यह पौलुस के ‘कम न ठहरने’ और ‘कुछ भी न होने’ के कथनों के बीच जानबूझकर रखे गए तनाव को स्पष्ट, पर अनसुलझा, बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए बहुवचन ‘तुम’ रखा गया है। भाषा सहज और गरिमापूर्ण है। ‘प्रेरित’ स्थापित बाइबलीय पद है, जबकि वाक्य-विन्यास को अत्यधिक संस्कृतनिष्ठ होने से बचाया गया है।
