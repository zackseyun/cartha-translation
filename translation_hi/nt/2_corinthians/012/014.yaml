  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: hi
  text: देखो, यह तीसरी बार है कि मैं तुम्हारे पास आने के लिए तैयार हूँ[a], और मैं तुम पर बोझ नहीं बनूँगा[b]। क्योंकि मैं जो तुम्हारा है उसे नहीं, बल्कि तुम्हें चाहता हूँ। आखिर बच्चों का अपने माता-पिता के लिए संचय करना कर्तव्य नहीं है, बल्कि माता-पिता का अपने बच्चों के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “देखो, इस तीसरी बार मैं तुम्हारे पास आने के लिए तैयार हूँ।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “बोझ बनना” आर्थिक या भौतिक भार डालने के अर्थ में हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: देखो
  rationale: आधुनिक हिन्दी में स्वाभाविक ध्यानाकर्षक शब्द है और यूनानी के प्रवचनात्मक बल को बनाए रखता है।
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν
  choice: यह तीसरी बार है कि मैं ... आने के लिए तैयार हूँ
  rationale: वर्तमान तत्परता और ‘तीसरी बार’ के संबंध को स्वाभाविक हिन्दी में व्यक्त करता है; पाठ से परे जाकर तीन वास्तविक यात्राओं का दावा नहीं करता।
- source_word: καταναρκήσω
  choice: मैं तुम पर बोझ नहीं बनूँगा
  rationale: संदर्भ में आर्थिक या भौतिक भार डालने का भाव है; यह हिन्दी में स्पष्ट और सहज है।
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: मैं तुम्हारी वस्तुएँ नहीं, बल्कि तुम्हें चाहता हूँ
  rationale: व्यक्तियों और उनकी संपत्ति के बीच मूल विरोध को संक्षिप्त रूप से सुरक्षित रखता है।
- source_word: ὀφείλει
  choice: कर्तव्य नहीं / कर्तव्य है
  rationale: नैतिक दायित्व के अर्थ को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: θησαυρίζειν
  choice: धन जमा करें
  rationale: ‘संचित करना’ के आर्थिक भाव को संदर्भानुकूल और सुबोध रूप देता है।
- source_word: γονεῦσιν / γονεῖς
  choice: माता-पिता
  rationale: समावेशी यूनानी संज्ञा का लिंग-सटीक हिन्दी रूप है।
- source_word: τέκνα / τέκνοις
  choice: बच्चे / बच्चों
  rationale: संतान के लिए प्रयुक्त सामान्य यूनानी शब्द का स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: ‘तीसरी बार’ का आशय
  choice: इसे पौलुस की तीसरी बार आने की तैयारी के रूप में व्यक्त किया गया है।
  alternative: इसे निश्चित रूप से उसकी तीसरी वास्तविक यात्रा कहना।
  rationale: यूनानी वाक्य वर्तमान तैयारी को ‘तीसरी बार’ से जोड़ता है; अनुवाद यात्रा-इतिहास का ऐसा पुनर्निर्माण नहीं करता जिसे पद स्वयं अनिवार्य नहीं बनाता।
- issue: पौलुस का ‘तुम्हें चाहना’
  choice: व्यक्तियों और उनकी वस्तुओं के बीच मूल विरोध बनाए रखा गया है।
  alternative: इसे व्याख्यात्मक रूप से ‘तुम्हारा उद्धार चाहता हूँ’ कहना।
  rationale: ऐसी व्याख्या संभव हो सकती है, पर यूनानी पाठ केवल ‘तुम्हें’ कहता है; इसलिए धार्मिक आशय को अनावश्यक रूप से सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में बहुवचन ‘तुम’ रखा गया है। भाषा सहज किंतु गरिमापूर्ण है। ‘तुम्हारी वस्तुएँ’ मूल के व्यक्ति-संपत्ति विरोध को बनाए रखता है, जबकि अंतिम उपवाक्य में ‘धन’ संदर्भित आर्थिक संचय को स्पष्ट करता है।
