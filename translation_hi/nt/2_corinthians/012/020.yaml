id: 2CO.12.20
reference: 2 Corinthians 12:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: hi
  text: क्योंकि मुझे डर है कि कहीं ऐसा न हो कि जब मैं आऊँ, तो तुम्हें वैसा न पाऊँ जैसा मैं चाहता हूँ, और तुम भी मुझे वैसा पाओ जैसा तुम नहीं चाहते; कहीं ऐसा न हो कि तुममें झगड़े, ईर्ष्या, क्रोध के प्रकोप, स्वार्थी होड़, निंदाएँ, कानाफूसी[a], घमंड और अव्यवस्था हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चुगली।”
    reason: ψιθυρισμοί गुप्त कानाफूसी के साथ दूसरों के विषय में छिपकर हानिकारक बातें करने को भी सूचित कर सकता है।
lexical_decisions:
- source_word: φοβοῦμαι
  choice: मुझे डर है
  rationale: वर्तमान काल में पौलुस की जारी आशंका को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μή πως
  choice: कहीं ऐसा न हो कि
  rationale: दोनों प्रयोगों में आशंकित संभावना का भाव सुरक्षित रखता है और हिन्दी में स्वाभाविक है।
- source_word: ἐλθὼν
  choice: जब मैं आऊँ
  rationale: संदर्भ में कृदंत कालवाचक है; यह आने और पाए जाने के क्रम को स्पष्ट करता है।
- source_word: οὐχ οἵους θέλω εὕρω ὑμᾶς
  choice: तुम्हें वैसा न पाऊँ जैसा मैं चाहता हूँ
  rationale: कुरिन्थियों की उस दशा या चरित्र को व्यक्त करता है जिसमें पौलुस उन्हें पाना चाहता है, बिना अतिरिक्त व्याख्या जोड़े।
- source_word: κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε
  choice: और तुम भी मुझे वैसा पाओ जैसा तुम नहीं चाहते
  rationale: यूनानी कर्मवाच्य को स्वाभाविक हिन्दी में सक्रिय रूप देकर पहले खंड की पारस्परिक संरचना बनाए रखी गई है।
- source_word: ἔρις
  choice: झगड़े
  rationale: समुदाय के भीतर विवाद और कलह के व्यापक नकारात्मक अर्थ को सामान्य आधुनिक शब्द में व्यक्त करता है।
- source_word: ζῆλος
  choice: ईर्ष्या
  rationale: दुर्गुणों की इस सूची में शब्द का नकारात्मक, संबंधपरक अर्थ अभिप्रेत है, न कि सकारात्मक उत्साह।
- source_word: θυμοί
  choice: क्रोध के प्रकोप
  rationale: बहुवचन बार-बार भड़क उठने वाले क्रोध की घटनाओं का संकेत देता है।
- source_word: ἐριθεῖαι
  choice: स्वार्थी होड़
  rationale: स्वार्थपूर्ण प्रतिद्वंद्विता और अपने पक्ष को आगे बढ़ाने का भाव संक्षेप में व्यक्त करता है।
- source_word: καταλαλιαί
  choice: बदनामी
  rationale: दूसरों के विरुद्ध अपमानजनक या निंदात्मक बोलने का अर्थ आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ψιθυρισμοί
  choice: कानाफूसी
  rationale: गुप्त रूप से दूसरों के विषय में हानिकारक बातें कहने का मूल बिंब बनाए रखता है; ‘चुगली’ को पादटिप्पणी में वैकल्पिक अर्थ के रूप में दिया गया है।
- source_word: φυσιώσεις
  choice: घमंड
  rationale: शाब्दिक रूप से ‘फूल जाने’ से उत्पन्न आत्म-महत्त्व या अहंकार का भाव सहज हिन्दी में देता है।
- source_word: ἀκαταστασίαι
  choice: अव्यवस्था
  rationale: समुदाय में अनुशासनहीनता, अशांति या गड़बड़ी के व्यापक अर्थ को बिना अनावश्यक विशिष्टता के रखता है।
theological_decisions:
- issue: पौलुस की आशंकित भेंट का स्वर
  choice: पारस्परिक अप्रसन्नता और समुदाय में उपस्थित दुर्गुणों की आशंका को ही व्यक्त किया गया है।
  alternative: इसे मुख्यतः प्रेरितीय कठोरता बरतने की आशंका या झूठे शिक्षकों के प्रभाव की आशंका के रूप में स्पष्ट करना।
  rationale: पद स्वयं पारस्परिक निराशा और सामाजिक दुर्गुणों की सूची देता है; किसी विशेष कारण या भावी अनुशासन को शब्दों में जोड़ना पाठ से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। पारस्परिक ‘पाना’ संरचना को स्वाभाविक सक्रिय हिन्दी में रखा गया है। दुर्गुण-सूची को सामान्य पाठक के लिए स्पष्ट शब्दों में प्रस्तुत किया गया है और मूल की संभावित बहुवचन घटनाओं को जहाँ स्वाभाविक था वहाँ बहुवचन या सामूहिक संज्ञा से व्यक्त किया गया है।
