  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: hi
  text: क्या तुम अब तक यह समझते रहे हो कि हम तुम्हारे सामने अपना बचाव कर रहे हैं? हम परमेश्वर के सामने, मसीह में बोल रहे हैं। और, प्रिय जनो, यह सब तुम्हें दृढ़ बनाने के लिए है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλαι
  choice: इतने समय से
  rationale: यहाँ क्रियाविशेषण पाठकों की अब तक चली आ रही धारणा की ओर संकेत करता है; यह दूर अतीत में हुई किसी घटना का संकेत नहीं है।
- source_word: δοκεῖτε
  choice: समझते आ रहे हो
  rationale: वर्तमानकालीन आलंकारिक प्रश्न को Πάλαι के साथ मिलाकर जारी धारणा के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἀπολογούμεθα
  choice: अपनी सफ़ाई दे रहे हैं
  rationale: यह आत्म-पक्षसमर्थन या अपने बचाव में उत्तर देने का अर्थ रखता है; यह प्रयोग आधुनिक हिन्दी में स्पष्ट है और न्यायिक छाया भी बनाए रखता है।
- source_word: κατέναντι θεοῦ
  choice: परमेश्वर के सामने
  rationale: यह परमेश्वर की उपस्थिति में और उसके प्रति उत्तरदायी होकर बोलने का भाव व्यक्त करता है।
- source_word: ἐν Χριστῷ
  choice: मसीह में होकर
  rationale: ἐν का संबंधात्मक और सहभागितापरक भाव बनाए रखने के लिए 'में होकर' चुना गया है; Χριστός को सक्रिय उपाधि के रूप में 'मसीह' अनूदित किया गया है।
- source_word: λαλοῦμεν
  choice: हम ... बोल रहे हैं
  rationale: वर्तमान काल की तात्कालिकता और जारी वचन-क्रिया को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: τὰ δὲ πάντα
  choice: और ... यह सब
  rationale: δέ यहाँ हल्का संयोजक है; τὰ πάντα प्रसंग में पौलुस के समस्त कथन और व्यवहार की ओर संकेत करता है, इसलिए 'यह सब' स्पष्ट और सहज है।
- source_word: ἀγαπητοί
  choice: हे प्रियो
  rationale: स्नेहपूर्ण संबोधन और ἀγάπη से जुड़ा अर्थ बनाए रखते हुए dignified, प्रचलित हिन्दी रूप चुना गया है।
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: तुम्हारी उन्नति के लिए
  rationale: οἰκοδομή का रूपक आत्मिक निर्माण और दृढ़ीकरण का है; 'उन्नति' हिन्दी बाइबलीय भाषा में सहज है, जबकि अत्यधिक शाब्दिक 'निर्माण' यहाँ भ्रामक हो सकता है।
theological_decisions:
- issue: Χριστῷ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ Χριστός की उपाधिगत शक्ति सक्रिय है; इसलिए नाम-जैसे लिप्यंतरण के बजाय अर्थपूर्ण उपाधि 'मसीह' रखी गई है।
- issue: ἐν Χριστῷ में ἐν का अर्थ
  choice: मसीह में होकर
  alternative: मसीह के अधिकार से / मसीह के साथ एकता में
  rationale: मूल वाक्य संबंध, क्षेत्र और सहभागिता के बीच अर्थगत विस्तार रखता है। 'में होकर' उस तनाव को किसी एक व्याख्या में सीमित किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्नेहपूर्ण और गरिमामय संबोधन। वाक्यों को स्पष्ट रखा गया है, पर पौलुस के आलंकारिक प्रश्न और आत्मिक निर्माण के उद्देश्य की गंभीरता बनाए रखी गई है।
