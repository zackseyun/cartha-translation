source:
  edition: SBLGNT
  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: hi
  text: क्योंकि तुम्हारे साथ बाकी कलीसियाओं की अपेक्षा किस बात में कमतर व्यवहार किया गया[a], सिवाय इसके कि मैं स्वयं तुम पर बोझ नहीं बना[b]? मेरे इस अन्याय को क्षमा कर दो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें बाकी कलीसियाओं से कमतर रखा गया।” यूनानी क्रिया का अर्थ किसी को कमतर स्थिति में रखना या उसके साथ कमतर व्यवहार करना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात पौलुस ने उनसे आर्थिक सहायता लेकर उन पर भार नहीं डाला।
    reason: cultural_note
  - marker: c
    text: 'पौलुस यहाँ विडंबना से बोलता है: उसका कथित “अन्याय” यह था कि उसने उन पर बोझ नहीं डाला।'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡσσώθητε
  choice: तुम्हें कम समझा गया
  rationale: निष्क्रिय क्रिया यहाँ अन्य कलीसियाओं की तुलना में कुरिन्थियों को कमतर स्थान या व्यवहार मिलने का भाव देती है। यह रूप उनकी स्वाभाविक हीनता कहने के बजाय तुलनात्मक व्यवहार को व्यक्त करता है।
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: और कलीसियाओं की तुलना में
  rationale: तुलनात्मक प्रसंग में ὑπέρ अन्य कलीसियाओं के साथ तुलना दर्शाता है; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: αὐτὸς ἐγὼ
  choice: मैं स्वयं
  rationale: दोहरा कर्तृ-बल पौलुस के व्यक्तिगत और व्यंग्यपूर्ण जोर को सुरक्षित रखता है।
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: तुम पर बोझ नहीं बना
  rationale: यह क्रिया इस संदर्भ में आर्थिक या भौतिक भार डालने को सूचित करती है; संक्षिप्त अभिव्यक्ति संदर्भगत अर्थ को बनाए रखती है।
- source_word: χαρίσασθέ μοι τὴν ἀδικίαν ταύτην
  choice: मेरा यह अन्याय क्षमा कर दो
  rationale: χαρίζομαι यहाँ क्षमा करने और ἀδικία कथित अन्याय का भाव देता है। शाब्दिक तीखापन पौलुस की विडंबना को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: τί γάρ ἐστιν ὃ
  choice: क्योंकि ... किस बात में
  rationale: यह वाक्यांश पिछले तर्क से संबंध जोड़ते हुए एक आलंकारिक प्रश्न आरंभ करता है; हिंदी संरचना उसी तर्कात्मक संबंध को स्वाभाविक रूप में व्यक्त करती है।
theological_decisions:
- issue: आर्थिक सहायता के विषय में पौलुस का व्यंग्यपूर्ण आत्मपक्ष
  choice: मुख्य पाठ में कथन को सीधा रखा गया है और ‘मेरा यह अन्याय क्षमा कर दो’ से विडंबना सुरक्षित रखी गई है।
  alternative: मुख्य पाठ में ‘इस बड़े अन्याय’ या ‘मानो मैंने अन्याय किया हो’ जोड़कर व्यंग्य स्पष्ट करना।
  rationale: यूनानी पाठ विडंबना को प्रसंग और कथन के विरोधाभास से व्यक्त करता है; अनूदित पाठ में व्याख्यात्मक शब्द जोड़ना मूल से आगे जाना होगा।
- issue: ἡσσώθητε का निष्क्रिय और तुलनात्मक भाव
  choice: ‘तुम्हें कम समझा गया’
  alternative: ‘तुम कम ठहरे’ या ‘तुम्हें कम लाभ मिला’
  rationale: चुना हुआ पाठ बाहरी व्यवहार या आकलन का निष्क्रिय भाव बनाए रखता है, पर किसी अंतर्निहित हीनता का दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। ‘कलीसिया’ प्रचलित बाइबलीय शब्दावली के अनुरूप है। प्रश्न की तीक्ष्णता और अंतिम वाक्य की विडंबना को बिना अतिरंजित व्याख्या के सुरक्षित रखा गया है।
