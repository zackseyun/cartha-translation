id: 2CO.12.2
reference: 2 Corinthians 12:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: hi
  text: मैं मसीह में एक मनुष्य को जानता हूँ[a], जो चौदह वर्ष पहले—चाहे देह में, मैं नहीं जानता; चाहे देह से बाहर, मैं नहीं जानता[b]; परमेश्वर जानता है—तीसरे स्वर्ग तक उठा लिया गया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी ἐν Χριστῷ का शाब्दिक रूप ‘मसीह में’ है; यहाँ ‘मसीह’ एक पदवी है, जिसका अर्थ ‘अभिषिक्त जन’ है।
    reason: lexical_alternative
  - marker: b
    text: पौलुस यह निश्चित नहीं करता कि यह अनुभव देह में हुआ था या देह से बाहर; मूल पाठ दोनों संभावनाओं को अनसुलझा छोड़ता है।
    reason: theological_tension
  - marker: c
    text: ‘तीसरा स्वर्ग’ प्राचीन यहूदी स्वर्ग-संबंधी भाषा की अभिव्यक्ति है। अनुवाद इसे समझाकर बदलने के बजाय ज्यों का त्यों रखता है; अगले पद में इसी अनुभव के संबंध में ‘परादीस’ का उल्लेख है।
    reason: cultural_note
lexical_decisions:
- source_word: οἶδα
  choice: मैं ... जानता हूँ
  rationale: यूनानी का पूर्णकालिक रूप वर्तमान अर्थ देता है; हिन्दी में वर्तमान काल स्वाभाविक और सटीक है।
- source_word: ἄνθρωπον
  choice: एक मनुष्य
  rationale: यहाँ एक विशिष्ट पुरुष का उल्लेख है; ‘मनुष्य’ मूल संज्ञा के अनुरूप, गरिमापूर्ण और प्रसंग में स्वाभाविक है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: Χριστός यहाँ पदवी है; ‘मसीह’ उसके अभिषिक्त उद्धारकर्ता के अर्थ को बनाए रखता है, जबकि ‘में’ पौलुस की संबंधात्मक भाषा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: चौदह वर्ष पहले
  rationale: समय-सूचक यूनानी वाक्यांश का यह स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: εἴτε ἐν σώματι ... εἴτε ἐκτὸς τοῦ σώματος
  choice: चाहे देह में ... चाहे देह से बाहर
  rationale: दोनों संभावनाओं और उनकी समानांतर बनावट को सुरक्षित रखा गया है; ‘देह से बाहर’ ἐκτός का सीधा और स्पष्ट रूप है।
- source_word: ὁ θεὸς οἶδεν
  choice: परमेश्वर जानता है
  rationale: मूल कथन का सीधा अनुवाद है; ‘केवल’ नहीं जोड़ा गया क्योंकि वह यूनानी में स्पष्ट रूप से नहीं है।
- source_word: ἁρπαγέντα
  choice: उठा लिया गया था
  rationale: अकर्मक नहीं बल्कि कर्मवाच्य रखा गया है, जिससे अनिर्दिष्ट कर्ता द्वारा ऊपर ले जाए जाने का भाव बना रहता है; ‘था’ चौदह वर्ष पहले हुई घटना के लिए स्वाभाविक हिन्दी है।
- source_word: ἕως τρίτου οὐρανοῦ
  choice: तीसरे स्वर्ग तक
  rationale: ἕως की सीमा या गंतव्य-सूचक शक्ति और प्राचीन अभिव्यक्ति ‘तीसरा स्वर्ग’ दोनों सुरक्षित हैं।
theological_decisions:
- issue: ἐν Χριστῷ में Χριστῷ का अनुवाद
  choice: मसीह में
  alternative: ख्रीष्ट में / मसीह से संयुक्त
  rationale: ‘मसीह’ पदवी का अर्थ सुरक्षित रखता है। ‘से संयुक्त’ संबंध की व्याख्या कर देता, जबकि मूल का संक्षिप्त और बहुअर्थी ‘में’ अधिक निकट है।
- issue: अनुभव देह में था या देह से बाहर
  choice: दोनों संभावनाएँ खुली रखी गई हैं और पौलुस की दोहरी अनभिज्ञता स्पष्ट कही गई है।
  alternative: इसे शारीरिक आरोहण अथवा देह-विहीन दर्शन के रूप में निश्चित करना
  rationale: मूल पाठ दोनों बार ‘मैं नहीं जानता’ कहता है और ज्ञान परमेश्वर को सौंपता है; इसलिए अनुवाद अनुभव की विधि तय नहीं करता।
- issue: कर्मवाच्य ἁρπαγέντα का निहित कर्ता
  choice: उठा लिया गया था
  alternative: परमेश्वर ने उसे उठा लिया था
  rationale: प्रसंग में परमेश्वर कर्ता समझे जा सकते हैं, पर यूनानी में कर्ता व्यक्त नहीं है; कर्मवाच्य उस संयम को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु बाइबिल-पाठ के अनुरूप गरिमापूर्ण रखी गई है। लंबे अंतःक्षेप को डैश और अर्धविरामों से व्यवस्थित किया गया है, ताकि पौलुस की दोहराई हुई अनिश्चितता स्पष्ट रहे। ‘देह’ और ‘स्वर्ग’ सामान्य पाठक के लिए परिचित धार्मिक शब्द हैं; अनावश्यक पारिभाषिक विस्तार से बचा गया है।
