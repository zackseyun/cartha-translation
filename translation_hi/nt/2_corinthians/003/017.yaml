lexical_decisions:
- source_word: κύριος
  choice: प्रभु
  rationale: यह κύριος का स्वाभाविक, प्रतिष्ठित और पौलुस के धर्मवैचारिक संदर्भ के अनुकूल हिन्दी रूप है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: दोनों स्थानों पर संदर्भ पवित्र आत्मा की ओर संकेत करता है; हिन्दी में नाम का अर्थ स्पष्ट रखने के लिए ‘आत्मा’ प्रयुक्त है।
- source_word: δὲ
  choice: और
  rationale: पहले δέ को अलग कालसूचक ‘अब’ से नहीं दिखाया गया, क्योंकि वह यहाँ तर्क की प्रगति का हल्का संयोजक है; दूसरे δέ को सहज हिन्दी में ‘और’ से व्यक्त किया गया है।
- source_word: οὗ
  choice: जहाँ
  rationale: सामान्य स्थानवाचक कथन के लिए ‘जहाँ’ यूनानी के निकट और स्वाभाविक हिन्दी है।
- source_word: ἐλευθερία
  choice: स्वतंत्रता
  rationale: यह समकालीन, गरिमापूर्ण हिन्दी में freedom का स्पष्ट रूप है और कथन का धर्मवैचारिक भार बनाए रखता है।
- source_word: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν
  choice: प्रभु आत्मा है
  rationale: यूनानी के सीधे समतामूलक कथन को बिना नरम किए रखा गया है; हिन्दी में विधेय के साथ अतिरिक्त निश्चयवाचक चिह्न आवश्यक नहीं है।
- source_word: τὸ πνεῦμα κυρίου
  choice: प्रभु का आत्मा
  rationale: सम्बन्धकारक यूनानी रचना को स्पष्ट रूप से बनाए रखता है और ‘प्रभु के आत्मा’ की अपेक्षा आधुनिक मानक हिन्दी में व्याकरणतः स्वाभाविक है।
theological_decisions:
- issue: ‘प्रभु आत्मा है’ में प्रभु और आत्मा के संबंध की पहचान धर्मवैचारिक रूप से विवादित है।
  choice: मुख्य पाठ में सीधा समतामूलक कथन ‘प्रभु आत्मा है’ रखा गया है।
  alternative: इसे कार्यात्मक या नई वाचा के संदर्भ में निकट पहचान माना जा सकता है, न कि संबंध की पूर्ण धर्मवैचारिक परिभाषा; ‘प्रभु’ को विशेष रूप से मसीह अथवा व्यापक दिव्य संदर्भ में भी समझा गया है।
  rationale: यूनानी पाठ सीधी पहचान व्यक्त करता है। अनुवाद को इस तनाव को बनाए रखना चाहिए, न कि व्याख्यात्मक विस्तार द्वारा किसी एक मत का निर्णय करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण। ‘स्वतंत्रता’ सामान्य पाठक के लिए स्पष्ट है। आरम्भ में ‘अब’ नहीं जोड़ा गया, क्योंकि यूनानी में स्पष्ट कालसूचक शब्द नहीं है।
