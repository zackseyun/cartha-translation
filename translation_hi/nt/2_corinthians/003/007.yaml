  text: Εἰ δὲ ἡ διακονία τοῦ θανάτου ἐν ⸀γράμμασιν ⸀ἐντετυπωμένη λίθοις ἐγενήθη ἐν δόξῃ, ὥστε μὴ δύνασθαι ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ πρόσωπον Μωϋσέως διὰ τὴν δόξαν τοῦ προσώπου αὐτοῦ τὴν καταργουμένην,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/007.yaml
  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: hi
  text: पर यदि मृत्यु की सेवा, जो पत्थरों पर अक्षरों में अंकित थी, ऐसी महिमा के साथ आई कि इस्राएल के पुत्र[a] मूसा के चेहरे की ओर उसकी उस महिमा के कारण टकटकी लगाकर नहीं देख सके, जो मंद पड़ती जा रही थी[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘इस्राएल के पुत्र’ का अनुवाद ‘इस्राएली’ भी किया जा सकता है। यहाँ यूनानी की पुरुषवाचक अभिव्यक्ति को अधिक निकटता से रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘जो समाप्त की जा रही थी’ अथवा ‘जो समाप्त हो रही थी।’
    reason: alternative_reading
lexical_decisions:
- source_word: διακονία
  choice: सेवा
  rationale: यह शब्द सौंपे गए सेवाकार्य या व्यवस्था—दोनों का भाव रख सकता है। यहाँ सहज हिन्दी में ‘सेवा’ पौलुस के वाचा-संबंधी विरोध को अनावश्यक रूप से अधिक व्याख्यायित किए बिना सुरक्षित रखती है।
- source_word: τοῦ θανάτου
  choice: मृत्यु की
  rationale: सम्बन्धकारक पदबंध को संक्षिप्त रखा गया है, ताकि ‘मृत्यु लाने वाली’ जैसी व्याख्यात्मक वृद्धि किए बिना पौलुस की तीखी अभिव्यक्ति बनी रहे।
- source_word: ἐν γράμμασιν ἐντετυπωμένη λίθοις
  choice: पत्थरों पर अक्षरों में अंकित
  rationale: ‘अक्षरों में’ निकटवर्ती आत्मा-अक्षर विरोध की ओर संकेत बनाए रखता है; ‘अंकित’ दबाकर लिखे या खोदे जाने का भाव देता है। λίθοις को ‘पत्थरों’ कहा गया है, न कि स्पष्टतः ‘पत्थर की पटियाओं’।
- source_word: ἐγενήθη ἐν δόξῃ
  choice: महिमा के साथ आई
  rationale: यह घटना के घटित होने और उसके साथ उपस्थित महिमा—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: ऐसी ... कि ... टकटकी लगाकर नहीं देख सके
  rationale: परिणामसूचक रचना और लगातार या ध्यान से देखने के अर्थ, दोनों को सुरक्षित रखा गया है।
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: इस्राएल के पुत्र
  rationale: यूनानी की स्पष्ट पुरुषवाचक और सामूहिक अभिव्यक्ति को निकटता से रखा गया है; सामान्य हिन्दी विकल्प ‘इस्राएली’ फुटनोट में दिया गया है।
- source_word: εἰς τὸ πρόσωπον Μωϋσέως
  choice: मूसा के चेहरे की ओर
  rationale: εἰς की दिशात्मकता को ‘की ओर’ से व्यक्त करते हुए वाक्य को हिन्दी में स्वाभाविक रखा गया है।
- source_word: καταργουμένην
  choice: मंद पड़ती जा रही थी
  rationale: तात्कालिक संदर्भ मूसा के चेहरे की दिखाई देने वाली महिमा है; यह अनुवाद उसके क्षीण होने का स्वाभाविक भाव देता है, जबकि व्यापक ‘समाप्त होती जा रही थी’ अर्थ को फुटनोट में सुरक्षित रखा गया है।
theological_decisions:
- issue: καταργουμένην दृश्य महिमा के मंद पड़ने को दर्शाता है या अधिक व्यापक रूप से उसके समाप्त किए जाने को।
  choice: जो मंद पड़ती जा रही थी
  alternative: जो समाप्त होती जा रही थी; जो हटती जा रही थी
  rationale: तात्कालिक संदर्भ मूसा के चेहरे की दिखाई देने वाली महिमा का है, इसलिए मुख्य पाठ में दृश्य क्षीणता व्यक्त की गई है। फिर भी क्रिया के समाप्त या निष्प्रभावी किए जाने के व्यापक अर्थ को फुटनोट में रखा गया है, ताकि पौलुस के तर्क का धर्मवैचारिक तनाव बना रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य मूल यूनानी की सशर्त, अभी अपूर्ण संरचना को दर्शाने के लिए अल्पविराम पर समाप्त होता है, क्योंकि विचार अगली आयत में आगे बढ़ता है।
