  text: ἀλλ’ ἕως σήμερον ἡνίκα ⸂ἂν ἀναγινώσκηται⸃ Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: hi
  text: लेकिन आज तक, जब कभी मूसा का पाठ किया जाता है[a], उनके हृदय पर परदा पड़ा रहता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् मूसा की रचनाएँ, विशेष रूप से व्यवस्था।
    reason: cultural_note
  - marker: b
    text: यूनानी में ‘हृदय’ एकवचन है, जबकि ‘उनके’ बहुवचन है; सम्भवतः यह सामूहिक एकवचन है। इसका अनुवाद ‘उनके हृदयों’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: लेकिन
  rationale: यह पिछले कथन के साथ स्पष्ट विरोध दर्शाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἕως σήμερον
  choice: आज तक
  rationale: यह बताता है कि वर्णित दशा वर्तमान समय तक बनी हुई है।
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: जब कभी ... पढ़ा जाता है
  rationale: ἡνίκα, ἄν और वर्तमान संभावनार्थक क्रिया का मेल बार-बार घटने वाली अनिश्चित परिस्थिति व्यक्त करता है।
- source_word: Μωϋσῆς
  choice: मूसा
  rationale: मूल पाठ में व्यक्ति का नाम मूसा की रचनाओं के लिए लक्षणा के रूप में आया है; मुख्य पाठ उसी अभिव्यक्ति को बनाए रखता है।
- source_word: κάλυμμα
  choice: परदा
  rationale: यह इसी अध्याय में चल रहे मूसा के परदे के बिंब को स्वाभाविक और स्पष्ट हिन्दी में बनाए रखता है।
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: उनके हृदय पर
  rationale: यूनानी में बहुवचन संबंधसूचक के साथ ‘हृदय’ एकवचन है; हिन्दी में यह सामूहिक एकवचन समझ में आता है और स्रोत-रूप को भी सुरक्षित रखता है।
- source_word: κεῖται
  choice: पड़ा रहता है
  rationale: क्रिया किसी वस्तु के एक स्थान पर पड़े या टिके रहने की निरंतर अवस्था बताती है; यह हिन्दी प्रयोग उस स्थायित्व को व्यक्त करता है।
theological_decisions:
- issue: क्या ‘मूसा’ का अर्थ मुख्य पाठ में स्पष्ट करके ‘मूसा की व्यवस्था’ या ‘मूसा की रचनाएँ’ किया जाए
  choice: मुख्य पाठ में लक्षणा के रूप में ‘मूसा’ बनाए रखना
  alternative: ‘मूसा की व्यवस्था’ अथवा ‘मूसा की रचनाएँ’ लिखना
  rationale: मूल पाठ स्वयं ‘मूसा’ कहता है। इसे बनाए रखने से व्याख्या को अनावश्यक रूप से मुख्य पाठ में नहीं मिलाया जाता; आशय पाद-टिप्पणी में स्पष्ट किया गया है।
- issue: ‘हृदय’ को एकवचन रखा जाए या बहुवचन किया जाए
  choice: स्रोत के सामूहिक एकवचन के अनुरूप ‘उनके हृदय’
  alternative: अधिक स्पष्ट वितरणात्मक अर्थ के लिए ‘उनके हृदयों’
  rationale: यूनानी पाठ एकवचन ‘हृदय’ रखता है। हिन्दी में ‘उनके हृदय’ सामूहिक रूप से ग्राह्य है और पाठ की संभावित सामूहिक धारणा को समय से पहले अलग-अलग व्यक्तियों तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘जब कभी’ पुनरावृत्त परिस्थिति को, और ‘पड़ा रहता है’ परदे की निरंतर बनी अवस्था को व्यक्त करता है। दोनों पाद-टिप्पणी चिह्न संबंधित पदों के ठीक बाद रखे गए हैं।
