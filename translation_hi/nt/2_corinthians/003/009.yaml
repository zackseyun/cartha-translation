id: 2CO.3.9
reference: 2 Corinthians 3:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: hi
  text: क्योंकि यदि दोषी ठहराने वाली सेवा में महिमा थी, तो धार्मिकता[a] की सेवा महिमा में कहीं अधिक बढ़कर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय।”
    reason: δικαιοσύνη के लिए वैकल्पिक अर्थछाया को सुरक्षित रखता है।
lexical_decisions:
- source_word: διακονία
  choice: सेवा
  rationale: यहाँ पौलुस दो वाचागत व्यवस्थाओं से जुड़ी सेवाओं की तुलना करता है। हिंदी में ‘सेवा’ स्वाभाविक और व्यापक है तथा केवल व्यक्तिगत सेवा-कार्य तक सीमित नहीं होती।
- source_word: κατάκρισις
  choice: दोषी ठहराना
  rationale: यह न्यायिक अर्थ को स्पष्ट रखता है और ‘दंड’ की अपेक्षा उस निर्णय पर बल देता है जिसके द्वारा कोई दोषी ठहरता है। संबंधवाचक पदबंध को स्वाभाविक हिंदी में ‘दोषी ठहराने वाली’ किया गया है।
- source_word: δόξα
  choice: महिमा
  rationale: यह पौलुस के तर्क में मानक धर्मवैचारिक शब्दावली और पिछले प्रसंग की निरंतरता बनाए रखता है।
- source_word: πολλῷ μᾶλλον
  choice: कहीं अधिक
  rationale: यह यूनानी तुलनात्मक बल को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: περισσεύω
  choice: बढ़कर है
  rationale: यह प्रचुरता और श्रेष्ठता, दोनों के भाव को संदर्भानुकूल हिंदी में व्यक्त करता है; ‘महिमा में’ के साथ ‘बहुतायत से होती है’ की तुलना में अधिक स्वाभाविक है।
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: पौलुस के प्रयोग में यह स्थापित और व्यापक हिंदी समतुल्य है। ‘न्याय’ संभव अर्थछाया है, पर यहाँ दोषी ठहराने के विपरीत धर्मी ठहराए जाने/सही ठहराव से जुड़ा व्यापक अर्थ अधिक उपयुक्त है।
- source_word: εἰ γὰρ τῇ διακονίᾳ ... δόξα
  choice: क्योंकि यदि ... सेवा महिमा के साथ आई
  rationale: पहला यूनानी उपवाक्य क्रियारहित है। ‘महिमा के साथ आई’ आवश्यक क्रिया की पूर्ति करते हुए उस सेवा के महिमासहित प्रकट होने का भाव देता है और अगले ‘महिमा में कहीं अधिक’ से अंतर बनाए रखता है।
theological_decisions:
- issue: δικαιοσύνη का पौलुसी विरोध में अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: ‘धार्मिकता’ शब्द परमेश्वर के सही ठहराने वाले कार्य और उसके अनुरूप स्थिति की व्यापक पौलुसी अर्थ-सीमा को खुला रखता है। ‘न्याय’ वैध अर्थछाया है, पर इस पद में उसे मुख्य पाठ में रखने से विरोध केवल न्याय-प्रशासन तक सीमित सुनाई दे सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। यूनानी के पहले क्रियारहित उपवाक्य को स्वाभाविक बनाने के लिए ‘महिमा के साथ आई’ जोड़ा गया है। कोई पादटिप्पणी नहीं दी गई, क्योंकि ‘न्याय’ यहाँ मुख्य पाठ के लिए पर्याप्त रूप से समकक्ष विकल्प नहीं है और अंग्रेज़ी परत की पादटिप्पणी संभवतः गलत स्थान पर चिह्नित है।
