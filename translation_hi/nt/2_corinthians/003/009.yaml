review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two contrasted ministries, condemnation, glory, and the intensified comparison. However, “महिमा के साथ आई” makes the ministry’s arrival explicit, whereas the Greek first clause is verbless and states more simply that glory belonged to/accompanied the ministry. “सेवा में महिमा थी” supplies Hindi grammar while more closely retaining the source construction. The present-tense “बढ़कर है” appropriately renders περισσεύει in context.
  naturalness: “दोषी ठहराने वाली सेवा” and “धार्मिकता की सेवा” are understandable, dignified modern Hindi. “महिमा में कहीं अधिक बढ़कर है” is natural enough for the elevated Pauline register. Recasting the first clause as “सेवा में महिमा थी” is more idiomatic and avoids an unnecessarily dynamic event expression.
  terminology: सेवा is a suitable rendering of διακονία in this covenantal contrast. दोषी ठहराने वाली preserves the forensic force of κατάκρισις without prematurely specifying punishment. महिमा is appropriate for δόξα. धार्मिकता is an established rendering of δικαιοσύνη here; a footnote preserves “न्याय” as a legitimate lexical alternative, anchored to the relevant term rather than to “महिमा.”
  issues:
  - severity: medium
    issue: The phrase “महिमा के साथ आई” introduces a dynamic arrival formulation not expressed by the verbless Greek clause.
    rationale: 'Although it follows the English audit trail’s supplied idiom, source fidelity is better served in Hindi by a neutral existential/possessive construction: “सेवा में महिमा थी.”'
  - severity: low
    issue: No footnote preserves the viable alternative “न्याय” for δικαιοσύνη.
    rationale: The English audit trail explicitly retains “justice” as a lexical alternative. A Hindi footnote on “धार्मिकता” can preserve this ambiguity without displacing the contextually suitable main-text rendering.
  revised_text: क्योंकि यदि दोषी ठहराने वाली सेवा में महिमा थी, तो धार्मिकता[a] की सेवा महिमा में कहीं अधिक बढ़कर है।
  revised_footnotes:
  - marker: a
    text: या, “न्याय।”
    reason: δικαιοσύνη के लिए वैकल्पिक अर्थछाया को सुरक्षित रखता है।
