source:
  edition: SBLGNT
  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: hi
  text: तुम्हारे बारे में यह स्पष्ट है कि तुम मसीह की ओर से आया हुआ पत्र[a] हो, जिसकी सेवा हमने की है। यह पत्र स्याही से नहीं, बल्कि जीवित परमेश्वर की आत्मा से लिखा गया है[b]—पत्थर की पटियाओं पर नहीं, बल्कि मांसमय हृदयों रूपी पटियाओं पर[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “मसीह का पत्र।” यूनानी सम्बन्धकारक स्रोत, लेखकत्व या सामान्य सम्बन्ध व्यक्त कर सकता है।
    reason: alternative_reading
  - marker: b
    text: संदर्भ में “आत्मा” जीवित परमेश्वर के पवित्र आत्मा की ओर संकेत करती है।
    reason: theological_clarity
  - marker: c
    text: “मांसमय हृदय” यहेजकेल 11:19 और 36:26 में नई वाचा के चित्र की प्रतिध्वनि है। आशय यह नहीं कि पटियाएँ हृदयों से अलग हैं, बल्कि हृदय ही पटियाएँ हैं।
    reason: cross_reference
lexical_decisions:
- source_word: φανερούμενοι
  choice: यह साफ़ दिखाई देता है
  rationale: यह कर्मवाच्य कृदन्त कुरिन्थियों के खुले रूप से प्रकट प्रमाण होने का भाव रखता है। हिन्दी में यह वाक्य-विन्यास स्वाभाविक है और केवल उनके सक्रिय रूप से कुछ ‘दिखाने’ का अर्थ नहीं देता।
- source_word: ἐπιστολὴ
  choice: पत्री
  rationale: ‘पत्री’ पत्र के रूपक को स्पष्ट रखता है और हिन्दी बाइबलीय गद्य में परिचित होते हुए भी समझने योग्य है।
- source_word: Χριστοῦ
  choice: मसीह की ओर से आई हुई
  rationale: सम्बन्धकारक को यहाँ पत्र के स्रोत अथवा लेखक के अर्थ में लिया गया है। ‘मसीह की पत्री’ अधिक शाब्दिक और सम्भव विकल्प है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: διακονηθεῖσα ὑφ’ ἡμῶν
  choice: जिसकी सेवा हमने की है
  rationale: यह διακονέω के सेवाकार्य के भाव को बनाए रखता है और पौलुस तथा उसके सहकर्मियों को पत्र का लेखक ठहराए बिना उनकी मध्यस्थ सेवकाई व्यक्त करता है। हिन्दी में रूपक की कुछ असामान्यता मूल यूनानी में भी उपस्थित है।
- source_word: ἐγγεγραμμένη
  choice: लिखी गई
  rationale: स्याही और आत्मा के विरोध में यह स्वाभाविक तथा सीधा हिन्दी समतुल्य है।
- source_word: μέλανι
  choice: स्याही
  rationale: लेखन-रूपक में इसका सीधा आधुनिक हिन्दी अर्थ है।
- source_word: πνεύματι θεοῦ ζῶντος
  choice: जीवित परमेश्वर के आत्मा से
  rationale: सन्दर्भ परमेश्वर के पवित्र आत्मा की ओर संकेत करता है; हिन्दी में ‘आत्मा’ का रूप ही पर्याप्त है और वाक्यांश के सम्बन्ध को अक्षुण्ण रखता है।
- source_word: πλαξὶν λιθίναις
  choice: पत्थर की पटियाओं पर
  rationale: यह सीनै की पत्थर की पटियाओं के संकेत और मूल चित्र दोनों को सुरक्षित रखता है।
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: मांसमय हृदयों रूपी पटियाओं पर
  rationale: '‘रूपी’ से καρδίαις को πλαξίν के समानाधिकरण के रूप में व्यक्त किया गया है: पटियाएँ स्वयं मांसमय हृदय हैं। इससे अस्वाभाविक सम्बन्धकारक-श्रृंखला से बचते हुए यहेजकेल-सदृश चित्र बना रहता है।'
theological_decisions:
- issue: Χριστοῦ सम्बन्धकारक का अर्थ
  choice: मसीह की ओर से आई हुई पत्री
  alternative: मसीह की पत्री
  rationale: पत्र-रूपक में सम्बन्धकारक सम्भवतः स्रोत या लेखकत्व बताता है, पर अधिक शाब्दिक स्वामित्व/सम्बन्ध का अर्थ भी व्याकरणतः सम्भव है; इसलिए मुख्य पाठ और पादटिप्पणी दोनों अर्थों को खुला रखते हैं।
- issue: πνεύματι का अभिप्राय
  choice: जीवित परमेश्वर के आत्मा
  alternative: जीवित परमेश्वर की आत्मिक शक्ति/साँस
  rationale: स्याही के साथ विरोध, परमेश्वर से सीधा सम्बन्ध और नई वाचा का प्रसंग व्यक्तिगत दिव्य आत्मा की ओर प्रबल संकेत करते हैं; पाठ में इससे आगे कोई सम्प्रदायगत व्याख्या नहीं जोड़ी गई।
- issue: καρδίαις σαρκίναις की वाचाई प्रतिध्वनि
  choice: मांसमय हृदय
  alternative: कोमल/मानवीय हृदय
  rationale: शाब्दिक चित्र को बनाए रखने से यहेजकेल 11:19 और 36:26 की नई-वाचा सम्बन्धी प्रतिध्वनि सुरक्षित रहती है; ‘कोमल’ कहने से निहितार्थ स्पष्ट तो होता, पर मूल रूपक संकुचित हो जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘पत्री’ और ‘मांसमय हृदय’ जैसे बाइबलीय पद मूल रूपक तथा पुराना नियम की प्रतिध्वनि बचाने के लिए रखे गए हैं; ‘रूपी’ समानाधिकरण को साधारण पाठक के लिए स्पष्ट करता है।
