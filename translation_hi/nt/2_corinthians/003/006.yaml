  to: जिसने हमें नई वाचा के सेवक[b] होने के योग्य भी बनाया—लिखित अक्षर[c] के नहीं, बल्कि आत्मा[a] के; क्योंकि लिखित अक्षर मारता है, पर आत्मा जीवन देता है।
  rationale: The revision preserves the draft’s faithful rendering while correcting the Spirit/spirit note so that it represents the genuine interpretive ambiguity rather than introducing a misleading one. It also restores separate lexical-alternative anchors for ‘सेवक’ and ‘लिखित अक्षर,’ consistent with the English audit trail. No doctrinal conclusion is imposed in the main text or notes.
