review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the central contrasts and verbal force: God makes the apostles fit for service under a new covenant; the contrast is between letter and Spirit/spirit; the letter kills and the Spirit gives life. ‘लिखित अक्षर’ is an acceptable, slightly explicating rendering of γράμμα.'
  naturalness: The Hindi is clear, modern, and appropriately dignified. ‘सेवक होने के योग्य बनाया’ communicates the intended fitness, though ‘सेवक होने के लिए समर्थ बनाया’ is marginally more direct. The proposed revision retains the draft’s natural sentence structure.
  terminology: ‘नई वाचा,’ ‘सेवक,’ ‘अक्षर,’ and ‘आत्मा’ are suitable. The existing Spirit footnote does not actually preserve the English audit trail’s alternative of lower-case ‘spirit’; instead it reverses the stated possibility by making ‘पवित्र आत्मा’ merely possible. Hindi cannot signal capitalization in the same way, so the footnote should state the interpretive alternatives explicitly. The lexical-alternative footnotes also need anchors corresponding to ‘सेवक’ and ‘अक्षर’.
  issues:
  - severity: medium
    issue: The footnote on ‘आत्मा’ does not accurately preserve the stated Spirit/spirit ambiguity.
    rationale: The main text already reads ‘आत्मा,’ but the note says that it ‘may mean Holy Spirit.’ The relevant ambiguity is whether πνεῦμα denotes the Holy Spirit or a more general spirit/spiritual sense. Since Greek manuscripts do not encode modern capitalization, this needs to be expressed as an interpretive alternative in Hindi.
  - severity: medium
    issue: The footnote-anchor set does not reflect the English audit trail’s lexical alternatives for διακόνους and γράμμα.
    rationale: The English trail records ‘ministers’ as an alternative for ‘servants’ and ‘written code’ as an alternative for ‘letter.’ The draft places its sole lexical note on ‘लिखित अक्षर’ as marker b and omits an anchored alternative for ‘सेवक.’ Separate, correctly anchored notes preserve both decisions without changing the translation.
