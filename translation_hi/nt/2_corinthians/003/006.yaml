id: 2CO.3.6
reference: 2 Corinthians 3:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: hi
  text: जिसने हमें नई वाचा के सेवक[b] होने के योग्य भी बनाया—लिखित अक्षर[c] के नहीं, बल्कि आत्मा[a] के; क्योंकि लिखित अक्षर मारता है, पर आत्मा जीवन देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर ‘आत्मा’ को पवित्र आत्मा के बजाय सामान्य ‘आत्मा’ या ‘भाव’ के अर्थ में भी समझा जा सकता है; यूनानी पांडुलिपियाँ बड़े और छोटे अक्षरों का यह भेद नहीं दिखातीं।
    reason: alternative_reading
  - marker: b
    text: ‘सेवक’ का अनुवाद ‘परिचारक’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘लिखित अक्षर’ का अर्थ ‘लिखित विधान’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: योग्य बनाया
  rationale: यह क्रिया परमेश्वर द्वारा सेवा के लिए समर्थ और उपयुक्त बनाए जाने का भाव देती है; केवल औपचारिक नियुक्ति या न्यूनतम पर्याप्तता का नहीं।
- source_word: διακόνους
  choice: सेवक
  rationale: यह διάκονος के सेवा-केंद्रित अर्थ को स्वाभाविक हिन्दी में रखता है और बाद के कलीसियाई पद का अनावश्यक संकेत नहीं देता।
- source_word: καινῆς διαθήκης
  choice: नई वाचा के
  rationale: अनिश्चित उपपद वाली यूनानी अभिव्यक्ति को सहज हिन्दी में प्रस्तुत करता है और पौलुस के वाचा-संबंधी संदर्भ को बनाए रखता है।
- source_word: γράμματος / γράμμα
  choice: लिखित अक्षर
  rationale: ‘अक्षर’ रूपक को सुरक्षित रखते हुए ‘लिखित’ यह स्पष्ट करता है कि यहाँ ध्वनि नहीं, लिखित रूप अभिप्रेत है; फिर भी इसे केवल ‘लिखित विधान’ तक सीमित नहीं किया गया।
- source_word: πνεύματος / πνεῦμα
  choice: आत्मा
  rationale: नई वाचा के संदर्भ में पवित्र आत्मा सबसे संभावित आशय है, पर हिन्दी में यही रूप ‘आत्मा/भाव’ की शेष अस्पष्टता को भी पूरी तरह मिटाता नहीं।
- source_word: ἀποκτέννει
  choice: मारता है
  rationale: मूल के सशक्त और संक्षिप्त वर्तमानकालीन कथन को सीधे बनाए रखता है।
- source_word: ζῳοποιεῖ
  choice: जीवन देता है
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और जीवन प्रदान करने वाली क्रिया का अर्थ स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: πνεῦμα का आशय पवित्र आत्मा है या ‘आत्मा/भाव’
  choice: मुख्य पाठ में ‘आत्मा’, पवित्र आत्मा के संभावित संकेत सहित
  alternative: ‘भाव’ या सामान्य ‘आत्मा’
  rationale: नई वाचा और जीवन देने के पौलुसी संदर्भ में पवित्र आत्मा प्रमुख अर्थ है, किंतु यूनानी लिपि बड़े-छोटे अक्षरों से यह भेद नहीं करती; इसलिए वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
- issue: γράμμα को शाब्दिक ‘अक्षर’ समझें या ‘लिखित विधान’
  choice: लिखित अक्षर
  alternative: लिखित विधान
  rationale: पौलुस के तीखे ‘अक्षर/आत्मा’ विरोध को सुरक्षित रखना उचित है; ‘लिखित विधान’ संभव व्याख्या है, पर मुख्य पाठ में रखने पर रूपक का दायरा अनावश्यक रूप से संकरा हो जाएगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य की पौलुसी संक्षिप्तता और ‘अक्षर/आत्मा’, ‘मारता/जीवन देता’ के समानांतर विरोध को बनाए रखा गया है।
