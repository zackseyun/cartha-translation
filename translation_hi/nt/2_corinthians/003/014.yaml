source:
  edition: SBLGNT
  text: ἀλλὰ ἐπωρώθη τὰ νοήματα αὐτῶν. ἄχρι γὰρ τῆς σήμερον ⸀ἡμέρας τὸ αὐτὸ κάλυμμα ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης μένει μὴ ἀνακαλυπτόμενον, ⸀ὅτι ἐν Χριστῷ καταργεῖται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: hi
  text: परन्तु उनके मन कठोर हो गए। क्योंकि आज के दिन तक, पुरानी वाचा[a] के पढ़े जाने पर वही परदा बना रहता है और उठाया नहीं जाता, क्योंकि वह मसीह में हटा दिया जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “पुराना नियम।” यूनानी में: “पुरानी वाचा।”'
    reason: lexical_alternative
  - marker: b
    text: 'इसका अनुवाद यह भी हो सकता है: “क्योंकि मसीह में ही वह निष्प्रभावी किया जाता है।” मूल वाक्य में यह कुछ अस्पष्ट है कि ‘वह’ परदे को दर्शाता है या पुरानी वाचा को।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπωρώθη τὰ νοήματα αὐτῶν
  choice: उनके मन कठोर हो गए
  rationale: यह प्रयोग उनकी समझ और ग्रहण-शक्ति के असंवेदनशील हो जाने को व्यक्त करता है और यूनानी कर्मवाच्य भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: क्योंकि आज के दिन तक
  rationale: मूल पाठ के कालगत बल को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: κάλυμμα
  choice: परदा
  rationale: आस-पास के प्रसंग में मूसा के परदे से जुड़ी उपमा को बनाए रखता है।
- source_word: ἐπὶ τῇ ἀναγνώσει
  choice: के पढ़े जाने पर
  rationale: पढ़े जाने की घटना और उसके साथ परदे के बने रहने के संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: παλαιᾶς διαθήκης
  choice: पुरानी वाचा
  rationale: διαθήκη का यहाँ मूल अर्थ ‘वाचा’ है; ‘पुराना नियम’ पारंपरिक विकल्प है, पर मूल शब्द को कम प्रत्यक्ष रूप से दर्शाता है।
- source_word: μένει μὴ ἀνακαλυπτόμενον
  choice: पड़ा रहता है और उठाया नहीं जाता
  rationale: परदे की उपमा को स्वाभाविक हिन्दी में बनाए रखते हुए उसके लगातार बने रहने और न हटाए जाने का भाव व्यक्त करता है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: Χριστός के पदवीगत अर्थ को परियोजना की नीति और आधुनिक हिन्दी बाइबलीय प्रयोग के अनुरूप व्यक्त करता है।
- source_word: καταργεῖται
  choice: हटा दिया जाता है
  rationale: निकटतम पूर्वपद ‘परदा’ के साथ यह अर्थ स्वाभाविक है और वर्तमान कर्मवाच्य रूप को बनाए रखता है।
theological_decisions:
- issue: καταργεῖται का निहित कर्ता
  choice: 'मुख्य पाठ में ‘वह’ का संकेत निकटतम पूर्वपद ‘परदा’ की ओर है: परदा मसीह में हटा दिया जाता है।'
  alternative: इसे पुरानी वाचा के निष्प्रभावी या अलग कर दिए जाने के अर्थ में भी समझा जा सकता है; वाक्यरचना में कुछ अस्पष्टता है।
  rationale: ‘परदा’ निकटतम और उपमा के अनुरूप पूर्वपद है, पर मूल यूनानी में कर्ता खुलकर नहीं कहा गया। इसलिए मुख्य पाठ सहज अर्थ देता है और पाद-टिप्पणी महत्वपूर्ण वैकल्पिक समझ को सुरक्षित रखती है।
- issue: ὅτι का संबंध
  choice: '‘क्योंकि’ के रूप में लिया गया है: परदा इसलिए नहीं उठता कि उसका हटना मसीह में होता है।'
  alternative: वाक्यांश को इस अर्थ में भी जोड़ा जा सकता है कि यह प्रकट नहीं होता कि वह मसीह में निष्प्रभावी किया जाता है।
  rationale: कारणसूचक अर्थ संदर्भ में सहज है, पर यूनानी वाक्य-संबंध पूरी तरह निर्विवाद नहीं है; अतः संबंधित अस्पष्टता पाद-टिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पड़ा रहता है’ परदे की निरंतर उपस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है। सभी पाद-टिप्पणी चिह्न संबंधित शब्द या वाक्यांश के तुरंत बाद रखे गए हैं।
