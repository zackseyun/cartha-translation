base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/016.yaml
  text: But whenever one turns to the Lord[b][a], the veil is removed.
translation:
  language: hi
  text: परन्तु जब कभी कोई प्रभु की ओर मुड़ता है[a], तो परदा हटा दिया जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परन्तु जब कोई प्रभु की ओर मुड़ता है।”
    reason: ‘जब कभी’ में निहित अनिश्चित अथवा बार-बार लागू होने वाले भाव के स्थान पर सरल कालगत अनुवाद की सम्भावना दिखाता है।
  - marker: b
    text: या, “परदा उठा लिया जाता है।”
    reason: περιαιρεῖται के कर्मवाच्य अर्थ का एक समान रूप से सम्भव हिन्दी अनुवाद देता है।
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: परन्तु जब कभी
  rationale: δέ के विरोध/संक्रमण को ‘परन्तु’ से और अनिश्चित अथवा बार-बार लागू होने वाले कालगत भाव को ‘जब कभी’ से व्यक्त किया गया है।
- source_word: ἐπιστρέψῃ
  choice: फिरता है
  rationale: यह प्रभु की ओर मुड़ने की दिशात्मक छवि बनाए रखता है और ‘मन फिराता है’ या ‘धर्म-परिवर्तन करता है’ जैसा अधिक विशिष्ट अर्थ नहीं जोड़ता।
- source_word: πρὸς κύριον
  choice: प्रभु की ओर
  rationale: πρός की दिशात्मकता को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: κύριον
  choice: प्रभु
  rationale: κύριος के लिए प्रचलित, गरिमापूर्ण पद है और इस पद में प्रभु की पहचान को उससे अधिक स्पष्ट नहीं करता जितना यूनानी पाठ करता है।
- source_word: περιαιρεῖται
  choice: हटा दिया जाता है
  rationale: वर्तमान कर्मवाच्य को सुरक्षित रखता है और हटाने वाले कर्ता को स्पष्ट रूप से नहीं जोड़ता।
- source_word: τὸ κάλυμμα
  choice: परदा
  rationale: मूसा के परदे के प्रसंग में κάλυμμα के लिए सटीक और सामान्यतः समझा जाने वाला शब्द है।
theological_decisions:
- issue: अव्यक्त एकवचन कर्ता को हिन्दी में कैसे व्यक्त किया जाए
  choice: ‘कोई’ जोड़कर सामान्य, अनिश्चित कर्ता व्यक्त किया गया
  alternative: ‘वह’ अथवा कर्ता को पूरी तरह अव्यक्त रखना
  rationale: यूनानी क्रिया में कोई व्यक्त संज्ञा नहीं है। ‘कोई’ हिन्दी वाक्य को स्वाभाविक रखते हुए सामान्य अनुप्रयोग व्यक्त करता है और कर्ता को किसी विशेष व्यक्ति या समूह तक सीमित नहीं करता।
- issue: ‘प्रभु’ की पहचान
  choice: केवल ‘प्रभु’ रखा गया
  alternative: ‘प्रभु मसीह’ अथवा ‘प्रभु अर्थात् आत्मा’
  rationale: इस पद में केवल κύριον है। निकटवर्ती प्रसंग में प्रभु और आत्मा का जटिल संबंध है, इसलिए अनुवाद में उसकी पहचान को अतिरिक्त शब्दों से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘प्रभु की ओर फिरता है’ मूल की दिशात्मक उपमा तथा ‘हटा दिया जाता है’ मूल के कर्मवाच्य को सुरक्षित रखते हैं।
