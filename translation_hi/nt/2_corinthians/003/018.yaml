source:
  edition: SBLGNT
  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: hi
  text: और हम सब, अनावृत्त मुख से प्रभु की महिमा को दर्पण में देखते हुए[a], उसी स्वरूप में महिमा से महिमा तक रूपांतरित किए जा रहे हैं, जैसा कि प्रभु, अर्थात् आत्मा, की ओर से होता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रभु की महिमा को दर्पण के समान प्रतिबिम्बित करते हुए।’
    reason: alternative_reading
  - marker: b
    text: या ‘उस प्रभु की ओर से, जो आत्मा है’; अथवा ‘प्रभु की आत्मा की ओर से।’
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: खुले चेहरे से
  rationale: पूर्णकालिक कृदंत से प्रकट वर्तमान अवस्था को सहज हिन्दी में व्यक्त करता है और सामूहिक एकवचन ‘चेहरे’ को बनाए रखता है।
- source_word: δόξαν κυρίου
  choice: प्रभु की महिमा
  rationale: सम्बन्धकारक का सीधा और स्वाभाविक हिन्दी रूप; κύριος के लिए परियोजना-संगत ‘प्रभु’।
- source_word: κατοπτριζόμενοι
  choice: मानो दर्पण में देखते हुए
  rationale: क्रिया के दर्पण में निहारने वाले अर्थ को मुख्य पाठ में रखता है; प्रतिबिम्बित करने का वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: τὴν αὐτὴν εἰκόνα
  choice: उसी स्वरूप में
  rationale: पूर्वोक्त प्रभु की महिमा से जुड़े उसी प्रतिरूप की ओर संकेत बनाए रखता है; हिन्दी में ‘स्वरूप’ व्यक्ति-संबंधी εἰκών के लिए स्वाभाविक है।
- source_word: μεταμορφούμεθα
  choice: रूपांतरित किए जा रहे हैं
  rationale: वर्तमानकालीन कर्मवाच्य की जारी प्रक्रिया और बाहरी कर्तृत्व, दोनों को स्पष्ट रखता है।
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: महिमा से महिमा तक
  rationale: यूनानी की संक्षिप्त अभिव्यक्ति को बिना ‘एक स्तर से दूसरे स्तर’ जैसी व्याख्यात्मक वृद्धि के बनाए रखता है।
- source_word: καθάπερ
  choice: जैसा कि
  rationale: प्रसंग में स्रोत अथवा रीति की तुलना प्रस्तुत करने वाला स्वाभाविक आधुनिक हिन्दी समतुल्य।
- source_word: ἀπὸ κυρίου πνεύματος
  choice: प्रभु, अर्थात् आत्मा, की ओर से
  rationale: संक्षिप्त यूनानी पदबंध में ‘प्रभु’ और ‘आत्मा’ के समानाधिकरण को मुख्य पाठ में दर्शाता है, जबकि अन्य सम्भव वाक्य-संबंध पादटिप्पणी में दिए गए हैं।
- source_word: κύριος
  choice: प्रभु
  rationale: दोनों स्थानों पर κύριος का प्रतिष्ठित, गरिमापूर्ण और सामान्य हिन्दी अनुवाद।
theological_decisions:
- issue: κατοπτριζόμενοι का अर्थ
  choice: प्रभु की महिमा को मानो दर्पण में देखते हुए
  alternative: प्रभु की महिमा को दर्पण के समान प्रतिबिम्बित करते हुए
  rationale: प्रभु की महिमा को देखने से रूपांतरण की प्रासंगिक गति ‘देखते हुए’ के पक्ष में है; फिर भी यूनानी क्रिया के प्रतिबिम्बित करने वाले सम्भव अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: अंतिम पदबंध में κυρίου और πνεύματος का संबंध
  choice: प्रभु, अर्थात् आत्मा, की ओर से
  alternative: उस प्रभु की ओर से, जो आत्मा है; अथवा प्रभु के आत्मा की ओर से
  rationale: यूनानी पदबंध अत्यन्त संक्षिप्त और वाक्यगत रूप से बहुअर्थी है। मुख्य पाठ समानाधिकरण को निकटता से रखता है और अन्य वास्तविक सम्भावनाओं को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘खुले चेहरे’, ‘दर्पण’, ‘स्वरूप’ और ‘रूपांतरित’ जैसे शब्द सामान्य बोधगम्यता तथा मूल पाठ की औपचारिक निकटता में संतुलन रखते हैं।
