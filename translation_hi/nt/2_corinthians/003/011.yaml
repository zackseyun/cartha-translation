  text: εἰ γὰρ τὸ καταργούμενον διὰ δόξης, πολλῷ μᾶλλον τὸ μένον ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/011.yaml
  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: hi
  text: क्योंकि यदि जो समाप्त किया जा रहा था, वह महिमा के साथ था[a], तो जो बना रहता है, वह कहीं अधिक महिमा में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘महिमा के द्वारा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: जो समाप्त किया जा रहा था
  rationale: वर्तमान कर्मवाच्य कृदंत किसी वस्तु के निष्प्रभावी या समाप्त किए जाने की प्रक्रिया बताता है। यह अनुवाद केवल ‘मिटता जा रहा था’ कहने की अपेक्षा यूनानी क्रिया का कर्मवाच्य भाव अधिक स्पष्ट रखता है।
- source_word: διὰ δόξης
  choice: महिमा के साथ था
  rationale: διά के संबंधकारक प्रयोग का शाब्दिक अर्थ ‘महिमा के द्वारा/माध्यम से’ है, पर यहाँ स्वाभाविक हिन्दी में यह उस अस्थायी वस्तु के महिमा से युक्त होने का भाव व्यक्त करता है।
- source_word: μένον
  choice: जो बना रहता है
  rationale: यह वर्तमान कर्तृवाच्य कृदंत निरंतर रहने या स्थायी बने रहने को दर्शाता है और पहले कृदंत के साथ समानांतर संरचना बनाए रखता है।
- source_word: ἐν δόξῃ
  choice: महिमा में है
  rationale: यह पूर्वसर्गीय वाक्यांश का सीधा अनुवाद है और ‘महिमा के साथ’ तथा ‘महिमा में’ के बीच पौलुस के अलंकारिक अंतर को सुरक्षित रखता है।
- source_word: πολλῷ μᾶλλον
  choice: कहीं अधिक
  rationale: यह तुलनात्मक बल को स्वाभाविक आधुनिक हिन्दी में प्रकट करता है।
theological_decisions:
- issue: अस्थायी और स्थायी के बीच विरोध का स्वरूप
  choice: पद में प्रयुक्त अनिर्दिष्ट नपुंसकलिंगी कृदंतों को ‘जो समाप्त किया जा रहा था’ और ‘जो बना रहता है’ के रूप में रखा गया है।
  alternative: पद में ही इन्हें स्पष्ट रूप से ‘पुरानी वाचा’ और ‘नई वाचा’ कहा जा सकता था।
  rationale: यूनानी पाठ इस पद में वाचाओं का नाम नहीं लेता; उनकी पहचान प्रसंग से होती है। इसलिए अनुवाद पौलुस की संक्षिप्त और तनावपूर्ण अभिव्यक्ति को बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और मूल की समानांतर संरचना के निकट रखी गई है। कर्मवाच्य ‘समाप्त किया जा रहा था’ जानबूझकर रखा गया है ताकि καταργούμενον का व्याकरणिक भाव बना रहे।
