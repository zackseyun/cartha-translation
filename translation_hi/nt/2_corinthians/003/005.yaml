    text: या, “किसी भी बात को अपनी ओर से होने का हिसाब लगाएँ” या “अपनी ओर से मानें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: यह नहीं कि
  rationale: यह वाक्यांश किसी कारण का निषेध नहीं, बल्कि पिछली बात पर स्पष्टीकरण या सीमा प्रस्तुत करता है।
- source_word: ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν
  choice: हम अपने आप में इस योग्य हैं
  rationale: यह स्वाभाविक हिन्दी में स्वयं में निहित या स्वयं से उत्पन्न पर्याप्तता का भाव व्यक्त करता है।
- source_word: λογίσασθαί τι
  choice: किसी बात को ... समझें
  rationale: λογίζομαι यहाँ मानसिक आकलन या मानने के अर्थ में है; ‘समझें’ आधुनिक और सुबोध है।
- source_word: ὡς ἐξ αὑτῶν
  choice: अपनी ओर से निकली हुई
  rationale: यह मूल या स्रोत का भाव स्पष्ट करता है, बिना उसे केवल विचार या कार्य तक सीमित किए।
- source_word: ἡ ἱκανότης ἡμῶν
  choice: हमारी योग्यता
  rationale: ‘योग्यता’ ἱκανός और ἱκανότης की शब्दगत कड़ी बनाए रखती है और आवश्यक सामर्थ्य या पर्याप्तता का व्यापक भाव देती है।
- source_word: ἐκ τοῦ θεοῦ
  choice: परमेश्वर की ओर से है
  rationale: यह परमेश्वर को योग्यता के स्रोत के रूप में सीधे और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: पौलुस के कथन में मानवीय क्षमता का दायरा
  choice: 'शब्दावली को व्यापक रखा गया है: कोई भी योग्यता स्वयं से उत्पन्न नहीं है।'
  alternative: इसे केवल प्रेरिताई सेवकाई की योग्यता तक सीमित समझना।
  rationale: निकट संदर्भ सेवकाई का है, पर यूनानी वाक्य स्वयं व्यापक है; अनुवाद को संदर्भ से अधिक संकीर्ण नहीं किया गया।
