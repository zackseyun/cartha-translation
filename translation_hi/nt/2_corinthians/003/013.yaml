source:
  edition: SBLGNT
  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: hi
  text: और हम मूसा के समान नहीं हैं, जो अपने चेहरे पर परदा रखते थे, ताकि इस्राएल के पुत्र[a] उस वस्तु के अंत[b] को टकटकी लगाकर न देखें, जो समाप्त हो रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् इस्राएली।
    reason: lexical_alternative
  - marker: b
    text: या, “उस वस्तु के लक्ष्य/परिणाम को, जो समाप्त की जा रही थी।”
    reason: alternative_reading
lexical_decisions:
- source_word: καθάπερ
  choice: के समान
  rationale: यह पिछले कथन के साथ तुलना व्यक्त करता है; आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἐτίθει
  choice: डाल लिया करते थे
  rationale: अपूर्ण भूतकाल यहाँ प्रचलित या बार-बार किए जाने वाले कार्य का संकेत देता है।
- source_word: κάλυμμα
  choice: परदा
  rationale: चेहरे को ढकने वाली वस्तु और आगे चलने वाले पौलुस के रूपक—दोनों के लिए यह स्थापित और सहज शब्द है।
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: ताकि ... टकटकी लगाकर न देखें
  rationale: यह प्रयोजन व्यक्त करने वाली रचना है; ‘टकटकी लगाकर देखना’ ἀτενίζω की एकाग्र दृष्टि को सुरक्षित रखता है।
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: इस्राएल के पुत्र
  rationale: मूल यूनानी की स्पष्ट बाइबलीय अभिव्यक्ति को सुरक्षित रखा गया है; पाठक-सुगमता के लिए अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: εἰς τὸ τέλος
  choice: अंत को
  rationale: τέλος के ‘अंत’, ‘लक्ष्य’ या ‘परिणाम’ अर्थ संभव हैं; निकट संदर्भ में समाप्ति प्रमुख लगती है, पर वास्तविक अस्पष्टता पाद-टिप्पणी में रखी गई है।
- source_word: τοῦ καταργουμένου
  choice: उस वस्तु के ... जो समाप्त हो रही थी
  rationale: वर्तमान कृदंत की जारी प्रक्रिया और किसी वस्तु के प्रभावहीन होकर समाप्त होने का भाव व्यक्त करता है; ‘महिमा’ शब्द मूल पद में प्रत्यक्ष नहीं होने के कारण नहीं जोड़ा गया।
theological_decisions:
- issue: τέλος τοῦ καταργουμένου का अर्थ
  choice: जो समाप्त हो रही थी, उसके अंत को
  alternative: जो समाप्त की जा रही थी, उसके लक्ष्य/परिणाम को
  rationale: संदर्भ अस्थायी और स्थायी के विरोध की ओर संकेत करता है, इसलिए समाप्ति का अर्थ मुख्य पाठ में उपयुक्त है; फिर भी τέλος की लक्ष्य/परिणाम वाली संभावना को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: मुख्य क्रिया का निहित कर्ता
  choice: हम
  alternative: पिछले पद से केवल क्रियात्मक तुलना को बिना स्पष्ट कर्ता के व्यक्त करना
  rationale: यूनानी पद καὶ οὐ καθάπερ से पिछले पद के ‘हम’ और उसके कार्य का अनुसरण करता है। हिन्दी में पूर्ण वाक्य के लिए ‘हम’ स्पष्ट करना स्वाभाविक है और नया धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण स्तर रखा गया है। ‘परदा’, ‘चेहरा’ और ‘टकटकी लगाकर देखना’ सामान्य पाठक के लिए स्पष्ट हैं। मूल की ‘इस्राएल के पुत्र’ अभिव्यक्ति मुख्य पाठ में रखकर उसका मुहावरेदार अर्थ पाद-टिप्पणी में दिया गया है।
