translation:
  language: hi
  text: हमारा पत्र तो आप ही हैं, जो हमारे हृदयों में लिखा हुआ है और जिसे सभी लोग जानते और पढ़ते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἐπιστολὴ ἡμῶν
  choice: हमारी पत्री
  rationale: ἐπιστολή का अर्थ लिखित संदेश या पत्र है। यहाँ रूपक को स्पष्ट रखने के लिए ‘पत्री’ चुना गया है; यह सामान्य ‘पत्र’ की अपेक्षा व्यक्ति-रूपक के साथ अधिक स्वाभाविक ढंग से जुड़ता है और आधुनिक हिन्दी में भी समझने योग्य है। संबंधकारक ἡμῶν को ‘हमारी’ से व्यक्त किया गया है।
- source_word: ὑμεῖς ἐστε
  choice: आप ही हैं
  rationale: अलग से प्रयुक्त ὑμεῖς में निहित बल को स्वाभाविक हिन्दी में ‘आप ही’ से व्यक्त किया गया है। बहुवचन आदरसूचक ‘आप’ कुरिन्थ की पूरी कलीसिया को संबोधित करता है।
- source_word: ἐγγεγραμμένη
  choice: लिखी हुई
  rationale: पूर्णकालिक कर्मवाच्य कृदन्त उस स्थायी दशा को दर्शाता है कि पत्र लिखा हुआ है। ‘लिखी हुई’ रूपक को सहज और स्पष्ट रखता है।
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: हमारे हृदयों में
  rationale: ἐν का स्थानगत भाव ‘में’ से और बहुवचन καρδίαις का रूप ‘हृदयों’ से सुरक्षित रखा गया है। ‘हृदय’ यहाँ व्यक्ति के आंतरिक भाव और चेतना का द्योतक है।
- source_word: γινωσκομένη καὶ ἀναγινωσκομένη
  choice: जानी और पढ़ी जाती है
  rationale: दोनों समानान्तर कर्मवाच्य कृदन्तों को बनाए रखा गया है। γινώσκω का ‘जानी’ अर्थ स्वाभाविक है, जबकि ἀναγινώσκω का ‘पढ़ी’ पत्र के रूपक को प्रत्यक्ष रूप से जारी रखता है।
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: सब लोगों के द्वारा
  rationale: ὑπό कर्मकर्ता को सूचित करता है, इसलिए ‘के द्वारा’ रखा गया है। ἀνθρώπων यहाँ केवल पुरुषों के लिए नहीं बल्कि सामान्यतः मनुष्यों के लिए है; अतः ‘सब लोग’ सटीक और समावेशी है।
