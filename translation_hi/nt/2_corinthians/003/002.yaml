translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य की रूपकात्मक संरचना तथा ‘जानी और पढ़ी’ की शब्द-क्रीड़ा सुरक्षित है। ‘आप ही’ से यूनानी सर्वनाम का बल प्रकट होता है, जबकि अनावश्यक व्याख्या पाठ में नहीं जोड़ी गई।
