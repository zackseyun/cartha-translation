lexical_decisions:
- source_word: πῶς οὐχὶ
  choice: क्यों न होगी
  rationale: यह स्वाभाविक हिन्दी में उस आलंकारिक प्रश्न को बनाए रखता है जिसका अपेक्षित उत्तर सकारात्मक है।
- source_word: μᾶλλον
  choice: और भी अधिक
  rationale: पिछले पद की तुलना में कम से अधिक की ओर बढ़ते तर्क को स्पष्ट करता है।
- source_word: ἡ διακονία
  choice: सेवा
  rationale: यहाँ यह परमेश्वर द्वारा सौंपी गई सेवकाई को दर्शाता है; ‘सेवा’ आधुनिक हिन्दी में सहज है और संक्षिप्त यूनानी अभिव्यक्ति को अनावश्यक रूप से नहीं फैलाता।
- source_word: τοῦ πνεύματος
  choice: आत्मा की
  rationale: निकटवर्ती संदर्भ में संकेत पवित्र आत्मा की ओर है; ‘आत्मा’ आदरसूचक बड़े आरम्भिक अक्षर के अभाव वाली देवनागरी में भी संदर्भ से स्पष्ट है।
- source_word: ἔσται
  choice: होगी
  rationale: εἰμί के सरल भविष्यकाल और स्त्रीलिंग ‘सेवा’ के साथ व्याकरणिक सामंजस्य को बनाए रखता है।
- source_word: ἐν δόξῃ
  choice: महिमा में
  rationale: पूर्वसर्गीय वाक्यांश को सुरक्षित रखता है और आसपास के पदों में ‘महिमा’ की पुनरावृत्ति से विषयगत संबंध बनाए रखता है।
theological_decisions:
- issue: πνεύματος का अभिप्रेत अर्थ
  choice: आत्मा = पवित्र आत्मा
  alternative: मानवीय या अमूर्त ‘आत्मा/भाव’
  rationale: 2 कुरिन्थियों 3:6 के जीवन देने वाले आत्मा और वाचा-संबंधी विरोध के कारण यहाँ पवित्र आत्मा सबसे स्वाभाविक अभिप्राय है।
- issue: ἐν δόξῃ का अर्थ-संबंध
  choice: महिमा में
  alternative: महिमा के साथ; महिमामय
  rationale: ‘महिमा में’ यूनानी संरचना और अनुच्छेद की शब्दावली को निकटता से सुरक्षित रखता है, यद्यपि हिन्दी में ‘महिमा के साथ’ भी संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण और सामान्य पाठक के लिए सहज। आलंकारिक प्रश्न की सकारात्मक अपेक्षा तथा मूल के ‘महिमा में’ वाक्यांश को बनाए रखा गया है।
