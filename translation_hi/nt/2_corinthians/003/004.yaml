  text: Πεποίθησιν δὲ τοιαύτην ἔχομεν διὰ τοῦ Χριστοῦ πρὸς τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/004.yaml
  text: Such confidence we have through Messiah toward God[a][b].
translation:
  language: hi
  text: और मसीह के द्वारा परमेश्वर की ओर हमारा ऐसा भरोसा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “परमेश्वर के सामने।” शाब्दिक अर्थ: “परमेश्वर की ओर।”'
    reason: πρός के यहाँ सम्बन्धपरक अर्थ को ‘परमेश्वर के सामने’ भी समझा जा सकता है; मुख्य पाठ अधिक शाब्दिक दिशात्मक भाव रखता है।
lexical_decisions:
- source_word: Πεποίθησιν
  choice: भरोसा
  rationale: यह शब्द प्रसंग में स्थिर आत्मविश्वास या निश्चय को व्यक्त करता है; ‘भरोसा’ सहज आधुनिक हिन्दी में इस भाव को रखता है, बिना इसे परमेश्वर पर भरोसा करने की अलग क्रिया के रूप में अधिक स्पष्ट किए।
- source_word: δὲ
  choice: और
  rationale: यह हल्का संयोजक पिछले कथन से विचार की निरंतरता दिखाता है; हिन्दी में ‘और’ स्वाभाविक है।
- source_word: τοιαύτην
  choice: ऐसा
  rationale: यह पिछले संदर्भ में वर्णित प्रकार के भरोसे की ओर संकेत करने वाले गुणात्मक भाव को बनाए रखता है।
- source_word: ἔχομεν
  choice: हमारा ... है
  rationale: ग्रीक ‘हम रखते हैं/हमारे पास है’ का हिन्दी में स्वाभाविक रूप ‘हमारा ... है’ है।
- source_word: διὰ τοῦ Χριστοῦ
  choice: मसीह के द्वारा
  rationale: सम्बन्धकारक के साथ διά माध्यम या मध्यस्थता व्यक्त करता है; ‘के द्वारा’ इस अर्थ को स्पष्ट और स्वाभाविक ढंग से रखता है। Χριστός को यहाँ उपाधि के रूप में ‘मसीह’ किया गया है।
- source_word: πρὸς τὸν θεόν
  choice: परमेश्वर की ओर
  rationale: πρός का मूल दिशात्मक और सम्बन्धपरक भाव ‘की ओर’ से सुरक्षित रहता है; वाक्य की कुछ असामान्य किन्तु वास्तविक ईश्वराभिमुखता को अधिक व्याख्यायित नहीं किया गया।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; ‘मसीह’ आधुनिक हिन्दी में परिचित है और ‘अभिषिक्त जन’ की मसीही उपाधि को बनाए रखता है।
- issue: πρὸς τὸν θεόν का सम्बन्धपरक अर्थ
  choice: परमेश्वर की ओर
  alternative: परमेश्वर के सामने
  rationale: ‘परमेश्वर की ओर’ ग्रीक की दिशात्मक अस्पष्टता को बनाए रखता है; ‘परमेश्वर के सामने’ अधिक मुहावरेदार है, पर यह सम्बन्ध को उपस्थिति या उत्तरदायित्व के अर्थ में कुछ अधिक निश्चित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ऐसा भरोसा’ पिछले पदों से सम्बन्ध बनाए रखता है, और ‘परमेश्वर की ओर’ मूल यूनानी की वास्तविक अर्थगत तन्यता को सुरक्षित रखता है।
