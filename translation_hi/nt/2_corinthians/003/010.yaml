source:
  edition: SBLGNT
  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: hi
  text: क्योंकि वास्तव में, जो महिमान्वित किया गया था, वह उस महिमा के कारण, जो बढ़कर है, इस दृष्टि से महिमान्वित नहीं ठहरा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस उत्कृष्ट महिमा के कारण।” यूनानी में यह स्पष्ट नहीं किया गया है कि वह महिमा किससे बढ़कर है।
    reason: lexical_alternative_and_source_ambiguity
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि वास्तव में
  rationale: ‘क्योंकि’ γάρ के व्याख्यात्मक-संबंधसूचक बल को और ‘वास्तव में’ καί के हल्के बलाघात को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὐ δεδόξασται
  choice: महिमान्वित नहीं ठहरा
  rationale: पूर्ण निष्क्रिय क्रिया के परिणामकारी भाव और पौलुस के विरोधाभासी कथन को बनाए रखता है; यह पूर्णतः महिमा का निषेध नहीं, बल्कि तुलनात्मक संदर्भ में उसका निष्प्रभ ठहरना है।
- source_word: τὸ δεδοξασμένον
  choice: जिसे महिमान्वित किया गया था
  rationale: संज्ञा के रूप में प्रयुक्त पूर्ण निष्क्रिय कृदंत को बिना कोई अतिरिक्त संज्ञा जोड़े व्यक्त करता है और पहले दी गई महिमा की ओर संकेत बनाए रखता है।
- source_word: ἐν τούτῳ τῷ μέρει
  choice: इस दृष्टि से
  rationale: तुलना की सीमित परिधि को स्वाभाविक हिन्दी में स्पष्ट करता है और पहले की महिमा के निरपेक्ष निषेध से बचाता है।
- source_word: εἵνεκεν
  choice: के कारण
  rationale: कारणसूचक संबंध का सीधा और सहज हिन्दी रूप है।
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: उस महिमा के कारण ... जो उससे कहीं बढ़कर है
  rationale: कृदंत के प्रबल तुलनात्मक भाव को स्पष्ट करता है। ‘उससे’ संदर्भ से पूर्ववर्ती महिमा को सूचित करता है, यद्यपि यूनानी में तुलना का कर्म व्यक्त नहीं है।
- source_word: δόξα / δεδοξασμένον
  choice: महिमान्वित ... महिमा ... महिमान्वित
  rationale: δοξ- शब्द-समूह की पुनरावृत्ति और पौलुस की अलंकारिक शब्द-संगति को हिन्दी में यथासंभव सुरक्षित रखता है।
theological_decisions:
- issue: क्या पौलुस पहले की वाचा से संबंधित महिमा का पूर्णतः निषेध करते हैं या तुलनात्मक रूप से बोलते हैं?
  choice: '‘इस दृष्टि से’ द्वारा सीमित तुलनात्मक निषेध: पहले की महिमा, उससे बढ़कर महिमा के सामने महिमा नहीं ठहरती।'
  alternative: पहली सेवकाई में किसी वास्तविक महिमा का पूर्ण अभाव।
  rationale: ἐν τούτῳ τῷ μέρει निषेध को एक विशेष तुलना तक सीमित करता है, और निकटवर्ती प्रसंग पहली सेवकाई में महिमा होने को स्वीकार करता है, यद्यपि वह बड़ी महिमा से ढक जाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘महिमान्वित’ कुछ औपचारिक है, पर δοξ- शब्द-समूह की पुनरावृत्ति सुरक्षित रखने और पद के धार्मिक-अलंकारिक स्वर को बनाए रखने के लिए उपयुक्त है।
