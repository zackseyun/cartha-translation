source:
  edition: SBLGNT
  text: Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: hi
  text: और परमेश्वर के साथ मिलकर काम करते हुए[a] हम तुमसे यह आग्रह भी करते हैं कि परमेश्वर का अनुग्रह व्यर्थ न ग्रहण करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सहकर्मियों के रूप में हम तुमसे आग्रह भी करते हैं।” यूनानी में यह स्पष्ट नहीं किया गया है कि पौलुस किसके साथ काम कर रहे हैं, यद्यपि प्रसंग परमेश्वर की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: परमेश्वर के साथ मिलकर काम करते हुए
  rationale: कृदन्त का क्रियात्मक बल बनाए रखा गया है। यूनानी में सहकर्मी स्पष्ट नहीं है, पर 5:18–20 के प्रसंग में परमेश्वर सबसे स्वाभाविक संकेतित सहकर्मी हैं; इसलिए ‘परमेश्वर’ पाठ में स्पष्ट किया गया और विकल्प पादटिप्पणी में रखा गया है।
- source_word: δὲ
  choice: और
  rationale: यह हल्का संयोजक और प्रसंग-संक्रमण है, प्रबल विरोधसूचक नहीं; ‘और’ हिन्दी में प्रवाह बनाए रखता है।
- source_word: καὶ
  choice: भी
  rationale: आग्रह करने की क्रिया को साथ मिलकर काम करने के साथ जोड़ने वाला योगात्मक अर्थ व्यक्त करता है।
- source_word: παρακαλοῦμεν
  choice: हम तुमसे यह आग्रह करते हैं
  rationale: यहाँ शब्द गंभीर निवेदन या प्रोत्साहन का भाव रखता है। ‘आग्रह’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: μὴ
  choice: न
  rationale: अनन्त क्रिया के साथ साधारण निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς κενὸν
  choice: व्यर्थ
  rationale: मुहावरे का अर्थ निष्फल या बिना प्रभाव के है; ‘व्यर्थ’ संक्षिप्त और स्वाभाविक है।
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: परमेश्वर का अनुग्रह
  rationale: ‘अनुग्रह’ पौलुस के लेखन में χάρις के धार्मिक और संबंधपरक भार को बनाए रखता है; संबंधकारक को सीधे ‘परमेश्वर का’ कहा गया है।
- source_word: δέξασθαι
  choice: ग्रहण करो
  rationale: δέχομαι के ‘प्राप्त/स्वीकार करना’ अर्थ को धार्मिक संदर्भ में स्वाभाविक और सटीक रूप से व्यक्त करता है।
- source_word: ὑμᾶς
  choice: तुमसे … करो
  rationale: बहुवचन संबोधन को आधुनिक मानक हिन्दी के स्पष्ट और सामान्य ‘तुम’ रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ‘साथ मिलकर काम करते हुए’ में संकेतित सहकर्मी
  choice: मुख्य पाठ में ‘परमेश्वर के साथ’
  alternative: ‘सहकर्मियों के रूप में’ या बिना सहकर्मी स्पष्ट किए ‘साथ मिलकर काम करते हुए’
  rationale: यूनानी कृदन्त स्वयं सहकर्मी का नाम नहीं बताता। निकट प्रसंग परमेश्वर के मेल-मिलाप के कार्य और पौलुस की प्रतिनिधिक सेवा पर केंद्रित है, इसलिए परमेश्वर सबसे संभावित संदर्भ हैं। फिर भी वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठकों के लिए स्पष्ट किंतु गरिमापूर्ण। ‘अनुग्रह’, ‘ग्रहण’ और ‘व्यर्थ’ जैसे परिचित धार्मिक शब्द रखे गए हैं। संबोधन बहुवचन ‘तुम’ में है।
