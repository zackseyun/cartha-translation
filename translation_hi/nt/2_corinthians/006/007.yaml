lexical_decisions:
- source_word: λόγῳ ἀληθείας
  choice: सत्य के वचन
  rationale: यह यूनानी पद की संरचना बनाए रखता है और सच्चे कथन तथा सत्य के संदेश—दोनों संभावित अर्थों के लिए स्थान छोड़ता है।
- source_word: δυνάμει θεοῦ
  choice: परमेश्वर की सामर्थ्य
  rationale: यह संबंधकारक संरचना और पहले दो ἐν-वाक्यांशों की समान लय को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: διὰ
  choice: के द्वारा
  rationale: संबंधकारक के साथ διά यहाँ साधन या माध्यम व्यक्त करता है।
- source_word: ὅπλων
  choice: हथियारों
  rationale: ὅπλον युद्ध में प्रयुक्त आक्रामक या रक्षात्मक साधन हो सकता है; ‘हथियार’ इस व्यापकता को ‘कवच’ से बेहतर सुरक्षित रखता है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: यह पौलुस के प्रयोग में δικαιοσύνη का व्यापक नैतिक-धार्मिक अर्थ बनाए रखता है; ‘न्याय’ को वैकल्पिक अर्थ के रूप में टिप्पणी में दिया गया है।
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: जो दाएँ और बाएँ हाथ में हैं
  rationale: यूनानी में ‘हाथ’ निहित है। हिन्दी में इसे स्पष्ट करना स्वाभाविक है और दोनों हाथों से युद्ध के लिए पूर्ण तत्परता की छवि बनाए रखता है।
theological_decisions:
- issue: पौलुस के वाक्यांश में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: ‘धार्मिकता’ शब्द के नैतिक, संबंधपरक और परमेश्वर-प्रदत्त आयामों को समय से पहले संकुचित नहीं करता; ‘न्याय’ वास्तविक शब्दार्थ-संभावना है और टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। पद एक बड़ी सूची का अंश है, इसलिए अंत में अल्पविराम रखा गया है। ‘सामर्थ्य’ बाइबलीय गरिमा बनाए रखते हुए सामान्य पाठक के लिए समझने योग्य है।
