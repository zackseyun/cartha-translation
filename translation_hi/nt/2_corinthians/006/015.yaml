base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: hi
  text: और मसीह का बेलियार[a] के साथ कैसा सामंजस्य है? या विश्वासी का अविश्वासी के साथ क्या हिस्सा है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बेलियार’ यूनानी Βελιάρ का लिप्यंतरण है; इस नाम का वैकल्पिक रूप ‘बेलियाल’ भी प्रचलित है।
    reason: वैकल्पिक नाम-रूप
lexical_decisions:
- source_word: συμφώνησις
  choice: सहमति
  rationale: यह शब्द मेल, सामंजस्य या अनुकूलता का बोध कराता है। प्रश्नात्मक वाक्य में ‘कैसी सहमति’ स्वाभाविक और गरिमापूर्ण है तथा पारस्परिक अनुकूलता का भाव बनाए रखता है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यहाँ Χριστός विरोधात्मक युग्म में उपाधि के रूप में प्रयुक्त है; इसलिए ‘मसीह’ उसके अभिषिक्त जन के अर्थ और शीर्षकीय बल को सुरक्षित रखता है।
- source_word: Βελιάρ
  choice: बेलियार
  rationale: यूनानी पाठ के व्यक्तिवाचक नाम Βελιάρ का निकट देवनागरी लिप्यंतरण किया गया है; परिचित वैकल्पिक रूप ‘बेलियाल’ पादटिप्पणी में दिया गया है।
- source_word: μερίς
  choice: साझा भाग
  rationale: μερίς किसी हिस्से, भाग या सहभागिता को दर्शाता है। ‘साझा भाग’ दोनों व्यक्तियों के बीच किसी समान हिस्से या सहभागिता की धारणा स्पष्ट करता है।
- source_word: πιστῷ
  choice: विश्वासी
  rationale: विशेषण यहाँ संज्ञा के रूप में उस व्यक्ति को दर्शाता है जो विश्वास करता है; ‘विश्वासी’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἀπίστου
  choice: अविश्वासी
  rationale: πιστῷ के प्रत्यक्ष विरोध में यह विश्वास न करने वाले व्यक्ति को दर्शाता है; ‘अविश्वासी’ इस विरोध को स्पष्ट रूप से बनाए रखता है।
- source_word: πρὸς
  choice: के बीच
  rationale: συμφώνησις के साथ यह परस्पर संबंध व्यक्त करता है; हिन्दी में ‘के बीच’ इसका स्वाभाविक रूप है।
- source_word: μετὰ
  choice: के साथ
  rationale: यह संगति या सहभागिता का संबंध बताता है; ‘के साथ’ सीधा और स्वाभाविक अनुवाद है।
- source_word: δὲ
  choice: और
  rationale: δέ यहाँ प्रश्नों की क्रमिक शृंखला को आगे बढ़ाता है; ‘और’ अनावश्यक विरोध जोड़े बिना उस प्रवाह को बनाए रखता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ शब्द बेलियार के साथ वैचारिक विरोध में उपाधि के रूप में आता है। ‘मसीह’ शीर्षकीय अर्थ को बनाए रखता है और हिन्दी बाइबलीय भाषा में व्यापक रूप से समझा जाता है।
- issue: Βελιάρ की पहचान और रूप
  choice: बेलियार—एक व्यक्तिवाचक नाम
  alternative: बेलियाल
  rationale: मुख्य पाठ यूनानी रूप Βελιάρ का लिप्यंतरण करता है और उसके बारे में अतिरिक्त पहचान आरोपित नहीं करता। अधिक परिचित वैकल्पिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। समानांतर आलंकारिक प्रश्नों की संरचना और मसीह–बेलियार तथा विश्वासी–अविश्वासी के विरोध को सुरक्षित रखा गया है।
