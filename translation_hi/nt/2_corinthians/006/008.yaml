  text: आदर और अनादर में, निन्दा और प्रशंसा में; भरमानेवाले समझे जाते हैं, फिर भी सच्चे हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप में: “मानो भरमानेवाले और सच्चे।” यहाँ पहला वर्णन इस बात को दर्शाता है कि लोग पौलुस और उसके सहकर्मियों को कैसा समझते हैं, जबकि दूसरा बताता है कि वे वास्तव में कैसे हैं।'
    reason: मूल यूनानी की संक्षिप्त और कुछ हद तक अस्पष्ट विरोधात्मक रचना को दर्ज करना।
lexical_decisions:
- source_word: διὰ
  choice: में
  rationale: संबंधित कारक के साथ यहाँ यह उन विपरीत परिस्थितियों या दशाओं को व्यक्त करता है जिनके बीच सेवा जारी रहती है। स्वाभाविक हिन्दी में दोहराया गया ‘में’ इस अर्थ और समानांतर रचना को बनाए रखता है।
- source_word: δόξης
  choice: आदर
  rationale: ἀτιμία के विपरीत यहाँ δόξα का सामाजिक और सार्वजनिक अर्थ है; इसलिए धार्मिक अर्थवाले ‘महिमा’ की अपेक्षा ‘आदर’ अधिक उपयुक्त है।
- source_word: ἀτιμίας
  choice: अनादर
  rationale: यह ‘आदर’ का संक्षिप्त और संतुलित विलोम है तथा सार्वजनिक अपमान या प्रतिष्ठा की कमी का भाव रखता है।
- source_word: δυσφημίας
  choice: निन्दा
  rationale: यह प्रतिकूल कथन या बदनामी को दर्शाता है। ‘निन्दा’ आधुनिक हिन्दी में स्वाभाविक है और अगले सकारात्मक पद से स्पष्ट विरोध बनाता है।
- source_word: εὐφημίας
  choice: प्रशंसा
  rationale: यह अनुकूल कथन या अच्छी ख्याति को व्यक्त करता है। ‘प्रशंसा’ ‘निन्दा’ के साथ स्वाभाविक और तीखा विरोध बनाती है।
- source_word: ὡς
  choice: समझे जाते हैं
  rationale: यह रूप सार्वजनिक धारणा और वास्तविकता के बीच निहित विरोध को हिन्दी में स्पष्ट करता है, बिना ‘भरमानेवाले’ होने के आरोप को सत्य ठहराए।
- source_word: πλάνοι
  choice: भरमानेवाले
  rationale: संदर्भ में इसका अर्थ दूसरों को गलत राह पर ले जाने या धोखा देनेवाले माने जाने से है। ‘भरमानेवाले’ आरोप के इस भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀληθεῖς
  choice: सच्चे
  rationale: यह πλάνοι के सीधे विरोध में है और सत्यनिष्ठ तथा प्रामाणिक होने के अर्थ को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: अन्तिम विरोध में लोगों की धारणा और वास्तविकता के संबंध को कैसे व्यक्त किया जाए
  choice: ‘भरमानेवाले समझे जाते हैं, फिर भी सच्चे हैं’
  alternative: ‘मानो भरमानेवाले, फिर भी सच्चे’ अथवा अधिक शाब्दिक ‘भरमानेवाले और सच्चे’
  rationale: ὡς के साथ यह सूची सेवकों पर लगाए गए आरोप को उनकी वास्तविक सत्यता के सामने रखती है। ‘समझे जाते हैं’ आरोप को सार्वजनिक धारणा के रूप में दिखाता है और ‘फिर भी’ मूल में निहित तीखे विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद की युग्मात्मक लय को ‘आदर और अनादर में, निन्दा और प्रशंसा में’ द्वारा बनाए रखा गया है।
