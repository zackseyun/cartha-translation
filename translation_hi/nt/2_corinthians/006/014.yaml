reference: 2 Corinthians 6:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: hi
  text: अविश्वासियों के साथ बेमेल जुए में न जुतो।[b] क्योंकि धार्मिकता[a] की अधर्म के साथ क्या साझेदारी है? या उजियाले की अंधकार के साथ क्या सहभागिता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “धार्मिकता” का अनुवाद “न्याय” या “न्यायपरायणता” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “बेमेल जुए” का चित्र अलग किस्म के पशुओं को एक जुए में जोतने से लिया गया है; तुलना करें व्यवस्थाविवरण 22:10।
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: न जुतो
  rationale: निषेधात्मक आज्ञा को वर्तमान और स्वाभाविक हिन्दी में व्यक्त करता है; अगले कृदंत के जुए वाले रूपक के साथ मिलकर γίνεσθε का भाव भी संप्रेषित होता है।
- source_word: ἑτεροζυγοῦντες
  choice: बेमेल जुए में
  rationale: अलग किस्म के पशुओं को एक ही जुए में जोतने का मूल रूपक सुरक्षित रहता है और आधुनिक हिन्दी में अर्थ स्पष्ट है।
- source_word: ἀπίστοις
  choice: अविश्वासियों के साथ
  rationale: यहाँ उन लोगों का संकेत है जो विश्वास नहीं करते; संबंधसूचक भाव के लिए 'के साथ' स्वाभाविक है।
- source_word: μετοχὴ
  choice: साझेदारी
  rationale: साझा भागीदारी या संबंध का अर्थ देता है और अगले κοινωνία से हल्का lexical भेद बनाए रखता है।
- source_word: δικαιοσύνῃ
  choice: धार्मिकता
  rationale: पौलुस के नैतिक-धार्मिक प्रयोग और ἀνομία के विरोध में प्रचलित तथा व्यापक हिन्दी समतुल्य है।
- source_word: ἀνομίᾳ
  choice: अधर्म
  rationale: व्यवस्था-विरोधी और नैतिक दुष्टता के भाव को संक्षेप में व्यक्त करता है; शाब्दिक 'व्यवस्थाहीनता' की अपेक्षा हिन्दी में अधिक स्वाभाविक है।
- source_word: κοινωνία
  choice: सहभागिता
  rationale: निकट साझा भागीदारी का अर्थ रखता है और 'साझेदारी' के समानांतर स्वाभाविक है।
- source_word: φωτὶ
  choice: उजियाले
  rationale: प्रकाश-अंधकार के रूपक को सीधे सुरक्षित रखता है; 'उजियाला' सामान्य और गरिमामय बाइबिलीय हिन्दी है।
- source_word: πρὸς σκότος
  choice: अंधकार के साथ
  rationale: इस संबंधात्मक-विरोधी रचना में πρός का स्वाभाविक हिन्दी रूप 'के साथ' है।
theological_decisions:
- issue: पौलुसी विरोध में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्यायपरायणता / न्याय
  rationale: ἀνομία के साथ नैतिक-धार्मिक विरोध में 'धार्मिकता' सबसे स्वाभाविक है; शब्द का न्याय-संबंधी अर्थ नकारा नहीं जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सामान्य-पाठक-सुलभ शैली। जुए का मूल रूपक बनाए रखा गया है; प्रश्नवाचक समानांतरता और धार्मिकता/अधर्म तथा उजियाला/अंधकार के विरोध सुरक्षित हैं।
