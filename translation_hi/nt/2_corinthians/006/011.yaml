- source_word: καρδία
  choice: हृदय
  rationale: स्नेह और आंतरिक भावों के केंद्र का पारंपरिक किंतु आज भी बोधगम्य रूपक है।
- source_word: πεπλάτυνται
  choice: विशाल हो गया है
  rationale: मूल क्रिया के ‘चौड़ा/विस्तृत करना’ वाले चित्र और पूर्णकाल के परिणामस्वरूप वर्तमान अवस्था को सहज हिन्दी में रखता है।
