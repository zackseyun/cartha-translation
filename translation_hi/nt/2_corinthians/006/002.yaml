id: 2CO.6.2
reference: 2 Corinthians 6:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: hi
  text: क्योंकि वह कहता है[a], “अनुकूल समय में मैंने तेरी सुनी, और उद्धार के दिन मैंने तेरी सहायता की।” देखो, अभी अत्यन्त अनुकूल समय है; देखो[b], अभी उद्धार का दिन है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मैंने तेरी सुनी’ का अर्थ ‘मैंने तेरी बात अनुकूलतापूर्वक सुनी’ भी हो सकता है; यूनानी क्रिया में सुनने के साथ स्वीकार करने या प्रत्युत्तर देने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘देखो’ का अनुवाद ‘ध्यान दो’ भी किया जा सकता है। इसकी पुनरावृत्ति वर्तमान अवसर की तात्कालिकता पर बल देती है।
    reason: rhetorical_clarification
lexical_decisions:
- source_word: λέγει γάρ
  choice: क्योंकि वह कहता है
  rationale: γάρ पिछले आग्रह का कारण स्पष्ट करता है, और λέγει पवित्रशास्त्र में बोलने वाले परमेश्वर को व्यक्तिगत कर्ता के रूप में प्रस्तुत करता है।
- source_word: Καιρῷ δεκτῷ
  choice: अनुकूल समय में
  rationale: καιρός उपयुक्त या नियत अवसर का बोध देता है और δεκτός अनुकूलता या स्वीकार्यता का; यह वाक्यांश हिन्दी में स्वाभाविक रहते हुए दोनों भावों को व्यक्त करता है।
- source_word: ἐπήκουσά σου
  choice: मैंने तेरी सुनी
  rationale: ἐπακούω केवल ध्वनि सुनने से बढ़कर ध्यानपूर्वक और अनुकूलतापूर्वक सुनने का भाव रख सकता है। ‘तेरी सुनी’ इस उत्तरदायी भाव को सुरक्षित रखता है, बिना इसे स्पष्ट रूप से ‘उत्तर दिया’ बनाने के।
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: उद्धार के दिन
  rationale: हिन्दी में लेख न होने के कारण यूनानी के अनिर्दिष्ट रूप को कृत्रिम ढंग से व्यक्त करने की आवश्यकता नहीं; यह पदबंध सहज और अर्थनिष्ठ है।
- source_word: ἐβοήθησά σοι
  choice: मैंने तेरी सहायता की
  rationale: βοηθέω का सीधा अर्थ सहायता करना या मदद को आना है; चुना गया रूप स्पष्ट, गरिमामय और सामान्य हिन्दी है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; ‘देखो’ उसकी तात्कालिकता और आलंकारिक बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: καιρὸς εὐπρόσδεκτος
  choice: अत्यन्त अनुकूल समय
  rationale: εὐπρόσδεκτος प्रबल स्वीकार्यता या विशेष अनुकूलता व्यक्त करता है। ‘अत्यन्त अनुकूल’ इसे पहले आए δεκτός से अलग भी दिखाता है।
- source_word: νῦν
  choice: अभी
  rationale: यह पौलुस के वर्तमान और अत्यावश्यक अनुप्रयोग को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἡμέρα σωτηρίας
  choice: उद्धार का दिन
  rationale: यह स्वाभाविक हिन्दी है और वर्तमान क्षण के उद्धारकारी महत्त्व को व्यक्त करता है; हिन्दी में निश्चित और अनिश्चित लेखों का भेद नहीं है।
theological_decisions:
- issue: उद्धरण और उसके अनुप्रयोग में समय तथा उद्धार के दिन को निश्चित या अनिश्चित मानना
  choice: हिन्दी में लेख जोड़े बिना ‘अनुकूल समय’ और ‘उद्धार का दिन’ कहना
  alternative: ‘वही अनुकूल समय’ और ‘वही उद्धार का दिन’ कहना
  rationale: यूनानी पदबंध लेखरहित हैं, जबकि हिन्दी में लेखों की वैसी व्यवस्था नहीं है। ‘वही’ जोड़ने से ऐसी निश्चितता और युगान्त-संबंधी विशिष्टता आ सकती है जिसे मूल पाठ अनिवार्य नहीं करता।
- issue: λέγει में बोलने वाला पवित्रशास्त्र है या परमेश्वर
  choice: व्यक्तिगत रूप ‘वह कहता है’
  alternative: निर्वैयक्तिक रूप ‘लिखा है’
  rationale: उद्धरण में वक्ता परमेश्वर है। व्यक्तिगत रूप पौलुस के उद्धरण-सूत्र की धार्मिक बनावट को सुरक्षित रखता है, बिना नाम को पाठ में जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठक के लिए स्पष्ट और गरिमामय। शास्त्रीय उद्धरण में एकवचन ‘तेरी’ मूल यूनानी के एकवचन संबोधन को सुरक्षित रखता है। ‘देखो’ की पुनरावृत्ति मूल पाठ के आलंकारिक आग्रह के अनुरूप रखी गई है।
