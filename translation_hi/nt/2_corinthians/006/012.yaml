base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/012.yaml
  text: You are not restricted by us[a], but you are restricted in your own affections.
translation:
  language: hi
  text: तुम हमारी ओर से सीमित नहीं हो, बल्कि अपने ही स्नेह में सीमित हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενοχωρεῖσθε
  choice: संकोच है
  rationale: क्रिया का मूल चित्र तंग या सीमित स्थान का है और यहाँ संबंधों में भीतर से सिमट जाने का भाव है। दोनों खंडों में एक ही शब्द रखकर पौलुस का अलंकारिक विरोध सुरक्षित रखा गया है।
- source_word: ἐν ἡμῖν
  choice: हमारी ओर से
  rationale: शाब्दिक अर्थ 'हममें' हो सकता है, पर संदर्भ में आशय यह है कि सीमा पौलुस और उसके साथियों की ओर से नहीं है। 'हमारी ओर से' स्वाभाविक हिन्दी में इस संबंधपरक भाव को व्यक्त करता है।
- source_word: δὲ
  choice: बल्कि
  rationale: 'यह दोनों खंडों के बीच तीखा विरोध दिखाता है: बाधा उनकी ओर से नहीं, कुरिन्थियों के भीतर है।'
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: तुम्हारे अपने स्नेह में
  rationale: σπλάγχνα का शाब्दिक अर्थ अंतड़ियाँ या भीतरी अंग है, पर यहाँ यह गहरी भावनाओं और आत्मीय स्नेह का रूपक है। 'अपने' सीमा के स्थान को उन्हीं के भीतर स्पष्ट करता है।
- source_word: οὐ
  choice: कोई ... नहीं
  rationale: पहले खंड के निषेध को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त करता है।
theological_decisions:
- issue: σπλάγχνα का रूपकात्मक अर्थ
  choice: स्नेह
  alternative: हृदय; भीतरी अंग
  rationale: संदर्भ पौलुस और कुरिन्थियों के बीच आत्मीय खुलेपन का है। 'स्नेह' भावनात्मक और संबंधपरक अर्थ को स्पष्ट करता है, जबकि शाब्दिक शारीरिक अभिव्यक्ति आधुनिक हिन्दी में भ्रामक होगी।
- issue: στενοχωρεῖσθε में सीमा का स्वरूप
  choice: संबंधपरक संकोच
  alternative: बाहरी दबाव या शारीरिक तंगी
  rationale: आस-पास का संदर्भ हृदय खोलने और पारस्परिक प्रेम की बात करता है, इसलिए यहाँ संकोच भावनात्मक रूप से सिमटने का संकेत देता है; फिर भी अनुवाद उसी रूपक को दोनों खंडों में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मौखिक रूप से सहज अभिव्यक्ति। 'संकोच' दोनों बार रखकर यूनानी पुनरुक्ति और विरोध सुरक्षित हैं; फुटनोट अधिक शाब्दिक विकल्प देता है।
