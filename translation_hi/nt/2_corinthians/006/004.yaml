  text: ἀλλ’ ἐν παντὶ ⸀συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι· ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/004.yaml
  text: 'but in everything commending ourselves as God''s servants: in great endurance[a], in afflictions, in hardships, in distresses[c][b],'
translation:
  language: hi
  text: बल्कि हर बात में, अपने आपको परमेश्वर के सेवकों के रूप में प्रमाणित करते हुए[a]—बहुत धैर्य के साथ, क्लेशों में, कठिन परिस्थितियों में और संकटों में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर प्रकार से अपने आपको परमेश्वर के सेवकों के रूप में प्रस्तुत करते हुए” या “...सिद्ध करते हुए।” यूनानी पदबंध हर परिस्थिति अथवा हर पहलू का भाव दे सकता है। क्रिया में अपने को सामने रखने और आचरण द्वारा प्रामाणिक सिद्ध होने, दोनों का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: बल्कि
  rationale: यह पिछले नकारात्मक कथन के विपरीत सेवकाई के सकारात्मक आचरण को सामने लाता है।
- source_word: ἐν παντί
  choice: हर बात में
  rationale: यह व्यापक पदबंध हर परिस्थिति या हर पहलू को समेट सकता है; हिंदी में यह व्यापकता स्वाभाविक ढंग से बनी रहती है।
- source_word: συνιστάνοντες ἑαυτούς
  choice: अपने आपको ... प्रस्तुत करते हैं
  rationale: συνίστημι यहाँ स्वयं को प्रमाणित या अनुशंसित करने का भाव रखता है। ‘प्रस्तुत करते हैं’ मूल की अस्पष्टता को अनावश्यक रूप से केवल ‘सिद्ध करते हैं’ तक सीमित नहीं करता।
- source_word: ὡς θεοῦ διάκονοι
  choice: परमेश्वर के सेवकों के रूप में
  rationale: διάκονοι का मूल बल सेवा करने वालों पर है; ‘सेवक’ सुबोध है और किसी औपचारिक कलीसियाई पद का संकेत नहीं जोड़ता।
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: बहुत धीरज धरने में
  rationale: ὑπομονή कठिनाई के नीचे स्थिर रहकर सहते जाने का भाव व्यक्त करता है; यह केवल प्रतीक्षा करने वाले आधुनिक संकीर्ण अर्थ के ‘धैर्य’ से अधिक सटीक है।
- source_word: θλίψεσιν
  choice: क्लेशों में
  rationale: यह दबाव और पीड़ा देने वाली विपत्तियों का भारयुक्त, किंतु सामान्यतः समझ में आने वाला हिंदी रूप है।
- source_word: ἀνάγκαις
  choice: कठिन परिस्थितियों में
  rationale: संदर्भ में यह बाध्यकारी और दबावपूर्ण कठिनाइयों को दर्शाता है, न कि केवल आवश्यकताओं को।
- source_word: στενοχωρίαις
  choice: संकटों में
  rationale: यह चारों ओर से घिर जाने या तंगी में पड़ने जैसे तीव्र दबाव को व्यक्त करता है और पिछले पद से पर्याप्त भिन्न रहता है।
theological_decisions:
- issue: सेवकाई के संदर्भ में διάκονοι का अनुवाद
  choice: परमेश्वर के सेवक
  alternative: परमेश्वर के परिचारक / परमेश्वर के सेवाकार्य करने वाले
  rationale: यह शब्द मुख्यतः परमेश्वर की सेवा करने की पहचान बताता है; यहाँ किसी बाद के संस्थागत पद को मान लेना आवश्यक नहीं है।
- issue: συνίστημι में आत्म-प्रशंसा और प्रमाणित होने का तनाव
  choice: अपने आपको ... प्रस्तुत करते हैं
  alternative: अपने आपको ... सिद्ध करते हैं / अपनी सिफारिश करते हैं
  rationale: चुना हुआ रूप इस बात को खुला रखता है कि उनका आचरण उन्हें परमेश्वर के सेवक के रूप में सामने लाता और प्रमाणित करता है, बिना इसे घमंडपूर्ण आत्म-प्रशंसा बनाने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दुःखों की सूची में यूनानी ἐν की पुनरावृत्ति को ‘में’ द्वारा यथासंभव बनाए रखा गया है; अंतिम पद से पहले स्वाभाविक हिंदी संयोजक ‘और’ जोड़ा गया है।
