    reason: alternative_reading
lexical_decisions:
- source_word: ἁγνότητι
  choice: पवित्रता
  rationale: यहाँ ἁγνότης व्यापक नैतिक शुद्धता को व्यक्त करता है; ‘पवित्रता’ स्वाभाविक हिंदी है और अर्थ को केवल यौन शुचिता तक सीमित नहीं करती।
- source_word: γνώσει
  choice: ज्ञान
  rationale: γνῶσις का व्यापक अर्थ ज्ञान और समझ है; ‘ज्ञान’ संक्षिप्त तथा प्रसंगानुकूल है।
- source_word: μακροθυμίᾳ
  choice: धीरज
  rationale: μακροθυμία कठिन परिस्थितियों और लोगों के प्रति लंबे समय तक धैर्य रखने का भाव देता है; ‘धीरज’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: χρηστότητι
  choice: कृपालुता
  rationale: χρηστότης दूसरों के प्रति दयालु और हितकारी व्यवहार का सूचक है; ‘कृपालुता’ सूची के गुणात्मक, गरिमापूर्ण भाव को बनाए रखती है।
- source_word: πνεύματι ἁγίῳ
  choice: पवित्र आत्मा
  rationale: पौलुस के प्रयोग और प्रसंग में यह सबसे अधिक सम्भवतः परमेश्वर के पवित्र आत्मा का उल्लेख है; वैकल्पिक मानवीय-स्वभाव संबंधी अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: निष्कपट प्रेम
  rationale: ἀνυπόκριτος ढोंग या कपट से रहित होने का भाव देता है; ‘निष्कपट प्रेम’ स्पष्ट, स्वाभाविक और मूल पदबंध के अर्थ के निकट है।
- source_word: ἐν
  choice: में
  rationale: बार-बार आए ἐν के लिए ‘में’ रखने से साधन, क्षेत्र या रीति की सम्भावित अर्थ-छायाएँ और यूनानी सूची की अलंकारिक पुनरावृत्ति बनी रहती हैं।
theological_decisions:
- issue: πνεύματι ἁγίῳ का संदर्भ
  choice: परमेश्वर का पवित्र आत्मा
  alternative: पवित्र मनोभाव या पवित्र स्वभाव
  rationale: पौलुस की सामान्य शब्दावली और इस प्रसंग को देखते हुए दिव्य पवित्र आत्मा मुख्य अर्थ है, पर लेखों की अनुपस्थिति के कारण मानवीय पवित्र मनोभाव की सम्भावना को पूरी तरह मिटाया नहीं गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त और गरिमापूर्ण सूची। प्रत्येक पद के साथ ‘में’ दोहराकर यूनानी की समानांतर लय और अर्थगत खुलापन रखा गया है। पद अगले वाक्यांश से जुड़ा होने के कारण अंत में अल्पविराम रखा गया है।
