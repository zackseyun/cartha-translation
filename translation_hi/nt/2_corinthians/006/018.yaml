  text: καὶ ἔσομαι ὑμῖν εἰς πατέρα, καὶ ὑμεῖς ἔσεσθέ μοι εἰς υἱοὺς καὶ θυγατέρας, λέγει κύριος παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/018.yaml
  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: hi
  text: और मैं तुम्हारा पिता होऊँगा[a], और तुम मेरे बेटे और बेटियाँ होगे, यह सर्वशक्तिमान प्रभु कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “मैं तुम्हारे लिए पिता ठहरूँगा, और तुम मेरे लिए बेटे और बेटियाँ ठहरोगे।” यूनानी में यह वाचा के संबंध को व्यक्त करने वाला मुहावरा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσομαι ὑμῖν εἰς πατέρα
  choice: मैं तुम्हारा पिता होऊँगा
  rationale: यूनानी वाचा-संबंधी मुहावरे का स्वाभाविक हिन्दी रूप; भविष्यकाल और पिता के पारस्परिक संबंध दोनों सुरक्षित रहते हैं।
- source_word: ὑμεῖς ἔσεσθέ μοι
  choice: तुम मेरे ... होगे
  rationale: स्पष्ट ὑμεῖς और पहली उपवाक्य के साथ पारस्परिक समानता को सहज हिन्दी में व्यक्त करता है।
- source_word: υἱοὺς καὶ θυγατέρας
  choice: बेटे और बेटियाँ
  rationale: यूनानी में पुरुष और स्त्री संतान दोनों का स्पष्ट उल्लेख है; केवल ‘सन्तान’ कहने से यह विशेषता मिट जाती।
- source_word: λέγει
  choice: कहता है
  rationale: उद्धरण-सूत्र के यूनानी वर्तमानकाल को वर्तमानकाल में रखता है।
- source_word: κύριος παντοκράτωρ
  choice: सर्वशक्तिमान प्रभु
  rationale: दोनों ईश्वरीय पदवियों को सीधे, प्रचलित और गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘सेनाओं का प्रभु’ जैसा भिन्न मूल-पद आयात नहीं करता।
theological_decisions:
- issue: पुत्र-संबंध में दोनों लिंगों का स्पष्ट समावेश
  choice: बेटे और बेटियाँ
  alternative: सन्तान
  rationale: पाठ υἱούς और θυγατέρας दोनों कहता है; हिन्दी में दोनों को बनाए रखना मूल की चिह्नित समावेशिता को सुरक्षित रखता है।
- issue: κύριος παντοκράτωρ की ईश्वरीय पदवी
  choice: सर्वशक्तिमान प्रभु
  alternative: प्रभु, जो सर्वशक्तिमान है
  rationale: संक्षिप्त पदवी-संरचना मूल के अर्थ और भार को स्वाभाविक हिन्दी में बनाए रखती है।
- issue: वाचा-संबंधी εἶναι ... εἰς मुहावरे का रूप
  choice: मैं तुम्हारा पिता होऊँगा ... तुम मेरे बेटे और बेटियाँ होगे
  alternative: मैं तुम्हारे लिए पिता ठहरूँगा ... तुम मेरे लिए बेटे और बेटियाँ ठहरोगे
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है, जबकि अधिक शब्दशः संबंधसूचक संरचना पादटिप्पणी में दी गई है; इससे मुहावरे का अर्थ स्पष्ट रहता है और उसकी बनावट छिपती नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। ‘बेटे और बेटियाँ’ मूल की स्पष्ट लैंगिक जोड़ी को बनाए रखता है।
