    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν δὲ αὐτὴν ἀντιμισθίαν
  choice: उसी प्रतिदान के रूप में
  rationale: ἀντιμισθία यहाँ आर्थिक भुगतान नहीं, बल्कि पहले व्यक्त किए गए खुले स्नेह के प्रत्युत्तर में वैसा ही पारस्परिक उत्तर दर्शाता है। αὐτήν की समानता का भाव ‘उसी’ से सुरक्षित रहता है; δέ को अलग संयोजक से व्यक्त करना हिन्दी में अनावश्यक और अस्वाभाविक होता।
- source_word: ὡς τέκνοις λέγω
  choice: मैं तुमसे बच्चों के समान कह रहा हूँ
  rationale: τέκνοις का अर्थ ‘बच्चों’ है और यूनानी में ‘मेरे’ नहीं है। हिन्दी वाक्य के लिए ‘तुमसे’ स्पष्ट किया गया है, जबकि पारिवारिक संबोधन का भाव बना रहता है।
- source_word: πλατύνθητε
  choice: अपना हृदय खोल दो
  rationale: शाब्दिक अर्थ ‘चौड़े हो जाओ/विस्तृत किए जाओ’ है। निकट संदर्भ में यह स्नेह और ग्रहणशीलता में खुलने का रूपक है; स्वाभाविक हिन्दी में ‘हृदय खोल दो’ वही आशय पहुँचाता है, यद्यपि ‘हृदय’ इस पद में निहित है, प्रत्यक्ष नहीं।
- source_word: καὶ ὑμεῖς
  choice: तुम भी
  rationale: καί और बलयुक्त ὑμεῖς पौलुस और उसके सहकर्मियों के खुलेपन के अनुरूप कुरिन्थियों से भी वैसी प्रतिक्रिया माँगते हैं।
theological_decisions:
- issue: पौलुस के पारिवारिक संबोधन में अधिकारसूचक संबंध को स्पष्ट करना
  choice: ‘बच्चों के समान’ रखा गया, ‘मेरे बच्चों’ नहीं जोड़ा गया
  alternative: मेरे बच्चों के समान
  rationale: संदर्भ में पौलुस का पितृवत भाव स्पष्ट है, पर यूनानी पाठ में अधिकारसूचक सर्वनाम नहीं है; इसलिए अनकहे संबंध को मुख्य पाठ में स्पष्ट रूप से नहीं जोड़ा गया।
- issue: πλατύνθητε के रूपक में निहित अंग को व्यक्त करना
  choice: ‘अपना हृदय खोल दो’
  alternative: तुम भी विस्तृत हो जाओ
  rationale: पूर्ववर्ती संदर्भ हृदय और स्नेहपूर्ण ग्रहणशीलता की ओर संकेत करता है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए निहित अर्थ व्यक्त किया गया है, और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। वाक्य की भावात्मक अपील बनाए रखने के लिए डैश रखे गए हैं। ‘प्रतिदान’ कुछ औपचारिक है, पर ἀντιμισθία के पारस्परिक प्रत्युत्तर को बिना आर्थिक भुगतान तक सीमित किए सटीक रूप से व्यक्त करता है।
