base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: hi
  text: इसलिए उनके बीच से निकल आओ, और अलग हो जाओ[a], प्रभु कहता है, और जो अशुद्ध है उसे मत छुओ[b][c]; और मैं तुम्हें ग्रहण करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अलग किए जाओ” अथवा “अपने आपको अलग कर लो।”
    reason: lexical_alternative
  - marker: b
    text: या “किसी अशुद्ध वस्तु को मत छुओ।”
    reason: lexical_alternative
  - marker: c
    text: यहाँ पौलुस पुराने नियम के भविष्यद्वक्ताओं की भाषा, विशेषकर यशायाह 52:11, की प्रतिध्वनि करता है।
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्वाभाविक और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: ἐξέλθατε ἐκ μέσου αὐτῶν
  choice: उनके बीच से निकल आओ
  rationale: बहुवचन आज्ञा और सामाजिक/स्थानिक अलगाव, दोनों को सहज हिंदी में सुरक्षित रखता है।
- source_word: ἀφορίσθητε
  choice: अलग हो जाओ
  rationale: निष्क्रिय आज्ञार्थक रूप के परिणामस्वरूप अलग स्थिति में आने का भाव देता है; इसे अत्यधिक सक्रिय या सांप्रदायिक अर्थ नहीं देता।
- source_word: λέγει κύριος
  choice: प्रभु कहता है
  rationale: भविष्यद्वक्ताओं की मानक उद्घोषणा-शैली को बनाए रखता है और नए नियम के κύριος का स्वाभाविक हिंदी रूप है।
- source_word: ἀκαθάρτου μὴ ἅπτεσθε
  choice: जो अशुद्ध है उसे मत छुओ
  rationale: अशुद्धता की श्रेणी को किसी खास वस्तु तक सीमित किए बिना स्पर्श न करने की मूल बिंबात्मक भाषा रखता है।
- source_word: κἀγὼ εἰσδέξομαι ὑμᾶς
  choice: तब मैं तुम्हें ग्रहण करूँगा
  rationale: εἰσδέχομαι के अनुकूल स्वागतपूर्ण स्वीकार का भाव देता है; हिंदी में ‘ग्रहण करना’ इस उद्धरण की गंभीर और वाचागत शैली के अनुरूप है। ‘तब’ हिंदी में आज्ञा और प्रतिज्ञा का संबंध स्पष्ट करता है, यद्यपि ग्रीक καί मूलतः ‘और’ है।
theological_decisions:
- issue: पुराने नियम की प्रतिध्वनि वाले उद्धरण में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: यूनानी नए नियम में κύριος है; ‘प्रभु’ उसी को दर्शाता है और पुराने नियम की पृष्ठभूमि के कारण इब्रानी परमेश्वर-नाम को अनूदित पाठ में आयात नहीं करता।
- issue: अलग होने की आज्ञा का आशय
  choice: अलग हो जाओ
  alternative: अपने आपको अलग कर लो / पवित्र ठहराए जाओ
  rationale: यह पाठ की अलगाव-संबंधी आज्ञा को बनाए रखता है, पर इसे सभी बाहरी लोगों से पूर्ण सामाजिक दूरी या किसी विशेष सांप्रदायिक व्यवहार के रूप में नहीं समझाता।
- issue: καί से जुड़ी अंतिम प्रतिज्ञा
  choice: तब मैं तुम्हें ग्रहण करूँगा
  alternative: और मैं तुम्हें ग्रहण करूँगा
  rationale: ‘तब’ हिंदी में उद्धृत आज्ञाओं के बाद आने वाली ईश्वरीय प्रतिज्ञा का संबंध सहज बनाता है; इसे कठोर अर्जित-योग्यता की शर्त के रूप में नहीं विस्तृत किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी की गरिमापूर्ण, सार्वजनिक-पाठ योग्य शैली अपनाई गई है। ‘निकल आओ,’ ‘अलग हो जाओ,’ और ‘मत छुओ’ सीधे बहुवचन आदेशों की शक्ति रखते हैं; ‘ग्रहण करूँगा’ उद्धरण की गंभीरता और अनुकूल स्वीकार, दोनों को व्यक्त करता है।
