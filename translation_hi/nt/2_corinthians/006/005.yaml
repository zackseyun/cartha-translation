  text: ἐν πληγαῖς, ἐν φυλακαῖς, ἐν ἀκαταστασίαις, ἐν κόποις, ἐν ἀγρυπνίαις, ἐν νηστείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/005.yaml
  text: in beatings, in imprisonments, in riots, in labors, in sleepless nights, in fastings,
translation:
  language: hi
  text: मार खाने में, कैद में, उपद्रवों में, कठिन परिश्रम में, रात-रात भर जागने में और उपवासों में;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαῖς
  choice: मार खाने में
  rationale: यह बहुवचन संज्ञा शारीरिक प्रहार या पिटाई को दर्शाती है; हिन्दी में यह स्वाभाविक रूप से उस यातना को व्यक्त करती है।
- source_word: φυλακαῖς
  choice: कैद में
  rationale: शब्द कारावास या बंदी बनाए जाने की स्थितियों को दर्शाता है; सामूहिक अर्थ वाले हिन्दी प्रयोग में बहुवचन अलग से आवश्यक नहीं है।
- source_word: ἀκαταστασίαις
  choice: उपद्रवों में
  rationale: यह शब्द अव्यवस्था, अशांति या दंगे जैसी उथल-पुथल के लिए प्रयुक्त हो सकता है। ‘उपद्रवों’ इस अर्थ-सीमा को ‘दंगों’ की अपेक्षा अधिक सुरक्षित रखता है और पौलुस को दंगा करने वाला नहीं ठहराता।
- source_word: κόποις
  choice: कठिन परिश्रम में
  rationale: κόπος केवल काम नहीं, बल्कि थका देने वाले श्रम और कठिन मेहनत का भाव रखता है।
- source_word: ἀγρυπνίαις
  choice: रात-रात भर जागने में
  rationale: यह जागते रहने अथवा नींद-विहीन अवधियों को दर्शाता है; यह हिन्दी प्रयोग बहुवचन और कठिनाई दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: νηστείαις
  choice: उपवासों में
  rationale: बहुवचन शब्द भोजन से विरत रहने की अवधियों को सूचित करता है; ‘उपवासों’ इसके सामान्य धार्मिक और शाब्दिक अर्थ को बनाए रखता है।
theological_decisions:
- issue: ἀκαταστασίαις में पौलुस की भूमिका
  choice: उपद्रवों में
  alternative: दंगों में
  rationale: मूल पाठ बताता है कि वह अशांत परिस्थितियों के बीच था, पर यह स्पष्ट नहीं करता कि उसने उन्हें उत्पन्न किया। चुना हुआ रूप इस तनाव को बिना अनावश्यक आरोप के बनाए रखता है।
- issue: νηστείαις स्वैच्छिक था या अभावजनित
  choice: उपवासों में
  alternative: भूखे रहने में
  rationale: मूल शब्द प्रायः उपवास को दर्शाता है, पर प्रसंग उसके कारण को नहीं बताता। इसलिए अनुवाद इसे केवल अनैच्छिक भूख के रूप में सीमित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; मूल यूनानी की समानांतर ἐν-रचना को बार-बार ‘में’ द्वारा बनाए रखा गया है। अंतिम अर्धविराम दर्शाता है कि यह पद आसपास की विस्तृत सूची का अंश है।
