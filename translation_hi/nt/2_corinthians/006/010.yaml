translation:
  language: hi
  text: हम दुःखी होते हुए भी सदा आनन्दित रहते हैं; निर्धन होते हुए भी बहुतों को धनी बनाते हैं[a]; कुछ भी न रखते हुए भी सब कुछ रखते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुतों को समृद्ध करते हैं।” सन्दर्भ में यह समृद्धि सम्भवतः भौतिक नहीं, बल्कि आत्मिक है।
    reason: lexical_alternative
  - marker: b
    text: तुलना करें 1 कुरिन्थियों 3:21–23। बाहरी अभाव के बावजूद पौलुस मसीह में ‘सब कुछ’ अपना होने की बात करता है।
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: मानो
  rationale: तीनों विरोधाभासी युग्मों में दोहराए गए तुलनात्मक ढाँचे को बनाए रखता है। यह बाहरी दशा और उसके साथ रखी गई गहरी वास्तविकता के बीच तनाव को व्यक्त करता है, बिना उसे पूरी तरह केवल दिखावा घोषित किए।
- source_word: λυπούμενοι
  choice: दुखी हों
  rationale: चल रहे दुःख या शोक की अवस्था को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और दुःख के कारण को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀεὶ χαίροντες
  choice: सदा आनन्दित रहते हैं
  rationale: निरन्तरता और सक्रिय आनन्द—दोनों को व्यक्त करता है तथा दुःख के साथ पौलुस के विरोधाभास को स्पष्ट रखता है।
- source_word: πτωχοὶ
  choice: निर्धन
  rationale: भौतिक अभाव और दीन दशा, दोनों की सम्भावना खुली रखता है; ‘कंगाल’ की अपेक्षा अधिक गरिमापूर्ण और व्यापक है।
- source_word: πλουτίζοντες
  choice: धनी बनाते हैं
  rationale: क्रिया के कारक अर्थ, अर्थात दूसरों को समृद्ध करना, को सीधे व्यक्त करता है; मुख्य पाठ यह निर्धारित नहीं करता कि धन भौतिक है या आत्मिक।
- source_word: μηδὲν ἔχοντες
  choice: हमारे पास कुछ भी न हो
  rationale: प्रत्यक्ष अभाव को स्वाभाविक हिन्दी में रखता है और अगले दावे के साथ तीखा विरोध बनाए रखता है।
- source_word: πάντα κατέχοντες
  choice: सब कुछ अपने अधिकार में रखते हैं
  rationale: κατέχω के ‘थामे रखना/अधिकार में रखना/अपने पास रखना’ अर्थ को व्यक्त करता है और केवल सामान्य ‘होना’ से इसे अलग रखता है।
theological_decisions:
- issue: ‘बहुतों को धनी बनाना’ और ‘सब कुछ अपने अधिकार में रखना’ किस प्रकार की समृद्धि या सम्पत्ति है
  choice: मुख्य पाठ में कथनों को बिना ‘आत्मिक’ विशेषण जोड़े सीधे और विरोधाभासी रूप में रखा गया है।
  alternative: स्पष्ट रूप से ‘आत्मिक रूप से धनी बनाते हैं’ और ‘मसीह में सब कुछ रखते हैं’ अनुवाद करना।
  rationale: सन्दर्भ आत्मिक समृद्धि की ओर संकेत करता है, पर यूनानी पाठ स्वयं कोई स्पष्ट विशेषण नहीं देता। इसलिए मुख्य पाठ पौलुस के कथन का व्यापक अर्थ और धर्मवैचारिक तनाव सुरक्षित रखता है।
- issue: ὡς को केवल बाहरी धारणा या अवास्तविक दशा मानना
  choice: ‘मानो’ द्वारा तुलनात्मक और अलंकारिक ढाँचा रखा गया है, जबकि दोनों ओर के कथनों को साथ खड़ा रहने दिया गया है।
  alternative: ‘दुखी समझे जाते हैं’ अथवा सीधे ‘दुखी हैं’ कहना।
  rationale: पहला विकल्प बाहरी लोगों की धारणा को पाठ से अधिक स्पष्ट कर देता, जबकि दूसरा बार-बार आए ὡς को मिटा देता। ‘मानो’ मूल की जानबूझकर रखी गई तुलना को बेहतर सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘मानो हम…’ की तीन बार पुनरावृत्ति यूनानी के अलंकारिक समानान्तर ढाँचे को बनाए रखती है। ‘फिर भी’ प्रत्येक विरोधाभास को सहज हिन्दी में उभारता है।
