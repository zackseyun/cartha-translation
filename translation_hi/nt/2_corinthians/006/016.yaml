source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: hi
  text: 'और परमेश्वर के मंदिर का मूर्तियों के साथ क्या मेल है?[a] क्योंकि हम जीवित परमेश्वर का मंदिर हैं, जैसा परमेश्वर ने कहा:


    “मैं उनके बीच निवास करूँगा[b]

    और उनके बीच चलूँगा-फिरूँगा;

    मैं उनका परमेश्वर होऊँगा,

    और वे मेरे लोग होंगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्या सामंजस्य है?” अथवा “क्या सहमति है?”
    reason: lexical_alternative
  - marker: b
    text: या “मैं उनमें निवास करूँगा।” यूनानी पूर्वसर्ग का अर्थ “में” या “के बीच” हो सकता है; यहाँ सामुदायिक वाचा का संदर्भ “उनके बीच” का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: मेल
  rationale: यह शब्द सहमति, सामंजस्य या साझे संबंध को दर्शाता है। प्रश्नवाचक संदर्भ में “क्या मेल है?” स्वाभाविक आधुनिक हिंदी है और असंगत धार्मिक निष्ठाओं के विरोध को स्पष्ट रखता है।
- source_word: ναῷ / ναὸς
  choice: मंदिर
  rationale: ναός विशेष रूप से देवालय या पवित्र मंदिर को सूचित करता है। “मंदिर” सहज और प्रचलित हिंदी है तथा पौलुस के सामूहिक रूपक को बनाए रखता है।
- source_word: εἰδώλων
  choice: मूर्तियों
  rationale: यहाँ आशय उपासना की मूर्तियों से है, केवल तटस्थ चित्रों या प्रतिमाओं से नहीं। “मूर्तियों” धार्मिक संदर्भ और विरोध दोनों को सुरक्षित रखता है।
- source_word: ζῶντος
  choice: जीवित
  rationale: यह परमेश्वर का विशेषण है और निर्जीव मूर्तियों के विपरीत “जीवित परमेश्वर” की बाइबलीय अभिव्यक्ति को बनाए रखता है।
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: जैसा परमेश्वर ने कहा है
  rationale: “जैसा” καθώς के तुलनात्मक संबंध को रखता है। हिंदी में शास्त्र के स्थायी कथन का परिचय देते समय “ने कहा है” स्वाभाविक है, यद्यपि यूनानी क्रिया एओरिस्ट है।
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: मैं उनके बीच निवास करूँगा
  rationale: ἐν αὐτοῖς का शाब्दिक अर्थ “उनमें” भी हो सकता है, पर बहुवचन समुदाय और साथ आने वाले “उनके बीच चला-फिरा करूँगा” के कारण “उनके बीच” सामुदायिक वाचा-उपस्थिति को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐμπεριπατήσω
  choice: उनके बीच चला-फिरा करूँगा
  rationale: यह क्रिया परमेश्वर की अपने लोगों के मध्य सक्रिय उपस्थिति का सजीव चित्र देती है। “चला-फिरा करूँगा” उस रूपक को बिना अमूर्त बनाए सुरक्षित रखता है।
- source_word: ἔσομαι αὐτῶν θεός
  choice: मैं उनका परमेश्वर होऊँगा
  rationale: यह वाचा का परिचित संबंधसूचक सूत्र है और संबंधवाचक यूनानी रचना को स्वाभाविक हिंदी में प्रस्तुत करता है।
- source_word: λαός
  choice: प्रजा
  rationale: वाचा-सूत्र में λαός परमेश्वर से संबद्ध सामूहिक जन को दर्शाता है। “प्रजा” इस सामूहिक और संबंधपरक अर्थ को संक्षेप में रखती है।
theological_decisions:
- issue: कलीसिया का सामूहिक मंदिर-रूपक
  choice: हम जीवित परमेश्वर का मंदिर हैं
  alternative: हम जीवित परमेश्वर के एक मंदिर हैं
  rationale: विधेय के रूप में प्रयुक्त अनिश्चित-लेखरहित ναὸς यहाँ पहचान और गुण दोनों व्यक्त करता है। हिंदी में “परमेश्वर का मंदिर” समुदाय की सामूहिक पहचान को स्वाभाविक रूप से रखता है और अनावश्यक रूप से अनेक मंदिरों का संकेत नहीं देता।
- issue: ईश्वरीय निवास की सामुदायिक भाषा
  choice: मैं उनके बीच निवास करूँगा
  alternative: मैं उनमें निवास करूँगा
  rationale: वचन समुदाय को सामूहिक रूप से संबोधित करता है और अगली समानांतर पंक्ति परमेश्वर के उनके बीच चलने की बात कहती है। इसलिए “उनके बीच” वाचा में परमेश्वर की सामुदायिक उपस्थिति को प्रमुख करता है; संभावित “उनमें” को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। “मेल,” “निवास,” और “चला-फिरा” जैसे शब्द सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की धार्मिक और रूपकात्मक शक्ति बनाए रखते हैं। काव्यात्मक उद्धरण को अलग पंक्तियों में रखा गया है।
