  text: ὡς ἀγνοούμενοι καὶ ἐπιγινωσκόμενοι, ὡς ἀποθνῄσκοντες καὶ ἰδοὺ ζῶμεν, ὡς παιδευόμενοι καὶ μὴ θανατούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/009.yaml
  text: as unknown and yet well known[a], as dying and behold, we live, as disciplined and not put to death[b],
translation:
  language: hi
  text: मानो अज्ञात हैं, फिर भी भली-भाँति पहचाने जाते हैं[a]; मानो मर रहे हैं, और देखो, हम जीवित हैं; मानो अनुशासित किए जाते हैं[b], फिर भी मारे नहीं जाते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहचाने जाते हैं”; यूनानी शब्द केवल प्रसिद्ध होने के बजाय स्पष्ट या पूर्ण रूप से पहचाने जाने पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “सुधारे जा रहे हैं,” “ताड़ना दी जा रही है,” अथवा “प्रशिक्षित किए जा रहे हैं”; यूनानी शब्द सुधारात्मक अनुशासन या शिक्षाप्रद प्रशिक्षण, दोनों का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: मानो
  rationale: यह पौलुस की प्रत्येक विरोधाभासी स्थिति का परिचय देता है। ‘मानो’ स्वाभाविक हिन्दी में दिखने वाली दशा और वास्तविकता के तनाव को बनाए रखता है।
- source_word: ἀγνοούμενοι
  choice: अनजान हैं
  rationale: यह दूसरों की दृष्टि में अज्ञात या अपरिचित होने को संक्षेप में व्यक्त करता है और अगले पदबंध के साथ स्पष्ट विरोध बनाता है।
- source_word: ἐπιγινωσκόμενοι
  choice: भली-भाँति पहचाने जाते हैं
  rationale: ἐπιγινώσκω में स्पष्ट या पूर्ण पहचान का भाव हो सकता है। यह अनिवार्यतः प्रसिद्ध होने के बजाय स्वीकारपूर्वक पहचाने जाने का अर्थ सुरक्षित रखता है।
- source_word: ἀποθνῄσκοντες
  choice: मर रहे हैं
  rationale: वर्तमान कृदन्त लगातार मृत्यु के निकट दिखाई देने की दशा व्यक्त करता है; यह बाद के ‘प्राण से मारे जाते’ से अलग भी रहता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह मूल के आकस्मिक ध्यानाकर्षक बल को वर्तमान, गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: ζῶμεν
  choice: हम जीवित हैं
  rationale: सरल वर्तमान काल ‘मर रहे हैं’ के साथ तीखा विरोध बनाए रखता है।
- source_word: παιδευόμενοι
  choice: अनुशासित किए जा रहे हैं
  rationale: παιδεύω में सुधारात्मक अनुशासन और शिक्षाप्रद प्रशिक्षण दोनों की संभावना है; यह चयन किसी एक धर्मवैचारिक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: μὴ θανατούμενοι
  choice: प्राण से नहीं मारे जाते
  rationale: यह कर्मवाच्य और वास्तविक मृत्यु तक न पहुँचाए जाने का अर्थ बनाए रखता है तथा पहले के ‘मर रहे हैं’ से शब्दगत भेद स्पष्ट करता है।
theological_decisions:
- issue: दुःख के संबंध में παιδευόμενοι का अर्थ
  choice: अनुशासित किए जा रहे हैं
  alternative: सुधारे जा रहे हैं / प्रशिक्षित किए जा रहे हैं / ताड़ना दी जा रही है
  rationale: यह दुःख को सुधारात्मक या शिक्षाप्रद अनुशासन मानने की संभावनाएँ खुली रखता है, पर उसे दंड के किसी विशिष्ट धर्मवैचारिक सिद्धान्त के रूप में निश्चित नहीं करता।
