  naturalness: The sentence is generally readable and maintains the compact paradoxical rhythm. Replacing “अनजान” with “अज्ञात” removes a significant lexical ambiguity. “मारे नहीं जाते” is more direct and idiomatic than “प्राण से नहीं मारे जाते,” while retaining the passive sense and the contrast with “मर रहे हैं.”
  terminology: “भली-भाँति पहचाने जाते हैं” appropriately preserves the fuller-recognition nuance of ἐπιγινωσκόμενοι without reducing it to fame. “अनुशासित किए जाते हैं” is an acceptable nonsectarian rendering of παιδευόμενοι; its footnote properly retains corrective and formative alternatives.
  issues:
