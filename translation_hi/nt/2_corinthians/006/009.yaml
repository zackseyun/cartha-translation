    issue: “अनजान हैं” for ἀγνοούμενοι
    rationale: In modern standard Hindi, “अनजान” most commonly describes someone who is unaware or ignorant, whereas the Greek passive participle means unknown, unrecognized, or disregarded by others. “अज्ञात हैं” accurately expresses the intended relational/passive sense.
  - severity: low
    issue: “प्राण से नहीं मारे जाते” is unnecessarily marked idiomatically
    rationale: Although it communicates nonfatal treatment, “मारे नहीं जाते” is more natural modern Hindi and directly reflects μὴ θανατούμενοι without adding “प्राण से.”
