reference: 2 Corinthians 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: hi
  text: 'परमेश्वर की इच्छा से मसीह यीशु का प्रेरित पौलुस, और भाई तीमुथियुस, कुरिन्थुस में स्थित परमेश्वर की कलीसिया को, तथा उसके साथ पूरे अखाया में रहने वाले सभी पवित्र जनों को:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστολος
  choice: प्रेरित
  rationale: पौलुस की ओर से पाए हुए विशेष अधिकार और भेजे जाने के भाव को व्यक्त करने वाला स्थापित हिन्दी बाइबलीय शब्द।
- source_word: Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु
  rationale: यहाँ Χριστός उपाधि के रूप में मसीही अर्थ रखता है; हिन्दी में “मसीह यीशु” स्वाभाविक और अर्थपूर्ण है।
- source_word: διὰ θελήματος θεοῦ
  choice: परमेश्वर की इच्छा से
  rationale: διά के माध्यम अथवा आधार के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और पौलुस की प्रेरिताई का दिव्य आधार स्पष्ट रखता है।
- source_word: ὁ ἀδελφὸς
  choice: हमारा भाई
  rationale: यूनानी में शाब्दिक रूप से “वह भाई” है, पर पत्रीय सामुदायिक संदर्भ में “हमारा भाई” उसका स्वाभाविक हिन्दी निरूपण है।
- source_word: ἐκκλησίᾳ
  choice: कलीसिया
  rationale: पौलुसी पत्रों में विश्वासियों के समुदाय के लिए प्रचलित और सटीक हिन्दी बाइबलीय पद।
- source_word: ἁγίοις
  choice: पवित्र जनों
  rationale: सभी विश्वासियों की परमेश्वर के लिए अलग की गई सामुदायिक पहचान व्यक्त करता है और आधुनिक हिन्दी में “संतों” से जुड़ी संभावित विशिष्ट धार्मिक श्रेणी से बचता है।
- source_word: σὺν
  choice: और उसके साथ
  rationale: कुरिन्थुस की कलीसिया के साथ अखाया के अन्य पवित्र जनों को भी पत्र के संबोधन में सम्मिलित करता है।
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: पूरे अखाया में
  rationale: समूचे रोमी प्रान्त में फैले संबोधित समुदाय का क्षेत्रीय विस्तार स्पष्ट करता है।
theological_decisions:
- issue: पौलुस के आरम्भिक परिचय में Χριστός का अनुवाद
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु
  rationale: इस पद में Χριστός की उपाधिगत, अर्थात अभिषिक्त राजा, की शक्ति उपस्थित है; “मसीह” उसे हिन्दी पाठक के लिए दृश्यमान रखता है।
- issue: ἅγιοι से संबोधित लोगों की पहचान
  choice: पवित्र जन
  alternative: संत
  rationale: यह पद किसी विशेष रूप से मान्य धार्मिक वर्ग के बजाय परमेश्वर के लिए अलग किए गए सभी विश्वासियों को संबोधित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और पत्र के आरम्भिक संबोधन के अनुरूप रखी गई है। यूनानी वाक्य की लंबी संरचना को बनाए रखते हुए हिन्दी कारक-चिह्नों से प्राप्तकर्ता स्पष्ट किए गए हैं। किसी पाठांतर के लिए पादटिप्पणी आवश्यक नहीं है।
