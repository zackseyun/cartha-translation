source:
  edition: SBLGNT
  text: καθὼς καὶ ἐπέγνωτε ἡμᾶς ἀπὸ μέρους, ὅτι καύχημα ὑμῶν ἐσμεν καθάπερ καὶ ὑμεῖς ἡμῶν ἐν τῇ ἡμέρᾳ τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: hi
  text: जैसा कि तुमने भी हमें कुछ हद तक समझ लिया है[a] कि हम तुम्हारे गर्व का कारण हैं, ठीक वैसे ही तुम भी हमारे गर्व का कारण हो[b], हमारे प्रभु यीशु के दिन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अंशतः”; अर्थात “आंशिक रूप से” या “कुछ सीमा तक।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हमारा गर्व”; अर्थात “हमारे गर्व करने का कारण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: समझ लिया है
  rationale: यह कुरिन्थियों द्वारा पौलुस और उसके सहकर्मियों के विषय में वास्तविक पहचान या समझ प्राप्त करने को व्यक्त करता है, पर पूर्ण समझ का दावा नहीं करता।
- source_word: ἀπὸ μέρους
  choice: कुछ हद तक
  rationale: यह मुहावरा समझ की आंशिकता या अपूर्णता बताता है और उसकी सीमा को खुला रखता है।
- source_word: καύχημα
  choice: गर्व का कारण
  rationale: हिन्दी में केवल ‘गर्व’ की अपेक्षा यह संज्ञा उस व्यक्ति या संबंध को स्वाभाविक ढंग से व्यक्त करती है जिस पर गर्व किया जाता है; पौलुस की पारस्परिक भाषा भी बनी रहती है।
- source_word: καθάπερ
  choice: ठीक वैसे ही
  rationale: यह पौलुस और कुरिन्थियों के बीच स्पष्ट पारस्परिक तुलना को सुरक्षित रखता है।
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: हमारे प्रभु यीशु के दिन
  rationale: यह स्थापित अंतकालीन अभिव्यक्ति और यूनानी संबंधकारक रचना को सहज हिन्दी में बनाए रखता है।
- source_word: κύριος
  choice: प्रभु
  rationale: मसीही उपाधि के इस संदर्भ में ‘प्रभु’ आधुनिक मानक हिन्दी का स्वाभाविक और स्थापित रूप है।
- source_word: καθὼς καὶ
  choice: जैसा कि तुमने भी
  rationale: यह पिछले कथन से तुलना और καί के योगात्मक बल, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पौलुस की पारस्परिक καύχημα भाषा
  choice: हम तुम्हारे गर्व का कारण हैं, ठीक वैसे ही तुम भी हमारे गर्व का कारण हो
  alternative: हम तुम्हारा गर्व हैं, जैसे तुम भी हमारे हो
  rationale: चुना हुआ रूप आत्म-श्लाघा की व्याख्या थोपे बिना उस पारस्परिक आनंद और गर्व को स्पष्ट हिन्दी में व्यक्त करता है, जो प्रभु यीशु के दिन पूर्ण रूप से प्रकट होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। यूनानी वाक्य का प्रवाह बनाए रखने के लिए मुख्य उपवाक्यों को अल्पविरामों से जोड़ा गया है और पारस्परिक καύχημα को दोनों ओर समान रूप से व्यक्त किया गया है।
