    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: धन्य है
  rationale: स्तुतिपरक विधेय विशेषण की घोषणात्मक शक्ति को बनाए रखते हुए यह हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: θεὸς καὶ πατὴρ
  choice: परमेश्वर और पिता
  rationale: एक ही व्यक्ति के लिए प्रयुक्त दोनों सम्बंधसूचक संज्ञाओं को यूनानी रचना के अनुसार साथ रखा गया है।
- source_word: κυρίου
  choice: प्रभु
  rationale: नए नियम के मसीह-संबंधी प्रयोग में κύριος का प्रचलित, सम्मानसूचक और अर्थानुकूल हिन्दी रूप है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यहाँ Χριστός यीशु की उपाधि का अर्थ रखता है; ‘मसीह’ उसके अभिषिक्त जन होने का अर्थ बनाए रखता है।
- source_word: οἰκτιρμῶν
  choice: करुणाओं
  rationale: बहुवचन रूप को बनाए रखते हुए परमेश्वर की अनेक करुणामय अभिव्यक्तियों और गहरी दया का भाव व्यक्त होता है।
- source_word: πάσης παρακλήσεως
  choice: सारी सांत्वना
  rationale: πάσης की व्यापकता और παράκλησις के दुःख में ढाढ़स देने वाले प्रमुख संदर्भगत अर्थ को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστός का उपाधि अथवा नाम-जैसा प्रयोग
  choice: यीशु मसीह
  alternative: यीशु ख्रीष्ट
  rationale: ‘मसीह’ हिन्दी में स्थापित रूप है और मूल उपाधि ‘अभिषिक्त जन’ की अर्थवत्ता को ‘ख्रीष्ट’ की अपेक्षा अधिक स्पष्ट रखता है।
- issue: ὁ θεὸς καὶ πατὴρ का संबंध
  choice: एक ही व्यक्ति के लिए ‘परमेश्वर और पिता’
  alternative: ‘परमेश्वर’ और ‘पिता’ को अलग-अलग संदर्भ मानना
  rationale: एकवचन लेख और समन्वित पदबंध दोनों संज्ञाओं को एक ही संदर्भ—हमारे प्रभु यीशु मसीह के परमेश्वर और पिता—से जोड़ते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली अपनाई गई है। यूनानी के दो समानाधिकरण पदबंधों को स्पष्ट करने के लिए दूसरे पदबंध में स्वाभाविक हिन्दी संबंधवाचक रचना ‘जो ... है’ जोड़ी गई है; इससे आशय नहीं बदला। बहुवचन ‘करुणाओं’ और व्यापक ‘सारी सांत्वना’ को मूल की बनावट और अर्थ-सीमा के निकट रखा गया है।
