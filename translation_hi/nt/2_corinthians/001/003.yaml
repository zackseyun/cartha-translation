  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: hi
  text: धन्य हो हमारे प्रभु[b] यीशु मसीह[a] का परमेश्वर और पिता, जो करुणाओं[c] का पिता और सब प्रकार की सांत्वना[d] का परमेश्वर है।
  philosophy: optimal-equivalence
