reference: 2 Corinthians 1:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: hi
  text: 'क्योंकि यही हमारा गर्व है: हमारा विवेक इस बात की गवाही देता है कि हमने संसार में, और विशेषकर तुम्हारे साथ, पवित्रता[a] और परमेश्वर से मिलनेवाली निष्कपटता[b] के साथ आचरण किया है—शारीरिक बुद्धि[c] से नहीं, बल्कि परमेश्वर के अनुग्रह से।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन हस्तलिपियों में “पवित्रता” के स्थान पर “सरलता” है।
    reason: textual_variant
  - marker: b
    text: या “परमेश्वरीय निष्कपटता।”
    reason: lexical_alternative
  - marker: c
    text: या “मानवीय बुद्धि।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: गर्व
  rationale: यहाँ पौलुस के उचित और विश्वासपूर्ण आत्मविश्वास को व्यक्त करता है; संदर्भ इसे अहंकार के अर्थ से अलग करता है।
- source_word: μαρτύριον τῆς συνειδήσεως ἡμῶν
  choice: हमारा विवेक यह गवाही देता है
  rationale: मुहावरेदार हिन्दी में अंतःकरण की साक्षी को स्पष्ट रखते हुए यूनानी संबंध का स्वाभाविक वाक्यात्मक रूप देता है।
- source_word: ἁγιότητι
  choice: पवित्रता
  rationale: SBLGNT के पाठ ἁγιότητι का सीधा और धार्मिक-नैतिक बल वाला हिन्दी समतुल्य है।
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: परमेश्वर से मिलनेवाली ... निष्कपटता
  rationale: τοῦ θεοῦ को संभावित स्रोत के रूप में व्यक्त करता है, पर वैकल्पिक गुणवाचक अर्थ को पादटिप्पणी में सुरक्षित रखता है।
- source_word: σοφίᾳ σαρκικῇ
  choice: शारीरिक बुद्धि
  rationale: σαρκικός के 'शरीर/देह' शब्द-समूह को दृश्यमान रखता है और मानवीय स्वभाव से संचालित बुद्धि का भाव देता है।
- source_word: χάριτι θεοῦ
  choice: परमेश्वर के अनुग्रह से
  rationale: करण/साधन के अर्थ को स्वाभाविक हिन्दी में व्यक्त करते हुए पौलुस के χάρις संबंधी धार्मिक बल को बनाए रखता है।
- source_word: ἀνεστράφημεν
  choice: हमने ... अपना आचरण रखा है
  rationale: जीवन-व्यवहार और चालचलन के अर्थ को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: और विशेष रूप से तुम्हारे प्रति
  rationale: περισσοτέρως की तुलनात्मक तीव्रता और πρὸς की संबंधपरक दिशा दोनों सुरक्षित हैं।
theological_decisions:
- issue: εἰλικρινείᾳ τοῦ θεοῦ में τοῦ θεοῦ का बल
  choice: परमेश्वर से मिलनेवाली ... निष्कपटता
  alternative: परमेश्वर जैसी निष्कपटता / परमेश्वरीय निष्कपटता
  rationale: संबंधकारक को स्रोत के रूप में लेना संदर्भ में स्वाभाविक है, किंतु गुणवाचक अर्थ भी संभव है; इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: σοφίᾳ σαρκικῇ का अर्थ
  choice: शारीरिक बुद्धि
  alternative: मानवीय बुद्धि
  rationale: मुख्य पाठ σαρκ- शब्द-समूह की धार्मिक और मानव-स्वभाव संबंधी धार को बनाए रखता है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘तुम्हारे’ का प्रयोग समुदाय को संबोधित बहुवचन के रूप में है। वाक्यक्रम को हिन्दी में स्वाभाविक बनाने के लिए ‘विशेष रूप से तुम्हारे प्रति’ को मुख्य क्रिया के निकट रखा गया है।
