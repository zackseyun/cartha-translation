  verdict: revise
  source_fidelity: The draft correctly represents the main clauses, the SBLGNT reading “holiness,” the contrast with fleshly wisdom, and the special relation to the Corinthians. However, “परमेश्वर से मिलनेवाली” is positioned so that it modifies both “पवित्रता” and “निष्कपटता,” whereas τοῦ θεοῦ grammatically belongs only with εἰλικρινείᾳ (“sincerity”).
  naturalness: The Hindi is generally clear and suitably dignified. Recasting the opening as “यही हमारा गर्व है” and using “आचरण किया” makes the syntax more direct. “तुम्हारे साथ” is more idiomatic for conduct directed toward persons than “तुम्हारे प्रति.”
  terminology: “विवेक,” “पवित्रता,” “निष्कपटता,” “शारीरिक बुद्धि,” and “परमेश्वर का अनुग्रह” are appropriate modern-standard Hindi renderings. “गर्व” is acceptable here for Paul’s positive καύχησις. The source-oriented force of “परमेश्वर से मिलनेवाली” is retained, but attached only to “निष्कपटता.”
  issues:
  - severity: medium
    issue: Scope of “परमेश्वर से मिलनेवाली”
    rationale: In the draft, the phrase precedes the coordinated nouns and naturally modifies both “पवित्रता” and “निष्कपटता.” In Greek, τοῦ θεοῦ directly qualifies εἰλικρινείᾳ, not ἁγιότητι. Moving it adjacent to “निष्कपटता” preserves the grammatical relation without deciding more than the source does.
  - severity: low
    issue: Opening and relational phrasing
    rationale: “क्योंकि हमारा गर्व यह है” and “तुम्हारे प्रति ... आचरण रखा है” are understandable but slightly less idiomatic. The revision retains the meaning while improving Hindi flow.
