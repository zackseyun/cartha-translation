  text: ὁ παρακαλῶν ἡμᾶς ἐπὶ πάσῃ τῇ θλίψει ἡμῶν, εἰς τὸ δύνασθαι ἡμᾶς παρακαλεῖν τοὺς ἐν πάσῃ θλίψει διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: hi
  text: वह हमारे हर क्लेश में हमें सांत्वना देता है[a], ताकि हम भी किसी भी क्लेश में पड़े लोगों को उस सांत्वना के द्वारा सांत्वना दे सकें, जिससे हम स्वयं परमेश्वर के द्वारा सांत्वना पाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रोत्साहित करता है … प्रोत्साहन”; यूनानी में पूरे पद में एक ही शब्द-परिवार का प्रयोग हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶν / παρακαλεῖν / παρακλήσεως / παρακαλούμεθα
  choice: सांत्वना देता है / सांत्वना दे सकें / सांत्वना / सांत्वना देता है
  rationale: क्लेश के संदर्भ में यह शब्द-परिवार ढाढ़स और सामर्थ्य देने वाली सांत्वना व्यक्त करता है। पूरे पद में ‘सांत्वना’ शब्द-परिवार बनाए रखने से यूनानी की जानबूझकर की गई पुनरावृत्ति भी दिखाई देती है।
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: हमारे हर क्लेश में
  rationale: θλῖψις दबाव, कष्ट और विपत्ति का गंभीर भाव रखता है; ‘क्लेश’ इसे संक्षिप्त और प्रतिष्ठित आधुनिक हिन्दी में व्यक्त करता है। ἐπί को प्रसंगानुकूल ‘में’ कहना स्वाभाविक है।
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: ताकि ... हम ... दे सकें
  rationale: यह रचना उद्देश्य अथवा परिणाम व्यक्त कर सकती है। ‘ताकि’ प्रसंग में उद्देश्यपूर्ण प्रवाह को स्वाभाविक रूप से रखता है, जबकि सामर्थ्य का भाव ‘सकें’ में बना रहता है।
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: किसी भी क्लेश में पड़े लोगों को
  rationale: यह वाक्यांश व्यापक रूप से हर प्रकार के क्लेश में पड़े लोगों को समेटता है। ‘किसी भी’ हिन्दी में इस वितरणात्मक व्यापकता को सहजता से व्यक्त करता है।
- source_word: αὐτοὶ
  choice: स्वयं हमें
  rationale: αὐτοί का बल ‘हम’ पर है। हिन्दी वाक्य-विन्यास में ‘स्वयं हमें’ इस बात पर उचित जोर देता है कि दूसरों को वही सांत्वना दी जाती है जिसे हम खुद पाते हैं।
- source_word: ὑπὸ τοῦ θεοῦ
  choice: परमेश्वर ... देता है
  rationale: ὑπό निष्क्रिय क्रिया के साथ कर्ता को चिह्नित करता है। हिन्दी में सक्रिय उपवाक्य ‘परमेश्वर ... देता है’ वही कर्तृत्व स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: παρακαλέω / παράκλησις का अर्थ-क्षेत्र
  choice: सांत्वना
  alternative: हौसला / प्रोत्साहन / ढाढ़स
  rationale: θλῖψις के निकट संदर्भ में सांत्वना का अर्थ प्रमुख है, पर यह केवल भावनात्मक तसल्ली तक सीमित नहीं, बल्कि सहारा और हिम्मत देना भी समेटता है। फुटनोट इस व्यापक वैकल्पिक अर्थ की सूचना देता है।
- issue: εἰς τό रचना में उद्देश्य और परिणाम
  choice: उद्देश्यप्रधान ‘ताकि’
  alternative: परिणामप्रधान ‘जिससे’
  rationale: दोनों अर्थों में कुछ निकटता है; यहाँ परमेश्वर से मिली सांत्वना दूसरों को सांत्वना देने की क्षमता और उद्देश्य उत्पन्न करती है। ‘ताकि’ को चुना गया है, पर इससे परिणाम का भाव निषिद्ध नहीं होता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। ‘सांत्वना’ की पुनरावृत्ति शैलीगत रूप से जानबूझकर रखी गई है, क्योंकि मूल यूनानी भी उसी शब्द-परिवार को बार-बार दोहराता है।
