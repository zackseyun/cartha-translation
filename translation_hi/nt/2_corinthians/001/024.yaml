base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: hi
  text: यह नहीं कि हम तुम्हारे विश्वास[a] पर प्रभुता जताते हैं, बल्कि हम तुम्हारे आनन्द के लिए सहकर्मी हैं, क्योंकि तुम विश्वास से दृढ़ खड़े हो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भरोसे’।
    reason: lexical_alternative
  - marker: c
    text: या ‘क्योंकि तुम विश्वास में दृढ़ खड़े हो।’
    reason: alternative_reading
lexical_decisions:
- source_word: κυριεύομεν
  choice: प्रभुता जताते हैं
  rationale: यह अभिव्यक्ति किसी पर स्वामी की तरह अधिकार चलाने के नकारात्मक भाव को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करती है।
- source_word: ὑμῶν τῆς πίστεως
  choice: तुम्हारे विश्वास
  rationale: सम्बन्धकारक रचना को हिन्दी में स्वाभाविक रूप से व्यक्त करता है; πίστις के लिए मुख्य पाठ में परियोजना-संगत शब्द ‘विश्वास’ रखा गया है।
- source_word: συνεργοί
  choice: तुम्हारे सहकर्मी
  rationale: शब्द साथ मिलकर काम करने वालों को दर्शाता है, न कि कुरिन्थियों के ऊपर अधिकार रखने वालों को। सन्दर्भ के कारण ‘तुम्हारे’ जोड़ना सम्बन्ध को हिन्दी में स्पष्ट करता है।
- source_word: τῆς χαρᾶς ὑμῶν
  choice: तुम्हारे आनन्द के लिए
  rationale: यूनानी सम्बन्धकारक यहाँ लक्ष्य अथवा हित का भाव देता है; यह हिन्दी में उस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῇ γὰρ πίστει
  choice: विश्वास से
  rationale: सम्प्रदान कारक को साधन या आधार के अर्थ में लिया गया है; ‘से’ इस अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἑστήκατε
  choice: दृढ़ खड़े हो
  rationale: पूर्णकालिक रूप स्थापित और जारी स्थिति का बोध कराता है; ‘दृढ़ खड़े हो’ केवल ‘खड़े हो’ की अपेक्षा इस परिणामात्मक बल को बेहतर व्यक्त करता है।
theological_decisions:
- issue: दोनों स्थानों पर πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: सन्दर्भ कुरिन्थियों के विश्वास करने और उसी आधार पर स्थिर रहने की बात करता है। ‘विश्वासयोग्यता’ यहाँ कम सम्भावित है; पहले प्रयोग में ‘भरोसा’ सम्भव शब्दार्थ है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: τῇ πίστει में कारक का अर्थ
  choice: विश्वास से
  alternative: विश्वास में
  rationale: सम्प्रदान को साधन अथवा आधार मानना प्रसंग में उपयुक्त है, पर स्थान-क्षेत्र का अर्थ ‘विश्वास में’ भी व्याकरणतः सम्भव है; वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप अपनाया गया है। बहुवचन सम्बोधन के लिए ‘तुम’ रखा गया है, जो मण्डली को सम्बोधित पौलुस के निकट किन्तु सम्मानपूर्ण स्वर के अनुकूल है। ‘प्रभुता जताना’ अधिकार के दमनकारी प्रयोग और ‘सहकर्मी’ साझे श्रम के विरोध को स्पष्ट रखता है।
