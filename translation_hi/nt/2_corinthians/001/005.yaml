  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: hi
  text: क्योंकि जैसे मसीह[b] के दुःख[a] हम पर उमड़ते हैं, वैसे ही मसीह के द्वारा हमारी सांत्वना भी उमड़ती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मसीह के लिए सहे गए दुःख।” यूनानी पद का अर्थ मसीह से सम्बन्धित दुःख या उसके कारण सहे गए दुःख हो सकता है।
    reason: alternative_reading
  - marker: b
    text: जहाँ पदवी का भाव प्रमुख हो, वहाँ “मसीह” का अनुवाद “मसीहा” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इसके कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: καθὼς ... οὕτως
  choice: जैसे ... वैसे ही
  rationale: मूल की परस्पर-संबद्ध तुलना को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: περισσεύει
  choice: उमड़ते हैं / उमड़ती है
  rationale: दोनों बार प्रयुक्त क्रिया की पुनरावृत्ति को रखते हुए प्रचुरता और बहाव—दोनों का बिंब व्यक्त करता है। वचन और लिंग हिन्दी के कर्ताओं के अनुसार बदले हैं।
- source_word: τὰ παθήματα
  choice: दुःख
  rationale: πάθημα के कष्ट और पीड़ा के व्यापक अर्थ को सरल, गरिमापूर्ण और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: τοῦ Χριστοῦ
  choice: मसीह के
  rationale: सम्बन्धकारक की वास्तविक अस्पष्टता को मुख्य पाठ में सुरक्षित रखता है; यह मसीह से सम्बन्धित दुःख अथवा मसीह के कारण सहे गए दुःख का संकेत दे सकता है।
- source_word: εἰς ἡμᾶς
  choice: हम पर
  rationale: इस प्रसंग में दुःखों के पौलुस और उसके सहकर्मियों पर आने या उनके अनुभव में भरपूर होने का स्वाभाविक हिन्दी रूप है।
- source_word: διὰ τοῦ Χριστοῦ
  choice: मसीह के द्वारा
  rationale: διά के सम्बन्धकारक प्रयोग में मध्यस्थ साधन को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἡ παράκλησις ἡμῶν
  choice: हमारी सांत्वना
  rationale: परमेश्वर से मिलने वाले धीरज और ढाढ़स के अर्थ को संक्षिप्त रखते हुए मूल के सम्बन्धवाचक रूप को सुरक्षित करता है।
theological_decisions:
- issue: ‘मसीह के दुःख’ का सम्बन्ध
  choice: मुख्य पाठ में ‘मसीह के दुःख’ रखकर सम्बन्धकारक की अस्पष्टता सुरक्षित रखी गई है।
  alternative: ‘मसीह के लिए सहे गए दुःख’ या मसीह के अपने दुःखों में उसके लोगों की सहभागिता।
  rationale: यूनानी सम्बन्धकारक एक से अधिक सम्बन्ध दर्शा सकता है। किसी एक धर्मवैज्ञानिक अर्थ को निर्णायक बनाने के बजाय मुख्य पाठ औपचारिक तनाव रखता है और पादटिप्पणी प्रमुख वैकल्पिक अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। ‘जैसे ... वैसे ही’ और ‘उमड़ते ... उमड़ती’ द्वारा मूल की समानांतर संरचना और दोहराव सुरक्षित रखे गए हैं। ‘मसीह’ हिन्दी में स्थापित पद/नाम है, इसलिए अलग शब्दार्थ-पादटिप्पणी आवश्यक नहीं समझी गई।
