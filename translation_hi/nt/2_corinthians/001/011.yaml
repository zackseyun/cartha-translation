reference: 2 Corinthians 1:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν εὐχαριστηθῇ ὑπὲρ ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: hi
  text: और आप भी प्रार्थना के द्वारा हमारी सहायता करते हैं[a], ताकि बहुत-से लोगों की ओर से हमारे लिए उस अनुग्रह के वरदान[b] के लिए धन्यवाद दिया जाए, जो बहुतों के द्वारा हमें मिला है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रार्थना’ यहाँ आग्रहपूर्ण विनती या याचना का भाव भी रखती है।
    reason: lexical_alternative
  - marker: b
    text: ‘अनुग्रह का वरदान’ का अनुवाद ‘आशीष’ या ‘हम पर किया गया उपकार’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'यूनानी वाक्य में ‘बहुतों’ का उल्लेख दो बार है और उनका सटीक संबंध कठिन है। यहाँ ‘बहुतों के द्वारा’ को वरदान के हमें मिलने से जोड़ा गया है। वैकल्पिक अर्थ: ‘ताकि बहुतों के माध्यम से/कारण, बहुत-से लोग हमारे लिए उस वरदान के लिए धन्यवाद दें।’'
    reason: alternative_reading
lexical_decisions:
- source_word: συνυπουργούντων
  choice: हमारी सहायता में सहभागी होते हैं
  rationale: संयुक्त उपसर्ग συν- और सहायता/सेवा के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; यह केवल साथ होने के बजाय सक्रिय सहयोग बताता है।
- source_word: τῇ δεήσει
  choice: विनती करके
  rationale: δέησις विशेष रूप से आग्रहपूर्ण प्रार्थना या याचना को दर्शाता है। ‘विनती’ इस विशेषता को सामान्य ‘प्रार्थना’ से अधिक स्पष्ट रखती है और करणार्थक प्रयोग को व्यक्त करती है।
- source_word: ἐκ πολλῶν προσώπων
  choice: बहुत-से लोगों की ओर से
  rationale: πρόσωπον का शाब्दिक अर्थ ‘चेहरा’ है, पर यहाँ वह व्यक्ति के लिए प्रयुक्त मुहावरा है। ‘बहुत-से लोगों की ओर से’ धन्यवाद के स्रोत/कर्ता का स्वाभाविक अर्थ देता है।
- source_word: χάρισμα
  choice: अनुग्रह का वरदान
  rationale: χάρισμα में अनुग्रह से दिए गए उपहार का भाव है। प्रसंग में यह परमेश्वर से मिली कृपालु सहायता या छुटकारे की ओर संकेत करता है, पर अनुवाद उस संकेत को किसी एक घटना तक सीमित नहीं करता।
- source_word: διὰ πολλῶν
  choice: बहुतों के द्वारा
  rationale: वाक्य में दूसरी बार आए πολλῶν को हटाने के बजाय रखा गया है। διά के माध्यम/कर्ता-संबंधी अर्थ को ‘के द्वारा’ व्यक्त करता है, जबकि इस कठिन वाक्यांश के सटीक संबंध को पादटिप्पणी में खुला रखा गया है।
- source_word: εὐχαριστηθῇ
  choice: धन्यवाद दिया जाए
  rationale: यूनानी कर्मवाच्य क्रिया को स्वाभाविक हिन्दी कर्मवाच्य में रखा गया है; आशय वरदान के लिए धन्यवाद अर्पित किया जाना है।
- source_word: ὑπὲρ ἡμῶν
  choice: हमारे लिए / हमारी ओर से
  rationale: पहले प्रयोग में प्रार्थना के लाभार्थी होने का भाव ‘हमारे लिए’ से और अंतिम खंड में प्रतिनिधिक/संदर्भगत भाव ‘हमारी ओर से’ के अंतर्गत वाक्य-संरचना से व्यक्त होता है।
theological_decisions:
- issue: χάρισμα का संदर्भ
  choice: ‘अनुग्रह का वरदान’ रखकर इसे परमेश्वर से मिली कृपालु सहायता के रूप में खुला रखा गया है।
  alternative: इसे स्पष्ट रूप से ‘छुटकारा’, ‘आशीष’ या किसी विशिष्ट आत्मिक वरदान के रूप में अनूदित करना।
  rationale: निकट प्रसंग संकट से बचाए जाने की ओर संकेत करता है, पर χάρισμα स्वयं व्यापक है; किसी विशिष्ट धार्मिक या घटनात्मक अर्थ को मुख्य पाठ में थोपना उचित नहीं।
- issue: ἐκ πολλῶν προσώπων और διὰ πολλῶν के परस्पर संबंध
  choice: दोनों ‘बहुतों’ को मुख्य पाठ में बनाए रखते हुए कठिन संरचना को पादटिप्पणी में समझाया गया है।
  alternative: एक वाक्यांश को छोड़ देना या διὰ πολλῶν को निश्चित रूप से ‘बहुतों की प्रार्थनाओं के फलस्वरूप’ कहना।
  rationale: यूनानी पाठ में दोनों वाक्यांश उपस्थित हैं और उनका सटीक वाक्यगत संबंध विवादित है; इसलिए वास्तविक अस्पष्टता को मिटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामुदायिक पाठ के योग्य रखी गई है। ‘सहभागी होते हैं’, ‘विनती’ और ‘अनुग्रह का वरदान’ गरिमापूर्ण हैं, पर अत्यधिक संस्कृतनिष्ठ नहीं। मुख्य पाठ में यूनानी की दोनों ‘बहुतों’ वाली अभिव्यक्तियाँ जानबूझकर रखी गई हैं, यद्यपि इससे वाक्य कुछ सघन है।
