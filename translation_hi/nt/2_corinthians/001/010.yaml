  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: hi
  text: जिसने हमें इतनी भयंकर मृत्यु से बचाया और बचाएगा, उसी पर हमने आशा रखी है कि वह हमें आगे भी बचाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηλικούτου
  choice: ऐसी बड़ी
  rationale: यह संकेतवाचक विशेषण संकट की विशालता और गंभीरता पर बल देता है; ‘ऐसी बड़ी’ यूनानी अभिव्यक्ति के जोर को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: θανάτου
  choice: मृत्यु
  rationale: मूल संज्ञा का सीधा अर्थ ‘मृत्यु’ है। यद्यपि प्रसंग में इसका आशय प्राणघातक संकट हो सकता है, मुख्य पाठ में मूल बिंब सुरक्षित रखा गया है।
- source_word: ἐρρύσατο
  choice: बचाया
  rationale: क्रिया खतरे से छुड़ाने या बचाने को व्यक्त करती है। ‘बचाया’ आधुनिक, सहज और प्रसंगानुकूल है।
- source_word: ῥύσεται
  choice: बचाएगा / बचाता रहेगा
  rationale: एक ही यूनानी क्रिया की शब्दगत संगति रखते हुए पहले प्रयोग में स्पष्ट भविष्य और अंतिम प्रयोग में ἔτι के साथ आगे जारी रहने वाली अपेक्षा व्यक्त की गई है।
- source_word: εἰς ὃν
  choice: उसी पर
  rationale: इस रचना में εἰς आशा के आधार या लक्ष्य को दर्शाता है; हिन्दी में ‘उसी पर आशा रखना’ स्वाभाविक है और व्यक्तिगत केंद्र बनाए रखता है।
- source_word: ἠλπίκαμεν
  choice: हमने आशा रखी है
  rationale: पूर्णकाल अतीत में रखी गई और वर्तमान में कायम आशा को दर्शाता है; यह हिन्दी रूप उस स्थायी भरोसे को व्यक्त करता है।
- source_word: καὶ ἔτι
  choice: आगे भी
  rationale: यह संयोजन निरंतरता और भविष्य में फिर सहायता मिलने की अपेक्षा को व्यक्त करता है। ‘आगे भी’ हिन्दी में दोनों भावों को संक्षेप और स्वाभाविकता से संप्रेषित करता है।
theological_decisions:
- issue: ‘मृत्यु’ को अक्षरशः रखना या मुख्य पाठ में ‘प्राणघातक संकट’ कहना
  choice: मुख्य पाठ में ‘मृत्यु’ रखा गया
  alternative: ‘ऐसे बड़े प्राणघातक संकट से’
  rationale: यूनानी पाठ स्पष्ट रूप से ‘मृत्यु’ कहता है। इस तीव्र बिंब को बनाए रखना मूल-भाषा की प्रधानता और पौलुस की अभिव्यक्ति के तनाव को सुरक्षित रखता है; मुहावरेदार अर्थ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘आशा रखी है’ पूर्णकाल की जारी अवस्था को और ‘आगे भी बचाता रहेगा’ भविष्य में निरंतर उद्धार की अपेक्षा को स्वाभाविक हिन्दी में व्यक्त करता है।
