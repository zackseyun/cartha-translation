source:
  edition: SBLGNT
  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: hi
  text: बल्कि, हम स्वयं अपने भीतर मृत्यु का फ़ैसला लिए हुए थे,[a] ताकि हम अपने आप पर भरोसा न रखें, बल्कि उस परमेश्वर पर रखें जो मरे हुओं को जिलाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मृत्यु का दण्डादेश।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पिछले कथन के साथ प्रबल विरोध व्यक्त करता है; हिंदी में ‘बल्कि’ इस प्रतिकूल बल को स्वाभाविक रूप से रखता है।
- source_word: αὐτοὶ ἐν ἑαυτοῖς
  choice: हमने स्वयं अपने भीतर
  rationale: ‘स्वयं’ बलाघात को और ‘अपने भीतर’ आंतरिक व्यक्तिगत अनुभूति को सुरक्षित रखता है।
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: मृत्यु का फ़ैसला
  rationale: यहाँ ἀπόκριμα किसी निर्णायक अथवा न्यायिक निष्कर्ष का बोध कराता है; ‘फ़ैसला’ हिंदी में स्वाभाविक है और ‘दण्डादेश’ की अपेक्षा स्रोत की संभावित व्यापकता बनाए रखता है।
- source_word: ἐσχήκαμεν
  choice: पा लिया था
  rationale: पूर्णकालीन रूप पूर्व अनुभव से उत्पन्न स्थिर अवस्था का संकेत देता है। ‘पा लिया था’ उस परिणामी अनुभूति को व्यक्त करता है, यद्यपि क्रिया में औपचारिक रूप से ‘प्राप्त करना’ निहित नहीं है।
- source_word: ἵνα μὴ πεποιθότες ὦμεν
  choice: ताकि हम ... भरोसा रखें
  rationale: उद्देश्य और स्थिर निर्भरता दोनों को सरल, वर्तमान मानक हिंदी में व्यक्त करता है।
- source_word: ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ
  choice: अपने ऊपर नहीं, बल्कि ... परमेश्वर पर
  rationale: स्वयं पर और परमेश्वर पर निर्भरता के स्पष्ट विरोध को समानांतर संरचना में सुरक्षित रखता है।
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: जो मरे हुओं को जिलाता है
  rationale: परमेश्वर की मृतकों को जीवन देने वाली सामर्थ्य का सीधा और स्वाभाविक हिंदी निरूपण है।
theological_decisions:
- issue: τοὺς νεκρούς का सामूहिक अर्थ
  choice: मरे हुओं
  alternative: मृत लोगों
  rationale: ‘मरे हुओं’ स्वाभाविक, व्यापक और पुनरुत्थान-संबंधी अर्थ के प्रति खुला है; इसमें कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ी गई।
- issue: ἀπόκριμα को आत्मगत अनुभूति या वस्तुगत न्यायिक निर्णय मानना
  choice: मृत्यु का फ़ैसला पा लिया था
  alternative: हमें लगा था कि हमारी मृत्यु निश्चित है
  rationale: मुख्य पाठ न्यायिक/निर्णायक रूपक को बनाए रखता है और उसे केवल मनोवैज्ञानिक अनुभूति बनाकर तनाव को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल किंतु गरिमापूर्ण शैली। ‘फ़ैसला’ आम पाठक के लिए बोधगम्य है; पादटिप्पणी अधिक न्यायिक विकल्प सुरक्षित रखती है।
