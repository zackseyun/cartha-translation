source:
  edition: SBLGNT
  text: ὅσαι γὰρ ἐπαγγελίαι θεοῦ, ἐν αὐτῷ τὸ Ναί· ⸀διὸ καὶ ⸂δι’ αὐτοῦ⸃ τὸ Ἀμὴν τῷ θεῷ πρὸς δόξαν δι’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: hi
  text: क्योंकि परमेश्वर की प्रतिज्ञाएँ जितनी भी हैं, मसीह में उनका “हाँ” है।[a] इसीलिए उसके द्वारा परमेश्वर के प्रति “आमीन”[b] भी हमारे द्वारा महिमा के लिए कहा जाता है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक स्पष्ट रूप से: “मसीह में उन्हें अपना ‘हाँ’ मिलता है।”'
    reason: alternative_reading
  - marker: b
    text: “आमीन” एक लिप्यंतरित समर्थन-वचन है, जिसका अर्थ प्रसंग के अनुसार “सचमुच” या “ऐसा ही हो” के समान है।
    reason: cultural_note
  - marker: c
    text: 'या: “हमारे द्वारा परमेश्वर की महिमा के लिए।” इस रूप में “महिमा” को अधिक स्पष्टता से परमेश्वर के साथ जोड़ा गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσαι
  choice: जितनी भी
  rationale: यह अभिव्यक्ति परमेश्वर की सभी प्रतिज्ञाओं को समेटने वाली अनिश्चित समग्रता को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: ἐπαγγελίαι θεοῦ
  choice: परमेश्वर की प्रतिज्ञाएँ
  rationale: सम्बन्धकारक को सीधा रखते हुए प्रतिज्ञाओं को परमेश्वर की अपनी प्रतिज्ञाएँ बताया गया है।
- source_word: ἐν αὐτῷ τὸ Ναί
  choice: मसीह में ही उनका “हाँ” है
  rationale: मूल के संक्षिप्त और प्रभावपूर्ण कथन को बनाए रखा गया है; “पूरा होना” जैसे व्याख्यात्मक क्रिया-पद को मुख्य पाठ में नहीं जोड़ा गया। प्रसंग की स्पष्टता के लिए सर्वनाम के स्थान पर “मसीह” और सहज हिन्दी के लिए “उनका” रखा गया है।
- source_word: δι’ αὐτοῦ
  choice: मसीह के द्वारा ही
  rationale: διά के सम्बन्धकारक रूप का मध्यस्थता-सूचक अर्थ “के द्वारा” से व्यक्त होता है; “ही” यूनानी καί के बल को इस प्रसंग में स्वाभाविक ढंग से सामने लाता है।
- source_word: τὸ Ἀμὴν
  choice: “आमीन”
  rationale: प्रचलित धार्मिक लिप्यंतरण मूल की उपासना-संबंधी प्रतिध्वनि बनाए रखता है।
- source_word: τῷ θεῷ
  choice: परमेश्वर के प्रति
  rationale: सम्प्रदान कारक को उस व्यक्ति के रूप में व्यक्त किया गया है जिसकी ओर “आमीन” निर्देशित है।
- source_word: πρὸς δόξαν δι’ ἡμῶν
  choice: ताकि हमारे द्वारा महिमा हो
  rationale: उद्देश्य और माध्यम दोनों को व्यक्त किया गया है, पर मुख्य पाठ में यह स्पष्ट नहीं किया गया कि “महिमा” व्याकरण की दृष्टि से सीधे “परमेश्वर” के साथ जोड़ी जाए या नहीं।
theological_decisions:
- issue: क्या पौलुस के संक्षिप्त कथन को प्रतिज्ञाओं की पूर्ति के स्पष्ट सूत्र में बदलना चाहिए
  choice: “मसीह में ही उनका ‘हाँ’ है” कहकर संक्षिप्त और आलंकारिक रूप बनाए रखना
  alternative: “मसीह में परमेश्वर की सभी प्रतिज्ञाएँ पूरी होती हैं”
  rationale: मसीह में पूर्ति का भाव प्रबल है, पर मूल यूनानी स्पष्टतः “पूरी होती हैं” नहीं कहता; इसलिए निहितार्थ को मुख्य पाठ में पूर्ण व्याख्या में नहीं बदला गया।
- issue: πρὸς δόξαν का सम्बन्ध किससे माना जाए
  choice: “ताकि हमारे द्वारा महिमा हो” कहकर महिमा के अधिकारी को मुख्य पाठ में अनकहा रखना
  alternative: “ताकि हमारे द्वारा परमेश्वर की महिमा हो”
  rationale: निकटवर्ती τῷ θεῷ के कारण परमेश्वर की महिमा अभिप्रेत होना स्वाभाविक है, फिर भी यूनानी वाक्यांश संक्षिप्त है; वैकल्पिक स्पष्ट रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। “हाँ” और “आमीन” की समानांतर प्रभावशीलता को उद्धरण-चिह्नों से उभारा गया है। “कहा जाता है” हिन्दी में वाक्य को स्वाभाविक बनाता है, जबकि कर्मवाच्य मूल के संक्षिप्त कथन और “हमारे द्वारा” को बनाए रखता है।
