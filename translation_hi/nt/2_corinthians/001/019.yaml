id: 2CO.1.19
reference: 2 Corinthians 1:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: hi
  text: क्योंकि परमेश्वर का पुत्र, यीशु मसीह, जिसका प्रचार हमारे द्वारा—मेरे, सिलवानुस और तीमुथियुस के द्वारा—तुम्हारे बीच किया गया, “हाँ” और “नहीं” नहीं हुआ; बल्कि उसमें “हाँ” ही हुआ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: υἱὸς τοῦ θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: यूनानी संबंधवाचक पदबंध और उसके मसीह-विषयक महत्व को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: Ἰησοῦς Χριστός
  choice: यीशु मसीह
  rationale: हिन्दी में यह स्थापित और स्वाभाविक नाम-सदृश रूप है; साथ ही Χριστός के मसीहाई अर्थ को बनाए रखता है।
- source_word: κηρυχθείς
  choice: जिसका प्रचार ... किया गया
  rationale: κηρύσσω के सार्वजनिक घोषणा/प्रचार के भाव को सामान्य और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: δι’ ἡμῶν
  choice: हमारे द्वारा
  rationale: διά द्वारा व्यक्त माध्यम अथवा कर्तृत्व को स्पष्ट रखता है और आगे नामित सेवकों से इसका संबंध बनाए रखता है।
- source_word: δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: मेरे, सिलवानुस और तीमुथियुस के द्वारा
  rationale: पौलुस के आत्म-संदर्भ और उसके दोनों सहकर्मियों को उसी माध्यमवाचक संरचना में प्रस्तुत करता है।
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὒ
  choice: “हाँ” और “नहीं” नहीं हुआ
  rationale: ἐγένετο को ‘हुआ’ से निकटता से व्यक्त करते हुए पौलुस की जानबूझकर रखी गई आलंकारिक भाषा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: बल्कि उसमें “हाँ” ही हुआ है
  rationale: γέγονεν के पूर्णकालिक, वर्तमान-परिणाम वाले भाव को ‘हुआ है’ से व्यक्त करता है; ‘ही’ विरोध को स्वाभाविक हिन्दी में उभारता है और ‘उसमें’ की धर्मवैज्ञानिक खुली बनावट को बनाए रखता है।
theological_decisions:
- issue: Χριστός को उपाधि या नाम-सदृश पद के रूप में प्रस्तुत करना
  choice: यीशु मसीह
  alternative: यीशु, अभिषिक्त जन
  rationale: यहाँ Ἰησοῦς Χριστός एक स्थिर व्यक्तिगत पदनाम की तरह प्रयुक्त है। ‘यीशु मसीह’ हिन्दी बाइबलीय भाषा में स्वाभाविक है और किसी अतिरिक्त व्याख्या को आरोपित नहीं करता।
- issue: Ναί/Οὔ की आलंकारिक भाषा को समझाकर कहना या ज्यों का त्यों रखना
  choice: “हाँ” और “नहीं” नहीं हुआ; बल्कि उसमें “हाँ” ही हुआ है
  alternative: वह अस्थिर नहीं था, बल्कि पूरी तरह विश्वसनीय था
  rationale: मुख्य पाठ पौलुस के ‘हाँ/नहीं’ वाले विरोध को सुरक्षित रखता है और उसे ‘अस्थिरता’ या ‘विश्वसनीयता’ जैसे व्याख्यात्मक निष्कर्ष में नहीं बदलता।
- issue: ἐγένετο और γέγονεν के पहलूगत अंतर को व्यक्त करना
  choice: नहीं हुआ ... हुआ है
  alternative: नहीं था ... है
  rationale: पहले क्रियारूप के साधारण भूतकाल और दूसरे के पूर्णकालिक वर्तमान-परिणाम को यथासंभव सहज हिन्दी में अलग रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। यूनानी वाक्य की पुनरुक्ति और ‘हाँ/नहीं’ की धर्मवैज्ञानिक एवं आलंकारिक अस्पष्टता को जानबूझकर बनाए रखा गया है।
