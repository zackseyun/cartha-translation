  text: who also sealed us and gave the down payment of the Spirit in our hearts.
translation:
  language: hi
  text: जिसने हम पर अपनी मुहर भी लगाई और हमारे हृदयों में आत्मा को बयाने के रूप में दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जमानत” अथवा “गारंटी”।
    reason: ἀρραβών के शब्दगत विकल्प और उसके आश्वासनकारी अर्थ को दर्ज करना।
lexical_decisions:
- source_word: σφραγισάμενος
  choice: हम पर अपनी मुहर लगाई
  rationale: यह स्वामित्व, प्रामाणिकता या सुरक्षा की मुहर का रूपक बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: δοὺς
  choice: दिया
  rationale: अओरिस्ट कृदन्त को समानांतर हिन्दी उपवाक्य में समापिका क्रिया के रूप में रखना सहज है।
- source_word: ἀρραβῶνα
  choice: बयाने
  rationale: यह उस आरम्भिक रकम का ठोस व्यापारिक रूपक बनाए रखता है जो शेष भुगतान की निश्चितता देती है।
- source_word: τοῦ πνεύματος
  choice: पवित्र आत्मा को बयाने के रूप में
  rationale: सम्बन्धकारक को स्पष्ट, स्वाभाविक हिन्दी में इस अर्थ के साथ व्यक्त किया गया है कि बयाना स्वयं आत्मा है; 'पवित्र' सन्दर्भ में परमेश्वर के आत्मा की पहचान स्पष्ट करता है।
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: हमारे हृदयों में
  rationale: यह ἐν के स्थान-सूचक अर्थ और पौलुस की भीतरी व्यक्ति की छवि को बनाए रखता है।
- source_word: ὁ καὶ ... καὶ
  choice: जिसने ... भी ... और
  rationale: यह पिछले पद के परमेश्वर से सम्बन्ध जोड़ता और दोनों कृदन्तों का समानांतर सम्बन्ध सुरक्षित रखता है।
theological_decisions:
- issue: पवित्र आत्मा के लिए ἀρραβών का अर्थ
  choice: आत्मा को 'बयाने' के रूप में प्रस्तुत किया गया है।
  alternative: '''जमानत'', ''प्रतिज्ञा'' या ''गारंटी'''
  rationale: व्यापारिक रूपक को बनाए रखने से भावी पूर्णता की निश्चितता व्यक्त होती है, बिना उसे केवल अमूर्त धर्मवैज्ञानिक कथन बना देने के।
- issue: τοῦ πνεύματος में सम्बन्ध
  choice: बयाना स्वयं पवित्र आत्मा है।
  alternative: बयाना आत्मा की ओर से है
  rationale: सम्बन्धकारक दोनों सम्भावनाएँ दे सकता है, पर निकट पौलुसी प्रयोग में आत्मा को मिली हुई पहली किस्त समझना अधिक स्वाभाविक है; पादटिप्पणी शब्दगत विकल्प दर्ज करती है, सम्बन्ध को सिद्धान्तगत विस्तार से नहीं भरती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। 'बयाना' ठोस व्यापारिक छवि को बचाता है; 'हृदयों' बाइबिलीय आन्तरिकता को बनाए रखता है।
