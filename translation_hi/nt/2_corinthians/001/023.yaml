base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: hi
  text: पर मैं अपने प्राण पर परमेश्वर को गवाह करके कहता हूँ कि तुम्हें बचाने के लिए मैं फिर कुरिन्थ नहीं आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: पर मैं
  rationale: δέ के हल्के विरोध और ἐγώ के स्पष्ट प्रथम-पुरुष बल, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: परमेश्वर को गवाह करता हूँ
  rationale: यह शपथ-सदृश, गंभीर अभिव्यक्ति के न्यायिक भाव को सहज और प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: अपने प्राण की सौगंध खाकर
  rationale: शाब्दिक 'मेरे प्राण पर' हिन्दी में अस्पष्ट है; यह मुहावरेदार रूप उस आत्म-दायित्व को स्पष्ट करता है जिसके अंतर्गत पौलुस परमेश्वर को गवाह बनाता है।
- source_word: ὅτι
  choice: कि
  rationale: यह पौलुस की गंभीर गवाही की विषय-वस्तु प्रस्तुत करता है।
- source_word: φειδόμενος ὑμῶν
  choice: तुम्हें बख्शने के लिए ही
  rationale: 'कृदन्त का प्रेरक भाव व्यक्त करता है: उसके न आने का उद्देश्य उन्हें कठोर व्यवहार या दुःख से बचाना था; ''ही'' इसी कारण पर बल देता है।'
- source_word: οὐκέτι ἦλθον
  choice: मैं फिर ... नहीं आया
  rationale: संदर्भ में नियोजित वापसी-यात्रा न करने का भाव है; आधुनिक हिन्दी में यह οὐκέτι का स्वाभाविक निर्वाह है।
- source_word: εἰς Κόρινθον
  choice: कुरिन्थ
  rationale: गति-सूचक क्रिया 'आया' के साथ हिन्दी में नगर-नाम को बिना परसर्ग रखना स्वाभाविक है।
theological_decisions:
- issue: ἐπὶ τὴν ἐμὴν ψυχήν में शपथ और आत्म-दायित्व का संबंध
  choice: अपने प्राण की सौगंध खाकर
  alternative: अपने ही प्राण पर / अपने विरुद्ध
  rationale: चुना हुआ पाठ हिन्दी पाठक को शपथ का वास्तविक आशय समझाता है, पर इसे किसी विशिष्ट सांप्रदायिक शपथ-सिद्धांत में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। 'बख्शने' में दया के साथ संभावित कठोरता से बचाने का संदर्भगत भाव आता है; वाक्य की शपथ-सदृश गंभीरता भी सुरक्षित है।
