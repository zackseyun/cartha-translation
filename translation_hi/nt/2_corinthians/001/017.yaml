  text: τοῦτο οὖν ⸀βουλόμενος μήτι ἄρα τῇ ἐλαφρίᾳ ἐχρησάμην; ἢ ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι, ἵνα ᾖ παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: hi
  text: इसलिए जब मैंने यह इरादा किया, तो क्या मैंने चंचलता से काम लिया? या जो योजनाएँ मैं बनाता हूँ, क्या उन्हें शरीर के अनुसार बनाता हूँ,[a] ताकि मेरे यहाँ “हाँ, हाँ” और “नहीं, नहीं” दोनों हों?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “शरीर के अनुसार” का अर्थ यहाँ केवल मानवीय या सांसारिक सोच के अनुसार हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् ऐसा बोलना मानो एक ही बात के लिए “हाँ” और “नहीं” दोनों सही हों।
    reason: cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: जब मैंने यह इरादा किया
  rationale: कृदन्त का संबंध पौलुस की पहले बताई गई यात्रा-योजना से है। ‘इरादा किया’ उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है, बिना औपचारिक निर्णय का अतिरिक्त भाव जोड़े।
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: क्या मैंने चंचलता से काम लिया
  rationale: यह प्रयोग उद्देश्य की अस्थिरता या हल्केपन से आचरण करने का बोध देता है। ‘चंचलता’ यहाँ बदलते इरादे के आरोप को स्पष्ट और संक्षिप्त रूप से व्यक्त करती है।
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: जो योजनाएँ मैं बनाता हूँ, क्या ... बनाता हूँ
  rationale: मूल यूनानी की पुनरुक्ति को हिन्दी में यथासंभव रखा गया है, क्योंकि यह आलंकारिक बल देती है।
- source_word: κατὰ σάρκα
  choice: शरीर के अनुसार
  rationale: पौलुस के महत्त्वपूर्ण और बहुअर्थी शब्द σάρξ को मुख्य पाठ में बनाए रखा गया है; सम्भावित अर्थ को पादटिप्पणी में समझाया गया है।
- source_word: παρ’ ἐμοὶ
  choice: मेरी ओर से
  rationale: इस प्रसंग में यह पौलुस के व्यवहार या कथन से निकलने वाली बात को दर्शाता है। ‘मेरी ओर से’ स्वाभाविक हिन्दी है और मूल संबंधसूचक अभिव्यक्ति के निकट रहती है।
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: “हाँ, हाँ” भी ... “नहीं, नहीं” भी
  rationale: दोनों शब्दों की पुनरावृत्ति मूल पाठ के अनुसार रखी गई है। ‘भी...भी’ विरोधी उत्तरों के एक साथ पाए जाने के आरोप को स्पष्ट करता है।
theological_decisions:
- issue: पौलुस के मुहावरे κατὰ σάρκα में σάρξ का अनुवाद
  choice: शरीर के अनुसार
  alternative: केवल मानवीय या सांसारिक ढंग से
  rationale: ‘शरीर’ पौलुस की शब्दावली और इसकी वास्तविक अर्थगत व्यापकता को सुरक्षित रखता है। अधिक व्याख्यात्मक अर्थ को मुख्य पाठ में निश्चित करने के बजाय पादटिप्पणी में रखा गया है।
- issue: ‘हाँ, हाँ’ और ‘नहीं, नहीं’ का संबंध
  choice: एक ही बात के लिए दोनों विरोधी उत्तर होने का भाव
  alternative: सिर्फ दोहरे कथन को बिना व्याख्यात्मक जोड़ के रखना
  rationale: यूनानी में दोनों संज्ञीकृत कथनों का साथ होना अस्थिरता या परस्पर विरोधी आश्वासन के आरोप को सूचित करता है। ‘एक ही बात के लिए’ निहित विरोध को हिन्दी में स्पष्ट करता है, जबकि प्रश्न का आलंकारिक स्वर बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। आलंकारिक दोनों प्रश्न और यूनानी पुनरुक्तियाँ सुरक्षित हैं। ‘चंचलता’ बदलते या अस्थिर इरादे का भाव देती है; ‘शरीर के अनुसार’ को व्याख्यात्मक रूप से समतल नहीं किया गया।
