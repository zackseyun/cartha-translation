  choice: हम क्लेश सहते हैं
  rationale: वर्तमान कर्मवाच्य रूप निरन्तर दबाव या संकट झेलने का भाव देता है; यह हिन्दी में स्वाभाविक है और प्रसंग की दुःख-सहन भाषा से मेल खाता है।
