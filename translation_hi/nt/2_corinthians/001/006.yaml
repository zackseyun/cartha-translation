  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: hi
  text: परन्तु यदि हम क्लेश सहते हैं[a], तो यह तुम्हारी सांत्वना और उद्धार के लिए है; और यदि हमें सांत्वना मिलती है, तो यह तुम्हारी सांत्वना[b] के लिए है—वह सांत्वना जो उन्हीं दुःखों को धीरज के साथ सहने में प्रभावी होती है जिन्हें हम भी सहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ हस्तलिपियों में ये शब्द नहीं हैं: “और यदि हमें सांत्वना मिलती है, तो यह तुम्हारी सांत्वना के लिए है।”'
    reason: textual_variant
