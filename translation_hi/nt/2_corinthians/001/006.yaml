  choice: शान्ति / हमें शान्ति मिलती है
  rationale: प्रसंग में यह शब्द दुःख के बीच सांत्वना और सामर्थ्य, दोनों का भाव रखता है। एक ही मूल अभिव्यक्ति से पद की शब्दगत एकता बनी रहती है; वैकल्पिक अर्थ फुटनोट में दिया गया है।
- source_word: σωτηρίας
  choice: उद्धार
  rationale: यह σωτηρία के व्यापक बचाने वाले अर्थ को सीधे और धर्मवैज्ञानिक रूप से तटस्थ ढंग से व्यक्त करता है।
- source_word: τῆς ἐνεργουμένης
  choice: प्रभावी होती है
  rationale: मध्य/कर्मवाच्य कृदन्त यहाँ सक्रिय प्रभावशीलता बताता है, केवल अस्तित्व नहीं।
- source_word: ἐν ὑπομονῇ
  choice: धीरज से सहने में
  rationale: यह ὑπομονή की दृढ़ सहनशीलता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और ἐν की साधन अथवा क्षेत्रगत अस्पष्टता को अत्यधिक निश्चित नहीं करता।
- source_word: τῶν αὐτῶν παθημάτων
  choice: उन्हीं दुःखों
  rationale: यह पौलुस और कुरिन्थियों द्वारा झेले जाने वाले समान दुःखों पर बल देता है।
- source_word: ὑπὲρ
  choice: के लिए
  rationale: दोनों उपवाक्यों में कुरिन्थियों के लाभ का भाव सरल और स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: παράκλησις का सांत्वना और प्रोत्साहन दोनों वाला अर्थ
  choice: मुख्य पाठ में “शान्ति”
  alternative: “प्रोत्साहन” या “सांत्वना”
  rationale: निकटवर्ती प्रसंग में दुःख के बीच दिलासा प्रमुख है, पर शब्द में सामर्थ्य देने का भाव भी है; इसलिए वैकल्पिक अर्थ फुटनोट में सुरक्षित रखा गया है।
- issue: ἐνεργουμένης ἐν ὑπομονῇ का सम्बन्ध
  choice: शान्ति उन्हीं दुःखों को धीरज से सहने में प्रभावी होती है
  alternative: शान्ति धीरज उत्पन्न करती है
  rationale: मूल पाठ शान्ति की प्रभावशीलता को धीरजपूर्वक सहने के क्षेत्र में रखता है; कारणात्मक अर्थ को उससे अधिक स्पष्ट नहीं किया गया जितना यूनानी कहता है।
