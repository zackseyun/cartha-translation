lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस के अभिवादन में यह शब्द कृपापूर्ण वरदान और ईश्वरीय कृपा—दोनों का भार रखता है; ‘अनुग्रह’ आधुनिक हिन्दी की बाइबलीय गरिमा में इसे अच्छी तरह व्यक्त करता है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: बहुवचन संबोधन का स्वाभाविक हिन्दी रूप; पत्र के पाठकों को सीधे संबोधित करता है।
- source_word: εἰρήνη
  choice: शान्ति
  rationale: यह स्थापित बाइबलीय अर्थ को बनाए रखता है, जिसमें केवल संघर्ष का अभाव नहीं बल्कि समग्र कुशलता भी निहित है।
- source_word: ἀπὸ
  choice: की ओर से
  rationale: यहाँ पूर्वसर्ग स्रोत बताता है; हिन्दी अभिवादन में ‘की ओर से’ स्वाभाविक है।
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: हमारे पिता परमेश्वर
  rationale: यूनानी पदबंध के संबंध को स्पष्ट और स्वाभाविक हिन्दी में रखता है, जहाँ परमेश्वर को ‘हमारे पिता’ कहा गया है।
- source_word: κυρίου
  choice: प्रभु
  rationale: यीशु के लिए प्रयुक्त इस उपाधि का मानक, गरिमापूर्ण और मसीही सन्दर्भ के अनुकूल हिन्दी रूप।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: ‘यीशु’ नाम को और Χριστός की मसीही उपाधि को हिन्दी की स्थापित अभिव्यक्ति में सुरक्षित रखता है; ‘मसीह’ का अर्थ अभिषिक्त जन है।
theological_decisions:
- issue: Χριστοῦ को पौलुस के अभिवादन में कैसे प्रस्तुत किया जाए
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: ‘मसीह’ आधुनिक हिन्दी बाइबल परम्परा में व्यापक रूप से समझा जाने वाला शीर्षक है और Χριστός के मसीही आशय को बनाए रखता है, जबकि व्याख्यात्मक विस्तार मुख्य पाठ पर नहीं थोपा जाता।
- issue: κυρίου का मसीह-संबंधी प्रयोग
  choice: प्रभु
  alternative: स्वामी
  rationale: आशीर्वाद-सूत्र में यह यीशु की उपाधि है। ‘प्रभु’ इसके धार्मिक और मसीह-संबंधी भार को ‘स्वामी’ की तुलना में अधिक स्वाभाविक रूप से व्यक्त करता है।
- issue: यूनानी वाक्य में निहित अभिवादनात्मक क्रिया
  choice: ‘मिले’ जोड़कर अभिवादन को पूर्ण हिन्दी वाक्य बनाना
  alternative: 'क्रियारहित रूप: ‘तुम्हें अनुग्रह और शान्ति’'
  rationale: मूल यूनानी में क्रिया निहित है। हिन्दी में ‘मिले’ अर्थ जोड़े बिना अभिवादन की कामना को स्वाभाविक और स्पष्ट बनाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। हिन्दी की स्वाभाविक शब्द-व्यवस्था के अनुसार स्रोत-वाक्यांश को पहले रखा गया है। ‘मिले’ मूल में निहित अभिवादनात्मक कामना को स्पष्ट करता है।
