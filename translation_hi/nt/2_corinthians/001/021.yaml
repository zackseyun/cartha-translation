  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: hi
  text: परन्तु जो हमें तुम्हारे साथ मसीह में दृढ़ करता है और जिसने हमारा अभिषेक किया, वह परमेश्वर है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βεβαιῶν
  choice: दृढ़ करता है
  rationale: वर्तमान कृदन्त का अर्थ किसी को स्थिर, पक्का या सुनिश्चित करने की निरन्तर क्रिया है; ‘दृढ़ करता है’ स्वाभाविक हिन्दी में इस अर्थ को सुरक्षित रखता है।
- source_word: σὺν ὑμῖν
  choice: तुम्हारे साथ
  rationale: यह पौलुस और कुरिन्थियों की साझा सहभागिता को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: εἰς Χριστόν
  choice: मसीह में
  rationale: εἰς का मूल दिशात्मक भाव ‘की ओर/में’ हो सकता है, पर यहाँ पौलुसी प्रयोग में मसीह से सम्बन्ध और उसमें स्थिर किए जाने का भाव है; ‘मसीह में’ स्वाभाविक हिन्दी है और वाक्यांश को अनावश्यक रूप से व्याख्यायित नहीं करता।
- source_word: χρίσας
  choice: अभिषेक किया
  rationale: यह χρίω के अभिषेक-संबंधी मूल अर्थ और Χριστός के साथ उसकी शब्दगत प्रतिध्वनि को बनाए रखता है।
- source_word: θεός
  choice: परमेश्वर
  rationale: हिन्दी बाइबलीय प्रयोग में θεός के लिए सहज और गरिमापूर्ण पद; वाक्य के अंत में रखकर यूनानी के बलाघात को भी यथासम्भव सुरक्षित रखा गया है।
- source_word: Χριστόν
  choice: मसीह
  rationale: Χριστός यहाँ उपाधि के रूप में है; ‘मसीह’ उसके यहूदी-मसीही और अभिषिक्त जन के भाव को सुरक्षित रखता है।
theological_decisions:
- issue: εἰς Χριστόν का सम्बन्धसूचक अथवा दिशात्मक बल
  choice: ‘मसीह में’—सम्बन्ध/सहभागिता का भाव
  alternative: ‘मसीह की ओर’ अथवा अधिक शाब्दिक ‘मसीह में प्रवेश के लिए’
  rationale: सन्दर्भ में परमेश्वर विश्वासियों को मसीह के सम्बन्ध में दृढ़ करता है। ‘मसीह में’ पौलुसी वाक्य-प्रयोग के अनुकूल है, जबकि अधिक दिशात्मक अनुवाद हिन्दी में ऐसा निश्चित अर्थ जोड़ सकता है जिसे यूनानी यहाँ स्पष्ट नहीं करता।
- issue: χρίσας में अभिषेक का स्वरूप
  choice: सामान्य रूप से ‘अभिषेक किया’
  alternative: ‘सेवा के लिए ठहराया’ या ‘पवित्र आत्मा से अभिषेक किया’
  rationale: पद स्वयं अभिषेक के साधन या विशिष्ट उद्देश्य को नहीं बताता; इसलिए उसे स्पष्ट करके कोई संप्रदायगत या प्रसंग से अधिक संकीर्ण अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘परन्तु’ δέ के हल्के विरोध/संक्रमण को व्यक्त करता है। वाक्य-क्रम में ‘वह परमेश्वर है’ रखकर यूनानी में अन्तस्थ θεός के बल को बनाए रखा गया है।
