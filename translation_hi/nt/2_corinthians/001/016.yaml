translation_notes:
  register: आधुनिक मानक हिन्दी में विनम्र बहुवचन ‘आप’ रखा गया है। पद पिछले वाक्य की निरंतरता है, इसलिए आरम्भ में ‘और’ सुरक्षित रखा गया है। शैली सहज किंतु गरिमापूर्ण है; यात्रा-सहायता का संभावित निहितार्थ मुख्य पाठ में अत्यधिक स्पष्ट किए बिना पादटिप्पणी में संरक्षित है।
