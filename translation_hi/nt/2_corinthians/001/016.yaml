source:
  edition: SBLGNT
  text: καὶ δι’ ὑμῶν διελθεῖν εἰς Μακεδονίαν, καὶ πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι εἰς τὴν Ἰουδαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: hi
  text: और आपके यहाँ से होकर मकिदुनिया जाऊँ, फिर मकिदुनिया से आपके पास आऊँ और आपके द्वारा यहूदिया के लिए आगे भेजा जाऊँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया की यात्रा के लिए आपकी सहायता पाकर रवाना किया जाऊँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: आपके यहाँ से होकर
  rationale: διά के साथ संबंधकारक यहाँ यात्रा-मार्ग का भाव देता है—पौलुस कुरिन्थियों के नगर से होकर आगे जाना चाहता था। यह अभिव्यक्ति हिन्दी में स्वाभाविक रूप से उस मार्ग-सूचक अर्थ को प्रकट करती है।
- source_word: διελθεῖν
  choice: जाऊँ
  rationale: क्रिया का मूल भाव होकर निकलने या आगे यात्रा करने का है। ‘आपके यहाँ से होकर’ के साथ ‘जाऊँ’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक दोहराव से बचता है।
- source_word: εἰς Μακεδονίαν
  choice: मकिदुनिया
  rationale: εἰς गंतव्य और भीतर की ओर गति बताता है; हिन्दी में स्थान के साथ ‘मकिदुनिया जाऊँ’ वही अर्थ स्वाभाविक ढंग से देता है।
- source_word: πάλιν
  choice: फिर
  rationale: यह नियोजित यात्रा के अगले, लौटकर आने वाले चरण को स्पष्ट करता है।
- source_word: ἀπὸ Μακεδονίας
  choice: मकिदुनिया से
  rationale: ἀπό के साथ संबंधकारक प्रस्थान या उद्गम का बोध कराता है।
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: आपके पास आऊँ
  rationale: यह पौलुस के कुरिन्थियों के पास आने की योजना को सीधे व्यक्त करता है। यूनानी में ‘वापस’ अलग से नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: ὑφ’ ὑμῶν
  choice: आपके द्वारा
  rationale: ὑπό के साथ संबंधकारक कर्ता या माध्यम बताता है; इससे आगे विदा करने में कुरिन्थियों की सक्रिय भूमिका बनी रहती है।
- source_word: προπεμφθῆναι
  choice: विदा किया जाऊँ
  rationale: यात्रा-संदर्भ में προπέμπω किसी यात्री को आगे की यात्रा के लिए विदा करने, प्रायः आवश्यक सहायता देकर रवाना करने, का अर्थ रखता है। मुख्य पाठ संक्षिप्त रखा गया है और सहायता का स्पष्टतर भाव पादटिप्पणी में दिया गया है।
- source_word: εἰς τὴν Ἰουδαίαν
  choice: यहूदिया के लिए
  rationale: यह पौलुस की आगे की यात्रा का गंतव्य सहज हिन्दी में व्यक्त करता है।
