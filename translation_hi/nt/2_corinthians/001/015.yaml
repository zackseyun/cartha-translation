  text: Καὶ ταύτῃ τῇ πεποιθήσει ἐβουλόμην ⸂πρότερον πρὸς ὑμᾶς ἐλθεῖν⸃, ἵνα δευτέραν ⸀χάριν ⸀σχῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/015.yaml
  text: And with this confidence I intended to come to you first[a], so that you might have a second benefit[b],
translation:
  language: hi
  text: और इसी भरोसे के साथ मैं पहले आपके पास आना चाहता था[a], ताकि आपको दूसरा लाभ मिले[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपके पास इससे पहले आना चाहता था।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “दूसरा अनुग्रह”; या “दूसरी कृपा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθήσει
  choice: भरोसे
  rationale: यहाँ πεποίθησις पौलुस के उस दृढ़ विश्वास या आश्वस्तता को व्यक्त करता है जिसके आधार पर उसने यात्रा का इरादा किया था। आधुनिक हिन्दी में “भरोसा” स्वाभाविक और स्पष्ट है।
- source_word: ἐβουλόμην
  choice: आना चाहता था
  rationale: βούλομαι इच्छा और अभिप्राय दोनों व्यक्त कर सकता है। “चाहता था” पौलुस के वास्तविक इरादे को सहज हिन्दी में रखता है, पर इसे अटल औपचारिक योजना नहीं बनाता।
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: पहले आपके पास आना
  rationale: πρότερον यात्रा-क्रम में प्राथमिकता (“पहले”) या समय की दृष्टि से पहले आने का भाव दे सकता है। मुख्य पाठ में “पहले” अगले पद के यात्रा-विवरण से स्वाभाविक रूप से जुड़ता है।
- source_word: δευτέραν χάριν
  choice: दूसरा लाभ
  rationale: इस यात्रा-संदर्भ में χάρις पौलुस की भेंट से मिलनेवाली कृपा, भलाई या लाभ को सूचित करता है। “लाभ” प्रसंग स्पष्ट करता है, जबकि पादटिप्पणी “अनुग्रह/कृपा” की अधिक शाब्दिक संभावना सुरक्षित रखती है।
- source_word: σχῆτε
  choice: आपको … मिले
  rationale: ἔχω का यह रूप यहाँ किसी लाभ को पाने या प्राप्त होने के अर्थ में है। हिन्दी में “आपको … मिले” “आपके पास हो” की तुलना में अधिक स्वाभाविक है।
theological_decisions:
- issue: χάρις का अर्थ
  choice: मुख्य पाठ में “लाभ”
  alternative: “अनुग्रह” या “कृपा”
  rationale: यात्रा के तात्कालिक संदर्भ में किसी दूसरी भेंट से मिलनेवाली भलाई प्रमुख है; फिर भी धार्मिक अर्थवाला “अनुग्रह” पूरी तरह असंभव नहीं है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “इसी भरोसे के साथ” पिछले कथन से संबंध बनाए रखता है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
