source:
  edition: SBLGNT
  text: καὶ ἡ ἐλπὶς ἡμῶν βεβαία ὑπὲρ ⸀ὑμῶν· εἰδότες ὅτι ⸀ὡς κοινωνοί ἐστε τῶν παθημάτων, οὕτως καὶ τῆς παρακλήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: hi
  text: और तुम्हारे विषय में हमारी आशा दृढ़ है, क्योंकि हम जानते हैं कि जैसे तुम दुखों के सहभागी हो, वैसे ही सांत्वना[a] के भी सहभागी हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सांत्वना’ के स्थान पर ‘प्रोत्साहन’ या ‘ढाढ़स’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίς
  choice: आशा
  rationale: ‘आशा’ अपेक्षा और भरोसे—दोनों भावों को स्वाभाविक और पारदर्शी ढंग से व्यक्त करती है।
- source_word: βεβαία
  choice: दृढ़
  rationale: यह पौलुस की आशा के स्थिर और सुनिश्चित होने का भाव व्यक्त करता है।
- source_word: ὑπὲρ ὑμῶν
  choice: तुम्हारे विषय में
  rationale: यहाँ वाक्यांश कुरिन्थियों के संबंध में पौलुस की आशा को दर्शाता है; ‘तुम्हारे विषय में’ हिंदी में स्पष्ट है और ‘तुम्हारे लिए’ से उत्पन्न संभावित उद्देश्यगत अर्थ से बचाता है।
- source_word: εἰδότες
  choice: क्योंकि हम जानते हैं
  rationale: कृदंत आशा के दृढ़ होने का आधार बताता है; कारणसूचक रूप हिंदी में संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ὡς ... οὕτως καί
  choice: जैसे ... वैसे ही ... भी
  rationale: यह यूनानी की सहसंबंधी संरचना और दोनों प्रकार की सहभागिता के समानांतर संबंध को बनाए रखता है।
- source_word: κοινωνοί
  choice: सहभागी हो
  rationale: संज्ञा का अर्थ भागीदारी है; हिंदी में ‘सहभागी हो’ दोनों खंडों में स्वाभाविक और संक्षिप्त है।
- source_word: παθημάτων
  choice: दुखों
  rationale: संदर्भ में यह व्यापक रूप से झेली गई पीड़ाओं और कष्टों को व्यक्त करता है तथा सामान्य पाठक के लिए सहज है।
- source_word: παρακλήσεως
  choice: सांत्वना
  rationale: निकटवर्ती संदर्भ में यह दुख के बीच मिलने वाली ढाढ़स और दिलासे को व्यक्त करता है; ‘सांत्वना’ उस प्रमुख भाव को बनाए रखती है।
- source_word: '[elliptical second clause]'
  choice: सहभागी हो
  rationale: दूसरे खंड में यूनानी क्रिया को दोहराता नहीं है, पर हिंदी में अर्थ की स्पष्टता के लिए पहले खंड का विधेय स्वाभाविक रूप से पूरा किया गया है।
theological_decisions:
- issue: παράκλησις का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘सांत्वना’
  alternative: ‘प्रोत्साहन’ या ‘ढाढ़स’
  rationale: इस अध्याय में दुखों के बीच परमेश्वर से मिलने वाले दिलासे का संदर्भ प्रमुख है, पर शब्द प्रोत्साहन का भाव भी रख सकता है; इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और स्वाभाविक रूप अपनाया गया है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। यूनानी की समानांतर संरचना को बनाए रखते हुए अनावश्यक व्याख्या नहीं जोड़ी गई।
