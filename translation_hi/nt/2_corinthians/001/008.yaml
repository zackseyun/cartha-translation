reference: 2 Corinthians 1:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: hi
  text: क्योंकि, भाइयो,[a] हम नहीं चाहते कि तुम उस संकट के विषय में अनजान रहो जो हमें आसिया[b] में सहना पड़ा, कि हम अपनी सामर्थ्य से भी बढ़कर इतने दब गए थे कि जीते रहने की भी आशा छोड़ दी थी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भाइयो” यूनानी के व्याकरणतः पुल्लिंग बहुवचन ἀδελφοί का अनुवाद है; इस प्रसंग में सम्भवतः समूचे विश्वासी समुदाय, अर्थात स्त्री और पुरुष दोनों, सम्बोधित हैं।
    reason: cultural_note
  - marker: b
    text: “आसिया” से आशय आधुनिक एशिया महाद्वीप नहीं, बल्कि पश्चिमी एशिया माइनर में स्थित रोमी प्रान्त है।
    reason: cultural_note
  - marker: c
    text: या, “यहाँ तक कि हम अपने जीवन के विषय में भी पूरी तरह निराश हो गए थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλομεν ... ἀγνοεῖν
  choice: हम नहीं चाहते कि तुम ... से अनजान रहो
  rationale: यूनानी के वर्तमानकालीन इच्छासूचक कथन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और ἀγνοεῖν का अर्थ बिना अनावश्यक नकारात्मक भाव के सुरक्षित रखता है।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: सम्बोधन में प्रयुक्त व्याकरणतः पुल्लिंग बहुवचन का औपचारिक रूप सुरक्षित है; समुदाय-समावेशी प्रयोग को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ὑπὲρ τῆς θλίψεως ἡμῶν τῆς γενομένης ἐν τῇ Ἀσίᾳ
  choice: उस क्लेश से ... जो आसिया में हम पर पड़ा
  rationale: θλῖψις की गंभीरता के लिए ‘क्लेश’ उपयुक्त है। γενομένης का शाब्दिक अर्थ ‘हुआ’ है, पर प्रसंगानुकूल ‘हम पर पड़ा’ हिन्दी में स्वाभाविक रूप से उस अनुभव को व्यक्त करता है।
- source_word: καθ’ ὑπερβολὴν ὑπὲρ δύναμιν ἐβαρήθημεν
  choice: हम अपनी सामर्थ्य से परे, अत्यन्त बोझ से दब गए थे
  rationale: ἐβαρήθημεν के भार-दबाव के बिंब को बनाए रखते हुए καθ’ ὑπερβολὴν और ὑπὲρ δύναμιν—अत्यधिक मात्रा तथा क्षमता से परे होने—दोनों को अलग-अलग व्यक्त करता है।
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν
  choice: यहाँ तक कि हमने जीवित रहने की भी आशा छोड़ दी थी
  rationale: ὥστε परिणाम बताता है और ἐξαπορέομαι यहाँ चरम निराशा को व्यक्त करता है। यह अनुवाद καὶ τοῦ ζῆν को ‘जीवित रहने’ के रूप में स्पष्ट और स्वाभाविक रखता है।
theological_decisions:
- issue: पत्रीय सम्बोधन ἀδελφοί का लिंग-संबंधी रूप
  choice: हे भाइयो
  alternative: हे भाई-बहनो
  rationale: मुख्य पाठ में यूनानी का व्याकरणतः पुल्लिंग रूप रखा गया है, जबकि मिश्रित विश्वासी समुदाय को सम्भावित समावेशी सम्बोधन पादटिप्पणी में बताया गया है; इस प्रकार स्रोत-रूप और प्रसंगगत बल दोनों सुरक्षित रहते हैं।
- issue: ἐξαπορηθῆναι καὶ τοῦ ζῆν की निराशा का स्वरूप
  choice: हमने जीवित रहने की भी आशा छोड़ दी थी
  alternative: हम अपने जीवन के विषय में भी पूरी तरह निराश हो गए थे
  rationale: यह कथन पौलुस की अनुभूत चरम निराशा को व्यक्त करता है, न कि आत्महत्या की इच्छा या जीवन के विषय में कोई सैद्धान्तिक निष्कर्ष; इसलिए पाठ से अधिक अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज रूप अपनाया गया है। ‘आसिया’ को प्राचीन रोमी प्रान्त के विशिष्ट नाम के रूप में रखा गया है और पादटिप्पणी से आधुनिक महाद्वीप से उसका भेद स्पष्ट किया गया है।
