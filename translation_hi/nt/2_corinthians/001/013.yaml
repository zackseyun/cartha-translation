  text: क्योंकि हम तुम्हें वही लिख रहे हैं जो तुम पढ़ते और समझते भी हो; और मुझे आशा है कि तुम अन्त तक समझोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरी तरह समझोगे।”
    reason: ἕως τέλους का अर्थ यहाँ कालगत ‘अन्त तक’ अथवा पूर्णता-सूचक ‘पूरी तरह’ समझा जा सकता है।
lexical_decisions:
- source_word: ἄλλα
  choice: और कुछ
  rationale: नकारात्मक वाक्य में यह स्वाभाविक हिन्दी है और किसी भिन्न या छिपी हुई बात को लिखने का निषेध बनाए रखती है।
- source_word: ἀναγινώσκετε
  choice: तुम पढ़ते
  rationale: साधारण वर्तमान काल यूनानी क्रिया के सामान्य वर्तमान भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐπιγινώσκετε
  choice: समझते भी हो
  rationale: यहाँ पढ़ने के साथ आशय ग्रहण करने की बात है; ‘भी’ καί को और ‘समझते’ प्रसंगानुकूल अर्थ को व्यक्त करता है।
- source_word: ἐπιγνώσεσθε
  choice: समझते रहोगे
  rationale: भविष्यकाल को व्यक्त करते हुए यह ἕως τέλους के कालगत अर्थ के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: ἕως τέλους
  choice: अन्त तक
  rationale: यह यूनानी पदबंध का सीधा कालगत अर्थ सुरक्षित रखता है और सम्भावित ‘पूरी तरह’ अर्थ को मुख्य पाठ में आरोपित नहीं करता।
- source_word: οὐ γὰρ ... ἀλλ’ ἢ
  choice: क्योंकि ... और कुछ नहीं ... बल्कि वही
  rationale: यह संरचना यूनानी निषेध और अपवाद दोनों को स्वाभाविक हिन्दी में बनाए रखती है।
