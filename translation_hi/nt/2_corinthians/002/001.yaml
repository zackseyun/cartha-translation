  text: ἔκρινα ⸀γὰρ ἐμαυτῷ τοῦτο, τὸ μὴ πάλιν ἐν λύπῃ πρὸς ὑμᾶς ἐλθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/001.yaml
  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: hi
  text: क्योंकि मैंने अपने मन में यह निश्चय किया कि मैं फिर दुःख में[a] तुम्हारे पास न आऊँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दुःख के साथ।’
    reason: ἐν λύπῃ का अर्थ पौलुस की दुःखपूर्ण अवस्था अथवा दुःख से चिह्नित भेंट—दोनों रूपों में समझा जा सकता है; वैकल्पिक अनुवाद इस वास्तविक अर्थगत विस्तार को सुरक्षित रखता है।
lexical_decisions:
- source_word: ἔκρινα
  choice: निश्चय किया
  rationale: यहाँ κρίνω का भूतकालिक रूप सोच-विचार के बाद किए गए दृढ़ व्यक्तिगत निर्णय को व्यक्त करता है; ‘निश्चय किया’ आधुनिक हिन्दी में स्वाभाविक है और इस दृढ़ता को बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐμαυτῷ
  choice: अपने मन में
  rationale: यह आत्मवाचक दत्तिवाचक रूप पौलुस के भीतर किए गए व्यक्तिगत निर्णय को दर्शाता है; ‘अपने मन में’ हिन्दी में स्वाभाविक है और जानबूझकर किए गए आत्मगत निश्चय का भाव रखता है।
- source_word: τοῦτο
  choice: यह
  rationale: यह संकेतवाचक शब्द आगे आने वाले अनन्तक्रियात्मक कथन की ओर संकेत करता है; ‘यह’ मूल संरचना और अग्रसूचक बल को बनाए रखता है।
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: कि मैं ... न आऊँ
  rationale: सव्यय अनन्तक्रिया निर्णय की विषयवस्तु बताती है। हिन्दी में ‘कि मैं ... न आऊँ’ इसी अर्थ का सबसे स्वाभाविक रूप है।
- source_word: πάλιν
  choice: फिर
  rationale: πάλιν पुनरावृत्ति व्यक्त करता है; ‘फिर’ सरल और प्रचलित हिन्दी समतुल्य है।
- source_word: ἐν λύπῃ
  choice: दुःख में
  rationale: λύπη दुःख, शोक या मानसिक पीड़ा को दर्शाता है। ‘दुःख में’ ἐν की संरचना को निकटता से बनाए रखते हुए यह खुला छोड़ता है कि दुःख मुख्यतः पौलुस की अवस्था है या भेंट की परिस्थिति।
- source_word: πρὸς ὑμᾶς
  choice: तुम्हारे पास
  rationale: आने की क्रिया के साथ πρός व्यक्तियों की ओर गति व्यक्त करता है; हिन्दी में ‘तुम्हारे पास’ स्वाभाविक प्रयोग है।
