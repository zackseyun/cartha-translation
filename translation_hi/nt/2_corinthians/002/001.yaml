translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तुम्हारे’ पौलुस के समुदाय से सीधे और बहुवचन संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है। वाक्य मूल यूनानी की कारणसूचक कड़ी और निर्णय की विषयवस्तु को बनाए रखते हुए हिन्दी वाक्य-विन्यास के अनुरूप है।
