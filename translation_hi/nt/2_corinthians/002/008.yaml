translation:
  language: hi
  text: इसलिए मैं तुमसे आग्रह करता हूँ कि तुम उसके प्रति अपने प्रेम की पुष्टि करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διό
  choice: इसलिए
  rationale: यह पिछले कथन के आधार पर निकले निष्कर्ष या आग्रह को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: παρακαλῶ ὑμᾶς
  choice: मैं तुमसे आग्रह करता हूँ
  rationale: παρακαλέω यहाँ विनती या प्रोत्साहन के अर्थ में है; संदर्भ में ‘आग्रह करता हूँ’ उसके बल को आधुनिक मानक हिन्दी में ठीक प्रकार व्यक्त करता है।
- source_word: κυρῶσαι
  choice: पुष्टि करो
  rationale: κυρόω का अर्थ किसी बात को मान्य, दृढ़ या प्रमाणित करना है। ‘पुष्टि करो’ प्रेम को फिर से उत्पन्न करने के बजाय उसे प्रत्यक्ष और सुनिश्चित करने का भाव बनाए रखता है।
- source_word: εἰς αὐτὸν ἀγάπην
  choice: उसके प्रति अपने प्रेम
  rationale: εἰς αὐτόν प्रेम की दिशा, अर्थात ‘उसके प्रति’, बताता है। हिन्दी में संबंध स्पष्ट करने के लिए ‘अपने’ स्वाभाविक रूप से जोड़ा गया है।
