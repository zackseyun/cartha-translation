  text: ऐसे व्यक्ति के लिए बहुमत द्वारा दिया गया यह दण्ड पर्याप्त है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऐसे व्यक्ति के लिए अधिकांश लोगों द्वारा लगाया गया यह दण्ड पर्याप्त है।”
    reason: ‘बहुमत’ के स्थान पर यूनानी वाक्यांश का अधिक शब्दशः अर्थ ‘अधिकांश लोग’ हो सकता है; साथ ही दण्ड को ‘लगाया गया’ कहना निहित क्रिया को स्पष्ट करता है।
lexical_decisions:
- source_word: ἱκανὸν
  choice: पर्याप्त
  rationale: यह पद में विधेय का भाव व्यक्त करता है और बताता है कि अनुशासनात्मक कार्रवाई उचित मात्रा तक पहुँच चुकी है।
- source_word: τῷ τοιούτῳ
  choice: ऐसे व्यक्ति के लिए
  rationale: यह प्रसंग में एक विशिष्ट अपराधी की ओर संकेत करता है। ‘व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी अभिव्यक्ति को अनावश्यक रूप से कठोर या अपमानजनक नहीं बनाता।
- source_word: ἐπιτιμία
  choice: दण्ड
  rationale: यह समुदाय द्वारा लगाए गए ठोस अनुशासनात्मक प्रतिबन्ध या दण्ड को दर्शाता है; केवल मौखिक ‘फटकार’ यहाँ संभवतः बहुत कमजोर अर्थ देती।
- source_word: ἡ ὑπὸ τῶν πλειόνων
  choice: बहुमत द्वारा दिया गया
  rationale: οἱ πλείονες समुदाय के बड़े भाग या बहुमत को सूचित करता है। ‘दिया गया’ जोड़ने से हिन्दी में दण्ड और कर्ता का सम्बन्ध स्पष्ट एवं स्वाभाविक होता है।
