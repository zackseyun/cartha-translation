source:
  edition: SBLGNT
  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: hi
  text: परन्तु परमेश्वर का धन्यवाद हो, जो हमें सदा मसीह में अपने विजयी जुलूस में ले चलता है[a] और हमारे द्वारा हर जगह उसके विषय में ज्ञान की सुगंध फैलाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मसीह में हम पर सदा विजय पाता है।”
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: धन्यवाद हो
  rationale: Τῷ δὲ θεῷ χάρις एक धन्यवादसूचक स्तुतिपरक अभिव्यक्ति है; आधुनिक हिन्दी में “परमेश्वर का धन्यवाद हो” इसका स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: θριαμβεύοντι
  choice: अपनी विजय-यात्रा में लिए चलता है
  rationale: यह शब्द प्राचीन विजय-जुलूस की ठोस छवि व्यक्त करता है। “लिए चलता है” ἡμᾶς को कर्म बनाए रखता है और केवल सामान्य विजय का अर्थ देने से बचता है। किसी पर विजय पाने का सम्भव अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐν τῷ Χριστῷ
  choice: मसीह में
  rationale: यहाँ Χριστός पदवी के रूप में है और वाक्यांश मसीह से सम्बन्धित क्षेत्र या एकता को व्यक्त करता है।
- source_word: ὀσμὴν
  choice: सुगंध
  rationale: आगे के सन्दर्भ में रूपक सकारात्मक है; “सुगंध” आधुनिक हिन्दी में स्वाभाविक है और गन्ध की छवि बनाए रखता है।
- source_word: γνώσεως αὐτοῦ
  choice: उसके विषय में ज्ञान
  rationale: यह रूप परमेश्वर के बारे में ज्ञान को स्पष्ट करता है और αὐτοῦ के वस्तुवाचक सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φανεροῦντι
  choice: फैलाता है
  rationale: सुगंध के साथ “फैलाता है” हिन्दी में स्वाभाविक है और उस ज्ञान को सर्वत्र प्रत्यक्ष या ज्ञात कराने का भाव सन्दर्भानुसार व्यक्त करता है।
- source_word: δι’ ἡμῶν
  choice: हमारे द्वारा
  rationale: διά के सम्बन्धकारक प्रयोग में साधन या माध्यम का भाव है, जिसे “हमारे द्वारा” स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐν παντὶ τόπῳ
  choice: हर जगह
  rationale: यह मूल के सार्वत्रिक बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: θριαμβεύω के साथ ἡμᾶς को कर्म मानने का आशय
  choice: परमेश्वर मसीह में हमें अपनी विजय-यात्रा में लिए चलता है।
  alternative: परमेश्वर मसीह में हम पर सदा विजय पाता है।
  rationale: मुख्य पाठ विजय-जुलूस की सजीव छवि और अगले सुगंध-रूपक के साथ उसका सम्बन्ध बनाए रखता है। फिर भी क्रिया में विजेता द्वारा बंदियों पर विजय पाने का भाव सम्भव है, इसलिए उस तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किन्तु गरिमापूर्ण रखी गई है। “विजय-यात्रा” प्राचीन विजयोत्सवी जुलूस की छवि देता है, जबकि “सुगंध फैलाता है” हिन्दी में रूपक को स्वाभाविक बनाता है।
