id: 2CO.2.3
reference: 2 Corinthians 2:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: hi
  text: और मैंने यही बात इसलिए लिखी कि जब मैं आऊँ, तो मुझे उन लोगों से दुःख न मिले, जिनसे मुझे आनन्द मिलना चाहिए था;[a] क्योंकि मुझे तुम सब पर यह भरोसा था कि मेरा आनन्द तुम सबका भी आनन्द है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “उन लोगों से, जिनसे मुझे आनन्दित होना चाहिए था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: मैंने ... लिखी
  rationale: अओरिस्ट को प्रसंग में पौलुस के पहले लिखे पत्र की ओर संकेत करने वाले सामान्य भूतकाल के रूप में व्यक्त किया गया है।
- source_word: τοῦτο αὐτὸ
  choice: यही बात
  rationale: यह सहज आधुनिक हिन्दी में मूल पदबंध के बलाघात को बनाए रखता है।
- source_word: ἵνα μὴ ἐλθὼν λύπην σχῶ
  choice: इसलिए ... कि जब मैं आऊँ, तो मुझे ... दुःख न मिले
  rationale: उद्देश्यसूचक ἵνα और निषेध सहित संभाव्य क्रिया का स्वाभाविक हिन्दी रूप है।
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: उन लोगों से ... जिनसे मुझे आनन्द मिलना चाहिए था
  rationale: 'यह संबंधसूचक अर्थ को बनाए रखता है: जिन लोगों को पौलुस के लिए दुःख नहीं, बल्कि आनन्द का स्रोत होना चाहिए था।'
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: क्योंकि मुझे तुम सब पर यह भरोसा था
  rationale: पूर्णकालिक कृदन्त पौलुस के स्थिर भरोसे को दर्शाता है। प्रसंग में इसका कारणसूचक संबंध स्वाभाविक हिन्दी में स्पष्ट किया गया है, यद्यपि यूनानी में यह संबंध कृदन्त के कारण कुछ खुला है।
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: मेरा आनन्द तुम सबका भी आनन्द है
  rationale: यह मूल की समान्तर संरचना और पौलुस तथा कुरिन्थियों के साझा आनन्द—दोनों को सहज रूप में व्यक्त करता है।
theological_decisions:
- issue: πεποιθὼς कृदन्त का पिछले वाक्य से संबंध
  choice: 'कारणसूचक: “क्योंकि मुझे ... भरोसा था”'
  alternative: 'सहगामी भाव: “यह भरोसा रखते हुए”'
  rationale: प्रसंग कारणसूचक अर्थ का समर्थन करता है, पर यह कोई विशिष्ट धर्मसैद्धान्तिक निष्कर्ष नहीं है; यूनानी कृदन्त स्वयं संबंध को पूर्णतः निर्दिष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध। “आनन्द” और “दुःख” का चयन पूरे वाक्य में भावात्मक विरोध को स्पष्ट रखता है।
