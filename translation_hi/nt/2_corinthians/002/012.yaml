source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: hi
  text: जब मैं मसीह के सुसमाचार के लिए त्रोआस पहुँचा और प्रभु में मेरे लिए एक द्वार खोला गया था[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और प्रभु में मेरे लिए एक द्वार खुला हुआ था।”
    reason: पूर्णकालिक कर्मवाच्य रूप को परिणामस्वरूप बनी अवस्था पर बल देते हुए भी समझा जा सकता है।
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: जब मैं … पहुँचा
  rationale: अओरिस्ट कृदन्त को प्रसंगानुसार कालवाचक उपवाक्य बनाया गया है। δέ यहाँ हल्का संक्रमण सूचित करता है; हिंदी में अलग संयोजक जोड़ने के बजाय वाक्य-प्रवाह से यह संबंध स्वाभाविक रूप से व्यक्त होता है।
- source_word: εἰς τὴν Τρῳάδα
  choice: त्रोआस पहुँचा
  rationale: स्थान की ओर गति को आधुनिक हिंदी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: मसीह के सुसमाचार के लिए
  rationale: दूसरे εἰς का प्रयोजनात्मक अर्थ रखा गया है और मूल में स्पष्ट रूप से न होने के कारण ‘सुनाने’ नहीं जोड़ा गया। संबंधकारक τοῦ Χριστοῦ की व्यापकता भी बनी रहती है।
- source_word: θύρας
  choice: एक द्वार
  rationale: सुअवसर का भाव प्रसंग में निहित है, पर पौलुस का सजीव रूपक बनाए रखने के लिए ‘द्वार’ रखा गया है।
- source_word: ἀνεῳγμένης
  choice: खोला गया था
  rationale: पूर्णकालिक कर्मवाच्य कृदन्त पहले हुए कार्य और उससे बनी स्थिति, दोनों की ओर संकेत करता है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: पौलुस की विशिष्ट अभिव्यक्ति और ἐν की संभावित अर्थ-व्याप्ति को संकीर्ण किए बिना सुरक्षित रखता है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός पदवीगत अर्थ रखता है। ‘मसीह’ आधुनिक हिंदी बाइबलीय प्रयोग में अभिषिक्त राजा की पदवी को स्वाभाविक रूप से व्यक्त करता है।
- issue: ἐν κυρίῳ का संबंध
  choice: प्रभु में
  alternative: प्रभु के द्वारा
  rationale: ‘प्रभु में’ मूल की धार्मिक और संबंधपरक व्यापकता बनाए रखता है; ‘प्रभु के द्वारा’ केवल करणार्थक व्याख्या को निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद मूल यूनानी की तरह अगले पद में पूरा होने वाले वाक्य का आरंभ है, इसलिए अंत में अल्पविराम रखा गया है।
