reference: 2 Corinthians 2:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: hi
  text: तुम जिस किसी को किसी बात के लिए क्षमा करते हो, उसे मैं भी क्षमा करता हूँ। क्योंकि मैंने जो कुछ क्षमा किया है—यदि मैंने कुछ क्षमा किया है—उसे तुम्हारी खातिर मसीह की उपस्थिति में क्षमा किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαρίζεσθε / κεχάρισμαι
  choice: क्षमा करते हो / क्षमा किया है
  rationale: इस अनुशासन और पुनर्स्थापना के प्रसंग में क्रिया का अर्थ किसी अपराध को छोड़ देना या क्षमा करना है; ‘क्षमा’ आधुनिक हिन्दी में इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ᾧ ... τι
  choice: जिस किसी को किसी बात के लिए
  rationale: सम्बन्धवाचक सर्वनाम क्षमा पाने वाले व्यक्ति की ओर संकेत करता है, जबकि अनिश्चयवाचक τι बात या अपराध का खुला दायरा बनाए रखता है।
- source_word: κἀγώ
  choice: उसे मैं भी क्षमा करता हूँ
  rationale: संक्षिप्त यूनानी पद का उत्तरात्मक भाव ‘मैं भी’ से स्पष्ट होता है; हिन्दी में कर्म को दोहराने से वाक्य सहज बनता है।
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: मैंने जो कुछ क्षमा किया है—यदि मैंने कुछ क्षमा किया है—
  rationale: यह पौलुस की आत्मसंयत, शर्तसूचक और कुछ हद तक कोष्ठकीय अभिव्यक्ति को बिना समतल किए सुरक्षित रखता है।
- source_word: δι’ ὑμᾶς
  choice: तुम्हारी खातिर
  rationale: διά के साथ कर्मकारक यहाँ कुरिन्थियों के लाभ या हित को व्यक्त करता है; ‘तुम्हारी खातिर’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: मसीह की उपस्थिति में
  rationale: πρόσωπον का अर्थ मुख, उपस्थिति या व्यक्ति हो सकता है। मुख्य पाठ में ‘उपस्थिति में’ मसीह के सम्मुख और उनकी दृष्टि में किए गए कार्य का गंभीर भाव देता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यहाँ Χριστός का पदवीगत अर्थ सक्रिय है; ‘मसीह’ हिन्दी में स्थापित और स्वाभाविक पदवी है।
theological_decisions:
- issue: ἐν προσώπῳ Χριστοῦ का अर्थ मसीह की उपस्थिति में है या मसीह के व्यक्ति में।
  choice: मसीह की उपस्थिति में
  alternative: मसीह के व्यक्ति में
  rationale: प्रसंग पौलुस के क्षमा करने को मसीह के सम्मुख किया गया कार्य समझने की अनुमति देता है, पर यूनानी पद में ‘व्यक्ति’ का अर्थ भी सम्भव है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: Χριστοῦ को पदवी के रूप में अनूदित करना या नाम-जैसे पारम्परिक रूप में रखना।
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस पत्रात्मक प्रसंग में भी Χριστός की पदवीगत पहचान बनी हुई है; ‘मसीह’ आधुनिक मानक हिन्दी में इसका स्थापित अनुवाद है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पुनरुक्ति और शर्तसूचक वाक्यांश को मूल यूनानी की अलंकारिक बनावट तथा वास्तविक अस्पष्टता बनाए रखने के लिए सुरक्षित रखा गया है।
