  text: ὅτι Χριστοῦ εὐωδία ἐσμὲν τῷ θεῷ ἐν τοῖς σῳζομένοις καὶ ἐν τοῖς ἀπολλυμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: hi
  text: क्योंकि हम परमेश्वर के लिए मसीह की सुगंध हैं, उद्धार पा रहे लोगों के बीच भी और नाश हो रहे लोगों के बीच भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ यूनानी संयोजक के इस बल को स्वाभाविक हिन्दी में रखता है।
- source_word: Χριστοῦ
  choice: मसीह की
  rationale: यह संबंधकारक रूप है और सुगंध को मसीह से संबंधित बताता है; ‘मसीह’ हिन्दी बाइबलीय प्रयोग में Χριστός के पदवीगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εὐωδία
  choice: सुगंध
  rationale: यह गंध के सकारात्मक रूपक को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है, बिना मूल में अनुपस्थित किसी अतिरिक्त विशेषण को जोड़े।
- source_word: τῷ θεῷ
  choice: परमेश्वर के लिए
  rationale: सम्प्रदान कारक यहाँ सुगंध का परमेश्वर की ओर होना या उनके लिए होना दर्शाता है; यह अनुवाद उस संबंध को निकटता से रखता है।
- source_word: ἐν τοῖς σῳζομένοις
  choice: उन लोगों के बीच जो उद्धार पा रहे हैं
  rationale: ‘के बीच’ समूह के मध्य उपस्थिति का भाव देता है, और वर्तमान कृदन्त की जारी प्रक्रिया ‘उद्धार पा रहे हैं’ में सुरक्षित रहती है।
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: उन लोगों के बीच जो नाश हो रहे हैं
  rationale: दोहराया गया ‘के बीच’ यूनानी के समानांतर ἐν को बनाए रखता है; ‘नाश हो रहे हैं’ वर्तमान कृदन्त के जारी प्रक्रिया-भाव को व्यक्त करता है।
theological_decisions:
- issue: σῳζομένοις और ἀπολλυμένοις का प्रक्रियात्मक पक्ष
  choice: 'दोनों को जारी प्रक्रियाओं के रूप में अनूदित किया गया: ‘उद्धार पा रहे हैं’ और ‘नाश हो रहे हैं’।'
  alternative: ‘उद्धार पाए हुए’ और ‘नाश हुए’ अथवा ‘उद्धार पाए’ और ‘खोए हुए’।
  rationale: वर्तमान कृदन्त दोनों अवस्थाओं को गतिशील रूप में रखते हैं। अनुवाद उन्हें पूर्ण या स्थिर धार्मिक श्रेणियों में बदलकर मूल की धार्मिक तनावपूर्णता को समाप्त नहीं करता।
- issue: Χριστοῦ का संबंध
  choice: ‘मसीह की सुगंध’—सुगंध को मसीह से संबंधित या उनकी सुगंध के रूप में रखा गया।
  alternative: ‘मसीह के विषय की सुगंध’ या अन्य अधिक व्याख्यात्मक विस्तार।
  rationale: संबंधकारक की सटीक अर्थ-छाया को अत्यधिक स्पष्ट नहीं किया गया; हिन्दी संबंधकारक मूल की संक्षिप्तता और संभावित अर्थ-विस्तार बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण बाइबलीय शैली। वाक्य-विन्यास को स्वाभाविक रखने के साथ दोनों ἐν वाक्यांशों की समानांतरता और दोनों वर्तमान कृदन्तों का प्रक्रियात्मक भाव सुरक्षित रखा गया है।
