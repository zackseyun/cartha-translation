  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: hi
  text: मुझे अपनी आत्मा में[a] चैन नहीं मिला, क्योंकि मुझे अपना भाई तीतुस[b] नहीं मिला; पर उनसे विदा लेकर[c] मैं मकिदुनिया चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे मन को चैन नहीं मिला।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भाई” से आशय मसीह में पौलुस के सहविश्वासी और सहकर्मी से है।
    reason: cultural_note
  - marker: c
    text: या, “उनसे अलविदा कहकर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσχηκα
  choice: मिला
  rationale: यूनानी पूर्णकाल यहाँ पिछली यात्रा का वर्णन करते हुए उस समय की स्थिति बताता है; इसलिए सहज हिन्दी भूतकाल उपयुक्त है।
- source_word: ἄνεσιν
  choice: चैन
  rationale: यह पौलुस की भीतरी व्याकुलता के विपरीत विश्राम या राहत को व्यक्त करता है; आधुनिक हिन्दी में ‘चैन’ इस भाव को स्वाभाविक ढंग से पहुँचाता है।
- source_word: τῷ πνεύματί μου
  choice: अपनी आत्मा में
  rationale: सम्बन्ध या क्षेत्र सूचित करने वाले सम्प्रदान कारक की अस्पष्टता को यथासम्भव बनाए रखते हुए यह पौलुस की भीतरी अवस्था व्यक्त करता है।
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: क्योंकि मुझे अपना भाई तीतुस नहीं मिला
  rationale: μή सहित संज्ञार्थक क्रियारूप पौलुस को चैन न मिलने का कारण बताता है; ‘क्योंकि’ हिन्दी में इस सम्बन्ध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἀδελφόν μου
  choice: अपना भाई
  rationale: ‘भाई’ पौलुस के पारिवारिक रूपक और तीतुस के साथ उसके आत्मीय विश्वास-सम्बन्ध को बनाए रखता है।
- source_word: ἀποταξάμενος αὐτοῖς
  choice: उनसे विदा लेकर
  rationale: यह कृदन्त वहाँ के लोगों से विदा होने के बाद की अगली क्रिया बताता है; ‘विदा लेकर’ गरिमापूर्ण और सहज है।
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: मकिदुनिया चला गया
  rationale: यह गन्तव्य की ओर प्रस्थान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; यूनानी के ‘बाहर जाने’ को शब्दशः रखना हिन्दी में असहज होता।
theological_decisions:
- issue: πνεῦμα का आशय
  choice: आत्मा
  alternative: मन
  rationale: ‘आत्मा’ स्रोत शब्द के औपचारिक और मानवीय भीतरी पक्ष को सुरक्षित रखता है, जबकि पादटिप्पणी अधिक मुहावरेदार ‘मन’ की सम्भावना बताती है और इसे पवित्र आत्मा के रूप में नहीं ठहराती।
- issue: ἀδελφός का सम्बन्ध
  choice: भाई
  alternative: सहविश्वासी और सहकर्मी
  rationale: मूल पारिवारिक रूपक को मुख्य पाठ में बनाए रखा गया है; पादटिप्पणी स्पष्ट करती है कि यहाँ जैविक भाई होना आवश्यक नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चैन’, ‘विदा लेकर’ और ‘चला गया’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि ‘आत्मा’ और ‘भाई’ मूल यूनानी की प्रमुख धार्मिक एवं सम्बन्धपरक शब्दावली को सुरक्षित रखते हैं।
