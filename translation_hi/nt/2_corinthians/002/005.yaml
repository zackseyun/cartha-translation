source:
  edition: SBLGNT
  text: Εἰ δέ τις λελύπηκεν, οὐκ ἐμὲ λελύπηκεν, ἀλλὰ ἀπὸ μέρους ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: hi
  text: पर यदि किसी ने दुःख पहुँचाया है, तो उसने मुझे नहीं, बल्कि कुछ हद तक[a] आप सबको दुःख पहुँचाया है—ताकि मैं आप सब पर अधिक भार न डालूँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आंशिक रूप से।” यह वाक्यांश दुःख की सीमा को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “ताकि मैं बात को आप सबके लिए बहुत कठोर न बनाऊँ” अथवा “ताकि मैं इसे बढ़ा-चढ़ाकर न कहूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: λελύπηκεν
  choice: दुःख पहुँचाया है
  rationale: पूर्णकालिक क्रिया के भूतकालीन कार्य और उसके वर्तमान प्रभाव को ‘पहुँचाया है’ से व्यक्त किया गया है। दोनों बार एक ही पदावली रखकर यूनानी की शाब्दिक कड़ी सुरक्षित रखी गई है।
- source_word: οὐκ ἐμὲ
  choice: मुझे नहीं
  rationale: मूल के सीधे विरोध को बिना अनावश्यक बल जोड़े स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἀπὸ μέρους
  choice: कुछ हद तक
  rationale: यह मुहावरा यहाँ दुःख की सीमा को योग्य ठहराता प्रतीत होता है; ‘कुछ हद तक’ आधुनिक हिन्दी में स्वाभाविक है और कथन की सावधानी बनाए रखता है।
- source_word: ἐπιβαρῶ
  choice: अधिक भार न डालूँ
  rationale: क्रिया के मूल भार-संबंधी रूपक को सुरक्षित रखते हुए प्रसंग में पौलुस द्वारा अपने कथन को अत्यधिक कठोर न बनाने का भाव भी खुला रखा गया है।
- source_word: πάντας ὑμᾶς
  choice: आप सबको / आप सब पर
  rationale: πάντας की समावेशी व्यापकता और बहुवचन संबोधन दोनों स्पष्ट रूप से सुरक्षित हैं।
theological_decisions:
- issue: दुःख किसे पहुँचा और किस सीमा तक
  choice: कुछ हद तक आप सबको
  alternative: आप सबके एक भाग को
  rationale: ἀπὸ μέρους को मात्रा-सूचक मानना πάντας ὑμᾶς के साथ अधिक स्वाभाविक है; फिर भी वाक्यरचना में ‘आंशिक रूप से’ की वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
- issue: ἵνα μὴ ἐπιβαρῶ का आशय
  choice: आप सब पर अधिक भार न डालूँ
  alternative: बात को बहुत कठोर न बनाऊँ
  rationale: मूल क्रिया का प्रत्यक्ष अर्थ ‘भार डालना’ है। प्रसंग में यह कथन को बढ़ा-चढ़ाकर या कठोरता से कहने के लिए रूपक हो सकता है, इसलिए विकल्प पादटिप्पणी में दिया गया है और मुख्य पाठ में रूपक सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामूहिक कलीसियाई संबोधन के अनुकूल है। ‘आप सब’ से बहुवचन स्पष्ट किया गया है। डैश यूनानी वाक्य के सावधानीपूर्ण, लगभग कोष्ठकीय अंतिम खंड को स्वाभाविक हिन्दी में अलग करता है।
