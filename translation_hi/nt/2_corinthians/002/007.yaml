base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/007.yaml
  text: so that[a], on the contrary, you should rather forgive and comfort him[b], so that such a person may not be overwhelmed by excessive sorrow.
translation:
  language: hi
  text: अतः, इसके विपरीत, तुम्हें बल्कि उसे क्षमा करना[a] और सांत्वना देना चाहिए, कहीं ऐसा न हो कि ऐसा व्यक्ति अत्यधिक दुःख से अभिभूत हो जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनुग्रहपूर्वक क्षमा करना”; इस क्रिया का संबंध अनुग्रह या कृपा दिखाने से है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “अत्यधिक दुःख के द्वारा निगल लिया जाए।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὐναντίον
  choice: इसके विपरीत
  rationale: यह पहले की अनुशासनात्मक कार्रवाई से उलट, अब पुनर्स्थापना की ओर मुड़ने का स्पष्ट संकेत देता है।
- source_word: μᾶλλον
  choice: चाहिए
  rationale: τοὐναντίον के साथ मिलकर यह अपेक्षित वैकल्पिक कार्रवाई पर बल देता है; हिन्दी में ‘इसके विपरीत ... चाहिए’ स्वाभाविक है और अनावश्यक दोहराव से बचता है।
- source_word: χαρίσασθαι
  choice: क्षमा करके
  rationale: इस अनुशासन और पुनर्स्थापना के प्रसंग में क्रिया का स्वाभाविक अर्थ क्षमा करना है; इसमें निहित अनुग्रहपूर्ण व्यवहार का भाव भी संदर्भ से बना रहता है।
- source_word: παρακαλέσαι
  choice: सांत्वना देनी
  rationale: व्यक्ति के अत्यधिक दुःख के संदर्भ में ढाढ़स और भावनात्मक सहारा देने का अर्थ प्रमुख है।
- source_word: καταποθῇ
  choice: डूब जाए
  rationale: मूल के ‘निगल लिया जाए’ रूपक को हिन्दी में स्वाभाविक और चित्रात्मक ढंग से व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: ὁ τοιοῦτος
  choice: ऐसा व्यक्ति
  rationale: यूनानी अभिव्यक्ति की अनिर्दिष्ट संदर्भात्मकता को बनाए रखता है और लिंग अथवा पहचान को आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: τῇ περισσοτέρᾳ λύπῃ
  choice: अत्यधिक दुःख में
  rationale: यह ऐसी बढ़ी हुई पीड़ा को स्वाभाविक हिन्दी में व्यक्त करता है जो व्यक्ति पर हावी हो सकती है।
