    issue: The comparative force of both instances of ὡς is omitted.
    rationale: The Greek says, literally in structure, “but as from sincerity, but as from God.” Plain instrumental/source phrases communicate much of the sense, but do not preserve the explicit rhetorical qualification. “...बोलनेवालों के समान” expresses the comparison naturally in Hindi.
