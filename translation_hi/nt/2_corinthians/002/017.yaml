reference: 2 Corinthians 2:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ γάρ ἐσμεν ὡς οἱ ⸀πολλοὶ καπηλεύοντες τὸν λόγον τοῦ θεοῦ, ἀλλ’ ὡς ἐξ εἰλικρινείας, ἀλλ’ ὡς ἐκ θεοῦ ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: hi
  text: क्योंकि हम उन बहुतों के समान नहीं हैं जो परमेश्वर के वचन का सौदा करते हैं[a]; बल्कि निष्कपटता से और परमेश्वर की ओर से बोलनेवालों के समान, हम परमेश्वर के सामने मसीह में बोलते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सौदा करते हैं” में लाभ के लिए बेचने, और संभवतः मिलावट करके पेश करने, दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πολλοί
  choice: वे बहुत से लोग
  rationale: सव्यंजक पदबंध किसी सांख्यिकीय बहुमत का अनिवार्य दावा नहीं करता; हिंदी में ‘उन बहुतों’ से पौलुस का अपने सेवकाई-कार्य और एक बड़े दूसरे समूह के बीच विरोध बना रहता है।
- source_word: καπηλεύοντες
  choice: सौदा करते हैं
  rationale: यह क्रिया फेरी लगाकर या स्वार्थपूर्ण लाभ के लिए माल बेचने की छवि रखती है और संभवतः मिलावट का भाव भी दे सकती है। ‘वचन का सौदा करना’ हिंदी में व्यावसायिक और नैतिक आलोचना दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: यह संबंधकारक संरचना का सीधा और पौलुस की गंभीर शब्दावली के अनुरूप अनुवाद है।
- source_word: ἐξ εἰλικρινείας
  choice: निष्कपटता से
  rationale: हिंदी में यह स्वाभाविक रूप से ईमानदार और शुद्ध अभिप्राय से बोलने का भाव देता है; ‘से’ स्रोत/आधार के अर्थ को भी बनाए रखता है।
- source_word: ἐκ θεοῦ
  choice: परमेश्वर की ओर से
  rationale: केवल ‘परमेश्वर से’ की अपेक्षा यह हिंदी में स्पष्ट और स्वाभाविक ढंग से बताता है कि बोलने का स्रोत और प्राधिकार परमेश्वर है, बिना ‘भेजे हुए’ जैसी अतिरिक्त धारणा जोड़े।
- source_word: κατέναντι θεοῦ
  choice: परमेश्वर के सामने
  rationale: यह परमेश्वर की उपस्थिति और उसके प्रति उत्तरदायित्व, दोनों को संक्षेप में व्यक्त करता है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: आधुनिक हिंदी बाइबलीय प्रयोग में ‘मसीह’ Χριστός के पदनाम का अर्थ वहन करता है और इस पौलुसी संबंधसूचक सूत्र में स्वाभाविक है।
- source_word: λαλοῦμεν
  choice: हम बोलते हैं
  rationale: यह सामान्य वर्तमानकालीन क्रिया का सीधा अनुवाद है; ‘प्रचार करते हैं’ मूल से अधिक विशिष्ट होता।
theological_decisions:
- issue: ἐν Χριστῷ में Χριστός का अनुवाद
  choice: मसीह में
  alternative: ख्रीस्त में
  rationale: ‘मसीह’ हिंदी में अभिषिक्त जन के पदनाम के रूप में स्थापित और अर्थपूर्ण है; यह केवल नाम-सदृश लिप्यंतरण तक सीमित नहीं होता।
- issue: ἐξ εἰλικρινείας और ἐκ θεοῦ का संबंध
  choice: दोनों को समानांतर आधार/स्रोत-वाक्यांशों के रूप में रखना
  alternative: ‘सच्चे मन से, अर्थात परमेश्वर की ओर से’ जैसे व्याख्यात्मक संबंध में जोड़ना
  rationale: यूनानी पाठ दो अलग ὡς-वाक्यांशों को विरोधसूचक पुनरावृत्ति के साथ रखता है। हिंदी में उन्हें साथ रखते हुए अर्थ स्पष्ट किया गया है, पर एक को दूसरे की व्याख्या नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी की जोरदार पुनरावृत्ति को शब्दशः अस्वाभाविक हिंदी में दोहराने के बजाय ‘बल्कि’ के बाद समानांतर पदों से प्रस्तुत किया गया है। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
