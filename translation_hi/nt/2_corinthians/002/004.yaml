source:
  edition: SBLGNT
  text: ἐκ γὰρ πολλῆς θλίψεως καὶ συνοχῆς καρδίας ἔγραψα ὑμῖν διὰ πολλῶν δακρύων, οὐχ ἵνα λυπηθῆτε, ἀλλὰ τὴν ἀγάπην ἵνα γνῶτε ἣν ἔχω περισσοτέρως εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: hi
  text: क्योंकि मैंने बहुत क्लेश और हृदय की व्याकुलता से, बहुत आँसुओं के साथ[a], तुम्हें लिखा—इसलिए नहीं कि तुम दुःखी हो जाओ, बल्कि इसलिए कि तुम जान लो कि तुम्हारे प्रति मेरा प्रेम कितना अधिक है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “बहुत आँसुओं के द्वारा।”'
    reason: lexical_alternative
  - marker: b
    text: 'या: “जो प्रेम मुझे तुम्हारे लिए बहुत अधिक है” अथवा “जो तुम्हारी ओर और भी बढ़कर है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ πολλῆς θλίψεως
  choice: बड़े क्लेश में
  rationale: ἐκ लेखन की उत्पत्ति या भीतरी परिस्थिति बताता है; स्वाभाविक हिन्दी में ‘में’ उस भावगत स्रोत को व्यक्त करता है, और ‘क्लेश’ दबाव व दुःख की तीव्रता बनाए रखता है।
- source_word: συνοχῆς καρδίας
  choice: हृदय की पीड़ा
  rationale: यह भीतर की जकड़न और व्याकुलता का भाव व्यक्त करता है; ‘हृदय की पीड़ा’ आधुनिक हिन्दी में सहज और गंभीर है।
- source_word: ἔγραψα
  choice: मैंने ... लिखा था
  rationale: हिन्दी का पूर्ण भूतकाल प्रसंग में पहले लिखे गए पत्र की ओर स्वाभाविक संकेत करता है, जबकि क्रिया में अनावश्यक विवरण नहीं जोड़ता।
- source_word: διὰ πολλῶν δακρύων
  choice: बहुत आँसू बहाते हुए
  rationale: शाब्दिक ‘बहुत आँसुओं के द्वारा’ अस्वाभाविक होगा; यह रूप आँसुओं के बीच पत्र लिखने की जीवंत छवि और साथ-साथ होने का भाव रखता है।
- source_word: λυπηθῆτε
  choice: तुम दुःखी हो जाओ
  rationale: निष्क्रिय भाव और दुःख पहुँचने की आशंका को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀγάπην
  choice: प्रेम
  rationale: ἀγάπη के लिए प्रतिष्ठित, व्यापक और संप्रदाय-निरपेक्ष हिन्दी शब्द।
- source_word: γνῶτε
  choice: जान लो
  rationale: उद्देश्यवाचक उपवाक्य को बनाए रखते हुए पहचानने या अधिक गहराई से समझने, दोनों संभावनाओं के लिए पर्याप्त खुला है।
- source_word: περισσοτέρως εἰς ὑμᾶς
  choice: तुम्हारे लिए विशेष रूप से
  rationale: περισσοτέρως के तुलनात्मक/तीव्रकारी बल को सहज हिन्दी में व्यक्त करता है, बिना तुलना का कोई अनुल्लिखित मानक निर्धारित किए।
theological_decisions:
- issue: περισσοτέρως का तुलनात्मक या तीव्रकारी अर्थ
  choice: विशेष रूप से
  alternative: बहुत अधिक / और भी बढ़कर
  rationale: यूनानी पद अधिकता या विशेष प्रचुरता दोनों का संकेत दे सकता है। मुख्य पाठ में सहज अर्थ रखा गया है और पादटिप्पणी में अधिक शाब्दिक संभावना सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आत्मीय, गंभीर और भावपूर्ण शैली। ‘तुम्हें/तुम’ मूल के बहुवचन समुदाय-संबोधन को स्वाभाविक हिन्दी में दर्शाते हैं। विराम-चिह्न लंबे वाक्य के कारण और उद्देश्य को स्पष्ट करते हैं।
