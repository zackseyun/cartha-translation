  text: οἷς μὲν ὀσμὴ ⸀ἐκ θανάτου εἰς θάνατον, οἷς δὲ ὀσμὴ ⸁ἐκ ζωῆς εἰς ζωήν. καὶ πρὸς ταῦτα τίς ἱκανός;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: hi
  text: कुछ लोगों के लिए मृत्यु से मृत्यु तक की गंध[a], और दूसरों के लिए जीवन से जीवन तक की गंध[b]। और इन बातों के लिए कौन समर्थ[c] है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर ‘गंध’ का अनुवाद ‘सुगंध’ या ‘महक’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘मृत्यु से मृत्यु तक’ और ‘जीवन से जीवन तक’ स्रोत और परिणाम का भाव दे सकते हैं—‘मृत्यु से निकलकर मृत्यु तक पहुँचाने वाली’ और ‘जीवन से निकलकर जीवन तक पहुँचाने वाली’—या ये मृत्यु और जीवन के गुण को तीव्र रूप में व्यक्त कर सकते हैं।
    reason: alternative_reading
  - marker: c
    text: या ‘पर्याप्त’, ‘योग्य’ अथवा ‘सक्षम’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: गंध
  rationale: ‘गंध’ इंद्रिय-बिंब को बनाए रखते हुए हिन्दी में पर्याप्त रूप से तटस्थ है, इसलिए यह मृत्यु और जीवन—दोनों के साथ स्वाभाविक अर्थ दे सकता है। ‘सुगंध’ केवल सुखद अर्थ की ओर अधिक झुकती।
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: मृत्यु से मृत्यु
  rationale: यह संक्षिप्त और समानांतर यूनानी रचना को बनाए रखता है तथा स्रोत-से-परिणाम और तीव्र विशेषता—दोनों संभावनाओं में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: जीवन से जीवन
  rationale: यह ‘मृत्यु से मृत्यु’ के साथ जानबूझकर रखी गई समानता को सुरक्षित रखता है और वाक्यांश की खुली अर्थ-संभावना को बनाए रखता है।
- source_word: πρὸς ταῦτα
  choice: इन बातों के लिए
  rationale: यह बहुवचन ταῦτα को दर्शाता है और पहले वर्णित गंभीर कार्यों के संबंध में योग्यता या पर्याप्तता का भाव देता है।
- source_word: ἱκανός
  choice: पर्याप्त
  rationale: यह किसी कार्य के लिए समर्थ, योग्य या उसके बराबर होने का भाव रखता है और पौलुस के आलंकारिक प्रश्न की गंभीरता को बनाए रखता है।
theological_decisions:
- issue: ‘मृत्यु से मृत्यु’ और ‘जीवन से जीवन’ वाक्यांशों का अर्थ
  choice: मुख्य पाठ में यूनानी की संक्षिप्त और अस्पष्ट रचना को बनाए रखा गया है।
  alternative: ‘मृत्यु से निकलकर मृत्यु तक पहुँचाने वाली’ / ‘जीवन से निकलकर जीवन तक पहुँचाने वाली’, अथवा ‘पूरी तरह मृत्यु की’ / ‘पूरी तरह जीवन की’।
  rationale: पद स्वयं यह निश्चित नहीं करता कि रचना स्रोत और परिणाम बताती है या किसी गुण को तीव्र करती है; इसलिए किसी एक व्याख्या को मुख्य पाठ में थोपना उचित नहीं है।
- issue: ὀσμή के सकारात्मक या तटस्थ भाव का प्रश्न
  choice: दोनों स्थानों पर तटस्थ ‘गंध’ रखा गया है।
  alternative: ‘सुगंध’ या ‘महक’।
  rationale: एक ही गंध का ग्रहण करने वालों पर जीवनकारी या मृत्युकारी प्रभाव बताया गया है। तटस्थ शब्द इस विरोध और एक ही यूनानी शब्द की पुनरावृत्ति को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गंभीर और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। यूनानी की समानांतर, कुछ हद तक खंडित वाक्य-रचना को पद के पूर्ववर्ती संदर्भ से जुड़ने के लिए बनाए रखा गया है; अतिरिक्त कर्ता या व्याख्यात्मक क्रिया नहीं जोड़ी गई।
