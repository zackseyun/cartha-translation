  text: εἰς τοῦτο γὰρ καὶ ἔγραψα ἵνα γνῶ τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: hi
  text: क्योंकि मैंने इसी उद्देश्य से लिखा भी था कि मैं तुम्हारे परखे हुए चरित्र को जान सकूँ कि क्या तुम हर बात में आज्ञाकारी हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ καὶ ἔγραψα
  choice: क्योंकि मैंने इसी उद्देश्य से लिखा भी था
  rationale: ‘इसी उद्देश्य से’ उद्देश्यसूचक वाक्यांश को स्वाभाविक हिन्दी में व्यक्त करता है; ‘क्योंकि’ γάρ के व्याख्यात्मक संबंध और ‘भी’ καί के योगात्मक बल को बनाए रखता है। अओरिस्ट ἔγραψα को प्रसंगानुकूल भूतकाल में रखा गया है।
- source_word: ἵνα γνῶ
  choice: कि मैं ... जान सकूँ
  rationale: यह उद्देश्यवाचक उपवाक्य और किसी बात को जान लेने अथवा परखकर जानने की दिशा को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: तुम्हारे खरेपन को
  rationale: δοκιμή परख, परख से प्राप्त प्रमाण, अथवा परखा हुआ चरित्र सूचित कर सकता है। ‘खरापन’ व्यक्ति के परीक्षा में प्रमाणित होने का भाव देता है, जबकि पाद-टिप्पणी मूल शब्द की वास्तविक अर्थ-व्याप्ति खुली रखती है।
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: क्या तुम हर बात में आज्ञाकारी हो
  rationale: γνῶ के बाद εἰ को अप्रत्यक्ष प्रश्न के रूप में ‘क्या’ से व्यक्त किया गया है। ‘हर बात में’ εἰς πάντα की व्यापकता और ‘आज्ञाकारी’ ὑπήκοοι का अर्थ बनाए रखता है।
theological_decisions:
- issue: δοκιμή का अर्थ परख की प्रक्रिया है या उससे प्रमाणित चरित्र
  choice: मुख्य पाठ में ‘खरापन’
  alternative: ‘तुम्हारी परख’ या ‘तुम्हारे प्रमाणित चरित्र’
  rationale: प्रसंग आज्ञाकारिता द्वारा प्रमाणित होने की ओर संकेत करता है, पर यूनानी संज्ञा प्रक्रिया और परिणाम दोनों का भाव ले सकती है। इसलिए मुख्य पाठ सहज रखा गया है और अर्थगत तनाव पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामुदायिक संबोधन ‘तुम’ रखा गया है। वाक्य की तर्क-श्रृंखला को स्पष्ट करने के लिए दीर्घ विराम का प्रयोग किया गया है; इससे अंतिम उपवाक्य ‘जान सकूँ’ की विषय-वस्तु के रूप में पढ़ा जाता है।
