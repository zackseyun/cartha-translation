source:
  edition: SBLGNT
  text: ἵνα μὴ πλεονεκτηθῶμεν ὑπὸ τοῦ Σατανᾶ, οὐ γὰρ αὐτοῦ τὰ νοήματα ἀγνοοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/011.yaml
  text: so that we would not be outwitted by Satan[b][a], for we are not ignorant of his schemes.
translation:
  language: hi
  text: ताकि शैतान हमारा अनुचित लाभ न उठा ले[a], क्योंकि हम उसकी चालों[b] से अनजान नहीं हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमें मात न दे” अथवा “हमारा शोषण न करे।”
    reason: lexical_alternative
  - marker: b
    text: या “योजनाओं,” “मंशाओं” अथवा “विचारों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: ताकि ... न
  rationale: यह उद्देश्य अथवा आशंकित परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πλεονεκτηθῶμεν
  choice: हमारा अनुचित लाभ न उठा ले
  rationale: यूनानी निष्क्रिय क्रिया का भाव किसी के द्वारा अनुचित लाभ उठाए जाने, ठगे जाने या मात खा जाने का है। हिन्दी में कर्तृवाच्य रूप अधिक स्वाभाविक है और शोषण/धोखे की व्यापकता बनाए रखता है।
- source_word: Σατανᾶ
  choice: शैतान
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित रूप रखा गया है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण अथवा आधार प्रस्तुत करता है।
- source_word: νοήματα
  choice: चालों
  rationale: संदर्भ में यह शत्रुतापूर्ण सोच, मंशाओं या योजनाओं को सूचित करता है; ‘चालों’ रणनीतिक और कपटपूर्ण भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀγνοοῦμεν
  choice: अनजान नहीं हैं
  rationale: यह ज्ञान के अभाव का निषेध स्पष्ट और स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: शैतान के νοήματα की प्रकृति
  choice: चालों
  alternative: विचारों, मंशाओं या योजनाओं
  rationale: संदर्भ विरोधी रणनीति का संकेत देता है, पर मूल शब्द का अर्थ केवल औपचारिक योजना तक सीमित नहीं है; इसलिए मुख्य पाठ में स्वाभाविक संदर्भगत शब्द और पादटिप्पणी में व्यापक विकल्प दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखा गया है। यूनानी निष्क्रिय रूप को स्वाभाविक हिन्दी कर्तृवाच्य में बदला गया है, जबकि उसके अर्थ-विस्तार को पादटिप्पणी में सुरक्षित रखा गया है।
