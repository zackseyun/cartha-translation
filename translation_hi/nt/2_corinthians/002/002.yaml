  text: εἰ γὰρ ἐγὼ λυπῶ ὑμᾶς, καὶ ⸀τίς ὁ εὐφραίνων με εἰ μὴ ὁ λυπούμενος ἐξ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/002.yaml
  text: For if I grieve you[a], who is there to make me glad except the one who is grieved by me?
translation:
  language: hi
  text: क्योंकि यदि मैं तुम्हें दुःखी करता हूँ, तो मुझे आनन्द देने वाला कौन है, सिवाय उसी के जो मेरे कारण दुःखी होता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे मैंने दुःखी किया है।” यूनानी में “मेरे कारण” स्रोत या कारण को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπῶ
  choice: दुःखी करता हूँ
  rationale: यह क्रिया किसी को दुःख पहुँचाने या उदास करने का कारण बनने को व्यक्त करती है; यह चयन यूनानी के कारक भाव को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: εὐφραίνων
  choice: आनन्दित करने वाला
  rationale: कर्तृवाचक कृदन्त उस व्यक्ति को सूचित करता है जो पौलुस को आनन्द देता है; यह पद दुःखी करने और आनन्दित करने के विरोध को बनाए रखता है।
- source_word: τίς ὁ εὐφραίνων με
  choice: मुझे आनन्दित करने वाला कौन है
  rationale: यह अनुवाद मूल के संज्ञार्थक कृदन्त और आलंकारिक प्रश्न, दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ λυπούμενος
  choice: जो ... दुःखी होता है
  rationale: वर्तमानकालिक कर्मवाच्य कृदन्त को इस प्रकार रखा गया है कि दुःख की वर्तमान अवस्था या अनुभव बना रहे, न कि उसे अनावश्यक रूप से पूर्ण भूतकाल बनाया जाए।
- source_word: ἐξ ἐμοῦ
  choice: मेरे कारण
  rationale: ἐκ यहाँ स्रोत अथवा कारण व्यक्त कर सकता है; 'मेरे कारण' सहज हिन्दी है और पौलुस को दुःख के कारण के रूप में दिखाता है, जबकि शाब्दिक 'मुझसे' की अस्पष्टता से बचता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन से व्याख्यात्मक संबंध को हिन्दी में स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ὁ λυπούμενος ἐξ ἐμοῦ में कर्मवाच्य अवस्था और कारण का संबंध
  choice: जो मेरे कारण दुःखी होता है
  alternative: जिसे मैंने दुःखी किया है
  rationale: चयन वर्तमान कृदन्त की पक्षगत विशेषता और ἐξ ἐμοῦ के स्रोत/कारण संबंध को अधिक प्रत्यक्ष रूप से सुरक्षित रखता है; विकल्प स्वाभाविक है, पर उसे पूर्ण भूतकाल की ओर सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और संबंधपरक स्वर अपनाया गया है। 'दुःखी' और 'आनन्दित' का स्पष्ट विरोध मूल की वाक्पटुता को बनाए रखता है; प्रश्न की संरचना जानबूझकर सुरक्षित रखी गई है।
