  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: धन्यवाद देता हूँ
  rationale: वर्तमानकालीन प्रथम पुरुष एकवचन क्रिया का सीधा और स्वाभाविक हिन्दी रूप; कृतज्ञता व्यक्त करने का भाव सुरक्षित रहता है।
- source_word: τῷ θεῷ μου
  choice: अपने परमेश्वर को
  rationale: εὐχαριστέω के साथ संप्रदान कारक धन्यवाद के प्राप्तकर्ता को दर्शाता है। हिन्दी में कर्ता के साथ संबंध स्पष्ट करने के लिए ‘मेरे’ की अपेक्षा ‘अपने’ अधिक स्वाभाविक है और मूल का व्यक्तिगत संबंध बनाए रखता है।
- source_word: πάντοτε
  choice: सदा
  rationale: नियमित निरंतरता का संक्षिप्त, गरिमापूर्ण और सहज आधुनिक हिन्दी रूप।
- source_word: μνείαν σου ποιούμενος
  choice: तुम्हारा उल्लेख करता हूँ
  rationale: शाब्दिक मुहावरे ‘तुम्हारा उल्लेख करते हुए’ के मौखिक स्मरण-भाव को बनाए रखता है; हिन्दी में समन्वित क्रिया-रचना मुख्य क्रिया के साथ उसकी समकालिकता को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: अपनी प्रार्थनाओं में
  rationale: इस प्रार्थना-संबंधी मुहावरे का स्वाभाविक हिन्दी रूप, जिसका अर्थ प्रार्थना के समय या उसके भीतर किसी का उल्लेख करना है।
