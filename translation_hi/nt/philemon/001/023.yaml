  text: ⸀Ἀσπάζεταί σε Ἐπαφρᾶς ὁ συναιχμάλωτός μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/023.yaml
  text: Epaphras[a], my fellow prisoner in Messiah Jesus, greets you.
translation:
  language: hi
  text: मसीह यीशु में मेरा सह-कैदी इपफ्रास तुम्हें नमस्कार कहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: नमस्कार कहता है
  rationale: यहाँ ἀσπάζομαι का अर्थ किसी को अभिवादन या नमस्कार कहना है। यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है और एकवचन कर्ता इपफ्रास के अनुरूप है।
- source_word: σε
  choice: तुम्हें
  rationale: यह द्वितीय पुरुष एकवचन कर्म है और सीधे फिलेमोन को संबोधित करता है; ‘तुम्हें’ उस एकवचन को स्पष्ट रखता है।
- source_word: Ἐπαφρᾶς
  choice: इपफ्रास
  rationale: व्यक्तिवाचक नाम को हिन्दी बाइबलीय परंपरा और यूनानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: ὁ συναιχμάλωτός μου
  choice: मेरा सह-कैदी
  rationale: संयुक्त संज्ञा साथ में बंदी होने वाले व्यक्ति को दर्शाती है। ‘सह-कैदी’ संक्षिप्त है और पौलुस के साथ उसकी कैद का संबंध बनाए रखता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ἐν को ‘में’ रखकर पौलुस की मसीह के साथ संबंध/एकता की विशिष्ट भाषा को सुरक्षित रखा गया है। Χριστός को यहाँ सक्रिय पदवी के रूप में ‘मसीह’ और Ἰησοῦ को नाम के रूप में ‘यीशु’ किया गया है।
theological_decisions:
- issue: पौलुस के सूत्र ἐν Χριστῷ Ἰησοῦ में Χριστῷ का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: Χριστός यहाँ केवल व्यक्तिवाचक नाम न होकर ‘अभिषिक्त जन’ की पदवी का अर्थ भी रखता है, इसलिए सामान्य हिन्दी में अर्थपूर्ण ‘मसीह’ चुना गया है। परंपरागत लिप्यंतरण ‘ख्रीष्ट’ पादटिप्पणी में रखा गया है।
- issue: ἐν Χριστῷ Ἰησοῦ का संबंध
  choice: मसीह यीशु में
  alternative: मसीह यीशु के कारण / मसीह यीशु के लिए
  rationale: ‘में’ मूल यूनानी की व्यापक और धर्मवैज्ञानिक रूप से अर्थपूर्ण अभिव्यक्ति को बनाए रखता है; उसे कारण या उद्देश्य में बदलने से मूल की संभावित अर्थ-व्याप्ति संकुचित हो जाती।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘सह-कैदी’ मूल के संयुक्त संबंध को संक्षेप में व्यक्त करता है, जबकि ‘नमस्कार कहता है’ सामान्य हिन्दी में स्वाभाविक अभिवादन है। पादटिप्पणी-चिह्न उसी शब्द ‘मसीह’ पर रखा गया है जिससे उसका वैकल्पिक रूप संबंधित है।
