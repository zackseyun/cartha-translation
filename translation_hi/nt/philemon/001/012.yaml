  yaml_path: translation/nt/philemon/001/012.yaml
  text: I am sending him back to you—him[a], that is[b], my very heart.
translation:
  language: hi
  text: मैं उसे तुम्हारे पास वापस भेज रहा हूँ[a]—उसी को, जो मेरा अपना हृदय है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक औपचारिक रूप से इसका अनुवाद ‘मैंने उसे तुम्हारे पास वापस भेजा’ या ‘मैंने उसे तुम्हारे पास वापस भेज दिया है’ भी हो सकता है। यूनानी अओरिस्ट को प्रसंग के अनुसार अलग-अलग ढंग से व्यक्त किया जा सकता है; यहाँ वर्तमान रूप उस दृष्टिकोण को दर्शाता है जब पत्र फिलेमोन तक पहुँचता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, ‘मेरे भीतरी अंग’; यह गहरे स्नेह या कोमल करुणा के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: उसे
  rationale: यह पुल्लिंग एकवचन सम्बन्धवाचक सर्वनाम उनेसिमुस की ओर संकेत करता है। हिन्दी में पिछले वाक्य से सम्बन्ध स्पष्ट होने के कारण ‘उसे’ स्वाभाविक है।
- source_word: ἀνέπεμψά
  choice: वापस भेज रहा हूँ
  rationale: ἀναπέμπω का अर्थ ‘वापस भेजना’ है। पत्र पाने वाले के दृष्टिकोण से चल रही पत्र-वहन क्रिया को व्यक्त करने के लिए वर्तमान प्रगतिशील रूप स्वाभाविक है; यूनानी अओरिस्ट के दूसरे सम्भव कालगत निरूपण पाद-टिप्पणी में दिए गए हैं।
- source_word: σοι
  choice: तुम्हारे पास
  rationale: द्वितीय पुरुष एकवचन सम्प्रदान कारक भेजे जाने की दिशा और प्राप्तकर्ता को दर्शाता है। ‘तुम्हारे पास’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: αὐτόν
  choice: उसी को
  rationale: दोहराया गया सर्वनाम उनेसिमुस पर बल देता है। ‘उसी को’ इस बल और यूनानी की पुनरुक्ति को सहज हिन्दी में सुरक्षित रखता है।
- source_word: τοῦτ’ ἔστιν
  choice: अर्थात्
  rationale: यह व्याख्यात्मक पद अगले रूपक को पिछले सर्वनाम का स्पष्टीकरण बनाता है। ‘अर्थात्’ संक्षिप्त, स्पष्ट और गरिमापूर्ण है।
- source_word: τὰ ἐμὰ σπλάγχνα
  choice: अपने हृदय को
  rationale: σπλάγχνα का शाब्दिक अर्थ शरीर के भीतरी अंग है, पर यहाँ यह गहरे स्नेह और कोमल भावनाओं के केन्द्र का मुहावरा है। ‘अपने हृदय’ हिन्दी में पौलुस के गहरे आत्मीय लगाव को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: σπλάγχνα में मानव-शरीर सम्बन्धी रूपक
  choice: मुहावरे के रूप में ‘अपने हृदय को’
  alternative: ‘अपने भीतरी अंगों को’ अथवा ‘अपने गहरे स्नेह को’
  rationale: यह सिद्धान्तगत नहीं, बल्कि शब्दार्थ और मुहावरे से सम्बन्धित निर्णय है। शाब्दिक शारीरिक अभिव्यक्ति आधुनिक हिन्दी में अर्थ को धुँधला कर देगी; ‘हृदय’ गहरे व्यक्तिगत स्नेह को स्पष्ट रखता है, जबकि पाद-टिप्पणी मूल रूपक बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्बोधन में एकवचन ‘तुम’ रखा गया है क्योंकि σοι एकवचन है। भाषा सरल और गरिमापूर्ण है। ‘उसी को’ मूल के emphatic αὐτόν को बनाए रखता है, और डैश व्याख्यात्मक विराम को स्पष्ट करता है।
