  text: I appeal to you concerning my child[a], Onesimus, whom I fathered in my chains[b],
translation:
  language: hi
  text: मैं तुझसे अपने बच्चे, ओनेसिमुस, के विषय में विनती करता हूँ, जिसे मैंने अपनी बेड़ियों में जन्म दिया है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जिसे मैंने अपनी बेड़ियों में जन्म दिया।” यहाँ यूनानी में पौलुस और ओनेसिमुस के आत्मिक संबंध के लिए जन्म देने का रूपक है। “मेरी बेड़ियों में” का अर्थ “मेरी कैद के दौरान” भी हो सकता है।
