lexical_decisions:
- source_word: παρακαλῶ
  choice: विनती करता हूँ
  rationale: यहाँ क्रिया एक आत्मीय और गंभीर अनुरोध व्यक्त करती है; ‘विनती’ पत्र के संबंधपरक स्वर को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: περὶ τοῦ ἐμοῦ τέκνου
  choice: अपने बच्चे के विषय में
  rationale: περί के संबंधसूचक अर्थ और ἐμοῦ के आत्मीय अधिकार-बोध को व्यक्त करता है। ‘बच्चा’ τέκνον की व्यापकता को ‘पुत्र’ की अपेक्षा अधिक निकटता से बनाए रखता है।
- source_word: ὃν ἐγέννησα
  choice: जिसका मैं ... पिता बना
  rationale: यह हिन्दी में आध्यात्मिक जनन/पितृत्व के रूपक को स्वाभाविक ढंग से रखता है, बिना स्पष्ट धर्म-परिवर्तन की भाषा जोड़ने के।
- source_word: ἐν τοῖς δεσμοῖς
  choice: अपनी बेड़ियों में
  rationale: δεσμοί की ठोस ‘बेड़ियों’ वाली छवि को बनाए रखता है; प्रसंगानुसार इसका आशय कैद की अवस्था भी है।
- source_word: Ὀνήσιμον
  choice: उनेसिमुस
  rationale: यूनानी व्यक्तिगत नाम का मानक हिन्दी लिप्यंतरण।
theological_decisions:
- issue: पौलुस और उनेसिमुस के संबंध का स्वरूप
  choice: आध्यात्मिक पितृत्व के जनन-रूपक को बनाए रखना
  alternative: जो कैद में मेरा पुत्र बन गया
  rationale: यूनानी पाठ संभवतः पौलुस के द्वारा उनेसिमुस के विश्वास में आने की ओर संकेत करता है, पर इसे स्पष्ट धर्म-परिवर्तन की शब्दावली में नहीं, बल्कि ἐγέννησα के रूपक में व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और आत्मीय हिन्दी। एकवचन ‘तुझसे’ पत्र में फिलेमोन को किए गए सीधे संबोधन को दर्शाता है। वाक्य की असामान्य रूपकात्मक धार को सहज बनाया गया है, पर उसका धार्मिक आशय स्पष्ट करके नहीं जोड़ा गया।
