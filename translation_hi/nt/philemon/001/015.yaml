  yaml_path: translation/nt/philemon/001/015.yaml
  text: For perhaps he was separated from you for a time so that you might have him back forever,[a]
translation:
  language: hi
  text: क्योंकि शायद वह इसी उद्देश्य से कुछ समय के लिए तुमसे अलग किया गया था, ताकि तुम उसे सदा के लिए वापस पा सको।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह कुछ समय के लिए तुमसे अलग हो गया था।” यूनानी में “अलग किया गया” कर्मवाच्य है; यह सीधे दोष ठहराने से कोमलतापूर्वक बच सकता है और परमेश्वर के अप्रकट उद्देश्य की संभावना भी खुली छोड़ सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τάχα
  choice: शायद
  rationale: यह पौलुस के विनम्र और अनिश्चित अनुमान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के साथ व्याख्यात्मक संबंध को स्पष्ट रखता है।
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: मूल वाक्यांश के कारण अथवा प्रयोजन-सूचक बल को सुरक्षित रखता है।
- source_word: ἐχωρίσθη
  choice: अलग किया गया था
  rationale: कर्मवाच्य को बनाए रखकर यह सीधे न तो उनेसिमुस को और न परमेश्वर को कर्ता ठहराता है; इस प्रकार मूल की सूक्ष्म अस्पष्टता बनी रहती है।
- source_word: πρὸς ὥραν
  choice: कुछ समय के लिए
  rationale: यह सीमित अवधि का स्वाभाविक हिन्दी मुहावरा है और ‘सदा के लिए’ के साथ विरोध स्पष्ट करता है।
- source_word: ἵνα
  choice: कि
  rationale: इस वाक्य-रचना में प्रयोजन अथवा अभिप्रेत परिणाम को सहज हिन्दी में व्यक्त करता है।
- source_word: αἰώνιον
  choice: सदा के लिए
  rationale: यह अस्थायी अलगाव के विपरीत स्थायी पुनर्प्राप्ति का भाव स्पष्ट करता है और शब्द के दीर्घकालिक आयाम को खुला रखता है।
- source_word: αὐτὸν
  choice: उसे
  rationale: यह उनेसिमुस की ओर संकेत करने वाला सीधा कर्म है।
- source_word: ἀπέχῃς
  choice: वापस पा सको
  rationale: संदर्भ में किसी को फिर से अपने पास पाने का भाव देता है और आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: ἐχωρίσθη कर्मवाच्य में निहित कर्तृत्व
  choice: ‘अलग किया गया था’ कहकर कर्मवाच्य बनाए रखना और कर्ता का नाम न लेना
  alternative: ‘वह चला गया था’ अथवा ‘परमेश्वर ने उसे अलग किया था’
  rationale: मूल पाठ उनेसिमुस के सीधे दोष को कोमल कर सकता है और साथ ही परमेश्वर की अप्रकट योजना की संभावना छोड़ता है; अनुवाद इस तनाव को हल किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। मूल के कर्मवाच्य और ‘कुछ समय’ बनाम ‘सदा’ के विरोध को बनाए रखा गया है।
