  text: The grace of the Lord Jesus Christ be with your spirit[a][b].
translation:
  language: hi
  text: प्रभु यीशु मसीह का अनुग्रह तुम्हारी[a] आत्मा के साथ रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘तुम्हारी’ के समतुल्य यूनानी सर्वनाम बहुवचन है। अतः यह अंतिम आशीष केवल फिलेमोन के लिए नहीं, बल्कि पत्र के सभी प्राप्तकर्ताओं के लिए है।
    reason: व्याकरणिक स्पष्टता
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस की आशीष-वाणी में यह परमेश्वर की कृपापूर्ण भलाई और आशीष को दर्शाने वाला प्रचलित शब्द है; ‘अनुग्रह’ इसके धार्मिक और संबंधपरक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: यह यीशु की अधिकारपूर्ण उपाधि है; ‘प्रभु’ आधुनिक हिन्दी में स्वाभाविक है और नए नियम में इसके मसीही महत्व को बनाए रखता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Ἰησοῦ नाम है और Χριστοῦ अभिषिक्त जन की उपाधि; हिन्दी में ‘यीशु मसीह’ दोनों को स्पष्ट और प्रतिष्ठित रूप में व्यक्त करता है।
- source_word: μετὰ
  choice: के साथ रहे
  rationale: यूनानी वाक्य में क्रिया निहित है; हिन्दी की आशीष-वाणी में ‘रहे’ जोड़ना अर्थ बदले बिना वाक्य को स्वाभाविक बनाता है।
- source_word: πνεύματος
  choice: आत्मा
  rationale: एकवचन संज्ञा प्राप्तकर्ताओं के भीतरी मनुष्य/आत्मिक अस्तित्व की ओर संकेत करती है; इसे ऐसा ही रखा गया है और पवित्र आत्मा मानकर अर्थ को सीमित नहीं किया गया।
- source_word: ὑμῶν
  choice: तुम सब की
  rationale: सर्वनाम बहुवचन है; ‘तुम सब की’ यह स्पष्ट करता है कि अंतिम आशीष केवल फिलेमोन को नहीं, बल्कि पत्र के सभी प्राप्तकर्ताओं को दी गई है।
theological_decisions:
- issue: Χριστοῦ को उपाधि या नाम-जैसे पद के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ आशीष के सूत्र में उपाधि का भाव बना रहता है; ‘मसीह’ अभिषिक्त जन की पहचान को व्यक्त करता है और आधुनिक हिन्दी के पाठकों के लिए परिचित है।
- issue: ‘तुम सब की आत्मा’ में आत्मा का संदर्भ
  choice: प्राप्तकर्ताओं का मानवीय/भीतरी आत्मिक अस्तित्व
  alternative: पवित्र आत्मा
  rationale: बहुवचन संबंधसूचक ‘तुम सब की’ के साथ एकवचन ‘आत्मा’ प्राप्तकर्ताओं के भीतरी अस्तित्व की ओर अधिक स्वाभाविक संकेत करता है। मुख्य पाठ अनावश्यक व्याख्या जोड़े बिना यूनानी अभिव्यक्ति को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आशीष-वाणी की संक्षिप्तता तथा मूल यूनानी का बहुवचन ‘तुम सब की’ और एकवचन ‘आत्मा’ दोनों सुरक्षित रखे गए हैं।
