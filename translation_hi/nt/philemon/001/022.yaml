  text: ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/022.yaml
  text: At the same time also prepare a guest room for me[b][a], for I hope that through your prayers I will be granted to you.
translation:
  language: hi
  text: और साथ ही मेरे लिए ठहरने की जगह[a] तैयार रखना, क्योंकि मुझे आशा है कि तुम लोगों की प्रार्थनाओं के द्वारा मुझे तुम्हें अनुग्रहपूर्वक दिया जाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अतिथि-कक्ष’ अथवा ‘अतिथि-सत्कार’; यूनानी शब्द अतिथि के लिए तैयार स्थान या आतिथ्य देने की क्रिया, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मुझे तुम्हें प्रदान किया जाएगा’ अथवा ‘मुझे तुम्हें दिया जाएगा’; यूनानी क्रिया में मुक्त रूप से या अनुग्रहपूर्वक दिए जाने का भाव है। देने वाला सम्भवतः परमेश्वर है, पर मुख्य पाठ में उसे स्पष्ट नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: साथ ही
  rationale: यह पिछले अनुरोध के साथ एक और अनुरोध जोड़ता है; आधुनिक हिन्दी में यह संयोजन स्वाभाविक और संक्षिप्त है।
- source_word: ἑτοίμαζέ
  choice: तैयार रखना
  rationale: वर्तमान काल की आज्ञा व्यावहारिक तैयारी का निर्देश देती है; ‘तैयार रखना’ हिन्दी में सतत तत्परता का भाव भी व्यक्त करता है।
- source_word: μοι
  choice: मेरे लिए
  rationale: सम्प्रदान कारक यहाँ लाभार्थी को दर्शाता है।
- source_word: ξενίαν
  choice: ठहरने की जगह
  rationale: संदर्भ में अतिथि-सत्कार की क्रिया की अपेक्षा आवास का ठोस अर्थ अधिक स्वाभाविक है; यह ‘अतिथि-कक्ष’ से कम विशिष्ट रहते हुए यूनानी शब्द की व्यापकता बनाए रखता है।
- source_word: ἐλπίζω γὰρ ὅτι
  choice: क्योंकि मुझे आशा है कि
  rationale: γάρ पिछले अनुरोध का कारण बताता है और ὅτι आशा की विषय-वस्तु आरम्भ करता है।
- source_word: διὰ τῶν προσευχῶν ὑμῶν
  choice: तुम्हारी प्रार्थनाओं के द्वारा
  rationale: διά तथा सम्बन्धकारक साधन या माध्यम का भाव देते हैं, जिसे ‘के द्वारा’ स्पष्ट रूप से सुरक्षित रखता है।
- source_word: χαρισθήσομαι
  choice: अनुग्रहपूर्वक दे दिया जाऊँगा
  rationale: भविष्यत् कर्मवाच्य रूप और χαρίζομαι में निहित मुक्त अथवा अनुग्रहपूर्ण देने का भाव दोनों सुरक्षित रहते हैं; कर्ता को पाठ से अधिक स्पष्ट नहीं किया गया।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: सम्प्रदान कारक पौलुस के प्राप्तकर्ताओं को वापस दिए जाने की आशा व्यक्त करता है।
theological_decisions:
- issue: χαρισθήσομαι में पौलुस की वापसी और निहित कर्ता
  choice: ‘मैं तुम्हें अनुग्रहपूर्वक दे दिया जाऊँगा’—कर्मवाच्य और अनुग्रह का भाव सुरक्षित, पर देने वाले का नाम अस्पष्ट
  alternative: ‘मैं तुम्हारे पास लौट आऊँगा’ या ‘परमेश्वर मुझे तुम्हें लौटा देगा’
  rationale: पहला विकल्प यूनानी क्रिया के कर्मवाच्य और अनुग्रह-संबंधी अर्थ को खो देता है, जबकि दूसरा निहित दिव्य कर्ता को मूल पाठ से अधिक स्पष्ट कर देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। एक व्यक्ति फिलेमोन को संबोधन होने के कारण ‘तुम्हारी/तुम्हें’ रखा गया है। मुख्य पाठ में यूनानी कर्मवाच्य की असामान्य किन्तु अर्थपूर्ण रचना और निहित दिव्य कर्ता की अस्पष्टता जानबूझकर सुरक्षित रखी गई है।
