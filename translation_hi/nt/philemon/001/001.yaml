  text: Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/001.yaml
  text: Paul[a], a prisoner of Messiah Jesus, and Timothy our brother, to Philemon our beloved fellow worker[b],
translation:
  language: hi
  text: 'मसीह[a] यीशु का कैदी[b] पौलुस और भाई तीमुथियुस की ओर से, हमारे प्रिय सहकर्मी फिलेमोन के नाम:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द ‘ख्रिस्तोस’ का अर्थ ‘मसीह,’ अर्थात् ‘अभिषिक्त जन,’ है; यहाँ यह यीशु की उपाधि है।
    reason: lexical_alternative
  - marker: b
    text: या, “मसीह यीशु के कारण कैदी।” यूनानी सम्बन्धकारक मसीह यीशु से सम्बन्ध या उसके कारण कैद होने का भाव व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: δέσμιος
  choice: कैदी
  rationale: यह शब्द बन्धन या कारावास में पड़े व्यक्ति को दर्शाता है। आधुनिक हिन्दी में ‘कैदी’ इसका स्पष्ट और स्वाभाविक पर्याय है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यहाँ Χριστός यीशु की उपाधि के रूप में प्रयुक्त है; इसलिए अर्थानुवाद ‘मसीह’ रखा गया है, न कि केवल लिप्यंतरण।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित रूप।
- source_word: ὁ ἀδελφὸς
  choice: हमारा भाई
  rationale: यूनानी में शाब्दिक रूप से ‘वह भाई’ है, पर आरम्भिक मसीही पारिवारिक संबोधन और संयुक्त प्रेषक-संदर्भ को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करने के लिए ‘हमारा भाई’ चुना गया है।
- source_word: ἀγαπητῷ
  choice: प्रिय
  rationale: ‘प्रिय’ आत्मीय स्नेह को सहज, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: συνεργῷ
  choice: सहकर्मी
  rationale: यह साथ मिलकर काम करने वाले व्यक्ति को दर्शाता है; ‘सहकर्मी’ संक्षिप्त, स्पष्ट और सेवाकार्य के संदर्भ के अनुकूल है।
- source_word: ἡμῶν
  choice: हमारे
  rationale: बहुवचन सर्वनाम को बनाए रखा गया है, क्योंकि अभिवादन में पौलुस और तीमुथियुस दोनों सम्मिलित हैं।
- source_word: Φιλήμονι
  choice: फिलेमोन के नाम
  rationale: सम्प्रदान कारक पत्र के प्राप्तकर्ता को सूचित करता है; हिन्दी पत्र-शैली में ‘के नाम’ स्वाभाविक है।
- source_word: καὶ Τιμόθεος
  choice: और हमारा भाई तीमुथियुस
  rationale: तीमुथियुस को पौलुस के साथ संयुक्त प्रेषक के रूप में रखा गया है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस अभिवादन में शब्द उपाधि का अर्थ बनाए रखता है; ‘मसीह’ उसके अभिषिक्त राजा होने का अर्थ आधुनिक हिन्दी पाठक तक पहुँचाता है।
- issue: δέσμιος Χριστοῦ Ἰησοῦ में सम्बन्धकारक का आशय
  choice: मसीह यीशु का कैदी
  alternative: मसीह यीशु के कारण कैदी
  rationale: यूनानी सम्बन्धकारक पौलुस का मसीह से सम्बन्ध अथवा उसके कारण कैद होने—दोनों की ओर संकेत कर सकता है। मुख्य पाठ में संक्षिप्त संरचना रखकर इस तनाव को सुरक्षित रखा गया है और कारणवाचक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और पत्र के आरम्भ के अनुरूप रखी गई है। ‘की ओर से … के नाम’ हिन्दी में प्रेषक और प्राप्तकर्ता को स्पष्ट करता है, जबकि मूल यूनानी की संयुक्त प्रेषक-रचना सुरक्षित रहती है।
