    issue: ‘हमारा भाई तीमुथियुस’ supplies ‘our’ with Timothy.
    rationale: The Greek reads καὶ Τιμόθεος ὁ ἀδελφός (‘and Timothy the brother’). The only ἡμῶν in the verse occurs later and modifies ‘beloved’ and ‘fellow worker’ in reference to Philemon. The added possessive should be removed.
