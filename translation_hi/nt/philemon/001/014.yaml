source:
  edition: SBLGNT
  text: χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/014.yaml
  text: But without your consent I wanted to do nothing[a], so that your good deed might not be as if by compulsion[c][b], but voluntary.
translation:
  language: hi
  text: परन्तु तुम्हारी सहमति के बिना मैं कुछ भी नहीं करना चाहता था[a], ताकि तुम्हारा भला काम मानो दबाव में किया हुआ न हो[b], बल्कि अपनी इच्छा से किया हुआ हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारी स्वीकृति के बिना’ अथवा ‘तुम्हारी राय जाने बिना’।
    reason: lexical_alternative
  - marker: b
    text: ‘तुम्हारा भला काम’ का अनुवाद ‘तुम्हारी भलाई’ या ‘तुम्हारी कृपा’ भी हो सकता है; यूनानी पद किसी विशेष अच्छे कार्य या अधिक सामान्य भलाई—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘बल्कि स्वेच्छा के अनुसार’; अर्थात ‘अपनी स्वतंत्र इच्छा से’।
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς ... τῆς σῆς γνώμης
  choice: तुम्हारी सहमति के बिना
  rationale: γνώμη का अर्थ राय, निर्णय, स्वीकृति या सहमति हो सकता है। इस प्रसंग में पौलुस फिलेमोन की अनुमति के बिना कदम न उठाने की बात करता है, इसलिए ‘सहमति’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: οὐδὲν ἠθέλησα ποιῆσαι
  choice: मैं कुछ भी नहीं करना चाहता था
  rationale: θέλω यहाँ इच्छा या चाह को व्यक्त करता है। यह अनुवाद पौलुस की व्यक्तिगत इच्छा का भाव बनाए रखता है और इसे कठोर निर्णय के रूप में नहीं दिखाता।
- source_word: ὡς κατὰ ἀνάγκην
  choice: मानो दबाव में किया हुआ
  rationale: ἀνάγκη यहाँ विवशता या दबाव का संकेत देती है, जबकि ὡς को ‘मानो’ से व्यक्त किया गया है, जिससे मूल कथन की सावधानी बनी रहती है।
- source_word: τὸ ἀγαθόν σου
  choice: तुम्हारा भला काम
  rationale: संज्ञा के रूप में प्रयुक्त यह विशेषण किसी ठोस अच्छे कार्य अथवा अधिक सामान्य भलाई—दोनों की ओर संकेत कर सकता है। मुख्य पाठ में ‘भला काम’ प्रसंग के संभावित कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀλλὰ κατὰ ἑκούσιον
  choice: बल्कि अपनी इच्छा से किया हुआ
  rationale: ἑκούσιον स्वेच्छा से किए गए कार्य को दर्शाता है। ‘अपनी इच्छा से’ आधुनिक हिन्दी में दबाव के स्पष्ट विपरीत है।
theological_decisions:
- issue: फिलेमोन की प्रतिक्रिया का स्वरूप
  choice: पौलुस की चिंता को दबाव के बजाय स्वैच्छिक सहमति और कार्य के रूप में व्यक्त किया गया है, पर उस अच्छे कार्य को अधिक विशिष्ट नहीं बनाया गया।
  alternative: ‘तुम्हारी भलाई’ या ‘तुम्हारी कृपा’ जैसे अधिक अमूर्त अनुवाद।
  rationale: यूनानी पाठ प्रतिक्रिया की नैतिक प्रकृति—स्वेच्छा, न कि विवशता—पर बल देता है, किंतु अपेक्षित कार्य को स्पष्ट रूप से परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। ‘दबाव में’ और ‘अपनी इच्छा से’ का युग्म मूल के विवशता बनाम स्वेच्छा के विरोध को स्पष्ट रखता है।
