  text: But if he has wronged you in any way or owes you anything[a], charge this to me.
translation:
  language: hi
  text: पर यदि उसने तुम्हारे साथ किसी तरह का अन्याय किया है या वह तुम्हारा कुछ ऋणी है, तो यह मेरे खाते में लिख लो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसे मेरे नाम लिख लो।” यहाँ प्रयुक्त क्रिया का अर्थ हिसाब में किसी बात को किसी व्यक्ति के खाते में दर्ज करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: पर यदि
  rationale: εἰ शर्त व्यक्त करता है और δέ पिछले कथन से हल्का विरोध अथवा संक्रमण; ‘पर यदि’ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τι ἠδίκησέν σε
  choice: उसने तुम्हारे साथ किसी तरह का अन्याय किया है
  rationale: ἀδικέω किसी के साथ अन्याय करने या उसे हानि पहुँचाने का व्यापक अर्थ रखता है; यह वाक्यांश अपराध की प्रकृति को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἢ ὀφείλει
  choice: या वह तुम्हारा कुछ ऋणी है
  rationale: ὀφείλω यहाँ ऋण अथवा देय दायित्व दर्शाता है। ‘तुम्हारा ... ऋणी’ प्रसंग से संबंधित व्यक्ति को स्पष्ट रखते हुए वित्तीय अर्थ बनाए रखता है।
- source_word: τοῦτο
  choice: उसे
  rationale: यह सर्वनाम पहले बताए गए अन्याय या ऋण की ओर संकेत करता है; हिन्दी में ‘उसे’ स्वाभाविक रूप से उसी देय राशि या दायित्व को ग्रहण करता है।
- source_word: ἐμοὶ ἐλλόγα
  choice: मेरे खाते में लिख लो
  rationale: ἐλλογέω हिसाब में किसी के नाम लिखने या उसके खाते में डालने का लेखांकन-संबंधी शब्द है; यह चयन आज की हिन्दी में रूपक को स्पष्ट और स्वाभाविक रखता है।
