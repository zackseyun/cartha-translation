  text: καὶ Ἀπφίᾳ τῇ ⸀ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατ’ οἶκόν σου ἐκκλησίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/002.yaml
  text: 'and to Apphia our sister[a], and to Archippus our fellow soldier, and to the church in your house:'
translation:
  language: hi
  text: 'और बहन अप्फिया[a] को, और हमारे सहयोद्धा अरखिप्पुस को, और तुम्हारे घर में एकत्र होने वाली कलीसिया को:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “हमारी बहन” है।
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπφίᾳ
  choice: अफ़फिया
  rationale: व्यक्तिगत नाम का यूनानी रूप के निकट, हिन्दी में सुबोध लिप्यंतरण किया गया है।
- source_word: ἀδελφῇ
  choice: बहन
  rationale: यह मसीही समुदाय के पारिवारिक संबंध को व्यक्त करता है। मूल पाठ में संबंधवाचक सर्वनाम नहीं है, इसलिए मुख्य पाठ में “हमारी” नहीं जोड़ा गया।
- source_word: Ἀρχίππῳ
  choice: अरखिप्पुस
  rationale: व्यक्तिगत नाम का यूनानी उच्चारण के निकट प्रचलित हिन्दी लिप्यंतरण।
- source_word: συστρατιώτῃ
  choice: सहयोद्धा
  rationale: मूल के सैनिक रूपक को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐκκλησίᾳ
  choice: कलीसिया
  rationale: इस पत्र-संबंधी मसीही संदर्भ में एकत्रित विश्वासियों के समुदाय के लिए यह स्थापित और सहज हिन्दी शब्द है।
- source_word: κατ’ οἶκόν σου
  choice: तुम्हारे घर की
  rationale: यह घर से संबद्ध अथवा घर में मिलने वाली कलीसिया को दर्शाता है; “घर की” मूल की संक्षिप्तता बनाए रखता है और मिलने की क्रिया स्पष्ट रूप से नहीं जोड़ता।
- source_word: καὶ
  choice: और
  rationale: अभिवादन में प्राप्तकर्ताओं को जोड़ने वाली मूल पाठ की दोहराई गई संयोजक संरचना को बनाए रखा गया है।
theological_decisions:
- issue: ἀδελφῇ के साथ संबंधवाचक सर्वनाम जोड़ना
  choice: बहन
  alternative: हमारी बहन
  rationale: दिए गए SBLGNT पाठ में τῇ ἀδελφῇ है, ἡμῶν नहीं। इसलिए परिचित पाठ-परंपरा के अनुसार “हमारी” जोड़ने के बजाय मूल पाठ का अनुसरण किया गया है; वैकल्पिक पांडुलिपि-पाठ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। “सहयोद्धा” सैनिक रूपक को सुरक्षित रखता है, जबकि “तुम्हारे घर की कलीसिया” मूल की संक्षिप्त अभिव्यक्ति और उसके संभावित स्थानगत अर्थ को बनाए रखती है।
