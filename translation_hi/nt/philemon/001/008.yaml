  text: Διό, πολλὴν ἐν Χριστῷ παρρησίαν ἔχων ἐπιτάσσειν σοι τὸ ἀνῆκον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/008.yaml
  text: Therefore[a], though I have much boldness in Messiah to command you to do what is proper[b],
translation:
  language: hi
  text: इसलिए, यद्यपि मसीह में मुझे तुम्हें उचित काम करने की आज्ञा देने का बहुत साहस है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: इसलिए
  rationale: यह निष्कर्षसूचक संयोजक पिछले कथन से वर्तमान बात को जोड़ता है; ‘इसलिए’ स्वाभाविक रूप से उस तार्किक संबंध को बनाए रखता है।
- source_word: πολλὴν ... παρρησίαν
  choice: पूरा साहस
  rationale: παρρησία साहस, निर्भीकता या खुलकर बोलने की स्वतंत्रता व्यक्त कर सकता है। ‘पूरा साहस’ πολλήν की तीव्रता को सहज हिन्दी में व्यक्त करता है, बिना अर्थ को केवल आत्मविश्वास या वाक्-स्वतंत्रता तक सीमित किए।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: Χριστός यहाँ पदवी के रूप में प्रयुक्त है; ‘मसीह’ हिन्दी में इस पदवी का स्वीकृत और अर्थवाही रूप है। ‘में’ पौलुस के संबंधात्मक क्षेत्र को खुला रखता है।
- source_word: ἔχων
  choice: यद्यपि ... है
  rationale: यह कृदंत अगले पद में आने वाले विपरीत भाव की भूमिका बनाता है, इसलिए इसका रियायती अर्थ ‘यद्यपि’ से स्पष्ट किया गया है।
- source_word: ἐπιτάσσειν σοι
  choice: तुम्हें ... आज्ञा देने
  rationale: ἐπιτάσσω अधिकारपूर्वक आदेश देने को दर्शाता है; दत्तिव σοι को हिन्दी की स्वाभाविक रचना ‘तुम्हें ... आज्ञा देना’ में रखा गया है।
- source_word: τὸ ἀνῆκον
  choice: उचित काम करने
  rationale: यह पद उस बात या कार्य को दर्शाता है जो उचित, शोभनीय या अनुकूल हो। हिन्दी में क्रियात्मक संदर्भ स्पष्ट करने के लिए ‘उचित काम करने’ कहा गया है।
theological_decisions:
- issue: Χριστῷ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: मूल शब्द एक पदवी है। ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थवाही और व्यापक रूप से समझा जाने वाला रूप है; इसे केवल निजी नाम मानकर अर्थहीन लिप्यंतरण नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य जानबूझकर अल्पविराम पर समाप्त होता है, क्योंकि यूनानी वाक्य का विरोधात्मक निष्कर्ष अगले पद में पूरा होता है।
