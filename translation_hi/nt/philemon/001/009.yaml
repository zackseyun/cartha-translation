  text: διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος ⸂Χριστοῦ Ἰησοῦ⸃—
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/009.yaml
  text: because of love I rather appeal[a], being such a one as Paul, an old man[c][b], and now also a prisoner of Messiah Jesus—
translation:
  language: hi
  text: बल्कि प्रेम के कारण मैं विनती करता हूँ—मैं, पौलुस, एक वृद्ध व्यक्ति और अब मसीह यीशु का कैदी भी—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὴν ἀγάπην
  choice: प्रेम के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण व्यक्त करता है; यह सहज हिन्दी में मूल का कारणात्मक भाव बनाए रखता है।
- source_word: μᾶλλον παρακαλῶ
  choice: विनती करना ही उचित समझता हूँ
  rationale: μᾶλλον पद 8 में आदेश देने की सम्भावना के विपरीत पौलुस की चुनी हुई विनती को दर्शाता है; हिन्दी में यह तुलनात्मक प्राथमिकता स्वाभाविक रूप से व्यक्त होती है।
- source_word: τοιοῦτος ὢν ὡς Παῦλος
  choice: मैं, पौलुस
  rationale: यूनानी वाक्यांश दीर्घवृत्तात्मक आत्म-वर्णन है। शाब्दिक ‘ऐसा होते हुए जैसे पौलुस’ हिन्दी में अस्वाभाविक और भ्रामक होगा; विरामचिह्नों सहित ‘मैं, पौलुस’ अगले वर्णनों को स्पष्ट रूप से जोड़ता है।
- source_word: πρεσβύτης
  choice: एक बूढ़ा मनुष्य
  rationale: इस शब्द का स्वाभाविक अर्थ आयु में वृद्ध पुरुष है, न कि कलीसियाई पदाधिकारी; ‘बूढ़ा मनुष्य’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: νυνὶ δὲ καὶ
  choice: और अब ... भी
  rationale: यह νυνί के समय-संबंधी बल और καί के योगात्मक भाव दोनों को सुरक्षित रखता है।
- source_word: δέσμιος
  choice: कैदी
  rationale: यह संज्ञा बन्दी बनाए गए व्यक्ति को सीधे व्यक्त करती है और हिन्दी में स्वाभाविक है।
- source_word: Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु का
  rationale: Χριστός यहाँ उपाधि का भाव रखता है, इसलिए ‘मसीह’ उचित है; सम्बन्धकारक कैदी के मसीह यीशु से सम्बन्ध या उनके कारण कैद होने की अर्थगत गुंजाइश खुली रखता है।
theological_decisions:
- issue: πρεσβύτης का अर्थ
  choice: बूढ़ा मनुष्य
  alternative: राजदूत; प्राचीन/अगुवा
  rationale: प्राप्त यूनानी शब्द πρεσβύτης सामान्यतः वृद्ध पुरुष को सूचित करता है। ‘राजदूत’ के लिए निकट-संबंधी किन्तु भिन्न शब्द अपेक्षित होता; ‘अगुवा’ कहना कलीसियाई पद का अनावश्यक अर्थ जोड़ता।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ शब्द यीशु की उपाधि के रूप में अभी भी अर्थपूर्ण है, इसलिए हिन्दी का स्थापित पद ‘मसीह’ चुना गया।
- issue: δέσμιος Χριστοῦ Ἰησοῦ में सम्बन्धकारक
  choice: मसीह यीशु का कैदी
  alternative: मसीह यीशु के कारण कैदी
  rationale: संक्षिप्त सम्बन्धकारक सम्बन्ध, सेवा और मसीह के कारण कैद होने के भावों के बीच कुछ अस्पष्टता रखता है; मुख्य पाठ उसे किसी एक व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने वाली हिन्दी। वाक्य का अन्त दीर्घ डैश पर रखा गया है, क्योंकि यूनानी पाठ अगले पद में जारी रहने वाली विनती की भूमिका बनाता है।
