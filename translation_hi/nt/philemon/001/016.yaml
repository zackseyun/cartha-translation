  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/016.yaml
  text: no longer as a servant[a], but more than a servant, a beloved brother—especially to me, but how much more to you[b], both in the flesh and in the Lord.
translation:
  language: hi
  text: अब दास के रूप में नहीं, बल्कि दास से बढ़कर, एक प्रिय भाई के रूप में—विशेषकर मेरे लिए, पर तुम्हारे लिए तो कितना अधिक, शरीर में भी और प्रभु में भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: अब से ... नहीं
  rationale: यह पहले की स्थिति से अब आए परिवर्तन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὡς δοῦλον
  choice: दास के रूप में
  rationale: फिलेमोन और उनेसिमुस के सामाजिक संदर्भ में बँधी हुई अधीन स्थिति प्रमुख है; ‘दास’ इस वास्तविकता और आगे के विरोध को स्पष्ट रखता है।
- source_word: ὑπὲρ δοῦλον
  choice: दास से बढ़कर
  rationale: ὑπέρ यहाँ स्थानापन्नता नहीं, बल्कि दर्जे और संबंध में उससे आगे होने का भाव देता है।
- source_word: ἀδελφὸν ἀγαπητόν
  choice: एक प्रिय भाई
  rationale: यह मसीही समुदाय के पारिवारिक रूपक और स्नेह, दोनों को सीधे बनाए रखता है।
- source_word: μάλιστα ἐμοί
  choice: खासकर मेरे लिए
  rationale: विशेष मात्रा या संबंध का भाव सरल और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: πόσῳ δὲ μᾶλλον σοὶ
  choice: पर तुम्हारे लिए कितना अधिक
  rationale: यह पौलुस से फिलेमोन की ओर बढ़ती हुई आलंकारिक तुलना की तीव्रता बनाए रखता है।
- source_word: ἐν σαρκὶ
  choice: शरीर के संबंध में
  rationale: यह मूल के σάρξ को बनाए रखते हुए यहाँ उसके सांसारिक, प्रत्यक्ष या सामाजिक संबंध के संभावित अर्थ की ओर संकेत करता है; इसे ‘पापी स्वभाव’ नहीं बनाया गया।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह पौलुस की संबंध अथवा सहभागिता की गहन अभिव्यक्ति को बिना अधिक व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: उनेसिमुस के संदर्भ में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक; बंधुआ सेवक
  rationale: पत्र का सामाजिक संदर्भ उनेसिमुस की अधीन और बँधी हुई स्थिति को प्रमुख बनाता है। ‘दास’ उस कठोर सामाजिक वास्तविकता तथा ‘दास से बढ़कर’ के विरोध को सुरक्षित रखता है।
- issue: ἐν σαρκὶ καὶ ἐν κυρίῳ का अर्थ
  choice: शरीर के संबंध में भी और प्रभु में भी
  alternative: सांसारिक/सामाजिक संबंध में भी और प्रभु में भी; प्रत्यक्ष रूप से भी और प्रभु में भी
  rationale: वाक्य फिलेमोन और उनेसिमुस के मानवीय-सामाजिक तथा मसीही संबंधों को साथ रखता है। मुख्य पाठ मूल बिंब और उसकी अर्थगत व्यापकता बनाए रखता है, जबकि पादटिप्पणी संभावित अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘दास’ ऐतिहासिक-सामाजिक संदर्भ को स्पष्ट करता है। ‘शरीर के संबंध में’ मूल पौलुसी शब्दावली और उसकी वास्तविक अस्पष्टता को बनाए रखता है; पादटिप्पणी गलत नैतिक अर्थ ग्रहण करने से बचाती है।
