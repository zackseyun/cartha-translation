  text: ἀκούων σου τὴν ἀγάπην καὶ τὴν πίστιν ἣν ἔχεις ⸀πρὸς τὸν κύριον Ἰησοῦν καὶ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/005.yaml
  text: because I hear of your love and faith that you have toward the Lord Jesus and for all the saints[c][b][a],
translation:
  language: hi
  text: क्योंकि मैं तुम्हारे प्रेम और विश्वास के विषय में सुनता हूँ, जो प्रभु यीशु की ओर और सभी पवित्र जनों के लिए है।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अर्थ को अधिक स्पष्ट करके: “प्रभु यीशु पर तुम्हारा विश्वास और सभी पवित्र जनों के लिए तुम्हारा प्रेम।”'
    reason: alternative_reading
  - marker: b
    text: या “तुम्हारी विश्वासयोग्यता।” यूनानी शब्द का अर्थ विश्वास, भरोसा या विश्वासयोग्यता हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “तुम्हारा प्रेम और वह विश्वास जो तुम रखते हो।”
    reason: previous_rendering
lexical_decisions:
- source_word: ἀκούων
  choice: क्योंकि मैं ... सुनता रहता हूँ
  rationale: यह वर्तमान कृदंत पिछले पद की धन्यवाद-वाक्य रचना पर निर्भर है और प्रसंग में कारण बताता है। ‘सुनता रहता हूँ’ वर्तमान और निरंतर प्राप्त हो रही खबर का स्वाभाविक हिन्दी रूप है।
- source_word: ἀγάπην
  choice: प्रेम
  rationale: ἀγάπη का सीधा, प्रचलित और प्रसंगानुकूल हिन्दी रूप।
- source_word: πίστιν
  choice: विश्वास
  rationale: πίστις का परियोजना-अनुरूप मुख्य रूप ‘विश्वास’ है; ‘विश्वासयोग्यता’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: πρὸς τὸν κύριον Ἰησοῦν
  choice: प्रभु यीशु की ओर
  rationale: πρός की व्यक्ति की ओर अभिमुखता को बनाए रखता है और अगले εἰς-वाक्यांश से उसका भेद प्रकट करता है।
- source_word: κύριον
  choice: प्रभु
  rationale: मसीह के लिए प्रयुक्त κύριος की स्थापित और गरिमापूर्ण उपाधि।
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: सभी पवित्र जनों के लिए
  rationale: εἰς को यहाँ सम्बन्ध की दिशा/हित के अर्थ में स्वाभाविक हिन्दी ‘के लिए’ से व्यक्त किया गया है।
- source_word: ἁγίους
  choice: पवित्र जन
  rationale: यह पौलुस के सामुदायिक पदनाम का अर्थ स्पष्ट रखते हुए आधुनिक हिन्दी में ‘संतों’ से उत्पन्न संभावित विशिष्ट धार्मिक पद की धारणा से बचता है।
theological_decisions:
- issue: ‘प्रेम’ और ‘विश्वास’ का बाद के दो संबंधसूचक वाक्यांशों से संबंध
  choice: मुख्य पाठ में यूनानी सतही क्रम और व्याकरणिक अस्पष्टता बनाए रखते हुए प्रेम और विश्वास दोनों के बाद ‘प्रभु यीशु की ओर और सभी पवित्र जनों के लिए’ रखा गया है।
  alternative: 'अर्थ को बाँटकर: ‘प्रभु यीशु पर तुम्हारा विश्वास और सभी पवित्र जनों के लिए तुम्हारा प्रेम।’'
  rationale: वितरित अर्थ पौलुस की सामान्य अभिव्यक्ति और पद 7 के अनुकूल है, पर यूनानी में दोनों संज्ञाएँ पहले आती हैं और फिर दोनों संबंधसूचक वाक्यांश, बिना स्पष्ट वितरण-सूचक चिह्नों के। इसलिए मुख्य पाठ अस्पष्टता सुरक्षित रखता है और अधिक स्पष्ट अर्थ पादटिप्पणी में देता है।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता
  rationale: ‘विश्वास’ मूल और सामान्य अर्थ है; इस प्रसंग में निष्ठा या विश्वासयोग्यता की छाया संभव है, इसलिए उसे मुख्य पाठ में थोपने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली। ‘पवित्र जन’ सामुदायिक अर्थ को स्पष्ट रखता है। मुख्य वाक्य जानबूझकर यूनानी की संबंधगत अस्पष्टता बनाए रखता है।
