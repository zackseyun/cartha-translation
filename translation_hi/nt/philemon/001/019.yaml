source:
  edition: SBLGNT
  text: ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/019.yaml
  text: 'I[a], Paul, write this with my own hand: I will repay it—not to mention to you that you owe me even your very self.'
translation:
  language: hi
  text: 'मैं पौलुस अपने ही हाथ से लिखता हूँ: मैं चुका दूँगा—यह कहने की आवश्यकता नहीं कि तुम स्वयं भी मेरे ऋणी हो।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक: “मैं, पौलुस, ने अपने ही हाथ से लिखा है; मैं चुका दूँगा; ताकि मैं तुमसे यह न कहूँ कि तुम स्वयं भी मेरे ऋणी हो।”'
    reason: ἔγραψα के भूतकालिक रूप तथा ἵνα μὴ λέγω σοι की अधिक औपचारिक संरचना को दिखाने के लिए। προσοφείλεις में ‘अतिरिक्त’ का भाव देनदारी में है; ऋण का स्वरूप अनिर्दिष्ट रखा गया है।
lexical_decisions:
- source_word: ἔγραψα
  choice: लिखता हूँ
  rationale: यूनानी में रूप भूतकालिक है, पर पत्र पढ़े जाने के क्षण के दृष्टिकोण से हिन्दी में वर्तमान काल स्वाभाविक है और पौलुस की अपने हाथ से दी गई लिखित गारंटी को सामने लाता है।
- source_word: τῇ ἐμῇ χειρί
  choice: अपने हाथ से
  rationale: यह स्वहस्तलेखन को सूचित करने वाला स्वाभाविक हिन्दी मुहावरा है और व्यक्तिगत गारंटी के बल को बनाए रखता है।
- source_word: ἀποτίσω
  choice: मैं चुका दूँगा
  rationale: यह भविष्य की स्पष्ट प्रतिज्ञा है कि पिछले पद में उल्लिखित हानि या देनदारी का भुगतान पौलुस करेगा। वस्तु को अलग से जोड़ना हिन्दी में आवश्यक नहीं है।
- source_word: ἵνα μὴ λέγω σοι
  choice: यह कहने की आवश्यकता नहीं
  rationale: शाब्दिक उद्देश्यवाचक रूप यहाँ विनम्र, किंचित विडंबनापूर्ण अलंकार की तरह काम करता है। यह हिन्दी अभिव्यक्ति उस निहित कथन को स्वाभाविक रूप में बनाए रखती है।
- source_word: σεαυτόν
  choice: तुम स्वयं भी
  rationale: καί के योग से आए बल को “स्वयं भी” व्यक्त करता है, बिना ऋण के स्वरूप को आवश्यकता से अधिक स्पष्ट किए।
- source_word: προσοφείλεις
  choice: मेरे ऋणी हो
  rationale: यह क्रिया अतिरिक्त देनदारी का भाव रखती है। “भी” उस योगात्मक अर्थ को व्यक्त करता है और “ऋणी” आर्थिक तथा व्यक्तिगत दोनों अर्थों की गुंजाइश बनाए रखता है।
theological_decisions:
- issue: “तुम स्वयं भी मेरे ऋणी हो” में फिलेमोन के ऋण का स्वरूप
  choice: व्यक्तिगत अथवा रूपकात्मक ऋण को अनिर्दिष्ट रखा गया है।
  alternative: इसे फिलेमोन के परिवर्तन, उद्धार, शारीरिक जीवन या किसी विशेष ऐतिहासिक उपकार का ऋण बताना।
  rationale: यूनानी पाठ ऋण को प्रबलता से कहता है, पर उसका सटीक आधार नहीं बताता। इसलिए अनुवाद किसी विशेष धर्मवैज्ञानिक या ऐतिहासिक व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज। मुख्य पाठ में पौलुस की व्यक्तिगत लिखित प्रतिज्ञा और उसके विनम्र अलंकार को स्वाभाविक हिन्दी में रखा गया है।
