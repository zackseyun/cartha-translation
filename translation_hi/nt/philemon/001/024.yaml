  yaml_path: translation/nt/philemon/001/024.yaml
  text: Mark, Aristarchus, Demas, and Luke, my fellow workers.
translation:
  language: hi
  text: मरकुस, अरिस्तर्खुस, देमास और लूका—मेरे सहकर्मी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μᾶρκος
  choice: मरकुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी बाइबल-परंपरा में प्रचलित और स्रोत-रूप के निकट लिप्यंतरण।
- source_word: Ἀρίσταρχος
  choice: अरिस्तर्खुस
  rationale: यूनानी नाम का देवनागरी लिप्यंतरण, जिसमें मूल उच्चारण के प्रमुख व्यंजन और स्वर सुरक्षित हैं।
- source_word: Δημᾶς
  choice: देमास
  rationale: यूनानी व्यक्तिगत नाम का सरल और प्रचलित देवनागरी लिप्यंतरण।
- source_word: Λουκᾶς
  choice: लूका
  rationale: हिन्दी बाइबल-परंपरा में व्यापक रूप से पहचाना जाने वाला नाम-रूप।
- source_word: οἱ συνεργοί μου
  choice: मेरे सहकर्मी
  rationale: सहकर्मी मिलकर काम करने वाले साथियों का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; मेरे से μου का संबंध भी स्पष्ट रहता है।
theological_decisions: []
