  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a].
translation:
  language: hi
  text: हमारे पिता परमेश्वर और प्रभु यीशु मसीह की ओर से तुम्हें अनुग्रह और शांति मिले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस के अभिवादन में यह शब्द सामान्य शुभकामना के साथ परमेश्वर की कृपा का गहरा धार्मिक अर्थ भी रखता है; ‘अनुग्रह’ दोनों पहलुओं को सुरक्षित रखता है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: बहुवचन दत्तिव को हिन्दी आशीर्वचन में स्वाभाविक रूप से ‘तुम्हें’ कहा गया है।
- source_word: εἰρήνη
  choice: शांति
  rationale: यह प्रचलित और अर्थपूर्ण समतुल्य है, जो अभिवादन तथा शालोम-सदृश समग्र कुशलता की प्रतिध्वनि दोनों रखता है।
- source_word: ἀπὸ
  choice: की ओर से
  rationale: यह अनुग्रह और शांति के स्रोत को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: हमारे पिता परमेश्वर
  rationale: 'यूनानी पदबंध को समानाधिकरण के रूप में लिया गया है: परमेश्वर ही हमारे पिता हैं। यह हिन्दी में स्वाभाविक भी है और ‘हमारे परमेश्वर और पिता’ जैसी भिन्न संरचना से बचता है।'
- source_word: κυρίου
  choice: प्रभु
  rationale: यह κύριος के सम्मानसूचक और मसीह-संबंधी दोनों बल को सुरक्षित रखता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: ‘मसीह’ Χριστός के अभिषिक्त उद्धारकर्ता वाले पदवीगत अर्थ को हिन्दी की स्थापित बाइबलीय भाषा में स्पष्ट रखता है।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστοῦ का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीस्त
  rationale: Χριστός मूलतः पदवी है; ‘मसीह’ उसका अर्थ हिन्दी पाठक के लिए सुरक्षित रखता है और इसे केवल नाम-सदृश लिप्यंतरण नहीं बनाता।
- issue: अनुग्रह और शांति का स्रोत
  choice: पिता परमेश्वर और प्रभु यीशु मसीह—दोनों से जुड़ा एक संयुक्त स्रोत-वाक्यांश
  alternative: वाक्य को इस प्रकार खोलना कि दोनों की भूमिकाएँ अलग-अलग बताई जाएँ
  rationale: यूनानी पाठ एक ही ἀπὸ के अंतर्गत दोनों को रखता है; अनुवाद उसी संरचनात्मक और धर्मवैज्ञानिक तनाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘तुम्हें’ मूल बहुवचन ὑμῖν के अनुरूप है और पत्र के प्राप्तकर्ताओं के लिए स्वाभाविक है। हिन्दी में पूर्ण और सहज आशीर्वचन बनाने के लिए ‘मिले’ जोड़ा गया है; इससे मूल के निहित कामनार्थक भाव को स्पष्ट किया गया है।
