source:
  edition: SBLGNT
  text: ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ ⸀τοῦ ἐν ἡμῖν εἰς ⸀Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/006.yaml
  text: so that the fellowship of your faith may become effective in the knowledge of every good thing that is in us for the Messiah[a][b][c][d][e].
translation:
  language: hi
  text: ताकि तुम्हारे विश्वास की साझेदारी[a][b] हर एक अच्छी बात की पहचान के द्वारा प्रभावी हो जाए, जो हममें[c] मसीह के लिए[d][e] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे विश्वास में सहभागिता” अथवा “तुम्हारे विश्वास को साझा करना।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “विश्वास” के लिए प्रयुक्त यूनानी शब्द का अर्थ कुछ संदर्भों में “विश्वासयोग्यता” या “भरोसा” भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: कुछ पांडुलिपियों में “हममें” के स्थान पर “तुममें” है।
    reason: textual_variant
  - marker: d
    text: या, “मसीह की ओर।” “मसीह” यूनानी उपाधि Χριστός के लिए प्रयुक्त है।
    reason: lexical_alternative
  - marker: e
    text: या, “हर एक अच्छी बात की, जो हममें है और मसीह के लिए है।”
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὅπως
  choice: ताकि
  rationale: यह पौलुस की प्रार्थना के उद्देश्य या अभिप्राय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κοινωνία
  choice: सहभागिता
  rationale: यह शब्द सहभागिता, संगति, साझेदारी या बाँटने के भाव को समेट सकता है। ‘सहभागिता’ सामुदायिक और सक्रिय दोनों पहलुओं को खुला रखती है।
- source_word: πίστεώς
  choice: विश्वास
  rationale: यहाँ सामान्य और संदर्भानुकूल अर्थ ‘विश्वास’ है; ‘विश्वासयोग्यता’ या ‘भरोसा’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: ἐνεργὴς γένηται
  choice: प्रभावशाली हो जाए
  rationale: यह बनने या सिद्ध होने के भाव के साथ सक्रिय और फलदायी प्रभाव को व्यक्त करता है।
- source_word: ἐν ἐπιγνώσει
  choice: ज्ञान में
  rationale: ἐν का सीधा संबंध बनाए रखते हुए पहचान या गहरे ज्ञान के भाव को सरल हिन्दी में रखा गया है; ‘के द्वारा’ भी सम्भव है, पर वह साधनार्थ को अधिक निश्चित कर देता।
- source_word: παντὸς ἀγαθοῦ
  choice: हर उस अच्छी बात
  rationale: नपुंसकलिंग एकवचन पदबंध का स्वाभाविक अर्थ ‘हर अच्छी बात’ है; ‘वरदान’ कहना स्रोत से अधिक विशिष्ट होता।
- source_word: τοῦ ἐν ἡμῖν
  choice: जो हममें ... है
  rationale: SBLGNT के ἡμῖν को बनाए रखा गया है और संबंधवाचक रचना से इसे ‘हर अच्छी बात’ के साथ जोड़ा गया है।
- source_word: εἰς Χριστόν
  choice: मसीह के लिए
  rationale: εἰς यहाँ दिशा, लक्ष्य या संदर्भ का कठिन संबंध व्यक्त करता है। ‘के लिए’ सहज हिन्दी है और इसे अत्यधिक व्याख्यायित नहीं करता।
theological_decisions:
- issue: κοινωνία τῆς πίστεώς σου का अर्थ
  choice: ‘तुम्हारे विश्वास की सहभागिता’—ऐसी खुली रचना जिसमें विश्वास को साझा करने और विश्वास में सहभागी होने, दोनों की गूँज रह सकती है
  alternative: ‘तुम्हारे विश्वास को बाँटना’ अथवा ‘तुम्हारे विश्वास में सहभागिता’
  rationale: यूनानी पदबंध का अर्थ विवादित है। मुख्य पाठ किसी एक व्याख्या को पूरी तरह निश्चित नहीं करता, जबकि पादटिप्पणी अधिक स्पष्ट विकल्प देती है।
- issue: ‘हममें’ का संदर्भ
  choice: मुद्रित यूनानी पाठ के अनुसार सामूहिक ‘हममें’
  alternative: कुछ पांडुलिपियों के अनुसार ‘तुममें’
  rationale: मुख्य पाठ ἐν ἡμῖν को अनुसरता है और पाठांतर को पादटिप्पणी में सुरक्षित रखता है।
- issue: εἰς Χριστόν का संबंध
  choice: ‘मसीह के लिए’ को निकटवर्ती ‘अच्छी बात’ से संबद्ध रखा गया है
  alternative: इसे पूरी क्रिया—विश्वास की सहभागिता के प्रभावशाली होने—की मसीह की ओर उन्मुखता के रूप में समझना
  rationale: यूनानी वाक्य-विन्यास संबंध में कुछ खुलापन रखता है; मुख्य पाठ निकटतम संबंध दर्शाता है, पर पादटिप्पणी वैकल्पिक संयोजन सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रार्थनात्मक उद्देश्य-वाक्य। कठिन यूनानी संबंधों को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं किया गया; प्रमुख शाब्दिक, पाठगत और वाक्य-विन्यास संबंधी विकल्प पादटिप्पणियों में दिए गए हैं।
