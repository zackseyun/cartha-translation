  text: τόν ποτέ σοι ἄχρηστον νυνὶ ⸀δὲ σοὶ καὶ ἐμοὶ εὔχρηστον,
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/011.yaml
  text: who once was useless to you[a], but now is useful both to you and to me,
translation:
  language: hi
  text: जो पहले तुम्हारे लिए अनुपयोगी था[a], पर अब तुम्हारे और मेरे—दोनों के लिए उपयोगी है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ पौलुस शायद ‘उनेसिमुस’ नाम पर शब्द-क्रीड़ा करता है; यह नाम ‘उपयोगी’ या ‘लाभदायक’ होने के विचार से जुड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τόν
  choice: जो
  rationale: यह संबंधवाचक रूप में पिछले पद के उनेसिमुस की ओर संकेत करता है और हिन्दी में चलते हुए वाक्य को स्वाभाविक रूप से जोड़ता है।
- source_word: ποτέ
  choice: पहले
  rationale: यह बीते समय को व्यक्त करता है और νυνὶ (‘अब’) के साथ स्पष्ट कालगत विरोध बनाता है।
- source_word: σοι
  choice: तुम्हारे लिए
  rationale: ἄχρηστον के साथ संबंधसूचक दत्तिव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἄχρηστον
  choice: अनुपयोगी
  rationale: ‘काम का न होना’ वाला मूल अर्थ स्पष्ट रखता है और εὔχρηστον के साथ शब्दगत विरोध को सुरक्षित रखता है।
- source_word: νυνὶ δὲ
  choice: पर अब
  rationale: δέ के विरोधसूचक बल तथा ποτέ और νυνί के कालगत विरोध, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σοὶ καὶ ἐμοὶ
  choice: तुम्हारे और मेरे—दोनों के लिए
  rationale: दोनों दत्तिव पदों को संतुलित ढंग से व्यक्त करता है; ‘दोनों’ युग्म पर स्वाभाविक बल देता है।
- source_word: εὔχρηστον
  choice: उपयोगी
  rationale: आधुनिक हिन्दी में सटीक अर्थ देता है, ἄχρηστον के साथ सीधा विरोध बनाए रखता है और उनेसिमुस के नाम से संभावित शब्द-क्रीड़ा को भी यथासंभव सुरक्षित रखता है।
theological_decisions:
- issue: उनेसिमुस के नाम पर संभावित शब्द-क्रीड़ा और उसके जीवन में परिवर्तन
  choice: मुख्य पाठ में केवल ‘अनुपयोगी/उपयोगी’ का सीधा विरोध बनाए रखा गया है।
  alternative: शब्द-क्रीड़ा को अधिक स्पष्ट करने के लिए अर्थ-विस्तार करना, जैसे ‘अब सचमुच काम का हो गया है’।
  rationale: यूनानी पाठ स्वयं विरोध को स्पष्ट करता है, पर परिवर्तन का स्वरूप विस्तार से नहीं बताता। सीधा अनुवाद साहित्यिक प्रभाव और संभावित शब्द-क्रीड़ा बचाता है तथा अनावश्यक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अनुपयोगी/उपयोगी’ का समांतर विरोध मूल यूनानी की संरचना और संभावित नाम-संबंधी शब्द-क्रीड़ा को बनाए रखता है। पद पिछले वाक्य का अंश है, इसलिए अंत में अल्पविराम रखा गया है।
