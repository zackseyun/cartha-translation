  yaml_path: translation/nt/philemon/001/021.yaml
  text: Confident of your obedience[a], I wrote to you, knowing that you will do even more than I say.
translation:
  language: hi
  text: तुम्हारी आज्ञाकारिता पर भरोसा रखकर मैंने तुम्हें लिखा है, यह जानते हुए कि तुम जो मैं कहता हूँ उससे भी बढ़कर करोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मैं कह रहा हूँ, उससे भी आगे बढ़कर।” पौलुस संभवतः संकेत देता है कि फिलेमोन उसके विशेष अनुरोध से अधिक करेगा, लेकिन पाठ यह ठीक-ठीक नहीं बताता कि वह अतिरिक्त क्या करेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: भरोसा रखते हुए
  rationale: पूर्णकालिक कृदंत एक स्थापित और निरंतर विश्वास की अवस्था व्यक्त करता है। यह हिंदी अभिव्यक्ति कृदंतीय संबंध और पौलुस के भरोसे, दोनों को स्वाभाविक रूप से बनाए रखती है।
- source_word: τῇ ὑπακοῇ σου
  choice: तुम्हारी आज्ञाकारिता पर
  rationale: ὑπακοή का सीधा अर्थ आज्ञाकारिता है। ‘आज्ञाकारिता’ पौलुस की प्रेरितिक अपेक्षा को बनाए रखती है, जबकि ‘सहमति’ जैसे नरम शब्द मूल के नैतिक और संबंधपरक बल को घटा सकते हैं।
- source_word: ἔγραψά σοι
  choice: मैंने तुम्हें लिखा है
  rationale: यूनानी अओरिस्ट यहाँ पत्र-लेखन के कार्य को सूचित करता है। आधुनिक हिंदी में ‘लिखा है’ वर्तमान पत्र के संदर्भ में स्वाभाविक है और पाठक से उसके जीवित संबंध को स्पष्ट रखता है।
- source_word: εἰδὼς
  choice: क्योंकि मैं जानता हूँ
  rationale: पूर्णकालिक कृदंत पौलुस के निश्चित ज्ञान को उसके लिखने के आधार या साथ चलने वाली परिस्थिति के रूप में व्यक्त करता है। हिंदी में कारणसूचक उपवाक्य अधिक सहज है।
- source_word: καὶ ὑπὲρ ἃ λέγω
  choice: मेरे कहने से भी बढ़कर
  rationale: ὑπέρ के साथ कर्मकारक ‘जो मैं कहता हूँ उससे परे/अधिक’ का अर्थ देता है। यह रूप अतिरिक्त कार्य की अपेक्षा को व्यक्त करता है, पर उसकी प्रकृति को अनिर्दिष्ट छोड़ता है।
- source_word: ποιήσεις
  choice: तुम ... करोगे
  rationale: ποιέω का भविष्यकाल व्यापक और खुला हुआ है। ‘करोगे’ उसी अनिर्दिष्टता को बनाए रखता है और कोई विशेष अतिरिक्त कार्य नहीं जोड़ता।
theological_decisions:
- issue: पौलुस की अपील के संबंध में ὑπακοή का बल
  choice: ‘आज्ञाकारिता’
  alternative: ‘सहमति’ या ‘बात मानने की तत्परता’
  rationale: मूल शब्द आज्ञाकारिता का स्पष्ट भाव रखता है। इसे बनाए रखने से पत्र में प्रेरितिक अधिकार का संबंधपरक आयाम सुरक्षित रहता है, पर पाठ में जबरदस्ती का भाव नहीं जोड़ा जाता।
- issue: ‘मेरे कहने से भी बढ़कर’ का संकेत
  choice: अपेक्षित अतिरिक्त कार्य को खुला और अनिर्दिष्ट रखा गया है।
  alternative: इसे उनेसिमुस को स्वतंत्र करने या केवल उदारतापूर्वक ग्रहण करने के स्पष्ट निर्देश के रूप में समझना।
  rationale: पौलुस के शब्द संकेतपूर्ण हैं, पर यह नहीं बताते कि फिलेमोन ठीक कौन-सा अतिरिक्त कार्य करेगा। अनुवाद इस वास्तविक अस्पष्टता और व्याख्यात्मक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप। ‘आज्ञाकारिता’ मूल के स्पष्ट नैतिक बल को रखती है; वाक्य का अंतिम भाग जानबूझकर खुला छोड़ा गया है।
