lexical_decisions:
- source_word: ὃν
  choice: उसे
  rationale: यह पुल्लिंग एकवचन संबंधवाचक सर्वनाम उनेसिमुस की ओर संकेत करता है। हिन्दी में पिछले वाक्य से संबंध स्पष्ट होने के कारण ‘उसे’ स्वाभाविक है।
- source_word: ἐβουλόμην
  choice: मैं ... रखना चाहता था
  rationale: अपूर्ण भूतकाल में पौलुस की उस समय की इच्छा व्यक्त होती है; ‘चाहता था’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πρὸς ἐμαυτὸν κατέχειν
  choice: अपने पास रखना
  rationale: इस संदर्भ में इसका अर्थ उनेसिमुस को अपने साथ बनाए रखना है। ‘अपने पास रखना’ संबंधपरक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य सूचित करता है; ‘ताकि’ आधुनिक हिन्दी में इस प्रयोजन को स्पष्ट रखता है।
- source_word: ὑπὲρ σοῦ
  choice: तुम्हारी ओर से
  rationale: यह फिलेमोन के प्रतिनिधि के रूप में या उसके हित में की जाने वाली सेवा का भाव देता है, बिना कठोर प्रतिस्थापन का अर्थ थोपे।
- source_word: μοι διακονῇ
  choice: मेरी सेवा करे
  rationale: διακονέω यहाँ सहायता और सेवा के व्यापक अर्थ में है। ‘सेवा करे’ कलीसियाई पद का अनावश्यक संकेत दिए बिना अर्थ व्यक्त करता है।
- source_word: ἐν τοῖς δεσμοῖς
  choice: बंधनों में
  rationale: δεσμοί का ठोस अर्थ बेड़ियाँ या बंधन है और यह कैद को भी सूचित करता है। ‘बंधनों में’ पौलुस की सजीव अभिव्यक्ति बनाए रखता है।
- source_word: τοῦ εὐαγγελίου
  choice: सुसमाचार के
  rationale: यूनानी संबंधकारक को संक्षिप्त रूप में बनाए रखा गया है, जिससे सुसमाचार से जुड़े अथवा उसके कारण आए बंधनों का अर्थ खुला रहता है।
theological_decisions:
- issue: δεσμοῖς के साथ τοῦ εὐαγγελίου का संबंध
  choice: सुसमाचार के बंधनों
  alternative: सुसमाचार के कारण बंधनों
  rationale: मुख्य पाठ यूनानी संबंधकारक की संक्षिप्तता और अर्थगत तनाव बनाए रखता है; कारणसूचक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपने पास रखना’, ‘तुम्हारी ओर से’ और ‘मेरी सेवा करे’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि ‘सुसमाचार के बंधनों’ में मूल की संक्षिप्त और सजीव अभिव्यक्ति सुरक्षित है।
