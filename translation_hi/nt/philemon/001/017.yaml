  text: So if you consider me a partner[a], receive him as you would me.
translation:
  language: hi
  text: इसलिए यदि तुम मुझे अपना सहभागी मानते हो, तो उसे वैसा ही स्वीकार करो जैसा मुझे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका स्वागत करो।” इस क्रिया में किसी को अनुकूलता से ग्रहण करने या संगति में स्वीकार करने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: इसलिए यदि
  rationale: यह अनुवाद οὖν के निष्कर्षसूचक संबंध और εἰ की शर्त—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔχεις κοινωνόν
  choice: तुम मुझे अपना सहभागी मानते हो
  rationale: κοινωνός साझा भागीदारी और संबंध रखने वाले व्यक्ति को दर्शाता है। ‘सहभागी’ इस पारस्परिक संबंध को व्यक्त करता है, और ‘मानते हो’ हिन्दी में ἔχεις की मुहावरेदार शक्ति स्पष्ट करता है।
- source_word: προσλαβοῦ
  choice: स्वीकार करो
  rationale: मध्यवाच्य आज्ञार्थक क्रिया में अनुकूलता से ग्रहण करने, स्वागत करने और संगति में स्वीकार करने का भाव हो सकता है। ‘स्वीकार करो’ इस अर्थ-परास को अपेक्षाकृत खुला रखता है।
- source_word: αὐτὸν
  choice: उसे
  rationale: यह कर्मकारक सर्वनाम प्रसंग में उनेसिमुस की ओर संकेत करता है।
- source_word: ὡς ἐμέ
  choice: ऐसे ... जैसे मुझे करते
  rationale: यह हिन्दी की स्वाभाविक तुलना के द्वारा स्पष्ट करता है कि उनेसिमुस को उसी प्रकार स्वीकार किया जाए जिस प्रकार पौलुस को किया जाता।
theological_decisions:
- issue: पौलुस की विनती में κοινωνός का संबंधपरक अर्थ
  choice: सहभागी
  alternative: साथी; साझेदार; संगति में सहभागी
  rationale: ‘सहभागी’ साझा भागीदारी और पारस्परिक संबंध व्यक्त करता है, पर किसी विशिष्ट सांप्रदायिक या तकनीकी धर्मवैज्ञानिक अर्थ को आरोपित नहीं करता।
- issue: προσλαβοῦ की संबंधपरक व्यापकता
  choice: स्वीकार करो
  alternative: स्वागत करो
  rationale: ‘स्वीकार करो’ व्यक्तिगत स्वागत और संबंध अथवा संगति में अनुकूलतापूर्वक ग्रहण करने—दोनों संभावनाओं को बनाए रखता है; ‘स्वागत करो’ अर्थ को आतिथ्य की ओर कुछ अधिक सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और संबंधपरक रूप अपनाया गया है। वाक्य में पौलुस की शर्तयुक्त विनती और उनेसिमुस को अपने समान मानकर स्वीकार करने का बल सुरक्षित रखा गया है।
