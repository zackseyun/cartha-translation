  yaml_path: translation/nt/philemon/001/020.yaml
  text: Yes[a], brother, let me have benefit from you in the Lord[c][b]; refresh my heart in Messiah.
translation:
  language: hi
  text: हाँ, भाई, प्रभु में मुझे तुमसे लाभ हो[a]। मसीह[c] में मेरे हृदय को विश्राम दो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं तुमसे लाभ पाऊँ,” अथवा “मुझे तुमसे आनन्द मिले।” यहाँ पौलुस सम्भवतः उनेसिमुस के नाम और लाभदायक या उपयोगी होने के विचार पर शब्द-क्रीड़ा कर रहे हैं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “मेरे भीतरी अंग”; यह गहरी भावनाओं या भीतरी अस्तित्व के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: या “ख्रीस्त”; यूनानी Χριστός एक उपाधि है, जिसका अर्थ “अभिषिक्त जन” है।
    reason: translation_alternative
lexical_decisions:
- source_word: ναί
  choice: हाँ
  rationale: यह आत्मीय सहमति के साथ पौलुस की विनती आरम्भ करता है; आधुनिक हिन्दी में ‘हाँ’ इसका सीधा और स्वाभाविक रूप है।
- source_word: ἀδελφέ
  choice: भाई
  rationale: एकवचन सम्बोधन फिलेमोन को सहविश्वासी भाई के रूप में सीधे पुकारता है।
- source_word: ἐγώ σου ὀναίμην
  choice: मुझे तुमसे लाभ मिले
  rationale: ὀναίμην इच्छा या विनती व्यक्त करने वाला रूप है और इसका मूल भाव लाभ पाना है। यह अनुवाद विनती को बनाए रखता है तथा उनेसिमुस के नाम से सम्भावित शब्द-क्रीड़ा के लिए ‘लाभ’ को सुरक्षित रखता है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह पौलुस का परिचित प्रयोग है, जो विनती को प्रभु से जुड़े सम्बन्ध और जीवन-क्षेत्र के भीतर रखता है।
- source_word: ἀνάπαυσόν
  choice: ताज़गी दो
  rationale: आज्ञार्थक क्रिया यहाँ राहत, प्रोत्साहन और नवीनीकरण देने की ठोस विनती है; यही अभिव्यक्ति 1:7 के भाव से भी जुड़ती है।
- source_word: μου τὰ σπλάγχνα
  choice: मेरे हृदय को
  rationale: शाब्दिक अर्थ ‘मेरे भीतरी अंग’ है, पर यूनानी मुहावरे में यह गहरी भावनाओं या भीतरी अस्तित्व को दर्शाता है; ‘हृदय’ स्वाभाविक हिन्दी समतुल्य है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उसके अभिषिक्त जन वाले अर्थ को स्वाभाविक और परम्परागत हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: Χριστῷ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ शब्द उपाधि-सूचक है, इसलिए अर्थपूर्ण हिन्दी उपाधि ‘मसीह’ को चुना गया है; ‘ख्रीस्त’ यूनानी शब्द का निकटतर लिप्यन्तरण है।
- issue: κυρίῳ का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: पौलुस के इस प्रयोग में ‘प्रभु’ स्थापित और सन्दर्भानुकूल उपाधि है; ‘स्वामी’ दास-मालिक सम्बन्ध को अनावश्यक रूप से प्रमुख कर सकता है।
translation_notes:
  register: भाषा आधुनिक, आत्मीय और गरिमापूर्ण रखी गई है। ‘मुझे तुमसे लाभ मिले’ मूल के विनती-सूचक रूप और सम्भावित शब्द-क्रीड़ा को बचाता है। दूसरे वाक्य में ‘हृदय को ताज़गी दो’ शाब्दिक मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है और पद 7 की प्रतिध्वनि बनाए रखता है।
