source:
  edition: SBLGNT
  text: ⸀χαρὰν γὰρ ⸂πολλὴν ἔσχον⸃ καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.
base_translation:
  language: en
  yaml_path: translation/nt/philemon/001/007.yaml
  text: For I had much joy and encouragement because of your love[a], because the hearts of the saints have been refreshed through you, brother.
translation:
  language: hi
  text: क्योंकि तुम्हारे प्रेम के कारण मुझे बहुत आनन्द और प्रोत्साहन मिला, क्योंकि तुम्हारे द्वारा पवित्र जनों के हृदय[a] तरोताज़ा हुए हैं, भाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भीतरी अंग”; यूनानी मुहावरे में यह अंतरतम और गहरी भावनाओं को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χαρὰν
  choice: आनन्द
  rationale: χαρά के सामान्य अर्थ ‘आनन्द’ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: πολλὴν ἔσχον
  choice: मुझे बहुत … मिला है
  rationale: यूनानी पदबंध किसी अनुभव को प्राप्त करने या उसका अनुभव होने को व्यक्त करता है; हिन्दी में ‘मुझे बहुत … मिला है’ स्वाभाविक है और πολλήν की मात्रा को बनाए रखता है।
- source_word: παράκλησιν
  choice: प्रोत्साहन
  rationale: सन्दर्भ में यह फिलेमोन के प्रेम से पौलुस को मिले उत्साह और बल को दर्शाता है; ‘सान्त्वना’ सम्भव है, पर यहाँ ‘प्रोत्साहन’ अधिक उपयुक्त है।
- source_word: ἐπὶ τῇ ἀγάπῃ σου
  choice: तुम्हारे प्रेम से
  rationale: 'ἐπί के कारणसूचक भाव को सहज हिन्दी में व्यक्त करता है: फिलेमोन का प्रेम पौलुस के आनन्द और प्रोत्साहन का आधार है।'
- source_word: ἀγάπῃ
  choice: प्रेम
  rationale: ἀγάπη का मानक, स्पष्ट और धर्मवैज्ञानिक रूप से निष्पक्ष हिन्दी रूप।
- source_word: σπλάγχνα
  choice: हृदय
  rationale: शाब्दिक रूप से भीतरी अंगों के लिए प्रयुक्त यह शब्द यूनानी मुहावरे में गहरी भावनाओं और अंतरतम को दर्शाता है; ‘हृदय’ इसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: τῶν ἁγίων
  choice: पवित्र जनों के
  rationale: पौलुस के प्रयोग में यह परमेश्वर के लिए अलग किए गए विश्वासियों को दर्शाता है; ‘पवित्र जन’ बाद की औपचारिक संत-उपाधि का अनावश्यक आभास दिए बिना मूल अर्थ बनाए रखता है।
- source_word: ἀναπέπαυται
  choice: तरोताज़ा हुए हैं
  rationale: पूर्णकालीन रूप उस वर्तमान परिणाम को दर्शाता है जो फिलेमोन की सेवा से उत्पन्न हुआ; ‘तरोताज़ा हुए हैं’ विश्राम, राहत और नई शक्ति के संयुक्त भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: διὰ σοῦ
  choice: तुम्हारे द्वारा
  rationale: διά के साथ सम्बन्धकारक यहाँ माध्यम या कर्तृत्व का भाव देता है, जिसे ‘तुम्हारे द्वारा’ सीधे रूप में बनाए रखता है।
- source_word: ἀδελφέ
  choice: भाई
  rationale: प्रत्यक्ष पारिवारिक सम्बोधन को बिना अतिरिक्त विशेषण जोड़े सुरक्षित रखता है।
theological_decisions:
- issue: τῶν ἁγίων का अनुवाद
  choice: पवित्र जनों के
  alternative: सन्तों के; परमेश्वर के लोगों के
  rationale: ‘पवित्र जन’ विश्वासियों के परमेश्वर के लिए अलग किए जाने का पौलुसी भाव सुरक्षित रखता है और हिन्दी में ‘सन्त’ से जुड़ी बाद की औपचारिक उपाधि की सम्भावना से बचता है।
- issue: σπλάγχνα का मानव-स्वभाव सम्बन्धी मुहावरा
  choice: हृदय
  alternative: अंतरतम; गहरी भावनाएँ
  rationale: यह शब्द केवल भावनाओं तक सीमित न होकर व्यक्ति के गहरे भीतरी जीवन को दर्शाता है। ‘हृदय’ पाठ में स्वाभाविक है, जबकि पादटिप्पणी अधिक शाब्दिक अर्थ स्पष्ट करती है।
- issue: ἀναπέπαυται में विश्राम और ताज़गी का भाव
  choice: तरोताज़ा हुए हैं
  alternative: विश्राम मिला है; राहत मिली है
  rationale: इस सन्दर्भ में क्रिया फिलेमोन की सेवा से पवित्र जनों को मिली राहत और नई शक्ति दोनों को सूचित करती है; चुना हुआ रूप इस व्यापक भाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामुदायिक-पास्तरीय लहजा रखा गया है। मूल के दो कारणसूचक सम्बन्धों को ‘क्योंकि … क्योंकि …’ द्वारा सुरक्षित रखा गया है, और अन्त का सम्बोधन ‘भाई’ यूनानी शब्दक्रम के निकट रखा गया है।
