source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: hi
  text: और वह कह रहा था, “इसी कारण मैंने तुमसे कहा है कि कोई भी मेरे पास नहीं आ सकता, जब तक पिता की ओर से उसे कुछ न दिया गया हो[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रदान किया गया हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: कह रहा था
  rationale: अपूर्ण भूतकाल की जारी वाणी का पक्ष बनाए रखता है; केवल ‘कहा’ की अपेक्षा यूनानी क्रिया के रूप के अधिक निकट है।
- source_word: Διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पद पिछले कथन की ओर संकेत करते हुए वर्तमान स्पष्टीकरण प्रस्तुत करता है।
- source_word: εἴρηκα
  choice: मैंने तुमसे कहा है
  rationale: पूर्णकाल पहले कही गई बात की वर्तमान प्रासंगिकता दर्शाता है; ‘तुमसे’ ὑμῖν को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐδεὶς δύναται
  choice: कोई भी ... नहीं आ सकता
  rationale: यह अनुमति नहीं, बल्कि सामर्थ्य अथवा योग्यता के अभाव को व्यक्त करता है।
- source_word: ἐλθεῖν πρός με
  choice: मेरे पास ... आ सकता
  rationale: यूहन्ना के प्रसंग में यह स्वाभाविक और अर्थपूर्ण अभिव्यक्ति है; इसके विश्वास-संबंधी आशय को अनावश्यक रूप से विस्तार नहीं दिया गया।
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: जब तक यह उसे ... न दिया गया हो
  rationale: निष्क्रिय और पूर्ण परिणाम वाले भाव को बनाए रखता है तथा दी गई वस्तु को स्रोत की तरह ही अनिर्दिष्ट छोड़ता है। हिन्दी का ‘उसे’ सामान्य मानवीय संदर्भ में स्त्री और पुरुष दोनों के लिए प्रयुक्त हो सकता है।
- source_word: ἐκ τοῦ πατρός
  choice: पिता की ओर से
  rationale: ἐκ के स्रोत या उद्गम के भाव को सुरक्षित रखता है और इसे केवल कर्तृवाचक ‘पिता के द्वारा’ में नहीं बदलता।
theological_decisions:
- issue: यीशु के पास आने में परमेश्वर की ओर से मिलने वाली सामर्थ्य और मनुष्य की क्षमता
  choice: पिता की ओर से दिए जाने को यीशु के पास आने की आवश्यक शर्त के रूप में सीधे व्यक्त किया गया है।
  alternative: इसे किसी विशेष मत के अनुसार अनिवार्य प्रभावकारी बुलाहट या सबको मिलने वाली पूर्वगामी सामर्थ्य के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ आवश्यक ईश्वरीय प्रदान को बताता है, पर उसके स्वरूप, विस्तार और मानवीय प्रत्युत्तर के संबंध को यहाँ व्यवस्थित रूप से परिभाषित नहीं करता।
- issue: αὐτῷ का पुल्लिंग एकवचन किंतु सामान्य प्रयोग
  choice: ‘उसे’
  alternative: ‘उस व्यक्ति को’
  rationale: हिन्दी में ‘उसे’ लिंग-चिह्नित नहीं है, इसलिए यह यूनानी के एकवचन सामान्य संदर्भ को स्वाभाविक ढंग से व्यक्त करता है, बिना अर्थ को बहुवचन बनाने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। ‘यह’ मूल पाठ में अनिर्दिष्ट रूप से दी गई बात को अनिर्दिष्ट ही रखता है; ‘सामर्थ्य’ या ‘अनुमति’ जोड़कर उसका अर्थ सीमित नहीं किया गया।
