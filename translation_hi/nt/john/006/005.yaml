id: JHN.6.5
reference: John 6:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: hi
  text: इसलिए यीशु ने आँखें उठाकर देखा कि एक बड़ी भीड़ उसकी ओर आ रही है, और फिलिप्पुस से कहा, “हम इनके खाने के लिए रोटियाँ कहाँ से खरीदें?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπάρας ... τοὺς ὀφθαλμοὺς
  choice: आँखें उठाकर
  rationale: यह यूनानी मुहावरे का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से कथात्मक और निष्कर्षात्मक संबंध बनाए रखता है; यहाँ इसे छोड़ना उचित नहीं।
- source_word: θεασάμενος
  choice: देखा
  rationale: यह सचेत रूप से दृष्टि डालने और सामने की स्थिति को देखने का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: πολὺς ὄχλος
  choice: एक बड़ी भीड़
  rationale: πολύς यहाँ भीड़ के आकार/संख्या को बताता है; आधुनिक हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: ἔρχεται πρὸς αὐτόν
  choice: उसकी ओर आ रही है
  rationale: दिशासूचक πρός और चल रही क्रिया, दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: λέγει πρὸς Φίλιππον
  choice: फिलिप्पुस से कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथानक के स्वाभाविक भूतकाल में व्यक्त किया गया है।
- source_word: Πόθεν
  choice: कहाँ से
  rationale: स्रोत या उपलब्धि के स्थान का शाब्दिक भाव हिन्दी में भी स्वाभाविक है।
- source_word: ἀγοράσωμεν
  choice: हम ... खरीदें
  rationale: प्रथम पुरुष बहुवचन विचारात्मक उपवाचक का भाव ‘हम ... खरीदें’ से बना रहता है।
- source_word: ἄρτους
  choice: रोटियाँ
  rationale: बहुवचन ἄρτους को गिनने योग्य भोजन-इकाइयों के रूप में व्यक्त करता है और आगे की रोटियों की घटना से स्वाभाविक मेल रखता है।
- source_word: ἵνα φάγωσιν οὗτοι
  choice: इनके खाने के लिए
  rationale: उद्देश्य और निकट उपस्थित लोगों की ओर संकेत, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यीशु के प्रश्न में प्रथम पुरुष बहुवचन
  choice: “हम ... खरीदें?”
  alternative: “हम ... खरीद सकते हैं?”
  rationale: ‘हम ... खरीदें’ ἀγοράσωμεν के विचारात्मक उपवाचक और खुले प्रश्न को सुरक्षित रखता है; सामर्थ्य का भाव जोड़कर प्रश्न को चुपचाप पुनर्व्याख्यायित नहीं करता।
- issue: ऐतिहासिक वर्तमान और कृदन्तों का कथात्मक रूप
  choice: मुख्य क्रिया को हिन्दी भूतकाल में और पूर्ववर्ती क्रियाओं को स्वाभाविक क्रम में रखा गया
  alternative: “यीशु आँखें उठाता है ... और कहता है”
  rationale: यह सिद्धान्तगत निर्णय नहीं, कथाशैली का निर्णय है; हिन्दी में भूतकाल अधिक स्वाभाविक है और यूनानी घटनाक्रम फिर भी सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘फिलिप्पुस’ मूल यूनानी नाम के निकट प्रचलित बाइबलीय रूप है। पद में कोई पादटिप्पणी आवश्यक नहीं मानी गई; ‘रोटियाँ’ बहुवचन ἄρτους को सीधे व्यक्त करता है।
