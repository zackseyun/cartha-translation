base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: hi
  text: 'हमारे पूर्वजों[a] ने उजाड़ प्रदेश[b] में मन्ना खाया, जैसा कि लिखा है: “उसने उन्हें खाने के लिए स्वर्ग से रोटी दी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हमारे पिताओं।” यहाँ इसका अर्थ “हमारे पूर्वजों” है।
    reason: lexical_alternative
  - marker: b
    text: या “वीराने में” अथवा “रेगिस्तान में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: हमारे पिताओं
  rationale: यह यूनानी के शाब्दिक पुरुषवाचक रूप ‘हमारे पिता’ को बनाए रखता है और यहाँ इस्राएल की पिछली पीढ़ियों को सूचित करता है। अधिक स्वाभाविक ‘हमारे पूर्वजों’ को पादटिप्पणी में दिया गया है।
- source_word: τὸ μάννα
  choice: मन्ना
  rationale: निर्गमन-परंपरा के विशेष भोजन के लिए ‘मन्ना’ हिन्दी में स्थापित लिप्यंतरण है।
- source_word: ἔφαγον
  choice: खाया था
  rationale: भूतकाल की ऐतिहासिक घटना को स्वाभाविक हिन्दी में व्यक्त करता है; ‘था’ प्रसंग में उस पूर्व घटना को स्पष्ट करता है।
- source_word: ἐν τῇ ἐρήμῳ
  choice: निर्जन प्रदेश में
  rationale: ἔρημος के उजाड़ अथवा निर्जन भूभाग के व्यापक अर्थ को व्यक्त करता है और ‘जंगल’ से उत्पन्न वनाच्छादित क्षेत्र की आधुनिक धारणा से बचता है।
- source_word: καθώς ἐστιν γεγραμμένον
  choice: जैसा कि लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण का परिचित हिन्दी सूत्र है और लिखित गवाही के वर्तमान रूप से विद्यमान होने का भाव बनाए रखता है।
- source_word: Ἄρτον
  choice: रोटी
  rationale: यहाँ ἄρτος किसी एक पाव के बजाय भोजन के रूप में दी गई रोटी को सूचित करता है; ‘रोटी’ इसका सहज हिन्दी समतुल्य है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से
  rationale: यह दैवी उद्गम से जुड़ी बाइबलीय अभिव्यक्ति को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: उसने उन्हें खाने के लिए ... दी
  rationale: देने, प्राप्तकर्ताओं और खाने के उद्देश्य—तीनों को सुरक्षित रखते हुए यूनानी संरचना को स्वाभाविक हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: मन्ना के उद्धरण में वक्ता की पहचान और आगे आने वाले मसीह-संबंधी अर्थ को समय से पहले स्पष्ट करना
  choice: ‘उसने’ और सामान्य ‘रोटी’ रखा गया है, बिना परमेश्वर का नाम जोड़ने या रोटी को विशेष धार्मिक पूँजीकरण/व्याख्या देने के।
  alternative: ‘परमेश्वर ने’ कहना या wording में यीशु को सच्ची रोटी के रूप में पहले ही स्पष्ट कर देना।
  rationale: यूनानी में कर्ता केवल क्रिया के तृतीय पुरुष एकवचन रूप में निहित है। प्रसंग से परमेश्वर समझे जा सकते हैं, पर अनुवाद को भीड़ के शास्त्रीय दावे तक सीमित रहना चाहिए ताकि आगे का यूहन्नाई मसीह-संबंधी विकास कथा में स्वयं उभरे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल शैली अपनाई गई है। ‘निर्जन प्रदेश’ आधुनिक पाठक के लिए ‘जंगल’ की संभावित वन-संबंधी गलतफहमी से बचते हुए निर्गमन के उजाड़ क्षेत्र का भाव देता है। उद्धरण में हिन्दी के स्वाभाविक शब्दक्रम का प्रयोग किया गया है।
