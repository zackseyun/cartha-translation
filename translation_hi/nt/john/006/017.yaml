source:
  edition: SBLGNT
  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: hi
  text: वे नाव में सवार हुए और समुद्र के उस पार कफरनहूम जा रहे थे।[a] अँधेरा पहले ही हो चुका था,[b] और यीशु अभी तक उनके पास नहीं आए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समुद्र की दूसरी ओर कफरनहूम जा रहे थे।”
    reason: पέραν τῆς θαλάσσης को समुद्र पार करने की दिशा अथवा समुद्र की दूसरी ओर स्थित गंतव्य के रूप में व्यक्त किया जा सकता है।
  - marker: b
    text: या, “अँधेरा पहले ही उतर चुका था।”
    reason: σκοτία ἤδη ἐγεγόνει का यह स्वाभाविक हिन्दी विकल्प भी पहले हुए परिवर्तन से उत्पन्न स्थिति को व्यक्त करता है।
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: वे नाव पर चढ़े
  rationale: अओरिस्ट कृदंत को स्वाभाविक हिन्दी में समन्वित क्रिया के रूप में व्यक्त किया गया है। इससे मुख्य क्रिया से पहले नाव पर चढ़ने का क्रम बना रहता है और भाषा बोझिल नहीं होती।
- source_word: ἤρχοντο
  choice: जा रहे थे
  rationale: इम्परफेक्ट क्रिया की जारी गति को हिन्दी के अपूर्ण भूतकाल से व्यक्त किया गया है; इससे यह अर्थ नहीं निकलता कि वे पहुँच चुके थे।
- source_word: πέραν τῆς θαλάσσης
  choice: समुद्र पार करके
  rationale: πέραν के पारगमन-संबंधी अर्थ और θάλασσα के ‘समुद्र’ अर्थ को बनाए रखते हुए यह हिन्दी में दिशा और जारी यात्रा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς Καφαρναούμ
  choice: कफरनहूम की ओर
  rationale: εἰς यहाँ गंतव्य की दिशा बताता है। जारी यात्रा के संदर्भ में ‘की ओर’ यह स्पष्ट किए बिना दिशा बताता है कि वे पहुँच गए थे।
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: अँधेरा पहले ही हो चुका था
  rationale: प्लूपरफेक्ट रूप पूर्व में घटित परिवर्तन से बनी वर्तमान कथात्मक स्थिति को दिखाता है; ‘हो चुका था’ उस परिणामकारी भाव को सुरक्षित रखता है।
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς
  choice: अभी तक उनके पास नहीं आए थे
  rationale: 'οὔπω और प्लूपरफेक्ट का संयुक्त भाव सुरक्षित है: उस समय तक यीशु उनके पास नहीं पहुँचे थे। ‘उनके पास’ πρὸς αὐτούς का सीधा और स्वाभाविक अनुवाद है।'
- source_word: ὁ Ἰησοῦς
  choice: यीशु
  rationale: व्यक्तिनाम का मानक हिन्दी रूप।
theological_decisions:
- issue: कथात्मक कालक्रम और क्रिया-पक्ष
  choice: नाव पर चढ़ने को पहले की पूर्ण घटना, यात्रा को जारी क्रिया, और अँधेरा होने तथा यीशु के न आने को उस समय तक बनी स्थितियों के रूप में रखा गया है।
  alternative: सभी क्रियाओं को साधारण भूतकाल में रखकर ‘वे गए’, ‘अँधेरा था’ और ‘यीशु नहीं आए’ कहना।
  rationale: यूनानी क्रियारूपों का पक्ष और कालक्रम आगे के वृत्तांत का तनाव बनाए रखते हैं। अनुवाद पाठ से आगे बढ़कर कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘जा रहे थे’ और ‘हो चुका था’ से यूनानी क्रिया-पक्ष सुरक्षित रखा गया है। स्थान और व्यक्तिनाम के प्रचलित हिन्दी रूप प्रयुक्त हैं।
