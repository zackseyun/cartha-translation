source:
  edition: SBLGNT
  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: hi
  text: क्योंकि मेरे पिता की इच्छा यह है कि हर कोई जो पुत्र को देखता है[a] और उस पर विश्वास करता है, अनन्त जीवन पाए; और मैं स्वयं[b] उसे अंतिम दिन जिला उठाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पुत्र को ध्यान से देखता है।’ यहाँ की क्रिया केवल आँखों से देख लेने के बजाय ध्यानपूर्वक देखने का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या केवल ‘मैं उसे जिला उठाऊँगा।’ यूनानी में ‘मैं’ स्पष्ट रूप से दिया गया है और उस पर बल है; इसलिए मुख्य पाठ में ‘मैं स्वयं’ कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  choice: क्योंकि ... यह है
  rationale: ‘क्योंकि’ γάρ के व्याख्यात्मक संबंध को पिछले कथन से जोड़ता है, और ‘यह है’ मूल वाक्य की संकेतात्मक संरचना को स्वाभाविक हिन्दी में रखता है।
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: मेरे पिता की इच्छा
  rationale: यह पदबंध परमेश्वर के लिए प्रयुक्त यीशु के संबंधपरक संबोधन ‘पिता’ और θέλημα के अर्थ ‘इच्छा/संकल्प’ को सीधे तथा सहज रूप में व्यक्त करता है।
- source_word: πᾶς ὁ θεωρῶν τὸν υἱὸν
  choice: हर कोई जो पुत्र को देखता है
  rationale: ‘हर कोई जो ... देखता है’ वर्तमान कृदन्त की सामान्य और सतत विशेषता को दर्शाता है। ‘पुत्र’ यूहन्ना के प्रसंग में मसीही उपाधि है। θεωρέω में ध्यानपूर्वक देखने का भाव भी हो सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: καὶ πιστεύων εἰς αὐτὸν
  choice: और उस पर विश्वास करता है
  rationale: πιστεύω εἰς किसी व्यक्ति की ओर निर्देशित विश्वास और भरोसे को व्यक्त करता है; ‘उस पर विश्वास करना’ आधुनिक हिन्दी में इसका स्वाभाविक रूप है।
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: अनन्त जीवन पाए
  rationale: ‘पाए’ ἵνα के अधीन प्रयुक्त संभावनार्थक क्रिया ἔχῃ को सहज हिन्दी में व्यक्त करता है, जबकि ‘अनन्त जीवन’ ζωὴ αἰώνιος का स्थापित और अर्थपूर्ण अनुवाद है।
- source_word: καὶ ἀναστήσω αὐτὸν ἐγώ
  choice: और मैं स्वयं उसे ... जिला उठाऊँगा
  rationale: ‘मैं स्वयं’ स्पष्ट और बलाघाती ἐγώ को सुरक्षित रखता है। ‘जिला उठाऊँगा’ अंतिम दिन के पुनरुत्थान को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: अंतिम दिन
  rationale: यह कालवाचक पदबंध का स्वाभाविक आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: πᾶς ὁ θεωρῶν ... καὶ πιστεύων में दायरा और शर्त
  choice: हर कोई जो पुत्र को देखता है और उस पर विश्वास करता है, अनन्त जीवन पाए
  alternative: जो कोई पुत्र को निहारता और उस पर विश्वास करता है, उसके पास अनन्त जीवन है
  rationale: अनुवाद उन सभी को समेटने वाली सामान्य कृदन्तीय रचना और देखने-विश्वास करने के संयुक्त वर्णन को बनाए रखता है। ‘पाए’ ἵνα + संभावनार्थक क्रिया की संरचना को दर्शाता है और चुनाव अथवा स्वतंत्र इच्छा संबंधी किसी सांप्रदायिक निष्कर्ष को पाठ में नहीं जोड़ता।
- issue: καὶ ἀναστήσω αὐτὸν ἐγώ में ἐγώ का बल
  choice: और मैं स्वयं उसे ... जिला उठाऊँगा
  alternative: और मैं उसे ... जिला उठाऊँगा
  rationale: ‘मैं स्वयं’ यीशु की व्यक्तिगत कर्तृता पर मूल यूनानी में दिए गए स्पष्ट बल को सुरक्षित रखता है, बिना अतिरिक्त धर्मसैद्धांतिक व्याख्या जोड़े।
- issue: ἀναστήσω का पुनरुत्थान-संबंधी अर्थ
  choice: जिला उठाऊँगा
  alternative: उठाऊँगा
  rationale: अंतिम दिन के प्रसंग में केवल ‘उठाऊँगा’ हिन्दी में शारीरिक रूप से उठाने का अर्थ दे सकता है। ‘जिला उठाऊँगा’ मूल क्रिया के प्रसंगगत पुनरुत्थान-अर्थ को स्पष्ट करता है, पर पुनरुत्थान की रीति के विषय में कुछ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुत्र’, ‘अनन्त जीवन’ और ‘अंतिम दिन’ जैसे प्रमुख यूहन्नाई पदों को परिचित धार्मिक शब्दावली में रखा गया है। वाक्य की व्याख्यात्मक शुरुआत, प्रतिज्ञा की संरचना और यीशु की कर्तृता पर मूल बल सुरक्षित हैं।
