translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यीशु के लिए हिन्दी का सामान्य आदरसूचक बहुवचन प्रयुक्त है। वाक्य की यूनानी संरचना का क्रम यथासंभव सुरक्षित रखते हुए हिन्दी में स्वाभाविक ‘तो’ लगाया गया है।
