source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ ⸀πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: hi
  text: इसलिए जब भीड़ ने देखा कि यीशु वहाँ नहीं थे और न ही उनके चेले, तो वे स्वयं नावों[a] में चढ़ गए और यीशु को ढूँढ़ते हुए कफरनहूम आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छोटी नावों’; यूनानी में ‘नाव’ के लिए लघुतासूचक रूप प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: इसलिए जब
  rationale: यह अनुवाद ὅτε के समय-संबंध और οὖν के कथात्मक परिणाम/संबंध—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ ὄχλος
  choice: भीड़
  rationale: ὄχλος यहाँ एकत्र लोगों के समूह को दर्शाता है; ‘भीड़’ स्पष्ट, सहज और प्रसंगानुकूल है।
- source_word: εἶδεν
  choice: देखा
  rationale: क्रिया का मूल अर्थ ‘देखना’ है। ‘समझ गई’ या ‘जान गई’ कहने से संज्ञानात्मक अर्थ अनावश्यक रूप से बढ़ जाता।
- source_word: οὐκ ἔστιν ἐκεῖ
  choice: वहाँ नहीं थे
  rationale: यूनानी में वर्तमानकालीन रूप कथात्मक सजीवता लिए हुए है; भूतकालीन हिन्दी कथन में ‘नहीं थे’ स्वाभाविक है। यीशु के लिए आदरसूचक बहुवचन रखा गया है।
- source_word: οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: और न ही उनके चेले
  rationale: यह यीशु और उनके चेलों—दोनों की अनुपस्थिति बताने वाले नकारात्मक समन्वय को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: ἐνέβησαν
  choice: में चढ़ गए
  rationale: ἐμβαίνω किसी नाव या जलयान में सवार होने को दर्शाता है; हिन्दी में नाव के साथ ‘चढ़ गए’ सहज है।
- source_word: αὐτοὶ
  choice: वे स्वयं
  rationale: 'अलग से प्रयुक्त αὐτοὶ का बल सुरक्षित रखा गया है: भीड़ के उन्हीं लोगों ने नावों में चढ़कर यात्रा की।'
- source_word: τὰ πλοιάρια
  choice: नावों
  rationale: πλοιάριον रूपतः लघुतासूचक है, पर प्रसंग में लघुता पर बल निश्चित नहीं है। मुख्य पाठ में सहज ‘नावों’ रखा गया है और ‘छोटी नावों’ का विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἦλθον εἰς Καφαρναούμ
  choice: कफरनहूम आए
  rationale: ἔρχομαι के ‘आना’ अर्थ को कथात्मक दृष्टिकोण सहित निकटता से व्यक्त करता है और हिन्दी में स्वाभाविक है।
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: यीशु को ढूँढ़ते हुए
  rationale: यहाँ ζητέω का अर्थ किसी को खोजने या पाने का प्रयत्न करना है। ‘ढूँढ़ते हुए’ तत्काल कथात्मक अर्थ देता है और ‘खोजते हुए’ में संभव आध्यात्मिक संकेत को नहीं बढ़ाता।
