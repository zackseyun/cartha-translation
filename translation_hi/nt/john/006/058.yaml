source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ⸀ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ ⸀πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ⸀ζήσει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: hi
  text: यह वह रोटी है जो स्वर्ग से उतरी है, वैसी नहीं जैसी पूर्वजों[a] ने खाई और मर गए। जो इस रोटी को खाता है, वह सदा जीवित रहेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘पिताओं’। यहाँ सम्भवतः इस्राएल के वे पूर्वज अभिप्रेत हैं जिन्होंने जंगल में मन्ना खाया था।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में, ‘युग में/युग के लिए जीवित रहेगा’; यह सदा बने रहने वाले जीवन का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: यह वह रोटी है
  rationale: संकेतवाचक और निश्चित पदबंध को स्वाभाविक हिन्दी में रखा गया है; प्रसंग में एक विशिष्ट रोटी की पहचान हो रही है।
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: जो स्वर्ग से उतरी है
  rationale: कर्तृवाचक भूतकालिक कृदंत को स्पष्ट सम्बन्धवाचक उपवाक्य में व्यक्त किया गया है और ἐξ का अर्थ ‘से’ सुरक्षित रखा गया है।
- source_word: οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον
  choice: यह उस रोटी जैसी नहीं है जिसे पूर्वजों ने खाया और फिर भी मर गए
  rationale: नकारात्मक तुलना को सहज हिन्दी में खोला गया है। ‘फिर भी’ तुलना का आशय स्पष्ट करता है कि उस रोटी को खाने वालों की मृत्यु हुई, बिना मूल कथन में कोई नया धर्मवैज्ञानिक निष्कर्ष जोड़े।
- source_word: οἱ πατέρες
  choice: पूर्वजों
  rationale: यह आधुनिक हिन्दी में इस्राएल के पहले के पितरों/बाप-दादों के लिए स्वाभाविक सामूहिक शब्द है; यूनानी के शाब्दिक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ὁ τρώγων
  choice: जो ... खाता है
  rationale: संज्ञात्मक वर्तमान कृदंत की सामान्य और निरंतर लागू होने वाली शक्ति को व्यक्त करता है। अधिक चित्रात्मक ‘चबाता है’ अनावश्यक रूप से अर्थ को संकीर्ण करता।
- source_word: τοῦτον τὸν ἄρτον
  choice: इस रोटी को
  rationale: संकेतवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: सदा जीवित रहेगा
  rationale: यूहन्ना में प्रयुक्त इस कालगत मुहावरे का स्वाभाविक हिन्दी अर्थ अनंत रूप से बने रहने वाले जीवन को व्यक्त करता है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: οἱ πατέρες का संकेत
  choice: पूर्वजों
  alternative: पिताओं / पितरों
  rationale: प्रसंग में संकेत संभवतः उन इस्राएली पूर्वजों की ओर है जिन्होंने जंगल में मन्ना खाया था। ‘पूर्वज’ आधुनिक पाठक के लिए स्पष्ट है, जबकि मूल का शाब्दिक पुरुषवाची रूप पादटिप्पणी में बताया गया है।
- issue: τρώγων की धर्मवैज्ञानिक व्याख्या
  choice: खाता है
  alternative: भोजन करता है / ग्रहण करता है
  rationale: ‘खाता है’ क्रिया के प्रत्यक्ष अर्थ को बनाए रखता है और इसे न तो केवल संस्कार-संबंधी अर्थ में और न केवल रूपकात्मक विश्वास के अर्थ में सीमित करता है।
- issue: ζήσει εἰς τὸν αἰῶνα की कालगत शक्ति
  choice: सदा जीवित रहेगा
  alternative: युग तक जीवित रहेगा / युग में जीवित रहेगा
  rationale: यह यूनानी मुहावरे का स्वाभाविक अर्थ देता है, जबकि शाब्दिक संरचना को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य स्तर रखा गया है। ‘पूर्वज’ सामान्य पाठक के लिए ‘पितर’ से अधिक सहज है। वाक्य-विन्यास को हिन्दी में स्पष्ट करने के लिए तुलना को अलग वाक्य में रखा गया है, पर मूल की रोटी, स्वर्ग से उतरने, पूर्वजों की मृत्यु और सदा के जीवन की सभी अर्थगत कड़ियाँ सुरक्षित हैं।
