id: JHN.6.51
reference: John 6:51
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: hi
  text: मैं वह जीवित रोटी हूँ जो स्वर्ग से उतरी है। यदि कोई इस रोटी में से खाए, तो वह सदा जीवित रहेगा। और जो रोटी मैं संसार के जीवन के लिए दूँगा, वह मेरा मांस है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄρτος ὁ ζῶν
  choice: जीवित रोटी
  rationale: ζῶν का विशेषणात्मक अर्थ सीधे व्यक्त होता है; ‘जीवन की रोटी’ कहना निकटवर्ती प्रसंग की अलग अभिव्यक्ति को यहाँ ले आएगा।
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: जो स्वर्ग से उतरी है
  rationale: अओरिस्ट कृदंत पूर्ण हुए अवतरण को दर्शाता है; हिन्दी में संबंधवाचक उपवाक्य स्वाभाविक है। ‘रोटी’ स्त्रीलिंग होने के कारण ‘उतरी है’ रखा गया है।
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: यदि कोई इस रोटी में से खाए
  rationale: ἐάν के साथ अओरिस्ट सब्जंक्टिव सामान्य शर्त व्यक्त करता है। ‘में से खाए’ ἐκ के अंशात्मक भाव को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: वह सदा जीवित रहेगा
  rationale: यूहन्ना में εἰς τὸν αἰῶνα अनंत काल तक बने रहने का मुहावरा है; ‘सदा’ इसका सहज आधुनिक हिन्दी समतुल्य है।
- source_word: ὁ ἄρτος δὲ ὃν ἐγὼ δώσω
  choice: और जो रोटी मैं ... दूँगा
  rationale: δέ यहाँ तीखा विरोध नहीं, बल्कि विचार की अगली कड़ी प्रस्तुत करता है; ‘और’ पर्याप्त है। भविष्यकालीन δώσω आने वाले आत्म-समर्पण को बनाए रखता है।
- source_word: ἡ σάρξ μού ἐστιν
  choice: वह मेरा मांस है
  rationale: σάρξ को ठोस और जानबूझकर तीखी अभिव्यक्ति ‘मांस’ से अनूदित किया गया है; ‘शरीर’ मूल शब्द की धार को नरम कर देता।
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: संसार के जीवन के लिए
  rationale: ὑπέρ का हितार्थक भाव ‘के लिए’ से स्वाभाविक रूप में आता है, और κόσμος की व्यापकता बनी रहती है।
- source_word: κόσμος
  choice: संसार
  rationale: यूहन्ना के व्यापक शब्द-संबंध को सुरक्षित रखता है और इसे केवल ‘मानवजाति’ कहकर संकुचित नहीं करता।
- source_word: τις ... ζήσει
  choice: कोई ... वह ... रहेगा
  rationale: ग्रीक के अनिश्चित एकवचन को हिन्दी के स्वाभाविक, लिंग-निरपेक्ष ‘कोई ... वह’ से व्यक्त किया गया है।
theological_decisions:
- issue: यीशु के आत्म-वर्णन में σάρξ का अर्थ
  choice: मुख्य पाठ में ‘मांस’
  alternative: ‘शरीर’
  rationale: यहाँ शब्द ठोस है और यीशु के आत्म-समर्पण से जुड़ा है। ‘शरीर’ कहना शब्दार्थ की तीव्रता घटाकर व्याख्यात्मक निष्कर्ष की ओर जा सकता है।
- issue: ‘संसार’ का दायरा
  choice: ‘संसार’ को बिना संकुचित किए बनाए रखना
  alternative: ‘मानवजाति’ अथवा कोई अधिक संकीर्ण समुदाय
  rationale: κόσμος की व्यापक और धर्मवैचारिक रूप से तनावपूर्ण भाषा को ज्यों का त्यों रखा गया है; अनुवाद किसी पद्धतिगत सीमा को पाठ में नहीं जोड़ता।
- issue: ‘स्वर्ग से उतरी’ का मसीह-विषयक बल
  choice: वास्तविक अवतरण को सीधे व्यक्त करना
  alternative: केवल रूपकात्मक ईश्वरीय भेजा जाना
  rationale: ग्रीक पूर्ण हुए अवतरण को स्पष्ट रूप से कहता है। अनुवाद इसे न तो हल्का करता है, न अतिरिक्त व्याख्या जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली। ‘जीवित रोटी’, ‘स्वर्ग से उतरी’, ‘सदा जीवित रहेगा’ और ‘मेरा मांस’ मूल की ठोस भाषा तथा यूहन्ना के धर्मवैचारिक तनाव को सुरक्षित रखते हैं। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई।
