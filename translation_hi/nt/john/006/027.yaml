  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: hi
  text: नाशवान भोजन के लिए परिश्रम मत करो, बल्कि उस भोजन के लिए जो अनन्त जीवन के लिए बना रहता है और जिसे मनुष्य का पुत्र तुम्हें देगा; क्योंकि परमेश्वर पिता ने उस पर अपनी मुहर लगाई है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “मुहर लगाई”; यह अभिव्यक्ति अनुमोदन, अधिकृत ठहराए जाने या प्रामाणिक ठहराए जाने का भाव प्रकट कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργάζεσθε μὴ ... ἀλλὰ
  choice: के लिए परिश्रम मत करो, बल्कि ... के लिए
  rationale: वर्तमानकालीन आज्ञा और स्पष्ट विरोध को स्वाभाविक हिन्दी में सुरक्षित रखता है। प्रसंग में क्रिया का आशय किसी वस्तु को पाने के लिए परिश्रम करना है।
- source_word: βρῶσιν τὴν ἀπολλυμένην
  choice: नाश हो जाने वाला भोजन
  rationale: βρῶσις का प्रसंगगत अर्थ ‘भोजन’ है और ἀπολλυμένην केवल सड़ने से अधिक व्यापक रूप से नष्ट या समाप्त हो जाने का भाव रखता है।
- source_word: τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον
  choice: वह भोजन जो अनन्त जीवन तक बना रहता है
  rationale: μένω के बने रहने के अर्थ तथा εἰς के लक्ष्य/सीमा-संबंधी भाव को निकटता से रखता है, बिना यह तय किए कि भोजन केवल जीवन देता है या अनन्त जीवन में बना रहता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की इस आत्म-पदवी के यूनानी रूप और उसके धर्मवैचारिक संकेतों को मानक हिन्दी में सुरक्षित रखता है।
- source_word: ὑμῖν δώσει
  choice: तुम्हें देगा
  rationale: भविष्यकाल और बहुवचन संबोधन को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐσφράγισεν
  choice: अपनी मुहर लगाई है
  rationale: मुहर के मूल रूपक को बनाए रखता है; प्रसंग में यह अनुमोदन, प्रामाणिकता या अधिकार दिए जाने का संकेत हो सकता है।
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: पिता परमेश्वर
  rationale: यूनानी समानाधिकरण में पिता की पहचान परमेश्वर के रूप में होती है। यह हिन्दी में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: εἰς ζωὴν αἰώνιον का संबंध
  choice: अनन्त जीवन तक बना रहता है
  alternative: अनन्त जीवन देने के लिए बना रहता है
  rationale: शाब्दिक संरचना में भोजन के बने रहने और अनन्त जीवन के बीच दिशा/परिणति का संबंध है। चुना हुआ पाठ उस संबंध को खुला रखता है और अतिरिक्त कारणार्थक व्याख्या नहीं जोड़ता।
- issue: ἐσφράγισεν का धर्मवैचारिक आशय
  choice: उसी पर पिता परमेश्वर ने अपनी मुहर लगाई है
  alternative: पिता परमेश्वर ने उसे प्रमाणित किया है
  rationale: मूल रूपक को सुरक्षित रखा गया है; व्याख्यात्मक अर्थ को फुटनोट में बताया गया है ताकि दिव्य अधिकार या प्रमाणीकरण का भाव स्पष्ट हो पर मुख्य पाठ उसे किसी एक संकल्पना तक सीमित न करे।
- issue: ὁ πατὴρ ... ὁ θεός का समानाधिकरण
  choice: पिता परमेश्वर
  alternative: पिता ने, अर्थात् परमेश्वर ने
  rationale: दोनों संज्ञाओं की पहचान को स्पष्ट रखता है और यूनानी वाक्य से आगे कोई अतिरिक्त त्रिएकत्वीय सूत्र नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘परिश्रम’ आज्ञा की गंभीरता रखता है, जबकि वाक्य-रचना सामान्य पाठक के लिए स्पष्ट है। मुख्य पाठ में केवल वास्तविक रूपक-संबंधी फुटनोट रखा गया है; दिए गए अंग्रेज़ी परामर्श-पाठ का पहला फुटनोट मूलतः गलत स्थान/विषय से जुड़ा दिखता है, इसलिए उसे नहीं अपनाया गया।
