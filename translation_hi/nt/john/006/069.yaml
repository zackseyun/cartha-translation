  yaml_path: translation/nt/john/006/069.yaml
  text: And we have believed and have come to know that you are the Holy One of God[a][b].
translation:
  language: hi
  text: और हमने विश्वास किया है और जान गए हैं कि आप परमेश्वर के पवित्र जन हैं[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में है, “आप मसीह, जीवित परमेश्वर के पुत्र हैं।”
    reason: textual_variant
  - marker: b
    text: या “परमेश्वर की ओर से आए पवित्र जन।” यूनानी सम्बन्धकारक रूप सम्बन्ध या स्रोत का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: हमने
  rationale: स्पष्ट सर्वनाम यूनानी में बल देता है। हिन्दी में क्रिया के साथ ‘हमने’ रखना इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πεπιστεύκαμεν
  choice: विश्वास किया है
  rationale: पूर्णकाल पहले किए गए विश्वास और उसके वर्तमान में बने हुए परिणाम—दोनों को व्यक्त करता है।
- source_word: ἐγνώκαμεν
  choice: जान लिया है
  rationale: यह रूप ज्ञान प्राप्त कर लेने और अब उस ज्ञान के बने रहने का भाव देता है; ‘जान लिया है’ आधुनिक हिन्दी में दोनों पहलुओं को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὅτι
  choice: कि
  rationale: यह विश्वास और ज्ञान की विषय-वस्तु का परिचय देता है।
- source_word: ὁ ἅγιος
  choice: पवित्र जन
  rationale: यह मसीह-संबंधी पदवी है, जो उस विशिष्ट व्यक्ति को दर्शाती है जो पवित्र और अलग ठहराया गया है। ‘पवित्र जन’ हिन्दी में पदवी का व्यक्तिवाचक और गरिमापूर्ण भाव बनाए रखता है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर के
  rationale: सम्बन्धकारक रूप परमेश्वर से सम्बन्ध, अपनापन या स्रोत का भाव दे सकता है। ‘परमेश्वर के’ इस व्यापकता को मुख्य पाठ में सुरक्षित रखता है।
theological_decisions:
- issue: यूहन्ना 6:69 में मसीह-संबंधी पदवी
  choice: परमेश्वर के पवित्र जन
  alternative: परमेश्वर की ओर से आए पवित्र जन; मसीह, जीवित परमेश्वर के पुत्र
  rationale: SBLGNT में ὁ ἅγιος τοῦ θεοῦ है। इसलिए इसे सीधे पदवी के रूप में अनूदित किया गया है, न कि मत्ती 16:16 या विस्तृत उत्तरकालीन पाठ से सामंजस्य बैठाकर। ‘परमेश्वर के’ सम्बन्धकारक की व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। ‘आप’ यीशु को सीधे संबोधन में सम्मानपूर्ण तथा स्वाभाविक है। पूर्णकाल के दोनों रूप यूनानी पूर्णकाल की वर्तमान-परिणामवाची शक्ति को बनाए रखते हैं।
