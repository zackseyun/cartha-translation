  text: εἶπεν οὖν ὁ Ἰησοῦς τοῖς δώδεκα· Μὴ καὶ ὑμεῖς θέλετε ὑπάγειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: hi
  text: इसलिए यीशु ने बारहों से कहा, “क्या तुम भी चले जाना नहीं चाहते?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम भी चले जाना चाहते हो?” यूनानी प्रश्न में μή का प्रयोग है, जो प्रायः ‘नहीं’ उत्तर की अपेक्षा का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले संदर्भ में बहुत-से चेलों के लौट जाने के परिणामस्वरूप यीशु के प्रश्न को जोड़ता है और कथात्मक-तार्किक प्रवाह बनाए रखता है।
- source_word: τοῖς δώδεκα
  choice: बारहों से
  rationale: यह यीशु के निकटतम समूह के लिए प्रचलित पदनाम है; ‘बारहों’ हिंदी में उसका संक्षिप्त और स्वाभाविक रूप है।
- source_word: Μὴ καὶ ὑμεῖς
  choice: क्या तुम भी ... नहीं चाहते?
  rationale: μή से आरंभ प्रश्न सामान्यतः नकारात्मक उत्तर की अपेक्षा प्रकट करता है; ‘भी’ καί और संदर्भगत बल को व्यक्त करता है।
- source_word: θέλετε
  choice: चाहते
  rationale: यहाँ क्रिया इच्छा या मनोभाव बताती है; ‘चाहते’ आधुनिक हिंदी में सीधा और स्वाभाविक समतुल्य है।
- source_word: ὑπάγειν
  choice: चले जाना
  rationale: तत्काल संदर्भ में यह यीशु से दूर चले जाने का संकेत देता है, पर ‘छोड़ देना’ की अपेक्षा मूल गति-संबंधी अर्थ को अधिक स्पष्ट रूप से बचाता है।
theological_decisions:
- issue: μή से आरंभ यीशु के प्रश्न का बल
  choice: ऐसा नकारात्मक प्रश्न जो ‘नहीं’ उत्तर की अपेक्षा का संकेत देता है, पर उसे निश्चित कथन नहीं बनाता
  alternative: “क्या तुम भी चले जाना चाहते हो?” जैसा अधिक तटस्थ प्रश्न
  rationale: यूनानी प्रश्न में μή प्रायः नकारात्मक उत्तर की अपेक्षा सूचित करता है। हिंदी का नकारात्मक प्रश्न यह सूक्ष्मता बनाए रखता है, बिना शिष्यों के उत्तर को पहले से पूर्णतः निश्चित किए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। संबोधन के लिए बहुवचन ‘तुम’ निकट शिष्यों से सीधे संवाद के अनुकूल है; ‘बारहों’ को समूह के स्थापित पदनाम के रूप में रखा गया है।
