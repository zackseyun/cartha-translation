source:
  edition: SBLGNT
  text: ⸀Εἶπεν αὐτοῖς ὁ Ἰησοῦς· Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ⸀ἐμὲ οὐ μὴ ⸀διψήσει πώποτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: hi
  text: यीशु ने उनसे कहा, “जीवन की रोटी मैं हूँ। जो मेरे पास आता है, वह कभी भूखा न होगा; और जो मुझ पर विश्वास करता है, वह कभी प्यासा न होगा।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह कभी भी प्यासा नहीं होगा।” यूनानी में ‘कभी भी’ के साथ अत्यंत प्रबल निषेध आया है।
    reason: मूल यूनानी οὐ μή … πώποτε की संयुक्त और जोरदार नकारात्मकता को अधिक शाब्दिक विकल्प में दिखाना।
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς
  choice: उनसे कहा
  rationale: कथात्मक भूमिका में अओरिस्ट Εἶπεν का स्वाभाविक हिन्दी रूप ‘कहा’ है, और αὐτοῖς को ‘उनसे’ व्यक्त करता है।
- source_word: Ἐγώ εἰμι
  choice: मैं हूँ
  rationale: स्पष्ट सर्वनाम के बल को हिन्दी में विधेय को पहले रखकर बनी अभिव्यक्ति ‘जीवन की रोटी मैं हूँ’ स्वाभाविक ढंग से उभारती है।
- source_word: ὁ ἄρτος τῆς ζωῆς
  choice: जीवन की रोटी
  rationale: यह निकट और सहज अनुवाद संबंधकारक अभिव्यक्ति तथा उसके रूपक को सुरक्षित रखता है; ‘जीवन देनेवाली रोटी’ अधिक व्याख्यात्मक होता।
- source_word: ὁ ἐρχόμενος πρὸς ἐμέ
  choice: जो मेरे पास आता है
  rationale: संज्ञात्मक वर्तमान कृदंत का सामान्य और जारी अर्थ ‘जो … आता है’ से स्वाभाविक हिन्दी में बना रहता है।
- source_word: οὐ μὴ πεινάσῃ
  choice: कभी भूखा न होगा
  rationale: οὐ μή की प्रबल नकारात्मकता को ‘कभी … न होगा’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: जो मुझ पर विश्वास करता है
  rationale: यूहन्ना में πιστεύω εἰς के लिए ‘मुझ पर विश्वास’ स्रोत-सापेक्ष और हिन्दी में स्थापित धार्मिक अभिव्यक्ति है; यह केवल बौद्धिक स्वीकृति तक सीमित अर्थ थोपे बिना संबंधपरक विश्वास को खुला रखती है।
- source_word: οὐ μὴ διψήσει πώποτε
  choice: वह कभी प्यासा न होगा
  rationale: οὐ μή और πώποτε की संयुक्त, अत्यंत प्रबल नकारात्मकता को मुख्य पाठ में सहज हिन्दी द्वारा व्यक्त किया गया है; ‘फिर’ नहीं जोड़ा गया, क्योंकि πώποτε का अर्थ ‘कभी/किसी भी समय’ है, ‘फिर’ नहीं।
theological_decisions:
- issue: πιστεύων εἰς ἐμέ का अनुवाद
  choice: जो मुझ पर विश्वास करता है
  alternative: जो मुझ पर भरोसा रखता है
  rationale: ‘विश्वास करता है’ यूहन्ना की विश्वास-संबंधी शब्दावली के साथ पारदर्शी और प्रचलित है; ‘भरोसा रखता है’ अर्थ की उचित छाया है, पर उसे मुख्य पाठ में रखकर मूल की स्थापित शब्द-संगति को संकुचित नहीं किया गया।
- issue: Ἐγώ εἰμι में आत्म-पहचान का बल
  choice: जीवन की रोटी मैं हूँ
  alternative: मैं ही जीवन की रोटी हूँ
  rationale: विधेय को पहले रखकर ‘मैं हूँ’ पर स्वाभाविक बल आता है और यूहन्ना के आत्म-पहचान कथन की गूँज बनी रहती है। ‘ही’ अधिक स्पष्ट बल देता, पर यूनानी कथन में निहित अर्थ से आगे विशिष्टता को व्याख्यात्मक ढंग से बढ़ा सकता है।
- issue: πώποτε का कालगत अर्थ
  choice: कभी प्यासा न होगा
  alternative: फिर कभी प्यासा न होगा
  rationale: πώποτε ‘कभी भी’ बताता है, अनिवार्यतः ‘फिर/दोबारा’ नहीं। इसलिए अनंत संतुष्टि के आशय को रखते हुए ऐसा शब्द नहीं जोड़ा गया जो मूल में स्पष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण। ‘जीवन की रोटी’ जैसे परिचित बाइबलीय रूपक को अक्षुण्ण रखा गया है। समानांतर वाक्य-विन्यास से आने और विश्वास करने के संबंध को स्पष्ट रखा गया है; अनावश्यक संस्कृतनिष्ठता और सांप्रदायिक व्याख्या से बचा गया है।
