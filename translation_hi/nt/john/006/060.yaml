  edition: SBLGNT
  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: hi
  text: इसलिए उसके चेलों में से बहुतों ने यह सुनकर कहा, “यह बात कठोर है[a]; इसे कौन सुन सकता है[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह कथन कठोर है” अथवा “यह शिक्षा कठोर है।” यूनानी शब्द का अर्थ “बात,” “कथन,” “संदेश” या “शिक्षा” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “इसे कौन मान सकता है?” यूनानी क्रिया का अर्थ प्रसंग के अनुसार सुनना, ध्यान से सुनना, मानना या स्वीकार करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: बहुतों
  rationale: यह उसके चेलों के बड़े समूह के भीतर एक पर्याप्त संख्या को सूचित करता है; ‘बहुतों’ संक्षिप्त और स्वाभाविक है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्ष या आगे के घटनाक्रम का संबंध दिखाता है।
- source_word: ἀκούσαντες
  choice: यह सुनकर
  rationale: कालसूचक कृदन्त को सहज हिन्दी में व्यक्त करता है; ‘यह’ यीशु के अभी-अभी दिए गए उपदेश की ओर संकेत करता है।
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: उसके चेलों में से
  rationale: मूल यूनानी स्पष्ट करता है कि बोलनेवाले उसके चेलों के व्यापक समूह में से थे।
- source_word: Σκληρός
  choice: कठोर
  rationale: ‘कठोर’ ऐसी बात का भाव रखता है जो कड़ी, सहने में कठिन या स्वीकार करने में कठिन हो; यह अर्थ को केवल बौद्धिक कठिनाई तक सीमित नहीं करता।
- source_word: ὁ λόγος οὗτος
  choice: यह बात
  rationale: यहाँ λόγος अभी कही गई उक्ति या शिक्षा को दर्शाता है। आधुनिक हिन्दी में ‘बात’ स्वाभाविक है और ‘कथन/शिक्षा’ की अर्थ-सीमा खुली रखता है।
- source_word: τίς δύναται
  choice: कौन ... सकता है
  rationale: सामर्थ्य व्यक्त करने वाले यूनानी प्रश्न का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: αὐτοῦ ἀκούειν
  choice: इसे ... सुन सकता है
  rationale: ‘सुनना’ पहले प्रयुक्त ἀκούσαντες के साथ शब्द-संबंध बनाए रखता है और प्रसंग में ध्यान से सुनने, मानने या स्वीकार करने की संभावना को बिना संकुचित किए खुला छोड़ता है।
theological_decisions:
- issue: चेलों की आपत्ति का आशय
  choice: यह कथन यीशु की बात को कठोर—अर्थात सुनने, सहने या स्वीकार करने में कठिन—बताता है, पर कठिनाई का सटीक स्वरूप निर्धारित नहीं करता।
  alternative: इसे केवल बौद्धिक रूप से कठिन, अथवा स्पष्ट रूप से अपमानजनक या असहनीय बताना।
  rationale: σκληρός में कठोरता, कड़ाई और स्वीकार करने की कठिनाई के अर्थ हो सकते हैं। ‘कठोर’ इस तनाव को बनाए रखता है और किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘चेले’ यूहन्ना के कथानक में μαθηταί का परिचित और स्वाभाविक अनुवाद है। ‘कठोर’ और ‘सुन सकता है’ मूल की अर्थगत अस्पष्टता तथा दोनों बार आई ἀκούω धातु के संबंध को सुरक्षित रखते हैं।
