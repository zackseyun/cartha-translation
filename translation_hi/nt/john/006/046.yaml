base_translation:
  language: en
  yaml_path: translation/nt/john/006/046.yaml
  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
translation:
  language: hi
  text: यह नहीं कि किसी ने पिता को देखा है; केवल वही, जो परमेश्वर की ओर से है[a], पिता को देखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर के पास से”; संदर्भ के अनुसार “परमेश्वर के साथ।” यूनानी पदबंध स्रोत के साथ-साथ व्यक्तिगत निकटता का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: यह नहीं कि
  rationale: यह पिछले कथन का कारण नहीं, बल्कि उसका स्पष्टीकरण और परिसीमन प्रस्तुत करता है; आधुनिक हिन्दी में यह सुधारात्मक बल स्वाभाविक रूप से व्यक्त होता है।
- source_word: τὸν πατέρα
  choice: पिता
  rationale: यूहन्ना में परमेश्वर के लिए प्रचलित संबंधपरक संबोधन; हिन्दी में बिना अतिरिक्त अर्थ जोड़े दिव्य संदर्भ स्पष्ट है।
- source_word: ἑώρακέν τις
  choice: किसी ने ... देखा है
  rationale: नकारात्मक संदर्भ में τις का अर्थ ‘किसी’ है, और पूर्ण काल को ‘देखा है’ वर्तमान प्रासंगिकता सहित व्यक्त करता है।
- source_word: εἰ μὴ
  choice: केवल उसी ने
  rationale: यहाँ वाक्यांश शर्त नहीं बल्कि अपवाद दर्शाता है; हिन्दी में ‘केवल उसी ने’ अपवाद और व्यक्ति पर बल दोनों को सहजता से रखता है।
- source_word: ὁ ὢν
  choice: जो ... है
  rationale: संज्ञात्मक वर्तमान कृदन्त व्यक्ति की जारी संबंधगत स्थिति को दर्शाता है; ‘जो ... है’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: παρὰ τοῦ θεοῦ
  choice: परमेश्वर की ओर से
  rationale: παρά के साथ संबंध कारक स्रोत या उद्गम व्यक्त कर सकता है। ‘परमेश्वर की ओर से’ इसे स्वाभाविक हिन्दी में रखता है, जबकि व्यक्तिगत निकटता की संभावित छाया पादटिप्पणी में सुरक्षित है।
- source_word: οὗτος
  choice: उसी ने
  rationale: संकेतवाचक सर्वनाम पहले बताए गए विशिष्ट व्यक्ति की ओर बलपूर्वक लौटता है; ‘उसी ने’ हिन्दी में यह बल स्पष्ट करता है।
- source_word: ἑώρακεν
  choice: देखा है
  rationale: यूनानी पूर्ण काल को हिन्दी का पूर्ण रूप ‘देखा है’ भली-भाँति व्यक्त करता है और दर्शन की स्थायी प्रासंगिकता बनाए रखता है।
theological_decisions:
- issue: παρὰ τοῦ θεοῦ में उस व्यक्ति का परमेश्वर से संबंध
  choice: परमेश्वर की ओर से
  alternative: परमेश्वर के पास से; परमेश्वर के सान्निध्य से
  rationale: मुख्य पाठ स्रोत या उद्गम का दावा स्पष्ट रखता है, पर संबंध की तात्त्विक प्रकृति को आवश्यकता से अधिक निश्चित नहीं करता। पादटिप्पणी यूनानी पदबंध में संभव व्यक्तिगत या स्थानिक निकटता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘केवल उसी ने’ अपवाद और οὗτος के बल को स्वाभाविक रूप से व्यक्त करता है; पादटिप्पणी मूल की वास्तविक अर्थगत व्यापकता बनाए रखती है।
