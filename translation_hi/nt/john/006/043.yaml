  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: उत्तर दिया
  rationale: यूनानी का शाब्दिक दोहरा कथन ‘उत्तर दिया और कहा’ हिन्दी में अनावश्यक रूप से भारी लगता है; ‘उत्तर दिया’ संवाद की दोनों क्रियाओं को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἰησοῦς
  choice: यीशु
  rationale: नाम Ἰησοῦς का हिन्दी में प्रचलित मानक रूप।
- source_word: Μὴ γογγύζετε
  choice: मत कुड़कुड़ाओ
  rationale: μή के साथ वर्तमान आज्ञार्थक सामान्य निषेध या चल रही क्रिया को रोकने—दोनों अर्थ दे सकता है। ‘मत’ इस अस्पष्टता को बनाए रखता है, और ‘कुड़कुड़ाना’ γογγύζω के धीमे असंतोषपूर्ण विरोध तथा बाइबिल के जंगल-वृत्तांतों की प्रतिध्वनि को व्यक्त करता है।
- source_word: μετ’ ἀλλήλων
  choice: आपस में
  rationale: यह समूह के भीतर पारस्परिक क्रिया को सहज और आधुनिक हिन्दी में व्यक्त करता है।
