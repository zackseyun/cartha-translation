source:
  edition: SBLGNT
  text: οἱ οὖν ἄνθρωποι ἰδόντες ⸂ὃ ἐποίησεν σημεῖον⸃ ⸀ἔλεγον ὅτι Οὗτός ἐστιν ἀληθῶς ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: hi
  text: इसलिए जब लोगों ने उस चिन्ह को देखा जो उसने किया था[a], तो वे कह रहे थे, “सचमुच यही वह भविष्यद्वक्ता है जो संसार में आने वाला है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस चमत्कार को देखा जो उसने किया था।” यूहन्ना प्रायः “चिन्ह” (σημεῖον) शब्द का प्रयोग इस बात पर बल देने के लिए करता है कि यीशु के कार्य कुछ प्रकट करते हैं; वह केवल उनके चमत्कारी स्वरूप पर बल नहीं देता।
    reason: lexical_alternative
  - marker: b
    text: “वह भविष्यद्वक्ता” संभवतः मूसा के समान उस प्रत्याशित भविष्यद्वक्ता की ओर संकेत करता है जिसका उल्लेख व्यवस्थाविवरण 18:15–18 में है।
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: इसलिए जब लोगों ने
  rationale: οὖν कथा में परिणाम या निष्कर्ष को दर्शाता है, इसलिए ‘इसलिए’ उपयुक्त है। ἄνθρωποι यहाँ सामान्य रूप से भीड़ के लोगों को दर्शाता है, केवल पुरुषों को नहीं।
- source_word: ἰδόντες
  choice: देखा
  rationale: एओरिस्ट कृदन्त को स्वाभाविक हिन्दी में ‘जब...देखा’ संरचना द्वारा व्यक्त किया गया है।
- source_word: ὃ ἐποίησεν σημεῖον
  choice: वह चिन्ह ... जो उसने किया था
  rationale: यूहन्ना में σημεῖον यीशु के कार्य के प्रकटकारी अर्थ पर बल देता है; इसलिए ‘चिन्ह’ रखा गया है, केवल ‘चमत्कार’ नहीं। ‘किया था’ भीड़ के देखने से पहले सम्पन्न कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔλεγον
  choice: वे कह रहे थे
  rationale: अपूर्ण काल चल रही या बार-बार कही जा रही बात का संकेत दे सकता है; ‘कह रहे थे’ इस पक्ष को बनाए रखता है।
- source_word: ἀληθῶς
  choice: सचमुच
  rationale: यह पहचान की दृढ़ता और वास्तविकता पर बल देता है तथा आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὁ προφήτης
  choice: वह भविष्यद्वक्ता
  rationale: निश्चित उपपद एक पहचानी हुई प्रत्याशित हस्ती की ओर संकेत करता है। हिन्दी में ‘वह भविष्यद्वक्ता’ इस निश्चितता को बिना अतिरिक्त पहचान जोड़े व्यक्त करता है।
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: जो संसार में आनेवाला है
  rationale: यह वाक्यांश यूनानी वर्तमान कृदन्त और प्रत्याशित आगमन—दोनों की स्वाभाविक हिन्दी अभिव्यक्ति है, और समय को अनावश्यक रूप से अधिक निश्चित नहीं करता।
theological_decisions:
- issue: ‘ὁ προφήτης’ की पहचान
  choice: मुख्य पाठ में ‘वह भविष्यद्वक्ता’
  alternative: ‘मूसा के समान भविष्यद्वक्ता’ अथवा ‘एक भविष्यद्वक्ता’
  rationale: यह कथन संभवतः व्यवस्थाविवरण 18:15–18 के प्रत्याशित भविष्यद्वक्ता की ओर संकेत करता है, पर यूनानी पाठ स्वयं केवल ‘वह भविष्यद्वक्ता’ कहता है। अनुवाद उसी संकेत को बनाए रखता है और स्पष्ट पहचान को पाद-टिप्पणी तक सीमित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘चिन्ह’ ने यूहन्ना की विशिष्ट शब्दावली को सुरक्षित रखा है, जबकि पाद-टिप्पणी ‘चमत्कार’ का अर्थ स्पष्ट करती है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
