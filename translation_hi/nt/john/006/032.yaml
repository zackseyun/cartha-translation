source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: hi
  text: तब यीशु ने उनसे कहा, “मैं तुमसे सच-सच कहता हूँ, स्वर्ग से रोटी तुम्हें मूसा ने नहीं दी[a], बल्कि मेरा पिता तुम्हें स्वर्ग से सच्ची रोटी[b] देता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्ग से रोटी देने वाला मूसा नहीं था।” यूनानी में निषेध ‘मूसा’ से पहले है, इसलिए किसने दिया—इस बात पर विशेष बल है।
    reason: lexical_alternative
  - marker: b
    text: “सच्ची रोटी” का अर्थ “असली” या “वास्तविक रोटी” भी हो सकता है। यह पहले के मन्ना के विपरीत केवल एक संकेत नहीं, बल्कि स्वर्ग से मिलने वाली वास्तविक रोटी की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यह पिछले संवाद से कथा और विचार की कड़ी जोड़ता है। यहाँ ‘तब’ स्वाभाविक हिन्दी में इस निरंतरता को व्यक्त करता है।
- source_word: Ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: यूहन्ना में प्रयुक्त इस दोहरे गंभीर उद्घोष की पुनरावृत्ति और बल दोनों को स्पष्ट, प्रचलित हिन्दी में बनाए रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: यूनानी वाक्यांश का सीधा और गरिमापूर्ण रूप, जो गंभीर उद्घोष के साथ स्वाभाविक बैठता है।
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: स्वर्ग से रोटी तुम्हें मूसा ने नहीं दी
  rationale: वाक्य-विन्यास से ‘मूसा’ पर निषेध और कर्ता का विरोध उभरता है। हिन्दी में प्राचीन घटना के लिए सामान्य भूतकाल स्वाभाविक है; प्रसंग में उसका वर्तमान महत्व बना रहता है।
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से रोटी
  rationale: ἐκ के उद्गम-संबंधी अर्थ और रोटी के बिंब को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: बल्कि मेरा पिता तुम्हें ... देता है
  rationale: ‘बल्कि’ मूसा और पिता के बीच तीखा विरोध व्यक्त करता है, जबकि वर्तमानकाल ‘देता है’ यूनानी δίδωσιν के वर्तमान अर्थ को बनाए रखता है।
- source_word: τὸν ἀληθινόν
  choice: सच्ची
  rationale: ἀληθινός के ‘सत्य, वास्तविक, असली अथवा चरम रूप से प्रामाणिक’ अर्थ-क्षेत्र को व्याख्यात्मक विस्तार किए बिना सुरक्षित रखता है।
theological_decisions:
- issue: मूसा के पूर्वकालीन देने और पिता के वर्तमान देने के बीच विरोध
  choice: मूसा के लिए ‘नहीं दी’ और पिता के लिए ‘देता है’
  alternative: ‘मूसा ने नहीं दी है ... पिता दे रहा है’
  rationale: यह स्वाभाविक हिन्दी में पुराने मरुभूमि-प्रसंग और पिता के वर्तमान दान के बीच कालगत अंतर बनाए रखता है, बिना यूनानी पक्ष को असहज ढंग से यांत्रिक रूप देने के।
- issue: ‘सच्ची रोटी’ का अर्थ
  choice: मुख्य पाठ में ‘सच्ची रोटी’
  alternative: ‘असली रोटी’ या ‘वास्तविक रोटी’
  rationale: यूहन्ना में ἀληθινός पहले के संकेत की तुलना में पूर्ण और वास्तविक सत्यता का भाव रख सकता है। ‘सच्ची’ इस धर्मवैचारिक गहराई और अर्थगत खुलापन दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन और वाक्य-विन्यास सरल, गरिमापूर्ण तथा सामान्य पाठक के लिए सुबोध रखे गए हैं। ‘सच-सच’ पारंपरिक बाइबिलीय पहचान बनाए रखते हुए आज भी सहज समझ में आता है।
