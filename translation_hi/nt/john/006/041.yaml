  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: hi
  text: इसलिए यहूदी[a] उसके विषय में कुड़कुड़ा रहे थे, क्योंकि उसने कहा था, “मैं वह रोटी हूँ जो स्वर्ग से उतरी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया के निवासी”; और कुछ संदर्भों में, “यहूदी अगुए।” यूहन्ना में “यहूदी” शब्द सभी यहूदी लोगों के बजाय यीशु का विरोध कर रहे किसी विशेष समूह के लिए प्रयुक्त हो सकता है।
    reason: वैकल्पिक अनुवाद और संदर्भ की सीमा स्पष्ट करना
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: कुड़कुड़ा रहे थे
  rationale: अपूर्ण भूतकाल चलती हुई शिकायत को दर्शाता है। ‘कुड़कुड़ा रहे थे’ दबी आवाज़ में असंतोष प्रकट करने का भाव स्वाभाविक आधुनिक हिन्दी में रखता है और जंगल में इस्राएल के कुड़कुड़ाने की पृष्ठभूमि से भी मेल खाता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से कारणात्मक अथवा निष्कर्षात्मक संबंध दिखाता है। ‘इसलिए’ प्रसंग का तार्किक प्रवाह स्पष्ट रखता है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदी
  rationale: यूनानी पद का सीधा और अनिर्दिष्ट अनुवाद है। इस पद में लेखक ने स्पष्ट रूप से केवल अगुओं या केवल यहूदिया-निवासियों तक अर्थ सीमित नहीं किया; संदर्भ में यह यीशु का विरोध कर रहे एक विशेष यहूदी समूह को सूचित कर सकता है, न कि सभी यहूदियों को।
- source_word: περὶ αὐτοῦ
  choice: उसके विषय में
  rationale: περί के साथ संबंधकारक का सामान्य अर्थ ‘उसके विषय में/उसके बारे में’ है। यह ‘उसके विरुद्ध’ कहकर पूर्वसर्ग में अतिरिक्त वैरभाव नहीं जोड़ता।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι उनके कुड़कुड़ाने का कारण प्रस्तुत करता है, इसलिए कारणवाचक ‘क्योंकि’ उपयुक्त है।
- source_word: εἶπεν
  choice: उसने कहा था
  rationale: यद्यपि यूनानी में सामान्य भूतकाल है, हिन्दी में पूर्व घटित कथन को वर्तमान कथात्मक बिंदु से जोड़ने के लिए ‘कहा था’ स्वाभाविक है और कोई नया अर्थ नहीं जोड़ता।
- source_word: Ἐγώ εἰμι
  choice: वह रोटी मैं हूँ
  rationale: ‘मैं’ पर यूनानी बल को हिन्दी की स्वाभाविक पद-रचना में रखा गया है। इससे स्पष्ट आत्म-पहचान बनी रहती है।
- source_word: ὁ ἄρτος
  choice: वह रोटी
  rationale: निश्चित उपपद का भाव ‘वह रोटी’ से व्यक्त होता है, जिससे यीशु की पहचान किसी सामान्य रोटी के रूप में नहीं, पहले उल्लिखित विशिष्ट रोटी के रूप में होती है।
- source_word: ὁ καταβὰς
  choice: जो ... उतरी है
  rationale: संज्ञा को विशेषित करने वाले भूतकालिक कृदंत को हिन्दी में संबंधवाचक उपवाक्य बनाया गया है। ‘उतरी है’ पूर्ण हुए अवतरण और उसके वर्तमान महत्व को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से
  rationale: यह ἐκ के स्रोत अथवा उद्गम के भाव का सहज और मानक हिन्दी रूप है।
theological_decisions:
- issue: यूहन्ना में οἱ Ἰουδαῖοι का संदर्भ और अनुवाद
  choice: मुख्य पाठ में ‘यहूदी’
  alternative: ‘यहूदिया के लोग’ अथवा कुछ संदर्भों में ‘यहूदी अगुए’
  rationale: मुख्य पाठ यूनानी अभिव्यक्ति को सीधे रखता है और इस पद की अपेक्षा से अधिक संदर्भ को संकीर्ण नहीं करता। पाद-टिप्पणी यह स्पष्ट करती है कि यूहन्ना में यह पद प्रायः प्रसंग के अनुसार यीशु का विरोध करने वाले किसी विशेष समूह के लिए आता है, सभी यहूदी लोगों के विषय में व्यापक कथन के रूप में नहीं।
- issue: Ἐγώ εἰμι में बल और निश्चित ‘रोटी’
  choice: ‘वह रोटी मैं हूँ’
  alternative: ‘मैं वह रोटी हूँ’
  rationale: दोनों व्याकरणतः संभव हैं; चुना हुआ क्रम यूनानी के स्पष्ट ‘मैं’ पर बल को स्वाभाविक हिन्दी में अधिक उभारता है, बिना ‘मैं हूँ’ सूत्र के साथ अतिरिक्त धार्मिक दावा अनिवार्य किए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘कुड़कुड़ाना’ शिकायत की निरंतर और धीमी अभिव्यक्ति को रखता है; ‘वह रोटी मैं हूँ’ मूल के बल को स्वाभाविक हिन्दी में सामने लाता है।
