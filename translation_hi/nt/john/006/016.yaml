  text: When evening came[a], his disciples went down to the sea,
translation:
  language: hi
  text: जब शाम हुई, तो उसके शिष्य नीचे समुद्र[a] की ओर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘झील’। यहाँ गलील की झील का उल्लेख है, जो तकनीकी रूप से एक झील है; पर यूनानी पाठ में θάλασσα (‘समुद्र’) शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: जब … तो
  rationale: ὡς का कालवाचक अर्थ ‘जब’ से व्यक्त होता है, और δέ की हल्की संक्रमणकारी भूमिका स्वाभाविक हिन्दी वाक्य-रचना में ‘तो’ से झलकती है।
- source_word: ὀψία ἐγένετο
  choice: शाम हुई
  rationale: यह यूनानी मुहावरा शाम होने को दर्शाता है; ‘शाम हुई’ आधुनिक हिन्दी में सहज और निकट अनुवाद है।
- source_word: κατέβησαν
  choice: नीचे गए
  rationale: καταβαίνω नीचे की ओर जाने का अर्थ रखता है; ‘नीचे गए’ स्थलाकृतिक गति को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: उसके शिष्य
  rationale: यूनानी संबंधवाचक संरचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἐπὶ τὴν θάλασσαν
  choice: झील की ओर
  rationale: ἐπί के साथ कर्मकारक यहाँ जलाशय की ओर गति बताता है। θάλασσα का सामान्य अर्थ ‘समुद्र’ है, पर संदर्भित गलील का जलाशय भौगोलिक रूप से झील है; मुख्य पाठ में पाठक-सुलभ ‘झील’ रखा और मूल शब्द का रूप पादटिप्पणी में सुरक्षित किया गया है।
