  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: hi
  text: इस पर उन्होंने उससे कहा, “तो फिर तुम कौन-सा चिन्ह दिखा रहे हो, ताकि हम उसे देखें और तुम्हारी बात पर विश्वास करें[a]? तुम कौन-सा काम कर रहे हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम पर विश्वास करें” अथवा “तुम पर भरोसा करें।” यूनानी में ‘विश्वास करना’ के साथ ‘तुम्हें’ वाला दत्तिवाचक सर्वनाम आया है, न कि यूहन्ना की अधिक सामान्य अभिव्यक्ति ‘तुम पर/में विश्वास करना।’ इसलिए इसका अर्थ ‘तुम्हारी बात या दावे को सच मानना’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: इस पर उन्होंने उससे कहा
  rationale: οὖν पिछले कथन से इस प्रतिक्रिया का संबंध जोड़ता है। ‘इस पर’ आधुनिक हिन्दी में प्रसंगगत परिणाम और क्रम—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Τί οὖν
  choice: तो फिर ... कौन-सा
  rationale: दूसरे οὖν को ‘तो फिर’ के रूप में बनाए रखने से प्रश्न की चुनौतीपूर्ण और आग्रहपूर्ण ध्वनि सुरक्षित रहती है।
- source_word: ποιεῖς σὺ σημεῖον
  choice: तुम कौन-सा चिन्ह दिखा रहे हो
  rationale: हिन्दी में ‘चिन्ह करना’ अस्वाभाविक है; ‘चिन्ह दिखाना’ किसी प्रमाणकारी चिन्ह को प्रस्तुत करने का स्वाभाविक ढंग है। वर्तमानकालीन ‘दिखा रहे हो’ तत्काल दी जा रही चुनौती को व्यक्त करता है, और ‘चिन्ह’ यूहन्ना के प्रमुख शब्द σημεῖον को बिना ‘चमत्कारी’ जोड़कर सुरक्षित रखता है।
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: ताकि हम उसे देखें और तुम्हारी बात पर विश्वास करें
  rationale: ἵνα के उद्देश्यभाव और ‘देखें—विश्वास करें’ के क्रम को रखा गया है। σοι दत्तिवाचक है, इसलिए मुख्य पाठ में अधिक सामान्य यूहन्नाई ‘तुम पर विश्वास करें’ के बजाय ‘तुम्हारी बात पर विश्वास करें’ रखा गया है; यह यीशु के दावे या कथन को सच मानने का भाव व्यक्त करता है।
- source_word: τί ἐργάζῃ
  choice: तुम कौन-सा काम कर रहे हो
  rationale: ἐργάζῃ के काम करने या संपन्न करने के अर्थ को सरल, वर्तमान हिन्दी में व्यक्त किया गया है और पहले प्रश्न के समानांतर रखा गया है।
theological_decisions:
- issue: πιστεύω के साथ दत्तिवाचक σοι का आशय
  choice: तुम्हारी बात पर विश्वास करें
  alternative: तुम पर विश्वास करें / तुम पर भरोसा करें
  rationale: यहाँ यूनानी में εἰς के साथ वह अधिक सामान्य यूहन्नाई रचना नहीं है जिसका अर्थ प्रायः किसी व्यक्ति ‘पर’ या ‘में’ विश्वास करना होता है। दत्तिवाचक σοι यीशु की बात या दावे को सच मानने की ओर संकेत कर सकता है। फिर भी व्यक्ति पर विश्वास या भरोसे का अर्थ पूरी तरह असंभव नहीं है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चिन्ह’ को ‘चमत्कार’ नहीं बनाया गया, ताकि यूहन्ना के धर्मवैचारिक शब्द का संकेतात्मक भाव बना रहे। पादटिप्पणी-चिह्न उसी वाक्यांश के बाद रखा गया है जिससे उसका संबंध है।
