  text: τοῦτο δὲ ἔλεγεν πειράζων αὐτόν, αὐτὸς γὰρ ᾔδει τί ἔμελλεν ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/006.yaml
  text: But he was saying this to test him[a], for he himself knew what he was about to do.
translation:
  language: hi
  text: पर वह यह बात उसे परखने के लिए कह रहा था[a], क्योंकि वह स्वयं जानता था कि वह क्या करने वाला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी परीक्षा लेने के लिए।” इस क्रिया का अर्थ “प्रलोभन देना” भी हो सकता है, पर यहाँ इसका भाव जाँचने या परखने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ἔλεγεν
  choice: पर वह यह बात ... कह रहा था
  rationale: δέ के हल्के विरोध या कथात्मक मोड़ को ‘पर’ से, τοῦτο को ‘यह बात’ से, और अपूर्णकाल ἔλεγεν के प्रगतिशील पक्ष को ‘कह रहा था’ से व्यक्त किया गया है।
- source_word: πειράζων αὐτόν
  choice: उसकी परीक्षा लेने के लिए
  rationale: संदर्भ में क्रिया का अर्थ फिलिप को पाप के लिए लुभाना नहीं, बल्कि उसे जाँचना या परखना है। उद्देश्यसूचक हिन्दी रचना कृदंत का भाव स्वाभाविक रूप से व्यक्त करती है।
- source_word: αὐτὸς γὰρ ᾔδει
  choice: क्योंकि वह स्वयं जानता था
  rationale: γάρ का व्याख्यात्मक संबंध ‘क्योंकि’ से और स्पष्ट αὐτός का बल ‘स्वयं’ से सुरक्षित रखा गया है। οἶδα के इस रूप का यहाँ स्वाभाविक भूतकालीन अर्थ ‘जानता था’ है।
- source_word: τί ἔμελλεν ποιεῖν
  choice: कि वह क्या करने वाला है
  rationale: μέλλω और infinitive आगामी अथवा अभिप्रेत कार्य बताते हैं। ‘करने वाला है’ निकट भविष्य का भाव रखता है; आश्रित कथन में वर्तमान रूप आधुनिक हिन्दी में स्वाभाविक है और यीशु के उस समय के दृष्टिकोण को बनाए रखता है।
theological_decisions:
- issue: πειράζων का अर्थ
  choice: परीक्षा लेने के लिए
  alternative: परखने के लिए; प्रलोभन देने के लिए
  rationale: निकट संदर्भ में यीशु फिलिप की समझ और विश्वास को जाँचता है; उसे बुराई के लिए उकसाने का भाव नहीं है। पादटिप्पणी वैध शाब्दिक विस्तार को बताए बिना मुख्य पाठ को संदिग्ध नहीं बनाती।
- issue: यीशु के पूर्वज्ञान पर बल
  choice: वह स्वयं जानता था
  alternative: वह जानता था
  rationale: यूनानी αὐτός का स्पष्ट बल सुरक्षित रखा गया है, पर पाठ से आगे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण कथात्मक शैली। ‘परीक्षा लेना’ सामान्य पाठक के लिए स्पष्ट है; ‘स्वयं’ मूल के बल को सुरक्षित रखता है।
