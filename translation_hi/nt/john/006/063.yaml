id: JHN.6.63
reference: John 6:63
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ ⸀λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: hi
  text: आत्मा[a] ही जीवन देता है; देह से कुछ भी लाभ नहीं होता[b]। जो वचन मैंने तुमसे कहे हैं, वे आत्मा और जीवन हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आत्मा जीवन देता है।” यूनानी πνεῦμα का अर्थ “पवित्र आत्मा” या सामान्य रूप से “आत्मा” हो सकता है; यहाँ प्रसंग पवित्र आत्मा के अर्थ का समर्थन करता है।
    reason: alternative_reading
  - marker: b
    text: “देह” का संकेत व्यापक रूप से उस बात की ओर हो सकता है जो केवल मानवीय है। यहाँ इसका अनुवाद “पापी स्वभाव” करना यूनानी पाठ की अपेक्षा अधिक व्याख्यात्मक होगा।
    reason: lexical_alternative
  - marker: c
    text: या, “वे पवित्र आत्मा और जीवन हैं,” अथवा “वे आत्मिक और जीवनदायक हैं।” यूनानी अभिव्यक्ति संक्षिप्त और गुणसूचक है।
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: सप्रत्यय यूनानी पद और यूहन्ना के प्रसंग में इसका सबसे संभावित संकेत पवित्र आत्मा की ओर है। फिर भी केवल ‘आत्मा’ रखने से मूल शब्द की वह वास्तविक अर्थ-संभावना बनी रहती है जिसमें ‘आत्मा’ सामान्य अर्थ में भी समझा जा सकता है।
- source_word: ζῳοποιοῦν
  choice: जीवन देता है
  rationale: वर्तमान कृदंत का अर्थ ‘जीवित करना’ या ‘जीवन देना’ है। यह हिंदी में स्वाभाविक है और जीवन प्रदान करने की सक्रियता व्यक्त करता है।
- source_word: ἡ σὰρξ
  choice: देह
  rationale: ‘देह’ शारीरिक अस्तित्व के साथ-साथ केवल मानवीय सामर्थ्य के व्यापक संकेत को भी खुला रखती है। ‘पापी स्वभाव’ जैसे अनुवाद से मूल से अधिक संकीर्ण धर्मवैज्ञानिक अर्थ जुड़ जाता।
- source_word: οὐκ ὠφελεῖ οὐδέν
  choice: से कुछ भी लाभ नहीं होता
  rationale: यह पूर्ण निषेध को स्पष्ट, स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: τὰ ῥήματα
  choice: वचन
  rationale: यहाँ शब्द बोले गए कथनों को दर्शाता है। ‘वचन’ यीशु के कथनों के लिए गरिमापूर्ण और सहज है, बिना उसे केवल एकवचन धर्मवैज्ञानिक पद बना देने के।
- source_word: λελάληκα
  choice: मैंने ... कहे हैं
  rationale: हिंदी का पूर्ण पक्ष यूनानी पूर्णकाल में निहित, पहले बोले गए और अब भी प्रासंगिक वचनों का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πνεῦμά ἐστιν καὶ ζωή ἐστιν
  choice: वे आत्मा और जीवन हैं
  rationale: यह मूल की संक्षिप्त और गुणसूचक अभिव्यक्ति को बनाए रखता है। ‘आत्मिक और जीवनदायक’ अधिक व्याख्यात्मक होता, जबकि ‘पवित्र आत्मा हैं’ व्याकरण की अपेक्षा अधिक निश्चित पहचान ठहराता।
theological_decisions:
- issue: पहले खंड में πνεῦμα का अभिप्राय
  choice: मुख्य पाठ में ‘आत्मा’, जिसका प्रसंगगत संकेत संभवतः पवित्र आत्मा की ओर है
  alternative: सामान्य आत्मिक सिद्धांत या मनुष्य की आत्मा
  rationale: यूहन्ना में जीवन देने का कार्य प्रबल रूप से परमेश्वर के आत्मा से जुड़ा है, पर यूनानी शब्द स्वयं व्यापक अर्थ रख सकता है। मुख्य पाठ और पादटिप्पणी दोनों मिलकर संभावना और अस्पष्टता को सुरक्षित रखते हैं।
- issue: आत्मा के विपरीत σὰρξ का अर्थ
  choice: व्यापक पद ‘देह’ को बनाए रखना
  alternative: पापी स्वभाव, मात्र मानवीय प्रयास, या केवल भौतिक शरीर
  rationale: यीशु के कथन का तनाव किसी एक मानवशास्त्रीय व्याख्या तक सीमित नहीं किया गया है।
- issue: अंतिम खंड में πνεῦμά ἐστιν का विधेयगत बल
  choice: गुणसूचक—वचन ‘आत्मा और जीवन हैं’
  alternative: पहचानसूचक—वचन ‘पवित्र आत्मा और जीवन हैं’; अथवा व्याख्यात्मक—‘आत्मिक और जीवनदायक हैं’
  rationale: अनिर्दिष्ट विधेय मूलतः गुणसूचक अर्थ का समर्थन करता है। इसलिए संक्षिप्त मूल अभिव्यक्ति को रखा गया है, पर विकल्प पादटिप्पणी में बताए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आत्मा’, ‘देह’, ‘वचन’ और ‘जीवन’ जैसे संक्षिप्त पद यूहन्ना के मूल कथन की धर्मवैज्ञानिक गहराई और तनाव को बिना अनावश्यक व्याख्या के बनाए रखते हैं।
