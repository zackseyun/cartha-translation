translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लम्बे यूनानी वाक्य को पठनीय हिन्दी के लिए दो वाक्यों में बाँटा गया है। ‘समुद्र’ के बजाय सन्दर्भानुकूल ‘झील’ चुना गया है, जबकि नाव के दो यूनानी रूपों का अन्तर मुख्य पाठ और पादटिप्पणियों में सुरक्षित है।
