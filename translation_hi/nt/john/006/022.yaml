  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: hi
  text: अगले दिन, झील के उस पार ठहरी हुई भीड़ ने देखा कि वहाँ एक को छोड़कर कोई दूसरी छोटी नाव[a] नहीं थी और कि यीशु अपने शिष्यों के साथ नाव[b] में नहीं चढ़े थे, बल्कि केवल उनके शिष्य ही चले गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नाव’; यहाँ यूनानी शब्द πλοιάριον लघुतासूचक रूप में है।
    reason: lexical_alternative
  - marker: b
    text: इस पद में कुछ पाण्डुलिपियों और संस्करणों में ‘छोटी नाव’ (πλοιάριον) और ‘नाव’ (πλοῖον) के पाठ में भिन्नता है। अनुवाद प्रत्येक खण्ड में मुद्रित यूनानी पाठ के शब्द को दर्शाता है।
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: अगले दिन
  rationale: यह कालसूचक पद अगले दिन की घटनाओं की ओर स्वाभाविक संक्रमण कराता है।
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: ठहरी हुई भीड़
  rationale: पूर्ण कृदन्त ἑστηκὼς उस भीड़ की बनी हुई स्थिति को व्यक्त करता है; ‘ठहरी हुई’ इस भाव को सहज हिन्दी में रखता है।
- source_word: πέραν τῆς θαλάσσης
  choice: झील के उस पार
  rationale: πέραν स्थान को दूसरी ओर बताता है। सन्दर्भ गलील की झील का है, इसलिए आधुनिक हिन्दी में ‘झील’ भौगोलिक रूप से स्पष्ट और स्वाभाविक है।
- source_word: εἶδον
  choice: देखा / उन्होंने यह भी देखा
  rationale: यूनानी में मुख्य क्रिया बहुवचन है, यद्यपि συλλογικός संज्ञा ὄχλος एकवचन है। हिन्दी में पहले ‘भीड़ ने देखा’ और फिर अर्थ-स्पष्टता के लिए ‘उन्होंने’ स्वाभाविक है।
- source_word: πλοιάριον
  choice: छोटी नाव
  rationale: πλοιάριον लघुतासूचक रूप है; ‘छोटी नाव’ उस रूपगत बारीकी को व्यक्त करता है।
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: वहाँ एक को छोड़कर कोई दूसरी छोटी नाव नहीं थी
  rationale: यह रचना केवल एक नाव की उपस्थिति पर बल देती है; हिन्दी वाक्य उसी अपवाद और निषेध को स्पष्ट रखता है।
- source_word: οὐ συνεισῆλθεν ... εἰς τὸ πλοῖον
  choice: अपने शिष्यों के साथ नाव में नहीं चढ़े थे
  rationale: संयुक्त क्रिया साथ प्रवेश करने का अर्थ देती है। नाव के सन्दर्भ में ‘साथ नाव में चढ़ना’ स्वाभाविक हिन्दी है और साथ जाने के भाव को बनाए रखता है।
- source_word: μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον
  choice: केवल उनके शिष्य ही चले गए थे
  rationale: μόνοι के अनन्य बल को ‘केवल ... ही’ से सुरक्षित रखा गया है और ἀπῆλθον को सहज रूप में ‘चले गए थे’ कहा गया है।
