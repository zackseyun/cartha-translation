id: JHN.6.9
reference: John 6:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἔστιν ⸀παιδάριον ὧδε ⸀ὃς ἔχει πέντε ἄρτους κριθίνους καὶ δύο ὀψάρια· ἀλλὰ ταῦτα τί ἐστιν εἰς τοσούτους;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: hi
  text: यहाँ एक लड़का है, जिसके पास जौ की पाँच रोटियाँ और दो मछलियाँ हैं; लेकिन इतने लोगों के लिए ये क्या हैं?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इतने लोगों के लिए इनसे क्या होगा?”
    reason: मूल यूनानी प्रश्न का भाव उपलब्ध भोजन की अपर्याप्तता का मूल्यांकन भी हो सकता है; यह विकल्प उस निहित भाव को अधिक स्पष्ट करता है।
lexical_decisions:
- source_word: παιδάριον
  choice: लड़का
  rationale: यह शब्द किसी बालक या कम उम्र के लड़के को सूचित करता है। आधुनिक हिन्दी में “लड़का” स्वाभाविक है और आयु को अनावश्यक रूप से अधिक निश्चित नहीं करता।
- source_word: ὧδε
  choice: यहाँ
  rationale: यह सीधा स्थानवाचक क्रियाविशेषण है; “यहाँ” संक्षिप्त और स्वाभाविक अनुवाद है।
- source_word: ὃς ἔχει
  choice: जिसके पास ... हैं
  rationale: सम्बन्धवाचक उपवाक्य लड़के की पहचान उसके पास मौजूद भोजन से कराता है। हिन्दी में अधिकार या उपलब्धता व्यक्त करने का यह स्वाभाविक ढंग है।
- source_word: ἄρτους κριθίνους
  choice: जौ की ... रोटियाँ
  rationale: ἄρτους रोटी अथवा पावरोटी जैसी रोटियों को और κριθίνους जौ को सूचित करता है। “जौ की रोटियाँ” सामान्य पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: ὀψάρια
  choice: मछलियाँ
  rationale: इस प्रसंग में शब्द रोटी के साथ खाई जाने वाली मछली को सूचित करता है। मूल शब्द के लघु रूप के बावजूद आकार को निश्चित करना आवश्यक नहीं, इसलिए “छोटी मछलियाँ” नहीं जोड़ा गया।
- source_word: ἀλλὰ
  choice: लेकिन
  rationale: यह उपलब्ध थोड़े भोजन और बड़ी भीड़ के बीच विरोध दिखाता है; “लेकिन” आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: ταῦτα τί ἐστιν
  choice: ये क्या हैं
  rationale: यह प्रश्न भोजन की इतनी बड़ी भीड़ के लिए अपर्याप्तता को अलंकारिक ढंग से व्यक्त करता है। अपेक्षाकृत शाब्दिक रूप मूल की प्रश्नात्मक शक्ति और अर्थगत खुलापन बनाए रखता है।
- source_word: εἰς τοσούτους
  choice: इतने लोगों के लिए
  rationale: यहाँ εἰς उपलब्ध भोजन की इतनी बड़ी संख्या के लोगों के सापेक्ष पर्याप्तता का भाव देता है। “इतने लोगों के लिए” हिन्दी में वही सम्बन्ध स्वाभाविक रूप से व्यक्त करता है।
