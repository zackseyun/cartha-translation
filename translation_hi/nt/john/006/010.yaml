  terminology: “लोगों” appropriately renders ἀνθρώπους, while “पुरुष” preserves the male-specific force of ἄνδρες. “बहुत घास” and “लगभग पाँच हज़ार” accurately and idiomatically convey the corresponding Greek expressions.
