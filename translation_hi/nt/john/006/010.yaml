  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: hi
  text: यीशु ने कहा, “लोगों को बैठा दो।” उस स्थान पर बहुत घास थी। इसलिए पुरुष बैठ गए, जिनकी संख्या लगभग पाँच हज़ार थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में पहले ‘लोगों’ (ἀνθρώπους) और फिर ‘पुरुषों’ (ἄνδρες) कहा गया है; इसलिए लगभग पाँच हज़ार की संख्या विशेष रूप से पुरुषों की है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν
  choice: लोगों को बैठा दो
  rationale: ποιέω के आज्ञार्थक रूप के साथ ἀναπεσεῖν यहाँ कारक भाव व्यक्त करता है। आधुनिक हिन्दी में ‘लोगों को बैठा दो’ स्वाभाविक है और ἀνθρώπους के व्यापक अर्थ को बनाए रखता है।
- source_word: χόρτος πολὺς
  choice: बहुत घास
  rationale: यह सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप है, जो घास की प्रचुरता बताता है।
- source_word: ἀνέπεσαν
  choice: वे बैठ गए
  rationale: क्रिया भोजन के लिए टिककर बैठने या लेटने का संकेत दे सकती है; इस बाहरी परिवेश में ‘बैठ गए’ सहज हिन्दी है और अनावश्यक सांस्कृतिक विशिष्टता से बचती है।
- source_word: οἱ ἄνδρες
  choice: पुरुषों
  rationale: ἀνήρ यहाँ पुरुषों को निर्दिष्ट करता है और पहले आए व्यापक ἄνθρωποι से इसका भेद बनाए रखना आवश्यक है।
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: पुरुषों की संख्या लगभग पाँच हज़ार थी
  rationale: ‘संख्या’ τὸν ἀριθμόν को और ‘लगभग’ ὡς द्वारा व्यक्त अनुमान को स्पष्ट रूप से दर्शाते हैं।
theological_decisions:
- issue: भीड़ और गिने गए पुरुषों के बीच लैंगिक शब्दभेद
  choice: पहले ‘लोगों’ और बाद में ‘पुरुषों’ का प्रयोग
  alternative: दोनों स्थानों पर ‘लोग’ कहना
  rationale: यूनानी पाठ पहले व्यापक ἀνθρώπους और फिर पुरुष-विशिष्ट ἄνδρες का प्रयोग करता है। इस भेद को बनाए रखने से स्पष्ट होता है कि लगभग पाँच हज़ार की गिनती पुरुषों की थी, बिना शेष भीड़ के विषय में कोई अतिरिक्त निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, स्वाभाविक और गरिमापूर्ण कथात्मक शैली। ‘बैठा दो/बैठ गए’ को हिन्दी में भोजन के लिए स्थान ग्रहण करने की सहज अभिव्यक्ति के रूप में चुना गया है।
