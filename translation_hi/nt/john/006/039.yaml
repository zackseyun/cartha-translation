language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: hi
  text: और मुझे भेजनेवाले की इच्छा यह है कि उसने जो कुछ मुझे दिया है[a], उसमें से मैं कुछ भी न खोऊँ, बल्कि उसे अंतिम दिन फिर जीवित करूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे व्यक्तियों के संबंध में अधिक स्पष्ट रूप से इस प्रकार भी कहा जा सकता है: “जितने लोग उसने मुझे दिए हैं ... उनमें से किसी को न खोऊँ ... उन्हें अंतिम दिन फिर जीवित करूँ।” यूनानी में सामूहिक एकवचन अभिव्यक्ति है, जिसका शाब्दिक रूप है “जो कुछ ... उसे।”'
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  choice: इच्छा
  rationale: यह परमेश्वर की अभिलाषा और उद्देश्य—दोनों का स्वाभाविक रूप से बोध कराता है, बिना इसे केवल कामना या किसी विशिष्ट धर्मवैज्ञानिक संकल्प तक सीमित किए।
- source_word: τοῦ πέμψαντός με
  choice: मुझे भेजनेवाले
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत का संबंधपरक और क्रियात्मक बल बनाए रखते हुए यह आधुनिक हिन्दी में सहज है।
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: उसने जो कुछ मुझे दिया है
  rationale: नपुंसकलिंग एकवचन की सामूहिक अभिव्यक्ति को ‘जो कुछ’ द्वारा सुरक्षित रखा गया है; इसे पहले से व्यक्तियों के रूप में स्पष्ट नहीं किया गया।
- source_word: δέδωκέν
  choice: दिया है
  rationale: यूनानी पूर्ण काल की पूर्ण हो चुकी क्रिया और उसके वर्तमान परिणाम को हिन्दी का पूर्ण पक्ष स्वाभाविक रूप से व्यक्त करता है।
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: उसमें से मैं कुछ भी न खोऊँ
  rationale: संदर्भ में ἀπόλλυμι का अर्थ ‘नष्ट करना’ से अधिक ‘खोना’ है; ‘उसमें से’ यूनानी ἐξ αὐτοῦ और सामूहिक पूर्वपद से उसका संबंध बनाए रखता है।
- source_word: ἀναστήσω αὐτὸ
  choice: उसे ... फिर जीवित कर उठाऊँ
  rationale: यह अंतिम दिन के पुनरुत्थान का अर्थ स्पष्ट करता है और एकवचन αὐτό के अनुरूप ‘उसे’ रखता है।
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: अंतिम दिन
  rationale: यह यूहन्ना के युगांत-संबंधी संदर्भ का स्वाभाविक और परिचित हिन्दी रूप है।
theological_decisions:
- issue: सामूहिक नपुंसकलिंग अभिव्यक्ति को वस्तुगत रूप में रखा जाए या व्यक्तियों के रूप में स्पष्ट किया जाए
  choice: जो कुछ ... उसमें से ... उसे
  alternative: जितने लोग ... उनमें से किसी को ... उन्हें
  rationale: मूल यूनानी में πᾶν, ὃ और αὐτό नपुंसकलिंग एकवचन हैं। मुख्य पाठ उस सामूहिक एकवचन को बनाए रखता है और संदर्भ में उसका संकेत लोगों की ओर होने की संभावना को पादटिप्पणी में देता है, जिससे मूल की वास्तविक अभिव्यक्ति और धर्मवैज्ञानिक तनाव सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फिर जीवित कर उठाऊँ’ पुनरुत्थान का भाव स्पष्ट करता है, जबकि ‘जो कुछ ... उसे’ मूल यूनानी की सामूहिक एकवचन संरचना को सुरक्षित रखता है।
