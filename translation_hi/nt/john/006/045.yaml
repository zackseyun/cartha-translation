reference: John 6:45
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔστιν γεγραμμένον ἐν τοῖς προφήταις· Καὶ ἔσονται πάντες διδακτοὶ θεοῦ· ⸀πᾶς ὁ ⸀ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: hi
  text: भविष्यद्वक्ताओं के लेखों में लिखा है, “वे सब परमेश्वर से शिक्षा पाएँगे।”[a] हर वह व्यक्ति जिसने पिता से सुना और सीखा है, मेरे पास आता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे सब परमेश्वर द्वारा सिखाए हुए होंगे।”
    reason: διδακτοὶ θεοῦ की वैकल्पिक, अधिक शाब्दिक अभिव्यक्ति; θεοῦ को कर्ता के रूप में स्पष्ट करती है।
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: लिखा है
  rationale: यूनानी परिपदात्मक पूर्णकाल का स्वाभाविक हिन्दी रूप; यह लिखे हुए वचन की वर्तमान प्रामाणिकता बनाए रखता है।
- source_word: ἐν τοῖς προφήταις
  choice: भविष्यद्वक्ताओं के लेखों में
  rationale: यह रूप सम्भावित शास्त्रीय भविष्यद्वाणी-संग्रह का संकेत स्पष्ट करता है और हिन्दी में केवल व्यक्तियों के भीतर लिखे होने जैसी अस्वाभाविकता से बचता है।
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: वे सब परमेश्वर से शिक्षा पाएँगे
  rationale: भविष्यकाल और परमेश्वर को शिक्षा के स्रोत/कर्ता के रूप में सुरक्षित रखते हुए स्वाभाविक आधुनिक हिन्दी देता है।
- source_word: πᾶς ὁ
  choice: हर वह व्यक्ति जिसने
  rationale: एकवचन सार्वभौमिक अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν
  choice: जिसने पिता से सुना और सीखा है
  rationale: दोनों कृदन्तों की मुख्य क्रिया से पूर्व की क्रिया तथा παρά के स्रोतार्थ को बनाए रखता है।
- source_word: ἔρχεται πρὸς ἐμέ
  choice: मेरे पास आता है
  rationale: वर्तमानकाल और यीशु की ओर व्यक्तिगत आने के भाव का सामान्य हिन्दी रूप।
theological_decisions:
- issue: परमेश्वर की शिक्षा और यीशु के पास आने का सम्बन्ध
  choice: पिता से सुनने और सीखने वाला यीशु के पास आता है
  alternative: इसे या तो कठोर नियतिवादी अर्थ में अथवा मुख्यतः मानवीय प्रत्युत्तर पर बल देने वाले अर्थ में स्पष्ट करना
  rationale: यूनानी पाठ सम्बन्ध और क्रम बताता है, पर उसकी तात्त्विक प्रक्रिया नहीं समझाता; अनुवाद उसी तनाव को खुला रखता है।
- issue: “पिता” और यीशु का सम्बन्ध
  choice: “पिता” और “मेरे” को सीधे सम्बन्ध में रखा गया है
  alternative: इस सम्बन्ध की व्याख्या जोड़ना
  rationale: इससे यूहन्ना के मसीह-संबंधी कथन का बल बना रहता है, बिना पाठ से आगे बढ़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु साधारण पाठक के लिए सहज। “भविष्यद्वक्ताओं के लेखों” से शास्त्रीय संग्रह का आशय स्पष्ट किया गया है। उद्धरण में “परमेश्वर से शिक्षा पाएँगे” स्वाभाविक हिन्दी है और पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
