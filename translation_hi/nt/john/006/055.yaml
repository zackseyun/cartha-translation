  edition: SBLGNT
  text: ἡ γὰρ σάρξ μου ⸀ἀληθής ἐστι βρῶσις, καὶ τὸ αἷμά μου ⸁ἀληθής ἐστι πόσις.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: hi
  text: क्योंकि मेरा मांस सच्चा भोजन है,[a] और मेरा लहू सच्चा पेय है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वास्तविक भोजन”; और आगे “वास्तविक पेय।”
    reason: ἀληθής के लिए ‘वास्तविक’ एक सम्भव शाब्दिक विकल्प है, जिससे पाठक मूल की अर्थ-सीमा देख सकता है।
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है और यूनानी γάρ की संवादगत भूमिका को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: σάρξ
  choice: मांस
  rationale: यीशु के मांस और लहू की समानांतर अभिव्यक्ति को अक्षुण्ण रखने के लिए शाब्दिक और प्रचलित शब्द चुना गया; ‘शरीर’ अधिक व्याख्यात्मक होता।
- source_word: ἀληθής
  choice: सच्चा
  rationale: यह यूनानी विशेषण के सीधे अर्थ और यूहन्ना-साहित्य में उसके धर्मवैचारिक भार को सुरक्षित रखता है; ‘वास्तविक’ भी सम्भव है, पर वह प्रसंग की व्याख्या को कुछ अधिक निर्धारित कर सकता है।
- source_word: βρῶσις
  choice: भोजन
  rationale: यह शब्द खाने की क्रिया या खाई जाने वाली वस्तु दोनों को सूचित कर सकता है, पर यहाँ विधेय-रचना और πόσις के साथ समानांतरता ‘भोजन’ अर्थ का समर्थन करती है।
- source_word: αἷμα
  choice: लहू
  rationale: मांस और लहू की समानांतरता को रखते हुए मूल शब्द का सीधा अनुवाद किया गया। ‘लहू’ आधुनिक हिन्दी में समझने योग्य और बाइबलीय प्रसंग के अनुकूल है।
- source_word: πόσις
  choice: पेय
  rationale: यह पीने की क्रिया या पी जाने वाली वस्तु दोनों को सूचित कर सकता है; यहाँ βρῶσις के साथ समानांतर विधेय-रचना के कारण ‘पेय’ उपयुक्त है।
theological_decisions:
- issue: प्रभु-भोज सम्बन्धी प्रसंग में ἀληθής का अनुवाद ‘सच्चा’ किया जाए या अधिक व्याख्यात्मक ‘वास्तविक’
  choice: सच्चा
  alternative: वास्तविक
  rationale: यह चयन मूल विशेषण की सीधी शक्ति को बनाए रखता है और पद के संस्कारवादी या प्रतीकात्मक अर्थ को अनुवाद में पहले से तय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और निकट-शाब्दिक शैली। ‘मांस’ और ‘लहू’ से मूल की तीखी समानांतर छवि सुरक्षित रखी गई है; ‘भोजन’ और ‘पेय’ स्वाभाविक संज्ञात्मक जोड़ी बनाते हैं।
