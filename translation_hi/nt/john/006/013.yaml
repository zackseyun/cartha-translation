  yaml_path: translation/nt/john/006/013.yaml
  text: So they gathered them[b][a], and filled twelve baskets with pieces from the five barley loaves left over by those who had eaten.
translation:
  language: hi
  text: इसलिए उन्होंने जौ की उन पाँच रोटियों के टुकड़ों से, जो खाने के बाद बच गए थे, बारह टोकरियाँ भर दीं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘खंड’; यूनानी शब्द κλασμάτων टूटी हुई रोटियों के टुकड़ों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘जो खाने वालों के लिए अधिक हुए/बचे रहे’; आशय भोजन के बाद बचे हुए भागों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγον οὖν
  choice: इसलिए उन्होंने उन्हें इकट्ठा किया
  rationale: οὖν पिछले पद में यीशु की आज्ञा के परिणाम को दर्शाता है; ‘इसलिए’ उसका निष्कर्षसूचक बल बनाए रखता है। क्रिया का कर्म संदर्भ से स्पष्ट है, इसलिए स्वाभाविक हिन्दी के लिए ‘उन्हें’ जोड़ा गया है।
- source_word: ἐγέμισαν δώδεκα κοφίνους
  choice: बारह टोकरियाँ भर दीं
  rationale: ἐγέμισαν का सीधा अर्थ ‘भर दिया’ और κοφίνους का सामान्य, स्पष्ट अर्थ ‘टोकरियाँ’ है; स्रोत में न दी गई टोकरी की अधिक विशिष्ट बनावट नहीं जोड़ी गई।
- source_word: κλασμάτων
  choice: टुकड़ों
  rationale: यह तोड़ी गई रोटियों के बचे अंशों को दर्शाता है। ‘टुकड़े’ आधुनिक हिन्दी में सहज और अर्थ की दृष्टि से पर्याप्त स्पष्ट है।
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  choice: जौ की उन पाँच रोटियों के
  rationale: ἄρτοι को इस भोजन-वर्णन में ‘रोटियाँ’ और κριθίνων को ‘जौ की’ कहना मूल सामग्री तथा पाँच रोटियों से संबंध दोनों सुरक्षित रखता है। ‘उन’ पूर्वोक्त रोटियों की ओर संकेत करता है।
- source_word: ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν
  choice: जो खा चुके लोगों के लिए आवश्यकता से अधिक निकले थे
  rationale: ἐπερίσσευσαν में ‘अधिक होना/बच रहना’ और τοῖς βεβρωκόσιν में पूर्ण हो चुकी खाने की क्रिया निहित है। यह रूप यूनानी के ‘खा चुके लोगों के लिए अधिक हुए’ संबंध को पूरी तरह ‘उनके द्वारा छोड़े गए’ में बदलने के बजाय उसकी असामान्य संरचना और अर्थगत तनाव को यथासंभव बनाए रखता है।
