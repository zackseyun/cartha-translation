review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the narrative connective, the large crowd, and the ongoing force of the imperfect verbs. It also rightly renders σημεῖα as “चिन्ह,” preserving John’s terminology. However, “बीमार लोगों पर ... कर रहा था” is not a natural Hindi way to describe signs performed in relation to sick people and can suggest an unintended action done physically ‘on’ them.
  naturalness: “उसके पीछे चली आ रही थी” is understandable, but “उसका पीछा कर रही थी” is more idiomatic and direct for ἀκολουθέω in this context. The principal naturalness problem is “लोगों पर चिन्ह करना.”
  terminology: “चिन्ह” is the appropriate main-text term. The footnote’s alternatives are useful and its explanation accurately states the revelatory force of John’s usage without overinterpreting it.
  issues:
  - severity: medium
    issue: Unidiomatic expression “बीमार लोगों पर ... चिन्ह ... कर रहा था”
    rationale: Hindi normally does not say that someone ‘does signs on people.’ “बीमार लोगों के लिए” naturally conveys that the signs were performed in relation to sick people, while retaining the source’s non-specific wording rather than explicitly inserting ‘healed.’
  - severity: low
    issue: “उसके पीछे चली आ रही थी” is less direct than the ordinary Hindi idiom for following someone
    rationale: “उसका पीछा कर रही थी” naturally renders the ongoing sense of ἠκολούθει without adding material.
  revised_text: और एक बड़ी भीड़ उसका पीछा कर रही थी, क्योंकि वे उन चिन्हों[a] को देख रहे थे जो वह बीमार लोगों के लिए कर रहा था।
