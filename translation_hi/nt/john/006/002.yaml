    text: या “चमत्कार” अथवा “चमत्कारी चिन्ह”; यूहन्ना का शब्द “चिन्ह” इस बात पर बल देता है कि ये काम यीशु के विषय में क्या प्रकट करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: पीछे चली आ रही थी
  rationale: अपूर्ण काल चलती हुई भूतकालीन क्रिया दर्शाता है; यह प्रयोग हिन्दी में उस निरंतरता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है, प्रबल विरोधसूचक नहीं।
- source_word: ὄχλος πολύς
  choice: एक बड़ी भीड़
  rationale: यह वाक्यांश लोगों के बड़े समूह और πολύς के परिमाणात्मक बल, दोनों को स्पष्ट रखता है।
- source_word: ἐθεώρουν
  choice: देख रहे थे
  rationale: अपूर्ण काल निरंतर या बार-बार देखने का भाव देता है; हिन्दी का अपूर्ण प्रगतिशील रूप इसे सहजता से व्यक्त करता है।
- source_word: σημεῖα
  choice: चिन्हों
  rationale: यूहन्ना में यह शब्द उन आश्चर्यकर्मों के प्रकटकारी अर्थ की ओर संकेत करता है; केवल 'चमत्कार' कहना उस अर्थ को सीमित कर सकता है।
- source_word: ἐποίει
  choice: कर रहा था
  rationale: अपूर्ण काल यीशु की जारी गतिविधि को व्यक्त करता है और मूल के सामान्य क्रिया-शब्द को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: बीमार लोगों पर
  rationale: ἐπί के साथ सम्बन्धित व्यक्तियों को इन चिन्हों की क्रिया के लक्ष्य के रूप में सीधे व्यक्त करता है; हिन्दी में 'लोगों पर करना' कुछ औपचारिक है, पर मूल संरचना को निकटता से सुरक्षित रखता है।
- source_word: ἀσθενούντων
  choice: बीमार लोगों
  rationale: संदर्भ में कृदन्त शारीरिक रूप से रोगग्रस्त व्यक्तियों को दर्शाता है।
theological_decisions:
- issue: यूहन्ना में σημεῖα की शब्दावली
  choice: चिन्ह
  alternative: चमत्कार; आश्चर्यकर्म
  rationale: '''चिन्ह'' इन कामों के अलौकिक स्वरूप के साथ-साथ इस बात को भी खुला रखता है कि वे यीशु के विषय में कुछ प्रकट करते हैं; यह यूहन्ना की विशिष्ट शब्दावली को सुरक्षित रखता है।'
