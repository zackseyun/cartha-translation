- from: और एक बड़ी भीड़ उसके पीछे चली आ रही थी, क्योंकि वे उन चिन्हों[a] को देख रहे थे जो वह बीमार लोगों पर कर रहा था।
  to: और एक बड़ी भीड़ उसका पीछा कर रही थी, क्योंकि वे उन चिन्हों[a] को देख रहे थे जो वह बीमार लोगों के लिए कर रहा था।
  rationale: The revision replaces the unnatural literalized Hindi construction “बीमार लोगों पर ... करना” with “बीमार लोगों के लिए ... करना,” which clearly communicates the signs’ relation to sick people without specifying the nature of each act. It also uses the more idiomatic progressive expression “उसका पीछा कर रही थी” for the crowd’s ongoing following. The imperfect aspect, Johannine “signs” terminology, and footnote anchor are retained.
  reviewer_model: gpt-5.6-terra
