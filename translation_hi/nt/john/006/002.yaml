base_translation:
  language: en
  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
translation:
  language: hi
  text: और एक बड़ी भीड़ उसका पीछा कर रही थी, क्योंकि वे उन चिन्हों[a] को देख रहे थे जो वह बीमार लोगों के लिए कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
