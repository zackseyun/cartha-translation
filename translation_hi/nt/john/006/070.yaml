source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: hi
  text: यीशु ने उन्हें उत्तर दिया, “क्या मैंने तुम बारहों को नहीं चुना? फिर भी तुममें से एक शैतान[a] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झूठा आरोप लगानेवाला।” यूनानी शब्द किसी पर झूठा दोष लगानेवाले को सूचित कर सकता है और अनेक संदर्भों में शैतान के लिए भी प्रयुक्त होता है। यहाँ वाक्य-रचना किसी व्यक्ति को सीधे स्वयं शैतान ठहराने के बजाय उसके चरित्र का वर्णन करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: यूहन्ना के संवाद-वर्णन में यह स्वाभाविक और मानक हिन्दी अभिव्यक्ति है।
- source_word: Οὐκ ἐγὼ ... ἐξελεξάμην;
  choice: क्या मैंने ... नहीं चुना?
  rationale: οὐκ के साथ यह आलंकारिक प्रश्न सकारात्मक उत्तर की अपेक्षा करता है; हिन्दी संरचना उसी बल को स्वाभाविक रूप से बनाए रखती है।
- source_word: ὑμᾶς τοὺς δώδεκα
  choice: तुम बारहों को
  rationale: यह पहचाने हुए शिष्य-समूह की ओर संकेत करता है। ‘बारहों’ आधुनिक हिन्दी में समूहवाचक अर्थ को स्पष्ट और सहज बनाता है।
- source_word: καὶ
  choice: फिर भी
  rationale: शाब्दिक अर्थ ‘और’ है, पर यहाँ यीशु द्वारा बारहों को चुनने और उनमें से एक के विरोधी चरित्र के बीच स्पष्ट विरोध है; ‘फिर भी’ इस संवादगत संबंध को व्यक्त करता है।
- source_word: ἐξ ὑμῶν
  choice: तुममें से
  rationale: यह यूनानी के अंशवाचक अर्थ का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: διάβολός
  choice: एक शैतान
  rationale: अनिश्चित/गुणवाचक विधेय ‘एक शैतान’ कथन की तीक्ष्णता को बनाए रखता है, पर उसे सीधे ‘वही शैतान’ अर्थात् स्वयं प्रधान दुष्ट की पहचान नहीं बनाता। वैकल्पिक अर्थ ‘झूठा आरोप लगानेवाला’ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: क्या διάβολός उस व्यक्ति की शैतान के रूप में सीधी पहचान है या उसके चरित्र का गुणवाचक वर्णन
  choice: एक शैतान
  alternative: शैतान; झूठा आरोप लगानेवाला
  rationale: यूनानी में संज्ञा यहाँ बिना उपपद के विधेय रूप में है और गुणवाचक बल रख सकती है। ‘एक शैतान’ यीशु के कथन का प्रबल धार्मिक और आलंकारिक तनाव बनाए रखता है, जबकि ‘वही शैतान’ जैसी सीधी तादात्म्य-स्थापना से बचता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तुम बारहों’ सामान्य पाठक के लिए सहज है, और ‘एक शैतान’ मूल कथन की कठोरता तथा उसकी वास्तविक अर्थगत अस्पष्टता दोनों को सुरक्षित रखता है।
