  text: ἀπεκρίθη ⸀ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ ἔργον τοῦ θεοῦ ἵνα ⸀πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: hi
  text: यीशु ने उन्हें उत्तर दिया और कहा, “परमेश्वर का कार्य[a] यह है कि तुम उस पर विश्वास करो[b] जिसे उसने भेजा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह कार्य जो परमेश्वर चाहता है” अथवा “वह कार्य जो परमेश्वर करता है।” यूनानी वाक्यांश “परमेश्वर का कार्य” एक से अधिक अर्थों में समझा जा सकता है; इसलिए मुख्य पाठ में यह अस्पष्टता बनाए रखी गई है।
    reason: alternative_reading
  - marker: b
    text: या “उस पर भरोसा रखो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: यीशु ने उन्हें उत्तर दिया
  rationale: यूनानी में शाब्दिक रूप से ‘यीशु ने उत्तर दिया और उनसे कहा’ है। आधुनिक हिन्दी में ‘उत्तर दिया’ संवाद आरम्भ करने वाले दोनों क्रियापदों का आशय स्वाभाविक रूप से व्यक्त करता है और अनावश्यक पुनरुक्ति से बचता है।
- source_word: Τοῦτό ἐστιν
  choice: यह है
  rationale: संकेतवाचक सर्वनाम और योजक क्रिया को सीधे तथा बलयुक्त ढंग से व्यक्त करता है। हिन्दी वाक्य-विन्यास में विधेय को पहले रखकर ‘परमेश्वर का कार्य यह है’ कहना स्वाभाविक है।
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: परमेश्वर का कार्य
  rationale: 'यह यूनानी संबंधकारक की वास्तविक अस्पष्टता बनाए रखता है: इसका अर्थ परमेश्वर द्वारा अपेक्षित कार्य अथवा परमेश्वर द्वारा किया जाने वाला कार्य हो सकता है।'
- source_word: ἵνα πιστεύητε
  choice: कि तुम ... विश्वास करो
  rationale: ἵνα यहाँ कार्य की विषय-वस्तु या अपेक्षित परिणाम प्रस्तुत करता है। वर्तमान संभावनार्थक क्रिया का स्वाभाविक हिन्दी रूप ‘विश्वास करो’ है।
- source_word: εἰς ὃν
  choice: उस पर ... जिसे
  rationale: यूहन्ना में πιστεύω εἰς का सामान्य व्यक्तिगत अर्थ ‘किसी पर विश्वास करना’ है। यह व्यक्ति को लक्ष्य के रूप में स्पष्ट रखता है।
- source_word: ἀπέστειλεν ἐκεῖνος
  choice: जिसे उसने भेजा है
  rationale: ‘उसने’ का संकेत परमेश्वर की ओर है। ‘भेजा है’ उस भेजे जाने की वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: τοῦ θεοῦ संबंधकारक का अर्थ
  choice: मुख्य पाठ में ‘परमेश्वर का कार्य’ रखकर अस्पष्टता बनाए रखना
  alternative: ‘वह कार्य जो परमेश्वर चाहता है’ अथवा ‘वह कार्य जो परमेश्वर करता है’
  rationale: प्रसंग मनुष्यों से अपेक्षित कार्य का समर्थन करता है, पर उत्तर विश्वास को परमेश्वर द्वारा भेजे गए व्यक्ति पर केंद्रित करता है। यूनानी व्याकरण किसी एक अर्थ को अनिवार्य नहीं करता, इसलिए अनुवाद इस तनाव को सिद्धान्तगत रूप से हल नहीं करता।
- issue: πιστεύω εἰς का अनुवाद
  choice: उस पर विश्वास करो
  alternative: उस पर भरोसा रखो
  rationale: ‘विश्वास करना’ इस शब्द-समूह का स्पष्ट और प्रचलित हिन्दी अनुवाद है; ‘भरोसा रखना’ उसके संबंधपरक अर्थ की वैध वैकल्पिक अभिव्यक्ति है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परमेश्वर का कार्य’ स्रोत की अर्थगत अस्पष्टता को सुरक्षित रखता है, जबकि ‘उस पर विश्वास करो’ आधुनिक मानक हिन्दी में व्यक्तिगत विश्वास का स्वाभाविक प्रयोग है।
