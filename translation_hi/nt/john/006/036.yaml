  text: ἀλλ’ εἶπον ὑμῖν ὅτι καὶ ἑωράκατέ με καὶ οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/036.yaml
  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: hi
  text: लेकिन मैंने तुमसे कहा था कि तुमने मुझे देखा भी है[a], फिर भी तुम विश्वास नहीं करते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “तुमने सचमुच मुझे देखा है, और फिर भी तुम विश्वास नहीं करते।”'
    reason: पहले καί के बलाघाती अर्थ और यूनानी की समन्वयी संरचना का वैकल्पिक, अधिक औपचारिक निरूपण।
lexical_decisions:
- source_word: ἀλλ’
  choice: लेकिन
  rationale: पिछले कथन के साथ स्पष्ट विरोध दिखाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: εἶπον ὑμῖν
  choice: मैंने तुमसे कहा था
  rationale: पूर्व में कही गई बात का संकेत देते हुए यूनानी भूतकाल और अप्रत्यक्ष कर्म को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὅτι
  choice: कि
  rationale: यीशु द्वारा पहले कही गई बात की विषय-वस्तु प्रस्तुत करता है।
- source_word: καὶ ἑωράκατέ με
  choice: तुमने मुझे देखा भी है
  rationale: καί के बलाघाती अर्थ को ‘भी’ से और पूर्णकाल की वर्तमान प्रासंगिकता को ‘देखा ... है’ से व्यक्त करता है।
- source_word: καὶ οὐ πιστεύετε
  choice: फिर भी तुम विश्वास नहीं करते
  rationale: दूसरे καί को प्रसंगगत विरोध के रूप में स्वाभाविक हिन्दी में व्यक्त करता है; वर्तमानकाल उनके जारी अविश्वास को दर्शाता है।
theological_decisions:
- issue: पहले καί का बल
  choice: ‘देखा भी है’
  alternative: ‘देख तो लिया है’ या ‘यद्यपि तुमने मुझे देखा है’
  rationale: यह अनुवाद इस आश्चर्यजनक तथ्य पर बल देता है कि देखने के बावजूद विश्वास नहीं हुआ, पर यूनानी समन्वयी रचना को पूर्णतः कारणात्मक या concessive उपवाक्य में नहीं बदलता।
- issue: πιστεύετε का अनुवाद
  choice: विश्वास नहीं करते
  alternative: भरोसा नहीं करते / आस्था नहीं रखते
  rationale: यूहन्ना में πιστεύω का सीधा और प्रचलित क्रियात्मक समतुल्य ‘विश्वास करना’ है; यह अनावश्यक रूप से अर्थ को केवल बौद्धिक सहमति या किसी विशिष्ट धर्मवैधानिक धारणा तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; ‘तुम’ बहुवचन श्रोताओं के लिए प्रयुक्त है। भाषा सरल, गरिमापूर्ण और मौखिक पाठ के अनुकूल रखी गई है।
