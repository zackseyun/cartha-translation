  verdict: approve
  source_fidelity: The translation accurately represents the adversative ἀλλ’, the prior statement εἶπον ὑμῖν, the perfect ἑωράκατέ, and the continuing present οὐ πιστεύετε. “देखा भी है” appropriately retains the emphatic/marked force of the first καί without forcing a fully concessive subordinate clause; “फिर भी” clearly communicates the rhetorical contrast before the second clause.
  naturalness: The Hindi is clear, idiomatic, and suitably dignified for modern standard Hindi. “लेकिन मैंने तुमसे कहा था कि…” and “फिर भी तुम विश्वास नहीं करते” read naturally. The plural “तुम” is consistent with direct address to a group.
  terminology: “विश्वास नहीं करते” is an appropriate, established rendering of πιστεύετε in this Johannine context. No theological over-specification is introduced. The footnote provides a legitimate more formal alternative and its anchor is correctly placed.
