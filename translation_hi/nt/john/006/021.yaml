  revision_rationale: संशोधन ἤθελον के अपूर्णकालिक, स्थितिजन्य अर्थ को ‘तैयार थे’ द्वारा पुनर्स्थापित करता है। मुख्य पाठ घटना की तुरन्तता और संभावित असाधारणता को बिना व्याख्या किए बनाए रखता है, जबकि पादटिप्पणी ‘भूमि’ वाले अधिक शाब्दिक विकल्प को सुरक्षित रखती है।
