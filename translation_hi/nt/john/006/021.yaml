  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: hi
  text: इसलिए वे उसे नाव में ले लेने को तैयार थे, और तुरन्त नाव उस तट[a] पर पहुँच गई जहाँ वे जा रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुरन्त नाव उस भूमि पर थी जहाँ वे जा रहे थे।”
    reason: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς का अधिक शाब्दिक विकल्प सुरक्षित रखता है; मुख्य पाठ में ‘तट पर पहुँच गई’ जलयात्रा के संदर्भ में स्वाभाविक हिन्दी है।
lexical_decisions:
- source_word: ἤθελον
  choice: तैयार हुए
  rationale: यहाँ θέλω का अपूर्णकाल भय दूर होने के बाद उनकी तत्परता या इच्छा को व्यक्त करता है; ‘तैयार हुए’ आधुनिक हिन्दी में स्वाभाविक है और भावनात्मक चाह को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: οὖν
  choice: इसलिए
  rationale: οὖν पिछले कथन के परिणाम या निष्कर्ष को जोड़ता है; ‘इसलिए’ इस संबंध को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: उसे नाव में चढ़ा लेने
  rationale: समुद्र पर नाव के प्रसंग में इसका आशय उसे नाव के भीतर या नाव पर ले लेना है; ‘नाव में चढ़ा लेना’ हिन्दी में सहज और दृश्य के अनुकूल है।
- source_word: πλοῖον
  choice: नाव
  rationale: गलील झील के इस प्रसंग में ‘नाव’ उपयुक्त है; ‘जहाज़’ अनावश्यक रूप से बड़े जलयान का संकेत देगा।
- source_word: εὐθέως
  choice: तुरन्त
  rationale: εὐθέως घटना की तत्कालता और कथानक की आकस्मिकता बनाए रखता है।
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: नाव ... तट पर पहुँच गई
  rationale: γίνομαι के साथ स्थानवाचक पद यहाँ किसी स्थान पर हो जाने या पहुँच जाने का अर्थ दे सकता है। हिन्दी में ‘तट पर पहुँच गई’ स्वाभाविक है और नाव के सूखी भूमि पर चढ़ जाने का भ्रामक अर्थ टालता है।
- source_word: γῆς
  choice: तट
  rationale: γῆ मूलतः भूमि है, पर इस जलयात्रा के संदर्भ में गंतव्य का तट अभिप्रेत है; ‘तट’ सामान्य हिन्दी में अधिक स्पष्ट है।
- source_word: εἰς ἣν ὑπῆγον
  choice: जहाँ वे जा रहे थे
  rationale: यह चल रही यात्रा और उसके गंतव्य दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या दूसरे उपवाक्य की तत्कालता को सामान्य यात्रा के रूप में नरम किया जाए
  choice: ‘तुरन्त’ को स्पष्ट रखते हुए नाव के गंतव्य तट पर पहुँचने का सीधा कथन
  alternative: ‘कुछ ही देर में नाव तट पर पहुँच गई’ अथवा तत्कालता को केवल सामान्य आगमन मानना
  rationale: यूनानी पाठ घटना को संक्षिप्त और स्पष्ट तत्कालता के साथ कहता है। अनुवाद को संभावित चमत्कारिक बल को न तो समझाकर बढ़ाना चाहिए, न नरम करके घटाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘तैयार हुए’ तत्परता को, और ‘तुरन्त’ मूल की आकस्मिकता को बनाए रखता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘तट पर पहुँच गई’ मूल स्थानवाचक अभिव्यक्ति का स्वाभाविक संदर्भगत रूप है।
