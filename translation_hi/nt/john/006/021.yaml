- from: इसलिए वे उसे नाव में चढ़ा लेने को तैयार हुए, और नाव तुरन्त उस जगह के तट पर पहुँच गई जहाँ वे जा रहे थे।
  to: इसलिए वे उसे नाव में ले लेने को तैयार थे, और तुरन्त नाव उस तट[a] पर पहुँच गई जहाँ वे जा रहे थे।
  rationale: संशोधन ἤθελον के अपूर्णकालिक, स्थितिजन्य अर्थ को ‘तैयार थे’ द्वारा पुनर्स्थापित करता है। मुख्य पाठ घटना की तुरन्तता और संभावित असाधारणता को बिना व्याख्या किए बनाए रखता है, जबकि पादटिप्पणी ‘भूमि’ वाले अधिक शाब्दिक विकल्प को सुरक्षित रखती है।
