review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the consequential connection, taking Jesus into the boat, and the marked immediacy of the boat's arrival. However, ‘तैयार हुए’ is punctiliar (‘became ready’) and does not adequately represent the imperfect ἤθελον, which describes their willingness/disposition at that point in the narrative. ‘तैयार थे’ preserves this better. The natural contextual rendering ‘तट पर पहुँच गई’ is acceptable for ἐγένετο ... ἐπὶ τῆς γῆς, provided the more literal ‘land’ wording is retained as an alternative note.
  naturalness: '‘वे उसे नाव में ले लेने को तैयार थे’ is modern, natural Hindi and avoids the slightly more physical and potentially over-specific ‘नाव में चढ़ा लेने.’ Removing ‘उस जगह के’ also eliminates needless repetition: ‘उस तट पर ... जहाँ वे जा रहे थे’ is clear and idiomatic.'
  terminology: ‘नाव,’ ‘तुरन्त,’ and ‘तट’ suit the narrative register. The footnote preserves the lexical/formal alternative ‘भूमि’ without implying that the boat was necessarily beached. No theological expansion or softening is introduced.
  issues:
  - severity: medium
    issue: ‘तैयार हुए’ renders ἤθελον as a completed change of state.
    rationale: The imperfect ἤθελον means ‘they were willing’ or ‘they wished,’ not specifically ‘they became ready.’ ‘तैयार थे’ retains the ongoing/dispositional sense in natural Hindi.
  - severity: low
    issue: The draft omits the useful lexical alternative for ἐπὶ τῆς γῆς.
    rationale: ‘तट पर पहुँच गई’ is contextually sound, but the Greek more literally says that the boat was ‘at/on the land.’ A note preserves this alternative and the source wording's terseness.
  revised_text: इसलिए वे उसे नाव में ले लेने को तैयार थे, और तुरन्त नाव उस तट[a] पर पहुँच गई जहाँ वे जा रहे थे।
  revised_footnotes:
