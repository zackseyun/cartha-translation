source:
  edition: SBLGNT
  text: ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος ⸀Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν ⸂παραδιδόναι αὐτόν⸃, ⸀εἷς ἐκ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: hi
  text: वह शमौन इस्करियोती के पुत्र यहूदा के विषय में कह रहा था, क्योंकि वही उसे सौंप देने वाला था[a], जो बारहों में से एक था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे पकड़वा देने वाला था।”
    reason: παραδιδόναι का मूल अर्थ ‘सौंप देना’ है; इस प्रसंग में उसका आशय यीशु को अधिकारियों के हाथ पकड़वाना भी है।
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: वह ... यहूदा के विषय में कह रहा था
  rationale: अपूर्ण भूतकाल व्याख्यात्मक, जारी कथन का भाव देता है; δέ को हिंदी में अलग संयोजक से व्यक्त करना आवश्यक नहीं, क्योंकि वाक्य का प्रवाह स्वाभाविक रूप से बना रहता है।
- source_word: Σίμωνος Ἰσκαριώτου
  choice: शमौन इस्करियोती के पुत्र
  rationale: दोनों संबंधकारक रूप यहूदा की पहचान उसके पिता शमौन इस्करियोती के द्वारा कराते हैं।
- source_word: οὗτος γὰρ
  choice: क्योंकि ... वही
  rationale: क्योंकि कारणसूचक γάρ को और ‘वही’ οὗτος के संकेतात्मक बल को स्वाभाविक हिंदी में व्यक्त करते हैं।
- source_word: ἔμελλεν παραδιδόναι αὐτόν
  choice: उसे पकड़वा देने वाला था
  rationale: μέλλω भविष्य में होने वाली बात को सूचित करता है। ‘पकड़वा देना’ παραδίδωμι के ‘दूसरों के हाथ सौंपने’ और इस प्रसंग के विश्वासघाती कृत्य—दोनों को सहज हिंदी में समेटता है।
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: बारहों में से एक होते हुए भी
  rationale: समूह-संबंध को स्पष्ट रखते हुए ‘भी’ उस चौंकाने वाले विरोध को स्वाभाविक हिंदी में उभारता है कि ऐसा करने वाला बारह शिष्यों में से ही एक था।
theological_decisions:
- issue: यहूदा के लिए παραδιδόναι का अनुवाद
  choice: पकड़वा देने वाला था
  alternative: उसके साथ विश्वासघात करने वाला था / उसे सौंप देने वाला था
  rationale: मूल क्रिया का आधारभूत अर्थ ‘सौंप देना’ है, पर यहाँ उसका आशय यीशु को अधिकारियों के हाथ पकड़वाने से है। चुना हुआ पदबंध नैतिक विश्वासघात को नकारता नहीं, फिर भी केवल व्याख्यात्मक ‘विश्वासघात’ कहकर क्रिया की ठोस कार्रवाई को ओझल नहीं करता।
- issue: ἔμελλεν में नियति या अभिप्राय
  choice: देने वाला था
  alternative: देने को नियत था / देने का इरादा रखता था
  rationale: यह भविष्य में घटने वाली बात बताता है, बिना यह तय किए कि यहाँ पूर्वनियति या यहूदा का तत्काल निजी इरादा मुख्य है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक मानक हिंदी। ‘बारहों’ उस सुविख्यात शिष्य-समूह को सूचित करता है। ‘इस्करियोती’ को शमौन के साथ रखा गया है, जैसा यूनानी संबंधकारक रचना संकेत करती है।
