base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: hi
  text: जो मेरा मांस खाता है[a] और मेरा लहू पीता है, उसके पास अनन्त जीवन है, और मैं उसे अंतिम दिन पुनर्जीवित करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चबाकर खाता है” अथवा “भक्षण करता है।” यूनानी क्रिया τρώγω सामान्य ‘खाने’ की तुलना में अधिक ठोस और सजीव हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, “उठाऊँगा।” यहाँ यह क्रिया पुनरुत्थान के अर्थ में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: जो ... खाता है
  rationale: निश्चित लेख के साथ वर्तमान कृदन्त किसी ऐसे व्यक्ति को दर्शाता है जिसकी पहचान इस निरंतर क्रिया से होती है। हिंदी में ‘जो ... खाता है’ इस एकवचन व्यक्तिगत भाव और वर्तमान क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τρώγων
  choice: खाता है
  rationale: τρώγω सामान्य ‘खाने’ से अधिक ठोस और कभी-कभी ‘चबाकर खाने’ का भाव दे सकता है। मुख्य पाठ में ‘खाता है’ स्पष्ट और स्वाभाविक है; अधिक सजीव विकल्प पादटिप्पणी में रखा गया है।
- source_word: μου τὴν σάρκα
  choice: मेरा मांस
  rationale: σάρξ यहाँ ठोस अर्थ में है। ‘मांस’ मूल रूपक की तीव्रता बनाए रखता है और इसे व्याख्यात्मक रूप से ‘देह’ या किसी धार्मिक अनुष्ठान में नहीं बदलता।
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: और मेरा लहू पीता है
  rationale: दूसरा वर्तमान कृदन्त पहले के समानांतर है। ‘लहू’ ठोस अर्थ को बिना नरम किए स्वाभाविक, प्रतिष्ठित बाइबलीय हिंदी में व्यक्त करता है।
- source_word: ἔχει ζωὴν αἰώνιον
  choice: उसके पास अनन्त जीवन है
  rationale: वर्तमान काल का ἔχει अनन्त जीवन के अभी से प्राप्त अधिकार या विद्यमानता पर बल देता है। ‘उसके पास ... है’ इसे ‘पाएगा’ जैसे भविष्यकालीन अर्थ में बदले बिना सहज हिंदी में व्यक्त करता है।
- source_word: κἀγὼ ἀναστήσω αὐτὸν
  choice: और मैं उसे ... जिला उठाऊँगा
  rationale: κἀγώ में ‘और मैं’ का बल सुरक्षित है। ἀναστήσω पुनरुत्थान के संदर्भ में उठाने को दर्शाता है; ‘जिला उठाऊँगा’ हिंदी में उस अर्थ को स्पष्ट रखते हुए एकवचन αὐτόν को ‘उसे’ से बनाए रखता है।
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: अंतिम दिन
  rationale: यह यूहन्ना में प्रयुक्त मानक अंतकालीन अभिव्यक्ति है। ‘अंतिम दिन’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: मांस खाने और लहू पीने की भाषा को संस्कारात्मक या रूपकात्मक अर्थ में स्पष्ट करना
  choice: मुख्य पाठ में ठोस खाने-पीने की भाषा ज्यों की त्यों रखी गई
  alternative: इसे सीधे प्रभु-भोज अथवा विश्वास करने की व्याख्या के रूप में प्रस्तुत करना
  rationale: यूनानी पाठ स्वयं ‘मांस’, ‘लहू’, ‘खाता’ और ‘पीता’ जैसे ठोस शब्द रखता है। किसी एक सम्प्रदायगत अर्थ को मुख्य पाठ में आरोपित न करके मूल धार्मिक तनाव और व्याख्यात्मक खुलापन सुरक्षित रखा गया है।
- issue: αὐτόν के एकवचन संदर्भ का हिंदी रूप
  choice: उसे
  alternative: उन्हें या ऐसे लोगों को
  rationale: यूनानी सर्वनाम पुल्लिंग एकवचन है और एकवचन कृदन्तीय कर्ता की ओर लौटता है। हिंदी का ‘उसे’ स्वाभाविक रूप से उसी एकवचन संदर्भ को बनाए रखता है।
- issue: ἀναστήσω में पुनरुत्थान का भाव
  choice: जिला उठाऊँगा
  alternative: केवल ‘उठाऊँगा’
  rationale: केवल ‘उठाऊँगा’ हिंदी में शारीरिक रूप से खड़ा करने के अर्थ में समझा जा सकता है। संदर्भानुसार ‘जिला उठाऊँगा’ पुनरुत्थान का भाव स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘मांस’ और ‘लहू’ की ठोस भाषा को नरम या व्याख्यात्मक नहीं बनाया गया। ‘अनन्त जीवन’ परिचित धार्मिक पदावली है, जबकि वाक्य-संरचना वर्तमान हिंदी के अनुरूप रखी गई है।
