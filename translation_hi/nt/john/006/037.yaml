  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: hi
  text: जो कुछ पिता मुझे देता है, वह सब मेरे पास आएगा[a]; और जो मेरे पास आता है, उसे मैं किसी भी दशा में बाहर नहीं निकालूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल यूनानी में यहाँ नपुंसकलिंग एकवचन की सामूहिक अभिव्यक्ति है। अनुवाद यह भी हो सकता है: “पिता मुझे जो कुछ देता है, वह मेरे पास आएगा।”'
    reason: lexical_alternative
  - marker: b
    text: या “उसे मैं कभी बाहर नहीं निकालूँगा।” मूल यूनानी में निषेध बहुत प्रबल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: जो कुछ … वह सब
  rationale: यूनानी नपुंसकलिंग एकवचन की सामूहिक अभिव्यक्ति को हिन्दी में स्वाभाविक ढंग से सुरक्षित रखता है और इसे सीधे ‘हर व्यक्ति जिसे’ बनाकर व्यक्तिगत अर्थ में सीमित नहीं करता।
- source_word: δίδωσίν μοι
  choice: मुझे देता है
  rationale: वर्तमानकाल को सामान्य वर्तमान में रखा गया है; ‘दे रहा है’ या ‘दे चुका है’ जैसी अतिरिक्त कालगत व्याख्या नहीं जोड़ी गई।
- source_word: ὁ πατήρ
  choice: पिता
  rationale: यूनानी में स्पष्ट संबंधवाचक ‘मेरा’ नहीं है; यूहन्ना की प्रचलित उपाधि और संदर्भ को बिना विस्तार के रखा गया है।
- source_word: πρὸς ἐμὲ ἥξει
  choice: मेरे पास आएगा
  rationale: ἥκω के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है और यीशु के पास आने की यूहन्नाई भाषा बनाए रखता है।
- source_word: τὸν ἐρχόμενον πρός με
  choice: जो मेरे पास आता है
  rationale: निश्चित लेख सहित वर्तमान कृदन्त का सामान्य, व्यक्ति-सूचक भाव स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: उसे मैं किसी भी दशा में बाहर नहीं निकालूँगा
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को ‘किसी भी दशा में … नहीं’ से और ἔξω को ‘बाहर’ से स्पष्ट किया गया है, बिना बाद की धर्मसैद्धान्तिक निष्पत्तियाँ जोड़े।
theological_decisions:
- issue: ईश्वरीय देने और मनुष्य के आने के संबंध में सामूहिक नपुंसकलिंग πᾶν ὃ
  choice: ‘जो कुछ पिता मुझे देता है, वह सब’ के रूप में सामूहिक व्याकरण सुरक्षित रखा गया।
  alternative: ‘हर व्यक्ति जिसे पिता मुझे देता है’
  rationale: मूल यूनानी सामूहिक नपुंसकलिंग एकवचन प्रयोग करता है। हिन्दी अनुवाद इसे व्यक्तियों की व्याख्या में पूरी तरह बदलकर सामूहिक और व्यक्तिगत अर्थ के बीच की धार्मिक-व्याख्यात्मक तनातनी को समाप्त नहीं करता।
- issue: οὐ μὴ ἐκβάλω ἔξω में यीशु की प्रतिज्ञा की प्रबलता
  choice: ‘किसी भी दशा में बाहर नहीं निकालूँगा’
  alternative: ‘कभी बाहर नहीं निकालूँगा’
  rationale: प्रबल निषेध को साफ और दृढ़ आश्वासन के रूप में रखा गया है, पर इसे धीरज, धर्मत्याग या उद्धार-सुरक्षा के किसी विस्तृत साम्प्रदायिक सिद्धान्त में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सरल। ‘मेरे पास आना’ यूहन्ना की प्रमुख धार्मिक छवि को सहज रूप में रखता है। ‘निकालूँगा’ वर्तमान पाठकों के लिए ‘बहिष्कृत करूँगा’ से अधिक स्वाभाविक है, जबकि ‘बाहर’ मूल के ἔξω को स्पष्ट रखता है।
