  text: εἶπον οὖν πρὸς αὐτόν· Τί ποιῶμεν ἵνα ἐργαζώμεθα τὰ ἔργα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: hi
  text: तब उन्होंने उससे कहा, “हम क्या करें कि परमेश्वर के काम करें?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमें क्या करना चाहिए ताकि हम परमेश्वर के काम कर सकें?” यूनानी वाक्यांश का अर्थ “वे काम जो परमेश्वर हमसे चाहता है” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: उन्होंने कहा
  rationale: λέγω के अओरिस्ट रूप को सामान्य भूतकालीन कथन के रूप में प्रस्तुत किया गया है; इससे बोलने की क्रिया पर अनावश्यक अतिरिक्त अर्थ नहीं आता।
- source_word: οὖν
  choice: तब
  rationale: यह कथानक की निरंतरता और पिछले प्रसंग से संबंध दिखाता है, बिना निष्कर्षात्मक बल को बढ़ा-चढ़ाकर व्यक्त किए।
- source_word: πρὸς αὐτόν
  choice: उससे
  rationale: बोलने की क्रिया के साथ πρός और कर्मकारक संबोधित व्यक्ति को दर्शाते हैं; आधुनिक हिन्दी में “उससे कहा” स्वाभाविक है।
- source_word: Τί ποιῶμεν
  choice: हम क्या करें
  rationale: विचारार्थक प्रश्न में वर्तमान संभावनार्थक रूप अपेक्षित या आवश्यक कार्य पूछता है; “हम क्या करें” हिन्दी में इस व्यावहारिक बल को स्वाभाविक रूप से रखता है।
- source_word: ἵνα
  choice: कि
  rationale: यहाँ ἵνα उद्देश्य बताता है; “क्या करें कि…” आधुनिक हिन्दी में उद्देश्य-संबंध को संक्षेप और सहज ढंग से व्यक्त करता है।
- source_word: ἐργαζώμεθα τὰ ἔργα
  choice: काम करें
  rationale: यूनानी में क्रिया और संज्ञा एक ही शब्द-मूल की पुनरुक्ति बनाते हैं। हिन्दी में “कामों को काम करें” अस्वाभाविक है, इसलिए अर्थ और निकटतम शब्द-संबंध को “काम करें” से प्रस्तुत किया गया है; वैकल्पिक अधिक रूपात्मक अभिव्यक्ति पादटिप्पणी में दी गई है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर के
  rationale: संबंधकारक की खुली अर्थ-सीमा को औपचारिक रूप से बनाए रखा गया है; मुख्य पाठ यह निर्धारित नहीं करता कि ये परमेश्वर द्वारा अपेक्षित, परमेश्वर से संबंधित, या परमेश्वर के किए हुए काम हैं।
theological_decisions:
- issue: τὰ ἔργα τοῦ θεοῦ में संबंधकारक का अर्थ
  choice: मुख्य पाठ में “परमेश्वर के काम” रखा गया है।
  alternative: “वे काम जो परमेश्वर चाहता है” या “परमेश्वर के द्वारा किए जाने वाले काम”
  rationale: यूनानी संबंधकारक अर्थ की दृष्टि से खुला है, और अगले पद में इसी अभिव्यक्ति पर अर्थपूर्ण मोड़ आता है। इसलिए मुख्य पाठ में अस्पष्टता और धर्मवैचारिक तनाव को सुलझाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। “परमेश्वर के काम” मूल के संबंधकारक की वास्तविक अस्पष्टता बनाए रखता है; पादटिप्पणी अधिक रूपात्मक और व्याख्यात्मक संभावनाएँ देती है।
