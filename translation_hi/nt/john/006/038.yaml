  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: hi
  text: क्योंकि मैं स्वर्ग से अपनी इच्छा पूरी करने के लिए नहीं, बल्कि मुझे भेजनेवाले की इच्छा पूरी करने के लिए उतरा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: καταβέβηκα
  choice: मैं ... उतरा हूँ
  rationale: पूर्णकालिक रूप पूरी हो चुकी क्रिया की वर्तमान प्रासंगिकता बनाए रखता है; ‘उतरा हूँ’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: स्वर्ग से
  rationale: यह स्थान और उद्गम—दोनों का सीधा अर्थ सुरक्षित रखता है।
- source_word: οὐχ ἵνα ... ἀλλὰ
  choice: इसलिए नहीं ... बल्कि इसलिए
  rationale: यह उद्देश्य के निषेध और उसके विपरीत वास्तविक उद्देश्य को स्पष्ट करता है तथा यूनानी वाक्य की समानांतर रचना को हिन्दी में स्वाभाविक ढंग से बनाए रखता है।
- source_word: ποιῶ
  choice: पूरी करूँ
  rationale: इच्छा के साथ हिन्दी में ‘इच्छा पूरी करना’ स्वाभाविक प्रयोग है और यहाँ अपेक्षित कार्यान्वयन का भाव देता है।
- source_word: τὸ θέλημα
  choice: इच्छा
  rationale: दोनों स्थानों पर एक ही शब्द रखकर मूल पाठ का समानांतर विरोध सुरक्षित किया गया है; ‘इच्छा’ सामान्य पाठक के लिए सहज और गरिमापूर्ण है।
- source_word: τὸ ἐμὸν
  choice: अपनी इच्छा
  rationale: हिन्दी का निजवाचक ‘अपनी’ कर्ता की स्वयं की इच्छा पर पर्याप्त बल देता है और दूसरे की इच्छा से विरोध स्पष्ट करता है।
- source_word: τοῦ πέμψαντός με
  choice: उसकी ... जिसने मुझे भेजा है
  rationale: कर्ता को नाम देकर मूल से अधिक स्पष्ट किए बिना व्यक्तिवाचक संबंध और भेजने की क्रिया दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: यीशु का स्वर्ग से उतरना
  choice: ‘मैं स्वर्ग से ... उतरा हूँ’ के रूप में सीधे कथन को बनाए रखा गया है।
  alternative: इसे केवल परमेश्वर से मिले अधिकार या दायित्व का रूपक बनाना।
  rationale: मूल पाठ स्वर्गीय उद्गम की भाषा बोलता है; अनुवाद को इसे केवल मिशन-संबंधी रूपक बनाकर कमजोर नहीं करना चाहिए और न ही अतिरिक्त सिद्धान्तात्मक व्याख्या जोड़नी चाहिए।
- issue: यीशु की इच्छा और भेजने वाले की इच्छा का संबंध
  choice: ‘अपनी इच्छा’ और ‘उसकी इच्छा’ का वास्तविक विरोध बनाए रखा गया है।
  alternative: दोनों इच्छाओं की भिन्नता को व्याख्या द्वारा मिटा देना या उसे तकनीकी धर्मशास्त्रीय शब्दावली में परिभाषित करना।
  rationale: पाठ मिशन और आज्ञाकारिता के संदर्भ में दोनों को अलग-अलग व्यक्त करता है; अनुवाद इस तनाव को सुरक्षित रखता है, पर उसके स्वरूप पर पाठ से आगे निर्णय नहीं देता।
- issue: भेजने वाले की पहचान
  choice: ‘जिसने मुझे भेजा है’ रखा गया है।
  alternative: मुख्य पाठ में सीधे ‘पिता’ या ‘परमेश्वर’ जोड़ना।
  rationale: निकटवर्ती संदर्भ पहचान को स्पष्ट कर सकता है, पर इस वाक्यांश में यूनानी पाठ स्वयं उपाधि नहीं देता; इसलिए अनुवाद उसे नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में स्वाभाविक। उद्देश्यसूचक समानांतरता को स्पष्ट रखने के लिए ‘इसलिए नहीं ... बल्कि इसलिए’ प्रयोग किया गया है। कोई पादटिप्पणी आवश्यक नहीं है।
