- source_word: τῆς θαλάσσης τῆς Γαλιλαίας
  choice: गलील की झील
  rationale: θάλασσα सामान्यतः समुद्र हो सकता है, पर यह जलाशय भौगोलिक रूप से झील है और आधुनिक हिन्दी पाठक के लिए 'गलील की झील' स्पष्ट तथा प्रचलित है।
- source_word: τῆς Τιβεριάδος
  choice: जिसे तिबिरियास की झील भी कहा जाता था
  rationale: दूसरे संबंधकारक को उसी जलाशय के वैकल्पिक नाम के रूप में स्पष्ट करता है, बिना दो अलग जलाशयों का आभास दिए।
