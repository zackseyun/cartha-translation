translation:
  language: hi
  text: तब यीशु पहाड़ पर चढ़ गए और वहाँ अपने शिष्यों के साथ बैठे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: चढ़ गए
  rationale: यह सामान्य भौगोलिक गति को व्यक्त करता है—ऊँचे स्थान पर जाना। हिंदी में ‘पहाड़ पर चढ़ गए’ स्वाभाविक है और किसी विशेष धार्मिक ‘आरोहण’ का भाव नहीं जोड़ता।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ प्रबल विरोध नहीं, बल्कि कथा को आगे बढ़ाता है; ‘तब’ उस क्रम को सहज हिंदी में व्यक्त करता है।
- source_word: εἰς τὸ ὄρος
  choice: पहाड़ पर
  rationale: ἀνῆλθεν के साथ यह पहाड़ या पहाड़ी के ऊपर जाने का संकेत देता है। निश्चित पद किसी विशिष्ट स्थल की ओर संकेत करता है, पर उसका नाम नहीं बताता; हिंदी में संदर्भानुसार ‘पहाड़ पर’ स्वाभाविक है।
- source_word: Ἰησοῦς
  choice: यीशु
  rationale: नाम का मानक हिंदी बाइबलीय रूप रखा गया है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: स्थानसूचक क्रियाविशेषण का सीधा और स्वाभाविक हिंदी समतुल्य है।
- source_word: ἐκάθητο
  choice: बैठ गए
  rationale: अपूर्ण भूतकालीन रूप बैठने या बैठे रहने की दृश्य-पृष्ठभूमि बनाता है। हिंदी कथा में ‘बैठ गए’ स्वाभाविक रूप से उस स्थिति में प्रवेश को व्यक्त करता है, बिना अनावश्यक विस्तार के।
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: अपने शिष्यों के साथ
  rationale: μετά संबंध-सूचक ‘के साथ’ है। μαθητής के लिए ‘शिष्य’ शिक्षक-अनुयायी संबंध को सुरक्षित रखता है; αὐτοῦ को हिंदी में कर्ता-संबंधी ‘अपने’ से स्वाभाविक ढंग से व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली। ‘चढ़ गए’ और ‘बैठ गए’ सम्मानसूचक बहुवचन हैं, जो हिंदी में यीशु के लिए स्वाभाविक और प्रचलित हैं।
