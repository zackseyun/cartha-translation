  text: उसके चेलों में से एक, शमौन पतरस के भाई अन्द्रियास ने उससे कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: ने…कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान काल है, पर आधुनिक हिन्दी कथन-शैली में सामान्य भूतकाल अधिक स्वाभाविक है।
- source_word: αὐτῷ
  choice: उससे
  rationale: यह वचन कहे जाने वाले व्यक्ति को सूचित करता है; प्रसंग में वह यीशु है। ‘उससे कहा’ स्वाभाविक हिन्दी है।
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: उसके चेलों में से एक
  rationale: यह अंश-सम्बन्धी यूनानी रचना का सटीक और सहज हिन्दी रूप है।
- source_word: μαθητῶν
  choice: चेलों
  rationale: सुसमाचारों में μαθητής के लिए ‘चेला’ प्रचलित, सहज और गुरु-शिष्य सम्बन्ध को व्यक्त करने वाला शब्द है।
- source_word: Ἀνδρέας
  choice: अन्द्रियास
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी बाइबलीय लिप्यंतरण।
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: शमौन पतरस के भाई
  rationale: सम्बन्धकारक रचना अन्द्रियास की पहचान शमौन पतरस के भाई के रूप में कराती है; हिन्दी में यह क्रम स्वाभाविक है।
- source_word: Σίμωνος Πέτρου
  choice: शमौन पतरस
  rationale: दोनों नाम मिलकर उसी व्यक्ति का परिचित नामनिर्देशन करते हैं; मूल में ‘कहलाता था’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
