id: JHN.6.53
reference: John 6:53
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: hi
  text: इसलिए यीशु ने उनसे कहा, “मैं तुमसे सच-सच कहता हूँ, यदि तुम मनुष्य के पुत्र का मांस न खाओ और उसका लहू न पियो, तो तुममें जीवन नहीं है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में केवल “जीवन” है, “अनन्त जीवन” नहीं; यद्यपि यूहन्ना के व्यापक प्रसंग में यह जीवन प्रायः अनन्त जीवन से जुड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्षात्मक या परिणामसूचक संबंध दिखाता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: Ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: यूहन्ना में दोहराया गया यह गंभीर और प्रबल उद्घोष है; ‘सच-सच’ उसके दोहराव और बल को सहज हिन्दी में बनाए रखता है।
- source_word: ἐὰν μὴ
  choice: यदि ... न
  rationale: यूनानी की नकारात्मक शर्त का स्वाभाविक हिन्दी रूप, जो ‘जब तक नहीं’ की संभावित कालगत छाया से बचता है।
- source_word: φάγητε
  choice: खाओ
  rationale: क्रिया का सीधा अर्थ है और कथन की ठोस, चौंकाने वाली भाषा को सुरक्षित रखता है।
- source_word: σάρκα
  choice: मांस
  rationale: σάρξ का ठोस शाब्दिक अर्थ ‘मांस’ है; ‘देह’ कहने से मूल की तीक्ष्णता कुछ कम हो सकती है और व्याख्यात्मक धार्मिक शब्दावली जुड़ सकती है।
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र का
  rationale: यीशु की स्थापित आत्म-उपाधि और उससे जुड़ी दानिय्येली तथा मसीही प्रतिध्वनि को बनाए रखता है।
- source_word: πίητε
  choice: पियो
  rationale: πίνω का सीधा अर्थ; ‘खाओ’ के साथ मूल का सजीव समानांतर सुरक्षित रहता है।
- source_word: αἷμα
  choice: लहू
  rationale: ‘लहू’ आधुनिक हिन्दी में समझ में आने वाला, गरिमापूर्ण बाइबलीय शब्द है और मूल की तीखी रक्त-छवि को बनाए रखता है।
- source_word: ζωὴν
  choice: जीवन
  rationale: मूल में केवल ‘जीवन’ है, ‘अनन्त जीवन’ नहीं; इसलिए अतिरिक्त विशेषण नहीं जोड़ा गया।
- source_word: ἐν ἑαυτοῖς
  choice: तुममें
  rationale: संक्षिप्त और स्वाभाविक हिन्दी में ‘अपने भीतर/अपने में’ का भाव व्यक्त करता है, बिना यह संकेत दिए कि जीवन मनुष्य में स्वभावतः उत्पन्न होता है।
theological_decisions:
- issue: मांस खाने और लहू पीने की भाषा को संस्कारात्मक या रूपकात्मक अर्थ में स्पष्ट करना
  choice: ‘मांस ... खाओ और ... लहू ... पियो’ की ठोस भाषा को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘ग्रहण करो’, ‘सहभागी हो’, अथवा स्पष्ट प्रभुभोज-संबंधी शब्दावली प्रयोग करना
  rationale: मूल कथन जानबूझकर ठोस और चुनौतीपूर्ण है। अनुवाद को यह निर्णय नहीं करना चाहिए कि इसका आशय मुख्यतः संस्कारात्मक, रूपकात्मक या दोनों है।
- issue: ζωή को प्रसंग के आधार पर ‘अनन्त जीवन’ बनाना
  choice: केवल ‘जीवन’
  alternative: ‘अनन्त जीवन’
  rationale: इस पद में αἰώνιος नहीं है। व्यापक यूहन्नाई प्रसंग भले जीवन की प्रकृति को प्रकाशित करे, पर मुख्य पाठ में अनुपस्थित विशेषण जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, बोलचाल-सुलभ शैली रखी गई है। ‘सच-सच’, ‘मांस’, ‘लहू’ और ‘मनुष्य का पुत्र’ मूल के दोहराव, ठोसपन और पारंपरिक बाइबलीय प्रतिध्वनि को सुरक्षित रखते हैं।
