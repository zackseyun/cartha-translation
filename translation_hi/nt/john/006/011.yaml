source:
  edition: SBLGNT
  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: hi
  text: तब यीशु ने रोटियाँ लीं और धन्यवाद देने के बाद उन्हें भोजन के लिए टेक लगाकर बैठे लोगों[a] को बाँट दिया। इसी तरह उसने मछलियों[b] में से भी उन्हें जितनी वे चाहते थे, उतनी दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भोजन के लिए बैठे लोगों।’ यूनानी में भोजन करते समय टेक लगाकर बैठने या लेटने की प्रचलित मुद्रा का उल्लेख है।
    reason: lexical_alternative
  - marker: b
    text: या ‘छोटी मछलियों।’ यूनानी शब्द रोटी के साथ खाई जाने वाली मछली, संभवतः छोटी मछली, के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यहाँ οὖν कथा को आगे बढ़ाता है। ‘तब’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग की प्रगति दिखाता है, बिना अनावश्यक रूप से कठोर निष्कर्षसूचक ‘इसलिए’ लगाए।
- source_word: τοὺς ἄρτους
  choice: रोटियाँ
  rationale: बहुवचन ἄρτους इस प्रसंग में अलग-अलग रोटियों को सूचित करता है। ‘रोटियाँ’ सामान्य हिन्दी पाठक के लिए स्वाभाविक और बहुवचन के प्रति निष्ठावान है।
- source_word: εὐχαριστήσας
  choice: धन्यवाद देने के बाद
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई क्रिया बताता है। यह अनुवाद उसी क्रम को स्पष्ट रखता है और यूनानी में न दिए गए कर्म, जैसे ‘परमेश्वर को’, को नहीं जोड़ता।
- source_word: διέδωκεν
  choice: बाँट दिया
  rationale: διαδίδωμι भीड़ के बीच वितरण का भाव देता है। ‘बाँट दिया’ आधुनिक हिन्दी में सहज है और साधारण ‘दिया’ की अपेक्षा वितरक अर्थ को बेहतर व्यक्त करता है।
- source_word: τοῖς ἀνακειμένοις
  choice: भोजन के लिए टेक लगाकर बैठे लोगों
  rationale: ἀνάκειμαι भोजन करते समय लेटकर या टेक लगाकर बैठने की प्राचीन मुद्रा को सूचित करता है। यह अभिव्यक्ति शाब्दिक अर्थ और आधुनिक हिन्दी की बोधगम्यता के बीच संतुलन रखती है।
- source_word: ὁμοίως καὶ
  choice: इसी तरह ... भी
  rationale: यह रोटियों और मछलियों के वितरण के बीच समानांतरता तथा καί के समावेशी बल—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐκ τῶν ὀψαρίων
  choice: मछलियों में से
  rationale: ὀψάριον खाने के साथ परोसी जाने वाली मछली, और संभवतः छोटी मछली, को सूचित कर सकता है। मुख्य पाठ में ‘मछलियों’ स्वाभाविक है; अधिक विशिष्ट संभावना पादटिप्पणी में रखी गई है।
- source_word: ὅσον ἤθελον
  choice: जितनी वे चाहते थे, उतनी
  rationale: यह वाक्यांश लोगों की इच्छा के अनुसार पर्याप्त मात्रा मिलने का अर्थ व्यक्त करता है। हिन्दी में स्त्रीलिंग ‘जितनी ... उतनी’ निकटतम संज्ञा ‘मछलियों’ के अनुरूप है।
theological_decisions:
- issue: भोजन-वृद्धि के वृत्तांत में εὐχαριστήσας की संभावित प्रभु-भोज संबंधी प्रतिध्वनि
  choice: ‘धन्यवाद देने’ के रूप में अनुवाद, बिना संस्कार-संबंधी विस्तार के
  alternative: ‘आशीष दी’ कहना या मुख्य पाठ में प्रभु-भोज संबंधी अर्थ स्पष्ट करना
  rationale: क्रिया का प्रत्यक्ष अर्थ ‘धन्यवाद देना’ है। यूहन्ना के व्यापक प्रसंग में प्रभु-भोज की प्रतिध्वनि संभव हो सकती है, पर अनुवाद को व्याख्यात्मक या सांप्रदायिक विस्तार जोड़कर इस तनाव का निर्णय नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘टेक लगाकर बैठे’ प्राचीन भोजन-मुद्रा को सामान्य हिन्दी में समझने योग्य बनाता है; ‘बाँट दिया’ वितरण के भाव को स्पष्ट करता है।
