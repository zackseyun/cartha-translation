  text: Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες· Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα ⸀αὐτοῦ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
translation:
  language: hi
  text: इसलिए यहूदी[a] आपस में बहस कर रहे थे और कह रहे थे, “यह आदमी हमें अपना मांस[b] खाने के लिए कैसे दे सकता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया के निवासी”; अथवा प्रसंग के अनुसार, “यहूदी अगुवे।” यूनानी पाठ में केवल “यहूदी” है।
    reason: alternative_reading
  - marker: b
    text: या “शरीर।” यूनानी शब्द σάρξ का अर्थ “मांस” है; यहाँ पद की ठोस भाषा और उसके तनाव को बनाए रखने के लिए यही शब्द रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  choice: बहस करने लगे
  rationale: अपूर्ण भूतकाल का रूप जारी या उभरते हुए विवाद को दिखाता है। यह चयन मौखिक टकराव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे शारीरिक लड़ाई बना देने के।
- source_word: οὖν
  choice: इस पर
  rationale: यह पिछले कथन से निकली प्रतिक्रिया और कथा की अगली गति—दोनों को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: πρὸς ἀλλήλους
  choice: आपस में
  rationale: समूह के सदस्यों के परस्पर विवाद को सहज और संक्षिप्त रूप में व्यक्त करता है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदी
  rationale: यूनानी पाठ के स्पष्ट शब्द को मुख्य पाठ में बनाए रखा गया है; प्रसंगगत रूप से अधिक संकीर्ण अर्थ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: λέγοντες
  choice: और कहने लगे
  rationale: यह कृदन्त विवाद की कही गई बात का परिचय देता है। हिन्दी में मुख्य क्रिया के साथ समानांतर रूप स्वाभाविक है।
- source_word: Πῶς δύναται
  choice: कैसे दे सकता है
  rationale: सम्भावना या सामर्थ्य पर उठे प्रश्न को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὗτος
  choice: यह आदमी
  rationale: संकेतवाचक सर्वनाम की दूरी या तिरस्कारपूर्ण छाया को केवल ‘वह’ की अपेक्षा अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: ἡμῖν
  choice: हमें
  rationale: ‘देना’ के अप्रत्यक्ष कर्म का स्वाभाविक हिन्दी रूप।
- source_word: δοῦναι
  choice: दे
  rationale: δίδωμι के सामान्य अर्थ को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: τὴν σάρκα αὐτοῦ
  choice: अपना मांस
  rationale: σάρξ की ठोस, देहगत भाषा और श्रोताओं की प्रतिक्रिया से उत्पन्न तनाव को सुरक्षित रखता है; ‘शरीर’ या ‘देह’ कहकर उसे नरम या व्याख्यायित नहीं करता। कर्ता के साथ सम्बन्ध के कारण हिन्दी में ‘अपना’ स्वाभाविक है।
- source_word: φαγεῖν
  choice: खाने के लिए
  rationale: ‘दे’ पर आश्रित उद्देश्य/पूरक infinitive का सीधा और मुहावरेदार हिन्दी रूप।
theological_decisions:
- issue: धर्मवैचारिक रूप से संवेदनशील प्रसंग में σάρξ का अनुवाद
  choice: मांस
  alternative: शरीर / देह
  rationale: यहाँ श्रोता यीशु के कथन को ठोस, शारीरिक अर्थ में ग्रहण कर रहे हैं। ‘मांस’ मूल शब्द की तीक्ष्णता और प्रसंग के तनाव को बनाए रखता है तथा अनुवाद में किसी विशिष्ट संस्कार-सिद्धान्त का निर्णय नहीं थोपता।
- issue: यूहन्ना में οἱ Ἰουδαῖοι का सम्भावित सीमित संदर्भ
  choice: यहूदी
  alternative: यहूदिया के लोग / यहूदी अगुवे
  rationale: मुख्य पाठ स्पष्ट यूनानी अभिव्यक्ति का अनुसरण करता है। यूहन्ना में इसका संदर्भ कभी अधिक सीमित हो सकता है, पर इस पद की शब्दावली स्वयं उस सीमा को स्पष्ट नहीं करती; इसलिए विकल्प पादटिप्पणी में रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘बहस करने लगे’ जारी मौखिक विवाद को दर्शाता है, जबकि ‘मांस’ मूल की जानबूझकर ठोस भाषा को सुरक्षित रखता है।
