  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: hi
  text: जब वे तृप्त हो गए, तो वह अपने शिष्यों से कहता है[a], “बचे हुए टुकड़े इकट्ठे करो, ताकि कुछ भी खो न जाए[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यहाँ ऐतिहासिक वर्तमान है: “कहता है।” कुछ अनुवाद सहज कथात्मक भूतकाल में इसे “कहा” कर देते हैं।'
    reason: lexical_alternative
  - marker: b
    text: या “ताकि कुछ भी नष्ट न हो” अथवा, इस संदर्भ में, “बरबाद न हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐνεπλήσθησαν
  choice: जब वे भरपेट खा चुके
  rationale: ἐνεπλήσθησαν भोजन से भर जाने या तृप्त होने को दर्शाता है। आधुनिक हिन्दी में ‘भरपेट खा चुके’ इस अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है। δέ को अलग शब्द से व्यक्त किए बिना वाक्य-प्रवाह में समाहित किया गया है।
- source_word: λέγει
  choice: वह ... कहता है
  rationale: यूनानी ऐतिहासिक वर्तमान को बनाए रखा गया है; इससे यूहन्ना की सजीव कथन-शैली सुरक्षित रहती है। सामान्य हिन्दी में ‘कहा’ भी संभव है, इसलिए टिप्पणी दी गई है।
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: अपने शिष्यों से
  rationale: μαθητής के लिए ‘शिष्य’ सुसमाचारों में प्रचलित और सटीक शब्द है; αὐτοῦ को स्वाभाविक हिन्दी में ‘अपने’ से व्यक्त किया गया है।
- source_word: Συναγάγετε
  choice: इकट्ठे कर लो
  rationale: प्रत्यक्ष आज्ञा को स्वाभाविक बोलचाल की गरिमा के साथ व्यक्त करता है। ‘कर लो’ यहाँ कार्य पूरा करने की आज्ञा देता है, अनुमति का भाव नहीं।
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: बचे हुए टुकड़े
  rationale: περισσεύσαντα का अर्थ भोजन के बाद बची हुई वस्तु और κλάσματα का अर्थ टूटे हुए अंश या टुकड़े है। ‘बचे हुए टुकड़े’ हिन्दी में संक्षिप्त और स्वाभाविक है; रोटी का प्रसंग निकटवर्ती पदों से स्पष्ट है।
- source_word: ἵνα μή τι ἀπόληται
  choice: ताकि कुछ भी नष्ट न हो
  rationale: ἀπόληται यहाँ बचे भोजन के किसी भी अंश के खोने, बरबाद होने या नष्ट होने को दर्शाता है। ‘नष्ट न हो’ मूल शब्द की व्यापकता और यूहन्ना में संभावित अनुगूँज को बनाए रखता है, जबकि तत्काल संदर्भ भौतिक टुकड़ों का है।
theological_decisions:
- issue: चिह्न के संदर्भ में ἀπόληται का संभावित धर्मवैज्ञानिक अतिपाठ
  choice: ‘नष्ट न हो’ रखकर तत्काल भौतिक संदर्भ और शब्द की व्यापक अनुगूँज दोनों को खुला रखा गया है।
  alternative: ‘बरबाद न हो’ कहने से केवल व्यावहारिक अर्थ स्पष्ट होता, जबकि ‘खो न जाए’ अधिक शाब्दिक विकल्प है।
  rationale: यीशु तत्काल रूप से बचे हुए भोजन की बात कर रहा है। फिर भी यूहन्ना में यही क्रिया अन्यत्र गहरे धर्मवैज्ञानिक संदर्भों में आती है। अनुवाद न तो यहाँ उद्धार-संबंधी अर्थ आरोपित करता है, न शब्द को केवल ‘बरबाद’ तक सीमित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक। ‘भरपेट खा चुके’ भोजन-संदर्भ को स्वाभाविक बनाता है। ऐतिहासिक वर्तमान जानबूझकर सुरक्षित रखा गया है। सभी टिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
