  text: οἱ πατέρες ὑμῶν ἔφαγον ⸂ἐν τῇ ἐρήμῳ τὸ μάννα⸃ καὶ ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/049.yaml
  text: Your fathers ate the manna in the wilderness[a], and they died.
translation:
  language: hi
  text: तुम्हारे पूर्वजों[a] ने निर्जन प्रदेश में मन्ना खाया, और वे मर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ ‘तुम्हारे पिता’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: तुम्हारे पूर्वजों
  rationale: πατέρες का शाब्दिक अर्थ ‘पिता’ है, पर यहाँ इसका संकेत इस्राएल की पुरानी पीढ़ी, विशेषकर निर्जन प्रदेश वाली पीढ़ी, से है। आधुनिक हिन्दी में ‘पूर्वज’ इस प्रतिनिधिक पैतृक अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है; शाब्दिक रूप को पाद-टिप्पणी में रखा गया है।
- source_word: ἔφαγον
  choice: खाया
  rationale: ἐσθίω के एओरिस्ट रूप का सीधा अर्थ ‘खाया’ है; हिन्दी में इससे पूर्ण हुई ऐतिहासिक घटना स्वाभाविक रूप से व्यक्त होती है।
- source_word: ἐν τῇ ἐρήμῳ
  choice: निर्जन प्रदेश में
  rationale: निर्गमन की पृष्ठभूमि में ἔρημος आबादी से दूर उजाड़ भूभाग को दर्शाता है। ‘निर्जन प्रदेश’ आधुनिक हिन्दी में स्पष्ट है और ‘जंगल’ के वन-संबंधी संभावित भ्रम से बचता है।
- source_word: τὸ μάννα
  choice: मन्ना
  rationale: यह निर्गमन-वृत्तांत के परिचित स्वर्गीय भोजन का नाम है। हिन्दी में व्यक्तिवाचक खाद्य-संज्ञा के रूप में ‘मन्ना’ के साथ अलग निश्चितता-सूचक शब्द आवश्यक नहीं है।
- source_word: ἀπέθανον
  choice: वे मर गए
  rationale: यह वास्तविक मृत्यु बताने वाला एओरिस्ट क्रियारूप है। स्पष्ट कर्ता ‘वे’ यूनानी के अंतर्निहित बहुवचन कर्ता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस्राएल की निर्जन प्रदेश वाली पीढ़ी का उल्लेख
  choice: तुम्हारे पूर्वजों
  alternative: तुम्हारे पिताओं
  rationale: यह कथन यीशु के श्रोताओं और निर्गमन-कालीन पीढ़ी के ऐतिहासिक संबंध को व्यक्त करता है। ‘पूर्वज’ उस आशय को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े स्पष्ट करता है, जबकि शाब्दिक ‘पिता’ पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘निर्जन प्रदेश’ बाइबलीय wilderness का अर्थ स्पष्ट करता है, और ‘पूर्वज’ सामान्य पाठक के लिए ‘पितरों’ की अपेक्षा अधिक स्वाभाविक है।
