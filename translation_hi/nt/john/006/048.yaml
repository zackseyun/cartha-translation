  text: मैं जीवन की रोटी हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ
  choice: मैं
  rationale: ग्रीक में कर्ता सर्वनाम स्पष्ट रूप से आया है। हिन्दी में ‘मैं’ स्वाभाविक है और बिना अनावश्यक विस्तार के यीशु की आत्म-पहचान को व्यक्त करता है।
- source_word: εἰμι
  choice: हूँ
  rationale: यह ‘होना’ क्रिया का वर्तमानकालिक, प्रथम पुरुष एकवचन रूप है; विधेयवाचक वाक्य में ‘हूँ’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: ὁ ἄρτος
  choice: रोटी
  rationale: ἄρτος के लिए सामान्य और व्यापक रूप से समझा जाने वाला हिन्दी शब्द ‘रोटी’ है। ग्रीक निश्चित उपपद का पहचानसूचक बल हिन्दी में ‘जीवन की रोटी’ पदबंध और प्रसंग से स्वाभाविक रूप से व्यक्त होता है; ‘वह रोटी’ कहना यहाँ कृत्रिम होगा।
- source_word: τῆς ζωῆς
  choice: जीवन की
  rationale: यह संबंधकारक पदबंध है। ‘जीवन की’ ग्रीक की संक्षिप्त संरचना और यूहन्ना की अभिव्यक्ति को बनाए रखता है, जबकि ‘जीवन देने वाली’ अर्थ की एक सम्भावित व्याख्या को पाठ में जोड़ देता।
theological_decisions:
- issue: यूहन्ना के सन्दर्भ में ‘मैं हूँ’ कथन का बल
  choice: ‘मैं ... हूँ’ के रूप में सीधा अनुवाद
  alternative: ‘मैं स्वयं ... हूँ’ या अधिक स्पष्ट धर्मवैज्ञानिक विस्तार
  rationale: यहाँ ἐγώ εἰμι निरपेक्ष प्रयोग नहीं, बल्कि ‘रोटी’ विधेय के साथ आत्म-पहचान का कथन है। सीधा अनुवाद उसके बल को बनाए रखता है, पर मूल में न आए हुए धर्मवैज्ञानिक शब्द नहीं जोड़ता।
- issue: ‘जीवन की रोटी’ में संबंधकारक का अर्थ
  choice: ‘जीवन की रोटी’
  alternative: ‘जीवन देने वाली रोटी’
  rationale: संबंधकारक जीवन के स्रोत, गुण या प्रदान किए जाने का संकेत दे सकता है। संक्षिप्त रूप मूल की वास्तविक अर्थ-व्यापकता को सुरक्षित रखता है और किसी एक व्याख्या को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। कोई पाद-टिप्पणी आवश्यक नहीं है।
