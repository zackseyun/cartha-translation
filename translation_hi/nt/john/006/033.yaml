  text: ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστιν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: hi
  text: क्योंकि परमेश्वर की रोटी वह है जो स्वर्ग से उतरता है और संसार को जीवन देता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि परमेश्वर की रोटी वह है जो स्वर्ग से उतरती है और संसार को जीवन देती है।” यूनानी शब्दावली को अधिक निर्वैयक्तिक अर्थ में भी समझा जा सकता है, पर पुल्लिंग कृदन्त किसी व्यक्ति की ओर संकेत करने का समर्थन करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἄρτος
  choice: रोटी
  rationale: मूल ठोस अर्थ को बनाए रखता है और पूरे प्रसंग में विकसित होने वाले रूपक को सामान्य ‘भोजन’ में नहीं बदलता।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर की
  rationale: सम्बन्धकारक पद का स्वाभाविक हिन्दी रूप है और यह परमेश्वर से स्रोत अथवा सम्बन्ध—दोनों संभावित भावों को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ὁ καταβαίνων
  choice: वह ... जो ... उतरता है
  rationale: पुल्लिंग एकवचन सविशेष कृदन्त व्यक्तिगत संकेत देता है; हिन्दी का यह रूप उस व्यक्तिगत संदर्भ को स्वाभाविक ढंग से बनाए रखता है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से
  rationale: उद्गम के भाव को स्पष्ट और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: ζωὴν
  choice: जीवन
  rationale: यूहन्ना में यह केंद्रीय और अर्थगर्भित शब्द है; सरल ‘जीवन’ उसकी व्यापकता को सुरक्षित रखता है।
- source_word: διδοὺς
  choice: देता है
  rationale: पहले कृदन्त के साथ समन्वित निरंतर/विशिष्ट कार्य को स्वाभाविक हिन्दी क्रिया में व्यक्त करता है।
- source_word: τῷ κόσμῳ
  choice: संसार को
  rationale: κόσμος की यूहन्नाई व्यापकता बनाए रखता है और इसे केवल ‘मानवजाति’ या ‘सब लोगों’ तक व्याख्यात्मक रूप से सीमित नहीं करता।
theological_decisions:
- issue: ‘परमेश्वर की रोटी ... ὁ καταβαίνων ...’ में व्यक्तिगत या निर्वैयक्तिक संदर्भ
  choice: 'व्यक्तिगत भाषा: ‘वह है जो स्वर्ग से उतरता है’'
  alternative: ‘वह है जो स्वर्ग से उतरती है’ अथवा ‘जो स्वर्ग से उतरती है’—रोटी को निर्वैयक्तिक कर्ता मानकर
  rationale: यूनानी में सविशेष कृदन्त पुल्लिंग एकवचन हैं, जो स्वाभाविक रूप से किसी व्यक्ति की ओर संकेत करते हैं और आगे यीशु की आत्म-पहचान की भूमिका बनाते हैं। पादटिप्पणी व्याकरणगत वैकल्पिक ग्रहण को दर्ज करती है।
- issue: κόσμος का दायरा
  choice: ‘संसार’ को बनाए रखना
  alternative: ‘मानवजाति’ या ‘सब लोगों को’
  rationale: मूल पाठ जीवन देने की व्यापकता बताता है, पर उसके विस्तार या अनुप्रयोग से जुड़े धर्मवैज्ञानिक प्रश्नों को यहाँ निर्णीत नहीं करता। ‘संसार’ इसी व्यापकता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘वह ... जो’ व्यक्तिगत संकेत को स्पष्ट रखता है; मुख्य पाठ में पुल्लिंग क्रियाएँ जानबूझकर ‘रोटी’ के स्त्रीलिंग के अनुरूप नहीं की गईं, क्योंकि वे यूनानी के व्यक्तिगत संदर्भ को दर्शाती हैं।
