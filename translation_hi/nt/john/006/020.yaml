  yaml_path: translation/nt/john/006/020.yaml
  text: But he said to them[a], “It is I; do not be afraid.”
translation:
  language: hi
  text: पर उसने उनसे कहा[a], “मैं ही हूँ; डरो मत।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शब्दशः, “मैं हूँ।” यूहन्ना में यह अभिव्यक्ति साधारण आत्म-पहचान के रूप में प्रयुक्त हो सकती है और साथ ही व्यापक धर्मवैचारिक विषयों की अनुगूँज भी दे सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ
  choice: पर उसने
  rationale: δέ यहाँ कथा में हल्का मोड़ या विरोध दर्शाता है, और ὁ सर्वनाम की तरह यीशु की ओर संकेत करता है। ‘पर उसने’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: λέγει
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर हिन्दी कथा-शैली में भूतकाल ‘कहा’ अधिक स्वाभाविक ढंग से वही घटना व्यक्त करता है।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: मूल पाठ में बहुवचन सर्वनाम है; संदर्भ से उसके अभिप्रेत शिष्य स्पष्ट हैं, इसलिए संज्ञा जोड़ने की आवश्यकता नहीं।
- source_word: Ἐγώ εἰμι
  choice: मैं ही हूँ
  rationale: यह हिन्दी में पहचान बताने का स्वाभाविक रूप है और यूनानी के स्पष्ट ἐγώ को भी व्यक्त करता है। साथ ही यह ‘मैं हूँ’ की अधिक शब्दशः ध्वनि को पूरी तरह दबाता नहीं; उसे टिप्पणी में सुरक्षित रखा गया है।
- source_word: μὴ φοβεῖσθε
  choice: डरो मत
  rationale: यह निषेध आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
theological_decisions:
- issue: Ἐγώ εἰμι को केवल साधारण आत्म-पहचान के रूप में दिया जाए या ‘मैं हूँ’ की संभावित धर्मवैचारिक अनुगूँज भी रखी जाए
  choice: 'मुख्य पाठ: ‘मैं ही हूँ’'
  alternative: ‘मैं हूँ’
  rationale: तात्कालिक प्रसंग में यीशु भयभीत शिष्यों को अपनी पहचान बता रहे हैं। ‘मैं ही हूँ’ हिन्दी में इस कार्य को स्पष्ट और स्वाभाविक रूप से निभाता है। फिर भी यूहन्ना में ἐγώ εἰμι के व्यापक धर्मवैचारिक संकेत संभव हैं, इसलिए अधिक शब्दशः विकल्प टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक। ‘मैं ही हूँ’ तत्काल आत्म-पहचान और मूल अभिव्यक्ति की संभावित गहरी अनुगूँज—दोनों के बीच संतुलन रखता है।
