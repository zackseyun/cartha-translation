  text: Καὶ εὑρόντες αὐτὸν πέραν τῆς θαλάσσης εἶπον αὐτῷ· Ῥαββί, πότε ὧδε γέγονας;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: hi
  text: और जब उन्होंने यीशु को समुद्र के उस पार पाया, तो उन्होंने उनसे कहा, “रब्बी, आप यहाँ कब आए?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आप यहाँ कब से हैं?” यूनानी में पूर्णकाल का रूप है, जो यहाँ आने के परिणामस्वरूप वर्तमान में उपस्थित होने का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρόντες
  choice: जब उन्होंने ... पाया
  rationale: पूर्वकालिक एओरिस्ट कृदन्त को स्वाभाविक हिन्दी में कालवाचक उपवाक्य के रूप में रखा गया है; इससे मुख्य क्रिया से पहले पाने की घटना स्पष्ट होती है।
- source_word: αὐτόν
  choice: यीशु को
  rationale: हिन्दी में सर्वनाम-संदर्भ स्पष्ट रखने के लिए प्रसंगगत व्यक्ति का नाम दिया गया है; अर्थ में कोई नया पात्र नहीं जोड़ा गया।
- source_word: πέραν τῆς θαλάσσης
  choice: झील के उस पार
  rationale: πέραν के पारवर्ती स्थान-बोध को 'उस पार' व्यक्त करता है। गलील के इस जलाशय के लिए आधुनिक हिन्दी में 'झील' सामान्य पाठक को भौगोलिक अर्थ अधिक स्पष्ट रूप से बताता है, यद्यपि यूनानी में शाब्दिक शब्द 'समुद्र' है।
- source_word: Ῥαββί
  choice: रब्बी
  rationale: यहूदी परिवेश और मूल संबोधन को सुरक्षित रखने के लिए उपाधि का लिप्यंतरण रखा गया है; 'गुरु' या 'शिक्षक' अधिक व्याख्यात्मक होते।
- source_word: πότε ὧδε γέγονας
  choice: आप यहाँ कब आए?
  rationale: γέγονας पूर्णकाल रूप है, पर इस प्रसंग में किसी स्थान पर पहुँचने और अब वहाँ उपस्थित होने का भाव देता है। 'आप यहाँ कब आए?' वर्तमान हिन्दी में स्वाभाविक है और मूल प्रश्न का आशय रखता है।
- source_word: εἶπον αὐτῷ
  choice: उनसे कहा
  rationale: मूल λέγω के सामान्य अर्थ 'कहना' को रखा गया है, यद्यपि आगे प्रश्न आता है। आदरसूचक संबोधन के अनुरूप 'उनसे' और 'आप' का प्रयोग किया गया है।
- source_word: Καὶ
  choice: और
  rationale: सरल कथात्मक संयोजक को बिना अतिरिक्त कारणात्मक या निष्कर्षात्मक बल दिए सुरक्षित रखा गया है।
