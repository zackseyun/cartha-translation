  yaml_path: translation/nt/john/006/047.yaml
  text: Truly[a], truly, I say to you[b], the one who believes has eternal life.
translation:
  language: hi
  text: मैं तुमसे सच-सच कहता हूँ, जो विश्वास करता है[a], उसके पास अनन्त जीवन[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कोई विश्वास करता है।” यूनानी में निश्चित लेख के साथ वर्तमानकालिक कृदन्त है, जिसका अधिक शाब्दिक रूप है, “विश्वास करने वाला।”
    reason: lexical_alternative
  - marker: b
    text: या, “सदा बना रहने वाला जीवन।” यूनानी विशेषण का संबंध “युग” से भी है; अधिक शाब्दिक ढंग से इसे “युग-सम्बन्धी” या “युग-स्थायी जीवन” कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: यूहन्ना में यह दोहराया गया गंभीर और बलपूर्ण कथन-सूचक पद है। ‘सच-सच’ पुनरुक्ति और कथन की दृढ़ता दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यह वर्तमानकालिक क्रिया और बहुवचन संबोधित सर्वनाम का सीधा, स्वाभाविक अनुवाद है। हिन्दी में ‘तुमसे’ सामूहिक संबोधन में भी प्रयुक्त हो सकता है।
- source_word: ὁ πιστεύων
  choice: जो विश्वास करता है
  rationale: निश्चित लेख के साथ वर्तमानकालिक कृदन्त ऐसे व्यक्ति को सूचित करता है जिसकी पहचान विश्वास करने से होती है। यह हिन्दी में स्वाभाविक रहते हुए यूनानी रचना का आशय सुरक्षित रखता है।
- source_word: ἔχει
  choice: उसके पास … है
  rationale: यह वर्तमानकाल को स्पष्ट रखता है और बताता है कि अनन्त जीवन अभी उसकी वर्तमान प्राप्ति है, केवल भविष्य की आशा नहीं।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: यूहन्ना के प्रसंग में यह प्रचलित, सहज और अर्थपूर्ण अभिव्यक्ति है; इसमें जीवन की अविराम अवधि तथा उसके युग-संबंधी गुण दोनों समा सकते हैं।
theological_decisions:
- issue: अनन्त जीवन का वर्तमान में होना
  choice: उसके पास अनन्त जीवन है
  alternative: उसे अनन्त जीवन मिलेगा
  rationale: यूनानी ἔχει वर्तमानकाल में है। भविष्यकाल करना मूल पाठ से आगे जाकर यूहन्ना के वर्तमान और भविष्य के बीच के धर्मवैचारिक तनाव को मिटा देता।
- issue: विश्वास करनेवाले की अभिव्यक्ति
  choice: जो विश्वास करता है
  alternative: जो कोई विश्वास करता है
  rationale: चुना गया रूप निश्चित लेख वाले वर्तमानकालिक कृदन्त के अधिक निकट है, पर इसे किसी सीमित या पहले से निश्चित व्यक्ति तक बाँधता नहीं; सार्वत्रिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘सच-सच’ यूहन्ना की विशिष्ट दोहरी उद्घोषणा को बनाए रखता है। वाक्य में वर्तमान अधिकार को स्पष्ट करने के लिए ‘उसके पास … है’ रखा गया है।
