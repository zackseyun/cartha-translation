source:
  edition: SBLGNT
  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: hi
  text: पर यीशु अपने मन में जानता था कि उसके शिष्य इस बात के विषय में बड़बड़ा रहे थे। उसने उनसे कहा, “क्या यह तुम्हें ठोकर खिलाता है?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या इससे तुम्हें ठेस पहुँचती है?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: जान लिया
  rationale: क्रियाविशेषणात्मक कृदंत यीशु के भीतर इस बात से अवगत होने को व्यक्त करता है; हिन्दी कथा-प्रवाह में ‘जान लिया’ स्वाभाविक है और किसी बाहरी सूचना का संकेत नहीं देता।
- source_word: ἐν ἑαυτῷ
  choice: अपने भीतर
  rationale: यह वाक्यांश यीशु के आंतरिक ज्ञान पर बल देता है; ‘अपने भीतर’ आधुनिक हिन्दी में स्वाभाविक और मूल के निकट है।
- source_word: γογγύζουσιν
  choice: कुड़कुड़ा रहे हैं
  rationale: क्रिया दबे स्वर में असंतोष जताने या बड़बड़ाने का भाव रखती है। ‘कुड़कुड़ाना’ नकारात्मक और धीमी शिकायत का भाव सहज रूप से व्यक्त करता है।
- source_word: περὶ τούτου
  choice: इस बात को लेकर
  rationale: यह पिछले कथन की ओर संकेत करता है और हिन्दी में प्रसंगानुकूल, स्वाभाविक रूप से संबंध व्यक्त करता है।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: उसके शिष्य
  rationale: यह व्यापक शिष्य-समूह को बिना केवल बारह शिष्यों तक सीमित किए सीधे रूप में व्यक्त करता है।
- source_word: Τοῦτο
  choice: यह
  rationale: मूल में संज्ञा नहीं जोड़ी गई है; ‘यह’ पिछले उपदेश की ओर संकेत करते हुए उसकी संक्षिप्तता और अस्पष्टता बनाए रखता है।
- source_word: σκανδαλίζει
  choice: ठोकर का कारण बनता है
  rationale: यह रूपक किसी बात से आहत होने के साथ-साथ विश्वास में ठोकर खाने या पीछे हटने की अधिक गंभीर संभावना को भी खुला रखता है।
theological_decisions:
- issue: σκανδαλίζει का अर्थ—आहत होना या विश्वास में ठोकर खाना
  choice: क्या यह तुम्हारे लिए ठोकर का कारण बनता है?
  alternative: क्या इससे तुम्हें ठेस पहुँचती है?
  rationale: ‘ठोकर का कारण’ यूनानी रूपक और उससे जुड़ी विश्वास से विचलित होने की संभावना को सुरक्षित रखता है; पादटिप्पणी भावनात्मक आहत होने वाला स्वाभाविक वैकल्पिक अर्थ देती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य हिन्दी। ‘कुड़कुड़ा रहे हैं’ दबे असंतोष को और ‘ठोकर का कारण’ मूल रूपक तथा धर्मवैचारिक तनाव को बनाए रखता है।
