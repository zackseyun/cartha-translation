  edition: SBLGNT
  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: hi
  text: उस समय से उसके बहुत-से चेले पीछे हट गए और फिर उसके साथ नहीं चले[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस कारण उसके बहुत-से चेले पीछे हट गए”; आरंभिक यूनानी पदबंध का कारणवाचक अर्थ भी हो सकता है, हालाँकि संदर्भ में “उस समय से” एक निर्णायक मोड़ का भाव अधिक अच्छी तरह व्यक्त करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: उस समय से
  rationale: संदर्भ में यह पदबंध एक निर्णायक मोड़ के बाद का समय बताता है; फिर भी इसका कारणवाचक अर्थ संभव है, जिसे पाद-टिप्पणी में रखा गया है।
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: उसके बहुत-से चेले
  rationale: यह स्वाभाविक हिन्दी में बड़ी संख्या और उसके चेलों में से बहुतों के भागसूचक भाव—दोनों को व्यक्त करता है।
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: पीछे हट गए
  rationale: दोनों यूनानी पद मिलकर केवल कहीं चले जाने के बजाय पीछे लौटने या साथ छोड़ देने का भाव देते हैं।
- source_word: οὐκέτι
  choice: फिर ... नहीं
  rationale: यह उस बिंदु से आगे किसी जारी गतिविधि के समाप्त हो जाने को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: उसके साथ नहीं चले
  rationale: यह चलने के मूल रूपक और यीशु के साथ निरंतर संगति या अनुसरण, दोनों को बिना अति-व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: क्या μαθηταί को ऐसे अनूदित किया जाए कि उससे बारह प्रेरितों या केवल सच्चे विश्वासियों का संकेत मिले
  choice: चेले
  alternative: अनुयायी
  rationale: मूल पाठ उन्हें यीशु के चेलों में से बताता है, पर न तो बारह के साथ उनकी पहचान करता है, न उनके विश्वास की धर्मवैज्ञानिक स्थिति तय करता है। ‘चेले’ इस तनाव को सुरक्षित रखता है।
- issue: Ἐκ τούτου का कालवाचक या कारणवाचक अर्थ
  choice: उस समय से
  alternative: इस कारण
  rationale: आस-पास का वर्णन इसे यीशु की कठिन शिक्षा के बाद आए निर्णायक मोड़ के रूप में प्रस्तुत करता है, किंतु कारणवाचक संभावना को पाद-टिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘पीछे हट गए’ यूनानी मुहावरे का भाव देता है, जबकि ‘उसके साथ नहीं चले’ मूल के चलने वाले रूपक को बनाए रखता है।
