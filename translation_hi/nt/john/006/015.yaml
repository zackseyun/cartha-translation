  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: hi
  text: इसलिए यीशु यह जानकर कि लोग उन्हें पकड़कर राजा बनाने के लिए आने ही वाले थे,[a] फिर पहाड़ पर अकेले पीछे हट गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें बलपूर्वक पकड़कर राजा बनाएँ।”
    reason: ἁρπάζειν के बलपूर्वक पकड़ने या अपने वश में करने के अर्थ को वैकल्पिक शब्दों में स्पष्ट करता है।
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग के परिणामस्वरूप आगे बढ़ती कथा को जोड़ता है; ‘इसलिए’ उसके निष्कर्षात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γνοὺς
  choice: यह जानकर
  rationale: अओरिस्ट कृदंत यीशु के चले जाने की परिस्थिति और कारण बताता है; ‘यह जानकर’ सीधा और स्वाभाविक है।
- source_word: μέλλουσιν ἔρχεσθαι
  choice: आने ही वाले हैं
  rationale: μέλλω के आसन्नता-बोध को ‘ही’ स्पष्ट करता है और केवल सामान्य इरादे के बजाय निकट भविष्य की कार्रवाई दर्शाता है।
- source_word: ἁρπάζειν
  choice: पकड़कर जबरन
  rationale: ἁρπάζω में बलपूर्वक कब्ज़े में लेने का भाव है। ‘पकड़कर जबरन’ भीड़ की कार्रवाई की बाध्यकारी प्रकृति को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: राजा बनाने के लिए
  rationale: ἵνα के प्रयोजनार्थक बल को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ἀνεχώρησεν
  choice: चले गए
  rationale: संदर्भ में यह भीड़ से हटकर दूसरी जगह जाने को दर्शाता है। ‘चले गए’ आधुनिक हिन्दी में स्वाभाविक है; परिस्थिति स्वयं बच निकलने का भाव स्पष्ट करती है।
- source_word: πάλιν
  choice: फिर
  rationale: दोबारा होने वाली गति को सरल और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς τὸ ὄρος
  choice: पहाड़ पर
  rationale: यूनानी पद का निकट और प्रसंगानुकूल रूप है; भूभाग को अनावश्यक रूप से अधिक विशिष्ट नहीं करता।
- source_word: αὐτὸς μόνος
  choice: अकेले
  rationale: यूनानी की बलाघाती अभिव्यक्ति को हिन्दी में ‘अकेले’ स्वाभाविक रूप से पर्याप्त ढंग से व्यक्त करता है; दोहरे पर्याय अनावश्यक लगते।
theological_decisions:
- issue: यीशु को राजा बनाने के लिए भीड़ की प्रस्तावित कार्रवाई का स्वरूप
  choice: ‘पकड़कर जबरन राजा बनाने’ के रूप में अनुवाद
  alternative: ‘ले जाकर राजा बनाने’ या केवल ‘राजा बनाने’ के रूप में अनुवाद
  rationale: ἁρπάζειν बल अथवा दबाव से पकड़ने का संकेत देता है। अनुवाद को इस राजनीतिक कार्रवाई की बाध्यकारी प्रकृति को नरम नहीं करना चाहिए, न ही इसे स्वेच्छापूर्ण राज्याभिषेक बनाना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यीशु के लिए आदरसूचक बहुवचन ‘उन्हें/वे’ प्रयुक्त है। अस्पष्ट सर्वनाम से बचने के लिए पिछले प्रसंग की भीड़ को ‘लोग’ कहा गया है।
