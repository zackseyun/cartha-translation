  verdict: revise
  source_fidelity: The draft correctly identifies Philip as the speaker, retains the historical currency term δηνάριον as “दीनार,” and conveys the insufficiency even for each person to receive a small amount. However, the Greek present tense ἀρκοῦσιν (“are not sufficient”) is better represented by “नहीं हैं” than the future “नहीं होंगी.”
  naturalness: The proposed revision is idiomatic modern standard Hindi. Adding “इतनी” naturally links “पर्याप्त नहीं हैं” with the following result/extent clause (“कि हर एक को…”).
  terminology: “फ़िलिप्पुस,” “दीनार,” and “रोटियाँ” are suitable. “हर एक” accurately renders ἕκαστος without introducing interpretive content.
  issues:
  - severity: low
    issue: Future tense in “पर्याप्त नहीं होंगी”
    rationale: The source uses the present indicative, ἀρκοῦσιν. Although a future may be inferable from the narrative setting, it is not required and slightly weakens formal fidelity.
  - severity: low
    issue: The extent clause is less explicit in Hindi
    rationale: Greek links the insufficiency to even each person receiving a little. “इतनी ... कि” makes that relationship clear and natural in Hindi.
