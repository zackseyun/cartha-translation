  yaml_path: translation/nt/john/006/007.yaml
  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: hi
  text: फ़िलिप्पुस ने उसे उत्तर दिया, “दो सौ दीनार की रोटियाँ उनके लिए इतनी पर्याप्त नहीं हैं कि हर एक को थोड़ा-सा मिल सके।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διακοσίων δηναρίων
  choice: दो सौ दीनार की
  rationale: मूल में धनराशि का सीधा उल्लेख है। ‘दीनार’ प्राचीन रोमी मुद्रा को सुरक्षित रखता है; यहाँ बहुवचन अर्थ संख्या से स्पष्ट है।
- source_word: ἄρτοι
  choice: रोटियाँ
  rationale: संदर्भ में खाने के लिए रोटी की मात्रा अभिप्रेत है; सामान्य आधुनिक हिन्दी में ‘रोटियाँ’ स्वाभाविक और स्पष्ट है।
- source_word: οὐκ ἀρκοῦσιν
  choice: भी ... पर्याप्त नहीं होंगी
  rationale: अपर्याप्तता का भाव सुरक्षित है। ‘भी’ हिन्दी में इतनी बड़ी राशि के बावजूद अपर्याप्तता पर निहित बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἵνα ἕκαστος βραχύ τι λάβῃ
  choice: कि हर एक को थोड़ा-सा मिल सके
  rationale: ἵνα उपवाक्य यहाँ अपेक्षित परिणाम/पर्याप्तता की सीमा बताता है; यह हिन्दी रूप उद्देश्य को अनावश्यक रूप से कठोर किए बिना मूल संबंध को बनाए रखता है।
