  text: ⸀ἀπεκρίθη αὐτῷ Σίμων Πέτρος· Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
translation:
  language: hi
  text: शमौन पतरस ने उसे उत्तर दिया, “प्रभु,[a] हम किसके पास जाएँ? अनन्त जीवन की बातें आपके पास हैं,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वामी।” यूनानी संबोधन आदर प्रकट कर सकता है; यहाँ “प्रभु” यूहन्ना के सुसमाचार के प्रयोग के अनुकूल है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: उसे उत्तर दिया
  rationale: संवाद में प्रत्युत्तर देने की सामान्य क्रिया और यीशु की ओर संकेत करने वाले दत्तिव सर्वनाम को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Σίμων Πέτρος
  choice: शमौन पतरस
  rationale: नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं।
- source_word: Κύριε
  choice: प्रभु
  rationale: κύριος के संबोधन रूप के लिए मानक हिन्दी प्रतिशब्द; यह आदरसूचक संबोधन और यूहन्ना-साहित्य में उसकी मसीही गूँज दोनों बनाए रखता है।
- source_word: πρὸς τίνα ἀπελευσόμεθα
  choice: हम किसके पास जाएँ?
  rationale: πρός के व्यक्तिगत लक्ष्य और भविष्यकालीन आलंकारिक प्रश्न को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ῥήματα ζωῆς αἰωνίου
  choice: अनन्त जीवन की बातें
  rationale: ῥήματα यहाँ बोले गए वचनों/बातों का बहुवचन है; ‘बातें’ सामान्य पाठक के लिए स्वाभाविक है और संबंधकारक पदबंध की वास्तविक अस्पष्टता—जीवन देने वाली अथवा अनन्त जीवन से संबंधित बातें—को खुला रखता है।
- source_word: ἔχεις
  choice: आपके पास हैं
  rationale: अधिकार या धारण करने के साधारण अर्थ को सम्मानसूचक हिन्दी संबोधन के अनुरूप सहज रूप में व्यक्त करता है।
theological_decisions:
- issue: यीशु के लिए Κύριε संबोधन का बल
  choice: प्रभु
  alternative: स्वामी / गुरु
  rationale: ‘प्रभु’ सम्मान और सम्भावित मसीही महत्त्व दोनों को बिना अतिरिक्त doctrinal निष्कर्ष जोड़े बनाए रखता है; वैकल्पिक आदरसूचक अर्थ पादटिप्पणी में दिया गया है।
- issue: ῥήματα ζωῆς αἰωνίου में संबंधकारक का अर्थ
  choice: अनन्त जीवन की बातें
  alternative: अनन्त जीवन देने वाली बातें
  rationale: मूल यूनानी स्पष्ट रूप से यह निर्धारित नहीं करता कि ये बातें अनन्त जीवन देती हैं या उससे संबंधित हैं; शाब्दिक संबंधकारक उस अर्थगत तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानसूचक ‘आप’ के साथ। वाक्य को बोलचाल में सहज किंतु गरिमापूर्ण रखा गया है; ‘अनन्त जीवन’ यूहन्ना-साहित्य का स्थापित प्रमुख पद है।
