translation:
  language: hi
  text: उसने कफरनहूम के आराधनालय में शिक्षा देते समय ये बातें कहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक शब्द पिछले कथनों की ओर सामूहिक रूप से संकेत करता है; ‘ये बातें’ उसके बहुवचन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἶπεν
  choice: उसने ... कहीं
  rationale: λέγω के अओरिस्ट का सीधा अर्थ ‘कहा’ है। हिन्दी में ‘बातें’ के साथ क्रिया का स्त्रीलिंग बहुवचन रूप ‘कहीं’ स्वाभाविक है; कर्ता संदर्भ से यीशु है, इसलिए नाम जोड़ा नहीं गया।
- source_word: ἐν συναγωγῇ
  choice: आराधनालय में
  rationale: συναγωγή यहाँ यहूदी सभा-स्थान को दर्शाता है। यूनानी में उपपद न होने पर भी स्थानीय संदर्भ इसे निश्चित मानने देता है; हिन्दी में अलग निश्चित उपपद आवश्यक नहीं है।
- source_word: διδάσκων
  choice: शिक्षा देते समय
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ चल रही क्रिया बताता है; यह पदबंध उस समकालिकता को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: ἐν Καφαρναούμ
  choice: कफरनहूम में
  rationale: स्थान-नाम Καφαρναούμ का प्रचलित हिन्दी लिप्यंतरण ‘कफरनहूम’ है और ἐν का स्थानवाचक अर्थ ‘में’ से व्यक्त होता है।
