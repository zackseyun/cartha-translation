  text: और तेज़ हवा चलने के कारण झील विक्षुब्ध हो रही थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झील आंदोलित हो रही थी” अथवा “झील में हलचल मची हुई थी।”
    reason: διεγείρετο के लिए निकटवर्ती हिन्दी विकल्प; ये जल के विक्षुब्ध होने का भाव रखते हैं, बिना लहरों का स्पष्ट उल्लेख जोड़े।
lexical_decisions:
- source_word: ἥ τε θάλασσα
  choice: और ... झील
  rationale: τε हल्का संयोजक है, इसलिए ‘और’ स्वाभाविक है। θάλασσα का सामान्य अर्थ ‘समुद्र’ है, पर यूहन्ना 6 के प्रसंग में यह गलील की झील है; आधुनिक हिन्दी में इस जलाशय के लिए ‘झील’ अधिक सहज और स्पष्ट है, बिना मूल में निहित स्थान को बदलने के।
- source_word: ἀνέμου μεγάλου
  choice: तेज़ हवा
  rationale: μέγας यहाँ हवा की प्रबलता बताता है। हिन्दी में ‘तेज़ हवा’ स्वाभाविक है और ‘प्रचंड’ की अपेक्षा तीव्रता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: πνέοντος
  choice: चलने के कारण
  rationale: वर्तमान कृदन्त हवा के लगातार चलने की परिस्थिति बताता है। ‘चलने के कारण’ उसके कारणात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διεγείρετο
  choice: उथल-पुथल होने लगी थी
  rationale: अपूर्णकालीन कर्मवाच्य समुद्र पर पड़ रहे लगातार प्रभाव को व्यक्त करता है। ‘उथल-पुथल होने लगी थी’ जल के क्रमशः विक्षुब्ध होने की प्रक्रिया को सहज हिन्दी में रखता है; फुटनोट निकटतर विकल्प देता है।
