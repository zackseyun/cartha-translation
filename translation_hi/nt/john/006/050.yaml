source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: hi
  text: यह वह रोटी है जो स्वर्ग से उतरती है[a], ताकि कोई उसमें से खाए और न मरे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह स्वर्ग से उतरने वाली रोटी है।”
    reason: मूल यूनानी के वर्तमान कृदन्त का अधिक निकट संरचनात्मक अनुवाद।
  - marker: b
    text: “न मरे” को मूल पाठ की तरह व्यापक रखा गया है; प्रसंग में इसे अन्तिम मृत्यु, आत्मिक मृत्यु या अन्तकालीन विनाश से मुक्ति के रूप में समझा जा सकता है।
    reason: मृत्यु के स्वरूप के विषय में मूल पद की धर्मवैज्ञानिक व्यापकता और तनाव बनाए रखना।
lexical_decisions:
- source_word: οὗτός
  choice: यह
  rationale: यह संकेतवाचक सर्वनाम उस रोटी की ओर सीधे संकेत करता है जिसकी पहचान यीशु करा रहे हैं।
- source_word: ἄρτος
  choice: रोटी
  rationale: यह सामान्य और प्रसंगानुकूल अर्थ है; इससे यूहन्ना 6 में शब्द का शाब्दिक और रूपकात्मक, दोनों बल बना रहता है।
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: जो स्वर्ग से उतरती है
  rationale: वर्तमान कृदन्त को स्वाभाविक हिन्दी सम्बन्धवाचक उपवाक्य में व्यक्त किया गया है; ‘उतरती है’ उसके वर्तमान और चरित्रसूचक भाव को बनाए रखता है।
- source_word: οὐρανός
  choice: स्वर्ग
  rationale: इस प्रसंग में आशय केवल आकाश नहीं, बल्कि परमेश्वर के स्वर्गीय लोक से है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणाम का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τις
  choice: कोई
  rationale: अनिश्चित सर्वनाम का सामान्य और खुला भाव सुरक्षित रहता है।
- source_word: ἐξ αὐτοῦ
  choice: उसमें से
  rationale: ἐξ का स्रोत या अंश ग्रहण करने का भाव हिन्दी में ‘उसमें से खाए’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: φάγῃ
  choice: खाए
  rationale: ἵνα के अधीन अओरिस्ट संभावनार्थक क्रिया को ‘ताकि ... खाए’ से सामान्य उद्देश्य के रूप में व्यक्त किया गया है।
- source_word: μὴ ἀποθάνῃ
  choice: न मरे
  rationale: क्रिया का सीधा अर्थ ‘मरना’ है; ‘नाश न हो’ कहने से ऐसा व्याख्यात्मक अर्थ जुड़ सकता है जिसकी इस पद में स्पष्ट माँग नहीं है।
theological_decisions:
- issue: ‘न मरे’ में मृत्यु का स्वरूप
  choice: साधारण और व्यापक अभिव्यक्ति ‘न मरे’ बनाए रखना
  alternative: ‘आत्मिक रूप से न मरे’ अथवा ‘अनन्त नाश में न पड़े’
  rationale: जीवन की रोटी के इस संवाद में मृत्यु का गहरा धर्मवैज्ञानिक आशय है, पर यह पद स्वयं उसे केवल शारीरिक, आत्मिक या अन्तकालीन मृत्यु के रूप में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘रोटी’, ‘स्वर्ग से उतरती है’ और ‘न मरे’ जैसे सीधे पद मूल की रूपकात्मक शक्ति और जानबूझकर छोड़ी गई व्यापकता को सुरक्षित रखते हैं।
