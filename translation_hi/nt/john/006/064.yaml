source:
  edition: SBLGNT
  text: ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: hi
  text: पर तुममें से कुछ ऐसे हैं जो विश्वास नहीं करते। क्योंकि यीशु आरम्भ ही से जानते थे कि कौन लोग विश्वास नहीं करते थे और कौन उन्हें पकड़वाने वाला था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “उन्हें सौंपने वाला था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: पर
  rationale: पिछले कथन के विपरीत स्थिति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐξ ὑμῶν
  choice: तुममें से
  rationale: सम्बोधित समूह के भीतर के कुछ लोगों को दर्शाने वाला सटीक और सहज हिन्दी प्रयोग।
- source_word: τινες
  choice: कुछ ऐसे
  rationale: श्रोताओं में से एक अनिर्दिष्ट समूह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἳ οὐ πιστεύουσιν / οἱ μὴ πιστεύοντες
  choice: जो विश्वास नहीं करते / कौन-कौन विश्वास नहीं करते
  rationale: वर्तमान काल में जारी अविश्वास को हिन्दी के सामान्य वर्तमान काल द्वारा बनाए रखता है; दूसरी अभिव्यक्ति substantival participle को सहज हिन्दी में देती है।
- source_word: ᾔδει
  choice: जानते थे
  rationale: यीशु के लिए आदरसूचक बहुवचन के साथ भूतकालीन स्थायी ज्ञान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐξ ἀρχῆς
  choice: आरम्भ ही से
  rationale: मूल के कालवाचक अर्थ को बनाए रखता है; ‘ही’ इस बात पर स्वाभाविक बल देता है कि यह ज्ञान आरम्भ से था, बिना ‘आरम्भ’ का संदर्भ निश्चित किए।
- source_word: παραδώσων αὐτόν
  choice: उन्हें पकड़वाने वाला था
  rationale: यहूदा के प्रसंग में किसी अधिकारी के हाथ सौंपे जाने और विश्वासघाती भूमिका—दोनों को हिन्दी में स्पष्ट करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: πιστεύω का अर्थ
  choice: विश्वास करना
  alternative: भरोसा रखना
  rationale: यूहन्ना के प्रसंग में यह स्थापित और पर्याप्त व्यापक हिन्दी अभिव्यक्ति है; यह अर्थ को केवल बौद्धिक स्वीकृति या केवल व्यक्तिगत भरोसे तक सीमित नहीं करती।
- issue: यहूदा के संदर्भ में παραδίδωμι का अनुवाद
  choice: पकड़वाना
  alternative: सौंप देना
  rationale: प्रसंग में यह यीशु को शत्रुओं के हाथ दिलवाने की विश्वासघाती कार्रवाई है। ‘पकड़वाना’ हिन्दी पाठक के लिए उस आशय को स्वाभाविक रूप से व्यक्त करता है, जबकि अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: ἐξ ἀρχῆς में ‘आरम्भ’ का संदर्भ
  choice: संदर्भ को अनिर्धारित रखना
  alternative: सेवकाई के आरम्भ से / सृष्टि के आरम्भ से
  rationale: यूनानी पाठ स्वयं यह स्पष्ट नहीं करता कि किस आरम्भ की बात है; अनुवाद किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए सहज, पर गरिमापूर्ण शैली। यीशु के लिए आदरसूचक बहुवचन (‘जानते थे’, ‘उन्हें’) रखा गया है। वाक्यरचना मूल के विरोध, कारण और दोहरे ज्ञान-विषय को स्पष्ट बनाए रखती है।
