language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: hi
  text: यीशु ने उन्हें उत्तर दिया, “मैं तुमसे सच-सच कहता हूँ, तुम मुझे इसलिए नहीं खोज रहे हो कि तुमने चिह्न देखे, बल्कि इसलिए कि तुमने रोटियों में से खाकर तृप्त हो गए[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने रोटियाँ खाईं और तृप्त हो गए।” यूनानी में अधिक शाब्दिक रूप से, “तुमने रोटियों में से खाया और तृप्त हुए” है।
    reason: मूल के बहुवचन ‘रोटियों,’ ἐκ के अंशसूचक भाव, और ‘तृप्त होने’ के अर्थ को बताते हुए स्वाभाविक हिन्दी विकल्प देता है।
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: यीशु ने उन्हें उत्तर दिया
  rationale: यूनानी का दोहरा वाक्-परिचय ‘उत्तर दिया और कहा’ हिन्दी में अनावश्यक रूप से भारी लगता है; ‘उत्तर दिया’ संवाद और आगे आने वाले प्रत्यक्ष कथन, दोनों को स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच-सच कहता हूँ
  rationale: ‘सच-सच’ यूहन्ना की विशिष्ट द्विरुक्ति और कथन की गंभीरता को बनाए रखता है, जबकि आधुनिक हिन्दी में अर्थ स्पष्ट रहता है।
- source_word: ζητεῖτέ με
  choice: तुम मुझे ... खोज रहे हो
  rationale: वर्तमान काल की जारी क्रिया को ‘खोज रहे हो’ स्वाभाविक रूप से व्यक्त करता है और ‘ढूँढ़ रहे हो’ की तुलना में यूहन्ना में प्रयुक्त खोजने की व्यापक अर्थछाया भी बनाए रखता है।
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: इसलिए नहीं ... कि ... बल्कि इसलिए कि
  rationale: यह हिन्दी में कारण अथवा प्रेरणा के विरोध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἴδετε σημεῖα
  choice: तुमने चिह्न देखे
  rationale: ‘देखे’ मूल क्रिया का सीधा अर्थ रखता है और आध्यात्मिक समझ का अर्थ नहीं जोड़ता; ‘चिह्न’ यूहन्ना की अर्थपूर्ण शब्दावली को ‘चमत्कार’ में सीमित नहीं करता।
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: तुमने रोटियों में से खाया
  rationale: यह बहुवचन ‘रोटियों’ और ἐκ के अंशसूचक भाव, दोनों को यथासंभव सुरक्षित रखता है, यद्यपि हिन्दी में ‘रोटियाँ खाईं’ अधिक सहज विकल्प है।
- source_word: ἐχορτάσθητε
  choice: तृप्त हो गए
  rationale: क्रिया पेट भर जाने और पर्याप्त भोजन पाने का भाव देती है; ‘तृप्त हो गए’ dignified, स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: σημεῖα का यूहन्नाई अर्थ
  choice: चिह्न
  alternative: चमत्कार; चमत्कारी चिह्न
  rationale: ‘चिह्न’ यीशु के कार्यों को केवल आश्चर्यजनक घटनाएँ नहीं, बल्कि अपने से परे संकेत करने वाले प्रकाशनकारी कार्य भी रहने देता है।
- issue: भीड़ की प्रेरणा का विरोध
  choice: ‘इसलिए नहीं ... बल्कि इसलिए’ के रूप में स्पष्ट कारणात्मक विरोध
  alternative: ‘यह नहीं कि ... बल्कि यह कि’
  rationale: मूल पाठ उनके खोजने के कारणों का विरोध करता है; अनुवाद इस तनाव को रखता है कि उन्होंने घटनाएँ देखीं, पर यीशु के अनुसार उन्हें ‘चिह्न’ के रूप में ग्रहण करना उनकी वास्तविक प्रेरणा नहीं थी।
- issue: दोहरे वाक्-परिचय का हिन्दीकरण
  choice: ‘उत्तर दिया’ में स्वाभाविक संक्षेप
  alternative: ‘उत्तर दिया और कहा’
  rationale: यह शैलीगत संक्षेप है, धर्मवैज्ञानिक व्याख्या नहीं; प्रत्यक्ष कथन के आरम्भ से ‘कहा’ का अर्थ स्पष्ट रूप से उपस्थित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण संवाद-रजिस्टर अपनाया गया है। ‘सच-सच’, ‘चिह्न’ और ‘तृप्त’ बाइबलीय गंभीरता रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
