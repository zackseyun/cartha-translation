  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: hi
  text: इसलिए उन्होंने उससे कहा, “प्रभु[a], हमें यह रोटी हमेशा दीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “श्रीमान्।” यूनानी संबोधन आदरपूर्ण रूप से किसी को पुकारने के लिए भी प्रयुक्त हो सकता है; इसका अनुवाद “प्रभु” भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: उन्होंने…कहा
  rationale: कथात्मक संवाद में λέγω के एओरिस्ट का स्वाभाविक हिन्दी रूप ‘कहा’ है; बहुवचन कर्ता को प्रसंगानुसार ‘उन्होंने’ से व्यक्त किया गया है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह शब्द पिछली बातचीत से निकले निष्कर्ष या प्रतिक्रिया का संबंध दिखाता है; ‘इसलिए’ उस तार्किक कड़ी को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: πρὸς αὐτόν
  choice: उससे
  rationale: बोलने की क्रिया के साथ πρός और कर्मकारक संबोधित व्यक्ति को सूचित करते हैं; हिन्दी में ‘उससे कहा’ स्वाभाविक है।
- source_word: Κύριε
  choice: प्रभु
  rationale: सम्बोधन में κύριε आदरसूचक ‘श्रीमान’ भी हो सकता है और गहरे अर्थ में ‘प्रभु’ भी; मुख्य पाठ में ‘प्रभु’ इस अर्थ-विस्तार को बेहतर बनाए रखता है।
- source_word: πάντοτε
  choice: सदा
  rationale: πάντοτε का सीधा अर्थ ‘सदा/हमेशा’ है और यहाँ निरंतर उपलब्ध कराने की विनती व्यक्त होती है।
- source_word: δὸς
  choice: दिया कर
  rationale: δίδωμι का आज्ञार्थक रूप सीधी विनती है। πάντοτε के साथ हिन्दी का ‘दिया कर’ बार-बार या निरंतर देने की अपेक्षा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἡμῖν
  choice: हमें
  rationale: δίδωμι के साथ दत्तिव अप्रत्यक्ष कर्म है, जिसका सहज हिन्दी रूप ‘हमें’ है।
- source_word: τὸν ἄρτον τοῦτον
  choice: यह रोटी
  rationale: ἄρτος को ‘रोटी’ और निकटवाची संकेतवाचक τοῦτον को ‘यह’ से व्यक्त किया गया है, जिससे पहले चर्चा की गई रोटी का संदर्भ बना रहता है।
theological_decisions:
- issue: यीशु के लिए सीधे सम्बोधन में κύριος का अनुवाद
  choice: प्रभु
  alternative: श्रीमान
  rationale: भीड़ की समझ इस बिंदु पर पूर्ण मसीही स्वीकारोक्ति हो, यह आवश्यक नहीं; फिर भी κύριε आदरसूचक सम्बोधन और अधिक गहरे प्रभुत्व—दोनों की संभावना रखता है। ‘प्रभु’ मुख्य पाठ में इस तनाव को बनाए रखता है, जबकि ‘श्रीमान’ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘सदा दिया कर’ निरंतर प्रावधान की माँग को बोलचाल की स्वाभाविकता के साथ व्यक्त करता है; ‘प्रभु’ के अर्थ की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
