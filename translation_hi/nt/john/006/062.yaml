  edition: SBLGNT
  text: ἐὰν οὖν θεωρῆτε τὸν υἱὸν τοῦ ἀνθρώπου ἀναβαίνοντα ὅπου ἦν τὸ πρότερον;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/062.yaml
  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
translation:
  language: hi
  text: तो फिर, यदि तुम मनुष्य के पुत्र को जहाँ वह पहले था, वहाँ ऊपर चढ़ते हुए देखोगे, तो क्या होगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो फिर यदि तुम मनुष्य के पुत्र को जहाँ वह पहले था, वहाँ ऊपर चढ़ते हुए देखो?” यूनानी में यह एक शर्तयुक्त आलंकारिक प्रश्न है।
    reason: यूनानी वाक्य में शर्त का परिणाम स्पष्ट शब्दों में नहीं दिया गया; इसे हिन्दी में अपूर्ण प्रश्न के रूप में भी रखा जा सकता है।
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: तो फिर, यदि
  rationale: यह संयोजन पिछले कथन पर लोगों की ठोकर खाने की प्रतिक्रिया से निष्कर्षात्मक संबंध जोड़ते हुए एक शर्तयुक्त आलंकारिक प्रश्न आरम्भ करता है।
- source_word: θεωρῆτε
  choice: तुम ... देखोगे
  rationale: θεωρέω ध्यानपूर्वक या प्रत्यक्ष रूप से देखने का भाव रख सकता है; यहाँ संभावित भविष्य की शर्त में सहज हिन्दी के लिए ‘देखोगे’ उपयुक्त है।
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: यह सुसमाचारों में यीशु की स्थापित आत्म-पदवी है और इसके दानिय्येली तथा मसीही संकेतों को सुरक्षित रखती है।
- source_word: ἀναβαίνοντα
  choice: ऊपर जाते
  rationale: कृदन्त ऊपर की ओर गति बताता है। ‘ऊपर जाते’ साधारण आधुनिक हिन्दी में स्वाभाविक है और स्वर्गारोहण की सम्भावना को बिना अतिरिक्त व्याख्या के खुला रखता है।
- source_word: ὅπου ἦν τὸ πρότερον
  choice: वहाँ ... जहाँ वह पहले था
  rationale: यह वाक्यांश किसी पूर्व स्थान या अवस्था की ओर संकेत करता है; अनुवाद उसी अस्पष्टता को बनाए रखता है और ‘स्वर्ग’ या ‘पिता’ नहीं जोड़ता।
theological_decisions:
- issue: क्या यीशु के ऊपर जाने को स्पष्ट रूप से पूर्व-अस्तित्व, स्वर्ग या पिता के पास लौटने के रूप में समझाया जाए
  choice: ‘जहाँ वह पहले था’ को बिना व्याख्यात्मक विस्तार के रखा गया।
  alternative: ‘स्वर्ग में, जहाँ वह पहले था’ या ‘पिता के पास, जहाँ वह पहले था’
  rationale: यूनानी पाठ पूर्व स्थिति और ऊपर जाने का प्रबल संकेत देता है, पर इस पद में न स्वर्ग का और न पिता का स्पष्ट उल्लेख है। इसलिए उसके मसीह-विषयक तनाव को यथावत रखा गया है।
- issue: अपूर्ण शर्तयुक्त प्रश्न का हिन्दी रूप
  choice: ‘तो क्या होगा?’ जोड़कर आलंकारिक प्रश्न को हिन्दी में स्पष्ट किया गया।
  alternative: वाक्य को ‘तो फिर यदि तुम ... देखोगे?’ के रूप में अपूर्ण ही रखना
  rationale: यूनानी में परिणाम-वाक्य निहित है और पूरा वाक्य प्रश्नचिह्न के साथ आलंकारिक शर्त है। हिन्दी में ‘तो क्या होगा?’ उसी निहित प्रश्न को स्वाभाविक रूप देता है, बिना यह तय किए कि अपेक्षित प्रतिक्रिया आश्चर्य, ठोकर या विश्वास है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘मनुष्य का पुत्र’ पदवी को सुरक्षित रखा गया है; ‘ऊपर जाना’ स्पष्ट और प्राकृतिक है तथा पाठ से बाहर की स्थान-संबंधी व्याख्या नहीं जोड़ता।
