source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: hi
  text: जब वे चप्पू चलाकर लगभग पच्चीस या तीस स्टेडिया[a] जा चुके थे, तब उन्होंने यीशु को समुद्र पर चलते हुए और नाव के पास आते देखा, और वे डर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: स्टेडियन दूरी की एक प्राचीन इकाई थी। पच्चीस या तीस स्टेडिया लगभग पाँच से छह किलोमीटर होते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: ἐληλακότες
  choice: नाव खेकर…दूर जा चुके थे
  rationale: नौका-संदर्भ में ἐλαύνω नाव को खेकर आगे ले जाने का भाव देता है। सिद्ध कृदंत मुख्य क्रिया से पहले पूरी हो चुकी यात्रा को दर्शाता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले वर्णन से कथा की अगली घटना को जोड़ता है; ‘इसलिए’ इसके संयोजक और परिणामसूचक बल को बनाए रखता है।
- source_word: ὡς
  choice: लगभग
  rationale: दूरी के साथ ὡς अनुमान व्यक्त करता है।
- source_word: σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: पच्चीस या तीस स्टेडिया
  rationale: प्राचीन माप-इकाई को मूल पाठ के अनुरूप मुख्य पाठ में रखा गया है और आधुनिक समतुल्य पादटिप्पणी में दिया गया है।
- source_word: θεωροῦσιν
  choice: उन्होंने…देखा
  rationale: इस कथा-संदर्भ में साधारण प्रत्यक्ष दर्शन का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: समुद्र पर चलते
  rationale: θάλασσα का मूल अर्थ ‘समुद्र’ है और ἐπί यहाँ उसकी सतह पर चलने का भाव देता है; अनुवाद घटना की असाधारणता को न तो नरम करता है, न उसकी व्याख्या जोड़ता है।
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: नाव के पास आते
  rationale: γίνομαι के साथ ἐγγύς स्थिर निकटता नहीं, बल्कि निकट आने की गति व्यक्त करता है।
- source_word: πλοίου
  choice: नाव
  rationale: गलील के इस प्रसंग में πλοῖον के लिए ‘नाव’ आधुनिक हिन्दी में ‘जहाज़’ से अधिक उपयुक्त है।
- source_word: ἐφοβήθησαν
  choice: वे डर गए
  rationale: यह उनकी तत्काल भयपूर्ण प्रतिक्रिया को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: चमत्कार के वर्णन की प्रत्यक्षता बनाए रखना
  choice: समुद्र पर चलते
  alternative: समुद्र के किनारे चलते / पानी पर चलते
  rationale: शिष्य तट से दूर नाव में हैं, इसलिए ‘समुद्र के किनारे’ संदर्भ के अनुकूल नहीं है। ‘पानी पर’ अर्थ की दृष्टि से संभव है, पर यूनानी संज्ञा θάλασσα स्पष्टतः ‘समुद्र’ कहती है। मुख्य पाठ उसी शब्दावली और उसके प्रत्यक्ष आशय को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘स्टेडिया’ जैसी अपरिचित प्राचीन इकाई को स्रोत-पारदर्शिता के लिए रखा गया है और पादटिप्पणी में उसका आधुनिक मान दिया गया है।
