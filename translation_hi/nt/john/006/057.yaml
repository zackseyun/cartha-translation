reference: John 6:57
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: hi
  text: जैसे जीवित पिता ने मुझे भेजा और मैं पिता के कारण जीवित हूँ, वैसे ही जो मुझे खाता है[a], वह भी मेरे कारण जीवित रहेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया बहुत सजीव और ठोस है; इसका शाब्दिक अर्थ खाना, यहाँ तक कि चबाकर खाना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पिता के द्वारा’ और ‘मेरे द्वारा’ भी अनुवाद संभव है। यूनानी संबंधबोधक शब्द कारण अथवा माध्यम—दोनों अर्थ दे सकता है; मुख्य पाठ में कारण का अर्थ रखा गया है, जिससे पिता और पुत्र तथा पुत्र और विश्वासी के बीच की समानांतरता बनी रहती है।
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: जैसे ... वैसे ही
  rationale: यह पूरे वाक्य की तुलना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; उत्तरार्ध का ‘वैसे ही’ यूनानी तुलना की संरचना और κἀκεῖνος के बल को सामने लाता है।
- source_word: ὁ ζῶν πατὴρ
  choice: जीवित पिता
  rationale: यह attributive participle का सीधा अनुवाद है और ‘जीवन देनेवाला पिता’ जैसी अतिरिक्त व्याख्या जोड़े बिना योहन के जीवन-विषय को बनाए रखता है।
- source_word: ἀπέστειλέν με
  choice: मुझे भेजा
  rationale: aorist को साधारण भूतकाल में स्वाभाविक रूप से व्यक्त करता है और क्रिया में ‘नियुक्त किया’ जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: κἀγὼ ζῶ
  choice: और मैं ... जीवित हूँ
  rationale: वर्तमानकाल और जीवन की चलती हुई वास्तविकता को बनाए रखता है; ‘जीता हूँ’ भी संभव है, पर यहाँ ‘जीवित हूँ’ आधुनिक हिन्दी में अधिक स्पष्ट है।
- source_word: διὰ τὸν πατέρα
  choice: पिता के कारण
  rationale: διά के साथ accusative यहाँ कारण या आधार का अर्थ स्वाभाविक रूप से देता है और δι’ ἐμέ के साथ समानांतरता बनाए रखता है।
- source_word: ὁ τρώγων με
  choice: जो मुझे खाता है
  rationale: τρώγω की ठोस और सजीव खाने की क्रिया को बिना उसे केवल संस्कारगत या केवल रूपकात्मक अर्थ में सीमित किए सीधे व्यक्त करता है।
- source_word: κἀκεῖνος
  choice: वह भी
  rationale: सर्वनाम के बल—‘वह भी/वही भी’—को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ζήσει
  choice: जीवित रहेगा
  rationale: future indicative को स्पष्ट रूप से व्यक्त करता है और पहले आए ‘जीवित हूँ’ के साथ जीवन-विषयक समानांतरता बनाए रखता है।
- source_word: δι’ ἐμέ
  choice: मेरे कारण
  rationale: कारण अथवा आधार का अर्थ देता है और ‘पिता के कारण’ के साथ जानबूझकर समान संरचना रखता है।
theological_decisions:
- issue: διὰ τὸν πατέρα में पुत्र के जीवन और पिता के संबंध का अर्थ
  choice: ‘मैं पिता के कारण जीवित हूँ’ के रूप में कारणात्मक अनुवाद
  alternative: ‘मैं पिता के द्वारा जीवित हूँ’
  rationale: διά + accusative का कारणात्मक बल और पिता-पुत्र तथा पुत्र-विश्वासी की समानांतरता सुरक्षित रहती है। अनुवाद इससे आगे बढ़कर पुत्र की सत्ता के विषय में हीनता अथवा किसी व्यवस्थित धर्मसिद्धान्त का निष्कर्ष नहीं जोड़ता।
- issue: ὁ τρώγων με का संस्कारगत अथवा व्यापक रूपकात्मक अर्थ
  choice: ठोस रूप में ‘जो मुझे खाता है’
  alternative: ‘जो मुझसे अपना पोषण पाता है’ या ‘जो मुझमें सहभागी होता है’
  rationale: मूल क्रिया खाने की सजीव, ठोस भाषा रखती है। सीधा अनुवाद प्रभु-भोज संबंधी और विश्वास द्वारा मसीह से एकता संबंधी व्याख्याओं के बीच के तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘जीवित पिता’, ‘पिता के कारण’ और ‘मुझे खाता है’ मूल यूनानी की सीधाई तथा धर्मवैचारिक तनाव बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
