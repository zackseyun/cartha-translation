    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: जो ... खाता है
  rationale: लेखयुक्त वर्तमान कृदन्त किसी ऐसे व्यक्ति को दर्शाता है जिसकी पहचान इस क्रिया से होती है। हिन्दी का ‘जो ... खाता है’ एकवचन संदर्भ और जारी/विशेषतामूलक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τρώγων
  choice: खाता
  rationale: τρώγω सामान्य ‘खाने’ की अपेक्षा अधिक सजीव होकर ‘चबाने’ या ‘खा लेने’ का भाव दे सकता है। मुख्य पाठ में ‘खाता’ सहज और स्पष्ट है; अधिक सजीव अर्थ को पादटिप्पणी में रखा गया है।
- source_word: μου τὴν σάρκα
  choice: मेरा मांस
  rationale: यहाँ σάρξ ठोस और जानबूझकर तीखी देह-संबंधी छवि देता है। ‘मांस’ उस छवि को बनाए रखता है और उसे किसी सम्प्रदायगत व्याख्या में नहीं बदलता।
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: और मेरा लहू पीता है
  rationale: समन्वित वर्तमान कृदन्त को सीधे रूप में रखा गया है। ‘लहू’ αἷμα की ठोस, बलिदान-संबंधी और चौंकाने वाली छवि को सुरक्षित रखता है।
- source_word: ἐν ἐμοὶ μένει
  choice: मुझमें बना रहता है
  rationale: μένω यूहन्ना में बार-बार आने वाला संबंध और स्थायित्व सूचक शब्द है। ‘बना रहता है’ आधुनिक हिन्दी में स्वाभाविक है और ‘वास करता है’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: κἀγὼ ἐν αὐτῷ
  choice: और मैं उसमें
  rationale: यूनानी में दूसरी उपवाक्यांश में क्रिया दुहराई नहीं गई है। हिन्दी में भी दीर्घवृत्त को बनाए रखना स्वाभाविक और स्रोत के निकट है; अर्थतः ‘मैं भी उसमें बना रहता हूँ’ निहित है।
- source_word: αὐτῷ
  choice: उसमें
  rationale: पुल्लिंग एकवचन सर्वनाम पहले आए व्यक्ति को संदर्भित करता है। हिन्दी में ‘उसमें’ उसी संदर्भ को संक्षेप और स्वाभाविकता से रखता है।
theological_decisions:
- issue: मांस खाने और लहू पीने की प्रभुभोज-संस्कारात्मक बनाम रूपकात्मक व्याख्या
  choice: यूनानी की ठोस शब्दावली को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: इसे स्पष्टतः प्रभुभोज-संस्कार या स्पष्टतः विश्वास करने के रूपक के रूप में कहना।
  rationale: इस कथन की व्याख्या विभिन्न मसीही परम्पराओं में विवादित है। मूल पाठ स्वयं यहाँ उस विवाद का स्पष्ट समाधान नहीं देता, इसलिए अनुवाद किसी सम्प्रदायगत निष्कर्ष को पाठ में नहीं जोड़ता।
- issue: यूहन्नाई पारस्परिक अंतर्निवास
  choice: μένει को ‘बना रहता है’ और दूसरे खंड को ‘और मैं उसमें’ कहा गया है।
  alternative: ‘वास करता है’, ‘एक हो जाता है’, अथवा दोनों खंडों में ‘बना रहता है’ स्पष्ट रूप से दुहराना।
  rationale: यह चयन संबंधात्मक स्थायित्व और यूनानी के पारस्परिक भाव को सुरक्षित रखता है, पर उसे बाद की किसी विशिष्ट रहस्यवादी या सिद्धान्तगत शब्दावली में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘मांस’ और ‘लहू’ मूल की ठोस तथा चौंकाने वाली छवि बनाए रखते हैं। ‘बना रहता है’ यूहन्नाई μένω के लिए सहज आधुनिक विकल्प है।
