id: JHN.6.42
reference: John 6:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: hi
  text: और वे कह रहे थे, “क्या यह यूसुफ का पुत्र यीशु नहीं है, जिसके माता-पिता को हम जानते हैं? तो अब यह कैसे कहता है, ‘मैं स्वर्ग से उतर आया हूँ’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: वे कह रहे थे
  rationale: अपूर्ण भूतकाल चलती हुई या बार-बार कही जा रही बात का भाव देता है; इसलिए केवल ‘उन्होंने कहा’ की अपेक्षा यह अधिक सटीक है।
- source_word: Οὐχ οὗτός ἐστιν
  choice: क्या यह ... नहीं है
  rationale: यह हिन्दी में स्वाभाविक नकारात्मक प्रश्न है और श्रोताओं की सहमति मानकर चलने वाले आलंकारिक बल को बनाए रखता है।
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: यूसुफ का पुत्र
  rationale: यह संबंधकारक पदबंध का सीधा और स्वाभाविक अनुवाद है तथा यीशु की ज्ञात मानवीय पारिवारिक पहचान पर भीड़ के जोर को सुरक्षित रखता है।
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: जिसके माता-पिता को हम जानते हैं
  rationale: मूल के पिता और माता दोनों को समेटते हुए ‘माता-पिता’ आधुनिक हिन्दी में स्वाभाविक है; ‘हम’ को स्पष्ट रखकर ἡμεῖς का जोर भी बचाया गया है।
- source_word: πῶς νῦν λέγει
  choice: तो अब यह कैसे कहता है
  rationale: πῶς का मूल अर्थ ‘कैसे’ और λέγει का वर्तमानकाल सुरक्षित है। ‘तो’ पूर्व कथन से उठती आपत्ति को स्वाभाविक हिन्दी में जोड़ता है, बिना ‘कैसे कह सकता है’ जैसी अतिरिक्त सामर्थ्य-सूचक छाया जोड़े।
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से
  rationale: यह उद्गम या स्रोत बताने वाले ἐκ और संबंधकारक का मानक, स्पष्ट हिन्दी रूप है।
- source_word: καταβέβηκα
  choice: उतर आया हूँ
  rationale: यूनानी पूर्णकाल पूर्ण हुई घटना के वर्तमान परिणाम को व्यक्त करता है। ‘उतर आया हूँ’ यह पक्ष स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: यीशु के स्वर्गीय उद्गम के दावे पर भीड़ की आपत्ति
  choice: ‘मैं स्वर्ग से उतर आया हूँ’ दावे को प्रत्यक्ष रूप में बनाए रखा गया।
  alternative: ‘मैं स्वर्ग से आया हूँ’ या इसे रूपकात्मक व्याख्या में बदलना
  rationale: मूल पाठ स्वर्ग से उतरने का स्पष्ट दावा रखता है और भीड़ की आपत्ति उसी पर केंद्रित है। अनुवाद इसे न तो नरम करता है, न इसकी व्याख्या करके निहित धर्मवैज्ञानिक तनाव को समाप्त करता है।
- issue: यूसुफ को यीशु का पिता कहे जाने और स्वर्गीय उद्गम के दावे के बीच तनाव
  choice: भीड़ की दृष्टि से ‘यूसुफ का पुत्र’ को बिना स्पष्टीकरण के रखा गया।
  alternative: ‘यूसुफ का समझा जाने वाला पुत्र’
  rationale: मूल पद में ‘समझा जाने वाला’ नहीं है। ऐसी व्याख्यात्मक वृद्धि इस पद में भीड़ के कथन और यीशु के दावे के बीच जानबूझकर उपस्थित तनाव को समय से पहले सुलझा देगी।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संवाद में ‘यह’ मूल के οὗτός को दर्शाता है और भीड़ की प्रत्यक्ष, कुछ चुनौतीपूर्ण शैली को बनाए रखता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
