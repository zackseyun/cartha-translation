  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: hi
  text: कोई भी मेरे पास नहीं आ सकता, जब तक कि मुझे भेजने वाला पिता उसे न खींचे[a]; और मैं उसे अंतिम दिन जिला उठाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे खींचकर लाए” या “उसे घसीटे।” यूनानी क्रिया का अर्थ अधिक बलपूर्वक खींचना या घसीटना भी हो सकता है। मुख्य पाठ में “खींचे” रखा गया है, ताकि क्रिया की सक्रिय शक्ति बनी रहे, पर यह निर्धारित न किया जाए कि पिता ऐसा किस रीति से करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δύναται
  choice: कोई भी ... नहीं आ सकता
  rationale: यह स्वाभाविक हिन्दी में सार्वभौमिक निषेध और δύναται में निहित सामर्थ्य अथवा योग्यता—दोनों को स्पष्ट रखता है।
- source_word: ἐλθεῖν πρός με
  choice: मेरे पास ... आ
  rationale: यह यीशु की ओर आने की गति और यूहन्ना के प्रसंग में उसके संबंधपरक अर्थ को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ἐὰν μὴ
  choice: जब तक कि ... न
  rationale: इस नकारात्मक शर्त को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: मुझे भेजने वाला पिता
  rationale: संज्ञा-सहित कृदंत पदबंध को संक्षिप्त और स्वाभाविक हिन्दी में प्रस्तुत करता है तथा ‘पिता’ के व्यक्तिगत संबोधन को बनाए रखता है।
- source_word: ἑλκύσῃ
  choice: अपनी ओर न खींचे
  rationale: ‘खींचे’ यूनानी क्रिया की किसी को गति देने वाली शक्ति को बनाए रखता है। ‘अपनी ओर’ हिन्दी में आशय स्पष्ट करता है, क्योंकि आने की दिशा पिता द्वारा पुत्र की ओर खींचे जाने से प्रसंग में पहले ही निर्धारित है; यह अनुग्रह की कार्यविधि पर कोई संप्रदायगत निष्कर्ष नहीं थोपता।
- source_word: αὐτόν
  choice: उसे
  rationale: हिन्दी का ‘उसे’ एकवचन संदर्भ को सुरक्षित रखते हुए सामान्य रूप से स्त्री और पुरुष दोनों के लिए प्रयुक्त हो सकता है; इसलिए अलग लिंग-सूचक विस्तार आवश्यक नहीं है।
- source_word: κἀγὼ
  choice: और मैं
  rationale: καί और ἐγώ दोनों को सीधे व्यक्त करता है तथा हिन्दी में अनावश्यक अतिबल से बचता है।
- source_word: ἀναστήσω
  choice: जिला उठाऊँगा
  rationale: पुनरुत्थान के अर्थ और ‘उठाने’ की मूल क्रियात्मक छवि—दोनों को हिन्दी की परिचित बाइबलीय अभिव्यक्ति में सुरक्षित रखता है।
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: अंतिम दिन
  rationale: यह काल-संदर्भ और युगांत-संबंधी संकेत को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: उद्धार-संबंधी विवादित प्रसंग में ἑλκύσῃ का बल
  choice: अपनी ओर खींचे
  alternative: खींचकर लाए; घसीटे
  rationale: क्रिया कुछ प्रसंगों में बलपूर्वक खींचने का अर्थ रख सकती है, पर यहाँ ‘खींचे’ उसकी सक्रिय, गति-उत्पन्न करने वाली शक्ति को सुरक्षित रखते हुए यह तय नहीं करता कि पिता का खींचना किस रीति से कार्य करता है। अधिक बलवान संभावनाएँ पादटिप्पणी में दी गई हैं।
- issue: पुल्लिंग एकवचन αὐτόν का सामान्य प्रतिनिधिक प्रयोग
  choice: उसे
  alternative: उस व्यक्ति को
  rationale: हिन्दी में ‘उसे’ व्याकरणिक रूप से लिंग-चिह्नित नहीं है और यूनानी के एकवचन प्रतिनिधिक संदर्भ को सहजता से व्यक्त करता है; ‘उस व्यक्ति को’ अपेक्षाकृत भारी और व्याख्यात्मक होता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जिला उठाऊँगा’ पुनरुत्थान के लिए परिचित बाइबलीय पद है, जबकि शेष वाक्य-विन्यास वर्तमान मानक हिन्दी के अनुरूप है।
