  text: The Passover[a], the feast of the Jews, was near.
translation:
  language: hi
  text: फसह, यहूदियों[a] का पर्व, निकट था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया के लोगों का पर्व।” यूनानी शब्द प्रसंग के अनुसार सामान्य रूप से यहूदियों या विशेष रूप से यहूदिया के लोगों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है। हिन्दी में इस वाक्य को स्वाभाविक रूप से आरम्भ करने के लिए अलग से ‘अब’ या ‘और’ जोड़ना आवश्यक नहीं; प्रसंग ही कथानक की प्रगति व्यक्त करता है।
- source_word: ἐγγὺς
  choice: निकट था
  rationale: ἦν के साथ यह समय की निकटता बताता है; ‘निकट था’ स्पष्ट, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: πάσχα
  choice: फसह
  rationale: यह यहूदी पास्का-पर्व का प्रचलित हिन्दी बाइबलीय नाम है और यूनानी πάσχα का सटीक समतुल्य है।
- source_word: ἑορτὴ
  choice: पर्व
  rationale: ἑορτή धार्मिक उत्सव को सूचित करता है। ‘पर्व’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और उपासना-संबंधी अर्थ के अनुकूल है।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों का
  rationale: इस प्रसंग में फसह पूरे यहूदी समुदाय का धार्मिक पर्व है, केवल यहूदिया प्रदेश के निवासियों का नहीं। फिर भी यूनानी पद की सम्भव क्षेत्रीय व्याख्या पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: यूहन्ना के वर्णन में Ἰουδαίων का अर्थ
  choice: यहूदियों का
  alternative: यहूदिया-निवासियों का
  rationale: Ἰουδαῖοι प्रसंग के अनुसार सामान्यतः यहूदियों अथवा विशेषतः यहूदिया के लोगों को सूचित कर सकता है। यहाँ फसह का परिचय व्यापक यहूदी धार्मिक पर्व के रूप में दिया गया है, इसलिए ‘यहूदियों का’ मुख्य पाठ में अधिक उपयुक्त है; वास्तविक शाब्दिक सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। मूल यूनानी की विशेषणात्मक संरचना को स्वाभाविक हिन्दी क्रम में रखा गया है और किसी अनावश्यक आरम्भिक संयोजक को नहीं जोड़ा गया।
