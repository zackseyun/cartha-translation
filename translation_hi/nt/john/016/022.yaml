source:
  edition: SBLGNT
  text: καὶ ὑμεῖς οὖν ⸂νῦν μὲν λύπην⸃ ἔχετε· πάλιν δὲ ὄψομαι ὑμᾶς, καὶ χαρήσεται ὑμῶν ἡ καρδία, καὶ τὴν χαρὰν ὑμῶν οὐδεὶς ⸀αἴρει ἀφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: hi
  text: इसलिए अब तुम भी दुःखी हो; पर मैं तुम्हें फिर देखूँगा[a], और तुम्हारा हृदय आनन्दित होगा, और कोई भी तुम्हारा आनन्द तुमसे छीन न सकेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम मुझे फिर देखोगे।” यूनानी में अधिक शाब्दिक रूप से “मैं तुम्हें फिर देखूँगा” है, जो अपने शिष्यों के पास लौटने में यीशु की पहल पर बल दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले पद में प्रसव की उपमा से निकले निष्कर्ष को वर्तमान कथन से जोड़ता है।
- source_word: νῦν μὲν λύπην ἔχετε
  choice: अब तुम भी दुःखी हो
  rationale: λύπη के दुःख/शोक के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; μέν का विरोध आगे ‘पर’ से प्रकट होता है।
- source_word: πάλιν δὲ ὄψομαι ὑμᾶς
  choice: पर मैं तुम्हें फिर देखूँगा
  rationale: δέ वर्तमान दुःख और भावी मिलन के बीच विरोध दिखाता है; यूनानी में यीशु कर्ता और शिष्य कर्म हैं, इसलिए उसी व्याकरणिक दिशा को सुरक्षित रखा गया है।
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: तुम्हारा हृदय आनन्दित होगा
  rationale: ‘हृदय’ को बनाए रखते हुए χαρήσεται की क्रियात्मक प्रसन्नता को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τὴν χαρὰν ὑμῶν
  choice: तुम्हारा आनन्द
  rationale: यह निकटवर्ती ‘आनन्दित होगा’ के साथ मूल की शब्दगत कड़ी बनाए रखता है।
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: कोई भी ... तुमसे छीन न सकेगा
  rationale: संदर्भ की भावी दिशा और स्थायी आश्वासन को स्वाभाविक हिन्दी में व्यक्त करता है; ‘छीनना’ आनन्द को किसी से दूर कर देने के अर्थ में मुहावरेदार है।
theological_decisions:
- issue: भावी पुनर्मिलन में कर्ता और बलाघात
  choice: मैं तुम्हें फिर देखूँगा
  alternative: तुम मुझे फिर देखोगे
  rationale: यूनानी पाठ में प्रथम पुरुष कर्ता और द्वितीय पुरुष कर्म स्पष्ट हैं। इसे बनाए रखने से निकटवर्ती पदों के अनुसार सामंजस्य बैठाने से बचते हुए यीशु की पहल का संभावित संकेत सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए सहज, पर गरिमापूर्ण शैली। ‘तुम’ बहुवचन शिष्यों को संबोधित करता है। ‘आनन्दित’ और ‘आनन्द’ मूल के क्रिया-संज्ञा संबंध को बनाए रखते हैं।
