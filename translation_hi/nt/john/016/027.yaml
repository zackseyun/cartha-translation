base_translation:
  language: en
  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: hi
  text: आखिर पिता स्वयं तुमसे प्रेम करता है, क्योंकि तुमने मुझसे प्रेम किया है और विश्वास किया है कि मैं परमेश्वर के पास से आया हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं परमेश्वर से निकलकर आया हूँ”; यूनानी अभिव्यक्ति परमेश्वर की उपस्थिति से आने का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς ... ὁ πατὴρ
  choice: पिता स्वयं
  rationale: αὐτός का बलवाचक प्रयोग पिता के व्यक्तिगत प्रेम पर जोर देता है; ‘पिता स्वयं’ आधुनिक हिन्दी में स्वाभाविक रूप से यह बल बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है। हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: φιλεῖ
  choice: प्रेम करता है
  rationale: φιλέω यहाँ व्यक्तिगत स्नेह और प्रेम व्यक्त करता है। ‘प्रेम करता है’ संबंध की गहराई को बिना घटाए सामान्य और गरिमापूर्ण हिन्दी देता है।
- source_word: ὅτι ὑμεῖς ἐμὲ πεφιλήκατε
  choice: इसलिए कि तुमने मुझसे प्रेम किया है
  rationale: पहला ὅτι कारण बताता है; पूर्ण काल πεφιλήκατε के पूर्व आरम्भ हुए और वर्तमान में प्रासंगिक प्रेम को ‘प्रेम किया है’ से व्यक्त किया गया है। स्पष्ट ὑμεῖς का हल्का बल हिन्दी के ‘तुमने’ में पर्याप्त रूप से आता है।
- source_word: καὶ πεπιστεύκατε
  choice: और विश्वास किया है
  rationale: पूर्ण काल ऐसे विश्वास को सूचित करता है जो किया गया और अब भी प्रासंगिक है। अगले ὅτι-वाक्य के प्रस्तावात्मक विषय के कारण ‘विश्वास किया है’ उपयुक्त है।
- source_word: παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: मैं परमेश्वर के पास से आया हूँ
  rationale: παρά + संबंधकारक स्रोत अथवा किसी की उपस्थिति से आने का भाव दे सकता है, और ἐξῆλθον बाहर निकलने/आने को व्यक्त करता है। ‘परमेश्वर के पास से आया हूँ’ मूल, उपस्थिति और भेजे जाने के भावों को अनावश्यक रूप से किसी एक doctrinal व्याख्या में सीमित नहीं करता।
theological_decisions:
- issue: यीशु के कथन ‘मैं परमेश्वर के पास से आया हूँ’ का मसीह-संबंधी अर्थ
  choice: मूल और मिशन की भाषा को विस्तार दिए बिना ‘मैं परमेश्वर के पास से आया हूँ’
  alternative: ‘मैं परमेश्वर से निकला हूँ’ अथवा ‘मैं परमेश्वर की ओर से आया हूँ’
  rationale: यूनानी कथन यीशु के परमेश्वर से संबंध, मूल और आगमन को व्यक्त करता है, पर इस पद में उनका सैद्धान्तिक विवरण नहीं देता। चुना गया रूप इस धार्मिक गहराई और अर्थगत तनाव को खुला रखता है।
- issue: पिता के प्रेम का कारण और शर्त का प्रश्न
  choice: मूल पाठ के कारणसूचक संबंध को बनाए रखना
  alternative: ऐसा भावार्थ देना कि पिता का प्रेम शिष्यों के प्रेम के कारण अर्जित हुआ
  rationale: ὅτι स्पष्ट रूप से कारण बताता है, इसलिए उसे दबाया नहीं गया; फिर भी अनुवाद यह अतिरिक्त दावा नहीं करता कि शिष्यों ने अपने कर्म से पिता का प्रेम अर्जित किया। व्यापक संबंध को प्रसंग पर छोड़ा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और संवादोचित शैली रखी गई है। ‘तुम’ बहुवचन शिष्यों को संबोधित करता है। ‘पिता’ और ‘परमेश्वर’ यूहन्ना के प्रसंग में प्रचलित धार्मिक पदनामों के रूप में प्रयुक्त हैं।
