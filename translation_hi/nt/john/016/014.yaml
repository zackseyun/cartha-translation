id: JHN.16.14
reference: John 16:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐκεῖνος ἐμὲ δοξάσει, ὅτι ἐκ τοῦ ἐμοῦ λήμψεται καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/014.yaml
  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: hi
  text: वह मेरी महिमा करेगा, क्योंकि वह जो मेरा है उसमें से लेगा[a] और तुम्हें बताएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मेरा है उसमें से प्राप्त करेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: वह
  rationale: यह निकटवर्ती संदर्भ में सहायक अर्थात पवित्र आत्मा की ओर संकेत करता है। आधुनिक हिन्दी में व्यक्तिगत सर्वनाम स्वाभाविक है।
- source_word: ἐμὲ
  choice: मेरी
  rationale: δοξάζω के साथ हिन्दी की स्वाभाविक अभिव्यक्ति ‘मेरी महिमा करेगा’ है, जो यूनानी में कर्मकारक प्रथम-पुरुष सर्वनाम का अर्थ सुरक्षित रखती है।
- source_word: δοξάσει
  choice: महिमा करेगा
  rationale: यूहन्ना के प्रयोग में यह केवल सम्मान देने से अधिक, यीशु की महिमा प्रकट करने का धर्मवैचारिक भार रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ यह उस कारण को प्रस्तुत करता है कि आत्मा यीशु की महिमा कैसे और क्यों करेगा।
- source_word: ἐκ τοῦ ἐμοῦ
  choice: जो मेरा है उसमें से
  rationale: नपुंसकलिंग लेख के साथ अधिकारवाचक पद का व्यापक अर्थ बनाए रखता है और यह अनावश्यक रूप से निश्चित नहीं करता कि संकेत शिक्षा, अधिकार या प्रकाशन में से किसकी ओर है।
- source_word: λήμψεται
  choice: लेगा
  rationale: λαμβάνω का अर्थ ‘लेना’ या ‘प्राप्त करना’ दोनों हो सकता है। मुख्य पाठ में ‘लेगा’ सक्रिय संबंध को स्वाभाविक ढंग से व्यक्त करता है; ‘प्राप्त करेगा’ पादटिप्पणी में सुरक्षित है।
- source_word: ἀναγγελεῖ
  choice: बताएगा
  rationale: क्रिया का अर्थ सूचना देना, घोषित करना या प्रकट करना है। ‘बताएगा’ साधारण आधुनिक हिन्दी में स्पष्ट है और पूर्ववर्ती विषयवस्तु को अलग कर्म जोड़े बिना व्यक्त कर सकता है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: यह द्वितीय-पुरुष बहुवचन है और शिष्यों को संबोधित करता है; हिन्दी में ‘तुम्हें’ संदर्भानुकूल और स्वाभाविक है।
theological_decisions:
- issue: ‘ἐκ τοῦ ἐμοῦ λήμψεται’ में आत्मा और यीशु का संबंध
  choice: जो मेरा है उसमें से लेगा
  alternative: मुझसे प्राप्त करेगा / जो मेरा है उसमें से प्राप्त करेगा
  rationale: यह अनुवाद इस व्यापक अर्थ को सुरक्षित रखता है कि आत्मा वही संप्रेषित करता है जो पुत्र का है, पर वाक्य को बाद की किसी तकनीकी धर्मसैद्धांतिक व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘महिमा करेगा’ यूहन्ना के धर्मवैचारिक शब्द-भार को बनाए रखता है, जबकि ‘बताएगा’ संप्रेषण की क्रिया को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
