source:
  edition: SBLGNT
  text: ἀποσυναγώγους ποιήσουσιν ὑμᾶς· ἀλλ’ ἔρχεται ὥρα ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς δόξῃ λατρείαν προσφέρειν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: hi
  text: वे तुम्हें आराधनालयों से निकाल देंगे[a]। इतना ही नहीं, समय आ रहा है जब तुम्हें मार डालने वाला हर व्यक्ति समझेगा कि वह परमेश्वर को धार्मिक सेवा अर्पित कर रहा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हें आराधनालय से बहिष्कृत कर देंगे।”
    reason: lexical_alternative
  - marker: b
    text: या “वह परमेश्वर की उपासना कर रहा है” अथवा “वह परमेश्वर की धार्मिक सेवा कर रहा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους ποιήσουσιν ὑμᾶς
  choice: वे तुम्हें आराधनालयों से निकाल देंगे
  rationale: विधेय विशेषण ἀποσυναγώγους और ποιέω की कारक रचना आराधनालय-समुदाय से निष्कासन या बहिष्कार दर्शाती है। यह हिंदी में स्वाभाविक है और यूनानी बहुवचन को बनाए रखती है।
- source_word: ἀλλ’
  choice: इतना ही नहीं
  rationale: यहाँ ἀλλά साधारण विरोध से अधिक, पहले बताए उत्पीड़न को और तीव्र रूप में आगे बढ़ाता है।
- source_word: ἔρχεται ὥρα
  choice: वह समय आ रहा है
  rationale: शाब्दिक 'घड़ी' संभव है, पर इस प्रसंग में ὥρα किसी आने वाले काल या अवसर को दर्शाता है; आधुनिक हिंदी में 'समय' अर्थ को स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: तुम्हें मार डालने वाला हर व्यक्ति
  rationale: यह कृदन्तीय रचना सामान्य और सार्वभौमिक अभिव्यक्ति है; 'हर व्यक्ति' πᾶς की व्यापकता स्पष्ट रखता है।
- source_word: δόξῃ
  choice: समझेगा
  rationale: δοκέω यहाँ उत्पीड़क की निजी धारणा या मान्यता व्यक्त करता है, न कि वास्तविकता।
- source_word: λατρείαν προσφέρειν τῷ θεῷ
  choice: परमेश्वर की धार्मिक सेवा कर रहा है
  rationale: λατρεία परमेश्वर के प्रति धार्मिक या उपासना-संबंधी सेवा है और προσφέρειν उसे अर्पित/प्रस्तुत करने का भाव देता है। सहज हिंदी में 'धार्मिक सेवा कर रहा है' इस आशय को स्पष्ट रखता है।
theological_decisions:
- issue: हत्यारों की अपनी कार्रवाई के विषय में धार्मिक धारणा
  choice: समझेगा कि वह परमेश्वर की धार्मिक सेवा कर रहा है
  alternative: समझेगा कि वह परमेश्वर की उपासना कर रहा है
  rationale: अनुवाद उस भयावह विडंबना को बनाए रखता है कि उत्पीड़क हत्या को परमेश्वर के प्रति उचित धार्मिक कर्तव्य समझेगा; यह कथन उसकी सोच बताता है, उसे सही नहीं ठहराता।
- issue: πᾶς ὁ ἀποκτείνας का लिंग और व्यापकता
  choice: मार डालने वाला हर व्यक्ति ... वह
  alternative: जो कोई तुम्हें मार डालेगा ... वे
  rationale: यूनानी रूप व्याकरणतः पुल्लिंग एकवचन है, पर प्रतिनिधिक और सामान्य अर्थ रखता है। 'हर व्यक्ति' व्यापकता बनाए रखता है और एकवचन 'वह' वाक्य को स्वाभाविक रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन के लिए बहुवचन/आदररहित संदर्भानुकूल 'तुम्हें'; भाषा सरल किंतु गरिमापूर्ण है। 'आराधनालय' यहूदी synagogue के लिए परिचित बाइबिलीय शब्द है।
