source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: hi
  text: “मैं तुमसे सच-सच कहता हूँ कि तुम रोओगे और विलाप करोगे, पर संसार आनंदित होगा। तुम दुःखी होगे, लेकिन तुम्हारा दुःख आनंद में बदल जाएगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा दुःख आनंद बन जाएगा।”
    reason: εἰς χαρὰν γενήσεται का निकटतर, किंतु हिन्दी में कुछ कम मुहावरेदार, वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: यीशु के कथन की गंभीरता और निश्चितता दिखाने वाली पुनरुक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: यूहन्ना में बार-बार आने वाले सीधे संबोधन के सूत्र को निकटता से व्यक्त करता है।
- source_word: κλαύσετε
  choice: तुम रोओगे
  rationale: प्रत्यक्ष रूप से रोने का सामान्य और स्पष्ट हिन्दी वर्णन है।
- source_word: θρηνήσετε
  choice: विलाप करोगे
  rationale: κλαύσετε से भिन्न, शोक की मुखर अभिव्यक्ति का भाव बनाए रखता है।
- source_word: ὁ δὲ κόσμος
  choice: पर संसार
  rationale: δέ के विरोध को स्पष्ट करता है और κόσμος को व्याख्यात्मक विस्तार दिए बिना यूहन्ना के व्यापक शब्द के रूप में रखता है।
- source_word: χαρήσεται
  choice: आनंदित होगा
  rationale: चेलों के दुःख के विपरीत संसार की प्रसन्नता को स्पष्ट करता है और आगे के χαρά से अर्थगत संबंध बनाए रखता है।
- source_word: λυπηθήσεσθε
  choice: तुम दुःखी होगे
  rationale: भविष्यकालीन अवस्था को सहज हिन्दी में व्यक्त करता है और अगले λύπη के साथ शब्दगत संबंध रखता है।
- source_word: ἡ λύπη ὑμῶν
  choice: तुम्हारा दुःख
  rationale: λυπηθήσεσθε के साथ अर्थ और शब्द-रूप का संबंध सुरक्षित रखता है।
- source_word: εἰς χαρὰν γενήσεται
  choice: आनंद बन जाएगा
  rationale: εἰς और γενήσεται में निहित एक अवस्था से दूसरी अवस्था में होने वाले परिवर्तन को निकटता से व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना में κόσμος का प्रयोग
  choice: संसार
  alternative: अविश्वासी संसार; संसार की व्यवस्था
  rationale: यहाँ संसार चेलों के विपरीत आनंदित होने वाला समूह है, पर पद स्वयं उसके अर्थ को और सीमित नहीं करता। इसलिए व्याख्यात्मक धार्मिक विशेषण जोड़े बिना मूल व्यापकता और तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘विलाप’ मूल के दो अलग शोक-सूचक क्रियापदों का अंतर बनाए रखता है; ‘संसार’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
