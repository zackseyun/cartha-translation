  text: and concerning judgment[c][b][a], because the ruler of this world has been judged.
translation:
  language: hi
  text: और न्याय के विषय में, क्योंकि इस संसार के शासक[a] का न्याय हो चुका है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संभवतः शैतान की ओर संकेत है; यूहन्ना 12:31 और 14:30 से तुलना करें।
    reason: cross_reference
  - marker: b
    text: या, “वह न्याय के अधीन ठहर चुका है।” यूनानी पूर्णकाल बताता है कि न्याय हो चुका है और उसका प्रभाव बना हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: और न्याय के विषय में
  rationale: περί के साथ संबंधकारक विषय को सूचित करता है; δέ यहाँ क्रम को जोड़ता है, और κρίσις का सीधा तथा प्रसंगानुकूल अर्थ ‘न्याय’ है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι पहले कथन का कारण बताता है, इसलिए ‘क्योंकि’ स्वाभाविक रूप से कारणात्मक संबंध व्यक्त करता है।
- source_word: ὁ ἄρχων
  choice: शासक
  rationale: ἄρχων अधिकार रखने या शासन करने वाले व्यक्ति को दर्शाता है। आधुनिक हिन्दी में ‘शासक’ स्पष्ट है और ‘राजकुमार’ जैसा अनपेक्षित वंशगत अर्थ नहीं देता।
- source_word: τοῦ κόσμου τούτου
  choice: इस संसार का
  rationale: यूहन्ना में κόσμος के लिए ‘संसार’ मानक और स्वाभाविक हिन्दी है तथा यहाँ विद्रोही विश्व-व्यवस्था की ओर संकेत को बनाए रखता है।
- source_word: κέκριται
  choice: न्याय के अधीन ठहराया जा चुका है
  rationale: 'यह अनुवाद κρίνω के पूर्णकालिक कर्मवाच्य को व्यक्त करता है: न्याय किया जा चुका है और उसका परिणाम बना हुआ है। यह ‘दोषी ठहराया गया’ की अपेक्षा मूल शब्द की व्यापकता को भी सुरक्षित रखता है।'
theological_decisions:
- issue: ‘इस संसार का शासक’ किसे सूचित करता है
  choice: मुख्य पाठ में उपाधि को ज्यों का त्यों रखा गया है; शैतान का नाम नहीं जोड़ा गया।
  alternative: ‘शैतान, इस संसार का शासक’
  rationale: यूहन्ना 12:31 और 14:30 के आधार पर यह अभिव्यक्ति संभवतः शैतान को सूचित करती है, पर इस पद में नाम के बजाय उपाधि ही दी गई है। इसलिए पहचान को पादटिप्पणी में रखा गया है।
- issue: κέκριται का न्यायिक आशय
  choice: ‘न्याय के अधीन ठहराया जा चुका है’
  alternative: ‘दोषी ठहराया जा चुका है’
  rationale: प्रसंग में दोष-दंड का भाव निहित हो सकता है, पर κρίνω स्वयं व्यापक रूप से न्याय किए जाने को व्यक्त करता है। चुना गया रूप इस व्यापकता और पूर्ण हो चुके, अब भी प्रभावी परिणाम—दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘न्याय के अधीन ठहराया जा चुका है’ कुछ औपचारिक अवश्य है, पर न्यायिक अर्थ, कर्मवाच्य और यूनानी पूर्णकाल के स्थायी परिणाम को सामान्य हिन्दी में संतुलित ढंग से व्यक्त करता है।
