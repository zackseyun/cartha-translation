  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: hi
  text: “थोड़ी ही देर में तुम मुझे अब और नहीं देखोगे, और फिर थोड़ी ही देर में तुम मुझे देखोगे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यहाँ ‘देखने’ के लिए दो अलग क्रियाएँ हैं: पहले खंड में θεωρέω और दूसरे में ὁράω। इनके अर्थ में कुछ सूक्ष्म अंतर हो सकता है, पर इस पद में मुख्य विरोध समय का है, इसलिए दोनों का अनुवाद ‘देखना’ किया गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μικρὸν
  choice: थोड़ी देर बाद
  rationale: नपुंसकलिंग एकवचन विशेषण यहाँ क्रियाविशेषणीय मुहावरे के रूप में थोड़े समय को दर्शाता है। हिन्दी में ‘थोड़ी देर बाद’ आगामी अल्प अवधि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐκέτι
  choice: फिर नहीं
  rationale: यह वर्तमान स्थिति के समाप्त हो जाने का भाव देता है। इस भविष्य-संदर्भित कथन में ‘फिर नहीं’ सहज हिन्दी है और ‘अब और नहीं’ की अपेक्षा समय-क्रम को अधिक स्पष्ट रखता है।
- source_word: θεωρεῖτέ
  choice: देखोगे
  rationale: यद्यपि θεωρέω में ध्यान से देखने या निहारने की छाया हो सकती है, यहाँ सामान्य ‘देखना’ अर्थ पर्याप्त है और दूसरे दृष्टि-सूचक क्रिया-रूप के साथ अनावश्यक कठोर भेद नहीं बनाता।
- source_word: πάλιν
  choice: और फिर
  rationale: यह समय में अगली पुनरावृत्ति अथवा उलटाव को चिह्नित करता है; ‘और फिर’ यूनानी वाक्य की संतुलित क्रमबद्धता बनाए रखता है।
- source_word: ὄψεσθέ
  choice: तुम मुझे देखोगे
  rationale: ὁράω का यह भविष्य रूप भविष्य में देखने को व्यक्त करता है। ‘देखोगे’ स्वाभाविक है और पहले दृष्टि-सूचक क्रिया के साथ समानांतरता बनाए रखता है।
- source_word: με
  choice: मुझे
  rationale: यह यीशु की ओर संकेत करने वाला प्रत्यक्ष कर्म सर्वनाम है।
- source_word: καὶ
  choice: और
  rationale: दोनों खंडों को जोड़ने वाली यूनानी संरचना और उसका संतुलन हिन्दी में ‘और’ से सुरक्षित रहता है।
theological_decisions:
- issue: क्या θεωρέω और ὁράω को अलग-अलग हिन्दी क्रियाओं से व्यक्त किया जाए
  choice: मुख्य पाठ में दोनों के लिए ‘देखना’
  alternative: पहले के लिए ‘निहारना’ या ‘दृष्टि में पाना’ और दूसरे के लिए ‘देखना’
  rationale: यूहन्ना के प्रयोग में दोनों क्रियाओं के अर्थ पर्याप्त रूप से एक-दूसरे पर चढ़ते हैं। अलग हिन्दी शब्द चुनने से ऐसा निश्चित धर्मवैज्ञानिक भेद बन सकता है जिसे पद स्वयं स्पष्ट नहीं करता; मुख्य विरोध समय-संबंधी है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दो ‘थोड़ी देर’ वाले खंडों की समानांतर संरचना तथा समय-संबंधी तनाव को सुरक्षित रखा गया है।
