revisions:
- from: “थोड़ी देर बाद तुम मुझे फिर नहीं देखोगे; और फिर थोड़ी देर बाद तुम मुझे देखोगे।”[a]
  to: “थोड़ी ही देर में तुम मुझे अब और नहीं देखोगे, और फिर थोड़ी ही देर में तुम मुझे देखोगे।”[a]
  rationale: Revision is needed solely to remove the ambiguity of ‘फिर नहीं’ and to express οὐκέτι as ‘अब और नहीं’ (‘no longer’). The repeated ‘थोड़ी ही देर में’ keeps the source’s temporal parallelism without deciding the disputed referential implications of Jesus’ departure and reappearance.
