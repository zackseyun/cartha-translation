id: JHN.16.32
reference: John 16:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἰδοὺ ἔρχεται ὥρα ⸀καὶ ἐλήλυθεν ἵνα σκορπισθῆτε ἕκαστος εἰς τὰ ἴδια κἀμὲ μόνον ἀφῆτε· καὶ οὐκ εἰμὶ μόνος, ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: hi
  text: देखो, वह घड़ी आ रही है—और आ पहुँची है—जब तुम तितर-बितर हो जाओगे, हर एक अपने-अपने यहाँ[a], और मुझे अकेला छोड़ दोगे। फिर भी मैं अकेला नहीं हूँ, क्योंकि पिता मेरे साथ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हर एक अपने घर/स्थान/वस्तुओं की ओर।’ यूनानी अभिव्यक्ति किसी एक निश्चित जगह से अधिक व्यापक है और हर व्यक्ति से संबंधित बातों या उसके अपने क्षेत्र को सामान्य रूप से दर्शा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह शब्द श्रोताओं का ध्यान गंभीर घोषणा की ओर खींचता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके संभाषणात्मक बल को बनाए रखता है।
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: वह घड़ी आ रही है—और आ पहुँची है
  rationale: 'वर्तमान और पूर्णकाल के तनाव को बनाए रखा गया है: निर्णायक समय निकट भी है और एक अर्थ में पहले ही उपस्थित हो चुका है। ‘घड़ी’ यूहन्ना की समय-संबंधी भाषा को सुरक्षित रखती है और यहाँ साठ मिनट की अवधि नहीं, बल्कि निर्णायक अवसर को दर्शाती है।'
- source_word: ἵνα
  choice: जब
  rationale: इस प्रसंग में ἵνα आने वाली घड़ी की घटना या परिणाम का परिचय देता है। ‘जब’ हिन्दी में स्वाभाविक रूप से उसका समय-संबंधी भाव व्यक्त करता है।
- source_word: σκορπισθῆτε
  choice: तुम तितर-बितर हो जाओगे
  rationale: यह निष्क्रिय रूप चेलों के अलग-अलग हो जाने को व्यक्त करता है। ‘तितर-बितर’ बिखराव के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: हर एक अपने-अपने यहाँ
  rationale: यह वाक्यांश प्रत्येक व्यक्ति के अपने स्थान, घर, वस्तुओं या निजी क्षेत्र की ओर लौटने का व्यापक अर्थ रख सकता है। ‘अपने-अपने यहाँ’ संक्षिप्त और स्वाभाविक है; पादटिप्पणी मूल की अधिक व्यापक अर्थ-सीमा स्पष्ट करती है।
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: और मुझे अकेला छोड़ दोगे
  rationale: यह चेलों द्वारा यीशु को पीछे अकेला छोड़ देने को सीधे व्यक्त करता है, बिना ‘त्याग देना’ जैसे अधिक तीखे शब्द से अर्थ को बढ़ाए।
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: फिर भी मैं अकेला नहीं हूँ
  rationale: 'यहाँ καί पिछले कथन के साथ विरोध दिखाता है: चेले उन्हें अकेला छोड़ेंगे, फिर भी वे वास्तव में अकेले नहीं हैं।'
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: क्योंकि पिता मेरे साथ है
  rationale: ὅτι यीशु के अकेले न होने का कारण देता है। ‘पिता’ निश्चित संबंधपरक उपाधि को और ‘मेरे साथ है’ मूल कथन की सरलता को बनाए रखता है।
theological_decisions:
- issue: ἕκαστος εἰς τὰ ἴδια की अनिश्चित अर्थ-सीमा
  choice: हर एक अपने-अपने यहाँ
  alternative: हर एक अपने घर / अपनी-अपनी वस्तुओं या स्थान की ओर
  rationale: अनुवाद किसी एक निश्चित गंतव्य को मूल से अधिक स्पष्ट नहीं बनाता। मुख्य पाठ पठनीय है और पादटिप्पणी घर, स्थान, वस्तुओं तथा निजी क्षेत्र की संभावित अर्थ-सीमा को सुरक्षित रखती है।
- issue: चेलों द्वारा अकेला छोड़े जाने और पिता की उपस्थिति का संबंध
  choice: फिर भी मैं अकेला नहीं हूँ, क्योंकि पिता मेरे साथ है
  alternative: और मैं अकेला नहीं हूँ, क्योंकि पिता मेरे साथ है
  rationale: यह यीशु के चेलों द्वारा सचमुच अकेला छोड़े जाने और पिता की उपस्थिति के कारण उनके पूर्णतः अकेले न होने—दोनों कथनों के तनाव को बनाए रखता है, बिना आगे की कोई धर्मसैद्धान्तिक व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। डैश आने वाली और पहले से आ पहुँची ‘घड़ी’ के जानबूझकर रखे गए तनाव को स्पष्ट करते हैं। ‘अपने-अपने यहाँ’ सामान्य हिन्दी में बोधगम्य है, जबकि पादटिप्पणी मूल यूनानी की व्यापकता बताती है।
