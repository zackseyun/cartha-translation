  source_fidelity: The draft accurately preserves the partitive sense ('उसके चेलों में से कुछ'), reciprocal conversation, the temporal repetition, and the unresolved force of ὅτι through a suitable footnote. However, 'कहने लगे' adds an inceptive nuance ('began to say') not expressed by the aorist εἶπαν; a simple past verb is closer and fully natural.
  naturalness: The Hindi is clear and modern. Replacing 'कहने लगे' with 'ने ... कहा' improves both fidelity and idiomatic precision. The deliberately fragmentary final quoted clause is retained because it reflects the disciples' citing another puzzling element of Jesus' saying.
  terminology: '''चेले'' is standard, ''पिता'' appropriately reflects τὸν πατέρα without importing ''मेरे,'' and ''क्योंकि'' with a footnoted ''कि'' properly preserves the grammatical ambiguity of ὅτι.'
