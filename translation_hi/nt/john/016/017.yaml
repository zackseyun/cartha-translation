id: JHN.16.17
reference: John 16:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: hi
  text: इसलिए उसके चेलों में से कुछ ने आपस में कहा, “यह क्या है जो वह हमसे कह रहा है, ‘थोड़ी देर में तुम मुझे नहीं देखोगे, और फिर थोड़ी देर में तुम मुझे देखोगे’? और, ‘क्योंकि मैं पिता के पास जा रहा हूँ’?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और, ‘कि मैं पिता के पास जा रहा हूँ’?” यूनानी संयोजक को या तो उद्धृत कथन प्रस्तुत करने वाला अथवा कारणवाचक (‘क्योंकि’) समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से शिष्यों की प्रतिक्रिया का निष्कर्षात्मक संबंध दिखाता है; आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: उसके चेलों में से कुछ
  rationale: 'ἐκ का अंशवाचक भाव सुरक्षित रहता है: यह सभी नहीं, बल्कि चेलों में से कुछ थे।'
- source_word: πρὸς ἀλλήλους
  choice: आपस में
  rationale: पारस्परिक बातचीत को सहज और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: यह क्या है जो वह हमसे कह रहा है
  rationale: यूनानी प्रश्न की संरचना और चेलों की उलझन को बिना अर्थ की व्याख्या जोड़े सुरक्षित रखता है।
- source_word: Μικρὸν
  choice: थोड़ी देर में
  rationale: यहाँ शब्द का आशय समय की छोटी अवधि से है; हिन्दी वाक्य में ‘में’ आगामी घटनाओं के कालगत भाव को स्वाभाविक बनाता है।
- source_word: θεωρεῖτέ / ὄψεσθέ
  choice: देखोगे / देखोगे
  rationale: यूनानी में दो अलग क्रियाएँ हैं, पर इस प्रसंग में दोनों देखने का बोध देती हैं; एक ही हिन्दी क्रिया कथन की स्पष्ट समानांतरता बनाए रखती है।
- source_word: πάλιν
  choice: फिर
  rationale: पुनरावृत्ति अथवा उसके बाद पुनः होने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: क्योंकि मैं पिता के पास जा रहा हूँ
  rationale: ὅτι के संभावित कारणवाचक अर्थ को मुख्य पाठ में रखता है; कथनवाचक ‘कि’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: τὸν πατέρα
  choice: पिता
  rationale: यूनानी में ‘पिता’ है, ‘मेरे पिता’ नहीं; हिन्दी में उपाधि के रूप में निश्चितता स्वाभाविक रूप से व्यक्त होती है।
theological_decisions:
- issue: यीशु के थोड़ी देर के लिए न दिखने और फिर दिखाई देने का संकेत
  choice: मुख्य पाठ इस संकेत का अर्थ अनिर्धारित रखता है।
  alternative: इसे मृत्यु और पुनरुत्थान, स्वर्गारोहण और आत्मिक उपस्थिति, या पुनरुत्थान के बाद के दर्शनों का स्पष्ट संकेत मानना।
  rationale: इस पद में चेले स्वयं उलझन में हैं और संदर्भ का समाधान यहाँ नहीं दिया गया; इसलिए अनुवाद किसी एक धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करता।
- issue: ὅτι का कारणवाचक अथवा कथनवाचक अर्थ
  choice: मुख्य पाठ में ‘क्योंकि’
  alternative: ‘कि मैं पिता के पास जा रहा हूँ’
  rationale: दोनों व्याकरणिक समझ सम्भव हैं। मुख्य पाठ कारणवाचक संबंध रखता है और पादटिप्पणी दूसरी वास्तविक सम्भावना दर्ज करती है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चेले’ प्रचलित बाइबलीय शब्द है; वाक्यरचना मूल की प्रश्नात्मक उलझन और उद्धरणों की परतों को बनाए रखती है।
