  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα λελάληκα ὑμῖν ἵνα ὅταν ἔλθῃ ἡ ὥρα ⸀αὐτῶν μνημονεύητε ⸁αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν. Ταῦτα δὲ ὑμῖν ἐξ ἀρχῆς οὐκ εἶπον, ὅτι μεθ’ ὑμῶν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: hi
  text: परन्तु मैंने ये बातें तुमसे इसलिए कही हैं कि जब उनका समय आए,[a] तब तुम्हें याद रहे कि मैंने तुमसे उनके विषय में कहा था। पर मैंने ये बातें आरम्भ से तुमसे नहीं कहीं, क्योंकि मैं तुम्हारे साथ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “जब उनकी घड़ी आए, तब तुम उन्हें स्मरण करो कि मैंने तुमसे कहा था।” यूनानी पाठ में “उनकी/उन्हें” (αὐτῶν) दो बार आया है, जिसे सहज हिन्दी में ठीक उसी प्रकार रखना कठिन है।'
    reason: मूल यूनानी की सर्वनाम-संबंधी अस्पष्टता और अधिक शाब्दिक विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: λελάληκα
  choice: मैंने ... कही हैं
  rationale: पूर्ण काल पहले कही गई बातों की वर्तमान प्रासंगिकता दिखाता है; हिन्दी का पूर्ण रूप इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक पद पीछे दी गई चेतावनियों की ओर संकेत करता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἵνα
  choice: इसलिए ... कि
  rationale: यह उद्देश्य को व्यक्त करता है और हिन्दी में ‘ताकि’ के समान स्वाभाविक प्रयोजन-सूचक रचना है।
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: जब उनका समय आए
  rationale: भविष्य में आने वाले नियत अवसर का भाव सुरक्षित रहता है। ‘समय’ हिन्दी में ‘घड़ी’ की अपेक्षा अधिक स्वाभाविक है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: μνημονεύητε αὐτῶν
  choice: तुम्हें याद आए ... उनके विषय में
  rationale: μνημονεύω के साथ संबंधकारक αὐτῶν को हिन्दी में ‘उनके विषय में’ द्वारा व्यक्त किया गया है; इससे स्रोत-पाठ का दूसरा सर्वनाम भी बना रहता है और वाक्य स्वाभाविक रहता है।
- source_word: ἐξ ἀρχῆς
  choice: आरम्भ से
  rationale: यह समय के शुरुआती बिंदु से अब तक का भाव सीधे और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: μεθ’ ὑμῶν ἤμην
  choice: मैं तुम्हारे साथ था
  rationale: मूल के संबंधपरक और स्थानगत भाव का सीधा, स्वाभाविक अनुवाद है।
theological_decisions:
- issue: दोनों αὐτῶν का संदर्भ और वाक्य में उनका प्रतिनिधित्व
  choice: पहले को ‘उनका समय’ और दूसरे को ‘उनके विषय में’ के रूप में रखा गया है।
  alternative: दूसरे αὐτῶν को हिन्दी में न दोहराकर केवल ‘तुम्हें याद आए कि मैंने तुमसे कहा था’ कहा जा सकता है; या दोनों को अधिक शाब्दिक ढंग से ‘उनकी घड़ी ... उन्हें याद करो’ कहा जा सकता है।
  rationale: SBLGNT में αὐτῶν दो बार है। मुख्य पाठ दोनों को दर्शाता है, पर उनके संदर्भ को किसी एक व्याख्या तक सीमित नहीं करता; पादटिप्पणी स्रोत की कठिन और अधिक शाब्दिक रचना स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठकों के लिए सहज, पर गरिमापूर्ण शैली। ‘तुम’ यीशु द्वारा अपने शिष्यों को किए गए बहुवचन संबोधन को दर्शाता है।
