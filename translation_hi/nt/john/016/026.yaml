language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐν τῷ ὀνόματί μου αἰτήσεσθε, καὶ οὐ λέγω ὑμῖν ὅτι ἐγὼ ἐρωτήσω τὸν πατέρα περὶ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: hi
  text: उस दिन तुम मेरे नाम से माँगोगे, और मैं तुमसे यह नहीं कहता कि मैं तुम्हारे विषय में[a] पिता से विनती करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारी ओर से’ अथवा ‘तुम्हारे लिए’।
    reason: lexical_alternative
  - marker: b
    text: 'इस पद में यूनानी पाठ ‘माँगने’ के लिए दो अलग क्रियाएँ प्रयोग करता है: शिष्यों के माँगने के लिए αἰτέω और यीशु के पिता से विनती करने के लिए ἐρωτάω।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: उस दिन
  rationale: यह कालवाचक पदबंध है। ‘उस दिन’ स्वाभाविक आधुनिक हिन्दी है और ἐκείνῃ के संकेतात्मक बल को बनाए रखता है।
- source_word: ἐν τῷ ὀνόματί μου
  choice: मेरे नाम से
  rationale: यह यूहन्ना में प्रयुक्त स्थापित अभिव्यक्ति है, जो यीशु के व्यक्तित्व और अधिकार के संबंध में माँगने को व्यक्त करती है; इसे व्याख्यात्मक रूप से विस्तृत नहीं किया गया।
- source_word: αἰτήσεσθε
  choice: तुम ... माँगोगे
  rationale: भविष्यकाल, मध्यम वाच्य, द्वितीय पुरुष बहुवचन। प्रार्थना के संदर्भ में ‘माँगना’ स्वाभाविक है और अगले क्रियापद से हिन्दी में उपयोगी भेद भी बनाए रखता है।
- source_word: οὐ λέγω ὑμῖν ὅτι
  choice: मैं तुमसे यह नहीं कहता कि
  rationale: ὅτι कथन की विषय-वस्तु आरंभ करता है, कारण नहीं बताता। वर्तमानकाल को सीधे और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: ἐρωτήσω
  choice: मैं ... विनती करूँगा
  rationale: पिता से यीशु के अनुरोध के लिए ‘विनती करना’ प्रसंगानुकूल है और उसी पद में αἰτέω तथा ἐρωτάω के वास्तविक यूनानी क्रियाभेद को सहज हिन्दी में दर्शाता है।
- source_word: τὸν πατέρα
  choice: पिता
  rationale: यूनानी में स्पष्ट संबंधवाचक सर्वनाम नहीं है; ‘पिता’ यूहन्ना की अभिव्यक्ति को बिना ‘मेरे’ जोड़े सुरक्षित रखता है।
- source_word: περὶ ὑμῶν
  choice: तुम्हारे विषय में
  rationale: περί के साथ संबंधकारक का निकटतम अर्थ ‘के विषय में’ है; प्रसंग में ‘तुम्हारी ओर से’ का मध्यस्थतापरक भाव संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: क्या यीशु भविष्य में अपनी हर प्रकार की मध्यस्थता से इनकार करते हैं, या इस प्रसंग में केवल यह नहीं कह रहे कि शिष्यों की पिता तक पहुँच उनके अनुरोध पर निर्भर है?
  choice: 'कथन को सीधे रखा गया है: ‘मैं तुमसे यह नहीं कहता कि...’, बिना सार्वकालिक निषेध जोड़े।'
  alternative: ‘मैं तुम्हारे लिए पिता से विनती नहीं करूँगा’ जैसा अधिक निर्णायक और व्याख्यात्मक अनुवाद।
  rationale: तात्कालिक संदर्भ शिष्यों के यीशु के नाम से माँगने पर बल देता है, जबकि अन्य नए नियम के पाठ यीशु की पैरवी या मध्यस्थता की बात करते हैं। अनुवाद इस तनाव को हल किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में बहुवचन ‘तुम’; शैली स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। विरामचिह्न को हिन्दी वाक्य की पूर्णता के अनुसार रखा गया है।
