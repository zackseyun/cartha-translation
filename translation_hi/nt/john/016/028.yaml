source:
  edition: SBLGNT
  text: ἐξῆλθον ⸀ἐκ τοῦ πατρὸς καὶ ἐλήλυθα εἰς τὸν κόσμον· πάλιν ἀφίημι τὸν κόσμον καὶ πορεύομαι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: hi
  text: मैं पिता से निकलकर आया[a] और संसार में आया हूँ। फिर मैं संसार को छोड़ रहा हूँ और पिता के पास जा रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं पिता से आया।”
    reason: ‘निकलकर आया’ ἐξῆλθον ἐκ की गति को अधिक स्पष्ट करता है; ‘पिता से आया’ अधिक सहज विकल्प है और स्रोत/उद्गम का मूल अर्थ बनाए रखता है।
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: मैं पिता से निकलकर आया
  rationale: ἐξέρχομαι के साथ ἐκ स्रोत और उससे बाहर आने की गति दोनों व्यक्त करता है। ‘निकलकर आया’ इस बल को बनाए रखता है और हिन्दी में स्वाभाविक है; केवल ‘आया’ अधिक सहज है, पर गति की सूक्ष्मता कम कर देता है।
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: संसार में आया हूँ
  rationale: पूर्णकालिक ἐλήλυθα को ‘आया हूँ’ से पूर्ण हुई घटना और उसकी वर्तमान प्रासंगिकता सहित व्यक्त किया गया है; εἰς की प्रवेश-दिशा ‘में’ से स्पष्ट होती है।
- source_word: πάλιν
  choice: अब फिर
  rationale: πάλιν अगले, प्रत्यावर्ती चरण को चिह्नित करता है। ‘अब फिर’ पिता से संसार में आने और संसार से पिता के पास जाने की समांतर गति को सहज हिन्दी में सामने लाता है।
- source_word: ἀφίημι τὸν κόσμον
  choice: मैं संसार को छोड़ रहा हूँ
  rationale: वर्तमान काल यहाँ निकट भविष्य की घटना को वर्तमान/आसन्न रूप में रखता है। ‘छोड़ रहा हूँ’ इस भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: पिता के पास जा रहा हूँ
  rationale: πορεύομαι गति को और πρός लक्ष्य की दिशा को व्यक्त करता है। ‘पिता के पास’ केवल दिशा नहीं, व्यक्ति के निकट जाने का स्वाभाविक हिन्दी रूप है, बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
theological_decisions:
- issue: यीशु का पिता से आना और पिता के पास लौटना
  choice: पिता से निकलकर आने और पिता के पास जाने के कथन को सीधे बनाए रखा गया है।
  alternative: इसे केवल ‘परमेश्वर की ओर से भेजा गया’ कहना, या पूर्व-अस्तित्व और देहधारण की विस्तृत व्याख्या अनुवाद में जोड़ना।
  rationale: यूनानी पाठ पिता को यीशु के आने का स्रोत और उसके जाने का लक्ष्य बताता है। अनुवाद इस प्रबल कथन को सुरक्षित रखता है, पर पद से बाहर की सिद्धान्तगत व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘संसार’, ‘पिता’ और ‘पिता के पास’ यूहन्ना की परिचित शब्दावली तथा पद की समांतर गति को बनाए रखते हैं।
