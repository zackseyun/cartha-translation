source:
  edition: SBLGNT
  text: νῦν οἴδαμεν ὅτι οἶδας πάντα καὶ οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ· ἐν τούτῳ πιστεύομεν ὅτι ἀπὸ θεοῦ ἐξῆλθες.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: hi
  text: अब हम जानते हैं कि आप सब कुछ जानते हैं और आपको किसी के आपसे प्रश्न करने की आवश्यकता नहीं है। इसी से हम विश्वास करते हैं कि आप परमेश्वर से आए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν
  choice: अब
  rationale: यह समयसूचक क्रियाविशेषण शिष्यों की वर्तमान समझ को व्यक्त करता है; ‘अब’ स्वाभाविक और संक्षिप्त है।
- source_word: οἴδαμεν
  choice: हम जानते हैं
  rationale: οἶδα का रूप पूर्णकालिक होते हुए भी यहाँ वर्तमान अर्थ रखता है; हिन्दी में साधारण वर्तमान स्वाभाविक है।
- source_word: οἶδας πάντα
  choice: आप सब कुछ जानते हैं
  rationale: πάντα की व्यापकता को ‘सब कुछ’ सहज आधुनिक हिन्दी में ठीक प्रकार व्यक्त करता है।
- source_word: οὐ χρείαν ἔχεις
  choice: आपको इसकी आवश्यकता नहीं
  rationale: यह यूनानी संज्ञात्मक अभिव्यक्ति की आवश्यकता के भाव को बनाए रखते हुए हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἵνα τίς σε ἐρωτᾷ
  choice: कि कोई आपसे प्रश्न करे
  rationale: ἐρωτάω का अर्थ ‘पूछना’ या ‘प्रश्न करना’ हो सकता है। प्रसंग यीशु के ज्ञान और शिष्यों की अनकही बात से जुड़ा है, इसलिए ‘प्रश्न करे’ उपयुक्त है और विरोधी पूछताछ का अनावश्यक भाव नहीं जोड़ता।
- source_word: ἐν τούτῳ
  choice: इसी से
  rationale: यह शिष्यों के निष्कर्ष के आधार या प्रमाण की ओर संकेत करता है; ‘इसी से’ हिन्दी में इस संबंध को स्पष्ट करता है।
- source_word: πιστεύομεν
  choice: हम विश्वास करते हैं
  rationale: इस स्वीकारोक्तिपरक प्रसंग में πιστεύω का सीधा और स्थापित हिन्दी रूप ‘विश्वास करते हैं’ है।
- source_word: ἀπὸ θεοῦ
  choice: परमेश्वर से
  rationale: मूल पाठ स्पष्टतः ‘परमेश्वर से’ कहता है; ‘पिता से’ कहना इस पद के शब्दों से अधिक विशिष्ट होता।
- source_word: ἐξῆλθες
  choice: आप आए हैं
  rationale: यहाँ क्रिया यीशु के दिव्य उद्गम और मिशन से संबंधित है। ‘परमेश्वर से आए हैं’ स्वाभाविक हिन्दी है और यूनानी पूर्ण भूत घटना के वर्तमान-संबंधित प्रभाव को भी व्यक्त करती है।
theological_decisions:
- issue: ‘आप सब कुछ जानते हैं’ का मसीह-विषयक बल
  choice: शिष्यों के कथन को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों रखा गया है।
  alternative: ऐसी व्याख्यात्मक भाषा जोड़ना जो सर्वज्ञता को स्पष्ट doctrinal कथन बना दे।
  rationale: पद यीशु के ज्ञान के विषय में शिष्यों की स्वीकारोक्ति प्रस्तुत करता है। अनुवाद को इसकी धार्मिक गंभीरता बनाए रखनी चाहिए, पर मूल में निहित बात से आगे कोई सिद्धान्तगत विस्तार नहीं जोड़ना चाहिए।
- issue: ἀπὸ θεοῦ ἐξῆλθες का अर्थ
  choice: आप परमेश्वर से आए हैं
  alternative: आप पिता से आए हैं / आप परमेश्वर में से निकलकर आए हैं
  rationale: सीधा अनुवाद दिव्य उद्गम या प्रेषण के दावे को सुरक्षित रखता है। ‘पिता’ निकटवर्ती प्रसंग से संभव सामंजस्य है, पर इस पद में θεοῦ का अनुवाद ‘परमेश्वर’ ही होना चाहिए; ‘में से निकलकर’ अनावश्यक तत्वमीमांसक विशिष्टता जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरवाची ‘आप’ का प्रयोग किया गया है। भाषा गरिमामय पर सामान्य पाठक के लिए सहज रखी गई है। ‘प्रश्न करे’ ἐρωτᾷ की प्रसंगानुकूल ध्वनि देता है; चूँकि मुख्य पाठ में पर्याप्त अर्थ-स्पष्टता है, अलग पादटिप्पणी आवश्यक नहीं मानी गई।
