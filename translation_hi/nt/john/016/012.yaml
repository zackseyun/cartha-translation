base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: hi
  text: मुझे तुमसे अभी भी बहुत-सी बातें कहनी हैं, पर तुम इस समय उन्हें सह नहीं सकते[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुम उन्हें इस समय उठा नहीं सकते’ अथवा ‘उन्हें इस समय झेल नहीं सकते।’ यूनानी क्रिया का अर्थ उठाना, सहना या झेलना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι
  choice: अभी
  rationale: यह बताता है कि यीशु के पास इस समय आगे कहने के लिए और बातें शेष हैं; वाक्य के अंत में ἄρτι के लिए ‘इस समय’ रखकर दोनों समय-सूचक शब्दों का भेद बनाए रखा गया है।
- source_word: πολλὰ
  choice: बहुत-सी बातें
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; ‘बहुत-सी बातें’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἔχω ὑμῖν λέγειν
  choice: मुझे तुमसे … कहनी हैं
  rationale: ग्रीक संरचना का अर्थ है कि बहुत कुछ कहना अभी बाकी है। हिन्दी में ‘मुझे तुमसे … कहनी हैं’ स्वाभाविक ढंग से यही भाव व्यक्त करता है; ὑμῖν के लिए ‘तुमसे’ बोलचाल की मानक हिन्दी में उपयुक्त है।
- source_word: ἀλλ’
  choice: पर
  rationale: यह सीधे विरोध को व्यक्त करने वाला स्वाभाविक आधुनिक हिन्दी संयोजक है।
- source_word: οὐ δύνασθε
  choice: नहीं सकते
  rationale: यह सामर्थ्य की स्पष्ट नकारात्मकता को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: βαστάζειν
  choice: सहना
  rationale: यहाँ क्रिया रूपक रूप में किसी बात का भार उठाने या उसे सह पाने की क्षमता बताती है। ‘सहना’ केवल बौद्धिक समझ तक अर्थ को सीमित नहीं करता और भार/सहनशीलता का भाव बनाए रखता है।
- source_word: ἄρτι
  choice: इस समय
  rationale: यह शिष्यों की असमर्थता को वर्तमान समय तक सीमित करता है और आगे आने वाले परिवर्तन के लिए स्थान छोड़ता है।
theological_decisions:
- issue: βαστάζειν के अनुसार शिष्यों की वर्तमान असमर्थता का स्वरूप
  choice: शिष्य इस समय आगे की बातों का भार सह नहीं सकते।
  alternative: शिष्य इस समय उन बातों को पूरी तरह समझ नहीं सकते।
  rationale: मूल क्रिया में उठाने, सहने और झेलने का अर्थ-क्षेत्र है। ‘सह नहीं सकते’ बौद्धिक, भावनात्मक और आत्मिक क्षमता के बीच की मूल अस्पष्टता को बनाए रखता है, जबकि ‘समझ नहीं सकते’ अर्थ को केवल बौद्धिक ग्रहण तक सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक संवाद के अनुकूल। ‘तुम’ बहुवचन शिष्यों को संबोधित करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘सहना’ मूल क्रिया के प्रमुख रूपक और उसकी अर्थगत व्यापकता को पर्याप्त रूप से बनाए रखता है।
