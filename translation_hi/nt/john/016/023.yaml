- from: और उस दिन तुम मुझसे कोई प्रश्न नहीं पूछोगे। मैं तुमसे सच-सच कहता हूँ, तुम पिता से जो कुछ मेरे नाम में माँगोगे, वह तुम्हें देगा।
  to: और उस दिन तुम मुझसे कुछ भी नहीं पूछोगे। मैं तुमसे सच-सच कहता हूँ, तुम पिता से जो कुछ मेरे नाम में माँगोगे[a], वह तुम्हें देगा।
  rationale: The revision retains the natural Hindi reading in which ‘मेरे नाम में’ modifies the request, while a footnote records the alternative permitted by the supplied Greek word order. It also broadens ‘प्रश्न’ to ‘कुछ भी,’ preserving the unqualified negation while maintaining the natural contrast between asking Jesus and petitioning the Father.
