reference: John 16:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: hi
  text: और उस दिन तुम मुझसे कुछ भी नहीं पूछोगे। मैं तुमसे सच-सच कहता हूँ, तुम पिता से जो कुछ मेरे नाम में माँगोगे[a], वह तुम्हें देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्य में ‘मेरे नाम में’ अंत में आता है; इसका संबंध ‘वह तुम्हें देगा’ से भी समझा जा सकता है: ‘वह तुम्हें मेरे नाम में देगा।’'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: उस दिन
  rationale: यह स्वाभाविक आधुनिक हिन्दी का कालवाचक प्रयोग है और यूहन्ना के प्रसंग में उस भावी निर्णायक समय की ओर संकेत बनाए रखता है।
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: तुम मुझसे कोई प्रश्न नहीं पूछोगे
  rationale: ἐρωτάω यहाँ यीशु से प्रश्न पूछने के अर्थ में समझा गया है। ‘प्रश्न नहीं पूछोगे’ अगले αἰτέω के प्रार्थनापूर्ण ‘माँगोगे’ से स्रोत में उपस्थित भेद को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: पुनरुक्ति का बल बनाए रखते हुए यह आधुनिक हिन्दी में यीशु की गंभीर उद्घोषणा को स्पष्ट और परिचित ढंग से व्यक्त करता है।
- source_word: ἄν τι αἰτήσητε
  choice: जो कुछ ... माँगोगे
  rationale: यह अनिश्चित व्यापकता को सहज हिन्दी में व्यक्त करता है; αἰτέω की याचनात्मक प्रकृति के लिए ‘माँगना’ उपयुक्त है।
- source_word: τὸν πατέρα
  choice: पिता से
  rationale: यूनानी में केवल ‘पिता’ है; कोई अतिरिक्त संबंधवाचक सर्वनाम नहीं जोड़ा गया। हिन्दी में माँगने के संबोधन के लिए ‘से’ स्वाभाविक है।
- source_word: δώσει ὑμῖν
  choice: वह तुम्हें देगा
  rationale: कर्ता यूनानी क्रिया में निहित है और निकटतम संदर्भ में पिता है। वस्तु पहले के ‘जो कुछ’ से स्पष्ट है, इसलिए उसे दोहराना आवश्यक नहीं।
- source_word: ἐν τῷ ὀνόματί μου
  choice: मेरे नाम में
  rationale: यह यूहन्ना की महत्वपूर्ण अभिव्यक्ति का औपचारिक रूप सुरक्षित रखता है और उसकी प्रतिनिधिक अथवा संबंधपरक शक्ति को किसी एक व्याख्या तक सीमित नहीं करता।
theological_decisions:
- issue: ἐρωτάω और αἰτέω के बीच भेद
  choice: पहले को ‘प्रश्न पूछोगे’ और दूसरे को ‘माँगोगे’ अनूदित किया गया।
  alternative: दोनों स्थानों पर ‘पूछना’ अथवा ‘माँगना’ प्रयोग करना।
  rationale: निकटवर्ती प्रसंग में शिष्य यीशु से बात का अर्थ पूछना चाहते हैं; इसलिए पहला पद प्रश्न करने को और दूसरा पिता से याचना करने को व्यक्त करता है। इससे वास्तविक शाब्दिक भेद बिना कृत्रिमता के बचता है।
- issue: ‘मेरे नाम में’ माँगने की प्रतिज्ञा का विस्तार
  choice: वचन को बिना अतिरिक्त शर्त जोड़े सीधे रखा गया।
  alternative: ‘मेरी इच्छा के अनुसार’ जैसी व्याख्यात्मक सीमा जोड़ना।
  rationale: व्यापक यूहन्नाई संदर्भ व्याख्या में सहायक हो सकता है, पर इस पद में ऐसी शर्त स्पष्ट रूप से नहीं है; अनुवाद को धर्मवैचारिक तनाव बनाए रखना चाहिए।
- issue: 'वाक्यांशों का पाठगत स्थान: ἄν τι और δώσει ὑμῖν ἐν τῷ ὀνόματί μου'
  choice: SBLGNT के मुख्य पाठ के अनुसार ‘जो कुछ ... मेरे नाम में माँगोगे, वह तुम्हें देगा’ रखा गया।
  alternative: ‘तुम पिता से जो कुछ माँगोगे, वह मेरे नाम में तुम्हें देगा’—जिसमें ‘मेरे नाम में’ को देने की क्रिया से जोड़ा जाए।
  rationale: प्रदत्त मुख्य पाठ ‘मेरे नाम में’ को δώσει ὑμῖν के बाद रखता है, जिससे उसके संबंध में कुछ वाक्यगत अस्पष्टता संभव है; फिर भी प्रचलित यूहन्नाई प्रयोग और स्वाभाविक हिन्दी इसे माँगने के साथ जोड़ते हैं। वैकल्पिक संबंध को चुपचाप सिद्धांत नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सच-सच’ यूहन्ना की विशिष्ट द्विगुणित उद्घोषणा को बनाए रखता है। ‘प्रश्न पूछोगे’ और ‘माँगोगे’ का चयन हिन्दी में यूनानी क्रियाओं का अर्थभेद मुख्य पाठ में ही स्वाभाविक रूप से व्यक्त करता है, इसलिए फुटनोट आवश्यक नहीं समझा गया।
