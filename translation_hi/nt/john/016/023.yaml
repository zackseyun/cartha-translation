review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal clause, the emphatic double ἀμήν, the contrast between asking Jesus and petitioning the Father, and the implied object of ‘give.’ However, it presents ‘मेरे नाम में’ only as modifying ‘माँगोगे,’ although in the supplied SBLGNT wording the phrase stands at the end after ‘he will give to you.’ Its syntactic attachment is therefore not to be silently fixed in the text without documenting the viable alternative.
  naturalness: The Hindi is generally clear and suitably dignified. ‘मुझसे कोई प्रश्न नहीं पूछोगे’ is understandable, but ‘मुझसे कुछ भी नहीं पूछोगे’ is more idiomatic and preserves the broader object οὐδέν without restricting it to formal ‘questions.’
  terminology: ‘पिता,’ ‘मेरे नाम में,’ and ‘माँगोगे’ are appropriate. Rendering the first verb with ‘पूछोगे’ and the second with ‘माँगोगे’ naturally reflects the lexical contrast without overstating it.
  issues:
  - severity: medium
    issue: The attachment of ‘मेरे नाम में’ is resolved in the main text without a note.
    rationale: In the supplied Greek text, ἐν τῷ ὀνόματί μου follows δώσει ὑμῖν. While attaching it to the request is idiomatic and contextually familiar, the final placement permits an alternative connection with ‘give.’ A footnote is needed to preserve this source-level ambiguity.
  - severity: low
    issue: ‘कोई प्रश्न नहीं पूछोगे’ narrows the object of ἐμὲ οὐκ ἐρωτήσετε οὐδέν.
    rationale: οὐδέν means ‘nothing/anything,’ not specifically a formal question. ‘मुझसे कुछ भी नहीं पूछोगे’ is natural Hindi and retains the breadth of the expression.
  revised_text: और उस दिन तुम मुझसे कुछ भी नहीं पूछोगे। मैं तुमसे सच-सच कहता हूँ, तुम पिता से जो कुछ मेरे नाम में माँगोगे[a], वह तुम्हें देगा।
