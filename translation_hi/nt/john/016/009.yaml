  text: concerning sin[a], because they do not believe in me;
translation:
  language: hi
  text: पाप के विषय में[a], क्योंकि वे मुझ पर विश्वास नहीं करते;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पाप के विषय में कि वे मुझ पर विश्वास नहीं करते।’ यूनानी संयोजक का अनुवाद दोनों प्रकार से हो सकता है, पर इस संदर्भ में ‘क्योंकि’ उसके व्याख्यात्मक कारण-भाव को अधिक स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: के विषय में
  rationale: यह पद उस विषय का परिचय देता है जिसके संबंध में पवित्र आत्मा दोष सिद्ध करेगा; यह पद 10–11 की समानांतर रचना के लिए भी स्वाभाविक है।
- source_word: ἁμαρτίας
  choice: पाप
  rationale: एकवचन भाववाचक संज्ञा को सामान्य श्रेणी के रूप में रखा गया है; इसे ‘पापों’ या ‘पापमयता’ बनाकर अर्थ नहीं बढ़ाया गया।
- source_word: μέν
  choice: —
  rationale: यह आगे आने वाली सूची के पहले घटक को चिह्नित करता है। हिन्दी में इसकी अलग अभिव्यक्ति आवश्यक नहीं; समानांतर वाक्य-रचना इसका कार्य निभाती है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ संयोजक पहले कथन का कारण अथवा व्याख्यात्मक आधार बताता है। ‘क्योंकि’ इस संबंध को आधुनिक हिन्दी में स्पष्ट रखता है, जबकि ‘कि’ भी व्याकरणतः संभव है।
- source_word: οὐ πιστεύουσιν
  choice: वे ... विश्वास नहीं करते
  rationale: वर्तमानकालीन बहुवचन क्रिया उनके अविश्वास की विद्यमान स्थिति बताती है।
- source_word: εἰς ἐμέ
  choice: मुझ पर
  rationale: πιστεύω εἰς यीशु की ओर निर्देशित विश्वास या भरोसे का यूहन्नाई प्रयोग है; हिन्दी में ‘मुझ पर विश्वास’ इसका स्वाभाविक समतुल्य है।
theological_decisions:
- issue: इस पद में बताए गए पाप का स्वरूप
  choice: इस संदर्भ में यीशु पर विश्वास न करना ‘पाप’ का निर्णायक रूप या अभिव्यक्ति बताया गया है।
  alternative: यह सामान्य मानवीय पापमयता को सूचित करता है और अविश्वास उसका केवल एक उदाहरण है।
  rationale: ὅτι से आरंभ होने वाला उपवाक्य ‘पाप के विषय में’ का सीधा कारण अथवा स्पष्टीकरण देता है। अनुवाद इस संबंध को बनाए रखता है, पर पद से परे कोई व्यापक धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और समानांतर प्रवचन-रचना के अनुकूल भाषा। ‘के विषय में’ औपचारिक होते हुए भी सामान्य पाठक के लिए सहज है।
