lexical_decisions:
- source_word: Ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पद यीशु की पिछली बातों की ओर संकेत करता है; ‘ये बातें’ बहुवचन और यूहन्ना की संवाद-शैली दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: λελάληκα
  choice: मैंने ... कही हैं
  rationale: पूर्णकालिक क्रिया का वर्तमान तक बना हुआ परिणाम हिन्दी के ‘कही हैं’ से स्वाभाविक रूप में व्यक्त होता है; ‘बोली हैं’ की अपेक्षा बातों के साथ ‘कही हैं’ अधिक मुहावरेदार है।
- source_word: ὑμῖν
  choice: तुमसे
  rationale: यह द्वितीय पुरुष बहुवचन है। शिष्यों को सामूहिक रूप से संबोधित करते हुए आधुनिक हिन्दी में ‘तुमसे’ स्वाभाविक है; अनावश्यक रूप से ‘तुम सब से’ जोड़ना आवश्यक नहीं।
- source_word: ἵνα μὴ
  choice: इसलिए ... कि ... न
  rationale: यह रचना उद्देश्य को स्पष्ट और सहज हिन्दी में व्यक्त करती है।
- source_word: σκανδαλισθῆτε
  choice: ठोकर न खाओ
  rationale: यह यूनानी क्रिया के ठोकर खाने या फँसकर गिरने के रूपक को बनाए रखती है और प्रसंग में विश्वास से डिगने की गंभीर संभावना के लिए भी खुली रहती है।
theological_decisions:
- issue: उत्पीड़न के प्रसंग में σκανδαλισθῆτε का अर्थ
  choice: ठोकर न खाओ
  alternative: विश्वास से न डिगो / विश्वास छोड़ न दो / बुरा न मानो
  rationale: अगले पदों में आने वाले उत्पीड़न के कारण यहाँ आध्यात्मिक पतन या विश्वास से विमुख होना सम्मिलित हो सकता है। फिर भी मुख्य पाठ में ‘विश्वास छोड़ देना’ रखने से यूनानी रूपक और उसकी अर्थ-व्याप्ति समय से पहले सीमित हो जाती; इसलिए रूपक मुख्य पाठ में और उसका गंभीर प्रसंगगत अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। ‘तुमसे’ शिष्यों के बहुवचन संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ यूनानी रूपक को सुरक्षित रखता है, जबकि पादटिप्पणी उत्पीड़न के निकटवर्ती प्रसंग में उसके अधिक गंभीर आध्यात्मिक आशय को स्पष्ट करती है।
