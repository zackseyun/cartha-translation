id: JHN.16.33
reference: John 16:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: hi
  text: मैंने ये बातें तुमसे इसलिए कही हैं कि मुझमें तुम्हें शांति मिले। संसार में तुम्हें क्लेश होता है[a], पर साहस रखो[b]; मैंने संसार पर विजय पा ली है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘क्लेश’ का अनुवाद ‘दुःख-कष्ट,’ ‘संकट’ या ‘विपत्ति’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हिम्मत रखो’ अथवा ‘ढाढ़स बाँधो।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक पद यीशु के पिछले पूरे उपदेश की ओर संकेत करता है; आधुनिक हिन्दी में ‘ये बातें’ स्वाभाविक और स्पष्ट है।
- source_word: λελάληκα
  choice: मैंने ... कही हैं
  rationale: यूनानी पूर्णकाल पूरे हो चुके कथन की वर्तमान प्रासंगिकता दिखाता है; हिन्दी का ‘कही हैं’ इस प्रभाव को सहज रूप से व्यक्त करता है।
- source_word: ἵνα
  choice: इसलिए ... कि
  rationale: यह प्रयोजन बताता है; ‘इसलिए ... कि’ आधुनिक हिन्दी में उद्देश्य-संबंध को स्पष्ट रखता है।
- source_word: ἐν ἐμοὶ
  choice: मुझमें
  rationale: यूहन्ना की विशिष्ट ‘में’ वाली संबंध-भाषा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: εἰρήνην ἔχητε
  choice: तुम्हें शांति मिले
  rationale: प्रयोजनवाचक संरचना के भीतर वर्तमान संभावनार्थक क्रिया का स्वाभाविक हिन्दी रूप है और शांति की निरंतर उपलब्धता का भाव रखता है।
- source_word: ἐν τῷ κόσμῳ
  choice: संसार में
  rationale: ‘संसार’ κόσμος का मानक हिन्दी रूप है और यूहन्ना के बहुअर्थी प्रयोग को ‘पतित व्यवस्था’ जैसे व्याख्यात्मक शब्दों से संकुचित नहीं करता।
- source_word: θλῖψιν ἔχετε
  choice: तुम्हें क्लेश होता है
  rationale: θλῖψις दबाव, कष्ट और विपत्ति का गंभीर भाव रखता है; वर्तमानकाल को भविष्यकाल में बदलने के बजाय सामान्य और जारी अनुभव के रूप में रखा गया है।
- source_word: θαρσεῖτε
  choice: साहस रखो
  rationale: आज्ञार्थक पद संकट के बीच दृढ़ विश्वास और हौसले का आह्वान करता है; यह वर्तमान, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: νενίκηκα
  choice: मैंने ... विजय पा ली है
  rationale: यह निर्णायक रूप से पूरी हुई और अब भी प्रभावी विजय को व्यक्त करने वाला स्वाभाविक हिन्दी पूर्ण रूप है।
theological_decisions:
- issue: κόσμος का यूहन्नाई अर्थ
  choice: दोनों स्थानों पर ‘संसार’
  alternative: ‘परमेश्वर-विरोधी संसार-व्यवस्था’ या ‘यह पतित संसार’
  rationale: मूल शब्द प्रेम की वस्तु, मानव-जगत और परमेश्वर-विरोधी व्यवस्था जैसे परस्पर जुड़े अर्थ ग्रहण कर सकता है। केवल ‘संसार’ रखने से यहाँ यीशु में शांति और संसार में क्लेश का तनाव बना रहता है तथा अर्थ अनावश्यक रूप से संकुचित नहीं होता।
- issue: νενίκηκα की पूर्णकालिक विजय
  choice: ‘मैंने संसार पर विजय पा ली है’
  alternative: ‘मैं संसार पर विजय पाऊँगा’ या ‘मैंने संसार को हरा दिया’
  rationale: कथा में क्रूस से पहले कही गई इस घोषणा को भविष्यकाल में बदलना मूल के निर्णायक पूर्णकाल को मिटा देता। चुना हुआ रूप पूरी हो चुकी और स्थायी प्रभाव वाली विजय—तथा उससे उत्पन्न धार्मिक तनाव—को सुरक्षित रखता है।
- issue: शांति और क्लेश का संबंध
  choice: ‘मुझमें’ शांति तथा ‘संसार में’ क्लेश को समानांतर रखा
  alternative: शांति को क्लेश के हट जाने के अर्थ में स्पष्ट करना
  rationale: पद दोनों वास्तविकताओं को साथ रखता है; अनुवाद यह नहीं कहता कि शांति मिलने से क्लेश समाप्त हो जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन रखा गया है। ‘तुम’ मूल यूनानी के बहुवचन शिष्य-संबोधन के अनुरूप है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों और उनके विषयों में असंगति थी; हिन्दी पादटिप्पणियाँ मूल यूनानी के संबंधित शब्दों पर लगाई गई हैं।
