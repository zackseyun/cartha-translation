  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: hi
  text: इसलिए वे कह रहे थे, “यह क्या है जो वह कहता है, ‘थोड़ी देर’? हम नहीं जानते कि वह क्या कह रहा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल चल रही या बार-बार हो रही बातचीत का संकेत देता है; हिन्दी का यह रूप उस पक्ष को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकली प्रतिक्रिया या विचार-क्रम को जोड़ता है।
- source_word: Τί ἐστιν τοῦτο
  choice: यह क्या है
  rationale: यूनानी प्रश्न की सीधी संरचना और शिष्यों की उलझन सुरक्षित रहती है; ‘इसका क्या अर्थ है’ अधिक व्याख्यात्मक होता।
- source_word: ὃ λέγει μικρόν
  choice: जो वह कहता है, ‘थोड़ी देर’
  rationale: सम्बन्धवाचक उपवाक्य और उलझन पैदा करने वाले वाक्यांश μικρόν को प्रत्यक्ष उद्धरण के रूप में बनाए रखा गया है।
- source_word: μικρόν
  choice: थोड़ी देर
  rationale: यहाँ शब्द समय की छोटी अवधि के लिए क्रियाविशेषणात्मक अथवा लुप्त संज्ञा के साथ प्रयुक्त है; ‘थोड़ी देर’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: οὐκ οἴδαμεν
  choice: हम नहीं जानते
  rationale: οἶδα के वर्तमान अर्थ वाले रूप और उसके निषेध का सीधा, गरिमापूर्ण अनुवाद है।
- source_word: τί λαλεῖ
  choice: वह क्या कह रहा है
  rationale: λαλεῖ उसके बोले हुए कथन की विषयवस्तु को दर्शाता है। यह मूल के निकट है और ‘उसका क्या मतलब है’ जैसी व्याख्यात्मक स्पष्टता नहीं जोड़ता।
