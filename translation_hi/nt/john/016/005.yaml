id: JHN.16.5
reference: John 16:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: hi
  text: पर अब मैं उसके पास जा रहा हूँ जिसने मुझे भेजा, और तुममें से कोई मुझसे नहीं पूछता, “आप कहाँ जा रहे हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: पर अब
  rationale: δέ के विरोधात्मक/संक्रमणकारी भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ὑπάγω
  choice: मैं ... जा रहा हूँ
  rationale: यूहन्ना के इस प्रसंग में वर्तमानकालीन गमन को स्वाभाविक प्रगतिशील रूप में व्यक्त करता है, बिना केवल ‘विदा होने’ का अर्थ थोपे।
- source_word: πρὸς τὸν πέμψαντά με
  choice: उसके पास ... जिसने मुझे भेजा
  rationale: πρός के व्यक्ति की ओर गमन को ‘के पास’ से और व्यक्तिवाचक कृदंत को सम्बन्धवाचक उपवाक्य से व्यक्त किया गया है; ‘पिता’ शब्द नहीं जोड़ा गया।
- source_word: πέμψαντά
  choice: भेजा
  rationale: πέμπω के सामान्य मिशन-संबंधी अर्थ का सीधा और प्रसंगानुकूल हिन्दी रूप।
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: तुममें से कोई ... नहीं
  rationale: अंशवाचक संरचना और पूर्ण निषेध दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἐρωτᾷ με
  choice: मुझसे नहीं पूछता
  rationale: यहाँ ἐρωτάω प्रश्न पूछने के अर्थ में है; ‘पूछता’ सबसे स्वाभाविक आधुनिक हिन्दी है।
- source_word: Ποῦ ὑπάγεις;
  choice: आप कहाँ जा रहे हैं?
  rationale: प्रत्यक्ष प्रश्न का स्वाभाविक हिन्दी रूप; यीशु को संबोधित करते समय सम्मानसूचक ‘आप’ सामान्य हिन्दी पाठक के लिए उपयुक्त है।
theological_decisions:
- issue: ‘जिसने मुझे भेजा’ की पहचान
  choice: मूल पाठ की तरह पहचान को अप्रकट रखते हुए ‘उसके पास ... जिसने मुझे भेजा’
  alternative: ‘उस पिता के पास जिसने मुझे भेजा’
  rationale: इस वाक्यांश में यूनानी पाठ स्पष्ट रूप से ‘पिता’ नहीं कहता। यद्यपि यूहन्ना के व्यापक प्रसंग में संकेत स्पष्ट है, मुख्य पाठ में उसे जोड़ना स्रोत से अधिक स्पष्टता देना होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। शिष्यों के लिए ‘तुम’ और यीशु को संबोधित प्रत्यक्ष प्रश्न में सम्मानसूचक ‘आप’ का प्रयोग स्वाभाविक हिन्दी सामाजिक-धार्मिक व्यवहार के अनुरूप है।
