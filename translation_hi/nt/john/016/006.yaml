  yaml_path: translation/nt/john/016/006.yaml
  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: hi
  text: लेकिन मैंने तुमसे ये बातें कही हैं, इसलिए तुम्हारा हृदय दुःख से भर गया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे हृदय दुःख से भर गए हैं।” यूनानी में “तुम्हारा” बहुवचन है, जबकि “हृदय” एकवचन है; यह रचना पूरे समूह के साझा भीतरी दुःख को व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: पर
  rationale: यह पिछले कथन के साथ विरोध या मोड़ दिखाता है; आधुनिक हिन्दी में ‘पर’ स्वाभाविक और पर्याप्त रूप से स्पष्ट है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ यह शिष्यों के दुःख का कारण बताता है, इसलिए कारणवाचक ‘क्योंकि’ उपयुक्त है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक उन बातों की ओर लौटता है जिन्हें यीशु ने अभी कहा है; ‘ये बातें’ संख्या और संदर्भ दोनों बनाए रखता है।
- source_word: λελάληκα
  choice: मैंने ... कही हैं
  rationale: यूनानी पूर्णकाल पहले कहे जाने और उसके वर्तमान प्रभाव को व्यक्त करता है; हिन्दी का पूर्ण रूप ‘कही हैं’ इसे स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: ὑμῖν
  choice: तुमसे
  rationale: द्वितीय पुरुष बहुवचन संबोधन को प्रसंग में सहज हिन्दी द्वारा व्यक्त किया गया है; ‘तुमसे बातें कहना’ स्वाभाविक प्रयोग है।
- source_word: ἡ λύπη
  choice: दुःख
  rationale: λύπη गहरी उदासी या शोक का बोध कराता है; ‘दुःख’ सामान्य पाठक के लिए स्वाभाविक, गंभीर और व्यापक शब्द है।
- source_word: πεπλήρωκεν
  choice: भर गया है
  rationale: पूर्णकाल और ‘भरने’ की मूल छवि दोनों सुरक्षित रखी गई हैं; हिन्दी में ‘हृदय दुःख से भर गया है’ सहज है।
- source_word: ὑμῶν τὴν καρδίαν
  choice: तुम्हारा हृदय
  rationale: यूनानी में बहुवचन ‘तुम्हारा’ के साथ ‘हृदय’ एकवचन है। एकवचन रखने से समूह की साझा भीतरी दशा की सम्भावित छाया सुरक्षित रहती है।
theological_decisions:
- issue: सामूहिक एकवचन ‘हृदय’ या वितरणात्मक बहुवचन ‘हृदयों’
  choice: तुम्हारा हृदय
  alternative: तुम्हारे हृदय
  rationale: मूल यूनानी एकवचन καρδίαν को बहुवचन संबंधवाचक के साथ रखता है। हिन्दी में एकवचन सामूहिक संबोधन के रूप में समझा जा सकता है और शिष्यों की साझा भीतरी व्यथा को उभार सकता है; फुटनोट बहुवचन सम्भावना बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘इसलिए’ जोड़कर कारण और परिणाम का हिन्दी संबंध स्पष्ट किया गया है, जबकि मूल का अर्थ अपरिवर्तित रखा गया है।
