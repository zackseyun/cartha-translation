  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: hi
  text: “मैंने ये बातें तुमसे रूपकात्मक ढंग से कही हैं[a]। एक घड़ी आ रही है[b] जब मैं तुमसे फिर रूपकात्मक ढंग से नहीं बोलूँगा, बल्कि पिता के विषय में तुम्हें स्पष्ट रूप से बताऊँगा[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दृष्टान्तों में’ अथवा ‘गूढ़ कथनों में’; यूनानी शब्द आलंकारिक या परोक्ष कथन को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘ऐसा समय आ रहा है।’ यूहन्ना के सुसमाचार में ‘घड़ी’ शब्द का प्रायः विशेष धर्मवैज्ञानिक महत्त्व होता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘खुलकर’ अथवा ‘साफ-साफ’; यहाँ आशय रूपकात्मक कथन के विपरीत प्रत्यक्ष कथन से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: सांकेतिक भाषा में
  rationale: यूहन्ना में यह शब्द सामान्यतः दृष्टान्त की तकनीकी विधा से अधिक आलंकारिक, परोक्ष या कुछ हद तक गूढ़ कथन का संकेत करता है। ‘सांकेतिक भाषा में’ इस अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λελάληκα
  choice: कही हैं
  rationale: पूर्णकालीन यूनानी रूप पहले कही गई बातों की वर्तमान प्रासंगिकता बनाए रखता है; हिन्दी का ‘कही हैं’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔρχεται ὥρα
  choice: ऐसी घड़ी आ रही है
  rationale: ‘घड़ी’ यूहन्ना की विशिष्ट शब्दावली और उसके संभावित धर्मवैज्ञानिक संकेत को बनाए रखती है। ‘ऐसी’ अनिश्चित भाव को स्वाभाविक हिन्दी में व्यक्त करती है और आगे आने वाले ‘जब’ वाक्य से सुचारु रूप से जुड़ती है।
- source_word: οὐκέτι
  choice: फिर … नहीं
  rationale: इस भविष्यकालीन विरोध में ‘अब और नहीं’ की अपेक्षा ‘फिर … नहीं’ अधिक स्वाभाविक हिन्दी है और पूर्व शैली के समाप्त होने का भाव स्पष्ट करता है।
- source_word: λαλήσω
  choice: बोलूँगा
  rationale: यह बोलने की क्रिया पर बल देता है और पहले खंड के कथन से अर्थगत संबंध बनाए रखता है।
- source_word: παρρησίᾳ
  choice: साफ-साफ
  rationale: यहाँ इसका प्रमुख अर्थ साहस नहीं, बल्कि सांकेतिक या परोक्ष कथन के विपरीत स्पष्ट और प्रत्यक्ष ढंग से कहना है।
- source_word: ἀπαγγελῶ
  choice: बताऊँगा
  rationale: प्रसंग में यीशु प्रत्यक्ष रूप से प्रकट करने की बात करते हैं; ‘बताऊँगा’ ‘पिता के विषय में’ के साथ स्वाभाविक और सटीक है।
- source_word: περὶ τοῦ πατρὸς
  choice: पिता के विषय में
  rationale: यह मूल के विषय-संबंध को स्पष्ट रखता है और ‘पिता’ की यूहन्नाई धार्मिक महत्ता में कोई अतिरिक्त व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: यूहन्ना के प्रसंग में ὥρα का अनुवाद
  choice: ऐसी घड़ी आ रही है
  alternative: ऐसा समय आ रहा है
  rationale: ‘घड़ी’ मूल शब्दावली और यूहन्ना में उसके संभावित धर्मवैज्ञानिक भार को सुरक्षित रखती है, जबकि ‘ऐसी’ यूनानी के अनिश्चित भाव को हिन्दी में स्वाभाविक बनाती है।
- issue: ἐν παροιμίαις और παρρησίᾳ के बीच विरोध
  choice: सांकेतिक भाषा में … साफ-साफ
  alternative: गूढ़ कथनों में … खुलकर
  rationale: मुख्य विरोध परोक्ष अथवा आलंकारिक कथन और स्पष्ट, प्रत्यक्ष कथन के बीच है। चुना हुआ रूप सार्वजनिक साहस का अनावश्यक अर्थ जोड़े बिना इस तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सांकेतिक भाषा’ और ‘साफ-साफ’ का विरोध मूल वाक्य की संरचना तथा अर्थगत तनाव को स्पष्ट करता है; ‘घड़ी’ यूहन्नाई शैली को सुरक्षित रखती है।
