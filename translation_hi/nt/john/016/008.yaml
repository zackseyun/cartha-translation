source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ἐκεῖνος ἐλέγξει τὸν κόσμον περὶ ἁμαρτίας καὶ περὶ δικαιοσύνης καὶ περὶ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: hi
  text: और जब वह[a] आएगा, तो वह संसार को पाप के विषय में, धार्मिकता[b] के विषय में और न्याय के विषय में दोषी सिद्ध करेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ बलसूचक संकेतवाचक सर्वनाम है, जिसका अर्थ ‘वह स्वयं’ या प्रसंगानुसार ‘वही’ भी व्यक्त किया जा सकता है; यह आनेवाले सहायक की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘न्यायपरायणता’।
    reason: alternative_reading
  - marker: c
    text: या ‘दोष उजागर करेगा’ अथवा ‘गलत साबित करेगा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: जब … आएगा
  rationale: क्रियाविशेषणीय एओरिस्ट कृदंत का यहाँ कालवाचक अर्थ है। आधुनिक हिन्दी में ‘जब … आएगा’ स्वाभाविक रूप से इस संबंध को व्यक्त करता है।
- source_word: ἐκεῖνος
  choice: वह
  rationale: यह बलसूचक संकेतवाचक सर्वनाम निकटवर्ती प्रसंग में आनेवाले सहायक, अर्थात पवित्र आत्मा, की ओर संकेत करता है। हिन्दी में ‘वह’ संकेतवाचकता को बनाए रखता है; यूनानी का विशेष बल पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐλέγξει
  choice: दोषी सिद्ध करेगा
  rationale: ἐλέγχω यहाँ दोष उजागर करने और किसी को गलत अथवा दोषी प्रमाणित करने का नैतिक-न्यायिक भाव रखता है। ‘दोषी सिद्ध करेगा’ इस बल को बनाए रखता है, पर इसे अंतिम दंडादेश तक सीमित नहीं करता।
- source_word: τὸν κόσμον
  choice: संसार को
  rationale: यूहन्ना में κόσμος प्रायः परमेश्वर से विमुख मानव-जगत को सूचित करता है। ‘संसार’ इसकी व्यापकता और धर्मवैज्ञानिक अनुगूँज को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: περὶ
  choice: के विषय में
  rationale: तीन विषयों पर लागू यूनानी संबंधबोधक की व्याख्यात्मक शक्ति को हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἁμαρτίας
  choice: पाप
  rationale: यूनानी एकवचन को बनाए रखा गया है, जिससे अगली आयत में उसके विशिष्ट आशय की व्याख्या खुली रहती है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: यह δικαιοσύνη का स्थापित और प्रसंगानुकूल हिन्दी रूप है। अगली आयत में यीशु के पिता के पास जाने से इसका संबंध ‘धार्मिकता’ के पक्ष में है, यद्यपि ‘न्यायपरायणता’ भी संभावित है।
- source_word: κρίσεως
  choice: न्याय
  rationale: κρίσις का न्यायिक भाव सुरक्षित रहता है और इसे समय से पहले केवल ‘दंड’ या ‘दोषदंड’ तक सीमित नहीं किया जाता।
theological_decisions:
- issue: ἐκεῖνος का संदर्भ और बल
  choice: इसे ‘वह’ अनूदित किया गया है और पादटिप्पणी में इसके बलसूचक संकेतवाचक रूप को बताया गया है; प्रसंग में यह आनेवाले सहायक की ओर संकेत करता है।
  alternative: ‘वही’ या ‘वह व्यक्ति’
  rationale: ‘वही’ हिन्दी में अनन्यता का ऐसा अतिरिक्त भाव ला सकता है जो यूनानी में अनिवार्य नहीं है, जबकि ‘वह व्यक्ति’ आत्मा के संदर्भ में अनावश्यक रूप से भारी है। ‘वह’ और पादटिप्पणी मिलकर संकेत तथा बल दोनों को संतुलित रखते हैं।
- issue: δικαιοσύνη का अर्थ
  choice: धार्मिकता
  alternative: न्यायपरायणता
  rationale: तत्काल बाद की व्याख्या इसे यीशु के पिता के पास जाने से जोड़ती है, इसलिए ‘धार्मिकता’ प्रसंग के अनुकूल है। फिर भी शब्द का न्याय-संबंधी आयाम पादटिप्पणी में खुला रखा गया है।
- issue: ἐλέγξει की नैतिक-न्यायिक शक्ति
  choice: दोषी सिद्ध करेगा
  alternative: दोष उजागर करेगा; गलत साबित करेगा
  rationale: यह चयन संसार की भूल और दोष को प्रकट तथा प्रमाणित करने का भाव देता है, लेकिन इसे ‘दंड देगा’ जैसे अंतिम न्यायादेश में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘के विषय में’ तीनों संज्ञाओं पर समान रूप से लागू है और यूनानी त्रिक संरचना को हिन्दी में बिना बोझिल पुनरावृत्ति के व्यक्त करता है।
