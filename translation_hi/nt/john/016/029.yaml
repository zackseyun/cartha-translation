  yaml_path: translation/nt/john/016/029.yaml
  text: His disciples said[a], “Look[b], now you are speaking openly and are not speaking in any figure of speech.”
translation:
  language: hi
  text: उसके शिष्यों ने कहा, “देखिए, अब आप खुलकर[a] बोल रहे हैं और कोई सांकेतिक बात[b] नहीं कह रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “साफ-साफ।” यूनानी अभिव्यक्ति का अर्थ खुले रूप से, स्पष्ट रूप से या बेधड़क बोलना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “लोकोक्ति,” “दृष्टांत” अथवा “सांकेतिक कथन।” यहाँ इसका आशय आलंकारिक या अप्रत्यक्ष भाषा से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν
  choice: कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथा-शैली में साधारण भूतकाल से व्यक्त किया गया है।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: उसके शिष्यों ने
  rationale: सम्बन्धवाचक यूनानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: Ἴδε
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; शिष्यों द्वारा यीशु को सम्बोधित करने के प्रसंग में आदरसूचक रूप स्वाभाविक है।
- source_word: νῦν
  choice: अब
  rationale: यीशु के बोलने के ढंग में शिष्यों को दिखाई दे रहे वर्तमान परिवर्तन को व्यक्त करता है।
- source_word: ἐν παρρησίᾳ
  choice: खुलकर
  rationale: यहाँ παρρησία का विरोध अप्रत्यक्ष या दृष्टांतपूर्ण कथन से है; ‘खुलकर’ स्पष्टता और खुलेपन दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: λαλεῖς
  choice: बोल रहे हैं
  rationale: वर्तमान संवाद-स्थिति में जारी बोलने को हिन्दी के वर्तमान प्रगतिशील रूप में व्यक्त किया गया है।
- source_word: παροιμίαν
  choice: दृष्टांतपूर्ण कथन
  rationale: यूहन्ना में यह शब्द केवल लोकोक्ति नहीं, बल्कि सांकेतिक, आलंकारिक या अप्रत्यक्ष कथन का बोध करा सकता है; यह चयन उस व्यापकता को बनाए रखता है।
- source_word: οὐδεμίαν λέγεις
  choice: किसी भी … में नहीं बोल रहे
  rationale: प्रबल निषेध को बनाए रखते हुए यूनानी ‘कहना’ और παροιμία के सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ἐν παρρησίᾳ और παροιμία के बीच विरोध
  choice: यीशु को अप्रत्यक्ष या दृष्टांतपूर्ण ढंग के विपरीत खुलकर बोलते हुए बताया गया है।
  alternative: यीशु साहसपूर्वक या बेधड़क बोल रहे हैं।
  rationale: तात्कालिक वाक्य-विन्यास में παρρησία का सीधा विरोध παροιμία से है, इसलिए अभिव्यक्ति का खुलापन मुख्य अर्थ है; फिर भी पादटिप्पणी ‘साफ-साफ’ विकल्प को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, आदरसूचक और बोलचाल में सहज रखी गई है। ‘देखिए’ तथा ‘आप’ शिष्यों द्वारा यीशु को सीधे सम्बोधित करने के लिए वर्तमान मानक हिन्दी के सम्मानसूचक रूप हैं। दोनों पादटिप्पणी-चिह्न सम्बद्ध शब्दों के तुरन्त बाद मुख्य पाठ में दिए गए हैं।
