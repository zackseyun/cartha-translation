id: JHN.16.7
reference: John 16:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: hi
  text: 'लेकिन मैं तुमसे सच कहता हूँ: यह तुम्हारे लिए लाभकारी है कि मैं चला जाऊँ। क्योंकि यदि मैं न जाऊँ, तो सहायक[a] निश्चय ही तुम्हारे पास नहीं आएगा; पर यदि मैं जाऊँ, तो मैं उसे तुम्हारे पास भेजूँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पक्षसमर्थक,’ ‘परामर्शदाता,’ अथवा ‘सांत्वना देनेवाला’; यूनानी शब्द ‘पाराक्लेतोस’ है।
    reason: παράκλητος की अर्थ-सीमा किसी एक हिन्दी पर्याय में पूरी तरह व्यक्त नहीं होती।
lexical_decisions:
- source_word: ἀλλ’
  choice: लेकिन
  rationale: यह पिछले प्रसंग में चेलों के शोक के विपरीत यीशु के कथन को स्वाभाविक आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: मूल के सत्य बोलने के गंभीर और प्रत्यक्ष दावे को सहज, गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: συμφέρει ὑμῖν
  choice: यह तुम्हारे लिए लाभकारी है
  rationale: συμφέρει में निहित हित और लाभ के भाव को स्पष्ट करता है; केवल ‘अच्छा’ कहने की अपेक्षा अर्थ अधिक ठीक ढंग से व्यक्त होता है।
- source_word: ἵνα ἐγὼ ἀπέλθω
  choice: कि मैं चला जाऊँ
  rationale: ἵνα-वाक्यांश को उस बात की विषय-वस्तु के रूप में रखता है जो चेलों के लिए लाभकारी है, और अगले वाक्य में क्रिया की पुनरावृत्ति भी बनाए रखता है।
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: क्योंकि यदि मैं न जाऊँ
  rationale: γάρ का व्याख्यात्मक संबंध और ἐάν की शर्त दोनों स्पष्ट रहते हैं।
- source_word: ὁ παράκλητος
  choice: सहायक
  rationale: यह सामान्य पाठक के लिए स्वाभाविक और व्यक्तिगत भूमिका सूचित करने वाला शब्द है। παράκλητος की वकालत, परामर्श और सांत्वना से जुड़ी व्यापक अर्थ-छाया को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: οὐ μὴ ἔλθῃ
  choice: निश्चय ही ... नहीं आएगा
  rationale: οὐ μή के प्रबल निषेध को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है, बिना उसे पूर्णतः कालातीत ‘कभी नहीं’ में बदलने के।
- source_word: πρὸς ὑμᾶς
  choice: तुम्हारे पास
  rationale: यह चेलों की ओर आने के स्थानिक और संबंधपरक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐὰν δὲ πορευθῶ
  choice: पर यदि मैं जाऊँ
  rationale: δέ के विरोधात्मक संबंध और शर्त को बनाए रखता है; πορεύομαι के लिए प्रसंगानुकूल सहज क्रिया ‘जाना’ प्रयुक्त हुई है।
- source_word: πέμψω αὐτὸν πρὸς ὑμᾶς
  choice: मैं उसे तुम्हारे पास भेजूँगा
  rationale: भेजने की क्रिया, व्यक्तिगत कर्म-सर्वनाम और चेलों की ओर गमन—तीनों को सीधे रूप में सुरक्षित रखता है।
theological_decisions:
- issue: यूहन्ना के विदाई-उपदेश में παράκλητος का अनुवाद
  choice: सहायक
  alternative: पक्षसमर्थक; परामर्शदाता; सांत्वना देनेवाला; पाराक्लेतोस
  rationale: किसी एक हिन्दी शब्द में यूनानी पद की पूरी अर्थ-सीमा नहीं समाती। ‘सहायक’ सहज और व्यापक है, जबकि प्रतिनिधित्व, परामर्श और सांत्वना के अन्य पहलुओं को पाद-टिप्पणी में रखा गया है ताकि अर्थ को संकीर्ण न किया जाए।
- issue: παράκλητος के लिए व्यक्तिगत संदर्भ
  choice: उसे
  alternative: इसे
  rationale: मूल पाठ παράκλητος को आने और भेजे जाने वाले व्यक्तिगत कर्ता के रूप में प्रस्तुत करता है तथा αὐτόν से उसकी ओर संकेत करता है। ‘उसे’ इस व्यक्तिगत प्रस्तुति को स्वाभाविक हिन्दी में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में बहुवचन ‘तुम’ रखा गया है। शैली सहज, गंभीर और सार्वजनिक पाठ के योग्य है। ‘निश्चय ही ... नहीं’ मूल के प्रबल निषेध को दर्शाता है, और मुख्य पाठ में पाद-टिप्पणी चिह्न संबंधित पद ‘सहायक’ के तुरंत बाद रखा गया है।
