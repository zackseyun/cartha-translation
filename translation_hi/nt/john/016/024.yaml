review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal phrase, the prior failure to ask, the imperative and promised receiving, and the purpose clause. However, Greek ἐν τῷ ὀνόματί μου is most naturally and idiomatically represented in modern Hindi as “मेरे नाम से,” not “मेरे नाम में.” This preserves the literal Johannine expression without imposing a particular interpretation.
  naturalness: “मेरे नाम में” is not idiomatic Hindi in this prayer context. “मेरे नाम से” is standard, clear, and suitably dignified. The remaining wording is natural modern Hindi with an appropriately elevated biblical register.
  terminology: “आनन्द” and “परिपूर्ण” suitably retain the elevated register and communicate the fullness motif of πεπληρωμένη. “माँगो” and “तुम पाओगे” accurately represent the imperative and future promise. “मेरे नाम से” preserves the theological breadth of the Greek phrase better in Hindi usage.
  issues:
  - severity: medium
    issue: The phrase “मेरे नाम में” is an unnatural Hindi rendering of ἐν τῷ ὀνόματί μου.
    rationale: In standard Hindi, acting or asking ‘in someone’s name’ is normally expressed as “किसी के नाम से.” This is an idiomatic equivalent and does not narrow the phrase to authority, representation, or any other single theological explanation.
  revised_text: अब तक तुमने मेरे नाम से कुछ भी नहीं माँगा। माँगो, और तुम पाओगे, ताकि तुम्हारा आनन्द परिपूर्ण हो जाए।
