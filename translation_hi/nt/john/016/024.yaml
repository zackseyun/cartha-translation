  text: ἕως ἄρτι οὐκ ᾐτήσατε οὐδὲν ἐν τῷ ὀνόματί μου· αἰτεῖτε καὶ λήμψεσθε, ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: hi
  text: अब तक तुमने मेरे नाम से कुछ भी नहीं माँगा। माँगो, और तुम पाओगे, ताकि तुम्हारा आनन्द परिपूर्ण हो जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕως ἄρτι
  choice: अब तक
  rationale: यह स्वाभाविक आधुनिक हिन्दी में वर्तमान क्षण तक की समय-सीमा व्यक्त करता है।
- source_word: οὐκ ᾐτήσατε οὐδὲν
  choice: तुमने ... कुछ भी नहीं माँगा
  rationale: नकार के साथ οὐδὲν का अर्थ ‘कुछ भी नहीं’ है; माँगना αἰτέω के निवेदन करने वाले भाव को सहज रूप से व्यक्त करता है।
- source_word: ἐν τῷ ὀνόματί μου
  choice: मेरे नाम में
  rationale: यूहन्ना की धर्मवैचारिक रूप से समृद्ध अभिव्यक्ति को बिना किसी एक व्याख्या तक सीमित किए निकटता से सुरक्षित रखता है।
- source_word: αἰτεῖτε
  choice: माँगो
  rationale: वर्तमान आज्ञार्थक को सहज आज्ञा के रूप में रखा गया है; सन्दर्भ में निरन्तर या बार-बार माँगने की सम्भावना को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: λήμψεσθε
  choice: तुम पाओगे
  rationale: प्रार्थना के प्रत्युत्तर में प्राप्ति का अर्थ स्पष्ट और स्वाभाविक हिन्दी में देता है।
- source_word: ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη
  choice: ताकि तुम्हारा आनन्द परिपूर्ण हो जाए
  rationale: ἵνα का प्रयोजनसूचक भाव और पूर्णता की परिणामी अवस्था दोनों स्वाभाविक हिन्दी में व्यक्त होते हैं।
theological_decisions:
- issue: ‘मेरे नाम में’ प्रार्थना करने का अर्थ
  choice: ‘मेरे नाम में’ को मुख्य पाठ में यथावत रखा गया।
  alternative: ‘मेरे अधिकार से’, ‘मेरी ओर से’, या ‘मेरे साथ एकता में’
  rationale: मूल अभिव्यक्ति यीशु के व्यक्तित्व, अधिकार और उद्देश्य से सम्बन्ध का व्यापक भाव रखती है; कोई एक व्याख्यात्मक विस्तार इसकी धर्मवैचारिक व्यापकता को संकुचित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज है। शिष्यों को सम्बोधन के अनुरूप ‘तुम’ रखा गया है। ‘आनन्द’ और ‘परिपूर्ण’ बाइबिलीय गरिमा बनाए रखते हुए आज भी स्पष्ट हैं।
