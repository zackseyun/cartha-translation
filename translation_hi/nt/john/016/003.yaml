  yaml_path: translation/nt/john/016/003.yaml
  text: And they will do these things because they have not known the Father or me[a].
translation:
  language: hi
  text: और वे ये काम इसलिए करेंगे, क्योंकि उन्होंने न तो पिता को जाना है और न मुझे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उन्होंने न तो पिता को जाना, और न मुझे।’ यूनानी क्रिया का अनुवाद यहाँ वर्तमान-प्रासंगिक पूर्णता या साधारण भूतकाल से किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह पिछले कथन से सरल संबंध जोड़ता है; हिन्दी में ‘और’ स्वाभाविक संयोजक है।
- source_word: ταῦτα
  choice: ये काम
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पिछले प्रसंग में बताए गए विरोधपूर्ण कार्यों की ओर लौटता है; ‘ये काम’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ποιήσουσιν
  choice: वे ... करेंगे
  rationale: ποιέω के भविष्यकालीन सक्रिय रूप का प्रसंगानुकूल और सहज अनुवाद है।
- source_word: ὅτι
  choice: इसलिए ... क्योंकि
  rationale: यहाँ ὅτι उनके भावी कार्यों का कारण बताता है; हिन्दी की ‘इसलिए ... क्योंकि’ संरचना कारण-संबंध को स्वाभाविक रूप से व्यक्त करती है।
- source_word: οὐκ ἔγνωσαν
  choice: उन्होंने ... नहीं जाना है
  rationale: अओरिस्ट रूप को हिन्दी में वर्तमान प्रासंगिकता वाले पूर्ण पक्ष से व्यक्त किया गया है। ‘जाना’ यूहन्ना में केवल जानकारी नहीं, बल्कि संबंधपरक पहचान को भी बनाए रखता है।
- source_word: τὸν πατέρα
  choice: पिता
  rationale: यूहन्ना के प्रसंग में यह परमेश्वर के लिए पुत्र-संबंधी व्यक्तिगत पदवी है।
- source_word: οὐδὲ ἐμέ
  choice: न मुझे
  rationale: οὐδέ दूसरे निषेधात्मक कर्म को जोड़ता है; ‘न तो ... न ...’ मूल के ‘न पिता, न मुझे’ अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: परमेश्वर और यीशु के संबंध में यूहन्ना की ‘जानने’ की भाषा
  choice: उन्होंने न तो पिता को जाना है, न मुझे
  alternative: उन्होंने न तो पिता को जाना, न मुझे / वे न तो पिता को जान पाए हैं, न मुझे
  rationale: यह पाठ सताव का कारण पिता और यीशु दोनों के संबंधपरक अज्ञान को ठहराता है। ‘जाना है’ इस दावे की वर्तमान प्रासंगिकता और ‘जानना’ की संबंधपरक गहराई बनाए रखता है, बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में स्वाभाविक। ‘ये काम’ सामान्य पाठक के लिए ‘ये बातें’ से अधिक स्पष्ट रूप से पूर्ववर्ती शत्रुतापूर्ण कार्यों की ओर संकेत करता है।
