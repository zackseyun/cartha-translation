    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: संवाद में ἀποκρίνομαι के सामान्य कथात्मक अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: द्वितीय पुरुष बहुवचन को अप्रत्यक्ष कर्म के रूप में सहज हिन्दी वाक्य-विन्यास में रखता है।
- source_word: Ἰησοῦς
  choice: यीशु
  rationale: नाम का प्रचलित मानक हिन्दी रूप।
- source_word: Ἄρτι
  choice: अब
  rationale: वर्तमान क्षण की तात्कालिकता को संक्षिप्त और स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: πιστεύετε
  choice: विश्वास करते हो
  rationale: πιστεύω का पारदर्शी और यूहन्ना के प्रसंग के अनुरूप सामान्य हिन्दी अनुवाद; बहुवचन संबोधन को ‘करते हो’ से व्यक्त किया गया है।
theological_decisions:
- issue: Ἄρτι πιστεύετε; का प्रश्नात्मक या कथनात्मक बल
  choice: “क्या अब तुम विश्वास करते हो?” के रूप में आलंकारिक प्रश्न
  alternative: “अब तुम विश्वास करते हो।”
  rationale: यूनानी पाठ को विराम-चिह्न के आधार पर कथन भी समझा जा सकता है, पर अगले पद में शिष्यों के तितर-बितर होने की बात प्रश्नात्मक पाठ के तनाव और संभावित विडंबना का समर्थन करती है। पाद-टिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, स्वाभाविक और गरिमापूर्ण संवाद-शैली। ‘तुम’ मूल यूनानी के बहुवचन संबोधन को प्रसंगानुकूल ढंग से व्यक्त करता है।
