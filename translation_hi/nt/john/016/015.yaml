  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: hi
  text: जो कुछ पिता के पास है, वह मेरा है। इसी कारण मैंने कहा कि वह जो मेरा है, उसमें से ग्रहण करता है[a] और तुम्हें बताएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जो मेरा है, उसमें से लेता है।”
    reason: यूनानी λαμβάνει का अर्थ ‘ग्रहण करता है’ या ‘लेता है’ हो सकता है।
lexical_decisions:
- source_word: πάντα ὅσα
  choice: जो कुछ
  rationale: यह स्वाभाविक हिन्दी में समग्रता और व्यापकता व्यक्त करता है।
- source_word: ἔχει ὁ πατὴρ
  choice: पिता के पास है
  rationale: ἔχω का सीधा और सहज हिन्दी रूप; यह अधिकार या स्वामित्व की अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: ἐμά ἐστιν
  choice: वह मेरा है
  rationale: यूनानी के प्रबल स्वत्व-सूचक कथन को सीधे रूप में सुरक्षित रखता है।
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: कारणात्मक और निष्कर्षसूचक संबंध को स्पष्ट, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἶπον
  choice: मैंने कहा
  rationale: एओरिस्ट का स्वाभाविक सामान्य भूतकालीन अनुवाद।
- source_word: ἐκ τοῦ ἐμοῦ λαμβάνει
  choice: वह मुझसे ग्रहण करता है
  rationale: ἐκ स्रोत को दर्शाता है और λαμβάνει में निहित लेने/पाने की अर्थ-सीमा को ‘ग्रहण करता है’ अपेक्षाकृत तटस्थ ढंग से व्यक्त करता है।
- source_word: ἀναγγελεῖ ὑμῖν
  choice: तुम्हें बताएगा
  rationale: भविष्यकाल को बनाए रखते हुए शिष्यों को प्रकट या सूचित करने का भाव सहज हिन्दी में देता है।
theological_decisions:
- issue: पिता के पास जो कुछ है, उससे पुत्र का संबंध
  choice: जो कुछ पिता के पास है, वह मेरा है
  alternative: पिता का जो कुछ है, वह मेरा है
  rationale: मुख्य पाठ पिता की समस्त वस्तुओं/अधिकारों पर पुत्र के प्रबल स्वत्व-दावे को बनाए रखता है, पर बाद की धर्मवैज्ञानिक शब्दावली नहीं जोड़ता।
- issue: आत्मा का पुत्र से ग्रहण करना
  choice: वह मुझसे ग्रहण करता है
  alternative: वह जो मेरा है, उसमें से लेता है
  rationale: ἐκ τοῦ ἐμοῦ की दीर्घवृत्तीय रचना और λαμβάνω के ‘लेना/ग्रहण करना’ दोनों संभव भावों को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए बहुवचन ‘तुम्हें’ रखा गया है। भाषा सहज और गरिमापूर्ण है, तथा मूल की स्वत्व-संबंधी प्रबलता और ग्रहण/लेने की अर्थगत अस्पष्टता सुरक्षित है।
