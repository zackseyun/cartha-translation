id: JHN.16.21
reference: John 16:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: hi
  text: जब कोई स्त्री बच्चे को जन्म दे रही होती है, तो उसे दुःख होता है, क्योंकि उसकी घड़ी आ गई है; पर बच्चे के जन्म के बाद वह उस कष्ट को अब याद नहीं करती, क्योंकि उसे इस बात का आनन्द होता है कि संसार में एक मनुष्य[a] का जन्म हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक पुरुष।” यूनानी ἄνθρωπος का अर्थ “मनुष्य” या अधिक सामान्य रूप से “मानव प्राणी” हो सकता है; यहाँ इसका अर्थ सामान्य है, विशेष रूप से पुरुष शिशु नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: स्त्री
  rationale: प्रसव के सामान्य उदाहरण में γυνή का अर्थ यहाँ ‘स्त्री’ है, न कि विशेष रूप से ‘पत्नी’।
- source_word: ὅταν τίκτῃ
  choice: जब स्त्री बच्चे को जन्म दे रही होती है
  rationale: वर्तमानकालिक भाव सामान्य परिस्थिति और जारी प्रसव-प्रक्रिया को व्यक्त करता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: λύπην ἔχει
  choice: उसे दुःख होता है
  rationale: λύπη केवल शारीरिक पीड़ा तक सीमित नहीं, बल्कि दुःख और व्याकुलता भी व्यक्त करता है; प्रसंग में दुःख से आनन्द की ओर परिवर्तन प्रमुख है।
- source_word: ἡ ὥρα αὐτῆς
  choice: उसकी घड़ी
  rationale: ‘घड़ी’ प्रसव के आ पहुँचे समय को बताने के साथ यूहन्ना में ὥρα की विषयगत प्रतिध्वनि भी बनाए रखती है।
- source_word: γεννήσῃ τὸ παιδίον
  choice: वह बच्चे को जन्म दे चुकी होती है
  rationale: अोरिस्ट रूप पूर्ण हो चुकी घटना की ओर संकेत करता है; ‘जन्म दे चुकी होती है’ उस पूर्णता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐκέτι μνημονεύει
  choice: फिर याद नहीं करती
  rationale: यह μνημονεύω का सीधा और प्रचलित हिन्दी रूप है।
- source_word: τῆς θλίψεως
  choice: उस कष्ट को
  rationale: प्रसव के संदर्भ में θλῖψις कठिन पीड़ा और संकट को दर्शाता है; ‘कष्ट’ सहज है और अनावश्यक पारिभाषिक अर्थ नहीं जोड़ता।
- source_word: διὰ τὴν χαράν
  choice: क्योंकि उसे ... आनन्द होता है
  rationale: διά कारण व्यक्त करता है; हिन्दी वाक्य-विन्यास में आनन्द के कारण को स्पष्ट रूप से जोड़ना स्वाभाविक है।
- source_word: ὅτι ἐγεννήθη
  choice: इस बात का ... कि ... जन्म हुआ है
  rationale: ὅτι आनन्द के आधार अथवा विषय को प्रस्तुत करता है; यह रचना दोनों को स्वाभाविक रूप से बनाए रखती है।
- source_word: ἄνθρωπος
  choice: एक मनुष्य
  rationale: ἄνθρωπος यहाँ सामान्य अर्थ में नवजात मानव को सूचित करता है, विशेष रूप से पुरुष शिशु को नहीं; ‘मनुष्य’ स्रोत की शब्दगत विशेषता को सुरक्षित रखता है।
- source_word: εἰς τὸν κόσμον
  choice: संसार में
  rationale: यह जन्म लेकर संसार में आने के सामान्य अर्थ को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἄνθρωπος का सामान्य, लिंग-अविशिष्ट अर्थ
  choice: एक मनुष्य
  alternative: एक बच्चा / एक पुरुष
  rationale: व्याकरणिक रूप पुल्लिंग है, पर संदर्भ में अर्थ सामान्य मानव का है। ‘एक मनुष्य’ स्रोत के शब्द को बनाए रखते हुए यह संकेत नहीं देता कि शिशु अनिवार्यतः पुरुष है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली अपनाई गई है। ‘उसकी घड़ी’ को यूहन्ना-संबंधी प्रतिध्वनि बनाए रखने के लिए रखा गया है; ‘एक मनुष्य’ जानबूझकर स्रोत के सामान्य ἄνθρωπος को दर्शाता है।
