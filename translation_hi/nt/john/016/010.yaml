  yaml_path: translation/nt/john/016/010.yaml
  text: and concerning righteousness[a], because I am going to the Father and you no longer see me.
translation:
  language: hi
  text: और धार्मिकता[a] के विषय में, क्योंकि मैं पिता के पास जा रहा हूँ और अब तुम मुझे फिर नहीं देखोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्याय’। यूनानी शब्द का अर्थ ‘धार्मिकता’ और ‘न्याय’ दोनों हो सकता है। यहाँ मुख्य पाठ में ‘धार्मिकता’ रखा गया है, क्योंकि संदर्भ पिता के पास जाने के द्वारा यीशु के सही ठहराए जाने की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ
  choice: के विषय में
  rationale: यह पद 9–11 की समानांतर सूची का भाग है; ‘के विषय में’ उस संरचनात्मक संबंध को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: यहाँ शब्द सही होने या सही ठहराए जाने के भाव से जुड़ा है, विशेषकर यीशु के पिता के पास जाने के संदर्भ में। ‘न्याय’ इसका संभव अर्थ है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
- source_word: δέ
  choice: और
  rationale: δέ यहाँ तीखा विरोध नहीं, बल्कि सूची के अगले बिंदु की ओर बढ़ना दिखाता है; इसलिए ‘और’ उपयुक्त है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: ὅτι यहाँ कारण प्रस्तुत करता है; ‘क्योंकि’ उसके कारणसूचक बल को स्पष्ट रखता है।
- source_word: πρὸς τὸν πατέρα
  choice: पिता के पास
  rationale: गति-सूचक ὑπάγω के साथ πρός गंतव्य दर्शाता है। हिन्दी में व्यक्ति के संदर्भ में ‘पिता के पास’ स्वाभाविक है और मूल के निश्चित संबंधसूचक पद ‘पिता’ को बनाए रखता है।
- source_word: ὑπάγω
  choice: जा रहा हूँ
  rationale: वर्तमान काल संदर्भ में निकट भविष्य की ओर संकेत करता है; ‘जा रहा हूँ’ प्रस्थान की निकटता और जीवंतता दोनों रखता है।
- source_word: οὐκέτι
  choice: फिर नहीं
  rationale: यह वर्तमान बिंदु के बाद देखना समाप्त होने का भाव संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θεωρεῖτέ
  choice: देखते
  rationale: संदर्भ में इसका सीधा अर्थ दृष्टि से देखना है; ‘देखते’ आधुनिक और सहज हिन्दी है।
theological_decisions:
- issue: δικαιοσύνη का धर्मवैज्ञानिक रूप से भारयुक्त अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: ‘धार्मिकता’ यीशु के पिता के पास जाने द्वारा उसके सही ठहराए जाने या निर्दोष सिद्ध होने की संभावित संदर्भगत दिशा को बेहतर बनाए रखती है। फिर भी यूनानी शब्द में ‘न्याय’ का अर्थ भी संभव है, जिसे पाद-टिप्पणी में सुरक्षित रखा गया है ताकि अर्थ-क्षेत्र अनावश्यक रूप से संकुचित न हो।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और पद 9–11 की समानांतर वाक्य-संरचना के अनुरूप है। ‘पिता’ को मूल पाठ के अनुसार रखा गया है, ‘मेरे पिता’ नहीं किया गया।
