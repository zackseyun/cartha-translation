source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ⸂ἐν τῇ ἀληθείᾳ πάσῃ⸃, οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ, ἀλλ’ ὅσα ⸀ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: hi
  text: परन्तु जब वह, सत्य का आत्मा, आएगा, तब वह तुम्हें सम्पूर्ण सत्य में मार्गदर्शन करेगा। क्योंकि वह अपनी ओर से नहीं बोलेगा, बल्कि जो कुछ वह सुनेगा, वही बोलेगा; और वह तुम्हें आने वाली बातें बताएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν δὲ
  choice: परन्तु जब
  rationale: ὅταν की समयसूचक और भविष्याभिमुख शक्ति तथा δέ के हल्के विरोध/क्रम-विकास—दोनों को स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἔλθῃ ἐκεῖνος
  choice: जब वह ... आएगा
  rationale: ὅταν के साथ aorist subjunctive यहाँ भविष्य में होने वाली घटना बताता है। ἐκεῖνος का व्यक्तिगत संकेत हिन्दी के ‘वह’ से सुरक्षित रहता है।
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: सत्य का आत्मा
  rationale: यूहन्ना की विशिष्ट संज्ञा में संबंधकारक ‘सत्य का’ को औपचारिक रूप से बनाए रखा गया है; प्रसंग पवित्र आत्मा की ओर संकेत करता है।
- source_word: ὁδηγήσει ὑμᾶς
  choice: तुम्हें ... मार्ग दिखाएगा
  rationale: ὁδηγέω का मार्गदर्शन/राह दिखाने का रूपक सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: ἐν τῇ ἀληθείᾳ πάσῃ
  choice: सम्पूर्ण सत्य में
  rationale: ἐν का मूल अर्थ ‘में’ हिन्दी में ὁδηγέω के साथ स्वाभाविक है और यूनानी पाठ की स्थानगत/क्षेत्रगत अभिव्यक्ति को बिना अनावश्यक दिशात्मक विस्तार के बचाता है। πάσῃ और निश्चित पदबंध का अर्थ ‘सम्पूर्ण सत्य’ है।
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: क्योंकि वह अपनी ओर से नहीं बोलेगा
  rationale: ἀφ’ ἑαυτοῦ का ‘अपनी ओर से’ सटीक और स्वाभाविक हिन्दी है; यह निर्भरता का संबंध रखता है, पर ‘अपने अधिकार से’ जैसी व्याख्या नहीं जोड़ता।
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: बल्कि जो कुछ वह सुनेगा, वही बोलेगा
  rationale: भविष्यकाल और सुनने के बाद बोलने का क्रम सुरक्षित है। ‘वही’ हिन्दी में विरोध और सीमाबोध को स्पष्ट करता है।
- source_word: τὰ ἐρχόμενα
  choice: आनेवाली बातें
  rationale: संज्ञीकृत वर्तमान कृदन्त आगामी घटनाओं/वास्तविकताओं को दर्शाता है; ‘बातें’ अर्थ को खुला रखता है और केवल भविष्यवाणियों तक सीमित नहीं करता।
- source_word: ἀναγγελεῖ ὑμῖν
  choice: तुम्हें बताएगा
  rationale: ἀναγγέλλω के सूचित करने/प्रकट करके बताने के अर्थ को सामान्य पाठक के लिए सहज भाषा में रखा गया है।
theological_decisions:
- issue: आत्मा के लिए व्यक्तिगत संकेत
  choice: ‘वह’ का प्रयोग
  alternative: ‘आत्मा’ को दोहराना या निर्जीव संकेत देना
  rationale: यूनानी ἐκεῖνος पुल्लिंग व्यक्तिगत संकेत है, यद्यपि πνεῦμα व्याकरणतः नपुंसकलिंग है। हिन्दी ‘वह’ स्रोत में उपस्थित व्यक्तिपरक संदर्भ को बनाए रखता है।
- issue: ἐν τῇ ἀληθείᾳ πάσῃ का अर्थ
  choice: ‘सम्पूर्ण सत्य में’
  alternative: ‘सम्पूर्ण सत्य की ओर’ या ‘सम्पूर्ण सत्य तक’
  rationale: हिन्दी में ‘मार्ग दिखाना ... में’ बोधगम्य है और ἐν को सीधे सुरक्षित रखता है। दिशात्मक विकल्प सम्भव है, पर वह यूनानी पूर्वसर्ग को अधिक स्पष्ट रूप से परिणाम/गंतव्य मानता है।
- issue: आत्मा के बोलने की निर्भरता
  choice: ‘अपनी ओर से नहीं बोलेगा’
  alternative: ‘अपने अधिकार से नहीं बोलेगा’
  rationale: मुख्य पाठ स्रोत की अभिव्यक्ति को रखता है और त्रित्व के भीतर अधिकार या अधीनता की कोई विस्तृत धर्मवैज्ञानिक व्याख्या आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘अर्थात्’ apposition को स्पष्ट करता है; ‘सम्पूर्ण सत्य’, ‘अपनी ओर से’ और ‘आनेवाली बातें’ मूल की अर्थगत खुलावट बनाए रखते हैं।
