id: JHN.16.19
reference: John 16:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: hi
  text: यीशु जान गए कि वे उनसे पूछना चाहते थे। तब उन्होंने उनसे कहा, “क्या तुम आपस में इसी बात पर चर्चा कर रहे हो कि[a] मैंने कहा, ‘थोड़ी देर में तुम मुझे नहीं देखोगे, और फिर थोड़ी देर में तुम मुझे देखोगे[b]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम आपस में इसी बात पर चर्चा कर रहे हो क्योंकि मैंने कहा...?” यूनानी संयोजक चर्चा की विषयवस्तु या उसका कारण—दोनों बता सकता है।
    reason: alternative_reading
  - marker: b
    text: 'यहाँ यूनानी में ‘देखने’ के लिए दो अलग क्रियाएँ हैं: पहली (θεωρέω) में ध्यान से देखने या निहारने का भाव हो सकता है, जबकि दूसरी (ὁράω) सामान्यतः ‘देखना’ है। मुख्य पाठ में दोनों के लिए ‘देखना’ रखा गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: जान गए
  rationale: यहाँ क्रिया यीशु के शिष्यों की मंशा जान लेने को व्यक्त करती है। ‘जान गए’ स्वाभाविक हिन्दी है और प्रसंग में उत्पन्न हुई जानकारी का भाव भी देता है।
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: वे उनसे पूछना चाहते थे
  rationale: यह शिष्यों की जारी मंशा को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘पूछताछ करना’ अनावश्यक रूप से औपचारिक या कठोर होता।
- source_word: ζητεῖτε μετ’ ἀλλήλων
  choice: तुम आपस में ... चर्चा कर रहे हो
  rationale: यद्यपि ζητέω का मूल अर्थ ‘खोजना’ हो सकता है, इस पारस्परिक प्रसंग में शिष्य कथन का अर्थ समझने के लिए आपस में विचार-विमर्श कर रहे हैं।
- source_word: Μικρὸν
  choice: थोड़ी देर
  rationale: नपुंसकलिंग विशेषण यहाँ थोड़े समय की अवधि के लिए मुहावरेदार प्रयोग है।
- source_word: οὐ θεωρεῖτέ με
  choice: तुम मुझे नहीं देखोगे
  rationale: यूनानी में वर्तमान रूप है, पर ‘थोड़ी देर’ से बनने वाले भावी समय-संदर्भ को हिन्दी स्वाभाविक रूप से भविष्यत् काल में व्यक्त करती है। ‘अब और नहीं’ जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: ὄψεσθέ με
  choice: तुम मुझे देखोगे
  rationale: भविष्यत् रूप को सीधे और स्वाभाविक ढंग से प्रस्तुत किया गया है।
theological_decisions:
- issue: ὅτι का संबंध—चर्चा की विषयवस्तु या उसका कारण
  choice: मुख्य पाठ में ‘इस बात पर चर्चा ... कि मैंने कहा’ द्वारा विषयवस्तु का अर्थ
  alternative: ‘इसलिए चर्चा ... क्योंकि मैंने कहा’ अर्थात कारणसूचक अर्थ
  rationale: ὅτι दोनों संबंध व्यक्त कर सकता है। प्रत्यक्ष उद्धरण के पहले विषयवस्तुसूचक ‘कि’ वाक्य को सहज रखता है, जबकि कारणसूचक संभावना पादटिप्पणी में सुरक्षित है।
- issue: θεωρέω और ὁράω के बीच शब्दगत अंतर
  choice: दोनों के लिए ‘देखना’
  alternative: पहले को ‘निहारना/दृष्टि से देखना’ और दूसरे को ‘देखना’
  rationale: प्रसंग का बल थोड़े समय के लिए न देख पाने और फिर देखने पर है। हिन्दी में कृत्रिम भेद आरोपित न करते हुए यूनानी के शब्दगत अंतर को पादटिप्पणी में बताया गया है।
- issue: यीशु के कथन का प्रश्नात्मक स्वरूप
  choice: ‘क्या तुम ... चर्चा कर रहे हो?’
  alternative: 'कथनात्मक रूप: ‘तुम आपस में इसी विषय पर पूछ रहे हो।’'
  rationale: यूनानी वाक्य को वास्तविक प्रश्न के रूप में लेना शिष्यों की निजी चर्चा को उजागर करने वाले यीशु के स्वर को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। संबोधन में बहुवचन ‘तुम’ शिष्यों के सामूहिक संबोधन को स्वाभाविक रूप से व्यक्त करता है। उद्धरण के भीतर समय-क्रम स्पष्ट करने के लिए ‘थोड़ी देर और, तब’ तथा ‘फिर थोड़ी देर बाद’ प्रयोग किए गए हैं।
