id: JHN.8.20
reference: John 8:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ταῦτα τὰ ῥήματα ⸀ἐλάλησεν ἐν τῷ γαζοφυλακίῳ διδάσκων ἐν τῷ ἱερῷ· καὶ οὐδεὶς ἐπίασεν αὐτόν, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: hi
  text: उसने ये बातें मंदिर[a] के भंडार-स्थान में शिक्षा देते हुए कहीं, और किसी ने उसे नहीं पकड़ा, क्योंकि उसकी घड़ी अभी नहीं आई थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “मंदिर-परिसर में।” यूनानी शब्द केवल भीतरी पवित्र भवन को नहीं, बल्कि पूरे मंदिर-परिसर को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यूहन्ना में “उसकी घड़ी” यीशु के दुःख और महिमा के लिए ठहराए हुए समय को दर्शाती है; अथवा, “उसकी ठहराई हुई घड़ी।”
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα
  choice: ये बातें
  rationale: ῥήματα यहाँ ठीक पहले कही गई बातों को सूचित करता है। आधुनिक हिन्दी में ‘ये बातें ... कहीं’ स्वाभाविक है और आशय को बिना बढ़ाए व्यक्त करता है।
- source_word: ἐλάλησεν
  choice: कहीं
  rationale: λαλέω बोलने को व्यक्त करता है; ‘बातें’ के साथ हिन्दी में स्त्रीलिंग बहुवचन क्रिया ‘कहीं’ स्वाभाविक बैठती है।
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: मन्दिर के भण्डार-स्थान में
  rationale: γαζοφυλάκιον मन्दिर के कोष अथवा भेंट-संग्रह से जुड़े स्थान को दर्शाता है, सम्भवतः केवल एक पेटी को नहीं। ‘भण्डार-स्थान’ स्थानवाचक व्यापकता बनाए रखता है।
- source_word: διδάσκων
  choice: शिक्षा देते समय
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ-साथ चल रही क्रिया बताता है; यह हिन्दी प्रयोग उस समकालिकता को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर में
  rationale: ἱερόν पूरे मन्दिर-परिसर को दर्शा सकता है, केवल भीतरी पवित्र भवन को नहीं। मुख्य पाठ में सामान्य ‘मन्दिर’ रखा गया है और पादटिप्पणी में सीमा स्पष्ट की गई है।
- source_word: ἐπίασεν
  choice: पकड़ा
  rationale: πιάζω का अर्थ पकड़ना या काबू में करना है। ‘पकड़ा’ विरोधपूर्ण कार्रवाई को व्यक्त करता है, पर औपचारिक कानूनी ‘गिरफ़्तार’ का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: οὔπω ἐληλύθει
  choice: अभी तक नहीं आया था
  rationale: पूर्णभूत रूप उस कथानक-बिन्दु तक समय के न आने को दर्शाता है; हिन्दी वाक्यांश काल और यूहन्नाई अभिव्यक्ति दोनों बनाए रखता है।
- source_word: ἡ ὥρα αὐτοῦ
  choice: उसका समय
  rationale: ὥρα का मूल अर्थ ‘घड़ी/समय’ है, पर यहाँ एक नियुक्त निर्णायक समय का विषयगत अर्थ है। आधुनिक हिन्दी में ‘उसका समय’ सहज है; पादटिप्पणी इसके विशेष यूहन्नाई अर्थ को सुरक्षित रखती है।
theological_decisions:
- issue: यूहन्ना में ἡ ὥρα αὐτοῦ का विषयगत अर्थ
  choice: मुख्य पाठ में ‘उसका समय’ और पादटिप्पणी में ‘उसकी ठहराई हुई घड़ी’ का विकल्प व विषयगत अर्थ
  alternative: मुख्य पाठ में ‘उसकी घड़ी’ या ‘उसकी ठहराई हुई घड़ी’
  rationale: हिन्दी में ‘उसकी घड़ी’ अकेले कुछ अस्वाभाविक या घड़ी-वस्तु के अर्थ में समझी जा सकती है। ‘उसका समय’ पठनीयता देता है, जबकि पादटिप्पणी यीशु के दुःख उठाने और महिमा पाने के नियत चरम समय की धार्मिक गहराई को स्पष्ट करती है, उसे केवल सामान्य काल-सूचना में नहीं बदलती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मन्दिर’ की प्रचलित वर्तनी अपनाई गई है। दो छोटे वाक्यों से स्थान, शिक्षा और न पकड़े जाने के कारण का कथात्मक क्रम स्पष्ट रहता है।
