id: JHN.8.44
reference: John 8:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: hi
  text: तुम अपने पिता, अर्थात् शैतान, से हो और अपने पिता की अभिलाषाएँ पूरी करना चाहते हो। वह आरम्भ से ही हत्यारा था और सत्य में स्थिर नहीं है,[a] क्योंकि उसमें सत्य है ही नहीं। जब वह झूठ बोलता है,[b] तो अपने ही स्वभाव से बोलता है,[c] क्योंकि वह झूठा है और झूठ का पिता है।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सत्य में खड़ा नहीं है।” यूनानी पद यह आवश्यक रूप से स्पष्ट नहीं करता कि वह पहले सत्य में था और बाद में उससे हट गया।
    reason: theological_ambiguity
  - marker: b
    text: शाब्दिक रूप से, “जब वह उस झूठ को बोलता है।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “वह अपनी ही चीज़ों में से बोलता है,” अर्थात जो उसके अपने स्वभाव या चरित्र का है।
    reason: lexical_alternative
  - marker: d
    text: यूनानी में शाब्दिक रूप से “और उसका पिता” है; सर्वनाम का सबसे स्वाभाविक संदर्भ “झूठ” है। इसे अधिक सामान्य अर्थ में “झूठों का पिता” भी समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  choice: अपने पिता शैतान से हो
  rationale: ἐκ स्रोत, उत्पत्ति या संबंध व्यक्त करता है। यह हिन्दी में स्वाभाविक रहते हुए कठोर आध्यात्मिक संबंध को बनाए रखता है।
- source_word: ἐπιθυμίας
  choice: अभिलाषाएँ
  rationale: यह शब्द यहाँ व्यापक इच्छाओं या चाहतों को दर्शाता है; आधुनिक हिन्दी में इसे केवल लैंगिक अर्थ तक सीमित नहीं करता।
- source_word: θέλετε ποιεῖν
  choice: पूरी करना चाहते हो
  rationale: यह इच्छा और संकल्प दोनों का स्पष्ट, स्वाभाविक हिन्दी रूप है।
- source_word: ἀνθρωποκτόνος
  choice: हत्यारा
  rationale: मनुष्यों की हत्या करने वाले के लिए सीधा और प्रसंगानुकूल शब्द।
- source_word: ἀπ’ ἀρχῆς
  choice: आरम्भ से ही
  rationale: यूहन्ना की समय-संबंधी अभिव्यक्ति को स्पष्ट रूप से बनाए रखता है; ‘ही’ बल को स्वाभाविक बनाता है।
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: सत्य में स्थिर नहीं रहा है
  rationale: ἕστηκεν की स्थिर खड़े रहने की छवि और परिणामी अवस्था को व्यक्त करता है, पर पूर्व में सत्य में रहने और फिर पतित होने को निश्चित रूप से नहीं कहता।
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: जब वह झूठ बोलता है
  rationale: यूनानी का शाब्दिक रूप ‘जब वह उस झूठ को बोलता है’ है, पर हिन्दी में ‘झूठ बोलता है’ स्वाभाविक है; शाब्दिक संरचना पादटिप्पणी में दी गई है।
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: अपने ही स्वभाव से बोलता है
  rationale: शाब्दिक अर्थ ‘अपनी ही चीज़ों में से’ है; प्रसंग में यह उसके अपने चरित्र या अंतःस्रोत से निकलने वाली वाणी बताता है।
- source_word: ψεύστης
  choice: झूठा
  rationale: सीधा और प्रचलित हिन्दी समतुल्य।
- source_word: ὁ πατὴρ αὐτοῦ
  choice: झूठ का पिता
  rationale: निकटतम और प्रसंगानुकूल पूर्वपद τὸ ψεῦδος है। हिन्दी में ‘उसका पिता’ अस्पष्ट और भ्रामक होगा; ‘झूठ का पिता’ संबंध स्पष्ट करता है, जबकि वैकल्पिक व्याख्या पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: ὁ πατὴρ αὐτοῦ का संदर्भ
  choice: ‘झूठ का पिता’—अर्थात शैतान झूठ का स्रोत है
  alternative: ‘उसका पिता’; या सामान्यीकृत रूप ‘झूठों का पिता’
  rationale: निकटतम संगत पूर्वपद τὸ ψεῦδος (‘झूठ’) है। ‘उसका पिता’ शैतान के किसी पिता की अनावश्यक और संदिग्ध धारणा उत्पन्न कर सकता है, जबकि ‘झूठों का पिता’ यूनानी के एकवचन को बहुवचन बना देता है।
- issue: क्या शैतान पहले सत्य में स्थिर था
  choice: ऐसी पूर्व अवस्था को निश्चित न करना
  alternative: ‘सत्य में बना नहीं रहा,’ जो पहले सत्य में होने का अधिक स्पष्ट संकेत दे सकता है
  rationale: नकार सहित ἕστηκεν उसके सत्य में स्थिर न होने को बताता है, पर यह पद अकेले पूर्व सहभागिता और पतन की क्रमिक कथा को निर्विवाद रूप से स्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सीधी, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘शैतान,’ ‘सत्य,’ ‘झूठा’ और ‘पिता’ जैसी यूहन्ना-संबंधी प्रमुख संज्ञाएँ बनाए रखी गई हैं। ‘अभिलाषाएँ’ व्यापक नैतिक इच्छा व्यक्त करती है। मुख्य पाठ में स्वाभाविकता रखी गई है और वास्तविक शाब्दिक या धर्मवैचारिक अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
