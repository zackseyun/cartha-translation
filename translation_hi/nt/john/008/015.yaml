  yaml_path: translation/nt/john/008/015.yaml
  text: You judge according to the flesh[a]; I judge no one.
translation:
  language: hi
  text: तुम शरीर के अनुसार न्याय करते हो[a]; मैं किसी का न्याय नहीं करता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानवीय मापदंडों से”; अथवा, “बाहरी रूप देखकर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: तुम
  rationale: स्पष्ट बहुवचन सर्वनाम वाक्य में ἐγώ के साथ विरोध उभारता है। आधुनिक हिन्दी में ‘तुम’ स्वाभाविक है; क्रिया का बहुवचन रूप भी संबोधन को स्पष्ट करता है।
- source_word: κατὰ τὴν σάρκα
  choice: शरीर के अनुसार
  rationale: यह निकट और स्रोत-संवेदी अनुवाद यूहन्ना की शब्दावली तथा वाक्यांश की अर्थगत खुलावट को बनाए रखता है; प्रसंग में इसके सम्भावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: κρίνετε
  choice: न्याय करते हो
  rationale: वर्तमानकालीन क्रिया का सीधा और सामान्य हिन्दी रूप; यहाँ ‘निर्णय देते हो’ सम्भव है, पर कम निकट है।
- source_word: ἐγὼ
  choice: मैं
  rationale: स्पष्ट प्रथम-पुरुष सर्वनाम ‘तुम’ के साथ तीखा विरोध बनाए रखता है।
- source_word: οὐ κρίνω οὐδένα
  choice: मैं किसी का न्याय नहीं करता
  rationale: οὐδένα की पूर्ण नकारात्मकता को स्वाभाविक हिन्दी में व्यक्त करता है और यूनानी कथन की संक्षिप्तता बनाए रखता है।
theological_decisions:
- issue: κατὰ τὴν σάρκα में σάρξ का अर्थ
  choice: मुख्य पाठ में ‘शरीर के अनुसार’
  alternative: ‘मानवीय मापदंडों से’ अथवा ‘बाहरी रूप देखकर’
  rationale: प्रसंग मानव-केंद्रित या सतही निर्णय की ओर संकेत कर सकता है, पर मुख्य पाठ में ‘शरीर’ रखने से वाक्यांश को केवल एक व्याख्या तक सीमित नहीं किया जाता और यूहन्ना की धर्मवैचारिक शब्दावली बनी रहती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘शरीर के अनुसार’ जानबूझकर स्रोत के निकट रखा गया है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में हैं।
