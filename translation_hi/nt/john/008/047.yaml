id: JHN.8.47
reference: John 8:47
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: hi
  text: जो परमेश्वर से है[a], वह परमेश्वर के वचन सुनता है। इसी कारण तुम नहीं सुनते, क्योंकि[b] तुम परमेश्वर से नहीं हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परमेश्वर से’ का अनुवाद ‘परमेश्वर के’ भी किया जा सकता है। यूनानी पद स्रोत या उद्गम पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: 'या: “इसी कारण तुम यह नहीं सुनते कि तुम परमेश्वर से नहीं हो।” यूनानी संयोजक ὅτι का अर्थ ‘कि’ भी हो सकता है, पर इस प्रसंग में कारणसूचक अर्थ ‘क्योंकि’ अधिक उपयुक्त है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ὢν
  choice: जो ... है, वह
  rationale: लेखयुक्त वर्तमान कृदन्त यहाँ व्यक्ति-वर्ग को संज्ञा के रूप में दर्शाता है। हिन्दी की ‘जो ... है, वह’ रचना इसके एकवचन प्रतिनिधिक भाव को स्वाभाविक रूप से बनाए रखती है।
- source_word: ἐκ τοῦ θεοῦ
  choice: परमेश्वर से
  rationale: ἐκ स्रोत या उद्गम का संकेत देता है। ‘परमेश्वर से’ इस अर्थ को ‘परमेश्वर का’ की अपेक्षा अधिक सीधे सुरक्षित रखता है, यद्यपि हिन्दी में यह जानबूझकर कुछ असामान्य धर्मवैचारिक भाषा बनी रहती है।
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: परमेश्वर के वचन
  rationale: ῥήματα बहुवचन में परमेश्वर द्वारा कहे गए शब्दों या कथनों को दर्शाता है। ‘वचन’ आधुनिक धार्मिक हिन्दी में गरिमापूर्ण और समझने योग्य है तथा इसे अस्पष्ट रूप से ‘आज्ञाएँ’ नहीं बनाता।
- source_word: ἀκούει / ἀκούετε
  choice: सुनता है / सुनते
  rationale: दोनों रूपों के बीच यूनानी पुनरावृत्ति बनाए रखी गई है। प्रसंग में ग्रहणशीलता निहित हो सकती है, पर ‘मानना’ या ‘आज्ञा मानना’ मुख्य पाठ में अर्थ को आवश्यकता से अधिक निश्चित कर देता।
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पद कारण या निष्कर्ष की कड़ी प्रस्तुत करता है। ‘इसी कारण’ स्पष्ट, वर्तमान और यूनानी प्रवाह के अनुरूप है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι को कारणसूचक मानना प्रसंग और वाक्य-प्रवाह में सबसे स्वाभाविक है; वैकल्पिक कथनसूचक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐκ τοῦ θεοῦ οὐκ ἐστέ
  choice: तुम परमेश्वर से नहीं हो
  rationale: पहले प्रयोग के समान स्रोत/उद्गम की भाषा और पद की सममिति बनाए रखी गई है; इसे किसी विशिष्ट व्यवस्थित धर्मसिद्धान्त में नहीं बदला गया।
theological_decisions:
- issue: ‘परमेश्वर से’ होने का अर्थ
  choice: स्रोत/उद्गम की मूल भाषा को ‘परमेश्वर से’ के रूप में बनाए रखा गया।
  alternative: ‘परमेश्वर के हो’ या इसे विशेष रूप से नए जन्म, चुनाव अथवा वाचा-सदस्यता के अर्थ में खोलना।
  rationale: यूहन्ना के कथन में उद्गम, संबंध और पक्षधरता के भाव परस्पर जुड़े हो सकते हैं। मुख्य पाठ इन्हें किसी एक बाद की धर्मसैद्धान्तिक श्रेणी में सीमित नहीं करता।
- issue: ἀκούω का आशय
  choice: ‘सुनना’
  alternative: ‘ध्यान देना’, ‘ग्रहण करना’ या ‘आज्ञा मानना’
  rationale: प्रसंग में सच्चा सुनना ग्रहणशील प्रत्युत्तर को समेट सकता है, लेकिन यूनानी क्रिया का सीधा अर्थ ‘सुनना’ है। उसी शब्द की पुनरावृत्ति को सुरक्षित रखा गया है।
- issue: ὅτι का व्याकरणिक बल
  choice: कारणसूचक—‘क्योंकि’
  alternative: कथनसूचक—‘कि’
  rationale: कारणसूचक अर्थ यीशु के निष्कर्ष को सबसे स्पष्ट रूप से व्यक्त करता है, फिर भी यूनानी की वास्तविक व्याकरणिक संभावना को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली अपनाई गई है। ‘जो ... है, वह’ और ‘इसी कारण’ सामान्य पाठक के लिए स्वाभाविक हैं। ‘परमेश्वर से होना’ की कुछ असामान्य अभिव्यक्ति मूल यूनानी के स्रोत/उद्गम संबंधी तनाव को सुरक्षित रखने के लिए जानबूझकर रखी गई है।
