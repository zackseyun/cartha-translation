  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν· Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: hi
  text: इसलिए यहूदियों[a] ने उससे कहा, “तुम अभी पचास वर्ष के भी नहीं हो, और तुमने अब्राहम को देखा है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया के लोग”; अथवा, यदि यहाँ संकेत अधिक सीमित समूह की ओर है, “यहूदी अगुवे।”
    reason: मूल यूनानी οἱ Ἰουδαῖοι का संदर्भ यूहन्ना में प्रसंग के अनुसार व्यापक या सीमित हो सकता है।
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदियों
  rationale: यह यूनानी पद का सीधा और सामान्य हिन्दी रूप है। इस प्रसंग में मूल पाठ इसे केवल अगुवों तक सीमित नहीं करता; इसलिए अधिक संकीर्ण अर्थ मुख्य पाठ में नहीं जोड़ा गया।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाली प्रतिक्रिया या परिणाम का संबंध दिखाता है और वर्तमान मानक हिन्दी में स्वाभाविक है।
- source_word: Πεντήκοντα ἔτη οὔπω ἔχεις
  choice: तुम अभी पचास वर्ष के भी नहीं हो
  rationale: यूनानी में आयु को ‘वर्ष होना/रखना’ जैसी अभिव्यक्ति से कहा गया है। हिन्दी का स्वाभाविक आयु-सूचक मुहावरा अपनाया गया है; ‘भी’ वक्ताओं के अविश्वास और बल को व्यक्त करता है।
- source_word: ἑώρακας
  choice: तुमने ... देखा है
  rationale: पूर्णकालिक क्रिया का परिणामी भाव हिन्दी के ‘देखा है’ से सुरक्षित रहता है और प्रश्न में व्यक्त अविश्वास भी बना रहता है।
- source_word: καὶ
  choice: और
  rationale: साधारण संयोजक को सीधे ‘और’ रखा गया है; प्रश्नवाचक स्वर ही कथन के अविश्वासपूर्ण बल को प्रकट करता है।
- source_word: Ἀβραὰμ
  choice: अब्राहम
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
theological_decisions:
- issue: यूहन्ना में οἱ Ἰουδαῖοι का संदर्भ
  choice: यहूदी
  alternative: यहूदिया के लोग; यहूदी अगुवे
  rationale: मूल पद संदर्भ के अनुसार व्यापक या सीमित समूह की ओर संकेत कर सकता है, पर इस वाक्य में केवल अगुवों का उल्लेख स्पष्ट नहीं है। अतः मुख्य पाठ में सीधा रूप रखा गया और वास्तविक संदर्भगत अस्पष्टता पादटिप्पणी में सुरक्षित की गई।
translation_notes:
  register: आधुनिक, स्वाभाविक और गरिमापूर्ण मानक हिन्दी। प्रश्न की अविश्वासपूर्ण धार बनाए रखी गई है, और संदर्भगत अस्पष्टता को मुख्य पाठ में संकीर्ण किए बिना पादटिप्पणी में दर्शाया गया है।
