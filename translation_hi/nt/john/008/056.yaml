  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
translation:
  language: hi
  text: तुम्हारा पिता अब्राहम इस बात से बहुत आनंदित हुआ कि वह मेरा दिन[b] देखे[a]; उसने उसे देखा और प्रसन्न हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘मेरा दिन देखने के लिए आनंदित हुआ’ या ‘इस बात से उल्लसित हुआ कि वह मेरा दिन देख सके’ भी हो सकता है। यूनानी ἵνα-वाक्यांश के निकटवर्ती अर्थ एक से अधिक ढंग से व्यक्त किए जा सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘मेरा दिन’ व्यापक रूप से यीशु के मसीही दिन या उनकी प्रतिज्ञा की पूर्ति की ओर संकेत कर सकता है; यह पद अपने आप यह निश्चित नहीं करता कि कौन-सी घटना या समय अभिप्रेत है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀβραὰμ
  choice: अब्राहम
  rationale: हिन्दी बाइबल परंपरा में इस कुलपिता के नाम का मानक रूप।
- source_word: ὁ πατὴρ ὑμῶν
  choice: तुम्हारा पिता
  rationale: सम्बन्धवाचक बल और यीशु द्वारा अपने श्रोताओं को किए गए सीधे सम्बोधन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἠγαλλιάσατο
  choice: बहुत आनंदित हुआ
  rationale: क्रिया के प्रबल हर्ष या उल्लास के भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἵνα ἴδῃ
  choice: देखने को
  rationale: यूनानी उपवाक्य के प्रयोजन, अभिलाषा और प्रत्याशा से जुड़े अर्थों को किसी एक व्याख्या तक सीमित किए बिना संक्षेप में व्यक्त करता है।
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: मेरा दिन
  rationale: मूल रूपक और उसके मसीही तथा कालगत अर्थ-विस्तार को बिना स्पष्ट किए सुरक्षित रखता है।
- source_word: καὶ εἶδεν
  choice: उसने उसे देखा
  rationale: हिन्दी में स्पष्टता के लिए निहित कर्म को व्यक्त किया गया है; ‘उसे’ का संकेत ‘मेरा दिन’ की ओर है।
- source_word: καὶ ἐχάρη
  choice: और प्रसन्न हुआ
  rationale: पहली अधिक प्रबल आनंद-सूचक क्रिया से भेद रखते हुए χαίρω का स्वाभाविक हिन्दी रूप देता है।
theological_decisions:
- issue: ‘मेरा दिन’ का आशय
  choice: ‘मेरा दिन’ को यथावत रखा गया है।
  alternative: इसे यीशु का जन्म, सांसारिक सेवाकाल, क्रूस और पुनरुत्थान, मसीही युग या अंतिम प्रकाशन का दिन कहना।
  rationale: पद स्वयं किसी एक घटना या समय को निश्चित नहीं करता; इसलिए इसकी वास्तविक धर्मवैचारिक व्यापकता और तनाव को अनिर्णीत रखा गया है।
- issue: ἵνα ἴδῃ का बल
  choice: ‘देखने को’
  alternative: ‘इसलिए आनंदित हुआ कि वह देखेगा’ या ‘ताकि वह देखे’
  rationale: यह रूप आगे की ओर देखती अभिलाषा को व्यक्त करता है, पर प्रयोजन और विषय-वस्तु के बीच यूनानी की निकटवर्ती अर्थ-संभावनाओं को कठोरता से नहीं सुलझाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘बहुत आनंदित हुआ’ और ‘प्रसन्न हुआ’ दो अलग यूनानी आनंद-सूचक क्रियाओं के बीच हल्का भेद बनाए रखते हैं।
