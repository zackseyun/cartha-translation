source:
  edition: SBLGNT
  text: καὶ ἐν τῷ νόμῳ δὲ τῷ ὑμετέρῳ γέγραπται ὅτι δύο ἀνθρώπων ἡ μαρτυρία ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/017.yaml
  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: hi
  text: और तुम्हारी व्यवस्था में भी लिखा है कि दो मनुष्यों की गवाही सच्ची है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νόμῳ
  choice: व्यवस्था
  rationale: यहाँ शब्द उस यहूदी शास्त्रीय-कानूनी व्यवस्था को सूचित करता है जिसका यीशु प्रमाण के रूप में उल्लेख करते हैं। हिंदी बाइबल की प्रचलित और स्वाभाविक शब्दावली में ‘व्यवस्था’ उपयुक्त है।
- source_word: ὑμετέρῳ
  choice: तुम्हारी
  rationale: द्वितीय पुरुष के संबंधसूचक रूप को सीधे बनाए रखता है और संवाद में उपस्थित आलंकारिक दूरी को न तो मिटाता है, न ‘तुम्हारी अपनी’ कहकर अनावश्यक रूप से तीखा करता है।
- source_word: γέγραπται
  choice: लिखा है
  rationale: यह शास्त्रीय उद्धरण का स्वाभाविक हिंदी सूत्र है और यूनानी पूर्णकाल के वर्तमान प्रासंगिकता वाले भाव को व्यक्त करता है।
- source_word: δύο ἀνθρώπων
  choice: दो मनुष्यों की
  rationale: ἄνθρωπος का मूल अर्थ ‘मनुष्य’ है। संबंधकारक बहुवचन को हिंदी में ‘दो मनुष्यों की’ द्वारा ठीक व्यक्त किया गया है; यह कानूनी संदर्भ में मानव गवाहों को सूचित करता है और यूनानी से अधिक पुरुष-विशिष्ट अर्थ नहीं जोड़ता।
- source_word: μαρτυρία
  choice: गवाही
  rationale: न्यायिक संदर्भ में ‘गवाही’ आधुनिक, स्पष्ट और स्वाभाविक हिंदी है।
- source_word: ἀληθής
  choice: सच्ची मानी जाती है
  rationale: शाब्दिक अर्थ ‘सच्ची’ है, जबकि प्रसंग में गवाही की स्वीकार्यता या वैधता निहित है। ‘मानी जाती है’ जोड़ने से कानूनी सूक्ति का आशय स्वाभाविक हिंदी में स्पष्ट होता है, बिना उसे केवल ‘वैध’ तक सीमित किए।
- source_word: καὶ ... δὲ
  choice: और ... भी
  rationale: यह संयोजन पिछले कथन से संबंध और हल्का बल दोनों व्यक्त करता है; ‘और ... भी’ हिंदी में इस प्रवाह को स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: ‘तुम्हारी व्यवस्था’ का आलंकारिक बल
  choice: ‘तुम्हारी व्यवस्था’ को सीधे बनाए रखा गया है।
  alternative: ‘व्यवस्था’ या ‘तुम्हारी अपनी व्यवस्था’
  rationale: मूल पाठ में द्वितीय पुरुष संबंधसूचक स्पष्ट है। इसे बनाए रखने से संवाद का तनाव सुरक्षित रहता है, पर इससे यह निष्कर्ष नहीं निकाला जाता कि यीशु व्यवस्था को अस्वीकार कर रहे हैं।
- issue: कानूनी सूक्ति में ἀνθρώπων का अर्थ
  choice: ‘दो मनुष्यों’
  alternative: ‘दो पुरुषों’ या ‘दो व्यक्तियों’
  rationale: यूनानी ἄνθρωπος सामान्यतः मानव व्यक्ति को सूचित कर सकता है। ‘मनुष्यों’ मूल शब्द की व्यापकता और मानवीय गवाहों के कानूनी आशय दोनों को सुरक्षित रखता है; ‘पुरुषों’ अनावश्यक रूप से पुरुष-विशिष्ट सुनाई दे सकता है।
- issue: ἀληθής का कानूनी आशय
  choice: ‘सच्ची मानी जाती है’
  alternative: ‘सच्ची है’ या ‘मान्य है’
  rationale: ‘सच्ची’ मूल शब्द को बनाए रखता है, और ‘मानी जाती है’ प्रसंग में निहित न्यायिक स्वीकार्यता को व्यक्त करता है। इससे सत्यता और कानूनी मान्यता के बीच की अर्थगत गुंजाइश पूरी तरह समाप्त नहीं होती।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘व्यवस्था’ और ‘गवाही’ प्रचलित बाइबलीय तथा न्यायिक शब्दावली हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘दो मनुष्यों’ मूल की व्यापकता को मुख्य पाठ में ही स्पष्ट रूप से व्यक्त करता है।
