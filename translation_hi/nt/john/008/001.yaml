  text: But Jesus[a] went to the Mount of Olives.
translation:
  language: hi
  text: पर यीशु[a] जैतून पर्वत पर चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद व्यभिचार करते पकड़ी गई स्त्री के वृत्तांत (यूहन्ना 7:53–8:11) का भाग है। पाठ-संबंधी प्रमाणों के लिए यूहन्ना 7:53 की टिप्पणी देखें।
    reason: textual_critical
lexical_decisions:
- source_word: πορεύομαι
  choice: चले गए
  rationale: ἐπορεύθη यहाँ रूप में कर्मवाच्य होते हुए भी अर्थ में कर्तृवाच्य है और किसी गंतव्य की ओर साधारण गति को व्यक्त करता है; ‘चले गए’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: ὄρος
  choice: पर्वत
  rationale: ὄρος का मूल अर्थ पर्वत या पहाड़ है; इस प्रसिद्ध भौगोलिक नाम में ‘जैतून पर्वत’ संक्षिप्त, गरिमापूर्ण और प्रचलित रूप है।
- source_word: ἐλαιῶν
  choice: जैतून
  rationale: ἐλαία का संबंध जैतून के वृक्ष से है और यहाँ संबंधकारक बहुवचन स्थापित स्थान-नाम ‘जैतून पर्वत’ का अंग है।
- source_word: δέ
  choice: पर
  rationale: δέ पिछले कथन से हल्का विरोध अथवा कथा की अगली दिशा दिखाता है; ‘पर’ इस संक्रमण को सहज रूप से बनाए रखता है।
theological_decisions:
- issue: यूहन्ना 7:53–8:11 की पाठालोचनात्मक स्थिति
  choice: पद का अनुवाद मुख्य पाठ में रखा और पाठालोचनात्मक सूचना पाद-टिप्पणी में दी
  alternative: पद को कोष्ठकों में रखना या मुख्य पाठ से हटाना
  rationale: प्रदत्त बीजान्टिन यूनानी संस्करण में यह पद उपस्थित है; फिर भी प्राचीन हस्तलिपियों में इस अनुच्छेद की स्थिति से जुड़ी वास्तविक अनिश्चितता को पाद-टिप्पणी द्वारा स्पष्ट करना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘जैतून पर्वत’ को पहचाने जाने योग्य भौगोलिक नाम के रूप में रखा गया है।
