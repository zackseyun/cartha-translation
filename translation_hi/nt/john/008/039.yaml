  text: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν. λέγει αὐτοῖς ὁ Ἰησοῦς· Εἰ τέκνα τοῦ Ἀβραάμ ⸀ἐστε, τὰ ἔργα τοῦ Ἀβραὰμ ⸀ἐποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: hi
  text: उन्होंने उत्तर दिया और उससे कहा, “अब्राहम हमारा पिता है।” यीशु उनसे कहते हैं, “यदि तुम अब्राहम की संतान हो, तो अब्राहम के काम करते।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम अब्राहम की संतान होते, तो अब्राहम के काम करते।” यूनानी परिणाम-वाक्य की अपूर्ण भूतकाल क्रिया को तथ्य के विपरीत निहितार्थ के रूप में समझा जा सकता है।
    reason: सशर्त वाक्य में वर्तमान पूर्वपक्ष और अपूर्ण भूतकाल परिणाम से उत्पन्न व्याकरणिक तनाव तथा स्वाभाविक हिन्दी का वैकल्पिक रूप सुरक्षित रखना।
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: उन्होंने उत्तर में उससे कहा
  rationale: ‘उत्तर में ... कहा’ यूनानी के उत्तर देने और कहने के दोहरे कथन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: अब्राहम हमारा पिता है
  rationale: यह दावा हिन्दी में स्वाभाविक और बलयुक्त है तथा वंश-संबंध की भाषा को ज्यों का त्यों रखता है।
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: यीशु उनसे कहते हैं
  rationale: वर्तमान काल यूनानी के ऐतिहासिक वर्तमान की कथात्मक सजीवता को सुरक्षित रखता है।
- source_word: τέκνα
  choice: संतान
  rationale: ‘संतान’ स्त्री-पुरुष दोनों को समेटता है और वंश तथा पारिवारिक संबंध—दोनों अर्थों के लिए उपयुक्त है।
- source_word: Εἰ τέκνα τοῦ Ἀβραάμ ἐστε
  choice: यदि तुम अब्राहम की संतान हो
  rationale: ἐστε के वर्तमान काल को सीधे व्यक्त करता है और कथन में निहित चुनौती को समयपूर्व ढंग से ‘होते’ बनाकर हल नहीं करता।
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: अब्राहम के काम
  rationale: ἔργα का ठोस नैतिक अर्थ साधारण और स्पष्ट हिन्दी में सुरक्षित रहता है।
- source_word: ἐποιεῖτε
  choice: कर रहे होते
  rationale: अपूर्ण भूतकाल के निरंतर पक्ष और इस सशर्त कथन में संभावित तथ्य-विरोधी भाव—दोनों को व्यक्त करता है।
theological_decisions:
- issue: अब्राहम की संतान होने का स्वरूप
  choice: वंश और संबंध की भाषा को शाब्दिक रखा गया है तथा दावे और कर्मों के बीच का तनाव सुरक्षित है।
  alternative: इसे केवल शारीरिक वंश या केवल आत्मिक संतान होने के स्पष्ट निषेध/समर्थन के रूप में खोलकर कहना।
  rationale: पद स्वयं उनके वंश-दावे की तुलना अब्राहम के कामों से करता है, पर इस एक पद में शारीरिक और आत्मिक संतान के संबंध का पूर्ण सिद्धान्त निर्धारित नहीं करता।
- issue: सशर्त वाक्य का भाव
  choice: मुख्य पाठ में वर्तमान ‘हो’ के साथ परिणाम में ‘कर रहे होते’ रखा गया है।
  alternative: “यदि तुम अब्राहम की संतान होते, तो अब्राहम के काम करते।”
  rationale: यह मुद्रित यूनानी ἐστε के वर्तमान रूप और ἐποιεῖτε के अपूर्ण भूतकाल से उत्पन्न वास्तविक/तथ्य-विरोधी तनाव को मिटाए बिना हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उत्तर में उससे कहा’ यूहन्ना की दोहरी क्रिया को स्वाभाविक हिन्दी में रखता है; ‘कहते हैं’ ऐतिहासिक वर्तमान को दर्शाता है।
