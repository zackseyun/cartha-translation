source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· Ποῦ ἐστιν ὁ πατήρ σου; ἀπεκρίθη Ἰησοῦς· Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου· εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: hi
  text: इसलिए वे उससे कह रहे थे, “तुम्हारा पिता कहाँ है?” यीशु ने उत्तर दिया, “तुम न तो मुझे जानते हो, न मेरे पिता को। यदि तुम मुझे जानते, तो मेरे पिता को भी जानते।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी व्यक्त किया जा सकता है: “यदि तुमने मुझे जाना होता, तो मेरे पिता को भी जाना होता।” यूनानी शर्त को वास्तविकता के विपरीत बात पर अधिक बल देते हुए अनुवाद किया जा सकता है, यद्यपि इससे हिन्दी में भूतकाल का आभास हो सकता है।'
    reason: व्याकरणिक विकल्प
lexical_decisions:
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल चल रही या बार-बार हो रही वाणी का संकेत दे सकता है। ‘कह रहे थे’ इस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है, जबकि ‘कहते रहे’ पुनरावृत्ति पर आवश्यकता से अधिक बल दे सकता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से संवाद की तार्किक कड़ी दिखाता है। ‘इसलिए’ यहाँ निष्कर्षात्मक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: तुम्हारा पिता कहाँ है?
  rationale: प्रश्न को सीधा रखा गया है। हिन्दी में बड़े अक्षर का भेद नहीं होता; निकटवर्ती सन्दर्भ से स्पष्ट होता है कि यीशु का ‘पिता’ परमेश्वर है, जबकि प्रश्न करने वाले इस बात को नहीं समझते।
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: यह कथात्मक उत्तर-सूचक क्रिया का सामान्य, स्पष्ट और प्रतिष्ठित हिन्दी रूप है।
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: तुम न तो मुझे जानते हो, न मेरे पिता को
  rationale: οὔτε…οὔτε को स्वाभाविक हिन्दी ‘न तो…न’ से व्यक्त किया गया है। ‘जानते’ बौद्धिक ज्ञान, पहचान और संबंधपरक परिचय के बीच मूल की व्यापकता बनाए रखता है।
- source_word: οἶδατε / ᾔδειτε
  choice: जानते हो / जानते
  rationale: एक ही हिन्दी धातु का प्रयोग वर्तमान कथन और शर्त दोनों में यूनानी शब्द की पुनरावृत्ति को बनाए रखता है तथा अर्थ को केवल ‘पहचानने’ या ‘समझने’ तक सीमित नहीं करता।
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: यदि तुम मुझे जानते, तो मेरे पिता को भी जानते
  rationale: यह रूप वर्तमान के विपरीत मानी गई शर्त को स्वाभाविक हिन्दी में व्यक्त करता है। ‘भी’ καί को दर्शाता है और यीशु तथा पिता को जानने के बीच संबंध बनाए रखता है।
- source_word: πατήρ / πατέρα μου
  choice: पिता / मेरे पिता
  rationale: ‘पिता’ सीधा और स्थापित समतुल्य है। हिन्दी लिपि में capitalization का साधन नहीं है, इसलिए दिव्य संदर्भ को प्रसंग पर छोड़ा गया है और कोई अतिरिक्त उपाधि नहीं जोड़ी गई।
theological_decisions:
- issue: ‘पिता’ से परमेश्वर का संदर्भ
  choice: मूल के समान केवल ‘पिता’ और ‘मेरे पिता’ रखा गया
  alternative: ‘परमपिता’ या ‘मेरे पिता परमेश्वर’
  rationale: यूहन्ना के प्रसंग में संदर्भ परमेश्वर की ओर है, पर प्रश्न करने वालों की गलत समझ कथन की विडंबना का भाग है। ‘परमपिता’ या ‘परमेश्वर’ जोड़ना इस तनाव को समय से पहले स्पष्ट कर देता।
- issue: यीशु और पिता को ‘जानने’ का आशय
  choice: व्यापक क्रिया ‘जानना’ बनाए रखी गई
  alternative: ‘पहचानना’ या ‘समझना’
  rationale: यह पद यीशु को जानने और पिता को जानने के बीच धर्मवैचारिक संबंध रखता है। ‘जानना’ संबंधपरक, पहचान-संबंधी और बौद्धिक आयामों की सम्भावना बनाए रखता है।
- issue: शर्त का वर्तमान-विपरीत भाव
  choice: ‘यदि तुम मुझे जानते, तो…जानते’
  alternative: ‘यदि तुमने मुझे जाना होता, तो…जाना होता’
  rationale: यूनानी अपूर्ण रूप और ἄν यहाँ वर्तमान स्थिति के विपरीत शर्त व्यक्त कर सकते हैं। चुना हुआ हिन्दी रूप वर्तमान अर्थ को सुरक्षित रखता है; वैकल्पिक रूप भूतकालीन अर्थ का आभास दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और संवाद-सुलभ रूप अपनाया गया है। ‘कह रहे थे’ से यूनानी अपूर्ण काल का पक्ष सुरक्षित रखा गया है। ‘पिता’ के लिए कोई व्याख्यात्मक पद नहीं जोड़ा गया, और शर्त-वाक्य की वास्तविकता-विपरीत सूक्ष्मता को मुख्य पाठ तथा पादटिप्पणी दोनों में सावधानी से प्रस्तुत किया गया है।
