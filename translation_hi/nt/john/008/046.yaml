  text: τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας; ⸀εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: hi
  text: तुममें से कौन मुझे पाप का दोषी ठहरा सकता है?[a] यदि मैं सत्य कहता हूँ, तो तुम मुझ पर विश्वास क्यों नहीं करते?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुममें से कौन मुझे पाप का दोषी सिद्ध कर सकता है?”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम मेरी बात पर विश्वास क्यों नहीं करते?” यूनानी अभिव्यक्ति में वक्ता की बात मानने और उस पर भरोसा करने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: तुममें से कौन
  rationale: यह प्रश्नवाचक पदबंध श्रोताओं में से किसी एक को सामने आने की सीधी चुनौती देता है; यह हिंदी में स्वाभाविक और सटीक है।
- source_word: ἐλέγχει
  choice: दोषी ठहरा सकता है
  rationale: यहाँ क्रिया में किसी दोष को उजागर या सिद्ध करने का न्यायिक भाव है। सामर्थ्यसूचक रूप हिंदी में प्रश्न की चुनौती को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: περὶ ἁμαρτίας
  choice: पाप का
  rationale: περί के साथ संबंध या विषय का भाव है; हिंदी मुहावरे में ‘पाप का दोषी ठहराना’ व्यापक आरोप को स्पष्ट रखता है।
- source_word: εἰ ἀλήθειαν λέγω
  choice: यदि मैं सत्य कहता हूँ
  rationale: εἰ की शर्तात्मक बनावट को ‘यदि’ से बनाए रखा गया है, जबकि प्रसंग में निहित वक्तृता को अलग से स्पष्ट नहीं किया गया।
- source_word: διὰ τί
  choice: क्यों
  rationale: कारण पूछने वाले इस सामान्य प्रश्नवाचक पदबंध का स्वाभाविक हिंदी समतुल्य ‘क्यों’ है।
- source_word: πιστεύετέ μοι
  choice: मुझ पर विश्वास करते
  rationale: πιστεύω के साथ संप्रदान कारक वक्ता की बात मानने और उस पर भरोसा करने—दोनों अर्थों की गुंजाइश रखता है; ‘मुझ पर विश्वास करना’ हिंदी में इस संबंधपरक आयाम को बनाए रखता है।
theological_decisions:
- issue: यीशु के निष्पाप और सत्यवादी होने के दावे की वक्तृता
  choice: दोनों प्रश्नों को सीधे रूप में रखा गया है और निहित दावे की व्याख्यात्मक वृद्धि नहीं की गई।
  alternative: ‘क्या तुममें से कोई मुझे किसी भी पाप का दोषी सिद्ध कर सकता है?’ जैसे विस्तार से निहित अर्थ स्पष्ट करना।
  rationale: यूनानी पाठ स्वयं चुनौती और सत्य के दावे को प्रबलता से रखता है; अनुवाद इसे न तो नरम करता है, न अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सीधा, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘दोषी ठहरा सकता है’ न्यायिक चुनौती को स्वाभाविक हिंदी में व्यक्त करता है, और ‘यदि’ मूल की वास्तविक शर्तात्मक संरचना को सुरक्षित रखता है।
