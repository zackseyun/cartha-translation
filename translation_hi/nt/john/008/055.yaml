source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: hi
  text: फिर भी तुम उसे नहीं जानते[a], पर मैं उसे जानता हूँ। यदि मैं कहूँ कि मैं उसे नहीं जानता, तो मैं तुम्हारी तरह झूठा हो जाऊँगा। पर मैं उसे जानता हूँ और उसके वचन का पालन करता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने उसे नहीं जाना है।” यूनानी क्रिया पूर्णकाल में है और उनके अब तक उसे सचमुच न जानने से बनी वर्तमान अवस्था पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκατε
  choice: तुमने उसे नहीं जाना है
  rationale: यूनानी पूर्णकाल पूर्व की प्रक्रिया के परिणामस्वरूप बनी वर्तमान अवस्था को व्यक्त कर सकता है। यह अनुवाद उनके अब तक परमेश्वर को सचमुच न जानने की बात बनाए रखता है; सरल वर्तमान भी संभव है।
- source_word: οἶδα
  choice: मैं उसे जानता हूँ
  rationale: οἶδα रूप में पूर्णकाल है, पर प्रयोग में वर्तमान अवस्था सूचित करता है; इसलिए हिन्दी वर्तमानकाल स्वाभाविक और सटीक है।
- source_word: κἂν εἴπω
  choice: यदि मैं कहूँ
  rationale: यह शर्त काल्पनिक कथन प्रस्तुत करती है। हिन्दी में संभावनार्थक ‘यदि मैं कहूँ’ इसके अलंकारिक और काल्पनिक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔσομαι ὅμοιος ὑμῖν ψεύστης
  choice: मैं भी तुम्हारे समान झूठा ठहरूँगा
  rationale: भविष्यकालीन परिणाम और तीखी तुलना दोनों सुरक्षित हैं। ‘भी’ तुलना का निहित बल स्पष्ट करता है, और ‘ठहरूँगा’ इस शर्त के परिणामी भाव को सहज हिन्दी में देता है।
- source_word: τὸν λόγον αὐτοῦ
  choice: उसके वचन
  rationale: ‘वचन’ यूहन्ना की शब्दावली को बनाए रखता है और कथन, संदेश तथा प्रकट इच्छा के अर्थ-क्षेत्र को अनावश्यक रूप से सीमित नहीं करता।
- source_word: τηρῶ
  choice: पालन करता हूँ
  rationale: सन्दर्भ में τηρέω परमेश्वर के वचन को निष्ठापूर्वक मानने और थामे रखने को सूचित करता है। आधुनिक हिन्दी में ‘वचन का पालन’ स्वाभाविक है और केवल भौतिक रूप से ‘रखने’ की गलत समझ से बचाता है।
theological_decisions:
- issue: यीशु का परमेश्वर को जानने का दावा और विरोधियों से उसका विरोधाभास
  choice: यीशु के सच्चे ज्ञान और वचन-पालन के दावे को सीधे और तीखे रूप में रखा गया है।
  alternative: इसे विशिष्ट दिव्य पुत्रत्व की व्याख्या से विस्तृत करना, या ‘जानना’ को केवल परिचय तक सीमित करके कथन को नरम करना।
  rationale: पद स्वयं यीशु और उसके विरोधियों के बीच परमेश्वर को जानने और उसका वचन मानने का स्पष्ट विरोध प्रस्तुत करता है। अनुवाद उस तनाव को सुरक्षित रखता है, पर पाठ से बाहर की धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष और सामान्य पाठक के लिए सहज शैली। ‘तुम’ मूल बहुवचन संबोधन की सीधी टकरावपूर्ण शक्ति बनाए रखता है। ‘पालन करता हूँ’ को मुहावरेदार हिन्दी के लिए चुना गया है, जबकि ‘वचन’ यूहन्ना की व्यापक शब्दावली सुरक्षित रखता है।
