language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: hi
  text: तो यीशु ने कहा, “जब तुम मनुष्य के पुत्र को ऊँचा उठाओगे[a], तब तुम जानोगे कि मैं वही हूँ[b] और अपनी ओर से कुछ नहीं करता, बल्कि पिता ने मुझे जैसे सिखाया, मैं ये बातें वैसे ही कहता हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ऊँचा उठाना” शारीरिक रूप से ऊपर उठाने और महिमा में ऊँचा किए जाने—दोनों की ओर संकेत कर सकता है। यूहन्ना में यह प्रयोग दोनों अर्थों को साथ लिए हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'या: “मैं हूँ।” यूनानी में केवल ἐγώ εἰμι (“मैं हूँ”) है; कोई विधेय स्पष्ट रूप से नहीं दिया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले संवाद से निष्कर्ष अथवा आगे बढ़ते विचार को जोड़ता है; ‘इसलिए’ हिन्दी में इसका संबंध स्पष्ट और स्वाभाविक रखता है।
- source_word: Ὅταν
  choice: जब
  rationale: यहाँ क्रिया भावी और विशिष्ट घटना की ओर संकेत करती है, बार-बार होने वाली घटना की ओर नहीं।
- source_word: ὑψώσητε
  choice: ऊँचा उठाओगे
  rationale: यह अभिव्यक्ति क्रूस पर शारीरिक रूप से उठाए जाने और महिमा में ऊँचा किए जाने—दोनों सम्भावित अर्थों को बनाए रखती है।
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: यह यीशु की विशिष्ट आत्म-पदवी और उसके शास्त्रीय अंतर्संबंधों को सुरक्षित रखने वाला प्रचलित हिन्दी रूप है।
- source_word: γνώσεσθε
  choice: जानोगे
  rationale: यह भावी पहचान अथवा समझ में आने को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐγώ εἰμι
  choice: मैं वही हूँ
  rationale: मूल यूनानी में विधेय व्यक्त नहीं है। ‘मैं वही हूँ’ हिन्दी में वाक्य को स्वाभाविक रखते हुए उस गंभीर, संकेतात्मक अभिव्यक्ति को पूरी तरह किसी एक अर्थ में सीमित नहीं करता; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: ἀπ’ ἐμαυτοῦ
  choice: अपनी ओर से
  rationale: यह स्रोत और स्वतंत्र पहल—दोनों का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ποιῶ οὐδέν
  choice: कुछ नहीं करता
  rationale: यह सामान्य वर्तमान कथन के रूप में यीशु की अपनी ओर से स्वतंत्र कार्य न करने की बात को बनाए रखता है।
- source_word: καθὼς ἐδίδαξέν με ὁ πατήρ
  choice: ठीक वैसे ही … जैसे पिता ने मुझे सिखाया है
  rationale: यह καθώς के अनुरूपता वाले बल को स्पष्ट, मुहावरेदार हिन्दी में सुरक्षित रखता है।
- source_word: ταῦτα λαλῶ
  choice: मैं ये बातें … कहता हूँ
  rationale: यह ταῦτα को स्पष्ट रूप से रखता है और λαλέω को सामान्य, वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἐγώ εἰμι की निरपेक्ष अथवा अपूर्ण अभिव्यक्ति
  choice: मैं वही हूँ
  alternative: मैं हूँ
  rationale: यूनानी में कोई व्यक्त विधेय नहीं है और यूहन्ना में यह अभिव्यक्ति धर्मवैज्ञानिक रूप से गंभीर तथा सम्भवतः संकेतात्मक है। मुख्य पाठ का रूप स्वाभाविक हिन्दी देता है, जबकि पादटिप्पणी मूल की खुली बनावट को सामने रखती है।
- issue: यूहन्ना के संदर्भ में ὑψώσητε का अर्थ
  choice: ऊँचा उठाओगे
  alternative: क्रूस पर चढ़ाओगे; महिमा में ऊँचा करोगे
  rationale: क्रिया सम्भवतः क्रूस पर उठाए जाने और महिमामय उत्कर्ष दोनों को एक साथ प्रतिध्वनित करती है; चुना हुआ रूप इस दोहरे अर्थ को किसी एक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘ऊँचा उठाना’ और ‘मैं वही हूँ’ के साथ पादटिप्पणियाँ मूल की वास्तविक शाब्दिक तथा धर्मवैज्ञानिक अस्पष्टता को पारदर्शी बनाती हैं।
