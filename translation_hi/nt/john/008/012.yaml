source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: hi
  text: तब यीशु ने उनसे फिर कहा, “मैं संसार की ज्योति हूँ। जो मेरा अनुसरण करता है, वह अंधकार में कभी न चलेगा, बल्कि उसके पास जीवन की ज्योति होगी।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जीवन की ज्योति” का अर्थ “जीवन देने वाली ज्योति” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: इसलिए ... फिर
  rationale: οὖν प्रसंग की कड़ी को हल्के निष्कर्ष/अग्रगति के रूप में दिखाता है और Πάλιν पुनः बोलने को; यह क्रम स्वाभाविक आधुनिक हिन्दी है।
- source_word: ἐλάλησεν ... λέγων
  choice: ने ... कहा
  rationale: हिन्दी में ‘बोला, यह कहते हुए’ अनावश्यक रूप से भारी होता; एक ही ‘कहा’ दोनों यूनानी रूपों का स्वाभाविक प्रतिनिधित्व करता है।
- source_word: Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου
  choice: जगत की ज्योति मैं हूँ
  rationale: विधेय को पहले रखकर ‘मैं’ पर यूनानी के स्पष्ट बल को स्वाभाविक हिन्दी में बनाए रखा गया है। ‘जगत’ κόσμος के व्यापक मानवीय संसार को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: जो मेरे पीछे चलता है
  rationale: कर्ता के रूप में प्रयुक्त वर्तमान कृदंत निरंतर शिष्यत्व का भाव रखता है; एकवचन प्रतिनिधिक रूप भी सुरक्षित है।
- source_word: οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ
  choice: वह अंधकार में कभी न चलेगा
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को ‘कभी न’ व्यक्त करता है; ‘अंधकार में चलना’ यूहन्ना के नैतिक-आत्मिक रूपक को बनाए रखता है।
- source_word: ἕξει τὸ φῶς τῆς ζωῆς
  choice: जीवन की ज्योति पाएगा
  rationale: हिन्दी में अमूर्त वरदान के लिए ‘पाएगा’ स्वाभाविक है और ἕξει का आशय व्यक्त करता है। संबंधकारक पदबंध को अक्षुण्ण रखकर उसके अर्थ की खुली संभावनाएँ बचाई गई हैं।
theological_decisions:
- issue: Ἐγώ εἰμι में यीशु की आत्म-पहचान
  choice: ‘जगत की ज्योति मैं हूँ’ के विधेययुक्त कथन के रूप में अनुवाद
  alternative: इसे परमेश्वर के नाम की स्पष्ट प्रतिध्वनि दिखाने के लिए अतिरिक्त बल या व्याख्या के साथ प्रस्तुत करना
  rationale: यहाँ Ἐγώ εἰμι व्याकरणतः ‘जगत की ज्योति’ से जुड़ा है। अनुवाद सादी वाक्यरचना रखता है, पर शब्दक्रम से स्वाभाविक बल भी बचाता है; संभावित व्यापक यूहन्नाई प्रतिध्वनि को निर्णायक रूप से नहीं थोपता।
- issue: τὸ φῶς τῆς ζωῆς का संबंध
  choice: ‘जीवन की ज्योति’
  alternative: ‘जीवन देनेवाली ज्योति’
  rationale: यूनानी संबंधकारक जीवन से उत्पत्ति, गुण या जीवन देने की क्षमता जैसे एक से अधिक अर्थों की अनुमति देता है। शाब्दिक पदबंध इस धर्मवैचारिक समृद्धि और अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘जगत’ और ‘ज्योति’ बाइबलीय परिचितता बनाए रखते हैं, जबकि वाक्यरचना आज की हिन्दी में स्वाभाविक है। प्रबल निषेध को मुख्य पाठ में ही ‘कभी न’ द्वारा व्यक्त किया गया है, इसलिए उसके लिए अलग पाद-टिप्पणी आवश्यक नहीं है।
