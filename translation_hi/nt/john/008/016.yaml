  text: καὶ ἐὰν κρίνω δὲ ἐγώ, ἡ κρίσις ἡ ἐμὴ ⸀ἀληθινή ἐστιν, ὅτι μόνος οὐκ εἰμί, ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: hi
  text: पर यदि मैं न्याय करूँ भी,[a] तो मेरा न्याय सच्चा है, क्योंकि मैं अकेला नहीं हूँ, बल्कि मैं और वह पिता जिसने मुझे भेजा है, दोनों हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “यदि मैं न्याय करूँ।” यूनानी शर्तवाचक अभिव्यक्ति का अधिक औपचारिक अनुवाद संभव है, पर यहाँ प्रसंग में इसका भाव संभवतः रियायती है: “यदि मैं न्याय करूँ भी।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: यदि मैं न्याय करूँ भी
  rationale: ἐὰν के साथ वर्तमान संभावनार्थक κρίνω एक संभावित शर्त व्यक्त करता है; प्रसंग में ‘करूँ भी’ उसके रियायती भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: δέ पिछले कथन से विरोध अथवा विचार के मोड़ को सूचित करता है; ‘पर’ संक्षिप्त और स्वाभाविक है।
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: मेरा न्याय
  rationale: यह हिन्दी में स्वाभाविक है और κρίσις के न्यायिक अर्थ को सुरक्षित रखता है।
- source_word: ἀληθινή
  choice: सच्चा
  rationale: ἀληθινή सत्य, वास्तविकता और वैधता के अर्थ-क्षेत्र को समेट सकता है; ‘सच्चा’ यूहन्ना में सत्य की प्रतिध्वनि को बनाए रखता है।
- source_word: μόνος οὐκ εἰμί
  choice: मैं अकेला नहीं हूँ
  rationale: यह मूल के सीधे संबंधपरक कथन को स्पष्ट और सहज हिन्दी में प्रस्तुत करता है।
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: बल्कि मैं और पिता, जिसने मुझे भेजा है, दोनों हैं
  rationale: यह यीशु और भेजने वाले पिता—दोनों की सहभागिता स्पष्ट करता है। ‘जिसने’ का एकवचन पिता की ओर संकेत करता है, और ‘दोनों हैं’ हिन्दी वाक्य को पूर्ण तथा स्वाभाविक बनाता है।
theological_decisions:
- issue: यीशु के न्याय और पिता की सहभागिता का संबंध
  choice: यीशु का न्याय सच्चा है, क्योंकि वह पिता से स्वतंत्र या अलग होकर न्याय नहीं करता।
  alternative: इसे केवल दो कानूनी गवाहों से संबंधित कथन माना जा सकता है।
  rationale: मूल पाठ यीशु के न्याय की सत्यता को उसके अकेले न होने और उसे भेजने वाले पिता की सहभागिता पर आधारित करता है। अनुवाद इस संबंध को सुरक्षित रखता है, पर बाद की धर्मसैद्धांतिक व्याख्याएँ इसमें नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘न्याय’ और ‘सच्चा’ मूल के न्यायिक तथा यूहन्नाई अर्थ-संबंधों को बनाए रखते हैं।
