lexical_decisions:
- source_word: πάλιν
  choice: दोबारा
  rationale: पुनरावृत्ति का स्पष्ट और स्वाभाविक आधुनिक हिन्दी संकेत; इससे पहले किए गए उसी कार्य के फिर किए जाने का भाव आता है।
- source_word: κάτω κύψας
  choice: झुककर
  rationale: κάτω और κύψας मिलकर शरीर को नीचे की ओर झुकाने की क्रिया बताते हैं। हिन्दी में ‘झुककर’ इसे स्वाभाविक रूप से व्यक्त करता है; ‘नीचे झुककर’ अनावश्यक पुनरुक्ति लग सकती है।
- source_word: ἔγραφεν
  choice: लिखने लगा
  rationale: अपूर्ण भूतकालीन क्रिया उस समय जारी लेखन को दिखा सकती है। ‘लिखने लगा’ हिन्दी कथन में स्वाभाविक है और झुकने के बाद आरम्भ/जारी हुई क्रिया को व्यक्त करता है, बिना लिखी हुई सामग्री का अनुमान लगाए।
- source_word: εἰς τὴν γῆν
  choice: भूमि पर
  rationale: संदर्भ में γῆ सामने की धरती की सतह को सूचित करता है। ‘भूमि पर’ dignified और सामान्य आधुनिक हिन्दी है।
