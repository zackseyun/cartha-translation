base_translation:
  language: en
  yaml_path: translation/nt/john/008/032.yaml
  text: and you will know the truth[b][a], and the truth will set you free.
translation:
  language: hi
  text: और तुम सत्य को जानोगे[a], और सत्य तुम्हें स्वतंत्र करेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सत्य को जान जाओगे।”
    reason: lexical_alternative
  - marker: b
    text: इस पद के शब्द अपने आप यह स्पष्ट नहीं करते कि किससे स्वतंत्रता मिलेगी; आसपास का प्रसंग इसे पाप से स्वतंत्रता के साथ जोड़ता है।
    reason: cross_reference
lexical_decisions:
- source_word: γνώσεσθε
  choice: जानोगे
  rationale: यह γινώσκω का भविष्यकालीन रूप है। ‘जानोगे’ सीधा, स्वाभाविक और अर्थ की दृष्टि से खुला अनुवाद है; ‘जान जाओगे’ भी संभव है, पर वह जानने की प्रक्रिया या आरंभ पर कुछ अधिक बल देता है।
- source_word: ἀλήθειαν / ἀλήθεια
  choice: सत्य
  rationale: यूनानी में दोनों बार निश्चित उपपद है। हिन्दी में भाववाचक संज्ञा ‘सत्य’ अपने आप निश्चित अर्थ दे सकती है; दोनों खंडों में इसकी पुनरावृत्ति मूल की विशिष्टता और अलंकारिक बल को बनाए रखती है।
- source_word: ἐλευθερώσει
  choice: स्वतंत्र करेगा
  rationale: यह भविष्यकालीन सक्रिय क्रिया है, जिसका अर्थ किसी को स्वतंत्र करना है। ‘स्वतंत्र करेगा’ मूल के कारणात्मक भाव को स्पष्ट रखता है और स्वतंत्रता के प्रकार को मुख्य पाठ में सीमित नहीं करता।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: यह द्वितीय पुरुष बहुवचन कर्म है। आधुनिक मानक हिन्दी में ‘तुम्हें’ स्वाभाविक है और प्रसंग में सामूहिक संबोधन को व्यक्त कर सकता है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: दोनों संयोजकों को रखकर यूनानी वाक्य की समन्वयी रचना, क्रम और लय सुरक्षित रखी गई है।
theological_decisions:
- issue: ‘सत्य तुम्हें स्वतंत्र करेगा’ में स्वतंत्रता का स्वरूप
  choice: मुख्य पाठ में स्वतंत्रता को बिना अतिरिक्त विशेषण के रखा गया है।
  alternative: ‘सत्य तुम्हें पाप से मुक्त करेगा’ या ‘आत्मिक रूप से स्वतंत्र करेगा’
  rationale: अगले पद स्वतंत्रता को पाप की दासता से जोड़ते हैं, लेकिन इस पद की शब्दावली स्वयं स्वतंत्रता का प्रकार स्पष्ट नहीं करती। इसलिए प्रसंग को इसका अर्थ विकसित करने दिया गया है और व्याख्यात्मक विस्तार मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सत्य’ की पुनरावृत्ति तथा ‘और ... और’ की समानांतर रचना मूल यूनानी की लय को सुरक्षित रखती है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित शब्दों के बाद दिए गए हैं।
