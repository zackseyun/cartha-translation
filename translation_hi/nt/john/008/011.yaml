source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἡ δὲ εἶπεν, Οὐδείς, κύριε. Εἶπεν δὲ ὁ Ἰησοῦς, Οὐδὲ ἐγώ σε κατακρίνω· πορεύου, καὶ μηκέτι ἁμάρτανε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/011.yaml
  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: hi
  text: उसने कहा, “कोई नहीं, प्रभु।” तब यीशु ने कहा, “मैं भी तुझे दोषी नहीं ठहराता। जा, और अब से फिर पाप न करना।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह व्यभिचार करते पकड़ी गई स्त्री की घटना (यूहन्ना 7:53–8:11) का अन्तिम पद है। यूहन्ना 7:53 की टिप्पणी देखें।
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: प्रभु
  rationale: सम्बोधन रूप κύριε विनम्र सम्बोधन भी हो सकता है, पर यहाँ यीशु के अधिकार की स्वीकृति को बनाए रखने वाला पारंपरिक और स्वाभाविक अनुवाद ‘प्रभु’ उपयुक्त है।
- source_word: κατακρίνω
  choice: दोषी ठहराता
  rationale: यह न्यायिक सन्दर्भ में किसी के विरुद्ध दण्डात्मक निर्णय देने का भाव व्यक्त करता है; ‘दोषी ठहराना’ आधुनिक हिन्दी में इस अर्थ को स्पष्ट और स्वाभाविक रूप से पहुँचाता है।
- source_word: μηκέτι
  choice: अब से फिर ... न
  rationale: यह वर्तमान बिन्दु से आगे उस आचरण को छोड़ देने का समयगत भाव रखता है; ‘अब से फिर पाप न करना’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: ἁμάρτανε
  choice: पाप न करना
  rationale: वर्तमान आज्ञार्थक रूप के साथ μηκέτι चल रहे या दुहराए जाने वाले पाप को रोकने की आज्ञा देता है; हिन्दी में यह वाक्यांश निरन्तर भविष्यगत निषेध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: κύριε में विनम्र ‘महोदय’ और अधिकारसूचक ‘प्रभु’ के बीच अर्थ-सम्भावना
  choice: प्रभु
  alternative: महोदय
  rationale: यूनानी सम्बोधन दोनों अर्थों की अनुमति देता है। मुख्य पाठ में ‘प्रभु’ यीशु के अधिकार की कथा-संगत स्वीकृति और प्रचलित बाइबलीय भाषा को बनाए रखता है, बिना स्त्री की समझ की पूर्ण धार्मिक परिभाषा तय किए।
- issue: यीशु के निन्दा न करने और पाप छोड़ने की आज्ञा के बीच तनाव
  choice: दोनों कथनों को समान स्पष्टता से रखा गया है
  alternative: क्षमा को उभारना या चेतावनी को नरम करना
  rationale: मूल पाठ अनुग्रह और नैतिक आज्ञा दोनों को साथ रखता है; अनुवाद किसी एक को दूसरे पर हावी नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुझे/जा/करना’ एकवचन सम्बोधन को स्पष्ट करता है और प्रसंग में कठोरता के बजाय सीधी, अधिकारपूर्ण वाणी सुनाई देता है। पाठालोचनात्मक टिप्पणी का चिह्न मुख्य पाठ में [a] के रूप में दिया गया है।
