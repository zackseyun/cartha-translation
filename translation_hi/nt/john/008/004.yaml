lexical_decisions:
- source_word: λέγουσιν
  choice: उन्होंने उससे कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है; स्वाभाविक हिन्दी कथानक में इसे सामान्य भूतकाल से व्यक्त किया गया है।
- source_word: Διδάσκαλε
  choice: गुरु
