- source_word: κατείληπται
  choice: पकड़ी गई है
  rationale: पूर्णकालिक कर्मवाच्य उस घटना को बताता है जो घट चुकी है और जिसका वर्तमान प्रसंग में परिणाम बना हुआ है।
- source_word: ἐπαυτοφώρῳ
  choice: रंगे हाथों
  rationale: यह अपराध करते समय प्रत्यक्ष पकड़े जाने का मुहावरा है; आधुनिक हिन्दी में ‘रंगे हाथों’ उसी अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μοιχευομένη
  choice: व्यभिचार करते हुए
  rationale: वर्तमान कृदन्त उस दशा या क्रिया को बताता है जिसमें स्त्री पकड़ी गई; हिन्दी का ‘करते हुए’ इस समकालिकता को स्पष्ट रखता है।
