id: JHN.8.14
reference: John 8:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: hi
  text: यीशु ने उन्हें उत्तर दिया, “यदि मैं अपने विषय में स्वयं गवाही देता भी हूँ, तो मेरी गवाही सच्ची है, क्योंकि मैं जानता हूँ कि मैं कहाँ से आया हूँ और कहाँ जा रहा हूँ; पर तुम नहीं जानते कि मैं कहाँ से आता हूँ या[a] कहाँ जा रहा हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिखित प्रतियों में “या” के स्थान पर “और” है।
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: उत्तर दिया
  rationale: यूनानी की प्रचलित कथात्मक युग्म-अभिव्यक्ति का स्वाभाविक हिन्दी रूप; ‘उत्तर देकर कहा’ सम्भव है, पर आधुनिक हिन्दी में अनावश्यक रूप से भारी है।
- source_word: Κἂν
  choice: यदि ... भी
  rationale: शर्त के भीतर निहित स्वीकारात्मक/रियायती बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μαρτυρῶ περὶ ἐμαυτοῦ
  choice: अपने विषय में स्वयं गवाही देता हूँ
  rationale: μαρτυρέω के साक्ष्यगत भाव और περὶ ἐμαυτοῦ के ‘अपने विषय में’ अर्थ को बनाए रखता है; ‘स्वयं’ वक्ता पर बल स्पष्ट करता है।
- source_word: ἀληθής ... ἡ μαρτυρία μου
  choice: मेरी गवाही सच्ची है
  rationale: ἀληθής का व्यापक सत्य-संबंधी अर्थ सुरक्षित रखता है; ‘वैध’ कहने से अर्थ अनावश्यक रूप से केवल कानूनी हो जाता।
- source_word: ὅτι οἶδα
  choice: क्योंकि मैं जानता हूँ
  rationale: ὅτι के कारणसूचक सम्बन्ध और οἶδα के प्रत्यक्ष ज्ञान-दावे को स्पष्ट रूप से व्यक्त करता है।
- source_word: πόθεν ἦλθον
  choice: मैं कहाँ से आया हूँ
  rationale: अतीत में हुए आगमन और वर्तमान प्रासंगिकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ποῦ ὑπάγω
  choice: कहाँ जा रहा हूँ
  rationale: गमन की वर्तमान, दिशाबद्ध क्रिया के लिए स्वाभाविक हिन्दी रूप।
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: पर तुम नहीं जानते
  rationale: δὲ का विरोध और स्पष्ट ὑμεῖς का बल बनाए रखता है; बहुवचन सम्बोधन के लिए संदर्भानुकूल ‘तुम’ चुना गया है।
theological_decisions:
- issue: यीशु की आत्म-गवाही का स्वरूप
  choice: गवाही को ‘सच्ची’ कहा गया है और इसका आधार अपने मूल तथा गन्तव्य के विषय में यीशु का ज्ञान बताया गया है।
  alternative: इसे केवल कानूनी अर्थ में ‘वैध’ कहना, या पद में स्पष्ट रूप से ‘स्वर्ग से’ और ‘स्वर्ग को’ जोड़ना।
  rationale: यूनानी पाठ सत्यता और यीशु के अपने आगमन-स्रोत तथा गन्तव्य के ज्ञान को स्पष्ट करता है, पर इस पद में उन स्थानों को नाम नहीं देता। अनुवाद व्यापक यूहन्नाई सन्दर्भ को पाठ में जोड़कर तनाव का समाधान नहीं करता।
- issue: ἢ/καί पाठांतर
  choice: मुख्य पाठ में SBLGNT का ‘या’ रखा गया है।
  alternative: कुछ हस्तलिखित प्रतियों के अनुसार ‘और’।
  rationale: प्रदत्त मूल पाठ ἢ पढ़ता है; वास्तविक पाठांतर को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सहज शैली। साक्ष्य/न्यायिक अर्थ बनाए रखने के लिए ‘गवाही’ का प्रयोग किया गया है। मुख्य पाठ का [a] चिह्न वास्तविक यूनानी पाठांतर पर रखा गया है; अंग्रेज़ी परामर्श-पाठ की पहली पाद-टिप्पणी उसके अपने शब्द-विकल्प से मेल नहीं खाती थी, इसलिए उसे हिन्दी मसौदे में नहीं दोहराया गया।
