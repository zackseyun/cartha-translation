source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ μαρτυρῶν περὶ ἐμαυτοῦ καὶ μαρτυρεῖ περὶ ἐμοῦ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: hi
  text: अपने विषय में गवाही देनेवाला मैं ही हूँ,[a] और मुझे भेजनेवाला पिता भी मेरे विषय में गवाही देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने विषय में साक्ष्य देनेवाला मैं ही हूँ ... मेरे विषय में साक्ष्य देता है।’
    reason: μαρτυρέω के लिए ‘साक्ष्य देना’ कानूनी भाव को अधिक प्रत्यक्ष करता है, जबकि मुख्य पाठ का ‘गवाही देना’ अधिक सामान्य और स्वाभाविक हिन्दी है।
lexical_decisions:
- source_word: ἐγώ εἰμι ὁ μαρτυρῶν
  choice: गवाही देनेवाला मैं ही हूँ
  rationale: सवर्णक युक्त वर्तमान कृदन्त ὁ μαρτυρῶν संज्ञा के रूप में, ‘गवाही देनेवाला’, प्रयुक्त है। ‘मैं ही हूँ’ यूनानी में ἐγώ के स्पष्ट प्रयोग से आए बल को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि इसे अलग से किसी दार्शनिक या ईश्वरीय उपाधि के रूप में नहीं पढ़ता।
- source_word: περὶ ἐμαυτοῦ
  choice: अपने विषय में
  rationale: सम्बन्धकारक के साथ περί का यहाँ स्वाभाविक अर्थ ‘के विषय में’ है। ‘अपने विषय में’ आत्मवाचक ἐμαυτοῦ को बनाए रखता है और ‘अपने पक्ष में’ जैसी अतिरिक्त कानूनी व्याख्या नहीं जोड़ता।
- source_word: μαρτυρεῖ
  choice: गवाही देता है
  rationale: μαρτυρέω की न्यायिक-साक्ष्य सम्बन्धी छाया को आधुनिक हिन्दी में स्पष्ट करता है और पहले खंड के ‘गवाही देनेवाला’ से शब्दगत सम्बन्ध बनाए रखता है।
- source_word: περὶ ἐμοῦ
  choice: मेरे विषय में
  rationale: यह περί के साथ सम्बन्धकारक का सीधा और स्वाभाविक हिन्दी रूप है तथा पहले खंड के समानांतर विन्यास को सुरक्षित रखता है।
- source_word: ὁ πέμψας με πατήρ
  choice: मुझे भेजनेवाला पिता
  rationale: 'सवर्णक युक्त भूतकालिक कृदन्त पिता को विशेषित करता है: ‘वह पिता जिसने मुझे भेजा।’ संक्षिप्त हिन्दी कृदन्तीय रूप मूल वाक्य की रचना को निकटता से और स्वाभाविक ढंग से व्यक्त करता है; ‘मेरा पिता’ या ‘परमेश्वर पिता’ नहीं जोड़ा गया है।'
theological_decisions:
- issue: यूहन्ना के प्रसंग में ‘पिता’ का संकेत
  choice: केवल ‘पिता’ रखा गया है।
  alternative: ‘मेरा पिता’ अथवा ‘परमेश्वर पिता’
  rationale: यूनानी पाठ में πατήρ के साथ ‘मेरा’ या ‘परमेश्वर’ स्पष्ट रूप से नहीं है। इसलिए यीशु को भेजनेवाले दूसरे गवाह की पहचान और सम्बन्धगत दावा सुरक्षित रखा गया है, पर व्याख्यात्मक धर्मवैज्ञानिक शब्द नहीं जोड़े गए।
- issue: गवाही की कानूनी/साक्ष्यगत भाषा
  choice: μαρτυρέω को दोनों स्थानों पर ‘गवाही देना’ से व्यक्त किया गया है।
  alternative: ‘साक्षी होना’ अथवा ‘साक्ष्य देना’
  rationale: ‘गवाही देना’ सामान्य आधुनिक हिन्दी में स्पष्ट है, यूहन्ना के गवाह-विषयक न्यायिक भाव को बनाए रखता है, और दोनों खंडों में दोहराए गए यूनानी मूल की संगति सुरक्षित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और मौखिक रूप से स्पष्ट विन्यास। ‘देनेवाला/भेजनेवाला’ को संयुक्त रूप में रखा गया है। ‘विषय में’ ने περί की अस्पष्टता को अनावश्यक रूप से ‘पक्ष में’ नहीं बदला।
