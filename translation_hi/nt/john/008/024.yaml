source:
  edition: SBLGNT
  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: hi
  text: इसलिए मैंने तुमसे कहा कि तुम अपने पापों में मरोगे। क्योंकि यदि तुम विश्वास नहीं करते कि मैं हूँ[a], तो तुम अपने पापों में मरोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “मैं हूँ” के बाद कोई स्पष्ट विधेय नहीं है। इसे “कि मैं वही हूँ” के रूप में भी समझा जा सकता है, और यूहन्ना के सुसमाचार में इन शब्दों की अधिक गहरी गूँज हो सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: इसलिए मैंने तुमसे कहा
  rationale: οὖν पिछले कथन से निष्कर्ष या संबंध दिखाता है, इसलिए ‘इसलिए’ उपयुक्त है। εἶπον और दत्तिव ὑμῖν को स्वाभाविक हिन्दी में ‘मैंने तुमसे कहा’ कहा गया है।
- source_word: ἀποθανεῖσθε
  choice: तुम ... मरोगे
  rationale: भविष्यकालीन क्रिया का सीधा अर्थ ‘मरोगे’ है; ‘नाश हो जाओगे’ अनावश्यक व्याख्यात्मक भार जोड़ता।
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: अपने पापों में
  rationale: बहुवचन ἁμαρτίαις को ‘पापों’ के रूप में सुरक्षित रखा गया है। ἐν यहाँ उस दशा या क्षेत्र को व्यक्त करता है जिसमें वे बने रहकर मरेंगे; हिन्दी में कर्ता के साथ ‘अपने’ स्वाभाविक है।
- source_word: ἐὰν γὰρ μὴ
  choice: क्योंकि यदि ... नहीं
  rationale: γάρ पिछले कथन का आधार बताता है और ἐὰν μή नकारात्मक शर्त रखता है। ‘क्योंकि यदि ... नहीं’ दोनों तत्वों को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: πιστεύσητε
  choice: तुम विश्वास नहीं करोगे
  rationale: πιστεύω का यूहन्ना में मानक अर्थ ‘विश्वास करना’ है, जिसमें भरोसे का भाव भी समाया हो सकता है। शर्त की भविष्य-संदर्भित हिन्दी रचना में ‘करोगे’ स्वाभाविक है।
- source_word: ὅτι ἐγώ εἰμι
  choice: कि मैं वही हूँ[a]
  rationale: यूनानी में ‘मैं हूँ’ के बाद कोई स्पष्ट विधेय नहीं है। ‘मैं वही हूँ’ हिन्दी में पहचान बताने का स्वाभाविक रूप है, जबकि अधिक शाब्दिक और संभावित रूप से गूंजपूर्ण ‘मैं हूँ’ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: बिना स्पष्ट विधेय के यूहन्नाई अभिव्यक्ति ἐγώ εἰμι का अनुवाद
  choice: कि मैं वही हूँ[a]
  alternative: कि मैं हूँ
  rationale: यह वाक्यांश सामान्य आत्म-पहचान (‘मैं वही हूँ’) और अधिक निरपेक्ष ‘मैं हूँ’—जिसमें ईश्वरीय आत्म-प्रकाशन की गूँज संभव है—दोनों तरह सुना जा सकता है। मुख्य पाठ पठनीय हिन्दी देता है और पादटिप्पणी मूल की अस्पष्टता तथा धर्मवैज्ञानिक तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘मैं वही हूँ’ सहज पहचान-वाचक हिन्दी है; पादटिप्पणी मूल यूनानी की खुली संरचना को बनाए रखती है।
