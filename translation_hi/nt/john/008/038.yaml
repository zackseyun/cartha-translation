source:
  edition: SBLGNT
  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: hi
  text: मैं वह कहता हूँ जो मैंने पिता की उपस्थिति में देखा है; और तुम भी वही करते हो जो तुमने अपने पिता से सुना है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “मैं वे बातें कहता हूँ जिन्हें मैंने पिता की उपस्थिति में देखा है; और तुम इसलिए वे बातें करते हो जिन्हें तुमने उस पिता से सुना है।” यूनानी में दूसरे स्थान पर “अपने” शब्द नहीं है; प्रसंग उस पिता की पहचान आगे स्पष्ट करता है (पद 44 देखें)।'
    reason: मूल की अधिक शब्दशः रचना, पहले παρά पदबंध का उपस्थितिगत अर्थ, और दूसरे ‘पिता’ की जानबूझकर कम स्पष्ट अभिव्यक्ति को दर्ज करना।
lexical_decisions:
- source_word: ἃ
  choice: वही जो
  rationale: नपुंसकलिंग बहुवचन संबंधवाचक सर्वनाम यहाँ कथन के विषय को सूचित करता है; ‘वही जो’ सहज हिन्दी में उसके संदर्भात्मक बल को बनाए रखता है।
- source_word: ἑώρακα
  choice: मैंने ... देखा है
  rationale: पूर्णकाल अतीत में देखने और उसकी वर्तमान प्रासंगिकता, दोनों को व्यक्त करता है; हिन्दी का ‘देखा है’ इसे स्वाभाविक रूप से दर्शाता है।
- source_word: παρὰ τῷ πατρὶ
  choice: पिता के साथ रहते हुए
  rationale: παρά के साथ सम्प्रदान कारक निकटता या उपस्थिति का भाव देता है। यह अनुवाद केवल ‘पिता से’ कहकर स्रोत का अर्थ देने के बजाय पिता की उपस्थिति में होने का भाव स्पष्ट करता है।
- source_word: λαλῶ
  choice: मैं ... कहता हूँ
  rationale: क्रिया का मूल अर्थ बोलना या कहना है। ‘कहता हूँ’ प्रत्यक्ष कर्मवाचक उपवाक्य के साथ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὖν
  choice: भी
  rationale: यहाँ संयोजक पद तुलना से निकले परिणाम या अनुरूपता को आगे बढ़ाता है। ‘और तुम भी’ हिन्दी में उस समानांतरता को सहजता से प्रकट करता है, यद्यपि अधिक औपचारिक रूप ‘इसलिए’ संभव है।
- source_word: ἃ ἠκούσατε
  choice: वही ... जो तुमने ... सुना है
  rationale: ἃ को ‘वही ... जो’ और अओरिस्ट ἠκούσατε को वर्तमान आचरण से संबद्ध स्वाभाविक हिन्दी ‘सुना है’ से व्यक्त किया गया है।
- source_word: παρὰ τοῦ πατρὸς
  choice: अपने पिता से
  rationale: παρά के साथ संबंध कारक स्रोत को दर्शाता है। यूनानी में स्वत्ववाचक सर्वनाम नहीं है, पर प्रसंग यीशु के पिता और विरोधियों के पिता में भेद करता है; ‘अपने’ हिन्दी में निहित संबंध को स्पष्ट करता है।
- source_word: ποιεῖτε
  choice: करते हो
  rationale: वर्तमानकाल उनके चालू या चरित्रगत आचरण को सूचित कर सकता है; ‘करते हो’ दोनों संभावनाओं को स्वाभाविक रूप से रखता है।
- source_word: πατήρ / πατρὸς
  choice: पिता / पिता
  rationale: देवनागरी हिन्दी में बड़े और छोटे अक्षरों का भेद नहीं है। पहले पद में परमेश्वर का संदर्भ और दूसरे में भिन्न पिता का संदर्भ वाक्य-संरचना तथा प्रसंग से स्पष्ट होता है।
theological_decisions:
- issue: दूसरे ‘पिता’ की पहचान क्या मुख्य पाठ में शैतान के रूप में स्पष्ट की जाए
  choice: ‘अपने पिता’ कहकर पहचान को यहाँ निहित रहने देना
  alternative: ‘उस पिता से’ अथवा ‘शैतान से’
  rationale: पद 44 में यीशु स्पष्ट रूप से उनकी पितृ-संबंधी पहचान बताता है, पर पद 38 स्वयं उसे प्रत्यक्ष रूप से नहीं बताता। ‘अपने पिता’ कथानक की क्रमिक स्पष्टता और मूल की तनावपूर्ण तुलना को बनाए रखता है।
- issue: पहले παρά वाक्यांश को स्रोत या उपस्थिति के रूप में लेना
  choice: ‘पिता के साथ रहते हुए’
  alternative: ‘पिता से’ अथवा ‘पिता की उपस्थिति में’
  rationale: सम्प्रदान कारक के साथ παρά मुख्यतः निकटता/उपस्थिति का अर्थ देता है, जबकि दूसरे वाक्यांश में संबंध कारक स्रोत का अर्थ देता है। इस भेद को बनाए रखना यीशु के पिता के साथ संबंध और विरोधियों द्वारा अपने पिता से सुनने के बीच मूल पाठ की असमानता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पिता के साथ रहते हुए’ उपस्थिति का अर्थ स्पष्ट करता है, जबकि ‘अपने पिता से’ दूसरे παρά पदबंध के स्रोतभाव और प्रसंगगत विरोध को व्यक्त करता है।
