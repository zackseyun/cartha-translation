  text: They did not understand that he was speaking to them about the Father[a].
translation:
  language: hi
  text: वे यह नहीं समझे कि वह उनसे पिता के विषय में बोल रहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे यह नहीं जानते थे कि वह उनसे पिता के विषय में बोल रहा था।”
    reason: γινώσκω के ‘जानना’ और संदर्भगत ‘समझना’—दोनों संभावित अर्थों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: वे यह नहीं समझे
  rationale: γινώσκω का सामान्य अर्थ ‘जानना’ है, पर यहाँ प्रसंग में यीशु की बात का आशय न पकड़ पाने की बात है; इसलिए ‘नहीं समझे’ स्वाभाविक और संदर्भानुकूल है।
- source_word: ὅτι
  choice: कि
  rationale: यह उस बात को प्रस्तुत करता है जिसे वे समझ नहीं पाए; हिन्दी में ‘कि’ उपयुक्त है।
- source_word: τὸν πατέρα
  choice: पिता
  rationale: यूहन्ना के निकटवर्ती प्रसंग में यह परमेश्वर, अर्थात यीशु के पिता, का निर्देश करता है। ‘पिता’ इस विशिष्ट संबंधपरक संबोधन को बनाए रखता है।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: λέγω के साथ दत्तिव αὐτοῖς को इस वाक्य में स्वाभाविक हिन्दी में ‘उनसे ... कह रहा था’ कहा गया है।
- source_word: ἔλεγεν
  choice: कह रहा था
  rationale: अपूर्ण भूतकाल चल रही वाणी को दर्शाता है; ‘कह रहा था’ इस अपूर्णतामूलक पक्ष को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘पिता’ का अभिप्रेत व्यक्ति
  choice: इसे परमेश्वर, यीशु के पिता, के संदर्भ के रूप में रखा गया है।
  alternative: किसी मानवीय पिता का संदर्भ
  rationale: यूहन्ना के तत्काल प्रसंग में यीशु बार-बार ‘पिता’ का प्रयोग परमेश्वर के लिए करता है; यह संदर्भगत पहचान है, बाद की कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं।
- issue: γινώσκω का संदर्भगत अर्थ
  choice: ‘नहीं समझे’
  alternative: ‘नहीं जानते थे’
  rationale: यहाँ श्रोताओं की विफलता यीशु की बात का अभिप्राय न समझने में है। फिर भी मूल क्रिया के अधिक शाब्दिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘के विषय में’ स्पष्टता और औपचारिक गरिमा बनाए रखता है।
