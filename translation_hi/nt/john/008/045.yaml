    issue: The main text employs a paired causal-result construction (‘क्योंकि … इसलिए’) for a single Greek conjunction.
    rationale: Although Hindi permits this pattern, it is unnecessarily heavy here. A concise causal connective better reflects the Greek construction and modern Hindi flow.
  - severity: medium
    issue: The footnote’s alleged ‘more literal’ Hindi alternative omits the causal relationship expressed by the Greek conjunction.
