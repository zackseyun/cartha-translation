    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: मैं
  rationale: स्पष्ट कर्ता-सर्वनाम को बनाए रखा गया है, जिससे यीशु और उनके श्रोताओं के बीच निहित विरोध पर बल बना रहे।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले कथन के साथ विरोध दर्शाता है; ‘परन्तु’ उस विरोधात्मक बल को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: 'यहाँ ὅτι को कारणवाचक समझना प्रसंग और वाक्य के तर्क के अनुकूल है: सत्य कहने के कारण ही श्रोता यीशु पर विश्वास नहीं करते।'
- source_word: τὴν ἀλήθειαν
  choice: सत्य
  rationale: ἀλήθεια का मानक और प्रसंगानुकूल हिन्दी रूप; हिन्दी में ‘सत्य कहना’ स्वाभाविक है और यूनानी निश्चित उपपद के लिए अलग शब्द आवश्यक नहीं।
- source_word: λέγω
  choice: कहता हूँ
  rationale: वर्तमान काल को साधारण वर्तमान में रखा गया है; ‘सत्य कहता हूँ’ आधुनिक हिन्दी में सहज और मूल के निकट है।
- source_word: οὐ πιστεύετέ μοι
  choice: तुम मेरा विश्वास नहीं करते
  rationale: πιστεύω के साथ सम्प्रदान कारक यहाँ किसी व्यक्ति की बात को विश्वसनीय मानने का भाव देता है। ‘मेरा विश्वास नहीं करते’ व्यक्तिगत कर्म-संबंध को बनाए रखता है और ‘मेरी बात पर विश्वास नहीं करते’ जैसी व्याख्यात्मक वृद्धि से बचता है।
theological_decisions:
- issue: ὅτι का यीशु के सत्य बोलने और श्रोताओं के अविश्वास से सम्बन्ध
  choice: 'कारणवाचक: ‘क्योंकि मैं सत्य कहता हूँ’'
  alternative: 'घोषणात्मक/अधिक शाब्दिक: ‘कि मैं सत्य कहता हूँ’'
  rationale: 'तात्कालिक संवाद में कारणवाचक अर्थ अधिक उपयुक्त है: यीशु सत्य कहते हैं, और इसी कारण उनके विरोधी उनका विश्वास नहीं करते। यह पाठ-विन्यास और प्रसंग पर आधारित निर्णय है; इससे कथन की तीखी विडम्बना बनी रहती है, पर कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा जाता।'
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से स्पष्ट शैली अपनाई गई है। ‘परन्तु’ औपचारिक गरिमा रखता है, जबकि शेष वाक्य सामान्य पाठक के लिए सहज है। कारण और परिणाम को स्पष्ट करने के लिए ‘इसलिए’ जोड़ा गया है; यह हिन्दी वाक्य-रचना में स्वाभाविक है और मूल में निहित तार्किक सम्बन्ध को स्पष्ट करता है।
