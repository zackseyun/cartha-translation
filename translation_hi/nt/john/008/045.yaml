  naturalness: ‘परन्तु क्योंकि …, इसलिए …’ is understandable but cumbersome in modern standard Hindi. ‘परन्तु मैं सत्य कहता हूँ, इस कारण …’ is smoother and preserves the causal irony. ‘मेरा विश्वास नहीं करते’ is idiomatic for ‘do not believe me.’
  terminology: ‘सत्य’ and ‘विश्वास’ are accurate, natural, and suitably dignified. No doctrinally loaded terminology has been introduced.
