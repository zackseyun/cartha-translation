  text: καὶ ⸀ἔλεγεν αὐτοῖς· Ὑμεῖς ἐκ τῶν κάτω ἐστέ, ἐγὼ ἐκ τῶν ἄνω εἰμί· ὑμεῖς ἐκ ⸂τούτου τοῦ κόσμου⸃ ἐστέ, ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: hi
  text: वह उनसे कह रहा था, “तुम नीचे से हो; मैं ऊपर से हूँ[a]। तुम इस संसार से हो[b]; मैं इस संसार से नहीं हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम नीचे के हो … मैं ऊपर का हूँ।”
    reason: lexical_alternative
  - marker: b
    text: यूहन्ना के लेखन में “संसार” प्रायः केवल भौतिक पृथ्वी नहीं, बल्कि परमेश्वर से विमुख मानव-व्यवस्था को भी दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: कहता रहा
  rationale: अपूर्ण भूतकालीन क्रिया चलती हुई या संदर्भ में जारी वाणी का संकेत दे सकती है। ‘कहता रहा’ इस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Ὑμεῖς / ἐγώ
  choice: तुम / मैं
  rationale: यूनानी में स्पष्ट सर्वनाम जोर देकर यीशु और उसके श्रोताओं के बीच तीखा विरोध दिखाते हैं; हिन्दी में इन्हें बनाए रखा गया है।
- source_word: ἐκ τῶν κάτω / ἐκ τῶν ἄνω
  choice: नीचे से / ऊपर से
  rationale: यह चयन मूल के स्थान-संबंधी और धर्मवैचारिक ऊर्ध्वाधर विरोध को संक्षेप और स्वाभाविक रूप में सुरक्षित रखता है, बिना ‘लोक’ या नैतिक अर्थ को अनावश्यक रूप से जोड़ने के।
- source_word: κόσμος
  choice: संसार
  rationale: ‘संसार’ κόσμος का व्यापक और प्रचलित हिन्दी समतुल्य है। यह भौतिक जगत के साथ-साथ परमेश्वर से विमुख मानव-व्यवस्था के यूहन्नाई आशय को भी धारण कर सकता है।
- source_word: τούτου τοῦ κόσμου / τοῦ κόσμου τούτου
  choice: इस संसार
  rationale: संकेतवाचक ‘इस’ को सुरक्षित रखा गया है और दोनों यूनानी पदक्रमों को सहज हिन्दी में एक समान प्रस्तुत किया गया है।
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου
  choice: मैं इस संसार से नहीं हूँ
  rationale: यह बार-बार आए ἐκ के स्रोत अथवा उद्गम संबंधी बल को बनाए रखता है; ‘मैं इस संसार का नहीं हूँ’ संबंध या स्वामित्व की ओर अर्थ को कुछ अधिक मोड़ देता।
theological_decisions:
- issue: ‘नीचे से/ऊपर से’ और ‘इस संसार से’ के विरोध का अर्थ
  choice: उद्गम और क्षेत्र की मूल भाषा को व्याख्यात्मक विस्तार के बिना सुरक्षित रखा गया है।
  alternative: इसे स्पष्ट रूप से नैतिक विरोध या स्वर्गीय बनाम सांसारिक लोक के रूप में अनूदित किया जा सकता था।
  rationale: पद यीशु और उसके श्रोताओं के बीच तीखा यूहन्नाई विरोध प्रस्तुत करता है, पर यूनानी पाठ स्वयं इस बिंब को पूर्ण सिद्धान्तात्मक व्याख्या में नहीं बदलता। इसलिए अनुवाद वास्तविक धर्मवैचारिक तनाव और मसीह-संबंधी भिन्नता को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली अपनाई गई है। समानांतर वाक्यरचना और ‘तुम/मैं’ का विरोध मूल की लय तथा जोर को बनाए रखते हैं।
