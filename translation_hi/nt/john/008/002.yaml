lexical_decisions:
- source_word: Ὄρθρου
  choice: भोर को
  rationale: समय-सूचक संबंधकारक यहाँ सूर्योदय के आसपास के समय को दर्शाता है; ‘भोर को’ संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: παρεγένετο
  choice: आया
  rationale: यह किसी स्थान पर पहुँचने या उपस्थित होने को व्यक्त करता है; ‘मंदिर में आया’ गंतव्य के साथ स्वाभाविक है।
- source_word: ἱερόν
  choice: मंदिर
  rationale: यह नाओस अर्थात भीतरी पवित्रस्थान के बजाय पूरे मंदिर-परिसर को दर्शाता है, जिसमें सार्वजनिक शिक्षा दी जा सकती थी; हिंदी में ‘मंदिर’ मानक और संदर्भानुकूल है।
- source_word: πᾶς ὁ λαὸς ἤρχετο
  choice: सब लोग उसके पास आने लगे
  rationale: सामूहिक एकवचन λαός को हिंदी में स्वाभाविक बहुवचन ‘सब लोग’ से व्यक्त किया गया है। अपूर्ण काल ἤρχετο की आरंभिक अथवा जारी गति को ‘आने लगे’ सहज रूप से दर्शाता है।
- source_word: καθίσας
  choice: वह बैठकर
  rationale: एओरिस्ट कृदंत शिक्षा देने से पहले बैठने की क्रिया दिखाता है; ‘बैठकर’ हिंदी में क्रियाओं का क्रम स्पष्ट रखता है।
- source_word: ἐδίδασκεν
  choice: शिक्षा देने लगा
  rationale: अपूर्ण काल आरंभिक या जारी क्रिया व्यक्त कर सकता है। संदर्भ में ‘शिक्षा देने लगा’ उसके बैठने के बाद आरंभ हुई शिक्षा को स्वाभाविक रूप से व्यक्त करता है।
