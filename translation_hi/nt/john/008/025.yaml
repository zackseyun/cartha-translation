  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: hi
  text: तब वे उससे पूछने लगे, “तुम कौन हो?” यीशु ने उनसे कहा, “वही, जो मैं आरम्भ से तुमसे कहता आया हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: पूछने लगे
  rationale: क्रिया अपूर्ण काल में है और यहाँ प्रत्यक्ष प्रश्न का परिचय देती है; इसलिए निरंतर अथवा बार-बार पूछने का भाव स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: Τὴν ἀρχὴν
  choice: आरम्भ से
  rationale: इस कठिन यूनानी वाक्यांश को प्रसंगानुकूल कालगत अर्थ में लिया गया है; यह यीशु की पहले से चली आ रही वाणी की ओर संकेत करता है।
- source_word: ὅ τι καὶ λαλῶ ὑμῖν
  choice: वही, जो मैं ... तुमसे कहता आया हूँ
  rationale: उत्तर की पहचानसूचक शक्ति और निरंतर कथन का भाव रखा गया है। καί की बलवत्ता को “वही” से व्यक्त किया गया है।
theological_decisions:
- issue: यीशु के उत्तर में Τὴν ἀρχὴν की व्याख्या
  choice: “वही, जो मैं आरम्भ से तुमसे कहता आया हूँ”
  alternative: “मैं तुमसे बात ही क्यों कर रहा हूँ?” अथवा “सबसे पहले, मैं तुमसे जो कह रहा हूँ...”
  rationale: यूनानी पदबंध व्याकरण की दृष्टि से कठिन और बहुअर्थी है। मुख्य पाठ में प्रसंग तथा अंग्रेज़ी POB के अनुरूप पारंपरिक कालगत समझ अपनाई गई है, पर इसे किसी विशिष्ट मसीही उपाधि में बदलकर तनाव को नहीं सुलझाया गया।
