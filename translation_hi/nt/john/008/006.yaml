  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: hi
  text: वे[a] यह बात यीशु को परखने के लिए कह रहे थे, ताकि वे उसके विरुद्ध कोई आरोप लगा सकें। परन्तु यीशु नीचे झुककर अपनी उँगली से भूमि पर लिख रहे थे, मानो ध्यान न दे रहे हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह व्यभिचार करते पकड़ी गई स्त्री की कथा (यूहन्ना 7:53–8:11) का आगे का भाग है। यूहन्ना 7:53 की टिप्पणी देखें।
    reason: textual_critical
lexical_decisions:
- source_word: πειράζοντες
  choice: परखने
  rationale: सन्दर्भ में विरोधी यीशु को कानूनी और धार्मिक दुविधा में फँसाकर उसके विरुद्ध आधार पाना चाहते हैं। ‘परखने’ मूल क्रिया का अर्थ रखता है और ‘परीक्षा लेने’ की अपेक्षा अधिक सहज है; उद्देश्य की दुर्भावना अगले उपवाक्य से स्पष्ट होती है।
- source_word: κατηγορίαν
  choice: दोष लगाने का कोई आधार
  rationale: यहाँ आशय यीशु के विरुद्ध आरोप या अभियोग लगाने के आधार से है। उद्देश्यसूचक रचना के भीतर यह हिन्दी में स्वाभाविक है और कानूनी भाव बनाए रखती है।
- source_word: κάτω κύψας
  choice: नीचे झुककर
  rationale: क्रियाविशेषण और कृदन्त की संरचना को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔγραφεν
  choice: लिखा
  rationale: अपूर्ण भूतकाल चल रही क्रिया को सूचित कर सकता है, पर इस प्रसंग में साधारण भूतकाल हिन्दी में सहज है; मूल यह नहीं बताता कि यीशु ने क्या लिखा।
- source_word: μὴ προσποιούμενος
  choice: उनकी ओर कोई ध्यान नहीं दिया
  rationale: बाइज़ेन्टाइन पाठ में उपस्थित वाक्यांश जानबूझकर ध्यान न देने या अनदेखा करने का भाव देता है। यह चयन ‘मानो उसने सुना ही नहीं’ जैसे अधिक विशिष्ट अर्थ को आरोपित नहीं करता।
theological_decisions:
- issue: यीशु ने भूमि पर क्या लिखा
  choice: केवल ‘भूमि पर लिखा’ कहा गया है
  alternative: लिखी हुई बात की विषयवस्तु का अनुमान देना
  rationale: यूनानी पाठ लिखी हुई बात की विषयवस्तु नहीं बताता; किसी प्रतीकात्मक या न्यायिक व्याख्या को अनुवाद में जोड़ना अनुचित होगा।
- issue: विरोधियों की मंशा
  choice: परखने और दोष लगाने का आधार पाने की मंशा स्पष्ट रखी गई
  alternative: इसे केवल निष्पक्ष प्रश्न या सीधे ‘फँसाने’ के रूप में प्रस्तुत करना
  rationale: πειράζοντες और ἵνα ἔχωσιν κατηγορίαν दोनों मिलकर विरोधपूर्ण उद्देश्य दिखाते हैं, जबकि मूल ‘फँसाने’ के लिए अलग क्रिया का प्रयोग नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण गद्य। ‘भूमि’ औपचारिकता बनाए रखता है, जबकि वाक्य-विन्यास सामान्य पाठकों के लिए स्पष्ट है। सर्वनाम ‘वे’ का संदर्भ पिछली आयतों के शास्त्रियों और फरीसियों से है; पाठालोचन-संबंधी सूचना [a] में दी गई है।
