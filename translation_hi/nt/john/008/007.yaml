  yaml_path: translation/nt/john/008/007.yaml
  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: hi
  text: पर जब वे उससे पूछते ही रहे,[a] तो उसने सीधा होकर उनसे कहा, “तुम में जो निष्पाप है, वही सबसे पहले उस पर पत्थर फेंके।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद व्यभिचार में पकड़ी गई स्त्री की कथा (यूहन्ना 7:53–8:11) का भाग है, जो सबसे प्राचीन यूनानी हस्तलिपियों में नहीं मिलती। यूहन्ना 7:53 की टिप्पणी देखें।
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: पूछते ही रहे
  rationale: अपूर्णकालीन क्रिया और वर्तमान कृदन्त मिलकर लगातार तथा आग्रहपूर्वक पूछते रहने का भाव देते हैं; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀνακύψας
  choice: सीधा होकर
  rationale: पिछले प्रसंग में झुककर भूमि पर लिखने के बाद शरीर सीधा करने की क्रिया व्यक्त करता है।
- source_word: ἀναμάρτητος
  choice: निष्पाप
  rationale: दुर्लभ यूनानी विशेषण का अर्थ ‘पाप से रहित’ है। ‘निष्पाप’ नैतिक अर्थ को संक्षेप और गरिमा के साथ रखता है, जबकि ‘निर्दोष’ केवल इस आरोप के संबंध में दोषरहित होने का संकरा अर्थ दे सकता है।
- source_word: πρῶτος ... τὸν λίθον βαλέτω
  choice: वही सबसे पहले ... पत्थर फेंके
  rationale: आज्ञार्थक अभिव्यक्ति और ‘सबसे पहले’ के बल को स्पष्ट रखते हुए स्वाभाविक हिन्दी वाक्य बनाया गया है।
theological_decisions:
- issue: ἀναμάρτητος का दायरा
  choice: निष्पाप
  alternative: इस पाप से निर्दोष
  rationale: मूल पाठ विशेषण को किसी खास पाप तक सीमित नहीं करता। इसलिए व्यापक ‘पाप से रहित’ अर्थ सुरक्षित रखा गया है और व्याख्यात्मक सीमा नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज प्रवाह रखा गया है। ‘पूछते ही रहे’ निरंतर आग्रह को, और ‘सीधा होकर’ दृश्य की शारीरिक क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
