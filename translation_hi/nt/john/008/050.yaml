  text: ἐγὼ δὲ οὐ ζητῶ τὴν δόξαν μου· ἔστιν ὁ ζητῶν καὶ κρίνων.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/050.yaml
  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: hi
  text: पर मैं अपनी महिमा की खोज नहीं करता; एक है जो उसकी खोज करता है और न्याय करता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “एक है जो खोजता और न्याय करता है।” “खोजता” का समझा हुआ कर्म पिछले वाक्यांश में कही गई यीशु की महिमा है।'
    reason: lexical_alternative
  - marker: b
    text: प्रसंग के आधार पर इस अनाम व्यक्ति को सामान्यतः पिता समझा जाता है, यद्यपि यूनानी पाठ यहाँ उन्हें स्पष्ट रूप से नामित नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: पर मैं
  rationale: स्पष्ट सर्वनाम ἐγώ का बल बनाए रखा गया है, और δέ के प्रसंगगत विरोध को स्वाभाविक हिन्दी में ‘पर’ से व्यक्त किया गया है।
- source_word: οὐ ζητῶ
  choice: नहीं चाहता
  rationale: ζητέω का मूल भाव ‘खोजना/चाहना’ है; महिमा के प्रसंग में ‘चाहना’ सामान्य हिन्दी में स्वाभाविक है और आगे ζητῶν के साथ शब्दगत संबंध भी बनाए रखता है।
- source_word: τὴν δόξαν μου
  choice: अपनी महिमा
  rationale: δόξα यहाँ सम्मान या महिमा को सूचित करता है। ‘अपनी’ वक्ता की ओर लौटने वाले possessive भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἔστιν ὁ ζητῶν
  choice: एक है जो उसे चाहता है
  rationale: ἔστιν और संज्ञात्मक कृदंत को इस प्रकार रखा गया है कि अनाम कर्ता स्पष्ट रूप से पिता न बना दिया जाए। ‘उसे’ पिछले खंड की ‘महिमा’ को स्वाभाविक रूप से दोहराता है।
- source_word: καὶ κρίνων
  choice: और न्याय करता है
  rationale: κρίνω के न्यायिक अर्थ को ‘न्याय करता है’ से व्यक्त किया गया है; यह ‘दोषी ठहराता है’ जैसी अधिक संकीर्ण व्याख्या से बचता है।
theological_decisions:
- issue: महिमा चाहने और न्याय करने वाले अनाम कर्ता की पहचान
  choice: मुख्य पाठ में उसे केवल ‘एक’ कहा गया है।
  alternative: उसे स्पष्ट रूप से ‘पिता’ कहना।
  rationale: प्रसंग में संकेत पिता की ओर है, पर यूनानी पाठ इस पद में उनका नाम नहीं लेता। इसलिए अनुवाद मूल की संयमित अस्पष्टता बनाए रखता है।
- issue: ζητῶν का अप्रकट कर्म
  choice: ‘उसे’ जोड़कर इसे यीशु की महिमा से जोड़ा गया है।
  alternative: ‘एक है जो चाहता और न्याय करता है’ जैसा अधिक शाब्दिक रूप।
  rationale: पिछले खंड से कर्म स्पष्ट रूप से समझा जाता है; हिन्दी में ‘उसे’ वाक्य को स्वाभाविक बनाता है, जबकि पादटिप्पणी अधिक शाब्दिक संरचना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘महिमा’ यूहन्ना के धार्मिक-साहित्यिक संदर्भ को बनाए रखती है, जबकि अनाम कर्ता के विषय में मूल पाठ की अस्पष्टता सुरक्षित है।
