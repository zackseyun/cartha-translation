  text: διὰ τί τὴν λαλιὰν τὴν ἐμὴν οὐ γινώσκετε; ὅτι οὐ δύνασθε ἀκούειν τὸν λόγον τὸν ἐμόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: hi
  text: तुम मेरे बोलने का ढंग क्यों नहीं समझते? इसलिए कि तुम मेरा वचन सुन नहीं सकते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλιὰν
  choice: बोलने की रीति
  rationale: यहाँ शब्द बोलने के ढंग या वाणी-शैली की ओर संकेत करता है; यह अगले खंड के λόγος, अर्थात् कथ्य या वचन, से भेद बनाए रखता है।
- source_word: γινώσκετε
  choice: समझते
  rationale: प्रसंग में अर्थ यीशु की वाणी को जानने मात्र का नहीं, बल्कि उसे समझने का है।
- source_word: ἀκούειν
  choice: सुन
  rationale: मूल क्रिया का प्राथमिक अर्थ ‘सुनना’ है। ग्रहणशीलता का भाव प्रसंग में निहित रह सकता है, पर उसे ‘मानना’ बनाकर स्पष्ट नहीं किया गया।
- source_word: λόγον
  choice: वचन
  rationale: यह यीशु के कहे हुए कथ्य या संदेश को दर्शाता है। ‘वचन’ हिन्दी बाइबलीय भाषा में स्वाभाविक है और λαλιὰ से भेद भी रखता है।
- source_word: οὐ δύνασθε
  choice: सुन नहीं सकते
  rationale: यह स्पष्ट असमर्थता व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὅτι
  choice: इसलिए कि
  rationale: यह पहले प्रश्न का कारण प्रस्तुत करता है और हिन्दी में कारणसूचक संबंध स्पष्ट रखता है।
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: मेरी / मेरा
  rationale: लिंग के अनुसार स्वाभाविक हिन्दी स्वामित्व रूप रखे गए हैं और दोनों खंडों का समानांतर संबंध सुरक्षित है।
theological_decisions:
- issue: ‘मेरा वचन सुन नहीं सकते’ में असमर्थता का स्वरूप
  choice: कथन को असमर्थता के रूप में सीधे अनूदित किया गया है, बिना उसका धार्मिक-वैचारिक कारण निर्धारित किए।
  alternative: इसे नैतिक अनिच्छा, न्यायिक कठोरता, या आत्मिक अक्षमता के रूप में स्पष्ट करना।
  rationale: पद असमर्थता बताता है, पर स्वयं उसके पूरे कारण या तंत्र को परिभाषित नहीं करता; इसलिए मूल का धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली। ‘बोलने की रीति’ और ‘वचन’ के द्वारा λαλιὰ तथा λόγος का वास्तविक शाब्दिक भेद बनाए रखा गया है।
