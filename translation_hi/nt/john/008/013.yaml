  text: εἶπον οὖν αὐτῷ οἱ Φαρισαῖοι· Σὺ περὶ σεαυτοῦ μαρτυρεῖς· ἡ μαρτυρία σου οὐκ ἔστιν ἀληθής.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: hi
  text: इसलिए फ़रीसियों ने उससे कहा, “तुम अपने ही विषय में गवाही दे रहे हो; तुम्हारी गवाही सच्ची नहीं है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी गवाही मान्य नहीं है।” यूनानी में शाब्दिक अर्थ “सच्ची नहीं” है, पर इस संदर्भ में कानूनी वैधता का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से तार्किक और कथात्मक संबंध दिखाता है; हिन्दी में ‘इसलिए’ इस निष्कर्षात्मक प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἶπον ... αὐτῷ οἱ Φαρισαῖοι
  choice: फ़रीसियों ने उससे कहा
  rationale: यूनानी वाक्य का सामान्य कथात्मक अर्थ और स्पष्ट सर्वनाम दोनों सुरक्षित रखे गए हैं।
- source_word: Σὺ περὶ σεαυτοῦ μαρτυρεῖς
  choice: तुम अपने ही विषय में गवाही दे रहे हो
  rationale: ‘तुम’ और ‘अपने ही’ स्पष्ट सर्वनामों के बल को व्यक्त करते हैं, जबकि ‘गवाही दे रहे हो’ वर्तमानकालीन तथा न्यायिक-साक्ष्य संबंधी भाव बनाए रखता है।
- source_word: ἡ μαρτυρία σου
  choice: तुम्हारी गवाही
  rationale: μαρτυρεῖς के साथ शब्दगत संगति रखता है और सामान्य तथा न्यायिक दोनों संदर्भों में स्वाभाविक है।
- source_word: οὐκ ἔστιν ἀληθής
  choice: सच्ची नहीं है
  rationale: ἀληθής का सीधा अर्थ सुरक्षित रहता है और कथन को केवल तकनीकी कानूनी वैधता तक सीमित नहीं करता।
theological_decisions:
- issue: अपने विषय में दी गई गवाही पर फ़रीसियों की आपत्ति का आशय
  choice: तुम्हारी गवाही सच्ची नहीं है
  alternative: तुम्हारी गवाही मान्य नहीं है
  rationale: संदर्भ में कानूनी वैधता का भाव संभव है, पर ἀληθής सत्यता का व्यापक अर्थ भी रखता है। मुख्य पाठ दोनों आयामों के बीच का तनाव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट। ‘गवाही’ की पुनरावृत्ति मूल यूनानी की शब्दगत संगति और विवाद के साक्ष्य-संबंधी स्वर को बनाए रखती है।
