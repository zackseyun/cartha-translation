  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: hi
  text: उन्होंने उसे उत्तर दिया, “हम अब्राहम के वंशज[a] हैं और कभी किसी के दास नहीं रहे[b]। फिर तुम कैसे कहते हो, ‘तुम स्वतंत्र हो जाओगे’?[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में शाब्दिक रूप से “अब्राहम का बीज” है; यह एकवचन सामूहिक अभिव्यक्ति शारीरिक वंश को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: या “कभी किसी की सेवा नहीं की।” इस क्रिया का अर्थ सेवा करना भी हो सकता है, पर यहाँ दासता और स्वतंत्रता का विरोध प्रमुख है।
    reason: lexical_alternative
  - marker: c
    text: या “तुम स्वतंत्र होगे।” मूल यूनानी में अधिक शाब्दिक अर्थ “तुम स्वतंत्र हो जाओगे” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: उन्होंने उसे उत्तर दिया
  rationale: यह प्रत्यक्ष उत्तर को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Σπέρμα Ἀβραάμ
  choice: अब्राहम के वंशज
  rationale: σπέρμα यहाँ सामूहिक एकवचन के रूप में शारीरिक वंश को दर्शाता है; ‘वंशज’ साधारण हिन्दी में स्वाभाविक है और उनके वंशगत दावे को स्पष्ट रखता है।
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  choice: कभी किसी के दास नहीं रहे
  rationale: पूर्णकालीन क्रिया और πώποτε के निषेध को स्वाभाविक हिन्दी में व्यक्त करता है; स्वतंत्रता के विपरीत संदर्भ में दासता का भाव प्रमुख है।
- source_word: πῶς σὺ λέγεις
  choice: फिर तुम कैसे कहते हो
  rationale: ‘कैसे’ वक्ताओं के अविश्वास और आपत्ति को व्यक्त करता है, जबकि ‘तुम’ मूल के स्पष्ट सर्वनाम का बल बनाए रखता है।
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: तुम स्वतंत्र हो जाओगे
  rationale: ‘हो जाओगे’ γίνομαι में निहित अवस्था-परिवर्तन को सुरक्षित रखता है; केवल ‘स्वतंत्र रहोगे’ या ‘स्वतंत्र होगे’ से यह परिवर्तन कम स्पष्ट होता।
theological_decisions:
- issue: स्वतंत्रता और बंधन के संदर्भ में δουλεύω का अनुवाद
  choice: दास नहीं रहे
  alternative: किसी की सेवा नहीं की
  rationale: आस-पास का प्रसंग दासता और स्वतंत्रता के विरोध पर केंद्रित है। ‘दास’ उस सामाजिक और धर्मवैचारिक तीव्रता को बचाता है, पर पादटिप्पणी में ‘सेवा’ का व्यापक शाब्दिक विकल्प भी दिया गया है।
- issue: Σπέρμα Ἀβραάμ में वंश का दावा
  choice: अब्राहम के वंशज
  alternative: अब्राहम का वंश / अब्राहम की संतान
  rationale: यहाँ आशय शारीरिक वंश का सामूहिक दावा है। ‘वंशज’ किसी बाद की धर्मवैचारिक व्याख्या को आरोपित किए बिना हिन्दी में इसे स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण संवादात्मक स्तर रखा गया है। ‘दास’ और ‘स्वतंत्र’ का स्पष्ट विरोध अगले पदों की विषयवस्तु से जुड़ता है। सभी पादटिप्पणी-चिह्न संबंधित शब्द या कथन के तुरंत बाद रखे गए हैं।
