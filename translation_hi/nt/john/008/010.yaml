source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἀνακύψας δὲ ὁ Ἰησοῦς, καὶ μηδένα θεασάμενος πλὴν τῆς γυναικός, εἶπεν αὐτῇ, Ἡ γυνή, ποῦ εἰσιν ἐκεῖνοι οἱ κατήγοροί σου; Οὐδείς σε κατέκρινεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: hi
  text: तब यीशु[a] सीधे हुए और स्त्री के सिवा किसी को न देखकर उससे कहा, “स्त्री, तुम्हारे वे आरोप लगानेवाले कहाँ हैं? क्या किसी ने भी तुम्हें दोषी नहीं ठहराया?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद व्यभिचार में पकड़ी गई स्त्री के वृत्तांत (यूहन्ना 7:53–8:11) का भाग है, जो सबसे प्राचीन यूनानी पांडुलिपियों में नहीं मिलता। यूहन्ना 7:53 की टिप्पणी देखें।
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: सीधे होकर
  rationale: पिछले प्रसंग में भूमि पर झुके हुए यीशु के फिर सीधा होने का भाव व्यक्त करता है; ‘खड़े होकर’ कहना आवश्यक नहीं, क्योंकि यूनानी क्रिया केवल मुद्रा सीधी करने को भी दर्शा सकती है।
- source_word: θεασάμενος
  choice: न देखकर
  rationale: दृश्य रूप से ध्यान देने या देखने के सामान्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατήγοροί
  choice: दोष लगानेवाले
  rationale: कानूनी या अर्ध-कानूनी प्रसंग में आरोप लगानेवालों का अर्थ देता है और सामान्य पाठक के लिए स्पष्ट है।
- source_word: κατέκρινεν
  choice: दोषी नहीं ठहराया
  rationale: यहाँ केवल सामान्य ‘न्याय करने’ के बजाय दोष का निर्णय सुनाने का कानूनी भाव है।
- source_word: Ἡ γυνή
  choice: हे स्त्री
  rationale: प्रत्यक्ष संबोधन को बनाए रखता है; मूल में यह सम्मानहीन संबोधन नहीं है, यद्यपि आधुनिक हिन्दी में इसकी शैली औपचारिक लगती है।
theological_decisions:
- issue: पाठालोचनात्मक स्थिति
  choice: पद को मुख्य पाठ में रखा और [a] द्वारा उसकी पांडुलिपीय स्थिति बताई
  alternative: पद को कोष्ठकों में रखना या मुख्य पाठ से हटाना
  rationale: दिए गए बीजान्टिन स्रोत में पद उपस्थित है, पर आरंभिक यूनानी पांडुलिपियों में पूरे प्रसंग की अनुपस्थिति पाठकों को बताना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। यूनानी वाक्य की क्रमिक संरचना को काफी हद तक बनाए रखते हुए हिन्दी प्रवाह के लिए ‘तब’ और कृदंत रूपों का प्रयोग किया गया है।
