  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: hi
  text: मैं जानता हूँ कि तुम अब्राहम के वंशज[a] हो; पर तुम मुझे मार डालना चाहते हो, क्योंकि मेरे वचन के लिए तुम्हारे भीतर जगह नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘अब्राहम का बीज’; या, ‘अब्राहम की संतान’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मेरा वचन तुम्हारे भीतर स्थान नहीं पाता।’
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: अब्राहम के वंशज
  rationale: σπέρμα यहाँ एकवचन सामूहिक अर्थ में शारीरिक वंश को सूचित करता है। ‘वंशज’ आधुनिक हिन्दी में स्वाभाविक है और इस वंशगत अर्थ को बिना आध्यात्मिक अर्थ जोड़े स्पष्ट रखता है।
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: तुम मुझे मार डालने की कोशिश कर रहे हो
  rationale: ζητέω के साथ infinitive किसी काम को करने का प्रयास या प्रयत्न व्यक्त कर सकता है। वर्तमानकालीन निरंतरता को ‘कोशिश कर रहे हो’ स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: मेरे वचन
  rationale: ‘वचन’ λόγος का सीधा और गरिमापूर्ण अनुवाद है तथा यूहन्ना में इस शब्द की अर्थ-परतों और पारिभाषिक संगति को बनाए रखता है।
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: तुम्हारे भीतर जगह नहीं मिलती
  rationale: χωρέω में स्थान पाने, समा सकने या ग्रहण किए जाने का रूपक निहित है। यह अनुवाद उस रूपक को बचाता है और यह अनावश्यक रूप से तय नहीं करता कि आशय ग्रहणशीलता, प्रभाव या प्रगति में से केवल कौन-सा है।
- source_word: ἀλλὰ
  choice: फिर भी
  rationale: यह अब्राहम से शारीरिक वंश-संबंध की स्वीकृति और यीशु के प्रति उनकी घातक शत्रुता के बीच तीखा विरोध स्पष्ट करता है।
- source_word: οἶδα ὅτι
  choice: मैं जानता हूँ कि
  rationale: यह यूनानी परिचयात्मक उपवाक्य का सीधा, स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: अब्राहम से शारीरिक वंश और अब्राहम के अनुरूप आचरण के बीच संबंध
  choice: ‘अब्राहम के वंशज’ द्वारा वंशगत संबंध को स्पष्ट रूप से स्वीकार किया गया है।
  alternative: ‘अब्राहम की संतान,’ जिसे आध्यात्मिक संतान होने के अर्थ में भी समझा जा सकता है।
  rationale: इस पद में यीशु उनके शारीरिक वंश को स्वीकार करते हैं, जबकि आगे के संदर्भ में उनके आचरण को चुनौती देते हैं। अनुवाद इस तनाव को बनाए रखता है और इसी पद में बाद की धार्मिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली। ‘मार डालने’ से ἀποκτεῖναι का स्पष्ट अर्थ आता है; ‘वचन’ यूहन्ना की शब्दावली बनाए रखता है। मुख्य पाठ का [a] चिह्न संबंधित पाद-टिप्पणी से मेल खाता है।
