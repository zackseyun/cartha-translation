translation:
  language: hi
  text: '[a] हमारी व्यवस्था में मूसा ने आज्ञा दी थी कि ऐसी स्त्रियों को पत्थर मारकर मार डाला जाए। तो फिर आप क्या कहते हैं?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह व्यभिचार में पकड़ी गई स्त्री की घटना (यूहन्ना 7:53–8:11) का आगे का भाग है। यूहन्ना 7:53 की टिप्पणी देखें।
    reason: textual_critical
lexical_decisions:
- source_word: τῷ νόμῳ ἡμῶν
  choice: हमारी व्यवस्था में
  rationale: νόμος यहाँ मूसा की व्यवस्था को दर्शाता है; ‘हमारी’ वक्ताओं के अपने धार्मिक-कानूनी संदर्भ को बनाए रखता है।
- source_word: ἐνετείλατο
  choice: आज्ञा दी है
  rationale: यह मूसा द्वारा दिए गए प्रामाणिक आदेश को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τὰς τοιαύτας
  choice: ऐसी स्त्रियों को
  rationale: स्त्रीलिंग बहुवचन रूप का स्पष्ट संकेत सुरक्षित रहता है और संदर्भतः इसका अर्थ इसी प्रकार के अपराध में पकड़ी गई स्त्रियाँ है।
- source_word: λιθοβολεῖσθαι
  choice: पत्थरवाह किया जाए
  rationale: निष्क्रिय क्रिया और पत्थर मारकर दिए जाने वाले दंड का आशय संक्षिप्त रूप में व्यक्त होता है; स्रोत में अलग से ‘मृत्यु तक’ नहीं कहा गया।
- source_word: σὺ οὖν τί λέγεις
  choice: तो फिर आप क्या कहते हैं?
  rationale: οὖν का निष्कर्षसूचक बल ‘तो फिर’ से आता है, जबकि σὺ का स्पष्ट कर्ता ‘आप’ के रूप में बना रहता है।
theological_decisions:
- issue: मूसा की व्यवस्था में दंड के कथन की सीमा
  choice: स्रोत के आरोप को ज्यों का त्यों वक्ताओं के कथन के रूप में रखा गया है।
  alternative: पुराने नियम के संबंधित विधानों का स्पष्टीकरण मुख्य पाठ में जोड़ना।
  rationale: पद उनके कथन को उद्धृत करता है; मुख्य पाठ में सामंजस्यकारी व्याख्या जोड़ने से कथात्मक तनाव और वक्ताओं की रणनीति अनावश्यक रूप से हल हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानसूचक ‘आप’ प्रसंग के अनुरूप है। ‘पत्थरवाह’ बाइबलीय-कानूनी संदर्भ में प्रचलित और संक्षिप्त है। आरंभ में δέ के लिए अलग कृत्रिम संयोजक नहीं जोड़ा गया; कथा-संबंध संदर्भ और पाद-टिप्पणी से स्पष्ट है।
