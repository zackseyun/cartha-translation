source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: hi
  text: यीशु ने उनसे कहा, “यदि परमेश्वर तुम्हारा पिता होता, तो तुम मुझसे प्रेम करते, क्योंकि मैं परमेश्वर से आया हूँ और यहाँ हूँ। क्योंकि मैं अपनी ओर से नहीं आया हूँ,[a] बल्कि उसी ने मुझे भेजा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि मैं स्वयं से नहीं आया हूँ।” यूनानी वाक्यांश स्रोत (“स्वयं से”) अथवा स्वतंत्र पहल (“अपनी ओर से”)—दोनों पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ... ἦν ... ἠγαπᾶτε ἂν
  choice: यदि परमेश्वर तुम्हारा पिता होता, तो तुम मुझसे प्रेम करते
  rationale: εἰ के साथ अपूर्णकालीन क्रियाएँ और ἄν एक तथ्य-विपरीत शर्त व्यक्त करते हैं। हिंदी में ‘यदि...होता, तो...करते’ इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον
  choice: मैं परमेश्वर से निकलकर आया हूँ
  rationale: ἐκ और ἐξέρχομαι मूल या स्रोत से आने का भाव देते हैं। ‘निकलकर आया हूँ’ इस स्रोत-संबंधी भाषा को बनाए रखता है, पर इसे किसी बाद की तकनीकी धर्मवैज्ञानिक शब्दावली में नहीं बदलता।
- source_word: καὶ ἥκω
  choice: और यहाँ हूँ
  rationale: ἥκω आगमन के साथ वर्तमान उपस्थिति का भाव रखता है; ‘यहाँ हूँ’ आधुनिक हिंदी में इस वर्तमान परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: मैं अपनी ओर से नहीं आया हूँ
  rationale: ἀπ’ ἐμαυτοῦ स्वयं से उद्गम अथवा स्वतंत्र पहल—दोनों का संकेत दे सकता है। ‘अपनी ओर से’ हिंदी में स्वतंत्र पहल के अर्थ को स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी स्रोत-केंद्रित विकल्प सुरक्षित रखती है।
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: बल्कि उसी ने मुझे भेजा है
  rationale: ἐκεῖνος पर बल है और उसका संकेत परमेश्वर की ओर है। ‘उसी ने’ उस बल को बनाए रखता है; हिंदी में पूर्ण वर्तमान ‘भेजा है’ वर्तमान मिशन-संदर्भ के अनुकूल है।
theological_decisions:
- issue: यीशु के परमेश्वर से आने की भाषा को बाद की तकनीकी श्रेणियों से अधिक निश्चित न करना
  choice: मैं परमेश्वर से निकलकर आया हूँ और यहाँ हूँ
  alternative: मैं परमेश्वर से आया हूँ और यहाँ हूँ
  rationale: यह अनुवाद यीशु के दिव्य मूल और भेजे जाने की प्रबल पुष्टि करता है, पर सामान्य यूनानी क्रियाओं को किसी विशिष्ट उत्तरकालीन धर्मवैज्ञानिक सूत्र में नहीं बदलता।
- issue: ἀπ’ ἐμαυτοῦ में स्रोत और स्वतंत्र पहल के बीच अर्थ-संभावना
  choice: मैं अपनी ओर से नहीं आया हूँ
  alternative: मैं स्वयं से नहीं आया हूँ
  rationale: मुख्य पाठ में स्वाभाविक हिंदी द्वारा स्वतंत्र पहल का अर्थ उभरता है; पादटिप्पणी स्रोत-केंद्रित संभावित अर्थ को सुरक्षित रखती है, जिससे मूल की वास्तविक अर्थगत व्यापकता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन बहुवचन ‘तुम’ है, जो प्रसंग के समूह-संबोधन को स्पष्ट रखते हुए सहज और गरिमापूर्ण है। वाक्य-संरचना तर्क की शर्त, कारण और विरोध को स्पष्ट रखती है।
