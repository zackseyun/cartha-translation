  text: As he was saying these things[b][a], many believed in him.
translation:
  language: hi
  text: जब वह ये बातें कह रहा था, बहुतों ने उस पर विश्वास किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पद यीशु की पिछली कही हुई बातों की ओर संकेत करता है; हिंदी में ‘ये बातें’ बहुवचन और प्रसंग-संबंध दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: αὐτοῦ λαλοῦντος
  choice: जब वह ... कह ही रहा था
  rationale: वर्तमान कृदंत वाला संबंधविहीन षष्ठी-वाक्यांश समकालिक और जारी क्रिया व्यक्त करता है। ‘कह ही रहा था’ इस बात को स्पष्ट करता है कि विश्वास करने की घटना उसके बोलते समय हुई।
- source_word: πολλοὶ
  choice: बहुतों ने
  rationale: विशेषण यहाँ संज्ञा की तरह प्रयुक्त है। ‘बहुतों ने’ आधुनिक हिंदी में बिना अनावश्यक रूप से ‘लोग’ जोड़ने के उसका अर्थ देता है।
- source_word: ἐπίστευσαν
  choice: विश्वास किया
  rationale: अनिश्चित भूतकाल क्रिया विश्वास की घटना को समग्र रूप में प्रस्तुत करती है; ‘विश्वास किया’ न तो आरंभ होने का अतिरिक्त अर्थ जोड़ता है, न विश्वास की प्रकृति को सीमित करता है।
- source_word: εἰς αὐτόν
  choice: उस पर
  rationale: यूहन्ना में πιστεύω के साथ εἰς व्यक्ति की ओर निर्देशित भरोसे को व्यक्त करता है। मानक हिंदी मुहावरे में ‘उस पर विश्वास किया’ केवल उसकी बात सच मानने के बजाय उस व्यक्ति पर भरोसा रखने का भाव देता है।
theological_decisions:
- issue: यूहन्ना के प्रयोग में πιστεύω εἰς αὐτόν का अनुवाद
  choice: उस पर विश्वास किया
  alternative: उसमें विश्वास किया / उस पर अपना भरोसा रखा
  rationale: ‘उस पर विश्वास किया’ हिंदी में व्यक्ति की ओर निर्देशित विश्वास और भरोसे का संबंधपरक बल बनाए रखता है। यह आगामी पदों में उस विश्वास की गुणवत्ता पर उठने वाले प्रश्न को पहले से तय नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘कह ही रहा था’ जारी भाषण और उसी दौरान घटित विश्वास की घटना को स्वाभाविक ढंग से जोड़ता है। किसी पादटिप्पणी की आवश्यकता नहीं है, क्योंकि प्रमुख अर्थगत विकल्प मुख्य पाठ में पर्याप्त रूप से समाहित हैं।
