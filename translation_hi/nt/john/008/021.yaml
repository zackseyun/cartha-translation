  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: hi
  text: इसलिए उसने उनसे फिर कहा, “मैं जा रहा हूँ, और तुम मुझे खोजोगे[a], और अपने पाप[b] में मरोगे। जहाँ मैं जा रहा हूँ, वहाँ तुम नहीं आ सकते[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम मुझे ढूँढ़ोगे।” यूनानी क्रिया किसी को तलाश करने के लिए प्रयुक्त हो सकती है और यूहन्ना में इसका एक गहरा आत्मिक अर्थ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘पाप’ एकवचन है। कुछ अनुवाद ‘पापों’ कहते हैं, पर एकवचन अलग-अलग कामों के बजाय पाप की बनी हुई दशा पर बल दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “तुम आने में समर्थ नहीं हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यह पद पिछले संवाद को आगे बढ़ाता है। यहाँ ‘तब’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंगगत संबंध बनाए रखता है; अधिक निष्कर्षसूचक ‘इसलिए’ इस संयोजक पर अनावश्यक बल डाल सकता है।
- source_word: πάλιν
  choice: फिर
  rationale: कथन की पुनरावृत्ति को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπάγω
  choice: जा रहा हूँ
  rationale: वर्तमानकालीन प्रस्थान का भाव बनाए रखता है। यूहन्ना में इसके गहरे आशय हैं, पर मुख्य पाठ में गंतव्य या माध्यम को स्पष्ट करके अर्थ को सीमित नहीं किया गया।
- source_word: ζητήσετέ με
  choice: तुम मुझे खोजोगे
  rationale: ‘खोजना’ किसी व्यक्ति की तलाश और गहरे आत्मिक अर्थ—दोनों की संभावना बनाए रखता है।
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: अपने पाप में
  rationale: यूनानी में ‘पाप’ एकवचन है। यह पदबंध व्यक्तिगत बुरे कामों की सूची के बजाय पाप की बनी हुई दशा का संकेत दे सकता है; हिन्दी में एकवचन सुरक्षित रखा गया है।
- source_word: ἀποθανεῖσθε
  choice: मरोगे
  rationale: यूनानी भविष्यकाल का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: जहाँ मैं जा रहा हूँ
  rationale: दोहराए गए ὑπάγω और उसके वर्तमानकालीन रूप को सहज हिन्दी में बनाए रखता है।
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: तुम नहीं आ सकते
  rationale: असमर्थता व्यक्त करने वाले δύνασθε को स्वाभाविक हिन्दी में स्पष्ट रूप से प्रस्तुत करता है।
theological_decisions:
- issue: ἁμαρτίᾳ का एकवचन या हिन्दी में अधिक प्रचलित बहुवचन
  choice: मुख्य पाठ में ‘अपने पाप में’
  alternative: ‘अपने पापों में’
  rationale: मूल पाठ में संज्ञा एकवचन है। इसे बनाए रखने से पाप के अलग-अलग कामों और पाप की निरंतर दशा के बीच की अर्थगत तनातनी समय से पहले समाप्त नहीं होती।
- issue: ὑπάγω में यीशु के प्रस्थान का आशय
  choice: ‘मैं जा रहा हूँ’
  alternative: ‘मैं चला जा रहा हूँ’ या अर्थ खोलकर पिता के पास जाने का उल्लेख
  rationale: यूहन्ना के व्यापक प्रसंग में यह प्रस्थान मृत्यु, पुनरुत्थान और पिता के पास लौटने की ओर संकेत कर सकता है, किंतु इस पद में गंतव्य स्पष्ट नहीं किया गया। अनुवाद उसी अर्थगत खुलापन को बनाए रखता है।
- issue: καί से जुड़े मृत्यु-वाक्य का हिन्दी संबंध
  choice: ‘पर अपने पाप में मरोगे’
  alternative: ‘और अपने पाप में मरोगे’
  rationale: यहाँ καί क्रम और परिणाम को जोड़ता है; हिन्दी में ‘पर’ खोजने के बावजूद न पाने और पाप में मरने की तीखी विरोधात्मक परिणति को स्वाभाविक ढंग से सामने लाता है, बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और वाचनीय रूप रखा गया है। ‘खोजोगे’ सामान्य तलाश और संभावित आत्मिक संकेत दोनों को समेटता है। ‘अपने पाप में’ कुछ असामान्य लग सकता है, फिर भी मूल के महत्त्वपूर्ण एकवचन को सुरक्षित रखने के लिए इसे जानबूझकर रखा गया है।
