lexical_decisions:
- source_word: Ἄγουσιν (ἄγω)
  choice: लाए
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर स्वाभाविक हिन्दी कथन-प्रवाह के लिए सामान्य भूतकाल उपयुक्त है।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: यह उन यहूदी धर्मशास्त्र-विशेषज्ञों और व्यवस्था के शिक्षकों के लिए प्रचलित, संक्षिप्त हिन्दी पद है।
- source_word: ἐν μοιχείᾳ κατειλημμένην (καταλαμβάνω)
  choice: व्यभिचार करते पकड़ी गई
  rationale: पूर्ण निष्क्रिय कृदन्त के साथ यह वाक्यांश स्त्री के व्यभिचार की क्रिया में पकड़े जाने को व्यक्त करता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: στήσαντες (ἵστημι)
  choice: खड़ा करके
  rationale: अोरिस्ट सक्रिय कृदन्त उस स्त्री को जानबूझकर सभा के बीच खड़ा किए जाने की पूर्ववर्ती क्रिया बताता है।
- source_word: ἐν μέσῳ (μέσος)
  choice: बीच में
  rationale: यह उपस्थित लोगों के मध्य रखे जाने का स्वाभाविक हिन्दी बोध देता है।
