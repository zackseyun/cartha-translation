base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: hi
  text: “तुम अपने पिता के काम कर रहे हो।” उन्होंने उससे कहा, “हम यौन अनैतिकता से पैदा नहीं हुए[a]; हमारा एक ही पिता है—परमेश्वर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम नाजायज़ संतान नहीं हैं।” यूनानी में शाब्दिक रूप से है, “हम यौन अनैतिकता से पैदा नहीं हुए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖτε
  choice: कर रहे हो
  rationale: वर्तमानकालीन क्रिया की जारी और सक्रिय प्रकृति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ ἔργα
  choice: काम
  rationale: ἔργα के सामान्य अर्थ ‘काम/कर्म’ को सरल आधुनिक हिन्दी में रखता है और ποιεῖτε के साथ क्रियात्मक संबंध बनाए रखता है।
- source_word: τοῦ πατρὸς ὑμῶν
  choice: अपने पिता के
  rationale: ‘पिता’ स्रोत या आत्मिक वंश-संबंध की रूपकात्मक धारणा और प्रसंग की तनावपूर्ण अस्पष्टता दोनों को सुरक्षित रखता है।
- source_word: ἐκ πορνείας
  choice: व्यभिचार से
  rationale: जन्म के संदर्भ में पोर्नैया से जुड़े अनुचित यौन संबंध का निकट और स्वाभाविक हिन्दी रूप है; निहित ‘नाजायज़ संतान’ का अर्थ मुख्य पाठ में स्पष्ट करके नहीं जोड़ा गया।
- source_word: οὐ γεγεννήμεθα
  choice: पैदा नहीं हुए
  rationale: पूर्ण निष्क्रिय रूप को जन्म-संबंधी मुहावरे में स्वाभाविक हिन्दी के रूप में प्रस्तुत करता है।
- source_word: ἕνα πατέρα ἔχομεν
  choice: हमारा एक ही पिता है
  rationale: ἕνα का एकमात्रता पर बल ‘एक ही’ से स्पष्ट होता है और हिन्दी में संबंध स्वाभाविक ढंग से व्यक्त होता है।
- source_word: τὸν θεόν
  choice: परमेश्वर
  rationale: यह पद ‘एक ही पिता’ की पहचान परमेश्वर के रूप में करता है; दीर्घ विराम-चिह्न इस समानाधिकरण को स्पष्ट रखता है।
theological_decisions:
- issue: क्या ‘व्यभिचार से पैदा नहीं हुए’ को मुख्य पाठ में ‘नाजायज़ संतान नहीं हैं’ बनाकर उसका निहितार्थ स्पष्ट किया जाए
  choice: मुख्य पाठ में स्रोत की जन्म-संबंधी अभिव्यक्ति ‘व्यभिचार से पैदा नहीं हुए’ बनाए रखी गई।
  alternative: “हम नाजायज़ संतान नहीं हैं।”
  rationale: यूनानी मुहावरे में अवैध जन्म का संकेत संभव है, पर मूल कथन सीधे πορνεία से जन्म लेने से इनकार करता है। शाब्दिक रूप को रखने से संभावित विवादात्मक संकेत और धार्मिक तनाव बिना अनावश्यक व्याख्या के सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘व्यभिचार’ स्रोत के यौन-अनैतिकता संबंधी अर्थ को संक्षेप में व्यक्त करता है, जबकि पाद-टिप्पणी जन्म की वैधता से जुड़े संभावित मुहावरेदार अर्थ को बताती है।
