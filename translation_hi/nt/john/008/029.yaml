id: JHN.8.29
reference: John 8:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: hi
  text: और जिसने मुझे भेजा है, वह मेरे साथ है। उसने मुझे अकेला नहीं छोड़ा, क्योंकि मैं सदा वही करता हूँ जो उसे भाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: जिसने मुझे भेजा है
  rationale: संज्ञा के रूप में प्रयुक्त भूतकालिक कृदंत भेजने वाले का उल्लेख करता है। हिन्दी में यह रूप स्वाभाविक है और मूल के संबंधपरक वर्णन को बनाए रखता है।
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: वह मेरे साथ है
  rationale: μετά के साथ संबंधसूचक रूप संगति और उपस्थिति व्यक्त करता है; ‘मेरे साथ है’ इसका सहज और सटीक हिन्दी रूप है।
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: उसने मुझे अकेला नहीं छोड़ा
  rationale: अओरिस्ट क्रिया को सामान्य भूतकाल में प्रस्तुत किया गया है; संदर्भ में पहले वाक्य से उसकी वर्तमान प्रासंगिकता स्पष्ट रहती है। μόνον यहाँ ‘मुझे’ की अवस्था बताता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι कारण प्रस्तुत करता है, इसलिए ‘क्योंकि’ उसके संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: वही ... जो उसे भाता है
  rationale: नपुंसकलिंग बहुवचन पदबंध का अर्थ ‘वे बातें/काम जो उसे प्रिय हैं’ है। यह हिन्दी रूप मूल की मूल्यांकनात्मक भावना को रखते हुए सहज है।
- source_word: ποιῶ πάντοτε
  choice: मैं सदा ... करता हूँ
  rationale: वर्तमानकालीन क्रिया नियमित आचरण और πάντοτε उसकी निरंतरता व्यक्त करता है; ‘सदा करता हूँ’ दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ‘जिसने मुझे भेजा है’ का संदर्भ
  choice: मूल के संबंधपरक पदबंध को ही रखा गया है।
  alternative: स्पष्ट रूप से ‘पिता जिसने मुझे भेजा है’ जोड़ना।
  rationale: यूहन्ना के संदर्भ में इसका संकेत पिता की ओर है, पर यूनानी पाठ यहाँ ‘पिता’ नहीं कहता; इसलिए मूल की शैली और निहित संदर्भ सुरक्षित रखा गया है।
- issue: ἀφῆκεν का कालगत रूप
  choice: ‘उसने ... नहीं छोड़ा’ सामान्य भूतकाल।
  alternative: ‘उसने ... अकेला नहीं छोड़ रखा है’ या वर्तमान-पूर्ण भाव।
  rationale: यूनानी अओरिस्ट को सीधे भूतकाल में रखा गया है, जबकि उसकी जारी प्रासंगिकता पहले कथन ‘वह मेरे साथ है’ से स्पष्ट है। इससे मूल की कालगत बनावट अनावश्यक रूप से नहीं बदली जाती।
- issue: कारणसूचक ὅτι और पुत्र की आज्ञाकारिता
  choice: ‘क्योंकि’ के कारणसूचक तनाव को स्पष्ट रूप से बनाए रखा गया है।
  alternative: इसे केवल व्याख्यात्मक ‘कि’ या ढीले संयोजक ‘और’ से प्रस्तुत करना।
  rationale: वाक्य पिता की उपस्थिति/न छोड़ने और यीशु द्वारा सदा प्रसन्नकारी काम करने के बीच कारणसूचक संबंध व्यक्त करता है। अनुवाद इस कथन को रखता है, पर उसके व्यापक धर्मवैज्ञानिक अर्थ की अतिरिक्त व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पाठ में स्वाभाविक है। ‘सदा’ ने πάντοτε की पूर्ण निरंतरता को संक्षेप में रखा है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
