  text: ⸀Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Οὐ καλῶς λέγομεν ἡμεῖς ὅτι Σαμαρίτης εἶ σὺ καὶ δαιμόνιον ἔχεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: hi
  text: यहूदियों[a] ने उसे उत्तर में कहा, “क्या हम ठीक नहीं कहते कि तुम सामरी हो और तुममें दुष्टात्मा है?”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूहन्ना के वर्णन में “यहूदी” शब्द कई बार यीशु का विरोध करने वाले किसी विशेष समूह के लिए आता है; इसका अर्थ बिना अपवाद हर यहूदी व्यक्ति नहीं है। कुछ संदर्भों में इसका अनुवाद “यहूदिया के लोग” या “यहूदी अगुवे” भी किया जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “क्या हम सही नहीं कहते...?”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “तुम दुष्टात्मा रखते हो”; कुछ अनुवाद इसका अधिक व्याख्यात्मक रूप “तुम दुष्टात्मा के वश में हो” करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ
  choice: यहूदियों ने उसे उत्तर दिया
  rationale: ग्रीक में ‘उत्तर दिया और उससे कहा’ दो क्रियाएँ हैं, पर आधुनिक हिन्दी में दोनों को साथ रखना अनावश्यक पुनरुक्ति लगेगा; ‘उत्तर दिया’ कथात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदियों
  rationale: मूल पद का सीधा अर्थ ‘यहूदी’ है। पद स्वयं इसे ‘यहूदी अगुवों’ तक सीमित नहीं करता; संदर्भगत सूक्ष्मता पाद-टिप्पणी में दी गई है।
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: क्या हम ठीक नहीं कहते
  rationale: नकारात्मक प्रश्न सहमति की अपेक्षा करता है। यह हिन्दी अभिव्यक्ति καλῶς के ‘ठीक/सही रीति से’ अर्थ और प्रश्न की आलंकारिक शक्ति को बनाए रखती है।
- source_word: Σαμαρίτης
  choice: सामरी
  rationale: यह जातीय और धार्मिक पहचान का सीधा पद है, जिसे यहाँ अपमान के रूप में प्रयोग किया गया है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘सामरी’ स्पष्ट और प्रचलित है।
- source_word: δαιμόνιον ἔχεις
  choice: तुममें दुष्टात्मा है
  rationale: ग्रीक का शाब्दिक ढाँचा ‘तुम दुष्टात्मा रखते हो’ है। हिन्दी में ‘तुममें दुष्टात्मा है’ स्वाभाविक है और अधिक व्याख्यात्मक ‘तुम दुष्टात्मा के वश में हो’ की अपेक्षा मूल कथन के निकट रहता है।
theological_decisions:
- issue: यूहन्ना में οἱ Ἰουδαῖοι का संदर्भ
  choice: यहूदियों
  alternative: यहूदी अगुवों; यहूदिया के लोगों
  rationale: मुख्य पाठ मूल यूनानी की सामान्य संज्ञा को बनाए रखता है और संदर्भ को बिना स्पष्ट आधार के संकुचित नहीं करता। साथ ही पाद-टिप्पणी स्पष्ट करती है कि यहाँ हर यहूदी व्यक्ति के विषय में सामूहिक कथन नहीं है।
- issue: δαιμόνιον ἔχεις की अभिव्यक्ति
  choice: तुममें दुष्टात्मा है
  alternative: तुम दुष्टात्मा के वश में हो
  rationale: चुना गया रूप मूल के ‘दुष्टात्मा होना/रखना’ कथन के अधिक निकट है और अधिकार या आवेश की प्रकृति पर अतिरिक्त व्याख्या नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सामरी’ बाइबलीय संदर्भ में परिचित पद है। यूनानी की दोहरी कथात्मक अभिव्यक्ति (‘उत्तर दिया और कहा’) को स्वाभाविक हिन्दी में संक्षिप्त किया गया है।
