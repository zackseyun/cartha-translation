  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: hi
  text: इसलिए उन्होंने उस पर फेंकने के लिए पत्थर उठा लिए; पर यीशु छिप गया और मंदिर[a] से बाहर चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक ठीक अर्थ: ‘मंदिर-परिसर से।’ यहाँ यूनानी शब्द ἱερόν है, जो केवल भीतरी पवित्र भवन नहीं, बल्कि पूरे मंदिर-परिसर को दर्शाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: उठा लिए
  rationale: यहाँ αἴρω का अर्थ पत्थरों को हाथ में उठा लेना है; ‘उठा लिए’ स्वाभाविक हिन्दी में आगामी हिंसक उद्देश्य को स्पष्ट करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह शब्द पिछली बात के परिणाम या प्रतिक्रिया को जोड़ता है; ‘इसलिए’ उस तार्किक संबंध को बनाए रखता है।
- source_word: λίθους
  choice: पत्थर
  rationale: इस प्रसंग में λίθος के लिए यह सामान्य और सटीक हिन्दी शब्द है तथा पथराव की हिंसक पृष्ठभूमि को बनाए रखता है।
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: उस पर फेंकने के लिए
  rationale: ἵνα और संभावनार्थक क्रिया यहाँ उद्देश्य बताते हैं; हिन्दी में ‘के लिए’ इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: ἐκρύβη
  choice: छिप गया
  rationale: रूप व्याकरणतः कर्मवाच्य है, पर प्रसंग में क्रिया आत्मवाचक अर्थ दे सकती है। ‘छिप गया’ किसी अज्ञात बाहरी कर्ता को जोड़े बिना सहज हिन्दी देता है।
- source_word: ἐξῆλθεν
  choice: बाहर चला गया
  rationale: यह ἐξέρχομαι द्वारा व्यक्त बाहर जाने की वास्तविक गति को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐκ τοῦ ἱεροῦ
  choice: मंदिर से
  rationale: मुख्य पाठ में ‘मंदिर’ सरल और परिचित है; ἱερόν से अभिप्रेत पूरे मंदिर-परिसर की अधिक सटीक जानकारी पादटिप्पणी में दी गई है।
theological_decisions:
- issue: यीशु के बच निकलने का स्वरूप
  choice: पाठ के अनुसार केवल यह कहना कि यीशु छिप गया और बाहर चला गया
  alternative: यह जोड़ना कि वह चमत्कारिक रूप से उनके बीच से निकल गया या अदृश्य हो गया
  rationale: SBLGNT के दिए हुए पाठ में केवल यीशु के छिपने और मंदिर से बाहर जाने का उल्लेख है। बाद की कुछ पाठ-परंपराओं के विस्तार या चमत्कार संबंधी अनुमान को अनुवाद में जोड़ना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘इसलिए’ पूर्ववर्ती कथन से संबंध दिखाता है, और अर्धविराम विरोधी क्रियाओं—भीड़ का पत्थर उठाना तथा यीशु का निकल जाना—को सुगमता से जोड़ता है।
