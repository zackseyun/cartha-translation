  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: hi
  text: परन्तु वे[a] यह सुनकर, अपने विवेक से दोषी ठहराए जाने पर, एक-एक करके बाहर चले गए—बुज़ुर्गों से आरम्भ करके अन्तिम लोगों तक। और यीशु अकेले रह गए, और वह स्त्री बीच में खड़ी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह व्यभिचार में पकड़ी गई स्त्री के प्रसंग (यूहन्ना 7:53–8:11) की निरन्तरता है। यूहन्ना 7:53 की टिप्पणी देखें।
    reason: textual_critical
lexical_decisions:
- source_word: συνείδησις
  choice: विवेक
  rationale: यहाँ शब्द उस भीतरी नैतिक चेतना को दर्शाता है जो सही-गलत का बोध कराती है; आधुनिक हिन्दी में ‘विवेक’ इसका स्वाभाविक और सटीक रूप है।
- source_word: ἐλέγχω
  choice: दोषी ठहराए जाकर
  rationale: निष्क्रिय कृदन्त यहाँ उनके विवेक द्वारा उनके दोष के उजागर और सिद्ध होने का भाव देता है; यह अनुवाद उस आन्तरिक नैतिक दोषबोध को बनाए रखता है।
- source_word: πρεσβύτερος
  choice: बुज़ुर्गों
  rationale: इस प्रसंग में यह औपचारिक पद ‘प्राचीन’ की अपेक्षा आयु में बड़े लोगों की ओर संकेत करता है, विशेषतः क्रम के आरम्भ को बताने के लिए।
- source_word: ἕως τῶν ἐσχάτων
  choice: अन्तिम व्यक्ति तक
  rationale: यह वाक्यांश क्रम की सीमा बताता है। ‘अन्तिम व्यक्ति तक’ हिन्दी में स्वाभाविक है और यह अनावश्यक रूप से ‘सबसे छोटे’ अर्थ को नहीं थोपता।
- source_word: ἐν μέσῳ ἑστῶσα
  choice: बीच में खड़ी रही
  rationale: पूर्णकालिक कृदन्त स्त्री की बनी हुई स्थिति को दर्शाता है; ‘खड़ी रही’ हिन्दी में उस निरन्तर अवस्था को स्पष्ट करता है।
theological_decisions:
- issue: ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι में दोषबोध का कर्ता
  choice: अपने विवेक से दोषी ठहराए जाकर
  alternative: मन में दोषी अनुभव करके
  rationale: मूल पाठ विवेक को प्रभावकारी माध्यम/कर्ता के रूप में व्यक्त करता है। चुना हुआ रूप इस व्याकरणिक सम्बन्ध और नैतिक न्याय के भाव को सुरक्षित रखता है।
- issue: πρεσβύτεροι की पहचान
  choice: बुज़ुर्ग
  alternative: धर्म-वृद्ध/प्राचीन
  rationale: यहाँ औपचारिक धार्मिक पद स्पष्ट नहीं है; आयु-आधारित अर्थ प्रसंग और क्रम से अधिक मेल खाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परन्तु’, ‘विवेक’ और ‘दोषी ठहराए जाकर’ मूल यूनानी के विरोध, नैतिक चेतना और निष्क्रिय क्रिया को बनाए रखते हैं। ‘केवल यीशु रह गए’ का अर्थ प्रसंगगत रूप से आरोप लगाने वालों के चले जाने से है; स्त्री की उपस्थिति अगली उपवाक्य में स्पष्ट है।
