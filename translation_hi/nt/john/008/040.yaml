source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: hi
  text: पर अब तुम मुझे मार डालने की कोशिश कर रहे हो—एक ऐसे मनुष्य को जिसने तुम्हें वह सत्य बताया है जो मैंने परमेश्वर से सुना। अब्राहम ने ऐसा नहीं किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: पर अब
  rationale: ‘अब’ समय-संबंधी विरोध और ‘पर’ δέ का प्रतिकूल भाव स्वाभाविक हिन्दी में बनाए रखते हैं।
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: तुम मुझे मार डालने की कोशिश कर रहे हो
  rationale: ζητέω के साथ infinitive यहाँ किसी काम का प्रयत्न करने का अर्थ देता है; वर्तमानकालीन, लगातार इरादे को सहज हिन्दी में व्यक्त किया गया है।
- source_word: ἀποκτεῖναι
  choice: मार डालने
  rationale: यह क्रिया का सीधा अर्थ है; ‘हत्या’ अनावश्यक कानूनी या नैतिक विशिष्टता जोड़ सकती है।
- source_word: ἄνθρωπον
  choice: मुझ मनुष्य को
  rationale: यीशु अपने लिए एकवचन ἄνθρωπον कहते हैं। ‘मुझ मनुष्य को’ मूल के apposition को स्पष्ट रखते हुए उनकी वास्तविक मानवता को सीधे व्यक्त करता है।
- source_word: τὴν ἀλήθειαν
  choice: वह सत्य
  rationale: निश्चित उपपद और आगे आने वाले संबंधवाचक वाक्य के कारण ‘वह सत्य’ हिन्दी में निश्चित विषय-वस्तु को स्वाभाविक ढंग से दर्शाता है।
- source_word: ὑμῖν λελάληκα
  choice: तुम्हें ... बताया है
  rationale: पूर्णकाल λελάληκα अतीत में कही गई बात की वर्तमान प्रासंगिकता रखता है; ‘बताया है’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: जो मैंने परमेश्वर से सुना
  rationale: παρά के संबंधकारक रूप का अर्थ यहाँ स्रोत है; ‘परमेश्वर से’ बिना अतिरिक्त स्थानिक या धर्मशास्त्रीय विवरण जोड़े इसे व्यक्त करता है।
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: अब्राहम ने ऐसा नहीं किया
  rationale: ‘ऐसा’ पिछले पूरे आचरण की ओर संकेत करता है और यूनानी वाक्य का अब्राहम के साथ विरोध स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ἄνθρωπον में यीशु का आत्म-वर्णन
  choice: मुझ मनुष्य को
  alternative: मुझ आदमी को
  rationale: ‘मनुष्य’ dignified और स्पष्ट है तथा मूल शब्द में व्यक्त यीशु की मानवता को बनाए रखता है; इससे उनकी दिव्यता पर न कोई टिप्पणी जोड़ी जाती है, न उसे घटाया जाता है।
- issue: παρὰ τοῦ θεοῦ में यीशु के संदेश का स्रोत
  choice: परमेश्वर से
  alternative: पिता से
  rationale: मूल पाठ θεός कहता है, ‘पिता’ नहीं; इसलिए अधिक विशिष्ट धर्मशास्त्रीय उपाधि नहीं जोड़ी गई।
- issue: τοῦτο का संकेत
  choice: ऐसा नहीं किया
  alternative: यह नहीं किया
  rationale: संकेत संभवतः यीशु को मारने की कोशिश वाले पूरे पूर्ववर्ती आचरण की ओर है। ‘ऐसा’ हिन्दी में उस व्यापक संकेत को स्वाभाविक रखता है, उसे किसी और विशिष्ट कर्म तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में प्रसंगानुसार बहुवचन ‘तुम’; भाषा सरल, गरिमापूर्ण और मौखिक रूप से सुबोध रखी गई है। डैश appositional ‘मुझ मनुष्य को’ को स्पष्ट करता है।
