reference: John 8:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
translation:
  language: hi
  text: इसलिए यहूदी[a] कह रहे थे, “कहीं वह अपने आप को मार तो नहीं डालेगा, क्योंकि वह कहता है, ‘जहाँ मैं जा रहा हूँ, वहाँ तुम नहीं आ सकते’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, यूहन्ना के संदर्भ में, “यहूदिया के लोग” अथवा “यहूदी अगुए”; यह इस पर निर्भर है कि यहाँ यूहन्ना इस शब्द से कितने व्यापक समूह की ओर संकेत करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्णकाल चल रही या दोहराई जा रही बातचीत का संकेत देता है; हिंदी में यह रूप उस पक्ष को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह यीशु के पिछले कथन से श्रोताओं द्वारा निकाले गए निष्कर्ष और कथात्मक संबंध को व्यक्त करता है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदी
  rationale: यूनानी पद का सीधा अर्थ यही है। यूहन्ना में संदर्भ कभी यहूदिया के लोगों, विरोधियों या यहूदी अगुओं की ओर हो सकता है, पर इस पद में दायरा स्पष्ट रूप से सीमित नहीं किया गया है।
- source_word: Μήτι
  choice: कहीं ... तो नहीं
  rationale: यह प्रश्न नकारात्मक उत्तर की अपेक्षा प्रकट करता है; यह हिंदी मुहावरा संशय और नकारात्मक अपेक्षा दोनों को स्वाभाविक रूप से रखता है।
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: अपने आप को मार ... डालेगा
  rationale: मूल क्रिया और निजवाचक सर्वनाम का सीधा, वर्तमान हिंदी में स्पष्ट अनुवाद है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह उनके अनुमान का आधार प्रस्तुत करता है—वे यीशु के कथन के कारण ऐसा सोचते हैं।
- source_word: λέγει
  choice: वह कहता है
  rationale: यूनानी वर्तमानकाल को उद्धरण की जीवंत रूपरेखा में बनाए रखता है।
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: जहाँ मैं जा रहा हूँ
  rationale: ὑπάγω के जाने या चले जाने के अर्थ को बिना अनावश्यक विस्तार के स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: वहाँ तुम नहीं आ सकते
  rationale: δύνασθε की सामर्थ्य अथवा संभावना संबंधी शक्ति को संक्षिप्त और स्वाभाविक हिंदी में रखता है; 'वहाँ' हिंदी वाक्य में गंतव्य को स्पष्ट रूप से जोड़ता है।
theological_decisions:
- issue: यूहन्ना के सुसमाचार में οἱ Ἰουδαῖοι का संदर्भ
  choice: मुख्य पाठ में “यहूदी”
  alternative: “यहूदिया के लोग” अथवा “यहूदी अगुए”
  rationale: मूल पद का सीधा अर्थ बनाए रखा गया है, क्योंकि यह पद स्वयं संदर्भ को किसी छोटे समूह तक स्पष्ट रूप से सीमित नहीं करता। साथ ही पादटिप्पणी यूहन्ना के संदर्भ में संभव संकुचित अर्थ बताती है, ताकि इसे समस्त यहूदी जाति के विषय में अनावश्यक रूप से व्यापक न समझा जाए।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और मौखिक संवाद के अनुकूल। “कहीं ... तो नहीं” प्रश्न में निहित नकारात्मक अपेक्षा को सहज रूप से व्यक्त करता है।
