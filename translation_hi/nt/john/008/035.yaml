source:
  edition: SBLGNT
  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The servant does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: hi
  text: पर गुलाम[a] घराने में सदा नहीं रहता; पुत्र[b] सदा रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अनुवाद ‘दास’ या ‘सेवक’ भी हो सकता है; यहाँ पुत्र के साथ हैसियत का विरोध होने के कारण ‘गुलाम’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: प्रसंग में ‘पुत्र’ से यीशु की ओर परोक्ष संकेत भी हो सकता है, यद्यपि यह कथन सामान्य कहावत के रूप में भी समझ में आता है।
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: गुलाम
  rationale: यहाँ पुत्र के साथ सामाजिक हैसियत और घराने में स्थायी स्थान का विरोध है; इसलिए ‘गुलाम’ बंधी हुई और अधीन स्थिति को ‘सेवक’ से अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: μένει
  choice: रहता
  rationale: दोनों बार एक ही क्रिया रखकर यूनानी पाठ की पुनरावृत्ति और स्थायी स्थान के भाव को सुरक्षित रखा गया है।
- source_word: οἰκία
  choice: घराना
  rationale: कथन केवल किसी भवन में रहने के विषय में नहीं, बल्कि परिवार के दायरे में सदस्यता और स्थान के विषय में है; ‘घराना’ इस सामाजिक-पारिवारिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह मुहावरा स्थायी अवधि को दर्शाता है; ‘सदा’ दोनों खंडों में संक्षिप्त, स्वाभाविक और समानांतर है।
- source_word: υἱός
  choice: पुत्र
  rationale: यूनानी शब्द पुल्लिंग एकवचन है और घराने में गुलाम की स्थिति के विपरीत पुत्र की स्थायी स्थिति को दर्शाता है; ‘पुत्र’ उस विशेष विरोध को बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: δέ यहाँ कथन को पिछले संदर्भ से जोड़ते हुए हल्का विरोध प्रकट करता है; ‘पर’ हिन्दी में इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘पुत्र’ में सम्भावित मसीह-संबंधी संकेत
  choice: सामान्य किंतु संकेतपूर्ण ‘पुत्र’ रखा गया है।
  alternative: इसे स्पष्ट उपाधि मानकर ‘परमेश्वर का पुत्र’ या विशेष रूप से ‘यीशु’ लिखना।
  rationale: यह वाक्य घराने की स्थिति पर एक सामान्य कहावत की तरह भी काम करता है, जबकि अगले पद और व्यापक प्रसंग में यीशु की ओर संकेत भी कर सकता है। अनुवाद इस दोहरे प्रभाव को स्पष्ट व्याख्या से नहीं बाँधता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘गुलाम—पुत्र’ तथा ‘नहीं रहता—रहता है’ के समानांतर विरोध को स्पष्ट रखा गया है; अर्धविराम मूल के दो निकट जुड़े खंडों को दर्शाता है।
