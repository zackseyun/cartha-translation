  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: hi
  text: मैं तुमसे सच-सच कहता हूँ, यदि कोई मेरे वचन का पालन करे, तो वह अनन्तकाल तक मृत्यु को कभी नहीं देखेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: दोहराव को बनाए रखते हुए यीशु की गंभीर और प्रामाणिक उद्घोषणा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν ἐμὸν λόγον τηρήσῃ
  choice: मेरे वचन का पालन करे
  rationale: τηρέω का अर्थ केवल सुनना नहीं, बल्कि वचन को मानना और उसके अनुसार चलना है; ‘पालन करना’ इस भाव को संक्षेप में व्यक्त करता है।
- source_word: θάνατον ... θεωρήσῃ
  choice: मृत्यु को ... देखेगा
  rationale: मूल की सामी शैली ‘मृत्यु देखना’ को सुरक्षित रखा गया है; इसे व्याख्यात्मक रूप से ‘मरना’ नहीं बनाया गया।
- source_word: οὐ μὴ ... εἰς τὸν αἰῶνα
  choice: अनन्तकाल तक ... कभी नहीं
  rationale: οὐ μή की प्रबल निषेधात्मकता और εἰς τὸν αἰῶνα की कालगत अभिव्यक्ति दोनों को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: विश्वासी के लिए ‘मृत्यु को न देखना’ का आशय
  choice: मूल रूपक और उसकी प्रबल कालगत भाषा को ज्यों का त्यों रखा गया
  alternative: ‘वह कभी नहीं मरेगा’ या ‘वह अनन्त मृत्यु का अनुभव नहीं करेगा’
  rationale: पद स्वयं शारीरिक और अनन्त मृत्यु के संबंध को स्पष्ट नहीं करता; व्याख्यात्मक विस्तार से इस धर्मवैज्ञानिक तनाव को समय से पहले हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध है। ‘वचन’ बाइबलीय संदर्भ में परिचित है, जबकि वाक्य-संरचना सहज हिन्दी रखी गई है।
