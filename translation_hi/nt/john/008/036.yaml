  text: So if the Son sets you free[a], you will be truly free.
translation:
  language: hi
  text: इसलिए, यदि पुत्र तुम्हें स्वतंत्र करे, तो तुम सचमुच स्वतंत्र होगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: इसलिए यदि
  rationale: ἐὰν शर्त प्रकट करता है और οὖν पिछले कथन से निकला निष्कर्ष; ‘इसलिए यदि’ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁ υἱὸς
  choice: पुत्र
  rationale: संदर्भ में यह यीशु के लिए प्रयुक्त विशिष्ट मसीही उपाधि है। देवनागरी में बड़े अक्षर का भेद न होने के कारण निश्चितता और उपाधिगत अर्थ संदर्भ से स्पष्ट होता है।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: यूनानी सर्वनाम बहुवचन है। आधुनिक हिन्दी में ‘तुम्हें’ संबोधित समूह के लिए स्वाभाविक है और अनावश्यक विस्तार नहीं करता।
- source_word: ἐλευθερώσῃ
  choice: स्वतंत्र कर दे
  rationale: यह सशर्त उपवाक्य में मुक्ति दिलाने की क्रिया व्यक्त करता है। ‘स्वतंत्र कर दे’ आधुनिक हिन्दी में स्वाभाविक है और परिणामकारी भाव को स्पष्ट रखता है।
- source_word: ὄντως
  choice: सचमुच
  rationale: यह क्रियाविशेषण स्वतंत्रता की वास्तविकता और प्रामाणिकता पर बल देता है; ‘सचमुच’ उसका सहज और बलयुक्त हिन्दी रूप है।
- source_word: ἐλεύθεροι
  choice: स्वतंत्र
  rationale: यह मुक्त किए जाने की क्रिया नहीं, उसके फलस्वरूप प्राप्त दशा बताने वाला विधेय विशेषण है।
- source_word: ἔσεσθε
  choice: होगे
  rationale: यूनानी भविष्यकाल को आधुनिक और स्वाभाविक हिन्दी भविष्यकाल में व्यक्त करता है।
theological_decisions:
- issue: ‘पुत्र’ की पहचान
  choice: यीशु के लिए विशिष्ट मसीही उपाधि ‘पुत्र’
  alternative: कोई सामान्य पुत्र
  rationale: यूहन्ना के निकटवर्ती संदर्भ में ‘पुत्र’ यीशु की आत्म-पहचान और उसके अधिकार से जुड़ा है; अनुवाद इसे सामान्य संबंधवाची संज्ञा में नहीं बदलता।
- issue: बताई गई स्वतंत्रता का स्वरूप
  choice: वास्तविक और सच्ची स्वतंत्रता, जिसका दायरा अनुवाद में सीमित नहीं किया गया
  alternative: केवल आत्मिक स्वतंत्रता या केवल सामाजिक-राजनीतिक स्वतंत्रता
  rationale: निकटवर्ती संदर्भ पाप की दासता की बात करता है, पर पद परिणाम को व्यापक शब्दों में रखता है। ‘सचमुच स्वतंत्र’ उस बल को बनाए रखता है, बिना पद से अधिक विशिष्ट व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। ‘मुक्त’ की अपेक्षा ‘स्वतंत्र’ चुना गया है ताकि क्रिया और परिणामी दशा के बीच यूनानी शब्द-संबंध स्वाभाविक हिन्दी में बना रहे।
