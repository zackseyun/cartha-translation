source:
  edition: SBLGNT
  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: hi
  text: तुम्हारे विषय में मुझे बहुत कुछ कहना और न्याय करना है[a]। पर जिसने मुझे भेजा है, वह सच्चा है; और जो बातें मैंने उससे सुनी हैं, वही बातें मैं संसार से कहता हूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारे बारे में’।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में संकेतवाचक पद दोहराकर बल दिया गया है: ‘जो बातें मैंने उससे सुनी हैं, वही बातें मैं संसार से कहता हूँ।’'
    reason: source_emphasis
lexical_decisions:
- source_word: πολλὰ
  choice: बहुत कुछ
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘बहुत कुछ’ आधुनिक हिन्दी में स्वाभाविक है और कही जाने तथा न्याय किए जाने योग्य अनेक बातों का समष्टिगत भाव रखता है।
- source_word: περὶ ὑμῶν
  choice: तुम्हारे विषय में
  rationale: सम्बन्धवाचक περί के विषय अथवा संदर्भ के अर्थ को औपचारिक किंतु सहज हिन्दी में व्यक्त करता है।
- source_word: λαλεῖν
  choice: कहना
  rationale: पहले क्रियार्थक प्रयोग में ‘कहना’ हिन्दी में ‘न्याय करना’ के साथ स्वाभाविक बैठता है और मौखिक कथन का अर्थ बनाए रखता है।
- source_word: κρίνειν
  choice: न्याय करना
  rationale: κρίνω के व्यापक न्याय/निर्णय के अर्थ को सुरक्षित रखता है और अनावश्यक रूप से इसे केवल ‘दोषी ठहराना’ या ‘दण्ड देना’ नहीं बनाता।
- source_word: ὁ πέμψας με
  choice: जिसने मुझे भेजा है
  rationale: यूनानी के संज्ञात्मक कृदन्त को स्वाभाविक सम्बन्धवाचक हिन्दी में व्यक्त किया गया है; संदर्भित पिता को मूल से अधिक स्पष्ट करके नहीं जोड़ा गया।
- source_word: ἀληθής
  choice: सच्चा
  rationale: यह चयन सत्य, सत्यनिष्ठ और विश्वसनीय होने की सम्भावित अर्थ-छायाओं को पूरी तरह किसी एक संकुचित अर्थ में नहीं बाँधता।
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: जो बातें मैंने उससे सुनी हैं
  rationale: सम्बन्धवाचक बहुवचन को ‘बातें’ के द्वारा स्पष्ट और स्वाभाविक रूप से व्यक्त करता है तथा सुने हुए संदेश की विषयवस्तु का भाव रखता है।
- source_word: ταῦτα
  choice: वही बातें
  rationale: पूर्ववर्ती सम्बन्धवाचक उपवाक्य को फिर से ग्रहण करने वाले स्पष्ट संकेतवाचक पद का बल हिन्दी में ‘वही बातें’ से सुरक्षित रहता है।
- source_word: λαλῶ
  choice: मैं … कहता हूँ
  rationale: वर्तमानकालीन सार्वजनिक कथन को सहज हिन्दी में व्यक्त करता है; ‘संसार से’ के साथ ‘कहता हूँ’ स्वाभाविक है।
- source_word: εἰς τὸν κόσμον
  choice: संसार से
  rationale: बोलने की क्रिया के साथ εἰς कथन की दिशा और श्रोता को सूचित करता है। हिन्दी में ‘संसार से कहना’ उसी संबोधन को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘जिसने मुझे भेजा है’ का संदर्भ
  choice: पिता का नाम जोड़े बिना मूल की अप्रत्यक्ष अभिव्यक्ति रखी गई है।
  alternative: ‘जिस पिता ने मुझे भेजा है’
  rationale: यूहन्ना के व्यापक संदर्भ में भेजने वाला पिता है, पर इस पद में यूनानी पाठ ‘पिता’ शब्द नहीं जोड़ता। इसलिए संदर्भ को स्पष्ट करने के नाम पर मूल से अधिक नहीं कहा गया।
- issue: κρίνειν का आशय
  choice: ‘न्याय करना’
  alternative: ‘दोषी ठहराना’
  rationale: क्रिया में न्याय करने, निर्णय देने और कुछ संदर्भों में दोषी ठहराने तक का अर्थ हो सकता है। यहाँ व्यापक अनिश्चितता बनाए रखने के लिए ‘न्याय करना’ चुना गया है।
- issue: ἀληθής की अर्थ-छाया
  choice: ‘सच्चा’
  alternative: ‘सत्यवादी’ अथवा ‘विश्वसनीय’
  rationale: ‘सच्चा’ यूहन्ना के धर्मवैचारिक सत्य-बोध को बनाए रखते हुए केवल कथन की सत्यवादिता या विश्वसनीयता तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और मध्यम-औपचारिक स्तर रखा गया है। ‘विषय में’, ‘न्याय करना’ और ‘संसार’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि मूल के न्यायिक स्वर और यूहन्ना-संबंधी शब्दावली को भी बनाए रखते हैं।
