source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
translation:
  language: hi
  text: तुम हमारे पिता अब्राहम से बड़े तो नहीं हो, जो मर गए? भविष्यद्वक्ता भी मर गए। तुम अपने आपको कौन बताते हो?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ σὺ
  choice: क्या तुम ... भी बड़े हो
  rationale: μή से आरम्भ प्रश्न नकारात्मक उत्तर की अपेक्षा रखता है। हिन्दी में ‘क्या तुम ... भी’ और संदर्भ का चुनौतीपूर्ण स्वर इस अलंकारिक अपेक्षा को स्वाभाविक ढंग से व्यक्त करते हैं; पादटिप्पणी इसे स्पष्ट करती है।
- source_word: μείζων
  choice: बड़े
  rationale: यह तुलनात्मक विशेषण पद, महत्त्व और श्रेष्ठता की व्यापक धारणा बनाए रखता है तथा हिन्दी में अब्राहम के संदर्भ में स्वाभाविक है।
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: हमारे पिता अब्राहम से
  rationale: तुलना के संबंध को ‘से’ व्यक्त करता है और ‘हमारे पिता अब्राहम’ पूर्वज होने के दावे तथा सम्मानसूचक भाव को सुरक्षित रखता है।
- source_word: ὅστις ἀπέθανεν
  choice: जो मर गए
  rationale: अओरिस्ट अब्राहम की ऐतिहासिक मृत्यु बताता है। सम्मान के अनुरूप हिन्दी बहुवचन क्रिया का प्रयोग किया गया है।
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: भविष्यद्वक्ता भी मर गए
  rationale: 'καί का समानांतर जोड़ ‘भी’ से स्पष्ट होता है: अब्राहम की तरह भविष्यद्वक्ताओं की भी मृत्यु हुई।'
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: तुम अपने आपको क्या ठहराते हो
  rationale: यह वाक्यांश अपने लिए कोई पद या पहचान जताने के आरोपपूर्ण अर्थ को व्यक्त करता है। ‘क्या ठहराते हो’ मूल की τίνα (‘क्या/किस’) वाली खुली अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: अब्राहम और भविष्यद्वक्ताओं की तुलना में यीशु की हैसियत को दी गई अलंकारिक चुनौती
  choice: प्रश्न को चुनौतीपूर्ण रखा गया है और पादटिप्पणी में उसके अपेक्षित नकारात्मक उत्तर को बताया गया है।
  alternative: 'इसे तटस्थ प्रश्न की तरह प्रस्तुत करना: ‘क्या तुम हमारे पिता अब्राहम से बड़े हो?’'
  rationale: यूनानी μή नकारात्मक उत्तर की अपेक्षा दर्शाता है। अनुवाद वक्ताओं के विरोधी स्वर और पहचान-संबंधी तनाव को सुरक्षित रखता है, पर आगे बढ़कर कोई धर्मवैज्ञानिक निष्कर्ष शब्दों में नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। अब्राहम के लिए सम्मानसूचक बहुवचन रखा गया है। ‘अपने आपको क्या ठहराते हो’ आरोपपूर्ण मुहावरे को व्यक्त करते हुए मूल की पहचान-संबंधी खुली चुनौती बनाए रखता है।
