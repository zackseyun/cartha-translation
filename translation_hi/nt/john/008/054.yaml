  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: hi
  text: यीशु ने उत्तर दिया, “यदि मैं अपनी महिमा करूँ, तो मेरी महिमा कुछ भी नहीं है। मेरा पिता ही मेरी महिमा करता है, जिसके बारे में तुम कहते हो कि वह हमारा परमेश्वर है।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में “हमारा परमेश्वर” के स्थान पर “तुम्हारा परमेश्वर” है।
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: संवाद में ἀποκρίνομαι का स्वाभाविक और मानक हिन्दी रूप।
- source_word: δοξάσω / δόξα / δοξάζων
  choice: महिमा करूँ / महिमा / महिमा करनेवाला
  rationale: यूहन्ना के सुसमाचार में ‘महिमा’ की प्रमुख धर्मवैचारिक प्रतिध्वनि को बनाए रखता है; केवल ‘आदर’ कहना अर्थ को हल्का कर देता।
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: मेरी महिमा कुछ भी नहीं है
  rationale: यूनानी वाक्य की सीधी तीव्रता बनाए रखते हुए आधुनिक हिन्दी में बोधगम्य है।
- source_word: ὁ πατήρ μου ὁ δοξάζων με
  choice: मेरी महिमा करनेवाला मेरा पिता है
  rationale: कर्तृवाचक वर्तमान कृदन्त की पहचानसूचक शक्ति को स्वाभाविक हिन्दी संबंधवाचक संरचना में व्यक्त करता है।
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: जिसके विषय में तुम कहते हो कि वह हमारा परमेश्वर है
  rationale: ὃν का संबंध ‘मेरे पिता’ से स्पष्ट रखता है और ἡμῶν की आधार-पाठ वाली प्रथम पुरुष बहुवचन व्याख्या को सुरक्षित रखता है।
- source_word: θεὸς
  choice: परमेश्वर
  rationale: संदर्भ में इस्राएल के एक परमेश्वर का उल्लेख है; ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय प्रयोग में गरिमापूर्ण और स्पष्ट है।
- source_word: ἡμῶν
  choice: हमारा
  rationale: SBLGNT के ἡμῶν का अनुसरण; ὑμῶν पाठांतर को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: θεὸς ἡμῶν/ὑμῶν ἐστιν में सर्वनाम का पाठांतर
  choice: वह हमारा परमेश्वर है
  alternative: वह तुम्हारा परमेश्वर है
  rationale: मुख्य पाठ SBLGNT के ἡμῶν (‘हमारा’) का अनुसरण करता है। विवाद के प्रसंग में अर्थपूर्ण ὑμῶν (‘तुम्हारा’) पाठांतर को चुपचाप हटाने के बजाय पादटिप्पणी में संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सहज रखी गई है। ‘महिमा’ शब्द को यूहन्ना की विषयगत शब्दावली बनाए रखने के लिए लगातार प्रयोग किया गया है। संबोधन में बहुवचन ‘तुम’ मूल ὑμεῖς को स्वाभाविक रूप से व्यक्त करता है।
