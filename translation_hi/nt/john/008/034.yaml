  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a servant of sin.”
translation:
  language: hi
  text: यीशु ने उन्हें उत्तर दिया, “मैं तुमसे सच-सच कहता हूँ, जो कोई पाप करता है[a], वह पाप का दास[b] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “पाप करता रहता है।” यूनानी वर्तमान कृदन्त जारी या चरित्रगत आचरण का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: अथवा, “पाप का गुलाम।” यूनानी शब्द स्वामी के अधीन दास या गुलाम को दर्शाता है; यहाँ पाप के बंधन पर बल है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: यीशु ने उन्हें उत्तर दिया
  rationale: यूनानी वाक्यक्रम को स्वाभाविक हिन्दी क्रम में रखते हुए संवाद की प्रत्युत्तरात्मकता सुरक्षित की गई है।
- source_word: Ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: दोहराव को बनाए रखते हुए यूहन्ना में यीशु की गंभीर और निश्चयात्मक उद्घोषणा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: मूल के वर्तमानकालीन औपचारिक कथन को निकट और स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: जो कोई पाप करता है
  rationale: यह हिन्दी अभिव्यक्ति सामान्य अथवा चरित्रगत आचरण का अर्थ दे सकती है और यूनानी वर्तमान कृदन्त को अनावश्यक रूप से केवल एक अकेली घटना या कठोर व्याकरणिक निरंतरता तक सीमित नहीं करती।
- source_word: δοῦλος ... τῆς ἁμαρτίας
  choice: पाप का दास
  rationale: ‘दास’ अधीनता और स्वामित्व के रूपक को बनाए रखता है; ‘पाप का’ यूनानी संबंधकारक को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: पाप करने की प्रकृति और उससे उत्पन्न बंधन
  choice: ‘जो कोई पाप करता है, वह पाप का दास है’
  alternative: ‘जो कोई पाप करता रहता है, वह पाप का गुलाम है’
  rationale: वर्तमान कृदन्त चरित्रगत या जारी आचरण का संकेत दे सकता है, पर हिन्दी का सामान्य वर्तमान काल इस अर्थ को स्वाभाविक रूप से खुला रखता है। ‘दास’ पाप के अधिकार और बंधन का प्रबल रूपक सुरक्षित रखता है, बिना इसे किसी अतिरिक्त व्यवस्थित धर्मसिद्धान्त में बदलने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सच-सच’ मूल के दोहरे Ἀμὴν को सुरक्षित रखता है, और ‘दास’ बाइबिलीय रूपक की गंभीरता तथा पाप के अधीन होने की धारणा दोनों को व्यक्त करता है।
