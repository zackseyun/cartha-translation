  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: hi
  text: यीशु ने उत्तर दिया, “मुझमें कोई दुष्टात्मा नहीं है[a], बल्कि मैं अपने पिता का आदर करता हूँ, और तुम मेरा अनादर करते हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक अर्थ-स्पष्ट रूप में, “मैं दुष्टात्मा के वश में नहीं हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: यूहन्ना के संवाद-वर्णन में यह स्वाभाविक और मानक हिन्दी अभिव्यक्ति है।
- source_word: δαιμόνιον
  choice: दुष्टात्मा
  rationale: यह यूनानी संज्ञा का सीधा और आधुनिक हिन्दी में व्यापक रूप से समझा जाने वाला समतुल्य है।
- source_word: οὐκ ἔχω
  choice: मुझमें कोई ... नहीं है
  rationale: ‘दुष्टात्मा होना’ वाले यूनानी मुहावरे को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है और मुख्य पाठ में ‘वश में होना’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
- source_word: τιμῶ
  choice: आदर करता हूँ
  rationale: यह τιμάω का स्पष्ट समतुल्य है और आगे आने वाले ἀτιμάζω के साथ शब्दार्थगत विरोध बनाए रखता है।
- source_word: τὸν πατέρα μου
  choice: अपने पिता का
  rationale: हिन्दी में कर्ता ‘मैं’ की ओर लौटते संबंध के लिए ‘अपने’ स्वाभाविक है और यूनानी ‘मेरे पिता’ का अर्थ सुरक्षित रखता है। देवनागरी में बड़े अक्षर न होने के कारण दिव्य संबोधन का संकेत प्रसंग से मिलता है।
- source_word: ἀτιμάζετέ
  choice: अनादर करते हो
  rationale: यह ‘आदर करता हूँ’ के साथ मूल पाठ का सीधा विरोध सुरक्षित रखता है; ‘अपमान करते हो’ की तुलना में इसका अर्थ अधिक व्यापक है।
- source_word: με
  choice: मेरा
  rationale: ‘मेरा अनादर करना’ हिन्दी में प्रत्यक्ष कर्म με को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἐγὼ
  choice: मैं
  rationale: स्पष्ट सर्वनाम मूल यूनानी के बल को यथासंभव बनाए रखता है।
theological_decisions:
- issue: ‘मेरे पिता’ का संदर्भ
  choice: ‘अपने पिता’ के रूप में रखा गया है, जहाँ प्रसंग में यीशु परमेश्वर को अपना पिता कहते हैं।
  alternative: सामान्य पारिवारिक अर्थ में ‘अपने पिता’
  rationale: यूहन्ना के निकटवर्ती प्रसंग में ‘पिता’ परमेश्वर के लिए यीशु का विशिष्ट संबोधन है; अनुवाद कोई अतिरिक्त उपाधि जोड़े बिना यही शब्दावली रखता है।
- issue: ‘दुष्टात्मा होना’ का अर्थ
  choice: मुख्य पाठ में अपेक्षाकृत सीधी अभिव्यक्ति ‘मुझमें कोई दुष्टात्मा नहीं है’ रखी गई है।
  alternative: ‘मैं दुष्टात्मा के वश में नहीं हूँ’
  rationale: वैकल्पिक रूप संभावित आशय स्पष्ट करता है, पर यूनानी ἔχω के सीधे रूप से अधिक व्याख्यात्मक है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आदर/अनादर’ की जोड़ी मूल के शब्दार्थगत विरोध को सुरक्षित रखती है; ‘बल्कि ... और’ यूनानी ἀλλά ... καί की संरचना को स्वाभाविक हिन्दी में व्यक्त करती है।
