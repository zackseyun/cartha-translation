  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: hi
  text: तब यीशु उन यहूदियों से, जिन्होंने उसकी बात पर विश्वास किया था[a], कह रहा था, “यदि तुम मेरे वचन में बने रहो, तो तुम सचमुच मेरे चेले हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन यहूदियों से जिन्होंने उस पर विश्वास किया था।” यूनानी में यहाँ ‘उस पर’ या ‘उसमें’ के लिए कोई पूर्वसर्ग नहीं है; क्रिया के साथ ‘उसे’ के अर्थ वाला संप्रदान रूप है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν
  choice: कह रहा था
  rationale: अपूर्ण भूतकाल की जारी वाचिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: पिछले प्रसंग से कथन के संबंध या निष्कर्ष को दिखाता है; यहाँ इसका तार्किक बल बहुत कठोर नहीं माना गया है।
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: उन यहूदियों से, जिन्होंने उसकी बात पर विश्वास किया था
  rationale: पूर्णकालिक कृदन्त पहले किए गए और वर्तमान से संबद्ध विश्वास को दर्शाता है। αὐτῷ केवल संप्रदान कारक में है, इसलिए हिन्दी में 'उसकी बात पर विश्वास' मूल के 'उस पर विश्वास' और 'उसमें विश्वास' के संभावित भेद को अनावश्यक रूप से मसीही विश्वास की पूर्ण पारिभाषिक अभिव्यक्ति में नहीं बदलता।
- source_word: Ἐὰν
  choice: यदि
  rationale: संभाव्य क्रिया के साथ शर्त को स्पष्ट और मानक हिन्दी में व्यक्त करता है।
- source_word: ὑμεῖς
  choice: तुम
  rationale: स्पष्ट सर्वनाम को रखा गया है; हिन्दी में यही पर्याप्त रूप से संबोधन और हल्का बल व्यक्त करता है।
- source_word: μείνητε
  choice: बने रहो
  rationale: यूहन्ना में μένω की निरंतरता और स्थायित्व की धारणा को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: मेरे वचन में
  rationale: λόγος के संदेश या शिक्षा संबंधी अर्थ के साथ यूहन्नाई शब्दावली और व्यापक अर्थ-प्रतिध्वनि को सुरक्षित रखता है।
- source_word: ἀληθῶς
  choice: सचमुच
  rationale: शिष्यत्व की वास्तविकता या प्रामाणिकता पर दिए गए बल को सहज हिन्दी में व्यक्त करता है।
- source_word: μαθηταί μού ἐστε
  choice: मेरे चेले हो
  rationale: '''चेला'' सुसमाचार के प्रसंग में μαθητής का व्यापक रूप से समझा जाने वाला, स्वाभाविक हिन्दी रूप है।'
theological_decisions:
- issue: πιστεύω के साथ संप्रदान αὐτῷ का अनुवाद
  choice: जिन्होंने उसकी बात पर विश्वास किया था
  alternative: जिन्होंने उस पर विश्वास किया था / जिन्होंने उसमें विश्वास किया था
  rationale: यूनानी में εἰς नहीं, बल्कि संप्रदान αὐτῷ है। मुख्य पाठ का रूप किसी कथन या व्यक्ति को विश्वसनीय मानने की सीधी धारणा को बनाए रखता है और पूर्ण धर्मवैज्ञानिक अर्थ को स्वतः आरोपित नहीं करता। अधिक शाब्दिक और पारंपरिक संभावनाएँ पादटिप्पणी में दी गई हैं।
- issue: शिष्यत्व की शर्त और वास्तविकता
  choice: यदि तुम मेरे वचन में बने रहो, तो सचमुच मेरे चेले हो
  alternative: यदि तुम मेरी शिक्षा पर चलते रहो, तो तुम वास्तव में मेरे शिष्य हो
  rationale: '''वचन में बने रहना'' मूल की स्थानवाचक और यूहन्नाई अभिव्यक्ति को सुरक्षित रखता है; इसे केवल आज्ञापालन या केवल मानसिक सहमति में सीमित नहीं किया गया।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। 'वचन' यूहन्नाई शब्दावली बचाता है, जबकि 'बने रहो' और 'चेले' भाषा को स्वाभाविक रखते हैं।
