  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: hi
  text: यीशु ने उनसे कहा, “मैं तुमसे सच-सच कहता हूँ, अब्राहम के अस्तित्व में आने से पहले[a], मैं हूँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “अब्राहम के जन्म लेने से पहले।” यूनानी क्रिया का अर्थ अधिक व्यापक है: “अस्तित्व में आना” या “हो जाना।”'
    reason: lexical_alternative
  - marker: b
    text: या, “मैं रहा हूँ।” यूनानी में शाब्दिक रूप से “मैं हूँ” है; मुख्य पाठ वर्तमानकाल के रूप और उसकी संभावित धर्मवैज्ञानिक प्रतिध्वनि को सुरक्षित रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: यीशु ने उनसे कहा
  rationale: यूनानी कथन-भूमिका का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: Ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: दोहराव और कथन की गंभीर, प्रामाणिक पुष्टि को सहज आधुनिक हिन्दी में बनाए रखता है। ‘आमीन, आमीन’ अधिक पारंपरिक है, पर सामान्य पाठक के लिए अर्थ कम प्रत्यक्ष हो सकता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: यूहन्ना में बार-बार आने वाले गंभीर प्रत्यक्ष-संबोधन सूत्र का निकट और स्वाभाविक रूप।
- source_word: πρὶν
  choice: से पहले
  rationale: इनफिनिटिव वाक्यांश के साथ प्रयुक्त कालवाचक संयोजक का मानक हिन्दी समतुल्य।
- source_word: Ἀβραὰμ
  choice: अब्राहम
  rationale: इस व्यक्तिगत नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: γενέσθαι
  choice: अस्तित्व में आने
  rationale: γίνομαι के व्यापक अर्थ को सुरक्षित रखता है और इसे केवल शारीरिक जन्म तक सीमित नहीं करता; साथ ही ἐγὼ εἰμί के साथ निहित क्रियात्मक विरोध को दिखाता है।
- source_word: ἐγὼ εἰμί
  choice: मैं हूँ
  rationale: यूनानी वर्तमानकाल और असामान्य रूप से निरपेक्ष अभिव्यक्ति का सबसे सीधा रूप; यह कथन की संभावित धर्मवैज्ञानिक प्रतिध्वनि को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: मसीह-विज्ञान की दृष्टि से महत्त्वपूर्ण संदर्भ में ἐγὼ εἰμί का अनुवाद
  choice: मैं हूँ
  alternative: मैं रहा हूँ; मेरा अस्तित्व था
  rationale: यूनानी पाठ वर्तमानकाल में है और यहाँ अभिव्यक्ति निरपेक्ष तथा प्रभावशाली है। ‘मैं हूँ’ व्याकरणिक रूप, पूर्व-अस्तित्व के दावे और संभावित दिव्य आत्म-पहचान की प्रतिध्वनि—तीनों को खुला रखता है; अधिक सहज विकल्प तनाव को केवल अतीत के अस्तित्व तक सीमित कर सकते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘सच-सच’ जोरदार दोहराव को सहज हिन्दी में व्यक्त करता है। ‘अस्तित्व में आने’ कुछ औपचारिक है, पर γενέσθαι की व्यापकता और ‘मैं हूँ’ के साथ उसके जानबूझकर बने विरोध को सुरक्षित रखने के लिए उपयुक्त है।
