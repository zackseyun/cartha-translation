id: JHN.8.52
reference: John 8:52
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: hi
  text: यहूदियों ने उससे कहा, “अब हम जान गए कि तुझमें दुष्टात्मा है।[a] अब्राहम मर गया और भविष्यद्वक्ता भी, फिर भी तू कहता है, ‘यदि कोई मेरे वचन का पालन करे, तो वह कभी भी मृत्यु का स्वाद नहीं चखेगा।’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “तेरे पास एक दुष्टात्मा है”; अथवा, “तू दुष्टात्मा से ग्रस्त है।”'
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में यह अत्यन्त प्रबल नकारात्मक कथन है: “वह मृत्यु का स्वाद कभी नहीं चखेगा।”'
    reason: lexical_clarification
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदियों
  rationale: मूल पाठ का सीधा और प्रचलित रूप; ‘यहूदी अगुवे’ कहना संदर्भगत व्याख्या जोड़ देता।
- source_word: Νῦν ἐγνώκαμεν
  choice: अब हम जान गए
  rationale: पूर्णकाल से उत्पन्न वर्तमान दृढ़ निष्कर्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δαιμόνιον ἔχεις
  choice: तुझमें दुष्टात्मा है
  rationale: यूनानी ‘तेरे पास/तुझमें दुष्टात्मा है’ का स्वाभाविक हिन्दी रूप; ‘दुष्टात्मा से ग्रस्त’ वैकल्पिक व्याख्यात्मक अभिव्यक्ति है।
- source_word: οἱ προφῆται
  choice: भविष्यद्वक्ता भी
  rationale: καί द्वारा अब्राहम के साथ जोड़ी गई समान बात को ‘भी’ स्पष्ट और स्वाभाविक ढंग से दर्शाता है।
- source_word: καὶ σὺ λέγεις
  choice: फिर भी तू कहता है
  rationale: संदर्भ में संयोजक का विरोधसूचक बल प्रकट करता है।
- source_word: τὸν λόγον μου τηρήσῃ
  choice: मेरे वचन का पालन करे
  rationale: λόγος के लिए ‘वचन’ यूहन्ना की शब्दावली बनाए रखता है; τηρέω यहाँ वचन को मानने और उसके अनुसार चलने का भाव रखता है।
- source_word: οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα
  choice: कभी भी मृत्यु का स्वाद नहीं चखेगा
  rationale: οὐ μή की प्रबल नकारात्मकता और εἰς τὸν αἰῶνα की कालगत व्यापकता को ‘कभी भी ... नहीं’ स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘मृत्यु का स्वाद चखना’ रूपक सुरक्षित रहता है।
theological_decisions:
- issue: यीशु की मृत्यु-विषयक प्रतिज्ञा का आशय
  choice: ‘मृत्यु का स्वाद नहीं चखेगा’ रूपक को बिना व्याख्यात्मक समाधान के बनाए रखा
  alternative: इसे शारीरिक मृत्यु, आत्मिक मृत्यु अथवा अंतिम/अनन्त मृत्यु के रूप में स्पष्ट करना
  rationale: विरोधी इसे शारीरिक मृत्यु के स्तर पर समझते हैं, जबकि यूहन्ना में कथन का अर्थ अधिक गहरा हो सकता है; अनुवाद इस तनाव और बहुअर्थकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में सुबोध हिन्दी। प्रत्यक्ष संबोधन में ‘तू/तुझमें’ मूल के एकवचन और विरोधपूर्ण लहजे को दर्शाता है। ‘वचन’ और ‘मृत्यु का स्वाद चखना’ जैसे यूहन्नाई पदबंध सुरक्षित रखे गए हैं।
