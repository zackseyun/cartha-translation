id: JHN.18.11
reference: John 18:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: hi
  text: तब यीशु ने पतरस से कहा, “तलवार म्यान में रखो[a]। जो प्याला[b] पिता ने मुझे दिया है, क्या मैं उसे न पीऊँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘म्यान’ अर्थात तलवार रखने का खोल।
    reason: lexical_alternative
  - marker: b
    text: बाइबल में ‘प्याला’ परमेश्वर द्वारा ठहराए गए दुःख या भाग्य का रूपक हो सकता है; गतसमनी में यीशु की प्रार्थना से तुलना करें (मत्ती 26:39; मरकुस 14:36; लूका 22:42)।
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यह कथानक की अगली घटना और उससे निकलने वाली प्रतिक्रिया को जोड़ता है। आधुनिक हिन्दी में ‘तब’ स्वाभाविक है और संयोजक बल को बनाए रखता है।
- source_word: Βάλε
  choice: रखो
  rationale: इस प्रसंग में βάλλω का आदेशात्मक रूप किसी वस्तु को उसके स्थान में रखने का अर्थ देता है; ‘रखो’ सहज और सटीक है।
- source_word: μάχαιραν
  choice: तलवार
  rationale: μάχαιρα धारदार हथियार को दर्शाता है। इस गिरफ्तारी-प्रसंग में ‘तलवार’ मानक और स्पष्ट अनुवाद है; ‘कटार’ अनावश्यक रूप से अधिक विशिष्ट होगा।
- source_word: θήκην
  choice: म्यान
  rationale: हथियार की धार को रखने वाले आवरण के लिए ‘म्यान’ आधुनिक हिन्दी का स्वाभाविक और सटीक शब्द है।
- source_word: ποτήριον
  choice: प्याला
  rationale: यूनानी रूपक को सुरक्षित रखा गया है; इसे मुख्य पाठ में ‘दुःख’, ‘मृत्यु’ या ‘क्रूस’ कहकर संकुचित नहीं किया गया।
- source_word: δέδωκέν
  choice: दिया है
  rationale: पूर्ण काल बीते हुए कार्य के वर्तमान प्रभाव को व्यक्त करता है; ‘दिया है’ इस भाव को सुरक्षित रखता है।
- source_word: ὁ πατήρ
  choice: पिता
  rationale: यूनानी में संबंधवाचक सर्वनाम ‘मेरे’ नहीं है। ‘पिता’ यूहन्ना की अभिव्यक्ति को बिना कुछ जोड़े बनाए रखता है।
- source_word: οὐ μὴ πίω αὐτό;
  choice: क्या मैं उसे न पीऊँ?
  rationale: नकारात्मक आलंकारिक प्रश्न प्रसंग में सकारात्मक उत्तर की अपेक्षा करता है—यीशु उस प्याले को अवश्य पिएगा। हिन्दी रूप इसी आलंकारिक बल को बनाए रखता है।
theological_decisions:
- issue: ‘प्याला’ का अर्थ
  choice: ‘प्याला’ रूपक को मुख्य पाठ में बनाए रखना
  alternative: इसे ‘ठहराया हुआ दुःख’, ‘नियति’, ‘मृत्यु’ या ‘परमेश्वर के क्रोध का प्याला’ कहकर स्पष्ट करना
  rationale: प्रसंग परमेश्वर द्वारा ठहराए गए दुःख और मार्ग की ओर संकेत करता है, पर पद स्वयं इसका अधिक संकीर्ण doctrinal अर्थ निर्धारित नहीं करता। रूपक बनाए रखने से पाठ की व्यापकता और धर्मवैज्ञानिक तनाव सुरक्षित रहता है।
- issue: पिता के प्रति यीशु की आज्ञाकारिता
  choice: ‘पिता ने मुझे दिया है’ का सीधा अनुवाद
  alternative: ‘मेरे पिता ने मेरे लिए ठहराया है’ जैसी व्याख्यात्मक अभिव्यक्ति
  rationale: मूल पाठ पुत्र की स्वेच्छापूर्ण आज्ञाकारिता दिखाता है। सीधा अनुवाद न तो यीशु की गरिमा घटाता है, न मूल से बाहर की व्याख्या जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आदेश संक्षिप्त है, और आलंकारिक प्रश्न की दृढ़ता मूल के अनुरूप बनी रहती है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान विषय से मेल नहीं खाता था; हिन्दी मुख्य पाठ में [a] को ‘म्यान’ और [b] को ‘प्याला’ के साथ सही स्थान पर लगाया गया है।
