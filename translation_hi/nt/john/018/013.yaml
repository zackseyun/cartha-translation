source:
  edition: SBLGNT
  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: hi
  text: और वे उसे पहले हन्ना के पास ले गए, क्योंकि हन्ना कैफा का ससुर था, और कैफा उस वर्ष महायाजक था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: ले गए
  rationale: ἄγω यहाँ हिरासत में एक स्थान से दूसरे स्थान तक ले जाने को व्यक्त करता है। हिंदी में “ले गए” स्वाभाविक है और संदर्भ से निहित कर्म “उसे” को स्पष्ट करता है।
- source_word: πρὸς Ἅνναν
  choice: हन्ना के पास
  rationale: πρός के साथ कर्मकारक किसी व्यक्ति की ओर गमन दर्शाता है; “हन्ना के पास” आधुनिक हिंदी में स्वाभाविक और सटीक है।
- source_word: πρῶτον
  choice: पहले
  rationale: यह क्रियाविशेषण घटनाक्रम का क्रम बताता है कि आरंभिक गंतव्य हन्ना था।
- source_word: πενθερὸς
  choice: ससुर
  rationale: πενθερός विशेष रूप से पत्नी के पिता को दर्शाता है; “ससुर” इसका सटीक और सामान्य हिंदी पर्याय है।
- source_word: ἀρχιερεὺς
  choice: महायाजक
  rationale: यह यहूदी प्रधान याजकीय पद के लिए प्रचलित और सटीक हिंदी शब्द है।
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: उस वर्ष
  rationale: यह यूहन्ना के समय-सूचक वाक्यांश को सहज हिंदी में बनाए रखता है।
- source_word: Ἅνναν
  choice: हन्ना
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: Καϊάφα
  choice: कैफा
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण अपनाया गया है।
theological_decisions:
- issue: “जो उस वर्ष महायाजक था” का संदर्भ
  choice: कैफा को स्पष्ट कर्ता बनाकर “कैफा उस वर्ष महायाजक था”
  alternative: “जो उस वर्ष महायाजक था” जैसे संबंधवाचक उपवाक्य का प्रयोग
  rationale: यूनानी में ὃς का निकटतम और स्वाभाविक पूर्वपद Καϊάφα है। हिंदी संबंधवाचक रचना अनचाही अस्पष्टता पैदा कर सकती थी, इसलिए अर्थ बदले बिना कैफा का नाम दोहराया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लंबे यूनानी वाक्य का संबंध बनाए रखते हुए नामों की पुनरावृत्ति से संदर्भ स्पष्ट किया गया है; कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई।
