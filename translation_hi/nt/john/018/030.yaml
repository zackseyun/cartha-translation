  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: hi
  text: उन्होंने उसे उत्तर दिया, “यदि यह आदमी बुराई करनेवाला न होता, तो हम इसे आपके हवाले न करते।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: उन्होंने उसे उत्तर दिया
  rationale: यूनानी की दोहरी कथन-रीति का स्वाभाविक हिन्दी रूप ‘उत्तर दिया’ है; ‘उत्तर देकर कहा’ अनावश्यक रूप से भारी होता। ‘उसे’ प्रसंग में पिलातुस को सूचित करता है।
- source_word: Εἰ μὴ ἦν
  choice: यदि ... न होता
  rationale: यह भूतकालीन तथ्य-विपरीत शर्त को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὗτος
  choice: यह आदमी
  rationale: यह रूप संकेतवाचक दूरी बनाए रखता है, पर यूनानी से अधिक तिरस्कार नहीं जोड़ता।
- source_word: κακὸν ποιῶν
  choice: बुरा काम करनेवाला
  rationale: यह ποιῶν की क्रियात्मक शक्ति और κακόν के नैतिक आरोप—दोनों को बनाए रखता है; ‘अपराधी’ कहने से पाठ से अधिक विधिक विशिष्टता जुड़ती।
- source_word: οὐκ ἄν ... παρεδώκαμεν
  choice: तो हम ... हवाले न करते
  rationale: यह तथ्य-विपरीत परिणाम को व्यक्त करता है और न्यायिक प्रसंग में παραδίδωμι का स्वाभाविक हिन्दी अर्थ देता है।
- source_word: σοι ... αὐτόν
  choice: इसे आपके हवाले
  rationale: ‘आपके’ पिलातुस के प्रति एकवचन सम्मानसूचक संबोधन है; ‘इसे’ यीशु के लिए आरोपियों की संकेतवाचक दूरी बनाए रखता है।
theological_decisions:
- issue: यीशु के विरुद्ध आरोप की प्रकृति
  choice: ‘बुरा काम करनेवाला’ के रूप में व्यापक नैतिक आरोप
  alternative: ‘अपराधी’ या ‘कुकर्मी’
  rationale: κακὸν ποιῶν कोई निश्चित कानूनी अपराध नहीं बताता। क्रियात्मक और सामान्य अभिव्यक्ति आरोप की अस्पष्टता तथा आरोपियों की टालमटोल को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। कथन-सूत्र को हिन्दी में स्वाभाविक बनाया गया है, जबकि शर्त, आरोप की अस्पष्टता और न्यायिक ‘हवाले करना’ सुरक्षित हैं।
