source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Εἶπον ὑμῖν ὅτι ἐγώ εἰμι· εἰ οὖν ἐμὲ ζητεῖτε, ἄφετε τούτους ὑπάγειν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: hi
  text: यीशु ने उत्तर दिया, “मैं तुमसे कह चुका हूँ कि मैं वही हूँ।[a] इसलिए यदि तुम मुझे ढूँढ़ रहे हो, तो इन लोगों को जाने दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या केवल, “मैं हूँ।” यूनानी में “वही” जैसा कोई शब्द नहीं है; पहचान स्पष्ट करने के लिए इसे जोड़ा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: संवाद में ἀποκρίνομαι का स्वाभाविक और गरिमापूर्ण हिन्दी रूप; इससे प्रसंग की कथात्मक शैली बनी रहती है।
- source_word: Εἶπον ὑμῖν
  choice: मैं तुमसे कह चुका हूँ
  rationale: पूर्व कथन की याद दिलाने वाला भाव व्यक्त करता है; हिन्दी का पूर्ण पक्ष इस संदर्भ में यूनानी एओरिस्ट का स्वाभाविक संप्रेषण करता है।
- source_word: ἐγώ εἰμι
  choice: मैं ही हूँ
  rationale: गिरफ्तारी के प्रसंग में यह खोजे जा रहे व्यक्ति के रूप में यीशु की पहचान बताता है। ‘ही’ पहचान पर बल को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि विधेयविहीन यूनानी अभिव्यक्ति की सम्भावित गूँज पादटिप्पणी में सुरक्षित है।
- source_word: ζητεῖτε
  choice: ढूँढ़ रहे हो
  rationale: वर्तमान स्थिति में जारी खोज को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἄφετε
  choice: जाने दो
  rationale: यहाँ क्रिया अनुमति देने का अर्थ रखती है; ‘छोड़ दो’ हिरासत या परित्याग का अनावश्यक अर्थ ला सकता था।
- source_word: τούτους
  choice: इन लोगों
  rationale: संकेतवाचक सर्वनाम का संदर्भ यीशु के साथियों से है; यह रूप लिंग को अनावश्यक रूप से विशेष किए बिना स्पष्ट और स्वाभाविक है।
- source_word: ὑπάγειν
  choice: जाने
  rationale: अनुमति-सूचक रचना में संक्षिप्त और स्वाभाविक हिन्दी; ‘चले जाने’ की अपेक्षा कम व्याख्यात्मक है।
theological_decisions:
- issue: यूहन्ना के प्रसंग में ἐγώ εἰμι का अनुवाद
  choice: मैं ही हूँ
  alternative: मैं हूँ
  rationale: तात्कालिक प्रसंग में यीशु अपनी पहचान खोजे जा रहे व्यक्ति के रूप में करा रहे हैं, इसलिए ‘मैं ही हूँ’ हिन्दी में स्पष्ट और स्वाभाविक है। फिर भी यूनानी में कोई स्पष्ट विधेय नहीं है और यूहन्ना में इस अभिव्यक्ति की सम्भावित धर्मवैचारिक गूँज हो सकती है; अतः ‘मैं हूँ’ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संवादात्मक किंतु गरिमापूर्ण। ‘तुम’ बहुवचन श्रोताओं के लिए प्रसंगानुकूल है। वाक्यरचना सरल रखी गई है और ἐγώ εἰμι की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
