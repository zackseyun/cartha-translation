  text: τί με ⸂ἐρωτᾷς; ἐρώτησον⸃ τοὺς ἀκηκοότας τί ἐλάλησα αὐτοῖς· ἴδε οὗτοι οἴδασιν ἃ εἶπον ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/021.yaml
  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: hi
  text: तुम मुझसे पूछताछ क्यों करते हो? जिन्होंने सुना है, उनसे पूछो कि मैंने उनसे क्या कहा था। देखो, ये लोग जानते हैं कि मैंने क्या कहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: तुम मुझसे पूछताछ क्यों करते हो?
  rationale: ἐρωτάω का मूल अर्थ ‘पूछना’ है, पर महायाजक के सामने औपचारिक जाँच के प्रसंग में ‘पूछताछ करना’ न्यायिक स्वर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐρώτησον
  choice: पूछो
  rationale: आज्ञार्थक रूप सीधी कार्रवाई की माँग करता है। हिन्दी में ‘उनसे पूछताछ करो’ अपेक्षाकृत कठोर और अस्वाभाविक होता; ‘पूछो’ अर्थ को स्पष्ट रखते हुए पहले वाक्य के न्यायिक संदर्भ से जुड़ा रहता है।
- source_word: τοὺς ἀκηκοότας
  choice: जिन्होंने सुना है
  rationale: पूर्णकालिक कृदंत उन लोगों को दर्शाता है जो सुन चुके हैं और अब साक्ष्य दे सकते हैं; ‘सुना है’ इस परिणामी पक्ष को सुरक्षित रखता है।
- source_word: τί ἐλάλησα αὐτοῖς
  choice: मैंने उनसे क्या कहा था
  rationale: λαλέω के लिए ‘कहा’ सहज आधुनिक हिन्दी है। ‘था’ पूर्ववर्ती कथन को वर्तमान पूछताछ से पहले घटित दिखाता है, बिना अतिरिक्त अर्थ जोड़े।
- source_word: ἴδε
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। ‘देखो’ आधुनिक, स्पष्ट और ‘निहारो’ जैसे पुराने रूप से अधिक स्वाभाविक है।
- source_word: οὗτοι οἴδασιν
  choice: ये लोग जानते हैं
  rationale: ‘ये’ οὗτοι की संकेतवाचक और बलात्मक शक्ति बनाए रखता है; ‘लोग’ हिन्दी में स्वतंत्र ‘ये’ की संभावित अस्पष्टता दूर करता है और लिंग अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: ἃ εἶπον ἐγώ
  choice: कि मैंने क्या कहा था
  rationale: यह हिन्दी में स्वाभाविक विषयवाचक उपवाक्य है। स्पष्ट ἐγώ का बल ‘मैंने’ से पर्याप्त रूप से व्यक्त होता है; ‘मैंने स्वयं’ यहाँ अनावश्यक रूप से भारी होता।
theological_decisions:
- issue: महायाजक के सामने यीशु के उत्तर का न्यायिक स्वर
  choice: पहली बार ἐρωτάω को ‘पूछताछ करना’ और आज्ञार्थक प्रयोग को स्वाभाविक हिन्दी ‘पूछो’ कहना।
  alternative: दोनों स्थानों पर केवल ‘पूछना’ अथवा दोनों पर ‘पूछताछ करना’।
  rationale: प्रसंग की औपचारिक जाँच पहली अभिव्यक्ति में स्पष्ट हो जाती है, जबकि दूसरी में ‘जिन्होंने सुना है, उनसे पूछो’ अधिक स्वाभाविक है। इससे मूल क्रिया की पुनरावृत्ति का संबंध बना रहता है, पर हिन्दी कृत्रिम नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में ‘तुम’ मूल के एकवचन दूसरे पुरुष और उत्तर की सीधाई को व्यक्त करता है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है।
