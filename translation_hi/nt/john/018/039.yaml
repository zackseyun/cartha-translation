reference: John 18:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔστιν δὲ συνήθεια ὑμῖν ἵνα ἕνα ⸂ἀπολύσω ὑμῖν⸃ ἐν τῷ πάσχα· βούλεσθε οὖν ⸄ἀπολύσω ὑμῖν⸅ τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: hi
  text: पर तुम्हारी यह प्रथा है कि मैं फसह के अवसर पर तुम्हारे लिए एक व्यक्ति को रिहा करूँ। इसलिए क्या तुम चाहते हो कि मैं तुम्हारे लिए यहूदियों के राजा[a] को रिहा कर दूँ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया-निवासियों के राजा।” यूनानी शब्द प्रसंग के अनुसार यहूदियों या यहूदिया-निवासियों को सूचित कर सकता है; यहाँ यह दुःखभोग-वृत्तांत में प्रयुक्त एक स्थापित उपाधि के रूप में आता है।
    reason: वैकल्पिक भाषिक अर्थ को सुरक्षित रखना
lexical_decisions:
- source_word: συνήθεια
  choice: प्रथा
  rationale: यहाँ यह किसी व्यक्ति की आदत नहीं, बल्कि पर्व और न्यायिक प्रसंग में स्थापित सामुदायिक रीति को दर्शाता है; इसलिए ‘प्रथा’ स्वाभाविक और सटीक है।
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: कि मैं तुम्हारे लिए एक व्यक्ति को रिहा करूँ
  rationale: ἕνα का व्यक्तिगत संदर्भ हिन्दी में ‘एक व्यक्ति’ से स्पष्ट होता है, और ἀπολύσω का ‘रिहा करूँ’ बंदी को कानूनी रूप से मुक्त करने के प्रसंग के अनुरूप है।
- source_word: ἀπολύω
  choice: रिहा करना
  rationale: राज्यपाल द्वारा किसी बंदी को छोड़ने के न्यायिक संदर्भ में ‘रिहा करना’ सटीक है और दोनों प्रयोगों में एकरूपता रखता है।
- source_word: ἐν τῷ πάσχα
  choice: फसह के अवसर पर
  rationale: यह पदबंध पर्व के समय को सूचित करता है; ‘के अवसर पर’ आधुनिक हिन्दी में प्रथा के समय-संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: βούλεσθε οὖν
  choice: इसलिए क्या तुम चाहते हो
  rationale: ‘इसलिए’ οὖν के निष्कर्षात्मक संबंध को बनाए रखता है, और ‘क्या तुम चाहते हो’ βούλεσθε का सहज आधुनिक हिन्दी रूप है।
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: यहूदियों के राजा
  rationale: यह यूहन्ना के दुःखभोग-वृत्तांत में यीशु के लिए प्रयुक्त स्थापित राजकीय आरोप/उपाधि है। हिन्दी में पदवी का अर्थ शब्दों से स्पष्ट है; अनावश्यक अंग्रेज़ी-प्रभाव वाली अक्षरगत विशिष्टता की आवश्यकता नहीं है।
theological_decisions:
- issue: τῶν Ἰουδαίων का अर्थ और दायरा
  choice: यहूदियों के
  alternative: यहूदिया-निवासियों के
  rationale: इस दुःखभोग-वृत्तांत में पूरा वाक्यांश यीशु से जुड़ी स्थापित राजकीय-मसीही उपाधि/आरोप के रूप में आता है, इसलिए ‘यहूदियों के राजा’ मुख्य पाठ में अधिक उपयुक्त है। फिर भी Ἰουδαῖοι कुछ प्रसंगों में क्षेत्रीय अर्थ ‘यहूदिया-निवासी’ भी दे सकता है; इस वास्तविक भाषिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘तुम्हारी/तुम्हारे’ बहुवचन श्रोताओं को स्वाभाविक हिन्दी में संबोधित करता है। ‘फसह’ प्रचलित बाइबलीय पर्व-नाम है और ‘रिहा करना’ न्यायिक प्रसंग के अनुकूल है।
