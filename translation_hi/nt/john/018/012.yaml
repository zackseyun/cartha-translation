  text: Ἡ οὖν σπεῖρα καὶ ὁ χιλίαρχος καὶ οἱ ὑπηρέται τῶν Ἰουδαίων συνέλαβον τὸν Ἰησοῦν καὶ ἔδησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/john/018/012.yaml
  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: hi
  text: तब सैनिक दल, सेनानायक और यहूदियों[a] के अधिकारियों ने यीशु को पकड़ लिया और बाँध दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संदर्भ के अनुसार यहाँ ‘यहूदियों’ का आशय ‘यहूदी अगुवों’ या ‘यहूदिया के लोगों’ से भी हो सकता है। यूहन्ना प्रायः इस शब्द का प्रयोग समस्त यहूदी लोगों की अपेक्षा अधिक सीमित अर्थ में करता है।
    reason: वैकल्पिक अर्थ और संदर्भगत स्पष्टीकरण
lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यह शब्द पिछले घटनाक्रम से कथा को आगे बढ़ाता है। आधुनिक हिन्दी में ‘तब’ इस कथात्मक संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: σπεῖρα
  choice: सैनिक-दस्ता
  rationale: यूनानी शब्द सामान्यतः सैन्य दल या कोहोर्ट को दर्शाता है। ‘सैनिक-दस्ता’ साधारण पाठक के लिए स्पष्ट है और मूल में स्पष्ट रूप से न दिए गए ‘रोमी’ विशेषण को नहीं जोड़ता।
- source_word: χιλίαρχος
  choice: सेनानायक
  rationale: यह सैनिक-दस्ते के उच्च अधिकारी को सूचित करता है। ‘सेनानायक’ ऐतिहासिक पदनाम को अत्यधिक तकनीकी बनाए बिना सैन्य नेतृत्व स्पष्ट करता है।
- source_word: ὑπηρέται
  choice: अधिकारी
  rationale: यूहन्ना के इस प्रसंग में यह घरेलू सेवकों के बजाय आधिकारिक रूप से कार्य करने वाले गिरफ्तारी-कर्मियों को दर्शाता है। ‘अधिकारी’ उनकी संस्थागत भूमिका व्यक्त करता है, पर ‘मन्दिर के पहरेदार’ जैसी अतिरिक्त विशिष्टता नहीं जोड़ता।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों के
  rationale: यह मूल सम्बन्धवाचक पदबंध का सीधा अनुवाद है। यूहन्ना में इसका आशय कभी-कभी विशेष रूप से यहूदी अगुवों या यहूदिया के लोगों से हो सकता है; उस प्रश्न को मुख्य पाठ में निर्णायक रूप से सीमित नहीं किया गया है।
- source_word: συνέλαβον
  choice: पकड़ लिया
  rationale: यह क्रिया बलपूर्वक पकड़ने या हिरासत में लेने का अर्थ देती है। ‘पकड़ लिया’ शारीरिक कार्रवाई को बनाए रखता है और मूल से अधिक कानूनी प्रक्रिया नहीं जोड़ता।
- source_word: ἔδησαν
  choice: बाँध दिया
  rationale: यह बाँधने की पूर्ण कार्रवाई का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: यूहन्ना में τῶν Ἰουδαίων का आशय
  choice: मुख्य पाठ में ‘यहूदियों के’ रखा गया है।
  alternative: ‘यहूदी अगुवों के’ या ‘यहूदिया के लोगों के’
  rationale: मूल पदबंध व्यापक रूप में है, जबकि यूहन्ना के प्रसंग में उसका संदर्भ कभी अधिक सीमित हो सकता है। मुख्य पाठ वास्तविक अस्पष्टता बनाए रखता है और पाद-टिप्पणी पाठकों को इसे पूरे यहूदी समुदाय पर लागू करने से सावधान करती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण कथात्मक हिन्दी है। ‘सैनिक-दस्ता’ तकनीकी ‘कोहोर्ट’ की अपेक्षा अधिक सुलभ है, और वाक्य में मूल के संयुक्त कर्ताओं तथा क्रमिक कार्रवाइयों को बनाए रखा गया है।
