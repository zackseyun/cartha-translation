source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: hi
  text: परन्तु पतरस दरवाज़े के बाहर खड़ा था। इसलिए वह दूसरा शिष्य, जिसे महायाजक जानता था[a], बाहर गया, द्वार पर पहरा देनेवाली स्त्री[b] से बात की और पतरस को भीतर ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो महायाजक का परिचित था।” यूनानी पाठ से यह स्पष्ट नहीं होता कि उनका संबंध कितना निकट था।
    reason: lexical_alternative
  - marker: b
    text: या, “द्वारपाल स्त्री” या “फाटक की रखवाली करनेवाली स्त्री।” यूनानी शब्द प्रवेश-द्वार पर तैनात स्त्री को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκει
  choice: खड़ा था
  rationale: यह रूप पतरस की उस समय जारी स्थिति को व्यक्त करता है; ‘खड़ा था’ आधुनिक हिन्दी में स्वाभाविक रूप से इस निरंतर अवस्था को दर्शाता है।
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: बाहर द्वार के पास
  rationale: यह अनुवाद प्रवेश-स्थान के निकट होने और बाहर होने—दोनों बातों को स्पष्ट रखता है। θύρα का मूल अर्थ ‘द्वार’ है।
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: वह दूसरा शिष्य
  rationale: ‘शिष्य’ सुसमाचार के संबंधपरक और धार्मिक संदर्भ में μαθητής का स्थापित तथा उपयुक्त हिन्दी रूप है।
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: जिसे महायाजक जानता था
  rationale: यह γνωστός की अनिश्चितता बनाए रखता है और संबंध की निकटता को निर्धारित नहीं करता; यूनानी पाठ केवल इतना स्पष्ट करता है कि वह महायाजक के लिए जाना-पहचाना था।
- source_word: ἀρχιερεύς
  choice: महायाजक
  rationale: यह यहूदी प्रधान याजकीय पद के लिए मानक और संदर्भानुकूल हिन्दी पद है।
- source_word: θυρωρῷ
  choice: द्वारपालिन
  rationale: शब्द प्रवेश-द्वार पर तैनात व्यक्ति को दर्शाता है और यूनानी में स्त्रीलिंग रूप है; ‘द्वारपालिन’ भूमिका और लिंग दोनों को संक्षेप में व्यक्त करता है।
- source_word: εἶπεν τῇ θυρωρῷ
  choice: द्वारपालिन से बात करके
  rationale: क्योंकि कही गई बात उद्धृत नहीं है, ‘से बात करके’ हिन्दी में स्वाभाविक है और अगले कार्य से इसका संबंध भी स्पष्ट करता है।
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: पतरस को भीतर ले आया
  rationale: εἰσάγω के ‘भीतर लाना/ले जाना’ अर्थ को यह वाक्यांश कथात्मक हिन्दी में सहज रूप से व्यक्त करता है।
