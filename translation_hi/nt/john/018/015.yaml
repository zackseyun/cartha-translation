- source_word: μαθητής
  choice: शिष्य
  rationale: यूहन्ना के संदर्भ में यीशु के सीखने वाले अनुयायी के लिए मानक और सटीक हिन्दी शब्द।
- source_word: ἐκεῖνος
  choice: वह
  rationale: यह संकेतवाचक शब्द पहले उल्लिखित दूसरे शिष्य की ओर लौटता है; ‘वह शिष्य’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: γνωστὸς
