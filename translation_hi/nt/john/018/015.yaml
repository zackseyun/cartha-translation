- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: महायाजक
  rationale: इस संदर्भ में एकवचन ἀρχιερεύς का प्रचलित हिन्दी अनुवाद दोनों स्थानों पर बनाए रखा गया है।
- source_word: συνεισῆλθεν
  choice: के साथ ... प्रवेश कर गया
  rationale: संयुक्त क्रिया में भीतर जाने और यीशु के साथ जाने, दोनों का भाव है; चुना हुआ रूप इन दोनों तत्वों को स्पष्ट रखता है।
- source_word: αὐλήν
  choice: आँगन
  rationale: यह महायाजक के निवास के घेरे हुए खुले प्रांगण को दर्शाता है; ‘आँगन’ सामान्य आधुनिक पाठक के लिए सहज है और ‘महल’ जैसी अनावश्यक सूचना नहीं जोड़ता।
