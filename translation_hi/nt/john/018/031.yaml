source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: hi
  text: इसलिए पिलातुस ने उनसे[a] कहा, “तुम ही उसे ले लो और अपनी व्यवस्था के अनुसार उसका न्याय करो।” यहूदियों ने उससे कहा, “हमें किसी को मृत्युदंड देने की अनुमति नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में इस समूह को “यहूदी” कहा गया है। इस प्रसंग में यह पिलातुस के सामने उपस्थित यहूदी अधिकारियों या यीशु पर अभियोग लगाने वालों को सूचित करता है, समस्त यहूदी लोगों को नहीं।
    reason: मूल अभिव्यक्ति को बनाए रखते हुए उसके संदर्भगत आशय को स्पष्ट करना और सामूहिक यहूदी-विरोधी अर्थ ग्रहण किए जाने से बचाना।
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह शब्द पिछले संवाद से निष्कर्षात्मक और कथात्मक संबंध जोड़ता है; ‘इसलिए’ आधुनिक हिन्दी में इस प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: तुम ही इसे ले जाओ
  rationale: स्पष्ट सर्वनाम ὑμεῖς का बल ‘तुम ही’ से सुरक्षित रहता है; ‘ले जाओ’ इस प्रसंग में हिन्दी का स्वाभाविक आदेश है।
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: अपनी व्यवस्था के अनुसार
  rationale: κατά यहाँ मानदंड के अनुसार होने का भाव देता है। ‘व्यवस्था’ νόμος के धार्मिक-कानूनी विस्तार को बनाए रखती है।
- source_word: κρίνατε αὐτόν
  choice: इसका न्याय करो
  rationale: κρίνω का व्यापक न्यायिक अर्थ रखा गया है; ‘मुकदमा चलाओ’ कहने से औपचारिक प्रक्रिया अनावश्यक रूप से अधिक विशिष्ट हो जाती।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदियों
  rationale: यूनानी पद का औपचारिक रूप सुरक्षित रखा गया है, जबकि संदर्भगत सीमित अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: Ἡμῖν οὐκ ἔξεστιν
  choice: हमें ... अधिकार नहीं है
  rationale: ἔξεστιν यहाँ कानूनी अनुमति या अधिकार को दर्शाता है; हिन्दी में यह वाक्यांश न्यायिक संदर्भ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀποκτεῖναι οὐδένα
  choice: किसी को मृत्युदंड देने
  rationale: न्यायिक प्रसंग में ἀποκτείνω का आशय किसी को विधिक रूप से मृत्यु देना है; ‘मृत्युदंड देना’ इसे ‘मार डालना’ की अपेक्षा अधिक ठीक व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना में οἱ Ἰουδαῖοι का संदर्भ
  choice: मुख्य पाठ में ‘यहूदियों’ और पादटिप्पणी में संदर्भगत स्पष्टीकरण
  alternative: ‘यहूदी अगुवों’ या ‘यहूदिया के लोगों’
  rationale: मूल पद की व्यापकता और यूहन्ना की विशिष्ट शब्दावली को मुख्य पाठ में रखा गया है, पर तत्काल प्रसंग में बोलने वाले पिलातुस के सामने उपस्थित यहूदी अधिकारी या अभियोग लगाने वाले हैं; समस्त यहूदी लोगों पर कथन लागू करना अनुचित होगा।
- issue: ἔξεστιν का कानूनी आशय
  choice: ‘अधिकार नहीं है’
  alternative: ‘अनुमति नहीं है’ या ‘उचित नहीं है’
  rationale: पिलातुस के साथ न्यायिक संवाद में यह वाक्य राजनीतिक-कानूनी अधिकार की कमी को व्यक्त करता है; फिर भी यह अनुवाद इस ऐतिहासिक प्रश्न को आगे बढ़कर नहीं सुलझाता कि प्रतिबंध का सटीक प्रशासनिक स्वरूप क्या था।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘तुम ही’ से यूनानी के बलयुक्त सर्वनाम को व्यक्त किया गया है। ‘व्यवस्था’ बाइबलीय νόμος के लिए परिचित पद है, और ‘मृत्युदंड देने का अधिकार’ न्यायिक प्रसंग को सामान्य पाठक के लिए स्पष्ट रखता है।
