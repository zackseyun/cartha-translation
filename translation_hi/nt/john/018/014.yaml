  text: ἦν δὲ Καϊάφας ὁ συμβουλεύσας τοῖς Ἰουδαίοις ὅτι συμφέρει ἕνα ἄνθρωπον ⸀ἀποθανεῖν ὑπὲρ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: hi
  text: कैफा वह था जिसने यहूदियों[a] को सलाह दी थी कि लोगों के लिए[b] एक मनुष्य का मरना हितकर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदी नेताओं” या “यहूदिया के निवासियों”; अर्थ इस पर निर्भर करता है कि इस प्रसंग में यूहन्ना के शब्द “यहूदियों” को कैसे समझा जाए।
    reason: alternative_reading
  - marker: b
    text: या “लोगों की ओर से”; प्रसंग में इस वाक्यांश में प्रतिनिधिक या बलिदानी भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: ही वह व्यक्ति था
  rationale: δέ हल्का कथात्मक संबंध सूचित करता है और हिंदी में अलग संयोजक आवश्यक नहीं है। बलसूचक ‘ही’ यूनानी के संकेतक ढाँचे ὁ συμβουλεύσας को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Καϊάφας
  choice: कैफा
  rationale: नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: ὁ συμβουλεύσας
  choice: वह व्यक्ति था जिसने ... सलाह दी थी
  rationale: संज्ञीकृत एओरिस्ट कृदंत कैफा की पहचान उसके पहले दिए गए परामर्श से कराता है; ‘दी थी’ मुख्य कथन से पूर्व की क्रिया स्पष्ट करता है।
- source_word: τοῖς Ἰουδαίοις
  choice: यहूदियों
  rationale: मूल में कोई स्पष्ट सीमित करने वाला पद नहीं है; इसलिए मुख्य पाठ व्यापक औपचारिक अर्थ बनाए रखता है, जबकि संदर्भगत विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ὅτι συμφέρει
  choice: कि ... अच्छा है
  rationale: συμφέρει लाभकारी या हितकर होने का भाव देता है। ‘अच्छा है’ आधुनिक और स्वाभाविक हिंदी है तथा कैफा के उपयोगितावादी परामर्श को व्यक्त करता है।
- source_word: ἕνα ἄνθρωπον
  choice: एक मनुष्य
  rationale: संख्या और पुरुषवाचक एकवचन दोनों सुरक्षित रहते हैं तथा संकेत यीशु की ओर बना रहता है।
- source_word: ἀποθανεῖν
  choice: मरना
  rationale: इनफिनिटिव का सीधा और स्वाभाविक हिंदी रूप।
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: लोगों के लिए
  rationale: ὑπέρ का हितार्थक अथवा प्रतिनिधिक भाव संक्षेप में सुरक्षित रहता है; अधिक स्पष्ट प्रायश्चित्त-संबंधी अर्थ मुख्य पाठ पर आरोपित नहीं किया गया।
- source_word: λαοῦ
  choice: लोगों
  rationale: यहाँ मूल शब्द λαός है, ἔθνος नहीं; अतः ‘लोगों’ अधिक सटीक है, ‘राष्ट्र’ नहीं।
theological_decisions:
- issue: ὑπὲρ τοῦ λαοῦ में प्रतिनिधिक अथवा बलिदानी भाव
  choice: लोगों के लिए
  alternative: लोगों की ओर से; लोगों के स्थान पर
  rationale: यह पद लाभ, प्रतिनिधित्व और प्रसंग में संभव बलिदानी संकेत को समेट सकता है। मुख्य पाठ अस्पष्टता बनाए रखता है और अधिक स्पष्ट प्रतिस्थापनवादी अर्थ नहीं जोड़ता।
- issue: यूहन्ना में τοῖς Ἰουδαίοις का संदर्भ
  choice: यहूदियों
  alternative: यहूदी अगुओं; यहूदिया के लोगों
  rationale: यूनानी पाठ में कोई स्पष्ट सीमांकन नहीं है। औपचारिक अर्थ मुख्य पाठ में रखा गया है और संभावित संदर्भगत अर्थ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और कथात्मक शैली। मूल की वास्तविक संदर्भगत तथा धर्मवैज्ञानिक अस्पष्टता पादटिप्पणियों सहित बनाए रखी गई है।
