source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: hi
  text: तब पिलातुस ने उससे कहा, “तो फिर क्या तुम राजा हो?” यीशु ने उत्तर दिया, “तुम कहते हो कि मैं राजा हूँ।[a] मैं इसीलिए जन्मा हूँ और इसीलिए संसार में आया हूँ कि सत्य की गवाही दूँ। हर वह व्यक्ति जो सत्य से है, मेरी आवाज़ सुनता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “तुम कहते हो—मैं राजा हूँ,” या “तुम ठीक कहते हो कि मैं राजा हूँ।” यूनानी वाक्य संक्षिप्त है और इसे एक सीमित स्वीकृति के रूप में समझा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκοῦν
  choice: तो क्या
  rationale: यह पिलातुस द्वारा पिछली बात से निकाले गए निष्कर्ष को प्रश्न के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βασιλεὺς
  choice: राजा
  rationale: रोमी पूछताछ के राजनीतिक संदर्भ और मसीही संकेत—दोनों को सुरक्षित रखने वाला सीधा और मानक अर्थ।
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: तुम कहते हो कि मैं राजा हूँ
  rationale: यूनानी वाक्य की संक्षिप्तता और संभावित सशर्त या सीमित स्वीकृति को बिना अत्यधिक व्याख्या के बनाए रखता है।
- source_word: γεγέννημαι
  choice: मैं ... जन्मा हूँ
  rationale: पूर्णकाल की वर्तमान प्रासंगिकता को हिन्दी में स्वाभाविक ढंग से रखता है; ‘उत्पन्न हुआ’ यहाँ अनावश्यक धर्मवैज्ञानिक अर्थ जोड़ सकता है।
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: संसार में आया हूँ
  rationale: आगमन और मिशन की यूहन्नाई भाषा को बनाए रखते हुए पूर्णकाल का भाव व्यक्त करता है।
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: सत्य की गवाही दूँ
  rationale: उद्देश्यसूचक ἵνα-वाक्य और न्यायिक-साक्ष्य संबंधी भाषा को सहज हिन्दी में सुरक्षित रखता है।
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: हर वह व्यक्ति जो सत्य से है
  rationale: ἐκ के स्रोत/सम्बन्ध के अर्थ को जानबूझकर निकटता से रखता है और ‘सत्य का पक्षधर’ जैसी व्याख्यात्मक स्पष्टता नहीं जोड़ता।
- source_word: ἀκούει μου τῆς φωνῆς
  choice: मेरी आवाज़ सुनता है
  rationale: मूल क्रिया और ‘आवाज़’ की यूहन्नाई प्रतिध्वनि को सीधे रखता है; प्रसंग में सुनना ग्रहणशील प्रतिक्रिया भी सूचित कर सकता है।
theological_decisions:
- issue: पिलातुस को यीशु के उत्तर की सूक्ष्मता
  choice: मुख्य पाठ में ‘तुम कहते हो कि मैं राजा हूँ’
  alternative: ‘तुम ठीक कहते हो—मैं राजा हूँ’ अथवा ‘यह तुम कहते हो’
  rationale: यूनानी वाक्य एक सीमित या योग्य स्वीकृति के रूप में सुना जा सकता है, पर वह न तो स्पष्ट प्रबल समर्थन जोड़ता है, न स्पष्ट दूरी। मुख्य पाठ अस्पष्टता बचाता है और पादटिप्पणी सम्भावनाएँ बताती है।
- issue: जन्म लेने और संसार में आने के दोहरे कथन का अर्थ
  choice: दोनों उपवाक्यों को अलग-अलग बनाए रखना
  alternative: दोनों को मिलाकर केवल मिशन का एक कथन बना देना
  rationale: मूल पाठ जन्म और संसार में आगमन को अलग रखता है; इससे सम्भावित देहधारण-संबंधी संकेत सुरक्षित रहता है, पर अनकही धर्मवैज्ञानिक व्याख्या नहीं जोड़ी जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘सत्य से है’ सामान्य बोलचाल से कुछ अधिक शाब्दिक है, पर यह मूल के ἐκ-सम्बन्ध और यूहन्नाई धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
