reference: John 18:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει οὖν ⸂τῷ Πέτρῳ ἡ παιδίσκη ἡ θυρωρός⸃· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν εἶ τοῦ ἀνθρώπου τούτου; λέγει ἐκεῖνος· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: hi
  text: तब द्वार की रखवाली करने वाली सेविका ने पतरस से कहा[a], “तुम भी इस आदमी के चेलों में से तो नहीं हो?” उसने कहा, “मैं नहीं हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दासी लड़की जो द्वार की रखवाली करती थी।”
    reason: पαιδίσκη के ‘दासी/युवा स्त्री सेवक’ अर्थ और θυρωρός की भूमिका के वैकल्पिक, अधिक शाब्दिक निरूपण को सुरक्षित रखता है।
lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यह कथानक को आगे बढ़ाने वाला संयोजक है; आधुनिक हिन्दी में ‘तब’ प्रसंग की प्रगति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: παιδίσκη
  choice: सेविका
  rationale: यह युवा स्त्री सेवक अथवा दासी को सूचित कर सकता है। ‘सेविका’ सहज हिन्दी है और मुख्य पाठ में उसके कार्य को प्रमुख रखता है, जबकि दासत्व की सम्भावना को टिप्पणी में सुरक्षित किया जा सकता है।
- source_word: θυρωρός
  choice: द्वार पर तैनात
  rationale: शब्द का अर्थ प्रवेश-द्वार की देखरेख करने वाला व्यक्ति है। यह प्रयोग उसकी भूमिका को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Μὴ καὶ σὺ
  choice: तुम भी ... तो नहीं हो?
  rationale: μή से आरम्भ प्रश्न सामान्यतः नकारात्मक उत्तर की अपेक्षा करता है; ‘तो नहीं’ हिन्दी में उसी संकेत को बिना अतिरंजना के व्यक्त करता है।
- source_word: ἐκ τῶν μαθητῶν
  choice: चेलों में से
  rationale: समूह की सदस्यता बताने वाले ἐκ के अंशवाचक अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τοῦ ἀνθρώπου τούτου
  choice: इस आदमी के
  rationale: यहाँ ἄνθρωπος सामान्य अर्थ में है, कोई उपाधि नहीं। ‘इस आदमी’ मूल की कुछ दूरी बनाए रखने वाली अभिव्यक्ति को सुरक्षित रखता है।
- source_word: ἐκεῖνος
  choice: उसने
  rationale: सन्दर्भ में संकेतवाचक सर्वनाम पतरस को सूचित करता है; हिन्दी में ‘उसने’ स्वाभाविक है।
- source_word: Οὐκ εἰμί
  choice: मैं नहीं हूँ
  rationale: मूल के संक्षिप्त और सीधे इनकार को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: μή से आरम्भ नकारात्मक प्रश्न का बल
  choice: “तुम भी ... तो नहीं हो?”—नकारात्मक उत्तर की अपेक्षा का संकेत
  alternative: बिना अपेक्षित उत्तर का संकेत दिए सपाट प्रश्न, अथवा “निश्चय ही तुम भी ... नहीं हो?”
  rationale: यह व्याकरणिक और संवादगत सूक्ष्मता पतरस के इनकार की परिस्थिति को प्रभावित करती है। चुना हुआ रूप मूल की अपेक्षा को स्वाभाविक हिन्दी में व्यक्त करता है, पर वक्ता के स्वर को अनावश्यक रूप से तीखा नहीं बनाता।
- issue: παιδίσκη की सामाजिक स्थिति
  choice: मुख्य पाठ में “सेविका”
  alternative: “दासी” अथवा “दासी लड़की”
  rationale: यह शब्द स्त्री सेवक या दासी को सूचित कर सकता है। प्रसंग में उसका द्वार-संबंधी कार्य प्रमुख है; इसलिए मुख्य पाठ में सहज ‘सेविका’ रखा गया है, जबकि दासत्व का सम्भव अर्थ टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में सहज मानक हिन्दी। प्रश्न में ‘तो नहीं’ के द्वारा अपेक्षित नकारात्मक उत्तर का संकेत रखा गया है। पद संक्षिप्त है; मुख्य पाठ को अनावश्यक टिप्पणी-चिह्न से नहीं बोझिल किया गया।
