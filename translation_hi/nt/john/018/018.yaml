base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The servants and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: hi
  text: दास[a] और अधिकारी[b] वहाँ खड़े थे। उन्होंने कोयले की आग जला रखी थी, क्योंकि ठंड थी, और वे अपने को ताप रहे थे। पतरस भी उनके साथ खड़ा था और अपने को ताप रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नौकर”; यूनानी शब्द घरेलू सेवक या दास, दोनों अर्थों में प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “पहरेदार”; यहाँ आशय सम्भवतः मन्दिर या महायाजक की व्यवस्था से जुड़े आधिकारिक सहायकों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: दास
  rationale: यह शब्द घरेलू सेवकों की बंधुआ सामाजिक स्थिति को व्यक्त कर सकता है; ‘दास’ उस संभावना को ‘नौकर’ की अपेक्षा अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ὑπηρέται
  choice: पहरेदार
  rationale: यूहन्ना में यह शब्द प्रायः महायाजकीय या मन्दिर-व्यवस्था से जुड़े आधिकारिक सहायकों के लिए आता है; इस प्रसंग में ‘पहरेदार’ उनकी प्रवर्तन-संबंधी भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि ‘अधिकारी’ भी सम्भव है।
- source_word: ἀνθρακιὰν πεποιηκότες
  choice: कोयले की आग जला रखी थी
  rationale: ἀνθρακιὰν को ठोस रूप से ‘कोयले की आग’ कहा गया है। ‘जला रखी थी’ पूर्ण हो चुके कार्य और उसके बने हुए परिणाम को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: ὅτι ψῦχος ἦν
  choice: क्योंकि ठंड थी
  rationale: ὅτι यहाँ आग जलाने और तापने का कारण बताता है; सीधा कारणवाचक संबंध बनाए रखा गया है।
- source_word: ἐθερμαίνοντο
  choice: वे अपने को ताप रहे थे
  rationale: अपूर्ण काल की जारी क्रिया और मध्यवाच्य के आत्म-संबंधी भाव, दोनों को सुरक्षित रखा गया है।
- source_word: ἦν δὲ καὶ ὁ Πέτρος μετ’ αὐτῶν ἑστὼς
  choice: पतरस भी उनके साथ खड़ा
  rationale: καί के योगात्मक बल को ‘भी’ से, μετ’ αὐτῶν को ‘उनके साथ’ से और खड़े होने की अवस्था को ‘खड़ा’ से व्यक्त किया गया है। हिन्दी में अगले कृदन्त के साथ संयुक्त वाक्य अधिक स्वाभाविक है।
- source_word: θερμαινόμενος
  choice: अपने को ताप रहा था
  rationale: पतरस की जारी क्रिया को पहले समूह की क्रिया के समान शब्दावली में रखा गया है, जिससे मूल की समानांतरता बनी रहती है।
