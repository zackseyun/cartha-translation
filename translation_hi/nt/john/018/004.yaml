base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: hi
  text: इसलिए यीशु, यह जानते हुए कि उन पर क्या-क्या आने वाला था[a], बाहर निकले और उनसे कहा, “तुम किसे ढूँढ़ रहे हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ उन पर आने वाला था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले घटनाक्रम से कथात्मक और तार्किक संबंध दिखाता है; ‘इसलिए’ यूनानी संयोजक की निष्कर्षात्मक छाया को बनाए रखता है।
- source_word: εἰδὼς
  choice: यह जानते हुए
  rationale: कृदंत यीशु की पहले से और पूर्ण जानकारी व्यक्त करता है; यह हिंदी में स्वाभाविक रहते हुए उस अर्थ को सुरक्षित रखता है।
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: उन पर क्या-क्या आने वाला था
  rationale: यह πάντα की समग्रता और ἐπ’ αὐτόν की ‘उन पर’ वाली दिशा को बनाए रखते हुए आसन्न घटनाओं को किसी अतिरिक्त व्याख्या के बिना व्यक्त करता है।
- source_word: ἐξῆλθεν
  choice: बाहर निकले
  rationale: यह ἐξέρχομαι का सीधा और संदर्भानुकूल अनुवाद है तथा अनावश्यक नाटकीयता नहीं जोड़ता।
- source_word: λέγει
  choice: कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिंदी कथन-शैली में भूतकाल से व्यक्त किया गया है।
- source_word: Τίνα ζητεῖτε
  choice: तुम किसे ढूँढ़ रहे हो?
  rationale: ‘किसे’ कर्मकारक को स्पष्ट करता है और ‘ढूँढ़ रहे हो’ वर्तमानकालीन खोज को सहज आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: आगामी घटनाओं के विषय में यीशु का पूर्वज्ञान
  choice: पद के अनुसार यीशु उन पर आने वाली सभी बातों को पहले से जानते थे।
  alternative: इसे स्पष्ट रूप से ‘सर्वज्ञता’ जैसे व्यवस्थित धर्मवैज्ञानिक शब्द से विस्तार देना।
  rationale: मूल पाठ यीशु की पूर्ण पूर्व-जागरूकता पर बल देता है, पर इस पद में उससे आगे कोई व्यवस्थित धर्मवैज्ञानिक परिभाषा नहीं देता; अनुवाद उसी सीमा और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। आदरसूचक बहुवचन क्रियाएँ यीशु के लिए प्रयुक्त हैं, जबकि प्रत्यक्ष संबोधन में मूल के बहुवचन को ‘तुम’ से व्यक्त किया गया है।
