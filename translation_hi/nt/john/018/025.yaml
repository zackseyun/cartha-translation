id: JHN.18.25
reference: John 18:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἦν δὲ Σίμων Πέτρος ἑστὼς καὶ θερμαινόμενος. εἶπον οὖν αὐτῷ· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν αὐτοῦ εἶ; ⸀ἠρνήσατο ἐκεῖνος καὶ εἶπεν· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: hi
  text: शमौन पतरस खड़ा था और अपने को सेंक रहा था। इस पर उन्होंने उससे कहा, “क्या तुम भी उसके चेलों में से नहीं हो?[a]” उसने इनकार किया और कहा, “मैं नहीं हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम भी उसके चेलों में से तो नहीं हो?” यूनानी में μή से आरंभ प्रश्न नकारात्मक उत्तर की अपेक्षा रखता है।
    reason: प्रश्न में निहित नकारात्मक अपेक्षा और उसके एक स्वाभाविक हिंदी विकल्प को स्पष्ट करना।
lexical_decisions:
- source_word: Ἦν δὲ
  choice: शमौन पतरस खड़ा था
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है। हिंदी में अलग आरंभिक संयोजक जोड़ना आवश्यक नहीं; वाक्य का क्रम कथा को स्वाभाविक रूप से आगे बढ़ाता है।
- source_word: ἑστὼς
  choice: खड़ा था
  rationale: ἵστημι का पूर्णकालिक कृदंत पतरस की बनी हुई मुद्रा बताता है; ‘खड़ा था’ इसका सहज और सीधा हिंदी रूप है।
- source_word: θερμαινόμενος
  choice: अपने को सेंक रहा था
  rationale: मध्यवाच्य भाव अपने शरीर को गर्म करने की क्रिया व्यक्त करता है। इस पद में आग का स्पष्ट उल्लेख नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: εἶπον οὖν αὐτῷ
  choice: इस पर उन्होंने उससे कहा
  rationale: οὖν पिछले प्रसंग से कथात्मक परिणाम या संबंध दिखाता है। ‘इस पर’ हिंदी में उस संबंध को सहजता से व्यक्त करता है, जबकि εἶπον के लिए ‘कहा’ रखा गया है।
- source_word: Μὴ καὶ σὺ ... εἶ;
  choice: क्या तुम भी ... नहीं हो?
  rationale: μή वाला प्रश्न नकारात्मक उत्तर की अपेक्षा रखता है। ‘क्या ... नहीं हो?’ उस झुकाव को बनाए रखता है और καὶ σὺ का भाव ‘तुम भी’ से आता है।
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: उसके चेलों में से
  rationale: ἐκ और संबंधकारक किसी समूह की सदस्यता बताते हैं। ‘चेलों में से’ इसका स्वाभाविक हिंदी रूप है।
- source_word: ἠρνήσατο ἐκεῖνος
  choice: उसने इनकार किया
  rationale: क्रिया पूछी गई बात को न मानने का अर्थ देती है। हिंदी में ‘इनकार किया’ पर्याप्त है; कोई व्यापक धार्मिक कथन नहीं जोड़ा गया।
- source_word: Οὐκ εἰμί
  choice: मैं नहीं हूँ
  rationale: मूल कथन संक्षिप्त और संदर्भ पर निर्भर है। ‘मैं नहीं हूँ’ उसी संक्षिप्तता और प्रतिध्वनि को बनाए रखता है।
theological_decisions:
- issue: पतरस के इनकार का दायरा
  choice: इसे यीशु के चेलों में से एक होने का सीधा इनकार रखा गया है।
  alternative: ‘मैं उनमें से नहीं हूँ’ कहकर प्रश्न के छूटे हुए अंश को स्पष्ट करना।
  rationale: यूनानी उत्तर अत्यंत संक्षिप्त और अध्याहृत है। ‘मैं नहीं हूँ’ कथात्मक तथा धर्मवैचारिक तनाव को बिना विस्तार दिए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘चेला’ सामान्य पाठक के लिए सहज और यूहन्ना के संदर्भ में μαθητής का स्थापित अर्थ देता है। मूल में न कही गई ‘आग’ जैसी जानकारी नहीं जोड़ी गई, और अंतिम उत्तर की जानबूझकर रखी गई संक्षिप्तता सुरक्षित है।
