base_translation:
  language: en
  yaml_path: translation/nt/john/018/006.yaml
  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: hi
  text: इसलिए जब उसने उनसे कहा, “मैं वही हूँ,”[a] तो वे पीछे हटे और भूमि पर गिर पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “मैं हूँ।” यूनानी अभिव्यक्ति यूहन्ना के सुसमाचार में पाए जाने वाले विशिष्ट ‘मैं हूँ’ कथनों की ओर भी संकेत कर सकती है।
    reason: वैकल्पिक शाब्दिक अनुवाद और संभावित धर्मवैचारिक अनुनाद को सुरक्षित रखना।
lexical_decisions:
- source_word: ὡς οὖν
  choice: इसलिए जब
  rationale: ὡς के कालसूचक अर्थ और οὖν के कथात्मक निष्कर्ष-संबंध—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἶπεν αὐτοῖς
  choice: उसने उनसे कहा
  rationale: λέγω और अप्रत्यक्ष कर्म αὐτοῖς का सीधा तथा स्वाभाविक अनुवाद।
- source_word: Ἐγώ εἰμι
  choice: मैं वही हूँ
  rationale: गिरफ्तारी के प्रसंग में यह खोजे जा रहे व्यक्ति के रूप में यीशु की आत्म-पहचान स्पष्ट करता है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: वे पीछे हटे
  rationale: पीछे की ओर गति को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔπεσαν χαμαί
  choice: भूमि पर गिर पड़े
  rationale: χαμαί के भूमि पर गिरने के ठोस भौतिक अर्थ को स्पष्ट करता है; ‘गिर पड़े’ घटना की आकस्मिकता भी व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना के सुसमाचार में Ἐγώ εἰμι का आत्म-पहचान और संभावित गहरा धर्मवैचारिक अनुनाद
  choice: मुख्य पाठ में “मैं वही हूँ”
  alternative: अधिक शाब्दिक रूप “मैं हूँ”
  rationale: तात्कालिक संवाद में वाक्यांश आत्म-पहचान का काम करता है, इसलिए मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है। फिर भी यूहन्ना में इसके विशिष्ट ‘मैं हूँ’ कथनों से संभव अनुनाद को पादटिप्पणी में सुरक्षित रखा गया है, ताकि अर्थगत तनाव समाप्त न हो।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। ‘भूमि’ औपचारिक गरिमा बनाए रखता है, जबकि वाक्य-संरचना स्वाभाविक रखी गई है।
