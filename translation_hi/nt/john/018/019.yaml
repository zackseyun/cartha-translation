  yaml_path: translation/nt/john/018/019.yaml
  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: hi
  text: इसलिए महायाजक ने यीशु से उनके चेलों और उनकी शिक्षा के बारे में पूछताछ की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यीशु से पूछा।’ यूनानी क्रिया का अनुवाद ‘पूछा’ या ‘पूछताछ की’ दोनों हो सकता है; यहाँ औपचारिक सुनवाई के प्रसंग को दिखाने के लिए ‘पूछताछ की’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले घटनाक्रम से जुड़े कथात्मक परिणाम या निरंतरता को व्यक्त करता है। यहाँ ‘इसलिए’ यूनानी संयोजक का संबंध स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: ἀρχιερεὺς
  choice: महायाजक
  rationale: यह यहूदी महायाजकीय पद का मानक हिन्दी रूप है। संदर्भ में व्यक्ति हन्ना है, फिर भी मूल पाठ के निश्चित पदनाम को किसी निजी नाम से नहीं बदला गया।
- source_word: ἠρώτησεν
  choice: पूछताछ की
  rationale: क्रिया का अर्थ ‘पूछा’ या ‘पूछताछ की’ हो सकता है। औपचारिक सुनवाई के प्रसंग में ‘पूछताछ की’ न्यायिक रंग को दर्शाता है, पर ‘पूछताछ/जिरह’ के अधिक कठोर अर्थ को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: περὶ
  choice: के बारे में
  rationale: दोनों बार संबंधवाचक प्रयोग पूछताछ के विषय को सूचित करता है; ‘के बारे में’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: μαθητῶν
  choice: चेलों
  rationale: ‘चेला’ सुसमाचारों में गुरु-शिष्य संबंध को व्यक्त करने वाला प्रचलित और सहज शब्द है।
- source_word: διδαχῆς
  choice: शिक्षा
  rationale: यह यीशु द्वारा दी जाने वाली शिक्षा को सहज ढंग से व्यक्त करता है; ‘सिद्धांत’ यहाँ अनावश्यक रूप से तकनीकी या बाद की धर्मवैज्ञानिक धारणा ला सकता है।
- source_word: αὐτοῦ
  choice: उनके / उनकी
  rationale: दोनों सर्वनाम यीशु की ओर संकेत करते हैं। सम्मानसूचक हिन्दी में ‘उनके चेलों’ और ‘उनकी शिक्षा’ स्वाभाविक हैं।
theological_decisions:
- issue: उस प्रसंग में ἀρχιερεύς पदनाम का अनुवाद जहाँ कथानक हन्ना से संबंधित है, न कि रोमी मान्यता प्राप्त कार्यरत महायाजक कैफा से
  choice: यूनानी पदनाम का सीधा अनुवाद ‘महायाजक’
  alternative: ‘महायाजक हन्ना’ या ‘प्रधान याजक’
  rationale: मुख्य पाठ ऐतिहासिक विवरण का सामंजस्य बैठाने के लिए नाम नहीं जोड़ता, बल्कि लेखक की कथात्मक प्रस्तुति और मूल यूनानी शब्दावली को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण है। ‘पूछताछ की’ औपचारिक प्रसंग को दर्शाता है, और पादटिप्पणी मूल क्रिया की व्यापक अर्थ-संभावना सुरक्षित रखती है।
