id: JHN.18.2
reference: John 18:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ᾔδει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν τὸν τόπον, ὅτι πολλάκις ⸀συνήχθη Ἰησοῦς ἐκεῖ μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: hi
  text: यीशु को पकड़वाने वाला यहूदा[a] भी उस स्थान को जानता था, क्योंकि यीशु वहाँ अपने चेलों के साथ अक्सर इकट्ठा होते थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु को सौंपने वाला यहूदा।”
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि यीशु वहाँ अपने चेलों से अक्सर मिलते थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: जानता था
  rationale: οἶδα यहाँ उस स्थान की जानकारी और परिचय को व्यक्त करता है; ‘जानता था’ स्वाभाविक और सटीक हिन्दी है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया गया
  rationale: δέ यहाँ कथा को हल्के ढंग से आगे बढ़ाता है। हिन्दी में प्रसंग स्वयं यह संबंध स्पष्ट करता है; ‘अब’ जोड़ने से अनावश्यक काल-संकेत उत्पन्न हो सकता है।
- source_word: καὶ
  choice: भी
  rationale: यहूदा के विषय में अतिरिक्त जानकारी जोड़ने वाला बल स्पष्ट रूप से बना रहता है।
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: यीशु को पकड़वाने वाला
  rationale: संदर्भ में παραδίδωμι यहूदा द्वारा यीशु को विरोधियों के हाथ सौंपने की विश्वासघाती कार्रवाई दर्शाता है। ‘पकड़वाने वाला’ हिन्दी में स्वाभाविक है और वर्तमान कृदन्त की पहचानकारी भूमिका बनाए रखता है। अस्पष्ट सर्वनाम से बचने के लिए ‘यीशु’ दोहराया गया है।
- source_word: τὸν τόπον
  choice: उस स्थान को
  rationale: τόπος का सीधा अर्थ ‘स्थान’ है; पूर्ववर्ती प्रसंग में बताए गए बगीचे की ओर संकेत होने के कारण ‘उस स्थान’ स्वाभाविक है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι उस कारण का परिचय देता है जिसके कारण यहूदा स्थान को जानता था।
- source_word: πολλάκις
  choice: अक्सर
  rationale: πολλάκις बार-बार होने वाली घटना बताता है; ‘अक्सर’ संक्षिप्त और सहज है।
- source_word: συνήχθη
  choice: इकट्ठा होते थे
  rationale: συνάγω का कर्मवाच्य रूप यहाँ अकर्मक अर्थ में साथ एकत्र होने या मिलने को व्यक्त कर सकता है। ‘इकट्ठा होते थे’ मूल की gathering imagery को बचाता और बारंबारता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: अपने चेलों के साथ
  rationale: μετά संबंध या संगति दर्शाता है। ‘चेले’ गुरु-शिष्य संबंध को सामान्य, बोधगम्य बाइबलीय हिन्दी में बनाए रखता है।
theological_decisions:
- issue: यहूदा के लिए παραδιδοὺς का अर्थ
  choice: पकड़वाने वाला
  alternative: सौंपने वाला; विश्वासघात करने वाला
  rationale: दुःखभोग-वृत्तांत में क्रिया केवल तटस्थ हस्तांतरण नहीं, बल्कि यहूदा की विश्वासघाती कार्रवाई दर्शाती है। ‘पकड़वाने वाला’ नैतिक और कथात्मक संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- issue: συνήχθη का वाच्य और अर्थ
  choice: यीशु वहाँ अपने चेलों के साथ अक्सर इकट्ठा होते थे
  alternative: यीशु वहाँ अपने चेलों से अक्सर मिलते थे; यीशु वहाँ अपने चेलों के साथ अक्सर एकत्र किए जाते थे
  rationale: यूनानी कर्मवाच्य रूप संदर्भ में अकर्मक अर्थ ग्रहण कर सकता है। शाब्दिक कर्मवाच्य हिन्दी में अस्वाभाविक होगा और किसी बाहरी कर्ता का अनचाहा संकेत दे सकता है; ‘इकट्ठा होते थे’ मूल अर्थ और वास्तविक व्याकरणिक तनाव दोनों के निकट है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। यीशु के लिए आदरसूचक बहुवचन क्रिया ‘होते थे’ प्रयुक्त हुई है, जो सामान्य हिन्दी प्रयोग के अनुरूप है। वाक्य में अनावश्यक आरंभिक ‘अब’ नहीं जोड़ा गया।
