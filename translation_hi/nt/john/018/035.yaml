source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: hi
  text: पिलातुस ने उत्तर दिया, “क्या मैं यहूदी हूँ भला?[a] तुम्हारे अपने राष्ट्र और प्रधान याजकों ने तुम्हें मेरे हवाले किया है। तुमने क्या किया है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया-वासी।” यूनानी शब्द का अर्थ संदर्भ के अनुसार जातीय/धार्मिक पहचान (“यहूदी”) या क्षेत्रीय पहचान (“यहूदिया-वासी”) हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: संवाद में प्रतिक्रिया बताने वाला सहज और मानक हिन्दी प्रयोग।
- source_word: Μήτι
  choice: क्या मैं ... हूँ?
  rationale: संदर्भ और स्वर से स्पष्ट है कि प्रश्न नकारात्मक उत्तर की अपेक्षा करता है; हिन्दी में यही रूप स्वाभाविक रूप से पिलातुस का अविश्वास और दूरी व्यक्त करता है।
- source_word: Ἰουδαῖός
  choice: यहूदी
  rationale: यहाँ पिलातुस स्वयं को यीशु के जातीय-राष्ट्रीय समुदाय से अलग बताता है; अगले वाक्य का ‘तुम्हारे अपने राष्ट्र’ इस व्यापक अर्थ का समर्थन करता है।
- source_word: τὸ ἔθνος τὸ σὸν
  choice: तुम्हारे अपने राष्ट्र
  rationale: ἔθνος के सामूहिक राष्ट्रीय अर्थ और τὸ σὸν के बलयुक्त संबंध—‘तुम्हारा अपना’—दोनों को व्यक्त करता है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: यरूशलेम के उच्च पुरोहितीय नेतृत्व के लिए प्रचलित, सटीक और सहज हिन्दी पद।
- source_word: παρέδωκάν σε ἐμοί
  choice: तुम्हें मेरे हवाले किया है
  rationale: न्यायिक प्रसंग में किसी को अधिकारी के अधिकार में सौंपने का भाव स्पष्ट करता है, बिना ‘विश्वासघात’ का अतिरिक्त नैतिक अर्थ जोड़े।
- source_word: τί ἐποίησας
  choice: तुमने क्या किया है?
  rationale: पूर्ण कार्य की वर्तमान न्यायिक प्रासंगिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना में Ἰουδαῖος का अर्थ
  choice: यहूदी
  alternative: यहूदिया-वासी
  rationale: इस पद में पिलातुस का प्रश्न और ‘तुम्हारे अपने राष्ट्र’ का उल्लेख व्यापक जातीय-राष्ट्रीय अर्थ की ओर संकेत करते हैं, न कि केवल क्षेत्रीय पहचान की ओर।
translation_notes:
  register: आधुनिक मानक हिन्दी; न्यायिक संवाद के अनुरूप संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘क्या मैं यहूदी हूँ?’ को कृत्रिम प्रश्न-पुच्छ जोड़ने के बजाय प्रसंगगत नकारात्मक अपेक्षा सहित स्वाभाविक हिन्दी में रखा गया है।
