  naturalness: “क्या मैं यहूदी हूँ भला?” is idiomatic modern standard Hindi in a terse judicial dialogue. “प्रधान याजकों” and “मेरे हवाले किया है” are clear and appropriately formal.
  terminology: “यहूदी” is suitable here for Ἰουδαῖος; a footnote should preserve the viable contextual alternative “यहूदिया-वासी.” “प्रधान याजक” is an established rendering of ἀρχιερεῖς.
