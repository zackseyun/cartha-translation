  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Εἰ κακῶς ἐλάλησα, μαρτύρησον περὶ τοῦ κακοῦ· εἰ δὲ καλῶς, τί με δέρεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: hi
  text: यीशु ने उसे उत्तर दिया, “यदि मैंने जो कहा है वह गलत है, तो उसके बारे में गवाही दे[a]; पर यदि वह सही है, तो तुम मुझे क्यों मारते हो[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उस बुरे/गलत के विषय में गवाही दे”; अर्थ यह भी हो सकता है, “जो गलत था, उसके विषय में गवाही दे।”
    reason: lexical_alternative
  - marker: b
    text: या “तुम मुझे क्यों प्रहार करते हो?” यूनानी क्रिया का अर्थ सामान्य रूप से मारना और कुछ प्रसंगों में पीटना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: उसे उत्तर दिया
  rationale: यह सामान्य कथात्मक उत्तर-क्रिया और दत्तिव सर्वनाम, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κακῶς ἐλάλησα
  choice: मैंने गलत कहा
  rationale: ‘गलत’ न्यायिक प्रसंग में कथन की अनुचितता या असत्यता—दोनों की संभावना खुली रखता है; हिन्दी में ‘गलत कहा’ स्वाभाविक है।
- source_word: μαρτύρησον
  choice: गवाही दे
  rationale: आज्ञार्थक रूप और न्यायिक स्वर दोनों सुरक्षित रहते हैं।
- source_word: περὶ τοῦ κακοῦ
  choice: उस गलत बात के विषय में
  rationale: संज्ञीकृत यूनानी विशेषण को कथित गलत बात से जोड़ता है, पर उसे अपराध या नैतिक बुराई के रूप में अनावश्यक रूप से सीमित नहीं करता।
- source_word: εἰ δὲ καλῶς
  choice: पर यदि सही कहा
  rationale: ‘गलत’ के साथ स्पष्ट विरोध बनाए रखता है और हिन्दी में संदर्भ से छूटी हुई क्रिया सहज रूप से समझी जाती है।
- source_word: τί με δέρεις
  choice: तू मुझे क्यों मारता है
  rationale: ‘मारना’ δέρω के व्यापक अर्थ—प्रहार करना या पीटना—को यहाँ बिना यह तय किए व्यक्त करता है कि वार का ठीक प्रकार क्या था; एकवचन ‘तू’ मूल क्रिया के एकवचन को दर्शाता है।
theological_decisions:
- issue: अनुचित हिंसा के प्रति यीशु के उत्तर का स्वरूप
  choice: इसे प्रमाण और उचित प्रक्रिया की माँग करने वाली न्यायिक-नैतिक चुनौती के रूप में रखा गया है।
  alternative: अन्याय पर अधिक तीखा व्याख्यात्मक विस्तार करना, अथवा न्यायिक स्वर को नरम कर देना।
  rationale: मूल पाठ गलत कथन के लिए गवाही माँगता और सही कथन की दशा में प्रहार पर प्रश्न करता है; अनुवाद इसी तर्क को रखता है, अतिरिक्त धर्मवैज्ञानिक टिप्पणी नहीं जोड़ता।
- issue: κακῶς और καλῶς का विरोध
  choice: ‘गलत’ और ‘सही’
  alternative: ‘बुरी तरह’ और ‘अच्छी तरह’ अथवा ‘बुराई’ और ‘भलाई’
  rationale: इस प्रसंग में विरोध कथन के सही या गलत होने पर केंद्रित है। चुना हुआ युग्म नैतिक और तथ्यगत अर्थ की संभावित व्यापकता को बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सीधी और गरिमापूर्ण शैली। न्यायिक प्रसंग के लिए ‘गवाही दे’ रखा गया है। संबोधित व्यक्ति एकवचन है, इसलिए ‘तू’ मूल व्याकरण को स्पष्ट करता है; इसका उद्देश्य अनादर जोड़ना नहीं है।
