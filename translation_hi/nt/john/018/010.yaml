  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s servant and cut off his right ear. Now the servant’s name was Malchus.
translation:
  language: hi
  text: तब शमौन पतरस ने, जिसके पास एक तलवार थी, अपनी तलवार खींची और महायाजक के दास[a] पर वार किया और उसका दाहिना कान काट दिया। उस दास का नाम मलखुस था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवक।” यूनानी शब्द δοῦλος का अर्थ प्रसंग के अनुसार “दास” या “सेवक” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यह संयोजक पिछले दृश्य से कथा को आगे बढ़ाता है। ‘तब’ आधुनिक हिन्दी में स्वाभाविक कथात्मक प्रवाह देता है और इसे अत्यधिक तार्किक निष्कर्ष नहीं बनाता।
- source_word: ἔχων μάχαιραν
  choice: जिसके पास तलवार थी
  rationale: यह प्रयोग पतरस के पास हथियार होने की परिस्थिति बताता है। μάχαιρα तलवार या छोटी तलवार का बोध करा सकता है; ‘तलवार’ व्यापक और स्वाभाविक हिन्दी विकल्प है।
- source_word: εἵλκυσεν αὐτὴν
  choice: उसे खींचा
  rationale: हथियार के प्रसंग में इसका अर्थ तलवार को म्यान से खींचना है। ‘उसे खींचा’ संक्षिप्त है और पूर्वोक्त तलवार की ओर स्पष्ट संकेत करता है।
- source_word: ἔπαισεν
  choice: वार करके
  rationale: ‘वार करना’ हथियार से प्रहार करने को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है तथा साधारण ‘मारा’ से अधिक प्रसंगानुकूल है।
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: महायाजक के दास
  rationale: δοῦλος दास या सेवक दोनों अर्थ दे सकता है। महायाजक से व्यक्त संबंध के कारण मुख्य पाठ में ‘दास’ बंधुआ अधीनता को अधिक सीधे व्यक्त करता है; ‘सेवक’ को पादटिप्पणी में रखा गया है।
- source_word: ἀπέκοψεν
  choice: काट दिया
  rationale: क्रिया काटकर अलग कर देने का अर्थ देती है। हिन्दी में ‘कान काट दिया’ प्रत्यक्ष और स्वाभाविक अभिव्यक्ति है।
- source_word: ὠτάριον τὸ δεξιόν
  choice: दाहिना कान
  rationale: ὠτάριον का लघु रूप यहाँ सामान्यतः ‘कान’ के अर्थ में है; इसे ‘कान की लौ’ कहना मूल से अधिक विशिष्ट होगा। τὸ δεξιόν दाहिनी ओर स्पष्ट करता है।
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: उस दास का नाम मलखुस था
  rationale: यह पहचान संबंधी नई जानकारी देता है। यूनानी दत्तिवाचक रचना को स्वाभाविक हिन्दी संबंधसूचक वाक्य में व्यक्त किया गया है; Μάλχος का लिप्यंतरण ‘मलखुस’ है।
theological_decisions:
- issue: δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: शब्द दोनों अर्थों में प्रयुक्त हो सकता है। इस प्रसंग में महायाजक के साथ अधिकार-संबंध के कारण ‘दास’ मुख्य पाठ में उपयुक्त है, पर मूल की शब्दार्थगत व्यापकता बनाए रखने के लिए ‘सेवक’ को वैकल्पिक अनुवाद के रूप में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण कथात्मक शैली रखी गई है। यूनानी वाक्य-रचना की यांत्रिक नकल के बजाय अर्थ और घटनाक्रम को स्पष्ट रखते हुए मूल की शब्दार्थगत अनिश्चितता पादटिप्पणी में सुरक्षित की गई है।
