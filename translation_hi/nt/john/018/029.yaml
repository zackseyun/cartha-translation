  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मनुष्य’ मूल ἄνθρωπος के निकट है, जबकि ‘आरोप लगाना’ हिंदी की स्वाभाविक न्यायिक अभिव्यक्ति है।
