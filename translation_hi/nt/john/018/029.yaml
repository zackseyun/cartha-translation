  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: hi
  text: तब पिलातुस बाहर निकलकर उनके पास गया और कहा, “तुम इस मनुष्य के विरुद्ध कौन-सा आरोप लेकर आए हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν … ἔξω
  choice: बाहर … गया
  rationale: क्रिया ἐξῆλθεν और क्रियाविशेषण ἔξω दोनों भीतर से बाहर जाने की स्थानिक गति बताते हैं। हिंदी में ‘बाहर … गया’ इस संयुक्त अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: οὖν पिछले कथन से परिणाम और कथा की अगली गति को जोड़ता है; यहाँ ‘इसलिए’ उस तार्किक संबंध को स्पष्ट रखता है।
- source_word: πρὸς αὐτούς
  choice: उनके पास
  rationale: πρός के साथ कर्मकारक व्यक्तियों की ओर जाकर उनसे मिलने का भाव देता है; ‘उनके पास’ हिंदी में स्वाभाविक है।
- source_word: φησίν
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिंदी कथा में भूतकाल ‘कहा’ अधिक स्वाभाविक है और घटना का अर्थ नहीं बदलता।
- source_word: Τίνα κατηγορίαν
  choice: क्या आरोप
  rationale: κατηγορία न्यायिक संदर्भ में अभियोग या आरोप है। साधारण आधुनिक हिंदी में ‘आरोप’ स्पष्ट और सहज है।
- source_word: φέρετε
  choice: लगाते हो
  rationale: φέρω का मूल अर्थ ‘लाना’ है, किंतु आरोप के साथ हिंदी का स्वाभाविक कानूनी प्रयोग ‘आरोप लगाना’ है; इससे आरोप प्रस्तुत करने का सक्रिय भाव बना रहता है।
- source_word: κατὰ τοῦ ἀνθρώπου τούτου
  choice: इस मनुष्य पर
  rationale: न्यायिक संदर्भ में κατά का अर्थ ‘विरुद्ध’ है। हिंदी में ‘इस मनुष्य पर आरोप’ उसी संबंध को स्वाभाविक ढंग से व्यक्त करता है; ἄνθρωπος यहाँ एक पुरुष व्यक्ति को सूचित करता है।
