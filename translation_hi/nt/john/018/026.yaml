source:
  edition: SBLGNT
  text: λέγει εἷς ἐκ τῶν δούλων τοῦ ἀρχιερέως, συγγενὴς ὢν οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον· Οὐκ ἐγώ σε εἶδον ἐν τῷ κήπῳ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s servants[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: hi
  text: महायाजक के दासों[a] में से एक ने, जो उस व्यक्ति का रिश्तेदार था जिसका कान पतरस ने काट दिया था, कहा, “क्या मैंने ही तुम्हें उसके साथ बगीचे में नहीं देखा था?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवकों।” यूनानी शब्द दास अथवा सेवक—दोनों अर्थों में प्रयुक्त हो सकता है; यहाँ “दासों” उस समय की बँधी हुई घरेलू स्थिति को अधिक स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλων
  choice: दासों
  rationale: यहाँ शब्द महायाजक के घराने से बँधे हुए कर्मियों को दर्शाता है। ‘दास’ उनकी सामाजिक और कानूनी अधीनता को ‘सेवक’ की अपेक्षा अधिक स्पष्टता से बनाए रखता है।
- source_word: ἀρχιερέως
  choice: महायाजक
  rationale: यूहन्ना के दुखभोग-वृत्तांत में यह प्रधान याजकीय पद का मानक और सटीक हिन्दी रूप है।
- source_word: συγγενὴς ὢν
  choice: जो ... रिश्तेदार था
  rationale: समकालीन हिन्दी में यह सहभागी पदबंध का स्वाभाविक रूप है और वक्ता का घायल व्यक्ति से पारिवारिक संबंध स्पष्ट रखता है।
- source_word: οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον
  choice: जिसका कान पतरस ने काट दिया था
  rationale: सम्बन्धवाचक सर्वनाम के मानवीय संदर्भ को हिन्दी सहज रूप से व्यक्त करती है; ‘था’ इस घटना के पहले घटित होने को कथानक में स्पष्ट करता है।
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: क्या मैंने ही तुम्हें ... नहीं देखा था?
  rationale: नकारात्मक प्रश्न सकारात्मक उत्तर की अपेक्षा करता है, और ‘ही’ ἐγώ पर पड़े बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐν τῷ κήπῳ
  choice: बगीचे में
  rationale: κήπος के लिए सामान्य आधुनिक हिन्दी शब्द; प्रसंग में यीशु की गिरफ्तारी का बगीचा अभिप्रेत है।
- source_word: μετ’ αὐτοῦ
  choice: उसके साथ
  rationale: सर्वनाम यीशु की ओर संकेत करता है; हिन्दी में निकटवर्ती उद्धृत प्रश्न के भीतर ‘उसके साथ’ स्वाभाविक है।
theological_decisions:
- issue: गैर-रूपक घरेलू प्रसंग में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: यह घरेलू सेवा का सामान्य पद मात्र नहीं, बल्कि बँधी हुई सामाजिक स्थिति को भी सूचित करता है। इसलिए मूल की कठोर सामाजिक वास्तविकता को नरम किए बिना ‘दास’ चुना गया है; पाठ-टिप्पणी में प्रासंगिक वैकल्पिक अनुवाद दिया गया है।
translation_notes:
  register: भाषा आधुनिक, कथात्मक और गरिमापूर्ण रखी गई है। प्रश्न में ‘तुम्हें’ सामान्य आधुनिक सम्बोधन है; ‘मैंने ही’ यूनानी के बल को बिना अस्वाभाविक शब्दक्रम के व्यक्त करता है।
