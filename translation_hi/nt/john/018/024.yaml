base_translation:
  language: en
  yaml_path: translation/nt/john/018/024.yaml
  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: hi
  text: तब हन्ना ने उसे बँधा हुआ महायाजक कैफा के पास भेज दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, संदर्भ के अनुसार, “हन्ना उसे बँधा हुआ महायाजक कैफा के पास भेज चुका था,” यदि इसे पहले की कार्यवाही को समझाने वाली कोष्ठकीय टिप्पणी माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेज दिया
  rationale: यह ἀποστέλλω का एओरिस्ट सक्रिय रूप है और यहाँ सीधी कथात्मक क्रिया बताता है। ‘भेज दिया’ आधुनिक हिन्दी में पूर्ण हुई घटना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: οὖν कथानक अथवा तर्क की अगली कड़ी दिखाता है। ‘इसलिए’ इसके संयोजक बल को स्पष्ट रखता है, यद्यपि संदर्भ में ‘तब’ भी संभव है।
- source_word: δεδεμένον
  choice: बँधी हुई अवस्था में
  rationale: δέω का पूर्ण निष्क्रिय कृदंत उस व्यक्ति की उस समय जारी बँधी दशा बताता है। यह अनुवाद केवल ‘बाँधकर’ की अपेक्षा उस परिणामी अवस्था को अधिक ठीक रखता है और ‘अब भी’ जैसा अतिरिक्त बल नहीं जोड़ता।
- source_word: πρὸς
  choice: के पास
  rationale: गति-सूचक क्रिया के साथ πρός किसी व्यक्ति की ओर भेजे जाने को बताता है। हिन्दी में ‘कैफा के पास’ स्वाभाविक और सटीक है।
- source_word: ὁ Ἅννας
  choice: हन्ना
  rationale: यह कर्ता का व्यक्तिवाचक नाम है। ‘हन्ना’ हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण है।
- source_word: Καϊάφαν
  choice: कैफा
  rationale: Καϊάφας के कर्मकारक रूप का हिन्दी में प्रचलित लिप्यंतरण ‘कैफा’ है।
- source_word: τὸν ἀρχιερέα
  choice: महायाजक
  rationale: यूहन्ना के दुःखभोग-वृत्तांत में ἀρχιερεύς विशिष्ट सर्वोच्च याजकीय पद को दर्शाता है; ‘महायाजक’ हिन्दी में स्थापित और सटीक पदनाम है।
theological_decisions:
- issue: आस-पास के संदर्भ के संबंध में घटनाक्रम
  choice: 'पद को सामान्य भूतकालीन कथात्मक घटना के रूप में रखा गया है: हन्ना ने यीशु को बँधी अवस्था में कैफा के पास भेज दिया।'
  alternative: 'इसे पूर्ववृत्त बताने वाली कोष्ठकीय टिप्पणी समझना: ‘हन्ना उसे ... भेज चुका था।’'
  rationale: ग्रीक एओरिस्ट इंडिकेटिव सामान्यतः कथानक की घटना के रूप में पढ़ा जाता है। फिर भी यूहन्ना 18:24 का पूर्ववर्ती घटनाक्रम से संबंध विवादित है; इसलिए मुख्य पाठ में सामंजस्यकारी निष्कर्ष थोपे बिना वैकल्पिक संदर्भगत समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बँधी हुई अवस्था में’ मूल के पूर्ण निष्क्रिय कृदंत की जारी दशा को व्यक्त करता है। मुख्य पाठ में घटनाक्रम की वैकल्पिक व्याख्या को निर्णायक रूप से नहीं थोपा गया।
