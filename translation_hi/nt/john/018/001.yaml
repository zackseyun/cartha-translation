  yaml_path: translation/nt/john/018/001.yaml
  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: hi
  text: ये बातें कहने के बाद यीशु अपने चेलों के साथ किद्रोन के बरसाती नाले[a] के पार गए। वहाँ एक बाग था, जिसमें वे और उनके चेले प्रवेश किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किद्रोन की खड्ड” या “किद्रोन की धारा।” यूनानी शब्द ऐसे जलमार्ग के लिए है जिसमें प्रायः वर्षा के मौसम में पानी बहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: ये बातें कहने के बाद
  rationale: अओरिस्ट कृदन्त को स्वाभाविक कालवाचक उपवाक्य के रूप में प्रस्तुत किया गया है; इससे कथन और प्रस्थान का क्रम स्पष्ट रहता है।
- source_word: ἐξῆλθεν
  choice: गए
  rationale: ἐξέρχομαι का मूल अर्थ ‘बाहर जाना’ है, पर इस संदर्भ में हिन्दी में केवल ‘गए’ अधिक स्वाभाविक है; ‘बाहर निकले’ किसी स्पष्ट भवन या स्थान से निकलने का अनावश्यक संकेत दे सकता है।
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: अपने चेलों के साथ
  rationale: σύν के संगति-बोध को सीधे और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: किद्रोन के बरसाती नाले के पार
  rationale: πέραν दूर वाले पार जाने को बताता है और χείμαρρος वर्षा के मौसम में बहने वाले जलमार्ग या खड्ड को; ‘बरसाती नाला’ इस भौगोलिक अर्थ को सामान्य हिन्दी में सुरक्षित रखता है।
- source_word: ὅπου ἦν κῆπος
  choice: वहाँ एक बाग था
  rationale: κῆπος के सामान्य अर्थ ‘बाग’ को सरल अस्तित्ववाचक हिन्दी वाक्य में रखा गया है।
- source_word: εἰς ὃν εἰσῆλθεν
  choice: जिसमें ... गए
  rationale: εἰς की भीतर की ओर गति को ‘जिसमें’ व्यक्त करता है; हिन्दी में ‘प्रवेश किया’ की तुलना में ‘गए’ कथात्मक और सहज है।
- source_word: αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: वे और उनके चेले
  rationale: स्पष्ट αὐτός को आदरसूचक एकवचन ‘वे’ से व्यक्त किया गया है; ‘स्वयं’ जोड़ने से यूनानी से अधिक बल पड़ता।
