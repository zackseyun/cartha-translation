source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Ἐγὼ παρρησίᾳ ⸀λελάληκα τῷ κόσμῳ· ἐγὼ πάντοτε ἐδίδαξα ἐν συναγωγῇ καὶ ἐν τῷ ἱερῷ, ὅπου ⸀πάντες οἱ Ἰουδαῖοι συνέρχονται, καὶ ἐν κρυπτῷ ἐλάλησα οὐδέν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: hi
  text: यीशु ने उसे उत्तर दिया, “मैंने संसार के सामने खुलकर बात की है। मैंने सदा आराधनालय में और मंदिर[a] में शिक्षा दी, जहाँ सब यहूदी[b] इकट्ठे होते हैं; और मैंने गुप्त रूप से कुछ नहीं कहा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मंदिर-परिसर में।” यूनानी ἱερόν से पूरे मंदिर-परिसर का बोध होता है, केवल भीतरी पवित्रस्थान का नहीं।
    reason: lexical_alternative
  - marker: b
    text: या “सभी यहूदी लोग”; कुछ संदर्भों में “यहूदिया के लोग।” यूनानी Ἰουδαῖοι का अर्थ संदर्भ के अनुसार बदल सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: खुलकर
  rationale: यहाँ इसका विरोध ἐν κρυπτῷ (‘गुप्त रूप से’) से है; इसलिए यह सार्वजनिक और बिना छिपाव के बोलने को व्यक्त करता है, केवल साहसपूर्वक बोलने को नहीं।
- source_word: λελάληκα
  choice: मैंने ... बात की है
  rationale: पूर्णकाल यीशु के पहले के सार्वजनिक कथन और वर्तमान पूछताछ में उसकी प्रासंगिकता—दोनों को बनाए रखता है।
- source_word: τῷ κόσμῳ
  choice: संसार के सामने
  rationale: κόσμος की यूहन्नाई शब्दावली को ‘संसार’ से सुरक्षित रखा गया है, जबकि ‘के सामने’ हिंदी में सार्वजनिक संबोधन का स्वाभाविक भाव देता है।
- source_word: πάντοτε
  choice: सदा
  rationale: यह निरंतर सार्वजनिक रूप से शिक्षा देने की आदत को संक्षिप्त और गरिमापूर्ण आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἐν συναγωγῇ
  choice: आराधनालय में
  rationale: यूनानी एकवचन का सामान्य संस्थागत अर्थ है; हिंदी में एकवचन ‘आराधनालय में’ स्वाभाविक रूप से उस सार्वजनिक शिक्षण-स्थल को दर्शाता है।
- source_word: ἐν τῷ ἱερῷ
  choice: मंदिर में
  rationale: संक्षिप्त और परिचित अनुवाद चुना गया है; ἱερόν के पूरे मंदिर-परिसर के अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: सब यहूदी
  rationale: यह सीधा अनुवाद है। इस संदर्भ में आराधनालय और मंदिर में एकत्र होने वाले व्यापक यहूदी समुदाय का संकेत अधिक स्वाभाविक है; शब्द की संदर्भ-संवेदनशीलता पादटिप्पणी में रखी गई है।
- source_word: συνέρχονται
  choice: इकट्ठे होते हैं
  rationale: यह सामुदायिक रूप से एक स्थान पर आने का सरल, वर्तमान और स्वाभाविक हिंदी रूप है।
- source_word: ἐν κρυπτῷ
  choice: गुप्त रूप से
  rationale: यह παρρησίᾳ के साथ सार्वजनिक/गुप्त विरोध को स्पष्ट रूप से बनाए रखता है।
- source_word: ἐλάλησα οὐδέν
  choice: मैंने ... कुछ नहीं कहा
  rationale: निषेध के बल को बनाए रखते हुए यह स्वाभाविक हिंदी अभिव्यक्ति है।
- source_word: ἀπεκρίθη αὐτῷ
  choice: उसे उत्तर दिया
  rationale: यह कथा-प्रसंग में संक्षिप्त, सटीक और स्वाभाविक हिंदी है।
theological_decisions:
- issue: यूहन्ना में Ἰουδαῖοι का संदर्भ
  choice: मुख्य पाठ में ‘यहूदी’, जिसे यहाँ सार्वजनिक उपासना और सामुदायिक एकत्रीकरण के संदर्भ में व्यापक यहूदी समुदाय के रूप में समझा जाता है
  alternative: ‘यहूदी लोग’ या संदर्भानुसार ‘यहूदिया के लोग’
  rationale: यूहन्ना में Ἰουδαῖοι संदर्भ के अनुसार यहूदी लोग, यहूदिया के निवासी, या कुछ यहूदी अगुवे हो सकता है। इस पद में आराधनालय और मंदिर का उल्लेख व्यापक सामुदायिक अर्थ का समर्थन करता है, पर वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: यीशु का ‘गुप्त रूप से कुछ नहीं कहा’ कथन
  choice: कथन को उसके सार्वजनिक शिक्षण और छिपी हुई शिक्षा के विरोध के रूप में बिना नरम किए रखा गया है
  alternative: इसे ‘मैंने कोई अलग गुप्त शिक्षा नहीं दी’ जैसे व्याख्यात्मक रूप में प्रस्तुत करना
  rationale: मूल पाठ का व्यापक निषेध जानबूझकर तीखा है। अनुवाद उसमें व्याख्यात्मक सीमा जोड़कर संभावित तनाव को चुपचाप दूर नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सार्वजनिक वाचन के योग्य शैली रखी गई है। ‘संसार’, ‘सदा’ और ‘आराधनालय’ जैसे परिचित बाइबलीय शब्दों के साथ वाक्य-विन्यास को वर्तमान हिंदी के अनुरूप रखा गया है। दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
