translation:
  language: hi
  text: ऐसा इसलिए हुआ कि यीशु की वह बात पूरी हो[a] जो उन्होंने यह संकेत देते हुए कही थी कि वे किस प्रकार की मृत्यु मरने वाले थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु का वह कथन पूरा हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: यह इसलिए हुआ कि
  rationale: यह प्रसंग में उद्देश्य/परिणाम का संबंध स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: यीशु की वह बात
  rationale: यहाँ λόγος यीशु के किसी कथन को दर्शाता है, यूहन्ना 1:1 की उपाधि ‘वचन’ को नहीं; ‘वह बात’ अगले संबंधवाचक उपवाक्य से सहज जुड़ती है।
- source_word: πληρωθῇ
  choice: पूरी हो
  rationale: यह पूर्ति की बाइबलीय धारणा बनाए रखते हुए सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὃν εἶπεν
  choice: जो उन्होंने कही थी
  rationale: भूतकाल में पहले कहे गए कथन को स्पष्ट करता है; आदरसूचक बहुवचन हिन्दी के मानक प्रयोग के अनुरूप है।
- source_word: σημαίνων
  choice: इससे यह संकेत देते हुए
  rationale: वर्तमान कृदंत को व्याख्यात्मक ढंग से रखता है और इसे केवल उद्देश्यवाचक अर्थ तक सीमित नहीं करता।
- source_word: ποίῳ θανάτῳ
  choice: उनकी मृत्यु किस प्रकार
  rationale: ποίῳ मृत्यु के तथ्य से अधिक उसके प्रकार अथवा ढंग की ओर संकेत करता है।
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: होने वाली थी
  rationale: आसन्न अथवा अपेक्षित भविष्य व्यक्त होता है, पर ‘नियत’ जैसे अधिक प्रबल धर्मवैज्ञानिक अर्थ को आरोपित नहीं किया जाता।
theological_decisions:
- issue: यीशु के पूर्वकथन की पूर्ति
  choice: ‘यीशु की वह बात पूरी हो’
  alternative: ‘यीशु ने जो कहा था वह सच हो जाए’
  rationale: ‘पूरी हो’ πληρόω की पूर्ति-संबंधी धर्मवैज्ञानिक प्रतिध्वनि बनाए रखता है, जबकि ‘सच हो’ उसे कुछ सपाट कर देता।
- issue: μέλλω और यीशु की मृत्यु
  choice: ‘मृत्यु ... होने वाली थी’
  alternative: ‘उनकी मृत्यु ... नियत थी’
  rationale: मूल पाठ भविष्य/आसन्नता दर्शाता है, पर इस पद में अपने आप प्रबल नियतिवादी भाषा की माँग नहीं करता।
- issue: σημαίνων का संबंध
  choice: ‘इससे यह संकेत देते हुए’ को यीशु के कहने की व्याख्या के रूप में रखा
  alternative: ‘यह बताने के लिए कहा था’
  rationale: कृदंत की व्याख्यात्मक अस्पष्टता बची रहती है; इसे केवल उद्देश्यवाचक रचना में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। यीशु के लिए आदरसूचक ‘उन्होंने/उनकी’ का प्रयोग किया गया है। ‘बात’ सामान्य पाठक के लिए सहज है, और पादटिप्पणी में अधिक औपचारिक ‘कथन’ दिया गया है।
