base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: hi
  text: उन्होंने उसे उत्तर दिया, “नासरी यीशु को।” उसने उनसे कहा, “मैं ही हूँ।” उसे पकड़वाने वाला यहूदा भी उनके साथ खड़ा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: यीशु नासरी को
  rationale: यूनानी पदबंध में कर्मकारक रूप है, जो पिछले पद के प्रश्न ‘किसे ढूँढ़ रहे हो?’ का स्वाभाविक उत्तर है। ‘नासरी’ Ναζωραῖος का संक्षिप्त और प्रचलित हिन्दी रूप है।
- source_word: Ἐγώ εἰμι
  choice: मैं ही हूँ
  rationale: संदर्भ में यीशु अपनी पहचान बता रहे हैं। ‘ही’ हिन्दी में बलयुक्त ἐγώ को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘मैं वह हूँ’ अनावश्यक रूप से कृत्रिम होता।
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: उसे पकड़वाने वाला
  rationale: वर्तमान कृदन्त यहूदा की चल रही विश्वासघाती भूमिका बताता है। गिरफ्तारी के इस प्रसंग में ‘पकड़वाने वाला’ केवल ‘धोखा देने वाला’ से अधिक सटीक और सहज है।
- source_word: μετ’ αὐτῶν
  choice: उनके साथ
  rationale: समूह के साथ यहूदा की भौतिक और पक्षगत उपस्थिति दोनों को सीधे बनाए रखता है।
theological_decisions:
- issue: Ἐγώ εἰμι में साधारण आत्म-पहचान और संभावित योहन्नीय धार्मिक प्रतिध्वनि
  choice: मैं ही हूँ
  alternative: मैं हूँ / मैं वही हूँ
  rationale: यह रूप तत्काल प्रसंग में ‘मैं ही वह व्यक्ति हूँ’ का अर्थ स्पष्ट करता है, पर ‘हूँ’ की मूल अभिव्यक्ति को बनाए रखकर संभावित व्यापक योहन्नीय प्रतिध्वनि को पूरी तरह मिटाता नहीं। इसे स्पष्ट ईश्वरीय नाम के रूप में विस्तार देना पाठ से अधिक कहना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और मौखिक संवाद में स्वाभाविक। ‘उसे उत्तर दिया’ मूल के सर्वनाम को सुरक्षित रखता है, और अंतिम वाक्य में ‘भी’ καί का बल व्यक्त करता है।
