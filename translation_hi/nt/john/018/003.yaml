source:
  edition: SBLGNT
  text: ὁ οὖν Ἰούδας λαβὼν τὴν σπεῖραν καὶ ἐκ τῶν ἀρχιερέων καὶ ⸂ἐκ τῶν⸃ Φαρισαίων ὑπηρέτας ἔρχεται ἐκεῖ μετὰ φανῶν καὶ λαμπάδων καὶ ὅπλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: hi
  text: तब यहूदा सैनिक-दल और प्रधान याजकों तथा फ़रीसियों के अधिकारियों को लेकर लालटेनों, मशालों और हथियारों के साथ वहाँ आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से कथा की परिणति और निरंतरता जोड़ता है; यहाँ ‘इसलिए’ स्वाभाविक है और संयोजक बल बनाए रखता है।
- source_word: λαβὼν
  choice: को साथ लेकर
  rationale: यूनानी कृदंत मुख्य क्रिया से पहले की सहगामी तैयारी दिखाता है। हिंदी में ‘साथ लेकर ... आया’ अर्थ और क्रम को सहज रूप से व्यक्त करता है।
- source_word: σπεῖραν
  choice: सैनिक-दल
  rationale: यह सैन्य टुकड़ी या कोहोर्ट का संकेत दे सकता है, पर अनिवार्यतः पूरी कोहोर्ट की उपस्थिति नहीं बताता। ‘सैनिक-दल’ आधुनिक पाठक के लिए स्पष्ट रहते हुए संख्या के विषय में अनावश्यक निश्चितता से बचता है।
- source_word: ὑπηρέτας
  choice: पहरेदारों
  rationale: इस प्रसंग में यह यहूदी अधिकारियों की सेवा में लगे आधिकारिक कर्मचारियों या रक्षकों को सूचित करता है। ‘पहरेदार’ उनकी भूमिका स्पष्ट करता है, बिना उन्हें केवल घरेलू सेवक मानने के।
- source_word: ἀρχιερέων
  choice: प्रधान याजकों
  rationale: बहुवचन में यह प्रमुख याजकीय अधिकारियों के समूह का मानक संकेत है।
- source_word: Φαρισαίων
  choice: फ़रीसियों
  rationale: समूह के नाम का प्रचलित आधुनिक हिंदी रूप।
- source_word: ἔρχεται
  choice: आया
  rationale: यूनानी में ऐतिहासिक वर्तमान है। स्वाभाविक हिंदी कथन में भूतकाल अधिक सुगम है, जबकि घटना की स्पष्टता बनी रहती है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: पूर्व प्रसंग में बताए गए स्थान की ओर सामान्य स्थानवाचक संकेत।
- source_word: φανῶν
  choice: लालटेनें
  rationale: यह पोर्टेबल ढकी हुई रोशनी को सूचित कर सकता है और इसे λαμπάδων से अलग रखता है।
- source_word: λαμπάδων
  choice: मशालें
  rationale: यह खुली जलती हुई मशाल का सामान्य अर्थ देता है; ‘लालटेनें’ के साथ दोनों यूनानी शब्दों का भेद सुरक्षित रहता है।
- source_word: ὅπλων
  choice: हथियार
  rationale: सशस्त्र बल के साधनों के लिए स्पष्ट और सामान्य आधुनिक हिंदी शब्द।
theological_decisions:
- issue: गिरफ़्तार करने आए दल की पहचान और संरचना
  choice: σπεῖρα को ‘सैनिक-दल’ और ὑπηρέτας को ‘पहरेदार’ कहा गया है, और प्रधान याजकों तथा फ़रीसियों से संबंध केवल पहरेदारों के साथ स्पष्ट किया गया है।
  alternative: ‘रोमी पलटन और मन्दिर के रक्षक’ या सामान्यतः ‘सैनिकों और सेवकों का दल’।
  rationale: यूनानी पाठ सैन्य दल और यहूदी अधिकारियों की ओर से आए आधिकारिक पहरेदारों के बीच भेद रखता है, पर दल की ठीक संख्या, उसके पूर्ण कोहोर्ट होने, या ὑπηρέται के औपचारिक पदनाम को निश्चित नहीं करता। अनुवाद इस मिश्रित संरचना को बनाए रखता है और अतिरिक्त ऐतिहासिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। लंबे यूनानी वाक्य को दो हिंदी वाक्यों में बाँटा गया है ताकि हथियार और प्रकाश-साधनों का संबंध पूरे साथ आए दल से स्वाभाविक रूप से समझे। ‘फ़रीसी’ में नुक़्ता प्रचलित आधुनिक उच्चारण को दर्शाता है।
