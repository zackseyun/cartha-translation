base_translation:
  language: en
  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: hi
  text: तब पिलातुस फिर राज्यपाल के मुख्यालय[a] में गया और यीशु को बुलाया और उससे कहा, “क्या तुम यहूदियों[b] के राजा हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रेटोरियम,” अर्थात रोमी राज्यपाल का आधिकारिक निवास या मुख्यालय।
    reason: lexical_alternative
  - marker: b
    text: या “यहूदिया के निवासी।” यूनानी शब्द सामान्य रूप से यहूदियों के लिए, या कुछ प्रसंगों में यहूदिया के निवासियों के लिए, प्रयुक्त हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰσῆλθεν ... πάλιν
  choice: फिर ... में गया
  rationale: यह संयोजन किसी स्थान में दोबारा जाने या लौटकर प्रवेश करने को व्यक्त करता है। हिंदी में ‘फिर ... में गया’ सहज है और पुनः प्रवेश का भाव बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पूर्ववर्ती घटनाओं से कथात्मक निष्कर्ष या प्रगति को जोड़ता है; ‘इसलिए’ उस संबंध को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: πραιτώριον
  choice: राज्यपाल का मुख्यालय
  rationale: यह रोमी राज्यपाल के आधिकारिक निवास या मुख्यालय को दर्शाता है। ‘मुख्यालय’ आधुनिक पाठक के लिए अर्थ स्पष्ट करता है, जबकि पारंपरिक पद को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐφώνησεν
  choice: बुलाकर
  rationale: यहाँ क्रिया का अर्थ किसी को बुलाना या अपने पास आने के लिए कहना है। ‘बुलाकर’ सरल है और वाक्य के अगले क्रियाक्रम से स्वाभाविक रूप से जुड़ता है।
- source_word: εἶπεν αὐτῷ
  choice: उससे कहा
  rationale: मूल क्रिया सामान्यतः ‘कहना’ है, न कि विशेष रूप से ‘पूछना’; उद्धृत प्रश्न स्वयं प्रश्नवाचक बल प्रकट करता है।
- source_word: Σὺ εἶ
  choice: क्या तुम ... हो
  rationale: स्पष्ट सर्वनाम σύ का प्रश्नवाचक बल स्वाभाविक हिंदी संरचना ‘क्या तुम ... हो?’ में व्यक्त होता है।
- source_word: ὁ βασιλεὺς
  choice: राजा
  rationale: संज्ञा निश्चित राजकीय पहचान को दर्शाती है। हिंदी में इस विधेयात्मक प्रश्न में ‘राजा’ स्वाभाविक रूप से वही अर्थ देता है।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों के
  rationale: मुकदमे के प्रसंग में यह रोमी राजनीतिक आरोप का प्रचलित और संदर्भानुकूल रूप है। भौगोलिक अर्थ ‘यहूदिया के लोग’ की संभावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: राजकीय उपाधि में Ἰουδαίων का अर्थ
  choice: यहूदियों
  alternative: यहूदिया के लोगों
  rationale: यहाँ पिलातुस यीशु के विरुद्ध लगाए गए राजनीतिक आरोप की जाँच कर रहा है, इसलिए ‘यहूदियों का राजा’ ऐतिहासिक और प्रसंगानुकूल अभिव्यक्ति है। फिर भी यूनानी शब्द कभी-कभी यहूदिया के निवासियों को भी सूचित कर सकता है; इस वास्तविक अर्थगत संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
