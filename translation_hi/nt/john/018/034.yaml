id: JHN.18.34
reference: John 18:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· ⸂Ἀπὸ σεαυτοῦ⸃ σὺ τοῦτο λέγεις ἢ ἄλλοι ⸂εἶπόν σοι⸃ περὶ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: hi
  text: यीशु ने उत्तर दिया, “क्या तुम यह अपनी ओर से कह रहे हो[a], या दूसरों ने तुम्हें मेरे बारे में बताया है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में, “अपने से” या “अपनी ओर से।” यीशु पूछ रहे हैं कि क्या यह बात पिलातुस की अपनी ओर से उठी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: संवाद में किसी प्रश्न के प्रत्युत्तर को व्यक्त करने वाला स्वाभाविक और गरिमापूर्ण हिन्दी प्रयोग।
- source_word: Ἀπὸ σεαυτοῦ
  choice: अपनी ओर से
  rationale: 'ἀπό के स्रोत या उद्गम के भाव को बनाए रखता है: प्रश्न यह है कि बात स्वयं पिलातुस की ओर से उठी है या उसे दूसरों से मिली है। यह आधुनिक हिन्दी में स्वाभाविक भी है।'
- source_word: σὺ
  choice: तुम
  rationale: यूनानी में व्यक्त सर्वनाम स्पष्ट रूप से दिया गया है और बल देता है; हिन्दी में ‘तुम’ रखकर यह बल सुरक्षित रहता है।
- source_word: τοῦτο
  choice: यह
  rationale: पिलातुस के ठीक पिछले प्रश्न की ओर संकेत करता है; हिन्दी में ‘यह’ पर्याप्त रूप से स्पष्ट है।
- source_word: λέγεις
  choice: कह रहे हो
  rationale: वर्तमान संवाद में यूनानी वर्तमान काल को स्वाभाविक हिन्दी अपूर्ण वर्तमान रूप में व्यक्त करता है।
- source_word: ἢ
  choice: या
  rationale: दो संभावित स्रोतों के बीच स्पष्ट विकल्प प्रस्तुत करता है।
- source_word: ἄλλοι
  choice: दूसरों
  rationale: पिलातुस के अतिरिक्त अनिर्दिष्ट लोगों को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἶπόν σοι
  choice: तुम्हें बताया है
  rationale: यहाँ λέγω का अर्थ किसी को बात बताना है। हिन्दी पूर्ण रूप वर्तमान प्रसंग से उस पूर्व कथन की संगति को स्वाभाविक रूप से दिखाता है।
- source_word: περὶ ἐμοῦ
  choice: मेरे बारे में
  rationale: περί के ‘विषय में/सम्बन्ध में’ अर्थ का सहज आधुनिक हिन्दी रूप।
theological_decisions:
- issue: यीशु के प्रश्न का आशय
  choice: प्रश्न को पिलातुस की बात के स्रोत पर केंद्रित रखा गया है—वह स्वयं उसकी ओर से आई है या दूसरों से।
  alternative: इसे अधिक व्याख्यात्मक रूप से ‘क्या तुम अपनी ही पहल पर यह पूछ रहे हो?’ कहना।
  rationale: यूनानी पाठ सीधे तौर पर कथन के स्रोत को पूछता है; पिलातुस की मंशा या व्यापक धर्मवैज्ञानिक अर्थ को अनुवाद में जोड़ना मूल की खुली हुई अर्थ-तनाव को समय से पहले सुलझा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘अपनी ओर से’ स्रोत और व्यक्तिगत पहल—दोनों की सम्भावित छाया को बिना अतिरिक्त व्याख्या के बनाए रखता है।
