  source_fidelity: 'The draft accurately represents the Greek sequence: οὖν is rendered as a discourse connection (‘इसलिए’), πάλιν as ‘फिर,’ the loud outcry of ἐκραύγασαν as ‘चिल्लाकर,’ and the contrastive elliptical demand as ‘इसे नहीं, बल्कि बरअब्बा को!’ The explanatory statement that Barabbas was a λῃστής is retained without adding a political interpretation.'
