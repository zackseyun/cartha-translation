source:
  edition: SBLGNT
  text: ἐκραύγασαν οὖν ⸀πάλιν λέγοντες· Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν. ἦν δὲ ὁ Βαραββᾶς λῃστής.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/040.yaml
  text: So they shouted again[a], saying, “Not this man, but Barabbas!” Now Barabbas was a robber.
translation:
  language: hi
  text: इसलिए वे फिर चिल्लाकर कहने लगे, “इसे नहीं, बल्कि बरअब्बा को!” बरअब्बा एक लुटेरा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “डाकू”; यूनानी शब्द कुछ संदर्भों में सशस्त्र लुटेरे अथवा हिंसक विद्रोही के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: चिल्लाकर
  rationale: क्रिया ऊँची आवाज़ में पुकारने या चिल्लाने का भाव देती है; ‘चिल्लाकर’ आधुनिक हिन्दी में स्वाभाविक रूप से इसकी तीव्रता व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले संवाद के परिणाम या उससे आगे बढ़ती घटना को जोड़ता है; ‘इसलिए’ उस तार्किक संबंध को स्पष्ट रखता है।
- source_word: πάλιν
  choice: फिर
  rationale: यह पुकार की पुनरावृत्ति को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λέγοντες
  choice: कहने लगे
  rationale: ‘चिल्लाकर कहने लगे’ यूनानी मुख्य क्रिया और कृदंत दोनों के भाव को सहज हिन्दी में बनाए रखता है।
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: इसे नहीं, बल्कि बरअब्बा को
  rationale: ‘इसे’ τοῦτον के संकेतवाचक बल को रखता है, और ‘को’ प्रसंग में निहित ‘छोड़ दो’ के कर्म को बिना अनावश्यक रूप से पूरा वाक्य जोड़कर स्पष्ट करता है।
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: बरअब्बा
  rationale: नाम का प्रचलित और स्रोत के निकट हिन्दी लिप्यंतरण।
- source_word: ἦν δὲ
  choice: बरअब्बा ... था
  rationale: δέ यहाँ पृष्ठभूमि की व्याख्यात्मक सूचना प्रस्तुत करता है; हिन्दी में अलग वाक्य और स्वाभाविक शब्दक्रम पर्याप्त संबंध व्यक्त करते हैं।
- source_word: λῃστής
  choice: लुटेरा
  rationale: यह शब्द डाकू, लुटेरे या हिंसक गिरोह/विद्रोही से जुड़े व्यक्ति को सूचित कर सकता है। ‘लुटेरा’ सामान्य मूल अर्थ को स्पष्ट रखता है, जबकि व्यापक संभावित अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: बरअब्बा के लिए λῃστής का अर्थ
  choice: लुटेरा
  alternative: डाकू; हिंसक विद्रोही
  rationale: इस पद में शब्द का सामान्य अर्थ लूटपाट करने वाला व्यक्ति है। पहली शताब्दी के कुछ संदर्भों में यह सशस्त्र डाकू या हिंसक विद्रोही के लिए भी प्रयुक्त हो सकता है, पर केवल इस पद के आधार पर राजनीतिक अर्थ निश्चित करना उचित नहीं; इसलिए मुख्य पाठ सामान्य अर्थ रखता है और पादटिप्पणी अर्थ-सीमा बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। भीड़ की तीखी पुकार को ‘चिल्लाकर’ से व्यक्त किया गया है। उद्धरण की संक्षिप्तता और मूल का विरोधात्मक बल बनाए रखा गया है।
