source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: hi
  text: 'ताकि वह वचन पूरा हो जो उसने कहा था: “जिन्हें तूने मुझे दिया है, उनमें से मैंने एक को भी नहीं खोया।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनमें से किसी को भी नहीं खोया।”
    reason: ἐξ αὐτῶν οὐδένα के अंशवाचक और बलात्मक भाव को व्यक्त करने वाला समानार्थी हिन्दी विकल्प।
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणाम का संबंध व्यक्त करता है और पूर्ववर्ती घटना को इस वचन की पूर्ति से स्वाभाविक रूप से जोड़ता है।
- source_word: πληρωθῇ
  choice: पूरा हो
  rationale: निष्क्रिय संभावनार्थक क्रिया का अर्थ यहाँ यीशु के पहले कहे हुए वचन का घटना में साकार होना है; ‘पूरा हो’ आधुनिक हिन्दी में स्वाभाविक और यूहन्ना की पूर्ति-संबंधी भाषा के अनुरूप है।
- source_word: ὁ λόγος ὃν εἶπεν
  choice: उसका कहा हुआ यह वचन
  rationale: λόγος यहाँ किसी उपाधि के रूप में ‘वचन’ नहीं, बल्कि यीशु की एक विशेष उक्ति है। यह हिन्दी संरचना पहले कही गई बात और उसके वर्तमान प्रसंग में पूरा होने, दोनों को स्पष्ट रखती है।
- source_word: Οὓς δέδωκάς μοι
  choice: जिन्हें तूने मुझे दिया है
  rationale: पूर्णकाल δέδωκάς के वर्तमान तक बने परिणाम को ‘दिया है’ से सुरक्षित रखा गया है। एकवचन संबोधन को ‘तूने’ से व्यक्त किया गया है, जो पिता से यीशु के सीधे संबोधन के अनुरूप है।
- source_word: ἀπώλεσα
  choice: मैंने ... नहीं खोया
  rationale: इस प्रसंग में अर्थ सौंपे गए शिष्यों में से किसी को खो देने का है, न कि सक्रिय रूप से नष्ट करने का। ‘खोया’ यूहन्ना 17:12 से शब्दगत संबंध और संरक्षण से जुड़ा तनाव बनाए रखता है।
- source_word: ἐξ αὐτῶν οὐδένα
  choice: उनमें से ... एक को भी नहीं
  rationale: यह चयन यूनानी के अंशवाचक और बलात्मक भाव—‘उनमें से एक भी नहीं’—को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यीशु के वचन की ‘पूर्ति’ का स्वरूप
  choice: ‘वचन पूरा हो’ कहकर यीशु की पहले कही बात के घटनात्मक रूप से साकार होने को व्यक्त किया गया है।
  alternative: ‘बात सच साबित हो’
  rationale: πληρωθῇ की धार्मिक और कथात्मक गंभीरता बनाए रखी गई है, पर इसे स्पष्ट रूप से पवित्रशास्त्रीय भविष्यवाणी का सूत्र नहीं बनाया गया।
- issue: ἀπώλεσα और शिष्यों की रक्षा
  choice: ‘मैंने ... नहीं खोया’
  alternative: ‘मैंने किसी को नष्ट नहीं होने दिया’
  rationale: ‘खोया’ मूल क्रिया की व्यापकता और यूहन्ना 17:12 की प्रतिध्वनि सुरक्षित रखता है, बिना किसी विशिष्ट सिद्धान्तगत व्याख्या को पाठ में जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष उद्धरण में पिता के लिए एकवचन ‘तू’ मूल के एकवचन संबोधन और बाइबलीय हिन्दी की प्रार्थनात्मक निकटता को दर्शाता है; यह अनादर सूचित नहीं करता।
