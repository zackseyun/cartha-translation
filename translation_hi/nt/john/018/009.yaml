  source_fidelity: The draft accurately conveys ἵνα as ‘ताकि,’ πληρωθῇ as fulfillment, the perfect ‘तूने ... दिया है,’ and the emphatic partitive sense of ἐξ αὐτῶν οὐδένα. ‘खोया’ appropriately retains the contextual sense of not losing those entrusted to Jesus, rather than introducing ‘destroyed.’
  naturalness: ‘उसका कहा हुआ यह वचन’ is somewhat cumbersome and leaves the antecedent of ‘उसका’ needlessly dependent on the preceding context. ‘वह वचन जो उसने कहा था’ is more natural modern Hindi and directly reflects the Greek relative clause.
  terminology: ‘वचन,’ ‘पूरा हो,’ and ‘खोया’ are suitable, dignified, and do not add a doctrinal interpretation. The direct singular ‘तूने’ is retained within the established prayer-address register and reflects the singular Greek address without implying disrespect.
