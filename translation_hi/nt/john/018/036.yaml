source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: hi
  text: यीशु ने उत्तर दिया, “मेरा राज्य इस संसार से नहीं है। यदि मेरा राज्य इस संसार से होता, तो मेरे सेवक लड़ रहे होते, ताकि मुझे यहूदियों[a] के हवाले न किया जाता। लेकिन अब मेरा राज्य यहाँ से नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया के निवासियों को”; यहाँ संभवतः विशेष रूप से यहूदी अधिकारियों की ओर संकेत है।
    reason: मूल Ἰουδαῖοι का अर्थ प्रसंगानुसार व्यापक ‘यहूदी’ अथवा अधिक संकीर्ण ‘यहूदिया के निवासी/यहूदी अधिकारी’ हो सकता है।
lexical_decisions:
- source_word: βασιλεία
  choice: राज्य
  rationale: ‘राज्य’ राजकीय क्षेत्र और शासन—दोनों अर्थों को समेट सकता है और इस पद की बार-बार आने वाली वाक्य-रचना में स्वाभाविक है।
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: इस संसार से
  rationale: ἐκ स्रोत या उद्गम को दर्शाता है; ‘इस संसार से’ यह अर्थ सुरक्षित रखता है कि यीशु के राज्य का मूल इस संसार की व्यवस्था में नहीं है।
- source_word: κόσμος
  choice: संसार
  rationale: यूहन्ना में यह शब्द प्रायः परमेश्वर के विरोध में खड़ी वर्तमान मानवीय व्यवस्था की छाया लिए होता है, पर ‘संसार’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ὑπηρέται
  choice: सेवक
  rationale: यह शब्द किसी अधिकारी के अधीन सेवा करने वालों को दर्शाता है; राजकीय प्रसंग में ‘सेवक’ उपयुक्त है और किसी विशेष पुलिस या सैनिक पद का अनावश्यक संकेत नहीं देता।
- source_word: ἠγωνίζοντο ἄν
  choice: लड़ रहे होते
  rationale: ἄν के साथ अपूर्णकाल इस असत्य कल्पित परिस्थिति में जारी रहने वाली कार्रवाई का भाव देता है, जिसे ‘लड़ रहे होते’ व्यक्त करता है।
- source_word: ἵνα μὴ παραδοθῶ
  choice: ताकि मैं … सौंपा न जाता
  rationale: यह उद्देश्यसूचक उपवाक्य है; ‘सौंपा जाना’ παραδίδωμι के न्यायिक और विश्वासघात-संबंधी भाव को आधुनिक हिन्दी में बनाए रखता है।
- source_word: τοῖς Ἰουδαίοις
  choice: यहूदियों को
  rationale: मूल शब्द व्यापक रूप से ‘यहूदियों’ अथवा प्रसंगानुसार अधिक संकीर्ण रूप से यहूदिया के लोगों या यहूदी अधिकारियों की ओर संकेत कर सकता है। मुख्य पाठ मूल की व्यापकता रखता है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: νῦν δὲ
  choice: पर वास्तव में
  rationale: यह कल्पित परिस्थिति के विपरीत वास्तविक स्थिति बताता है; ‘पर वास्तव में’ आधुनिक हिन्दी में इस विरोध को स्पष्ट करता है।
- source_word: ἐντεῦθεν
  choice: यहाँ से
  rationale: यह स्थान या क्षेत्र से उद्गम बताने वाला संकेतवाचक क्रियाविशेषण है; ‘यहाँ से’ पहले कथन को हूबहू दोहराए बिना मूल की अभिव्यक्ति बनाए रखता है।
theological_decisions:
- issue: संसार के संबंध में यीशु के राज्य का स्वरूप
  choice: ‘इस संसार से नहीं’—स्रोत या उद्गम की भाषा को बनाए रखा गया है।
  alternative: ‘इस संसार का नहीं’ अथवा ‘इस संसार का भाग नहीं’
  rationale: पद मुख्यतः यीशु के राज्य के स्रोत और चरित्र के विषय में कहता है; यह संसार में उसकी उपस्थिति का निषेध नहीं करता। यह रूप उस धर्मवैचारिक तनाव को बिना सुलझाए सुरक्षित रखता है।
- issue: यूहन्ना में Ἰουδαῖοι का संदर्भ
  choice: मुख्य पाठ में ‘यहूदियों’ और पादटिप्पणी में प्रसंगगत संकीर्ण अर्थ।
  alternative: ‘यहूदिया के लोगों’ अथवा ‘यहूदी अगुओं’
  rationale: यूनानी शब्द व्यापक अर्थ में ‘यहूदियों’ को दर्शा सकता है, पर यूहन्ना में कभी-कभी प्रसंग के अनुसार यह यहूदिया के लोगों या अधिकारियों के लिए प्रयुक्त होता है। मुख्य पाठ शब्द की वास्तविक व्यापकता बनाए रखता है और पादटिप्पणी संभावित संकीर्ण संदर्भ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘राज्य’, ‘सेवक’, ‘सौंपा’ और ‘लड़ रहे होते’ मूल की राजकीय, न्यायिक और कालगत बारीकियों को स्वाभाविक हिन्दी में व्यक्त करते हैं।
