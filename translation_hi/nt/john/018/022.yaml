    issue: ‘पहरेदारों’ is overly specific for ὑπηρέται.
    rationale: Ὑπηρέται can refer to attendants, servants, or official personnel. Although official temple personnel are likely in context, ‘guards’ is not stated by the Greek and unnecessarily resolves the term’s range.
  - severity: low
    issue: The opening temporal clause lacks ‘थे.’
    rationale: For standard, polished Hindi, ‘जब यीशु ये बातें कह चुके थे’ is grammatically complete and idiomatic.
