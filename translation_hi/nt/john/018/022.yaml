  terminology: ‘प्रधान याजक’ accurately renders ἀρχιερεύς. ‘सेवकों’ preserves the broad lexical range of ὑπηρέται better than ‘पहरेदारों’; a note clarifies the likely official setting without making that contextual inference part of the translated text. ‘थप्पड़’ is acceptable with a note preserving the wider sense of a hand-blow.
