  text: ταῦτα δὲ αὐτοῦ εἰπόντος εἷς ⸂παρεστηκὼς τῶν ὑπηρετῶν⸃ ἔδωκεν ῥάπισμα τῷ Ἰησοῦ εἰπών· Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/022.yaml
  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: hi
  text: जब यीशु ये बातें कह चुके थे, तब पास खड़े सेवकों[a] में से एक ने यीशु को थप्पड़ मारा[b] और कहा, “क्या तुम प्रधान याजक को इस तरह उत्तर देते हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सेवकों’ के लिए प्रयुक्त यूनानी शब्द का अर्थ परिचारक या अधिकारी भी हो सकता है; इस प्रसंग में यह सम्भवतः महायाजक के प्रतिष्ठान के आधिकारिक कर्मचारियों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी अभिव्यक्ति हाथ से किए गए प्रहार को दर्शाती है; इसका अनुवाद ‘हाथ से प्रहार किया’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα δὲ αὐτοῦ εἰπόντος
  choice: जब यीशु ये बातें कह चुके
  rationale: सम्बन्धवाचक कर्ता को हिन्दी में स्पष्ट करने के लिए ‘यीशु’ रखा गया है। ‘ये बातें’ यूनानी बहुवचन को बनाए रखता है, और ‘कह चुके’ पूर्ववर्ती पूर्ण क्रिया को स्वाभाविक ढंग से व्यक्त करता है। δέ को अलग शब्द से व्यक्त न करके वाक्यक्रम में समाहित किया गया है।
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: पास खड़े पहरेदारों में से एक
  rationale: παρεστηκώς उपस्थित होकर पास खड़े होने का भाव देता है। इस न्यायिक-मन्दिर-संबंधी प्रसंग में ὑπηρέται घरेलू सेवकों से अधिक आधिकारिक अधीनस्थ कर्मियों को सूचित करता है; ‘पहरेदार’ सामान्य पाठक के लिए स्वाभाविक है, यद्यपि पद का अर्थ परिचारक या सेवक भी हो सकता है।
- source_word: ἔδωκεν ῥάπισμα τῷ Ἰησοῦ
  choice: उन्हें थप्पड़ मारा
  rationale: ἔδωκεν ῥάπισμα का मुहावरा हाथ से मारे गए प्रहार को सूचित करता है। ‘थप्पड़ मारा’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है; ‘उन्हें’ निकटवर्ती यीशु की ओर संकेत करता है।
- source_word: εἰπών
  choice: और कहा
  rationale: सहगामी कृदन्त को हिन्दी की स्वाभाविक समन्वित क्रिया के रूप में व्यक्त किया गया है।
- source_word: Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
  choice: क्या तुम प्रधान याजक को इस तरह उत्तर देते हो?
  rationale: οὕτως रीति को सूचित करता है, इसलिए ‘इस तरह’ उपयुक्त है। वर्तमान क्रिया के प्रत्यक्ष उलाहने को ‘उत्तर देते हो’ बनाए रखता है। ἀρχιερεύς के लिए प्रचलित और सटीक पद ‘प्रधान याजक’ है।
theological_decisions:
- issue: ὑπηρετῶν की पहचान
  choice: पहरेदार
  alternative: परिचारक या सेवक
  rationale: यूहन्ना के गिरफ्तारी और पूछताछ वाले प्रसंग में यह शब्द महायाजकीय प्रतिष्ठान से जुड़े आधिकारिक अधीनस्थ कर्मियों के लिए प्रयुक्त प्रतीत होता है। फिर भी शब्द की व्यापक अर्थ-सीमा को सिद्धान्तगत निश्चितता में नहीं बदला गया है।
- issue: ῥάπισμα की प्रहार-विधि
  choice: थप्पड़
  alternative: हाथ का प्रहार या वैसा ही प्रहार
  rationale: शब्द सामान्यतः हाथ से मारे गए थप्पड़-सदृश प्रहार को बताता है, पर यह ठीक किस प्रकार मारा गया था, इसका अत्यधिक विशिष्ट वर्णन नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण कथात्मक शैली। प्रश्न में पहरेदार का कठोर उलाहना बनाए रखा गया है। ‘तुम’ यहाँ अपमानजनक ‘तू’ से बचते हुए यूनानी में सम्मानसूचक भेद के अभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
