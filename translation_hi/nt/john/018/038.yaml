language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: hi
  text: पीलातुस ने उससे कहा, “सत्य क्या है?” यह कहकर वह फिर बाहर यहूदियों[a] के पास गया और उनसे कहा, “मुझे उसके विरुद्ध कोई आरोप लगाने का आधार नहीं मिलता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदी नेताओं।” यूहन्ना के सुसमाचार में “यहूदी” कभी-कभी अधिक विशेष रूप से यहूदी अधिकारियों या तत्काल संदर्भ में यीशु का विरोध कर रहे प्रतिनिधि समूह के लिए प्रयुक्त हो सकता है।
    reason: संदर्भगत वैकल्पिक अर्थ को सुरक्षित रखना और इस पद को सभी यहूदियों पर लागू समझने से बचाना।
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: पिलातुस ने उससे कहा
  rationale: ऐतिहासिक वर्तमान λέγει को स्वाभाविक हिन्दी कथन-शैली में भूतकाल से व्यक्त किया गया है; αὐτῷ का सीधा अर्थ ‘उससे’ है।
- source_word: Τί ἐστιν ἀλήθεια;
  choice: सत्य क्या है?
  rationale: ἀλήθεια अनिश्चित और व्यापक रूप में है; ‘सत्य’ यूनानी की दार्शनिक खुलावट बनाए रखता है और ‘वह सत्य’ जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: Καὶ τοῦτο εἰπὼν
  choice: यह कहकर
  rationale: अओरिस्ट कृदन्त εἰπών से मुख्य क्रिया से पहले की क्रिया व्यक्त होती है; ‘यह कहकर’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: πάλιν ἐξῆλθεν
  choice: वह फिर बाहर ... गया
  rationale: πάλιν की पुनरावृत्ति ‘फिर’ से और ἐξῆλθεν की बाहर की ओर गति ‘बाहर गया’ से स्पष्ट होती है।
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: यहूदियों के पास
  rationale: मुख्य पाठ में Ἰουδαίους का सीधा जातीय-सामुदायिक पद रखा गया है; तत्काल संदर्भ में इसके अधिक सीमित अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: καὶ λέγει αὐτοῖς
  choice: और उनसे कहा
  rationale: दूसरे ऐतिहासिक वर्तमान λέγει को भी हिन्दी कथन की स्वाभाविक भूतकालीन शैली में रखा गया है।
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: मुझे उस पर कोई दोष लगाने का आधार नहीं मिलता
  rationale: न्यायिक संदर्भ में αἰτία आरोप या अभियोग के आधार को दर्शाता है। यह अनुवाद वैधानिक अर्थ को स्पष्ट रखता है और इसे केवल नैतिक ‘दोष’ तक सीमित नहीं करता।
theological_decisions:
- issue: यूहन्ना के दुःखभोग-वृत्तांत में Ἰουδαίοις का संदर्भ
  choice: मुख्य पाठ में ‘यहूदियों’ और स्पष्टीकरण के लिए पादटिप्पणी
  alternative: ‘यहूदी अगुओं’ अथवा ‘यहूदिया के लोगों’
  rationale: यूनानी पद का सीधा रूप मुख्य पाठ में रखा गया है, पर इस संदर्भ में वह समस्त यहूदी समुदाय के बजाय यीशु का विरोध कर रहे यहूदी अधिकारियों या उपस्थित प्रतिनिधि समूह को सूचित कर सकता है। पादटिप्पणी इस वास्तविक संदर्भगत अस्पष्टता को बनाए रखती है और व्यापक जातीय आरोप से बचाती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सत्य क्या है?’ मूल की संक्षिप्तता और खुली दार्शनिक ध्वनि बनाए रखता है। न्यायिक प्रसंग के कारण ‘दोष लगाने का आधार’ चुना गया है।
