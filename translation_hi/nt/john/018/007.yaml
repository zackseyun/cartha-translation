  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: hi
  text: इस पर उसने उनसे फिर पूछा, “तुम किसे ढूँढ़ रहे हो?” उन्होंने कहा, “यीशु नासरी को।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नासरत का यीशु”; यूनानी में “यीशु नासरी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: इसलिए ... फिर
  rationale: πάλιν पुनरावृत्ति को व्यक्त करता है, जबकि οὖν पिछले संवाद के परिणामस्वरूप आगे बढ़ती कथा को जोड़ता है। हिन्दी में यह क्रम स्वाभाविक और स्पष्ट है।
- source_word: ἐπηρώτησεν αὐτούς
  choice: उसने उनसे ... पूछा
  rationale: क्रिया यहाँ सीधे प्रश्न करने को बताती है; ‘पूछा’ आधुनिक हिन्दी में सहज है और अनावश्यक रूप से कठोर भाव नहीं जोड़ता।
- source_word: Τίνα ζητεῖτε
  choice: तुम किसे ढूँढ़ रहे हो?
  rationale: Τίνα कर्मवाचक प्रश्नवाचक सर्वनाम है और ζητεῖτε वर्तमान में किसी व्यक्ति को खोजने का भाव देता है। ‘किसे ढूँढ़ रहे हो’ स्वाभाविक हिन्दी है।
- source_word: οἱ δὲ εἶπαν
  choice: उन्होंने कहा
  rationale: δέ यहाँ मुख्यतः संवाद की अगली कड़ी को चिह्नित करता है; हिन्दी में अलग संयोजक के बिना कथन अधिक स्वाभाविक है।
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: नासरी यीशु को
  rationale: ‘नासरी’ Ναζωραῖος को एक पहचानसूचक विशेषण/उपाधि के रूप में बनाए रखता है और आधुनिक हिन्दी बाइबलीय प्रयोग में बोधगम्य है। ‘नासरत का यीशु’ स्थान-संबंधी अर्थ को अधिक स्पष्ट करता है, इसलिए उसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: Ναζωραῖος को यीशु की पहचानसूचक संज्ञा/विशेषण के रूप में प्रस्तुत करना
  choice: नासरी यीशु
  alternative: नासरत का यीशु
  rationale: मूल यूनानी में स्थाननाम के साथ संबंधकारक वाक्यांश नहीं, बल्कि Ναζωραῖος पद है। ‘नासरी’ उस रूप को बनाए रखता है और कोई अतिरिक्त सिद्धान्तगत अर्थ नहीं जोड़ता; सामान्य स्थान-संबंधी समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और संवादानुकूल रखी गई है। ‘तुम’ बहुवचन समूह को संबोधित करता है और प्रसंग में स्वाभाविक है।
