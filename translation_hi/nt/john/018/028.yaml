source:
  edition: SBLGNT
  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: hi
  text: तब वे यीशु को कैफा के यहाँ से राज्यपाल के मुख्यालय[a] ले गए। उस समय सुबह का आरंभिक समय था। वे स्वयं मुख्यालय के भीतर नहीं गए, ताकि वे अशुद्ध[b] न हो जाएँ, बल्कि फसह खा सकें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रेटोरियम’; अर्थात रोमी राज्यपाल का आधिकारिक निवास और न्यायिक मुख्यालय।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘अशुद्ध’ होने का अर्थ अनुष्ठानिक रूप से अशुद्ध हो जाना है।
    reason: cultural_note
  - marker: c
    text: ‘फसह खाना’ विशेष रूप से फसह के भोज को, या अधिक व्यापक रूप से फसह-पर्व के दौरान के भोजों को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγουσιν
  choice: ले गए
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथन में सामान्य भूतकाल से व्यक्त किया गया है; प्रसंग में यीशु को अभिरक्षा में एक स्थान से दूसरे स्थान ले जाना अभिप्रेत है।
- source_word: οὖν
  choice: तब
  rationale: यह कथा की अगली घटना को जोड़ता है। आधुनिक हिन्दी में ‘तब’ सहज है और संबंधसूचक बल बनाए रखता है।
- source_word: πραιτώριον
  choice: राज्यपाल का मुख्यालय
  rationale: यह रोमी राज्यपाल के आधिकारिक निवास और न्यायिक-प्रशासनिक केंद्र को सूचित करता है। अर्थानुवाद सामान्य पाठक के लिए केवल लिप्यंतरण से अधिक स्पष्ट है।
- source_word: πρωΐ
  choice: भोर हो चुकी थी
  rationale: शब्द दिन के आरंभिक समय को दर्शाता है। यह हिन्दी में स्वाभाविक है, यद्यपि किसी ठीक घड़ी का दावा नहीं करता।
- source_word: αὐτοὶ
  choice: वे स्वयं
  rationale: बलाघाती सर्वनाम को सुरक्षित रखा गया है, जिससे यीशु को भीतर ले जानेवालों और स्वयं भीतर न जानेवालों के बीच विरोध स्पष्ट रहता है।
- source_word: μιανθῶσιν
  choice: अशुद्ध न हो जाएँ
  rationale: प्रसंग में धार्मिक-अनुष्ठानिक अशुद्धता अभिप्रेत है। ‘अशुद्ध’ आधुनिक हिन्दी में स्पष्ट और संक्षिप्त है; पादटिप्पणी इसके सांस्कृतिक अर्थ को बताती है।
- source_word: φάγωσιν τὸ πάσχα
  choice: फसह खा सकें
  rationale: मूल की संक्षिप्त अभिव्यक्ति रखी गई है, ताकि यह विवाद अनिर्णीत रहे कि संकेत विशेष फसह-भोज की ओर है या पर्व के दौरान के व्यापक भोज/अनुष्ठानों की ओर।
- source_word: Καϊάφα
  choice: कैफा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: Ἰησοῦν
  choice: यीशु
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
theological_decisions:
- issue: यूहन्ना के दुःखभोग-वृत्तांत की कालक्रम-संबंधी चर्चा में ‘फसह खाना’ का आशय
  choice: मुख्य पाठ में ‘फसह खा सकें’ रखा गया है और उसके सटीक संदर्भ को खुला छोड़ा गया है।
  alternative: ‘फसह का भोज खा सकें’ अथवा ‘फसह-पर्व के भोज खा सकें’।
  rationale: मूल वाक्यांश शाब्दिक रूप से स्पष्ट है, पर उसका सीमित या व्यापक संदर्भ विवादित है। किसी कालक्रम-सामंजस्य को अनुवाद में आरोपित करने के बजाय मूल की तनावपूर्ण अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘राज्यपाल का मुख्यालय’ संस्थागत अर्थ स्पष्ट करता है; ‘प्रेटोरियम’ को पादटिप्पणी में दिया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
