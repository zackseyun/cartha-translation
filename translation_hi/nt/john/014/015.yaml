  yaml_path: translation/nt/john/014/015.yaml
  text: If you love me[a], you will keep my commandments.
translation:
  language: hi
  text: यदि तुम मुझसे प्रेम करते हो, तो मेरी आज्ञाओं का पालन करोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी आज्ञाओं को मानोगे।” यूनानी क्रिया का अर्थ किसी बात को बनाए रखना, उसकी रक्षा करना, उसका पालन करना या उसे मानना हो सकता है; “पालन” इस व्यापक अर्थ को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: यदि
  rationale: यह शब्द एक शर्त प्रस्तुत करता है। ‘यदि’ स्वाभाविक हिन्दी है और मूल में आवश्यक न होने वाली बार-बार होने की धारणा नहीं जोड़ता।
- source_word: ἀγαπᾶτέ με
  choice: तुम मुझसे प्रेम करते हो
  rationale: वर्तमान कर्तृवाच्य संभावनार्थक रूप को ἐάν के साथ हिन्दी में स्वाभाविक शर्तसूचक वाक्य के रूप में व्यक्त किया गया है। ‘मुझसे प्रेम’ आधुनिक हिन्दी में सहज प्रयोग है।
- source_word: τὰς ἐντολὰς τὰς ἐμὰς
  choice: मेरी आज्ञाओं
  rationale: ‘मेरी आज्ञाएँ’ यूनानी संज्ञा के अधिकारपूर्ण भाव और यीशु से उसके स्पष्ट संबंध को संक्षेप तथा स्वाभाविक ढंग से बनाए रखता है।
- source_word: τηρήσετε
  choice: पालन करोगे
  rationale: यह भविष्यत् कर्तृवाच्य निर्देशार्थक रूप है। ‘पालन करोगे’ उसके भविष्य कथन को बनाए रखता है और आज्ञाओं को थामे रखने, मानने तथा व्यवहार में पूरा करने के व्यापक अर्थ को व्यक्त करता है।
theological_decisions:
- issue: τηρήσετε को सीधी आज्ञा माना जाए या भविष्य का कथन
  choice: 'भविष्य का कथन: ‘पालन करोगे’'
  alternative: 'आज्ञार्थक भाव: ‘मेरी आज्ञाओं का पालन करो’'
  rationale: यूनानी रूप भविष्यत् निर्देशार्थक है, आज्ञार्थक नहीं। इसलिए अनुवाद उस तनाव को बनाए रखता है जिसमें यीशु से प्रेम उसकी आज्ञाओं के पालन में प्रकट होता है, इसे केवल एक सीधी आज्ञा में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। बहुवचन ‘तुम’ शिष्यों को किए गए संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है।
