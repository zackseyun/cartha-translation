  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: hi
  text: उस दिन तुम जानोगे कि मैं मेरे पिता में हूँ,[a] और तुम मुझमें हो, और मैं तुममें हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल यूनानी में तीनों संबंधों के लिए एक ही पूर्वसर्ग का प्रयोग हुआ है। ‘में’ अनुवाद उस भाषा को बनाए रखता है: यीशु पिता में हैं, शिष्य यीशु में हैं, और यीशु उनमें हैं; इसका अर्थ अधिक व्याख्या किए बिना।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: उस दिन
  rationale: यह पदबंध समय का बोध कराता है। ‘उस दिन’ स्वाभाविक आधुनिक हिन्दी है और ἐκείνῃ की निश्चितता को बनाए रखता है।
- source_word: γνώσεσθε ὑμεῖς
  choice: तुम जानोगे
  rationale: भविष्यकाल यहाँ शिष्यों को होने वाले ज्ञान या बोध की ओर संकेत करता है। ‘तुम जानोगे’ प्रक्रिया पर अनावश्यक बल दिए बिना इसका व्यापक अर्थ बनाए रखता है; ‘तुम’ स्पष्ट कर्ता को भी व्यक्त करता है।
- source_word: ὅτι
  choice: कि
  rationale: यह उस बात की विषयवस्तु का परिचय देता है जिसे शिष्य जानेंगे; यहाँ इसका अर्थ कारणसूचक ‘क्योंकि’ नहीं है।
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: मैं अपने पिता में हूँ
  rationale: ‘अपने पिता’ हिन्दी में कर्ता के साथ स्वाभाविक संबंधवाचक प्रयोग है और μου को सुरक्षित रखता है। ‘में’ को बनाए रखने से यूहन्ना की अंतर्निवास-संबंधी भाषा का अर्थ पहले से तय नहीं किया जाता।
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: और तुम मुझमें हो
  rationale: यूनानी का यह खंड क्रियारहित है; हिन्दी में स्वाभाविक वाक्य के लिए ‘हो’ जोड़ा गया है। ἐν का समान रूप से ‘में’ अनुवाद किया गया है।
- source_word: κἀγὼ ἐν ὑμῖν
  choice: और मैं तुममें हूँ
  rationale: κἀγώ का अर्थ ‘और मैं’ है। पारस्परिक भाषा और तीनों खंडों की समानता बनाए रखने के लिए यहाँ भी ‘में’ रखा गया है।
theological_decisions:
- issue: ἐν की पुनरावृत्ति और पारस्परिक अंतर्निवास की भाषा
  choice: 'तीनों संबंधों में ‘में’ रखा गया है: ‘मैं अपने पिता में… तुम मुझमें… मैं तुममें।’'
  alternative: ‘के साथ एक’, ‘से संयुक्त’ या ‘एकता में’ जैसे व्याख्यात्मक पदबंध
  rationale: मूल पाठ की भाषा संबंध, सहभागिता और अंतर्निवास के अर्थों से समृद्ध है। केवल ‘एकता’ या ‘संयुक्त’ कहना इसकी रूपकात्मक और धर्मवैज्ञानिक व्यापकता को समय से पहले सीमित कर देगा।
- issue: यीशु और पिता का संबंध
  choice: ‘मैं अपने पिता में हूँ’
  alternative: ‘मैं और पिता तत्व में एक हैं’ अथवा ‘मैं अपने पिता के साथ हूँ’
  rationale: चुना हुआ अनुवाद कथन की प्रबलता को न तो कम करता है, न बाद की धर्मसैद्धांतिक शब्दावली को सीधे पद में जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मुझमें’ और ‘तुममें’ मानक हिन्दी के संयुक्त रूप हैं। ‘अपने पिता’ संबंधवाचक सर्वनाम का स्वाभाविक हिन्दी प्रयोग है।
