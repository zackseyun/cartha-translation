id: JHN.14.10
reference: John 14:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: hi
  text: क्या तुम विश्वास नहीं करते कि मैं पिता में हूँ और पिता मुझ में हैं? जो बातें मैं तुमसे कहता हूँ, उन्हें मैं अपनी ओर से नहीं बोलता हूँ[a]; बल्कि पिता, जो मुझ में रहते हैं[b], अपने कार्य करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने अधिकार से नहीं बोलता हूँ।” “अपनी ओर से” का अर्थ अपनी पहल या अपने अधिकार से बोलना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मुझ में बने रहते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: विश्वास करते
  rationale: यूहन्ना के सुसमाचार में πιστεύω के बार-बार आने वाले प्रमुख शब्द-संबंध को बनाए रखने के लिए ‘विश्वास करना’ चुना गया; यहाँ एकवचन संबोधन का भाव प्रसंग से स्पष्ट है।
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: पिता में ... मुझ में
  rationale: परस्पर अंतर्वास की मूल स्थानवाचक भाषा को बिना ‘एक होना’ जैसे व्याख्यात्मक रूप में बदलते हुए सुरक्षित रखा गया है।
- source_word: τὰ ῥήματα
  choice: जो बातें
  rationale: संदर्भ में ῥήματα कही गई बातों को सूचित करता है; हिंदी में ‘जो बातें मैं तुमसे कहता हूँ’ अधिक स्वाभाविक है, जबकि ‘शब्द’ यहाँ अनावश्यक रूप से शब्दशः सुनाई देता।
- source_word: λέγω ... λαλῶ
  choice: कहता हूँ ... बोलता
  rationale: ग्रीक की दो भिन्न वाणी-संबंधी क्रियाओं के हल्के भेद को स्वाभाविक हिंदी में ‘कहना’ और ‘बोलना’ से दर्शाया गया है।
- source_word: ἀπ’ ἐμαυτοῦ
  choice: अपनी ओर से
  rationale: यह रूप स्रोत, पहल और अधिकार की संभावित छायाओं को खुला रखता है; ‘अपने अधिकार से’ कहने पर अर्थ आवश्यकता से अधिक सीमित हो जाता।
- source_word: μένων
  choice: बने रहते हैं
  rationale: वर्तमान कृदंत के निरंतर बने रहने के भाव को आधुनिक, सहज हिंदी में व्यक्त करता है; ‘वास करते हैं’ पारंपरिक विकल्प के रूप में पादटिप्पणी में दिया गया है।
- source_word: ποιεῖ τὰ ἔργα αὐτοῦ
  choice: अपने काम करते हैं
  rationale: αὐτοῦ के संबंध को हिंदी के निजवाचक ‘अपने’ से स्पष्ट किया गया और यूहन्ना की ἔργα शब्दावली के लिए सरल ‘काम’ रखा गया।
theological_decisions:
- issue: पिता और पुत्र का परस्पर अंतर्वास
  choice: ‘मैं पिता में हूँ और पिता मुझ में हैं’ की प्रत्यक्ष संबंधात्मक भाषा बनाए रखी गई।
  alternative: ‘मैं और पिता एक हैं’ अथवा ‘मैं पिता के साथ एकता में हूँ’
  rationale: मूल पद ‘में’ की परस्पर भाषा रखता है। इसे अन्य यूहन्नाई कथनों से मिलाकर या बाद की धर्मवैज्ञानिक शब्दावली से विस्तार देकर इसकी विशिष्ट अभिव्यक्ति को नहीं बदला गया।
- issue: यीशु की वाणी और पिता के कामों में कर्तृत्व
  choice: ‘मैं अपनी ओर से नहीं बोलता’ और ‘पिता ... अपने काम करते हैं’
  alternative: ‘मैं अपने अधिकार से नहीं बोलता’ अथवा ‘पिता मेरे द्वारा काम करते हैं’
  rationale: यह पिता और पुत्र की भिन्नता तथा मिशन में उनकी अविभाज्य एकता—दोनों को सुरक्षित रखता है। ‘अधिकार’ या ‘मेरे द्वारा’ जोड़ना मूल की वास्तविक किंतु व्यापक भाषा को संकुचित कर देता।
- issue: पिता के लिए हिंदी आदरसूचक क्रिया
  choice: ‘पिता ... हैं/करते हैं’
  alternative: व्याकरणिक एकवचन ‘पिता ... है/करता है’
  rationale: ग्रीक में कर्ता एकवचन है, पर मानक हिंदी में परमेश्वर पिता के लिए आदरसूचक बहुवचन क्रिया स्वाभाविक और गरिमापूर्ण है; इससे व्यक्तियों की संख्या के विषय में कोई धर्मवैज्ञानिक दावा नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण शैली। ‘तुम’ से मूल के सीधे संबोधन की निकटता रखी गई है। पिता के लिए आदरसूचक बहुवचन क्रियाएँ प्रयुक्त हुई हैं। पादटिप्पणी-चिह्न संबंधित पदबंधों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
