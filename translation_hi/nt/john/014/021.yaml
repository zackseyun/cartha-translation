language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: hi
  text: जिसके पास मेरी आज्ञाएँ हैं और जो उनका पालन करता है, वही मुझसे प्रेम करता है। और जो मुझसे प्रेम करता है, उससे मेरे पिता प्रेम करेंगे; और मैं भी उससे प्रेम करूँगा और अपने आप को उसे प्रकट करूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आप को उसे दिखाऊँगा।” यहाँ प्रयुक्त यूनानी क्रिया का अर्थ स्वयं को ज्ञात या प्रत्यक्ष करना भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἔχων
  choice: जिसके पास ... हैं
  rationale: संज्ञात्मक वर्तमान कृदन्त एक प्रतिनिधि व्यक्ति को सूचित करता है। यह हिन्दी संरचना उसके सामान्य और एकवचन बल को स्वाभाविक रूप से रखती है।
- source_word: ἐντολάς
  choice: आज्ञाएँ
  rationale: यह यीशु के वचनों के अधिकारपूर्ण स्वर को बनाए रखता है और यूहन्ना के प्रयोग के अनुरूप है।
- source_word: τηρῶν
  choice: पालन करता है
  rationale: τηρέω में सँभालकर रखने, मानने और निष्ठापूर्वक पालन करने का भाव है। आधुनिक हिन्दी में 'पालन करना' आज्ञाओं के साथ स्वाभाविक है, यद्यपि मूल के व्यापक भाव को पूरी तरह 'मानना' तक सीमित नहीं करता।
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: वही मुझसे प्रेम करता है
  rationale: ἐκεῖνος के बलाघात को 'वही' सुरक्षित रखता है और आज्ञाओं के पालन तथा प्रेम के बीच मूल पाठ की पहचानसूचक संरचना को बनाए रखता है।
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: प्रेम करता है / प्रेम करेगा / प्रेम करूँगा
  rationale: ἀγαπάω शब्द-समूह की जानबूझकर की गई पुनरावृत्ति को हर स्थान पर 'प्रेम' से रखा गया है। हिन्दी में सक्रिय रचना 'पिता प्रेम करेगा' स्वाभाविक है और यूनानी कर्मवाच्य का अर्थ सुरक्षित रखती है।
- source_word: ὁ δὲ ἀγαπῶν με
  choice: और जो मुझसे प्रेम करता है
  rationale: यहाँ δέ हल्का संयोजक है, प्रबल विरोधसूचक नहीं; अतः 'और' विचार की प्रगति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κἀγὼ
  choice: और मैं भी
  rationale: 'καὶ ἐγώ के योगात्मक बल को ''भी'' स्पष्ट करता है: पिता के प्रेम के साथ यीशु का प्रेम भी बताया गया है।'
- source_word: ἐμφανίσω ... ἐμαυτόν
  choice: अपने आप को ... प्रकट करूँगा
  rationale: ἐμφανίζω दृश्य रूप से दिखाने के साथ स्वयं को ज्ञात या प्रकट करने का अर्थ भी रखता है। प्रसंग में यह यीशु के व्यक्तिगत आत्म-प्रकटीकरण को खुला रखता है।
- source_word: αὐτὸν / αὐτῷ
  choice: उससे / उस पर
  rationale: यूनानी के प्रतिनिधिक पुल्लिंग एकवचन को हिन्दी के सामान्य एकवचन 'जो...उस' से रखा गया है; इससे वचन का आशय किसी भी ऐसे व्यक्ति पर लागू रहता है।
theological_decisions:
- issue: प्रेम और आज्ञापालन का संबंध
  choice: '''वही मुझसे प्रेम करता है'' द्वारा पहचानसूचक संबंध रखा गया'
  alternative: आज्ञापालन प्रेम को सिद्ध करता है; अथवा आज्ञापालन से परमेश्वर का प्रेम कमाया जाता है
  rationale: यूनानी वाक्य आज्ञाओं को रखने और उनका पालन करनेवाले की पहचान यीशु से प्रेम करनेवाले के रूप में करता है। अनुवाद न तो कारण जोड़ता है, न योग्यता अर्जित करने का सिद्धान्त।
- issue: यीशु के आत्म-प्रकटीकरण का स्वरूप
  choice: अपने आप को उस पर प्रकट करूँगा
  alternative: अपने आप को उसे दिखाऊँगा
  rationale: मूल क्रिया व्यक्तिगत रूप से ज्ञात होने या दृश्य रूप से दिखाई देने—दोनों की संभावना रखती है। 'प्रकट करूँगा' इसे केवल शारीरिक दर्शन तक सीमित नहीं करता।
- issue: प्रतिनिधिक एकवचन
  choice: जो...उससे...उस पर
  alternative: वे...उनसे; अथवा वह व्यक्ति
  rationale: यूनानी पुल्लिंग एकवचन प्रतिनिधिक है। हिन्दी की संबंधवाचक रचना बिना अनावश्यक लिंग-विशेष पर जोर दिए एकवचन और सार्वजनीन अनुप्रयोग दोनों सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। 'आज्ञाएँ', 'पालन', और 'प्रकट' जैसे प्रचलित बाइबलीय शब्द सामान्य पाठक के लिए बोधगम्य हैं। 'जिसके पास...और जो...' यूनानी की दो वर्तमान कृदन्तीय विशेषताओं को स्पष्ट रखता है; 'वही' मूल के बलाघात को व्यक्त करता है।
