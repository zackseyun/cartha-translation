    reason: textual_variant
lexical_decisions:
- source_word: ἐάν
  choice: यदि
  rationale: यह शर्तसूचक अव्यय है; आधुनिक मानक हिन्दी में ‘यदि’ प्रसंग के अनुरूप स्वाभाविक और गरिमापूर्ण है।
- source_word: τι
  choice: कुछ भी
  rationale: शर्तवाचक वाक्य में अनिश्चित सर्वनाम की खुली व्यापकता को ‘कुछ भी’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: αἰτήσητέ
  choice: माँगोगे
  rationale: ἐάν के साथ आए एओरिस्ट सब्जंक्टिव का हिन्दी शर्तवाचक वाक्य में भविष्यकालीन ‘माँगोगे’ सहज समतुल्य है और प्रार्थना या निवेदन का भाव बनाए रखता है।
- source_word: με
  choice: मुझसे
  rationale: SBLGNT के पाठ में प्रत्यक्ष कर्मवाचक सर्वनाम उपस्थित है। हिन्दी में ‘मुझसे माँगोगे’ उसी अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν τῷ ὀνόματί μου
  choice: मेरे नाम से
  rationale: यह प्रचलित यूहन्नाई अभिव्यक्ति यीशु के नाम, अधिकार और व्यक्ति के संबंध में माँगने को दर्शाती है। ‘मेरे नाम से’ हिन्दी में स्वाभाविक है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: ἐγὼ
  choice: मैं
  rationale: यूनानी में व्यक्त सर्वनाम पर कुछ बल है; हिन्दी का स्पष्ट ‘मैं’ इसे पर्याप्त रूप से बनाए रखता है।
- source_word: ποιήσω
  choice: उसे करूँगा
  rationale: भविष्यकालीन क्रिया को स्पष्ट करता है; ‘उसे’ पहले कही गई माँग की ओर संकेत करता है और हिन्दी वाक्य को पूर्ण तथा स्वाभाविक बनाता है।
theological_decisions:
- issue: यूहन्ना 14:14 में με (‘मुझसे/मुझे’) की उपस्थिति और निवेदन का सीधे यीशु से किया जाना
  choice: मुख्य पाठ में ‘मुझसे’ का अनुवाद किया गया है।
  alternative: यदि तुम मेरे नाम से कुछ भी माँगोगे, तो मैं उसे करूँगा।
  rationale: दिया गया SBLGNT पाठ με को सम्मिलित करता है, इसलिए मुख्य पाठ उसी को स्पष्ट रूप से दर्शाता है। चूँकि कुछ पांडुलिपियाँ इसे छोड़ देती हैं और इससे निवेदन किससे किया गया है, इस पर प्रभाव पड़ता है, वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘मेरे नाम से’ परिचित धार्मिक अभिव्यक्ति है, जबकि ‘मुझसे’ मूल पाठ के महत्वपूर्ण सर्वनाम को स्पष्ट रखता है।
