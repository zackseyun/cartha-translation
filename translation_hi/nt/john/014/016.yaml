  yaml_path: translation/nt/john/014/016.yaml
  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: hi
  text: और मैं पिता से अनुरोध करूँगा, और वह तुम्हें एक और सहायक[a] देगा, ताकि वह सदा तुम्हारे साथ रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी παράκλητος का अनुवाद ‘पक्षधर’, ‘परामर्शदाता’ या परंपरागत रूप से ‘सांत्वना देने वाला’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: और मैं
  rationale: καί + ἐγώ का संयोजन प्रसंग की कड़ी और हल्का बल दोनों व्यक्त करता है; ‘और मैं’ सहज रूप से इसे बनाए रखता है।
- source_word: ἐρωτήσω
  choice: विनती करूँगा
  rationale: यहाँ ἐρωτάω पिता से किए जाने वाले अनुरोध को दर्शाता है। ‘विनती करूँगा’ आधुनिक हिन्दी में आदरपूर्ण अनुरोध व्यक्त करता है और ‘प्रार्थना’ से उत्पन्न हो सकने वाला अतिरिक्त धार्मिक अर्थ नहीं जोड़ता।
- source_word: τὸν πατέρα
  choice: पिता से
  rationale: यूनानी में निश्चित पद है, पर ‘मेरे’ जैसा कोई स्वत्वसूचक शब्द नहीं; इसलिए केवल ‘पिता’ रखा गया है।
- source_word: ἄλλον
  choice: एक और
  rationale: ἄλλος पहले से उपस्थित किसी अन्य के संबंध में ‘दूसरा/एक और’ व्यक्त करता है; ‘एक और’ स्वाभाविक हिन्दी है और प्रकारगत समानता को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: παράκλητον
  choice: सहायक
  rationale: παράκλητος में सहायता, पक्ष-समर्थन, परामर्श और सांत्वना के अर्थ-संकेत हैं। ‘सहायक’ सामान्य आधुनिक हिन्दी में व्यक्तिगत भूमिका को स्पष्ट और व्यापक ढंग से व्यक्त करता है; अन्य संभावनाएँ पाद-टिप्पणी में दी गई हैं।
- source_word: δώσει ὑμῖν
  choice: वह तुम्हें ... देगा
  rationale: भविष्यकाल और अप्रत्यक्ष कर्म को स्वाभाविक हिन्दी वाक्य-विन्यास में रखा गया है।
- source_word: ἵνα ᾖ
  choice: ताकि वह ... रहे
  rationale: ἵνα के प्रयोजनात्मक भाव और वर्तमान संभावनार्थक ᾖ से सूचित निरंतर उपस्थिति को ‘ताकि ... रहे’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: μεθ’ ὑμῶν
  choice: तुम्हारे साथ
  rationale: μετά + संबंधकारक का सीधा अर्थ ‘साथ’ है; यह ‘तुम्हारे बीच’ की अपेक्षा अधिक सटीक है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यूहन्ना के प्रयोग में यह मुहावरा स्थायी, अनंत अवधि व्यक्त करता है; ‘सदा’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी है।
theological_decisions:
- issue: त्रित्व-संबंधी प्रसंग में παράκλητος का अनुवाद
  choice: सहायक
  alternative: पक्षधर; परामर्शदाता; सांत्वना देनेवाला
  rationale: ‘एक और’ के साथ प्रयुक्त यह पद एक व्यक्तिगत भूमिका को सूचित करता है। ‘सहायक’ अर्थ को किसी एक न्यायिक, परामर्शात्मक या सांत्वनात्मक कार्य तक सीमित नहीं करता। शब्द की बहुअर्थकता और व्याख्यात्मक महत्ता को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: ἵνα ᾖ में प्रयोजन और स्थायित्व
  choice: ताकि वह सदा तुम्हारे साथ रहे
  alternative: कि वह सदा तुम्हारे साथ रहेगा
  rationale: ‘ताकि ... रहे’ यूनानी के प्रयोजनात्मक ἵνα और संभावनार्थक क्रिया-रूप को सुरक्षित रखता है; इसे केवल सपाट भविष्यवाणी में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में प्रसंगानुसार बहुवचन ‘तुम’। भाषा सरल और गरिमापूर्ण रखी गई है। ‘सहायक’ को मुख्य पाठ में रखकर παράκλητος की वास्तविक अर्थ-व्याप्ति पाद-टिप्पणी में सुरक्षित की गई है।
