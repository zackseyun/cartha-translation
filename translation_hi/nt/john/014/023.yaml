source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: hi
  text: यीशु ने उसे उत्तर देकर कहा, “यदि कोई मुझसे प्रेम करता है, तो वह मेरे वचन का पालन करेगा[a]। मेरे पिता उससे प्रेम करेंगे, और हम उसके पास आएँगे और उसके साथ अपना निवास बनाएँगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी शिक्षा का पालन करेगा’ अथवा ‘मेरी कही हुई बात मानेगा।’
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके यहाँ अपना निवास बनाएँगे’ अथवा ‘उसके साथ अपना घर बनाएँगे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: उसे उत्तर दिया
  rationale: यूनानी के उत्तर देने और कहने वाले दोहरे कथन को स्वाभाविक हिन्दी में संक्षेपित किया गया है; ‘उसे’ αὐτῷ को स्पष्ट रखता है।
- source_word: Ἐάν τις
  choice: यदि कोई
  rationale: यह सामान्य और अनिश्चित शर्त को स्वाभाविक हिन्दी में व्यक्त करता है तथा दायरा सभी व्यक्तियों के लिए खुला रखता है।
- source_word: ἀγαπᾷ με
  choice: मुझसे प्रेम करता है
  rationale: ἀγαπάω का सीधा और प्रचलित हिन्दी रूप है; ‘से प्रेम करना’ हिन्दी की स्वाभाविक रचना है।
- source_word: τὸν λόγον μου
  choice: मेरे वचन
  rationale: ‘वचन’ λόγος की यूहन्नाई शब्दावली और यीशु के कहे हुए संदेश—दोनों की प्रतिध्वनि बनाए रखता है।
- source_word: τηρήσει
  choice: पालन करेगा
  rationale: यह प्रसंग में वचन को मानने और उसके अनुसार चलने का भाव स्पष्ट करता है; केवल सुरक्षित रखने का भौतिक अर्थ नहीं देता।
- source_word: ὁ πατήρ μου
  choice: मेरा पिता
  rationale: यीशु द्वारा परमेश्वर के लिए प्रयुक्त निकट संबंधसूचक पद को सीधे बनाए रखता है।
- source_word: ἀγαπήσει αὐτόν
  choice: उससे प्रेम करेगा
  rationale: पहले आए प्रेम-संबंधी क्रिया-पद के साथ शब्दगत संगति रखता है और हिन्दी में स्वाभाविक है।
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: हम उसके पास आएँगे
  rationale: πρός के व्यक्तिमुखी गमन और प्रथम पुरुष बहुवचन—दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: उसके साथ अपना निवास बनाएँगे
  rationale: μονή के निवास/ठहरने के अर्थ, παρά के संग-साथ के भाव और ποιέω की मुहावरेदार ‘बनाना’ रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘हम आएँगे’ और ‘निवास बनाएँगे’ में बहुवचन कर्ता
  choice: यीशु और पिता की संयुक्त क्रिया को स्पष्ट बहुवचन ‘हम’ से बनाए रखा गया है।
  alternative: बहुवचन को शैलीगत रूप से धुँधला कर केवल परमेश्वर की उपस्थिति कहना।
  rationale: यूनानी के ἐλευσόμεθα और ποιησόμεθα स्पष्ट प्रथम पुरुष बहुवचन हैं। अनुवाद पिता और यीशु के संयुक्त आगमन को रखता है, पर पाठ से आगे कोई सिद्धान्तगत व्याख्या नहीं जोड़ता।
- issue: τις और αὐτόν के सामान्य एकवचन संदर्भ
  choice: ‘कोई’, ‘वह’ और ‘उससे/उसके’ का प्रयोग।
  alternative: लिंगसूचक ‘कोई पुरुष’, ‘वह पुरुष’ या बहुवचन संरचना।
  rationale: हिन्दी के ये सर्वनाम स्वाभाविक रूप से लिंग-निरपेक्ष रह सकते हैं और यूनानी की सामान्य एकवचन संरचना को भी बनाए रखते हैं।
- issue: प्रेम और वचन-पालन का संबंध
  choice: 'शर्त और उसके परिणाम को ज्यों का त्यों रखा गया है: ‘यदि… तो…’।'
  alternative: इसे कारण, योग्यता या उद्धार की विधि के रूप में व्याख्यात्मक ढंग से विस्तृत करना।
  rationale: मूल पाठ शर्तात्मक संबंध व्यक्त करता है, पर उसके सिद्धान्तगत तंत्र की अतिरिक्त व्याख्या नहीं करता; अनुवाद उसी तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘वचन’ यूहन्ना की विशिष्ट धार्मिक-साहित्यिक शब्दावली को बनाए रखता है, जबकि ‘पालन करेगा’ उसके व्यावहारिक अर्थ को स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध पदों के बाद रखे गए हैं।
