  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: hi
  text: और तुम मेरे नाम से जो कुछ भी माँगोगे, उसे मैं करूँगा, ताकि पुत्र में पिता की महिमा हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: जो कुछ
  rationale: सापेक्ष-अनिश्चित रचना व्यापक और अनिश्चित अर्थ देती है; ‘जो कुछ’ आधुनिक हिन्दी में स्वाभाविक ढंग से ‘whatever’ का खुला दायरा बनाए रखता है।
- source_word: αἰτήσητε
  choice: तुम माँगोगे
  rationale: αἰτέω का सामान्य अर्थ ‘माँगना’ है और इस प्रार्थना-संबंधी संदर्भ में यही सहज है। क्रिया बहुवचन संबोधन को व्यक्त करती है; हिन्दी में ‘तुम’ के साथ बहुवचन क्रिया रखी गई है।
- source_word: ἐν τῷ ὀνόματί μου
  choice: मेरे नाम में
  rationale: शाब्दिक अभिव्यक्ति यीशु के साथ संबंध, प्रतिनिधित्व और अधिकार जैसे अर्थों की परतों को खुला रखती है; इसे केवल ‘मेरे अधिकार से’ जैसे एक अर्थ तक सीमित नहीं किया गया।
- source_word: τοῦτο
  choice: वह
  rationale: यूनानी संकेतवाचक सर्वनाम को हिन्दी में स्पष्ट रखा गया है। पूर्ववर्ती ‘जो कुछ’ के स्वाभाविक सहसंबंध में ‘वह’ उपयुक्त है।
- source_word: ποιήσω
  choice: मैं करूँगा
  rationale: ποιέω यहाँ व्यापक और सीधा है; ‘मैं करूँगा’ उसके भविष्यकालीन कथन और बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: ἵνα यहाँ उद्देश्य बताता है; आधुनिक हिन्दी में ‘ताकि’ इसे स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: δοξασθῇ
  choice: महिमित हो
  rationale: यह δοξάζω का कर्मवाच्य संभावनार्थक रूप है। ‘महिमित हो’ कर्मवाच्य और बाइबलीय ‘महिमा’ शब्दावली दोनों को बनाए रखता है।
- source_word: ὁ πατὴρ
  choice: पिता
  rationale: यूनानी में ‘पिता’ विशिष्ट ईश्वरीय संबोधन है; उसमें ‘मेरे’ नहीं जोड़ा गया। हिन्दी में इस पदवी के साथ अलग निश्चित उपपद आवश्यक नहीं है।
- source_word: ἐν τῷ υἱῷ
  choice: पुत्र में
  rationale: ἐν को ‘में’ रखकर उस वास्तविक अस्पष्टता को सुरक्षित रखा गया है जिसमें क्षेत्र, संबंध अथवा माध्यम का भाव हो सकता है; मुख्य पाठ में इसे केवल ‘के द्वारा’ तक सीमित नहीं किया गया।
theological_decisions:
- issue: ‘मेरे नाम में’ माँगने का अर्थ
  choice: मुख्य पाठ में ‘मेरे नाम में’ रखा गया।
  alternative: ‘मेरे अधिकार से’, ‘मेरे साथ एकता में’, या ‘मेरे चरित्र और इच्छा के अनुसार’।
  rationale: यूहन्ना के संदर्भ में इस वाक्यांश के कई परस्पर संबद्ध धार्मिक अर्थ हैं। शाब्दिक रूप उस समृद्धि को बचाता है और किसी एक व्याख्या को पाठ में आरोपित नहीं करता।
- issue: ἐν τῷ υἱῷ का आशय
  choice: ‘पुत्र में’ रखा गया।
  alternative: ‘पुत्र के द्वारा’।
  rationale: ἐν यहाँ क्षेत्र या माध्यम सहित संबंधित अर्थ दे सकता है। यूनानी किसी एक संकुचित अर्थ को अनिवार्य नहीं करता, इसलिए मुख्य पाठ निकटतर रूप रखता है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मेरे नाम में’ और ‘पुत्र में’ जैसे धार्मिक रूप से अर्थपूर्ण वाक्यांशों को व्याख्यात्मक विस्तार से नहीं बदला गया।
