  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: hi
  text: फ़िलिप्पुस ने उससे कहा, “प्रभु[a], हमें पिता को दिखा दीजिए, और वही हमारे लिए काफ़ी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “महोदय, हमें पिता को दिखा दीजिए, और वही हमारे लिए काफ़ी है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: ने कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथन-शैली में संवाद का परिचय सामान्यतः भूतकाल से स्वाभाविक रूप में दिया जाता है।
- source_word: αὐτῷ
  choice: उससे
  rationale: यह वचन के अप्रत्यक्ष कर्म को व्यक्त करता है; हिन्दी में ‘उससे कहा’ स्वाभाविक है।
- source_word: Φίλιππος
  choice: फ़िलिप्पुस
  rationale: यूनानी नाम का हिन्दी में निकट ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: Κύριε
  choice: प्रभु
  rationale: κύριος का संबोधन रूप है। यहाँ यीशु के प्रति आदर और यूहन्ना के मसीही आशय को बनाए रखने के लिए ‘प्रभु’ उपयुक्त है।
- source_word: δεῖξον
  choice: दिखा दीजिए
  rationale: प्रत्यक्ष अनुरोध को आधुनिक सम्मानसूचक हिन्दी में व्यक्त करता है; ‘प्रकट कीजिए’ की अपेक्षा दृश्य/ज्ञानात्मक दोनों संभावनाओं को अधिक सहजता से खुला रखता है।
- source_word: ἡμῖν τὸν πατέρα
  choice: हमें पिता को
  rationale: दत्तिव ἡμῖν को ‘हमें’ और निश्चित पदबंध τὸν πατέρα को परमेश्वर के विशिष्ट पितृ-संबोधन के रूप में ‘पिता’ किया गया है।
- source_word: καὶ ἀρκεῖ ἡμῖν
  choice: इतना ही हमारे लिए काफ़ी है
  rationale: ἀρκέω का वर्तमान अर्थ ‘पर्याप्त होना’ है। हिन्दी में यह रूप अनुरोध के अपेक्षित पर्याप्त परिणाम को स्पष्ट और सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: यीशु के लिए संबोधन κύριος
  choice: प्रभु
  alternative: महोदय / स्वामी
  rationale: ‘प्रभु’ इस प्रसंग में आदर और यूहन्ना के मसीह-संबंधी भार को सुरक्षित रखता है, जबकि ‘महोदय’ अर्थ को आवश्यकता से अधिक सामान्य कर देता है और ‘स्वामी’ आधुनिक हिन्दी में कम स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यीशु को संबोधित करते समय ‘दिखा दीजिए’ सम्मानसूचक है। ‘इतना ही’ यूनानी वाक्य के निहित संकेत—पिता को दिखाया जाना हमारे लिए पर्याप्त है—को स्वाभाविक हिन्दी में व्यक्त करता है।
