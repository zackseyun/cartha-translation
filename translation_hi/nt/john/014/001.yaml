id: JHN.14.1
reference: John 14:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Μὴ ταρασσέσθω ὑμῶν ἡ καρδία· πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: hi
  text: तुम्हारा मन व्याकुल न हो। परमेश्वर पर विश्वास रखो[a]; मुझ पर भी विश्वास रखो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम परमेश्वर पर विश्वास रखते हो; मुझ पर भी विश्वास रखो।” यूनानी शब्द πιστεύετε का रूप “तुम विश्वास रखते हो” और “विश्वास रखो”—दोनों अर्थ दे सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “परमेश्वर पर भरोसा रखो; मुझ पर भी भरोसा रखो।” यहाँ प्रयुक्त क्रिया विश्वास करने के साथ भरोसा रखने का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: व्याकुल न हो
  rationale: μή के साथ वर्तमान कर्मवाच्य आज्ञार्थक को स्वाभाविक हिन्दी निषेध के रूप में व्यक्त किया गया है। ‘व्याकुल’ यहाँ मन की अशांति और परेशानी को समेटता है, पर अर्थ को केवल भय या चिंता तक सीमित नहीं करता।
- source_word: ὑμῶν ἡ καρδία
  choice: तुम्हारा मन
  rationale: यूनानी में बहुवचन संबंधवाचक ὑμῶν के साथ एकवचन ἡ καρδία सामूहिक अर्थ देता है। आधुनिक हिन्दी में समूह को संबोधित करते हुए ‘तुम्हारा मन’ स्वाभाविक है; ‘मन’ यहाँ आंतरिक व्यक्ति के अर्थ में ‘हृदय’ से अधिक सहज है।
- source_word: πιστεύετε
  choice: विश्वास रखो
  rationale: πιστεύω विश्वास करने के साथ भरोसा रखने का भाव भी रखता है। εἰς के साथ ‘विश्वास रखो’ सम्बन्धपरक भरोसे को स्वाभाविक हिन्दी में व्यक्त करता है। रूप का विधानार्थक और आज्ञार्थक दोनों होना पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: εἰς τὸν θεόν
  choice: परमेश्वर पर
  rationale: πιστεύω के साथ εἰς लक्ष्य की ओर उन्मुख विश्वास या भरोसा व्यक्त करता है; हिन्दी में ‘परमेश्वर पर विश्वास’ इसका स्वाभाविक रूप है।
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: मुझ पर भी विश्वास रखो
  rationale: ‘भी’ καί की योगात्मक शक्ति को स्पष्ट करता है और परमेश्वर तथा यीशु पर विश्वास रखने के समानांतर आग्रह को बनाए रखता है।
theological_decisions:
- issue: πιστεύετε के दोनों प्रयोगों का विधानार्थक या आज्ञार्थक बल
  choice: 'दोनों को आज्ञार्थक रूप में: ‘परमेश्वर पर विश्वास रखो; मुझ पर भी विश्वास रखो।’'
  alternative: ‘तुम परमेश्वर पर विश्वास रखते हो; मुझ पर भी विश्वास रखो।’
  rationale: द्वितीय पुरुष बहुवचन वर्तमान विधानार्थक और आज्ञार्थक रूप वर्तनी में समान हैं, इसलिए वास्तविक व्याकरणिक अस्पष्टता है। प्रसंग में प्रारम्भिक निषेध के बाद दो समानांतर आज्ञाएँ स्वाभाविक हैं, किंतु विधानार्थक सम्भावना को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। शिष्यों के समूह के लिए आत्मीय बहुवचन ‘तुम्हारा/रखो’ प्रयुक्त है। सामूहिक एकवचन ‘मन’ मूल के ἡ καρδία को सुरक्षित रखता है।
