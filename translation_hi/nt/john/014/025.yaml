  text: I have spoken these things to you while staying with you[a].
translation:
  language: hi
  text: तुम्हारे साथ रहते हुए[a] मैंने तुमसे ये बातें कही हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे साथ बना रहते हुए”; यूनानी में यहाँ ‘रहना/बने रहना’ वाली क्रिया है, जिसका यूहन्ना के लेखन में बार-बार प्रयोग होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पद पहले कही गई शिक्षाओं की ओर संकेत करता है; ‘ये बातें’ उसके बहुवचन रूप को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: λελάληκα
  choice: कही हैं
  rationale: λαλέω के पूर्णकालिक रूप का हिन्दी में स्वाभाविक अनुवाद ‘कही हैं’ है, जो बीते हुए कथन और उसकी वर्तमान प्रासंगिकता दोनों को व्यक्त कर सकता है।
- source_word: ὑμῖν
  choice: तुमसे
  rationale: यह शिष्यों को संबोधित बहुवचन सर्वनाम है। आधुनिक हिन्दी में ‘तुमसे’ आत्मीय संबोधन को स्वाभाविक रूप से व्यक्त करता है; बहुवचन संदर्भ से स्पष्ट है।
- source_word: παρ’ ὑμῖν
  choice: तुम्हारे साथ
  rationale: παρά के साथ सम्प्रदान कारक यहाँ निकट उपस्थिति और संगति का भाव देता है; ‘तुम्हारे साथ’ सबसे स्वाभाविक हिन्दी है।
- source_word: μένων
  choice: रहते हुए
  rationale: वर्तमान कृदन्त का कालगत और निरंतरता-सूचक भाव बना रहता है। ‘रहना’ यूहन्ना में बार-बार आने वाले μένω के अर्थ से भी सीधा संबंध रखता है और हिन्दी में सहज है।
theological_decisions:
- issue: यूहन्ना में बार-बार आने वाले μένω की शब्दगत निरंतरता
  choice: रहते हुए
  alternative: जब मैं तुम्हारे साथ हूँ
  rationale: ‘रहते हुए’ यूनानी कृदन्त की संरचना और μένω के ‘रहना/बने रहना’ वाले मूल भाव को बनाए रखता है, बिना इस पद में अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े। वैकल्पिक वाक्य अधिक मुहावरेदार है, पर क्रिया की शब्दगत निरंतरता कुछ कम स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण है। हिन्दी में स्वाभाविक प्रवाह के लिए कृदन्तीय वाक्यांश को पहले रखा गया है। ‘तुम’ का रूप शिष्यों के प्रति निकट संबोधन और बहुवचन संदर्भ, दोनों के अनुकूल है।
