id: JHN.14.12
reference: John 14:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: hi
  text: 'मैं तुमसे सच-सच कहता हूँ: जो मुझ पर विश्वास करता है, वह भी वे काम करेगा जो मैं करता हूँ; और वह इनसे भी बड़े काम करेगा, क्योंकि मैं पिता के पास जा रहा हूँ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: दोहराए गए गंभीर और बलपूर्ण कथन को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: जो मुझ पर विश्वास करता है
  rationale: प्रतिनिधि एकवचन को सहज हिन्दी में व्यक्त करता है और यूहन्ना में πιστεύω εἰς के सामान्य अर्थ को सुरक्षित रखता है।
- source_word: τὰ ἔργα ἃ ἐγὼ ποιῶ
  choice: वे काम जो मैं करता हूँ
  rationale: ἔργα के व्यापक अर्थ को सरल और गरिमापूर्ण हिन्दी में रखता है तथा ποιῶ के साथ क्रियात्मक संगति बनाए रखता है।
- source_word: κἀκεῖνος ποιήσει
  choice: वह भी ... करेगा
  rationale: κἀκεῖνος में निहित विषयगत बल और καί का ‘भी’ अर्थ स्पष्ट करता है।
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: और वह इनसे भी बड़े काम करेगा
  rationale: पिछले खंड से निहित ‘काम’ को हिन्दी में दोहराना वाक्य को पूर्ण और स्वाभाविक बनाता है; ‘बड़े’ के अर्थ को जानबूझकर व्यापक छोड़ा गया है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यीशु के पिता के पास जाने और बड़े कामों के बीच यूनानी पाठ के कारणसूचक संबंध को स्पष्ट रखता है।
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: मैं पिता के पास जा रहा हूँ
  rationale: वर्तमान रूप की संदर्भगत निकट-भविष्य शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है और ‘पिता’ में अनावश्यक ‘मेरे’ नहीं जोड़ता।
theological_decisions:
- issue: ‘इनसे भी बड़े काम’ का आशय
  choice: 'कथन को व्यापक रखा गया है: विश्वास करने वाला यीशु के कामों से बड़े काम करेगा, और इसका आधार यीशु का पिता के पास जाना है।'
  alternative: इसे विस्तार, सामर्थ्य, उद्धार-इतिहास के महत्त्व, या आत्मा-सामर्थ्य प्राप्त कलीसिया की सेवकाई में से किसी एक अर्थ तक सीमित करना।
  rationale: पद स्वयं ‘बड़े’ होने का सटीक प्रकार नहीं बताता। इसलिए अनुवाद किसी एक धर्मवैज्ञानिक व्याख्या को पाठ में नहीं जोड़ता।
- issue: प्रतिनिधि एकवचन का लिंग
  choice: ‘जो ... करता है, वह’
  alternative: ‘जो कोई ... वे’ या अन्य बहुवचन/लिंग-निरपेक्ष रचना
  rationale: हिन्दी में पुल्लिंग एकवचन रूप सामान्य प्रतिनिधि अर्थ में स्वाभाविक है; इसका आशय किसी भी विश्वास करने वाले से है, केवल पुरुष से नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ‘कार्य’ की अपेक्षा ‘काम’ सामान्य पाठक के लिए अधिक स्वाभाविक है, जबकि यूहन्ना के ἔργα का व्यापक आशय बनाए रखता है।
