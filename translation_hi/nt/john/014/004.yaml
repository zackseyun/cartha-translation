lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक है और कथन को पिछले संदर्भ से सहज रूप से जोड़ता है।
- source_word: ὅπου
  choice: जहाँ
  rationale: यह स्थानसूचक क्रियाविशेषण है। हिंदी में ‘जहाँ… वहाँ का’ संरचना गंतव्य और मार्ग के संबंध को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἐγὼ
  choice: मैं
  rationale: स्पष्ट कर्तृवाचक सर्वनाम को रखा गया है; हिंदी वाक्य में यह यीशु को कर्ता के रूप में साफ़ पहचानता है।
- source_word: ὑπάγω
  choice: जा रहा हूँ
  rationale: वर्तमानकालीन गमन और निकट प्रस्थान—दोनों की छाया को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: οἴδατε
  choice: तुम जानते हो
  rationale: οἶδα का पूर्णकालिक रूप यहाँ वर्तमान अर्थ रखता है; ‘जानते हो’ उसका स्वाभाविक हिंदी समतुल्य है।
- source_word: τὴν ὁδόν
  choice: मार्ग
  rationale: ὁδός के लिए ‘मार्ग’ वर्तमान, गरिमापूर्ण और संदर्भानुकूल है; यह वास्तविक रास्ते तथा व्यापक अर्थ की संभाव्यता को खुला रखता है।
theological_decisions:
- issue: ‘जहाँ मैं जा रहा हूँ’ और ‘मार्ग’ के बीच वाक्यगत संबंध
  choice: जहाँ मैं जा रहा हूँ, वहाँ का मार्ग तुम जानते हो।
  alternative: और तुम उस जगह का मार्ग जानते हो जहाँ मैं जा रहा हूँ।
  rationale: यूनानी पाठ गंतव्य के संबंध में मार्ग जानने की बात करता है। ‘जहाँ… वहाँ का मार्ग’ हिंदी में इस संबंध को स्पष्ट करता है, पर अगले पद के आधार पर ‘मार्ग’ की पहचान को समय से पहले परिभाषित नहीं करता।
- issue: पाठांतर
  choice: मुख्य पाठ में SBLGNT का संक्षिप्त पाठ
  alternative: और तुम जानते हो कि मैं कहाँ जा रहा हूँ, और मार्ग भी जानते हो।
  rationale: विस्तृत पाठ कुछ पांडुलिपियों में मिलता है, पर दिए गए आलोचनात्मक यूनानी पाठ में नहीं; इसलिए उसे मुख्य पाठ में न लेकर पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन के लिए बहुवचन ‘तुम’ रखा गया है। शैली सहज और गरिमापूर्ण है। ‘रास्ता’ की अपेक्षा ‘मार्ग’ चुना गया है ताकि यूहन्ना 14 के संदर्भ में शब्द की अर्थ-व्याप्ति और साहित्यिक संगति बनी रहे।
