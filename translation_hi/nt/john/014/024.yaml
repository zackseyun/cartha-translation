  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: hi
  text: जो मुझसे प्रेम नहीं करता, वह मेरी बातों का पालन नहीं करता। और जो वचन तुम सुनते हो, वह मेरा नहीं, बल्कि मुझे भेजने वाले पिता का है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: जो मुझसे प्रेम नहीं करता
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत किसी भी ऐसे व्यक्ति को सामान्य रूप से दर्शाता है जिसकी पहचान यीशु से प्रेम न करने से होती है। हिंदी में यह रूप स्वाभाविक है और निरंतर भाव भी बनाए रखता है।
- source_word: τοὺς λόγους μου
  choice: मेरी बातों
  rationale: बहुवचन λόγους को बहुवचन में रखा गया है। संदर्भ में 'बातें' यीशु की कही हुई शिक्षाओं के लिए आधुनिक हिंदी में 'शब्दों' की अपेक्षा अधिक स्वाभाविक है।
- source_word: τηρεῖ
  choice: मानता
  rationale: यूहन्ना में τηρέω का अर्थ किसी वचन को थामे रखना और उसके अनुसार चलना है। 'मानता' आज की हिंदी में पालन/आज्ञाकारिता का भाव सहज रूप से व्यक्त करता है, जबकि 'रखता' यहाँ कृत्रिम लगता।
- source_word: ὁ λόγος
  choice: वचन
  rationale: एकवचन λόγος यहाँ यीशु की शिक्षा को एक समग्र संदेश के रूप में दर्शाता है। 'वचन' यूहन्ना के शब्दगत और विषयगत संबंध को बचाता है।
- source_word: ὃν ἀκούετε
  choice: जो वचन तुम सुनते हो
  rationale: वर्तमान काल का सीधा और स्वाभाविक हिंदी रूप है; स्रोत में न होने के कारण 'मुझसे' नहीं जोड़ा गया।
- source_word: οὐκ ἔστιν ἐμὸς
  choice: वह मेरा नहीं
  rationale: ἐμός का सीधा स्वामित्वसूचक रूप रखा गया है, जिससे कथन की वास्तविक तीक्ष्णता और अगले विरोध के साथ समानांतरता बनी रहती है।
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: बल्कि मुझे भेजने वाले पिता का है
  rationale: यूनानी संबंधकारक वचन के पिता से संबंध अथवा स्रोत को व्यक्त करता है। हिंदी में 'पिता का है' स्वाभाविक रूप से इस संबंध को रखता है और कृदंत को स्पष्टतः पिता से जोड़ता है।
- source_word: πέμψαντός
  choice: भेजने वाले
  rationale: यह हिंदी में संबंधवाचक कृदंत का स्वाभाविक रूप है और पिता को यीशु को भेजने वाले के रूप में पहचानता है।
theological_decisions:
- issue: यीशु की शिक्षा और पिता की शिक्षा का संबंध
  choice: '''वह मेरा नहीं, बल्कि मुझे भेजने वाले पिता का है''—इससे यीशु और पिता का भेद तथा वचन की एकता दोनों बने रहते हैं।'
  alternative: '''वह मेरी ओर से नहीं, बल्कि पिता की ओर से है'''
  rationale: मूल पाठ स्वामित्व और स्रोत के बीच अर्थगत तनाव रखता है। चुना हुआ रूप उस तनाव को स्पष्ट किए बिना मिटाता नहीं और न ही यह संकेत देता है कि यीशु अपने वचन या अधिकार से पल्ला झाड़ रहे हैं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। पहले बहुवचन λόγους के लिए 'बातों' और फिर एकवचन λόγος के लिए 'वचन' रखा गया है, ताकि संख्या का अंतर तथा समग्र संदेश का भाव दोनों सुनाई दें। सर्वनाम 'तुम' यूहन्ना के निकट संबोधन के अनुरूप है।
