source:
  edition: SBLGNT
  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: hi
  text: और यदि मैं जाकर तुम्हारे लिए जगह तैयार करूँ, तो मैं फिर आऊँगा[a][b] और तुम्हें अपने पास ले लूँगा, ताकि जहाँ मैं हूँ, वहाँ तुम भी रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं फिर आ रहा हूँ।” यूनानी में वर्तमान-रूप की क्रिया का प्रयोग भविष्य के अर्थ में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: व्याख्याएँ भिन्न हैं कि “मैं फिर आऊँगा” विशेष रूप से यीशु के अन्तिम पुनरागमन, पुनरुत्थान के बाद उनके दर्शनों, पवित्र आत्मा के आगमन, या इनमें से एक से अधिक अर्थों को समेटने वाली प्रतिज्ञा को संदर्भित करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: यदि मैं जाकर
  rationale: ἐάν के साथ aorist subjunctive भविष्य की शर्त व्यक्त करता है। ‘यदि मैं जाकर’ यूनानी वाक्य की शर्त और अगले क्रियापद से उसके निकट संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: तुम्हारे लिए जगह तैयार करूँ
  rationale: ἑτοιμάζω का अर्थ ‘तैयार करना’ और τόπος का सामान्य अर्थ ‘जगह’ है। अनुवाद इस जगह के स्वरूप को अनावश्यक रूप से नहीं खोलता।
- source_word: πάλιν ἔρχομαι
  choice: मैं फिर आ रहा हूँ
  rationale: ἔρχομαι वर्तमान-रूप में है, पर सन्दर्भ में भविष्य की ओर संकेत कर सकता है। ‘फिर आ रहा हूँ’ उसकी सजीव वर्तमान-रूप अभिव्यक्ति को रखता है; भविष्य-अर्थ को स्पष्ट करने वाला विकल्प पादटिप्पणी में दिया गया है।
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: तुम्हें अपने पास ले लूँगा
  rationale: यह वाक्यांश शिष्यों को यीशु की अपनी उपस्थिति में ले लेने का भाव देता है। ‘अपने पास ले लूँगा’ आधुनिक हिन्दी में स्वाभाविक है और संबंधपरक बल को सुरक्षित रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: ἵνα यहाँ उद्देश्य बताता है; ‘ताकि’ आधुनिक हिन्दी में इस प्रयोजन को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: जहाँ मैं हूँ
  rationale: स्पष्ट ἐγώ में बल है, पर हिन्दी में ‘मैं’ स्वयं पर्याप्त है; ‘मैं स्वयं’ जोड़ना अस्वाभाविक रूप से चिह्नित और अधिक व्याख्यात्मक होता।
- source_word: καὶ ὑμεῖς ἦτε
  choice: वहाँ तुम भी रहो
  rationale: ἵνα के बाद subjunctive ἦτε उद्देश्य का अंग है। ‘रहो’ इस उद्देश्यपरक भाव को बनाए रखता है, जबकि ‘रहोगे’ इसे केवल भविष्यवाणी बना देता। ‘भी’ καί को दर्शाता है और ‘वहाँ’ हिन्दी में स्थान-संबंध को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: πάλιν ἔρχομαι में यीशु के फिर आने का आशय
  choice: इसे भविष्य की ओर उन्मुख प्रतिज्ञा के रूप में ‘मैं फिर आ रहा हूँ’ अनूदित किया गया है, पर उसके ठीक समय या ढंग को निर्धारित नहीं किया गया।
  alternative: इसे केवल पुनरुत्थान के बाद के दर्शनों, पवित्र आत्मा के आगमन, या यीशु के अन्तिम पुनरागमन के लिए विशिष्ट मानना।
  rationale: पद यीशु की फिर से उपस्थिति और शिष्यों को अपने पास लेने की प्रतिज्ञा स्पष्ट करता है, लेकिन स्वयं यह तय नहीं करता कि कथन केवल किस एक घटना की ओर संकेत करता है। अनुवाद इस व्याख्यात्मक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष शैली रखी गई है। ‘तुम’ बहुवचन शिष्यों को संबोधित करता है। शर्तीय वाक्य को स्वाभाविक बनाने के लिए उत्तरवाक्य में ‘तो’ जोड़ा गया है। दोनों पादटिप्पणी-चिह्न संबंधित पदबंध ‘मैं फिर आ रहा हूँ’ के तुरंत बाद रखे गए हैं।
