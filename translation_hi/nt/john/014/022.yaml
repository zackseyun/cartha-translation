id: JHN.14.22
reference: John 14:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: hi
  text: यहूदा (इस्करियोती नहीं) ने उससे कहा, “प्रभु, ऐसा क्या हुआ है कि आप अपने आपको हमें प्रकट करने वाले हैं, संसार को नहीं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है; आधुनिक हिन्दी की कथात्मक शैली में भूतकाल ‘कहा’ अधिक स्वाभाविक है और अर्थ सुरक्षित रखता है।
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: यहूदा ने—वह इस्करियोती नहीं था—
  rationale: यह स्पष्टीकरण इस यहूदा को यहूदा इस्करियोती से अलग पहचानता है। ‘यहूदा’ प्रचलित हिन्दी रूप है।
- source_word: Κύριε
  choice: प्रभु
  rationale: सीधे संबोधन में यह सम्मानसूचक उपाधि और उसके धार्मिक अर्थ-भार, दोनों को बनाए रखता है।
- source_word: τί γέγονεν
  choice: ऐसा क्या हुआ है
  rationale: पूर्णकाल किसी घटित बात से बनी वर्तमान परिस्थिति का संकेत करता है; यह हिन्दी अभिव्यक्ति उस बदली हुई स्थिति पर प्रश्न को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ὅτι
  choice: कि
  rationale: 'यह प्रश्न में आगे आने वाली परिस्थिति या आशय को प्रस्तुत करता है: ऐसा क्या हुआ है कि यीशु ऐसा करने वाले हैं।'
- source_word: ἡμῖν
  choice: हम पर
  rationale: ἐμφανίζειν के साथ सम्प्रदान कारक आत्म-प्रकटीकरण के प्राप्तकर्ताओं को बताता है; ‘हम पर प्रकट करना’ स्वाभाविक और निकटार्थी हिन्दी है।
- source_word: μέλλεις
  choice: करने वाले हैं
  rationale: यह भावी अभिप्राय या निकट भविष्य को व्यक्त करता है, बिना तत्कालता को आवश्यकता से अधिक प्रबल किए।
- source_word: ἐμφανίζειν σεαυτόν
  choice: अपने आपको … प्रकट करने
  rationale: यह दृश्य या ज्ञात कराने तथा आत्मवाचक बल को सुरक्षित रखता है। ‘प्रकट करना’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: κόσμῳ
  choice: संसार पर
  rationale: ‘संसार’ यूहन्ना के विशिष्ट व्यापक शब्द को बनाए रखता है और इसे ‘अविश्वासी लोग’ कहकर व्याख्यात्मक रूप से सीमित नहीं करता।
theological_decisions:
- issue: यूहन्ना में κόσμος का अर्थ-क्षेत्र
  choice: संसार
  alternative: सामान्य मानवजाति / परमेश्वर से विमुख संसार-व्यवस्था
  rationale: इस पद में शब्द के सभी धार्मिक संकेतों को किसी एक व्याख्या में सीमित नहीं करना चाहिए। ‘संसार’ व्यापकता और मूल तनाव को बनाए रखता है।
- issue: यीशु के आत्म-प्रकटीकरण का स्वरूप
  choice: अपने आपको … प्रकट करने
  alternative: अपने आपको … ज्ञात कराने
  rationale: ἐμφανίζω दृश्य होने और ज्ञात होने, दोनों की ओर संकेत कर सकता है। मुख्य पाठ में ‘प्रकट’ इस बहुअर्थता को पर्याप्त रूप से बनाए रखता है, इसलिए व्याख्यात्मक विस्तार नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरसूचक ‘आप’ के साथ स्वाभाविक, गरिमापूर्ण कथात्मक शैली। यूनानी प्रश्न की संरचना और ‘हम/संसार’ का विरोध स्पष्ट रखा गया है। अंग्रेज़ी परामर्श-पाठ में दिए फुटनोट चिह्न अर्थतः असंगत स्थानों पर दिखते हैं; मूल यूनानी के आधार पर इस हिन्दी पद में अलग फुटनोट आवश्यक नहीं समझा गया।
