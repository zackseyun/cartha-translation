id: JHN.14.28
reference: John 14:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: hi
  text: तुमने सुना कि मैंने तुमसे कहा था, “मैं जा रहा हूँ और तुम्हारे पास आ रहा हूँ।” यदि तुम मुझसे प्रेम करते, तो तुम इस बात से आनन्दित हुए होते[a] कि मैं पिता के पास जा रहा हूँ, क्योंकि पिता मुझसे बड़ा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो तुम आनन्दित होते।” यूनानी रचना को अधिक सामान्य अर्थ में भी व्यक्त किया जा सकता है, पर सन्दर्भ में तथ्य-विपरीत शर्त के लिए “आनन्दित हुए होते” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: “पिता मुझसे बड़ा है” का अनुवाद ठीक उसी प्रकार किया गया है जैसा मूल पाठ में लिखा है; इसमें “भूमिका में” या “पद में” जैसी कोई व्याख्यात्मक सीमा नहीं जोड़ी गई है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: तुमने सुना
  rationale: अओरिस्ट सूचक रूप यीशु की पहले कही हुई बात को शिष्यों द्वारा सुन लेने की ओर संकेत करता है; हिन्दी में सामान्य भूतकाल स्वाभाविक है।
- source_word: Ὑπάγω
  choice: मैं जा रहा हूँ
  rationale: वर्तमान काल यहाँ निकट भविष्य में प्रस्थान का भाव रखता है। यह हिन्दी अभिव्यक्ति उस आसन्न गति को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: तुम्हारे पास आ रहा हूँ
  rationale: यूनानी वर्तमान रूप की जीवंतता और भविष्याभिमुख अर्थ, दोनों को बनाए रखता है।
- source_word: εἰ ἠγαπᾶτέ με
  choice: यदि तुम मुझसे प्रेम करते
  rationale: अपूर्ण भूतकाल का रूप एक तथ्य-विपरीत शर्त बनाता है; हिन्दी में यह सशर्त प्रयोग उसका स्वाभाविक समतुल्य है।
- source_word: ἐχάρητε ἄν
  choice: आनन्दित हुए होते
  rationale: ἄν के साथ अओरिस्ट सूचक रूप उस प्रतिक्रिया को व्यक्त करता है जो शर्त पूरी होने पर घटित हुई होती।
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: मैं पिता के पास जा रहा हूँ
  rationale: πορεύομαι जाने अथवा प्रस्थान करने पर बल देता है; यह चयन गंतव्य और संबंधपरक शीर्षक ‘पिता’ दोनों को स्पष्ट रखता है।
- source_word: πατέρα / πατὴρ
  choice: पिता
  rationale: दोनों स्थानों पर यूनानी पाठ में स्पष्ट स्वत्ववाचक ‘मेरे’ नहीं है। हिन्दी में ‘पिता’ शीर्षक के रूप में स्वाभाविक है और मूल शब्दांकन को बनाए रखता है।
- source_word: μείζων μού
  choice: मुझसे बड़ा
  rationale: यह तुलनात्मक वाक्यांश का सीधा और स्वाभाविक हिन्दी समतुल्य है; इसमें भूमिका, पद या अवस्था जैसी कोई व्याख्यात्मक सीमा नहीं जोड़ी गई।
theological_decisions:
- issue: ‘पिता मुझसे बड़ा है’ का त्रिएकता और मसीह के व्यक्तित्व से संबंध
  choice: मुख्य पाठ में तुलनात्मक कथन ‘पिता मुझसे बड़ा है’ को बिना किसी व्याख्यात्मक विशेषण के रखा गया है।
  alternative: ‘पिता पद में मुझसे बड़ा है’ अथवा ‘मेरी देहधारी अवस्था में पिता मुझसे बड़ा है।’
  rationale: यूनानी पाठ तुलना को सीधे कहता है, पर यह नहीं बताता कि ‘बड़ा’ किस विशिष्ट अर्थ में है। अनुवाद को इस वास्तविक धर्मवैज्ञानिक तनाव को बनाए रखना चाहिए, न कि किसी पक्ष की व्याख्या मुख्य पाठ में जोड़नी चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आनन्दित हुए होते’ कुछ औपचारिक है, किन्तु तथ्य-विपरीत शर्त का कालगत भाव सुरक्षित रखने के लिए उपयुक्त है। उद्धरण के भीतर वर्तमान-कालीन गतिशील अभिव्यक्तियाँ यूनानी की जीवंतता बनाए रखती हैं।
