  text: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν, ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: hi
  text: अब मैं तुमसे और बहुत बातें नहीं करूँगा, क्योंकि संसार का शासक[a] आ रहा है; और मुझमें उसका कुछ भी नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में केवल ‘संसार का शासक’ है; कुछ अनुवाद यूहन्ना की मिलती-जुलती अभिव्यक्तियों के अनुसार ‘इस संसार का शासक’ कहते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'अर्थ यह भी व्यक्त किया जा सकता है: ‘उसका मुझ पर कोई दावा नहीं है’ या ‘उसकी मुझ पर कोई पकड़ नहीं है।’ यूनानी में शाब्दिक रूप से है, ‘मुझमें उसका कुछ भी नहीं है।’'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν
  choice: अब मैं तुमसे और बहुत बातें नहीं करूँगा
  rationale: οὐκέτι भविष्य में अब से आगे होने वाली समाप्ति दर्शाता है; πολλὰ यहाँ क्रियाविशेषण-सदृश है। हिन्दी में यह वाक्यांश स्वाभाविक ढंग से ‘अब...और बहुत बातें नहीं करूँगा’ बनता है।
- source_word: ἔρχεται
  choice: आ रहा है
  rationale: वर्तमान काल यहाँ निकट भविष्य और आसन्न आगमन का भाव देता है।
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: संसार का शासक
  rationale: ἄρχων के लिए ‘शासक’ आधुनिक और स्पष्ट है। यूनानी पाठ में ‘इस’ नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἐν ἐμοὶ οὐκ ἔχει οὐδέν
  choice: मुझमें उसका कुछ भी नहीं है
  rationale: यह यूनानी की संक्षिप्त और अर्थगर्भित अभिव्यक्ति के निकट है तथा ‘दावा’, ‘पकड़’ या ‘अधिकार’ में से किसी एक अर्थ को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करती।
theological_decisions:
- issue: ‘संसार का शासक’ की पहचान
  choice: उपाधि को ज्यों का त्यों रखते हुए ‘संसार का शासक’
  alternative: मुख्य पाठ में ‘शैतान’
  rationale: यूहन्ना के संदर्भ में संकेत शैतान की ओर है, पर यूनानी पाठ नाम के बजाय उपाधि देता है; इसलिए पहचान को अनुवाद में स्पष्ट करके नहीं थोपा गया।
- issue: ‘मुझमें उसका कुछ भी नहीं है’ का आशय
  choice: मूल रूपक और उसकी व्यापकता को सुरक्षित रखना
  alternative: ‘उसका मुझ पर कोई दावा/पकड़/अधिकार नहीं है’
  rationale: वाक्यांश संभवतः किसी वैध दावे, पकड़, आधार या साझा तत्व के पूर्ण अभाव को दर्शाता है। शाब्दिक-सहज रूप इन संभावनाओं में से किसी एक को अकेला अर्थ नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘बातें नहीं करूँगा’ ने λαλέω और क्रियाविशेषण-सदृश πολλὰ को स्वाभाविक हिन्दी में व्यक्त किया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में स्पष्ट रूप से दिए गए हैं।
