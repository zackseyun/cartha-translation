id: JHN.14.17
reference: John 14:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: hi
  text: सत्य का आत्मा, जिसे संसार ग्रहण नहीं कर सकता, क्योंकि वह न तो उसे देखता है और न उसे जानता है। तुम उसे जानते हो, क्योंकि वह तुम्हारे साथ रहता है और तुम्हारे भीतर रहेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे बीच रहेगा।” बहुवचन “तुम” के साथ यूनानी वाक्यांश का सामूहिक अर्थ भी संभव है, यद्यपि “तुम्हारे भीतर” पहले आए “तुम्हारे साथ” से भेद को अधिक स्पष्ट रूप से बनाए रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: सत्य का आत्मा
  rationale: यूहन्ना के स्थापित पदबंध और यूनानी संबंधकारक रचना को बनाए रखता है। यहाँ प्रसंग पवित्र आत्मा की ओर संकेत करता है; इसलिए ‘आत्मा’ को व्यक्तिगत कर्ता के रूप में रखा गया है।
- source_word: ὁ κόσμος
  choice: संसार
  rationale: यूहन्ना के व्यापक और बहुअर्थी κόσμος को किसी संकीर्ण व्याख्या, जैसे केवल ‘मानवजाति’ या ‘दुष्ट व्यवस्था’, में सीमित नहीं करता।
- source_word: οὐ δύναται λαβεῖν
  choice: ग्रहण नहीं कर सकता
  rationale: δύναται की असमर्थता और λαβεῖν के ‘ग्रहण करने’ के अर्थ—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: θεωρεῖ
  choice: देखता
  rationale: प्रत्यक्ष देखने के मूल अर्थ को सरल आधुनिक हिन्दी में रखता है; ‘पहचानता’ या ‘समझता’ कहना अर्थ को अनावश्यक रूप से निश्चित कर देता।
- source_word: γινώσκει / γινώσκετε
  choice: जानता / जानते
  rationale: संसार के न जानने और शिष्यों के जानने के बीच यूनानी शब्दगत समानता और विरोध को बनाए रखता है।
- source_word: παρ’ ὑμῖν μένει
  choice: तुम्हारे साथ रहता है
  rationale: παρά के साथ होने और μένω के टिके/बने रहने के भाव को वर्तमान, सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν ὑμῖν ἔσται
  choice: तुम्हारे भीतर रहेगा
  rationale: ἐν का प्राथमिक आंतरिक अर्थ तथा ἔσται का भविष्यकाल बनाए रखता है और पिछले ‘तुम्हारे साथ’ से भेद स्पष्ट करता है।
theological_decisions:
- issue: व्याकरणतः नपुंसकलिंग πνεῦμα के व्यक्तिगत संदर्भ का हिन्दी में निरूपण
  choice: आत्मा के लिए व्यक्तिगत ‘जिसे/उसे/वह’ रूपों का प्रयोग
  alternative: संदर्भ को निर्जीव या अवैयक्तिक शक्ति की तरह व्यक्त करना
  rationale: यूनानी में नपुंसकलिंग रूप πνεῦμα के व्याकरण के अनुसार हैं, पर निकट प्रसंग में संदर्भ व्यक्तिगत सहायक, पवित्र आत्मा, का है। हिन्दी के स्वाभाविक व्यक्तिगत रूप इस संदर्भ को व्यक्त करते हैं, बिना पाठ से आगे कोई अतिरिक्त सिद्धान्त जोड़ने के।
- issue: ‘तुम्हारे साथ’ और ‘तुम्हारे भीतर’ के बीच संबंध
  choice: दोनों भिन्न पूर्वसर्गीय अभिव्यक्तियों को अलग-अलग बनाए रखना
  alternative: दोनों को सामान्य उपस्थिति, जैसे केवल ‘तुम्हारे साथ’ या ‘तुम्हारे बीच’, के रूप में समतल कर देना
  rationale: यूनानी παρά और ἐν का भेद रखता है। अनुवाद इस पाठगत प्रगति और धर्मवैज्ञानिक तनाव को स्वयं हल किए बिना सुरक्षित रखता है; सामूहिक अर्थ की संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक पठन के योग्य रूप। ‘ग्रहण’ और ‘सत्य का आत्मा’ जैसे परिचित बाइबलीय पदबंध रखे गए हैं, जबकि पुरातन या अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
