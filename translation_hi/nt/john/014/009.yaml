id: JHN.14.9
reference: John 14:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: hi
  text: यीशु ने उससे कहा, “फिलिप्पुस, मैं इतने समय से[a] तुम लोगों के साथ हूँ, फिर भी तुमने मुझे अब तक नहीं जाना? जिसने मुझे देखा है, उसने पिता को देखा है। तुम कैसे कह सकते हो, ‘हमें पिता को दिखाइए’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इतने लंबे समय से।”
    reason: Τοσούτῳ χρόνῳ के लिए एक स्वाभाविक वैकल्पिक हिन्दी अभिव्यक्ति।
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: इतने समय से
  rationale: यह पदबंध अवधि की लंबाई व्यक्त करता है। ‘इतने समय से’ स्वाभाविक हिन्दी है और यीशु के प्रश्न की विस्मय तथा उलाहने की ध्वनि बनाए रखता है।
- source_word: μεθ’ ὑμῶν εἰμι
  choice: मैं … तुम लोगों के साथ हूँ
  rationale: वर्तमान काल की क्रिया ऐसी उपस्थिति बताती है जो पहले से अब तक जारी है। ‘तुम लोगों’ से यूनानी बहुवचन ὑμῶν और आगे फिलिप्पुस के लिए प्रयुक्त एकवचन के बीच का भेद सुरक्षित रहता है।
- source_word: οὐκ ἔγνωκάς με
  choice: फिर भी तुमने मुझे अब तक नहीं जाना
  rationale: पूर्णकाल पूर्व अवसरों के बावजूद वर्तमान तक न जानने की स्थिति व्यक्त करता है। ‘अब तक’ उस निरंतर परिणाम को और ‘फिर भी’ प्रसंग में καὶ की विरोधात्मक शक्ति को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: Φίλιππε
  choice: फिलिप्पुस
  rationale: यूनानी संबोधन रूप में आए नाम Φίλιππος का प्रचलित हिन्दी लिप्यंतरण।
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: जिसने मुझे देखा है
  rationale: संज्ञा के समान प्रयुक्त पूर्णकालिक कृदंत को समावेशी और स्वाभाविक हिन्दी संबंधवाचक रचना में व्यक्त किया गया है।
- source_word: ἑώρακεν τὸν πατέρα
  choice: उसने पिता को देखा है
  rationale: यूनानी पाठ के ‘पिता’ को बिना ‘मेरे’ जोड़े सीधे रखा गया है और पूर्णकाल का प्रभाव सुरक्षित है।
- source_word: πῶς σὺ λέγεις
  choice: तुम कैसे कह सकते हो
  rationale: πῶς यहाँ साधारण रीति नहीं पूछता, बल्कि आश्चर्य और आपत्ति व्यक्त करने वाला आलंकारिक प्रश्न है।
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: हमें पिता को दिखाइए
  rationale: δείκνυμι के आज्ञार्थक रूप का सीधा अर्थ ‘दिखाना’ है। ‘दिखाइए’ उद्धृत अनुरोध के सम्मानसूचक स्वर को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: यीशु को देखने और पिता को देखने का संबंध
  choice: ‘जिसने मुझे देखा है, उसने पिता को देखा है’ कथन को उसकी पूरी प्रत्यक्ष शक्ति के साथ रखा गया है।
  alternative: इसे कमजोर करके ‘उसने देख लिया है कि पिता कैसे हैं’ कहना, या बाद की धर्मसैद्धांतिक शब्दावली जोड़कर इसका विस्तार करना।
  rationale: यूनानी पाठ एक प्रबल मसीह-संबंधी दावा करता है। अनुवाद को न तो इसे केवल समानता या प्रतिनिधित्व तक सीमित करना चाहिए, न पद में अनुपस्थित धर्मसैद्धांतिक व्याख्या जोड़नी चाहिए।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। ‘तुम लोगों’ और ‘तुम’ द्वारा मूल के बहुवचन तथा एकवचन का महत्वपूर्ण अंतर स्पष्ट रखा गया है; संबोधन ‘फिलिप्पुस’ को प्रश्न के आरंभ में रखकर हिन्दी प्रवाह स्वाभाविक बनाया गया है।
