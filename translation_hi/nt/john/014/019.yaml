id: JHN.14.19
reference: John 14:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: hi
  text: अब बस थोड़ी देर और—फिर संसार मुझे नहीं देखेगा, पर तुम मुझे देखोगे[a]। क्योंकि मैं जीवित हूँ, तुम भी जीवित रहोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों जगह ‘देखना’ के लिए प्रयुक्त यूनानी क्रिया ध्यान से देखने, निहारने या पहचानकर देखने का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘तुम भी जीवित रहोगे’ यीशु के पुनरुत्थान-जीवन में शिष्यों की सहभागिता, उसके साथ एकता में आत्मिक जीवन, भावी पुनरुत्थान, या इन अर्थों के मेल की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: अब बस थोड़ी देर और
  rationale: यह स्वाभाविक हिन्दी में निकट भविष्य से पहले बची हुई थोड़ी अवधि को व्यक्त करता है।
- source_word: ὁ κόσμος
  choice: संसार
  rationale: यूहन्ना में यह स्थापित और व्यापक पद है; इसे केवल किसी विशेष मानव-समूह या व्यवस्था तक सीमित नहीं किया गया।
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: नहीं देखेगा / देखोगे
  rationale: कालगत संदर्भ के अनुसार हिन्दी में भविष्यकाल स्वाभाविक है। ‘देखना’ दोनों प्रयोगों को सरल रखते हुए यूनानी क्रिया के व्यापक भाव को पादटिप्पणी में सुरक्षित रखता है।
- source_word: οὐκέτι
  choice: फिर ... नहीं
  rationale: ‘थोड़ी देर और’ के साथ यह हिन्दी में उस निकट बिंदु के बाद देखना समाप्त हो जाने का स्वाभाविक संकेत देता है।
- source_word: δὲ
  choice: पर
  rationale: संसार और शिष्यों के बीच स्पष्ट विरोध प्रकट करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यीशु के जीवित होने और शिष्यों के भावी जीवन के बीच कारणात्मक संबंध को स्पष्ट करता है।
- source_word: ἐγὼ ζῶ
  choice: मैं जीवित हूँ
  rationale: यूनानी वर्तमानकाल को बनाए रखता है और यीशु के जीवित होने के कथन को बिना अतिरिक्त व्याख्या के प्रस्तुत करता है।
- source_word: καὶ ὑμεῖς ζήσετε
  choice: तुम भी जीवित रहोगे
  rationale: ‘भी’ καί को और भविष्यकाल ‘रहोगे’ ζήσετε को व्यक्त करता है; जीवन के स्वरूप को जानबूझकर व्यापक रखा गया है।
theological_decisions:
- issue: शिष्यों द्वारा यीशु को ‘देखने’ का आशय
  choice: सरल और व्यापक ‘देखोगे’ रखा गया है।
  alternative: इसे केवल पुनरुत्थान के बाद प्रत्यक्ष दर्शन, विश्वास द्वारा आत्मिक पहचान, अथवा अंतिम समय के दर्शन के रूप में स्पष्ट करना।
  rationale: यूनानी कथन इन संभावित अर्थ-स्तरों में से किसी एक को स्पष्ट रूप से सीमित नहीं करता; अनुवाद उसकी बहुस्तरीयता बनाए रखता है।
- issue: ‘तुम भी जीवित रहोगे’ का आशय
  choice: जीवन को बिना संकुचित किए ‘जीवित रहोगे’ कहा गया है।
  alternative: इसे केवल आत्मिक जीवन, यीशु के पुनरुत्थान-जीवन में सहभागिता, अथवा भावी शारीरिक पुनरुत्थान कहना।
  rationale: ζήσετε का कथन यूहन्ना के व्यापक जीवन-विषय से जुड़ा है और वर्तमान आत्मिक सहभागिता तथा भावी पुनरुत्थान—दोनों की प्रतिध्वनि रख सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरंभ का विराम-चिह्न निकट आने वाले परिवर्तन को स्वाभाविक हिन्दी लय में व्यक्त करता है; मूल की धार्मिक बहुअर्थकता को मुख्य पाठ में नहीं सुलझाया गया।
