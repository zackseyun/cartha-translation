id: JHN.14.11
reference: John 14:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πιστεύετέ μοι ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί· εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ ⸀πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
translation:
  language: hi
  text: मेरी बात मानो कि मैं पिता में हूँ और पिता मुझ में है; पर यदि नहीं, तो स्वयं उन कामों के कारण विश्वास करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में अंतिम ‘विश्वास करो’ का कोई स्पष्ट कर्म नहीं है; अर्थात स्वयं वे काम विश्वास करने के लिए पर्याप्त आधार हैं। इसका अनुवाद यह भी हो सकता है: ‘उन कामों के आधार पर विश्वास करो।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: मेरी इस बात पर विश्वास करो
  rationale: πιστεύω के साथ μοι का अर्थ यहाँ किसी व्यक्ति की कही बात को सच मानना है। हिन्दी में ‘मेरा विश्वास करो कि…’ की अपेक्षा ‘मेरी इस बात पर विश्वास करो कि…’ अधिक स्वाभाविक है और अगले ὅτι-वाक्य को कथन की विषयवस्तु के रूप में स्पष्ट रखता है; यह ‘मुझ पर विश्वास करो’ कहकर व्यापक धार्मिक विश्वास का भाव नहीं जोड़ता।
- source_word: ὅτι
  choice: कि
  rationale: यह विश्वास किए जाने वाले कथन की विषयवस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: पिता में ... मुझ में
  rationale: दोहराया गया ἐν पिता और पुत्र के परस्पर अंतर्वास की यूहन्नाई भाषा को बनाए रखता है। ‘एक हूँ’ जैसी व्याख्यात्मक पुनर्रचना से बचा गया है।
- source_word: εἰ δὲ μή
  choice: पर यदि नहीं
  rationale: यह पहले आग्रह को न मान पाने की स्थिति में विश्वास का वैकल्पिक आधार प्रस्तुत करता है और यूनानी की संक्षिप्त सशर्त अभिव्यक्ति को सुरक्षित रखता है।
- source_word: διὰ τὰ ἔργα αὐτὰ
  choice: स्वयं उन कामों के कारण
  rationale: διά के कारण अथवा आधार के अर्थ और αὐτά द्वारा ‘कामों’ पर दिए गए बल—दोनों को व्यक्त करता है। ‘केवल’ नहीं जोड़ा गया, क्योंकि वह यूनानी से अधिक अनन्यता जता सकता है।
- source_word: τὰ ἔργα
  choice: कामों
  rationale: यूहन्ना में यह यीशु के उन कार्यों के लिए व्यापक शब्द है जो उनकी पहचान और मिशन की गवाही देते हैं। ‘काम’ साधारण आधुनिक हिन्दी में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: πιστεύετε
  choice: विश्वास करो
  rationale: अंतिम क्रिया का कोई स्पष्ट कर्म यूनानी में नहीं है। हिन्दी में भी इसे बिना कर्म के रखा गया है ताकि ‘मुझ पर’ या ‘मेरी बात पर’ अनावश्यक रूप से न जोड़ा जाए।
theological_decisions:
- issue: पुत्र और पिता का परस्पर अंतर्वास
  choice: ‘मैं पिता में हूँ और पिता मुझ में है’ की प्रत्यक्ष संबंधपरक भाषा बनाए रखी गई।
  alternative: ‘मैं और पिता एक हैं’ अथवा ‘मैं पिता के साथ एक हूँ।’
  rationale: मूल पद गहरी एकता और परस्पर अंतर्वास व्यक्त करता है, पर उसे किसी दूसरे यूहन्नाई कथन या धर्मसैद्धांतिक व्याख्या से बदलना उचित नहीं। शाब्दिक संबंधपरक रूप पाठ की गहराई और तनाव दोनों सुरक्षित रखता है।
- issue: कामों को विश्वास का आधार मानना
  choice: अंतिम ‘विश्वास करो’ को बिना स्पष्ट कर्म के रखा गया और कामों को उसका आधार बताया गया।
  alternative: ‘कामों के कारण मुझ पर विश्वास करो’ अथवा ‘कामों के कारण मेरी बात पर विश्वास करो।’
  rationale: यूनानी के अंतिम πιστεύετε का कोई व्यक्त कर्म नहीं है। उसे अनिर्दिष्ट रखने से पाठ की संक्षिप्तता और वास्तविक अस्पष्टता बनी रहती है, जबकि διά-वाक्यांश स्पष्ट करता है कि काम विश्वास के लिए आधार अथवा प्रमाण हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘मेरी इस बात पर विश्वास करो’ हिन्दी की स्वाभाविक वाक्यरचना के लिए सीमित स्पष्टता जोड़ता है, जबकि अंतिम ‘विश्वास करो’ को मूल की तरह कर्मरहित रखा गया है।
