source:
  edition: SBLGNT
  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: hi
  text: थोमा ने उनसे कहा, “प्रभु, हम नहीं जानते कि आप कहाँ जा रहे हैं। हम मार्ग कैसे जान सकते हैं?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “हम नहीं जानते” और “मार्ग को जान सकते हैं” के लिए एक ही क्रिया के अलग-अलग रूप प्रयुक्त हैं।
    reason: मूल भाषा में शब्द की पुनरावृत्ति स्पष्ट करना
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: थोमा ने उनसे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान λέγει को स्वाभाविक हिन्दी कथन-शैली में भूतकाल से व्यक्त किया गया है। αὐτῷ के लिए यीशु के प्रति आदरसूचक बहुवचन ‘उनसे’ रखा गया है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यह सम्बोधन आदर और शिष्य द्वारा यीशु की पहचान—दोनों की सम्भावना बनाए रखता है; इसे केवल शिष्टाचारसूचक ‘श्रीमान’ तक सीमित नहीं करता।
- source_word: οὐκ οἴδαμεν
  choice: हम नहीं जानते
  rationale: οἶδα यहाँ ज्ञान को व्यक्त करता है; ‘नहीं जानते’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ποῦ ὑπάγεις
  choice: आप कहाँ जा रहे हैं
  rationale: ὑπάγω में चले जाने का भाव हो सकता है, विशेषकर यूहन्ना में, पर यहाँ सरल रूप गन्तव्य के विषय में थोमा की अनभिज्ञता और कथानक का धर्मवैचारिक तनाव दोनों बनाए रखता है।
- source_word: πῶς δυνάμεθα
  choice: कैसे ... सकते हैं
  rationale: πῶς प्रश्नवाचक ‘कैसे’ है और δύναμαι सामर्थ्य या सम्भावना बताता है; हिन्दी में ‘कैसे ... सकते हैं’ स्वाभाविक संयुक्त अभिव्यक्ति है।
- source_word: τὴν ὁδὸν
  choice: मार्ग
  rationale: ὁδός का अर्थ मार्ग, रास्ता या पथ हो सकता है। ‘मार्ग’ dignified yet understandable है और अगले पद से विषयगत सम्बन्ध को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: εἰδέναι
  choice: जान सकते हैं
  rationale: यह infinitive δυνάμεθα का पूरक है। ‘जान’ रखने से οἴδαμεν और εἰδέναι की यूनानी पुनरावृत्ति हिन्दी में भी सुरक्षित रहती है।
theological_decisions:
- issue: यूहन्ना के सन्दर्भ में ὑπάγεις का सम्भावित धर्मवैचारिक संकेत
  choice: आप कहाँ जा रहे हैं
  alternative: आप कहाँ चले जा रहे हैं
  rationale: यूहन्ना में यीशु के जाने का सम्बन्ध पिता के पास लौटने से हो सकता है, पर थोमा यहाँ उस गन्तव्य को न जानने की बात करता है। तटस्थ अनुवाद आगे की व्याख्या को इस पद में पहले से नहीं भरता।
- issue: ὁδός और अगले पद में यीशु के ‘मार्ग’ होने का सम्बन्ध
  choice: मार्ग
  alternative: रास्ता
  rationale: ‘मार्ग’ मूल शब्द के सामान्य और रूपक दोनों आयामों को खुला रखता है, पर इस पद में ही उसका अर्थ धर्मसैद्धान्तिक रूप से निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; यीशु के लिए आदरसूचक ‘आप/उनसे’; भाषा सरल, स्वाभाविक और गरिमापूर्ण रखी गई है।
