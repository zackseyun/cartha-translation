source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: hi
  text: लेकिन मैं ऐसा इसलिए करता हूँ कि संसार जान ले कि मैं पिता से प्रेम करता हूँ और जैसा पिता ने मुझे आज्ञा दी है,[a] वैसा ही करता हूँ। उठो, हम यहाँ से चलें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसा पिता ने मुझे आज्ञा दी है, मैं वैसा ही करता हूँ।”
    reason: यूनानी καθώς … οὕτως संरचना के निकट वैकल्पिक हिन्दी शब्दक्रम; अर्थ में कोई अंतर नहीं।
lexical_decisions:
- source_word: ἀλλ’
  choice: लेकिन
  rationale: यह पिछले कथन के विपरीत या उससे भिन्न अगली बात को स्वाभाविक आधुनिक हिन्दी में जोड़ता है।
- source_word: ἵνα γνῷ
  choice: ताकि ... जान ले
  rationale: ἵνα के प्रयोजनार्थक भाव और अओरिस्ट सब्जंक्टिव की अपेक्षित पूर्ण उपलब्धि—संसार का जान लेना—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ὁ κόσμος
  choice: संसार
  rationale: यूहन्ना की विशिष्ट शब्दावली और उसके सामूहिक मानवीय अर्थ को बनाए रखता है।
- source_word: ἀγαπῶ τὸν πατέρα
  choice: मैं पिता से प्रेम करता हूँ
  rationale: वर्तमान काल के स्थायी संबंधात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है और यूनानी पाठ की तरह कोई स्वत्ववाचक शब्द नहीं जोड़ता।
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  choice: मैं वैसा ही करता हूँ जैसा पिता ने मुझे आज्ञा दी है
  rationale: καθώς–οὕτως के अनुरूपता-संबंध को हिन्दी के स्वाभाविक 'वैसा ही ... जैसा' विन्यास में रखता है; 'आज्ञा दी है' आदेश के बल और वर्तमान में प्रासंगिक परिणाम को व्यक्त करता है।
- source_word: Ἐγείρεσθε
  choice: उठो
  rationale: बहुवचन आज्ञार्थक को संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी में प्रस्तुत करता है।
- source_word: ἄγωμεν ἐντεῦθεν
  choice: हम यहाँ से चलें
  rationale: प्रथम पुरुष बहुवचन के प्रोत्साहनार्थक सब्जंक्टिव और स्थान से प्रस्थान—दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना के मसीह-विज्ञान में πατήρ का संबंधात्मक संबोधन
  choice: पिता
  alternative: मेरे पिता
  rationale: यूनानी में स्पष्ट स्वत्ववाचक सर्वनाम नहीं है। 'पिता' पाठ की अभिव्यक्ति और पिता-पुत्र संबंध पर उसके बल को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- issue: पुत्र के प्रति पिता के ἐντέλλομαι का बल
  choice: आज्ञा दी है
  alternative: निर्देश दिया है
  rationale: यूनानी क्रिया आदेश देने का प्रबल भाव रखती है। धर्मवैज्ञानिक असहजता के कारण इसे नरम किए बिना यीशु के प्रेमपूर्ण आज्ञापालन को व्यक्त किया गया है।
- issue: ἵνα-वाक्य और मुख्य क्रिया के बीच संबंध
  choice: प्रयोजन को पहले रखते हुए मुख्य क्रिया को बाद में स्पष्ट किया गया है
  alternative: मैं पिता से प्रेम करता हूँ, और जैसा पिता ने मुझे आज्ञा दी है, वैसा ही करता हूँ
  rationale: यूनानी शब्दक्रम में प्रयोजन-वाक्य पहले आता है और मुख्य क्रिया οὕτως ποιῶ बाद में। हिन्दी विन्यास उसी प्रयोजन को स्पष्ट रखता है, जबकि 'ताकि' को केवल प्रेम के कथन से जोड़ देने की संभावित गलतफहमी से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और बोलचाल में समझ आने वाला वाक्य-विन्यास। 'परन्तु' की अपेक्षा 'लेकिन' और 'प्रस्थान करें' की अपेक्षा 'चलें' अधिक स्वाभाविक हैं, जबकि अर्थ की गंभीरता बनी रहती है।
