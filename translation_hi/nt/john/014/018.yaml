  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: hi
  text: मैं तुम्हें अनाथ नहीं छोड़ूँगा; मैं तुम्हारे पास आ रहा हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मैं तुम्हारे पास आ रहा हूँ” का संकेत पुनरुत्थान के बाद यीशु के चेलों के सामने प्रकट होने, पवित्र आत्मा के द्वारा यीशु के आने, या उनके भावी पुनरागमन की ओर हो सकता है; यूनानी वाक्य अपने आप में किसी एक अर्थ को निश्चित नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφήσω
  choice: छोड़ूँगा
  rationale: यहाँ ἀφίημι का भाव पीछे छोड़ देने का है। ‘छोड़ूँगा’ आधुनिक हिन्दी में स्वाभाविक है और ‘अनाथ’ के पारिवारिक बिंब के साथ ठीक बैठता है।
- source_word: ὀρφανούς
  choice: अनाथ
  rationale: यह शब्द माता-पिता की देखभाल से वंचित बच्चों का ठोस बिंब देता है और विस्तार से असहाय छोड़ दिए जाने का भाव रखता है। ‘अनाथ’ उस बिंब को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: ἔρχομαι
  choice: आ रहा हूँ
  rationale: यूनानी वर्तमान रूप की निकटता और जीवंतता को सुरक्षित रखते हुए यह हिन्दी में स्वाभाविक अभिव्यक्ति है; इसे केवल साधारण भविष्य में नहीं बदला गया।
- source_word: πρὸς ὑμᾶς
  choice: तुम्हारे पास
  rationale: व्यक्तियों की ओर आने के लिए πρός का स्वाभाविक हिन्दी समतुल्य ‘तुम्हारे पास’ है।
- source_word: Οὐκ
  choice: नहीं
  rationale: भविष्यकालीन क्रिया का सामान्य निषेध हिन्दी में ‘नहीं छोड़ूँगा’ से स्पष्ट होता है।
theological_decisions:
- issue: ‘मैं तुम्हारे पास आ रहा हूँ’ का संकेत और समय
  choice: मुख्य पाठ में यह निश्चित नहीं किया गया कि यीशु किस आगमन की बात कर रहे हैं।
  alternative: इसे पुनरुत्थान के बाद यीशु के दर्शनों, पवित्र आत्मा के द्वारा उनके आने, या उनके भावी पुनरागमन में से किसी एक तक सीमित करना।
  rationale: निकट संदर्भ में पवित्र आत्मा की प्रतिज्ञा है, पर वाक्य यीशु के स्वयं चेलों के पास आने की ओर भी संकेत कर सकता है। यूनानी भाषा किसी एक संदर्भ को अनिवार्य नहीं करती, इसलिए अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘अनाथ’ के ठोस पारिवारिक बिंब को रखा गया है। ‘आ रहा हूँ’ मूल के वर्तमान-रूप की निकटता को बनाए रखता है।
