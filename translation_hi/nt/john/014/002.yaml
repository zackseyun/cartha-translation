id: JHN.14.2
reference: John 14:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί εἰσιν· εἰ δὲ μή, εἶπον ἂν ὑμῖν ⸀ὅτι πορεύομαι ἑτοιμάσαι τόπον ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: hi
  text: मेरे पिता के घर में बहुत-से निवास-स्थान[a] हैं। यदि ऐसा न होता[b], तो क्या मैं तुमसे कहता कि मैं तुम्हारे लिए एक स्थान तैयार करने जा रहा हूँ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत-से कमरे।” यूनानी शब्द का अर्थ रहने या ठहरने के स्थान हो सकता है। “निवास-स्थान” अधिक व्यापक है और इस अध्याय में निवास करने के विषय से सम्बन्ध बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: या, “यदि ऐसा न होता, तो मैं तुमसे कह देता; क्योंकि मैं तुम्हारे लिए एक स्थान तैयार करने जा रहा हूँ।” यूनानी वाक्य को आलंकारिक प्रश्न के बजाय कथन के रूप में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίᾳ
  choice: घर
  rationale: यहाँ οἰκία का स्वाभाविक अर्थ घर है; यह ठोस रूपक और ‘मेरे पिता का घर’ अभिव्यक्ति को बनाए रखता है।
- source_word: πατρός μου
  choice: मेरे पिता के
  rationale: सम्बन्धकारक पद को स्वाभाविक हिन्दी में ‘मेरे पिता के’ कहा गया है; ‘पिता’ यहाँ यीशु द्वारा परमेश्वर के लिए प्रयुक्त सम्बोधन है।
- source_word: μοναὶ πολλαί
  choice: बहुत-से निवास-स्थान
  rationale: μονή रहने या ठहरने के स्थान को सूचित करता है। ‘निवास-स्थान’ अर्थ को ‘कमरों’ से अधिक व्यापक रखता और इस अध्याय के निवास करने के विषय से सम्बन्ध बनाए रखता है।
- source_word: εἰ δὲ μή
  choice: यदि ऐसा न होता
  rationale: अव्यक्त शर्त को हिन्दी में पूर्ण और सहज रूप से व्यक्त करता है।
- source_word: εἶπον ἂν ὑμῖν
  choice: तो क्या मैं तुमसे कहता
  rationale: ἄν सहित क्रिया को शर्त के परिणाम और मुख्य पाठ में अपनाए गए आलंकारिक प्रश्न के रूप में स्वाभाविक हिन्दी दी गई है।
- source_word: ὅτι
  choice: कि
  rationale: मुख्य पाठ में ὅτι को कही गई बात की विषय-वस्तु प्रस्तुत करने वाला माना गया है; ‘क्योंकि’ वाला सम्भव पाठ टिप्पणी में सुरक्षित है।
- source_word: πορεύομαι
  choice: मैं ... जाने जा रहा हूँ
  rationale: वर्तमान क्रिया को निकट भविष्य की ओर संकेत करने वाले प्रगतिशील भाव में व्यक्त किया गया है। पूर्ण वाक्य में हिन्दी शब्दक्रम के अनुसार ‘मैं ... तैयार करने जा रहा हूँ’ आता है।
- source_word: ἑτοιμάσαι
  choice: तैयार करने
  rationale: उद्देश्यसूचक infinitive का स्पष्ट और प्रचलित हिन्दी अनुवाद है।
- source_word: τόπον
  choice: एक स्थान
  rationale: τόπος व्यापक शब्द है; ‘स्थान’ इसे अनावश्यक रूप से ‘कमरे’ तक सीमित नहीं करता।
- source_word: ὑμῖν
  choice: तुम्हारे लिए
  rationale: सम्प्रदान का हितार्थक भाव व्यक्त करता है; बहुवचन प्रसंग से स्पष्ट है, इसलिए ‘तुम सब’ जोड़ना आवश्यक नहीं।
theological_decisions:
- issue: अन्तकालीन चित्रण के सम्बन्ध में μονή का अनुवाद
  choice: बहुत-से निवास-स्थान
  alternative: बहुत-से कमरे; बहुत-से भवन
  rationale: यूनानी शब्द न तो आधुनिक अर्थ में भव्य अलग-अलग भवनों की माँग करता है, न किसी इमारत के भीतर के कमरों तक अर्थ सीमित करता है। ‘निवास-स्थान’ व्यापक अर्थ और यूहन्ना 14 में निवास करने की विषयगत कड़ी को बचाता है।
- issue: दूसरे वाक्य का विराम और बल
  choice: 'आलंकारिक प्रश्न: ‘यदि ऐसा न होता, तो क्या मैं तुमसे कहता कि मैं ... जा रहा हूँ?’'
  alternative: 'कथन: ‘यदि ऐसा न होता, तो मैं तुमसे कह देता; क्योंकि मैं तुम्हारे लिए एक स्थान तैयार करने जा रहा हूँ।’'
  rationale: मूल यूनानी में विराम-चिह्न न होने के कारण ὅτι को कथन की विषय-वस्तु (‘कि’) या कारण (‘क्योंकि’) मानना सम्भव है। मुख्य पाठ में प्रसंगानुकूल आलंकारिक प्रश्न रखा गया है और वास्तविक वैकल्पिक संरचना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘निवास-स्थान’ सामान्य बोलचाल के ‘कमरे’ से कुछ औपचारिक है, पर मूल शब्द की व्यापकता और यूहन्ना के विषयगत सम्बन्ध को अधिक ठीक से सुरक्षित रखता है। ‘तुम’ यीशु का अपने शिष्यों से निकट और बहुवचन सम्बोधन स्वाभाविक ढंग से व्यक्त करता है।
