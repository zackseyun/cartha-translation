- from: मैं तुम्हारे लिए शांति छोड़े जाता हूँ; अपनी शांति तुम्हें देता हूँ। जैसा संसार देता है, वैसा मैं तुम्हें नहीं देता। तुम्हारा मन व्याकुल न हो और न साहस छोड़े।[a]
  to: मैं तुम्हें शांति छोड़ जाता हूँ; अपनी शांति तुम्हें देता हूँ। जैसा संसार देता है, वैसा मैं तुम्हें नहीं देता। तुम्हारा मन व्याकुल न हो और भयभीत न हो।[a]
