review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the repeated ‘peace,’ the contrast with the world’s manner of giving, and the two final prohibitions. However, ‘तुम्हारा मन ... साहस छोड़े’ is less idiomatic and makes the mind the agent that abandons courage; the Greek δειλιάτω directly describes the heart’s becoming fearful/timid. A more direct Hindi rendering better preserves the syntax and sense.
  naturalness: ‘मैं तुम्हें शांति छोड़ जाता हूँ’ is more natural than ‘मैं तुम्हारे लिए शांति छोड़े जाता हूँ’ in this farewell context. ‘तुम्हारा मन व्याकुल न हो और भयभीत न हो’ is clear, modern, and dignified Hindi.
  terminology: ‘शांति,’ ‘अपनी शांति,’ ‘संसार,’ and ‘मन’ are suitable. The main text should use ‘भयभीत’ for δειλιάω, with ‘साहस हारना’ retained as a lexical alternative in the footnote.
  issues:
  - severity: medium
    issue: ‘तुम्हारे लिए शांति छोड़े जाता हूँ’ is an awkward rendering of ἀφίημι ὑμῖν.
    rationale: The dative addresses the disciples as recipients. ‘तुम्हें शांति छोड़ जाता हूँ’ naturally conveys leaving peace with them without shifting the sense toward merely doing something for their benefit.
  - severity: medium
    issue: ‘तुम्हारा मन ... साहस छोड़े’ is syntactically and idiomatically weak for μηδὲ δειλιάτω.
    rationale: The Greek verb means to become fearful or timid / lose courage. In Hindi, ‘मन साहस छोड़े’ can sound as though the mind abandons courage. ‘भयभीत न हो’ is a direct, natural rendering; ‘साहस न हारे’ is a suitable footnoted alternative.
  revised_text: मैं तुम्हें शांति छोड़ जाता हूँ; अपनी शांति तुम्हें देता हूँ। जैसा संसार देता है, वैसा मैं तुम्हें नहीं देता। तुम्हारा मन व्याकुल न हो और भयभीत न हो।[a]
