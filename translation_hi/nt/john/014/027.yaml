  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: hi
  text: मैं तुम्हें शांति छोड़ जाता हूँ; अपनी शांति तुम्हें देता हूँ। जैसा संसार देता है, वैसा मैं तुम्हें नहीं देता। तुम्हारा मन व्याकुल न हो और भयभीत न हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और साहस न हारे।” यूनानी क्रिया में भयभीत या कातर हो जाने, अथवा साहस खो देने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: शांति
  rationale: यह सामान्य और व्यापक हिन्दी पर्याय है, जो केवल संघर्ष के अभाव तक अर्थ को सीमित किए बिना कुशलता और संपूर्णता की संभावित गूँज बनाए रखता है।
- source_word: ἀφίημι
  choice: छोड़े जाता हूँ
  rationale: विदाई के प्रसंग में वर्तमान काल और पीछे छोड़ जाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘वसीयत में देता हूँ’ अनावश्यक रूप से व्याख्यात्मक होता।
- source_word: εἰρήνην τὴν ἐμὴν
  choice: अपनी शांति
  rationale: बलयुक्त सम्बन्धवाचक पद को स्वाभाविक ढंग से रखता और यीशु की शांति को संसार के देने से अलग दिखाता है।
- source_word: δίδωμι
  choice: देता हूँ
  rationale: सरल वर्तमान काल यूनानी क्रिया और पद में दोहराए गए देने के विरोध को सुरक्षित रखता है।
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν
  choice: जैसा संसार देता है, वैसा मैं तुम्हें नहीं देता
  rationale: तुलना और यीशु तथा संसार के देने के बीच बलयुक्त विरोध दोनों को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: κόσμος
  choice: संसार
  rationale: यूहन्ना में इस शब्द की व्यापक और कभी-कभी परमेश्वर-विरोधी मानवीय व्यवस्था की गूँज को किसी एक व्याख्या तक सीमित नहीं करता।
- source_word: μὴ ταρασσέσθω ὑμῶν ἡ καρδία
  choice: तुम्हारा मन व्याकुल न हो
  rationale: ‘मन’ हिन्दी में आन्तरिक व्यक्ति के लिए स्वाभाविक है; सामूहिक एकवचन ‘तुम्हारा मन’ यूनानी एकवचन हृदय को बनाए रखता है और यूहन्ना 14:1 की अभिव्यक्ति से संगति रख सकता है।
- source_word: μηδὲ δειλιάτω
  choice: और न साहस छोड़े
  rationale: यह क्रिया भयभीत या कायर हो जाने तथा साहस खोने का भाव रखती है। ‘साहस छोड़े’ पहले खंड के ‘व्याकुल’ से अर्थगत भेद बनाए रखता है और हिन्दी में कठोर नैतिक आरोप से बचता है।
theological_decisions:
- issue: यीशु द्वारा दी जाने वाली शांति का स्वरूप
  choice: मुख्य पाठ में केवल ‘शांति’ और ‘अपनी शांति’
  alternative: इसे भीतरी चैन, परमेश्वर से मेल-मिलाप, या वाचा/अंतकालीन संपूर्णता के रूप में स्पष्ट करना
  rationale: पद इस शांति को किसी एक अर्थ में सीमित नहीं करता; व्यापक शब्द उसकी धर्मवैज्ञानिक समृद्धि और तनाव को सुरक्षित रखता है।
- issue: δειλιάω में भय और साहसहीनता का संबंध
  choice: मुख्य पाठ में ‘साहस छोड़े’, और पादटिप्पणी में भयभीत होने का विकल्प
  alternative: ‘डरे’ या ‘भयभीत हो’
  rationale: यूनानी क्रिया में भय से कातर या साहसहीन होने का भाव है। मुख्य पाठ साहस खोने की छाया दिखाता है, जबकि पादटिप्पणी अधिक सीधा विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक। ‘मन’ साधारण हिन्दी में ‘हृदय’ की आन्तरिक-अस्तित्व संबंधी भूमिका को अधिक सहजता से व्यक्त करता है।
