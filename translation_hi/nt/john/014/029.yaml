  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: hi
  text: और अब मैंने तुम्हें इसके होने से पहले बता दिया है, ताकि जब यह हो जाए, तब तुम विश्वास करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  choice: और अब
  rationale: καί की संयोजकता और νῦν का समय-संबंध दोनों सुरक्षित रहते हैं तथा पिछले कथन से स्वाभाविक संबंध बनता है।
- source_word: εἴρηκα ὑμῖν
  choice: मैंने तुम्हें ... बता दिया है
  rationale: Perfect εἴρηκα पहले कही गई बात के वर्तमान महत्व को व्यक्त करता है। हिंदी में ‘बता दिया है’ पूर्ण हो चुके पूर्व-कथन और उसके बने हुए प्रभाव को स्वाभाविक रूप से दर्शाता है।
- source_word: πρὶν γενέσθαι
  choice: इसके होने से पहले ही
  rationale: πρίν और aorist infinitive γενέσθαι का अर्थ किसी संदर्भगत घटना के घटित होने से पहले है। ‘इसके’ पिछली बात में संकेतित घटना को स्पष्ट करता है; ‘ही’ पूर्वसूचना पर स्वाभाविक बल देता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्यसूचक अर्थ को सरल और आधुनिक हिंदी में स्पष्ट रूप से व्यक्त करता है।
- source_word: ὅταν γένηται
  choice: जब यह हो
  rationale: ὅταν के साथ subjunctive भावी घटना को ‘जब’ के रूप में प्रस्तुत करता है। ‘हो’ γίνομαι की पुनरावृत्ति को पहले आए ‘होने’ के साथ बनाए रखता है।
- source_word: πιστεύσητε
  choice: तुम विश्वास करो
  rationale: यूहन्ना में πιστεύω का स्थापित और व्यापक अर्थ ‘विश्वास करना’ है। यह अनुवाद आरंभिक विश्वास और विश्वास के दृढ़ होने के बीच यूनानी पाठ की अस्पष्टता को खुला रखता है।
theological_decisions:
- issue: πιστεύσητε का प्रसंगगत बल
  choice: तुम विश्वास करो
  alternative: तुम्हारा विश्वास दृढ़ हो / तुम भरोसा करो
  rationale: भविष्यवाणी पूरी होने पर यीशु के शिष्यों में विश्वास उत्पन्न होने या पहले से मौजूद विश्वास के दृढ़ होने—दोनों की संभावना प्रसंग में है। यूनानी क्रिया इनमें से किसी एक को स्पष्ट रूप से सीमित नहीं करती, इसलिए व्यापक ‘विश्वास करो’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ‘तुम्हें’ और ‘तुम’ बहुवचन शिष्यों को संबोधित करते हैं। किसी पंथ-विशेष की व्याख्या नहीं जोड़ी गई है।
