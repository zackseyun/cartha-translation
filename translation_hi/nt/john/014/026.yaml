id: JHN.14.26
reference: John 14:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: hi
  text: परन्तु सहायक[a], अर्थात् पवित्र आत्मा, जिसे पिता मेरे नाम से भेजेगा, वही तुम्हें सब बातें सिखाएगा और जो कुछ मैंने तुमसे कहा है, वह सब तुम्हें याद दिलाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘पक्षसमर्थक,’ ‘सलाहकार,’ अथवा ‘सांत्वना देनेवाला’ (यूनानी: पाराक्लेतोस)।'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  choice: सहायक
  rationale: यह स्वाभाविक और व्यापक हिन्दी शब्द सक्रिय सहायता की व्यक्तिगत भूमिका व्यक्त करता है। यूनानी शब्द में पक्षसमर्थक, सलाहकार और सांत्वना देने वाले के भाव भी हो सकते हैं, जिन्हें पादटिप्पणी में रखा गया है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: यह आधुनिक हिन्दी में प्रचलित और मूल पद का सटीक धार्मिक शीर्षक है।
- source_word: ὃ πέμψει ὁ πατήρ
  choice: जिसे पिता ... भेजेगा
  rationale: मूल में व्याकरणिक नपुंसकलिंग होने पर भी संदर्भ में पवित्र आत्मा व्यक्तिगत कर्ता है; ‘जिसे’ उस व्यक्तिगत संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ ὀνόματί μου
  choice: मेरे नाम से
  rationale: यह प्रतिनिधित्व, अधिकार और संबंध की मूल अर्थ-सीमा को किसी एक भाव तक सीमित किए बिना बनाए रखता है।
- source_word: ἐκεῖνος
  choice: वही
  rationale: बलसूचक संकेतवाचक सर्वनाम को ‘वही’ से व्यक्त किया गया है, जो सहायक अर्थात् पवित्र आत्मा की ओर स्पष्ट रूप से लौटता है।
- source_word: διδάξει ὑμᾶς πάντα
  choice: तुम्हें सब बातें सिखाएगा
  rationale: यह प्रत्यक्ष, सहज और मूल प्रतिज्ञा की व्यापकता बनाए रखने वाला अनुवाद है।
- source_word: ὑπομνήσει ὑμᾶς
  choice: तुम्हें याद दिलाएगा
  rationale: यह क्रिया के कारणवाचक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πάντα ἃ εἶπον ὑμῖν
  choice: जो कुछ मैंने तुमसे कहा है, वह सब
  rationale: यह मूल के संबंधवाचक विन्यास और व्यापकता दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: पवित्र आत्मा के लिए व्यक्तिगत भाषा
  choice: ‘जिसे’ और ‘वही ... सिखाएगा/याद दिलाएगा’ जैसी व्यक्तिगत भाषा
  alternative: व्याकरणिक नपुंसकलिंग के आधार पर निर्वैयक्तिक भाषा
  rationale: पद में πνεῦμα के साथ व्यक्तिगत उपाधि παράκλητος और बलसूचक ἐκεῖνος प्रयुक्त हैं तथा आत्मा सिखाने और याद दिलाने का व्यक्तिगत कार्य करता है।
- issue: παράκλητος का अनुवाद
  choice: सहायक
  alternative: पक्षसमर्थक, सलाहकार, सांत्वना देनेवाला
  rationale: किसी एक हिन्दी शब्द में यूनानी पद की पूरी अर्थ-सीमा नहीं आती। ‘सहायक’ सामान्य पाठक के लिए सहज और पर्याप्त व्यापक है; अन्य वास्तविक अर्थछटाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। ‘परन्तु’ मूल के δέ को व्यक्त करता है; ‘अर्थात्’ appositional संबंध को हिन्दी में स्पष्ट बनाता है। संबोधन में बहुवचन ‘तुम्हें/तुमसे’ मूल के ὑμᾶς/ὑμῖν के अनुरूप है।
