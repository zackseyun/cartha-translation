  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: hi
  text: यीशु ने उससे कहा[a], “मैं ही मार्ग, सत्य और जीवन हूँ। मेरे द्वारा आए बिना कोई भी पिता के पास नहीं आता[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “यीशु उससे कहता है।” यूनानी में यहाँ कथा का ऐतिहासिक वर्तमान काल प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या, “कोई भी पिता के पास नहीं आता, यदि वह मेरे द्वारा न आए।”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: ने … कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान (‘कहता है’) है, पर आधुनिक हिन्दी कथा-वर्णन में भूतकाल ‘कहा’ अधिक स्वाभाविक है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: αὐτῷ
  choice: उससे
  rationale: सम्बोधन के अप्रत्यक्ष कर्म को स्वाभाविक हिन्दी में ‘उससे’ व्यक्त किया गया है।
- source_word: Ἐγώ εἰμι
  choice: मैं ही हूँ
  rationale: स्पष्ट सर्वनाम Ἐγώ के बल को हिन्दी के ‘ही’ से व्यक्त किया गया है, जबकि इसे अगले वाक्य के अनन्य दावे से अधिक विस्तृत नहीं किया गया।
- source_word: ἡ ὁδός
  choice: मार्ग
  rationale: ‘मार्ग’ शाब्दिक और रूपक—दोनों अर्थों को बनाए रखता है और गरिमापूर्ण आधुनिक हिन्दी में सहज है।
- source_word: ἡ ἀλήθεια
  choice: सत्य
  rationale: यह ἀλήθεια के मूल अर्थ को सीधे व्यक्त करता है और यूहन्ना में निहित व्यापक अर्थ को व्याख्यात्मक विस्तार के बिना सुरक्षित रखता है।
- source_word: ἡ ζωή
  choice: जीवन
  rationale: ‘जीवन’ मूल शब्द के अर्थ और उसके व्यापक यूहन्नाई धर्मवैचारिक संकेतों को बिना सीमित किए बनाए रखता है।
- source_word: οὐδεὶς
  choice: कोई भी … नहीं
  rationale: यूनानी के सार्वभौमिक निषेध को स्वाभाविक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: ἔρχεται
  choice: आता
  rationale: वर्तमान काल यहाँ सामान्य और सर्वकालिक कथन है; हिन्दी का सामान्य वर्तमान इसी भाव को व्यक्त करता है।
- source_word: πρὸς τὸν πατέρα
  choice: पिता के पास
  rationale: πρός के गमन-दिशा वाले अर्थ को सुरक्षित रखते हुए ‘पिता’ को परमेश्वर के व्यक्तिगत सम्बोधन के रूप में प्रस्तुत करता है।
- source_word: εἰ μὴ
  choice: आए बिना
  rationale: इस प्रसंग में εἰ μή अपवाद/शर्त का भाव देता है। ‘आए बिना’ हिन्दी में ‘जब तक/यदि नहीं’ का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δι’ ἐμοῦ
  choice: मेरे द्वारा
  rationale: διά के साथ सम्बन्धकारक माध्यम अथवा मध्यस्थता दर्शाता है; ‘मेरे द्वारा’ इस बल को ‘मेरे सिवा’ की अपेक्षा अधिक सीधे सुरक्षित रखता है।
theological_decisions:
- issue: पिता तक पहुँचने की अनन्यता
  choice: ‘मेरे द्वारा आए बिना कोई भी पिता के पास नहीं आता’
  alternative: ‘मेरे सिवा कोई पिता के पास नहीं आता’
  rationale: चुना गया रूप यीशु के द्वारा ही पिता तक पहुँचने के स्पष्ट अनन्य दावे को बिना नरम किए रखता है और διά के माध्यम/मध्यस्थता के भाव को भी सुरक्षित करता है।
- issue: तीन विधेय संज्ञाओं की संरचना
  choice: ‘मार्ग और सत्य और जीवन मैं ही हूँ’
  alternative: ‘मैं मार्ग, सत्य और जीवन हूँ’
  rationale: यूनानी में प्रत्येक संज्ञा के साथ उपपद की पुनरावृत्ति और καί की श्रृंखला तीनों पदों को अलग-अलग बल देती है। हिन्दी में दोहराया गया ‘और’ तथा अन्त में ‘मैं ही हूँ’ उस आलंकारिक भार को स्वाभाविक रूप से बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मार्ग’, ‘सत्य’, ‘जीवन’ और ‘पिता’ जैसे परिचित बाइबिलीय शब्द बनाए गए हैं। वाक्य-विन्यास में मूल यूनानी की त्रिपदीय लय और अनन्य दावे को यथासम्भव सुरक्षित रखा गया है।
