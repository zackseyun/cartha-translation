  edition: SBLGNT
  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: hi
  text: यदि तुमने मुझे जाना होता, तो मेरे पिता को भी जानते होते। अब से तुम उसे जानते हो और उसे देख चुके हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώκειτέ / ᾔδειτε / γινώσκετε
  choice: जाना होता / जानते / जानते हो
  rationale: यूहन्ना में इन निकटार्थी ‘जानना’ क्रियाओं के बीच यहाँ हिंदी में कृत्रिम भेद न बनाकर संबंधपरक पहचान और ज्ञान दोनों को खुला रखा गया है।
- source_word: ἀπ’ ἄρτι
  choice: अब से
  rationale: यह समय-सूचक वाक्यांश का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: ἑωράκατε
  choice: देख चुके हो
  rationale: पूर्णकालिक रूप उस दर्शन के वर्तमान तक बने रहने वाले परिणाम को व्यक्त करता है।
theological_decisions:
- issue: पहले वाक्य की शर्त और दूसरे वाक्य का सकारात्मक कथन
  choice: अपूर्ण भूतकालीन शर्त के बाद ‘अब से तुम उसे जानते हो’ का दृढ़ कथन बनाए रखा गया।
  alternative: पहले वाक्य या दूसरे कथन को इस तरह नरम करना कि दोनों के बीच का तनाव समाप्त हो जाए।
  rationale: यूनानी पाठ स्वयं अतीत-संबंधी शर्त से वर्तमान सकारात्मक घोषणा की ओर बढ़ता है; इस कथात्मक और धर्मवैचारिक तनाव को अनसुलझा ही रखा गया है।
- issue: पिता को ‘देखने’ का अर्थ
  choice: ‘उसे देख चुके हो’ का प्रत्यक्ष रूप रखा गया।
  alternative: ‘मुझमें उसे देख चुके हो’ या ‘उसे पहचान चुके हो’।
  rationale: ऐसी व्याख्यात्मक पूर्ति पद में स्पष्ट रूप से नहीं है; संदर्भ अर्थ को दिशा देता है, पर अनुवाद में अतिरिक्त शब्द जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक। ‘मेरे पिता’ मूल के संबंधवाचक बल को बनाए रखता है।
