  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: hi
  text: और रोटी के उस टुकड़े[a] के बाद शैतान उसमें प्रवेश कर गया। तब यीशु ने उससे कहा, “जो तुम कर रहे हो, उसे और भी जल्दी करो।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कौर।” यूनानी शब्द ψωμίον भोजन के एक छोटे टुकड़े को दर्शाता है; यहाँ संभवतः वह रोटी का टुकड़ा है जो भोजन के समय डुबोकर दिया गया था।
    reason: lexical_alternative
  - marker: b
    text: या “जल्दी करो।” यूनानी τάχιον तुलनात्मक रूप है, इसलिए मुख्य पाठ में “और भी जल्दी” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: रोटी का टुकड़ा
  rationale: यह शब्द भोजन के एक छोटे टुकड़े को दर्शाता है; प्रसंग में यह संभवतः भोजन के समय दिया गया डुबोया हुआ रोटी का टुकड़ा है। यह अनुवाद ठोस, स्पष्ट और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: उसमें प्रवेश कर गया
  rationale: εἰσέρχομαι के साथ εἰς और कर्मकारक का सीधा अर्थ बनाए रखता है और शैतान के व्यक्तिगत प्रवेश की भाषा को न तो रूपक बनाता है, न उसकी व्याख्या बढ़ाता है।
- source_word: ὁ Σατανᾶς
  choice: शैतान
  rationale: नए नियम के इस नाम/उपाधि का हिन्दी में प्रचलित और सहज रूप।
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: तब यीशु ने उससे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथात्मक भूतकाल में दिया गया है; οὖν यहाँ घटनाक्रम के परिणाम अथवा अगले कदम को जोड़ता है, जिसके लिए ‘तब’ सहज है।
- source_word: Ὃ ποιεῖς
  choice: जो तुम कर रहे हो
  rationale: वर्तमानकालीन ποιεῖς की जारी या तत्काल क्रिया को सुरक्षित रखता है; ‘जो तुम करने वाले हो’ कहना अनावश्यक भावी व्याख्या जोड़ता।
- source_word: ποίησον
  choice: करो
  rationale: अओरिस्ट आज्ञार्थक की निर्णायक और संक्षिप्त आज्ञा को सीधे तथा स्वाभाविक रूप में व्यक्त करता है।
- source_word: τάχιον
  choice: और जल्दी
  rationale: तुलनात्मक रूप की बारीकी को बनाए रखता है; केवल ‘जल्दी’ कहने से उसका तुलनात्मक बल खो जाता।
theological_decisions:
- issue: यहूदा के प्रति शैतान की क्रिया का स्वरूप
  choice: सीधी अभिव्यक्ति ‘शैतान उसमें प्रवेश कर गया’ बनाए रखी गई।
  alternative: ‘शैतान ने उसे अपने वश में कर लिया’ अथवा ‘यहूदा ने अपने आपको शैतान के अधीन कर दिया।’
  rationale: मूल पाठ व्यक्तिगत शैतानी प्रवेश कहता है, पर नियंत्रण या अधीनता की विस्तृत व्याख्या नहीं करता। सीधा अनुवाद कथन की धार्मिक गंभीरता और तनाव को बिना अतिरिक्त सिद्धान्त जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘प्रवेश कर गया’ मूल की प्रत्यक्ष भाषा को सुरक्षित रखता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न शामिल हैं।
