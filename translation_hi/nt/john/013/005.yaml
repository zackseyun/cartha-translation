base_translation:
  language: en
  yaml_path: translation/nt/john/013/005.yaml
  text: Then he pours water into the washbasin[b][a], and began to wash the disciples’ feet and to wipe them with the towel with which he was girded.
translation:
  language: hi
  text: फिर वह धोने के पात्र[a] में पानी डालता है और चेलों के पैर धोने और उस अंगोछे से पोंछने लगा, जिसे उसने कमर में बाँध रखा था।
  philosophy: optimal-equivalence
  footnotes:
