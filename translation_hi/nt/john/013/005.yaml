    text: या ‘धोने की परात।’ यूनानी शब्द धोने के काम आने वाले पात्र को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: फिर
  rationale: कथा में अगली क्रिया का स्वाभाविक क्रम दर्शाता है।
- source_word: βάλλει ὕδωρ
  choice: पानी डालता है
  rationale: पानी को पात्र में रखने की क्रिया के लिए आधुनिक हिन्दी का स्वाभाविक प्रयोग है; ऐतिहासिक वर्तमान भी सुरक्षित रहता है।
- source_word: νιπτῆρα
  choice: धोने का पात्र
  rationale: यह शब्द धोने के लिए प्रयुक्त पात्र को दर्शाता है; सामान्य पाठक के लिए अर्थ स्पष्ट रखते हुए पात्र के आकार या सामग्री को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἤρξατο νίπτειν
  choice: धोने ... लगा
  rationale: आरम्भसूचक यूनानी रचना का सहज हिन्दी समतुल्य है।
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: चेलों के पैर
  rationale: सम्बन्धवाचक यूनानी पदबंध का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: ἐκμάσσειν
  choice: पोंछने
  rationale: क्रिया पोंछकर सुखाने का भाव रखती है; 'पोंछने' मूल क्रिया के निकट और सन्दर्भ में स्वाभाविक है।
- source_word: τῷ λεντίῳ
  choice: उस अंगोछे से
  rationale: लम्बे कपड़े या तौलिया-जैसे सेवा-वस्त्र के लिए 'अंगोछा' सहज हिन्दी है और अगली कमर में बाँधने की क्रिया से मेल खाता है।
- source_word: ᾧ ἦν διεζωσμένος
  choice: जिसे उसने कमर में बाँध रखा था
  rationale: पूर्णकालिक परिधीय रचना की विद्यमान अवस्था और कमर कसने/बाँधने के यूनानी मुहावरे को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
