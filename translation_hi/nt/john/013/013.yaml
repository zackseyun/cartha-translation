  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: hi
  text: तुम मुझे ‘गुरु’ और ‘प्रभु’[a] कहते हो, और ठीक कहते हो, क्योंकि मैं वैसा ही हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वामी।” यूनानी शब्द κύριος अधिकार या प्रभुता रखने वाले व्यक्ति के लिए प्रयुक्त हो सकता है; यहाँ मुख्य पाठ में उपाधि के रूप में “प्रभु” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνεῖτέ
  choice: कहते हो
  rationale: इस द्विकर्मक संरचना में किसी को किसी उपाधि से पुकारने या कहने का भाव है। हिंदी में “मुझे ‘गुरु’ और ‘प्रभु’ कहते हो” स्वाभाविक और सीधा है।
- source_word: Ὁ διδάσκαλος
  choice: गुरु
  rationale: διδάσκαλος का अर्थ सिखाने वाला या शिक्षक है। यीशु के लिए संबोधनात्मक उपाधि के रूप में “गुरु” आधुनिक हिंदी में स्वाभाविक, सम्मानपूर्ण और संक्षिप्त है।
- source_word: Ὁ κύριος
  choice: प्रभु
  rationale: κύριος यहाँ अधिकार और प्रभुता सूचित करने वाली उपाधि है। “प्रभु” नए नियम में इस मसीही उपाधि का सुविख्यात हिंदी रूप है; सामाजिक अर्थ वाला “स्वामी” पादटिप्पणी में दिया गया है।
- source_word: καλῶς λέγετε
  choice: ठीक कहते हो
  rationale: यह पदसमूह उनके कथन की सत्यता की पुष्टि करता है। “ठीक कहते हो” आधुनिक हिंदी में स्वाभाविक है और λέγετε के वाचिक भाव को भी बनाए रखता है।
- source_word: εἰμὶ γάρ
  choice: क्योंकि मैं वही हूँ
  rationale: 'यूनानी में विधेय संदर्भ से समझा जाता है: यीशु पुष्टि करते हैं कि वे सचमुच गुरु और प्रभु हैं। केवल “क्योंकि मैं हूँ” हिंदी में अधूरा और भ्रामक लगेगा; “वही” इस निहित संदर्भ को बिना अनावश्यक विस्तार के स्पष्ट करता है।'
theological_decisions:
- issue: यीशु के लिए κύριος की उपाधि
  choice: प्रभु
  alternative: स्वामी
  rationale: “प्रभु” इस पद की अधिकार और प्रभुता संबंधी व्यापकता तथा नए नियम में इसके मसीही महत्व को बनाए रखता है। “स्वामी” संभव है, पर वह यहाँ अर्थ को सामाजिक स्वामित्व या मानवीय वरिष्ठता तक सीमित सुनाई दे सकता है।
- issue: εἰμὶ में निहित विधेय
  choice: मैं वही हूँ
  alternative: मैं हूँ
  rationale: संदर्भ में यीशु “गुरु” और “प्रभु” दोनों उपाधियों की सत्यता स्वीकार करते हैं। “वही” हिंदी में इस निहित विधेय को स्वाभाविक ढंग से लौटाता है, जबकि इसे निर्गमन 3:14 जैसे स्वतंत्र दैवी नाम की ओर अनावश्यक रूप से नहीं मोड़ता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। उद्धरण-चिह्न दोनों उपाधियों को स्पष्ट करते हैं। “ठीक कहते हो” बोलचाल की सहजता और मूल के λέγετε—“कहते हो”—दोनों को बनाए रखता है।
