review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the two titles, the affirmation καλῶς λέγετε, and the causal γάρ. However, “मैं वही हूँ” can sound as though Jesus identifies himself as a particular previously specified person or object. The Greek εἰμί is elliptical, affirming that he truly is what they call him—Teacher and Lord. “मैं वैसा ही हूँ” conveys that contextual predicate more naturally without turning the phrase into a separate divine-name formula.
  naturalness: “तुम मुझे ‘गुरु’ और ‘प्रभु’ कहते हो, और ठीक कहते हो” is clear, idiomatic modern Hindi. “क्योंकि मैं वैसा ही हूँ” is more idiomatic and contextually precise than “क्योंकि मैं वही हूँ.”
  terminology: “गुरु” is an appropriate respectful title for διδάσκαλος in this context, and “प्रभु” suitably retains κύριος as a title. The footnote’s “स्वामी” appropriately supplies the lexical alternative without displacing the main rendering.
  issues:
  - severity: low
    issue: The phrase “मैं वही हूँ” is potentially referentially vague.
    rationale: In Hindi, “वही” commonly points to a previously identified person or thing. Here εἰμί affirms the two preceding titles; “वैसा ही” better represents the elliptical predication in natural Hindi.
  revised_text: तुम मुझे ‘गुरु’ और ‘प्रभु’[a] कहते हो, और ठीक कहते हो, क्योंकि मैं वैसा ही हूँ।
