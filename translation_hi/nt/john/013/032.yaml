  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: hi
  text: यदि परमेश्वर उसमें महिमान्वित हुआ[a][c], तो परमेश्वर भी उसे अपने आप में महिमान्वित करेगा[b], और उसे तुरन्त महिमान्वित करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि परमेश्वर उसमें महिमान्वित हुआ।” यूनानी में ‘यदि’ है, यद्यपि प्रसंग में यह शर्त सम्भवतः सत्य मानी गई है।
    reason: alternative_reading
  - marker: b
    text: “अपने आप में” का अर्थ यहाँ “अपने साथ” या “स्वयं” भी समझा जा सकता है; यूनानी अभिव्यक्ति संक्षिप्त और अर्थगर्भित है।
    reason: lexical_alternative
  - marker: c
    text: कुछ प्राचीन यूनानी पांडुलिपियों में “यदि परमेश्वर उसमें महिमान्वित हुआ” शब्द नहीं हैं।
    reason: textual_variant
lexical_decisions:
- source_word: εἰ
  choice: यदि
  rationale: यह यूनानी शर्तसूचक अव्यय का सीधा रूप है। प्रसंग में शर्त को सत्य माना गया प्रतीत होता है, फिर भी ‘यदि’ मूल वाक्य की शर्तात्मक बनावट को सुरक्षित रखता है।
- source_word: ἐδοξάσθη
  choice: महिमान्वित हुआ है
  rationale: अकर्मक-भाव वाला यह रूप यूनानी के कर्मवाच्य को बनाए रखता है। हिन्दी का पूर्णकालिक रूप प्रसंग में उस घटना को व्यक्त करता है जो घट चुकी या आरम्भ हो चुकी मानी गई है।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: ἐν का सामान्य अर्थ ‘में’ रखा गया है, ताकि ‘उसके द्वारा’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति न जोड़ी जाए। सर्वनाम का संकेत मनुष्य के पुत्र/यीशु की ओर है।
- source_word: δοξάσει
  choice: महिमान्वित करेगा
  rationale: यह भविष्यकालीन क्रिया उसी δοξάζω शब्द की पुनरावृत्ति है; एक ही हिन्दी शब्द रखने से पद की जानबूझकर की गई शाब्दिक संगति बनी रहती है।
- source_word: ἐν αὑτῷ
  choice: अपने आप में
  rationale: आत्मवाचक सर्वनाम परमेश्वर की ओर लौटता है। ‘अपने आप में’ यूनानी की संक्षिप्त और अर्थगर्भित अभिव्यक्ति को निकटता से सुरक्षित रखता है।
- source_word: εὐθύς
  choice: तुरन्त
  rationale: यह साधारण आधुनिक हिन्दी में क्रिया की तात्कालिकता को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ऐसे प्रसंग में εἰ का बल जहाँ कही गई बात को सत्य माना गया प्रतीत होता है
  choice: मुख्य पाठ में ‘यदि’
  alternative: ‘क्योंकि’ अथवा ‘चूँकि’
  rationale: प्रसंग शर्त की सत्यता का संकेत देता है, पर यूनानी पाठ स्पष्ट कारणसूचक संयोजक के बजाय εἰ का प्रयोग करता है। ‘यदि’ रखने से मूल व्याकरण और निहित निश्चितता के बीच का तनाव बना रहता है।
- issue: ἐν αὑτῷ में परमेश्वर और पुत्र के महिमान्वित होने का संबंध
  choice: ‘अपने आप में’
  alternative: ‘अपने साथ’ अथवा ‘स्वयं’
  rationale: मुख्य पाठ में आत्मवाचक और पूर्वसर्गीय संरचना को यथासम्भव सुरक्षित रखा गया है; अधिक व्याख्यात्मक सम्भावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘महिमान्वित’ को तीनों स्थानों पर दोहराकर यूनानी δοξάζω की प्रमुख शाब्दिक कड़ी सुरक्षित रखी गई है; ‘अपने आप में’ कुछ असामान्य लग सकता है, पर मूल की सघन अभिव्यक्ति और उसकी धर्मवैचारिक खुलावट बनाए रखने के लिए इसे चुना गया है।
