  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: hi
  text: वह भोजन[a] से उठता है, अपने ऊपरी वस्त्र उतारकर रख देता है और एक तौलिया[b] लेकर उसे अपनी कमर में बाँध लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘रात के भोजन से।’
    reason: δεῖπνον मुख्य या संध्याकालीन भोजन के अर्थ में भी आ सकता है; ‘भोजन’ व्यापक और स्वाभाविक है।
  - marker: b
    text: या ‘कपड़ा।’
    reason: λέντιον सेवा के लिए प्रयुक्त लिनन के कपड़े या तौलिये को दर्शाता है; ‘तौलिया’ आधुनिक मानक हिन्दी में अधिक स्पष्ट है।
lexical_decisions:
- source_word: ἐγείρεται ἐκ τοῦ δείπνου
  choice: भोजन से उठता है
  rationale: वर्तमान काल के कथात्मक, सजीव प्रयोग को बनाए रखते हुए ἐκ τοῦ δείπνου को स्वाभाविक हिन्दी में व्यक्त करता है। ‘भोजन’ आधुनिक हिन्दी में किसी विशेष आधुनिक भोजन-समय को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: τίθησιν τὰ ἱμάτια
  choice: अपने ऊपरी वस्त्र उतारकर रख देता है
  rationale: संदर्भ में τίθημι का अर्थ केवल ‘रखना’ नहीं, बल्कि वस्त्र हटाकर अलग रखना है। ἱμάτια यहाँ ऊपरी वस्त्रों को दर्शाता है; यह अनुवाद पूर्ण निर्वस्त्रता का अनुचित संकेत नहीं देता।
- source_word: λαβὼν λέντιον
  choice: एक अँगोछा लेकर
  rationale: λέντιον सेवा के लिए प्रयुक्त कपड़े या तौलिये को दर्शाता है। ‘अँगोछा’ कमर में बाँधे जा सकने वाले ऐसे कपड़े के लिए स्वाभाविक और दृश्यतः उपयुक्त हिन्दी शब्द है।
- source_word: διέζωσεν ἑαυτόν
  choice: उसे अपनी कमर में बाँध लेता है
  rationale: क्रिया का मूल भाव स्वयं को कपड़े से कसना या कमर में बाँधना है। यह आधुनिक पाठक के लिए ‘कमर कसना’ जैसे संभावित मुहावरेदार अर्थ से अधिक स्पष्ट है। हिन्दी में सुगम कथात्मक प्रवाह के लिए मुख्य क्रिया भी सजीव वर्तमान में रखी गई है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी कथात्मक वर्तमान की सजीवता को हिन्दी वर्तमान काल में बनाए रखा गया है। ‘ऊपरी वस्त्र’ प्रसंग की शारीरिक क्रिया को ठीक-ठीक बताता है, और ‘अँगोछा’ को ‘कमर में बाँधना’ सेवा की तैयारी का दृश्य स्पष्ट करता है।
