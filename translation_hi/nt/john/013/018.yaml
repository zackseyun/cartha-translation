language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: hi
  text: '“मैं तुम सबके विषय में नहीं कह रहा हूँ। मैं जानता हूँ कि मैंने किन्हें चुना है। पर यह इसलिए है कि पवित्रशास्त्र पूरा हो: ‘जो मेरी रोटी खाता है, उसने मेरे विरुद्ध अपनी एड़ी उठाई है।’[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह भजन 41:9 का उद्धरण अथवा संकेत है।
    reason: cross_reference
  - marker: b
    text: “एड़ी उठाना” यहाँ विरोध और विश्वासघात का चित्रात्मक मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: मैं तुम सबके विषय में नहीं कह रहा हूँ
  rationale: यह स्वाभाविक आधुनिक हिन्दी में περὶ का ‘के विषय में’ अर्थ और निषेध का दायरा बनाए रखता है।
- source_word: οἶδα
  choice: मैं जानता हूँ
  rationale: οἶδα रूप की दृष्टि से पूर्णकालिक है, पर कोईने यूनानी में यहाँ वर्तमान अर्थ देता है।
- source_word: τίνας ἐξελεξάμην
  choice: मैंने किन लोगों को चुना है
  rationale: यह व्यक्तिगत कर्म और यीशु द्वारा पहले किए गए चुनाव की वर्तमान प्रासंगिकता को स्पष्ट रखता है, पर चुनाव की धर्मवैज्ञानिक प्रकृति तय नहीं करता।
- source_word: ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ
  choice: पर यह इसलिए है कि पवित्रशास्त्र की यह बात पूरी हो
  rationale: यह उद्देश्य अथवा परिणाम के संबंध को स्वाभाविक हिन्दी में व्यक्त करता है और पूर्ति के कथन में अतिरिक्त नियतिवादी कारण नहीं जोड़ता।
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: जो मेरी रोटी खाता है
  rationale: संज्ञात्मक कृदंत को सहज सम्बन्धवाचक वाक्यांश से व्यक्त किया गया है और μου को ἄρτον के साथ ‘मेरी रोटी’ माना गया है।
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: उसने मेरे विरुद्ध अपनी एड़ी उठाई है
  rationale: भजन के उद्धरण की एड़ी उठाने वाली छवि सुरक्षित रखी गई है; इसे केवल ‘विश्वासघात किया’ कहकर सपाट नहीं बनाया गया।
theological_decisions:
- issue: यीशु के चुनाव और विश्वासघाती का संबंध
  choice: ‘मैंने किन लोगों को चुना है’ के रूप में सीधा अनुवाद, बिना यह निश्चित किए कि चुनाव उद्धार के लिए है या प्रेरिताई नियुक्ति के लिए।
  alternative: ऐसी शब्दावली जो यहूदाह को स्पष्टतः उद्धार के चुनाव में शामिल या उससे बाहर ठहराए।
  rationale: यह पद चुनाव की धर्मवैज्ञानिक श्रेणी परिभाषित नहीं करता; इसलिए मूल पाठ का तनाव सुरक्षित रखा गया है।
- issue: ἀλλ’ ἵνα और पवित्रशास्त्र की पूर्ति
  choice: ‘पर यह इसलिए है कि पवित्रशास्त्र की यह बात पूरी हो।’
  alternative: ‘यह इसलिए हुआ क्योंकि पवित्रशास्त्र का पूरा होना अनिवार्य था।’
  rationale: चुना गया रूप पूर्ति की भाषा बनाए रखता है, पर मूल से अधिक कठोर कारणवाद या नियतिवाद नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पवित्रशास्त्र की यह बात’ हिन्दी में उद्धरण की ओर स्वाभाविक संकेत करता है। मूल रूपक को मुख्य पाठ में सुरक्षित रखते हुए उसका अर्थ पाद-टिप्पणी में बताया गया है।
