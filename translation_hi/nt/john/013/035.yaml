  source_fidelity: ‘इसी से’ correctly represents the instrumental/demonstrative force of ἐν τούτῳ. ‘सब जानेंगे’ preserves the future and universal scope of γνώσονται πάντες. ‘तुम मेरे चेले हो’ accurately conveys ἐμοὶ μαθηταί ἐστε, and the conditional clause retains both the conditional force of ἐὰν and the reciprocal sense of ἀγάπην ἔχητε ἐν ἀλλήλοις.
  naturalness: The Hindi is clear, modern, and suitably dignified. The conditional future in ‘यदि तुम ... प्रेम रखोगे’ is natural Hindi syntax in relation to the future main clause. The dash gives a readable pause without obscuring the sentence structure.
  terminology: ‘चेले’ is an established, intelligible Hindi Gospel rendering for μαθηταί and retains the teacher-disciple relationship. ‘प्रेम’ appropriately renders ἀγάπη without importing interpretive or denominational wording.
