  text: ἐν τούτῳ γνώσονται πάντες ὅτι ἐμοὶ μαθηταί ἐστε, ἐὰν ἀγάπην ἔχητε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: hi
  text: इसी से सब जानेंगे कि तुम मेरे चेले हो—यदि तुम एक-दूसरे से प्रेम रखोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: इसी से
  rationale: यह पदबंध यहाँ साधन अथवा पहचान के प्रमाण की ओर संकेत करता है। ‘इसी से’ स्वाभाविक हिन्दी में उसी बल को व्यक्त करता है।
- source_word: γνώσονται
  choice: जानेंगे
  rationale: भविष्यकालीन क्रिया यहाँ किसी तथ्य को जानने या पहचान लेने का भाव रखती है; ‘जानेंगे’ व्यापक और सहज अनुवाद है।
- source_word: πάντες
  choice: सब
  rationale: यूनानी बहुवचन का आशय सार्वभौमिक और लिंग-समावेशी है; ‘सब’ इसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: तुम मेरे चेले हो
  rationale: सम्प्रदान कारक ἐμοὶ यहाँ सम्बन्ध अथवा अधिकार का भाव देता है। ‘मेरे चेले’ शिक्षक का अनुसरण करने और उससे सीखने वाले सम्बन्ध को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἐὰν
  choice: यदि
  rationale: यह सम्भावनार्थक क्रिया के साथ शर्त प्रस्तुत करता है; ‘यदि’ यूनानी संरचना को सीधे बनाए रखता है।
- source_word: ἀγάπην ἔχητε ἐν ἀλλήλοις
  choice: तुम एक-दूसरे से प्रेम रखोगे
  rationale: शाब्दिक भाव ‘एक-दूसरे के बीच प्रेम रखना’ है। ‘एक-दूसरे से प्रेम रखना’ पारस्परिक प्रेम को सहज हिन्दी में व्यक्त करता है; भविष्यकाल मुख्य वाक्य के सापेक्ष शर्त की स्वाभाविक हिन्दी अभिव्यक्ति है।
theological_decisions:
- issue: ἐὰν से आरम्भ होने वाली शर्त का स्वरूप
  choice: यदि तुम एक-दूसरे से प्रेम रखोगे
  alternative: जब तुम एक-दूसरे से प्रेम रखोगे
  rationale: ‘यदि’ मूल की शर्त को सुरक्षित रखता है। यह प्रेम को चेला होने की पहचान या प्रमाण के रूप में रखता है, न कि चेलापन अर्जित करने का साधन बनाता है।
- issue: πάντες का लिंग-समावेशी आशय
  choice: सब
  alternative: सब लोग
  rationale: मूल का पुल्लिंग बहुवचन यहाँ केवल पुरुषों तक सीमित नहीं है। ‘सब’ उसके सार्वभौमिक आशय को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में सहज है। ‘चेले’ सामान्य पाठकों के लिए स्पष्ट है और μαθηταί के शिक्षक-अनुयायी सम्बन्ध को बनाए रखता है। मूल की अस्पष्टता को अनावश्यक रूप से नहीं सुलझाया गया; पद में किसी पाद-टिप्पणी की आवश्यकता नहीं समझी गई।
