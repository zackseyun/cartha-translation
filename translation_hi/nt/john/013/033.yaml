id: JHN.13.33
reference: John 13:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: hi
  text: हे प्यारे बच्चो, मैं थोड़ी देर और तुम्हारे साथ हूँ। तुम मुझे ढूँढ़ोगे; और जैसा मैंने यहूदियों[a] से कहा था, ‘जहाँ मैं जा रहा हूँ, वहाँ तुम आने में समर्थ नहीं हो[b],’ वैसा ही अब मैं तुमसे भी कहता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्रसंगों में इसका आशय अधिक विशेष रूप से ‘यहूदी नेताओं’ से हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या अधिक सहज रूप में, ‘तुम नहीं आ सकते।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: हे प्यारे बच्चो
  rationale: यह स्नेहपूर्ण संबोधन है। ‘प्यारे बच्चो’ पारिवारिक रूपक और कोमल भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘छोटे बच्चो’ आयु पर अनावश्यक बल दे सकता है।
- source_word: ἔτι μικρόν
  choice: थोड़ी देर और
  rationale: यह पदबंध शेष बचे थोड़े समय को सूचित करता है। यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: μεθ’ ὑμῶν εἰμι
  choice: मैं ... तुम्हारे साथ हूँ
  rationale: वर्तमान उपस्थिति के सीधे कथन को उसी निकटता और सरलता के साथ रखा गया है।
- source_word: ζητήσετέ με
  choice: तुम मुझे ढूँढ़ोगे
  rationale: ζητέω यहाँ खोजने या तलाश करने के अर्थ में है। ‘ढूँढ़ोगे’ सामान्य पाठक के लिए सहज है और भावी क्रिया को स्पष्ट रखता है।
- source_word: τοῖς Ἰουδαίοις
  choice: यहूदियों
  rationale: मूल शब्द का सीधा अर्थ ‘यहूदियों’ है। यूहन्ना में कभी-कभी इसका संदर्भ यहूदी अगुओं या यहूदिया के अधिकारियों से हो सकता है, पर इस पद में अर्थ को मुख्य पाठ में संकुचित नहीं किया गया।
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: जहाँ मैं जा रहा हूँ
  rationale: ὑπάγω यहाँ जाने या विदा होने को दर्शाता है। ‘जहाँ मैं जा रहा हूँ’ स्वाभाविक हिन्दी है और गंतव्य को जानबूझकर अनिर्दिष्ट रखता है।
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: तुम आने में समर्थ नहीं हो
  rationale: यह रूप δύνασθε में व्यक्त सामर्थ्य या क्षमता की धारणा को स्पष्ट रूप से बनाए रखता है, जबकि हिन्दी में समझने योग्य रहता है।
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: वैसा ही अब मैं तुमसे भी कहता हूँ
  rationale: यह अनुवाद पहले यहूदियों से कही गई बात और अब शिष्यों से कही जा रही बात के बीच तुलना तथा वर्तमान प्रयोग—दोनों को स्पष्ट करता है।
theological_decisions:
- issue: यूहन्ना के प्रसंग में Ἰουδαίοις का अर्थ
  choice: यहूदियों
  alternative: यहूदी अगुओं
  rationale: पद स्वयं संदर्भ को केवल अगुओं तक सीमित नहीं करता। इसलिए मुख्य पाठ मूल की व्यापक अभिव्यक्ति रखता है और संभावित संकुचित संदर्भ को पादटिप्पणी में बताता है।
- issue: οὐ δύνασθε ἐλθεῖν में असमर्थता का स्वरूप
  choice: आने में समर्थ नहीं हो
  alternative: नहीं आ सकते
  rationale: मुख्य पाठ क्षमता या पहुँच की सीमा को औपचारिक रूप से बनाए रखता है, पर यह तय नहीं करता कि असमर्थता भौतिक, कालगत या आध्यात्मिक किस अर्थ में है। अधिक सहज विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्नेहपूर्ण, गंभीर और सीधे संबोधन की शैली रखी गई है। ‘तुम’ निकट शिष्य-समूह के लिए स्वाभाविक है। वाक्य की तुलना-रचना बनाए रखते हुए हिन्दी शब्दक्रम को सहज बनाया गया है।
