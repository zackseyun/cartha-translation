source:
  edition: SBLGNT
  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: hi
  text: फसह के पर्व से पहले यीशु जानते थे कि इस संसार से पिता के पास जाने की उनकी घड़ी आ पहुँची थी। संसार में रहनेवाले अपने लोगों से प्रेम करते आए यीशु ने उनसे अंत तक प्रेम किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरी सीमा तक” अथवा “पूरी तरह।” यूनानी पदबंध अंतिम क्षण तक बने रहनेवाले प्रेम और पूर्ण रूप से किए गए प्रेम—दोनों भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  choice: फसह के पर्व से पहले
  rationale: πρό कालगत पूर्वता बताता है और δέ केवल हल्का कथानक-संयोजक है; इसलिए अनावश्यक ‘अब’ या प्रबल विरोधसूचक शब्द जोड़े बिना स्वाभाविक हिन्दी दी गई है। ἑορτή का पर्व-संबंधी अर्थ स्पष्ट रखा गया है।
- source_word: εἰδὼς
  choice: जानते थे
  rationale: यह कृदन्त उस समय यीशु की सचेत जानकारी व्यक्त करता है। हिन्दी में आदरसूचक बहुवचन के साथ यह स्वाभाविक है।
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: उनकी वह घड़ी आ पहुँची है
  rationale: यूहन्ना की विशिष्ट ‘घड़ी’ की छवि और उसके निर्णायक, नियत समय का भाव सुरक्षित रखा गया है।
- source_word: ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: जब उन्हें इस संसार से पिता के पास जाना है
  rationale: μεταβαίνω के स्थानांतरण/प्रस्थान के भाव को स्वाभाविक हिन्दी में रखा गया है; ‘पिता’ को ‘उनके पिता’ बनाकर मूल से अधिक स्पष्ट नहीं किया गया।
- source_word: ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: संसार में जो उनके अपने थे, उनसे वह प्रेम करते आए थे
  rationale: ‘उनके अपने’ मूल की संबंधपरक व्यापकता बनाए रखता है और इसे केवल ‘शिष्यों’ तक सीमित नहीं करता। ‘प्रेम करते आए थे’ पूर्ववर्ती और निरंतर प्रेम की पृष्ठभूमि को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς τέλος
  choice: अंत तक
  rationale: यह निकट-शाब्दिक रूप कालगत अंतिम क्षण और प्रेम की पूर्णता—दोनों संभावित अर्थों के लिए खुला रहता है।
- source_word: ἠγάπησεν αὐτούς
  choice: उन्होंने उनसे ... प्रेम किया
  rationale: ἀγαπάω को सीधे ‘प्रेम करना’ से व्यक्त किया गया है; ‘प्रेम दिखाया’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचा गया है।
theological_decisions:
- issue: εἰς τέλος में यीशु के प्रेम का कालगत अंत अथवा परिपूर्ण मात्रा
  choice: मुख्य पाठ में ‘अंत तक’
  alternative: ‘पूरी सीमा तक’ या ‘पूरी तरह’
  rationale: यूनानी पदबंध कालगत स्थिरता और गुणात्मक पूर्णता दोनों का संकेत दे सकता है। मुख्य पाठ जानबूझकर इस यूहन्नाई अर्थ-समृद्धि को खुला रखता है और वैकल्पिक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। यीशु के लिए प्रचलित आदरसूचक बहुवचन का प्रयोग हुआ है। मूल यूनानी के एक लंबे वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, पर उसके तर्कक्रम—ज्ञान, पूर्व प्रेम और चरम प्रेम—को सुरक्षित रखा गया है।
