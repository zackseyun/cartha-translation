source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: hi
  text: पतरस ने उससे कहा, “प्रभु, मैं अभी आपके पीछे क्यों नहीं चल सकता? मैं आपके लिए अपना प्राण दे दूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: ने कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर हिन्दी कथात्मक शैली में भूतकाल अधिक स्वाभाविक है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यह आदरपूर्ण संबोधन है और यीशु के लिए प्रयुक्त शब्द का संभावित धर्मवैज्ञानिक भार भी बनाए रखता है।
- source_word: σοι ἀκολουθῆσαι
  choice: आपके पीछे चल सकता
  rationale: यह अभिव्यक्ति वास्तविक रूप से साथ जाने और शिष्य के रूप में अनुसरण करने—दोनों अर्थ-स्तरों को सुरक्षित रखती है।
- source_word: ἄρτι
  choice: अभी
  rationale: यह वर्तमान क्षण की तात्कालिकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὴν ψυχήν μου
  choice: अपना प्राण
  rationale: यहाँ ψυχή मृत्यु तक स्वयं को अर्पित करने के अर्थ में जीवन को सूचित करता है; ‘प्राण देना’ हिन्दी का स्वाभाविक मुहावरा है।
- source_word: ὑπὲρ σοῦ
  choice: आपके लिए
  rationale: यह लाभ, खातिर या प्रतिनिधिकता की संभावित छायाओं को अनावश्यक रूप से सीमित किए बिना खुला रखता है।
- source_word: θήσω
  choice: दे दूँगा
  rationale: ψυχή के साथ τίθημι का मुहावरेदार अर्थ अपना जीवन न्योछावर करना है; हिन्दी में ‘प्राण दे देना’ इसका स्वाभाविक समतुल्य है।
theological_decisions:
- issue: ψυχή का अर्थ
  choice: ‘प्राण’ के रूप में अनुवाद
  alternative: ‘आत्मा’ या ‘जीवन’
  rationale: संदर्भ में पतरस यीशु के लिए मरने की तत्परता जता रहा है। ‘आत्मा’ अनावश्यक रूप से तत्त्वमीमांसात्मक अर्थ देता, जबकि ‘प्राण देना’ मृत्यु में जीवन अर्पित करने का स्पष्ट और स्वाभाविक हिन्दी मुहावरा है।
- issue: ἀκολουθέω की अर्थ-छाया
  choice: ‘पीछे चलना’
  alternative: ‘साथ जाना’ या ‘अनुसरण करना’
  rationale: यूहन्ना के संदर्भ में क्रिया स्थानगत रूप से साथ जाने और शिष्यत्व में अनुसरण करने, दोनों की ओर संकेत कर सकती है। ‘पीछे चलना’ दोनों स्तरों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; पतरस द्वारा यीशु को आदरपूर्वक संबोधित करने के लिए ‘आप’ का प्रयोग। वाक्य सरल, मौखिक और गरिमापूर्ण रखा गया है।
