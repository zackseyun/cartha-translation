  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: hi
  text: ये बातें कहने के बाद यीशु आत्मा में व्याकुल हुए और गवाही देकर कहा, “मैं तुमसे सच-सच कहता हूँ, तुममें से एक मुझे सौंप देगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे पकड़वा देगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: ये बातें कहने के बाद
  rationale: कालसूचक कृदन्त को स्वाभाविक हिन्दी में व्यक्त करता है और घटनाक्रम का क्रम बनाए रखता है।
- source_word: ἐταράχθη τῷ πνεύματι
  choice: आत्मा में व्याकुल हुए
  rationale: τῷ πνεύματι को क्षेत्र अथवा संबंध के दत्तिव के रूप में रखते हुए यीशु की वास्तविक भीतरी व्याकुलता व्यक्त होती है; यूनानी से अधिक तीव्रता नहीं जोड़ी गई।
- source_word: ἐμαρτύρησεν καὶ εἶπεν
  choice: उन्होंने गंभीरता से कहा
  rationale: यहाँ μαρτυρέω कथन की गंभीर और साक्ष्यपूर्ण पुष्टि दर्शाता है। शब्दशः ‘गवाही दी और कहा’ आधुनिक हिन्दी में अस्वाभाविक और दोहरावपूर्ण लगता; ‘गंभीरता से कहा’ प्रसंगगत बल को सहज रूप में व्यक्त करता है।
- source_word: Ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: यूहन्ना में प्रयुक्त दोहरे बलाघाती सूत्र की पुनरावृत्ति और गंभीर आश्वासन दोनों को प्रचलित बाइबलीय हिन्दी में सुरक्षित रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: मूल कथन की प्रत्यक्षता और शिष्यों को किए गए संबोधन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἷς ἐξ ὑμῶν
  choice: तुममें से एक
  rationale: अंशवाचक यूनानी अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: παραδώσει με
  choice: मुझे पकड़वा देगा
  rationale: परम शत्रुओं के हाथ सौंपने के विश्वासघाती कार्य को आधुनिक हिन्दी में स्पष्ट करता है, साथ ही ‘धोखा देगा’ की अपेक्षा मूल के ‘हवाले करने’ वाले अर्थ के निकट रहता है। अधिक शब्दशः विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: यीशु की भीतरी व्याकुलता
  choice: आत्मा में व्याकुल हुए
  alternative: अपने मन में व्याकुल हुए; आत्मा में बहुत व्याकुल हुए
  rationale: यह यीशु की वास्तविक मानवीय भावात्मक व्यथा को बिना घटाए रखता है, पर ‘बहुत’ जैसी अनुल्लिखित तीव्रता या ‘मन’ जैसी व्याख्यात्मक सीमाबद्धता नहीं जोड़ता।
- issue: विश्वासघात की भविष्यवाणी में παραδίδωμι
  choice: मुझे पकड़वा देगा
  alternative: मुझे सौंप देगा; मेरे साथ विश्वासघात करेगा
  rationale: तात्कालिक प्रसंग में कार्य विश्वासघाती है, पर क्रिया का मूल चित्र किसी को दूसरों के अधिकार में सौंपना है। ‘पकड़वा देगा’ दोनों पहलुओं को संक्षेप में संप्रेषित करता है; अधिक शब्दशः रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानसूचक बहुवचन क्रियाओं के साथ। भाषा गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखी गई है। ‘सच-सच’ यूहन्ना के विशिष्ट दोहरे ‘आमीन’ सूत्र की पुनरावृत्ति सुरक्षित रखता है।
