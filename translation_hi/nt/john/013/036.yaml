source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: hi
  text: शमौन पतरस उससे कहता है, “प्रभु, आप कहाँ जा रहे हैं?” यीशु ने उत्तर दिया, “जहाँ मैं जा रहा हूँ, वहाँ अभी तुम मेरे पीछे नहीं चल सकते[a], लेकिन बाद में तुम मेरे पीछे चलोगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “तुम अभी मेरे पीछे चलने में समर्थ नहीं हो।” यूनानी में सामर्थ्य बताने वाली क्रिया स्पष्ट रूप से प्रयुक्त हुई है।
    reason: lexical_alternative
  - marker: b
    text: “बाद में तुम मेरे पीछे चलोगे” पतरस के बाद में यीशु के दुःख या मृत्यु में सहभागी होने की ओर संकेत कर सकता है; पर इन शब्दों में यह स्पष्ट नहीं किया गया कि वह किस प्रकार पीछे चलेगा।
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει
  choice: कहता है
  rationale: यूहन्ना के वर्णन में प्रयुक्त यूनानी ऐतिहासिक वर्तमान को बनाए रखता है और संवाद को सजीव बनाता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: सीधे संबोधन में आदर और κύριος की उपाधिगत तथा धर्मवैज्ञानिक गूँज—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ποῦ ὑπάγεις / Ὅπου ὑπάγω
  choice: आप कहाँ जा रहे हैं / जहाँ मैं जा रहा हूँ
  rationale: ὑπάγω के सामान्य गमन-अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है और प्रश्न तथा उत्तर के बीच की शब्दगत कड़ी बनाए रखता है।
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: संवाद में यूनानी भूतकालीन क्रिया का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: अभी तुम मेरे पीछे नहीं चल सकते
  rationale: δύναμαι में निहित सामर्थ्य की स्पष्ट धारणा को बनाए रखते हुए ἀκολουθέω μοι को स्वाभाविक हिन्दी ‘मेरे पीछे चलना’ से व्यक्त करता है।
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: लेकिन बाद में तुम मेरे पीछे चलोगे
  rationale: भविष्यकाल को सुरक्षित रखता है; δέ का विरोधसूचक भाव ‘लेकिन’ और ὕστερον का कालगत अर्थ ‘बाद में’ द्वारा व्यक्त होता है।
theological_decisions:
- issue: पतरस के भविष्य में यीशु के पीछे चलने का आशय
  choice: मुख्य पाठ यह निर्दिष्ट नहीं करता कि यह भविष्यवाणी पतरस की शहादत, पुनर्स्थापना के बाद की शिष्यता, या मृत्यु और महिमा में यीशु के पीछे जाने की ओर संकेत करती है।
  alternative: इसे मुख्य पाठ में विशेष रूप से पतरस की शहादत या उसकी बाद की सेवकाई का संदर्भ बताना।
  rationale: यूनानी पाठ केवल यह कहता है कि पतरस अभी पीछे नहीं चल सकता, पर बाद में चलेगा। इसलिए अनुवाद मूल कथन का खुलापन और धर्मवैज्ञानिक तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। पतरस के संबोधन में आदरसूचक ‘आप’ और यीशु के उत्तर में निकटता तथा अधिकार व्यक्त करने वाला ‘तुम’ रखा गया है। ‘मेरे पीछे चलना’ शिष्यता और संभावित दुःख अथवा मृत्यु—दोनों अर्थों के लिए आवश्यक खुलापन बनाए रखता है।
