source:
  edition: SBLGNT
  text: ἔρχεται οὖν πρὸς Σίμωνα Πέτρον. ⸀λέγει ⸀αὐτῷ· Κύριε, σύ μου νίπτεις τοὺς πόδας;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/006.yaml
  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: hi
  text: तब वह शमौन पतरस के पास आता है। पतरस उससे कहता है, “प्रभु[a], क्या आप मेरे पैर धो रहे हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “महोदय।” यूनानी शब्द κύριε एक सम्मानसूचक संबोधन भी हो सकता है; यहाँ मुख्य पाठ में “प्रभु” रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: आता है
  rationale: यूहन्ना की सजीव कथन-शैली में प्रयुक्त ऐतिहासिक वर्तमान को वर्तमान काल में रखा गया है; πρός के साथ यह पतरस की ओर आने को व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से कथा की प्रगति और परिणामसूचक संबंध दोनों बनाए रखता है।
- source_word: πρὸς Σίμωνα Πέτρον
  choice: शमौन पतरस के पास
  rationale: πρός के साथ कर्मकारक किसी व्यक्ति की ओर गति दर्शाता है; हिन्दी में ‘के पास’ स्वाभाविक है।
- source_word: λέγει αὐτῷ
  choice: पतरस उससे कहता है
  rationale: ऐतिहासिक वर्तमान बनाए रखा गया है। यूनानी में कर्ता निहित है; उद्धृत प्रश्न से स्पष्ट है कि पतरस यीशु से बोलता है, इसलिए हिन्दी में भ्रम से बचने के लिए उसका नाम दिया गया है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यह सम्मानसूचक संबोधन और यूहन्ना के सुसमाचार में संभावित मसीही गहराई—दोनों को बनाए रखता है।
- source_word: σύ
  choice: आप
  rationale: स्पष्ट यूनानी सर्वनाम पर बल है। आदरसूचक ‘आप’ और प्रश्न की संरचना पतरस के आश्चर्य को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: μου
  choice: मेरे
  rationale: सम्बन्धकारक सर्वनाम को हिन्दी में स्वाभाविक अधिकारसूचक रूप दिया गया है।
- source_word: νίπτεις
  choice: धो रहे हैं
  rationale: νίπτω शरीर के किसी अंग को धोने के लिए प्रयुक्त है; अपूर्ण वर्तमान क्रिया तत्काल चल रही क्रिया और पतरस के चकित प्रश्न के अनुकूल है।
- source_word: τοὺς πόδας
  choice: पैर
  rationale: आधुनिक सामान्य हिन्दी में ‘पैर’ सहज है और μου के साथ ‘मेरे पैर’ यूनानी भाव को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: पतरस द्वारा यीशु के लिए κύριε संबोधन
  choice: प्रभु
  alternative: महोदय
  rationale: ‘प्रभु’ सम्मानपूर्ण संबोधन के साथ यूहन्ना के मसीह-विषयक संकेत को खुला रखता है; फिर भी κύριε केवल शिष्ट संबोधन के अर्थ में भी प्रयुक्त हो सकता है, इसलिए विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यूनानी के दोनों ऐतिहासिक वर्तमान रूप हिन्दी में वर्तमान काल द्वारा सुरक्षित हैं। ‘पतरस’ को दूसरे वाक्य में स्पष्ट किया गया है, क्योंकि हिन्दी में केवल सर्वनाम रखने से वक्ता अनावश्यक रूप से अस्पष्ट हो जाता।
