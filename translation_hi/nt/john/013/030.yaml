base_translation:
  language: en
  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: hi
  text: तब रोटी का टुकड़ा लेने के बाद वह तुरंत बाहर चला गया। और रात थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वास्तविक समय का उल्लेख है; साथ ही यह यूहन्ना के सुसमाचार में प्रकाश और अंधकार की विषय-वस्तु की ओर भी संकेत कर सकता है।
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν οὖν
  choice: इसलिए … लेते ही
  rationale: οὖν पिछले कथन से परिणाम और कथा की प्रगति दिखाता है; क्रिया-विशेषणीय aorist participle λαβών मुख्य क्रिया से पहले की क्रिया बताता है। हिन्दी में ‘लेते ही’ क्रम के साथ εὐθύς की तत्परता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ ψωμίον
  choice: रोटी का टुकड़ा
  rationale: ψωμίον भोजन में दिया गया रोटी या खाने का छोटा टुकड़ा है। यह चयन स्पष्ट और आधुनिक है तथा केवल ‘निवाला’ कहकर पदार्थ को अनिश्चित नहीं करता।
- source_word: ἐκεῖνος
  choice: वह
  rationale: ἐκεῖνος संकेतवाचक और कुछ बलयुक्त है। हिन्दी में पहले से पहचाने गए यहूदा के लिए ‘वह’ स्वाभाविक है; ‘वह व्यक्ति’ यहाँ अनावश्यक रूप से कठोर और अप्राकृतिक लगेगा।
- source_word: ἐξῆλθεν εὐθύς
  choice: तुरंत बाहर चला गया
  rationale: ἐξῆλθεν बाहर जाने की स्थानिक धारणा रखता है और εὐθύς तत्कालता बताता है। ‘तुरंत बाहर चला गया’ दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ἦν δὲ νύξ
  choice: उस समय रात थी
  rationale: यह सरल काल-सूचक कथन है। हिन्दी में ‘उस समय’ δέ के हल्के कथात्मक संक्रमण को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘रात थी’ मूल की संक्षिप्त साहित्यिक शक्ति बनाए रखता है।
theological_decisions:
- issue: यूहन्ना के संदर्भ में ‘रात’ का संभावित प्रतीकात्मक अर्थ
  choice: 'मुख्य पाठ में इसे वास्तविक समय के कथन के रूप में रखा गया: ‘उस समय रात थी।’'
  alternative: मुख्य पाठ में इसे आध्यात्मिक अंधकार का स्पष्ट प्रतीक बताना।
  rationale: यूहन्ना के सुसमाचार में प्रकाश और अंधकार की विषय-वस्तु के कारण यहाँ प्रतीकात्मक प्रतिध्वनि संभव है, पर यूनानी वाक्य स्वयं केवल रात होने की बात कहता है। अनुवाद उस संभावित दोहरे प्रभाव को खुला रखता है।
- issue: यहूदा के लिए ἐκεῖνος का बल
  choice: स्वाभाविक हिन्दी ‘वह’ रखा गया।
  alternative: ‘वही व्यक्ति’ या ‘उस व्यक्ति ने’।
  rationale: संकेतवाचक बल को हिन्दी संदर्भ और वाक्य-क्रम से समझा जा सकता है। अधिक भारी रूप मूल से अधिक दूरी या निंदा जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गंभीर और कथात्मक शैली। ‘रोटी का टुकड़ा’ सामान्य पाठक के लिए स्पष्ट है। मुख्य पाठ में प्रतीकात्मक अर्थ नहीं जोड़ा गया; उसे पादटिप्पणी में संभावना के रूप में रखा गया है।
