id: JHN.13.10
reference: John 13:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: hi
  text: यीशु ने उससे कहा, “जो नहा चुका है[a], उसे अपने पाँव धोने के सिवा और कोई आवश्यकता नहीं; वह पूरी तरह शुद्ध है। तुम भी शुद्ध हो, पर तुम सब शुद्ध नहीं हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में धोने के लिए दो अलग क्रियाएँ हैं: λούω का अर्थ पूरे शरीर को ‘नहलाना/नहाना’ है, जबकि νίπτω प्रायः पाँव जैसे शरीर के किसी अंग को ‘धोने’ के लिए प्रयुक्त होती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λελουμένος
  choice: जो नहा चुका है
  rationale: यह λούω के पूर्णकालिक कृदंत का स्वाभाविक हिन्दी रूप है। ‘नहा चुका है’ पूरे शरीर के स्नान और उससे उत्पन्न वर्तमान अवस्था—दोनों को व्यक्त करता है।
- source_word: οὐκ ἔχει χρείαν
  choice: उसे ... और कोई आवश्यकता नहीं
  rationale: यह यूनानी मुहावरे का स्पष्ट और स्वाभाविक हिन्दी रूप है; ‘और कोई’ आगे आने वाले एकमात्र अपवाद को सहज बनाता है।
- source_word: εἰ μὴ
  choice: के सिवा
  rationale: यह पिछले निषेध के एकमात्र अपवाद को ठीक प्रकार व्यक्त करता है।
- source_word: τοὺς πόδας νίψασθαι
  choice: अपने पाँव धोने
  rationale: νίπτω प्रायः शरीर के किसी अंग को धोने के लिए आता है। ‘अपने’ एकवचन कर्ता से संबंध स्पष्ट करता है और हिन्दी में स्वाभाविक है।
- source_word: καθαρὸς ὅλος
  choice: पूरी तरह शुद्ध
  rationale: ‘पूरी तरह’ ὅλος की समग्रता को व्यक्त करता है। ‘शुद्ध’ धुलाई से जुड़ी प्रत्यक्ष स्वच्छता और सम्भावित आत्मिक अर्थ—दोनों के लिए खुला रहता है।
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: तुम भी शुद्ध हो
  rationale: यह बहुवचन सम्बोधन और καθαρός की पुनरावृत्ति को बनाए रखता है।
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: पर तुम सब नहीं
  rationale: यह समूह के भीतर अपवाद को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: यीशु ने उससे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथा-शैली में सामान्य भूतकाल से व्यक्त किया गया है।
theological_decisions:
- issue: प्रत्यक्ष धुलाई और प्रतीकात्मक/आत्मिक शुद्धता
  choice: ‘नहा चुका,’ ‘पाँव धोने’ और ‘शुद्ध’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘आत्मिक रूप से शुद्ध’ जोड़ना, अथवा λούω और νίπτω दोनों को एक ही क्रिया ‘धोना’ से व्यक्त करना।
  rationale: पद प्रत्यक्ष और प्रतीकात्मक दोनों स्तरों पर काम करता है। दोनों धुलाई-क्रियाओं का भेद बनाए रखने और ‘शुद्ध’ का अर्थ खुला छोड़ने से मूल की धर्मवैचारिक अर्थ-गहनता सुरक्षित रहती है।
- issue: एकवचन पुल्लिंग कृदंत का सामान्य कथन
  choice: ‘जो नहा चुका है’
  alternative: ‘वह पुरुष जो नहा चुका है’ या केवल ‘नहाया हुआ मनुष्य’।
  rationale: यूनानी रूप व्याकरणतः पुल्लिंग एकवचन है, पर यहाँ सामान्य सिद्धान्त के रूप में प्रयुक्त है। हिन्दी का ‘जो’ एकवचन भाव को स्वाभाविक रूप से रखता है, बिना अनावश्यक रूप से अर्थ को केवल पुरुषों तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली। ‘पाँव’ सामान्य पाठक के लिए सहज है; ‘शुद्ध’ यूहन्ना के प्रत्यक्ष और गहरे प्रतीकात्मक दोनों आशयों को बनाए रखता है।
