  text: ⸀εἰδὼς ὅτι πάντα ⸀ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας, καὶ ὅτι ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
translation:
  language: hi
  text: यीशु यह जानते थे कि पिता ने सब कुछ उनके हाथों में सौंप दिया था, और कि वे परमेश्वर से आए थे[a] और परमेश्वर के पास जा रहे थे[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर से निकलकर आए थे।”
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर के पास वापस जा रहे थे”; यूनानी में केवल “परमेश्वर के पास जा रहे थे” है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: यह जानते थे
  rationale: यह कृदन्त अगले पद की क्रिया की पृष्ठभूमि बताता है। हिन्दी में ‘यह जानते थे कि’ स्वाभाविक है और ज्ञान की विद्यमान अवस्था को व्यक्त करता है।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन की व्यापकता को आधुनिक हिन्दी में सहज और पूर्ण रूप से व्यक्त करता है।
- source_word: ἔδωκεν
  choice: सौंप दिया था
  rationale: ‘देना’ यहाँ अधिकार और उत्तरदायित्व सौंपने के अर्थ में प्रयुक्त है। ‘था’ दृश्य से पहले पूर्ण हुए कार्य को स्पष्ट करता है।
- source_word: εἰς τὰς χεῖρας
  choice: उनके हाथों में
  rationale: मूल का ठोस मुहावरा सुरक्षित रहता है और हिन्दी में अधिकार या नियंत्रण सौंपे जाने का अर्थ स्वाभाविक ढंग से देता है।
- source_word: ὁ πατὴρ
  choice: पिता
  rationale: यूनानी पाठ के उपाधि-रूप ‘पिता’ को बिना कोई ऐसा संबंधवाचक सर्वनाम जोड़े रखा गया है जो मूल में नहीं है।
- source_word: ἀπὸ θεοῦ
  choice: परमेश्वर से
  rationale: मूल पाठ ‘परमेश्वर’ कहता है, ‘पिता’ नहीं। हिन्दी में यह स्रोत या उद्गम को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐξῆλθεν
  choice: आए थे
  rationale: यूहन्ना के प्रसंग में यह उद्गम और आगमन दोनों का संकेत दे सकता है। ‘आए थे’ सहज हिन्दी है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: πρὸς τὸν θεὸν
  choice: परमेश्वर के पास
  rationale: यह परमेश्वर की ओर गति और उनके निकट गंतव्य—दोनों का भाव बनाए रखता है, बिना ‘वापस’ जोड़े।
- source_word: ὑπάγει
  choice: जा रहे थे
  rationale: वर्तमानकालीन रूप को प्रसंगानुकूल अपूर्ण भूतकाल में प्रस्तुत किया गया है, जिससे निकट आती विदाई का भाव बना रहता है।
theological_decisions:
- issue: ἀπὸ θεοῦ ἐξῆλθεν में मसीह के उद्गम की भाषा
  choice: वह परमेश्वर से आए थे
  alternative: वह परमेश्वर से निकलकर आए थे
  rationale: यह रूप यीशु के परमेश्वर से उद्गम और मिशन के कथन को सुरक्षित रखता है, पर पद में स्पष्ट न की गई बाद की धर्मसैद्धान्तिक व्याख्या नहीं जोड़ता।
- issue: πρὸς τὸν θεὸν ὑπάγει में गंतव्य की भाषा
  choice: परमेश्वर के पास जा रहे थे
  alternative: परमेश्वर के पास वापस जा रहे थे
  rationale: संदर्भ लौटने का भाव सुझाता है, लेकिन इस उपवाक्य में ‘वापस’ का अलग शब्द नहीं है। इसलिए मुख्य पाठ मूल की संयमित अभिव्यक्ति और उसकी धर्मवैचारिक गहराई दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाक्य के अंत में अल्पविराम रखा गया है, क्योंकि यूनानी में यह कृदन्तीय पृष्ठभूमि अगले पद की मुख्य क्रिया तक चलती है। आदरसूचक एकवचन के लिए ‘वह/उनके’ का प्रयोग किया गया है।
