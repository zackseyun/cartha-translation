base_translation:
  language: en
  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
translation:
  language: hi
  text: वह इसी तरह यीशु की छाती से लगकर उनसे कहता है, “प्रभु, वह कौन है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναπεσὼν
  choice: पीछे की ओर झुककर
  rationale: भोजन के समय लेटकर बैठने की मुद्रा में यह कृदंत पीछे की ओर झुकने की गति बताता है; निकटवर्ती वाक्यांश के साथ यह स्वाभाविक हिन्दी है।
- source_word: ἐκεῖνος
  choice: वह
  rationale: पूर्वपद में बताए गए शिष्य की ओर संकेत करने वाले सर्वनाम का सीधा और स्वाभाविक अनुवाद।
- source_word: οὕτως
  choice: इसी तरह
  rationale: यह पिछले पद में वर्णित भोजन-मुद्रा से इस क्रिया का संबंध बनाए रखता है।
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: यीशु की छाती से लग गया
  rationale: दिशासूचक ἐπί और भोजन की मुद्रा में हुए शारीरिक झुकाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λέγει αὐτῷ
  choice: उनसे पूछा
  rationale: ऐतिहासिक वर्तमान को हिन्दी कथा-शैली में भूतकाल से व्यक्त किया गया है; प्रश्नवाचक प्रत्यक्ष कथन के कारण ‘पूछा’ अधिक स्वाभाविक है। आदरसूचक ‘उनसे’ यीशु को किए गए संबोधन के अनुरूप है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यह सम्मानसूचक संबोधन और यूहन्ना के व्यापक मसीही अर्थ—दोनों की संभावना खुली रखता है।
- source_word: τίς ἐστιν;
  choice: वह कौन है?
  rationale: प्रश्न उस व्यक्ति की पहचान पूछता है जिसका संकेत यीशु ने किया था; हिन्दी में यह स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: यीशु के लिए सीधे संबोधन में κύριος का अनुवाद
  choice: प्रभु
  alternative: महोदय / स्वामी
  rationale: ‘प्रभु’ सम्मानसूचक संबोधन तथा यूहन्ना के सुसमाचार में निहित अधिक गहरे मसीही आशय—दोनों को बनाए रखता है, बिना किसी एक अर्थ को अनावश्यक रूप से निश्चित किए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। भोजन की प्राचीन मुद्रा पाठकों के लिए तुरंत स्पष्ट न होने के कारण मुख्य पाठ में स्वाभाविक गतिसूचक भाषा और पादटिप्पणी में सांस्कृतिक स्पष्टीकरण दिया गया है।
