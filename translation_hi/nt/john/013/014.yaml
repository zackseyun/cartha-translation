review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the conditional-inferential argument, the completed washing, the reciprocal obligation, and the concrete reference to washing feet. However, “मुझ प्रभु और गुरु ने” is not grammatical Hindi and does not safely convey the Greek appositional titles with the explicit subject pronoun.
  naturalness: The rest of the sentence is clear and suitably dignified. Recasting the subject as “मैंने, जो प्रभु और गुरु हूँ,” produces natural modern Hindi while retaining the Greek emphasis on Jesus’ identity and status.
  terminology: “प्रभु” appropriately renders κύριος as a title, and “गुरु” is a natural, established rendering of διδάσκαλος in this context. The alternative sense of κύριος is retained in an anchored note, corresponding to the English audit trail.
  issues:
  - severity: medium
    issue: Ungrammatical subject/title construction
    rationale: “मुझ प्रभु और गुरु ने” improperly uses the oblique form “मुझ” as the agent of “ने” and leaves the appositional titles syntactically awkward. Greek ἐγὼ ὁ κύριος καὶ ὁ διδάσκαλος requires a grammatical Hindi construction that identifies the speaker as both Lord and Teacher.
  - severity: low
    issue: Alternative-title footnote omitted
    rationale: The English audit trail records a legitimate alternative rendering of κύριος (“Master”). An anchored Hindi note for “प्रभु” preserves this lexical alternative without altering the main-text title.
  revised_text: इसलिए यदि मैंने, जो प्रभु[a] और गुरु हूँ, तुम्हारे पैर धोए हैं, तो तुम्हें भी एक-दूसरे के पैर धोने चाहिए।
