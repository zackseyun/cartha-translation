id: JHN.13.14
reference: John 13:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: hi
  text: इसलिए यदि मैंने, जो प्रभु[a] और गुरु हूँ, तुम्हारे पैर धोए हैं, तो तुम्हें भी एक-दूसरे के पैर धोने चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वामी।” यूनानी κύριος यहाँ यीशु के लिए एक पदवी है; मुख्य पाठ में “प्रभु” रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ οὖν
  choice: इसलिए यदि ... तो
  rationale: εἰ की शर्त और οὖν के निष्कर्षसूचक बल—दोनों को स्वाभाविक हिन्दी तर्क-विन्यास में बनाए रखता है।
- source_word: ἐγὼ
  choice: मुझ
  rationale: स्पष्ट यूनानी सर्वनाम के बल को ‘मुझ प्रभु और गुरु ने’ में बनाए रखा गया है, जिससे यीशु के पद और शिष्यों के दायित्व का विरोध उभरता है।
- source_word: ἔνιψα
  choice: धोए हैं
  rationale: अभी-अभी पूर्ण किए गए कार्य और उसकी वर्तमान प्रासंगिकता को हिन्दी पूर्ण पक्ष स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑμῶν τοὺς πόδας
  choice: तुम्हारे पैर
  rationale: सम्बन्धकारक सर्वनाम और कर्म का सहज, सटीक हिन्दी रूप।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: यहाँ κύριος यीशु की पदवी है; ‘प्रभु’ सामान्य बाइबलीय प्रयोग और प्रसंग में उसके ऊँचे पद को सुरक्षित रखता है।
- source_word: ὁ διδάσκαλος
  choice: गुरु
  rationale: आधुनिक हिन्दी में शिक्षक और आदरणीय मार्गदर्शक की पदवी के रूप में स्वाभाविक है तथा यहाँ यीशु के लिए प्रयुक्त निश्चित उपाधि को व्यक्त करता है।
- source_word: καὶ ὑμεῖς
  choice: तुम्हें भी
  rationale: 'καί और बलयुक्त ὑμεῖς के प्रत्युत्तरात्मक भाव को व्यक्त करता है: जैसा यीशु ने किया, वैसा शिष्यों का भी दायित्व है।'
- source_word: ὀφείλετε
  choice: चाहिए
  rationale: नैतिक दायित्व को सहज हिन्दी में व्यक्त करता है, बिना इसे स्रोत से अधिक कठोर प्रत्यक्ष आज्ञा बनाए।
- source_word: ἀλλήλων
  choice: एक-दूसरे के
  rationale: पारस्परिक सर्वनाम का मानक और स्पष्ट हिन्दी रूप।
- source_word: νίπτειν τοὺς πόδας
  choice: पैर धोने
  rationale: शरीर के किसी अंग को धोने के ठोस कार्य को यथावत रखता है और इसे सामान्यीकृत रूपक में नहीं बदलता।
theological_decisions:
- issue: κύριος को मसीही पदवी के रूप में प्रस्तुत करना
  choice: प्रभु
  alternative: स्वामी
  rationale: प्रसंग में यह यीशु की स्वीकृत पदवी है और उसके ऊँचे पद तथा नम्र कार्य के बीच का तनाव बनाए रखती है।
- issue: पैर धोने के कथन का स्वरूप
  choice: ‘एक-दूसरे के पैर धोने’ के ठोस कार्य को मुख्य पाठ में बनाए रखना
  alternative: ‘नम्रता से एक-दूसरे की सेवा करना’ जैसा सामान्यीकृत अर्थ
  rationale: यूनानी पाठ स्पष्ट रूप से पैर धोने की बात करता है। उसके व्यापक उदाहरणात्मक अर्थ को अनुवाद में उसके स्थान पर नहीं रखा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मुझ प्रभु और गुरु ने’ हिन्दी में कुछ चिह्नित विन्यास है, पर यह ἐγώ के बल और दोनों पदवियों को संक्षेप में सुरक्षित रखता है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई।
