  text: ⸀ἦν ἀνακείμενος εἷς ⸀ἐκ τῶν μαθητῶν αὐτοῦ ἐν τῷ κόλπῳ τοῦ Ἰησοῦ, ὃν ἠγάπα ὁ Ἰησοῦς·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
translation:
  language: hi
  text: उसके चेलों में से एक, जिससे यीशु प्रेम करते थे, यीशु के वक्षस्थल के पास टेक लगाकर लेटा हुआ था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यीशु के वक्ष में।” प्राचीन भोज में लोग टेक लगाकर लेटते थे; यह यीशु के बिल्कुल पास, उनके वक्षस्थल की ओर स्थित होने की मुद्रा बताता है।
    reason: मूल मुहावरे के शाब्दिक रूप और प्राचीन भोज-मुद्रा को स्पष्ट करना
lexical_decisions:
- source_word: ἀνακείμενος
  choice: भोजन के समय ... झुककर बैठा था
  rationale: यह शब्द प्राचीन भोज में मेज़ के पास टेक लगाकर खाने की मुद्रा बताता है। केवल ‘बैठा था’ ऐतिहासिक मुद्रा को खो देता, जबकि ‘लेटा था’ आधुनिक पाठक को भटका सकता है; इसलिए प्रसंग सहित यह स्वाभाविक अभिव्यक्ति चुनी गई।
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: उसके चेलों में से एक
  rationale: यह यूनानी के अंशवाची प्रयोग को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है। ‘चेला’ आधुनिक सामान्य पाठकों के लिए परिचित और सहज है।
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: यीशु के सीने की ओर
  rationale: κόλπος का मूल अर्थ सीने या वक्ष के पास का स्थान है। भोज की टेक लगाकर खाने की व्यवस्था में यह यीशु के बिल्कुल पास और उनकी ओर झुकी स्थिति बताता है। यह अनुवाद मूल बिंब को बनाए रखता है और ‘गोद में’ जैसी भ्रामक धारणा से बचता है।
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: जिससे यीशु प्रेम करते थे
  rationale: सम्बन्धवाचक उपवाक्य और ἀγαπάω के सामान्य अर्थ ‘प्रेम करना’ को सीधे तथा गरिमापूर्ण हिन्दी में रखा गया है।
theological_decisions:
- issue: प्रिय चेले की यीशु के सापेक्ष स्थिति
  choice: मुख्य पाठ में ‘यीशु के सीने की ओर झुककर’ रखकर मूल शारीरिक बिंब और भोज की मुद्रा दोनों प्रकट करना
  alternative: यीशु के बिल्कुल पास बैठा था; यीशु की छाती से लगा हुआ था
  rationale: वाक्य मुख्यतः भोज के स्थान-विन्यास का वर्णन करता है, फिर भी κόλπος का विशिष्ट बिंब यूहन्ना के लेखन में अर्थपूर्ण है। चुना हुआ रूप न तो इसे रहस्यात्मक एकता के दावे में बदलता है, न इसकी शब्दगत प्रतिध्वनि मिटाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। प्राचीन भोज की मुद्रा समझाने के लिए मुख्य पाठ में संक्षिप्त प्रसंगसूचक शब्द रखे गए हैं और शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
