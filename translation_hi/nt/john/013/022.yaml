lexical_decisions:
- source_word: ἔβλεπον
  choice: देख रहे थे
  rationale: अपूर्ण भूतकाल चलती हुई क्रिया को व्यक्त करता है; यह रूप दृश्य की निरंतरता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἰς ἀλλήλους
  choice: एक-दूसरे की ओर
  rationale: यह परस्पर दृष्टि डालने का भाव व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οἱ μαθηταὶ
  choice: चेले
  rationale: निश्चित पद संदर्भ में पहले से ज्ञात समूह को दर्शाता है; ‘चेले’ सामान्य पाठक के लिए सहज और बाइबिलीय कथाशैली के अनुरूप है, जबकि मूल में ‘उसके’ नहीं है।
- source_word: ἀπορούμενοι
  choice: समझ नहीं पा रहे थे
  rationale: कृदन्त असमंजस और अनिश्चितता की अवस्था बताता है; यह वाक्यांश उसी भाव को सरल, वर्तमान हिन्दी में प्रकट करता है।
- source_word: περὶ τίνος
  choice: किसके विषय में
  rationale: περί के साथ संबंधवाचक प्रश्न किसी व्यक्ति के विषय में पूछता है; यह अनुवाद अर्थ को स्पष्ट रखता है।
- source_word: λέγει
  choice: कह रहे हैं
  rationale: यूनानी में वर्तमान काल है। हिन्दी के अप्रत्यक्ष कथन में इसे बनाए रखने से कथात्मक वर्तमान की निकटता और मूल की कालगत बनावट सुरक्षित रहती है; बोलने वाले के आदरसूचक एकवचन के अनुरूप बहुवचन क्रिया प्रयुक्त है।
