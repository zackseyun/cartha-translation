  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: hi
  text: 'मैं तुम्हें एक नई आज्ञा देता हूँ: कि तुम एक-दूसरे से प्रेम करो। जैसे मैंने तुमसे प्रेम किया, वैसे ही तुम भी एक-दूसरे से प्रेम करो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολὴν καινὴν
  choice: एक नई आज्ञा
  rationale: ‘आज्ञा’ ἐντολή के औपचारिक और नैतिक बल को स्वाभाविक हिन्दी में व्यक्त करती है; ‘नई’ καινήν की अनिर्धारित नवीनता को बिना व्याख्यात्मक विस्तार के बनाए रखती है।
- source_word: δίδωμι ὑμῖν
  choice: मैं तुम्हें ... देता हूँ
  rationale: वर्तमान काल और प्राप्तकर्ता-सूचक दत्तिव दोनों को सीधे तथा गरिमापूर्ण हिन्दी में सुरक्षित रखा गया है।
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: तुम एक-दूसरे से प्रेम रखो
  rationale: आज्ञा के विषय और उसके आदेशात्मक बल को हिन्दी के स्वाभाविक आज्ञार्थक रूप में व्यक्त किया गया है।
- source_word: ἀγαπᾶτε / ἠγάπησα
  choice: प्रेम रखो / प्रेम रखा
  rationale: प्रेम-संबंधी मूल शब्दों की पुनरावृत्ति सुरक्षित है; ‘प्रेम रखना’ आधुनिक हिन्दी में व्यक्तियों के प्रति स्थायी प्रेम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀλλήλους
  choice: एक-दूसरे से
  rationale: यह पारस्परिक सर्वनाम का मानक और सहज हिन्दी रूप है।
- source_word: καθὼς
  choice: जैसे ... वैसे ही
  rationale: यह यीशु के प्रेम को शिष्यों के पारस्परिक प्रेम का प्रतिरूप और मानदंड स्पष्ट करता है, बिना उसके आशय का अतिरिक्त विस्तार किए।
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: वैसे ही तुम भी एक-दूसरे से प्रेम रखो
  rationale: καὶ ὑμεῖς के ‘तुम भी’ वाले बल और दूसरे ἵνα-वाक्यांश के आदेशात्मक/परिणामसूचक संबंध को स्वाभाविक हिन्दी में बनाए रखा गया है।
theological_decisions:
- issue: ‘नई आज्ञा’ की नवीनता का स्वरूप
  choice: मुख्य पाठ में केवल ‘एक नई आज्ञा’
  alternative: समय में नई; गुण में नई; अथवा यीशु के प्रेम में नई रीति से साकार हुई आज्ञा
  rationale: यह पद आज्ञा को ‘नई’ कहता है, पर इसी पद में यह निर्धारित नहीं करता कि उसकी नवीनता ठीक किस अर्थ में है; इसलिए अनुवाद इस धार्मिक तनाव को खुला रखता है।
- issue: यीशु के प्रेम और शिष्यों के प्रेम का संबंध
  choice: ‘जैसे ... वैसे ही’ द्वारा प्रतिरूप/तुलना को व्यक्त करना
  alternative: ‘क्योंकि मैंने तुमसे प्रेम रखा’ अथवा केवल ‘जिस प्रकार’
  rationale: καθὼς तुलना और अनुरूपता बताता है; कारणसूचक अर्थ जोड़ना मूल पाठ से अधिक व्याख्यात्मक होता।
- issue: दूसरे ἵνα-वाक्यांश का बल
  choice: आदेशात्मक रूप में ‘वैसे ही तुम भी ... प्रेम रखो’
  alternative: ‘ताकि तुम भी ... प्रेम रखो’
  rationale: व्याकरण उद्देश्य अथवा अपेक्षित परिणाम की छाया की अनुमति देता है, किन्तु आज्ञा की संरचना में हिन्दी का आदेशात्मक रूप अधिक सहज है और καὶ ὑμεῖς का बल सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष शैली। ‘तुम्हें/तुम’ बहुवचन शिष्यों को संबोधित करता है और निकटता बनाए रखता है। मूल पद की पुनरावृत्ति और संतुलित वाक्यरचना को यथासंभव सुरक्षित रखा गया है।
