  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: hi
  text: क्योंकि कुछ लोग यह सोच रहे थे कि, चूँकि यहूदा के पास धन की थैली[a] थी, यीशु उससे कह रहे थे, “पर्व[b] के लिए हमें जिन चीज़ों की ज़रूरत है, वे खरीद लो,” या कि वह गरीबों को कुछ दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धन का बक्सा।” यूनानी शब्द उस पात्र को दर्शाता है जिसमें समूह का धन रखा जाता था।
    reason: lexical_alternative
  - marker: b
    text: इस खंड के संदर्भ में “पर्व” फसह के पर्व से संबंधित है।
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: कुछ लोग
  rationale: यह उपस्थित लोगों में से अनिश्चित संख्या को दर्शाता है; आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἐδόκουν
  choice: सोच रहे थे
  rationale: अपूर्ण भूतकाल उनके उस समय चल रहे अनुमान को व्यक्त करता है।
- source_word: ἐπεὶ
  choice: होने के कारण
  rationale: यह उनके अनुमान का कारण बताता है कि यहूदा के पास सामूहिक धन का पात्र था।
- source_word: γλωσσόκομον
  choice: रुपयों की थैली
  rationale: यह समूह का धन रखने वाले पात्र को दर्शाता है; हिन्दी में यह स्वाभाविक है, जबकि वस्तु का सटीक रूप निश्चित नहीं है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: εἶχεν
  choice: के पास ... होने
  rationale: मूल क्रिया का सामान्य अर्थ ‘पास होना/रखना’ है; धन की देखरेख का भाव संदर्भ से निकलता है।
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: यीशु उससे कह रहे हैं
  rationale: ऐतिहासिक वर्तमान को शिष्यों के अनुमान के भीतर वर्तमानकालीन कथन के रूप में रखना हिन्दी में स्वाभाविक है।
- source_word: Ἀγόρασον
  choice: खरीद लो
  rationale: एक सीधी आज्ञा का सहज आधुनिक हिन्दी रूप।
- source_word: ὧν χρείαν ἔχομεν
  choice: हमें जिन चीज़ों की ज़रूरत है
  rationale: मूल सापेक्ष रचना और आवश्यकता के अर्थ को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: εἰς τὴν ἑορτήν
  choice: पर्व के लिए
  rationale: ἑορτή धार्मिक पर्व को दर्शाता है; पद में ‘फसह’ को स्पष्ट रूप से न जोड़कर संदर्भगत पहचान पादटिप्पणी में रखी गई है।
- source_word: τοῖς πτωχοῖς
  choice: गरीबों को
  rationale: विशेषण का संज्ञात्मक बहुवचन प्रयोग गरीब लोगों को दर्शाता है और ‘दे’ के साथ सीधा बैठता है।
- source_word: ἵνα τι δῷ
  choice: यह कि वह गरीबों को कुछ दे
  rationale: शिष्यों द्वारा समझे गए वैकल्पिक निर्देश या उद्देश्य को व्यक्त करता है और मूल की संभावित आशयगत छाया को बनाए रखता है।
theological_decisions:
- issue: ἑορτή की पहचान
  choice: मुख्य पाठ में केवल ‘पर्व’
  alternative: ‘फसह का पर्व’
  rationale: निकटवर्ती प्रसंग फसह को स्पष्ट करता है, पर इस पद में यूनानी पाठ केवल ‘पर्व’ कहता है; इसलिए अतिरिक्त विशिष्टता मुख्य पाठ में नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘रुपयों की थैली’ सामान्य पाठक के लिए सहज है, और पात्र के अनिश्चित रूप को पादटिप्पणी सुरक्षित रखती है। पर्व को संदर्भ से फसह समझा जा सकता है, पर मुख्य पाठ मूल की अनिर्दिष्ट अभिव्यक्ति बनाए रखता है।
