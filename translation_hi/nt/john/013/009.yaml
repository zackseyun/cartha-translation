language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Σίμων Πέτρος· Κύριε, μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: hi
  text: शमौन पतरस ने उनसे कहा, “प्रभु[a], केवल मेरे पैर ही नहीं, बल्कि मेरे हाथ और सिर भी!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “स्वामी।” यूनानी: क्यूरियोस।'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: ने कहा
  rationale: यूनानी में कथात्मक वर्तमान काल है, पर आधुनिक हिन्दी कथा-शैली में पूर्ण भूतकाल अधिक स्वाभाविक है; इससे कथन की घटना स्पष्ट रहती है।
- source_word: αὐτῷ
  choice: उनसे
  rationale: मूल में एकवचन सर्वनाम है। यीशु के लिए हिन्दी का आदरसूचक एकवचन अर्थ रखने वाला ‘उनसे’ स्वाभाविक और सम्मानपूर्ण है; नाम को अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: Σίμων Πέτρος
  choice: शमौन पतरस
  rationale: दोनों नामों का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: Κύριε
  choice: प्रभु
  rationale: सम्बोधन के रूप में κύριος का सामान्य अर्थ और यूहन्ना में उसकी धर्मवैचारिक गूँज बनाए रखने के लिए ‘प्रभु’ चुना गया है।
- source_word: μὴ ... μόνον ἀλλὰ καὶ
  choice: केवल ... ही नहीं, बल्कि ... भी
  rationale: 'यह हिन्दी में स्वाभाविक ढंग से उसी विरोधात्मक विस्तार को व्यक्त करता है: पैरों तक सीमित नहीं, हाथ और सिर भी।'
- source_word: τοὺς πόδας μου ... τὰς χεῖρας καὶ τὴν κεφαλήν
  choice: मेरे पैर ... मेरे हाथ और सिर
  rationale: ‘मेरे’ का अधिकार-संबंध समन्वित तीनों अंगों पर लागू होता है; हिन्दी में दूसरी बार ‘मेरे’ लगाने से वाक्य सहज और स्पष्ट रहता है।
theological_decisions:
- issue: यीशु के लिए κύριος का सम्बोधन
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ सम्मानसूचक सम्बोधन और यूहन्ना के व्यापक धर्मवैचारिक संकेत—दोनों को खुला रखता है। ‘स्वामी’ सम्भव है, इसलिए उसे पादटिप्पणी में दिया गया है।
- issue: पतरस के कथन में क्रिया का लोप
  choice: मूल की तरह क्रियारहित कथन रखा गया
  alternative: अन्त में ‘धोइए’ जोड़ना
  rationale: यूनानी में धोने की क्रिया पिछले संवाद से समझी जाती है और यहाँ दोहराई नहीं गई। विस्मयादिबोधक चिह्न के साथ हिन्दी में यह उत्सुक, अधूरा-सा प्रत्युत्तर समझ में आता है और मूल की संक्षिप्तता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। यीशु के लिए आदरसूचक ‘उनसे’ रखा गया है। पतरस की तीव्र प्रतिक्रिया दिखाने के लिए मूल के क्रियारहित कथन को विस्मयादिबोधक चिह्न के साथ सुरक्षित रखा गया है।
