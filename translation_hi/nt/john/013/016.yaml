source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ οὐδὲ ἀπόστολος μείζων τοῦ πέμψαντος αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a servant is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: hi
  text: 'मैं तुमसे सच-सच कहता हूँ: दास[a] अपने स्वामी[b] से बड़ा नहीं होता, और न कोई प्रेरित[c] उसे भेजनेवाले से बड़ा होता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवक’; यूनानी शब्द स्वामी के अधिकार के अधीन दास को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘प्रभु’; यहाँ दास–स्वामी की तुलना के कारण ‘स्वामी’ किया गया है।
    reason: lexical_alternative
  - marker: c
    text: या ‘दूत’ अथवा ‘भेजा हुआ व्यक्ति’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: यूहन्ना में प्रयुक्त इस दोहरे गंभीर पुष्टि-सूत्र की पुनरावृत्ति और बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: यूनानी वर्तमानकालीन कथन-सूत्र और बहुवचन ὑμῖν को सहज हिन्दी में व्यक्त करता है।
- source_word: δοῦλος
  choice: दास
  rationale: स्वामी के अधीन व्यक्ति का मजबूत सामाजिक और अधिकार-संबंध सुरक्षित रहता है; ‘सेवक’ इस संबंध को अपेक्षाकृत हल्का कर सकता है।
- source_word: μείζων
  choice: बड़ा
  rationale: पद अथवा दर्जे की श्रेष्ठता का व्यापक तुलनात्मक अर्थ दोनों उपवाक्यों में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: κύριος
  choice: स्वामी
  rationale: यहाँ दास के साथ सामाजिक संबंध अभिप्रेत है; इसलिए उपाधिसूचक ‘प्रभु’ के बजाय ‘स्वामी’ संदर्भानुकूल है।
- source_word: ἀπόστολος
  choice: भेजा हुआ व्यक्ति
  rationale: मूल शब्द के सामान्य अर्थ, अर्थात अधिकार देकर भेजे गए प्रतिनिधि, को अगले वाक्यांश ‘अपने भेजनेवाले’ के समानांतर स्पष्ट करता है और अनावश्यक रूप से तकनीकी पद तक सीमित नहीं करता।
- source_word: τοῦ πέμψαντος αὐτόν
  choice: अपने भेजनेवाले
  rationale: कर्ता-संबंध को संक्षिप्त, सहज हिन्दी में रखता है; ‘अपने’ का संदर्भ भेजे हुए व्यक्ति से स्पष्ट है।
theological_decisions:
- issue: गैर-उपाधिसूचक तुलना में κύριος का अनुवाद
  choice: स्वामी
  alternative: प्रभु
  rationale: तात्कालिक संदर्भ दास और उसके स्वामी के सामाजिक संबंध की तुलना करता है। ‘स्वामी’ इस समानांतरता को सुरक्षित रखता है और जहाँ मूल अनिवार्य नहीं करता वहाँ प्रत्यक्ष मसीही उपाधि आरोपित नहीं करता।
- issue: ἀπόστολος को तकनीकी कलीसियाई पद मानना या सामान्यतः भेजे गए प्रतिनिधि के अर्थ में लेना
  choice: भेजा हुआ व्यक्ति
  alternative: प्रेरित
  rationale: यहाँ πέμψαντος (‘भेजनेवाले’) के साथ शब्दगत समानांतरता सामान्य प्रतिनिधि या दूत का अर्थ प्रमुख करती है। ‘प्रेरित’ संभव है, पर हिन्दी पाठक उसे केवल एक विशिष्ट कलीसियाई पद समझ सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सच-सच’ यूहन्ना की विशिष्ट दोहरी पुष्टि को बचाता है। ‘दास/स्वामी’ सामाजिक पदानुक्रम को स्पष्ट रखते हैं, जबकि दूसरे खंड में ‘भेजा हुआ व्यक्ति/भेजनेवाला’ यूनानी शब्द-संबंध को स्वाभाविक हिन्दी में सामने लाता है।
