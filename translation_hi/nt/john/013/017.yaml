  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ ταῦτα οἴδατε, μακάριοί ἐστε ἐὰν ποιῆτε αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/017.yaml
  text: If you know these things[a], you are blessed if you do them.
translation:
  language: hi
  text: यदि तुम ये बातें जानते हो, तो इन्हें करने पर तुम धन्य[a] हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सुखी’ अथवा ‘भाग्यशाली’। यूनानी शब्द का अर्थ केवल प्रसन्न अनुभव करना नहीं, बल्कि अनुगृहीत और फलती-फूलती दशा में होना भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है; ‘यदि’ यूनानी वाक्य-रचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पद यीशु के पिछले उदाहरण और उपदेश की ओर संकेत करता है; ‘ये बातें’ उसके बहुवचन को सुरक्षित रखता है।
- source_word: οἴδατε
  choice: जानते हो
  rationale: οἶδα यहाँ ज्ञान या बोध को व्यक्त करता है। ‘जानते हो’ सीधा अनुवाद है और इसे अनावश्यक रूप से केवल ‘समझने’ तक सीमित नहीं करता।
- source_word: μακάριοί
  choice: धन्य
  rationale: यह शब्द केवल मन की प्रसन्नता नहीं, बल्कि अनुगृहीत और कल्याणमय दशा का बोध कराता है। ‘धन्य’ हिन्दी की बाइबलीय और धार्मिक अर्थ-गहनता को बनाए रखता है।
- source_word: ἐστε
  choice: हो
  rationale: वर्तमानकालीन संयोजक क्रिया का स्वाभाविक हिन्दी रूप।
- source_word: ἐὰν ποιῆτε αὐτά
  choice: इन्हें करने पर
  rationale: ἐὰν के साथ विधिलिंग क्रिया वास्तविक परिणाम के लिए आवश्यक शर्त बताती है। ‘इन्हें करने पर’ उस आकस्मिक शर्त को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है और ज्ञान तथा आचरण का भेद बनाए रखता है।
theological_decisions:
- issue: शिष्यत्व के प्रसंग में μακάριοι का अनुवाद
  choice: धन्य
  alternative: सुखी; भाग्यशाली
  rationale: कथन उन लोगों की अनुगृहीत और कल्याणमय दशा बताता है जो यीशु की शिक्षा को जानने के साथ उस पर अमल भी करते हैं। ‘धन्य’ इस धार्मिक अर्थ-भार को सुरक्षित रखता है, जबकि ‘सुखी’ इसे केवल अनुभूति और ‘भाग्यशाली’ इसे संयोग समझे जाने की ओर ले जा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और संबोधन-संगत शैली रखी गई है। ‘तुम’ निकट शिष्यों के लिए प्रसंगानुकूल है। दोहराए गए शर्तसूचक ढाँचे को ‘यदि…तो…करने पर’ के रूप में स्वाभाविक बनाया गया है, बिना ज्ञान और आचरण के भेद को मिटाए।
