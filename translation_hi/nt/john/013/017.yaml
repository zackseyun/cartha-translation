  verdict: approve
  source_fidelity: The translation accurately reflects both conditional elements in εἰ ταῦτα οἴδατε ... ἐὰν ποιῆτε αὐτά. “ये बातें” preserves the plural ταῦτα, “जानते हो” appropriately renders οἴδατε, and “इन्हें करने पर” naturally conveys the contingent practical enactment expressed by ἐὰν ποιῆτε αὐτά. “धन्य” is an appropriate rendering of μακάριοι.
  naturalness: The Hindi is clear, modern, and suitably dignified. The construction “यदि …, तो इन्हें करने पर …” is concise and natural enough in Hindi while retaining the distinction between knowing and doing.
  terminology: “धन्य” preserves the biblical and theological weight of μακάριοι without reducing it to a passing feeling of happiness. The footnote gives useful alternatives and accurately explains that the sense is broader than mere subjective pleasure.
