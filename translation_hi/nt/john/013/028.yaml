  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए स्पष्ट रखी गई है। भोजन की प्राचीन मुद्रा को मिटाने के बजाय “भोजन के लिए लेटे” कहकर सांस्कृतिक दृश्य सुरक्षित रखा गया है। यूनानी पाठ में कर्ता और संबोधित व्यक्ति के नाम नहीं हैं, इसलिए हिन्दी में भी उन्हें स्पष्ट करके नहीं जोड़ा गया।
