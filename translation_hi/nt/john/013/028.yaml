  text: But none of those reclining at the table knew why he said this to him[a].
translation:
  language: hi
  text: परन्तु भोजन पर टेक लगाए बैठे हुओं में से किसी ने नहीं समझा कि उसने उससे यह बात किस उद्देश्य से कही।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: यह बात
  rationale: यह संकेतवाचक सर्वनाम ठीक पहले कही गई बात की ओर संकेत करता है; हिन्दी में “यह बात” उसका स्वाभाविक और स्पष्ट रूप है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह अव्यय पिछले प्रसंग से हल्का विरोध या नया मोड़ दिखाता है; यहाँ शिष्यों की नासमझी को उभारने के लिए “परन्तु” उपयुक्त है।
- source_word: οὐδεὶς
  choice: कोई नहीं
  rationale: यह पूर्ण निषेध व्यक्त करता है और इसके साथ आने वाले अंश “लेटे हुओं में से” के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: ἔγνω
  choice: समझा
  rationale: इस संदर्भ में γινώσκω का आशय कही गई बात का उद्देश्य ग्रहण करना है; “समझा” आधुनिक हिन्दी में “जानता था” से अधिक स्वाभाविक है।
- source_word: τῶν ἀνακειμένων
  choice: भोजन के लिए लेटे हुओं में से
  rationale: भोजन के प्रसंग में ἀνάκειμαι उस समय की प्रथा के अनुसार टेक लगाकर या लेटकर भोजन करने को दर्शाता है; “भोजन के लिए” जोड़ने से आधुनिक पाठक के लिए दृश्य स्पष्ट होता है।
- source_word: πρὸς τί
  choice: किस उद्देश्य से
  rationale: यह पदबंध प्रयोजन या लक्ष्य पूछता है; “किस उद्देश्य से” स्रोत की प्रयोजनात्मक बारीकी को सुरक्षित रखता है।
- source_word: εἶπεν αὐτῷ
  choice: उसने उससे ... कही
  rationale: यूनानी सर्वनामों की अस्पष्टता बनाए रखते हुए “उसने उससे” स्वाभाविक हिन्दी है; “यह बात” को क्रिया के साथ रखकर वाक्य सुबोध बनाया गया है।
