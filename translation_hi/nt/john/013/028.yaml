review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast (δέ), the total negation, the lack of understanding, the purposive force of πρὸς τί, and the unnamed referents of the pronouns. However, “भोजन के लिए लेटे हुओं” can suggest people lying down in preparation to eat, rather than the ancient meal posture denoted by ἀνακειμένων.
  naturalness: The sentence is generally clear and dignified. Recasting the meal-posture phrase as “भोजन पर टेक लगाए बैठे हुओं” is more idiomatic modern Hindi while retaining the historically specific sense of reclining at a meal. “किसी ने नहीं समझा” is also smoother than “कोई नहीं समझा” in this construction.
  terminology: “किस उद्देश्य से” appropriately preserves the purpose-oriented nuance of πρὸς τί. “टेक लगाए बैठे” communicates the reclining dining posture without importing names or interpretive details.
  issues:
  - severity: medium
    issue: “भोजन के लिए लेटे हुओं” is potentially misleading.
    rationale: The Greek refers to those reclining in the customary posture during the meal, not simply persons who had lain down for the purpose of eating. The revised wording better conveys this cultural-meal setting in natural Hindi.
