source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: hi
  text: यीशु ने उत्तर दिया, “क्या तुम मेरे लिए अपना प्राण दे दोगे?[a] मैं तुमसे सच-सच कहता हूँ, जब तक तुम तीन बार मेरा इनकार न कर लो, तब तक मुर्गा बाँग नहीं देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपना जीवन दे दोगे।” यूनानी ψυχή का अर्थ “प्राण,” “जीवन” या “आत्मा” हो सकता है; यहाँ आशय अपने जीवन का बलिदान देने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: उत्तर दिया
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथन-शैली में भूतकाल से व्यक्त किया गया है।
- source_word: Τὴν ψυχήν σου ... θήσεις
  choice: अपना प्राण दे दोगे
  rationale: यहाँ ψυχή और τίθημι का संयुक्त मुहावरा किसी के लिए मरने, अर्थात अपना जीवन अर्पित करने, को सूचित करता है। ‘प्राण दे देना’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: ὑπὲρ ἐμοῦ
  choice: मेरे लिए
  rationale: यह यीशु के पक्ष में अथवा उनके निमित्त जीवन देने का भाव संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: यूहन्ना में यीशु के विशिष्ट गंभीर और बलात्मक कथन-सूत्र की पुनरुक्ति सुरक्षित रखी गई है।
- source_word: οὐ μὴ ... φωνήσῃ
  choice: बाँग नहीं देगा
  rationale: वाक्य की ‘जब तक...तब तक नहीं’ रचना के साथ यूनानी की प्रबल निषेधात्मक भविष्यवाणी स्वाभाविक हिन्दी में व्यक्त होती है।
- source_word: ἀλέκτωρ
  choice: मुर्गा
  rationale: यह समकालीन मानक हिन्दी का सामान्य शब्द है।
- source_word: φωνήσῃ
  choice: बाँग देगा
  rationale: मुर्गे की आवाज़ के लिए हिन्दी का प्रचलित मुहावरा ‘बाँग देना’ है।
- source_word: ἕως οὗ
  choice: जब तक ... तब तक
  rationale: यह उस समय-सीमा को स्पष्ट करता है जिसके पूरा होने से पहले मुर्गा नहीं बाँगेगा।
- source_word: ἀρνήσῃ με
  choice: मेरा इनकार न कर लो
  rationale: ἀρνέομαι यहाँ यीशु को जानने या उनसे संबंध रखने से इनकार करने का अर्थ देता है; ‘मेरा इनकार करना’ इस आशय को प्रत्यक्ष रखता है।
- source_word: τρίς
  choice: तीन बार
  rationale: यह आधुनिक हिन्दी में स्वाभाविक और यूनानी का सीधा अर्थ है।
theological_decisions:
- issue: ψυχή को आत्मा, जीवन या प्राण के रूप में प्रस्तुत करना
  choice: प्राण
  alternative: जीवन; आत्मा
  rationale: प्रसंग में पतरस के यीशु के लिए मरने के दावे की बात है। ‘प्राण देना’ ठोस आत्म-बलिदान का भाव रखता है और ψυχή को केवल अभौतिक ‘आत्मा’ तक सीमित नहीं करता।
- issue: पतरस के इनकार और मुर्गे की बाँग का कालगत संबंध
  choice: जब तक तुम तीन बार मेरा इनकार न कर लो, तब तक मुर्गा बाँग नहीं देगा
  alternative: मुर्गे के बाँग देने से पहले तुम तीन बार मेरा इनकार करोगे
  rationale: मुख्य पाठ ἕως οὗ और प्रबल οὐ μή निषेध की मूल संरचना को बनाए रखता है, बिना भविष्यवाणी की निश्चितता घटाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सच-सच’ यूहन्ना की बलात्मक पुनरुक्ति को सुरक्षित रखता है; ‘प्राण दे देना’ बलिदानी मृत्यु का स्वाभाविक हिन्दी मुहावरा है।
