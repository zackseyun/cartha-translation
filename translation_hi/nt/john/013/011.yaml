lexical_decisions:
- source_word: ᾔδει
  choice: वह जानता था
  rationale: οἶδα का यह रूप यहाँ यीशु के उस समय विद्यमान ज्ञान को व्यक्त करता है; हिन्दी कथन में ‘जानता था’ स्वाभाविक है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण स्पष्ट करता है और हिन्दी में व्याख्यात्मक संबंध सहज रूप से व्यक्त करता है।
- source_word: τὸν παραδιδόντα αὐτόν
  choice: उसे पकड़वाने वाला
  rationale: παραδίδωμι का मूल भाव किसी को दूसरों के हाथ सौंपना है; इस प्रसंग में ‘पकड़वाना’ यहूदा के विश्वासघाती कृत्य को स्पष्ट करता है, जबकि ‘धोखा देने वाला’ की अपेक्षा सौंपे जाने की क्रिया को अधिक सुरक्षित रखता है।
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यीशु के ज्ञान और उसके कथन के बीच स्पष्ट कारणात्मक संबंध बनाए रखता है।
- source_word: εἶπεν ὅτι
  choice: उसने कहा
  rationale: ὅτι को हिन्दी में प्रत्यक्ष कथन के उद्धरण द्वारा स्वाभाविक रूप से दर्शाया गया है।
- source_word: Οὐχὶ πάντες
  choice: तुम सब नहीं
  rationale: द्वितीय पुरुष बहुवचन को ‘तुम’ से स्पष्ट किया गया है और οὐχί का निषेध पूरे समूह के प्रत्येक सदस्य पर लागू न होने का अर्थ देता है।
- source_word: καθαροί
  choice: शुद्ध
  rationale: पैर धोने के प्रसंग में यह शब्द बाहरी स्वच्छता और भीतरी शुद्धता दोनों की प्रतिध्वनि रखता है; आधुनिक हिन्दी में ‘शुद्ध’ इस गहरे अर्थ को स्वाभाविक रूप से वहन करता है।
- source_word: ἐστε
  choice: हो
  rationale: द्वितीय पुरुष बहुवचन वर्तमानकालीन योजक क्रिया का सीधा हिन्दी रूप।
theological_decisions:
- issue: παραδιδόντα का यहूदा से संबंधित अर्थ
  choice: पकड़वाने वाला
  alternative: सौंपने वाला; विश्वासघात करने वाला
  rationale: ‘पकड़वाने वाला’ कथानक में यीशु को अधिकारियों के हाथ सौंपने की ठोस क्रिया और उसके विश्वासघाती स्वरूप, दोनों को संप्रेषित करता है। अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- issue: पैर धोने के प्रसंग में καθαροί का अर्थ
  choice: शुद्ध
  alternative: साफ़
  rationale: वचन में शारीरिक धुलाई की छवि के साथ आत्मिक/नैतिक दशा भी निहित है। ‘शुद्ध’ इस अंतर्निहित गहराई को बनाए रखता है, पर उसे किसी विशिष्ट सिद्धान्त में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम सब शुद्ध नहीं हो’ हिन्दी में स्वाभाविक रूप से ‘तुममें से हर एक शुद्ध नहीं है’ का अर्थ देता है और καθαροί की प्रसंगगत बहुअर्थकता बनाए रखता है।
