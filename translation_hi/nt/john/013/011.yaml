  - severity: medium
    issue: “शुद्ध” does not adequately retain the washing-context sense of καθαροί.
    rationale: In this footwashing discourse καθαροί intentionally evokes being clean as well as figurative purity. “साफ़” better preserves the ambiguity without interpreting it solely as moral or ritual purity.
