  naturalness: The Hindi is generally clear and suitably dignified. “वह जानता था कि ... कौन है” is natural, but recasting it with the participial referent more closely reflects the Greek. “साफ़” is natural modern Hindi in the immediate footwashing context.
  terminology: Render παραδιδόντα as “उसे धोखा देने वाला” in the text, with “उसे सौंपने वाला” retained in the footnote as the more literal alternative. Render καθαροί as “साफ़,” which preserves the physical washing imagery while allowing the contextual figurative resonance.
