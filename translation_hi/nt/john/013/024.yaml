  text: νεύει οὖν τούτῳ Σίμων Πέτρος ⸂πυθέσθαι τίς ἂν εἴη⸃ περὶ οὗ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/024.yaml
  text: So Simon Peter motioned to this one to ask who it might be about whom he was speaking[a].
translation:
  language: hi
  text: इसलिए शमौन पतरस ने उस चेले को इशारा किया कि वह पूछे कि वे जिस व्यक्ति के विषय में कह रहे हैं, वह कौन हो सकता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “इसलिए शमौन पतरस इस चेले को इशारा करता है कि वह पूछे कि वह कौन हो सकता है, जिस व्यक्ति के विषय में वे कह रहे हैं।”'
    reason: मूल यूनानी की वर्तमानकालीन कथन-शैली तथा ‘वह कौन हो सकता है’ की अनिश्चितता को अधिक औपचारिक रूप में दिखाने के लिए।
lexical_decisions:
- source_word: νεύει
  choice: इशारा किया
  rationale: यह क्रिया बिना बोले किसी संकेत या हाव-भाव से बात बताने को दर्शाती है। ‘इशारा किया’ स्वाभाविक हिन्दी है और ‘सिर हिलाया’ जैसी अनावश्यक विशिष्टता से बचती है।
- source_word: οὖν
  choice: इसलिए
  rationale: यहाँ यह पिछले कथन के परिणामस्वरूप पतरस की प्रतिक्रिया को जोड़ता है।
- source_word: τούτῳ
  choice: उस चेले को
  rationale: संकेतवाचक सर्वनाम पिछले पद में वर्णित चेले की ओर संकेत करता है। हिन्दी में केवल ‘उसको’ की अपेक्षा ‘उस चेले को’ संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: πυθέσθαι
  choice: कि वह पूछे
  rationale: अनंत क्रिया पतरस के इशारे का आशय बताती है—वह चेला यीशु से पूछे।
- source_word: τίς ἂν εἴη
  choice: किसके विषय में
  rationale: मुख्य पाठ में स्वाभाविक प्रत्यक्ष प्रश्न रखा गया है। ἄν के साथ विधिलिंग से आने वाली संभावनात्मक या अनिश्चित छाया औपचारिक विकल्प में सुरक्षित की गई है।
- source_word: περὶ οὗ λέγει
  choice: वे किसके विषय में कह रहे हैं
  rationale: περὶ οὗ का अर्थ ‘जिसके/किसके विषय में’ है। λέγει का वर्तमान काल प्रसंग में चल रहे कथन को दर्शाता है; यीशु के लिए सम्मानसूचक बहुवचन आधुनिक मानक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: यीशु के लिए यूनानी एकवचन का हिन्दी सम्मानसूचक रूप
  choice: वे … कह रहे हैं
  alternative: वह … कह रहा है
  rationale: हिन्दी में सम्मानसूचक ‘वे’ और बहुवचन क्रिया सामान्य तथा गरिमापूर्ण हैं; इससे मूल में व्यक्त व्यक्ति-संख्या या अर्थ में कोई धर्मवैचारिक परिवर्तन नहीं होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मुख्य पाठ में अप्रत्यक्ष यूनानी रचना को स्वाभाविक हिन्दी प्रत्यक्ष प्रश्न बनाया गया है, जबकि पादटिप्पणी अधिक शाब्दिक संरचना और संभावनात्मक भाव सुरक्षित रखती है।
