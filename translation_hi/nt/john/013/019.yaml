  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: hi
  text: अब से मैं तुम्हें यह उसके होने से पहले बता रहा हूँ, ताकि जब वह हो, तब तुम विश्वास करो कि मैं वही हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शब्दशः: “कि मैं हूँ।” यूनानी अभिव्यक्ति यशायाह और यूहन्ना के अन्य स्थानों में मिलने वाली ईश्वरीय आत्म-पहचान की भाषा की प्रतिध्वनि भी हो सकती है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: अब से
  rationale: यह वर्तमान क्षण से आगे की ओर संकेत करने वाला स्वाभाविक और संक्षिप्त हिन्दी प्रयोग है।
- source_word: λέγω ὑμῖν
  choice: मैं ... तुम्हें बता रहा हूँ
  rationale: वर्तमान काल और प्रत्यक्ष संबोधन को सहज आधुनिक हिन्दी में व्यक्त करता है; प्रसंग में भविष्य की घटना पहले से बताई जा रही है।
- source_word: πρὸ τοῦ γενέσθαι
  choice: घटना के होने से पहले ही
  rationale: πρό के साथ क्रियार्थक रूप पूर्वकालिक संबंध दिखाता है। हिन्दी में ‘पहले ही’ पूर्वसूचना के बल को स्वाभाविक ढंग से उभारता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्यसूचक संबंध को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: πιστεύσητε
  choice: तुम विश्वास करो
  rationale: ἵνα के बाद संभाव्य क्रियारूप इच्छित उद्देश्य को बताता है। ‘विश्वास करो’ πιστεύω की प्रमुख अर्थ-रेखा को सुरक्षित रखता है, बिना ‘विश्वास करने लगो’ जैसा आरंभिक भाव अनावश्यक रूप से जोड़ने के।
- source_word: ὅταν γένηται
  choice: जब वह घटे
  rationale: ὅταν और संभाव्य क्रियारूप भावी घटना को व्यक्त करते हैं। ‘घटे’ संक्षिप्त, प्रतिष्ठित और प्रसंगानुकूल है।
- source_word: ὅτι ἐγώ εἰμι
  choice: कि मैं वही हूँ
  rationale: मूल में स्पष्ट विधेय नहीं है। ‘मैं वही हूँ’ हिन्दी में आत्म-पहचान को समझने योग्य बनाता है, पर किसी विशिष्ट विधेय को नहीं जोड़ता; अधिक शब्दशः रूप और सम्भावित धर्मवैज्ञानिक प्रतिध्वनि पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: यूहन्ना के प्रसंग में निरपेक्ष ἐγώ εἰμι का अनुवाद, जिसमें ईश्वरीय आत्म-पहचान की सम्भावित प्रतिध्वनि है
  choice: कि मैं वही हूँ
  alternative: कि मैं हूँ
  rationale: यूनानी वाक्यांश में कोई स्पष्ट विधेय नहीं है और वह यशायाह तथा यूहन्ना के अन्य स्थानों की ईश्वरीय आत्म-पहचान की भाषा की प्रतिध्वनि हो सकता है। ‘मैं वही हूँ’ पठनीय हिन्दी देता है, जबकि पादटिप्पणी अधिक शब्दशः ‘मैं हूँ’ और उसके सम्भावित गहरे संकेत को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल। ‘घटना के होने’ में संदर्भित घटना को अनावश्यक रूप से स्पष्ट नहीं किया गया, और ἐγώ εἰμι की वास्तविक अस्पष्टता पादटिप्पणी सहित सुरक्षित रखी गई है।
