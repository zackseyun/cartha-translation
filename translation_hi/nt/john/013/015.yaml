base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: hi
  text: क्योंकि मैंने तुम्हें एक उदाहरण दिया है[a], ताकि जैसा मैंने तुम्हारे लिए किया है, तुम भी वैसा ही करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नमूना” अथवा “आदर्श”।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: उदाहरण
  rationale: यह शब्द अनुसरण करने के लिए दिए गए उदाहरण, नमूने या आदर्श को दर्शाता है। ‘उदाहरण’ आधुनिक हिन्दी में सबसे स्वाभाविक है और अनुकरण के भाव को स्पष्ट रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन की व्याख्या प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस कारणात्मक-व्याख्यात्मक संबंध को सहज रूप से व्यक्त करता है।
- source_word: ἔδωκα
  choice: दिया है
  rationale: यूनानी में सामान्य भूतकालिक रूप है, पर हिन्दी का पूर्ण वर्तमान अभी-अभी किए गए उस कार्य की वर्तमान प्रासंगिकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य बताता है; ‘ताकि’ आधुनिक हिन्दी में प्रयोजन को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καθὼς
  choice: जैसा ... वैसा ही
  rationale: यह यीशु के कार्य और शिष्यों से अपेक्षित कार्य के बीच समानता स्थापित करता है। हिन्दी की ‘जैसा ... वैसा ही’ रचना इस अनुरूपता को स्पष्ट करती है।
- source_word: ἐποίησα ὑμῖν
  choice: मैंने तुम्हारे साथ किया है
  rationale: ὑμῖν उस व्यक्ति-समूह को दर्शाता है जिस पर कार्य किया गया। पाँव धोने के प्रसंग में ‘तुम्हारे साथ किया है’ स्वाभाविक हिन्दी है और ‘तुम्हारे लिए’ कहकर लाभार्थक अर्थ को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: καὶ ὑμεῖς ποιῆτε
  choice: तुम भी वैसा ही करो
  rationale: ‘तुम भी’ शिष्यों की समान भागीदारी पर बल देता है। उद्देश्यवाचक उपवाक्य में ‘करो’ अपेक्षित अनुकरण को स्पष्ट करता है, पर अपने आप यह तय नहीं करता कि बात केवल विधिवत पाँव धोने की है या व्यापक सेवाभाव की।
theological_decisions:
- issue: यीशु के कार्य का अनुकरण किस रूप में किया जाए
  choice: पाठ को इस प्रकार रखा गया है कि यीशु का किया हुआ कार्य शिष्यों के लिए अनुकरणीय उदाहरण है।
  alternative: इसे या तो हर परिस्थिति में पाँव धोने की अनिवार्य धार्मिक विधि, या केवल अमूर्त प्रतीक के रूप में स्पष्ट कर देना।
  rationale: मूल पाठ अनुकरण की वास्तविक अपेक्षा रखता है, लेकिन इस पद में यह अलग से निश्चित नहीं करता कि उसका पालन सार्वभौमिक धार्मिक विधि के रूप में ही हो अथवा सेवा के व्यापक प्रतिरूप के रूप में। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जैसा ... वैसा ही’ हिन्दी में तुलना को पूर्ण और स्वाभाविक बनाता है।
