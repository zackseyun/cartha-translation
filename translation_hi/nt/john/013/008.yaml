id: JHN.13.8
reference: John 13:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Πέτρος· Οὐ μὴ νίψῃς ⸂μου τοὺς πόδας⸃ εἰς τὸν αἰῶνα. ἀπεκρίθη ⸂Ἰησοῦς αὐτῷ⸃· Ἐὰν μὴ νίψω σε, οὐκ ἔχεις μέρος μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: hi
  text: पतरस ने उससे कहा, “आप मेरे पैर कभी नहीं धोएँगे।” यीशु ने उसे उत्तर दिया, “यदि मैं तुम्हें न धोऊँ, तो मेरे साथ तुम्हारा कोई भाग[a] नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हिस्सा” अथवा “हिस्सेदारी”।
    reason: μέρος के लिए ‘भाग’, ‘हिस्सा’ और ‘हिस्सेदारी’ सभी संभव हैं; मुख्य पाठ में संक्षिप्त और पारंपरिक ‘भाग’ रखा गया है।
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς ... εἰς τὸν αἰῶνα
  choice: आप ... कभी नहीं धोएँगे
  rationale: οὐ μή और εἰς τὸν αἰῶνα मिलकर भविष्य के विषय में पतरस का अत्यंत दृढ़ निषेध व्यक्त करते हैं। आधुनिक हिन्दी में ‘कभी नहीं’ इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μου τοὺς πόδας
  choice: मेरे पैर
  rationale: यह स्पष्ट संबंधसूचक पदबंध है; हिन्दी में ‘मेरे पैर’ सीधा और स्वाभाविक अनुवाद है।
- source_word: ἀπεκρίθη Ἰησοῦς αὐτῷ
  choice: यीशु ने उसे उत्तर दिया
  rationale: यह यूनानी कथात्मक उत्तर-वाक्य की संरचना और अर्थ को सहज हिन्दी में बनाए रखता है।
- source_word: Ἐὰν μὴ νίψω σε
  choice: यदि मैं तुम्हें न धोऊँ
  rationale: इससे शर्त की स्पष्ट संरचना और पूरे व्यक्ति को सूचित करने वाला σε, दोनों सुरक्षित रहते हैं; इसे केवल पैर धोने तक सीमित नहीं किया गया।
- source_word: οὐκ ἔχεις μέρος μετ’ ἐμοῦ
  choice: मेरे साथ तुम्हारा कोई भाग नहीं है
  rationale: μέρος सहभागिता, हिस्सा या भाग का बोध करा सकता है, जबकि μετά के कारण ‘मेरे साथ’ संबंध या संगति को बनाए रखता है। ‘मुझमें’ कहना मूल से अधिक अर्थ जोड़ता।
theological_decisions:
- issue: यीशु के साथ μέρος होने का आशय
  choice: ‘मेरे साथ तुम्हारा कोई भाग नहीं है’ कहकर संबंध और सहभागिता का व्यापक अर्थ खुला रखा गया है।
  alternative: इसे विशेष रूप से संस्कारगत शुद्धि, विनम्र सेवा के प्रतीक, या उद्धार-संबंधी सदस्यता के रूप में परिभाषित करना।
  rationale: पद यीशु द्वारा धोए जाने को उसके साथ भाग रखने के लिए आवश्यक बताता है, पर इस पद में उस आवश्यकता की सटीक धर्मवैज्ञानिक प्रक्रिया परिभाषित नहीं की गई। इसलिए अनुवाद उस तनाव और व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सहज रखी गई है। पतरस द्वारा यीशु को संबोधित करते समय ‘आप’ और यीशु द्वारा पतरस को संबोधित करते समय ‘तुम’ हिन्दी के स्वाभाविक सामाजिक संबंध को व्यक्त करते हैं; यूनानी क्रियाएँ स्वयं सम्मान-स्तर निर्दिष्ट नहीं करतीं।
