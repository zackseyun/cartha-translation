id: JHN.13.20
reference: John 13:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ λαμβάνων ⸀ἄν τινα πέμψω ἐμὲ λαμβάνει, ὁ δὲ ἐμὲ λαμβάνων λαμβάνει τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: hi
  text: '“मैं तुमसे सच-सच कहता हूँ: जो किसी ऐसे व्यक्ति को स्वीकार करता है जिसे मैं भेजूँ, वह मुझे स्वीकार करता है; और जो मुझे स्वीकार करता है, वह उसे स्वीकार करता है जिसने मुझे भेजा है[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “जिसने मुझे भेजा है” से आशय पिता परमेश्वर है।
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: यीशु के कथन की गंभीरता और प्रामाणिकता पर बल देनेवाली दोहराई गई उद्घाटन-अभिव्यक्ति को स्वाभाविक और परिचित हिन्दी में सुरक्षित रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: मूल यूनानी के प्रत्यक्ष संबोधन और यूहन्ना में बार-बार आनेवाले कथन-सूत्र को स्पष्ट रूप से व्यक्त करता है।
- source_word: ὁ λαμβάνων
  choice: जो ... स्वीकार करता है
  rationale: संज्ञार्थक वर्तमान कृदंत का अर्थ सामान्य और प्रतिनिधिक है; ‘जो’ किसी एक लिंग तक अर्थ को सीमित किए बिना इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἄν τινα πέμψω
  choice: किसी ऐसे व्यक्ति को ... जिसे मैं भेजूँ
  rationale: ἄν, अनिश्चित सर्वनाम τινα और संभावनार्थक πέμψω मिलकर यीशु द्वारा भेजे जानेवाले किसी भी व्यक्ति का खुला, अनिश्चित संदर्भ देते हैं। ‘भेजूँ’ इस भाव को बनाए रखता है।
- source_word: λαμβάνει
  choice: स्वीकार करता है
  rationale: यहाँ क्रिया किसी व्यक्ति को केवल भौतिक रूप से पाने की नहीं, बल्कि उसे और उसके प्रतिनिधित्व को स्वीकार करने की ओर संकेत करती है। पूरे पद में एक ही शब्द दोहराकर प्रतिनिधित्व की शृंखला सुरक्षित रखी गई है।
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: और जो मुझे स्वीकार करता है
  rationale: δέ यहाँ प्रबल विरोध नहीं, बल्कि आगे की जुड़ी हुई बात प्रस्तुत करता है; इसलिए ‘और’ आरोही समानांतरता को सहज रूप से व्यक्त करता है।
- source_word: τὸν πέμψαντά με
  choice: उसे ... जिसने मुझे भेजा है
  rationale: मूल पाठ के संबंधपरक वर्णन को बनाए रखता है और मुख्य पाठ में ‘पिता’ उपाधि जोड़कर निहित पहचान को अनावश्यक रूप से स्पष्ट नहीं करता।
theological_decisions:
- issue: ‘जिसने मुझे भेजा है’ की पहचान
  choice: मुख्य पाठ में संबंधपरक वाक्यांश को यथावत रखना
  alternative: ‘पिता को, जिसने मुझे भेजा है’
  rationale: यूहन्ना के व्यापक संदर्भ में भेजनेवाला पिता है, पर इस पद में यूनानी पाठ स्पष्ट रूप से ‘पिता’ नहीं कहता। इसलिए अनुवाद मूल की अभिव्यक्ति रखता है और पहचान को पादटिप्पणी में बताता है।
- issue: भेजे हुए व्यक्ति को स्वीकार करने और यीशु को स्वीकार करने का संबंध
  choice: तीनों बार ‘स्वीकार करता है’ की पुनरावृत्ति
  alternative: पहली बार ‘स्वागत करता है’ और बाद में ‘स्वीकार करता है’
  rationale: एक ही यूनानी क्रिया λαμβάνει की पुनरावृत्ति प्रतिनिधि, यीशु और भेजनेवाले के बीच संबंध की जानबूझकर बनाई गई शृंखला है; हिन्दी में भी इसे सुरक्षित रखना धर्मवैज्ञानिक तनाव और बल दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘सच-सच’ यूहन्ना की विशिष्ट उद्घाटन-अभिव्यक्ति के लिए परिचित हिन्दी है। ‘स्वीकार करना’ व्यक्ति और उसके प्रतिनिधित्व को ग्रहण करने का व्यापक भाव देता है, जबकि वाक्य-रचना को सामान्य पाठक के लिए सहज रखा गया है।
