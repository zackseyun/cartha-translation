  source_fidelity: The draft accurately renders the emphatic ἀμὴν ἀμὴν as “सच-सच,” retains the generic force of the articular participles with “जो,” represents the indefinite/subjunctive construction ἄν τινα πέμψω with “किसी ऐसे व्यक्ति को … जिसे मैं भेजूँ,” and preserves the threefold repetition of λαμβάνει/“स्वीकार करता है.” The mild connective force of δέ is appropriately expressed by “और.” “जिसने मुझे भेजा है” faithfully retains the source's relational wording without adding “पिता” to the main text.
  naturalness: The Hindi is clear, modern, dignified, and readily readable. “सच-सच कहता हूँ” is an established and natural Johannine-style formula. Although “किसी ऐसे व्यक्ति को” is slightly fuller than the Greek, it naturally conveys the unrestricted personal reference of τινα and does not alter the meaning.
