  text: Ὅτε οὖν ἔνιψεν τοὺς πόδας αὐτῶν ⸀καὶ ἔλαβεν τὰ ἱμάτια αὐτοῦ ⸂καὶ ἀνέπεσεν⸃, πάλιν εἶπεν αὐτοῖς· Γινώσκετε τί πεποίηκα ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: hi
  text: जब वह उनके पैर धो चुका और अपने कपड़े लेकर फिर भोजन करने के लिए टेक लगाकर बैठ गया[a], तब उसने उनसे कहा, “क्या तुम समझते हो कि मैंने तुम्हारे लिए क्या किया है?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “फिर बैठ गया”; यूनानी क्रिया यहाँ भोजन के समय टेक लगाकर बैठने या लेटने की मुद्रा को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: या “मैंने तुम्हारे प्रति क्या किया है?” यूनानी दत्तिव कारक का अर्थ यहाँ “तुम्हारे लिए” या “तुम्हारे प्रति” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: इसलिए जब
  rationale: Ὅτε समयसूचक उपवाक्य आरम्भ करता है और οὖν कथा को आगे बढ़ाता है; ‘इसलिए जब’ दोनों पक्षों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: वह उनके पैर धो चुका
  rationale: अओरिस्ट क्रिया अगली कार्रवाइयों से पहले पूरी हो चुकी क्रिया बताती है; ‘धो चुका’ उसका क्रम स्पष्ट करता है।
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: अपने कपड़े लेकर
  rationale: ἱμάτια का सामान्य अर्थ कपड़े/वस्त्र है और ἔλαβεν का अर्थ ‘लिया’; ‘पहन लिया’ प्रसंगानुकूल हो सकता है, पर मूल क्रिया से अधिक व्याख्यात्मक है।
- source_word: ἀνέπεσεν
  choice: फिर भोजन के लिए लेट गया
  rationale: भोजन के प्रसंग में यह क्रिया मेज़ पर टिककर या लेटकर भोजन करने की प्राचीन मुद्रा को दर्शाती है; केवल ‘बैठ गया’ ऐतिहासिक चित्र को धुंधला कर देता।
- source_word: Γινώσκετε
  choice: क्या तुम समझते हो
  rationale: यहाँ प्रश्न कार्य के अर्थ को ग्रहण करने के विषय में है, इसलिए ‘समझते हो’ सामान्य ज्ञानसूचक ‘जानते हो’ से अधिक उपयुक्त है।
- source_word: τί πεποίηκα ὑμῖν
  choice: मैंने तुम्हारे लिए क्या किया है
  rationale: पूर्णकालीन πεποίηκα पूरे किए गए कार्य की वर्तमान प्रासंगिकता रखता है। ὑμῖν को प्रसंग में हितार्थक ‘तुम्हारे लिए’ समझना उचित है, यद्यपि ‘तुम्हारे साथ/तुम्हारे प्रति’ भी व्याकरणतः सम्भव है।
theological_decisions:
- issue: पैर धोने के बाद यीशु की भोजन-मुद्रा
  choice: फिर भोजन के लिए लेट गया
  alternative: फिर बैठ गया; फिर भोजन की जगह पर जा बैठा
  rationale: मूल क्रिया प्राचीन रीति के अनुसार भोजन के लिए टेक लगाकर लेटने को सूचित करती है। इसे बनाए रखना ऐतिहासिक रूप से सटीक है और कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
- issue: ὑμῖν का अर्थ
  choice: तुम्हारे लिए
  alternative: तुम्हारे साथ; तुम्हारे प्रति
  rationale: दत्तिव कारक यहाँ हितार्थक हो सकता है और सेवाभाव के प्रसंग में ‘तुम्हारे लिए’ स्वाभाविक है; पादटिप्पणी दूसरी सम्भावना को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘भोजन के लिए लेट गया’ प्राचीन भोजन-मुद्रा को सामान्य पाठक के लिए स्पष्ट करता है। ‘कपड़े’ मूल के सामान्य शब्द को अनावश्यक रूप से ‘ऊपरी वस्त्र’ तक सीमित नहीं करता।
