source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: hi
  text: यीशु ने उत्तर में उससे कहा, “जो मैं कर रहा हूँ, उसे तुम अभी नहीं जानते[a], पर इन बातों के बाद[b] समझ जाओगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ और ‘समझ जाओगे’ के लिए दो अलग क्रियाएँ हैं; पहली का सामान्य अर्थ ‘जानना’ और दूसरी का ‘जान लेना’ या ‘समझना’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘इन बातों के बाद’ का संकेत इस प्रसंग में आगे होने वाली बातों की ओर या अधिक व्यापक रूप से उन बाद की घटनाओं की ओर हो सकता है जिनसे यीशु के कार्य का अर्थ स्पष्ट होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: उत्तर में उससे कहा
  rationale: यह स्वाभाविक हिन्दी में उत्तर देने और कहने—दोनों भावों को व्यक्त करता है, बिना असहज पुनरुक्ति ‘उत्तर दिया और कहा’ के। संदर्भ में ‘उसे’ पतरस की ओर संकेत करता है।
- source_word: Ὃ ἐγὼ ποιῶ
  choice: जो मैं कर रहा हूँ
  rationale: वर्तमान काल यहाँ यीशु के उसी समय चल रहे कार्य को बताता है; हिन्दी का अपूर्ण वर्तमान इसका स्वाभाविक रूप है।
- source_word: σὺ οὐκ οἶδας ἄρτι
  choice: उसे तुम अभी नहीं जानते
  rationale: οἶδας का मूल भाव ‘जानना’ रखकर यूनानी पाठ में प्रयुक्त दो भिन्न ज्ञान-संबंधी क्रियाओं का अंतर दिखाई देता है। ‘अभी’ ἄρτι के वर्तमान समय-सूचक बल को स्पष्ट करता है।
- source_word: γνώσῃ
  choice: समझ जाओगे
  rationale: भविष्य में यीशु के कार्य का अर्थ पकड़ लेने का भाव व्यक्त होता है और पहले आए ‘नहीं जानते’ से शब्दगत अंतर भी बना रहता है।
- source_word: δὲ
  choice: पर
  rationale: वर्तमान अज्ञान और भविष्य की समझ के बीच स्पष्ट विरोध दर्शाता है।
- source_word: μετὰ ταῦτα
  choice: इन बातों के बाद
  rationale: यूनानी बहुवचन अभिव्यक्ति को निकटता से रखता है और इसे केवल ‘बाद में’ बनाकर इसके संभावित संदर्भ को संकुचित नहीं करता।
theological_decisions:
- issue: भविष्य में समझ आने का समय और दायरा
  choice: ‘इन बातों के बाद’ कहकर समय-संदर्भ को खुला रखा गया है।
  alternative: इसे केवल पाँव धोने की घटना की समाप्ति, पुनरुत्थान के बाद, या पवित्र आत्मा के द्वारा मिलने वाली बाद की समझ से जोड़ना।
  rationale: यूनानी पाठ किसी एक समय-सीमा को स्पष्ट रूप से निर्धारित नहीं करता; इसलिए अनुवाद उस वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। पतरस के लिए ‘तुम’ अपनाया गया है, जो आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से कठोर या अत्यधिक औपचारिक संबोधन से बचता है।
