  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: hi
  text: यीशु उत्तर देते हैं, “यह वही है जिसे मैं रोटी का टुकड़ा डुबोकर दूँगा।” तब रोटी का टुकड़ा डुबोकर वे उसे शमौन इस्करियोती के पुत्र यहूदा[a] को देते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शमौन के पुत्र यहूदा इस्करियोती को।” यूनानी शब्द-विन्यास के दोनों अर्थ लिए जा सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: उत्तर देते हैं
  rationale: यूनानी ऐतिहासिक वर्तमान की सजीवता बनाए रखते हुए यह आधुनिक और गरिमापूर्ण हिन्दी है।
- source_word: Ἐκεῖνός ἐστιν
  choice: यह वही है
  rationale: यह किसी व्यक्ति की पहचान बताने वाले संकेतवाचक और क्रिया के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ᾧ
  choice: जिसे
  rationale: सम्बन्धवाचक सर्वनाम देने के अप्रत्यक्ष कर्म को सहज हिन्दी में व्यक्त करता है।
- source_word: βάψω
  choice: डुबोकर दूँगा
  rationale: भविष्यकाल स्पष्ट है; ‘डुबोकर’ भोजन के टुकड़े को किसी द्रव या व्यंजन में डुबाने का अर्थ देता है, न कि धार्मिक धुलाई का।
- source_word: ψωμίον
  choice: रोटी का टुकड़ा
  rationale: यह छोटे टुकड़े या कौर के अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: καὶ δώσω αὐτῷ
  choice: दूँगा
  rationale: दी जाने वाली वस्तु पूर्वपद ‘रोटी का टुकड़ा’ से स्पष्ट है और ‘जिसे’ पाने वाले व्यक्ति को दर्शाता है, इसलिए अनावश्यक पुनरुक्ति नहीं की गई।
- source_word: βάψας οὖν
  choice: तब ... डुबोकर
  rationale: अओरिस्ट कृदन्त की पूर्ववर्ती क्रिया और οὖν से सूचित कथात्मक परिणाम/क्रम को स्वाभाविक हिन्दी में रखा गया है।
- source_word: δίδωσιν
  choice: देते हैं
  rationale: यूनानी ऐतिहासिक वर्तमान की सजीवता को पहले क्रियापद के अनुरूप बनाए रखता है।
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: शमौन इस्करियोती के पुत्र यहूदा को
  rationale: मुख्य पाठ निकटतम व्याकरणिक सम्बन्ध के अनुसार ‘इस्करियोती’ को शमौन से जोड़ता है; दूसरी सम्भव समझ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अन्तिम पदबंध में यहूदा की पहचान
  choice: शमौन इस्करियोती के पुत्र यहूदा
  alternative: शमौन के पुत्र यहूदा इस्करियोती
  rationale: यूनानी Σίμωνος Ἰσκαριώτου का निकटतम व्याकरणिक अर्थ ‘शमौन इस्करियोती का’ हो सकता है, पर पदबंध को परम्परागत नाम ‘यहूदा इस्करियोती’ से जोड़ना भी सम्भव है। अस्पष्टता को मुख्य पाठ और पादटिप्पणी के माध्यम से सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक सजीवता के लिए ऐतिहासिक वर्तमान रखा गया है। भाषा सामान्य पाठक के लिए सहज, पर गरिमापूर्ण है।
