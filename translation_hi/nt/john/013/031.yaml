id: JHN.13.31
reference: John 13:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: hi
  text: इसलिए जब वह बाहर चला गया, तो यीशु ने कहा, “अब मनुष्य का पुत्र महिमान्वित हुआ है, और परमेश्वर उसमें[a] महिमान्वित हुआ है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके द्वारा।” यूनानी वाक्यांश का अर्थ यह हो सकता है कि परमेश्वर मनुष्य के पुत्र में या उसके द्वारा महिमान्वित हुआ।
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: इसलिए जब … तो
  rationale: ὅτε समयसूचक ‘जब’ है और οὖν कथानक की प्रगति/परिणाम को दिखाता है। ‘इसलिए जब … तो’ दोनों भावों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐξῆλθεν
  choice: वह बाहर चला गया
  rationale: ἐξέρχομαι के स्थानगत भाव को ‘बाहर चला गया’ सुरक्षित रखता है और पिछले प्रसंग में यहूदा के निकलने की ओर संकेत करता है; मूल की तरह नाम नहीं जोड़ा गया।
- source_word: λέγει
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथन-शैली में सामान्य भूतकाल ‘कहा’ अधिक स्वाभाविक है।
- source_word: Νῦν
  choice: अब
  rationale: यह वर्तमान निर्णायक घड़ी पर बल देता है, जो उसके बाहर जाने के बाद आरम्भ हुई कथात्मक स्थिति से जुड़ी है।
- source_word: ἐδοξάσθη
  choice: महिमान्वित हुआ है
  rationale: अओरिस्ट कर्मवाच्य को ऐसा पूर्ण भाव देकर प्रस्तुत किया गया है जिसका परिणाम वर्तमान घड़ी में प्रासंगिक है। ‘महिमान्वित’ दोनों समानांतर वाक्यांशों में कर्मवाच्य और धार्मिक अर्थ को स्पष्ट रखता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु की स्थापित उपाधि और दानिय्येल 7 से उसके अंतर्पाठीय संबंध को सुरक्षित रखता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: θεός के लिए आधुनिक हिन्दी बाइबलीय भाषा में परिचित, गरिमापूर्ण और स्पष्ट शब्द।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: ἐν का सीधा संबंधपरक/स्थानगत अर्थ सुरक्षित रखा गया है; सम्भव साधनवाचक अर्थ ‘उसके द्वारा’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: यीशु के महिमान्वित होने की घोषणा का आशय
  choice: महिमान्वित होने को अब घटित/आरम्भ हुई वास्तविकता के रूप में रखा गया है, पर इसे केवल क्रूस, पुनरुत्थान या स्वर्गारोहण तक सीमित नहीं किया गया।
  alternative: इसे केवल क्रूस पर मृत्यु अथवा केवल पुनरुत्थान और ऊँचा किए जाने का स्पष्ट संदर्भ मानना।
  rationale: यूहन्ना में यीशु की महिमा उसकी मृत्यु, पुनरुत्थान और पिता के पास लौटने से जुड़े व्यापक घटनाक्रम को समेट सकती है; अनुवाद इस धार्मिक तनाव और व्यापकता को खुला रखता है।
- issue: ἐν αὐτῷ का अर्थ
  choice: उसमें
  alternative: उसके द्वारा
  rationale: यूनानी वाक्यांश संबंधपरक/स्थानगत और साधनवाचक—दोनों प्रकार से समझा जा सकता है। मुख्य पाठ अधिक सीधा रूप रखता है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मनुष्य का पुत्र’ स्थापित उपाधि को बनाए रखता है। ‘महिमान्वित’ अपेक्षाकृत औपचारिक है, पर इस पद के धार्मिक और कर्मवाच्य अर्थ को ‘महिमा हुई’ की तुलना में अधिक स्पष्ट रूप से व्यक्त करता है। पादटिप्पणी का चिह्न उसी अस्पष्ट यूनानी वाक्यांश ‘उसमें’ पर रखा गया है।
