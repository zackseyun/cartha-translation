  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: hi
  text: इसलिए उन्होंने उस अंधे व्यक्ति से फिर कहा, “चूँकि उसने तुम्हारी आँखें खोल दीं, तुम उसके बारे में क्या कहते हो?” उसने कहा, “वह एक भविष्यद्वक्ता है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले संवाद से निकलने वाली कथात्मक और तार्किक अगली कड़ी को व्यक्त करता है।
- source_word: τῷ τυφλῷ
  choice: उस अंधे व्यक्ति से
  rationale: मूल में विशेषण संज्ञा की तरह प्रयुक्त है। यह अनुवाद संक्षिप्त है और व्यक्ति को उसी पहचान से प्रस्तुत करता है जिससे पूछने वाले उसे संबोधित कर रहे हैं।
- source_word: πάλιν
  choice: फिर
  rationale: चल रही पूछताछ में दोबारा प्रश्न किए जाने का भाव सुरक्षित रखता है।
- source_word: Τί σὺ λέγεις
  choice: तुम उसके बारे में क्या कहते हो
  rationale: स्पष्ट सर्वनाम σὺ को ‘तुम’ से रखा गया है; हिन्दी में इसकी उपस्थिति ही स्वाभाविक रूप से कुछ बल देती है, जबकि ‘तुम स्वयं’ अधिक प्रबल विकल्प है।
- source_word: περὶ αὐτοῦ
  choice: उसके बारे में
  rationale: इस संदर्भ में περί के साथ संबंधवाचक रूप का स्वाभाविक आधुनिक हिन्दी अनुवाद है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ प्रश्न का आधार उस घटना को बनाया गया है कि उसने उसकी आँखें खोलीं। ‘क्योंकि’ उस कारणात्मक संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: उसने तुम्हारी आँखें खोल दीं
  rationale: अओरिस्ट की पूर्ण घटना को सामान्य भूतकाल में रखा गया है; ‘खोल दीं’ चंगाई के संपन्न परिणाम को सहज हिन्दी में व्यक्त करता है।
- source_word: Προφήτης
  choice: एक भविष्यद्वक्ता
  rationale: अनिर्दिष्ट विधेय संज्ञा यहाँ यीशु को भविष्यद्वक्ताओं की श्रेणी में पहचानती है; ‘एक’ हिन्दी में इस अर्थ को स्वाभाविक बनाता है, बिना इसे निश्चित उपाधि मान लेने के।
theological_decisions:
- issue: क्या Προφήτης को निश्चित उपाधि ‘वह भविष्यद्वक्ता’ के रूप में अनुवाद किया जाए या सामान्य संज्ञा ‘एक भविष्यद्वक्ता’ के रूप में
  choice: एक भविष्यद्वक्ता
  alternative: वह भविष्यद्वक्ता
  rationale: संदर्भ में चंगा हुआ व्यक्ति यीशु के विषय में अपनी उभरती हुई समझ बताता है। यूनानी रूप उपाधि-सदृश अर्थ की संभावना को पूरी तरह बंद नहीं करता, पर सामान्य और संदर्भानुकूल अर्थ ‘एक भविष्यद्वक्ता’ है; इससे कथानक की धार्मिक प्रगति पर कोई अतिरिक्त निश्चित दावा आरोपित नहीं होता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। कथात्मक वर्तमान λέγουσιν को हिन्दी कथा-शैली के स्वाभाविक भूतकाल ‘पूछा’ में व्यक्त किया गया है। ‘व्यक्ति’ सम्मानजनक और सामान्य पाठक के लिए स्पष्ट है; वाक्य-रचना मूल प्रश्न की कारणात्मक अस्पष्टता और भविष्यद्वक्ता संबंधी धार्मिक तनाव को टिप्पणियों में सुरक्षित रखती है।
