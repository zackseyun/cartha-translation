  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: hi
  text: यीशु ने सुना कि उन्होंने उसे बाहर निकाल दिया था[a]। उसे पाकर यीशु ने उससे कहा, “क्या तुम मनुष्य के पुत्र पर विश्वास करते हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “मनुष्य के पुत्र” के स्थान पर “परमेश्वर के पुत्र” है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον ... ἔξω
  choice: बाहर निकाल दिया था
  rationale: ἐκβάλλω के साथ ἔξω निष्कासन पर बल देता है। यह हिंदी में स्वाभाविक है और प्रसंग में समुदाय से निकाले जाने का भाव बनाए रखता है।
- source_word: εὑρὼν
  choice: उसे ढूँढ़ लेने पर
  rationale: 'एओरिस्ट कृदंत यहाँ पूर्वकालिक परिस्थिति बताता है: यीशु ने पहले उसे ढूँढ़ा, फिर उससे बात की। यह रूप उस क्रम को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।'
- source_word: Σὺ πιστεύεις
  choice: क्या तुम ... विश्वास करते हो?
  rationale: πιστεύω के लिए ‘विश्वास करना’ मानक और प्रसंगानुकूल है। स्पष्ट सर्वनाम Σὺ का सीधा व्यक्तिगत संबोधन ‘तुम’ से व्यक्त होता है।
- source_word: εἰς
  choice: पर
  rationale: πιστεύω के साथ εἰς किसी व्यक्ति की ओर निर्देशित विश्वास या भरोसा व्यक्त करता है। आधुनिक मानक हिंदी में ‘किसी पर विश्वास करना’ इसका स्वाभाविक समतुल्य है।
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: यह स्थापित पदवीमूलक अनुवाद है, जो यूहन्ना और दानिय्येल 7 से जुड़े अंतर्पाठीय संकेत को बनाए रखता है।
theological_decisions:
- issue: प्रश्न में मसीही पदवी का पाठ
  choice: मनुष्य के पुत्र
  alternative: परमेश्वर के पुत्र
  rationale: SBLGNT के मुख्य पाठ में ἀνθρώπου (‘मनुष्य’) है, इसलिए वही मुख्य पाठ में रखा गया है। महत्वपूर्ण और ऐतिहासिक रूप से प्रभावशाली वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बाहर निकाल दिया’ निष्कासन की तीव्रता व्यक्त करता है, जबकि ‘मनुष्य के पुत्र’ पारंपरिक और अंतर्पाठीय पदवी को सुरक्षित रखता है।
