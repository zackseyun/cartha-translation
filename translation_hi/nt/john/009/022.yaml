id: JHN.9.22
reference: John 9:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: hi
  text: उसके माता-पिता ने ये बातें इसलिए कहीं, क्योंकि वे यहूदियों[a] से डरते थे; क्योंकि यहूदी पहले ही तय कर चुके थे कि यदि कोई उसे मसीह[b] स्वीकार करे, तो उसे आराधनालय से निकाल दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘यहूदियों’। इस प्रसंग में संभवतः आशय उन यहूदी अधिकारियों से है जिनके पास आराधनालय से निकालने का अधिकार था, न कि बिना भेद किए सभी यहूदी लोगों से।
    reason: cultural_note
  - marker: b
    text: या ‘उसे मसीह माने’ अथवा ‘उसे ख्रीस्त स्वीकार करे’।
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπαν
  choice: ये बातें ... कहीं
  rationale: बहुवचन संकेतवाचक ταῦτα को स्पष्ट रखते हुए हिन्दी कथन-शैली में स्वाभाविक रूप दिया गया है।
- source_word: οἱ γονεῖς αὐτοῦ
  choice: उसके माता-पिता
  rationale: γονεῖς का सामान्य और स्वाभाविक हिन्दी समतुल्य ‘माता-पिता’ है।
- source_word: ὅτι ἐφοβοῦντο
  choice: इसलिए ... क्योंकि वे ... डरते थे
  rationale: ὅτι यहाँ कारण बताता है और अपूर्ण भूतकाल भय की जारी अवस्था व्यक्त करता है।
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: यहूदियों / यहूदी
  rationale: मुख्य पाठ यूनानी की व्यापक संज्ञा को बनाए रखता है; प्रसंग में संभावित संकुचित अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἤδη ... συνετέθειντο
  choice: पहले ही तय कर चुके थे
  rationale: प्लूपरफेक्ट पूर्व में हो चुके सामूहिक और निश्चित निर्णय को दर्शाता है; यह हिन्दी में स्वाभाविक है और ‘षड्यंत्र’ जैसा अतिरिक्त भाव नहीं जोड़ता।
- source_word: αὐτὸν ὁμολογήσῃ χριστόν
  choice: उसे मसीह स्वीकार करे
  rationale: ὁμολογέω यहाँ सार्वजनिक रूप से मानने या स्वीकार करने का भाव रखता है; χριστός पदवी के रूप में ‘मसीह’ है।
- source_word: ἀποσυνάγωγος γένηται
  choice: उसे आराधनालय से निकाल दिया जाए
  rationale: यह वाक्यांश आराधनालय के समुदाय से बहिष्कृत किए जाने को दर्शाता है; सरल हिन्दी में उसका व्यावहारिक अर्थ दिया गया है।
theological_decisions:
- issue: χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / मसीह के रूप में
  rationale: यहाँ χριστός नाम की तरह नहीं, अभिषिक्त उद्धारकर्ता की पदवी के रूप में प्रयुक्त है; ‘मसीह’ यहूदी मसीही संदर्भ बनाए रखता है।
- issue: यूहन्ना में οἱ Ἰουδαῖοι का संदर्भ
  choice: मुख्य पाठ में ‘यहूदी’, स्पष्टीकरण पादटिप्पणी में
  alternative: यहूदी अगुवे / यहूदिया के लोग
  rationale: यूनानी अभिव्यक्ति व्यापक है, पर यहाँ आराधनालय से निकालने का अधिकार रखने वाले अधिकारी संभावित संदर्भ हैं। मुख्य पाठ की पारदर्शिता और प्रसंगगत सावधानी दोनों बनाए रखी गई हैं।
- issue: ἀποσυνάγωγος की सामाजिक-धार्मिक शक्ति
  choice: आराधनालय से निकाल दिया जाए
  alternative: आराधनालय से बहिष्कृत कर दिया जाए
  rationale: ‘निकाल दिया जाए’ साधारण पाठक के लिए स्पष्ट है, जबकि प्रसंग संस्थागत बहिष्कार का भाव स्वयं देता है; भारी पारिभाषिक शब्द अनावश्यक रूप से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘माता-पिता’, ‘मसीह’ और ‘आराधनालय’ जैसे प्रचलित बाइबलीय शब्द रखे गए हैं; वाक्य की कारणसूचक संरचना और मूल की अस्पष्टता सुरक्षित है।
