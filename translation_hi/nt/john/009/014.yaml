  text: It was a Sabbath on the day when Jesus made the mud and opened his eyes.
translation:
  language: hi
  text: जिस दिन यीशु ने गीली मिट्टी[a] बनाई और उसकी आँखें खोल दीं[b], वह सब्त का दिन था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चिकनी मिट्टी।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “उसकी आँखें खोल दीं” चंगाई के लिए एक ठोस अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  choice: सब्त का दिन
  rationale: यहाँ शब्द उस दिन को सब्त के रूप में पहचानता है। हिन्दी में ‘सब्त का दिन’ स्वाभाविक है और आगे आने वाले विवाद की पृष्ठभूमि को बिना व्याख्या जोड़े स्पष्ट करता है।
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: जिस दिन
  rationale: संबंधवाचक कालसूचक वाक्यांश का सहज और सटीक हिन्दी रूप।
- source_word: πηλόν
  choice: मिट्टी
  rationale: लार और धरती से बनाए गए गीले लेप के संदर्भ में ‘मिट्टी’ सामान्य पाठक के लिए स्वाभाविक है; ‘गीली मिट्टी’ भी संभावित अर्थ है।
- source_word: ἐποίησεν
  choice: बनाई
  rationale: ποιέω के सामान्य अर्थ ‘बनाना’ को सीधे रखता है और स्त्रीलिंग ‘मिट्टी’ के अनुरूप है।
- source_word: ἀνέῳξεν
  choice: खोल दीं
  rationale: यूहन्ना की ठोस अभिव्यक्ति ‘आँखें खोलना’ को बनाए रखता है; इसे व्याख्यात्मक ‘दृष्टि लौटा दी’ में नहीं बदलता।
- source_word: αὐτοῦ τοὺς ὀφθαλμούς
  choice: उसकी आँखें
  rationale: मूल का शारीरिक और ठोस संदर्भ सुरक्षित रहता है; पूर्ववर्ती प्रसंग से सर्वनाम का संकेत स्पष्ट है।
- source_word: δὲ
  choice: अलग शब्द के रूप में अनूदित नहीं
  rationale: δέ हल्का कथात्मक संक्रमण दर्शाता है; हिन्दी वाक्य-क्रम और प्रसंग इसे स्वाभाविक रूप से व्यक्त करते हैं, इसलिए ‘अब’ या ‘परन्तु’ जोड़ना अनावश्यक होगा।
theological_decisions:
- issue: यीशु द्वारा चंगाई और सब्त का संबंध
  choice: इसे केवल कालसूचक कथात्मक तथ्य के रूप में प्रस्तुत किया गया है।
  alternative: सब्त के नियम के उल्लंघन या वैधता के बारे में व्याख्यात्मक शब्द जोड़ना।
  rationale: पद आगामी विवाद की पृष्ठभूमि देता है, पर स्वयं कोई धार्मिक निर्णय स्पष्ट नहीं करता; अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। कालसूचक उपवाक्य को पहले रखकर मूल के संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है।
