  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: hi
  text: तब फरीसियों ने भी उससे फिर पूछने लगे कि उसे कैसे दिखाई देने लगा[a]। उसने उनसे कहा, “उसने मेरी आँखों पर गीली मिट्टी[b] लगाई, मैंने अपनी आँखें धो लीं, और अब मुझे दिखाई देता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह कैसे देखने लगा”; इस क्रिया का अर्थ यहाँ दृष्टि पाना है।
    reason: lexical_alternative
  - marker: b
    text: या “मिट्टी का लेप” अथवा “चिकनी मिट्टी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: इसलिए ... फिर
  rationale: οὖν कथा के पिछले प्रसंग से परिणामात्मक/क्रमिक संबंध जोड़ता है, और πάλιν पूछताछ की पुनरावृत्ति बताता है। यह संयोजन आधुनिक हिन्दी में दोनों अर्थों को स्वाभाविक रूप से रखता है।
- source_word: ἠρώτων
  choice: पूछा
  rationale: अपूर्ण भूतकाल की जारी या बार-बार होने वाली क्रिया का भाव यहाँ ‘फिर’ से पर्याप्त रूप में व्यक्त हो जाता है; ‘पूछते रहे’ अनावश्यक रूप से पूछताछ की अवधि पर बल देता।
- source_word: καὶ οἱ Φαρισαῖοι
  choice: फरीसियों ने भी
  rationale: καί यहाँ फरीसियों को पहले के प्रश्नकर्ताओं की शृंखला में जोड़ता है; ‘भी’ इसी संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: πῶς ἀνέβλεψεν
  choice: उसे कैसे दिखाई देने लगा
  rationale: चंगाई के इस संदर्भ में ἀναβλέπω का अर्थ दृष्टि पाना है, केवल ऊपर देखना नहीं। जन्म से अंधे व्यक्ति के लिए ‘दृष्टि वापस मिली’ कहना भ्रामक हो सकता है; चुना हुआ वाक्यांश दृष्टि आरम्भ होने का भाव रखता है।
- source_word: Πηλὸν
  choice: गीली मिट्टी
  rationale: πηλός मिट्टी और पानी से बने लेप, अर्थात् mud/clay, को दर्शाता है। ‘गीली मिट्टी’ सामान्य आधुनिक हिन्दी में स्पष्ट है और पदार्थ के स्वरूप को सहज रूप से बताता है।
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: उसने मेरी आँखों पर ... लगाई
  rationale: ἐπιτίθημι और ἐπί का संयोजन किसी वस्तु को ऊपर रखने या लगाने को बताता है; लेप-जैसी गीली मिट्टी के साथ ‘लगाई’ स्वाभाविक और सटीक है।
- source_word: ἐνιψάμην
  choice: मैंने आँखें धो लीं
  rationale: मध्यवाच्य रूप स्वयं धोने की क्रिया व्यक्त करता है। हिन्दी में निहित कर्म को ‘आँखें’ कहने से वाक्य स्वाभाविक बनता है; संदर्भ इसे स्पष्ट रूप से समर्थन देता है।
- source_word: βλέπω
  choice: अब मुझे दिखाई देता है
  rationale: वर्तमान काल चंगाई के मौजूदा परिणाम को उभारता है। ‘अब’ इस परिणामात्मक वर्तमान को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि ‘मुझे दिखाई देता है’ साधारण ‘मैं देखता हूँ’ से अधिक मुहावरेदार है।
