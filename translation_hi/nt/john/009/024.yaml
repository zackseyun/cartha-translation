source:
  edition: SBLGNT
  text: Ἐφώνησαν οὖν ⸂τὸν ἄνθρωπον ἐκ δευτέρου⸃ ὃς ἦν τυφλὸς καὶ εἶπαν αὐτῷ· Δὸς δόξαν τῷ θεῷ· ἡμεῖς οἴδαμεν ὅτι ⸂οὗτος ὁ ἄνθρωπος⸃ ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: hi
  text: इसलिए उन्होंने उस मनुष्य को, जो पहले अंधा था, दूसरी बार बुलाया और उससे कहा, “परमेश्वर की महिमा कर[a]। हम जानते हैं कि यह मनुष्य पापी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या सम्भवतः यह एक गंभीर मुहावरेदार आज्ञा है: “परमेश्वर को महिमा दे,” अर्थात् “परमेश्वर के सामने सच बोल” या “परमेश्वर के सामने खुलकर स्वीकार कर।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: बुलाकर
  rationale: यहाँ क्रिया उस चंगे हुए मनुष्य को फिर अपने सामने बुलाने को व्यक्त करती है। ‘बुलाया’ स्वाभाविक है और ‘तलब किया’ की अपेक्षा कम आधिकारिक बल आरोपित करता है। संयुक्त क्रिया ‘बुलाकर ... कहा’ हिन्दी में प्रवाहपूर्ण है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पूर्ववर्ती बातचीत से निकली कथा की अगली कार्रवाई और निष्कर्षात्मक संबंध दोनों को व्यक्त करता है।
- source_word: τὸν ἄνθρωπον
  choice: उस मनुष्य को
  rationale: संदर्भ में एक निश्चित पुरुष व्यक्ति है; ‘उस मनुष्य’ पूर्वोक्त व्यक्ति की ओर स्पष्ट संकेत करता है।
- source_word: ἐκ δευτέρου
  choice: दूसरी बार
  rationale: यूनानी पदबंध का सीधा अर्थ ‘दूसरी बार’ है; यह केवल ‘फिर’ की तुलना में गिनती का भाव अधिक ठीक रखता है।
- source_word: ὃς ἦν τυφλός
  choice: जो पहले अंधा था
  rationale: ἦν का भूतकाल रखते हुए ‘पहले’ यह स्पष्ट करता है कि अंधापन उसकी पिछली अवस्था थी और अब वह चंगा हो चुका है।
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: परमेश्वर की महिमा कर
  rationale: यह यूनानी अभिव्यक्ति की प्रत्यक्ष शब्दावली को सुरक्षित रखता है। इसके सत्य बोलने या स्वीकार करने की गंभीर शपथात्मक पुकार होने की सम्भावना पादटिप्पणी में दी गई है।
- source_word: ἡμεῖς οἴδαμεν
  choice: हम जानते हैं
  rationale: व्यक्त सर्वनाम ἡμεῖς और क्रिया मिलकर वक्ताओं के दावे और बल को व्यक्त करते हैं; ‘हम जानते हैं’ इसे स्वाभाविक रूप से बनाए रखता है।
- source_word: οὗτος ὁ ἄνθρωπος
  choice: यह मनुष्य
  rationale: यह प्रदर्शनवाचक अभिव्यक्ति का सीधा और गरिमापूर्ण अनुवाद है; ‘यह आदमी’ सम्भव है, पर ‘मनुष्य’ बाइबिलीय सार्वजनिक पाठ के अनुरूप रहते हुए स्पष्ट है और अनावश्यक तिरस्कार नहीं जोड़ता।
- source_word: ἁμαρτωλός
  choice: पापी
  rationale: विधेय रूप में यह व्यक्ति को ‘पापी’ ठहराता है; ‘पापमय’ या केवल ‘पापी स्वभाव का’ आरोप को अनावश्यक रूप से अमूर्त कर देता।
theological_decisions:
- issue: Δὸς δόξαν τῷ θεῷ का मुहावरेदार बल
  choice: मुख्य पाठ में प्रत्यक्ष शब्दावली ‘परमेश्वर की महिमा कर’ रखना
  alternative: ‘परमेश्वर के सामने सच बोल’ अथवा ‘परमेश्वर के सामने खुलकर स्वीकार कर’
  rationale: यह पद सम्भवतः सत्य बोलने या खुलकर स्वीकार करने की गंभीर आज्ञा है (तुलना यहोशू 7:19), फिर भी यूनानी शब्द स्वयं परमेश्वर की महिमा करने की बात कहते हैं। मुख्य पाठ प्रत्यक्ष रूप को रखता और पादटिप्पणी सम्भावित मुहावरेदार अर्थ बताती है, जिससे अर्थगत तनाव बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। संबोधन का एकवचन ‘कर’ मूल यूनानी की प्रत्यक्ष आज्ञा को दर्शाता है; प्रसंग में अधिकारियों की कठोरता के कारण इसे सम्मानसूचक बनाकर नरम नहीं किया गया। पादटिप्पणी का चिह्न [a] उसी कथन के बाद रखा गया है जिसकी व्याख्या वह करती है।
