  text: And they said to him[a], “Where is that man?” He says, “I do not know.”
translation:
  language: hi
  text: उन्होंने उससे कहा, “वह आदमी कहाँ है?” उसने कहा, “मैं नहीं जानता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: उन्होंने
  rationale: हिन्दी में पिछले प्रसंग से संबंध वाक्य-क्रम से स्पष्ट है; अलग से ‘और’ जोड़ना यहाँ अनावश्यक और कुछ अस्वाभाविक होगा।
- source_word: εἶπαν αὐτῷ
  choice: उन्होंने उससे कहा
  rationale: बहुवचन क्रिया और दत्तिवाचक सर्वनाम को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है; प्रश्न होने पर भी मूल क्रिया ‘कहा’ है, ‘पूछा’ नहीं।
- source_word: Ποῦ ἐστιν ἐκεῖνος
  choice: वह आदमी कहाँ है?
  rationale: ἐκεῖνος के संकेतवाचक बल को ‘वह’ से सुरक्षित रखते हुए, पुरुष-संदर्भ को ‘आदमी’ द्वारा सहज और स्पष्ट बनाया गया है।
- source_word: λέγει
  choice: उसने कहा
  rationale: यूनानी का ऐतिहासिक वर्तमान हिन्दी कथा-शैली में सामान्य भूतकाल से अधिक स्वाभाविक ढंग से व्यक्त होता है; अर्थ में कोई परिवर्तन नहीं होता।
- source_word: Οὐκ οἶδα
  choice: मैं नहीं जानता
  rationale: मूल कथन का सीधा, स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी रूप।
