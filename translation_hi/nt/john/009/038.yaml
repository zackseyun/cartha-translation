  text: And he said[a], “I believe[b], Lord,” and he worshiped him.
translation:
  language: hi
  text: और उसने कहा, “मैं विश्वास करता हूँ, प्रभु[a],” और उसने उनकी आराधना की[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महोदय।” यूनानी κύριε आदरपूर्वक संबोधन भी हो सकता है; यहाँ प्रसंग विश्वास की घोषणा और आराधना पर चरम तक पहुँचता है, इसलिए “प्रभु” को प्राथमिकता दी गई है।
    reason: alternative_reading
  - marker: b
    text: या “उनके सामने दण्डवत किया” अथवा “उन्हें श्रद्धापूर्वक प्रणाम किया।” यूनानी क्रिया झुककर दण्डवत करने या श्रद्धा प्रकट करने को भी दर्शा सकती है; यहाँ प्रसंग को देखते हुए इसका अनुवाद “आराधना की” किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: तब उसने
  rationale: ὁ यहाँ पहले बताए गए चंगे हुए व्यक्ति के लिए सर्वनाम का काम करता है। δέ को प्रसंग में हल्के कथात्मक संक्रमण के रूप में ‘तब’ कहा गया है; ‘परन्तु’ अनावश्यक विरोध प्रकट करता।
- source_word: ἔφη
  choice: कहा
  rationale: φημί का यह एओरिस्ट रूप कथन आरम्भ कराने वाला सामान्य कथात्मक क्रियारूप है; आधुनिक हिन्दी में ‘कहा’ स्वाभाविक और सटीक है।
- source_word: Πιστεύω
  choice: मैं विश्वास करता हूँ
  rationale: यह यीशु के आत्म-प्रकाशन के सीधे उत्तर में है और यूहन्ना में बार-बार आने वाली ‘विश्वास’ की शब्दावली से संबंध बनाए रखता है।
- source_word: κύριε
  choice: प्रभु
  rationale: κύριε सम्मानसूचक ‘महोदय’ भी हो सकता है, पर यहाँ विश्वास की घोषणा और आराधना की परिणति के कारण ‘प्रभु’ अधिक उपयुक्त है।
- source_word: προσεκύνησεν
  choice: आराधना की
  rationale: προσκυνέω झुकने, दण्डवत करने अथवा श्रद्धापूर्वक सम्मान देने को भी व्यक्त कर सकता है; इस प्रसंग में यीशु के प्रति विश्वास की घोषणा के बाद ‘आराधना की’ उसके संभावित धार्मिक आशय को सबसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αὐτῷ
  choice: उनकी
  rationale: यह सर्वनाम यीशु की ओर संकेत करता है। सम्मानसूचक आधुनिक हिन्दी में ‘उनकी आराधना की’ स्वाभाविक है, जबकि यूनानी दत्तिव का संबंध स्पष्ट बना रहता है।
theological_decisions:
- issue: κύριε को केवल सम्मानसूचक संबोधन माना जाए या अधिक गहरे अर्थ में ‘प्रभु’
  choice: प्रभु
  alternative: महोदय
  rationale: शब्द दोनों अर्थों की अनुमति देता है, इसलिए विकल्प पादटिप्पणी में सुरक्षित है। फिर भी यीशु के आत्म-प्रकाशन के बाद मनुष्य का विश्वास जताना और उनकी आराधना करना इस संबोधन को अधिक गहरा बनाता है।
- issue: προσεκύνησεν को ‘आराधना की’ कहा जाए या शारीरिक रूप से झुकने/सम्मान देने की क्रिया
  choice: आराधना की
  alternative: उनके सामने दण्डवत किया / उन्हें श्रद्धापूर्वक प्रणाम किया
  rationale: मूल क्रिया में दण्डवत और श्रद्धांजलि के अर्थ संभव हैं। यहाँ उसका लक्ष्य यीशु हैं और यह क्रिया विश्वास की घोषणा के तुरन्त बाद आती है, इसलिए मुख्य पाठ में ‘आराधना की’ उचित है; वास्तविक शब्दार्थगत विस्तार पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यीशु के लिए सम्मानसूचक बहुवचन ‘उनकी’ प्रयुक्त हुआ है। मूल यूनानी की शब्दार्थगत अस्पष्टता दोनों पादटिप्पणियों में स्पष्ट रूप से सुरक्षित है।
