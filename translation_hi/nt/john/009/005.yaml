  text: ὅταν ἐν τῷ κόσμῳ ὦ, φῶς εἰμι τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/005.yaml
  text: While I am in the world, I am the light of the world.
translation:
  language: hi
  text: जब तक मैं संसार में हूँ, मैं संसार की ज्योति हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: जब तक
  rationale: यहाँ वर्तमान काल के साथ प्रसंगगत अर्थ उस अवधि को व्यक्त करता है जिसमें यीशु संसार में हैं; आधुनिक हिन्दी में “जब तक” इस समय-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κόσμος
  choice: संसार
  rationale: यूहन्ना के साहित्य में κόσμος के लिए प्रचलित और प्रसंगानुकूल हिन्दी शब्द; दोनों occurrences में समानता रखी गई है।
- source_word: φῶς
  choice: ज्योति
  rationale: यीशु के आत्म-प्रकटीकरण में प्रयुक्त रूपक की गरिमा और यूहन्ना की पारंपरिक बाइबलीय शब्दावली बनाए रखता है।
- source_word: εἰμι
  choice: मैं ... हूँ
  rationale: यूनानी का सीधा वर्तमानकालीन अस्तित्व/पहचान-वाचक कथन सुरक्षित रखा गया है।
theological_decisions:
- issue: ὅταν की कालगत व्याख्या
  choice: जब तक मैं संसार में हूँ
  alternative: जब कभी मैं संसार में हूँ
  rationale: ὅταν सामान्यतः “जब कभी” हो सकता है, पर यूहन्ना 9:4–5 का निकट प्रसंग यीशु की सांसारिक उपस्थिति की सीमित अवधि पर बल देता है। “जब तक” उसी प्रसंगगत बल को स्पष्ट और स्वाभाविक हिन्दी में रखता है, बिना प्रकाश के रूपक को आगे व्याख्यायित किए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। “ज्योति” को “रोशनी” पर वरीयता दी गई है क्योंकि यह आत्म-प्रकटीकरण के रूपक की साहित्यिक और धर्मवैचारिक गंभीरता को बनाए रखता है।
