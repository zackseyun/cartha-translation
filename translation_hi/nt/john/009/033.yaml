  text: εἰ μὴ ἦν οὗτος παρὰ θεοῦ, οὐκ ἠδύνατο ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/033.yaml
  text: If this man were not from God[a], he could do nothing.
translation:
  language: hi
  text: यदि यह मनुष्य परमेश्वर की ओर से न होता[a], तो वह कुछ भी नहीं कर सकता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि यह मनुष्य परमेश्वर की ओर से न होता, तो…”
    reason: εἰ μή की संक्षिप्त शर्तीय अभिव्यक्ति का स्वाभाविक हिन्दी पुनर्विन्यास।
lexical_decisions:
- source_word: εἰ μὴ
  choice: यदि ... न
  rationale: अपूर्णकालिक क्रिया के साथ यह अवास्तविक या तथ्य-विरुद्ध शर्त व्यक्त करता है। ‘यदि ... न’ यूनानी की शर्तीय संरचना को स्पष्ट रूप से बनाए रखता है।
- source_word: ἦν
  choice: होता
  rationale: यद्यपि यूनानी में यह अपूर्णकालिक निदर्शक है, हिन्दी में ‘होता’ तथ्य-विरुद्ध शर्त का स्वाभाविक बोध कराता है।
- source_word: οὗτος
  choice: यह मनुष्य
  rationale: संदर्भ में संकेत यीशु नामक पुरुष की ओर है। ‘यह मनुष्य’ व्यक्तिगत संकेत को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: παρὰ θεοῦ
  choice: परमेश्वर की ओर से
  rationale: सम्बन्धकारक के साथ παρά स्रोत या उद्गम दर्शाता है। ‘परमेश्वर की ओर से’ इस व्यापक अर्थ को बनाए रखता है और ‘परमेश्वर द्वारा भेजा हुआ’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: οὐκ ἠδύνατο
  choice: नहीं कर सकता था
  rationale: यह असमर्थता व्यक्त करता है। हिन्दी में ‘नहीं कर सकता था’ शर्तीय तर्क के अनुकूल और स्वाभाविक है।
- source_word: ποιεῖν
  choice: कर
  rationale: ποιέω का अर्थ व्यापक है; यहाँ ‘करना’ आगामी कर्म के साथ सहज है और चमत्कार करने की व्याख्या को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: οὐδέν
  choice: कुछ भी नहीं
  rationale: पूर्ववर्ती निषेध के साथ यह पूर्ण असमर्थता पर बल देता है; ‘कुछ भी नहीं’ हिन्दी में उसी बल को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: यीशु के संबंध में ‘परमेश्वर की ओर से’ का अर्थ
  choice: स्रोत-पाठ की व्यापक अभिव्यक्ति ‘परमेश्वर की ओर से’ को बनाए रखा गया।
  alternative: ‘परमेश्वर द्वारा भेजा हुआ’ या ‘परमेश्वर से अधिकार पाया हुआ’
  rationale: वाक्यांश यीशु और उनके कार्यों के दिव्य स्रोत या समर्थन की ओर संकेत करता है, पर स्वयं यूनानी अभिव्यक्ति मिशन, अधिकार या तत्त्वमीमांसा का कोई अधिक तकनीकी दावा स्पष्ट नहीं करती। इसलिए धर्मवैज्ञानिक तनाव को खुला रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘परमेश्वर की ओर से’ मूल के स्रोत-संबंधी अर्थ को सुरक्षित रखता है; ‘कुछ भी नहीं कर सकता था’ यूनानी निषेध के बल को व्यक्त करता है।
