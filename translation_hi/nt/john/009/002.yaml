source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: hi
  text: और उसके शिष्यों ने उससे पूछा, “रब्बी, किसने पाप किया था—इस मनुष्य ने या इसके माता-पिता ने—कि यह अंधा जन्मा?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसके फलस्वरूप यह अंधा जन्मा?” यूनानी उपवाक्य शिष्यों के प्रश्न में उनके द्वारा माने गए उद्देश्य या परिणाम के संबंध को व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: पूछा
  rationale: यहाँ क्रिया यीशु से सीधे प्रश्न करने को व्यक्त करती है; ‘पूछा’ सहज और सटीक आधुनिक हिन्दी है।
- source_word: μαθηταὶ
  choice: शिष्य
  rationale: सुसमाचार के शिक्षक-अनुयायी संबंध को स्पष्ट रखने वाला प्रचलित और गरिमापूर्ण शब्द।
- source_word: λέγοντες
  choice: पूछा
  rationale: यूनानी कृदंत ‘कहते हुए’ को हिन्दी में अलग से दोहराने के बजाय मुख्य प्रश्नवाचक क्रिया में स्वाभाविक रूप से समाहित किया गया है।
- source_word: Ῥαββί
  choice: रब्बी
  rationale: यह यहूदी संबोधन का ऐतिहासिक-सांस्कृतिक स्वर बनाए रखता है और हिन्दी बाइबलीय प्रयोग में समझा जाता है।
- source_word: τίς
  choice: किसने
  rationale: यह प्रश्न पाप करने वाले व्यक्ति या पक्ष की पहचान पूछता है; ‘किसने’ हिन्दी में सीधा समतुल्य है।
- source_word: ἥμαρτεν
  choice: पाप किया था
  rationale: भूतकालीन घटना के रूप में शिष्यों की धारणा व्यक्त होती है; ‘था’ जन्म से पहले माने गए पाप और जन्मांधता के संबंध को हिन्दी में स्पष्ट करता है, बिना उसे सत्य ठहराए।
- source_word: οὗτος
  choice: इस मनुष्य ने
  rationale: शाब्दिक ‘इसने’ की तुलना में संदर्भित व्यक्ति को स्पष्ट करता है और प्रश्न की समांतर रचना बनाए रखता है।
- source_word: γονεῖς
  choice: माता-पिता
  rationale: γονεῖς का मानक, स्वाभाविक और समावेशी हिन्दी समतुल्य।
- source_word: ἵνα
  choice: कि
  rationale: ‘कि’ शिष्यों द्वारा माने गए उद्देश्य या परिणाम के संबंध को जानबूझकर खुला रखता है और हिन्दी प्रश्न में स्वाभाविक है।
- source_word: τυφλὸς
  choice: अंधा
  rationale: जन्म के समय की अवस्था बताने वाले विधेय विशेषण का सीधा हिन्दी समतुल्य।
- source_word: γεννηθῇ
  choice: जन्मा
  rationale: ἵνα के अधीन निष्क्रिय भाव को हिन्दी में सहज ढंग से व्यक्त करता है; ‘अंधा जन्मा’ जन्मजात अवस्था को स्पष्ट रखता है।
theological_decisions:
- issue: शिष्यों के प्रश्न में ἵνα द्वारा पाप और जन्मांधता के बीच व्यक्त संबंध
  choice: ‘कि यह अंधा जन्मा’
  alternative: ‘जिसके फलस्वरूप यह अंधा जन्मा’ अथवा ‘ताकि यह अंधा जन्मे’
  rationale: मुख्य पाठ शिष्यों द्वारा माने गए संबंध को प्रस्तुत करता है, पर यह तय नहीं करता कि वह उद्देश्य है या परिणाम, और न ही उसे कथाकार की स्वीकृत शिक्षा बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण कथात्मक शैली। ‘रब्बी’ से यहूदी ऐतिहासिक परिवेश सुरक्षित रखा गया है। कृदंत λέγοντες को अलग से ‘कहते हुए’ न देकर हिन्दी की स्वाभाविक प्रश्न-रचना अपनाई गई है।
