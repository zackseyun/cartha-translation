- issue: 'पद के आरम्भ में पाठांतर: ἡμᾶς (‘हमें/हम’) बनाम ἐμέ (‘मुझे/मैं’)'
  choice: हमें उसके काम करने हैं जिसने मुझे भेजा है
  alternative: मुझे उसके काम करने हैं जिसने मुझे भेजा है
  rationale: दिए गए SBLGNT मूलपाठ में ἡμᾶς है, इसलिए मुख्य पाठ बहुवचन का अनुसरण करता है। एकवचन पाठ व्यापक पांडुलिपि परंपरा में मिलता है, अतः पारदर्शिता के लिए उसे पादटिप्पणी में रखा गया है।
- issue: ‘दिन’ और ‘रात’ के रूपक का अर्थ
  choice: रूपक को बिना व्याख्यात्मक विस्तार के यथावत रखना
  alternative: दिन को सेवकाई का अवसर और रात को मृत्यु अथवा अवसर का अंत कहकर स्पष्ट करना
  rationale: मूल कथन अर्थ-संभावनाओं को खुला रखता है; मुख्य पाठ में किसी एक धर्मवैज्ञानिक व्याख्या को आरोपित नहीं किया गया।
