lexical_decisions:
- source_word: ἡμᾶς
  choice: हमें
  rationale: SBLGNT के प्रथम पुरुष बहुवचन कर्मकारक को δεῖ के साथ स्वाभाविक हिन्दी में ‘हमें … करने हैं’ कहा गया है; इससे सामूहिक दायित्व बना रहता है।
- source_word: δεῖ
  choice: करने हैं
  rationale: यह आवश्यक दायित्व व्यक्त करता है। हिन्दी में ‘हमें … करने हैं’ सहज है और यूनानी की अनिवार्यता बनाए रखता है।
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: काम करने
  rationale: सजातीय ‘कामों को काम करना’ हिन्दी में अस्वाभाविक होता; ‘उसके काम करने’ अर्थ और यूहन्ना में परमेश्वर द्वारा सौंपे गए कार्यों का संबंध बनाए रखता है।
- source_word: τοῦ πέμψαντός με
  choice: उसके … जिसने मुझे भेजा है
  rationale: संज्ञात्मक कृदंत को आधुनिक और स्पष्ट हिन्दी संबंधवाचक वाक्यांश में व्यक्त किया गया है, बिना मुख्य पाठ में भेजने वाले की पहचान को अतिरिक्त रूप से स्पष्ट किए।
- source_word: ἕως ἡμέρα ἐστίν
  choice: जब तक दिन है
  rationale: आने वाली रात के विरोध में उपलब्ध कार्यकाल को दर्शाने वाला स्वाभाविक हिन्दी समय-सूचक प्रयोग।
- source_word: ἔρχεται νὺξ
  choice: रात आ रही है
  rationale: वर्तमान काल की निकट भविष्यसूचक शक्ति और दिन-रात के रूपक को सीधे बनाए रखता है।
- source_word: ὅτε οὐδεὶς δύναται ἐργάζεσθαι
  choice: जब कोई काम नहीं कर सकता
  rationale: काल-सूचक उपवाक्य, सार्वभौमिक नकार और सामर्थ्य को स्पष्ट तथा सहज हिन्दी में सुरक्षित रखता है।
