id: JHN.9.30
reference: John 9:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: hi
  text: उस मनुष्य ने उन्हें उत्तर दिया, “आश्चर्य की बात तो यही है[a] कि तुम नहीं जानते कि वह कहाँ से है[b], फिर भी उसने मेरी आँखें खोल दीं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विस्मय की बात तो यही है।”
    reason: θαυμαστόν के लिए निकट अर्थ वाला वैकल्पिक अनुवाद।
  - marker: b
    text: या, “वह कहाँ से आता है।”
    reason: πόθεν ἐστίν में स्रोत या उत्पत्ति का भाव व्यक्त करने वाला वैकल्पिक मुहावरा।
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: उस मनुष्य ने उन्हें उत्तर दिया
  rationale: यूहन्ना की संवाद-शैली को स्वाभाविक हिन्दी में रखते हुए ‘उत्तर दिया’ प्रतिक्रिया को व्यक्त करता है; ‘उस मनुष्य’ प्रसंग के पहले से परिचित, जन्म से अंधे रहे पुरुष को निर्दिष्ट करता है। ग्रीक के ‘उत्तर दिया और उनसे कहा’ को शब्दशः दोहराने के बजाय हिन्दी की सहज अभिव्यक्ति अपनाई गई है।
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: आश्चर्य की बात तो यही है
  rationale: यह अभिव्यक्ति उस विषय पर बल और व्यक्ति के कथन में निहित विडंबना दोनों को स्वाभाविक रूप से व्यक्त करती है। ‘तो’ γάρ के व्याख्यात्मक/बलात्मक प्रवाह को हिन्दी में दर्शाता है।
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: तुम नहीं जानते
  rationale: स्पष्ट सर्वनाम ὑμεῖς के बल को बनाए रखा गया है। संबोधित लोग इसी संवाद में उस मनुष्य से ‘तू’ कह चुके हैं, पर उसका बहुवचन ‘तुम’ यहाँ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक सम्मानार्थक भाव नहीं जोड़ता।
- source_word: πόθεν ἐστίν
  choice: वह कहाँ से है
  rationale: यीशु के स्रोत या मूल के विषय में कथन को सीधी और मुहावरेदार हिन्दी में रखा गया है, बिना यह तय किए कि आशय केवल भौगोलिक मूल है या व्यापक उत्पत्ति।
- source_word: καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: फिर भी उसने मेरी आँखें खोल दीं
  rationale: καί का प्रसंगगत विरोधाभासी बल ‘फिर भी’ से स्पष्ट होता है। ‘मेरी आँखें खोल दीं’ तत्काल प्रसंग में शारीरिक चंगाई का स्वाभाविक वर्णन है और साथ ही यूहन्ना में उपस्थित व्यापक दृष्टि-अंधेपन की प्रतिध्वनि को खुला छोड़ता है।
theological_decisions:
- issue: ‘मेरी आँखें खोल दीं’ का शारीरिक और आध्यात्मिक आशय
  choice: शारीरिक चंगाई की मूल अभिव्यक्ति को ज्यों का त्यों बनाए रखना
  alternative: ऐसा अनुवाद करना जो आध्यात्मिक ज्ञान या अंतर्दृष्टि को स्पष्ट रूप से सामने रखे
  rationale: तात्कालिक संदर्भ व्यक्ति की शारीरिक दृष्टि लौटने का है। यूहन्ना के वृत्तांत में आध्यात्मिक दृष्टि की प्रतिध्वनि मौजूद है, पर उसे अनुवाद में स्पष्ट जोड़ना मूल कथन की सार्थक बहुस्तरीयता को समय से पहले सुलझा देता।
- issue: ‘वह कहाँ से है’ में यीशु के मूल का प्रश्न
  choice: मूल पाठ की खुली अभिव्यक्ति बनाए रखना
  alternative: इसे केवल जन्मस्थान, मानवीय वंश, या स्वर्गीय उत्पत्ति के रूप में स्पष्ट करना
  rationale: πόθεν ἐστίν स्रोत या मूल को व्यक्त करता है, जबकि यूहन्ना के प्रसंग में इसका अर्थ विडंबनापूर्ण और धर्मवैज्ञानिक रूप से गहरा हो सकता है। अनुवाद किसी एक व्याख्या को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण संवाद-शैली। ‘आश्चर्य की बात तो यही है’ व्यक्ति के तीखे, विडंबनापूर्ण प्रत्युत्तर को सहज रूप में व्यक्त करता है। ‘तुम’ बहुवचन संबोधन है; ‘आप’ मूल में निहित न होने वाला सम्मान जोड़ता।
