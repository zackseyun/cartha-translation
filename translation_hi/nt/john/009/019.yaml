source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτοὺς λέγοντες· Οὗτός ἐστιν ὁ υἱὸς ὑμῶν, ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη; πῶς οὖν ⸂βλέπει ἄρτι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: hi
  text: और उन्होंने उसके माता-पिता से पूछा, “क्या यह तुम्हारा बेटा है, जिसके बारे में तुम कहते हो कि यह जन्म से अंधा था? तो फिर अब यह कैसे देखता है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν αὐτοὺς λέγοντες
  choice: उन्होंने उसके माता-पिता से पूछा
  rationale: हिन्दी में केवल ‘उन्होंने उनसे पूछा’ संदर्भ से बाहर अस्पष्ट हो सकता है; पूर्ववर्ती पद के स्पष्ट संदर्भ को स्वाभाविक रूप से दोहराया गया है। λέγοντες को अलग से ‘कहते हुए’ कहना अनावश्यक और अस्वाभाविक होता, इसलिए प्रश्नवाचक कथन में समाहित किया गया है।
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: क्या यह तुम्हारा बेटा है
  rationale: रूप की दृष्टि से कथन जैसा होते हुए भी प्रसंग में यह स्पष्ट प्रश्न है; ‘क्या’ आधुनिक हिन्दी में प्रश्नार्थक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὃν ὑμεῖς λέγετε
  choice: जिसके बारे में तुम कहते हो
  rationale: λέγετε को तटस्थ ‘कहते हो’ रखा गया है; ‘दावा करते हो’ जैसा अनावश्यक संदेह नहीं जोड़ा गया। ὑμεῖς का बल ‘तुम’ से व्यक्त होता है।
- source_word: τυφλὸς ἐγεννήθη
  choice: जन्म से अंधा था
  rationale: यह जन्मजात अंधेपन को स्पष्ट और प्रचलित हिन्दी में व्यक्त करता है। शाब्दिक ‘अंधा जन्मा था’ की तुलना में यह अधिक स्वाभाविक है।
- source_word: πῶς οὖν
  choice: तो फिर ... कैसे
  rationale: οὖν का निष्कर्षात्मक बल ‘तो फिर’ से सुरक्षित रहता है और हिन्दी प्रश्न-विन्यास स्वाभाविक बनता है।
- source_word: βλέπει ἄρτι
  choice: अब यह कैसे देखता है
  rationale: ἄρτι पूर्व अवस्था और वर्तमान दृष्टि के बीच विरोध दिखाता है; ‘अब’ इसे स्पष्ट करता है। βλέπει को वास्तविक वर्तमान देखने के रूप में रखा गया है, केवल क्षमता के अर्थ में ‘देख सकता है’ नहीं।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। सम्बोधन में बहुवचन माता-पिता के लिए प्रचलित ‘तुम/तुम्हारा’ रखा गया है। ‘यह’ का प्रयोग सामने उपस्थित पुत्र की ओर संकेत को बनाए रखता है।
