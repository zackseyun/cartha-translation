  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: hi
  text: इसलिए यहूदियों[a] ने उसके विषय में विश्वास नहीं किया कि वह अंधा था और उसे दृष्टि मिली थी, जब तक कि उन्होंने उस व्यक्ति के माता-पिता को नहीं बुलाया जिसे दृष्टि मिली थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “यहूदी नेता” अथवा “यहूदिया के लोग”; यह इस बात पर निर्भर है कि इस प्रसंग में यूहन्ना के “यहूदी” शब्द का आशय कैसे समझा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: विश्वास नहीं किया
  rationale: ὅτι से आरम्भ होने वाली कथन-वस्तु के साथ यहाँ क्रिया का अर्थ किसी तथ्य को सच न मानना है; इसलिए ‘विश्वास नहीं किया’ स्वाभाविक और सटीक है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदियों
  rationale: यूनानी पद का सीधा अर्थ ‘यहूदी’ है। यूहन्ना में इसका संदर्भ कभी यहूदी अगुओं, कभी यहूदिया के लोगों, और कभी किसी स्थानीय यहूदी समूह से हो सकता है; मुख्य पाठ मूल की व्यापकता बनाए रखता है।
- source_word: περὶ αὐτοῦ
  choice: उसके विषय में
  rationale: περί के संबंधकारक प्रयोग का अर्थ ‘के विषय में/के बारे में’ है; यहाँ ‘उसके विषय में’ गरिमापूर्ण और सहज है।
- source_word: ἦν τυφλὸς
  choice: वह अंधा था
  rationale: यूनानी अपूर्ण भूतकाल को सीधे रूप में रखा गया है; प्रसंग स्वयं स्पष्ट करता है कि यह उसकी चंगाई से पहले की अवस्था थी।
- source_word: ἀνέβλεψεν
  choice: अब देखने लगा है
  rationale: चंगाई के प्रसंग में ἀναβλέπω का अर्थ दृष्टि पाना है। ‘देखने लगा’ यह अर्थ देता है और ‘फिर से’ कहकर पहले कभी देख सकने की अनावश्यक धारणा नहीं जोड़ता; ‘अब’ वर्तमान बदली हुई दशा स्पष्ट करता है।
- source_word: ἕως ὅτου
  choice: जब तक कि
  rationale: यह संयुक्त पद अविश्वास की समय-सीमा बताता है; हिन्दी में ‘जब तक कि’ इसका स्वाभाविक समतुल्य है।
- source_word: ἐφώνησαν
  choice: बुलाया
  rationale: φωνέω का यहाँ अर्थ बुलाना है; ‘तलब किया’ मूल से अधिक औपचारिक और कठोर होता।
- source_word: γονεῖς
  choice: माता-पिता
  rationale: γονεῖς के लिए यह सामान्य और सटीक हिन्दी पद है।
- source_word: τοῦ ἀναβλέψαντος
  choice: उस व्यक्ति के ... जो अब देखने लगा था
  rationale: संज्ञीकृत कृदंत उस व्यक्ति को दृष्टि पाने की घटना से पहचानता है। हिन्दी में ‘उस व्यक्ति ... जो’ स्वाभाविक है और प्रसंगानुसार निहित मानव संदर्भ को स्पष्ट करता है।
theological_decisions:
- issue: यूहन्ना में οἱ Ἰουδαῖοι का संदर्भ और आशय
  choice: यहूदी
  alternative: यहूदी अगुए; यहूदिया के लोग
  rationale: मूल यूनानी पद को मुख्य पाठ में संकीर्ण किए बिना रखा गया है। निकटवर्ती प्रसंग में पूछताछ करने वाला नेतृत्व-समूह अभिप्रेत हो सकता है, पर पद स्वयं इतना विशिष्ट नहीं है; इसलिए संभावित संदर्भ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘दृष्टि प्राप्त की’ की अपेक्षा ‘देखने लगा’ सामान्य पाठक के लिए अधिक स्वाभाविक है। पादटिप्पणी-चिह्न वाक्य के अंत में रखा गया है क्योंकि वह οἱ Ἰουδαῖοι के संदर्भ पर टिप्पणी करता है, यद्यपि हिन्दी वाक्य में संबंधित शब्द आरम्भ में आता है।
