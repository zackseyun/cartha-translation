source:
  edition: SBLGNT
  text: ἄλλοι ἔλεγον ὅτι Οὗτός ἐστιν· ἄλλοι ⸂ἔλεγον· Οὐχί, ἀλλὰ⸃ ὅμοιος αὐτῷ ἐστιν. ἐκεῖνος ἔλεγεν ὅτι Ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: hi
  text: कुछ लोग कह रहे थे, “यह वही है।” दूसरे कह रहे थे, “नहीं, बल्कि यह उसके जैसा है।” पर वह कहता रहा, “मैं वही हूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से, “मैं हूँ।” यहाँ इसका अर्थ सामान्य आत्म-पहचान है: वह व्यक्ति कह रहा है कि लोग जिस व्यक्ति के विषय में बात कर रहे हैं, वह वही है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι … ἄλλοι
  choice: कुछ लोग … दूसरे
  rationale: दो अलग समूहों के बीच वितरित विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल भीड़ में चल रही या बार-बार हो रही बातचीत का संकेत देता है।
- source_word: Οὗτός ἐστιν
  choice: यह वही है
  rationale: संक्षिप्त प्रत्यक्ष पहचान को बिना ‘आदमी’ जैसे अनुल्लिखित शब्द जोड़े स्वाभाविक हिन्दी में रखता है।
- source_word: Οὐχί, ἀλλὰ
  choice: नहीं, बल्कि
  rationale: दृढ़ निषेध और उसके बाद आने वाले सुधारात्मक विरोध को स्पष्ट रूप से व्यक्त करता है।
- source_word: ὅμοιος αὐτῷ ἐστιν
  choice: यह उसके जैसा है
  rationale: पहचान के बजाय समानता का अर्थ सुरक्षित रखता है।
- source_word: ἐκεῖνος ἔλεγεν
  choice: पर वह कहता रहा
  rationale: ἐκεῖνος उस चर्चा में आए व्यक्ति की ओर संकेत करता है और अपूर्ण भूतकाल उसके लगातार आग्रह को दर्शाता है।
- source_word: Ἐγώ εἰμι
  choice: मैं वही हूँ
  rationale: इस प्रसंग में यह सामान्य आत्म-पहचान है; ‘वही’ उस व्यक्ति की ओर संकेत करता है जिसके विषय में लोग बात कर रहे हैं, जबकि अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: यूहन्ना के प्रसंग में Ἐγώ εἰμι का अनुवाद
  choice: मैं वही हूँ
  alternative: मैं हूँ
  rationale: तात्कालिक कथा में चंगा हुआ व्यक्ति अपनी पहचान की पुष्टि कर रहा है, कोई मसीही दावा नहीं कर रहा। फिर भी यूनानी की अधिक शाब्दिक अभिव्यक्ति पादटिप्पणी में दी गई है, ताकि मूल रूप छिपे नहीं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। भीड़ की चलती बहस और उस व्यक्ति के बार-बार अपनी पहचान बताने का पक्ष अपूर्ण भूतकाल के अनुरूप रखा गया है।
