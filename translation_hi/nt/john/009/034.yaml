source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: hi
  text: उन्होंने उसे उत्तर दिया, “तू तो पूरी तरह पापों में जन्मा है[a], और तू हमें सिखाता है?” फिर उन्होंने उसे बाहर निकाल दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “पापों में”; यह आरोप उसके अपने पापों, उसके माता-पिता के पापों, या उसकी जन्मजात दशा के साथ पाप के संबंध को स्पष्ट नहीं करता।
    reason: lexical_and_theological_ambiguity
  - marker: b
    text: इसका अर्थ उसे उनकी उपस्थिति से निकाल देना हो सकता है; प्रसंग में आराधनालय-समुदाय से बहिष्कार का संकेत भी हो सकता है।
    reason: contextual_ambiguity
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: उन्होंने उत्तर में उससे कहा
  rationale: यूनानी के उत्तर देने और कहने—दोनों भावों को स्वाभाविक आधुनिक हिन्दी में रखा गया है, बिना असहज दोहराव के।
- source_word: Ἐν ἁμαρτίαις
  choice: पापों में
  rationale: यूनानी में बहुवचन ‘पापों’ को बनाए रखा गया है, ताकि आरोप लगाने वालों की कठोर भाषा नरम न पड़े।
- source_word: ἐγεννήθης ὅλος
  choice: तू तो पूरा का पूरा ... जन्मा है
  rationale: ‘पूरा का पूरा’ ὅλος की तीव्रता और व्यक्ति के प्रति किए गए समग्र अपमान को सहज हिन्दी में व्यक्त करता है; ‘तो’ तिरस्कारपूर्ण बल को उभारता है।
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: और तू हमें सिखाता है?
  rationale: स्पष्ट σὺ और प्रश्नवाचक संरचना का तिरस्कार तथा आक्रोश बनाए रखने के लिए ‘तू’ का प्रयोग किया गया है।
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: उन्होंने उसे बाहर निकाल दिया
  rationale: यह यूनानी मुहावरे की hostile expulsion को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है, पर निष्कासन की ठीक संस्थागत सीमा तय नहीं करता।
theological_decisions:
- issue: जन्म से अंधे व्यक्ति पर ‘पापों में जन्मा’ होने के आरोप का आशय
  choice: वक्ताओं के आरोप को ‘पूरा का पूरा पापों में जन्मा’ के रूप में रखा गया है
  alternative: ‘तू जन्म से ही पूरा पापी है’ अथवा ‘तू अपने माता-पिता के पापों के कारण ऐसा जन्मा है’
  rationale: मूल पाठ यह नहीं बताता कि आरोप उसके अपने पाप, वंशागत दोष, माता-पिता के पाप या उसकी जन्मजात दशा से किस प्रकार जुड़ा है। अनुवाद इस धर्मवैज्ञानिक तनाव को सुलझाए बिना आरोप की कठोरता बनाए रखता है।
- issue: ‘बाहर निकाल दिया’ की सीमा
  choice: सामान्य निष्कासन की भाषा रखी गई है
  alternative: ‘उसे आराधनालय से बहिष्कृत कर दिया’
  rationale: संदर्भ आराधनालय-समुदाय से बहिष्कार का संकेत दे सकता है, लेकिन इस वाक्यांश में स्थान या औपचारिक प्रक्रिया स्पष्ट नहीं है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी अपनाई गई है। संवाद में ‘तू’ वक्ताओं के तिरस्कार और यूनानी के बलयुक्त σὺ को दिखाता है; यह अनुवादक की ओर से अनादर नहीं, बल्कि पात्रों की शत्रुतापूर्ण वाणी का चित्रण है।
