base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: hi
  text: यीशु ने उनसे कहा, “यदि तुम अंधे होते, तो तुममें पाप न होता; पर अब तुम कहते हो, ‘हम देखते हैं,’ इसलिए तुम्हारा पाप बना रहता है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम पर दोष न होता।” यूनानी में शाब्दिक रूप से “पाप” है, जिसमें यहाँ दोषी होने का भाव भी शामिल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: अंधे
  rationale: मूल शब्द का सीधा अर्थ ‘अंधे’ है। प्रसंग में इसका आत्मिक रूपक भी है, पर मुख्य पाठ में सरल शब्द रखने से यूहन्ना 9 में शारीरिक और आत्मिक दृष्टि के बीच का संबंध बना रहता है।
- source_word: οὐκ ἂν εἴχετε ἁμαρτίαν
  choice: तो तुममें पाप न होता
  rationale: ἄν सहित अपूर्णकाल यहाँ अवास्तविक शर्त का परिणाम व्यक्त करता है। ‘तुममें पाप न होता’ हिन्दी में स्वाभाविक है और ‘पाप’ को सीधे बनाए रखता है।
- source_word: νῦν δὲ
  choice: पर अब
  rationale: यह काल्पनिक स्थिति और वर्तमान वास्तविकता के बीच स्पष्ट विरोध दिखाता है।
- source_word: λέγετε ὅτι Βλέπομεν
  choice: तुम कहते हो, ‘हम देखते हैं,’
  rationale: द्वितीय पुरुष बहुवचन से उद्धृत प्रथम पुरुष बहुवचन में हुए परिवर्तन को सुरक्षित रखा गया है; इससे कथन की व्यंग्यात्मक धार बनी रहती है।
- source_word: ἡ ἁμαρτία ὑμῶν μένει
  choice: तुम्हारा पाप बना रहता है
  rationale: μένει निरंतर अवस्था दर्शाता है और यूहन्ना के लेखन में महत्त्वपूर्ण क्रिया है। ‘बना रहता है’ आधुनिक हिन्दी में स्वाभाविक ढंग से इस निरंतरता को व्यक्त करता है।
theological_decisions:
- issue: ‘अंधे’ को आत्मिक अंधापन और ‘पाप’ को दोष के रूप में स्पष्ट किया जाए या नहीं
  choice: मुख्य पाठ में ‘अंधे’ और ‘पाप’ जैसे सीधे शब्द रखे गए हैं।
  alternative: “यदि तुम आत्मिक रूप से अंधे होते, तो तुम दोषी न होते।”
  rationale: प्रसंग आत्मिक दृष्टि से संबंधित है, फिर भी यीशु के शब्द पूरे अध्याय में विकसित शारीरिक अंधेपन के रूपक पर आधारित हैं। व्याख्यात्मक विस्तार रूपक और ἁμαρτία की अर्थगत व्यापकता को समय से पहले सीमित कर देगा।
- issue: ‘तो’ द्वारा अंतिम परिणाम-संबंध को स्पष्ट करना
  choice: अंतिम खंड में ‘इसलिए’ रखा गया है।
  alternative: 'संयोजक जोड़े बिना: “तुम्हारा पाप बना रहता है।”'
  rationale: यूनानी पाठ में अंतिम खंड से पहले स्पष्ट परिणामबोधक संयोजक नहीं है, लेकिन हिन्दी में ‘इसलिए’ कथन के निहित तार्किक संबंध को स्वाभाविक बनाता है। इसे नई धार्मिक व्याख्या नहीं, वाक्य-संबंध की अभिव्यक्ति माना गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आत्मिक रूप से’ जैसा व्याख्यात्मक जोड़ नहीं किया गया, ताकि अध्याय में दृष्टि और अंधेपन का जानबूझकर रखा गया दोहरा अर्थ सुरक्षित रहे।
