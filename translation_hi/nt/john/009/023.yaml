lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पद 22 में बताए गए कारण की ओर संकेत करता है और यूनानी वाक्यांश की कारणवाचक शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γονεῖς
  choice: माता-पिता
  rationale: बहुवचन संज्ञा उस व्यक्ति के माता और पिता को सामूहिक रूप से दर्शाती है; आधुनिक हिन्दी में यही सहज और सटीक अभिव्यक्ति है।
- source_word: εἶπαν
  choice: कहा
  rationale: यह सामान्य बोलने की क्रिया है; ‘उत्तर दिया’ जैसी अधिक विशिष्ट अर्थछाया जोड़ना आवश्यक नहीं है।
- source_word: Ἡλικίαν ἔχει
  choice: वह बालिग है
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘उसकी आयु है’ है, पर प्रसंग में आशय यह है कि वह स्वयं उत्तर देने योग्य आयु का है। ‘बालिग’ इस सामाजिक और संभावित कानूनी अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αὐτὸν
  choice: उसी से
  rationale: सर्वनाम उस पहले अंधे व्यक्ति पर बल देता है कि प्रश्न उसी से किया जाए; ‘उसी से’ हिन्दी में इस बल को स्पष्ट रखता है।
- source_word: ἐπερωτήσατε
  choice: पूछिए
  rationale: आज्ञार्थक क्रिया का आशय पूछताछ उसी व्यक्ति की ओर मोड़ना है। ‘पूछिए’ आधुनिक हिन्दी में स्वाभाविक है और सम्मानसूचक बहुवचन संबोधन के अनुकूल है।
