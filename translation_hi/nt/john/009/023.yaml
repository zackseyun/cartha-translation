  text: For this reason his parents said[a], “He is of age; ask him.”
translation:
  language: hi
  text: इसी कारण उसके माता-पिता ने कहा, “वह वयस्क है[a]; उसी से पूछिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह पर्याप्त उम्र का है; उसी से पूछिए।”
