  text: ⸀ἤκουσαν ἐκ τῶν Φαρισαίων ταῦτα οἱ ⸂μετ’ αὐτοῦ ὄντες⸃, καὶ εἶπον αὐτῷ· Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: hi
  text: उसके साथ रहने वाले फरीसियों में से कुछ ने ये बातें सुनीं और उससे कहा, “क्या हम भी अंधे तो नहीं हैं?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम भी अंधे नहीं हैं, हैं क्या?” यूनानी में μή से आरंभ प्रश्न ‘नहीं’ उत्तर की अपेक्षा करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: सुनीं
  rationale: यहाँ क्रिया यीशु की कही हुई बातों को सुनने का बोध देती है; ‘सुनीं’ स्वाभाविक कथात्मक रूप है।
- source_word: ἐκ τῶν Φαρισαίων
  choice: जो फरीसी उसके साथ थे, उनमें से कुछ
  rationale: 'ἐκ के अंशवाचक अर्थ को स्पष्ट रखता है: सभी फरीसी नहीं, बल्कि उनके बीच के कुछ लोग।'
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक रूप को बनाए रखते हुए यह पिछले कथनों की ओर स्वाभाविक ढंग से संकेत करता है।
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: जो फरीसी उसके साथ थे
  rationale: यह संबंधवाचक वाक्यांश उपस्थित फरीसियों की पहचान स्वाभाविक हिन्दी में कराता है।
- source_word: εἶπον αὐτῷ
  choice: उससे कहा
  rationale: λέγω का सीधा अर्थ ‘कहा’ रखा गया है; उद्धृत वाक्य का प्रश्नवाचक रूप स्वयं स्पष्ट है।
- source_word: Μὴ
  choice: क्या ... हैं?
  rationale: हिन्दी में संदर्भ और बलाघात सहित यह प्रश्न उस अपेक्षित नकारात्मक उत्तर को स्वाभाविक रूप से व्यक्त कर सकता है; संभावित सूक्ष्मता पादटिप्पणी में स्पष्ट की गई है।
- source_word: καὶ
  choice: भी
  rationale: यह फरीसियों को पहले उल्लिखित अंधों के साथ जोड़ता है; हिन्दी में ‘भी’ इसका सहज समतुल्य है।
- source_word: ἡμεῖς
  choice: हम
  rationale: स्पष्ट सर्वनाम ग्रीक के बल को बनाए रखता है।
- source_word: τυφλοί
  choice: अंधे
  rationale: मूल विशेषण को बिना ‘आत्मिक रूप से’ जैसी व्याख्यात्मक वृद्धि के रखा गया है, ताकि यूहन्ना का रूपक और विडंबना बनी रहे।
- source_word: ἐσμεν
  choice: हैं
  rationale: वर्तमानकालीन सहायक क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: क्या τυφλοί के रूपकात्मक अर्थ को मुख्य पाठ में स्पष्ट किया जाए
  choice: केवल ‘अंधे’ रखा गया
  alternative: ‘आत्मिक रूप से अंधे’
  rationale: संदर्भ रूपकात्मक अर्थ स्पष्ट करता है, पर ग्रीक में कोई विशेषक नहीं है। केवल ‘अंधे’ रखने से यूहन्ना की विडंबना सुरक्षित रहती है और व्याख्यात्मक शब्द पाठ में नहीं जोड़े जाते।
- issue: μή वाले प्रश्न की नकारात्मक उत्तर-अपेक्षा
  choice: मुख्य पाठ में स्वाभाविक हिन्दी प्रश्न और पादटिप्पणी में अपेक्षा की स्पष्टता
  alternative: ‘निश्चय ही हम भी अंधे नहीं हैं, है न?’
  rationale: ग्रीक प्रश्न ‘नहीं’ उत्तर की अपेक्षा करता है। अत्यधिक विस्तृत टैग-प्रश्न हिन्दी में बोझिल हो सकता है, इसलिए मुख्य पाठ संक्षिप्त रखा गया और सूक्ष्म अर्थ पादटिप्पणी में बताया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण कथात्मक शैली। ‘अंधे’ का अनिर्दिष्ट रूप जानबूझकर रखा गया है और अंशवाचक वाक्य-विन्यास को स्पष्ट हिन्दी क्रम में प्रस्तुत किया गया है।
