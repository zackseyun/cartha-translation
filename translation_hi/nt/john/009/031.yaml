id: JHN.9.31
reference: John 9:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: hi
  text: हम जानते हैं कि परमेश्वर पापियों की नहीं सुनता; पर यदि कोई परमेश्वर का भय मानने वाला हो[a] और उसकी इच्छा पूरी करता हो, तो परमेश्वर उसकी सुनता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर का उपासक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: हम जानते हैं
  rationale: οἶδα का पूर्णकालीन रूप यहाँ वर्तमान अर्थ रखता है; यह स्वाभाविक और सटीक हिन्दी है।
- source_word: ἁμαρτωλῶν
  choice: पापियों की
  rationale: सम्बन्धकारक बहुवचन ἀκούει के साथ उन लोगों के वर्ग को दर्शाता है; ‘पापियों की सुनना’ आधुनिक हिन्दी में अनुकूल प्रतिक्रिया देने का अर्थ व्यक्त करता है।
- source_word: ἀκούει
  choice: की सुनता / उसकी सुनता है
  rationale: यहाँ अर्थ केवल ध्वनि सुनना नहीं, बल्कि किसी की विनती पर अनुकूल ध्यान देना है। ‘किसी की सुनना’ इस भाव को उत्तर दिए जाने तक सीमित किए बिना स्वाभाविक हिन्दी में रखता है।
- source_word: θεοσεβὴς
  choice: परमेश्वर का भय माननेवाला
  rationale: यह शब्द परमेश्वर के प्रति श्रद्धा और भक्ति रखनेवाले व्यक्ति को दर्शाता है। यह अनुवाद परमेश्वर का स्पष्ट उल्लेख तथा विशेषण का व्यापक श्रद्धाभाव बनाए रखता है।
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: उसकी इच्छा पूरी करता हो
  rationale: ποιεῖν τὸ θέλημα का अर्थ उसकी इच्छा के अनुसार करना है; ‘इच्छा पूरी करना’ हिन्दी में स्वाभाविक है और आज्ञापालन का भाव बनाए रखता है।
- source_word: τούτου ἀκούει
  choice: परमेश्वर उसकी सुनता है
  rationale: τούτου पहले बताए व्यक्ति की ओर बलपूर्वक संकेत करता है। कर्ता ‘परमेश्वर’ को दोहराने से हिन्दी में सर्वनाम-संदेह दूर होता है और यूनानी अर्थ नहीं बदलता।
- source_word: ἀλλ’ ἐάν τις
  choice: पर यदि कोई
  rationale: यह विरोधी शर्त प्रस्तुत करता है और अनिश्चित एकवचन को बनाए रखता है।
theological_decisions:
- issue: ‘परमेश्वर पापियों की नहीं सुनता’ कथन का दायरा
  choice: वक्ता के कथन को उसी स्पष्ट बल के साथ रखा गया है, बिना उसे नरम करने या एक सार्वभौमिक सैद्धान्तिक सूत्र में विस्तृत करने के।
  alternative: ‘परमेश्वर पापियों की प्रार्थना नहीं सुनता’ अथवा ‘परमेश्वर पापियों को स्वीकार नहीं करता।’
  rationale: यूनानी पाठ केवल यह कहता है कि परमेश्वर पापियों की ‘नहीं सुनता’ और इसकी तुलना परमेश्वर का भय मानकर उसकी इच्छा करनेवाले की सुनने से करता है। अनुवाद को प्रसंग के वक्ता का दावा बनाए रखना चाहिए, न कि हर सम्भव धार्मिक परिस्थिति का समाधान करना चाहिए।
- issue: θεοσεβής का अनुवाद
  choice: परमेश्वर का भय माननेवाला
  alternative: परमेश्वर का उपासक
  rationale: मुख्य अनुवाद श्रद्धा और भक्ति के व्यापक विशेषणात्मक अर्थ को रखता है; वैकल्पिक अर्थ सम्भव होने के कारण पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘परमेश्वर का भय माननेवाला’ धार्मिक श्रद्धा का परिचित पद है; ‘परमेश्वर उसकी सुनता है’ में कर्ता दोहराकर अस्पष्टता टाली गई है।
