  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: hi
  text: 'तब उस मनुष्य ने उत्तर दिया, “वह पापी है या नहीं, मैं नहीं जानता। मैं एक बात जानता हूँ: मैं अंधा था, पर अब देखता हूँ।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη οὖν ἐκεῖνος
  choice: तब उस मनुष्य ने उत्तर दिया
  rationale: ‘उत्तर दिया’ सामान्य कथात्मक प्रत्युत्तर को व्यक्त करता है; ‘तब’ प्रसंग की निरंतरता दिखाता है और ‘उस मनुष्य’ स्पष्ट संकेतवाचक ἐκεῖνος को बनाए रखता है।
- source_word: Εἰ ἁμαρτωλός ἐστιν
  choice: वह पापी है या नहीं
  rationale: जानने की क्रिया के साथ εἰ यहाँ परोक्ष प्रश्न प्रस्तुत करता है; ‘या नहीं’ आधुनिक हिन्दी में स्वाभाविक रूप से ‘whether’ का भाव व्यक्त करता है, बिना शर्त का अर्थ थोपे।
- source_word: οὐκ οἶδα
  choice: मैं नहीं जानता
  rationale: पूर्णकालिक रूप οἶδα का वर्तमान-अर्थ हिन्दी में सीधे और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: ἓν οἶδα
  choice: मैं एक बात जानता हूँ
  rationale: पहले के ‘मैं नहीं जानता’ के विपरीत निश्चित ज्ञान पर बल देते हुए यूनानी शब्दक्रम का भाव सुरक्षित रखता है।
- source_word: τυφλὸς ὢν
  choice: मैं अंधा था
  rationale: सहभागी पदबंध उसकी पूर्व अवस्था बताता है; हिन्दी में भूतकाल इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἄρτι βλέπω
  choice: अब देखता हूँ
  rationale: ‘अब’ पूर्व अंधेपन और वर्तमान दृष्टि के बीच तीखा विरोध बनाए रखता है; ‘देखता हूँ’ βλέπω का सीधा रूप है।
theological_decisions:
- issue: चंगे हुए मनुष्य के कथन में यीशु के विषय में उसकी सीमित जानकारी को बनाए रखना
  choice: वह पापी है या नहीं, मैं नहीं जानता।
  alternative: यदि वह पापी है, तो मैं नहीं जानता।
  rationale: यह कथन वक्ता की ज्ञान-सीमा बताता है, यीशु के पापी होने पर वर्णनकर्ता का निर्णय नहीं। ‘है या नहीं’ परोक्ष प्रश्न और जानबूझकर छोड़े गए धर्मवैचारिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक संवाद के अनुकूल। इस पद के हिन्दी पाठ में कोई पादटिप्पणी आवश्यक नहीं, क्योंकि εἰ की प्रासंगिक अस्पष्टता ‘है या नहीं’ में स्वाभाविक रूप से व्यक्त हो जाती है।
