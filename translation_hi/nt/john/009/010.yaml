  text: ἔλεγον οὖν αὐτῷ· ⸀Πῶς ἠνεῴχθησάν σου οἱ ὀφθαλμοί;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/010.yaml
  text: So they said to him[a], “How were your eyes opened?”
translation:
  language: hi
  text: इसलिए वे उससे पूछने लगे, “तुम्हारी आँखें कैसे खोली गईं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: पूछने लगे
  rationale: अपूर्ण भूतकाल निरंतर या आरंभ होकर चलने वाली वाणी का संकेत दे सकता है। प्रश्न के प्रसंग में ‘पूछने लगे’ आधुनिक हिन्दी में स्वाभाविक है और साधारण ‘कहा’ की अपेक्षा पक्षगत भाव को बेहतर व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निष्कर्ष या परिणामी संबंध जोड़ता है; ‘इसलिए’ उसके तार्किक बल को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: αὐτῷ
  choice: उससे
  rationale: λέγω के साथ सम्प्रदान को हिन्दी में स्वाभाविक रूप से ‘उससे’ व्यक्त किया गया है।
- source_word: Πῶς
  choice: कैसे
  rationale: यह रीति या ढंग पूछने वाला प्रश्नवाचक क्रियाविशेषण है।
- source_word: ἠνεῴχθησάν
  choice: खोली गईं
  rationale: एओरिस्ट कर्मवाच्य को भूतकालीन कर्मवाच्य रूप में सुरक्षित रखा गया है; स्त्रीलिंग बहुवचन ‘आँखें’ के अनुसार ‘गईं’ है।
- source_word: σου οἱ ὀφθαλμοί
  choice: तुम्हारी आँखें
  rationale: सम्बन्धकारक सर्वनाम और संज्ञा का स्वाभाविक हिन्दी स्वामित्वसूचक रूप; मूल का बहुवचन सुरक्षित है।
theological_decisions:
- issue: आँखें खोलने वाले कर्ता की अनुक्तता
  choice: कर्मवाच्य ‘खोली गईं’ रखा गया
  alternative: ‘खुल गईं’ या ‘किसने तुम्हारी आँखें खोलीं’
  rationale: यूनानी पाठ कर्ता को व्यक्त नहीं करता। कर्मवाच्य रूप संभावित कर्ता की पहचान या दैवी कर्म का अर्थ स्वयं से नहीं जोड़ता और मूल की अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। प्रश्न में मूल यूनानी का कर्मवाच्य जानबूझकर सुरक्षित रखा गया है; अलग पादटिप्पणी आवश्यक नहीं मानी गई।
