  text: They brought the man who had formerly been blind to the Pharisees[a].
translation:
  language: hi
  text: वे उस आदमी को, जो पहले अंधा था, फरीसियों के पास ले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγουσιν
  choice: ले गए
  rationale: यूनानी में यह ऐतिहासिक वर्तमान है; स्वाभाविक हिन्दी कथा-शैली में साधारण भूतकाल उपयुक्त है।
- source_word: αὐτὸν
  choice: उस आदमी को
  rationale: सर्वनाम का संदर्भ स्पष्ट करने और अगले विशेषणात्मक पदबंध को सहज हिन्दी में जोड़ने के लिए निहित व्यक्ति को स्पष्ट किया गया है।
- source_word: πρὸς τοὺς Φαρισαίους
  choice: फरीसियों के पास
  rationale: πρός के साथ कर्मकारक यहाँ व्यक्तियों की ओर ले जाने को व्यक्त करता है; 'के पास' आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: Φαρισαίους
  choice: फरीसियों
  rationale: इस यहूदी धार्मिक समूह के नाम का हिन्दी में प्रचलित रूप।
- source_word: τόν ποτε τυφλόν
  choice: जो पहले अंधा था
  rationale: मूल पदबंध संज्ञा के रूप में प्रयुक्त है—'वह जो पहले अंधा था'; हिन्दी में संबंधवाचक उपवाक्य पूर्व अवस्था और वर्तमान परिवर्तन के अंतर को स्वाभाविक रूप से बनाए रखता है।
- source_word: ποτε
  choice: पहले
  rationale: यहाँ इसका अर्थ 'पूर्व में' है और यह उस व्यक्ति की बीती हुई अवस्था को स्पष्ट करता है।
- source_word: τυφλόν
  choice: अंधा
  rationale: पूर्व शारीरिक अवस्था का सीधा और सामान्य हिन्दी अनुवाद।
