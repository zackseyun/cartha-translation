id: JHN.9.29
reference: John 9:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: hi
  text: हम जानते हैं कि परमेश्वर ने मूसा से बात की है, पर जहाँ तक इस व्यक्ति की बात है, हम नहीं जानते कि वह कहाँ से है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμεῖς
  choice: हम
  rationale: स्पष्ट सर्वनाम वक्ताओं के दावे को उभारता है; हिन्दी में आरंभिक ‘हम’ और आगे का विरोध पर्याप्त बल देते हैं।
- source_word: οἴδαμεν
  choice: जानते हैं
  rationale: यहाँ निश्चित ज्ञान का दावा है; दोनों occurrences में ‘जानना’ स्वाभाविक और संगत है।
- source_word: Μωϋσεῖ λελάληκεν ὁ θεός
  choice: परमेश्वर ने मूसा से बात की है
  rationale: सम्पूर्ण पक्ष को ‘की है’ से बनाए रखा गया है, जिससे बीते हुए कथन की वर्तमान मान्यता झलकती है। ‘बात की’ λαλέω का सहज आधुनिक हिन्दी रूप है।
- source_word: τοῦτον δὲ
  choice: पर जहाँ तक इस व्यक्ति की बात है
  rationale: यह रूप विरोध और विषय-परिवर्तन दोनों को व्यक्त करता है तथा संकेतवाचक की दूरी बनाए रखता है।
- source_word: πόθεν ἐστίν
  choice: वह कहाँ से है
  rationale: यह स्वाभाविक हिन्दी है और भौगोलिक मूल तथा गहरे उद्गम/अधिकार—दोनों संभावित अर्थों को खुला रखती है।
theological_decisions:
- issue: πόθεν ἐστίν में यीशु के उद्गम का अर्थ
  choice: ‘वह कहाँ से है’ के रूप में व्यापक और अनिर्णीत अनुवाद
  alternative: ‘वह कहाँ से आया है’ या ‘उसका मूल क्या है’
  rationale: यूहन्ना में यीशु के उद्गम के प्रश्न का सामान्य और गहरा धर्मवैज्ञानिक अर्थ दोनों हो सकते हैं। अनुवाद वक्ताओं की बात को प्रस्तुत करता है, पर इस तनाव को स्वयं हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है। ‘इस व्यक्ति’ में दूरी का भाव है, पर अनावश्यक रूप से अपमानजनक शब्द नहीं जोड़ा गया।
