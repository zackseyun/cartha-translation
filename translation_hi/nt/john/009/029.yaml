  source_fidelity: 'The Hindi accurately represents all major elements of the Greek: the emphatic collective claim (''हम जानते हैं''), God’s established speaking to Moses (''परमेश्वर ने मूसा से बात की है''), the contrastive and distancing demonstrative (''पर ... इस व्यक्ति की बात है''), and the repeated claim of ignorance concerning Jesus’ origin. ''वह कहाँ से है'' preserves πόθεν ἐστίν without narrowing it to merely geographic provenance.'
