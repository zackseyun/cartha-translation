  text: ταῦτα εἰπὼν ἔπτυσεν χαμαὶ καὶ ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος, καὶ ⸀ἐπέχρισεν ⸀αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ⸀ὀφθαλμούς,
base_translation:
  language: en
  yaml_path: translation/nt/john/009/006.yaml
  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: hi
  text: ये बातें कहकर उसने भूमि पर थूका और थूक से मिट्टी का लेप बनाया। फिर उसने वह लेप उस मनुष्य की आँखों पर लगाया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उसकी आँखों पर वह लेप पोता।” यूनानी क्रिया का अर्थ “अभिषेक करना” या किसी पदार्थ को “पोतना/लगाना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: ये बातें कहकर
  rationale: एओरिस्ट कृदंत मुख्य क्रियाओं से पहले हुई क्रिया बताता है। ‘ये बातें कहकर’ स्वाभाविक हिन्दी में वही कालक्रम बनाए रखता है।
- source_word: ἔπτυσεν χαμαί
  choice: उसने भूमि पर थूका
  rationale: χαμαί का ठोस स्थानगत अर्थ ‘भूमि पर’ है; अनुवाद क्रिया को स्पष्ट और सहज रखता है।
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: थूक से मिट्टी का लेप बनाया
  rationale: πηλός गीली मिट्टी, कीचड़ या मिट्टी के लेप को सूचित कर सकता है। प्रसंग में बनाई गई और आँखों पर लगाई गई वस्तु के लिए ‘मिट्टी का लेप’ स्पष्ट है और ἐκ की साधन-स्रोत संबंधी शक्ति ‘थूक से’ में बनी रहती है।
- source_word: ἐπέχρισεν
  choice: लगाया
  rationale: ἐπιχρίω का अर्थ किसी पदार्थ को पोतना, लगाना या अभिषेक करना हो सकता है। मिट्टी के भौतिक प्रयोग के प्रसंग में ‘लगाया’ सहज है और अनावश्यक अनुष्ठानिक अर्थ नहीं जोड़ता।
- source_word: αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ὀφθαλμούς
  choice: वह लेप उस मनुष्य की आँखों पर
  rationale: αὐτοῦ प्रसंग के जन्मांध मनुष्य की ओर संकेत करता है। हिन्दी में अस्पष्ट सर्वनाम से बचने के लिए ‘उस मनुष्य की’ कहा गया है; ‘वह लेप’ पहले बनाए गए लेप की ओर निश्चित संकेत को बनाए रखता है।
theological_decisions:
- issue: ἐπέχρισεν में संभावित अभिषेक-संबंधी अर्थछाया
  choice: मुख्य पाठ में सामान्य भौतिक क्रिया ‘लगाया’
  alternative: ‘उसकी आँखों पर उस लेप का अभिषेक किया’ अथवा ‘लेप पोता’
  rationale: क्रिया में ‘अभिषेक करना’ और ‘पोतना/लगाना’ दोनों अर्थ संभव हैं, पर इस प्रसंग में वस्तु मिट्टी का लेप है। मुख्य पाठ अनुष्ठानिक या मसीही प्रतीकवाद को स्वतः आरोपित नहीं करता; शब्दगत विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भूमि’ औपचारिक किंतु प्रचलित है; ‘मिट्टी का लेप’ पदार्थ और उसके प्रयोग दोनों को ‘कीचड़’ की अपेक्षा अधिक स्पष्ट करता है।
