source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ἐκεῖνος· ⸂Ὁ ἄνθρωπος ὁ⸃ λεγόμενος Ἰησοῦς πηλὸν ἐποίησεν καὶ ἐπέχρισέν μου τοὺς ὀφθαλμοὺς καὶ εἶπέν μοι ⸀ὅτι Ὕπαγε εἰς ⸀τὸν Σιλωὰμ καὶ νίψαι· ἀπελθὼν ⸀οὖν καὶ νιψάμενος ἀνέβλεψα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: hi
  text: उसने उत्तर दिया, “यीशु कहलाने वाले उस मनुष्य ने मिट्टी का लेप बनाया[a] और उसे मेरी आँखों पर लगाया[b]। फिर उसने मुझसे कहा, ‘शीलोह में जाकर धो।’ इसलिए मैं गया और धोया, और मैं देखने लगा[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कीचड़ बनाया।” यूनानी शब्द मिट्टी, गीली मिट्टी या कीचड़ के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरी आँखों पर पोता।” इस क्रिया का अर्थ किसी पदार्थ को लगाना या पोतना है; कुछ अनुवाद इसे “अभिषेक किया” कहते हैं।
    reason: lexical_alternative
  - marker: c
    text: या “मैंने दृष्टि पाई।” यहाँ इस क्रिया का अर्थ अंधे व्यक्ति का देखने लगना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: उसने उत्तर दिया
  rationale: यह यूनानी कथात्मक सूत्र का स्वाभाविक हिन्दी रूप है; ἐκεῖνος को प्रसंगानुसार सर्वनाम ‘उसने’ से व्यक्त किया गया है।
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: यीशु कहलाने वाले उस मनुष्य
  rationale: यह वक्ता द्वारा यीशु की सीमित, गैर-स्वीकारोक्तिपरक पहचान को सुरक्षित रखता है और उन्हें अभी केवल ‘मनुष्य’ के रूप में प्रस्तुत करता है।
- source_word: πηλὸν ἐποίησεν
  choice: मिट्टी का लेप बनाया
  rationale: πηλός मिट्टी, कीचड़ अथवा गीली मिट्टी को सूचित कर सकता है; निकट प्रसंग में थूक से बनाई गई लगाने योग्य वस्तु के लिए ‘मिट्टी का लेप’ स्पष्ट और स्वाभाविक है।
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: उसे मेरी आँखों पर लगाया
  rationale: ἐπιχρίω का भौतिक अर्थ किसी पदार्थ को पोतना या लगाना है; ‘लगाया’ अनावश्यक धार्मिक अभिषेक-संबंधी अर्थ से बचता है।
- source_word: εἶπέν μοι ὅτι
  choice: उसने मुझसे कहा
  rationale: प्रत्यक्ष आदेश का स्वाभाविक हिन्दी परिचय।
- source_word: Ὕπαγε εἰς τὸν Σιλωὰμ καὶ νίψαι
  choice: शीलोह में जाकर धो
  rationale: आदेश की गति और क्रम को मुहावरेदार हिन्दी में व्यक्त करता है; मूल पाठ यहाँ ‘कुण्ड’ शब्द नहीं दोहराता।
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
  choice: इसलिए मैं गया और धोया
  rationale: οὖν परिणामसूचक है; दोनों क्रियाओं का सरल क्रम मूल कथन को स्पष्ट रूप से रखता है।
- source_word: ἀνέβλεψα
  choice: मुझे दिखाई देने लगा
  rationale: चंगाई के प्रसंग में ἀναβλέπω का अर्थ दृष्टि पाना अथवा फिर से देखने लगना है; जन्म से अंधे व्यक्ति के लिए ‘दृष्टि वापस पाई’ अनुचित हो सकती है।
theological_decisions:
- issue: वक्ता द्वारा यीशु का परिचय
  choice: यीशु कहलाने वाले उस मनुष्य
  alternative: यीशु नाम के मनुष्य
  rationale: ‘उस मनुष्य’ मूल के निश्चित पदबंध को और कथा में उस समय वक्ता की सीमित समझ को बनाए रखता है; बाद की मसीही स्वीकारोक्ति को यहाँ पहले से नहीं जोड़ा गया।
- issue: ἀνέβλεψα में दृष्टि की प्राप्ति
  choice: मुझे दिखाई देने लगा
  alternative: मैंने अपनी दृष्टि फिर पा ली
  rationale: यूहन्ना 9 के अनुसार वह व्यक्ति जन्म से अंधा था, इसलिए ‘फिर पा ली’ पूर्व दृष्टि का संकेत दे सकता है। चुना हुआ रूप चंगाई को स्पष्ट करता है, पर ऐसा संकेत नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘शीलोह’ पारंपरिक हिन्दी बाइबलीय नाम-रूप रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उसी क्रम में उपस्थित हैं।
