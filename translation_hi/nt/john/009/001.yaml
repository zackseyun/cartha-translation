reference: John 9:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ παράγων εἶδεν ἄνθρωπον τυφλὸν ἐκ γενετῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/001.yaml
  text: And as he was passing by[a], he saw a man blind from birth.
translation:
  language: hi
  text: और जाते हुए उसने एक मनुष्य को देखा, जो जन्म से अंधा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: सरल संयोजक कथानक को पिछले प्रसंग से जोड़ता है और यूनानी के सामान्य प्रवाह को बनाए रखता है।
- source_word: παράγων
  choice: जाते हुए
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ-साथ चल रही पृष्ठभूमि की क्रिया बताता है; हिंदी में ‘जाते हुए’ स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: εἶδεν
  choice: उसने ... देखा
  rationale: ὁράω के अओरिस्ट रूप का सीधा अर्थ ‘देखा’ है; ‘ध्यान दिया’ अनावश्यक व्याख्यात्मक भाव जोड़ता।
- source_word: ἄνθρωπον
  choice: एक ... मनुष्य
  rationale: यहाँ शब्द एक विशिष्ट पुरुष व्यक्ति को सूचित करता है। ‘मनुष्य’ मूल संज्ञा के निकट रहते हुए आधुनिक हिंदी में गरिमापूर्ण है; अगले पदों से उसका पुरुष होना स्पष्ट होता है।
- source_word: τυφλὸν
  choice: अंधा था
  rationale: विशेषण को हिंदी की स्वाभाविक संबंधवाचक संरचना में व्यक्त किया गया है, जिससे जन्म से चली आ रही अवस्था स्पष्ट होती है।
- source_word: ἐκ γενετῆς
  choice: जन्म से
  rationale: यह संक्षिप्त और प्रचलित हिंदी अभिव्यक्ति जन्म के समय से विद्यमान अंधेपन को ठीक व्यक्त करती है।
theological_decisions:
- issue: ἄνθρωπον का लिंग-संबंधी अनुवाद
  choice: मनुष्य
  alternative: आदमी
  rationale: यूनानी शब्द अपने आप में ‘मनुष्य/व्यक्ति’ कह सकता है, यद्यपि प्रसंग में व्यक्ति पुरुष है। ‘मनुष्य’ स्रोत की शब्दावली के निकट है और हिंदी में स्वाभाविक है; पाठ के आगे पुरुष-संदर्भ स्पष्ट हो जाता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण कथात्मक शैली। ‘जाते हुए’ कृदंत की समकालिक पृष्ठभूमि बनाए रखता है। किसी पादटिप्पणी की आवश्यकता नहीं, क्योंकि उपलब्ध अंग्रेज़ी पादटिप्पणी का विकल्प हिंदी मुख्य पाठ से सार्थक रूप से भिन्न नहीं है।
