  verdict: revise
  source_fidelity: The draft correctly represents the connective, the contemporaneous participle ('जाते हुए'), Jesus' seeing, and congenital blindness. However, 'एक ऐसे मनुष्य' adds the demonstrative nuance 'such a man,' which is not present in ἄνθρωπον.
  naturalness: The sentence is otherwise clear and suitably formal. Removing 'ऐसे' makes the noun phrase natural and avoids unintended emphasis.
  terminology: '''मनुष्य'' is an acceptable formal-modern rendering of ἄνθρωπον in this narrative and retains the masculine reference in conjunction with ''अंधा.'' ''अंधा'' and ''जन्म से'' are standard, clear terms.'
  issues:
