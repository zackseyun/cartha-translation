  text: οἱ οὖν γείτονες καὶ οἱ θεωροῦντες αὐτὸν τὸ πρότερον ὅτι ⸀προσαίτης ἦν ἔλεγον· Οὐχ οὗτός ἐστιν ὁ καθήμενος καὶ προσαιτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: hi
  text: तब उसके पड़ोसी और वे लोग, जिन्होंने उसे पहले भीख माँगते देखा था, कह रहे थे, “क्या यह वही नहीं है जो बैठकर भीख माँगा करता था?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग के परिणाम और कथा की अगली प्रतिक्रिया को जोड़ता है; ‘इसलिए’ इसके अनुमानात्मक-संयोजक बल को स्पष्ट रखता है।
- source_word: γείτονες
  choice: पड़ोसी
  rationale: यह उसके आस-पास रहने वाले लोगों के लिए सीधा, स्वाभाविक और सटीक आधुनिक हिन्दी शब्द है।
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: जिन्होंने उसे पहले ... देखा था
  rationale: वाक्यांश पूर्व समय में उसे देखने और पहचानने वाले लोगों को दर्शाता है; पूर्ण भूतकाल हिन्दी में इस पूर्वता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὅτι προσαίτης ἦν
  choice: भीख माँगते
  rationale: संदर्भ में यह उसकी पहले की पहचानी जाने वाली दशा या गतिविधि बताता है। हिन्दी में ‘उसे पहले भीख माँगते देखा था’ स्वाभाविक है और ὅτι को अनावश्यक रूप से कारणसूचक नहीं बनाता।
- source_word: ἔλεγον
  choice: कहने लगे
  rationale: अपूर्णकाल चलती या सामूहिक बातचीत का संकेत देता है; ‘कहने लगे’ कथा में आरम्भ हुई सामूहिक प्रतिक्रिया को सहज रूप से व्यक्त करता है।
- source_word: Οὐχ οὗτός ἐστιν
  choice: क्या यह वही नहीं है
  rationale: यह ऐसे प्रश्न का रूप रखता है जिसमें सकारात्मक उत्तर की अपेक्षा है और व्यक्ति की पहचान पर बल देता है।
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: जो बैठकर भीख माँगा करता था
  rationale: दोनों substantival participles उसकी पूर्व की नियमित गतिविधि से पहचान कराते हैं; ‘माँगा करता था’ आदतन अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘भिखारी’ जैसी स्थायी संज्ञा के बजाय ‘भीख माँगते’ गतिविधि को सामने रखता है, जबकि प्रश्न में ‘माँगा करता था’ यूनानी कृदंतों के प्रचलित/आदतन पहचानसूचक अर्थ को सुरक्षित रखता है।
