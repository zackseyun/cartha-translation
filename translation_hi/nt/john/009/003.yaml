id: JHN.9.3
reference: John 9:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: hi
  text: यीशु ने उत्तर दिया, “न तो इस मनुष्य ने पाप किया, न इसके माता-पिता ने; बल्कि इसलिए कि उसमें[a] परमेश्वर के काम प्रकट हों।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके द्वारा”; यूनानी में शाब्दिक रूप से “उसमें” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: संवाद के वर्णन में यह स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: Οὔτε ... οὔτε
  choice: न तो ... न
  rationale: दोनों प्रस्तावित कारणों के समान रूप से किए गए निषेध को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: οὗτος
  choice: इस मनुष्य
  rationale: संदर्भित जन्मांध व्यक्ति को स्पष्ट करता है और मूल के संकेतवाचक बल को बनाए रखता है।
- source_word: ἥμαρτεν
  choice: पाप किया
  rationale: साधारण भूतकालीन क्रिया का सीधा और सहज हिन्दी समतुल्य है।
- source_word: οἱ γονεῖς αὐτοῦ
  choice: इसके माता-पिता
  rationale: γονεῖς का संक्षिप्त, सटीक और प्रचलित हिन्दी रूप।
- source_word: ἀλλ’ ἵνα
  choice: बल्कि इसलिए कि
  rationale: मूल की उद्देश्यसूचक और कुछ हद तक अपूर्ण लगने वाली रचना को बिना ‘ऐसा हुआ’ जोड़कर सुरक्षित रखता है; इससे अनकहे कारण को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: φανερωθῇ
  choice: प्रकट हों
  rationale: निष्क्रिय भाव और ἵνα के साथ संभावित/उद्देश्यसूचक अर्थ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: परमेश्वर के काम
  rationale: यूहन्ना की शब्दावली और संबंधवाचक रचना को सरल, dignified हिन्दी में बनाए रखता है।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: ἐν का सबसे सीधा अर्थ सुरक्षित रहता है और ‘उसके द्वारा’ कहकर साधनवाचक अर्थ को निश्चित नहीं किया जाता।
theological_decisions:
- issue: क्या यीशु पाप और हर प्रकार के दुःख के बीच किसी भी संबंध का सार्वभौमिक निषेध करते हैं
  choice: निषेध को केवल इस मनुष्य और उसके माता-पिता के संबंध में व्यक्त किया गया है।
  alternative: ऐसा व्यापक भावार्थ देना कि कोई भी दुःख कभी व्यक्तिगत या माता-पिता के पाप से जुड़ा नहीं होता।
  rationale: पद शिष्यों द्वारा इस विशेष मामले के लिए दिए गए दो विकल्पों को नकारता है; इससे आगे कोई सार्वभौमिक सिद्धान्त जोड़ना उचित नहीं।
- issue: ἵνα उद्देश्य बताता है या केवल परिणाम
  choice: ‘इसलिए कि ... प्रकट हों’ द्वारा उद्देश्यसूचक बल रखा गया है।
  alternative: ‘जिसके परिणामस्वरूप ... प्रकट हुए’ अथवा ऐसी विराम-व्यवस्था जो उद्देश्य को टाल दे।
  rationale: ἵνα और विधिलिंग का सबसे सीधा पाठ उद्देश्यसूचक है। साथ ही ‘ऐसा हुआ’ न जोड़ने से परमेश्वर द्वारा अंधापन कराए जाने का अतिरिक्त कथन अनावश्यक रूप से स्पष्ट नहीं किया जाता।
- issue: ἐν αὐτῷ का स्थानवाचक या साधनवाचक अर्थ
  choice: मुख्य पाठ में ‘उसमें’।
  alternative: ‘उसके द्वारा’।
  rationale: मूल यूनानी को निकटता से रखकर यह अस्पष्टता बचाई गई है कि काम उस व्यक्ति में प्रकट होते हैं या उसके माध्यम से।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण है। ‘बल्कि इसलिए कि’ मूल यूनानी की संक्षिप्त और अर्थगत तनाव वाली रचना को बनाए रखता है; ‘यह/ऐसा हुआ’ जैसा अनकहा पद मुख्य पाठ में नहीं जोड़ा गया।
