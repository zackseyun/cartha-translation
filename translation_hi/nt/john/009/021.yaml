base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: hi
  text: पर अब वह कैसे देखता है, यह हम नहीं जानते; या यह कि किसने उसकी आँखें खोलीं, यह भी हम नहीं जानते। उसी से पूछिए; वह बालिग है। वह स्वयं अपने बारे में बताएगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपनी बात स्वयं कह सकता है।” यूनानी भविष्यत् क्रिया यहाँ व्यावहारिक रूप से उसकी स्वयं उत्तर देने की क्षमता या जिम्मेदारी भी जता सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: पर अब वह कैसे देखता है
  rationale: πῶς को ‘कैसे’, δέ को हल्के विरोधसूचक ‘पर’, νῦν को ‘अब’ और वर्तमान βλέπει को ‘देखता है’ के रूप में रखा गया है। इससे उसके अब देखने के तरीके के विषय में माता-पिता का दावा किया हुआ अज्ञान बना रहता है।
- source_word: οὐκ οἴδαμεν
  choice: हम नहीं जानते
  rationale: οἶδα के वर्तमान अर्थ ‘जानना’ का सीधा अनुवाद है। यूनानी में दोहराव को हिन्दी में भी अर्थपूर्ण रूप से बनाए रखा गया है।
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: और न यह जानते हैं कि किसने उसकी आँखें खोलीं
  rationale: ἤ वैकल्पिक प्रश्न प्रस्तुत करता है और ἤνοιξεν ... τοὺς ὀφθαλμούς कथा के ‘आँखें खोलने’ वाले मुहावरे को बनाए रखता है। स्वाभाविक हिन्दी में दूसरे οὐκ οἴδαμεν के साथ ‘और न’ उपयुक्त है।
- source_word: αὐτὸν ἐρωτήσατε
  choice: उसी से पूछिए
  rationale: बहुवचन आज्ञार्थक को आदरसूचक हिन्दी ‘पूछिए’ से व्यक्त किया गया है। ‘उसी’ αὐτόν पर व्यावहारिक बल को स्पष्ट करता है।
- source_word: ἡλικίαν ἔχει
  choice: वह बालिग है
  rationale: संदर्भ में यह शारीरिक कद नहीं, बल्कि स्वतंत्र रूप से उत्तर देने योग्य आयु को दर्शाता है। ‘बालिग’ आधुनिक और संक्षिप्त हिन्दी में कानूनी-सामाजिक वयस्कता व्यक्त करता है।
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: वह अपने बारे में स्वयं बताएगा
  rationale: αὐτός के बल को ‘स्वयं’, περὶ ἑαυτοῦ को ‘अपने बारे में’ और भविष्यत् λαλήσει को ‘बताएगा’ से व्यक्त किया गया है। पूछताछ के प्रसंग में ‘बताएगा’ स्वाभाविक है और भविष्यत् रूप को सुरक्षित रखता है।
theological_decisions:
- issue: ἡλικίαν ἔχει का संदर्भगत अर्थ
  choice: स्वतंत्र रूप से उत्तर देने योग्य वयस्क आयु
  alternative: सामान्य परिपक्वता अथवा शारीरिक कद
  rationale: आसपास का प्रसंग अधिकारियों की पूछताछ और माता-पिता द्वारा उत्तर पुत्र पर छोड़ने का है; इसलिए सामाजिक-कानूनी वयस्कता सबसे उपयुक्त अर्थ है।
- issue: αὐτὸς περὶ ἑαυτοῦ λαλήσει का बल
  choice: वह अपने विषय में स्वयं उत्तर देगा
  alternative: वह केवल अपने बारे में बातें करेगा; अथवा ‘वह अपने लिए बोल सकता है’
  rationale: पद में भविष्यत् क्रिया है और αὐτός बलाघाती है। मुख्य पाठ भविष्यत् कथन को बनाए रखता है, जबकि क्षमता या उत्तरदायित्व की व्यावहारिक छाया पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानपूर्ण पूछताछ के लिए ‘पूछिए’, कानूनी-सामाजिक वयस्कता के लिए प्रचलित ‘बालिग’, और सरल किंतु गरिमापूर्ण वाक्य-विन्यास अपनाया गया है।
