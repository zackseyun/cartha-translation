  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों प्रश्नों की पुनरावृत्तिपूर्ण जाँच का स्वर सुरक्षित है; ‘कहा’ मूल क्रिया के निकट है, यद्यपि वाक्य प्रश्नात्मक हैं।
