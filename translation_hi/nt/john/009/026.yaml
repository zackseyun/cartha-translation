base_translation:
  language: en
  yaml_path: translation/nt/john/009/026.yaml
  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: hi
  text: तब उन्होंने उससे कहा, “उसने तुम्हारे साथ क्या किया? उसने तुम्हारी आँखें कैसे खोल दीं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: उन्होंने ... कहा
  rationale: यह λέγω का भूतकालीन रूप है और समूह द्वारा बोले गए सीधे प्रश्नों का परिचय देता है; इसलिए सामान्य अर्थ ‘कहा’ रखा गया है, संदर्भ के आधार पर इसे अधिक विशिष्ट ‘पूछा’ नहीं बनाया गया।
- source_word: οὖν
  choice: तब
  rationale: यह कथानक और तर्क-क्रम को आगे बढ़ाता है। आधुनिक हिन्दी में ‘तब’ यहाँ स्वाभाविक है और केवल निष्कर्षसूचक ‘इसलिए’ की अपेक्षा प्रसंग के क्रम को बेहतर व्यक्त करता है।
- source_word: αὐτῷ
  choice: उससे
  rationale: द्वितीया-सदृश हिन्दी प्रयोग में बोलने के लक्ष्य, अर्थात चंगा हुए व्यक्ति, को स्वाभाविक रूप से ‘उससे’ कहा गया है।
- source_word: Τί ἐποίησέν σοι
  choice: उसने तुम्हारे साथ क्या किया
  rationale: ποιέω के साथ दत्तिव σοι का अर्थ यहाँ ‘तुम्हारे साथ/तुम पर क्या किया’ है। ‘तुम्हारे लिए’ लाभ का भाव अधिक स्पष्ट कर देता, जिसे प्रश्नकर्ता आवश्यक रूप से स्वीकार नहीं कर रहे।
- source_word: πῶς ἤνοιξέν σου τοὺς ὀφθαλμούς
  choice: उसने तुम्हारी आँखें कैसे खोल दीं
  rationale: πῶς रीति या साधन पूछता है। ‘आँखें खोल दीं’ पूर्ण हुई घटना को स्वाभाविक हिन्दी में व्यक्त करता है और शारीरिक दृष्टि लौटने के प्रसंग को बनाए रखता है।
theological_decisions: []
