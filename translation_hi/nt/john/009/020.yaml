translation:
  language: hi
  text: इसलिए उसके माता-पिता ने उत्तर में कहा, “हम जानते हैं कि यह हमारा बेटा है और यह जन्म से अंधा था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रश्न के उत्तर में कथा और तर्क की कड़ी को दिखाता है; ‘इसलिए’ स्वाभाविक ढंग से उस निष्कर्षात्मक संबंध को बनाए रखता है।
- source_word: γονεῖς
  choice: माता-पिता
  rationale: बहुवचन संज्ञा उस व्यक्ति के पिता और माता को सामूहिक रूप से दर्शाती है; आधुनिक हिन्दी में ‘माता-पिता’ सटीक और स्वाभाविक है।
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: उत्तर दिया
  rationale: यूनानी में दो क्रियाओं का युग्म है, पर हिन्दी में ‘उत्तर दिया और कहा’ अनावश्यक रूप से भारी लगता है; ‘उत्तर दिया’ दोनों का स्वाभाविक अर्थ संप्रेषित करता है।
- source_word: Οἴδαμεν
  choice: हम जानते हैं
  rationale: यह निश्चित ज्ञान या गवाही व्यक्त करता है; ‘हम जानते हैं’ सीधा और संदर्भानुकूल है।
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: यह हमारा बेटा है
  rationale: यह पहचान की स्पष्ट पुष्टि करता है और आधुनिक बोलचाल की गरिमापूर्ण हिन्दी में सहज है।
- source_word: τυφλὸς ἐγεννήθη
  choice: यह जन्म से अंधा है
  rationale: यूनानी का शाब्दिक रूप ‘अंधा जन्मा’ है, जिसका आशय जन्म से अंधा होना है; चुना हुआ रूप हिन्दी में अधिक स्वाभाविक है और वही अर्थ सुरक्षित रखता है।
