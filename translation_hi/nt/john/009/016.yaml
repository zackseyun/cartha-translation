id: JHN.9.16
reference: John 9:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: hi
  text: इसलिए फरीसियों में से कुछ कह रहे थे, “यह मनुष्य परमेश्वर की ओर से नहीं है, क्योंकि यह सब्त का पालन नहीं करता।” पर दूसरे कह रहे थे, “कोई पापी मनुष्य[a] ऐसे चिन्ह[b] कैसे दिखा सकता है?” और उनमें फूट पड़ गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई पापी।” यूनानी में विशेषण ‘पापी’ संज्ञा ‘मनुष्य’ को विशेषित करता है।
    reason: lexical_alternative
  - marker: b
    text: यूहन्ना प्रायः यीशु के कार्यों के लिए “चिन्ह” शब्द का प्रयोग करता है, जो उनके प्रकटकारी अर्थ पर भी ध्यान दिलाता है; इसे “चमत्कारी चिन्ह” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον ... τινές
  choice: कुछ कह रहे थे
  rationale: अपूर्ण काल दृश्य में चल रही या बार-बार व्यक्त की जा रही बात का संकेत देता है; ‘कह रहे थे’ इस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निष्कर्ष अथवा कथानक-संबंध जोड़ता है; ‘इसलिए’ उसके संयोजक बल को स्पष्ट रखता है।
- source_word: ἐκ τῶν Φαρισαίων
  choice: फरीसियों में से
  rationale: यह फरीसियों के भीतर के एक उपसमूह को बताता है और हिन्दी में सहज है।
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: यह मनुष्य
  rationale: यह पुरुष व्यक्ति के लिए प्रयुक्त मूल संज्ञा और संकेतवाचक बल, दोनों को बिना अतिरिक्त तिरस्कार जोड़े सुरक्षित रखता है।
- source_word: παρὰ θεοῦ
  choice: परमेश्वर की ओर से
  rationale: यहाँ वाक्यांश स्रोत या दैवी प्रामाणिकता बताता है; ‘भेजा हुआ’ कहना मूल में निहित अर्थ से अधिक स्पष्ट विस्तार होता।
- source_word: τηρεῖ τὸ σάββατον
  choice: सब्त का पालन नहीं करता
  rationale: आज्ञा अथवा पवित्र दिन के संबंध में τηρέω का अर्थ मानना या पालन करना है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἁμαρτωλὸς ἄνθρωπος
  choice: पापी मनुष्य
  rationale: मूल में ‘पापी’ विशेषण ‘मनुष्य’ को विशेषित करता है; अनुवाद उसी व्याकरणिक और तर्कात्मक बल को रखता है।
- source_word: τοιαῦτα σημεῖα
  choice: ऐसे चिन्ह
  rationale: यूहन्ना में σημεῖα उन कार्यों के प्रकटकारी अर्थ पर ध्यान दिलाता है; ‘चमत्कार’ कहने से वह विशिष्ट शब्दावली दब सकती है।
- source_word: ποιεῖν
  choice: दिखा सकता है
  rationale: चिन्हों के साथ शाब्दिक ‘करना’ हिन्दी में असहज है; ‘चिन्ह दिखाना’ कार्य को संपन्न करने का स्वाभाविक समतुल्य है और उसे केवल दृश्य प्रदर्शन तक सीमित करने का आशय नहीं रखता।
- source_word: σχίσμα
  choice: फूट
  rationale: यह केवल साधारण मतभेद नहीं, समूह के भीतर विभाजन को व्यक्त करता है; ‘फूट’ उसका बल संक्षिप्त और स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: यूहन्ना की शब्दावली σημεῖα का अनुवाद
  choice: चिन्ह
  alternative: चमत्कार / चमत्कारी चिन्ह
  rationale: ‘चिन्ह’ कार्य की अलौकिकता के साथ उसके द्वारा किसी गहरे सत्य की ओर संकेत करने की यूहन्नाई संभावना को खुला रखता है; मुख्य पाठ में ‘चमत्कारी’ जोड़ना मूल से अधिक स्पष्टता जोड़ता।
- issue: यीशु का परमेश्वर से होना
  choice: परमेश्वर की ओर से
  alternative: परमेश्वर द्वारा भेजा हुआ
  rationale: मूल वाक्य स्रोत अथवा दैवी प्रामाणिकता की बात करता है। ‘भेजा हुआ’ यूहन्ना के व्यापक मिशन-विषय के अनुरूप हो सकता है, पर यहाँ क्रिया के रूप में उपस्थित नहीं है।
- issue: ἁμαρτωλὸς का स्वरूप
  choice: पापी मनुष्य
  alternative: पापी
  rationale: विशेषण और संज्ञा दोनों को रखना मूल अभिव्यक्ति का सीधा रूप सुरक्षित करता है तथा वक्ताओं के तर्क को किसी व्यवस्थित धार्मिक श्रेणी में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। चल रही चर्चा के लिए ‘कह रहे थे’, सब्त-संबंधी धार्मिक व्यवहार के लिए ‘पालन’, और समूह के तीखे विभाजन के लिए ‘फूट’ चुना गया है। दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
