    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  choice: उसने उत्तर दिया
  rationale: हिन्दी में ‘उत्तर दिया’ यूनानी के प्रचलित कथात्मक युग्म ‘उत्तर देकर कहा’ का स्वाभाविक और अर्थपूर्ण रूप है; अनावश्यक पुनरुक्ति से बचते हुए उत्तर देने का भाव सुरक्षित रहता है।
- source_word: Καὶ τίς ἐστιν
  choice: और वह कौन है
  rationale: आरम्भिक καὶ को ‘और’ के रूप में रखा गया है, जिससे पिछले कथन से प्रश्न का सीधा संबंध बना रहता है; ‘वह कौन है’ τίς ἐστιν का सहज हिन्दी रूप है।
- source_word: κύριε
  choice: प्रभु
  rationale: κύριε का सामान्य धार्मिक अनुवाद ‘प्रभु’ है, पर यहाँ यह आदरसूचक ‘श्रीमान’ भी हो सकता है; इसलिए अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  choice: कि मैं उस पर विश्वास करूँ
  rationale: ἵνα के उद्देश्यभाव और πιστεύω εἰς के व्यक्ति पर विश्वास रखने के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: चंगा किए गए व्यक्ति की स्पष्ट स्वीकारोक्ति से पहले κύριε का अर्थ
  choice: प्रभु
  alternative: श्रीमान
  rationale: इस प्रसंग में संबोधन धार्मिक ‘प्रभु’ अथवा सामान्य आदरसूचक ‘श्रीमान’—दोनों हो सकता है। मुख्य पाठ में पारंपरिक और शब्द-संगत ‘प्रभु’ रखा गया है, जबकि प्रसंगगत अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘उत्तर दिया’ कथात्मक पुनरुक्ति को स्वाभाविक हिन्दी में संक्षिप्त करता है। पादटिप्पणी का चिह्न संबोधन ‘प्रभु’ के तुरंत बाद रखा गया है।
