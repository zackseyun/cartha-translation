  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: hi
  text: उसने उन्हें उत्तर दिया, “मैंने तुमसे पहले ही कहा था और तुमने ध्यान नहीं दिया।[a] तुम इसे फिर क्यों सुनना चाहते हो? तुम भी उसके शिष्य तो नहीं बनना चाहते?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने सुना नहीं।” यूनानी क्रिया का अर्थ ‘सुनना’ या ‘ध्यान देना’ दोनों हो सकता है; यहाँ सम्भवतः कही हुई बात पर ध्यान न देने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या, “निश्चय ही तुम भी उसके शिष्य नहीं बनना चाहते?” यूनानी प्रश्न में μή है, जो नकारात्मक उत्तर की अपेक्षा का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: यह सामान्य कथात्मक उत्तर-क्रिया को औपचारिक निकटता और स्वाभाविक हिन्दी, दोनों के साथ व्यक्त करता है।
- source_word: ἤδη
  choice: पहले ही
  rationale: यह बताता है कि बात इससे पूर्व कही जा चुकी थी और वक्ता इस तथ्य पर बल दे रहा है।
- source_word: οὐκ ἠκούσατε
  choice: तुमने ध्यान नहीं दिया
  rationale: ἀκούω का मूल अर्थ ‘सुनना’ है, पर प्रसंग में दोष केवल ध्वनि न सुन पाने का नहीं, कही हुई बात पर ध्यान न देने या उसे ग्रहण न करने का है।
- source_word: τί πάλιν θέλετε ἀκούειν;
  choice: तुम इसे फिर क्यों सुनना चाहते हो?
  rationale: इस प्रसंग में τί झुँझलाहट भरे ‘क्यों’ का भाव देता है; ‘इसे’ पिछली कही हुई बात को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: μὴ καὶ ὑμεῖς
  choice: कहीं तुम भी तो ... नहीं
  rationale: μή ऐसे प्रश्न का संकेत देता है जिसमें नकारात्मक उत्तर की अपेक्षा है; हिन्दी की यह प्रश्न-संरचना उस व्यंग्यात्मक आलंकारिक बल को स्वाभाविक ढंग से रखती है।
- source_word: αὐτοῦ μαθηταὶ
  choice: उसके शिष्य
  rationale: μαθηταί के लिए ‘शिष्य’ प्रचलित, स्पष्ट और यूहन्ना के प्रसंग के अनुकूल है।
- source_word: γενέσθαι
  choice: बनना
  rationale: γίνομαι किसी अवस्था में प्रवेश करने का भाव रखता है, इसलिए केवल ‘होना’ के बजाय ‘बनना’ उपयुक्त है।
theological_decisions:
- issue: अंतिम प्रश्न का आलंकारिक और व्यंग्यात्मक बल
  choice: “कहीं तुम भी तो उसके शिष्य नहीं बनना चाहते?”
  alternative: “निश्चय ही तुम भी उसके शिष्य नहीं बनना चाहते?”
  rationale: μή नकारात्मक उत्तर की अपेक्षा वाला प्रश्न प्रस्तुत करता है। मुख्य पाठ की हिन्दी संरचना इस व्याकरणिक संकेत और चंगे हुए व्यक्ति के व्यंग्य, दोनों को बनाए रखती है, बिना इसे कोई अतिरिक्त सिद्धान्तगत अर्थ दिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किन्तु गरिमापूर्ण रखी गई है। ‘ध्यान नहीं दिया’ प्रसंग का उलाहना स्पष्ट करता है, जबकि अगले वाक्य में ‘सुनना’ मूल क्रिया की पुनरावृत्ति को पर्याप्त रूप से बनाए रखता है। अंतिम प्रश्न की ‘कहीं ... तो नहीं’ संरचना व्यंग्य और अपेक्षित नकारात्मक उत्तर को सामान्य पाठक के लिए स्वाभाविक बनाती है।
