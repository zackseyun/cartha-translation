source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: hi
  text: और यीशु ने कहा, “मैं न्याय[a] के लिए इस संसार में आया हूँ, ताकि जो नहीं देखते वे देखें, और जो देखते हैं वे अंधे हो जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक न्याय के लिए।” यूनानी εἰς κρίμα यहाँ केवल दण्ड नहीं, बल्कि यीशु के आने के न्यायिक परिणाम और उससे होने वाले विभाजन पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: न्याय
  rationale: यहाँ शब्द न्यायिक निर्णय और उसके परिणाम—मनुष्यों की वास्तविक दशा के प्रकट होकर विभाजित होने—दोनों को व्यक्त करता है। ‘दण्ड’ बहुत संकीर्ण होता, क्योंकि वचन में दृष्टि पाना भी शामिल है।
- source_word: κόσμον
  choice: संसार
  rationale: यूहन्ना के संदर्भ में यह मानव-जगत को दर्शाता है; ‘संसार’ स्वाभाविक और स्थापित हिन्दी रूप है।
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: जो नहीं देखते / जो देखते हैं
  rationale: यह समानांतर रचना शारीरिक और आत्मिक दृष्टि, दोनों अर्थों को खुला रखती है और मूल के कृदन्तों की संतुलित अभिव्यक्ति करती है।
- source_word: βλέπωσιν
  choice: देखें
  rationale: ἵνα के बाद प्रयुक्त संभावनार्थक रूप को सहज हिन्दी में व्यक्त करता है और शारीरिक तथा आत्मिक दृष्टि की द्विअर्थकता बनाए रखता है।
- source_word: τυφλοὶ γένωνται
  choice: अंधे हो जाएँ
  rationale: यह अनुवाद विशेषण और γίνομαι के परिणामसूचक भाव दोनों को सुरक्षित रखता है; ‘अंधे सिद्ध हों’ मूल के वास्तविक ‘होने’ के भाव को कम कर देता।
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: इस संसार में आया हूँ
  rationale: यह εἰς के दिशात्मक भाव और यूहन्ना की आगमन-संबंधी भाषा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना 3:17 के ‘संसार का न्याय करने नहीं’ कथन से संबंध
  choice: κρίμα को ‘न्याय’ कहना और कथनों के बीच विद्यमान तनाव को बनाए रखना
  alternative: इसे ‘विभाजन’ या केवल ‘दण्ड’ कहकर तनाव को स्पष्टतः सुलझा देना
  rationale: 'इस पद में यीशु का आगमन न्यायिक उलटफेर उत्पन्न करता है: न देखनेवाले देखते हैं और देखनेवाले अंधे हो जाते हैं। ‘न्याय’ मूल की न्यायिक शक्ति को बनाए रखता है, जबकि ‘दण्ड’ अर्थ को अनुचित रूप से सीमित करता है।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘जो नहीं देखते / जो देखते हैं’ की समानांतर संरचना मूल की शाब्दिक तथा आत्मिक द्विअर्थकता बनाए रखती है।
