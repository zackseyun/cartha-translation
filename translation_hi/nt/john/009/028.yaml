  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
translation:
  language: hi
  text: उन्होंने उसे बुरा-भला कहा और बोले, “तू उस आदमी का[a] शिष्य है, पर हम मूसा के शिष्य हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका” या “उस व्यक्ति का।” यूनानी में यहाँ संकेतवाचक शब्द है, जो इस प्रसंग में दूरी या तिरस्कार का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: बुरा-भला कहा
  rationale: यह क्रिया कठोर और अपमानजनक वचन कहने का भाव रखती है। ‘बुरा-भला कहा’ आधुनिक हिन्दी में स्वाभाविक है और केवल सामान्य ‘अपमान किया’ की तुलना में मौखिक दुर्व्यवहार को अधिक स्पष्ट करता है।
- source_word: αὐτὸν
  choice: उसे
  rationale: यह उस चंगे किए गए व्यक्ति की ओर संकेत करने वाला सीधा कर्म सर्वनाम है।
- source_word: καὶ εἶπον
  choice: और बोले
  rationale: यूनानी कथन के सरल समन्वय को स्वाभाविक हिन्दी में व्यक्त करता है; कर्ता पिछले बहुवचन क्रिया-रूप से स्पष्ट है।
- source_word: Σὺ
  choice: तू
  rationale: यूनानी में सर्वनाम आगे रखकर बल दिया गया है। विरोधी और अपमानजनक प्रसंग में ‘तू’ उस बल तथा तिरस्कारपूर्ण संबोधन—दोनों को स्वाभाविक रूप से प्रकट करता है।
- source_word: μαθητὴς / μαθηταί
  choice: शिष्य / शिष्य
  rationale: ‘शिष्य’ यूहन्ना में μαθητής के लिए प्रचलित और गरिमापूर्ण शब्द है तथा शिक्षा से बढ़कर किसी गुरु से जुड़ाव का भाव रखता है। दोनों स्थानों पर एक ही शब्द रखने से यीशु और मूसा से संबंधित होने का विरोध स्पष्ट रहता है।
- source_word: ἐκείνου
  choice: उस आदमी का
  rationale: संकेतवाचक सर्वनाम यहाँ दूरी और तिरस्कार का भाव दे सकता है। ‘उस आदमी का’ इस भाव को हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अपेक्षाकृत शाब्दिक विकल्प बताती है।
- source_word: ἡμεῖς δὲ
  choice: पर हम
  rationale: δέ के विरोधसूचक बल और ἡμεῖς के स्पष्ट, बलयुक्त बहुवचन सर्वनाम—दोनों को संक्षेप में सुरक्षित रखता है।
- source_word: τοῦ Μωϋσέως ἐσμὲν μαθηταί
  choice: हम मूसा के शिष्य हैं
  rationale: सम्बन्धसूचक संबंध और विधेय संरचना को स्वाभाविक हिन्दी में स्पष्ट रूप से प्रस्तुत करता है।
theological_decisions:
- issue: यीशु के लिए ἐκείνου का स्वर
  choice: मुख्य पाठ में ‘उस आदमी का’ रखकर वक्ताओं की तिरस्कारपूर्ण दूरी को व्यक्त किया गया।
  alternative: ‘उसी का’ या ‘उसका’ जैसे अधिक तटस्थ और शाब्दिक रूप।
  rationale: यूनानी संकेतवाचक स्वयं ‘आदमी’ शब्द नहीं कहता, पर निन्दा के तत्काल प्रसंग में दूरी अथवा अवमानना का भाव सम्भव है। पादटिप्पणी शाब्दिक विकल्प देकर इस वास्तविक अस्पष्टता को सुरक्षित रखती है।
- issue: μαθητής का अनुवाद
  choice: दोनों बार ‘शिष्य’।
  alternative: ‘चेला’, ‘अनुयायी’ या ‘विद्यार्थी’।
  rationale: ‘शिष्य’ प्रतिबद्ध संबंध और अनुसरण का भाव रखता है, जबकि ‘विद्यार्थी’ बहुत शैक्षिक और ‘चेला’ इस प्रकाशन के गरिमापूर्ण स्तर के लिए अपेक्षाकृत बोलचाल का हो सकता है। दोनों बार समान शब्द वाक्य के धर्मवैचारिक विरोध को बिना बढ़ाए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘बुरा-भला कहा’ मौखिक निन्दा को स्वाभाविक ढंग से व्यक्त करता है। प्रत्यक्ष कथन में ‘तू’ जानबूझकर रखा गया है, क्योंकि प्रसंग शत्रुतापूर्ण है और यूनानी Σὺ बलयुक्त है।
