id: JHN.9.7
reference: John 9:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: hi
  text: और उसने उससे कहा, “जा, सिलोआम के कुंड में धो ले” (जिसका अनुवाद “भेजा हुआ” है)[a]। इसलिए वह गया, धो लिया और देखता हुआ लौट आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसका अर्थ ‘भेजा हुआ’ है।”
    reason: ἑρμηνεύεται के लिए ‘अनुवाद’ के स्थान पर अधिक सहज व्याख्यात्मक विकल्प।
lexical_decisions:
- source_word: Ὕπαγε
  choice: जा
  rationale: यह चलने की सीधी आज्ञा है। एक व्यक्ति को संबोधित करते हुए ‘जा’ स्वाभाविक और संक्षिप्त है।
- source_word: νίψαι / ἐνίψατο
  choice: धो ले / उसने धोया
  rationale: νίπτω सामान्यतः शरीर के किसी अंग को धोने के लिए प्रयुक्त हो सकता है। यूनानी में कर्म स्पष्ट नहीं है, इसलिए मुख्य पाठ में ‘आँखें’ जोड़कर उस अस्पष्टता को समाप्त नहीं किया गया। ‘धो ले’ हिन्दी में आज्ञा को स्वाभाविक बनाता है।
- source_word: εἰς τὴν κολυμβήθραν
  choice: कुंड में
  rationale: κολυμβήθρα जल के कुंड या हौज को दर्शाता है। धोने की क्रिया के साथ ‘कुंड में’ स्वाभाविक हिन्दी है।
- source_word: Σιλωάμ
  choice: शीलोह
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण चुना गया है।
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: शीलोह का अनुवाद है, “भेजा हुआ”
  rationale: व्याख्यात्मक कथन को मूल पाठ की तरह मुख्य पाठ में रखा गया है। ‘भेजा हुआ’ Ἀπεσταλμένος के निष्क्रिय भाव को सहज हिन्दी में सुरक्षित रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: οὖν आज्ञा और उसके पालन के बीच परिणामात्मक कथात्मक संबंध दिखाता है; ‘इसलिए’ उस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀπῆλθεν
  choice: वह गया
  rationale: सरल कथात्मक प्रस्थान को बिना अतिरिक्त अर्थ जोड़े व्यक्त करता है।
- source_word: ἦλθεν βλέπων
  choice: देखता हुआ लौट आया
  rationale: ‘देखता हुआ’ यूनानी वर्तमान कृदंत की जीवंतता और चंगाई के परिणाम को बनाए रखता है। प्रसंग में ἦλθεν का स्वाभाविक हिन्दी कथात्मक रूप ‘लौट आया’ है।
theological_decisions:
- issue: शीलोह पर दिए गए व्याख्यात्मक कथन को यूहन्ना के प्रतीकवाद से अधिक न भरना
  choice: 'कोष्ठक में केवल मूल पाठ का अर्थ-स्पष्टीकरण रखा गया: ‘शीलोह का अनुवाद है, “भेजा हुआ”।’'
  alternative: इसे यीशु के पिता द्वारा भेजे जाने से स्पष्ट रूप से जोड़ देना
  rationale: यूनानी पाठ स्वयं नाम का अर्थ बताता है, पर इस पद में प्रतीकात्मक संबंध की खुली व्याख्या नहीं करता। अनुवाद उस संभावित संबंध को पाठक के लिए खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। संवाद में एकवचन आज्ञार्थक ‘जा’ मूल की सीधी आज्ञा को रखता है। ‘धो ले’ में कर्म न जोड़कर यूनानी की अंतर्निहित अस्पष्टता सुरक्षित रखी गई है।
