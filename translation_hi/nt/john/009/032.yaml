base_translation:
  language: en
  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: hi
  text: पुराने समय से यह कभी सुनने में नहीं आया कि किसी ने जन्म से अंधे व्यक्ति की आँखें खोली हों।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब से संसार बना है, तब से यह कभी सुनने में नहीं आया …”
    reason: ἐκ τοῦ αἰῶνος के पारंपरिक और अधिक व्याख्यात्मक कालगत अनुवाद को दर्शाने के लिए।
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: पुराने समय से
  rationale: यह यूनानी मुहावरा स्मरणीय इतिहास के पूरे काल की ओर संकेत करता है। यह अभिव्यक्ति ऐतिहासिक अर्थ को स्वाभाविक हिन्दी में रखती है और अनावश्यक रूप से ‘अनादिकाल’ जैसा तत्त्वमीमांसात्मक अर्थ नहीं जोड़ती।
- source_word: οὐκ ἠκούσθη
  choice: यह कभी सुनने में नहीं आया
  rationale: अकर्मक भाव वाली यूनानी अभिव्यक्ति किसी सुने हुए उदाहरण या पूर्वघटना के अभाव को बताती है; हिन्दी में यह प्रयोग उसी अलंकारिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὅτι
  choice: कि
  rationale: यह उस बात की विषयवस्तु का परिचय देता है जो कभी सुनने में नहीं आई; साधारण ‘कि’ यूनानी रचना के निकट और हिन्दी में स्पष्ट है।
- source_word: ἠνέῳξέν
  choice: खोली हों
  rationale: आँखों के साथ ἀνοίγω का सीधा अर्थ ‘खोलना’ है। ‘दृष्टि लौटा दी हो’ कहना मूल क्रिया से अधिक व्याख्यात्मक होता।
- source_word: τις
  choice: किसी ने
  rationale: सार्वत्रिक नकारात्मक कथन में अनिश्चित कर्ता को ‘किसी ने’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὀφθαλμοὺς
  choice: आँखें
  rationale: हिन्दी के इस प्रचलित मुहावरे में ‘आँखें खोलना’ स्पष्ट और स्वाभाविक है।
- source_word: τυφλοῦ γεγεννημένου
  choice: जन्म से अंधे व्यक्ति की
  rationale: यह संबंधकारक वाक्यांश आँखों वाले व्यक्ति को जन्म से अंधा बताता है। ‘व्यक्ति’ मूल में निहित एकवचन मानव संदर्भ को स्पष्ट करता है, पर अनावश्यक रूप से ‘पुरुष’ नहीं जोड़ता।
theological_decisions:
- issue: ἐκ τοῦ αἰῶνος का कालगत विस्तार
  choice: ऐतिहासिक मुहावरे के रूप में ‘पुराने समय से’
  alternative: ‘जब से संसार बना है’ अथवा ‘अनादिकाल से’
  rationale: वक्ता मानव अनुभव में किसी पूर्व उदाहरण के न सुने जाने का दावा कर रहा है। चुना हुआ अनुवाद कथन के प्रबल अलंकारिक अर्थ को बनाए रखता है, पर उसे अनिवार्यतः सृष्टि के आरम्भ या आध्यात्मिक अनन्तता के विषय में कथन नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में बोधगम्य रखी गई है। ‘सुनने में नहीं आया’ हिन्दी में किसी अभूतपूर्व घटना के लिए स्वाभाविक मुहावरा है।
