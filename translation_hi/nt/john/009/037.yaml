  text: ⸀εἶπεν αὐτῷ ὁ Ἰησοῦς· Καὶ ἑώρακας αὐτὸν καὶ ὁ λαλῶν μετὰ σοῦ ἐκεῖνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: hi
  text: यीशु ने उससे कहा, “तुमने उसे देखा है, और जो तुम्हारे साथ बात कर रहा है, वही है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: उससे कहा
  rationale: यह दत्तिवाचक संबोधन सहित सामान्य कथात्मक संवाद है; ‘उससे कहा’ स्वाभाविक और सटीक हिन्दी है।
- source_word: Καὶ ἑώρακας αὐτὸν
  choice: तुमने उसे देखा है
  rationale: पूर्णकालीन ἑώρακας बीते हुए देखने के कार्य की वर्तमान प्रासंगिकता रखता है; हिन्दी का ‘देखा है’ इसे सहज रूप से व्यक्त करता है। आरम्भिक καί को हिन्दी में अलग ‘और’ बनाना आवश्यक नहीं, क्योंकि उद्धरण के आरम्भ में वह अस्वाभाविक होता और कथन में अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ὁ λαλῶν
  choice: जो … बात कर रहा है
  rationale: वर्तमान कृदन्त निरन्तर चल रहे बोलने को दर्शाता है; ‘जो बात कर रहा है’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: μετὰ σοῦ
  choice: तुम्हारे साथ
  rationale: μετά के संबंधसूचक रूप का मूल अर्थ ‘साथ’ है; यहाँ इसे बनाए रखने से संवाद की पारस्परिक निकटता भी बिना विस्तार के व्यक्त होती है।
- source_word: ἐκεῖνός ἐστιν
  choice: वही है
  rationale: यह संक्षिप्त पहचान-सूत्र है। ‘वही है’ पूर्वोक्त पुरुष की ओर स्पष्ट संकेत करता है, पर उसकी उपाधि को इस पद में जोड़कर पाठ का विस्तार नहीं करता।
theological_decisions:
- issue: पिछले पद में पूछे गए मनुष्य के पुत्र के साथ यीशु की आत्म-पहचान
  choice: “जो तुम्हारे साथ बात कर रहा है, वही है”
  alternative: “वह मैं ही हूँ, जो तुमसे बात कर रहा हूँ”
  rationale: ग्रीक वाक्य तीसरे पुरुष में सीधे उस पूर्वोक्त व्यक्ति की पहचान करता है। ‘मैं ही हूँ’ अर्थ को स्पष्ट करता, पर व्याकरणिक रूप बदल देता और पाठ से अधिक व्याख्यात्मक होता। चुना हुआ रूप पहचान की शक्ति और मूल की संक्षिप्तता दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, सम्मानपूर्ण और कथात्मक शैली। ‘तुम’ प्रसंग के एकवचन संबोधन के लिए स्वाभाविक है। ‘तुम्हारे साथ बात कर रहा है’ मूल μετά σοῦ को संरक्षित करता है, जबकि ‘तुमसे बात कर रहा है’ अधिक मुहावरेदार विकल्प होता।
