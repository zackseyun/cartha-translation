  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ⸀ὅτι Ἐγὼ εἶπα· Θεοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: hi
  text: यीशु ने उन्हें उत्तर दिया, “क्या तुम्हारी व्यवस्था में यह नहीं लिखा है, ‘मैंने कहा, तुम देवता हो’?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दैवी प्राणी।” यीशु भजन 82:6 का उद्धरण कर रहे हैं, जहाँ इस पद का आशय व्याख्या का विषय है; मुख्य पाठ उद्धरण के सीधे शब्दों को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: यीशु ने उन्हें उत्तर दिया
  rationale: यूहन्ना के संवाद-वर्णन में यह स्वाभाविक और अर्थनिष्ठ हिन्दी है; सम्प्रदान αὐτοῖς को ‘उन्हें’ से व्यक्त किया गया है।
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: क्या ... यह नहीं लिखा है
  rationale: यूनानी पूर्ण निष्क्रिय कृदन्त का वर्तमान परिणाम और प्रश्न का अपेक्षित सकारात्मक उत्तर, दोनों इस प्रचलित शास्त्रीय सूत्र में सुरक्षित हैं।
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: तुम्हारी व्यवस्था में
  rationale: यहाँ νόμος यहूदी पवित्रशास्त्र के व्यापक अर्थ में प्रयुक्त है, क्योंकि उद्धरण भजन 82:6 से है; ‘व्यवस्था’ उस मान्य शास्त्रीय पद को बनाए रखती है।
- source_word: Ἐγὼ εἶπα
  choice: मैंने कहा
  rationale: स्पष्ट सर्वनाम सहित भजन के उद्धरण को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: Θεοί ἐστε
  choice: तुम ईश्वर हो
  rationale: θεοί का सीधा शब्दार्थ उद्धरण की जानबूझकर तीखी और विवादित भाषा को बनाए रखता है; हिन्दी में ‘ईश्वर’ का रूप वचनानुसार नहीं बदलता, पर ‘तुम ... हो’ बहुवचन को स्पष्ट करता है।
theological_decisions:
- issue: भजन 82:6 के उद्धरण में θεοί का अनुवाद
  choice: ईश्वर
  alternative: दैवी प्राणी
  rationale: मुख्य पाठ में सीधे शब्दार्थ को रखने से यीशु के तर्क की आलंकारिक शक्ति और मूल की धर्मवैचारिक तनावपूर्ण अस्पष्टता बनी रहती है। ‘दैवी प्राणी’ एक सम्भव व्याख्यात्मक विकल्प है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: νόμος का दायरा
  choice: व्यवस्था
  alternative: पवित्रशास्त्र
  rationale: यीशु भजन से उद्धरण देते हुए उसे ‘तुम्हारी व्यवस्था’ कहते हैं। मूल पद को बनाए रखना इस व्यापक प्रयोग को सुरक्षित रखता है; ‘पवित्रशास्त्र’ अर्थ स्पष्ट करता, पर मूल की विशिष्ट शब्दावली को बदल देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘तुम्हारी व्यवस्था’ और ‘तुम ईश्वर हो’ मूल उद्धरण की प्रत्यक्षता तथा धर्मवैचारिक तनाव को बनाए रखते हैं।
