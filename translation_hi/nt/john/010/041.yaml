  to: और बहुत लोग उसके पास आए और कह रहे थे, “यूहन्ना ने कोई चिन्ह नहीं दिखाया[a], फिर भी इस व्यक्ति के विषय में यूहन्ना ने जो कुछ कहा था, वह सब सच था[b]।”
