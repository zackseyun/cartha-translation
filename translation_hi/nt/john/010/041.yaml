base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: hi
  text: और बहुत लोग उसके पास आए और कह रहे थे, “यूहन्ना ने कोई चिन्ह नहीं दिखाया[a], फिर भी इस व्यक्ति के विषय में यूहन्ना ने जो कुछ कहा था, वह सब सच था[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई चिन्ह नहीं किया।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसके विषय में।” यूनानी में शाब्दिक अर्थ “इस व्यक्ति के विषय में” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: यह विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; हिन्दी में ‘लोग’ जोड़ने से अर्थ स्वाभाविक और स्पष्ट होता है।
- source_word: ἦλθον πρὸς αὐτόν
  choice: उसके पास आए
  rationale: πρός के साथ यह पदबंध किसी व्यक्ति की ओर आकर उसके पास पहुँचने को व्यक्त करता है।
- source_word: ἔλεγον
  choice: कहने लगे
  rationale: अपूर्ण भूतकाल चलती या बार-बार कही जा रही बात का संकेत देता है; प्रसंग में ‘कहने लगे’ स्वाभाविक हिन्दी है।
- source_word: σημεῖον
  choice: चिन्ह
  rationale: यूहन्ना के सुसमाचार में यह ऐसा आश्चर्यकर्म है जो अपने से परे किसी सत्य की ओर संकेत करता है; ‘चिन्ह’ इस विशेष शब्दावली को बनाए रखता है।
- source_word: ἐποίησεν οὐδέν
  choice: कोई चिन्ह नहीं किया
  rationale: यह यूनानी अभिव्यक्ति का सीधा और सहज हिन्दी रूप है।
- source_word: πάντα δὲ ὅσα
  choice: जो कुछ … वह सब
  rationale: यह संरचना कथन की समग्रता को स्वाभाविक हिन्दी में सुरक्षित रखती है।
- source_word: περὶ τούτου
  choice: इस व्यक्ति के विषय में
  rationale: τούτου का संकेतात्मक बल बनाए रखते हुए यीशु की ओर संकेत किया गया है; केवल ‘उसके विषय में’ कहने से मूल का ‘इस’ भाव दब जाता।
- source_word: ἀληθῆ ἦν
  choice: सच था
  rationale: नपुंसकलिंग बहुवचन विषय के साथ यूनानी में एकवचन क्रिया है; हिन्दी में ‘वह सब सच था’ सीधा और अर्थसंगत है।
theological_decisions:
- issue: यूहन्ना के सुसमाचार में σημεῖον की विशेष शब्दावली
  choice: चिन्ह
  alternative: चमत्कार
  rationale: ‘चिन्ह’ आश्चर्यपूर्ण कार्य के संकेतात्मक और प्रकाशनात्मक पक्ष को बनाए रखता है; ‘चमत्कार’ उस अर्थ को केवल अद्भुत घटना तक सीमित कर सकता है।
- issue: περὶ τούτου का संकेतात्मक संदर्भ
  choice: इस व्यक्ति के विषय में
  alternative: उसके विषय में
  rationale: मूल यूनानी के संकेतवाचक सर्वनाम को खुला रखा गया है और उसे साधारण तृतीय-पुरुष सर्वनाम में समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ‘चिन्ह’ को यूहन्ना की प्रमुख पारिभाषिक शब्दावली के रूप में रखा गया है।
