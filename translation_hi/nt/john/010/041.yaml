  source_fidelity: The draft accurately represents the principal clauses and preserves the demonstrative force of περὶ τούτου with “इस व्यक्ति के विषय में.” However, “कहने लगे” is ingressive (“began to say”) and does not best represent the imperfect ἔλεγον, which portrays ongoing or repeated speech. “कह रहे थे” is closer without imposing a stronger interpretation.
  naturalness: “कोई चिन्ह नहीं किया” is structurally close to the Greek but is less idiomatic in modern Hindi than “कोई चिन्ह नहीं दिखाया.” The latter naturally expresses the Johannine claim while retaining “चिन्ह” as the key term. “बहुत लोग” is also slightly more natural than the hyphenated “बहुत-से लोग.”
  terminology: “चिन्ह” appropriately preserves σημεῖον rather than reducing it to “चमत्कार.” “इस व्यक्ति के विषय में” is a defensible, source-sensitive rendering of περὶ τούτου and should be retained. “सच था” is natural modern Hindi and adequately conveys ἀληθῆ ἦν.
