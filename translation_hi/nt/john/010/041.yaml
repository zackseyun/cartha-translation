    issue: “कोई चिन्ह नहीं किया” is awkward modern Hindi collocation.
    rationale: Hindi more naturally says that someone “दिखाया” a sign. This adjustment improves readability without changing the meaning or replacing the Johannine term “चिन्ह.”},{
