  text: πάντες ὅσοι ἦλθον ⸂πρὸ ἐμοῦ⸃ κλέπται εἰσὶν καὶ λῃσταί· ἀλλ’ οὐκ ἤκουσαν αὐτῶν τὰ πρόβατα.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: hi
  text: जितने लोग मुझसे पहले[a] आए, वे सब चोर और लुटेरे हैं; पर भेड़ों ने उनकी नहीं सुनी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मुझसे आगे।’ यह वाक्यांश समय के अर्थ में ‘मुझसे पहले’ हो सकता है, या यीशु से अलग अपना अधिकार जताते हुए आगे आ जाने का भाव दे सकता है। प्रसंग परमेश्वर के पहले भेजे गए सभी सेवकों के बजाय झूठे चरवाहों की ओर संकेत करता है।
    reason: वैकल्पिक अर्थ और कथन के प्रसंगगत दायरे को सुरक्षित रखना।
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: जितने लोग…वे सब
  rationale: यह हिन्दी की स्वाभाविक सहसंबंधी रचना है, जो यूनानी पदबंध की व्यापक और समूहवाचक शक्ति बनाए रखती है।
- source_word: ἦλθον
  choice: आए
  rationale: अओरिस्ट क्रिया को सामान्य भूतकाल में व्यक्त किया गया है; इससे यूनानी में निहित न होने वाला कोई अतिरिक्त परिणामार्थ नहीं जुड़ता।
- source_word: πρὸ ἐμοῦ
  choice: मुझसे पहले
  rationale: यह वाक्यांश का सीधा और स्वाभाविक कालवाचक अनुवाद है। ‘मुझसे आगे’ की संभावित छाया को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: κλέπται
  choice: चोर
  rationale: यह κλέπτης का प्रचलित हिन्दी समतुल्य है और अवैध रूप से ले जाने के भाव को स्पष्ट रखता है।
- source_word: λῃσταί
  choice: लुटेरे
  rationale: यह κλέπται से भिन्न, अधिक खुली या हिंसक लूट करने वालों का भाव रखता है, पर ‘डाकू’ की अपेक्षा अनावश्यक रूप से संगठित गिरोह का अर्थ नहीं जोड़ता।
- source_word: εἰσὶν
  choice: हैं
  rationale: यूनानी वर्तमानकाल को बनाए रखा गया है, यद्यपि उनके आने की क्रिया भूतकाल में है।
- source_word: ἀλλ’
  choice: पर
  rationale: यह सरल विरोधसूचक संयोजक है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: उनकी नहीं सुनी
  rationale: सम्बन्धकारक के साथ ἀκούω यहाँ केवल ध्वनि सुनने से बढ़कर किसी की आवाज़ पर ध्यान देने और उसे स्वीकार करने का भाव देता है। हिन्दी मुहावरा इसी प्रतिक्रियात्मक सुनने को संक्षेप में व्यक्त करता है।
- source_word: τὰ πρόβατα
  choice: भेड़ों
  rationale: चरवाहे और झुंड के रूपक में यह सामान्य और स्पष्ट बहुवचन रूप है।
theological_decisions:
- issue: ‘जितने लोग मुझसे पहले आए’ का दायरा
  choice: मुख्य पाठ में यूनानी की व्यापक अभिव्यक्ति को बिना सीमित किए सीधे रखा गया है।
  alternative: इसे केवल यीशु से अलग अधिकार जताने वाले झूठे चरवाहों या दावेदारों तक स्पष्ट रूप से सीमित करना।
  rationale: वाक्य का रूप व्यापक है, जबकि प्रसंग झूठे चरवाहों की ओर संकेत करता है और परमेश्वर के पहले भेजे गए हर सेवक की निन्दा आवश्यक नहीं बनाता। इस तनाव को मुख्य पाठ में व्याख्यात्मक शब्द जोड़कर सुलझाया नहीं गया।
- issue: πρὸ ἐμοῦ का अर्थ
  choice: मुझसे पहले
  alternative: मुझसे आगे या मुझसे पहले आकर अधिकार जताने वाले
  rationale: कालवाचक अर्थ सबसे सीधा है, पर आगे बढ़कर या अग्रता का दावा करके आने की अर्थछाया संभव है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जितने लोग…वे सब’ सामान्य पाठक के लिए स्वाभाविक है; ‘चोर और लुटेरे’ दोनों यूनानी संज्ञाओं का अंतर बनाए रखते हैं।
