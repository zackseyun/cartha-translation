source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: hi
  text: फिर वह यरदन के पार उस स्थान पर चला गया, जहाँ यूहन्ना पहले बपतिस्मा दिया करता था, और वहीं ठहरा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: चला गया
  rationale: ἀπέρχομαι का अओरिस्ट वर्तमान स्थान से चले जाने को व्यक्त करता है; ‘चला गया’ आधुनिक हिन्दी में स्वाभाविक रूप से प्रस्थान का भाव देता है।
- source_word: πάλιν
  choice: फिर
  rationale: यह क्रिया की पुनरावृत्ति बताता है; इस प्रसंग में ‘फिर’ सहज और स्पष्ट है।
- source_word: πέραν τοῦ Ἰορδάνου
  choice: यरदन के पार
  rationale: πέραν + संबंधकारक नदी की दूसरी ओर स्थित स्थान को सूचित करता है; ‘के पार’ सटीक और प्रचलित हिन्दी है।
- source_word: εἰς τὸν τόπον
  choice: उस स्थान पर
  rationale: εἰς गंतव्य की ओर गति दर्शाता है; हिन्दी में ‘स्थान पर चला गया’ स्वाभाविक गंतव्य-निर्देश है।
- source_word: ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων
  choice: जहाँ यूहन्ना पहले बपतिस्मा दिया करता था
  rationale: ἦν ... βαπτίζων भूतकाल में जारी या अभ्यस्त गतिविधि को दर्शाता है, और τὸ πρῶτον पहले के समय की ओर संकेत करता है; ‘पहले ... दिया करता था’ दोनों भावों को सहज हिन्दी में रखता है।
- source_word: ἔμεινεν ἐκεῖ
  choice: वहीं ठहरा
  rationale: μένω यहाँ किसी स्थान पर बने रहने के अर्थ में है; ‘वहीं ठहरा’ ἐκεῖ के स्थानिक बल को भी स्वाभाविक रूप से व्यक्त करता है।
