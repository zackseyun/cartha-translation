  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘बपतिस्मा’ व्यापक रूप से पहचाना जाने वाला बाइबलीय शब्द रखा गया है। मूल यूनानी में कोई ऐसी अर्थगत अनिश्चितता नहीं है जिसके लिए इस पद में पाद-टिप्पणी आवश्यक हो।
