id: JHN.10.18
reference: John 10:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: hi
  text: कोई उसे मुझसे नहीं लेता, बल्कि मैं स्वयं[a] उसे दे देता हूँ। मुझे उसे देने का अधिकार है और उसे फिर से लेने[c] का भी अधिकार[b] है। यह आज्ञा मुझे मेरे पिता से मिली है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी ओर से” अथवा “अपने ही पहल पर।” यह वाक्यांश इस बात पर बल देता है कि यीशु स्वेच्छा से अपना प्राण देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “सामर्थ्य” अथवा “वैध अधिकार।” यूनानी शब्द में कार्य करने की क्षमता और ऐसा करने का अधिकार—दोनों भाव हो सकते हैं।
    reason: lexical_alternative
  - marker: c
    text: “उसे” से आशय उसके प्राण से है; यूहन्ना 10:17 में आए “अपने प्राण” से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: αἴρει ... ἀπ’ ἐμοῦ
  choice: मुझसे नहीं छीनता
  rationale: यहाँ क्रिया का अर्थ यीशु के प्राण को उससे बलपूर्वक ले लेना है। ‘छीनता’ स्वैच्छिक आत्मदान के साथ स्पष्ट विरोध दिखाता है।
- source_word: τίθημι αὐτήν / θεῖναι αὐτήν
  choice: उसे देता हूँ / उसे देने
  rationale: शाब्दिक ‘उसे रखता हूँ’ आधुनिक हिन्दी में इस संदर्भ में अस्वाभाविक और अस्पष्ट होगा। ‘प्राण देना’ के निकट अर्थ वाला यह प्रयोग यीशु के स्वैच्छिक आत्मदान को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि सर्वनाम तत्काल संदर्भ से जुड़ा रहता है।
- source_word: ἀπ’ ἐμαυτοῦ
  choice: अपनी इच्छा से
  rationale: यह यीशु की स्वैच्छिक क्रिया और निजी अभिकरण पर बल देता है, पर अगले वाक्य में पिता की आज्ञा के साथ उसके संबंध को स्वतंत्रता-विच्छेद के रूप में नहीं पढ़ता।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यह शब्द केवल सामर्थ्य नहीं, बल्कि वैध अधिकार और प्राधिकरण भी व्यक्त करता है; पिता से मिली आज्ञा का उल्लेख इसी अर्थ को पुष्ट करता है।
- source_word: πάλιν λαβεῖν αὐτήν
  choice: उसे फिर से ग्रहण करने
  rationale: λαμβάνω में ‘लेना’ और ‘ग्रहण करना’ दोनों भाव संभव हैं। ‘फिर से ग्रहण करना’ पुनः जीवन धारण करने के सक्रिय भाव को व्यक्त करता है और हिन्दी में गरिमापूर्ण है।
- source_word: ἐντολήν
  choice: आज्ञा
  rationale: ἐντολή का सीधा और प्रचलित हिन्दी समतुल्य ‘आज्ञा’ है; यह पिता-पुत्र के संबंध और सौंपे गए निर्देश दोनों को बनाए रखता है।
- source_word: παρὰ τοῦ πατρός μου
  choice: अपने पिता से
  rationale: παρά के संबंधकारक प्रयोग में स्रोत का अर्थ है। कर्ता यीशु होने के कारण ‘अपने पिता से’ आधुनिक हिन्दी में स्वाभाविक और संबंधपरक है।
theological_decisions:
- issue: यीशु की मृत्यु और पुनः जीवन ग्रहण करने के संबंध में ἐξουσία का अर्थ
  choice: अधिकार
  alternative: सामर्थ्य; शक्ति
  rationale: ‘अधिकार’ यीशु की वास्तविक सक्रियता तथा पिता से प्राप्त वैध प्राधिकरण—दोनों को साथ रखता है; इसे केवल क्षमता या शक्ति तक सीमित नहीं करता।
- issue: ἀπ’ ἐμαυτοῦ में स्वैच्छिकता और पिता से संबंध
  choice: अपनी इच्छा से
  alternative: अपने आप से; अपनी ओर से
  rationale: यह यीशु के स्वैच्छिक आत्मदान को स्पष्ट करता है, लेकिन ऐसा पूर्ण स्वतंत्रतावाद नहीं सुझाता जो पिता से मिली आज्ञा के अंतिम कथन से तनाव मिटा दे।
- issue: αὐτήν का संदर्भ
  choice: उसे
  alternative: अपने प्राण को
  rationale: स्त्रीलिंग सर्वनाम निकटवर्ती संदर्भ में ‘मेरे प्राण’ की ओर लौटता है। सर्वनाम बनाए रखने से यूनानी अभिव्यक्ति की पुनरावृत्ति और संदर्भगत संबंध सुरक्षित रहता है।
- issue: πάλιν λαβεῖν αὐτήν में सक्रियता
  choice: उसे फिर से ग्रहण करने
  alternative: उसे फिर से पाने; उसे वापस लेने
  rationale: अनुवाद यीशु की सक्रिय भूमिका को बनाए रखता है, पर पुनरुत्थान की प्रक्रिया के बारे में पद से अधिक व्यवस्थित निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल शैली रखी गई है। ‘छीनता’ और ‘अपनी इच्छा से देता हूँ’ पद के बलपूर्वक लिए जाने तथा स्वैच्छिक देने के विरोध को स्पष्ट करते हैं। ‘ग्रहण करने’ अपेक्षाकृत गरिमापूर्ण है, फिर भी सामान्य पाठक के लिए बोधगम्य रहता है।
