source:
  edition: SBLGNT
  text: ἀλλὰ ὑμεῖς οὐ πιστεύετε, ⸂ὅτι οὐκ⸃ ἐστὲ ἐκ τῶν προβάτων τῶν ⸀ἐμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/026.yaml
  text: But you do not believe[a], because you are not among my sheep.
translation:
  language: hi
  text: पर तुम विश्वास नहीं करते[a], क्योंकि तुम मेरी भेड़ों में से नहीं हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर तुम यह विश्वास नहीं करते कि तुम मेरी भेड़ों में से नहीं हो।” यूनानी संयोजक को कारण बताने के बजाय कथन की विषय-वस्तु प्रस्तुत करने वाला भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: पर
  rationale: यह पिछले कथन के साथ स्पष्ट विरोध दिखाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὑμεῖς
  choice: तुम
  rationale: यूनानी में सर्वनाम स्पष्ट और बलयुक्त है; प्रसंग में सामान्य हिन्दी सर्वनाम पर्याप्त रूप से उस विरोध को व्यक्त करता है।
- source_word: οὐ πιστεύετε
  choice: विश्वास नहीं करते
  rationale: नकार सहित वर्तमानकालीन क्रिया को सरल वर्तमान में रखना स्वाभाविक है और यूहन्ना में विश्वास की प्रमुख शब्दावली बनाए रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ कारणसूचक अर्थ संवाद के प्रवाह से अच्छी तरह मेल खाता है; फिर भी 'कि' द्वारा विषय-वस्तु बताने वाला अर्थ सम्भव है और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: οὐκ ἐστὲ ἐκ τῶν προβάτων
  choice: भेड़ों में से नहीं हो
  rationale: ἐκ समूह से संबंध या सदस्यता बताता है; 'में से' हिन्दी में इस अर्थ को स्वाभाविक और निकट रूप से व्यक्त करता है।
- source_word: τῶν ἐμῶν
  choice: मेरी
  rationale: स्वामित्वसूचक पद का सहज हिन्दी रूप, जो सीधे 'भेड़ों' को विशेषित करता है।
theological_decisions:
- issue: अविश्वास और यीशु की भेड़ों में होने के बीच ὅτι का संबंध
  choice: 'कारणसूचक: “क्योंकि तुम मेरी भेड़ों में से नहीं हो”'
  alternative: 'विषय-वस्तुसूचक: “तुम यह विश्वास नहीं करते कि तुम मेरी भेड़ों में से नहीं हो”'
  rationale: तात्कालिक प्रसंग में यीशु की भेड़ों के सुनने और पीछे चलने की तुलना विरोधियों के अविश्वास से है, इसलिए कारणसूचक अर्थ अधिक सम्भाव्य है। फिर भी यूनानी ὅτι दूसरा अर्थ भी दे सकता है; चुनाव, मानवीय अविश्वास या किसी व्यापक धर्मसैद्धांतिक प्रणाली को निर्णायक रूप से पाठ में आरोपित किए बिना इस सम्भावना को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। 'मेरी भेड़ों में से' समूह-सदस्यता को स्पष्ट करता है। मुख्य पाठ में सम्भावित कारणसूचक अर्थ है और वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
