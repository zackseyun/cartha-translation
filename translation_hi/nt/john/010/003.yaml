source:
  edition: SBLGNT
  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: hi
  text: उसके लिए द्वारपाल द्वार खोलता है, और भेड़ें उसकी आवाज़ सुनती हैं। वह अपनी भेड़ों को नाम लेकर बुलाता है और उन्हें बाहर ले जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτῳ
  choice: उसके लिए
  rationale: यह संकेतवाचक सर्वनाम पिछले पद के चरवाहे की ओर संकेत करता है। ‘उसके लिए’ स्वाभाविक हिन्दी है और व्यक्तिगत संदर्भ बनाए रखता है।
- source_word: ὁ θυρωρός
  choice: द्वारपाल
  rationale: भेड़शाला के प्रवेश-द्वार की रखवाली और उसे खोलने वाले व्यक्ति के लिए आधुनिक, स्पष्ट और गरिमापूर्ण शब्द।
- source_word: ἀνοίγει
  choice: द्वार खोलता है
  rationale: यूनानी में कर्म निहित है; हिन्दी में स्पष्टता और स्वाभाविकता के लिए ‘द्वार’ दोहराया गया है।
- source_word: τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει
  choice: भेड़ें उसकी आवाज़ सुनती हैं
  rationale: नपुंसकलिंग बहुवचन कर्ता के साथ यूनानी क्रिया एकवचन हो सकती है, पर अर्थ बहुवचन है। ‘आवाज़ सुनती हैं’ पहचान और श्रवण दोनों को सहज रूप से व्यक्त करता है।
- source_word: τὰ ἴδια πρόβατα
  choice: अपनी भेड़ों को
  rationale: ἴδια स्वामित्व और विशेष संबंध पर बल देता है; ‘अपनी’ हिन्दी में उसी संबंध को स्वाभाविक रूप से दर्शाता है।
- source_word: φωνεῖ κατ’ ὄνομα
  choice: नाम लेकर बुलाता है
  rationale: यह हिन्दी मुहावरा प्रत्येक भेड़ को उसके नाम से बुलाने का भाव स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐξάγει αὐτά
  choice: उन्हें बाहर ले जाता है
  rationale: ἐξάγω में बाहर लाने या ले जाने, दोनों की अर्थ-छाया है। चरवाहे के मार्गदर्शन के प्रसंग में ‘बाहर ले जाता है’ स्वाभाविक है और अनावश्यक व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: चरवाहे के रूपक में व्यक्ति की पहचान और भूमिका
  choice: क्रियाओं को रूपक के भीतर चरवाहे के कार्यों के रूप में सीधे रखा गया है; उसका नाम स्पष्ट रूप से यीशु नहीं जोड़ा गया।
  alternative: पद में ही चरवाहे को स्पष्टतः यीशु कह देना।
  rationale: मूल पाठ इस पद में रूपकात्मक पात्रों को ही सामने रखता है। अनुवाद को प्रसंगगत मसीही अर्थ का पूर्वनिर्णय करके उसे पाठ में नहीं जोड़ना चाहिए।
- issue: ἐξάγει में मार्गदर्शन और बाहर लाने की अर्थ-छाया
  choice: ‘बाहर ले जाता है’
  alternative: ‘बाहर निकालता है’ या ‘बाहर लाता है’
  rationale: चुना गया रूप चरवाहे के नेतृत्व को सहज रूप से व्यक्त करता है, जबकि क्रिया के मूल गमनार्थ को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि ἐξάγει का ‘बाहर ले जाता है’ अर्थ प्रसंग में पर्याप्त स्पष्ट है और अंग्रेज़ी परत की दी हुई पाद-टिप्पणी ἀνοίγει से असंगत प्रतीत होती है।
