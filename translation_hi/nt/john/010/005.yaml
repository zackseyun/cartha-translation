id: JHN.10.5
reference: John 10:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: hi
  text: पर वे किसी पराए के पीछे कभी नहीं चलेंगी[a], बल्कि उससे दूर भागेंगी, क्योंकि वे परायों की आवाज़ नहीं पहचानतीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हरगिज़ पीछे नहीं चलेंगी।” यूनानी में निषेध पर विशेष बल है।
    reason: lexical_alternative
  - marker: b
    text: या, “परायों की आवाज़ नहीं जानतीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: किसी पराए
  rationale: चरवाहे और भेड़ों के रूपक में ἀλλότριος उस व्यक्ति को दर्शाता है जो उनका अपना नहीं है। ‘पराया’ जातीय अर्थ जोड़े बिना इस संबंधगत विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: कभी नहीं चलेंगी
  rationale: οὐ μή के साथ भविष्यकाल प्रबल निषेध व्यक्त करता है। ‘कभी नहीं’ आधुनिक हिन्दी में उसका जोर स्पष्ट रूप से बनाए रखता है।
- source_word: ἀκολουθήσουσιν
  choice: के पीछे ... चलेंगी
  rationale: भेड़ों के किसी व्यक्ति का अनुसरण करने के प्रसंग में यह सहज और स्पष्ट हिन्दी अभिव्यक्ति है।
- source_word: φεύξονται ἀπ’ αὐτοῦ
  choice: उससे दूर भागेंगी
  rationale: φεύγω और ἀπό उससे बचकर हटने या भागने का भाव देते हैं; ‘दूर भागेंगी’ इस प्रबल दूरी बनाने की क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἴδασι
  choice: पहचानतीं
  rationale: आवाज़ के संदर्भ में οἶδα जानने के साथ पहचानने का भाव भी रखता है। हिन्दी में ‘आवाज़ पहचानना’ अधिक स्वाभाविक है और प्रसंग के पहचानी हुई तथा अपरिचित आवाज़ के विरोध को स्पष्ट रखता है।
- source_word: τῶν ἀλλοτρίων τὴν φωνήν
  choice: परायों की आवाज़
  rationale: बहुवचन संबंधकारक को सीधे रखा गया है। यूनानी में ‘आवाज़’ एकवचन है, जिसे हिन्दी में भी बनाए रखा गया है।
- source_word: δὲ ... ἀλλὰ
  choice: पर ... बल्कि
  rationale: यह जोड़ी पहले निषेध और फिर उसके विपरीत व्यवहार को सामने रखती है; ‘पर ... बल्कि’ आधुनिक, गरिमापूर्ण हिन्दी में वही विरोध व्यक्त करता है।
theological_decisions:
- issue: भेड़ और चरवाहे के रूपक का आशय
  choice: रूपक को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों बनाए रखना
  alternative: ‘पराए’ को मुख्य पाठ में स्पष्ट रूप से झूठा शिक्षक या अवैध अगुवा कहना
  rationale: इस पद में संदर्भित व्यक्ति की पहचान स्पष्ट नहीं की गई है। अनुवाद में उसे किसी विशिष्ट धार्मिक वर्ग से जोड़ना मूल पाठ से आगे बढ़ना होगा।
- issue: οἶδα का ज्ञान या पहचान संबंधी भाव
  choice: मुख्य पाठ में ‘पहचानतीं’
  alternative: ‘जानतीं’
  rationale: दोनों अर्थ संभव हैं, पर आवाज़ के साथ आधुनिक हिन्दी में ‘पहचानना’ अधिक सहज है। पादटिप्पणी ‘जानतीं’ को वैध विकल्प के रूप में सुरक्षित रखती है और संबंधगत अर्थ को बंद नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। स्त्रीलिंग बहुवचन क्रियाएँ संदर्भ की ‘भेड़ों’ के अनुसार हैं। ‘पराया’ रूपक के संबंधगत अर्थ को बनाए रखता है और ‘विदेशी’ जैसे जातीय संकेत से बचता है।
