  terminology: “पराया” conveys the relational sense of ἀλλότριος without the ethnic implication of “विदेशी.” “आवाज़ पहचानतीं” is idiomatic for οἶδα with “voice,” while the footnote preserves “जानतीं” as a valid alternative. The register is appropriately clear and dignified.
