  source_fidelity: 'The Hindi accurately reflects the Greek contrast and syntax: emphatic future negation (οὐ μὴ ἀκολουθήσουσιν), refusal to follow an outsider, flight away from him, and the reason that the sheep do not know/recognize the voice of outsiders. The singular “किसी पराए” and plural possessive “परायों की आवाज़” appropriately preserve the Greek number distinction.'
