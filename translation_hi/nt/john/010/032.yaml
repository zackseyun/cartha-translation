source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Πολλὰ ⸂ἔργα καλὰ ἔδειξα ὑμῖν⸃ ἐκ τοῦ ⸀πατρός· διὰ ποῖον αὐτῶν ἔργον ⸂ἐμὲ λιθάζετε⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: hi
  text: यीशु ने उन्हें उत्तर दिया, “मैंने तुम्हें पिता[b] की ओर से बहुत-से भले काम दिखाए हैं। उनमें से किस काम के कारण[a] तुम मुझे पत्थर मार रहे हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन कामों में से किसके लिए तुम मुझे पत्थर मार रहे हो?”
    reason: कारणसूचक διά का हिन्दी में एक वैकल्पिक, अधिक संक्षिप्त अनुवाद।
  - marker: b
    text: कुछ अनुवादों में “मेरे पिता” है, पर यहाँ यूनानी पाठ में केवल “पिता” है।
    reason: मूल पाठ में स्वत्ववाचक शब्द न होने की जानकारी और प्रचलित वैकल्पिक अनुवाद का उल्लेख।
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: यह कथात्मक प्रसंग में प्रत्युत्तर देने के लिए स्वाभाविक और प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: Πολλὰ ἔργα καλὰ
  choice: बहुत-से भले काम
  rationale: ‘काम’ यूहन्ना में यीशु के कार्यों के सामान्य और धर्मवैज्ञानिक दोनों अर्थों को बनाए रखता है; ‘भले’ उनके अच्छे और हितकारी स्वरूप को व्यक्त करता है।
- source_word: ἔδειξα
  choice: दिखाए हैं
  rationale: हिन्दी का पूर्ण वर्तमान उन कार्यों को सामने प्रकट करने और वर्तमान विवाद में उनकी प्रासंगिकता—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκ τοῦ πατρός
  choice: पिता की ओर से
  rationale: यह कार्यों के स्रोत को व्यक्त करता है और यूनानी पाठ में अनुपस्थित ‘मेरे’ को नहीं जोड़ता।
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: उनमें से किस काम के कारण
  rationale: διά के कारणसूचक अर्थ तथा αὐτῶν के पहले बताए गए अनेक कामों की ओर संकेत को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: λιθάζετε
  choice: तुम मुझे पत्थर मार रहे हो
  rationale: वर्तमान काल की तात्कालिक कार्रवाई अथवा मंशा को बिना ‘कोशिश’ जैसा अतिरिक्त अर्थ जोड़े सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यीशु के कथन में ‘पिता’ का उल्लेख
  choice: ‘पिता’ रखा गया है, ‘मेरे पिता’ नहीं
  alternative: ‘मेरे पिता’
  rationale: यूनानी पाठ में स्वत्ववाचक μου (‘मेरे’) नहीं है। इसलिए पुत्र-पिता संबंध को संदर्भ से समझने दिया गया है और मूल शब्दावली से अधिक स्पष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भले काम’ यूहन्ना के ‘काम’ संबंधी शब्द-प्रयोग को बनाए रखता है, जबकि ‘पत्थर मार रहे हो’ तात्कालिक टकराव को स्वाभाविक हिन्दी में व्यक्त करता है।
