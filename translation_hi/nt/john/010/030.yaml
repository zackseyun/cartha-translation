  text: I and the Father are one[a].
translation:
  language: hi
  text: मैं और पिता एक हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘एक’ नपुंसकलिंग है। यह यीशु और पिता की एकता पर बल देता है, पर उन्हें एक ही व्यक्ति नहीं बताता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: मैं
  rationale: यूनानी में प्रथम पुरुष एकवचन सर्वनाम स्पष्ट और बलयुक्त है; हिन्दी में इसे स्वाभाविक रूप से बनाए रखा गया है।
- source_word: καὶ
  choice: और
  rationale: यह दोनों कर्ताओं को जोड़ने वाला सामान्य समुच्चयबोधक है; इसमें अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: ὁ πατὴρ
  choice: पिता
  rationale: यूहन्ना के प्रसंग में यह यीशु के पिता के लिए व्यक्तिगत और ईश्वरीय संबोधन है; हिन्दी बाइबलीय प्रयोग में ‘पिता’ स्वाभाविक है।
- source_word: ἕν
  choice: एक
  rationale: यह नपुंसकलिंग एकवचन है और वास्तविक एकता को व्यक्त करता है, पर यीशु और पिता को एक ही व्यक्ति नहीं ठहराता। ‘एक’ मूल कथन की संक्षिप्तता और अर्थगत तनाव को बनाए रखता है।
- source_word: ἐσμεν
  choice: हैं
  rationale: यूनानी क्रिया प्रथम पुरुष बहुवचन वर्तमानकाल में है। हिन्दी का ‘हैं’ ‘मैं’ और ‘पिता’ के बीच भेद बनाए रखते हुए उनकी एकता व्यक्त करता है।
theological_decisions:
- issue: नपुंसकलिंग ἕν और बहुवचन ἐσμεν का मसीह-विषयक अर्थ
  choice: कथन को वास्तविक एकता और व्यक्तिगत भेद दोनों बनाए रखते हुए ‘मैं और पिता एक हैं’ अनूदित किया गया है।
  alternative: ‘मैं और पिता एक ही व्यक्ति हैं’ अथवा ‘मैं और पिता एकमत हैं।’
  rationale: नपुंसकलिंग ‘एक’ व्यक्तियों को मिला देने से बचाता है, जबकि बहुवचन क्रिया उनका भेद बनाए रखती है। केवल ‘एकमत’ कहना कथन को अनावश्यक रूप से कमजोर करता, और ‘एक ही व्यक्ति’ कहना यूनानी व्याकरण से आगे जाता।
translation_notes:
  register: भाषा संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिन्दी की है। ‘मैं और पिता एक हैं’ मूल यूनानी की शब्द-संरचना, बहुवचन क्रिया और जानबूझकर रखे गए धर्मवैज्ञानिक तनाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
