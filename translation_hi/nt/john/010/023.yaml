lexical_decisions:
- source_word: περιεπάτει
  choice: टहल रहे थे
  rationale: अपूर्ण भूतकाल की जारी क्रिया को व्यक्त करता है; प्रसंग में किसी स्थान पर चलते रहने के लिए स्वाभाविक हिन्दी है।
- source_word: ἱερῷ
  choice: मन्दिर-परिसर
  rationale: ἱερόν पूरे मन्दिर-क्षेत्र को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं; ‘मन्दिर-परिसर’ इस भेद को स्पष्ट रखता है।
- source_word: στοᾷ
  choice: बरामदे
  rationale: στοά स्तम्भों वाले छायादार, ढके हुए गलियारे या मंडप को दर्शाता है; ‘बरामदा’ साधारण आधुनिक हिन्दी में सहज और बोधगम्य है।
- source_word: τοῦ Σολομῶνος
  choice: सुलैमान के
  rationale: सम्बन्धकारक पद को स्थान-नाम के स्वाभाविक हिन्दी रूप में प्रस्तुत किया गया है।
- source_word: καὶ
  choice: और
  rationale: यूनानी के सामान्य संयोजक अर्थ को बिना अतिरिक्त कालगत संकेत जोड़े सुरक्षित रखता है।
