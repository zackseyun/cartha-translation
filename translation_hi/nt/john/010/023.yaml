    issue: ‘टहल रहे थे’ may over-specify the manner of walking.
    rationale: περιπατέω in this context states that Jesus was walking/about in the temple precincts; it does not necessarily imply leisurely strolling. ‘चल रहे थे’ maintains the imperfect’s ongoing aspect more neutrally.
  - severity: low
    issue: The main text’s unqualified ‘बरामदा’ leaves the colonnaded character of στοά less clear.
    rationale: Adding ‘स्तम्भों वाले’ gives the core architectural sense directly and remains idiomatic Hindi.
