id: JHN.10.36
reference: John 10:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: hi
  text: तो जिसे पिता ने पवित्र ठहराया[a] और संसार में भेजा, उसके विषय में तुम कहते हो, ‘तुम परमेश्वर की निंदा कर रहे हो,’ क्योंकि मैंने कहा, ‘मैं परमेश्वर का पुत्र हूँ’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समर्पित किया”; या, “विशेष काम के लिए अलग ठहराया।”
    reason: ἡγίασεν के पवित्र करने, समर्पित करने और किसी उद्देश्य के लिए अलग ठहराने के निकटवर्ती अर्थों को दर्शाने के लिए।
lexical_decisions:
- source_word: ἡγίασεν
  choice: पवित्र ठहराया
  rationale: यह ἁγιάζω के पवित्र करने, समर्पित करने या किसी उद्देश्य के लिए अलग ठहराने के अर्थ को बनाए रखता है। ‘पवित्र ठहराया’ यहाँ नैतिक सुधार का अनावश्यक संकेत दिए बिना पिता द्वारा पुत्र को विशेष कार्य के लिए अलग किए जाने की धारणा व्यक्त करता है; अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: यह क्रिया के सीधे अर्थ और यूहन्ना में बार-बार आने वाली पिता द्वारा पुत्र को भेजे जाने की भाषा को सुरक्षित रखता है।
- source_word: κόσμον
  choice: संसार
  rationale: यूहन्ना में κόσμος के सामान्य और धर्मवैचारिक रूप से महत्त्वपूर्ण अर्थ के लिए ‘संसार’ स्वाभाविक मानक हिन्दी है।
- source_word: Βλασφημεῖς
  choice: तुम परमेश्वर की निंदा कर रहे हो
  rationale: वर्तमानकालीन आरोप को स्वाभाविक हिन्दी में प्रगतिशील रूप से व्यक्त किया गया है। प्रसंग में निंदा परमेश्वर के विरुद्ध मानी गई है, इसलिए ‘परमेश्वर की निंदा’ अर्थ को स्पष्ट करता है।
- source_word: Υἱὸς τοῦ θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: यह हिन्दी में स्वाभाविक रूप से मसीह-संबंधी पदवी का बल बनाए रखता है और यूनानी संबंधकारक रचना को सीधे व्यक्त करता है।
- source_word: ὃν ὁ πατὴρ
  choice: जिसे पिता ने
  rationale: यह संबंधवाचक रचना का स्पष्ट और स्वाभाविक हिन्दी रूप है; आगे ‘उसके विषय में’ जोड़कर यूनानी वाक्य-संबंध सुरक्षित रखा गया है।
- source_word: ὅτι ... ὅτι
  choice: तुम कहते हो … क्योंकि मैंने कहा
  rationale: पहला ὅτι कथन की विषयवस्तु को उद्धरण के द्वारा प्रस्तुत करता है, जबकि दूसरा आरोप का कारण बताता है; ‘क्योंकि’ इस तर्क-संबंध को सहज हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: पुत्र के संबंध में ἡγίασεν का अनुवाद
  choice: पवित्र ठहराया
  alternative: समर्पित किया; विशेष काम के लिए अलग ठहराया
  rationale: मुख्य पाठ मूल की पवित्रता-संबंधी शब्दावली और उसके धर्मवैचारिक तनाव को बनाए रखता है, पर यह नहीं कहता कि पुत्र पहले अपवित्र था या उसे नैतिक रूप से सुधारा गया। प्रसंग में कार्य के लिए समर्पण या अलग ठहराना निहित हो सकता है; इसे पादटिप्पणी में रखा गया है।
- issue: ‘परमेश्वर का पुत्र’ का मसीह-संबंधी बल
  choice: परमेश्वर का पुत्र
  alternative: परमेश्वर का बेटा
  rationale: ‘पुत्र’ आरोप और यीशु के उत्तर के गंभीर पदवीगत बल को सुरक्षित रखता है, जबकि ‘बेटा’ इस प्रसंग में अत्यधिक बोलचाल का और कम पदवीगत हो सकता है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। ‘पिता’, ‘संसार’, ‘परमेश्वर की निंदा’ और ‘परमेश्वर का पुत्र’ जैसे परिचित बाइबलीय पद रखे गए हैं। वाक्य की मूल प्रश्नात्मक संरचना और प्रत्यक्ष उद्धरण सुरक्षित हैं।
