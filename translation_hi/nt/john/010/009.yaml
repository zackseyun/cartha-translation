source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: hi
  text: मैं द्वार[a] हूँ। यदि कोई मेरे द्वारा प्रवेश करे, तो वह उद्धार पाएगा; वह भीतर आएगा और बाहर जाएगा और चरागाह पाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फाटक।” यूनानी शब्द का अर्थ द्वार या फाटक, दोनों हो सकता है; मुख्य पाठ में अधिक सीधा शब्द “द्वार” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: द्वार
  rationale: θύρα का मूल अर्थ प्रवेश का द्वार या फाटक है। “द्वार” यीशु के रूपक को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है; चरवाही के प्रसंग में “फाटक” भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: δι’ ἐμοῦ
  choice: मेरे द्वारा
  rationale: सम्बन्धकारक के साथ διά माध्यम को व्यक्त करता है। “मेरे द्वारा” स्वाभाविक हिन्दी में यीशु को प्रवेश का माध्यम बताता है।
- source_word: ἐάν τις εἰσέλθῃ
  choice: यदि कोई प्रवेश करे
  rationale: ἐάν और संभावनार्थक क्रिया का यह मेल सामान्य और खुली शर्त व्यक्त करता है। “यदि कोई प्रवेश करे” τις के अनिश्चित और सर्वसमावेशी दायरे को बनाए रखता है।
- source_word: σωθήσεται
  choice: उद्धार पाएगा
  rationale: σῴζω बचाने, छुड़ाने या उद्धार करने का अर्थ दे सकता है। यूहन्ना के धार्मिक संदर्भ और चरवाही की सुरक्षा—दोनों अर्थ-क्षेत्रों को बिना संकुचित किए “उद्धार पाएगा” सुरक्षित रखता है।
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: भीतर आएगा और बाहर जाएगा
  rationale: यह अनुवाद यूनानी की जोड़ीदार गतियों को स्वाभाविक हिन्दी में बनाए रखता है और सुरक्षा या स्वतंत्रता की संभावित व्यंजना की अतिरिक्त व्याख्या नहीं करता।
- source_word: νομὴν
  choice: चरागाह
  rationale: νομή पशुओं के चरने की जगह या चारा मिलने के स्थान को दर्शाता है। भेड़ों के तत्काल प्रसंग में “चरागाह” स्पष्ट और स्वाभाविक है।
- source_word: εὑρήσει
  choice: पाएगा
  rationale: εὑρίσκω का अर्थ “पाना/ढूँढ़ पाना” है। “चरागाह पाएगा” आधुनिक हिन्दी में सहज है और मूल कथन की सरलता बनाए रखता है।
theological_decisions:
- issue: चरवाही के प्रसंग में θύρα का रूपक
  choice: द्वार
  alternative: फाटक
  rationale: “द्वार” यूनानी शब्द का सीधा और परिचित रूपकीय अनुवाद है, जबकि भेड़शाला के संदर्भ में “फाटक” भी संभव है। मुख्य पाठ में “द्वार” और पादटिप्पणी में विकल्प रखने से किसी एक प्रसंगगत चित्र को अनावश्यक रूप से निर्णायक नहीं बनाया गया।
- issue: σωθήσεται के अर्थ का दायरा
  choice: उद्धार पाएगा
  alternative: बचाया जाएगा; छुड़ाया जाएगा
  rationale: मूल कथन को केवल शारीरिक सुरक्षा तक सीमित करना या उसे किसी संकीर्ण व्यवस्थित धर्मवैज्ञानिक सूत्र में विस्तृत करना उचित नहीं है। “उद्धार पाएगा” यूहन्ना के व्यापक धार्मिक अर्थ और चरवाही की सुरक्षा के चित्र—दोनों को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली रखी गई है। “उद्धार पाएगा” बाइबलीय धार्मिक स्तर को बनाए रखता है, जबकि वाक्य की बाकी संरचना सामान्य पाठक के लिए सीधी है।
