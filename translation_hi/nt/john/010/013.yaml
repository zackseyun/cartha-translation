  text: ⸀ὅτι μισθωτός ἐστιν καὶ οὐ μέλει αὐτῷ περὶ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: hi
  text: क्योंकि वह मज़दूरी पर रखा हुआ आदमी है और उसे भेड़ों की चिंता नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन में मज़दूर के भागने का कारण बताता है; आधुनिक हिन्दी में कारणसूचक अर्थ स्वाभाविक और स्पष्ट है।
- source_word: μισθωτός
  choice: मज़दूर
  rationale: यह शब्द ऐसे व्यक्ति को दर्शाता है जो मज़दूरी के लिए काम करता है, न कि भेड़ों के स्वामी के रूप में। चरवाही का प्रसंग आसपास के पदों से स्पष्ट है, इसलिए संक्षिप्त और स्वाभाविक ‘मज़दूर’ उपयुक्त है।
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: उसे … की चिंता नहीं है
  rationale: यह यूनानी निर्वैयक्तिक रचना किसी के प्रति चिंता या सरोकार न होने को व्यक्त करती है। यह हिन्दी प्रयोग स्वाभाविक है और कथन की नैतिक गंभीरता बनाए रखता है।
- source_word: τῶν προβάτων
  choice: भेड़ों
  rationale: मूल शब्द का सीधा अनुवाद चरवाही के बिंब को सुरक्षित रखता है; ‘झुंड’ की अपेक्षा यह यूनानी संज्ञा के अधिक निकट है।
theological_decisions:
- issue: अच्छे चरवाहे के विपरीत μισθωτός का चरित्र-चित्रण
  choice: 'कथन को सीधे नैतिक अर्थ में रखा गया है: मज़दूर को भेड़ों की चिंता नहीं है।'
  alternative: मज़दूर को किसी विशेष वर्ग के झूठे अगुवों का संकेत मानना, या उसके रवैये को केवल पेशेवर दूरी के रूप में नरम करना।
  rationale: पद स्वयं उसके भागने का कारण उसकी मज़दूरी वाली स्थिति और भेड़ों के प्रति चिंता के अभाव को बताता है। अनुवाद इस विरोध को बनाए रखता है, पर उसकी ऐसी विशिष्ट पहचान नहीं ठहराता जिसे यह पद स्पष्ट रूप से नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में स्वाभाविक। ‘मज़दूर’ वर्तमान हिन्दी में प्रचलित है और आसपास के चरवाही-संदर्भ में अर्थ स्पष्ट रखता है।
