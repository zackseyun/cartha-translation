- issue: यीशु के उद्धरण में ‘ईश्वर’ का आशय
  choice: मुख्य पाठ में उद्धृत पद ‘ईश्वर’ को बनाए रखा गया है और उसका संदर्भ मानव न्यायियों या दिव्य प्राणियों के रूप में तय नहीं किया गया।
  alternative: न्यायी; दिव्य जन
  rationale: यीशु का तर्क भजन 82:6 के वास्तविक शब्द पर निर्भर है; किसी एक संदर्भगत पहचान को मुख्य पाठ में रखना अनुवाद से आगे बढ़कर व्याख्या करना होगा।
- issue: ‘पवित्रशास्त्र को निरस्त नहीं किया जा सकता’ का बल
  choice: अमान्य या निष्प्रभावी न किए जा सकने के अर्थ में ‘निरस्त नहीं किया जा सकता’।
  alternative: पवित्रशास्त्र तोड़ा नहीं जा सकता; पवित्रशास्त्र को अलग नहीं रखा जा सकता
  rationale: यह वाक्य पवित्रशास्त्र के अधिकार को यीशु के तर्क का अटल आधार बताता है; ‘निरस्त’ यूनानी पद के वैधानिक और प्रामाणिक बल को आधुनिक हिन्दी में स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। डैश मूल वाक्य की बीच में आई अधिकार-संबंधी टिप्पणी को दर्शाते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
