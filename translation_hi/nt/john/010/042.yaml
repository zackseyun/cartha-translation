translation:
  language: hi
  text: और वहाँ बहुतों ने उस पर विश्वास किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य समुच्चयबोधक अव्यय इस वाक्य को पिछले वर्णन से जोड़ता है; ‘और’ सीधा तथा न्यूनतम व्याख्यात्मक अनुवाद है।
- source_word: πολλοὶ
  choice: बहुतों ने
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त होकर बहुत-से लोगों को दर्शाता है। हिन्दी में विभक्ति सहित ‘बहुतों ने’ स्वाभाविक और संक्षिप्त है।
- source_word: ἐπίστευσαν
  choice: विश्वास किया
  rationale: यह πιστεύω का एओरिस्ट सक्रिय निर्देशार्थक रूप है और यहाँ विश्वास करने की घटना बताता है। ‘विश्वास किया’ सीधा अनुवाद है; ‘विश्वास करने लगे’ अनावश्यक आरंभसूचक भाव जोड़ सकता है।
- source_word: εἰς αὐτόν
  choice: उस पर
  rationale: πιστεύω εἰς की रचना व्यक्ति की ओर निर्देशित विश्वास या भरोसा व्यक्त करती है। आधुनिक मानक हिन्दी में ‘उस पर विश्वास किया’ स्वाभाविक है और मूल का संबंधपरक बल बनाए रखता है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: यह स्थानसूचक क्रियाविशेषण है। ‘वहाँ’ उस स्थान पर कथानक के बल को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: उद्धार-संबंधी प्रसंग में πιστεύω εἰς αὐτόν का अनुवाद
  choice: उस पर विश्वास किया
  alternative: उसमें विश्वास किया; उस पर अपना भरोसा रखा
  rationale: यूनानी रचना यीशु की ओर निर्देशित व्यक्तिगत विश्वास व्यक्त करती है। ‘उस पर विश्वास किया’ हिन्दी में सहज है और अधिक व्याख्यात्मक विस्तार जोड़े बिना धार्मिक आशय बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, सहज और गरिमापूर्ण कथात्मक शैली। सर्वनाम ‘उस’ निकटवर्ती संदर्भ में यीशु को सूचित करता है।
