lexical_decisions:
- source_word: παροιμίαν
  choice: दृष्टान्तपूर्ण बात
  rationale: यह यूनानी शब्द किसी कहावत, सांकेतिक उक्ति या दृष्टान्तमय कथन के लिए व्यापक रूप से प्रयुक्त हो सकता है। यहाँ यीशु की चरवाहे-वाली बात के गैर-शाब्दिक स्वरूप को व्यक्त करने के लिए यह चयन स्वाभाविक है और इसे तकनीकी अर्थ में केवल ‘दृष्टान्त’ या संकीर्ण अर्थ में ‘कहावत’ नहीं बनाता।
- source_word: εἶπεν
  choice: कही
  rationale: λέγω का सामान्य अर्थ ‘कहना’ है; ‘बात कही’ आधुनिक हिन्दी में स्वाभाविक है और संबोधन की क्रिया को स्पष्ट रखता है।
- source_word: ἐκεῖνοι δὲ
  choice: पर वे
  rationale: ἐκεῖνοι यीशु और श्रोताओं के बीच विरोध दिखाता है तथा δέ यहाँ प्रतिकूलता सूचित करता है; ‘पर वे’ इसे संक्षेप और स्वाभाविक रूप में रखता है।
- source_word: οὐκ ἔγνωσαν
  choice: नहीं समझे
  rationale: सन्दर्भ में समस्या जानकारी की कमी नहीं, बल्कि यीशु के सांकेतिक कथन का अर्थ न समझना है।
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: कि वह उनसे क्या कह रहे थे
  rationale: यूनानी रचना कुछ असामान्य है और शाब्दिक रूप से ‘जो बातें वह उनसे बोल रहे थे, वे क्या थीं’ के निकट है। चुना हुआ हिन्दी रूप आशय को साफ़ रखता है, बिना ‘उनका मतलब क्या था’ जोड़कर व्याख्या को अत्यधिक स्पष्ट किए।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: हिन्दी में ‘किसी से बात कहना’ स्वाभाविक संबोधन-रचना है। पद के आरम्भ और अन्त में इसकी पुनरावृत्ति यूनानी संरचना के अनुरूप रखी गई है।
