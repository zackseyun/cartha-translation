  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: hi
  text: जैसे पिता मुझे जानते हैं और मैं पिता को जानता हूँ, और मैं भेड़ों के लिए[b] अपना जीवन[a] देता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने प्राण।” इस आत्म-बलिदान के प्रसंग में आशय “अपना जीवन” है।
    reason: lexical_alternative
  - marker: b
    text: या, “भेड़ों की ओर से।” यूनानी संबंधबोधक शब्द में किसी के हित में, उसकी ओर से, अथवा बलिदानी अर्थ में कार्य करने का भाव हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: जैसे
  rationale: यह पिछले कथन से तुलना को जोड़ता है और हिन्दी में स्वाभाविक रूप से उसके बल को बनाए रखता है।
- source_word: γινώσκει / γινώσκω
  choice: जानता है / जानता हूँ
  rationale: ‘जानना’ पिता और पुत्र के पारस्परिक, संबंधपरक ज्ञान को बिना अतिव्याख्या के व्यक्त करता है।
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: पिता
  rationale: यूनानी में अधिकारवाचक ‘मेरा’ नहीं है; ‘पिता’ यूहन्ना की शब्दावली और दोनों उपवाक्यों की समानांतरता बनाए रखता है।
- source_word: κἀγὼ
  choice: और मैं
  rationale: καί और ἐγώ के संयुक्त रूप की समन्वयी तथा संतुलित संरचना सुरक्षित रहती है।
- source_word: ψυχήν μου
  choice: अपना जीवन
  rationale: आत्म-बलिदान के इस प्रसंग में ψυχή का अर्थ व्यक्ति का जीवन है, केवल अभौतिक ‘प्राण’ या ‘आत्मा’ नहीं।
- source_word: τίθημι
  choice: दे देता हूँ
  rationale: हिन्दी में ‘अपना जीवन दे देना’ स्वैच्छिक आत्म-समर्पण और मृत्यु के आशय को स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक ‘रख देना’ यहाँ अप्राकृतिक होगा।
- source_word: ὑπὲρ
  choice: के लिए
  rationale: यह लाभार्थक और बलिदानी अर्थ की व्यापकता बनाए रखता है, पर इसे केवल एक तकनीकी धर्मवैज्ञानिक सूत्र तक सीमित नहीं करता।
- source_word: τῶν προβάτων
  choice: भेड़ों
  rationale: ‘भेड़ें’ चरवाहे के केंद्रीय रूपक को बनाए रखता है; ‘झुंड’ मूल संज्ञा को सामान्यीकृत कर देता।
theological_decisions:
- issue: यीशु के आत्म-समर्पण में ὑπὲρ का बल
  choice: के लिए
  alternative: की ओर से / के स्थान पर
  rationale: ‘के लिए’ भेड़ों के हित में और बलिदानी अर्थ को खुला रखता है, पर यूनानी से अधिक स्पष्ट प्रतिस्थापनात्मक अर्थ आरोपित नहीं करता।
- issue: इस प्रसंग में ψυχή का अर्थ
  choice: जीवन
  alternative: प्राण / आत्मा
  rationale: अच्छे चरवाहे की स्वैच्छिक मृत्यु के प्रसंग में आशय यीशु द्वारा अपना जीवन देने से है; ‘आत्मा’ भ्रामक मानवशास्त्रीय अर्थ पैदा कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज पाठ। ‘जानता’ की पुनरावृत्ति मूल की समानांतर संरचना को बनाए रखती है। दोनों पादटिप्पणी-चिह्न संबंधित वाक्यांश के बाद मुख्य पाठ में दिए गए हैं।
