lexical_decisions:
- source_word: ποιμήν
  choice: चरवाहा
  rationale: यह सामान्य और संदर्भानुकूल अर्थ है तथा भेड़ों और चरवाहे के रूपक को बनाए रखता है; ‘पादरी’ कहने से बाद की कलीसियाई पदवी का भाव आ सकता है।
- source_word: καλός
  choice: अच्छा
  rationale: यहाँ यह नैतिक उत्कृष्टता, उपयुक्तता और आदर्श चरवाहे का भाव देता है। ‘अच्छा’ स्वाभाविक हिन्दी है और मूल अर्थ की व्यापकता बनाए रखता है।
- source_word: γινώσκω / γινώσκουσί
  choice: जानता हूँ / जानते हैं
  rationale: यह परस्पर व्यक्तिगत और संबंधपरक जान-पहचान व्यक्त करता है, केवल पहचान लेने की क्षणिक क्रिया नहीं।
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: अपनों को / अपने
  rationale: नपुंसकलिंग बहुवचन विशेषण का शाब्दिक भाव ‘जो मेरे अपने हैं’ है। हिन्दी में ‘अपने’ संबंध और अपनापन व्यक्त करता है तथा मूल की तरह ‘भेड़ें’ शब्द को स्पष्ट रूप से नहीं जोड़ता।
- source_word: ἐγώ εἰμι
  choice: मैं ... हूँ
  rationale: यह स्पष्ट वर्तमानकालीन आत्म-परिचय को स्वाभाविक हिन्दी वाक्य-विन्यास में रखता है।
- source_word: καί
  choice: और
  rationale: यह दोनों परस्पर कथनों को बिना अतिरिक्त बल जोड़े सरलता से जोड़ता है।
theological_decisions:
- issue: यीशु और उनके लोगों के परस्पर संबंध को बाद की धर्मवैचारिक शब्दावली जोड़े बिना व्यक्त करना
  choice: अपनों को / अपने
  alternative: अपनी भेड़ों को / मेरी भेड़ें
  rationale: मूल यूनानी दोनों उपवाक्यों में संज्ञा ‘भेड़ें’ को नहीं दोहराता, बल्कि ‘मेरे अपने’ कहता है। ‘अपने’ पारस्परिक ज्ञान और संबंधगत अपनत्व को सुरक्षित रखता है, जबकि संदर्भगत विकल्प को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज पाठ। ‘अपनों’ और ‘अपने’ द्वारा यूनानी की संक्षिप्त पुनरावृत्ति तथा संबंधगत भाव बनाए रखा गया है।
