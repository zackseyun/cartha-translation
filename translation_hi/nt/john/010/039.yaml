    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: कोशिश कर रहे थे
  rationale: अपूर्ण भूतकाल चल रहे या प्रयास किए जा रहे काम को दर्शाता है; यह प्रयोग उस पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन के परिणामस्वरूप आगे बढ़ते घटनाक्रम का संबंध स्पष्ट करता है।
- source_word: πάλιν
  choice: फिर
  rationale: यह विरोधियों के दोबारा किए गए प्रयास को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: πιάσαι
  choice: पकड़ने
  rationale: यह शारीरिक रूप से काबू में करने के शत्रुतापूर्ण प्रयास को व्यक्त करता है, पर मुख्य पाठ में औपचारिक कानूनी अर्थ वाला ‘गिरफ़्तार’ नहीं जोड़ता।
- source_word: ἐξῆλθεν
  choice: निकल गया
  rationale: मूल क्रिया का सामान्य अर्थ ‘बाहर निकलना’ है। हिन्दी में ‘निकल गया’ प्रसंगानुसार बच जाने का संकेत देता है, लेकिन स्पष्ट रूप से ‘बच निकला’ कहकर अर्थ को अनावश्यक रूप से अधिक निश्चित नहीं करता।
- source_word: ἐκ τῆς χειρὸς αὐτῶν
  choice: उनके हाथ से
  rationale: यूनानी में ‘हाथ’ एकवचन है और यह अधिकार, नियंत्रण या पकड़ का मुहावरा है। यही मुहावरा हिन्दी में भी सहज और बोधगम्य है।
theological_decisions:
- issue: क्या यीशु के छूट जाने को स्पष्ट रूप से ‘बच निकला’ कहा जाए या मूल कथन की अभिव्यक्ति बनाए रखी जाए
  choice: ‘उनके हाथ से निकल गया’
  alternative: ‘उनकी पकड़ से बच निकला’
  rationale: घटना से स्पष्ट है कि वे उसे पकड़ नहीं सके, पर यूनानी पाठ बच निकलने की विशिष्ट क्रिया के बजाय ‘उनके हाथ से निकल गया’ कहता है। चुना हुआ पाठ परिणाम को स्पष्ट रखते हुए मूल अभिव्यक्ति और उसकी सूक्ष्मता बचाता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘पकड़ने की कोशिश कर रहे थे’ अपूर्ण क्रिया-पक्ष को स्वाभाविक ढंग से व्यक्त करता है, और ‘हाथ से निकल गया’ मूल मुहावरे को हिन्दी में बनाए रखता है।
